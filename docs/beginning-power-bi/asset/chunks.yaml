  trans: "好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将英文文本翻译成中文。\n\n\n在进行动手实验之前，我想先给你一些在\
    \ Power Pivot 中创建这些计算的小提示。为计算列输入公式时，请右键点击模型生成器数据视图窗口表格中的某一列。在上下文菜单中，选择 `Insert\
    \ Column`（插入列）（参见图 4-5）。\n\n![9781430264453_Fig04-05.jpg](img/9781430264453_Fig04-05.jpg)\n\
    \n图 4-5。添加计算列\n\n重命名该列，然后在公式编辑栏中输入公式。公式以等号（`=`）开头，表名包含在单引号（`''`）中，如果表名不包含空格，则单引号是可选的。表列包含在方括号（`[]`）中。公式编辑栏提供了自动完成功能，你应该善加利用（参见图\
    \ 4-6）。从下拉列表中选择函数、表或列，然后按 Tab 键将其插入到公式中。如果你没有看到自动填充下拉列表，则说明你的公式可能存在错误。\n\n![9781430264453_Fig04-06.jpg](img/9781430264453_Fig04-06.jpg)\n\
    \n图 4-6。创建计算时使用自动完成功能\n\n公式编辑栏旁有三个按钮：`X` 用于取消所做的更改；复选标记用于提交更改；函数符号用于启动 `Insert\
    \ Function`（插入函数）窗口（参见图 4-7）。你可以浏览各种函数，并获取有关函数所需参数的信息。\n\n![9781430264453_Fig04-07.jpg](img/9781430264453_Fig04-07.jpg)\n\
    \n图 4-7。使用函数助手\n\n当你错误地创建计算时，可能会收到一个错误指示器。你应该点击错误下拉菜单并选择 `Show Error`（显示错误）（参见图\
    \ 4-8）。这将显示一条错误消息（参见图 4-9），其中会提供有用的信息，可以帮助你修复错误。\n\n![9781430264453_Fig04-08.jpg](img/9781430264453_Fig04-08.jpg)\n\
    \n图 4-8。显示错误信息\n\n![9781430264453_Fig04-09.jpg](img/9781430264453_Fig04-09.jpg)\n\
    \n图 4-9。查看错误消息\n\n现在你已经了解了如何使用 DAX 创建计算，并熟悉了可用的 DAX 函数，是时候获取一些动手经验了。\n\n## 动手实验——在\
    \ Power Pivot 中创建计算列\n\n在以下实验中，你将：\n\n-   创建计算列。\n-   使用 DAX 文本函数。\n-   在 DAX\
    \ 表达式中使用日期函数。\n-   在表达式中使用来自相关表的数据。\n-   在表达式中实现条件逻辑。\n\n1.  在 `Lab Starters`\
    \ 文件夹中，打开 `LabChap4Starter.xlsx` 文件。该文件包含一个由销售数据、产品数据和商店数据组成的数据模型。\n2.  使用关系图视图在\
    \ Power Pivot 窗口中查看模型（参见图 4-10）。\n\n![9781430264453_Fig04-10.jpg](img/9781430264453_Fig04-10.jpg)\n\
    \n图 4-10。商店销售数据模型\n\n3.  切换到 Power Pivot 窗口中的数据视图，并选择 `Sales` 表。\n4.  在 `SalesAmount`\
    \ 列之后，点击 `Add Column`（添加列）。在表格上方的公式栏中，输入以下公式以计算利润：\n\n    ```\n    =[SalesAmount]\
    \ - [TotalCost]\n    ```\n\n5.  右键点击新列并将其重命名为 `Margin`。\n6.  重复此过程以创建 `MarginPercent`\
    \ 列，并使用以下公式：\n\n    ```\n    =[Margin]/[SalesAmount]\n    ```\n\n7.  在数据视图窗口中，选择\
    \ `Date` 表。\n8.  使用日期函数创建一个 `Year`（年）、`Quarter`（季度）、`Month`（月份）、`Month Number`（月份编号）和\
    \ `Weekday`（星期）列。\n9.  使用 `Year`、`Quarter` 和 `Month` 列，在 `Date` 表中创建一个 `Calendar`（日历）层次结构。\n\
    10. 在数据视图窗口中，选择 `Product` 表。\n11. 插入一个 `Weight Label`（重量标签）列，并使用以下公式：\n\n    ```\n\
    \    =if(ISBLANK([Weight]),BLANK(), [Weight] & \" \" & [WeightUnitMeasureID])\n\
    \    ```\n\n12. 在 `ProductSubcategoryKey` 旁边，使用相关函数创建一个 `ProductCategory`（产品类别）列：\n\
    \n    ```\n    =RELATED('ProductCategory'[ProductCategoryName])\n    ```\n\n13.\
    \ 使用相关函数，创建一个 `ProductSubcategory`（产品子类别）列。\n14. 从客户端工具中隐藏 `ProductCategory` 和\
    \ `ProductSubcategory` 表。\n15. 切换到 `Store` 表并创建一个 `Years Open`（开店年数）列，使用以下公式：\n\
    \n    ```\n    =TRUNC(YEARFRAC([OpenDate],\n           If(ISBLANK([CloseDate]),TODAY(),[CloseDate]))\n\
    \              ,0)\n    ```\n\n16. 使用以下公式创建一个 `LifetimeSales`（总销售额）列：\n\n    ```\n\
    \    =SUMX(RELATEDTABLE(Sales),Sales[SalesAmount])\n    ```\n\n17. 保存并关闭 Excel\
    \ 文件。\n\n## 总结\n\n本章向你介绍了 DAX 语言以及可用于创建计算的内置函数。至此，你应该能够熟练地创建计算列并使用 DAX 函数。我强烈建议你熟悉各种可用的函数以及如何在分析中使用它们。在下一章中，你将继续使用\
    \ DAX 来创建度量值。度量值是在 Power Pivot 中构建模型最重要的部分之一；度量值是你查看数据的根本原因。你想要回答诸如销售情况如何或什么因素影响能源消耗等问题。除了创建度量值，你还将看到筛选上下文如何影响度量值。为了充分利用\
    \ Power Pivot，筛选上下文是你需要掌握的最重要的概念之一。\n\n## 第 5 章\n\n![image](img/frontdot.jpg)\n\
    \n# 使用 DAX 创建度量值\n\n使用 DAX 创建度量值是构建可靠数据模型所必需的最重要的技能。本章涵盖了在数据模型中创建度量值时使用的常见函数。它还涵盖了数据上下文这一重要主题，以及如何在创建度量值时更改或覆盖上下文。\n\
    \n完成本章后，你将能够：\n\n-   理解度量值与属性之间的区别。\n-   理解上下文如何影响度量。\n-   创建常见的聚合。\n-   知道如何以及何时更改筛选上下文。\n\
    -   创建 KPI。\n\n## 度量值与属性\n\n如果你查看数据仓库的典型星型模型，你会看到一个事实表被若干个维度表包围。例如，图 5-1 显示了一个被若干个维度表包围的财务事实表。\n\
    \n![9781430264453_Fig05-01.jpg](img/9781430264453_Fig05-01.jpg)\n\n图 5-1。典型的星型模式\n\
    \n请记住，事实表包含你需要聚合的数字；例如，在财务表中，你有金额，这是一个需要被聚合的货币值。在销售事实表中，你可能有销售金额和商品数量。在人力资源系统中，你可能会有工作小时数。维度表包含你用来分类和汇总度量值的属性。例如，财务度量值被分类为利润、亏损和预测。你希望将这些值汇总到部门和组织级别，并且希望在月份和年份之间比较这些值。\n"
- fmt: 'When you start slicing and dicing the data in a pivot table, the attributes
    become the row and column headers whereas the measures are the values in the cells.
    Attributes are also commonly used as filters either in a filter drop-down or in
    a slicer. [Figure 5-2](#9781430264453_Ch05.xhtml#Fig2) shows a pivot table containing
    research and development spending, actual and budgeted, for the months in the
    fiscal year 2006.


    ![9781430264453_Fig05-02.jpg](Images/9781430264453_Fig05-02.jpg)


    [Figure 5-2](#9781430264453_Ch05.xhtml#_Fig2). Analyzing data in a pivot table


    If you look at the filtering for each cell, you should realize they are all filtered
    a little differently. The two measures indicated by the green arrows differ by
    month, whereas the measures indicated by the red arrows differ by actual versus
    budgeted amount. As you change the fiscal year, department, or organization, the
    values for the measures must be recalculated because the query context has changed.


    In the following section you will see how you can create some common aggregation
    measures in your Power Pivot model.


    ## Creating Common Aggregates


    It is very easy to create common aggregates such as sum, count, or average in
    Power Pivot. First you need to determine which table you want to associate the
    measure with. If you follow the star schema model, this will most likely be the
    fact table, but it does not have to be. In the data view mode of the Power Pivot
    model designer, select the tab of the table that is associated with the measure.
    The area below the data grid is where you place the measure formulas (see [Figure
    5-3](#9781430264453_Ch05.xhtml#Fig3)). If you do not see a measures grid, you
    may need to unhide it by selecting the Calculation Area button on the Home tab
    (see [Figure 5-4](#9781430264453_Ch05.xhtml#Fig4)).


    ![9781430264453_Fig05-03.jpg](Images/9781430264453_Fig05-03.jpg)


    [Figure 5-3](#9781430264453_Ch05.xhtml#_Fig3). The measure grid for the Finance
    table


    ![9781430264453_Fig05-04.jpg](Images/9781430264453_Fig05-04.jpg)


    [Figure 5-4](#9781430264453_Ch05.xhtml#_Fig4). Showing or hiding the measure grid


    The easiest way to create an aggregate is to select the column you want to aggregate
    and then select the AutoSum drop-down and choose the aggregate you need (see [Figure
    5-5](#9781430264453_Ch05.xhtml#Fig5)).


    ![9781430264453_Fig05-05.jpg](Images/9781430264453_Fig05-05.jpg)


    [Figure 5-5](#9781430264453_Ch05.xhtml#_Fig5). Using the auto sum for common aggregates


    The aggregate is placed in the measure grid below the column (see [Figure 5-6](#9781430264453_Ch05.xhtml#Fig6)).
    If you select the cell you will see the formula in the formula bar (see [Figure
    5-7](#9781430264453_Ch05.xhtml#Fig7)). The name of the measure is placed before
    the formula followed by a colon and equal sign (`:=`). Once you add the measure
    you can rename it by editing it in the formula editor.


    ![9781430264453_Fig05-06.jpg](Images/9781430264453_Fig05-06.jpg)


    [Figure 5-6](#9781430264453_Ch05.xhtml#_Fig6). The resulting measure below the
    column


    ![9781430264453_Fig05-07.jpg](Images/9781430264453_Fig05-07.jpg)


    [Figure 5-7](#9781430264453_Ch05.xhtml#_Fig7). Editing the measure formula


    The other way to create an aggregate measure is to select any cell in the measures
    grid and enter the formula in the formula bar. Although you can define a measure
    in any cell in the measures grid, it is a good idea to organize the measures in
    some fashion. I generally try to organize the measures along the left side of
    the grid so they are not spread out all over the grid (see [Figure 5-8](#9781430264453_Ch05.xhtml#Fig8)).
    You can easily move a definition from one cell to another using cut and paste.


    ![9781430264453_Fig05-08.jpg](Images/9781430264453_Fig05-08.jpg)


    [Figure 5-8](#9781430264453_Ch05.xhtml#_Fig8). Organizing your measures


    You may have noticed that the aggregate functions such as `SUM`, `AVE`, `MIN`,
    and `MAX` have corresponding `SUMX`, `AVEX`, `MINX`, and `MAXX` functions. The
    X functions are used when you are evaluating an expression for each row in the
    table and not just a single column. As an example, the `SUMX` function is defined
    as follows:


    ```

    SUMX(<table>, <expression>)

    ```


    where the table is the table containing the rows to be evaluated and the expression
    is what will be evaluated for each row.


    As an example, say you have a sales table that contains a Cost and a Gross column.
    To figure out the total net sales amount, you can take the gross amount minus
    the cost and sum the result for each row as in the following formula:


    ```

    SumNet:=SUMX(Sales,[Gross]-[Cost])

    ```


    Another way to get the same result is to create a net calculated column first
    and then use the `SUM` function on the net column. The difference is that calculated
    columns are pre-calculated and stored in the model. Measures are calculated when
    filters are applied to them in the pivot table and have to be recalculated every
    time the data context changes. So the more calculated columns you have the greater
    the size of your Power Pivot file. The more measures you have and the greater
    their complexity increases the more memory is necessary when you are working with
    the file.


    Understanding how data context changes the measurement value is very important
    when creating measures and it is explored in the next section.


    ## Mastering Data Context


    Context plays an important role when creating measures in the Power Pivot model.
    Unlike static reports, Power Pivot models are designed for dynamic analysis by
    the client. When the user changes filters, drills down, and changes column and
    row headers in a pivot table, the context changes and the values are recalculated.
    Knowing how the context changes and how it affects the results is very essential
    to being able to build and troubleshoot formulas.


    There are three types of context you need to consider: row, query, and filter.
    The row context comes into play when you are creating a calculated column. It
    includes the values from all the other columns of the current row as well as the
    values of any table related to the row. If you create a calculated column, say
    margin,


    ```

    =[Gross] - [Cost]

    ```


    DAX uses the row context to look up the values from the same row to complete the
    calculation. If you create a calculated column such as lifetime sales


    ```

    =SUMX(RELATEDTABLE(Sales),[SalesAmount])

    ```


    DAX automatically looks up the related values using the row context of the current
    row. The row context is set once the model is loaded and will not change until
    new data is loaded. This is why calculated columns are pre-calculated and only
    need to be recalculated when data is refreshed.


    Query context is the filtering applied to a cell in the pivot table. When you
    drop a measure into a pivot table, the DAX query engine examines the row and column
    headers and any filters applied. Each cell has a different query context applied
    to it (see [Figure 5-9](#9781430264453_Ch05.xhtml#Fig9)) and returns the value
    associated with the context. Since you can change the query context on the fly
    by changing row or column headers and filter values, the cell values are calculated
    dynamically and the values are not held in the Power Pivot model.


    ![9781430264453_Fig05-09.jpg](Images/9781430264453_Fig05-09.jpg)


    [Figure 5-9](#9781430264453_Ch05.xhtml#_Fig9). The query context of a measure


    Filter context is added to the measure using filter constraints as part of the
    formula. The filter context is applied in addition to the row and query contexts.
    You can alter the context by adding to it, replacing it, or selectively changing
    it using filter expressions. For example, if you used the following formula to
    calculate sales,


    ```

    AllStoreSales:=CALCULATE(SUM(Sales[SalesAmount]),ALL(Store[StoreType]))

    ```


    the filter context would clear any `StoreType` filter implemented by the query
    context.'
