    # 用例 3：传感器分析


    在此场景中，你为一家使用传感器监控设备的电力公司工作。传感器监控各种电力读数，包括电力中断和电压尖峰。当传感器检测到问题时，会触发一个被记录下来的警报信号。你需要创建一个地图，使分析师能够查看并比较一段时间内的电力中断和电压尖峰情况。


    ## 加载数据


    所需数据分布在几个文本文件中。在将数据加载到 Power Pivot 模型之前，你需要清理和处理数据。因此，Power Query 是你将用来加载数据的工具。


    在`Chapter14Labs`文件夹中找到名为`UseCase3`的文件夹。该文件夹包含四个文件，其中包含传感器数据以及完成分析所需的相关数据。创建一个名为`PowerAnalysis.xlsx`的新
    Excel 工作簿。使用 Power Query，连接到`UseCase3`文件夹中的`Alarms.csv`文件。你应该拥有以下列：`PREMISE_NUMBER`、`METER_NUMBER`、`OP_CENTER`、`Type`和`DateKey`。将查询重命名为**Alarms**，取消选中加载设置，然后保存查询。添加第二个查询**AlarmTypes**，从`AlarmType.txt`文件中获取警报类型数据。你现在可以删除`SHORT_CODE`列并保存查询。


    重新打开`Alarms`查询，并使用适当的键将其与`AlarmTypes`查询合并（参见图 14-12）。


    ![9781430264453_Fig14-12.jpg](img/9781430264453_Fig14-12.jpg)


    图 14-12。将`AlarmType`查询与`Alarms`查询合并

