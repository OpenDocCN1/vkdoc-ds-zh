    \    ```\n\n21.  In order to calculate the inventory over time, you need to find\
    \ the last non-blank entry for the time period. The following formula will give\
    \ you the value. The date range initial value is blank (prior to the first date)\
    \ and final date is the maximum date. You will use this formula as part of the\
    \ formula in step 22.\n\n```\n    LNB Date:=LASTNONBLANK(\n    DATESBETWEEN('Date'[Datekey],BLANK(),MAX('Date'[Datekey]))\n\
    \    ,[Inventory Count])\n    ```\n\n22.  Using the last non-blank filter and\
    \ the `CALCULATE` function you can calculate the last non-blank quantity for a\
    \ product. Add the following measure to the Inventory table.\n\n```\n    LNB Quantity:=CALCULATE([Inventory\
    \ Count],\n    LASTNONBLANK(DATESBETWEEN('Date'[Datekey],\n    BLANK(),MAX('Date'[Datekey])),[Inventory\
    \ Count]))\n    ```\n\n23.  You can now add up the product quantity for products\
    \ chosen. Add the following measure to the Inventory table.\n\n```\n    Product\
    \ Quantity:=SUMX(\n    VALUES(Product[ProductKey]),[LNB Quantity])\n    ```\n\n\
    24.  The final step is to add up the inventory across all the stores selected\
    \ using the following measure.\n\n```\n    Inventory Level:=SUMX(Values(Store[StoreKey]),[Product\
    \ Quantity])\n    ```\n\n25.  To test the measure, add a new sheet in Excel and\
    \ create a pivot table like the one in [Figure 6-21](#9781430264453_Ch06.xhtml#Fig21).\n\
    \n![9781430264453_Fig06-21.jpg](Images/9781430264453_Fig06-21.jpg)\n\n[Figure\
    \ 6-21](#9781430264453_Ch06.xhtml#_Fig21). Testing the inventory measure\n\nSummary\n\
    \nThis chapter provided you with the basics you need to successfully incorporate\
    \ date-time based analysis using Power Pivot and DAX. You should now understand\
    \ how to shift the date context to compare measures based on parallel periods.\
    \ You should also feel comfortable aggregating measures using the period-to-date\
    \ DAX formulas. Combine the concepts you learned in [Chapter 5](../Text/9781430264453_Ch05.xhtml)\
    \ and this chapter; when you do, you should start to recognize patterns in your\
    \ analysis. Based on these patterns you can identify the DAX template you need\
    \ to solve the problem. Because not all of you are familiar with creating pivot\
    \ tables and pivot charts in Excel, the next chapter shows you the basics of how\
    \ to create dashboards in Excel based on your model. If you are familiar with\
    \ these concepts, you may want to skip [Chapter 7](../Text/9781430264453_Ch07.xhtml).\n\
    \nCHAPTER 7\n\n![image](Images/frontdot.jpg)\n\nData Analysis with Pivot Tables\
    \ and Charts\n\nOnce you have the data model created in Power Pivot, you need\
    \ to create an interface for users to interact with the data model and perform\
    \ data analysis using the model. You can use several programs to interface with\
    \ the model depending on the type of analysis taking place; these include Power\
    \ View, Power Map, Performance Point, and Reporting Services. Although all these\
    \ tools are viable clients to use, one of the best client tools is Excel itself.\
    \ Excel is a feature-rich environment for creating dashboards using pivot tables\
    \ and pivot charts. Furthermore, it is very easy to share Excel files with colleagues\
    \ or host the Excel workbook on SharePoint for increased performance and security.\
    \ This chapter covers the basics of building an interface for analyzing the data\
    \ contained in a Power Pivot model using pivot tables and pivot charts in Excel.\n\
    \nAfter completing this chapter you will be able to\n\n*   Use pivot tables to\
    \ explore the data.\n*   Filter data using slicers.\n*   Add visualizations to\
    \ a pivot table.\n*   Use pivot charts to explore trends.\n*   Use multiple charts\
    \ and tables linked together.\n*   Use cube functions to query the data model\n\
    \n![Image](Images/sq.jpg) **Note**  This chapter contains references to color\
    \ figures. If you are reading this book in print, or in a black-and-white eBook\
    \ edition, you can find copies of color figures in the Source Code/Downloads package\
    \ for the book at `http://www.apress.com/9781430264453`.\n\nPivot Table Fundamentals\n\
    \nOne of the most widely used tools for analyzing data is the pivot table. The\
    \ pivot table allows you to easily detect patterns and relationships from the\
    \ data. For example, you can determine what products sell better during certain\
    \ times during the year. Or you can see how marketing campaigns affect the sales\
    \ of various products. [Figure 7-1](#9781430264453_Ch07.xhtml#Fig1) shows the\
    \ various areas of a pivot table.\n\nThe row and column fields contain the attributes\
    \ that you are interested in using to summarize the data. For example, the pivot\
    \ table in [Figure 7-1](#9781430264453_Ch07.xhtml#Fig1) is aggregating the values\
    \ by product categories and years. The filter is used to filter the values in\
    \ the pivot table by some attribute. The filter in [Figure 7-1](#9781430264453_Ch07.xhtml#Fig1)\
    \ is limiting the results to the first quarter of each year. The slicer works\
    \ the same as the filter in this case, limiting the values to large resellers.\
    \ Slicers have the added advantage of filtering multiple pivot tables and pivot\
    \ charts.\n\n![9781430264453_Fig07-01.jpg](Images/9781430264453_Fig07-01.jpg)\n\
    \n[Figure 7-1](#9781430264453_Ch07.xhtml#_Fig1). The parts of a pivot table\n\n\
    To construct the pivot table, drag and drop the fields from the Field List to\
    \ the drop areas below the Field List, as shown in [Figure 7-2](#9781430264453_Ch07.xhtml#Fig2).\
    \ If you just click on the check box to select the fields, it will place text\
    \ fields in the rows and any numeric values in the Values area. This can become\
    \ quite annoying because it will place a field like Years in the Values area and\
    \ treat it as a set of values to be summed. (In [Chapter 8](../Text/9781430264453_Ch08.xhtml),\
    \ I will show you how you can avoid this.)\n\n![9781430264453_Fig07-02.jpg](Images/9781430264453_Fig07-02.jpg)\n\
    \n[Figure 7-2](#9781430264453_Ch07.xhtml#_Fig2). Adding fields to the pivot table\n\
    \nIn order to add slicers to filter the pivot table, you need to go to the Insert\
    \ tab in Excel and select the Slicer button. In the next section, you will look\
    \ at adding slicers and controlling multiple pivot tables with the same slicer.\n\
    \nSlicing the Data\n\nTo add a slicer to filter a pivot table, click on the pivot\
    \ table, and on the Insert tab, select the Slicer button. You should see a pick\
    \ list containing the fields in the Power Pivot data model (see [Figure 7-3](#9781430264453_Ch07.xhtml#Fig3)).\n\
    \n![9781430264453_Fig07-03.jpg](Images/9781430264453_Fig07-03.jpg)\n\n[Figure\
    \ 7-3](#9781430264453_Ch07.xhtml#_Fig3). Selecting the slicer field"
  trans: "\n17.  Next, create a sales growth rate measure using the previous month's\
    \ sales and the current month's sales. Format the measure as a percentage. Note\
    \ that you need to check to ensure there are sales for the previous month. If\
    \ not, return a blank value.\n\n```\nMonthly Sales Growth:=if(NOT(ISBLANK([Prev\
    \ Month Sales])), \n    ([Sum of Sales] - [Prev Month Sales])/[Prev Month Sales],BLANK())\n\
    ```\n\n18.  Create a PivotTable on Sheet2 in Excel, as shown in Figure 6-20, to\
    \ test your results.\n\n![9781430264453_Fig06-20.jpg](img/9781430264453_Fig06-20.jpg)\n\
    \nFigure 6-20. Testing the monthly sales growth rate measure\n\n19.  To study\
    \ semi-additive measures, you need to create a PivotTable that displays inventory\
    \ quantities. First, create a relationship between the `Inventory` table and the\
    \ `Date` table.\n20.  Add the following inventory quantity measure to the `Inventory`\
    \ table:\n\n```\nInventory Count:=SUM([OnHandQuantity])\n```\n\n21.  To calculate\
    \ inventory over a period of time, you need to find the last non-empty entry within\
    \ that time period. The following formula will provide that value. The date range\
    \ starts as blank (earlier than the first date), and the final date is the maximum\
    \ date. You will use this as part of a formula in step 22.\n\n```\nLNB Date:=LASTNONBLANK(\n\
    \    DATESBETWEEN('Date'[Datekey],BLANK(),MAX('Date'[Datekey]))\n    ,[Inventory\
    \ Count])\n```\n\n22.  Using the last non-blank filter and the `CALCULATE` function,\
    \ you can calculate the last non-blank quantity for a product. Add the following\
    \ measure to the `Inventory` table.\n\n```\nLNB Quantity:=CALCULATE([Inventory\
    \ Count],\n    LASTNONBLANK(DATESBETWEEN('Date'[Datekey],\n    BLANK(),MAX('Date'[Datekey])),[Inventory\
    \ Count]))\n```\n\n23.  Now, you can sum the quantity for the selected products.\
    \ Add the following measure to the `Inventory` table.\n\n```\nProduct Quantity:=SUMX(\n\
    \    VALUES(Product[ProductKey]),[LNB Quantity])\n```\n\n24.  The final step is\
    \ to sum the inventory across all selected stores using the following measure.\n\
    \n```\nInventory Level:=SUMX(Values(Store[StoreKey]),[Product Quantity])\n```\n\
    \n25.  To test the measure, add a new worksheet in Excel and create a PivotTable\
    \ as shown in Figure 6-21.\n\n![9781430264453_Fig06-21.jpg](img/9781430264453_Fig06-21.jpg)\n\
    \nFigure 6-21. Testing the inventory measure\n\n## Summary\n\nThis chapter provided\
    \ you with the foundational knowledge needed to successfully work with date and\
    \ time-based analysis using Power Pivot and DAX. You should now understand how\
    \ to shift date contexts to compare measures based on parallel periods. You should\
    \ also be comfortable using Period-to-Date DAX formulas to aggregate measures.\
    \ Combine the concepts you learned in Chapter 5 and this chapter; when you do,\
    \ you should begin to recognize patterns in your analysis. Based on these patterns,\
    \ you can identify the DAX templates needed to solve your problem. Because not\
    \ everyone is familiar with creating PivotTables and PivotCharts in Excel, the\
    \ next chapter will show you the basics of creating dashboards in Excel based\
    \ on your model. If you are familiar with these concepts, you can skip Chapter\
    \ 7.\n\n# Chapter 7\n\n![image](img/frontdot.jpg)\n\n## Data Analysis with PivotTables\
    \ and Charts\n\nOnce you have created your data model in Power Pivot, you need\
    \ to create an interface for users to interact with the data model and perform\
    \ data analysis using the model. Depending on the type of analysis being performed,\
    \ you can use several programs to interact with the model; these include Power\
    \ View, Power Map, Performance Point, and Reporting Services. While all of these\
    \ are viable clients, one of the best client tools is Excel itself. Excel is a\
    \ feature-rich environment well-suited for creating dashboards using PivotTables\
    \ and PivotCharts. Additionally, it is very easy to share Excel files on SharePoint\
    \ or host Excel workbooks to improve performance and security. This chapter covers\
    \ the basics of building an interface for analyzing data within a Power Pivot\
    \ model using PivotTables and PivotCharts in Excel.\n\nAfter completing this chapter,\
    \ you will be able to:\n\n*   Use PivotTables to explore data.\n*   Use slicers\
    \ to filter data.\n*   Add visualizations to PivotTables.\n*   Use PivotCharts\
    \ to explore trends.\n*   Use multiple linked charts and tables together.\n* \
    \  Query the data model using Cube Functions\n\n![Image](img/sq.jpg) **Note**\
    \ This chapter contains references to color images. If you are reading the print\
    \ version or a black-and-white electronic version of this book, you can find copies\
    \ of the color images in the source code/download package for this book at `http://www.apress.com/9781430264453`.\n\
    \n## PivotTable Basics\n\nOne of the most widely used tools for data analysis\
    \ is the PivotTable. PivotTables allow you to easily discover patterns and relationships\
    \ from your data. For example, you can determine which products sell better at\
    \ a specific time of year. Or you can see how marketing campaigns impacted sales\
    \ of various products. Figure 7-1 shows the areas of a PivotTable.\n\nRow fields\
    \ and column fields contain the attributes you are interested in for aggregating\
    \ your data. For example, the PivotTable in Figure 7-1 aggregates values by product\
    \ category and year. Filters are used to filter the values in the PivotTable based\
    \ on an attribute. In this case, the filter in Figure 7-1 restricts the results\
    \ to the first quarter of each year. Slicers here perform the same role as filters,\
    \ limiting values to large dealers only. The added advantage of slicers is that\
    \ they can simultaneously filter multiple PivotTables and PivotCharts.\n\n![9781430264453_Fig07-01.jpg](img/9781430264453_Fig07-01.jpg)\n\
    \nFigure 7-1. Components of a PivotTable\n\nTo build a PivotTable, drag fields\
    \ from the \"Field List\" to the drop zones below the \"Field List\", as shown\
    \ in Figure 7-2. If you simply check a box to select a field, it will place text\
    \ fields in the Rows area and all numeric fields in the Values area. This can\
    \ become quite annoying because it will place fields like `Years` into the Values\
    \ area and treat them as a set of values to be summed. (In Chapter 8, I will show\
    \ you how to avoid this.)\n\n![9781430264453_Fig07-02.jpg](img/9781430264453_Fig07-02.jpg)\n\
    \nFigure 7-2. Adding fields to a PivotTable\n\nTo add slicers to filter your PivotTable,\
    \ you need to go to the \"Insert\" tab in Excel and select the \"Slicer\" button.\
    \ In the next section, you will learn how to add a slicer and how to make the\
    \ same slicer control multiple PivotTables.\n\n## Slicing Data\n\nTo add a slicer\
    \ to filter a PivotTable, click on the PivotTable, then select the \"Slicer\"\
    \ button on the \"Insert\" tab. You should see a pick list containing fields from\
    \ your Power Pivot data model (see Figure 7-3).\n\n![9781430264453_Fig07-03.jpg](img/9781430264453_Fig07-03.jpg)\n\
    \nFigure 7-3. Selecting slicer fields\n"
- fmt: 'Since you had the pivot table selected when you inserted the slicer, it is
    automatically wired up to the pivot table. You can verify this by clicking on
    the slicer and selecting the `Slicer Tools Options` tab (see [Figure 7-4](#9781430264453_Ch07.xhtml#Fig4)).
    You can use this tab to format the slicer and choose the report connections for
    the slicer.


    ![9781430264453_Fig07-04.jpg](Images/9781430264453_Fig07-04.jpg)


    [Figure 7-4](#9781430264453_Ch07.xhtml#_Fig4). Setting the slicer connections


    [Figure 7-5](#9781430264453_Ch07.xhtml#Fig5) shows the `Report Connections` pick
    list for the slicer. Notice the pivot table does not have to be on the same sheet
    as the slicer. The names of the pivot tables are the generic names given to them
    by Excel when they were created. As you add more pivot tables, it is a good idea
    to give them more meaningful names. If you click on the pivot table and go to
    the `PivotTable Tools Analyze` tab, you will see a textbox where you can change
    the name of the pivot table.


    ![9781430264453_Fig07-05.jpg](Images/9781430264453_Fig07-05.jpg)


    [Figure 7-5](#9781430264453_Ch07.xhtml#_Fig5). Selecting connections for the slicer


    If you select the `Slicer Settings` button under the `Slicer Tools Options` tab,
    you launch the `Slicer Settings` window (see [Figure 7-6](#9781430264453_Ch07.xhtml#Fig6))
    where you can change the name, caption, and sort order of the slicer. You can
    also choose how to show items with no data.


    ![9781430264453_Fig07-06.jpg](Images/9781430264453_Fig07-06.jpg)


    [Figure 7-6](#9781430264453_Ch07.xhtml#_Fig6). Changing the slicer settings


    There are times when you need *cascading filters*—where one filter limits what
    can be chosen in the next filter. This is easy with slicers that are based on
    fields that are related in the model. When you select the related fields, the
    slicers are linked automatically for you. For example, [Figure 7-7](#9781430264453_Ch07.xhtml#Fig7)
    shows a product category and product subcategory filter. If you select a product
    category, the corresponding product subcategories are highlighted.


    ![9781430264453_Fig07-07.jpg](Images/9781430264453_Fig07-07.jpg)


    [Figure 7-7](#9781430264453_Ch07.xhtml#_Fig7). Creating cascading filters using
    slicers


    ## Adding Visualizations to a Pivot Table


    In order to help identify trends, outliers, and provide insight into the data,
    you can add many types of visualizations to a pivot table. These include conditional
    formatting, data bars, and trend lines. [Figure 7-8](#9781430264453_Ch07.xhtml#Fig8)
    shows a pivot table with data bars and conditional formatting.


    ![9781430264453_Fig07-08.jpg](Images/9781430264453_Fig07-08.jpg)


    [Figure 7-8](#9781430264453_Ch07.xhtml#_Fig8). Using conditional formatting and
    data bars


    To create the visual formatting, select the data you want to format in the pivot
    table, and in the `Home` tab, click on the `Conditional Formatting` drop-down
    (see [Figure 7-9](#9781430264453_Ch07.xhtml#Fig9)). As you can see, you have a
    lot of options for creating conditional formatting. In [Figure 7-8](#9781430264453_Ch07.xhtml#Fig8)
    there is a `Highlight Cells Rule` that displays negative numbers in red.


    ![9781430264453_Fig07-09.jpg](Images/9781430264453_Fig07-09.jpg)


    [Figure 7-9](#9781430264453_Ch07.xhtml#_Fig9). Setting up conditional formatting


    Once you establish a rule, you can edit it by selecting the `Manage Rules` option
    and selecting the rule you want to edit. [Figure 7-10](#9781430264453_Ch07.xhtml#Fig10)
    shows the various options you can set for a `Data Bar` formatting rule.


    ![9781430264453_Fig07-10.jpg](Images/9781430264453_Fig07-10.jpg)


    [Figure 7-10](#9781430264453_Ch07.xhtml#_Fig10). Editing a Data Bar rule


    You can produce some interesting effects with the formatting rules. For example,
    the pivot table in [Figure 7-11](#9781430264453_Ch07.xhtml#Fig11) shows a heat
    map used to quickly determine which months have good sales and which are bad.


    ![9781430264453_Fig07-11.jpg](Images/9781430264453_Fig07-11.jpg)


    [Figure 7-11](#9781430264453_Ch07.xhtml#_Fig11). Creating a heat map with conditional
    formatting


    Another popular feature associated with pivot tables are spark lines. *Spark lines*
    are mini graphs that show the trend of a series of data. [Figure 7-12](#9781430264453_Ch07.xhtml#Fig12)
    shows spark lines that display the sales trend across the four quarters of the
    year.


    ![9781430264453_Fig07-12.jpg](Images/9781430264453_Fig07-12.jpg)


    [Figure 7-12](#9781430264453_Ch07.xhtml#_Fig12). Using spark lines to show trends


    To create a spark line, highlight the values in the pivot table that contain the
    data and select the `Sparklines` button on the `Insert` tab. You then select the
    location of the spark line (see [Figure 7-13](#9781430264453_Ch07.xhtml#Fig13)).
    You have to choose from a line, a column, or a win/loss spark line.


    ![9781430264453_Fig07-13.jpg](Images/9781430264453_Fig07-13.jpg)


    [Figure 7-13](#9781430264453_Ch07.xhtml#_Fig13). Setting up a spark line


    Although adding visualizations to pivot tables can enhance your ability to analyze
    the data, many times the best way to spot trends and compare and contrast the
    data is through the use of charts and graphs. In the next section, you will see
    how charts and graphs are useful data analysis tools and how to add them to your
    analysis dashboards.


    ## Working with Pivot Charts


    Along with pivot tables, Excel has a robust set of charts and graphs available
    for you to use to analyze your data. Adding a pivot chart is very similar to adding
    a pivot table. On the `Insert` tab of Excel, select the `PivotChart` drop-down.
    You have the option of selecting a single `PivotChart` or a `PivotChart` and `PivotTable`
    that are tied together (see [Figure 7-14](#9781430264453_Ch07.xhtml#Fig14)).


    ![9781430264453_Fig07-14.jpg](Images/9781430264453_Fig07-14.jpg)


    [Figure 7-14](#9781430264453_Ch07.xhtml#_Fig14). Adding a pivot chart


    After selecting the pivot chart, you are presented with a window to select a data
    source and where you want to put the pivot chart (see [Figure 7-15](#9781430264453_Ch07.xhtml#Fig15)).


    ![9781430264453_Fig07-15.jpg](Images/9781430264453_Fig07-15.jpg)


    [Figure 7-15](#9781430264453_Ch07.xhtml#_Fig15). Selecting a data source


    To select the `Power Pivot` model as the data source, choose to use an external
    connection and click the `Choose Connection` button. In the `Existing Connections`
    window, select the `Tables` tab and select the `Tables In Workbook Data Model`
    (see [Figure 7-16](#9781430264453_Ch07.xhtml#Fig16)).


    ![9781430264453_Fig07-16.jpg](Images/9781430264453_Fig07-16.jpg)


    [Figure 7-16](#9781430264453_Ch07.xhtml#_Fig16). Selecting the Workbook Data Model


    Once you select the data source, you are presented with a blank chart and the
    field selection box where you can drag and drop fields for the chart values and
    axis (see [Figure 7-17](#9781430264453_Ch07.xhtml#Fig17)).


    ![9781430264453_Fig07-17.jpg](Images/9781430264453_Fig07-17.jpg)


    [Figure 7-17](#9781430264453_Ch07.xhtml#_Fig17). Creating a chart


    By default, the chart is a column chart, but you have many different types of
    charts to choose from. If you click on the chart and select the `PivotChart Tools
    Design` tab, you can select the `Change Chart Type` button and choose from a variety
    of types (see [Figure 7-18](#9781430264453_Ch07.xhtml#Fig18)).


    ![9781430264453_Fig07-18.jpg](Images/9781430264453_Fig07-18.jpg)


    [Figure 7-18](#9781430264453_Ch07.xhtml#_Fig18). Selecting a chart type


    Along with changing the chart type, the `PivotChart Tools` tabs allow you a vast
    assortment of design and formatting options you can use to customize the look
    and feel of your charts and graphs. It is definitely worth your time to play around
    with the tools and create various graphs to gain a better idea of the various
    options available.


    ## Using Multiple Charts and Tables'
