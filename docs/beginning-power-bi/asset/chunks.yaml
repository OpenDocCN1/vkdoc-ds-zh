    ## 第 12 章


    ![image](img/frontdot.jpg)


    # 使用 Power Map 进行地理空间分析


    Power Map 是一个 Excel 插件，为您提供了一套强大的工具，帮助您可视化并深入了解包含地理编码组件的大型数据集。它可以在 Bing 地图上以柱状图、热力图和气泡图的形式绘制多达一百万个数据点，从而生成
    3D 可视化效果。如果数据带有时间戳，它还可以生成交互式视图，展示数据如何在空间和时间上发生变化。在本章中，您将学习如何使用 Power Map 创建引人注目且独特的数据可视化展示。


    完成本章学习后，您将能够：


    -   准备用于地图绘制的数据。

    -   创建基于地图的图表。

    -   创建热力图和区域图。

    -   为地图添加多个图层。

    -   分析随时间的变化。

    -   创建漫游导览。


    ![Image](img/sq.jpg) **注意** 如需彩色图表副本，请访问 `http://www.apress.com/9781430264453`
    的源代码/下载部分。


    ## 准备用于地图绘制的数据


    与任何成功的数据分析工作一样，恰当地准备数据以支持分析工作至关重要。Power Map 可以使用两种数据源之一来绘制地图：Excel 表或包含在 Power
    Pivot 数据模型中的表。对表的主要要求是它包含唯一的行。此外，它还必须包含位置数据，这些数据可以是 `Latitude/Longitude`（纬度/经度）对的形式，但这并非必要条件。您可以使用地址字段代替，例如
    `Street`（街道）、`City`（城市）、`Country/Region`（国家/地区）、`Zip Code/Postal Code`（邮政编码）和
    `State/Province`（省/州），这些字段可以由 Bing 进行地理定位。您可能需要使用列的组合才能获得准确的地图位置。例如，许多同名的城市位于不同的州和国家。


    除了地理定位列之外，表的行还需要包含您想要在地图上绘制的度量值。度量值必须是数值数据类型之一，例如用于计数的整型和用于销售额的 `money/decimal`（货币/小数）类型。如果您想比较数据随时间的变化，最后的要求是每行必须包含一个日期或时间字段。图
    12-1 显示了一个 Power Pivot 数据模型中的表，其中包含关于飞机鸟击事件的信息。由于该表包含机场位置信息以及鸟击信息，因此您可以将其用作 Power
    Map 的数据源。请记住，尽管这些数据可以精确到经纬度级别进行绘制，但您可以使用任何位置字段来绘制数据。例如，如果您没有 `Longitude` 和 `Latitude`
    字段，您仍然可以使用 `City`（城市）或 `State`（州）字段来绘制数据。


    ![9781430264453_Fig12-01.jpg](img/9781430264453_Fig12-01.jpg)


    图 12-1. 包含用于 Power Map 的位置信息的鸟击数据


    如果您需要从外部源获取地图数据并将其塑形以便在 Power Map 中使用，请回想上一章，Power Query 正是完成此任务的绝佳工具。一旦数据准备妥当，您就可以开始创建地图了。


    ## 创建基于地图的图表


    要启动 Power Map，请转到 Excel 中的 `Insert` 选项卡，点击 `Map` 下拉菜单，然后选择 `Launch Power Map`。如果这是您在该
    Excel 工作簿中创建的第一个地图，这将启动用于设计和查看地图的 Power Map 界面（参见图 12-2）。


    ![9781430264453_Fig12-02.jpg](img/9781430264453_Fig12-02.jpg)


    图 12-2. Power Map 界面


    Power Map 界面中有三个窗格。左侧是 `Tour Editor`（漫游编辑器）。您可以在此处将地图的不同视图作为场景添加，然后使用它们创建数据的视频漫游导览。中央窗格是绘制数据的地图。您可以通过平移和缩放与地图交互，从不同角度查看数据。右侧窗格是
    `Layer Pane`（图层窗格），您可以在此处创建将绘制在地图上的数据图层。每个图层代表您希望在地图上添加或移除的一组数据。您可以通过切换 `Home`
    选项卡中 `View` 部分的按钮来显示或隐藏 `Tour Editor` 和 `Layer Pane`（参见图 12-3）。


    ![9781430264453_Fig12-03.jpg](img/9781430264453_Fig12-03.jpg)


    图 12-3. 显示/隐藏窗格


    要开始创建地图，您需要使用 `Layer Pane` 创建一个图层。一个图层代表一个特定的数据集。您可以创建多个图层并将它们相互叠加。例如，您可以创建一个显示河流水位的图层和另一个显示降雨量的图层，然后将
    `Rainfall` 图层放置在 `Stream Level` 图层之上。


    一旦您为图层选择了数据，就可以将其整合到地图中了。在 `Layer Pane` 的 `Choose Geography` 区域中，选择您要在地图上绘制的地理字段。这些字段可以是诸如
    `City`（城市）、`State`（州）或 `Latitude/Longitude`（纬度/经度）之类的字段。选择地理字段后，您将看到这些位置被绘制在地图上（参见图
    12-4）。


    ![9781430264453_Fig12-04.jpg](img/9781430264453_Fig12-04.jpg)


    图 12-4. 选择地理字段

    '
- fmt: 'The next step is to select the type of graph you want to create in the layer.
    You can select a stacked column, clustered column, or bubble graph. In addition
    you can also create a heat or region map. When you first create a map, the stacked
    column graph is selected by default. Once you select the type of graph, you then
    add the fields to the various sections. For example, the stacked column needs
    a field for the Category area. You can also add a field for the Height and Time
    areas. If you do not add a field for Height, then the row count for each of the
    category values is used. [Figure 12-5](#9781430264453_Ch12.xhtml#Fig5) shows the
    phase of flight selected as the Category and the resulting stacked column graph,
    which shows the number of bird strikes for each phase at the various airports.


    ![9781430264453_Fig12-05.jpg](Images/9781430264453_Fig12-05.jpg)


    [Figure 12-5](#9781430264453_Ch12.xhtml#_Fig5). Creating a stacked column map


    You can easily change from a stacked column map to a clustered column map depending
    on which one displays your data better.


    A bubble map is similar to a column map except that it uses bubbles and pie wedges
    to show the data. For example, the bubble map in [Figure 12-6](#9781430264453_Ch12.xhtml#Fig6)
    shows the number of bird strikes by the time of the day.


    ![9781430264453_Fig12-06.jpg](Images/9781430264453_Fig12-06.jpg)


    [Figure 12-6](#9781430264453_Ch12.xhtml#_Fig6). Creating a bubble map


    As you have seen, the processes involved in creating the stacked column, clustered
    column, and bubble maps are very similar. Two addition types of maps that are
    similar to each other are the heat and region maps. You will take a look at these
    next.


    ## Creating Heat and Region Maps


    One interesting type of map available in Power Map is the heat map. Heat maps
    transform the data into color gradients. Higher values are depicted by darker
    shades whereas lower values are depicted by lighter shades. Although not all data
    lends itself to be represented by a heat map, for certain types of data, this
    type of map is very effective. Anytime you want to analyze the relative intensity
    of a value, a heat map is a good choice. For example, weather data such as temperature
    and rainfall amounts are typically depicted using heat maps (see [Figure 12-7](#9781430264453_Ch12.xhtml#Fig7)).


    ![9781430264453_Fig12-07.jpg](Images/9781430264453_Fig12-07.jpg)


    [Figure 12-7](#9781430264453_Ch12.xhtml#_Fig7). Rainfall deficit heat map (Source:
    National Agricultural Monitoring System [NAMS])


    Creating heat maps in Power Map is not much different than creating a stacked
    column map. First select a table that has the geolocation data and the values
    you want to compare. After you select the geography fields, you can change the
    visualization to a heat map and select the value field you want to plot. If you
    do not select a value field, it will plot the row counts. [Figure](#9781430264453_Ch12.xhtml#Fig8)
    12-8 shows a heat map depicting narcotics-related crime in a city neighborhood.
    The darker red represents higher crime areas.


    ![9781430264453_Fig12-08.jpg](Images/9781430264453_Fig12-08.jpg)


    [Figure 12-8](#9781430264453_Ch12.xhtml#_Fig8). A heat map depicting crime rates


    Another type of map that is similar to a heat map is the region map. A region
    map shows defined geographic areas such as countries, states, counties, and zip
    codes. It then color-codes the regions to compare value fields. A common type
    of region map is an election results map. [Figure](#9781430264453_Ch12.xhtml#Fig9)
    12-9 shows an example of an election result by county. Red indicates a Republican
    majority and blue indicates a Democrat majority. The darker the shade, the greater
    the margin.


    ![9781430264453_Fig12-09.jpg](Images/9781430264453_Fig12-09.jpg)


    [Figure 12-9](#9781430264453_Ch12.xhtml#_Fig9). Election results on a region map


    To create a region map, select the region field in the source table as the geography
    field and then switch the visualization to region. Then select the fields that
    contain the values you want on the map (see [Figure 12-10](#9781430264453_Ch12.xhtml#Fig10)).


    ![9781430264453_Fig12-10.jpg](Images/9781430264453_Fig12-10.jpg)


    [Figure 12-10](#9781430264453_Ch12.xhtml#_Fig10). Selecting values for the region
    map


    Each region will show the color of the value field that is greater. By selecting
    the layer options under the Settings tab, you can change the color, opacity, and
    color scale of the value fields shown on the map (see [Figure](#9781430264453_Ch12.xhtml#Fig11)
    12-11).


    ![9781430264453_Fig12-11.jpg](Images/9781430264453_Fig12-11.jpg)


    [Figure 12-11](#9781430264453_Ch12.xhtml#_Fig11). Adjusting the color settings
    of a region map


    In this case, you can adjust the color so that Democrat margins show up in blue
    and Republican margins show up in red (see [Figure](#9781430264453_Ch12.xhtml#Fig12)
    12-12).


    ![9781430264453_Fig12-12.jpg](Images/9781430264453_Fig12-12.jpg)


    [Figure 12-12](#9781430264453_Ch12.xhtml#_Fig12). Voting margins depicted on a
    region map


    Now that you have seen how you create the various types of maps, you may want
    to add multiple layers to a map. You will look at how this is done next.


    ## Adding Multiple Layers to a Power Map


    One of the many great features of Power Map is that you can use it to create multiple
    layers, each with its own visualization. You can then add and remove the various
    layers to create rich presentations.


    To add another layer to the map, click the Add Layer button on the Home tab in
    the Power Map designer. After that, the process is the same as what you did earlier
    when you added your first layer to the map. [Figure 12-13](#9781430264453_Ch12.xhtml#Fig13)
    shows the previous voting results layer and an added layer that shows a bubble
    map depicting the race (white and other) breakdown of the counties.


    ![9781430264453_Fig12-13.jpg](Images/9781430264453_Fig12-13.jpg)


    [Figure 12-13](#9781430264453_Ch12.xhtml#_Fig13). Overlaying multiple layers in
    Power Map


    To control which layers appear or are hidden on the map, select the Layer Manager
    tab in the Layer Pane. In the Layer list, you can hide or show the layer by clicking
    the eye icon (see [Figure 12-14](#9781430264453_Ch12.xhtml#Fig14)).


    ![9781430264453_Fig12-14.jpg](Images/9781430264453_Fig12-14.jpg)


    [Figure 12-14](#9781430264453_Ch12.xhtml#_Fig14). Hiding and showing layers


    As you can see, it is very easy to add multiple layers to a map.


    Another feature of Power Map that all map visualizations have in common is the
    ability to show changes over a period of time. You will look at how to add this
    feature to a map next.


    ## Analyzing Changes over Time


    Another great feature of Power Map is that you can use it to view how changes
    in data occur over time. For example, say you are interested in tracking a hurricane’s
    position and wind speed. Since the data has a date-time field, you can just drag
    this to the Time drop-down on the Field List tab in the Layer Pane (see [Figure
    12-15](#9781430264453_Ch12.xhtml#Fig15)).


    ![9781430264453_Fig12-15.jpg](Images/9781430264453_Fig12-15.jpg)


    [Figure 12-15](#9781430264453_Ch12.xhtml#_Fig15). Adding a time field


    Once you add a time field, a timeline player is automatically added to the map
    layer. [Figure](#9781430264453_Ch12.xhtml#Fig16) 12-16 shows a heat map depicting
    wind speeds as a hurricane travels up the coast. Using the play axis, you can
    view its location over time as it travels.


    ![9781430264453_Fig12-16.jpg](Images/9781430264453_Fig12-16.jpg)


    [Figure 12-16](#9781430264453_Ch12.xhtml#_Fig16). Tracing the path and windspeed
    of a hurricane using the play axis


    One last unique feature of Power Map is the ability to record a tour that can
    pan and zoom through scenes. You can then play back the tour and also export it
    as an MP4 video. You will look at how to create a tour next.


    ## Creating a Tour'
