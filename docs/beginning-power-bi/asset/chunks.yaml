    # Geospatial Analysis with Power Map


    Power Map is an Excel add-in that provides you with a powerful set of tools to
    help you visualize and gain insight into large sets of data that have a geocoded
    component. It can help you produce 3D visualizations by plotting up to a million
    data points in the form of column, heat, and bubble maps on top of a Bing map.
    If the data is time stamped, it can also produce interactive views that display
    how the data changes over space and time. In this chapter, you will learn to create
    compelling and unique visual representations using Power Map.


    After completing this chapter you will be able to


    - Prepare the data for mapping.

    - Create a map-based graph.

    - Create heat and region maps.

    - Add multiple layers to a map.

    - Analyze changes over time.

    - Create a tour.


    ![Image](Images/sq.jpg) **Note** For copies of color figures, go to Source Code/Downloads
    at `http://www.apress.com/9781430264453`.


    ## Preparing Data for Mapping


    As with any successful data analysis effort, it is paramount that you properly
    prepare your data to support the effort. Power Map can use one of two sources
    of data for the maps: an Excel table or a table contained in a Power Pivot data
    model. The primary requirement for the table is that it contains unique rows.
    It must also contain location data, which can be in the form of a `Latitude/Longitude`
    pair, although this is not a requirement. You can use address fields instead,
    such as `Street`, `City`, `Country/Region`, `Zip Code/Postal Code`, and `State/Province`,
    which can be geolocated by Bing. You may need to use a combination of columns
    to get an accurate mapping. For example, many cities with the same name are located
    in various states and countries.


    In addition to the geolocation columns, the table rows also need to contain the
    measures that you want to plot on the map. A measure needs to be one of the numeric
    data types, such as integer for counts and `money/decimal` for sales. If you want
    to compare how the data changed over time, the final requirement is that each
    row must contain a date or time field. [Figure 12-1](#9781430264453_Ch12.xhtml#Fig1)
    shows a table in a Power Pivot data model that contains information about airplane
    bird-strike incidents. Since the table includes airport location information along
    with bird-strike information, you can use it as the source for a Power Map. Remember
    that although this data can be mapped down to the longitude and latitude level,
    you can use any of the location fields to map the data. For example, if you did
    not have the `Longitude` and `Latitude` fields, you could still map the data using
    the `City` or `State` fields.


    ![9781430264453_Fig12-01.jpg](Images/9781430264453_Fig12-01.jpg)


    [Figure 12-1](#9781430264453_Ch12.xhtml#_Fig1). Bird-strike data containing location
    information for use in Power Map


    If you need to get the map data from an external source and shape it to use it
    in a Power Map, remember from the last chapter that Power Query is an excellent
    tool for this purpose. Once the data is properly prepared, you are ready to create
    the map.


    ## Creating a Map-Based Graph


    To launch Power Map, go to the `Insert` tab in Excel, click on the `Map` drop-down,
    and select `Launch Power Map`. If this is the first map you have created in the
    Excel workbook, this will launch the Power Map interface where you design and
    view your maps (See [Figure 12-2](#9781430264453_Ch12.xhtml#Fig2)).


    ![9781430264453_Fig12-02.jpg](Images/9781430264453_Fig12-02.jpg)


    [Figure 12-2](#9781430264453_Ch12.xhtml#_Fig2). The Power Map interface


    There are three panes available in the Power Map interface. The one on the left
    is the `Tour Editor`. This is where you can add various views of the map as scenes
    and then use these to create a video tour of the data. The center pane is the
    map where the data is plotted. You can interact with the map by panning and zooming
    to see the data from different perspectives. The pane on the right is the `Layer
    Pane` where you create the data layers that get plotted on the map. Each layer
    represents a set of data that you want to add or remove from the map. You can
    show or hide the `Tour Editor` and `Layer Pane` by toggling the buttons in the
    `View` section of the `Home` tab (see [Figure](#9781430264453_Ch12.xhtml#Fig3)
    12-3).


    ![9781430264453_Fig12-03.jpg](Images/9781430264453_Fig12-03.jpg)


    [Figure 12-3](#9781430264453_Ch12.xhtml#_Fig3). Showing/hiding the panes


    To begin creating a map you use the `Layer Pane` to create a layer. A layer represents
    a specific data set. You can create multiple layers and overlay them on top of
    each other. For example, you can create one layer that shows stream levels and
    another that shows rainfall amounts and then place the `Rainfall` layer on top
    of the `Stream Level` layer.


    Once you have selected the data for the layer, you are ready to incorporate it
    into a map. In the `Choose Geography` area of the `Layer Pane`, select the geography
    fields you want to plot on the map. These can be fields such as `City`, `State`,
    or `Latitude/Longitude`. Once you select the geography fields, you will see the
    locations plotted on the map (see [Figure 12-4](#9781430264453_Ch12.xhtml#Fig4)).


    ![9781430264453_Fig12-04.jpg](Images/9781430264453_Fig12-04.jpg)


    [Figure 12-4](#9781430264453_Ch12.xhtml#_Fig4). Selecting the geography fields'
