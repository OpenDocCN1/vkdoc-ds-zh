  trans: '

    下一步是选择要在图层中创建的图表类型。您可以选择堆积柱形图、簇状柱形图或气泡图。此外，您还可以创建热力图或区域图。首次创建地图时，默认选择的是堆积柱形图。选择图表类型后，即可将字段添加到各个部分。例如，堆积柱形图需要为“类别”区域添加一个字段。您也可以为“高度”和“时间”区域添加字段。如果不为“高度”添加字段，则将使用每个类别值的行计数。图
    12-5 显示了选择飞行阶段作为类别后生成的堆积柱形图，该图展示了不同机场各个阶段的鸟击数量。


    ![9781430264453_Fig12-05.jpg](img/9781430264453_Fig12-05.jpg)


    图 12-5. 创建堆积柱形图


    根据哪种图表能更好地展示数据，您可以轻松地从堆积柱形图切换为簇状柱形图。


    气泡图与柱形图类似，区别在于它使用气泡和饼扇区来展示数据。例如，图 12-6 中的气泡图显示了按一天中不同时间划分的鸟击数量。


    ![9781430264453_Fig12-06.jpg](img/9781430264453_Fig12-06.jpg)


    图 12-6. 创建气泡图


    正如您所见，创建堆积柱形图、簇状柱形图和气泡图的过程非常相似。另外两种彼此相似的图表类型是热力图和区域图。接下来您将了解它们。


    ## 创建热力图和区域图


    Power Map 中提供的一种有趣的图表类型是热力图。热力图将数据转换为颜色渐变。较高的值用较深的色调表示，而较低的值用较浅的色调表示。虽然并非所有数据都适合用热力图表示，但对于某些类型的数据，这种图表非常有效。任何时候您想要分析某个值的相对强度，热力图都是一个不错的选择。例如，温度和降雨量等天气数据通常使用热力图来呈现（参见图
    12-7）。


    ![9781430264453_Fig12-07.jpg](img/9781430264453_Fig12-07.jpg)


    图 12-7. 降雨亏缺热力图（来源：国家农业监测系统 [NAMS]）


    在 Power Map 中创建热力图与创建堆积柱形图差别不大。首先，选择一个包含地理定位数据和您想要比较的值的表格。选择地理字段后，您可以将可视化效果更改为热力图，并选择要绘制的值字段。如果您不选择值字段，它将绘制行计数。图
    12-8 展示了一幅描绘某城市社区毒品相关犯罪的热力图。深红色表示犯罪率较高的区域。


    ![9781430264453_Fig12-08.jpg](img/9781430264453_Fig12-08.jpg)


    图 12-8. 描绘犯罪率的热力图


    另一种与热力图类似的图表类型是区域图。区域图显示已定义的地理区域，例如国家、州、县和邮政编码。然后，它对区域进行颜色编码以比较值字段。一种常见的区域图是选举结果图。图
    12-9 显示了一个按县划分的选举结果示例。红色表示共和党占多数，蓝色表示民主党占多数。色调越深，优势越大。


    ![9781430264453_Fig12-09.jpg](img/9781430264453_Fig12-09.jpg)


    图 12-9. 区域图上的选举结果


    要创建区域图，请选择源表中的区域字段作为地理字段，然后将可视化效果切换为区域。然后，选择包含您想要在地图上显示的值的字段（参见图 12-10）。


    ![9781430264453_Fig12-10.jpg](img/9781430264453_Fig12-10.jpg)


    图 12-10. 为区域图选择值


    每个区域将显示值较大字段的颜色。通过在“设置”选项卡下选择图层选项，您可以更改地图上显示的值字段的颜色、不透明度和颜色刻度（参见图 12-11）。


    ![9781430264453_Fig12-11.jpg](img/9781430264453_Fig12-11.jpg)


    图 12-11. 调整区域图的颜色设置


    在这种情况下，您可以调整颜色，使民主党的优势显示为蓝色，共和党的优势显示为红色（参见图 12-12）。


    ![9781430264453_Fig12-12.jpg](img/9781430264453_Fig12-12.jpg)


    图 12-12. 区域图上显示的投票优势


    既然您已经了解了如何创建各种类型的地图，您可能还想为一个地图添加多个图层。接下来您将了解如何实现。


    ## 为 Power Map 添加多个图层


    Power Map 的众多强大功能之一是，您可以使用它创建多个图层，每个图层都有自己的可视化效果。然后，您可以添加和移除各个图层，以创建丰富的演示文稿。


    要向地图添加另一个图层，请单击 Power Map 设计器中“主页”选项卡上的“添加图层”按钮。之后，过程与您之前添加第一个图层时相同。图 12-13 显示了之前的投票结果图层以及一个新增的图层，该图层显示了一个气泡图，展示了各县的种族（白种人和其他）细分情况。


    ![9781430264453_Fig12-13.jpg](img/9781430264453_Fig12-13.jpg)


    图 12-13. 在 Power Map 中叠加多个图层


    要控制哪些图层在地图上显示或隐藏，请选择“图层窗格”中的“图层管理器”选项卡。在“图层”列表中，您可以通过单击眼睛图标来隐藏或显示该图层（参见图 12-14）。


    ![9781430264453_Fig12-14.jpg](img/9781430264453_Fig12-14.jpg)


    图 12-14. 隐藏和显示图层


    正如您所见，为地图添加多个图层非常简单。


    所有地图可视化效果共有的另一个 Power Map 功能是能够显示随时间推移发生的变化。接下来您将了解如何将此功能添加到地图中。


    ## 分析随时间推移的变化


    Power Map 的另一个强大功能是，您可以使用它来查看数据如何随时间变化。例如，假设您有兴趣追踪飓风的位置和风速。由于数据包含日期时间字段，您只需将其拖放到“图层窗格”中“字段列表”选项卡上的“时间”下拉区域即可（参见图
    12-15）。


    ![9781430264453_Fig12-15.jpg](img/9781430264453_Fig12-15.jpg)


    图 12-15. 添加时间字段


    一旦添加了时间字段，时间线播放器便会自动添加到地图图层中。图 12-16 展示了一幅热力图，描绘了飓风沿海岸移动时的风速。使用播放轴，您可以查看其随时间推移移动的位置。


    ![9781430264453_Fig12-16.jpg](img/9781430264453_Fig12-16.jpg)


    图 12-16. 使用播放轴追踪飓风的路径和风速


    Power Map 最后一个独特功能是能够录制一个可以在场景中平移和缩放的导览。然后您可以播放此导览，并将其导出为 MP4 视频。接下来您将了解如何创建导览。


    ## 创建导览

    '
- fmt: 'With Power Map, you can tell a story with your data using tours. `Tours` are
    the top-level object in the Power Map hierarchy. Tours consist of one or more
    scenes; `scenes` are like a snapshot of your data that shows the data in a unique
    way. For example, [Figures 12-17](#9781430264453_Ch12.xhtml#Fig17) and [12-18](#9781430264453_Ch12.xhtml#Fig18)
    show the same map viewed with different perspectives. You can create scenes using
    these two perspectives and add them to a tour to zoom from a view of the entire
    United States down to just the Northeastern states.


    ![9781430264453_Fig12-17.jpg](Images/9781430264453_Fig12-17.jpg)


    [Figure 12-17](#9781430264453_Ch12.xhtml#_Fig17). Scene showing the entire United
    States


    ![9781430264453_Fig12-18.jpg](Images/9781430264453_Fig12-18.jpg)


    [Figure 12-18](#9781430264453_Ch12.xhtml#_Fig18). Scene showing just the Northeastern
    states


    To capture a scene, adjust the map to the perspective you want for the scene;
    then click the `Add Scene` button on the toolbar. As you add the scenes to the
    tour, they show up in the `Tour Editor` (see [Figure 12-19](#9781430264453_Ch12.xhtml#Fig19)).


    ![9781430264453_Fig12-19.jpg](Images/9781430264453_Fig12-19.jpg)


    [Figure 12-19](#9781430264453_Ch12.xhtml#_Fig19). The Tour Editor with scenes
    added


    Once you have added scenes to the tour, you can rearrange the scene order by dragging
    and dropping the scenes in the `Tour Editor`. You can also change a scene without
    affecting the other scenes in the tour. You can add or remove map layers, change
    the theme, and change the visual perspective of the scene. Each scene also has
    scene options that allow you to change the scene duration and transition effects
    (see [Figure 12-20](#9781430264453_Ch12.xhtml#Fig20)).


    ![9781430264453_Fig12-20.jpg](Images/9781430264453_Fig12-20.jpg)


    [Figure 12-20](#9781430264453_Ch12.xhtml#_Fig20). Setting scene options


    Once you have created the scenes and set their transition effects, you can play
    the tour by clicking the `Play Tour` button on the `Home` tab (see [Figure 12-19](#9781430264453_Ch12.xhtml#Fig19)).
    After your tour is created, you can export the tour as an MP4 video to share with
    others and even attach a sound track to the tour (see [Figure 12-21](#9781430264453_Ch12.xhtml#Fig21)).


    ![9781430264453_Fig12-21.jpg](Images/9781430264453_Fig12-21.jpg)


    [Figure 12-21](#9781430264453_Ch12.xhtml#_Fig21). Exporting a tour as an MP4 video
    file


    Now that you have seen the various features of Power Map, it is time to get some
    hands-on experience using it to map some data. In order to complete this lab,
    you will need to have installed the latest Power Map add-in.


    ## HANDS-ON LAB—CREATING MAP VISUALIZATIONS IN POWER MAP


    In the following lab you will


    *   Create a column map.

    *   Create a region map.

    *   Create a multilayer map.

    *   Create a heat map with a time axis.


    1.  In the `LabStarters` folder, open the `LabChapter12.xlsx` file. This file
    contains power plant and emission data that you will use to create visualizations
    in Power Map.

    2.  On the `Insert` tab in Excel, select the `Map` drop-down and then launch Power
    Map. You should see the Power Map designer and the tables in the `Layer Panel`
    (see [Figure 12-22](#9781430264453_Ch12.xhtml#Fig22)).


    ![9781430264453_Fig12-22.jpg](Images/9781430264453_Fig12-22.jpg)


    [Figure 12-22](#9781430264453_Ch12.xhtml#_Fig22). The tables listed in the Layer
    Panel


    3.  Rename the layer to `Fuel Type` and select the `State` field in the `PowerStations`
    table as the geography. Click on the `Next` button.

    4.  Add the `PlantCount` field to the `Height` drop box and the `FuelType` field
    to the `Category` drop box. Switch the map to a clustered column and zoom in to
    the Northeastern United States. You should see two columns on each state: one
    representing fossil fuel plants and the other representing green energy sources.

    5.  On the `Settings` tab of the `Layer Pane`, change the color of the fossil
    fuel column to black and the green energy column to green. You can also adjust
    the height and thickness of the columns. The final map should look similar to
    [Figure](#9781430264453_Ch12.xhtml#Fig23) 12-23.


    ![9781430264453_Fig12-23.jpg](Images/9781430264453_Fig12-23.jpg)


    [Figure 12-23](#9781430264453_Ch12.xhtml#_Fig23). Clustered columns showing the
    number of power plants for each state


    6.  On the `Layer Manager` tab in the `Layer Pane`, add another layer named `CO2
    Emissions`. Use the `State` field in the `StateCO2Emissions` table as the geography
    field.

    7.  Change the map type to `Region` and select `CO2 Emissions` as the value field.

    8.  On the `Settings` tab of the `Layer Pane`, change the color of the regions
    to blue. Adjust the color scale to zero so you can see small differences between
    the states values.

    9.  You should now have two layers in the same map as shown in [Figure](#9781430264453_Ch12.xhtml#Fig24)
    12-24\. You can show and hide the various layers on the map using the `Layer Manager`
    tab in the `Layer Pane`.


    ![9781430264453_Fig12-24.jpg](Images/9781430264453_Fig12-24.jpg)


    [Figure 12-24](#9781430264453_Ch12.xhtml#_Fig24). A multilayer map


    10.  Save and close the Excel workbook.

    11.  In the `LabStarters` folder, open the `LabChapter12_2.xlsx` file. This file
    contains hurricane data that you will use to create a heat map and timeline in
    Power Map.

    12.  Launch Power Map and create a layer named `Sandy`. Using the `HurricaneSandy`
    data add the `Latitude` and `Longitude` fields to the `Geography` drop box.

    13.  Change the map to a heat map and select `Wind Strength` as the value field
    and `DateTime` as the time field.

    14.  You should see a heat map as in [Figure](#9781430264453_Ch12.xhtml#Fig25)
    12-25\. Notice how the wind speed was greatest when it hit land. Using the play
    axis, push the `Play` button to watch the hurricane trace its path over time.


    ![9781430264453_Fig12-25.jpg](Images/9781430264453_Fig12-25.jpg)


    [Figure 12-25](#9781430264453_Ch12.xhtml#_Fig25). Heat map depicting wind strength


    15.  When you are done save and close Excel.


    ## Summary


    As you have seen in this chapter, Power Map is a powerful Excel add-in that provides
    a set of tools to help you visualize and gain insight into data that has a geography
    component. You can produce excellent 3D visualizations by plotting data in the
    form of columns on top of a Bing map. In addition, if the data has a date or time
    component, you can use Power Map to visualize data changes over time. You also
    saw how to create heat and region maps that, for certain types of data sets, are
    great ways to visualize and discover insights into the data. Another great feature
    of Power Map is its ability to overlay various data layers on the same map, which
    allows you to compare data that is linked together through a locational component.


    Remember, currently Power Map is a work in progress and new features are being
    added to it on a regular basis. Make sure you are working with the latest release
    to take advantage of these features.'
