- fmt: "[Figure 3-8](#9781430264453_Ch03.xhtml#_Fig8). The `Product` and `Sales` tables\n\
    \nWhen you try to create a relationship between the tables you get the error shown\
    \ in [Figure 3-9](#9781430264453_Ch03.xhtml#Fig9).\n\n![9781430264453_Fig03-09.jpg](Images/9781430264453_Fig03-09.jpg)\n\
    \n[Figure 3-9](#9781430264453_Ch03.xhtml#_Fig9). Getting a duplicate value error\n\
    \nIn this example the `ProductNumber` is supposed to be unique in the `Product`\
    \ table but it turns out there are duplicates. In order to fix this, you would\
    \ have to change the query for the `Product` table data to ensure that you are\
    \ not getting duplicates.\n\nNow that you know how to create table relationships\
    \ in the model, you are ready to look at the benefits of using a star schema.\n\
    \n## Creating a Star Schema\n\nWhen creating a data model it is important to understand\
    \ what the model is being used for. The two major uses of databases are for capturing\
    \ data and for reporting/analyzing the data. The problem is that when you create\
    \ a model for efficient data capture, you decrease its efficiency to analyze the\
    \ data. To combat this problem, many companies split off the data capturing database\
    \ from their reporting/analysis database. Fortunately, when creating the data\
    \ model in Power Pivot, we only need to tune it for reporting.\n\nOne of the best\
    \ models to use when analyzing large sets of data is the *star schema*. The star\
    \ schema consists of a central fact table surrounded by dimension tables, as shown\
    \ in [Figure 3-10](#9781430264453_Ch03.xhtml#Fig10).\n\n![9781430264453_Fig03-10.jpg](Images/9781430264453_Fig03-10.jpg)\n\
    \n[Figure 3-10](#9781430264453_Ch03.xhtml#_Fig10). A typical star schema\n\nThe\
    \ fact table contains quantitative data related to the business or process. For\
    \ example, the `Sales` table in [Figure 3-10](#9781430264453_Ch03.xhtml#Fig10)\
    \ contains measurable aspects of a sale, such as total costs, sales amount, and\
    \ quantity. Fact tables usually contain many rows and have a date or time component\
    \ that records the time point at which the event occurred. The dimension tables\
    \ contain attributes about the event. For example, the `Date` table can tell you\
    \ when the sale occurred and allows you to roll up the data to the month, quarter,\
    \ or year level. The `Product` table contains attributes about the product sold\
    \ and you can look at sales by product line, color, and brand. The `Store` table\
    \ contains attributes about the store involved in the sale. Dimension tables usually\
    \ do not contain as many rows as the fact table but can contain quite a few columns.\
    \ When you ask a question like “Which bikes are selling the best in the various\
    \ age groups?” the measures (sales dollar values) come from the fact table whereas\
    \ the categorizations (age and bike model) come from the dimension tables.\n\n\
    The main advantage of the star schema is that it provides fast query performance\
    \ and aggregation processing. The disadvantage is that it usually requires a lot\
    \ of preprocessing to move the data from a highly normalized transactional system\
    \ to a more denormalized reporting system. The good news is that your business\
    \ may have a reporting system feeding a traditional online analytical processing\
    \ (OLAP) database such as Microsoft’s Analysis Server or IBM’s Cognos. If you\
    \ can gain access to these systems, they are probably the best source for your\
    \ core business data.\n\nIn order to create a star schema from your source data\
    \ systems, you may have to perform some data denormalization, which is covered\
    \ in the following section.\n\n## Understanding When to Denormalize the Data\n\
    \nAlthough transactional database systems tend to be highly normalized, reporting\
    \ systems are denormalized into the star schema. If you do not have access to\
    \ a reporting system where the denormalization is done for you, you will have\
    \ to denormalize the data into a star schema to load your Power Pivot model. As\
    \ an example, [Figure 3-11](#9781430264453_Ch03.xhtml#Fig11) shows the tables\
    \ that contain customer data in the `Adventureworks` transactional sales database.\n\
    \n![9781430264453_Fig03-11.jpg](Images/9781430264453_Fig03-11.jpg)\n\n[Figure\
    \ 3-11](#9781430264453_Ch03.xhtml#_Fig11). A highly normalized schema\n\nIn order\
    \ to denormalize the customer data into your model, you need to create a query\
    \ that combines the data into a single customer dimension table. If you are not\
    \ familiar with creating complex queries, the easiest way to do this is to have\
    \ the database developers create a view you can pull from that combines the tables\
    \ for you. If the query is not too complex, you can probably create it yourself\
    \ when you import the data. For example, [Figure 3-12](#9781430264453_Ch03.xhtml#Fig12)\
    \ shows a customer table and a geography table.\n\n![9781430264453_Fig03-12.jpg](Images/9781430264453_Fig03-12.jpg)\n\
    \n[Figure 3-12](#9781430264453_Ch03.xhtml#_Fig12). Combining customer and customer\
    \ location data\n\nYou can combine these into one customer dimension table using\
    \ the following query.\n\n```\nSELECT  c.CustomerKey, c.BirthDate, c.MaritalStatus,\
    \ c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome, c.EnglishOccupation,\n\
    \        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n        g.City,\
    \ g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\nFROM    Customer\
    \ AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
    ```\n\nAlthough you do not have to be a query expert to get data into your Power\
    \ Pivot model, it is very beneficial to know the basics of querying the data sources,\
    \ even if it just helps to ask the right questions when you talk to the database\
    \ developers.\n\n## Creating Linked Tables\n\nOne thing to remember about the\
    \ data contained in the Power Pivot model is that it is read only. For the most\
    \ part this is a good thing. You want to make sure that the data only gets changed\
    \ in the source system. At times, however, as part of the data analysis, you will\
    \ want to make adjustments on the fly and see how it affects the results. One\
    \ example that happens fairly often is *bucket analysis*. For example, say you\
    \ want to look a continuous measure such as age in discrete buckets (ranges) and\
    \ you need to adjust the ranges during analysis. This is where linked tables shine.\n\
    \nTo create the linked table you first set up the table on an Excel sheet. After\
    \ entering the data, you highlight it and click on the quick analysis menu (see\
    \ [Figure 3-13](#9781430264453_Ch03.xhtml#Fig13)). Under the `Tables` tab click\
    \ on the `Table` button.\n\n![9781430264453_Fig03-13.jpg](Images/9781430264453_Fig03-13.jpg)\n\
    \n[Figure 3-13](#9781430264453_Ch03.xhtml#_Fig13). Creating an Excel table\n\n\
    Once the table is created, it is a good idea to name it before importing it into\
    \ the Power Pivot data model. You can do this by selecting the table and then\
    \ entering the table name under the `Tables` tab in the `Table Tools Design` popup\
    \ window (see [Figure 3-14](#9781430264453_Ch03.xhtml#Fig14)).\n\n![9781430264453_Fig03-14.jpg](Images/9781430264453_Fig03-14.jpg)\n\
    \n[Figure 3-14](#9781430264453_Ch03.xhtml#_Fig14). Renaming an Excel table\n\n\
    Once you have the table named, select it, and on the `Power Pivot` tab, select\
    \ `Add To Data Model` (see [Figure 3-15](#9781430264453_Ch03.xhtml#Fig15)).\n\n\
    ![9781430264453_Fig03-15.jpg](Images/9781430264453_Fig03-15.jpg)\n\n[Figure 3-15](#9781430264453_Ch03.xhtml#_Fig15).\
    \ Adding the table to the model\n\nAfter the table is imported into the model,\
    \ if you change some of the table values in the Excel sheet and select `Update\
    \ All` on the `PowerPivot` tab (see [Figure 3-15](#9781430264453_Ch03.xhtml#Fig15)),\
    \ the linked table in the model will update with the new values.\n\n## Creating\
    \ Hierarchies"
