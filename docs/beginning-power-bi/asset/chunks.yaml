    ## 小结


    创建 Power Pivot 模型的首要步骤之一就是导入数据。在本章中，您学习了如何从各种数据源导入数据。在 Power Pivot 中导入数据的一个优点在于，从不同数据源导入数据的体验是相似的。您需要创建连接、提供查询或选择表、预览和筛选数据，然后将其导入模型中。现在，您已将数据导入到模型中的各个表，接下来需要在这些表之间建立关系。在下一章中，您将了解建立关系的重要性，以及如何通过层次结构来增强模型以辅助数据分析。


    ## 第 3 章


    ![image](img/frontdot.jpg)


    # 创建数据模型


    既然您已经知道如何将数据导入 Power Pivot 模型，下一步就是理解什么构成了一个良好的模型。这在处理 Power Pivot 中的数据时非常重要。一个良好的模型将使
    Power Pivot 运行得异常快速，并允许您以新颖有趣的方式分析数据。而一个糟糕的模型会导致 Power Pivot 运行缓慢，最坏的情况下，在进行数据分析时会产生误导性结果。传统的
    Excel 数据透视表基于 Excel 工作表中的单个表。Power Pivot 数据透视表则基于数据模型中的多个表。本章将引导您完成创建稳固模型的过程，该模型将成为您数据分析的基础。此外，您还将了解如何向客户端工具呈现一个用户友好的模型。这包括重命名表和字段、提供合适的数据类型以及隐藏无关字段。


    完成本章后，您将能够：


    -   解释什么是数据模型

    -   在模型的表之间创建关系

    -   创建并使用星型架构

    -   理解何时以及如何对数据进行反规范化

    -   创建并使用链接表

    -   创建并使用层次结构

    -   创建一个用户友好的模型


    ### 什么是数据模型？


    从根本上说，数据模型由表、列、数据类型和表关系组成。通常，数据表是为了存储业务实体的数据而构建的；例如，客户数据存储在客户表中，员工数据存储在员工表中。表由定义实体属性的列组成。例如，您可能希望存储客户信息，如姓名、地址、出生日期、家庭规模等。每个属性都有一个数据类型，取决于该属性所包含的信息——姓名应为字符串数据类型，家庭规模应为整数，出生日期应为日期类型。表中的每一行都应该是唯一的。以客户表为例，如果同一客户在多行中出现但属性不同（例如出生日期），您将无法知道哪个是正确的。

    '
- fmt: '在上一示例中，你会知道其中一行数据是不正确的，因为同一个人不可能有两个不同的生日。不过，在很多情况下，你需要追踪某个实体属性值的变化。例如，产品的标价可能会随时间变化。为了追踪这种变化，你需要添加时间戳来使行唯一。这样一来，每一行就可以通过产品编号和时间戳来唯一标识，如图[Figure
    3-1](#9781430264453_Ch03.xhtml#Fig1)所示。


    ![9781430264453_Fig03-01.jpg](Images/9781430264453_Fig03-01.jpg)


    [Figure 3-1](#9781430264453_Ch03.xhtml#_Fig1). 使用时间戳追踪变化


    一旦确定了模型中的表，关键是要识别这些表是否高效设置。这个过程被称为*规范化*模型。规范化是组织数据以使其更易于查询且效率更高的过程。例如，不应将不相关实体的属性混合在同一个表中——你绝对不希望将产品数据和员工数据放在同一个表中。另一个正确规范化的例子是，不要在一个列中存放多个属性。例如，与其使用一个客户地址列，不如将其拆分为街道、城市、州和邮政编码。这样你就可以轻松地按州或城市分析数据。[Figure
    3-2](#9781430264453_Ch03.xhtml#Fig2)所示的电子表格展示了一个典型的非规范化表。如果你发现提供给你的数据规范化不足，你可能需要要求数据提供方将数据拆分为多个表，然后你可以在模型中将这些表关联起来。


    ![9781430264453_Fig03-02.jpg](Images/9781430264453_Fig03-02.jpg)


    [Figure 3-2](#9781430264453_Ch03.xhtml#_Fig2). 一个非规范化的表


    一旦你确定模型中的表已充分规范化，下一步就是确定这些表之间的关联方式。例如，你需要关联客户表、销售表和产品表，以便分析不同产品在不同年龄段的销售情况。关联不同表的方式是使用*键*。表中的每一行都需要一个列或列组合来唯一标识该行。这称为*主键*。这个键可能很容易识别，例如在数据录入时由业务分配的销售订单号或客户编号。有时，你需要对表进行一些分析才能找到主键，尤其是当你从外部来源获取数据时。例如，你可能获取了包含潜在客户的数据，字段包括姓名、城市、州、邮编、出生日期等。你不能仅使用姓名作为键，因为很可能存在多个同名的客户。如果使用姓名和城市的组合，出现多个客户由同一个键标识的可能性就会降低。当你使用更多列（如邮编和出生日期）时，这种可能性会变得更小。


    在模型中关联表时，一个表的主键会成为相关表中的外键。例如，要将客户与其销售记录关联起来，客户键需要包含在销售表中，在那里它被视为外键。在提取数据时，使用键来获取相关数据。到目前为止，出于性能考虑，最好的键类型是单列整数。因此，许多数据库表在设计时都使用了代理键。这个键是在记录加载时分配给该记录的整数。代理键用于连接表，而不是使用自然键。[Figure
    3-3](#9781430264453_Ch03.xhtml#Fig3)展示了一个典型的数据库表，其中同时包含代理键（`CustomerKey`）和自然键（`CustomerAlternateKey`）。


    ![9781430264453_Fig03-03.jpg](Images/9781430264453_Fig03-03.jpg)


    [Figure 3-3](#9781430264453_Ch03.xhtml#_Fig3). 一个同时包含代理键和自然键的表


    了解数据源中使用的键非常重要。如果能够从源中检索到键，那会好得多。当从关系型数据库检索数据时，这通常不是问题，但如果你要整合来自不同系统的数据，请确保你拥有合适的键。


    一旦确定了表之间的键，就可以准备在`Power Pivot`模型中创建关系了。


    ## 创建表关系


    在`Power Pivot`模型中建立表关系时，需要记住一些规则。首先，不能在模型中使用复合键。如果你的表使用了复合键，你需要通过连接复合列来创建一个新列，并将此列用作键。其次，两个表之间只能有一个活动关系路径，但可以有多个非活动关系。第三，关系是一对多的；换句话说，在客户表（一侧）和销售表（多侧）之间创建关系是可以的。然而，直接在客户表和产品表之间创建关系是不允许的，因为一个客户可以购买多个产品，而同一个产品也可以被多个客户购买。在这种情况下，你需要创建一个连接表来连接这些表。


    要在`Power Pivot`模型中创建两个表之间的关系，你可以打开`Data Model Manager`并切换到关系图视图。右键点击代表关系多侧的表，然后选择`Create
    Relationship`。这将启动`Create Relationship`窗口。选择相关的查找表（一侧）和键列。[Figure 3-4](#9781430264453_Ch03.xhtml#Fig4)展示了在`Sales`表和`Store`表之间创建关系。默认情况下，表之间创建的第一个关系被标记为活动关系。


    ![9781430264453_Fig03-04.jpg](Images/9781430264453_Fig03-04.jpg)


    [Figure 3-4](#9781430264453_Ch03.xhtml#_Fig4). 创建表关系


    [Figure 3-5](#9781430264453_Ch03.xhtml#Fig5)展示了在关系图视图中最终形成的关系。如果你点击关系箭头，该关系的两个键列会高亮显示。


    ![9781430264453_Fig03-05.jpg](Images/9781430264453_Fig03-05.jpg)


    [Figure 3-5](#9781430264453_Ch03.xhtml#_Fig5). 在关系图视图中查看关系


    你可以在两个表之间创建多个关系，但请记住，只能有一个是活动关系。如果你试图创建两个活动关系，会收到类似[Figure 3-6](#9781430264453_Ch03.xhtml#Fig6)所示的错误信息。


    ![9781430264453_Fig03-06.jpg](Images/9781430264453_Fig03-06.jpg)


    [Figure 3-6](#9781430264453_Ch03.xhtml#_Fig6). 尝试在两个表之间创建第二个活动关系


