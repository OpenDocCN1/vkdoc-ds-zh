    Introduction


    Self-service business intelligence (BI) is all the rage. You have heard the hype,
    seen the sales demos, and are ready to give it a try. Now what? If you are like
    me, you have probably already checked out a few web sites for examples, given
    them a try, and learned a thing or two. But you are still left wondering how all
    these tools fit together and how you go about creating a complete solution, right?
    If so, this book is for you. It takes you step by step through the process of
    analyzing data using the various tools that are at the core of Microsoft’s self-service
    BI offering.


    At the center of Microsoft’s self-service BI offering is Power Pivot. I will show
    you how to create robust, scalable data models using Power Pivot; these will serve
    as the foundation of your data analysis. Since Power Pivot is the core tool you
    will use to create self-service BI solutions, it is covered extensively in this
    book. Next up is Power View. I will show you how to use Power View to easily build
    interactive visualizations that allow you to explore your data to discover trends
    and gain insight. In addition, I will show you how Power Pivot allows you to create
    a data model that will take full advantage of the features available in Power
    View.'
