- fmt: "# Previewing and Filtering Data\n\n[Figure 2-18](#9781430264453_Ch02.xhtml#_Fig18).\
    \ Previewing the data\n\nSelecting the drop-down next to the column header brings\
    \ up the ability to limit the rows brought in based on a filter criteria (see\
    \ [Figure 2-19](#9781430264453_Ch02.xhtml#Fig19)).\n\n![9781430264453_Fig02-19.jpg](Images/9781430264453_Fig02-19.jpg)\n\
    \n[Figure 2-19](#9781430264453_Ch02.xhtml#_Fig19). Filtering rows imported into\
    \ the model\n\nThe main difference between importing data from a text file and\
    \ importing data from an Excel file is that the Excel file can contain more than\
    \ one table. By default each sheet is treated as a table (see [Figure 2-20](#9781430264453_Ch02.xhtml#Fig20)).\
    \ Once you select the table you have the option to preview and filter the data\
    \ just as you did for a text file.\n\n![9781430264453_Fig02-20.jpg](Images/9781430264453_Fig02-20.jpg)\n\
    \n[Figure 2-20](#9781430264453_Ch02.xhtml#_Fig20). Selecting a table in an Excel\
    \ file\n\nIn addition to importing data from a text file you may need to supplement\
    \ your data model using data imported from a data feed. This is becoming a very\
    \ common way to exchange data with business partners and you will see how to do\
    \ this next.\n\n## Importing Data from a Data Feed\n\nAlthough text files are\
    \ one of the most popular ways of exchanging data, data feeds are becoming an\
    \ increasingly prevalent way of exchanging data. Data feeds provide the data through\
    \ web services, and to connect to the web service, you enter the web address of\
    \ the web service. In [Figure 2-17](#9781430264453_Ch02.xhtml#Fig17) you can see\
    \ the data feed connections available to you. Most often you will know the address\
    \ of the data service provided by a partner or data provider. In this case, you\
    \ choose other feeds that then provide you with a connection information entry\
    \ window, as shown in [Figure 2-21](#9781430264453_Ch02.xhtml#Fig21).\n\n![9781430264453_Fig02-21.jpg](Images/9781430264453_Fig02-21.jpg)\n\
    \n[Figure 2-21](#9781430264453_Ch02.xhtml#_Fig21). Connecting to a data feed\n\
    \nBecause the data feed contains not only the data but also the metadata (description\
    \ of the data), once you make the connection, Power Pivot provides you with the\
    \ ability to preview and filter the data, as shown in [Figure 2-22](#9781430264453_Ch02.xhtml#Fig22).\n\
    \n![9781430264453_Fig02-22.jpg](Images/9781430264453_Fig02-22.jpg)\n\n[Figure\
    \ 2-22](#9781430264453_Ch02.xhtml#_Fig22). Previewing and filtering data from\
    \ a data feed\n\nA couple of interesting data feeds you can consume are data from\
    \ Reporting Services reports and SharePoint lists. These applications can easily\
    \ expose their data as data feeds that you can consume as a data source. In addition,\
    \ many database vendors such as SAP support the ability to expose their data as\
    \ data feeds.\n\n## Importing Data from an OLAP Cube\n\nMany companies have invested\
    \ a lot of money and effort into creating an enterprise reporting solution consisting\
    \ of an enterprise-wide OLAP repository that feeds various dashboards and score\
    \ cards. Using Power Pivot, you can easily integrate data from these repositories.\
    \ From the connection choices in the connection window ([Figure 2-17](#9781430264453_Ch02.xhtml#Fig17)),\
    \ choose the Microsoft SQL Server Analysis Services connection under Multidimensional\
    \ Services. This launches the connection information window as shown in [Figure\
    \ 2-23](#9781430264453_Ch02.xhtml#Fig23). You can either connect to a multidimensional\
    \ cube or a Power Pivot model published to SharePoint. To connect to a cube, enter\
    \ the server name and the database name. To connect to a Power Pivot model, enter\
    \ the URL to the Excel workbook (in a SharePoint library) and the model name.\n\
    \n![9781430264453_Fig02-23.jpg](Images/9781430264453_Fig02-23.jpg)\n\n[Figure\
    \ 2-23](#9781430264453_Ch02.xhtml#_Fig23). Connecting to an Analysis Services\
    \ cube\n\nOnce you are connected to the cube you can enter an MDX query to retrieve\
    \ the data (see [Figure 2-24](#9781430264453_Ch02.xhtml#Fig24)). Remember to validate\
    \ the query to make sure it will run.\n\n![9781430264453_Fig02-24.jpg](Images/9781430264453_Fig02-24.jpg)\n\
    \n[Figure 2-24](#9781430264453_Ch02.xhtml#_Fig24). Entering an MDX query\n\nIf\
    \ you do not know MDX, you can use a visual designer to create it, as shown in\
    \ [Figure 2-25](#9781430264453_Ch02.xhtml#Fig25). One of the nice features of\
    \ the designer is the ability to preview the results.\n\n![9781430264453_Fig02-25.jpg](Images/9781430264453_Fig02-25.jpg)\n\
    \n[Figure 2-25](#9781430264453_Ch02.xhtml#_Fig25). Designing an MDX query\n\n\
    When you are done designing the query, it is entered in to the MDX statement box,\
    \ shown in [Figure 2-24](#9781430264453_Ch02.xhtml#Fig24), where you can finish\
    \ importing the data.\n\n## Reusing Existing Connections to Update the Model\n\
    \nThere are two scenarios where you want to reuse an existing connection to a\
    \ data source. You may need to retrieve additional data from a data source; for\
    \ example, you need to get data from additional tables or views or issue a new\
    \ query. In this case, you would choose the existing connections button located\
    \ on the Home tab (see [Figure 2-26](#9781430264453_Ch02.xhtml#Fig26)).\n\n![9781430264453_Fig02-26.jpg](Images/9781430264453_Fig02-26.jpg)\n\
    \n[Figure 2-26](#9781430264453_Ch02.xhtml#_Fig26). Selecting existing connections\n\
    \nIn the Existing Connections window, select the connection and click the Open\
    \ button (see [Figure 2-27](#9781430264453_Ch02.xhtml#Fig27)). This will launch\
    \ the screens (which depend on the connection type), covered previously, where\
    \ you go through the process of selecting the data you want to import.\n\n![9781430264453_Fig02-27.jpg](Images/9781430264453_Fig02-27.jpg)\n\
    \n[Figure 2-27](#9781430264453_Ch02.xhtml#_Fig27). Opening an existing connection\n\
    \nThe other scenario is when you want to change the filtering or add some columns\
    \ to an existing table in the model. In this case, you need to select the table\
    \ in the data view mode of the designer, and on the Design tab, select Table Properties\
    \ (see [Figure 2-28](#9781430264453_Ch02.xhtml#Fig28)).\n\n![9781430264453_Fig02-28.jpg](Images/9781430264453_Fig02-28.jpg)\n\
    \n[Figure 2-28](#9781430264453_Ch02.xhtml#_Fig28). Selecting table properties\n\
    \nThe Edit Table Properties window allows you to update the query used to populate\
    \ the table with data. You can either update the table in the Table Preview mode\
    \ ([Figure 2-29](#9781430264453_Ch02.xhtml#Fig29)) or Query mode ([Figure 2-30](#9781430264453_Ch02.xhtml#Fig30)).\
    \ When in Query Editor mode you can also launch the query designer to update the\
    \ query.\n\n![9781430264453_Fig02-29.jpg](Images/9781430264453_Fig02-29.jpg)\n\
    \n[Figure 2-29](#9781430264453_Ch02.xhtml#_Fig29). Updating the query in Table\
    \ Preview mode\n\n![9781430264453_Fig02-30.jpg](Images/9781430264453_Fig02-30.jpg)\n\
    \n[Figure 2-30](#9781430264453_Ch02.xhtml#_Fig30). Updating the query in Query\
    \ Editor mode\n\nNow that you have seen how to import the data from various data\
    \ sources into the Power Pivot data model, it is time to get some hands-on experience\
    \ importing the data.\n\n## HANDS-ON LAB—LOADING DATA INTO POWER PIVOT\n\nIn the\
    \ following lab you will:\n\n* Import data from an Access database.\n* Import\
    \ data from a text file.\n\n1. Open Excel 2013 and create a new file called `LabChapter2.xlsx`.\n\
    2. On the Power Pivot tab, click on the Manage Data Model button (see [Figure\
    \ 2-31](#9781430264453_Ch02.xhtml#Fig31)). This launches the Power Pivot Model\
    \ Designer window.\n\n   ![9781430264453_Fig02-31.jpg](Images/9781430264453_Fig02-31.jpg)\n\
    \n   [Figure 2-31](#9781430264453_Ch02.xhtml#_Fig31). Opening the Model Designer\
    \ window\n\n3. On the Home tab in the Get External Data grouping, click on the\
    \ From Database drop-down (see [Figure 2-32](#9781430264453_Ch02.xhtml#Fig32)).\
    \ In the drop-down select From Access. This launches the Table Import Wizard.\n\
    \n   ![9781430264453_Fig02-32.jpg](Images/9781430264453_Fig02-32.jpg)\n\n   [Figure\
    \ 2-32](#9781430264453_Ch02.xhtml#_Fig32). Launching the Table Import Wizard"
  raw: '[Figure 2-18](#9781430264453_Ch02.xhtml#_Fig18). Previewing the data


    Selecting the drop-down next to the column header brings up the ability to limit
    the rows brought in based on a filter criteria (see [Figure 2-19](#9781430264453_Ch02.xhtml#Fig19)).


    ![9781430264453_Fig02-19.jpg](Images/9781430264453_Fig02-19.jpg)


    [Figure 2-19](#9781430264453_Ch02.xhtml#_Fig19). Filtering rows imported into
    the model


    The main difference between importing data from a text file and importing data
    from an Excel file is that the Excel file can contain more than one table. By
    default each sheet is treated as a table (see [Figure 2-20](#9781430264453_Ch02.xhtml#Fig20)).
    Once you select the table you have the option to preview and filter the data just
    as you did for a text file.


    ![9781430264453_Fig02-20.jpg](Images/9781430264453_Fig02-20.jpg)


    [Figure 2-20](#9781430264453_Ch02.xhtml#_Fig20). Selecting a table in an Excel
    file


    In addition to importing data from a text file you may need to supplement your
    data model using data imported from a data feed. This is becoming a very common
    way to exchange data with business partners and you will see how to do this next.


    Importing Data from a Data Feed


    Although text files are one of the most popular ways of exchanging data, data
    feeds are becoming an increasingly prevalent way of exchanging data. Data feeds
    provide the data through web services, and to connect to the web service, you
    enter the web address of the web service. In [Figure 2-17](#9781430264453_Ch02.xhtml#Fig17)
    you can see the data feed connections available to you. Most often you will know
    the address of the data service provided by a partner or data provider. In this
    case, you choose other feeds that then provide you with a connection information
    entry window, as shown in [Figure 2-21](#9781430264453_Ch02.xhtml#Fig21).


    ![9781430264453_Fig02-21.jpg](Images/9781430264453_Fig02-21.jpg)


    [Figure 2-21](#9781430264453_Ch02.xhtml#_Fig21). Connecting to a data feed


    Because the data feed contains not only the data but also the metadata (description
    of the data), once you make the connection, Power Pivot provides you with the
    ability to preview and filter the data, as shown in [Figure 2-22](#9781430264453_Ch02.xhtml#Fig22).


    ![9781430264453_Fig02-22.jpg](Images/9781430264453_Fig02-22.jpg)


    [Figure 2-22](#9781430264453_Ch02.xhtml#_Fig22). Previewing and filtering data
    from a data feed


    A couple of interesting data feeds you can consume are data from Reporting Services
    reports and SharePoint lists. These applications can easily expose their data
    as data feeds that you can consume as a data source. In addition, many database
    vendors such as SAP support the ability to expose their data as data feeds.


    Importing Data from an OLAP Cube


    Many companies have invested a lot of money and effort into creating an enterprise
    reporting solution consisting of an enterprise-wide OLAP repository that feeds
    various dashboards and score cards. Using Power Pivot, you can easily integrate
    data from these repositories. From the connection choices in the connection window
    ([Figure 2-17](#9781430264453_Ch02.xhtml#Fig17)), choose the Microsoft SQL Server
    Analysis Services connection under Multidimensional Services. This launches the
    connection information window as shown in [Figure 2-23](#9781430264453_Ch02.xhtml#Fig23).
    You can either connect to a multidimensional cube or a Power Pivot model published
    to SharePoint. To connect to a cube, enter the server name and the database name.
    To connect to a Power Pivot model, enter the URL to the Excel workbook (in a SharePoint
    library) and the model name.


    ![9781430264453_Fig02-23.jpg](Images/9781430264453_Fig02-23.jpg)


    [Figure 2-23](#9781430264453_Ch02.xhtml#_Fig23). Connecting to an Analysis Services
    cube


    Once you are connected to the cube you can enter an MDX query to retrieve the
    data (see [Figure 2-24](#9781430264453_Ch02.xhtml#Fig24)). Remember to validate
    the query to make sure it will run.


    ![9781430264453_Fig02-24.jpg](Images/9781430264453_Fig02-24.jpg)


    [Figure 2-24](#9781430264453_Ch02.xhtml#_Fig24). Entering an MDX query


    If you do not know MDX, you can use a visual designer to create it, as shown in
    [Figure 2-25](#9781430264453_Ch02.xhtml#Fig25). One of the nice features of the
    designer is the ability to preview the results.


    ![9781430264453_Fig02-25.jpg](Images/9781430264453_Fig02-25.jpg)


    [Figure 2-25](#9781430264453_Ch02.xhtml#_Fig25). Designing an MDX query


    When you are done designing the query, it is entered in to the MDX statement box,
    shown in [Figure 2-24](#9781430264453_Ch02.xhtml#Fig24), where you can finish
    importing the data.


    Reusing Existing Connections to Update the Model


    There are two scenarios where you want to reuse an existing connection to a data
    source. You may need to retrieve additional data from a data source; for example,
    you need to get data from additional tables or views or issue a new query. In
    this case, you would choose the existing connections button located on the Home
    tab (see [Figure 2-26](#9781430264453_Ch02.xhtml#Fig26)).


    ![9781430264453_Fig02-26.jpg](Images/9781430264453_Fig02-26.jpg)


    [Figure 2-26](#9781430264453_Ch02.xhtml#_Fig26). Selecting existing connections


    In the Existing Connections window, select the connection and click the Open button
    (see [Figure 2-27](#9781430264453_Ch02.xhtml#Fig27)). This will launch the screens
    (which depend on the connection type), covered previously, where you go through
    the process of selecting the data you want to import.


    ![9781430264453_Fig02-27.jpg](Images/9781430264453_Fig02-27.jpg)


    [Figure 2-27](#9781430264453_Ch02.xhtml#_Fig27). Opening an existing connection


    The other scenario is when you want to change the filtering or add some columns
    to an existing table in the model. In this case, you need to select the table
    in the data view mode of the designer, and on the Design tab, select Table Properties
    (see [Figure 2-28](#9781430264453_Ch02.xhtml#Fig28)).


    ![9781430264453_Fig02-28.jpg](Images/9781430264453_Fig02-28.jpg)


    [Figure 2-28](#9781430264453_Ch02.xhtml#_Fig28). Selecting table properties


    The Edit Table Properties window allows you to update the query used to populate
    the table with data. You can either update the table in the Table Preview mode
    ([Figure 2-29](#9781430264453_Ch02.xhtml#Fig29)) or Query mode ([Figure 2-30](#9781430264453_Ch02.xhtml#Fig30)).
    When in Query Editor mode you can also launch the query designer to update the
    query.


    ![9781430264453_Fig02-29.jpg](Images/9781430264453_Fig02-29.jpg)


    [Figure 2-29](#9781430264453_Ch02.xhtml#_Fig29). Updating the query in Table Preview
    mode


    ![9781430264453_Fig02-30.jpg](Images/9781430264453_Fig02-30.jpg)


    [Figure 2-30](#9781430264453_Ch02.xhtml#_Fig30). Updating the query in Query Editor
    mode


    Now that you have seen how to import the data from various data sources into the
    Power Pivot data model, it is time to get some hands-on experience importing the
    data.


    **HANDS-ON LAB—LOADING DATA** **INTO POWER PIVOT**


    In the following lab you will


    *   Import data from an Access database.

    *   Import data from a text file.


    1.  Open Excel 2013 and create a new file called `LabChapter2.xlsx`

    2.  On the Power Pivot tab, click on the Manage Data Model button (see [Figure
    2-31](#9781430264453_Ch02.xhtml#Fig31)). This launches the Power Pivot Model Designer
    window.


    ![9781430264453_Fig02-31.jpg](Images/9781430264453_Fig02-31.jpg)


    [Figure 2-31](#9781430264453_Ch02.xhtml#_Fig31). Opening the Model Designer window


    3.  On the Home tab in the Get External Data grouping, click on the From Database
    drop-down (see [Figure 2-32](#9781430264453_Ch02.xhtml#Fig32)). In the drop-down
    select From Access. This launches the Table Import Wizard.


    ![9781430264453_Fig02-32.jpg](Images/9781430264453_Fig02-32.jpg)


    [Figure 2-32](#9781430264453_Ch02.xhtml#_Fig32). Launching the Table Import Wizard'
  trans: "\n# 预览和筛选数据\n\n图 2-18 预览数据\n\n选择列标题旁的下拉菜单，可以根据筛选条件限制导入的行数（参见图 2-19）。\n\n\
    ![9781430264453_Fig02-19.jpg](img/9781430264453_Fig02-19.jpg)\n\n图 2-19 筛选导入模型的行\n\
    \n从文本文件导入数据与从 Excel 文件导入数据的主要区别在于，Excel 文件可能包含多个表格。默认情况下，每个工作表都会被视作一个表格（参见图 2-20）。选中表格后，您可以像处理文本文件一样预览和筛选数据。\n\
    \n![9781430264453_Fig02-20.jpg](img/9781430264453_Fig02-20.jpg)\n\n图 2-20 在 Excel\
    \ 文件中选择表格\n\n除了从文本文件导入数据，您可能还需要通过从数据源导入数据来补充数据模型。这正成为一种与业务伙伴交换数据的常见方式，接下来您将了解具体操作方法。\n\
    \n## 从数据源导入数据\n\n尽管文本文件是最流行的数据交换方式之一，但数据源正逐渐成为一种越来越普遍的数据交换方式。数据源通过 Web 服务提供数据，要连接到该\
    \ Web 服务，需要输入其网址。在图 2-17 中，您可以看到可供使用的数据源连接。通常情况下，您会知道合作伙伴或数据提供商提供的数据服务地址。在这种情况下，您可以选择“其他数据源”，系统会弹出一个连接信息输入窗口，如图\
    \ 2-21 所示。\n\n![9781430264453_Fig02-21.jpg](img/9781430264453_Fig02-21.jpg)\n\n\
    图 2-21 连接到数据源\n\n由于数据源不仅包含数据，还包含元数据（数据的描述），因此一旦建立连接，Power Pivot 就会提供预览和筛选数据的功能，如图\
    \ 2-22 所示。\n\n![9781430264453_Fig02-22.jpg](img/9781430264453_Fig02-22.jpg)\n\n\
    图 2-22 预览和筛选来自数据源的数据\n\n您可以使用的几种有趣的数据源包括来自 Reporting Services 报表和 SharePoint 列表的数据。这些应用程序可以轻松地将其数据作为数据源供您使用。此外，许多数据库供应商（如\
    \ SAP）也支持将其数据作为数据源公开。\n\n## 从 OLAP 多维数据集导入数据\n\n许多公司投入了大量资金和精力来构建企业级报表解决方案，其中包括一个企业级\
    \ OLAP 存储库，为各种仪表板和计分卡提供数据。使用 Power Pivot，您可以轻松集成来自这些存储库的数据。在连接窗口的连接选项（图 2-17）中，选择“多维服务”下的“Microsoft\
    \ SQL Server Analysis Services”连接。这将启动连接信息窗口，如图 2-23 所示。您可以连接到多维数据集，也可以连接到发布到\
    \ SharePoint 的 Power Pivot 模型。要连接到多维数据集，请输入服务器名称和数据库名称。要连接到 Power Pivot 模型，请输入\
    \ Excel 工作簿（在 SharePoint 库中）的 URL 和模型名称。\n\n![9781430264453_Fig02-23.jpg](img/9781430264453_Fig02-23.jpg)\n\
    \n图 2-23 连接到 Analysis Services 多维数据集\n\n连接到多维数据集后，您可以输入 MDX 查询来检索数据（参见图 2-24）。请记得验证查询以确保其能够成功运行。\n\
    \n![9781430264453_Fig02-24.jpg](img/9781430264453_Fig02-24.jpg)\n\n图 2-24 输入 MDX\
    \ 查询\n\n如果您不熟悉 MDX，可以使用可视化设计器来创建查询，如图 2-25 所示。设计器的一大特色是能够预览结果。\n\n![9781430264453_Fig02-25.jpg](img/9781430264453_Fig02-25.jpg)\n\
    \n图 2-25 设计 MDX 查询\n\n完成查询设计后，它会进入图 2-24 所示的 MDX 语句框，在那里您可以完成数据导入。\n\n## 重用现有连接以更新模型\n\
    \n在两种情况下您可能需要重用与数据源的现有连接。您可能需要从数据源检索更多数据；例如，您需要从其他表或视图中获取数据，或提交新的查询。此时，应选择“开始”选项卡上的“现有连接”按钮（参见图\
    \ 2-26）。\n\n![9781430264453_Fig02-26.jpg](img/9781430264453_Fig02-26.jpg)\n\n\
    图 2-26 选择现有连接\n\n在“现有连接”窗口中，选择连接并单击“打开”按钮（参见图 2-27）。这将启动之前介绍过的若干屏幕（具体取决于连接类型），在这些屏幕中您可以逐步选择要导入的数据。\n\
    \n![9781430264453_Fig02-27.jpg](img/9781430264453_Fig02-27.jpg)\n\n图 2-27 打开现有连接\n\
    \n另一种情况是，您想要更改模型中现有表的筛选条件或添加一些列。在这种情况下，您需要在设计器的“数据视图”模式下选择该表，然后在“设计”选项卡上选择“表属性”（参见图\
    \ 2-28）。\n\n![9781430264453_Fig02-28.jpg](img/9781430264453_Fig02-28.jpg)\n\n\
    图 2-28 选择表属性\n\n“编辑表属性”窗口允许您更新用于填充该表数据的查询。您可以在“表预览”模式（图 2-29）或“查询”模式（图 2-30）下更新表。在“查询编辑器”模式下，您还可以启动查询设计器来更新查询。\n\
    \n![9781430264453_Fig02-29.jpg](img/9781430264453_Fig02-29.jpg)\n\n图 2-29 在“表预览”模式中更新查询\n\
    \n![9781430264453_Fig02-30.jpg](img/9781430264453_Fig02-30.jpg)\n\n图 2-30 在“查询编辑器”模式中更新查询\n\
    \n现在您已经了解了如何将数据从各种数据源导入到 Power Pivot 数据模型，是时候动手实践一下数据导入了。\n\n## 动手实验——将数据加载到 Power\
    \ Pivot\n\n在以下实验中，您将：\n\n*   从 Access 数据库导入数据。\n*   从文本文件导入数据。\n\n1.  打开 Excel\
    \ 2013 并创建一个名为 `LabChapter2.xlsx` 的新文件。\n2.  在 Power Pivot 选项卡上，单击“管理数据模型”按钮（参见图\
    \ 2-31）。这将启动 Power Pivot 模型设计器窗口。\n\n    ![9781430264453_Fig02-31.jpg](img/9781430264453_Fig02-31.jpg)\n\
    \n    图 2-31 打开模型设计器窗口\n\n3.  在“开始”选项卡的“获取外部数据”组中，单击“从数据库”下拉菜单（参见图 2-32）。在下拉菜单中选择“从\
    \ Access 导入”。这将启动“表导入向导”。\n\n    ![9781430264453_Fig02-32.jpg](img/9781430264453_Fig02-32.jpg)\n\
    \n    图 2-32 启动表导入向导\n"
- fmt: "4.  浏览 Lab Starters 文件夹中的`Northwind.acdb`数据库文件并测试连接。使用友好的连接名称`Access Northwind`。此数据库不需要用户名和密码（参见[图\
    \ 2-33](#9781430264453_Ch02.xhtml#Fig33)）。单击“测试连接”进入下一个窗口。\n\n   ![9781430264453_Fig02-33.jpg](Images/9781430264453_Fig02-33.jpg)\n\
    \n   [Figure 2-33](#9781430264453_Ch02.xhtml#_Fig33). 连接到 Access 数据库\n\n5.  导入数据有两个选项：可以从表列表和视图中选择，也可以编写查询来选择数据。这里选择“从表列表和视图中选择”。\n\
    6.  在“选择表和视图”窗口中，选择`Customers`并单击该行以高亮显示。在窗口底部，选择“预览和筛选”按钮来预览和筛选数据（参见[图 2-34](#9781430264453_Ch02.xhtml#Fig34)）。\n\
    \n   ![9781430264453_Fig02-34.jpg](Images/9781430264453_Fig02-34.jpg)\n\n   [Figure\
    \ 2-34](#9781430264453_Ch02.xhtml#_Fig34). 选择要导入的表\n\n7.  在`Customers`表中，选择以下字段：`ID`、`Company`、`Last\
    \ Name`、`First Name`、`City`、`State/Province`和`Country/Region`。取消选中其余字段（参见[图 2-35](#9781430264453_Ch02.xhtml#Fig35)）。选中左上角的复选框将选择或取消选择所有列。\n\
    \n   ![9781430264453_Fig02-35.jpg](Images/9781430264453_Fig02-35.jpg)\n\n   [Figure\
    \ 2-35](#9781430264453_Ch02.xhtml#_Fig35). 筛选表列\n\n8.  从`Employees`表中选择以下字段：`ID`、`Last\
    \ Name`、`First Name`和`Job Title`。\n9.  从`Orders`表中选择以下字段：`Order ID`、`Employee\
    \ ID`、`Customer ID`、`Order Date`、`Shipped Date`、`Shipper ID`、`Payment Type`和`Paid\
    \ Date`。在`Status ID`列上，单击下拉菜单以筛选数据。取消勾选状态`0`和状态`2`。状态`3`表示“已关闭”状态（参见[图 2-36](#9781430264453_Ch02.xhtml#Fig36)）。\n\
    \n   ![9781430264453_Fig02-36.jpg](Images/9781430264453_Fig02-36.jpg)\n\n   [Figure\
    \ 2-36](#9781430264453_Ch02.xhtml#_Fig36). 筛选表行\n\n10. 选择完表后，单击“完成”按钮导入数据。导入后，关闭向导。您应该会在“数据视图”窗口中看到每个表都作为一个选项卡显示（参见[图\
    \ 2-37](#9781430264453_Ch02.xhtml#Fig37)）。\n\n   ![9781430264453_Fig02-37.jpg](Images/9781430264453_Fig02-37.jpg)\n\
    \n   [Figure 2-37](#9781430264453_Ch02.xhtml#_Fig37). 数据视图窗口中的表\n\n11. 接下来，您将使用查询来选择订单详细信息。在\
    \ Power Pivot 模型设计器中，选择“开始”选项卡。在“开始”选项卡中，选择“现有连接”按钮。在连接窗口中，选择`Access Northwind`连接，然后单击“打开”。\n\
    12. 这次，选择“编写查询以指定要导入的数据”。\n13. 在“指定查询”窗口中，将查询命名为`OrderDetails`，然后选择“设计”按钮以启动查询设计器。（您也可以不使用设计器直接编写查询。）在查询设计器中，选择“导入”，然后选择\
    \ Lab Starters 文件夹中的`OrderDetailQuery.txt`。通过单击红色感叹号（`!`）标记来测试查询（参见[图 2-38](#9781430264453_Ch02.xhtml#Fig38)）。测试查询后，单击“确定”按钮。\n\
    \n   ![9781430264453_Fig02-38.jpg](Images/9781430264453_Fig02-38.jpg)\n\n   [Figure\
    \ 2-38](#9781430264453_Ch02.xhtml#_Fig38). 使用查询获取数据\n\n14. 在“表导入向导”中，单击“完成”按钮导入数据。导入后，关闭向导。您应该会看到已添加了一个`OrderDetail`表选项卡。\n\
    15. 最后一个要导入的表包含在一个制表符分隔的文本文件中。在“开始”选项卡的“获取外部数据”部分，单击“其他来源”按钮。在数据源列表中，选择“文本文件”，然后单击“下一步”。\n\
    16. 在连接信息中，将连接名称更改为`Product`。在“文件路径”中，浏览到 Lab Starters 文件夹中的`ProductList.txt`文件。选择制表位列分隔符，并勾选“将第一行用作列标题”复选框。单击“完成”按钮导入数据（参见[图\
    \ 2-39](#9781430264453_Ch02.xhtml#Fig39)）。\n\n   ![9781430264453_Fig02-39.jpg](Images/9781430264453_Fig02-39.jpg)\n\
    \n   [Figure 2-39](#9781430264453_Ch02.xhtml#_Fig39). 从文本文件导入数据\n\n17. 导入后，关闭向导，您应该会看到已添加了一个`Product`表选项卡。\n\
    18. 完成后，保存文件并关闭 Excel。\n\n## 总结\n\n创建 Power Pivot 模型的第一步是导入数据。在本章中，您学习了如何从各种数据源导入数据。Power\
    \ Pivot 中导入数据的一个优点是，从不同数据源导入数据的体验是相似的。您需要创建连接、提供查询或选择表、预览和筛选数据，然后将其导入模型。现在您已将数据导入模型中的各个表，接下来需要在这些表之间建立关系。在下一章中，您将学习建立关系的重要性，以及如何使用层次结构来增强模型以辅助数据分析。\n\
    \n# 第 3 章\n\n![image](Images/frontdot.jpg)\n\n# 创建数据模型\n\n既然您已经知道如何将数据导入 Power\
    \ Pivot 模型，下一步就是理解什么是一个好的模型。这在处理 Power Pivot 中的数据时非常重要。一个好的模型将使 Power Pivot 运行得异常快速，并允许您以新颖且有趣的方式分析数据。而一个糟糕的模型会导致\
    \ Power Pivot 运行非常缓慢，最糟糕的是，在执行数据分析时可能会给出误导性的结果。传统的 Excel 数据透视表基于 Excel 工作表中的单个表。而\
    \ Power Pivot 数据透视表则基于数据模型中的多个表。本章将指导您创建稳健模型的过程，该模型将成为数据分析的基础。此外，您还将了解如何向客户端工具呈现一个用户友好的模型。这包括重命名表和字段、呈现适当的数据类型以及隐藏无关的字段。\n\
    \n完成本章后，您将能够：\n\n*   解释什么是数据模型\n*   在模型中的表之间创建关系\n*   创建并使用星型架构\n*   理解何时以及如何对数据进行反规范化\n\
    *   创建并使用链接表\n*   创建并使用层次结构\n*   创建用户友好的模型\n\n## 什么是数据模型？\n\n从根本上说，数据模型由表、列、数据类型和表关系组成。通常，数据表被构造为保存某个业务实体的数据；例如，客户数据包含在客户表中，员工数据包含在员工表中。表由定义实体属性的列组成。例如，您可能希望保存有关客户的信息，例如姓名、地址、出生日期、家庭规模等。每个属性都有一个数据类型，具体取决于该属性保存的信息类型——姓名是字符串数据类型，家庭规模是整数，出生日期是日期。表中的每一行都应该是唯一的。以客户表为例，如果同一个客户出现在多个行中并具有不同的属性（例如出生日期），您将无法判断哪个是正确的。"
