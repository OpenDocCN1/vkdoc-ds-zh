  trans: '

    虽然堆积柱形图显示的是绝对值，但您可以将其改为 100% 堆积图，以百分比形式显示相对值。在图 9-14 中，`Country` 字段被移到了图例中，`Year`
    字段则放置在坐标轴上。同时，该图还将数据标签设置为 `Visible`（可见），以便于比较。


    ![9781430264453_Fig09-14.jpg](img/9781430264453_Fig09-14.jpg)


    图 9-14. 创建一个 100% 堆积柱形图


    簇状柱形图会将不同国家的柱形并排显示，而不是将它们堆叠在一起。图 9-15 与图 9-13 展示的是相同的信息，但以簇状柱形图的形式呈现。


    ![9781430264453_Fig09-15.jpg](img/9781430264453_Fig09-15.jpg)


    图 9-15. 创建一个簇状柱形图


    虽然您无法对图表的布局进行太多控制，但可以在 `Design`（设计）选项卡上控制标题、图例和数据标签（请参阅图 9-16）。


    ![9781430264453_Fig09-16.jpg](img/9781430264453_Fig09-16.jpg)


    图 9-16. 控制图例布局


    与大多数可视化图表一样，在 Power View 中您可以获得自动筛选和排序功能。例如，如果将鼠标悬停在图 9-15 中图表的左上角，您将看到排序选项，可以改为按
    Internet 销售额排序，而不是按国家/地区名称排序（请参阅图 9-17）。


    ![9781430264453_Fig09-17.jpg](img/9781430264453_Fig09-17.jpg)


    图 9-17. 更改柱形图的排序方式


    饼图与堆积柱形图或堆积条形图类似，它们都允许您比较某个类别中各成员的度量值，以及该类别的总计值。图 9-18 展示了一个饼图，用于比较不同类型分销商的销售额。


    ![9781430264453_Fig09-18.jpg](img/9781430264453_Fig09-18.jpg)


    图 9-18. 使用饼图比较数据


    与柱形图和条形图一样，您对饼图布局的控制也非常有限，仅限于标题和图例的位置。在撰写本文时，饼图甚至不支持数据标签，这确实令人遗憾。


    虽然条形图、柱形图和饼图非常适合比较不同类别的聚合数据，但如果您想发现数据中的趋势，折线图和散点图是更好的选择。接下来您将探讨这些图表类型。


    ## 构建折线图和散点图


    折线图用于观察相等时间段内的趋势。这些时间段通常是时间单位，例如小时、天、月等。时间周期绘制在 x 轴上，度量值绘制在 y 轴上。图 9-19 显示了一天中各小时的航班延误分钟数。每条线代表不同的航空公司。使用此图表，您可以轻松发现一天中的趋势，并比较航空公司的表现。


    ![9781430264453_Fig09-19.jpg](img/9781430264453_Fig09-19.jpg)


    图 9-19. 使用折线图发现趋势


    如果您需要同时比较两个度量值的趋势，可以使用散点图。散点图将一个度量值绘制在 y 轴上，另一个绘制在 x 轴上。要创建散点图，请先创建一个包含一个类别字段和两个数值字段的表格——例如，分销商名称（类别）、销售额（数值）和销售利润（数值）。创建表格后，将可视化效果切换到散点图，该图位于
    `Design`（设计）选项卡下的 `Other Chart`（其他图表）下拉菜单中。图 9-20 显示了生成的散点图。


    ![9781430264453_Fig09-20.jpg](img/9781430264453_Fig09-20.jpg)

    '
- fmt: '### 散点图中的数据比较


    使用散点图可以轻松发现趋势以及不遵循趋势的离群值。


    查看散点图的字段放置区域（参见图9-21），您会看到“大小”和“颜色”两个放置区域。您可以将另一个度量添加到“大小”放置框中，并将另一个类别添加到“颜色”放置框中。


    ![9781430264453_Fig09-21.jpg](Images/9781430264453_Fig09-21.jpg)


    **图9-21.** 为散点图添加大小和颜色


    一旦为散点图添加了大小轴，它就会变成气泡图。图9-22显示了一个气泡图，其中气泡的大小代表经销商的员工数量，颜色代表经销商的业务类型。


    ![9781430264453_Fig09-22.jpg](Images/9781430264453_Fig09-22.jpg)


    **图9-22.** 气泡图中的数据比较


    如果查看散点图的放置区域，您应该会看到另一个标记为“播放轴”的放置框。您可以将一个基于时间的字段拖入此框，这会导致在散点图下方出现一个播放轴。播放轴允许您查看度量值随时间的变化情况。它允许您在进行分析时播放、暂停和回溯这些变化。如果您单击图表中的一个气泡，可以看到随时间发生的变化轨迹。图9-23显示了一个可用于分析产品销售额随时间变化情况的散点图。


    ![9781430264453_Fig09-23.jpg](Images/9781430264453_Fig09-23.jpg)


    **图9-23.** 为散点图添加播放轴


    除了用于比较数据的标准可视化效果外，Power View 还允许您使用 Bing 地图从地理角度查看数据。您将在下一节中了解如何创建基于地图的可视化效果。


    ### 创建基于地图的可视化效果


    Power View 的一个不错的功能是它可以使用 Bing 地图图块来创建可视化效果。如果您的数据包含地理字段（例如城市、州/省和国家/地区），则非常容易将数据整合到地图中。您可以通过字段列表中的地球图标来判断一个字段是否可以被地理位置定位（参见图9-24）。


    ![9781430264453_Fig09-24.jpg](Images/9781430264453_Fig09-24.jpg)


    **图9-24.** 地球图标表示可以映射的字段


    要创建地图，首先创建一个包含地理空间字段和您想要在地图上查看的度量的表格。创建好表格后，您可以将其切换为地图。地图上的位置会显示为气泡，其大小表示度量值的大小。图9-25显示了按城市划分的销售额，地图已放大到加利福尼亚州旧金山地区。


    ![9781430264453_Fig09-25.jpg](Images/9781430264453_Fig09-25.jpg)


    **图9-25.** 在地图上查看数据


    如果您查看地图的字段放置区域，应该会看到“经度”和“纬度”放置框；这允许您在地图上创建精确的位置点。还有一个“颜色”放置区域，您可以在其中放置一个类别字段。这会将地图上的气泡转换为显示每个类别的饼图（参见图9-26）。


    ![9781430264453_Fig09-26.jpg](Images/9781430264453_Fig09-26.jpg)


    **图9-26.** 为地图添加类别


    现在您已经了解了如何创建 Power View 中可用的各种可视化效果，是时候通过动手练习来创建一些可视化效果了。


    ### 动手实验——在 Power View 中创建标准可视化效果


    在以下实验中，您将：


    *   创建条形图、柱形图和饼图。

    *   创建折线图和散点图。

    *   创建基于地图的可视化效果。'
  raw: '[Figure 9-20](#9781430264453_Ch09.xhtml#_Fig20). Comparing data in a scatter
    chart


    Using the scatter chart you can easily spot trends and outliers that do not follow
    the trend.


    If you look at the Field drop area for the scatter chart (see [Figure 9-21](#9781430264453_Ch09.xhtml#Fig21)),
    you see both a Size and a Color drop area. You can add another measure to the
    Size drop box and another category to the Color drop box.


    ![9781430264453_Fig09-21.jpg](Images/9781430264453_Fig09-21.jpg)


    [Figure 9-21](#9781430264453_Ch09.xhtml#_Fig21). Adding size and color to a scatter
    chart


    Once you add the size axis to the scatter chart, it becomes a bubble chart. [Figure
    9-22](#9781430264453_Ch09.xhtml#Fig22) shows a bubble chart where the size of
    the bubble represents the number of employees of the reseller and the color represents
    the reseller’s business type.


    ![9781430264453_Fig09-22.jpg](Images/9781430264453_Fig09-22.jpg)


    [Figure 9-22](#9781430264453_Ch09.xhtml#_Fig22). Comparing data in a bubble chart


    If you take a look at the drop area for the scatter chart, you should see another
    drop box labeled Play Axis. You can drop a time-based field in this box, which
    results in a play axis being placed below the scatter chart. The *play axis* allows
    you to look at how the measures vary over time. It allows you to play, pause,
    and retrace the changes as you perform your analysis. If you click on one of the
    bubbles in the chart, you can see a trace of the changes that occurred over the
    time period. [Figure 9-23](#9781430264453_Ch09.xhtml#Fig23) shows a scatter chart
    that can be used to analyze how sales of products compare over time.


    ![9781430264453_Fig09-23.jpg](Images/9781430264453_Fig09-23.jpg)


    [Figure 9-23](#9781430264453_Ch09.xhtml#_Fig23). Adding a play axis to a scatter
    chart


    In addition to the standard visualizations for comparing data, Power View allows
    you to look at data geographically using Bing Maps. You will see how to create
    map-based visualizations in the next section.


    Creating Map-Based Visualizations


    One of the nice features of Power View is that it can use Bing Maps tiles to create
    visualizations. If your data contains a geographic field such as city, state/province,
    and country, it is very easy to incorporate the data into a map. You can tell
    whether a field can be geolocated by a globe icon in the Field List (see [Figure
    9-24](#9781430264453_Ch09.xhtml#Fig24)).


    ![9781430264453_Fig09-24.jpg](Images/9781430264453_Fig09-24.jpg)


    [Figure 9-24](#9781430264453_Ch09.xhtml#_Fig24). The globe icon indicates fields
    that can be mapped


    To create the map, first create a table with the geospatial field and the measure
    you want to see on the map. Once you have the table created, you can switch it
    to a map. The locations show up on the map as bubbles whose size indicates the
    value of the measure. [Figure 9-25](#9781430264453_Ch09.xhtml#Fig25) shows sales
    by city where the map is zoomed in to the San Francisco, California area.


    ![9781430264453_Fig09-25.jpg](Images/9781430264453_Fig09-25.jpg)


    [Figure 9-25](#9781430264453_Ch09.xhtml#_Fig25). Viewing data on a map


    If you look at the field drop areas of the map, you should see Longitude and Latitude
    drop boxes; this allows you to create precise location points on the map. There
    is also a color drop area where you can drop a category field. This will convert
    the bubbles on the map into pie charts showing each category (see [Figure 9-26](#9781430264453_Ch09.xhtml#Fig26)).


    ![9781430264453_Fig09-26.jpg](Images/9781430264453_Fig09-26.jpg)


    [Figure 9-26](#9781430264453_Ch09.xhtml#_Fig26). Adding a category to the map


    Now that you have seen how to create the various visualizations available in Power
    View, it is time to get some hands-on experience creating a few.


    HANDS-ON LAB—CREATING STANDARD VISUALIZATIONS IN POWER VIEW


    In the following lab you will


    *   Create a bar, column, and pie chart.

    *   Create a line and scatter graph.

    *   Create a map-based visualization.'
  trans: '

    ### 散点图中的数据比较


    使用散点图可以轻松发现趋势以及不遵循趋势的离群值。


    查看散点图的字段放置区域（参见图 9-21），您会看到“大小”和“颜色”两个放置区域。您可以将另一个度量添加到“大小”放置框中，并将另一个类别添加到“颜色”放置框中。


    ![9781430264453_Fig09-21.jpg](img/9781430264453_Fig09-21.jpg)


    **图 9-21.** 为散点图添加大小和颜色


    一旦为散点图添加了大小轴，它就会变成气泡图。图 9-22 显示了一个气泡图，其中气泡的大小代表经销商的员工数量，颜色代表经销商的业务类型。


    ![9781430264453_Fig09-22.jpg](img/9781430264453_Fig09-22.jpg)


    **图 9-22.** 气泡图中的数据比较


    如果查看散点图的放置区域，您应该会看到另一个标记为“播放轴”的放置框。您可以将一个基于时间的字段拖入此框，这会导致在散点图下方出现一个播放轴。播放轴允许您查看度量值随时间的变化情况。它允许您在进行分析时播放、暂停和回溯这些变化。如果您单击图表中的一个气泡，可以看到随时间发生的变化轨迹。图
    9-23 显示了一个可用于分析产品销售额随时间变化情况的散点图。


    ![9781430264453_Fig09-23.jpg](img/9781430264453_Fig09-23.jpg)


    **图 9-23.** 为散点图添加播放轴


    除了用于比较数据的标准可视化效果外，Power View 还允许您使用 Bing 地图从地理角度查看数据。您将在下一节中了解如何创建基于地图的可视化效果。


    ### 创建基于地图的可视化效果


    Power View 的一个不错的功能是它可以使用 Bing 地图图块来创建可视化效果。如果您的数据包含地理字段（例如城市、州/省和国家/地区），则非常容易将数据整合到地图中。您可以通过字段列表中的地球图标来判断一个字段是否可以被地理位置定位（参见图
    9-24）。


    ![9781430264453_Fig09-24.jpg](img/9781430264453_Fig09-24.jpg)


    **图 9-24.** 地球图标表示可以映射的字段


    要创建地图，首先创建一个包含地理空间字段和您想要在地图上查看的度量的表格。创建好表格后，您可以将其切换为地图。地图上的位置会显示为气泡，其大小表示度量值的大小。图
    9-25 显示了按城市划分的销售额，地图已放大到加利福尼亚州旧金山地区。


    ![9781430264453_Fig09-25.jpg](img/9781430264453_Fig09-25.jpg)


    **图 9-25.** 在地图上查看数据


    如果您查看地图的字段放置区域，应该会看到“经度”和“纬度”放置框；这允许您在地图上创建精确的位置点。还有一个“颜色”放置区域，您可以在其中放置一个类别字段。这会将地图上的气泡转换为显示每个类别的饼图（参见图
    9-26）。


    ![9781430264453_Fig09-26.jpg](img/9781430264453_Fig09-26.jpg)


    **图 9-26.** 为地图添加类别


    现在您已经了解了如何创建 Power View 中可用的各种可视化效果，是时候通过动手练习来创建一些可视化效果了。


    ### 动手实验——在 Power View 中创建标准可视化效果


    在以下实验中，您将：


    *   创建条形图、柱形图和饼图。

    *   创建折线图和散点图。

    *   创建基于地图的可视化效果。

    '
- fmt: '1.  In the `LabStarters` folder, open the `LabChapter9.xlsx` file. This file
    contains sales data from the test AdventureWorks database.

    2.  Select the Insert tab in Excel and click on the Power View button. This will
    insert a Power View report sheet in the workbook.

    3.  Create a table that lists sales by territory or country and reseller sales.

    4.  With the table selected on the Power View sheet, switch the visualization
    to a clustered bar chart. Resize the chart. It should look similar to [Figure
    9-27](#9781430264453_Ch09.xhtml#Fig27).


    ![9781430264453_Fig09-27.jpg](Images/9781430264453_Fig09-27.jpg)


    [Figure 9-27](#9781430264453_Ch09.xhtml#_Fig27). Creating a bar chart


    5.  With the bar chart selected, drag and drop the Reseller Business Type to the
    Legend drop box. The chart now displays a bar for each business type grouped by
    country.

    6.  Switch the chart to a 100% stacked bar chart. Under the Layout tab, change
    the setting to show the data labels. The chart should look like [Figure 9-28](#9781430264453_Ch09.xhtml#Fig28).


    ![9781430264453_Fig09-28.jpg](Images/9781430264453_Fig09-28.jpg)


    [Figure 9-28](#9781430264453_Ch09.xhtml#_Fig28). Creating a 100% stacked bar chart


    7.  On the Power View tab, click on the Power View button to insert a new Power
    View sheet. Create a stacked column chart that shows reseller sales profit by
    year and category. Your chart should look similar to [Figure 9-29](#9781430264453_Ch09.xhtml#Fig29).


    ![9781430264453_Fig09-29.jpg](Images/9781430264453_Fig09-29.jpg)


    [Figure 9-29](#9781430264453_Ch09.xhtml#_Fig29). Creating a stacked column chart


    8.  Add a new Power View sheet. On this sheet, create a table that shows department
    names and average vacation hours. You will need to change the vacation hours from
    Sum to Average in the Fields drop area.

    9.  Switch the visualization to a pie chart. Under the chart Filters area, limit
    the chart to the Information Services, Marketing, Purchasing, and Sales departments.
    The chart should look similar to [Figure 9-30](#9781430264453_Ch09.xhtml#Fig30).


    ![9781430264453_Fig09-30.jpg](Images/9781430264453_Fig09-30.jpg)


    [Figure 9-30](#9781430264453_Ch09.xhtml#_Fig30). Creating a pie chart


    10.  To create a line chart, add a new Power View sheet and create a table containing
    month name and Internet sales amount. Switch the visualization to a line chart.
    Add the customer’s country to the Legend drop area. The final chart should look
    like [Figure 9-31](#9781430264453_Ch09.xhtml#Fig31). Notice the United States
    and Australia have peaks whereas the others are pretty steady.


    ![9781430264453_Fig09-31.jpg](Images/9781430264453_Fig09-31.jpg)


    [Figure 9-31](#9781430264453_Ch09.xhtml#_Fig31). Comparing data in a line chart


    11.  To create a scatter chart, add a new Power View sheet and create a table
    containing `ResellerName`, `ResellerSalesProfit`, and `ResellerSales`. Change
    the table to a scatter chart. Add the business type to the Color drop box.

    12.  Drag the `SalesTerritoryCountry` to the Chart Filters area and limit the
    chart so it will just show Germany. Create a play axis using the `MonthYear`.
    Using the play axis, determine who, when, and how much for the greatest profit
    loss. You should end up with a visualization similar to what appears in [Figure
    9-32](#9781430264453_Ch09.xhtml#Fig32).


    ![9781430264453_Fig09-32.jpg](Images/9781430264453_Fig09-32.jpg)


    [Figure 9-32](#9781430264453_Ch09.xhtml#_Fig32). Using a scatter chart with a
    play axis to determine the greatest profit


    13.  To create a map-based visualization, insert a new Power View sheet into the
    workbook. Create a table using the customer `FullName` and customer `StateProvince`.
    Switch the table to a map and drag the `Full Name` field from the Color drop box
    to the Size drop box and change the aggregation to Distinct Count.

    14.  Drag the `HouseOwnerFlag` to the Color drop box. Zoom in to the western United
    States; your map should look similar to [Figure 9-33](#9781430264453_Ch09.xhtml#Fig33).


    ![9781430264453_Fig09-33.jpg](Images/9781430264453_Fig09-33.jpg)'
