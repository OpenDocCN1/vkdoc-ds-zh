    This is how you define hierarchies for a table.


    ![9781430264453_Fig01-18.jpg](Images/9781430264453_Fig01-18.jpg)


    [Figure 1-18](#9781430264453_Ch01.xhtml#_Fig18). Creating a hierarchy


