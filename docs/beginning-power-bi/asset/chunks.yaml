    \ functions\n\n[Figure 7-24](#9781430264453_Ch07.xhtml#Fig24) shows the table\
    \ after the conversion to cube functions. It uses the `CUBEMEMBER` function to\
    \ return a member or tuple (ordered list) from the cube and the `CUBEVALUE` function\
    \ to return an aggregated value from the cube.\n\n![9781430264453_Fig07-24.jpg](Images/9781430264453_Fig07-24.jpg)\n\
    \n[Figure 7-24](#9781430264453_Ch07.xhtml#_Fig24). Using cube functions to retrieve\
    \ values\n\nThe following formula is used to return the column label for cell\
    \ C3:\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Geography].[CountryRegionCode].&[AU]\"\
    )\n```\n\nThe first parameter is the name of the connection to the data model\
    \ and the second parameter is the member expression.\n\nThe value in cell C4 is\
    \ returned using the following formula:\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,$B$2,$B4,C$3)\n```\n\nThis formula uses cell references, but you can replace\
    \ these with the cube functions contained in these cells:\n\n```\n=CUBEVALUE\n\
    (\n    \"ThisWorkbookDataModel\",\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\"\
    [Measures].[Sum of SalesAmount]\"),\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"),\n    CUBEMEMBER(\"\
    ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\")\n\
    )\n```\n\nNotice one of the parameters is the `CUBEMEMBER` function returning\
    \ the aggregation you want the value of; the other parameters use the `CUBEMEMBER`\
    \ to define the portion of the cube used in the aggregation.\n\n![9781430264453_Fig07-25.jpg](Images/9781430264453_Fig07-25.jpg)\n\
    \n[Figure 7-25](#9781430264453_Ch07.xhtml#_Fig25). Rearranging the data\n\nYou\
    \ can now rearrange the values and labels to achieve the layout and formatting\
    \ that you need (see [Figure 7-25](#9781430264453_Ch07.xhtml#Fig25)).\n\nHANDS-ON\
    \ LAB—CREATING THE BI INTERFACE IN EXCEL\n\nIn the following lab you will\n\n\
    *   Add conditional formatting to a pivot table.\n*   Create a chart to help analyze\
    \ data.\n*   Link together pivot tables and pivot charts.\n*   Use cube functions\
    \ to display model data.\n\n1.  In the LabStarters folder, open the `LabChapter7.xlsx`\
    \ file. This file contains inventory and sales data from the test AdventureWorksDW\
    \ database.\n2.  In Excel Sheet1 insert a Power Pivot table using the PivotTable\
    \ button on the Insert tab. Select the Use An External Data Source and click the\
    \ Choose Connection button. On the Tables tab of the Existing Connections window,\
    \ select Tables In Workbook Data Model (see [Figure 7-26](#9781430264453_Ch07.xhtml#Fig26)).\n\
    \n![9781430264453_Fig07-26.jpg](Images/9781430264453_Fig07-26.jpg)\n\n[Figure\
    \ 7-26](#9781430264453_Ch07.xhtml#_Fig26). Selecting the connection\n\n3.  Add\
    \ TotalQuantity, TotalSales, and TotalMargin from the ResellerSales table to the\
    \ Values drop area in the Field List window. Add the Calendar hierarchy to Row\
    \ Labels drop area.\n4.  Notice that some of the margins are negative. To bring\
    \ attention to the negative values you are going to format them in red.\n5.  Select\
    \ a TotalMargin cell in the pivot table. On the Home tab, click the Conditional\
    \ Formatting drop down. Select the Highlight Cells ![image](Images/arrow.jpg)\
    \ Less Than option. Format the cells that are less than 0 with red text (see [Figure\
    \ 7-27](#9781430264453_Ch07.xhtml#Fig27)).\n\n![9781430264453_Fig07-27.jpg](Images/9781430264453_Fig07-27.jpg)\n\
    \n[Figure 7-27](#9781430264453_Ch07.xhtml#_Fig27). Setting conditional formatting\n\
    \n6.  When finished you should see an icon next to the selected cell. Click it\
    \ and select the All Cells Showing TotalMargin Values option.\n7.  Select one\
    \ of the TotalSales cells. This time, select the Data Bars under the Conditional\
    \ Formatting drop-down. Select one of the gradient styles. After selecting the\
    \ Data Bar, you should see a small icon next to the values. Click it and select\
    \ the All Cells Showing TotalSales Values.\n8.  Your Pivot table should look similar\
    \ to [Figure 7-28](#9781430264453_Ch07.xhtml#Fig28). Expand the years and notice\
    \ the formatting shows up for the quarters, months, and years.\n\n![9781430264453_Fig07-28.jpg](Images/9781430264453_Fig07-28.jpg)\n\
    \n[Figure 7-28](#9781430264453_Ch07.xhtml#_Fig28). Adding data bars to the pivot\
    \ table"
  trans: "\n在创建数据透视表和图表以展示和理解数据时，您通常希望构建一个能轻松确定绩效的仪表板。您可能关注销售绩效、网络性能或流水线表现。仪表板将关键绩效指标（KPI）、图形和图表等可视化表现形式整合为流程的整体视图。虽然从技术上讲它们并非仪表板工具，但您可以使用\
    \ Excel 结合 Power Pivot 数据透视表和图表创建非常引人注目的数据展示，然后可在 SharePoint 中展示和共享这些数据。\n\n向仪表板添加多个图表和表格时，您可能希望将它们链接起来，以便用不同方式呈现相同的数据。您还很可能希望通过相同的切片器来控制它们，使其保持同步。最简单的方法是使用`插入`选项卡并选择`数据透视图和数据透视表`进行添加（参见图\
    \ 7-19）。\n\n![9781430264453_Fig07-19.jpg](img/9781430264453_Fig07-19.jpg)\n\n\
    图 7-19。添加数据透视图和相关数据透视表\n\n通过这种方式添加数据透视图和数据透视表，会在它们之间建立链接，以便当您向其中一个添加字段时，也会向另一个添加相同的字段。此外，当您向页面添加切片器时，它会自动将切片器同时连接到数据透视表和数据透视图。图\
    \ 7-20 展示了一个简单的仪表板，其中包含一个链接的数据透视表、数据透视图和切片器。\n\n![9781430264453_Fig07-20.jpg](img/9781430264453_Fig07-20.jpg)\n\
    \n图 7-20。在 Excel 中创建简单仪表板\n\n如果需要连接多个图表，请打开模型设计器，然后在`开始`选项卡上选择`数据透视表`下拉菜单（参见图\
    \ 7-21）。这还允许您插入平面数据透视表，这对于打印非常有用。\n\n![9781430264453_Fig07-21.jpg](img/9781430264453_Fig07-21.jpg)\n\
    \n图 7-21。连接多个数据透视图\n\n## 使用多维数据集函数\n\n使用 Excel 内置的`数据透视图`和`数据透视表`布局，您可以创建引人注目的仪表板，并为数据浏览提供出色的界面。然而，有时您可能会对这些结构固有的某些局限性感到沮丧。例如，您无法在数据透视表内部插入自己的列来创建自定义计算。您也可能希望以非表格格式显示数据以生成自定义报告。这正是\
    \ Excel 多维数据集函数大显身手的地方。\n\nExcel 多维数据集函数允许您直接连接到 Power Pivot 数据模型，而无需使用数据透视表。这些多维数据集函数是\
    \ Excel 函数（与 DAX 函数相对），可以在`Excel 公式`选项卡的`其他函数`下拉菜单中找到（参见图 7-22）。\n\n![9781430264453_Fig07-22.jpg](img/9781430264453_Fig07-22.jpg)\n\
    \n图 7-22。使用多维数据集函数连接到模型\n\n了解这些函数用法的最简单方法是创建一个数据透视表，然后在`数据透视表工具 分析`选项卡上，选择`OLAP\
    \ 工具`下拉菜单，再选择`转换为公式`选项（参见图 7-23）。\n\n![9781430264453_Fig07-23.jpg](img/9781430264453_Fig07-23.jpg)\n\
    \n图 7-23。将数据透视表转换为多维数据集函数\n\n图 7-24 显示了转换为多维数据集函数后的表格。它使用 `CUBEMEMBER` 函数从多维数据集返回一个成员或元组（有序列表），并使用\
    \ `CUBEVALUE` 函数从多维数据集返回一个聚合值。\n\n![9781430264453_Fig07-24.jpg](img/9781430264453_Fig07-24.jpg)\n\
    \n图 7-24。使用多维数据集函数检索值\n\n以下公式用于返回单元格 C3 的列标签：\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Geography].[CountryRegionCode].&[AU]\")\n```\n\n第一个参数是数据模型连接的名称，第二个参数是成员表达式。\n\
    \n单元格 C4 中的值通过以下公式返回：\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\",$B$2,$B4,C$3)\n\
    ```\n\n此公式使用了单元格引用，但您可以将这些引用替换为这些单元格中包含的多维数据集函数：\n\n```\n=CUBEVALUE\n(\n    \"\
    ThisWorkbookDataModel\",\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Measures].[Sum\
    \ of SalesAmount]\"),\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"\
    ),\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\"\
    )\n)\n```\n\n请注意，其中一个参数是返回您所需值的聚合值的 `CUBEMEMBER` 函数；其他参数使用 `CUBEMEMBER` 来定义用于聚合的多维数据集部分。\n\
    \n![9781430264453_Fig07-25.jpg](img/9781430264453_Fig07-25.jpg)\n\n图 7-25。重新排列数据\n\
    \n现在，您可以重新排列值和标签，以获得所需的布局和格式（参见图 7-25）。\n\n## 动手实验——在 Excel 中创建 BI 界面\n\n在以下实验中，您将：\n\
    \n*   向数据透视表添加条件格式。\n*   创建图表以帮助分析数据。\n*   链接数据透视表和数据透视图。\n*   使用多维数据集函数显示模型数据。\n\
    \n1.  在 `LabStarters` 文件夹中，打开 `LabChapter7.xlsx` 文件。该文件包含来自测试 AdventureWorksDW\
    \ 数据库的库存和销售数据。\n2.  在 Excel 的 Sheet1 中，使用`插入`选项卡上的`数据透视表`按钮插入一个 Power Pivot 表格。选择`使用外部数据源`，然后单击`选择连接`按钮。在`现有连接`窗口的`表格`选项卡上，选择`工作簿数据模型中的表格`（参见图\
    \ 7-26）。\n\n![9781430264453_Fig07-26.jpg](img/9781430264453_Fig07-26.jpg)\n\n\
    图 7-26。选择连接\n\n3.  将 `ResellerSales` 表中的 `TotalQuantity`、`TotalSales` 和 `TotalMargin`\
    \ 添加到`字段列表`窗口的`值`拖放区域。将 `Calendar` 层次结构添加到`行标签`拖放区域。\n4.  请注意，有些利润是负值。为了突出显示负值，您将把它们格式化为红色。\n\
    5.  选择数据透视表中的一个 `TotalMargin` 单元格。在`开始`选项卡上，单击`条件格式`下拉菜单。选择`突出显示单元格`![image](img/arrow.jpg)`小于`选项。将小于\
    \ 0 的单元格格式化为红色文本（参见图 7-27）。\n\n![9781430264453_Fig07-27.jpg](img/9781430264453_Fig07-27.jpg)\n\
    \n图 7-27。设置条件格式\n\n6.  完成后，您应会在所选单元格旁边看到一个图标。单击它并选择`显示 TotalMargin 值的所有单元格`选项。\n\
    7.  选择一个 `TotalSales` 单元格。这次，在`条件格式`下拉菜单下选择`数据条`。选择一种渐变样式。选择`数据条`后，您应会在值旁边看到一个小图标。单击它并选择`显示\
    \ TotalSales 值的所有单元格`。\n8.  您的数据透视表应类似于图 7-28。展开年份，注意格式化会显示在季度、月份和年份上。\n\n![9781430264453_Fig07-28.jpg](img/9781430264453_Fig07-28.jpg)\n\
    \n图 7-28。向数据透视表添加数据条\n"
- fmt: "9. 打开`sheet2`，在“插入”选项卡中，选择`PivotChart`下拉菜单。从下拉菜单中选择数据透视图。使用“工作簿中的数据模型”表连接，将图表插入到当前工作表中。\n\
    10. 在“字段列表”窗口中，将`ResellerSales`表中的`TotalSales`添加到“值”区域，并将`Geography`表中的`CountryRegionName`添加到“轴字段”区域。您应该会看到一个按国家/地区显示销售额的柱形图（参见[图7-29](#9781430264453_Ch07.xhtml#Fig29)）。\n\
    \n![9781430264453_Fig07-29.jpg](Images/9781430264453_Fig07-29.jpg)\n\n[图7-29](#9781430264453_Ch07.xhtml#_Fig29).\
    \ 添加柱形图选择柱形图。您应该会看到“数据透视图工具”选项卡。在“设计”选项卡中，您可以更改图表颜色、布局和图表类型。\n\n11. 在“布局”选项卡中，您可以更改标题、图例、标签和网格线。“格式”选项卡允许您格式化图表中的形状和文本。“分析”选项卡允许您显示/隐藏字段按钮。\n\
    12. 将图表的标题重命名为**Sales By Country**。隐藏字段按钮和图例。移除网格线。\n13. 右键单击垂直轴并选择“设置坐标轴格式”。在“坐标轴选项”下，将“显示单位”更改为“百万”。在“数字”节点下，将“类别”更改为“货币”，小数位数设为`0`。您的图表应类似于[图7-30](#9781430264453_Ch07.xhtml#Fig30)。\n\
    \n![9781430264453_Fig07-30.jpg](Images/9781430264453_Fig07-30.jpg)\n\n[图7-30](#9781430264453_Ch07.xhtml#_Fig30).\
    \ 格式化柱形图\n\n14. 有时您希望同时查看数据图表和数据表。为此，请转到“Power Pivot模型设计器”，在“开始”选项卡中选择`PivotTable`下拉菜单。从下拉菜单中选择“图表和表格（水平）”。在新工作表中插入图表和表格。\n\
    15. 将图表类型更改为饼图。在图表的“字段列表”窗口中，将`TotalSales`字段添加到“值”区域，并将`CountryRegionCode`添加到“轴字段”区域。\n\
    16. 将图表标题更改为**Sales By Country**并移除字段按钮。\n17. 在“设计”选项卡上，将“图表布局”更改为以货币形式（无小数）显示数值（参见[图7-31](#9781430264453_Ch07.xhtml#Fig31)）。\n\
    \n![9781430264453_Fig07-31.jpg](Images/9781430264453_Fig07-31.jpg)\n\n[图7-31](#9781430264453_Ch07.xhtml#_Fig31).\
    \ 创建销售饼图\n\n18. 单击数据透视表以调出其“字段列表”窗口。将`ResellerSales`表中的`TotalSales`添加到“值”区域。将`Product\
    \ Subcategory`添加到“行标签”区域。\n19. 选中饼图，为产品类别和年份各插入一个切片器（参见[图7-32](#9781430264453_Ch07.xhtml#Fig32)）。验证切片器是否仅过滤饼图而不影响数据透视表。\n\
    \n![9781430264453_Fig07-32.jpg](Images/9781430264453_Fig07-32.jpg)\n\n[图7-32](#9781430264453_Ch07.xhtml#_Fig32).\
    \ 插入切片器\n\n20. 选择“年份”切片器，在“切片器工具选项”选项卡中，单击“报表连接”按钮。添加与饼图位于同一工作表上的数据透视表。对类别切片器重复此步骤。\n\
    21. 验证切片器是否同时过滤图表和数据透视表。您的仪表板应类似于[图7-33](#9781430264453_Ch07.xhtml#Fig33)。\n\n\
    ![9781430264453_Fig07-33.jpg](Images/9781430264453_Fig07-33.jpg)\n\n[图7-33](#9781430264453_Ch07.xhtml#_Fig33).\
    \ 创建仪表板\n\n22. 在工作簿中添加一个新工作表。您将使用多维数据集函数来计算总销售额最高的产品和最高的经销商。最终结果应类似于[图7-34](#9781430264453_Ch07.xhtml#Fig34)。\n\
    \n![9781430264453_Fig07-34.jpg](Images/9781430264453_Fig07-34.jpg)\n\n[图7-34](#9781430264453_Ch07.xhtml#_Fig34).\n\
    \n23. 在`B1`单元格中添加以下代码以选择`TotalSales`度量值。\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Measures].[TotalSales]\")\n```\n\n24. 在`B2`单元格中，使用以下函数获取按`TotalSales`降序排列的经销商集。您将使用此集来选择排名最高的经销商。\n\
    \n```\n=CUBESET(\"ThisWorkbookDataModel\",\n    \"[Reseller].[ResellerName].children\"\
    ,\"Top Reseller\",2,B1)\n```\n\n25. 在`B3`单元格中，使用此函数获取按`TotalSales`降序排列的产品集。\n\n\
    ```\n=CUBESET(\"ThisWorkbookDataModel\",\n     \"[Product].[Product].children\"\
    ,\"Top Products\",2,B1)\n```\n\n26. 在`C2`单元格中，使用`CUBERANKEDMEMBER`函数从`B2`单元格中函数返回的集中获取排名最高的经销商。\n\
    \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n```\n\n27. 在`C3`单元格中，使用`CUBERANKEDMEMBER`函数从`B3`单元格中函数返回的集中获取排名最高的产品。\n\
    \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B3,1)\n```\n\n28. 在`D2`单元格中，使用`CUBEVALUE`函数获取`C2`单元格中找到的顶级经销商的总销售额。请注意，您必须将`C2`中找到的经销商名称与`Power\
    \ Pivot`模型中的`[Reseller].[ResellerName]`属性连接起来。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n    \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\"\
    )\n```\n\n29. 使用类似的`CUBEVALUE`函数，您可以获取顶级产品的总销售额值。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n      \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\")\n```\n\
    \n## 总结\n\n正如您在本文中所见，`Excel`是一个功能丰富的环境，可使用数据透视表和数据透视图创建仪表板。至此，您应该能够熟练地使用工作簿模型作为数据源来创建数据透视表和数据透视图。您还使用了`Excel`多维数据集函数直接查询模型，而无需使用数据透视表。本章涵盖了入门的基础知识，但您还需要学习更多关于`Excel`及其如何帮助您分析数据的知识。我鼓励您深入探索这些功能。下一章是三个章节中的第一个，您将在其中了解`Power\
    \ Pivot`模型的另一个有用界面。`Power View`为用户提供了一个丰富的交互式界面来探索数据。您将首先了解如何优化模型以用于`Power View`分析，然后使用`Power\
    \ View`创建标准报表，之后，您将学习如何使用`Power View`创建引人注目的交互式报表。\n\n---\n\n## 第 2 部分\n\n![image](Images/frontdot.jpg)\n\
    \n使用`Power View`构建交互式报表和仪表板\n\n## 第 8 章\n\n![image](Images/frontdot.jpg)\n\n优化`Power\
    \ Pivot`模型以用于`Power View`\n\n`Power View`是`Excel`中的一种工作表类型，允许用户开发交互式可视化效果，从而鼓励对数据进行临时探索。对于想要探索和洞察数据但并非`Excel`高级用户的用户来说，它是一个理想的工具。由于`Power\
    \ View`可视化效果基于`Power Pivot`模型，您需要为用户提供一个可靠的模型作为这些可视化效果的基础。一个经过调整以适用于`Power View`的良好`Power\
    \ Pivot`模型将带来卓越的用户体验，而非极其糟糕的用户体验。有多种方法可以优化`Power Pivot`模型，以使其在`Power View`中更好地创建报表。本章将回顾这些设置，并展示如何创建支持许多`Power\
    \ View`功能的模型。\n\n完成本章后，您将能够：\n\n*   了解`Power View`中可用的可视化类型。\n*   在`Power View`中创建基本可视化效果。\n\
    *   设置`Power Pivot`模型中的属性以改善`Power View`体验。\n\n![Image](Images/sq.jpg) **注** 如需彩色图片副本，请访问源代码/下载页面，网址为`http://www.apress.com/9781430264453`。\n\
    \n## 使用`Power View`可视化数据"
  raw: "9.  Open sheet2 and on the Insert tab, select the PivotChart drop-down. From\
    \ the drop-down, chose the pivot chart. Insert the chart on the current sheet\
    \ using the Tables In Workbook Data Model connection.\n10.  In the Field List\
    \ window, add the TotalSales from the ResellerSales table to the Values drop area\
    \ and add the CountryRegionName from the Geography table to the Axis Fields drop\
    \ area. You should see a column chart showing sales by country (see [Figure 7-29](#9781430264453_Ch07.xhtml#Fig29)).\n\
    \n![9781430264453_Fig07-29.jpg](Images/9781430264453_Fig07-29.jpg)\n\n[Figure\
    \ 7-29](#9781430264453_Ch07.xhtml#_Fig29). Adding a column chartSelect the column\
    \ chart. You should see the PivotChart Tools tabs. In the Design tab, you can\
    \ change the chart colors, change the layout, and change the chart type\n\n11.\
    \  On the Layout tab, you can work with changing the titles, legend, labels, and\
    \ gridlines. The Format tab lets you format the shapes and text in the chart.\
    \ The Analyze tab lets you show/hide the field buttons.\n12.  Rename the title\
    \ of the chart to **Sales By Country**. Hide the field buttons and the legend.\
    \ Remove the gridlines.\n13.  Right-click on the vertical axis and select Format\
    \ Axis. Under Axis Options, change the Display Units to Millions. Under the Number\
    \ node, change the Category to Currency with zero decimal places. Your chart should\
    \ look similar to [Figure 7-30](#9781430264453_Ch07.xhtml#Fig30).\n\n![9781430264453_Fig07-30.jpg](Images/9781430264453_Fig07-30.jpg)\n\
    \n[Figure 7-30](#9781430264453_Ch07.xhtml#_Fig30). Formatting the column chart\n\
    \n14.  Sometimes you want to see a data chart and a data table together. To do\
    \ this, go to the Power Pivot Model Designer and on the Home tab, select the PivotTable\
    \ drop-down. From the drop-down, chose the Chart And Table (Horizontal). Insert\
    \ the chart and table on a new sheet.\n15.  Change the chart type to a pie chart.\
    \ On the Field List window for the chart, add the TotalSales field to the Values\
    \ drop area and the CountryRegionCode to the Axis Fields drop area.\n16.  Change\
    \ the title of the chart to Sales By Country and remove the field buttons.\n17.\
    \  Change the Chart Layout on the Design tab to show values as currency with no\
    \ decimals (see [Figure 7-31](#9781430264453_Ch07.xhtml#Fig31)).\n\n![9781430264453_Fig07-31.jpg](Images/9781430264453_Fig07-31.jpg)\n\
    \n[Figure 7-31](#9781430264453_Ch07.xhtml#_Fig31). Creating the sales pie chart\n\
    \n18.  Click on the pivot table to bring up its Field List window. Add the ResellerSales\
    \ TotalSales to the Values drop area. Add the Product Subcategory to the Row Labels\
    \ drop area.\n19.  With the pie chart selected, insert a slicer for the product\
    \ category and one for the year (see [Figure 7-32](#9781430264453_Ch07.xhtml#Fig32)).\
    \ Verify that the slicers filter the pie chart but not the pivot table.\n\n![9781430264453_Fig07-32.jpg](Images/9781430264453_Fig07-32.jpg)\n\
    \n[Figure 7-32](#9781430264453_Ch07.xhtml#_Fig32). Inserting the slicers\n\n20.\
    \  Select the Year slicer and on the Slicer Tools Options tab, click the Report\
    \ Connections button. Add the pivot table located on the same sheet as the pie\
    \ chart. Repeat this for the category slicer.\n21.  Verify that the slicers filter\
    \ both the chart and the pivot table. Your dashboard should look similar to [Figure\
    \ 7-33](#9781430264453_Ch07.xhtml#Fig33).\n\n![9781430264453_Fig07-33.jpg](Images/9781430264453_Fig07-33.jpg)\n\
    \n[Figure 7-33](#9781430264453_Ch07.xhtml#_Fig33). Creating a dashboard\n\n22.\
    \  Add a new sheet to the workbook. You are going to use cube functions to calculate\
    \ the top product and top reseller in total sales. The final result should look\
    \ similar to [Figure 7-34](#9781430264453_Ch07.xhtml#Fig34).\n\n![9781430264453_Fig07-34.jpg](Images/9781430264453_Fig07-34.jpg)\n\
    \n[Figure 7-34](#9781430264453_Ch07.xhtml#_Fig34).\n\n23.  Add the following code\
    \ in B1 to select the TotalSales measure.\n\n```\n    =CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Measures].[TotalSales]\")\n    ```\n\n24.  In B2, use the following function\
    \ to get the set of resellers ordered by TotalSales descending. You will use this\
    \ set to select the top reseller.\n\n```\n    =CUBESET(\"ThisWorkbookDataModel\"\
    ,\n        \"[Reseller].[ResellerName].children\",\"Top Reseller\",2,B1)\n   \
    \ ```\n\n25.  In B3, use this function to get the set of products ordered by TotalSales\
    \ descending.\n\n```\n    =CUBESET(\"ThisWorkbookDataModel\",\n         \"[Product].[Product].children\"\
    ,\"Top Products\",2,B1)\n    ```\n\n26.  In C2, use the `CUBERANKEDMEMBER` function\
    \ to get the top reseller from the set returned by the function in B2.\n\n```\n\
    \    =CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n    ```\n\n27.  In C3\
    \ use the `CUBERANKEDMEMBER` function to get the top product from the set returned\
    \ by the function in B3.\n\n```\n    =CUBERANKEDMEMBER(\"ThisWorkbookDataModel\"\
    ,B3,1)\n    ```\n\n28.  In D2 use the `CUBEVALUE` function to get the total sales\
    \ of the top reseller found in C2\\. Notice you have to concatenate the name of\
    \ the reseller found in C2 to the `[Reseller].[ResellerName]` attribute in the\
    \ Power Pivot model.\n\n```\n    =CUBEVALUE(\"ThisWorkbookDataModel\",\n     \
    \   \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\")\n\
    \    ```\n\n29.  Using a similar `CUBEVALUE` function, you can get the total sales\
    \ value for the top product.\n\n```\n    =CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n          \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\"\
    )\n    ```\n\nSummary\n\nAs you saw in this chapter, Excel is a feature-rich environment\
    \ for creating dashboards using pivot tables and pivot charts. At this point,\
    \ you should feel comfortable creating pivot tables and pivot charts using your\
    \ workbook model as a data source. You also used Excel cube functions to query\
    \ the model directly without needing to use a pivot table. Although this chapter\
    \ covered the basics to get you started, you have a lot more to learn about Excel\
    \ and how it can help you analyze your data. I encourage you to dig deeper into\
    \ these features. The next chapter is the first of three in which you will look\
    \ at another useful interface for your Power Pivot model. Power View provides\
    \ a rich interactive interface for users to explore the data. You will first look\
    \ at optimizing models for analysis in Power View, next you will create standard\
    \ reports using Power View, after that, you will look at creating compelling interactive\
    \ reports in Power View.\n\nPART 2\n\n![image](Images/frontdot.jpg)\n\nBuilding\
    \ Interactive Reports and Dashboards with Power View\n\nCHAPTER 8\n\n![image](Images/frontdot.jpg)\n\
    \nOptimizing Power Pivot Models for Power View\n\nPower View is a worksheet type\
    \ in Excel that lets users develop interactive visualizations that encourage ad-hoc\
    \ exploration of the data. It is an ideal tool for users who are not Excel power\
    \ users who want to explore and gain insight from the data. Since Power View visualizations\
    \ are based on a Power Pivot model, you need to provide users with a solid model\
    \ as a foundation for these visualizations. A good Power Pivot model tuned for\
    \ use by Power View will make the difference between a great user experience and\
    \ an extremely frustrating one. There are ways to optimize a Power Pivot model\
    \ so that it facilitates better report creation in Power View. This chapter reviews\
    \ these settings and shows how to create models that provide support for many\
    \ Power View features.\n\nAfter completing this chapter you will be able to\n\n\
    *   Understand the types of visualizations available in Power View.\n*   Create\
    \ basic visualizations in Power View.\n*   Set properties in the Power Pivot model\
    \ to improve the Power View experience.\n\n![Image](Images/sq.jpg) **Note**  For\
    \ copies of color figures, go to Source Code/Downloads at `http://www.apress.com/9781430264453`.\n\
    \nVisualizing Data with Power View"
  trans: "\n9. 打开`sheet2`，在“插入”选项卡中，选择`PivotChart`下拉菜单。从下拉菜单中选择数据透视图。使用“工作簿中的数据模型”表连接，将图表插入到当前工作表中。\n\
    10. 在“字段列表”窗口中，将`ResellerSales`表中的`TotalSales`添加到“值”区域，并将`Geography`表中的`CountryRegionName`添加到“轴字段”区域。您应该会看到一个按国家/地区显示销售额的柱形图（参见图\
    \ 7-29）。\n\n![9781430264453_Fig07-29.jpg](img/9781430264453_Fig07-29.jpg)\n\n\
    图 7-29. 添加柱形图选择柱形图。您应该会看到“数据透视图工具”选项卡。在“设计”选项卡中，您可以更改图表颜色、布局和图表类型。\n\n11. 在“布局”选项卡中，您可以更改标题、图例、标签和网格线。“格式”选项卡允许您格式化图表中的形状和文本。“分析”选项卡允许您显示/隐藏字段按钮。\n\
    12. 将图表的标题重命名为**Sales By Country**。隐藏字段按钮和图例。移除网格线。\n13. 右键单击垂直轴并选择“设置坐标轴格式”。在“坐标轴选项”下，将“显示单位”更改为“百万”。在“数字”节点下，将“类别”更改为“货币”，小数位数设为`0`。您的图表应类似于图\
    \ 7-30。\n\n![9781430264453_Fig07-30.jpg](img/9781430264453_Fig07-30.jpg)\n\n图\
    \ 7-30. 格式化柱形图\n\n14. 有时您希望同时查看数据图表和数据表。为此，请转到“Power Pivot 模型设计器”，在“开始”选项卡中选择`PivotTable`下拉菜单。从下拉菜单中选择“图表和表格（水平）”。在新工作表中插入图表和表格。\n\
    15. 将图表类型更改为饼图。在图表的“字段列表”窗口中，将`TotalSales`字段添加到“值”区域，并将`CountryRegionCode`添加到“轴字段”区域。\n\
    16. 将图表标题更改为**Sales By Country**并移除字段按钮。\n17. 在“设计”选项卡上，将“图表布局”更改为以货币形式（无小数）显示数值（参见图\
    \ 7-31）。\n\n![9781430264453_Fig07-31.jpg](img/9781430264453_Fig07-31.jpg)\n\n\
    图 7-31. 创建销售饼图\n\n18. 单击数据透视表以调出其“字段列表”窗口。将`ResellerSales`表中的`TotalSales`添加到“值”区域。将`Product\
    \ Subcategory`添加到“行标签”区域。\n19. 选中饼图，为产品类别和年份各插入一个切片器（参见图 7-32）。验证切片器是否仅过滤饼图而不影响数据透视表。\n\
    \n![9781430264453_Fig07-32.jpg](img/9781430264453_Fig07-32.jpg)\n\n图 7-32. 插入切片器\n\
    \n20. 选择“年份”切片器，在“切片器工具选项”选项卡中，单击“报表连接”按钮。添加与饼图位于同一工作表上的数据透视表。对类别切片器重复此步骤。\n21.\
    \ 验证切片器是否同时过滤图表和数据透视表。您的仪表板应类似于图 7-33。\n\n![9781430264453_Fig07-33.jpg](img/9781430264453_Fig07-33.jpg)\n\
    \n图 7-33. 创建仪表板\n\n22. 在工作簿中添加一个新工作表。您将使用多维数据集函数来计算总销售额最高的产品和最高的经销商。最终结果应类似于图\
    \ 7-34。\n\n![9781430264453_Fig07-34.jpg](img/9781430264453_Fig07-34.jpg)\n\n图\
    \ 7-34.\n\n23. 在`B1`单元格中添加以下代码以选择`TotalSales`度量值。\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Measures].[TotalSales]\")\n```\n\n24. 在`B2`单元格中，使用以下函数获取按`TotalSales`降序排列的经销商集。您将使用此集来选择排名最高的经销商。\n\
    \n```\n=CUBESET(\"ThisWorkbookDataModel\",\n    \"[Reseller].[ResellerName].children\"\
    ,\"Top Reseller\",2,B1)\n```\n\n25. 在`B3`单元格中，使用此函数获取按`TotalSales`降序排列的产品集。\n\n\
    ```\n=CUBESET(\"ThisWorkbookDataModel\",\n     \"[Product].[Product].children\"\
    ,\"Top Products\",2,B1)\n```\n\n26. 在`C2`单元格中，使用`CUBERANKEDMEMBER`函数从`B2`单元格中函数返回的集中获取排名最高的经销商。\n\
    \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n```\n\n27. 在`C3`单元格中，使用`CUBERANKEDMEMBER`函数从`B3`单元格中函数返回的集中获取排名最高的产品。\n\
    \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B3,1)\n```\n\n28. 在`D2`单元格中，使用`CUBEVALUE`函数获取`C2`单元格中找到的顶级经销商的总销售额。请注意，您必须将`C2`中找到的经销商名称与`Power\
    \ Pivot`模型中的`[Reseller].[ResellerName]`属性连接起来。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n    \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\"\
    )\n```\n\n29. 使用类似的`CUBEVALUE`函数，您可以获取顶级产品的总销售额值。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n      \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\")\n```\n\
    \n## 总结\n\n正如您在本文中所见，`Excel`是一个功能丰富的环境，可使用数据透视表和数据透视图创建仪表板。至此，您应该能够熟练地使用工作簿模型作为数据源来创建数据透视表和数据透视图。您还使用了`Excel`多维数据集函数直接查询模型，而无需使用数据透视表。本章涵盖了入门的基础知识，但您还需要学习更多关于`Excel`及其如何帮助您分析数据的知识。我鼓励您深入探索这些功能。下一章是三个章节中的第一个，您将在其中了解`Power\
    \ Pivot`模型的另一个有用界面。`Power View`为用户提供了一个丰富的交互式界面来探索数据。您将首先了解如何优化模型以用于`Power View`分析，然后使用`Power\
    \ View`创建标准报表，之后，您将学习如何使用`Power View`创建引人注目的交互式报表。\n\n---\n\n## 第 2 部分\n\n![image](img/frontdot.jpg)\n\
    \n使用`Power View`构建交互式报表和仪表板\n\n## 第 8 章\n\n![image](img/frontdot.jpg)\n\n优化`Power\
    \ Pivot`模型以用于`Power View`\n\n`Power View`是`Excel`中的一种工作表类型，允许用户开发交互式可视化效果，从而鼓励对数据进行临时探索。对于想要探索和洞察数据但并非`Excel`高级用户的用户来说，它是一个理想的工具。由于`Power\
    \ View`可视化效果基于`Power Pivot`模型，您需要为用户提供一个可靠的模型作为这些可视化效果的基础。一个经过调整以适用于`Power View`的良好`Power\
    \ Pivot`模型将带来卓越的用户体验，而非极其糟糕的用户体验。有多种方法可以优化`Power Pivot`模型，以使其在`Power View`中更好地创建报表。本章将回顾这些设置，并展示如何创建支持许多`Power\
    \ View`功能的模型。\n\n完成本章后，您将能够：\n\n*   了解`Power View`中可用的可视化类型。\n*   在`Power View`中创建基本可视化效果。\n\
    *   设置`Power Pivot`模型中的属性以改善`Power View`体验。\n\n![Image](img/sq.jpg) **注** 如需彩色图片副本，请访问源代码/下载页面，网址为`http://www.apress.com/9781430264453`。\n\
    \n## 使用`Power View`可视化数据\n"
- fmt: '# Power View 数据可视化


    正如我们在[第7章](../Text/9781430264453_Ch07.xhtml)中看到的，你可以使用Excel数据透视表和图表创建强大的数据可视化并进行深入的数据分析。如果你是一名Excel高级用户，并且在工作职责中包含详细的数据分析，那么这些工具将是你的首选。另一方面，如果你需要一个工具来让用户从你的Power
    Pivot模型中快速创建直观的可视化，那么Power View是一个绝佳的选择。你可以使用Power View创建包含上下文关联的可视化内容的引人注目的仪表板，这些可视化内容可以轻松进行筛选、排序和钻取。Power
    View报表可以作为Excel工作表或SharePoint库中的内容进行托管。一个额外的好处是，它们可以导出到PowerPoint，以便在演示中使用，同时保留其交互性。[图8-1](#9781430264453_Ch08.xhtml#Fig1)展示了一个包含关联图表和图形的Power
    View报表示例。当点击图表上的一个条形时，图形会按该国家和年份进行筛选。


    ![9781430264453_Fig08-01.jpg](Images/9781430264453_Fig08-01.jpg)


    [图8-1](#9781430264453_Ch08.xhtml#_Fig1). Power View中的交互式图表和图形


    使用Power View，你可以创建常见的可视化内容，例如表格、矩阵、图表和图形。此外，你还可以创建包含时间轴的散点图，以揭示数据随时间的变化（参见[图8-2](#9781430264453_Ch08.xhtml#Fig2)）。


    ![9781430264453_Fig08-02.jpg](Images/9781430264453_Fig08-02.jpg)


    [图8-2](#9781430264453_Ch08.xhtml#_Fig2). 为散点图添加播放轴


    由于Power View使用Bing Maps图块，你可以将数据呈现在交互式地图上，并在探索数据时进行缩放和平移，直至街道地址级别。[图8-3](#9781430264453_Ch08.xhtml#Fig3)展示了按县划分的降雨量地图。


    ![9781430264453_Fig08-03.jpg](Images/9781430264453_Fig08-03.jpg)


    [图8-3](#9781430264453_Ch08.xhtml#_Fig3). 按县划分的降雨量地图


    Power View中另外两种可用的数据可视化类型是卡片（`Cards`）和磁贴（`tiles`）。卡片以索引卡样式显示每一行的数据。例如，你可以查看员工的联系信息，如[图8-4](#9781430264453_Ch08.xhtml#Fig4)所示。


    ![9781430264453_Fig08-04.jpg](Images/9781430264453_Fig08-04.jpg)


    [图8-4](#9781430264453_Ch08.xhtml#_Fig4). 卡片样式的员工信息


    磁贴可视化允许你使用包含文本和图像的选项卡条对数据进行交互式筛选。例如，[图8-5](#9781430264453_Ch08.xhtml#Fig5)展示了如何使用磁贴，通过选项卡条中的区域地图图像来按区域筛选销售额。


    ![9781430264453_Fig08-05.jpg](Images/9781430264453_Fig08-05.jpg)


    [图8-5](#9781430264453_Ch08.xhtml#_Fig5). 在Power View中使用磁贴图像


    现在你已经熟悉了Power View中可用的几种可视化类型，接下来让我们看看创建一些基本报表的过程。


    ## 创建基本报表


    Power View报表基于Excel中的Power Pivot模型。要创建报表，请打开包含模型的Excel工作簿，在"插入"选项卡上，单击"Power View"按钮（参见[图8-6](#9781430264453_Ch08.xhtml#Fig6)）。


    ![9781430264453_Fig08-06.jpg](Images/9781430264453_Fig08-06.jpg)


    [图8-6](#9781430264453_Ch08.xhtml#_Fig6). 插入Power View报表


    这将在工作簿中插入一个新选项卡，并显示Power View设计界面。设计界面包含数据可视化区域、筛选区域和Power View字段窗口。Power View字段窗口包含暴露给客户端工具的Power
    Pivot模型的表和字段（参见[图8-7](#9781430264453_Ch08.xhtml#Fig7)）。


    ![9781430264453_Fig08-07.jpg](Images/9781430264453_Fig08-07.jpg)


    [图8-7](#9781430264453_Ch08.xhtml#_Fig7). Power View设计界面


    在Power View中创建可视化的关键之一是从表格视图开始，一旦选定了字段，就可以将表格视图切换为其他数据可视化类型。如果你展开Power View字段列表中的表节点，将看到可用的字段。如果你想创建一个按销售区域显示销售额的条形图，首先将所需字段拖动到字段拖放区域。这将在设计界面上创建一个表格视图。选中该表格视图后，你可以在"设计"选项卡上选择不同的可视化类型（参见[图8-8](#9781430264453_Ch08.xhtml#Fig8)）。


    ![9781430264453_Fig08-08.jpg](Images/9781430264453_Fig08-08.jpg)


    [图8-8](#9781430264453_Ch08.xhtml#_Fig8). 更改可视化类型


    切换可视化类型后，字段列表下的拖放区域将根据可视化类型而变化。[图8-9](#9781430264453_Ch08.xhtml#Fig9)显示了条形图的拖放区域。你可能需要重新排列字段，并且可以向拖放区域添加其他字段以获得所需的可视化效果。


    ![9781430264453_Fig08-09.jpg](Images/9781430264453_Fig08-09.jpg)


    [图8-9](#9781430264453_Ch08.xhtml#_Fig9). 条形图拖放区域


    你可以轻松地将一种可视化类型切换为另一种。例如，如果你选中条形图并在"设计"选项卡中选择其他图表下拉列表，可以将其切换为饼图（参见[图8-10](#9781430264453_Ch08.xhtml#Fig10)）。


    ![9781430264453_Fig08-10.jpg](Images/9781430264453_Fig08-10.jpg)


    [图8-10](#9781430264453_Ch08.xhtml#_Fig10). 切换可视化类型


    现在你已经了解了如何创建基本可视化（将在[第9章](../Text/9781430264453_Ch09.xhtml)和[第10章](../Text/9781430264453_Ch10.xhtml)中学习创建更复杂的可视化），接下来让我们看看如何利用Power
    Pivot模型来改善Power View中的设计者和用户体验。


    ## 改善Power View体验


    让Power Pivot模型的用户在Power View中构建和探索各种可视化内容时获得愉快的体验非常重要。例如，你应该只暴露对用户有意义的字段。隐藏用于关联模型中表的关键值总是一个好主意。要从Power
    View中可用字段列表中隐藏列，请右键单击该列并选择"从客户端工具中隐藏"（这将在模型设计器中将该列变为灰色）。[图8-11](#9781430264453_Ch08.xhtml#Fig11)展示了隐藏一个没有业务意义的`CustomerID`字段。


    ![9781430264453_Fig08-11.jpg](Images/9781430264453_Fig08-11.jpg)


    [图8-11](#9781430264453_Ch08.xhtml#_Fig11). 从客户端工具中隐藏字段


    如果你查看[图8-11](#9781430264453_Ch08.xhtml#Fig11)中弹出菜单的底部，你将看到可以为字段输入描述。当你在Power View中悬停在该字段上时，将显示此描述。此选项也适用于模型中创建的度量，并且对于需要了解度量如何定义的业务用户非常有用。[图8-12](#9781430264453_Ch08.xhtml#Fig12)显示了在Power
    View中显示的描述。


    ![9781430264453_Fig08-12.jpg](Images/9781430264453_Fig08-12.jpg)


    [图8-12](#9781430264453_Ch08.xhtml#_Fig12). 添加字段描述可改善用户体验'
  raw: 'As we saw in [Chapter 7](../Text/9781430264453_Ch07.xhtml), you can create
    powerful data visualizations and perform in-depth data analysis using Excel pivot
    tables and charts. Chances are that if you are an Excel power user and perform
    detailed data analysis as part of your job function, these will be your tools
    of choice. On the other hand, if you need a tool that allows users to create quick
    and easy visualizations from your Power Pivot models, then Power View is a great
    option. You use Power View to create compelling dashboards that contain contextually
    linked visualizations that can be easily filtered, sorted, and drilled through.
    Power View reports can be hosted as a worksheet in Excel or in a SharePoint library.
    One added benefit is they can be exported to PowerPoint where they can be used
    for presentations while still retaining their interactivity. [Figure 8-1](#9781430264453_Ch08.xhtml#Fig1)
    shows a sample of a Power View report with a linked chart and graph. When a bar
    is clicked on the chart, the graph is filtered by that country and year.


    ![9781430264453_Fig08-01.jpg](Images/9781430264453_Fig08-01.jpg)


    [Figure 8-1](#9781430264453_Ch08.xhtml#_Fig1). An interactive chart and graph
    in Power View


    With Power View you can create the common visualizations such as tables, matrices,
    charts, and graphs. In addition, you can create bubble charts that include a time
    axis that reveals how the data changes over time (see [Figure 8-2](#9781430264453_Ch08.xhtml#Fig2)).


    ![9781430264453_Fig08-02.jpg](Images/9781430264453_Fig08-02.jpg)


    [Figure 8-2](#9781430264453_Ch08.xhtml#_Fig2). Adding a play axis to a bubble
    chart


    Since Power View uses Bing Maps tiles, you can present your data on interactive
    maps that you can zoom in and pan down to street address level as you explore
    the data. [Figure 8-3](#9781430264453_Ch08.xhtml#Fig3) shows a map of rainfall
    by county.


    ![9781430264453_Fig08-03.jpg](Images/9781430264453_Fig08-03.jpg)


    [Figure 8-3](#9781430264453_Ch08.xhtml#_Fig3). Map of rainfall by county


    Two other data visualizations available in Power View are cards and tiles. *Cards*
    display the data from each row laid out in an index card style. For example, you
    can look at contact information for employees, as shown in [Figure 8-4](#9781430264453_Ch08.xhtml#Fig4).


    ![9781430264453_Fig08-04.jpg](Images/9781430264453_Fig08-04.jpg)


    [Figure 8-4](#9781430264453_Ch08.xhtml#_Fig4). Employee information in a card
    style


    A *tile* visualization allows you to interactively filter the data using a tab
    strip that can contain text and images. For example, [Figure 8-5](#9781430264453_Ch08.xhtml#Fig5)
    shows the use of tiles to filter sales by region using a map image of the region
    in the tab strip.


    ![9781430264453_Fig08-05.jpg](Images/9781430264453_Fig08-05.jpg)


    [Figure 8-5](#9781430264453_Ch08.xhtml#_Fig5). Using tile images in Power View


    Now that you are familiar with some of the types of visualizations available in
    Power View, let’s look at the process of creating some basic reports.


    Creating a Basic Report


    Power View reports are based on Power Pivot models in Excel. In order to create
    a report, open the Excel workbook that contains a model and on the Insert tab,
    click the Power View button (see [Figure 8-6](#9781430264453_Ch08.xhtml#Fig6)).


    ![9781430264453_Fig08-06.jpg](Images/9781430264453_Fig08-06.jpg)


    [Figure 8-6](#9781430264453_Ch08.xhtml#_Fig6). Inserting a Power View report


    This will insert a new tab into the workbook and present you with the Power View
    design surface. The design has a Data Visualization area, a Filters area, and
    a Power View Fields window. The Power View Fields window contains the tables and
    fields of the Power Pivot model that are exposed to the client tools (see [Figure
    8-7](#9781430264453_Ch08.xhtml#Fig7)).


    ![9781430264453_Fig08-07.jpg](Images/9781430264453_Fig08-07.jpg)


    [Figure 8-7](#9781430264453_Ch08.xhtml#_Fig7). The Power View design surface


    One of the keys to creating visualizations in Power View is to begin with a table
    view, and then once you have the fields selected, you can switch the table view
    to one of the other data visualization types. If you expand the table nodes in
    the Power View Field List, you will see the available fields. If you want to create
    a bar chart showing sales by sales territory, first drag the desired fields to
    the Fields drop area. This will create a table view on the design surface. Selecting
    the table view then allows you to choose a different visualization type on the
    Design tab (see [Figure 8-8](#9781430264453_Ch08.xhtml#Fig8)).


    ![9781430264453_Fig08-08.jpg](Images/9781430264453_Fig08-08.jpg)


    [Figure 8-8](#9781430264453_Ch08.xhtml#_Fig8). Changing the visualization


    Once you switch the visualization, the drop areas under the Field List will change
    based on the visualization type. [Figure 8-9](#9781430264453_Ch08.xhtml#Fig9)
    shows the drop areas for a bar chart. You may have to rearrange the fields and
    you can add additional fields to the drop area to get the visualization you want.


    ![9781430264453_Fig08-09.jpg](Images/9781430264453_Fig08-09.jpg)


    [Figure 8-9](#9781430264453_Ch08.xhtml#_Fig9). The bar chart drop areas


    You can easily change visualizations from one type to another. For example, if
    you select the bar chart and select the other chart drop-down in the Design tab,
    you can switch it to a pie chart (see [Figure 8-10](#9781430264453_Ch08.xhtml#Fig10)).


    ![9781430264453_Fig08-10.jpg](Images/9781430264453_Fig08-10.jpg)


    [Figure 8-10](#9781430264453_Ch08.xhtml#_Fig10). Switching visualization types


    Now that you have seen how to create a basic visualization (you will look at creating
    more complex visualizations in [Chapters 9](../Text/9781430264453_Ch09.xhtml)
    and [10](../Text/9781430264453_Ch10.xhtml)), let’s look at what you can do with
    the Power Pivot model to improve the designer and user experience in Power View.


    Improving the Power View Experience


    It is very important that users of your Power Pivot models have a pleasant experience
    as they build and explore the various visualizations in Power View. For example,
    you should only expose fields that users find meaningful. It is always a good
    idea to hide key values that are used to relate the tables in the model. To hide
    a column from the list of available fields in Power View, right click the column
    and select Hide From Client Tools (this will turn the column gray in the Model
    Designer). [Figure 8-11](#9781430264453_Ch08.xhtml#Fig11) shows hiding a CustomerID
    field that has no business relevance.


    ![9781430264453_Fig08-11.jpg](Images/9781430264453_Fig08-11.jpg)


    [Figure 8-11](#9781430264453_Ch08.xhtml#_Fig11). Hiding fields from client tools


    If you look at the bottom of the pop-up menu in [Figure 8-11](#9781430264453_Ch08.xhtml#Fig11),
    you will see that you can enter a description for the field. This description
    will show up when you hover over the field in Power View. This option is also
    available for measures created in the model and can be very useful for business
    users who need to understand how the measure is defined. [Figure 8-12](#9781430264453_Ch08.xhtml#Fig12)
    shows the description displayed in Power View.


    ![9781430264453_Fig08-12.jpg](Images/9781430264453_Fig08-12.jpg)


    [Figure 8-12](#9781430264453_Ch08.xhtml#_Fig12). Adding field descriptions improves
    the user experience'
  trans: '

    # Power View 数据可视化


    正如我们在第 7 章中看到的，你可以使用 Excel 数据透视表和图表创建强大的数据可视化并进行深入的数据分析。如果你是一名 Excel 高级用户，并且在工作职责中包含详细的数据分析，那么这些工具将是你的首选。另一方面，如果你需要一个工具来让用户从你的
    Power Pivot 模型中快速创建直观的可视化，那么 Power View 是一个绝佳的选择。你可以使用 Power View 创建包含上下文关联的可视化内容的引人注目的仪表板，这些可视化内容可以轻松进行筛选、排序和钻取。Power
    View 报表可以作为 Excel 工作表或 SharePoint 库中的内容进行托管。一个额外的好处是，它们可以导出到 PowerPoint，以便在演示中使用，同时保留其交互性。图
    8-1 展示了一个包含关联图表和图形的 Power View 报表示例。当点击图表上的一个条形时，图形会按该国家和年份进行筛选。


    ![9781430264453_Fig08-01.jpg](img/9781430264453_Fig08-01.jpg)


    图 8-1. Power View 中的交互式图表和图形


    使用 Power View，你可以创建常见的可视化内容，例如表格、矩阵、图表和图形。此外，你还可以创建包含时间轴的散点图，以揭示数据随时间的变化（参见图 8-2）。


    ![9781430264453_Fig08-02.jpg](img/9781430264453_Fig08-02.jpg)


    图 8-2. 为散点图添加播放轴


    由于 Power View 使用 Bing Maps 图块，你可以将数据呈现在交互式地图上，并在探索数据时进行缩放和平移，直至街道地址级别。图 8-3 展示了按县划分的降雨量地图。


    ![9781430264453_Fig08-03.jpg](img/9781430264453_Fig08-03.jpg)


    图 8-3. 按县划分的降雨量地图


    Power View 中另外两种可用的数据可视化类型是卡片（`Cards`）和磁贴（`tiles`）。卡片以索引卡样式显示每一行的数据。例如，你可以查看员工的联系信息，如图
    8-4 所示。


    ![9781430264453_Fig08-04.jpg](img/9781430264453_Fig08-04.jpg)


    图 8-4. 卡片样式的员工信息


    磁贴可视化允许你使用包含文本和图像的选项卡条对数据进行交互式筛选。例如，图 8-5 展示了如何使用磁贴，通过选项卡条中的区域地图图像来按区域筛选销售额。


    ![9781430264453_Fig08-05.jpg](img/9781430264453_Fig08-05.jpg)


    图 8-5. 在 Power View 中使用磁贴图像


    现在你已经熟悉了 Power View 中可用的几种可视化类型，接下来让我们看看创建一些基本报表的过程。


    ## 创建基本报表


    Power View 报表基于 Excel 中的 Power Pivot 模型。要创建报表，请打开包含模型的 Excel 工作簿，在"插入"选项卡上，单击"Power
    View"按钮（参见图 8-6）。


    ![9781430264453_Fig08-06.jpg](img/9781430264453_Fig08-06.jpg)


    图 8-6. 插入 Power View 报表


    这将在工作簿中插入一个新选项卡，并显示 Power View 设计界面。设计界面包含数据可视化区域、筛选区域和 Power View 字段窗口。Power
    View 字段窗口包含暴露给客户端工具的 Power Pivot 模型的表和字段（参见图 8-7）。


    ![9781430264453_Fig08-07.jpg](img/9781430264453_Fig08-07.jpg)


    图 8-7. Power View 设计界面


    在 Power View 中创建可视化的关键之一是从表格视图开始，一旦选定了字段，就可以将表格视图切换为其他数据可视化类型。如果你展开 Power View
    字段列表中的表节点，将看到可用的字段。如果你想创建一个按销售区域显示销售额的条形图，首先将所需字段拖动到字段拖放区域。这将在设计界面上创建一个表格视图。选中该表格视图后，你可以在"设计"选项卡上选择不同的可视化类型（参见图
    8-8）。


    ![9781430264453_Fig08-08.jpg](img/9781430264453_Fig08-08.jpg)


    图 8-8. 更改可视化类型


    切换可视化类型后，字段列表下的拖放区域将根据可视化类型而变化。图 8-9 显示了条形图的拖放区域。你可能需要重新排列字段，并且可以向拖放区域添加其他字段以获得所需的可视化效果。


    ![9781430264453_Fig08-09.jpg](img/9781430264453_Fig08-09.jpg)


    图 8-9. 条形图拖放区域


    你可以轻松地将一种可视化类型切换为另一种。例如，如果你选中条形图并在"设计"选项卡中选择其他图表下拉列表，可以将其切换为饼图（参见图 8-10）。


    ![9781430264453_Fig08-10.jpg](img/9781430264453_Fig08-10.jpg)


    图 8-10. 切换可视化类型


    现在你已经了解了如何创建基本可视化（将在第 9 章和第 10 章中学习创建更复杂的可视化），接下来让我们看看如何利用 Power Pivot 模型来改善 Power
    View 中的设计者和用户体验。


    ## 改善 Power View 体验


    让 Power Pivot 模型的用户在 Power View 中构建和探索各种可视化内容时获得愉快的体验非常重要。例如，你应该只暴露对用户有意义的字段。隐藏用于关联模型中表的关键值总是一个好主意。要从
    Power View 中可用字段列表中隐藏列，请右键单击该列并选择"从客户端工具中隐藏"（这将在模型设计器中将该列变为灰色）。图 8-11 展示了隐藏一个没有业务意义的`CustomerID`字段。


    ![9781430264453_Fig08-11.jpg](img/9781430264453_Fig08-11.jpg)


    图 8-11. 从客户端工具中隐藏字段


    如果你查看图 8-11 中弹出菜单的底部，你将看到可以为字段输入描述。当你在 Power View 中悬停在该字段上时，将显示此描述。此选项也适用于模型中创建的度量，并且对于需要了解度量如何定义的业务用户非常有用。图
    8-12 显示了在 Power View 中显示的描述。


    ![9781430264453_Fig08-12.jpg](img/9781430264453_Fig08-12.jpg)


    图 8-12. 添加字段描述可改善用户体验

