    contains a basic Power Pivot model that you will add to using Power Query.

    2.  Select the `Power Query` tab in Excel. Under the `Get External Data`, select
    `From File` and choose the `From CSV` option. Navigate to the `FlightPerformance_2012_10.csv`
    in the `LabStarters` folder. You should see the Query Editor window with airline
    delay data, as in [Figure 11-21](#9781430264453_Ch11.xhtml#Fig21).


