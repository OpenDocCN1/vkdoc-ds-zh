- fmt: "When creating pivot tables and charts to display and make sense of the data,\
    \ you often want to create a dashboard that easily allows you to determine performance.\
    \ You may be interested in sales performance, network performance, or assembly-line\
    \ performance. Dashboards combine visual representations, such as key performance\
    \ indicators (KPIs), graphs, and charts, into one holistic view of the process.\
    \ Although they are not technically considered dashboard tools, you can create\
    \ some very compelling data displays using Excel with Power Pivot tables and charts\
    \ that can then be displayed and shared in SharePoint.\n\nWhen adding multiple\
    \ charts and tables to a dashboard, you may want to link them together so they\
    \ represent the same data in different ways. You also will probably want to control\
    \ them with the same slicers so that they stay in sync. The easiest way to do\
    \ this is to add them using the `Insert` tab and selecting `PivotChart & PivotTable`\
    \ (see [Figure 7-19](#9781430264453_Ch07.xhtml#Fig19)).\n\n![9781430264453_Fig07-19.jpg](Images/9781430264453_Fig07-19.jpg)\n\
    \n[Figure 7-19](#9781430264453_Ch07.xhtml#_Fig19). Adding a pivot chart and a\
    \ related pivot table\n\nAdding the pivot chart and pivot table in this way creates\
    \ a link between them so that when you add a field to one, it adds the same field\
    \ to the other. Also when you add a slicer to the page, it automatically hooks\
    \ up the slicer to both the pivot table and the pivot chart. [Figure 7-20](#9781430264453_Ch07.xhtml#Fig20)\
    \ shows a simple dashboard consisting of a linked pivot table, pivot chart and\
    \ slicer.\n\n![9781430264453_Fig07-20.jpg](Images/9781430264453_Fig07-20.jpg)\n\
    \n[Figure 7-20](#9781430264453_Ch07.xhtml#_Fig20). Creating a simple dashboard\
    \ in Excel\n\nIf you need to connect multiple charts together, open the Model\
    \ Designer and select the `PivotTable` drop-down on the `Home` tab (see [Figure\
    \ 7-21](#9781430264453_Ch07.xhtml#Fig21)). This also allows you to insert a flattened\
    \ pivot table, which is useful for printing.\n\n![9781430264453_Fig07-21.jpg](Images/9781430264453_Fig07-21.jpg)\n\
    \n[Figure 7-21](#9781430264453_Ch07.xhtml#_Fig21). Connecting multiple pivot charts\n\
    \n## Using Cube Functions\n\nUsing the built-in `PivotChart` and `PivotTable`\
    \ layouts in Excel allows you to create compelling dashboards and provide great\
    \ interfaces for browsing the data. There are times, however, when you may find\
    \ yourself frustrated with some of the limitations inherent with these structures.\
    \ For example, you cannot insert your own columns inside the pivot table to create\
    \ a custom calculation. You may also want to display the data in a non-tabular\
    \ format for a customized report. This is where the Excel cube functions are really\
    \ useful.\n\nThe Excel cube functions allow you to connect directly to the Power\
    \ Pivot data model without needing to use a pivot table. The cube functions are\
    \ Excel functions (as opposed to DAX functions) and can be found on the Excel\
    \ Formulas tab under the `More Functions` drop-down (see [Figure 7-22](#9781430264453_Ch07.xhtml#Fig22)).\n\
    \n![9781430264453_Fig07-22.jpg](Images/9781430264453_Fig07-22.jpg)\n\n[Figure\
    \ 7-22](#9781430264453_Ch07.xhtml#_Fig22). Using cube functions to connect to\
    \ the model\n\nThe easiest way to see how these functions are used is to create\
    \ a pivot table, and on the `PivotTable Tools Analyze` tab, select the `OLAP Tools`\
    \ drop-down, and then select the `Convert To Formulas` option (see [Figure 7-23](#9781430264453_Ch07.xhtml#Fig23)).\n\
    \n![9781430264453_Fig07-23.jpg](Images/9781430264453_Fig07-23.jpg)\n\n[Figure\
    \ 7-23](#9781430264453_Ch07.xhtml#_Fig23). Converting from a pivot table to cube\
    \ functions\n\n[Figure 7-24](#9781430264453_Ch07.xhtml#Fig24) shows the table\
    \ after the conversion to cube functions. It uses the `CUBEMEMBER` function to\
    \ return a member or tuple (ordered list) from the cube and the `CUBEVALUE` function\
    \ to return an aggregated value from the cube.\n\n![9781430264453_Fig07-24.jpg](Images/9781430264453_Fig07-24.jpg)\n\
    \n[Figure 7-24](#9781430264453_Ch07.xhtml#_Fig24). Using cube functions to retrieve\
    \ values\n\nThe following formula is used to return the column label for cell\
    \ C3:\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Geography].[CountryRegionCode].&[AU]\"\
    )\n```\n\nThe first parameter is the name of the connection to the data model\
    \ and the second parameter is the member expression.\n\nThe value in cell C4 is\
    \ returned using the following formula:\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,$B$2,$B4,C$3)\n```\n\nThis formula uses cell references, but you can replace\
    \ these with the cube functions contained in these cells:\n\n```\n=CUBEVALUE\n\
    (\n    \"ThisWorkbookDataModel\",\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\"\
    [Measures].[Sum of SalesAmount]\"),\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"),\n    CUBEMEMBER(\"\
    ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\")\n\
    )\n```\n\nNotice one of the parameters is the `CUBEMEMBER` function returning\
    \ the aggregation you want the value of; the other parameters use the `CUBEMEMBER`\
    \ to define the portion of the cube used in the aggregation.\n\n![9781430264453_Fig07-25.jpg](Images/9781430264453_Fig07-25.jpg)\n\
    \n[Figure 7-25](#9781430264453_Ch07.xhtml#_Fig25). Rearranging the data\n\nYou\
    \ can now rearrange the values and labels to achieve the layout and formatting\
    \ that you need (see [Figure 7-25](#9781430264453_Ch07.xhtml#Fig25)).\n\n## HANDS-ON\
    \ LAB—CREATING THE BI INTERFACE IN EXCEL\n\nIn the following lab you will:\n\n\
    - Add conditional formatting to a pivot table.\n- Create a chart to help analyze\
    \ data.\n- Link together pivot tables and pivot charts.\n- Use cube functions\
    \ to display model data.\n\n1.  In the `LabStarters` folder, open the `LabChapter7.xlsx`\
    \ file. This file contains inventory and sales data from the test AdventureWorksDW\
    \ database.\n2.  In Excel Sheet1 insert a Power Pivot table using the `PivotTable`\
    \ button on the `Insert` tab. Select the `Use An External Data Source` and click\
    \ the `Choose Connection` button. On the `Tables` tab of the `Existing Connections`\
    \ window, select `Tables In Workbook Data Model` (see [Figure 7-26](#9781430264453_Ch07.xhtml#Fig26)).\n\
    \n![9781430264453_Fig07-26.jpg](Images/9781430264453_Fig07-26.jpg)\n\n[Figure\
    \ 7-26](#9781430264453_Ch07.xhtml#_Fig26). Selecting the connection\n\n3.  Add\
    \ `TotalQuantity`, `TotalSales`, and `TotalMargin` from the `ResellerSales` table\
    \ to the `Values` drop area in the `Field List` window. Add the `Calendar` hierarchy\
    \ to `Row Labels` drop area.\n4.  Notice that some of the margins are negative.\
    \ To bring attention to the negative values you are going to format them in red.\n\
    5.  Select a `TotalMargin` cell in the pivot table. On the `Home` tab, click the\
    \ `Conditional Formatting` drop down. Select the `Highlight Cells` ![image](Images/arrow.jpg)`Less\
    \ Than` option. Format the cells that are less than 0 with red text (see [Figure\
    \ 7-27](#9781430264453_Ch07.xhtml#Fig27)).\n\n![9781430264453_Fig07-27.jpg](Images/9781430264453_Fig07-27.jpg)\n\
    \n[Figure 7-27](#9781430264453_Ch07.xhtml#_Fig27). Setting conditional formatting\n\
    \n6.  When finished you should see an icon next to the selected cell. Click it\
    \ and select the `All Cells Showing TotalMargin Values` option.\n7.  Select one\
    \ of the `TotalSales` cells. This time, select the `Data Bars` under the `Conditional\
    \ Formatting` drop-down. Select one of the gradient styles. After selecting the\
    \ `Data Bar`, you should see a small icon next to the values. Click it and select\
    \ the `All Cells Showing TotalSales Values`.\n8.  Your Pivot table should look\
    \ similar to [Figure 7-28](#9781430264453_Ch07.xhtml#Fig28). Expand the years\
    \ and notice the formatting shows up for the quarters, months, and years.\n\n\
    ![9781430264453_Fig07-28.jpg](Images/9781430264453_Fig07-28.jpg)\n\n[Figure 7-28](#9781430264453_Ch07.xhtml#_Fig28).\
    \ Adding data bars to the pivot table"
  raw: "When creating pivot tables and charts to display and make sense of the data,\
    \ you often want to create a dashboard that easily allows you to determine performance.\
    \ You may be interested in sales performance, network performance, or assembly-line\
    \ performance. Dashboards combine visual representations, such as key performance\
    \ indicators (KPIs), graphs, and charts, into one holistic view of the process.\
    \ Although they are not technically considered  dashboard tools, you can create\
    \ some very compelling data displays using Excel with Power Pivot tables and charts\
    \ that can then be displayed and shared in SharePoint.\n\nWhen adding multiple\
    \ charts and tables to a dashboard, you may want to link them together so they\
    \ represent the same data in different ways. You also will probably want to control\
    \ them with the same slicers so that they stay in sync. The easiest way to do\
    \ this is to add them using the Insert tab and selecting PivotChart & PivotTable\
    \ (see [Figure 7-19](#9781430264453_Ch07.xhtml#Fig19)).\n\n![9781430264453_Fig07-19.jpg](Images/9781430264453_Fig07-19.jpg)\n\
    \n[Figure 7-19](#9781430264453_Ch07.xhtml#_Fig19). Adding a pivot chart and a\
    \ related pivot table\n\nAdding the pivot chart and pivot table in this way creates\
    \ a link between them so that when you add a field to one, it adds the same field\
    \ to the other. Also when you add a slicer to the page, it automatically hooks\
    \ up the slicer to both the pivot table and the pivot chart. [Figure 7-20](#9781430264453_Ch07.xhtml#Fig20)\
    \ shows a simple dashboard consisting of a linked pivot table, pivot chart and\
    \ slicer.\n\n![9781430264453_Fig07-20.jpg](Images/9781430264453_Fig07-20.jpg)\n\
    \n[Figure 7-20](#9781430264453_Ch07.xhtml#_Fig20). Creating a simple dashboard\
    \ in Excel\n\nIf you need to connect multiple charts together,  open the Model\
    \ Designer and select the PivotTable drop-down on the Home tab (see [Figure 7-21](#9781430264453_Ch07.xhtml#Fig21)).\
    \ This also allows you to insert a flattened pivot table, which is useful for\
    \ printing.\n\n![9781430264453_Fig07-21.jpg](Images/9781430264453_Fig07-21.jpg)\n\
    \n[Figure 7-21](#9781430264453_Ch07.xhtml#_Fig21). Connecting multiple pivot charts\n\
    \nUsing Cube Functions\n\nUsing the built-in PivotChart and PivotTable layouts\
    \ in Excel allows you to create compelling dashboards and provide great interfaces\
    \ for browsing the data. There are times, however, when you may find yourself\
    \ frustrated with some of the limitations inherent with these structures. For\
    \ example, you cannot insert your own columns inside the pivot table to create\
    \ a custom calculation. You may also want to display the data in a non-tabular\
    \ format for a customized report. This is where the Excel cube functions are really\
    \ useful.\n\nThe Excel cube functions allow you to connect directly to the Power\
    \ Pivot data model without needing to use a pivot table. The cube functions are\
    \ Excel functions (as opposed to DAX functions) and can be found on the Excel\
    \ Formulas tab under the More Functions drop-down (see [Figure 7-22](#9781430264453_Ch07.xhtml#Fig22)).\n\
    \n![9781430264453_Fig07-22.jpg](Images/9781430264453_Fig07-22.jpg)\n\n[Figure\
    \ 7-22](#9781430264453_Ch07.xhtml#_Fig22). Using cube functions to connect to\
    \ the model\n\nThe easiest way to see how these functions are used is to create\
    \ a pivot table, and on the PivotTable Tools Analyze tab, select the OLAP Tools\
    \ drop-down, and then select the Convert To Formulas option (see [Figure 7-23](#9781430264453_Ch07.xhtml#Fig23)).\n\
    \n![9781430264453_Fig07-23.jpg](Images/9781430264453_Fig07-23.jpg)\n\n[Figure\
    \ 7-23](#9781430264453_Ch07.xhtml#_Fig23). Converting from a pivot table to cube\
    \ functions\n\n[Figure 7-24](#9781430264453_Ch07.xhtml#Fig24) shows the table\
    \ after the conversion to cube functions. It uses the `CUBEMEMBER` function to\
    \ return a member or tuple (ordered list) from the cube and the `CUBEVALUE` function\
    \ to return an aggregated value from the cube.\n\n![9781430264453_Fig07-24.jpg](Images/9781430264453_Fig07-24.jpg)\n\
    \n[Figure 7-24](#9781430264453_Ch07.xhtml#_Fig24). Using cube functions to retrieve\
    \ values\n\nThe following formula is used to return the column label for cell\
    \ C3:\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Geography].[CountryRegionCode].&[AU]\"\
    )\n```\n\nThe first parameter is the name of the connection to the data model\
    \ and the second parameter is the member expression.\n\nThe value in cell C4 is\
    \ returned using the following formula:\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,$B$2,$B4,C$3)\n```\n\nThis formula uses cell references, but you can replace\
    \ these with the cube functions contained in these cells:\n\n```\n=CUBEVALUE\n\
    (\n    \"ThisWorkbookDataModel\",\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\"\
    [Measures].[Sum of SalesAmount]\"),\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"),\n    CUBEMEMBER(\"\
    ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\")\n\
    )\n```\n\nNotice one of the parameters is the `CUBEMEMBER` function returning\
    \ the aggregation you want the value of; the other parameters use the `CUBEMEMBER`\
    \ to define the portion of the cube used in the aggregation.\n\n![9781430264453_Fig07-25.jpg](Images/9781430264453_Fig07-25.jpg)\n\
    \n[Figure 7-25](#9781430264453_Ch07.xhtml#_Fig25). Rearranging the data\n\nYou\
    \ can now rearrange the values and labels to achieve the layout and formatting\
    \ that you need (see [Figure 7-25](#9781430264453_Ch07.xhtml#Fig25)).\n\nHANDS-ON\
    \ LAB—CREATING THE BI INTERFACE IN EXCEL\n\nIn the following lab you will\n\n\
    *   Add conditional formatting to a pivot table.\n*   Create a chart to help analyze\
    \ data.\n*   Link together pivot tables and pivot charts.\n*   Use cube functions\
    \ to display model data.\n\n1.  In the LabStarters folder, open the `LabChapter7.xlsx`\
    \ file. This file contains inventory and sales data from the test AdventureWorksDW\
    \ database.\n2.  In Excel Sheet1 insert a Power Pivot table using the PivotTable\
    \ button on the Insert tab. Select the Use An External Data Source and click the\
    \ Choose Connection button. On the Tables tab of the Existing Connections window,\
    \ select Tables In Workbook Data Model (see [Figure 7-26](#9781430264453_Ch07.xhtml#Fig26)).\n\
    \n![9781430264453_Fig07-26.jpg](Images/9781430264453_Fig07-26.jpg)\n\n[Figure\
    \ 7-26](#9781430264453_Ch07.xhtml#_Fig26). Selecting the connection\n\n3.  Add\
    \ TotalQuantity, TotalSales, and TotalMargin from the ResellerSales table to the\
    \ Values drop area in the Field List window. Add the Calendar hierarchy to Row\
    \ Labels drop area.\n4.  Notice that some of the margins are negative. To bring\
    \ attention to the negative values you are going to format them in red.\n5.  Select\
    \ a TotalMargin cell in the pivot table. On the Home tab, click the Conditional\
    \ Formatting drop down. Select the Highlight Cells ![image](Images/arrow.jpg)\
    \ Less Than option. Format the cells that are less than 0 with red text (see [Figure\
    \ 7-27](#9781430264453_Ch07.xhtml#Fig27)).\n\n![9781430264453_Fig07-27.jpg](Images/9781430264453_Fig07-27.jpg)\n\
    \n[Figure 7-27](#9781430264453_Ch07.xhtml#_Fig27). Setting conditional formatting\n\
    \n6.  When finished you should see an icon next to the selected cell. Click it\
    \ and select the All Cells Showing TotalMargin Values option.\n7.  Select one\
    \ of the TotalSales cells. This time, select the Data Bars under the Conditional\
    \ Formatting drop-down. Select one of the gradient styles. After selecting the\
    \ Data Bar, you should see a small icon next to the values. Click it and select\
    \ the All Cells Showing TotalSales Values.\n8.  Your Pivot table should look similar\
    \ to [Figure 7-28](#9781430264453_Ch07.xhtml#Fig28). Expand the years and notice\
    \ the formatting shows up for the quarters, months, and years.\n\n![9781430264453_Fig07-28.jpg](Images/9781430264453_Fig07-28.jpg)\n\
    \n[Figure 7-28](#9781430264453_Ch07.xhtml#_Fig28). Adding data bars to the pivot\
    \ table"
  trans: "好的，作为高级文档工程师和翻译员，我将遵循给定的注意事项和示例，将以下英文文本翻译成中文。\n\n\n在创建数据透视表和图表以显示和理解数据时，您通常希望创建一个能够轻松评估绩效的仪表板。您可能对销售绩效、网络性能或装配线效率感兴趣。仪表板将可视化表示，例如关键绩效指标（KPI）、图形和图表，整合到对该流程的整体视图中。尽管从技术上讲，它们不被视为仪表板工具，但您可以使用\
    \ Excel 和 Power Pivot 数据透视表及图表创建一些非常引人注目的数据展示，然后可以在 SharePoint 中显示和共享这些内容。\n\n\
    当向仪表板添加多个图表和表格时，您可能希望将它们链接在一起，以便它们以不同的方式表示相同的数据。您也可能希望使用相同的切片器来控制它们，使它们保持同步。最简单的方法是使用`插入`选项卡并选择`数据透视图和数据透视表`来添加它们（参见图\
    \ 7-19）。\n\n![9781430264453_Fig07-19.jpg](img/9781430264453_Fig07-19.jpg)\n\n\
    图 7-19. 添加数据透视图和关联的数据透视表\n\n以这种方式添加数据透视图和数据透视表会在它们之间建立链接，因此当您向其中一个添加字段时，它会向另一个添加相同的字段。此外，当您向页面添加切片器时，它会自动将切片器连接到数据透视表和数据透视图。图\
    \ 7-20 展示了一个由链接的数据透视表、数据透视图和切片器组成的简单仪表板。\n\n![9781430264453_Fig07-20.jpg](img/9781430264453_Fig07-20.jpg)\n\
    \n图 7-20. 在 Excel 中创建简单的仪表板\n\n如果需要连接多个图表，请打开模型设计器，然后在`主页`选项卡上选择`数据透视表`下拉菜单（参见图\
    \ 7-21）。这还允许您插入扁平化的数据透视表，这对于打印非常有用。\n\n![9781430264453_Fig07-21.jpg](img/9781430264453_Fig07-21.jpg)\n\
    \n图 7-21. 连接多个数据透视图\n\n## 使用多维数据集函数\n\n在 Excel 中使用内置的`数据透视图`和`数据透视表`布局，您可以创建引人注目的仪表板，并为浏览数据提供出色的界面。然而，有时您可能会对这些结构固有的某些限制感到沮丧。例如，您无法在数据透视表内插入自己的列来创建自定义计算。您可能还希望以非表格格式显示数据以生成自定义报表。这时，Excel\
    \ 的多维数据集函数就非常有用了。\n\nExcel 的多维数据集函数允许您直接连接到 Power Pivot 数据模型，而无需使用数据透视表。多维数据集函数是\
    \ Excel 函数（与 DAX 函数相对），可以在 Excel 的`公式`选项卡下的`其他函数`下拉菜单中找到（参见图 7-22）。\n\n![9781430264453_Fig07-22.jpg](img/9781430264453_Fig07-22.jpg)\n\
    \n图 7-22. 使用多维数据集函数连接到模型\n\n了解如何使用这些函数的最简单方法是创建一个数据透视表，然后在`数据透视表工具 分析`选项卡上，选择`OLAP\
    \ 工具`下拉菜单，然后选择`转换为公式`选项（参见图 7-23）。\n\n![9781430264453_Fig07-23.jpg](img/9781430264453_Fig07-23.jpg)\n\
    \n图 7-23. 从数据透视表转换为多维数据集函数\n\n图 7-24 显示了转换为多维数据集函数后的表格。它使用`CUBEMEMBER`函数从多维数据集中返回一个成员或元组（有序列表），使用`CUBEVALUE`函数从多维数据集中返回一个聚合值。\n\
    \n![9781430264453_Fig07-24.jpg](img/9781430264453_Fig07-24.jpg)\n\n图 7-24. 使用多维数据集函数检索值\n\
    \n以下公式用于返回单元格 C3 的列标签：\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Geography].[CountryRegionCode].&[AU]\"\
    )\n```\n\n第一个参数是数据模型连接的名称，第二个参数是成员表达式。\n\n单元格 C4 中的值通过以下公式返回：\n\n```\n=CUBEVALUE(\"\
    ThisWorkbookDataModel\",$B$2,$B4,C$3)\n```\n\n此公式使用了单元格引用，但您可以将这些引用替换为这些单元格中包含的多维数据集函数：\n\
    \n```\n=CUBEVALUE\n(\n    \"ThisWorkbookDataModel\",\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Measures].[Sum of SalesAmount]\"),\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"),\n    CUBEMEMBER(\"\
    ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\")\n\
    )\n```\n\n请注意，其中一个参数是返回您所需值的聚合的`CUBEMEMBER`函数；其他参数使用`CUBEMEMBER`来定义用于聚合的多维数据集部分。\n\
    \n![9781430264453_Fig07-25.jpg](img/9781430264453_Fig07-25.jpg)\n\n图 7-25. 重新排列数据\n\
    \n现在，您可以重新排列值和标签，以获得所需的布局和格式（参见图 7-25）。\n\n## 动手实验——在 Excel 中创建 BI 界面\n\n在以下实验中，您将：\n\
    \n-   向数据透视表添加条件格式。\n-   创建图表以帮助分析数据。\n-   链接数据透视表和数据透视图。\n-   使用多维数据集函数显示模型数据。\n\
    \n1.  在`LabStarters`文件夹中，打开`LabChapter7.xlsx`文件。该文件包含测试 AdventureWorksDW 数据库中的库存和销售数据。\n\
    2.  在 Excel 的 Sheet1 中，使用`插入`选项卡上的`数据透视表`按钮插入一个 Power Pivot 表。选择`使用外部数据源`，然后单击`选择连接`按钮。在`现有连接`窗口的`表`选项卡上，选择`工作簿数据模型中的表`（参见图\
    \ 7-26）。\n\n![9781430264453_Fig07-26.jpg](img/9781430264453_Fig07-26.jpg)\n\n\
    图 7-26. 选择连接\n\n3.  将`ResellerSales`表中的`TotalQuantity`、`TotalSales`和`TotalMargin`添加到`字段列表`窗口的`值`拖放区域。将`Calendar`层次结构添加到`行标签`拖放区域。\n\
    4.  请注意，某些边距值为负。为了引起对负值的注意，您将把它们格式化为红色。\n5.  在数据透视表中选择一个`TotalMargin`单元格。在`主页`选项卡上，单击`条件格式`下拉菜单。选择`突出显示单元格规则`\
    \ ![image](img/arrow.jpg) `小于`选项。将小于 0 的单元格格式化为红色文本（参见图 7-27）。\n\n![9781430264453_Fig07-27.jpg](img/9781430264453_Fig07-27.jpg)\n\
    \n图 7-27. 设置条件格式\n\n6.  完成后，您应该在选定单元格旁边看到一个图标。单击它并选择`显示 TotalMargin 值的所有单元格`选项。\n\
    7.  选择一个`TotalSales`单元格。这次，在`条件格式`下拉菜单下选择`数据条`。选择一种渐变样式。选择`数据条`后，您应该在值旁边看到一个小图标。单击它并选择`显示\
    \ TotalSales 值的所有单元格`。\n8.  您的数据透视表应类似于图 7-28。展开年份，注意格式化会显示在季度、月份和年份上。\n\n![9781430264453_Fig07-28.jpg](img/9781430264453_Fig07-28.jpg)\n\
    \n图 7-28. 向数据透视表添加数据条\n"
- fmt: "9.  打开`sheet2`，在`Insert`选项卡中，选择`PivotChart`下拉菜单。从下拉菜单中选择`pivot chart`。使用`Tables\
    \ In Workbook Data Model`连接，将图表插入到当前工作表中。\n10. 在`Field List`窗口中，将`ResellerSales`表中的`TotalSales`添加到`Values`拖放区域，并将`Geography`表中的`CountryRegionName`添加到`Axis\
    \ Fields`拖放区域。您应该会看到一个按国家显示销售额的柱形图（参见[图 7-29](#9781430264453_Ch07.xhtml#Fig29)）。\n\
    \n![9781430264453_Fig07-29.jpg](Images/9781430264453_Fig07-29.jpg)\n\n[图 7-29](#9781430264453_Ch07.xhtml#_Fig29).\
    \ 添加柱形图\n选中该柱形图。您应该会看到`PivotChart Tools`选项卡。在`Design`选项卡中，您可以更改图表颜色、布局和图表类型。\n\
    \n11. 在`Layout`选项卡中，您可以修改标题、图例、标签和网格线。`Format`选项卡允许您设置图表中的形状和文本格式。`Analyze`选项卡允许您显示/隐藏字段按钮。\n\
    12. 将图表标题重命名为`Sales By Country`。隐藏字段按钮和图例。删除网格线。\n13. 右键单击垂直轴并选择`Format Axis`。在`Axis\
    \ Options`下，将`Display Units`更改为`Millions`。在`Number`节点下，将`Category`更改为`Currency`，小数位数设置为零。您的图表应类似于[图\
    \ 7-30](#9781430264453_Ch07.xhtml#Fig30)。\n\n![9781430264453_Fig07-30.jpg](Images/9781430264453_Fig07-30.jpg)\n\
    \n[图 7-30](#9781430264453_Ch07.xhtml#_Fig30). 格式化柱形图\n\n14. 有时您希望同时查看数据图表和数据表。为此，请转到`Power\
    \ Pivot Model Designer`，在`Home`选项卡中，选择`PivotTable`下拉菜单。从下拉菜单中选择`Chart And Table\
    \ (Horizontal)`。将图表和表格插入到新工作表中。\n15. 将图表类型更改为饼图。在图表对应的`Field List`窗口中，将`TotalSales`字段添加到`Values`拖放区域，将`CountryRegionCode`添加到`Axis\
    \ Fields`拖放区域。\n16. 将图表标题更改为`Sales By Country`并移除字段按钮。\n17. 在`Design`选项卡上更改`Chart\
    \ Layout`，使值显示为不带小数位的货币格式（参见[图 7-31](#9781430264453_Ch07.xhtml#Fig31)）。\n\n![9781430264453_Fig07-31.jpg](Images/9781430264453_Fig07-31.jpg)\n\
    \n[图 7-31](#9781430264453_Ch07.xhtml#_Fig31). 创建销售饼图\n\n18. 单击数据透视表以调出其`Field\
    \ List`窗口。将`ResellerSales`表的`TotalSales`添加到`Values`拖放区域。将`Product Subcategory`添加到`Row\
    \ Labels`拖放区域。\n19. 选中饼图，为产品类别和年份各插入一个切片器（参见[图 7-32](#9781430264453_Ch07.xhtml#Fig32)）。验证切片器是否仅筛选饼图，而不影响数据透视表。\n\
    \n![9781430264453_Fig07-32.jpg](Images/9781430264453_Fig07-32.jpg)\n\n[图 7-32](#9781430264453_Ch07.xhtml#_Fig32).\
    \ 插入切片器\n\n20. 选中`Year`切片器，在`Slicer Tools Options`选项卡中，单击`Report Connections`按钮。添加与饼图位于同一工作表的数据透视表。对类别切片器重复此操作。\n\
    21. 验证切片器是否会同时筛选图表和数据透视表。您的仪表板应类似于[图 7-33](#9781430264453_Ch07.xhtml#Fig33)。\n\
    \n![9781430264453_Fig07-33.jpg](Images/9781430264453_Fig07-33.jpg)\n\n[图 7-33](#9781430264453_Ch07.xhtml#_Fig33).\
    \ 创建仪表板\n\n22. 向工作簿中添加一个新工作表。您将使用多维数据集函数计算总销售额最高的产品和经销商。最终结果应类似于[图 7-34](#9781430264453_Ch07.xhtml#Fig34)。\n\
    \n![9781430264453_Fig07-34.jpg](Images/9781430264453_Fig07-34.jpg)\n\n[图 7-34](#9781430264453_Ch07.xhtml#_Fig34).\n\
    \n23. 在单元格`B1`中添加以下代码以选择`TotalSales`度量值。\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Measures].[TotalSales]\")\n```\n\n24. 在`B2`中，使用以下函数获取按`TotalSales`降序排列的经销商集合。您将使用此集合来选择排名靠前的经销商。\n\
    \n```\n=CUBESET(\"ThisWorkbookDataModel\",\n    \"[Reseller].[ResellerName].children\"\
    ,\"Top Reseller\",2,B1)\n```\n\n25. 在`B3`中，使用此函数获取按`TotalSales`降序排列的产品集合。\n\n\
    ```\n=CUBESET(\"ThisWorkbookDataModel\",\n     \"[Product].[Product].children\"\
    ,\"Top Products\",2,B1)\n```\n\n26. 在`C2`中，使用`CUBERANKEDMEMBER`函数从`B2`中的函数返回的集合中获取排名靠前的经销商。\n\
    \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n```\n\n27. 在`C3`中，使用`CUBERANKEDMEMBER`函数从`B3`中的函数返回的集合中获取排名靠前的产品。\n\
    \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B3,1)\n```\n\n28. 在`D2`中，使用`CUBEVALUE`函数获取在`C2`中找到的排名靠前经销商的总销售额。请注意，您必须将在`C2`中找到的经销商名称连接到\
    \ Power Pivot 模型中的`[Reseller].[ResellerName]`属性。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n    \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\"\
    )\n```\n\n29. 使用类似的`CUBEVALUE`函数，您可以获取排名靠前产品的总销售额值。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n      \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\")\n```\n\
    \n总结\n\n正如您在本章中所见，Excel 是一个功能丰富的环境，可用于使用数据透视表和数据透视图创建仪表板。至此，您应该能够自如地使用工作簿模型作为数据源来创建数据透视表和数据透视图。您还使用了\
    \ Excel 多维数据集函数直接查询模型，而无需使用数据透视表。尽管本章涵盖了入门基础知识，但关于 Excel 以及它如何帮助您分析数据，您还有更多需要学习。我鼓励您深入研究这些功能。下一章是接下来三章中的第一章，您将了解\
    \ Power Pivot 模型的另一个有用界面。Power View 为用户探索数据提供了丰富的交互式界面。您将首先学习如何优化模型以在 Power View\
    \ 中进行分析，接着使用 Power View 创建标准报表，然后学习如何在 Power View 中创建引人注目的交互式报表。\n\n## 第 2 部分\n\
    \n![image](Images/frontdot.jpg)\n\n使用 Power View 构建交互式报表和仪表板\n\n### 第 8 章\n\n\
    ![image](Images/frontdot.jpg)\n\n为 Power View 优化 Power Pivot 模型\n\nPower View\
    \ 是 Excel 中的一种工作表类型，允许用户开发交互式可视化效果，鼓励对数据进行临时探索。对于希望探索数据并从数据中获取洞察的非 Excel 高级用户来说，它是一个理想工具。由于\
    \ Power View 可视化基于 Power Pivot 模型，您需要为用户提供一个扎实的模型作为这些可视化效果的基础。一个经过优化、适合 Power\
    \ View 使用的良好 Power Pivot 模型，将决定用户体验是极佳还是极其糟糕。有多种方法可以优化 Power Pivot 模型，使其更便于在 Power\
    \ View 中创建报表。本章将回顾这些设置，并展示如何创建支持多种 Power View 功能的模型。\n\n完成本章后，您将能够：\n\n*   了解\
    \ Power View 中可用的可视化类型。\n*   在 Power View 中创建基本可视化效果。\n*   设置 Power Pivot 模型中的属性以改善\
    \ Power View 体验。\n\n![Image](Images/sq.jpg) **注意** 如需彩色图片副本，请访问 `http://www.apress.com/9781430264453`\
    \ 的“源代码/下载”部分。\n\n### 使用 Power View 可视化数据"
  raw: "9.  Open sheet2 and on the Insert tab, select the PivotChart drop-down. From\
    \ the drop-down, chose the pivot chart. Insert the chart on the current sheet\
    \ using the Tables In Workbook Data Model connection.\n10.  In the Field List\
    \ window, add the TotalSales from the ResellerSales table to the Values drop area\
    \ and add the CountryRegionName from the Geography table to the Axis Fields drop\
    \ area. You should see a column chart showing sales by country (see [Figure 7-29](#9781430264453_Ch07.xhtml#Fig29)).\n\
    \n![9781430264453_Fig07-29.jpg](Images/9781430264453_Fig07-29.jpg)\n\n[Figure\
    \ 7-29](#9781430264453_Ch07.xhtml#_Fig29). Adding a column chartSelect the column\
    \ chart. You should see the PivotChart Tools tabs. In the Design tab, you can\
    \ change the chart colors, change the layout, and change the chart type\n\n11.\
    \  On the Layout tab, you can work with changing the titles, legend, labels, and\
    \ gridlines. The Format tab lets you format the shapes and text in the chart.\
    \ The Analyze tab lets you show/hide the field buttons.\n12.  Rename the title\
    \ of the chart to **Sales By Country**. Hide the field buttons and the legend.\
    \ Remove the gridlines.\n13.  Right-click on the vertical axis and select Format\
    \ Axis. Under Axis Options, change the Display Units to Millions. Under the Number\
    \ node, change the Category to Currency with zero decimal places. Your chart should\
    \ look similar to [Figure 7-30](#9781430264453_Ch07.xhtml#Fig30).\n\n![9781430264453_Fig07-30.jpg](Images/9781430264453_Fig07-30.jpg)\n\
    \n[Figure 7-30](#9781430264453_Ch07.xhtml#_Fig30). Formatting the column chart\n\
    \n14.  Sometimes you want to see a data chart and a data table together. To do\
    \ this, go to the Power Pivot Model Designer and on the Home tab, select the PivotTable\
    \ drop-down. From the drop-down, chose the Chart And Table (Horizontal). Insert\
    \ the chart and table on a new sheet.\n15.  Change the chart type to a pie chart.\
    \ On the Field List window for the chart, add the TotalSales field to the Values\
    \ drop area and the CountryRegionCode to the Axis Fields drop area.\n16.  Change\
    \ the title of the chart to Sales By Country and remove the field buttons.\n17.\
    \  Change the Chart Layout on the Design tab to show values as currency with no\
    \ decimals (see [Figure 7-31](#9781430264453_Ch07.xhtml#Fig31)).\n\n![9781430264453_Fig07-31.jpg](Images/9781430264453_Fig07-31.jpg)\n\
    \n[Figure 7-31](#9781430264453_Ch07.xhtml#_Fig31). Creating the sales pie chart\n\
    \n18.  Click on the pivot table to bring up its Field List window. Add the ResellerSales\
    \ TotalSales to the Values drop area. Add the Product Subcategory to the Row Labels\
    \ drop area.\n19.  With the pie chart selected, insert a slicer for the product\
    \ category and one for the year (see [Figure 7-32](#9781430264453_Ch07.xhtml#Fig32)).\
    \ Verify that the slicers filter the pie chart but not the pivot table.\n\n![9781430264453_Fig07-32.jpg](Images/9781430264453_Fig07-32.jpg)\n\
    \n[Figure 7-32](#9781430264453_Ch07.xhtml#_Fig32). Inserting the slicers\n\n20.\
    \  Select the Year slicer and on the Slicer Tools Options tab, click the Report\
    \ Connections button. Add the pivot table located on the same sheet as the pie\
    \ chart. Repeat this for the category slicer.\n21.  Verify that the slicers filter\
    \ both the chart and the pivot table. Your dashboard should look similar to [Figure\
    \ 7-33](#9781430264453_Ch07.xhtml#Fig33).\n\n![9781430264453_Fig07-33.jpg](Images/9781430264453_Fig07-33.jpg)\n\
    \n[Figure 7-33](#9781430264453_Ch07.xhtml#_Fig33). Creating a dashboard\n\n22.\
    \  Add a new sheet to the workbook. You are going to use cube functions to calculate\
    \ the top product and top reseller in total sales. The final result should look\
    \ similar to [Figure 7-34](#9781430264453_Ch07.xhtml#Fig34).\n\n![9781430264453_Fig07-34.jpg](Images/9781430264453_Fig07-34.jpg)\n\
    \n[Figure 7-34](#9781430264453_Ch07.xhtml#_Fig34).\n\n23.  Add the following code\
    \ in B1 to select the TotalSales measure.\n\n```\n    =CUBEMEMBER(\"ThisWorkbookDataModel\"\
    ,\"[Measures].[TotalSales]\")\n    ```\n\n24.  In B2, use the following function\
    \ to get the set of resellers ordered by TotalSales descending. You will use this\
    \ set to select the top reseller.\n\n```\n    =CUBESET(\"ThisWorkbookDataModel\"\
    ,\n        \"[Reseller].[ResellerName].children\",\"Top Reseller\",2,B1)\n   \
    \ ```\n\n25.  In B3, use this function to get the set of products ordered by TotalSales\
    \ descending.\n\n```\n    =CUBESET(\"ThisWorkbookDataModel\",\n         \"[Product].[Product].children\"\
    ,\"Top Products\",2,B1)\n    ```\n\n26.  In C2, use the `CUBERANKEDMEMBER` function\
    \ to get the top reseller from the set returned by the function in B2.\n\n```\n\
    \    =CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n    ```\n\n27.  In C3\
    \ use the `CUBERANKEDMEMBER` function to get the top product from the set returned\
    \ by the function in B3.\n\n```\n    =CUBERANKEDMEMBER(\"ThisWorkbookDataModel\"\
    ,B3,1)\n    ```\n\n28.  In D2 use the `CUBEVALUE` function to get the total sales\
    \ of the top reseller found in C2\\. Notice you have to concatenate the name of\
    \ the reseller found in C2 to the `[Reseller].[ResellerName]` attribute in the\
    \ Power Pivot model.\n\n```\n    =CUBEVALUE(\"ThisWorkbookDataModel\",\n     \
    \   \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\")\n\
    \    ```\n\n29.  Using a similar `CUBEVALUE` function, you can get the total sales\
    \ value for the top product.\n\n```\n    =CUBEVALUE(\"ThisWorkbookDataModel\"\
    ,\n          \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\"\
    )\n    ```\n\nSummary\n\nAs you saw in this chapter, Excel is a feature-rich environment\
    \ for creating dashboards using pivot tables and pivot charts. At this point,\
    \ you should feel comfortable creating pivot tables and pivot charts using your\
    \ workbook model as a data source. You also used Excel cube functions to query\
    \ the model directly without needing to use a pivot table. Although this chapter\
    \ covered the basics to get you started, you have a lot more to learn about Excel\
    \ and how it can help you analyze your data. I encourage you to dig deeper into\
    \ these features. The next chapter is the first of three in which you will look\
    \ at another useful interface for your Power Pivot model. Power View provides\
    \ a rich interactive interface for users to explore the data. You will first look\
    \ at optimizing models for analysis in Power View, next you will create standard\
    \ reports using Power View, after that, you will look at creating compelling interactive\
    \ reports in Power View.\n\nPART 2\n\n![image](Images/frontdot.jpg)\n\nBuilding\
    \ Interactive Reports and Dashboards with Power View\n\nCHAPTER 8\n\n![image](Images/frontdot.jpg)\n\
    \nOptimizing Power Pivot Models for Power View\n\nPower View is a worksheet type\
    \ in Excel that lets users develop interactive visualizations that encourage ad-hoc\
    \ exploration of the data. It is an ideal tool for users who are not Excel power\
    \ users who want to explore and gain insight from the data. Since Power View visualizations\
    \ are based on a Power Pivot model, you need to provide users with a solid model\
    \ as a foundation for these visualizations. A good Power Pivot model tuned for\
    \ use by Power View will make the difference between a great user experience and\
    \ an extremely frustrating one. There are ways to optimize a Power Pivot model\
    \ so that it facilitates better report creation in Power View. This chapter reviews\
    \ these settings and shows how to create models that provide support for many\
    \ Power View features.\n\nAfter completing this chapter you will be able to\n\n\
    *   Understand the types of visualizations available in Power View.\n*   Create\
    \ basic visualizations in Power View.\n*   Set properties in the Power Pivot model\
    \ to improve the Power View experience.\n\n![Image](Images/sq.jpg) **Note**  For\
    \ copies of color figures, go to Source Code/Downloads at `http://www.apress.com/9781430264453`.\n\
    \nVisualizing Data with Power View"
