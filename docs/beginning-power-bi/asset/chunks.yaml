  trans: '

    借助 Power Map，你可以通过导览（tour）用数据讲述故事。`导览`是 Power Map 层级结构中的顶层对象。导览由一个或多个场景组成；`场景`就像数据的一个快照，能以独特的方式展示数据。例如，图
    12-17 和 图 12-18 展示了从不同视角查看的同一地图。你可以使用这两个视角创建场景，并将它们添加到导览中，从而从整个美国的视图缩放至仅显示东北部各州。


    ![9781430264453_Fig12-17.jpg](img/9781430264453_Fig12-17.jpg)


    图 12-17。展示整个美国的场景


    ![9781430264453_Fig12-18.jpg](img/9781430264453_Fig12-18.jpg)


    图 12-18。仅展示东北部各州的场景


    要捕获一个场景，请将地图调整至该场景所需的视角，然后点击工具栏上的 `Add Scene` 按钮。当你将场景添加到导览中时，它们会出现在 `导览编辑器`（Tour
    Editor）中（参见 图 12-19）。


    ![9781430264453_Fig12-19.jpg](img/9781430264453_Fig12-19.jpg)


    图 12-19。已添加场景的导览编辑器


    将场景添加到导览后，你可以通过在 `导览编辑器` 中拖放场景来重新排列场景顺序。你也可以更改某个场景，而不影响导览中的其他场景。你可以添加或移除地图图层、更改主题，以及更改场景的视觉视角。每个场景还拥有场景选项，允许你更改场景时长和过渡效果（参见
    图 12-20）。


    ![9781430264453_Fig12-20.jpg](img/9781430264453_Fig12-20.jpg)


    图 12-20。设置场景选项


    创建好场景并设置其过渡效果后，你可以点击 `主页`（Home）选项卡上的 `播放导览`（Play Tour）按钮来播放导览（参见 图 12-19）。导览创建完毕后，你可以将其导出为
    MP4 视频与他人分享，甚至可以为导览添加音轨（参见 图 12-21）。


    ![9781430264453_Fig12-21.jpg](img/9781430264453_Fig12-21.jpg)


    图 12-21。将导览导出为 MP4 视频文件


    现在你已经了解了 Power Map 的各种功能，是时候动手实践，用它来绘制一些数据了。要完成本实验，你需要安装最新的 Power Map 加载项。


    ## 动手实验——在 Power Map 中创建地图可视化


    在以下实验中，你将：


    *   创建柱状地图。

    *   创建区域地图。

    *   创建多层地图。

    *   创建带有时间轴的热力图。


    1.  在 `LabStarters` 文件夹中，打开 `LabChapter12.xlsx` 文件。该文件包含发电厂和排放数据，你将使用这些数据在 Power
    Map 中创建可视化。

    2.  在 Excel 的 `插入`（Insert）选项卡中，选择 `地图`（Map）下拉菜单，然后启动 Power Map。你应该会看到 Power Map
    设计器以及 `图层面板`（Layer Panel）中的表格（参见 图 12-22）。


    ![9781430264453_Fig12-22.jpg](img/9781430264453_Fig12-22.jpg)


    图 12-22。图层面板中列出的表格


    3.  将图层重命名为 `燃料类型`，并选择 `PowerStations` 表中的 `State` 字段作为地理信息。点击 `下一个`（Next）按钮。

    4.  将 `PlantCount` 字段添加到 `高度`（Height）下拉框，将 `FuelType` 字段添加到 `类别`（Category）下拉框。将地图切换为簇状柱形图，并放大至美国东北部。你应该会在每个州看到两个柱形：一个代表化石燃料发电厂，另一个代表绿色能源来源。

    5.  在 `图层窗格`（Layer Pane）的 `设置`（Settings）选项卡中，将化石燃料柱形的颜色更改为黑色，将绿色能源柱形的颜色更改为绿色。你还可以调整柱形的高度和粗细。最终地图应类似于图
    12-23。


    ![9781430264453_Fig12-23.jpg](img/9781430264453_Fig12-23.jpg)


    图 12-23。显示各州发电厂数量的簇状柱形图


    6.  在 `图层窗格` 的 `图层管理器`（Layer Manager）选项卡中，添加另一个名为 `CO2 排放量` 的图层。使用 `StateCO2Emissions`
    表中的 `State` 字段作为地理信息字段。

    7.  将地图类型更改为 `区域`（Region），并选择 `CO2 Emissions` 作为值字段。

    8.  在 `图层窗格` 的 `设置` 选项卡中，将区域的颜色更改为蓝色。将色阶调整为从零开始，以便你能看到各州数值之间的微小差异。

    9.  现在你应该在同一张地图上拥有两个图层，如图 12-24 所示。你可以使用 `图层窗格` 中的 `图层管理器` 选项卡来显示或隐藏地图上的各个图层。


    ![9781430264453_Fig12-24.jpg](img/9781430264453_Fig12-24.jpg)


    图 12-24。多层地图


    10. 保存并关闭 Excel 工作簿。

    11. 在 `LabStarters` 文件夹中，打开 `LabChapter12_2.xlsx` 文件。该文件包含飓风数据，你将使用这些数据在 Power
    Map 中创建热力图和时间线。

    12. 启动 Power Map 并创建一个名为 `桑迪` 的图层。使用 `HurricaneSandy` 数据，将 `Latitude` 和 `Longitude`
    字段添加到 `地理信息`（Geography）下拉框中。

    13. 将地图更改为热力图，并选择 `Wind Strength` 作为值字段，`DateTime` 作为时间字段。

    14. 你应该会看到如图 12-25 所示的热力图。请注意风速在登陆时达到最大值。使用播放轴，点击 `播放`（Play）按钮，观看飓风随时间的路径轨迹。


    ![9781430264453_Fig12-25.jpg](img/9781430264453_Fig12-25.jpg)


    图 12-25。描绘风速的热力图


    15. 完成后，保存并关闭 Excel。


    ## 总结


    正如你在本章中所见，Power Map 是一个强大的 Excel 加载项，提供了一套工具，帮助你可视化并深入了解具有地理成分的数据。你可以通过在地图（Bing
    map）上方以柱形形式绘制数据，来生成出色的 3D 可视化效果。此外，如果数据包含日期或时间成分，你可以使用 Power Map 可视化随时间变化的数据。你还学习了如何创建热力图和区域地图，对于某些类型的数据集，这些是可视化并发现数据洞察的绝佳方法。Power
    Map 的另一个强大功能是能够在同一张地图上叠加多个数据图层，这使你能够比较通过位置关联起来的数据。


    请记住，当前 Power Map 仍在开发中，新功能会定期添加。请确保你使用的是最新版本，以便充分利用这些功能。

