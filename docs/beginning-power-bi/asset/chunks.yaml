    \ of Sales],DATEADD('Date'[Datekey],-1,day))\n```\n\nNow that you know how to\
    \ shift the date context, it is time to look at functions you can use in your\
    \ filters that return a single date.\n\nUsing Single Date Functions\n\nDAX contains\
    \ a set of functions that return a single date. These are usually used when filtering\
    \ the date context. For example the `FIRSTDATE` function returns the first date\
    \ in the column of dates passed to it. As an example, you can use this in combination\
    \ with the `DATESBETWEEN` function to get the range of dates from the first day\
    \ to the 15th day of the current date context set of dates.\n\n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n\
    \ ,FIRSTDATE('Date'[FullDateAlternateKey])\n,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]),\
    \ 14, DAY))\n```\n\nThis can then be used as a filter in the `CALCULATE` function\
    \ to get the sales during the first 15 days of the period. The resulting pivot\
    \ table is shown in [Figure 6-11](#9781430264453_Ch06.xhtml#Fig11).\n\n![9781430264453_Fig06-11.jpg](Images/9781430264453_Fig06-11.jpg)\n\
    \n[Figure 6-11](#9781430264453_Ch06.xhtml#_Fig11). Calculating sales for the first\
    \ 15 days of the month\n\nIf you are just looking at the monthly periods, you\
    \ can use the functions `STARTOFMONTH` and `ENDOFMONTH` (there are ones for year\
    \ and quarter also.). The following expression is used to calculate the sum of\
    \ the sales for the last 15 days of the month."
  trans: "\n目前在 `DAX` 中有 35 个内置的时间智能函数。其中一些函数（如 `FIRSTNONBLANK`）返回单个日期。另一些函数（如 `PREVIOUSMONTH`）则返回一组日期。还有一些函数（如\
    \ `TOTALQTD`）会在时间范围内计算表达式。目前，`DAX` 内置的时间智能函数支持以 12 月 31 日为结束日的传统日历。它们也支持具有不同年终日期且包含四个季度（每个季度三个月）的财务日历。如果你需要使用自定义财务日历，则需要自行创建自定义计算。\n\
    \n现在你已经了解了如何在模型中创建和指定日期表，接下来我们来了解如何实现一些常用的时间智能函数来分析数据。\n\n## 基于时间段的评估\n\n数据分析中常见的一种分析是查看截止到某日期的值。例如，你可能希望查看年初至今的销售额或月初至今的能源消耗量。`DAX`\
    \ 提供了 `TOTALMTD`、`TOTALQTD` 和 `TOTALYTD` 函数，使得这项工作变得非常简单。例如，年初至今的总额定义如下：\n\n```\n\
    TOTALYTD(<表达式>,<日期>[,<筛选器>][,<年终日期>])\n```\n\n其中，`表达式` 是一个返回标量值的表达式。`日期` 是日期表的关键列。`筛选器`\
    \ 是一个可选的筛选表达式，`年终日期` 也是可选的——你可以用它来指示财务日历的年末日期。以下表达式用于计算销售额总和以及年初至今的销售额值。\n\n```\n\
    销售额总和:=SUM(Sales[SalesAmount])\n年初至今销售额:=TOTALYTD([销售额总和],'Date'[Datekey])\n```\n\
    \n如果要计算所有产品的年初至今销售额，请使用以下表达式：\n\n```\n所有产品年初至今销售额:=TOTALYTD([销售额总和],'Date'[Datekey],ALL('Product'))\n\
    ```\n\n图 6-6 显示了数据透视表中的度量值。你可以使用这些基础度量值来计算进一步的度量值，例如年初至今销售额占比和所有产品销售额占比。\n\n![9781430264453_Fig06-06.jpg](img/9781430264453_Fig06-06.jpg)\n\
    \n图 6-6. 计算年初至今的值\n\n你也可以使用另一组函数——`DATESMTD`、`DATESQTD` 和 `DATESYTD`——来创建相同的度量值。与之前的截止到某日期度量值一样，你需要将日期表中的日期键传递给这些函数。以下表达式使用\
    \ `CALCULATE` 函数配合 `DATESYTD` 筛选器来获取年初至今的销售额度量值。\n\n```\n年初至今销售额 2:=CALCULATE([销售额总和],DATESYTD('Date'[Datekey]))\n\
    ```\n\n使用 `CALCULATE` 函数和 `DATES` 函数比使用截止到某日期的函数更加灵活，因为你可以将它们用于任何类型的聚合，而不仅仅是求和。以下表达式用于计算年初至今的平均销售额。结果显示在图\
    \ 6-7 中。\n\n```\n平均销售额:=AVERAGE([SalesAmount])\n年初至今平均销售额:=CALCULATE([平均销售额],DATESYTD('Date'[Datekey]))\n\
    ```\n\n![9781430264453_Fig06-07.jpg](img/9781430264453_Fig06-07.jpg)\n\n图 6-7.\
    \ 计算年初至今的平均值\n\n现在你已经知道如何创建基于时间段的计算，可以使用它来比较过去业绩和当前业绩。但首先你需要知道如何移动日期上下文来计算过去业绩。\n\
    \n## 移动日期上下文\n\n如果你想将某一时期的业绩与过去同一时期的业绩进行比较，比如将当前月份的销售额与一年前同月的销售额进行比较，你需要移动日期上下文。`DAX`\
    \ 包含几个执行此操作的函数。其中用于移动日期上下文的最通用的函数之一是 `PARALLELPERIOD` 函数。与其他时间智能函数一样，你需要将日期表的关键列传递给该函数。你还需要指定间隔数量和间隔类型（年、季度或月）。\n\
    \n```\nPARALLELPERIOD(<日期>,<间隔数量>,<间隔>)\n```\n\n需要记住的一点是，`PARALLELPERIOD` 函数返回一组与间隔类型相对应的日期。如果你使用“年”，它将返回一年的日期；使用“月”间隔则返回一个月的日期。以下表达式计算去年同月的销售总额。图\
    \ 6-8 显示了计算结果。\n\n```\n去年同月销售额:=Calculate([销售额总和],\nPARALLELPERIOD('Date'[Datekey],-12,Month))\n\
    ```\n\n![9781430264453_Fig06-08.jpg](img/9781430264453_Fig06-08.jpg)\n\n图 6-8.\
    \ 计算平行时期的销售额\n\n请注意，如果你下钻到日期级别（参见图 6-9），你仍然会看到一年前该日期所在月份的月度总额。如前所述，这是因为在这种情况下，`PARALLELPERIOD`\
    \ 始终返回与当前行日期所在月份相同且为去年同月的日期集。\n\n![9781430264453_Fig06-09.jpg](img/9781430264453_Fig06-09.jpg)\n\
    \n图 6-9. 下钻到日级别仍显示月级别聚合\n\n现在你可以计算去年同月的销售额，并将其与当前销售额结合，以计算逐年月度销售额增长率。图 6-10 显示了结果。\n\
    \n```\n同比月度增长率:=([销售额总和]-[去年同月销售额])/[去年同月销售额] \n```\n\n![9781430264453_Fig06-10.jpg](img/9781430264453_Fig06-10.jpg)\n\
    \n图 6-10. 计算逐年月度增长率\n\n请注意，如果没有上一年度的销售额，数据透视表中会出现错误。你可以通过检查去年同月销售额是否为空并插入空值来控制这种情况。\n\
    \n```\n同比月度增长率:=IF(\nISBLANK([去年同月销售额]),\nBLANK(),\n([销售额总和]-[去年同月销售额])/[去年同月销售额])\n\
    ```\n\n另一个常用于更改日期上下文的函数是 `DATEADD` 函数。`DATEADD` 函数用于在当前日期上下文上添加一个日期间隔。你可以添加年、季度、月或日的间隔。\n\
    \n```\nDATEADD(<日期>,<间隔数量>,<间隔>)\n```\n\n以下计算使用 `DATEADD` 函数作为筛选器，求得上一天销售额的总和。\n\
    \n```\n上一天销售额:=Calculate([销售额总和],DATEADD('Date'[Datekey],-1,day))\n```\n\n现在你已经知道如何移动日期上下文，接下来我们将了解一些可以在筛选器中使用的、返回单个日期的函数。\n\
    \n## 使用单个日期函数\n\n`DAX` 包含一组返回单个日期的函数。这些函数通常用于筛选日期上下文。例如，`FIRSTDATE` 函数返回传递给它的日期列中的第一个日期。作为示例，你可以将其与\
    \ `DATESBETWEEN` 函数结合使用，以获取从当前日期上下文日期集中的第一天到第 15 天的日期范围。\n\n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n\
    \ ,FIRSTDATE('Date'[FullDateAlternateKey])\n,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]),\
    \ 14, DAY))\n```\n\n然后，这可以在 `CALCULATE` 函数中用作筛选器，以获取该时期前 15 天的销售额。生成的数据透视表如图 6-11\
    \ 所示。\n\n![9781430264453_Fig06-11.jpg](img/9781430264453_Fig06-11.jpg)\n\n图 6-11.\
    \ 计算月初前 15 天的销售额\n\n如果你只查看月度期间，你可以使用 `STARTOFMONTH` 和 `ENDOFMONTH` 函数（也有用于年和季度的对应函数）。以下表达式用于计算该月最后\
    \ 15 天的销售额总和。\n"
- fmt: "```\nLast 15 Day Sales:=CALCULATE(SUM(InternetSales[SalesAmount]),\n DATESBETWEEN('Date'[FullDateAlternateKey]\n\
    \ , DATEADD(ENDOFMONTH('Date'[FullDateAlternateKey]), -14, DAY)\n,ENDOFMONTH('Date'[FullDateAlternateKey])))\n\
    ```\n\nAlthough the majority of measures you need to aggregate from a lower level\
    \ to a higher level (for example, from days to months) are simple extensions of\
    \ the base aggregate, at times you need to use special aggregations to roll up\
    \ the measure. This type of measure is considered semi-additive and is covered\
    \ in the next section.\n\n## Creating Semi-additive Measures\n\nYou often encounter\
    \ semi-additive measures when analyzing data. Some common examples are inventory\
    \ and account balances. For example, to determine the total amount of inventory\
    \ at a current point in time, you add the inventory of all stores. However, to\
    \ find the total inventory of a store at the end of the month, you do not add\
    \ up the inventory for each day.\n\nIn order to deal with these situations `DAX`\
    \ contains the `FIRSTNONBLANK` and `LASTNONBLANK` functions. These functions return\
    \ the first or last date for a non-blank condition. For example, the following\
    \ expression determines the last non-blank date for the product inventory entries.\n\
    \n```\nLASTNONBLANK ('Date'[DateKey],CALCULATE (SUM(Inventory[UnitsInStock]))\n\
    ```\n\nThis is then combined with the `CALCULATE` function to determine the total\
    \ units in stock.\n\n```\nProduct Units In Stock:=CALCULATE(SUM(Inventory[UnitsInStock]),\n\
    \  LASTNONBLANK('Date'[DateKey],\n   CALCULATE(SUM(Inventory[UnitsInStock]))))\n\
    ```\n\nNow if you want to add up the units in stock across products, you can use\
    \ the following expression.\n\n```\nTotal Units In Stock:=SUMX(VALUES('Inventory'[ProductKey]),[Product\
    \ Units In Stock])\n```\n\n[Figure 6-12](#9781430264453_Ch06.xhtml#Fig12) shows\
    \ the resulting pivot table. Notice the Total Units In Stock measure is additive\
    \ across the products but non-additive across the dates.\n\n![9781430264453_Fig06-12.jpg](Images/9781430264453_Fig06-12.jpg)\n\
    \n[Figure 6-12](#9781430264453_Ch06.xhtml#_Fig12). Calculating units in stock\n\
    \nOne of the advantages of `DAX` is that once you learn a pattern you can extend\
    \ this to other scenarios. For example, you can employ the same techniques used\
    \ in this inventory calculation when calculating measures in a cash flow analysis.\
    \ The following calculation is used to calculate the ending balance.\n\n```\n\
    Balance:=CALCULATE ( SUM ( Finance[Amount]),\n  LASTNONBLANK ('Date'[DateKey],\n\
    \   CALCULATE(SUM ( Finance[Amount]))))\n```\n\nIn the previous examples the inventory\
    \ and balance were only entered as a row in the table when a change in inventory\
    \ or balance occurred. Often the balance or inventory is entered every day and\
    \ the same value is repeated until there is a change. In these cases, you can\
    \ use the `DAX` functions `CLOSINGBALANCEMONTH`, `CLOSINGBALANCEQUARTER`, and\
    \ `CLOSINGBALANCYEAR`. These functions look at the last date of the time period\
    \ and use that as the value for the time period. In other words, whatever the\
    \ value is on the last day of the month is returned by the `CLOSINGBALANCEMONTH`\
    \ function.\n\nAt this point you should have a good grasp of how the various time\
    \ functions work. In the following lab you will gain experience implementing some\
    \ of these functions.\n\n## HANDS-ON LAB—IMPLEMENTING TIME INTELLIGENCE IN POWER\
    \ PIVOT\n\nIn the following lab you will\n\n*   Create a date table.\n*   Use\
    \ time intelligence functions to analyze data.\n*   Create a Month over Month\
    \ Growth pivot table.\n*   Create an Inventory Level Report.\n\n1.  In the `LabStarters`\
    \ folder, open the `LabChapter6.xlsx` file. This file contains inventory and sales\
