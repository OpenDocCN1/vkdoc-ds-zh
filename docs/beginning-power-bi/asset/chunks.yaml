    ## 总结


    本章提供了一些用例，帮助你评估对本书其余主题的掌握程度。本书的目标是让你了解微软自助式BI堆栈中的各种工具。虽然本书使用了桌面版Excel和BI加载项，你也可以使用Office
    365版本的工具。希望你对自己使用这些工具已获得了足够的信心和经验，可以开始利用它们来分析和洞察自己的数据。


    现在你已经牢固掌握了这些工具的使用方法，可以轻松地处理更复杂的主题。有许多优秀的资源涵盖了可以用于分析数据的各种技术和模式。微软的Power BI网站（`www.microsoft.com/en-us/powerbi/default.aspx`）、Bill
    Jelen的网站（`www.mrexcel.com`）以及Rob Collie的Power Pivot Pro网站（`www.powerpivotpro.com`）都是极好的资源。至于更高级的主题，可以查看Chris
    Webb的BI博客（`http://cwebbbi.wordpress.com`）以及Marco Russo和Alberto Ferrari的SQLBI网站（`www.sqlbi.com/`）。


