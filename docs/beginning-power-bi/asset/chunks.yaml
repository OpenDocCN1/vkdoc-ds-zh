    3-6](#9781430264453_Ch03.xhtml#Fig6)中相同的错误信息。这是因为你可以从`Date`表追踪到`Sales`表，再到`Store`表，从而形成一条活动路径。


    ![9781430264453_Fig03-07.jpg](Images/9781430264453_Fig03-07.jpg)


    [Figure 3-7](#9781430264453_Ch03.xhtml#_Fig7). 间接活动关系


    你可能会遇到的另一个常见错误是，尝试在两个表之间创建关系时，键在至少一个表中不是唯一的。[Figure 3-8](#9781430264453_Ch03.xhtml#Fig8)展示了一个`Product`表和一个`Sales`表，两者都包含重复的`ProductNumber`。


