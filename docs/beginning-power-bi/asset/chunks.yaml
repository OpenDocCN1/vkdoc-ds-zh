  trans: '

    图 13-19 选择要分析的列


    选择 `Advanced` 链接会打开一个窗口，允许您调整算法的敏感度（请参阅图 13-20）。增加 `Minimum Support` 和 `Minimum
    Rule Probability` 参数会减少结果中的项目数量，但会提高结果的重要性。


    ![9781430264453_Fig13-20.jpg](img/9781430264453_Fig13-20.jpg)


    图 13-20 指定最小参数值


    运行分析后，会插入两个新的工作表。第一个工作表 `Shopping Basket Bundled Item`（购物篮捆绑商品）显示了捆绑在一起的商品，以及捆绑包的大小、销售数量、销售平均值和捆绑包的总价值（请参阅图
    13-21）。


    ![9781430264453_Fig13-21.jpg](img/9781430264453_Fig13-21.jpg)


    图 13-21 显示已售捆绑商品的分析结果


    第二个工作表 `Shopping Basket Recommendations`（购物篮推荐）列出了被推荐一同购买且概率很高的产品。例如，如果客户购买了公路自行车水壶架，您应该推荐他们也购买一个水壶（请参阅图
    13-22）。此工作表还包含统计数据，例如关联销售百分比和推荐平均值。


    ![9781430264453_Fig13-22.jpg](img/9781430264453_Fig13-22.jpg)


    图 13-22 交叉销售商品推荐


    现在您已经了解了各种表格分析工具的工作原理，是时候亲自动手实践其中的一些工具了。


    ## 动手实验——使用 Excel 中的表格分析工具


    在以下实验中，您将


    *   确定成为房主的关键影响因素。

    *   检测不同的客户群体。

    *   对已购买的产品进行购物篮分析。

    *   预测污染排放量。


    1.  在 `LabStarters` 文件夹中，打开 `LabChapter13.xlsx` 文件。此文件包含示例客户数据。您将使用表格分析工具对这些数据进行数据挖掘。

    2.  在 `Influencers`（影响因素）工作表上，单击数据表内的任意位置以显示 `Table Tools Analyze`（表格工具 分析）选项卡。在此选项卡上，选择
    `Analyze Key Influencers`（分析关键影响因素）按钮。在 `Column Selection`（列选择）窗口中，选择 `Home Owner`（房主）列进行分析，以找出关键因素。

    3.  选择以下要用于分析的列：`Marital Status`（婚姻状况）、`Gender`（性别）、`Income`（收入）、`Children`（子女数）、`Education`（教育程度）、`Occupation`（职业）、`Cars`（汽车数）、`Commute
    Distance`（通勤距离）和 `Age`（年龄）。运行分析，当出现 `Discrimination Reporting`（区分报告）窗口（请参阅图 13-23）时，您可以将其关闭，因为只有两个值需要比较，并且它们已被添加到报告中。


    ![9781430264453_Fig13-23.jpg](img/9781430264453_Fig13-23.jpg)


    图 13-23 选择要比较的值


    4.  在 `Key Influencers`（关键影响因素）报告中，请注意，在分析的列中，婚姻状况是关键影响因素。然而，子女数和通勤距离也是影响因素。同样有趣的是，教育程度和年龄并非关键影响因素。这可能是一个您想要进一步研究的领域，特别是因为这可能是样本量不够大导致的结果。

    5.  要检测不同的客户群体，请选择 `Categories`（类别）工作表。单击表格中的任意位置，然后在 `Table Tools Analyze`（表格工具
    分析）选项卡上选择 `Detect Categories`（检测类别）工具。

    6.  在 `Detect Categories`（检测类别）工具中，勾选 `Marital Status`（婚姻状况）、`Gender`（性别）、`Income`（收入）、`Children`（子女数）、`Education`（教育程度）、`Occupation`（职业）和
    `Age`（年龄）复选框，然后单击 `Run`（运行）按钮。

    7.  在 `Categories`（类别）工作表上，请注意有六个类别。使用 `Category Characteristics`（类别特征）表来确定对每个群体最重要的特征（请参阅图
    13-24）。您可以重命名这些类别；例如，`Category 1`（类别 1）主要由低收入群体组成，您可以将其重命名以反映这一点。


    ![9781430264453_Fig13-24.jpg](img/9781430264453_Fig13-24.jpg)


    图 13-24 确定类别群体的重要特征


    8.  表格下方是类别概要图表，您可以使用它来分析各个类别在不同属性上的值分布。花些时间更改图表上显示的类别和列来分析数据。

    9.  要对购买的产品进行购物篮分析，请选择 `Shopping Basket`（购物篮）工作表。此工作表包含在杂货店购买的商品。单击数据表中的任意位置，然后在
    `Table Tools Analyze`（表格工具 分析）选项卡上选择 `Shopping Basket Analysis`（购物篮分析）工具。

    10. 在 `Shopping Basket Analysis`（购物篮分析）窗口中，选择 `Order ID`（订单 ID）列作为 `Transaction
    ID`（交易 ID）。对于 `Item`（商品），选择 `Item`（商品）列，并将 `Item Value`（商品价值）保持设置为 `No Value Column`（无价值列）。

    11. 选择 `Advanced`（高级）链接，并在 `Advanced Parameters Setting`（高级参数设置）窗口中，将 `Minimum
    Support`（最小支持度）更改为 20 个商品，将 `Minimum Rule Probability`（最小规则概率）更改为 50%。

    12. 运行分析，在 `Shopping Basket Recommendations`（购物篮推荐）表中，请注意，客户在购买麦片时，有 60% 的情况会同时购买牛奶（请参阅图
    13-25）。


    ![9781430264453_Fig13-25.jpg](img/9781430264453_Fig13-25.jpg)


    图 13-25 查看交叉销售推荐


    13. 要执行预测，请选择 `Forecast`（预测）选项卡，其中包含 2000 年至 2010 年几个州的污染物排放数据。单击数据表中的任意位置，然后在
    `Table Tools Analyze`（表格工具 分析）选项卡上选择 `Forecast`（预测）工具。

    14. 在 `Forecast`（预测）窗口中，选择 `State`（州）列进行预测。将 `Time Stamp`（时间戳）设置为 `Year`（年份），并将
    `Periodicity Of Data`（数据周期）设置为 `Yearly`（每年）（请参阅图 13-26）。


    ![9781430264453_Fig13-26.jpg](img/9781430264453_Fig13-26.jpg)


    图 13-26 选择预测属性


    15. 运行预测。您现在将看到一个预测图，该图以虚线形式显示实际值的预测延伸（请参阅图 13-27）。


    ![9781430264453_Fig13-27.jpg](img/9781430264453_Fig13-27.jpg)


    图 13-27 生成的预测图


    16. 当您完成表格分析工具的试验后，保存并关闭 Excel 工作簿。


    ## 总结

    '
- fmt: "Although data mining is one of the most underutilized areas of business intelligence,\
    \ with the help of Excel’s table analysis tools it does not have to be. Although\
    \ data mining uses a set of complex algorithms and the traditional tools often\
    \ require you to be an expert in such algorithms to be able to implement them,\
    \ when you use the table analysis tools, Excel hides much of the complexity from\
    \ you. This chapter showed you how to use these tools to perform advanced data\
    \ analysis such as forecasting, clustering, and associations. You are now able\
    \ to utilize these tools to gain more insight into your data. Remember to look\
    \ beyond the specific examples and learn to apply the patterns in a variety of\
    \ situations.\n\nAt the time of this writing, Microsoft is moving its data mining\
    \ efforts into Microsoft Azure ML (Machine Learning) and has not been investing\
    \ in any upgrades to Excel’s data mining tools. This is unfortunate because Azure\
    \ ML is a cloud-only—based system and is a little advanced for the typical business\
    \ analyst. On the bright side, several third-party vendors (such as XLMiner and\
    \ Predixion) are stepping up and offering their own data mining add-in tools for\
    \ Excel. These tools are very similar to the look and feel of the table analysis\
    \ tools covered in this chapter and I think you will find using these tools to\
    \ be an easy transition.\n\nIn [Chapter 14](../Text/9781430264453_Ch14.xhtml),\
    \ you will look at two realistic case studies to solidify the concepts of the\
    \ previous chapters. By working through these case studies, you will be able to\
    \ gauge which areas you have mastered and which you need to study further. In\
    \ addition, you will look at some common patterns associated with data analysis\
    \ and how to implement these using the tools covered in this book.\n\n## CHAPTER\
    \ 14\n\n![image](Images/frontdot.jpg)\n\n# Creating a Complete Solution\n\nIn\
    \ the previous chapters, you gained experience working with each of the pieces\
    \ of Microsoft’s self-service BI tool set. You used Power Pivot, Power View, Power\
    \ Query, Power Map, and the Excel table analysis tools. This chapter provides\
    \ you with several use cases to solidify the concepts of the previous chapters.\
    \ By working through these use cases, you will gauge which areas you have mastered\
    \ and which you need to spend more time studying. Since this is sort of like your\
    \ final exam, I have deliberately not included step-by-step instructions like\
    \ I did for the previous exercises. Instead, I have given you general directions\
    \ that should be sufficient to get you started. If you get stuck, refer back to\
    \ the previous chapters to remind yourself of how to accomplish the task.\n\n\
    This chapter contains the following use cases:\n\n*   Reseller Sales analysis\n\
    *   Sales Quota analysis\n*   Sensor analysis\n\n## Use Case 1: Reseller Sales\
    \ Analysis\n\nIn this scenario, you work for a bike equipment company and have\
    \ been asked to analyze the sales data. You need to build a dashboard to compare\
    \ same-store sales growth from one month to the next. An added constraint is that\
    \ you only want to compare resellers who have been open for at least a year when\
    \ you make the comparison.\n\n### Load the Data\n\nCreate a new Excel workbook\
    \ named `StoreSalesAnalysis.xlsx`. In the `Chapter14Labs` folder, find the `UseCase1`\
    \ folder, which contains a `StoreSales.accdb` Access database. This database houses\
    \ the sales data you need to analyze. Using this as a data source, import the\
    \ data tables and columns listed in [Table 14-1](#9781430264453_Ch14.xhtml#Tab1).\n\
    \n[Table 14-1](#9781430264453_Ch14.xhtml#_Tab1). Store Sales Tables and Columns\
    \ to Import\n\n| Source Table | Friendly Name | Columns |\n| --- | --- | --- |\n\
    | `dbo_DimDate` | Date | `DateKey`, `FullDateAlternateKey`, `EnglishMonthName`,\
    \ `MonthNumberOfYear`, `CalendarQuarter`, `CalendarYear` |\n| `dbo_DimGeography`\
    \ | Location | `GeographyKey`, `City`, `StateProvinceCode`, `StateProvinceName`,\
    \ `CountryRegionCode`, `EnglishCountryRegionName`, `PostalCode` |\n| `dbo_DimProduct`\
    \ | Product | `ProductKey`, `ProductSubcategoryKey`, `EnglishProductName`, `StandardCost`,\
    \ `ListPrice`, `DealerPrice`, `LargePhoto` |\n| `dbo_DimProductCategory` | Category\
    \ | `ProductCategoryKey`, `EnglishProductCategoryName` |\n| `dbo_DimProductSubcategory`\
    \ | Subcategory | `ProductSubcategoryKey`, `EnglishProductSubcategoryName`, `ProductCategoryKey`\
    \ |\n| `dbo_DimReseller` | Reseller | `ResellerKey`, `GeographyKey`, `BusinessType`,\
    \ `ResellerName`, `YearOpened` |\n| `dbo_FactResellerSales` | ResellerSales |\
    \ `ProductKey`, `ResellerKey`, `OrderDateKey`, `SalesOrderNumber`, `SalesOrderLineNumber`,\
    \ `OrderQuantity`, `UnitPrice`, `ExtendedAmount`, `TotalProductCost`, `SalesAmount`\
    \ |\n\n### Create the Model\n\nAfter importing the tables, create the table relationships\
    \ using the appropriate keys. Your model should now look similar to [Figure 14-1](#9781430264453_Ch14.xhtml#Fig1).\n\
    \n![9781430264453_Fig14-01.jpg](Images/9781430264453_Fig14-01.jpg)\n\n[Figure\
    \ 14-1](#9781430264453_Ch14.xhtml#_Fig1). Store sales model\n\nRename the table\
    \ columns and show or hide the columns from client tools according to the information\
    \ listed in [Table 14-2](#9781430264453_Ch14.xhtml#Tab2).\n\n[Table 14-2](#9781430264453_Ch14.xhtml#_Tab2).\
    \ Table and Column Properties\n\n![Table14-2](Images/Table14-2.jpg)\n\nIn the\
    \ `Date` table, create a calendar hierarchy of Year - Quarter - Month. Mark the\
    \ table as the `Date` table with the `Full Date` column as the key. Sort the `Month`\
    \ column by the `Month Number` column. Format the `Full Date` column to only show\
    \ the date and not the time.\n\n### Create Calculated Columns\n\nUsing the DAX\
    \ `RELATED` function, create a calculated column in the `Product` table for `Product\
    \ Subcategory` and `Product Category`.\n\n```\n[Category]\n=IF(ISBLANK([ProductSubcategoryKey]),\"\
    Misc\",\n    RELATED(Category[EnglishProductCategoryName]))\n\n[Subcategory]\n\
    =IF(ISBLANK([ProductSubcategoryKey]),\"Misc\",\nRELATED(Subcategory[EnglishProductSubcategoryName]))\n\
    ```\n\nHide the `Category` and `Subcategory` tables from any client tools. If\
    \ the `ProductSubcategoryKey` is blank, fill in the `Category` and `Subcategory`\
    \ columns with `\"Misc\"`. Finally, create a hierarchy with the `Product Category`\
    \ and `Product Subcategory` columns named **Prd Cat**.\n\n### Create Measures\n\
    \nAdd the following measures to the `ResellerSales` table:\n\n```\nMonth Sales:=TOTALMTD(SUM([Sales\
    \ Amount]),'Date'[Full Date])\n\nPrev Month Sales:=CALCULATE(Sum([Sales Amount]),PREVIOUSMONTH('Date'[Full\
    \ Date]))\n\nMonthly Sales Growth:=[Month Sales] - [Prev Month Sales]\n\nMonthly\
    \ Sales Growth %:=DIVIDE([Monthly Sales Growth],[Prev Month Sales],0)\n```\n\n\
    Test your measures by creating a pivot table as shown in [Figure 14-2](#9781430264453_Ch14.xhtml#Fig2).\n\
    \n![9781430264453_Fig14-02.jpg](Images/9781430264453_Fig14-02.jpg)\n\n[Figure\
    \ 14-2](#9781430264453_Ch14.xhtml#_Fig2). Viewing the measures in a pivot table\n\
    \nNow you need to create a measure to determine if a store was open for at least\
    \ a year for the month you are calculating the sales for. In the `Reseller` table,\
    \ add the following measures:\n\n```\nYears Open:=Year(FIRSTDATE('Date'[Full Date]))\
    \ - Min([Year Opened])\n\nWas Open Prev Year:=If([Years Open]>0,1,0)\n```\n\n\
    Create a pivot table to test your measures, as shown in [Figure 14-3](#9781430264453_Ch14.xhtml#Fig3).\
    \ Remember that the measures only make sense if you filter by year.\n\n![9781430264453_Fig14-03.jpg](Images/9781430264453_Fig14-03.jpg)\n\
    \n[Figure 14-3](#9781430264453_Ch14.xhtml#_Fig3). Testing the measures\n\nNow\
    \ you can combine these measures so that you are only including resellers who\
    \ have been in business for at least a year at the time of the sales. Create the\
    \ following measures:\n\n```\nMonth Sales Filtered:=Calculate([Month Sales],FILTER(Reseller,[Was\
    \ Open Prev Year]=1))\n```"
  raw: "Although data mining is one of the most underutilized areas of business intelligence,\
    \ with the help of Excel’s table analysis tools it does not have to be. Although\
    \ data mining uses a set of complex algorithms and the traditional tools often\
    \ require you to be an expert in such algorithms to be able to implement them,\
    \ when you use the table analysis tools, Excel hides much of the complexity from\
    \ you. This chapter showed you how to use these tools to perform advanced data\
    \ analysis such as forecasting, clustering, and associations. You are now able\
    \ to utilize these tools to gain more insight into your data. Remember to look\
    \ beyond the specific examples and learn to apply the patterns in a variety of\
    \ situations.\n\nAt the time of this writing, Microsoft is moving its data mining\
    \ efforts into Microsoft Azure ML (Machine Learning) and has not been investing\
    \ in any upgrades to Excel’s data mining tools. This is unfortunate because Azure\
    \ ML is a cloud-only—based system and is a little advanced for the typical business\
    \ analyst. On the bright side, several third-party vendors (such as XLMiner and\
    \ Predixion) are stepping up and offering their own data mining add-in tools for\
    \ Excel. These tools are very similar to the look and feel of the table analysis\
    \ tools covered in this chapter and I think you will find using these tools to\
    \ be an easy transition.\n\nIn [Chapter 14](../Text/9781430264453_Ch14.xhtml),\
    \ you will look at two realistic case studies to solidify the concepts of the\
    \ previous chapters. By working through these case studies, you will be able to\
    \ gauge which areas you have mastered and which you need to study further. In\
    \ addition, you will look at some common patterns associated with data analysis\
    \ and how to implement these using the tools covered in this book.\n\nCHAPTER\
    \ 14\n\n![image](Images/frontdot.jpg)\n\nCreating a Complete Solution\n\nIn the\
    \ previous chapters, you gained experience working with each of the pieces of\
    \ Microsoft’s self-service BI tool set. You used Power Pivot, Power View, Power\
    \ Query, Power Map, and the Excel table analysis tools. This chapter provides\
    \ you with several use cases to solidify the concepts of the previous chapters.\
    \ By working through these use cases, you will gauge which areas you have mastered\
    \ and which you need to spend more time studying. Since this is sort of like your\
    \ final exam, I have deliberately not included step-by-step instructions like\
    \ I did for the previous exercises. Instead, I have given you general directions\
    \ that should be sufficient to get you started. If you get stuck, refer back to\
    \ the previous chapters to remind yourself of how to accomplish the task.\n\n\
    This chapter contains the following use cases:\n\n*   Reseller Sales analysis\n\
    *   Sales Quota analysis\n*   Sensor analysis\n\nUse Case 1: Reseller Sales Analysis\n\
    \nIn this scenario, you work for a bike equipment company and have been asked\
    \ to analyze the sales data. You need to build a dashboard to compare same-store\
    \ sales growth from one month to the next. An added constraint is that you only\
    \ want to compare resellers who have been open for at least a year when you make\
    \ the comparison.\n\nLoad the Data\n\nCreate a new Excel workbook named `StoreSalesAnalysis.xlsx`.\
    \ In the `Chapter14Labs` folder, find the `UseCase1` folder, which contains a\
    \ `StoreSales.accdb` Access database. This database houses the sales data you\
    \ need to analyze. Using this as a data source, import the data tables and columns\
    \ listed in [Table 14-1](#9781430264453_Ch14.xhtml#Tab1).\n\n[Table 14-1](#9781430264453_Ch14.xhtml#_Tab1).\
    \ Store Sales Tables and Columns to Import\n\n| Source Table | Friendly Name |\
    \ Columns |\n| --- | --- | --- |\n| dbo_DimDate | Date | DateKey, FullDateAlternateKey,\
    \ EnglishMonthName, MonthNumberOfYear, CalendarQuarter, CalendarYear |\n| dbo_DimGeography\
    \ | Location | GeographyKey,City, StateProvinceCode, StateProvinceName, CountryRegionCode,\
    \ EnglishCountryRegionName, PostalCode |\n| dbo_DimProduct | Product | ProductKey,\
    \ ProductSubcategoryKey, EnglishProductName, StandardCost, ListPrice, DealerPrice,\
    \ LargePhoto |\n| dbo_DimProductCategory | Category | ProductCategoryKey, EnglishProductCategoryName\
    \ |\n| dbo_DimProductSubcategory | Subcategory | ProductSubcategoryKey, EnglishProductSubcategoryName,\
    \ ProductCategoryKey |\n| dbo_DimReseller | Reseller | ResellerKey, GeographyKey,\
    \ BusinessType, ResellerName, YearOpened |\n| dbo_FactResellerSales | ResellerSales\
    \ | ProductKey, ResellerKey, OrderDateKey, SalesOrderNumber, SalesOrderLineNumber,\
    \ OrderQuantity, UnitPrice, ExtendedAmount, TotalProductCost, SalesAmount |\n\n\
    Create the Model\n\nAfter importing the tables, create the table relationships\
    \ using the appropriate keys. Your model should now look similar to [Figure 14-1](#9781430264453_Ch14.xhtml#Fig1).\n\
    \n![9781430264453_Fig14-01.jpg](Images/9781430264453_Fig14-01.jpg)\n\n[Figure\
    \ 14-1](#9781430264453_Ch14.xhtml#_Fig1). Store sales model\n\nRename the table\
    \ columns and show or hide the columns from client tools according to the information\
    \ listed in [Table 14-2](#9781430264453_Ch14.xhtml#Tab2).\n\n[Table 14-2](#9781430264453_Ch14.xhtml#_Tab2).\
    \ Table and Column Properties\n\n![Table14-2](Images/Table14-2.jpg)\n\nIn the\
    \ Date table, create a calendar hierarchy of Year - Quarter - Month. Mark the\
    \ table as the Date table with the Full Date column as the key. Sort the Month\
    \ column by the Month Number column. Format the Full Date column to only show\
    \ the date and not the time.\n\nCreate Calculated Columns\n\nUsing the DAX `RELATED`\
    \ function, create a calculated column in the Product table for Product Subcategory\
    \ and Product Category.\n\n```\n[Category]\n=IF(ISBLANK([ProductSubcategoryKey]),\"\
    Misc\",\n    RELATED(Category[EnglishProductCategoryName]))\n\n[Subcategory]\n\
    =IF(ISBLANK([ProductSubcategoryKey]),\"Misc\",\n```\n\nRELATED(Subcategory[EnglishProductSubcategoryName]))Hide\
    \ the Category and Subcategory tables from any client tools. If the ProductSubcategoryKey\
    \ is blank, fill in the Category and Subcategory columns with `\"Misc\"`. Finally,\
    \ create a hierarchy with the Product Category and Product Subcategory columns\
    \ named **Prd Cat**.\n\nCreate Measures\n\nAdd the following measures to the ResellerSales\
    \ table:\n\n```\nMonth Sales:=TOTALMTD(SUM([Sales Amount]),'Date'[Full Date])\n\
    \nPrev Month Sales:=CALCULATE(Sum([Sales Amount]),PREVIOUSMONTH('Date'[Full Date]))\n\
    \nMonthly Sales Growth:=[Month Sales] - [Prev Month Sales]\n\nMonthly Sales Growth\
    \ %:=DIVIDE([Monthly Sales Growth],[Prev Month Sales],0)\n```\n\nTest your measures\
    \ by creating a pivot table as shown in [Figure 14-2](#9781430264453_Ch14.xhtml#Fig2).\n\
    \n![9781430264453_Fig14-02.jpg](Images/9781430264453_Fig14-02.jpg)\n\n[Figure\
    \ 14-2](#9781430264453_Ch14.xhtml#_Fig2). Viewing the measures in a pivot table\n\
    \nNow you need to create a measure to determine if a store was open for at least\
    \ a year for the month you are calculating the sales for. In the Reseller table,\
    \ add the following measures:\n\n```\nYears Open:=Year(FIRSTDATE('Date'[Full Date]))\
    \ - Min([Year Opened])\n\nWas Open Prev Year:=If([Years Open]>0,1,0)\n```\n\n\
    Create a pivot table to test your measures, as shown in [Figure 14-3](#9781430264453_Ch14.xhtml#Fig3).\
    \ Remember that the measures only make sense if you filter by year.\n\n![9781430264453_Fig14-03.jpg](Images/9781430264453_Fig14-03.jpg)\n\
    \n[Figure 14-3](#9781430264453_Ch14.xhtml#_Fig3). Testing the measures\n\nNow\
    \ you can combine these measures so that you are only including resellers who\
    \ have been in business for at least a year at the time of the sales. Create the\
    \ following measures:\n\n```\nMonth Sales Filtered:=Calculate([Month Sales],FILTER(Reseller,[Was\
    \ Open Prev Year]=1))"
  trans: "\n尽管数据挖掘是商业智能中应用最不充分的领域之一，但在 Excel 的表格分析工具的帮助下，情况并非必须如此。虽然数据挖掘使用了一套复杂的算法，而且传统工具通常要求你成为此类算法的专家才能实施它们，但当你使用表格分析工具时，Excel\
    \ 为你隐藏了大部分复杂性。本章向你展示了如何使用这些工具来执行诸如预测、聚类和关联等高级数据分析。现在你能够利用这些工具来更深入地洞察你的数据。请记住要超越具体的示例，并学会在各种情境中应用这些模式。\n\
    \n在撰写本书时，微软正将其数据挖掘工作重心转移到 Microsoft Azure ML（机器学习）上，并且没有对 Excel 的数据挖掘工具进行任何升级。这有些遗憾，因为\
    \ Azure ML 是一个纯云端系统，对于典型的业务分析师来说略显高级。好的一面是，一些第三方供应商（例如 XLMiner 和 Predixion）正在加强投入，提供他们自己适用于\
    \ Excel 的数据挖掘插件工具。这些工具在观感上与本章介绍的表格分析工具非常相似，我相信你会发现使用这些工具能轻松过渡。\n\n在第 14 章中，你将学习两个实际案例研究，以巩固前面章节的概念。通过完成这些案例研究，你将能够评估自己掌握了哪些领域，以及哪些领域需要进一步学习。此外，你还将了解一些与数据分析相关的常见模式，以及如何使用本书介绍的工具来实现这些模式。\n\
    \n## 第 14 章\n\n![图片](img/frontdot.jpg)\n\n# 构建完整解决方案\n\n在前面的章节中，你已经获得了使用微软自助式\
    \ BI 工具集的各个组件的经验。你使用了 Power Pivot、Power View、Power Query、Power Map 以及 Excel 表格分析工具。本章为你提供了几个用例，以巩固前面章节的概念。通过完成这些用例，你将评估自己掌握了哪些领域，以及哪些领域需要花更多时间学习。由于这有点像你的期末考试，我有意没有提供像之前练习那样的一步步详细说明。相反，我给出了大致的方向，这些方向应该足以让你开始。如果你遇到困难，请回顾前面的章节，提醒自己如何完成任务。\n\
    \n本章包含以下用例：\n\n*   分销商销售分析\n*   销售配额分析\n*   传感器分析\n\n## 用例 1：分销商销售分析\n\n在此场景中，你为一家自行车设备公司工作，并被要求分析销售数据。你需要构建一个仪表板，用于比较每个月的同店销售增长。此外还有一个限制条件：在进行比较时，你只想比较那些开业至少一年的分销商。\n\
    \n### 加载数据\n\n创建一个名为 `StoreSalesAnalysis.xlsx` 的新 Excel 工作簿。在 `Chapter14Labs`\
    \ 文件夹中，找到 `UseCase1` 文件夹，其中包含一个 `StoreSales.accdb` Access 数据库。该数据库存储了你需要分析的销售数据。以此作为数据源，导入表\
    \ 14-1 中列出的数据表和列。\n\n表 14-1 需要导入的商店销售表和列\n\n| 源表 | 友好名称 | 列 |\n| --- | --- | ---\
    \ |\n| `dbo_DimDate` | 日期 | `DateKey`, `FullDateAlternateKey`, `EnglishMonthName`,\
    \ `MonthNumberOfYear`, `CalendarQuarter`, `CalendarYear` |\n| `dbo_DimGeography`\
    \ | 位置 | `GeographyKey`, `City`, `StateProvinceCode`, `StateProvinceName`, `CountryRegionCode`,\
    \ `EnglishCountryRegionName`, `PostalCode` |\n| `dbo_DimProduct` | 产品 | `ProductKey`,\
    \ `ProductSubcategoryKey`, `EnglishProductName`, `StandardCost`, `ListPrice`,\
    \ `DealerPrice`, `LargePhoto` |\n| `dbo_DimProductCategory` | 类别 | `ProductCategoryKey`,\
    \ `EnglishProductCategoryName` |\n| `dbo_DimProductSubcategory` | 子类别 | `ProductSubcategoryKey`,\
    \ `EnglishProductSubcategoryName`, `ProductCategoryKey` |\n| `dbo_DimReseller`\
    \ | 分销商 | `ResellerKey`, `GeographyKey`, `BusinessType`, `ResellerName`, `YearOpened`\
    \ |\n| `dbo_FactResellerSales` | 分销商销售 | `ProductKey`, `ResellerKey`, `OrderDateKey`,\
    \ `SalesOrderNumber`, `SalesOrderLineNumber`, `OrderQuantity`, `UnitPrice`, `ExtendedAmount`,\
    \ `TotalProductCost`, `SalesAmount` |\n\n### 创建模型\n\n导入表格后，使用适当的键创建表关系。你的模型现在应该类似于图\
    \ 14-1。\n\n![9781430264453_Fig14-01.jpg](img/9781430264453_Fig14-01.jpg)\n\n图\
    \ 14-1 商店销售模型\n\n根据表 14-2 中列出的信息，重命名表列，并从客户端工具中显示或隐藏列。\n\n表 14-2 表和列属性\n\n![Table14-2](img/Table14-2.jpg)\n\
    \n在 `Date` 表中，创建一个年 - 季度 - 月的日历层次结构。将该表标记为 `Date` 表，并使用 `Full Date` 列作为键。按 `Month\
    \ Number` 列对 `Month` 列进行排序。格式化 `Full Date` 列，使其仅显示日期而不显示时间。\n\n### 创建计算列\n\n使用\
    \ DAX `RELATED` 函数，在 `Product` 表中为 `Product Subcategory` 和 `Product Category`\
    \ 创建计算列。\n\n```\n[Category]\n=IF(ISBLANK([ProductSubcategoryKey]),\"Misc\",\n\
    \    RELATED(Category[EnglishProductCategoryName]))\n\n[Subcategory]\n=IF(ISBLANK([ProductSubcategoryKey]),\"\
    Misc\",\nRELATED(Subcategory[EnglishProductSubcategoryName]))\n```\n\n从任何客户端工具中隐藏\
    \ `Category` 和 `Subcategory` 表。如果 `ProductSubcategoryKey` 为空，则在 `Category` 和 `Subcategory`\
    \ 列中填入 `\"Misc\"`。最后，使用 `Product Category` 和 `Product Subcategory` 列创建一个名为 **Prd\
    \ Cat** 的层次结构。\n\n### 创建度量值\n\n将以下度量值添加到 `ResellerSales` 表中：\n\n```\nMonth Sales:=TOTALMTD(SUM([Sales\
    \ Amount]),'Date'[Full Date])\n\nPrev Month Sales:=CALCULATE(Sum([Sales Amount]),PREVIOUSMONTH('Date'[Full\
    \ Date]))\n\nMonthly Sales Growth:=[Month Sales] - [Prev Month Sales]\n\nMonthly\
    \ Sales Growth %:=DIVIDE([Monthly Sales Growth],[Prev Month Sales],0)\n```\n\n\
    通过创建一个如图 14-2 所示的数据透视表来测试你的度量值。\n\n![9781430264453_Fig14-02.jpg](img/9781430264453_Fig14-02.jpg)\n\
    \n图 14-2 在数据透视表中查看度量值\n\n现在，你需要创建一个度量值，用于判断在计算销售额的月份，商店是否已开业至少一年。在 `Reseller`\
    \ 表中，添加以下度量值：\n\n```\nYears Open:=Year(FIRSTDATE('Date'[Full Date])) - Min([Year\
    \ Opened])\n\nWas Open Prev Year:=If([Years Open]>0,1,0)\n```\n\n创建一个数据透视表来测试你的度量值，如图\
    \ 14-3 所示。请记住，这些度量值只有在按年份筛选时才有意义。\n\n![9781430264453_Fig14-03.jpg](img/9781430264453_Fig14-03.jpg)\n\
    \n图 14-3 测试度量值\n\n现在，你可以组合这些度量值，使得在计算时只包含那些在销售发生时已开业至少一年的分销商。创建以下度量值：\n\n```\n\
    Month Sales Filtered:=Calculate([Month Sales],FILTER(Reseller,[Was Open Prev Year]=1))\n\
    ```\n"
- fmt: "```dax\nPrev Month Sales Filtered:=CALCULATE([Prev Month Sales],\n    Filter(Reseller,[Was\
    \ Open Prev Year]=1))\n\nMonthly Sales Growth Filtered:=[Month Sales Filtered]-[Prev\
    \ Month Sales Filtered]\n\nMonthly Sales Growth Filtered %:=DIVIDE([Monthly Sales\
    \ Growth Filtered],\n    [Prev Month Sales Filtered],0)\n```\n\n通过创建如[图14-4](#9781430264453_Ch14.xhtml#Fig4)所示的Power\
    \ Pivot表来测试你的新度量值。应该能看到经过筛选和未经筛选的度量值之间的差异。\n\n![9781430264453_Fig14-04.jpg](Images/9781430264453_Fig14-04.jpg)\n\
    \n[图14-4](#9781430264453_Ch14.xhtml#_Fig4) 测试筛选后的度量值\n\n## 创建仪表板\n\n在Power View中创建仪表板之前，需要更新一些表设置以优化Power\
    \ View模型。[表14-3](#9781430264453_Ch14.xhtml#Tab3)列出了需要进行的表和设置。\n\n[表14-3](#9781430264453_Ch14.xhtml#_Tab3)\
    \ 为Power View优化的设置\n\n![Table14-3](Images/Table14-3.jpg)\n\n此外，将[表14-4](#9781430264453_Ch14.xhtml#Tab4)中列出的列标记为相应的数据类别。\n\
    \n[表14-4](#9781430264453_Ch14.xhtml#_Tab4) 设置数据类别\n\n| 表 | 列 | 数据类别 |\n| --- |\
    \ --- | --- |\n| Location | City | City |\n| | State Province | State or Province\
    \ |\n| | Country | Country |\n| | Postal Code | Postal Code |\n| Product | Product\
    \ Photo | Image |\n\n在`Date`表中设置字段，使其不执行汇总。\n\n要创建仪表板，请插入一个Power View报表。将报表命名为**Reseller\
    \ Sales**，并添加一个柱形图，使用筛选后的月度销售额按月份和经销商类型显示销售额。向报表添加一个切片器，用于控制图表显示的日历年份。由于2011年之前没有销售额，将视图筛选为仅显示2011年至2014年。报表应类似于[图14-5](#9781430264453_Ch14.xhtml#Fig5)。\n\
    \n![9781430264453_Fig14-05.jpg](Images/9781430264453_Fig14-05.jpg)\n\n[图14-5](#9781430264453_Ch14.xhtml#_Fig5)\
    \ 经销商销售额报表\n\n现在需要进行另一项经销商分析，以找出月份、季度和年度的最佳月度销售额。为此，需要向模型添加一个新度量值。该度量值使用`VALUES`和`MAXX`函数来查找最高的经销商月度销售额。\n\
    \n```dax\nMax Reseller Sales:=MAXX(VALUES(Reseller[ResellerKey]),[Month Sales])\n\
    ```\n\n将新度量值添加到模型后，在Power View报表中添加另一个柱形图，显示每个月的最高经销商销售额。注意图表是交互式的：如果在一个图表中单击某个柱形，它将相应地筛选另一个图表（请参见[图14-6](#9781430264453_Ch14.xhtml#Fig6)）。\n\
    \n![9781430264453_Fig14-06.jpg](Images/9781430264453_Fig14-06.jpg)\n\n[图14-6](#9781430264453_Ch14.xhtml#_Fig6)\
    \ 添加最大经销商销售额图表\n\n更进一步，假设需要获取该期间内具有最高月度销售额的经销商名称。为此，需要组合一系列表达式来检索月度销售额最高的经销商名称。首先，需要确定哪些经销商的月度销售额等于最高月度销售额。如果满足条件，则将其标记为`1`；否则标记为`BLANK`。\n\
    \n```dax\nIF([Month Sales]=CALCULATE([Max Reseller Sales],\n    Values(Reseller[Reseller\
    \ Name])),1,BLANK())\n```\n\n下一步是使用`FIRSTNONBLANK`函数查找值为`1`的经销商。\n\n```dax\nFIRSTNONBLANK(Reseller[Reseller\
    \ Name],\n    IF([Month Sales]=CALCULATE([Max Reseller Sales],\n    Values(Reseller[Reseller\
    \ Name])),1,BLANK()))\n```\n\n最后，需要确保所检查的期间内确实存在月度销售额。将上述公式组合成`Top Monthly Reseller`度量值，如下所示：\n\
    \n```dax\nTop Monthly Reseller:=If(ISBLANK([Month Sales]),\n    BLANK(),FIRSTNONBLANK(Reseller[Reseller\
    \ Name],IF([Month Sales]=\n    CALCULATE([Max Reseller Sales],Values(Reseller[Reseller\
    \ Name])),1,BLANK())))\n```"
  raw: "Prev Month Sales Filtered:=CALCULATE([Prev Month Sales],\n    Filter(Reseller,[Was\
    \ Open Prev Year]=1))\n\nMonthly Sales Growth Filtered:=[Month Sales Filtered]-[Prev\
    \ Month Sales Filtered]\n\nMonthly Sales Growth Filtered %:=DIVIDE([Monthly Sales\
    \ Growth Filtered],\n    [Prev Month Sales Filtered],0)\n```\n\nTest your new\
    \ measures by creating a Power Pivot table as shown in [Figure 14-4](#9781430264453_Ch14.xhtml#Fig4).\
    \ You should see a difference between the filtered and the nonfiltered measures.\n\
    \n![9781430264453_Fig14-04.jpg](Images/9781430264453_Fig14-04.jpg)\n\n[Figure\
    \ 14-4](#9781430264453_Ch14.xhtml#_Fig4). Testing the filtered measures\n\nCreate\
    \ the Dashboard\n\nBefore creating a dashboard in Power View, you need to update\
    \ some table settings to optimize the model for Power View. [Table 14-3](#9781430264453_Ch14.xhtml#Tab3)\
    \ lists the tables and settings you need to make.\n\n[Table 14-3](#9781430264453_Ch14.xhtml#_Tab3).\
    \ Settings to Optimize for Power View\n\n![Table14-3](Images/Table14-3.jpg)\n\n\
    In addition, mark the columns listed in [Table 14-4](#9781430264453_Ch14.xhtml#Tab4)\
    \ as the appropriate data category.\n\n[Table 14-4](#9781430264453_Ch14.xhtml#_Tab4).\
    \ Setting the Data Category\n\n| Table | Column | Data Category |\n| --- | ---\
    \ | --- |\n| Location | City | City |\n| State Province | State or Province |\n\
    | Country | Country |\n| Postal Code | Postal Code |\n| Product | Product Photo\
    \ | Image |\n\nIn the Date table, set the fields so they do not summarize.\n\n\
    To create the dashboard, insert a Power View report. Name the report **Reseller\
    \ Sales** and add a column chart that shows sales by month and reseller type using\
    \ the filtered monthly sales. Add a slicer to the report that controls the calendar\
    \ year displayed by the chart. Since there are no sales before 2011, filter the\
    \ view to only show years 2011 to 2014\\. Your report should look similar to [Figure](#9781430264453_Ch14.xhtml#Fig5)\
    \ 14-5.\n\n![9781430264453_Fig14-05.jpg](Images/9781430264453_Fig14-05.jpg)\n\n\
    [Figure 14-5](#9781430264453_Ch14.xhtml#_Fig5). The reseller sales report\n\n\
    You now want to make another reseller analysis to find the best monthly sales\
    \ for the month, quarter, and year. In order to do this, you need to add a new\
    \ measure to the model. This measure uses the `VALUES` and the `MAXX` functions\
    \ to find the maximum reseller monthly sales.\n\n```\nMax Reseller Sales:=MAXX(VALUES(Reseller[ResellerKey]),[Month\
    \ Sales])\n```\n\nOnce you have the new measure in the model, add another column\
    \ chart to the Power View report that shows the maximum reseller sales for each\
    \ month. Notice the charts are interactive; if you click on a column in one chart,\
    \ it will filter the other chart accordingly (see [Figure 14-6](#9781430264453_Ch14.xhtml#Fig6)).\n\
    \n![9781430264453_Fig14-06.jpg](Images/9781430264453_Fig14-06.jpg)\n\n[Figure\
    \ 14-6](#9781430264453_Ch14.xhtml#_Fig6). Adding the Max Reseller Sales chart\n\
    \nTo take this one step further, let’s say you want the name of the reseller who\
    \ has the maximum monthly sales for the period. To accomplish this, you need to\
    \ combine a series of expressions to retrieve the name of the reseller with the\
    \ maximum monthly sales. First, you need to determine which reseller has monthly\
    \ sales equal to the maximum monthly sales. If they do, they are flagged with\
    \ a value of `1`; otherwise they get a value of `BLANK`.\n\n```\nIF([Month Sales]=CALCULATE([Max\
    \ Reseller Sales],\n    Values(Reseller[Reseller Name])),1,BLANK())\n```\n\nThe\
    \ next step is to use the `FIRSTNONBLANK` function to find the reseller that has\
    \ a value of `1`.\n\n```\nFIRSTNONBLANK(Reseller[Reseller Name],\n    IF([Month\
    \ Sales]=CALCULATE([Max Reseller Sales],\n    Values(Reseller[Reseller Name])),1,BLANK()))\n\
    ```\n\nFinally you need to make sure there were actually monthly sales during\
    \ the period you are examining. Combining these formulas into the Top Monthly\
    \ Reseller measure as follows:\n\n```\nTop Monthly Reseller:=If(ISBLANK([Month\
    \ Sales]),\n    BLANK(),FIRSTNONBLANK(Reseller[Reseller Name],IF([Month Sales]=\n\
    \    CALCULATE([Max Reseller Sales],Values(Reseller[Reseller Name])),1,BLANK())))\n\
    ```"
  trans: "\n```dax\nPrev Month Sales Filtered:=CALCULATE([Prev Month Sales],\n   \
    \ Filter(Reseller,[Was Open Prev Year]=1))\n\nMonthly Sales Growth Filtered:=[Month\
    \ Sales Filtered]-[Prev Month Sales Filtered]\n\nMonthly Sales Growth Filtered\
    \ %:=DIVIDE([Monthly Sales Growth Filtered],\n    [Prev Month Sales Filtered],0)\n\
    ```\n\n通过创建如图 14-4 所示的 Power Pivot 表来测试你的新度量值。应该能看到经过筛选和未经筛选的度量值之间的差异。\n\n![9781430264453_Fig14-04.jpg](img/9781430264453_Fig14-04.jpg)\n\
    \n图 14-4 测试筛选后的度量值\n\n## 创建仪表板\n\n在 Power View 中创建仪表板之前，需要更新一些表设置以优化 Power View\
    \ 模型。表 14-3 列出了需要进行的表和设置。\n\n表 14-3 为 Power View 优化的设置\n\n![Table14-3](img/Table14-3.jpg)\n\
    \n此外，将表 14-4 中列出的列标记为相应的数据类别。\n\n表 14-4 设置数据类别\n\n| 表 | 列 | 数据类别 |\n| --- | ---\
    \ | --- |\n| Location | City | City |\n| | State Province | State or Province\
    \ |\n| | Country | Country |\n| | Postal Code | Postal Code |\n| Product | Product\
    \ Photo | Image |\n\n在`Date`表中设置字段，使其不执行汇总。\n\n要创建仪表板，请插入一个 Power View 报表。将报表命名为**Reseller\
    \ Sales**，并添加一个柱形图，使用筛选后的月度销售额按月份和经销商类型显示销售额。向报表添加一个切片器，用于控制图表显示的日历年份。由于 2011\
    \ 年之前没有销售额，将视图筛选为仅显示 2011 年至 2014 年。报表应类似于图 14-5。\n\n![9781430264453_Fig14-05.jpg](img/9781430264453_Fig14-05.jpg)\n\
    \n图 14-5 经销商销售额报表\n\n现在需要进行另一项经销商分析，以找出月份、季度和年度的最佳月度销售额。为此，需要向模型添加一个新度量值。该度量值使用`VALUES`和`MAXX`函数来查找最高的经销商月度销售额。\n\
    \n```dax\nMax Reseller Sales:=MAXX(VALUES(Reseller[ResellerKey]),[Month Sales])\n\
    ```\n\n将新度量值添加到模型后，在 Power View 报表中添加另一个柱形图，显示每个月的最高经销商销售额。注意图表是交互式的：如果在一个图表中单击某个柱形，它将相应地筛选另一个图表（请参见图\
    \ 14-6）。\n\n![9781430264453_Fig14-06.jpg](img/9781430264453_Fig14-06.jpg)\n\n\
    图 14-6 添加最大经销商销售额图表\n\n更进一步，假设需要获取该期间内具有最高月度销售额的经销商名称。为此，需要组合一系列表达式来检索月度销售额最高的经销商名称。首先，需要确定哪些经销商的月度销售额等于最高月度销售额。如果满足条件，则将其标记为`1`；否则标记为`BLANK`。\n\
    \n```dax\nIF([Month Sales]=CALCULATE([Max Reseller Sales],\n    Values(Reseller[Reseller\
    \ Name])),1,BLANK())\n```\n\n下一步是使用`FIRSTNONBLANK`函数查找值为`1`的经销商。\n\n```dax\nFIRSTNONBLANK(Reseller[Reseller\
    \ Name],\n    IF([Month Sales]=CALCULATE([Max Reseller Sales],\n    Values(Reseller[Reseller\
    \ Name])),1,BLANK()))\n```\n\n最后，需要确保所检查的期间内确实存在月度销售额。将上述公式组合成`Top Monthly Reseller`度量值，如下所示：\n\
    \n```dax\nTop Monthly Reseller:=If(ISBLANK([Month Sales]),\n    BLANK(),FIRSTNONBLANK(Reseller[Reseller\
    \ Name],IF([Month Sales]=\n    CALCULATE([Max Reseller Sales],Values(Reseller[Reseller\
    \ Name])),1,BLANK())))\n```\n"
