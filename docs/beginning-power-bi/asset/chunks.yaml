    # 第 2 章


    ![image](img/frontdot.jpg)


    # 将数据导入 Power Pivot


    创建 Power Pivot 模型的首要步骤之一就是导入数据。传统上，在创建基于 OLAP 多维数据集的 BI 解决方案时，你需要先将数据导入数据仓库，再将其加载到多维数据集中。将数据整合到多维数据集并可供使用可能需要相当长的时间。而这是
    Power Pivot 模型的最大优势之一。你可以轻松快速地将来自各种来源的数据合并到模型中。数据源可以来自关系数据库、文本文件、Web 服务和 OLAP
    多维数据集，仅举几例。本章将向你展示如何将来自这些来源的数据整合到 Power Pivot 模型中。


    完成本章学习后，你将能够：


    -   从关系数据库导入数据。

    -   从文本文件导入数据。

    -   从数据馈送导入数据。

    -   从 OLAP 多维数据集导入数据。

    -   重用现有连接来更新模型。


    ## 从关系数据库导入数据


    你最常遇到的数据源类型之一是关系数据库。关系数据库管理系统（如 SQL Server、Oracle、DB2 和 Access）由表以及基于键的表之间的关系组成。例如，图
    2-1 显示了一个采购订单明细表和一个产品表。它们通过 `ProductID` 列相关联。这是一种一对多关系的示例。在产品表中的每一行，采购订单明细表中都有多行与之对应。表中的键被称为主键和外键。每个表都需要一个主键，用于唯一标识表中的一行。例如，`ProductID`
    是产品表中的主键。在采购订单明细表中，`ProductID` 被视为外键。外键指向相关表中的主键。请注意，主键可以由多个列组合而成；例如，采购订单明细表的主键是
    `PurchaseOrderID` 和 `PurchaseOrderDetailID` 的组合。


    ![9781430264453_Fig02-01.jpg](img/9781430264453_Fig02-01.jpg)


    图 2-1. 一对多关系


    尽管一对多关系最为常见，但你还会遇到另一种相当普遍的关系类型——多对多关系。图 2-2 显示了一个多对多关系的示例。一个人可能有多个不同类型的电话号码。例如，他们可能有两个传真号码。你不能直接关联这些表。相反，你需要使用一个包含这些表主键的联结表。联结表中键的组合必须是唯一的。


    ![9781430264453_Fig02-02.jpg](img/9781430264453_Fig02-02.jpg)


    图 2-2. 多对多关系


    请注意，联结表可以包含与关联相关的信息；例如，`PhoneNumber` 与客户和电话号码类型相关联。一个客户不能将同一个电话号码列为两种不同的类型。


    从关系数据库获取数据的一个好处是，其模型与你在 Power Pivot 中创建的模型非常相似。事实上，如果在数据库中定义了关系，Power Pivot 导入向导可以检测到这些关系，并在模型中为你设置它们。


    从关系数据库获取数据的第一步是创建连接。在模型设计器的**主页**选项卡上，有一个**获取外部数据**组（参见图 2-3）。


    ![9781430264453_Fig02-03.jpg](img/9781430264453_Fig02-03.jpg)


    图 2-3. 设置连接


    **从数据库**下拉列表允许你连接到 SQL Server、Access、Analysis Services 或另一个 Power Pivot 模型。如果你单击**从其他源**按钮，可以查看所有可连接的各种数据源（参见图
    2-4）。如你所见，你可以连接到相当多的关系数据库。如果所需连接的数据源未列出，你可以从数据库提供商处安装驱动程序来连接它。很有可能，你也可以使用通用的 ODBC（开放数据库连接）驱动程序来连接它。


    ![9781430264453_Fig02-04.jpg](img/9781430264453_Fig02-04.jpg)


    图 2-4. 选择数据源


    选择数据源后，系统会弹出一个窗口，供你输入连接信息。连接信息取决于你要连接的数据源。对于大多数关系数据库，所需的信息非常相似。图 2-5 显示了连接到 SQL
    Server 的连接信息。记得单击**测试连接**按钮，以确保所有信息输入正确。


    ![9781430264453_Fig02-05.jpg](img/9781430264453_Fig02-05.jpg)


    图 2-5. 设置数据库连接


    设置好连接后，下一步是查询数据库以检索数据。此时你有两个选择：可以从表和视图列表中选择导入数据，也可以编写查询来导入数据（参见图 2-6）。即使你选择从表或视图导入数据，系统也会在后台创建查询并将其发送到数据库以检索数据。


    ![9781430264453_Fig02-06.jpg](img/9781430264453_Fig02-06.jpg)


    图 2-6. 选择检索数据的方式


    如果你选择从表和视图列表中获取数据，则下一个屏幕会显示该列表。从你的角度来看，视图和表看起来是一样的。实际上，视图是数据库中存储的查询，它向你屏蔽了查询的复杂性。视图通常用于展示比实际物理模型更简单的数据库概念模型。例如，你可能需要客户的地址。图
    2-7 显示了获取该信息所需包含在查询中的表。无需编写复杂的查询来检索信息，你可以从一个将信息组合成虚拟的 `Customer Address` 表的视图中进行选择。视图的另一个常见用途是保护基础表中的列。通过使用视图，数据库管理员可以向不同用户隐藏某些列。


    ![9781430264453_Fig02-07.jpg](img/9781430264453_Fig02-07.jpg)


    图 2-7. 获取客户地址所需的表'
- fmt: 'By selecting a table and clicking the **Preview & Filter** button (see [Figure
    2-8](#9781430264453_Ch02.xhtml#Fig8)), you can preview the data in the table and
    filter the data selected.


    ![9781430264453_Fig02-08.jpg](Images/9781430264453_Fig02-08.jpg)


    [Figure 2-8](#9781430264453_Ch02.xhtml#_Fig8). Selecting tables and views


    In [Figure 2-9](#9781430264453_Ch02.xhtml#Fig9) you can see the preview and filter
    screen.


    ![9781430264453_Fig02-09.jpg](Images/9781430264453_Fig02-09.jpg)


    [Figure 2-9](#9781430264453_Ch02.xhtml#_Fig9). Previewing and filtering the data


    One way you can filter a table is by selecting only the columns you are interested
    in. The other way is to limit the number of rows by placing a filter condition
    on the column. For example, you may only want sales after a certain year. Clicking
    on the drop-down next to a column allows you to enter a filter to limit the rows.
    [Figure 2-10](#9781430264453_Ch02.xhtml#Fig10) shows the `SalesOrderHeader` table
    being filtered by order date.


    ![9781430264453_Fig02-10.jpg](Images/9781430264453_Fig02-10.jpg)


    [Figure 2-10](#9781430264453_Ch02.xhtml#_Fig10). Filtering rows


    When working with large data sets it is a good idea, for performance reasons,
    to only import the data you are interested in. There is a lot of overhead in bringing
    in all the columns of a table if you are only interested in a few. Likewise, if
    you are only interested in the last three years of sales, don’t bring in the entire
    20 years of sales data. You can always go back and update the data import to bring
    in more data if you find a need for it.


    After filtering the data you click **Finish** on the **Select Tables And Views**
    screen (see [Figure 2-8](#9781430264453_Ch02.xhtml#Fig8)). At this point the data
    is brought into the model and you see a screen reporting the progress (see [Figure
    2-11](#9781430264453_Ch02.xhtml#Fig11)). If there are no errors you can close
    the **Table Import Wizard**.


    ![9781430264453_Fig02-11.jpg](Images/9781430264453_Fig02-11.jpg)


    [Figure 2-11](#9781430264453_Ch02.xhtml#_Fig11). Importing the data into the model


    When the wizard closes, you will see the data in the data view of the **Model
    Designer**.


    ![Image](Images/sq.jpg) **Note**  Remember that Power Pivot is only connected
    to the data source when it is retrieving the data. Once the data is retrieved
    the connection is closed and the data is part of the model.


    If you switch to the diagram view of the **Model Designer** you will see the tables,
    and if the table relationships were defined in the database you will see the relationships
    between the tables. In [Figure 2-12](#9781430264453_Ch02.xhtml#Fig12) you can
    see relationships defined between the product tables and one defined between the
    sales tables, but none defined between the `SalesOrderDetail` table and the `Product`
    table. You can create a relationship in the model even though one was not defined
    in the data source (more about this later).


    ![9781430264453_Fig02-12.jpg](Images/9781430264453_Fig02-12.jpg)


    [Figure 2-12](#9781430264453_Ch02.xhtml#_Fig12). Table relationships defined in
    the data source


    Although selecting from tables and views is an easy way to get data into the model
    without needing to explicitly write a query, it is not always possible. At times
    you may need to write your own queries; for example, you may want to combine data
    from several different tables and no view is available. Another factor is what
    is supported by the data source. Some data sources do not allow views and may
    require you to supply queries to extract the data. In these cases, when you get
    to the screen that asks how you want to retrieve the data, select the query option
    ([Figure 2-6](#9781430264453_Ch02.xhtml#Fig6)).


    Once you select the query option you are presented with a screen where you can
    write in a query (see [Figure 2-13](#9781430264453_Ch02.xhtml#Fig13)). Although
    you may not write the query from scratch, this is where you would paste in a query
    written for you or one that you created in another tool such as Microsoft Management
    Studio or TOAD. Don’t forget to name the query. It will become a table in the
    model with the name of the query.


    ![9781430264453_Fig02-13.jpg](Images/9781430264453_Fig02-13.jpg)


    [Figure 2-13](#9781430264453_Ch02.xhtml#_Fig13). Creating your own query


    If the data source supports it, you can launch a pretty nice query designer by
    clicking in the lower right corner of the query entry window (see [Figure 2-13](#9781430264453_Ch02.xhtml#Fig13)).
    This designer (see [Figure 2-14](#9781430264453_Ch02.xhtml#Fig14)) allows you
    to select the columns you want from the various tables and views. If the table
    relationships are defined in the database it will add the table joins for you.
    You can also apply filters and group and aggregate the data. One confusing aspect
    of the query designer is the parameter check box.


    ![9781430264453_Fig02-14.jpg](Images/9781430264453_Fig02-14.jpg)


    [Figure 2-14](#9781430264453_Ch02.xhtml#_Fig14). Using the query designer


    ![Image](Images/sq.jpg) **Note**  Parameters are not supported in the Power Pivot
    model and checking the box will give you an error message when you try to close
    the query designer.


    After you are done designing the query, you should always run it to make sure
    it works the way you intended (see [Figure 2-15](#9781430264453_Ch02.xhtml#Fig15)).


    ![9781430264453_Fig02-15.jpg](Images/9781430264453_Fig02-15.jpg)


    [Figure 2-15](#9781430264453_Ch02.xhtml#_Fig15). Running the query and viewing
    the results


    Once you are satisfied with the query, selecting the **OK** button returns you
    to the previous screen with the query text entered. You can modify the query in
    this screen and use the **Validate** button to ensure it is still a valid query
    (see [Figure 2-16](#9781430264453_Ch02.xhtml#Fig16)). Clicking **Finish** will
    bring the data and table into the model.


    ![9781430264453_Fig02-16.jpg](Images/9781430264453_Fig02-16.jpg)


    [Figure 2-16](#9781430264453_Ch02.xhtml#_Fig16). Viewing and validating the query


    Now that you know how to import data from a database, let’s see how you can add
    data to the model from a text file.


    ## Importing Data from Text Files


    There are many times when you need to combine data from several different sources.
    One of the most common sources of data is still the text file. This could be the
    result of receiving data as an output from another system; for example, you may
    need information from your company’s ERP (enterprise resource planning) system,
    which is provided as a text file. You may also get data through third-party services
    that provide the data in a CSV (comma-separated value) format. For example, you
    may use a rating service to rate customers and the results can be returned in
    a CSV file.


    Importing data into your model from a text file is similar to importing data from
    a relational database table. First you select the option to get external data
    from other sources on the **Home** menu, which brings up the option to connect
    to a data source. Scroll down to the bottom of the window and you can choose to
    import data from either an Excel file or a text file (see [Figure 2-17](#9781430264453_Ch02.xhtml#Fig17)).


    ![9781430264453_Fig02-17.jpg](Images/9781430264453_Fig02-17.jpg)


    [Figure 2-17](#9781430264453_Ch02.xhtml#_Fig17). Connecting to a text file


    Selecting the text file brings up a screen where you enter the path to the file
    and the file delimiter. Each text file is considered a table and the friendly
    connection name will be the name of the table in the model. Once you supply the
    connection information, the data is loaded for previewing and filtering (see [Figure
    2-18](#9781430264453_Ch02.xhtml#Fig18)).


    ![9781430264453_Fig02-18.jpg](Images/9781430264453_Fig02-18.jpg)'
