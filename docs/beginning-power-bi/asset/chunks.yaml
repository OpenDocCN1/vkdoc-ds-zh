    \ to create the Month column). Sort the Month column by the Month Number column.\n\
    8.  Switch to the diagram view of the model. Using the Year and Month, create\
    \ a Calendar hierarchy in the `Date` table.\n9.  Create a relationship between\
    \ the `Sales` table and `Date` table (see [Figure 6-16](#9781430264453_Ch06.xhtml#Fig16)).\n\
    \n![9781430264453_Fig06-16.jpg](Images/9781430264453_Fig06-16.jpg)\n\n[Figure\
    \ 6-16](#9781430264453_Ch06.xhtml#_Fig16). Creating the relationship between the\
    \ Sales and Date table\n\n10.  Select the `Sales` table in the Data View window.\
    \ Add the following measures and format them as currency:\n\n    ```\n    Sum\
    \ of Sales:=SUM(Sales[SalesAmount])\n    YTD Sales:=TOTALYTD([Sum of Sales],'Date'[Datekey])\n\
    \    MTD Sales:=TOTALMTD([Sum of Sales],'Date'[Datekey])\n    ```\n\n11.  To test\
    \ the measures, go to Sheet1 in Excel and click on cell B2. On the Insert tab,\
    \ select PivotTable. In the Create PivotTable window, select Use An External Data\
    \ Source and click the Choose Connection button (see [Figure 6-17](#9781430264453_Ch06.xhtml#Fig17)).\n\
    \n![9781430264453_Fig06-17.jpg](Images/9781430264453_Fig06-17.jpg)\n\n[Figure\
    \ 6-17](#9781430264453_Ch06.xhtml#_Fig17). Choosing an external data source\n\n\
    12.  In the Existing Connections window select the Tables tab. In the Tables tab\
    \ select Tables In Workbook Data Model and click Open (see [Figure 6-18](#9781430264453_Ch06.xhtml#Fig18)).\
    \ After selecting the connection, click OK in the Create PivotTable window.\n\n\
    ![9781430264453_Fig06-18.jpg](Images/9781430264453_Fig06-18.jpg)\n\n[Figure 6-18](#9781430264453_Ch06.xhtml#_Fig18).\
    \ Selecting the data model connection\n\n13.  Add the measures `Sum Of Sales`,\
    \ `MTD Sales`, and `YTD Sales` to the Values area and the Calendar hierarchy to\
    \ the Rows area. In the Insert tab select Slicer and choose the `ChannelName`.\
    \ Investigate the data and verify that is what you expected (see [Figure 6-19](#9781430264453_Ch06.xhtml#Fig19)).\n\
    \n![9781430264453_Fig06-19.jpg](Images/9781430264453_Fig06-19.jpg)\n\n[Figure\
    \ 6-19](#9781430264453_Ch06.xhtml#_Fig19). Verifying the year-to-date sales measure\n\
    \n14.  Switch to the `Sales` table in the Data Model. Create a rolling 3 month\
    \ sales measure with the following expression. Format the measure as currency.\n\
    \n```\nRolling 3 Month Sales:=CALCULATE([Sum of Sales],\nDATESINPERIOD('Date'[Datekey],LASTDATE('Date'[Datekey]),-3,MONTH))\n\
    ```\n\n15.  Add the measure to the pivot table on Sheet1 and verify it is working\
    \ as expected.\n16.  Next you want to compare sales growth from one month to the\
    \ next. First create a previous month’s sales measure.\n\n```\nPrev Month Sales:=CALCULATE([Sum\
    \ of Sales],\nPARALLELPERIOD('Date'[DateKey],-1,MONTH))\n```"
