  trans: '好的，作为一名高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。



    在下一节中，您将了解到为什么知道何时以及如何更改查询上下文是创建度量值的一个重要方面。


    ## 更改查询上下文


    在创建计算时，您通常需要更改应用于度量值的筛选上下文，例如，如果您想计算某个产品类别的销售额与所有产品的销售额之比（请参见图 5-10）。


    ![9781430264453_Fig05-10.jpg](img/9781430264453_Fig05-10.jpg)


    图 5-10. 查看产品销售比率


    要计算销售比率，您需要将由查询上下文（在本例中为类别）筛选得出的销售额，除以所有产品的销售额（不考虑产品查询上下文）。要计算销售额，您只需使用 `SUM`
    函数。要计算所有产品销售额的总和，您需要重写应用于该单元格的任何产品筛选。为此，您需要使用 `CALCULATE` 函数，该函数在由指定筛选器修改的上下文中计算表达式，其语法如下：


    ```

    CALCULATE(<expression>,<filter1>,<filter2>...)

    ```


    其中，`expression` 本质上是要计算的度量值，`filters` 是定义筛选器的布尔表达式或表表达式。


    因此，要重写任何产品筛选器，您可以使用以下代码：


    ```

    AllProductSales:=CALCULATE(SUM([SalesAmount]), ALL(Product))

    ```


    这里使用了 `ALL` 函数，该函数返回表中的所有行或列中的所有值，忽略可能已应用的任何筛选器。因此，在本例中，它清除了应用于 `Product` 表的所有筛选器。图
    5-11 显示了数据透视表中的这些度量值。


    ![9781430264453_Fig05-11.jpg](img/9781430264453_Fig05-11.jpg)


    图 5-11. 验证 `AllProductSales` 度量值


    请注意，`ProductSales` 度量值受产品筛选器（类别）的影响，而 `AllProductSales` 则不受影响。计算 `ProductSalesRatio`
    度量值的最后一步是将 `ProductSales` 除以 `AllProductSales`。只要没有循环引用，您就可以在一个度量值内部使用另一个度量值。因此，`ProductSalesRatio`
    的计算公式如下：


    ```

    ProductSalesRatio:=[ProductSales]/[AllProductSales]

    ```


    您可以从客户端工具中隐藏 `AllProductSales` 度量值，因为在本例中，它被用作中间度量值，本身并无用处。


    在本节中，您了解了如何使用 `CALCULATE` 函数和筛选函数来更改应用于度量值的筛选器。DAX 中有许多可用的筛选函数，了解何时使用它们非常重要。在下一节中，您将了解几个更重要的可用的筛选函数。


    ## 使用筛选函数


    DAX 中的筛选函数允许您创建复杂的计算，这些计算需要您查询和操作数据透视表中行或单元格的数据上下文。表 5-1 列出并描述了 DAX 中可用的一些筛选函数。


    表 5-1. 一些 DAX 筛选函数


    | 函数 | 说明 |

    | --- | --- |

    | `ALL` | 返回表中的所有行，或列中的所有值，忽略可能已应用的任何筛选器。 |

    | `ALLEXCEPT` | 移除表中的所有上下文筛选器，但已应用于指定列的筛选器除外。 |

    | `ALLNONBLANKROW` | 返回所有行（空白行除外），并忽略可能存在的任何上下文筛选器。 |

    | `ALLSELECTED` | 移除列和行中的上下文筛选器，同时保留所有其他上下文筛选器或显式筛选器。 |

    | `CALCULATE` | 在由指定筛选器修改的上下文中计算一个表达式。 |

    | `CALCULATETABLE` | 在由给定筛选器修改的上下文中计算一个表表达式。 |

    | `DISTINCT` | 返回一个包含指定列中非重复值的单列表。 |

    | `FILTER` | 返回表示另一个表或表达式的子集的表。 |

    | `FILTERS` | 返回直接作为筛选器应用的值。 |

    | `HASONEVALUE` | 当上下文已被筛选为仅剩一个非重复值时返回 TRUE。 |

    | `ISFILTERED` | 当正在应用直接筛选器时返回 TRUE。 |

    | `ISCROSSFILTERED` | 当正在对列或同一表或相关表中的另一列进行筛选时返回 TRUE。 |

    | `KEEPFILTERS` | 修改在计算 `CALCULATE` 或 `CALCULATETABLE` 函数时应用筛选器的方式。保留已应用的筛选器并添加额外的筛选器。
    |

    | `RELATED` | 从另一个表中返回一个相关值。 |

    | `USERELATIONSHIP` | 指定要在特定计算中使用的关系统计。 |

    | `VALUES` | 返回一个包含指定列中非重复值的单列表。 |


    您已经了解了如何结合使用 `CALCULATE` 函数和 `ALL` 函数来计算总产品销售额，忽略任何已应用的产品筛选。让我们再看几个示例。


    图 5-12 显示了一个用于经销商销售的 Power Pivot 模型。在该模型中，`Employee` 表和 `SalesTerritory` 表之间存在一个非活动关系。您可以使用此关系来计算每个国家的销售人员数量。


    ![9781430264453_Fig05-12.jpg](img/9781430264453_Fig05-12.jpg)


    图 5-12. Power Pivot 模型中的非活动关系


    您可以使用以下代码来计算每个国家的销售代表数量：


    ```

    Sales Rep Cnt:=CALCULATE(DISTINCTCOUNT(Employee[EmployeeNationalIDAlternateKey]),

    USERELATIONSHIP(Employee[SalesTerritoryKey],SalesTerritory[SalesTerritoryKey]))

    ```


    在这种情况下，您需要使用 `CALCULATE` 函数，以便应用 `USERELATIONSHIP` 筛选函数来告知 DAX 查询引擎使用哪个关系统计。图
    5-13 显示了生成的数据透视表。它还显示了如果您只使用 `DISTINCTCOUNT` 函数而不使用 `USERELATIONSHIP` 筛选器时会得到的结果。


    ![9781430264453_Fig05-13.jpg](img/9781430264453_Fig05-13.jpg)


    图 5-13. 每个国家的销售代表计数


    在下一个示例中，您将看到 `ALL` 和 `ALLSELECTED` 筛选函数之间的区别。您可以按如下方式创建三个销售额度量值：


    ```

    Reseller Sales:=SUM([SalesAmount])

    Reseller Grand Total:=calculate(sum([SalesAmount]), ALL(''ResellerSales''))

    Reseller Visual Total:=calculate(sum([SalesAmount]), ALLSELECTED())

    ```


    `Reseller Sales` 保留应用于度量值的所有数据上下文。`Reseller Grand Total` 移除与 `ResellerSales` 表及其任何相关表关联的所有上下文。`Reseller
    Visual Total` 移除度量值的列和行上下文。图 5-14 显示了数据透视表中的结果度量值。


    ![9781430264453_Fig05-14.jpg](img/9781430264453_Fig05-14.jpg)


    图 5-14. 使用不同筛选器的结果

