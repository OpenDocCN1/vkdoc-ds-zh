    ```\n\nAlthough the majority of measures you need to aggregate from a lower level\
    \ to a higher level (for example, from days to months) are simple extensions of\
    \ the base aggregate, at times you need to use special aggregations to roll up\
    \ the measure. This type of measure is considered semi-additive and is covered\
    \ in the next section.\n\nCreating Semi-additive Measures\n\nYou often encounter\
    \ semi-additive measures when analyzing data. Some common examples are inventory\
    \ and account balances. For example, to determine the total amount of inventory\
    \ at a current point in time, you add the inventory of all stores. However, to\
    \ find the total inventory of a store at the end of the month, you do not add\
    \ up the inventory for each day.\n\nIn order to deal with these situations DAX\
    \ contains the `FIRSTNONBLANK` and `LASTNONBLANK` functions. These functions return\
    \ the first or last date for a non-blank condition. For example, the following\
    \ expression determines the last non-blank date for the product inventory entries.\n\
    \n```\nLASTNONBLANK ('Date'[DateKey],CALCULATE (SUM(Inventory[UnitsInStock]))\n\
    ```\n\nThis is then combined with the `CALCULATE` function to determine the total\
    \ units in stock.\n\n```\nProduct Units In Stock:=CALCULATE(SUM(Inventory[UnitsInStock]),\n\
    \  LASTNONBLANK('Date'[DateKey],\n   CALCULATE(SUM(Inventory[UnitsInStock]))))\n\
    ```\n\nNow if you want to add up the units in stock across products, you can use\
    \ the following expression.\n\n```\nTotal Units In Stock:=SUMX(VALUES('Inventory'[ProductKey]),[Product\
    \ Units In Stock])\n```\n\n[Figure 6-12](#9781430264453_Ch06.xhtml#Fig12) shows\
    \ the resulting pivot table. Notice the Total Units In Stock measure is additive\
    \ across the products but non-additive across the dates.\n\n![9781430264453_Fig06-12.jpg](Images/9781430264453_Fig06-12.jpg)\n\
    \n[Figure 6-12](#9781430264453_Ch06.xhtml#_Fig12). Calculating units in stock\n\
    \nOne of the advantages of DAX is that once you learn a pattern you can extend\
    \ this to other scenarios. For example, you can employ the same techniques used\
    \ in this inventory calculation when calculating measures in a cash flow analysis.\
    \ The following calculation is used to calculate the ending balance.\n\n```\n\
    Balance:=CALCULATE ( SUM ( Finance[Amount]),\n  LASTNONBLANK ('Date'[DateKey],\n\
    \   CALCULATE(SUM ( Finance[Amount]))))\n```\n\nIn the previous examples the inventory\
    \ and balance were only entered as a row in the table when a change in inventory\
    \ or balance occurred. Often the balance or inventory is entered every day and\
    \ the same value is repeated until there is a change. In these cases, you can\
    \ use the DAX functions `CLOSINGBALANCEMONTH`, `CLOSINGBALANCEQUARTER`, and `CLOSINGBALANCYEAR`.\
    \ These functions look at the last date of the time period and use that as the\
    \ value for the time period. In other words, whatever the value is on the last\
    \ day of the month is returned by the `CLOSINGBALANCEMONTH` function.\n\nAt this\
    \ point you should have a good grasp of how the various time functions work. In\
    \ the following lab you will gain experience implementing some of these functions.\n\
    \nHANDS-ON LAB—IMPLEMENTING TIME INTELLIGENCE IN POWER PIVOT\n\nIn the following\
    \ lab you will\n\n*   Create a date table.\n*   Use time intelligence functions\
    \ to analyze data.\n*   Create a Month over Month Growth pivot table.\n*   Create\
