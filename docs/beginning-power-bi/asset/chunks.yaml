    \ shows a customer table and a geography table.\n\n![9781430264453_Fig03-12.jpg](Images/9781430264453_Fig03-12.jpg)\n\
    \n[Figure 3-12](#9781430264453_Ch03.xhtml#_Fig12). Combining customer and customer\
    \ location data\n\nYou can combine these into one customer dimension table using\
    \ the following query.\n\n```\nSELECT  c.CustomerKey, c.BirthDate, c.MaritalStatus,\
    \ c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome, c.EnglishOccupation,\n\
    \        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n        g.City,\
    \ g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\nFROM    Customer\
    \ AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
    ```\n\nAlthough you do not have to be a query expert to get data into your Power\
    \ Pivot model, it is very beneficial to know the basics of querying the data sources,\
    \ even if it just helps to ask the right questions when you talk to the database\
    \ developers.\n\nCreating Linked Tables\n\nOne thing to remember about the data\
    \ contained in the Power Pivot model is that it is read only. For the most part\
    \ this is a good thing. You want to make sure that the data only gets changed\
    \ in the source system. At times, however, as part of the data analysis, you will\
    \ want to make adjustments on the fly and see how it affects the results. One\
    \ example that happens fairly often is *bucket analysis*. For example, say you\
    \ want to look a continuous measure such as age in discrete buckets (ranges) and\
    \ you need to adjust the ranges during analysis. This is where linked tables shine.\n\
    \nTo create the linked table you first set up the table on an Excel sheet. After\
    \ entering the data, you highlight it and click on the quick analysis menu (see\
    \ [Figure 3-13](#9781430264453_Ch03.xhtml#Fig13)). Under the Tables tab click\
    \ on the Table button.\n\n![9781430264453_Fig03-13.jpg](Images/9781430264453_Fig03-13.jpg)\n\
    \n[Figure 3-13](#9781430264453_Ch03.xhtml#_Fig13). Creating an Excel table\n\n\
    Once the table is created, it is a good idea to name it before importing it into\
    \ the Power Pivot data model. You can do this by selecting the table and then\
    \ entering the table name under the Tables tab in the Table Tools Design popup\
    \ window (see [Figure 3-14](#9781430264453_Ch03.xhtml#Fig14)).\n\n![9781430264453_Fig03-14.jpg](Images/9781430264453_Fig03-14.jpg)\n\
    \n[Figure 3-14](#9781430264453_Ch03.xhtml#_Fig14). Renaming an Excel table\n\n\
    Once you have the table named, select it, and on the Power Pivot tab, select Add\
    \ To Data Model (see [Figure 3-15](#9781430264453_Ch03.xhtml#Fig15)).\n\n![9781430264453_Fig03-15.jpg](Images/9781430264453_Fig03-15.jpg)\n\
    \n[Figure 3-15](#9781430264453_Ch03.xhtml#_Fig15). Adding the table to the model\n\
    \nAfter the table is imported into the model, if you change some of the table\
    \ values in the Excel sheet and select Update All on the PowerPivot tab (see [Figure\
    \ 3-15](#9781430264453_Ch03.xhtml#Fig15)), the linked table in the model will\
    \ update with the new values.\n\nCreating Hierarchies"
  trans: "\n图 3-8 `Product` 表和 `Sales` 表\n\n当你尝试在这些表之间创建关系时，会出现如图 3-9 所示的错误。\n\n![9781430264453_Fig03-09.jpg](img/9781430264453_Fig03-09.jpg)\n\
    \n图 3-9 出现重复值错误\n\n在本例中，`ProductNumber` 在 `Product` 表中应该是唯一的，但结果显示存在重复值。为了解决这个问题，你需要修改\
    \ `Product` 表数据的查询，以确保不会出现重复值。\n\n现在你已经了解了如何在模型中创建表关系，接下来可以看看使用星型模式的好处。\n\n##\
    \ 创建星型模式\n\n在创建数据模型时，理解模型的用途至关重要。数据库的两大主要用途是捕获数据和报告/分析数据。问题在于，当你为高效数据捕获创建模型时，会降低其分析数据的效率。为了解决这个问题，许多公司将数据捕获数据库与报告/分析数据库分开。幸运的是，在\
    \ Power Pivot 中创建数据模型时，我们只需要针对报告进行优化。\n\n在分析大量数据集时，最佳模型之一是*星型模式*。星型模式由一个中心事实表和围绕它的维度表组成，如图\
    \ 3-10 所示。\n\n![9781430264453_Fig03-10.jpg](img/9781430264453_Fig03-10.jpg)\n\n\
    图 3-10 典型的星型模式\n\n事实表包含与业务或流程相关的定量数据。例如，图 3-10 中的 `Sales` 表包含销售的可测量方面，例如总成本、销售金额和数量。事实表通常包含许多行，并有一个日期或时间组件，用于记录事件发生的时间点。维度表包含关于事件的属性。例如，`Date`\
    \ 表可以告诉你销售发生的时间，并允许你将数据汇总到月、季度或年级别。`Product` 表包含有关所售产品的属性，你可以按产品线、颜色和品牌查看销售情况。`Store`\
    \ 表包含有关参与销售的商店的属性。维度表通常不包含像事实表那样多的行，但可以包含相当多的列。当你问“哪些自行车在不同年龄段销售最好？”之类的问题时，度量值（销售额）来自事实表，而分类（年龄和自行车型号）则来自维度表。\n\
    \n星型模式的主要优点是提供快速的查询性能和聚合处理。缺点是它通常需要大量的预处理，才能将数据从高度规范化的交易系统移到非规范化的报告系统。好消息是，你的企业可能有一个报告系统为传统联机分析处理\
    \ (OLAP) 数据库（例如 Microsoft 的 Analysis Server 或 IBM 的 Cognos）提供数据。如果你能访问这些系统，它们可能是你核心业务数据的最佳来源。\n\
    \n为了从源数据系统创建星型模式，你可能需要执行一些数据非规范化操作，这将在下一节中介绍。\n\n## 了解何时对数据进行非规范化\n\n虽然事务型数据库系统高度规范化，但报告系统则非规范化为星型模式。如果你无法访问已为你完成非规范化的报告系统，则必须将数据非规范化为星型模式，以便加载你的\
    \ Power Pivot 模型。例如，图 3-11 显示了 `Adventureworks` 事务型销售数据库中包含客户数据的表。\n\n![9781430264453_Fig03-11.jpg](img/9781430264453_Fig03-11.jpg)\n\
    \n图 3-11 高度规范化的模式\n\n为了将客户数据非规范化到模型中，你需要创建一个将数据合并到单个客户维度表中的查询。如果你不熟悉创建复杂查询，最简单的方法是让数据库开发人员创建一个视图，你可以从中提取数据，该视图为你合并了这些表。如果查询不太复杂，你可能可以在导入数据时自己创建。例如，图\
    \ 3-12 显示了一个客户表和一个地理位置表。\n\n![9781430264453_Fig03-12.jpg](img/9781430264453_Fig03-12.jpg)\n\
    \n图 3-12 合并客户和客户位置数据\n\n你可以使用以下查询将它们合并到一个客户维度表中。\n\n```\nSELECT  c.CustomerKey,\
    \ c.BirthDate, c.MaritalStatus, c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome,\
    \ c.EnglishOccupation,\n        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n\
    \        g.City, g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\n\
    FROM    Customer AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
    ```\n\n虽然你不必成为查询专家才能将数据导入 Power Pivot 模型，但了解查询数据源的基础知识非常有益，即使这仅仅有助于在与数据库开发人员交流时提出正确的问题。\n\
    \n## 创建链接表\n\n关于 Power Pivot 模型中包含的数据，需要记住一点：它是只读的。在大多数情况下，这是一件好事。你想确保数据仅在源系统中被更改。然而，有时作为数据分析的一部分，你可能希望即时进行调整，并查看它对结果的影响。一个经常发生的例子是*桶分析*。例如，假设你想查看一个连续度量值（如年龄）并将其分为离散的桶（范围），并且在分析过程中需要调整范围。这正是链接表的用武之地。\n\
    \n要创建链接表，首先需要在 Excel 工作表上设置该表。输入数据后，将其高亮显示，并单击快速分析菜单（参见 图 3-13）。在 `Tables` 选项卡下，单击\
    \ `Table` 按钮。\n\n![9781430264453_Fig03-13.jpg](img/9781430264453_Fig03-13.jpg)\n\
    \n图 3-13 创建 Excel 表\n\n创建表后，最好在将其导入 Power Pivot 数据模型之前为其命名。你可以通过选择该表，然后在 `Table\
    \ Tools Design` 弹出窗口的 `Tables` 选项卡下输入表名称来实现（参见 图 3-14）。\n\n![9781430264453_Fig03-14.jpg](img/9781430264453_Fig03-14.jpg)\n\
    \n图 3-14 重命名 Excel 表\n\n表命名后，选中它，然后在 `Power Pivot` 选项卡上，选择 `Add To Data Model`（参见\
    \ 图 3-15）。\n\n![9781430264453_Fig03-15.jpg](img/9781430264453_Fig03-15.jpg)\n\n\
    图 3-15 将表添加到模型\n\n表导入模型后，如果你更改 Excel 工作表中的某些表值，并在 `PowerPivot` 选项卡上选择 `Update\
    \ All`（参见 图 3-15），模型中的链接表将更新为新的值。\n\n## 创建层次结构\n"
- fmt: '当分析数据时，使用层次结构来定义不同级别的聚合通常很有帮助。例如，基于年、季度和月份的日历层次结构很常见。像销售金额这样的聚合值会从月份汇总到季度，再到年份。另一个常见的层次结构可能是从部门到大楼，再到区域。然后，你可以将成本向上汇总到不同级别。在
    Power Pivot 模型中创建层次结构非常简单。在模型设计器的关系图视图中，选择包含你想要放入层次结构的属性（列）的表。你将在表格右上角看到一个“创建层次结构”按钮（参见[图
    3-16](#9781430264453_Ch03.xhtml#Fig16)）。点击该按钮添加层次结构并重命名。然后，你可以将字段拖放到层次结构中，以创建不同的级别。确保字段的排列顺序是从高层级到低层级。


    ![9781430264453_Fig03-16.jpg](Images/9781430264453_Fig03-16.jpg)


    [图 3-16](#9781430264453_Ch03.xhtml#_Fig16)。创建层次结构


    创建层次结构是增加模型可用性，并帮助用户在数据分析中本能地获取更多价值的一种方法。在下一节中，你将看到一些其他可以应用于模型以增加其可用性的操作。


    **打造用户友好的模型**


    在创建模型时，需要记住的一点是让模型易于使用且直观。模型可能会被其他用户用于分析。该模型还可能用于各种客户端报表和分析工具，例如 Power View、Power
    Map 和 Reporting Services。你可以使用一些属性和设置，让这些客户端工具从模型中获得更多功能。


    最有效的调整之一是为表和列重命名。使用对业务用户有意义的名称，而不是只对数据库开发人员有意义的晦涩命名约定。另一个好的做法是确保列的数据类型和格式设置正确。来自文本文件的字段可能会被导入为字符串类型，而它实际上是数字数据。此外，你可以隐藏对用户无用的字段，例如用于链接表的代理键。


    一个常见的要求是更改列的排序顺序，使其不同于自然排序。最常见的例子是月份。由于它们默认是文本，因此会按字母顺序排序。实际上，你希望它们按月份编号排序。要解决此问题，你可以按表中的任何其他列对一个列进行排序（参见[图
    3-17](#9781430264453_Ch03.xhtml#Fig17)）。这是一个很好的功能，允许你创建自定义的业务相关排序。


    ![9781430264453_Fig03-17.jpg](Images/9781430264453_Fig03-17.jpg)


    [图 3-17](#9781430264453_Ch03.xhtml#_Fig17)。按另一列对一列进行排序


    你可以使用其他一些设置来为各种客户端工具创建良好的模型。我们将在[第10章](../Text/9781430264453_Ch10.xhtml)（“优化 Power
    View 的表格模型”）中更详细地回顾这个主题。


    以下动手实验将帮助你巩固本章涵盖的主题。


    **动手实验——在 Power Pivot 中创建数据模型**


    在以下实验中，你将：


    *   创建表关系。

    *   反规范化数据。

    *   创建链接表。

    *   设置层次结构。

    *   制作一个用户友好的模型。


    1.  打开 Excel 2013 并创建一个名为 `LabChapter3.xlsx` 的新文件。

    2.  使用 Power Pivot 数据模型中的表导入向导，连接到 `LabStarters` 文件夹中的 `Adventureworks.accdb`
    文件。

    3.  选择所列出的表和字段并导入数据。


    | 源表名 | 友好名称 | 字段 |

    | --- | --- | --- |

    | `DimDate` | `Date` | `DateKey` `FullDateAlternateKey` `EnglishMonthName` `MonthNumberOfYear`
    `CalendarQuarter` `CalendarYear` |

    | `DimCustomer` | `Customer` | `CustomerKey` `BirthDate` `MaritalStatus` `Gender`
    `YearlyIncome` `TotalChildren` `HouseOwnerFlag` `NumberCarsOwned` |

    | `FactInternetSales` | `Internet Sales` | `ProductKey` `OrderDateKey` `ShipDateKey`
    `CustomerKey` `SalesTerritoryKey` `SalesOrderNumber` `SalesOrderLineNumber` `OrderQuantity`
    `UnitPrice` `TotalProductCost` `SalesAmount` |


    4.  在 Power Pivot 模型设计器的数据视图模式下，按照表格指示重命名并隐藏列。要隐藏列，请右键单击它，然后从上下文菜单中选择“从客户端工具中隐藏”。


    ![Table3b](Images/Table3b.jpg)


    5.  将 Power Pivot 窗口切换到关系图视图。你应该能看到 `Date`、`Customer` 和 `Internet Sales` 表。`Customer`
    表和 `Internet Sales` 表之间已定义了一个关系。这由表导入向导自动发现。

    6.  将 `DateKey` 从 `Date` 表拖放到 `Internet Sales` 表中的 `OrderDateKey` 上。类似地，在 `DateKey`
    和 `ShipDateKey` 之间创建一个关系。双击此关系以启动“编辑关系”窗口（参见[图 3-18](#9781430264453_Ch03.xhtml#Fig18)）。尝试将此关系设为活动关系。你会收到一个错误，因为模型中两个表之间只能有一个活动关系。


    ![9781430264453_Fig03-18.jpg](Images/9781430264453_Fig03-18.jpg)


    [图 3-18](#9781430264453_Ch03.xhtml#_Fig18)。创建表关系


    7.  在 Power Pivot 模型设计器窗口的“主页”选项卡上，单击“现有连接”按钮。你应该能看到之前创建的指向 `Adventureworks.accdb`
    的连接。打开此连接并选择用于导入数据的查询选项。

    8.  在“指定 SQL 查询”窗口中，将查询友好名称更改为 `Product`，然后单击“设计”按钮。

    9.  在设计器中单击“导入”按钮。打开实验启动器文件夹中的 `ProductQuery.txt` 文件。单击红色的感叹号 (!) 以运行查询（参见[图 3-19](#9781430264453_Ch03.xhtml#Fig19)）。此查询合并了来自
    `Product`、`ProductCategory` 和 `ProductSubcategory` 表的数据（即反规范化）。


    ![9781430264453_Fig03-19.jpg](Images/9781430264453_Fig03-19.jpg)


    [图 3-19](#9781430264453_Ch03.xhtml#_Fig19)。运行查询


    10. 在确认获取到数据后，单击“确定”按钮，然后在下一个屏幕上单击“完成”按钮。

    11. 导入数据后，隐藏 `ProductKey` 并按下表所示更新列名：


    ![Table3c](Images/Table3c.jpg)


    12. 使用 `ProductKey` 在 `Internet Sales` 表和 `Product` 表之间创建一个关系。最终的关系图应类似于[图 3-20](#9781430264453_Ch03.xhtml#Fig20)。


    ![9781430264453_Fig03-20.jpg](Images/9781430264453_Fig03-20.jpg)


    [图 3-20](#9781430264453_Ch03.xhtml#_Fig20)。查看数据模型关系


    13. 要创建链接表，请将[图 3-21](#9781430264453_Ch03.xhtml#Fig21) 中显示的数据输入到 Excel 中的一个空白电子表格选项卡中。


    ![9781430264453_Fig03-21.jpg](Images/9781430264453_Fig03-21.jpg)


    [图 3-21](#9781430264453_Ch03.xhtml#_Fig21)。链接表数据


    14. 选中这些单元格，右键单击，在“快速分析”上下文菜单中，选择“表”选项卡，然后单击“表”按钮（参见[图 3-22](#9781430264453_Ch03.xhtml#Fig22)）。在“表工具设计”选项卡中，将表重命名为
    `SalesTerritory`。


    ![9781430264453_Fig03-22.jpg](Images/9781430264453_Fig03-22.jpg)


    [图 3-22](#9781430264453_Ch03.xhtml#_Fig22)。“快速分析”的“表”选项卡'
  raw: "When analyzing data it is often helpful to use hierarchies to define various\
    \ levels of aggregations. For example, it is common to have a calendar-based hierarchy\
    \ based on year, quarter, and month levels. An aggregate like sales amount is\
    \ then rolled up from month to quarter to year. Another common hierarchy might\
    \ be from department to building to region. You could then roll cost up through\
    \ the different levels. Creating hierarchies in a Power Pivot model is very easy.\
    \ In the diagram view of the Model Designer select the table that has the attributes\
    \ (columns) you want in the hierarchy. You will then see a Create Hierarchy button\
    \ in the upper right corner of the table (see [Figure 3-16](#9781430264453_Ch03.xhtml#Fig16)).\
    \ Click on the button to add the hierarchy and rename it. You can then drag and\
    \ drop the fields onto the hierarchy to create the different levels. Make sure\
    \ you arrange the fields so that they go from a higher level down to a lower level.\n\
    \n![9781430264453_Fig03-16.jpg](Images/9781430264453_Fig03-16.jpg)\n\n[Figure\
    \ 3-16](#9781430264453_Ch03.xhtml#_Fig16). Creating a hierarchy\n\nCreating hierarchies\
    \ is one way to increase the usability of your model and help users instinctively\
    \ gain more value in their data analysis. In the next section you will see some\
    \ other things you can do to the model to increase its usability.\n\nMaking a\
    \ User-Friendly Model\n\nAs you are creating your model one thing to keep in mind\
    \ is making the model easy and intuitive to use. Chances are that the model may\
    \ get used by others for analysis. The model may also be used for a wide variety\
    \ of client reporting and analysis tools such as Power View, Power Map, and Reporting\
    \ Services. There are properties and settings you can use that allow these client\
    \ tools to gain more functionality from the model.\n\nOne of the most effective\
    \ adjustments you can make is to rename the tables and columns. Use names that\
    \ make sense for business users and not the cryptic naming convention that only\
    \ makes sense to the database developers. Another good practice is to make sure\
    \ the data types and formats of the columns are set correctly. A field from a\
    \ text file may come in typed as a string when in reality it is numeric data.\
    \ In addition you can hide fields that are of no use to the user, such as the\
    \ surrogate keys used for linking the tables.\n\nA common requirement is to change\
    \ the sort order of a column from its natural sorting. The most common example\
    \ is the months of the year. Since they are text by default, they are sorted alphabetically.\
    \ In reality you want them sorted by month number. To fix this, you can sort one\
    \ column by any other column in the table (see [Figure 3-17](#9781430264453_Ch03.xhtml#Fig17)).\
    \ This is a nice feature and allows you to create your own business-related custom\
    \ sorting.\n\n![9781430264453_Fig03-17.jpg](Images/9781430264453_Fig03-17.jpg)\n\
    \n[Figure 3-17](#9781430264453_Ch03.xhtml#_Fig17). Sorting one column by another\
    \ column\n\nYou can use some other settings to create good models for the various\
    \ client tools. You will revisit this topic in more detail in [Chapter 10](../Text/9781430264453_Ch10.xhtml),\
    \ “Optimizing Tabular Models for Power View.”\n\nThe following hands-on lab will\
    \ help you solidify the topics covered in this chapter.\n\n**HANDS-ON LAB—CREATING\
    \ A DATA MODEL IN** **POWER PIVOT**\n\nIn the following lab you will\n\n*   Create\
    \ table relations.\n*   Denormalize data.\n*   Create a linked table.\n*   Set\
    \ up a hierarchy.\n*   Make a user-friendly model.\n\n1.  Open Excel 2013 and\
    \ create a new file called `LabChapter3.xlsx`.\n2.  Using the Table Import Wizard\
    \ in the Power Pivot data model, connect to the `Adventureworks.accdb` file in\
    \ the LabStarters folder.\n3.  Select the tables and fields listed and import\
    \ the data.\n\n| Source Table Name | Friendly Name | Fields |\n    | --- | ---\
    \ | --- |\n    | DimDate | Date | DateKeyFullDateAlternateKeyEnglishMonthNameMonthNumberOfYearCalendarQuarterCalendarYear\
    \ |\n    | DimCustomer | Customer | CustomerKeyBirthDateMaritalStatusGenderYearlyIncomeTotalChildrenHouseOwnerNumberOfCars\
    \ |\n    | FactInternetSales | Internet Sales | ProductKeyOrderDateKeyShipDateKeyCustomerKeySalesTerritoryKeySalesOrderNumberSalesOrderLineNumberOrderQuantityUnitPriceTotalProductCostSalesAmount\
    \ |\n\n4.  In the data view mode of the Power Pivot Model Designer, rename and\
    \ hide the columns indicated in the table. To hide a column, right click on it\
    \ and select Hide From Client Tools in the context menu.\n\n![Table3b](Images/Table3b.jpg)\n\
    \n5.  Switch the Power Pivot window to diagram view. You should see the Date,\
    \ Customer, and Internet Sales. The Customer table and the Internet Sales table\
    \ have a relationship defined between them. This was discovered by the Table Import\
    \ Wizard.\n6.  Drag the DateKey from the Date table and drop it on the OrderDateKey\
    \ in the Internet Sales table. Similarly, create a relationship between the DateKey\
    \ and the ShipDateKey. Double click on this relationship to launch the Edit Relationship\
    \ window (see [Figure 3-18](#9781430264453_Ch03.xhtml#Fig18)). Try to make this\
    \ an active relationship. You should get an error because you can only have one\
    \ active relationship between two tables in the model.\n\n![9781430264453_Fig03-18.jpg](Images/9781430264453_Fig03-18.jpg)\n\
    \n[Figure 3-18](#9781430264453_Ch03.xhtml#_Fig18). Creating the table relationship\n\
    \n7.  On the Home tab of the Power Pivot Model Designer window, click the Existing\
    \ Connections button. You should see the connection to the Adventureworks.acdb\
    \ created earlier. Open this connection and select the query option for importing\
    \ the data.\n8.  In the Specify A SQL Query window, change the query friendly\
    \ name to Product and click the Design button.\n9.  In the designer click the\
    \ Import button. Open the `ProductQuery.txt` file in the lab starter folder. Click\
    \ the red exclamation mark (!) to run the query (see [Figure 3-19](#9781430264453_Ch03.xhtml#Fig19)).\
    \ This query combines data (i.e., denormalizes) from the Product, ProductCategory,\
    \ and ProductSubcategory tables.\n\n![9781430264453_Fig03-19.jpg](Images/9781430264453_Fig03-19.jpg)\n\
    \n[Figure 3-19](#9781430264453_Ch03.xhtml#_Fig19). Running the query\n\n10.  After\
    \ verifying that you are getting data, click the OK button and the Finish button\
    \ on the next screen.\n11.  After importing the data, hide the ProductKey and\
    \ update the column names as follows:\n\n![Table3c](Images/Table3c.jpg)\n\n12.\
    \  Create a relationship between the Internet Sales and the Product tables using\
    \ the ProductKey. Your final diagram should look like [Figure 3-20](#9781430264453_Ch03.xhtml#Fig20).\n\
    \n![9781430264453_Fig03-20.jpg](Images/9781430264453_Fig03-20.jpg)\n\n[Figure\
    \ 3-20](#9781430264453_Ch03.xhtml#_Fig20). Viewing the data model relationships\n\
    \n13.  To create a linked table, enter the data shown in [Figure 3-21](#9781430264453_Ch03.xhtml#Fig21)\
    \ into an empty spread sheet tab in Excel.\n\n![9781430264453_Fig03-21.jpg](Images/9781430264453_Fig03-21.jpg)\n\
    \n[Figure 3-21](#9781430264453_Ch03.xhtml#_Fig21). The linked table data\n\n14.\
    \  Select the cells, right click, and in the Quick Analysis context menu, select\
    \ the Table tab and click the Table button (see [Figure 3-22](#9781430264453_Ch03.xhtml#Fig22)).\
    \ In the Table Tools Design tab, rename the table SalesTerritory.\n\n![9781430264453_Fig03-22.jpg](Images/9781430264453_Fig03-22.jpg)\n\
    \n[Figure 3-22](#9781430264453_Ch03.xhtml#_Fig22). The Quick Analysis Tables tab"
