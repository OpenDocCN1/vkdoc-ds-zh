    the `Load To Data Model`.

    4.  In the `Applied Steps` list, if the Query Editor did not automatically add
    the transform to set the first row as headers, add it now.

    5.  Check the types of each column to see if the Query Editor updated the `FlightDate`
    to a `Date` data type and the number type columns to a `Number` data type. If
    it did not, change them now.

    6.  Remove the `UniqueCarrier`, `FlightNum`, `AirTime`, `Flights`, and `Distance`
    columns.

    7.  Filter the data so that it only pulls rows that have a flight departure delay
    of greater than 15 minutes.

    8.  Select `Apply & Close` to save the query.

    9.  Complete steps 2-8 for the `FlightPerformance_2012_11.csv` file, except this
    time, name the query **FlightDelays2**.

    10.  You should now have two workbook queries, as shown in [Figure 11-22](#9781430264453_Ch11.xhtml#Fig22).


    ![9781430264453_Fig11-22.jpg](Images/9781430264453_Fig11-22.jpg)


    [Figure 11-22](#9781430264453_Ch11.xhtml#_Fig22). Current workbook queries


    11.  Double click on the `FlightDelays` query to open it back up in the Query
    Editor.

    12.  Select the `Append Queries` option in the `Combine` section of the `Home`
    tab. Append the `FlightDelays2` query to the `FlightDelays` query.

    13.  Select the `OriginCityName` column and split it into two columns named `OriginCity`
    and `OriginState` using the comma. Do the same for the `DestCityName` column.

    14.  Replace `West Palm Beach/Palm Beach` in the `City` columns with just `Palm
    Beach`.

    15.  Check the `Load To Data Model` load setting and click the `Apply & Close`
    button.

    16.  Open the Power Pivot model and verify that the table was loaded.

    17.  Select the `Power Query` tab in Excel. Under `Get External Data`, select
    `From File` and choose the `From CSV` option. Navigate to the `FlightPerformance_2012_12.csv`
    in the `LabStarters` folder.

    18.  In the `Query Settings` pane, rename the query to **DelaySummary** and uncheck
    `Load To Data Model`.

    19.  Keep the `Carrier`, `Origin`, and `DepDelay` columns and remove the rest.

    20.  Filter out delays that are less than 15 minutes.

    21.  Find the average delay and max delay grouping by the `Origin` and `Carrier`
    (see [Figure 11-23](#9781430264453_Ch11.xhtml#Fig23)).


