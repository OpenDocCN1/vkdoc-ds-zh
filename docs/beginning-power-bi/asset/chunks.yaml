    ![9781430264453_Fig14-10.jpg](img/9781430264453_Fig14-10.jpg)


    图 14-10. 使用磁贴和卡片显示销售代表信息


    在磁贴详细信息区域内添加一个矩阵，显示按时间段和销售代表划分的销售总 KPI。关闭矩阵的汇总总计。在磁贴区域之外，添加一个时间段年份切片器，以及一个展示各销售区域总销售额的表格。你还可以添加视图筛选器，以筛选掉无销售额的年份和
    NA 区域。最终的仪表板应类似于图 14-11。


    ![9781430264453_Fig14-11.jpg](img/9781430264453_Fig14-11.jpg)


    图 14-11. 最终的销售代表绩效仪表板


    完成仪表板并测试后，保存并关闭 Excel。


    ## 用例 3：传感器分析


    在此场景中，你供职于一家电力公司，该公司使用传感器监控设备。传感器监测各种电力读数，包括电力中断和电压尖峰。当传感器检测到问题时，会触发一个记录报警信号。你需要创建一个地图，使分析人员能够查看并比较不同时间段的电力中断和电压尖峰情况。


    ### 加载数据


    所需数据位于多个文本文件中。在将数据加载到 Power Pivot 模型之前，你需要对数据进行清理和处理。因此，你将使用 Power Query 来加载数据。


    在 `Chapter14Labs` 文件夹中找到名为 `UseCase3` 的文件夹。该文件夹包含四个文件，其中包含传感器数据以及完成分析所需的相关数据。创建一个名为
    `PowerAnalysis.xlsx` 的新 Excel 工作簿。使用 Power Query，连接到 `UseCase3` 文件夹中的 `Alarms.csv`
    文件。你应该包含以下列：`PREMISE_NUMBER`、`METER_NUMBER`、`OP_CENTER`、`Type` 和 `DateKey`。将查询重命名为
    **Alarms**，取消选中“加载设置”，然后保存查询。添加第二个查询 **AlarmTypes**，从 `AlarmType.txt` 文件中获取报警类型数据。现在，你可以删除
    `SHORT_CODE` 列并保存查询。


    重新打开 `Alarms` 查询，并使用相应的键将其与 `AlarmTypes` 查询合并（参见图 14-12）。


    ![9781430264453_Fig14-12.jpg](img/9781430264453_Fig14-12.jpg)


    图 14-12. 将 `AlarmType` 查询与 `Alarms` 查询合并

    ```'
- fmt: '可以移除`Alarm Type`键，并将`ALARM_DESCRIPTION`重命名为`Alarm Type`。


    重复前面的步骤，用`Date.csv`文件中的日期替换`DateKey`列。使用`Locations.txt`文件，根据`OP_CENTER`为`Alarms`查询添加经度和纬度值。你可以重命名列，使其使用相同的命名约定。你的报警查询应类似于[图14-13](#9781430264453_Ch14.xhtml#Fig13)。


    ![9781430264453_Fig14-13.jpg](Images/9781430264453_Fig14-13.jpg)


    [图14-13](#9781430264453_Ch14.xhtml#_Fig13)：添加了纬度和经度数据的报警查询。


    接下来，筛选数据，将报警类型限制为`power failure`和`high AC volts`。完成此操作后，你可能会注意到`Meter`列中存在一些错误值；请继续并删除这些错误。现在，你可以按日期、运营中心、报警类型、经度和纬度对报警计数进行聚合分组（参见[图14-14](#9781430264453_Ch14.xhtml#Fig14)）。


    ![9781430264453_Fig14-14.jpg](Images/9781430264453_Fig14-14.jpg)


    [图14-14](#9781430264453_Ch14.xhtml#_Fig14)：聚合和分组报警数据。


    聚合数据后，在“加载设置”下勾选“将数据添加到数据模型”，然后应用并关闭查询。


    准备好用于地图绘制的数据后，启动Power Map设计器，创建一个显示随时间变化的平均计数的柱形图，如[图14-15](#9781430264453_Ch14.xhtml#Fig15)所示。


    ![9781430264453_Fig14-15.jpg](Images/9781430264453_Fig14-15.jpg)


    [图14-15](#9781430264453_Ch14.xhtml#_Fig15)：显示随时间变化的报警计数的Power Map。


    在Power Map中创建并探索报警数据后，保存并关闭Excel。


    ## 总结


    本章提供了一些用例，帮助你评估对本书其他主题的掌握程度。本书的目标是向你介绍微软自助式BI工具栈中的各种工具。尽管本书使用的是桌面版Excel及其BI插件，你也可以使用这些工具的Office
    365版本。我希望你已经获得了足够的信心和经验，能够开始使用这些工具分析并深入了解自己的数据。


    既然你已经牢固掌握了如何使用这些工具，你应该能够自如地处理更复杂的主题。有许多优秀资源涵盖了可用于分析数据的不同技术和模式。微软的Power BI网站（`www.microsoft.com/en-us/powerbi/default.aspx`）、Bill
    Jelen的网站（`www.mrexcel.com`）以及Rob Collie的Power Pivot Pro网站（`www.powerpivotpro.com`）都是极好的资源。要了解更多高级主题，请查看Chris
    Webb的BI博客（`http://cwebbbi.wordpress.com`）以及Marco Russo和Alberto Ferrari的SQLBI网站（`www.sqlbi.com/`）。


