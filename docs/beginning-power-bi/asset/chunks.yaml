    \ 所示的数据透视表。\n\n![9781430264453_Fig06-21.jpg](Images/9781430264453_Fig06-21.jpg)\n\
    \n[图 6-21](#9781430264453_Ch06.xhtml#_Fig21). 测试库存度量值\n\n总结\n\n本章为您提供了使用 Power\
    \ Pivot 和 DAX 成功进行基于日期时间分析所需的基础知识。现在您应该了解如何移位日期上下文以比较基于并行期间的度量值。您还应该能够自如地使用期至今\
    \ DAX 公式来聚合度量值。将您在[第 5 章](../Text/9781430264453_Ch05.xhtml)和本章中学到的概念结合起来；当您这样做时，您应该开始识别分析中的模式。基于这些模式，您可以确定所需的\
