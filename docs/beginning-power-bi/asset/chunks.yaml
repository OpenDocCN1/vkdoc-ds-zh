    您可以为一个表设置的“`Table Behavior`”属性包括行标识符、指示唯一性的列、默认标签和默认图像。行标识符用于指明唯一标识每一行的字段（通常称为主键）。此字段必须唯一且不能为空。设置行标识符后，您可以选择哪些列包含应保持唯一的值。例如，您可能有两个同名的员工，您不希望将一个员工的记录与另一个员工的记录分组在一起。默认标签和默认图像用于`Power
