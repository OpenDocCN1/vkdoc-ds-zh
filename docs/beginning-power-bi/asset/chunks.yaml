    [Table 14-8](#9781430264453_Ch14.xhtml#_Tab8). Setting the Data Category


    | Table | Column | Data Category |

    | --- | --- | --- |

    | Sales Rep | Hire Date | Date |

    | Employee Photo | Image |

    | Sales Territory | Region | Country/Region |

    | Country | Country/Region |

    | Territory Image | Image |


    In the Period and Date tables, set the fields so they do not summarize.


    Insert a Power View report and name the report **Sales Rep Performance**. Using
    Tiles, show the different sales reasons in the title area, and in the details
    area, show the sales rep information in cards (see [Figure](#9781430264453_Ch14.xhtml#Fig10)
    14-10).


    ![9781430264453_Fig14-10.jpg](Images/9781430264453_Fig14-10.jpg)


    [Figure 14-10](#9781430264453_Ch14.xhtml#_Fig10). Using tiles and cards to display
    sales rep information


    Add a matrix inside the tile detail area showing the total sales KPI by period
    and sales rep. Turn off the totals for the matrix. Outside the tile area, add
    a period year slicer and a table showing the total sales for each sales region.
    You can also add view filters to filter out years without sales and the NA region.
    Your final dashboard should look similar to [Figure 14-11](#9781430264453_Ch14.xhtml#Fig11).


    ![9781430264453_Fig14-11.jpg](Images/9781430264453_Fig14-11.jpg)


    [Figure 14-11](#9781430264453_Ch14.xhtml#_Fig11). The final sales rep performance
    dashboard


    After completing and experimenting with the dashboard, save and close Excel.


    Use Case 3: Sensor Analysis


    For this scenario, you work for a power company that monitors equipment using
    sensors. The sensors monitor various power readings including power interruptions
    and voltage spikes. When the sensor senses a problem, it triggers an alarm signal
    that is recorded. You need to create a map that allows analysts to view and compare
    power interruptions and voltage spikes over time.


    Load the Data


    The data you will need is in several text files. You will have to clean and process
    the data before you can load it into the Power Pivot model. Because of this, Power
    Query is the tool you will use to load the data.


    Find the folder called `UseCase3` in the `Chapter14Labs` folder. This folder has
    four files that contain the sensor data and the related data you need to complete
    the analysis. Create a new Excel workbook named `PowerAnalysis.xlsx`. Using Power
    Query, connect to the `Alarms.csv` file in the `UseCase3` folder. You should have
    the following columns: PREMISE_NUMBER, METER_NUMBER, OP_CENTER, Type, and DateKey.
    Rename the query to **Alarms**, uncheck the Load Settings, and save the query.
    Add a second query, **AlarmTypes**, which gets the alarm type data from the `AlarmType.txt`
    file. You can now delete the SHORT_CODE column and save the query.


    Reopen the Alarms query and merge it with the AlarmTypes query using the appropriate
    keys (see [Figure 14-12](#9781430264453_Ch14.xhtml#Fig12)).


    ![9781430264453_Fig14-12.jpg](Images/9781430264453_Fig14-12.jpg)


    [Figure 14-12](#9781430264453_Ch14.xhtml#_Fig12). Merging the AlarmType query
    with the Alarms query'
