    ![9781430264453_Fig06-17.jpg](Images/9781430264453_Fig06-17.jpg)\n\n[Figure 6-17](#9781430264453_Ch06.xhtml#_Fig17).\
    \ Choosing an external data source\n\n12.  In the Existing Connections window\
