    and Longitude data added


    Next filter the data to limit it to alarm types of power failure and high AC volts.
    Once you do this, you may notice some error values in the Meter column; go ahead
    and remove these errors. Now you can aggregate the alarm counts grouping by the
    Date, Op Center, Alarm Type, Longitude, and Latitude (see [Figure 14-14](#9781430264453_Ch14.xhtml#Fig14)).


    ![9781430264453_Fig14-14.jpg](Images/9781430264453_Fig14-14.jpg)


    [Figure 14-14](#9781430264453_Ch14.xhtml#_Fig14). Aggregating and grouping the
    alarm data


    After aggregating the data, check Load To Data Model under Load Settings and apply
    and close the query.


    Now that you have the data ready for mapping, launch the Power Map designer and
    create a column chart showing the average counts over time, as shown in [Figure
    14-15](#9781430264453_Ch14.xhtml#Fig15).


    ![9781430264453_Fig14-15.jpg](Images/9781430264453_Fig14-15.jpg)


    [Figure 14-15](#9781430264453_Ch14.xhtml#_Fig15). Power Map showing alarm counts
    over time


