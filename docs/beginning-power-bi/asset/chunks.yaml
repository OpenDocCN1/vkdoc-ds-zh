- fmt: 'In the next section you will see why knowing when and how to alter the query
    context is an important aspect of creating measures.


    ## Altering the Query Context


    When creating calculations you often need to alter the filter context being applied
    to the measure, for example, if you want to calculate the sales of a product category
    compared to the sales of all products (see [Figure 5-10](#9781430264453_Ch05.xhtml#Fig10)).


    ![9781430264453_Fig05-10.jpg](Images/9781430264453_Fig05-10.jpg)


    [Figure 5-10](#9781430264453_Ch05.xhtml#_Fig10). Viewing the product sales ratio


    To calculate the sales ratio, you need to take the sales filtered by the query
    context (in this case, categories) and divide it by the sales of all products
    regardless of the product query context. To calculate sales you just use the `SUM`
    function. To calculate the sum of all product sales, you need to override any
    product filtering applied to the cell. To do this, you use the `CALCULATE` function,
    which evaluates an expression in a context that is modified by the specified filters
    and has the following syntax:


    ```

    CALCULATE(<expression>,<filter1>,<filter2>...)

    ```


    where the expression is essentially a measure to be evaluated and the filters
    are Boolean expressions or a table expression that defines the filters.


    So, to override any product filters, you use the following code:


    ```

    AllProductSales:=CALCULATE(SUM([SalesAmount]), ALL(Product))

    ```


    This uses the `ALL` function, which returns all the rows in a table or all the
    values in a column, ignoring any filters that might have been applied. So in this
    case, it clears all filters placed on the Product table. [Figure 5-11](#9781430264453_Ch05.xhtml#Fig11)
    shows the measures in a pivot table.


    ![9781430264453_Fig05-11.jpg](Images/9781430264453_Fig05-11.jpg)


    [Figure 5-11](#9781430264453_Ch05.xhtml#_Fig11). Verifying the AllProductSales
    measure


    Notice the ProductSales measure is affected by the product filter (category) whereas
    the AllProductSales is not. The final step to calculate the ProductSalesRatio
    measure is to divide the ProductSales by the AllProductSales. You can use a measure
    inside another measure as long as you do not have a circular reference. So the
    ProductSalesRatio is calculated as follows:


    ```

    ProductSalesRatio:=[ProductSales]/[AllProductSales]

    ```


    You can hide the AllProductSales measure from the client tools because, in this
    case, it is used as an intermediate measure and is not useful on its own.


    In this section you saw how to use the `CALCULATE` function and a filter function
    to alter the filters applied to a measure. There are many filter functions available
    in DAX and it is important that you understand when to use them. In the next section
    you will look at several more important filter functions you can use.


    ## Using Filter Functions


    The filter functions in DAX allow you to create complex calculations that require
    you to interrogate and manipulate the data context of a row or cell in a pivot
    table. [Table 5-1](#9781430264453_Ch05.xhtml#Tab1) lists and describes some of
    the filter functions available in DAX.


    [Table 5-1](#9781430264453_Ch05.xhtml#_Tab1). Some DAX Filter Functions


    | Function | Description |

    | --- | --- |

    | `ALL` | Returns all the rows in a table, or all the values in a column, ignoring
    any filters that might have been applied. |

    | `ALLEXCEPT` | Removes all context filters in the table except filters that have
    been applied to the specified columns. |

    | `ALLNONBLANKROW` | Returns all rows but the blank row and disregards any context
    filters that might exist. |

    | `ALLSELECTED` | Removes context filters from columns and rows, while retaining
    all other context filters or explicit filters. |

    | `CALCULATE` | Evaluates an expression in a context that is modified by the specified
    filters. |

    | `CALCULATETABLE` | Evaluates a table expression in a context modified by the
    given filters. |

    | `DISTINCT` | Returns a one-column table that contains the distinct values from
    the specified column. |

    | `FILTER` | Returns a table that represents a subset of another table or expression.
    |

    | `FILTERS` | Returns the values that are directly applied as filters. |

    | `HASONEVALUE` | Returns TRUE when the context has been filtered down to one
    distinct value. |

    | `ISFILTERED` | Returns TRUE when a direct filter is being applied. |

    | `ISCROSSFILTERED` | Returns TRUE when the column or another column in the same
    or related table is being filtered. |

    | `KEEPFILTERS` | Modifies how filters are applied while evaluating a `CALCULATE`
    or `CALCULATETABLE` function. Keeps applied filters and adds additional filters.
    |

    | `RELATED` | Returns a related value from another table. |

    | `USERELATIONSHIP` | Specifies the relationship to be used in a specific calculation.
    |

    | `VALUES` | Returns a one-column table that contains the distinct values from
    the specified column. |


    You have already seen how you can use the `CALCULATE` function in combination
    with the `ALL` function to calculate the total product sales ignoring any product
    filtering applied. Let’s take a look at a few more examples.


    [Figure 5-12](#9781430264453_Ch05.xhtml#Fig12) shows a Power Pivot model for reseller
    sales. In the model there is an inactive relationship between the Employee and
    the SalesTerritory tables. You can use this relationship to calculate the number
    of salesman in each country.


    ![9781430264453_Fig05-12.jpg](Images/9781430264453_Fig05-12.jpg)


    [Figure 5-12](#9781430264453_Ch05.xhtml#_Fig12). An inactive relationship in the
    Power Pivot model


    You can use this to calculate the number of sales reps in each country using the
    following code:


    ```

    Sales Rep Cnt:=CALCULATE(DISTINCTCOUNT(Employee[EmployeeNationalIDAlternateKey]),

    USERELATIONSHIP(Employee[SalesTerritoryKey],SalesTerritory[SalesTerritoryKey]))

    ```


    In this case you need to use the `CALCULATE` function so that you can apply the
    filter function `USERELATIONSHIP` to tell the DAX query engine which relationship
    to use. [Figure 5-13](#9781430264453_Ch05.xhtml#Fig13) shows the resulting pivot
    table. It also shows the result you would get if you just used the `DISTINCTCOUNT`
    function without the `USERELATIONSHIP` filter.


    ![9781430264453_Fig05-13.jpg](Images/9781430264453_Fig05-13.jpg)


    [Figure 5-13](#9781430264453_Ch05.xhtml#_Fig13). Count of sales reps in each country


    In the next example you will look at the difference between the `ALL` and the
    `ALLSELECTED` filter functions. You can create three sales amount measures as
    follows:


    ```

    Reseller Sales:=SUM([SalesAmount])

    Reseller Grand Total:=calculate(sum([SalesAmount]), ALL(''ResellerSales''))

    Reseller Visual Total:=calculate(sum([SalesAmount]), ALLSELECTED())

    ```


    `Reseller Sales` keeps all the data contexts applied to the measure. `Reseller
    Grand Total` removes all context associated with the `ResellerSales` table and
    any related table. `Reseller Visual Total` removes the column and row context
    from the measure. [Figure 5-14](#9781430264453_Ch05.xhtml#Fig14) shows the resulting
    measures in a pivot table.


    ![9781430264453_Fig05-14.jpg](Images/9781430264453_Fig05-14.jpg)


    [Figure 5-14](#9781430264453_Ch05.xhtml#_Fig14). Results of using different filters'
  raw: "In the next section you will see why knowing when and how to alter the query\
    \ context is an important aspect of creating measures.\n\nAltering the Query Context\n\
    \nWhen creating calculations you often need to alter the filter context being\
    \ applied to the measure, for example, if you want to calculate the sales of a\
    \ product category compared to the sales of all products (see [Figure 5-10](#9781430264453_Ch05.xhtml#Fig10)).\n\
    \n![9781430264453_Fig05-10.jpg](Images/9781430264453_Fig05-10.jpg)\n\n[Figure\
    \ 5-10](#9781430264453_Ch05.xhtml#_Fig10). Viewing the product sales ratio\n\n\
    To calculate the sales ratio, you need to take the sales filtered by the query\
    \ context (in this case, categories) and divide it by the sales of all products\
    \ regardless of the product query context. To calculate sales you just use the\
    \ `SUM` function. To calculate the sum of all product sales, you need to override\
    \ any product filtering applied to the cell. To do this, you use the `CALCULATE`\
    \ function, which evaluates an expression in a context that is modified by the\
    \ specified filters and has the following syntax:\n\n```\nCALCULATE(<expression>,<filter1>,<filter2>...)\n\
    ```\n\nwhere the expression is essentially a measure to be evaluated and the filters\
    \ are Boolean expressions or a table expression that defines the filters.\n\n\
    So, to override any product filters, you use the following code:\n\n```\nAllProductSales:=CALCULATE(SUM([SalesAmount]),\
    \ ALL(Product)) \n```\n\nThis uses the `ALL` function, which returns all the rows\
    \ in a table or all the values in a column, ignoring any filters that might have\
    \ been applied. So in this case, it clears all filters placed on the Product table.\
    \ [Figure 5-11](#9781430264453_Ch05.xhtml#Fig11) shows the measures in a pivot\
    \ table.\n\n![9781430264453_Fig05-11.jpg](Images/9781430264453_Fig05-11.jpg)\n\
    \n[Figure 5-11](#9781430264453_Ch05.xhtml#_Fig11). Verifying the AllProductSales\
    \ measure\n\nNotice the ProductSales measure is affected by the product filter\
    \ (category) whereas the AllProductSales is not. The final step to calculate the\
    \ ProductSalesRatio measure is to divide the ProductSales by the AllProductSales.\
    \ You can use a measure inside another measure as long as you do not have a circular\
    \ reference. So the ProductSalesRatio is calculated as follows:\n\n```\nProductSalesRatio:=[ProductSales]/[AllProductSales]\n\
    ```\n\nYou can hide the AllProductSales measure from the client tools because,\
    \ in this case, it is used as an intermediate measure and is not useful on its\
    \ own.\n\nIn this section you saw how to use the `CALCULATE` function and a filter\
    \ function to alter the filters applied to a measure. There are many filter functions\
    \ available in DAX and it is important that you understand when to use them. In\
    \ the next section you will look at several more important filter functions you\
    \ can use.\n\nUsing Filter Functions\n\nThe filter functions in DAX allow you\
    \ to create complex calculations that require you to interrogate and manipulate\
    \ the data context of a row or cell in a pivot table. [Table 5-1](#9781430264453_Ch05.xhtml#Tab1)\
    \ lists and describes some of the filter functions available in DAX.\n\n[Table\
    \ 5-1](#9781430264453_Ch05.xhtml#_Tab1). Some DAX Filter Functions\n\n| Function\
    \ | Description |\n| --- | --- |\n| `ALL` | Returns all the rows in a table, or\
    \ all the values in a column, ignoring any filters that might have been applied.\
    \ |\n| `ALLEXCEPT` | Removes all context filters in the table except filters that\
    \ have been applied to the specified columns. |\n| `ALLNONBLANKROW` | Returns\
    \ all rows but the blank row and disregards any context filters that might exist.\
    \ |\n| `ALLSELECTED` | Removes context filters from columns and rows, while retaining\
    \ all other context filters or explicit filters. |\n| `CALCULATE` | Evaluates\
    \ an expression in a context that is modified by the specified filters. |\n| `CALCULATETABLE`\
    \ | Evaluates a table expression in a context modified by the given filters. |\n\
    | `DISTINCT` | Returns a one-column table that contains the distinct values from\
    \ the specified column. |\n| `FILTER` | Returns a table that represents a subset\
    \ of another table or expression. |\n| `FILTERS` | Returns the values that are\
    \ directly applied as filters. |\n| `HASONEVALUE` | Returns TRUE when the context\
    \ has been filtered down to one distinct value. |\n| `ISFILTERED` | Returns TRUE\
    \ when a direct filter is being applied. |\n| `ISCROSSFILTERED` | Returns TRUE\
    \ when the column or another column in the same or related table is being filtered.\
    \ |\n| `KEEPFILTERS` | Modifies how filters are applied while evaluating a `CALCULATE`\
    \ or `CALCULATETABLE` function. Keeps applied filters and adds additional filters.\
    \ |\n| `RELATED` | Returns a related value from another table. |\n| `USERELATIONSHIP`\
    \ | Specifies the relationship to be used in a specific calculation. |\n| `VALUES`\
    \ | Returns a one-column table that contains the distinct values from the specified\
    \ column. |\n\nYou have already seen how you can use the `CALCULATE` function\
    \ in combination with the `ALL` function to calculate the total product sales\
    \ ignoring any product filtering applied. Let’s take a look at a few more examples.\n\
    \n[Figure 5-12](#9781430264453_Ch05.xhtml#Fig12) shows a Power Pivot model for\
    \ reseller sales. In the model there is an inactive relationship between the Employee\
    \ and the SalesTerritory tables. You can use this relationship to calculate the\
    \ number of salesman in each country.\n\n![9781430264453_Fig05-12.jpg](Images/9781430264453_Fig05-12.jpg)\n\
    \n[Figure 5-12](#9781430264453_Ch05.xhtml#_Fig12). An inactive relationship in\
    \ the Power Pivot model\n\nYou can use this to calculate the number of sales reps\
    \ in each country using the following code:\n\n```\nSales Rep Cnt:=CALCULATE(DISTINCTCOUNT(Employee[EmployeeNationalIDAlternateKey]),\n\
    USERELATIONSHIP(Employee[SalesTerritoryKey],SalesTerritory[SalesTerritoryKey]))\n\
    ```\n\nIn this case you need to use the `CALCULATE` function so that you can apply\
    \ the filter function `USERELATIONSHIP` to tell the DAX query engine which relationship\
    \ to use. [Figure 5-13](#9781430264453_Ch05.xhtml#Fig13) shows the resulting pivot\
    \ table. It also shows the result you would get if you just used the `DISTINCTCOUNT`\
    \ function without the `USERELATIONSHIP` filter.\n\n![9781430264453_Fig05-13.jpg](Images/9781430264453_Fig05-13.jpg)\n\
    \n[Figure 5-13](#9781430264453_Ch05.xhtml#_Fig13). Count of sales reps in each\
    \ country\n\nIn the next example you will look at the difference between the `ALL`\
    \ and the `ALLSELECTED` filter functions. You can create three sales amount measures\
    \ as follows:\n\n```\nReseller Sales:=SUM([SalesAmount])\nReseller Grand Total:=calculate(sum([SalesAmount]),\
    \ ALL('ResellerSales'))\nReseller Visual Total:=calculate(sum([SalesAmount]),\
    \ ALLSELECTED())\n```\n\nReseller Sales keeps all the data contexts applied to\
    \ the measure. Reseller Grand Total removes all context associated with the ResellerSales\
    \ table and any related table. Reseller Visual Total removes the column and row\
    \ context from the measure. [Figure 5-14](#9781430264453_Ch05.xhtml#Fig14) shows\
    \ the resulting measures in a pivot table.\n\n![9781430264453_Fig05-14.jpg](Images/9781430264453_Fig05-14.jpg)\n\
    \n[Figure 5-14](#9781430264453_Ch05.xhtml#_Fig14). Results of using different\
    \ filters"
