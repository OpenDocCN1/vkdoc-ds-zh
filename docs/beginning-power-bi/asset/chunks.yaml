    \ in column A. Under the Home tab select the Format As Table drop-down and select\
    \ a format. Under the Table Tools Design tab change the table name to **Date**\
    \ (see [Figure 6-14](#9781430264453_Ch06.xhtml#Fig14)).\n\n![9781430264453_Fig06-14.jpg](Images/9781430264453_Fig06-14.jpg)\n\
    \n[Figure 6-14](#9781430264453_Ch06.xhtml#_Fig14). Creating the date table\n\n\
    5.  To add the table to the model, select the table and under the PowerPivot tab\
    \ click the Add To Data Model button (see [Figure 6-15](#9781430264453_Ch06.xhtml#Fig15)).\n\
    \n![9781430264453_Fig06-15.jpg](Images/9781430264453_Fig06-15.jpg)\n\n[Figure\
    \ 6-15](#9781430264453_Ch06.xhtml#_Fig15). Adding the Excel table to the data\
    \ model\n\n6.  You should see the table in the data view window of the Power Pivot\
    \ design window. Click on the Design tab and select Mark As Date Table. Use the\
