    ## Use Case 2: Sales Quota Analysis


    For this scenario, you will use the sales data for the sales team of the same
    bike company from Use Case 1. This time, using Power View, you need to create
    a dashboard that allows the sales manager to track the performance of the sales
    team. You will compare actual sales to the sales quotas for the sales team. Although
    the measures you need for this comparison are not that complex, the grain of the
    data for sales and quotas is at different levels, which presents a challenge.


    ### Load the Data


    Create a new Excel Workbook named `SalesRepAnalysis.xlsx`. In the `Chapter14Labs`
    folder is a folder named `UseCase2`; this folder contains a `SalesRepAnalysis.accdb`
    Access database. Using this as a data source, import the data tables and columns
    listed in [Table 14-5](#9781430264453_Ch14.xhtml#Tab5).


    [Table 14-5](#9781430264453_Ch14.xhtml#_Tab5). Tables and Columns to Import


    ![Table14-5](Images/Table14-5.jpg)


    ### Create the Model


    After importing the tables, rename the table columns and show or hide the columns
    from client tools according to the information listed in [Table 14-6](#9781430264453_Ch14.xhtml#Tab6).


    [Table 14-6](#9781430264453_Ch14.xhtml#_Tab6). Table and Column Property Settings


    ![Table14-6](Images/Table14-6.jpg)


    In order to create the appropriate relationships between the tables, you need
    to create a Sales Period table that contains the calendar year and quarter. To
    get this table, use the existing connection to the `SalesRepAnalysis.accdb` Access
    database. This time, use the following query to get the data (make sure the friendly
    query name is Sales Period):


    ```

    Select distinct CalendarYear & CalendarQuarter as PeriodKey,

    CalendarYear as [Period Year], CalendarQuarter  as [Period Quarter] from dbo_DimDate

    ```


    Using the DAX `CONCATENATE` function, create a PeriodKey column in the Quota table.


    ```

    [PeriodKey]

    =CONCATENATE([CalendarYear],[CalendarQuarter])

    ```


    The Sales table is a little trickier. First create a relationship between the
    Sales table and the Date table. Next, use the `RELATED` function to create a Period
    Year and Period Quarter in the Sales table. Then use the `CONCATENATE` function
    to create the `PeriodKey` column in the Sales table.


    ```

    [Period Year]

    =Related(''Date''[Calendar Year])

    [Period Quarter]

    =RELATED(''Date''[Calendar Quarter])

    ```


    Hide the `PeriodKey` in the tables from client tools. Also hide the `Period Year`
    and `Period Quarter` columns in the Quota and Sales tables.


    Now you can finish creating the table relationships in the model. [Figure 14-8](#9781430264453_Ch14.xhtml#Fig8)
    shows what the final model should look like.


    ![9781430264453_Fig14-08.jpg](Images/9781430264453_Fig14-08.jpg)


    [Figure 14-8](#9781430264453_Ch14.xhtml#_Fig8). The Sales Rep Analysis model with
    relationships defined


    Next create a Territory hierarchy in the Sales Territory table using the Group,
    Country, and Region fields. Create another hierarchy in the Sales Period table
    called Period using the `Period Year` and `Period Quarter` fields. Add a calculated
    column called `Sales Rep Name` to the Sales Rep table by concatenating the `Last
    Name` and `First Name` columns separated by a comma.


    ### Create Measures


    Add the following measure to the Sales table:


    ```

    Total Sales:=SUM([Sales Amount])

    ```


    Add the following measures to the Quota table:


    ```

    Total Quota:=Sum([Sales Quota])


    Variance:=[Total Sales]-[Total Quota]

    ```'
