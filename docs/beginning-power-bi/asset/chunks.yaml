    ## Summary


    This chapter introduced you to the Power Pivot add-in to Excel. You got a little
    background into why Power Pivot can handle large amounts of data through the use
    of the xVelocity engine and columnar data storage. You also got to investigate
    and gain some experience with the Power Pivot Data Model Manager. Don’t worry
    about the details of how you develop the various parts of the model just yet.
    This is explained in detail as you progress through the book. This begins in the
    next chapter where you will learn how to get data into the model from various
    kinds of data sources.


    # CHAPTER 2


    ![image](Images/frontdot.jpg)


    # Importing Data into Power Pivot


    One of the first steps in creating the Power Pivot model is importing data. Traditionally
    when creating a BI solution based on an OLAP cube, you need to import the data
    into the data warehouse and then load it into the cube. It can take quite a while
    to get the data incorporated into the cube and available for your consumption.
    This is one of the greatest strengths of the Power Pivot model. You can easily
    and quickly combine data from a variety of sources into your model. The data sources
    can be from relational databases, text files, web services, and OLAP cubes, just
    to name a few. This chapter shows you how to incorporated data from a variety
    of these sources into a Power Pivot model.


    After completing this chapter you will be able to:


    - Import data from relational databases.

    - Import data from text files.

    - Import data from a data feed.

    - Import data from an OLAP cube.

    - Reuse existing connections to update the model.


    ## Importing Data from Relational Databases


    One of the most common types of data sources you will run into is a relational
    database. Relational database management systems (RDMS), such as SQL Server, Oracle,
    DB2, and Access, consist of tables and relationships between the tables based
    on keys. For example [Figure 2-1](#9781430264453_Ch02.xhtml#Fig1) shows a purchase
    order detail table and a product table. They are related by the `ProductID` column.
    This is an example of a one-to-many relationship. For every one row in the product
    table there are many rows in the purchase order detail table. The keys in a table
    are referred to as primary and foreign keys. Every table needs a primary key that
    uniquely identifies a row in the table. For example, the `ProductID` is the primary
    key in the product table. The `ProductID` is considered a foreign key in the purchase
    order detail table. Foreign keys point back to a primary key in a related table.
    Notice a primary key can consist of a combination of columns; for example, the
    primary key of the purchase order detail table is the combination of the `PurchaseOrderID`
    and the `PurchaseOrderDetailID`.


    ![9781430264453_Fig02-01.jpg](Images/9781430264453_Fig02-01.jpg)


    [Figure 2-1](#9781430264453_Ch02.xhtml#_Fig1). A one-to-many relationship


    Although one-to-many relationships are the most common, you will run into another
    type of relationship that is fairly prevalent—the many-to-many. [Figure 2-2](#9781430264453_Ch02.xhtml#Fig2)
    shows an example of a many-to-many relationship. A person can have multiple phone
    numbers of different types. For example they may have two fax numbers. You cannot
    relate these tables directly. Instead you need to use a junction table that contains
    the primary keys from the tables. The combination of the keys in the junction
    table must be unique.


    ![9781430264453_Fig02-02.jpg](Images/9781430264453_Fig02-02.jpg)


    [Figure 2-2](#9781430264453_Ch02.xhtml#_Fig2). A many-to-many relationship


    Notice that the junction table can contain information related to the association;
    for example, the `PhoneNumber` is associated with the customer and phone number
    type. A customer cannot have the same phone number listed as two different types.


    One nice aspect of obtaining data from a relational database is that the model
    is very similar to a model you will create in Power Pivot. In fact, if the relationships
    are defined in the database, the Power Pivot import wizard can detect these and
    set them up in the model for you.


    The first step to getting data from a relational database is to create a connection.
    On the Home tab of the Model Designer there is a `Get External Data` grouping
    (see [Figure 2-3](#9781430264453_Ch02.xhtml#Fig3)).


    ![9781430264453_Fig02-03.jpg](Images/9781430264453_Fig02-03.jpg)


    [Figure 2-3](#9781430264453_Ch02.xhtml#_Fig3). Setting up a connection


    The `From Database` drop-down allows you to connect to SQL Server, Access, Analysis
    Services, or from another Power Pivot model. If you click on the `From Other Sources`
    button, you can see all the various data sources available to connect to (see
    [Figure 2-4](#9781430264453_Ch02.xhtml#Fig4)). As you can see, you can connect
    to quite a few relational databases. If one you need to connect to is not listed,
    you may be able to install a driver from the database provider to connect to it.
    Chances are, you may also be able to use the generic ODBC (Open Database Connectivity)
    driver to connect to it.


    ![9781430264453_Fig02-04.jpg](Images/9781430264453_Fig02-04.jpg)


    [Figure 2-4](#9781430264453_Ch02.xhtml#_Fig4). Selecting a data source


    After selecting a data source, you are presented with a window to enter the connection
    information. The connection information depends on the data source you are connecting
    to. For most relational databases the information needed is very similar. [Figure
    2-5](#9781430264453_Ch02.xhtml#Fig5) shows the connection information for connecting
    to a SQL Server. Remember to click the `Test Connection` button to make sure everything
    is entered correctly.


    ![9781430264453_Fig02-05.jpg](Images/9781430264453_Fig02-05.jpg)


    [Figure 2-5](#9781430264453_Ch02.xhtml#_Fig5). Setting up a connection to a database


    After setting up the connection the next step is to query the database to retrieve
    the data. You have two choices at this point: You can choose to import the data
    from a list of tables and views or you can write a query to import the data (see
    [Figure 2-6](#9781430264453_Ch02.xhtml#Fig6)). Even if you select to import the
    data from a table or view under the covers, a query is created and sent to the
    database to retrieve the data.


    ![9781430264453_Fig02-06.jpg](Images/9781430264453_Fig02-06.jpg)


    [Figure 2-6](#9781430264453_Ch02.xhtml#_Fig6). Choosing how to retrieve the data


    If you choose to get the data from a list of tables and views, you are presented
    with the list in the next screen. From your perspective a view and a table look
    the same. In reality, a view is really a stored query in the database that masks
    the complexity of the query from you. Views are often used to show a simpler conceptional
    model of the database than the actual physical model. For example you may need
    a customer’s address. [Figure 2-7](#9781430264453_Ch02.xhtml#Fig7) shows the tables
    you need to include in a query to get the information. Instead of writing a complex
    query to retrieve the information, you can select from a view that combines the
    information in a virtual Customer Address table for you. Another common use of
    a view is to secure columns of the underlying table. Through the use of a view
    the database administrator can hide columns from various users.


    ![9781430264453_Fig02-07.jpg](Images/9781430264453_Fig02-07.jpg)


    [Figure 2-7](#9781430264453_Ch02.xhtml#_Fig7). Tables needed to get a customer
    address'
