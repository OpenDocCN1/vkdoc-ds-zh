    ## 在 Power Pivot 中构建模型


    ### 第 1 章


    ![图片](img/frontdot.jpg)


    ## Power Pivot 简介


    微软自助式商业智能（BI）工具集的核心是 Power Pivot。其他工具，Power View、Power Query 和 Power Map，都构建在
    Power Pivot 表格模型之上。就 Power View 而言，这一点显而易见，因为你需要显式地连接到该模型。就 Power Query 和 Power
    Map 而言，可能不那么明显，因为 Power Pivot 表格模型是在幕后为你创建的。无论它是如何创建的，为了充分利用这个工具集并深入了解数据，你都需要知道
    Power Pivot 是如何工作的。


    本章为你提供了一些背景信息，说明为什么 Power Pivot 是如此重要的工具，以及是什么让 Power Pivot 性能如此出色。它会指导你运行 Power
    Pivot 所需的条件以及如何启用它。本章还为你概述了 Power Pivot 界面，并让你获得一些使用界面不同区域的经验。


    读完本章后，你将熟悉以下内容：


    *   为什么使用 Power Pivot？

    *   xVelocity 内存分析引擎

    *   为 Excel 启用 Power Pivot

    *   探索数据模型管理界面


    ### 为什么使用 Power Pivot？


    你可能参与过传统的 BI 项目，这些项目包含一个集中式数据仓库，组织的各种数据存储在其中被加载、清洗，然后移至 OLAP（联机分析处理）数据库用于报告和分析。这种方法的一些目标是：创建历史数据的数据存储库，创建单一版本的事实，减少数据孤岛，清理公司数据并确保其符合标准，以及通过仪表板深入了解数据趋势。尽管这些目标值得称赞，也是提供集中式数据仓库的绝佳理由，但这种方法也有一些缺点。最显著的是构建系统和实施变革的复杂性。问问任何一个试图向企业级数据仓库添加新字段或度量的人。这通常是一个漫长、旷日持久的过程，需要
    IT 部门参与，以及数据管理员委员会审查、开发和测试周期。需要的是一种允许敏捷数据分析的解决方案，而无需过多依赖 IT 和正式流程。为了解决这些问题，许多业务分析师曾使用
    Excel 创建数据透视表，并对从各种数据源收集的数据集进行临时分析。使用孤立的 Excel 工作簿进行分析的一些问题是：相互冲突的事实版本、数据孤岛以及数据安全性。


    那么，你如何解决集中式数据仓库过于僵化而 Excel 解决方案又过于松散这一两难困境呢？这就是微软自助式 BI 工具集的用武之地。这些工具并非取代你的集中式数据仓库解决方案，而是对其进行补充，以促进敏捷数据分析。使用
    Power Pivot，你可以从数据仓库中提取数据，用其他数据源（如文本文件或 Web 数据馈送）扩展数据，构建自定义度量，并使用数据透视表和数据透视图分析数据。你可以创建快速的概念验证原型，这些原型可以轻松地推广成为企业级解决方案的一部分。Power
    Pivot 还促进了单独的数据分析项目，而无需经历冗长的开发周期。当与 SharePoint 结合时，Power Pivot 工作簿可以由 IT 部门进行安全管理和控制，包括数据刷新调度和资源使用。这在很大程度上满足了
    IT 部门对治理的需求，同时又不会妨碍业务用户对敏捷性的需求。


    以下是 Power Pivot 的一些优势：


    *   作为 Excel 的免费加载项运行

    *   轻松整合来自各种来源的数据

    *   处理多达数千万到数亿行的大量数据

    *   使用熟悉的 Excel 数据透视表和数据透视图进行数据分析

    *   包含强大的新数据分析表达式 (DAX) 语言

    *   模型中的数据是只读的，从而提高了安全性和完整性


    当 Power Pivot 托管在 SharePoint 中时，它还有以下额外优势：


    *   支持 Power Pivot BI 解决方案的共享与协作

    *   可以安排和自动化数据刷新

    *   可以通过版本管理审计更改

    *   可以确保用户具有只读和可更新的访问权限


    既然你已经了解了 Power Pivot 的一些优势，那么让我们来看看它的运作机制。


    ### xVelocity 内存分析引擎

    '
- fmt: '# The Power Pivot xVelocity Engine


    The special sauce behind Power Pivot is the `xVelocity` in-memory analytics engine
    (yes, that is really the name!). This allows Power Pivot to provide fast performance
    on large amounts of data. One of the keys to this is it uses a columnar database
    to store the data. Traditional row-based data storage stores all the data in the
    row together and is efficient at retrieving and updating data based on the row
    key, for example, updating or retrieving an order based on an order ID. This is
    great for the order entry system but not so great when you want to perform analysis
    on historical orders (say you want to look at trends for the past year to determine
    how products are selling, for example).


    Row-based storage also takes up more space by repeating values for each row; if
    you have a large number of customers, common names like John or Smith are repeated
    many times. A columnar database stores only the distinct values for each column
    and then stores the row as a set of pointers back to the column values. This built-in
    indexing saves a lot of space and allows for significant optimization when coupled
    with data compression techniques that are built into the `xVelocity` engine. It
    also means that data aggregations (like those used in typical data analysis) of
    the column values are extremely fast.


    Another benefit provided by the `xVelocity` engine is the in-memory analytics.
    Most processing bottlenecks associated with querying data occur when data is read
    off of or written to a disk. With in-memory analytics, the data is loaded into
    the RAM memory of the computer and then queried. This results in much faster processing
    times and limits the need to store pre-aggregated values on disk. This advantage
    is especially apparent when you move from 32-bit to 64-bit operating systems and
    applications, which are becoming the norm these days.


    ## Tabular Model Benefits


    In addition to the benefits provided by the `xVelocity` engine, another benefit
    that is worth mentioning is the tabular structure of the Power Pivot model. The
    model consists of tables and table relationships. This tabular model is more familiar
    to most business analysts and database developers. Traditional OLAP databases
    such as `SSAS` (SQL Server Analysis Server) present the data model as a three
    dimensional cube structure that is more difficult to work with and requires a
    complex query language, `MDX` (Multidimensional Expressions). I find, in most
    cases (but not all), that it is easier to work with tabular models and `DAX` than
    OLAP cubes and `MDX`.


    ## Enabling Power Pivot for Excel


    Power Pivot is a free add-in to Excel available in the Office Professional Plus
    and Office 365 Professional Plus editions. If you are using Excel 2010, you need
    to download and install the add-in from the Microsoft Office web site. If you
    are using Excel 2013 (the version covered in this book), the add-in is already
    installed and you just have to enable it. To check what edition you have installed,
    select the File menu in Excel and select the Account tab as shown in [Figure 1-1](#9781430264453_Ch01.xhtml#Fig1).


    ![9781430264453_Fig01-01.jpg](Images/9781430264453_Fig01-01.jpg)


    [Figure 1-1](#9781430264453_Ch01.xhtml#_Fig1). Checking for the Excel version


    On the Excel Account tab click the About Excel button. You are presented with
    a screen showing version details as shown in [Figure 1-2](#9781430264453_Ch01.xhtml#Fig2).
    Take note of the edition and the version. It should be the Professional Plus edition
    and ideally the 64-bit version. The 32-bit version will work fine for smaller
    data sets, but to get the optimal performance and experience from Power Pivot
    you should use the 64-bit version running on a 64-bit version of Windows with
    about 8 gigs of RAM.


    ![9781430264453_Fig01-02.jpg](Images/9781430264453_Fig01-02.jpg)


    [Figure 1-2](#9781430264453_Ch01.xhtml#_Fig2). Checking the Excel edition and
    version


    Once you have determined you are running the correct version, you can enable the
    Power Pivot add-in by going to the File menu and selecting the Options tab. In
    the Excel Options window select the Add-Ins tab. In the Manage drop-down select
    Com Add-Ins and click the Go button (see [Figure 1-3](#9781430264453_Ch01.xhtml#Fig3)).


    ![9781430264453_Fig01-03.jpg](Images/9781430264453_Fig01-03.jpg)


    [Figure 1-3](#9781430264453_Ch01.xhtml#_Fig3). Managing com add-ins


    You are presented with the Com Add-Ins window (see [Figure 1-4](#9781430264453_Ch01.xhtml#Fig4)).
    Select `Microsoft Office PowerPivot for Excel 2013` and click OK.


    ![9781430264453_Fig01-04.jpg](Images/9781430264453_Fig01-04.jpg)


    [Figure 1-4](#9781430264453_Ch01.xhtml#_Fig4). Selecting the Power Pivot add-in


    Now that you have enabled the Power Pivot add-in for Excel, it is time to explore
    the Data Model Manager.


    ## Exploring the Data Model Manager Interface


    Once you enable Power Pivot, you should see a new Power Pivot tab in Excel (see
    [Figure 1-5](#9781430264453_Ch01.xhtml#Fig5)). If you click on the Manage button
    it launches the Data Model Management interface.


    ![9781430264453_Fig01-05.jpg](Images/9781430264453_Fig01-05.jpg)


    [Figure 1-5](#9781430264453_Ch01.xhtml#_Fig5). Launching the Data Model Manager


    When the Data Model Manager launches you will have two separate but connected
    interfaces. You can switch back and forth between the normal Excel interface and
    the Data Model Management interface. This can be quite confusing for new Power
    Pivot users. Remember the Data Model Manager ([Figure 1-6](#9781430264453_Ch01.xhtml#Fig6))
    is where you define the model including tables, table relationships, measures,
    calculated columns, and hierarchies. The Excel interface ([Figure 1-7](#9781430264453_Ch01.xhtml#Fig7))
    is where you analyze the data using pivot tables and pivot charts.


    ![9781430264453_Fig01-06.jpg](Images/9781430264453_Fig01-06.jpg)


    [Figure 1-6](#9781430264453_Ch01.xhtml#_Fig6). The Data Model Manager interface


    ![9781430264453_Fig01-07.jpg](Images/9781430264453_Fig01-07.jpg)


    [Figure 1-7](#9781430264453_Ch01.xhtml#_Fig7). The Excel Workbook interface


    ## Views in the Data Model Manager


    There are two views of the data model in the Data Model Manager, the data view
    and the diagram view. When it first comes up, it is in the data view mode. In
    the data view mode you can see the data contained in the model. Each table in
    the model has its own tab in the view. Tables can include columns of data retrieved
    from a data source and also columns that are calculate using `DAX`. The calculated
    columns appear a little darker than the other columns. [Figure 1-8](#9781430264453_Ch01.xhtml#Fig8)
    shows the `Full Name` column, which is derived by concatenating the `First Name`
    and `Last Name` columns.


    ![9781430264453_Fig01-08.jpg](Images/9781430264453_Fig01-08.jpg)


    [Figure 1-8](#9781430264453_Ch01.xhtml#_Fig8). A calculated column in the Data
    Model Manager


    Each tab also contains a grid area below the column data. The grid area is where
    you define measures in the model. The measures usually consist of some sort of
    aggregation function. For example, you may want to look at sales rolled up by
    month or by products. [Figure 1-9](#9781430264453_Ch01.xhtml#Fig9) shows some
    measures associated with the `Internet Sales` table.


    ![9781430264453_Fig01-09.jpg](Images/9781430264453_Fig01-09.jpg)


    [Figure 1-9](#9781430264453_Ch01.xhtml#_Fig9). The measures grid area in the Data
    Model Manager'
