    ## 总结


    一个为 Power View 使用而优化良好的 Power Pivot 模型，将是卓越用户体验与极差用户体验之间的分水岭。本章向您展示了如何优化 Power
    Pivot 模型，以便在 Power View 中更好地创建报表。您了解了如何设置表格行为属性和列属性，以及这些设置如何影响 Power View 体验。您还熟悉了在
    Power View 中创建卡片和表格，以及如何对表格进行筛选和排序。下一章将深入探讨 Power View 报表设计器的功能，展示如何创建基本的可视化类型以及这些可视化内置的交互功能，并演示和讨论跨视图筛选、向下钻取功能和切片器。


    ## 第 9 章


    ![image](img/frontdot.jpg)


    # 使用 Power View 创建标准可视化


    上一章您已经了解到，创建一个能与 Power View 良好协作的 Power Pivot 模型至关重要。在本章中，您将探究一些用于创建报表和仪表板的标准可视化效果。您将熟悉
    Power View 设计器的常见功能。您将构建标准可视化效果，例如柱形图、条形图和饼图。此外，您还将学习如何使用散点图，以及如何将其转换为带有播放轴的气泡图。您将探究的最后一种可视化效果是如何使用地图进行地理数据分析。


    完成本章后，您将能够：


    *   创建表格和矩阵。

    *   构建条形图、柱形图和饼图。

    *   构建折线图和散点图。

    *   创建基于地图的可视化效果。


    ![Image](img/sq.jpg) **注意**  如需彩色图片副本，请访问 `http://www.apress.com/9781430264453`
    的源代码/下载部分。


    ## 创建表格和矩阵


    正如您在上章所学，Power View 中的所有可视化效果最初都是从表格开始的，然后才转换为其他类型的可视化效果。虽然表格是最基本的数据可视化类型之一，但它仍然是查看数据最有用的方式之一，特别是当您需要查找详细信息时。图
    9-1 显示了展示客户联系信息的表格。


    ![9781430264453_Fig09-01.jpg](img/9781430264453_Fig09-01.jpg)


    图 9-1. 客户联系信息


    当您将表格与 Power View 自带的自动筛选功能结合使用时，这将成为根据客户人口统计数据查找客户的绝佳方式。在视图中选中表格后，点击“筛选器”区域中的`Table`选项卡（参见图
    9-2）。表格中的字段将自动出现在表格筛选器列表中。若要将一个您希望用于筛选但不想显示在表格中的字段添加到筛选器列表，只需将该字段从“Power View
    字段列表”拖放到“筛选器”区域。


    ![9781430264453_Fig09-02.jpg](img/9781430264453_Fig09-02.jpg)


    图 9-2. 筛选表格


    实现表格筛选的另一种方法是使用切片器。要创建切片器，首先使用要按之切分的字段创建一个单列表格。选中视图区域中的表格，然后在`Design`选项卡中，点击`Slicer`按钮（参见图
    9-3）。


    ![9781430264453_Fig09-03.jpg](img/9781430264453_Fig09-03.jpg)


    图 9-3. 创建切片器


    切片器会筛选视图上的所有数据——甚至包括其他切片器。图 9-4 展示了在`国家/地区`切片器中的选择如何限制`省/州`切片器中显示的内容。


    ![9781430264453_Fig09-04.jpg](img/9781430264453_Fig09-04.jpg)


    图 9-4. 使用切片器进行筛选


    矩阵与表格类似，都包含行和列，但它不显示明细级别的记录，而是按行和列标题中显示的字段对数据进行聚合。在 Excel 中创建数据透视表时，它本质上就是一个矩阵。如果矩阵包含层次结构，您可以向上或向下钻取该层次结构。要创建矩阵，首先从一个表格开始，然后将其转换为矩阵。图
    9-5 显示了一个表格，用于展示每个月不同经销商类型的销售利润。


    ![9781430264453_Fig09-05.jpg](img/9781430264453_Fig09-05.jpg)


    图 9-5. 按类型和月份显示经销商销售额的表格

