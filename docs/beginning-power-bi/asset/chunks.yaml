    总结


    使用 Power Pivot 时，理解什么构成了一个好模型至关重要。一个好的模型能让 Power Pivot 运行得异常快速，并允许你轻松分析大量数据。与传统的
    Excel 数据透视表（基于 Excel 工作表中的单个表）不同，Power Pivot 数据透视表基于包含在数据模型中的多个表。本章指导你完成了创建坚实模型的过程，该模型将成为你数据分析的基础。此外，你还了解了如何向客户端工具呈现一个用户友好的模型。


    现在，你已经为模型打下了坚实的基础，接下来就可以通过自定义计算来扩展模型了。下一章将介绍数据分析表达式 (DAX) 语言，并解释如何在数据模型中创建计算列。其中包含了大量示例，以帮助你创建模型中的常见计算。


    第 4 章


    ![image](img/frontdot.jpg)


    使用 DAX 创建计算


    现在你已知道如何创建一个健壮的数据模型作为分析基础，下一步是向模型添加任何有助于探索数据所需的计算。例如，你可能需要将代码值转换为有意义的描述，或者解析字符串以获取关键信息。这就是数据分析表达式
    (DAX) 发挥作用的地方。本章将向你介绍 DAX，并展示如何使用 DAX 创建计算列，以增强模型的功能。


    完成本章后，你将能够：


    *   使用 DAX 向表添加计算列

    *   实现 DAX 运算符

    *   在 DAX 中使用文本函数

    *   使用 DAX 日期和时间函数

    *   使用条件和逻辑函数

    *   从相关表中获取数据

    *   使用数学、三角和统计函数


    什么是 DAX？


    DAX 是一种公式语言，用于在 Power Pivot 模型中创建计算列和度量值。它是专门为 Power Pivot 所基于的表格数据模型而开发的新语言。如果你熟悉
    Excel 的公式语法，你会发现 DAX 语法非常相似。实际上，某些 DAX 公式的语法和功能与 Excel 中的对应公式完全相同。一个你需要理解的主要区别是，Excel
    公式基于单元格，而 DAX 基于列。例如，如果要在 Excel 中连接两个值，你会使用类似下面的公式：


    ```

    =A1 & " " & B1

    ```


    其中 `A1` 是第一行第一列的单元格，`B1` 是第一行第二列的单元格（参见图 4-1）。


    ![9781430264453_Fig04-01.jpg](img/9781430264453_Fig04-01.jpg)


    图 4-1. 在 Excel 中输入公式


    这与 DAX 公式非常相似：


    ```

    =[First Name] & " " & [Last Name]

    ```


    其中 `First Name` 和 `Last Name` 是模型表中的列（参见图 4-2）。


    ![9781430264453_Fig04-02.jpg](img/9781430264453_Fig04-02.jpg)


    图 4-2. 在 Power Pivot 中输入公式


    区别在于，DAX 公式应用于表中的所有行，而 Excel 公式仅适用于特定单元格。在 Excel 中，你需要在每一行中重新创建公式。


    这意味着，尽管你可以在 Excel 中执行类似以下操作：


    ```

    =A1 & " " & B2

    ```


    即从第一行获取一个单元格并与第二行的一个单元格连接（参见图 4-3），但这在 DAX 中是做不到的。


    ![9781430264453_Fig04-03.jpg](img/9781430264453_Fig04-03.jpg)


    图 4-3. 使用不同行中的单元格


    创建 DAX 公式时，考虑数据类型以及计算中可能发生的任何转换非常重要。如果不考虑这些因素，你可能会遇到公式错误或意外结果。模型中支持的数据类型有：整数、小数、货币、布尔值、文本和日期。DAX
    还有一种表数据类型，它在许多函数中使用，这些函数将表作为输入值并返回一个表。


    当你尝试将数值数据类型与文本数据类型相加时，会发生隐式转换。如果 DAX 可以将文本转换为数值，它会以数字形式相加；如果不能，你将收到错误。另一方面，如果你尝试将数值数据类型与文本数据类型连接，DAX
    会将数值数据类型隐式转换为文本。虽然大多数时候隐式转换会给你想要的结果，但这会带来性能成本，应尽可能避免。例如，如果你从文本文件导入数据，并且列被设置为文本数据类型，但你知道它实际上是数值，你应该更改模型中的数据类型。


    在 DAX 中创建计算时，你需要引用表和列。如果表名不包含空格，你可以直接按名称引用。如果表名包含空格，则需要将其括在单引号中。列和度量值则括在方括号中。如果你在公式中仅列出列名，则假定该列存在于同一表中。如果引用另一表中的列，则需要使用完全限定名称，即表名后跟列名。以下代码演示了语法：


    ```

    =[SalesAmount] - [TotalCost]

    =Sales[SalesAmount] - Sales[TotalCost]

    =''Internet Sales''[SalesAmount] - ''Internet Sales''[TotalCost]

    ```


    以下是使用 DAX 时需要牢记的其他要点：


    *   DAX 公式和表达式不能修改或插入表中的单个值。

    *   你不能使用 DAX 创建计算行。你只能创建计算列和度量值。

    *   在定义计算列时，你可以将函数嵌套到任意层级。


    在创建计算时，首先要了解支持哪些运算符以及使用它们的语法。在下一节中，你将研究各种 DAX 运算符。


    实现 DAX 运算符


    DAX 包含一套强大的运算符，包括算术、比较、逻辑和文本连接。大多数运算符你都应该很熟悉，并列举在表 4-1 中。


    表 4-1. DAX 运算符


    | 类别 | 符号 | 用途 |

    | --- | --- | --- |

    | 算术运算符 |

    |   | `+` | 加法 |

    |   | `-` | 减法 |

    |   | `*` | 乘法 |

    |   | `/` | 除法 |

    |   | `^` | 乘方 |

    | 比较运算符 |

    |   | `=` | 等于 |

    |   | `>` | 大于 |

    |   | `<` | 小于 |

    |   | `>=` | 大于或等于 |

    |   | `<=` | 小于或等于 |

    |   | `<>` | 不等于 |

    | 文本连接运算符 |

    |   | `&` | 连接 |

    |   |   | 逻辑运算符 |

    |   | `&&` | 与 |

    |   | `&#124;&#124;` | 或 |

