    \ Excel.\n\n![9781430264453_Fig06-13.jpg](Images/9781430264453_Fig06-13.jpg)\n\
    \n[Figure 6-13](#9781430264453_Ch06.xhtml#_Fig13). The current Consoto data model\n\
    \n3.  To create the `Date` table in Excel, switch to sheet 3. Select the first\
    \ cell and enter a column name of **DateKey**. In the second cell of the column\
