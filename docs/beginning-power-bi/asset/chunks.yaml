    Summary


    A good Power Pivot model tuned for use by Power View will make the difference
    between a great user experience and an extremely exasperating one. This chapter
    showed you how to optimize a Power Pivot model so that it facilitates better report
    creation in Power View. You saw how to set Table Behavior properties and column
    properties and how these settings affect the Power View experience. You also became
    familiar with creating cards and tables in Power View and how to filter and sort
    the tables. The next chapter delves deeper into the features of the Power View
    report designer. It shows how to create the fundamental visualization types along
    with the interaction features built into these visualizations. Cross view filtering,
    drill-down features, and slicers are discussed and demonstrated.


    CHAPTER 9


    ![image](Images/frontdot.jpg)


    Creating Standard Visualizations with Power View


    In the last chapter you saw how important it is to create a Power Pivot model
    that works well with Power View. In this chapter you will investigate some of
    the standard visualizations used to create reports and dashboards. You will become
    familiar with the common features of the Power View designer. You will build standard
    visualizations such as column, bar, and pie charts. In addition, you will look
    at using a scatter chart and how to turn it into a bubble chart with a play axis.
    The final visualization you will investigate is how to use maps to analyze data
    geographically.


    After completing this chapter you will be able to


    *   Create tables and matrices.

    *   Construct bar, column, and pie charts.

    *   Build line and scatter charts.

    *   Create map-based visualizations.


    ![Image](Images/sq.jpg) **Note**  For copies of color figures, go to Source Code/Downloads
    at `http://www.apress.com/9781430264453`.


    Creating Tables and Matrices


    As you learned in the last chapter, all visualizations in Power View start off
    as a table and are then converted to another type of visualization. Although it
    is one of the most basic types of data visualization, a table is still one of
    the most useful ways to look at your data. This is especially true if you need
    to look up detailed information. [Figure 9-1](#9781430264453_Ch09.xhtml#Fig1)
    shows a table displaying customer contact information.


    ![9781430264453_Fig09-01.jpg](Images/9781430264453_Fig09-01.jpg)


    [Figure 9-1](#9781430264453_Ch09.xhtml#_Fig1). Customer contact information


    When you combine a table with the automatic filtering you get with Power View,
    this becomes a great way to look up customers based on their demographic data.
    When you select the table in the view, click on the Table tab in the Filters area
    (see [Figure 9-2](#9781430264453_Ch09.xhtml#Fig2)). The fields in the table will
    show up automatically in the table filter list. To add a field to the filter list
    that you want to filter on but do not want to show up in the table, just drag
    the field from the Power View Field List to the Filters area.


    ![9781430264453_Fig09-02.jpg](Images/9781430264453_Fig09-02.jpg)


    [Figure 9-2](#9781430264453_Ch09.xhtml#_Fig2). Filtering a table


    Another way you can implement filtering for the table is using slicers. To create
    a slicer, first create a one-column table using the field you want to slice by.
    Select the table on the view surface and, in the Design tab, click on the Slicer
    button (see [Figure 9-3](#9781430264453_Ch09.xhtml#Fig3)).


    ![9781430264453_Fig09-03.jpg](Images/9781430264453_Fig09-03.jpg)


    [Figure 9-3](#9781430264453_Ch09.xhtml#_Fig3). Creating a slicer


    Slicers will filter all data on the view—even other slicers. [Figure 9-4](#9781430264453_Ch09.xhtml#Fig4)
    shows how the selection in a Country slicer limits what is shown in the StateProvince
    slicer.


    ![9781430264453_Fig09-04.jpg](Images/9781430264453_Fig09-04.jpg)


    [Figure 9-4](#9781430264453_Ch09.xhtml#_Fig4). Filtering with slicers


    A matrix is similar to a table in that it contains rows and columns, but instead
    of showing detail level records, it aggregates data up by the fields displayed
    in the row and column headers. When you create a pivot table in Excel it is essentially
    a matrix. If the matrix contains a hierarchy, you can drill up and down through
    the hierarchy. To create a matrix, start with a table and then convert it to a
    matrix. [Figure 9-5](#9781430264453_Ch09.xhtml#Fig5) shows a table created to
    show sales profit for the different types of resellers for each month.


    ![9781430264453_Fig09-05.jpg](Images/9781430264453_Fig09-05.jpg)


    [Figure 9-5](#9781430264453_Ch09.xhtml#_Fig5). Table showing reseller sales by
    type and month'
