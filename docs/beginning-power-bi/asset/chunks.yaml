    在绩效仪表板中常用的一种度量值是*关键绩效指标（KPI）*。KPI 用于以可视化格式显示绩效和趋势。在下一节中，你将研究如何在 Power Pivot 模型中创建
    KPI。


    ## 创建 KPI


    KPI 是许多仪表板的基本组成部分，并提供了一种快速查看趋势和发现需要进一步分析领域的绝佳方式。KPI 的基础值基于某个度量值；例如，你可以为当前销售额创建一个
    KPI。然后，将基础值与目标值进行比较。目标值可以是另一个度量值，例如去年的销售额，或者一个绝对值，比如目标销售费用比率。状态阈值界定了哪些范围被视为良好、一般和较差。这些阈值随后用于确定
    KPI 的视觉组件（例如，绿色、黄色、红色）。图 5-18 显示了当前销售额与前期销售额进行比较的 KPI。


    ![9781430264453_Fig05-18.jpg](img/9781430264453_Fig05-18.jpg)


    图 5-18. 比较当前销售额与前期销售额的销售 KPI


    要创建一个 KPI，首先创建它所基于的基础度量值。例如，生产部门会跟踪报废部件数量，因此你可以基于报废部件数量的总和来创建一个 KPI：


    ```

    SumScrappedQty:=SUM([ScrappedQty])

    ```


    你可以将其与已处理的部件数量进行比较：


    ```

    SumOrderQuantity:=SUM([OrderQty])

    ```


    创建这些度量值后，在 Power Pivot 模型设计器中右键单击基础度量值。在上下文菜单中，选择“创建 KPI”，这将启动 KPI 设计窗口（参见图 5-19）。


    ![9781430264453_Fig05-19.jpg](img/9781430264453_Fig05-19.jpg)


    图 5-19. KPI 设计窗口


    然后，你将目标设置为`SumOrderQuantity`度量值，并定义状态阈值。样式图标用于显示 KPI 的状态。创建完 KPI 后，你可以在 Excel
    的数据透视表中使用它（参见图 5-20）。


    ![9781430264453_Fig05-20.jpg](img/9781430264453_Fig05-20.jpg)


    图 5-20. 在数据透视表中查看 KPI


