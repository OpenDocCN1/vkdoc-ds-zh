    ![9781430264453_Fig02-15.jpg](Images/9781430264453_Fig02-15.jpg)


    [Figure 2-15](#9781430264453_Ch02.xhtml#_Fig15). Running the query and viewing
    the results


    Once you are satisfied with the query, selecting the OK button returns you to
    the previous screen with the query text entered. You can modify the query in this
