- fmt: '

    # Power Pivot 的核心技术


    `Power Pivot`背后的特殊技术是`xVelocity`内存分析引擎（没错，这就是它的名字！）。这使得`Power Pivot`能够对大量数据提供快速性能。其关键之一在于它使用列式数据库来存储数据。传统的基于行的数据存储将一行中的所有数据存储在一起，并且能够高效地基于行键检索和更新数据，例如，基于订单
    ID 更新或检索订单。这对于订单录入系统来说非常出色，但在对历史订单进行分析时（例如，你想查看过去一年的趋势以确定产品的销售情况）就不那么理想了。基于行的存储还会因为为每一行重复存储值而占用更多空间；如果你有大量客户，像
    John 或 Smith 这样的常见名字会被重复存储多次。列式数据库仅为每一列存储不同的值，然后将行存储为一组指向列值的指针。这种内置的索引节省了大量空间，并且当与`xVelocity`引擎内置的数据压缩技术结合使用时，可以实现显著的优化。这也意味着对列值的数据聚合（例如典型数据分析中使用的那些）速度极快。


    `xVelocity`引擎提供的另一个好处是内存分析。与查询数据相关的大多数处理瓶颈发生在从磁盘读取或写入数据时。借助内存分析，数据被加载到计算机的 RAM
    中，然后进行查询。这导致处理时间大大加快，并限制了在磁盘上存储预聚合值的需求。当你从 32 位操作系统和应用程序迁移到如今已成为常态的 64 位操作系统和应用程序时，这一优势尤为明显。


    除了`xVelocity`引擎提供的好处之外，另一个值得一提的好处是`Power Pivot`模型的表格结构。该模型由表和表关系组成。这种表格模型对大多数业务分析师和数据库开发者来说更为熟悉。传统的
    OLAP 数据库（如`SSAS`（`SQL Server Analysis Server`））将数据模型呈现为三维立方体结构，这种结构更难处理，并且需要使用复杂的查询语言`MDX`（多维表达式）。我发现，在大多数情况下（并非所有情况），使用表格模型和`DAX`比使用
    OLAP 立方体和`MDX`更容易。


    ## 启用 Excel 的 Power Pivot


    `Power Pivot`是 Excel 的一个免费插件，可在`Office Professional Plus`和`Office 365 Professional
    Plus`版本中使用。如果你使用的是 Excel 2010，则需要从 Microsoft Office 网站下载并安装该插件。如果你使用的是 Excel 2013（本书介绍的版本），该插件已安装，你只需启用它。要检查你所安装的版本，请选择
    Excel 中的“文件”菜单，然后选择“账户”选项卡，如图 [1-1](#9781430264453_Ch01.xhtml#Fig1) 所示。


    ![9781430264453_Fig01-01.jpg](Images/9781430264453_Fig01-01.jpg)


    [Figure 1-1](#9781430264453_Ch01.xhtml#_Fig1). 检查 Excel 版本


    在 Excel 的“账户”选项卡上，单击“关于 Excel”按钮。你将看到一个显示版本详细信息的屏幕，如图 [1-2](#9781430264453_Ch01.xhtml#Fig2)
    所示。注意版本号和版本。它应该是专业增强版，并且最好是 64 位版本。32 位版本对于较小的数据集也能正常工作，但要获得`Power Pivot`的最佳性能和体验，你应该在配备约
    8 GB RAM 的 64 位 Windows 系统上运行 64 位版本。


    ![9781430264453_Fig01-02.jpg](Images/9781430264453_Fig01-02.jpg)


    [Figure 1-2](#9781430264453_Ch01.xhtml#_Fig2). 检查 Excel 版本和版本号


    一旦确定你使用的是正确的版本，你可以通过进入“文件”菜单并选择“选项”选项卡来启用`Power Pivot`插件。在“Excel 选项”窗口中，选择“加载项”选项卡。在“管理”下拉菜单中选择“COM
    加载项”，然后单击“转到”按钮（见图 [1-3](#9781430264453_Ch01.xhtml#Fig3)）。


    ![9781430264453_Fig01-03.jpg](Images/9781430264453_Fig01-03.jpg)


    [Figure 1-3](#9781430264453_Ch01.xhtml#_Fig3). 管理 COM 加载项


    你将看到“COM 加载项”窗口（见图 [1-4](#9781430264453_Ch01.xhtml#Fig4)）。选择 `Microsoft Office
    PowerPivot for Excel 2013`，然后单击“确定”。


    ![9781430264453_Fig01-04.jpg](Images/9781430264453_Fig01-04.jpg)


    [Figure 1-4](#9781430264453_Ch01.xhtml#_Fig4). 选择 Power Pivot 插件


    现在你已经为 Excel 启用了`Power Pivot`插件，是时候探索数据模型管理器了。


    ## 探索数据模型管理器界面


    一旦你启用了`Power Pivot`，你应该会在 Excel 中看到一个新的“Power Pivot”选项卡（见图 [1-5](#9781430264453_Ch01.xhtml#Fig5)）。如果你单击“管理”按钮，它将启动数据模型管理界面。


    ![9781430264453_Fig01-05.jpg](Images/9781430264453_Fig01-05.jpg)


    [Figure 1-5](#9781430264453_Ch01.xhtml#_Fig5). 启动数据模型管理器


    当数据模型管理器启动时，你将拥有两个独立但相互连接的界面。你可以在正常的 Excel 界面和数据模型管理界面之间来回切换。这对于新的`Power Pivot`用户来说可能会感到困惑。请记住，数据模型管理器（[图
    1-6](#9781430264453_Ch01.xhtml#Fig6)）是你定义模型的地方，包括表、表关系、度量值、计算列和层次结构。Excel 界面（[图
    1-7](#9781430264453_Ch01.xhtml#Fig7)）是你使用数据透视表和数据透视图分析数据的地方。


    ![9781430264453_Fig01-06.jpg](Images/9781430264453_Fig01-06.jpg)


    [Figure 1-6](#9781430264453_Ch01.xhtml#_Fig6). 数据模型管理器界面


    ![9781430264453_Fig01-07.jpg](Images/9781430264453_Fig01-07.jpg)


    [Figure 1-7](#9781430264453_Ch01.xhtml#_Fig7). Excel 工作簿界面


    在数据模型管理器中有两种数据模型视图：数据视图和关系图视图。首次打开时，它处于数据视图模式。在数据视图模式下，你可以看到模型中包含的数据。模型中的每个表在视图中都有自己的选项卡。表可以包含从数据源检索的数据列，也可以包含使用`DAX`计算的列。计算列看起来比其他列稍暗。
    [图 1-8](#9781430264453_Ch01.xhtml#Fig8) 显示了“全名”列，该列是通过连接“名字”和“姓氏”列得到的。


    ![9781430264453_Fig01-08.jpg](Images/9781430264453_Fig01-08.jpg)


    [Figure 1-8](#9781430264453_Ch01.xhtml#_Fig8). 数据模型管理器中的计算列


    每个选项卡在列数据下方还包含一个网格区域。网格区域是你在模型中定义度量值的地方。度量值通常包含某种聚合函数。例如，你可能希望查看按月或按产品汇总的销售额。
    [图 1-9](#9781430264453_Ch01.xhtml#Fig9) 显示了与“Internet 销售”表关联的一些度量值。


    ![9781430264453_Fig01-09.jpg](Images/9781430264453_Fig01-09.jpg)


    [Figure 1-9](#9781430264453_Ch01.xhtml#_Fig9). 数据模型管理器中的度量值网格区域

