- fmt: '现在让我们看一个更复杂的示例。在本示例中，您希望确定特定时间段内最佳单笔订单客户。最终的数据透视表如[图5-15](#9781430264453_Ch05.xhtml#Fig15)所示。


    ![9781430264453_Fig05-15.jpg](Images/9781430264453_Fig05-15.jpg)


    [图5-15](#9781430264453_Ch05.xhtml#_Fig15) 查找最佳单笔订单客户


    第一步是查找在该时间段内消费金额较高的客户。要计算客户销售额，请使用以下度量值：


    ```

    SumSales:=SUM([SalesAmount])

    ```


    接下来，您只想关注大额消费者，因此过滤掉较小的值：


    ```

    LargeSales:=IF([SumSales]>=30000,[SumSales],Blank())

    ```


    下一步是查找客户的订单金额并取最大值：


    ```

    Top Sale:=MAXX(VALUES(Date[DateKey]),[SumSales])

    ```


    由于您只想列出顶级客户的最大销售额，可以添加一个`IF`语句来确保该客户有大额销售：


    ```

    Top Sale:=

    IF(ISBLANK([LargeSales]),Blank(),MAXX(VALUES(Date[DateKey]),[SumSales]))

    ```


    作为最后一个示例，假设您正在与人力资源部门合作，希望创建一个数据透视表，使他们能够列出特定日期各部门的员工数量。有一个`EmployeeDepartmentHistory`表，其中列出了员工、部门、开始日期和结束日期。还有一个`Dates`表，其每一行对应部门历史记录中的每个日期。[图5-16](#9781430264453_Ch05.xhtml#Fig16)显示了包含每个部门员工数量的数据透视表。


    ![9781430264453_Fig05-16.jpg](Images/9781430264453_Fig05-16.jpg)


    [图5-16](#9781430264453_Ch05.xhtml#_Fig16) 截至选定日期的员工数量


    `As of Date`用作筛选器，`Emp Cnt`是度量值。当`As of Date`更改时，`Emp Cnt`会重新计算以显示该日期下的员工数量。[图5-17](#9781430264453_Ch05.xhtml#Fig17)显示了日期更改后的新数量。


    ![9781430264453_Fig05-17.jpg](Images/9781430264453_Fig05-17.jpg)


    [图5-17](#9781430264453_Ch05.xhtml#_Fig17) 更改`As of Date`


    创建`Emp Cnt`的第一步是使用`COUNT`函数，因为您需要对表中的`EmployeeID`进行计数：


    ```

    Emp Cnt:=COUNT(EmpDepHist[BusinessEntityID])

    ```


    由于需要将表筛选为仅包含选定日期时的在职员工，因此需要将其改为`COUNTX`函数：


    ```

    Emp Cnt:=COUNTX(EmpDepHist, EmpDepHist[BusinessEntityID])

    ```


    若要筛选`EmpDepHist`表，请使用`FILTER`函数：


    ```

    FILTER(<table>,<filter>)

    ```


    `FILTER`函数是一个计算结果为`TRUE`的布尔表达式。在这种情况下，需要使员工在部门中的开始日期小于或等于`As of Date`：


    ```

    EmpDepHist[StartDate]<=Dates[As of Date]

    ```


    现在，由于数据透视表用户可以选择多个日期，并且您希望确保只与单个日期进行比较，因此可以使用`MAX`函数：


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    ```


    您还需要确保员工离开部门的日期大于`As of Date`：


    ```

    EmpDepHist[EndDate] > Max(Dates[As of Date]

    ```


    如果员工当前仍在部门中，则`EndDate`将为空：


    ```

    ISBLANK(EmpDepHist[EndDate])

    ```


    将这些筛选条件组合起来，得到以下筛选条件：


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))

    ```


    最终的`FILTER`函数变为：


    ```

    FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date])))

    ```


    最终的员工计数度量值变为：


    ```

    Emp Cnt:=COUNTX(FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))),

    EmpDepHist[BusinessEntityID])

    ```


    如您所见，创建度量值可能相当复杂，但如果将其分解为多个步骤，就会变得非常易于管理。请放心，您使用 DAX 创建度量值的次数越多，它就会变得越直观、越容易。


    在性能仪表板中常用的一种度量值是*关键绩效指标（KPI）*。KPI 用于以可视化格式显示绩效和趋势。在下一节中，您将研究在 Power Pivot 模型中创建
    KPI。


    ## 创建 KPI


    KPI 是许多仪表板的主要组成部分，提供了一种快速查看趋势和发现需要进一步分析领域的绝佳方式。KPI 的基础值基于度量值，例如，您可以为当前销售额创建一个
    KPI。然后将基础值与目标值进行比较。目标值可以是另一个度量值，例如去年的销售额，也可以是绝对数值，例如目标销售费用率。状态阈值定义了哪些范围被视为良好、一般和差。这些阈值随后用于确定
    KPI 的可视化组件（即绿色、黄色、红色）。[图5-18](#9781430264453_Ch05.xhtml#Fig18)显示了与前期销售额相比较的当期销售额
    KPI。


    ![9781430264453_Fig05-18.jpg](Images/9781430264453_Fig05-18.jpg)


    [图5-18](#9781430264453_Ch05.xhtml#_Fig18) 比较当期与前期销售额的销售 KPI


    要创建 KPI，请首先创建其依赖的基础度量值。例如，生产部门跟踪报废部件，因此您可以将 KPI 基于报废部件数量的总和：


    ```

    SumScrappedQty:=SUM([ScrappedQty])

    ```


    您可以将其与已处理的部件数量进行比较：


    ```

    SumOrderQuantity:=SUM([OrderQty])

    ```


    创建度量值后，在 Power Pivot 模型设计器中右键单击基础度量值。在上下文菜单中选择“创建 KPI”，这将启动 KPI 设计窗口（参见[图5-19](#9781430264453_Ch05.xhtml#Fig19)）。


    ![9781430264453_Fig05-19.jpg](Images/9781430264453_Fig05-19.jpg)


    [图5-19](#9781430264453_Ch05.xhtml#_Fig19) KPI 设计窗口


    然后将目标设置为`SumOrderQuantity`度量值，并定义状态阈值。样式图标用于显示 KPI 的状态。完成 KPI 创建后，您可以在 Excel 的数据透视表中使用它（参见[图5-20](#9781430264453_Ch05.xhtml#Fig20)）。


    ![9781430264453_Fig05-20.jpg](Images/9781430264453_Fig05-20.jpg)


    [图5-20](#9781430264453_Ch05.xhtml#_Fig20) 在数据透视表中查看 KPI


    现在您已经了解了如何使用 DAX 创建度量值和更改数据上下文，是时候在以下实验中动手创建一些度量值了。


    ## 动手实验——在 Power Pivot 中创建度量值


    在以下实验中，您将：


    *   创建聚合度量值。

    *   更改度量值中的数据上下文。

    *   在度量值中使用非活动关系。

    *   创建复杂的度量值。

    *   创建 KPI。


    1.  在“实验启动器”文件夹中，打开`LabChapter5.xlsx`文件。该文件包含一个由销售数据、产品数据和商店数据组成的数据模型。

    2.  使用关系图视图在 Power Pivot 窗口中查看模型（[图5-21](#9781430264453_Ch05.xhtml#Fig21)）。


    ![9781430264453_Fig05-21.jpg](Images/9781430264453_Fig05-21.jpg)


    [图5-21](#9781430264453_Ch05.xhtml#_Fig21) Power Pivot 模型


    3.  在 Power Pivot 窗口中切换到数据视图，并选择`Sales`表。

    4.  选择`SalesAmount`列。在“自动求和”下拉菜单中选择“求和”（参见[图5-22](#9781430264453_Ch05.xhtml#Fig22)）。您应该会看到在该列下方添加了一个度量值。将该度量值重命名为`Sum
    Sales`。


    ![9781430264453_Fig05-22.jpg](Images/9781430264453_Fig05-22.jpg)


    [图5-22](#9781430264453_Ch05.xhtml#_Fig22) 选择“自动求和”下拉菜单'
  raw: 'Now let’s look at a more complex example. In this example you want to determine
    the best single order customers in a particular time period. The final pivot table
    is shown in [Figure 5-15](#9781430264453_Ch05.xhtml#Fig15).


    ![9781430264453_Fig05-15.jpg](Images/9781430264453_Fig05-15.jpg)


    [Figure 5-15](#9781430264453_Ch05.xhtml#_Fig15). Finding best single order customers


    The first step is to find the customers who spent a lot of money during the time
    period. To calculate customer sales, you use the following measure:


    ```

    SumSales:=SUM([SalesAmount])

    ```


    Next you want to only look at large spenders so you can filter out smaller values:


    ```

    LargeSales:=IF([SumSales]>=30000,[SumSales],Blank())

    ```


    The next step is to find the order amounts for the customer and take the maximum
    value:


    ```

    Top Sale:=MAXX(VALUES(Date[DateKey]),[SumSales])

    ```


    Since you only want to list the top sales for top customers, you can add an `IF`
    statement to make sure the customer has large sales:


    ```

    Top Sale:=

    IF(ISBLANK([LargeSales]),Blank(),MAXX(VALUES(Date[DateKey]),[SumSales]))

    ```


    As a final example, say you are working with the HR department and you want to
    create a pivot table that will allow them to list employee counts for the departments
    at a particular date. There is an EmployeeDepartmentHistory table that lists employee,
    department, start date, and end date. There is also a Dates table that has a row
    for every date spanning the department histories. [Figure 5-16](#9781430264453_Ch05.xhtml#Fig16)
    shows the pivot table containing employee counts for each department.


    ![9781430264453_Fig05-16.jpg](Images/9781430264453_Fig05-16.jpg)


    [Figure 5-16](#9781430264453_Ch05.xhtml#_Fig16). Employee counts as of the selected
    date


    The As of Date is used as a filter and the Emp Cnt is the measure. When the As
    of Date is changed the Emp Cnt it is recalculated to show the employee counts
    on that date. [Figure 5-17](#9781430264453_Ch05.xhtml#Fig17) shows new counts
    after the date is changed.


    ![9781430264453_Fig05-17.jpg](Images/9781430264453_Fig05-17.jpg)


    [Figure 5-17](#9781430264453_Ch05.xhtml#_Fig17). Changing the As of Date


    The first step to creating the Emp Cnt is to use the `COUNT` function because
    you want to count the EmployeeID in the table:


    ```

    Emp Cnt:=COUNT(EmpDepHist[BusinessEntityID])

    ```


    Since you need to filter the table to only active employees at the date chosen,
    you need to change this to the `COUNTX` function:


    ```

    Emp Cnt:=COUNTX(EmpDepHist, EmpDepHist[BusinessEntityID])

    ```


    To filter the EmpDepHist table you use the `FILTER` function:


    ```

    FILTER(<table>,<filter>)

    ```


    The `FILTER` function is a Boolean expression that evaluates to TRUE. In this
    case you need to have the date that the employee started in the department less
    than or equal to the As of Date:


    ```

    EmpDepHist[StartDate]<=Dates[As of Date]

    ```


    Now, since the pivot table user can select more than one date and you want to
    make sure you only compare it to a single date, you can use the `MAX` function:


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    ```


    You also want to make sure the date the employee left the department is greater
    than the As of Date:


    ```

    EmpDepHist[EndDate] > Max(Dates[As of Date]

    ```


    If the employee is currently in the department the EndDate will be blank:


    ```

    ISBLANK(EmpDepHist[EndDate])

    ```


    When you combine these filter conditions, you get the following filter condition:


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))

    ```


    The final `FILTER` function then becomes


    ```

    FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date])))

    ```


    and the final employee count measure becomes


    ```

    Emp Cnt:=COUNTX(FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))),

    EmpDepHist[BusinessEntityID])

    ```


    As you can see, creating a measure can be quite complex, but if you break it up
    into steps, it becomes very manageable. Rest assured; the more you work with DAX
    and creating measures, the more intuitive and easier it becomes.


    One type of measure commonly used in performance dashboards is the *Key Performance
    Indicator (KPI**)*. A KPI is used to show performance and trends in a visual format.
    In the next section you will investigate creating KPIs in the Power Pivot model.


    Creating KPIs


    KPIs are a staple of many dashboards and provide a great way to quickly see trends
    and spot areas that need further analysis. The base value of a KPI is based on
    a measure; for example, you can create a KPI for current sales. The base value
    is then compared to a target value. The target value can be another measure; for
    example, last year’s sales or an absolute numeric value like a target sales-to-expense
    ratio. The status thresholds establish what range is considered good, neutral,
    and bad. These thresholds are then used to determine the visual component of the
    KPI (i.e., green, yellow, red). [Figure 5-18](#9781430264453_Ch05.xhtml#Fig18)
    shows KPIs for current sales compared to the previous sales.


    ![9781430264453_Fig05-18.jpg](Images/9781430264453_Fig05-18.jpg)


    [Figure 5-18](#9781430264453_Ch05.xhtml#_Fig18). Sales KPI comparing current to
    previous sales


    To create a KPI, first create the base measure it will be based on. For example,
    production keeps track of scrapped parts, so you can base a KPI on the sum of
    the number of scrapped parts:


    ```

    SumScrappedQty:=SUM([ScrappedQty])

    ```


    You can compare this to the number of parts processed:


    ```

    SumOrderQuantity:=SUM([OrderQty])

    ```


    After creating the measures, right click on the base measure in the Power Pivot
    model designer. In the context menu, select Create KPI, which launches the KPI
    design window (see [Figure 5-19](#9781430264453_Ch05.xhtml#Fig19)).


    ![9781430264453_Fig05-19.jpg](Images/9781430264453_Fig05-19.jpg)


    [Figure 5-19](#9781430264453_Ch05.xhtml#_Fig19). The KPI design window


    You then set the target to the SumOrderQuantity measure and define the status
    thresholds. The style icons are used to show the status of the KPIs. When you
    are done creating the KPI you can use it in a pivot table in Excel (see [Figure
    5-20](#9781430264453_Ch05.xhtml#Fig20)).


    ![9781430264453_Fig05-20.jpg](Images/9781430264453_Fig05-20.jpg)


    [Figure 5-20](#9781430264453_Ch05.xhtml#_Fig20). Viewing a KPI in a pivot table


    Now that you have seen how to create measures and alter the data context using
    DAX, it is time to get your hands dirty and create some measures in the following
    lab.


    HANDS-ON LAB—CREATING MEASURES IN POWER PIVOT


    In the following lab you will


    *   Create aggregate measures.

    *   Alter the data context in a measure.

    *   Use a non-active relationship in a measure.

    *   Create a complex measure.

    *   Create a KPI.


    1.  In the Lab Starters folder, open the LabChapter5.xlsx file. This file contains
    a data model consisting of sales data, product data, and store data.

    2.  View the model in the Power Pivot window using the diagram view ([Figure 5-21](#9781430264453_Ch05.xhtml#Fig21)).


    ![9781430264453_Fig05-21.jpg](Images/9781430264453_Fig05-21.jpg)


    [Figure 5-21](#9781430264453_Ch05.xhtml#_Fig21). The Power Pivot model


    3.  Switch to data view in the Power Pivot window and select the Sales table.

    4.  Select the SalesAmount column. In the AutoSum drop-down select Sum (see [Figure
    5-22](#9781430264453_Ch05.xhtml#Fig22)). You should see a measure added below
    the column. Rename the measure to Sum Sales.


    ![9781430264453_Fig05-22.jpg](Images/9781430264453_Fig05-22.jpg)


    [Figure 5-22](#9781430264453_Ch05.xhtml#_Fig22). Select the AutoSum drop-down'
  trans: '

    现在让我们看一个更复杂的示例。在本示例中，您希望确定特定时间段内最佳单笔订单客户。最终的数据透视表如图 5-15 所示。


    ![9781430264453_Fig05-15.jpg](img/9781430264453_Fig05-15.jpg)


    图 5-15 查找最佳单笔订单客户


    第一步是查找在该时间段内消费金额较高的客户。要计算客户销售额，请使用以下度量值：


    ```

    SumSales:=SUM([SalesAmount])

    ```


    接下来，您只想关注大额消费者，因此过滤掉较小的值：


    ```

    LargeSales:=IF([SumSales]>=30000,[SumSales],Blank())

    ```


    下一步是查找客户的订单金额并取最大值：


    ```

    Top Sale:=MAXX(VALUES(Date[DateKey]),[SumSales])

    ```


    由于您只想列出顶级客户的最大销售额，可以添加一个`IF`语句来确保该客户有大额销售：


    ```

    Top Sale:=

    IF(ISBLANK([LargeSales]),Blank(),MAXX(VALUES(Date[DateKey]),[SumSales]))

    ```


    作为最后一个示例，假设您正在与人力资源部门合作，希望创建一个数据透视表，使他们能够列出特定日期各部门的员工数量。有一个`EmployeeDepartmentHistory`表，其中列出了员工、部门、开始日期和结束日期。还有一个`Dates`表，其每一行对应部门历史记录中的每个日期。图
    5-16 显示了包含每个部门员工数量的数据透视表。


    ![9781430264453_Fig05-16.jpg](img/9781430264453_Fig05-16.jpg)


    图 5-16 截至选定日期的员工数量


    `As of Date`用作筛选器，`Emp Cnt`是度量值。当`As of Date`更改时，`Emp Cnt`会重新计算以显示该日期下的员工数量。图
    5-17 显示了日期更改后的新数量。


    ![9781430264453_Fig05-17.jpg](img/9781430264453_Fig05-17.jpg)


    图 5-17 更改`As of Date`


    创建`Emp Cnt`的第一步是使用`COUNT`函数，因为您需要对表中的`EmployeeID`进行计数：


    ```

    Emp Cnt:=COUNT(EmpDepHist[BusinessEntityID])

    ```


    由于需要将表筛选为仅包含选定日期时的在职员工，因此需要将其改为`COUNTX`函数：


    ```

    Emp Cnt:=COUNTX(EmpDepHist, EmpDepHist[BusinessEntityID])

    ```


    若要筛选`EmpDepHist`表，请使用`FILTER`函数：


    ```

    FILTER(<table>,<filter>)

    ```


    `FILTER`函数是一个计算结果为`TRUE`的布尔表达式。在这种情况下，需要使员工在部门中的开始日期小于或等于`As of Date`：


    ```

    EmpDepHist[StartDate]<=Dates[As of Date]

    ```


    现在，由于数据透视表用户可以选择多个日期，并且您希望确保只与单个日期进行比较，因此可以使用`MAX`函数：


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    ```


    您还需要确保员工离开部门的日期大于`As of Date`：


    ```

    EmpDepHist[EndDate] > Max(Dates[As of Date]

    ```


    如果员工当前仍在部门中，则`EndDate`将为空：


    ```

    ISBLANK(EmpDepHist[EndDate])

    ```


    将这些筛选条件组合起来，得到以下筛选条件：


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))

    ```


    最终的`FILTER`函数变为：


    ```

    FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date])))

    ```


    最终的员工计数度量值变为：


    ```

    Emp Cnt:=COUNTX(FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))),

    EmpDepHist[BusinessEntityID])

    ```


    如您所见，创建度量值可能相当复杂，但如果将其分解为多个步骤，就会变得非常易于管理。请放心，您使用 DAX 创建度量值的次数越多，它就会变得越直观、越容易。


    在性能仪表板中常用的一种度量值是*关键绩效指标（KPI）*。KPI 用于以可视化格式显示绩效和趋势。在下一节中，您将研究在 Power Pivot 模型中创建
    KPI。


    ## 创建 KPI


    KPI 是许多仪表板的主要组成部分，提供了一种快速查看趋势和发现需要进一步分析领域的绝佳方式。KPI 的基础值基于度量值，例如，您可以为当前销售额创建一个
    KPI。然后将基础值与目标值进行比较。目标值可以是另一个度量值，例如去年的销售额，也可以是绝对数值，例如目标销售费用率。状态阈值定义了哪些范围被视为良好、一般和差。这些阈值随后用于确定
    KPI 的可视化组件（即绿色、黄色、红色）。图 5-18 显示了与前期销售额相比较的当期销售额 KPI。


    ![9781430264453_Fig05-18.jpg](img/9781430264453_Fig05-18.jpg)


    图 5-18 比较当期与前期销售额的销售 KPI


    要创建 KPI，请首先创建其依赖的基础度量值。例如，生产部门跟踪报废部件，因此您可以将 KPI 基于报废部件数量的总和：


    ```

    SumScrappedQty:=SUM([ScrappedQty])

    ```


    您可以将其与已处理的部件数量进行比较：


    ```

    SumOrderQuantity:=SUM([OrderQty])

    ```


    创建度量值后，在 Power Pivot 模型设计器中右键单击基础度量值。在上下文菜单中选择“创建 KPI”，这将启动 KPI 设计窗口（参见图 5-19）。


    ![9781430264453_Fig05-19.jpg](img/9781430264453_Fig05-19.jpg)


    图 5-19 KPI 设计窗口


    然后将目标设置为`SumOrderQuantity`度量值，并定义状态阈值。样式图标用于显示 KPI 的状态。完成 KPI 创建后，您可以在 Excel 的数据透视表中使用它（参见图
    5-20）。


    ![9781430264453_Fig05-20.jpg](img/9781430264453_Fig05-20.jpg)


    图 5-20 在数据透视表中查看 KPI


    现在您已经了解了如何使用 DAX 创建度量值和更改数据上下文，是时候在以下实验中动手创建一些度量值了。


    ## 动手实验——在 Power Pivot 中创建度量值


    在以下实验中，您将：


    *   创建聚合度量值。

