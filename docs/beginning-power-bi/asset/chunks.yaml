    9.  To perform shopping basket analysis on products purchased, select the Shopping
    Basket Worksheet. This contains items purchased at a grocery store. Click anywhere
    on the data table and select the Shopping Basket Analysis tool on the Table Tools
    Analyze tab.

    10.  On the Shopping Basket Analysis window, select the Order ID column for the
