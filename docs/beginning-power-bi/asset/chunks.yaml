    # 在商业智能工具库中，另外两个日益重要的工具是 Power Query 和 Power Map。你通常需要先对原始数据进行某种形式的转换，然后才能将其加载到数据模型中。你可能需要筛选、聚合或清理原始数据。我将向你展示
    Power Query 如何让你在将数据纳入数据模型之前，轻松地转换和精炼数据。在分析数据时，你可能还需要将基于位置的可视化信息整合到地图中。Power Map
    使用微软的必应地图引擎，轻松地将数据整合到交互式地图上。我将向你展示如何使用 Power Map 为你的数据创建有趣的可视化效果。


    我额外加入的一个主题是 Excel 的表分析工具。这些工具允许你运行一些有趣的数据分析，包括分析关键影响因素、识别数据分组以及预测未来趋势。虽然这些工具不属于微软自助式
    BI 工具集的一部分，但我认为它们值得涵盖。它们会让你在分析数据时思考预测分析的价值。


    我坚信学习最重要的一个方面是实践。不跨上自行车，你就学不会骑车；不实际使用 BI 工具，你就学不会如何使用它们。任何成功的培训计划都包含理论与动手活动。因此，我在每一章的末尾都加入了动手实践活动，旨在巩固该章涵盖的概念。我鼓励你认真完成这些活动。这是非常值得付出的努力。


    # 第一部分


