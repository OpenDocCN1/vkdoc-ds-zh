    ![9781430264453_Fig11-08.jpg](img/9781430264453_Fig11-08.jpg)


    图 11-8：管理查询步骤


    清理和转换数据后，你可能需要将来自多个源的数据合并到数据模型的一个表中，或者展开列中包含的数据。


    ## 合并和重塑数据


    有时，你可能需要在将数据加载到模型之前，合并来自多个表和/或源的数据——例如，如果一个表中的代码关联到另一个包含字段完整值的查找表。处理此问题的一种方法是将两个表都导入模型，并在
    Power Pivot 模型中创建表之间的链接。另一种选择是在导入数据之前合并这些表。例如，在前面看到的航班数据中，有一个包含承运商代码的`UniqueCarrier`列。你可以将这些代码与另一个包含承运商代码和承运商名称的
    CSV 文件合并。首先，使用“查询编辑器”为每组数据创建并保存一个查询。对于查找表，你可以取消选中“加载到工作表”和“加载到数据模型”复选框，因为数据将在合并后加载，所以这些暂时不需要。接下来，打开主查询，并在“开始”选项卡上选择“合并”按钮。这将启动“合并”窗口（参见图
    11-9），你可以在其中选择查找查询以及链接数据的列。


    ![9781430264453_Fig11-09.jpg](img/9781430264453_Fig11-09.jpg)


    图 11-9：合并两个查询的数据


    合并查询后，你可以选择要合并的列（参见图 11-10）。合并列后，你可能需要重命名主查询中的列。


    ![9781430264453_Fig11-10.jpg](img/9781430264453_Fig11-10.jpg)


    图 11-10：选择要合并的列


    除了合并来自查找表的数据外，你可能还需要追加来自两个不同源的数据。例如，假设你每年有分别存储在不同源文件或表中的航班数据，并希望将多年的数据合并到同一张表中。在这种情况下，你将创建两个相似的查询，每个查询使用不同的源。首先，在“查询编辑器”中打开其中一个查询，然后在“开始”选项卡上选择“追加查询”按钮。然后，你可以选择另一个查询作为要追加的表（参见图
    11-11）。


    ![9781430264453_Fig11-11.jpg](img/9781430264453_Fig11-11.jpg)


    图 11-11：追加两个查询


    有时，源可能会为你提供一列数据，而你需要将其拆分为多列。例如，你可能需要拆分城市和州，或者名字和姓氏。为此，请在“查询编辑器”中选择该列，然后在“开始”选项卡上选择“拆分列”。你可以按分隔符或按字符数拆分列（参见图
    11-12）。


    ![9781430264453_Fig11-12.jpg](img/9781430264453_Fig11-12.jpg)


    图 11-12：使用分隔符拆分列


    你可能会遇到的另一种情况是，数据源包含的数据不是表格形式，而是矩阵形式，如图 11-13 所示。


    ![9781430264453_Fig11-13.jpg](img/9781430264453_Fig11-13.jpg)


    图 11-13：使用矩阵作为数据源


    为了将此数据导入数据模型，你需要取消透视数据，使其成为表格形式。在“查询编辑器”中，选择需要取消透视的列（参见图 11-14）。


    ![9781430264453_Fig11-14.jpg](img/9781430264453_Fig11-14.jpg)


    图 11-14：选择要取消透视的列

    '
- fmt: '在“主页”选项卡中，选择“逆透视”转换。数据逆透视后，你会得到一个来自原始列标题的“属性”列和一个“值”列（参见[图11-15](#9781430264453_Ch11.xhtml#Fig15)）。在导入数据之前，应重命名这些列。


    ![9781430264453_Fig11-15.jpg](Images/9781430264453_Fig11-15.jpg)


    [图11-15](#9781430264453_Ch11.xhtml#_Fig15) 逆透视转换后生成的行


    当你将数据导入模型时，通常不需要明细级别的数据，而是需要更高层次的聚合值——例如，产品级别的销售额或月度销售额。使用Power Query，可以在导入前轻松地对数据进行分组和聚合。


    ### 分组和聚合数据


    在导入原始数据时，分组和聚合数据是一个常见的需求。例如，你可能需要根据分析需求按月或按销售区域汇总数据。要在查询编辑器中对数据进行聚合和分组，请选择要分组的列，然后在“主页”选项卡中选择“分组依据”转换。此时会弹出“分组依据”窗口（参见[图11-16](#9781430264453_Ch11.xhtml#Fig16)）。


    ![9781430264453_Fig11-16.jpg](Images/9781430264453_Fig11-16.jpg)


    [图11-16](#9781430264453_Ch11.xhtml#_Fig16) 在Power Query中对数据进行分组


    你可以使用标准聚合函数按多列进行分组和聚合多列。[图11-17](#9781430264453_Ch11.xhtml#Fig17)显示了按起飞机场和航空公司分类，并聚合平均和最大出发延误时间的一些结果。


    ![9781430264453_Fig11-17.jpg](Images/9781430264453_Fig11-17.jpg)


    [图11-17](#9781430264453_Ch11.xhtml#_Fig17) 分组和聚合航班数据


    在使用Power Query导入数据时，你可能遇到的最后一个需求是插入计算列。这稍微高级一些，因为你需要编写代码，如下一节所述。


    ### 插入计算列


    到目前为止，你都可以使用Power Query提供的可视化界面来构建和执行查询。然而，在后台，Power Query编辑器会创建一个用于执行查询的文件。这个文件是用一种名为`M`的新语言编写的。如你所见，即使不了解`M`或它的工作原理，你也可以从Power
    Query中获得大量功能。尽管如此，你至少应该知道`M`的存在，并且知道运行查询时实际执行的就是它。如果你导航到查询编辑器的“视图”选项卡，你会看到一个打开“高级编辑器”的选项，它将显示用于构建查询的`M`代码（参见[图11-18](#9781430264453_Ch11.xhtml#Fig18)）。


    ![9781430264453_Fig11-18.jpg](Images/9781430264453_Fig11-18.jpg)


    [图11-18](#9781430264453_Ch11.xhtml#_Fig18) 使用`M`构建查询


    你可以使用高级编辑器直接用`M`编写查询，从而利用可视化界面工具中未公开的一些高级数据处理功能。


    如果要在查询中插入计算列，则需要使用`M`函数。在查询编辑器的“插入”选项卡中，你可以复制列、插入索引列、合并列以及插入自定义列。当你选择“插入自定义列”选项时，会弹出一个“插入自定义列”编辑器，你可以在其中插入用于创建列的`M`函数（参见[图11-19](#9781430264453_Ch11.xhtml#Fig19)）。


    ![9781430264453_Fig11-19.jpg](Images/9781430264453_Fig11-19.jpg)


    [图11-19](#9781430264453_Ch11.xhtml#_Fig19) 使用`M`公式创建列


    [图11-20](#9781430264453_Ch11.xhtml#Fig20)显示了添加自定义列后的查询结果。


    ![9781430264453_Fig11-20.jpg](Images/9781430264453_Fig11-20.jpg)


    [图11-20](#9781430264453_Ch11.xhtml#_Fig20) 显示查询结果


    因此，如果你需要在将数据插入Power Pivot模型之前使用Power Query创建列，则应使用`M`公式。如果在将数据导入Power Pivot模型后创建列，则应使用`DAX`公式。


    现在你已经了解了Power Query的工作原理，是时候动手实践一下，用它来导入数据了。要完成此实验，假定你已安装了最新的Power Query加载项。


    ## 动手实验——使用Power Query导入和整理数据


    在以下实验中，你将：


    *   创建查询以导入数据。

    *   筛选和转换数据。

    *   追加和整理数据。

    *   分组和聚合数据。


    1.  在`LabStarters`文件夹中，打开`LabChapter11.xlsx`文件。此文件包含一个基本的Power Pivot模型，你将使用Power
    Query向其添加数据。

    2.  在Excel中选择“Power Query”选项卡。在“获取外部数据”下，选择“来自文件”，然后选择“来自CSV”选项。导航到`LabStarters`文件夹中的`FlightPerformance_2012_10.csv`文件。你应该会看到查询编辑器窗口显示航班延误数据，如[图11-21](#9781430264453_Ch11.xhtml#Fig21)所示。


    ![9781430264453_Fig11-21.jpg](Images/9781430264453_Fig11-21.jpg)


    [图11-21](#9781430264453_Ch11.xhtml#_Fig21) 显示延误数据的查询编辑器窗口


    3.  在“查询设置”窗格中，将查询重命名为`FlightDelays`，并取消选中“加载到数据模型”。

    4.  在“应用的步骤”列表中，如果查询编辑器未自动添加将第一行设为标题的转换，请手动添加。

    5.  检查各列的类型，查看查询编辑器是否已将`FlightDate`更新为日期数据类型，并将数字类型的列更新为数字数据类型。如果没有，请立即更改。

    6.  删除`UniqueCarrier`、`FlightNum`、`AirTime`、`Flights`和`Distance`列。

    7.  筛选数据，使其仅提取航班起飞延误时间大于15分钟的行。

    8.  选择“应用并关闭”以保存查询。

    9.  对`FlightPerformance_2012_11.csv`文件重复步骤2至8，但这次将查询命名为`FlightDelays2`。

    10. 你现在应该有两个工作簿查询，如[图11-22](#9781430264453_Ch11.xhtml#Fig22)所示。


    ![9781430264453_Fig11-22.jpg](Images/9781430264453_Fig11-22.jpg)


    [图11-22](#9781430264453_Ch11.xhtml#_Fig22) 当前工作簿查询


    11. 双击`FlightDelays`查询，在查询编辑器中将其重新打开。

    12. 在“主页”选项卡的“合并”部分选择“追加查询”选项。将`FlightDelays2`查询追加到`FlightDelays`查询中。

    13. 选择`OriginCityName`列，使用逗号将其拆分为名为`OriginCity`和`OriginState`的两列。对`DestCityName`列执行相同操作。

    14. 将“城市”列中的“West Palm Beach/Palm Beach”替换为“Palm Beach”。

    15. 检查“加载到数据模型”设置，然后点击“应用并关闭”按钮。

    16. 打开Power Pivot模型，验证表是否已加载。

    17. 在Excel中选择“Power Query”选项卡。在“获取外部数据”下，选择“来自文件”，然后选择“来自CSV”选项。导航到`LabStarters`文件夹中的`FlightPerformance_2012_12.csv`文件。

    18. 在“查询设置”窗格中，将查询重命名为`DelaySummary`，并取消选中“加载到数据模型”。

    19. 保留`Carrier`、`Origin`和`DepDelay`列，删除其余列。

    20. 筛选出延误时间小于15分钟的数据。

    21. 按起飞机场和航空公司分组，计算平均延误时间和最大延误时间（参见[图11-23](#9781430264453_Ch11.xhtml#Fig23)）。


    ![9781430264453_Fig11-23.jpg](Images/9781430264453_Fig11-23.jpg)


    [图11-23](#9781430264453_Ch11.xhtml#_Fig23) 按起飞机场和航空公司分组'
  raw: 'On the Home tab, select the Unpivot transform. Once the data is unpivoted,
    you will get an Attribute column from the original column headers and a Value
    column (see [Figure 11-15](#9781430264453_Ch11.xhtml#Fig15)). You should rename
    these columns before importing the data.


    ![9781430264453_Fig11-15.jpg](Images/9781430264453_Fig11-15.jpg)


    [Figure 11-15](#9781430264453_Ch11.xhtml#_Fig15). Resulting rows from the unpivot
    transformation


    As you bring data into the model, you often do not need the detail level data;
    instead, you need an aggregate value at a higher level—for example, product level
    sales or monthly sales. Using Power Query, you can easily group and aggregate
    the data before importing it.


    Grouping and Aggregating Data


    The need to group and aggregate data is a common scenario you may run into when
    you are importing raw data. For example, you may need to roll the data up by month
    or sales territory depending on the analysis you need. To aggregate and group
    the data in the Query Editor, select the column you want to group by and select
    the Group By transform in the Home tab. You are presented with a Group By window
    (see [Figure 11-16](#9781430264453_Ch11.xhtml#Fig16)).


    ![9781430264453_Fig11-16.jpg](Images/9781430264453_Fig11-16.jpg)


    [Figure 11-16](#9781430264453_Ch11.xhtml#_Fig16). Grouping data in Power Query


    You can group by multiple columns and aggregate multiple columns using the standard
    aggregate functions. [Figure 11-17](#9781430264453_Ch11.xhtml#Fig17) shows some
    of the results from grouping by origin and carrier and aggregating the average
    and maximum departure delays.


    ![9781430264453_Fig11-17.jpg](Images/9781430264453_Fig11-17.jpg)


    [Figure 11-17](#9781430264453_Ch11.xhtml#_Fig17). Grouping and aggregating   flight
    data


    The final requirement you may run into as you import data using Power Query is
    inserting a calculated column. This is a little more advanced because you need
    to write code, as you will see in the next section.


    Inserting Calculated Columns


    Up until now you were able to build and execute queries using the visual interfaces
    provided by Power Query. Behind the scene, however, the Power Query Editor was
    creating a file used to execute the query. This file is written in a new language
    called M. As you have seen, you can get a lot of functionality out of Power Query
    without ever having to know about M or learn how it works. Nevertheless, at the
    very least, you should know it is there and that it is what gets executed when
    you run the query. If you navigate to the View tab in the Query Editor, you will
    see an option to open the Advanced Editor, which will display the M code used
    to build the query (see [Figure 11-18](#9781430264453_Ch11.xhtml#Fig18)).


    ![9781430264453_Fig11-18.jpg](Images/9781430264453_Fig11-18.jpg)


    [Figure 11-18](#9781430264453_Ch11.xhtml#_Fig18). Building a query with M


    You can use the Advanced Editor to write the query directly with M, thereby exposing
    some advanced data processing not exposed in the visual interface tools.


    If you want to insert a calculated column into the query, you need to use the
    M functions. On the Insert tab of the Query Editor you can duplicate columns,
    insert an index column, merge columns, and insert a custom column. When you select
    the Insert A Custom Column option, you are presented with a Insert Custom Column
    editor where you insert the M function used to create the column (see [Figure
    11-19](#9781430264453_Ch11.xhtml#Fig19)).


    ![9781430264453_Fig11-19.jpg](Images/9781430264453_Fig11-19.jpg)


    [Figure 11-19](#9781430264453_Ch11.xhtml#_Fig19). Creating columns using M formulas


    [Figure 11-20](#9781430264453_Ch11.xhtml#Fig20) shows the results of the query
    with the custom column added.


    ![9781430264453_Fig11-20.jpg](Images/9781430264453_Fig11-20.jpg)


    [Figure 11-20](#9781430264453_Ch11.xhtml#_Fig20). Displaying the results of the
    query


    So, if you need to create columns using Power Query before inserting the data
    into the Power Pivot model, you use M formulas. If you create the columns after
    importing the data into the Power Pivot model you use DAX formulas.


    Now that you have seen how Power Query works, it is time to get some hands-on
    experience using it to import data. In order to complete this lab it is assumed
    you have installed the latest Power Query add-in.


    HANDS-ON LAB—IMPORTING AND SHAPING DATA WITH POWER QUERY


    In the following lab you will


    *   Create a query to import data.

    *   Filter and transform data.

    *   Append and shape data.

    *   Group and aggregate data.


    1.  In the `LabStarters` folder, open the `LabChapter11.xlsx` file. This file
    contains a basic Power Pivot model that you will add to using Power Query.

    2.  Select the Power Query tab in Excel. Under the Get External Data, select from
    File and choose the From CSV option. Navigate to the `FlightPerformance_2012_10.csv`
    in the `LabStarters` folder. You should see the Query Editor window with airline
    delay data, as in [Figure 11-21](#9781430264453_Ch11.xhtml#Fig21).


    ![9781430264453_Fig11-21.jpg](Images/9781430264453_Fig11-21.jpg)


    [Figure 11-21](#9781430264453_Ch11.xhtml#_Fig21). The Query Editor window with
    delay data


    3.  In the Query Settings pane, rename the query to **FlightDelays** and uncheck
    the Load To Data Model.

    4.  In the Applied Steps list, if the Query Editor did not automatically add the
    transform to set the first row as headers, add it now.

    5.  Check the types of each column to see if the Query Editor updated the FlightDate
    to a Date data type and the number type columns to a Number data type. If it did
    not, change them now.

    6.  Remove the UniqueCarrier, FlightNum, AirTime, Flights, and Distance columns.

    7.  Filter the data so that it only pulls rows that have a flight departure delay
    of greater than 15 minutes.

    8.  Select Apply & Close to save the query.

    9.  Complete steps 2-8 for the `FlightPerformance_2012_11.csv` file, except this
    time, name the query **FlightDelays2**.

    10.  You should now have two workbook queries, as shown in [Figure 11-22](#9781430264453_Ch11.xhtml#Fig22).


    ![9781430264453_Fig11-22.jpg](Images/9781430264453_Fig11-22.jpg)


    [Figure 11-22](#9781430264453_Ch11.xhtml#_Fig22). Current workbook queries


    11.  Double click on the FlightDelays query to open it back up in the Query Editor.

    12.  Select the Append Queries option in the Combine section of the Home tab.
    Append the FlightDelays2 query to the FlightDelays query.

    13.  Select the OriginCityName column and split it into two columns named OriginCity
    and OriginState using the comma. Do the same for the DestCityName column.

    14.  Replace West Palm Beach/Palm Beach in the City columns with just Palm Beach.

    15.  Check the Load To Data Model Load setting and click the Apply & Close button.

    16.  Open the Power Pivot model and verify that the table was loaded.

    17.  Select the Power Query tab in Excel. Under Get External Data, select From
    File and choose the From CSV option. Navigate to the `FlightPerformance_2012_12.csv`
    in the `LabStarters` folder.

    18.  In the Query Settings pane, rename the query to **DelaySummary** and uncheck
    Load To Data Model.

    19.  Keep the Carrier, Origin, and DepDelay columns and remove the rest.

    20.  Filter out delays that are less than 15 minutes.

    21.  Find the average delay and max delay grouping by the origin and carrier (see
    [Figure 11-23](#9781430264453_Ch11.xhtml#Fig23)).


    ![9781430264453_Fig11-23.jpg](Images/9781430264453_Fig11-23.jpg)


    [Figure 11-23](#9781430264453_Ch11.xhtml#_Fig23). Grouping by origin and carrier'
