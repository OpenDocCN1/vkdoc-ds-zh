- fmt: 'In the next chapter you will look at one of the most interesting aspects of
    BI analysis: predictive analytics. Predictive analytics allow you to extract information
    from your historical data and use it to predict future behavior and trends. Excel
    provides a set of data mining tools that make predictive analytics easy to implement.
    Using these tools you can perform advanced data analysis such as forecasting,
    clustering, and associations. [Chapter 13](../Text/9781430264453_Ch13.xhtml) introduces
    you to these tools and shows you how to implement some common data mining models
    in order to gain powerful insight into your data.


    ## CHAPTER 13


    ![image](Images/frontdot.jpg)


    # Mining Your Data with Excel


    One of the most underutilized areas of business intelligence is data mining or
    *predictive analytics* as it is often referred to. This is due to the fact that
    traditional data mining uses a set of complex algorithms, and the tools often
    require you to be an expert in these algorithms to be able to implement them.
    Although it is not part of the official Microsoft self-service BI toolset, the
    set of table analysis tools Microsoft offers for Excel allows you to use data
    mining algorithms but hide much of the complexity associated with implementing
    them. Using these table analysis tools for Excel, you can perform advanced data
    analysis such as forecasting, clustering, and associations. This chapter shows
    you how to use these tools to implement some common data mining models and gain
    powerful insight into your data. I should mention, however, that to implement
    the table analysis tools, you need to be able to connect to an instance of SQL
    Server Analysis Server (SSAS), which provides the engine to run the algorithms.


    After completing this chapter you will be able to:


    *   Identify the table analysis tools available in Excel.

    *   Analyze key influencers.

    *   Identify data groups.

    *   Forecasting future trends.

    *   Use shopping basket analysis.


    ## Table Analysis Tools in Excel


    *Data mining* is the process of using historical data to discover patterns and
    develop predictions for future trends. Some common examples of data mining are
    market basket analysis, marketing effectiveness, and forecasting. *Market basket
    analysis* looks at historical data and determines which products are often associated
    with each other in a purchase. Using this information, you can make recommendations
    as to which products should be marketed together. *Marketing effectiveness* analyzes
    historical marketing campaigns and can be used to target customers for future
    campaigns. *Forecasting* allows you to predict the future from historical trends
    in the data. For example, you can make sales predictions based on sales trends
    from the past five years. This can help you plan stocking levels for the upcoming
    season.


    To install the table analysis tools for Excel, go to the download page (`www.microsoft.com/en-us/download/details.aspx?id=35578`).
    Make sure you select the correct version for your Office installation (x86 or
    x64). Once you’ve downloaded the package, double-click on the `SQL_AS_DMAddin.msi`
    file to launch the installer. In the Feature Selection window, leave the default
    selection of Table Analysis Tools For Excel and Server Configuration Utility (see
    [Figure 13-1](#9781430264453_Ch13.xhtml#Fig1)).


    ![9781430264453_Fig13-01.jpg](Images/9781430264453_Fig13-01.jpg)


    [Figure 13-1](#9781430264453_Ch13.xhtml#_Fig1). Installing the table analysis
    tools


    Once you install the data mining tools for Excel, you will see a new tab when
    you select an Excel table. The Table Tools Analyze tab contains a set of tools
    to help you data mine the data contained in a table (see [Figure 13-2](#9781430264453_Ch13.xhtml#Fig2)).


    ![9781430264453_Fig13-02.jpg](Images/9781430264453_Fig13-02.jpg)


    [Figure 13-2](#9781430264453_Ch13.xhtml#_Fig2). Table analysis tools on the Table
    Tools Analyze tab


    The first thing you should notice is that there is no connection listed. In order
    for these tools to work, you need to connect to an instance of SSAS. To create
    a connection, click on the Connection button. In the Analysis Services Connections
    window, click the New button. In the Connect To Analysis Services window (see
    [Figure 13-3](#9781430264453_Ch13.xhtml#Fig3)) enter the values to connect to
    an instance of SSAS. Your values will be determined by your instance of SSAS.


    ![9781430264453_Fig13-03.jpg](Images/9781430264453_Fig13-03.jpg)


    [Figure 13-3](#9781430264453_Ch13.xhtml#_Fig3). Connecting to an SSAS instance


    Once the connection is added, you should see it listed in the table analysis tools
    in the connection area (see [Figure 13-4](#9781430264453_Ch13.xhtml#Fig4)).


    ![9781430264453_Fig13-04.jpg](Images/9781430264453_Fig13-04.jpg)


    [Figure 13-4](#9781430264453_Ch13.xhtml#_Fig4). The table analysis tools with
    an active SSAS connection


    Each of these tools uses a well-known data mining algorithm and analyzes the data
    distribution and data types of your data. Using these tools shields you from the
    complexity of implementing the algorithm. [Table 13-1](#9781430264453_Ch13.xhtml#Tab1)
    summarizes each of the available tools, when you should use them and the type
    of algorithm used.


    [Table 13-1](#9781430264453_Ch13.xhtml#_Tab1). Summary of the Available Table
    Analysis Tools


    | Tool | Use | Algorithm |

    | --- | --- | --- |

    | Analyze Key Influencers | Identify the factors that have the most influence
    on the target data column. | Naïve Bayes |

    | Detect Categories | Find groupings of data. | Clustering |

    | Fill From Example | Recommend new values based on patterns in the data. | Logistic
    regression |

    | Forecast | Analyze data that changes over time and predict future values. |
    Time series |

    | Highlight Exceptions | Analyze patterns in a table of data and find values that
    don’t fit the pattern. | Clustering |

    | Goal Seek Scenario | Identify underlying factors that need to change to meet
    a target. | Logistic regression |

    | What-If Scenario | Predict whether a change will be sufficient to achieve the
    desired outcome. | Logistic regression |

    | Prediction Calculator | Analyze the factors leading to the target outcome and
    predict a result for new inputs. | Logistic regression |

    | Shopping Basket Analysis | Identify patterns that can be used in cross-selling
    or upselling. | Association |


    Now that you have seen the breadth of the tools available to you, it is time to
    look at some of them in more detail.


    ## Analyzing Key Influencers


    Using the Analyze Key Influencers tool, you can determine which factors have the
    most influence on an outcome. For example, you have a data table that contains
    attributes of customers and a column that indicates whether they bought a bike
    or not (see [Figure 13-5](#9781430264453_Ch13.xhtml#Fig5)).


    ![9781430264453_Fig13-05.jpg](Images/9781430264453_Fig13-05.jpg)


    [Figure 13-5](#9781430264453_Ch13.xhtml#_Fig5). Customer attributes


    To determine the key factors influencing whether a client purchased a bike, select
    the table, and then in the Table Analysis Tools tab, select `Analyze Key Influencers`.
    You are presented with a column selection dialog box. First choose the column
    that contains the outcome you want to analyze (see [Figure 13-6](#9781430264453_Ch13.xhtml#Fig6)).


    ![9781430264453_Fig13-06.jpg](Images/9781430264453_Fig13-06.jpg)


    [Figure 13-6](#9781430264453_Ch13.xhtml#_Fig6). Selecting the outcome field


    Next click on the link to choose the columns you want to use for analysis (see
    [Figure 13-7](#9781430264453_Ch13.xhtml#Fig7)).


    ![9781430264453_Fig13-07.jpg](Images/9781430264453_Fig13-07.jpg)


    [Figure 13-7](#9781430264453_Ch13.xhtml#_Fig7). Selecting the influencer fields


    After selecting the fields to analyze, select OK to close the Advanced Columns
    Selection window. In the `Analyze Key Influencers` window, select Run to start
    the analysis (see [Figure 13-6](#9781430264453_Ch13.xhtml#Fig6)).'
  raw: 'In the next chapter you will look at one of the most interesting aspects of
    BI analysis: predictive analytics. Predictive analytics allow you to extract information
    from your historical data and use it to predict future behavior and trends. Excel
    provides a set of data mining tools that make predictive analytics easy to implement.
    Using these tools you can perform advanced data analysis such as forecasting,
    clustering, and associations. [Chapter 13](../Text/9781430264453_Ch13.xhtml) introduces
    you to these tools and shows you how to implement some common data mining models
    in order to gain powerful insight into your data.


    CHAPTER 13


    ![image](Images/frontdot.jpg)


    Mining Your Data with Excel


    One of the most underutilized areas of business intelligence is data mining or
    *predictive analytics* as it is often referred to. This is due to the fact that
    traditional data mining uses a set of complex algorithms, and the tools often
    require you to be an expert in these algorithms to be able to implement them.
    Although it is not part of the official Microsoft self-service BI toolset, the
    set of table analysis tools Microsoft offers for Excel allows you to use data
    mining algorithms but hide much of the complexity associated with implementing
    them. Using these table analysis tools for Excel, you can perform advanced data
    analysis such as forecasting, clustering, and associations. This chapter shows
    you how to use these tools to implement some common data mining models and gain
    powerful insight into your data. I should mention, however, that to implement
    the table analysis tools, you need to be able to connect to an instance of SQL
    Server Analysis Server (SSAS), which provides the engine to run the algorithms.


    After completing this chapter you will be able to


    *   Identify the table analysis tools available in Excel.

    *   Analyze key influencers.

    *   Identify data groups.

    *   Forecasting future trends.

    *   Use shopping basket analysis.


    Table Analysis Tools in Excel


    *Data mining* is the process of using historical data to discover patterns and
    develop predictions for future trends. Some common examples of data mining are
    market basket analysis, marketing effectiveness, and forecasting. *Market basket
    analysis* looks at historical data and determines which products are often associated
    with each other in a purchase. Using this information, you can make recommendations
    as to which products should be marketed together. *Marketing effectiveness* analyzes
    historical marketing campaigns and can be used to target customers for future
    campaigns. *Forecasting* allows you to predict the future from historical trends
    in the data. For example, you can make sales predictions based on sales trends
    from the past five years. This can help you plan stocking levels for the upcoming
    season.


    To install the table analysis tools for Excel, go to the download page (`www.microsoft.com/en-us/download/details.aspx?id=35578``)`.
    Make sure you select the correct version for your Office installation (x86 or
    x64). Once you’ve downloaded the package, double-click on the `SQL_AS_DMAddin.msi`
    file to launch the installer. In the Feature Selection window, leave the default
    selection of Table Analysis Tools For Excel and Server Configuration Utility (see
    [Figure 13-1](#9781430264453_Ch13.xhtml#Fig1)).


