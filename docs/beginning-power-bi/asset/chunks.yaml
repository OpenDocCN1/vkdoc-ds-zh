    Identifying Data Groups


    Detecting different categories that your data falls into is an important analysis
    you perform on the data. This can be useful for many different scenarios; for
    example, you need to know what groups your customers fall into so that you can
    target your marketing for the different groups. Another reason to take a close
    look at categories is so you can determine outliers that do not fit in any group.
    This way, if you need to, you can filter out the outliers from your data set so
    they do not skew your results. Finding outliers is also a common pattern for detecting
    possible fraud.


    To identify the various market segments of customers buying bikes, first select
    a table that contains customer demographics and a column that indicates if they
    purchased a bike. In the Table Tools Analyze tab select the Detect Categories
    tool. This launches a window where you select the fields to use and how many categories
