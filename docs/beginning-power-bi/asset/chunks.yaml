    **用例 2：销售配额分析**


    在此场景中，您将使用与用例 1 中同一家自行车公司销售团队的销售数据。这次，您需要使用 `Power View` 创建一个仪表板，以使销售经理能够跟踪销售团队的绩效。您将把实际销售额与销售团队的销售配额进行比较。虽然此比较所需的度量并不复杂，但销售额和配额的数据粒度处于不同级别，这带来了挑战。


    **加载数据**


    创建一个名为 `SalesRepAnalysis.xlsx` 的新 Excel 工作簿。在 `Chapter14Labs` 文件夹内有一个名为 `UseCase2`
    的文件夹；该文件夹包含一个 `SalesRepAnalysis.accdb` Access 数据库。以此作为数据源，导入[表 14-5](#9781430264453_Ch14.xhtml#Tab5)
    中列出的数据表和列。


    [表 14-5](#9781430264453_Ch14.xhtml#_Tab5)：要导入的表和列


    ![Table14-5](Images/Table14-5.jpg)


    **创建模型**


    导入表后，根据[表 14-6](#9781430264453_Ch14.xhtml#Tab6) 中列出的信息重命名表列，并显示或隐藏客户端工具中的列。


    [表 14-6](#9781430264453_Ch14.xhtml#_Tab6)：表和列属性设置


    ![Table14-6](Images/Table14-6.jpg)


    为了在表之间创建适当的关系，您需要创建一个包含日历年 and 季度的 `Sales Period` 表。要获取此表，请使用与 `SalesRepAnalysis.accdb`
    Access 数据库的现有连接。这次，请使用以下查询获取数据（确保友好查询名称为 `Sales Period`）：


    ```

    Select distinct CalendarYear & CalendarQuarter as PeriodKey,

    CalendarYear as [Period Year], CalendarQuarter  as [Period Quarter] from dbo_DimDate

    ```


    使用 DAX `CONCATENATE` 函数，在 `Quota` 表中创建一个 `PeriodKey` 列。


    ```

    [PeriodKey]

    =CONCATENATE([CalendarYear],[CalendarQuarter])

    ```


    `Sales` 表处理起来稍微棘手一些。首先，在 `Sales` 表和 `Date` 表之间创建关系。接下来，使用 `RELATED` 函数在 `Sales`
    表中创建 `Period Year` 和 `Period Quarter`。然后，使用 `CONCATENATE` 函数在 `Sales` 表中创建 `PeriodKey`
    列。


    ```

    [Period Year]

    =Related(''Date''[Calendar Year])

    [Period Quarter]

    =RELATED(''Date''[Calendar Quarter])

    ```


    从客户端工具中隐藏表中的 `PeriodKey`。同时隐藏 `Quota` 表和 `Sales` 表中的 `Period Year` 和 `Period Quarter`
    列。


    现在您可以完成模型中表关系的创建。[图 14-8](#9781430264453_Ch14.xhtml#Fig8) 显示了最终模型应呈现的样子。


    ![9781430264453_Fig14-08.jpg](Images/9781430264453_Fig14-08.jpg)


    [图 14-8](#9781430264453_Ch14.xhtml#_Fig8)：定义了关系的销售代表分析模型


    接下来，在 `Sales Territory` 表中使用 `Group`、`Country` 和 `Region` 字段创建一个名为 `Territory`
    的层次结构。在 `Sales Period` 表中使用 `Period Year` 和 `Period Quarter` 字段创建另一个名为 `Period`
    的层次结构。通过连接 `Last Name` 和 `First Name` 列（用逗号分隔），向 `Sales Rep` 表添加一个名为 `Sales Rep
    Name` 的计算列。


    **创建度量**


    将以下度量添加到 `Sales` 表：


    ```

    Total Sales:=SUM([Sales Amount])

    ```


    将以下度量添加到 `Quota` 表：


    ```

    Total Quota:=Sum([Sales Quota])


    Variance:=[Total Sales]-[Total Quota]

    ```'
