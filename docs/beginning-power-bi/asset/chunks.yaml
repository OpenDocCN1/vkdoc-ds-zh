- fmt: '连接的类别将决定你需要提供哪些信息才能访问数据源。例如，Web 源需要 URL，而 CSV 文件则需要文件路径。连接到数据源后，“查询编辑器”窗口将启动并显示数据样本。例如，[图
    11-3](#9781430264453_Ch11.xhtml#Fig3) 显示了 CSV 文件中的航班延误数据。


    ![9781430264453_Fig11-03.jpg](Images/9781430264453_Fig11-03.jpg)


    [图 11-3](#9781430264453_Ch11.xhtml#_Fig3)：“查询编辑器”窗口


    如果你选择具有多个表的数据源，将会看到 Excel 中显示“导航器”窗格。[图 11-4](#9781430264453_Ch11.xhtml#Fig4)
    显示了连接到 Access 源时显示的“导航器”窗格。选择表后，“查询编辑器”将显示样本数据。


    ![9781430264453_Fig11-04.jpg](Images/9781430264453_Fig11-04.jpg)


    [图 11-4](#9781430264453_Ch11.xhtml#_Fig4)：使用“导航器”窗格选择表


    如果你查看“查询编辑器”窗口的“查询设置”窗格，可以看到你可以命名查询并添加描述。如果需要重用和共享你创建的查询，这一点很重要（这些功能仅在 Office
    365 中可用）。此窗格还会显示创建查询所使用的步骤以及数据加载的位置。你可以选择将数据加载到工作表或 Power Pivot 数据模型中。


    连接到数据源后，下一步是在将数据导入数据模型之前，对其进行转换、清理和筛选。


    ## 转换、清理和筛选数据


    连接到数据源后，即可开始转换和清理数据。这是一个重要的步骤，将在很大程度上决定数据对分析工作的支持程度。你将执行的一些常见转换操作包括删除重复项、替换值、删除错误值和更改数据类型。例如，在[图
    11-5](#9781430264453_Ch11.xhtml#Fig5) 中，源 CSV 文件中的“FlightDate”列是文本数据类型，但你希望它在模型中成为日期列。


    ![9781430264453_Fig11-05.jpg](Images/9781430264453_Fig11-05.jpg)


    [图 11-5](#9781430264453_Ch11.xhtml#_Fig5)：更改列的数据类型


    你经常需要替换源系统中的值，以便它们在模型中同步。例如，CSV 文件中列为 VX 的承运商在现有数据中的值为 VG。你可以通过选择列，然后在菜单中选择“替换值”转换，在导入数据时轻松替换这些值。这将启动一个窗口，你可以在其中输入要查找的值以及要替换成的值（参见[图
    11-6](#9781430264453_Ch11.xhtml#Fig6)）。


    ![9781430264453_Fig11-06.jpg](Images/9781430264453_Fig11-06.jpg)


    [图 11-6](#9781430264453_Ch11.xhtml#_Fig6)：替换列中的值


    从源加载数据时，另一个常见需求是筛选掉不必要的列和行。要删除列，只需选择列，然后在“开始”选项卡上选择“删除列”按钮。如果只需要几列，你也可以选择要保留的列，然后选择“删除其他列”选项。你可以通过单击列名旁边的下拉菜单并输入筛选条件来筛选行（参见[图
    11-7](#9781430264453_Ch11.xhtml#Fig7)）。


    ![9781430264453_Fig11-07.jpg](Images/9781430264453_Fig11-07.jpg)


    [图 11-7](#9781430264453_Ch11.xhtml#_Fig7)：筛选行


    在应用数据转换和筛选时，“查询编辑器”会列出已应用的步骤。这使你能够组织和跟踪对数据所做的更改。你可以通过右键单击列表中的步骤来重命名、重新排列和删除步骤（参见[图
    11-8](#9781430264453_Ch11.xhtml#Fig8)）。


    ![9781430264453_Fig11-08.jpg](Images/9781430264453_Fig11-08.jpg)


    [图 11-8](#9781430264453_Ch11.xhtml#_Fig8)：管理查询步骤


    清理和转换数据后，你可能需要将来自多个源的数据合并到数据模型的一个表中，或者展开列中包含的数据。


    ## 合并和重塑数据


    有时，你可能需要在将数据加载到模型之前，合并来自多个表和/或源的数据——例如，如果一个表中的代码关联到另一个包含字段完整值的查找表。处理此问题的一种方法是将两个表都导入模型，并在
    Power Pivot 模型中创建表之间的链接。另一种选择是在导入数据之前合并这些表。例如，在前面看到的航班数据中，有一个包含承运商代码的`UniqueCarrier`列。你可以将这些代码与另一个包含承运商代码和承运商名称的
    CSV 文件合并。首先，使用“查询编辑器”为每组数据创建并保存一个查询。对于查找表，你可以取消选中“加载到工作表”和“加载到数据模型”复选框，因为数据将在合并后加载，所以这些暂时不需要。接下来，打开主查询，并在“开始”选项卡上选择“合并”按钮。这将启动“合并”窗口（参见[图
    11-9](#9781430264453_Ch11.xhtml#Fig9)），你可以在其中选择查找查询以及链接数据的列。


    ![9781430264453_Fig11-09.jpg](Images/9781430264453_Fig11-09.jpg)


    [图 11-9](#9781430264453_Ch11.xhtml#_Fig9)：合并两个查询的数据


    合并查询后，你可以选择要合并的列（参见[图 11-10](#9781430264453_Ch11.xhtml#Fig10)）。合并列后，你可能需要重命名主查询中的列。


    ![9781430264453_Fig11-10.jpg](Images/9781430264453_Fig11-10.jpg)


    [图 11-10](#9781430264453_Ch11.xhtml#_Fig10)：选择要合并的列


    除了合并来自查找表的数据外，你可能还需要追加来自两个不同源的数据。例如，假设你每年有分别存储在不同源文件或表中的航班数据，并希望将多年的数据合并到同一张表中。在这种情况下，你将创建两个相似的查询，每个查询使用不同的源。首先，在“查询编辑器”中打开其中一个查询，然后在“开始”选项卡上选择“追加查询”按钮。然后，你可以选择另一个查询作为要追加的表（参见[图
    11-11](#9781430264453_Ch11.xhtml#Fig11)）。


    ![9781430264453_Fig11-11.jpg](Images/9781430264453_Fig11-11.jpg)


    [图 11-11](#9781430264453_Ch11.xhtml#_Fig11)：追加两个查询


    有时，源可能会为你提供一列数据，而你需要将其拆分为多列。例如，你可能需要拆分城市和州，或者名字和姓氏。为此，请在“查询编辑器”中选择该列，然后在“开始”选项卡上选择“拆分列”。你可以按分隔符或按字符数拆分列（参见[图
    11-12](#9781430264453_Ch11.xhtml#Fig12)）。


    ![9781430264453_Fig11-12.jpg](Images/9781430264453_Fig11-12.jpg)


    [图 11-12](#9781430264453_Ch11.xhtml#_Fig12)：使用分隔符拆分列


    你可能会遇到的另一种情况是，数据源包含的数据不是表格形式，而是矩阵形式，如[图 11-13](#9781430264453_Ch11.xhtml#Fig13)
    所示。


    ![9781430264453_Fig11-13.jpg](Images/9781430264453_Fig11-13.jpg)


    [图 11-13](#9781430264453_Ch11.xhtml#_Fig13)：使用矩阵作为数据源


    为了将此数据导入数据模型，你需要取消透视数据，使其成为表格形式。在“查询编辑器”中，选择需要取消透视的列（参见[图 11-14](#9781430264453_Ch11.xhtml#Fig14)）。


    ![9781430264453_Fig11-14.jpg](Images/9781430264453_Fig11-14.jpg)


    [图 11-14](#9781430264453_Ch11.xhtml#_Fig14)：选择要取消透视的列'
  raw: 'The type of connection will dictate what information you need to supply to
    gain access to the data source. For example, a web source requires a URL whereas
    a CSV file requires the file path. Once you connect to a data source, the Query
    Editor window will launch, displaying a sample of the data. For example, [Figure
    11-3](#9781430264453_Ch11.xhtml#Fig3) shows flight delay data contained in a CSV
    file.


    ![9781430264453_Fig11-03.jpg](Images/9781430264453_Fig11-03.jpg)


    [Figure 11-3](#9781430264453_Ch11.xhtml#_Fig3). The Query Editor window


    If you select a data source with multiple tables, you will see a Navigator pane
    displayed in Excel. [Figure 11-4](#9781430264453_Ch11.xhtml#Fig4) shows the Navigator
    pane displayed when you connect to an Access source. After you select a table,
    the Query Editor will display with the sample data.


    ![9781430264453_Fig11-04.jpg](Images/9781430264453_Fig11-04.jpg)


    [Figure 11-4](#9781430264453_Ch11.xhtml#_Fig4). Using the Navigator pane to select
    a table


    If you look at the Query Settings pane of the Query Editor window, you can see
    you have the ability to name the query and add a description. This is important
    if you want to reuse and share the queries you create (these features are available
    in Office 365 only). This pane also shows you the steps you used to create the
    query and where to load the data. You have the option of loading the data to a
    worksheet or to the Power Pivot data model.


    Once you have connected to the data source, the next step is to transform, cleanse,
    and filter the data before importing it into the data model.


    Transforming, Cleansing, and Filtering Data


    After connecting to the data source you are ready to transform and clean the data.
    This is an important step and will largely determine how well the data will support
    your analysis effort. Some common transformations you will perform are removing
    duplicates, replacing values, removing error values, and changing data types.
    For example, in [Figure 11-5](#9781430264453_Ch11.xhtml#Fig5) the FlightDate column
    is a Text data type in the source CSV file, but you want it to be a Date column
    in your model.


    ![9781430264453_Fig11-05.jpg](Images/9781430264453_Fig11-05.jpg)


    [Figure 11-5](#9781430264453_Ch11.xhtml#_Fig5). Changing the data type of a column


    Often you need to replace values from a source system so that they sync together
    in your model. For example, a carrier listed as VX in the CSV file has a value
    of VG in your existing data. You can easily replace these values as the data is
    imported by selecting the column and then selecting the Replace Values transformation
    in the menu. This launches a window in which you can enter the values to find
    and what to replace them with (see [Figure 11-6](#9781430264453_Ch11.xhtml#Fig6)).


    ![9781430264453_Fig11-06.jpg](Images/9781430264453_Fig11-06.jpg)


    [Figure 11-6](#9781430264453_Ch11.xhtml#_Fig6). Replacing values in a column


    When loading data from a source, another common requirement is filtering out unnecessary
    columns and rows. To remove columns, simply select the columns and select the
    Remove Columns button on the Home tab. If you only need a few columns, you can
    also select the columns you want to keep and then select the Remove Other Columns
    option. You can filter out rows by selecting the drop-down beside the column name
    and entering a filter condition (see [Figure 11-7](#9781430264453_Ch11.xhtml#Fig7)).


    ![9781430264453_Fig11-07.jpg](Images/9781430264453_Fig11-07.jpg)


    [Figure 11-7](#9781430264453_Ch11.xhtml#_Fig7). Filtering rows


    As you apply the data transformations and filtering, the Query Editor lists the
    steps you have applied. This allows you to organize and track the changes you
    make to the data. You can rename, rearrange, and remove steps by right clicking
    the step in the list (see [Figure 11-8](#9781430264453_Ch11.xhtml#Fig8)).


    ![9781430264453_Fig11-08.jpg](Images/9781430264453_Fig11-08.jpg)


    [Figure 11-8](#9781430264453_Ch11.xhtml#_Fig8). Managing the query steps


    After cleansing and transforming the data, you may need to combine data from several
    sources into one table in your data model or expand data contained in a column.


    Merging and Shaping Data


    There are times when you may need to merge data from several tables and/or sources
    before you load the data into the model—for example, if you have codes in a table
    that link to another look-up table that contains the full value for the field.
    One way to deal with this is to import both tables into your model and create
    a link between the tables in the Power Pivot model. Another option is to merge
    the tables together before importing the data. For example, in the flight data
    you saw earlier, there is a UniqueCarrier column that contains carrier codes.
    You can merge these with another CSV file that contains the carrier codes and
    the carrier name. First create and save a query for each set of data with the
    Query Editor. For the look-up table, you can uncheck the Load to worksheet and
    Load to Data Model checkboxes which you do not need because the data will be loaded
    after the merge. Next open the main query and select the Merge button on the Home
    tab. This will launch the Merge window (see [Figure 11-9](#9781430264453_Ch11.xhtml#Fig9))
    where you select the look-up query and the columns that link the data together.


    ![9781430264453_Fig11-09.jpg](Images/9781430264453_Fig11-09.jpg)


    [Figure 11-9](#9781430264453_Ch11.xhtml#_Fig9). Merging data from two queries


    Once you merge the queries you can choose which columns to merge (see [Figure
    11-10](#9781430264453_Ch11.xhtml#Fig10)). Once the columns are merged you will
    probably want to rename the columns in the main query.


    ![9781430264453_Fig11-10.jpg](Images/9781430264453_Fig11-10.jpg)


    [Figure 11-10](#9781430264453_Ch11.xhtml#_Fig10). Choosing columns to merge


    Along with merging data from look-up tables, you may also need to append data
    from two different sources. For example, say you have flight data for each year
    separated into different source files or tables and want to combine multiple years
    into the same table. In this case, you would create two similar queries, each
    using a different source. First open one of the queries in the Query Editor and
    select the Append Queries button on the Home tab. You can then select the other
    query as the table to append (see [Figure 11-11](#9781430264453_Ch11.xhtml#Fig11)).


    ![9781430264453_Fig11-11.jpg](Images/9781430264453_Fig11-11.jpg)


    [Figure 11-11](#9781430264453_Ch11.xhtml#_Fig11). Appending two querries


    Sometimes a source may provide you with data in a column that needs to be split
    up among several columns. For example, you may need to split the city and state,
    or the first name and last name. To do this, select the column in the Query Editor
    and on the Home tab, choose Split Column. You can either split the column by a
    delimiter or by the number of characters (see [Figure 11-12](#9781430264453_Ch11.xhtml#Fig12)).


    ![9781430264453_Fig11-12.jpg](Images/9781430264453_Fig11-12.jpg)


    [Figure 11-12](#9781430264453_Ch11.xhtml#_Fig12). Spliting a column using a delimiter


    Another scenario you may run into is when the data source contains data that is
    not in tabular form, but rather in a matrix, as in [Figure 11-13](#9781430264453_Ch11.xhtml#Fig13).


    ![9781430264453_Fig11-13.jpg](Images/9781430264453_Fig11-13.jpg)


    [Figure 11-13](#9781430264453_Ch11.xhtml#_Fig13). Using a matrix as a data source


    In order to import this data into the data model, you will need to unpivot the
    data to get it in a tabular form. In the Query Editor, select the columns that
    need to be unpivoted (see [Figure 11-14](#9781430264453_Ch11.xhtml#Fig14)).


    ![9781430264453_Fig11-14.jpg](Images/9781430264453_Fig11-14.jpg)


    [Figure 11-14](#9781430264453_Ch11.xhtml#_Fig14). Selecting columns to unpivot'
