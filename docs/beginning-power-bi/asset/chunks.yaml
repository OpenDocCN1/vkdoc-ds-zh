    在分析数据时，利用层次结构来定义不同级别的聚合通常非常有用。例如，基于年、季度和月级别的日历层次结构就很常见。像销售额这样的聚合值会从月度汇总到季度，再到年度。另一种常见的层次结构可能是从部门到大楼再到区域。然后，您可以通过不同级别向上汇总成本。在
    Power Pivot 模型中创建层次结构非常简单。在模型设计器的图表视图中，选择包含您希望在层次结构中使用的属性（列）的表。您将在该表的右上角看到一个`Create
    Hierarchy`按钮（参见图 3-16）。点击该按钮即可添加层次结构并对其重命名。然后，您可以将字段拖放到层次结构中以创建不同的级别。请确保这些字段的排列顺序是从较高级别到较低级别。


    ![9781430264453_Fig03-16.jpg](img/9781430264453_Fig03-16.jpg)


    图 3-16。创建层次结构


    创建层次结构是提高模型可用性的一种方法，有助于用户在数据分析中更本能地获取更多价值。在下一节中，您将了解其他一些可以应用于模型以提高其可用性的方法。


    ## 打造用户友好型模型


    在创建模型时，需要记住的一点是使模型易于使用且直观。模型很可能会被其他人用于分析。该模型也可能用于各种客户端报告和分析工具，例如 Power View、Power
    Map 和 Reporting Services。您可以使用的某些属性和设置允许这些客户端工具从模型中获得更多功能。


    您可以进行的最有效的调整之一是重命名表和列。使用对业务用户有意义的名称，而不是只有数据库开发人员才能理解的晦涩命名约定。另一个好的做法是确保列的数据类型和格式设置正确。来自文本文件的字段在导入时可能会被类型化为字符串，而实际上它可能是数值数据。此外，您可以隐藏对用户无用的字段，例如用于链接表的代理键。


    一个常见需求是更改列的排序顺序，使其不同于自然排序。最常见的例子是月份。由于月份默认是文本，它们会按字母顺序排序。实际上，您希望它们按月编号排序。要解决此问题，您可以按表中的任何其他列对某一列进行排序（参见图
    3-17）。这是一个很好的功能，允许您创建与业务相关的自定义排序。


    ![9781430264453_Fig03-17.jpg](img/9781430264453_Fig03-17.jpg)


    图 3-17。按另一列对某一列进行排序


    您可以使用其他一些设置为各种客户端工具创建良好的模型。您将在第 10 章“为 Power View 优化表格模型”中更详细地重新讨论此主题。


    以下动手实验将帮助您巩固本章涉及的主题。


    ## 动手实验——在 Power Pivot 中创建数据模型


    在以下实验中，您将执行以下操作：


    * 创建表关系。

    * 反规范化数据。

    * 创建链接表。

    * 设置层次结构。

    * 打造用户友好型模型。


    1. 打开 Excel 2013，创建一个名为 `LabChapter3.xlsx` 的新文件。

    2. 使用 Power Pivot 数据模型中的表导入向导，连接到 `LabStarters` 文件夹中的 `Adventureworks.accdb` 文件。

    3. 选择列出的表和字段并导入数据。


    | 源表名称 | 友好名称 | 字段 |

    | --- | --- | --- |

    | `DimDate` | 日期 | `DateKeyFullDateAlternateKeyEnglishMonthNameMonthNumberOfYearCalendarQuarterCalendarYear`
    |

    | `DimCustomer` | 客户 | `CustomerKeyBirthDateMaritalStatusGenderYearlyIncomeTotalChildrenHouseOwnerNumberOfCars`
    |

    | `FactInternetSales` | 互联网销售 | `ProductKeyOrderDateKeyShipDateKeyCustomerKeySalesTerritoryKeySalesOrderNumberSalesOrderLineNumberOrderQuantityUnitPriceTotalProductCostSalesAmount`
    |


    4. 在 Power Pivot 模型设计器的数据视图模式下，重命名并隐藏表中指示的列。要隐藏列，请右键单击它，然后在上下文菜单中选择 `Hide From
    Client Tools`。


    ![Table3b](img/Table3b.jpg)


    5. 将 Power Pivot 窗口切换到图表视图。您应该会看到 `Date`、`Customer` 和 `Internet Sales` 表。`Customer`
    表和 `Internet Sales` 表之间已定义了关系。这是由表导入向导发现的。

    6. 将 `DateKey` 从 `Date` 表拖放到 `Internet Sales` 表中的 `OrderDateKey` 上。类似地，在 `DateKey`
    和 `ShipDateKey` 之间创建关系。双击此关系以启动 `Edit Relationship` 窗口（参见图 3-18）。尝试将其设为活动关系。您应该会收到一个错误，因为在一个模型中，两个表之间只能有一个活动关系。


    ![9781430264453_Fig03-18.jpg](img/9781430264453_Fig03-18.jpg)


    图 3-18。创建表关系


    7. 在 Power Pivot 模型设计器窗口的 `Home` 选项卡上，单击 `Existing Connections` 按钮。您应该会看到之前创建的到
    `Adventureworks.acdb` 的连接。打开此连接，并选择用于导入数据的查询选项。

    8. 在 `Specify A SQL Query` 窗口中，将查询友好名称更改为 `Product`，然后单击 `Design` 按钮。

    9. 在设计器中单击 `Import` 按钮。打开实验启动器文件夹中的 `ProductQuery.txt` 文件。单击红色感叹号 (`!`) 运行查询（参见图
    3-19）。此查询合并了来自 `Product`、`ProductCategory` 和 `ProductSubcategory` 表的数据（即反规范化）。


    ![9781430264453_Fig03-19.jpg](img/9781430264453_Fig03-19.jpg)


    图 3-19。运行查询


    10. 确认收到数据后，单击 `OK` 按钮，然后在下一个屏幕上单击 `Finish` 按钮。

    11. 导入数据后，隐藏 `ProductKey` 并按如下方式更新列名：


    ![Table3c](img/Table3c.jpg)


    12. 使用 `ProductKey` 在 `Internet Sales` 表和 `Product` 表之间创建关系。最终的图表应类似于图 3-20。


    ![9781430264453_Fig03-20.jpg](img/9781430264453_Fig03-20.jpg)


    图 3-20。查看数据模型关系


    13. 要创建链接表，请将图 3-21 中显示的数据输入到 Excel 的一个空工作表标签中。


    ![9781430264453_Fig03-21.jpg](img/9781430264453_Fig03-21.jpg)


    图 3-21。链接表数据


    14. 选择这些单元格，右键单击，然后在快速分析上下文菜单中，选择 `Table` 选项卡并单击 `Table` 按钮（参见图 3-22）。在表工具设计选项卡中，将表重命名为
    `SalesTerritory`。


    ![9781430264453_Fig03-22.jpg](img/9781430264453_Fig03-22.jpg)


    图 3-22。快速分析表选项卡

