  trans: "  \n这次，在 Excel 工作表中构建仪表板。添加一个图表，展示您所关注的年度各月销售额增长百分比，再添加一个数据透视表，显示每个月的最大经销商销售额和经销商名称。此外，还要添加一个用于年份的切片器、一个用于经销商类型的切片器，以及一个用于国家/地区的切片器。您的仪表板应类似于图\
    \ 14-7。  \n\n![9781430264453_Fig14-07.jpg](img/9781430264453_Fig14-07.jpg)  \n\
    \n图 14-7。Excel 工作表中的最终仪表板  \n\n完成仪表板并进行实验后，保存并关闭 Excel。  \n\n## 用例 2：销售配额分析  \n\
    \n在本场景中，您将使用与用例 1 相同的自行车公司销售团队的销售数据。这次，您需要使用 Power View 创建一个仪表板，让销售经理能够跟踪销售团队的业绩。您需要将实际销售额与销售团队的销售配额进行比较。虽然进行比较所需的度量值并不复杂，但销售数据和配额数据的粒度处于不同级别，这带来了挑战。\
    \  \n\n### 加载数据  \n\n创建一个名为 `SalesRepAnalysis.xlsx` 的新 Excel 工作簿。在 `Chapter14Labs`\
    \ 文件夹中有一个名为 `UseCase2` 的子文件夹；该文件夹包含一个名为 `SalesRepAnalysis.accdb` 的 Access 数据库。以此作为数据源，导入表\
    \ 14-5 中列出的数据表和列。  \n\n表 14-5。要导入的表和列  \n\n![Table14-5](img/Table14-5.jpg)  \n\
    \n### 创建模型  \n\n导入表后，根据表 14-6 中列出的信息，重命名表列，并在客户端工具中显示或隐藏相应列。  \n\n表 14-6。表和列属性设置\
    \  \n\n![Table14-6](img/Table14-6.jpg)  \n\n为了在表之间创建适当的关系，您需要创建一个包含日历年份和季度的销售期间表。要获取此表，请使用现有的与\
    \ `SalesRepAnalysis.accdb` Access 数据库的连接。这次，使用以下查询获取数据（确保友好查询名称为 Sales Period）：\
    \  \n\n```\nSelect distinct CalendarYear & CalendarQuarter as PeriodKey,\nCalendarYear\
    \ as [Period Year], CalendarQuarter  as [Period Quarter] from dbo_DimDate\n```\n\
    \n在配额表中，使用 DAX 函数 `CONCATENATE` 创建一个 PeriodKey 列。  \n\n```\n[PeriodKey]\n=CONCATENATE([CalendarYear],[CalendarQuarter])\n\
    ```\n\n销售额表处理起来稍复杂一些。首先，在销售额表和日期表之间创建关系。接着，使用 `RELATED` 函数在销售额表中创建年度期间和季度期间。然后使用\
    \ `CONCATENATE` 函数在销售额表中创建 `PeriodKey` 列。  \n\n```\n[Period Year]\n=Related('Date'[Calendar\
    \ Year])\n[Period Quarter]\n=RELATED('Date'[Calendar Quarter])\n```\n\n在客户端工具中隐藏表中的\
    \ `PeriodKey`。同时隐藏配额表和销售额表中的 `Period Year` 和 `Period Quarter` 列。  \n\n现在，您可以在模型中完成表关系的创建。图\
    \ 14-8 展示了最终模型应呈现的样子。  \n\n![9781430264453_Fig14-08.jpg](img/9781430264453_Fig14-08.jpg)\
    \  \n\n图 14-8。定义了关系的销售代表分析模型  \n\n接下来，在销售区域表中使用组、国家/地区和区域字段创建一个区域层次结构。在销售期间表中创建另一个名为期间（Period）的层次结构，使用\
    \ `Period Year` 和 `Period Quarter` 字段。在销售代表表中，通过用逗号连接 `Last Name` 和 `First Name`\
    \ 列，添加一个名为 `Sales Rep Name` 的计算列。  \n\n### 创建度量值  \n\n在销售额表中添加以下度量值：  \n\n```\n\
    Total Sales:=SUM([Sales Amount])\n```\n\n在配额表中添加以下度量值：  \n\n```\nTotal Quota:=Sum([Sales\
    \ Quota])\n\nVariance:=[Total Sales]-[Total Quota]\n```  \n"
