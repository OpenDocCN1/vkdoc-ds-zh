  raw: 'You can remove the Alarm Type keys and rename ALARM_DESCRIPTION to Alarm Type.


    Repeat the previous procedures to replace the DateKey column with the dates in
    the `Date.csv` file. Use the `Locations.txt` file to add the longitude and latitude
    values to the Alarms query based on the OP_CENTER. You can rename the columns
    so that they use the same naming convention. Your alarm query should look similar
    to [Figure](#9781430264453_Ch14.xhtml#Fig13) 14-13.


    ![9781430264453_Fig14-13.jpg](Images/9781430264453_Fig14-13.jpg)


    [Figure 14-13](#9781430264453_Ch14.xhtml#_Fig13). The Alarm query with Latitude
    and Longitude data added


    Next filter the data to limit it to alarm types of power failure and high AC volts.
    Once you do this, you may notice some error values in the Meter column; go ahead
    and remove these errors. Now you can aggregate the alarm counts grouping by the
    Date, Op Center, Alarm Type, Longitude, and Latitude (see [Figure 14-14](#9781430264453_Ch14.xhtml#Fig14)).


    ![9781430264453_Fig14-14.jpg](Images/9781430264453_Fig14-14.jpg)


    [Figure 14-14](#9781430264453_Ch14.xhtml#_Fig14). Aggregating and grouping the
    alarm data


    After aggregating the data, check Load To Data Model under Load Settings and apply
    and close the query.


    Now that you have the data ready for mapping, launch the Power Map designer and
    create a column chart showing the average counts over time, as shown in [Figure
    14-15](#9781430264453_Ch14.xhtml#Fig15).


    ![9781430264453_Fig14-15.jpg](Images/9781430264453_Fig14-15.jpg)


    [Figure 14-15](#9781430264453_Ch14.xhtml#_Fig15). Power Map showing alarm counts
    over time


    After creating and exploring the alarm data in Power Map, save and close Excel.


    Summary


    This chapter provided you with some use cases to help you gauge your mastery of
    the topics in the rest of the book. The goal of this book was to expose you to
    the various tools in Microsoft’s self-service BI stack. Although this book used
    the desktop version of Excel and the BI add-ins, you can also use the Office 365
    versions of these tools. I hope you have gained enough confidence and experience
    with these tools to start using them to analyze and gain insight into your own
    data.


    Now that you have a firm understanding of how to use these tools you should be
    comfortable tackling more complex topics. There are many good resources available
    that cover various techniques and patterns that can be used to analyze your data.
    Microsoft’s Power BI site (`www.microsoft.com/en-us/powerbi/default.aspx`), Bill
    Jelen’s site (`www.mrexcel.com`), and Rob Collie’s Power Pivot Pro site (`www.powerpivotpro.com`)
    are excellent resources. For more advanced topics, check out Chris Webb’s BI Blog
    at `http://cwebbbi.wordpress.com` and Marco Russo’s and Alberto Ferrari’s SQLBI
    site at `www.sqlbi.com/`.


