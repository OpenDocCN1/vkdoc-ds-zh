    \n[Figure 6-6](#9781430264453_Ch06.xhtml#_Fig6). Calculating year-to-date values\n\
    \nYou can also use another set of functions—`DATESMTD`, `DATESQTD`, and `DATESYTD`—to\
    \ create the same measures. Just as with the previous to-date measures, you need\
    \ to pass the date key from the date table to the functions. The following expression\
    \ uses the `CALCULATE` function with the `DATESYTD` filter to get the sales year-to-date\
    \ measure.\n\n```\nYTD Sales 2:=CALCULATE([Sum of Sales],DATESYTD('Date'[Datekey]))\n\
    ```\n\nUsing the `CALCULATE` function and the `DATES` functions is more versatile\
    \ than the total-to-date functions because you can use them for any type of aggregation,\
    \ not just the sum. The following expressions are used to calculate the average\
    \ sales year-to-date. The results are shown in [Figure 6-7](#9781430264453_Ch06.xhtml#Fig7).\n\
    \n```\nAve Sales:=AVERAGE([SalesAmount])\nYTD Ave Sales:=CALCULATE([Ave Sales],DATESYTD('Date'[Datekey]))\n\
    ```\n\n![9781430264453_Fig06-07.jpg](Images/9781430264453_Fig06-07.jpg)\n\n[Figure\
    \ 6-7](#9781430264453_Ch06.xhtml#_Fig7). Calculating average year-to-date values\n\
    \nNow that you know how to create time period–based calculations, you can use\
    \ this to compare past performance with current performance. But first you need\
    \ to know how to shift the date context to calculate past performance.\n\nShifting\
    \ the Date Context\n\nIf you want to compare performance from one period to the\
    \ same period in the past, say sales for the current month to sales for the same\
    \ month a year ago, you need to shift the date context. DAX contains several functions\
    \ that do this. One of the most versatile functions for shifting the date context\
    \ is the `PARALLELPERIOD` function. As with the other time intelligence functions,\
    \ you need to pass the key column of the date table to the function. You also\
    \ need to indicate the number of intervals and the interval type of year, quarter,\
    \ or month.\n\n```\nPARALLELPERIOD(<dates>,<number_of_intervals>,<interval>)\n\
    ```\n\nOne thing to remember is that the `PARALLELPERIOD` function returns a set\
    \ of dates that corresponds to the interval type. If you use the year, it returns\
    \ a year of dates; the month interval returns a month’s worth of dates. The following\
    \ expression calculates the sales totals for the month of the previous year. [Figure\
    \ 6-8](#9781430264453_Ch06.xhtml#Fig8) shows the results of the calculation.\n\
    \n```\nMonth Sales Last Year:=Calculate([Sum of Sales],\nPARALLELPERIOD('Date'[Datekey],-12,Month))\n\
    ```\n\n![9781430264453_Fig06-08.jpg](Images/9781430264453_Fig06-08.jpg)\n\n[Figure\
    \ 6-8](#9781430264453_Ch06.xhtml#_Fig8). Calculating sales for a parallel period\n\
    \nNotice that if you drill down to the date level (see [Figure 6-9](#9781430264453_Ch06.xhtml#Fig9)),\
    \ you still see the month totals for the month of the date for a year ago. As\
    \ mentioned before, this is because the `PARALLELPERIOD` in this case always returns\
    \ the set of dates for the same month as the row date for the previous year.\n\
    \n![9781430264453_Fig06-09.jpg](Images/9781430264453_Fig06-09.jpg)\n\n[Figure\
    \ 6-9](#9781430264453_Ch06.xhtml#_Fig9). Drilling to day level still shows month\
    \ level aggregation\n\nNow that you can calculate the month sales of the previous\
    \ year you can combine it with current sales to calculate the monthly sales growth\
    \ from one year to the next. [Figure 6-10](#9781430264453_Ch06.xhtml#Fig10) shows\
    \ the results.\n\n```\nYOY Monthly Growth:=([Sum of Sales]-[Month Sales Last Year])/[Month\
    \ Sales Last Year] \n```\n\n![9781430264453_Fig06-10.jpg](Images/9781430264453_Fig06-10.jpg)\n\
    \n[Figure 6-10](#9781430264453_Ch06.xhtml#_Fig10). Calculating year over year\
    \ monthly growth\n\nNotice if there is no previous year sales you get an error\
    \ in the pivot table. You can control this by checking if the month sales for\
    \ last year is blank and inserting a blank value instead.\n\n```\nYOY Monthly\
    \ Growth:=IF(\nISBLANK([Month Sales Last Year]),\nBLANK(),\n([Sum of Sales]-[Month\
    \ Sales Last Year])/[Month Sales Last Year])\n```\n\nAnother function commonly\
    \ used to alter the date context is the `DATEADD` function. The `DATEADD` function\
    \ is used to add a date interval to the current date context. You can add year,\
    \ quarter, month, or day intervals.\n\n```\nDATEADD(<dates>,<number_of_intervals>,<interval>)\n\
    ```\n\nThe following calculation is used to find the sum of the previous day sales\
    \ using the `DATEADD` function as a filter.\n\n```\nPrev Day Sales:=Calculate([Sum\
    \ of Sales],DATEADD('Date'[Datekey],-1,day))\n```\n\nNow that you know how to\
    \ shift the date context, it is time to look at functions you can use in your\
    \ filters that return a single date.\n\nUsing Single Date Functions\n\nDAX contains\
    \ a set of functions that return a single date. These are usually used when filtering\
    \ the date context. For example the `FIRSTDATE` function returns the first date\
    \ in the column of dates passed to it. As an example, you can use this in combination\
    \ with the `DATESBETWEEN` function to get the range of dates from the first day\
    \ to the 15th day of the current date context set of dates.\n\n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n\
    \ ,FIRSTDATE('Date'[FullDateAlternateKey])\n,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]),\
    \ 14, DAY))\n```\n\nThis can then be used as a filter in the `CALCULATE` function\
    \ to get the sales during the first 15 days of the period. The resulting pivot\
    \ table is shown in [Figure 6-11](#9781430264453_Ch06.xhtml#Fig11).\n\n![9781430264453_Fig06-11.jpg](Images/9781430264453_Fig06-11.jpg)\n\
    \n[Figure 6-11](#9781430264453_Ch06.xhtml#_Fig11). Calculating sales for the first\
    \ 15 days of the month\n\nIf you are just looking at the monthly periods, you\
    \ can use the functions `STARTOFMONTH` and `ENDOFMONTH` (there are ones for year\
    \ and quarter also.). The following expression is used to calculate the sum of\
    \ the sales for the last 15 days of the month."
  trans: "\n`DAX` 中目前有 35 个内置的时间智能函数。其中一些函数，如 `FIRSTNONBLANK`，会返回单个日期。另一些函数，如 `PREVIOUSMONTH`，会返回一组日期。此外，还有其他函数，如\
    \ `TOTALQTD`，会计算一段时间内的表达式值。目前，`DAX` 内置的时间智能函数支持以 12 月 31 日结束的传统日历。它们还支持具有不同年末日期且包含四个季度、每季度三个月的会计日历。如果你需要使用自定义财务日历，则需要自行创建自定义计算。\n\
    \n现在，你已了解如何在模型中创建和指定日期表，接下来可以看看如何实现一些常用的时间智能函数来分析数据。\n\n## 基于时间段的计算\n\n数据分析中常用的一种分析方法是查看截止到当前日期的值。例如，你可能希望查看年初至今的销售额，或月初至今的能耗。`DAX`\
    \ 提供了 `TOTALMTD`、`TOTALQTD` 和 `TOTALYTD` 函数，这使得此类计算非常容易。例如，年初至今总额的定义如下：\n\n```\n\
    TOTALYTD(<expression>,<dates>[,<filter>][,<year_end_date>])\n```\n\n其中，`表达式`是一个返回标量值的表达式。`日期`是日期表的关键列。`筛选器`是可选筛选表达式，`年末日期`也是可选的——你可以用它来指示会计年度的年末。以下表达式用于计算销售总额和年初至今销售额。\n\
    \n```\nSum of Sales:=SUM(Sales[SalesAmount])\nYTD Sales:=TOTALYTD([Sum of Sales],'Date'[Datekey])\n\
    ```\n\n如果你想计算所有产品的年初至今销售额，请使用以下表达式：\n\n```\nYTD Sales ALL Products:=TOTALYTD([Sum\
    \ of Sales],'Date'[Datekey],ALL('Product'))\n```\n\n图 6-6 在数据透视表中展示了这些度量值。你可以使用这些基础度量值来计算进一步的度量值，例如年初至今销售额占比以及所有产品销售额的百分比。\n\
    \n![9781430264453_Fig06-06.jpg](img/9781430264453_Fig06-06.jpg)\n\n图 6-6。计算年初至今值\n\
    \n你也可以使用另一组函数——`DATESMTD`、`DATESQTD` 和 `DATESYTD`——来创建相同的度量值。与之前的截止到当前日期度量值一样，你需要将日期表中的日期键传递给这些函数。以下表达式使用\
    \ `CALCULATE` 函数和 `DATESYTD` 筛选器来获取年初至今销售额度量值。\n\n```\nYTD Sales 2:=CALCULATE([Sum\
    \ of Sales],DATESYTD('Date'[Datekey]))\n```\n\n使用 `CALCULATE` 函数和 `DATES` 函数比使用总截止日期函数更通用，因为你可以将它们用于任何类型的聚合，而不仅仅是求和。以下表达式用于计算平均年初至今销售额。结果如图\
    \ 6-7 所示。\n\n```\nAve Sales:=AVERAGE([SalesAmount])\nYTD Ave Sales:=CALCULATE([Ave\
    \ Sales],DATESYTD('Date'[Datekey]))\n```\n\n![9781430264453_Fig06-07.jpg](img/9781430264453_Fig06-07.jpg)\n\
    \n图 6-7。计算平均年初至今值\n\n既然你已了解如何创建基于时间段的计算，就可以用它来比较过去的绩效与当前的绩效。但首先，你需要知道如何移动日期上下文来计算过去的绩效。\n\
    \n## 移动日期上下文\n\n如果你想将一个时期的绩效与过去同一时期的绩效进行比较，比如将当月的销售额与一年前同月的销售额进行比较，你就需要移动日期上下文。`DAX`\
    \ 包含多个执行此操作的函数。其中，移动日期上下文最通用的函数之一是 `PARALLELPERIOD`。与其他时间智能函数一样，你需要将日期表的关键列传递给该函数。你还需要指定间隔数量和间隔类型（年、季度或月）。\n\
    \n```\nPARALLELPERIOD(<dates>,<number_of_intervals>,<interval>)\n```\n\n需要记住的一点是，`PARALLELPERIOD`\
    \ 函数返回一组与间隔类型相对应的日期。如果你使用年份，它会返回一年的日期；使用月份间隔，则返回一个月的日期。以下表达式计算上一年同月的销售总额。图 6-8\
    \ 显示了计算结果。\n\n```\nMonth Sales Last Year:=Calculate([Sum of Sales],\nPARALLELPERIOD('Date'[Datekey],-12,Month))\n\
    ```\n\n![9781430264453_Fig06-08.jpg](img/9781430264453_Fig06-08.jpg)\n\n图 6-8。计算并行时期的销售额\n\
    \n请注意，如果你向下钻取到日期级别（请参阅图 6-9），你仍然会看到一年前该日期所在月份的总和。如前所述，这是因为在这种情况下，`PARALLELPERIOD`\
    \ 始终返回与当前行日期对应月份的上一年同月的一组日期。\n\n![9781430264453_Fig06-09.jpg](img/9781430264453_Fig06-09.jpg)\n\
    \n图 6-9。钻取到日级别仍显示月级别聚合\n\n既然你可以计算上一年同月的销售额，就可以将其与当前销售额结合起来，计算逐月同比增长。图 6-10 显示了结果。\n\
    \n```\nYOY Monthly Growth:=([Sum of Sales]-[Month Sales Last Year])/[Month Sales\
    \ Last Year] \n```\n\n![9781430264453_Fig06-10.jpg](img/9781430264453_Fig06-10.jpg)\n\
    \n图 6-10。计算同比月增长\n\n请注意，如果没有上一年同月的销售额，数据透视表中会出现错误。你可以通过检查上个月销售额是否为空，并插入一个空值来控制此问题。\n\
    \n```\nYOY Monthly Growth:=IF(\nISBLANK([Month Sales Last Year]),\nBLANK(),\n\
    ([Sum of Sales]-[Month Sales Last Year])/[Month Sales Last Year])\n```\n\n另一个常用于改变日期上下文的函数是\
    \ `DATEADD`。`DATEADD` 函数用于向当前日期上下文添加一个日期间隔。你可以添加年、季度、月或日间隔。\n\n```\nDATEADD(<dates>,<number_of_intervals>,<interval>)\n\
    ```\n\n以下计算使用 `DATEADD` 函数作为筛选器，查找前一天的销售总额。\n\n```\nPrev Day Sales:=Calculate([Sum\
    \ of Sales],DATEADD('Date'[Datekey],-1,day))\n```\n\n现在你已了解如何移动日期上下文，接下来看看可用于筛选器并返回单个日期的函数。\n\
    \n## 使用单日期函数\n\n`DAX` 包含一组返回单个日期的函数。这些函数通常用于筛选日期上下文。例如，`FIRSTDATE` 函数返回传递给它的日期列中的第一个日期。举例来说，你可以将其与\
    \ `DATESBETWEEN` 函数结合使用，以获取从当前日期上下文日期集的第一个日期到第 15 天的日期范围。\n\n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n\
    \ ,FIRSTDATE('Date'[FullDateAlternateKey])\n,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]),\
    \ 14, DAY))\n```\n\n然后，这可以在 `CALCULATE` 函数中用作筛选器，以获取该时期前 15 天的销售额。生成的数据透视表如图 6-11\
    \ 所示。\n\n![9781430264453_Fig06-11.jpg](img/9781430264453_Fig06-11.jpg)\n\n图 6-11。计算月前\
    \ 15 天的销售额\n\n如果你只看月度期间，你可以使用函数 `STARTOFMONTH` 和 `ENDOFMONTH`（也有针对年和季度的此类函数）。以下表达式用于计算月最后\
    \ 15 天的销售总额。\n"
- fmt: "`Last 15 Day Sales` := `CALCULATE(SUM(InternetSales[SalesAmount]), DATESBETWEEN('Date'[FullDateAlternateKey],\
    \ DATEADD(ENDOFMONTH('Date'[FullDateAlternateKey]), -14, DAY), ENDOFMONTH('Date'[FullDateAlternateKey])))`\n\
    \nAlthough the majority of measures you need to aggregate from a lower level to\
    \ a higher level (for example, from days to months) are simple extensions of the\
    \ base aggregate, at times you need to use special aggregations to roll up the\
    \ measure. This type of measure is considered semi-additive and is covered in\
    \ the next section.\n\n## Creating Semi-additive Measures\n\nYou often encounter\
    \ semi-additive measures when analyzing data. Some common examples are inventory\
    \ and account balances. For example, to determine the total amount of inventory\
    \ at a current point in time, you add the inventory of all stores. However, to\
    \ find the total inventory of a store at the end of the month, you do not add\
    \ up the inventory for each day.\n\nIn order to deal with these situations DAX\
    \ contains the `FIRSTNONBLANK` and `LASTNONBLANK` functions. These functions return\
    \ the first or last date for a non-blank condition. For example, the following\
    \ expression determines the last non-blank date for the product inventory entries.\n\
    \n```\nLASTNONBLANK ('Date'[DateKey],CALCULATE (SUM(Inventory[UnitsInStock]))\n\
    ```\n\nThis is then combined with the `CALCULATE` function to determine the total\
    \ units in stock.\n\n```\nProduct Units In Stock:=CALCULATE(SUM(Inventory[UnitsInStock]),\n\
    \  LASTNONBLANK('Date'[DateKey],\n   CALCULATE(SUM(Inventory[UnitsInStock]))))\n\
    ```\n\nNow if you want to add up the units in stock across products, you can use\
    \ the following expression.\n\n```\nTotal Units In Stock:=SUMX(VALUES('Inventory'[ProductKey]),[Product\
    \ Units In Stock])\n```\n\n[Figure 6-12](#9781430264453_Ch06.xhtml#Fig12) shows\
    \ the resulting pivot table. Notice the `Total Units In Stock` measure is additive\
    \ across the products but non-additive across the dates.\n\n![9781430264453_Fig06-12.jpg](Images/9781430264453_Fig06-12.jpg)\n\
    \n[Figure 6-12](#9781430264453_Ch06.xhtml#_Fig12). Calculating units in stock\n\
    \nOne of the advantages of DAX is that once you learn a pattern you can extend\
    \ this to other scenarios. For example, you can employ the same techniques used\
    \ in this inventory calculation when calculating measures in a cash flow analysis.\
    \ The following calculation is used to calculate the ending balance.\n\n```\n\
    Balance:=CALCULATE ( SUM ( Finance[Amount]),\n  LASTNONBLANK ('Date'[DateKey],\n\
    \   CALCULATE(SUM ( Finance[Amount]))))\n```\n\nIn the previous examples the inventory\
    \ and balance were only entered as a row in the table when a change in inventory\
    \ or balance occurred. Often the balance or inventory is entered every day and\
    \ the same value is repeated until there is a change. In these cases, you can\
    \ use the DAX functions `CLOSINGBALANCEMONTH`, `CLOSINGBALANCEQUARTER`, and `CLOSINGBALANCYEAR`.\
    \ These functions look at the last date of the time period and use that as the\
    \ value for the time period. In other words, whatever the value is on the last\
    \ day of the month is returned by the `CLOSINGBALANCEMONTH` function.\n\nAt this\
    \ point you should have a good grasp of how the various time functions work. In\
    \ the following lab you will gain experience implementing some of these functions.\n\
    \n## HANDS-ON LAB—IMPLEMENTING TIME INTELLIGENCE IN POWER PIVOT\n\nIn the following\
    \ lab you will\n\n*   Create a date table.\n*   Use time intelligence functions\
    \ to analyze data.\n*   Create a Month over Month Growth pivot table.\n*   Create\
    \ an Inventory Level Report.\n\n1.  In the `LabStarters` folder, open the `LabChapter6.xlsx`\
    \ file. This file contains inventory and sales data from the test Consoto database.\n\
    2.  Open the Power Pivot window in diagram view mode (see [Figure 6-13](#9781430264453_Ch06.xhtml#Fig13)).\
    \ Notice there is no `Date` table. We could load one from the data source or create\
    \ one in Excel.\n\n![9781430264453_Fig06-13.jpg](Images/9781430264453_Fig06-13.jpg)\n\
    \n[Figure 6-13](#9781430264453_Ch06.xhtml#_Fig13). The current Consoto data model\n\
    \n3.  To create the `Date` table in Excel, switch to sheet 3. Select the first\
    \ cell and enter a column name of **DateKey**. In the second cell of the column\
    \ enter a value of **1/1/2007**. Use the auto fill feature of Excel to add values\
    \ through 12/31/2009.\n4.  To create a table from the values, select the values\
    \ in column A. Under the Home tab select the Format As Table drop-down and select\
    \ a format. Under the Table Tools Design tab change the table name to `Date` (see\
    \ [Figure 6-14](#9781430264453_Ch06.xhtml#Fig14)).\n\n![9781430264453_Fig06-14.jpg](Images/9781430264453_Fig06-14.jpg)\n\
    \n[Figure 6-14](#9781430264453_Ch06.xhtml#_Fig14). Creating the date table\n\n\
    5.  To add the table to the model, select the table and under the PowerPivot tab\
    \ click the Add To Data Model button (see [Figure 6-15](#9781430264453_Ch06.xhtml#Fig15)).\n\
    \n![9781430264453_Fig06-15.jpg](Images/9781430264453_Fig06-15.jpg)\n\n[Figure\
    \ 6-15](#9781430264453_Ch06.xhtml#_Fig15). Adding the Excel table to the data\
    \ model\n\n6.  You should see the table in the data view window of the Power Pivot\
    \ design window. Click on the Design tab and select Mark As Date Table. Use the\
    \ `DateKey` as the unique identifier.\n7.  Use the `Date` functions to create\
    \ a Year, Month Number, and Month column (You have to use the `FORMAT` function\
    \ to create the Month column). Sort the Month column by the Month Number column.\n\
    8.  Switch to the diagram view of the model. Using the Year and Month, create\
    \ a Calendar hierarchy in the `Date` table.\n9.  Create a relationship between\
    \ the `Sales` table and `Date` table (see [Figure 6-16](#9781430264453_Ch06.xhtml#Fig16)).\n\
    \n![9781430264453_Fig06-16.jpg](Images/9781430264453_Fig06-16.jpg)\n\n[Figure\
    \ 6-16](#9781430264453_Ch06.xhtml#_Fig16). Creating the relationship between the\
    \ Sales and Date table\n\n10.  Select the `Sales` table in the Data View window.\
    \ Add the following measures and format them as currency:\n\n```\n    Sum of Sales:=SUM(Sales[SalesAmount])\n\
    \    YTD Sales:=TOTALYTD([Sum of Sales],'Date'[Datekey])\n    MTD Sales:=TOTALMTD([Sum\
    \ of Sales],'Date'[Datekey])\n```\n\n11.  To test the measures, go to Sheet1 in\
    \ Excel and click on cell B2. On the Insert tab, select PivotTable. In the Create\
    \ PivotTable window, select Use An External Data Source and click the Choose Connection\
    \ button (see [Figure 6-17](#9781430264453_Ch06.xhtml#Fig17)).\n\n![9781430264453_Fig06-17.jpg](Images/9781430264453_Fig06-17.jpg)\n\
    \n[Figure 6-17](#9781430264453_Ch06.xhtml#_Fig17). Choosing an external data source\n\
    \n12.  In the Existing Connections window select the Tables tab. In the Tables\
    \ tab select Tables In Workbook Data Model and click Open (see [Figure 6-18](#9781430264453_Ch06.xhtml#Fig18)).\
    \ After selecting the connection, click OK in the Create PivotTable window.\n\n\
    ![9781430264453_Fig06-18.jpg](Images/9781430264453_Fig06-18.jpg)\n\n[Figure 6-18](#9781430264453_Ch06.xhtml#_Fig18).\
    \ Selecting the data model connection\n\n13.  Add the measures `Sum Of Sales`,\
    \ `MTD Sales`, and `YTD Sales` to the Values area and the `Calendar` hierarchy\
    \ to the Rows area. In the Insert tab select Slicer and choose the `ChannelName`.\
    \ Investigate the data and verify that is what you expected (see [Figure 6-19](#9781430264453_Ch06.xhtml#Fig19)).\n\
    \n![9781430264453_Fig06-19.jpg](Images/9781430264453_Fig06-19.jpg)\n\n[Figure\
    \ 6-19](#9781430264453_Ch06.xhtml#_Fig19). Verifying the year-to-date sales measure\n\
    \n14.  Switch to the `Sales` table in the Data Model. Create a rolling 3 month\
    \ sales measure with the following expression. Format the measure as currency.\n\
    \n```\nRolling 3 Month Sales:=CALCULATE([Sum of Sales],\n  DATESINPERIOD('Date'[Datekey],LASTDATE('Date'[Datekey]),-3,MONTH))\n\
    ```\n\n15.  Add the measure to the pivot table on Sheet1 and verify it is working\
    \ as expected.\n16.  Next you want to compare sales growth from one month to the\
    \ next. First create a previous month’s sales measure.\n\n```\nPrev Month Sales:=CALCULATE([Sum\
    \ of Sales],\n  PARALLELPERIOD('Date'[DateKey],-1,MONTH))\n```"
