- fmt: '# 示例1：使用时间戳跟踪变化


    在前面的示例中，您会知道其中一行是错误的，因为同一个人不可能有两个不同的生日。然而，很多时候您希望跟踪实体属性值的变化。例如，产品的标价可能会随时间变化。为了跟踪这种变化，您需要添加一个时间戳使该行唯一。这样，每行都可以通过产品编号和时间戳来标识，如[图
    3-1](#9781430264453_Ch03.xhtml#Fig1)所示。


    ![9781430264453_Fig03-01.jpg](Images/9781430264453_Fig03-01.jpg)


    [图 3-1](#9781430264453_Ch03.xhtml#_Fig1). 使用时间戳跟踪变化


    一旦确定了模型中的表，重要的是您要认识到这些表是否设置得当以高效执行。这个过程称为*规范化*模型。规范化是组织数据以使数据查询更简单、更高效的过程。例如，您不应将不相关实体的属性混合在同一张表中——您不会希望将产品数据和员工数据放在同一张表中。正确的规范化的另一个例子是不要在一个列中保存多个属性。例如，与其使用一个客户地址列，不如将其拆分为街道、城市、州和邮政编码。这样，您就可以轻松地按州或城市分析数据。如[图
    3-2](#9781430264453_Ch03.xhtml#Fig2)所示的电子表格是一个典型的未规范化的表。如果您发现提供给您的数据规范化不足，您可能需要要求数据提供方将数据拆分为多个表，然后在您的模型中关联起来。


    ![9781430264453_Fig03-02.jpg](Images/9781430264453_Fig03-02.jpg)


    [图 3-2](#9781430264453_Ch03.xhtml#_Fig2). 一个未规范化的表


    当您对模型中表的规范化程度满意后，下一步是确定表之间的关系。例如，您需要关联客户表、销售表和产品表，以便按年龄段分析各产品的销售情况。您通过使用*键*来关联不同的表。表中的每一行需要一个列或列的组合来唯一标识该行。这称为*主键*。该键可能很容易识别，例如在数据录入时由业务分配的销售订单号或客户号。有时您需要对表进行一些分析以找到主键，尤其是当您从外部来源获取数据时。例如，您可能获得包含潜在客户的数据。字段包括姓名、城市、州、邮政编码、出生日期等。您不能仅仅使用姓名作为键，因为很可能有多个同名的客户。如果您使用姓名和城市的组合，那么使用相同键标识多个客户的可能性就会降低。随着您使用更多列，例如邮政编码和出生日期，出现重复的概率会更低。


    当您在模型中关联表时，一个表的主键会成为关联表中的外键。例如，要将客户与其销售记录关联起来，客户键需要包含在销售表中，在那里它被视为外键。在提取数据时，使用键来获取相关数据。出于性能考虑，到目前为止最好的键类型是单列整数。因此，许多数据库表都设计有代理键。这个键是在加载记录时分配给该记录的整数。它不是使用自然键，而是使用代理键来连接表。[图
    3-3](#9781430264453_Ch03.xhtml#Fig3)显示了一个典型的数据库表，其中同时包含代理键（`CustomerKey`）和自然键（`CustomerAlternateKey`）。


    ![9781430264453_Fig03-03.jpg](Images/9781430264453_Fig03-03.jpg)


    [图 3-3](#9781430264453_Ch03.xhtml#_Fig3). 包含代理键和自然键的表


    重要的是您要了解数据源中使用的键。如果您能从源中检索出键，那会好得多。当您从关系型数据库中检索数据时，这通常不是问题，但如果您要合并来自不同系统的数据，请确保您有适当的键。


    一旦确定了表之间的键，您就可以在 Power Pivot 模型中创建关系了。


    ## 创建表关系


    在 Power Pivot 模型中建立表关系时，需要记住一些规则。首先，您不能在模型中使用复合键。如果您的表使用复合键，您需要将复合列拼接在一起创建一个新列，并将该列用作键。其次，两个表之间只能有一个活动关系路径，但可以有多个非活动关系。第三，关系是一对多的；换句话说，在客户表（一端）和销售表（多端）之间创建关系是可以的。然而，不允许直接在客户表和产品表之间创建关系，因为一个客户可以购买多种产品，而同一产品可以被多个客户购买。在这些情况下，您需要创建一个连接表来连接这些表。


    要在 Power Pivot 模型中创建两个表之间的关系，请打开数据模型管理器并切换到关系图视图。右键单击代表关系多端的表，然后选择**创建关系**。这将启动**创建关系**窗口。选择相关的查找表（一端）和键列。[图
    3-4](#9781430264453_Ch03.xhtml#Fig4)展示了在销售表和商店表之间创建关系的过程。默认情况下，在表之间创建的第一个关系被标记为活动关系。


    ![9781430264453_Fig03-04.jpg](Images/9781430264453_Fig03-04.jpg)


    [图 3-4](#9781430264453_Ch03.xhtml#_Fig4). 创建表关系


    [图 3-5](#9781430264453_Ch03.xhtml#Fig5)展示了关系图视图中生成的关系。如果单击关系箭头，关系的两个键列会被高亮显示。


    ![9781430264453_Fig03-05.jpg](Images/9781430264453_Fig03-05.jpg)


    [图 3-5](#9781430264453_Ch03.xhtml#_Fig5). 在关系图视图中查看关系


    您可以在两个表之间创建多个关系，但请记住，只有一个可以是活动关系。如果您尝试创建两个活动关系，将会收到类似[图 3-6](#9781430264453_Ch03.xhtml#Fig6)所示的错误。


    ![9781430264453_Fig03-06.jpg](Images/9781430264453_Fig03-06.jpg)


    [图 3-6](#9781430264453_Ch03.xhtml#_Fig6). 试图在两个表之间创建第二个活动关系


    有时活动关系并不那么明显。[图 3-7](#9781430264453_Ch03.xhtml#Fig7)展示了销售表和日期表之间的一个活动关系，以及销售表和商店表之间的另一个活动关系。商店表和日期表之间还有一条非活动关系。如果您尝试将此关系设置为活动，您将收到与[图
    3-6](#9781430264453_Ch03.xhtml#Fig6)相同的错误消息。这是因为您可以从日期表追踪到销售表，再到商店表的一条活动路径。


    ![9781430264453_Fig03-07.jpg](Images/9781430264453_Fig03-07.jpg)


    [图 3-7](#9781430264453_Ch03.xhtml#_Fig7). 一个间接的活动关系


    您可能遇到的另一个常见错误是，当您尝试在两个表之间创建关系时，键在至少一个表中不是唯一的。[图 3-8](#9781430264453_Ch03.xhtml#Fig8)展示了一个产品表和一个销售表，两者都包含重复的`ProductNumber`。


    ![9781430264453_Fig03-08.jpg](Images/9781430264453_Fig03-08.jpg)'
  raw: 'In the previous example, you would know that one of the rows was incorrect
    because the same person could not have two different birthdays. There are many
    times, however, when you want to track changes in attribute values for an entity.
    For example, a product’s list price will probably change over time. To track the
    change, you need to add a time stamp to make the row unique. Then each row can
    be identified by the product number and time stamp, as shown in [Figure 3-1](#9781430264453_Ch03.xhtml#Fig1).


    ![9781430264453_Fig03-01.jpg](Images/9781430264453_Fig03-01.jpg)


    [Figure 3-1](#9781430264453_Ch03.xhtml#_Fig1). Using a time stamp to track changes


    Once you have the tables of the model identified, it is important that you recognize
    whether the tables are set up to perform efficiently. This process is called *normalizing*
    the model. Normalization is the process of organizing the data to make data querying
    easier and more efficient. For example, you should not mix attributes of unrelated
    entities together in the same table—you would not want product data and employee
    data in the same table. Another example of proper normalization is not to hold
    more than one attribute in a column. For example, instead of having one customer
    address column, you would break it up into street, city, state, and zip. This
    would allow you to easily analyze the data by state or by city. The spread sheet
    shown in [Figure 3-2](#9781430264453_Ch03.xhtml#Fig2) shows a typically non-normalized
    table. If you find that the data supplied to you is not sufficiently normalized,
    you may have to ask whoever is supplying the data to break the data up into multiple
    tables that you can then relate together in your model.


    ![9781430264453_Fig03-02.jpg](Images/9781430264453_Fig03-02.jpg)


    [Figure 3-2](#9781430264453_Ch03.xhtml#_Fig2). A non-normalized table


    Once you are satisfied the tables in your model are adequately normalized, the
    next step is to determine how the tables are related. For example, you need to
    relate the customer table, sales table, and product table in order to analyze
    how various products are selling by age group. The way you relate the different
    tables is through the use of *keys*. Each row in a table needs a column or a combination
    of columns that uniquely identifies the row. This is called the *primary key*.
    The key may be easily identified, such as a sales order number or a customer number
    that has been assigned by the business when the data was entered. Sometimes you
    will need to do some analysis of a table to find the primary key, especially if
    you get the data from an outside source. For example, you may get data that contains
    potential customers. The fields are name, city, state, zip, birth date, and so
    on. You cannot just use the name as the key because it is very likely that you
    have more than one customer with the same name. If you use the combination of
    name and city, you have less of a chance of having more than one customer identified
    by the same key. As you use more columns, such as zip and birth date, your odds
    get even better.


    When you go to relate tables in the model the primary key from one table becomes
    a foreign key in the related table. For example, to relate a customer to their
    sales, the customer key needs to be contained in the sales table where it is considered
    a foreign key. When extracting the data, the keys are used to get the related
    data. By far the best type of key to use for performance reasons is a single column
    integer. For this reason, a lot of database tables are designed with a surrogate
    key. This key is an integer that gets assigned to the record when it is loaded.
    Instead of using the natural key, the surrogate is used to connect the tables.
    [Figure 3-3](#9781430264453_Ch03.xhtml#Fig3) shows a typical database table containing
    both the surrogate key (CustomerKey) and the natural key (CustomerAlternateKey).


    ![9781430264453_Fig03-03.jpg](Images/9781430264453_Fig03-03.jpg)


    [Figure 3-3](#9781430264453_Ch03.xhtml#_Fig3). A table containing both a surrogate
    key and a natural key


    It is important that you are aware of the keys used in your sources of data. If
    you can retrieve the keys from the source, you are much better off. This is usually
    not a problem when you are retrieving data from a relational database, but if
    you are combining data from different systems, make sure you have the appropriate
    keys.


    Once you have the keys between the tables identified you are ready to create the
    relationships in the Power Pivot model.


    Creating Table Relations


    There are a few rules to remember when establishing table relationships in a Power
    Pivot model. First, you cannot use composite keys in the model. If your table
    uses a composite key, you will need to create a new column by concatenating the
    composite columns together and using this column as the key. Second, you can only
    have one active relationship path between two tables, but you can have multiple
    inactive relationships. Third, relationships are one to many; in other words,
    creating a relationship between the customer table (one side) and the sales table
    (many sides) is okay. Creating a direct relationship between the customers table
    and the products table is not allowed, however, because the customer can buy many
    products and the same product can be bought by many customers. In these cases
    you create a junction table to connect the tables together.


    To create a relationship between two tables in the Power Pivot model you open
    up the Data Model Manager and switch to the diagram view. Right click on the table
    that represents the many side of the relationship and select Create Relationship.
    This launches the Create Relationship window. Select the related lookup table
    (the one side) and the key column. [Figure 3-4](#9781430264453_Ch03.xhtml#Fig4)
    shows creating a relationship between the Sales table and the Store table. By
    default the first relationship created between the tables is marked as the active
    relationship.


    ![9781430264453_Fig03-04.jpg](Images/9781430264453_Fig03-04.jpg)


    [Figure 3-4](#9781430264453_Ch03.xhtml#_Fig4). Creating a table relationship


    [Figure 3-5](#9781430264453_Ch03.xhtml#Fig5) shows the resulting relationship
    in the diagram view. If you click on the relationship arrow, the two key columns
    of the relationship are highlighted.


    ![9781430264453_Fig03-05.jpg](Images/9781430264453_Fig03-05.jpg)


    [Figure 3-5](#9781430264453_Ch03.xhtml#_Fig5). Viewing a relationship in the diagram
    view


    You can create more than one relationship between two tables, but remember, only
    one can be the active relationship. If you try to make two active relationships,
    you get an error like the one shown in [Figure 3-6](#9781430264453_Ch03.xhtml#Fig6).


    ![9781430264453_Fig03-06.jpg](Images/9781430264453_Fig03-06.jpg)


    [Figure 3-6](#9781430264453_Ch03.xhtml#_Fig6). Trying to create a second active
    relationship between two tables


    Sometimes the active relationship is not so obvious. [Figure 3-7](#9781430264453_Ch03.xhtml#Fig7)
    shows an active relationship between the Sales table and the Date table and another
    one between the Sales table and the Store table. There is also an inactive relationship
    between the Store table and the Date table. If you try to make this one active,
    you get the same error message shown in [Figure 3-6](#9781430264453_Ch03.xhtml#Fig6).
    This is because you can trace an active path from the Date table to the Sales
    table to the Store table.


    ![9781430264453_Fig03-07.jpg](Images/9781430264453_Fig03-07.jpg)


    [Figure 3-7](#9781430264453_Ch03.xhtml#_Fig7). An indirect active relationship


    Another common error you may run into is when you try to create a relationship
    between two tables and the key is not unique in at least one of the tables. [Figure
    3-8](#9781430264453_Ch03.xhtml#Fig8) shows a Product table and a Sales table that
    both contain duplicate ProductNumbers.


