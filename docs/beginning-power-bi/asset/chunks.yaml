    \ 5-31](#9781430264453_Ch05.xhtml#_Fig31). Viewing the KPI\n\n## Summary\n\nThis\
    \ was a long and meaty chapter. You now have a firm grasp of how to create measures\
    \ in your Power Pivot model. You should also understand data context and how it\
    \ affects the measurements. This can be a very confusing concept when you start\
    \ to develop more complex measures. Don’t worry; the more you work with it the\
    \ clearer it becomes.\n\nThe next chapter extends the concepts of this chapter.\
    \ One of the most common types of data analysis is comparing values over time.\
