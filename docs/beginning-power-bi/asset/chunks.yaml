    BI 工具集的一部分，但微软为 Excel 提供的一组表分析工具允许你使用数据挖掘算法，同时隐藏了实现这些算法的大部分复杂性。使用这些 Excel 表分析工具，你可以执行高级数据分析，例如预测、聚类和关联。本章将向你展示如何使用这些工具来实现一些常见的数据挖掘模型，并深入了解你的数据。不过，我需要说明的是，要实现这些表分析工具，你需要能够连接到
