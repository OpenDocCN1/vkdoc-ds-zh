    After you run the analysis two new worksheets are inserted. The first one, Shopping
    Basket Bundled Item, shows the items that are found bundled together as well as
    the bundle size, number of sales, the average value of the sales, and the overall
    value of the bundle (see [Figure 13-21](#9781430264453_Ch13.xhtml#Fig21)).


    ![9781430264453_Fig13-21.jpg](Images/9781430264453_Fig13-21.jpg)


    [Figure 13-21](#9781430264453_Ch13.xhtml#_Fig21). The results of the analysis
    showing bundled items sold


    The second worksheet, Shopping Basket Recommendations, lists recommendations for
    products that have a high probability of being sold together. For example, if
    a customer buys a road bottle cage, you should recommend that they also buy a
    water bottle (see [Figure 13-22](#9781430264453_Ch13.xhtml#Fig22)). This worksheet
    also contains statistics like the percent of linked sales and the average value
    of the recommendation.


    ![9781430264453_Fig13-22.jpg](Images/9781430264453_Fig13-22.jpg)


    [Figure 13-22](#9781430264453_Ch13.xhtml#_Fig22). Recommendations for cross selling
    items


    Now that you have seen how the various table analysis tools work, it is time to
    get some hands-on experience using a few of the tools.


    HANDS-ON LAB—USING THE TABLE ANALYSIS TOOLS IN EXCEL


    In the following lab you will


    *   Determine the key influencers for owning a home.

    *   Detect the various customer groups.

    *   Perform a shopping basket analysis on purchased products.

    *   Forecast pollution emissions.


    1.  In the `LabStarters` folder, open the `LabChapter13.xlsx` file. This file
    contains sample customer data. You will perform data mining on this data using
    the table analysis tools.

    2.  On the Influencers worksheet, click anywhere on the data table to show the
    Table Tools Analyze tab. On this tab, select the Analyze Key Influencers button.
    In the Column Selection window, select the Home Owner column to analyze for key
    factors.

    3.  Select the following columns to be used for analysis: Marital Status, Gender,
    Income, Children, Education, Occupation, Cars, Commute Distance, and Age. Run
    the analysis and when the Discrimination Reporting window (see [Figure 13-23](#9781430264453_Ch13.xhtml#Fig23))
    appears, you can close it because there are only two values to compare and they
    have already been added to the report.


    ![9781430264453_Fig13-23.jpg](Images/9781430264453_Fig13-23.jpg)


    [Figure 13-23](#9781430264453_Ch13.xhtml#_Fig23). Choosing values to compare


    4.  In the Key Influencers report, notice that of the columns analyzed, marital
    status was the key influencer. The number of children and commute distance are
    also influencers, however. Just as interesting is the fact that education and
    age are not key influencers. This might be an area you want to investigate further
    especially because it may be a result of not having a large enough sample size.

    5.  To detect the various groups of customers, select the Categories worksheet.
    Click anywhere on the table and then select the Detect Categories tool on the
    Table Tools Analyze tab.

    6.  In the Detect Categories tool, select the Marital Status, Gender, Income,
    Children, Education, Occupation, and Age checkboxes, and then click the Run button.

    7.  On the Categories worksheet, notice there are six categories. Use the Category
    Characteristics table to determine the characteristics most important to each
    group (see [Figure 13-24](#9781430264453_Ch13.xhtml#Fig24)). You can rename the
    categories; for example, Category 1 is dominated by low income and you could rename
    it to reflect this.


    ![9781430264453_Fig13-24.jpg](Images/9781430264453_Fig13-24.jpg)


    [Figure 13-24](#9781430264453_Ch13.xhtml#_Fig24). Determining the significant
    charateristics of a category group


    8.  Below the table is a chart of category profiles that you can use to analyze
    the distribution of values of the various attributes for the categories. Take
    some time to analyze the data by changing the categories and columns that display
    on the chart.

    9.  To perform shopping basket analysis on products purchased, select the Shopping
    Basket Worksheet. This contains items purchased at a grocery store. Click anywhere
    on the data table and select the Shopping Basket Analysis tool on the Table Tools
    Analyze tab.

    10.  On the Shopping Basket Analysis window, select the Order ID column for the
    Transaction ID. For the Item, select the Item column and leave the Item Value
    set to No Value Column.

    11.  Select the Advanced link, and in the Advanced Parameters Setting window,
    change Minimum Support to 20 items and Minimum Rule Probability to 50%.

    12.  Run the analysis and in the Shopping Basket Recommendations table, notice
    that 60% of the time a customer buys milk when they purchase cereal (see [Figure
    13-25](#9781430264453_Ch13.xhtml#Fig25)).


    ![9781430264453_Fig13-25.jpg](Images/9781430264453_Fig13-25.jpg)


    [Figure 13-25](#9781430264453_Ch13.xhtml#_Fig25). Viewing the cross-selling recommendations


    13.  To perform forecasting, select the Forecast tab, which contains pollutant
    emissions for several states from 2000 to 2010\. Click anywhere on the data table
    and select the Forecast tool on the Table Tools Analyze tab.

    14.  In the Forecast window, select the State columns for forecasting. Set Time
    Stamp to Year and the Periodicity Of Data to Yearly (see [Figure 13-26](#9781430264453_Ch13.xhtml#Fig26)).


    ![9781430264453_Fig13-26.jpg](Images/9781430264453_Fig13-26.jpg)


    [Figure 13-26](#9781430264453_Ch13.xhtml#_Fig26). Selecting the forecasting attributes


    15.  Run the forecast. You will now see a forecasting graph that shows the forecast
    as dashed line extensions to the actual values (see [Figure 13-27](#9781430264453_Ch13.xhtml#Fig27)).


    ![9781430264453_Fig13-27.jpg](Images/9781430264453_Fig13-27.jpg)


    [Figure 13-27](#9781430264453_Ch13.xhtml#_Fig27). The resulting forecast graph


    16.  When you are done experimenting with the table analysis tools, save and close
    the Excel workbook.


    Summary'
  trans: 'Figure 13-19. 选择要分析的列


    选择`Advanced`链接会打开一个窗口，您可以在其中调整算法的敏感度（参见 Figure 13-20）。提高`Minimum Support`和`Minimum
    Rule Probability`参数会减少结果中的项目数量，但会提高结果的显著性。


    ![9781430264453_Fig13-20.jpg](img/9781430264453_Fig13-20.jpg)


    Figure 13-20. 指定最小参数值


    运行分析后，会插入两个新的工作表。第一个工作表 `Shopping Basket Bundled Item` 会显示被捆绑在一起找到的项目，以及捆绑规模、销售数量、平均销售额和捆绑总价值（参见
    Figure 13-21）。


    ![9781430264453_Fig13-21.jpg](img/9781430264453_Fig13-21.jpg)


    Figure 13-21. 显示已售捆绑产品的分析结果


    第二个工作表 `Shopping Basket Recommendations` 列出了同时售出概率较高的产品推荐。例如，如果客户购买了一个公路自行车水壶架，您应该推荐他们也购买一个水壶（参见
    Figure 13-22）。这个工作表还包含统计信息，比如关联销售占比和推荐的平均价值。


    ![9781430264453_Fig13-22.jpg](img/9781430264453_Fig13-22.jpg)


    Figure 13-22. 交叉销售产品的推荐


    现在您已经了解了各种表分析工具的工作原理，是时候亲自动手实践其中一些工具了。


    ## 动手实验——在 Excel 中使用表分析工具


    在以下实验中，您将会：


    -   确定拥有住房的关键影响因素。

    -   检测不同的客户群体。

    -   对已购产品进行购物篮分析。

    -   预测污染物排放。


    1.  在 `LabStarters` 文件夹中，打开 `LabChapter13.xlsx` 文件。此文件包含示例客户数据。您将使用表分析工具对此数据进行数据挖掘。

    2.  在 `Influencers` 工作表中，点击数据表的任意位置以显示 `Table Tools Analyze` 选项卡。在此选项卡上，选择 `Analyze
    Key Influencers` 按钮。在 `Column Selection` 窗口中，选择 `Home Owner` 列以分析关键因素。

    3.  选择以下用于分析的列：`Marital Status`、`Gender`、`Income`、`Children`、`Education`、`Occupation`、`Cars`、`Commute
    Distance` 和 `Age`。运行分析，当出现 `Discrimination Reporting` 窗口（参见 Figure 13-23）时，您可以关闭它，因为只有两个值需要比较，并且它们已被添加到报告中。


    ![9781430264453_Fig13-23.jpg](img/9781430264453_Fig13-23.jpg)


    Figure 13-23. 选择要比较的值


    4.  在 `Key Influencers` 报告中，请注意，在所分析的列中，婚姻状况是关键影响因素。然而，孩子数量和通勤距离也是影响因素。同样有趣的是，教育程度和年龄并不是关键影响因素。这可能是一个您希望进一步调查的领域，尤其是因为这可能是由于样本量不够大所致。

    5.  要检测不同的客户群体，请选择 `Categories` 工作表。点击表格的任意位置，然后在 `Table Tools Analyze` 选项卡上选择
    `Detect Categories` 工具。

    6.  在 `Detect Categories` 工具中，勾选 `Marital Status`、`Gender`、`Income`、`Children`、`Education`、`Occupation`
    和 `Age` 复选框，然后单击 `Run` 按钮。

    7.  在 `Categories` 工作表上，注意有六个类别。使用 `Category Characteristics` 表来确定对每个群体最重要的特征（参见
    Figure 13-24）。您可以重命名这些类别；例如，类别 1 主要由低收入群体构成，您可以重命名它以反映这一点。


    ![9781430264453_Fig13-24.jpg](img/9781430264453_Fig13-24.jpg)


    Figure 13-24. 确定一个类别群体的显著特征


    8.  表格下方是一个类别概况图表，您可以使用它来分析各个类别不同属性值的分布情况。花些时间通过更改图表上显示的类别和列来分析数据。

    9.  要对已购产品进行购物篮分析，请选择 `Shopping Basket` 工作表。此表包含在杂货店购买的物品。点击数据表的任意位置，然后在 `Table
    Tools Analyze` 选项卡上选择 `Shopping Basket Analysis` 工具。

    10. 在 `Shopping Basket Analysis` 窗口中，为 `Transaction ID` 选择 `Order ID` 列。对于 `Item`，选择
    `Item` 列，并将 `Item Value` 设置为 `No Value Column`。

    11. 选择 `Advanced` 链接，在 `Advanced Parameters Setting` 窗口中，将 `Minimum Support` 改为
    20 个项目，将 `Minimum Rule Probability` 改为 50%。

    12. 运行分析，在 `Shopping Basket Recommendations` 表中，注意当客户购买麦片时，有 60% 的概率他们也会购买牛奶（参见
    Figure 13-25）。


    ![9781430264453_Fig13-25.jpg](img/9781430264453_Fig13-25.jpg)


    Figure 13-25. 查看交叉销售推荐


    13. 要进行预测，请选择 `Forecast` 选项卡，其中包含 2000 年至 2010 年多个州的污染物排放数据。点击数据表的任意位置，然后在 `Table
    Tools Analyze` 选项卡上选择 `Forecast` 工具。

    14. 在 `Forecast` 窗口中，选择要预测的 `State` 列。将 `Time Stamp` 设置为 `Year`，并将 `Periodicity
    Of Data` 设置为 `Yearly`（参见 Figure 13-26）。


    ![9781430264453_Fig13-26.jpg](img/9781430264453_Fig13-26.jpg)


    Figure 13-26. 选择预测属性


    15. 运行预测。您现在将看到一个预测图，该图将预测显示为实际值上的虚线延伸（参见 Figure 13-27）。


    ![9781430264453_Fig13-27.jpg](img/9781430264453_Fig13-27.jpg)


    Figure 13-27. 最终的预测图


    16. 当您完成对表分析工具的尝试后，保存并关闭 Excel 工作簿。


    ## 总结'
- fmt: "## CHAPTER 14\n\n![image](Images/frontdot.jpg)\n\n# Creating a Complete Solution\n\
    \nAlthough data mining is one of the most underutilized areas of business intelligence,\
    \ with the help of Excel’s table analysis tools it does not have to be. Although\
    \ data mining uses a set of complex algorithms and the traditional tools often\
    \ require you to be an expert in such algorithms to be able to implement them,\
    \ when you use the table analysis tools, Excel hides much of the complexity from\
    \ you. This chapter showed you how to use these tools to perform advanced data\
    \ analysis such as forecasting, clustering, and associations. You are now able\
    \ to utilize these tools to gain more insight into your data. Remember to look\
    \ beyond the specific examples and learn to apply the patterns in a variety of\
    \ situations.\n\nAt the time of this writing, Microsoft is moving its data mining\
    \ efforts into Microsoft Azure ML (Machine Learning) and has not been investing\
    \ in any upgrades to Excel’s data mining tools. This is unfortunate because Azure\
    \ ML is a cloud-only—based system and is a little advanced for the typical business\
    \ analyst. On the bright side, several third-party vendors (such as XLMiner and\
    \ Predixion) are stepping up and offering their own data mining add-in tools for\
    \ Excel. These tools are very similar to the look and feel of the table analysis\
    \ tools covered in this chapter and I think you will find using these tools to\
    \ be an easy transition.\n\nIn [Chapter 14](../Text/9781430264453_Ch14.xhtml),\
    \ you will look at two realistic case studies to solidify the concepts of the\
    \ previous chapters. By working through these case studies, you will be able to\
    \ gauge which areas you have mastered and which you need to study further. In\
    \ addition, you will look at some common patterns associated with data analysis\
    \ and how to implement these using the tools covered in this book.\n\nIn the previous\
    \ chapters, you gained experience working with each of the pieces of Microsoft’s\
    \ self-service BI tool set. You used Power Pivot, Power View, Power Query, Power\
    \ Map, and the Excel table analysis tools. This chapter provides you with several\
    \ use cases to solidify the concepts of the previous chapters. By working through\
    \ these use cases, you will gauge which areas you have mastered and which you\
    \ need to spend more time studying. Since this is sort of like your final exam,\
    \ I have deliberately not included step-by-step instructions like I did for the\
    \ previous exercises. Instead, I have given you general directions that should\
    \ be sufficient to get you started. If you get stuck, refer back to the previous\
    \ chapters to remind yourself of how to accomplish the task.\n\nThis chapter contains\
    \ the following use cases:\n\n*   Reseller Sales analysis\n*   Sales Quota analysis\n\
    *   Sensor analysis\n\n## Use Case 1: Reseller Sales Analysis\n\nIn this scenario,\
    \ you work for a bike equipment company and have been asked to analyze the sales\
    \ data. You need to build a dashboard to compare same-store sales growth from\
    \ one month to the next. An added constraint is that you only want to compare\
    \ resellers who have been open for at least a year when you make the comparison.\n\
    \n### Load the Data\n\nCreate a new Excel workbook named `StoreSalesAnalysis.xlsx`.\
    \ In the `Chapter14Labs` folder, find the `UseCase1` folder, which contains a\
    \ `StoreSales.accdb` Access database. This database houses the sales data you\
    \ need to analyze. Using this as a data source, import the data tables and columns\
    \ listed in [Table 14-1](#9781430264453_Ch14.xhtml#Tab1).\n\n[Table 14-1](#9781430264453_Ch14.xhtml#_Tab1).\
    \ Store Sales Tables and Columns to Import\n\n| Source Table | Friendly Name |\
    \ Columns |\n| --- | --- | --- |\n| `dbo_DimDate` | Date | `DateKey`, `FullDateAlternateKey`,\
    \ `EnglishMonthName`, `MonthNumberOfYear`, `CalendarQuarter`, `CalendarYear` |\n\
    | `dbo_DimGeography` | Location | `GeographyKey`, `City`, `StateProvinceCode`,\
    \ `StateProvinceName`, `CountryRegionCode`, `EnglishCountryRegionName`, `PostalCode`\
    \ |\n| `dbo_DimProduct` | Product | `ProductKey`, `ProductSubcategoryKey`, `EnglishProductName`,\
    \ `StandardCost`, `ListPrice`, `DealerPrice`, `LargePhoto` |\n| `dbo_DimProductCategory`\
    \ | Category | `ProductCategoryKey`, `EnglishProductCategoryName` |\n| `dbo_DimProductSubcategory`\
    \ | Subcategory | `ProductSubcategoryKey`, `EnglishProductSubcategoryName`, `ProductCategoryKey`\
    \ |\n| `dbo_DimReseller` | Reseller | `ResellerKey`, `GeographyKey`, `BusinessType`,\
    \ `ResellerName`, `YearOpened` |\n| `dbo_FactResellerSales` | ResellerSales |\
    \ `ProductKey`, `ResellerKey`, `OrderDateKey`, `SalesOrderNumber`, `SalesOrderLineNumber`,\
    \ `OrderQuantity`, `UnitPrice`, `ExtendedAmount`, `TotalProductCost`, `SalesAmount`\
    \ |\n\n### Create the Model\n\nAfter importing the tables, create the table relationships\
    \ using the appropriate keys. Your model should now look similar to [Figure 14-1](#9781430264453_Ch14.xhtml#Fig1).\n\
    \n![9781430264453_Fig14-01.jpg](Images/9781430264453_Fig14-01.jpg)\n\n[Figure\
    \ 14-1](#9781430264453_Ch14.xhtml#_Fig1). Store sales model\n\nRename the table\
    \ columns and show or hide the columns from client tools according to the information\
    \ listed in [Table 14-2](#9781430264453_Ch14.xhtml#Tab2).\n\n[Table 14-2](#9781430264453_Ch14.xhtml#_Tab2).\
    \ Table and Column Properties\n\n![Table14-2](Images/Table14-2.jpg)\n\nIn the\
    \ `Date` table, create a calendar hierarchy of Year - Quarter - Month. Mark the\
    \ table as the Date table with the `Full Date` column as the key. Sort the `Month`\
    \ column by the `Month Number` column. Format the `Full Date` column to only show\
    \ the date and not the time.\n\n### Create Calculated Columns\n\nUsing the DAX\
    \ `RELATED` function, create a calculated column in the `Product` table for Product\
    \ Subcategory and Product Category.\n\n```\n[Category]\n=IF(ISBLANK([ProductSubcategoryKey]),\"\
    Misc\",\n    RELATED(Category[EnglishProductCategoryName]))\n\n[Subcategory]\n\
    =IF(ISBLANK([ProductSubcategoryKey]),\"Misc\",\n    RELATED(Subcategory[EnglishProductSubcategoryName]))\n\
    ```\n\nHide the `Category` and `Subcategory` tables from any client tools. If\
    \ the `ProductSubcategoryKey` is blank, fill in the `Category` and `Subcategory`\
    \ columns with `\"Misc\"`. Finally, create a hierarchy with the `Product Category`\
    \ and `Product Subcategory` columns named **Prd Cat**.\n\n### Create Measures\n\
    \nAdd the following measures to the `ResellerSales` table:\n\n```\nMonth Sales:=TOTALMTD(SUM([Sales\
    \ Amount]),'Date'[Full Date])\n\nPrev Month Sales:=CALCULATE(Sum([Sales Amount]),PREVIOUSMONTH('Date'[Full\
    \ Date]))\n\nMonthly Sales Growth:=[Month Sales] - [Prev Month Sales]\n\nMonthly\
    \ Sales Growth %:=DIVIDE([Monthly Sales Growth],[Prev Month Sales],0)\n```\n\n\
    Test your measures by creating a pivot table as shown in [Figure 14-2](#9781430264453_Ch14.xhtml#Fig2).\n\
    \n![9781430264453_Fig14-02.jpg](Images/9781430264453_Fig14-02.jpg)\n\n[Figure\
    \ 14-2](#9781430264453_Ch14.xhtml#_Fig2). Viewing the measures in a pivot table\n\
    \nNow you need to create a measure to determine if a store was open for at least\
    \ a year for the month you are calculating the sales for. In the `Reseller` table,\
    \ add the following measures:\n\n```\nYears Open:=Year(FIRSTDATE('Date'[Full Date]))\
    \ - Min([Year Opened])\n\nWas Open Prev Year:=If([Years Open]>0,1,0)\n```\n\n\
    Create a pivot table to test your measures, as shown in [Figure 14-3](#9781430264453_Ch14.xhtml#Fig3).\
    \ Remember that the measures only make sense if you filter by year.\n\n![9781430264453_Fig14-03.jpg](Images/9781430264453_Fig14-03.jpg)\n\
    \n[Figure 14-3](#9781430264453_Ch14.xhtml#_Fig3). Testing the measures\n\nNow\
    \ you can combine these measures so that you are only including resellers who\
    \ have been in business for at least a year at the time of the sales. Create the\
    \ following measures:\n\n```\nMonth Sales Filtered:=Calculate([Month Sales],FILTER(Reseller,[Was\
    \ Open Prev Year]=1))\n```"
