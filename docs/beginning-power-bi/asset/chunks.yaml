- fmt: 'As we saw in [Chapter 7](../Text/9781430264453_Ch07.xhtml), you can create
    powerful data visualizations and perform in-depth data analysis using Excel pivot
    tables and charts. Chances are that if you are an Excel power user and perform
    detailed data analysis as part of your job function, these will be your tools
    of choice. On the other hand, if you need a tool that allows users to create quick
    and easy visualizations from your Power Pivot models, then Power View is a great
    option. You use Power View to create compelling dashboards that contain contextually
    linked visualizations that can be easily filtered, sorted, and drilled through.
    Power View reports can be hosted as a worksheet in Excel or in a SharePoint library.
    One added benefit is they can be exported to PowerPoint where they can be used
    for presentations while still retaining their interactivity. [Figure 8-1](#9781430264453_Ch08.xhtml#Fig1)
    shows a sample of a Power View report with a linked chart and graph. When a bar
    is clicked on the chart, the graph is filtered by that country and year.


    ![9781430264453_Fig08-01.jpg](Images/9781430264453_Fig08-01.jpg)


    [Figure 8-1](#9781430264453_Ch08.xhtml#_Fig1). An interactive chart and graph
    in Power View


    With Power View you can create the common visualizations such as tables, matrices,
    charts, and graphs. In addition, you can create bubble charts that include a time
    axis that reveals how the data changes over time (see [Figure 8-2](#9781430264453_Ch08.xhtml#Fig2)).


    ![9781430264453_Fig08-02.jpg](Images/9781430264453_Fig08-02.jpg)


    [Figure 8-2](#9781430264453_Ch08.xhtml#_Fig2). Adding a play axis to a bubble
    chart


    Since Power View uses Bing Maps tiles, you can present your data on interactive
    maps that you can zoom in and pan down to street address level as you explore
    the data. [Figure 8-3](#9781430264453_Ch08.xhtml#Fig3) shows a map of rainfall
    by county.


    ![9781430264453_Fig08-03.jpg](Images/9781430264453_Fig08-03.jpg)


    [Figure 8-3](#9781430264453_Ch08.xhtml#_Fig3). Map of rainfall by county


    Two other data visualizations available in Power View are cards and tiles. `Cards`
    display the data from each row laid out in an index card style. For example, you
    can look at contact information for employees, as shown in [Figure 8-4](#9781430264453_Ch08.xhtml#Fig4).


    ![9781430264453_Fig08-04.jpg](Images/9781430264453_Fig08-04.jpg)


    [Figure 8-4](#9781430264453_Ch08.xhtml#_Fig4). Employee information in a card
    style


    A `tile` visualization allows you to interactively filter the data using a tab
    strip that can contain text and images. For example, [Figure 8-5](#9781430264453_Ch08.xhtml#Fig5)
    shows the use of tiles to filter sales by region using a map image of the region
    in the tab strip.


    ![9781430264453_Fig08-05.jpg](Images/9781430264453_Fig08-05.jpg)


    [Figure 8-5](#9781430264453_Ch08.xhtml#_Fig5). Using tile images in Power View


    Now that you are familiar with some of the types of visualizations available in
    Power View, let’s look at the process of creating some basic reports.


    ## Creating a Basic Report


    Power View reports are based on Power Pivot models in Excel. In order to create
    a report, open the Excel workbook that contains a model and on the Insert tab,
    click the Power View button (see [Figure 8-6](#9781430264453_Ch08.xhtml#Fig6)).


    ![9781430264453_Fig08-06.jpg](Images/9781430264453_Fig08-06.jpg)


    [Figure 8-6](#9781430264453_Ch08.xhtml#_Fig6). Inserting a Power View report


    This will insert a new tab into the workbook and present you with the Power View
    design surface. The design has a Data Visualization area, a Filters area, and
    a Power View Fields window. The Power View Fields window contains the tables and
    fields of the Power Pivot model that are exposed to the client tools (see [Figure
    8-7](#9781430264453_Ch08.xhtml#Fig7)).


    ![9781430264453_Fig08-07.jpg](Images/9781430264453_Fig08-07.jpg)


    [Figure 8-7](#9781430264453_Ch08.xhtml#_Fig7). The Power View design surface


    One of the keys to creating visualizations in Power View is to begin with a table
    view, and then once you have the fields selected, you can switch the table view
    to one of the other data visualization types. If you expand the table nodes in
    the Power View Field List, you will see the available fields. If you want to create
    a bar chart showing sales by sales territory, first drag the desired fields to
    the Fields drop area. This will create a table view on the design surface. Selecting
    the table view then allows you to choose a different visualization type on the
    Design tab (see [Figure 8-8](#9781430264453_Ch08.xhtml#Fig8)).


    ![9781430264453_Fig08-08.jpg](Images/9781430264453_Fig08-08.jpg)


    [Figure 8-8](#9781430264453_Ch08.xhtml#_Fig8). Changing the visualization


    Once you switch the visualization, the drop areas under the Field List will change
    based on the visualization type. [Figure 8-9](#9781430264453_Ch08.xhtml#Fig9)
    shows the drop areas for a bar chart. You may have to rearrange the fields and
    you can add additional fields to the drop area to get the visualization you want.


    ![9781430264453_Fig08-09.jpg](Images/9781430264453_Fig08-09.jpg)


    [Figure 8-9](#9781430264453_Ch08.xhtml#_Fig9). The bar chart drop areas


    You can easily change visualizations from one type to another. For example, if
    you select the bar chart and select the other chart drop-down in the Design tab,
    you can switch it to a pie chart (see [Figure 8-10](#9781430264453_Ch08.xhtml#Fig10)).


    ![9781430264453_Fig08-10.jpg](Images/9781430264453_Fig08-10.jpg)


    [Figure 8-10](#9781430264453_Ch08.xhtml#_Fig10). Switching visualization types


    Now that you have seen how to create a basic visualization (you will look at creating
    more complex visualizations in [Chapters 9](../Text/9781430264453_Ch09.xhtml)
    and [10](../Text/9781430264453_Ch10.xhtml)), let’s look at what you can do with
    the Power Pivot model to improve the designer and user experience in Power View.


    ## Improving the Power View Experience


    It is very important that users of your Power Pivot models have a pleasant experience
    as they build and explore the various visualizations in Power View. For example,
    you should only expose fields that users find meaningful. It is always a good
    idea to hide key values that are used to relate the tables in the model. To hide
    a column from the list of available fields in Power View, right click the column
    and select Hide From Client Tools (this will turn the column gray in the Model
    Designer). [Figure 8-11](#9781430264453_Ch08.xhtml#Fig11) shows hiding a `CustomerID`
    field that has no business relevance.


    ![9781430264453_Fig08-11.jpg](Images/9781430264453_Fig08-11.jpg)


    [Figure 8-11](#9781430264453_Ch08.xhtml#_Fig11). Hiding fields from client tools


    If you look at the bottom of the pop-up menu in [Figure 8-11](#9781430264453_Ch08.xhtml#Fig11),
    you will see that you can enter a description for the field. This description
    will show up when you hover over the field in Power View. This option is also
    available for measures created in the model and can be very useful for business
    users who need to understand how the measure is defined. [Figure 8-12](#9781430264453_Ch08.xhtml#Fig12)
    shows the description displayed in Power View.


    ![9781430264453_Fig08-12.jpg](Images/9781430264453_Fig08-12.jpg)


    [Figure 8-12](#9781430264453_Ch08.xhtml#_Fig12). Adding field descriptions improves
    the user experience'
