    365`结合，还是在本地与`SharePoint 2013`结合，都为协作和管理自助式`BI`提供了强大的功能。在下一章中，你将了解另一个有用的Excel加载项，它将是你自助式`BI`工具库的一部分。`Power
    Query`提供了一个易于使用的界面，用于发现和转换数据，以便在你的`Power Pivot`模型中使用。它还包含清理和塑造数据的工具，例如删除重复项、替换值和分组数据。


