  trans: '

    现在您已经了解了可视化对象之间如何交互，接下来可以学习如何使用磁贴对可视化对象进行分组。


    ## 使用磁贴组织数据


    在上一节中，您了解了放置在同一视图上的可视化对象如何相互交互。另一种将可视化对象组合在一起的方法是使用磁贴。首先创建一个包含分组条件的表格。例如，您可能希望按销售区域组织销售数据。为此，首先使用销售区域图像创建一个表格，然后将其更改为磁贴类型的可视化对象。您将看到一个类似于图
    10-5 的可视化对象。


    ![9781430264453_Fig10-05.jpg](img/9781430264453_Fig10-05.jpg)


    图 10-5. 创建磁贴组


    在图 10-5 中，请注意销售区域图像同时出现在"标题"字段和"详细信息"区域中。您可以从"详细信息"区域中移除该字段，并从 Power Pivot 模型中添加与销售区域相关的数据。例如，您可以添加分配给该区域的销售人员、他们的照片、销售额以及销售年份。这将在磁贴的"详细信息"部分创建一个表格（参见图
    10-6）。


    ![9781430264453_Fig10-06.jpg](img/9781430264453_Fig10-06.jpg)


    图 10-6. 在磁贴内创建表格


    您可以将详细信息的可视化对象更改为其他类型，例如，矩阵。当您单击不同的磁贴时，详细信息会根据磁贴组进行筛选（参见图 10-7）。


    ![9781430264453_Fig10-07.jpg](img/9781430264453_Fig10-07.jpg)


    图 10-7. 使用磁贴进行分组


    如果您单击磁贴"详细信息"区域的空白区域，则可以构建另一个可视化对象。例如，图 10-8 显示了一个矩阵和一个柱形图，它们都根据所选磁贴进行了筛选。


    ![9781430264453_Fig10-08.jpg](img/9781430264453_Fig10-08.jpg)


    图 10-8. 使用磁贴控制多个可视化对象


    对可视化对象进行分组后，请确保您了解筛选是如何影响分组在磁贴中和视图上的可视化对象的。接下来您将了解这一点。


    ## 筛选组和视图


    当您将多个可视化对象放置在同一视图上时，您可以选择筛选整个视图（页面）或构成该视图的单个可视化对象。图 10-9 显示了"筛选器"区域，您可以在其中切换"视图"选项卡和"图表"选项卡。"视图"选项卡用于将筛选器应用于页面上的所有可视化对象，而"图表"选项卡则将筛选器仅应用于单个可视化对象（此处为一个图表）。


    ![9781430264453_Fig10-09.jpg](img/9781430264453_Fig10-09.jpg)


    图 10-9. 筛选图表或视图


    默认情况下，可视化对象筛选器包含构成该可视化对象的字段，且这些字段无法移除。但是，您可以从"字段列表"向筛选器中添加其他字段。当您首次单击"筛选器"区域中的"视图"选项卡时，其中没有列出任何字段。要筛选视图中的值，请从"字段列表"中添加与视图上可视化对象中包含的字段相关的字段。


    所有筛选器都有一个列表模式，在该模式下，值显示为复选框列表（参见图 10-10）。


    ![9781430264453_Fig10-10.jpg](img/9781430264453_Fig10-10.jpg)


    图 10-10. 使用筛选器选取列表


    您还可以通过选择字段名称右侧的箭头切换到高级筛选模式。Power View 中公开的高级筛选控件类型取决于筛选器的数据类型。图 10-11 显示了针对日期字段公开的高级筛选控件。


    ![9781430264453_Fig10-11.jpg](img/9781430264453_Fig10-11.jpg)


    图 10-11. 按日期进行高级筛选


    图 10-12 显示了当高级筛选与基于文本的字段一起使用时可用的选项。


    ![9781430264453_Fig10-12.jpg](img/9781430264453_Fig10-12.jpg)


    图 10-12. 使用基于文本的字段进行高级筛选


    筛选视图的另一种方法是使用切片器。切片器对用户来说很友好，因为它们属于视图的一部分。切片器的缺点在于它们仅限于选取列表，并且不提供前面提到的高级筛选功能。将磁贴分组与切片器结合使用可以创建不同的筛选器集。图
    10-13 显示了磁贴组内和磁贴组外的相同图表。两个图表都受到 CalendarYear 切片器的筛选，因为它们位于同一视图上。磁贴组内的图表还受到销售区域的进一步筛选，因为它是磁贴组的一部分。


    ![9781430264453_Fig10-13.jpg](img/9781430264453_Fig10-13.jpg)


    图 10-13. 使用切片器和磁贴进行筛选


    构建好仪表板后，就需要将其开放给用户。在下一节中，我们将简要回顾您的选项。


    ## 公开仪表板


    构建交互式仪表板后，下一步是将其公开给其他人（例如业务分析师和经理），以便他们能够探索数据。由于构成仪表板的 Power Pivot 模型和 Power View
    可视化对象是一个独立的单元，您只需与使用者共享 Excel 文件的副本即可。然而，这并不是管理仪表板的理想方式，并且很快就会变得难以控制。管理仪表板的更好方法是将它们托管在
    SharePoint 站点中。您可以将其托管在本地 SharePoint Server 2013 或基于云的 Office 365 SharePoint Server
    中。


    基于云的 Office 365 解决方案具有一些非常引人注目的功能，使其成为托管 Power BI 解决方案的绝佳场所。这些功能包括 Power BI 站点，用户可以在其中共享、查看
    Power View 仪表板并与之交互。它还包括一个 Power BI 管理中心，您可以在其中保护、监控和自动化仪表板的数据刷新。如果您需要实施一个解决方案来为大量用户创建和分发大量视图，我建议您了解一下
    Office 365 的功能。图 10-14 显示了 Office 365 Power BI 站点上的 Power View 仪表板。


    ![9781430264453_Fig10-14.jpg](img/9781430264453_Fig10-14.jpg)


    图 10-14. 在 Power BI 站点上公开 Power View 仪表板


    需要记住的一点是，Power View 最初是为交互式数据探索而创建的。尽管它正在演变成一个相当不错的仪表板工具，但它并不是生成需要打印的静态报告的最佳选择。当您打印
    Power View 页面时，实质上只是打印了一个屏幕截图。


    现在您已经了解了如何使用 Power View 创建交互式仪表板，是时候亲自动手实践创建一个了。


