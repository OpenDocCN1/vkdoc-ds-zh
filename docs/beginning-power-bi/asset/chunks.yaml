    除了从文本文件导入数据，你可能还需要通过从数据馈送导入数据来补充数据模型。这正成为一种与业务伙伴交换数据的常见方式，接下来你将了解如何操作。


    ### 从数据馈送导入数据


    尽管文本文件是交换数据最常用的方式之一，但数据馈送正日益成为流行的数据交换方式。数据馈送通过Web服务提供数据，要连接到Web服务，需要输入Web服务的网址。在图2-17中，你可以看到可用的数据馈送连接。大多数情况下，你会知道合作伙伴或数据提供商提供的数据服务的地址。在这种情况下，选择“其他馈送”，系统将为你提供一个连接信息输入窗口，如图2-21所示。


    ![9781430264453_Fig02-21.jpg](Images/9781430264453_Fig02-21.jpg)


    **图2-21** 连接到数据馈送


    由于数据馈送不仅包含数据，还包含元数据（数据描述），因此一旦建立连接，`Power Pivot`会提供预览和筛选数据的功能，如图2-22所示。


    ![9781430264453_Fig02-22.jpg](Images/9781430264453_Fig02-22.jpg)


    **图2-22** 从数据馈送预览和筛选数据


    一些值得关注的数据馈送来源包括来自`Reporting Services`报表和`SharePoint`列表的数据。这些应用程序可以轻松将其数据作为数据馈送公开，供你作为数据源使用。此外，许多数据库供应商（如`SAP`）也支持将其数据作为数据馈送公开。


    ### 从OLAP多维数据集导入数据


    许多公司投入了大量资金和精力来构建企业级报表解决方案，该方案由企业级`OLAP`存储库组成，为各种仪表板和记分卡提供数据。使用`Power Pivot`，你可以轻松集成来自这些存储库的数据。在连接窗口（图2-17）的连接选项中，选择“多维服务”下的“`Microsoft
    SQL Server Analysis Services`”连接。这将启动连接信息窗口，如图2-23所示。你可以连接到多维数据集或发布到`SharePoint`的`Power
    Pivot`模型。要连接到多维数据集，请输入服务器名称和数据库名称。要连接到`Power Pivot`模型，请输入Excel工作簿的`URL`（位于`SharePoint`库中）和模型名称。


    ![9781430264453_Fig02-23.jpg](Images/9781430264453_Fig02-23.jpg)


    **图2-23** 连接到Analysis Services多维数据集


    连接到多维数据集后，你可以输入`MDX`查询来检索数据（见图2-24）。记得验证查询以确保其能够运行。


