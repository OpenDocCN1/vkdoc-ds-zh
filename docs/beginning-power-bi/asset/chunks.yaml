- fmt: 'On the `Home` tab, select the `Unpivot` transform. Once the data is unpivoted,
    you will get an `Attribute` column from the original column headers and a `Value`
    column (see [Figure 11-15](#9781430264453_Ch11.xhtml#Fig15)). You should rename
    these columns before importing the data.


    ![9781430264453_Fig11-15.jpg](Images/9781430264453_Fig11-15.jpg)


    [Figure 11-15](#9781430264453_Ch11.xhtml#_Fig15). Resulting rows from the unpivot
    transformation


    As you bring data into the model, you often do not need the detail level data;
    instead, you need an aggregate value at a higher level—for example, product level
    sales or monthly sales. Using Power Query, you can easily group and aggregate
    the data before importing it.


    ## Grouping and Aggregating Data


    The need to group and aggregate data is a common scenario you may run into when
    you are importing raw data. For example, you may need to roll the data up by month
    or sales territory depending on the analysis you need. To aggregate and group
    the data in the Query Editor, select the column you want to group by and select
    the `Group By` transform in the `Home` tab. You are presented with a `Group By`
    window (see [Figure 11-16](#9781430264453_Ch11.xhtml#Fig16)).


    ![9781430264453_Fig11-16.jpg](Images/9781430264453_Fig11-16.jpg)


    [Figure 11-16](#9781430264453_Ch11.xhtml#_Fig16). Grouping data in Power Query


    You can group by multiple columns and aggregate multiple columns using the standard
    aggregate functions. [Figure 11-17](#9781430264453_Ch11.xhtml#Fig17) shows some
    of the results from grouping by `Origin` and `Carrier` and aggregating the average
    and maximum departure delays.


    ![9781430264453_Fig11-17.jpg](Images/9781430264453_Fig11-17.jpg)


    [Figure 11-17](#9781430264453_Ch11.xhtml#_Fig17). Grouping and aggregating flight
    data


    The final requirement you may run into as you import data using Power Query is
    inserting a calculated column. This is a little more advanced because you need
    to write code, as you will see in the next section.


    ## Inserting Calculated Columns


    Up until now you were able to build and execute queries using the visual interfaces
    provided by Power Query. Behind the scene, however, the Power Query Editor was
    creating a file used to execute the query. This file is written in a new language
    called `M`. As you have seen, you can get a lot of functionality out of Power
    Query without ever having to know about `M` or learn how it works. Nevertheless,
    at the very least, you should know it is there and that it is what gets executed
    when you run the query. If you navigate to the `View` tab in the Query Editor,
    you will see an option to open the `Advanced Editor`, which will display the `M`
    code used to build the query (see [Figure 11-18](#9781430264453_Ch11.xhtml#Fig18)).


    ![9781430264453_Fig11-18.jpg](Images/9781430264453_Fig11-18.jpg)


    [Figure 11-18](#9781430264453_Ch11.xhtml#_Fig18). Building a query with M


    You can use the `Advanced Editor` to write the query directly with `M`, thereby
    exposing some advanced data processing not exposed in the visual interface tools.


    If you want to insert a calculated column into the query, you need to use the
    `M` functions. On the `Insert` tab of the Query Editor you can duplicate columns,
    insert an index column, merge columns, and insert a custom column. When you select
    the `Insert A Custom Column` option, you are presented with an `Insert Custom
    Column` editor where you insert the `M` function used to create the column (see
    [Figure 11-19](#9781430264453_Ch11.xhtml#Fig19)).


    ![9781430264453_Fig11-19.jpg](Images/9781430264453_Fig11-19.jpg)


    [Figure 11-19](#9781430264453_Ch11.xhtml#_Fig19). Creating columns using M formulas


    [Figure 11-20](#9781430264453_Ch11.xhtml#Fig20) shows the results of the query
    with the custom column added.


    ![9781430264453_Fig11-20.jpg](Images/9781430264453_Fig11-20.jpg)


    [Figure 11-20](#9781430264453_Ch11.xhtml#_Fig20). Displaying the results of the
    query


    So, if you need to create columns using Power Query before inserting the data
    into the Power Pivot model, you use `M` formulas. If you create the columns after
    importing the data into the Power Pivot model you use `DAX` formulas.


    Now that you have seen how Power Query works, it is time to get some hands-on
    experience using it to import data. In order to complete this lab it is assumed
    you have installed the latest Power Query add-in.


    ## HANDS-ON LAB—IMPORTING AND SHAPING DATA WITH POWER QUERY


