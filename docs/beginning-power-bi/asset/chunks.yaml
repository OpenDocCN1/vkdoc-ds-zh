    table is in the model, change the name to `Sales Territory`, hide the `SalesTerritoryKey`,
    and create a relationship to the `Internet Sales` table.

    16.  To create a hierarchy, select the `Sales Territory` table in the Power Pivot
    window’s diagram view and click the `Create Hierarchy` button. Drag and drop the
    `Sales Territory Group`, `Country`, and `Region` on the hierarchy. Rename the
    hierarchy `Sales Territory` (see [Figure 3-23](#9781430264453_Ch03.xhtml#Fig23)).


    ![9781430264453_Fig03-23.jpg](Images/9781430264453_Fig03-23.jpg)


    [Figure 3-23](#9781430264453_Ch03.xhtml#_Fig23). The Sales Territory hierarchy


    17.  Create a Calendar hierarchy named `Calendar` in the `Date` table using `Year`,
    `Quarter`, and `Month`.

    18.  Switch to the data view in the designer and select the `Date Table` tab.
    Select the `Month` column and set its `Sort By Column` to the `Month No.` column.

    19.  When done save and close Excel.


    Summary


    When working in Power Pivot it is very important to understand what makes a good
    model. A good model will make Power Pivot perform incredibly fast and allow you
    to easily analyze large amounts of data. Unlike traditional Excel pivot tables,
    which are based on a single table contained in an Excel sheet, Power Pivot pivot
    tables are based off of multiple tables contained in the data model. This chapter
    guided you through the process of creating a solid model that will become the
    foundation for your data analysis. In addition, you saw how to present a user-friendly
    model to client tools.


    Now that you have a solid foundation for your model, you are ready to extend the
    model with custom calculations. The next chapter introduces the Data Analysis
    Expressions (DAX) language and explains how to create calculated columns in the
    data model. It includes plenty of examples to help you create common calculations
    in the model.


    CHAPTER 4


    ![image](Images/frontdot.jpg)


    Creating Calculations with DAX


    Now that you know how to create a robust data model to base your analysis on,
    the next step is to add to the model any calculations required to aid your exploration
    of the data. For example, you may have to translate code values into meaningful
    descriptions or parse out a string to obtain key information. This where Data
    Analysis Expressions (DAX) comes into play. This chapter introduces you to DAX
    and shows you how to use DAX to create calculated columns to add to the functionality
    of your model.


    After completing this chapter you will be able to


    *   Use DAX to add calculated columns to a table.

    *   Implement DAX operators.

    *   Work with text functions in DAX.

    *   Use DAX date and time functions.

    *   Use conditional and logical functions.

    *   Get data from a related table.

    *   Use math, trig, and statistical functions.


    What Is DAX?


    DAX is a formula language used to create calculated columns and measures in the
    Power Pivot model. It is a new language developed specifically for the tabular
    data model Power Pivot is based on. If you are familiar with Excel’s formula syntax,
    you will find that the DAX syntax is very familiar. In fact some of the DAX formulas
    have the same syntax and functionality as their Excel counterparts. The major
    difference, and one that you need to wrap your head around, is that Excel formulas
    are cell based whereas DAX is column based. For example, if you want to concatenate
    two values in Excel, you would use a formula like the following:


    ```

    =A1 & " " & B1

    ```


    where `A1` is the cell in the first row and first column and `B1` is the cell
    in the second column of the first row (see [Figure 4-1](#9781430264453_Ch04.xhtml#Fig1)).


    ![9781430264453_Fig04-01.jpg](Images/9781430264453_Fig04-01.jpg)


    [Figure 4-1](#9781430264453_Ch04.xhtml#_Fig1). Entering a formula in Excel


    This is very similar to the DAX formula:


    ```

    =[First Name] & " " & [Last Name]

    ```


    where the `First Name` and `Last Name` are columns in a table in the model (see
    [Figure 4-2](#9781430264453_Ch04.xhtml#Fig2)).


    ![9781430264453_Fig04-02.jpg](Images/9781430264453_Fig04-02.jpg)


    [Figure 4-2](#9781430264453_Ch04.xhtml#_Fig2). Entering a formula in Power Pivot


    The difference is that the DAX formula is applied to all rows in the table whereas
    the Excel formula only works on the specific cells. In Excel you need to re-create
    the formula in each row.


    What this means is although you can do something like this in Excel:


    ```

    =A1 & " " & B2

    ```


    where you are taking a cell from the first row and concatenating a cell from the
    second row (see [Figure 4-3](#9781430264453_Ch04.xhtml#Fig3)), this can’t be done
    in DAX.


    ![9781430264453_Fig04-03.jpg](Images/9781430264453_Fig04-03.jpg)


    [Figure 4-3](#9781430264453_Ch04.xhtml#_Fig3). Using cells in different rows


    When creating DAX formulas it is important to consider the data types and any
    conversions that may take place during the calculations. If you do not take these
    into account you may experience errors in the formula or unexpected results. The
    supported data types in the model are whole number, decimal number, currency,
    Boolean, text, and date. DAX also has a table data type that is used in many functions
    that take a table as an input value and return a table.


    When you try to add a numeric data type with a text data type you get an implicit
    conversion. If DAX can convert the text to a numeric value it will add them as
    numbers, if it can’t you will get an error. On the other hand, if you try to concatenate
    a numeric data type with a text data type, DAX will implicitly convert the numeric
    data type to text. Although most of the time implicit conversions give you the
    results you are looking for, they come at a performance cost and should be avoided
    if possible. For example, if you import data from a text file and the column is
    set to a text data type but you know it is in fact numeric, you should change
    the data type in the model.


    When creating calculations in DAX you will need to reference tables and columns.
    If the table name does not contain spaces, you can just refer to it by name. If
    the table name contains spaces, you need to enclose it in single quotes. Columns
    and measures are enclosed in brackets. If you just list the column name in the
    formula, it is assumed that the column exists in the same table. If you are referring
    to a column in another table, you need to use the fully qualified name, which
    is the table name followed by the column name. The following code demonstrates
    the syntax:


    ```

    =[SalesAmount] - [TotalCost]

    =Sales[SalesAmount] - Sales[TotalCost]

    =''Internet Sales''[SalesAmount] - ''Internet Sales''[TotalCost]

    ```


    Here are some other points to keep in mind when you are working with DAX:


    *   DAX formulas and expressions cannot modify or insert individual values in
    tables.

    *   You cannot create calculated rows by using DAX. You can create only calculated
    columns and measures.

    *   When defining calculated columns, you can nest functions to any level.


    The first thing to understand when creating a calculation is what operators are
    supported and what the syntax to use them is. In the next section you will investigate
    the various DAX operators.


    Implementing DAX Operators


    DAX contains a robust set of operators that includes arithmetic, comparison, logic,
    and text concatenation. Most of these should be familiar to you and are listed
    in [Table 4-1](#9781430264453_Ch04.xhtml#Tab1).


    [Table 4-1](#9781430264453_Ch04.xhtml#_Tab1). DAX Operators


    | Category | Symbol | Use |

    | --- | --- | --- |

    | Arithmetic operators |

    |   | `+` | Addition |

    |   | `-` | Subtraction |

    |   | `*` | Multiplication |

    |   | `/` | Division |

    |   | `^` | Exponentiation |

    | Comparison operators |

    |   | `=` | Equal to |

    |   | `>` | Greater than |

    |   | `<` | Less than |

    |   | `>=` | Greater than or equal to |

    |   | `<=` | Less than or equal to |

    |   | `<>` | Not equal to |

    | Text concatenation operator |

    |   | `&` | Concatenation |

    |   |   | Logic operators |

    |   | `&&` | And |

    |   | `&#124;&#124;` | Or |'
