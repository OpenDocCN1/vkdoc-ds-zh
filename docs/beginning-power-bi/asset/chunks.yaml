  trans: '

    正如我们在第 7 章所见，你可以使用 Excel 数据透视表和图表创建强大的数据可视化效果，并执行深入的数据分析。如果你是一名 Excel 高级用户，且工作职责包括详细数据分析，这些工具很可能是你的首选。另一方面，如果你需要一款工具，能让用户基于
    Power Pivot 模型快速轻松地创建可视化效果，那么 Power View 将是一个绝佳选择。你可以使用 Power View 创建引人注目的仪表板，其中包含上下关联的可视化元素，这些元素可以轻松筛选、排序和向下钻取。Power
    View 报表可以作为 Excel 工作表托管，也可以存放在 SharePoint 库中。它还有一个额外的好处：可以导出到 PowerPoint，在演示中使用，同时仍保留其交互性。图
    8-1 展示了一个包含联动图表和图形的 Power View 报表示例。当点击图表中的某个条形时，图形会根据所点击的国家和年份进行筛选。


    ![9781430264453_Fig08-01.jpg](img/9781430264453_Fig08-01.jpg)


    图 8-1。Power View 中的交互式图表和图形


    使用 Power View，你可以创建常见的可视化效果，例如表、矩阵、图表和图形。此外，你还可以创建包含时间轴的散点图，以揭示数据随时间的变化情况（参见图
    8-2）。


    ![9781430264453_Fig08-02.jpg](img/9781430264453_Fig08-02.jpg)


    图 8-2。为散点图添加播放轴


    由于 Power View 使用必应地图图块，你可以将数据呈现在交互式地图上。在浏览数据时，你可以放大地图并平移至街道地址级别。图 8-3 展示了按县级划分的降雨量地图。


    ![9781430264453_Fig08-03.jpg](img/9781430264453_Fig08-03.jpg)


    图 8-3。按县级划分的降雨量地图


    Power View 中另外两种可用的数据可视化类型是卡片和磁贴。`Cards`（卡片）以索引卡样式显示每一行的数据。例如，你可以查看员工的联系信息，如图
    8-4 所示。


    ![9781430264453_Fig08-04.jpg](img/9781430264453_Fig08-04.jpg)


    图 8-4。卡片样式的员工信息


    `tile`（磁贴）可视化效果允许你使用一个可包含文本和图像的标签条，以交互方式筛选数据。例如，图 8-5 展示了如何使用磁贴，通过标签条中地区的图像来按区域筛选销售额。


    ![9781430264453_Fig08-05.jpg](img/9781430264453_Fig08-05.jpg)


    图 8-5。在 Power View 中使用磁贴图像


    现在你已经熟悉了 Power View 中可用的一些可视化类型，接下来我们来看看创建一些基本报表的过程。


    ## 创建基本报表


    Power View 报表基于 Excel 中的 Power Pivot 模型。要创建报表，请打开包含该模型的 Excel 工作簿，然后在“插入”选项卡上，单击“Power
    View”按钮（参见图 8-6）。


    ![9781430264453_Fig08-06.jpg](img/9781430264453_Fig08-06.jpg)


    图 8-6。插入 Power View 报表


    这将在工作簿中插入一个新选项卡，并为你提供 Power View 设计界面。该设计包含一个数据可视化区域、一个筛选器区域和一个 Power View 字段窗口。Power
    View 字段窗口包含暴露给客户端工具的 Power Pivot 模型的表和字段（参见图 8-7）。


    ![9781430264453_Fig08-07.jpg](img/9781430264453_Fig08-07.jpg)


    图 8-7。Power View 设计界面


    在 Power View 中创建可视化效果的关键之一是从表视图开始，待选定字段后，再将表视图切换为其他数据可视化类型。展开 Power View 字段列表中的表节点，你将看到可用字段。如果你想创建一个显示按销售区域划分销售额的条形图，首先将所需字段拖到“字段”放置区域。这将在设计界面上创建一个表视图。选中该表视图后，你可以在“设计”选项卡上选择不同的可视化类型（参见图
    8-8）。


    ![9781430264453_Fig08-08.jpg](img/9781430264453_Fig08-08.jpg)


    图 8-8。更改可视化类型


    切换可视化类型后，字段列表下的放置区域将根据可视化类型而改变。图 8-9 展示了条形图的放置区域。你可能需要重新排列字段，并向放置区域添加额外字段，以获得所需的可视化效果。


    ![9781430264453_Fig08-09.jpg](img/9781430264453_Fig08-09.jpg)


    图 8-9。条形图放置区域


    你可以轻松地将可视化效果从一种类型更改为另一种。例如，如果你选中条形图，然后在“设计”选项卡中选择其他图表下拉菜单，就可以将其切换为饼图（参见图 8-10）。


    ![9781430264453_Fig08-10.jpg](img/9781430264453_Fig08-10.jpg)


    图 8-10。切换可视化类型


    现在你已经了解了如何创建基本可视化效果（你将在第 9 章和第 10 章中学习创建更复杂的可视化效果），接下来我们看看如何利用 Power Pivot 模型来改善
    Power View 中的设计者和用户体验。


    ## 改善 Power View 体验


    让 Power Pivot 模型的用户在 Power View 中构建和探索各种可视化效果时拥有愉快的体验非常重要。例如，你应只暴露对用户有意义的字段。通常，隐藏用于关联模型中表的关键值是个好主意。要从
    Power View 的可用字段列表中隐藏某个列，请右键单击该列并选择“从客户端工具隐藏”（这将在模型设计器中将该列变为灰色）。图 8-11 展示了隐藏一个没有业务意义的
    `CustomerID` 字段。


    ![9781430264453_Fig08-11.jpg](img/9781430264453_Fig08-11.jpg)


    图 8-11。从客户端工具隐藏字段


    如果你查看图 8-11 弹出菜单的底部，你会发现可以为该字段输入描述。当你在 Power View 中悬停在该字段上时，此描述将会显示。此选项也适用于模型中创建的度量值，并且对于那些需要了解度量值定义方式的业务用户来说非常有用。图
    8-12 展示了在 Power View 中显示的描述。


    ![9781430264453_Fig08-12.jpg](img/9781430264453_Fig08-12.jpg)


    图 8-12。添加字段描述可改善用户体验

    '
- fmt: 'As you look at the Field List in [Figure 8-12](#9781430264453_Ch08.xhtml#Fig12),
    notice the icons in front of the fields. The calculator icon indicates that the
    field is a measure created in the Power Pivot model. The summation symbol indicates
    that the field is numeric and will be aggregated when dragged to the Fields drop
    area. By default the aggregate is a summation that may not be the aggregate needed.
    In some cases you do not want to aggregate a number; for example, in the date
    table the year field is not meant to be aggregated. You can control this behavior
    in the Power Pivot model by setting the `Summarize By` drop-down on the Advanced
    tab (see [Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)).


    ![9781430264453_Fig08-13.jpg](Images/9781430264453_Fig08-13.jpg)


    [Figure 8-13](#9781430264453_Ch08.xhtml#_Fig13). Setting default summarizations
    for fields


    Along with setting field level properties, you can set some table level properties
    in the Power Pivot model that make creating reports in Power View easier. If you
    look at the Advanced tab for a table in the Power Pivot Model Designer, you will
    see a `Default Field Set` button (see [Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)).
    Selecting this will allow you to designate the default field set for the table
    (see [Figure 8-14](#9781430264453_Ch08.xhtml#Fig14)). When set, this will allow
    the Power View user to quickly create a table by clicking the table node in the
    Power View Field List (see [Figure 8-15](#9781430264453_Ch08.xhtml#Fig15)).


    ![9781430264453_Fig08-14.jpg](Images/9781430264453_Fig08-14.jpg)


    [Figure 8-14](#9781430264453_Ch08.xhtml#_Fig14). Setting default fields for a
    table


    ![9781430264453_Fig08-15.jpg](Images/9781430264453_Fig08-15.jpg)


    [Figure 8-15](#9781430264453_Ch08.xhtml#_Fig15). Using default fields in Power
    View


    When you create visualizations in Power View, it groups items automatically depending
    on what fields are selected and the type of visualization selected. You can control
    how grouping is evaluated by setting the `Table Behavior` properties in the Power
    Pivot model. You can access the `Table Behavior` properties on the Advanced tab
    in the Model Designer (see [Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)). When
    clicked, the `Table Behavior` button will display the Table Behavior settings
    window (see [Figure 8-16](#9781430264453_Ch08.xhtml#Fig16)).


    ![9781430264453_Fig08-16.jpg](Images/9781430264453_Fig08-16.jpg)


    [Figure 8-16](#9781430264453_Ch08.xhtml#_Fig16). Setting the table behavior


    The `Table Behavior` properties you can set for a table are the row identifier,
    any columns that indicate uniqueness, the default label, and the default image.
    The row identifier is used to indicate the field that uniquely identifies each
    row (often referred to as the primary key). This field needs to be unique and
    cannot be blank. Once the row identifier is set, you can choose which columns
    contain values that should remain unique. For example, you may have two employees
    with the same name and you do not want to group records of one employee with those
    of the other. The default label and default image are used in the Power View card
    and tile type visualizations, and when set, give a nicer formatting style. [Figure
    8-17](#9781430264453_Ch08.xhtml#Fig17) shows the same card with two different
    formats. The top card shows the format when the default label and image is set
    and the bottom card shows the format when they are not set.


    ![9781430264453_Fig08-17.jpg](Images/9781430264453_Fig08-17.jpg)


    [Figure 8-17](#9781430264453_Ch08.xhtml#_Fig17). Effects of setting default label
    and image


    One last setting available on the Advanced tab of the Power Pivot Model Designer
    is the `Data Category` setting for the fields (see [Figure 8-18](#9781430264453_Ch08.xhtml#Fig18)).
