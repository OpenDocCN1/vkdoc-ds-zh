    Importing Data from Text Files


    There are many times when you need to combine data from several different sources.
    One of the most common sources of data is still the text file. This could be the
    result of receiving data as an output from another system; for example, you may
    need information from your company’s ERP (enterprise resource planning) system,
    which is provided as a text file. You may also get data through third-party services
    that provide the data in a CSV (comma-separated value) format. For example, you
    may use a rating service to rate customers and the results can be returned in
    a CSV file.


    Importing data into your model from a text file is similar to importing data from
    a relational database table. First you select the option to get external data
    from other sources on the Home menu, which brings up the option to connect to
    a data source. Scroll down to the bottom of the window and you can choose to import
    data from either an Excel file or a text file (see [Figure 2-17](#9781430264453_Ch02.xhtml#Fig17)).


    ![9781430264453_Fig02-17.jpg](Images/9781430264453_Fig02-17.jpg)


    [Figure 2-17](#9781430264453_Ch02.xhtml#_Fig17). Connecting to a text file


    Selecting the text file brings up a screen where you enter the path to the file
    and the file delimiter. Each text file is considered a table and the friendly
    connection name will be the name of the table in the model. Once you supply the
    connection information, the data is loaded for previewing and filtering (see [Figure
    2-18](#9781430264453_Ch02.xhtml#Fig18)).


