- fmt: '查看[Figure 8-12](#9781430264453_Ch08.xhtml#Fig12)中的字段列表时，请注意字段前面的图标。计算器图标表示该度量值是在`Power
    Pivot`模型中创建的。求和符号（Σ）表示该字段是数值型的，拖放到字段放置区域时会进行聚合。默认的聚合方式是求和，但这可能并非所需的聚合方式。在某些情况下，您可能不希望聚合某个数值；例如，在日期表中，年份字段不应被聚合。您可以在`Power
    Pivot`模型的`Advanced`选项卡上，通过设置“`Summarize By`”下拉列表来控制此行为（参见[Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)）。


    ![9781430264453_Fig08-13.jpg](Images/9781430264453_Fig08-13.jpg)


    [Figure 8-13](#9781430264453_Ch08.xhtml#_Fig13). 设置字段的默认汇总方式


    除了设置字段级属性外，您还可以在`Power Pivot`模型中设置一些表级属性，以便更轻松地在`Power View`中创建报表。如果您查看`Power
    Pivot`模型设计器中某个表的`Advanced`选项卡，您会看到一个“`Default Field Set`”按钮（参见[Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)）。选择此按钮将允许您指定该表的默认字段集（参见[Figure
    8-14](#9781430264453_Ch08.xhtml#Fig14)）。设置后，`Power View`用户只需单击`Power View`字段列表中的表节点，即可快速创建表格（参见[Figure
    8-15](#9781430264453_Ch08.xhtml#Fig15)）。


    ![9781430264453_Fig08-14.jpg](Images/9781430264453_Fig08-14.jpg)


    [Figure 8-14](#9781430264453_Ch08.xhtml#_Fig14). 为表设置默认字段


    ![9781430264453_Fig08-15.jpg](Images/9781430264453_Fig08-15.jpg)


    [Figure 8-15](#9781430264453_Ch08.xhtml#_Fig15). 在`Power View`中使用默认字段


    在`Power View`中创建可视化时，它会根据所选字段和可视化类型自动对项目进行分组。您可以通过在`Power Pivot`模型中设置“`Table Behavior`”属性来控制分组的评估方式。您可以在模型设计器的`Advanced`选项卡上访问“`Table
    Behavior`”属性（参见[Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)）。单击“`Table Behavior`”按钮将显示“`Table
    Behavior`”设置窗口（参见[Figure 8-16](#9781430264453_Ch08.xhtml#Fig16)）。


    ![9781430264453_Fig08-16.jpg](Images/9781430264453_Fig08-16.jpg)


    [Figure 8-16](#9781430264453_Ch08.xhtml#_Fig16). 设置表行为


    您可以为一个表设置的“`Table Behavior`”属性包括行标识符、指示唯一性的列、默认标签和默认图像。行标识符用于指明唯一标识每一行的字段（通常称为主键）。此字段必须唯一且不能为空。设置行标识符后，您可以选择哪些列包含应保持唯一的值。例如，您可能有两个同名的员工，您不希望将一个员工的记录与另一个员工的记录分组在一起。默认标签和默认图像用于`Power
    View`的卡片和磁贴类型可视化，设置后可提供更美观的格式样式。[Figure 8-17](#9781430264453_Ch08.xhtml#Fig17)
    展示了同一张卡片的两种不同格式。上方的卡片显示了设置默认标签和图像后的格式，下方的卡片显示了未设置时的格式。


    ![9781430264453_Fig08-17.jpg](Images/9781430264453_Fig08-17.jpg)


    [Figure 8-17](#9781430264453_Ch08.xhtml#_Fig17). 设置默认标签和图像的效果


    `Power Pivot`模型设计器的`Advanced`选项卡上最后一个可用的设置是字段的“`Data Category`”设置（参见[Figure 8-18](#9781430264453_Ch08.xhtml#Fig18)）。这对于位置类型（如城市、邮政编码和国家/地区）非常有用。当`Power
    View`知道某列是位置类型时，它可以使用该字段通过`Bing`地图图层实现可视化。其他有用的数据类别包括图像和`Web` URL。设置这些类别后，`Power
    View`将知道它们是超链接并相应地设置格式。


    ![9781430264453_Fig08-18.jpg](Images/9781430264453_Fig08-18.jpg)


    [Figure 8-18](#9781430264453_Ch08.xhtml#_Fig18). 为字段设置数据类别


    至此，您应该已经很好地理解了`Power Pivot`模型中的设置如何影响`Power View`中的用户体验。在下面的动手实验中，您将获得处理这些属性的实践经验。


    ## 动手实验——为 Power View 优化 Power Pivot 模型


    在下面的实验中，您将：


    *   为`Power View`优化一个`Power Pivot`模型。

    *   在`Power View`中创建一个表格和一个卡片可视化。

    *   探索表视图筛选。


    1.  在`LabStarters`文件夹中，打开`LabChapter8.xlsx`文件。此文件包含来自测试`AdventureWorks`数据库的销售数据。

    2.  在`Excel`中选择`Insert`选项卡，然后单击`Power View`按钮。这将在工作簿中插入一个`Power View`报表工作表。在`Power
    View`字段窗口中，展开`Customer`节点并观察字段列表（参见[Figure 8-19](#9781430264453_Ch08.xhtml#Fig19)）。


    ![9781430264453_Fig08-19.jpg](Images/9781430264453_Fig08-19.jpg)


    [Figure 8-19](#9781430264453_Ch08.xhtml#_Fig19). 向`Power View`公开的客户字段


    3.  请注意，`CustomerID`、`CustomerAlternateKey`和`GeographyKey`已暴露给用户。转到`Power Pivot`模型并隐藏这些键。

    4.  如果查看[Figure 8-19](#9781430264453_Ch08.xhtml#Fig19)中的`Age`字段，您会看到该字段前面有一个求和符号（Σ）。这意味着如果您将此字段拖到放置区域，它将对年龄进行求和。要在`Power
    Pivot`模型中更改此设置，请选择`Age`列，然后在`Advanced`选项卡上的“`Summarize By`”下拉列表中，选择“`Do Not Summarize`”。对`NumberCarsOwned`、`NumberChildrenAtHome`和`TotalChildren`列重复此操作。

    5.  如果查看[Figure 8-19](#9781430264453_Ch08.xhtml#Fig19)中的`Country`字段，您会看到该字段前面有一个地球图标。这表明此字段是位置类型字段。要验证这一点，请在`Power
    Pivot`模型中选择`Country`字段，然后选择`Advanced`选项卡。请注意，`Data Category`已设置为“`Country/Region
    (Suggested)`”。模型使用列名来猜测此设置。

    6.  将`StateProvince`和`City`列设置为适当的数据类别。返回`Power View`字段列表，注意这些字段现在有了地球图标。

    7.  在`Power View`字段列表中展开`Date`表。请注意，存在许多您不希望使用的默认汇总，以及许多您不希望显示的字段。更新模型，使最终的字段列表看起来像[Figure
    8-20](#9781430264453_Ch08.xhtml#Fig20)。同时，设置`MonthName`列按`MonthNumberOfYear`排序，并向模型添加一个日历层级结构和一个财务层级结构。


    ![9781430264453_Fig08-20.jpg](Images/9781430264453_Fig08-20.jpg)


    [Figure 8-20](#9781430264453_Ch08.xhtml#_Fig20). 更新后的日期字段


    8.  在`Power View`字段列表中展开`Employee`表。`Power Pivot`模型包含每位员工的照片，但`Power View`无法识别。要解决此问题，请转到`Power
    Pivot`模型，选择`Employee`表，然后在`Advanced`选项卡上，单击“`Table Behavior`”按钮。在`Table Behavior`设置窗口中，将`Row
    Identifier`设置为`EmployeeKey`。将“`Keep Unique Rows`”设置为`FullName`。将`Default Label`设置为`FullName`，并将`Default
    Image`设置为`EmployeePhoto`（参见[Figure 8-21](#9781430264453_Ch08.xhtml#Fig21)）。'
  raw: 'As you look at the Field List in [Figure 8-12](#9781430264453_Ch08.xhtml#Fig12),
    notice the icons in front of the fields. The calculator icon indicates that the
    field is a measure created in the Power Pivot model. The summation symbol indicates
    that the field is numeric and will be aggregated when dragged to the Fields drop
    area. By default the aggregate is a summation that may not be the aggregate needed.
    In some cases you do not want to aggregate a number; for example, in the date
    table the year field is not meant to be aggregated. You can control this behavior
    in the Power Pivot model by setting the Summarize By drop-down on the Advanced
    tab (see [Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)).


    ![9781430264453_Fig08-13.jpg](Images/9781430264453_Fig08-13.jpg)


    [Figure 8-13](#9781430264453_Ch08.xhtml#_Fig13). Setting default summarizations
    for fields


    Along with setting field level properties, you can set some table level properties
    in the Power Pivot model that make creating reports in Power View easier. If you
    look at the Advanced tab for a table in the Power Pivot Model Designer, you will
    see a Default Field Set button (see [Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)).
    Selecting this will allow you to designate the default field set for the table
    (see [Figure 8-14](#9781430264453_Ch08.xhtml#Fig14)). When set, this will allow
    the Power View user to quickly create a table by clicking the table node in the
    Power View Field List (see [Figure 8-15](#9781430264453_Ch08.xhtml#Fig15)).


    ![9781430264453_Fig08-14.jpg](Images/9781430264453_Fig08-14.jpg)


    [Figure 8-14](#9781430264453_Ch08.xhtml#_Fig14). Setting default fields for a
    table


    ![9781430264453_Fig08-15.jpg](Images/9781430264453_Fig08-15.jpg)


    [Figure 8-15](#9781430264453_Ch08.xhtml#_Fig15). Using default fields in Power
    View


    When you create visualizations in Power View, it groups items automatically depending
    on what fields are selected and the type of visualization selected. You can control
    how grouping is evaluated by setting the Table Behavior properties in the Power
    Pivot model. You can access the Table Behavior properties on the Advanced tab
    in the Model Designer (see [Figure 8-13](#9781430264453_Ch08.xhtml#Fig13)). When
    clicked, the Table Behavior button will display the Table Behavior settings window
    (see [Figure 8-16](#9781430264453_Ch08.xhtml#Fig16)).


    ![9781430264453_Fig08-16.jpg](Images/9781430264453_Fig08-16.jpg)


    [Figure 8-16](#9781430264453_Ch08.xhtml#_Fig16). Setting the table behavior


    The Table Behavior properties you can set for a table are the row identifier,
    any columns that indicate uniqueness, the default label, and the default image.
    The row identifier is used to indicate the field that uniquely identifies each
    row (often referred to as the primary key). This field needs to be unique and
    cannot be blank. Once the row identifier is set, you can choose which columns
    contain values that should remain unique. For example, you may have two employees
    with the same name and you do not want to group records of one employee with those
    of the other. The default label and default image are used in the Power View card
    and tile type visualizations, and when set, give a nicer formatting style. [Figure
    8-17](#9781430264453_Ch08.xhtml#Fig17) shows the same card with two different
    formats. The top card shows the format when the default label and image is set
    and the bottom card shows the format when they are not set.


    ![9781430264453_Fig08-17.jpg](Images/9781430264453_Fig08-17.jpg)


    [Figure 8-17](#9781430264453_Ch08.xhtml#_Fig17). Effects of setting default label
    and image


    One last setting available on the Advanced tab of the Power Pivot Model Designer
    is the Data Category setting for the fields (see [Figure 8-18](#9781430264453_Ch08.xhtml#Fig18)).
    This comes into play for location types like City, Postal Code, and Country/Region.
    When Power View knows the column is a location type, it can use the field to implement
    a visualization using Bing mapping layers. The other data categories that are
    useful to set are the image and web URLs. When you set these, Power View will
    know these are hyperlinks and format them appropriately.


    ![9781430264453_Fig08-18.jpg](Images/9781430264453_Fig08-18.jpg)


    [Figure 8-18](#9781430264453_Ch08.xhtml#_Fig18). Setting the data category for
    a field


    At this point you should have a good understanding of how the settings in the
    Power Pivot model affect the user experience in Power View. In the following lab,
    you will gain hands-on experience working with these properties.


    HANDS-ON LAB—OPTIMIZING A POWER PIVOT MODEL FOR POWER VIEW


    In the following lab you will


    *   Optimize a Power Pivot model for Power View.

    *   Create a table and a card visualization in Power View.

    *   Explore table view filtering.


    1.  In the LabStarters folder, open the `LabChapter8.xlsx` file. This file contains
    sales data from the test AdventureWorks database.

    2.  Select the Insert tab in Excel and click on the Power View button. This will
    insert a Power View report sheet in the workbook. In the Power View Fields window
    expand the Customer node and observe the Field List (see [Figure 8-19](#9781430264453_Ch08.xhtml#Fig19)).


    ![9781430264453_Fig08-19.jpg](Images/9781430264453_Fig08-19.jpg)


    [Figure 8-19](#9781430264453_Ch08.xhtml#_Fig19). Customer fields exposed to Power
    View


    3.  Notice that the CustomerID, CustomerAlternateKey, and the GeographyKey are
    exposed to the users. Go to the Power Pivot model and hide these keys.

    4.  If you look at the Age field in [Figure 8-19](#9781430264453_Ch08.xhtml#Fig19)
    you see a summation symbol in front of the field. This means it will sum up the
    ages if you drag this field to the drop area. To change this in the Power Pivot
    model, select the Age column, and on the Advanced tab under the Summarize By drop-down,
    select Do Not Summarize. Repeat this for the columns NumberCarsOwned, NumberChildrenAtHome,
    and TotalChildren.

    5.  If you look at the Country field in [Figure 8-19](#9781430264453_Ch08.xhtml#Fig19),
    you see a globe icon in front of the field. This indicates this field is a location
    type field. To verify this, select the Country field in the Power Pivot model
    and select the Advanced tab. Notice the Data Category has been set to Country/Region
    (Suggested). The model used the name of the column to guess this setting.

    6.  Set the StateProvince and City columns to the appropriate data category. Go
    back to the Power View Field List and notice these fields now have globe icons.

    7.  In the Power View Field List expand the Date table. Notice that there are
    a lot of default summations that you do not want and there are a bunch of fields
    you do not want to show. Update the model so that the final Field List looks like
    [Figure 8-20](#9781430264453_Ch08.xhtml#Fig20). Also set the MonthName column
    to be sorted by MonthNumberOfYear and add a Calendar and Fiscal hierarchy to the
    model.


    ![9781430264453_Fig08-20.jpg](Images/9781430264453_Fig08-20.jpg)


    [Figure 8-20](#9781430264453_Ch08.xhtml#_Fig20). Updated date fields


    8.  Expand the Employee table in the Power View Field List. The Power Pivot model
    contains a photo of each employee, but it is not being recognized by Power View.
    To remedy this, go to the Power Pivot model, select the Employee table, and on
    the Advanced tab, select the Table Behavior button. In the Table Behavior settings
    window, set the Row Identifier to EmployeeKey. Set Keep Unique Rows to FullName.
    Set the Default Label to FullName and the Default Image to EmployeePhoto (see
    [Figure 8-21](#9781430264453_Ch08.xhtml#Fig21)).'
