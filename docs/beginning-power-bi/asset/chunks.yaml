    ## 总结


    在本章中，你学习了如何组合`Power View`中的各种可视化对象来创建交互式仪表板。你还学习了如何使用磁贴来分组仪表板上的其他可视化对象。虽然你尚未探索将仪表板部署到`SharePoint`，但这将是合乎逻辑的下一步。无论是在云中使用`Office
    365`，还是在本地使用`SharePoint 2013`，`SharePoint`都能实现协作和管理自助式`BI`的强大功能。在下一章中，你将了解另一个在自助式`BI`工具集中非常实用的Excel加载项。`Power
    Query`提供了一个易于使用的界面，用于发现和转换数据以在`Power Pivot`模型中使用。它还包含清理和塑形数据的工具，例如删除重复项、替换值和分组数据。


    # 第三部分


    ![image](Images/frontdot.jpg)


    使用`Power Query`和`Power Map`探索和呈现数据


    # 第11章


    ![image](Images/frontdot.jpg)


    使用`Power Query`进行数据发现


    虽然`Power Pivot`提供了多种可用于查询数据的连接类型，但有时你需要在将数据加载到模型之前对其进行操作。这个过程通常被称为`ETL`（提取、转换和加载）过程中的转换部分。这正是`Power
    Query`大放异彩之处，也是你的`BI`工具集中非常有用的部分。`Power Query`提供了一个易于使用的界面，用于发现和转换数据。它包含清理和塑形数据的工具，例如删除重复项、替换值和分组数据。此外，它还支持大量结构化和非结构化数据源，例如关系数据库、网页和`Hadoop`等。一旦数据被提取和转换，你就可以轻松地将其加载到`Power
    Pivot`模型中。


    完成本章后，你将能够：


    *   从各种来源发现和导入数据。

    *   清理数据。

    *   合并、塑形和筛选数据。

    *   对数据进行分组和聚合。

    *   插入计算列。


    ## 发现和导入数据


    传统上，如果你需要合并和转换来自各种不同数据源的数据，你将依赖IT部门使用诸如`SQL Server Integration Services (SSIS)`之类的工具为你暂存数据。这可能是一个漫长而费力的过程，包括数据发现、清理以及将数据符合关系结构。尽管这种正式的工作对于加载和符合企业运营数据存储的数据是必需的，但很多时候你只是想快速、直观且敏捷地将来自各种来源的数据添加到你的`Power
    Pivot`模型中。为了支持这一点，你可以使用`Power Query`（Excel的一个免费加载项）作为你的自助式`BI` `ETL`工具。下载并安装最新版本的`Power
    Query`后，你将在Excel中看到一个名为`Power Query`的新选项卡（参见 [Figure 11-1](#9781430264453_Ch11.xhtml#Fig1)）。


