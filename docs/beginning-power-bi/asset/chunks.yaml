    现在你已经了解了如何从数据库导入数据，接下来让我们看看如何从文本文件向模型添加数据。


    ## 从文本文件导入数据


    很多时候，你需要合并来自多个不同来源的数据。最常见的来源之一仍然是文本文件。这可能是从其他系统接收数据输出的结果；例如，你可能需要公司 ERP（企业资源规划）系统的信息，而这些信息是以文本文件形式提供的。你也可能通过第三方服务获取数据，这些数据以
    CSV（逗号分隔值）格式提供。例如，你可能使用评级服务来对客户进行评级，结果可以通过 CSV 文件返回。


    从文本文件导入数据到模型，与从关系数据库表中导入数据类似。首先，在**开始**菜单上选择从其他源获取外部数据的选项，这将弹出连接到数据源的选项。向下滚动到窗口底部，你可以选择从
    Excel 文件或文本文件导入数据（见图 2-17）。


    ![9781430264453_Fig02-17.jpg](img/9781430264453_Fig02-17.jpg)


    图 2-17 连接到文本文件


    选择文本文件后，会弹出一个界面，你需要在其中输入文件路径和文件分隔符。每个文本文件被视为一个表，友好的连接名称将成为模型中该表的名称。提供连接信息后，数据会加载以供预览和筛选（见图
    2-18）。


    ![9781430264453_Fig02-18.jpg](img/9781430264453_Fig02-18.jpg)

