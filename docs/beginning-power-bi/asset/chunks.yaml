  trans: '

    # Power Pivot xVelocity 引擎


    Power Pivot 背后的独门秘籍是 `xVelocity` 内存分析引擎（没错，这就是它的名字！）。该引擎使得 Power Pivot 能够快速处理海量数据。其关键之一在于采用列式数据库来存储数据。传统的基于行的数据存储方式将所有数据按行存储在一起，在根据行键（例如，根据订单
    ID 更新或检索订单）检索和更新数据时效率很高。这对于订单录入系统非常有利，但在需要对历史订单进行分析时（例如，要查看过去一年的趋势以确定产品的销售情况）就不那么理想了。


    基于行的存储还会因每行重复存储值而占用更多空间；如果客户数量庞大，像 John 或 Smith 这样的常见名字会被重复多次。列式数据库仅存储每列的不同值，然后将行存储为一组指向列值的指针。这种内置的索引机制节省了大量空间，并且与
    `xVelocity` 引擎内置的数据压缩技术相结合，能够实现显著的性能优化。这也意味着对列值进行的数据聚合（例如典型数据分析中使用的聚合操作）速度极快。


    `xVelocity` 引擎提供的另一个优势是内存分析。查询数据时，大部分处理瓶颈都发生在从磁盘读取或写入数据的过程中。借助内存分析技术，数据被加载到计算机的
    RAM 中，然后进行查询。这极大地缩短了处理时间，并减少了在磁盘上存储预聚合值的需求。当你从 32 位操作系统和应用程序迁移到如今已成为主流的 64 位系统时，这一优势尤为明显。


    ## 表格模型优势


    除了 `xVelocity` 引擎提供的优势之外，另一个值得一提的优势是 Power Pivot 模型的表格结构。该模型由表和表关系组成。这种表格模型对于大多数业务分析师和数据库开发者来说更为熟悉。传统的
    OLAP 数据库（例如 `SSAS`，即 SQL Server Analysis Server）将数据模型呈现为三维立方体结构，处理起来更困难，并且需要使用复杂的查询语言
    `MDX`（多维表达式）。我发现，在大多数（但并非所有）情况下，使用表格模型和 `DAX` 比使用 OLAP 多维数据集和 `MDX` 更容易。


    ## 启用 Excel 的 Power Pivot


    Power Pivot 是 Excel 的一个免费加载项，包含在 Office Professional Plus 和 Office 365 Professional
    Plus 版本中。如果您使用的是 Excel 2010，则需要从 Microsoft Office 网站下载并安装该加载项。如果您使用的是 Excel 2013（本书涵盖的版本），则加载项已安装，只需启用即可。要检查您安装的版本，请选择
    Excel 中的“文件”菜单，然后选择“帐户”选项卡，如图 1-1 所示。


    ![9781430264453_Fig01-01.jpg](img/9781430264453_Fig01-01.jpg)


    图 1-1. 检查 Excel 版本


    在 Excel 的“帐户”选项卡上，单击“关于 Excel”按钮。屏幕上会显示版本详细信息，如图 1-2 所示。请注意版本和版本号。它应该是 Professional
    Plus 版本，最好是 64 位版本。对于较小的数据集，32 位版本可以很好地工作，但要获得 Power Pivot 的最佳性能和体验，您应该在配备约 8
    GB RAM 的 64 位 Windows 系统上使用 64 位版本。


    ![9781430264453_Fig01-02.jpg](img/9781430264453_Fig01-02.jpg)


    图 1-2. 检查 Excel 版本和版本号


    确认您运行的是正确版本后，可以通过转到“文件”菜单并选择“选项”选项卡来启用 Power Pivot 加载项。在“Excel 选项”窗口中，选择“加载项”选项卡。在“管理”下拉菜单中，选择“COM
    加载项”，然后单击“转到”按钮（参见图 1-3）。


    ![9781430264453_Fig01-03.jpg](img/9781430264453_Fig01-03.jpg)


    图 1-3. 管理 COM 加载项


    屏幕上将弹出“COM 加载项”窗口（参见图 1-4）。选中 `Microsoft Office PowerPivot for Excel 2013`，然后单击“确定”。


    ![9781430264453_Fig01-04.jpg](img/9781430264453_Fig01-04.jpg)


    图 1-4. 选择 Power Pivot 加载项


    现在您已为 Excel 启用 Power Pivot 加载项，接下来可以探索数据模型管理器了。


    ## 探索数据模型管理器界面


    启用 Power Pivot 后，您应该会在 Excel 中看到一个新的“Power Pivot”选项卡（参见图 1-5）。单击“管理”按钮将启动数据模型管理界面。


    ![9781430264453_Fig01-05.jpg](img/9781430264453_Fig01-05.jpg)


    图 1-5. 启动数据模型管理器


    数据模型管理器启动后，您将拥有两个独立但相互连接的界面。您可以在普通的 Excel 界面和数据模型管理界面之间来回切换。这可能会让 Power Pivot
    新手感到困惑。请记住，数据模型管理器（图 1-6）是您定义模型的地方，包括表、表关系、度量值、计算列和层次结构。Excel 界面（图 1-7）是您使用数据透视表和数据透视图分析数据的地方。


    ![9781430264453_Fig01-06.jpg](img/9781430264453_Fig01-06.jpg)


    图 1-6. 数据模型管理器界面


    ![9781430264453_Fig01-07.jpg](img/9781430264453_Fig01-07.jpg)


    图 1-7. Excel 工作簿界面


    ## 数据模型管理器中的视图


    数据模型管理器中有两种数据模型视图：数据视图和关系图视图。首次启动时，它处于数据视图模式。在数据视图模式下，您可以看到模型中包含的数据。模型中的每个表在视图中都有其自己的选项卡。表可以包含从数据源检索的数据列，也可以包含使用
    `DAX` 计算的列。计算列的颜色比其他列稍深。图 1-8 显示了 `Full Name` 列，该列是通过连接 `First Name` 和 `Last Name`
    列得出的。


    ![9781430264453_Fig01-08.jpg](img/9781430264453_Fig01-08.jpg)


    图 1-8. 数据模型管理器中的计算列


