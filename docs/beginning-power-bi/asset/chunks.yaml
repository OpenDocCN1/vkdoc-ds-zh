  trans: "  \n由此可见，表格并不是展示这类信息的最佳方式。在矩阵中解读信息会容易得多，你可以在其中比较汇总值，并能按年度、季度和月份进行向下或向上钻取。要将此更改为矩阵，请选中该表格，然后在`Design`选项卡上，选择`Table`下拉菜单中的`Matrix`选项（参见图\
    \ 9-6）。\n\n![9781430264453_Fig09-06.jpg](img/9781430264453_Fig09-06.jpg)\n\n图\
    \ 9-6. 将表格转换为矩阵\n\n如图 9-7 所示，将表格转换为矩阵后，添加了总计和小计。\n\n![9781430264453_Fig09-07.jpg](img/9781430264453_Fig09-07.jpg)\n\
    \n图 9-7. 包含总计和小计的矩阵\n\n如果你查看`Field List`下的拖放区域，会看到用于值、行和列的区域。为了改善矩阵的外观，你可以将`BusinessType`字段拖到`Columns`拖放区域。现在你就可以轻松地并排比较经销商类型了（参见图\
    \ 9-8）。\n\n![9781430264453_Fig09-08.jpg](img/9781430264453_Fig09-08.jpg)\n\n图\
    \ 9-8. 按利润比较经销商类型\n\n要在`Design`选项卡下控制矩阵的总计和钻取功能，请使用`Show Levels`和`Totals`下拉菜单（参见图\
    \ 9-9）。\n\n![9781430264453_Fig09-09.jpg](img/9781430264453_Fig09-09.jpg)\n\n图\
    \ 9-9. 为矩阵启用向下钻取\n\n一旦启用了向下钻取，矩阵将折叠，仅显示年度级别。当你点击某一年份时，会看到一个箭头图标，允许你向下钻取到日历层次结构中的下一级别（参见图\
    \ 9-10）。当你沿层次结构向下钻取时，还会看到另一个箭头，允许你向上钻取返回层次结构。\n\n![9781430264453_Fig09-10.jpg](img/9781430264453_Fig09-10.jpg)\n\
    \n图 9-10. 沿层次结构向下钻取\n\n除了希望在矩阵中查看聚合值之外，你通常还希望使用可视化表示（例如条形图、柱形图或饼图）来展示这些值。接下来你将学习如何创建这些图表。\n\
    \n## 构建条形图、柱形图和饼图\n\n用于比较数据的一些最常见的数据可视化方式是条形图、柱形图和饼图。条形图和柱形图非常相似。条形图具有水平条形，其中\
    \ x 轴是度量值，而 y 轴包含你所比较的类别。例如，图 9-11 展示了一个按国家比较互联网销售额的条形图。\n\n![9781430264453_Fig09-11.jpg](img/9781430264453_Fig09-11.jpg)\n\
    \n图 9-11. 按国家比较销售额的条形图\n\n柱形图则交换了坐标轴，使得度量值位于 y 轴，而类别位于 x 轴。例如，图 9-11 中的条形图可以很容易地转换为如图\
    \ 9-12 所示的柱形图。\n\n![9781430264453_Fig09-12.jpg](img/9781430264453_Fig09-12.jpg)\n\
    \n图 9-12. 按国家比较互联网销售额的柱形图\n\n有三种类型的条形图或柱形图可供选择：堆叠图、100% 堆叠图和簇状图。图 9-12 是一个没有图例字段的堆叠柱形图。如果你将`Year`字段拖到`Legend`拖放区域，可视化效果将变为如图\
    \ 9-13 所示。请注意，每年的值会彼此堆叠在一起。\n\n![9781430264453_Fig09-13.jpg](img/9781430264453_Fig09-13.jpg)\n\
    \n图 9-13. 创建堆叠柱形图\n"
- fmt: 'Although the stacked column chart shows absolute values, you can change it
    to a 100% stacked chart to show relative values in terms of percentages. In [Figure
    9-14](#9781430264453_Ch09.xhtml#Fig14) the `Country` field is moved to the legend
    and the `Year` field is placed on the axis. It also has data labels set as `Visible`
    for easier comparisons.


    ![9781430264453_Fig09-14.jpg](Images/9781430264453_Fig09-14.jpg)


    [Figure 9-14](#9781430264453_Ch09.xhtml#_Fig14). Creating a 100% stacked column
    chart


    A clustered column chart moves the columns for the various countries side by side
    instead of stacking them on top of one another. [Figure 9-15](#9781430264453_Ch09.xhtml#Fig15)
    shows the same information as [Figure 9-13](#9781430264453_Ch09.xhtml#Fig13) does,
    but as a clustered column chart.


    ![9781430264453_Fig09-15.jpg](Images/9781430264453_Fig09-15.jpg)


    [Figure 9-15](#9781430264453_Ch09.xhtml#_Fig15). Creating a clustered column chart


    Although you do not have much control over the layout of the charts, on the `Design`
    tab, you can control the title, legend, and data labels (see [Figure 9-16](#9781430264453_Ch09.xhtml#Fig16)).


    ![9781430264453_Fig09-16.jpg](Images/9781430264453_Fig09-16.jpg)


    [Figure 9-16](#9781430264453_Ch09.xhtml#_Fig16). Controlling the legend layout


    As with most visualizations, in Power View you get automatic filtering and sorting
    capabilities. For example, if you hover over the upper left corner of the chart
    in [Figure 9-15](#9781430264453_Ch09.xhtml#Fig15), you get the option to change
    the sorting by Internet sales amount instead of country name (see [Figure 9-17](#9781430264453_Ch09.xhtml#Fig17)).


    ![9781430264453_Fig09-17.jpg](Images/9781430264453_Fig09-17.jpg)


    [Figure 9-17](#9781430264453_Ch09.xhtml#_Fig17). Changing the sorting of a column
    chart


    Pie charts are similar to stacked column or stacked bar charts in that they allow
    you to compare the measures for members of a category and also the total for the
    category. [Figure 9-18](#9781430264453_Ch09.xhtml#Fig18) shows a pie chart comparing
    sales of different types of resellers.


    ![9781430264453_Fig09-18.jpg](Images/9781430264453_Fig09-18.jpg)


    [Figure 9-18](#9781430264453_Ch09.xhtml#_Fig18). Comparing data using a pie chart


    Just as with column and bar charts, you have very little control over the layout
    of the pie chart and are limited to the title and the positioning of the legend.
    At the time of this writing, pie charts do not even support data labels, which
    is truly unfortunate.


    Although bar, column, and pie charts are great for comparing aggregated data for
    various categories, if you want to spot trends in the data, line and scatter charts
    are a better choice. You will investigate these types of charts next.


    ## Building Line and Scatter Charts


    A line chart is used to look at trends across equal periods. The periods are often
    time units consisting of hours, days, months, and so on. The time periods are
    plotted along the x axis and the measurement is plotted along the y axis. [Figure
    9-19](#9781430264453_Ch09.xhtml#Fig19) shows flight delays in minutes for the
    hours in the day. Each line represents a different carrier. Using this chart,
    you can easily spot trends throughout the day and compare carrier performance.


    ![9781430264453_Fig09-19.jpg](Images/9781430264453_Fig09-19.jpg)


    [Figure 9-19](#9781430264453_Ch09.xhtml#_Fig19). Spotting trends using a line
    chart


    If you need to compare trending of two measures at the same time, you can use
    a scatter chart. Scatter charts plot one measure along the y axis and the other
    along the x axis. To create a scatter chart, create a table with a category field
    and two numeric fields—for example, reseller name (category), sales amount (numeric),
    and sales profit (numeric). After creating the table, switch the visualization
    to a scatter chart that is located under the `Other Chart` drop-down on the `Design`
    tab. [Figure 9-20](#9781430264453_Ch09.xhtml#Fig20) shows the resulting scatter
    chart.


    ![9781430264453_Fig09-20.jpg](Images/9781430264453_Fig09-20.jpg)'
