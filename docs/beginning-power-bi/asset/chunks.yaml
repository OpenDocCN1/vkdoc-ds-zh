    ## 简介


    自助式商业智能（BI）风靡一时。您听过这些宣传，看过销售演示，并准备尝试一番。然后呢？如果您和我一样，可能已经浏览过一些网站上的示例，尝试了一下，并学到了一些东西。但您可能仍然对这些工具如何协同工作以及如何创建完整解决方案感到困惑，对吗？如果是这样，那么这本书就是为您准备的。它将引导您逐步完成使用微软自助式
    BI 产品核心的各种工具来分析数据的过程。


    微软自助式 BI 产品的核心是 `Power Pivot`。我将向您展示如何使用 `Power Pivot` 创建健壮、可扩展的数据模型；这些模型将成为您数据分析的基础。由于
    `Power Pivot` 是您创建自助式 BI 解决方案的核心工具，本书将对其进行深入介绍。接下来是 `Power View`。我将向您展示如何使用 `Power
    View` 轻松构建交互式可视化，使您能够探索数据以发现趋势并获得洞察。此外，我还会向您展示 `Power Pivot` 如何允许您创建一个能充分利用 `Power
    View` 中可用功能的数据模型。

