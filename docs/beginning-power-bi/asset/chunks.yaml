    Summary


    In this chapter you have seen how to combine the various visualizations in Power
    View to create interactive dashboards. You also saw how you can use tiles to group
    other visualizations on the dashboards. Although you did not explore deploying
    a dashboard to SharePoint, this would be the logical next step. SharePoint, either
    in the cloud with Office 365 or on-premises with SharePoint 2013, enables great
    features for collaborating and managing self-service BI. In the next chapter,
    you will look at another useful Excel add-in to use in your self-service BI arsenal.
    Power Query provides an easy-to-use interface for discovering and transforming
    data for use in your Power Pivot models. It also contains tools to clean and shape
    data such as removing duplicates, replacing values, and grouping data.


    PART 3


    ![image](Images/frontdot.jpg)


    Exploring and Presenting Data with Power Query and Power Map


    CHAPTER 11


    ![image](Images/frontdot.jpg)


    Data Discovery with Power Query


    Although Power Pivot provides many types of connections you can use to query data,
    there are times when you need to manipulate the data before loading it into the
    model. This process is commonly known as tttthe transform part of the ETL (extract,
    transform, and load) process. This is where Power Query really shines and is a
    very useful part of your BI arsenal. Power Query provides an easy-to-use interface
    for discovering and transforming data. It contains tools to clean and shape data
    such as removing duplicates, replacing values, and grouping data. In addition,
    it supports a vast array of data sources both structured and unstructured, such
    as relational databases, web pages, and Hadoop, just to name a few. Once the data
    is extracted and transformed, you can then easily load it into a Power Pivot model.


    After completing this chapter you will be able to


    *   Discover and import data from various sources.

    *   Cleanse data.

    *   Merge, shape, and filter data.

    *   Group and aggregate data.

    *   Insert calculated columns.


    Discovering and Importing Data


    Traditionally, if you needed to combine and transform data from various disparate
    data sources, you would rely on the IT department to stage the data for you using
    a tool such as SQL Server Integration Services (SSIS). This can often be a long,
    drawn-out effort of data discovery, cleansing, and conforming the data to a relational
    structure. Although this type of formal effort is needed to load and conform data
    for the corporate operational data store, there are many times when you just want
    to add data to your Power Pivot model from a variety of sources in a quick, intuitive,
    and agile manner. To support this effort, you can use Power Query, a free add-in
    to Excel, as your self-service BI ETL tool. Once you have downloaded and installed
    the latest version of Power Query, you will see a new Power Query tab in Excel
    (see [Figure 11-1](#9781430264453_Ch11.xhtml#Fig1)).


    ![9781430264453_Fig11-01.jpg](Images/9781430264453_Fig11-01.jpg)


    [Figure 11-1](#9781430264453_Ch11.xhtml#_Fig1). The new Power Query tab


    If you look at the Get External Data area of the tab, you can see the variety
    of data sources available to you. You can get data from the web, files, databases,
    and a variety of other sources (see [Figure 11-2](#9781430264453_Ch11.xhtml#Fig2)).


    ![9781430264453_Fig11-02.jpg](Images/9781430264453_Fig11-02.jpg)


    [Figure 11-2](#9781430264453_Ch11.xhtml#_Fig2). Some of the many data sources
    available in Power Query'
