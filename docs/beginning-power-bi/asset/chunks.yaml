    1.  在 `LabStarters` 文件夹中，打开 `LabChapter9.xlsx` 文件。该文件包含来自测试数据库 AdventureWorks
    的销售数据。

    2.  在 Excel 中选择“插入”选项卡，并单击“Power View”按钮。这将在工作簿中插入一个 Power View 报表工作表。

    3.  创建一个表格，按区域或国家列出销售额以及经销商销售额。

    4.  在 Power View 工作表上选中该表格，将可视化效果切换为簇状条形图。调整图表大小。图表应类似于图 9-27。


    ![9781430264453_Fig09-27.jpg](img/9781430264453_Fig09-27.jpg)


    图 9-27 创建条形图


    5.  选中条形图，将“经销商业务类型”拖拽至“图例”下拉框中。图表现在会按国家分组显示每种业务类型的条形。

    6.  将图表切换为百分比堆积条形图。在“布局”选项卡下，更改设置以显示数据标签。图表应类似于图 9-28。


    ![9781430264453_Fig09-28.jpg](img/9781430264453_Fig09-28.jpg)


    图 9-28 创建百分比堆积条形图


    7.  在“Power View”选项卡上，单击“Power View”按钮以插入一个新的 Power View 工作表。创建一个堆积柱形图，按年份和类别显示经销商销售利润。您的图表应类似于图
    9-29。


    ![9781430264453_Fig09-29.jpg](img/9781430264453_Fig09-29.jpg)


    图 9-29 创建堆积柱形图


    8.  添加一个新的 Power View 工作表。在此工作表上创建一个表格，显示部门名称和平均休假小时数。您需要在“字段”拖放区域将休假小时数从“求和”改为“平均值”。

    9.  将可视化效果切换为饼图。在图表“筛选器”区域，将图表限制为仅显示“信息服务”、“市场”、“采购”和“销售”部门。图表应类似于图 9-30。


    ![9781430264453_Fig09-30.jpg](img/9781430264453_Fig09-30.jpg)


    图 9-30 创建饼图


    10. 要创建折线图，请添加一个新的 Power View 工作表，并创建一个包含月份名称和 Internet 销售额的表格。将可视化效果切换为折线图。将客户所在国家添加到“图例”拖放区域。最终的图表应类似于图
    9-31。请注意，美国和澳大利亚有峰值，而其他地区则相当平稳。


    ![9781430264453_Fig09-31.jpg](img/9781430264453_Fig09-31.jpg)


    图 9-31 在折线图中比较数据


    11. 要创建散点图，请添加一个新的 Power View 工作表，并创建一个包含 `ResellerName`、`ResellerSalesProfit`
    和 `ResellerSales` 的表格。将表格更改为散点图。将业务类型添加到“颜色”下拉框中。

    12. 将 `SalesTerritoryCountry` 拖拽至图表“筛选器”区域，并将图表限制为仅显示德国。使用 `MonthYear` 创建一个播放轴。使用播放轴，确定最大利润损失发生在哪个经销商、何时以及损失多少。最终得到的可视化效果应类似于图
    9-32。


    ![9781430264453_Fig09-32.jpg](img/9781430264453_Fig09-32.jpg)


    图 9-32 使用带播放轴的散点图确定最大利润损失


    13. 要创建基于地图的可视化效果，请在工作簿中插入一个新的 Power View 工作表。使用客户 `FullName` 和客户 `StateProvince`
    创建一个表格。将表格切换为地图，将 `Full Name` 字段从“颜色”下拉框拖拽至“大小”下拉框，并将聚合方式更改为“非重复计数”。

    14. 将 `HouseOwnerFlag` 拖拽至“颜色”下拉框。放大至美国西部地区；您的地图应类似于图 9-33。


    ![9781430264453_Fig09-33.jpg](img/9781430264453_Fig09-33.jpg)

