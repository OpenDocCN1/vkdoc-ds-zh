  trans: "\n19.  数据透视表显示了每个月开设的店铺数量。点击不同年份，观察数据的变化。\n20.  若要找出某个产品类别的最佳销售日，请创建一个`Sale\
    \ Quantity`度量值。\n\n```\nSale Quantity:=SUM([SalesQuantity])\n```\n\n21.  使用`Sale\
    \ Quantity`度量值创建一个`Top Sale Day Quantity`度量值。`MAXX`函数用于打破平局，并返回最近的`DateKey`。\n\
    \n```\nTop Sale Day Quantity:=MAXX(values('Date'[Datekey]),[Sale Quantity])\n\
    ```\n\n22.  要找出最佳销售日的日期，首先需要创建一个筛选器函数，该函数返回在指定期间内`Sale Quantity`等于`Top Sale Day\
    \ Quantity`的日期。\n\n```\nFilter(VALUES('Date'[Datekey]),\n[Sale Quantity]=CALCULATE([Top\
    \ Sale Day Quantity],\nVALUES('Date'[Datekey])))\n```\n\n23.  然后将此筛选器插入到`CALCULATE`函数中，该函数将返回最近的日期。\n\
    \n```\nTop Sale Day:=CALCULATE(MAX('Date'[Datekey]),\nFilter(VALUES('Date'[Datekey]),[Sale\
    \ Quantity]=\nCALCULATE([Top Sale Day Quantity],VALUES('Date'[Datekey]))))\n```\n\
    \n24.  创建一个如图 5-29 所示的数据透视表来测试你的度量值。\n\n![9781430264453_Fig05-29.jpg](img/9781430264453_Fig05-29.jpg)\n\
    \n图 5-29. 测试最佳销售日度量值\n\n25.  在 Sales 表中创建以下度量值，并将其格式设置为货币：\n\n```\nAve Sales:=AVERAGE([SalesAmount])\n\
    Total Ave Sales:=If(ISBLANK([Ave Sales]),BLANK(),\n                          \
    \  CALCULATE([Ave Sales],ALLSELECTED()))\n```\n\n26.  在度量值网格中选择`Ave Sales`度量值。右键单击它，然后在上下文菜单中选择“创建\
    \ KPI”。在 KPI 对话框中，注意基础度量值是`Ave Sales`。将目标值设置为`Total Ave Sales`。将低阈值设置为 90%，高阈值设置为\
    \ 110%（参见图 5-30）。\n\n![9781430264453_Fig05-30.jpg](img/9781430264453_Fig05-30.jpg)\n\
    \n图 5-30. 创建平均销售额 KPI\n\n27.  关闭对话框，注意`Ave Sales`度量值现在有一个图标，表示它关联了一个 KPI。\n28.\
    \  创建一个如图 5-31 所示的数据透视表来测试该 KPI。你可以将某个店铺的平均销售额与显示的所有店铺的总平均销售额进行比较。\n\n![9781430264453_Fig05-31.jpg](img/9781430264453_Fig05-31.jpg)\n\
    \n图 5-31. 查看 KPI\n\n## 总结\n\n这一章内容详实而丰富。现在你已经牢固掌握了如何在 Power Pivot 模型中创建度量值。你还应该理解数据上下文及其如何影响度量结果。在开始开发更复杂的度量值时，这可能会是一个非常令人困惑的概念。不过不用担心；用得越多，理解就会越清晰。\n\
    \n下一章将进一步延伸本章的概念。一种最常见的数据分析类型是比较随时间变化的值。第 6 章将展示如何在 Power Pivot 中正确实现基于时间的分析。内容包括设置日期表、使用各种内置函数分析截至当前日期的值、比较不同时间段的值，以及执行半加法聚合。\n\
    \n# 第 6 章\n\n![image](img/frontdot.jpg)\n\n## 融入时间智能\n\n一种最常见的数据分析类型是比较随时间变化的值。本章将向读者展示如何在\
    \ Power Pivot 中正确实现基于时间的分析。内容包括设置日期表、使用各种内置函数分析截至当前日期的值、比较不同时间段的值，以及执行半加法聚合。\n\
    \n完成本章后，你将能够：\n\n*   创建一个日期表。\n*   使用 DAX 进行基于时间段的评估。\n*   使用筛选器函数移动日期上下文。\n*\
    \   创建半加法度量值。\n\n## 基于日期的分析\n\n很大一部分数据分析都涉及某种基于日期时间的聚合和比较。例如，你可能需要查看截至当前月份（MTD）或截至当前年份（YTD）的使用情况或销售额，如图\
    \ 6-1 所示。\n\n![9781430264453_Fig06-01.jpg](img/9781430264453_Fig06-01.jpg)\n\n\
    图 6-1. 计算年初至今和月初至今的销售额\n\n另一个常见的例子是比较从一个时间段到下一个时间段的业绩表现。例如，你可能想要比较上个月的销售额与当前月份的销售额（参见图\
    \ 6-2），或者将当前月份的销售额与去年同期的销售额进行比较。\n\n![9781430264453_Fig06-02.jpg](img/9781430264453_Fig06-02.jpg)\n\
    \n图 6-2. 计算销售额增长\n\n除了这些常见的数据分析之外，有时你还需要基于非加和性度量值（例如账户余额或库存）进行聚合。在这些情况下，你需要确定输入的最后一个值，并使用该值来聚合不同时间段的数据（参见图\
    \ 6-3）。\n\n![9781430264453_Fig06-03.jpg](img/9781430264453_Fig06-03.jpg)\n\n图\
    \ 6-3. 聚合库存量\n\nDAX 包含许多函数，可以帮助你创建可能需要的各种基于日期时间的分析。在下一节中，你将看到如何创建日期表，这是使用许多基于日期时间的函数所必需的。\n\
    \n## 创建日期表\n\n为了使用 DAX 中内置的时间智能函数，你需要在模型中有一个日期表供这些函数引用。该表的唯一要求是，在你想查看的日期范围内，每天对应一个不同的行。每一行都需要包含该日期的完整日期。日期表可以（并且通常）包含更多列，但这并非必须。\n\
    \n有多种方法可以创建日期表。如果你从数据仓库中检索数据，可以将日期维度导入模型并使用它。如果你无法使用日期表，可以在 Excel 工作表中创建它，然后将其导入模型。如果你有权访问数据库，还可以编写\
    \ SQL 查询来创建一个临时表，并使用该临时表将日期加载到模型中。以下代码显示了可以针对 Microsoft SQL Server 数据库使用的 SQL\
    \ 查询。它使用公用表表达式来填充日期表。\n\n```\nDECLARE\n  @BeginDate DATE,\n  @EndDate DATE\n\n\
    SET @BeginDate = '01/01/2010'\nSET @EndDate = '12/31/2014'\n;\n\nWITH cteDate\
    \ AS (\n  SELECT @BeginDate AS CalendarDate\n  UNION ALL\n  SELECT DATEADD(DAY,1,CalendarDate)\n\
    \    FROM cteDate\n    WHERE CalendarDate < @EndDate)\n\nSELECT\n  (DATEPART(YEAR,CalendarDate)\
    \ * 10000) + (DATEPART(MONTH,CalendarDate) * 100)  +\n    DATEPART(DAY,CalendarDate)\
    \ AS DateKey,\n  CalendarDate,\n  DATEPART(YEAR,CalendarDate) AS Year,\n  DATEPART(MONTH,CalendarDate)\
    \ AS MonthNumber,\n  DATENAME(MONTH,CalendarDate) AS Month\n  FROM cteDate\n \
    \ OPTION (MAXRECURSION 0)\n```\n\n将表放入模型后，你需要将其标记为官方日期表（参见图 6-4），并指明哪一列是唯一键（参见图\
    \ 6-5）。这会通知 DAX 查询引擎使用此表作为参考，来构造计算所需的一组日期。例如，如果你想要查看年初至今的销售额，查询引擎将使用此表来获取所需的日期集。\n\
    \n![9781430264453_Fig06-04.jpg](img/9781430264453_Fig06-04.jpg)\n\n图 6-4. 标识日期表\n\
    \n![9781430264453_Fig06-05.jpg](img/9781430264453_Fig06-05.jpg)\n\n图 6-5. 设置日期键\n"
- fmt: "Currently there are 35 built-in time intelligent functions in `DAX`. Some\
    \ of these functions like `FIRSTNONBLANK` return a single date. Some return a\
    \ set of dates such as `PREVIOUSMONTH`. And still others like `TOTALQTD` evaluate\
    \ expressions over time. At this point, the `DAX` built-in time intelligence functions\
    \ support the traditional calendar ending on December 31st. They also support\
    \ a fiscal calendar that has a different year-end date and contains four quarters\
    \ containing three months each. If you need to use a custom financial calendar,\
    \ you need to create your own custom calculations.\n\nNow that you understand\
    \ how to create and designate the date table in your model, it is time to look\
    \ at implementing some of the common time intelligent functions to analyze your\
    \ data.\n\n## Time Period–Based Evaluations\n\nA common analysis often employed\
    \ in data analytics is looking at period-to-date values. For example, you may\
    \ want to look at sales year-to-date or energy consumption month-to-date. `DAX`\
    \ provides the `TOTALMTD`, `TOTALQTD`, and `TOTALYTD` functions that make this\
    \ very easy. For instance, the total year-to-date is defined as follows:\n\n```\n\
    TOTALYTD(<expression>,<dates>[,<filter>][,<year_end_date>])\n```\n\nwhere the\
    \ expression is an expression that returns a scalar value. The `dates` is the\
    \ date table’s key column. The `filter` is an optional filter expression and the\
    \ `year_end_date` is also optional—you can use it to indicate the year end of\
    \ a fiscal calendar. The following expressions are used to calculate the sum of\
    \ the sales and the sales year-to-date values.\n\n```\nSum of Sales:=SUM(Sales[SalesAmount])\n\
    YTD Sales:=TOTALYTD([Sum of Sales],'Date'[Datekey])\n```\n\nIf you want to calculate\
    \ year-to-date sales for all products, use the following expression:\n\n```\n\
    YTD Sales ALL Products:=TOTALYTD([Sum of Sales],'Date'[Datekey],ALL('Product'))\n\
    ```\n\n[Figure 6-6](#9781430264453_Ch06.xhtml#Fig6) shows the measures in a pivot\
    \ table. You can use these base measures to calculate further measures, such as\
    \ percent of year-to-date sales and percent of all product sales.\n\n![9781430264453_Fig06-06.jpg](Images/9781430264453_Fig06-06.jpg)\n\
    \n[Figure 6-6](#9781430264453_Ch06.xhtml#_Fig6). Calculating year-to-date values\n\
    \nYou can also use another set of functions—`DATESMTD`, `DATESQTD`, and `DATESYTD`—to\
    \ create the same measures. Just as with the previous to-date measures, you need\
    \ to pass the date key from the date table to the functions. The following expression\
    \ uses the `CALCULATE` function with the `DATESYTD` filter to get the sales year-to-date\
    \ measure.\n\n```\nYTD Sales 2:=CALCULATE([Sum of Sales],DATESYTD('Date'[Datekey]))\n\
    ```\n\nUsing the `CALCULATE` function and the `DATES` functions is more versatile\
    \ than the total-to-date functions because you can use them for any type of aggregation,\
    \ not just the sum. The following expressions are used to calculate the average\
    \ sales year-to-date. The results are shown in [Figure 6-7](#9781430264453_Ch06.xhtml#Fig7).\n\
    \n```\nAve Sales:=AVERAGE([SalesAmount])\nYTD Ave Sales:=CALCULATE([Ave Sales],DATESYTD('Date'[Datekey]))\n\
    ```\n\n![9781430264453_Fig06-07.jpg](Images/9781430264453_Fig06-07.jpg)\n\n[Figure\
    \ 6-7](#9781430264453_Ch06.xhtml#_Fig7). Calculating average year-to-date values\n\
    \nNow that you know how to create time period–based calculations, you can use\
    \ this to compare past performance with current performance. But first you need\
    \ to know how to shift the date context to calculate past performance.\n\n## Shifting\
    \ the Date Context\n\nIf you want to compare performance from one period to the\
    \ same period in the past, say sales for the current month to sales for the same\
    \ month a year ago, you need to shift the date context. `DAX` contains several\
    \ functions that do this. One of the most versatile functions for shifting the\
    \ date context is the `PARALLELPERIOD` function. As with the other time intelligence\
    \ functions, you need to pass the key column of the date table to the function.\
    \ You also need to indicate the number of intervals and the interval type of year,\
    \ quarter, or month.\n\n```\nPARALLELPERIOD(<dates>,<number_of_intervals>,<interval>)\n\
    ```\n\nOne thing to remember is that the `PARALLELPERIOD` function returns a set\
    \ of dates that corresponds to the interval type. If you use the year, it returns\
    \ a year of dates; the month interval returns a month’s worth of dates. The following\
    \ expression calculates the sales totals for the month of the previous year. [Figure\
    \ 6-8](#9781430264453_Ch06.xhtml#Fig8) shows the results of the calculation.\n\
    \n```\nMonth Sales Last Year:=Calculate([Sum of Sales],\nPARALLELPERIOD('Date'[Datekey],-12,Month))\n\
    ```\n\n![9781430264453_Fig06-08.jpg](Images/9781430264453_Fig06-08.jpg)\n\n[Figure\
    \ 6-8](#9781430264453_Ch06.xhtml#_Fig8). Calculating sales for a parallel period\n\
    \nNotice that if you drill down to the date level (see [Figure 6-9](#9781430264453_Ch06.xhtml#Fig9)),\
    \ you still see the month totals for the month of the date for a year ago. As\
    \ mentioned before, this is because the `PARALLELPERIOD` in this case always returns\
    \ the set of dates for the same month as the row date for the previous year.\n\
    \n![9781430264453_Fig06-09.jpg](Images/9781430264453_Fig06-09.jpg)\n\n[Figure\
    \ 6-9](#9781430264453_Ch06.xhtml#_Fig9). Drilling to day level still shows month\
    \ level aggregation\n\nNow that you can calculate the month sales of the previous\
    \ year you can combine it with current sales to calculate the monthly sales growth\
    \ from one year to the next. [Figure 6-10](#9781430264453_Ch06.xhtml#Fig10) shows\
    \ the results.\n\n```\nYOY Monthly Growth:=([Sum of Sales]-[Month Sales Last Year])/[Month\
    \ Sales Last Year] \n```\n\n![9781430264453_Fig06-10.jpg](Images/9781430264453_Fig06-10.jpg)\n\
    \n[Figure 6-10](#9781430264453_Ch06.xhtml#_Fig10). Calculating year over year\
    \ monthly growth\n\nNotice if there is no previous year sales you get an error\
    \ in the pivot table. You can control this by checking if the month sales for\
    \ last year is blank and inserting a blank value instead.\n\n```\nYOY Monthly\
    \ Growth:=IF(\nISBLANK([Month Sales Last Year]),\nBLANK(),\n([Sum of Sales]-[Month\
    \ Sales Last Year])/[Month Sales Last Year])\n```\n\nAnother function commonly\
    \ used to alter the date context is the `DATEADD` function. The `DATEADD` function\
    \ is used to add a date interval to the current date context. You can add year,\
    \ quarter, month, or day intervals.\n\n```\nDATEADD(<dates>,<number_of_intervals>,<interval>)\n\
    ```\n\nThe following calculation is used to find the sum of the previous day sales\
    \ using the `DATEADD` function as a filter.\n\n```\nPrev Day Sales:=Calculate([Sum\
    \ of Sales],DATEADD('Date'[Datekey],-1,day))\n```\n\nNow that you know how to\
    \ shift the date context, it is time to look at functions you can use in your\
    \ filters that return a single date.\n\n## Using Single Date Functions\n\n`DAX`\
    \ contains a set of functions that return a single date. These are usually used\
    \ when filtering the date context. For example the `FIRSTDATE` function returns\
    \ the first date in the column of dates passed to it. As an example, you can use\
    \ this in combination with the `DATESBETWEEN` function to get the range of dates\
    \ from the first day to the 15th day of the current date context set of dates.\n\
    \n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n ,FIRSTDATE('Date'[FullDateAlternateKey])\n\
    ,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]), 14, DAY))\n```\n\nThis can then\
    \ be used as a filter in the `CALCULATE` function to get the sales during the\
    \ first 15 days of the period. The resulting pivot table is shown in [Figure 6-11](#9781430264453_Ch06.xhtml#Fig11).\n\
    \n![9781430264453_Fig06-11.jpg](Images/9781430264453_Fig06-11.jpg)\n\n[Figure\
    \ 6-11](#9781430264453_Ch06.xhtml#_Fig11). Calculating sales for the first 15\
    \ days of the month\n\nIf you are just looking at the monthly periods, you can\
    \ use the functions `STARTOFMONTH` and `ENDOFMONTH` (there are ones for year and\
    \ quarter also.). The following expression is used to calculate the sum of the\
    \ sales for the last 15 days of the month."
