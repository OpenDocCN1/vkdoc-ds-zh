    \ Analysis Expressions (DAX) comes into play. This chapter introduces you to DAX\
    \ and shows you how to use DAX to create calculated columns to add to the functionality\
    \ of your model.\n\nAfter completing this chapter you will be able to\n\n*   Use\
    \ DAX to add calculated columns to a table.\n*   Implement DAX operators.\n* \
    \  Work with text functions in DAX.\n*   Use DAX date and time functions.\n* \
    \  Use conditional and logical functions.\n*   Get data from a related table.\n\
    *   Use math, trig, and statistical functions.\n\nWhat Is DAX?\n\nDAX is a formula\
    \ language used to create calculated columns and measures in the Power Pivot model.\
    \ It is a new language developed specifically for the tabular data model Power\
    \ Pivot is based on. If you are familiar with Excel’s formula syntax, you will\
    \ find that the DAX syntax is very familiar. In fact some of the DAX formulas\
    \ have the same syntax and functionality as their Excel counterparts. The major\
    \ difference, and one that you need to wrap your head around, is that Excel formulas\
    \ are cell based whereas DAX is column based. For example, if you want to concatenate\
    \ two values in Excel, you would use a formula like the following:\n\n```\n=A1\
    \ & \" \" & B1\n```\n\nwhere `A1` is the cell in the first row and first column\
    \ and `B1` is the cell in the second column of the first row (see [Figure 4-1](#9781430264453_Ch04.xhtml#Fig1)).\n\
    \n![9781430264453_Fig04-01.jpg](Images/9781430264453_Fig04-01.jpg)\n\n[Figure\
    \ 4-1](#9781430264453_Ch04.xhtml#_Fig1). Entering a formula in Excel\n\nThis is\
    \ very similar to the DAX formula:\n\n```\n =[First Name] & \" \" & [Last Name]\n\
    ```\n\nwhere the `First Name` and `Last Name` are columns in a table in the model\
    \ (see [Figure 4-2](#9781430264453_Ch04.xhtml#Fig2)).\n\n![9781430264453_Fig04-02.jpg](Images/9781430264453_Fig04-02.jpg)\n\
    \n[Figure 4-2](#9781430264453_Ch04.xhtml#_Fig2). Entering a formula in Power Pivot\n\
    \nThe difference is that the DAX formula is applied to all rows in the table whereas\
    \ the Excel formula only works on the specific cells. In Excel you need to re-create\
    \ the formula in each row.\n\nWhat this means is although you can do something\
    \ like this in Excel:\n\n```\n=A1 & \" \" & B2\n```\n\nwhere you are taking a\
    \ cell from the first row and concatenating a cell from the second row (see [Figure\
    \ 4-3](#9781430264453_Ch04.xhtml#Fig3)), this can’t be done in DAX.\n\n![9781430264453_Fig04-03.jpg](Images/9781430264453_Fig04-03.jpg)\n\
    \n[Figure 4-3](#9781430264453_Ch04.xhtml#_Fig3). Using cells in different rows\n\
    \nWhen creating DAX formulas it is important to consider the data types and any\
    \ conversions that may take place during the calculations. If you do not take\
    \ these into account you may experience errors in the formula or unexpected results.\
    \ The supported data types in the model are whole number, decimal number, currency,\
    \ Boolean, text, and date. DAX also has a table data type that is used in many\
    \ functions that take a table as an input value and return a table.\n\nWhen you\
    \ try to add a numeric data type with a text data type you get an implicit conversion.\
    \ If DAX can convert the text to a numeric value it will add them as numbers,\
    \ if it can’t you will get an error. On the other hand, if you try to concatenate\
    \ a numeric data type with a text data type, DAX will implicitly convert the numeric\
    \ data type to text. Although most of the time implicit conversions give you the\
    \ results you are looking for, they come at a performance cost and should be avoided\
    \ if possible. For example, if you import data from a text file and the column\
    \ is set to a text data type but you know it is in fact numeric, you should change\
    \ the data type in the model.\n\nWhen creating calculations in DAX you will need\
    \ to reference tables and columns. If the table name does not contain spaces,\
    \ you can just refer to it by name. If the table name contains spaces, you need\
    \ to enclose it in single quotes. Columns and measures are enclosed in brackets.\
    \ If you just list the column name in the formula, it is assumed that the column\
    \ exists in the same table. If you are referring to a column in another table,\
    \ you need to use the fully qualified name, which is the table name followed by\
    \ the column name. The following code demonstrates the syntax:\n\n```\n=[SalesAmount]\
    \ - [TotalCost]\n=Sales[SalesAmount] - Sales[TotalCost]\n='Internet Sales'[SalesAmount]\
    \ - 'Internet Sales'[TotalCost]\n```\n\nHere are some other points to keep in\
    \ mind when you are working with DAX:\n\n*   DAX formulas and expressions cannot\
    \ modify or insert individual values in tables.\n*   You cannot create calculated\
    \ rows by using DAX. You can create only calculated columns and measures.\n* \
    \  When defining calculated columns, you can nest functions to any level.\n\n\
    The first thing to understand when creating a calculation is what operators are\
    \ supported and what the syntax to use them is. In the next section you will investigate\
    \ the various DAX operators.\n\nImplementing DAX Operators\n\nDAX contains a robust\
    \ set of operators that includes arithmetic, comparison, logic, and text concatenation.\
    \ Most of these should be familiar to you and are listed in [Table 4-1](#9781430264453_Ch04.xhtml#Tab1).\n\
    \n[Table 4-1](#9781430264453_Ch04.xhtml#_Tab1). DAX Operators\n\n| Category |\
    \ Symbol | Use |\n| --- | --- | --- |\n| Arithmetic operators |\n|   | + | Addition\
    \ |\n|   | - | Subtraction |\n|   | * | Multiplication |\n|   | / | Division |\n\
    |   | ^ | Exponentiation |\n| Comparison operators |\n|   | = | Equal to |\n|\
    \   | > | Greater than |\n|   | < | Less than |\n|   | >= | Greater than or equal\
    \ to |\n|   | <= | Less than or equal to |\n|   | <> | Not equal to |\n| Text\
    \ concatenation operator |\n|   | & | Concatenation |\n|   |   | Logic operators\
    \ |\n|   | && | And |\n|   | &#124;&#124; | Or |"
