    =([Sales Amount]-[Total Cost])/[Total Cost]

    ```


    比较运算符主要用于`IF`语句。例如，以下计算检查商店的销售面积是否大于 1000。如果是，则归类为大型商店，否则归类为小型商店。


    ```

    =IF([Selling Area Size]>1000,"Large","Small")

    ```


    逻辑运算符用于创建多重比较逻辑。以下代码检查商店面积是否大于 1000 或员工人数是否超过 35，以将其归类为大型商店。


    ```

    =IF([Selling Area Size]> 1000 || [Employee Count] > 35,"Large","Small")

    ```


    当开始串联一系列逻辑条件时，建议使用括号来控制运算顺序。以下代码检查商店面积是否大于 1000 且员工人数是否超过 35，以将其归类为大型商店。此外，如果其年销售额超过
    1,000,000 美元，无论其面积大小或员工数量如何，也会将其归类为大型商店。


    ```

    =IF(([Selling Area Size]> 1000 && [Employee Count] > 35) || [Annual Sales] > 1000000,"Large","Small")

    ```


    在使用`DAX`计算时，您可能需要将一个公式嵌套在另一个公式内部。例如，以下代码将一个`IF`语句嵌套在另一个`IF`语句的`false`部分中。如果员工数量不大于
    35，则会跳转到下一个`IF`语句，检查是否大于 20。


    ```

    =IF(Store[EmployeeCount]>35,"Large",IF(Store[EmployeeCount]>20,"Medium","Small"))

    ```


    `DAX`包含许多用于创建计算和度量的有用函数。这些函数包括文本函数、日期和时间函数、统计函数、数学函数和信息函数。在接下来的几节中，您将学习如何在计算中使用各种函数类型。


    ---


    ## 使用文本函数


    许多计算都涉及某种文本处理。您可能需要截断、解析、搜索或格式化从源系统加载的文本值。`DAX`包含许多用于处理文本的有用函数。这些函数及其用途说明列在表 4-2
    中。


    **表 4-2.** `DAX`文本函数


    | 函数 | 描述 |

    | --- | --- |

    | `BLANK` | 返回一个空白。 |

    | `CONCATENATE` | 将两个文本字符串连接成一个文本字符串。 |

    | `EXACT` | 比较两个文本字符串，如果完全相同则返回`TRUE`，否则返回`FALSE`。 |

    | `FIND` | 返回一个文本字符串在另一个文本字符串中的起始位置。 |

    | `FIXED` | 将数字四舍五入到指定的小数位数，并将结果作为文本返回。 |

    | `FORMAT` | 根据指定的格式将值转换为文本。 |

    | `LEFT` | 返回文本字符串开头指定数量的字符。 |

    | `LEN` | 返回文本字符串中的字符数。 |

    | `LOWER` | 将文本字符串中的所有字母转换为小写。 |

    | `MID` | 从文本字符串中返回指定起始位置和长度的字符串。 |

    | `REPLACE` | 用另一个文本字符串替换文本字符串的一部分。 |

    | `REPT` | 将文本重复指定次数。使用`REPT`可以用文本字符串的多个实例填充单元格。 |

    | `RIGHT` | 根据指定的字符数，返回文本字符串中最后一个或多个字符。 |

    | `SEARCH` | 返回从左到右读取时，首次找到特定字符或文本字符串的字符位置编号。 |

    | `SUBSTITUTE` | 用新文本替换文本字符串中的现有文本。 |

    | `TRIM` | 删除文本中除单词间单个空格之外的所有空格。 |

    | `UPPER` | 将文本字符串转换为全大写字母。 |

    | `VALUE` | 将表示数字的文本字符串转换为数字。 |


    作为在计算中使用文本函数的示例，假设产品表中有一个产品代码列，其前两个字符代表产品系列。要创建产品系列列，可以使用`Left`函数，如下所示：


    ```

    =Left([Product Code],2)

    ```


    您可以使用`FIND`函数在文本中搜索子文本。您可以使用问号（`?`）匹配任意单个字符，使用星号（`*`）匹配任意字符序列。您可以选择指定搜索的起始位置。`FIND`函数返回找到的子字符串的起始位置。如果未找到子字符串，它可以返回`0`、`-1`或空白值。以下代码在产品描述列中搜索单词“mountain”。


    ```

    =FIND("mountain",[Description],1,-1)

    ```


    `FORMAT`函数根据提供的格式将值转换为文本。例如，您可能需要将日期转换为特定格式。以下代码将日期数据类型转换为格式类似“Mon - Dec 02, 2013”的字符串。


    ```

    =FORMAT([StartDate],"ddd - MMM dd, yyyy")

    ```


    除了能够创建自己的格式之外，您还可以使用预定义的格式。以下代码演示了使用长日期格式“Monday, December 2, 2013”。


    ```

    =FORMAT([StartDate],"Long Date")

    ```


    现在您已经了解了如何使用一些文本函数，接下来要讨论的函数类型是内置的日期和时间函数。


    ---


    ## 使用 DAX 日期和时间函数


    您很可能会发现数据分析中带有日期维度。您可能需要查看销售或能源消耗数据，并需要了解事件发生的是星期几。您可能需要计算年龄或到期日期。`DAX`提供了相当多的日期和时间函数来帮助创建此类计算。表
    4-3 总结了各种可用的日期和时间函数。


    **表 4-3.** `DAX`日期和时间函数

    '
- fmt: "| Function | Description |\n| --- | --- |\n| `DATE` | Returns the specified\
    \ date in datetime format |\n| `DATEVALUE` | Converts a date in the form of text\
    \ to a date in datetime format |\n| `DAY` | Returns the day of the month |\n|\
    \ `EDATE` | Returns the date that is the indicated number of months before or\
    \ after the start date |\n| `EOMONTH` | Returns the date in datetime format of\
    \ the last day of the month, before or after a specified number of months |\n\
    | `HOUR` | Returns the hour as a number from 0 (12:00 A.M.) to 23 (11:00 P.M.)\
    \ |\n| `MINUTE` | Returns the minute as a number from 0 to 59 |\n| `MONTH` | Returns\
    \ the month as a number from 1 (January) to 12 (December) |\n| `NOW` | Returns\
    \ the current date and time in datetime format |\n| `SECOND` | Returns the seconds\
    \ of a time value, as a number from 0 to 59 |\n| `TIME` | Converts hours, minutes,\
    \ and seconds given as numbers to a time in datetime format |\n| `TIMEVALUE` |\
    \ Converts a time in text format to a time in datetime format |\n| `TODAY` | Returns\
    \ the current date |\n| `WEEKDAY` | Returns a number from 1 to 7 identifying the\
    \ day of the week of a date |\n| `WEEKNUM` | Returns the week number for the given\
    \ date |\n| `YEAR` | Returns the year of a date as a four digit integer |\n| `YEARFRAC`\
    \ | Calculates the fraction of the year represented by the number of whole days\
    \ between two dates |\n\nAs an example of using the date functions, you need to\
    \ calculate years of service for employees. The first thing you need to do is\
    \ find the difference between the current year and the year they were hired. The\
    \ following code gets the year from today’s date.\n\n```\n=YEAR(Today())\n```\n\
    \nNow you can subtract the year of their hire date. Notice we are nesting one\
    \ function inside of another. Nesting functions is a common requirement for many\
    \ calculations.\n\n```\n=YEAR(TODAY()) - YEAR([HireDate])\n```\n\nAstute readers\
    \ will realize that this calculation is only correct if the current month is greater\
    \ than or equal to the month they were hired. You can adjust for this using a\
    \ conditional if statement as follows:\n\n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),YEAR(TODAY())\
    \ - YEAR([HireDate]),YEAR(TODAY()) - YEAR([HireDate])-1)\n```\n\nAs you can see,\
    \ calculations can get quite complicated pretty quickly. The challenge is making\
    \ sure the open and closing parentheses of each function line up correctly. One\
    \ way to organize the code is to use multiple lines and indenting. To get a new\
    \ line in the formula editor bar, you need to hold down the Shift key while you\
    \ press Enter. I find the following easier to understand.\n\n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),\n\
    \        YEAR(TODAY()) - YEAR([HireDate]),\n        YEAR(TODAY()) - YEAR([HireDate])-1\n\
    \     )\n```\n\nUnfortunately you can’t add comments to your code in Power Pivot.\n\
    \nThere is often more than one way to create a calculation. You may find an easier\
    \ way to make the calculation or one that performs better. The following calculates\
    \ the years of service using the `YEARFRAC` function and the `TRUNC` function\
    \ (one of the math functions) to drop the decimal part of the number.\n\n```\n\
    =TRUNC(YEARFRAC([HireDate],TODAY()))\n```\n\nThe next group of functions you are\
    \ going to investigate are the informational and logical functions. These functions\
    \ are important when you want to determine if a condition exists such as a blank\
    \ value or an error is occurring due to a calculation. These functions allow you\
    \ to trap for conditions and respond to them in an appropriate way.\n\nUsing Informational\
    \ and Logical Functions\n\nAs you start building more complex calculations, you\
    \ often need to use informational and logical functions to check for conditions\
    \ and respond to various conditions. One common example is the need to check for\
    \ blank values. The `ISBLANK` function returns TRUE if the value is blank and\
    \ FALSE if it is not. The following code uses a different calculation depending\
    \ on whether the middle name is blank.\n\n```\n=IF(ISBLANK([MiddleName]),\n[FirstName]\
    \ & \" \" & [LastName],\n[FirstName] & \" \" & [MiddleName] & \" \" & [LastName]\n\
    )\n```"
