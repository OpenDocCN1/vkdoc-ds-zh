    # 方差


    `方差 %:= [方差]/[总销售额]`


    为销售代表创建一个关键绩效指标（KPI），当销售额超过其配额的 5% 时表示良好，低于 5% 时表示不佳。该 KPI 应基于`总销售额`度量，并与`配额`总度量进行比较。


    通过创建数据透视表来测试你的度量，如图 图 14-9 所示。


    ![9781430264453_Fig14-09.jpg](img/9781430264453_Fig14-09.jpg)


