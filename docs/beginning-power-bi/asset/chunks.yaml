    \ 5-31](#9781430264453_Ch05.xhtml#_Fig31). 查看KPI\n\n## 总结\n\n这是一个内容冗长且详尽的章节。你现在应该已经掌握了如何在Power\
    \ Pivot模型中创建度量。你还应该理解数据上下文以及它如何影响度量。当你开始开发更复杂的度量时，这可能会是一个非常令人困惑的概念。别担心；你用得越多，它就会变得越清晰。\n\
    \n下一章将扩展本章的概念。最常见的数据分析类型之一是随时间比较值。[第6章](../Text/9781430264453_Ch06.xhtml)将向你展示如何在Power\
    \ Pivot中正确实现基于时间的分析。它包括设置日期表，以及使用各种内置函数来分析（截至到）当前日期的值、比较不同时期的值以及执行半加法聚合。\n\n#\
    \ 第6章\n\n![image](Images/frontdot.jpg)\n\n## 融入时间智能\n\n最常见的数据分析类型之一是随时间比较值。本章将向读者展示如何在Power\
    \ Pivot中正确实现基于时间的分析。它包括设置日期表，以及使用各种内置函数来分析（截至到）当前日期的值、比较不同时期的值以及执行半加法聚合。\n\n完成本章后，你将能够：\n\
    \n*   创建一个日期表。\n*   使用DAX进行基于时间段的评估。\n*   使用筛选函数切换日期上下文。\n*   创建半加法度量。\n\n## 基于日期的分析\n\
    \n很大一部分数据分析都涉及某种基于日期时间的聚合和比较。例如，你可能需要查看本月至今（MTD）或本年至今（YTD）的使用量或销售额，如[图6-1](#9781430264453_Ch06.xhtml#Fig1)所示。\n\
    \n![9781430264453_Fig06-01.jpg](Images/9781430264453_Fig06-01.jpg)\n\n[Figure\
    \ 6-1](#9781430264453_Ch06.xhtml#_Fig1). 计算年初至今和月初至今的销售额\n\n另一个常见示例是比较一个时间段与下一个时间段的绩效。例如，你可能想将上个月的销售额与当前销售额进行比较（参见[图6-2](#9781430264453_Ch06.xhtml#Fig2)），或者将当前月份的销售额与一年前同月份的销售额进行比较。\n\
    \n![9781430264453_Fig06-02.jpg](Images/9781430264453_Fig06-02.jpg)\n\n[Figure\
    \ 6-2](#9781430264453_Ch06.xhtml#_Fig2). 计算销售增长\n\n除了这些常见的数据分析之外，有时你还需要基于非加和性度量进行聚合，例如账户余额或库存。在这些情况下，你需要确定最后输入的值，并使用该值跨不同时间段进行聚合（参见[图6-3](#9781430264453_Ch06.xhtml#Fig3)）。\n\
    \n![9781430264453_Fig06-03.jpg](Images/9781430264453_Fig06-03.jpg)\n\n[Figure\
    \ 6-3](#9781430264453_Ch06.xhtml#_Fig3). 聚合库存数量\n\nDAX包含许多函数，可以帮助你创建可能需要的各种基于日期时间的分析。在下一节中，你将看到如何创建一个日期表，这是使用许多基于日期时间的函数所必需的。\n\
    \n## 创建日期表\n\n为了使用DAX中内置的时间智能函数，你需要在模型中有一个日期表供这些函数引用。该表的唯一要求是，它需要为你感兴趣查看的日期范围内的每一天都有一个独特的行。这些行中的每一行都需要包含该日的完整日期。日期表可以（而且通常确实）包含更多列，但并非必须如此。\n\
    \n有几种方法可以创建日期表。如果你正在从数据仓库检索数据，则可以将日期维度导入模型并使用它。如果你无法访问日期表，可以在Excel工作表中创建一个并将其导入模型。如果你有权访问数据库，还可以编写SQL查询来创建一个临时表，并使用该临时表将日期加载到模型中。以下代码显示了你可以在Microsoft\
    \ SQL Server数据库上使用的SQL查询。它使用一个公用表表达式来填充日期表。\n\n```\nDECLARE\n  @BeginDate DATE,\n\
    \  @EndDate DATE\n\nSET @BeginDate = '01/01/2010'\nSET @EndDate = '12/31/2014'\n\
    ;\n\nWITH cteDate AS (\n  SELECT @BeginDate AS CalendarDate\n  UNION ALL\n  SELECT\
    \ DATEADD(DAY,1,CalendarDate)\n    FROM cteDate\n    WHERE CalendarDate < @EndDate)\n\
    \nSELECT\n  (DATEPART(YEAR,CalendarDate) * 10000) + (DATEPART(MONTH,CalendarDate)\
    \ * 100)  +\n    DATEPART(DAY,CalendarDate) AS DateKey,\n  CalendarDate,\n  DATEPART(YEAR,CalendarDate)\
    \ AS Year,\n  DATEPART(MONTH,CalendarDate) AS MonthNumber,\n  DATENAME(MONTH,CalendarDate)\
    \ AS Month\n  FROM cteDate\n  OPTION (MAXRECURSION 0)\n```\n\n将表放入模型后，你需要将其标记为官方日期表（参见[图6-4](#9781430264453_Ch06.xhtml#Fig4)），并指明哪一列是唯一键（参见[图6-5](#9781430264453_Ch06.xhtml#Fig5)）。这告诉DAX查询引擎使用此表作为参考来构造计算所需的一组日期。例如，如果你想查看年初至今的销售额，查询引擎会使用此表来获取它需要的日期集。\n\
    \n![9781430264453_Fig06-04.jpg](Images/9781430264453_Fig06-04.jpg)\n\n[Figure\
    \ 6-4](#9781430264453_Ch06.xhtml#_Fig4). 标识日期表\n\n![9781430264453_Fig06-05.jpg](Images/9781430264453_Fig06-05.jpg)\n\
    \n[Figure 6-5](#9781430264453_Ch06.xhtml#_Fig5). 设置日期键"
