    | 表 | 列 | 数据类别 |

    | --- | --- | --- |

    | 销售代表 | 雇佣日期 | 日期 |

    | 员工 | 照片 | 图像 |

    | 销售区域 | 地区 | 国家/地区 |

    | 销售区域 | 国家 | 国家/地区 |

    | 销售区域 | 区域图像 | 图像 |


    在`期间`和`日期`表中，设置字段使其不进行汇总。


    插入一个 Power View 报表，并将其命名为**销售代表绩效**。使用磁贴功能，在标题区域显示不同的销售原因，并在详细信息区域以卡片形式显示销售代表信息（参见图
    14-10）。


    ![9781430264453_Fig14-10.jpg](img/9781430264453_Fig14-10.jpg)


