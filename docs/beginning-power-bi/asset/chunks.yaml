    **图2-25** 设计`MDX`查询


    设计完查询后，它将被输入到`MDX`语句框中，如图2-24所示，你可以在那里完成数据导入。


    ### 重用现有连接以更新模型


    在两种情况下，你需要重用与数据源的现有连接。你可能需要从数据源检索其他数据；例如，需要从其他表或视图中获取数据，或发出新查询。在这种情况下，你应选择“主页”选项卡上的“现有连接”按钮（见图2-26）。


    ![9781430264453_Fig02-26.jpg](Images/9781430264453_Fig02-26.jpg)


    **图2-26** 选择现有连接


    在“现有连接”窗口中，选择连接并单击“打开”按钮（见图2-27）。这将启动之前介绍过的屏幕（具体取决于连接类型），你可以按照流程选择要导入的数据。


    ![9781430264453_Fig02-27.jpg](Images/9781430264453_Fig02-27.jpg)


    **图2-27** 打开现有连接


    另一种情况是，当你想更改现有表的筛选条件或向其中添加列时。在这种情况下，你需要在设计器的数据视图模式下选择该表，然后在“设计”选项卡上选择“表属性”（见图2-28）。


    ![9781430264453_Fig02-28.jpg](Images/9781430264453_Fig02-28.jpg)


    **图2-28** 选择表属性


    “编辑表属性”窗口允许你更新用于填充表数据的查询。你可以在“表预览”模式（图2-29）或“查询”模式（图2-30）下更新表。在“查询编辑器”模式下，你还可以启动查询设计器来更新查询。


    ![9781430264453_Fig02-29.jpg](Images/9781430264453_Fig02-29.jpg)


    **图2-29** 在表预览模式下更新查询


    ![9781430264453_Fig02-30.jpg](Images/9781430264453_Fig02-30.jpg)


    **图2-30** 在查询编辑器模式下更新查询


    现在你已经了解了如何将数据从各种数据源导入`Power Pivot`数据模型，是时候动手实践数据导入了。


    ### 动手实验——将数据加载到Power Pivot


    在以下实验中，你将：


    *   从`Access`数据库导入数据。

    *   从文本文件导入数据。


    1.  打开`Excel 2013`并创建一个名为`LabChapter2.xlsx`的新文件。

    2.  在“`Power Pivot`”选项卡上，单击“管理数据模型”按钮（见图2-31）。这将启动`Power Pivot`模型设计器窗口。


    ![9781430264453_Fig02-31.jpg](Images/9781430264453_Fig02-31.jpg)


    **图2-31** 打开模型设计器窗口


    3.  在“主页”选项卡的“获取外部数据”组中，单击“从数据库”下拉菜单（见图2-32）。在下拉菜单中选择“从`Access`导入”。这将启动表导入向导。


