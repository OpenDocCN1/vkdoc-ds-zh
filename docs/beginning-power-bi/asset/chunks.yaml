    Before creating the dashboard in Power View, update some table settings to optimize
    the model for Power View. [Table 14-7](#9781430264453_Ch14.xhtml#Tab7) lists the
    tables and settings you need to make.


    [Table 14-7](#9781430264453_Ch14.xhtml#_Tab7). Settings to Optimize for Power
