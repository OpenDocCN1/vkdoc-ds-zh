    Summary


    One of the first steps in creating the Power Pivot model is importing data. In
    this chapter you learned how to import data from a variety of data sources. One
    of the nice features of importing data in Power Pivot is that the experience is
    similar when you import the data from the various data sources. You create a connection,
    supply a query or select tables, preview and filter the data, and then import
    it into the model. Now that you have imported the data into the various tables
    in your model, you need to set up relationships between these tables. In the next
    chapter you will learn the importance of setting up the relationships as well
    as how to augment the model with hierarchies to aid in data analysis.


    CHAPTER 3


    ![image](Images/frontdot.jpg)


    Creating the Data Model


    Now that you know how to get data into the Power Pivot model, the next step is
    to understand what makes a good model. This is very important when dealing with
    data in Power Pivot. A good model will make Power Pivot perform amazingly fast
    and allow you to analyze the data in new and interesting ways. A bad model will
    cause Power Pivot to perform very slowly and at worst give misleading results
    when performing the data analysis. Traditional Excel pivot tables are based on
    a single table contained in an Excel sheet. Power Pivot pivot tables are based
    off of multiple tables contained in the data model. This chapter guides you through
    the process of creating a solid model that will become the foundation for your
    data analysis. In addition, you will look at how to present a user-friendly model
    to client tools. This includes renaming tables and fields, presenting appropriate
    data types, and hiding extraneous fields.


    After completing this chapter you will be able to


    *   Explain what a data model is

    *   Create relationships between tables in the model

    *   Create and use a star schema

    *   Understand when and how to denormalize the data

    *   Create and use linked tables

    *   Create and use hierarchies

    *   Make a user-friendly model


    What Is a Data Model?


    Fundamentally a data model is made up of tables, columns, data types, and table
    relations. Typically data tables are constructed to hold data for a business entity;
    for example, customer data is contained in a customer table and employee data
    is contained in an employee table. Tables consist of columns that define the attributes
    of the entity. For example, you may want to hold information about customers such
    as name, address, birth date, household size, and so on. Each of these attributes
    has a data type that depends on what information the attribute holds—the name
    would be a string data type, the household size would be an integer, and the birth
    date would be a date. Each row in the table should be unique. Take a customer
    table, for example; if you had the same customer in multiple rows with different
    attributes, say birth date, you would not know which was correct.'
