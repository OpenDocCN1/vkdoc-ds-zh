    使用`Power Query`和`Power Map`探索与呈现数据


    ## 第11章


    ![image](Images/frontdot.jpg)


    使用`Power Query`进行数据发现


    尽管`Power Pivot`提供了多种可用于查询数据的连接类型，但有时需要在将数据加载到模型之前对其进行操作。此过程通常被称为`ETL`（提取、转换和加载）过程中的转换部分。这正是`Power
    Query`的强项，也是你`BI`工具库中非常有用的部分。`Power Query`提供了一个易于使用的界面，用于发现和转换数据。它包含清理和塑造数据的工具，例如删除重复项、替换值和分组数据。此外，它支持大量结构化和非结构化的数据源，例如关系数据库、网页和`Hadoop`等。一旦提取并转换了数据，你就可以轻松地将其加载到`Power
    Pivot`模型中。


    完成本章后，你将能够：


    *   从各种源发现和导入数据。

    *   清理数据。

    *   合并、塑形和筛选数据。

    *   分组和聚合数据。

    *   插入计算列。


    ### 发现和导入数据


    传统上，如果你需要合并和转换来自各种不同数据源的数据，你会依赖IT部门使用诸如`SQL Server Integration Services (SSIS)`之类的工具为你暂存数据。这通常是一个漫长而费力的过程，涉及数据发现、清理以及将数据符合关系结构。虽然需要这种正式的工作来加载和整理数据以用于企业运营数据存储，但很多时候你只想以快速、直观和敏捷的方式，将来自各种来源的数据添加到`Power
    Pivot`模型中。为了支持这一工作，你可以使用`Power Query`（Excel的一个免费加载项）作为你的自助式`BI ETL`工具。一旦你下载并安装了`Power
    Query`的最新版本，你将在Excel中看到一个名为`Power Query`的新选项卡（参见[图11-1](#9781430264453_Ch11.xhtml#Fig1)）。


