    \ values from different periods, and performing semi-additive aggregations.\n\n\
    # CHAPTER 6\n\n![image](Images/frontdot.jpg)\n\n## Incorporating Time Intelligence\n\
    \nOne of the most common types of data analysis is comparing values over time.\
    \ This chapter shows the reader how to correctly implement time-based analysis\
    \ in Power Pivot. It includes setting up a date table and using the various built-in\
    \ functions for analyzing values to date, comparing values from different periods,\
    \ and performing semi-additive aggregations.\n\nAfter completing this chapter\
    \ you will be able to\n\n*   Create a date table.\n*   Use DAX for time period–based\
    \ evaluations.\n*   Shift the date context using filter functions.\n*   Create\
    \ semi-additive measures.\n\n## Date-Based Analysis\n\nA large percentage of data\
    \ analysis involves some sort of date-time based aggregation and comparison. For\
    \ example, you may need to look at usage or sales for the month-to-date (MTD)\
    \ or year-to-date (YTD) as shown in [Figure 6-1](#9781430264453_Ch06.xhtml#Fig1).\n\
    \n![9781430264453_Fig06-01.jpg](Images/9781430264453_Fig06-01.jpg)\n\n[Figure\
    \ 6-1](#9781430264453_Ch06.xhtml#_Fig1). Calculating year-to-date and month-to-date\
    \ sales\n\nAnother common example is looking at performance from one time period\
    \ to the next. For example, you may want to compare previous month sales with\
    \ current sales (see [Figure 6-2](#9781430264453_Ch06.xhtml#Fig2)) or sales for\
    \ the current month to the same month a year before.\n\n![9781430264453_Fig06-02.jpg](Images/9781430264453_Fig06-02.jpg)\n\
    \n[Figure 6-2](#9781430264453_Ch06.xhtml#_Fig2). Calculating sales growth\n\n\
    In addition to these common data analytics, there are also times when you need\
    \ to base your aggregations on measures that are non-additive, such as account\
    \ balances or inventory. In these cases, you need to determine the last value\
    \ entered and use that value to aggregate across the different time periods (see\
    \ [Figure 6-3](#9781430264453_Ch06.xhtml#Fig3)).\n\n![9781430264453_Fig06-03.jpg](Images/9781430264453_Fig06-03.jpg)\n\
    \n[Figure 6-3](#9781430264453_Ch06.xhtml#_Fig3). Aggregating inventory amounts\n\
    \nDAX contains many functions that help you create the various date-time based\
    \ analyses you may need. In the next section, you will see how to create a date\
    \ table that is required to use many of the date-time based functions.\n\n## Creating\
    \ a Date Table\n\nIn order to use the built-in time intelligence functions in\
    \ DAX, you need to have a date table in your model for the functions to reference.\
    \ The only requirement for the table is that it needs a distinct row for each\
    \ day in the date range at which you are interested in looking. Each of these\
    \ rows needs to contain the full date of the day. The date table can, and often\
    \ does, have more columns, but it doesn’t have to.\n\nThere are several ways to\
    \ create the date table. If you are retrieving data from a data warehouse, you\
    \ can import a date dimension into the model and use it. If you do not have access\
    \ to a date table, you can create it in an Excel sheet and import it into the\
    \ model. If you have access to a database, you can also write a SQL query to create\
    \ a temporary table and load the dates into your model using the temporary table.\
    \ The following code shows the SQL query you can use against a Microsoft SQL Server\
    \ database. It uses a common table expression to populate a date table.\n\n```\n\
    DECLARE\n  @BeginDate DATE,\n  @EndDate DATE\n\nSET @BeginDate = '01/01/2010'\n\
    SET @EndDate = '12/31/2014'\n;\n\nWITH cteDate AS (\n  SELECT @BeginDate AS CalendarDate\n\
    \  UNION ALL\n  SELECT DATEADD(DAY,1,CalendarDate)\n    FROM cteDate\n    WHERE\
    \ CalendarDate < @EndDate)\n\nSELECT\n  (DATEPART(YEAR,CalendarDate) * 10000)\
    \ + (DATEPART(MONTH,CalendarDate) * 100)  +\n    DATEPART(DAY,CalendarDate) AS\
    \ DateKey,\n  CalendarDate,\n  DATEPART(YEAR,CalendarDate) AS Year,\n  DATEPART(MONTH,CalendarDate)\
    \ AS MonthNumber,\n  DATENAME(MONTH,CalendarDate) AS Month\n  FROM cteDate\n \
    \ OPTION (MAXRECURSION 0)\n```\n\nOnce you have the table in the model, you need\
    \ to mark it as the official date table (see [Figure 6-4](#9781430264453_Ch06.xhtml#Fig4))\
    \ and indicate which column is the unique key (see [Figure 6-5](#9781430264453_Ch06.xhtml#Fig5)).\
    \ This tells the DAX query engine to use this table as a reference for constructing\
    \ the set of dates needed for a calculation. For example, if you want to look\
    \ at year-to-date sales, the query engine uses this table to get the set of dates\
    \ it needs.\n\n![9781430264453_Fig06-04.jpg](Images/9781430264453_Fig06-04.jpg)\n\
    \n[Figure 6-4](#9781430264453_Ch06.xhtml#_Fig4). Identifying the date table\n\n\
    ![9781430264453_Fig06-05.jpg](Images/9781430264453_Fig06-05.jpg)\n\n[Figure 6-5](#9781430264453_Ch06.xhtml#_Fig5).\
    \ Setting the date key"
