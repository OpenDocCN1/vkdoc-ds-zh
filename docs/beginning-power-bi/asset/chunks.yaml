  trans: '

    当你开始在数据透视表中对数据进行切片和切块时，属性会成为行和列标题，而度量值则是单元格中的值。属性也常被用作筛选器，无论是通过筛选下拉菜单还是切片器。图 5-2
    展示了一个包含 2006 财年各月研发支出（实际值与预算值）的数据透视表。


    ![9781430264453_Fig05-02.jpg](img/9781430264453_Fig05-02.jpg)


    图 5-2. 在数据透视表中分析数据


    如果你查看每个单元格的筛选条件，就会发现它们的筛选方式略有不同。绿色箭头所指的两个度量值因月份而异，而红色箭头所指的度量值则因实际值与预算值而异。当你更改财年、部门或组织时，度量值必须重新计算，因为查询上下文已经改变。


    在下一节中，你将看到如何在 Power Pivot 模型中创建一些常见的聚合度量值。


    ## 创建常见聚合


    在 Power Pivot 中创建诸如求和、计数或平均值等常见聚合非常容易。首先，你需要确定要将度量值与哪个表关联。如果你遵循星型架构模型，这很可能是事实表，但也不一定非得如此。在
    Power Pivot 模型设计器的数据视图模式下，选择与度量值关联的表的选项卡。数据网格下方的区域是放置度量值公式的地方（参见图 5-3）。如果你没有看到度量值网格，可能需要通过选择
    `主页` 选项卡上的 `计算区域` 按钮来取消隐藏它（参见图 5-4）。


    ![9781430264453_Fig05-03.jpg](img/9781430264453_Fig05-03.jpg)


    图 5-3. Finance 表的度量值网格


    ![9781430264453_Fig05-04.jpg](img/9781430264453_Fig05-04.jpg)


    图 5-4. 显示或隐藏度量值网格


    创建聚合最简单的方法是选择要聚合的列，然后选择 `自动求和` 下拉菜单，并选择所需的聚合函数（参见图 5-5）。


    ![9781430264453_Fig05-05.jpg](img/9781430264453_Fig05-05.jpg)


    图 5-5. 使用自动求和进行常见聚合


    聚合结果会放置在该列下方的度量值网格中（参见图 5-6）。如果你选中该单元格，你将在公式栏中看到公式（参见图 5-7）。度量值的名称放在公式之前，后跟冒号和等号（`:=`）。添加度量值后，你可以通过在公式编辑器中编辑来重命名它。


    ![9781430264453_Fig05-06.jpg](img/9781430264453_Fig05-06.jpg)


    图 5-6. 列下方生成的度量值


    ![9781430264453_Fig05-07.jpg](img/9781430264453_Fig05-07.jpg)


    图 5-7. 编辑度量值公式


    另一种创建聚合度量值的方法是选择度量值网格中的任意单元格，然后在公式栏中输入公式。虽然你可以在度量值网格的任何单元格中定义度量值，但以某种方式组织度量值是个好主意。我通常会尝试将度量值沿网格左侧排列，这样它们就不会分散在整个网格中（参见图
    5-8）。你可以使用剪切和粘贴轻松地将一个定义从一个单元格移动到另一个单元格。


    ![9781430264453_Fig05-08.jpg](img/9781430264453_Fig05-08.jpg)


    图 5-8. 组织你的度量值


    你可能已经注意到，聚合函数如 `SUM`、`AVE`、`MIN` 和 `MAX` 都有对应的 `SUMX`、`AVEX`、`MINX` 和 `MAXX` 函数。X
    函数用于评估表中每一行的表达式，而不仅仅是单个列。例如，`SUMX` 函数的定义如下：


    ```

    SUMX(<table>, <expression>)

    ```


    其中，table 是包含要评估的行的表，expression 是每行要评估的内容。


    例如，假设你有一个包含 `Cost` 和 `Gross` 列的销售表。要计算总净销售额，你可以用毛收入减去成本，然后对每一行的结果求和，如下面的公式所示：


    ```

    SumNet:=SUMX(Sales,[Gross]-[Cost])

    ```


    获得相同结果的另一种方法是先创建一个净计算列，然后对净列使用 `SUM` 函数。区别在于，计算列是预先计算并存储在模型中的。而度量值是在数据透视表中应用筛选器时计算的，并且每次数据上下文更改时都必须重新计算。因此，计算列越多，你的
    Power Pivot 文件就越大。度量值越多、复杂性越高，在处理文件时所需的内存就越多。


    理解数据上下文如何改变度量值是创建度量值时非常重要的一点，这将在下一节中探讨。


    ## 掌握数据上下文


    在 Power Pivot 模型中创建度量值时，上下文起着重要作用。与静态报表不同，Power Pivot 模型是为客户端进行动态分析而设计的。当用户更改筛选器、向下钻取以及更改数据透视表中的列和行标题时，上下文会发生变化，值也会重新计算。了解上下文如何变化以及它如何影响结果，对于能够构建和调试公式至关重要。


    你需要考虑三种类型的上下文：行上下文、查询上下文和筛选上下文。当你在创建计算列时，行上下文就会发挥作用。它包括当前行所有其他列的值，以及与该行相关的任何表的数值。如果你创建一个计算列，例如
    margin，


    ```

    =[Gross] - [Cost]

    ```


    DAX 使用行上下文从同一行中查找值以完成计算。如果你创建一个计算列，例如 lifetime sales，


    ```

    =SUMX(RELATEDTABLE(Sales),[SalesAmount])

    ```


    DAX 会自动使用当前行的行上下文查找相关值。行上下文在模型加载时设置一次，并且在加载新数据之前不会更改。这就是计算列被预先计算，并且仅在数据刷新时才需要重新计算的原因。


    查询上下文是应用于数据透视表中单元格的筛选条件。当你将一个度量值放入数据透视表时，DAX 查询引擎会检查行和列标题以及任何应用的筛选器。每个单元格都应用了不同的查询上下文（参见图
    5-9），并返回与该上下文关联的值。由于你可以通过更改行或列标题以及筛选值来动态更改查询上下文，因此单元格的值是动态计算的，并且这些值不会保存在 Power
    Pivot 模型中。


    ![9781430264453_Fig05-09.jpg](img/9781430264453_Fig05-09.jpg)


    图 5-9. 度量值的查询上下文


    筛选上下文是使用公式中的筛选约束添加到度量值中的。筛选上下文是在行上下文和查询上下文之外额外应用的。你可以通过添加、替换或使用筛选表达式有选择地更改上下文来改变它。例如，如果你使用以下公式计算销售额，


    ```

    AllStoreSales:=CALCULATE(SUM(Sales[SalesAmount]),ALL(Store[StoreType]))

    ```


    筛选上下文将清除查询上下文实施的任何 `StoreType` 筛选器。

