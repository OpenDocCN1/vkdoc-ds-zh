    \ Power View、Power Map、Performance Point 和 Reporting Services。尽管所有这些工具都是可行的客户端，但最好的客户端工具之一就是\
    \ Excel 本身。Excel 是一个功能丰富的环境，非常适合使用数据透视表和数据透视图创建仪表盘。此外，在 SharePoint 上共享 Excel 文件或托管\
    \ Excel 工作簿以提高性能和安全性也非常容易。本章涵盖了使用 Excel 中的数据透视表和数据透视图为分析 Power Pivot 模型中的数据构建界面的基础知识。\n\
    \n完成本章后，你将能够：\n\n*   使用数据透视表探索数据。\n*   使用切片器筛选数据。\n*   向数据透视表添加可视化效果。\n*   使用数据透视图探索趋势。\n\
    *   使用多个链接在一起的图表和表格。\n*   使用多维数据集函数查询数据模型\n\n![Image](Images/sq.jpg) **注意** 本章包含对彩色图片的引用。如果你阅读的是本书的印刷版或黑白电子书版，你可以在本书的源代码/下载包中找到彩色图片的副本，地址为\
    \ `http://www.apress.com/9781430264453`。\n\n## 数据透视表基础\n\n数据分析中使用最广泛的工具之一是数据透视表。数据透视表允许你轻松地从数据中发现模式和关系。例如，你可以确定哪些产品在一年中的特定时间销售得更好。或者你可以了解营销活动如何影响各种产品的销售。[图\
    \ 7-1](#9781430264453_Ch07.xhtml#Fig1) 展示了数据透视表的各个区域。\n\n行字段和列字段包含你感兴趣的、用于汇总数据的属性。例如，[图\
    \ 7-1](#9781430264453_Ch07.xhtml#Fig1) 中的数据透视表是按产品类别和年份聚合值的。筛选器用于根据某个属性筛选数据透视表中的值。在此例中，[图\
    \ 7-1](#9781430264453_Ch07.xhtml#Fig1) 中的筛选器将结果限制在每年的第一季度。切片器在这里的作用与筛选器相同，限制值仅为大型经销商。切片器的额外优势在于可以同时筛选多个数据透视表和数据透视图。\n\
    \n![9781430264453_Fig07-01.jpg](Images/9781430264453_Fig07-01.jpg)\n\n[图 7-1](#9781430264453_Ch07.xhtml#_Fig1).\
    \ 数据透视表的组成部分\n\n要构建数据透视表，请从“字段列表”中将字段拖放到“字段列表”下方的放置区域，如[图 7-2](#9781430264453_Ch07.xhtml#Fig2)\
