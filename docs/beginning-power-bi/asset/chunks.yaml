    当分析数据时，使用层次结构来定义不同级别的聚合通常很有帮助。例如，基于年、季度和月份的日历层次结构很常见。像销售金额这样的聚合值会从月份汇总到季度，再到年份。另一个常见的层次结构可能是从部门到大楼，再到区域。然后，你可以将成本向上汇总到不同级别。在
    Power Pivot 模型中创建层次结构非常简单。在模型设计器的关系图视图中，选择包含你想要放入层次结构的属性（列）的表。你将在表格右上角看到一个“创建层次结构”按钮（参见图
    3-16）。点击该按钮添加层次结构并重命名。然后，你可以将字段拖放到层次结构中，以创建不同的级别。确保字段的排列顺序是从高层级到低层级。


    ![9781430264453_Fig03-16.jpg](img/9781430264453_Fig03-16.jpg)


    图 3-16。创建层次结构


    创建层次结构是增加模型可用性，并帮助用户在数据分析中本能地获取更多价值的一种方法。在下一节中，你将看到一些其他可以应用于模型以增加其可用性的操作。


    **打造用户友好的模型**


    在创建模型时，需要记住的一点是让模型易于使用且直观。模型可能会被其他用户用于分析。该模型还可能用于各种客户端报表和分析工具，例如 Power View、Power
    Map 和 Reporting Services。你可以使用一些属性和设置，让这些客户端工具从模型中获得更多功能。


    最有效的调整之一是为表和列重命名。使用对业务用户有意义的名称，而不是只对数据库开发人员有意义的晦涩命名约定。另一个好的做法是确保列的数据类型和格式设置正确。来自文本文件的字段可能会被导入为字符串类型，而它实际上是数字数据。此外，你可以隐藏对用户无用的字段，例如用于链接表的代理键。


    一个常见的要求是更改列的排序顺序，使其不同于自然排序。最常见的例子是月份。由于它们默认是文本，因此会按字母顺序排序。实际上，你希望它们按月份编号排序。要解决此问题，你可以按表中的任何其他列对一个列进行排序（参见图
    3-17）。这是一个很好的功能，允许你创建自定义的业务相关排序。


    ![9781430264453_Fig03-17.jpg](img/9781430264453_Fig03-17.jpg)


    图 3-17。按另一列对一列进行排序


    你可以使用其他一些设置来为各种客户端工具创建良好的模型。我们将在第 10 章（“优化 Power View 的表格模型”）中更详细地回顾这个主题。


    以下动手实验将帮助你巩固本章涵盖的主题。


    **动手实验——在 Power Pivot 中创建数据模型**


    在以下实验中，你将：


    *   创建表关系。

    *   反规范化数据。

    *   创建链接表。

    *   设置层次结构。

    *   制作一个用户友好的模型。


    1.  打开 Excel 2013 并创建一个名为 `LabChapter3.xlsx` 的新文件。

    2.  使用 Power Pivot 数据模型中的表导入向导，连接到 `LabStarters` 文件夹中的 `Adventureworks.accdb`
    文件。

    3.  选择所列出的表和字段并导入数据。


    | 源表名 | 友好名称 | 字段 |

    | --- | --- | --- |

    | `DimDate` | `Date` | `DateKey` `FullDateAlternateKey` `EnglishMonthName` `MonthNumberOfYear`
    `CalendarQuarter` `CalendarYear` |

    | `DimCustomer` | `Customer` | `CustomerKey` `BirthDate` `MaritalStatus` `Gender`
    `YearlyIncome` `TotalChildren` `HouseOwnerFlag` `NumberCarsOwned` |

    | `FactInternetSales` | `Internet Sales` | `ProductKey` `OrderDateKey` `ShipDateKey`
    `CustomerKey` `SalesTerritoryKey` `SalesOrderNumber` `SalesOrderLineNumber` `OrderQuantity`
    `UnitPrice` `TotalProductCost` `SalesAmount` |


    4.  在 Power Pivot 模型设计器的数据视图模式下，按照表格指示重命名并隐藏列。要隐藏列，请右键单击它，然后从上下文菜单中选择“从客户端工具中隐藏”。


    ![Table3b](img/Table3b.jpg)


    5.  将 Power Pivot 窗口切换到关系图视图。你应该能看到 `Date`、`Customer` 和 `Internet Sales` 表。`Customer`
    表和 `Internet Sales` 表之间已定义了一个关系。这由表导入向导自动发现。

    6.  将 `DateKey` 从 `Date` 表拖放到 `Internet Sales` 表中的 `OrderDateKey` 上。类似地，在 `DateKey`
    和 `ShipDateKey` 之间创建一个关系。双击此关系以启动“编辑关系”窗口（参见图 3-18）。尝试将此关系设为活动关系。你会收到一个错误，因为模型中两个表之间只能有一个活动关系。


    ![9781430264453_Fig03-18.jpg](img/9781430264453_Fig03-18.jpg)


    图 3-18。创建表关系


    7.  在 Power Pivot 模型设计器窗口的“主页”选项卡上，单击“现有连接”按钮。你应该能看到之前创建的指向 `Adventureworks.accdb`
    的连接。打开此连接并选择用于导入数据的查询选项。

    8.  在“指定 SQL 查询”窗口中，将查询友好名称更改为 `Product`，然后单击“设计”按钮。

    9.  在设计器中单击“导入”按钮。打开实验启动器文件夹中的 `ProductQuery.txt` 文件。单击红色的感叹号 (!) 以运行查询（参见图 3-19）。此查询合并了来自
    `Product`、`ProductCategory` 和 `ProductSubcategory` 表的数据（即反规范化）。


    ![9781430264453_Fig03-19.jpg](img/9781430264453_Fig03-19.jpg)


    图 3-19。运行查询


    10. 在确认获取到数据后，单击“确定”按钮，然后在下一个屏幕上单击“完成”按钮。

    11. 导入数据后，隐藏 `ProductKey` 并按下表所示更新列名：


    ![Table3c](img/Table3c.jpg)


    12. 使用 `ProductKey` 在 `Internet Sales` 表和 `Product` 表之间创建一个关系。最终的关系图应类似于图 3-20。


    ![9781430264453_Fig03-20.jpg](img/9781430264453_Fig03-20.jpg)


    图 3-20。查看数据模型关系


    13. 要创建链接表，请将图 3-21 中显示的数据输入到 Excel 中的一个空白电子表格选项卡中。


    ![9781430264453_Fig03-21.jpg](img/9781430264453_Fig03-21.jpg)


    图 3-21。链接表数据


    14. 选中这些单元格，右键单击，在“快速分析”上下文菜单中，选择“表”选项卡，然后单击“表”按钮（参见图 3-22）。在“表工具设计”选项卡中，将表重命名为
    `SalesTerritory`。


    ![9781430264453_Fig03-22.jpg](img/9781430264453_Fig03-22.jpg)


    图 3-22。“快速分析”的“表”选项卡

