    the pivot table in [Figure 7-11](#9781430264453_Ch07.xhtml#Fig11) shows a heat
    map used to quickly determine which months have good sales and which are bad.


    ![9781430264453_Fig07-11.jpg](Images/9781430264453_Fig07-11.jpg)


    [Figure 7-11](#9781430264453_Ch07.xhtml#_Fig11). Creating a heat map with conditional
    formatting


    Another popular feature associated with pivot tables are spark lines. *Spark lines*
    are mini graphs that show the trend of a series of data. [Figure 7-12](#9781430264453_Ch07.xhtml#Fig12)
    shows spark lines that display the sales trend across the four quarters of the
    year.


    ![9781430264453_Fig07-12.jpg](Images/9781430264453_Fig07-12.jpg)


    [Figure 7-12](#9781430264453_Ch07.xhtml#_Fig12). Using spark lines to show trends


    To create a spark line, highlight the values in the pivot table that contain the
    data and select the Sparklines button on the Insert tab. You then select the location
    of the spark line (see [Figure 7-13](#9781430264453_Ch07.xhtml#Fig13)). You have
    to choose from a line, a column, or a win/loss spark line.


    ![9781430264453_Fig07-13.jpg](Images/9781430264453_Fig07-13.jpg)


    [Figure 7-13](#9781430264453_Ch07.xhtml#_Fig13). Setting up a spark line


    Although adding visualizations to pivot tables can enhance your ability to analyze
    the data, many times the best way to spot trends and compare and contrast the
    data is through the use of charts and graphs. In the next section, you will see
    how charts and graphs are useful data analysis tools and how to add them to your
    analysis dashboards.


    Working with Pivot Charts


    Along with pivot tables, Excel has a robust set of charts and graphs available
    for you to use to analyze your data. Adding a pivot chart is very similar to adding
    a pivot table. On the Insert tab of Excel, select the PivotChart drop-down. You
    have the option of selecting a single PivotChart or a PivotChart and PivotTable
    that are tied together (see [Figure 7-14](#9781430264453_Ch07.xhtml#Fig14)).


    ![9781430264453_Fig07-14.jpg](Images/9781430264453_Fig07-14.jpg)


    [Figure 7-14](#9781430264453_Ch07.xhtml#_Fig14). Adding a pivot chart


    After selecting the pivot chart, you are presented with a window to select a data
    source and where you want to put the pivot chart (see [Figure 7-15](#9781430264453_Ch07.xhtml#Fig15)).


    ![9781430264453_Fig07-15.jpg](Images/9781430264453_Fig07-15.jpg)


    [Figure 7-15](#9781430264453_Ch07.xhtml#_Fig15). Selecting a data source


    To select the Power Pivot model as the data source, choose to use an external
    connection and click the Choose Connection button. In the Existing Connections
    window, select the Tables tab and select the Tables In Workbook Data Model (see
    [Figure 7-16](#9781430264453_Ch07.xhtml#Fig16)).


    ![9781430264453_Fig07-16.jpg](Images/9781430264453_Fig07-16.jpg)


    [Figure 7-16](#9781430264453_Ch07.xhtml#_Fig16). Selecting the Workbook Data Model


    Once you select the data source, you are presented with a blank chart and the
    field selection box where you can drag and drop fields for the chart values and
    axis (see [Figure 7-17](#9781430264453_Ch07.xhtml#Fig17)).


    ![9781430264453_Fig07-17.jpg](Images/9781430264453_Fig07-17.jpg)


    [Figure 7-17](#9781430264453_Ch07.xhtml#_Fig17). Creating a chart


    By default, the chart is a column chart, but you have many different types of
    charts to choose from. If you click on the chart and select the PivotChart Tools
    Design tab, you can select the Change Chart Type button and choose from a variety
    of types (see [Figure 7-18](#9781430264453_Ch07.xhtml#Fig18)).


    ![9781430264453_Fig07-18.jpg](Images/9781430264453_Fig07-18.jpg)


    [Figure 7-18](#9781430264453_Ch07.xhtml#_Fig18). Selecting a chart type


    Along with changing the chart type the PivotChart Tools tabs allow you a vast
    assortment of design and formatting options you can use to customize the look
    and feel of your charts and graphs. It is definitely worth your time to play around
    with the tools and create various graphs to gain a better idea of the various
    options available.


    Using Multiple Charts and Tables'
  trans: '好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。



    由于您在插入切片器时已选中了数据透视表，因此切片器会自动连接到该数据透视表。您可以通过点击切片器并选择`切片器工具 选项`选项卡来验证这一点（见图 7-4）。您可以使用此选项卡来设置切片器的格式，并选择切片器的报表连接。


    ![9781430264453_Fig07-04.jpg](img/9781430264453_Fig07-04.jpg)


    图 7-4. 设置切片器连接


    图 7-5 显示了切片器的`报表连接`选择列表。请注意，数据透视表不必与切片器位于同一工作表上。数据透视表的名称是创建时 Excel 赋予它们的通用名称。随着您添加更多数据透视表，最好为它们指定更有意义的名称。如果您单击数据透视表并转到`数据透视表工具
    分析`选项卡，您将看到一个文本框，您可以在其中更改数据透视表的名称。


    ![9781430264453_Fig07-05.jpg](img/9781430264453_Fig07-05.jpg)


    图 7-5. 为切片器选择连接


    如果您选择`切片器工具 选项`选项卡下的`切片器设置`按钮，将打开`切片器设置`窗口（见图 7-6），您可以在其中更改切片器的名称、标题和排序顺序。您还可以选择如何显示无数据的项目。


    ![9781430264453_Fig07-06.jpg](img/9781430264453_Fig07-06.jpg)


    图 7-6. 更改切片器设置


    有时您需要*级联筛选器*——即一个筛选器限制下一个筛选器中可选择的内容。对于基于模型中相关字段的切片器来说，这很容易实现。当您选择相关字段时，切片器会自动为您链接起来。例如，图
    7-7 显示了一个产品类别和产品子类别筛选器。如果您选择了一个产品类别，相应的产品子类别将会高亮显示。


    ![9781430264453_Fig07-07.jpg](img/9781430264453_Fig07-07.jpg)


    图 7-7. 使用切片器创建级联筛选器


    ## 向数据透视表添加可视化效果


    为了帮助识别趋势、异常值并深入了解数据，您可以向数据透视表添加多种类型的可视化效果。这些包括条件格式、数据条和趋势线。图 7-8 显示了带有数据条和条件格式的数据透视表。


    ![9781430264453_Fig07-08.jpg](img/9781430264453_Fig07-08.jpg)


    图 7-8. 使用条件格式和数据条


    要创建视觉格式，请在数据透视表中选择要设置格式的数据，然后在`开始`选项卡中，单击`条件格式`下拉菜单（见图 7-9）。如您所见，您有很多创建条件格式的选项。在图
    7-8 中，有一个`突出显示单元格规则`，用于将负数显示为红色。


    ![9781430264453_Fig07-09.jpg](img/9781430264453_Fig07-09.jpg)


    图 7-9. 设置条件格式


    建立规则后，您可以通过选择`管理规则`选项并选择要编辑的规则来对其进行编辑。图 7-10 显示了可以为`数据条`格式规则设置的各种选项。


    ![9781430264453_Fig07-10.jpg](img/9781430264453_Fig07-10.jpg)


    图 7-10. 编辑数据条规则


    您可以使用格式规则产生一些有趣的效果。例如，图 7-11 中的数据透视表显示了一个热力图，用于快速确定哪些月份的销售情况好，哪些月份销售情况差。


    ![9781430264453_Fig07-11.jpg](img/9781430264453_Fig07-11.jpg)


    图 7-11. 使用条件格式创建热力图


    与数据透视表相关的另一个流行功能是迷你图。*迷你图*是显示一系列数据趋势的微型图表。图 7-12 显示了展示一年四个季度销售趋势的迷你图。


    ![9781430264453_Fig07-12.jpg](img/9781430264453_Fig07-12.jpg)


    图 7-12. 使用迷你图显示趋势


    要创建迷你图，请突出显示数据透视表中包含数据的值，然后在`插入`选项卡上选择`迷你图`按钮。然后您需要选择迷你图的位置（见图 7-13）。您必须从折线图、柱形图或盈亏图中选择一种迷你图类型。


    ![9781430264453_Fig07-13.jpg](img/9781430264453_Fig07-13.jpg)


    图 7-13. 设置迷你图


    虽然向数据透视表添加可视化效果可以增强您分析数据的能力，但很多时候，发现趋势以及比较和对比数据的最佳方法是使用图表和图形。在下一节中，您将了解图表和图形作为有用的数据分析工具，以及如何将它们添加到您的分析仪表板中。


    ## 使用数据透视图


    除了数据透视表，Excel 还提供了一组强大的图表和图形供您分析数据。添加数据透视图与添加数据透视表非常相似。在 Excel 的`插入`选项卡上，选择`数据透视图`下拉菜单。您可以选择添加单个`数据透视图`，或者添加彼此关联的`数据透视图`和`数据透视表`（见图
    7-14）。


    ![9781430264453_Fig07-14.jpg](img/9781430264453_Fig07-14.jpg)


    图 7-14. 添加数据透视图


    选择数据透视图后，将出现一个窗口，供您选择数据源以及放置数据透视图的位置（见图 7-15）。


    ![9781430264453_Fig07-15.jpg](img/9781430264453_Fig07-15.jpg)


    图 7-15. 选择数据源


    要选择`Power Pivot`模型作为数据源，请选择使用外部连接，然后单击`选择连接`按钮。在`现有连接`窗口中，选择`表`选项卡，然后选择`工作簿数据模型中的表`（见图
    7-16）。


    ![9781430264453_Fig07-16.jpg](img/9781430264453_Fig07-16.jpg)


    图 7-16. 选择工作簿数据模型


    选择数据源后，您将看到一个空白图表和一个字段选择框，您可以在其中拖放字段以用于图表值和轴（见图 7-17）。


    ![9781430264453_Fig07-17.jpg](img/9781430264453_Fig07-17.jpg)


    图 7-17. 创建图表


    默认情况下，图表是一个柱形图，但您有许多不同类型的图表可供选择。如果您单击图表并选择`数据透视图工具 设计`选项卡，您可以选择`更改图表类型`按钮，并从多种类型中进行选择（见图
    7-18）。


    ![9781430264453_Fig07-18.jpg](img/9781430264453_Fig07-18.jpg)


    图 7-18. 选择图表类型


    除了更改图表类型之外，`数据透视图工具`选项卡还允许您使用大量设计和格式选项来自定义图表和图形的外观和感觉。花时间尝试这些工具并创建各种图表，以更好地了解可用的各种选项，这绝对是值得的。


