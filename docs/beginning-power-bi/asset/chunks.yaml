- fmt: 'Now let’s look at a more complex example. In this example you want to determine
    the best single order customers in a particular time period. The final pivot table
    is shown in [Figure 5-15](#9781430264453_Ch05.xhtml#Fig15).


    ![9781430264453_Fig05-15.jpg](Images/9781430264453_Fig05-15.jpg)


    [Figure 5-15](#9781430264453_Ch05.xhtml#_Fig15). Finding best single order customers


    The first step is to find the customers who spent a lot of money during the time
    period. To calculate customer sales, you use the following measure:


    ```

    SumSales:=SUM([SalesAmount])

    ```


    Next you want to only look at large spenders so you can filter out smaller values:


    ```

    LargeSales:=IF([SumSales]>=30000,[SumSales],Blank())

    ```


    The next step is to find the order amounts for the customer and take the maximum
    value:


    ```

    Top Sale:=MAXX(VALUES(Date[DateKey]),[SumSales])

    ```


    Since you only want to list the top sales for top customers, you can add an `IF`
    statement to make sure the customer has large sales:


    ```

    Top Sale:=

    IF(ISBLANK([LargeSales]),Blank(),MAXX(VALUES(Date[DateKey]),[SumSales]))

    ```


    As a final example, say you are working with the HR department and you want to
    create a pivot table that will allow them to list employee counts for the departments
    at a particular date. There is an `EmployeeDepartmentHistory` table that lists
    employee, department, start date, and end date. There is also a `Dates` table
    that has a row for every date spanning the department histories. [Figure 5-16](#9781430264453_Ch05.xhtml#Fig16)
    shows the pivot table containing employee counts for each department.


    ![9781430264453_Fig05-16.jpg](Images/9781430264453_Fig05-16.jpg)


    [Figure 5-16](#9781430264453_Ch05.xhtml#_Fig16). Employee counts as of the selected
    date


    The `As of Date` is used as a filter and the `Emp Cnt` is the measure. When the
    `As of Date` is changed the `Emp Cnt` it is recalculated to show the employee
    counts on that date. [Figure 5-17](#9781430264453_Ch05.xhtml#Fig17) shows new
    counts after the date is changed.


    ![9781430264453_Fig05-17.jpg](Images/9781430264453_Fig05-17.jpg)


    [Figure 5-17](#9781430264453_Ch05.xhtml#_Fig17). Changing the As of Date


    The first step to creating the `Emp Cnt` is to use the `COUNT` function because
    you want to count the `EmployeeID` in the table:


    ```

    Emp Cnt:=COUNT(EmpDepHist[BusinessEntityID])

    ```


    Since you need to filter the table to only active employees at the date chosen,
    you need to change this to the `COUNTX` function:


    ```

    Emp Cnt:=COUNTX(EmpDepHist, EmpDepHist[BusinessEntityID])

    ```


    To filter the `EmpDepHist` table you use the `FILTER` function:


    ```

    FILTER(<table>,<filter>)

    ```


    The `FILTER` function is a Boolean expression that evaluates to TRUE. In this
    case you need to have the date that the employee started in the department less
    than or equal to the `As of Date`:


    ```

    EmpDepHist[StartDate]<=Dates[As of Date]

    ```


    Now, since the pivot table user can select more than one date and you want to
    make sure you only compare it to a single date, you can use the `MAX` function:


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    ```


    You also want to make sure the date the employee left the department is greater
    than the `As of Date`:


    ```

    EmpDepHist[EndDate] > Max(Dates[As of Date])

    ```


    If the employee is currently in the department the `EndDate` will be blank:


    ```

    ISBLANK(EmpDepHist[EndDate])

    ```


    When you combine these filter conditions, you get the following filter condition:


    ```

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))

    ```


    The final `FILTER` function then becomes


    ```

    FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date])))

    ```


    and the final employee count measure becomes


    ```

    Emp Cnt:=COUNTX(FILTER(EmpDepHist,

    EmpDepHist[StartDate]<=MAX(Dates[As of Date])

    && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))),

    EmpDepHist[BusinessEntityID])

    ```


    As you can see, creating a measure can be quite complex, but if you break it up
    into steps, it becomes very manageable. Rest assured; the more you work with DAX
    and creating measures, the more intuitive and easier it becomes.


    One type of measure commonly used in performance dashboards is the *Key Performance
    Indicator (KPI*)*. A KPI is used to show performance and trends in a visual format.
    In the next section you will investigate creating KPIs in the Power Pivot model.


    ## Creating KPIs


    KPIs are a staple of many dashboards and provide a great way to quickly see trends
    and spot areas that need further analysis. The base value of a KPI is based on
    a measure; for example, you can create a KPI for current sales. The base value
    is then compared to a target value. The target value can be another measure; for
    example, last year’s sales or an absolute numeric value like a target sales-to-expense
    ratio. The status thresholds establish what range is considered good, neutral,
    and bad. These thresholds are then used to determine the visual component of the
    KPI (i.e., green, yellow, red). [Figure 5-18](#9781430264453_Ch05.xhtml#Fig18)
    shows KPIs for current sales compared to the previous sales.


    ![9781430264453_Fig05-18.jpg](Images/9781430264453_Fig05-18.jpg)


    [Figure 5-18](#9781430264453_Ch05.xhtml#_Fig18). Sales KPI comparing current to
    previous sales


    To create a KPI, first create the base measure it will be based on. For example,
    production keeps track of scrapped parts, so you can base a KPI on the sum of
    the number of scrapped parts:


    ```

    SumScrappedQty:=SUM([ScrappedQty])

    ```


    You can compare this to the number of parts processed:


    ```

    SumOrderQuantity:=SUM([OrderQty])

    ```


    After creating the measures, right click on the base measure in the Power Pivot
    model designer. In the context menu, select Create KPI, which launches the KPI
    design window (see [Figure 5-19](#9781430264453_Ch05.xhtml#Fig19)).


    ![9781430264453_Fig05-19.jpg](Images/9781430264453_Fig05-19.jpg)


    [Figure 5-19](#9781430264453_Ch05.xhtml#_Fig19). The KPI design window


    You then set the target to the `SumOrderQuantity` measure and define the status
    thresholds. The style icons are used to show the status of the KPIs. When you
    are done creating the KPI you can use it in a pivot table in Excel (see [Figure
    5-20](#9781430264453_Ch05.xhtml#Fig20)).


    ![9781430264453_Fig05-20.jpg](Images/9781430264453_Fig05-20.jpg)


