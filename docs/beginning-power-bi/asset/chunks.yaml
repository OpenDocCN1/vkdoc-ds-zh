- fmt: '# Two other tools that are becoming increasingly important to have in your
    BI arsenal are Power Query and Power Map. Quite often, you will need to take your
    raw data and transform it in some way before you load it into the data model.
    You may need to filter, aggregate, or clean the raw data. I will show you how
    Power Query allows you to easily transform and refine data before incorporating
    it into your data model. While analyzing data, you may also be required to incorporate
    locational awareness with visualizations into a map. Power Map uses Microsoft’s
    Bing mapping engine to easily incorporate data on an interactive map. I will show
    you how to use Power Map to create interesting visualizations of your data.


    One additional topic that I have included is Excel’s table analysis tools. These
    tools allow you to run some interesting data analysis including analyzing key
    influencers, identifying data groupings, and forecasting future trends. Although
    these tools are not part of Microsoft’s self-service BI tool set, I think they
    are worth covering. They will get you thinking about the value of predictive analytics
    when you are analyzing your data.


    I strongly believe one of the most important aspects of learning is doing. You
    can’t learn how to ride a bike without jumping on a bike, and you can’t learn
    to use the BI tools without actually interacting with them. Any successful training
    program includes both theory and hands-on activities. For this reason, I have
    included a hands-on activity at the end of every chapter designed to solidify
    the concepts covered in the chapter. I encourage you to work through these activities
    diligently. It is well worth the effort.


