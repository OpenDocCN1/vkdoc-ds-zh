    ## 总结


    在 Power Pivot 中工作时，理解什么构成了一个好模型至关重要。一个好的模型将使 Power Pivot 运行得异常快速，并允许您轻松分析大量数据。与基于
    Excel 工作表中单个表的传统 Excel 数据透视表不同，Power Pivot 数据透视表基于数据模型中的多个表。本章指导您完成创建坚实模型的过程，该模型将成为您数据分析的基础。此外，您还了解了如何向客户端工具呈现一个用户友好的模型。


    既然您已经为模型打下了坚实的基础，就可以通过自定义计算来扩展模型了。下一章将介绍数据分析表达式 (DAX) 语言，并解释如何在数据模型中创建计算列。它包含大量示例，以帮助您创建模型中常见的计算。


    ## 第 4 章


    ![image](img/frontdot.jpg)


    # 使用 DAX 创建计算


    既然您已知道如何创建一个健壮的数据模型作为分析基础，下一步就是在模型中添加任何有助于您探索数据所需的计算。例如，您可能需要将代码值转换为有意义的描述，或者解析一个字符串以获取关键信息。这正是数据分析表达式
    (DAX) 发挥作用的地方。本章向您介绍 DAX，并向您展示如何使用 DAX 创建计算列以增加模型的功能。


    完成本章后，您将能够：


    *   使用 DAX 向表中添加计算列。

    *   实现 DAX 运算符。

    *   使用 DAX 中的文本函数。

    *   使用 DAX 日期和时间函数。

    *   使用条件和逻辑函数。

    *   从相关表中获取数据。

    *   使用数学、三角和统计函数。


    ## 什么是 DAX？


    DAX 是一种公式语言，用于在 Power Pivot 模型中创建计算列和度量值。它是一种专为 Power Pivot 所基于的表格数据模型而开发的新语言。如果您熟悉
    Excel 的公式语法，您会发现 DAX 语法非常相似。事实上，一些 DAX 公式与其对应的 Excel 公式具有相同的语法和功能。主要的区别在于，Excel
    公式基于单元格，而 DAX 基于列，这一点您需要理解。例如，如果您想在 Excel 中连接两个值，您会使用如下公式：


    ```

    =A1 & " " & B1

    ```


    其中 `A1` 是第一行第一列的单元格，`B1` 是第一行第二列的单元格（见图 4-1）。


    ![9781430264453_Fig04-01.jpg](img/9781430264453_Fig04-01.jpg)


    图 4-1. 在 Excel 中输入公式


    这与 DAX 公式非常相似：


    ```

    =[First Name] & " " & [Last Name]

    ```


    其中 `First Name` 和 `Last Name` 是模型中表的列（见图 4-2）。


    ![9781430264453_Fig04-02.jpg](img/9781430264453_Fig04-02.jpg)


    图 4-2. 在 Power Pivot 中输入公式


    不同之处在于，DAX 公式应用于表中的所有行，而 Excel 公式仅作用于特定单元格。在 Excel 中，您需要在每一行中重新创建公式。


    这意味着，尽管您可以在 Excel 中执行如下操作：


    ```

    =A1 & " " & B2

    ```


    即，从第一行取一个单元格并与第二行的单元格连接（见图 4-3），但这在 DAX 中无法实现。


    ![9781430264453_Fig04-03.jpg](img/9781430264453_Fig04-03.jpg)


    图 4-3. 在不同行中使用单元格


    在创建 DAX 公式时，考虑数据类型以及计算中可能发生的任何转换非常重要。如果您不考虑这些，公式可能会出现错误或产生意外的结果。模型中支持的数据类型是整数、小数、货币、布尔值、文本和日期。DAX
    还有一种表数据类型，它用于许多以表作为输入值并返回表的函数中。


    当您尝试将数值数据类型与文本数据类型相加时，会发生隐式转换。如果 DAX 可以将文本转换为数值，则会将它们作为数字相加；如果不能，您将收到错误。另一方面，如果您尝试将数值数据类型与文本数据类型连接，DAX
    会将数值数据类型隐式转换为文本。尽管大多数时候隐式转换会给出您期望的结果，但这是以性能损失为代价的，应尽可能避免。例如，如果您从文本文件导入数据，并且该列设置为文本数据类型，但您知道它实际上是数值，那么您应该更改模型中的数据类型。


    在 DAX 中创建计算时，需要引用表和列。如果表名不包含空格，则可以直接通过名称引用。如果表名包含空格，则需要用单引号将其括起来。列和度量值用方括号括起来。如果您在公式中仅列出列名，则假定该列存在于同一个表中。如果您要引用另一个表中的列，则需要使用完全限定名称，即表名后跟列名。以下代码演示了语法：


    ```

    =[SalesAmount] - [TotalCost]

    =Sales[SalesAmount] - Sales[TotalCost]

    =''Internet Sales''[SalesAmount] - ''Internet Sales''[TotalCost]

    ```


    以下是使用 DAX 时需要牢记的其他要点：


    *   DAX 公式和表达式不能修改或插入表中的单个值。

    *   您不能使用 DAX 创建计算行。只能创建计算列和度量值。

    *   在定义计算列时，您可以嵌套任意层级的函数。


    创建计算时首先要理解的是支持哪些运算符以及使用它们的语法是什么。在下一节中，您将研究各种 DAX 运算符。


    ## 实现 DAX 运算符


    DAX 包含一套强大的运算符，包括算术、比较、逻辑和文本连接。其中大多数对您来说应该很熟悉，并列在表 4-1 中。


    表 4-1. DAX 运算符


    | 类别 | 符号 | 用途 |

    | --- | --- | --- |

    | 算术运算符 |

    |   | `+` | 加法 |

    |   | `-` | 减法 |

    |   | `*` | 乘法 |

    |   | `/` | 除法 |

    |   | `^` | 乘幂 |

    | 比较运算符 |

    |   | `=` | 等于 |

    |   | `>` | 大于 |

    |   | `<` | 小于 |

    |   | `>=` | 大于或等于 |

    |   | `<=` | 小于或等于 |

    |   | `<>` | 不等于 |

    | 文本连接运算符 |

    |   | `&` | 连接 |

    |   |   | 逻辑运算符 |

    |   | `&&` | 与 |

    |   | `&#124;&#124;` | 或 |'
- fmt: '# 算术运算符

    以算术运算符为例，以下代码将`Margin`列除以`Total Cost`列，创建一个名为`Margin Percentage`的新列。

    ```

    =[Margin]/[TotalCost]

    ```


    在同一计算中包含多个算术运算的情况非常常见。此时需要注意运算顺序：指数运算优先计算，其次是乘法和除法，最后是加法和减法。您可以通过使用括号对计算进行分组来控制运算顺序；例如，以下公式将在除法之前执行减法。

    ```

    =([Sales Amount]-[Total Cost])/[Total Cost]

    ```


    # 比较运算符

    比较运算符主要用于`IF`语句。例如，以下计算会检查门店的销售面积是否大于1000。如果是，则归类为大型门店；否则归类为小型门店。

    ```

    =IF([Selling Area Size]>1000,"Large","Small")

    ```


    # 逻辑运算符

    逻辑运算符用于创建多重比较逻辑。以下代码检查门店面积是否大于1000或员工人数是否超过35，以将其归类为大型门店。

    ```

    =IF([Selling Area Size]> 1000 || [Employee Count] > 35,"Large","Small")

    ```


    当串联一系列逻辑条件时，最好使用括号来控制运算顺序。以下代码检查门店面积是否大于1000且员工人数是否超过35，以将其归类为大型门店。如果其年销售额超过1,000,000美元，无论面积或员工人数如何，也会将其归类为大型门店。

    ```

    =IF(([Selling Area Size]> 1000 && [Employee Count] > 35) || [Annual Sales] > 1000000,"Large","Small")

    ```


    # 嵌套函数

    在使用DAX计算时，可能需要将一个公式嵌套在另一个公式内部。例如，以下代码将一个`IF`语句嵌套在另一个`IF`语句的假值部分。如果员工人数不大于35，则跳转到下一个`IF`语句，检查是否大于20。

    ```

    =IF(Store[EmployeeCount]>35,"Large",IF(Store[EmployeeCount]>20,"Medium","Small"))

    ```


    # DAX 函数概述

    DAX包含许多用于创建计算和度量的有用函数。这些函数包括文本函数、日期和时间函数、统计函数、数学函数以及信息函数。接下来几节将介绍如何在计算中使用各种函数类型。


    ## 使用文本函数

    许多计算都涉及某种形式的文本处理。可能需要截断、解析、搜索或格式化从源系统加载的文本值。DAX包含许多用于处理文本的有用函数。这些函数列于[表4-2](#9781430264453_Ch04.xhtml#Tab2)中，并附有各自的用途说明。


    [表4-2](#9781430264453_Ch04.xhtml#_Tab2). DAX文本函数


    | 函数 | 描述 |

    | --- | --- |

    | `BLANK` | 返回一个空值。 |

    | `CONCATENATE` | 将两个文本字符串连接成一个文本字符串。 |

    | `EXACT` | 比较两个文本字符串，如果完全相同则返回TRUE，否则返回FALSE。 |

    | `FIND` | 返回一个文本字符串在另一个文本字符串中的起始位置。 |

    | `FIXED` | 将数字舍入到指定小数位数，并将结果作为文本返回。 |

    | `FORMAT` | 根据指定格式将值转换为文本。 |

    | `LEFT` | 从文本字符串开头返回指定数量的字符。 |

    | `LEN` | 返回文本字符串中的字符数。 |

    | `LOWER` | 将文本字符串中的所有字母转换为小写。 |

    | `MID` | 根据给定的起始位置和长度，从文本字符串中返回一串字符。 |

    | `REPLACE` | 用不同的文本字符串替换文本字符串的一部分。 |

    | `REPT` | 将文本重复指定次数。使用`REPT`可以用文本字符串的多个实例填充单元格。 |

    | `RIGHT` | 基于指定的字符数，返回文本字符串中最后一个或几个字符。 |

    | `SEARCH` | 返回特定字符或文本字符串首次出现的位置编号（从左向右读取）。 |

    | `SUBSTITUTE` | 在文本字符串中用新文本替换现有文本。 |

    | `TRIM` | 删除文本中除单词间单个空格之外的所有空格。 |

    | `UPPER` | 将文本字符串转换为全部大写字母。 |

    | `VALUE` | 将表示数字的文本字符串转换为数字。 |


    ### 文本函数使用示例

    假设在`products`表中有一个`Product Code`列，其中前两个字符代表产品系列。要创建产品系列列，可以使用`Left`函数，如下所示：

    ```

    =Left([Product Code],2)

    ```


    可以使用`FIND`函数在文本中搜索子文本。可以使用问号（`?`）匹配任意单个字符，使用星号（`*`）匹配任意字符序列。还可以指定搜索的起始位置。`FIND`函数返回找到的子字符串的起始位置。如果未找到子字符串，它可以返回0、-1或空值。以下代码在产品描述列中搜索单词“mountain”。

    ```

    =FIND("mountain",[Description],1,-1)

    ```


    `FORMAT`函数根据提供的格式将值转换为文本。例如，可能需要将日期转换为特定格式。以下代码将日期数据类型转换为格式类似“Mon - Dec 02, 2013”的字符串。

    ```

    =FORMAT([StartDate],"ddd - MMM dd, yyyy")

    ```


    除了可以创建自己的格式之外，还可以使用预定义的格式。以下代码演示了使用“Long Date”格式“Monday, December 2, 2013”。

    ```

    =FORMAT([StartDate],"Long Date")

    ```


    ## 使用DAX日期和时间函数

    在进行数据分析时，很可能涉及日期组件。可能需要查看销售额或能源消耗，并需要知道事件发生的星期几。可能还需要计算年龄或到期日期。DAX提供了许多日期和时间函数来帮助创建此类计算。[表4-3](#9781430264453_Ch04.xhtml#Tab3)总结了可用的各种日期和时间函数。


    [表4-3](#9781430264453_Ch04.xhtml#_Tab3). DAX日期和时间函数'
  raw: 'As an example of the arithmetic operator, the following code is used to divide
    the Margin column by the Total Cost column to create a new column, the Margin
    Percentage.


    ```

    =[Margin]/[TotalCost]

    ```


    It is very common to have several arithmetic operations in the same calculation.
    In this case you have to be aware of the order of operations. Exponents are evaluated
    first followed by multiplication/division and then addition/subtraction. You can
    control order of operations by using parentheses to group calculations; for example,
    the following formula will perform the subtraction before the division.


    ```

    =([Sales Amount]-[Total Cost])/[Total Cost]

    ```


    The comparison operators are primarily for if statements. For example, the following
    calculation checks to see if a store’s selling area size is greater than 1000\.
    If it is, it is classified as a large store, if not, it is classified as small.


    ```

    =IF([Selling Area Size]>1000,"Large","Small")

    ```


    The logical operators are used to create multiple comparison logic. The following
    code checks to see if the store size area is greater than 1000 or if it has more
    than 35 employees to classify it as large.


    ```

    =IF([Selling Area Size]> 1000 || [Employee Count] > 35,"Large","Small")

    ```


    When you start stringing together a series of logical conditions it is a good
    idea to use parentheses to control the order of operations. The following code
    checks to see if the store size area is greater than 1000 and if it has more than
    35 employees to classify it as large. It will also classify it as large if it
    has annual sales of more than $1,000,000 regardless of its size area or number
    of employees.


    ```

    =IF(([Selling Area Size]> 1000 && [Employee Count] > 35) || [Annual Sales] > 1000000,"Large","Small")

    ```


    When working with DAX calculations you may need to nest one formula inside another.
    For example, the following code nests an `IF` statement inside the false part
    of another `IF` statement. If the employee count is not greater than 35 it jumps
    to the next if statement to check if it is greater than 20.


    ```

    =IF(Store[EmployeeCount]>35,"Large",IF(Store[EmployeeCount]>20,"Medium","Small"))

    ```


    DAX contains many useful functions for creating calculations and measures. These
    functions include text functions, date and time functions, statistical functions,
    math functions, and informational functions. In the next few sections you will
    look at using the various function types in your calculations.


    Working with Text Functions


    A lot of calculations involve some kind of text manipulation. You may need to
    truncate, parse, search, or format the text values that you load from the source
    systems. DAX contains many useful functions for working with text. The functions
    are listed in [Table 4-2](#9781430264453_Ch04.xhtml#Tab2) along with a description
    of what they are used for.


    [Table 4-2](#9781430264453_Ch04.xhtml#_Tab2). DAX Text Functions


    | Function | Description |

    | --- | --- |

    | `BLANK` | Returns a blank. |

    | `CONCATENATE` | Joins two text strings into one text string. |

    | `EXACT` | Compares two text strings and returns TRUE if they are exactly the
    same, FALSE otherwise. |

    | `FIND` | Returns the starting position of one text string within another text
    string. |

    | `FIXED` | Rounds a number to the specified number of decimals and returns the
    result as text. |

    | `FORMAT` | Converts a value to text according to the specified format. |

    | `LEFT` | Returns the specified number of characters from the start of a text
    string. |

    | `LEN` | Returns the number of characters in a text string. |

    | `LOWER` | Converts all letters in a text string to lowercase. |

    | `MID` | Returns a string of characters from a text string, given a starting
    position and length. |

    | `REPLACE` | Replaces part of a text string with a different text string. |

    | `REPT` | Repeats text a given number of times. Use `REPT` to fill a cell with
    a number of instances of a text string. |

    | `RIGHT` | Returns the last character or characters in a text string, based on
    the number of characters you specify. |

    | `SEARCH` | Returns the number of the character at which a specific character
    or text string is first found, reading left to right. |

    | `SUBSTITUTE` | Replaces existing text with new text in a text string. |

    | `TRIM` | Removes all spaces from text except for single spaces between words.
    |

    | `UPPER` | Converts a text string to all uppercase letters. |

    | `VALUE` | Converts a text string that represents a number to a number. |


    As an example of using a text function in a calculation, let’s say you have a
    product code column in a products table where the first two characters represent
    the product family. To create the product family column, you would use the `Left`
    function as follows:


    ```

    =Left([Product Code],2)

    ```


    You can use the `FIND` function to search a text for a subtext. You can use a
    (?) to match any single character and a (*) to match any sequence of characters.
    You have the option of indicating the starting position for the search. The `FIND`
    function returns the starting position of the substring found. If it doesn’t find
    the substring, it can return a 0, -1, or a blank value. The following code searches
    the product description column for the word mountain.


    ```

    =FIND("mountain",[Description],1,-1)

    ```


    The `FORMAT` function converts a value to text based on the format provided. For
    example, you may need to convert a date to a specific format. The following code
    converts a date data type to a string with a format like “Mon - Dec 02, 2013”.


    ```

    =FORMAT([StartDate],"ddd - MMM dd, yyyy")

    ```


    Along with the ability to create your own format there are also predefined formats
    you can use. The following code demonstrates using the Long Date format “Monday,
    December 2, 2013”.


    ```

    =FORMAT([StartDate],"Long Date")

    ```


    Now that you have seen how to use some of the text functions, the next type of
    function to look at are the built-in date and time functions.


    Using DAX Date and Time Functions


    Most likely you will find that your data analysis has a date component associated
    with it. You may need to look at sales or energy consumption and need to know
    the day of the week the event occurred. You may have to calculate age or maturity
    dates. DAX has quite a few date and time functions to help create these types
    of calculations. [Table 4-3](#9781430264453_Ch04.xhtml#Tab3) summarizes the various
    date and time functions available.


    [Table 4-3](#9781430264453_Ch04.xhtml#_Tab3). DAX Date and Time Functions'
