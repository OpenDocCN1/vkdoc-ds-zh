    ## Constructing Bar, Column, and Pie Charts


    Some of the most common data visualizations used to compare data are the bar,
    column, and pie charts. A bar chart and a column chart are very similar. The bar
    chart has horizontal bars where the x axis is the value of the measure whereas
    the y axis contains the categories you are comparing. For example, [Figure 9-11](#9781430264453_Ch09.xhtml#Fig11)
    shows a bar chart comparing Internet sales by country.


    ![9781430264453_Fig09-11.jpg](Images/9781430264453_Fig09-11.jpg)


    [Figure 9-11](#9781430264453_Ch09.xhtml#_Fig11). Bar chart comparing sales by
    country


    The column chart switches the axes so that the measure amounts are on the y axis
    and the categories are on the x axis. For example, the bar chart in [Figure 9-11](#9781430264453_Ch09.xhtml#Fig11)
    can just as easily be displayed as a column chart as shown in [Figure 9-12](#9781430264453_Ch09.xhtml#Fig12).


    ![9781430264453_Fig09-12.jpg](Images/9781430264453_Fig09-12.jpg)


    [Figure 9-12](#9781430264453_Ch09.xhtml#_Fig12). A column chart comparing Internet
    sales by country


    There are three types of bar or column charts to choose from: stacked, 100% stacked,
    and clustered. [Figure 9-12](#9781430264453_Ch09.xhtml#Fig12) is a stacked column
    chart that does not have a field for the legend. If you drag the `Year` field
    to the `Legend` drop area, it changes the visualization to the one shown in [Figure
    9-13](#9781430264453_Ch09.xhtml#Fig13). Notice the values for each year are stacked
    on top of each other.


    ![9781430264453_Fig09-13.jpg](Images/9781430264453_Fig09-13.jpg)


    [Figure 9-13](#9781430264453_Ch09.xhtml#_Fig13). Creating a stacked column chart'
