  trans: "```dax\nPrev Month Sales Filtered:=CALCULATE([Prev Month Sales],\n    Filter(Reseller,[Was\
    \ Open Prev Year]=1))\n\nMonthly Sales Growth Filtered:=[Month Sales Filtered]-[Prev\
    \ Month Sales Filtered]\n\nMonthly Sales Growth Filtered %:=DIVIDE([Monthly Sales\
    \ Growth Filtered],\n    [Prev Month Sales Filtered],0)\n```\n\n通过创建如图 Figure\
    \ 14-4 所示的 Power Pivot 表来测试你的新度量值。你应该能看到经过筛选和未经筛选的度量值之间的差异。\n\n![9781430264453_Fig14-04.jpg](img/9781430264453_Fig14-04.jpg)\n\
    \n图 14-4 测试筛选后的度量值\n\n## 创建仪表板\n\n在 Power View 中创建仪表板之前，你需要更新一些表设置以优化模型，使其适用于\
    \ Power View。表 14-3 列出了你需要进行的表设置。\n\n表 14-3 为 Power View 优化设置\n\n![Table14-3](img/Table14-3.jpg)\n\
    \n此外，将 表 14-4 中列出的列标记为相应的数据类别。\n\n表 14-4 设置数据类别\n\n| 表 | 列 | 数据类别 |\n| --- | ---\
    \ | --- |\n| Location（位置） | City（城市） | City（城市） |\n| State Province（州/省） | State\
    \ or Province（州或省） |\n| Country（国家） | Country（国家） |\n| Postal Code（邮政编码） | Postal\
    \ Code（邮政编码） |\n| Product（产品） | Product Photo（产品照片） | Image（图像） |\n\n在 `Date`\
    \ 表中，设置字段使其不进行汇总。\n\n若要创建仪表板，请插入一个 Power View 报表。将该报表命名为 `Reseller Sales`，并添加一个柱形图，该柱形图使用经过筛选的月度销售额按月份和经销商类型显示销售额。向报表添加一个切片器，以控制图表显示的日历年。由于\
    \ 2011 年之前没有销售额，请筛选视图，使其仅显示 2011 年至 2014 年。你的报表应类似于图 14-5。\n\n![9781430264453_Fig14-05.jpg](img/9781430264453_Fig14-05.jpg)\n\
    \n图 14-5 经销商销售额报表\n\n现在，你需要进行另一项经销商分析，以查找月份、季度和年份的最佳月销售额。为此，你需要在模型中添加一个新度量值。该度量值使用\
    \ `VALUES` 和 `MAXX` 函数来查找经销商月销售额的最大值。\n\n```dax\nMax Reseller Sales:=MAXX(VALUES(Reseller[ResellerKey]),[Month\
    \ Sales])\n```\n\n在模型中添加了新的度量值后，在 Power View 报表中添加另一个柱形图，显示每个月的经销商最大销售额。请注意，这些图表是交互式的；如果你单击一个图表中的某个柱形，它将相应地筛选另一个图表（参见图\
    \ 14-6）。\n\n![9781430264453_Fig14-06.jpg](img/9781430264453_Fig14-06.jpg)\n\n\
    图 14-6 添加最大经销商销售额图表\n\n为了更进一步，假设你想要获取该期间内月销售额最高的经销商的名称。为此，你需要组合一系列表达式来检索月销售额最高的经销商的名称。首先，你需要确定哪个经销商的月销售额等于月销售额最大值。如果满足条件，则将其标记为值\
    \ `1`；否则，标记为 `BLANK`。\n\n```dax\nIF([Month Sales]=CALCULATE([Max Reseller Sales],\n\
    \    Values(Reseller[Reseller Name])),1,BLANK())\n```\n\n下一步是使用 `FIRSTNONBLANK`\
    \ 函数来查找值为 `1` 的经销商。\n\n```dax\nFIRSTNONBLANK(Reseller[Reseller Name],\n    IF([Month\
    \ Sales]=CALCULATE([Max Reseller Sales],\n    Values(Reseller[Reseller Name])),1,BLANK()))\n\
    ```\n\n最后，你需要确保在检查的期间内确实存在月销售额。将这些公式组合到 `Top Monthly Reseller` 度量值中，如下所示：\n\n\
    ```dax\nTop Monthly Reseller:=If(ISBLANK([Month Sales]),\n    BLANK(),FIRSTNONBLANK(Reseller[Reseller\
    \ Name],IF([Month Sales]=\n    CALCULATE([Max Reseller Sales],Values(Reseller[Reseller\
    \ Name])),1,BLANK())))\n```"
