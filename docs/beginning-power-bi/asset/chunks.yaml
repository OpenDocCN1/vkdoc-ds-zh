    \ 6-17）。\n\n![9781430264453_Fig06-17.jpg](img/9781430264453_Fig06-17.jpg)\n\n\
    图 6-17. 选择外部数据源\n\n12.  在“现有连接”窗口中，选择“表”选项卡。在“表”选项卡中，选择“工作簿数据模型中的表”，然后单击“打开”（参见图\
    \ 6-18）。选择连接后，在“创建数据透视表”窗口中单击“确定”。\n\n![9781430264453_Fig06-18.jpg](img/9781430264453_Fig06-18.jpg)\n\
    \n图 6-18. 选择数据模型连接\n\n13.  将度量 `Sum Of Sales`、`MTD Sales` 和 `YTD Sales` 添加到“值”区域，并将\
    \ `Calendar` 层次结构添加到“行”区域。在“插入”选项卡中，选择“切片器”，然后选择 `ChannelName`。研究数据并验证是否符合预期（参见图\
    \ 6-19）。\n\n![9781430264453_Fig06-19.jpg](img/9781430264453_Fig06-19.jpg)\n\n\
    图 6-19. 验证年度至今销售额度量\n\n14.  切换到数据模型中的 `Sales` 表。使用以下表达式创建一个滚动 3 个月销售额度量。将该度量格式化为货币。\n\
    \n```\nRolling 3 Month Sales:=CALCULATE([Sum of Sales],\n  DATESINPERIOD('Date'[Datekey],LASTDATE('Date'[Datekey]),-3,MONTH))\n\
    ```\n\n15.  将该度量添加到 Sheet1 上的数据透视表中，并验证其是否按预期工作。\n16.  接下来，你想比较一个月的销售额与下一个月的增长。首先，创建一个上月的销售额度量。\n\
    \n```\nPrev Month Sales:=CALCULATE([Sum of Sales],\n  PARALLELPERIOD('Date'[DateKey],-1,MONTH))\n\
    ```\n"
