    To Advanced Mode`来显示它。随着本书的学习，你将逐步熟悉设计师中的菜单。目前，只需知道这些菜单可用于执行各种操作，例如连接到数据源并创建数据查询、格式化数据、设置默认属性以及创建
    KPI（关键绩效指标）。[图1-10](#9781430264453_Ch01.xhtml#Fig10)显示了数据模型管理器中的`Home`菜单。


    ![9781430264453_Fig01-10.jpg](Images/9781430264453_Fig01-10.jpg)


    [图1-10](#9781430264453_Ch01.xhtml#_Fig10). 数据模型管理器中的`Home`菜单选项卡


    在`Home`菜单的右侧，您可以从数据视图模式切换到关系图视图模式。[图1-11](#9781430264453_Ch01.xhtml#Fig11)所示的关系图视图展示了各个表以及表之间的关系。通常您可以在此处建立表之间的关系并为钻取模型创建层次结构。数据视图和关系图视图中的菜单大致相同。但是，您会发现某些操作只能在数据视图中完成，而其他操作则只能在关系图视图中完成。


    ![9781430264453_Fig01-11.jpg](Images/9781430264453_Fig01-11.jpg)


    [图1-11](#9781430264453_Ch01.xhtml#_Fig11). 在数据模型管理器中使用关系图视图


    现在您已经熟悉了数据模型管理器的各个部分，该是动手实践并完成以下动手实验的时候了。此实验将帮助您熟悉在数据模型管理器中的操作。


    **动手实验——探索 POWER PIVOT**


    在以下实验中，您将：


    *   启用 Power Pivot 加载项。

    *   使用数据透视表分析数据。

    *   探索数据模型管理器。


    1.  打开 Excel 2013。

    2.  在`File`菜单上选择`Account`（参见[图1-1](#9781430264453_Ch01.xhtml#Fig1)）。

    3.  点击`About Excel`，确保您使用的是专业增强版，并检查版本（32位或64位）。

    4.  在`File`菜单上选择`Options`，然后选择`Add-Ins`选项卡。在`Manage`下拉菜单中选择`Com Add-Ins`，然后点击`Go`按钮。

    5.  在`Com Add-Ins`窗口中，勾选`Power Pivot add-in`（参见[图1-4](#9781430264453_Ch01.xhtml#Fig4)）。

    6.  安装完成后，打开位于`Lab Starters`文件夹中的`Chapter1Lab1.xlsx`文件。

    7.  点击`Sheet1`工作表。您应该会看到一个基本的数据透视表，按年份和国家显示销售额，如[图1-12](#9781430264453_Ch01.xhtml#Fig12)所示。


    ![9781430264453_Fig01-12.jpg](Images/9781430264453_Fig01-12.jpg)


    [图1-12](#9781430264453_Ch01.xhtml#_Fig12). 使用数据透视表


    8.  点击数据透视表中的任意位置。您应该会在右侧看到字段列表，如[图1-13](#9781430264453_Ch01.xhtml#Fig13)所示。


    ![9781430264453_Fig01-13.jpg](Images/9781430264453_Fig01-13.jpg)


    [图1-13](#9781430264453_Ch01.xhtml#_Fig13). 数据透视表字段列表


    9.  字段列表下方是筛选、行、列和值的放置区域。您可以将字段拖放到这些区域来创建数据透视表。

    10. 在`PivotTable Fields`窗口顶部点击`All`选项卡。展开字段列表中的`Product`表。找到`Product Category`字段并将其拖到`Report
    Filter`放置区域。

    11. 数据透视表上方会出现一个筛选下拉菜单。点击筛选下拉图标。您应该会看到产品类别。

    12. 将筛选条件更改为`Bikes`，并注意数据透视表中的值的变化。

    13. 当您从筛选器中选择多个项目时，很难判断正在筛选的内容。选择`Bikes`和`Clothing`。注意当筛选下拉菜单关闭时，它只显示“(Multiple
    Items)”。

    14. 切片器用作筛选器，但它们提供了视觉元素以便轻松确定所选内容。在`Insert`菜单上点击`Slicer`。在弹出的窗口中，选择`All`选项卡，然后在`Product`表下选择`Category`层次结构，如[图1-14](#9781430264453_Ch01.xhtml#Fig14)所示。


    ![9781430264453_Fig01-14.jpg](Images/9781430264453_Fig01-14.jpg)


    [图1-14](#9781430264453_Ch01.xhtml#_Fig14). 选择切片器字段


    15. 插入了一个`Product Category`和`Product Subcategory`切片器，用于筛选数据透视表。要按值进行筛选，请点击该值按钮。要选择多个按钮，请在点击时按住`Ctrl`键（参见[图1-15](#9781430264453_Ch01.xhtml#Fig15)）。请注意，由于这些字段是作为层次结构设置的，因此选择一个产品类别会自动筛选`Product
    Subcategory`切片器中的相关子类别。


    ![9781430264453_Fig01-15.jpg](Images/9781430264453_Fig01-15.jpg)


    [图1-15](#9781430264453_Ch01.xhtml#_Fig15). 使用切片器筛选数据透视表


    16. 层次结构是按级别排列的列组，可以更轻松地浏览数据。例如，展开字段列表中的`Date`表，您可以查看`Calendar`层次结构，如[图1-16](#9781430264453_Ch01.xhtml#Fig16)所示。此层次结构由`Year`、`Quarter`和`Month`字段组成，代表了一种向下钻取数据的自然方式。


    ![9781430264453_Fig01-16.jpg](Images/9781430264453_Fig01-16.jpg)


    [图1-16](#9781430264453_Ch01.xhtml#_Fig16). 在数据透视表中使用层次结构


    17. 展开字段列表中的`Internet Sales`表，您将看到一个交通灯图标。此图标代表一个 KPI。KPI 用于衡量某个值的表现。它们通常通过视觉指示器表示，以便快速判断性能。

    18. 在`Power Pivot`菜单下选择`Manage Data Model`按钮。

    19. 在数据模型管理器中，选择底部的不同选项卡以在不同表之间切换。

    20. 转到`Products`表中的`ProductAlternateKey`列。请注意，它已显示为灰色。这意味着它已对任何客户端工具隐藏。您可以通过切换回工作表1上的
    Excel 数据透视表并验证在字段列表中看不到此字段来确认这一点。

    21. 在`Internet Sales`表中，点击`Margin`列。请注意这是一个计算列。它也被格式化为货币。

    22. 在`Internet Sales`表的`Sales Amount`列下方，注意有一个名为`Total Sales Amount`的度量值。点击该度量值，注意它使用了
    DAX `SUM`函数来计算该度量值。

    23. 将数据模型管理器切换到关系图视图。观察表之间的关系。

    24. 如果将鼠标指针悬停在关系上，您可以看到关系中涉及的字段，如[图1-17](#9781430264453_Ch01.xhtml#Fig17)所示。


    ![9781430264453_Fig01-17.jpg](Images/9781430264453_Fig01-17.jpg)


    [图1-17](#9781430264453_Ch01.xhtml#_Fig17). 探索关系'
  raw: 'There are four menu tabs at the top of the designer: File, Home, Design, and
    Advanced. If you do not see the Advanced tab, you can show it by selecting the
    File menu tab and selecting Switch To Advanced Mode. You will become intimately
    familiar with the menus in the designer as you progress through this book. For
    now, suffice to say that this is where you initiate various actions such as connecting
    to data sources and creating data queries, formatting data, setting default properties,
    and creating KPIs (Key Performance Indicators). [Figure 1-10](#9781430264453_Ch01.xhtml#Fig10)
    shows the Home menu in the Data Model Manager.


    ![9781430264453_Fig01-10.jpg](Images/9781430264453_Fig01-10.jpg)


    [Figure 1-10](#9781430264453_Ch01.xhtml#_Fig10). The Home menu tab in the Data
    Model Manager


    On the right side of the Home menu you can switch from the data view mode to the
    diagram view mode. The diagram view shown in [Figure 1-11](#9781430264453_Ch01.xhtml#Fig11)
    illustrates the tables and the relationships between the tables. This is where
    you generally go to establish relationships between tables and create hierarchies
    for drilling through the model. The menus are much the same in both the data view
    and the diagram view. You will find, however, that some things can only be done
    in the data view and some things can only be done in the diagram view.


    ![9781430264453_Fig01-11.jpg](Images/9781430264453_Fig01-11.jpg)


    [Figure 1-11](#9781430264453_Ch01.xhtml#_Fig11). Using the diagram view in the
    Data Model Manager


    Now that you are familiar with the various parts of the Data Model Manager, it
    is time to get your hands dirty and complete the following hands-on lab. This
    lab will help you become familiar with working in the Data Model Manager.


    **HANDS-ON LAB—EXPLORING POWER PIVOT**


    In the following lab you will


    *   Enable the Power Pivot add-in.

    *   Analyze data using pivot tables.

    *   Explore the Data Model Manager.


    1.  Open Excel 2013.

    2.  On the File menu select Account (see [Figure 1-1](#9781430264453_Ch01.xhtml#Fig1)).

    3.  Click About Excel so that you are using the Professional Plus edition and
    check the version (32-bit or 64-bit).

    4.  On the File menu select Options and then select the Add-Ins tab. In the Manage
    drop-down select Com Add-Ins and click the Go button.

    5.  In the Com Add-Ins window, check the Power Pivot add-in (see [Figure 1-4](#9781430264453_Ch01.xhtml#Fig4)).

    6.  After the installation, open the `Chapter1Lab1.xlsx` file located in the Lab
    Starters folder.

    7.  Click on Sheet1\. You should see a basic pivot table showing sales by year
    and country as shown in [Figure 1-12](#9781430264453_Ch01.xhtml#Fig12).


    ![9781430264453_Fig01-12.jpg](Images/9781430264453_Fig01-12.jpg)


    [Figure 1-12](#9781430264453_Ch01.xhtml#_Fig12). Using a pivot table


    8.  Click anywhere on the pivot table. You should see the field list on the right
    side, as shown in [Figure 1-13](#9781430264453_Ch01.xhtml#Fig13).


    ![9781430264453_Fig01-13.jpg](Images/9781430264453_Fig01-13.jpg)


    [Figure 1-13](#9781430264453_Ch01.xhtml#_Fig13). The pivot table field list


    9.  Below the field list are the drop areas for the filters, rows, columns, and
    values. You drag and drop the fields into these areas to create the pivot table.

    10.  Click on the All tab at the top of the PivotTable Fields window. Expand the
    Product table in the field list. Find the Product Category field and drag it to
    the Report Filter drop zone.

    11.  A filter drop-down appears above the pivot table. Click on the drop-down
    filter icon. You should see the Product Categories.

    12.  Change the filter to Bikes and notice the values changing in the pivot table.

    13.  When you select multiple items from a filter it is hard to tell what is being
    filtered on. Filter on Bikes and Clothing. Notice when the filter drop-down closes
    it just shows “(Multiple Items).”

    14.  Slicers act as filters but they give you a visual to easily determine what
    is selected. On the Insert menu click on the Slicer. In the pop-up window that
    appears, select the All tab and then select the Category hierarchy under the Product
    table as in [Figure 1-14](#9781430264453_Ch01.xhtml#Fig14).


    ![9781430264453_Fig01-14.jpg](Images/9781430264453_Fig01-14.jpg)


    [Figure 1-14](#9781430264453_Ch01.xhtml#_Fig14). Selecting slicer fields


    15.  A Product Category and Product Subcategory slicer are inserted and are used
    to filter the pivot table. To filter by a value, click on the value button. To
    select multiple buttons, hold down the Ctrl key while clicking (see [Figure 1-15](#9781430264453_Ch01.xhtml#Fig15)).
    Notice that since these fields were set up as a hierarchy, selecting a product
    category automatically filters to the related subcategories in the Product Subcategory
    slicer.


    ![9781430264453_Fig01-15.jpg](Images/9781430264453_Fig01-15.jpg)


    [Figure 1-15](#9781430264453_Ch01.xhtml#_Fig15). Using slicers to filter a pivot
    table


    16.  Hierarchies are groups of columns arranged in levels that make it easier
    to navigate the data. For example, if you expand the Date table in the field list
    you can see the Calendar hierarchy as shown in [Figure 1-16](#9781430264453_Ch01.xhtml#Fig16).
    This hierarchy consists of the Year, Quarter, and Month fields and represents
    a natural way to drill down into the data.


    ![9781430264453_Fig01-16.jpg](Images/9781430264453_Fig01-16.jpg)


    [Figure 1-16](#9781430264453_Ch01.xhtml#_Fig16). Using hierarchies in a pivot
    table


    17.  If you expand the Internet Sales table in the field list you will see a traffic
    light icon. This icon represents a KPI. KPIs are used to gauge the performance
    of a value. They are usually represented by a visual indicator to quickly determine
    performance.

    18.  Under the Power Pivot menu select the Manage Data Model button.

    19.  In the Data Model Manager select the different tabs at the bottom to switch
    between the different tables.

    20.  Go to the ProductAlternateKey column in the Products table. Notice that it
    is grayed out. This means it is hidden from any client tool. You can verify this
    by switching back to the Excel pivot table on sheet 1 and verifying that you cannot
    see the field in the field list.

    21.  In the Internet Sales table click on the Margin column. Notice this is a
    calculated column. It has also been formatted as currency.

    22.  Below the Sales Amount column in the Internet Sales table notice there is
    a measure called Total Sales Amount. Click on the measure and notice the DAX `SUM`
    function is used to calculate the measure.

    23.  Switch the Data Model Manager to the diagram view. Observe the relationships
    between the tables.

    24.  If you hover over the relationship with the mouse pointer you can see the
    fields involved in the relationship as shown in [Figure 1-17](#9781430264453_Ch01.xhtml#Fig17).


    ![9781430264453_Fig01-17.jpg](Images/9781430264453_Fig01-17.jpg)


    [Figure 1-17](#9781430264453_Ch01.xhtml#_Fig17). Exploring relationships'
