    ### 从数据馈送导入数据


    尽管文本文件是交换数据最常用的方式之一，但数据馈送正日益成为流行的数据交换方式。数据馈送通过 Web 服务提供数据，要连接到 Web 服务，需要输入 Web
    服务的网址。在图 2-17 中，你可以看到可用的数据馈送连接。大多数情况下，你会知道合作伙伴或数据提供商提供的数据服务的地址。在这种情况下，选择“其他馈送”，系统将为你提供一个连接信息输入窗口，如图
    2-21 所示。


    ![9781430264453_Fig02-21.jpg](img/9781430264453_Fig02-21.jpg)


    **图 2-21** 连接到数据馈送


