  trans: '

    # 第 9 章（图 9-33）


    图 9-33. 映射客户数量


    15. 尝试映射其他字段，并缩放至地图的不同区域。完成后，保存更改并退出 Excel。


    ## 本章小结


    在本章中，你学习了如何在 Power View 中创建各种可视化效果。你创建了标准的柱形图、条形图和饼图。你还了解了折线图、散点图，以及如何创建气泡图并添加播放轴来查看随时间变化的趋势。此外，你还学习了如何将与地理空间字段相关的度量值显示在地图上。至此，你应该能够熟练地在
    Power View 中创建各种可视化效果。到目前为止，你创建的每个可视化效果都是独立的图表或图形。Power View 的优势之一在于能够将这些可视化效果关联起来，创建交互式仪表板。你将在下一章中对此进行探讨。


    # 第 10 章


    ![image](img/frontdot.jpg)


    ## 使用 Power View 创建交互式仪表板


    在上一章中，你了解了一些用于创建报表和仪表板的标准可视化效果。在本章中，你将把这些可视化效果结合起来，使它们协同工作，形成交互式仪表板。交互式仪表板与传统仪表板的不同之处在于，它将用户体验从被动扩展为主动。你可以执行筛选、向上或向下钻取不同级别的详细信息，以及发现各种度量值之间的关联。你还将学习如何使用磁贴对数据进行分组，并为分组和视图整体创建筛选器。此外，你还将了解如何添加图片以增强仪表板的体验。


    完成本章后，你将能够：


    *   在 Power View 中链接可视化效果。

    *   使用磁贴组织数据。

    *   筛选分组和视图。

    *   向使用者公开仪表板。


    ![Image](img/sq.jpg) **注意：** 如需彩色图副本，请访问 `http://www.apress.com/9781430264453`
    上的源代码/下载部分。


    ## 在 Power View 中链接可视化效果


    Power View 的优势之一在于，如果 Power Pivot 模型中包含用于创建各种可视化效果的数据之间的链接，则 Power View 将利用该关系实现交互式筛选。*交互式筛选*是指筛选一个可视化效果的过程会自动筛选出相关的可视化效果。例如，图
    10-1 显示了一个条形图，该条形图展示了 Adventure Works 示例数据库中不同产品类别的销售额。


    ![9781430264453_Fig10-01.jpg](img/9781430264453_Fig10-01.jpg)


    图 10-1. 按类别统计的经销商销售额


    在此视图中，你可以添加一个显示不同国家/地区销售额的柱形图，如图 10-2 所示。


    ![9781430264453_Fig10-02.jpg](img/9781430264453_Fig10-02.jpg)


    图 10-2. 向同一视图添加相关的可视化效果


    由于 Sales 表与 SalesTerritory 表和 Product 表相关，因此如果你选择其中一个产品类别条形图，它将突出显示条形图以显示该类别对应的销售额（参见图
    10-3）。


    ![9781430264453_Fig10-03.jpg](img/9781430264453_Fig10-03.jpg)


    图 10-3. 对相关可视化效果进行交互式筛选


    这种筛选是双向的，因此你可以单击下方图表中的某个柱形，它将筛选上方的图表，以显示该国家/地区的销售额。这种交互式筛选适用于 Power View 中大多数类型的可视化效果。图
    10-4 展示了一个气泡图和一个表格。当你单击某个气泡时，表格将被筛选，以显示构成该气泡值的明细记录。


    ![9781430264453_Fig10-04.jpg](img/9781430264453_Fig10-04.jpg)


    图 10-4. 筛选以显示构成气泡值的详细信息

    '
- fmt: 'Now that you understand how visualizations interact with each other, you are
    ready to see how you can group visualizations using tiles.


    ## Using Tiles to Organize the Data


    In the last section you saw how visualizations placed on the same view interact
    with each other. Another way to group visualizations together is to use tiles.
    First create a table containing the grouping criteria. For example, you may want
    to organize sales figures by sales regions. To do so, first create a table using
    the sales territory image, then change it to a tile type of visualization. You
    will see a visualization similar to the one in [Figure 10-5](#9781430264453_Ch10.xhtml#Fig5).


    ![9781430264453_Fig10-05.jpg](Images/9781430264453_Fig10-05.jpg)


    [Figure 10-5](#9781430264453_Ch10.xhtml#_Fig5). Creating a tile group


    In [Figure 10-5](#9781430264453_Ch10.xhtml#Fig5), notice that the sales territory
    image is in both the `Title` field and the `Details` area. You can remove the
    field from the `Details` area and add data related to the sales territory from
    the `Power Pivot` model. For example, you can add the sales people assigned to
    the territory, their photo, their sales, and the sales year. This will create
    a table in the `Details` section of the tiles (see [Figure 10-6](#9781430264453_Ch10.xhtml#Fig6)).


    ![9781430264453_Fig10-06.jpg](Images/9781430264453_Fig10-06.jpg)


    [Figure 10-6](#9781430264453_Ch10.xhtml#_Fig6). Creating a table inside a tile


    You can change the detail visualization to another type—for example, a matrix.
    When you click on the various tiles, the details are filtered by the tile group
    (see [Figure 10-7](#9781430264453_Ch10.xhtml#Fig7)).


    ![9781430264453_Fig10-07.jpg](Images/9781430264453_Fig10-07.jpg)


    [Figure 10-7](#9781430264453_Ch10.xhtml#_Fig7). Grouping with tiles


    If you click on the blank area of the tile’s `Detail` section, you can build another
    visualization. For example, [Figure 10-8](#9781430264453_Ch10.xhtml#Fig8) shows
    a matrix and a column chart that are both filtered by the tile chosen.


    ![9781430264453_Fig10-08.jpg](Images/9781430264453_Fig10-08.jpg)


    [Figure 10-8](#9781430264453_Ch10.xhtml#_Fig8). Controlling multiple visualizations
    with tiles


    After grouping visualizations, make sure you understand how filtering affects
    visualizations grouped in tiles and on the view. You will look at this next.


    ## Filtering Groups and Views


    When you place multiple visualizations on the same view, you have the option of
    filtering the entire view (page) or the individual visualizations that make up
    the view. [Figure 10-9](#9781430264453_Ch10.xhtml#Fig9) shows the `Filters` area
    where you can toggle between the `View` tab and the `Chart` tab. The `View` tab
    is for applying filters to all the visualizations on the page whereas the `Chart`
    tab will apply the filters to just the individual visualization (a chart, in this
    instance).


    ![9781430264453_Fig10-09.jpg](Images/9781430264453_Fig10-09.jpg)


    [Figure 10-9](#9781430264453_Ch10.xhtml#_Fig9). Filtering the chart or view


    By default the visualization filter contains the fields that make up the visualization
    and these fields cannot be removed. You can, however, add additional fields to
    the filters from the `Field List`. When you first click on the `View` tab in the
    `Filters` area, there are no fields listed. To filter the values in the view,
    add fields from the `Field List` that are related to the fields contained in the
    visualizations on the view.


    All filters have a list mode in which the values are displayed as a checkbox list
    (see [Figure 10-10](#9781430264453_Ch10.xhtml#Fig10)).


    ![9781430264453_Fig10-10.jpg](Images/9781430264453_Fig10-10.jpg)


    [Figure 10-10](#9781430264453_Ch10.xhtml#_Fig10). Using a filter pick list


    You can also switch to advanced filtering mode by selecting the arrow to the right
    of the field name. The type of advanced filtering controls exposed in `Power View`
    depends on the data type of the filter. [Figure 10-11](#9781430264453_Ch10.xhtml#Fig11)
    shows the advanced filtering controls exposed for a date field.


    ![9781430264453_Fig10-11.jpg](Images/9781430264453_Fig10-11.jpg)


    [Figure 10-11](#9781430264453_Ch10.xhtml#_Fig11). Advanced filtering by date


    [Figure 10-12](#9781430264453_Ch10.xhtml#Fig12) shows the options you get when
    advanced filtering is used with a text-based field.


    ![9781430264453_Fig10-12.jpg](Images/9781430264453_Fig10-12.jpg)


    [Figure 10-12](#9781430264453_Ch10.xhtml#_Fig12). Advanced filtering using a text-based
    field


    Another way of filtering a view is using a slicer. Slicers are nice for users
    since they are part of the view. The downside to slicers is that they are limited
    to a pick list and do not expose the advanced filtering mentioned previously.
    Combining grouping with tiles and slicers can create different sets of filters.
    [Figure 10-13](#9781430264453_Ch10.xhtml#Fig13) shows the same chart in a tile
    group and outside the tile group. Both charts are filtered by the `CalendarYear`
    slicer because they are located on the same view. The chart in the tile group
    is further filtered by the sales territory because it is part of the tile group.


    ![9781430264453_Fig10-13.jpg](Images/9781430264453_Fig10-13.jpg)


    [Figure 10-13](#9781430264453_Ch10.xhtml#_Fig13). Filtering with slicers and tiles


    Once you have built the dashboard it is time to expose it to users. You will briefly
    review your options in the following section.


    ## Exposing the Dashboard


    After constructing an interactive dashboard, the next step is to expose the dashboard
    to others, such as business analysts and managers, who want to explore the data.
    Since the `Power Pivot` model and the `Power View` visualizations that make up
    the dashboard are a self-contained unit, you can just share copies of the `Excel`
    file with consumers. However, this is not an ideal way to manage the dashboards
    and will soon become unwieldy. A better way of managing the dashboards is to host
    them in a `SharePoint` site. You can host them in an on-premise `SharePoint Server
    2013` or the cloud-based `Office 365 SharePoint Server`.


    The cloud-based `Office 365` solution has some very compelling features that make
    it an excellent hosting site for your `Power BI` solutions. These features include
    `Power BI` sites where users can share, view, and interact with `Power View` dashboards.
    It also includes a `Power BI` admin center where you can secure, monitor, and
    automate the data refresh of your dashboards. I recommend you take a look at the
    `Office 365` capabilities if you need to implement a solution for creating and
    distributing a large number of views to a large number of users. [Figure 10-14](#9781430264453_Ch10.xhtml#Fig14)
    shows a `Power View` dashboard in an `Office 365 Power BI` site.


    ![9781430264453_Fig10-14.jpg](Images/9781430264453_Fig10-14.jpg)


    [Figure 10-14](#9781430264453_Ch10.xhtml#_Fig14). Exposing a Power View dashboard
    on a Power BI site


    One thing to remember is that `Power View` was originally created for interactive
    data exploration. Although it is evolving into a pretty decent dashboarding tool,
    it is not the best choice for producing static reports that require printing.
    When you print the `Power View` page it is essentially just printing a screenshot.


    Now that you have seen how to create interactive dashboards with `Power View`,
    it is time to get some hands-on experience creating one.


    ## HANDS-ON LAB—CREATING A DASHBOARD IN POWER VIEW


    In the following lab you will


    *   Create an interactive dashboard using `Power View`.

    *   Group visualizations with tiles.'
