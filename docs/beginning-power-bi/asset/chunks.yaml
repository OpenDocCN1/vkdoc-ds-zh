    ## Summary


    In this chapter you have seen how to create the various visualizations in Power
    View. You created the standard column, bar, and pie charts. You looked at line
    and scatter charts and how you create bubble charts and add a play axis to look
    at trends over time. In addition, you saw how to present measures tied to a geospatial
    field on a map. At this point, you should be comfortable creating the various
    visualizations in Power View. Up to this point, you have created each of the visualizations
    as a standalone chart or graph. One of the strengths of Power View is its ability
    to tie these visualizations together to create interactive dashboards. You will
    explore this in the next chapter.


    # CHAPTER 10


    ![image](Images/frontdot.jpg)


    ## Creating Interactive Dashboards with Power View


    In the last chapter, you investigated some of the standard visualizations used
    to create reports and dashboards. In this chapter, you will combine these visualizations
    so they work together to form interactive dashboards. Interactive dashboards differ
    from a traditional dashboard by extending the user experience from passive to
    active. You can perform filtering, drill up or down through different levels of
    detail, and discover associations between the various metrics. You will also look
    at how you can group the data using tiles and create filters for the groups and
    views as a whole. In addition, you will look at how you can include images to
    enhance the dashboard experience.


    After completing this chapter you will be able to:


    - Link visualizations in Power View.

    - Use tiles to organize data.

    - Filter groups and views.

    - Expose dashboards to consumers.


    ![Image](Images/sq.jpg) **Note** For copies of color figures, go to Source Code/Downloads
    at `http://www.apress.com/9781430264453`.


    ### Linking Visualizations in Power View


    One of the strengths of Power View is that if the Power Pivot model contains a
    link between the data used to create the various visualizations, Power View will
    use the relationship to implement interactive filtering. *Interactive filtering*
    is when the process of filtering one visualization automatically filters a related
    visualization. For example, [Figure 10-1](#9781430264453_Ch10.xhtml#Fig1) shows
    a bar chart that displays sales for the different product categories from the
    Adventure Works sample database.


    ![9781430264453_Fig10-01.jpg](Images/9781430264453_Fig10-01.jpg)


    [Figure 10-1](#9781430264453_Ch10.xhtml#_Fig1). Reseller sales by category


    To this view, you can add a column chart that shows various countries’ sales,
    as shown in [Figure 10-2](#9781430264453_Ch10.xhtml#Fig2).


    ![9781430264453_Fig10-02.jpg](Images/9781430264453_Fig10-02.jpg)


    [Figure 10-2](#9781430264453_Ch10.xhtml#_Fig2). Adding related visualizations
    to the same view


    Since the `Sales` table is related to the `SalesTerritory` table and the `Product`
    table, if you select one of the Product category bars, it will highlight the bar
    chart to show sales for that category (see [Figure 10-3](#9781430264453_Ch10.xhtml#Fig3)).


    ![9781430264453_Fig10-03.jpg](Images/9781430264453_Fig10-03.jpg)


    [Figure 10-3](#9781430264453_Ch10.xhtml#_Fig3). Interactive filtering of related
    visualizations


    The filtering works both ways so you can click on one of the columns in the lower
    chart and it will filter the top chart to show sales for that country. This interactive
    filtering works for most types of visualizations available in Power View. [Figure
    10-4](#9781430264453_Ch10.xhtml#Fig4) shows a bubble chart and a table. When you
    click on a bubble the table is filtered to show the detail records that make up
    the bubble values.


    ![9781430264453_Fig10-04.jpg](Images/9781430264453_Fig10-04.jpg)


    [Figure 10-4](#9781430264453_Ch10.xhtml#_Fig4). Filtering to show the details
    that make up the bubble values'
