    当你查看图 8-12 中的字段列表时，请注意字段前面的图标。计算器图标表示该度量是在 Power Pivot 模型中创建的。求和符号表示该字段是数字型，并且拖拽到字段放置区域时会进行聚合。默认的聚合是求和，但这可能并非所需的聚合方式。在某些情况下，你并不希望对数字进行聚合；例如，在日期表中，年份字段本就不应被聚合。你可以通过在
    Power Pivot 模型的“高级”选项卡中设置`Summarize By`下拉菜单来控制此行为（参见图 8-13）。


    ![9781430264453_Fig08-13.jpg](img/9781430264453_Fig08-13.jpg)


    图 8-13 设置字段的默认聚合方式


    除了设置字段级别的属性，你还可以在 Power Pivot 模型中设置一些表级别的属性，从而更轻松地在 Power View 中创建报表。在 Power Pivot
    模型设计器中查看某个表的“高级”选项卡时，你会看到一个`Default Field Set`按钮（参见图 8-13）。选择此按钮可以指定该表的默认字段集（参见图
    8-14）。设置后，Power View 用户只需在 Power View 字段列表中点击该表节点，即可快速创建表格（参见图 8-15）。


    ![9781430264453_Fig08-14.jpg](img/9781430264453_Fig08-14.jpg)


    图 8-14 设置表的默认字段


    ![9781430264453_Fig08-15.jpg](img/9781430264453_Fig08-15.jpg)


    图 8-15 在 Power View 中使用默认字段


    在 Power View 中创建可视化对象时，它会根据所选字段和可视化类型自动对项目进行分组。你可以通过设置 Power Pivot 模型中的`Table
    Behavior`属性来控制分组的评估方式。在模型设计器的“高级”选项卡中，可以访问`Table Behavior`属性（参见图 8-13）。点击后，`Table
    Behavior`按钮会显示“表行为”设置窗口（参见图 8-16）。


    ![9781430264453_Fig08-16.jpg](img/9781430264453_Fig08-16.jpg)


    图 8-16 设置表行为


    你可以为表设置的`Table Behavior`属性包括：行标识符、任何指示唯一性的列、默认标签和默认图像。行标识符用于指示能唯一标识每一行的字段（通常称为主键）。该字段必须唯一且不能为空。一旦设置了行标识符，你就可以选择哪些列包含的值应保持唯一。例如，你可能有两个同名员工，并且不希望将一个员工的记录与另一个员工的记录分组在一起。默认标签和默认图像用于
    Power View 的卡片和磁贴类型可视化对象，设置后可提供更美观的格式样式。图 8-17 显示了同一张卡片采用两种不同格式的效果。上方卡片显示了设置默认标签和图像后的格式，下方卡片则显示了未设置时的格式。


    ![9781430264453_Fig08-17.jpg](img/9781430264453_Fig08-17.jpg)


    图 8-17 设置默认标签和图像的效果


    Power Pivot 模型设计器“高级”选项卡上的最后一个可用设置是字段的`Data Category`设置（参见图 8-18）。这对于城市、邮政编码和国家/地区等位置类型尤其重要。当
    Power View 知道某列是位置类型时，它可以使用该字段，借助必应地图图层实现可视化。其他有用的数据类别包括图像和 Web URL。设置这些类别后，Power
    View 将识别它们为超链接并相应地设置其格式。


    ![9781430264453_Fig08-18.jpg](img/9781430264453_Fig08-18.jpg)


    图 8-18 设置字段的数据类别


