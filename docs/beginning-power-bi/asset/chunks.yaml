  trans: "\n| 函数 | 描述 |\n| --- | --- |\n| `DATE` | 以日期时间格式返回指定的日期 |\n| `DATEVALUE`\
    \ | 将文本形式的日期转换为日期时间格式的日期 |\n| `DAY` | 返回某个月份中的第几天 |\n| `EDATE` | 返回起始日期之前或之后指定月数的日期\
    \ |\n| `EOMONTH` | 以日期时间格式返回指定月数之前或之后月份最后一天的日期 |\n| `HOUR` | 返回小时数，范围为 0（凌晨 12:00）到\
    \ 23（晚上 11:00） |\n| `MINUTE` | 返回分钟数，范围为 0 到 59 |\n| `MONTH` | 返回月份数，范围为 1（一月）到\
    \ 12（十二月） |\n| `NOW` | 以日期时间格式返回当前日期和时间 |\n| `SECOND` | 返回时间值中的秒数，范围为 0 到 59 |\n\
    | `TIME` | 将以数字形式给出的小时、分钟和秒转换为日期时间格式的时间 |\n| `TIMEVALUE` | 将文本格式的时间转换为日期时间格式的时间\
    \ |\n| `TODAY` | 返回当前日期 |\n| `WEEKDAY` | 返回一个 1 到 7 的数字，用于标识某个日期的星期几 |\n| `WEEKNUM`\
    \ | 返回给定日期的周数 |\n| `YEAR` | 以四位整数形式返回某个日期的年份 |\n| `YEARFRAC` | 计算两个日期之间的整天天数在一年中所占的百分比\
    \ |\n\n以日期函数的使用为例，你需要计算员工的在职年限。首先要做的是找出当前年份与他们入职年份的差值。以下代码从今天的日期中获取年份。\n\n```\n\
    =YEAR(Today())\n```\n\n现在你可以减去他们入职日期的年份。注意，这里我们将一个函数嵌套在另一个函数中。函数嵌套是许多计算中的常见需求。\n\
    \n```\n=YEAR(TODAY()) - YEAR([HireDate])\n```\n\n敏锐的读者会发现，只有当当前月份大于或等于入职月份时，这个计算结果才是正确的。你可以通过如下条件判断语句来修正这个问题：\n\
    \n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),YEAR(TODAY()) - YEAR([HireDate]),YEAR(TODAY())\
    \ - YEAR([HireDate])-1)\n```\n\n如你所见，计算很快就会变得相当复杂。挑战在于确保每个函数的左右括号正确对齐。一种组织代码的方法是利用多行和缩进。要在公式编辑栏中换行，你需要在按\
    \ Enter 键的同时按住 Shift 键。我发现下面这种写法更容易理解。\n\n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),\n\
    \        YEAR(TODAY()) - YEAR([HireDate]),\n        YEAR(TODAY()) - YEAR([HireDate])-1\n\
    \     )\n```\n\n不幸的是，在 Power Pivot 中你无法在代码中添加注释。\n\n通常有多种方法可以创建计算。你可能会找到一种更简单或性能更好的计算方法。以下使用\
    \ `YEARFRAC` 函数和 `TRUNC` 函数（属于数学函数）来计算在职年限，并去除数字的小数部分。\n\n```\n=TRUNC(YEARFRAC([HireDate],TODAY()))\n\
    ```\n\n接下来你要研究的一组函数是信息函数和逻辑函数。当你需要确定某个条件是否存在，例如是否存在空白值，或因计算而是否发生错误时，这些函数非常重要。这些函数允许你捕捉条件并以恰当的方式做出响应。\n\
    \n使用信息函数和逻辑函数\n\n当你开始构建更复杂的计算时，通常需要使用信息函数和逻辑函数来检查条件并对各种情况做出响应。一个常见的例子是检查空白值的需求。如果值为空白，`ISBLANK`\
    \ 函数返回 TRUE；否则返回 FALSE。以下代码根据中间名是否为空白来使用不同的计算方法。\n\n```\n=IF(ISBLANK([MiddleName]),\n\
    [FirstName] & \" \" & [LastName],\n[FirstName] & \" \" & [MiddleName] & \" \"\
    \ & [LastName]\n)\n```"
- fmt: "`ISERROR`函数用于检查某个计算或函数是否返回错误。以下计算检查除法运算中是否发生除零错误。\n\n```\n=IF(ISERROR([TotalProductCost]/[SalesAmount]),\n\
    \     BLANK(),\n     [TotalProductCost]/[SalesAmount]\n   )\n```\n\n另一种创建该计算的方法是使用`IFERROR`函数，该函数在无错误时返回原值，在发生错误时返回替代值。\n\
    \n```\n=IFERROR([TotalProductCost]/[SalesAmount],BLANK())\n```\n\n[表4-4](#9781430264453_Ch04.xhtml#Tab4)和[4-5](#9781430264453_Ch04.xhtml#Tab5)列出了DAX中可用的逻辑函数和信息函数。\n\
    \n[表4-4](#9781430264453_Ch04.xhtml#_Tab4). DAX逻辑函数\n\n| 函数 | 描述 |\n| --- | ---\
    \ |\n| `AND` | 检查两个参数是否都为TRUE。 |\n| `FALSE` | 返回逻辑值FALSE。 |\n| `IF` | 检查第一个参数提供的条件是否满足。若条件为TRUE则返回一个值，若为FALSE则返回另一个值。\
    \ |\n| `IFERROR` | 计算表达式，若表达式返回错误则返回指定值；否则返回表达式自身的值。 |\n| `NOT` | 将FALSE变为TRUE，或将TRUE变为FALSE。\
    \ |\n| `OR` | 检查任一参数是否为TRUE，若为TRUE则返回TRUE。 |\n| `SWITCH` | 根据值列表计算表达式，并返回多个可能结果表达式中的一个。\
    \ |\n| `TRUE` | 返回逻辑值TRUE。 |\n\n[表4-5](#9781430264453_Ch04.xhtml#_Tab5). DAX信息函数\n\
    \n| 函数 | 描述 |\n| --- | --- |\n| `CONTAINS` | 如果所有指定列中存在或包含这些值，则返回true。 |\n| `ISBLANK`\
    \ | 检查值是否为空。 |\n| `ISERROR` | 检查值是否为错误。 |\n| `ISLOGICAL` | 检查值是否为布尔值。 |\n| `ISNONTEXT`\
    \ | 检查值是否不是文本（空白单元格不算文本）。 |\n| `ISNUMBER` | 检查值是否为数字。 |\n| `ISTEXT` | 检查值是否为文本。\
    \ |\n| `LOOKUPVALUE` | 返回满足搜索条件的所有指定行中指定列的值。 |\n\n在分析数据时，您通常需要从相关表中查找对应数据。您可能需要从相关代码获取描述，或者汇总数据并将其导入表中，例如生命周期销售额。以下部分将介绍如何使用DAX查找相关数据。\n\
    \n### 从相关表中获取数据\n\n有时您需要在其他表中查找值以完成计算。如果表之间已建立关系，您可以使用`RELATED`函数。这允许您对表进行反规范化，使用户更易于导航。例如，您可能有一个与地理表相关的客户表（参见[图4-4](#9781430264453_Ch04.xhtml#Fig4)）。\n\
    \n![9781430264453_Fig04-04.jpg](Images/9781430264453_Fig04-04.jpg)\n\n[图4-4](#9781430264453_Ch04.xhtml#_Fig4).\
    \ 使用`RELATED`函数\n\n如果您需要按客户所在国家/地区查看销售额，可以使用`RELATED`函数在客户表中创建一个“国家/地区”列。\n\n\
    ```\n=RELATED(Geography[CountryRegionName])\n```\n\n然后，您可以将地理表对客户端工具隐藏，以保持模型更简洁，减少对用户的困扰。\n\
    \n尽管`RELATED`表返回单个值，但有时您需要查看一组相关数据，并在将其显示在列中之前进行聚合。例如，您可能希望在客户表中添加一列，列出其生命周期销售额。在这种情况下，您可以使用`RELATEDTABLE`函数获取相关销售额，然后为每个客户求和。\n\
    \n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n```\n\n![Image](Images/sq.jpg)\
    \ **注意** 上述代码使用了`SUMX`函数，而不是`SUM`函数，因为您正在应用筛选器。[第5章](../Text/9781430264453_Ch05.xhtml)将对此进行更详细的讨论。\n\
    \n我们最后要介绍的一组函数是数学、三角函数和统计函数。这些函数允许您执行常见分析，例如对数、标准差、舍入和截断。\n\n### 使用数学、三角函数和统计函数\n\
    \n除了迄今讨论的函数外，DAX还包含相当多的数学、三角函数和统计函数。数学函数（参见[表4-6](#9781430264453_Ch04.xhtml#Tab6)）用于对数据进行舍入、截断和求和。它们还包含可用于科学、工程和财务计算的函数；例如，您可能需要根据半径计算球体体积（参见以下DAX计算）：\n\
    \n```\n=4*PI()*POWER([Radius],3)/3\n```\n\n[表4-6](#9781430264453_Ch04.xhtml#_Tab6).\
    \ DAX中可用的部分数学和三角函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `ABS` | 返回数字的绝对值。 |\n| `CEILING`\
    \ | 将数字向上舍入到最接近的整数或最接近的显著性倍数。 |\n| `EXP` | 返回e的指定次幂。 |\n| `FACT` | 返回数字的阶乘。 |\n\
    | `FLOOR` | 将数字向下舍入（朝向零）到最接近的显著性倍数。 |\n| `LOG` | 返回指定底数的数字的对数。 |\n| `PI` | 返回圆周率pi的值（3.14159265358979），精确到15位数字。\
    \ |\n| `POWER` | 返回数字的指定次幂结果。 |\n| `ROUND` | 将数字舍入到指定的小数位数。 |\n| `SQRT` | 返回数字的平方根。\
    \ |\n| `SUM` | 对一列中的所有数字求和。 |\n| `TRUNC` | 通过移除数字的小数部分，将数字截断为整数。 |\n\n另一个例子是，假设您想要计算一项投资的复利。以下DAX计算可确定投资的复利回报率。\n\
    \n```\n=[Principal]*POWER(1+([IntRate]/[CompoundRate]),[CompoundRate]*[Years])\n\
    ```\n\n在分析数据时，您通常不仅要关注数据之间的关系，还要关注数据质量以及您对预测的信任程度。这就是数据统计分析发挥作用的地方。通过统计，您可以做诸如识别和处理数据中的异常值、检查数据波动性以及检测欺诈等事情。例如，您可以使用DAX通过标准差来确定和过滤数据中的异常值。以下DAX函数计算销售额的标准差。\n\
    \n```\n=STDEVX.P(RELATEDTABLE(Sales),Sales[SalesAmount])\n```\n\n[表4-7](#9781430264453_Ch04.xhtml#Tab7)列出了DAX中可用的部分统计函数。\n\
    \n[表4-7](#9781430264453_Ch04.xhtml#_Tab7). DAX中可用的部分统计函数\n\n| 函数 | 描述 |\n| ---\
    \ | --- |\n| `AVERAGE` | 返回一列中所有数字的平均值。 |\n| `COUNT` | 计算一列中包含数字的单元格个数。 |\n| `COUNTA`\
    \ | 计算一列中非空单元格的个数。 |\n| `COUNTBLANK` | 计算一列中空白单元格的个数。 |\n| `COUNTROWS` | 计算指定表中的行数。\
    \ |\n| `DISTINCTCOUNT` | 计算一列数字中不同单元格的个数。 |\n| `MAX` | 返回一列中的最大数值。 |\n| `MIN`\
    \ | 返回一列中的最小数值。 |\n| `RANK.EQ` | 返回一个数字在数字列表中的排名。 |\n| `RANKX` | 返回表参数中每一行在数字列表中的排名。\
    \ |\n| `STDEV.S` | 返回样本标准差。 |\n| `TOPN` | 返回指定表的前N行。 |\n| `VAR.S` | 返回样本方差。 |\n\
    \n现在您已经了解了Power Pivot和DAX中可用的函数。我想回顾一些关于创建函数的一般技巧。\n\n### 在Power Pivot中创建计算的技巧"
  raw: "The `ISERROR` function is used to check if a calculation or function returns\
    \ an error. The following calculation checks to see if a divide by zero error\
    \ occurs during a division.\n\n```\n=IF(ISERROR([TotalProductCost]/[SalesAmount]),\n\
    \     BLANK(),\n     [TotalProductCost]/[SalesAmount]\n   )\n```\n\nAnother way\
    \ to create this calculation is to use the `IFERROR` function, which returns the\
    \ value if no error occurs and an alternate value if an error occurs.\n\n```\n\
    =IFERROR([TotalProductCost]/[SalesAmount],BLANK())\n```\n\n[Tables 4-4](#9781430264453_Ch04.xhtml#Tab4)\
    \ and [4-5](#9781430264453_Ch04.xhtml#Tab5) list the logical and informational\
    \ functions available in DAX.\n\n[Table 4-4](#9781430264453_Ch04.xhtml#_Tab4).\
    \ The DAX Logical Functions\n\n| Function | Description |\n| --- | --- |\n| `AND`\
    \ | Checks whether both arguments are TRUE. |\n| `FALSE` | Returns the logical\
    \ value FALSE. |\n| `IF` | Checks if a condition provided as the first argument\
    \ is met. Returns one value if the condition is TRUE, and returns another value\
    \ if the condition is FALSE. |\n| `IFERROR` | Evaluates an expression and returns\
    \ a specified value if the expression returns an error; otherwise returns the\
    \ value of the expression itself. |\n| `NOT` | Changes FALSE to TRUE, or TRUE\
    \ to FALSE. |\n| `OR` | Checks whether one of the arguments is TRUE to return\
    \ TRUE. |\n| `SWITCH` | Evaluates an expression against a list of values and returns\
    \ one of multiple possible result expressions. |\n| `TRUE` | Returns the logical\
    \ value TRUE. |\n\n[Table 4-5](#9781430264453_Ch04.xhtml#_Tab5). The DAX Informational\
    \ Functions\n\n| Function | Description |\n| --- | --- |\n| `CONTAINS` | Returns\
    \ true if values for all referred columns exist, or are contained, in those columns\
    \ |\n| `ISBLANK` | Checks whether a value is blank |\n| `ISERROR` | Checks whether\
    \ a value is an error |\n| `ISLOGICAL` | Checks whether a value is a Boolean value\
    \ |\n| `ISNONTEXT` | Checks if a value is not text (blank cells are not text)\
    \ |\n| `ISNUMBER` | Checks whether a value is a number |\n| `ISTEXT` | Checks\
    \ if a value is text |\n| `LOOKUPVALUE` | Returns the value in the column for\
    \ the row that meets all criteria specified by a search |\n\nWhen you are analyzing\
    \ data you often need to look up corresponding data from a related table. You\
    \ may need to obtain descriptions from a related code or summarize data and import\
    \ it into a table, such as lifetime sales. The following section looks at how\
    \ you go about looking up related data using DAX.\n\nGetting Data from Related\
    \ Tables\n\nThere are times when you need to look up values in other tables to\
    \ complete a calculation. If there is a relationship established between the tables\
    \ you can use the `RELATED` function. This allows you to denormalize the tables\
    \ and make it easier for users to navigate. For example, you may have a Customer\
    \ table related to a Geography table (see [Figure 4-4](#9781430264453_Ch04.xhtml#Fig4)).\n\
    \n![9781430264453_Fig04-04.jpg](Images/9781430264453_Fig04-04.jpg)\n\n[Figure\
    \ 4-4](#9781430264453_Ch04.xhtml#_Fig4). Using the RELATED function\n\nIf you\
    \ need to look at sales by customer’s country, you can use the related function\
    \ to create a Country column in the Customers table.\n\n```\n=RELATED(Geography[CountryRegionName])\n\
    ```\n\nYou can then hide the Geography table from client tools to keep the model\
    \ cleaner and less confusing to users.\n\nAlthough the related table returns a\
    \ single value, there are times when you want to look at a set of related data\
    \ and aggregate it before displaying the value in the column. For example, you\
    \ may want to add a column to the Customers table that lists their lifetime sales\
    \ amount. In this case, you would use the `RELATEDTABLE` function to get the related\
    \ sales and then sum them up for each customer.\n\n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n\
    ```\n\n![Image](Images/sq.jpg) **Note**  The previous code uses the `SUMX` function,\
    \ which is used instead of the `SUM` function because you are applying a filter.\
    \ [Chapter 5](../Text/9781430264453_Ch05.xhtml) discusses this in more detail.\n\
    \nThe final set of functions we look at are the math, trig, and statistical functions.\
    \ These functions allow you to perform common analysis such as logs, standard\
    \ deviation, rounding, and truncation.\n\nUsing Math, Trig, and Statistical Functions\n\
    \nAlong with the functions discussed thus far, DAX also includes quite a few math,\
    \ trig, and statistical functions. The math functions (see [Table 4-6](#9781430264453_Ch04.xhtml#Tab6))\
    \ are used for rounding, truncating, and summing up the data. They also contain\
    \ functions you may use in scientific, engineering, and financial calculations;\
    \ for example, you may need to calculate the volume of a sphere given the radius\
    \ (see the following DAX calculation):\n\n```\n=4*PI()*POWER([Radius],3)/3\n```\n\
    \n[Table 4-6](#9781430264453_Ch04.xhtml#_Tab6). Some of the Math and Trig Functions\
    \ Available in DAX\n\n| Function | Description |\n| --- | --- |\n| `ABS` | Returns\
    \ the absolute value of a number |\n| `CEILING` | Rounds a number up to the nearest\
    \ integer or to the nearest multiple of significance |\n| `EXP` | Returns e raised\
    \ to the power of a given number |\n| `FACT` | Returns the factorial of a number\
    \ |\n| `FLOOR` | Rounds a number down, toward zero, to the nearest multiple of\
    \ significance |\n| `LOG` | Returns the logarithm of a number to the base you\
    \ specify |\n| `PI` | Returns the value of pi, 3.14159265358979, accurate to 15\
    \ digits |\n| `POWER` | Returns the result of a number raised to a power |\n|\
    \ `ROUND` | Rounds a number to the specified number of digits |\n| `SQRT` | Returns\
    \ the square root of a number |\n| `SUM` | Adds all the numbers in a column |\n\
    | `TRUNC` | Truncates a number to an integer by removing the decimal, or fractional,\
    \ part of the number |\n\nAs another example, say you want to calculate compounding\
    \ interest on an investment. The following DAX calculation determines the compounding\
    \ rate of return for an investment.\n\n```\n=[Principal]*POWER(1+([IntRate]/[CompoundRate]),[CompoundRate]*[Years])\n\
    ```\n\nWhen you are analyzing data, you often want to look at not only the relationship\
    \ between the data but also the quality of the data and how well you can trust\
    \ your predictions. This is where the statistical analysis of the data comes in\
    \ to play. With statistics, you can do things like determine and account for outliers\
    \ in the data, examine the volatility of the data, and detect fraud. As an example,\
    \ you can use DAX to determine and filter out the outliers in your data using\
    \ the standard deviation. The following DAX function calculates the standard deviation\
    \ of the sales amount.\n\n```\n=STDEVX.P(RELATEDTABLE(Sales),Sales[SalesAmount])\n\
    ```\n\n[Table 4-7](#9781430264453_Ch04.xhtml#Tab7) lists some of the statistical\
    \ functions available in DAX.\n\n[Table 4-7](#9781430264453_Ch04.xhtml#_Tab7).\
    \ Some of the Statistical Functions Available in DAX\n\n| Function | Description\
    \ |\n| --- | --- |\n| `AVERAGE` | Returns the average of all the numbers in a\
    \ column |\n| `COUNT` | Counts the number of cells in a column that contain numbers\
    \ |\n| `COUNTA` | Counts the number of cells in a column that are not empty |\n\
    | `COUNTBLANK` | Counts the number of blank cells in a column |\n| `COUNTROWS`\
    \ | Counts the number of rows in the specified table |\n| `DISTINCTCOUNT` | Counts\
    \ the number of different cells in a column of numbers |\n| `MAX` | Returns the\
    \ largest numeric value in a column |\n| `MIN` | Returns the smallest numeric\
    \ value in a column |\n| `RANK.EQ` | Returns the ranking of a number in a list\
    \ of numbers |\n| `RANKX` | Returns the ranking of a number in a list of numbers\
    \ for each row in the table argument |\n| `STDEV.S` | Returns the standard deviation\
    \ of a sample population |\n| `TOPN` | Returns the top *N* rows of the specified\
    \ table |\n| `VAR.S` | Returns the variance of a sample population |\n\nNow that\
    \ you have seen what functions you have available in Power Pivot and DAX. I want\
    \ to review some tips on creating functions in general.\n\nTips for Creating Calculations\
    \ in Power Pivot"
  trans: "\n`ISERROR`函数用于检查某个计算或函数是否返回错误。以下计算检查除法运算中是否发生除零错误。\n\n```\n=IF(ISERROR([TotalProductCost]/[SalesAmount]),\n\
    \     BLANK(),\n     [TotalProductCost]/[SalesAmount]\n   )\n```\n\n另一种创建该计算的方法是使用`IFERROR`函数，该函数在无错误时返回原值，在发生错误时返回替代值。\n\
    \n```\n=IFERROR([TotalProductCost]/[SalesAmount],BLANK())\n```\n\n表 4-4 和 4-5\
    \ 列出了 DAX 中可用的逻辑函数和信息函数。\n\n表 4-4. DAX 逻辑函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `AND`\
    \ | 检查两个参数是否都为 TRUE。 |\n| `FALSE` | 返回逻辑值 FALSE。 |\n| `IF` | 检查第一个参数提供的条件是否满足。若条件为\
    \ TRUE 则返回一个值，若为 FALSE 则返回另一个值。 |\n| `IFERROR` | 计算表达式，若表达式返回错误则返回指定值；否则返回表达式自身的值。\
    \ |\n| `NOT` | 将 FALSE 变为 TRUE，或将 TRUE 变为 FALSE。 |\n| `OR` | 检查任一参数是否为 TRUE，若为\
    \ TRUE 则返回 TRUE。 |\n| `SWITCH` | 根据值列表计算表达式，并返回多个可能结果表达式中的一个。 |\n| `TRUE` | 返回逻辑值\
    \ TRUE。 |\n\n表 4-5. DAX 信息函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `CONTAINS` | 如果所有指定列中存在或包含这些值，则返回\
    \ true。 |\n| `ISBLANK` | 检查值是否为空。 |\n| `ISERROR` | 检查值是否为错误。 |\n| `ISLOGICAL`\
    \ | 检查值是否为布尔值。 |\n| `ISNONTEXT` | 检查值是否不是文本（空白单元格不算文本）。 |\n| `ISNUMBER` | 检查值是否为数字。\
    \ |\n| `ISTEXT` | 检查值是否为文本。 |\n| `LOOKUPVALUE` | 返回满足搜索条件的所有指定行中指定列的值。 |\n\n在分析数据时，您通常需要从相关表中查找对应数据。您可能需要从相关代码获取描述，或者汇总数据并将其导入表中，例如生命周期销售额。以下部分将介绍如何使用\
    \ DAX 查找相关数据。\n\n### 从相关表中获取数据\n\n有时您需要在其他表中查找值以完成计算。如果表之间已建立关系，您可以使用`RELATED`函数。这允许您对表进行反规范化，使用户更易于导航。例如，您可能有一个与地理表相关的客户表（参见图\
    \ 4-4）。\n\n![9781430264453_Fig04-04.jpg](img/9781430264453_Fig04-04.jpg)\n\n图\
    \ 4-4. 使用`RELATED`函数\n\n如果您需要按客户所在国家/地区查看销售额，可以使用`RELATED`函数在客户表中创建一个“国家/地区”列。\n\
    \n```\n=RELATED(Geography[CountryRegionName])\n```\n\n然后，您可以将地理表对客户端工具隐藏，以保持模型更简洁，减少对用户的困扰。\n\
    \n尽管`RELATED`表返回单个值，但有时您需要查看一组相关数据，并在将其显示在列中之前进行聚合。例如，您可能希望在客户表中添加一列，列出其生命周期销售额。在这种情况下，您可以使用`RELATEDTABLE`函数获取相关销售额，然后为每个客户求和。\n\
    \n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n```\n\n![Image](img/sq.jpg) **注意**\
    \ 上述代码使用了`SUMX`函数，而不是`SUM`函数，因为您正在应用筛选器。第 5 章将对此进行更详细的讨论。\n\n我们最后要介绍的一组函数是数学、三角函数和统计函数。这些函数允许您执行常见分析，例如对数、标准差、舍入和截断。\n\
    \n### 使用数学、三角函数和统计函数\n\n除了迄今讨论的函数外，DAX 还包含相当多的数学、三角函数和统计函数。数学函数（参见表 4-6）用于对数据进行舍入、截断和求和。它们还包含可用于科学、工程和财务计算的函数；例如，您可能需要根据半径计算球体体积（参见以下\
    \ DAX 计算）：\n\n```\n=4*PI()*POWER([Radius],3)/3\n```\n\n表 4-6. DAX 中可用的部分数学和三角函数\n\
    \n| 函数 | 描述 |\n| --- | --- |\n| `ABS` | 返回数字的绝对值。 |\n| `CEILING` | 将数字向上舍入到最接近的整数或最接近的显著性倍数。\
    \ |\n| `EXP` | 返回 e 的指定次幂。 |\n| `FACT` | 返回数字的阶乘。 |\n| `FLOOR` | 将数字向下舍入（朝向零）到最接近的显著性倍数。\
    \ |\n| `LOG` | 返回指定底数的数字的对数。 |\n| `PI` | 返回圆周率 pi 的值（3.14159265358979），精确到 15\
    \ 位数字。 |\n| `POWER` | 返回数字的指定次幂结果。 |\n| `ROUND` | 将数字舍入到指定的小数位数。 |\n| `SQRT` |\
    \ 返回数字的平方根。 |\n| `SUM` | 对一列中的所有数字求和。 |\n| `TRUNC` | 通过移除数字的小数部分，将数字截断为整数。 |\n\
    \n另一个例子是，假设您想要计算一项投资的复利。以下 DAX 计算可确定投资的复利回报率。\n\n```\n=[Principal]*POWER(1+([IntRate]/[CompoundRate]),[CompoundRate]*[Years])\n\
    ```\n\n在分析数据时，您通常不仅要关注数据之间的关系，还要关注数据质量以及您对预测的信任程度。这就是数据统计分析发挥作用的地方。通过统计，您可以做诸如识别和处理数据中的异常值、检查数据波动性以及检测欺诈等事情。例如，您可以使用\
    \ DAX 通过标准差来确定和过滤数据中的异常值。以下 DAX 函数计算销售额的标准差。\n\n```\n=STDEVX.P(RELATEDTABLE(Sales),Sales[SalesAmount])\n\
    ```\n\n表 4-7 列出了 DAX 中可用的部分统计函数。\n\n表 4-7. DAX 中可用的部分统计函数\n\n| 函数 | 描述 |\n| ---\
    \ | --- |\n| `AVERAGE` | 返回一列中所有数字的平均值。 |\n| `COUNT` | 计算一列中包含数字的单元格个数。 |\n| `COUNTA`\
    \ | 计算一列中非空单元格的个数。 |\n| `COUNTBLANK` | 计算一列中空白单元格的个数。 |\n| `COUNTROWS` | 计算指定表中的行数。\
    \ |\n| `DISTINCTCOUNT` | 计算一列数字中不同单元格的个数。 |\n| `MAX` | 返回一列中的最大数值。 |\n| `MIN`\
    \ | 返回一列中的最小数值。 |\n| `RANK.EQ` | 返回一个数字在数字列表中的排名。 |\n| `RANKX` | 返回表参数中每一行在数字列表中的排名。\
    \ |\n| `STDEV.S` | 返回样本标准差。 |\n| `TOPN` | 返回指定表的前 N 行。 |\n| `VAR.S` | 返回样本方差。\
    \ |\n\n现在您已经了解了 Power Pivot 和 DAX 中可用的函数。我想回顾一些关于创建函数的一般技巧。\n\n### 在 Power Pivot\
    \ 中创建计算的技巧\n"
- fmt: "Before turning you loose on a hands-on lab, I want to give you a few pointers\
    \ on creating these calculations in Power Pivot. When entering a formula for a\
    \ calculated column, right click on a column in the table in the Data View window\
    \ of the model builder. In the context menu, select `Insert Column` (see [Figure\
    \ 4-5](#9781430264453_Ch04.xhtml#Fig5)).\n\n![9781430264453_Fig04-05.jpg](Images/9781430264453_Fig04-05.jpg)\n\
    \n[Figure 4-5](#9781430264453_Ch04.xhtml#_Fig5). Adding a calculated column\n\n\
    Rename the column and then enter the formula in the formula editor bar. Formulas\
    \ start with an equal sign (`=`) and table names are contained in single quotes\
    \ (`‘’`), which is optional if the table name does not contain spaces. Table columns\
    \ are contained in square brackets (`[]`). The formula editor bar supplies an\
    \ autocomplete feature that you should take advantage of (see [Figure 4-6](#9781430264453_Ch04.xhtml#Fig6)).\
    \ Select the function, table, or column from the drop-down list and press the\
    \ `Tab` key to insert it into the formula. If you do not see the autofill drop-down,\
    \ chances are there is an error in your formula.\n\n![9781430264453_Fig04-06.jpg](Images/9781430264453_Fig04-06.jpg)\n\
    \n[Figure 4-6](#9781430264453_Ch04.xhtml#_Fig6). Using autocomplete when creating\
    \ calculations\n\nThere are three buttons next to the formula editor bar: The\
    \ `X` is used to cancel the changes you made; the check mark is used to commit\
    \ the changes; and the function symbol is used to launch an `Insert Function`\
    \ window (see [Figure 4-7](#9781430264453_Ch04.xhtml#Fig7)). You can peruse the\
    \ various functions and gain information on the parameters expected by the functions.\n\
    \n![9781430264453_Fig04-07.jpg](Images/9781430264453_Fig04-07.jpg)\n\n[Figure\
    \ 4-7](#9781430264453_Ch04.xhtml#_Fig7). Using the function helper\n\nWhen you\
    \ create a calculation incorrectly, you may get an error indicator. You should\
    \ click on the error drop-down and select `Show Error` (see [Figure 4-8](#9781430264453_Ch04.xhtml#Fig8)).\
    \ This will display an error message (see [Figure 4-9](#9781430264453_Ch04.xhtml#Fig9)),\
    \ which will give you useful information that can help you fix the error.\n\n\
    ![9781430264453_Fig04-08.jpg](Images/9781430264453_Fig04-08.jpg)\n\n[Figure 4-8](#9781430264453_Ch04.xhtml#_Fig8).\
    \ Showing error information\n\n![9781430264453_Fig04-09.jpg](Images/9781430264453_Fig04-09.jpg)\n\
    \n[Figure 4-9](#9781430264453_Ch04.xhtml#_Fig9). Viewing the error message\n\n\
    Now that you have seen how to create calculations with DAX and are familiar with\
    \ the DAX functions available to you, it is time to gain some hands-on experience.\n\
    \n## HANDS-ON LAB—CREATING CALCULATED COLUMNS IN POWER PIVOT\n\nIn the following\
    \ lab you will\n\n*   Create calculated columns.\n*   Use DAX text functions.\n\
    *   Use date functions in a DAX expression.\n*   Use data from a related table\
    \ in an expression.\n*   Implement conditional logic in an expression.\n\n1. \
    \ In the Lab Starters folder, open the `LabChap4Starter.xlsx` file. This file\
    \ contains a data model consisting of sales data, product data, and store data.\n\
    2.  View the model in the Power Pivot window using the diagram view (see [Figure\
    \ 4-10](#9781430264453_Ch04.xhtml#Fig10)).\n\n![9781430264453_Fig04-10.jpg](Images/9781430264453_Fig04-10.jpg)\n\
    \n[Figure 4-10](#9781430264453_Ch04.xhtml#_Fig10). The data model for store sales\n\
    \n3.  Switch to data view in the Power Pivot Window and select the `Sales` table.\n\
    4.  After the `SalesAmount` column, click on the `Add Column`. In the formula\
    \ bar above the table, enter the following to calculate margin:\n\n```\n    =[SalesAmount]\
    \ - [TotalCost]\n```\n\n5.  Right click on the new column and rename it `Margin`.\n\
    6.  Repeat this procedure to create a `MarginPercent` column with the following\
    \ formula:\n\n```\n    =[Margin]/[SalesAmount]\n```\n\n7.  In the Data View window,\
    \ select the `Date` table.\n8.  Use the Date functions to create a `Year`, `Quarter`,\
    \ `Month`, `Month Number`, and `Weekday` column.\n9.  Using the `Year`, `Quarter`,\
    \ and `Month` columns, create a `Calendar` hierarchy in the `Date` table.\n10.\
    \  In the Data View window, select the `Product` table.\n11.  Insert a `Weight\
    \ Label` column with the following formula:\n\n```\n    =if(ISBLANK([Weight]),BLANK(),\
    \ [Weight] & \" \" & [WeightUnitMeasureID])\n```\n\n12.  Next to `ProductSubcategoryKey`,\
    \ create a `ProductCategory` column using the related function:\n\n```\n    =RELATED('ProductCategory'[ProductCategoryName])\n\
    ```\n\n13.  Using the related function, create a `ProductSubcategory` column.\n\
    14.  Hide the `ProductCategory` and `ProductSubcategory` tables from the client\
    \ tools.\n15.  Switch to the `Store` table and create a `Years Open` column with\
    \ the following formula:\n\n```\n    =TRUNC(YEARFRAC([OpenDate],\n           If(ISBLANK([CloseDate]),TODAY(),[CloseDate]))\n\
    \              ,0)\n```\n\n16.  Create a `LifetimeSales` column using the following\
    \ formula:\n\n```\n    =SUMX(RELATEDTABLE(Sales),Sales[SalesAmount])\n```\n\n\
    17.  Save and close the Excel file.\n\n## Summary\n\nThis chapter introduced you\
    \ to the DAX language and the built-in functions that you can use to create calculations.\
    \ At this point, you should be comfortable with creating calculated columns and\
    \ using the DAX functions. I strongly recommend that you become familiar with\
    \ the various functions available and how to use them in your analysis. In the\
    \ next chapter you will continue working with DAX to create measures. Measures\
    \ are one of the most important parts of building your model in Power Pivot; the\
    \ measures are the reason you are looking at your data. You want to answer questions\
    \ such as how sales are doing or what influences energy consumption. Along with\
    \ creating measures, you will also see how filter context effects measures. Filter\
    \ context is one of the most important concepts you need to master in order to\
    \ get the most out of Power Pivot.\n\n## CHAPTER 5\n\n![image](Images/frontdot.jpg)\n\
    \n# Creating Measures with DAX\n\nCreating measures in DAX is the most important\
    \ skill necessary to create solid data models. This chapter covers the common\
    \ functions used to create measures in the data model. It also covers the important\
    \ topic of data context and how to alter or override the context when creating\
    \ measures.\n\nAfter completing this chapter you will be able to\n\n*   Understand\
    \ the difference between measures and attributes.\n*   Understand how context\
    \ affects measurements.\n*   Create common aggregates.\n*   Know how and when\
    \ to alter the filter context.\n*   Create KPIs.\n\n## Measures versus Attributes\n\
    \nIf you look at a typical star model for a data warehouse, you have a fact table\
    \ surrounded by dimension tables. For example, [Figure 5-1](#9781430264453_Ch05.xhtml#Fig1)\
    \ shows a financial fact table surrounded by several dimension tables.\n\n![9781430264453_Fig05-01.jpg](Images/9781430264453_Fig05-01.jpg)\n\
    \n[Figure 5-1](#9781430264453_Ch05.xhtml#_Fig1). Typical star schema\n\nRemember,\
    \ the fact table contains numbers that you need to aggregate; for example, in\
    \ the finance table, you have the amount, which is a monetary value that needs\
    \ to be aggregated. In a sales fact table you may have a sales amount and item\
    \ counts. In a human resources system you might have hours worked. The dimension\
    \ tables contain the attributes that you are using to categorize and roll up the\
    \ measures. For example, the financial measures are classified as profit, loss,\
    \ and forecasted. You want to roll the values up to the department and organization\
    \ level and you want to compare values between months and years."
