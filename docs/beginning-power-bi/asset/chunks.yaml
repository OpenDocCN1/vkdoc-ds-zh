- fmt: "[Figure 3-8](#9781430264453_Ch03.xhtml#_Fig8). The `Product` and `Sales` tables\n\
    \nWhen you try to create a relationship between the tables you get the error shown\
    \ in [Figure 3-9](#9781430264453_Ch03.xhtml#Fig9).\n\n![9781430264453_Fig03-09.jpg](Images/9781430264453_Fig03-09.jpg)\n\
    \n[Figure 3-9](#9781430264453_Ch03.xhtml#_Fig9). Getting a duplicate value error\n\
    \nIn this example the `ProductNumber` is supposed to be unique in the `Product`\
    \ table but it turns out there are duplicates. In order to fix this, you would\
    \ have to change the query for the `Product` table data to ensure that you are\
    \ not getting duplicates.\n\nNow that you know how to create table relationships\
    \ in the model, you are ready to look at the benefits of using a star schema.\n\
    \n## Creating a Star Schema\n\nWhen creating a data model it is important to understand\
    \ what the model is being used for. The two major uses of databases are for capturing\
    \ data and for reporting/analyzing the data. The problem is that when you create\
    \ a model for efficient data capture, you decrease its efficiency to analyze the\
    \ data. To combat this problem, many companies split off the data capturing database\
    \ from their reporting/analysis database. Fortunately, when creating the data\
    \ model in `Power Pivot`, we only need to tune it for reporting.\n\nOne of the\
    \ best models to use when analyzing large sets of data is the *star schema*. The\
    \ star schema consists of a central fact table surrounded by dimension tables,\
    \ as shown in [Figure 3-10](#9781430264453_Ch03.xhtml#Fig10).\n\n![9781430264453_Fig03-10.jpg](Images/9781430264453_Fig03-10.jpg)\n\
    \n[Figure 3-10](#9781430264453_Ch03.xhtml#_Fig10). A typical star schema\n\nThe\
    \ fact table contains quantitative data related to the business or process. For\
    \ example, the `Sales` table in [Figure 3-10](#9781430264453_Ch03.xhtml#Fig10)\
    \ contains measurable aspects of a sale, such as total costs, sales amount, and\
    \ quantity. Fact tables usually contain many rows and have a date or time component\
    \ that records the time point at which the event occurred. The dimension tables\
    \ contain attributes about the event. For example, the `Date` table can tell you\
    \ when the sale occurred and allows you to roll up the data to the month, quarter,\
    \ or year level. The `Product` table contains attributes about the product sold\
    \ and you can look at sales by product line, color, and brand. The `Store` table\
    \ contains attributes about the store involved in the sale. Dimension tables usually\
    \ do not contain as many rows as the fact table but can contain quite a few columns.\
    \ When you ask a question like “Which bikes are selling the best in the various\
    \ age groups?” the measures (sales dollar values) come from the fact table whereas\
    \ the categorizations (age and bike model) come from the dimension tables.\n\n\
    The main advantage of the star schema is that it provides fast query performance\
    \ and aggregation processing. The disadvantage is that it usually requires a lot\
    \ of preprocessing to move the data from a highly normalized transactional system\
    \ to a more denormalized reporting system. The good news is that your business\
    \ may have a reporting system feeding a traditional online analytical processing\
    \ (OLAP) database such as Microsoft’s `Analysis Server` or IBM’s `Cognos`. If\
    \ you can gain access to these systems, they are probably the best source for\
    \ your core business data.\n\nIn order to create a star schema from your source\
    \ data systems, you may have to perform some data denormalization, which is covered\
    \ in the following section.\n\n## Understanding When to Denormalize the Data\n\
    \nAlthough transactional database systems tend to be highly normalized, reporting\
    \ systems are denormalized into the star schema. If you do not have access to\
    \ a reporting system where the denormalization is done for you, you will have\
    \ to denormalize the data into a star schema to load your `Power Pivot` model.\
    \ As an example, [Figure 3-11](#9781430264453_Ch03.xhtml#Fig11) shows the tables\
    \ that contain customer data in the `Adventureworks` transactional sales database.\n\
    \n![9781430264453_Fig03-11.jpg](Images/9781430264453_Fig03-11.jpg)\n\n[Figure\
    \ 3-11](#9781430264453_Ch03.xhtml#_Fig11). A highly normalized schema\n\nIn order\
    \ to denormalize the customer data into your model, you need to create a query\
    \ that combines the data into a single customer dimension table. If you are not\
    \ familiar with creating complex queries, the easiest way to do this is to have\
    \ the database developers create a view you can pull from that combines the tables\
    \ for you. If the query is not too complex, you can probably create it yourself\
    \ when you import the data. For example, [Figure 3-12](#9781430264453_Ch03.xhtml#Fig12)\
    \ shows a customer table and a geography table.\n\n![9781430264453_Fig03-12.jpg](Images/9781430264453_Fig03-12.jpg)\n\
    \n[Figure 3-12](#9781430264453_Ch03.xhtml#_Fig12). Combining customer and customer\
    \ location data\n\nYou can combine these into one customer dimension table using\
    \ the following query.\n\n```\nSELECT  c.CustomerKey, c.BirthDate, c.MaritalStatus,\
    \ c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome, c.EnglishOccupation,\n\
    \        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n        g.City,\
    \ g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\nFROM    Customer\
    \ AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
    ```\n\nAlthough you do not have to be a query expert to get data into your `Power\
    \ Pivot` model, it is very beneficial to know the basics of querying the data\
    \ sources, even if it just helps to ask the right questions when you talk to the\
    \ database developers.\n\n## Creating Linked Tables\n\nOne thing to remember about\
    \ the data contained in the `Power Pivot` model is that it is read only. For the\
    \ most part this is a good thing. You want to make sure that the data only gets\
    \ changed in the source system. At times, however, as part of the data analysis,\
    \ you will want to make adjustments on the fly and see how it affects the results.\
    \ One example that happens fairly often is *bucket analysis*. For example, say\
    \ you want to look a continuous measure such as age in discrete buckets (ranges)\
    \ and you need to adjust the ranges during analysis. This is where linked tables\
    \ shine.\n\nTo create the linked table you first set up the table on an Excel\
    \ sheet. After entering the data, you highlight it and click on the quick analysis\
    \ menu (see [Figure 3-13](#9781430264453_Ch03.xhtml#Fig13)). Under the `Tables`\
    \ tab click on the `Table` button.\n\n![9781430264453_Fig03-13.jpg](Images/9781430264453_Fig03-13.jpg)\n\
    \n[Figure 3-13](#9781430264453_Ch03.xhtml#_Fig13). Creating an Excel table\n\n\
    Once the table is created, it is a good idea to name it before importing it into\
    \ the `Power Pivot` data model. You can do this by selecting the table and then\
    \ entering the table name under the `Tables` tab in the `Table Tools Design` popup\
    \ window (see [Figure 3-14](#9781430264453_Ch03.xhtml#Fig14)).\n\n![9781430264453_Fig03-14.jpg](Images/9781430264453_Fig03-14.jpg)\n\
    \n[Figure 3-14](#9781430264453_Ch03.xhtml#_Fig14). Renaming an Excel table\n\n\
    Once you have the table named, select it, and on the `Power Pivot` tab, select\
    \ `Add To Data Model` (see [Figure 3-15](#9781430264453_Ch03.xhtml#Fig15)).\n\n\
    ![9781430264453_Fig03-15.jpg](Images/9781430264453_Fig03-15.jpg)\n\n[Figure 3-15](#9781430264453_Ch03.xhtml#_Fig15).\
    \ Adding the table to the model\n\nAfter the table is imported into the model,\
    \ if you change some of the table values in the Excel sheet and select `Update\
    \ All` on the `PowerPivot` tab (see [Figure 3-15](#9781430264453_Ch03.xhtml#Fig15)),\
    \ the linked table in the model will update with the new values.\n\n## Creating\
    \ Hierarchies"
  raw: "[Figure 3-8](#9781430264453_Ch03.xhtml#_Fig8). The Product and Sales tables\n\
    \nWhen you try to create a relationship between the tables you get the error shown\
    \ in [Figure 3-9](#9781430264453_Ch03.xhtml#Fig9).\n\n![9781430264453_Fig03-09.jpg](Images/9781430264453_Fig03-09.jpg)\n\
    \n[Figure 3-9](#9781430264453_Ch03.xhtml#_Fig9). Getting a duplicate value error\n\
    \nIn this example the ProductNumber is supposed to be unique in the Product table\
    \ but it turns out there are duplicates. In order to fix this, you would have\
    \ to change the query for the Product table data to ensure that you are not getting\
    \ duplicates.\n\nNow that you know how to create table relationships in the model,\
    \ you are ready to look at the benefits of using a star schema.\n\nCreating a\
    \ Star Schema\n\nWhen creating a data model it is important to understand what\
    \ the model is being used for. The two major uses of databases are for capturing\
    \ data and for reporting/analyzing the data. The problem is that when you create\
    \ a model for efficient data capture, you decrease its efficiency to analyze the\
    \ data. To combat this problem, many companies split off the data capturing database\
    \ from their reporting/analysis database. Fortunately, when creating the data\
    \ model in Power Pivot, we only need to tune it for reporting.\n\nOne of the best\
    \ models to use when analyzing large sets of data is the *star schema*. The star\
    \ schema consists of a central fact table surrounded by dimension tables, as shown\
    \ in [Figure 3-10](#9781430264453_Ch03.xhtml#Fig10).\n\n![9781430264453_Fig03-10.jpg](Images/9781430264453_Fig03-10.jpg)\n\
    \n[Figure 3-10](#9781430264453_Ch03.xhtml#_Fig10). A typical star schema\n\nThe\
    \ fact table contains quantitative data related to the business or process. For\
    \ example, the Sales table in [Figure 3-10](#9781430264453_Ch03.xhtml#Fig10) contains\
    \ measurable aspects of a sale, such as total costs, sales amount, and quantity.\
    \ Fact tables usually contain many rows and have a date or time component that\
    \ records the time point at which the event occurred. The dimension tables contain\
    \ attributes about the event. For example, the Date table can tell you when the\
    \ sale occurred and allows you to roll up the data to the month, quarter, or year\
    \ level. The Product table contains attributes about the product sold and you\
    \ can look at sales by product line, color, and brand. The Store table contains\
    \ attributes about the store involved in the sale. Dimension tables usually do\
    \ not contain as many rows as the fact table but can contain quite a few columns.\
    \ When you ask a question like “Which bikes are selling the best in the various\
    \ age groups?” the measures (sales dollar values) come from the fact table whereas\
    \ the categorizations (age and bike model) come from the dimension tables.\n\n\
    The main advantage of the star schema is that it provides fast query performance\
    \ and aggregation processing. The disadvantage is that it usually requires a lot\
    \ of preprocessing to move the data from a highly normalized transactional system\
    \ to a more denormalized reporting system. The good news is that your business\
    \ may have a reporting system feeding a traditional online analytical processing\
    \ (OLAP) database such as Microsoft’s Analysis Server or IBM’s Cognos. If you\
    \ can gain access to these systems, they are probably the best source for your\
    \ core business data.\n\nIn order to create a star schema from your source data\
    \ systems, you may have to perform some data denormalization, which is covered\
    \ in the following section.\n\nUnderstanding When to Denormalize the Data\n\n\
    Although transactional database systems tend to be highly normalized, reporting\
    \ systems are denormalized into the star schema. If you do not have access to\
    \ a reporting system where the denormalization is done for you, you will have\
    \ to denormalize the data into a star schema to load your Power Pivot model. As\
    \ an example, [Figure 3-11](#9781430264453_Ch03.xhtml#Fig11) shows the tables\
    \ that contain customer data in the Adventureworks transactional sales database.\n\
    \n![9781430264453_Fig03-11.jpg](Images/9781430264453_Fig03-11.jpg)\n\n[Figure\
    \ 3-11](#9781430264453_Ch03.xhtml#_Fig11). A highly normalized schema\n\nIn order\
    \ to denormalize the customer data into your model, you need to create a query\
    \ that combines the data into a single customer dimension table. If you are not\
    \ familiar with creating complex queries, the easiest way to do this is to have\
    \ the database developers create a view you can pull from that combines the tables\
    \ for you. If the query is not too complex, you can probably create it yourself\
    \ when you import the data. For example, [Figure 3-12](#9781430264453_Ch03.xhtml#Fig12)\
    \ shows a customer table and a geography table.\n\n![9781430264453_Fig03-12.jpg](Images/9781430264453_Fig03-12.jpg)\n\
    \n[Figure 3-12](#9781430264453_Ch03.xhtml#_Fig12). Combining customer and customer\
    \ location data\n\nYou can combine these into one customer dimension table using\
    \ the following query.\n\n```\nSELECT  c.CustomerKey, c.BirthDate, c.MaritalStatus,\
    \ c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome, c.EnglishOccupation,\n\
    \        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n        g.City,\
    \ g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\nFROM    Customer\
    \ AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
    ```\n\nAlthough you do not have to be a query expert to get data into your Power\
    \ Pivot model, it is very beneficial to know the basics of querying the data sources,\
    \ even if it just helps to ask the right questions when you talk to the database\
    \ developers.\n\nCreating Linked Tables\n\nOne thing to remember about the data\
    \ contained in the Power Pivot model is that it is read only. For the most part\
    \ this is a good thing. You want to make sure that the data only gets changed\
    \ in the source system. At times, however, as part of the data analysis, you will\
    \ want to make adjustments on the fly and see how it affects the results. One\
    \ example that happens fairly often is *bucket analysis*. For example, say you\
    \ want to look a continuous measure such as age in discrete buckets (ranges) and\
    \ you need to adjust the ranges during analysis. This is where linked tables shine.\n\
    \nTo create the linked table you first set up the table on an Excel sheet. After\
    \ entering the data, you highlight it and click on the quick analysis menu (see\
    \ [Figure 3-13](#9781430264453_Ch03.xhtml#Fig13)). Under the Tables tab click\
    \ on the Table button.\n\n![9781430264453_Fig03-13.jpg](Images/9781430264453_Fig03-13.jpg)\n\
    \n[Figure 3-13](#9781430264453_Ch03.xhtml#_Fig13). Creating an Excel table\n\n\
    Once the table is created, it is a good idea to name it before importing it into\
    \ the Power Pivot data model. You can do this by selecting the table and then\
    \ entering the table name under the Tables tab in the Table Tools Design popup\
    \ window (see [Figure 3-14](#9781430264453_Ch03.xhtml#Fig14)).\n\n![9781430264453_Fig03-14.jpg](Images/9781430264453_Fig03-14.jpg)\n\
    \n[Figure 3-14](#9781430264453_Ch03.xhtml#_Fig14). Renaming an Excel table\n\n\
    Once you have the table named, select it, and on the Power Pivot tab, select Add\
    \ To Data Model (see [Figure 3-15](#9781430264453_Ch03.xhtml#Fig15)).\n\n![9781430264453_Fig03-15.jpg](Images/9781430264453_Fig03-15.jpg)\n\
    \n[Figure 3-15](#9781430264453_Ch03.xhtml#_Fig15). Adding the table to the model\n\
    \nAfter the table is imported into the model, if you change some of the table\
    \ values in the Excel sheet and select Update All on the PowerPivot tab (see [Figure\
    \ 3-15](#9781430264453_Ch03.xhtml#Fig15)), the linked table in the model will\
    \ update with the new values.\n\nCreating Hierarchies"
  trans: "\n图 3-8. `Product` 和 `Sales` 表\n\n当你尝试在这两个表之间创建关系时，会出现图 3-9 所示的错误。\n\n![9781430264453_Fig03-09.jpg](img/9781430264453_Fig03-09.jpg)\n\
    \n图 3-9. 出现重复值错误\n\n在这个示例中，`ProductNumber` 在 `Product` 表中本应是唯一的，但结果却存在重复值。为了解决这个问题，你需要修改\
    \ `Product` 表数据的查询，以确保不会获取到重复数据。\n\n现在你已经了解了如何在模型中创建表关系，接下来可以看看使用星型架构的好处了。\n\n\
    ## 创建星型架构\n\n在创建数据模型时，理解模型的用途非常重要。数据库的两大主要用途是捕获数据和报告/分析数据。问题在于，当你为高效的数据捕获创建模型时，会降低其分析数据的效率。为了解决这个问题，许多公司将其数据捕获数据库与报告/分析数据库分离开来。幸运的是，在\
    \ `Power Pivot` 中创建数据模型时，我们只需针对报告进行优化即可。\n\n分析大量数据集时最佳模型之一是*星型架构*。星型架构由一个中心事实表和环绕其周围的维度表组成，如图\
    \ 3-10 所示。\n\n![9781430264453_Fig03-10.jpg](img/9781430264453_Fig03-10.jpg)\n\n\
    图 3-10. 典型的星型架构\n\n事实表包含与业务或流程相关的量化数据。例如，图 3-10 中的 `Sales` 表包含了销售的可度量方面，例如总成本、销售额和数量。事实表通常包含许多行，并具有日期或时间组件，用于记录事件发生的时间点。维度表包含事件的属性。例如，`Date`\
    \ 表可以告诉你销售发生的时间，并允许你将数据汇总到月、季度或年级别。`Product` 表包含所售产品的属性，你可以按产品线、颜色和品牌查看销售情况。`Store`\
    \ 表包含与销售相关的商店属性。维度表通常没有事实表那么多行，但可能包含相当多的列。当你提出类似“哪些自行车在不同年龄段中销量最好？”这样的问题时，度量值（销售额）来自事实表，而分类（年龄和自行车型号）则来自维度表。\n\
    \n星型架构的主要优势在于提供快速的查询性能和聚合处理能力。其缺点是通常需要大量的预处理，将数据从高度规范化的交易系统迁移到较不规范化的报告系统。好消息是，你的企业可能已经拥有一个为传统联机分析处理\
    \ (OLAP) 数据库（例如 Microsoft 的 `Analysis Server` 或 IBM 的 `Cognos`）提供数据的报告系统。如果你能访问这些系统，它们很可能是你核心业务数据的最佳来源。\n\
    \n为了从源数据系统创建星型架构，你可能需要执行一些数据反规范化操作，下一节将对此进行介绍。\n\n## 理解何时对数据进行反规范化\n\n虽然交易数据库系统通常是高度规范化的，但报告系统则被反规范化为星型架构。如果你无法访问一个已经为你完成反规范化处理的报告系统，那么你将不得不自己将数据反规范化为星型架构，以加载到你的\
    \ `Power Pivot` 模型中。例如，图 3-11 展示了 `Adventureworks` 交易销售数据库中包含客户数据的表。\n\n![9781430264453_Fig03-11.jpg](img/9781430264453_Fig03-11.jpg)\n\
    \n图 3-11. 高度规范化的架构\n\n为了将客户数据反规范化到你的模型中，你需要创建一个将数据组合成单个客户维度表的查询。如果你不熟悉创建复杂查询，最简单的方法是让数据库开发人员创建一个视图，你可以从中提取，该视图会为你组合这些表。如果查询不是太复杂，你很可能可以在导入数据时自己创建。例如，图\
    \ 3-12 展示了一个客户表和一个地理表。\n\n![9781430264453_Fig03-12.jpg](img/9781430264453_Fig03-12.jpg)\n\
    \n图 3-12. 组合客户和客户位置数据\n\n你可以使用以下查询将它们组合成一个客户维度表。\n\n```\nSELECT  c.CustomerKey,\
    \ c.BirthDate, c.MaritalStatus, c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome,\
    \ c.EnglishOccupation,\n        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n\
    \        g.City, g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\n\
    FROM    Customer AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
    ```\n\n虽然你不必成为查询专家也能将数据导入 `Power Pivot` 模型，但了解查询数据源的基础知识非常有益，即使这仅仅有助于你在与数据库开发人员沟通时提出正确的问题。\n\
    \n## 创建链接表\n\n关于 `Power Pivot` 模型中所包含数据，需要记住的一点是它是只读的。这大多数情况下是件好事。你希望确保数据只在源系统中被更改。然而，有时作为数据分析的一部分，你可能想要即时进行调整，并查看其对结果的影响。一个相当常见的例子是*桶分析*。例如，假设你想通过离散桶（区间）来查看像年龄这样的连续度量值，并且在分析过程中需要调整区间范围。这正是链接表的用武之地。\n\
    \n要创建链接表，首先在 Excel 工作表中设置该表。输入数据后，将其选中并单击快速分析菜单（参见图 3-13）。在 `表格` 选项卡下，单击 `表` 按钮。\n\
    \n![9781430264453_Fig03-13.jpg](img/9781430264453_Fig03-13.jpg)\n\n图 3-13. 创建\
    \ Excel 表格\n\n创建表格后，最好在将其导入 `Power Pivot` 数据模型之前为其命名。你可以通过选择表格，然后在 `表工具 设计` 弹出窗口的\
    \ `表格` 选项卡下输入表格名称来实现（参见图 3-14）。\n\n![9781430264453_Fig03-14.jpg](img/9781430264453_Fig03-14.jpg)\n\
    \n图 3-14. 重命名 Excel 表格\n\n命名表格后，将其选中，然后在 `Power Pivot` 选项卡上选择 `添加到数据模型`（参见图 3-15）。\n\
    \n![9781430264453_Fig03-15.jpg](img/9781430264453_Fig03-15.jpg)\n\n图 3-15. 将表格添加到模型\n\
    \n将表格导入模型后，如果你在 Excel 工作表中更改了一些表格值，并在 `PowerPivot` 选项卡上选择 `全部更新`（参见图 3-15），模型中的链接表格将使用新值进行更新。\n\
    \n## 创建层次结构\n"
- fmt: 'When analyzing data it is often helpful to use hierarchies to define various
    levels of aggregations. For example, it is common to have a calendar-based hierarchy
    based on year, quarter, and month levels. An aggregate like sales amount is then
    rolled up from month to quarter to year. Another common hierarchy might be from
    department to building to region. You could then roll cost up through the different
    levels. Creating hierarchies in a Power Pivot model is very easy. In the diagram
    view of the Model Designer select the table that has the attributes (columns)
    you want in the hierarchy. You will then see a `Create Hierarchy` button in the
    upper right corner of the table (see [Figure 3-16](#9781430264453_Ch03.xhtml#Fig16)).
    Click on the button to add the hierarchy and rename it. You can then drag and
    drop the fields onto the hierarchy to create the different levels. Make sure you
    arrange the fields so that they go from a higher level down to a lower level.


    ![9781430264453_Fig03-16.jpg](Images/9781430264453_Fig03-16.jpg)


    [Figure 3-16](#9781430264453_Ch03.xhtml#_Fig16). Creating a hierarchy


    Creating hierarchies is one way to increase the usability of your model and help
    users instinctively gain more value in their data analysis. In the next section
    you will see some other things you can do to the model to increase its usability.


    ## Making a User-Friendly Model


    As you are creating your model one thing to keep in mind is making the model easy
    and intuitive to use. Chances are that the model may get used by others for analysis.
    The model may also be used for a wide variety of client reporting and analysis
    tools such as Power View, Power Map, and Reporting Services. There are properties
    and settings you can use that allow these client tools to gain more functionality
    from the model.


    One of the most effective adjustments you can make is to rename the tables and
    columns. Use names that make sense for business users and not the cryptic naming
    convention that only makes sense to the database developers. Another good practice
    is to make sure the data types and formats of the columns are set correctly. A
    field from a text file may come in typed as a string when in reality it is numeric
    data. In addition you can hide fields that are of no use to the user, such as
    the surrogate keys used for linking the tables.


    A common requirement is to change the sort order of a column from its natural
    sorting. The most common example is the months of the year. Since they are text
    by default, they are sorted alphabetically. In reality you want them sorted by
    month number. To fix this, you can sort one column by any other column in the
    table (see [Figure 3-17](#9781430264453_Ch03.xhtml#Fig17)). This is a nice feature
    and allows you to create your own business-related custom sorting.


    ![9781430264453_Fig03-17.jpg](Images/9781430264453_Fig03-17.jpg)


    [Figure 3-17](#9781430264453_Ch03.xhtml#_Fig17). Sorting one column by another
    column


    You can use some other settings to create good models for the various client tools.
    You will revisit this topic in more detail in [Chapter 10](../Text/9781430264453_Ch10.xhtml),
    “Optimizing Tabular Models for Power View.”


    The following hands-on lab will help you solidify the topics covered in this chapter.


    ## Hands-On Lab—Creating a Data Model in Power Pivot


    In the following lab you will


    * Create table relations.

    * Denormalize data.

    * Create a linked table.

    * Set up a hierarchy.

    * Make a user-friendly model.


    1. Open Excel 2013 and create a new file called `LabChapter3.xlsx`.

    2. Using the Table Import Wizard in the Power Pivot data model, connect to the
    `Adventureworks.accdb` file in the `LabStarters` folder.

    3. Select the tables and fields listed and import the data.


    | Source Table Name | Friendly Name | Fields |

    | --- | --- | --- |

    | `DimDate` | Date | `DateKeyFullDateAlternateKeyEnglishMonthNameMonthNumberOfYearCalendarQuarterCalendarYear`
    |

    | `DimCustomer` | Customer | `CustomerKeyBirthDateMaritalStatusGenderYearlyIncomeTotalChildrenHouseOwnerNumberOfCars`
    |

    | `FactInternetSales` | Internet Sales | `ProductKeyOrderDateKeyShipDateKeyCustomerKeySalesTerritoryKeySalesOrderNumberSalesOrderLineNumberOrderQuantityUnitPriceTotalProductCostSalesAmount`
    |


    4. In the data view mode of the Power Pivot Model Designer, rename and hide the
    columns indicated in the table. To hide a column, right click on it and select
    `Hide From Client Tools` in the context menu.


    ![Table3b](Images/Table3b.jpg)


    5. Switch the Power Pivot window to diagram view. You should see the `Date`, `Customer`,
    and `Internet Sales` tables. The `Customer` table and the `Internet Sales` table
    have a relationship defined between them. This was discovered by the Table Import
    Wizard.

    6. Drag the `DateKey` from the `Date` table and drop it on the `OrderDateKey`
    in the `Internet Sales` table. Similarly, create a relationship between the `DateKey`
    and the `ShipDateKey`. Double click on this relationship to launch the `Edit Relationship`
    window (see [Figure 3-18](#9781430264453_Ch03.xhtml#Fig18)). Try to make this
    an active relationship. You should get an error because you can only have one
    active relationship between two tables in the model.


    ![9781430264453_Fig03-18.jpg](Images/9781430264453_Fig03-18.jpg)


    [Figure 3-18](#9781430264453_Ch03.xhtml#_Fig18). Creating the table relationship


    7. On the `Home` tab of the Power Pivot Model Designer window, click the `Existing
    Connections` button. You should see the connection to the `Adventureworks.acdb`
    created earlier. Open this connection and select the query option for importing
    the data.

    8. In the `Specify A SQL Query` window, change the query friendly name to `Product`
    and click the `Design` button.

    9. In the designer click the `Import` button. Open the `ProductQuery.txt` file
    in the lab starter folder. Click the red exclamation mark (`!`) to run the query
    (see [Figure 3-19](#9781430264453_Ch03.xhtml#Fig19)). This query combines data
    (i.e., denormalizes) from the `Product`, `ProductCategory`, and `ProductSubcategory`
    tables.


    ![9781430264453_Fig03-19.jpg](Images/9781430264453_Fig03-19.jpg)


    [Figure 3-19](#9781430264453_Ch03.xhtml#_Fig19). Running the query


    10. After verifying that you are getting data, click the `OK` button and the `Finish`
    button on the next screen.

    11. After importing the data, hide the `ProductKey` and update the column names
    as follows:


    ![Table3c](Images/Table3c.jpg)


    12. Create a relationship between the `Internet Sales` and the `Product` tables
    using the `ProductKey`. Your final diagram should look like [Figure 3-20](#9781430264453_Ch03.xhtml#Fig20).


    ![9781430264453_Fig03-20.jpg](Images/9781430264453_Fig03-20.jpg)


    [Figure 3-20](#9781430264453_Ch03.xhtml#_Fig20). Viewing the data model relationships


    13. To create a linked table, enter the data shown in [Figure 3-21](#9781430264453_Ch03.xhtml#Fig21)
    into an empty spread sheet tab in Excel.


    ![9781430264453_Fig03-21.jpg](Images/9781430264453_Fig03-21.jpg)


    [Figure 3-21](#9781430264453_Ch03.xhtml#_Fig21). The linked table data


    14. Select the cells, right click, and in the Quick Analysis context menu, select
    the `Table` tab and click the `Table` button (see [Figure 3-22](#9781430264453_Ch03.xhtml#Fig22)).
    In the Table Tools Design tab, rename the table `SalesTerritory`.


    ![9781430264453_Fig03-22.jpg](Images/9781430264453_Fig03-22.jpg)


    [Figure 3-22](#9781430264453_Ch03.xhtml#_Fig22). The Quick Analysis Tables tab'
  raw: "When analyzing data it is often helpful to use hierarchies to define various\
    \ levels of aggregations. For example, it is common to have a calendar-based hierarchy\
    \ based on year, quarter, and month levels. An aggregate like sales amount is\
    \ then rolled up from month to quarter to year. Another common hierarchy might\
    \ be from department to building to region. You could then roll cost up through\
    \ the different levels. Creating hierarchies in a Power Pivot model is very easy.\
    \ In the diagram view of the Model Designer select the table that has the attributes\
    \ (columns) you want in the hierarchy. You will then see a Create Hierarchy button\
    \ in the upper right corner of the table (see [Figure 3-16](#9781430264453_Ch03.xhtml#Fig16)).\
    \ Click on the button to add the hierarchy and rename it. You can then drag and\
    \ drop the fields onto the hierarchy to create the different levels. Make sure\
    \ you arrange the fields so that they go from a higher level down to a lower level.\n\
    \n![9781430264453_Fig03-16.jpg](Images/9781430264453_Fig03-16.jpg)\n\n[Figure\
    \ 3-16](#9781430264453_Ch03.xhtml#_Fig16). Creating a hierarchy\n\nCreating hierarchies\
    \ is one way to increase the usability of your model and help users instinctively\
    \ gain more value in their data analysis. In the next section you will see some\
    \ other things you can do to the model to increase its usability.\n\nMaking a\
    \ User-Friendly Model\n\nAs you are creating your model one thing to keep in mind\
    \ is making the model easy and intuitive to use. Chances are that the model may\
    \ get used by others for analysis. The model may also be used for a wide variety\
    \ of client reporting and analysis tools such as Power View, Power Map, and Reporting\
    \ Services. There are properties and settings you can use that allow these client\
    \ tools to gain more functionality from the model.\n\nOne of the most effective\
    \ adjustments you can make is to rename the tables and columns. Use names that\
    \ make sense for business users and not the cryptic naming convention that only\
    \ makes sense to the database developers. Another good practice is to make sure\
    \ the data types and formats of the columns are set correctly. A field from a\
    \ text file may come in typed as a string when in reality it is numeric data.\
    \ In addition you can hide fields that are of no use to the user, such as the\
    \ surrogate keys used for linking the tables.\n\nA common requirement is to change\
    \ the sort order of a column from its natural sorting. The most common example\
    \ is the months of the year. Since they are text by default, they are sorted alphabetically.\
    \ In reality you want them sorted by month number. To fix this, you can sort one\
    \ column by any other column in the table (see [Figure 3-17](#9781430264453_Ch03.xhtml#Fig17)).\
    \ This is a nice feature and allows you to create your own business-related custom\
    \ sorting.\n\n![9781430264453_Fig03-17.jpg](Images/9781430264453_Fig03-17.jpg)\n\
    \n[Figure 3-17](#9781430264453_Ch03.xhtml#_Fig17). Sorting one column by another\
    \ column\n\nYou can use some other settings to create good models for the various\
    \ client tools. You will revisit this topic in more detail in [Chapter 10](../Text/9781430264453_Ch10.xhtml),\
    \ “Optimizing Tabular Models for Power View.”\n\nThe following hands-on lab will\
    \ help you solidify the topics covered in this chapter.\n\n**HANDS-ON LAB—CREATING\
    \ A DATA MODEL IN** **POWER PIVOT**\n\nIn the following lab you will\n\n*   Create\
    \ table relations.\n*   Denormalize data.\n*   Create a linked table.\n*   Set\
    \ up a hierarchy.\n*   Make a user-friendly model.\n\n1.  Open Excel 2013 and\
    \ create a new file called `LabChapter3.xlsx`.\n2.  Using the Table Import Wizard\
    \ in the Power Pivot data model, connect to the `Adventureworks.accdb` file in\
    \ the LabStarters folder.\n3.  Select the tables and fields listed and import\
    \ the data.\n\n| Source Table Name | Friendly Name | Fields |\n    | --- | ---\
    \ | --- |\n    | DimDate | Date | DateKeyFullDateAlternateKeyEnglishMonthNameMonthNumberOfYearCalendarQuarterCalendarYear\
    \ |\n    | DimCustomer | Customer | CustomerKeyBirthDateMaritalStatusGenderYearlyIncomeTotalChildrenHouseOwnerNumberOfCars\
    \ |\n    | FactInternetSales | Internet Sales | ProductKeyOrderDateKeyShipDateKeyCustomerKeySalesTerritoryKeySalesOrderNumberSalesOrderLineNumberOrderQuantityUnitPriceTotalProductCostSalesAmount\
    \ |\n\n4.  In the data view mode of the Power Pivot Model Designer, rename and\
    \ hide the columns indicated in the table. To hide a column, right click on it\
    \ and select Hide From Client Tools in the context menu.\n\n![Table3b](Images/Table3b.jpg)\n\
    \n5.  Switch the Power Pivot window to diagram view. You should see the Date,\
    \ Customer, and Internet Sales. The Customer table and the Internet Sales table\
    \ have a relationship defined between them. This was discovered by the Table Import\
    \ Wizard.\n6.  Drag the DateKey from the Date table and drop it on the OrderDateKey\
    \ in the Internet Sales table. Similarly, create a relationship between the DateKey\
    \ and the ShipDateKey. Double click on this relationship to launch the Edit Relationship\
    \ window (see [Figure 3-18](#9781430264453_Ch03.xhtml#Fig18)). Try to make this\
    \ an active relationship. You should get an error because you can only have one\
    \ active relationship between two tables in the model.\n\n![9781430264453_Fig03-18.jpg](Images/9781430264453_Fig03-18.jpg)\n\
    \n[Figure 3-18](#9781430264453_Ch03.xhtml#_Fig18). Creating the table relationship\n\
    \n7.  On the Home tab of the Power Pivot Model Designer window, click the Existing\
    \ Connections button. You should see the connection to the Adventureworks.acdb\
    \ created earlier. Open this connection and select the query option for importing\
    \ the data.\n8.  In the Specify A SQL Query window, change the query friendly\
    \ name to Product and click the Design button.\n9.  In the designer click the\
    \ Import button. Open the `ProductQuery.txt` file in the lab starter folder. Click\
    \ the red exclamation mark (!) to run the query (see [Figure 3-19](#9781430264453_Ch03.xhtml#Fig19)).\
    \ This query combines data (i.e., denormalizes) from the Product, ProductCategory,\
    \ and ProductSubcategory tables.\n\n![9781430264453_Fig03-19.jpg](Images/9781430264453_Fig03-19.jpg)\n\
    \n[Figure 3-19](#9781430264453_Ch03.xhtml#_Fig19). Running the query\n\n10.  After\
    \ verifying that you are getting data, click the OK button and the Finish button\
    \ on the next screen.\n11.  After importing the data, hide the ProductKey and\
    \ update the column names as follows:\n\n![Table3c](Images/Table3c.jpg)\n\n12.\
    \  Create a relationship between the Internet Sales and the Product tables using\
    \ the ProductKey. Your final diagram should look like [Figure 3-20](#9781430264453_Ch03.xhtml#Fig20).\n\
    \n![9781430264453_Fig03-20.jpg](Images/9781430264453_Fig03-20.jpg)\n\n[Figure\
    \ 3-20](#9781430264453_Ch03.xhtml#_Fig20). Viewing the data model relationships\n\
    \n13.  To create a linked table, enter the data shown in [Figure 3-21](#9781430264453_Ch03.xhtml#Fig21)\
    \ into an empty spread sheet tab in Excel.\n\n![9781430264453_Fig03-21.jpg](Images/9781430264453_Fig03-21.jpg)\n\
    \n[Figure 3-21](#9781430264453_Ch03.xhtml#_Fig21). The linked table data\n\n14.\
    \  Select the cells, right click, and in the Quick Analysis context menu, select\
    \ the Table tab and click the Table button (see [Figure 3-22](#9781430264453_Ch03.xhtml#Fig22)).\
    \ In the Table Tools Design tab, rename the table SalesTerritory.\n\n![9781430264453_Fig03-22.jpg](Images/9781430264453_Fig03-22.jpg)\n\
