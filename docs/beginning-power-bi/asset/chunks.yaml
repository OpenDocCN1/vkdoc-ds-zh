    ## About the Author


    ![9781430264453_unFM-01.jpg](Images/9781430264453_unFM-01.jpg)


    **Dan Clark** is a senior business intelligence (BI)/programming consultant specializing
    in Microsoft technologies. He is focused on learning new BI/data technologies
    and on training others how to best implement the technology. Dan has published
    several books and numerous articles on .NET programming and BI development. He
    is a regular speaker at various developer/database conferences and user group
    meetings and enjoys interacting with the Microsoft developer and database communities.
    In a previous life, he was a physics teacher; he is still inspired by the wonder
    and awe of studying the universe and figuring out why things behave the way they
    do. Dan can be reached at `Clark.drc@gmail.com`.


    ## About the Technical Reviewers


    ![9781430264453_unFM-02.jpg](Images/9781430264453_unFM-02.jpg)


    **Melissa Demsak** is a data professional with an extensive corporate data career
    leading data teams and working as the liaison between business and technical organizations.
    She is experienced with a broad range of verticals including pharmaceutical, real
    estate, finance, consumer products, credit/marketing services, and insurance organizations.
    Her interests include driving business goals with data, data strategies, leading
    data analytic teams, data insights, and data visualization. Her perfect work day
    includes analyzing raw data and working with business partners and IT professionals
    to provide data insights that impact business value. You can contact Melissa via
    LinkedIn at `https://www.linkedin.com/in/sqldiva` and via Twitter `@SQLDiva`.


    **Jen Underwood** has almost 20 years of experience in data warehousing, business
    intelligence, and predictive analytics. She advises, develops, reviews technical
    solutions, and performs industry analysis. Prior to launching Impact Analytix,
    she was a Microsoft global business intelligence technical product manager for
    offerings spanning across Microsoft SQL Server, Excel, and SharePoint. She also
    held roles as an enterprise data platform specialist, a tableau technology evangelist,
    and a business intelligence consultant for Big 4 systems integration firms. Throughout
    most of her career, she has been researching, designing, and implementing analytic
    solutions across a variety of open source, niche, and enterprise vendor landscapes
    including Microsoft, Oracle, IBM, and SAP.


    As an industry analyst, presenter, author, blogger, and trainer, Jen is quite
    active in the global technical community. Recently she was honored with a Boulder
    Business Intelligence Brain Trust (BBBT) membership, a 2013 Tableau Zen Master
    award, a PASS Worldwide Excel BI Chapter leadership role, and a Dun & Bradstreet
    MVP. She writes articles for *SQL Server Pro*, BeyeNETWORK, and other industry
    media channels.


    Jen holds a bachelor of business administration degree from the University of
    Wisconsin, Milwaukee, and a post graduate certificate in computer science—data
    mining from the University of California, San Diego.


    ## Acknowledgments


    Once again, thanks to the team at Apress for making the writing of this book an
    enjoyable experience. A special thanks goes out to Gwenan and Christine for helping
    to guide me through this process. And last but not least, to my technical reviewers,
    Melissa and Jen—thank you for your attention to detail and excellent suggestions
    while reviewing this book.


    —Dan Clark


    ## Introduction


    Self-service business intelligence (BI) is all the rage. You have heard the hype,
    seen the sales demos, and are ready to give it a try. Now what? If you are like
    me, you have probably already checked out a few web sites for examples, given
    them a try, and learned a thing or two. But you are still left wondering how all
    these tools fit together and how you go about creating a complete solution, right?
    If so, this book is for you. It takes you step by step through the process of
    analyzing data using the various tools that are at the core of Microsoft’s self-service
    BI offering.


    At the center of Microsoft’s self-service BI offering is `Power Pivot`. I will
    show you how to create robust, scalable data models using `Power Pivot`; these
    will serve as the foundation of your data analysis. Since `Power Pivot` is the
    core tool you will use to create self-service BI solutions, it is covered extensively
    in this book. Next up is `Power View`. I will show you how to use `Power View`
    to easily build interactive visualizations that allow you to explore your data
    to discover trends and gain insight. In addition, I will show you how `Power Pivot`
    allows you to create a data model that will take full advantage of the features
    available in `Power View`.'
