- fmt: '# When the Analyze Key Influencers Tool Analyzes Data


    When the `Analyze Key Influencers` tool analyzes the data, it first stores key
    information about the distribution of your data. Next, it creates a model using
    the Microsoft Naïve Bayes algorithm and SSAS. Then it creates predictions that
    correlate each column of data with the specified outcome. Finally, it uses the
    confidence score for each of the predictions to identify the factors that are
    the most influential in producing the targeted outcome.


    After it finishes its analysis, the `Analyze Key Influencers` tool creates a report
    on a new worksheet that lists the key influencers ordered by confidence scores
    (see [Figure 13-8](#9781430264453_Ch13.xhtml#Fig8)).


    ![9781430264453_Fig13-08.jpg](Images/9781430264453_Fig13-08.jpg)


    [Figure 13-8](#9781430264453_Ch13.xhtml#_Fig8). Results of a key influencer analysis


    As you can see from the report, clearly the number of cars has an influence on
    bike buying.


    Along with determining what factors influence the bike buyers, you may want to
    see what types of customers you are appealing to. What are the predominate groups?
    Are they young? Do they own a home? In the next section, you will look at using
    the `Detect Categories` tool and clustering to answer these questions.


    ## Identifying Data Groups


    Detecting different categories that your data falls into is an important analysis
    you perform on the data. This can be useful for many different scenarios; for
    example, you need to know what groups your customers fall into so that you can
    target your marketing for the different groups. Another reason to take a close
    look at categories is so you can determine outliers that do not fit in any group.
    This way, if you need to, you can filter out the outliers from your data set so
    they do not skew your results. Finding outliers is also a common pattern for detecting
    possible fraud.


    To identify the various market segments of customers buying bikes, first select
    a table that contains customer demographics and a column that indicates if they
    purchased a bike. In the Table Tools Analyze tab select the `Detect Categories`
    tool. This launches a window where you select the fields to use and how many categories
    to create (see [Figure 13-9](#9781430264453_Ch13.xhtml#Fig9)). Do not select columns
    that have distinct values, such as ID fields, because these are not appropriate
    for grouping analysis.


    ![9781430264453_Fig13-09.jpg](Images/9781430264453_Fig13-09.jpg)


    [Figure 13-9](#9781430264453_Ch13.xhtml#_Fig9). Selecting the group attribute
    fields


    Once you run the `Detect Categories` tool, the data is analyzed using a cluster
    analysis algorithm. You can have the tool append a `Category` field to the data
    table. After the tool is finished, you will see a new worksheet displaying the
    results. On the worksheet is a graph that shows the population of each category
    for the chosen field (see [Figure 13-10](#9781430264453_Ch13.xhtml#Fig10)). Since
    you are interested in categories for customers who purchased bikes, you should
    set the column of the graph to that field.


    ![9781430264453_Fig13-10.jpg](Images/9781430264453_Fig13-10.jpg)


    [Figure 13-10](#9781430264453_Ch13.xhtml#_Fig10). Viewing the population graph


    As you can see, the customer segments associated with Categories 4, 5, and 6 are
    most likely to be bike buyers.


    On this same worksheet is a table you can use to investigate the attributes of
    the rows that make up the various groups. [Figure 13-11](#9781430264453_Ch13.xhtml#Fig11)
    shows the characteristics that make up Category 6. As you can see, the majority
    of the group has no children, earned a bachelor’s degree, and is in the 37-46
    age group.


    ![9781430264453_Fig13-11.jpg](Images/9781430264453_Fig13-11.jpg)


    [Figure 13-11](#9781430264453_Ch13.xhtml#_Fig11). Reviewing group characteristics


    Along with the `Detect Categories` tool, the `Highlight Exceptions` tool also
    performs a clustering algorithm on the data. In this case, it is looking for data
    that does not fit in with the rest of the data. This information comes in handy
    when you need to clean up a data set before you perform some of the other analyses
    on the data. Remember, any time you perform data analysis on a set of data, you
    need to ensure that any outliers do not skew your results.


    When you run the `Highlight Exceptions` tool, you are presented with a window
    in which to select the columns you want to analyze (see [Figure 13-12](#9781430264453_Ch13.xhtml#Fig12)).


    ![9781430264453_Fig13-12.jpg](Images/9781430264453_Fig13-12.jpg)


    [Figure 13-12](#9781430264453_Ch13.xhtml#_Fig12). Selecting columns for analysis


    After you run the tool, you are presented with a results table that shows the
    number of outliers found. You can also adjust the threshold to pick up more or
    fewer exceptions (see [Figure 13-13](#9781430264453_Ch13.xhtml#Fig13)).


    ![9781430264453_Fig13-13.jpg](Images/9781430264453_Fig13-13.jpg)


    [Figure 13-13](#9781430264453_Ch13.xhtml#_Fig13). Results of outlier analysis


    Take a look at the original data table; the outliers are now highlighted so you
    can easily identify them (see [Figure 13-14](#9781430264453_Ch13.xhtml#Fig14)).


    ![9781430264453_Fig13-14.jpg](Images/9781430264453_Fig13-14.jpg)


    [Figure 13-14](#9781430264453_Ch13.xhtml#_Fig14). Highlighting the outlier rows
    found


    One area of data mining that is becoming increasingly important when you are trying
    to run an efficient business and reduce overhead is forecasting. You will look
    at this next.


    ## Forecasting Future Trends


    The `Forecast` tool allows you to predict future trends by looking at past trends.
    It uses a time series algorithm to predict future values. Running the tool opens
    a window where you choose the columns to predict, the time series column, and
    the number of time periods to predict (see [Figure 13-15](#9781430264453_Ch13.xhtml#Fig15)).


    ![9781430264453_Fig13-15.jpg](Images/9781430264453_Fig13-15.jpg)


    [Figure 13-15](#9781430264453_Ch13.xhtml#_Fig15). Choosing the forecast parameters


    When the tool finishes running, the predicted values are placed at the end of
    the historical data and highlighted for review (see [Figure 13-16](#9781430264453_Ch13.xhtml#Fig16)).


    ![9781430264453_Fig13-16.jpg](Images/9781430264453_Fig13-16.jpg)


    [Figure 13-16](#9781430264453_Ch13.xhtml#_Fig16). Viewing the results of the forecast
    analysis


    In addition, a new worksheet is inserted that shows a linear graph of historical
    trends and future predictions. The historical values are plotted using a solid
    line and the future predictions are graphed with a dashed line (see [Figure 13-17](#9781430264453_Ch13.xhtml#Fig17)).


    ![9781430264453_Fig13-17.jpg](Images/9781430264453_Fig13-17.jpg)


    [Figure 13-17](#9781430264453_Ch13.xhtml#_Fig17). The graphical representation
    of future trends


    Along with forecasting, another popular type of data mining is shopping basket
    analysis. You will look at this next.


    ## Using Shopping Basket Analysis


    The `Shopping Basket Analysis` tool uses the Association algorithm to find associations
    between the data. Traditionally this has been used to analyze customers’ purchasing
    patterns and is useful when making recommendations for upselling other items.
    When you analyze data using the `Shopping Basket Analysis` tool, make sure the
    data has a key that organizes it into groupings—for example, an order number (see
    [Figure 13-18](#9781430264453_Ch13.xhtml#Fig18)).


    ![9781430264453_Fig13-18.jpg](Images/9781430264453_Fig13-18.jpg)


    [Figure 13-18](#9781430264453_Ch13.xhtml#_Fig18). The order number is used to
    group transactions


    When you select the `Shopping Basket Analysis` tool, you are presented with a
    Column Selection window where you select the `Transaction ID`, `Item`, and `Item
    Value` columns (see [Figure 13-19](#9781430264453_Ch13.xhtml#Fig19)).


    ![9781430264453_Fig13-19.jpg](Images/9781430264453_Fig13-19.jpg)'
