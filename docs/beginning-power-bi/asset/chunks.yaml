    Summary


    This chapter provided you with some use cases to help you gauge your mastery of
    the topics in the rest of the book. The goal of this book was to expose you to
    the various tools in Microsoft’s self-service BI stack. Although this book used
    the desktop version of Excel and the BI add-ins, you can also use the Office 365
    versions of these tools. I hope you have gained enough confidence and experience
    with these tools to start using them to analyze and gain insight into your own
    data.


    Now that you have a firm understanding of how to use these tools you should be
    comfortable tackling more complex topics. There are many good resources available
    that cover various techniques and patterns that can be used to analyze your data.
    Microsoft’s Power BI site (`www.microsoft.com/en-us/powerbi/default.aspx`), Bill
    Jelen’s site (`www.mrexcel.com`), and Rob Collie’s Power Pivot Pro site (`www.powerpivotpro.com`)
    are excellent resources. For more advanced topics, check out Chris Webb’s BI Blog
    at `http://cwebbbi.wordpress.com` and Marco Russo’s and Alberto Ferrari’s SQLBI
    site at `www.sqlbi.com/`.


