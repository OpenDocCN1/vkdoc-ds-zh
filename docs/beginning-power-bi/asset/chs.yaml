  27. 完成后，打开 Power Pivot 模型，验证表已添加至模型中。\n\n#### 总结\n\nPower Query 是一个非常实用的工具，可用于从多种不同类型的数据源获取数据。在本章中，您学习了如何使用\
  \ Power Query 通过直观的界面来整理、清理和转换数据，而无需编写代码。Power Query 会为您生成代码，但不会将其隐藏。如果您需要修改或增强代码，可以使用\
  \ `高级编辑器` 视图。尽管本章仅浅显地介绍了 M 查询语言，但随着您使用 Power Query 经验的积累，您可能会希望更深入地研究 M 编码语言。\n\n\
