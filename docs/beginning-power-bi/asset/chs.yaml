  \n26. 花些时间探索模型和数据透视表。（尽管尝试，甚至可以破坏它！）完成后，关闭文件。\n\n**本章小结**\n\n本章介绍了 Excel 的 Power\
  \ Pivot 加载项。你已初步了解为什么 Power Pivot 能够通过使用 xVelocity 引擎和列式数据存储来处理大量数据。你还接触并体验了 Power\
  \ Pivot 数据模型管理器。目前不必担心如何开发模型各个部分的细节。随着你对本书的深入学习，这些内容将得到详细解释。下一章开始，你将学习如何从各种数据源将数据导入模型。\n\
  \n### 第 2 章\n\n![image](img/frontdot.jpg)\n\n#### 将数据导入 Power Pivot\n\n创建 Power\
  \ Pivot 模型的首要步骤之一就是导入数据。传统上，在创建基于 OLAP 多维数据集的 BI 解决方案时，你需要先将数据导入数据仓库，再将其加载到多维数据集中。将数据整合到多维数据集并可供使用可能需要相当长的时间。而这是\
  \ Power Pivot 模型的最大优势之一。你可以轻松快速地将来自各种来源的数据合并到模型中。数据源可以来自关系数据库、文本文件、Web 服务和 OLAP\
  \ 多维数据集，仅举几例。本章将向你展示如何将来自这些来源的数据整合到 Power Pivot 模型中。\n\n完成本章学习后，你将能够：\n\n-   从关系数据库导入数据。\n\
  -   从文本文件导入数据。\n-   从数据馈送导入数据。\n-   从 OLAP 多维数据集导入数据。\n-   重用现有连接来更新模型。\n\n####\
  \ 从关系数据库导入数据\n\n你最常遇到的数据源类型之一是关系数据库。关系数据库管理系统（如 SQL Server、Oracle、DB2 和 Access）由表以及基于键的表之间的关系组成。例如，图\
  \ 2-1 显示了一个采购订单明细表和一个产品表。它们通过 `ProductID` 列相关联。这是一种一对多关系的示例。在产品表中的每一行，采购订单明细表中都有多行与之对应。表中的键被称为主键和外键。每个表都需要一个主键，用于唯一标识表中的一行。例如，`ProductID`\
  \ 是产品表中的主键。在采购订单明细表中，`ProductID` 被视为外键。外键指向相关表中的主键。请注意，主键可以由多个列组合而成；例如，采购订单明细表的主键是\
  \ `PurchaseOrderID` 和 `PurchaseOrderDetailID` 的组合。\n\n![9781430264453_Fig02-01.jpg](img/9781430264453_Fig02-01.jpg)\n\
  \n图 2-1. 一对多关系\n\n尽管一对多关系最为常见，但你还会遇到另一种相当普遍的关系类型——多对多关系。图 2-2 显示了一个多对多关系的示例。一个人可能有多个不同类型的电话号码。例如，他们可能有两个传真号码。你不能直接关联这些表。相反，你需要使用一个包含这些表主键的联结表。联结表中键的组合必须是唯一的。\n\
  \n![9781430264453_Fig02-02.jpg](img/9781430264453_Fig02-02.jpg)\n\n图 2-2. 多对多关系\n\
  \n请注意，联结表可以包含与关联相关的信息；例如，`PhoneNumber` 与客户和电话号码类型相关联。一个客户不能将同一个电话号码列为两种不同的类型。\n\n\
  从关系数据库获取数据的一个好处是，其模型与你在 Power Pivot 中创建的模型非常相似。事实上，如果在数据库中定义了关系，Power Pivot 导入向导可以检测到这些关系，并在模型中为你设置它们。\n\
  \n从关系数据库获取数据的第一步是创建连接。在模型设计器的**主页**选项卡上，有一个**获取外部数据**组（参见图 2-3）。\n\n![9781430264453_Fig02-03.jpg](img/9781430264453_Fig02-03.jpg)\n\
  \n图 2-3. 设置连接\n\n**从数据库**下拉列表允许你连接到 SQL Server、Access、Analysis Services 或另一个 Power\
  \ Pivot 模型。如果你单击**从其他源**按钮，可以查看所有可连接的各种数据源（参见图 2-4）。如你所见，你可以连接到相当多的关系数据库。如果所需连接的数据源未列出，你可以从数据库提供商处安装驱动程序来连接它。很有可能，你也可以使用通用的\
  \ ODBC（开放数据库连接）驱动程序来连接它。\n\n![9781430264453_Fig02-04.jpg](img/9781430264453_Fig02-04.jpg)\n\
  \n图 2-4. 选择数据源\n\n选择数据源后，系统会弹出一个窗口，供你输入连接信息。连接信息取决于你要连接的数据源。对于大多数关系数据库，所需的信息非常相似。图\
  \ 2-5 显示了连接到 SQL Server 的连接信息。记得单击**测试连接**按钮，以确保所有信息输入正确。\n\n![9781430264453_Fig02-05.jpg](img/9781430264453_Fig02-05.jpg)\n\
  \n图 2-5. 设置数据库连接\n\n设置好连接后，下一步是查询数据库以检索数据。此时你有两个选择：可以从表和视图列表中选择导入数据，也可以编写查询来导入数据（参见图\
  \ 2-6）。即使你选择从表或视图导入数据，系统也会在后台创建查询并将其发送到数据库以检索数据。\n\n![9781430264453_Fig02-06.jpg](img/9781430264453_Fig02-06.jpg)\n\
  \n图 2-6. 选择检索数据的方式\n\n如果你选择从表和视图列表中获取数据，则下一个屏幕会显示该列表。从你的角度来看，视图和表看起来是一样的。实际上，视图是数据库中存储的查询，它向你屏蔽了查询的复杂性。视图通常用于展示比实际物理模型更简单的数据库概念模型。例如，你可能需要客户的地址。图\
  \ 2-7 显示了获取该信息所需包含在查询中的表。无需编写复杂的查询来检索信息，你可以从一个将信息组合成虚拟的 `Customer Address` 表的视图中进行选择。视图的另一个常见用途是保护基础表中的列。通过使用视图，数据库管理员可以向不同用户隐藏某些列。\n\
  \n![9781430264453_Fig02-07.jpg](img/9781430264453_Fig02-07.jpg)\n\n图 2-7. 获取客户地址所需的表\n\
  \n好的，作为一名高级文档工程师和翻译员，我将严格遵循您给出的注意事项和示例，对提供的英文文本进行翻译。\n\n\n选择一个表并点击**预览并筛选**按钮（见图\
  \ 2-8），您可以预览表中的数据并筛选选定的数据。\n\n![9781430264453_Fig02-08.jpg](img/9781430264453_Fig02-08.jpg)\n\
  \n图 2-8. 选择表和视图\n\n在图 2-9 中，您可以看到预览和筛选界面。\n\n![9781430264453_Fig02-09.jpg](img/9781430264453_Fig02-09.jpg)\n\
  \n图 2-9. 预览和筛选数据\n\n筛选表的一种方法是仅选择您感兴趣的列。另一种方法是通过在列上放置筛选条件来限制行数。例如，您可能只需要某一年之后的销售数据。单击列旁边的下拉菜单，您可以输入一个筛选条件来限制行。图\
  \ 2-10 展示了按订单日期筛选 `SalesOrderHeader` 表的情景。\n\n![9781430264453_Fig02-10.jpg](img/9781430264453_Fig02-10.jpg)\n\
  \n图 2-10. 筛选行\n\n在处理大型数据集时，出于性能考虑，一个好的做法是只导入您感兴趣的数据。如果您只对少数几列感兴趣，那么导入表的所有列会产生大量开销。同样，如果您只关心过去三年的销售额，就不要导入整整\
  \ 20 年的销售数据。如果后续发现需要更多数据，您随时可以返回并更新数据导入。\n\n筛选完数据后，在**选择表和视图**屏幕上点击**完成**（见图 2-8）。此时，数据将被导入模型，您会看到一个显示进度的界面（见图\
  \ 2-11）。如果没有错误，您可以关闭**表导入向导**。\n\n![9781430264453_Fig02-11.jpg](img/9781430264453_Fig02-11.jpg)\n\
  \n图 2-11. 将数据导入模型\n\n当向导关闭后，您将在**模型设计器**的数据视图中看到这些数据。\n\n![Image](img/sq.jpg) **注意**\
  \  请记住，Power Pivot 仅在检索数据时连接到数据源。检索完成后，连接即关闭，数据成为模型的一部分。\n\n如果您切换到**模型设计器**的关系图视图，您将看到这些表；如果表关系已在数据库中定义，您还将看到表之间的关系。在图\
  \ 2-12 中，您可以看到产品表之间定义了关系，销售表之间也定义了关系，但在 `SalesOrderDetail` 表和 `Product` 表之间没有定义关系。即使数据源中没有定义，您也可以在模型中创建关系（稍后会详细介绍）。\n\
  \n![9781430264453_Fig02-12.jpg](img/9781430264453_Fig02-12.jpg)\n\n图 2-12. 数据源中定义的表关系\n\
  \n虽然从表和视图中选择数据是一种无需显式编写查询即可将数据导入模型的简便方法，但这并非总是可行。有时您可能需要编写自己的查询；例如，您可能想要合并来自多个不同表的数据，但又没有可用的视图。另一个影响因素是数据源支持什么。某些数据源不允许使用视图，可能需要您提供查询来提取数据。在这些情况下，当您进入询问如何检索数据的界面时，请选择查询选项（图\
  \ 2-6）。\n\n选择查询选项后，您将看到一个可以编写查询的界面（见图 2-13）。虽然您可能不会从头开始编写查询，但您可以在这里粘贴他人为您编写的查询，或者您在\
  \ Microsoft Management Studio 或 TOAD 等其他工具中创建的查询。别忘了为查询命名。它将作为模型中的一个表，并以该查询的名称命名。\n\
  \n![9781430264453_Fig02-13.jpg](img/9781430264453_Fig02-13.jpg)\n\n图 2-13. 创建您自己的查询\n\
  \n如果数据源支持，您可以点击查询输入窗口右下角，启动一个非常不错的查询设计器（见图 2-13）。此设计器（见图 2-14）允许您从各种表和视图中选择所需的列。如果数据库定义了表关系，它将自动添加表连接。您还可以应用筛选条件、对数据进行分组和聚合。查询设计器中一个令人困惑的方面是参数复选框。\n\
  \n![9781430264453_Fig02-14.jpg](img/9781430264453_Fig02-14.jpg)\n\n图 2-14. 使用查询设计器\n\
  \n![Image](img/sq.jpg) **注意**  Power Pivot 模型不支持参数，选中该复选框会导致您在尝试关闭查询设计器时收到错误消息。\n\
  \n完成查询设计后，您应该始终运行它以确保其按预期工作（见图 2-15）。\n\n![9781430264453_Fig02-15.jpg](img/9781430264453_Fig02-15.jpg)\n\
  \n图 2-15. 运行查询并查看结果\n\n对查询满意后，选择**确定**按钮将返回到之前的界面，其中已填入查询文本。您可以在此界面中修改查询，并使用**验证**按钮确保查询仍然有效（见图\
  \ 2-16）。点击**完成**会将数据和表导入模型。\n\n![9781430264453_Fig02-16.jpg](img/9781430264453_Fig02-16.jpg)\n\
  \n图 2-16. 查看和验证查询\n\n现在您已经知道如何从数据库导入数据，接下来让我们看看如何从文本文件向模型添加数据。\n\n#### 从文本文件导入数据\n\
  \n很多时候，您需要合并来自多个不同来源的数据。最常见的数据来源之一仍然是文本文件。这可能是从另一个系统接收数据作为输出的结果；例如，您可能需要来自公司 ERP（企业资源规划）系统的信息，这些信息以文本文件形式提供。您也可能通过第三方服务获取数据，这些数据以\
  \ CSV（逗号分隔值）格式提供。例如，您可能使用评级服务来对客户进行评级，结果可以以 CSV 文件形式返回。\n\n从文本文件将数据导入模型与从关系数据库表导入数据类似。首先，在**主页**菜单上选择从其他源获取外部数据的选项，这将会调出连接到数据源的选项。向下滚动到窗口底部，您可以选择从\
  \ Excel 文件或文本文件导入数据（见图 2-17）。\n\n![9781430264453_Fig02-17.jpg](img/9781430264453_Fig02-17.jpg)\n\
  \n图 2-17. 连接到文本文件\n\n选择文本文件将弹出一个界面，您可以在其中输入文件路径和文件分隔符。每个文本文件被视为一个表，友好的连接名称将是模型中该表的名称。提供连接信息后，数据将被加载以供预览和筛选（见图\
  \ 2-18）。\n\n![9781430264453_Fig02-18.jpg](img/9781430264453_Fig02-18.jpg)\n\n\n\n\
  #### 预览和筛选数据\n\n图 2-18 预览数据\n\n选择列标题旁的下拉菜单，可以根据筛选条件限制导入的行数（参见图 2-19）。\n\n![9781430264453_Fig02-19.jpg](img/9781430264453_Fig02-19.jpg)\n\
  \n图 2-19 筛选导入模型的行\n\n从文本文件导入数据与从 Excel 文件导入数据的主要区别在于，Excel 文件可能包含多个表格。默认情况下，每个工作表都会被视作一个表格（参见图\
  \ 2-20）。选中表格后，您可以像处理文本文件一样预览和筛选数据。\n\n![9781430264453_Fig02-20.jpg](img/9781430264453_Fig02-20.jpg)\n\
  \n图 2-20 在 Excel 文件中选择表格\n\n除了从文本文件导入数据，您可能还需要通过从数据源导入数据来补充数据模型。这正成为一种与业务伙伴交换数据的常见方式，接下来您将了解具体操作方法。\n\
  \n#### 从数据源导入数据\n\n尽管文本文件是最流行的数据交换方式之一，但数据源正逐渐成为一种越来越普遍的数据交换方式。数据源通过 Web 服务提供数据，要连接到该\
  \ Web 服务，需要输入其网址。在图 2-17 中，您可以看到可供使用的数据源连接。通常情况下，您会知道合作伙伴或数据提供商提供的数据服务地址。在这种情况下，您可以选择“其他数据源”，系统会弹出一个连接信息输入窗口，如图\
  \ 2-21 所示。\n\n![9781430264453_Fig02-21.jpg](img/9781430264453_Fig02-21.jpg)\n\n\
  图 2-21 连接到数据源\n\n由于数据源不仅包含数据，还包含元数据（数据的描述），因此一旦建立连接，Power Pivot 就会提供预览和筛选数据的功能，如图\
  \ 2-22 所示。\n\n![9781430264453_Fig02-22.jpg](img/9781430264453_Fig02-22.jpg)\n\n\
  图 2-22 预览和筛选来自数据源的数据\n\n您可以使用的几种有趣的数据源包括来自 Reporting Services 报表和 SharePoint 列表的数据。这些应用程序可以轻松地将其数据作为数据源供您使用。此外，许多数据库供应商（如\
  \ SAP）也支持将其数据作为数据源公开。\n\n#### 从 OLAP 多维数据集导入数据\n\n许多公司投入了大量资金和精力来构建企业级报表解决方案，其中包括一个企业级\
  \ OLAP 存储库，为各种仪表板和计分卡提供数据。使用 Power Pivot，您可以轻松集成来自这些存储库的数据。在连接窗口的连接选项（图 2-17）中，选择“多维服务”下的“Microsoft\
  \ SQL Server Analysis Services”连接。这将启动连接信息窗口，如图 2-23 所示。您可以连接到多维数据集，也可以连接到发布到 SharePoint\
  \ 的 Power Pivot 模型。要连接到多维数据集，请输入服务器名称和数据库名称。要连接到 Power Pivot 模型，请输入 Excel 工作簿（在\
  \ SharePoint 库中）的 URL 和模型名称。\n\n![9781430264453_Fig02-23.jpg](img/9781430264453_Fig02-23.jpg)\n\
  \n图 2-23 连接到 Analysis Services 多维数据集\n\n连接到多维数据集后，您可以输入 MDX 查询来检索数据（参见图 2-24）。请记得验证查询以确保其能够成功运行。\n\
  \n![9781430264453_Fig02-24.jpg](img/9781430264453_Fig02-24.jpg)\n\n图 2-24 输入 MDX\
  \ 查询\n\n如果您不熟悉 MDX，可以使用可视化设计器来创建查询，如图 2-25 所示。设计器的一大特色是能够预览结果。\n\n![9781430264453_Fig02-25.jpg](img/9781430264453_Fig02-25.jpg)\n\
  \n图 2-25 设计 MDX 查询\n\n完成查询设计后，它会进入图 2-24 所示的 MDX 语句框，在那里您可以完成数据导入。\n\n#### 重用现有连接以更新模型\n\
  \n在两种情况下您可能需要重用与数据源的现有连接。您可能需要从数据源检索更多数据；例如，您需要从其他表或视图中获取数据，或提交新的查询。此时，应选择“开始”选项卡上的“现有连接”按钮（参见图\
  \ 2-26）。\n\n![9781430264453_Fig02-26.jpg](img/9781430264453_Fig02-26.jpg)\n\n图 2-26\
  \ 选择现有连接\n\n在“现有连接”窗口中，选择连接并单击“打开”按钮（参见图 2-27）。这将启动之前介绍过的若干屏幕（具体取决于连接类型），在这些屏幕中您可以逐步选择要导入的数据。\n\
  \n![9781430264453_Fig02-27.jpg](img/9781430264453_Fig02-27.jpg)\n\n图 2-27 打开现有连接\n\
  \n另一种情况是，您想要更改模型中现有表的筛选条件或添加一些列。在这种情况下，您需要在设计器的“数据视图”模式下选择该表，然后在“设计”选项卡上选择“表属性”（参见图\
  \ 2-28）。\n\n![9781430264453_Fig02-28.jpg](img/9781430264453_Fig02-28.jpg)\n\n图 2-28\
  \ 选择表属性\n\n“编辑表属性”窗口允许您更新用于填充该表数据的查询。您可以在“表预览”模式（图 2-29）或“查询”模式（图 2-30）下更新表。在“查询编辑器”模式下，您还可以启动查询设计器来更新查询。\n\
  \n![9781430264453_Fig02-29.jpg](img/9781430264453_Fig02-29.jpg)\n\n图 2-29 在“表预览”模式中更新查询\n\
  \n![9781430264453_Fig02-30.jpg](img/9781430264453_Fig02-30.jpg)\n\n图 2-30 在“查询编辑器”模式中更新查询\n\
  \n现在您已经了解了如何将数据从各种数据源导入到 Power Pivot 数据模型，是时候动手实践一下数据导入了。\n\n#### 动手实验——将数据加载到 Power\
  \ Pivot\n\n在以下实验中，您将：\n\n*   从 Access 数据库导入数据。\n*   从文本文件导入数据。\n\n1.  打开 Excel 2013\
  \ 并创建一个名为 `LabChapter2.xlsx` 的新文件。\n2.  在 Power Pivot 选项卡上，单击“管理数据模型”按钮（参见图 2-31）。这将启动\
  \ Power Pivot 模型设计器窗口。\n\n    ![9781430264453_Fig02-31.jpg](img/9781430264453_Fig02-31.jpg)\n\
  \n    图 2-31 打开模型设计器窗口\n\n3.  在“开始”选项卡的“获取外部数据”组中，单击“从数据库”下拉菜单（参见图 2-32）。在下拉菜单中选择“从\
  \ Access 导入”。这将启动“表导入向导”。\n\n    ![9781430264453_Fig02-32.jpg](img/9781430264453_Fig02-32.jpg)\n\
  \n    图 2-32 启动表导入向导\n\n\n好的，作为高级文档工程师和翻译员，我将遵循注意事项和示例，将您提供的英文文本翻译成中文。\n\n---\n\n\
  \n4.  浏览 Lab Starters 文件夹中的 `Northwind.acdb` 数据库文件并测试连接。使用友好的连接名称 `Access Northwind`。此数据库不需要用户名和密码（参见图\
  \ 2-33）。单击“测试连接”进入下一个窗口。\n\n   ![9781430264453_Fig02-33.jpg](img/9781430264453_Fig02-33.jpg)\n\
  \n   图 2-33. 连接到 Access 数据库\n\n5.  导入数据有两个选项：可以从表列表和视图中选择，也可以编写查询来选择数据。这里选择“从表列表和视图中选择”。\n\
  6.  在“选择表和视图”窗口中，选择 `Customers` 并单击该行以高亮显示。在窗口底部，选择“预览和筛选”按钮来预览和筛选数据（参见图 2-34）。\n\
  \n   ![9781430264453_Fig02-34.jpg](img/9781430264453_Fig02-34.jpg)\n\n   图 2-34.\
  \ 选择要导入的表\n\n7.  在 `Customers` 表中，选择以下字段：`ID`、`Company`、`Last Name`、`First Name`、`City`、`State/Province`\
  \ 和 `Country/Region`。取消选中其余字段（参见图 2-35）。选中左上角的复选框将选择或取消选择所有列。\n\n   ![9781430264453_Fig02-35.jpg](img/9781430264453_Fig02-35.jpg)\n\
  \n   图 2-35. 筛选表列\n\n8.  从 `Employees` 表中选择以下字段：`ID`、`Last Name`、`First Name` 和\
  \ `Job Title`。\n9.  从 `Orders` 表中选择以下字段：`Order ID`、`Employee ID`、`Customer ID`、`Order\
  \ Date`、`Shipped Date`、`Shipper ID`、`Payment Type` 和 `Paid Date`。在 `Status ID` 列上，单击下拉菜单以筛选数据。取消勾选状态\
  \ `0` 和状态 `2`。状态 `3` 表示“已关闭”状态（参见图 2-36）。\n\n   ![9781430264453_Fig02-36.jpg](img/9781430264453_Fig02-36.jpg)\n\
  \n   图 2-36. 筛选表行\n\n10. 选择完表后，单击“完成”按钮导入数据。导入后，关闭向导。您应该会在“数据视图”窗口中看到每个表都作为一个选项卡显示（参见图\
  \ 2-37）。\n\n   ![9781430264453_Fig02-37.jpg](img/9781430264453_Fig02-37.jpg)\n\n\
  \   图 2-37. 数据视图窗口中的表\n\n11. 接下来，您将使用查询来选择订单详细信息。在 Power Pivot 模型设计器中，选择“开始”选项卡。在“开始”选项卡中，选择“现有连接”按钮。在连接窗口中，选择\
  \ `Access Northwind` 连接，然后单击“打开”。\n12. 这次，选择“编写查询以指定要导入的数据”。\n13. 在“指定查询”窗口中，将查询命名为\
  \ `OrderDetails`，然后选择“设计”按钮以启动查询设计器。（您也可以不使用设计器直接编写查询。）在查询设计器中，选择“导入”，然后选择 Lab Starters\
  \ 文件夹中的 `OrderDetailQuery.txt`。通过单击红色感叹号（`!`）标记来测试查询（参见图 2-38）。测试查询后，单击“确定”按钮。\n\
  \n   ![9781430264453_Fig02-38.jpg](img/9781430264453_Fig02-38.jpg)\n\n   图 2-38.\
  \ 使用查询获取数据\n\n14. 在“表导入向导”中，单击“完成”按钮导入数据。导入后，关闭向导。您应该会看到已添加了一个 `OrderDetail` 表选项卡。\n\
  15. 最后一个要导入的表包含在一个制表符分隔的文本文件中。在“开始”选项卡的“获取外部数据”部分，单击“其他来源”按钮。在数据源列表中，选择“文本文件”，然后单击“下一步”。\n\
  16. 在连接信息中，将连接名称更改为 `Product`。在“文件路径”中，浏览到 Lab Starters 文件夹中的 `ProductList.txt`\
  \ 文件。选择制表位列分隔符，并勾选“将第一行用作列标题”复选框。单击“完成”按钮导入数据（参见图 2-39）。\n\n   ![9781430264453_Fig02-39.jpg](img/9781430264453_Fig02-39.jpg)\n\
  \n   图 2-39. 从文本文件导入数据\n\n17. 导入后，关闭向导，您应该会看到已添加了一个 `Product` 表选项卡。\n18. 完成后，保存文件并关闭\
  \ Excel。\n\n#### 总结\n\n创建 Power Pivot 模型的第一步是导入数据。在本章中，您学习了如何从各种数据源导入数据。Power Pivot\
  \ 中导入数据的一个优点是，从不同数据源导入数据的体验是相似的。您需要创建连接、提供查询或选择表、预览和筛选数据，然后将其导入模型。现在您已将数据导入模型中的各个表，接下来需要在这些表之间建立关系。在下一章中，您将学习建立关系的重要性，以及如何使用层次结构来增强模型以辅助数据分析。\n\
  \n### 第 3 章\n\n![image](img/frontdot.jpg)\n\n#### 创建数据模型\n\n既然您已经知道如何将数据导入 Power\
  \ Pivot 模型，下一步就是理解什么是一个好的模型。这在处理 Power Pivot 中的数据时非常重要。一个好的模型将使 Power Pivot 运行得异常快速，并允许您以新颖且有趣的方式分析数据。而一个糟糕的模型会导致\
  \ Power Pivot 运行非常缓慢，最糟糕的是，在执行数据分析时可能会给出误导性的结果。传统的 Excel 数据透视表基于 Excel 工作表中的单个表。而\
  \ Power Pivot 数据透视表则基于数据模型中的多个表。本章将指导您创建稳健模型的过程，该模型将成为数据分析的基础。此外，您还将了解如何向客户端工具呈现一个用户友好的模型。这包括重命名表和字段、呈现适当的数据类型以及隐藏无关的字段。\n\
  \n完成本章后，您将能够：\n\n*   解释什么是数据模型\n*   在模型中的表之间创建关系\n*   创建并使用星型架构\n*   理解何时以及如何对数据进行反规范化\n\
  *   创建并使用链接表\n*   创建并使用层次结构\n*   创建用户友好的模型\n\n#### 什么是数据模型？\n\n从根本上说，数据模型由表、列、数据类型和表关系组成。通常，数据表被构造为保存某个业务实体的数据；例如，客户数据包含在客户表中，员工数据包含在员工表中。表由定义实体属性的列组成。例如，您可能希望保存有关客户的信息，例如姓名、地址、出生日期、家庭规模等。每个属性都有一个数据类型，具体取决于该属性保存的信息类型——姓名是字符串数据类型，家庭规模是整数，出生日期是日期。表中的每一行都应该是唯一的。以客户表为例，如果同一个客户出现在多个行中并具有不同的属性（例如出生日期），您将无法判断哪个是正确的。\n\
  \n\n\n#### 示例 1：使用时间戳跟踪变化\n\n在前面的示例中，您会知道其中一行是错误的，因为同一个人不可能有两个不同的生日。然而，很多时候您希望跟踪实体属性值的变化。例如，产品的标价可能会随时间变化。为了跟踪这种变化，您需要添加一个时间戳使该行唯一。这样，每行都可以通过产品编号和时间戳来标识，如图\
  \ 3-1 所示。\n\n![9781430264453_Fig03-01.jpg](img/9781430264453_Fig03-01.jpg)\n\n图\
  \ 3-1. 使用时间戳跟踪变化\n\n一旦确定了模型中的表，重要的是您要认识到这些表是否设置得当以高效执行。这个过程称为*规范化*模型。规范化是组织数据以使数据查询更简单、更高效的过程。例如，您不应将不相关实体的属性混合在同一张表中——您不会希望将产品数据和员工数据放在同一张表中。正确的规范化的另一个例子是不要在一个列中保存多个属性。例如，与其使用一个客户地址列，不如将其拆分为街道、城市、州和邮政编码。这样，您就可以轻松地按州或城市分析数据。如图\
  \ 3-2 所示的电子表格是一个典型的未规范化的表。如果您发现提供给您的数据规范化不足，您可能需要要求数据提供方将数据拆分为多个表，然后在您的模型中关联起来。\n\
  \n![9781430264453_Fig03-02.jpg](img/9781430264453_Fig03-02.jpg)\n\n图 3-2. 一个未规范化的表\n\
  \n当您对模型中表的规范化程度满意后，下一步是确定表之间的关系。例如，您需要关联客户表、销售表和产品表，以便按年龄段分析各产品的销售情况。您通过使用*键*来关联不同的表。表中的每一行需要一个列或列的组合来唯一标识该行。这称为*主键*。该键可能很容易识别，例如在数据录入时由业务分配的销售订单号或客户号。有时您需要对表进行一些分析以找到主键，尤其是当您从外部来源获取数据时。例如，您可能获得包含潜在客户的数据。字段包括姓名、城市、州、邮政编码、出生日期等。您不能仅仅使用姓名作为键，因为很可能有多个同名的客户。如果您使用姓名和城市的组合，那么使用相同键标识多个客户的可能性就会降低。随着您使用更多列，例如邮政编码和出生日期，出现重复的概率会更低。\n\
  \n当您在模型中关联表时，一个表的主键会成为关联表中的外键。例如，要将客户与其销售记录关联起来，客户键需要包含在销售表中，在那里它被视为外键。在提取数据时，使用键来获取相关数据。出于性能考虑，到目前为止最好的键类型是单列整数。因此，许多数据库表都设计有代理键。这个键是在加载记录时分配给该记录的整数。它不是使用自然键，而是使用代理键来连接表。图\
  \ 3-3 显示了一个典型的数据库表，其中同时包含代理键（`CustomerKey`）和自然键（`CustomerAlternateKey`）。\n\n![9781430264453_Fig03-03.jpg](img/9781430264453_Fig03-03.jpg)\n\
  \n图 3-3. 包含代理键和自然键的表\n\n重要的是您要了解数据源中使用的键。如果您能从源中检索出键，那会好得多。当您从关系型数据库中检索数据时，这通常不是问题，但如果您要合并来自不同系统的数据，请确保您有适当的键。\n\
  \n一旦确定了表之间的键，您就可以在 Power Pivot 模型中创建关系了。\n\n#### 创建表关系\n\n在 Power Pivot 模型中建立表关系时，需要记住一些规则。首先，您不能在模型中使用复合键。如果您的表使用复合键，您需要将复合列拼接在一起创建一个新列，并将该列用作键。其次，两个表之间只能有一个活动关系路径，但可以有多个非活动关系。第三，关系是一对多的；换句话说，在客户表（一端）和销售表（多端）之间创建关系是可以的。然而，不允许直接在客户表和产品表之间创建关系，因为一个客户可以购买多种产品，而同一产品可以被多个客户购买。在这些情况下，您需要创建一个连接表来连接这些表。\n\
  \n要在 Power Pivot 模型中创建两个表之间的关系，请打开数据模型管理器并切换到关系图视图。右键单击代表关系多端的表，然后选择**创建关系**。这将启动**创建关系**窗口。选择相关的查找表（一端）和键列。图\
  \ 3-4 展示了在销售表和商店表之间创建关系的过程。默认情况下，在表之间创建的第一个关系被标记为活动关系。\n\n![9781430264453_Fig03-04.jpg](img/9781430264453_Fig03-04.jpg)\n\
  \n图 3-4. 创建表关系\n\n图 3-5 展示了关系图视图中生成的关系。如果单击关系箭头，关系的两个键列会被高亮显示。\n\n![9781430264453_Fig03-05.jpg](img/9781430264453_Fig03-05.jpg)\n\
  \n图 3-5. 在关系图视图中查看关系\n\n您可以在两个表之间创建多个关系，但请记住，只有一个可以是活动关系。如果您尝试创建两个活动关系，将会收到类似图 3-6\
  \ 所示的错误。\n\n![9781430264453_Fig03-06.jpg](img/9781430264453_Fig03-06.jpg)\n\n图 3-6.\
  \ 试图在两个表之间创建第二个活动关系\n\n有时活动关系并不那么明显。图 3-7 展示了销售表和日期表之间的一个活动关系，以及销售表和商店表之间的另一个活动关系。商店表和日期表之间还有一条非活动关系。如果您尝试将此关系设置为活动，您将收到与图\
  \ 3-6 相同的错误消息。这是因为您可以从日期表追踪到销售表，再到商店表的一条活动路径。\n\n![9781430264453_Fig03-07.jpg](img/9781430264453_Fig03-07.jpg)\n\
  \n图 3-7. 一个间接的活动关系\n\n您可能遇到的另一个常见错误是，当您尝试在两个表之间创建关系时，键在至少一个表中不是唯一的。图 3-8 展示了一个产品表和一个销售表，两者都包含重复的`ProductNumber`。\n\
  \n![9781430264453_Fig03-08.jpg](img/9781430264453_Fig03-08.jpg)\n\n\n\n图 3-8. `Product`\
  \ 和 `Sales` 表\n\n当你尝试在这两个表之间创建关系时，会出现图 3-9 所示的错误。\n\n![9781430264453_Fig03-09.jpg](img/9781430264453_Fig03-09.jpg)\n\
  \n图 3-9. 出现重复值错误\n\n在这个示例中，`ProductNumber` 在 `Product` 表中本应是唯一的，但结果却存在重复值。为了解决这个问题，你需要修改\
  \ `Product` 表数据的查询，以确保不会获取到重复数据。\n\n现在你已经了解了如何在模型中创建表关系，接下来可以看看使用星型架构的好处了。\n\n####\
  \ 创建星型架构\n\n在创建数据模型时，理解模型的用途非常重要。数据库的两大主要用途是捕获数据和报告/分析数据。问题在于，当你为高效的数据捕获创建模型时，会降低其分析数据的效率。为了解决这个问题，许多公司将其数据捕获数据库与报告/分析数据库分离开来。幸运的是，在\
  \ `Power Pivot` 中创建数据模型时，我们只需针对报告进行优化即可。\n\n分析大量数据集时最佳模型之一是*星型架构*。星型架构由一个中心事实表和环绕其周围的维度表组成，如图\
  \ 3-10 所示。\n\n![9781430264453_Fig03-10.jpg](img/9781430264453_Fig03-10.jpg)\n\n\
  图 3-10. 典型的星型架构\n\n事实表包含与业务或流程相关的量化数据。例如，图 3-10 中的 `Sales` 表包含了销售的可度量方面，例如总成本、销售额和数量。事实表通常包含许多行，并具有日期或时间组件，用于记录事件发生的时间点。维度表包含事件的属性。例如，`Date`\
  \ 表可以告诉你销售发生的时间，并允许你将数据汇总到月、季度或年级别。`Product` 表包含所售产品的属性，你可以按产品线、颜色和品牌查看销售情况。`Store`\
  \ 表包含与销售相关的商店属性。维度表通常没有事实表那么多行，但可能包含相当多的列。当你提出类似“哪些自行车在不同年龄段中销量最好？”这样的问题时，度量值（销售额）来自事实表，而分类（年龄和自行车型号）则来自维度表。\n\
  \n星型架构的主要优势在于提供快速的查询性能和聚合处理能力。其缺点是通常需要大量的预处理，将数据从高度规范化的交易系统迁移到较不规范化的报告系统。好消息是，你的企业可能已经拥有一个为传统联机分析处理\
  \ (OLAP) 数据库（例如 Microsoft 的 `Analysis Server` 或 IBM 的 `Cognos`）提供数据的报告系统。如果你能访问这些系统，它们很可能是你核心业务数据的最佳来源。\n\
  \n为了从源数据系统创建星型架构，你可能需要执行一些数据反规范化操作，下一节将对此进行介绍。\n\n#### 理解何时对数据进行反规范化\n\n虽然交易数据库系统通常是高度规范化的，但报告系统则被反规范化为星型架构。如果你无法访问一个已经为你完成反规范化处理的报告系统，那么你将不得不自己将数据反规范化为星型架构，以加载到你的\
  \ `Power Pivot` 模型中。例如，图 3-11 展示了 `Adventureworks` 交易销售数据库中包含客户数据的表。\n\n![9781430264453_Fig03-11.jpg](img/9781430264453_Fig03-11.jpg)\n\
  \n图 3-11. 高度规范化的架构\n\n为了将客户数据反规范化到你的模型中，你需要创建一个将数据组合成单个客户维度表的查询。如果你不熟悉创建复杂查询，最简单的方法是让数据库开发人员创建一个视图，你可以从中提取，该视图会为你组合这些表。如果查询不是太复杂，你很可能可以在导入数据时自己创建。例如，图\
  \ 3-12 展示了一个客户表和一个地理表。\n\n![9781430264453_Fig03-12.jpg](img/9781430264453_Fig03-12.jpg)\n\
  \n图 3-12. 组合客户和客户位置数据\n\n你可以使用以下查询将它们组合成一个客户维度表。\n\n```\nSELECT  c.CustomerKey,\
  \ c.BirthDate, c.MaritalStatus, c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome,\
  \ c.EnglishOccupation,\n        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n\
  \        g.City, g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\n\
  FROM    Customer AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
  ```\n\n虽然你不必成为查询专家也能将数据导入 `Power Pivot` 模型，但了解查询数据源的基础知识非常有益，即使这仅仅有助于你在与数据库开发人员沟通时提出正确的问题。\n\
  \n#### 创建链接表\n\n关于 `Power Pivot` 模型中所包含数据，需要记住的一点是它是只读的。这大多数情况下是件好事。你希望确保数据只在源系统中被更改。然而，有时作为数据分析的一部分，你可能想要即时进行调整，并查看其对结果的影响。一个相当常见的例子是*桶分析*。例如，假设你想通过离散桶（区间）来查看像年龄这样的连续度量值，并且在分析过程中需要调整区间范围。这正是链接表的用武之地。\n\
  \n要创建链接表，首先在 Excel 工作表中设置该表。输入数据后，将其选中并单击快速分析菜单（参见图 3-13）。在 `表格` 选项卡下，单击 `表` 按钮。\n\
  \n![9781430264453_Fig03-13.jpg](img/9781430264453_Fig03-13.jpg)\n\n图 3-13. 创建 Excel\
  \ 表格\n\n创建表格后，最好在将其导入 `Power Pivot` 数据模型之前为其命名。你可以通过选择表格，然后在 `表工具 设计` 弹出窗口的 `表格`\
  \ 选项卡下输入表格名称来实现（参见图 3-14）。\n\n![9781430264453_Fig03-14.jpg](img/9781430264453_Fig03-14.jpg)\n\
  \n图 3-14. 重命名 Excel 表格\n\n命名表格后，将其选中，然后在 `Power Pivot` 选项卡上选择 `添加到数据模型`（参见图 3-15）。\n\
  \n![9781430264453_Fig03-15.jpg](img/9781430264453_Fig03-15.jpg)\n\n图 3-15. 将表格添加到模型\n\
  \n将表格导入模型后，如果你在 Excel 工作表中更改了一些表格值，并在 `PowerPivot` 选项卡上选择 `全部更新`（参见图 3-15），模型中的链接表格将使用新值进行更新。\n\
  \n#### 创建层次结构\n\n\n\n在分析数据时，利用层次结构来定义不同级别的聚合通常非常有用。例如，基于年、季度和月级别的日历层次结构就很常见。像销售额这样的聚合值会从月度汇总到季度，再到年度。另一种常见的层次结构可能是从部门到大楼再到区域。然后，您可以通过不同级别向上汇总成本。在\
  \ Power Pivot 模型中创建层次结构非常简单。在模型设计器的图表视图中，选择包含您希望在层次结构中使用的属性（列）的表。您将在该表的右上角看到一个`Create\
  \ Hierarchy`按钮（参见图 3-16）。点击该按钮即可添加层次结构并对其重命名。然后，您可以将字段拖放到层次结构中以创建不同的级别。请确保这些字段的排列顺序是从较高级别到较低级别。\n\
  \n![9781430264453_Fig03-16.jpg](img/9781430264453_Fig03-16.jpg)\n\n图 3-16。创建层次结构\n\
  \n创建层次结构是提高模型可用性的一种方法，有助于用户在数据分析中更本能地获取更多价值。在下一节中，您将了解其他一些可以应用于模型以提高其可用性的方法。\n\n\
  #### 打造用户友好型模型\n\n在创建模型时，需要记住的一点是使模型易于使用且直观。模型很可能会被其他人用于分析。该模型也可能用于各种客户端报告和分析工具，例如\
  \ Power View、Power Map 和 Reporting Services。您可以使用的某些属性和设置允许这些客户端工具从模型中获得更多功能。\n\n\
  您可以进行的最有效的调整之一是重命名表和列。使用对业务用户有意义的名称，而不是只有数据库开发人员才能理解的晦涩命名约定。另一个好的做法是确保列的数据类型和格式设置正确。来自文本文件的字段在导入时可能会被类型化为字符串，而实际上它可能是数值数据。此外，您可以隐藏对用户无用的字段，例如用于链接表的代理键。\n\
  \n一个常见需求是更改列的排序顺序，使其不同于自然排序。最常见的例子是月份。由于月份默认是文本，它们会按字母顺序排序。实际上，您希望它们按月编号排序。要解决此问题，您可以按表中的任何其他列对某一列进行排序（参见图\
  \ 3-17）。这是一个很好的功能，允许您创建与业务相关的自定义排序。\n\n![9781430264453_Fig03-17.jpg](img/9781430264453_Fig03-17.jpg)\n\
  \n图 3-17。按另一列对某一列进行排序\n\n您可以使用其他一些设置为各种客户端工具创建良好的模型。您将在第 10 章“为 Power View 优化表格模型”中更详细地重新讨论此主题。\n\
  \n以下动手实验将帮助您巩固本章涉及的主题。\n\n#### 动手实验——在 Power Pivot 中创建数据模型\n\n在以下实验中，您将执行以下操作：\n\
  \n* 创建表关系。\n* 反规范化数据。\n* 创建链接表。\n* 设置层次结构。\n* 打造用户友好型模型。\n\n1. 打开 Excel 2013，创建一个名为\
  \ `LabChapter3.xlsx` 的新文件。\n2. 使用 Power Pivot 数据模型中的表导入向导，连接到 `LabStarters` 文件夹中的\
  \ `Adventureworks.accdb` 文件。\n3. 选择列出的表和字段并导入数据。\n\n| 源表名称 | 友好名称 | 字段 |\n| ---\
