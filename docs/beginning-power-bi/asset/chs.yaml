  \n## 关于作者\n\n![9781430264453_unFM-01.jpg](img/9781430264453_unFM-01.jpg)\n\n**丹·克拉克**是一位专注于微软技术的高级商业智能（BI）/编程顾问。他致力于学习新的\
  \ BI/数据技术，并培训他人如何最佳地实施这些技术。丹已出版多本关于 .NET 编程和 BI 开发的书籍和大量文章。他是各种开发者/数据库会议和用户组会议的常客，并乐于与微软开发者及数据库社区互动。在之前的工作生涯中，他曾是一名物理老师；他至今仍因研究宇宙、弄清楚事物为何如此运作而产生的惊奇与敬畏而备受鼓舞。可以通过\
  \ `Clark.drc@gmail.com` 联系丹。\n\n## 关于技术审校者\n\n![9781430264453_unFM-02.jpg](img/9781430264453_unFM-02.jpg)\n\
  \n**梅丽莎·德姆萨克**是一位数据专业人士，拥有丰富的企业数据职业生涯，曾领导数据团队并担任业务与技术组织之间的联络人。她拥有广泛的行业经验，包括制药、房地产、金融、消费品、信用/营销服务以及保险机构。她的兴趣包括利用数据推动业务目标、数据战略、领导数据分析团队、数据洞察和数据可视化。她理想的工作日包括分析原始数据，并与业务伙伴和\
  \ IT 专业人员合作，提供能影响业务价值的数据洞察。您可以通过 LinkedIn `https://www.linkedin.com/in/sqldiva`\
  \ 和 Twitter `@SQLDiva` 联系梅丽莎。\n\n**珍·安德伍德**在数据仓库、商业智能和预测分析领域拥有近 20 年的经验。她提供咨询、开发、审阅技术解决方案，并进行行业分析。在创立\
  \ Impact Analytix 之前，她曾是微软全球商业智能技术产品经理，负责涵盖 Microsoft SQL Server、Excel 和 SharePoint\
  \ 的产品线。她还曾担任企业数据平台专家、Tableau 技术布道师以及四大系统集成公司的商业智能顾问。在其职业生涯的大部分时间里，她一直在研究、设计和实施跨各种开源、利基市场及企业供应商环境（包括\
  \ Microsoft、Oracle、IBM 和 SAP）的分析解决方案。\n\n作为行业分析师、演讲者、作者、博主和培训师，珍在全球技术社区中相当活跃。近期，她荣获了\
  \ Boulder 商业智能智囊团（BBBT）会员资格、2013 年 Tableau 禅宗大师奖、PASS 全球 Excel BI 分会领导角色以及邓白氏 MVP。她为\
  \ *SQL Server Pro*、BeyeNETWORK 和其他行业媒体渠道撰写文章。\n\n珍拥有威斯康星大学密尔沃基分校的工商管理学士学位，以及加利福尼亚大学圣迭戈分校的计算机科学（数据挖掘方向）研究生证书。\n\
  \n## 致谢\n\n再次感谢 Apress 团队，让写作本书成为一种愉快的体验。特别感谢 Gwenan 和 Christine 在整个过程中给予的指导。最后但同样重要的是，感谢我的技术审校者梅丽莎和珍——感谢你们在审阅本书时对细节的关注和提出的出色建议。\n\
  \n——丹·克拉克\n\n## 简介\n\n自助式商业智能（BI）风靡一时。您听过这些宣传，看过销售演示，并准备尝试一番。然后呢？如果您和我一样，可能已经浏览过一些网站上的示例，尝试了一下，并学到了一些东西。但您可能仍然对这些工具如何协同工作以及如何创建完整解决方案感到困惑，对吗？如果是这样，那么这本书就是为您准备的。它将引导您逐步完成使用微软自助式\
  \ BI 产品核心的各种工具来分析数据的过程。\n\n微软自助式 BI 产品的核心是 `Power Pivot`。我将向您展示如何使用 `Power Pivot`\
  \ 创建健壮、可扩展的数据模型；这些模型将成为您数据分析的基础。由于 `Power Pivot` 是您创建自助式 BI 解决方案的核心工具，本书将对其进行深入介绍。接下来是\
  \ `Power View`。我将向您展示如何使用 `Power View` 轻松构建交互式可视化，使您能够探索数据以发现趋势并获得洞察。此外，我还会向您展示\
  \ `Power Pivot` 如何允许您创建一个能充分利用 `Power View` 中可用功能的数据模型。\n\n\n\n"
- '# 在商业智能工具库中，另外两个日益重要的工具是 Power Query 和 Power Map。你通常需要先对原始数据进行某种形式的转换，然后才能将其加载到数据模型中。你可能需要筛选、聚合或清理原始数据。我将向你展示
  Power Query 如何让你在将数据纳入数据模型之前，轻松地转换和精炼数据。在分析数据时，你可能还需要将基于位置的可视化信息整合到地图中。Power Map
  使用微软的必应地图引擎，轻松地将数据整合到交互式地图上。我将向你展示如何使用 Power Map 为你的数据创建有趣的可视化效果。


  我额外加入的一个主题是 Excel 的表分析工具。这些工具允许你运行一些有趣的数据分析，包括分析关键影响因素、识别数据分组以及预测未来趋势。虽然这些工具不属于微软自助式
  BI 工具集的一部分，但我认为它们值得涵盖。它们会让你在分析数据时思考预测分析的价值。


  我坚信学习最重要的一个方面是实践。不跨上自行车，你就学不会骑车；不实际使用 BI 工具，你就学不会如何使用它们。任何成功的培训计划都包含理论与动手活动。因此，我在每一章的末尾都加入了动手实践活动，旨在巩固该章涵盖的概念。我鼓励你认真完成这些活动。这是非常值得付出的努力。


  '
- '# 第一部分


  ![图片](img/frontdot.jpg)


  ## 在 Power Pivot 中构建模型


  ### 第 1 章


  ![图片](img/frontdot.jpg)


  ## Power Pivot 简介


  微软自助式商业智能（BI）工具集的核心是 Power Pivot。其他工具，Power View、Power Query 和 Power Map，都构建在 Power
  Pivot 表格模型之上。就 Power View 而言，这一点显而易见，因为你需要显式地连接到该模型。就 Power Query 和 Power Map 而言，可能不那么明显，因为
  Power Pivot 表格模型是在幕后为你创建的。无论它是如何创建的，为了充分利用这个工具集并深入了解数据，你都需要知道 Power Pivot 是如何工作的。


  本章为你提供了一些背景信息，说明为什么 Power Pivot 是如此重要的工具，以及是什么让 Power Pivot 性能如此出色。它会指导你运行 Power
  Pivot 所需的条件以及如何启用它。本章还为你概述了 Power Pivot 界面，并让你获得一些使用界面不同区域的经验。


  读完本章后，你将熟悉以下内容：


  *   为什么使用 Power Pivot？

  *   xVelocity 内存分析引擎

  *   为 Excel 启用 Power Pivot

  *   探索数据模型管理界面


  #### 为什么使用 Power Pivot？


  你可能参与过传统的 BI 项目，这些项目包含一个集中式数据仓库，组织的各种数据存储在其中被加载、清洗，然后移至 OLAP（联机分析处理）数据库用于报告和分析。这种方法的一些目标是：创建历史数据的数据存储库，创建单一版本的事实，减少数据孤岛，清理公司数据并确保其符合标准，以及通过仪表板深入了解数据趋势。尽管这些目标值得称赞，也是提供集中式数据仓库的绝佳理由，但这种方法也有一些缺点。最显著的是构建系统和实施变革的复杂性。问问任何一个试图向企业级数据仓库添加新字段或度量的人。这通常是一个漫长、旷日持久的过程，需要
  IT 部门参与，以及数据管理员委员会审查、开发和测试周期。需要的是一种允许敏捷数据分析的解决方案，而无需过多依赖 IT 和正式流程。为了解决这些问题，许多业务分析师曾使用
  Excel 创建数据透视表，并对从各种数据源收集的数据集进行临时分析。使用孤立的 Excel 工作簿进行分析的一些问题是：相互冲突的事实版本、数据孤岛以及数据安全性。


  那么，你如何解决集中式数据仓库过于僵化而 Excel 解决方案又过于松散这一两难困境呢？这就是微软自助式 BI 工具集的用武之地。这些工具并非取代你的集中式数据仓库解决方案，而是对其进行补充，以促进敏捷数据分析。使用
  Power Pivot，你可以从数据仓库中提取数据，用其他数据源（如文本文件或 Web 数据馈送）扩展数据，构建自定义度量，并使用数据透视表和数据透视图分析数据。你可以创建快速的概念验证原型，这些原型可以轻松地推广成为企业级解决方案的一部分。Power
  Pivot 还促进了单独的数据分析项目，而无需经历冗长的开发周期。当与 SharePoint 结合时，Power Pivot 工作簿可以由 IT 部门进行安全管理和控制，包括数据刷新调度和资源使用。这在很大程度上满足了
  IT 部门对治理的需求，同时又不会妨碍业务用户对敏捷性的需求。


  以下是 Power Pivot 的一些优势：


  *   作为 Excel 的免费加载项运行

  *   轻松整合来自各种来源的数据

  *   处理多达数千万到数亿行的大量数据

  *   使用熟悉的 Excel 数据透视表和数据透视图进行数据分析

  *   包含强大的新数据分析表达式 (DAX) 语言

  *   模型中的数据是只读的，从而提高了安全性和完整性


  当 Power Pivot 托管在 SharePoint 中时，它还有以下额外优势：


  *   支持 Power Pivot BI 解决方案的共享与协作

  *   可以安排和自动化数据刷新

  *   可以通过版本管理审计更改

  *   可以确保用户具有只读和可更新的访问权限


  既然你已经了解了 Power Pivot 的一些优势，那么让我们来看看它的运作机制。


  #### xVelocity 内存分析引擎




  #### Power Pivot xVelocity 引擎


  Power Pivot 背后的独门秘籍是 `xVelocity` 内存分析引擎（没错，这就是它的名字！）。该引擎使得 Power Pivot 能够快速处理海量数据。其关键之一在于采用列式数据库来存储数据。传统的基于行的数据存储方式将所有数据按行存储在一起，在根据行键（例如，根据订单
  ID 更新或检索订单）检索和更新数据时效率很高。这对于订单录入系统非常有利，但在需要对历史订单进行分析时（例如，要查看过去一年的趋势以确定产品的销售情况）就不那么理想了。


  基于行的存储还会因每行重复存储值而占用更多空间；如果客户数量庞大，像 John 或 Smith 这样的常见名字会被重复多次。列式数据库仅存储每列的不同值，然后将行存储为一组指向列值的指针。这种内置的索引机制节省了大量空间，并且与
  `xVelocity` 引擎内置的数据压缩技术相结合，能够实现显著的性能优化。这也意味着对列值进行的数据聚合（例如典型数据分析中使用的聚合操作）速度极快。


  `xVelocity` 引擎提供的另一个优势是内存分析。查询数据时，大部分处理瓶颈都发生在从磁盘读取或写入数据的过程中。借助内存分析技术，数据被加载到计算机的
  RAM 中，然后进行查询。这极大地缩短了处理时间，并减少了在磁盘上存储预聚合值的需求。当你从 32 位操作系统和应用程序迁移到如今已成为主流的 64 位系统时，这一优势尤为明显。


  #### 表格模型优势


  除了 `xVelocity` 引擎提供的优势之外，另一个值得一提的优势是 Power Pivot 模型的表格结构。该模型由表和表关系组成。这种表格模型对于大多数业务分析师和数据库开发者来说更为熟悉。传统的
  OLAP 数据库（例如 `SSAS`，即 SQL Server Analysis Server）将数据模型呈现为三维立方体结构，处理起来更困难，并且需要使用复杂的查询语言
  `MDX`（多维表达式）。我发现，在大多数（但并非所有）情况下，使用表格模型和 `DAX` 比使用 OLAP 多维数据集和 `MDX` 更容易。


