  #### 本章小结


  在本章中，您已经了解了如何在 Power View 中创建各种可视化对象。您创建了标准柱形图、条形图和饼图。您还了解了折线图和散点图，以及如何创建气泡图并添加播放轴以查看随时间变化的趋势。此外，您还学习了如何将度量值与地理空间字段关联并呈现在地图上。至此，您应该能够熟练地在
  Power View 中创建各种可视化对象了。到目前为止，您创建的每个可视化对象都是独立的图表或图形。Power View 的优势之一在于它能够将这些可视化对象关联起来，从而创建交互式仪表板。您将在下一章中探讨这一点。


  ### 第 10 章


  ![image](img/frontdot.jpg)


  #### 使用 Power View 创建交互式仪表板


  在上一章中，您研究了用于创建报表和仪表板的一些标准可视化对象。在本章中，您将把这些可视化对象结合起来，使它们协同工作以形成交互式仪表板。交互式仪表板与传统仪表板的不同之处在于，它将用户体验从被动扩展为主动。您可以执行筛选、在不同细节级别上下钻，并发现各个指标之间的关联。您还将了解如何使用磁贴对数据进行分组，以及如何为组和整体视图创建筛选器。此外，您还将了解如何包含图像以增强仪表板体验。


  完成本章后，您将能够：


  - 在 Power View 中链接可视化对象。

  - 使用磁贴组织数据。

  - 筛选组和视图。

  - 将仪表板公开给使用者。


  ![Image](img/sq.jpg) **注意** 如需彩色图形副本，请访问 Source Code/Downloads（源代码/下载），网址为 `http://www.apress.com/9781430264453`。


  ##### 在 Power View 中链接可视化对象


  Power View 的优势之一在于，如果 Power Pivot 模型中包含用于创建各个可视化对象的数据之间的链接，Power View 将利用该关系实现交互式筛选。*交互式筛选*是指对一个可视化对象进行筛选的过程会自动筛选相关可视化对象。例如，图
  10-1 显示了一个条形图，该图展示了 Adventure Works 示例数据库中不同产品类别的销售额。


  ![9781430264453_Fig10-01.jpg](img/9781430264453_Fig10-01.jpg)


  图 10-1 按类别划分的分销商销售额


  在此视图的基础上，您可以添加一个显示不同国家销售额的柱形图，如图 10-2 所示。


  ![9781430264453_Fig10-02.jpg](img/9781430264453_Fig10-02.jpg)


  图 10-2 向同一视图添加相关可视化对象


  由于 `Sales` 表与 `SalesTerritory` 表和 `Product` 表相关联，因此如果您选择其中一个产品类别条，则会高亮显示条形图中该类别对应的销售额（参见图
  10-3）。


  ![9781430264453_Fig10-03.jpg](img/9781430264453_Fig10-03.jpg)


  图 10-3 相关可视化对象的交互式筛选


  这种筛选是双向的，因此您可以单击下方图表中的某一列，它将筛选顶部图表以显示该国家的销售额。这种交互式筛选适用于 Power View 中大多数类型的可视化对象。图
  10-4 显示了一个气泡图和一个表格。当您单击一个气泡时，表格会被筛选，以显示构成该气泡值的详细记录。


  ![9781430264453_Fig10-04.jpg](img/9781430264453_Fig10-04.jpg)


  图 10-4 筛选以显示构成气泡值的详细信息




  现在您已经了解了可视化对象之间如何交互，接下来可以学习如何使用磁贴对可视化对象进行分组。


  ##### 使用磁贴组织数据


  在上一节中，您了解了放置在同一视图上的可视化对象如何相互交互。另一种将可视化对象组合在一起的方法是使用磁贴。首先创建一个包含分组条件的表格。例如，您可能希望按销售区域组织销售数据。为此，首先使用销售区域图像创建一个表格，然后将其更改为磁贴类型的可视化对象。您将看到一个类似于图
  10-5 的可视化对象。


  ![9781430264453_Fig10-05.jpg](img/9781430264453_Fig10-05.jpg)


  图 10-5. 创建磁贴组


  在图 10-5 中，请注意销售区域图像同时出现在"标题"字段和"详细信息"区域中。您可以从"详细信息"区域中移除该字段，并从 Power Pivot 模型中添加与销售区域相关的数据。例如，您可以添加分配给该区域的销售人员、他们的照片、销售额以及销售年份。这将在磁贴的"详细信息"部分创建一个表格（参见图
  10-6）。


  ![9781430264453_Fig10-06.jpg](img/9781430264453_Fig10-06.jpg)


  图 10-6. 在磁贴内创建表格


  您可以将详细信息的可视化对象更改为其他类型，例如，矩阵。当您单击不同的磁贴时，详细信息会根据磁贴组进行筛选（参见图 10-7）。


  ![9781430264453_Fig10-07.jpg](img/9781430264453_Fig10-07.jpg)


  图 10-7. 使用磁贴进行分组


  如果您单击磁贴"详细信息"区域的空白区域，则可以构建另一个可视化对象。例如，图 10-8 显示了一个矩阵和一个柱形图，它们都根据所选磁贴进行了筛选。


  ![9781430264453_Fig10-08.jpg](img/9781430264453_Fig10-08.jpg)


  图 10-8. 使用磁贴控制多个可视化对象


  对可视化对象进行分组后，请确保您了解筛选是如何影响分组在磁贴中和视图上的可视化对象的。接下来您将了解这一点。


  ##### 筛选组和视图


  当您将多个可视化对象放置在同一视图上时，您可以选择筛选整个视图（页面）或构成该视图的单个可视化对象。图 10-9 显示了"筛选器"区域，您可以在其中切换"视图"选项卡和"图表"选项卡。"视图"选项卡用于将筛选器应用于页面上的所有可视化对象，而"图表"选项卡则将筛选器仅应用于单个可视化对象（此处为一个图表）。


  ![9781430264453_Fig10-09.jpg](img/9781430264453_Fig10-09.jpg)


  图 10-9. 筛选图表或视图


  默认情况下，可视化对象筛选器包含构成该可视化对象的字段，且这些字段无法移除。但是，您可以从"字段列表"向筛选器中添加其他字段。当您首次单击"筛选器"区域中的"视图"选项卡时，其中没有列出任何字段。要筛选视图中的值，请从"字段列表"中添加与视图上可视化对象中包含的字段相关的字段。


  所有筛选器都有一个列表模式，在该模式下，值显示为复选框列表（参见图 10-10）。


  ![9781430264453_Fig10-10.jpg](img/9781430264453_Fig10-10.jpg)


  图 10-10. 使用筛选器选取列表


  您还可以通过选择字段名称右侧的箭头切换到高级筛选模式。Power View 中公开的高级筛选控件类型取决于筛选器的数据类型。图 10-11 显示了针对日期字段公开的高级筛选控件。


  ![9781430264453_Fig10-11.jpg](img/9781430264453_Fig10-11.jpg)


  图 10-11. 按日期进行高级筛选


  图 10-12 显示了当高级筛选与基于文本的字段一起使用时可用的选项。


  ![9781430264453_Fig10-12.jpg](img/9781430264453_Fig10-12.jpg)


  图 10-12. 使用基于文本的字段进行高级筛选


  筛选视图的另一种方法是使用切片器。切片器对用户来说很友好，因为它们属于视图的一部分。切片器的缺点在于它们仅限于选取列表，并且不提供前面提到的高级筛选功能。将磁贴分组与切片器结合使用可以创建不同的筛选器集。图
  10-13 显示了磁贴组内和磁贴组外的相同图表。两个图表都受到 CalendarYear 切片器的筛选，因为它们位于同一视图上。磁贴组内的图表还受到销售区域的进一步筛选，因为它是磁贴组的一部分。


  ![9781430264453_Fig10-13.jpg](img/9781430264453_Fig10-13.jpg)


  图 10-13. 使用切片器和磁贴进行筛选


  构建好仪表板后，就需要将其开放给用户。在下一节中，我们将简要回顾您的选项。


  ##### 公开仪表板


  构建交互式仪表板后，下一步是将其公开给其他人（例如业务分析师和经理），以便他们能够探索数据。由于构成仪表板的 Power Pivot 模型和 Power View
  可视化对象是一个独立的单元，您只需与使用者共享 Excel 文件的副本即可。然而，这并不是管理仪表板的理想方式，并且很快就会变得难以控制。管理仪表板的更好方法是将它们托管在
  SharePoint 站点中。您可以将其托管在本地 SharePoint Server 2013 或基于云的 Office 365 SharePoint Server
  中。


  基于云的 Office 365 解决方案具有一些非常引人注目的功能，使其成为托管 Power BI 解决方案的绝佳场所。这些功能包括 Power BI 站点，用户可以在其中共享、查看
  Power View 仪表板并与之交互。它还包括一个 Power BI 管理中心，您可以在其中保护、监控和自动化仪表板的数据刷新。如果您需要实施一个解决方案来为大量用户创建和分发大量视图，我建议您了解一下
  Office 365 的功能。图 10-14 显示了 Office 365 Power BI 站点上的 Power View 仪表板。


  ![9781430264453_Fig10-14.jpg](img/9781430264453_Fig10-14.jpg)


  图 10-14. 在 Power BI 站点上公开 Power View 仪表板


  需要记住的一点是，Power View 最初是为交互式数据探索而创建的。尽管它正在演变成一个相当不错的仪表板工具，但它并不是生成需要打印的静态报告的最佳选择。当您打印
  Power View 页面时，实质上只是打印了一个屏幕截图。


  现在您已经了解了如何使用 Power View 创建交互式仪表板，是时候亲自动手实践创建一个了。


  ##### 动手实验——在 Power View 中创建仪表板


  在以下实验中，您将


  *   使用 Power View 创建交互式仪表板。

  *   使用磁贴对可视化对象进行分组。




  1. 在`LabStarters`文件夹中，打开`LabChapter10.xlsx`文件。此文件包含来自测试数据库`AdventureWorks`的销售数据。

  2. 在 Excel 中选择`插入`选项卡，然后点击`Power View`按钮。这将在工作簿中插入一个`Power View`工作表。你将在此工作表上构建仪表板。

  3. 将仪表板的标题更改为**经销商销售分析**。

  4. 创建一个包含`CalendarYears`的表格，并将其转换为切片器。在切片器中选择年份`2006`以限制数据。

  5. 点击设计图面的空白区域以创建新的可视化效果。从`Date`表中选择`MonthName`，从`Reseller Sales`表中选择`Reseller Sales
  Profit`。将表格转换为折线图并调整图表大小。从`Product`表中将`Category`添加到折线图的`图例`放置区域。

  6. 使用`Reseller`表中的`BusinessType`以及`Reseller Sales`表中的`Last Year Reseller Sales Amount`和`Reseller
  Sales`创建一个簇状条形图。

  7. 重新排列可视化效果，使仪表板看起来类似于图 10-15。


  ![9781430264453_Fig10-15.jpg](img/9781430264453_Fig10-15.jpg)


  图 10-15. 经销商销售分析仪表板


  8. 通过更改切片器中的年份、在条形图中选择经销商类型以及在折线图中选择类别线来测试仪表板的交互性。注意这如何影响仪表板中的图表。你可以通过点击图表的空白区域来清除图表上的筛选器（参见图
  10-16）。


  ![9781430264453_Fig10-16.jpg](img/9781430264453_Fig10-16.jpg)


  图 10-16. 清除交互式筛选器


  9. 添加一个新的`Power View`工作表。将此仪表板的标题命名为**销售业绩**。

  10. 从`Employee`表创建一个`EmployeePhotos`的表格。通过在`设计`选项卡中选择`平铺`，将表格更改为平铺。

  11. 将`Employee`表中的`DepartmentName`拖到`筛选器`区域。将视图筛选为仅显示销售部门的员工。调整平铺区域的大小以占据视图的大部分空间（参见图
  10-17）。


  ![9781430264453_Fig10-17.jpg](img/9781430264453_Fig10-17.jpg)


  图 10-17. 创建平铺分组


  12. 删除平铺下方显示的员工图像。

  13. 在`平铺`框内选择一个空白区域，然后点击`字段选择`窗格中的`Reseller Sales`表里的`Reseller Quantity`。从`Sales
  Territory`表中选择`SalesTerritoryImage`和`SalesTerritoryRegion`。最后，从`Product`表中选择`Category`。

  14. 将表格转换为矩阵，并将`Date`表中的`CalendarYear`拖到矩阵的`列组`中。调整矩阵大小，使其占据平铺区域的大约一半（参见图 10-18）。你可以在`设计`选项卡中减小文本大小使其适应。


  ![9781430264453_Fig10-18.jpg](img/9781430264453_Fig10-18.jpg)


  图 10-18. 向平铺区域添加矩阵


  15. 要创建柱形图，在`平铺`框内选择一个空白区域并点击。选择`Product`表中的`Category`、`Reseller Sales`表中的`Reseller
  Sales`以及`Date`表中的`CalendarYear`。将创建的表格更改为`100% 堆积柱形图`。调整图表大小，使其看起来类似于图 10-19。


  ![9781430264453_Fig10-19.jpg](img/9781430264453_Fig10-19.jpg)


  图 10-19. 向仪表板添加堆积柱形图


  16. 选择不同的销售人员，并注意数据已筛选为仅显示他们的销售数据。同时点击柱形图的一个分区，注意它如何筛选矩阵数据。

  17. 探索与你创建的两个仪表板进行交互。

  18. 你可能想要探索更改主题和为仪表板添加背景图像。你还可以添加公司徽标和标准免责声明，这是大多数公司仪表板的常见要求。完成后，保存并退出 Excel。


  **总结**


  在本章中，你已了解了如何结合`Power View`中的各种可视化效果来创建交互式仪表板。你还了解了如何使用平铺来分组仪表板上的其他可视化效果。尽管你没有探讨将仪表板部署到`SharePoint`，但这将是合乎逻辑的下一步。`SharePoint`，无论是在云端与`Office
  365`结合，还是在本地与`SharePoint 2013`结合，都为协作和管理自助式`BI`提供了强大的功能。在下一章中，你将了解另一个有用的 Excel 加载项，它将是你自助式`BI`工具库的一部分。`Power
  Query`提供了一个易于使用的界面，用于发现和转换数据，以便在你的`Power Pivot`模型中使用。它还包含清理和塑造数据的工具，例如删除重复项、替换值和分组数据。


