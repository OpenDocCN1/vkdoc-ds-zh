- '# 引言


  自助式商业智能（BI）正风靡一时。你听过相关宣传，看过销售演示，并且准备亲自尝试。然后呢？如果你和我一样，可能已经浏览过一些网站的例子，尝试了一下，并学到了一些东西。但你仍然想知道这些工具如何组合在一起，以及如何创建完整的解决方案，对吧？如果是这样，那么本书就是为你准备的。它将带你一步步地使用微软自助式
  BI 解决方案核心的各种工具来执行数据分析流程。


  微软自助式 BI 解决方案的核心是 Power Pivot。我将向你展示如何使用 Power Pivot 创建强大、可扩展的数据模型；这些模型将作为你数据分析的基础。由于
  Power Pivot 是创建自助式 BI 解决方案的核心工具，本书将对其进行详尽介绍。接下来是 Power View。我将展示如何使用 Power View
  轻松构建交互式可视化对象，让你能够探索数据以发现趋势并获得洞见。此外，我还会说明 Power Pivot 如何让你创建能充分利用 Power View 功能的数据模型。




  '
- '# 在商业智能工具库中，另外两个日益重要的工具是 `Power Query` 和 `Power Map`。很多时候，在将原始数据加载到数据模型之前，你需要以某种方式对其进行转换。你可能需要过滤、聚合或清洗原始数据。我将向你展示如何使用
  `Power Query` 在将数据纳入数据模型之前轻松地进行转换和提炼。在分析数据时，你可能还需要将带有可视化效果的位置信息整合到地图中。`Power Map`
  利用微软的必应地图引擎，可以轻松地将数据整合到交互式地图上。我将向你展示如何使用 `Power Map` 创建有趣的数据可视化效果。


  我额外收录的一个主题是 Excel 的表格分析工具。这些工具允许你运行一些有趣的数据分析，包括分析关键影响因素、识别数据分组以及预测未来趋势。虽然这些工具不属于微软自助式商业智能工具集的一部分，但我认为它们值得介绍。它们会让你在分析数据时思考预测分析的价值。


  我坚信，学习中最重要的一个方面就是实践。不骑上自行车，你就学不会骑车；不实际动手操作，你就学不会使用这些商业智能工具。任何成功的培训计划都包括理论和实践两部分。因此，我在每一章的末尾都安排了一个实践活动，旨在巩固该章所涵盖的概念。我鼓励你认真完成这些活动。这将非常值得。


  '
- "# 第一部分\n\n![图片](img/frontdot.jpg)\n\n## 在 Power Pivot 中构建模型\n\n### 第 1 章\n\n![图片](img/frontdot.jpg)\n\
  \n#### 介绍 Power Pivot\n\n微软自助式商业智能工具集的核心是 `Power Pivot`。其余的工具，`Power View`、`Power\
  \ Query` 和 `Power Map`，都建立在 `Power Pivot` 表格模型之上。对于 `Power View` 来说，这一点显而易见，因为你需要显式地连接到该模型。对于\
  \ `Power Query` 和 `Power Map` 来说，这一点可能不那么明显，因为 `Power Pivot` 表格模型是在后台为你自动创建的。无论它是如何创建的，要充分利用这些工具集并深入了解数据，你需要知道\
  \ `Power Pivot` 是如何工作的。\n\n本章为你提供了一些背景信息，说明为什么 `Power Pivot` 是一个如此重要的工具，以及是什么让 `Power\
  \ Pivot` 性能如此出色。它指导你了解运行 `Power Pivot` 的要求以及如何启用它。本章还概述了 `Power Pivot` 的界面，并为你提供了一些使用界面不同区域的体验。\n\
  \n阅读本章后，你将熟悉以下内容：\n\n*   为什么使用 `Power Pivot`？\n*   `xVelocity` 内存分析引擎\n*   启用适用于\
  \ Excel 的 `Power Pivot`\n*   探索数据模型管理界面\n\n#### 为什么要使用 Power Pivot？\n\n你可能参与过传统的商业智能项目，这些项目由一个集中的数据仓库组成，组织中的各种数据存储被加载、清洗，然后移到一个\
  \ OLAP（在线分析处理）数据库以进行报告和分析。这种方法的一些目标是：为历史数据创建一个数据仓库，创建唯一的事实版本，减少数据孤岛，清理公司数据并确保其符合标准，以及通过仪表板洞察数据趋势。虽然这些目标值得称赞，并且是提供集中式数据仓库的绝佳理由，但这种方法也存在一些缺点。最显著的是构建系统和实施变更的复杂性。问问任何一个尝试过向企业级数据仓库添加新字段或度量值的人。这通常是一个漫长而复杂的过程，需要\
  \ IT 部门参与，并经过数据管理员委员会评审、开发和测试周期。需要的是一种能够进行敏捷数据分析的解决方案，而无需过多依赖 IT 部门和正式流程。为了解决这些问题，许多业务分析师使用\
  \ Excel 创建数据透视表，并对从各种数据源收集到的数据集进行临时分析。单独使用 Excel 工作簿进行分析的一些问题包括：相互冲突的事实版本、数据孤岛以及数据安全问题。\n\
  \n那么，如何解决集中式数据仓库过于僵化而 Excel 解决方案又过于松散的两难问题呢？这就是微软自助式商业智能工具集的用武之地。这些工具并非取代你的集中式数据仓库解决方案，而是对其进行补充，以促进敏捷数据分析。使用\
  \ `Power Pivot`，你可以从数据仓库中提取数据，用其他数据源（如文本文件或 Web 数据馈送）对其进行扩展，构建自定义度量值，并使用数据透视表和数据透视图分析数据。你可以快速创建概念验证，这些验证可以轻松升级为企业级解决方案的一部分。`Power\
  \ Pivot` 还促进了临时性的数据分析项目，而无需承担冗长开发周期的开销。当与 SharePoint 结合使用时，`Power Pivot` 工作簿可以由\
  \ IT 部门进行安全保护和管理，包括数据刷新调度和资源使用。这在很大程度上满足了 IT 部门对治理的需求，同时又不会妨碍业务用户对敏捷性的需求。\n\n以下是\
  \ `Power Pivot` 的一些优势：\n\n*   作为 Excel 的免费加载项运行\n*   轻松整合来自各种来源的数据\n*   处理高达数千万到数亿行的大量数据\n\
  *   使用熟悉的 Excel 数据透视表和数据透视图进行数据分析\n*   包含强大的新数据分析表达式语言\n*   模型中的数据为只读，提高了安全性和完整性\n\
  \n当 `Power Pivot` 托管在 SharePoint 中时，以下是其一些额外优势：\n\n*   支持 `Power Pivot` 商业智能解决方案的共享与协作\n\
  *   可以计划和自动化数据刷新\n*   可以通过版本管理审计更改\n*   可以确保用户权限仅为只读或可更新访问\n\n现在你知道了一些 `Power Pivot`\
  \ 的优势，让我们看看它是如何运作的。\n\n#### `xVelocity` 内存分析引擎\n\n\n\n\n#### Power Pivot 的核心技术\n\
  \n`Power Pivot`背后的特殊技术是`xVelocity`内存分析引擎（没错，这就是它的名字！）。这使得`Power Pivot`能够对大量数据提供快速性能。其关键之一在于它使用列式数据库来存储数据。传统的基于行的数据存储将一行中的所有数据存储在一起，并且能够高效地基于行键检索和更新数据，例如，基于订单\
  \ ID 更新或检索订单。这对于订单录入系统来说非常出色，但在对历史订单进行分析时（例如，你想查看过去一年的趋势以确定产品的销售情况）就不那么理想了。基于行的存储还会因为为每一行重复存储值而占用更多空间；如果你有大量客户，像\
  \ John 或 Smith 这样的常见名字会被重复存储多次。列式数据库仅为每一列存储不同的值，然后将行存储为一组指向列值的指针。这种内置的索引节省了大量空间，并且当与`xVelocity`引擎内置的数据压缩技术结合使用时，可以实现显著的优化。这也意味着对列值的数据聚合（例如典型数据分析中使用的那些）速度极快。\n\
  \n`xVelocity`引擎提供的另一个好处是内存分析。与查询数据相关的大多数处理瓶颈发生在从磁盘读取或写入数据时。借助内存分析，数据被加载到计算机的 RAM\
  \ 中，然后进行查询。这导致处理时间大大加快，并限制了在磁盘上存储预聚合值的需求。当你从 32 位操作系统和应用程序迁移到如今已成为常态的 64 位操作系统和应用程序时，这一优势尤为明显。\n\
  \n除了`xVelocity`引擎提供的好处之外，另一个值得一提的好处是`Power Pivot`模型的表格结构。该模型由表和表关系组成。这种表格模型对大多数业务分析师和数据库开发者来说更为熟悉。传统的\
  \ OLAP 数据库（如`SSAS`（`SQL Server Analysis Server`））将数据模型呈现为三维立方体结构，这种结构更难处理，并且需要使用复杂的查询语言`MDX`（多维表达式）。我发现，在大多数情况下（并非所有情况），使用表格模型和`DAX`比使用\
  \ OLAP 立方体和`MDX`更容易。\n\n#### 启用 Excel 的 Power Pivot\n\n`Power Pivot`是 Excel 的一个免费插件，可在`Office\
  \ Professional Plus`和`Office 365 Professional Plus`版本中使用。如果你使用的是 Excel 2010，则需要从\
  \ Microsoft Office 网站下载并安装该插件。如果你使用的是 Excel 2013（本书介绍的版本），该插件已安装，你只需启用它。要检查你所安装的版本，请选择\
  \ Excel 中的“文件”菜单，然后选择“账户”选项卡，如图 1-1 所示。\n\n![9781430264453_Fig01-01.jpg](img/9781430264453_Fig01-01.jpg)\n\
  \nFigure 1-1. 检查 Excel 版本\n\n在 Excel 的“账户”选项卡上，单击“关于 Excel”按钮。你将看到一个显示版本详细信息的屏幕，如图\
  \ 1-2 所示。注意版本号和版本。它应该是专业增强版，并且最好是 64 位版本。32 位版本对于较小的数据集也能正常工作，但要获得`Power Pivot`的最佳性能和体验，你应该在配备约\
  \ 8 GB RAM 的 64 位 Windows 系统上运行 64 位版本。\n\n![9781430264453_Fig01-02.jpg](img/9781430264453_Fig01-02.jpg)\n\
  \nFigure 1-2. 检查 Excel 版本和版本号\n\n一旦确定你使用的是正确的版本，你可以通过进入“文件”菜单并选择“选项”选项卡来启用`Power\
  \ Pivot`插件。在“Excel 选项”窗口中，选择“加载项”选项卡。在“管理”下拉菜单中选择“COM 加载项”，然后单击“转到”按钮（见图 1-3）。\n\
  \n![9781430264453_Fig01-03.jpg](img/9781430264453_Fig01-03.jpg)\n\nFigure 1-3. 管理\
  \ COM 加载项\n\n你将看到“COM 加载项”窗口（见图 1-4）。选择 `Microsoft Office PowerPivot for Excel 2013`，然后单击“确定”。\n\
  \n![9781430264453_Fig01-04.jpg](img/9781430264453_Fig01-04.jpg)\n\nFigure 1-4. 选择\
  \ Power Pivot 插件\n\n现在你已经为 Excel 启用了`Power Pivot`插件，是时候探索数据模型管理器了。\n\n#### 探索数据模型管理器界面\n\
  \n一旦你启用了`Power Pivot`，你应该会在 Excel 中看到一个新的“Power Pivot”选项卡（见图 1-5）。如果你单击“管理”按钮，它将启动数据模型管理界面。\n\
  \n![9781430264453_Fig01-05.jpg](img/9781430264453_Fig01-05.jpg)\n\nFigure 1-5. 启动数据模型管理器\n\
  \n当数据模型管理器启动时，你将拥有两个独立但相互连接的界面。你可以在正常的 Excel 界面和数据模型管理界面之间来回切换。这对于新的`Power Pivot`用户来说可能会感到困惑。请记住，数据模型管理器（图\
  \ 1-6）是你定义模型的地方，包括表、表关系、度量值、计算列和层次结构。Excel 界面（图 1-7）是你使用数据透视表和数据透视图分析数据的地方。\n\n\
  ![9781430264453_Fig01-06.jpg](img/9781430264453_Fig01-06.jpg)\n\nFigure 1-6. 数据模型管理器界面\n\
  \n![9781430264453_Fig01-07.jpg](img/9781430264453_Fig01-07.jpg)\n\nFigure 1-7. Excel\
  \ 工作簿界面\n\n在数据模型管理器中有两种数据模型视图：数据视图和关系图视图。首次打开时，它处于数据视图模式。在数据视图模式下，你可以看到模型中包含的数据。模型中的每个表在视图中都有自己的选项卡。表可以包含从数据源检索的数据列，也可以包含使用`DAX`计算的列。计算列看起来比其他列稍暗。\
  \ 图 1-8 显示了“全名”列，该列是通过连接“名字”和“姓氏”列得到的。\n\n![9781430264453_Fig01-08.jpg](img/9781430264453_Fig01-08.jpg)\n\
  \nFigure 1-8. 数据模型管理器中的计算列\n\n每个选项卡在列数据下方还包含一个网格区域。网格区域是你在模型中定义度量值的地方。度量值通常包含某种聚合函数。例如，你可能希望查看按月或按产品汇总的销售额。\
  \ 图 1-9 显示了与“Internet 销售”表关联的一些度量值。\n\n![9781430264453_Fig01-09.jpg](img/9781430264453_Fig01-09.jpg)\n\
  \nFigure 1-9. 数据模型管理器中的度量值网格区域\n\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n译文如下：\n\n\n在设计师的顶部有四个菜单选项卡：**File（文件）**、**Home（主页）**、**Design（设计）**和**Advanced（高级）**。如果你看不到\
  \ Advanced 选项卡，可以通过选择 File 菜单选项卡并选择**Switch To Advanced Mode（切换到高级模式）**来显示它。随着你学习本书的深入，你将逐渐熟悉设计师中的各个菜单。目前，只需知道这里是你执行各种操作的地方，例如连接数据源和创建数据查询、格式化数据、设置默认属性以及创建**KPI（关键绩效指标）**。图\
