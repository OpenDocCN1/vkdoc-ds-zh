  \  \n\n图 11-23. 按出发地和承运人分组  \n\n\n\n22. 点击 `应用并关闭` 按钮以保存查询。\n23. 添加一个名为 `Carriers`\
  \ 的查询，用于从 `Carriers.csv` 文件中获取代码和描述内容。\n24. 打开 `DelaySummary` 查询，然后在 `开始` 选项卡中选择\
