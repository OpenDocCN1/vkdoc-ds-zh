  \n![9781430264453_Fig07-06.jpg](img/9781430264453_Fig07-06.jpg)\n\n图 7-6. 更改切片器设置\n\
  \n有时您需要*级联筛选器*——即一个筛选器限制下一个筛选器中可选择的内容。对于基于模型中相关字段的切片器来说，这很容易实现。当您选择相关字段时，切片器会自动为您链接起来。例如，图\
  \ 7-7 显示了一个产品类别和产品子类别筛选器。如果您选择了一个产品类别，相应的产品子类别将会高亮显示。\n\n![9781430264453_Fig07-07.jpg](img/9781430264453_Fig07-07.jpg)\n\
  \n图 7-7. 使用切片器创建级联筛选器\n\n### 向数据透视表添加可视化效果\n\n为了帮助识别趋势、异常值并深入了解数据，您可以向数据透视表添加多种类型的可视化效果。这些包括条件格式、数据条和趋势线。图\
  \ 7-8 显示了带有数据条和条件格式的数据透视表。\n\n![9781430264453_Fig07-08.jpg](img/9781430264453_Fig07-08.jpg)\n\
  \n图 7-8. 使用条件格式和数据条\n\n要创建视觉格式，请在数据透视表中选择要设置格式的数据，然后在`开始`选项卡中，单击`条件格式`下拉菜单（见图 7-9）。如您所见，您有很多创建条件格式的选项。在图\
  \ 7-8 中，有一个`突出显示单元格规则`，用于将负数显示为红色。\n\n![9781430264453_Fig07-09.jpg](img/9781430264453_Fig07-09.jpg)\n\
  \n图 7-9. 设置条件格式\n\n建立规则后，您可以通过选择`管理规则`选项并选择要编辑的规则来对其进行编辑。图 7-10 显示了可以为`数据条`格式规则设置的各种选项。\n\
  \n![9781430264453_Fig07-10.jpg](img/9781430264453_Fig07-10.jpg)\n\n图 7-10. 编辑数据条规则\n\
  \n您可以使用格式规则产生一些有趣的效果。例如，图 7-11 中的数据透视表显示了一个热力图，用于快速确定哪些月份的销售情况好，哪些月份销售情况差。\n\n![9781430264453_Fig07-11.jpg](img/9781430264453_Fig07-11.jpg)\n\
  \n图 7-11. 使用条件格式创建热力图\n\n与数据透视表相关的另一个流行功能是迷你图。*迷你图*是显示一系列数据趋势的微型图表。图 7-12 显示了展示一年四个季度销售趋势的迷你图。\n\
  \n![9781430264453_Fig07-12.jpg](img/9781430264453_Fig07-12.jpg)\n\n图 7-12. 使用迷你图显示趋势\n\
  \n要创建迷你图，请突出显示数据透视表中包含数据的值，然后在`插入`选项卡上选择`迷你图`按钮。然后您需要选择迷你图的位置（见图 7-13）。您必须从折线图、柱形图或盈亏图中选择一种迷你图类型。\n\
  \n![9781430264453_Fig07-13.jpg](img/9781430264453_Fig07-13.jpg)\n\n图 7-13. 设置迷你图\n\
  \n虽然向数据透视表添加可视化效果可以增强您分析数据的能力，但很多时候，发现趋势以及比较和对比数据的最佳方法是使用图表和图形。在下一节中，您将了解图表和图形作为有用的数据分析工具，以及如何将它们添加到您的分析仪表板中。\n\
  \n### 使用数据透视图\n\n除了数据透视表，Excel 还提供了一组强大的图表和图形供您分析数据。添加数据透视图与添加数据透视表非常相似。在 Excel\
  \ 的`插入`选项卡上，选择`数据透视图`下拉菜单。您可以选择添加单个`数据透视图`，或者添加彼此关联的`数据透视图`和`数据透视表`（见图 7-14）。\n\n\
  ![9781430264453_Fig07-14.jpg](img/9781430264453_Fig07-14.jpg)\n\n图 7-14. 添加数据透视图\n\
  \n选择数据透视图后，将出现一个窗口，供您选择数据源以及放置数据透视图的位置（见图 7-15）。\n\n![9781430264453_Fig07-15.jpg](img/9781430264453_Fig07-15.jpg)\n\
  \n图 7-15. 选择数据源\n\n要选择`Power Pivot`模型作为数据源，请选择使用外部连接，然后单击`选择连接`按钮。在`现有连接`窗口中，选择`表`选项卡，然后选择`工作簿数据模型中的表`（见图\
  \ 7-16）。\n\n![9781430264453_Fig07-16.jpg](img/9781430264453_Fig07-16.jpg)\n\n图 7-16.\
  \ 选择工作簿数据模型\n\n选择数据源后，您将看到一个空白图表和一个字段选择框，您可以在其中拖放字段以用于图表值和轴（见图 7-17）。\n\n![9781430264453_Fig07-17.jpg](img/9781430264453_Fig07-17.jpg)\n\
  \n图 7-17. 创建图表\n\n默认情况下，图表是一个柱形图，但您有许多不同类型的图表可供选择。如果您单击图表并选择`数据透视图工具 设计`选项卡，您可以选择`更改图表类型`按钮，并从多种类型中进行选择（见图\
  \ 7-18）。\n\n![9781430264453_Fig07-18.jpg](img/9781430264453_Fig07-18.jpg)\n\n图 7-18.\
  \ 选择图表类型\n\n除了更改图表类型之外，`数据透视图工具`选项卡还允许您使用大量设计和格式选项来自定义图表和图形的外观和感觉。花时间尝试这些工具并创建各种图表，以更好地了解可用的各种选项，这绝对是值得的。\n\
  \n### 使用多个图表和表格\n\n\n\n在创建数据透视表和图表以展示和理解数据时，您通常希望构建一个能轻松确定绩效的仪表板。您可能关注销售绩效、网络性能或流水线表现。仪表板将关键绩效指标（KPI）、图形和图表等可视化表现形式整合为流程的整体视图。虽然从技术上讲它们并非仪表板工具，但您可以使用\
  \ Excel 结合 Power Pivot 数据透视表和图表创建非常引人注目的数据展示，然后可在 SharePoint 中展示和共享这些数据。\n\n向仪表板添加多个图表和表格时，您可能希望将它们链接起来，以便用不同方式呈现相同的数据。您还很可能希望通过相同的切片器来控制它们，使其保持同步。最简单的方法是使用`插入`选项卡并选择`数据透视图和数据透视表`进行添加（参见图\
  \ 7-19）。\n\n![9781430264453_Fig07-19.jpg](img/9781430264453_Fig07-19.jpg)\n\n图 7-19。添加数据透视图和相关数据透视表\n\
  \n通过这种方式添加数据透视图和数据透视表，会在它们之间建立链接，以便当您向其中一个添加字段时，也会向另一个添加相同的字段。此外，当您向页面添加切片器时，它会自动将切片器同时连接到数据透视表和数据透视图。图\
  \ 7-20 展示了一个简单的仪表板，其中包含一个链接的数据透视表、数据透视图和切片器。\n\n![9781430264453_Fig07-20.jpg](img/9781430264453_Fig07-20.jpg)\n\
  \n图 7-20。在 Excel 中创建简单仪表板\n\n如果需要连接多个图表，请打开模型设计器，然后在`开始`选项卡上选择`数据透视表`下拉菜单（参见图 7-21）。这还允许您插入平面数据透视表，这对于打印非常有用。\n\
  \n![9781430264453_Fig07-21.jpg](img/9781430264453_Fig07-21.jpg)\n\n图 7-21。连接多个数据透视图\n\
  \n### 使用多维数据集函数\n\n使用 Excel 内置的`数据透视图`和`数据透视表`布局，您可以创建引人注目的仪表板，并为数据浏览提供出色的界面。然而，有时您可能会对这些结构固有的某些局限性感到沮丧。例如，您无法在数据透视表内部插入自己的列来创建自定义计算。您也可能希望以非表格格式显示数据以生成自定义报告。这正是\
  \ Excel 多维数据集函数大显身手的地方。\n\nExcel 多维数据集函数允许您直接连接到 Power Pivot 数据模型，而无需使用数据透视表。这些多维数据集函数是\
  \ Excel 函数（与 DAX 函数相对），可以在`Excel 公式`选项卡的`其他函数`下拉菜单中找到（参见图 7-22）。\n\n![9781430264453_Fig07-22.jpg](img/9781430264453_Fig07-22.jpg)\n\
  \n图 7-22。使用多维数据集函数连接到模型\n\n了解这些函数用法的最简单方法是创建一个数据透视表，然后在`数据透视表工具 分析`选项卡上，选择`OLAP\
  \ 工具`下拉菜单，再选择`转换为公式`选项（参见图 7-23）。\n\n![9781430264453_Fig07-23.jpg](img/9781430264453_Fig07-23.jpg)\n\
  \n图 7-23。将数据透视表转换为多维数据集函数\n\n图 7-24 显示了转换为多维数据集函数后的表格。它使用 `CUBEMEMBER` 函数从多维数据集返回一个成员或元组（有序列表），并使用\
  \ `CUBEVALUE` 函数从多维数据集返回一个聚合值。\n\n![9781430264453_Fig07-24.jpg](img/9781430264453_Fig07-24.jpg)\n\
  \n图 7-24。使用多维数据集函数检索值\n\n以下公式用于返回单元格 C3 的列标签：\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
  ,\"[Geography].[CountryRegionCode].&[AU]\")\n```\n\n第一个参数是数据模型连接的名称，第二个参数是成员表达式。\n\
  \n单元格 C4 中的值通过以下公式返回：\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\",$B$2,$B4,C$3)\n\
  ```\n\n此公式使用了单元格引用，但您可以将这些引用替换为这些单元格中包含的多维数据集函数：\n\n```\n=CUBEVALUE\n(\n    \"ThisWorkbookDataModel\"\
  ,\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Measures].[Sum of SalesAmount]\"\
  ),\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"\
  ),\n    CUBEMEMBER(\"ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\"\
  )\n)\n```\n\n请注意，其中一个参数是返回您所需值的聚合值的 `CUBEMEMBER` 函数；其他参数使用 `CUBEMEMBER` 来定义用于聚合的多维数据集部分。\n\
  \n![9781430264453_Fig07-25.jpg](img/9781430264453_Fig07-25.jpg)\n\n图 7-25。重新排列数据\n\
  \n现在，您可以重新排列值和标签，以获得所需的布局和格式（参见图 7-25）。\n\n### 动手实验——在 Excel 中创建 BI 界面\n\n在以下实验中，您将：\n\
  \n*   向数据透视表添加条件格式。\n*   创建图表以帮助分析数据。\n*   链接数据透视表和数据透视图。\n*   使用多维数据集函数显示模型数据。\n\
  \n1.  在 `LabStarters` 文件夹中，打开 `LabChapter7.xlsx` 文件。该文件包含来自测试 AdventureWorksDW 数据库的库存和销售数据。\n\
  2.  在 Excel 的 Sheet1 中，使用`插入`选项卡上的`数据透视表`按钮插入一个 Power Pivot 表格。选择`使用外部数据源`，然后单击`选择连接`按钮。在`现有连接`窗口的`表格`选项卡上，选择`工作簿数据模型中的表格`（参见图\
  \ 7-26）。\n\n![9781430264453_Fig07-26.jpg](img/9781430264453_Fig07-26.jpg)\n\n图 7-26。选择连接\n\
  \n3.  将 `ResellerSales` 表中的 `TotalQuantity`、`TotalSales` 和 `TotalMargin` 添加到`字段列表`窗口的`值`拖放区域。将\
  \ `Calendar` 层次结构添加到`行标签`拖放区域。\n4.  请注意，有些利润是负值。为了突出显示负值，您将把它们格式化为红色。\n5.  选择数据透视表中的一个\
  \ `TotalMargin` 单元格。在`开始`选项卡上，单击`条件格式`下拉菜单。选择`突出显示单元格`![image](img/arrow.jpg)`小于`选项。将小于\
  \ 0 的单元格格式化为红色文本（参见图 7-27）。\n\n![9781430264453_Fig07-27.jpg](img/9781430264453_Fig07-27.jpg)\n\
  \n图 7-27。设置条件格式\n\n6.  完成后，您应会在所选单元格旁边看到一个图标。单击它并选择`显示 TotalMargin 值的所有单元格`选项。\n\
  7.  选择一个 `TotalSales` 单元格。这次，在`条件格式`下拉菜单下选择`数据条`。选择一种渐变样式。选择`数据条`后，您应会在值旁边看到一个小图标。单击它并选择`显示\
  \ TotalSales 值的所有单元格`。\n8.  您的数据透视表应类似于图 7-28。展开年份，注意格式化会显示在季度、月份和年份上。\n\n![9781430264453_Fig07-28.jpg](img/9781430264453_Fig07-28.jpg)\n\
  \n图 7-28。向数据透视表添加数据条\n\n\n\n9. 打开`sheet2`，在“插入”选项卡中，选择`PivotChart`下拉菜单。从下拉菜单中选择数据透视图。使用“工作簿中的数据模型”表连接，将图表插入到当前工作表中。\n\
  10. 在“字段列表”窗口中，将`ResellerSales`表中的`TotalSales`添加到“值”区域，并将`Geography`表中的`CountryRegionName`添加到“轴字段”区域。您应该会看到一个按国家/地区显示销售额的柱形图（参见图\
  \ 7-29）。\n\n![9781430264453_Fig07-29.jpg](img/9781430264453_Fig07-29.jpg)\n\n图 7-29.\
  \ 添加柱形图选择柱形图。您应该会看到“数据透视图工具”选项卡。在“设计”选项卡中，您可以更改图表颜色、布局和图表类型。\n\n11. 在“布局”选项卡中，您可以更改标题、图例、标签和网格线。“格式”选项卡允许您格式化图表中的形状和文本。“分析”选项卡允许您显示/隐藏字段按钮。\n\
  12. 将图表的标题重命名为**Sales By Country**。隐藏字段按钮和图例。移除网格线。\n13. 右键单击垂直轴并选择“设置坐标轴格式”。在“坐标轴选项”下，将“显示单位”更改为“百万”。在“数字”节点下，将“类别”更改为“货币”，小数位数设为`0`。您的图表应类似于图\
  \ 7-30。\n\n![9781430264453_Fig07-30.jpg](img/9781430264453_Fig07-30.jpg)\n\n图 7-30.\
  \ 格式化柱形图\n\n14. 有时您希望同时查看数据图表和数据表。为此，请转到“Power Pivot 模型设计器”，在“开始”选项卡中选择`PivotTable`下拉菜单。从下拉菜单中选择“图表和表格（水平）”。在新工作表中插入图表和表格。\n\
  15. 将图表类型更改为饼图。在图表的“字段列表”窗口中，将`TotalSales`字段添加到“值”区域，并将`CountryRegionCode`添加到“轴字段”区域。\n\
  16. 将图表标题更改为**Sales By Country**并移除字段按钮。\n17. 在“设计”选项卡上，将“图表布局”更改为以货币形式（无小数）显示数值（参见图\
  \ 7-31）。\n\n![9781430264453_Fig07-31.jpg](img/9781430264453_Fig07-31.jpg)\n\n图 7-31.\
  \ 创建销售饼图\n\n18. 单击数据透视表以调出其“字段列表”窗口。将`ResellerSales`表中的`TotalSales`添加到“值”区域。将`Product\
  \ Subcategory`添加到“行标签”区域。\n19. 选中饼图，为产品类别和年份各插入一个切片器（参见图 7-32）。验证切片器是否仅过滤饼图而不影响数据透视表。\n\
  \n![9781430264453_Fig07-32.jpg](img/9781430264453_Fig07-32.jpg)\n\n图 7-32. 插入切片器\n\
  \n20. 选择“年份”切片器，在“切片器工具选项”选项卡中，单击“报表连接”按钮。添加与饼图位于同一工作表上的数据透视表。对类别切片器重复此步骤。\n21.\
  \ 验证切片器是否同时过滤图表和数据透视表。您的仪表板应类似于图 7-33。\n\n![9781430264453_Fig07-33.jpg](img/9781430264453_Fig07-33.jpg)\n\
  \n图 7-33. 创建仪表板\n\n22. 在工作簿中添加一个新工作表。您将使用多维数据集函数来计算总销售额最高的产品和最高的经销商。最终结果应类似于图 7-34。\n\
  \n![9781430264453_Fig07-34.jpg](img/9781430264453_Fig07-34.jpg)\n\n图 7-34.\n\n23.\
  \ 在`B1`单元格中添加以下代码以选择`TotalSales`度量值。\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
  ,\"[Measures].[TotalSales]\")\n```\n\n24. 在`B2`单元格中，使用以下函数获取按`TotalSales`降序排列的经销商集。您将使用此集来选择排名最高的经销商。\n\
  \n```\n=CUBESET(\"ThisWorkbookDataModel\",\n    \"[Reseller].[ResellerName].children\"\
  ,\"Top Reseller\",2,B1)\n```\n\n25. 在`B3`单元格中，使用此函数获取按`TotalSales`降序排列的产品集。\n\n\
  ```\n=CUBESET(\"ThisWorkbookDataModel\",\n     \"[Product].[Product].children\"\
  ,\"Top Products\",2,B1)\n```\n\n26. 在`C2`单元格中，使用`CUBERANKEDMEMBER`函数从`B2`单元格中函数返回的集中获取排名最高的经销商。\n\
  \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n```\n\n27. 在`C3`单元格中，使用`CUBERANKEDMEMBER`函数从`B3`单元格中函数返回的集中获取排名最高的产品。\n\
  \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B3,1)\n```\n\n28. 在`D2`单元格中，使用`CUBEVALUE`函数获取`C2`单元格中找到的顶级经销商的总销售额。请注意，您必须将`C2`中找到的经销商名称与`Power\
  \ Pivot`模型中的`[Reseller].[ResellerName]`属性连接起来。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
  ,\n    \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\")\n\
  ```\n\n29. 使用类似的`CUBEVALUE`函数，您可以获取顶级产品的总销售额值。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
  ,\n      \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\")\n```\n\
  \n#### 总结\n\n正如您在本文中所见，`Excel`是一个功能丰富的环境，可使用数据透视表和数据透视图创建仪表板。至此，您应该能够熟练地使用工作簿模型作为数据源来创建数据透视表和数据透视图。您还使用了`Excel`多维数据集函数直接查询模型，而无需使用数据透视表。本章涵盖了入门的基础知识，但您还需要学习更多关于`Excel`及其如何帮助您分析数据的知识。我鼓励您深入探索这些功能。下一章是三个章节中的第一个，您将在其中了解`Power\
  \ Pivot`模型的另一个有用界面。`Power View`为用户提供了一个丰富的交互式界面来探索数据。您将首先了解如何优化模型以用于`Power View`分析，然后使用`Power\
  \ View`创建标准报表，之后，您将学习如何使用`Power View`创建引人注目的交互式报表。\n\n---\n\n## 第 2 部分\n\n![image](img/frontdot.jpg)\n\
  \n使用`Power View`构建交互式报表和仪表板\n\n## 第 8 章\n\n![image](img/frontdot.jpg)\n\n优化`Power\
  \ Pivot`模型以用于`Power View`\n\n`Power View`是`Excel`中的一种工作表类型，允许用户开发交互式可视化效果，从而鼓励对数据进行临时探索。对于想要探索和洞察数据但并非`Excel`高级用户的用户来说，它是一个理想的工具。由于`Power\
  \ View`可视化效果基于`Power Pivot`模型，您需要为用户提供一个可靠的模型作为这些可视化效果的基础。一个经过调整以适用于`Power View`的良好`Power\
  \ Pivot`模型将带来卓越的用户体验，而非极其糟糕的用户体验。有多种方法可以优化`Power Pivot`模型，以使其在`Power View`中更好地创建报表。本章将回顾这些设置，并展示如何创建支持许多`Power\
  \ View`功能的模型。\n\n完成本章后，您将能够：\n\n*   了解`Power View`中可用的可视化类型。\n*   在`Power View`中创建基本可视化效果。\n\
  *   设置`Power Pivot`模型中的属性以改善`Power View`体验。\n\n![Image](img/sq.jpg) **注** 如需彩色图片副本，请访问源代码/下载页面，网址为`http://www.apress.com/9781430264453`。\n\
  \n## 使用`Power View`可视化数据\n\n\n\n"
- '# Power View 数据可视化


  正如我们在第 7 章中看到的，你可以使用 Excel 数据透视表和图表创建强大的数据可视化并进行深入的数据分析。如果你是一名 Excel 高级用户，并且在工作职责中包含详细的数据分析，那么这些工具将是你的首选。另一方面，如果你需要一个工具来让用户从你的
  Power Pivot 模型中快速创建直观的可视化，那么 Power View 是一个绝佳的选择。你可以使用 Power View 创建包含上下文关联的可视化内容的引人注目的仪表板，这些可视化内容可以轻松进行筛选、排序和钻取。Power
  View 报表可以作为 Excel 工作表或 SharePoint 库中的内容进行托管。一个额外的好处是，它们可以导出到 PowerPoint，以便在演示中使用，同时保留其交互性。图
  8-1 展示了一个包含关联图表和图形的 Power View 报表示例。当点击图表上的一个条形时，图形会按该国家和年份进行筛选。


  ![9781430264453_Fig08-01.jpg](img/9781430264453_Fig08-01.jpg)


  图 8-1. Power View 中的交互式图表和图形


  使用 Power View，你可以创建常见的可视化内容，例如表格、矩阵、图表和图形。此外，你还可以创建包含时间轴的散点图，以揭示数据随时间的变化（参见图 8-2）。


  ![9781430264453_Fig08-02.jpg](img/9781430264453_Fig08-02.jpg)


  图 8-2. 为散点图添加播放轴


  由于 Power View 使用 Bing Maps 图块，你可以将数据呈现在交互式地图上，并在探索数据时进行缩放和平移，直至街道地址级别。图 8-3 展示了按县划分的降雨量地图。


  ![9781430264453_Fig08-03.jpg](img/9781430264453_Fig08-03.jpg)


  图 8-3. 按县划分的降雨量地图


  Power View 中另外两种可用的数据可视化类型是卡片（`Cards`）和磁贴（`tiles`）。卡片以索引卡样式显示每一行的数据。例如，你可以查看员工的联系信息，如图
  8-4 所示。


  ![9781430264453_Fig08-04.jpg](img/9781430264453_Fig08-04.jpg)


  图 8-4. 卡片样式的员工信息


  磁贴可视化允许你使用包含文本和图像的选项卡条对数据进行交互式筛选。例如，图 8-5 展示了如何使用磁贴，通过选项卡条中的区域地图图像来按区域筛选销售额。


  ![9781430264453_Fig08-05.jpg](img/9781430264453_Fig08-05.jpg)


  图 8-5. 在 Power View 中使用磁贴图像


  现在你已经熟悉了 Power View 中可用的几种可视化类型，接下来让我们看看创建一些基本报表的过程。


  ### 创建基本报表


  Power View 报表基于 Excel 中的 Power Pivot 模型。要创建报表，请打开包含模型的 Excel 工作簿，在"插入"选项卡上，单击"Power
  View"按钮（参见图 8-6）。


  ![9781430264453_Fig08-06.jpg](img/9781430264453_Fig08-06.jpg)


  图 8-6. 插入 Power View 报表


  这将在工作簿中插入一个新选项卡，并显示 Power View 设计界面。设计界面包含数据可视化区域、筛选区域和 Power View 字段窗口。Power View
  字段窗口包含暴露给客户端工具的 Power Pivot 模型的表和字段（参见图 8-7）。


  ![9781430264453_Fig08-07.jpg](img/9781430264453_Fig08-07.jpg)


  图 8-7. Power View 设计界面


  在 Power View 中创建可视化的关键之一是从表格视图开始，一旦选定了字段，就可以将表格视图切换为其他数据可视化类型。如果你展开 Power View 字段列表中的表节点，将看到可用的字段。如果你想创建一个按销售区域显示销售额的条形图，首先将所需字段拖动到字段拖放区域。这将在设计界面上创建一个表格视图。选中该表格视图后，你可以在"设计"选项卡上选择不同的可视化类型（参见图
  8-8）。


  ![9781430264453_Fig08-08.jpg](img/9781430264453_Fig08-08.jpg)


  图 8-8. 更改可视化类型


  切换可视化类型后，字段列表下的拖放区域将根据可视化类型而变化。图 8-9 显示了条形图的拖放区域。你可能需要重新排列字段，并且可以向拖放区域添加其他字段以获得所需的可视化效果。


  ![9781430264453_Fig08-09.jpg](img/9781430264453_Fig08-09.jpg)


  图 8-9. 条形图拖放区域


  你可以轻松地将一种可视化类型切换为另一种。例如，如果你选中条形图并在"设计"选项卡中选择其他图表下拉列表，可以将其切换为饼图（参见图 8-10）。


  ![9781430264453_Fig08-10.jpg](img/9781430264453_Fig08-10.jpg)


  图 8-10. 切换可视化类型


  现在你已经了解了如何创建基本可视化（将在第 9 章和第 10 章中学习创建更复杂的可视化），接下来让我们看看如何利用 Power Pivot 模型来改善 Power
  View 中的设计者和用户体验。


  ### 改善 Power View 体验


  让 Power Pivot 模型的用户在 Power View 中构建和探索各种可视化内容时获得愉快的体验非常重要。例如，你应该只暴露对用户有意义的字段。隐藏用于关联模型中表的关键值总是一个好主意。要从
  Power View 中可用字段列表中隐藏列，请右键单击该列并选择"从客户端工具中隐藏"（这将在模型设计器中将该列变为灰色）。图 8-11 展示了隐藏一个没有业务意义的`CustomerID`字段。


  ![9781430264453_Fig08-11.jpg](img/9781430264453_Fig08-11.jpg)


  图 8-11. 从客户端工具中隐藏字段


  如果你查看图 8-11 中弹出菜单的底部，你将看到可以为字段输入描述。当你在 Power View 中悬停在该字段上时，将显示此描述。此选项也适用于模型中创建的度量，并且对于需要了解度量如何定义的业务用户非常有用。图
  8-12 显示了在 Power View 中显示的描述。


  ![9781430264453_Fig08-12.jpg](img/9781430264453_Fig08-12.jpg)


  图 8-12. 添加字段描述可改善用户体验



  查看 Figure 8-12 中的字段列表时，请注意字段前面的图标。计算器图标表示该度量值是在`Power Pivot`模型中创建的。求和符号（Σ）表示该字段是数值型的，拖放到字段放置区域时会进行聚合。默认的聚合方式是求和，但这可能并非所需的聚合方式。在某些情况下，您可能不希望聚合某个数值；例如，在日期表中，年份字段不应被聚合。您可以在`Power
  Pivot`模型的`Advanced`选项卡上，通过设置“`Summarize By`”下拉列表来控制此行为（参见 Figure 8-13）。


  ![9781430264453_Fig08-13.jpg](img/9781430264453_Fig08-13.jpg)


  Figure 8-13. 设置字段的默认汇总方式


  除了设置字段级属性外，您还可以在`Power Pivot`模型中设置一些表级属性，以便更轻松地在`Power View`中创建报表。如果您查看`Power Pivot`模型设计器中某个表的`Advanced`选项卡，您会看到一个“`Default
  Field Set`”按钮（参见 Figure 8-13）。选择此按钮将允许您指定该表的默认字段集（参见 Figure 8-14）。设置后，`Power View`用户只需单击`Power
  View`字段列表中的表节点，即可快速创建表格（参见 Figure 8-15）。


  ![9781430264453_Fig08-14.jpg](img/9781430264453_Fig08-14.jpg)


  Figure 8-14. 为表设置默认字段


  ![9781430264453_Fig08-15.jpg](img/9781430264453_Fig08-15.jpg)


  Figure 8-15. 在`Power View`中使用默认字段


  在`Power View`中创建可视化时，它会根据所选字段和可视化类型自动对项目进行分组。您可以通过在`Power Pivot`模型中设置“`Table Behavior`”属性来控制分组的评估方式。您可以在模型设计器的`Advanced`选项卡上访问“`Table
  Behavior`”属性（参见 Figure 8-13）。单击“`Table Behavior`”按钮将显示“`Table Behavior`”设置窗口（参见
  Figure 8-16）。


  ![9781430264453_Fig08-16.jpg](img/9781430264453_Fig08-16.jpg)


  Figure 8-16. 设置表行为


  您可以为一个表设置的“`Table Behavior`”属性包括行标识符、指示唯一性的列、默认标签和默认图像。行标识符用于指明唯一标识每一行的字段（通常称为主键）。此字段必须唯一且不能为空。设置行标识符后，您可以选择哪些列包含应保持唯一的值。例如，您可能有两个同名的员工，您不希望将一个员工的记录与另一个员工的记录分组在一起。默认标签和默认图像用于`Power
  View`的卡片和磁贴类型可视化，设置后可提供更美观的格式样式。Figure 8-17 展示了同一张卡片的两种不同格式。上方的卡片显示了设置默认标签和图像后的格式，下方的卡片显示了未设置时的格式。


  ![9781430264453_Fig08-17.jpg](img/9781430264453_Fig08-17.jpg)


  Figure 8-17. 设置默认标签和图像的效果


  `Power Pivot`模型设计器的`Advanced`选项卡上最后一个可用的设置是字段的“`Data Category`”设置（参见 Figure 8-18）。这对于位置类型（如城市、邮政编码和国家/地区）非常有用。当`Power
  View`知道某列是位置类型时，它可以使用该字段通过`Bing`地图图层实现可视化。其他有用的数据类别包括图像和`Web` URL。设置这些类别后，`Power
  View`将知道它们是超链接并相应地设置格式。


  ![9781430264453_Fig08-18.jpg](img/9781430264453_Fig08-18.jpg)


  Figure 8-18. 为字段设置数据类别


  至此，您应该已经很好地理解了`Power Pivot`模型中的设置如何影响`Power View`中的用户体验。在下面的动手实验中，您将获得处理这些属性的实践经验。


  ### 动手实验——为 Power View 优化 Power Pivot 模型


  在下面的实验中，您将：


  *   为`Power View`优化一个`Power Pivot`模型。

  *   在`Power View`中创建一个表格和一个卡片可视化。

  *   探索表视图筛选。


  1.  在`LabStarters`文件夹中，打开`LabChapter8.xlsx`文件。此文件包含来自测试`AdventureWorks`数据库的销售数据。

  2.  在`Excel`中选择`Insert`选项卡，然后单击`Power View`按钮。这将在工作簿中插入一个`Power View`报表工作表。在`Power
  View`字段窗口中，展开`Customer`节点并观察字段列表（参见 Figure 8-19）。


  ![9781430264453_Fig08-19.jpg](img/9781430264453_Fig08-19.jpg)


  Figure 8-19. 向`Power View`公开的客户字段


  3.  请注意，`CustomerID`、`CustomerAlternateKey`和`GeographyKey`已暴露给用户。转到`Power Pivot`模型并隐藏这些键。

  4.  如果查看 Figure 8-19 中的`Age`字段，您会看到该字段前面有一个求和符号（Σ）。这意味着如果您将此字段拖到放置区域，它将对年龄进行求和。要在`Power
  Pivot`模型中更改此设置，请选择`Age`列，然后在`Advanced`选项卡上的“`Summarize By`”下拉列表中，选择“`Do Not Summarize`”。对`NumberCarsOwned`、`NumberChildrenAtHome`和`TotalChildren`列重复此操作。

  5.  如果查看 Figure 8-19 中的`Country`字段，您会看到该字段前面有一个地球图标。这表明此字段是位置类型字段。要验证这一点，请在`Power
  Pivot`模型中选择`Country`字段，然后选择`Advanced`选项卡。请注意，`Data Category`已设置为“`Country/Region
  (Suggested)`”。模型使用列名来猜测此设置。

  6.  将`StateProvince`和`City`列设置为适当的数据类别。返回`Power View`字段列表，注意这些字段现在有了地球图标。

  7.  在`Power View`字段列表中展开`Date`表。请注意，存在许多您不希望使用的默认汇总，以及许多您不希望显示的字段。更新模型，使最终的字段列表看起来像
  Figure 8-20。同时，设置`MonthName`列按`MonthNumberOfYear`排序，并向模型添加一个日历层级结构和一个财务层级结构。


  ![9781430264453_Fig08-20.jpg](img/9781430264453_Fig08-20.jpg)


  Figure 8-20. 更新后的日期字段


  8.  在`Power View`字段列表中展开`Employee`表。`Power Pivot`模型包含每位员工的照片，但`Power View`无法识别。要解决此问题，请转到`Power
  Pivot`模型，选择`Employee`表，然后在`Advanced`选项卡上，单击“`Table Behavior`”按钮。在`Table Behavior`设置窗口中，将`Row
  Identifier`设置为`EmployeeKey`。将“`Keep Unique Rows`”设置为`FullName`。将`Default Label`设置为`FullName`，并将`Default
  Image`设置为`EmployeePhoto`（参见 Figure 8-21）。



  ![9781430264453_Fig08-21.jpg](img/9781430264453_Fig08-21.jpg)


  图 8-21. 设置表格行为属性


  9.  返回“Power View 字段列表”，展开`Employee`表。请注意，现在可以看到`EmployeePhoto`字段。同时注意`EmployeePhoto`和`FullName`字段前新增了一个图标，表明它们是默认字段。

  10. 将`FullName`、`EmployeePhoto`、`Title`和`Phone`拖放到字段列表下方的`Fields`放置区域。注意观察视图区域正在生成的表格。

  11. 构建好基础表格后，可以将其转换为其他类型的可视化效果。在`Design`选项卡中，选择`Table`下拉菜单，将可视化效果更改为`Card`类型。最终应得到类似于图
  8-22 的可视化效果。


  ![9781430264453_Fig08-22.jpg](img/9781430264453_Fig08-22.jpg)


  图 8-22. 创建员工卡片


  12. 在工作簿中插入一个新的 Power View 工作表。展开`Product`表格节点，注意其中字段数量众多。为方便用户，您可以设置默认字段集，以便他们通过点击表格节点来选择这些字段。

  13. 在 Power Pivot 模型中，选择`Product`表，在`Advanced`选项卡上，点击`Default Field Set`按钮。在`Default
  Field Set`窗口中，选择`ProductName`、`ProductLine`、`Category`、`Subcategory`、`StandardCost`、`DealerPrice`和`ListPrice`，如图
  8-23 所示。


  ![9781430264453_Fig08-23.jpg](img/9781430264453_Fig08-23.jpg)


  图 8-23. 选择默认字段


  14. 返回 Power View 工作表，在“Power View 字段列表”中点击`Product`表。您应该会看到生成了一个由您在步骤 13 中选择的默认字段组成的新表格。

  15. 选中表格后，点击`Power View`选项卡，注意您可以更改主题、字体和文本大小。请尝试更改这些设置。为 Power View 工作表添加一个标题“产品列表”。

  16. 请注意，通过点击表格中的列标题，您可以按任意列进行升序或降序排序。表格右上角有一个筛选器图标。点击此图标以显示表格筛选器（参见图 8-24）。


  ![9781430264453_Fig08-24.jpg](img/9781430264453_Fig08-24.jpg)


  图 8-24. 查看表格筛选器


  17. 点击`Category`字段以显示选择框。筛选表格，使其仅显示配件。点击`DealerPrice`字段；请注意，由于这是一个数字字段，您将看到一个滑块控件。在该字段右侧，您应该看到一个用于切换到高级筛选模式的图标。使用高级筛选模式，将产品列表限制为仅显示经销商价格大于或等于
  25 美元的配件。

  18. 尝试更改和清除筛选器。完成后，保存更改并退出 Excel。


  #### 总结


  一个为 Power View 使用而优化良好的 Power Pivot 模型，将是卓越用户体验与极差用户体验之间的分水岭。本章向您展示了如何优化 Power Pivot
  模型，以便在 Power View 中更好地创建报表。您了解了如何设置表格行为属性和列属性，以及这些设置如何影响 Power View 体验。您还熟悉了在 Power
  View 中创建卡片和表格，以及如何对表格进行筛选和排序。下一章将深入探讨 Power View 报表设计器的功能，展示如何创建基本的可视化类型以及这些可视化内置的交互功能，并演示和讨论跨视图筛选、向下钻取功能和切片器。


