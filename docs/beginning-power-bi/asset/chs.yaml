  #### 本章小结


  一个经过良好优化、可供 Power View 使用的 Power Pivot 模型，是区分卓越用户体验与令人极度沮丧体验的关键。本章展示了如何优化 Power
  Pivot 模型，以便在 Power View 中更轻松地创建报表。你了解了如何设置表格行为属性和列属性，以及这些设置如何影响 Power View 的体验。你还熟悉了如何在
  Power View 中创建卡片和表格，以及如何筛选和排序表格。下一章将深入探讨 Power View 报表设计器的功能，展示如何创建基本的可视化类型以及这些可视化中内置的交互功能。届时将讨论并演示交叉视图筛选、向下钻取功能和切片器。


  ### 第 9 章


  ![image](img/frontdot.jpg)


  #### 使用 Power View 创建标准可视化


  在上一章中，你了解到创建一个与 Power View 良好协作的 Power Pivot 模型至关重要。在本章中，你将研究一些用于创建报表和仪表板的标准可视化。你将熟悉
  Power View 设计器的常见功能。你将构建标准可视化，例如柱形图、条形图和饼图。此外，你还将学习使用散点图，以及如何通过添加播放轴将其转换为气泡图。最后要研究的可视化是如何使用地图进行地理数据分析。


  完成本章后，你将能够：


  *   创建表格和矩阵。

  *   构建条形图、柱形图和饼图。

  *   构建折线图和散点图。

  *   创建基于地图的可视化。


  ![Image](img/sq.jpg) **注意** 如需彩色图片副本，请访问 `http://www.apress.com/9781430264453` 的源代码/下载部分。


  #### 创建表格和矩阵


  正如你在上一章所学，Power View 中的所有可视化都是从表格开始，然后再转换为其他类型的可视化。虽然表格是最基本的数据可视化类型之一，但它仍然是查看数据最有用的方式之一，尤其是在需要查找详细信息时。图
  9-1 显示了一个展示客户联系信息的表格。


  ![9781430264453_Fig09-01.jpg](img/9781430264453_Fig09-01.jpg)


  图 9-1. 客户联系信息


  当你将表格与 Power View 提供的自动筛选功能结合使用时，这将成为根据客户人口统计数据查找客户的好方法。在视图中选中表格后，单击“筛选器”区域中的“表格”选项卡（参见图
  9-2）。表格中的字段将自动显示在表格筛选器列表中。若要向筛选器列表添加一个你想要筛选但又不想显示在表格中的字段，只需将该字段从“Power View 字段列表”拖放到“筛选器”区域即可。


  ![9781430264453_Fig09-02.jpg](img/9781430264453_Fig09-02.jpg)


  图 9-2. 筛选表格


  为表格实现筛选的另一种方法是使用切片器。要创建切片器，首先使用你要进行切片操作的字段创建一个单列表格。选中视图表面上的表格，然后在“设计”选项卡中，单击“切片器”按钮（参见图
  9-3）。


  ![9781430264453_Fig09-03.jpg](img/9781430264453_Fig09-03.jpg)


  图 9-3. 创建切片器


  切片器将筛选视图上的所有数据——甚至其他切片器。图 9-4 展示了在“国家/地区”切片器中的选择如何限制 `StateProvince` 切片器中显示的内容。


  ![9781430264453_Fig09-04.jpg](img/9781430264453_Fig09-04.jpg)


  图 9-4. 使用切片器进行筛选


  矩阵与表格类似，都包含行和列，但矩阵不会显示明细级别记录，而是按行和列标题中显示的字段对数据进行聚合。在 Excel 中创建数据透视表时，其本质上就是一个矩阵。如果矩阵包含层次结构，你可以在层次结构中上下钻取。要创建矩阵，先从一个表格开始，然后将其转换为矩阵。图
  9-5 显示了一个表格，用于展示每个月不同类型经销商的销售利润。


  ![9781430264453_Fig09-05.jpg](img/9781430264453_Fig09-05.jpg)


  图 9-5. 按类型和月份显示的经销商销售利润表格




  如您所见，表格并非展示此类信息的最佳方式。在矩阵中解读信息会容易得多，您可以比较总计值，并可按年、季度和月份进行向下或向上钻取。要将其更改为矩阵，请选中该表格，然后在`设计`选项卡上，选择`表格`下拉菜单，再选择`矩阵`（参见图
  9-6）。


  ![9781430264453_Fig09-06.jpg](img/9781430264453_Fig09-06.jpg)


  图 9-6. 将表格转换为矩阵


  如图 9-7 所示，将表格转换为矩阵后，添加了总计和小计。


  ![9781430264453_Fig09-07.jpg](img/9781430264453_Fig09-07.jpg)


  图 9-7. 包含总计和小计的矩阵


  如果您查看字段列表下方的放置区域，应该会看到值、行和列的放置区域。为了改善矩阵的外观，您可以将`BusinessType`字段拖到`列`放置区域。现在，您可以轻松地并排比较经销商类型（参见图
  9-8）。


  ![9781430264453_Fig09-08.jpg](img/9781430264453_Fig09-08.jpg)


  图 9-8. 按利润比较经销商类型


  要控制`设计`选项卡下矩阵的总计和钻取，请使用`显示级别`和`总计`下拉菜单（参见图 9-9）。


  ![9781430264453_Fig09-09.jpg](img/9781430264453_Fig09-09.jpg)


  图 9-9. 为矩阵启用向下钻取


  启用向下钻取后，矩阵将折叠，仅显示年份级别。当您单击某个年份时，会看到一个箭头图标，允许您向下钻取到日历层次结构中的下一级（参见图 9-10）。当您在层次结构中向下钻取时，会看到另一个箭头，允许您向上钻取层次结构。


  ![9781430264453_Fig09-10.jpg](img/9781430264453_Fig09-10.jpg)


  图 9-10. 在层次结构中向下钻取


  除了希望在矩阵中查看聚合值之外，您通常还希望使用可视化表示形式（例如条形图、柱形图或饼图）来展示这些值。接下来您将了解如何创建这些图表。


  #### 构建条形图、柱形图和饼图


  用于比较数据的一些最常见的数据可视化方式是条形图、柱形图和饼图。条形图和柱形图非常相似。条形图具有水平条形，其中 X 轴是度量值，而 Y 轴包含您要比较的类别。例如，图
  9-11 显示了一个按国家/地区比较 Internet 销售额的条形图。


  ![9781430264453_Fig09-11.jpg](img/9781430264453_Fig09-11.jpg)


  图 9-11. 按国家/地区比较销售额的条形图


  柱形图交换了两个轴，使得度量值在 Y 轴上，类别在 X 轴上。例如，图 9-11 中的条形图同样可以轻松显示为柱形图，如图 9-12 所示。


  ![9781430264453_Fig09-12.jpg](img/9781430264453_Fig09-12.jpg)


  图 9-12. 按国家/地区比较 Internet 销售额的柱形图


  有三种类型的条形图或柱形图可供选择：堆积图、百分比堆积图和簇状图。图 9-12 是一个堆积柱形图，没有图例字段。如果您将`Year`字段拖到`图例`放置区域，它会将可视化更改为图
  9-13 中所示的效果。请注意，每年的值都相互堆叠在一起。


  ![9781430264453_Fig09-13.jpg](img/9781430264453_Fig09-13.jpg)


  图 9-13. 创建堆积柱形图



  虽然堆积柱形图显示的是绝对值，但您可以将其更改为 100% 堆积图，以百分比形式显示相对值。在图 9-14 中，`Country` 字段已移至图例，`Year`
  字段放置在坐标轴上。同时，为了便于比较，数据标签已设置为 `Visible`。


  ![9781430264453_Fig09-14.jpg](img/9781430264453_Fig09-14.jpg)


  图 9-14. 创建 100% 堆积柱形图


  簇状柱形图将不同国家的柱形并排显示，而不是堆叠在一起。图 9-15 展示了与图 9-13 相同的信息，但采用了簇状柱形图的形式。


  ![9781430264453_Fig09-15.jpg](img/9781430264453_Fig09-15.jpg)


  图 9-15. 创建簇状柱形图


  虽然您无法过多控制图表的布局，但可以在 `Design` 选项卡上控制标题、图例和数据标签（参见图 9-16）。


  ![9781430264453_Fig09-16.jpg](img/9781430264453_Fig09-16.jpg)


  图 9-16. 控制图例布局


  与大多数可视化对象一样，在 Power View 中，您拥有自动筛选和排序功能。例如，如果鼠标悬停在图 9-15 中图表的左上角，您会看到将排序依据从 `country
  name` 更改为 `Internet sales amount` 的选项（参见图 9-17）。


  ![9781430264453_Fig09-17.jpg](img/9781430264453_Fig09-17.jpg)


  图 9-17. 更改柱形图的排序方式


  饼图与堆积柱形图或堆积条形图类似，都允许您比较某个类别中各成员的度量值以及该类别的总计。图 9-18 展示了一个饼图，用于比较不同类型分销商的销售额。


  ![9781430264453_Fig09-18.jpg](img/9781430264453_Fig09-18.jpg)


  图 9-18. 使用饼图比较数据


  与柱形图和条形图一样，您对饼图布局的控制非常有限，只能设置标题和图例位置。在撰写本文时，饼图甚至不支持数据标签，这实在令人遗憾。


  虽然条形图、柱形图和饼图非常适合比较不同类别的聚合数据，但如果您想发现数据中的趋势，折线图和散点图是更好的选择。接下来您将研究这些类型的图表。


  #### 构建折线图和散点图


  折线图用于查看同等时间段内的趋势。这些时间段通常是时间单位，包含小时、天、月等。时间段绘制在 x 轴上，度量值绘制在 y 轴上。图 9-19 展示了一天中各小时的航班延误分钟数。每条线代表不同的航空公司。使用此图表，您可以轻松发现一天中的趋势，并比较各航空公司的表现。


  ![9781430264453_Fig09-19.jpg](img/9781430264453_Fig09-19.jpg)


  图 9-19. 使用折线图发现趋势


  如果您需要同时比较两个度量值的趋势，可以使用散点图。散点图将一个度量值绘制在 y 轴上，另一个绘制在 x 轴上。要创建散点图，首先创建一个包含一个类别字段和两个数字字段的表——例如，`reseller
  name`（类别）、`sales amount`（数字）和 `sales profit`（数字）。创建表之后，将可视化对象切换为散点图，该图位于 `Design`
  选项卡上的 `Other Chart` 下拉菜单中。图 9-20 显示了生成的散点图。


  ![9781430264453_Fig09-20.jpg](img/9781430264453_Fig09-20.jpg)



  图 9-20 在散点图中比较数据


  使用散点图，您可以轻松发现数据趋势以及不符合趋势的异常值。


  如果查看散点图的`字段`放置区域（见图 9-21），您会看到`大小`和`颜色`两个放置区域。您可以将另一个度量值添加到`大小`放置框中，将另一个类别添加到`颜色`放置框中。


  ![9781430264453_Fig09-21.jpg](img/9781430264453_Fig09-21.jpg)


  图 9-21 为散点图添加大小和颜色


  一旦为散点图添加了大小轴，它就变成了气泡图。图 9-22 展示了一张气泡图，其中气泡的大小代表经销商员工数量，颜色代表经销商的业务类型。


  ![9781430264453_Fig09-22.jpg](img/9781430264453_Fig09-22.jpg)


  图 9-22 在气泡图中比较数据


  如果查看散点图的放置区域，您应该会看到另一个标记为`播放轴`的放置框。您可以在此框中放入一个基于时间段的字段，这将在散点图下方生成一个播放轴。`播放轴`允许您查看度量值随时间的变化情况。在分析过程中，您可以播放、暂停和回放这些变化。如果您点击图表中的某个气泡，可以查看该时间段内发生的变化轨迹。图
  9-23 显示了一个可用于分析产品销售额随时间比较情况的散点图。


  ![9781430264453_Fig09-23.jpg](img/9781430264453_Fig09-23.jpg)


  图 9-23 为散点图添加播放轴


  除了用于比较数据的标准可视化效果之外，Power View 还允许您使用必应地图在地理位置上查看数据。您将在下一节了解如何创建基于地图的可视化效果。


  #### 创建基于地图的可视化效果


  Power View 的一个出色功能是它可以使用必应地图的磁贴来创建可视化效果。如果您的数据包含城市、州/省和国家/地区等地理字段，那么将数据整合到地图中会非常容易。您可以通过`字段列表`中的地球图标来判断某个字段是否可以进行地理定位（见图
  9-24）。


  ![9781430264453_Fig09-24.jpg](img/9781430264453_Fig09-24.jpg)


  图 9-24 地球图标表示可映射的字段


  要创建地图，首先创建一个包含地理空间字段和您希望在地图上查看的度量值的表格。表格创建完毕后，您可以将其切换为地图。这些位置会以气泡的形式显示在地图上，气泡的大小表示度量值的大小。图
  9-25 显示了按城市划分的销售额，其中地图已放大到加利福尼亚州旧金山地区。


  ![9781430264453_Fig09-25.jpg](img/9781430264453_Fig09-25.jpg)


  图 9-25 在地图上查看数据


  如果查看地图的字段放置区域，您应该会看到`经度`和`纬度`放置框；这允许您在地图上创建精确的位置点。此外，还有一个颜色放置区域，您可以在其中放入一个类别字段。这会将地图上的气泡转换为显示每个类别的饼图（见图
  9-26）。


  ![9781430264453_Fig09-26.jpg](img/9781430264453_Fig09-26.jpg)


  图 9-26 为地图添加类别


  现在您已经了解了如何创建 Power View 中提供的各种可视化效果，是时候通过动手实践来创建一些效果了。


