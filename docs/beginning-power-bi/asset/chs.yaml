  18. 完成后，保存文件并关闭 Excel。


  #### 小结


  创建 Power Pivot 模型的首要步骤之一就是导入数据。在本章中，您学习了如何从各种数据源导入数据。在 Power Pivot 中导入数据的一个优点在于，从不同数据源导入数据的体验是相似的。您需要创建连接、提供查询或选择表、预览和筛选数据，然后将其导入模型中。现在，您已将数据导入到模型中的各个表，接下来需要在这些表之间建立关系。在下一章中，您将了解建立关系的重要性，以及如何通过层次结构来增强模型以辅助数据分析。


  ## 第 3 章


  ![image](img/frontdot.jpg)


  '
- "# 创建数据模型\n\n既然您已经知道如何将数据导入 Power Pivot 模型，下一步就是理解什么构成了一个良好的模型。这在处理 Power Pivot\
  \ 中的数据时非常重要。一个良好的模型将使 Power Pivot 运行得异常快速，并允许您以新颖有趣的方式分析数据。而一个糟糕的模型会导致 Power Pivot\
  \ 运行缓慢，最坏的情况下，在进行数据分析时会产生误导性结果。传统的 Excel 数据透视表基于 Excel 工作表中的单个表。Power Pivot 数据透视表则基于数据模型中的多个表。本章将引导您完成创建稳固模型的过程，该模型将成为您数据分析的基础。此外，您还将了解如何向客户端工具呈现一个用户友好的模型。这包括重命名表和字段、提供合适的数据类型以及隐藏无关字段。\n\
  \n完成本章后，您将能够：\n\n-   解释什么是数据模型\n-   在模型的表之间创建关系\n-   创建并使用星型架构\n-   理解何时以及如何对数据进行反规范化\n\
  -   创建并使用链接表\n-   创建并使用层次结构\n-   创建一个用户友好的模型\n\n#### 什么是数据模型？\n\n从根本上说，数据模型由表、列、数据类型和表关系组成。通常，数据表是为了存储业务实体的数据而构建的；例如，客户数据存储在客户表中，员工数据存储在员工表中。表由定义实体属性的列组成。例如，您可能希望存储客户信息，如姓名、地址、出生日期、家庭规模等。每个属性都有一个数据类型，取决于该属性所包含的信息——姓名应为字符串数据类型，家庭规模应为整数，出生日期应为日期类型。表中的每一行都应该是唯一的。以客户表为例，如果同一客户在多行中出现但属性不同（例如出生日期），您将无法知道哪个是正确的。\n\
  \n\n\n在上一示例中，你会知道其中一行数据是不正确的，因为同一个人不可能有两个不同的生日。不过，在很多情况下，你需要追踪某个实体属性值的变化。例如，产品的标价可能会随时间变化。为了追踪这种变化，你需要添加时间戳来使行唯一。这样一来，每一行就可以通过产品编号和时间戳来唯一标识，如图\
  \ Figure 3-1 所示。\n\n![9781430264453_Fig03-01.jpg](img/9781430264453_Fig03-01.jpg)\n\
  \nFigure 3-1. 使用时间戳追踪变化\n\n一旦确定了模型中的表，关键是要识别这些表是否高效设置。这个过程被称为*规范化*模型。规范化是组织数据以使其更易于查询且效率更高的过程。例如，不应将不相关实体的属性混合在同一个表中——你绝对不希望将产品数据和员工数据放在同一个表中。另一个正确规范化的例子是，不要在一个列中存放多个属性。例如，与其使用一个客户地址列，不如将其拆分为街道、城市、州和邮政编码。这样你就可以轻松地按州或城市分析数据。Figure\
  \ 3-2 所示的电子表格展示了一个典型的非规范化表。如果你发现提供给你的数据规范化不足，你可能需要要求数据提供方将数据拆分为多个表，然后你可以在模型中将这些表关联起来。\n\
  \n![9781430264453_Fig03-02.jpg](img/9781430264453_Fig03-02.jpg)\n\nFigure 3-2. 一个非规范化的表\n\
  \n一旦你确定模型中的表已充分规范化，下一步就是确定这些表之间的关联方式。例如，你需要关联客户表、销售表和产品表，以便分析不同产品在不同年龄段的销售情况。关联不同表的方式是使用*键*。表中的每一行都需要一个列或列组合来唯一标识该行。这称为*主键*。这个键可能很容易识别，例如在数据录入时由业务分配的销售订单号或客户编号。有时，你需要对表进行一些分析才能找到主键，尤其是当你从外部来源获取数据时。例如，你可能获取了包含潜在客户的数据，字段包括姓名、城市、州、邮编、出生日期等。你不能仅使用姓名作为键，因为很可能存在多个同名的客户。如果使用姓名和城市的组合，出现多个客户由同一个键标识的可能性就会降低。当你使用更多列（如邮编和出生日期）时，这种可能性会变得更小。\n\
  \n在模型中关联表时，一个表的主键会成为相关表中的外键。例如，要将客户与其销售记录关联起来，客户键需要包含在销售表中，在那里它被视为外键。在提取数据时，使用键来获取相关数据。到目前为止，出于性能考虑，最好的键类型是单列整数。因此，许多数据库表在设计时都使用了代理键。这个键是在记录加载时分配给该记录的整数。代理键用于连接表，而不是使用自然键。Figure\
  \ 3-3 展示了一个典型的数据库表，其中同时包含代理键（`CustomerKey`）和自然键（`CustomerAlternateKey`）。\n\n![9781430264453_Fig03-03.jpg](img/9781430264453_Fig03-03.jpg)\n\
  \nFigure 3-3. 一个同时包含代理键和自然键的表\n\n了解数据源中使用的键非常重要。如果能够从源中检索到键，那会好得多。当从关系型数据库检索数据时，这通常不是问题，但如果你要整合来自不同系统的数据，请确保你拥有合适的键。\n\
  \n一旦确定了表之间的键，就可以准备在`Power Pivot`模型中创建关系了。\n\n#### 创建表关系\n\n在`Power Pivot`模型中建立表关系时，需要记住一些规则。首先，不能在模型中使用复合键。如果你的表使用了复合键，你需要通过连接复合列来创建一个新列，并将此列用作键。其次，两个表之间只能有一个活动关系路径，但可以有多个非活动关系。第三，关系是一对多的；换句话说，在客户表（一侧）和销售表（多侧）之间创建关系是可以的。然而，直接在客户表和产品表之间创建关系是不允许的，因为一个客户可以购买多个产品，而同一个产品也可以被多个客户购买。在这种情况下，你需要创建一个连接表来连接这些表。\n\
  \n要在`Power Pivot`模型中创建两个表之间的关系，你可以打开`Data Model Manager`并切换到关系图视图。右键点击代表关系多侧的表，然后选择`Create\
  \ Relationship`。这将启动`Create Relationship`窗口。选择相关的查找表（一侧）和键列。Figure 3-4 展示了在`Sales`表和`Store`表之间创建关系。默认情况下，表之间创建的第一个关系被标记为活动关系。\n\
  \n![9781430264453_Fig03-04.jpg](img/9781430264453_Fig03-04.jpg)\n\nFigure 3-4. 创建表关系\n\
  \nFigure 3-5 展示了在关系图视图中最终形成的关系。如果你点击关系箭头，该关系的两个键列会高亮显示。\n\n![9781430264453_Fig03-05.jpg](img/9781430264453_Fig03-05.jpg)\n\
  \nFigure 3-5. 在关系图视图中查看关系\n\n你可以在两个表之间创建多个关系，但请记住，只能有一个是活动关系。如果你试图创建两个活动关系，会收到类似\
  \ Figure 3-6 所示的错误信息。\n\n![9781430264453_Fig03-06.jpg](img/9781430264453_Fig03-06.jpg)\n\
  \nFigure 3-6. 尝试在两个表之间创建第二个活动关系\n\n有时，活动关系并不那么明显。Figure 3-7 展示了`Sales`表和`Date`表之间的一个活动关系，以及`Sales`表和`Store`表之间的另一个活动关系。`Store`表和`Date`表之间还存在一个非活动关系。如果你试图将这个非活动关系设为活动，会收到与\
  \ Figure 3-6 中相同的错误信息。这是因为你可以从`Date`表追踪到`Sales`表，再到`Store`表，从而形成一条活动路径。\n\n![9781430264453_Fig03-07.jpg](img/9781430264453_Fig03-07.jpg)\n\
  \nFigure 3-7. 间接活动关系\n\n你可能会遇到的另一个常见错误是，尝试在两个表之间创建关系时，键在至少一个表中不是唯一的。Figure 3-8 展示了一个`Product`表和一个`Sales`表，两者都包含重复的`ProductNumber`。\n\
  \n![9781430264453_Fig03-08.jpg](img/9781430264453_Fig03-08.jpg)\n\n\n\n图 3-8 `Product`\
  \ 表和 `Sales` 表\n\n当你尝试在这些表之间创建关系时，会出现如图 3-9 所示的错误。\n\n![9781430264453_Fig03-09.jpg](img/9781430264453_Fig03-09.jpg)\n\
  \n图 3-9 出现重复值错误\n\n在本例中，`ProductNumber` 在 `Product` 表中应该是唯一的，但结果显示存在重复值。为了解决这个问题，你需要修改\
  \ `Product` 表数据的查询，以确保不会出现重复值。\n\n现在你已经了解了如何在模型中创建表关系，接下来可以看看使用星型模式的好处。\n\n####\
  \ 创建星型模式\n\n在创建数据模型时，理解模型的用途至关重要。数据库的两大主要用途是捕获数据和报告/分析数据。问题在于，当你为高效数据捕获创建模型时，会降低其分析数据的效率。为了解决这个问题，许多公司将数据捕获数据库与报告/分析数据库分开。幸运的是，在\
  \ Power Pivot 中创建数据模型时，我们只需要针对报告进行优化。\n\n在分析大量数据集时，最佳模型之一是*星型模式*。星型模式由一个中心事实表和围绕它的维度表组成，如图\
  \ 3-10 所示。\n\n![9781430264453_Fig03-10.jpg](img/9781430264453_Fig03-10.jpg)\n\n\
  图 3-10 典型的星型模式\n\n事实表包含与业务或流程相关的定量数据。例如，图 3-10 中的 `Sales` 表包含销售的可测量方面，例如总成本、销售金额和数量。事实表通常包含许多行，并有一个日期或时间组件，用于记录事件发生的时间点。维度表包含关于事件的属性。例如，`Date`\
  \ 表可以告诉你销售发生的时间，并允许你将数据汇总到月、季度或年级别。`Product` 表包含有关所售产品的属性，你可以按产品线、颜色和品牌查看销售情况。`Store`\
  \ 表包含有关参与销售的商店的属性。维度表通常不包含像事实表那样多的行，但可以包含相当多的列。当你问“哪些自行车在不同年龄段销售最好？”之类的问题时，度量值（销售额）来自事实表，而分类（年龄和自行车型号）则来自维度表。\n\
  \n星型模式的主要优点是提供快速的查询性能和聚合处理。缺点是它通常需要大量的预处理，才能将数据从高度规范化的交易系统移到非规范化的报告系统。好消息是，你的企业可能有一个报告系统为传统联机分析处理\
  \ (OLAP) 数据库（例如 Microsoft 的 Analysis Server 或 IBM 的 Cognos）提供数据。如果你能访问这些系统，它们可能是你核心业务数据的最佳来源。\n\
  \n为了从源数据系统创建星型模式，你可能需要执行一些数据非规范化操作，这将在下一节中介绍。\n\n#### 了解何时对数据进行非规范化\n\n虽然事务型数据库系统高度规范化，但报告系统则非规范化为星型模式。如果你无法访问已为你完成非规范化的报告系统，则必须将数据非规范化为星型模式，以便加载你的\
  \ Power Pivot 模型。例如，图 3-11 显示了 `Adventureworks` 事务型销售数据库中包含客户数据的表。\n\n![9781430264453_Fig03-11.jpg](img/9781430264453_Fig03-11.jpg)\n\
  \n图 3-11 高度规范化的模式\n\n为了将客户数据非规范化到模型中，你需要创建一个将数据合并到单个客户维度表中的查询。如果你不熟悉创建复杂查询，最简单的方法是让数据库开发人员创建一个视图，你可以从中提取数据，该视图为你合并了这些表。如果查询不太复杂，你可能可以在导入数据时自己创建。例如，图\
  \ 3-12 显示了一个客户表和一个地理位置表。\n\n![9781430264453_Fig03-12.jpg](img/9781430264453_Fig03-12.jpg)\n\
  \n图 3-12 合并客户和客户位置数据\n\n你可以使用以下查询将它们合并到一个客户维度表中。\n\n```\nSELECT  c.CustomerKey,\
  \ c.BirthDate, c.MaritalStatus, c.Gender,\n        c.YearlyIncome, c.NumberChildrenAtHome,\
  \ c.EnglishOccupation,\n        c.HouseOwnerFlag,  c.NumberCarsOwned, c.CommuteDistance,\n\
  \        g.City, g.StateProvinceName, g.EnglishCountryRegionName, g.PostalCode\n\
  FROM    Customer AS c INNER JOIN\n        Geography AS g ON c.GeographyKey = g.GeographyKey\n\
  ```\n\n虽然你不必成为查询专家才能将数据导入 Power Pivot 模型，但了解查询数据源的基础知识非常有益，即使这仅仅有助于在与数据库开发人员交流时提出正确的问题。\n\
  \n#### 创建链接表\n\n关于 Power Pivot 模型中包含的数据，需要记住一点：它是只读的。在大多数情况下，这是一件好事。你想确保数据仅在源系统中被更改。然而，有时作为数据分析的一部分，你可能希望即时进行调整，并查看它对结果的影响。一个经常发生的例子是*桶分析*。例如，假设你想查看一个连续度量值（如年龄）并将其分为离散的桶（范围），并且在分析过程中需要调整范围。这正是链接表的用武之地。\n\
  \n要创建链接表，首先需要在 Excel 工作表上设置该表。输入数据后，将其高亮显示，并单击快速分析菜单（参见 图 3-13）。在 `Tables` 选项卡下，单击\
  \ `Table` 按钮。\n\n![9781430264453_Fig03-13.jpg](img/9781430264453_Fig03-13.jpg)\n\
  \n图 3-13 创建 Excel 表\n\n创建表后，最好在将其导入 Power Pivot 数据模型之前为其命名。你可以通过选择该表，然后在 `Table\
  \ Tools Design` 弹出窗口的 `Tables` 选项卡下输入表名称来实现（参见 图 3-14）。\n\n![9781430264453_Fig03-14.jpg](img/9781430264453_Fig03-14.jpg)\n\
  \n图 3-14 重命名 Excel 表\n\n表命名后，选中它，然后在 `Power Pivot` 选项卡上，选择 `Add To Data Model`（参见\
  \ 图 3-15）。\n\n![9781430264453_Fig03-15.jpg](img/9781430264453_Fig03-15.jpg)\n\n\
  图 3-15 将表添加到模型\n\n表导入模型后，如果你更改 Excel 工作表中的某些表值，并在 `PowerPivot` 选项卡上选择 `Update All`（参见\
  \ 图 3-15），模型中的链接表将更新为新的值。\n\n#### 创建层次结构\n\n\n\n当分析数据时，使用层次结构来定义不同级别的聚合通常很有帮助。例如，基于年、季度和月份的日历层次结构很常见。像销售金额这样的聚合值会从月份汇总到季度，再到年份。另一个常见的层次结构可能是从部门到大楼，再到区域。然后，你可以将成本向上汇总到不同级别。在\
  \ Power Pivot 模型中创建层次结构非常简单。在模型设计器的关系图视图中，选择包含你想要放入层次结构的属性（列）的表。你将在表格右上角看到一个“创建层次结构”按钮（参见图\
  \ 3-16）。点击该按钮添加层次结构并重命名。然后，你可以将字段拖放到层次结构中，以创建不同的级别。确保字段的排列顺序是从高层级到低层级。\n\n![9781430264453_Fig03-16.jpg](img/9781430264453_Fig03-16.jpg)\n\
  \n图 3-16。创建层次结构\n\n创建层次结构是增加模型可用性，并帮助用户在数据分析中本能地获取更多价值的一种方法。在下一节中，你将看到一些其他可以应用于模型以增加其可用性的操作。\n\
  \n**打造用户友好的模型**\n\n在创建模型时，需要记住的一点是让模型易于使用且直观。模型可能会被其他用户用于分析。该模型还可能用于各种客户端报表和分析工具，例如\
  \ Power View、Power Map 和 Reporting Services。你可以使用一些属性和设置，让这些客户端工具从模型中获得更多功能。\n\n\
  最有效的调整之一是为表和列重命名。使用对业务用户有意义的名称，而不是只对数据库开发人员有意义的晦涩命名约定。另一个好的做法是确保列的数据类型和格式设置正确。来自文本文件的字段可能会被导入为字符串类型，而它实际上是数字数据。此外，你可以隐藏对用户无用的字段，例如用于链接表的代理键。\n\
  \n一个常见的要求是更改列的排序顺序，使其不同于自然排序。最常见的例子是月份。由于它们默认是文本，因此会按字母顺序排序。实际上，你希望它们按月份编号排序。要解决此问题，你可以按表中的任何其他列对一个列进行排序（参见图\
  \ 3-17）。这是一个很好的功能，允许你创建自定义的业务相关排序。\n\n![9781430264453_Fig03-17.jpg](img/9781430264453_Fig03-17.jpg)\n\
  \n图 3-17。按另一列对一列进行排序\n\n你可以使用其他一些设置来为各种客户端工具创建良好的模型。我们将在第 10 章（“优化 Power View 的表格模型”）中更详细地回顾这个主题。\n\
  \n以下动手实验将帮助你巩固本章涵盖的主题。\n\n**动手实验——在 Power Pivot 中创建数据模型**\n\n在以下实验中，你将：\n\n*   创建表关系。\n\
  *   反规范化数据。\n*   创建链接表。\n*   设置层次结构。\n*   制作一个用户友好的模型。\n\n1.  打开 Excel 2013 并创建一个名为\
  \ `LabChapter3.xlsx` 的新文件。\n2.  使用 Power Pivot 数据模型中的表导入向导，连接到 `LabStarters` 文件夹中的\
  \ `Adventureworks.accdb` 文件。\n3.  选择所列出的表和字段并导入数据。\n\n| 源表名 | 友好名称 | 字段 |\n| ---\
  \ | --- | --- |\n| `DimDate` | `Date` | `DateKey` `FullDateAlternateKey` `EnglishMonthName`\
  \ `MonthNumberOfYear` `CalendarQuarter` `CalendarYear` |\n| `DimCustomer` | `Customer`\
  \ | `CustomerKey` `BirthDate` `MaritalStatus` `Gender` `YearlyIncome` `TotalChildren`\
  \ `HouseOwnerFlag` `NumberCarsOwned` |\n| `FactInternetSales` | `Internet Sales`\
  \ | `ProductKey` `OrderDateKey` `ShipDateKey` `CustomerKey` `SalesTerritoryKey`\
  \ `SalesOrderNumber` `SalesOrderLineNumber` `OrderQuantity` `UnitPrice` `TotalProductCost`\
  \ `SalesAmount` |\n\n4.  在 Power Pivot 模型设计器的数据视图模式下，按照表格指示重命名并隐藏列。要隐藏列，请右键单击它，然后从上下文菜单中选择“从客户端工具中隐藏”。\n\
  \n![Table3b](img/Table3b.jpg)\n\n5.  将 Power Pivot 窗口切换到关系图视图。你应该能看到 `Date`、`Customer`\
  \ 和 `Internet Sales` 表。`Customer` 表和 `Internet Sales` 表之间已定义了一个关系。这由表导入向导自动发现。\n\
  6.  将 `DateKey` 从 `Date` 表拖放到 `Internet Sales` 表中的 `OrderDateKey` 上。类似地，在 `DateKey`\
  \ 和 `ShipDateKey` 之间创建一个关系。双击此关系以启动“编辑关系”窗口（参见图 3-18）。尝试将此关系设为活动关系。你会收到一个错误，因为模型中两个表之间只能有一个活动关系。\n\
  \n![9781430264453_Fig03-18.jpg](img/9781430264453_Fig03-18.jpg)\n\n图 3-18。创建表关系\n\
  \n7.  在 Power Pivot 模型设计器窗口的“主页”选项卡上，单击“现有连接”按钮。你应该能看到之前创建的指向 `Adventureworks.accdb`\
  \ 的连接。打开此连接并选择用于导入数据的查询选项。\n8.  在“指定 SQL 查询”窗口中，将查询友好名称更改为 `Product`，然后单击“设计”按钮。\n\
  9.  在设计器中单击“导入”按钮。打开实验启动器文件夹中的 `ProductQuery.txt` 文件。单击红色的感叹号 (!) 以运行查询（参见图 3-19）。此查询合并了来自\
  \ `Product`、`ProductCategory` 和 `ProductSubcategory` 表的数据（即反规范化）。\n\n![9781430264453_Fig03-19.jpg](img/9781430264453_Fig03-19.jpg)\n\
  \n图 3-19。运行查询\n\n10. 在确认获取到数据后，单击“确定”按钮，然后在下一个屏幕上单击“完成”按钮。\n11. 导入数据后，隐藏 `ProductKey`\
  \ 并按下表所示更新列名：\n\n![Table3c](img/Table3c.jpg)\n\n12. 使用 `ProductKey` 在 `Internet\
  \ Sales` 表和 `Product` 表之间创建一个关系。最终的关系图应类似于图 3-20。\n\n![9781430264453_Fig03-20.jpg](img/9781430264453_Fig03-20.jpg)\n\
  \n图 3-20。查看数据模型关系\n\n13. 要创建链接表，请将图 3-21 中显示的数据输入到 Excel 中的一个空白电子表格选项卡中。\n\n![9781430264453_Fig03-21.jpg](img/9781430264453_Fig03-21.jpg)\n\
  \n图 3-21。链接表数据\n\n14. 选中这些单元格，右键单击，在“快速分析”上下文菜单中，选择“表”选项卡，然后单击“表”按钮（参见图 3-22）。在“表工具设计”选项卡中，将表重命名为\
  \ `SalesTerritory`。\n\n![9781430264453_Fig03-22.jpg](img/9781430264453_Fig03-22.jpg)\n\
  \n图 3-22。“快速分析”的“表”选项卡\n\n\n\n15.  在 Power Pivot 选项卡上，单击 `Add To Data Model` 按钮。将表添加到模型后，将其名称更改为\
  \ `Sales Territory`，隐藏 `SalesTerritoryKey`，并创建与 `Internet Sales` 表的关系。\n16.  要创建层次结构，请在\
  \ Power Pivot 窗口的图表视图中选择 `Sales Territory` 表，然后单击 `Create Hierarchy` 按钮。将 `Sales\
  \ Territory Group`、`Country` 和 `Region` 拖放到层次结构中。将层次结构重命名为 `Sales Territory`（参见图\
  \ 3-23）。\n\n![9781430264453_Fig03-23.jpg](img/9781430264453_Fig03-23.jpg)\n\n图 3-23.\
  \ Sales Territory 层次结构\n\n17.  在 `Date` 表中使用 `Year`、`Quarter` 和 `Month` 创建一个名为 `Calendar`\
  \ 的日历层次结构。\n18.  在设计器中切换到数据视图，然后选择 `Date Table` 选项卡。选择 `Month` 列，并将其 `Sort By Column`\
  \ 设置为 `Month No.` 列。\n19.  完成后，保存并关闭 Excel。\n\n总结\n\n使用 Power Pivot 时，理解什么构成了一个好模型至关重要。一个好的模型能让\
  \ Power Pivot 运行得异常快速，并允许你轻松分析大量数据。与传统的 Excel 数据透视表（基于 Excel 工作表中的单个表）不同，Power Pivot\
  \ 数据透视表基于包含在数据模型中的多个表。本章指导你完成了创建坚实模型的过程，该模型将成为你数据分析的基础。此外，你还了解了如何向客户端工具呈现一个用户友好的模型。\n\
  \n现在，你已经为模型打下了坚实的基础，接下来就可以通过自定义计算来扩展模型了。下一章将介绍数据分析表达式 (DAX) 语言，并解释如何在数据模型中创建计算列。其中包含了大量示例，以帮助你创建模型中的常见计算。\n\
  \n第 4 章\n\n![image](img/frontdot.jpg)\n\n使用 DAX 创建计算\n\n现在你已知道如何创建一个健壮的数据模型作为分析基础，下一步是向模型添加任何有助于探索数据所需的计算。例如，你可能需要将代码值转换为有意义的描述，或者解析字符串以获取关键信息。这就是数据分析表达式\
  \ (DAX) 发挥作用的地方。本章将向你介绍 DAX，并展示如何使用 DAX 创建计算列，以增强模型的功能。\n\n完成本章后，你将能够：\n\n*   使用\
  \ DAX 向表添加计算列\n*   实现 DAX 运算符\n*   在 DAX 中使用文本函数\n*   使用 DAX 日期和时间函数\n*   使用条件和逻辑函数\n\
  *   从相关表中获取数据\n*   使用数学、三角和统计函数\n\n什么是 DAX？\n\nDAX 是一种公式语言，用于在 Power Pivot 模型中创建计算列和度量值。它是专门为\
  \ Power Pivot 所基于的表格数据模型而开发的新语言。如果你熟悉 Excel 的公式语法，你会发现 DAX 语法非常相似。实际上，某些 DAX 公式的语法和功能与\
  \ Excel 中的对应公式完全相同。一个你需要理解的主要区别是，Excel 公式基于单元格，而 DAX 基于列。例如，如果要在 Excel 中连接两个值，你会使用类似下面的公式：\n\
  \n```\n=A1 & \" \" & B1\n```\n\n其中 `A1` 是第一行第一列的单元格，`B1` 是第一行第二列的单元格（参见图 4-1）。\n\
  \n![9781430264453_Fig04-01.jpg](img/9781430264453_Fig04-01.jpg)\n\n图 4-1. 在 Excel\
  \ 中输入公式\n\n这与 DAX 公式非常相似：\n\n```\n=[First Name] & \" \" & [Last Name]\n```\n\n其中\
  \ `First Name` 和 `Last Name` 是模型表中的列（参见图 4-2）。\n\n![9781430264453_Fig04-02.jpg](img/9781430264453_Fig04-02.jpg)\n\
  \n图 4-2. 在 Power Pivot 中输入公式\n\n区别在于，DAX 公式应用于表中的所有行，而 Excel 公式仅适用于特定单元格。在 Excel\
  \ 中，你需要在每一行中重新创建公式。\n\n这意味着，尽管你可以在 Excel 中执行类似以下操作：\n\n```\n=A1 & \" \" & B2\n```\n\
  \n即从第一行获取一个单元格并与第二行的一个单元格连接（参见图 4-3），但这在 DAX 中是做不到的。\n\n![9781430264453_Fig04-03.jpg](img/9781430264453_Fig04-03.jpg)\n\
  \n图 4-3. 使用不同行中的单元格\n\n创建 DAX 公式时，考虑数据类型以及计算中可能发生的任何转换非常重要。如果不考虑这些因素，你可能会遇到公式错误或意外结果。模型中支持的数据类型有：整数、小数、货币、布尔值、文本和日期。DAX\
  \ 还有一种表数据类型，它在许多函数中使用，这些函数将表作为输入值并返回一个表。\n\n当你尝试将数值数据类型与文本数据类型相加时，会发生隐式转换。如果 DAX\
  \ 可以将文本转换为数值，它会以数字形式相加；如果不能，你将收到错误。另一方面，如果你尝试将数值数据类型与文本数据类型连接，DAX 会将数值数据类型隐式转换为文本。虽然大多数时候隐式转换会给你想要的结果，但这会带来性能成本，应尽可能避免。例如，如果你从文本文件导入数据，并且列被设置为文本数据类型，但你知道它实际上是数值，你应该更改模型中的数据类型。\n\
  \n在 DAX 中创建计算时，你需要引用表和列。如果表名不包含空格，你可以直接按名称引用。如果表名包含空格，则需要将其括在单引号中。列和度量值则括在方括号中。如果你在公式中仅列出列名，则假定该列存在于同一表中。如果引用另一表中的列，则需要使用完全限定名称，即表名后跟列名。以下代码演示了语法：\n\
  \n```\n=[SalesAmount] - [TotalCost]\n=Sales[SalesAmount] - Sales[TotalCost]\n='Internet\
  \ Sales'[SalesAmount] - 'Internet Sales'[TotalCost]\n```\n\n以下是使用 DAX 时需要牢记的其他要点：\n\
  \n*   DAX 公式和表达式不能修改或插入表中的单个值。\n*   你不能使用 DAX 创建计算行。你只能创建计算列和度量值。\n*   在定义计算列时，你可以将函数嵌套到任意层级。\n\
  \n在创建计算时，首先要了解支持哪些运算符以及使用它们的语法。在下一节中，你将研究各种 DAX 运算符。\n\n实现 DAX 运算符\n\nDAX 包含一套强大的运算符，包括算术、比较、逻辑和文本连接。大多数运算符你都应该很熟悉，并列举在表\
  \ 4-1 中。\n\n表 4-1. DAX 运算符\n\n| 类别 | 符号 | 用途 |\n| --- | --- | --- |\n| 算术运算符 |\n\
  |   | `+` | 加法 |\n|   | `-` | 减法 |\n|   | `*` | 乘法 |\n|   | `/` | 除法 |\n|   | `^`\
  \ | 乘方 |\n| 比较运算符 |\n|   | `=` | 等于 |\n|   | `>` | 大于 |\n|   | `<` | 小于 |\n|   |\
  \ `>=` | 大于或等于 |\n|   | `<=` | 小于或等于 |\n|   | `<>` | 不等于 |\n| 文本连接运算符 |\n|   | `&`\
  \ | 连接 |\n|   |   | 逻辑运算符 |\n|   | `&&` | 与 |\n|   | `&#124;&#124;` | 或 |\n\n\n\n\
  #### 算术运算符示例\n\n以下代码用于将`Margin`列除以`Total Cost`列，从而创建一个新列`Margin Percentage`。\n\n\
  ```\n=[Margin]/[TotalCost]\n```\n\n在同一计算中包含多个算术运算的情况非常常见。此时，您必须注意运算顺序。指数运算优先计算，其次是乘/除，最后是加/减。您可以通过使用括号对计算进行分组来控制运算顺序；例如，以下公式将在除法之前执行减法。\n\
  \n```\n=([Sales Amount]-[Total Cost])/[Total Cost]\n```\n\n比较运算符主要用于`IF`语句。例如，以下计算检查商店的销售面积是否大于\
  \ 1000。如果是，则归类为大型商店，否则归类为小型商店。\n\n```\n=IF([Selling Area Size]>1000,\"Large\",\"\
  Small\")\n```\n\n逻辑运算符用于创建多重比较逻辑。以下代码检查商店面积是否大于 1000 或员工人数是否超过 35，以将其归类为大型商店。\n\n\
  ```\n=IF([Selling Area Size]> 1000 || [Employee Count] > 35,\"Large\",\"Small\"\
  )\n```\n\n当开始串联一系列逻辑条件时，建议使用括号来控制运算顺序。以下代码检查商店面积是否大于 1000 且员工人数是否超过 35，以将其归类为大型商店。此外，如果其年销售额超过\
  \ 1,000,000 美元，无论其面积大小或员工数量如何，也会将其归类为大型商店。\n\n```\n=IF(([Selling Area Size]> 1000\
  \ && [Employee Count] > 35) || [Annual Sales] > 1000000,\"Large\",\"Small\")\n```\n\
  \n在使用`DAX`计算时，您可能需要将一个公式嵌套在另一个公式内部。例如，以下代码将一个`IF`语句嵌套在另一个`IF`语句的`false`部分中。如果员工数量不大于\
  \ 35，则会跳转到下一个`IF`语句，检查是否大于 20。\n\n```\n=IF(Store[EmployeeCount]>35,\"Large\",IF(Store[EmployeeCount]>20,\"\
  Medium\",\"Small\"))\n```\n\n`DAX`包含许多用于创建计算和度量的有用函数。这些函数包括文本函数、日期和时间函数、统计函数、数学函数和信息函数。在接下来的几节中，您将学习如何在计算中使用各种函数类型。\n\
  \n---\n\n#### 使用文本函数\n\n许多计算都涉及某种文本处理。您可能需要截断、解析、搜索或格式化从源系统加载的文本值。`DAX`包含许多用于处理文本的有用函数。这些函数及其用途说明列在表\
  \ 4-2 中。\n\n**表 4-2.** `DAX`文本函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `BLANK` | 返回一个空白。\
  \ |\n| `CONCATENATE` | 将两个文本字符串连接成一个文本字符串。 |\n| `EXACT` | 比较两个文本字符串，如果完全相同则返回`TRUE`，否则返回`FALSE`。\
  \ |\n| `FIND` | 返回一个文本字符串在另一个文本字符串中的起始位置。 |\n| `FIXED` | 将数字四舍五入到指定的小数位数，并将结果作为文本返回。\
  \ |\n| `FORMAT` | 根据指定的格式将值转换为文本。 |\n| `LEFT` | 返回文本字符串开头指定数量的字符。 |\n| `LEN` | 返回文本字符串中的字符数。\
  \ |\n| `LOWER` | 将文本字符串中的所有字母转换为小写。 |\n| `MID` | 从文本字符串中返回指定起始位置和长度的字符串。 |\n| `REPLACE`\
  \ | 用另一个文本字符串替换文本字符串的一部分。 |\n| `REPT` | 将文本重复指定次数。使用`REPT`可以用文本字符串的多个实例填充单元格。 |\n\
  | `RIGHT` | 根据指定的字符数，返回文本字符串中最后一个或多个字符。 |\n| `SEARCH` | 返回从左到右读取时，首次找到特定字符或文本字符串的字符位置编号。\
  \ |\n| `SUBSTITUTE` | 用新文本替换文本字符串中的现有文本。 |\n| `TRIM` | 删除文本中除单词间单个空格之外的所有空格。 |\n\
  | `UPPER` | 将文本字符串转换为全大写字母。 |\n| `VALUE` | 将表示数字的文本字符串转换为数字。 |\n\n作为在计算中使用文本函数的示例，假设产品表中有一个产品代码列，其前两个字符代表产品系列。要创建产品系列列，可以使用`Left`函数，如下所示：\n\
  \n```\n=Left([Product Code],2)\n```\n\n您可以使用`FIND`函数在文本中搜索子文本。您可以使用问号（`?`）匹配任意单个字符，使用星号（`*`）匹配任意字符序列。您可以选择指定搜索的起始位置。`FIND`函数返回找到的子字符串的起始位置。如果未找到子字符串，它可以返回`0`、`-1`或空白值。以下代码在产品描述列中搜索单词“mountain”。\n\
  \n```\n=FIND(\"mountain\",[Description],1,-1)\n```\n\n`FORMAT`函数根据提供的格式将值转换为文本。例如，您可能需要将日期转换为特定格式。以下代码将日期数据类型转换为格式类似“Mon\
  \ - Dec 02, 2013”的字符串。\n\n```\n=FORMAT([StartDate],\"ddd - MMM dd, yyyy\")\n```\n\
  \n除了能够创建自己的格式之外，您还可以使用预定义的格式。以下代码演示了使用长日期格式“Monday, December 2, 2013”。\n\n```\n\
  =FORMAT([StartDate],\"Long Date\")\n```\n\n现在您已经了解了如何使用一些文本函数，接下来要讨论的函数类型是内置的日期和时间函数。\n\
  \n---\n\n#### 使用 DAX 日期和时间函数\n\n您很可能会发现数据分析中带有日期维度。您可能需要查看销售或能源消耗数据，并需要了解事件发生的是星期几。您可能需要计算年龄或到期日期。`DAX`提供了相当多的日期和时间函数来帮助创建此类计算。表\
  \ 4-3 总结了各种可用的日期和时间函数。\n\n**表 4-3.** `DAX`日期和时间函数\n\n\n\n| 函数 | 描述 |\n| --- | ---\
  \ |\n| `DATE` | 以日期时间格式返回指定的日期 |\n| `DATEVALUE` | 将文本形式的日期转换为日期时间格式的日期 |\n| `DAY`\
  \ | 返回某个月份中的第几天 |\n| `EDATE` | 返回起始日期之前或之后指定月数的日期 |\n| `EOMONTH` | 以日期时间格式返回指定月数之前或之后月份最后一天的日期\
  \ |\n| `HOUR` | 返回小时数，范围为 0（凌晨 12:00）到 23（晚上 11:00） |\n| `MINUTE` | 返回分钟数，范围为 0\
  \ 到 59 |\n| `MONTH` | 返回月份数，范围为 1（一月）到 12（十二月） |\n| `NOW` | 以日期时间格式返回当前日期和时间 |\n\
  | `SECOND` | 返回时间值中的秒数，范围为 0 到 59 |\n| `TIME` | 将以数字形式给出的小时、分钟和秒转换为日期时间格式的时间 |\n\
  | `TIMEVALUE` | 将文本格式的时间转换为日期时间格式的时间 |\n| `TODAY` | 返回当前日期 |\n| `WEEKDAY` | 返回一个\
  \ 1 到 7 的数字，用于标识某个日期的星期几 |\n| `WEEKNUM` | 返回给定日期的周数 |\n| `YEAR` | 以四位整数形式返回某个日期的年份\
  \ |\n| `YEARFRAC` | 计算两个日期之间的整天天数在一年中所占的百分比 |\n\n以日期函数的使用为例，你需要计算员工的在职年限。首先要做的是找出当前年份与他们入职年份的差值。以下代码从今天的日期中获取年份。\n\
  \n```\n=YEAR(Today())\n```\n\n现在你可以减去他们入职日期的年份。注意，这里我们将一个函数嵌套在另一个函数中。函数嵌套是许多计算中的常见需求。\n\
  \n```\n=YEAR(TODAY()) - YEAR([HireDate])\n```\n\n敏锐的读者会发现，只有当当前月份大于或等于入职月份时，这个计算结果才是正确的。你可以通过如下条件判断语句来修正这个问题：\n\
  \n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),YEAR(TODAY()) - YEAR([HireDate]),YEAR(TODAY())\
  \ - YEAR([HireDate])-1)\n```\n\n如你所见，计算很快就会变得相当复杂。挑战在于确保每个函数的左右括号正确对齐。一种组织代码的方法是利用多行和缩进。要在公式编辑栏中换行，你需要在按\
  \ Enter 键的同时按住 Shift 键。我发现下面这种写法更容易理解。\n\n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),\n\
  \        YEAR(TODAY()) - YEAR([HireDate]),\n        YEAR(TODAY()) - YEAR([HireDate])-1\n\
  \     )\n```\n\n不幸的是，在 Power Pivot 中你无法在代码中添加注释。\n\n通常有多种方法可以创建计算。你可能会找到一种更简单或性能更好的计算方法。以下使用\
  \ `YEARFRAC` 函数和 `TRUNC` 函数（属于数学函数）来计算在职年限，并去除数字的小数部分。\n\n```\n=TRUNC(YEARFRAC([HireDate],TODAY()))\n\
  ```\n\n接下来你要研究的一组函数是信息函数和逻辑函数。当你需要确定某个条件是否存在，例如是否存在空白值，或因计算而是否发生错误时，这些函数非常重要。这些函数允许你捕捉条件并以恰当的方式做出响应。\n\
  \n使用信息函数和逻辑函数\n\n当你开始构建更复杂的计算时，通常需要使用信息函数和逻辑函数来检查条件并对各种情况做出响应。一个常见的例子是检查空白值的需求。如果值为空白，`ISBLANK`\
  \ 函数返回 TRUE；否则返回 FALSE。以下代码根据中间名是否为空白来使用不同的计算方法。\n\n```\n=IF(ISBLANK([MiddleName]),\n\
  [FirstName] & \" \" & [LastName],\n[FirstName] & \" \" & [MiddleName] & \" \" &\
  \ [LastName]\n)\n```\n\n\n`ISERROR`函数用于检查某个计算或函数是否返回错误。以下计算检查除法运算中是否发生除零错误。\n\n\
  ```\n=IF(ISERROR([TotalProductCost]/[SalesAmount]),\n     BLANK(),\n     [TotalProductCost]/[SalesAmount]\n\
  \   )\n```\n\n另一种创建该计算的方法是使用`IFERROR`函数，该函数在无错误时返回原值，在发生错误时返回替代值。\n\n```\n=IFERROR([TotalProductCost]/[SalesAmount],BLANK())\n\
  ```\n\n表 4-4 和 4-5 列出了 DAX 中可用的逻辑函数和信息函数。\n\n表 4-4. DAX 逻辑函数\n\n| 函数 | 描述 |\n| ---\
  \ | --- |\n| `AND` | 检查两个参数是否都为 TRUE。 |\n| `FALSE` | 返回逻辑值 FALSE。 |\n| `IF` | 检查第一个参数提供的条件是否满足。若条件为\
  \ TRUE 则返回一个值，若为 FALSE 则返回另一个值。 |\n| `IFERROR` | 计算表达式，若表达式返回错误则返回指定值；否则返回表达式自身的值。\
  \ |\n| `NOT` | 将 FALSE 变为 TRUE，或将 TRUE 变为 FALSE。 |\n| `OR` | 检查任一参数是否为 TRUE，若为 TRUE\
  \ 则返回 TRUE。 |\n| `SWITCH` | 根据值列表计算表达式，并返回多个可能结果表达式中的一个。 |\n| `TRUE` | 返回逻辑值 TRUE。\
  \ |\n\n表 4-5. DAX 信息函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `CONTAINS` | 如果所有指定列中存在或包含这些值，则返回\
  \ true。 |\n| `ISBLANK` | 检查值是否为空。 |\n| `ISERROR` | 检查值是否为错误。 |\n| `ISLOGICAL` |\
  \ 检查值是否为布尔值。 |\n| `ISNONTEXT` | 检查值是否不是文本（空白单元格不算文本）。 |\n| `ISNUMBER` | 检查值是否为数字。\
  \ |\n| `ISTEXT` | 检查值是否为文本。 |\n| `LOOKUPVALUE` | 返回满足搜索条件的所有指定行中指定列的值。 |\n\n在分析数据时，您通常需要从相关表中查找对应数据。您可能需要从相关代码获取描述，或者汇总数据并将其导入表中，例如生命周期销售额。以下部分将介绍如何使用\
  \ DAX 查找相关数据。\n\n#### 从相关表中获取数据\n\n有时您需要在其他表中查找值以完成计算。如果表之间已建立关系，您可以使用`RELATED`函数。这允许您对表进行反规范化，使用户更易于导航。例如，您可能有一个与地理表相关的客户表（参见图\
  \ 4-4）。\n\n![9781430264453_Fig04-04.jpg](img/9781430264453_Fig04-04.jpg)\n\n图 4-4.\
  \ 使用`RELATED`函数\n\n如果您需要按客户所在国家/地区查看销售额，可以使用`RELATED`函数在客户表中创建一个“国家/地区”列。\n\n```\n\
  =RELATED(Geography[CountryRegionName])\n```\n\n然后，您可以将地理表对客户端工具隐藏，以保持模型更简洁，减少对用户的困扰。\n\
  \n尽管`RELATED`表返回单个值，但有时您需要查看一组相关数据，并在将其显示在列中之前进行聚合。例如，您可能希望在客户表中添加一列，列出其生命周期销售额。在这种情况下，您可以使用`RELATEDTABLE`函数获取相关销售额，然后为每个客户求和。\n\
  \n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n```\n\n![Image](img/sq.jpg) **注意**\
  \ 上述代码使用了`SUMX`函数，而不是`SUM`函数，因为您正在应用筛选器。第 5 章将对此进行更详细的讨论。\n\n我们最后要介绍的一组函数是数学、三角函数和统计函数。这些函数允许您执行常见分析，例如对数、标准差、舍入和截断。\n\
  \n#### 使用数学、三角函数和统计函数\n\n除了迄今讨论的函数外，DAX 还包含相当多的数学、三角函数和统计函数。数学函数（参见表 4-6）用于对数据进行舍入、截断和求和。它们还包含可用于科学、工程和财务计算的函数；例如，您可能需要根据半径计算球体体积（参见以下\
  \ DAX 计算）：\n\n```\n=4*PI()*POWER([Radius],3)/3\n```\n\n表 4-6. DAX 中可用的部分数学和三角函数\n\
  \n| 函数 | 描述 |\n| --- | --- |\n| `ABS` | 返回数字的绝对值。 |\n| `CEILING` | 将数字向上舍入到最接近的整数或最接近的显著性倍数。\
  \ |\n| `EXP` | 返回 e 的指定次幂。 |\n| `FACT` | 返回数字的阶乘。 |\n| `FLOOR` | 将数字向下舍入（朝向零）到最接近的显著性倍数。\
  \ |\n| `LOG` | 返回指定底数的数字的对数。 |\n| `PI` | 返回圆周率 pi 的值（3.14159265358979），精确到 15 位数字。\
  \ |\n| `POWER` | 返回数字的指定次幂结果。 |\n| `ROUND` | 将数字舍入到指定的小数位数。 |\n| `SQRT` | 返回数字的平方根。\
  \ |\n| `SUM` | 对一列中的所有数字求和。 |\n| `TRUNC` | 通过移除数字的小数部分，将数字截断为整数。 |\n\n另一个例子是，假设您想要计算一项投资的复利。以下\
  \ DAX 计算可确定投资的复利回报率。\n\n```\n=[Principal]*POWER(1+([IntRate]/[CompoundRate]),[CompoundRate]*[Years])\n\
  ```\n\n在分析数据时，您通常不仅要关注数据之间的关系，还要关注数据质量以及您对预测的信任程度。这就是数据统计分析发挥作用的地方。通过统计，您可以做诸如识别和处理数据中的异常值、检查数据波动性以及检测欺诈等事情。例如，您可以使用\
  \ DAX 通过标准差来确定和过滤数据中的异常值。以下 DAX 函数计算销售额的标准差。\n\n```\n=STDEVX.P(RELATEDTABLE(Sales),Sales[SalesAmount])\n\
  ```\n\n表 4-7 列出了 DAX 中可用的部分统计函数。\n\n表 4-7. DAX 中可用的部分统计函数\n\n| 函数 | 描述 |\n| ---\
  \ | --- |\n| `AVERAGE` | 返回一列中所有数字的平均值。 |\n| `COUNT` | 计算一列中包含数字的单元格个数。 |\n| `COUNTA`\
  \ | 计算一列中非空单元格的个数。 |\n| `COUNTBLANK` | 计算一列中空白单元格的个数。 |\n| `COUNTROWS` | 计算指定表中的行数。\
  \ |\n| `DISTINCTCOUNT` | 计算一列数字中不同单元格的个数。 |\n| `MAX` | 返回一列中的最大数值。 |\n| `MIN` |\
  \ 返回一列中的最小数值。 |\n| `RANK.EQ` | 返回一个数字在数字列表中的排名。 |\n| `RANKX` | 返回表参数中每一行在数字列表中的排名。\
  \ |\n| `STDEV.S` | 返回样本标准差。 |\n| `TOPN` | 返回指定表的前 N 行。 |\n| `VAR.S` | 返回样本方差。 |\n\
  \n现在您已经了解了 Power Pivot 和 DAX 中可用的函数。我想回顾一些关于创建函数的一般技巧。\n\n#### 在 Power Pivot 中创建计算的技巧\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的格式要求，将给定的英文文本翻译成中文。\n\n\n在让你们开始动手实验之前，我想先给你们一些关于在 Power\
  \ Pivot 中创建这些计算的提示。要为计算列输入公式时，请在模型生成器的数据视图窗口中，右键单击表中的某一列。在上下文菜单中，选择`插入列`（参见 图 4-5）。\n\
  \n![9781430264453_Fig04-05.jpg](img/9781430264453_Fig04-05.jpg)\n\n图 4-5. 添加计算列\n\
  \n重命名该列，然后在公式编辑器栏中输入公式。公式以等号 (`=`) 开头，表名包含在单引号 (`‘’`) 中，如果表名不包含空格，则引号是可选的。表列包含在方括号\
  \ (`[]`) 中。公式编辑器栏提供了自动完成功能，你应该充分利用它（参见 图 4-6）。从下拉列表中选择函数、表或列，然后按 `Tab` 键将其插入公式中。如果你没有看到自动填充下拉列表，那么你的公式中很可能存在错误。\n\
  \n![9781430264453_Fig04-06.jpg](img/9781430264453_Fig04-06.jpg)\n\n图 4-6. 创建计算时使用自动完成功能\n\
  \n公式编辑器栏旁边有三个按钮：`X` 用于取消你所做的更改；勾号用于提交更改；函数符号用于启动`插入函数`窗口（参见 图 4-7）。你可以浏览各种函数并获取有关函数所需参数的信息。\n\
  \n![9781430264453_Fig04-07.jpg](img/9781430264453_Fig04-07.jpg)\n\n图 4-7. 使用函数助手\n\
  \n如果计算的创建不正确，你可能会看到一个错误指示器。你应该点击错误下拉菜单并选择`显示错误`（参见 图 4-8）。这将显示一条错误信息（参见 图 4-9），其中包含有助于你修复错误的有用信息。\n\
  \n![9781430264453_Fig04-08.jpg](img/9781430264453_Fig04-08.jpg)\n\n图 4-8. 显示错误信息\n\
  \n![9781430264453_Fig04-09.jpg](img/9781430264453_Fig04-09.jpg)\n\n图 4-9. 查看错误信息\n\
  \n现在你已了解如何使用 DAX 创建计算，并熟悉了可用的 DAX 函数，是时候获取一些实践经验了。\n\n#### 动手实验——在 Power Pivot 中创建计算列\n\
  \n在以下实验中，你将：\n\n*   创建计算列。\n*   使用 DAX 文本函数。\n*   在 DAX 表达式中使用日期函数。\n*   在表达式中使用相关表中的数据。\n\
  *   在表达式中实现条件逻辑。\n\n1.  在 Lab Starters 文件夹中，打开 `LabChap4Starter.xlsx` 文件。此文件包含一个由销售数据、产品数据和商店数据组成的数据模型。\n\
  2.  使用关系图视图在 Power Pivot 窗口中查看模型（参见 图 4-10）。\n\n![9781430264453_Fig04-10.jpg](img/9781430264453_Fig04-10.jpg)\n\
  \n图 4-10. 商店销售的数据模型\n\n3.  在 Power Pivot 窗口中切换到数据视图，然后选择 `Sales` 表。\n4.  在 `SalesAmount`\
  \ 列之后，点击 `添加列`。在表上方的公式栏中，输入以下内容以计算利润：\n\n```\n    =[SalesAmount] - [TotalCost]\n\
  ```\n\n5.  右键单击新列并将其重命名为 `Margin`。\n6.  重复此过程以创建一个 `MarginPercent` 列，其公式如下：\n\n\
  ```\n    =[Margin]/[SalesAmount]\n```\n\n7.  在数据视图窗口中，选择 `Date` 表。\n8.  使用 Date\
  \ 函数创建一个 `Year`、`Quarter`、`Month`、`Month Number` 和 `Weekday` 列。\n9.  使用 `Year`、`Quarter`\
  \ 和 `Month` 列，在 `Date` 表中创建一个 `Calendar` 层次结构。\n10. 在数据视图窗口中，选择 `Product` 表。\n11.\
  \ 插入一个 `Weight Label` 列，其公式如下：\n\n```\n    =if(ISBLANK([Weight]),BLANK(), [Weight]\
  \ & \" \" & [WeightUnitMeasureID])\n```\n\n12. 在 `ProductSubcategoryKey` 旁边，使用相关函数创建一个\
  \ `ProductCategory` 列：\n\n```\n    =RELATED('ProductCategory'[ProductCategoryName])\n\
  ```\n\n13. 使用相关函数，创建一个 `ProductSubcategory` 列。\n14. 从客户端工具中隐藏 `ProductCategory`\
  \ 和 `ProductSubcategory` 表。\n15. 切换到 `Store` 表并创建一个 `Years Open` 列，其公式如下：\n\n```\n\
  \    =TRUNC(YEARFRAC([OpenDate],\n           If(ISBLANK([CloseDate]),TODAY(),[CloseDate]))\n\
  \              ,0)\n```\n\n16. 使用以下公式创建一个 `LifetimeSales` 列：\n\n```\n    =SUMX(RELATEDTABLE(Sales),Sales[SalesAmount])\n\
  ```\n\n17. 保存并关闭 Excel 文件。\n\n#### 总结\n\n本章向你介绍了 DAX 语言以及可用于创建计算的内置函数。至此，你应该对创建计算列和使用\
  \ DAX 函数驾轻就熟了。我强烈建议你熟悉各种可用函数以及如何在分析中使用它们。在下一章中，你将继续使用 DAX 来创建度量值。度量值是在 Power Pivot\
  \ 中构建模型最重要的部分之一；度量值正是你查看数据的初衷。你希望解答诸如销售情况如何或什么影响了能源消耗之类的问题。除了创建度量值，你还会看到筛选上下文如何影响度量值。为了充分利用\
  \ Power Pivot，筛选上下文是你需要掌握的最重要的概念之一。\n\n## 第 5 章\n\n![image](img/frontdot.jpg)\n\n"
- "# 使用 DAX 创建度量值\n\n使用 DAX 创建度量值是构建可靠数据模型所需的最重要技能。本章涵盖了用于在数据模型中创建度量值的常见函数。它还涵盖了数据上下文这一重要主题，以及在创建度量值时如何更改或覆盖上下文。\n\
  \n完成本章后，你将能够：\n\n*   理解度量值和属性之间的区别。\n*   理解上下文如何影响度量值。\n*   创建常见的聚合。\n*   知道如何以及何时更改筛选上下文。\n\
  *   创建 KPI。\n\n#### 度量值与属性\n\n如果你观察数据仓库的典型星型模型，你会看到一个事实表被维度表包围。例如，图 5-1 显示了一个被多个维度表包围的财务事实表。\n\
  \n![9781430264453_Fig05-01.jpg](img/9781430264453_Fig05-01.jpg)\n\n图 5-1. 典型的星型模式\n\
  \n请记住，事实表包含你需要聚合的数字；例如，在财务表中，你有金额，这是一个需要聚合的货币值。在销售事实表中，你可能拥有销售金额和商品数量。在人力资源系统中，你可能拥有工作小时数。维度表包含你用于分类和汇总度量值的属性。例如，财务度量值被分类为利润、亏损和预测。你希望将值汇总到部门和组织级别，并且希望比较不同月份和年份之间的值。\n\
  \n\n\n当你开始在数据透视表中对数据进行切片和切块时，属性会成为行和列标题，而度量值则是单元格中的值。属性也常被用作筛选器，无论是通过筛选下拉菜单还是切片器。图\
  \ 5-2 展示了一个包含 2006 财年各月研发支出（实际值与预算值）的数据透视表。\n\n![9781430264453_Fig05-02.jpg](img/9781430264453_Fig05-02.jpg)\n\
  \n图 5-2. 在数据透视表中分析数据\n\n如果你查看每个单元格的筛选条件，就会发现它们的筛选方式略有不同。绿色箭头所指的两个度量值因月份而异，而红色箭头所指的度量值则因实际值与预算值而异。当你更改财年、部门或组织时，度量值必须重新计算，因为查询上下文已经改变。\n\
  \n在下一节中，你将看到如何在 Power Pivot 模型中创建一些常见的聚合度量值。\n\n#### 创建常见聚合\n\n在 Power Pivot 中创建诸如求和、计数或平均值等常见聚合非常容易。首先，你需要确定要将度量值与哪个表关联。如果你遵循星型架构模型，这很可能是事实表，但也不一定非得如此。在\
  \ Power Pivot 模型设计器的数据视图模式下，选择与度量值关联的表的选项卡。数据网格下方的区域是放置度量值公式的地方（参见图 5-3）。如果你没有看到度量值网格，可能需要通过选择\
  \ `主页` 选项卡上的 `计算区域` 按钮来取消隐藏它（参见图 5-4）。\n\n![9781430264453_Fig05-03.jpg](img/9781430264453_Fig05-03.jpg)\n\
  \n图 5-3. Finance 表的度量值网格\n\n![9781430264453_Fig05-04.jpg](img/9781430264453_Fig05-04.jpg)\n\
  \n图 5-4. 显示或隐藏度量值网格\n\n创建聚合最简单的方法是选择要聚合的列，然后选择 `自动求和` 下拉菜单，并选择所需的聚合函数（参见图 5-5）。\n\
  \n![9781430264453_Fig05-05.jpg](img/9781430264453_Fig05-05.jpg)\n\n图 5-5. 使用自动求和进行常见聚合\n\
  \n聚合结果会放置在该列下方的度量值网格中（参见图 5-6）。如果你选中该单元格，你将在公式栏中看到公式（参见图 5-7）。度量值的名称放在公式之前，后跟冒号和等号（`:=`）。添加度量值后，你可以通过在公式编辑器中编辑来重命名它。\n\
  \n![9781430264453_Fig05-06.jpg](img/9781430264453_Fig05-06.jpg)\n\n图 5-6. 列下方生成的度量值\n\
  \n![9781430264453_Fig05-07.jpg](img/9781430264453_Fig05-07.jpg)\n\n图 5-7. 编辑度量值公式\n\
  \n另一种创建聚合度量值的方法是选择度量值网格中的任意单元格，然后在公式栏中输入公式。虽然你可以在度量值网格的任何单元格中定义度量值，但以某种方式组织度量值是个好主意。我通常会尝试将度量值沿网格左侧排列，这样它们就不会分散在整个网格中（参见图\
  \ 5-8）。你可以使用剪切和粘贴轻松地将一个定义从一个单元格移动到另一个单元格。\n\n![9781430264453_Fig05-08.jpg](img/9781430264453_Fig05-08.jpg)\n\
  \n图 5-8. 组织你的度量值\n\n你可能已经注意到，聚合函数如 `SUM`、`AVE`、`MIN` 和 `MAX` 都有对应的 `SUMX`、`AVEX`、`MINX`\
  \ 和 `MAXX` 函数。X 函数用于评估表中每一行的表达式，而不仅仅是单个列。例如，`SUMX` 函数的定义如下：\n\n```\nSUMX(<table>,\
  \ <expression>)\n```\n\n其中，table 是包含要评估的行的表，expression 是每行要评估的内容。\n\n例如，假设你有一个包含\
  \ `Cost` 和 `Gross` 列的销售表。要计算总净销售额，你可以用毛收入减去成本，然后对每一行的结果求和，如下面的公式所示：\n\n```\nSumNet:=SUMX(Sales,[Gross]-[Cost])\n\
  ```\n\n获得相同结果的另一种方法是先创建一个净计算列，然后对净列使用 `SUM` 函数。区别在于，计算列是预先计算并存储在模型中的。而度量值是在数据透视表中应用筛选器时计算的，并且每次数据上下文更改时都必须重新计算。因此，计算列越多，你的\
  \ Power Pivot 文件就越大。度量值越多、复杂性越高，在处理文件时所需的内存就越多。\n\n理解数据上下文如何改变度量值是创建度量值时非常重要的一点，这将在下一节中探讨。\n\
  \n#### 掌握数据上下文\n\n在 Power Pivot 模型中创建度量值时，上下文起着重要作用。与静态报表不同，Power Pivot 模型是为客户端进行动态分析而设计的。当用户更改筛选器、向下钻取以及更改数据透视表中的列和行标题时，上下文会发生变化，值也会重新计算。了解上下文如何变化以及它如何影响结果，对于能够构建和调试公式至关重要。\n\
  \n你需要考虑三种类型的上下文：行上下文、查询上下文和筛选上下文。当你在创建计算列时，行上下文就会发挥作用。它包括当前行所有其他列的值，以及与该行相关的任何表的数值。如果你创建一个计算列，例如\
  \ margin，\n\n```\n=[Gross] - [Cost]\n```\n\nDAX 使用行上下文从同一行中查找值以完成计算。如果你创建一个计算列，例如\
  \ lifetime sales，\n\n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n```\n\nDAX 会自动使用当前行的行上下文查找相关值。行上下文在模型加载时设置一次，并且在加载新数据之前不会更改。这就是计算列被预先计算，并且仅在数据刷新时才需要重新计算的原因。\n\
  \n查询上下文是应用于数据透视表中单元格的筛选条件。当你将一个度量值放入数据透视表时，DAX 查询引擎会检查行和列标题以及任何应用的筛选器。每个单元格都应用了不同的查询上下文（参见图\
  \ 5-9），并返回与该上下文关联的值。由于你可以通过更改行或列标题以及筛选值来动态更改查询上下文，因此单元格的值是动态计算的，并且这些值不会保存在 Power\
  \ Pivot 模型中。\n\n![9781430264453_Fig05-09.jpg](img/9781430264453_Fig05-09.jpg)\n\n\
  图 5-9. 度量值的查询上下文\n\n筛选上下文是使用公式中的筛选约束添加到度量值中的。筛选上下文是在行上下文和查询上下文之外额外应用的。你可以通过添加、替换或使用筛选表达式有选择地更改上下文来改变它。例如，如果你使用以下公式计算销售额，\n\
  \n```\nAllStoreSales:=CALCULATE(SUM(Sales[SalesAmount]),ALL(Store[StoreType]))\n\
  ```\n\n筛选上下文将清除查询上下文实施的任何 `StoreType` 筛选器。\n\n\n\n在下一节中，您将了解为何知道何时以及如何更改查询上下文是创建度量值的重要方面。\n\
  \n#### 更改查询上下文\n\n创建计算时，通常需要更改应用于度量值的筛选上下文。例如，如果您想要计算某个产品类别的销售额与所有产品销售额的比较（请参见图\
  \ 5-10）。\n\n![9781430264453_Fig05-10.jpg](img/9781430264453_Fig05-10.jpg)\n\n图 5-10\
  \ 查看产品销售比率\n\n要计算销售比率，您需要用查询上下文筛选后的销售额（本例中为类别）除以所有产品的销售额（无论产品查询上下文如何）。要计算销售额，只需使用\
  \ `SUM` 函数即可。要计算所有产品销售额的总和，您需要覆盖应用于单元格的任何产品筛选。为此，请使用 `CALCULATE` 函数，该函数在由指定筛选器修改的上下文中计算表达式，其语法如下：\n\
  \n```\nCALCULATE(<表达式>,<筛选器 1>,<筛选器 2>...)\n```\n\n其中，表达式本质上是要计算的度量值，而筛选器是定义筛选器的布尔表达式或表表达式。\n\
  \n因此，要覆盖任何产品筛选器，请使用以下代码：\n\n```\nAllProductSales:=CALCULATE(SUM([SalesAmount]),\
  \ ALL(Product))\n```\n\n这使用了 `ALL` 函数，该函数返回表中的所有行或列中的所有值，忽略可能已应用的任何筛选器。因此，在本例中，它会清除应用于\
  \ Product 表的所有筛选器。图 5-11 展示了数据透视表中的度量值。\n\n![9781430264453_Fig05-11.jpg](img/9781430264453_Fig05-11.jpg)\n\
  \n图 5-11 验证 AllProductSales 度量值\n\n请注意，ProductSales 度量值受产品筛选器（类别）的影响，而 AllProductSales\
  \ 则不受影响。计算 ProductSalesRatio 度量值的最后一步是将 ProductSales 除以 AllProductSales。只要没有循环引用，您就可以在一个度量值内部使用另一个度量值。因此，ProductSalesRatio\
  \ 的计算方式如下：\n\n```\nProductSalesRatio:=[ProductSales]/[AllProductSales]\n```\n\n\
  您可以将 AllProductSales 度量值对客户端工具隐藏，因为在本例中，它用作中间度量值，本身并无用处。\n\n在本节中，您了解了如何使用 `CALCULATE`\
  \ 函数和筛选器函数来更改应用于度量值的筛选器。DAX 中有许多筛选器函数，理解何时使用它们非常重要。在下一节中，您将了解几个更重要的可用的筛选器函数。\n\n\
  #### 使用筛选器函数\n\nDAX 中的筛选器函数允许您创建复杂的计算，这些计算需要您查询和操作数据透视表中行或单元格的数据上下文。表 5-1 列出并描述了\
  \ DAX 中可用的一些筛选器函数。\n\n表 5-1 部分 DAX 筛选器函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `ALL`\
  \ | 返回表中的所有行，或列中的所有值，忽略可能已应用的任何筛选器。 |\n| `ALLEXCEPT` | 移除表中的所有上下文筛选器，但已应用于指定列的筛选器除外。\
  \ |\n| `ALLNONBLANKROW` | 返回除空行外的所有行，并忽略可能存在的任何上下文筛选器。 |\n| `ALLSELECTED` | 从列和行中移除上下文筛选器，同时保留所有其他上下文筛选器或显式筛选器。\
  \ |\n| `CALCULATE` | 在由指定筛选器修改的上下文中计算表达式。 |\n| `CALCULATETABLE` | 在由给定筛选器修改的上下文中计算表表达式。\
  \ |\n| `DISTINCT` | 返回一个单列的表，其中包含指定列中的非重复值。 |\n| `FILTER` | 返回一个表，该表表示另一个表或表达式的子集。\
  \ |\n| `FILTERS` | 返回直接作为筛选器应用的值。 |\n| `HASONEVALUE` | 当上下文被筛选为仅剩一个非重复值时返回 TRUE。\
  \ |\n| `ISFILTERED` | 当应用了直接筛选器时返回 TRUE。 |\n| `ISCROSSFILTERED` | 当列或同一表或相关表中的另一列被筛选时返回\
  \ TRUE。 |\n| `KEEPFILTERS` | 在计算 `CALCULATE` 或 `CALCULATETABLE` 函数时修改筛选器的应用方式。保留已应用的筛选器并添加额外的筛选器。\
  \ |\n| `RELATED` | 从另一个表返回相关值。 |\n| `USERELATIONSHIP` | 指定要在特定计算中使用的关系。 |\n| `VALUES`\
  \ | 返回一个单列的表，其中包含指定列中的非重复值。 |\n\n您已经了解了如何结合使用 `CALCULATE` 函数和 `ALL` 函数来计算所有产品销售额，忽略任何已应用的产品筛选。让我们再看几个示例。\n\
  \n图 5-12 展示了一个用于经销商销售的 Power Pivot 模型。在该模型中，Employee 表和 SalesTerritory 表之间存在非活动关系。您可以使用此关系来计算每个国家/地区的销售人员数量。\n\
  \n![9781430264453_Fig05-12.jpg](img/9781430264453_Fig05-12.jpg)\n\n图 5-12 Power\
  \ Pivot 模型中的非活动关系\n\n您可以使用以下代码来计算每个国家/地区的销售代表人数：\n\n```\nSales Rep Cnt:=CALCULATE(DISTINCTCOUNT(Employee[EmployeeNationalIDAlternateKey]),\n\
  USERELATIONSHIP(Employee[SalesTerritoryKey],SalesTerritory[SalesTerritoryKey]))\n\
  ```\n\n在这种情况下，您需要使用 `CALCULATE` 函数，以便应用筛选器函数 `USERELATIONSHIP` 来告知 DAX 查询引擎使用哪个关系。图\
  \ 5-13 显示了生成的数据透视表。它还显示了如果仅使用 `DISTINCTCOUNT` 函数而不使用 `USERELATIONSHIP` 筛选器时得到的结果。\n\
  \n![9781430264453_Fig05-13.jpg](img/9781430264453_Fig05-13.jpg)\n\n图 5-13 每个国家/地区的销售代表人数\n\
  \n在下一个示例中，您将了解 `ALL` 和 `ALLSELECTED` 筛选器函数之间的区别。您可以如下创建三个销售金额度量值：\n\n```\nReseller\
  \ Sales:=SUM([SalesAmount])\nReseller Grand Total:=calculate(sum([SalesAmount]),\
  \ ALL('ResellerSales'))\nReseller Visual Total:=calculate(sum([SalesAmount]), ALLSELECTED())\n\
  ```\n\n`Reseller Sales` 保留应用于度量值的所有数据上下文。`Reseller Grand Total` 移除与 `ResellerSales`\
  \ 表及任何相关表关联的所有上下文。`Reseller Visual Total` 从度量值中移除列和行的上下文。图 5-14 显示了数据透视表中的生成度量值。\n\
  \n![9781430264453_Fig05-14.jpg](img/9781430264453_Fig05-14.jpg)\n\n图 5-14 使用不同筛选器的结果\n\
  \n\n\n现在让我们看一个更复杂的示例。在本示例中，您希望确定特定时间段内最佳单笔订单客户。最终的数据透视表如图 5-15 所示。\n\n![9781430264453_Fig05-15.jpg](img/9781430264453_Fig05-15.jpg)\n\
  \n图 5-15 查找最佳单笔订单客户\n\n第一步是查找在该时间段内消费金额较高的客户。要计算客户销售额，请使用以下度量值：\n\n```\nSumSales:=SUM([SalesAmount])\n\
  ```\n\n接下来，您只想关注大额消费者，因此过滤掉较小的值：\n\n```\nLargeSales:=IF([SumSales]>=30000,[SumSales],Blank())\n\
  ```\n\n下一步是查找客户的订单金额并取最大值：\n\n```\nTop Sale:=MAXX(VALUES(Date[DateKey]),[SumSales])\n\
  ```\n\n由于您只想列出顶级客户的最大销售额，可以添加一个`IF`语句来确保该客户有大额销售：\n\n```\nTop Sale:=\nIF(ISBLANK([LargeSales]),Blank(),MAXX(VALUES(Date[DateKey]),[SumSales]))\n\
  ```\n\n作为最后一个示例，假设您正在与人力资源部门合作，希望创建一个数据透视表，使他们能够列出特定日期各部门的员工数量。有一个`EmployeeDepartmentHistory`表，其中列出了员工、部门、开始日期和结束日期。还有一个`Dates`表，其每一行对应部门历史记录中的每个日期。图\
  \ 5-16 显示了包含每个部门员工数量的数据透视表。\n\n![9781430264453_Fig05-16.jpg](img/9781430264453_Fig05-16.jpg)\n\
  \n图 5-16 截至选定日期的员工数量\n\n`As of Date`用作筛选器，`Emp Cnt`是度量值。当`As of Date`更改时，`Emp Cnt`会重新计算以显示该日期下的员工数量。图\
  \ 5-17 显示了日期更改后的新数量。\n\n![9781430264453_Fig05-17.jpg](img/9781430264453_Fig05-17.jpg)\n\
  \n图 5-17 更改`As of Date`\n\n创建`Emp Cnt`的第一步是使用`COUNT`函数，因为您需要对表中的`EmployeeID`进行计数：\n\
  \n```\nEmp Cnt:=COUNT(EmpDepHist[BusinessEntityID])\n```\n\n由于需要将表筛选为仅包含选定日期时的在职员工，因此需要将其改为`COUNTX`函数：\n\
  \n```\nEmp Cnt:=COUNTX(EmpDepHist, EmpDepHist[BusinessEntityID])\n```\n\n若要筛选`EmpDepHist`表，请使用`FILTER`函数：\n\
  \n```\nFILTER(<table>,<filter>)\n```\n\n`FILTER`函数是一个计算结果为`TRUE`的布尔表达式。在这种情况下，需要使员工在部门中的开始日期小于或等于`As\
  \ of Date`：\n\n```\nEmpDepHist[StartDate]<=Dates[As of Date]\n```\n\n现在，由于数据透视表用户可以选择多个日期，并且您希望确保只与单个日期进行比较，因此可以使用`MAX`函数：\n\
  \n```\nEmpDepHist[StartDate]<=MAX(Dates[As of Date])\n```\n\n您还需要确保员工离开部门的日期大于`As\
  \ of Date`：\n\n```\nEmpDepHist[EndDate] > Max(Dates[As of Date]\n```\n\n如果员工当前仍在部门中，则`EndDate`将为空：\n\
  \n```\nISBLANK(EmpDepHist[EndDate])\n```\n\n将这些筛选条件组合起来，得到以下筛选条件：\n\n```\nEmpDepHist[StartDate]<=MAX(Dates[As\
  \ of Date])\n&& (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As\
  \ of Date]))\n```\n\n最终的`FILTER`函数变为：\n\n```\nFILTER(EmpDepHist,\nEmpDepHist[StartDate]<=MAX(Dates[As\
  \ of Date])\n&& (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As\
  \ of Date])))\n```\n\n最终的员工计数度量值变为：\n\n```\nEmp Cnt:=COUNTX(FILTER(EmpDepHist,\n\
  EmpDepHist[StartDate]<=MAX(Dates[As of Date])\n&& (ISBLANK(EmpDepHist[EndDate])\
  \ || EmpDepHist[EndDate] > Max(Dates[As of Date]))),\nEmpDepHist[BusinessEntityID])\n\
  ```\n\n如您所见，创建度量值可能相当复杂，但如果将其分解为多个步骤，就会变得非常易于管理。请放心，您使用 DAX 创建度量值的次数越多，它就会变得越直观、越容易。\n\
  \n在性能仪表板中常用的一种度量值是*关键绩效指标（KPI）*。KPI 用于以可视化格式显示绩效和趋势。在下一节中，您将研究在 Power Pivot 模型中创建\
  \ KPI。\n\n#### 创建 KPI\n\nKPI 是许多仪表板的主要组成部分，提供了一种快速查看趋势和发现需要进一步分析领域的绝佳方式。KPI 的基础值基于度量值，例如，您可以为当前销售额创建一个\
  \ KPI。然后将基础值与目标值进行比较。目标值可以是另一个度量值，例如去年的销售额，也可以是绝对数值，例如目标销售费用率。状态阈值定义了哪些范围被视为良好、一般和差。这些阈值随后用于确定\
  \ KPI 的可视化组件（即绿色、黄色、红色）。图 5-18 显示了与前期销售额相比较的当期销售额 KPI。\n\n![9781430264453_Fig05-18.jpg](img/9781430264453_Fig05-18.jpg)\n\
  \n图 5-18 比较当期与前期销售额的销售 KPI\n\n要创建 KPI，请首先创建其依赖的基础度量值。例如，生产部门跟踪报废部件，因此您可以将 KPI 基于报废部件数量的总和：\n\
  \n```\nSumScrappedQty:=SUM([ScrappedQty])\n```\n\n您可以将其与已处理的部件数量进行比较：\n\n```\nSumOrderQuantity:=SUM([OrderQty])\n\
  ```\n\n创建度量值后，在 Power Pivot 模型设计器中右键单击基础度量值。在上下文菜单中选择“创建 KPI”，这将启动 KPI 设计窗口（参见图\
  \ 5-19）。\n\n![9781430264453_Fig05-19.jpg](img/9781430264453_Fig05-19.jpg)\n\n图 5-19\
  \ KPI 设计窗口\n\n然后将目标设置为`SumOrderQuantity`度量值，并定义状态阈值。样式图标用于显示 KPI 的状态。完成 KPI 创建后，您可以在\
  \ Excel 的数据透视表中使用它（参见图 5-20）。\n\n![9781430264453_Fig05-20.jpg](img/9781430264453_Fig05-20.jpg)\n\
  \n图 5-20 在数据透视表中查看 KPI\n\n现在您已经了解了如何使用 DAX 创建度量值和更改数据上下文，是时候在以下实验中动手创建一些度量值了。\n\n\
  #### 动手实验——在 Power Pivot 中创建度量值\n\n在以下实验中，您将：\n\n*   创建聚合度量值。\n*   更改度量值中的数据上下文。\n\
  *   在度量值中使用非活动关系。\n*   创建复杂的度量值。\n*   创建 KPI。\n\n1.  在“实验启动器”文件夹中，打开`LabChapter5.xlsx`文件。该文件包含一个由销售数据、产品数据和商店数据组成的数据模型。\n\
  2.  使用关系图视图在 Power Pivot 窗口中查看模型（图 5-21）。\n\n![9781430264453_Fig05-21.jpg](img/9781430264453_Fig05-21.jpg)\n\
  \n图 5-21 Power Pivot 模型\n\n3.  在 Power Pivot 窗口中切换到数据视图，并选择`Sales`表。\n4.  选择`SalesAmount`列。在“自动求和”下拉菜单中选择“求和”（参见图\
  \ 5-22）。您应该会看到在该列下方添加了一个度量值。将该度量值重命名为`Sum Sales`。\n\n![9781430264453_Fig05-22.jpg](img/9781430264453_Fig05-22.jpg)\n\
  \n图 5-22 选择“自动求和”下拉菜单\n\n\n\n5.  使用与第 4 步相同的技术，创建`Max Sales Quantity`、`Min Sales\
  \ Quantity`和`Ave Sales Quantity`度量值。\n6.  要测试度量值如何随筛选上下文的变化而重新计算，在“开始”选项卡中单击数据透视表，然后在`Sheet1`的`B2`单元格中插入数据透视表（参见图\
  \ 5-23）。\n\n![9781430264453_Fig05-23.jpg](img/9781430264453_Fig05-23.jpg)\n\n图 5-23.\
  \ 创建数据透视表\n\n7.  如果看不到字段列表，请单击数据透视表以显示它。\n8.  在“销售”节点下，勾选`Sales`和`Max Sales Quantity`。这会将度量值添加到“值”下拉区域。在“产品”节点下，勾选`ProductCategory`属性。这会将属性添加到“行标签”下拉区域。\n\
  9.  在“插入”选项卡上，单击“切片器”按钮。在“插入切片器”窗口中，选择“全部”选项卡，然后在“地域”节点下选择`ContinentName`（参见图 5-24）。\n\
  \n![9781430264453_Fig05-24.jpg](img/9781430264453_Fig05-24.jpg)\n\n图 5-24. 创建切片器\n\
  \n10.  数据透视表应如下图所示图 5-25。通过单击不同的大洲来测试度量值。这会更改查询上下文。请注意度量值如何随查询上下文的变化而重新计算。\n\n![9781430264453_Fig05-25.jpg](img/9781430264453_Fig05-25.jpg)\n\
  \n图 5-25. 测试查询上下文\n\n11.  现在假设我们需要一个销售比率，用于比较销售额与所有产品的总销售额。在数据视图模式下打开 Power Pivot\
  \ 窗口。选择`Sales`表。向`Sales`表中添加以下度量值：\n\n```\nAll Product Sales:=CALCULATE([Sum Sales],ALL('Product'))\n\
  ```\n\n12.  `All Product Sales`度量值使用`CALCULATE`函数来覆盖应用于查询上下文的任何产品筛选器。将该度量值的格式设置为货币。\n\
  13.  切换到数据透视表。将`Max Sales Quantity`度量值替换为`Sum Sales`和`All Product Sales`度量值。\n14.\
  \  通过单击不同大洲来测试数据透视表，并注意`All Product Sales`度量值等于每个大洲的总产品销售（参见图 5-26）。\n\n![9781430264453_Fig05-26.jpg](img/9781430264453_Fig05-26.jpg)\n\
  \n图 5-26. 测试度量值\n\n15.  切换回 Power Pivot 窗口，并向`Sales`表中添加以下度量值。将该度量值的格式设置为百分比。\n\n\
  ```\nProduct Sales Ratio:=[Sum Sales]/[All Product Sales]\n```\n\n16.  在关系图视图模式下打开\
  \ Power Pivot 窗口。要创建`Date`表和`Store`表之间的关系，请将`Store`表中的`OpenDate`字段拖放到`Date`表中的`DateKey`上（参见图\
  \ 5-27）。请注意，这不是`Store`表和`Date`表之间的活动关系，如虚线所示。这是因为活动关系从`Store`表经过`Sales`表，然后到达`Date`表。\n\
  \n![9781430264453_Fig05-27.jpg](img/9781430264453_Fig05-27.jpg)\n\n图 5-27. 创建非活动关系\n\
  \n17.  切换到数据视图模式，并向`Store`表中添加以下度量值。由于使用的是非活动关系，因此需要使用`USERELATIONSHIP`函数。\n\n```\n\
  Store Count:=CALCULATE(DISTINCTCOUNT([StoreKey]),\nUSERELATIONSHIP(Store[OpenDate],'Date'[Datekey]))\n\
  ```\n\n18.  要测试`Store Count`度量值，请在`Sheet2`上创建数据透视表。使用`ContinentName`作为列标签，使用`CalendarMonth`作为行标签。使用`CalendarYear`插入切片器。数据透视表应如下图所示图\
  \ 5-28。\n\n![9781430264453_Fig05-28.jpg](img/9781430264453_Fig05-28.jpg)\n\n图 5-28.\
  \ 测试`Store Count`度量值\n\n\n\n19.  数据透视表显示了每个月开设的店铺数量。点击不同年份，观察数据的变化。\n20.  若要找出某个产品类别的最佳销售日，请创建一个`Sale\
  \ Quantity`度量值。\n\n```\nSale Quantity:=SUM([SalesQuantity])\n```\n\n21.  使用`Sale\
  \ Quantity`度量值创建一个`Top Sale Day Quantity`度量值。`MAXX`函数用于打破平局，并返回最近的`DateKey`。\n\n\
  ```\nTop Sale Day Quantity:=MAXX(values('Date'[Datekey]),[Sale Quantity])\n```\n\
  \n22.  要找出最佳销售日的日期，首先需要创建一个筛选器函数，该函数返回在指定期间内`Sale Quantity`等于`Top Sale Day Quantity`的日期。\n\
  \n```\nFilter(VALUES('Date'[Datekey]),\n[Sale Quantity]=CALCULATE([Top Sale Day\
  \ Quantity],\nVALUES('Date'[Datekey])))\n```\n\n23.  然后将此筛选器插入到`CALCULATE`函数中，该函数将返回最近的日期。\n\
  \n```\nTop Sale Day:=CALCULATE(MAX('Date'[Datekey]),\nFilter(VALUES('Date'[Datekey]),[Sale\
  \ Quantity]=\nCALCULATE([Top Sale Day Quantity],VALUES('Date'[Datekey]))))\n```\n\
  \n24.  创建一个如图 5-29 所示的数据透视表来测试你的度量值。\n\n![9781430264453_Fig05-29.jpg](img/9781430264453_Fig05-29.jpg)\n\
  \n图 5-29. 测试最佳销售日度量值\n\n25.  在 Sales 表中创建以下度量值，并将其格式设置为货币：\n\n```\nAve Sales:=AVERAGE([SalesAmount])\n\
  Total Ave Sales:=If(ISBLANK([Ave Sales]),BLANK(),\n                            CALCULATE([Ave\
  \ Sales],ALLSELECTED()))\n```\n\n26.  在度量值网格中选择`Ave Sales`度量值。右键单击它，然后在上下文菜单中选择“创建\
  \ KPI”。在 KPI 对话框中，注意基础度量值是`Ave Sales`。将目标值设置为`Total Ave Sales`。将低阈值设置为 90%，高阈值设置为\
  \ 110%（参见图 5-30）。\n\n![9781430264453_Fig05-30.jpg](img/9781430264453_Fig05-30.jpg)\n\
  \n图 5-30. 创建平均销售额 KPI\n\n27.  关闭对话框，注意`Ave Sales`度量值现在有一个图标，表示它关联了一个 KPI。\n28. \
  \ 创建一个如图 5-31 所示的数据透视表来测试该 KPI。你可以将某个店铺的平均销售额与显示的所有店铺的总平均销售额进行比较。\n\n![9781430264453_Fig05-31.jpg](img/9781430264453_Fig05-31.jpg)\n\
  \n图 5-31. 查看 KPI\n\n#### 总结\n\n这一章内容详实而丰富。现在你已经牢固掌握了如何在 Power Pivot 模型中创建度量值。你还应该理解数据上下文及其如何影响度量结果。在开始开发更复杂的度量值时，这可能会是一个非常令人困惑的概念。不过不用担心；用得越多，理解就会越清晰。\n\
  \n下一章将进一步延伸本章的概念。一种最常见的数据分析类型是比较随时间变化的值。第 6 章将展示如何在 Power Pivot 中正确实现基于时间的分析。内容包括设置日期表、使用各种内置函数分析截至当前日期的值、比较不同时间段的值，以及执行半加法聚合。\n\
  \n"
- "# 第 6 章\n\n![image](img/frontdot.jpg)\n\n## 融入时间智能\n\n一种最常见的数据分析类型是比较随时间变化的值。本章将向读者展示如何在\
  \ Power Pivot 中正确实现基于时间的分析。内容包括设置日期表、使用各种内置函数分析截至当前日期的值、比较不同时间段的值，以及执行半加法聚合。\n\n\
  完成本章后，你将能够：\n\n*   创建一个日期表。\n*   使用 DAX 进行基于时间段的评估。\n*   使用筛选器函数移动日期上下文。\n*   创建半加法度量值。\n\
  \n#### 基于日期的分析\n\n很大一部分数据分析都涉及某种基于日期时间的聚合和比较。例如，你可能需要查看截至当前月份（MTD）或截至当前年份（YTD）的使用情况或销售额，如图\
  \ 6-1 所示。\n\n![9781430264453_Fig06-01.jpg](img/9781430264453_Fig06-01.jpg)\n\n图\
  \ 6-1. 计算年初至今和月初至今的销售额\n\n另一个常见的例子是比较从一个时间段到下一个时间段的业绩表现。例如，你可能想要比较上个月的销售额与当前月份的销售额（参见图\
  \ 6-2），或者将当前月份的销售额与去年同期的销售额进行比较。\n\n![9781430264453_Fig06-02.jpg](img/9781430264453_Fig06-02.jpg)\n\
  \n图 6-2. 计算销售额增长\n\n除了这些常见的数据分析之外，有时你还需要基于非加和性度量值（例如账户余额或库存）进行聚合。在这些情况下，你需要确定输入的最后一个值，并使用该值来聚合不同时间段的数据（参见图\
  \ 6-3）。\n\n![9781430264453_Fig06-03.jpg](img/9781430264453_Fig06-03.jpg)\n\n图 6-3.\
  \ 聚合库存量\n\nDAX 包含许多函数，可以帮助你创建可能需要的各种基于日期时间的分析。在下一节中，你将看到如何创建日期表，这是使用许多基于日期时间的函数所必需的。\n\
  \n#### 创建日期表\n\n为了使用 DAX 中内置的时间智能函数，你需要在模型中有一个日期表供这些函数引用。该表的唯一要求是，在你想查看的日期范围内，每天对应一个不同的行。每一行都需要包含该日期的完整日期。日期表可以（并且通常）包含更多列，但这并非必须。\n\
  \n有多种方法可以创建日期表。如果你从数据仓库中检索数据，可以将日期维度导入模型并使用它。如果你无法使用日期表，可以在 Excel 工作表中创建它，然后将其导入模型。如果你有权访问数据库，还可以编写\
  \ SQL 查询来创建一个临时表，并使用该临时表将日期加载到模型中。以下代码显示了可以针对 Microsoft SQL Server 数据库使用的 SQL 查询。它使用公用表表达式来填充日期表。\n\
  \n```\nDECLARE\n  @BeginDate DATE,\n  @EndDate DATE\n\nSET @BeginDate = '01/01/2010'\n\
  SET @EndDate = '12/31/2014'\n;\n\nWITH cteDate AS (\n  SELECT @BeginDate AS CalendarDate\n\
  \  UNION ALL\n  SELECT DATEADD(DAY,1,CalendarDate)\n    FROM cteDate\n    WHERE\
  \ CalendarDate < @EndDate)\n\nSELECT\n  (DATEPART(YEAR,CalendarDate) * 10000) +\
  \ (DATEPART(MONTH,CalendarDate) * 100)  +\n    DATEPART(DAY,CalendarDate) AS DateKey,\n\
  \  CalendarDate,\n  DATEPART(YEAR,CalendarDate) AS Year,\n  DATEPART(MONTH,CalendarDate)\
  \ AS MonthNumber,\n  DATENAME(MONTH,CalendarDate) AS Month\n  FROM cteDate\n  OPTION\
  \ (MAXRECURSION 0)\n```\n\n将表放入模型后，你需要将其标记为官方日期表（参见图 6-4），并指明哪一列是唯一键（参见图 6-5）。这会通知\
  \ DAX 查询引擎使用此表作为参考，来构造计算所需的一组日期。例如，如果你想要查看年初至今的销售额，查询引擎将使用此表来获取所需的日期集。\n\n![9781430264453_Fig06-04.jpg](img/9781430264453_Fig06-04.jpg)\n\
  \n图 6-4. 标识日期表\n\n![9781430264453_Fig06-05.jpg](img/9781430264453_Fig06-05.jpg)\n\
  \n图 6-5. 设置日期键\n\n\n\n目前在 `DAX` 中有 35 个内置的时间智能函数。其中一些函数（如 `FIRSTNONBLANK`）返回单个日期。另一些函数（如\
  \ `PREVIOUSMONTH`）则返回一组日期。还有一些函数（如 `TOTALQTD`）会在时间范围内计算表达式。目前，`DAX` 内置的时间智能函数支持以\
  \ 12 月 31 日为结束日的传统日历。它们也支持具有不同年终日期且包含四个季度（每个季度三个月）的财务日历。如果你需要使用自定义财务日历，则需要自行创建自定义计算。\n\
  \n现在你已经了解了如何在模型中创建和指定日期表，接下来我们来了解如何实现一些常用的时间智能函数来分析数据。\n\n### 基于时间段的评估\n\n数据分析中常见的一种分析是查看截止到某日期的值。例如，你可能希望查看年初至今的销售额或月初至今的能源消耗量。`DAX`\
  \ 提供了 `TOTALMTD`、`TOTALQTD` 和 `TOTALYTD` 函数，使得这项工作变得非常简单。例如，年初至今的总额定义如下：\n\n```\n\
  TOTALYTD(<表达式>,<日期>[,<筛选器>][,<年终日期>])\n```\n\n其中，`表达式` 是一个返回标量值的表达式。`日期` 是日期表的关键列。`筛选器`\
  \ 是一个可选的筛选表达式，`年终日期` 也是可选的——你可以用它来指示财务日历的年末日期。以下表达式用于计算销售额总和以及年初至今的销售额值。\n\n```\n\
  销售额总和:=SUM(Sales[SalesAmount])\n年初至今销售额:=TOTALYTD([销售额总和],'Date'[Datekey])\n```\n\
  \n如果要计算所有产品的年初至今销售额，请使用以下表达式：\n\n```\n所有产品年初至今销售额:=TOTALYTD([销售额总和],'Date'[Datekey],ALL('Product'))\n\
  ```\n\n图 6-6 显示了数据透视表中的度量值。你可以使用这些基础度量值来计算进一步的度量值，例如年初至今销售额占比和所有产品销售额占比。\n\n![9781430264453_Fig06-06.jpg](img/9781430264453_Fig06-06.jpg)\n\
  \n图 6-6. 计算年初至今的值\n\n你也可以使用另一组函数——`DATESMTD`、`DATESQTD` 和 `DATESYTD`——来创建相同的度量值。与之前的截止到某日期度量值一样，你需要将日期表中的日期键传递给这些函数。以下表达式使用\
  \ `CALCULATE` 函数配合 `DATESYTD` 筛选器来获取年初至今的销售额度量值。\n\n```\n年初至今销售额 2:=CALCULATE([销售额总和],DATESYTD('Date'[Datekey]))\n\
  ```\n\n使用 `CALCULATE` 函数和 `DATES` 函数比使用截止到某日期的函数更加灵活，因为你可以将它们用于任何类型的聚合，而不仅仅是求和。以下表达式用于计算年初至今的平均销售额。结果显示在图\
  \ 6-7 中。\n\n```\n平均销售额:=AVERAGE([SalesAmount])\n年初至今平均销售额:=CALCULATE([平均销售额],DATESYTD('Date'[Datekey]))\n\
  ```\n\n![9781430264453_Fig06-07.jpg](img/9781430264453_Fig06-07.jpg)\n\n图 6-7. 计算年初至今的平均值\n\
  \n现在你已经知道如何创建基于时间段的计算，可以使用它来比较过去业绩和当前业绩。但首先你需要知道如何移动日期上下文来计算过去业绩。\n\n#### 移动日期上下文\n\
  \n如果你想将某一时期的业绩与过去同一时期的业绩进行比较，比如将当前月份的销售额与一年前同月的销售额进行比较，你需要移动日期上下文。`DAX` 包含几个执行此操作的函数。其中用于移动日期上下文的最通用的函数之一是\
  \ `PARALLELPERIOD` 函数。与其他时间智能函数一样，你需要将日期表的关键列传递给该函数。你还需要指定间隔数量和间隔类型（年、季度或月）。\n\n\
  ```\nPARALLELPERIOD(<日期>,<间隔数量>,<间隔>)\n```\n\n需要记住的一点是，`PARALLELPERIOD` 函数返回一组与间隔类型相对应的日期。如果你使用“年”，它将返回一年的日期；使用“月”间隔则返回一个月的日期。以下表达式计算去年同月的销售总额。图\
  \ 6-8 显示了计算结果。\n\n```\n去年同月销售额:=Calculate([销售额总和],\nPARALLELPERIOD('Date'[Datekey],-12,Month))\n\
  ```\n\n![9781430264453_Fig06-08.jpg](img/9781430264453_Fig06-08.jpg)\n\n图 6-8. 计算平行时期的销售额\n\
  \n请注意，如果你下钻到日期级别（参见图 6-9），你仍然会看到一年前该日期所在月份的月度总额。如前所述，这是因为在这种情况下，`PARALLELPERIOD`\
  \ 始终返回与当前行日期所在月份相同且为去年同月的日期集。\n\n![9781430264453_Fig06-09.jpg](img/9781430264453_Fig06-09.jpg)\n\
  \n图 6-9. 下钻到日级别仍显示月级别聚合\n\n现在你可以计算去年同月的销售额，并将其与当前销售额结合，以计算逐年月度销售额增长率。图 6-10 显示了结果。\n\
  \n```\n同比月度增长率:=([销售额总和]-[去年同月销售额])/[去年同月销售额] \n```\n\n![9781430264453_Fig06-10.jpg](img/9781430264453_Fig06-10.jpg)\n\
  \n图 6-10. 计算逐年月度增长率\n\n请注意，如果没有上一年度的销售额，数据透视表中会出现错误。你可以通过检查去年同月销售额是否为空并插入空值来控制这种情况。\n\
  \n```\n同比月度增长率:=IF(\nISBLANK([去年同月销售额]),\nBLANK(),\n([销售额总和]-[去年同月销售额])/[去年同月销售额])\n\
  ```\n\n另一个常用于更改日期上下文的函数是 `DATEADD` 函数。`DATEADD` 函数用于在当前日期上下文上添加一个日期间隔。你可以添加年、季度、月或日的间隔。\n\
  \n```\nDATEADD(<日期>,<间隔数量>,<间隔>)\n```\n\n以下计算使用 `DATEADD` 函数作为筛选器，求得上一天销售额的总和。\n\
  \n```\n上一天销售额:=Calculate([销售额总和],DATEADD('Date'[Datekey],-1,day))\n```\n\n现在你已经知道如何移动日期上下文，接下来我们将了解一些可以在筛选器中使用的、返回单个日期的函数。\n\
  \n#### 使用单个日期函数\n\n`DAX` 包含一组返回单个日期的函数。这些函数通常用于筛选日期上下文。例如，`FIRSTDATE` 函数返回传递给它的日期列中的第一个日期。作为示例，你可以将其与\
  \ `DATESBETWEEN` 函数结合使用，以获取从当前日期上下文日期集中的第一天到第 15 天的日期范围。\n\n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n\
  \ ,FIRSTDATE('Date'[FullDateAlternateKey])\n,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]),\
  \ 14, DAY))\n```\n\n然后，这可以在 `CALCULATE` 函数中用作筛选器，以获取该时期前 15 天的销售额。生成的数据透视表如图 6-11\
  \ 所示。\n\n![9781430264453_Fig06-11.jpg](img/9781430264453_Fig06-11.jpg)\n\n图 6-11.\
  \ 计算月初前 15 天的销售额\n\n如果你只查看月度期间，你可以使用 `STARTOFMONTH` 和 `ENDOFMONTH` 函数（也有用于年和季度的对应函数）。以下表达式用于计算该月最后\
  \ 15 天的销售额总和。\n\n\n\n```\nLast 15 Day Sales:=CALCULATE(SUM(InternetSales[SalesAmount]),\n\
  \ DATESBETWEEN('Date'[FullDateAlternateKey]\n , DATEADD(ENDOFMONTH('Date'[FullDateAlternateKey]),\
  \ -14, DAY)\n,ENDOFMONTH('Date'[FullDateAlternateKey])))\n```\n\n尽管大多数度量值只需对基础聚合稍加扩展就能实现从低层级向高层级的聚合（例如，从天到月），但有时你需要使用特殊的聚合方式来汇总度量值。这种度量值被称为**半累加性**度量值，将在下一节中介绍。\n\
  \n#### 创建半累加性度量值\n\n在分析数据时，你经常会遇到半累加性度量值。一些常见的例子包括库存和账户余额。例如，要确定当前时间点的库存总量，你需要将所有店铺的库存相加。但是，要找出店铺在月末的库存总量，你并不需要将每天的库存都加起来。\n\
  \n为了处理这些情况，`DAX` 提供了 `FIRSTNONBLANK` 和 `LASTNONBLANK` 函数。这些函数返回非空条件下的第一个或最后一个日期。例如，以下表达式确定了产品库存条目的最后一个非空日期。\n\
  \n```\nLASTNONBLANK ('Date'[DateKey],CALCULATE (SUM(Inventory[UnitsInStock]))\n\
  ```\n\n然后，将其与 `CALCULATE` 函数结合使用，以确定库存总量。\n\n```\nProduct Units In Stock:=CALCULATE(SUM(Inventory[UnitsInStock]),\n\
  \  LASTNONBLANK('Date'[DateKey],\n   CALCULATE(SUM(Inventory[UnitsInStock]))))\n\
  ```\n\n现在，如果你想要汇总所有产品的库存数量，可以使用以下表达式。\n\n```\nTotal Units In Stock:=SUMX(VALUES('Inventory'[ProductKey]),[Product\
  \ Units In Stock])\n```\n\n图 6-12 显示了生成的数据透视表。请注意，`Total Units In Stock` 度量值在产品维度上是累加的，但在日期维度上是非累加的。\n\
  \n![9781430264453_Fig06-12.jpg](img/9781430264453_Fig06-12.jpg)\n\n图 6-12. 计算库存数量\n\
  \n`DAX` 的优势之一在于，一旦你掌握了一种模式，就可以将其扩展到其他场景。例如，在现金流量分析中计算度量值时，你可以采用与计算库存时相同的技术。以下计算用于计算期末余额。\n\
  \n```\nBalance:=CALCULATE ( SUM ( Finance[Amount]),\n  LASTNONBLANK ('Date'[DateKey],\n\
  \   CALCULATE(SUM ( Finance[Amount]))))\n```\n\n在前面的例子中，只有当库存或余额发生变化时，才会在表中添加一行记录。通常情况下，余额或库存每天都会被记录，并且相同的值会一直重复，直到发生变化。在这些情况下，你可以使用\
  \ `DAX` 函数 `CLOSINGBALANCEMONTH`、`CLOSINGBALANCEQUARTER` 和 `CLOSINGBALANCYEAR`。这些函数会查找时间段的最后一个日期，并将其用作该时间段的值。换句话说，`CLOSINGBALANCEMONTH`\
  \ 函数返回的是该月最后一天的值。\n\n至此，你应该对各种时间函数的运作方式有了较好的理解。在接下来的实践中，你将练习实现其中的一些函数。\n\n#### 动手实验——在\
  \ Power Pivot 中实现时间智能\n\n在以下实验中，你将\n\n*   创建日期表。\n*   使用时间智能函数分析数据。\n*   创建环比增长数据透视表。\n\
  *   创建库存水平报表。\n\n1.  在 `LabStarters` 文件夹中，打开 `LabChapter6.xlsx` 文件。该文件包含来自 Consoto\
  \ 测试数据库的库存和销售数据。\n2.  以关系图视图模式打开 Power Pivot 窗口（参见图 6-13）。请注意，没有`Date`表。我们可以从数据源加载一个，或者在\
  \ Excel 中创建一个。\n\n![9781430264453_Fig06-13.jpg](img/9781430264453_Fig06-13.jpg)\n\
  \n图 6-13. 当前的 Consoto 数据模型\n\n3.  要在 Excel 中创建`Date`表，请切换到工作表 Sheet3。选中第一个单元格，输入列名\
  \ **DateKey**。在该列的第二个单元格中输入值 **1/1/2007**。使用 Excel 的自动填充功能添加 2009 年 12 月 31 日之前的值。\n\
  4.  要根据这些值创建表，请选中 A 列中的值。在“开始”选项卡下，选择“套用表格格式”下拉菜单，并选择一种格式。在“表工具设计”选项卡下，将表名称更改为 **Date**（参见图\
  \ 6-14）。\n\n![9781430264453_Fig06-14.jpg](img/9781430264453_Fig06-14.jpg)\n\n图 6-14.\
  \ 创建日期表\n\n5.  要将该表添加到模型中，请选择该表，然后在 PowerPivot 选项卡下单击“添加到数据模型”按钮（参见图 6-15）。\n\n\
  ![9781430264453_Fig06-15.jpg](img/9781430264453_Fig06-15.jpg)\n\n图 6-15. 将 Excel\
  \ 表添加到数据模型\n\n6.  你应该会在 Power Pivot 设计窗口的数据视图窗口中看到该表。单击“设计”选项卡，然后选择“标记为日期表”。使用 `DateKey`\
  \ 作为唯一标识符。\n7.  使用日期函数创建“年份”、“月份编号”和“月份”列（你必须使用 `FORMAT` 函数来创建“月份”列）。按“月份编号”列对“月份”列进行排序。\n\
  8.  切换到模型的关系图视图。使用“年份”和“月份”在`Date`表中创建一个“日历”层次结构。\n9.  在`Sales`表和`Date`表之间创建关系（参见图\
  \ 6-16）。\n\n![9781430264453_Fig06-16.jpg](img/9781430264453_Fig06-16.jpg)\n\n图 6-16.\
  \ 创建 Sales 表和 Date 表之间的关系\n\n10. 在数据视图窗口中选中`Sales`表。添加以下度量值并将其格式化为货币：\n\n    ```\n\
  \    Sum of Sales:=SUM(Sales[SalesAmount])\n    YTD Sales:=TOTALYTD([Sum of Sales],'Date'[Datekey])\n\
  \    MTD Sales:=TOTALMTD([Sum of Sales],'Date'[Datekey])\n    ```\n\n11. 要测试度量值，请转到\
  \ Excel 中的 Sheet1 工作表，并单击单元格 B2。在“插入”选项卡上，选择“数据透视表”。在“创建数据透视表”窗口中，选择“使用外部数据源”，然后单击“选择连接”按钮（参见图\
  \ 6-17）。\n\n![9781430264453_Fig06-17.jpg](img/9781430264453_Fig06-17.jpg)\n\n图 6-17.\
  \ 选择外部数据源\n\n12. 在“现有连接”窗口中，选择“表”选项卡。在“表”选项卡中，选择“工作簿数据模型中的表”，然后单击“打开”（参见图 6-18）。选择连接后，在“创建数据透视表”窗口中单击“确定”。\n\
  \n![9781430264453_Fig06-18.jpg](img/9781430264453_Fig06-18.jpg)\n\n图 6-18. 选择数据模型连接\n\
  \n13. 将度量值 `Sum Of Sales`、`MTD Sales` 和 `YTD Sales` 添加到“值”区域，并将“日历”层次结构添加到“行”区域。在“插入”选项卡中，选择“切片器”，然后选择\
  \ `ChannelName`。研究数据并验证其是否符合你的预期（参见图 6-19）。\n\n![9781430264453_Fig06-19.jpg](img/9781430264453_Fig06-19.jpg)\n\
  \n图 6-19. 验证年初至今的销售额度量值\n\n14. 切换到数据模型中的`Sales`表。使用以下表达式创建一个滚动 3 个月的销售额度量值。将度量值格式化为货币。\n\
  \n```\nRolling 3 Month Sales:=CALCULATE([Sum of Sales],\nDATESINPERIOD('Date'[Datekey],LASTDATE('Date'[Datekey]),-3,MONTH))\n\
  ```\n\n15. 将该度量值添加到 Sheet1 工作表中的数据透视表，并验证其是否按预期工作。\n16. 接下来，你想要比较一个月到下一个月之间的销售额增长情况。首先创建一个上个月的销售额度量值。\n\
  \n```\nPrev Month Sales:=CALCULATE([Sum of Sales],\nPARALLELPERIOD('Date'[DateKey],-1,MONTH))\n\
  ```\n\n\n\n17.  Next, create a sales growth rate measure using the previous month's\
  \ sales and the current month's sales. Format the measure as a percentage. Note\
  \ that you need to check to ensure there are sales for the previous month. If not,\
  \ return a blank value.\n\n```\nMonthly Sales Growth:=if(NOT(ISBLANK([Prev Month\
  \ Sales])), \n    ([Sum of Sales] - [Prev Month Sales])/[Prev Month Sales],BLANK())\n\
  ```\n\n18.  Create a PivotTable on Sheet2 in Excel, as shown in Figure 6-20, to\
  \ test your results.\n\n![9781430264453_Fig06-20.jpg](img/9781430264453_Fig06-20.jpg)\n\
  \nFigure 6-20. Testing the monthly sales growth rate measure\n\n19.  To study semi-additive\
  \ measures, you need to create a PivotTable that displays inventory quantities.\
  \ First, create a relationship between the `Inventory` table and the `Date` table.\n\
  20.  Add the following inventory quantity measure to the `Inventory` table:\n\n\
  ```\nInventory Count:=SUM([OnHandQuantity])\n```\n\n21.  To calculate inventory\
  \ over a period of time, you need to find the last non-empty entry within that time\
  \ period. The following formula will provide that value. The date range starts as\
  \ blank (earlier than the first date), and the final date is the maximum date. You\
  \ will use this as part of a formula in step 22.\n\n```\nLNB Date:=LASTNONBLANK(\n\
  \    DATESBETWEEN('Date'[Datekey],BLANK(),MAX('Date'[Datekey]))\n    ,[Inventory\
  \ Count])\n```\n\n22.  Using the last non-blank filter and the `CALCULATE` function,\
  \ you can calculate the last non-blank quantity for a product. Add the following\
  \ measure to the `Inventory` table.\n\n```\nLNB Quantity:=CALCULATE([Inventory Count],\n\
  \    LASTNONBLANK(DATESBETWEEN('Date'[Datekey],\n    BLANK(),MAX('Date'[Datekey])),[Inventory\
  \ Count]))\n```\n\n23.  Now, you can sum the quantity for the selected products.\
  \ Add the following measure to the `Inventory` table.\n\n```\nProduct Quantity:=SUMX(\n\
  \    VALUES(Product[ProductKey]),[LNB Quantity])\n```\n\n24.  The final step is\
  \ to sum the inventory across all selected stores using the following measure.\n\
  \n```\nInventory Level:=SUMX(Values(Store[StoreKey]),[Product Quantity])\n```\n\n\
  25.  To test the measure, add a new worksheet in Excel and create a PivotTable as\
  \ shown in Figure 6-21.\n\n![9781430264453_Fig06-21.jpg](img/9781430264453_Fig06-21.jpg)\n\
  \nFigure 6-21. Testing the inventory measure\n\n## Summary\n\nThis chapter provided\
  \ you with the foundational knowledge needed to successfully work with date and\
  \ time-based analysis using Power Pivot and DAX. You should now understand how to\
  \ shift date contexts to compare measures based on parallel periods. You should\
  \ also be comfortable using Period-to-Date DAX formulas to aggregate measures. Combine\
  \ the concepts you learned in Chapter 5 and this chapter; when you do, you should\
  \ begin to recognize patterns in your analysis. Based on these patterns, you can\
  \ identify the DAX templates needed to solve your problem. Because not everyone\
  \ is familiar with creating PivotTables and PivotCharts in Excel, the next chapter\
  \ will show you the basics of creating dashboards in Excel based on your model.\
  \ If you are familiar with these concepts, you can skip Chapter 7.\n\n"
- "# Chapter 7\n\n![image](img/frontdot.jpg)\n\n## Data Analysis with PivotTables\
  \ and Charts\n\nOnce you have created your data model in Power Pivot, you need to\
  \ create an interface for users to interact with the data model and perform data\
  \ analysis using the model. Depending on the type of analysis being performed, you\
  \ can use several programs to interact with the model; these include Power View,\
  \ Power Map, Performance Point, and Reporting Services. While all of these are viable\
  \ clients, one of the best client tools is Excel itself. Excel is a feature-rich\
  \ environment well-suited for creating dashboards using PivotTables and PivotCharts.\
  \ Additionally, it is very easy to share Excel files on SharePoint or host Excel\
  \ workbooks to improve performance and security. This chapter covers the basics\
  \ of building an interface for analyzing data within a Power Pivot model using PivotTables\
  \ and PivotCharts in Excel.\n\nAfter completing this chapter, you will be able to:\n\
  \n*   Use PivotTables to explore data.\n*   Use slicers to filter data.\n*   Add\
  \ visualizations to PivotTables.\n*   Use PivotCharts to explore trends.\n*   Use\
  \ multiple linked charts and tables together.\n*   Query the data model using Cube\
  \ Functions\n\n![Image](img/sq.jpg) **Note** This chapter contains references to\
  \ color images. If you are reading the print version or a black-and-white electronic\
  \ version of this book, you can find copies of the color images in the source code/download\
  \ package for this book at `http://www.apress.com/9781430264453`.\n\n## PivotTable\
  \ Basics\n\nOne of the most widely used tools for data analysis is the PivotTable.\
  \ PivotTables allow you to easily discover patterns and relationships from your\
  \ data. For example, you can determine which products sell better at a specific\
  \ time of year. Or you can see how marketing campaigns impacted sales of various\
  \ products. Figure 7-1 shows the areas of a PivotTable.\n\nRow fields and column\
  \ fields contain the attributes you are interested in for aggregating your data.\
  \ For example, the PivotTable in Figure 7-1 aggregates values by product category\
  \ and year. Filters are used to filter the values in the PivotTable based on an\
  \ attribute. In this case, the filter in Figure 7-1 restricts the results to the\
  \ first quarter of each year. Slicers here perform the same role as filters, limiting\
  \ values to large dealers only. The added advantage of slicers is that they can\
  \ simultaneously filter multiple PivotTables and PivotCharts.\n\n![9781430264453_Fig07-01.jpg](img/9781430264453_Fig07-01.jpg)\n\
  \nFigure 7-1. Components of a PivotTable\n\nTo build a PivotTable, drag fields from\
  \ the \"Field List\" to the drop zones below the \"Field List\", as shown in Figure\
  \ 7-2. If you simply check a box to select a field, it will place text fields in\
  \ the Rows area and all numeric fields in the Values area. This can become quite\
  \ annoying because it will place fields like `Years` into the Values area and treat\
  \ them as a set of values to be summed. (In Chapter 8, I will show you how to avoid\
  \ this.)\n\n![9781430264453_Fig07-02.jpg](img/9781430264453_Fig07-02.jpg)\n\nFigure\
  \ 7-2. Adding fields to a PivotTable\n\nTo add slicers to filter your PivotTable,\
  \ you need to go to the \"Insert\" tab in Excel and select the \"Slicer\" button.\
  \ In the next section, you will learn how to add a slicer and how to make the same\
  \ slicer control multiple PivotTables.\n\n## Slicing Data\n\nTo add a slicer to\
  \ filter a PivotTable, click on the PivotTable, then select the \"Slicer\" button\
  \ on the \"Insert\" tab. You should see a pick list containing fields from your\
  \ Power Pivot data model (see Figure 7-3).\n\n![9781430264453_Fig07-03.jpg](img/9781430264453_Fig07-03.jpg)\n\
  \nFigure 7-3. Selecting slicer fields\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\
  \n\n由于您在插入切片器时已选中了数据透视表，因此切片器会自动连接到该数据透视表。您可以通过点击切片器并选择`切片器工具 选项`选项卡来验证这一点（见图 7-4）。您可以使用此选项卡来设置切片器的格式，并选择切片器的报表连接。\n\
  \n![9781430264453_Fig07-04.jpg](img/9781430264453_Fig07-04.jpg)\n\n图 7-4. 设置切片器连接\n\
  \n图 7-5 显示了切片器的`报表连接`选择列表。请注意，数据透视表不必与切片器位于同一工作表上。数据透视表的名称是创建时 Excel 赋予它们的通用名称。随着您添加更多数据透视表，最好为它们指定更有意义的名称。如果您单击数据透视表并转到`数据透视表工具\
  \ 分析`选项卡，您将看到一个文本框，您可以在其中更改数据透视表的名称。\n\n![9781430264453_Fig07-05.jpg](img/9781430264453_Fig07-05.jpg)\n\
