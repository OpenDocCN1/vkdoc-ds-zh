  #### 总结


  正如你在本章中所见，Power Map 是一个强大的 Excel 加载项，提供了一套工具，帮助你可视化并深入了解具有地理成分的数据。你可以通过在地图（Bing
  map）上方以柱形形式绘制数据，来生成出色的 3D 可视化效果。此外，如果数据包含日期或时间成分，你可以使用 Power Map 可视化随时间变化的数据。你还学习了如何创建热力图和区域地图，对于某些类型的数据集，这些是可视化并发现数据洞察的绝佳方法。Power
  Map 的另一个强大功能是能够在同一张地图上叠加多个数据图层，这使你能够比较通过位置关联起来的数据。


  请记住，当前 Power Map 仍在开发中，新功能会定期添加。请确保你使用的是最新版本，以便充分利用这些功能。




  在下一章中，你将了解商业智能分析中最有趣的方面之一：预测分析。预测分析使你能够从历史数据中提取信息，并利用这些信息预测未来的行为和趋势。Excel 提供了一套数据挖掘工具，让预测分析易于实现。使用这些工具，你可以执行高级数据分析，例如预测、聚类和关联分析。第
  13 章将向你介绍这些工具，并展示如何实现一些常见的数据挖掘模型，从而深入了解你的数据。


