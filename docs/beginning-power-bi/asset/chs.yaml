  ID`列上，点击下拉菜单以筛选数据。取消勾选`状态 0`和`状态 2`。`状态 3`表示已关闭状态（请参见图 2-36）。


  ![9781430264453_Fig02-36.jpg](img/9781430264453_Fig02-36.jpg)


  图 2-36. 筛选表行


  10. 完成选择表后，点击`完成`按钮以导入数据。导入后，关闭向导。您应该会看到每个表都作为数据视图窗口中的一个选项卡显示（请参见图 2-37）。


  ![9781430264453_Fig02-37.jpg](img/9781430264453_Fig02-37.jpg)


  图 2-37. 数据视图窗口中的表


  11. 现在，您将使用查询来选择订单详情。在 Power Pivot 模型设计器中，选择`主页`选项卡。在`主页`选项卡中，选择`现有连接`按钮。在连接窗口中，选择`Access
  Northwind`连接，然后点击`打开`。

  12. 这次，请选择`编写将指定要导入数据的查询`。

