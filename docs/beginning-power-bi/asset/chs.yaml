  \ 的源代码/下载部分。\n\n#### 创建表格和矩阵\n\n正如您在上章所学，Power View 中的所有可视化效果最初都是从表格开始的，然后才转换为其他类型的可视化效果。虽然表格是最基本的数据可视化类型之一，但它仍然是查看数据最有用的方式之一，特别是当您需要查找详细信息时。图\
  \ 9-1 显示了展示客户联系信息的表格。\n\n![9781430264453_Fig09-01.jpg](img/9781430264453_Fig09-01.jpg)\n\
  \n图 9-1. 客户联系信息\n\n当您将表格与 Power View 自带的自动筛选功能结合使用时，这将成为根据客户人口统计数据查找客户的绝佳方式。在视图中选中表格后，点击“筛选器”区域中的`Table`选项卡（参见图\
  \ 9-2）。表格中的字段将自动出现在表格筛选器列表中。若要将一个您希望用于筛选但不想显示在表格中的字段添加到筛选器列表，只需将该字段从“Power View\
