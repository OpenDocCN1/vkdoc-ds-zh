  \ Sales Territory 层次结构\n\n17.  在 `Date` 表中使用 `Year`、`Quarter` 和 `Month` 创建一个名为 `Calendar`\
  \ 的 `Calendar` 层次结构。\n18.  切换到设计器的数据视图并选择 `Date Table` 选项卡。选择 `Month` 列，并将其 `Sort\
  \ By Column` 设置为 `Month No.` 列。\n19.  完成后保存并关闭 Excel。\n\n#### 总结\n\n在 Power Pivot\
  \ 中工作时，理解什么构成了一个好模型至关重要。一个好的模型将使 Power Pivot 运行得异常快速，并允许您轻松分析大量数据。与基于 Excel 工作表中单个表的传统\
  \ Excel 数据透视表不同，Power Pivot 数据透视表基于数据模型中的多个表。本章指导您完成创建坚实模型的过程，该模型将成为您数据分析的基础。此外，您还了解了如何向客户端工具呈现一个用户友好的模型。\n\
  \n既然您已经为模型打下了坚实的基础，就可以通过自定义计算来扩展模型了。下一章将介绍数据分析表达式 (DAX) 语言，并解释如何在数据模型中创建计算列。它包含大量示例，以帮助您创建模型中常见的计算。\n\
  \n### 第 4 章\n\n![image](img/frontdot.jpg)\n\n#### 使用 DAX 创建计算\n\n既然您已知道如何创建一个健壮的数据模型作为分析基础，下一步就是在模型中添加任何有助于您探索数据所需的计算。例如，您可能需要将代码值转换为有意义的描述，或者解析一个字符串以获取关键信息。这正是数据分析表达式\
  \ (DAX) 发挥作用的地方。本章向您介绍 DAX，并向您展示如何使用 DAX 创建计算列以增加模型的功能。\n\n完成本章后，您将能够：\n\n*   使用\
  \ DAX 向表中添加计算列。\n*   实现 DAX 运算符。\n*   使用 DAX 中的文本函数。\n*   使用 DAX 日期和时间函数。\n*   使用条件和逻辑函数。\n\
  *   从相关表中获取数据。\n*   使用数学、三角和统计函数。\n\n#### 什么是 DAX？\n\nDAX 是一种公式语言，用于在 Power Pivot\
  \ 模型中创建计算列和度量值。它是一种专为 Power Pivot 所基于的表格数据模型而开发的新语言。如果您熟悉 Excel 的公式语法，您会发现 DAX 语法非常相似。事实上，一些\
  \ DAX 公式与其对应的 Excel 公式具有相同的语法和功能。主要的区别在于，Excel 公式基于单元格，而 DAX 基于列，这一点您需要理解。例如，如果您想在\
  \ Excel 中连接两个值，您会使用如下公式：\n\n```\n=A1 & \" \" & B1\n```\n\n其中 `A1` 是第一行第一列的单元格，`B1`\
  \ 是第一行第二列的单元格（见图 4-1）。\n\n![9781430264453_Fig04-01.jpg](img/9781430264453_Fig04-01.jpg)\n\
  \n图 4-1. 在 Excel 中输入公式\n\n这与 DAX 公式非常相似：\n\n```\n=[First Name] & \" \" & [Last Name]\n\
  ```\n\n其中 `First Name` 和 `Last Name` 是模型中表的列（见图 4-2）。\n\n![9781430264453_Fig04-02.jpg](img/9781430264453_Fig04-02.jpg)\n\
  \n图 4-2. 在 Power Pivot 中输入公式\n\n不同之处在于，DAX 公式应用于表中的所有行，而 Excel 公式仅作用于特定单元格。在 Excel\
  \ 中，您需要在每一行中重新创建公式。\n\n这意味着，尽管您可以在 Excel 中执行如下操作：\n\n```\n=A1 & \" \" & B2\n```\n\
  \n即，从第一行取一个单元格并与第二行的单元格连接（见图 4-3），但这在 DAX 中无法实现。\n\n![9781430264453_Fig04-03.jpg](img/9781430264453_Fig04-03.jpg)\n\
  \n图 4-3. 在不同行中使用单元格\n\n在创建 DAX 公式时，考虑数据类型以及计算中可能发生的任何转换非常重要。如果您不考虑这些，公式可能会出现错误或产生意外的结果。模型中支持的数据类型是整数、小数、货币、布尔值、文本和日期。DAX\
  \ 还有一种表数据类型，它用于许多以表作为输入值并返回表的函数中。\n\n当您尝试将数值数据类型与文本数据类型相加时，会发生隐式转换。如果 DAX 可以将文本转换为数值，则会将它们作为数字相加；如果不能，您将收到错误。另一方面，如果您尝试将数值数据类型与文本数据类型连接，DAX\
  \ 会将数值数据类型隐式转换为文本。尽管大多数时候隐式转换会给出您期望的结果，但这是以性能损失为代价的，应尽可能避免。例如，如果您从文本文件导入数据，并且该列设置为文本数据类型，但您知道它实际上是数值，那么您应该更改模型中的数据类型。\n\
  \n在 DAX 中创建计算时，需要引用表和列。如果表名不包含空格，则可以直接通过名称引用。如果表名包含空格，则需要用单引号将其括起来。列和度量值用方括号括起来。如果您在公式中仅列出列名，则假定该列存在于同一个表中。如果您要引用另一个表中的列，则需要使用完全限定名称，即表名后跟列名。以下代码演示了语法：\n\
  \n```\n=[SalesAmount] - [TotalCost]\n=Sales[SalesAmount] - Sales[TotalCost]\n='Internet\
  \ Sales'[SalesAmount] - 'Internet Sales'[TotalCost]\n```\n\n以下是使用 DAX 时需要牢记的其他要点：\n\
  \n*   DAX 公式和表达式不能修改或插入表中的单个值。\n*   您不能使用 DAX 创建计算行。只能创建计算列和度量值。\n*   在定义计算列时，您可以嵌套任意层级的函数。\n\
  \n创建计算时首先要理解的是支持哪些运算符以及使用它们的语法是什么。在下一节中，您将研究各种 DAX 运算符。\n\n#### 实现 DAX 运算符\n\nDAX\
  \ 包含一套强大的运算符，包括算术、比较、逻辑和文本连接。其中大多数对您来说应该很熟悉，并列在表 4-1 中。\n\n表 4-1. DAX 运算符\n\n| 类别\
  \ | 符号 | 用途 |\n| --- | --- | --- |\n| 算术运算符 |\n|   | `+` | 加法 |\n|   | `-` | 减法\
  \ |\n|   | `*` | 乘法 |\n|   | `/` | 除法 |\n|   | `^` | 乘幂 |\n| 比较运算符 |\n|   | `=`\
  \ | 等于 |\n|   | `>` | 大于 |\n|   | `<` | 小于 |\n|   | `>=` | 大于或等于 |\n|   | `<=` |\
  \ 小于或等于 |\n|   | `<>` | 不等于 |\n| 文本连接运算符 |\n|   | `&` | 连接 |\n|   |   | 逻辑运算符 |\n\
  |   | `&&` | 与 |\n|   | `&#124;&#124;` | 或 |\n\n\n##### 算术运算符\n以算术运算符为例，以下代码将`Margin`列除以`Total\
  \ Cost`列，创建一个名为`Margin Percentage`的新列。\n```\n=[Margin]/[TotalCost]\n```\n\n在同一计算中包含多个算术运算的情况非常常见。此时需要注意运算顺序：指数运算优先计算，其次是乘法和除法，最后是加法和减法。您可以通过使用括号对计算进行分组来控制运算顺序；例如，以下公式将在除法之前执行减法。\n\
  ```\n=([Sales Amount]-[Total Cost])/[Total Cost]\n```\n\n##### 比较运算符\n比较运算符主要用于`IF`语句。例如，以下计算会检查门店的销售面积是否大于\
  \ 1000。如果是，则归类为大型门店；否则归类为小型门店。\n```\n=IF([Selling Area Size]>1000,\"Large\",\"Small\"\
  )\n```\n\n##### 逻辑运算符\n逻辑运算符用于创建多重比较逻辑。以下代码检查门店面积是否大于 1000 或员工人数是否超过 35，以将其归类为大型门店。\n\
  ```\n=IF([Selling Area Size]> 1000 || [Employee Count] > 35,\"Large\",\"Small\"\
  )\n```\n\n当串联一系列逻辑条件时，最好使用括号来控制运算顺序。以下代码检查门店面积是否大于 1000 且员工人数是否超过 35，以将其归类为大型门店。如果其年销售额超过\
  \ 1,000,000 美元，无论面积或员工人数如何，也会将其归类为大型门店。\n```\n=IF(([Selling Area Size]> 1000 &&\
  \ [Employee Count] > 35) || [Annual Sales] > 1000000,\"Large\",\"Small\")\n```\n\
  \n##### 嵌套函数\n在使用 DAX 计算时，可能需要将一个公式嵌套在另一个公式内部。例如，以下代码将一个`IF`语句嵌套在另一个`IF`语句的假值部分。如果员工人数不大于\
  \ 35，则跳转到下一个`IF`语句，检查是否大于 20。\n```\n=IF(Store[EmployeeCount]>35,\"Large\",IF(Store[EmployeeCount]>20,\"\
  Medium\",\"Small\"))\n```\n\n##### DAX 函数概述\nDAX 包含许多用于创建计算和度量的有用函数。这些函数包括文本函数、日期和时间函数、统计函数、数学函数以及信息函数。接下来几节将介绍如何在计算中使用各种函数类型。\n\
  \n#### 使用文本函数\n许多计算都涉及某种形式的文本处理。可能需要截断、解析、搜索或格式化从源系统加载的文本值。DAX 包含许多用于处理文本的有用函数。这些函数列于表\
  \ 4-2 中，并附有各自的用途说明。\n\n表 4-2. DAX 文本函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `BLANK`\
  \ | 返回一个空值。 |\n| `CONCATENATE` | 将两个文本字符串连接成一个文本字符串。 |\n| `EXACT` | 比较两个文本字符串，如果完全相同则返回\
  \ TRUE，否则返回 FALSE。 |\n| `FIND` | 返回一个文本字符串在另一个文本字符串中的起始位置。 |\n| `FIXED` | 将数字舍入到指定小数位数，并将结果作为文本返回。\
  \ |\n| `FORMAT` | 根据指定格式将值转换为文本。 |\n| `LEFT` | 从文本字符串开头返回指定数量的字符。 |\n| `LEN` | 返回文本字符串中的字符数。\
  \ |\n| `LOWER` | 将文本字符串中的所有字母转换为小写。 |\n| `MID` | 根据给定的起始位置和长度，从文本字符串中返回一串字符。 |\n\
  | `REPLACE` | 用不同的文本字符串替换文本字符串的一部分。 |\n| `REPT` | 将文本重复指定次数。使用`REPT`可以用文本字符串的多个实例填充单元格。\
  \ |\n| `RIGHT` | 基于指定的字符数，返回文本字符串中最后一个或几个字符。 |\n| `SEARCH` | 返回特定字符或文本字符串首次出现的位置编号（从左向右读取）。\
  \ |\n| `SUBSTITUTE` | 在文本字符串中用新文本替换现有文本。 |\n| `TRIM` | 删除文本中除单词间单个空格之外的所有空格。 |\n\
  | `UPPER` | 将文本字符串转换为全部大写字母。 |\n| `VALUE` | 将表示数字的文本字符串转换为数字。 |\n\n##### 文本函数使用示例\n\
  假设在`products`表中有一个`Product Code`列，其中前两个字符代表产品系列。要创建产品系列列，可以使用`Left`函数，如下所示：\n```\n\
  =Left([Product Code],2)\n```\n\n可以使用`FIND`函数在文本中搜索子文本。可以使用问号（`?`）匹配任意单个字符，使用星号（`*`）匹配任意字符序列。还可以指定搜索的起始位置。`FIND`函数返回找到的子字符串的起始位置。如果未找到子字符串，它可以返回\
  \ 0、-1 或空值。以下代码在产品描述列中搜索单词“mountain”。\n```\n=FIND(\"mountain\",[Description],1,-1)\n\
  ```\n\n`FORMAT`函数根据提供的格式将值转换为文本。例如，可能需要将日期转换为特定格式。以下代码将日期数据类型转换为格式类似“Mon - Dec 02,\
  \ 2013”的字符串。\n```\n=FORMAT([StartDate],\"ddd - MMM dd, yyyy\")\n```\n\n除了可以创建自己的格式之外，还可以使用预定义的格式。以下代码演示了使用“Long\
  \ Date”格式“Monday, December 2, 2013”。\n```\n=FORMAT([StartDate],\"Long Date\")\n\
  ```\n\n#### 使用 DAX 日期和时间函数\n在进行数据分析时，很可能涉及日期组件。可能需要查看销售额或能源消耗，并需要知道事件发生的星期几。可能还需要计算年龄或到期日期。DAX\
  \ 提供了许多日期和时间函数来帮助创建此类计算。表 4-3 总结了可用的各种日期和时间函数。\n\n表 4-3. DAX 日期和时间函数\n\n\n\n| 函数\
  \ | 说明 |\n| --- | --- |\n| `DATE` | 返回指定日期的日期时间格式 |\n| `DATEVALUE` | 将文本形式的日期转换为日期时间格式的日期\
  \ |\n| `DAY` | 返回一个月中的第几天 |\n| `EDATE` | 返回起始日期之前或之后指定月份数的日期 |\n| `EOMONTH` | 返回指定月份数之前或之后月份最后一天的日期时间格式\
  \ |\n| `HOUR` | 返回小时数，范围从 0（上午 12:00）到 23（下午 11:00） |\n| `MINUTE` | 返回分钟数，范围从 0\
  \ 到 59 |\n| `MONTH` | 返回月份数，范围从 1（一月）到 12（十二月） |\n| `NOW` | 返回当前日期和时间的日期时间格式 |\n\
  | `SECOND` | 返回时间值的秒数，范围从 0 到 59 |\n| `TIME` | 将以数字形式给出的小时、分钟和秒转换为日期时间格式的时间 |\n\
  | `TIMEVALUE` | 将文本格式的时间转换为日期时间格式的时间 |\n| `TODAY` | 返回当前日期 |\n| `WEEKDAY` | 返回一个从\
  \ 1 到 7 的数字，用于标识某个日期的星期几 |\n| `WEEKNUM` | 返回给定日期的周数 |\n| `YEAR` | 返回日期的年份，以四位整数表示\
  \ |\n| `YEARFRAC` | 计算两个日期之间整日数所代表的年份分数 |\n\n以日期函数的使用为例，你需要计算员工的在职年限。首先要做的是找出当前年份与员工入职年份之间的差值。以下代码从今天日期中获取年份。\n\
  \n```\n=YEAR(Today())\n```\n\n现在你可以减去他们入职日期的年份。请注意，我们正在将一个函数嵌套到另一个函数中。嵌套函数是许多计算中的常见需求。\n\
  \n```\n=YEAR(TODAY()) - YEAR([HireDate])\n```\n\n细心的读者会发现，只有当当前月份大于或等于入职月份时，这个计算结果才是正确的。你可以使用一个条件性的\
  \ `if` 语句来调整，如下所示：\n\n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),YEAR(TODAY())\
  \ - YEAR([HireDate]),YEAR(TODAY()) - YEAR([HireDate])-1)\n```\n\n如你所见，计算很快就会变得相当复杂。挑战在于确保每个函数的前后括号正确对齐。一种组织代码的方法是使用多行和缩进。要在公式编辑栏中换行，你需要在按\
  \ Enter 的同时按住 Shift 键。我发现以下写法更容易理解。\n\n```\n= If (MONTH(TODAY())>=MONTH([HireDate]),\n\
  \        YEAR(TODAY()) - YEAR([HireDate]),\n        YEAR(TODAY()) - YEAR([HireDate])-1\n\
  \     )\n```\n\n不幸的是，在 Power Pivot 中你无法为代码添加注释。\n\n通常有多种方法可以创建计算。你可能会找到更简单的计算方法或性能更优的方法。以下示例使用\
  \ `YEARFRAC` 函数和 `TRUNC` 函数（一种数学函数）来计算在职年限，并去掉数字的小数部分。\n\n```\n=TRUNC(YEARFRAC([HireDate],TODAY()))\n\
  ```\n\n接下来你要研究的一组函数是信息函数和逻辑函数。当你想判断某个条件是否存在时，例如空白值或由于计算产生的错误，这些函数非常重要。这些函数允许你捕获条件并以适当方式响应。\n\
  \n#### 使用信息函数和逻辑函数\n\n当你开始构建更复杂的计算时，通常需要使用信息函数和逻辑函数来检查条件并响应各种情况。一个常见的例子是检查空白值。`ISBLANK`\
  \ 函数在值为空白时返回 `TRUE`，不为空白时返回 `FALSE`。以下代码根据中间名是否为空白来使用不同的计算方式。\n\n```\n=IF(ISBLANK([MiddleName]),\n\
  [FirstName] & \" \" & [LastName],\n[FirstName] & \" \" & [MiddleName] & \" \" &\
  \ [LastName]\n)\n```\n\n\n`ISERROR` 函数用于检查某个计算或函数是否返回错误。以下计算检查除法运算中是否会发生除零错误。\n\n\
  ```\n=IF(ISERROR([TotalProductCost]/[SalesAmount]),\n     BLANK(),\n     [TotalProductCost]/[SalesAmount]\n\
  \   )\n```\n\n创建此计算的另一种方法是使用 `IFERROR` 函数，如果未发生错误则返回原值，否则返回备用值。\n\n```\n=IFERROR([TotalProductCost]/[SalesAmount],BLANK())\n\
  ```\n\n表 4-4 和 表 4-5 列出了 DAX 中可用的逻辑函数和信息函数。\n\n表 4-4。DAX 逻辑函数\n\n| 函数 | 描述 |\n|\
  \ --- | --- |\n| `AND` | 检查两个参数是否均为 TRUE。 |\n| `FALSE` | 返回逻辑值 FALSE。 |\n| `IF`\
  \ | 检查第一个参数提供的条件是否满足。如果条件为 TRUE 则返回一个值，如果条件为 FALSE 则返回另一个值。 |\n| `IFERROR` | 计算表达式，如果表达式返回错误则返回指定值；否则返回表达式本身的值。\
  \ |\n| `NOT` | 将 FALSE 变为 TRUE，或将 TRUE 变为 FALSE。 |\n| `OR` | 检查任一参数是否为 TRUE，并返回\
  \ TRUE。 |\n| `SWITCH` | 根据值列表计算表达式，并返回多个可能结果表达式之一。 |\n| `TRUE` | 返回逻辑值 TRUE。 |\n\
  \n表 4-5。DAX 信息函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `CONTAINS` | 如果所有指定列的值都存在或包含于这些列中，则返回\
  \ true。 |\n| `ISBLANK` | 检查某个值是否为空。 |\n| `ISERROR` | 检查某个值是否为错误。 |\n| `ISLOGICAL`\
  \ | 检查某个值是否为布尔值。 |\n| `ISNONTEXT` | 检查某个值是否为非文本（空单元格不属于文本）。 |\n| `ISNUMBER` | 检查某个值是否为数字。\
  \ |\n| `ISTEXT` | 检查某个值是否为文本。 |\n| `LOOKUPVALUE` | 返回满足搜索条件的所有行中指定列的值。 |\n\n在分析数据时，您通常需要从相关表中查找对应的数据。您可能需要从相关代码中获取描述，或者汇总数据并将其导入到表中，例如生命周期销售额。以下部分将介绍如何使用\
  \ DAX 查找相关数据。\n\n##### 从相关表中获取数据\n\n有时需要查找其他表中的值以完成计算。如果表之间建立了关系，您可以使用 `RELATED`\
  \ 函数。这可以使表非规范化，并便于用户导航。例如，您可能有一个与地理表相关的客户表（参见 图 4-4）。\n\n![9781430264453_Fig04-04.jpg](img/9781430264453_Fig04-04.jpg)\n\
  \n图 4-4。使用 `RELATED` 函数\n\n如果您需要按客户所在国家/地区查看销售额，可以使用 `RELATED` 函数在客户表中创建一个“国家/地区”列。\n\
  \n```\n=RELATED(Geography[CountryRegionName])\n```\n\n然后，您可以从客户端工具中隐藏地理表，以保持模型更简洁，避免用户混淆。\n\
  \n虽然 `RELATED` 函数返回单个值，但有时您希望查看一组相关数据，并在显示到列中之前对其进行聚合。例如，您可能想在客户表中添加一列，列出其生命周期销售额。在这种情况下，您需要使用\
  \ `RELATEDTABLE` 函数获取相关销售额，然后对每个客户进行求和。\n\n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n\
  ```\n\n![Image](img/sq.jpg)  **注意**：上述代码使用了 `SUMX` 函数，该函数替代了 `SUM` 函数，因为您正在应用筛选器。第\
  \ 5 章 将对此进行更详细的讨论。\n\n我们最后要介绍的函数集是数学、三角和统计函数。这些函数允许您执行常见分析，如对数、标准差、四舍五入和截断。\n\n\
  ##### 使用数学、三角和统计函数\n\n除了到目前为止讨论的函数，DAX 还包含许多数学、三角和统计函数。数学函数（参见 表 4-6）用于对数据进行舍入、截断和求和。它们还包含可用于科学、工程和金融计算的函数；例如，您可能需要根据半径计算球体体积（参见以下\
  \ DAX 计算）：\n\n```\n=4*PI()*POWER([Radius],3)/3\n```\n\n表 4-6。DAX 中可用的部分数学和三角函数\n\
  \n| 函数 | 描述 |\n| --- | --- |\n| `ABS` | 返回数字的绝对值。 |\n| `CEILING` | 将数字向上舍入到最接近的整数或最接近的指定基数的倍数。\
  \ |\n| `EXP` | 返回 e 的指定次幂。 |\n| `FACT` | 返回数字的阶乘。 |\n| `FLOOR` | 将数字向下舍入（朝向零），到最接近的指定基数的倍数。\
  \ |\n| `LOG` | 返回指定底数的数字的对数。 |\n| `PI` | 返回圆周率 π 的值，精确到 15 位数字：3.14159265358979。\
  \ |\n| `POWER` | 返回数字乘幂的结果。 |\n| `ROUND` | 将数字四舍五入到指定的小数位数。 |\n| `SQRT` | 返回数字的平方根。\
  \ |\n| `SUM` | 对一列中的所有数字求和。 |\n| `TRUNC` | 通过删除数字的小数部分将数字截断为整数。 |\n\n再举一个例子，假设您想计算投资的复利。以下\
  \ DAX 计算可以确定投资的复利回报率。\n\n```\n=[Principal]*POWER(1+([IntRate]/[CompoundRate]),[CompoundRate]*[Years])\n\
  ```\n\n在分析数据时，您通常不仅需要查看数据之间的关系，还需要评估数据质量以及预测的可信度。这就是数据的统计分析发挥作用的地方。通过统计，您可以执行诸如识别和处理数据中的异常值、检查数据的波动性以及检测欺诈等操作。例如，您可以使用\
  \ DAX 通过标准差来确定并过滤掉数据中的异常值。以下 DAX 函数计算销售额的标准差。\n\n```\n=STDEVX.P(RELATEDTABLE(Sales),Sales[SalesAmount])\n\
  ```\n\n表 4-7 列出了 DAX 中可用的一些统计函数。\n\n表 4-7。DAX 中可用的部分统计函数\n\n| 函数 | 描述 |\n| --- |\
  \ --- |\n| `AVERAGE` | 返回列中所有数字的平均值。 |\n| `COUNT` | 计算列中包含数字的单元格个数。 |\n| `COUNTA`\
  \ | 计算列中非空单元格的个数。 |\n| `COUNTBLANK` | 计算列中空单元格的个数。 |\n| `COUNTROWS` | 计算指定表中的行数。\
  \ |\n| `DISTINCTCOUNT` | 计算数字列中不同单元格的个数。 |\n| `MAX` | 返回列中的最大数值。 |\n| `MIN` | 返回列中的最小数值。\
  \ |\n| `RANK.EQ` | 返回数字在数字列表中的排名。 |\n| `RANKX` | 为表参数中的每一行返回数字在数字列表中的排名。 |\n| `STDEV.S`\
  \ | 返回样本总体的标准差。 |\n| `TOPN` | 返回指定表中的前 N 行。 |\n| `VAR.S` | 返回样本总体的方差。 |\n\n现在您已经了解了\
  \ Power Pivot 和 DAX 中可用的函数。接下来，我将回顾一些创建函数时的一般技巧。\n\n##### 在 Power Pivot 中创建计算的技巧\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将英文文本翻译成中文。\n\n\n在进行动手实验之前，我想先给你一些在 Power\
  \ Pivot 中创建这些计算的小提示。为计算列输入公式时，请右键点击模型生成器数据视图窗口表格中的某一列。在上下文菜单中，选择 `Insert Column`（插入列）（参见图\
  \ 4-5）。\n\n![9781430264453_Fig04-05.jpg](img/9781430264453_Fig04-05.jpg)\n\n图 4-5。添加计算列\n\
  \n重命名该列，然后在公式编辑栏中输入公式。公式以等号（`=`）开头，表名包含在单引号（`''`）中，如果表名不包含空格，则单引号是可选的。表列包含在方括号（`[]`）中。公式编辑栏提供了自动完成功能，你应该善加利用（参见图\
  \ 4-6）。从下拉列表中选择函数、表或列，然后按 Tab 键将其插入到公式中。如果你没有看到自动填充下拉列表，则说明你的公式可能存在错误。\n\n![9781430264453_Fig04-06.jpg](img/9781430264453_Fig04-06.jpg)\n\
  \n图 4-6。创建计算时使用自动完成功能\n\n公式编辑栏旁有三个按钮：`X` 用于取消所做的更改；复选标记用于提交更改；函数符号用于启动 `Insert Function`（插入函数）窗口（参见图\
  \ 4-7）。你可以浏览各种函数，并获取有关函数所需参数的信息。\n\n![9781430264453_Fig04-07.jpg](img/9781430264453_Fig04-07.jpg)\n\
  \n图 4-7。使用函数助手\n\n当你错误地创建计算时，可能会收到一个错误指示器。你应该点击错误下拉菜单并选择 `Show Error`（显示错误）（参见图\
  \ 4-8）。这将显示一条错误消息（参见图 4-9），其中会提供有用的信息，可以帮助你修复错误。\n\n![9781430264453_Fig04-08.jpg](img/9781430264453_Fig04-08.jpg)\n\
  \n图 4-8。显示错误信息\n\n![9781430264453_Fig04-09.jpg](img/9781430264453_Fig04-09.jpg)\n\
  \n图 4-9。查看错误消息\n\n现在你已经了解了如何使用 DAX 创建计算，并熟悉了可用的 DAX 函数，是时候获取一些动手经验了。\n\n#### 动手实验——在\
  \ Power Pivot 中创建计算列\n\n在以下实验中，你将：\n\n-   创建计算列。\n-   使用 DAX 文本函数。\n-   在 DAX 表达式中使用日期函数。\n\
  -   在表达式中使用来自相关表的数据。\n-   在表达式中实现条件逻辑。\n\n1.  在 `Lab Starters` 文件夹中，打开 `LabChap4Starter.xlsx`\
  \ 文件。该文件包含一个由销售数据、产品数据和商店数据组成的数据模型。\n2.  使用关系图视图在 Power Pivot 窗口中查看模型（参见图 4-10）。\n\
  \n![9781430264453_Fig04-10.jpg](img/9781430264453_Fig04-10.jpg)\n\n图 4-10。商店销售数据模型\n\
  \n3.  切换到 Power Pivot 窗口中的数据视图，并选择 `Sales` 表。\n4.  在 `SalesAmount` 列之后，点击 `Add Column`（添加列）。在表格上方的公式栏中，输入以下公式以计算利润：\n\
  \n    ```\n    =[SalesAmount] - [TotalCost]\n    ```\n\n5.  右键点击新列并将其重命名为 `Margin`。\n\
  6.  重复此过程以创建 `MarginPercent` 列，并使用以下公式：\n\n    ```\n    =[Margin]/[SalesAmount]\n\
  \    ```\n\n7.  在数据视图窗口中，选择 `Date` 表。\n8.  使用日期函数创建一个 `Year`（年）、`Quarter`（季度）、`Month`（月份）、`Month\
  \ Number`（月份编号）和 `Weekday`（星期）列。\n9.  使用 `Year`、`Quarter` 和 `Month` 列，在 `Date` 表中创建一个\
  \ `Calendar`（日历）层次结构。\n10. 在数据视图窗口中，选择 `Product` 表。\n11. 插入一个 `Weight Label`（重量标签）列，并使用以下公式：\n\
  \n    ```\n    =if(ISBLANK([Weight]),BLANK(), [Weight] & \" \" & [WeightUnitMeasureID])\n\
  \    ```\n\n12. 在 `ProductSubcategoryKey` 旁边，使用相关函数创建一个 `ProductCategory`（产品类别）列：\n\
  \n    ```\n    =RELATED('ProductCategory'[ProductCategoryName])\n    ```\n\n13.\
  \ 使用相关函数，创建一个 `ProductSubcategory`（产品子类别）列。\n14. 从客户端工具中隐藏 `ProductCategory` 和 `ProductSubcategory`\
  \ 表。\n15. 切换到 `Store` 表并创建一个 `Years Open`（开店年数）列，使用以下公式：\n\n    ```\n    =TRUNC(YEARFRAC([OpenDate],\n\
  \           If(ISBLANK([CloseDate]),TODAY(),[CloseDate]))\n              ,0)\n \
  \   ```\n\n16. 使用以下公式创建一个 `LifetimeSales`（总销售额）列：\n\n    ```\n    =SUMX(RELATEDTABLE(Sales),Sales[SalesAmount])\n\
  \    ```\n\n17. 保存并关闭 Excel 文件。\n\n#### 总结\n\n本章向你介绍了 DAX 语言以及可用于创建计算的内置函数。至此，你应该能够熟练地创建计算列并使用\
  \ DAX 函数。我强烈建议你熟悉各种可用的函数以及如何在分析中使用它们。在下一章中，你将继续使用 DAX 来创建度量值。度量值是在 Power Pivot 中构建模型最重要的部分之一；度量值是你查看数据的根本原因。你想要回答诸如销售情况如何或什么因素影响能源消耗等问题。除了创建度量值，你还将看到筛选上下文如何影响度量值。为了充分利用\
  \ Power Pivot，筛选上下文是你需要掌握的最重要的概念之一。\n\n### 第 5 章\n\n![image](img/frontdot.jpg)\n\
  \n#### 使用 DAX 创建度量值\n\n使用 DAX 创建度量值是构建可靠数据模型所必需的最重要的技能。本章涵盖了在数据模型中创建度量值时使用的常见函数。它还涵盖了数据上下文这一重要主题，以及如何在创建度量值时更改或覆盖上下文。\n\
  \n完成本章后，你将能够：\n\n-   理解度量值与属性之间的区别。\n-   理解上下文如何影响度量。\n-   创建常见的聚合。\n-   知道如何以及何时更改筛选上下文。\n\
  -   创建 KPI。\n\n#### 度量值与属性\n\n如果你查看数据仓库的典型星型模型，你会看到一个事实表被若干个维度表包围。例如，图 5-1 显示了一个被若干个维度表包围的财务事实表。\n\
  \n![9781430264453_Fig05-01.jpg](img/9781430264453_Fig05-01.jpg)\n\n图 5-1。典型的星型模式\n\
  \n请记住，事实表包含你需要聚合的数字；例如，在财务表中，你有金额，这是一个需要被聚合的货币值。在销售事实表中，你可能有销售金额和商品数量。在人力资源系统中，你可能会有工作小时数。维度表包含你用来分类和汇总度量值的属性。例如，财务度量值被分类为利润、亏损和预测。你希望将这些值汇总到部门和组织级别，并且希望在月份和年份之间比较这些值。\n\
  \n\n\n当你在数据透视表中开始对数据进行切片和切块时，属性会变成行和列的标题，而度量值则是单元格中的数值。属性也常被用作筛选器，无论是在筛选下拉菜单中还是在切片器中。图\
  \ 5-2 展示了一个数据透视表，其中包含了 2006 财年各月的实际和预算研发支出。\n\n![9781430264453_Fig05-02.jpg](img/9781430264453_Fig05-02.jpg)\n\
  \n图 5-2. 在数据透视表中分析数据\n\n如果你查看每个单元格的筛选条件，就会意识到它们的筛选方式略有不同。绿色箭头指示的两个度量值按月不同，而红色箭头指示的度量值则按实际金额与预算金额有所不同。当你更改财年、部门或组织时，这些度量值的值必须重新计算，因为查询上下文已经发生了变化。\n\
  \n在下一节中，你将看到如何在 Power Pivot 模型中创建一些常见的聚合度量值。\n\n#### 创建常见聚合\n\n在 Power Pivot 中创建诸如求和、计数或平均值之类的常见聚合非常容易。首先，你需要确定要将度量值关联到哪个表。如果你遵循星型架构模型，这很可能是一个事实表，但也不一定非要如此。在\
  \ Power Pivot 模型设计器的数据视图模式下，选择与度量值关联的表的选项卡。数据网格下方的区域是放置度量值公式的地方（参见图 5-3）。如果看不到度量值网格，你可能需要通过在“主页”选项卡上选择“计算区域”按钮来取消隐藏它（参见图\
  \ 5-4）。\n\n![9781430264453_Fig05-03.jpg](img/9781430264453_Fig05-03.jpg)\n\n图 5-3.\
  \ “财务”表的度量值网格\n\n![9781430264453_Fig05-04.jpg](img/9781430264453_Fig05-04.jpg)\n\
  \n图 5-4. 显示或隐藏度量值网格\n\n创建聚合最简单的方法是选择要聚合的列，然后选择“自动求和”下拉菜单并选择你需要的聚合（参见图 5-5）。\n\n\
  ![9781430264453_Fig05-05.jpg](img/9781430264453_Fig05-05.jpg)\n\n图 5-5. 使用自动求和来创建常见聚合\n\
  \n该聚合会被放置在列下方的度量值网格中（参见图 5-6）。如果你选择该单元格，就会在公式栏中看到公式（参见图 5-7）。度量值的名称放在公式前面，后跟冒号和等号（`:=`）。添加度量值后，你可以通过在公式编辑器中编辑来重命名它。\n\
  \n![9781430264453_Fig05-06.jpg](img/9781430264453_Fig05-06.jpg)\n\n图 5-6. 列下方生成的度量值\n\
  \n![9781430264453_Fig05-07.jpg](img/9781430264453_Fig05-07.jpg)\n\n图 5-7. 编辑度量值公式\n\
  \n创建聚合度量值的另一种方法是选择度量值网格中的任意单元格，然后在公式栏中输入公式。尽管你可以在度量值网格的任何单元格中定义度量值，但最好以某种方式组织它们。我通常尝试将度量值沿网格左侧排列，这样它们就不会分散在整个网格中（参见图\
  \ 5-8）。你可以使用剪切和粘贴轻松地将一个定义从一个单元格移动到另一个单元格。\n\n![9781430264453_Fig05-08.jpg](img/9781430264453_Fig05-08.jpg)\n\
  \n图 5-8. 组织你的度量值\n\n你可能已经注意到，聚合函数如 `SUM`、`AVE`、`MIN` 和 `MAX` 有对应的 `SUMX`、`AVEX`、`MINX`\
  \ 和 `MAXX` 函数。X 函数用于计算表中每一行的表达式，而不仅仅是单列。例如，`SUMX` 函数的定义如下：\n\n```\nSUMX(<table>,\
  \ <expression>)\n```\n\n其中，table 是包含待计算行的表，expression 是每一行将要计算的表达式。\n\n举个例子，假设你有一个销售表，包含成本（Cost）和总额（Gross）列。要计算净销售总额，你可以用总额减去成本，然后对每一行的结果求和，如下列公式所示：\n\
  \n```\nSumNet:=SUMX(Sales,[Gross]-[Cost])\n```\n\n获得相同结果的另一种方法是先创建一个净额计算列，然后对净额列使用\
  \ `SUM` 函数。区别在于，计算列是预先计算并存储在模型中的。而度量值是在数据透视表中对其应用筛选时计算的，并且每次数据上下文发生变化时都必须重新计算。因此，计算列越多，Power\
  \ Pivot 文件的大小就越大。度量值越多，复杂度越高，在处理文件时所需的内存就越多。\n\n理解数据上下文如何改变度量值，在创建度量值时非常重要，下一节将对此进行探讨。\n\
  \n#### 掌握数据上下文\n\n在 Power Pivot 模型中创建度量值时，上下文起着重要作用。与静态报表不同，Power Pivot 模型是为客户端进行动态分析而设计的。当用户更改筛选条件、向下钻取以及在数据透视表中更改列和行标题时，上下文会发生变化，值也会重新计算。了解上下文如何变化以及它如何影响结果，对于能够构建和排查公式问题至关重要。\n\
  \n你需要考虑三种类型的上下文：行上下文、查询上下文和筛选上下文。当创建计算列时，行上下文就会发挥作用。它包含当前行所有其他列的值，以及与该行相关的任何表的值。如果你创建一个计算列，比如利润（margin）：\n\
  \n```\n=[Gross] - [Cost]\n```\n\nDAX 使用行上下文从同一行查找值以完成计算。如果你创建一个计算列，比如生命周期销售额（lifetime\
  \ sales）：\n\n```\n=SUMX(RELATEDTABLE(Sales),[SalesAmount])\n```\n\nDAX 会自动使用当前行的行上下文查找相关值。行上下文在模型加载后即被设定，并且在加载新数据之前不会改变。这就是为什么计算列是预先计算的，并且仅在数据刷新时才需要重新计算。\n\
  \n查询上下文是应用于数据透视表中某个单元格的筛选条件。当你将一个度量值放入数据透视表时，DAX 查询引擎会检查行和列标题以及应用的任何筛选条件。每个单元格都有不同的查询上下文应用于它（参见图\
  \ 5-9），并返回与该上下文关联的值。由于你可以通过更改行/列标题和筛选值来动态更改查询上下文，因此单元格值是动态计算的，并且这些值不会保存在 Power Pivot\
  \ 模型中。\n\n![9781430264453_Fig05-09.jpg](img/9781430264453_Fig05-09.jpg)\n\n图 5-9.\
  \ 度量值的查询上下文\n\n筛选上下文是使用筛选约束作为公式的一部分添加到度量值中的。筛选上下文是在行上下文和查询上下文之外额外应用的。你可以通过使用筛选表达式来添加、替换或选择性地更改上下文。例如，如果你使用以下公式计算销售额：\n\
  \n```\nAllStoreSales:=CALCULATE(SUM(Sales[SalesAmount]),ALL(Store[StoreType]))\n\
  ```\n\n筛选上下文将清除查询上下文所实现的任何 `StoreType` 筛选。\n\n\n好的，作为一名高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n在下一节中，您将了解到为什么知道何时以及如何更改查询上下文是创建度量值的一个重要方面。\n\n#### 更改查询上下文\n\n在创建计算时，您通常需要更改应用于度量值的筛选上下文，例如，如果您想计算某个产品类别的销售额与所有产品的销售额之比（请参见图\
  \ 5-10）。\n\n![9781430264453_Fig05-10.jpg](img/9781430264453_Fig05-10.jpg)\n\n图 5-10.\
  \ 查看产品销售比率\n\n要计算销售比率，您需要将由查询上下文（在本例中为类别）筛选得出的销售额，除以所有产品的销售额（不考虑产品查询上下文）。要计算销售额，您只需使用\
  \ `SUM` 函数。要计算所有产品销售额的总和，您需要重写应用于该单元格的任何产品筛选。为此，您需要使用 `CALCULATE` 函数，该函数在由指定筛选器修改的上下文中计算表达式，其语法如下：\n\
  \n```\nCALCULATE(<expression>,<filter1>,<filter2>...)\n```\n\n其中，`expression` 本质上是要计算的度量值，`filters`\
  \ 是定义筛选器的布尔表达式或表表达式。\n\n因此，要重写任何产品筛选器，您可以使用以下代码：\n\n```\nAllProductSales:=CALCULATE(SUM([SalesAmount]),\
  \ ALL(Product))\n```\n\n这里使用了 `ALL` 函数，该函数返回表中的所有行或列中的所有值，忽略可能已应用的任何筛选器。因此，在本例中，它清除了应用于\
  \ `Product` 表的所有筛选器。图 5-11 显示了数据透视表中的这些度量值。\n\n![9781430264453_Fig05-11.jpg](img/9781430264453_Fig05-11.jpg)\n\
  \n图 5-11. 验证 `AllProductSales` 度量值\n\n请注意，`ProductSales` 度量值受产品筛选器（类别）的影响，而 `AllProductSales`\
  \ 则不受影响。计算 `ProductSalesRatio` 度量值的最后一步是将 `ProductSales` 除以 `AllProductSales`。只要没有循环引用，您就可以在一个度量值内部使用另一个度量值。因此，`ProductSalesRatio`\
  \ 的计算公式如下：\n\n```\nProductSalesRatio:=[ProductSales]/[AllProductSales]\n```\n\n\
  您可以从客户端工具中隐藏 `AllProductSales` 度量值，因为在本例中，它被用作中间度量值，本身并无用处。\n\n在本节中，您了解了如何使用 `CALCULATE`\
  \ 函数和筛选函数来更改应用于度量值的筛选器。DAX 中有许多可用的筛选函数，了解何时使用它们非常重要。在下一节中，您将了解几个更重要的可用的筛选函数。\n\n\
  #### 使用筛选函数\n\nDAX 中的筛选函数允许您创建复杂的计算，这些计算需要您查询和操作数据透视表中行或单元格的数据上下文。表 5-1 列出并描述了 DAX\
  \ 中可用的一些筛选函数。\n\n表 5-1. 一些 DAX 筛选函数\n\n| 函数 | 说明 |\n| --- | --- |\n| `ALL` | 返回表中的所有行，或列中的所有值，忽略可能已应用的任何筛选器。\
  \ |\n| `ALLEXCEPT` | 移除表中的所有上下文筛选器，但已应用于指定列的筛选器除外。 |\n| `ALLNONBLANKROW` | 返回所有行（空白行除外），并忽略可能存在的任何上下文筛选器。\
  \ |\n| `ALLSELECTED` | 移除列和行中的上下文筛选器，同时保留所有其他上下文筛选器或显式筛选器。 |\n| `CALCULATE` | 在由指定筛选器修改的上下文中计算一个表达式。\
  \ |\n| `CALCULATETABLE` | 在由给定筛选器修改的上下文中计算一个表表达式。 |\n| `DISTINCT` | 返回一个包含指定列中非重复值的单列表。\
  \ |\n| `FILTER` | 返回表示另一个表或表达式的子集的表。 |\n| `FILTERS` | 返回直接作为筛选器应用的值。 |\n| `HASONEVALUE`\
  \ | 当上下文已被筛选为仅剩一个非重复值时返回 TRUE。 |\n| `ISFILTERED` | 当正在应用直接筛选器时返回 TRUE。 |\n| `ISCROSSFILTERED`\
  \ | 当正在对列或同一表或相关表中的另一列进行筛选时返回 TRUE。 |\n| `KEEPFILTERS` | 修改在计算 `CALCULATE` 或 `CALCULATETABLE`\
  \ 函数时应用筛选器的方式。保留已应用的筛选器并添加额外的筛选器。 |\n| `RELATED` | 从另一个表中返回一个相关值。 |\n| `USERELATIONSHIP`\
  \ | 指定要在特定计算中使用的关系统计。 |\n| `VALUES` | 返回一个包含指定列中非重复值的单列表。 |\n\n您已经了解了如何结合使用 `CALCULATE`\
  \ 函数和 `ALL` 函数来计算总产品销售额，忽略任何已应用的产品筛选。让我们再看几个示例。\n\n图 5-12 显示了一个用于经销商销售的 Power Pivot\
  \ 模型。在该模型中，`Employee` 表和 `SalesTerritory` 表之间存在一个非活动关系。您可以使用此关系来计算每个国家的销售人员数量。\n\
  \n![9781430264453_Fig05-12.jpg](img/9781430264453_Fig05-12.jpg)\n\n图 5-12. Power\
  \ Pivot 模型中的非活动关系\n\n您可以使用以下代码来计算每个国家的销售代表数量：\n\n```\nSales Rep Cnt:=CALCULATE(DISTINCTCOUNT(Employee[EmployeeNationalIDAlternateKey]),\n\
  USERELATIONSHIP(Employee[SalesTerritoryKey],SalesTerritory[SalesTerritoryKey]))\n\
  ```\n\n在这种情况下，您需要使用 `CALCULATE` 函数，以便应用 `USERELATIONSHIP` 筛选函数来告知 DAX 查询引擎使用哪个关系统计。图\
  \ 5-13 显示了生成的数据透视表。它还显示了如果您只使用 `DISTINCTCOUNT` 函数而不使用 `USERELATIONSHIP` 筛选器时会得到的结果。\n\
  \n![9781430264453_Fig05-13.jpg](img/9781430264453_Fig05-13.jpg)\n\n图 5-13. 每个国家的销售代表计数\n\
  \n在下一个示例中，您将看到 `ALL` 和 `ALLSELECTED` 筛选函数之间的区别。您可以按如下方式创建三个销售额度量值：\n\n```\nReseller\
  \ Sales:=SUM([SalesAmount])\nReseller Grand Total:=calculate(sum([SalesAmount]),\
  \ ALL('ResellerSales'))\nReseller Visual Total:=calculate(sum([SalesAmount]), ALLSELECTED())\n\
  ```\n\n`Reseller Sales` 保留应用于度量值的所有数据上下文。`Reseller Grand Total` 移除与 `ResellerSales`\
  \ 表及其任何相关表关联的所有上下文。`Reseller Visual Total` 移除度量值的列和行上下文。图 5-14 显示了数据透视表中的结果度量值。\n\
  \n![9781430264453_Fig05-14.jpg](img/9781430264453_Fig05-14.jpg)\n\n图 5-14. 使用不同筛选器的结果\n\
  \n\n\n现在来看一个更复杂的例子。在这个示例中，你需要确定特定时间段内单笔订单金额最高的客户。最终的数据透视表如图 5-15 所示。\n\n![9781430264453_Fig05-15.jpg](img/9781430264453_Fig05-15.jpg)\n\
  \n图 5-15. 查找单笔订单金额最高的客户\n\n第一步是找出在该时间段内消费总额较高的客户。为了计算客户销售额，你可以使用以下度量值：\n\n```\n\
  SumSales:=SUM([SalesAmount])\n```\n\n接下来，你只想关注高消费客户，因此可以过滤掉较小数值：\n\n```\nLargeSales:=IF([SumSales]>=30000,[SumSales],Blank())\n\
  ```\n\n下一步是找出该客户的各订单金额，并取最大值：\n\n```\nTop Sale:=MAXX(VALUES(Date[DateKey]),[SumSales])\n\
  ```\n\n由于你只想列出顶级客户的顶级销售额，可以添加一个`IF`语句来确保该客户属于高消费群体：\n\n```\nTop Sale:=\nIF(ISBLANK([LargeSales]),Blank(),MAXX(VALUES(Date[DateKey]),[SumSales]))\n\
  ```\n\n作为最后一个例子，假设你正在与人力资源部门合作，希望创建一个数据透视表，使其能够列出特定日期各部门的员工人数。有一个`EmployeeDepartmentHistory`表记录了员工、部门、开始日期和结束日期。还有一个`Dates`表，该表中的每一行对应了部门历史记录中的每一个日期。图\
  \ 5-16 显示了包含每个部门员工人数的数据透视表。\n\n![9781430264453_Fig05-16.jpg](img/9781430264453_Fig05-16.jpg)\n\
  \n图 5-16. 截至选定日期的员工人数\n\n`As of Date`（截止日期）被用作筛选器，`Emp Cnt`（员工计数）是度量值。当更改`As of\
  \ Date`时，`Emp Cnt`会重新计算以显示该日期下的员工人数。图 5-17 显示了更改日期后的新计数。\n\n![9781430264453_Fig05-17.jpg](img/9781430264453_Fig05-17.jpg)\n\
  \n图 5-17. 更改截止日期\n\n创建`Emp Cnt`的第一步是使用`COUNT`函数，因为你要对表中的`EmployeeID`进行计数：\n\n```\n\
  Emp Cnt:=COUNT(EmpDepHist[BusinessEntityID])\n```\n\n由于你需要将表格筛选为仅包含在选定日期仍在职的员工，因此需要将其改为`COUNTX`函数：\n\
  \n```\nEmp Cnt:=COUNTX(EmpDepHist, EmpDepHist[BusinessEntityID])\n```\n\n要筛选`EmpDepHist`表，可以使用`FILTER`函数：\n\
  \n```\nFILTER(<table>,<filter>)\n```\n\n`FILTER`函数是一个计算结果为 TRUE 的布尔表达式。在这种情况下，你需要确保员工在部门的开始日期小于或等于`As\
  \ of Date`（截止日期）：\n\n```\nEmpDepHist[StartDate]<=Dates[As of Date]\n```\n\n现在，由于数据透视表用户可以选择多个日期，而你希望确保只与单个日期进行比较，因此可以使用`MAX`函数：\n\
  \n```\nEmpDepHist[StartDate]<=MAX(Dates[As of Date])\n```\n\n你还需要确保员工离开部门的日期大于`As\
  \ of Date`（截止日期）：\n\n```\nEmpDepHist[EndDate] > Max(Dates[As of Date])\n```\n\n\
  如果员工当前仍在部门中，则`EndDate`将为空：\n\n```\nISBLANK(EmpDepHist[EndDate])\n```\n\n当组合这些筛选条件时，会得到以下筛选条件：\n\
  \n```\nEmpDepHist[StartDate]<=MAX(Dates[As of Date])\n&& (ISBLANK(EmpDepHist[EndDate])\
  \ || EmpDepHist[EndDate] > Max(Dates[As of Date]))\n```\n\n最终的`FILTER`函数变为：\n\n\
  ```\nFILTER(EmpDepHist,\nEmpDepHist[StartDate]<=MAX(Dates[As of Date])\n&& (ISBLANK(EmpDepHist[EndDate])\
  \ || EmpDepHist[EndDate] > Max(Dates[As of Date])))\n```\n\n而最终的员工计数度量值变为：\n\n```\n\
  Emp Cnt:=COUNTX(FILTER(EmpDepHist,\nEmpDepHist[StartDate]<=MAX(Dates[As of Date])\n\
  && (ISBLANK(EmpDepHist[EndDate]) || EmpDepHist[EndDate] > Max(Dates[As of Date]))),\n\
  EmpDepHist[BusinessEntityID])\n```\n\n正如你所见，创建度量值可能相当复杂，但如果你将其分解为多个步骤，就会变得非常易于管理。请放心；你使用\
  \ DAX 和创建度量值的经验越多，它就会变得越直观、越容易。\n\n在绩效仪表板中常用的一种度量值是*关键绩效指标（KPI）*。KPI 用于以可视化格式显示绩效和趋势。在下一节中，你将研究如何在\
  \ Power Pivot 模型中创建 KPI。\n\n#### 创建 KPI\n\nKPI 是许多仪表板的基本组成部分，并提供了一种快速查看趋势和发现需要进一步分析领域的绝佳方式。KPI\
  \ 的基础值基于某个度量值；例如，你可以为当前销售额创建一个 KPI。然后，将基础值与目标值进行比较。目标值可以是另一个度量值，例如去年的销售额，或者一个绝对值，比如目标销售费用比率。状态阈值界定了哪些范围被视为良好、一般和较差。这些阈值随后用于确定\
  \ KPI 的视觉组件（例如，绿色、黄色、红色）。图 5-18 显示了当前销售额与前期销售额进行比较的 KPI。\n\n![9781430264453_Fig05-18.jpg](img/9781430264453_Fig05-18.jpg)\n\
  \n图 5-18. 比较当前销售额与前期销售额的销售 KPI\n\n要创建一个 KPI，首先创建它所基于的基础度量值。例如，生产部门会跟踪报废部件数量，因此你可以基于报废部件数量的总和来创建一个\
  \ KPI：\n\n```\nSumScrappedQty:=SUM([ScrappedQty])\n```\n\n你可以将其与已处理的部件数量进行比较：\n\n\
  ```\nSumOrderQuantity:=SUM([OrderQty])\n```\n\n创建这些度量值后，在 Power Pivot 模型设计器中右键单击基础度量值。在上下文菜单中，选择“创建\
  \ KPI”，这将启动 KPI 设计窗口（参见图 5-19）。\n\n![9781430264453_Fig05-19.jpg](img/9781430264453_Fig05-19.jpg)\n\
  \n图 5-19. KPI 设计窗口\n\n然后，你将目标设置为`SumOrderQuantity`度量值，并定义状态阈值。样式图标用于显示 KPI 的状态。创建完\
  \ KPI 后，你可以在 Excel 的数据透视表中使用它（参见图 5-20）。\n\n![9781430264453_Fig05-20.jpg](img/9781430264453_Fig05-20.jpg)\n\
  \n图 5-20. 在数据透视表中查看 KPI\n\n现在你已经了解了如何使用 DAX 创建度量值和更改数据上下文，是时候亲自动手，在下面的练习中创建一些度量值了。\n\
  \n#### 动手实验——在 Power Pivot 中创建度量值\n\n在以下实验中，你将\n\n*   创建聚合度量值。\n*   在度量值中更改数据上下文。\n\
  *   在度量值中使用非活动关系。\n*   创建一个复杂度量值。\n*   创建一个 KPI。\n\n1.  在`Lab Starters`（练习入门）文件夹中，打开`LabChapter5.xlsx`文件。该文件包含一个由销售数据、产品数据和商店数据组成的数据模型。\n\
  2.  使用关系图视图在 Power Pivot 窗口中查看模型（图 5-21）。\n\n![9781430264453_Fig05-21.jpg](img/9781430264453_Fig05-21.jpg)\n\
  \n图 5-21. Power Pivot 模型\n\n3.  切换到 Power Pivot 窗口中的数据视图，并选择`Sales`（销售）表。\n4.  选择`SalesAmount`（销售金额）列。在`AutoSum`（自动求和）下拉菜单中选择“求和”（参见图\
  \ 5-22）。你应该会看到在该列下方添加了一个度量值。将该度量值重命名为`Sum Sales`（总销售额）。\n\n![9781430264453_Fig05-22.jpg](img/9781430264453_Fig05-22.jpg)\n\
  \n图 5-22. 选择自动求和下拉菜单\n\n\n\n5.  使用与步骤 4 相同的技巧，创建`Max Sales Quantity`、`Min Sales\
  \ Quantity`和`Ave Sales Quantity`度量值。\n6.  要测试度量值在筛选上下文变化时如何重新计算，请单击`Home`选项卡中的数据透视表，并将其插入到`Sheet1`的`B2`单元格中（请参见图\
  \ 5-23）。\n\n![9781430264453_Fig05-23.jpg](img/9781430264453_Fig05-23.jpg)\n\n图 5-23。创建数据透视表\n\
  \n7.  如果看不到字段列表，请单击数据透视表以显示它。\n8.  在`Sales`节点下勾选`Sales`和`Max Sales Quantity`。这会将度量值添加到`值`下拉区域。在`Product`节点下勾选`ProductCategory`属性。这会将属性添加到`行标签`下拉区域。\n\
  9.  在`Insert`选项卡上单击`切片器`按钮。在`插入切片器`窗口中，选择`全部`选项卡，并在`Geography`节点下选择`ContinentName`（请参见图\
  \ 5-24）。\n\n![9781430264453_Fig05-24.jpg](img/9781430264453_Fig05-24.jpg)\n\n图 5-24。创建切片器\n\
  \n10. 数据透视表应类似于图 5-25 所示。单击不同的大洲来测试度量值。这会更改查询上下文。请注意度量值在查询上下文变化时如何重新计算。\n\n![9781430264453_Fig05-25.jpg](img/9781430264453_Fig05-25.jpg)\n\
  \n图 5-25。测试查询上下文\n\n11. 现在，假设我们需要一个销售比率，用于比较当前销售额与所有产品的总销售额。在数据视图模式下打开 Power Pivot\
  \ 窗口。选择`Sales`表。向`Sales`表添加以下度量值：\n\n```\nAll Product Sales:=CALCULATE([Sum Sales],ALL('Product'))\n\
  ```\n\n12. `All Product Sales`度量值使用`CALCULATE`函数来覆盖应用到查询上下文中的任何产品筛选器。将度量值格式设置为货币。\n\
  13. 切换回数据透视表。用`Sum Sales`和`All Product Sales`度量值替换`Max Sales Quantity`度量值。\n14.\
  \ 单击不同的大洲测试数据透视表，并注意`All Product Sales`度量值等于每个大洲的总产品销售额（请参见图 5-26）。\n\n![9781430264453_Fig05-26.jpg](img/9781430264453_Fig05-26.jpg)\n\
  \n图 5-26。测试度量值\n\n15. 切换回 Power Pivot 窗口，并向`Sales`表添加以下度量值。将度量值格式设置为百分比。\n\n```\n\
  Product Sales Ratio:=[Sum Sales]/[All Product Sales]\n```\n\n16. 在关系图视图模式下打开 Power\
  \ Pivot 窗口。要创建`Date`表和`Store`表之间的关系，请将`Store`表中的`OpenDate`字段拖放到`Date`表中的`DateKey`上（请参见图\
  \ 5-27）。请注意，这不是`Store`和`Date`表之间的活动关系，如虚线所示。这是因为活动关系从`Store`表经过`Sales`表，再到`Date`表。\n\
  \n![9781430264453_Fig05-27.jpg](img/9781430264453_Fig05-27.jpg)\n\n图 5-27。创建非活动关系\n\
  \n17. 切换到数据视图模式，并向`Store`表添加以下度量值。由于使用的是非活动关系，因此需要使用`USERELATIONSHIP`函数。\n\n```\n\
  Store Count:=CALCULATE(DISTINCTCOUNT([StoreKey]),\nUSERELATIONSHIP(Store[OpenDate],'Date'[Datekey]))\n\
  ```\n\n18. 要测试店铺计数度量值，请在`Sheet2`上创建一个数据透视表。使用`ContinentName`作为列标签，使用`CalendarMonth`作为行标签。使用`CalendarYear`插入一个切片器。数据透视表应类似于图\
  \ 5-28。\n\n![9781430264453_Fig05-28.jpg](img/9781430264453_Fig05-28.jpg)\n\n图 5-28。测试店铺计数度量值\n\
  \n\n\n19.  数据透视表表示一个月内开业的商店数量。点击不同年份并观察数据的变化。\n\n20.  要找出某个产品类别的最佳销售日，请创建一个`Sale\
  \ Quantity`度量。\n\n```\nSale Quantity:=SUM([SalesQuantity])\n```\n\n21.  使用`Sale\
  \ Quantity`度量创建一个`Top Sale Day Quantity`度量。`MAXX`函数用于打破任何平局，并返回最近的`DateKey`。\n\n\
  ```\nTop Sale Day Quantity:=MAXX(values('Date'[Datekey]),[Sale Quantity])\n```\n\
  \n22.  要找出最佳销售日的日期，首先创建一个筛选函数，该函数返回`Sale Quantity`等于该期间内`Top Sale Day Quantity`的日期。\n\
  \n```\nFilter(VALUES('Date'[Datekey]),\n[Sale Quantity]=CALCULATE([Top Sale Day\
  \ Quantity],\nVALUES('Date'[Datekey])))\n```\n\n23.  然后将此筛选器插入到`CALCULATE`函数中，该函数返回最近的日期。\n\
  \n```\nTop Sale Day:=CALCULATE(MAX('Date'[Datekey]),\nFilter(VALUES('Date'[Datekey]),[Sale\
  \ Quantity]=\nCALCULATE([Top Sale Day Quantity],VALUES('Date'[Datekey]))))\n```\n\
  \n24.  创建一个类似于 5-29 的数据透视表来测试你的度量。\n\n![9781430264453_Fig05-29.jpg](img/9781430264453_Fig05-29.jpg)\n\
  \n图 5-29. 测试`Top Sale Day`度量\n\n25.  在`Sales`表中创建以下度量，并将其格式设置为货币格式：\n\n```\nAve\
  \ Sales:=AVERAGE([SalesAmount])\nTotal Ave Sales:=If(ISBLANK([Ave Sales]),BLANK(),\n\
  \                                CALCULATE([Ave Sales],ALLSELECTED()))\n```\n\n\
  26.  在度量网格中选择`Ave Sales`度量。右键单击它，然后在上下文菜单中选择`Create KPI`。在 KPI 对话框中，注意基础度量是`Ave\
  \ Sales`。将目标值设置为`Total Ave Sales`。将低阈值设置为 90%，高阈值设置为 110%（参见图 5-30）。\n\n![9781430264453_Fig05-30.jpg](img/9781430264453_Fig05-30.jpg)\n\
  \n图 5-30. 创建平均销售额 KPI\n\n27.  关闭对话框，注意`Ave Sales`度量有一个图标，表示它关联了一个 KPI。\n\n28.  创建一个类似于\
  \ 5-31 的数据透视表来测试 KPI。你可以将某个商店的平均销售额与显示的所有商店的总平均销售额进行比较。\n\n![9781430264453_Fig05-31.jpg](img/9781430264453_Fig05-31.jpg)\n\
  \n图 5-31. 查看 KPI\n\n#### 总结\n\n这是一个内容冗长且详尽的章节。你现在应该已经掌握了如何在 Power Pivot 模型中创建度量。你还应该理解数据上下文以及它如何影响度量。当你开始开发更复杂的度量时，这可能会是一个非常令人困惑的概念。别担心；你用得越多，它就会变得越清晰。\n\
  \n下一章将扩展本章的概念。最常见的数据分析类型之一是随时间比较值。第 6 章将向你展示如何在 Power Pivot 中正确实现基于时间的分析。它包括设置日期表，以及使用各种内置函数来分析（截至到）当前日期的值、比较不同时期的值以及执行半加法聚合。\n\
  \n### 第 6 章\n\n![image](img/frontdot.jpg)\n\n#### 融入时间智能\n\n最常见的数据分析类型之一是随时间比较值。本章将向读者展示如何在\
  \ Power Pivot 中正确实现基于时间的分析。它包括设置日期表，以及使用各种内置函数来分析（截至到）当前日期的值、比较不同时期的值以及执行半加法聚合。\n\
  \n完成本章后，你将能够：\n\n*   创建一个日期表。\n*   使用 DAX 进行基于时间段的评估。\n*   使用筛选函数切换日期上下文。\n*   创建半加法度量。\n\
  \n#### 基于日期的分析\n\n很大一部分数据分析都涉及某种基于日期时间的聚合和比较。例如，你可能需要查看本月至今（MTD）或本年至今（YTD）的使用量或销售额，如图\
  \ 6-1 所示。\n\n![9781430264453_Fig06-01.jpg](img/9781430264453_Fig06-01.jpg)\n\n图\
  \ 6-1. 计算年初至今和月初至今的销售额\n\n另一个常见示例是比较一个时间段与下一个时间段的绩效。例如，你可能想将上个月的销售额与当前销售额进行比较（参见图\
  \ 6-2），或者将当前月份的销售额与一年前同月份的销售额进行比较。\n\n![9781430264453_Fig06-02.jpg](img/9781430264453_Fig06-02.jpg)\n\
  \n图 6-2. 计算销售增长\n\n除了这些常见的数据分析之外，有时你还需要基于非加和性度量进行聚合，例如账户余额或库存。在这些情况下，你需要确定最后输入的值，并使用该值跨不同时间段进行聚合（参见图\
  \ 6-3）。\n\n![9781430264453_Fig06-03.jpg](img/9781430264453_Fig06-03.jpg)\n\n图 6-3.\
  \ 聚合库存数量\n\nDAX 包含许多函数，可以帮助你创建可能需要的各种基于日期时间的分析。在下一节中，你将看到如何创建一个日期表，这是使用许多基于日期时间的函数所必需的。\n\
  \n#### 创建日期表\n\n为了使用 DAX 中内置的时间智能函数，你需要在模型中有一个日期表供这些函数引用。该表的唯一要求是，它需要为你感兴趣查看的日期范围内的每一天都有一个独特的行。这些行中的每一行都需要包含该日的完整日期。日期表可以（而且通常确实）包含更多列，但并非必须如此。\n\
  \n有几种方法可以创建日期表。如果你正在从数据仓库检索数据，则可以将日期维度导入模型并使用它。如果你无法访问日期表，可以在 Excel 工作表中创建一个并将其导入模型。如果你有权访问数据库，还可以编写\
  \ SQL 查询来创建一个临时表，并使用该临时表将日期加载到模型中。以下代码显示了你可以在 Microsoft SQL Server 数据库上使用的 SQL 查询。它使用一个公用表表达式来填充日期表。\n\
  \n```\nDECLARE\n  @BeginDate DATE,\n  @EndDate DATE\n\nSET @BeginDate = '01/01/2010'\n\
  SET @EndDate = '12/31/2014'\n;\n\nWITH cteDate AS (\n  SELECT @BeginDate AS CalendarDate\n\
  \  UNION ALL\n  SELECT DATEADD(DAY,1,CalendarDate)\n    FROM cteDate\n    WHERE\
  \ CalendarDate < @EndDate)\n\nSELECT\n  (DATEPART(YEAR,CalendarDate) * 10000) +\
  \ (DATEPART(MONTH,CalendarDate) * 100)  +\n    DATEPART(DAY,CalendarDate) AS DateKey,\n\
  \  CalendarDate,\n  DATEPART(YEAR,CalendarDate) AS Year,\n  DATEPART(MONTH,CalendarDate)\
  \ AS MonthNumber,\n  DATENAME(MONTH,CalendarDate) AS Month\n  FROM cteDate\n  OPTION\
  \ (MAXRECURSION 0)\n```\n\n将表放入模型后，你需要将其标记为官方日期表（参见图 6-4），并指明哪一列是唯一键（参见图 6-5）。这告诉\
  \ DAX 查询引擎使用此表作为参考来构造计算所需的一组日期。例如，如果你想查看年初至今的销售额，查询引擎会使用此表来获取它需要的日期集。\n\n![9781430264453_Fig06-04.jpg](img/9781430264453_Fig06-04.jpg)\n\
  \n图 6-4. 标识日期表\n\n![9781430264453_Fig06-05.jpg](img/9781430264453_Fig06-05.jpg)\n\
  \n图 6-5. 设置日期键\n\n\n\n`DAX` 中目前有 35 个内置的时间智能函数。其中一些函数，如 `FIRSTNONBLANK`，会返回单个日期。另一些函数，如\
  \ `PREVIOUSMONTH`，会返回一组日期。此外，还有其他函数，如 `TOTALQTD`，会计算一段时间内的表达式值。目前，`DAX` 内置的时间智能函数支持以\
  \ 12 月 31 日结束的传统日历。它们还支持具有不同年末日期且包含四个季度、每季度三个月的会计日历。如果你需要使用自定义财务日历，则需要自行创建自定义计算。\n\
  \n现在，你已了解如何在模型中创建和指定日期表，接下来可以看看如何实现一些常用的时间智能函数来分析数据。\n\n#### 基于时间段的计算\n\n数据分析中常用的一种分析方法是查看截止到当前日期的值。例如，你可能希望查看年初至今的销售额，或月初至今的能耗。`DAX`\
  \ 提供了 `TOTALMTD`、`TOTALQTD` 和 `TOTALYTD` 函数，这使得此类计算非常容易。例如，年初至今总额的定义如下：\n\n```\n\
  TOTALYTD(<expression>,<dates>[,<filter>][,<year_end_date>])\n```\n\n其中，`表达式`是一个返回标量值的表达式。`日期`是日期表的关键列。`筛选器`是可选筛选表达式，`年末日期`也是可选的——你可以用它来指示会计年度的年末。以下表达式用于计算销售总额和年初至今销售额。\n\
  \n```\nSum of Sales:=SUM(Sales[SalesAmount])\nYTD Sales:=TOTALYTD([Sum of Sales],'Date'[Datekey])\n\
  ```\n\n如果你想计算所有产品的年初至今销售额，请使用以下表达式：\n\n```\nYTD Sales ALL Products:=TOTALYTD([Sum\
  \ of Sales],'Date'[Datekey],ALL('Product'))\n```\n\n图 6-6 在数据透视表中展示了这些度量值。你可以使用这些基础度量值来计算进一步的度量值，例如年初至今销售额占比以及所有产品销售额的百分比。\n\
  \n![9781430264453_Fig06-06.jpg](img/9781430264453_Fig06-06.jpg)\n\n图 6-6。计算年初至今值\n\
  \n你也可以使用另一组函数——`DATESMTD`、`DATESQTD` 和 `DATESYTD`——来创建相同的度量值。与之前的截止到当前日期度量值一样，你需要将日期表中的日期键传递给这些函数。以下表达式使用\
  \ `CALCULATE` 函数和 `DATESYTD` 筛选器来获取年初至今销售额度量值。\n\n```\nYTD Sales 2:=CALCULATE([Sum\
  \ of Sales],DATESYTD('Date'[Datekey]))\n```\n\n使用 `CALCULATE` 函数和 `DATES` 函数比使用总截止日期函数更通用，因为你可以将它们用于任何类型的聚合，而不仅仅是求和。以下表达式用于计算平均年初至今销售额。结果如图\
  \ 6-7 所示。\n\n```\nAve Sales:=AVERAGE([SalesAmount])\nYTD Ave Sales:=CALCULATE([Ave\
  \ Sales],DATESYTD('Date'[Datekey]))\n```\n\n![9781430264453_Fig06-07.jpg](img/9781430264453_Fig06-07.jpg)\n\
  \n图 6-7。计算平均年初至今值\n\n既然你已了解如何创建基于时间段的计算，就可以用它来比较过去的绩效与当前的绩效。但首先，你需要知道如何移动日期上下文来计算过去的绩效。\n\
  \n#### 移动日期上下文\n\n如果你想将一个时期的绩效与过去同一时期的绩效进行比较，比如将当月的销售额与一年前同月的销售额进行比较，你就需要移动日期上下文。`DAX`\
  \ 包含多个执行此操作的函数。其中，移动日期上下文最通用的函数之一是 `PARALLELPERIOD`。与其他时间智能函数一样，你需要将日期表的关键列传递给该函数。你还需要指定间隔数量和间隔类型（年、季度或月）。\n\
  \n```\nPARALLELPERIOD(<dates>,<number_of_intervals>,<interval>)\n```\n\n需要记住的一点是，`PARALLELPERIOD`\
  \ 函数返回一组与间隔类型相对应的日期。如果你使用年份，它会返回一年的日期；使用月份间隔，则返回一个月的日期。以下表达式计算上一年同月的销售总额。图 6-8 显示了计算结果。\n\
  \n```\nMonth Sales Last Year:=Calculate([Sum of Sales],\nPARALLELPERIOD('Date'[Datekey],-12,Month))\n\
  ```\n\n![9781430264453_Fig06-08.jpg](img/9781430264453_Fig06-08.jpg)\n\n图 6-8。计算并行时期的销售额\n\
  \n请注意，如果你向下钻取到日期级别（请参阅图 6-9），你仍然会看到一年前该日期所在月份的总和。如前所述，这是因为在这种情况下，`PARALLELPERIOD`\
  \ 始终返回与当前行日期对应月份的上一年同月的一组日期。\n\n![9781430264453_Fig06-09.jpg](img/9781430264453_Fig06-09.jpg)\n\
  \n图 6-9。钻取到日级别仍显示月级别聚合\n\n既然你可以计算上一年同月的销售额，就可以将其与当前销售额结合起来，计算逐月同比增长。图 6-10 显示了结果。\n\
  \n```\nYOY Monthly Growth:=([Sum of Sales]-[Month Sales Last Year])/[Month Sales\
  \ Last Year] \n```\n\n![9781430264453_Fig06-10.jpg](img/9781430264453_Fig06-10.jpg)\n\
  \n图 6-10。计算同比月增长\n\n请注意，如果没有上一年同月的销售额，数据透视表中会出现错误。你可以通过检查上个月销售额是否为空，并插入一个空值来控制此问题。\n\
  \n```\nYOY Monthly Growth:=IF(\nISBLANK([Month Sales Last Year]),\nBLANK(),\n([Sum\
  \ of Sales]-[Month Sales Last Year])/[Month Sales Last Year])\n```\n\n另一个常用于改变日期上下文的函数是\
  \ `DATEADD`。`DATEADD` 函数用于向当前日期上下文添加一个日期间隔。你可以添加年、季度、月或日间隔。\n\n```\nDATEADD(<dates>,<number_of_intervals>,<interval>)\n\
  ```\n\n以下计算使用 `DATEADD` 函数作为筛选器，查找前一天的销售总额。\n\n```\nPrev Day Sales:=Calculate([Sum\
  \ of Sales],DATEADD('Date'[Datekey],-1,day))\n```\n\n现在你已了解如何移动日期上下文，接下来看看可用于筛选器并返回单个日期的函数。\n\
  \n#### 使用单日期函数\n\n`DAX` 包含一组返回单个日期的函数。这些函数通常用于筛选日期上下文。例如，`FIRSTDATE` 函数返回传递给它的日期列中的第一个日期。举例来说，你可以将其与\
  \ `DATESBETWEEN` 函数结合使用，以获取从当前日期上下文日期集的第一个日期到第 15 天的日期范围。\n\n```\nDATESBETWEEN('Date'[FullDateAlternateKey]\n\
  \ ,FIRSTDATE('Date'[FullDateAlternateKey])\n,DATEADD(FIRSTDATE('Date'[FullDateAlternateKey]),\
  \ 14, DAY))\n```\n\n然后，这可以在 `CALCULATE` 函数中用作筛选器，以获取该时期前 15 天的销售额。生成的数据透视表如图 6-11\
  \ 所示。\n\n![9781430264453_Fig06-11.jpg](img/9781430264453_Fig06-11.jpg)\n\n图 6-11。计算月前\
  \ 15 天的销售额\n\n如果你只看月度期间，你可以使用函数 `STARTOFMONTH` 和 `ENDOFMONTH`（也有针对年和季度的此类函数）。以下表达式用于计算月最后\
  \ 15 天的销售总额。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n`Last 15 Day\
  \ Sales` := `CALCULATE(SUM(InternetSales[SalesAmount]), DATESBETWEEN('Date'[FullDateAlternateKey],\
  \ DATEADD(ENDOFMONTH('Date'[FullDateAlternateKey]), -14, DAY), ENDOFMONTH('Date'[FullDateAlternateKey])))`\n\
  \n尽管你需要的大多数度量都是从较低级别聚合到较高级别（例如，从天数到月份）的基本聚合的简单扩展，但有时你也需要使用特殊聚合来上卷度量。这类度量被视为半加法度量，将在下一节中介绍。\n\
  \n#### 创建半加法度量\n\n在分析数据时，你经常会遇到半加法度量。一些常见的例子是库存和账户余额。例如，要确定当前时间点的库存总量，你需将所有商店的库存相加。然而，要查找一家商店在月底的总库存量，你无需将每天的库存量相加。\n\
  \n为了处理这些情况，DAX 包含了 `FIRSTNONBLANK` 和 `LASTNONBLANK` 函数。这些函数返回非空条件下的第一个或最后一个日期。例如，以下表达式确定产品库存条目的最后一个非空日期。\n\
  \n```\nLASTNONBLANK ('Date'[DateKey],CALCULATE (SUM(Inventory[UnitsInStock]))\n\
  ```\n\n然后，它与 `CALCULATE` 函数结合使用，以确定总库存单位。\n\n```\nProduct Units In Stock:=CALCULATE(SUM(Inventory[UnitsInStock]),\n\
  \  LASTNONBLANK('Date'[DateKey],\n   CALCULATE(SUM(Inventory[UnitsInStock]))))\n\
  ```\n\n现在，如果你想跨产品累加库存单位，可以使用以下表达式。\n\n```\nTotal Units In Stock:=SUMX(VALUES('Inventory'[ProductKey]),[Product\
  \ Units In Stock])\n```\n\n图 6-12 显示了结果数据透视表。请注意，`Total Units In Stock` 度量在产品之间是可加的，但在日期之间是不可加的。\n\
  \n![9781430264453_Fig06-12.jpg](img/9781430264453_Fig06-12.jpg)\n\n图 6-12. 计算库存单位\n\
  \nDAX 的优势之一是，一旦你学会了一种模式，就可以将其扩展到其他场景。例如，在现金流量分析中计算度量时，你可以采用本库存计算中使用的相同技术。以下计算用于计算期末余额。\n\
  \n```\nBalance:=CALCULATE ( SUM ( Finance[Amount]),\n  LASTNONBLANK ('Date'[DateKey],\n\
  \   CALCULATE(SUM ( Finance[Amount]))))\n```\n\n在前面的示例中，只有当库存或余额发生变化时，库存和余额才作为一行输入到表中。通常，余额或库存是每天输入的，并且相同的值会重复，直到发生变化。在这些情况下，你可以使用\
  \ DAX 函数 `CLOSINGBALANCEMONTH`、`CLOSINGBALANCEQUARTER` 和 `CLOSINGBALANCYEAR`。这些函数查看时间段的最后日期，并将其用作该时间段的值。换句话说，`CLOSINGBALANCEMONTH`\
  \ 函数返回的是该月最后一天的值。\n\n至此，你应该对各种时间函数的工作原理有了很好的理解。在下面的实验中，你将获得实现其中一些函数的经验。\n\n####\
  \ 实践实验——在 Power Pivot 中实现时间智能\n\n在下面的实验中，你将\n\n*   创建日期表。\n*   使用时间智能函数分析数据。\n*\
  \   创建月度环比增长数据透视表。\n*   创建库存水平报告。\n\n1.  在 `LabStarters` 文件夹中，打开 `LabChapter6.xlsx`\
  \ 文件。此文件包含来自测试 Consoto 数据库的库存和销售数据。\n2.  以关系图视图模式打开 Power Pivot 窗口（参见图 6-13）。请注意，这里没有\
  \ `Date` 表。我们可以从数据源加载一个，或者在 Excel 中创建一个。\n\n![9781430264453_Fig06-13.jpg](img/9781430264453_Fig06-13.jpg)\n\
  \n图 6-13. 当前的 Consoto 数据模型\n\n3.  要在 Excel 中创建 `Date` 表，请切换到工作表 3。选择第一个单元格并输入列名称\
  \ **DateKey**。在该列的第二个单元格中输入值 **1/1/2007**。使用 Excel 的自动填充功能添加值直至 12/31/2009。\n4.\
  \  要根据这些值创建表，请选择 A 列中的值。在“开始”选项卡下，选择“套用表格格式”下拉菜单，然后选择一种格式。在“表格工具设计”选项卡下，将表名称更改为\
  \ `Date`（参见图 6-14）。\n\n![9781430264453_Fig06-14.jpg](img/9781430264453_Fig06-14.jpg)\n\
  \n图 6-14. 创建日期表\n\n5.  要将表添加到模型，请选择该表，然后在 PowerPivot 选项卡下单击“添加到数据模型”按钮（参见图 6-15）。\n\
  \n![9781430264453_Fig06-15.jpg](img/9781430264453_Fig06-15.jpg)\n\n图 6-15. 将 Excel\
  \ 表添加到数据模型\n\n6.  你应该会在 Power Pivot 设计窗口的数据视图窗口中看到该表。单击“设计”选项卡，然后选择“标记为日期表”。使用 `DateKey`\
  \ 作为唯一标识符。\n7.  使用 `Date` 函数创建一个“年份”、“月份编号”和“月份”列（你必须使用 `FORMAT` 函数来创建“月份”列）。按“月份编号”列对“月份”列进行排序。\n\
  8.  切换到模型的“关系图”视图。使用“年份”和“月份”，在 `Date` 表中创建一个“日历”层次结构。\n9.  在 `Sales` 表和 `Date`\
  \ 表之间创建关系（参见图 6-16）。\n\n![9781430264453_Fig06-16.jpg](img/9781430264453_Fig06-16.jpg)\n\
  \n图 6-16. 创建 Sales 表和 Date 表之间的关系\n\n10.  在“数据视图”窗口中选择 `Sales` 表。添加以下度量，并将其格式设置为货币：\n\
  \n```\n    Sum of Sales:=SUM(Sales[SalesAmount])\n    YTD Sales:=TOTALYTD([Sum of\
  \ Sales],'Date'[Datekey])\n    MTD Sales:=TOTALMTD([Sum of Sales],'Date'[Datekey])\n\
  ```\n\n11.  要测试这些度量，请转到 Excel 中的 Sheet1，并单击单元格 B2。在“插入”选项卡上，选择“数据透视表”。在“创建数据透视表”窗口中，选择“使用外部数据源”，然后单击“选择连接”按钮（参见图\
  \ 6-17）。\n\n![9781430264453_Fig06-17.jpg](img/9781430264453_Fig06-17.jpg)\n\n图 6-17.\
  \ 选择外部数据源\n\n12.  在“现有连接”窗口中，选择“表”选项卡。在“表”选项卡中，选择“工作簿数据模型中的表”，然后单击“打开”（参见图 6-18）。选择连接后，在“创建数据透视表”窗口中单击“确定”。\n\
  \n![9781430264453_Fig06-18.jpg](img/9781430264453_Fig06-18.jpg)\n\n图 6-18. 选择数据模型连接\n\
  \n13.  将度量 `Sum Of Sales`、`MTD Sales` 和 `YTD Sales` 添加到“值”区域，并将 `Calendar` 层次结构添加到“行”区域。在“插入”选项卡中，选择“切片器”，然后选择\
  \ `ChannelName`。研究数据并验证是否符合预期（参见图 6-19）。\n\n![9781430264453_Fig06-19.jpg](img/9781430264453_Fig06-19.jpg)\n\
  \n图 6-19. 验证年度至今销售额度量\n\n14.  切换到数据模型中的 `Sales` 表。使用以下表达式创建一个滚动 3 个月销售额度量。将该度量格式化为货币。\n\
  \n```\nRolling 3 Month Sales:=CALCULATE([Sum of Sales],\n  DATESINPERIOD('Date'[Datekey],LASTDATE('Date'[Datekey]),-3,MONTH))\n\
  ```\n\n15.  将该度量添加到 Sheet1 上的数据透视表中，并验证其是否按预期工作。\n16.  接下来，你想比较一个月的销售额与下一个月的增长。首先，创建一个上月的销售额度量。\n\
  \n```\nPrev Month Sales:=CALCULATE([Sum of Sales],\n  PARALLELPERIOD('Date'[DateKey],-1,MONTH))\n\
  ```\n\n\n\n17.  接下来使用上期销售额和本期销售额创建一个销售额增长率度量值。将该度量值格式化为百分比。注意，需要检查上期销售额是否存在。如果不存在，需要返回空值。\n\
  \n```\nMonthly Sales Growth:=if(NOT(ISBLANK([Prev Month Sales])), \n([Sum of Sales]\
  \ - [Prev Month Sales])/[Prev Month Sales],BLANK())\n```\n\n18.  在 Excel 的 Sheet2\
  \ 中创建一个类似图 6-20 所示的数据透视表来测试结果。\n\n![9781430264453_Fig06-20.jpg](img/9781430264453_Fig06-20.jpg)\n\
  \n图 6-20. 测试月销售额增长率度量值\n\n19.  为了研究半累加度量值，你需要创建一个显示库存数量的数据透视表。首先，在 Inventory 表和\
  \ Date 表之间创建关系。\n20.  将以下库存计数度量值添加到 Inventory 表中：\n\n```\nInventory Count:=SUM([OnHandQuantity])\n\
  ```\n\n21.  为了计算一段时间内的库存量，你需要找到该时间段内最后一个非空条目。下面的公式将给出该值。日期范围的初始值为空（在第一个日期之前），最终日期为最大日期。你将把这个公式用作步骤\
  \ 22 中公式的一部分。\n\n```\nLNB Date:=LASTNONBLANK(\nDATESBETWEEN('Date'[Datekey],BLANK(),MAX('Date'[Datekey]))\n\
  ,[Inventory Count])\n```\n\n22.  使用最后一个非空筛选器和 `CALCULATE` 函数，可以计算某个产品的最后一个非空数量。将以下度量值添加到\
  \ Inventory 表中。\n\n```\nLNB Quantity:=CALCULATE([Inventory Count],\nLASTNONBLANK(DATESBETWEEN('Date'[Datekey],\n\
  BLANK(),MAX('Date'[Datekey])),[Inventory Count]))\n```\n\n23.  现在你可以将所选产品的数量相加。将以下度量值添加到\
  \ Inventory 表中。\n\n```\nProduct Quantity:=SUMX(\nVALUES(Product[ProductKey]),[LNB\
  \ Quantity])\n```\n\n24.  最后一步是使用以下度量值将所有选定门店的库存相加。\n\n```\nInventory Level:=SUMX(Values(Store[StoreKey]),[Product\
  \ Quantity])\n```\n\n25.  要测试该度量值，请在 Excel 中添加一个新工作表，并创建一个类似图 6-21 所示的数据透视表。\n\n\
  ![9781430264453_Fig06-21.jpg](img/9781430264453_Fig06-21.jpg)\n\n图 6-21. 测试库存度量值\n\
  \n总结\n\n本章为您提供了使用 Power Pivot 和 DAX 成功进行基于日期时间分析所需的基础知识。现在您应该了解如何移位日期上下文以比较基于并行期间的度量值。您还应该能够自如地使用期至今\
  \ DAX 公式来聚合度量值。将您在第 5 章和本章中学到的概念结合起来；当您这样做时，您应该开始识别分析中的模式。基于这些模式，您可以确定所需的 DAX 模板来解决问题。由于并非所有人都熟悉在\
  \ Excel 中创建数据透视表和数据透视图，下一章将向您展示如何基于您的模型在 Excel 中创建仪表盘的基础知识。如果您熟悉这些概念，可以跳过第 7 章。\n\
  \n第 7 章\n\n![image](img/frontdot.jpg)\n\n使用数据透视表和透视图进行数据分析\n\n一旦您在 Power Pivot 中创建了数据模型，就需要创建一个界面，供用户与数据模型交互并使用该模型执行数据分析。根据进行的分析类型，您可以使用多种程序与模型交互；这些程序包括\
  \ Power View、Power Map、Performance Point 和 Reporting Services。尽管所有这些工具都是可行的客户端，但最佳客户端工具之一是\
  \ Excel 本身。Excel 是一个功能丰富的环境，可用于使用数据透视表和透视图创建仪表盘。此外，与同事共享 Excel 文件或在 SharePoint 上托管\
  \ Excel 工作簿以实现更高的性能和安全性也非常容易。本章介绍构建用于分析 Excel 中数据透视表和透视图的 Power Pivot 模型中所包含的数据的界面的基础知识。\n\
  \n完成本章后，您将能够：\n\n*   使用数据透视表探索数据。\n*   使用切片器筛选数据。\n*   向数据透视表添加可视化效果。\n*   使用透视图探索趋势。\n\
  *   使用多个相互关联的图表和表格。\n*   使用多维数据集函数查询数据模型\n\n![Image](img/sq.jpg) **注意** 本章包含对彩色图片的引用。如果您正在阅读本书的印刷版或黑白电子书版本，可以在\
  \ `http://www.apress.com/9781430264453` 的源代码/下载包中找到彩色图片的副本。\n\n数据透视表基础\n\n分析数据最广泛使用的工具之一是数据透视表。数据透视表使您能够轻松地从数据中发现模式和关系。例如，您可以确定哪些产品在一年中的特定时期销量更好。或者，您可以了解营销活动如何影响各种产品的销售。图\
  \ 7-1 展示了数据透视表的各个区域。\n\n行字段和列字段包含您感兴趣用于汇总数据的属性。例如，图 7-1 中的数据透视表按产品类别和年份聚合值。筛选器用于按某些属性筛选数据透视表中的值。图\
  \ 7-1 中的筛选器将结果限制在每年的第一季度。在这种情况下，切片器的作用与筛选器相同，将值限制为大型经销商。切片器具有可同时筛选多个数据透视表和透视图的额外优势。\n\
  \n![9781430264453_Fig07-01.jpg](img/9781430264453_Fig07-01.jpg)\n\n图 7-1. 数据透视表的组成部分\n\
  \n要构建数据透视表，请将字段从字段列表拖放到字段列表下方的放置区域，如图 7-2 所示。如果只是单击复选框来选择字段，则会将文本字段放置在行区域，并将任何数值放置在值区域。这可能会变得非常烦人，因为它会将诸如\
  \ Years 之类的字段放置在值区域中，并将其视为一组要求和的数值。（在第 8 章中，我将向您展示如何避免这种情况。）\n\n![9781430264453_Fig07-02.jpg](img/9781430264453_Fig07-02.jpg)\n\
  \n图 7-2. 向数据透视表添加字段\n\n为了添加切片器以筛选数据透视表，您需要转到 Excel 中的“插入”选项卡，然后选择“切片器”按钮。在下一节中，您将学习如何添加切片器以及如何使用同一个切片器控制多个数据透视表。\n\
  \n切片数据\n\n要向数据透视表添加切片器进行筛选，请单击数据透视表，然后在“插入”选项卡上，选择“切片器”按钮。您应该会看到一个选取列表，其中包含 Power\
  \ Pivot 数据模型中的字段（参见图 7-3）。\n\n![9781430264453_Fig07-03.jpg](img/9781430264453_Fig07-03.jpg)\n\
  \n图 7-3. 选择切片器字段\n\n\n\n由于插入切片器时已选中数据透视表，因此切片器会自动与数据透视表关联。你可以点击切片器并选择 `切片器工具 选项`\
  \ 选项卡来验证这一点（参见图 7-4）。使用此选项卡可以设置切片器格式，并选择切片器的报表连接。\n\n![9781430264453_Fig07-04.jpg](img/9781430264453_Fig07-04.jpg)\n\
  \n图 7-4. 设置切片器连接\n\n图 7-5 显示了切片器的 `报表连接` 选择列表。请注意，数据透视表不必与切片器位于同一工作表中。数据透视表的名称是\
  \ Excel 在创建时为其分配的通用名称。随着添加更多数据透视表，最好为其赋予更有意义的名称。如果点击数据透视表并转到 `数据透视表工具 分析` 选项卡，你将看到一个文本框，可以在其中更改数据透视表的名称。\n\
  \n![9781430264453_Fig07-05.jpg](img/9781430264453_Fig07-05.jpg)\n\n图 7-5. 为切片器选择连接\n\
  \n如果在 `切片器工具 选项` 选项卡下选择 `切片器设置` 按钮，将打开 `切片器设置` 窗口（参见图 7-6），你可以在其中更改切片器的名称、标题和排序顺序。还可以选择如何显示无数据的项。\n\
  \n![9781430264453_Fig07-06.jpg](img/9781430264453_Fig07-06.jpg)\n\n图 7-6. 更改切片器设置\n\
  \n有时你需要*级联筛选*——即一个筛选器限制下一个筛选器中可供选择的内容。对于基于模型中相关字段的切片器来说，这很容易实现。当你选择相关字段时，切片器会自动为你链接。例如，图\
  \ 7-7 显示了一个产品类别和产品子类别筛选器。如果选择了一个产品类别，相应的产品子类别就会被突出显示。\n\n![9781430264453_Fig07-07.jpg](img/9781430264453_Fig07-07.jpg)\n\
  \n图 7-7. 使用切片器创建级联筛选\n\n#### 向数据透视表添加可视化效果\n\n为了帮助识别趋势、异常值并提供对数据的洞察，你可以向数据透视表添加多种类型的可视化效果。这些包括条件格式、数据条和趋势线。图\
  \ 7-8 展示了一个带有数据条和条件格式的数据透视表。\n\n![9781430264453_Fig07-08.jpg](img/9781430264453_Fig07-08.jpg)\n\
  \n图 7-8. 使用条件格式和数据条\n\n要创建可视化格式，请在数据透视表中选择要设置格式的数据，然后在 `开始` 选项卡中，点击 `条件格式` 下拉菜单（参见图\
  \ 7-9）。如你所见，有很多选项可用于创建条件格式。在图 7-8 中，有一个 `突出显示单元格规则`，可以将负数显示为红色。\n\n![9781430264453_Fig07-09.jpg](img/9781430264453_Fig07-09.jpg)\n\
  \n图 7-9. 设置条件格式\n\n一旦建立规则，你可以通过选择 `管理规则` 选项并选择要编辑的规则来修改它。图 7-10 显示了可以为 `数据条` 格式规则设置的各种选项。\n\
  \n![9781430264453_Fig07-10.jpg](img/9781430264453_Fig07-10.jpg)\n\n图 7-10. 编辑数据条规则\n\
  \n你可以使用格式规则产生一些有趣的效果。例如，图 7-11 中的数据透视表展示了一个热力图，用于快速判断哪些月份销售情况良好，哪些月份不佳。\n\n![9781430264453_Fig07-11.jpg](img/9781430264453_Fig07-11.jpg)\n\
  \n图 7-11. 使用条件格式创建热力图\n\n另一个与数据透视表相关的流行功能是迷你图。*迷你图*是显示一系列数据趋势的微型图表。图 7-12 展示了显示全年四个季度销售趋势的迷你图。\n\
  \n![9781430264453_Fig07-12.jpg](img/9781430264453_Fig07-12.jpg)\n\n图 7-12. 使用迷你图显示趋势\n\
  \n要创建迷你图，请突出显示数据透视表中包含数据的值，然后在 `插入` 选项卡上选择 `迷你图` 按钮。接着选择迷你图的位置（参见图 7-13）。您必须从折线图、柱形图或盈亏图中选择一种。\n\
  \n![9781430264453_Fig07-13.jpg](img/9781430264453_Fig07-13.jpg)\n\n图 7-13. 设置迷你图\n\
  \n虽然向数据透视表添加可视化效果可以增强你分析数据的能力，但很多时候，发现趋势以及比较和对比数据的最佳方式是通过使用图表和图形。在下一节中，你将看到图表和图形如何成为有用的数据分析工具，以及如何将它们添加到分析仪表板中。\n\
  \n#### 使用数据透视图\n\n除了数据透视表，Excel 还提供了一套强大的图表和图形供你分析数据。添加数据透视图与添加数据透视表非常相似。在 Excel\
  \ 的 `插入` 选项卡上，选择 `数据透视图` 下拉菜单。你可以选择单独的一个 `数据透视图`，或者选择相互关联的 `数据透视图` 和 `数据透视表`（参见图\
  \ 7-14）。\n\n![9781430264453_Fig07-14.jpg](img/9781430264453_Fig07-14.jpg)\n\n图 7-14.\
  \ 添加数据透视图\n\n选择数据透视图后，会弹出一个窗口，用于选择数据源以及放置数据透视图的位置（参见图 7-15）。\n\n![9781430264453_Fig07-15.jpg](img/9781430264453_Fig07-15.jpg)\n\
  \n图 7-15. 选择数据源\n\n要选择 `Power Pivot` 模型作为数据源，请选择使用外部连接，然后单击 `选择连接` 按钮。在 `现有连接` 窗口中，选择\
  \ `表` 选项卡，然后选择 `工作簿数据模型中的表`（参见图 7-16）。\n\n![9781430264453_Fig07-16.jpg](img/9781430264453_Fig07-16.jpg)\n\
  \n图 7-16. 选择工作簿数据模型\n\n选择数据源后，将显示一个空白图表和字段选择框，你可以在其中拖放字段以定义图表的数值和坐标轴（参见图 7-17）。\n\
  \n![9781430264453_Fig07-17.jpg](img/9781430264453_Fig07-17.jpg)\n\n图 7-17. 创建图表\n\
  \n默认情况下，图表是柱形图，但你有很多不同类型的图表可供选择。如果点击图表并选择 `数据透视图工具 设计` 选项卡，则可以选择 `更改图表类型` 按钮，并从多种类型中进行选择（参见图\
  \ 7-18）。\n\n![9781430264453_Fig07-18.jpg](img/9781430264453_Fig07-18.jpg)\n\n图 7-18.\
  \ 选择图表类型\n\n除了更改图表类型，`数据透视图工具` 选项卡还提供了大量设计和格式设置选项，你可以使用它们自定义图表和图形的外观。绝对值得花时间尝试这些工具并创建各种图形，以便更好地了解可用的各种选项。\n\
  \n#### 使用多个图表和表格\n\n\n好的，作为高级文档工程师和翻译员，我将遵循给定的注意事项和示例，将以下英文文本翻译成中文。\n\n\n在创建数据透视表和图表以显示和理解数据时，您通常希望创建一个能够轻松评估绩效的仪表板。您可能对销售绩效、网络性能或装配线效率感兴趣。仪表板将可视化表示，例如关键绩效指标（KPI）、图形和图表，整合到对该流程的整体视图中。尽管从技术上讲，它们不被视为仪表板工具，但您可以使用\
  \ Excel 和 Power Pivot 数据透视表及图表创建一些非常引人注目的数据展示，然后可以在 SharePoint 中显示和共享这些内容。\n\n当向仪表板添加多个图表和表格时，您可能希望将它们链接在一起，以便它们以不同的方式表示相同的数据。您也可能希望使用相同的切片器来控制它们，使它们保持同步。最简单的方法是使用`插入`选项卡并选择`数据透视图和数据透视表`来添加它们（参见图\
  \ 7-19）。\n\n![9781430264453_Fig07-19.jpg](img/9781430264453_Fig07-19.jpg)\n\n图 7-19.\
  \ 添加数据透视图和关联的数据透视表\n\n以这种方式添加数据透视图和数据透视表会在它们之间建立链接，因此当您向其中一个添加字段时，它会向另一个添加相同的字段。此外，当您向页面添加切片器时，它会自动将切片器连接到数据透视表和数据透视图。图\
  \ 7-20 展示了一个由链接的数据透视表、数据透视图和切片器组成的简单仪表板。\n\n![9781430264453_Fig07-20.jpg](img/9781430264453_Fig07-20.jpg)\n\
  \n图 7-20. 在 Excel 中创建简单的仪表板\n\n如果需要连接多个图表，请打开模型设计器，然后在`主页`选项卡上选择`数据透视表`下拉菜单（参见图\
  \ 7-21）。这还允许您插入扁平化的数据透视表，这对于打印非常有用。\n\n![9781430264453_Fig07-21.jpg](img/9781430264453_Fig07-21.jpg)\n\
  \n图 7-21. 连接多个数据透视图\n\n#### 使用多维数据集函数\n\n在 Excel 中使用内置的`数据透视图`和`数据透视表`布局，您可以创建引人注目的仪表板，并为浏览数据提供出色的界面。然而，有时您可能会对这些结构固有的某些限制感到沮丧。例如，您无法在数据透视表内插入自己的列来创建自定义计算。您可能还希望以非表格格式显示数据以生成自定义报表。这时，Excel\
  \ 的多维数据集函数就非常有用了。\n\nExcel 的多维数据集函数允许您直接连接到 Power Pivot 数据模型，而无需使用数据透视表。多维数据集函数是\
  \ Excel 函数（与 DAX 函数相对），可以在 Excel 的`公式`选项卡下的`其他函数`下拉菜单中找到（参见图 7-22）。\n\n![9781430264453_Fig07-22.jpg](img/9781430264453_Fig07-22.jpg)\n\
  \n图 7-22. 使用多维数据集函数连接到模型\n\n了解如何使用这些函数的最简单方法是创建一个数据透视表，然后在`数据透视表工具 分析`选项卡上，选择`OLAP\
  \ 工具`下拉菜单，然后选择`转换为公式`选项（参见图 7-23）。\n\n![9781430264453_Fig07-23.jpg](img/9781430264453_Fig07-23.jpg)\n\
  \n图 7-23. 从数据透视表转换为多维数据集函数\n\n图 7-24 显示了转换为多维数据集函数后的表格。它使用`CUBEMEMBER`函数从多维数据集中返回一个成员或元组（有序列表），使用`CUBEVALUE`函数从多维数据集中返回一个聚合值。\n\
  \n![9781430264453_Fig07-24.jpg](img/9781430264453_Fig07-24.jpg)\n\n图 7-24. 使用多维数据集函数检索值\n\
  \n以下公式用于返回单元格 C3 的列标签：\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\",\"[Geography].[CountryRegionCode].&[AU]\"\
  )\n```\n\n第一个参数是数据模型连接的名称，第二个参数是成员表达式。\n\n单元格 C4 中的值通过以下公式返回：\n\n```\n=CUBEVALUE(\"\
  ThisWorkbookDataModel\",$B$2,$B4,C$3)\n```\n\n此公式使用了单元格引用，但您可以将这些引用替换为这些单元格中包含的多维数据集函数：\n\
  \n```\n=CUBEVALUE\n(\n    \"ThisWorkbookDataModel\",\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
  ,\"[Measures].[Sum of SalesAmount]\"),\n    CUBEMEMBER(\"ThisWorkbookDataModel\"\
  ,\n        \"[Product].[ProductCategory].[Category].&[Accessories]\"),\n    CUBEMEMBER(\"\
  ThisWorkbookDataModel\",\n        \"[Geography].[CountryRegionCode].&[AU]\")\n)\n\
  ```\n\n请注意，其中一个参数是返回您所需值的聚合的`CUBEMEMBER`函数；其他参数使用`CUBEMEMBER`来定义用于聚合的多维数据集部分。\n\n\
  ![9781430264453_Fig07-25.jpg](img/9781430264453_Fig07-25.jpg)\n\n图 7-25. 重新排列数据\n\
  \n现在，您可以重新排列值和标签，以获得所需的布局和格式（参见图 7-25）。\n\n#### 动手实验——在 Excel 中创建 BI 界面\n\n在以下实验中，您将：\n\
  \n-   向数据透视表添加条件格式。\n-   创建图表以帮助分析数据。\n-   链接数据透视表和数据透视图。\n-   使用多维数据集函数显示模型数据。\n\
  \n1.  在`LabStarters`文件夹中，打开`LabChapter7.xlsx`文件。该文件包含测试 AdventureWorksDW 数据库中的库存和销售数据。\n\
  2.  在 Excel 的 Sheet1 中，使用`插入`选项卡上的`数据透视表`按钮插入一个 Power Pivot 表。选择`使用外部数据源`，然后单击`选择连接`按钮。在`现有连接`窗口的`表`选项卡上，选择`工作簿数据模型中的表`（参见图\
  \ 7-26）。\n\n![9781430264453_Fig07-26.jpg](img/9781430264453_Fig07-26.jpg)\n\n图 7-26.\
  \ 选择连接\n\n3.  将`ResellerSales`表中的`TotalQuantity`、`TotalSales`和`TotalMargin`添加到`字段列表`窗口的`值`拖放区域。将`Calendar`层次结构添加到`行标签`拖放区域。\n\
  4.  请注意，某些边距值为负。为了引起对负值的注意，您将把它们格式化为红色。\n5.  在数据透视表中选择一个`TotalMargin`单元格。在`主页`选项卡上，单击`条件格式`下拉菜单。选择`突出显示单元格规则`\
  \ ![image](img/arrow.jpg) `小于`选项。将小于 0 的单元格格式化为红色文本（参见图 7-27）。\n\n![9781430264453_Fig07-27.jpg](img/9781430264453_Fig07-27.jpg)\n\
  \n图 7-27. 设置条件格式\n\n6.  完成后，您应该在选定单元格旁边看到一个图标。单击它并选择`显示 TotalMargin 值的所有单元格`选项。\n\
  7.  选择一个`TotalSales`单元格。这次，在`条件格式`下拉菜单下选择`数据条`。选择一种渐变样式。选择`数据条`后，您应该在值旁边看到一个小图标。单击它并选择`显示\
  \ TotalSales 值的所有单元格`。\n8.  您的数据透视表应类似于图 7-28。展开年份，注意格式化会显示在季度、月份和年份上。\n\n![9781430264453_Fig07-28.jpg](img/9781430264453_Fig07-28.jpg)\n\
  \n图 7-28. 向数据透视表添加数据条\n\n\n9.  打开`sheet2`，在`Insert`选项卡中，选择`PivotChart`下拉菜单。从下拉菜单中选择`pivot\
  \ chart`。使用`Tables In Workbook Data Model`连接，将图表插入到当前工作表中。\n10. 在`Field List`窗口中，将`ResellerSales`表中的`TotalSales`添加到`Values`拖放区域，并将`Geography`表中的`CountryRegionName`添加到`Axis\
  \ Fields`拖放区域。您应该会看到一个按国家显示销售额的柱形图（参见图 7-29）。\n\n![9781430264453_Fig07-29.jpg](img/9781430264453_Fig07-29.jpg)\n\
  \n图 7-29. 添加柱形图\n选中该柱形图。您应该会看到`PivotChart Tools`选项卡。在`Design`选项卡中，您可以更改图表颜色、布局和图表类型。\n\
  \n11. 在`Layout`选项卡中，您可以修改标题、图例、标签和网格线。`Format`选项卡允许您设置图表中的形状和文本格式。`Analyze`选项卡允许您显示/隐藏字段按钮。\n\
  12. 将图表标题重命名为`Sales By Country`。隐藏字段按钮和图例。删除网格线。\n13. 右键单击垂直轴并选择`Format Axis`。在`Axis\
  \ Options`下，将`Display Units`更改为`Millions`。在`Number`节点下，将`Category`更改为`Currency`，小数位数设置为零。您的图表应类似于图\
  \ 7-30。\n\n![9781430264453_Fig07-30.jpg](img/9781430264453_Fig07-30.jpg)\n\n图 7-30.\
  \ 格式化柱形图\n\n14. 有时您希望同时查看数据图表和数据表。为此，请转到`Power Pivot Model Designer`，在`Home`选项卡中，选择`PivotTable`下拉菜单。从下拉菜单中选择`Chart\
  \ And Table (Horizontal)`。将图表和表格插入到新工作表中。\n15. 将图表类型更改为饼图。在图表对应的`Field List`窗口中，将`TotalSales`字段添加到`Values`拖放区域，将`CountryRegionCode`添加到`Axis\
  \ Fields`拖放区域。\n16. 将图表标题更改为`Sales By Country`并移除字段按钮。\n17. 在`Design`选项卡上更改`Chart\
  \ Layout`，使值显示为不带小数位的货币格式（参见图 7-31）。\n\n![9781430264453_Fig07-31.jpg](img/9781430264453_Fig07-31.jpg)\n\
  \n图 7-31. 创建销售饼图\n\n18. 单击数据透视表以调出其`Field List`窗口。将`ResellerSales`表的`TotalSales`添加到`Values`拖放区域。将`Product\
  \ Subcategory`添加到`Row Labels`拖放区域。\n19. 选中饼图，为产品类别和年份各插入一个切片器（参见图 7-32）。验证切片器是否仅筛选饼图，而不影响数据透视表。\n\
  \n![9781430264453_Fig07-32.jpg](img/9781430264453_Fig07-32.jpg)\n\n图 7-32. 插入切片器\n\
  \n20. 选中`Year`切片器，在`Slicer Tools Options`选项卡中，单击`Report Connections`按钮。添加与饼图位于同一工作表的数据透视表。对类别切片器重复此操作。\n\
  21. 验证切片器是否会同时筛选图表和数据透视表。您的仪表板应类似于图 7-33。\n\n![9781430264453_Fig07-33.jpg](img/9781430264453_Fig07-33.jpg)\n\
  \n图 7-33. 创建仪表板\n\n22. 向工作簿中添加一个新工作表。您将使用多维数据集函数计算总销售额最高的产品和经销商。最终结果应类似于图 7-34。\n\
  \n![9781430264453_Fig07-34.jpg](img/9781430264453_Fig07-34.jpg)\n\n图 7-34.\n\n23.\
  \ 在单元格`B1`中添加以下代码以选择`TotalSales`度量值。\n\n```\n=CUBEMEMBER(\"ThisWorkbookDataModel\"\
  ,\"[Measures].[TotalSales]\")\n```\n\n24. 在`B2`中，使用以下函数获取按`TotalSales`降序排列的经销商集合。您将使用此集合来选择排名靠前的经销商。\n\
  \n```\n=CUBESET(\"ThisWorkbookDataModel\",\n    \"[Reseller].[ResellerName].children\"\
  ,\"Top Reseller\",2,B1)\n```\n\n25. 在`B3`中，使用此函数获取按`TotalSales`降序排列的产品集合。\n\n```\n\
  =CUBESET(\"ThisWorkbookDataModel\",\n     \"[Product].[Product].children\",\"Top\
  \ Products\",2,B1)\n```\n\n26. 在`C2`中，使用`CUBERANKEDMEMBER`函数从`B2`中的函数返回的集合中获取排名靠前的经销商。\n\
  \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B2,1)\n```\n\n27. 在`C3`中，使用`CUBERANKEDMEMBER`函数从`B3`中的函数返回的集合中获取排名靠前的产品。\n\
  \n```\n=CUBERANKEDMEMBER(\"ThisWorkbookDataModel\",B3,1)\n```\n\n28. 在`D2`中，使用`CUBEVALUE`函数获取在`C2`中找到的排名靠前经销商的总销售额。请注意，您必须将在`C2`中找到的经销商名称连接到\
  \ Power Pivot 模型中的`[Reseller].[ResellerName]`属性。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
  ,\n    \"[Reseller].[ResellerName].&[\"& C2 &\"]\",\"[Measures].[TotalSales]\")\n\
  ```\n\n29. 使用类似的`CUBEVALUE`函数，您可以获取排名靠前产品的总销售额值。\n\n```\n=CUBEVALUE(\"ThisWorkbookDataModel\"\
  ,\n      \"[Product].[Product].&[\" &C3&\"]\",\"[Measures].[TotalSales]\")\n```\n\
  \n总结\n\n正如您在本章中所见，Excel 是一个功能丰富的环境，可用于使用数据透视表和数据透视图创建仪表板。至此，您应该能够自如地使用工作簿模型作为数据源来创建数据透视表和数据透视图。您还使用了\
  \ Excel 多维数据集函数直接查询模型，而无需使用数据透视表。尽管本章涵盖了入门基础知识，但关于 Excel 以及它如何帮助您分析数据，您还有更多需要学习。我鼓励您深入研究这些功能。下一章是接下来三章中的第一章，您将了解\
  \ Power Pivot 模型的另一个有用界面。Power View 为用户探索数据提供了丰富的交互式界面。您将首先学习如何优化模型以在 Power View\
  \ 中进行分析，接着使用 Power View 创建标准报表，然后学习如何在 Power View 中创建引人注目的交互式报表。\n\n"
- '# 第 2 部分


  ![image](img/frontdot.jpg)


  使用 Power View 构建交互式报表和仪表板


  ### 第 8 章


  ![image](img/frontdot.jpg)


  为 Power View 优化 Power Pivot 模型


  Power View 是 Excel 中的一种工作表类型，允许用户开发交互式可视化效果，鼓励对数据进行临时探索。对于希望探索数据并从数据中获取洞察的非 Excel
  高级用户来说，它是一个理想工具。由于 Power View 可视化基于 Power Pivot 模型，您需要为用户提供一个扎实的模型作为这些可视化效果的基础。一个经过优化、适合
  Power View 使用的良好 Power Pivot 模型，将决定用户体验是极佳还是极其糟糕。有多种方法可以优化 Power Pivot 模型，使其更便于在
  Power View 中创建报表。本章将回顾这些设置，并展示如何创建支持多种 Power View 功能的模型。


  完成本章后，您将能够：


  *   了解 Power View 中可用的可视化类型。

  *   在 Power View 中创建基本可视化效果。

  *   设置 Power Pivot 模型中的属性以改善 Power View 体验。


  ![Image](img/sq.jpg) **注意** 如需彩色图片副本，请访问 `http://www.apress.com/9781430264453` 的“源代码/下载”部分。


  #### 使用 Power View 可视化数据



  正如我们在第 7 章所见，你可以使用 Excel 数据透视表和图表创建强大的数据可视化效果，并执行深入的数据分析。如果你是一名 Excel 高级用户，且工作职责包括详细数据分析，这些工具很可能是你的首选。另一方面，如果你需要一款工具，能让用户基于
  Power Pivot 模型快速轻松地创建可视化效果，那么 Power View 将是一个绝佳选择。你可以使用 Power View 创建引人注目的仪表板，其中包含上下关联的可视化元素，这些元素可以轻松筛选、排序和向下钻取。Power
  View 报表可以作为 Excel 工作表托管，也可以存放在 SharePoint 库中。它还有一个额外的好处：可以导出到 PowerPoint，在演示中使用，同时仍保留其交互性。图
  8-1 展示了一个包含联动图表和图形的 Power View 报表示例。当点击图表中的某个条形时，图形会根据所点击的国家和年份进行筛选。


  ![9781430264453_Fig08-01.jpg](img/9781430264453_Fig08-01.jpg)


  图 8-1。Power View 中的交互式图表和图形


  使用 Power View，你可以创建常见的可视化效果，例如表、矩阵、图表和图形。此外，你还可以创建包含时间轴的散点图，以揭示数据随时间的变化情况（参见图 8-2）。


  ![9781430264453_Fig08-02.jpg](img/9781430264453_Fig08-02.jpg)


  图 8-2。为散点图添加播放轴


  由于 Power View 使用必应地图图块，你可以将数据呈现在交互式地图上。在浏览数据时，你可以放大地图并平移至街道地址级别。图 8-3 展示了按县级划分的降雨量地图。


  ![9781430264453_Fig08-03.jpg](img/9781430264453_Fig08-03.jpg)


  图 8-3。按县级划分的降雨量地图


  Power View 中另外两种可用的数据可视化类型是卡片和磁贴。`Cards`（卡片）以索引卡样式显示每一行的数据。例如，你可以查看员工的联系信息，如图 8-4
  所示。


  ![9781430264453_Fig08-04.jpg](img/9781430264453_Fig08-04.jpg)


  图 8-4。卡片样式的员工信息


  `tile`（磁贴）可视化效果允许你使用一个可包含文本和图像的标签条，以交互方式筛选数据。例如，图 8-5 展示了如何使用磁贴，通过标签条中地区的图像来按区域筛选销售额。


  ![9781430264453_Fig08-05.jpg](img/9781430264453_Fig08-05.jpg)


  图 8-5。在 Power View 中使用磁贴图像


  现在你已经熟悉了 Power View 中可用的一些可视化类型，接下来我们来看看创建一些基本报表的过程。


  #### 创建基本报表


  Power View 报表基于 Excel 中的 Power Pivot 模型。要创建报表，请打开包含该模型的 Excel 工作簿，然后在“插入”选项卡上，单击“Power
  View”按钮（参见图 8-6）。


  ![9781430264453_Fig08-06.jpg](img/9781430264453_Fig08-06.jpg)


  图 8-6。插入 Power View 报表


  这将在工作簿中插入一个新选项卡，并为你提供 Power View 设计界面。该设计包含一个数据可视化区域、一个筛选器区域和一个 Power View 字段窗口。Power
  View 字段窗口包含暴露给客户端工具的 Power Pivot 模型的表和字段（参见图 8-7）。


  ![9781430264453_Fig08-07.jpg](img/9781430264453_Fig08-07.jpg)


  图 8-7。Power View 设计界面


  在 Power View 中创建可视化效果的关键之一是从表视图开始，待选定字段后，再将表视图切换为其他数据可视化类型。展开 Power View 字段列表中的表节点，你将看到可用字段。如果你想创建一个显示按销售区域划分销售额的条形图，首先将所需字段拖到“字段”放置区域。这将在设计界面上创建一个表视图。选中该表视图后，你可以在“设计”选项卡上选择不同的可视化类型（参见图
  8-8）。


  ![9781430264453_Fig08-08.jpg](img/9781430264453_Fig08-08.jpg)


  图 8-8。更改可视化类型


  切换可视化类型后，字段列表下的放置区域将根据可视化类型而改变。图 8-9 展示了条形图的放置区域。你可能需要重新排列字段，并向放置区域添加额外字段，以获得所需的可视化效果。


  ![9781430264453_Fig08-09.jpg](img/9781430264453_Fig08-09.jpg)


  图 8-9。条形图放置区域


  你可以轻松地将可视化效果从一种类型更改为另一种。例如，如果你选中条形图，然后在“设计”选项卡中选择其他图表下拉菜单，就可以将其切换为饼图（参见图 8-10）。


  ![9781430264453_Fig08-10.jpg](img/9781430264453_Fig08-10.jpg)


  图 8-10。切换可视化类型


  现在你已经了解了如何创建基本可视化效果（你将在第 9 章和第 10 章中学习创建更复杂的可视化效果），接下来我们看看如何利用 Power Pivot 模型来改善
  Power View 中的设计者和用户体验。


  #### 改善 Power View 体验


  让 Power Pivot 模型的用户在 Power View 中构建和探索各种可视化效果时拥有愉快的体验非常重要。例如，你应只暴露对用户有意义的字段。通常，隐藏用于关联模型中表的关键值是个好主意。要从
  Power View 的可用字段列表中隐藏某个列，请右键单击该列并选择“从客户端工具隐藏”（这将在模型设计器中将该列变为灰色）。图 8-11 展示了隐藏一个没有业务意义的
  `CustomerID` 字段。


  ![9781430264453_Fig08-11.jpg](img/9781430264453_Fig08-11.jpg)


  图 8-11。从客户端工具隐藏字段


  如果你查看图 8-11 弹出菜单的底部，你会发现可以为该字段输入描述。当你在 Power View 中悬停在该字段上时，此描述将会显示。此选项也适用于模型中创建的度量值，并且对于那些需要了解度量值定义方式的业务用户来说非常有用。图
  8-12 展示了在 Power View 中显示的描述。


  ![9781430264453_Fig08-12.jpg](img/9781430264453_Fig08-12.jpg)


  图 8-12。添加字段描述可改善用户体验




  当你查看图 8-12 中的字段列表时，请注意字段前面的图标。计算器图标表示该度量是在 Power Pivot 模型中创建的。求和符号表示该字段是数字型，并且拖拽到字段放置区域时会进行聚合。默认的聚合是求和，但这可能并非所需的聚合方式。在某些情况下，你并不希望对数字进行聚合；例如，在日期表中，年份字段本就不应被聚合。你可以通过在
  Power Pivot 模型的“高级”选项卡中设置`Summarize By`下拉菜单来控制此行为（参见图 8-13）。


  ![9781430264453_Fig08-13.jpg](img/9781430264453_Fig08-13.jpg)


  图 8-13 设置字段的默认聚合方式


  除了设置字段级别的属性，你还可以在 Power Pivot 模型中设置一些表级别的属性，从而更轻松地在 Power View 中创建报表。在 Power Pivot
  模型设计器中查看某个表的“高级”选项卡时，你会看到一个`Default Field Set`按钮（参见图 8-13）。选择此按钮可以指定该表的默认字段集（参见图
  8-14）。设置后，Power View 用户只需在 Power View 字段列表中点击该表节点，即可快速创建表格（参见图 8-15）。


  ![9781430264453_Fig08-14.jpg](img/9781430264453_Fig08-14.jpg)


  图 8-14 设置表的默认字段


  ![9781430264453_Fig08-15.jpg](img/9781430264453_Fig08-15.jpg)


  图 8-15 在 Power View 中使用默认字段


  在 Power View 中创建可视化对象时，它会根据所选字段和可视化类型自动对项目进行分组。你可以通过设置 Power Pivot 模型中的`Table Behavior`属性来控制分组的评估方式。在模型设计器的“高级”选项卡中，可以访问`Table
  Behavior`属性（参见图 8-13）。点击后，`Table Behavior`按钮会显示“表行为”设置窗口（参见图 8-16）。


  ![9781430264453_Fig08-16.jpg](img/9781430264453_Fig08-16.jpg)


  图 8-16 设置表行为


  你可以为表设置的`Table Behavior`属性包括：行标识符、任何指示唯一性的列、默认标签和默认图像。行标识符用于指示能唯一标识每一行的字段（通常称为主键）。该字段必须唯一且不能为空。一旦设置了行标识符，你就可以选择哪些列包含的值应保持唯一。例如，你可能有两个同名员工，并且不希望将一个员工的记录与另一个员工的记录分组在一起。默认标签和默认图像用于
  Power View 的卡片和磁贴类型可视化对象，设置后可提供更美观的格式样式。图 8-17 显示了同一张卡片采用两种不同格式的效果。上方卡片显示了设置默认标签和图像后的格式，下方卡片则显示了未设置时的格式。


  ![9781430264453_Fig08-17.jpg](img/9781430264453_Fig08-17.jpg)


  图 8-17 设置默认标签和图像的效果


  Power Pivot 模型设计器“高级”选项卡上的最后一个可用设置是字段的`Data Category`设置（参见图 8-18）。这对于城市、邮政编码和国家/地区等位置类型尤其重要。当
  Power View 知道某列是位置类型时，它可以使用该字段，借助必应地图图层实现可视化。其他有用的数据类别包括图像和 Web URL。设置这些类别后，Power
  View 将识别它们为超链接并相应地设置其格式。


  ![9781430264453_Fig08-18.jpg](img/9781430264453_Fig08-18.jpg)


  图 8-18 设置字段的数据类别


