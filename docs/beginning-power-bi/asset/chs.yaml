  \ Sales` 表和 `Product` 表之间创建关系。最终的图表应类似于图 3-20。\n\n![9781430264453_Fig03-20.jpg](img/9781430264453_Fig03-20.jpg)\n\
  \n图 3-20。查看数据模型关系\n\n13. 要创建链接表，请将图 3-21 中显示的数据输入到 Excel 的一个空工作表标签中。\n\n![9781430264453_Fig03-21.jpg](img/9781430264453_Fig03-21.jpg)\n\
  \n图 3-21。链接表数据\n\n14. 选择这些单元格，右键单击，然后在快速分析上下文菜单中，选择 `Table` 选项卡并单击 `Table` 按钮（参见图\
