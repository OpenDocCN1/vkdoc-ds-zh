  ### 核能


  二十世纪初，人类在寻找新能源的过程中，另一项重要发现便是核能。核能提供了人类已知的最强大、最集中的能源。从本质上讲，核能是在少量质量转化为纯能量时产生的。尽管爱因斯坦著名的方程
  `E=mc²` 在二十世纪初就确立了质量与能量之间的理论关系，但他未能展示出实际完成这一转化的任何直接机制。要理解这种转化的细节，我们需要回顾一下原子的物理学。


  欧内斯特·卢瑟福、玛丽·居里等科学家的开创性研究，彻底改变了我们对原子的理解。卢瑟福的实验导致了原子核的发现——原子中心一个微小而致密的区域，包含带正电荷的质子和不带电荷的中子。这个原子模型为进一步研究原子过程奠定了基础。另一项关键进展是放射性的发现。在十九世纪末和二十世纪初，亨利·贝克勒尔、玛丽·居里和皮埃尔·居里等科学家研究了某些元素（如铀和镭）发射辐射的现象。他们发现这些放射性物质会自发地发射出亚原子粒子和能量。随着研究人员开始揭开原子核的奥秘，从原子过程中释放能量的想法变得越来越重要。爱因斯坦的方程指明了在这个过程中可能释放的能量大小。另一个突破出现在
  20 世纪 30 年代，当时发现了核裂变。1938 年，奥托·哈恩、弗里茨·斯特拉斯曼、莉泽·迈特纳和奥托·弗里施进行了实验，他们用中子轰击铀原子，观察到了原子核的分裂。这个过程被称为核裂变，释放出巨大的能量，远超过自然发生的放射性衰变。随着核裂变的发现，我们真正开始了对质量能量的利用。恩里科·费米、利奥·西拉德等科学家的进一步研究，促成了
  1942 年 12 月第一次受控核链式反应的发生，这是曼哈顿计划的一部分。这个在受控环境中发生的链式反应，展示了核能作为一种新的、可持续且合法的能源的潜力。裂变产生的热量可用于发电。它比水坝发电等其他成熟能源强大得多，但同时也带来了自身的问题，即放射性废料的处理。利用水和风发电仍然是最清洁的能源形式，不产生有害副产品。


  ### 计算机与机器人


  随着电力成为最易获取的能源，以及水坝、风力涡轮机和核电站成为其生产者，二十世纪见证了以电力和电磁为动力的机器的迅速崛起。首先是白炽灯泡取代了古老的蜡烛，照亮了千家万户；随后电风扇、电暖器和空调设备帮助管理了我们居所的温度。然而，机器技术的真正巅峰出现在二十世纪下半叶，随着计算机的发明而到来。一场名为信息时代的工业革命新纪元开始了。20
  世纪 50 年代，计算机最初是占据整栋大楼的巨型机器，计算能力相当平庸，但很快，随着硅芯片的微型化和微处理器技术的进步，计算机的尺寸变得越来越小，而计算性能却越来越高。很快，所有基于纸张的信息收集和存储系统都被计算机取代了。计算机提供了极其精确可靠且易于访问的基础设施。诸如信息搜索、根据一个或多个标准对信息排序、分类和归档等需要大量人工努力的功能，几乎变得自动化。只需输入几个关键词，点击几次鼠标，结果就会在几秒钟内显示在屏幕上。计算机最初的影响主要体现在需要读写文字处理的领域，但随后一项严重依赖计算机技术的发明改变了这一状况。机器人的发明是一项重大的技术成就，对各个行业和社会各个方面都产生了深远的影响。机器人的历史可以追溯到二十世纪中期，当时能够自主或半自主执行任务的机器这一概念首次成为现实。


  “机器人（robot）”一词由捷克剧作家卡雷尔·恰佩克在其 1920 年的戏剧《罗素姆万能机器人》（*R.U.R.*）中创造，描述了通过制造而成的人造类人生物。然而，现代机器人的概念是在
  20 世纪 50 年代和 60 年代开始形成的。第一台工业机器人，名为“Unimate”，由乔治·德沃尔和约瑟夫·恩格尔伯格在 20 世纪 50 年代末开发。它于
  1961 年被安装在一家通用汽车工厂，用于执行焊接和搬运重型材料等任务。这标志着机器人开始在制造业中使用。同样有趣的是，这台机器人看起来一点也不像人类。它由一个巨大的单臂组件和一个承载所有必要机械和电子元件的大箱子组成。




  ### 机器人的影响


  机器人改变了早期制造业的运作方式。在生产线上使用机器人，使装配、焊接、喷涂和包装等任务的效率、精度和速度得到了数量级的提升。这带来了生产成本的降低、产品质量的提升以及制造复杂产品的能力。在某些行业，机器人已接管重复性、危险性或高强度体力的工作，使人类工人能够专注于工作中更复杂和更具创造性的方面。机器人在医疗保健领域也得到了应用，例如在外科手术中。机器人手术系统使外科医生能够以更高的精度和控制力进行微创手术，从而减少患者创伤并加快康复速度。机器人使人类能够探索那些对人类具有挑战性或危险的环境。像火星车这样的太空探测器为我们提供了对火星表面的宝贵见解，而水下机器人则探索深海环境并为科学研究收集数据。机器人技术也改变了我们过去的耕作方式。农业机器人，通常被称为农用机器人或农业机器人，正被开发用于执行种植、收割和作物监测等所有主要农事任务。这些机器有潜力提高农业效率、减少浪费并解决劳动力短缺问题。机器人还可以帮助残障或有行动不便的人士，改善他们的生活质量。


  随着硅制造工艺的进步，遵循摩尔定律，^(¹⁵)所有计算机乃至机器人基础设施在二十世纪下半叶经历了微型化进程，并在二十一世纪初以更强劲的势头继续发展。计算机的尺寸从占据整层楼的巨型机器，缩小到尺寸不超过几英尺的台式机矩形盒子，再到笔记本电脑这种大号书本的形态，最终缩小到仅有几英寸的手持设备。在尺寸缩小的同时，计算能力却在提升，使得更小的设备变得更加强大，同时运行所需的能量也越来越少。智能手机的发明是二十世纪最后十年左右计算机技术的真正巅峰之作。这款可以放在任何人手中和口袋里的设备，能够拍摄高质量的照片和视频，能够进行全球无线通话，能够收发多媒体电子邮件，能够玩高清
  3D 图形视频游戏，能够执行复杂的神经处理，功能不胜枚举。二十一世纪的智能手机取代了上个世纪的汽车，成为展示所有最新技术的实际载体。它们以光速开启了计算和社交网络的新纪元。


  ## 结论


  人类智能创造了工具，随后是机器，这使我们与其他所有生物区分开来。在过去的几章中，我们看到了这些创新是如何发展进步的，并引领我们走向技术日益复杂化的道路。所有的创新让我们的生活更轻松、更幸福、更安全。它们也带来了自身的缺点，而人类一直在学习如何避免这些缺点。机器增强了人类天生的能力，使其变得超人，但尽管如此，它们仍无法自主运作。在下一章中，我们将探讨人类是如何能够激发机器的主动智能，并将技术提升到新水平的。


