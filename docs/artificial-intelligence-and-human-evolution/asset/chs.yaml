- "# 6. 机器智能\n\n正如我们在上一章所见，机器与人类一起，作为棍棒等初级工具的升级版开始了它们的旅程。它们很快成为人类日常生活中不可或缺的伙伴。它们减少了人类生活中的艰辛，减少了人类生活中危险工作的数量，使人类能够完成仅凭身体无法做到的事情，从而使人类的生活更安全、更轻松、更有收获、更和平，最终也更幸福。然而，这些好处并非没有挑战和伴随的危险。这些机器也可能被人类用来相互对抗，它们帮助创造了以难以想象的规模毁灭人类生命的方式，正如它们在世界大战中的使用所证明的那样。节省劳力的机器也可能创造更多工作；赋予我们更多力量的机器也可能夺走我们的控制权；帮助我们活得更久的机器也可能成为毁灭我们自己的工具。机器实际上在几乎所有可能的方面都创造了人类的极端版本。在之前的章节中，我们看到了机器的出现；在本章中，我们将看到它们是如何获得智能的。\n\
  \n过去数千年间的技术进步使机器获得了越来越强大的能力和技能；然而，当它们独立运行或在相对狭窄的操作范围之外使用时，它们仍然像石头一样愚钝。机器的智能作为一个全新的概念，直到二十世纪末才出现。从那时起，机器智能就一直是我们极其感兴趣和着迷的主题。为了真正理解机器智能的起源，我们将稍作偏离，探讨机器运作的核心是什么。\n\
  \n\n\n## 经典机器\n\n我们以风车为例¹⁶。当风吹动风车的扇叶时，与之相连的转轴开始旋转，带动金属飞轮转动，从而研磨谷物。风越大，转轴转动越快，飞轮旋转也越快，谷物研磨效率就越高。风越小，研磨速度就越慢。而当完全无风时，风车就会静止不动，谷物也无法被研磨。这种运作方式相当直接。但假如有石块误入谷物并卡在飞轮中会发生什么？此时整个风车都会停止运转。解决这个问题有一个非常简便的方法——取出石块，这比整套研磨工序所需耗费的精力要少得多。然而机器自身无法意识到这一点。反过来，如果是一名人类（我们称他为亚当）进行同样的操作，当飞轮被石块卡住时，亚当会迅速察觉、取出石块，然后继续研磨。诚然，亚当的工作速度会慢得多，但即使遇到无法预见的干扰，他也不会停摆。而像风车这般体积与复杂度的机器，只要遇到设计时未被预见的微小干扰，就会彻底宕机。亚当在此过程中究竟做了哪些不同的事情？让我们分解亚当的行为。这里包含三个清晰步骤：（1）第一步，亚当用眼睛观察卡在飞轮中的石块。（2）第二步，亚当停止用手研磨，转而用手取出卡在飞轮中的石块。这些手原本正在转动飞轮，但取出石块的操作截然不同，需要不同的技能组合。（3）第三步，亚当切换手部的技能组合，恢复磨坊的正常运作。这个三步流程蕴含了我们所说的**反馈机制**。人类乃至所有生物物种，自出生以来无时无刻不在通过与环境互动运用这一反馈概念，几乎完全意识不到其复杂性。这种反馈贯穿人类所有感官与反应器官，人类通过眼睛、耳朵或触觉获取反馈，再用手、脚、嘴等器官做出反应，这是与生俱来的本能。然而，机器在这方面远落后于人类。首先，像风车这样的机器没有任何能感知环境的感官部件，通常只由反应部件构成。在过去数千年里，建造能感应环境并做出反应的机器，其难度远超建造更复杂的机器。\n\
  \n### 机械反馈\n\n在制造能对环境做出反应并自我调节的机器领域，首个突破性成就出现在 18 世纪末——工业革命时期的英国，詹姆斯·瓦特制造了他的蒸汽机版本。这不仅是蒸汽机技术的重大改进，更是人类文明的里程碑式飞跃，带领我们进入内置反馈与自我调节机制的智能机器新时代。\n\
  \n其基本构造如图 6-1 所示，蒸汽机将燃烧煤炭产生的热能转化为机械能，为各种机器提供动力，最终驱动交通工具。\n\n![](img/603991_1_En_6_Fig1_HTML.jpg)\n\
  \n包含大轮子及其他机械部件的发动机示意图。\n\n**图 6-1**  \n詹姆斯·瓦特的机械反馈系统蒸汽机\n\n如图所示，左下方的锅炉加热水产生蒸汽，蒸汽在气缸中膨胀推动活塞。活塞的往复运动传递到顶部的曲轴，转化为旋转运动。这种旋转动力被应用于工厂、运输和采矿等领域。然而，加热过程的波动会导致蒸汽生成量变化，使发动机输出变得不可预测。为解决这一问题，瓦特引入了一种称为离心调速器的反馈机制（如图中曲轴正下方位置所示），实现了发动机转速的自动调节。调速器由一个与发动机驱动轴相连的旋转主轴构成，主轴上装着两个配重臂。当调速器运行时，轴的旋转带动调速器主轴转动。配重臂垂直于主轴安装，会根据发动机转速向外或向内移动。转速增加时，离心力使配重臂向外移动；转速降低时，配重臂向内移动。配重臂的运动连接到一个控制发动机节流阀的机构上。节流阀调节蒸汽进入发动机的流量，从而控制功率输出。配重臂与节流阀之间通常通过包含杠杆和拉杆的连杆系统实现连接。以下四个步骤构成了反馈机制：\n\
  \n*   **步骤 1**：当发动机转速超过设定值时，离心力使调速器配重臂向外移动。这一运动通过连杆系统传递至节流阀。\n\n*   **步骤 2**：配重臂向外运动导致节流阀部分或完全关闭。通过减少蒸汽流量，发动机功率输出降低，转速随之减慢。\n\
  \n*   **步骤 3**：反之，若发动机转速低于设定值，配重臂因离心力减小而向内移动。这一向内运动同样传递至节流阀。\n\n*   **步骤 4**：配重臂向内运动使节流阀开启，允许更多蒸汽进入发动机。这增加了功率输出，帮助恢复发动机转速。\n\
  \n\n\n遵循这样一套系统化的方法，离心调速器便提供了一个自动反馈回路，能够根据发动机转速持续调节节流阀。若转速偏离了期望设定值，调速器会通过改变蒸汽流量来做出响应，从而维持相对恒定的速度。离心调速器是瓦特蒸汽机的一项关键创新，因为它提供了一种用于控制发动机转速的自我调节机制。这种反馈机制确保了发动机能够适应负载变化，保持稳定高效的运行，为瓦特蒸汽机在工业革命期间的整体成功和广泛采用做出了贡献。\n\
  \n该反馈机制中所使用的传感器远不如人类现今所拥有的那样先进；然而，这些以离心调速器臂形式存在的原始且纯机械的传感器，却是朝着制造能够响应环境变化并调整自身过程的机器迈出的最初几步之一。\n\
  \n严格来说，瓦特蒸汽机并非最早使用某种反馈形式的机器。在历史上，有一些可以追溯到数千年前的例子，这些机制曾得到应用。大约在公元前 200 年的中国汉代，人们制造了一辆战车，车上有一个使用精密机械齿轮装置的人偶，如图\
  \ 6-2 所示。某种形式的机械反馈系统被用于确保战车上的人偶无论战车如何转弯，始终指向南方。\n\n![](img/603991_1_En_6_Fig2_HTML.jpg)\n\
  \n一幅草图：一辆带有两个大轮子和一个位于中央、连接着一根长杆的齿轮系统的战车。齿轮系统顶部有一个人偶，其右手向外伸出。\n\n**图 6-2**  人偶始终指向南方的中国古战车\n\
  \n另一个著名的例子是古希腊的安提基特拉机械装置。该装置建造于公元前 100 年左右，使用复杂的机械组件进行天文计算和预测。它被用来模拟天体的运动并追踪天文现象。然而，这些都只是相当孤立的例子，为这些装置开发的技术并没有在创造对人类生活产生重大影响的机器方面取得进展。列奥纳多·达·芬奇被认为是有史以来最伟大的科学家、工程师、建筑师和艺术家之一，毫不意外地，他也在创造具有反馈功能的机器方面发挥了作用。他发明了一种改进型水车，该水车利用反馈机制，能够在水流速度变化的情况下保持其旋转速度。这种水车配有一系列铰接的桨叶或水斗，当它们浸入水流时会充满水。随着水斗充满水，其重量增加导致它们向下倾斜。这种运动进而激活了一套杠杆和齿轮系统，调整水车的位置以补偿增加的负载。通过这种方式，该机制调节了水车的速度，并在水流变化的情况下维持了相对恒定的旋转速度。这种机制在原理上与瓦特的蒸汽机非常接近；然而，没有证据表明瓦特复制了达·芬奇的设计。达·芬奇设计的自调节水车是他大量草图和创意集锦的一部分，展现了他发明创造的天赋。然而，没有证据表明自调节水车的具体设计曾实际建造或投入实用。值得注意的是，达·芬奇对工程的贡献以及他超前的设计对后来的发明家和工程师产生了深远影响。尽管他的所有设计并非都在他那个时代得以实现，但它们为后续各个领域的进步和创新提供了灵感。从现代工程学的角度来看，瓦特的实现仍然标志着反馈驱动机器的真正开端。后来，这项技术在二十世纪及二十一世纪绝大多数汽油或柴油动力汽车所使用的内燃机中达到了顶峰。\n\
  \n尽管像瓦特蒸汽机这样的机器确实利用了反馈来改进或自我调整其自身功能，但这一过程在机器构思之时就已预先设定。机器的所有运行模式以及机器可能遇到的所有响应变化都已事先考虑周全，反馈机制的设计就是为了应对这些变化并按期望做出响应。真正重要的是机器创造者的天才智慧，一旦设计得以实现，机器在其整个使用寿命期间都会按预期持续运行。然而，如果机器面临创造者未曾预料到的变化，它仍然会失效。例如，对于瓦特蒸汽机，如果齿轮被污垢堵塞，调速器机制将无法按预期工作，发动机就会失效；或者，如果发动机承受了未曾预料到的过大应力，发动机也仍然会失效。\n\
  \n\n\n为了在机器预定义的效率与人类非凡的适应性之间进行一场关键的对比，让我们深入一个真实场景，其展开方式富有引人入胜的深度。想象一下，一支由真实个体组成的团队被委以一项通常交由发动机完成的任务，这段经历所展现的叙事与人类奋斗的本质产生了共鸣。\n\
  \n在一个坐落于雄伟山脉山麓的宁静村庄里，住着一个以团结和足智多谋而闻名的紧密社区。翠绿的风景和蜿蜒的小路，为一场涉及该村居民的趣味实验提供了背景。认识一下`Jacob`，一位体格健壮、和蔼可亲的男子，以力量和友情著称。他被选为队长，带领一队村民用马车拉着装满必需品的货物前往邻村。通常，这类任务会委托给一台机械化发动机，它拥有无与伦比的原始力量和速度。然而，这一次，村议会提出了一个独特的提议——探索人类适应性的动态。\n\
  \n与`Jacob`同行的是`Emily`，一位年轻活泼、以创新思维闻名的女子；以及`Benjamin`，一位以智慧和韧性著称的长者智者。这三个人，各自代表着人类潜能的不同侧面，怀着兴奋与不确定交织的心情踏上了旅程。出发时，这支三人小队对他们需要覆盖的距离和将要穿越的地形有了基本的了解。他们的旅程在阳光照亮前方道路中开始，投射出一种乐观的气息。然而，自然的变幻莫测正考验着他们的勇气，其方式几乎超出了他们的预料。\n\
  \n行进了几英里后，天气的骤变让他们措手不及。乌云不祥地聚集，暴雨倾盆而下，这是村庄从未见过的景象。曾经坚实的道路变成了危险的泥沼，严重拖慢了他们的进度。在这种出乎意料的困境中，人类团队的原始力量与发动机的威力相比相形见绌，但人类创新的力量却是无与伦比的。在倾盆大雨中，`Emily`的创造性思维迅速行动。她意识到必须迅速适应，便开始扫视周围寻找遮蔽处。她的目光落在一棵巨大的橡树上，它的枝条向外伸展，如同保护伞。在`Benjamin`睿智的认可下，他们蜷缩在坚固的树冠下，躲避风雨。\n\
  \n时间流逝，雨势终于减弱，为三人继续旅程铺平了道路。然而，他们最初规划的路径现在已被泥土和泥浆所掩盖。在这里，合作精神被推到了最前沿。`Jacob`强健的臂膀与`Emily`的战略洞察力以及`Benjamin`不屈不挠的决心协同运作，引导他们在改变后的地形中前行。怀着坚定不移的精神，团队继续前进。他们的谈话充满了笑声、故事和共享的智慧，建立了一种超越所遇挑战的纽带。尽管变幻莫测的天气造成了挫折，但他们集体的韧性闪耀着光芒。虽然他们比预期稍晚到达目的地，但他们成就的意义是不可否认的。观察他们旅程的村民们不仅惊叹于他们带来的补给，更惊叹于他们所体现的不可战胜的人类精神。`Jacob`、`Emily`和`Benjamin`的旅程成了一个代代相传的故事，见证了人类多元化的本质。\n\
  \n在常规和可预见天气的条件下，一辆蒸汽动力火车本可以比人类三人小队更高效地完成这段旅程，但当事态超出可预测的范围并恶化时，机器便相形见绌了。这个故事提醒我们，虽然机器拥有卓越的效率和力量，但它们缺乏人类在未知面前进行适应、合作和创新的独特能力。\n\
  \n那么，是什么让人类群体优于设计精良的机器呢？那就是通过跨模态交互进行持续学习的过程！在深入探讨跨模态或多模态交互的概念之前，让我们先关注学习的各个方面。学习是一个基本过程，人类通过它获取知识、技能、行为或态度，从而在行为或心理过程上产生持久的变化。它是一个复杂而多方面的现象，贯穿我们的一生，使我们能够适应环境、解决问题并提高对世界的理解。学习可以通过多种机制和在不同情境中发生。\n\
  \n\n\n## 学习的概念\n\n尽管学习的范畴相当复杂，但其赖以建立的基本前提却十分简单。让我们用直接且简便的方法来定义学习过程。首先需要建立几个要素。第一个要素是试图学习的实体，第二个要素是该实体周围的一切，我们称之为环境。这个试图学习的实体必须能够执行六项操作：（1）产生行动的能力；（2）感知环境反馈的能力；（3）利用某种形式的关联记忆来记住行动与反馈的能力；（4）拥有需要实现的目标或指标的能力；（5）将感知到的环境反馈与目标进行比较的能力；（6）利用目标与实际行动反馈之间的差异来指导行动改进的能力。\n\
  \n基于这样的设定，让我们来看学习过程中的具体步骤：\n\n1. 实体产生一个行动。这个行动对环境产生一定影响。\n2. 环境对此作出反馈，实体感知到这一反馈。\n\
  3. 实体随后根据其试图实现的目标，将反馈归类为积极、消极或中性。它甚至可能为反馈生成一个与优劣程度相关的数值，以便在积极和消极反馈中进行排序。\n4. 实体将步骤\
  \ 1 至 3 这一系列事件存入记忆。\n5. 然后，实体利用其记忆以及感知到的反馈与目标之间的差异，生成一个更有可能成功实现目标的改进行动。\n6. 重复步骤\
  \ 2 至 5，直至目标达成。\n\n这些步骤可能让人联想到本章前文讨论过的反馈机制概念。反馈机制确实始于这一序列中的前两个步骤，但随后缺乏涉及记忆、比较、反馈排序以及生成新行动的步骤\
  \ 3 至 6。取而代之的是，它只会针对感知到的环境反馈，以预定义的行动作出响应。此外，在采用反馈的机器中，反馈机制是由机器创建者根据对环境反馈变化的预判而明确设计的。而学习机制并不做这样的假设。环境反馈无需事先知晓，并且随着每次新行动和新反馈的出现，学习实体的记忆也在不断更新。\n\
  \n大多数生物从出生起就在经历某种形式的学习过程。每个步骤中所用器官的复杂程度和先进性，决定了不同生物在技能习得和智力水平上的高低差异。这种学习方式也被称为实时学习、在线学习或持续学习。对于所有生物物种而言，这是唯一可行的学习方式。对我们来说，学习过程几乎就像呼吸空气和消化食物一样自然，我们甚至意识不到它在清醒生命的每一刻都在发生。\n\
  \n### 多模态学习\n\n这里涉及的另一个重要概念是：感知到的反馈如何与引起它的行动协同处理。我们的身体中有许多能产生行动的不同部位，以及如前面章节所述的五种感官器官。人类大脑在将耳朵和眼睛等感官器官接收到的反馈，与通过手脚等行动生成器官产生的行动相连接方面，效率极高。更深入地看，手脚产生的行动本质上是机械性的，会导致环境中的物理运动或位置变化；而从眼睛和耳朵接收到的信号则本质上是光学和听觉性的。这是两种截然不同的交互类型或模式，将它们以有意义的方式融合起来绝非易事，而是一项极其困难的任务。为了说明这一过程中的挑战，我们将其与瓦特设计的蒸汽机调速器进行比较。在这种设计中，调速器的行动是机械性的，并作为对发动机转速机械反馈的响应。没有任何摄像头监控运行，也没有任何麦克风监听发动机的声音。我们之前看到的所有其他反馈机械也是如此，从古代中国的战车到达芬奇设计的自调节水车，直至内燃机。能够结合两种不同类型媒介反馈与行动的机器，属于完全不同的层级。将来自不同模式的两种交互结合起来的关键缺失环节，是存在一个中间媒介，所有其他模式的信息都可以在其中被转换或映射。所有生物体内的大脑通过神经系统实现了这一点。神经系统的一部分将所有行动和感官信息转换为电信号。所有行动生成器官和感觉器官通过一个庞大的神经网络与大脑相连，在普通人体中，这种网络的总长度可达\
  \ 45 英里！有了这个神经系统，所有到达大脑的信息现在都以电信号的形式存在。大脑随后能够以流水线方式共同处理这些信息，而这些信息实际上可能源自机械动作、视觉图像、触觉、声音、味觉等。人类在数千年间不断改进机械反馈装置的设计，但多模态学习的成就却迟迟未能实现。直到\
  \ 20 世纪，人类掌握了电磁学概念并发明了计算机之后，才在技术条件上达到与模拟有机体或人类学习相匹配的水平。\n\n\n\n在学习过程中，我们先前有意忽略了一个重要方面，以使理解更加容易。但现在我们可以来审视它。值得注意的是，定义中所考虑的学习实体并非总是预先编程来执行明确定义的动作，而是一个通用实体（我们也可称之为通用机器），它配备了一些能产生动作的配件。例如，一只可以在一定角度范围内移动的`arm`（臂），或一个可以以一定速度范围向特定方向移动的`wheel`（轮子），或一个可以燃烧燃料产生旋转的`engine`（引擎）。但无论哪种情况，机器的预期功能都没有被定义。`arm`可以用于在建筑中推动方块，也可以用于握持另一工具来砍树。`wheel`可以用于驱动马车，也可以用于制作陶罐。即使`engine`的功能更为固定，驱动它的动力也可以被控制和操纵，并用于各种应用，例如将一列大火车从一个位置移动到另一个位置，或让电梯上下移动。在每种情况下，通用机器的操作都可能显著不同。这些机器在制造时，这些应用都未知。为了促进多模态学习，这些机器随后配备了一组传感器，并使用前面概述的标准学习步骤进行训练。\n\
  \n在如此开放的开端下，机器最初如何产生新动作？显而易见的答案是随机生成！然而，即使我们在生成随机数，也需要知道可接受数字的范围。换句话说，我们需要知道随机生成数字的下限和上限。在给定的情况下，这由通用机器的局限性提供。例如，考虑`arm`的例子。它可能对其可旋转的最大和最小角度，或移动时可施加的力有局限性。因此，利用对机器局限性的了解，它可以在其有形范围内开始随机产生动作。然后，假设我们为这个`arm`配备了一个作为视觉传感器的摄像头来模拟多模态，如图\
  \ 6-3 所示。\n\n![](img/603991_1_En_6_Fig3_HTML.jpg)\n\n一个机械臂的草图，其底座上连接了一个 4K 摄像头。\n\
  \n图 6-3\n\n带有视觉传感器（摄像头形式）的机械臂\n\n摄像头可以观察`arm`的运动。在`arm`组件上有一个中央处理单元，我们可以称之为机器的大脑。大脑正在以电信号的形式生成这些动作，同时从摄像头接收电信号作为感官信息。这种设置处理了学习过程概述的前两步。接下来的步骤需要由机器的大脑来处理。首先，我们需要定义一个目标。假设目标是将放置在`arm`前方的物体向左移动一英尺。系统的大脑能够感知来自摄像头的信息，并将其与这一目标进行比较，生成一个标签，形式为`good`（好）、`bad`（坏）或`neutral`（中性）。例如，如果`arm`将方块移向正确方向，它会生成一个正向标签；如果它试图将其移向相反方向，会生成负向标签；如果它完全不移动或沿垂直方向移动，会生成中性标签。它甚至可以更进一步，根据结果的好坏程度生成一个数值。现在，在线学习范式中的所有六个步骤都已就绪，我们拥有了一台准备好开始学习的通用机器。\n\
  \n大脑可以开始在自身限制内随机产生`arm`的运动，并根据摄像头输入捕获标签。这个过程也称为探索，其中系统只是在探索动作空间。如果相同过程持续很长时间，比如一周，大脑将在其记忆中记录大量带标签的动作，但`arm`的操作不会有任何改善。现在，为了改善`arm`的操作并更接近将物体向左移动一英尺的预期目标，我们需要引入利用的概念。我们的大脑在记录带标签的动作时会交替进行探索和利用。探索意味着在不使用任何已记录记忆的情况下生成随机动作，而利用意味着创建它已知能产生良好或正向标签或反馈的动作。当机器首次启动时，记忆几乎是空的，没有什么可以利用。然而，随着它持续探索更多，记忆开始获得一些与正向反馈或标签相关的动作。然后，它可以开始利用这些预先记录的动作，并可能尝试对其稍作调整，以观察反馈是变好还是变差。在此种操作持续足够长的时间后，`arm`将非常接近将物体向左移动一英尺的预期目标。随着机器获得越来越多的正向样本，它可以逐渐切换到仅使用利用阶段，因为不再需要探索随机动作。我们用于训练机器的目标相当简单，动作空间也非常小，因此这样的系统可以相当快地收敛到期望目标。然而，在现实生活中，目标可能非常复杂，动作空间也极其广阔，这使得学习变得缓慢。探索和利用各有其优点和缺点。没有探索，机器无法找到新动作，从根本上无法学习。然而，没有利用，它就无法以确定性的方式产生期望的动作。因此，在这两种操作之间保持微妙的平衡至关重要。这些操作在我们的生活中也相当相关。我们在童年时期处于强烈的探索阶段，如饥似渴地学习；然而，我们也极其不可预测。但随着年龄增长，我们开始收敛于所学的东西，并越来越倾向于使用利用阶段。过分强调利用也会使我们变得僵化，从根本上阻止任何进一步的成长。诸如苏格拉底、柏拉图、亚里士多德、孔子，甚至佛陀等伟大的哲学家和宗教领袖，早在古代就已意识到这个概念（尽管更多是从哲学角度而非机器学习角度）。源于他们的教诲和名言，如“终生保持学生心态”、“学无止境”或“质疑一切”，本质上是在要求读者和追随者即使在你觉得可以安于只利用已学知识时，也要继续探索。总会有新事物可以找到，使你的生活更加充实。\n\
  \n\n\n在现代机器学习的背景下，探索与利用的概念构成了强化学习范式的基础。强化学习与深度学习相结合，已被证明是一种极其强大的工具，推动了机器人技术、金融预测、游戏、医疗保健等众多领域的发展。开创性的\
  \ ChatGPT 技术也使用强化学习来生成既连贯又信息丰富的文本。然而，对于机器而言，强化学习并非唯一可用的工具。还可以利用其他类型的学习范式，这些范式本质上是离线的，被称为批量学习。\n\
  \n在批量学习中，包含多种动作及其对应响应的标记数据会预先收集成训练集，并一次性馈入学习算法，从而将在线学习中的第 1-2 步重复数千次。然后，算法针对训练数据中的所有样本，执行前面描述的第\
  \ 3-4 步，完成学习过程。在此学习过程（也称为训练过程）结束时，算法创建了我们所谓的训练模型。这个模型现在可以在现实世界中运行，它能够产生有助于实现预期目标的动作。\n\
  \n让我们看一个例子来说明批量学习的概念。我们想构建一个能够识别已知个体人脸的人脸检测系统。已知个体可能成千上万，甚至数百万。我们已经收集了这些人脸从多个角度拍摄的照片作为训练数据。普通人类大约能记住\
  \ 5000 张面孔。这个数字会因年龄、记忆容量、接触人群的多少等因素而变化。但这大致给出了一个范围。我们不会期望一个人能记住比如 10 万张面孔。然而，我们可以使用前面概述的步骤，利用包含一百万人照片的训练数据来训练一个机器学习算法。一旦训练完成，我们有了一个训练好的模型，只要人物的照片具有足够的分辨率和清晰度，它就能以高达\
  \ 99% ^(¹⁷) 甚至更高的准确率开始识别面孔。有多种因素会使这项任务更具挑战性，例如如果此人戴着太阳镜、帽子，或者蓄了胡须、剃了光头等。光线和阴影也会增加任务的难度。然而，即使考虑了所有现实中的限制，这类算法也能表现得极其出色，以至于在刑事和司法程序中被视为决定性工具。当然，算法需要辅以必要的计算硬件，如强大的处理器和大量内存，但机器有能力在短短几个小时内，在这样定义明确的任务上超越人类。\n\
  \n到目前为止描述的例子展示了机器学习如何执行的高级概览。在本章的下一节中，我们将介绍一些用于训练机器使其变得智能的领先技术。\n\n## 机器学习\n\n机器学习这一主题涵盖了构建能够基于训练数据进行学习的智能系统过程中，所有数学、统计学和计算机科学的发展成果。该领域研究的所有技术都至少涉及两个操作阶段：训练以及测试或应用。这些技术的应用范围非常广泛，并且当然不限于计算机科学。通常，这个领域被认为是非常技术性和抽象的。这种说法部分正确，但大多数使机器能够学习的技术都可以纯粹作为概念来解释，而这正是我们在这里要做的。我们将完全避开理论中的数学部分，而着眼于那些让机器通过像人类一样学习从而变得智能的概念。\n\
  \n### 线性回归\n\n线性回归是机器学习理论中最简单的技术之一。如图 6-4 所示，样本的分布方式如图所示。X 轴代表模型的输入，Y 轴代表模型准备好后要预测的值。这些样本可以表示广告支出相对于业务收入的分布，或者汽车燃油消耗相对于其速度的分布。\n\
  \n![](img/603991_1_En_6_Fig4_HTML.jpg)\n\n一张散点图，标题为带有噪声数据点的线性回归，展示了 Y 轴标签与 X 轴标签的关系。它绘制了输入数据点的集中趋势，这些点在回归线上方、线上和下方呈递增趋势。\n\
  \n图 6-4\n\n用于拟合一组输入数据的线性回归示例\n\n这些关系通常遵循线性趋势，红线通过一条直线近似了这些实体之间的趋势。需要注意的是，并非所有样本都恰好落在直线上，这意味着预测中会存在一些误差。但只要误差在可接受的范围内，该模型就被认为是良好的。当\
  \ X 轴上的值增加时，Y 轴上的值也倾向于增加——这种关系的本质被这条直线所捕捉。在所有的机器学习应用中，误差总是存在的，零误差的情况极为罕见。更确切地说，当观察到零误差时，可能表明某些地方出现了严重问题。在训练模型时，需要控制的是误差的余量。\n\
  \n所有的机器学习过程都需要两组数据：训练数据和测试数据。训练数据包含成对的输入以及相应的输出或标签。在前述例子的上下文中，每个训练数据将包含成对的值，例如速度作为输入，燃油消耗作为输出；或者广告支出作为输入，收入作为输出，等等。测试数据则只包含输入，例如速度和广告支出，利用线性回归预测出的直线，我们可以预测每种情况下的输出，即燃油消耗或收入。\n\
  \n机器学习技术（也称为算法）是一系列数学运算步骤。这些步骤首先对带有标签的训练数据进行运算，以学习输入与输出/标签之间的关系模式，然后对测试数据进行运算以预测输出。然而，在大多数现实情况下，关系是非线性的，因此线性回归算法可能误差很大，但它有助于理解学习的过程。\n\
  \n\n\n### 决策树\n\n机器学习中历史最悠久且应用最广泛的技术之一便是决策树。该技术与线性回归有着本质区别，它采用更接近人类决策的方式，更适合于将给定对象分类到一组标签中，而非预测趋势的问题。它通过构建一个树状决策结构来工作，可用于预测目标变量的值或类型。\n\
  \n决策树的构建从根节点开始，根节点代表整个带标签的训练数据集。我们以水果分类为例来说明这一概念。在这种情况下，根节点代表所有水果。随后，通过提出一个问题，根节点被分割成多个子节点。这里，我们可以问：“水果是什么颜色？”这个问题的答案将创建一个对应所有颜色的子节点列表，并且所有水果会被划分到这些子节点中。每个水果只能属于一个节点。然后，每个子节点可以通过询问关于它们大小、形状、纹理等问题，进一步分割成更多的子节点。每当我们提出一个新问题，决策树的深度就会增加。我们需要根据需要尽可能深地探索，直到最终达到一个阶段：在该深度下，所有子节点恰好只包含一种水果。这一深度的子节点被称为叶节点。一旦达到这个阶段，训练就完成了。\n\
  \n现在，我们可以通过提出一系列问题来遍历这棵树，并识别出数据库中的所有水果。需要注意，通向识别水果的树中所有路径长度可能并不相同。这个解释是决策树最简单的应用之一。在更复杂和数值化的问题中，分割过程基于一种不纯度度量（称为基尼指数），它衡量特定节点中数据的异质性或不相似程度。分割过程的目标是创建尽可能同质或彼此相似的子节点。这是通过选择能够最小化子节点不纯度的分割属性来实现的。决策树构建完成后，可以通过从根节点遍历到叶节点来进行预测。最终到达的叶节点将包含目标变量的预测值。\n\
  \n再考虑一个流行的鸢尾花分类问题作为例子。鸢尾花有三种：Setosa、Versicolor 和 Virginica。在实验中，我们测量了每种花的四个属性：花瓣长度、花瓣宽度、萼片长度和萼片宽度。使用这些测量值构建的决策树模型如图\
  \ 6-5 所示。注意，树在不同分支上的深度不同，但所有分支都终止于包含单一分类类别的叶节点。在每个区块的顶部，我们可以看到用于将数据分成两组的决策规则。第二个数值显示每个桶中的样本数量。第三个数值以有序列表的形式给出该桶中每个类别的样本数量，格式为\
  \ `[Setosa 样本数, Versicolor 样本数, Virginica 样本数]`。第四个数值给出类别标签。非叶节点中的类别标签可以忽略。从决策树来看，仅根据花瓣宽度就能很容易地分离出\
  \ Setosa，但 Versicolor 和 Virginica 在属性上存在大量重叠。此外，你可以注意到“萼片宽度”值在分类中完全没有被使用，因为它们可能不具有足够的区分特性。\n\
  \n![](img/603991_1_En_6_Fig5_HTML.jpg)\n\n一个决策树图包含一个显示花瓣宽度、样本数、数值和类别数据的区块，该区块进一步按花瓣宽度、花瓣长度以及\
  \ Versicolor 和 Virginica 的萼片长度划分。这些数据又通过不同的数值（真）进一步划分为 Setosa、Versicolor 和 Virginica。\n\
  \n**图 6-5** – 三种花卉（Setosa、Versicolor 和 Virginica）的决策树分类\n\n决策树模型相对易于理解和解释，这使得它们成为可解释性至关重要任务的不错选择。它们训练起来也相对高效，因此非常适合处理大型数据集。然而，决策树模型可能对过拟合敏感，这意味着当数据包含噪声（不准确的标签）时，它们可能会变得过于复杂。一旦我们学习了所有不同的机器学习模型，就必须针对特定问题做出明智的模型选择，因为并没有硬性规定哪种模型在特定情况下效果更好。\n\
  \n### K-近邻算法\n\n另一个简单机器学习算法的例子是“k-近邻算法”，即 `k-NN`。该算法类似于通过询问 `k` 个朋友的意见来做决定。顾名思义，我们需要为每个模型定义\
  \ `k` 的值。假设我们将 `k` 定义为 5，问题是估算房地产的价值。作为训练数据的一部分，我们收集了某个区域内几百套房子的价值。当我们想用这些数据来预测不在训练集中的新房子的价值时，我们遵循以下步骤：(1)\
  \ 首先，我们找出目标房屋的不同属性，例如房间数量、面积、建造年份等。(2) 然后，我们根据这些属性，在训练数据中找到与目标房屋最相似的 5 套房子。这 5 套房子被称为\
  \ 5 个近邻。(3) 最后，我们通过对上一步识别出的 5 个近邻的价值取平均值，来估算目标房屋的价值。这正是房地产经纪人用来评估房产价值的过程。银行在批准贷款前会使用这些信息。它们都在使用一种经典的机器学习算法——`k`\
  \ 近邻（`k-NN`）。\n\n\n\n### 人工神经网络\n\n另一种早期被发明但因复杂性而未取得足够成功的机器学习模型，被称为人工神经网络（ANN）或简称为神经网络（NN）。顾名思义，这种机器学习技术源于人脑的工作方式。图\
  \ 6-6 展示了一个神经网络系统的简单示意图。\n\n![](img/603991_1_En_6_Fig6_HTML.jpg)\n\n该网络图将 `X1` 到\
  \ `Xn` 的输入层，与三组权重层（`W1` 到 `Wn1`、`W1` 到 `Wn2`、`W1` 到 `Wn3`）连接，并通过 sigma 函数得到输出 `y`。\n\
  \n**图 6-6** *神经网络示意图*\n\n就像人脑通过所有感觉器官接收电信号形式的输入一样，计算机神经网络以数据形式（在计算机芯片内以电信号形式传输）接收其输入（`x[1]`、`x[2]`、…、`x[n]`）。图中的每个圆圈代表一个数字版本的神经元，每个垂直的神经元组代表神经网络中的一个层。每个神经元会聚合输入给它的信号，然后对聚合结果应用激活函数。激活函数将输入集合中的值映射到输出集合中的值^((18))。所有神经元的映射过程相似，但在每个神经元中，通过为每个输入赋予不同的重要性或权重，聚合过程会有所不同。因此，即使所有神经元接收相同的输入，它们的输出也不同。神经网络中每个层的每个神经元持续处理输入并生成输出。在最后阶段，前一层的所有输出被聚合以生成最终输出，该输出可以表现为行动或预测的形式。这个过程称为神经网络的前馈操作，其中信号持续向前流动，最终将所有感官信息转化为行动的产生。行动产生后，会与根据神经网络期望行为预设的预期结果进行比较。生成行动与预期结果之间的差异被称为误差。现在，我们需要改进神经网络的功能以某种方式减少这个误差，理想情况下收敛到零误差。为了实现这一点，神经网络中使用了反馈操作。在反馈操作中，来自输出层的误差被依次反馈到前一层。在这一步中，不是向后方向生成输出，而是调整每个神经元在聚合输入时给出的权重，使它们能在前向方向上更好地生成行动。该过程从最终层一直持续到输入层。调整网络中所有神经元的权重后，重复前向操作。通常，经过此类调整后，误差会减小。然后将这个新的、更小的误差再次向后反馈，以调整每个神经元的聚合权重，进一步减少误差。重复这个前向和后向操作的序列，直到达到所需的性能水平。一旦神经网络被训练到能产生所需的性能水平，就可以停止反馈操作，仅使用前馈操作来生成行动。然而，在生物体的大脑内部，反馈操作永远不会停止，因为环境条件总是在变化，生物体需要在其整个生命周期中不断适应这些变化的条件。\n\
  \n刚刚概述的过程代表了任何基于生物以及计算机的学习系统中所使用的最基本的逻辑步骤。每个逻辑步骤都被转化为数学形式，然后使用 `python` 或其他合适的编程语言来实现。一个典型用于图像分类或语言处理的神经网络，可能需要从几百到几千乃至数百万个神经元。因此，这涉及非常高的计算量，并且需要强大的硬件才能成功实现基于神经网络的系统。神经网络的大小取决于需要解决问题的复杂性。越复杂的问题通常需要更复杂的神经网络。\n\
  \n\n\n### 深度神经网络\n\n这种神经网络架构已经使用了 70 多年。然而，自 20 世纪 50 年代末被发现以来，它经历了多次迭代和修订。从网络的规模和复杂程度可以看出，要成功实现这样一个网络，需要非常强大的计算机硬件。在神经网络发现的早期，硬件严重滞后，该架构无法充分发挥其潜力。到了\
  \ 20 世纪 90 年代，人们提出了各种不同的算法，如决策树、支持向量机等，它们在解决类似问题时比神经网络快几个数量级，且准确率更高。所有这些算法都是针对特定目标设计的，并且在有限的计算机硬件条件下进行了高度优化以解决这些问题。结果，神经网络在该领域失去了\
  \ popularity。然而，随着计算机硬件按照摩尔定律变得越来越强大，到了 21 世纪初，它已接近实现神经网络的全部潜力。为了辅助计算机中的中央处理器（CPU），图形处理器（GPU）也被重新编程以辅助这种计算，将最先进的技术水平提升到一个新的层次。结果，神经网络开始重新流行起来，并成为机器学习系统武器库中的顶级竞争者。随着系统复杂性的增加，它们现在被称为深度神经网络或简称为深度网络。然而，从根本上讲，它们都具有如前所述的类似架构和训练机制。为了应对\
  \ 21 世纪更具挑战性的问题，原始结构进行了一些修改，增加了具有不同类型处理元素的层。其中两种架构最为常用。一种称为卷积神经网络（CNN），另一种称为循环神经网络（RNN）。\n\
  \nCNN 在网络中包含一个或多个卷积运算层。卷积是一种通常用于信号或图像处理的数学运算。它涉及将一个小矩阵（称为核或滤波器）应用于输入图像或数据，以提取特定特征。想象你有一个由像素组成的网格状图像，每个像素代表一个颜色或强度值。卷积运算涉及将一个小矩阵（通常是\
  \ 3x3 或更大），即核，滑过这个图像。在每一步，核被放置在图像的一个小区域上，通常从左上角开始。核的值与区域中对应的像素值逐元素相乘。然后将这些相乘后的值求和。这个求和的结果被放置在一个新的网格中，通常称为特征图或输出图，它代表了原始图像的变换版本。然后，核被移动到下一个区域，重复这个过程，直到覆盖整个图像。此操作的目的是检测和强调图像中存在的某些模式或特征。可以使用不同的核来突出显示图像中的特定特征，如边缘、角点或纹理。卷积运算在图像识别任务中特别有用，因为它们允许网络专注于相关的局部特征，同时保留空间关系。通过重复应用不同核的卷积，深度神经网络可以学习识别图像中的复杂模式和对象。\n\
  \n另一方面，RNN 采用不同的方法来修改结构。在 RNN 中，输入数据被假定为序列数据，例如时间序列、语音或文本。与原始神经网络仅在正向方向（训练期间除外）处理数据的前馈操作不同，RNN\
  \ 的节点之间具有连接，即使在预测阶段也允许信息循环流动（即向前和向后），从而使它们能够保留并利用序列中先前步骤的信息。想象你有一个需要逐词分析的句子。在前馈神经网络中，每个词会被独立处理，但在\
  \ RNN 中，先前词的信息也会作为上下文被考虑进来。在序列的每一步，RNN 接收一个输入（比如一个词），并将其与一个隐藏状态（充当网络的记忆）一起处理。隐藏状态包含来自先前步骤的信息。RNN\
  \ 计算两样东西：一个输出和一个更新的隐藏状态。输出代表网络基于当前输入和先前隐藏状态的预测或解释。隐藏状态通过整合当前输入和先前隐藏状态的信息进行更新，从而使网络能够跨不同时间步保留信息。这个更新隐藏状态和生成输出的过程对于序列的每一步都会重复，从而允许\
  \ RNN 捕捉数据中随时间变化的依赖关系和模式。RNN 背后的关键思想是，它可以学会利用其记忆来理解上下文，并基于数据的序列性质进行预测。例如，在语言任务中，RNN\
  \ 可以考虑先前词的上下文来预测句子中的下一个词。需要注意的是，虽然 RNN 可以有效地处理序列数据，但它们在捕捉长期依赖关系方面可能面临技术挑战。^(¹⁹)\
  \ 为了解决这个问题，RNN 的变体，如长短期记忆网络（LSTM）和门控循环单元（GRU），已经被开发出来，它们具有专门的机制来更好地处理长程依赖关系。然而，RNN\
  \ 理论中最大的改进是以 Transformer 的形式提出的。\n\nTransformer 在 RNN 架构中引入了自注意力机制这一新概念。该机制允许模型在做出预测时权衡输入序列不同部分的重要性。这种架构超越了仅使用\
  \ RNN 中相邻的隐藏词或词元，能够识别整个句子中最有影响力的词或词元。这使得模型能够捕捉句子中所有词元之间的关系，无论它们的位置如何。为了说明其影响，让我们考虑句子中主语和谓语的语法概念。根据主语和谓语的数量以及它们在句子中的相对位置，有许多不同类型的句子，如简单句、并列句、复合句等等。一个简单的\
  \ RNN 可能无法解析所有这些细微差别，但 Transformer 不受此类限制，可以使模型学习任何扔给它的结构。然而，它们需要大量的训练数据才能区分所有不同的类型。Transformer\
  \ 的另一个巨大优势是其并行处理能力。当模型在给定的序列句子中搜索所有可能的关系时，这些搜索可以并行运行，这与仅以顺序方式学习的 RNN 不同。并行处理能力使得基于\
  \ Transformer 的模型更具吸引力，因为所有更新的基于 GPU 的高性能计算（HPC）硬件将这些模型的训练速度提高了几个数量级。\n\n\n\n###\
  \ 生成式模型\n\n目前为止我们见到的大多数机器学习算法，主要都用于根据输入数据进行预测或估算。它们更多是推理生成模型，输出的是分类标签或数值量，用于推断输入数据。然而，机器学习算法也可以反向运用，根据给定的标签生成数据。这类模型被称为生成式模型。尽管生成式模型的概念因\
  \ ChatGPT 的问世而备受瞩目，但这些模型的研究已有数十年历史。马尔可夫模型，特别是隐马尔可夫模型，是最早的生成式 AI 模型之一。它们被用于根据预定义的概率模式创建数字序列。从计算机的角度来看，一切都可以用数字形式表示，因此这些模型也可用于生成文本、语音甚至音乐。当神经网络以编码器-解码器配对的形式使用时，也可以作为生成式模型。这类模型包含一组编码器，能够将输入模式编码成一种被称为嵌入向量的抽象数字形式。这些嵌入向量可被视为网络学习到的抽象内容。随后，解码器部分执行反向操作，从嵌入向量中重新生成输入模式。我们来举一个简单的例子来说明编码器-解码器的行为。当我们听任何歌曲时，我们的耳朵会将声音模式转换成电信号并发送到大脑。大脑中的神经元感知到这些信号并创建它们自己的编码。这就是我们大脑中持续进行的抽象过程。然后这些编码被存储到我们的记忆中。当我们听到一首以前听过的歌曲时，大脑中当前的编码器输出会与之前存储的编码相匹配，并基于我们喜欢还是讨厌这种音乐类型产生一个强烈的正面或负面信号。现在，当我们在脑海中跟着歌曲哼唱并尝试自己唱出来时，我们就是在尝试解码我们听到的内容。我们大脑中的解码器部分与声道和嘴巴相连（而非耳朵），但解码器与编码器紧密协作，因为我们在聆听自己尝试模仿的声音，并判断自己唱得好不好。需要注意的是，解码器并非编码器的自动逆过程，因为我们无法精确重现听到的一切，并且需要经过陡峭的学习曲线，才能使解码器产生的声音与记忆中通过编码器输出所听到的内容相匹配。这就是为什么需要投入一生的时间和专注练习，才能完美演奏各种乐器，或者以完美的频率和音调唱歌。然而，对机器而言，在几乎无限资源的支持下，学习可以以惊人的速度发生，编码器-解码器操作可以在几分钟或几小时内学会产生完美的逆过程。因此，机器要复制它们听到或感知到的东西非常容易，但创造全新、优秀且富有类人特色的内容则要困难得多。\n\
  \n编码器-解码器架构通过生成对抗网络（GANs）得到了进一步的改进。GANs 包含两个独立的神经网络：一个以生成模式运作，创建信息序列；另一个网络扮演鉴别器的角色，将第一个网络的输出与真实世界数据进行比较，并输出差异。这些差异随后被反馈给第一个网络，使其学会生成接近真实世界的数据。这两个网络持续协作（也称为相互竞争）以减少误差，从而生成超逼真的数据。\n\
  \n尽管 ChatGPT 是首个被广泛使用的语言生成模型，但机器生成语言模型的历史可以追溯到 20 世纪 60 年代，当时麻省理工学院创建了一个名为 Eliza\
  \ 的简单模型，它通过简单的匹配和替换技术模拟对话。随后在 20 世纪 90 年代，一个名为 ALICE 的 Eliza 改进版被创造出来。ALICE 是一个基于规则的聊天机器人，它使用预定义的模式和规则库来生成自然语言回复。ALICE\
  \ 真正确立了自己作为现代聊天机器人主要先驱的地位。然后在 2020 年左右，OpenAI 推出了第一代 GPT（生成式预训练变换器）模型，剩下的就是历史了。这些新型变换器模型也被称为大语言模型，它们经过数十亿条在线资源的训练，涵盖了整个维基百科以及更多内容。同样重要的是，它们是预训练模型，在与人类交互时并不会主动学习。为了对其运作规模有所了解，让我们看看它们所用参数数量的演变过程。2018\
  \ 年推出的第一个 GPT 模型包含约 1.17 亿个参数，真正展示了大规模变换器模型在语言生成任务中的有效性。第二个模型 GPT-2 于 2019 年左右问世，拥有超过\
  \ 15 亿个参数，较第一版有了显著改进，使 OpenAI 稳居生成式 AI 技术的前沿。第三个版本 GPT-3 于 2020 年问世，拥有惊人的 1750 亿个参数，性能实现了又一次巨大飞跃，也是支撑\
  \ ChatGPT 的核心模型。ChatGPT 是 GPT-3（严格来说是 GPT-3.5）的一个精简版本，向公众开放使用。GPT 的第四个版本大约在 2023\
  \ 年发布，拥有超乎想象的 170 万亿参数。GPT-4 在更大的训练数据上进行训练，使其预测更加准确。新的架构更高效、更具可扩展性，尽管体积更大，但在生成文本方面更具成本效益。它还被证明能够生成更具创造性的文本格式，如诗歌、代码、脚本、音乐片段、电子邮件和信件。它能以更高的准确度进行语言间翻译，能更高效地编写代码，等等。\n\
  \n所有这些 GPT 模型，尽管展示了 AI 颠覆性的能力，但仍局限于文本。而在 2020 年代左右发布了一系列全新的模型，例如 DALL-E2、Midjourney\
  \ 等，它们可以根据输入的提示词生成图像。下面是一个使用提示词“Elephant wearing superman clothes and riding a bicycle\
  \ along an ocean in rain”创建的示例图像，如图 6-7 所示：\n\n![](img/603991_1_En_6_Fig7_HTML.jpg)\n\
  \n一只大象戴着披风和帽子，在雨中沿着海岸骑着自行车的插图。\n\n图 6-7  \n穿着超人服装、在海边雨中骑自行车的大象\n\n这显示了技术在理解提示词含义并将其完美地转化为真实画面方面取得了多大的进步。这确实是编码器-解码器共舞的巅峰之作。这些模型使用了一种名为\
  \ Stable Diffusion 的新技术，它基于 GANs 的概念，而非 GPT 中使用的变换器架构。\n\n\n\n## 结论\n\n随着当今机器学习技术的进步，地平线近在咫尺。每一天都有新的应用被解锁。你想为特定场景创作一段音乐？没问题！你想设计一座桥梁，使其承载特定重量，并用能抵御特定环境条件的材料建造？办得到！你想把计算机代码从一种语言转换成另一种语言？遵命，先生！你想验证\
  \ 3D 打印某件物品时的某些假设是否成立？尽管问吧！\n\n在接下来的几章中，我们将探讨借助这项技术我们能走多远。\n\n脚注 1 \\2 \\3 \\4\n\
  \n"
- "# 7. 智能环境中的人类：近未来\n\n自人类出现在地球表面以来的数十万年里，人类一直与其环境进行着互动。这种互动要么是与**其他物种**，例如其他人类，或是狗、猫、马、牛、公牛等生物，以及树木；要么是与**非生命物体**，如岩石、土壤和水等。当人类与生物（可能除树木外）互动时，他们总是期望某种形式的主动回应。如果我们追一只狗，它可能会跑开，也可能转身冲向我们。如果我们和另一个人说话，对方可能会回应、大笑或感到害怕等。人类已经习惯了这样的回应。与树木的互动则有点棘手。由于没有移动器官，大多数互动看起来就像与非生命物体的互动，但我们可以观察到树木从种子发芽，秋天落叶，春天重新生长，还会开花结果等。不过，总的来说，对非生命物体的回应本质上总是被动的。如果你击打一块岩石，你会受伤，但岩石不会以任何方式主动回应。而且，当岩石被独自留下时，它的外观不会表现出任何变化。同样的情况也适用于所有其他非生命物体。自古以来，这就是被编入人类大脑的程序。大约\
  \ 7000 年前，随着机器进入人类生活，这种情况开始发生一点改变，正如我们在前几章中看到的。这些机器能够移动物体，并以不同于典型非生命物体的方式对人类行为做出反应，但它们的反应仍然相当确定和可预测。它们的行为没有意外或不确定性的成分，人类很快适应了与这类机器合作。从那时起一直到二十世纪末的数千年里，尽管机器的类型和能力有了巨大进步，但这些互动本质上仍大致相同。机器仍然相当确定和可预测。它们仍然不是不可预测的，人们也不会期望它们产生原创或智能的回应。智能的定义深深植根于生物的行为中，这些行为伴随着不确定性、不可预测性以及逻辑思维。当机器技术发展到以专家系统的形式在复杂的启发式计算（仍然相当确定和可预测）中超越人类时，与人类智能的不可避免的比较便开始浮现。然而，参照类人智能的概念，机器仍然相当笨拙。\n\
  \n大约从 5000 年前或公元前 300 年开始，在古美索不达米亚，人类就已经开始使用诸如**算盘**之类的设备来执行简单的数学运算。算盘由一系列杆或线以及珠子或石块组成，可以通过前后移动来进行算术计算。它提供了一种简单而有效的方法来执行基本的数学运算，如加、减、乘、除。随着时间的推移，技术演变为各种形式的机械计算器，特别是在文艺复兴和工业革命时期。著名的例子包括十七世纪布莱兹·帕斯卡发明的**帕斯卡计算器**，以及十九世纪早期查尔斯·巴贝奇设计的**差分机**。这些早期的机械计算器为开发更复杂、更先进的计算机器铺平了道路，最终导致了二十世纪现代电子计算器的发明。这些设备能够在几秒钟内执行复杂而非凡的算术运算，比如求平方根、阶乘以及非常大数字的幂；这是大多数人类连想都不敢想的事。电子计算器确实证明了，在数值计算方面，机器已经远远超出了人类的能力。二十世纪还见证了计算机的出现，这是一种更先进的设备，除了基本的算术计算外，还能执行逻辑运算。自诞生以来，计算机的处理能力每年都在呈指数级增长。到了二十一世纪初期，一些最强大的超级计算机在原始处理能力和内存容量方面已经超越了人脑。\n\
  \n\n## 碳与硅\n\n为了理解人脑中的计算与计算机内部的计算之间的差异，这里适合稍作延伸。这种差异始于原子层面：人类以及所有生物体都基于**碳**，而所有计算机和电子设备则基于**硅**。正如在元素周期表（图\
  \ 7-1）中所见，碳和硅的位置非常相似。它们的原子中拥有不同数量的质子和电子（分别为 6 个和 14 个），但最外层轨道恰好都有 4 个电子，而该轨道最多可容纳\
  \ 1 到 8 个电子。这使这两种元素在与其他元素结合的能力上最为灵活。诸如我们的 DNA 这类极其长的分子，只能通过数十亿^(²⁰)个碳原子的链条形成。\n\n\
  ![](img/603991_1_En_7_Fig1_HTML.jpg)\n\n一张元素周期表突出显示了碱金属、卤素、碱土金属、稀有气体、过渡金属、稀土元素、其他金属、其他非金属以及锕系元素。除碳（C）和硅（Si）外，其他单元格均被禁用。\n\
  \n图 7-1\n\n显示碳和硅位置的元素周期表\n\n所有电子芯片都由硅晶圆制成。硅除了在最外层轨道恰好有 4 个电子外，还具有特殊的化学和电学性质，使其成为一种半导体。半导体元素是导电性介于绝缘体和导体之间的元素。这一关键特性使硅成为制造电子芯片的理想材料。锗以及镓和铟的某些化合物也能用作半导体，但这些元素比硅更复杂、更重，不适合用于芯片制造。令人惊讶的是，尽管碳^(²¹)比硅轻，但它不是半导体，因此无法用于芯片制造。半导体可以很容易地被控制为良导体或像绝缘体一样完全阻断电流。这一基本特性使得在芯片中创建逻辑单元成为可能，这些逻辑单元为所有可编程到其中的复杂处理奠定了基础。第一个半导体芯片，也称为集成电路（IC），由杰克·基尔比于\
  \ 1958 年在德州仪器公司生产。基尔比的发明标志着电子学领域的一个重要里程碑，被认为是微芯片的诞生。基尔比的芯片使用锗而非硅制成，因为当时硅技术仍处于早期阶段。该芯片由一个锗晶圆组成，其表面互连了多个元件，如晶体管和电阻。这是首次将多个电子元件集成到单个基底上的演示。然而，在基尔比的工作之后不久，英特尔公司的联合创始人罗伯特·诺伊斯于\
  \ 1959 年独立开发了一种实用的硅基集成电路。由于硅作为材料具有更好的热稳定性和更高可靠性的固有优势，诺伊斯的硅基 IC 成为了现代半导体产业的基础。基尔比和诺伊斯为随后的革命打开了大门，促成了硅谷的诞生，并在\
  \ 2000 年当之无愧地被授予诺贝尔奖。制造微芯片的过程称为光刻技术。它有助于在硅晶圆（芯片的基底材料）表面创建微小而复杂的图案。\n\n### 集成电路的制造\n\
  \n想象你有一块普通的玻璃，想要在上面绘制一幅非常精细的图画。然而，你没有足够细小的画笔直接作画。因此，你要做的是在玻璃上放置一个称为掩模的特殊模板。这个掩模上有你想要转移到玻璃上的所有精细图案。然后，你通过掩模将强光照射到玻璃上。光线穿过掩模的透明区域，照射到玻璃上，但被掩模的不透明部分阻挡。这样，光线就在玻璃上按照掩模的图案形成了曝光区域。接着，你将一种称为蚀刻剂的化学物质施加到曝光区域。根据具体工艺，这种蚀刻剂可以去除或改变玻璃的性质。蚀刻过程完成后，移除掩模，你就得到了转移到玻璃上的精细图案。在光刻技术中，“玻璃”实际上是硅晶圆，“掩模”则是高分辨率照片或通过计算机辅助设计创建的图案。所使用的光通常是紫外线，可以创建非常精细的细节。通过这一过程创建的图案对于构建构成电子设备的复杂电路至关重要。通过使用不同的掩模和化学处理重复光刻过程多次，制造商可以在硅晶圆上构建多层图案，从而创建现代电子设备所需的复杂电路。\n\
  \n在深入讨论逻辑运算的细节之前，我们先快速回顾一下逻辑在集成电路中是如何表示的。假设我们有两个输入信号，A 和 B。每个信号的值可以是`True`或`False`。因此，A\
  \ 和 B 之间总共有四种可能的输入组合，如表 7-1 所示。当我们对它们应用`AND`运算时，只有当两个输入都为`True`时，输出才为`True`，否则输出为`False`。为了在实际情境中应用这一逻辑，考虑一对朋友：亚当和巴里。如果亚当和巴里都想下棋，他们就会下棋；如果两人中任何一人不感兴趣，他们就不下棋。上述`AND`运算精确地模拟了这种情况。现在，考虑另一种情况。如果亚当或巴里中任何一人想去看电影，他们就会一起去。只有当两人都对看电影不感兴趣时，他们才不去。这种操作通过在集成电路上使用`OR`运算来模拟。`OR`运算的输出在输入\
  \ A 或 B 中至少有一个为`True`时为`True`，否则为`False`。这两种运算构成了在集成电路上实现任何类型逻辑的基础。我们可以在它们之上添加`NOT`运算，或者将它们与额外的输入组合，并串联一系列此类运算，来模拟任何涉及逻辑的现实生活情景。\n\
  \n表 7-1\n\n集成电路上的逻辑运算\n\n| 案例编号 | A | B | A 且 B | A 或 B |\n| --- | --- | --- | ---\
  \ | --- |\n| **1** | True | True | True | True |\n| **2** | True | False | False\
  \ | True |\n| **3** | False | True | False | True |\n| **4** | False | False | False\
  \ | False |\n\n\n\n集成电路（IC）中，这些逻辑运算是通过一个名为`Transistor`（晶体管）的模块来实现的。单个`晶体管`代表一个计算单元，能在\
  \ IC 中执行诸如`AND`（与）或`OR`（或）等基本逻辑操作。通过适当组合这些操作（尽管数量可达数百万甚至数十亿甚至更多），人们可以创造出任何能想到的任意启发式过程。\n\
  \n自第一块 IC 问世以来，芯片上的晶体管数量几乎每两年翻一番，推动了计算能力的指数级增长。这一经验观察归功于戈登·摩尔（英特尔联合创始人），并被广泛称为**摩尔定律**。这种指数增长存在一个由硅原子尺寸和紫外光波长决定的最终极限。随着晶体管数量的增加，为了将\
  \ IC 的尺寸控制在合理范围内，就需要将电路做得越来越微型化，从而增加了制造过程的复杂性。截至 2020 年，我们已经达到了在约 5 纳米的空间内制造最小晶体管的工艺水平。该工艺的理论极限约为\
  \ 1 纳米，受限于制造中使用的紫外光波长。摩尔定律理论上将在此时终结。\n\n这些基于硅的机器能够以令人难以置信的速度和精度执行数值和逻辑运算。因此，如果一个问题的解决方案可以用有限的逻辑语句行（可以是数百万行或更多）来勾勒，那么就可以对计算机进行编程，使其在有限时间内解决该问题。通过提高机器的处理能力和速度，还可以进一步任意缩短这个时间。尽管机器已经精通数学和逻辑，但在很长一段时间里，它们仍然无法通过关键的图灵测试，无法以类似人类的方式展现出智能。剩下的关键一环就是自然语言交互。直到\
  \ 20 世纪末，计算机仍然无法理解或解释自然语言并对其做出回应。\n\n## 外推法与类人智能\n\n除了逻辑性之外，从过往经验中获取洞察以及偶尔的模糊性也是人类智能的关键组成部分。在人类对话中，并非每个句子都是精确的，并具有清晰的二元性或明确的逻辑含义。有些表达方式可能有多重含义，含义不清，有时甚至完全自相矛盾。计算机通常不会产生这样的回应，相反，它们被精心编程以*不*产生这类回应。那么，如果我们改变训练计算机算法的目标，让它们产生这种模糊、多面甚至矛盾的言论会怎样？它们会开始表现出类人智能吗？在产生随机、无意义的回应与产生那些借鉴过往经验、包含一定逻辑但依然模糊或矛盾的回应之间，只有一线之隔。\n\
  \n此时，我们应该探讨学习的另一个方面：**外推法**。用技术术语来说，外推法是一种预测训练数据范围之外数值的方法。预测股票价格或天气预报就是外推法的简单例子。股票价格预测或天气预报问题的训练数据总是来自过去，而预测总是面向未来，模型在预测时难免会遇到新情况。然而，由于这是严格的数值问题，且数值范围定义明确，并有上下限约束，因此在外推模式下的预测仍然相对容易。尽管如此，如果要求一个模型仅基于历史价格数据来预测微软未来的股票价格，其预测结果很可能仍会停留在历史最低值和最高值之间的范围内。同样地，对纽约市的天气预报很可能也会停留在过去所遇到的极端气温范围之内。当出现一种全新的天气模式时，模型极有可能无法准确预测。同理，如果市场上发生了全新的事件，尤其是在竞争格局方面，模型将无法理解其影响，从而无法预测微软的股票价格，而这些价格很可能与历史数值大相径庭。\n\
  \n此外，并非所有需要外推法的问题都是数值问题。考虑一个计算机模型的例子，该模型被训练用于将动物分为两类：狗和猫。提供给算法的所有训练数据都只包含不同品种猫和狗的图片。如果现在给这个模型展示一张黑猩猩的图片，模型的输出结果可能非常难以预测。在这种情况下，当模型试图将黑猩猩归类到它被训练的仅有的两个类别（且这两个类别都不包含黑猩猩）中时，这个过程就被称为外推。这时可能会发生多种情况。模型可能简单地将黑猩猩归类为狗或猫。还有可能模型直接出错，导致程序崩溃。从人类智能的角度来看，这些回应都不智能或不聪明。人类在这种情况下很可能会给出一个答案：“我不知道！”从出生起，人类——或者说所有生物——就一直在以某种方式面对未曾遇到过的全新情况，并且他们总是需要对这些情况做出回应，而没有“崩溃”的选项。用计算机术语来说，生物几乎始终在进行外推，并且非常擅长于此。\n\
  \n股票预测或动物分类的例子过于简单化，这类例子在现实生活中很少出现。现实生活中的外推非常微妙，并带有复杂的上下文背景。例如，拿到驾照后开始开车，每次开上一条新路，都会遇到新的交通状况。每个新的街区都会呈现不同的交叉路口、环岛、行人、高速公路出口和入口匝道等组合。在学习期间，这些情况没有任何一种是完全一模一样的，而每个人在这种情况下仍然能想办法应对这些状况，并且在大多数时候，他们都能做得相当不错且准确。然而，训练机器在这种微妙的外推环境中表现出色是一项艰巨得多的任务，并且需要相当长的时间来开发必要的技术。\n\
  \n在上一章中，我们探讨了人类学习背景下的**探索**与**利用**的概念，它们与外推法确实存在一些相似之处。事实上，在进行外推时，探索和利用这两种操作都是必需的。每当遇到新的情况，人们需要找出它与过去遇到的情况的相似性或接近程度，找出哪些回应曾获得良好反馈，然后创造出一个结合了这些经验的回应，以产生新的行动。同时，为了在混合过程中注入探索元素以实现新的学习，回应中也必须包含一定的随机性。得益于深度学习与**Transformer**技术的创新，我们已经找到了将这些行为嵌入学习算法和程序的方法，像\
  \ OpenAI 的 ChatGPT 就是将这种学习付诸实践的杰出范例。\n\n\n\n## 人工智能的突破与超级智能时代的来临\n\n尽管在 21 世纪初至\
  \ 2020 年期间，人工智能领域取得了巨大进展，但这项技术的惠及范围仍然局限于少数知情人士。只有那些理解计算机科学和高等数学概念的人才能真正欣赏并利用它们。这些智能机器只会说编码语言，而世界上大多数人对这些语言一无所知。`ChatGPT`首次改变了这一局面，它实现了与人工智能的自然语言交互，并向全世界免费开放。在机器智能史上，这是第一次——普通人，那些对机器学习和计算机科学技术细节毫无了解的人，可以用自己的自然语言与人工智能交互，并获得他们能理解的结果。`ChatGPT`被证明是计算机史上最具病毒式传播的应用，在不到\
  \ 5 天内就获得了超过 100 万用户。作为对比，`Netflix`花了三年半才达到这一里程碑，`Spotify`用了十个月，最大的社交网络`Facebook`用了九个月，`Twitter`需要七个月，而`Instagram`在两个月内就超过了它。`ChatGPT`既不是社交网络平台，也不是音乐流媒体应用。它做了一些其他应用从未尝试过的事情。100\
  \ 万用户只是`ChatGPT`故事的开端，它在短短 40 天内就达到了 1000 万用户，60 天内达到 1 亿用户，并且在撰写本书时，正朝着超过 10 亿用户的目标迈进。`ChatGPT`这种前所未有的成功，并非完全归功于`ChatGPT`本身，而是关于人工智能能够为来自不同背景的人类生活增添的价值。`ChatGPT`提供了一个简单的出口，让世界上的任何人都能接触到人工智能的尖端能力。每当一个新用户开始使用`ChatGPT`，人类历史就翻开了一个新篇章。每一个向`ChatGPT`提出的新问题，都在为某个新领域的革命铺平道路。工业革命在几百年间带来的改变人生的变化，现代人工智能有望在几十年内（甚至更短）实现。当前这一代人将面临一个全新的明天——一个全新的就业市场、一系列全新的挑战、全新的互动方式以及全新的娱乐方式。\n\
  \n### 适应智能机器\n\n从 21 世纪开始，机器智能取得了飞跃式进步，人类智能与机器智能之间的差距开始变得模糊，以至于机器智能几乎难以与人类智能区分。这一变化标志着人类历史上的一个里程碑，其意义堪比大约\
  \ 7000 年前第一台机器诞生所标志的里程碑。机器帮助人类变得更强大，能够实现他们能够想到但无法独自完成的事情。它让人类的生活更轻松、更安全、更富裕。这也意味着人类必须适应与机器共存才能真正受益，而人类在过去数千年中确实做到了这一点。7000\
  \ 年可能看起来很长，但当我们从跨越数十万年的人类历史（那时人类仅使用简单的工具）的角度来看，这似乎是一段非常短暂的时间。\n\n从 21 世纪开始，随着与人类同样智能的机器的出现，人类与非生命事物的互动将提升到一个新的水平。过去数千年中，简单机器发展的相对快速的技术演进，与人工智能驱动的机器可能只需几十年就能接管相比，将显得极其漫长。转眼之间，世界将变得截然不同。机器的出现帮助人类达到了新的高峰，但在个人层面，这是一场相当艰难的战斗，因为大多数人失去了传统工作，不得不适应与机器共存的新时代。这一过程伴随着多次社会政治动荡，直到全球各地的文明适应了新的规范。\n\
  \n当前所需的适应不仅速度快了一个数量级，而且影响更为深远，并将从根本上改变一些自人类起源以来就镌刻在基因中的概念。让我们逐一审视。\n\n## 超级人工智能\n\
  \n现在，区分机器智能的不同应用是很有用的。正如我们在前几章中看到的，预测房地产价格、天气预报或股票价格被视为机器智能或人工智能的应用。然而，鉴于生成式人工智能应用所展现出的类人超级智能，这些早期的智能例子就相形见绌了。因此，我们将主要来自\
  \ 20 世纪的传统机器智能称为“智能”或`AI`，而将始于 21 世纪、由深度学习驱动的新机器智能称为“超级智能”或`SuperAI`。\n\n在撰写本书时（大约\
  \ 2023 年年中），超级智能机器的能力范围相当有限，主要局限于挖掘互联网或万维网，并以交互式对话机器人（能用自然语言回答任何问题）或生成新信息（如计算机代码、小型文学作品、图像、诗歌等）的形式呈现。它已经展现出创造原本需要熟练人类花费数小时（甚至数天或数周）才能完成的成果的潜力。目前，大多数交互仅限于书面文本，但这可能很快改变。随着亚马逊的`Alexa`、谷歌的`Google\
  \ Assistant`或苹果的`Siri`等语音助手的普及，这项技术可以轻松适应基于语音的交互，但在撰写本书时这尚未实现。在令人震惊的短时间内，这些算法已经证明机器智能已准备好从人类手中接管大量工作。关于超级智能能以多快的速度实现这一点，存在一些需要注意的方面，必须根据具体情况进行评估。在本章的下一部分，我们将全面审视大多数发达国家和发展中国家人类所从事的各类广泛的工作，以及超级智能将如何影响它们。\n\
  \n### 超级智能对就业市场的影响\n\n#### 农业\n\n\n\n让我们按字母顺序从农业开始。农业已经从人工智能机器中获益，通过卫星和无人机图像监测作物健康、预测肥料和农药的合理使用。这通过减少对不可预测的自然模式和灾害的依赖，使农业整体发生了革命性的改进。这些预测配合相应的缓解措施，使农业更具韧性和效率。机器人被用于处理种植、除草、收割等重复性任务，从而减少了对农场动物的依赖，并使这些任务变得可规模化且高效。\n\
  \n应用于农业的`SuperAI`（我们称之为`SuperAgriAI`）可以弥补涉及人类参与的这些操作中的剩余短板，例如分析数据、提出建议，然后决定采取何种行动。管理沟通和业务运营也可以通过`SuperAgriAI`实现自动化。它将进一步提高农业技术的精度，优化作物产量并降低其他成本。将所有独立实体之间的通信进行整合并自动化，将为农民留下的工作少之又少，几乎使其存在变得多余。\n\
  \n想象一个场景：机器人在田间工作，按照作为`SuperAgriAI`一部分的中心计算机的指令执行所有农业操作。这个`SuperAgriAI`可以访问卫星图像，并控制一组无人机，以获取有关作物健康和周围环境的所有详细信息。`SuperAgriAI`了解特定区域土壤和天气模式的所有细节，选择最佳作物类别进行种植，并调用机器人，在精确的时间和精确的用量下执行浇水、施药等所有必要操作。所有机器人都配备了传感器以检测任何故障，`SuperAgriAI`可以为它们制定必要的维护计划，使其保持最佳运行状态。`SuperAgriAI`与提供所有必要物资的其他企业进行通信，并根据需要进行财务交易，最终使整个食品生产平台无缝地端到端运行。\n\
  \n同样，这个`SuperAgriAI`可以通过专门用于此工作的机器人控制牲畜管理。鉴于我们对农场动物的现代化处理方式，我们已然将其视为商品，因此通过`SuperAgriAI`对其进行全面管理将是现代化的自然终点。\n\
  \n同样的概念可以应用于渔业。`SuperAgriAI`可以控制全自动船只，这些船只携带所有捕鱼设备以及各种传感设备，如雷达和声纳，用于定位理想的捕鱼地点。`SuperAgriAI`可以精确地使用渔网，只捕捞所需数量的鱼，而不会造成任何附带损害。通过天气系统的持续数据输入，它还能选择最佳时机派遣船只。由于严格由机器人操作，无需考虑白天黑夜、追踪假期安排甚至规划任何用餐休息时间。渔民的日子也屈指可数了。\n\
  \n这仍然留下了像园艺学家或渔业生物学家这样从事作物、植物、鱼类等研究的人员。在短期内，他们的工作似乎相当安全。这是一项相当开放的工作，跟踪农业和渔业的当前运作，本质上是从`SuperAgriAI`获取所有输入，并试图找到做得更好的方法。\n\
  \n另一个相关的职业领域是林业。林务员是管理森林的专业人士。他们利用森林生态学、野生动物生物学和林业实践方面的知识，来规划和实施保护、确保和管理森林的项目。他们的大部分实地工作可以由机器人和`SuperAgriAI`接手，只剩下小部分专注于研究的工作。\n\
  \n景观设计师利用他们在植物方面的专业知识来创造创新且美观的景观。考虑到`SuperAgriAI`将拥有所有关于植物的必要知识，并由机器人进行体力工作，景观设计师也需要另寻出路。\n\
  \n然而，关于由谁创建和管理这个`SuperAgriAI`，仍然是一个未解之谜。目前，创建`SuperAgriAI`所需的技术仅掌握在硅谷的顶级科技公司手中，但领域专业知识却存在于其他农业公司。无论谁迈出第一步，都可能会获得先发优势。\n\
  \n#### 商业\n\n商业是一个极其广泛的范畴，可能提供了现代世界中最多的工作岗位。从广义上讲，所有类别都可以归入商业之下，但我们将从狭义的角度来看待它，以区分不同领域进行专门评估。从财务角度来看，商业中的`SuperAI`（我们称之为`SuperBizAI`）将提供大量的工具来管理会计和工资单等功能。\n\
  \n让我们看看这个领域中的顶级职位概况。会计师负责创建和维护公司的财务记录。他们还准备财务报表并跟踪收入和支出。会计可以细分为审计、税务和财务规划等专业领域。整个会计工作范畴可以通过`SuperBizAI`实现完全自动化，且风险极低。这只是当前会计应用程序成熟到大型组织可以完全信任它们并委以全责的问题。同样，科技巨头在这一领域也拥有巨大的先发优势。\n\
  \n除了会计师，还有审计师、工资结算员、税务申报员等职位，随着`SuperBizAI`准备取而代之，这些职位也正走向消亡。\n\n#### 银行业\n\n银行业是商业领域的另一个突出领域。银行业涉及的关键操作包括客户服务、金融和投资咨询及交易、信贷和风险管理。ATM（自动取款机）是机器进入该领域的首次尝试，它们已经减少了管理基本“出纳”类活动所需的劳动力。`SuperBizAI`可以通过提供自动化体验，实现类人化的互动客户服务，从而更进一步。这近年来一直是一个巨大的瓶颈，因为预先编程的自动机器人功能极其有限，往往给客户带来更多烦恼而非帮助。类似`ChatGPT`的界面可以彻底改变这一格局。\n\
  \n`SuperBizAI`提供的算法可以处理更高级的银行业务，如贷款和抵押咨询、投资咨询。`SuperBizAI`可以通过提供家庭互动体验，轻松为每个客户个性化定制所有银行业务需求。一旦实现，它将消除任何银行设立本地分支机构的必要（只需在战略性位置放置\
  \ ATM）。中央办公室可以用全自动的方式处理全球业务。从就业前景的角度来看，整个领域现已濒临消亡。\n\n除了银行和金融业务，其他咨询活动也随着`SuperBizAI`凭借其庞大的法律、规则及历史事件知识库，能够提供比任何个人都更好的个性化咨询和分析，而走向过时。\n\
  \n#### 角色层级与人员管理\n\n\n\n在业务领域中，存在基于不同行业和应用的工作角色，但也存在基于特定公司内工作层级的多种角色。层级树从顶层的首席执行官或总裁开始，向下延伸到高层管理、中低层管理，直至个人贡献者。每家公司可能有不同的相对结构，但个人贡献者、管理者以及高层管理者的角色是行业标准。到目前为止，我们主要关注了业务中个人贡献者类型的角色——`SuperBizAI`可以在这些角色中发挥作用——但随着我们沿管理层级向上，会涉及到额外的职责。中层管理者当然需要具备主题专业知识，但除此之外，这些角色还需具备良好的人员管理技能。近年来这一领域得到了大量研究，既有从哲学层面讨论的书籍，也有基于调查的分析。在此背景下，我想特别提及一本著作：马库斯·白金汉和柯特·科夫曼所著的《首先，打破一切常规：世界上最好的管理者有何不同》。该书的发现基于该领域有史以来规模最大的调查之一，涵盖了来自不同行业的真实人员管理者。这项由盖洛普公司开展的调查包括了超过\
  \ 8 万名管理者。调查的关键发现之一是，并不存在一套每位管理者都必须遵守的恒定“金科玉律”；相反，在极其成功的管理者身上发现了完全矛盾的行为。最成功的管理者通常擅长以下五个方面：关注优势、设定明确期望、营造积极工作环境、有效授权以及让员工承担责任。人员管理的工作迄今为止从未与机器关联，考虑到机器在类人交互方面的局限性，这种状况一直很合理。然而，随着`SuperBizAI`的出现，情况已截然不同。基于如此广泛的研究所揭示的中层管理者的核心目标，`SuperBizAI`能够胜任这一任务，并且其完成方式可能超乎任何人类的想象。当`SuperBizAI`扮演中层管理者的角色时，主题专业知识的问题会自动解决。另一个更关键的优势是，`SuperBizAI`不需要像普通管理者那样领取薪酬。它将作为一种服务由整个组织按年付费购买，而所需费用将远低于组织原本需要支付给管理层的薪酬。现在，我们需要审视`SuperBizAI`在人员管理方面可以调用的所有工具。它可以轻松获得在工作时间持续监控员工的能力。由于明显的隐私侵犯问题，人类管理者永远无法做到这一点，但机器的衡量标准不同；通常，由机器在工作时间监控员工活动并不被视为过度侵入。许多地方已经安装了监控摄像头来追踪员工活动。在新型混合工作文化下，如果工作是在家中进行，这种监控可能涉及一些隐私问题，但可以通过创新方式予以规避。凭借员工活跃工作及产出结果的完整信息，`SuperBizAI`很有可能比任何人都更准确地对员工做出公正、无偏见的评估。利用员工工作时间和产出结果的历史数据，可以轻松识别他们的优势和劣势，从而使`SuperBizAI`能够设定合理的未来期望，并优化工作分配。监控还能实时发现员工遇到的障碍，并立即采取行动加以缓解。识别优势与劣势，结合员工对未来职业的期望，可以帮助为他们提供关于如何改进或改变的定制化建议。即使是最能干、最成功的管理者，终究也是人，在与所有下属员工打交道时难免会产生无意识的偏见，这意味着他们无法平等或公正地对待所有员工。然而，机器则不然。由于可能不存在任何类型的无意识偏见，它们可以为所有员工提供完全客观的对待。这种机器运作中固有的公平性将自然培养出团队内强烈的积极氛围。员工无需刻意取悦管理者，无需担心真实表达自我会引发冲突。他们只需完成分配的工作，并确信将完全基于此获得回报。此外，`SuperBizAI`可以并行运作且无处不在，从而随时对所有下属员工开放，这将在员工心中培养强烈的关怀感，并使更灵活的工作时间成为可能。\n\
  \n通常，所有中层管理者都是先担任个人贡献者角色才达到这一层级的。因此，当他们领导一个团队时，公司实际上便失去了该特定员工在个人贡献者角色上所能创造的价值。因此，通过广泛使用`SuperBizAI`来完全取代中层管理，可以为所有公司创造双赢局面。经验丰富的员工可以继续在职业生涯中成长，在决策过程和项目领导中发挥更大影响力，而人员管理的部分则可以交由`SuperBizAI`负责。人员管理还有其他更具社交性的方面，例如辅导和指导。然而，这些方面可以独立处理，无论是通过`SuperBizAI`，还是根据需要由专门的主题专家或心理学专家来完成。另一项属于中层管理范畴的任务是规划。即根据整个组织的发展方向，制定短期和长期目标。在此任务中，`SuperBizAI`可以生成一份选项清单，由团队中的资深成员进行增补和投票，以最终确定计划。\n\
  \n在撰写本书时，构建能够承担中层管理角色的成熟软件似乎还是一个新兴的初创公司领域。同样，所有科技巨头在这方面都具备先发优势，因为它们已有大量可替代的现有岗位，并拥有深厚的软件开发专长。值得注意的是，在初期阶段，可能会受到来自所有现有中层管理者的强烈抵制，每家组织都需要自行解决这一问题。而这实际上可能有助于新兴初创公司取得领先。\n\
  \n\n\n随着应用日益成熟，它可以在管理层中逐步晋升，直至最高管理层。然而，更换高层人员是一个全新的概念，可能需要更长时间才能实现。组织中的首席执行官是决定整个组织发展方向的主要决策者，因此对于`SuperBizAI`来说，这并不是一个可以直接替代的属性。尽管如此，仍有一些优点值得考虑。例如，人类可能无法始终如一地践行公司的使命和愿景。即使是这些高管也是人，他们容易受到人类弱点的左右，例如：\n\
  \n1.  **过度自信：** 高层管理人员可能对自己的决策和策略过于自信，导致他们低估风险，并在没有充分评估潜在弊端的情况下仓促做决定。\n2.  **确认偏误：**\
  \ 高层管理人员可能只寻求确认自己现有信念和观点的信息，而忽视相反的数据。这种偏误可能导致决策失误并错失良机。\n3.  **缺乏适应性：** 在快速变化的商业环境中，抗拒变化或新想法的高管可能会发现很难根据不断变化的情况调整其策略。\n\
  4.  **忽视道德与合规：** 对道德考量和法规遵从性缺乏关注可能导致声誉受损、法律问题和利益相关者信任度下降。\n5.  **难以接受反馈：** 不乐于接受建设性批评和反馈的高管可能会错失改进机会，并无法解决组织问题。\n\
  6.  **沟通能力差：** 低效的沟通会阻碍高层管理人员传达愿景、激励员工以及引导组织朝着共同目标前进的能力。\n7.  **职业倦怠与压力：** 高层管理人员通常面临巨大的压力和紧张感，如果管理不当，可能导致职业倦怠并影响决策。\n\
  8.  **傲慢：** 过度的自我或优越感可能导致优先考虑个人利益而非组织及其利益相关者福祉的决策。\n9.  **群体思维：** 身边围绕志同道合之人并压制反对意见的高管，会营造群体思维的环境，从而限制创造力和创新。\n\
  10. **未能授权员工：** 不授权和支持员工的高管可能会扼杀主动性，并阻止组织发挥其全部潜力。\n\n这些弱点的每一个方面都可以通过即将取代组织高管的`SuperBizAI`的适当配置来彻底避免。除此之外，公司所有最高层人员都可以参与对关键决策的投票，而这些决策的选项将由`SuperBizAI`筛选。投票也可以向公司所有员工甚至所有股东开放，并通过适应性加权投票，真正营造透明的氛围，让所有员工和股东切身感受到参与公司运营。\n\
  \n特别是对于大型上市公司而言，从股东的角度来看，CEO 或任何高层管理人员即便在业余活动中也应始终全神贯注于公司的改善和发展，这或许非人力所能及。然而，`SuperBizAI`没有这样的限制。替换管理层的过程可以从底层开始，随着流程成熟，它可以一路发展，直到所有经理（直至\
  \ CEO）都被`SuperBizAI`取代。所有人类员工将作为个人贡献者，拥有相应的资历级别。人类现在可以放弃那些与自身个性相悖的方面，并真正自由地按照自己的意愿过好工作之外的生活。即使是最高层人员也无需担心公众形象，因为这部分将留给`SuperBizAI`，而它可以在此角色中提供卓越的表现。\n\
  \n### 对不同技能水平岗位的影响\n\n具体到个人贡献者的岗位，其范围可以从技能要求低、劳动密集型的工厂工人，到高技能工人，如精算师、药剂师、律师、软件工程师、科学家和医生。随着重型机器人设备的大量使用，工程和建筑行业中最劳动密集型岗位的数量已经减少。想象一下一个高层建筑的施工现场。在自动化早期，这类工地需要数百人来处理众多劳动密集型工作。然而，随着起重机、挖掘机和物料搬运机器人等重型机械的出现，这一数量已减少了一个数量级。机器人系统可以帮助在现场外预制大部分构件，并在现场精确组装。结合计算机辅助的\
  \ 3D 打印，可以以更高的精度制造复杂的建筑元素和建筑构件，从而进一步减少制作复杂设计所需的半熟练工人。使用专业的机器人工具可以处理整个拆除工作，最大限度地减少人力，降低对工人的风险，并提高效率。无人机和机器人测量设备可以在施工现场收集精确数据，消除手动测量的需要，并进一步提高准确性。机器人砌砖系统和混凝土浇筑泵可以加速施工中的其他手动步骤，进一步减少所需劳动力。通过远程和虚拟现实辅助操作，人类甚至无需亲临施工现场，而是可以待在家中或其他喜欢的地方，使用虚拟现实设备操作或监控所有机械。这些设备中的大多数仍被归类为传统\
  \ AI。有了 SuperAI 驱动的机器人，对人类在场的需求将进一步减少，但短期内可能仍不会完全消失。如果传统 AI 将劳动力从数百人减少到几十人，那么 SuperAI\
  \ 则有望将其减少到仅需少数几人，并且这些人也在远程地点操作。所有这些改进都有助于提高流程的效率和准确性，并降低风险和危害，但在此过程中，它们也将造成巨大的岗位数量缺口。\n\
  \n\n\n技能型工作的格局并无太大不同。软件工程是一个小众且高度技能化的劳动力群体，随着计算机在 20 世纪末的指数级增长而发展壮大。软件工程师的核心本质与其他工程师并无二致。你在电脑、平板或智能手机等所有数字设备上使用的所有应用程序、网站和程序，都是由软件工程师创建的。软件工程师编写指令，使这些设备和程序得以运行。可以把软件工程师想象成数字世界的建造者。他们使用特殊的编码语言编写一行行指令，告诉计算机该做什么。这些指令能让应用程序、游戏、网站，甚至自动驾驶汽车或机器人等事物顺畅运行。软件工程师需要善于解决问题、具备逻辑思维能力并注重细节，就像机械工程师或土木工程师一样。他们的工作也包含大量创意。他们要设法让产品对用户友好，使你能轻松浏览各类应用和网站。他们还要确保一切安全，让你在使用技术时个人信息不被泄露。然而，随着像\
  \ ChatGPT 这样能理解人类语言的超级 AI 界面的发展，软件工程的需求预计将大幅下降。任何人都可以用简单的英语描述一个软件应该做什么。如果超级 AI 能直接将这些用英语描述的指令翻译成计算机代码，它就会从软件工程师手中夺走相当一部分关键职责。原则上，配备这种界面的系统甚至能以全自动化的方式，执行软件开发周期中的端到端操作——从编写和测试机器代码，到在\
  \ PC、手机等任意目标平台上部署应用程序，从而彻底消除对软件工程师的需求。超级 AI 技术要达到这种自动化水平可能需要一二十年，但软件工程师以及他们那些小众岗位的日子已经屈指可数了。\n\
  \n让我们设想一个超级 AI 完全接管软件工程的场景。\n\n## 赞许咖啡馆\n\n2028 年的一个周五傍晚，苏菲和劳伦正坐在丹佛市中心他们最爱的“赞许咖啡馆”里喝咖啡。她们从童年起就是非常亲密的朋友，即使后来走上了截然不同的职业道路——苏菲投身科技行业，劳伦从事野生动物保护——她们也一直保持着联系。每月在咖啡馆的聚会如同神圣的仪式，是充满欢笑、深度交谈和分享梦想的绿洲。\n\
  \n今晚的氛围带着一丝苦乐参半。苏菲刚刚接受了一份在法国的新工作邀请。虽然新开始的兴奋在她心中涌动，但她也因为要告别与劳伦的每月惯例而感到一阵刺痛。她搅动着咖啡，升腾的蒸汽仿佛承载着她复杂的情感。“你知道吗，我一直想象着我们会在丹佛一起变老，坐在这儿，一边喝着无咖啡因咖啡，一边抱怨关节炎，”劳伦开玩笑地说，想缓和一下气氛。苏菲笑了，“还要抱怨年轻人不懂得欣赏一场好的、老式的咖啡闲聊。”两人都笑了起来，但紧随其后的沉默却格外沉重。劳伦打破沉默，把一张餐巾纸推到苏菲面前。她在上面画了一个应用程序的界面。“还记得我们一起创造点什么的梦想吗？为什么不现在就开始呢？一个基于位置的社交网络，人们可以在搬到新地方或旅行时，提出关于当地的问题。你在法国就会有亲身体验，不是吗？”苏菲看着那张图，眼睛亮了起来。“就像，‘最近的素食餐厅在哪里？’或者‘这个镇上有远足团体吗？’然后当地人能实时回答？”“完全正确！而且每条有用的回答都能让他们获得‘赞许分’。也许他们甚至可以在世界各地的像这样的咖啡馆里兑换积分。”劳伦喜笑颜开。苏菲的思绪飞转。“我们可以叫它‘LocalE’，强调本地知识和体验。”两人兴致勃勃地花了几个小时讨论这个潜在的应用程序。这完美地融合了她们的兴趣——对苏菲来说是技术与社区建设，对劳伦来说是本地生态系统与文化。正当她们全神贯注讨论时，桌上的麦克风“哔”地响了一声。劳伦和苏菲没注意到，这家赞许咖啡馆最近刚升级了新的超级\
  \ AI 功能，能够实时部署软件。超级 AI 机器人在麦克风里回应道：“我已经理解了你们对这款社交应用的需求，如果你们愿意，我可以为你们创建一个真实版本。费用是\
  \ 250 美元。”劳伦几乎不敢相信自己听到的话，充满了敬畏，而苏菲则兴奋不已。苏菲立刻回答：“谢谢你的提议。我们想下单。”劳伦还没完全回过神来，不敢相信眼前发生的一切。超级\
  \ AI 机器人回应道：“谢谢！我们已经从你存档的卡中扣款。我们正在我们的服务器上构建并部署你们的应用程序，几分钟后就可以下载了。”接着，随着超级 AI 构建和部署应用，一个圆圈闪烁起不同的颜色。仅仅几分钟后，屏幕上就显示出了一个二维码，机器人回应道：“请扫描二维码下载应用程序。”苏菲和劳伦将应用下载到手机上，并开始提问。超级\
  \ AI 机器人回应道：“我们将把这个应用提供给全球所有访客，几天之内，你们预计就能看到更多的互动。”\n\n不知不觉间，咖啡馆准备打烊了。两位朋友离开了，带着的不是沉重的心情，而是实现了共同梦想的满足感。她们也许不在同一个城市，但通过共同的事业，她们的联系将比以往任何时候都更加紧密。几个月过去，几年过去，‘LocalE’风靡全球。每当有人在应用上获得‘赞许分’时，苏菲和劳伦都会想起那个在“赞许咖啡馆”苦乐参半的夜晚，心中充满感激，因为那段告别，孕育了新的开始。\n\
  \n\n\n\n让 `SuperAI` 具备取代软件工程等专业技能岗位的能力，将成为其巅峰成就。在硬件领域情况也颇为相似。我们正接近半导体芯片制造技术的理论极限，预计在\
  \ 2020 年起的十年内即可触及。以下多个因素将决定 `SuperAI` 何时能开始取代人类。\n\n1.  **设计**：`SuperAI` 算法可用于辅助芯片设计，尤其在优化芯片布局方面。例如，谷歌已通过在其张量处理单元设计中运用人工智能证明了这一点，完成速度远超人类所需时间。\n\
  2.  **预测性维护**：`SuperAI` 能预测制造设备可能发生故障或需要维护的时间，从而减少停机时间。\n3.  **流程优化**：`SuperAI`\
  \ 可实时优化制造参数，以提高良率、减少浪费，并适应不断变化的条件或材料。\n4.  **质量控制**：由 `SuperAI` 驱动的自动视觉检测系统能够快速准确地检测芯片缺陷，其速度和可靠性通常优于人工检测员。\n\
  5.  **供应链管理**：`SuperAI` 可以优化物流、预测供应链中断，并确保原材料及时交付。\n\n尽管有这些重大的改进，但在复杂性和基础设施方面仍存在一些限制。芯片制造工艺，尤其是针对具有纳米级特征的高级芯片，极其精细。确保制造过程中所需的精度、洁净度和一致性，可能仍需人工监督。虽然\
  \ `SuperAI` 能处理大量任务，但战略决策、突发挑战以及某些复杂的问题解决场景，可能仍需要人类干预。用 `SuperAI` 驱动的替代方案来替换现有系统和机械需要巨额投资，并且只能逐步推进。即使引入了\
  \ `SuperAI` 系统，人类仍然可能对其进行监控，以防止发生灾难性故障，尤其是在初始阶段。因此，尽管 `SuperAI` 能够且很可能将在芯片制造中扮演日益核心的角色，但“完全”接管的想法可能仍需要一些时间。\n\
  \n## 法律事务\n\n再来看其他高技能领域——法律行业，律师或诉讼律师的角色是就业市场中另一个濒危物种。法律研究是律师工作的关键方面，而 `SuperAI`（我们暂且称其为\
  \ `SuperLegalAI`）凭借其庞大的法律文件、案例、法规数据库，以及比大多数人更好地识别相关判例和法律的能力，从一开始就能胜任此项工作。`SuperLegalAI`\
  \ 还能审查合同，识别任何异常、缺失或存在风险的条款。这在并购过程中的尽职调查中尤其有用。在诉讼中，证据开示程序通常涉及审阅大量文件以确定与案件相关的信息。`SuperLegalAI`\
  \ 可以自动化这一过程，轻松地根据相关性识别和分类文件。`SuperLegalAI` 还可以分析过去的案件结果、司法裁决和其他数据，以预测未来的法律结果。这有助于在无需人工干预的情况下为客户提供建议和制定策略。自动化行政任务，如日程安排、计费等，是\
  \ `SuperLegalAI` 另一项人类无法企及的内置能力。对于简单的法律服务和建议，`SuperLegalAI` 可以借助几乎随时可用的先进聊天机器人来取代人类。`SuperLegalAI`\
  \ 还能基于对历史案例的分析协助量刑，并承诺完全公正。\n\n实现这一目标的真正障碍，主要在于达到当前经验丰富的律师所享有的信任水平，以及克服陈旧的法规和验收标准。在法律领域，对行为承担责任至关重要，而当前可能开发\
  \ `SuperLegalAI` 软件的科技公司，很可能不会为其软件提供的结果承担责任。不过，这对初创公司来说是一个绝佳机会，它们可以利用人工智能的自然语言处理（`NLP`）技术，并结合顶级律师的专业知识，为成千上万的人提供完全自动化的法律服务。这些系统将为其提供的法律行为和建议承担责任，从而真正取代律师。可能只需要少数顶尖律师来微调系统，但所需的整体劳动力实际上将几乎消失。\n\
  \n除了律师，法律行业还有许多其他角色，但我们可以重点关注除了律师和诉讼律师之外的几个关键职业：律师助理和法官。律师助理人员占法律工作的很大一部分。他们主要专注于协助律师工作，包括进行法律研究、起草文件、整理档案、维护记录等。`SuperLegalAI`\
  \ 似乎在所有这些领域都天生具备专业能力，并配备了自然语言界面，因此它已经准备好立即取代律师助理。\n\n\n\n\n### 法官的职责与 SuperLegalAI\n\
  \n法官的职责处于法律体系的核心，至关重要。现在，我们来审视法官承担的关键职责，以及 `SuperLegalAI` 如何在每种情况下提供帮助：\n\n####\
  \ （1）审判裁决\n\n法官需要公正地审理和裁决提交至法庭的案件。这包括听取双方辩论、评估证据，并将相关法律适用于案件事实。理论上，`SuperLegalAI`\
  \ 可以执行这项任务，但法律程序中所用语言的极度冗长和微妙特性，以及 `SuperLegalAI` 的能力，在宣称其可替代人类法官之前，必须经过彻底测试。然而，在提交给法官的所有案件中，有很大一部分可能属于常规性案件，在这种情况下，可以节省人类法官的时间，由\
  \ `SuperLegalAI` 取而代之。总体而言，`SuperLegalAI` 已准备好在不远的将来减少所需的法官数量，并随着技术的成熟和充分信任的建立，大幅削减法官人数。\n\
  \n#### （2）法律解释\n\n法官的首要职责之一是解释和适用法律、法规及判例。在某些案件中，法官可能判定某项法律是否合宪。这一领域对 `SuperLegalAI`\
  \ 而言似乎颇具挑战性；至少在不久的将来，我们可能仍需依赖人类法官。\n\n#### （3）确保程序公正\n\n法官负责确保法庭程序公平进行，并尊重所有相关方的权利，包括维持法庭秩序。这一领域非常适合交由\
  \ `SuperLegalAI` 处理，因为它涉及应用标准的公平规则和既定程序。然而，偶尔也可能出现棘手情况，需要人类法官介入。\n\n#### （4）对动议作出裁决\n\
  \n在整个诉讼过程中，各方可能会提出各种动议（例如，驳回动议、即决判决动议）。法官必须根据法律和所提交的事实对这些动议作出裁决。这一领域涉及对法律和程序的直接解释，`SuperLegalAI`\
  \ 可以介入处理大多数裁决。\n\n#### （5）量刑判决\n\n在刑事案件中，一旦被告被认定有罪，通常由法官负责在法律规定的指南或限制内确定并施加适当的刑罚。这是法官最强大的权力之一；然而，在应用对法律的公正、公平解释以及历史判例方面，这也是最直接明了的职责之一。`SuperLegalAI`\
  \ 可以很好地完成这项工作，为人类法官减轻负担。量刑判决还包括对其背后的原因进行法律解释，而具备强大自然语言能力的 `SuperLegalAI` 可以很好地处理这一部分。\n\
  \n#### （6）法律研究\n\n即使知识渊博，法官也常常需要进行法律研究，以确保做出明智的判决，尤其是在复杂或新颖的案件中。`SuperLegalAI` 已经具备了这一能力。\n\
  \n#### （7）师徒指导\n\n资深或经验更丰富的法官通常会指导新法官，帮助他们理解自身职责并应对司法系统的复杂性。这是一项非常以人为核心的职责，不符合 `SuperLegalAI`\
  \ 的框架。`SuperLegalAI` 会通过不断将最新判例程序纳入其知识库来持续自我更新，因此不需要指导。同时，它可能也不是指导人类法官的理想人选。\n\n\
  因此，总体而言，在替代法官这件事上，结果好坏参半。但作为一个起点，`SuperLegalAI` 无疑有能力取代相当数量的法官，仅保留一小部分法官来处理相对新颖的情况，并训练\
  \ `SuperLegalAI` 系统自身，以保持其准确性和精度。\n\n\n\n## 人工智能在教育领域\n\n教育是另一个有望因人工智能而深受影响的领域。随着计算机技术的渗透，学生去学校、老师用黑板或白板教授各学科的传统学习体系已逐渐过时。不久前，课堂上的整个教学体验还完全由老师主导。老师在黑板上书写或绘画，口头讲解或照本宣科，仅此而已。如今，随着课堂上屏幕和互联网的普及，老师可以从网上调取图片辅助讲解，甚至能播放\
  \ YouTube 或其他流媒体网站上的视频或纪录片来支持教学。在某些情况下，他们甚至可以将整堂课交给课前录制的视频。\n\n当这类录制内容免费可得时，有人可能会质疑：学生是否还有必要去学校？他们只需要一份课程大纲和一套讲解该大纲所有内容的视频，就能以方便的任何节奏在家学习一切。甚至可以选择观看不同老师讲解同一主题的多个视频，以满足特定的学习需求。用于教育的`SuperAI`或`SuperEduAI`，能够通过定制测试自动理解每位学生的具体能力和愿望，并为其整个教育需求创建个性化课程。然后学生将按日进行学习体验。`SuperEduAI`可以根据学生的进步情况定期自动调整课程。所有必要概念都将借助所需的视觉和听觉辅助工具来教授。对于动手实验工作，`SuperEduAI`可以使用增强现实或虚拟现实技术。它甚至可以模拟其他学生，营造课堂氛围。在课堂上，也可以让真实学生通过虚拟现实相互互动。借助这些，我们真正能够打破地域、种族、语言、国家的界限，组建一个由世界各地学生共同学习的班级。\n\
  \n为了使学习以最佳节奏进行，拥有一群智力水平、兴趣和知识相近的学生至关重要。`SuperEduAI`可以根据这些指标匹配全球学生，创建最优化的班级组合，并提供前所未有的完美学习体验。这样的平台将使几乎整个教育相关劳动力（如各阶段的学术顾问、图书管理员、教师和教授，以及所有支持人员）变得无关紧要。在撰写本书时，许多在线学习平台正在涌现，但它们大多仍在使用真人教师。这里有一个巨大的机遇，即绕过这一点，构建一个完全自动化、由`SuperEduAI`驱动的平台，且该平台对学生数量没有限制。它将为每位学生优化体验，同时使其保持公正且有趣。\n\
  \n为了实现这一终极统一教育平台的梦想，仍有一些差距需要填补。首要的是基础设施开发。截至本书撰写时，构建此类基础设施所需的所有要素似乎都已具备，但一个掌握技术诀窍的组织或初创公司需要将其列为优先事项，搭建端到端平台。随后，全球需要实现高速可靠的互联网接入，以及能在该平台上运行的设备。一个安全且可扩展的云基础设施将从后端为系统提供动力。在隐私、公平、透明度和问责制方面，总有一些伦理问题需要解决。在虚拟现实中工作有时可能会造成情绪压力，需要按需提供适当的咨询。所有互动都在虚拟世界中进行，可能导致缺乏真实的物理接触，但这可以通过在需要时在本地社区内，于校外组织物理互动来解决。由`SuperEduAI`驱动的虚拟平台可以主动解决欺凌等传统学校中常见的面对面互动问题。\n\
  \n## 工程领域\n\n我们已经探讨了软件工程的未来。然而，工程本身就是最古老的职业之一，其范围远超软件工程，涵盖众多领域，例如土木、机械、电气、电子与通信、化学、航空航天、生物医学、石油、环境、核能、汽车工程等等。土木工程、机械工程以及汽车和航空航天工程等相关领域，专注于物理基础设施和机器的设计、分析、制造和维护。配备聊天界面的工程领域`SuperAI`或`SuperEngAI`，能够理解客户用日常英语表达的需求，并能基于历史数据的学习、内置的结构力学分析引擎以及材料属性数据库，自动化完成大部分流程。`SuperEngAI`可以为所有工程需求提供一站式服务。更进一步，`SuperEngAI`还可以执行预测性故障分析，并提供全面的维护计划。通过与机器人设备的自动化通信，`SuperEngAI`可以将设计变为真实的物理制品，例如建造桥梁、高层建筑，以及机器、汽车乃至飞机。对于这些工程学科中的大多数常规工作，由于`SuperEngAI`很可能会以更低的成本、更高的效率和精度提供更好的服务，它们正面临威胁。只有所有这些工程领域的前沿方面，仍然需要人类进行创新并创造全新事物。\n\
  \n同样地，其他所有工程领域，从电气、电子与通信、化学到环境工程，其常规方面将受到主要影响。所有已确立或渐进式的发展，都可以通过`SuperEngAI`实现完全自动化，但所有专注于创新的领域仍离不开人类。工程的核心是解决问题，每当遇到一个已经解决、从而可以详细描述的问题时，`SuperEngAI`都能端到端地实施。然而，当问题是全新的，因而模糊不清且未被完全理解时（这本质上将我们带至创新的前沿），人类的干预将是不可替代的。\n\
  \n\n\n### 医疗保健与医药\n\n医疗保健与医药是人类生活中至关重要的领域，涵盖大量职业类型。这些职业大致可分为以下几类：(1) 临床类 (2) 技术与支持类\
  \ (3) 行政类 (4) 研发类 (5) 销售与客户服务类。\n\n我们按倒序来审视这些类别。销售与客户服务类岗位非常适合`SuperMedAI`的应用，AI\
  \ 引擎能学习所有药品与医药产品的文档，并利用语言理解能力掌握销售目标和客户需求。随后，它能智能地将这两类信息关联起来，从而替代人类完成端到端的运营。任何形式的研发永远都会是一个免受`SuperAI`入侵的\
  \ niche 领域，在医疗保健与医药行业也不例外。行政类岗位包括医疗秘书、健康信息管理员、医疗顾问和普通行政人员等。所有这些岗位提供的服务都相当常规，需要标准的专业知识，这些知识很容易被理解，其服务也很容易被`SuperMedAI`自动化。用\
  \ AI 界面来处理这类服务成为标准做法，只是时间问题。\n\n技术与支持类岗位属于半熟练到熟练工种，如医疗助理、药房技术员、外科技术员、牙科保健师、护理人员等。这些岗位所需的全部专业知识都可以轻松提供给`SuperMedAI`，但大多数此类工作都需要相当精细和微妙的体力操作。目前机器人自动化方面的进展可以接手这些操作，但必须建造并获得认证的专用机器人版本，才能完全取代人类。短期内这无疑是难以企及的，但人类在这些岗位上工作的日子无论如何都已屈指可数。\n\
  \n接下来是这个领域的核心部分——临床类岗位，如医师或医生、护士、牙医、药剂师、验光师、理疗师、放射科医生、脊椎按摩师、足病医生等。毫不意外的是，这些岗位中大部分的日常工作都相当常规且模式固定。这些岗位的典型操作阶段包括：通过与患者交谈来诊断问题、分析常规检测的结果，随后推荐药物、饮食调整或锻炼方案等，或者向其他临床医生转诊。审视这些分解步骤，`SuperMedAI`可以与患者进行有深度的对话以了解他们的症状，分析常规检测结果，然后利用这些信息与庞大的历史诊断数据库及患者病史进行关联，并提出适当的建议。考虑到`SuperMedAI`可获取的信息量及其处理能力，它在这些场景下很可能会比任何人类都更出色。这意味着`SuperMedAI`从一开始就准备好提供比大多数人类医疗服务者更优质的诊断服务。剩下的仅仅是建立必要的系统信任度，以便该服务投入运营。此外，还有另一个相当重要的方面，即医疗事故问题。理想情况下，`SuperMedAI`没有人类那种存在偏见和不可预测行为的弱点，但它仍存在一定的犯错概率，一旦出错，就可能引发法律纠纷。提供`SuperMedAI`服务的公司必须将自己确立为主要责任方，并处理相关的法律诉讼。然而，与`SuperMedAI`带来的颠覆性益处相比，这是一个微小的缺点。一旦系统建立，世界上任何地方的任何人，只要能够访问互联网和拥有计算机设备，就可以选择接受最优秀医生的诊断，并以非常合理的价格获得治疗建议。这个系统几乎可以让\
  \ 99%的医生的工作变得过时。每个领域只需雇佣少数专家来管理`SuperMedAI`的能力，并使其紧跟医药领域的创新和最新的真实诊断案例。只有当出现完全基于症状和检测结果的新病例时，人类才能介入并调查细节。随后的治疗方案要么包括某种形式的药物，要么是物理疗法。配药工作同样可以轻松实现自动化，`SuperMedAI`可以在线会话中自动寄送所需药物，或将处方发送给最近的患者药房。物理疗法虽然无法在线进行，但实际过程也可以使用机器人设备实现自动化。这种完全自动化的物理治疗设施可以在城市中的战略位置建立，通过`SuperMedAI`接收患者处方。结合生物识别技术，整个端到端的操作可以实现无纸化和全自动化。医疗保健行业正处在未来几年重大转型的风口浪尖。然而，考虑到其中涉及的极高财务利益，该行业可能会遭遇当前根深蒂固体系的巨大挑战。\n\
  \n\n\n### 娱乐与媒体\n\n另一个在就业市场中占据重要份额的领域是媒体与娱乐。随着名为`SuperEntAI`的超级人工智能娱乐工具的出现，这一领域也将迎来范式转变。人类在过去数千年里在娱乐及创意表演艺术等相关领域取得的进步，是真正令人惊叹的成就之一——我们抽象思维与想象力的天赋在创新艺术形式的创造中得以释放。或许并不存在某种逻辑能解释莫奈的画作为何如此迷人，或莫扎特的交响乐为何堪称神圣，但当我们体验它们时，感受便油然而生，且无论你来自同一地区与否，这种感受都具有普适性。列夫·托尔斯泰、威廉·莎士比亚、但丁、拉宾德拉纳特·泰戈尔、纪伯伦等人的文学作品亦是如此，例子不胜枚举。然而，这种创造抽象艺术形式的能力是人类独有，还是像`SuperEntAI`这样的机器也能习得？这一问题的答案，将决定该领域的未来走向。\n\
  \n当前一代的文本生成 AI 模型（初版`ChatGPT`）已能按你指定的主题即时创作诗歌，并撰写带有喜剧、戏剧、悬疑等人类微妙色彩的文章和剧本。以下是由`ChatGPT\
  \ (3.5)`以纳粹德国视角创作的一首关于第二次世界大战的诗作。我使用的具体提示是：“以纳粹德国的视角写一首关于第二次世界大战的四节诗。”\n\n> *在欧洲的心脏，一颗火星点燃，*\n\
  >\n> *纳粹德国崛起，野心昭然。*\n>\n> *雷鸣般的靴声，高悬的旗帜，*\n>\n> *它们渴望征服，主宰一切。*\n>\n> *闪电战 unleashed，一场迅猛的风暴，*\n\
  >\n> *国家颤抖，命运被铸造。*\n>\n> *但英雄奋起，精神高昂，*\n>\n> *直面黑暗，触碰穹苍。*\n>\n> *从诺曼底海滩到柏林陷落，*\n\
  >\n> *盟军集结，推倒高墙。*\n>\n> *他们胜利屹立，团结而自由，*\n>\n> *世界从暴政狂欢中重生。*\n>\n> *让历史的回响清晰提醒我们，*\n\
  >\n> *权力的代价，仇恨的灼痕。*\n>\n> *在团结与和平中，让我们奋力繁荣，*\n>\n> *让自由与希望永远留存。*\n\nAI 明显理解了问题的背景，能够提取战争中的关键元素，并以押韵的形式组合起来。它还能按时间顺序排列事件。诗作以德国人的自豪开篇，随后转为歌颂盟军，最后以战争教训和对美好未来的希望收尾。这无疑是一次不错的尝试，水平大致相当于高一到高二的学生。\n\
  \n以下是新一代`ChatGPT`（基于 4.0 版本）创作的另一首诗：\n\n> *踏着梦境前行，我们立于阴影，*\n>\n> *一种权力的幻象，被误解的愿景。*\n\
  >\n> *带着雄鹰和万字符，我们崛起前方，*\n>\n> *相信命运，要重塑一个世界。*\n>\n> *钢铁与利刃，列阵战场，*\n>\n> *大陆被吞噬，如同棋子般徜徉。*\n\
  >\n> *野心浸透，灵魂飞扬，*\n>\n> *狂热蒙蔽双眼，不知输赢何样。*\n>\n> *火海连天，苍穹因战火昏黑，*\n>\n> *追寻新秩序，无数生命陨落。*\n\
  >\n> *怀疑的低语开始蔓延，*\n>\n> *当世界的重压汹涌盘旋。*\n>\n> *在废墟与灰烬中，梦想崩塌，*\n>\n> *一个国家的野心，全球的风暴。*\n\
  >\n> *因追求权力，我们出卖了人性，*\n>\n> *历史的教训，永远被传颂。*\n\n如你所见，`ChatGPT 4.0`在诗歌创作上有显著提升。它更娴熟地运用文字表达方式，以构造押韵。它还通过更巧妙地运用象征、拟人、典故、修饰语、生动的意象与印象，以及精心安排的重复手法，使诗歌更具感染力，从而散发出更多激情。这首诗出自文学研究生之手也毫不违和。不过，它本质上仍有些泛泛而谈，与一些伟大作品（如威尔弗雷德·欧文关于第一次世界大战的《甜蜜与荣耀之死》，或丁尼生勋爵关于克里米亚战争英国骑兵的《轻骑兵冲锋》）仍有差距。但考虑到这些\
  \ AI 模型在短短几年内取得的进步，我们有理由相信，很快`SuperEntAI`就能创作出足以跻身精英行列的诗歌。\n\n我们几乎无法判断这些模型是否理解其创作背后的深层情感，但可以肯定的是，它们能够从训练过程中输入的所有文学作品中提取某种本质。这些例子展示了\
  \ AI 在媒体创作某一方面的实力，但 AI 当然不止于此。下一个里程碑将是绘画、图像以及原创音乐作品的创作。许多电影已在使用计算机和 AI 生成的高分辨率图像，而`SuperEntAI`根据提示创建完整视频甚至全长电影，只是时间问题。例如，如果`SuperEntAI`能根据这样的描述按需创作视频剧集：“创建一个大约半小时的视频，带点喜剧、动作和科幻元素，并确保里面有布鲁斯·威利斯和艾西瓦娅·雷。”试想一下，这对好莱坞或宝莱坞意味着什么。或者另一个描述：“创作一段十五分钟的交响乐团原创配乐，风格类似贝多芬。”如果`SuperEntAI`能根据这些文本提示创作出哪怕差强人意的作品，那么\
  \ Netflix、HBO 等视频流媒体服务，以及 Spotify、Tidal 等音乐流媒体服务也将变得无关紧要。每个人都可以按需创作自己的娱乐媒介，享受其中，甚至与朋友分享。很可能，这些创作起初无法与过去的原创作品媲美，但考虑到\
  \ AI 模型的发展速度，谁又能断言未来会怎样呢？\n\n如今，在媒体观众群体中，我们看到另一个令人不安的趋势：随着智能手机和平板电脑等消费设备的普及，YouTube\
  \ 视频的观看量急剧上升。人们只是在视频中玩游戏并评论，或在手机镜头前拆箱、测评，就能获得数百万的观看量。制作这些视频所需的准备时间可能只有几小时甚至几分钟，涉及人数寥寥无几；而制作具有专业水准的电影则需要数百人花费数月甚至数年的准备。这两个类别在制作质量和价值上完全无法相提并论，但尽管如此，大多数电影的观看量仍不及这些\
  \ YouTube 视频。这只能说明，当媒体消费场所从电影院和歌剧院转向手持设备时，制作质量或对制作质量的期望也随之降低了。在此背景下，`SuperEntAI`无疑将彻底改变游戏规则，并可能对整个娱乐业造成毁灭性影响。同样，除非得到好莱坞或宝莱坞支持的大胆初创公司能更快地迎头赶上，否则拥有\
  \ AI 技术的公司仍将处于开发`SuperEntAI`的前沿。\n\n\n\n这场讨论也引出了关于媒体与娱乐产业的一个相当关键的问题：我们期望从这种媒体消费中获得什么？它仅仅是一种消磨时间、放松身心的娱乐形式吗？还是某种学习？我们真的在意内容的原创性吗？我们关心创作内容的真实人员吗？这些问题没有简单的答案，即便是同一个人，答案也可能因时而异。此外，随着新兴生活方式的涌现，以及`智能手机`和`人工智能`成为其不可或缺的一部分，未来的几代人对媒体将抱有全新的期待。然而，我们如何回答这些问题的总体趋势，最终将决定媒体行业的命运，并随之决定该行业所有从业者——包括演员、艺术家、音乐家、摄影师、制片人和作家——的命运。\n\
  \n## 新闻与新闻业\n\n媒体领域还有另一个与娱乐方面大相径庭的维度，那就是新闻与新闻业。新闻和新闻业在社会中承担着多种关键职能。它们的作用不仅仅是提供信息，还包括塑造公共话语、保障问责制，以及反映公众多元的声音和关切。与娱乐领域相比，这个领域目前在面对超级\
  \ AI 导致的就业机会损失方面显得更为稳健。这个领域承担着多种职能，其中一些关键职责包括：\n\n1.  收集并传播与地方、国家乃至国际层面的公共利益相关的真实、准确、及时的信息。记者和新闻工作者在身处关键职位的人群中拥有深厚的人脉网络，从而能够及时捕捉到正在发展的事态。这是一个相当临时和不可预测的过程，因此难以通过超级\
  \ AI 实现自动化。然而，随着对公共区域和办公室的环境监控日益深入，超级 AI 或许能越来越接近捕捉重要新闻，但这似乎仍有很长的路要走。\n2.  新闻工作者也监督权力的运行。通过调查和揭露腐败、渎职及其他不当行为，他们确保相关个人、组织乃至政府，为了公众利益，为其行为承担责任。这项工作的性质与第一项职能类似，因此目前也超出了超级\
  \ AI 的能力范围。\n3.  新闻业也提供了一个公共辩论的平台，确保多元的声音能够被听到。超级 AI 或许能够提供这样一个平台，但要以一种及时且得体的方式来管理它，并容纳那些在受到刺激时本质上难以预测的人类参与者，这对超级\
  \ AI 来说可能相当困难。\n4.  记者和编辑利用其强大的语言技能，对复杂议题（从科学创新到错综复杂的法律和政治问题）进行深度分析，并根据自身经验发表个人见解。超级\
  \ AI 能够处理分析部分，但就目前而言，发表见解可能比较棘手，还需要更多时间。\n\n总体而言，超级 AI 可以协助记者收集历史事实并整合大量的研究成果，但无法取代现有的从业人员。\n\
  \n## 公共服务\n\n在就业市场中，公共服务占据了另一个重要份额。前面描述的一些角色，例如教育、法律事务等，也可以归入这个领域。在本节中，我们将重点关注剩余的职业类别。\n\
  \n健康与公共服务是该领域的一个重要方面。这一类中的一些角色，例如公共卫生官员、社会工作者、儿童保护官员和环境健康专家，可能以志愿形式存在，也有一些是由国家资助的。与迄今为止我们考察的大多数其他职业类别相比，这些角色中的大部分其工作描述并不那么明确，即使他们的最终目标广为人知。从本质上讲，这些角色相当开放，因此相对安全，不易受到超级\
  \ AI 的入侵。\n\n该领域中另一个定义明确的类别是公共安全。消防员、警察、紧急医疗技术人员（EMT）、惩戒官和缓刑监督官都属于这一类。这些角色中的大部分工作都需要强大的体能存在和公共关系能力的结合。超级\
  \ AI，配合适当的机器人设备，可以辅助这些操作，使人类显著提高效率，但在可预见的未来，它们不太可能取代这些官员，消防员除外。消防员似乎是这一类中最有可能被完全替换的角色，可以用超级\
  \ AI 驱动的机器人和自动化机械来取代。这项工作伴随着严重的风险，但其操作流程相当常规，可以基于简单的视觉（摄像头）检查进行准确评估。\n\n\n\n###\
  \ 交通运输\n\n交通运输是驱动大量就业的另一重要因素。这也是一个可能因 `SuperAI`（用于交通运输）或 `SuperTransAI` 而面临大规模失业风险的岗位。交通运输涉及多种方式，例如陆路、水路和空路。\n\
  \n在陆路交通领域，所有角色都可以被归结为从 A 点驾驶到 B 点。这可以是使用大型半挂卡车运输货物的卡车司机，也可以是运送群体乘客或儿童的巴士司机，还可以是运送小团体或个人通勤者的出租车司机。所有这些角色都涉及在道路上驾驶汽车。到\
  \ 21 世纪第三个十年，大多数汽车都采用了某种形式的自动驾驶功能，例如`自适应巡航控制`，它可以保持恒定速度，并在前车减速时自动刹车，待情况变化后重新加速；或者`紧急制动系统`，它能检测到路径中意外的行人或物体并自动刹车。一些汽车还能保持在指定车道内行驶，根据需要微调方向盘，甚至通过按下按钮自动变道。结合这些功能，汽车几乎可以在高速公路上自动驾驶。基于一组卫星的`GPS`（全球定位系统）已经集成到大多数汽车和智能手机中，能够提供逐向导航。将前面列出的自动驾驶功能与`GPS`系统相结合，全自动驾驶汽车已离我们不远。一旦系统建立，道路交叉口可以安装额外的传感器和电子信号系统，以进一步提高自动驾驶的精度。全自动驾驶汽车可以彻底改变游戏规则，私家车将变得多余。每当需要出行时，只需一个像`Uber`这样的智能手机应用，你的车辆就会在短时间内到达。拼车可以得到优化，总体污染也能大幅减少。自动驾驶运输还可以改善订单配送，降低运输成本，从而有效降低商品成本。\n\
  \n水路运输可能更容易实现自动化，因为处理的交通流量和不可预测性要少得多。大多数船舶都配备了一系列传感器，用于捕获周围水域的数据，例如水深、鱼类和其他物体的存在、水下山脉和冰山等。它们还拥有全面的通信系统，用于监测天气数据以及附近其他船舶的信息。目前，所需船长数量与船舶可载人数之比非常低，因此保留人类船长职位的成本很低，这使得对其自动化的兴趣不大。然而，如果情况紧急，对于`SuperTransAI`来说，自动化这项工作似乎是一件轻而易举的事。船上的其他角色，如工程师、餐饮相关职位、乘客管理职位，已经在不同背景中被考虑过，这些角色的命运同样适用于此。\n\
  \n接下来是空运领域。在大多数现代飞机中，飞行员的作用已经被自动驾驶功能大大削弱。这些自动驾驶功能已经能够完成多项关键的飞行操作，例如：(1) 将飞机保持在指定方向。(2)\
  \ 将飞机保持在指定的海拔或离地高度。(3) 以特定的爬升率或下降率将飞机升高或降低到预选的高度。(4) 将飞机保持在指定速度，无论是指示空速还是`马赫`数，具体取决于高度。(5)\
  \ 更进一步，这些系统还可以在指定速度下改变高度。飞机会以选定速度自动爬升或下降，直到达到指定高度。(6) 结合这些能力，自动驾驶仪还可以根据输入到`飞行管理系统`（`FMS`）中的航点来遵循预定路线。(7)\
  \ 控制飞机的垂直轨迹，以遵循基于特定航点高度限制的预设剖面。(8) `自动着陆`：在拥有高级自动驾驶系统的飞机上，自动驾驶仪可以执行全自动着陆，处理飞机在最终进近、着陆甚至滑跑部分阶段的操作。这在能见度极低的情况下特别有用，并且仅与某些类型的仪表进近程序结合使用。(9)\
  \ `空中交通防撞系统`（`TCAS`）集成：在一些先进系统中，如果出现交通冲突并且`TCAS`发出决断咨询，自动驾驶仪可以自动调整飞机的垂直路径以避免冲突。总而言之，将所有这些功能与本书写作时的自动驾驶系统相结合，几乎可以完全取代飞行员。只有在起飞和即将着陆前才需要人类飞行员在场，而且在某些情况下甚至并非必需。然而，这些系统仍处于早期阶段，需要更多时间成熟。但在不久的将来，随着`SuperTransAI`准备接管，飞行员的工作显然已濒临灭绝。\n\
  \n到目前为止，我们已经审视了横跨不同市场领域的相当全面的职业列表，以及它们中的每一个将如何因我们所见过的`SuperAI`及其各种变体的出现而受到影响。我们可能还遗漏了许多更细微的职业，但基于此前的讨论，人们可以很容易地推断出`SuperAI`对它们的潜在影响。总之，很明显，`SuperAI`将从根本上改变我们对工作和职业的看法，我们需要在相对较短的时间内适应这些变革的时代。透彻理解驱动`SuperAI`的技术，将有助于我们更精确地评估这项技术的影响，并帮助我们满怀信心地为近期的未来做好准备。迄今为止所有章节的首要目标，就是帮助当代和未来的几代人全心全意地接纳`SuperAI`，欣赏它所带来的所有益处，并与它协同工作，使我们的未来更美好——一个我们不仅能够生存，而且能与`SuperAI`一同繁荣兴盛、开启通往更美好明天冒险旅程的未来。\n\
  \n\n\n## 伦理与超级人工智能\n\n“人孰无过，宽恕为上。”英国诗人亚历山大·蒲柏在其诗作中基于文学批评语境写下此句，但这句话本身已超越原意，在更宏大的人类语境中成为引述。它强调了人类易错的本质，指出即使怀着最善意的初衷、做了最充分的准备，人人都会犯错，且犯错亦无妨。导致犯错的原因有多种，例如无知、误解或误判。这句话的另一面则探讨宽恕。在讨论宽恕是否恰当之前，我们需审视：谁有资格宽恕？换言之，谁受到了错误决策的影响？人生每一步，我们都面临选择。有些选择带来善果，有些则带来不善之果。决策者掌握的权力越大，决策的影响就越深远。决策的覆盖面越广，受影响的人就越多。若个人在私生活中做出决策（无论好坏），可能仅波及亲友；若组织高管做出决策（无论好坏），则全体员工都会相应受到影响；若一国总统做出决策（无论好坏），该国全体公民乃至他国都可能受到影响，以此类推。\n\
  \n回到就事论事地讨论宽恕：犯错者的亲友是否应宽恕其错误决策？员工是否应宽恕高管的错误决策？所有受影响国家的公民是否应宽恕总统？这些问题没有标准答案，唯一合理的回答是“视情况而定”。这取决于错误决策的类型、影响程度，以及决策者偏离伦理道德指引有多远。伦理或道德是终极指南针，在我们面临重重选择时指引方向。它研究何为对、何为错。这些永恒问题自人类起源起，自我们的大脑开始运作之时，自我们成为地球生态系统一员之始，便与我们如影随形。做出恰当决策的哲学，即伦理，居于全人类的核心，是一门需要我们随着科技、文化和日常生活的进步而不断发展的永恒学科。\n\
  \n在常规人工智能机器时代，使用某项技术的伦理影响大多局限于技术本身；但随着类人超级人工智能浪潮的到来，我们需要重新审视这些影响。超级人工智能的能力将覆盖几乎所有操作领域，并在不远的将来触及人类生活的方方面面。因此，这种影响将跨越国家、大洲、种族、宗教、性别、年龄等界限。面对如此广阔的覆盖范围及其伴随的力量，超级人工智能应被赋予与全球最高标准相匹配的责任与担当。超级人工智能将真正引领我们进入“地球村”时代——地球如同一国，而超级人工智能则是真正的全球公民。超级人工智能的触角将如电流般通过线缆或波束流动，滋养沿途万物。随之而来的全球性责任与担当，需要由构建超级人工智能的个人或组织，与超级人工智能本身共同承担！是的，毋庸置疑，参与提供超级人工智能的机器，亦可称为超级人工智能的具身载体，在参与决策时，必须像人类一样被追究责任。然而在初期阶段，开发和训练超级人工智能机器的组织将承担大部分责任与义务。在深入探讨伦理如何运作的细节之前，我们需要建立跨越所有宗教、信仰和文化，并与人类\
  \ DNA 本身紧密交织的伦理基本准则。\n\n1.  己所不欲，勿施于人。这一简单表述蕴含深刻含义，包括：\n    1.  不造成伤害\n    2.  尊重\n\
  \    3.  相互信任\n    4.  诚实\n    5.  同情\n    6.  最重要的是对生命至高无上的珍视\n\n2.  遵守规则。当一个社群或文明建立时，会制定一套基本规则以确保其成功。作为该社群或文明的一员，应积极参与必要规则的制定，而了解并遵守规则则至关重要。\n\
  \n### 立足全球\n\n超级人工智能将在未来数年在所有既定工作流中创造前所未有的机遇，正如本章前述讨论，大量或大或小的组织将参与其中。这些组织可能位于世界任何角落——无论是印度的一座小城、中国的一个乡村小镇、韩国的一处郊区、欧洲的一个村庄、澳大利亚的一片城区、非洲大陆的一个行政区，还是美国的一座大都市——毋庸置疑，它们将要构建的技术将应用于全球范围。因此，在构建任何技术时，拥有全球思维至关重要。\n\
  \n“全球”这一概念包含多重含义，让我们逐一审视。\n\n1.  *理解文化*：人工智能系统应设计为能够理解并尊重世界各地不同的文化规范和价值观。若缺乏全球思维，超级人工智能系统可能无意中强化刻板印象和偏见。\n\
  \n2.  *包容性*：如果人工智能仅基于特定地区或人群的数据构建，则可能对其他群体效果不佳甚至产生偏见。全球视角能确保多样化的观点和需求得到满足。\n\n3.\
  \  *平等*：人工智能技术存在加剧全球阶层分化的风险。全球思维有助于设计出尽可能多的人能够负担和使用的解决方案。\n\n为应对这些影响，必须在技术工具方面进行投入，例如：\n\
  \n1.  *本地化*：人工智能解决方案通常需要针对不同国家的特定需求、语言和法规进行本地化。若未能如此，可能产生无效甚至有害的应用。\n\n2.  *隐私*：不同地区对数据保护有不同法规（例如欧盟的《通用数据保护条例》）。全球思维对于驾驭这些复杂且可能相互冲突的法规至关重要。\n\
  \n为便于在全球化的环境中进行开发，协作至关重要。人工智能旨在解决的许多挑战（如气候变化、医疗保健）本质上是全球性的。全球视角能促进国际合作，汇集资源与专业知识，也有助于理解地缘政治问题、协调法规等。\n\
  \n\n\n#### 公平公正的归因\n\n这是伦理学领域中又一个需要谨慎处理的难题。为了确保人工智能系统以公平公正的方式运行，应遵循若干原则。\n\n1. \
  \ **透明与问责**：首要原则是确保超级人工智能系统透明且可问责。这意味着必须能够理解超级人工智能系统的工作方式，并让其对自己的决策负责。这可以通过提供关于超级人工智能系统如何训练的清晰文档，以及使用诸如可解释性之类的技术来使人们更容易理解人工智能系统如何做出决策来实现。\n\
  \n2.  **消除偏见**：另一个重要原则是避免超级人工智能系统中的偏见。这意味着超级人工智能系统不应针对特定人群（如种族、性别或性取向）存在偏见。这可以通过使用诸如去偏见之类的技术来消除超级人工智能系统中的偏见。\n\
  \n3.  **社会平等**：考虑超级人工智能系统的社会影响也同样重要。这意味着要思考超级人工智能系统将如何被使用，以及它可能如何影响不同的人群。这可以通过进行影响评估，来识别超级人工智能系统的潜在风险和收益。\n\
  \n4.  **贡献归属**：最后，建立一个清晰客观的流程，用于对超级人工智能系统的工作成果进行贡献归属至关重要。这意味着要确保人工智能系统的创建者，以及所有参与创建用于训练人工智能系统的内容和数据的个人和实体，都能因其工作而获得应有的认可。每当使用专利思想或开源材料时，都应给予创建者适当的署名和致谢。在商业环境中，这种归属也意味着要建立一个简化的流程来进行适当的财务安排。\n\
  \n#### 诚实守信\n\n用于开发超级人工智能系统的算法相当复杂，它们为了训练出成熟的系统而处理的数据量极其庞大。即使是参与此类工作的人类，也可能在巨大的复杂性中迷失方向，并可能编造出不完全真实且无法用确凿证据支持的信息。然而，考虑到超级人工智能系统将要做出的关键决策及其将推动的全球影响，它们应当被置于更高的标准之下。超级人工智能系统应始终真实准确，不应自行编造（即所谓的“幻觉”），并准确地反映现实世界。它们不应成为虚假新闻或声明的传播者，误导公众。它们应始终能够支持自己所提出的主张。持续诚实的行为能够培养信任感。以下是一些原则，可确保超级人工智能系统长期保持诚实可靠的行为：\n\
  \n1.  **透明性**：我们在前文中已经探讨过透明性的定义，但在此处，从训练中使用的算法和数据角度来看的透明性尤为重要。在许多情况下，由于许可方面的原因，完全透明可能无法实现，但超级人工智能系统的制造者应尽一切努力，向用户提供系统运行背后的全貌。\n\
  \n2.  **可解释性**：使用可解释模型是达成这一目标的起点。许多人工智能模型，包括基于神经网络的模型，可能会变得过于复杂，以至于实际上无法识别其生成预测或建议背后的原因。然而，超级人工智能系统的制造者应从一开始就将可解释性纳入考量，并确保用户从第一天起就能使用。\n\
  \n3.  **问责制**：我们在前文也提到了这个方面，但在此我们需要从技术角度来看待问责制。任何超级人工智能系统，即使经过所有预防措施的训练，仍然可能犯错。在这种情况下，系统应主动承担错误，提供报告此类错误的正式渠道，并说明未来将如何减轻和修复问题。用户了解系统的局限性，当系统提供这种程度的问责时，就能建立信任。\n\
  \n4.  **准确性**：超级人工智能系统应始终基于真实、可靠的现实来源进行驱动。使用合成数据总有更便宜的替代方案，但应尽可能避免。这也有助于捕捉世界的真实趋势，避免系统中出现无意的偏见。同时，在营销系统时，应克制夸大其词的冲动。人们可以轻易地操纵测试框架以产生过于乐观的结果，这必须避免。用户最终是真正的评判者，如果他们发现声明与实际性能之间存在差距，超级人工智能系统将永远失去信任。\n\
  \n5.  **长期保障**：保留系统运行的详细记录和长期日志，是确保系统长期正常运行的关键。这些日志有助于监控系统随时间推移的性能，以及调查和理解系统所做出决策的趋势。持续监控和更新系统，并通知用户相关情况，将使用户愿意一次又一次地使用该系统。\n\
  \n#### 生命的价值\n\n最后，但同样重要的是，生命的价值构成了伦理学中最复杂且相对模糊的方面，尤其是在人工智能的应用领域。下面是一个经典的难题，用来说明在自动驾驶汽车背景下这一概念。\n\
  \n设想一辆自动驾驶汽车以相当高的速度（但仍然遵守限速）在道路上行驶。突然，一群儿童出现在道路上横穿马路。汽车应该怎么做？假设直线刹车已无可能。因此，如果汽车继续直行，即使全力刹车，也必然会撞上这些儿童。另一个选择是急转弯以避开。以汽车当前的速度进行这样的急转弯，很可能导致车辆翻滚，杀死车内人员。驾驶汽车的超级人工智能应该如何选择？\n\
  \n似乎没有正确答案，因为两种选择都可能导致伤害。一方面，汽车不应该被编程为杀害人类，因为这违反了不伤害人类的原则。另一方面，汽车也不应该被编程为使驾驶员和乘客面临严重受伤或死亡的风险。系统应该优先考虑更年轻的儿童，而不是年长的驾驶员和乘客吗？还是应该优先考虑驾驶员和乘客，因为他们遵守了基本的交通规则，而儿童是违反规则的一方？\n\
  \n无论哪种方式，未来的超级人工智能系统都需要解决此类问题，并在毫秒甚至微秒内做出恰当的反应，以产生影响。以下是超级人工智能系统需要处理的其他一些伦理困境示例：\n\
  \n1.  在决定谁获得器官移植时做出选择。\n2.  操作为自主作战而构建的军事超级人工智能系统，使其仅针对“坏人”采取行动。\n3.  使用超级人工智能在财务预算范围内做出保险决策，决定谁获得危及生命疾病的批准。\n\
  4.  以及更多……\n\n\n\n## 结论\n\n`SuperAI` 即将改变我们所熟悉的二十一世纪人类生活。其影响将相当深远，并有可能为我们的生活带来翻天覆地的变化。若真想从中受益，我们确实需要为此做好准备，因为这种变化将来得相当迅猛。前述各章节以及本章的内容，将为我们应对这一变革提供必要的概念基础。\n\
  \n在下一章中，我们将目光投向更遥远的未来，大约在“明天”之后的一两个世纪，并尝试思考机器智能的演进将如何改变人类自抵达地球以来已延续数十万年的生活方式。我们将审视人类从狩猎采集时代到现代高度互联的都市，为满足基本需求而赖以生存的根本原则。我们将尝试重新思考和构想一种更好的方式来组织未来的社会政治结构——在这个未来中，我们与\
  \ `SuperAI` 共享生活，让世界变得更美好，并使我们人类做好准备，成为地球真正的全球公民，进而成为宇宙公民，接管太阳系及更远的疆域！\n\n脚注 1 2\n\
  \n"
- '# 8. 智慧人类


  ## 超越与展望


  在探索理解智能的征程中，我们从地球生命的起源出发，审视了历史如何引领我们走到今天。我们甚至探讨了随着机器智能向类人 `SuperAI` 演进，潜伏在地平线上的变化，以及如何做好准备、应对挑战，走向更美好的明天。在本章中，我们将超越明天的地平线，望向更远方——未来数百年乃至数千年的景象。


  多数时候，我们固然必须活在当下，解决眼前的问题，但仅凭这种短视可能并不足够。作为地球上最聪明的物种，我们还需要看得更远，为明天、后天以及更远的未来做好规划和准备。确保我们走上繁荣而非灭绝的长期道路，这并非一厢情愿，而是我们的必要之举。预测近期未来并保持与现实一致总是相对容易，但要评估更遥远的未来则通常异常困难，以至于几乎沦为纯粹的虚构。每一年都建立在前一年的基础之上，随着每年的变化不断累积，时间走得越远，预测就变得越不可靠、越不确定。诚然，当我们向未来推进得越远，我们所依据的假设就越多，很快这一切就可能感觉像是与现实脱节的凭空想象。尽管如此，我们仍将诚实地尝试一番。评估和判断更长期的未来涉及多个方面。日常生活的某些方面，在数千年后很难预测，就如同中世纪鼎盛时期（公元
  1000 年至 1250 年）的人们无法预测我们二十一世纪的日常生活一样。然而，那个时代的人们仍能在人性的基本原则方面与我们产生共鸣，例如以食物和住所为形式的生存基本需求、肉欲与繁衍能力、从生到死的生命周期、追求幸福与安宁的动机、与他人社交、探索新机遇与娱乐等等。我们将基于这些根本支柱展开讨论，以评估和探索超越当下、远在前方的事物。


  在深入探讨之前，让我们花点时间来敬畏进化的宏伟壮丽——人类正是其中闪耀的杰作。作为这份遗产的守护者，我们肩负着庄严的责任，确保这部壮丽的史诗不会过早落幕。


  ## 人类 DNA


  尽管世界各地不同种族、不同地区的人们呈现出千差万别，但地球上的所有人类共享着同样的 DNA，其最大差异仅有微不足道的 0.1%，即千分之一的差异。具体来说，在我们的
  DNA 所包含的 30 亿个核苷酸中，预计只有大约 300 万个核苷酸存在差异。简而言之，所有人类都极其相似。那么，创造圣雄甘地、特蕾莎修女、马丁·路德·金或纳尔逊·曼德拉的基因，与创造某些世界上最恶劣的罪犯和恐怖分子的基因几乎是相同的！那么，我们又如何解释他们行为上的鲜明反差呢？唯一合理的解释是，他们成长环境的极端差异、童年早期经历的不同，以及从出生起就受到周围人影响而产生的互动，才是罪魁祸首。所有人类婴儿出生时都如同一张白纸，一张由几乎相同的遗传物质构成的朴素画布，随时准备适应任何抛向它们的事物。那么，为什么有些画布上绘出了美丽的图画，而有些则上演了恐怖的篇章？所有这些婴儿所面对的环境为何会发生如此剧烈的变化？这并非在几年、几十年甚至几个世纪内发生的突变。这是数千年来逐渐酝酿的结果！





  ### 双刃剑


  我们将互联网的到来称为信息革命，但真正意义上的第一次信息革命远比这要早得多。那是数千年前发明的终极工具，它让我们得以超越地球上所有其他物种；它保存并承载着偶然或通过其他方式获得的、跨越数百代人的每一点知识；它赋能每一代新人，帮助他们避免重蹈前人的覆辙，并迈向更高的高度。我们几乎没有意识到，正是这同一件工具，也负责承载着前代所有的恐怖、欺骗、暴行和淫秽，并让每一代新人背负着越来越多的愤怒、沮丧和复仇的理由。它将数千年的污秽注入他们的血脉，引导他们犯下骇人听闻的暴行！那就是书写技能的发现！！在文字发明之前，人类数千年来与其他灵长类动物并无太大区别，在智力优越性方面也几乎没有表现出什么进步。


  与人类行为形成对比的是，我们不会看到一个黑猩猩群体计划攻击邻近群体，为其祖先几百年前的行为复仇；我们只可能看到它们在今天食物短缺，而其他群体的区域有更丰富的食物资源时，才会攻击邻近群体。我们不会看到几只鹦鹉兄弟攻击另一只鹦鹉，因为它们的曾祖父在
  50 年前曾卷入一场求偶竞争。对于所有其他物种，所有诸如打斗、冲突、分歧甚至杀戮之类的恶行，都会在极短的时间内被遗忘；最多持续到当前这一代结束。每一代新生命几乎都能从零开始，无需背负前代过多的包袱。


  有了文字，我们可以记录信息，在人类大群体中分享，并且信息在记录者死后依然留存。信息本质上变得永恒了。这个看似简单的创造将我们与其他所有物种区分开来，造就了今天的我们！没有其他物种能够记录并将信息代代相传，除了通过基因传递的那些。世界上潜伏的大多数邪恶，确实源于数代前发生且未受惩罚的不公。恐怖分子的诞生，正是由于这些过去未被减轻的恐怖不断地被重申，它们回来纠缠着后代。在道德的岸边浮现出问题：因为祖先的过错而惩罚后代，这公正或合适吗？通过对后代施加类似的恐怖，能纠正一代人所犯的错误或罪行吗？从暴行中走出来，成长并繁荣，难道不是一种最好的复仇吗？向世人展示前代所遭受的罪行并未拖慢后代的脚步，反而让他们更加专注，使他们比以往任何时候都更强大、更繁荣，难道不是最合适的了结吗？


  文字还有另一个非常关键的缺陷：它所传达的信息并不包含完整的背景。这些信息几乎总是带有偏见、片面，并且在大多数情况下是不完整的。信息将作者的思想和主观观点与真实事件和轶事交织在一起，编织出一幅看似历史却难以捉摸的图景。此外，阅读信息的人会在解读信息时混合自己的观点和倾向，使其进入另一个层次的抽象。我们经常看到信息在多人传递游戏中是如何被扭曲的，最终揭示出最后一个玩家所感知的版本；再加上数百年的时间跨度，以及来自不同地区、语言细微差别发生变化的人们参与其中，然后想象一下信息会被扭曲成什么样子。从这些信息中学习，以提高我们当下的技能，让我们的生活更美好、更安全，这是一回事；但当我们利用这些信息，以某种方式将自己代入其中的角色，并想着利用这些被扭曲的信息，在几十年或几百年后寻求复仇时，那完全是另一回事了。换句话说，书面信息无法传达完整的背景，而不完整的背景跟没有背景一样糟糕。因此，对待书面信息应有的精神是，只将其中信息用于改善今天和明天，而不是其他目的。


  要真正解决核心问题，我们需要让这把双刃剑的一侧变钝，同时让另一侧一如既往地锋利；或者换句话说，我们需要在保留所有美好、发明和创造的同时，忘却过去的恐怖。这不是一项容易的工作，相反，如果我们立志要解决它，这可能是我们面临过的最艰难的任务之一。所有古老和历史性的恐怖都与当代的社会建制相关联，而我们一直在经历着它的渐进式演变，从而使其背景得以延续。令人惊叹的是，过去所有好的部分，比如所有的创新和创造，都是自足且脱离背景的；只有过去的恐怖才需要背景，而且是破碎的背景。这里的背景概念指的是社会、政治和宗教环境。即使我们能找到数百个不同的例子，过去大多数暴行的主要根源可归因于：（1）扩张领土以增加财富、权力或控制的意图；（2）传播意识形态、宗教或生活方式；或（3）报复因前述因素之一而发生的过去暴行。


  在解决我们社会结构这一错综复杂的织锦时，重新构想我们框架的基础或许会有所裨益。想象一位艺术家，凝视着一块崭新的画布，准备创作一幅杰作。这个新的范式，受不可改变的自然法则约束，以我们共同人性的本质为基础，可以为我们未来的社会提供一个充满希望的前景。当我们为这座重建的大厦铺设砖石时，我们就开始了愈合的过程，远离过去岁月的阴影。虽然我们这一代人的集体记忆可能带着历史的印记，但未来的几代人可能会将它们视为古老的民间传说，是与他们的现实脱节的故事。可以把它想象成清理我们历史阁楼中的杂物，为新的故事腾出空间，同时装备着我们时代最先进的工具和知识。这些来自过去的教训，虽然宝贵，但可以取其精神而非拘泥于具体的轶事，就像来自遥远星系的传说一样。正如探险家梦想在异星土地上重新开始一样，我们可以用自身人类
  DNA 的惊人力量，以及数十万年的学习成果，武装自己，就在地球上重新定义和复兴我们自己的文明。这样一场变革性的旅程不会凭空发生；它需要一个有原则的路线图。我希望在接下来的章节中，为这个新时代的迁移提供一个全面的蓝图。




  ### 正态分布


  1777 年，在德国的一个小镇上，诞生了一个有朝一日将改变科学和数学世界的孩子。他的名字叫卡尔·弗里德里希·高斯，被认为是古往今来最杰出的数学家和科学家之一。高斯是个神童。他能在脑中完成复杂的数学问题，并且在很小的时候就能够在天文学家发现彗星之前预测出它的轨道。成年后，高斯在数学、物理学和天文学等多个领域做出了开创性的贡献。然而，高斯最广泛使用但相对仍被低估的发现之一，是一种概率分布，即正态分布或高斯分布。该分布遵循一条钟形曲线，如图
  8-1 所示。它经常被用来描述许多现象的分布，例如任何人群的身高分布、股票价格的涨跌分布、新生婴儿的体重、多次抛硬币的结果等等。简而言之，高斯分布具有一些非常优美的性质。首先，它是一个对称分布，对称轴和曲线的中点都在峰值处。峰值位于分布的中心意味着具有平均值的样本数量，相对高于那些远离平均值的样本数量。而且，当我们远离中心时，两侧的样本数量都会减少。整个分布仅由两个参数定义：均值（`μ`）和方差（`σ²`）（或标准差（`σ`），即方差的平方根）。均值是分布中心的值，方差定义了当我们从中心向任一方向移动时，数值下降的速率。换句话说，它提供了关于分布反差的信息。如果方差值为
  0，那么我们会得到一个平坦或均匀的分布，所有样本都具有相同的值。随着方差值的增加，分布会变得更加陡峭，两侧急剧下降。


  ![](img/603991_1_En_8_Fig1_HTML.jpg)


  一个折线图，标题为高斯曲线，显示了概率密度与 `x` 的关系。它绘制了一条钟形曲线，x 轴从负 5 到 5，其中 `mu = 0` 且 `sigma square
  = 1`。


  **图 8-1** 高斯分布


  当存在数百种其他可能的分布时，为什么这个分布如此特殊？这个问题的答案在于另一位不太知名的数学家亚伯拉罕·棣莫弗的发现，该发现后来由皮埃尔-西蒙·拉普拉斯进一步完善。这个发现被称为“中心极限定理”。为了理解这个概念，我们需要深入一点数学，但请耐心听我解释，我们很快就会回到对一般概念的描述上。


  中心极限定理为“分布的分布”提供了一个数学框架。用专业术语来说，它指出：如果你取任意一个分布（不一定是高斯分布，如指数分布、泊松分布、伽马分布等），然后取该分布的平均值（也称为均值），并观察这个平均值在多个分布中的分布情况，那么当分布的数量趋近于一个非常大的数时，最终的分布总是一个高斯分布。这意味着，无论你观察的是何种类型的过程，只要样本量足够大，该过程的参数都将遵循钟形曲线。这一定理对统计和概率分析产生了深远的影响，并使高斯分布成为事实上的标准工具。那么，为什么在一本关于人类进化和人工智能的书中，我们要探讨高斯曲线和中心极限定理呢？我们现在就来谈谈这个问题。


  现在让我们忽略所有理论陈述和抽象的数学，来看一些现实生活中的例子。如果我们收集了一大组数据，其中包含人类所展现的不同特征的定量测量值，例如他们的身高、体重、手的大小、手指长度，甚至智商等等。考虑一个示例图，如图
  8-2 所示，它展示了地球上所有人类身高的分布。X 轴或水平轴表示身高，Y 轴或垂直轴表示具有该身高的人数。如果我们为所有其他特征绘制类似的图形，最终都会得到相同的钟形曲线，只是均值和方差的数值不同。如果我们将类别扩展到其他生物过程，例如血压、酶活性、衰老，或者不涉及人类的物种特征，例如动物体长、树木的叶子大小、微生物生长速率、种子萌发时间等等，并绘制它们的分布，我们总会得到高斯钟形分布。这并非巧合，也不是大自然展现的某种怪癖，我们可以用数学方法通过中心极限定理证明，只要这些特征不是被刻意控制的，它们就必然会以这种方式分布。看到数学与大自然如此亲密和谐地共舞，真是一件令人着迷的事情。


  ![](img/603991_1_En_8_Fig2_HTML.jpg)


  一个折线图，标题为二十世纪人类身高估计分布，显示了概率密度与身高（单位：厘米）的关系。它绘制了一条钟形曲线，x 轴从 130 到 200，其中均值 = 165
  厘米，方差 = 49 平方厘米。


  **图 8-2** 该分布基于世界卫生组织（WHO）及其他研究收集的结果


  当我们从这些自然产生的事物转向人造事物时，情况发生了显著的变化。人类创造的基本特征之一，也是现代资本主义世界的核心，是个人拥有的财富量。人们可能会认为，既然其他所有物理和抽象的人类特征（如智商、身高、体重、体力）都遵循高斯分布，财富也会按高斯分布。一小部分财富会属于最富的人和最穷的人，而中产阶级则拥有大部分的财富。这里需要注意的一点是，当我们谈论财富的百分比时，人的数量是与累积财富相乘的，因此，在图表中会产生偏向富人的趋势，因为即使富人和穷人的数量相等，富人群体也会乘以一个更大的数值。图
  8-3 显示了这种分布，略微向左（即富人方向）偏斜。


  ![](img/603991_1_En_8_Fig3_HTML.jpg)


  一个直方图，标题为预期自然财富分布，显示了总财富百分比与人口百分比的关系。x 轴上 30 到 40 之间的值占比最高，而 0 到 10 之间的值占比最低。


  **图 8-3** 基于潜在正态分布的预期财富分布




  然而，这是一个重大的“然而”：人类所拥有的财富并不遵循高斯分布！不是略有偏差，甚至毫不接近！在世界各地，尽管存在种族、宗教、地理位置、技术进步等方面的差异，但这一观察结果无一例外。财富最常遵循的分布被称为帕累托分布，如图
  8-4 所示（该图仅显示前 50%的数据，但正如你所见，剩下的一半人口总共拥有的财富不到 4%，以至于代表他们财富的柱状图甚至无法可见）。这种分布的核心在于，大部分财富集中在极少数人手中，而剩下的大多数人总共只拥有极小比例的财富，中产阶级则恰好处于中间位置。当然，每个社会对该分布都会有些许变异，但无论如何，其形状在原则上非常相似。


  ![](img/603991_1_En_8_Fig4_HTML.jpg)


  一幅帕累托图，标题为“财富分布”，展示了总财富百分比与前 1%到 50%人群的关系。图中绘制了一条呈上升趋势的线，以及按递减顺序排列的柱状图。前 1%人群的百分比最高，而
  40%到 50%人群的百分比最低。


  **图 8-4** 任何社会中的财富分布。图表在 50%处结束，因为剩下的一半人口所拥有的财富不到 4%，其柱状图将无法可见。


  世界上任何大国家的人口，无论从哪个角度看，无疑都是一个庞大的数字，因此中心极限定理应该同样适用，就像它适用于我们之前看到的所有其他特征一样，并且我们应该得到正态分布。但事实并非如此！这里甚至没有一点高斯分布的影子。这难道不是一个异常现象吗？这难道不自然吗？这难道不是完全错误，乃至我们整个经济体系的巨大失败吗？当所有驱动地球生命形式进化、最终创造人类的生物过程都遵循着一条基本规则——一条自然法则时，人类却成功地打破了它。这个例子恰恰展示了人类的又一项非凡成就。但这是为了人类的福祉吗？打破这条规则是“好”事吗？答案将会是非常强烈的“不”！！任何心智正常的理性人士都无法争辩说，让一个人流落街头、没有食物和住所，而仅仅几百米之外另一个人却住在价值数百万美元的豪宅里、浪费掉满满一盘子食物是“公平”的。或许，前者可能在一生中犯过一些错误，而后者则做了许多了不起的事情；但这些差异足以证明这种极端对比是合理的吗？更有趣的问题是，这些错误和善行是否是他们当前处境差异的唯一原因，还是我们社会的人为规则也起了作用？从整体层面来看，人类行为仍然会遵循高斯分布，因此，观察到的财富分配极端差异必定归因于社会和文明的人为规则，这使得它们相当不自然、不公平或不公正。


  ## 货币的起源


  毋庸置疑，人类文明的现状相比几千年前已经有了巨大的进步。从最初由狩猎采集者组成的小型社区开始——他们为了资源和领土不断相互争斗——我们无疑已经走过了漫长的道路。在狩猎采集阶段，人类的主要目标是满足生存的基本需求，如食物、水和住所。社区不断地寻找这些生活必需品。由于他们没有有效的方法来为这些必需品未雨绸缪，只要生命存续，这种挣扎就一直在持续。尽管如此，改善狩猎和采集技术以及保存收集到的物资的努力从未停止，并且随着时间的推移，这些努力以我们之前章节讨论过的众多发明的形式取得了成果。农业出现了，从而提供了更稳定的食物供应。改进的建筑和工程技术提供了更可持续的住所，以及从河流和湖泊经更长距离输送的稳定水源。凭借这些发明，我们基本上走出了狩猎采集阶段。我们得以在更大的区域扩展我们的文明，并以或多或少自动化的方式提供所有基本需求。然而，数千年的执着已经刻入了人类的
  DNA，不容易摆脱。即使在实现了对基本必需品的控制之后，对更多的渴望并未消亡。它非但没有平息，反而以对更多事物贪得无厌的贪婪形式找到了新的机会。随着可持续基本资源的存在，新型文明出现了。最有权势的精英建立了基于君主制的文明，并控制了管理日益庞大的人类群体的权力。随着文明更加稳固，狩猎采集时代的物物交换系统演变成了基于货币的交换系统。随着货币的出现，财富的概念也随之产生。现在，人类不再狩猎和采集食物与水，而是狩猎和采集财富。然而，狩猎和采集的心态在失去了其原始需求和背景的情况下依然存在。那种对明天的挥之不去的恐惧，尽管不切实际，却不断推动着狩猎和采集的边界。对更多的贪婪不断增长，仿佛是在为史前人类古老的失败复仇。经过从规模各异的王国到现代世界大战之间数千场战斗和战争，对更多的贪婪依然持续。然而，自第二次世界大战以及它以核弹带来的莫名毁灭性灾难而戏剧性地结束以来，人类似乎稍微有所警醒。截至本书撰写之时，距离第二次世界大战开始已近
  80 年。人类距离和平相处仍然相当遥远，但情况比上个世纪要好得多。




  我们从过去的错误中学到了很多，但至今仍保留着一些从狩猎采集时代传承下来的基本目标，这些目标驱动着我们日常的决策。为了看清这一点，让我们回到一切开始的时代。狩猎是为了获取食物、水和住所。采集则主要是为了储备这些必需品，以便在狩猎不成功时使用。然而，在那个时代的大部分时间里，技术还不够成熟，大多数物品都是易腐烂的，因此采集的保质期很短。当不同的人甚至群体之间这些物品出现不平衡时，以物易物的制度很常见，双方通过交换商品来满足各自的需求。这些交易的公平性总是难以判断，但这种制度在数千年里运作得非常有效。


  快进到文明开始扎根的时代，货币或广义的财富概念诞生了。它的目的是在复杂的交易环境中形成一个标准参照。然而，由于可以用钱买到任何东西，而且钱越多能买到的东西也越多，因此从狩猎和采集的角度来看，钱成了唯一的焦点。此外，在古代，货币通常由金属制成，寿命非常长，这意味着它完全不会腐烂。因此，我们发明了一个了不起的工具，作为我们永不满足的狩猎和采集需求的最终体现。以前，由于商品的易腐烂性，采集超过一定限度是没有意义的。但是，有了由金属制成的永恒货币，我们希望积累足够多的财富，以满足一生甚至子孙后代的需求。这基本上解除了我们狩猎和采集欲望上的所有限制。积累更多的钱不仅能让你获得购买更多商品的能力，还能让你获得控制他人的权力，因为别人为了换取金钱愿意为你做事。于是，货币不再仅仅是交易的参考单位，也成了一种控制他人的武器。它也成为盗窃的唯一目标。偷钱比偷商品更好，因为商品会腐烂，而钱是永恒的。有了钱，你可以随时随心所欲地购买任何东西。


  那么问题就来了：货币可以有多少？在早期，货币与稀有金属（如金、银）或宝石紧密挂钩。由于任何王国或国家的这些"商品"数量有限，货币的总量也就有限。后来，当携带金属硬币变得过于困难时，纸币被发明出来；但它仍然由银或金作为支撑，纸币只是由该王国或国家批准使用的一种凭证形式。这种货币被称为商品支撑货币。这种货币的定义显然没有将人们能提供的服务和其他自然资源、能采集的物品、或能制造的工具及其他人工制品纳入默认价值，从而限制了文明所能积累的财富规模。随着时间的推移，随着现代文明开始扎根，商品支撑货币的局限性变得明显，这一概念进一步演变成了我们今天使用的形式。它被称为法定货币。


  尽管法定货币使用的最早记录可以追溯到 11 世纪的中国，但现代世界首次使用它是在 17 世纪，当时阿姆斯特丹银行发行了不由黄金或白银支撑的纸币。如果货币不由黄金、白银或任何其他商品支撑，那么显而易见的问题就是：谁来决定货币的总量？为了回答这个问题，让我们看看"fiat"这个词的含义。它是一个拉丁词，意思是"让它被完成"。这里严格遵循了这个含义。当一个国家创造了一定数量的货币时，它就被该国的管理机构宣布为法定货币。法定货币的价值基于人们对发行它的政府的信任。


  首先，法定货币解除了货币必须依赖于固定商品可用性的限制，理论上这种货币可以无限供应。然而，这种灵活性带来了多种风险，例如货币价值的波动性，这取决于政府的稳定性、人民对政府的信任度，甚至国际贸易形势。通常，人们期望政府能以最佳方式处理货币，但有很多例子表明，一个国家的货币在短短几个月甚至几周内完全崩溃，使得人们一生积累的财富在短时间内几乎一文不值。


  通常，任何稳定政府创造的法定货币数量取决于五个因素：（1）经济增长：当经济增长时，需要更多的货币，这是政府或央行印刷更多货币的充分理由。（2）通货膨胀：通货膨胀被定义为物价普遍上涨，从而导致货币购买力下降。通货膨胀本身是一个波动且相当难以预测的实体。然而，当通货膨胀高涨时，政府可能会创造更多法定货币以试图刺激经济。（3）政府支出：政府可能仅仅为了资助其自身的支出（例如社会项目或基础设施项目）而决定创造更多法定货币。（4）金融或政治危机：这些是波动性情况的额外例子，可能与通货膨胀大不相同。在这种情形下，政府同样可以创造更多法定货币，以期稳定经济。然而，创造额外货币来修复糟糕的经济状况，本身也可能成为使情况恶化的根本原因，从而形成一个恶性循环。




  ### 商品本位货币的隐性问题


  任何商品本位货币的另一个隐性问题在于，总体财富受限于某种固定商品的可得性。在这种有限的财富之下，所有公民都会自动陷入零和博弈。零和博弈是指整个系统中总收益与总损失相加为零的状态。在这样的系统里，一个人或实体的收益成为另一个人或实体的损失，从而将所有个体置于彼此对立的位置。原则上，这培育了一种竞争环境，使得双赢局面变得不可能。这不仅造成了固有的敌意，还为社区所能创造的总财富量施加了不自然的限制。任何对自然资源的新创造或发现，实际上并不会增加社会所衡量的财富。


  想象两个拥有等量黄金的王国，但其中一个文明的人们极其勤劳，生产着高品质的食物、工具和住所，而另一个文明的人们只是虚度光阴。这两个文明应该有同等的财富吗？一个商品本位系统会回答："是的"！即使这对我们来说显然是不合理的，我们却生活在非常类似的环境中。法定货币试图通过允许按需创造额外财富来解决这个问题。然而，这些财富的创造由单一实体管理，因此更多货币/财富的创造与社会的创新成果并无直接关联，而且在大多数情况下，这种财富的增发只会稀释货币价值，实际上使得总体财富保持不变。


  我们不知不觉地把自己束缚在了闪亮硬币的黄金枷锁之中。通过创造货币，我们并未真正提升人类所能实现的潜力，反而将其限制在了一个微不足道的有限总和上。货币的创造剥夺了本应由自然和我们自身能力赋予的无限财富。


  ## 股票市场与进一步的抽象化


  在法定货币带来的复杂性之上，金融行业又通过股票市场或证券的形式，看到了另一层抽象维度。股票本质上是一家公司的一小部分。一家公司可以拥有成千上万的此类股票。人们可以在一个名为股票市场的市场上买卖这些股票。任何在股票市场上市交易的股票的公司都称为上市公司，它现在由所有持有其股票的人共同拥有。这是为公司运营筹集资金的一种方式。股票市场的起源以及股票的整体概念备受争议，但一些早期的例子包括十七世纪初荷兰和英国东印度公司的创立。


  股票的概念本质上是在法定货币之上创建了一层处理公司单位或部分的抽象层。现在，我们讨论的不再是由政府发行的货币，而是对一家公司的估值。因此，根据公司在市场上的表现，其估值或股价可能会以基础货币计价波动，而基础货币本身也如我们之前所见是波动的。


  尽管东印度公司开创了股票的概念，但现代股票市场直到十九世纪工业革命启动全球经济增长时才建立。美国的第一批证券交易所成立于十九世纪初，特别是纽约证券交易所（NYSE）成立于
  1817 年。很快，管理金钱就成为了管理股票市场投资的同义词。


  如前所述，人类狩猎和采集的永不满足的贪婪，在股票市场中得到了更为迅猛的滋养。积累起金钱后，如果把钱存在银行，其增长相当有限；但如果你投资股票，就有机会在不实际付出任何劳动的情况下，以更快的速度增加你的财富。公司及其员工在完成所有工作，而如果你能设法识别出一家在近期或长期内会比竞争对手表现更好的公司，你便投资其股票，它就会随着该公司的增长而增长。


  然而，要理解市场并系统地预测哪家公司表现更好，需要进行广泛的研究，这本身可能花费大量资金。没有这样的研究，人们只能碰运气，或根据可获取的部分信息做出稍显明智的猜测。但与那些在市场研究上投入更多精力的机构相比，基于纯粹运气或片面信息的猜测长期来看总是会输，这无需任何复杂公式来证明。因此，只有富人才能更好地理解股票市场，从而变得更加富有。


  为了使系统更为复杂，还有共同基金和期权链等概念。共同基金由不同比例的多个公司的股票组成。人们现在可以购买一只共同基金的股票，实质上就是用一定比例购买了数百家公司的零碎股票。期权则是在个股之上的又一抽象层次。随着股票市场的发展演变，经济的公平性再次遭受了巨大打击。这并不令人意外，因为股票概念的起源本身也植根于主要为精英服务的东印度公司的基础之上。




  21 世纪初，一种新型货币开始流行，被称为加密货币。加密货币是一种使用密码学^(²²)确保安全的数字或虚拟货币。加密货币的一个决定性特征（可以说也是其最吸引人的特征）是它的去中心化本质。它不由任何中央机构或政府发行，理论上不受政治干预或操纵。这同时也可能成为其弱点，因为唯一能决定该货币某些基本参数的实体，是创建该货币的个人或群体。通常，这些个人不如任何国家政府值得信赖。然而，如果有大量的人开始支持这种货币，信任就会增长。作为一种纯数字和分布式的货币，它原则上也不局限于某个特定国家或国家集团。但是，个别国家可能会限制其使用。加密货币使用去中心化控制，而非中心化货币和中央银行系统。每种加密货币的去中心化控制通过区块链运作，区块链是一个公共交易数据库，充当分布式账本。这一概念使货币极其透明，所有使用该货币的人都可以获得所有交易记录，从而极难进行欺诈或伪造。第一种加密货币——比特币，于
  2009 年由化名为中本聪（疑似在日本）的匿名个人或团体创建。比特币被设计为一种点对点的电子现金系统，意味着它可以用于在没有第三方（如银行）的情况下发送和接收付款。加密货币的价值基于多种因素，包括：(1)**稀缺性**：大多数加密货币的供应量有限，这意味着它们是稀缺的。这种稀缺性可以推高加密货币的价格。(2)**需求**：对加密货币的需求也是其估值的因素。如果对某种加密货币的需求很大，价格就会上涨。(3)**实用性**：加密货币的实用性也是其估值的因素。如果某种加密货币有用，并且人们开始用它来购买和销售商品及服务，那么更多人会使用它，从而推高价格。


  加密货币的创造是通过一个称为挖矿的过程完成的。挖矿是解决复杂数学问题以验证交易并将新区块添加到区块链的过程。矿工因其工作而获得加密货币奖励。加密货币的交易是通过一个称为交易的过程完成的。交易是指在交易所买卖加密货币。交易所是人们可以买卖加密货币的网站或平台。加密货币也伴随着其自身的风险，包括：(1)**波动性**：加密货币的价格波动很大，这意味着它可能剧烈波动。这可能使得投资加密货币具有风险。没有监管机构能在价值过快变化时停止交易，这与法定货币和股票市场的监管方式不同。此外，加密货币可以全天候交易，而银行或股票市场在特定时间关闭。(2)**安全性**：加密货币是一种相对较新的技术，仍存在相关的安全风险。例如，如果你的加密货币钱包被黑客攻击，你可能会失去所有的加密货币。(3)**监管**：加密货币的监管仍在发展之中。这意味着未来如何监管加密货币存在一些不确定性。


  原则上，加密货币试图解决各国使用的常规“法定”货币中的一些根本性缺陷，但它也有自身的缺点。最重要的一个问题是创造更多货币的基础。它基于机器执行的工作这一事实使其相当随意。加密货币的另一个局限性在于，其可被挖出的硬币最大数量被限制在某个任意数字（就比特币而言，是
  2100 万^(²³)）。这个限制被硬编码在其协议中，无法更改。这使得货币稀缺且有价值，但同时也给最大允许财富增加了一个任意的上限。许多其他项目效仿了这一概念来创建自己的加密货币，但大多数流行的加密货币确实都有类似的最大货币供应上限。这两个缺点限制了加密货币的范围，并且它很可能永远不会取代由政府发行的法定货币。


  21 世纪第二个十年左右，另一种新的财富所有权概念出现了，被称为 NFT 或非同质化代币。这些也是完全数字化的资产，使用与加密货币类似的区块链技术，但在此用于记录所有权。所有权可以是任何东西，从数字艺术品到房地产。NFT
  是全球唯一的，永远无法被替换或复制。这使得它们从收藏家的角度来看非常有吸引力。它们确实代表财富，但没有系统的创造和估值机制。因此，它与其他货币并列，保持其独特地位。




  ### 排版后内容


  总体而言，为了解决商品本位货币的弊端，我们创造了一个极其不稳定、且更关键的——极其复杂的金融怪兽。为了维持这种货币体系的稳定与平衡，需要全国乃至全球成千上万的人以及众多组织持续监控其状态。这催生了银行及类似金融机构的诞生。接着，我们将其扩展为一个跨国、多货币的复杂生态系统。为了应对货币价值的波动，人们必须不断进行投资，以使货币价值跟上不断变化的估值。这些复杂性催生了一整套全新的职业领域，例如替他人管理资金的**资金管理人**、指导人们理财的**财务顾问**、分析市场波动的**金融分析师**、利用数学和统计技术制定保险费的专精数学家——**精算师**，此类职业不胜枚举。货币作为交易参考单位的原始概念被如此抽象化，以至于它本身变成了一种独立的事物。我们目前就生活在这样一个抽象且矛盾的境况中：一方面，我们懂得拥有更多金钱的好处；而当未能达成目标时，又往往告诉自己金钱并非万能，它只是购买我们真正所需物品的*工具*。人们会以为，拥有如此先进、精密而复杂的财富管理系统，应该能让它变得真正公平正义，并且对大多数人而言几乎是自动化的。然而，结果似乎恰恰相反。这个领域中有许多薪酬极高的职位，在满足人们基本需求方面却毫无意义。相反，绝大多数直接负责满足基本需求的工作，却是收入最低的。所有好处都被那些由日益复杂化的系统所催生的表面性工作吸走了。多年来，系统非但没有变得更好或更公平，其日益增长的复杂性，反而只帮助了那些参与使其变得更复杂的人，并由此形成了一个自我吞噬的恶性循环。


  举一个具体的例子，根据皮尤研究中心的报告，2021 年，收入最高的 1%的人口掌握了整个国家 32.3%的财富，而 2020 年这一数字为 30.8%。这一趋势已持续数十年，并在近年来加速发展。造成这种极端对比的主要原因，是由于包括股票市场在内的过于复杂的金融体系，为富人提供了不公平的优势。此外，这些积累的财富会代代相传，使得穷人毫无追赶的机会。近年来，工会的力量也有所削弱，降低了对工资的控制力。这些发现并非秘密，政府试图通过更新税收结构以惩罚富人、提高最低工资等措施来解决这个问题。但税收结构本身也相当复杂，富人们普遍能找到漏洞，使得加税政策形同虚设。而提高后的最低工资也通常处于极低水平，仅能让工人勉强生存。这些措施都极为表面，并未真正触及我们资本主义经济体系的核心问题。任何体系能走多远总有个限度。一旦越过临界点，迎接它的将是社会动荡和内战。我们很快就要面临对体系进行根本性变革的时刻，而我相信**人工智能**能提供帮助。


  ## 文明的崛起


  伴随着经济原则，文明的崛起也催生了社会政治原则和意识形态。在过去的几千年里，我们在这方面也取得了显著的进步。我们从简单的狩猎采集群落开始，当时没有明确的角色分工或结构化的组织。随着农耕和定居点的建立，群落开始采用更协调的行动方式，很快，一种原始的社会意识形态——**酋邦**诞生了。酋邦是最原始的社会政治系统之一，由一位酋长统治整个群落。酋长通常由人民选出，有权为群落做出决策，并执行群落的规则或法律。随着群落的发展，酋邦演变成了王国和帝国。在一个王国或帝国中，会有一位最高领袖，也称为国王或皇帝，类似于酋邦中的酋长，但拥有更大的权力和更大的统治群落。通常，国王或皇帝会与一群精选的精英一起统治整个王国或帝国的人民，而领导权通常通过朴素的血统世袭方式代代相传。这种体系也称为**君主制**，按现代定义并不真正被视为一种社会政治意识形态，但它是通向更精细、更周全的社会政治体系的垫脚石。通常认为，这类体系在欧洲一直存在到大约九世纪，与罗马帝国的衰落同时期。然而，类似体系在世界各地的小范围内又延续了许多个世纪。例如，印度在十八世纪英国入侵将整个印度次大陆统一在同一领导之下前，仍有许多小王国；而中国直到二十世纪还有历史上的清朝君主制。大约在王国衰落的同时，欧洲出现了称为**封建制度**的体系，一直持续到约十五世纪，为资本主义等更现代的社会政治意识形态铺平了道路。


  每一个新体系，人们都试图纠正先前意识形态的问题和缺陷；在许多情况下，新体系确实解决了这些问题，却又产生了自身的新问题，或者所提供的解决方案未能经受住时间的考验。尽管如此，这些意识形态为组织社会、确定权力结构以及定义个人与社会之间的关系提供了框架。在人类历史中，我们看到过相当广泛的此类意识形态，但最终它们收敛为为数不多的几种。即便在当今的二十一世纪初，我们也至少能在不同国家看到几种不同意识形态的实际运作。




  ### 资本主义


  一方面，通常被称为**右**派，我们拥有资本主义。资本主义本质上是一种以市场为基础的经济体制，它提倡私有制，并假设资源会根据市场供需平衡自动分配。尽管大多数现代资本主义体系确实始于对平等的宣告，但这种平等仅限于拥有平等的基本权利，例如自由和追求幸福等，但对于其他所有方面，则没有明确规定，而是留给系统自动管理。资本主义下的所有权延伸至开展业务运营所需的一切，例如土地、资本、其他自然资源和人力资源。自动分配的观念避免了需要任何管理机构来决定谁获得什么。在这种相当开放的设定下，任何个体的最终动机都归结为利润。这鼓励所有个体进行竞争，并激励他们做到最好。理论上，这应该会带来创新、效率和增长。仍然需要一个管理机构来防止对系统的滥用，但只需进行最低限度的监督。政府的角色仅限于强制执行所有个体的权利、确保贸易和合同的公平性，并通过提供法律框架来维护健康竞争。资本主义给予所有个体实质性的自由和广泛的选择，让他们能在法律体系的框架内追求自身利益、选择他们想要的职业，以及决定如何花费他们挣得的财富。这看起来几乎是一个完美的体系。然而，所有这些好处也伴随着一些弊端。资本主义最根本的弊端之一就是阶级的产生。需要记住的是，资本主义在其定义中并未在任何地方界定阶级，它反而侧重于平等。但是，正如我们在欧洲和美利坚合众国所有实践中所看到的，阶级结构是该体系不可避免的结果。总体而言，在早期阶段，资本主义展现出了强大的前景，其所有好处似乎都行之有效并结出硕果。在资本主义早期，财富分配并不那么极端，更倾向于我们之前讨论的自然分配，基本上，社会中的大多数人是快乐的。然而，即使有政府的调节，该体系也开始变得越来越不公平、不公正，并导致阶级之间反差加剧，从而形成帕累托式的财富分配。金钱开始集中于越来越小的群体，加剧了不平等，并且这种趋势强烈地指向一个方向，没有自然的逆转方式。最终，这可能导致社会动荡和内战。


  ### 共产主义


  另一方面，通常被称为**左**派，我们拥有共产主义。俄罗斯和中国是遵循这一学说的主要国家典范，此外世界各地还有一些小规模的实践。当今的共产主义自 19 世纪中期由德国哲学家卡尔·马克思和弗里德里希·恩格斯首次提出以来，已经经过了两百多年的演变。虽然源于同一个源头，但正如我们在俄罗斯和中国所看到的，其具体实践存在一些差异。根据制度按时间顺序的演进来衡量，共产主义是最现代的体系，事实上，卡尔·马克思正是为了克服资本主义的弊端而专门提出了它。共产主义的主要驱动原则是创建一个无阶级的社会。马克思主义的共产主义特别将社会划分为两个阶级：资产阶级或生产资料所有者，以及无产阶级或工人阶级。根据马克思主义的共产主义，生产资料是集体所有的。财富和资源根据“各尽所能，按需分配”的原则进行分配。共产主义假设社会中的所有个体都是平等的，因此他们都应该被平等对待。没有等级制度或阶级存在的空间。它还强烈主张废除自然和人造商品的私有制，并提倡集体所有的理念。平等延伸到生活的方方面面，例如获取食物、住所、医疗保健和教育等资源的权利。甚至一个人能得到的机会也被强行要求平等，无论其社会或经济背景如何。为了实现这一点，它建议使用中央计划，即所有关于生产、分配和资源使用的关键决策都由集体制定。共产主义也提倡国家的概念。这里国家的概念相当微妙且复杂。它通常被称为无产阶级专政或整个工人阶级的专政。在这种语境下，国家是阶级统治的工具，被用来镇压资产阶级或资本家阶级，并捍卫工人阶级。国家的概念定义可能与其自身的平等原则相矛盾，但共产主义仅将国家用作一种过渡机制，用以压制现存的资本家阶级，直到整个社会转变为一个单一的工人阶级，即共产主义原则的最终实现。马克思主义共产主义有一个宏伟的期望：一旦过渡完成，国家应自动消亡。在那之前，国家对所有决策拥有完全权威，并由执政党控制。现实中，没有一个共产主义国家成功地实现了国家的消亡。相反，国家为执政党提供了一条在平等伪装下走向独裁的后门，赋予他们不受控制的权力。正如英国历史学家阿克顿勋爵的至理名言：“权力导致腐败，绝对的权力导致绝对的腐败”，国家从未能够放弃权力。尽管存在这些令人生畏的弊端，共产主义提出了一些真正新颖且超前的概念。其中之一就是真正的国际主义。共产党宣言以“全世界无产者，联合起来！”作为结束语。


  还有许多其他意识形态，其原则介于这两个左和右的极端之间。所有这些意识形态的许多方面从表面价值来看似乎公平公正，但这些定义中缺失的关键部分是它们的实施方式以及治理这些制度所涉及的人。共产主义将平等推行到了极致。诚然，从
  DNA 变异来看，所有新生儿在生物学上有 99.9%是相同的，但从那时起，每个婴儿都经历不同的环境和体验，因此当他们成年时，他们的大脑已经大不相同。此外，追求个体的独特性是人类生活区别于低等物种的关键方面之一。共产主义试图在社会中对一切进行均等分配，从一个人能吃多少食物、必须做多少工作和什么类型的工作，到一个人必须拥有多少财富。均等分配在理论上也是一种高斯分布，但方差为零。正如我们之前所见，人类天生就不是均等分布的，强迫他们在所有方面平等是不自然的。此外，渴望与众不同赋予了人类生活目标和动力。共产主义试图从根源上扼杀这一点。




  ### 知识人文主义


  结合资本主义与共产主义，以及我们从各自实践中汲取的教训，再借助无处不在的`SuperAI`，我们已准备好迈向下一代社会政治体系。当我们以新纪元文明为目标展望数千年未来时，需要将想象的弓弦向后拉伸数千年，以确保我们的目标有足够的力量准确而权威地抵达终点。


  资本主义引领我们走上创新之路，在过去数百年间，我们目睹了创新在全球范围内产生的惊人影响。但它也导致了社会阶层的分化，且随着时间推移，阶层间的鸿沟日益加深。资本主义还使我们更以自我为中心，而非以社群为中心。其背后的根本假设是：如果社会中的每个个体都成功了，那么社群必然成功。然而，成功的分配并非自然均匀（如钟形曲线），而是向上层阶级倾斜，且代代相传，差距不断扩大。因此，即便我们在创新和技术领域取得了巨大进步，从社会整体来看，局面却喜忧参半。我们今天所看到的问题，诸如对地下水资源、石油、天然气等自然资源的不可持续利用，甚至过度的渔业捕捞和狩猎行为，都已对环境造成了深远且在某些情况下不可逆转的影响，例如大气中二氧化碳水平升高、海洋生态系统岌岌可危，进而危及数百万人的生命。造成这一局面的唯一原因，就是为了少数行业和个体的利润增长，而对环境乃至人类自身遭受的负面影响完全漠视。在资本主义社会中，本该管控商业活动的法律体系和治理机构，在这方面彻底失职了。


  共产主义试图通过将社会重新置于中心位置来解决这个问题，但在此过程中，它强制推行了不自然的绝对平等，并忽视了个体的成长与幸福。除此之外，"国家"这一本应促进从资本主义的阶层分化社会向统一的工人阶级社会过渡的实体，其概念仍然模糊不清，并为独裁统治留下了后门。


  我们需要结合这两种制度的优点，构建一个新体系。该体系以全人类的成长与繁荣为核心，同时通过给予个体发展、成长和幸福以恰当的优先权，来保护个性、个体成长与幸福。以下是构建新纪元文明所依据的基本原则，我们将其称为"知识人文主义"。智慧与人性是这个体系的两大基石。这里所说的"智慧"，并非指个人智商这种肤浅的概念，而是指使人类得以优越的集体智慧，以及我们所创造的机器智能。我们将将其与铭刻在我们
  DNA 中、将全球地球上所有人团结在一起的古老人文主义原则相结合，以创建一个最自然、经得起时间考验的社会政治体系。


  以下是其基本原则：


  1.  **人类至上**：基于知识人文主义的文明将主要植根于"人类至上"的哲学。地球上以及地球之外（如果届时人类已扩散至其他星球）的所有人类都将处于其核心位置。地球上人类苦难的根源众多，但最首要的因素是贫困、战争与冲突、疾病、歧视以及教育匮乏。我们将通过知识人文主义的基本原则，以及将在本节稍后解释的全球文明组织的具体细节，逐一解决这些问题。借助前一章详述的由人类管理的无处不在的`SuperAI`，所有人类都将享有作为其与生俱来权利的、有保障的基本必需品供应，这包括食物、水、住所及所需的基本药物。"人类至上"的哲学不止于此；所有顶层决策的做出，都将以"如何整体上造福人类"作为首要指导参数。这些决策包括：仅以负责任的方式使用自然资源，使其能够自然再生；以及与其他物种的互动，确保始终存在某种共生关系。


  2.  **平等**：从出生起，所有人类婴儿都将被平等对待，他们在成长、教育、体育以及当时所有其他课程和课外活动中，都将获得相似水平的资源。在整个教育过程中，将密切关注他们的个性、内在偏好、自然倾向和个人目标。每年，他们将根据这些因素获得可选方向，以帮助他们获得最佳且令人满意的教育。教育的最终目标是培养他们成为全球知识人文主义社会的自豪公民，并以他们可能的最佳方式为其成功做出贡献。


  3.  **透明**：在无处不在的`SuperAI`的监控下，人类和机器进行的所有操作都将完全透明。在私人时间及家中，隐私仍将受到尊重；但所有公共区域将由`SuperAI`进行持续监控，以确保一个持续守法、无犯罪的环境。工作中的透明将确保持续公平地对待劳动者并给予相应回报。


  4.  **无限机遇**：从教育开始，所有公民将定期收到关于自身进展的更新以及对未来步骤的建议。然而，每个个体都有权选择自己想学习或从事的工作。在`SuperAI`的帮助下，每个个体都将获得一整套关于可用工作的全面选项。工作的可用性可分为三类：(1)
  维持系统持续运行所必需的工作；(2) 文明中其他成员以娱乐、艺术等形式明确请求的工作；(3) 完全新颖、纯属个体想象（且被证明对文明有积极影响）的工作。根据每个人的能力和兴趣，会期望其完成一定的最低限度强制性工作。在`SuperAI`的帮助下，这个限度将非常之低。此后，每个个体都可以通过以自己的方式做出贡献，自由地帮助文明。




  5. **阶级融合**：根据定义，知性人文主义中的所有个体，按照马克思主义的定义都是个体贡献者或劳动者，但同时，他们也是自己所从事工作的所有者。所有组织都将采用扁平化结构，没有明确的等级制度。年资将受到尊重，并体现在他们的报酬中，但劳动力的管理将完全由无处不在的`SuperAI`结合同伴反馈来处理。这样的体系将鼓励每个人真正专注于自己真正热爱的事情。任何人都可以在合理的时间间隔内，在指定的时间点更换自己的工作领域，以确保工作的连续性。创业或启动新项目将受到高度鼓励，所有此类请求都将定期接受评估。基于同行评审和感兴趣的追随者，一个新项目可以启动并成长。这样的体系将真正创造单一阶级的文化，对所有个体来说都应该是自然而然且令人解放的。


  6. **分布式经济**：面对新的分布式信用体系，法定货币、商品支持货币甚至加密货币的概念都将不得不退出历史舞台。这一体系将借鉴这些系统的实施经验，但会加以改进。所有个体在出生时都会获得固定数量的信用点，并在整个童年和教育期间以固定速率定期补充。他们需要在教育期间，通过完成精心设计、适合其年龄的强制性任务（同样有可选择的选项）来回馈文明。一旦完成教育，他们将面临三个职业方向的选择，如前所述。奖励范围将经过精心设计以确保公平，同时与工作的努力程度和影响力相匹配。奖励将以信用点的形式发放，这些信用点与个体直接关联，并由`SuperAI`通过生物识别技术进行追踪，无需明确的银行业务操作。这些信用点可以像我们通常花钱购买商品或服务一样使用。信用点的处理与追踪将完全自动化，无需为此投入额外精力。这一经济体系的另一个重要方面是没有遗产继承。个体一生中赚取但未使用的所有信用点都将被系统回收。在知性人文主义中，每个人类婴儿来到世界时都将从零开始，像其他任何婴儿一样塑造自己的身份。这是经济体系的一个关键方面，对于以自然方式平衡财富分配至关重要。想象一个世界，所有人类都为了自身或他人的福祉而努力，并获得合理回报；仅仅通过做他们天生擅长的事情，而无需担心竞争。人口越多，创造的财富就越多，越多的人相互帮助，使文明更强大、更富裕、更快乐。这种新的财富概念将从根源上消除不健康的竞争，为真正的进步铺平道路。


  凭借这些原则，我们可以开始描绘新时代文明的细致图景。我们首先要定义，按照当今的标准，全人类将代表一个单一国家。我们需要打破国界的限制，让全人类相互拥抱，无需经历护照、签证等障碍。我们仍然需要确保所有人类的行为都要对全球负责，这将通过无处不在的`SuperAI`对所有人类进行生物识别，以完全自动且非侵入性的方式实现。世界将是一个遍布全球、由自给自足的殖民地（`SSCs`）组成的巨大联合体。`SSCs`类似于当今美国、印度等大多数国家的州的概念。每个`SSC`在其所有居民的基本生活需求方面都将自给自足，但它仍然是全球文明体系中不可或缺的一环，一个不可替代的齿轮。`SSCs`之间通过跨`SSC`的商业运作相连，就如同各州之间的运作一样。


  每个`SSC`都将拥有一套自己的治理机构，按照前述的扁平化结构运作。所有代表都将由`SSC`的成员选举产生。所有治理机构的会议和运作都将公开透明，以实现完全透明。决策过程将由`SuperAI`辅助，并考虑每位成员的投票。每个`SSC`可以根据当地具体情况，在全球法律的基础上，制定自己的一套法律。`SuperAI`可以确保从全球层面到`SSC`层面的所有法律保持一致，没有冲突。跨`SSC`的旅行可以使用个人信用点用于休闲，或基于可选的工作调动。每个个体在特定时期后也将获得迁移到另一个`SSC`的选择权。这些迁移将由`SuperAI`通过在全球范围内优化资源来处理。


  这种包罗万象的、基于知性人文主义的体系不可能突然从天而降。它需要从建立第一个`SSC`开始，然后第一个`SSC`的成功将推动许多其他州和国家一个接一个地加入。直到整个世界都成为新体系的一部分，这个基于知性人文主义的联合体将作为一个国家行事，并与其他国家进行适当的交往。


  一旦过渡完成，世界将真正进入人类文明的新时代，一个符合时代要求、配得上人类的时代——人类是自然选择进化的巅峰之作。我们向自然致敬，并恭敬地接过下一步的掌控权。进化已经完成了它的使命，创造出了最先进的物种，不仅在地球表面，而且在整个宇宙表面。现在，当人类凭借其才智和`SuperAI`接过掌控权时，进化应该安息了！！


  ## 结论


  与本书其他所有章节相比，本章朝着截然不同的方向进行了激进的转变。然而，它建立在前面所有内容的基础之上。它展示了人类一个近乎理想的未来，而这只在`SuperAI`的帮助下才有可能实现。历史上所有的哲学家、理论家和领导者可能都梦想过人类能这样生活，但由于缺乏一个既智能又没有自身不可告人动机的实体而未能实现。对`SuperAI`进行民主化的分布式控制，可以解决以知性人文主义形式创建梦想中的人类文明的所有根本问题，并为人类成为真正的宇宙公民提供一条道路！


