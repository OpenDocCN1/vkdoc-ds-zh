- "# 9. 结语\n\n人工智能是一个引人入胜的话题，但它只是冰山一角，水面之下还隐藏着大量不为人知的内容。在本书中，我们试图从根源深入理解这一概念。随着我们不断深入探索，这个话题的范围也在持续扩展。正如我们在最后几章中所看到的，AI\
  \ 将以历史上前所未有的方式重新定义人类生活。\n\n人类已经走过了漫长的道路，但从未来的角度来看，我们才刚刚起步。前方的旅程是一块空白的画布，如何描绘它完全取决于我们自己。我们可以像现在这样，在资本主义社会政治领域的伪装下，继续专注于个人成长。然而，这并非自然之道，它正在社会中制造鸿沟，这条鸿沟只会不断恶化，直到达到一个临界点而破裂。届时，将会出现全球性的社会动荡，随后引发内乱，并带来深远的后果。这会将人类文明倒退数百年，使这些年取得的所有进步付之东流。取代现有制度的新体系，未必会是一种进步。这是因为它的建立并非着眼于长期进步，而是受复仇动机的驱使——这种模式我们在历史上已经见过太多次了。当饥饿、贫困、沮丧和苦难并存时，所有的注意力都集中在满足这些基本需求上。在这种情况下，人类的大脑无法发挥最佳功能。历史上所有在科学和技术领域取得巨大进步的时期，都是繁荣、幸福和满足的时期。正是在这样的时代，我们不应自满，而应满怀热忱地、冷静地批判常规并加以改进。正是在这样的时代，才能做出并实施最好的决策。资本主义最糟糕的阶段尚未来临，我们不应坐等其至。\n\
  \n理性人文主义是一种思想练习，一个梦想，一种基于积极心态对未来的幻想。它是对改善人类的一种反叛式宣言，其根基是对科学与技术的坚定信念，这些信念建立在已知历史事实的总和之上。它或许不是唯一的选项，但绝对是一个选项。我希望将这颗种子播撒在所有读者的心中，以此作为本书的结语。\n\
