- '# 序言


  *智人*，或称人类，很可能是地球上第一个试图理解我们所处的壮丽宇宙——这一伟大创造——的物种。宇宙在所有维度上、时时刻刻所散发出的不可思议的力量、范围、复杂性和纯粹之美，往往被忽视。在宇宙存在的
  138 亿年历史中，生活在一个原子般大小的行星地球上的——这个地球属于微小的太阳系，而太阳系又属于一个名为银河系的微小星系——人类，总共只用了约 30 万年的时间来观察、欣赏和学习它！连眨眼都不到！！但无论如何，这个令人敬畏的创造终于得到了期待已久的赞赏，在任何情况下都不应被忽视！


  地球上基于碳原子的生物生命，历经数十亿年才达到*智人*的智力优势，这使得他们能够尝试理解宇宙的运作方式，并在与自然灾害抗争的同时，为统治地球开辟道路。相反，人类创造出的基于硅的生命——以计算机驱动的机器形式——已经在处理宇宙数据，以揭示人类永远无法企及的奥秘，而其存在时间还不到
  100 年！！


  数字不会说谎，正如比较本身所说明的，人类的日子屈指可数！！这是真的吗？基于硅的机器真的能导致人类灭绝吗？这种严峻的图景通常出现在科幻文学和电影中，表面上看似乎合理。


  碳基生命是经过数十亿年的自然选择过程，在一个随机生成的化学迷宫中，由一系列极其漫长的自然偶然事件碰撞而成。而所有基于硅的生命都是由碳基生命或人类主动创造的。人类通过承受
  300,000 多年来降临于他们的灾难，经受住了时间的考验，并且具有足够的韧性得以生存和繁荣。因此，即使计算机装备了超人智能，我们也无需担心它们会接管人类。


  本书的首要目标是了解我们是如何在公元 2023 年达到当前状态的。我们将追溯导致地球上生命诞生的事件序列，以及生命如何从单细胞生物一路演化到拥有数十亿细胞的*智人*或人类。故事还将继续，讲述人类如何创造机器，并赋予它们学习的能力。然后，我们将稍作停留，理解这一不可思议的发明将在不久的将来如何改变人类生活。接着，在掌握了智能机器的能力之后，我们将放眼更长期的未来——在那里，人类真正掌控自身命运，成为统治整个宇宙的物种。


  '
- '# 致谢


  撰写一本关于人工智能的书的念头，在我脑海中酝酿了数年。我知道我想如何开篇，以及我想要传达的中心信息是什么。然而，我一直在纠结这本书该如何结尾，以及读者最终应该获得怎样的启发。2022
  年 ChatGPT 的出现，真正帮助我确定了这一点，于是我准备好迎接挑战。


  由于我曾与施普林格·自然的资深编辑 Mary James 合作过之前关于机器学习和人工智能的技术书籍，我便与她开始了对话。我衷心感谢她鼓励我这个想法，并将我与
  Apress 的编辑们联系起来。我要感谢 Shivangi Ramchandran 以及 Apress 的整个团队，在我撰写本书的整个过程中给予帮助。


  当我向我亲爱的妻子 Meghana 以及两个儿子 Dhroov 和 Sushaan 宣布，我要为普通读者写一本关于人工智能的书时，他们给予了极大的支持。在我所有的努力中，Meghana
  一直是我背后沉默的力量。她坚定不移的支持对本书的完成至关重要。我还记得，在我把这个消息告诉小儿子 Sushaan 的第二天，他就跑到他小学的图书馆里去找一本关于
  AI 的书，直到找到才罢休。他把书带回家，无比自豪地交给我。他对我说：“拿着这个，爸爸，你可以抄这本书然后开始写了！” 我一时语塞！！我的心中同时充满了爱与欢笑。我不得不向他解释，我不能抄袭现有的书，我的书必须是原创的，包含我自己的思想。但那是我与
  Sushaan 之间最愉快的对话之一，我对他持续不断的写作灵感以及对我的进度监督感激不尽。


  我还要感谢我的父亲 Vijay、母亲 Madhuri 和兄弟 Mandar，感谢他们为本书的完成所提供的持续鼓励。


  我还要感谢 Akshat Jaykar，因为本书中的所有插图都由他在年仅 15 岁时亲手绘制。正如你将在本书中看到的，他完成了一项了不起的工作，为这些概念赋予了独特的风格。


  最后但同样重要的是，我要感谢我的众多朋友和其他家人，他们通过多次讨论为我的想法提供了反馈，并帮助我理解了我们的世代正从这项迫在眉睫的人工智能新技术中寻求的各种问题。


