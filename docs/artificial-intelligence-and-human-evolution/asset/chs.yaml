- "# 生命的起源\n\n人工智能，或者说智能本身，在其最深的层次上关乎生命。宇宙中存在大量物体，小到原子和分子，大到巨大的行星、恒星和星系，它们始终以某种形式活跃着，相互影响、改变形态、彼此融合，甚至经历诞生，但它们未必具有生命或智能。根据当前的宇宙起源理论，所有物体以及能量来源都始于大约\
  \ 138 亿年前的“大爆炸”，自此之后，所有这些实体在每一瞬间都在发挥作用。大爆炸究竟为何以及如何启动，或者大爆炸之前的宇宙由什么构成，我们不得而知，也可能永远无法完全确信地知晓。然而，如果我们假定某种力量促成了它的发生，那么我们就可以理解，至少是推测出之后的所有活动。更重要的是，我们可以更详细、更确信地理解宇宙的当前状态。我们知道地球是一颗行星，它与其他七颗行星一起围绕太阳公转。我们了解每颗行星的轨道、它们自转及公转的速度如何由其自身质量以及它们与太阳之间、彼此之间的距离所决定。我们可以根据牛顿万有引力定律（或更精确地，利用爱因斯坦的广义相对论和时空曲率）来计算这些指标。我们甚至在一定程度上了解太阳本身如何受限于我们银河系（即银河）的中心并围绕其旋转，以及银河系本身如何与我们的邻近星系仙女座星系相互作用，等等。我们还可以根据大小和距离观测并预测各种小行星和彗星的运动。然而，从具备智能的角度来看，这些物体中没有任何一个展现出真正的智能。这些物体只是遵循物理的基本定律，并没有产生任何新东西。尽管在极其微观的层面，量子力学定律可能暗示着一些随机且不可预测的事件；但在宏观层面，这些物体中没有一个展现出任何不可预测的行为，或者会为了达成某些隐藏目标而主动改变其行动的行为。例如，我们看不到火星因为感到寒冷而主动改变形状试图靠近太阳以获取更多热量；也看不到某颗小行星为了避免与地球相撞（这次碰撞必将导致该小行星永久毁灭）而改变方向。这便是我们划清界限、将生命与非生命、智能物体与非智能物体区分开来的地方。总之，就我们通常所理解的方式而言，“智能”这个词与生命的概念有着内在的联系。因此，我们将从生命的概念开始我们的旅程。在本章中，我们将探讨生命是什么，以及究竟是什么将生命与其他一切区分开来。\n\
  \n\n\n## 何为生命？\n\n“何为生命？”这是哲学和科学领域中最为本质的问题之一。即便生命的定义本身可能令人望而生畏，我们绝大多数人却十分擅长将某个物体归类为“有生命的”或“无生命的”。例如，我们知道岩石没有生命，水没有生命，空气没有生命，但狗有生命，鸟有生命，甚至鱼也有生命。当谈到树木时，情况就变得有点微妙了，因为它们不像大多数其他生物那样移动，但我们仍隐约知道它们与岩石、河流不同，也是有生命的。那么，究竟是什么将生命形态与非生命形态区分开来的呢？\n\
  \n对生命的不同哲学定义版本进行比较，其话题之广泛足以成书。在本书中，我们将主要关注生命的科学或逻辑解释。在各种百科全书和词典中，一种被广泛接受的生命解释认为，生命包含了生物过程、某种形式的信号传导和自我维持、繁殖能力、能量转换以及生长。这个定义可能显得过于复杂，以至于即使按照一些宽松的标准，也显得牵强。它试图捕捉的是一系列能够区分生命与非生命的参数。这似乎暗示着类似维恩图¹(#fn1)的东西，即试图通过绘制重叠的圆圈，把我们周围看到的所有有生命的事物与我们认为是无生命的事物分离开来。让我们逐一审视定义中列出的每一个属性，并绘制这些圆圈来创建维恩图。\n\
  \n我们从最后一个属性开始：生长。生长的特征体现在体积和质量的物理性增加，以及形状的改变。让我们试着将这个概念应用于周围看到的各种物体。我们显然知道所有生物体都会生长，但一些非生物体呢，比如岩石？我们可以看到，当岩石随风滚动并粘附更多土壤，或者随水流移动并与其他岩石合并时，某些岩石可以“生长”，这本质上表现出生长的迹象。山顶的冰盖呢？它们每个冬天都会因降雪而生长。这些物体有生命吗？我们认为不是！因此，如果仅将生长作为区分生命与非生命的单一规则，那是不够的。我们需要更多的规则或更多的圆圈。让我们开始在图\
  \ 2-1 所示的维恩图中添加更多圆圈。\n\n![](img/603991_1_En_2_Fig1_HTML.jpg)\n\n一张维恩图。两个箭头分别指向标记为“生长”的圆的右上区域（岩石）和左下区域（人类定义的生命）。\n\
  \n*图 2-1* – 包含生命定义中一个参数的维恩图\n\n我们来探讨定义中的第二个属性——“能量转换”。同样，我们知道所有生物体都能消耗某种形式的能量以维持其生命活动，从而将一种能量形式转换为另一种。回顾一下岩石和冰盖，我们并没有看到明确的迹象表明岩石和冰盖能够主动地将能量从一种形式转换为另一种。因此，我们确实可以将它们与生物区分开来。但其他一些非生物物体呢，比如河流？我们可以看到，河流从一处流向另一处，它们携带着卵石、土壤和岩石。这些物体随水流动时，通过摩擦产生热量。因此，它们表现出将动能转化为热能的明确能力。除了能量转换，河流在每年雨季时体积也会增大。那么，河流现在有生命了吗？我们仍然认为不是！！因此，如图图\
  \ 2-2 所示，这两个圆圈或规则并不足以区分生命和非生命，我们需要再引入一个规则。我们可以继续我们的维恩图，从之前的定义中再添加一个规则。\n\n![](img/603991_1_En_2_Fig2_HTML.jpg)\n\
  \n一张维恩图，包含“生长”和“能量转换”两个圆圈。两圆的共同区域标记为“河流”和“人类定义的生命”。\n\n*图 2-2* – 包含生命定义中两个参数的维恩图\n\
  \n让我们添加繁殖能力，如图图 2-3 所示。我们非常确定，所有生物，从单细胞生物到复杂的哺乳动物，都能够繁殖。但是河流呢？通常，繁殖的概念是在生物学背景下定义的，因此不能直接应用于非生命体。然而，我们可以采取一些文学和哲学上的自由，使用更通用、更宽泛的繁殖定义：即一个实体创造出一个与原实体相似的新实体的能力。带着这种对繁殖的新解释，让我们重新审视满足前两个条件的河流。当一条河流遇到一座山丘或某种障碍物时，它可以分流成两条或更多条支流。这些较小的支流都拥有与原始河流相似的所有属性，可以被视作河流的后代，这实质上证明了河流确实能够繁殖。因此，根据我们对繁殖的宽泛定义，河流可以被认为是有生命的。但它们真的是吗？我们仍然认为不是！我们需要继续我们的定义，向维恩图中添加更多规则或圆圈。\n\
  \n![](img/603991_1_En_2_Fig3_HTML.jpg)\n\n一张维恩图，包含“生长”、“能量转换”和“繁殖能力”三个圆圈。生长圆的独有区域标记为“岩石”。生长、能量转换和繁殖能力三者的共同区域标记为“河流”和“人类定义的生命”。\n\
  \n*图 2-3* – 包含生命定义中三个参数的维恩图\n\n\n\n现在，随着我们开始引入更多专业化的生物学概念，情况变得愈发有趣。`Self-sustenance`（自维持）的定义指出，一个实体能够无需外部帮助即可维持自身存在。这可以有多种解读方式，而根据最通用的定义，任何有生命或无生命的物体都可以被认为是自维持的。例如，只要源头有持续的水源供应，河流就能一直作为河流存在。如果水源因某种方式枯竭或蒸发，河流便会消失。但类似的情况也可以发生在生物身上。如果一只老虎一周没有吃到任何东西，它就会死亡并消失。相比之下，一条河流可能存在得久远得多。因此，`self-sustenance`（自维持）加上之前的所有规则，仍然不足以区分生命与非生命，如图\
  \ 2-4 所示。所以，我们继续完善定义，添加更多规则或圆圈，看看是否能在维恩图中将河流归类为非生命。\n\n![](img/603991_1_En_2_Fig4_HTML.jpg)\n\
  \n一个维恩图，包含四个圆圈：生长、能量转化、繁殖能力和自维持。非重叠区域标记为“岩石”。能量转化和繁殖能力的重叠区域标记为“河流”。所有圆圈的共同重叠区域标记为“人类定义的生命”。\n\
  \n**图 2-4**  \n基于生命定义的四个参数绘制的维恩图\n\n下一个特征是执行某种信号传递的能力，如图 2-5 所示。这是一个有趣的特征。在生物体中，细胞可以向其他细胞发出信号以传输/接收信息或消息。在河流的情况下，我们能看到这样的信号传递吗？大多数情况下是不会的。在极少数情况下，我们可能会看到闪电从天空的云层击中河流，这可能将某种电信号从云层传递到河流。这能被视为信号传递吗？这个问题的答案是否定的。根据信号传递的定义，其中隐含了一个前提：发送方主动发送信息，并且接收方能够理解并回应所接收到的信号。云层通过闪电真的在传递什么信息吗？即使它们在传递，河流能理解这些信号并通过向云层回传信号来回应吗？绝对不行。因此，这种随机的闪电现象肯定不是一种信号传递形式。于是，我们可以将河流移出维恩图中为生命实体保留的中心区域。那么，我们是否已经彻底将生命与非生命分开了呢？我们还需要再考虑几个例子。手机信号塔怎么样？它们是人造的，并非天然存在，但无论如何它们是非生命的，并且它们一直在与成百上千的设备进行信号传递。它们是活的吗？当然不是，并且用之前的规则很容易将它们区分开，因为这些塔没有任何生长的迹象，也无法繁殖。\n\
  \n![](img/603991_1_En_2_Fig5_HTML.png)\n\n一个维恩图，包含五个圆圈：生长、能量转化、繁殖能力、自维持和信号传递。共同重叠区域标记为“行星地球”和“人类定义的生命”。\n\
  \n**图 2-5**  \n基于生命定义的五个参数绘制的维恩图\n\n至此，我们似乎已经排除了大多数我们认为非生命的实体。那么我们的维恩图最终完成了吗？还不完全是！让我们离开地球，看看一些更大的天体。行星怎么样，甚至，看看我们自己的行星地球，怎么样？让我们看看它如何符合维恩图。我们可以认为，地球通过引力不断与月球进行信号传递，以使其保持在轨道上，而月球则通过保持在轨道上来回应。地球当然可以增大体积，就像它自太阳系形成以来，被数百万颗小行星和彗星撞击，吸收它们的质量那样。地球绝对有能力自维持。如果地球被一颗非常大的小行星撞击，撞出一小块质量，地球甚至有可能像“繁殖”那样创造出一个较小的类行星天体。已经有理论认为，我们现在的月球就是以这种方式从地球分离出来的！此外，地球上时时刻刻都在发生着数百万次的能量转化。似乎地球可以和所有生物体一样，位于所有圆圈的中心。那么，地球是生命体吗？嗯，不！！绝对不是！！这引导我们来到维恩图中的最后一个圆圈，如图\
  \ 2-6 所示！\n\n**生物过程**：生物过程被定义为生物体内发生的一系列事件或作用，以达到特定结果。这些过程对于生物体的生长、繁殖、维持稳态（稳定的内部环境）以及响应环境至关重要。本质上，生物过程是生物体细胞协同工作以支持生命的方式。这是最后一个圆圈，我们用它将宇宙中所有我们认为非生命的东西排除在外！有人可能会说，这条规则涉及循环论证^(²)，即因为我们使用了“生物”这个词，所以本质上是在说非生命物体不具备生命物体的特性。然而，这并不一定是正确的。所有的生物过程都可以完美且完整地使用纯化学和物理规则与定律来定义，这些规则和定律所采用的逻辑陈述同等适用于生命体和非生命体，而无需明确使用生命或生物学的概念。\n\
  \n尽管地球是所有生物的家园，但它本身主要由岩石、矿物和水构成，其自身不具备细胞结构，也不展现上述的生物过程。因此，地球作为一个独立物体，并不满足这个条件。有了这最后一条规则，我们得到了一个维恩图，其中我们可以将所有生命体与非生命体区分开来，如下图所示。\n\
  \n![](img/603991_1_En_2_Fig6_HTML.png)\n\n一个维恩图，包含六个圆圈：生长、能量转化、繁殖能力、自维持、信号传递和生物过程。共同重叠区域标记为“人类定义的生命”。\n\
  \n**图 2-6**  \n包含所有六个参数的最终维恩图。人类定义的生命现在成为唯一一个位于所有圆圈共同重叠中心的项\n\n因此，我们成功地将人类定义的生命形式与宇宙中所有其他实体完全区分开来。如果我们深入思考一下，有人可能会质疑，有了维恩图中的最后一条规则，我们真的还需要所有其他规则吗？似乎仅凭这一条规则就有可能区分生命与非生命。那么，我们为什么还需要包括所有这些规则呢？这个问题的答案在于生命与死亡之间的区别。死亡的生物体确实拥有所有的生物过程和细胞结构（至少在组织和细胞完全分解前的一段时间内是这样），但它们不再“运作”。它们不再进行信号传递、移动或繁殖等等。因此，我们本质上需要所有其他参数来区分生命体与死亡体，但仅凭第一条参数（生物过程）就足以区分生命体与非生命体。\n\
  \n\n\n## 生命是如何起源的？\n\n现在，既然我们已经掌握了生命的完整定义，以及真正区分生物、非生物和死亡物体的关键，那么让我们来看看这一切是如何开始的。生命起源于地球，还是从其他星球、小行星甚至恒星来到地球的？基于地球上大多数物种所需的大气和温度条件，很难想象有生命形式能从外太空来到地球。但这真的不可能吗？事实证明，并非如此！！\n\
  \n外星生命的想法并不新鲜，它构成了科幻文学的一个完整流派。但随着该领域的一些最新进展，这个想法已接近现实，不再是纯粹的科幻了。让我们仔细看看生命起源于外太空这一可能性。\n\
  \n### 极端微生物\n\n很明显，所有“大型物种”，或者说我们无需显微镜就能看到的物种，都无法在地球之外存活超过几分钟（如果它们能存活的话）。原因是缺乏氧气、极度寒冷、来自太阳和/或其他恒星的过度辐射、缺乏重力等等。所有大型物种如果遇到这些因素中的任何一个，都会在短时间内死亡。当所有这些因素共同作用时，这些物种根本没有现实的生存机会。然而，科学家在地球上发现了几种单细胞生物，它们有可能承受极端温度、压力或大气条件，它们被称为**极端微生物**。这些微生物可以在深海热液喷口等地方生存，那里的温度可高达\
  \ 120 摄氏度或 250 华氏度，同时伴有极高的压力。还有一些微生物可以承受极端寒冷的温度，例如埋在冰层中的-25 摄氏度或-13 华氏度。有些微生物可以承受极端的酸性或碱性条件，或极高的盐度。还存在一些可以完全在黑暗中生存的微生物，以及一些可以承受危险辐射（如宇宙射线、X\
  \ 射线和来自放射性物质的辐射）的微生物。这些条件中的任何一种，即使适度，也足以杀死全人类，更不用说其他动物了。然而，这些微生物不仅能在这种极端条件下生存，还能在这种条件下生长和繁殖。\n\
  \n这些微生物能在地球上的严酷环境中生存，这相当令人鼓舞，但在地球之外呢？它们能否利用这些能力在外太空中存活？那里没有阳光，没有重力，所有邻近恒星都会持续不断地释放出不受阻碍的宇宙辐射。由于地球大气的吸收和地球磁场的偏转，这种宇宙辐射在地球表面仅剩微量。\n\
  \n为了回答这个问题，来自日本希望号实验室和日本宇宙航空研究开发机构（JAXA）的一个研究团队^(³)在国际空间站上进行了一项实验。他们的实验包含了多种不同的细菌，但特别是，一种名为**耐辐射奇球菌**的细菌表现出最强的适应力，能够在国际空间站外的太空中存活多年。当研究人员检查一组存活下来的细菌时，他们发现外层暴露区域的细胞已经死亡，这些死细胞形成了一种保护层，其下的内层细胞得以存活。这项研究确凿地证明，微生物确实有可能长时间承受外太空的严酷环境，并以休眠状态继续存活。\n\
  \n然而，从寻找地球生命可能来自外太空这一可能性的角度来看，承受太空的严酷性只是方程式的一部分。其他部分包括：承受携带这些细菌的陨石或彗星撞击地球表面时的冲击力的能力，以及直接或间接利用太阳能生长和繁殖的能力。目前尚未进行针对性的实验来验证**耐辐射奇球菌**是否能承受这种冲击，因此目前的答案更多是推测性质的。**耐辐射奇球菌**需要氧气和有机化合物的存在来产生生长和繁殖所需的能量。它们不具备直接消耗太阳能的能力，因此不能被视为完全独立的物种。然而，这类物种的出现提供了一条路径，即可能存在另一种类型的物种，它已在另一个星球上演化，能够更进一步，既能承受撞击，又能通过直接吸收太阳能实现自给自足，同时还具备在太空中存活多年的能力。\n\
  \n即使我们认同生命起源于地球之外的理论，一个事实依然存在：从外太空来到地球的物种必定起源于别处。可能是我们银河系中某个其他恒星系统的行星，甚至来自另一个星系。但这又不可避免地引发了另一个问题：生命在那个星球上又是如何起源的呢？因此，除非我们能回答从非生命物质中产生生命这一终极问题，否则问题的链条就不会真正终止。\n\
  \n现在，让我们看看另一种可能性：生命完全是在地球上从无到有地起源的！这种选择通常也更受青睐。\n\n让我们尝试探索这可能是如何发生的。我们的太阳系大约在 46\
  \ 亿年前形成，当时太阳首次形成。又过了 1 亿年，其他行星才形成，太阳系才完整。有许多理论被提出来解释我们太阳系的形成。它们在很多方面有所不同，但大多数都同意，一切始于一个被称为**太阳星云**的巨大气体云。它相当寒冷，主要包含氢气，以及极少量的一些较重的元素。要么是自发地，要么是借助可能来自遥远超新星爆发的扰动，一部分气体聚集在一起，形成了恒星形成的“种子”。一旦质量开始在聚集区域集中，该区域增强的引力就加速了其增长，该区域迅速成长为星云中最主要的天体。随着尺寸和相应引力的增加，聚集区域的中心开始变暖，最终达到足够高的温度（约\
  \ 1 亿摄氏度），从而启动了核聚变过程。于是，我们的太阳首先形成了。太阳形成后，它迅速吸收了周围所有轻质气体，只在其邻近区域留下重元素。这些重元素在接下来的\
  \ 1 亿年里聚集在一起，形成了前四颗行星：水星、金星、地球和火星。在距离太阳足够远、大约相当于木星当前位置的地方，太阳的引力没那么强，轻质气体仍然可以存在。它们开始聚集在一起，形成了像木星和土星这样的气态巨行星。\n\
  \n\n\n## 太阳系的起源\n\n将注意力聚焦于地球的形成，地球的第一代形态主要由被太阳引力排除在外的较重元素构成，例如碳、氮、氧以及更重的金属等。随着地球体积的增大，它开始拥有自身的引力，并因此在太阳系中形成了自己独特的身份。这一时期从\
  \ 45 亿年前持续到 41 亿年前，大约延续了 4 亿年。这个时期被称为冥古宙，地球在其形成后的这个阶段开始冷却。紧随其后的是通常被称为后期重轰炸期（`LHB`）的阶段。`LHB`期始于大约\
  \ 41 亿年前，又持续了 3 亿年，直至大约 38 亿年前。在此期间，木星、土星、天王星和海王星等较大行星的形成及其增强的引力，对存在于太阳系外围的小行星带造成了扰动。这种扰动引发了来自陨石、彗星及其他太空碎片的猛烈撞击。尽管过程相当剧烈，但从地球生命起源的角度来看，这是一个极其关键的时期。这些陨石和彗星为地球带来了关键成分，其中包括水。由于持续不断的撞击，地球的温度再次上升到高于水的沸点，相当数量的水必定也流失了。然而，剩余的水分足以满足生命形成的需要。值得注意的是，所有邻近的行星，包括水星、金星和火星，在此期间也遭遇了类似的撞击，并可能接收了相似数量的陨石和彗星。然而，由于距离太阳较近、引力较小等各种因素，它们最终失去了大部分水和其他元素。不过，火星的地质结构与地球非常相似，大小也相近，它留住水和其他元素的时间可能比水星和金星更长，并且有相当合理的可能性表明，那里也可能独立诞生了生命。然而，我们至今仍未找到确凿的证据。\n\
  \n大约在`LHB`期结束时，即大约 38 亿年前，地球再次开始冷却。据美国国家科学基金会称，在加拿大哈德逊湾附近发现的一些地球上最古老的岩石可以追溯到这一时期。^(⁴)\
  \ 然而，对于在此之前地球上存在什么，我们没有任何确凿的证据。\n\n关于生命究竟何时在地球上起源，存在着不同的观点。一些理论认为，生命可能早在 43 亿年前就已开始，甚至是在`LHB`期本身之前；而另一些理论则认为，生命起源于`LHB`期，或大约\
  \ 41 亿年前。然而，迄今为止发现的最古老的、能够证明生命存在的化石，其年代仅能追溯到`LHB`期，因此，我们实际上无法证实或反驳其他理论。\n\n### 原始汤\n\
  \n根据对生命定义的早期讨论，为了证明生命起源于地球，我们需要证明能够展现生长、信号传导、繁殖等功能的生物结构，是从完全非生物的物质中创造出来的。有许多理论试图解释这如何可能发生。所有这些理论都始于一种原始有机化合物的混合物，这些化合物包含碳、氮、氢和氧，例如甲烷和氨，并与水和溶解的氢、氧混合，通常被称为*原始汤*。*原始*一词意指自万物初始便已存在的事物。在这种情况下，原始汤指的是地球上自然存在的、最终导致生命创造的所有有机化合物的混合物。所有将地球生命起源基于自然发生的化学反应的不同理论，都被统称为原始汤理论。\n\
  \n其中一种最有说服力的原始汤理论被称为*RNA 世界假说*。根据 RNA 世界假说，最早的微生物完全基于`RNA`结构。`RNA`是能够执行信号传导、繁殖、生长等大多数生物功能的最小实体。单个`RNA`分子是活细胞的最基本组成部分，包含一条呈螺旋结构排列的长链原子。碳原子连同氢、氧、氮和磷原子构成了`RNA`分子链的中心部分。在大多数生物体中发现的`DNA`或脱氧核糖核酸是一个双链分子，其单链与`RNA`相似。`DNA`通常具有双螺旋结构。\n\
  \n我们今天观察到的大多数活细胞都是基于`DNA`分子的，而只有一些病毒含有`RNA`。这一观察结果使得我们必然认为`DNA`分子应该是在某些化学反应中自然形成的。`DNA`分子比`RNA`分子复杂得多，并且`DNA`分子通过随机化学反应形成的可能性要小得多。然而，最近发表在《自然》^(⁵)杂志上的一项研究支持了这样一种理论，即地球上起源的早期生命可以完全基于`RNA`。\n\
  \n`RNA`分子中的长链原子可以分解为四个不同的原子群，分别称为腺嘌呤、鸟嘌呤、胞嘧啶和尿嘧啶。（`DNA`分子共享其中三个基团，区别在于尿嘧啶被胸腺嘧啶取代。）这些化合物被称为含氮碱基或核苷酸碱基。`RNA`分子的独特属性包括：能够以链中原子的序列形式编码信息，以及能够作为催化剂启动生物过程。研究还表明，`RNA`能够进行繁殖，并将其包含的信息传递给后代。\n\
  \n\n\n## 大约 43 亿年前\n\n大约 43 亿年前，地球上的环境条件被认为达到了一个关键阶段，具备了诱导 RNA 类分子生成化学反应所需的所有必要条件。这些条件包括：\n\
  \n1. **地壳的形成。** 早期陨石撞击的所有余波都已平息，地球表面开始凝固，形成了我们所说的地壳。\n2. **地球表面温度适中。** 此时地球的平均温度降至\
  \ 100 摄氏度以下，使得液态水成为可能。温度范围可能涵盖极地附近的零下温度，但总体而言，这种环境有利于生命起源所需的化学反应。\n3. **液态水的形成。**\
  \ 适中的温度为此时期液态水的存在铺平了道路。在后期重轰炸期期间积累的水量足以形成覆盖地球表面 70%以上的海洋。\n4. **存在复杂的有机化合物。** 地球含有大量的碳、氢、氮和氧，以及微量的硫和磷。\n\
  5. **最后但同样重要的是，浓厚的大气层**能够引发强烈的闪电。这样的雷击能够触发与复杂有机化合物的化学反应，从而产生 RNA 类分子。\n\n### 米勒-尤里实验\n\
  \n米勒-尤里实验为这一过程提供了关键证据。1953 年，芝加哥大学的两位教授斯坦利·米勒和哈罗德·尤里进行了这项实验。实验装置非常简单。他们将两种复杂的有机化合物——甲烷和氨，连同水和氢气一起密封在一个烧瓶中。研究表明，当基本元素暴露于紫外线辐射时，这些化合物很容易产生。然后，他们将一对电极连接到烧瓶上，并反复施加电火花。仅仅运行了几个小时，就观察到烧瓶中形成了多种氨基酸分子。这些氨基酸分子是核苷酸碱基的构建模块，而核苷酸碱基最终构成了\
  \ RNA 和 DNA 分子。\n\n### 近期进展\n\n为了进一步发展这一概念，德国路德维希马克西米利安大学的托马斯·卡雷尔^(⁶)最近展示了一系列化学过程，这些过程在概念上不仅可以从水和氮等基本原料中制造出氨基酸，还能制造出\
  \ RNA 的所有四种核苷酸碱基（腺嘌呤、尿嘧啶、胞嘧啶和鸟嘌呤），而这些原料在大约 43 亿年前的地球大气条件下是现成可得的。随着这些构建 RNA 的原始原料的出现，在接下来的数千年或数百万年里，它们逐渐组合在一起，形成了第一个\
  \ RNA 分子。\n\n### 其他理论\n\n还有其他一些理论认为生命起源于深水之下。具体来说，在海洋底部的海底热液喷口附近，存在着有趣的条件组合，例如足以引发化学反应的高温、通过喷口排放的气体提供的必要元素，以及液态水。即使海洋深处没有阳光，来自热液喷口的热量也足以提供生命生存和生长所需的能量。其想法是，RNA\
  \ 类分子首先在这些喷口周围产生，然后在数千到数百万年的时间里，它们不断结合形成具有细胞结构的微生物。已知的一些最古老的生物确实来自水下，这一事实支持了这种生命起源理论。然而，这种理论缺乏像米勒-尤里实验或卡雷尔实验为陆地生命起源理论所提供的类似的实验支持。\n\
  \n还有其他一些理论声称生命可能起源于厚厚的冰层之下、黏土或土壤内部等。但大多数这些理论缺乏足够的实验支持，并且不被许多科学家所青睐。\n\n### 更高力量的作用\n\
  \n最后，但并非最不重要的一点是，关于生命起源的讨论，如果不考虑某种更高力量（如上帝）的参与，就永远不会完整。当有人声称地球或宇宙中的生命是由上帝创造时，如果我们走信仰之路，几乎没有什么论点可以反驳。然而，如果我们本着逻辑的精神看待这一说法，我们当然可以提出一些探究性的问题。如果上帝或更高的实体确实创造了生命，为什么它要从微小的微生物开始创造？为什么它不直接创造人类或*智人*？为什么要经历漫长的进化过程？如果上帝创造了地球上的生命，上帝还创造了什么？为什么生命只在地球上被创造，而没有在太阳系的其他行星上被创造？如果上帝创造了地球上的生命，那么上帝也一定创造了太阳系，再延伸一下，整个宇宙也是如此。如果上帝创造了整个宇宙，为什么他/她在创造宇宙之后要等待数十亿年才创造地球和生命？我们可以提出的问题简直没有穷尽，而除了“上帝想这样做”之外，对这些问题的回答也都不尽如人意。所以，如果上帝想按照某种方式、某种顺序，以一种遵循明确定义的物理和化学定律的方式来做所有这些事情，那么我们仍然可以尝试研究我们对这些定律的理解，根据我们看到的证据改进方程式，并能够预测我们如何来到这里以及我们下一步将走向何方。因此，无论上帝是否创造了我们，我们都需要尽到自己的责任，了解宇宙，了解我们的太阳系，了解地球，并找出这一切是如何开始的！\n\
  \n## 结论\n\n正如我们所知，生命确实与宇宙中的其他概念截然不同。然而，正如我们在本章中所看到的，它的客观定义可能并不显而易见。当我们看到周围（包括我们自己）有如此多不同形式的生命时，我们认为生命是理所当然的，但一开始，情况远非如此。从统计学的角度来看，这反而是最不可能发生的事情之一。然而，这并非不可能，而且它确实发生了。原始的“原始汤”是真正的答案吗？也许是，也许不是！但可以肯定的是，一些化学反应利用地球上现成的原子和分子发生了，这些反应导致了第一个生物结构的形成。在下一章中，我们将探讨生命如何随着时间的推移而演进。\n\
  \n脚注 1   2   3   4   5   6\n\n"
- '# 3. 物种的进化


  ## 引言


  我们对智力的感知与生命和生物体紧密相连。在上一章中，我们探讨了导致地球上以单细胞生物形式出现的生命起源的各种过程。常规的细胞运作并没有表现出多少智力。只有当我们开始观察像动物、鸟类甚至水生生物这样的复杂多细胞生物的行为时，智能行为才开始显现。这并非巧合，智力确实深深植根于展现它的物种的生物结构之中。因此，为了充分理解智能的概念，我们需要了解这些生物以及它们是如何存在的。在本章中，我们将更深入地探讨生命这一主题，并研究地球上起源的生命如何最终演变成像人类这样包含数万亿细胞的复杂物种。




  ## 生命的进化


  地球上最早诞生的生物是原始的单细胞生物，它们以单一的 RNA 或 DNA 为基础，能够执行所有基本的生命过程。然而，我们今天在周围看到的物种，包括我们人类，都远为复杂，不仅包含成百上千个细胞，而是拥有数十亿、数万亿甚至数千万亿个细胞。单细胞生物所展现的那些基本生命过程，如今由包含高度特化细胞的专门器官来处理。原始单细胞生物转变为这些高度进化的物种，并非一蹴而就，也非偶然。达到这种复杂程度耗费了数十亿年。有充分的考古证据表明，导致这一转变的过程就是*进化*。


  自然选择进化的理论要归功于查尔斯·达尔文。达尔文是我们所知最伟大的科学头脑之一。他于公元 1859 年在其备受推崇的著作《*物种起源*》中提出了生物进化理论。进化论是科学史上（更不用说生物学了）有史以来最优雅、最具开创性的理论之一。尽管其基于的假设简单到小学生都能理解和欣赏；但反复连锁应用这些原理，却能够解释地球上曾存在过的所有物种（从单细胞生物开始）形成的复杂网络。从根本上保持简单，是许多伟大理论的试金石。当一个理论简单时，它要么容易被反驳，要么几乎无法被反驳；留给解释的空间很小；其中没有模糊性。它不会因冗长复杂的演绎推理链条而产生歧义。当一个理论变得复杂时，通常需要考虑大量情况，虽然这些情况难以证明，但也难以证伪。在最坏的情况下，一个复杂的理论可以隐藏在它的模糊性后面，直到有足够的研究证明了所有情况；而在最好的情况下，该理论的可及性仅限于那些能够完全理解其复杂性的人。这种复杂理论的一个经典例子是*弦理论*，或者其推广形式*超弦理论*或*M
  理论*。^(⁷) 此外，当一个理论变得越来越复杂时，其适用范围也开始缩小。换句话说，本质上简单的理论适用范围相当广泛，而复杂的理论则试图用显著更窄的范围来解释某些非常特定的场景。话虽如此，提出或发展出像进化论这样简单、有效且能改变我们对地球生命认知的理论，需要天才般的智慧。


  有时，一个理论的概念可能*相对*（双关语）简单，但其形式定义却可能复杂得令人难以置信。爱因斯坦的广义相对论就是一个例子，它试图推广牛顿物理学，特别是引力的概念。它没有像牛顿那样将引力定义为一种力，而是定义为时空结构的曲率。想象时空曲率并不太难理解，尤其是当它被简化为二维时。一个简单的二维棋盘状表面因一个大质量物体出现而发生扭曲的图形（就像在维基百科和许多其他资料中看到的那样），就是一个很好的例子。然而，要理解其完整的数学公式（使用张量微积分），获得博士学位仅仅是一个开始。同样重要的是，广义相对论与牛顿物理学在可观测结果上的真正差异，只有当我们超越地球，甚至超越我们的太阳系，观察数光年之外的恒星和黑洞时才会显现；或者我们需要观察行星轨道中某些只能用地球上少数几台望远镜才能测量的微小异常。牛顿的引力与运动理论（现在可以被看作是广义相对论的简化版本或特例）能够回答现实生活中的大多数问题。尽管难以置信，但过去三四个世纪里地球上所有精妙的建筑和工程奇迹，都是基于牛顿定律而非广义相对论建造的。1851
  年在伦敦建成的水晶宫，是当时最早充分利用牛顿定律建造的大型建筑之一。它采用玻璃和铁结构，使其坚固而轻盈，在当时是一项绝对令人难以置信的工程壮举。从巴黎的埃菲尔铁塔、美国纽约的布鲁克林大桥，一直到阿拉伯联合酋长国的哈利法塔（地球上最高的建筑，远超第二名约
  200 米或 600 英尺），仅举几例，牛顿定律的成功不断攀升，造就了这些令人叹为观止的建筑。即便是哈利法塔这种巨型建筑的设计，也无需借助广义相对论，牛顿定律的精度已经足够。


  这绝非要贬低广义相对论的伟大（它确实是二十世纪现代物理学、数学和天文学的巅峰），但它确实阐明了科学理论的一个关键方面：解决方案的复杂性往往随问题的复杂性而变化。


  进化论可能甚至比牛顿的运动与引力理论更容易理解，并且（迄今为止！）完全不需要任何复杂的扩展来使其更普适。这真是纯粹的天才之作！为了深入探讨人类进化的具体细节，让我们快速回顾一下达尔文进化论的基本原则。达尔文的进化论基于两个步骤，在物种的生命周期中，一代又一代地重复发生：


  1. 繁殖过程中通过突变产生的后代随机遗传变异

  2. 由适者生存决定的自然选择




  让我们来看该理论的第一个方面。每当一个物种繁殖时，后代是通过混合亲本的基因并伴随一定程度的随机变异而产生的。如果不存在这种微小的随机变异，那么后代将表现出与亲本完全相同的特征，而不会产生任何新特性。同时，如果后代是通过过度随机变异产生的，那么物种的连续性就会丧失，每一代都会产生全新的物种。因此，需要在随机性与可预测的相同复制之间取得微妙的平衡。这些随机变异也可以被视为理想情况下不应存在任何变异时，后代产生过程中的错误或意外。借助这种精心平衡的随机性或意外，每次繁殖都会产生略有差异的后代。基因结构的变化可能由突变、基因重组甚至环境因素引起。正如前面提到的，突变本质上是
  DNA 复制中的固有错误或意外，可能由环境因素（如暴露于辐射、某些有害化学物质或病毒感染）引起。当细胞通过减数分裂过程进行分裂时，通常可以观察到突变。基因重组是另一种能够产生新
  DNA 序列组合的过程。在减数分裂期间，细胞中的染色体或 DNA 序列会重新组合，从而产生新的基因组合。这也可能导致种群中产生新的变异。所有物种的持续突变使栖息地成为一个充满活力的动态场所，物种间的相互作用也在不断变化。


  这种动态的栖息地为进化过程的第二步奠定了基础：自然选择。新形成的后代随后与环境相互作用，可能产生三种结果：由突变产生的新特征要么使它们更适应环境生存，要么使它们更不适应环境生存，要么根本没有产生任何明显的影响。第三种情况本质上无关紧要，不会产生实际影响。在第二种情况下，从统计学角度看，此类后代往往更早死亡，繁殖并将那些劣势特征传递给下一代的机会也更少。而具备更适应环境生存特征的后代往往活得更久——尤其是与那些具有劣势特征的物种相比——这使得它们有更高的繁殖机会，并通过世代延续保留这些新特征。需要指出的是，这些变化无法在个体层面上清晰察觉，而应从整个栖息地的大样本空间角度，透过统计学的视角来审视。历经成百上千代之后，一种明确的趋势变得明显：物种会朝着越来越适应环境生存的特征方向演变。同样重要的是，要观察到这种效应，环境本身必须保持相当稳定。当环境自身开始剧烈变化时，可能没有足够的机会让物种朝任何特定方向进化以应对变化，从而可能导致大规模灭绝。然而，当环境变化足够缓慢时，朝向新增和改进特征的缓慢演变会随着时间推移产生一个全新的、更适应变化条件的物种。快速变化的环境，即使并非完全毁灭性的，也可能因频繁重置而令进化过程失效。值得注意的是，不同物种之间始终存在生存竞赛，而每个物种都在同时进化。因此，整个过程相当动态，却存在一种固有的微妙平衡。然而，最终统计数据会倾向于一个物种优于另一个物种，该物种便会进化成为主导物种。这种现象的一个绝佳例子是恐龙的出现。它们的食性从肉食到草食不一而足，体型从可怜的两三英寸到近
  100 英尺不等。然而，它们都有一个共同点：它们都如此善于在各自的环境中生存，以至于历史上它们几乎在全球无阻碍地繁衍。然而，有一天，在一场毁灭性的灾难中，它们被彻底从地球上抹去，这表明即使是最进化的物种，当外部影响导致环境变化过快时，也会在自然灾害面前消亡。在这场灾难性事件中，虽然恐龙灭绝了，但一些较小的动植物幸存了下来，并能够随着新环境的形成再次开启全新的进化列车，最终导致人类的出现。




  ### 适应性


  *适应性*这一概念描述了一个物种为了更好地适应环境而发生变化的过程。适应性与自然选择过程，乃至广义上的进化，都紧密相连，但它们本质上是不同的过程。如前所述，进化需要历经数百到数千代，通过改变更适应特定环境的基因结构来创造新物种。每一代渐进式变化的速率取决于诸多因素，如突变率、种群规模以及环境本身。而适应性则是有机体在不改变基因构成的情况下，为了更好地在环境中生存而发生的变化，它作用于单个或少数有机体，并且可以以快得多的速度发生；而进化则改变整个种群。


  以下是通常用来阐释适应性过程的一些例子：北极熊进化出白色皮毛以更好地在雪地中隐藏，鸭子进化出带蹼的脚以便更好地游泳，食肉动物的锋利牙齿，鸟类的大喙，胡须，爪子，这样的例子不胜枚举。需要指出的是，并非所有这些适应性都是在几代之内完成的，因为其中一些经历了数十万年之久，很可能也跨越了相应的世代数。事实上，有机体无法在一代之内适应其环境，这条隐含的规则正是达尔文进化论的核心所在。如果这能发生，那么通过突变形式改变基因信息的需要就变得可有可无了。有机体生来就具有一套固定的特征，并且必须借助这些特征——也只能借助这些特征——与环境互动。没有任何东西是可以改变的。唯一可能发生的变化是在有机体繁殖且突变发生时。然而，变化仅见于后代身上。如果有机体在出生后还能适应，那么自然选择的过程就需要全新的解读。通常，所有观察到的适应性可以分为两类：


  1.  身体适应性

  2.  行为适应性


  身体适应性描述了有机体身体的变化。诸如翅膀的发育、带蹼的脚、锋利的爪子、奔跑速度更快的能力、身高/体重的变化、水下呼吸的能力等，都是身体适应性的例子。显然，看到这些身体变化需要数千年时间，在某些情况下，它们甚至会导致全新物种的诞生，从而与进化过程融合。


  行为适应性描述了有机体行为的变化，比如群体狩猎、群居生活、求偶等。需要指出的是，即使行为适应性不一定需要身体外观的改变，它们也并非在一代之内就能发生。即使这些适应性不需要改变物种的任何物理特性，它们也与大脑和神经系统的结构和功能相关，并且有机体天生就带有预编程的大脑来表现这些行为。这些行为也不会随着环境的变化而自动改变。


  ### 从单细胞开始


  达尔文进化论中关于繁殖和自然选择过程中后代特征随机变异以及适应性的原理，确实提供了一个框架，可以解释大约 40 亿年前从单细胞生物演化出现代人类的过程，但它并没有直接解释过去
  40 亿年中生命所发生的一切。地球上最早出现的生命形式构成了我们所谓的原核生物。原核生物是单细胞生物，其内部不包含任何诸如细胞核或线粒体之类的结构构件。细胞内部的这些结构元件被称为细胞器，类似负责细胞内特定功能的小器官。当时存在两类原核生物物种，称为细菌和古细菌。已有结论表明，在大约
  40 亿年前地球早期的形成阶段，地球的大气层与当前状态截然不同。它更稀薄，密度更低，并且即使有的话，也含有极少的氧气。氮气、二氧化碳和水蒸气是其主要成分。因此，这些原核生物不得不通过利用周围环境中的化学物质进行厌氧过程来获取能量。这样的原核生物被称为化能自养生物。因此，化能自养生物也不需要阳光，并且可以在恶劣条件下生存。这些细菌或古细菌中的一种，很可能就是科学家所称的*LUCA*，即“最后普遍共同祖先”，所有现存生命均起源于此。


  随着这些原核生物的出现，达尔文的理论开始发挥作用。随着这些有机体一次次地繁殖，原始物种的某些变异开始出现，后代也开始表现出一些新的特征和行为。自然选择淘汰了那些不适应环境条件的物种，这个过程持续了数百万年。在大约经历了
  5 亿年之后，也就是大约 35 亿年前，第一批蓝藻在地球上出现。它们仍然属于原核生物，但却拥有一个全新的特征，使它们能够捕获太阳能以维持生存。同时，捕获太阳能的过程会将大气中的二氧化碳转化为纯氧作为副产品。由于大气中二氧化碳含量丰富，这些物种大量繁殖，规模惊人。它们的生长对地球产生了深远的影响。它们对二氧化碳的持续消耗降低了其在大气中的比例，从而减弱了其温室效应。结果，地球开始冷却。这不仅将氧气引入了大气层，还将其含量增加到足以让其他物种利用它来产生能量的水平。




  进化的下一个重大步骤是真核生物的出现。真核生物同样是单细胞生物，但其细胞结构更为先进，包含具有自身膜结构的细胞器或结构组件，例如含有 DNA 的细胞核、线粒体或叶绿体等。真核生物从原核生物进化而来，历时约
  13 亿年，这是一个极其复杂且引人入胜的课题，至今仍是科学家们活跃研究的领域。关于真核生物可能的进化方式，存在多种不同的理论。其中最广为接受的理论称为**内共生学说**。内共生学说认为，真核生物是在多个原核生物物理融合成一个统一实体时进化而来的。人们已经观察到，某些原核生物有相互形成共生关系的倾向。在这种共生关系中，两种生物紧密生活在一起，并彼此受益。就真核生物而言，人们认为是一个原核细胞被另一个原核细胞吞噬。被吞噬的细胞并未被消化或溶解，反而在宿主体内继续生存并发挥功能，最终转变成了宿主物种的一个细胞器。有大量证据支持内共生学说。例如，考虑线粒体和叶绿体，它们是真核细胞中最常见的两种细胞器。它们不仅在大小和形状上分别与独立生存的原核物种——α-变形菌和蓝藻——相似，而且还拥有自身的
  DNA。这些 DNA 彼此相似，并且与宿主细胞核中的 DNA 是分离的。即使在今天，我们仍能看到许多动植物实例，其中原核生物与真核生物之间存在这种共生关系。细菌为宿主提供营养，作为回报，它们受到保护免遭捕食者侵害。真核生物的进化是地球生命史上的一个关键里程碑。它们体现了更复杂的细胞结构，为多细胞生物的形成铺平了道路。自然选择进一步使真核生物比原核生物更成功，它们最终成为地球上的主导生命形式。


  ## 多细胞生物


  根据化石年代测定，真核生物被认为是在大约 27 亿至 21 亿年前进化并繁荣起来的。从真核生物到多细胞生物的飞跃是物种进化的又一个重要里程碑。然而，直到大约 6
  亿年前才找到多细胞生物的明确证据。这留下了从 21 亿年到 15 亿年不等的巨大空白期，当时地球上仅存在单细胞真核生物和原核生物。但必须指出，没有发现化石并不排除在
  6 亿年前就出现多细胞生物的可能性。这也是另一个活跃的研究领域，每一次新发现或对早期发现化石的新分析，都在改变着目前确立的各种物种的时间线。因此，这些数字应仅作为粗略估计。即使这些时间线可能只是近似值，科学界对向多细胞物种的过渡是如何发生的已有充分理解。其核心，与促使原核生物形成真核生物的共生关系相同。这个过程可能比之前想象的要简单得多，并且极有可能在地球历史上发生过不止一次，而是多次。通常以*衣藻*为例来研究这种转变，因为它代表了大约
  2 亿年前才发生的最晚近的转变之一。*衣藻*是一种简单的真核生物，具有细胞壁、细胞核和叶绿体。它通过一分为二进行繁殖。作为进化的第一步，*衣藻*开始形成菌落。这些菌落本身仍然是一群单细胞生物。经过数千年的演变，菌落中的不同细胞开始根据其在菌落中的位置承担不同的、专门的职能。一些细胞变得更擅长为整个菌落获取养分，而另一些细胞则专注于繁殖和菌落的后续生长。有了这样的专门化分工，菌落不再仅仅是一群细胞，而是拥有了复杂且明确的结构。这些专门化分工还帮助菌落比其他未经历这些变化的菌落存活更久、生长更快。随着时间的推移，自然选择帮助这些菌落获得了优势。随着向越来越专门化的功能不断变化，细胞失去了个体性以及独立生存的能力，最终形成了一个真正的单一多细胞生物——海绵。




  ### 人类的到来


  在第一个多细胞生物诞生后，后续的变化变得顺畅得多，并以相对惊人的速度发生。做个比较：从第一个单细胞原核生物进化到更复杂但仍属单细胞的真核生物，花费了超过十亿年；而从海绵等第一批多细胞物种进化到已知最早的类似老鼠的哺乳动物`摩根齿兽`，只用了不到四亿年。哺乳动物是极其复杂精妙的物种，展现出诸多高级特征，例如体表有毛发或皮毛以抵御环境侵袭，能够分泌乳汁哺育后代，还拥有由特殊化的颚骨、脊骨和脊柱构成的高级身体结构，以及依靠心脏驱动的氧气循环系统。随后，从`摩根齿兽`等哺乳动物进化到以`普尔加托里猴`或`阿喀琉斯基猴`为代表的灵长类动物，用了不到一亿五千万年。灵长类动物标志着进化链上的又一个重要里程碑，它们拥有更高级的特征，例如朝前的眼睛提供双目视觉、手指能抓握、大脑更大、声道和交流能力更优，等等。从早期灵长类动物进化到以`查德沙赫人`为代表的最早原始人类，用了不到六千万年；从最早的原始人类进化到最早的`人属`物种（`能人`），用了不到五百万年；而从`能人`进化到`智人`（即现代人类），只用了二百五十万年。


  当前这一代现代人类，即`智人`的进化，可追溯至约二十万年前，其起源地在非洲。科学家们对确切时间存在一些争论，有些人认为`智人`早在三十万年前就已出现在地球表面。人们普遍认为，`智人`曾与丹尼索瓦人、尼安德特人等其他相关物种共存并杂交过一段时间，但最终彻底灭绝了其他物种。他们之间的差异相对较小，主要在于认知能力方面。为了给出量化依据，`智人`与`尼安德特人`的
  DNA 相似度约为 99.7%，而`智人`与丹尼索瓦人的 DNA 相似度约为 99.4%。与其他物种相比，`智人`与黑猩猩共享 98%的 DNA，而与`直立人`只共享
  97%，这使得我们在基因上与黑猩猩比与`直立人`更亲近。物种间若要杂交，其 DNA 必须极其接近，通常需超过 99%。大多数现代人类携带约 2%的尼安德特人 DNA，而美拉尼西亚人则继承了约
  4%至 6%的丹尼索瓦人 DNA。


  从那时起，人类迁徙到了地球各处，如今已占据了整个星球上几乎所有可居住的土地。这种扩散是相当惊人的，在地球生命史上前所未有。没有任何其他物种能够在未花费数百代在该区域进行进化适应的情况下，占据地球上气候条件如此多样化的区域。基因科学家发现，生活在世界不同地区的人类正在进化出一些微小但全新的特征，但这远不足以形成一个新物种。


  在过去的十万年左右，人类的物理外貌并没有太大变化。然而，行为上的变化确实在多个层面以前所未有的速度发生了，并且它们显然不符合我们在其他动物身上看到的行为适应概念或速率。让我们举个例子来说明这些差异。


  如果你从热带森林中挑选一大群狮子（大约几百只），把它们放到南极地区，这群狮子很可能在几年内（甚至更短）就会全部死亡。同样，如果你从南极挑选一群相似的北极熊，把它们放到亚马逊森林里，它们恐怕也会像狮子一样在几年内（甚至更短）死去。大多数其他动物也是如此，除了某些微生物（因为它们已经适应了在更严酷的条件下生存）。大多数体型较大的物种就是无法应对环境或栖息地如此剧烈的突然变化，从而走向死亡。


  另一方面，考虑一种情况：我们从亚马逊森林中挑选一群相似的人类，把他们放到北极地区，或者反过来。我们还要确保这群人与世界其他地方没有任何联系，也无法从那里获得帮助。在他们有生之年，这群人就会开始制作适应气候的衣物、鞋类，建造适合新气候的新型住所，制造新武器来猎取该地区的动物，找出该地区可作为食物的植物和蔬菜，最终他们会生存下来，甚至人口还会增长。起初他们可能不会高兴，至少第一代人如此，但无论如何，他们不会灭绝。




  ### 工具


  这便引出了工具的概念。这个看似简单随意的例子，从进化的角度来看，实际上有着相当深远的影响。它开辟了一条道路，通向与达尔文进化论的根本性决裂。事实上，如果人类*无需进化*来适应变化速度快了几个数量级的环境，那么他们的进化也就没有存在的必要了。进化的主要驱动力是适应与优胜劣汰，但人类创造了某种彻底改变游戏规则的东西，使他们能够在生物和基因层面保持*原样*的同时，适应地球提供的任何气候条件。帮助人类实现这一惊人壮举的秘密武器，便是工具的发明。“工具”这个概念本身相当笼统和模糊，所以让我们来明确一下。工具可以包括人类利用其天然器官（如手、脚、大脑等），并借助地球上可利用的生物或非生物所创造的一切事物。典型的例子包括衣物、武器、房屋、汽车，甚至宠物。人类如何从野狼中培育出家犬，这一过程已经得到了充分的研究和记录。


  工具的创造和使用，或许标志着人类最伟大的成就，这使他们成为一个完全与众不同的物种类别。没有任何其他物种展现出像人类那样灵活地创造此类工具的能力。确实有其他物种使用工具的例子，比如黑猩猩用棍棒捕捉昆虫，或用树叶从溪流中饮水等。然而，这些工具在数十万年间没有任何变化。鸟类筑巢、蜜蜂筑巢等也是如此。然而，这些物种创造和/或使用这些工具的能力归功于进化（这需要历经数百代才能实现），而非适应（这可以在短短一代到几代的生命周期内发生）。


  工具使人类无需改变其身体外貌。这些工具增强了人类的核心外表和能力，并使其适应在变化的环境中生存。人类发达的大脑也能够在几天甚至几小时内改变行为。我们能够从过去的经验中学习，可以在需要时团队协作，或在独自工作更高效时独行；我们能够互相交流，在几分钟内而非几代人的时间里传递知识，等等。换句话说，我们能够在同一代内就进化到如此高的适应水平，而其他动物需要数百代（甚至数千代）才能达到。


  值得注意的是，我们在二十一世纪拥有的所有工具，在三十万年前人类刚出现时都并不存在。我们花了很长时间才走到今天这一步。尽管从生物学意义上讲，人类在那段时间里并没有太多进化，但工具却在不断进化。


  ## 达尔文进化论的替代理论


  到目前为止，我们已经从基于基因变异和自然选择的达尔文进化论角度讨论了物种进化。尽管这是最被广泛接受的理论之一，但也提出了一些替代理论。探究其中一些主要的候选理论会很有趣。


  如果一个理论无懈可击，那么就不存在科学的替代理论。例如，我们可以考虑牛顿运动定律。所有三大定律都已通过反复的真实实验和自然现象的观察得到了毋庸置疑的证明（除非我们进入星际距离和接近光速的速度），因此没有任何替代理论来解释物体之间的物理相互作用。即使达尔文的理论如此优雅且极其简洁，它也是基于一系列逻辑论证以及数十亿年间各种随机性的组合，而不像牛顿定律那样完全基于数学方程，没有任何随机性的余地。因此，在进化论中找出漏洞并非难事。尽管从实验证据的角度来看，它还处于如此微妙的境地，但尚未发现任何根本性的缺陷。然而，仍然存在一些不能完全忽视的挑战。以下是主要的一些批评意见：（1）无法解释生命的起源；（2）不足以解释不一致的化石记录；（3）难以解释明显的“目的论”或“有目的的进化”；以及（4）难以解释适应与“外适应”之间的区别。


  达尔文的理论在生命已经起源之后才真正发挥作用，因此推动该理论的两个基本原则无法解释生命最初是如何产生的。我们在前一章中对此进行了详细探讨，但没有任何理论是基于进化论的。这种批评是合理的，但它只是指出了进化论可以解释的现象的范围，并没有真正证伪它。然而，有人可以声称，可能存在一个更好、更通用的理论，能够以更简洁的方式解释生命的起源以及地球上所有物种的出现，这类似于试图统一量子力学和相对论等不同物理法则的弦理论。


  化石记录及其碳定年法是我们用来证明或反驳任何理论的唯一真实参考或事实。不幸的是，我们迄今为止发现的化石在时间和空间上的分布并不均匀，而且显然受到各地区发掘情况的偏见影响。根据达尔文的理论，我们应该能够看到所有物种所有特征的逐渐变化，但化石记录中存在着明显的空白，这些空白在不同物种及其进化过渡之间造成了“缺失环节”。这些空白的存在并不一定证伪达尔文的理论，但它再次为另一种能够更好地解释这些空白的理论打开了可能性。




  ### 目的论


  目的论这一概念认为，我们如今所看到的世界是出于某种目的而被创造的。目的论指出，所有曾经存在过的生物以及迄今为止已经灭绝的生物，它们的出现和消亡都有其目的。它更偏向哲学而非科学，这无疑使其更具争议性。在探寻世界创造之目的的旅程中，我们不可避免地会联想到上帝的概念。既然人类是地球上的主导生物，那么上帝创造世界必定是为了让人类在其中生活和发展。由于该理论并未明确说明世界创造背后的终极目的（除却我们今天所见的现象之外），因此极难被推翻。我们迄今为止可能获得的任何证据都能与这一理论相契合。然而，该理论的预测能力非常有限。对于任何科学理论，我们都应当能够改变设置中的参数，并且理论应当能够预测结果将如何变化。以达尔文的进化论为例，如果我们假设导致恐龙灭绝的灾难性事件并未发生，那么该理论可以预测当前地球上的生物群落会是什么样子。然而，对于目的论这样的理论来说，过去发生了什么对于预测现在并不重要。它从一开始就假设现在必然是我们现在所看到的样子！它使用了一种近乎循环论证的方式，即用最终结果本身来证明它是如何产生的。任何陈述都可以通过循环论证来证明。达尔文的理论除了指出当前地球状态是两大基本原理与天文事件按时间顺序发生相结合的科学而系统的结果之外，当然无法解释其背后的目的。


  ### 扩展适应


  扩展适应这个词是为了解释某物种的一个特征或性状最初为了一种目的而进化，后来却被用于另一种目的而创造的。扩展适应的一个常见例子是鸟类对羽毛的利用。羽毛最初是为了提供温暖和隔绝外界环境而进化出来的，但后来却被用来帮助它们飞行。在其他物种中也可以找到许多类似的例子。这一过程与达尔文的进化论有所偏离。根据进化论，物种进化出有助于它们更好适应环境的特征，但遗传特性的固有随机性也可能导致产生一些既无益也无害的特征，或者具有多种用途的特征。


  ### 拉马克主义


  现在我们已经了解了达尔文理论面临的一些主要挑战或批评，让我们来看看一些被提出的主要替代理论。其中一个获得了一定追随者的主要替代理论被称为拉马克主义，以其提出者让-巴蒂斯特·拉马克命名。根据拉马克主义，不仅遗传性状会从父母传给后代，而且如果父母在一生中获得了一些后天性状，这些性状也会传给后代。为了说明这一概念，让我们考虑一个涉及人类的例子：根据拉马克主义，如果一个孩子的父母在孕育孩子之前花了很长时间（多年）学习钢琴并变得非常擅长，那么这个孩子出生时可能天生就拥有更适合弹奏钢琴的手指。这听起来可能很直观，因为从历史上看，我们看到孩子往往会继承父业，并且随着时间的推移，我们看到他们在这方面做得越来越好。就像一个铁匠的儿子成为了更好的铁匠，一个木匠的女儿成为了更好的木匠，等等。然而，孩子们在传统行业中做得更好的真正原因，是因为他们从童年早期就学习了行业的窍门，并有机会加以改进。从严格的遗传学角度来看，没有任何证据表明这种后天性状是可以遗传的。


  ### 突变论


  另一种理论被称为突变论。它借用了达尔文理论中随机遗传变异的概念，并将其推向了极端。该理论指出，突变不是渐进的，而是突发的。物种特征的巨大变化可能在一代之内发生。如果这些变化是有益的，它们就会被传给下一代，否则就不会。这一理论可以解释我们迄今为止发现的一些化石中的空白或不一致性，但在大多数其他情况下，该理论是站不住脚的。突变论的主要问题之一在于，它无法解释我们在化石记录中观察到的渐进变化，也无法解释我们在现存生物体中观察到的变异和适应模式。大多数突变是有害或中性的，只有极小一部分是有益的，这意味着出现大规模有益突变的概率非常低。此外，突变论也无法解释像眼睛或鸟类的翅膀这样复杂的适应结构是如何通过突然的、大规模的突变而产生的。这些复杂的结构是一个长期渐进式的精炼和适应过程的结果，而非一个突然的、奇迹般的变化。


  ### 智能设计论


  接着是智能设计论。该理论声称，我们在人类或其他一些高级物种身上看到的某些特征过于复杂，不可能是纯粹随机和自然选择的结果。该理论试图论证，从统计学角度看，这些特征在大约
  40 亿年左右的时间里从无到有地被创造出来的可能性极低，因此必定存在一个超自然的存在正在刻意地设计地球上的生命。要实际计算出从单细胞微生物到人类出现的概率数学是一项极其艰巨的任务，但并非不可能。如果我们考虑到通过化石记录发现的所有中间物种，那么人类被创造出来的几率实际上相当高。然而，这仍然建立在一系列不确定性的链条之上，很容易遭到反驳。最终，这一理论被证明更偏向哲学而非科学。


  智能设计论与目的论非常相似，但两者之间的一个关键区别在于，智能设计论范式中存在一个创造者。而在目的论中，则不需要这样一个创造者。


  ## 结论


  在本章中，我们考察了人类从单细胞生物进化而来的过程，这推动了我们理解人工智能（AI）本质与设计的旅程。在下一章中，我们将继续这一旅程，探索人类是如何获得智慧的。


