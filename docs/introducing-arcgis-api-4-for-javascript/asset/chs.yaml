  /]+$/, '') + 'app',\n    main: 'main'\n  }]\n};\n```\n\n### 我的精彩门户项目\n\n您可以编写自己的应用程序来加载您的门户信息。\n\
  \n```javascript\nimport Portal from \"esri/portal/Portal\";\nimport PortalItem from\
  \ \"esri/portal/PortalItem\";\nimport OAuthInfo from \"esri/identity/OAuthInfo\"\
