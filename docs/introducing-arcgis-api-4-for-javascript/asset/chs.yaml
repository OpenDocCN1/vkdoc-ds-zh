  }\n\nexport default SummaryViewModel;\n```\n\n为你的 `ViewModel` 导入所有依赖项后，你需要创建一个类型，用于图表中使用的数据。该类型将保存\
  \ `FeatureLayer` 中各值的计数。\n\n```typescript\nexport type Stats = {\n  \"Carcinogen\"\
  : number,\n  \"PBT\": number,\n  \"Non-PBT\": number,\n  \"Metal\": number\n};\n\
  ```\n\n这四个值将显示在你的图表中。然后，你基于该类型创建一个数据对象，其初始值为 `0`。\n\n```typescript\nconst stats:\
  \ Stats = {\n  \"Carcinogen\": 0, // CARCINOGEN == \"Yes\"\n  \"PBT\": 0,      \
  \  // CLASS == \"PBT\"\n  \"Non-PBT\": 0,    // CLASS == \"Non-PBT\"\n  \"Metal\"\
  : 0       // METAL == \"Yes\"\n};\n```\n\n这里你可以看到一些注释，用于说明数据中的字符串值对应每个类别的含义。`ViewModel`\
  \ 上有两个可观察的属性：`count` 和 `stats`。\n\n初始化 `ViewModel` 时，你将监听视图何时更新，然后找到你感兴趣的 `FeatureLayerView`\
  \ 用于图表。\n\n```typescript\nconstructor() {\n  super();\n  whenOnce(store, \"view\"\
  ).then(_ => {\n    return store.webmap.findLayerById(\"tri\");\n  })\n  .then(layer\
  \ => {\n    return store.view.whenLayerView(layer);\n  })\n  .then(this.watchLayerView.bind(this))\n\
  \  .otherwise(errorHandler);\n}\n```\n\n接下来，你将监听 `view.stationary` 的变化，以便查询 `FeatureLayerView`\
  \ 获取数据，并使用视图的范围将结果限制为可见数据。\n\n```typescript\nprivate watchLayerView(layerView: FeatureLayerView)\
  \ {\n  const queryFeatures = this.queryLayerView(layerView);\n  init(store, \"view.stationary\"\
