  2     portalItem: {\n3       id: layerPortalId\n4     }\n5   });\n```\n\n`Layer`\
  \ 类将验证门户项目是否为图层，然后确定它需要成为哪种类型的图层，例如 `TileLayer` 或 `FeatureLayer`。\n\n也许你想为你的门户项目在应用程序中构建一个简单的浏览器。你可以使用\
