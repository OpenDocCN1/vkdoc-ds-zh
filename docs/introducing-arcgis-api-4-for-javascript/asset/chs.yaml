  \ 的辅助方法。\n\n```typescript\n1    Carcinogen\n```\n\n这将在构建微件 DOM 时，将不同的 CSS 类组合成一个字符串。\n\
  \n现在，你已经将微件与 `ViewModel` 连接起来，并将 `ViewModel` 与应用程序存储连接起来。`ViewModel` 将处理随着地图平移而更新图表数据的业务逻辑。微件将处理创建和适当显示图表数据的逻辑。在这种情况下，你的应用程序实现了良好的关注点分离。\n\
  \n你可以参考完整的演示应用程序¹⁹来了解如何实现自定义微件并编译 TypeScript。\n\n\n\n## 总结\n\n在本章中，你学习了如何使用 ArcGIS\
  \ API for JavaScript 中的新微件框架来创建 `ViewModel` 和 `Widget`，使它们能够清晰地处理各自的任务。现在，你已经很好地掌握了如何使用一些辅助装饰器来简化属性与可渲染属性的绑定。同时，你也深入理解了如何将属性值绑定到\
  \ JSX 中以进行显示。\n\n关于自定义微件开发的更多详细信息，你可以在文档中找到，此外还有一个 Hello World 示例和一个更复杂的示例。请记住，自定义微件开发确实需要对\
  \ `Accessor` 有一定的了解。不过，与常规 JavaScript 相比，这些装饰器使得实现 `Accessor` 变得更加简单。\n\n## 脚注\n\
