- "# 3. 地图与视图\n\n最新版本的 ArcGIS API 创建地图的方式与 3.x 版本有所不同。\n\n```\n1   import Map from\
  \ \"esri/Map\";\n2   import SceneView from \"esri/views/SceneView\";\n\n4   const\
  \ map = new Map({ basemap: \"topo\" });\n5   const view = new SceneView({\n6   \
  \  container: \"mainDiv\",\n7     map,\n8     center: [-118.182, 33.913],\n9   \
  \  scale: 836023\n10   });\n```\n\n现在，地图（以及构成地图的图层）与地图数据的显示方式之间存在着明显的区别。你可以将地图视为数据源，而将视图视为地图的视觉表现。\n\
  \n你可以在图 3-1 中看到这种关系。\n\n![A458961_1_En_3_Fig1_HTML.jpg](img/A458961_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n地图-视图关系\n\n在图 3-1 中，你可以看到地图是各种空间服务的容器。同一张地图现在可以显示在 `MapView`（数据的二维表示）或\
  \ `SceneView`（数据的三维表示）中。每个视图负责数据的视觉显示方式。\n\n这意味着在 3.x API 中你可能认为理所当然的一些功能，例如直接在\
  \ `FeatureLayer` 上访问图形，将不再可用。这是因为一个视图可能显示一个图层中的 10 个要素，而另一个视图可能显示同一图层中的 100 个要素。正如你在图\
  \ 3-1 中所见，视图中的每个图层都表示为一个 `LayerView`。你可以通过使用 `view.whenLayerView(sourceLayer)` 来获取视图的\
  \ `LayerView`。当 `LayerView` 完成时，这将返回一个 `LayerView` 的 Promise。通过这样做，你可以访问视图中显示的实际图形。\n\
  \n地图与视图的分离是 ArcGIS API for JavaScript 4 中引入的一个强大的新概念。借助此功能，你可以创建十几个使用不同服务的地图，而无需在将地图附加到视图之前预先加载所有数据。这允许你将地图视为应用程序中的纯数据源，即使不显示地图也能访问图层。\n\
  \n## WebMap\n\n在 API 的第 4 版中使用 `WebMap` 对象从未如此简单。你可以在 ArcGIS 图库中搜索各种 `WebMap`。¹\n\
  \n要创建一个 `WebMap`，你只需要拥有门户中该项的 `id` 值。\n\n```\n1   import MapView from \"esri/views/MapView\"\
  ;\n2   import WebMap from \"esri/WebMap\";\n\n4   const webmap = new WebMap({\n\
  5     portalItem: {\n6       id: \"2dfaf8bdb45a4dcf8511a849e4583873\"\n7     }\n\
  8   });\n\n10   const view = new MapView({\n11     map: webmap,\n12     container:\
  \ \"viewDiv\"\n13   });\n```\n\n就是这样。将 `WebMap` 对象加载到应用程序中只需这些步骤。但由于地图只是一个数据容器，你可以在将其显示在页面上之前访问\
  \ `WebMap` 数据。\n\n例如，假设你想在显示 `WebMap` 对象中的某个图层之前调整其 `definitionExpression`。你可以这样做：\n\
  \n```\n1   // http://jsbin.com/lodihu/4/edit?html,output\n2   const webmap = new\
  \ WebMap({\n3     portalItem: {\n4       id: \"2dfaf8bdb45a4dcf8511a849e4583873\"\
  \n5     }\n6   });\n\n8   webmap.load().then(() => {\n9     const layer = webmap.layers.find({\
  \ id } => {\n10       return id.indexOf(\"CensusTractPoliticalAffiliationTotals\"\
  ) > -1;\n11     });\n12     layer.definitionExpression = \"TOTPOP_CY > 10000\"\n\
  13     const view = new MapView({\n14       map: webmap,\n15       container: \"\
  viewDiv\"\n16     });\n17   });\n```\n\n这相当酷。请注意，你必须调用 `WebMap` 对象的 `load()` 方法。这是因为当\
  \ `WebMap` 被初始化时，数据不会被预取。只有当 `WebMap` 被添加到视图时，它才会加载显示所需的数据。通过调用 `load()` 方法，你是在请求\
  \ `WebMap` 加载你的数据，因为你出于某种原因需要使用它。这还有一个额外的好处，即允许你创建多个 `WebMap` 对象，并根据需要将它们传递给视图。\n\
  \n```\n1   const webmapids = [\n2     \"e691172598f04ea8881cd2a4adaa45ba\",\n3 \
  \    \"2dfaf8bdb45a4dcf8511a849e4583873\"\n4   ];\n\n6   // 创建一个 WebMap 数组\n7  \
  \ const webmaps = webmapids.map(webmapid => {\n8     return new WebMap({\n9    \
  \   portalItem: {\n10         id: webmapid\n11       }\n12     });\n13   });\n```\n\
  \n然后，你可以将这些 `WebMap` 对象保留在内存中，直到你实际需要它们并在视图中使用它们。也可以在运行时切换视图的地图。\n\n需要注意的是，在 4 的初始版本中，`WebMap`\
  \ 尚不支持所有图层和渲染器，但完全支持的工作正在进行中。任何不支持的图层都将被定义为 `UnsupportedLayer`。还有一种图层类型叫做 `UnknownLayer`，当无法确定图层类型时使用。引入此图层是为了应对未来可能添加的新图层类型。\n\
  \n## LayerView\n\n由于地图仅仅是数据和图层的容器，而视图负责显示这些数据，因此你与数据交互的方式发生了变化。在 ArcGIS API for\
  \ JavaScript 的 3.x 版本中，你可以直接从图层访问 `FeatureLayer` 中的图形。在 API 的第 4 版中，图形包含在视图中，更确切地说，包含在\
  \ `LayerView` 对象中，该对象是图层在视图中的表示。\n\n你可以像这样访问图层：\n\n```\n1   view.whenLayerView(layer).then((layerView)=>{\n\
  2     // 对 LayerView 执行某些操作\n3   });\n```\n\n一旦你拥有了 `LayerView` 并希望与 `FeatureLayer`\
  \ 显示的要素进行交互，你可以通过一个名为 `queryFeatures` 的方法来访问它们。\n\n```\n1   view.whenLayerView(layer).then((layerView)=>{\n\
  2     // 确保 layerView 已完成图形的绘制\n3     watchUtils.whenTrueOnce(layerView, \"updating\"\
  , ()=>{\n4       layerView.queryFeatures().then((graphics)=>{\n5         // 对 Graphics\
  \ 执行某些操作\n6       });\n7     });\n8   });\n```\n\n你可以在 `FeatureLayer LayerView`\
  \ 上使用其他一些有用的查询方法。\n\n*   `queryExtent`：返回 `LayerView` 中要素的范围\n*   `queryFeatureCount`：返回\
  \ `LayerView` 中要素的计数\n*   `queryObjectIds`：返回一个 `ObjectId` 数组，这对于针对 REST API 执行更多查询任务非常有用\n\
  \n如果你想创建一个能够与显示的要素进行交互的自定义微件，这些方法都非常有用。\n\n\n\n## 图层\n\n在 `WebMap` 中检索图层非常简单。要访问地图上的图层，只需从\
  \ `map.layers` 属性中获取即可。该属性会提供地图的操作图层，这意味着不包含底图。如果你想要包括底图在内的所有图层，可以使用 `map.allLayers`\
  \ 属性。相比 3.x 版本，这是一个更简单的 API。\n\n如果你只关心底图，可以通过 `map.basemap` 属性获取。\n\n重申一下，视图和 `LayerView`\
  \ 才是实际绘制地图数据的部分。它们控制着图形的显示、范围以及任何其他视觉属性。而地图和图层则是这些数据的容器。它们是地图的模型，这意味着在应用程序开发中，你可以将它们视为模型来处理。地图和图层可以作为图表、表格或任何其他可能甚至没有地图显示的自定义组件的数据源。这是该\
  \ API 的一个强大特性。\n\nAPI 中提供了多种图层，每种图层都有不同的用途。你可以在 API 文档中阅读每种图层类型的更多详细信息，但以下是一些常见的图层：\n\
  \n*   `GraphicsLayer`\n*   `FeatureLayer`\n*   `MapImageLayer`\n*   `SceneLayer`\n\
  *   `VectorTileLayer`\n\n### GraphicsLayer\n\n`GraphicsLayer` 可能是你能用到的最简单的图层。顾名思义，它只包含显示在地图上的图形。\n\
  \n注意\n\n如果你熟悉 ArcGIS API for JavaScript 3.x 版本的 `GraphicsLayer`，那么 4 版本中 `GraphicsLayer`\
  \ 的一个主要区别是它不支持渲染器。你需要在每个图形上定义符号，而不是在图层上定义。这是因为 `GraphicsLayer` 可以支持具有不同几何类型的图形。这大大简化了创建要显示在地图上的基本图形的过程。\n\
  \n初始化一个 `GraphicsLayer` 相当简单。\n\n```\n1   const graphicsLayer = new GraphicsLayer({\n\
  2     graphics: [graphic1, graphic2, graphic3]\n3   });\n```\n\n你可以通过几种方法向 `GraphicsLayer`\
  \ 添加图形。\n\n```\n1   // 添加单个图形\n2   graphicsLayer.add(graphic);\n3   // 添加图形数组\n\
  4   graphicsLayer.addMany([graphic1, graphic2, graphic3]);\n```\n\n由于无法为 `GraphicsLayer`\
  \ 设置渲染器或弹出模板，你需要为每个图形单独定义符号和弹出窗口。\n\n```\n1   // 创建一个图形\n2   let graphic = new Graphic({\n\
  3     attributes: {\n4       id: 1,\n5       city: \"Los Angeles\"\n6     },\n7\
  \     geometry: { type: \"point\", x: xValue, y: yValue },\n8     symbol: { type:\
  \ \"simple-marker\",\n9       style: 'circle',\n10       color: 'red',\n11     \
  \  size: 10,\n12       outline: {\n13         color: 'rgba(255, 255, 255, 0.5)'\n\
  14         width: 4\n15       }\n16     },\n17     popupTemplate: {\n18       title:\
  \ \"我的超棒图形！\",\n19       content: \"{*}\" // 显示所有字段\n20     }\n21   });\n\n23  \
  \ // 将其添加到 graphicsLayer\n24   graphicsLayer.add(graphic);\n```\n\n弹出窗口将在后续章节中更详细地介绍。\n\
  \n如果你需要更强大的图形支持，特别是使用渲染器和弹出窗口，那么你应该使用 `FeatureLayer`。`GraphicsLayer` 最适合作为简单的杂项图形容器。\n\
  \n### FeatureLayer\n\n`FeatureLayer` 可能是 ArcGIS 平台中用途最广泛、使用最广泛的图层类型。有几种不同的方法可以初始化一个\
  \ `FeatureLayer`。\n\n```\n1   // 通过 URL 创建\n2   const featureLayer = new FeatureLayer({\n\
  3     url: \"http://services6.arcgis.com/m3L8QUZ93HeaQzKv/arcgis/rest/services/BeerAn\\\
  \n4   dBurgerJoints/FeatureServer/0\"\n5   });\n\n7   // 通过 Portal 项目创建\n8   const\
  \ featureLayer = new FeatureLayer({\n9     portalItem: {\n10       id: \"b126510e440744169943fd8ccc9b0c4e\"\
  \n11     }\n12   });\n```\n\n通过这两种方法之一初始化 `FeatureLayer` 后，该图层就绑定到了一个远程服务。就像你可以查询\
  \ `FeatureLayer` 的 `LayerView` 一样，你也可以直接查询 `FeatureLayer` 来查找要素、`ObjectId` 或 `FeatureLayer`\
  \ 的范围。\n\n你也可以通过 `FeatureCollection` 创建 `FeatureLayer`，尽管与 API 的 3.x 版本相比，这个过程已经简化了。\n\
  \n```\n1   const featureLayer = new FeatureLayer({\n2     objectIdField: \"item_id\"\
  ,\n3     geometryType: \"point\",\n4     // 定义 FeatureLayer 中图形的字段\n5     fields:\
  \ [{\n6       name: \"item_id\",\n7       alias: \"项目 ID\",\n8       type: \"oid\"\
  \n9     }, {\n10       name: \"description\",\n11       alias: \"描述\",\n12     \
  \  type: \"string\"\n13     }, {\n14       name: \"title\",\n15       alias: \"\
  标题\",\n16       type: \"string\"\n17     }],\n18     // 为图层定义渲染器\n19     renderer:\
  \ {\n20       type: \"simple\",\n21       symbol: {\ntype: \"simple-marker\",\n\
  22         style: 'circle',\n23         color: 'red',\n24         size: 10,\n25\
  \         outline: {\n26           color: 'rgba(255, 255, 255, 0.5)'\n27       \
  \    width: 4\n28         }\n29       }\n30     },\n31     popupTemplate: {\n32\
  \       title: \"{title}\",\n33       content: \"{description}\"\n34     },\n35\
  \     // 这是一个图形集合\n36     source: [graphic1, graphic2, graphic3]\n37   });\n```\n\
  \n这里你正在做的是手动定义 `FeatureLayer` 的数据源。这基本上传递了一个图形集合，并为这些图形定义了渲染器，以及字段和弹出窗口。这样做的好处是能够为多个图形使用单个渲染器以及单个弹出窗口。你还可以像查询绑定到远程服务的\
  \ `FeatureLayer` 一样，查询这个 `FeatureLayer`。\n\n现在，也许你想更新 `FeatureLayer` 中的源要素。你可以通过以下方式实现：\n\
  \n```\n1   const graphicOfInterest = featureLayer.source.find(x => x.attributes.OBJECTID\
  \ ==\\\n2   = oid);\n3   const target = graphicOfInterest.clone();\n4   const target.geometry\
  \ = updatedGeometry;\n5   featureLayer.source.remove(graphicOfInterest);\n6   featureLayer.source.add(target);\n\
  ```\n\n这允许你更新 `FeatureLayer` 源中的单个图形。如果你想显示更新的 GPS 数据或更改单个要素的符号，这会非常有用。\n\n\n\n\
  #### MapImageLayer\n\n`MapImageLayer` 以前被称为 `ArcGISDynamicMapServiceLayer`。它允许你将动态地图服务加载到应用程序中，与切片图像服务不同，它会为整个地图范围加载单个图像，而不是许多切片。\n\
  \n这是一个相当简单的图层。你甚至可以在 `MapImageLayer` 中定义哪些子图层可见，这在以前是一项繁琐的任务。现在处理子图层要容易得多。\n\n```\n\
  1   const layer = new MapImageLayer({\n2     url: \"https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\\\
  \n3   r\",\n4     sublayers: [{\n5       id: 0,\n6       visible: true\n7     },\
  \ {\n8       id: 1,\n9       visible: true\n10     }, {\n11       id: 2,\n12   \
  \    visible: true\n13     }, {\n14       id: 3,\n15       visible: false\n16  \
  \   }]\n17   });\n```\n\n你可以简单地在 `MapImageLayer` 的 `sublayers` 属性中定义每个子图层的可见性。你甚至可以更进一步，为单个子图层提供\
  \ `definitionExpression`。\n\n```\n1   let layer = new MapImageLayer({\n2     url:\
  \ \"https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\\\n\
  3   r\",\n4     sublayers: [{\n5       id: 0,\n6       visible: true\n7     }, {\n\
  8       id: 1,\n9       visible: true\n10     }, {\n11       id: 2,\n12       visible:\
  \ true,\n13       // provide a definitionExpression\n14       definitionExpression:\
  \ \"pop2000 > 1000000\"\n15     }, {\n16       id: 3,\n17       visible: false\n\
  18     }]\n19   });\n```\n\n现在，当请求图像时，这将为动态地图服务的子图层传递一个 `definitionExpression`。这遵循了\
  \ ArcGIS API for JavaScript 整个第 4 版的主题，即提供更简单的 API。我完全期望人们会利用这个更易用的 API，在他们的应用程序中实现\
  \ `MapImageLayer` 的实用功能。\n\n在 ArcGIS API 4 for JavaScript 的第 4 版中，你定义的子图层将是 `MapImageLayer`\
  \ 中唯一使用的子图层。如果你正在处理一个包含数百个图层的地图服务，这将非常有用，我个人见过太多这样的情况。\n\n你还可以为每个子图层定义一个 `popupTemplate`²\
  \ 和一个 `renderer`³。\n\n```\n1   const layer = new MapImageLayer({\n2     url: \"\
  https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\\\n3  \
  \ rver\",\n4     sublayers: [\n5     {\n6       id: 3,\n7       visible: true,\n\
  8       renderer: {type: \"simple\",\n9         symbol: { type: \"simple-fill\"\
  ,\n10           style: \"solid\",\n11           color: \"dodgerblue\",\n12     \
  \      outline: {\n13             width: 0.5,\n14             color: \"white\"\n\
  15           }\n16         },\n17         label: \"State boundaries\"\n18      \
  \ },\n19       opacity: 0.5\n20     },\n21     {\n22       id: 2,\n23       visible:\
  \ true,\n24       popupTemplate: {\n25           title: \"{NAME}\",\n26        \
  \   content: [\n27           {\n28             fieldInfos: [\n29               {\n\
  30                 fieldName: \"POP2000\",\n31                 visible: true,\n\
  32                 label: \"Population for year 2000\",\n33                 format:\
  \ {\n34                   places: 0,\n35                   digitSeparator: true\n\
  36                 }\n37               },\n38               {\n39              \
  \   fieldName: \"POP2007\",\n40                 visible: true,\n41             \
  \    label: \"Population for year 2007\",\n42                 format: {\n43    \
  \               places: 0,\n44                   digitSeparator: true\n45      \
  \           }\n46               }\n47             ]\n48           },\n49       \
  \    {\n50             type: \"media\",\n51             mediaInfos: [\n52      \
  \         {\n53                 title: \"Population\",\n54                 type:\
  \ \"column-chart\",\n55                 caption: \"\",\n56                 value:\
  \ {\n57                   theme: \"Grasshopper\",\n58                   fields:\
  \ [ \"POP2000\", \"POP2007\" ],\n59                   normalizeField: null,\n60\
  \                   tooltipField: null\n61                 }\n62               }\n\
  63             ]\n64           }\n65           ]\n66         }\n67     },\n68  \
  \   {\n69       id: 0,\n70       visible: true,\n71       definitionExpression:\
  \ \"POP2000 > 100000\"\n72     }]\n73   });\n```\n\n这非常强大，因为你现在可以像使用 `FeatureService`\
  \ 一样轻松地处理地图服务。在 API 的 3.x 版本中，为动态地图服务定义自定义渲染器的功能已经存在了一段时间，并且作为 ArcGIS Server 地图服务的一部分也已经存在了一段时间。从\
  \ ArcGIS API for JavaScript 的第 4 版开始，新特性是它简化了 API，使开发人员更容易利用这一功能。能够为每个子图层定义弹出窗口的功能增加了\
  \ `MapImageLayer` 的实用性，我毫不避讳地说，我认为这是我现在个人最喜欢的 API 图层。\n\n你还可以通过查询表和表连接对 `MapImageLayer`\
  \ 做更多事情，前提是你的服务中有这些数据。请查看文档⁴了解这些细节，并尽情享受 `MapImageLayer` 的强大功能。\n\n#### CSVLayer\n\
  \n`CSVLayer`⁵ 在 ArcGIS API 4 for JavaScript 中非常有用，用于在空间上表示表格数据。\n\n只要 CSV 文件具有以下名称的坐标字段，它就可以为你转换文件：\n\
  \n*   经度字段名称：`lon`、`lng`、`long`、`longitude`、`x`、`xcenter`、`longitude83`、`longdecdeg`、`POINT-X`\n\
  *   纬度字段名称：`lat`、`latitude`、`y`、`ycenter`、`latitude83`、`latdecdeg`、`POINT-Y`\n\n\
  如果你的 CSV 文件不符合该格式，你可以使用 `CSVLayer` 的 `latitudeField` 和 `longitudeField` 属性指定自定义的纬度和经度字段名称。\n\
  \n```\n1   let csvLayer = new CSVLayer({\n2    url: \"http://ontheinternet/mydata.csv\"\
  ,\n3    copyright: \"Please provide a copyright for the data\"\n4   });\n```\n\n\
  请注意，根据 CSV 文件的来源，你可能需要在应用程序中提供一个 `proxyRule`。\n\n```\n1   urlUtils.addProxyRule({\n\
  2    urlPrefix: \"ontheinternet\",\n3    proxyUrl: \"/proxy/\"\n4   });\n```\n\n\
  #### SceneLayer\n\n处理 3D 地图的一个关键组件是 `SceneLayer`。`SceneLayer` 允许你将场景服务⁶ 加载到你的 3D\
  \ 地图应用程序中。一旦你有了 `SceneLayer`，通过 `SceneView` 将其添加到你的 3D 地图中就相当简单了。\n\n```\n1   const\
  \ sceneLayer = new SceneLayer({\n2     url: \"http://scene.arcgis.com/arcgis/rest/services/Hosted/Building_Boston/Scen\\\
  \n3   eServer/layers/0\";\n4   });\n\n6   const map = new Map({\n7     basemap:\
  \ \"streets\",\n8     ground: \"world-elevation\",\n9     layers: [sceneLayer]\n\
  10   });\n\n12   const view = new SceneView({\n13     container: \"viewDiv\",\n\
  14     map: map,\n15     scale: 50000000,\n16     center: [-101.17, 21.78]\n17 \
  \  });\n```\n\n我将在后面的章节中介绍 3D 可视化和 `SceneView`，但你真正需要知道的是，将 `SceneLayer` 添加到你的地图中与添加其他图层的方式完全相同。\n\
  \n\n\n#### `VectorTileLayer`\n\n矢量切片非常有趣。Mapbox 不久前发布了矢量切片规范⁷，事实证明它的用途极其广泛。矢量切片的文件体积很小，这使得我们可以构建高分辨率底图并高效缓存数据。矢量切片本质上是以一种紧凑的格式存储矢量数据，从而允许在浏览器中灵活地设置这些矢量要素的样式。这与创建无法在浏览器中设置样式的切片图像数据形成了对比。\n\
  \n通常，你会有一个单一的服务来为你的应用程序提供所有矢量切片。不过，你可以为这些服务加载不同的样式，这样就能加载相同的数据，但呈现不同的外观。\n\n当你初始化一个\
  \ `VectorTileLayer` 时，其方式与其他图层相同。\n\n```\n1   const tileLyr = new VectorTileLayer({\n\
  2     url: \"https://www.arcgis.com/sharing/rest/content/items/f96366254a564adda1dc46\\\
  \n3   38b447ed956/resources/styles/root.json\"\n4   });\n```\n\n如果你查看用于初始化 `VectorTileLayer`\
  \ 的 URL，你会发现它实际上指向的是一个样式文件，而不是特定的图层 ID。你指向的 URL 是 `resources/styles/root.json`。这实际上只是一个样式文件，它定义了\
  \ `VectorTileLayer` 在地图上渲染时应采用的样式。\n\n你实际上可以在运行时通过使用 `loadStyle()` 方法来切换 `VectorTileLayer`\
  \ 的样式，例如 `vectorTileLayer.loadStyle(myNewStyleObject)`。\n\n矢量切片对制图师来说是一份礼物，因为矢量切片提供了灵活性，可以设计出非常时尚且富有影响力的底图。你可以通过这个矢量切片样式编辑器来测试\
  \ ArcGIS 矢量切片底图的样式：[`https://github.com/Esri/arcgis-vectortile-style-editor`](https://github.com/Esri/arcgis-vectortile-style-editor)。\n\
  \n最近，ArcGIS API 4 for JavaScript 开始使用其自身的矢量切片实现。这种新的实现允许 API 渲染不同投影的矢量切片，并使其能够在\
  \ 3D 环境中使用；但是，当前的实现不支持 Mapbox 切片。\n\n矢量切片能提供极其清晰且美观的地图。重要的是要知道矢量切片使用了 WebGL⁸，这依赖于你的显卡和浏览器支持。如果你看到一些图形异常，或者注意到你的笔记本电脑冒烟，你可能需要考虑升级你的显卡驱动程序。\n\
  \n#### `GroupLayer`\n\n`GroupLayer`⁹ 是一个有趣的图层。它不从网络服务拉取数据；但是，它允许你将多个图层组合在一起。这些图层不必是同一类型；你可以将一个\
  \ `GraphicsLayer` 与一个 `TiledLayer` 组合在一起，一切都能正常工作。一个有用的场景是控制多个相似或相关的 `FeatureLayer`\
  \ 的可见性。让我们看看下面的示例：\n\n```\n1   import Map from \"esri/Map\";\n2   import MapView\
  \ from \"esri/views/MapView\";\n3   import FeatureLayer from \"esri/layers/FeatureLayer\"\
  ;\n4   import GroupLayer from \"esri/layers/GroupLayer\";\n\n6   const URL = \"\
  http://tmservices1.esri.com/arcgis/rest/services/LiveFeeds/NOAA_sto\\\n7   rm_reports/MapServer\"\
