  \n图 5-4\n\n局部场景演示\n\n在此示例中，我们大量利用了自动类型转换功能，但让我们重点看看其中使用的几个三维专用模块。本演示将向您介绍几个新符号：`PointSymbol3D`、¹⁴\
  \ `IconSymbol3DLayer`、¹⁵ 和 `ObjectSymbol3DLayer`。¹⁶\n\n`PointSymbol3D` 符号的功能如其名称所示：允许您在三维\
  \ `SceneView` 中显示点数据。单独使用时，它功能有限，但另外两个符号正是为此而设计的。\n\n`IconSymbol3DLayer` 符号允许您定义可在三维环境中使用并覆盖在地表上的符号。每个符号都包含可在应用程序中使用的原始类型。`IconSymbol3DLayer`\
  \ 的原始类型列表如下。¹⁷ 您也可以向 `href` 属性提供 URL，以链接到您自己的符号。\n\n`ObjectSymbol3DLayer` 符号在三维环境中更进一步，允许您定义球体、圆柱体、立方体等形状。`ObjectSymbol3DLayer`\
  \ 符号的原始类型已列出。¹⁸ 请注意，ArcGIS API for JavaScript 文档指出，如果您想使用自定义对象，需要通过教程在 ArcGIS Pro\
  \ 中创建并导出它们。¹⁹\n\n\n\n## 摘要\n\n本章介绍了在 ArcGIS API for JavaScript 中使用场景的基础知识。3D 可视化是\
  \ ArcGIS API 4 for JavaScript 中最新的、也是最令人兴奋的功能之一。它们为用户提供了以全新方式探索数据的机会，并且其用途在未来的版本中只会不断增加。现在，您应该熟悉以下内容：\n\
  \n*   创建 `SceneView` 并使用 `WebScene`\n*   在场景中操作相机\n*   为应用程序中的场景自定义环境\n*   创建用于聚焦可视化和查看地下要素的局部场景\n\
