  const $cardsList = document.querySelector(\".cards-list\");\nconst info = new OAuthInfo({\n\
  \  appId: \"zppZ53G093yZV7tG\",\n  popup: false\n});\n// 将 OAuthInfo 添加到 IdentityManager\n\
  esriId.registerOAuthInfos([info]);\n// 现在设置门户\nconst portal = new Portal({\n  //\
  \ https://developers.arcgis.com/javascript/latest/api-reference/esri-portal-Portal.html#authMode\n\
  \  authMode: \"immediate\"\n});\n// 如果用户尚未通过此应用程序登录，将触发登录\nportal.load().then(()\
  \ => {\n  const queryParams = new PortalQueryParams({\n    query: `owner:${portal.user.username}`,\n\
  \    sortField: \"numViews\",\n    sortOrder: \"desc\",\n    num: 20\n  });\n  return\
  \ portal.queryItems(queryParams);\n}).then(({ results }) => {\n  let docFrag = document.createDocumentFragment();\n\
  \  // 遍历每个项目，为其创建卡片\n  results.forEach(item => {\n    // esri/lang::substitute 将使用\
  \ PortalItem 创建一个新字符串。\n    const card = esriLang.substitute(item, template);\n\
  \    const elem = document.createElement(\"div\");\n    elem.className = \"portal-item\"\
  ;\n    elem.innerHTML = card;\n    docFrag.appendChild(elem);\n  });\n  // 将完成的列表附加到页面。\n\
  \  $cardsList.appendChild(docFrag);\n  docFrag = undefined;\n});\n```\n\n您在这里可以做到的是使用\
  \ `Portal` 模块来访问您的门户项目。然后，您可以简单地遍历这些门户项目，并添加带有描述和缩略图的精美小卡片，以及打开实际项目的链接。如果您想在应用程序中使用门户项目，这是一种快速访问它们的好方法。\n\
  \n## 总结\n\n在本章中，我介绍了地图和视图之间的关系，以及让视图管理地图中数据渲染管线的优势。我还介绍了 `LayerView` 如何让您访问视图中当前显示的要素，以及查询这些要素的优势。您了解了\
  \ API 支持的各种图层类型，以及它们提供的一些新功能和特性。我还介绍了 Portal API 的新功能，以及它为从门户加载图层和搜索各种门户项目所提供的简便性。这些是\
  \ API 中的核心概念，您可以在此基础上构建出色的应用程序！在下一章中，我将介绍 API 的核心基础——本质上是 API 设计的基本构建块——这将使您的技能更上一层楼。\n\
