  现在，我们可以为示例应用程序编写代码了。\n\n\n\n```javascript\nrequire([\n    'esri/Map',\n    'esri/views/SceneView',\n\
  \    'esri/core/watchUtils',\n    'esri/core/Scheduler',\n    'dojo/on'\n], function(Map,\
  \ SceneView, watchUtils, Scheduler, on) {\n    class CameraRecorder {\n        constructor(params)\
  \ {\n            this.view = params.view;\n            this.cameras = [null];\n\
  \            this.timer = null;\n            this.watcher = null;\n            this.handler\
  \ = null;\n            this.intervalID = null;\n            this.isPlaying = false;\n\
  \            this.slider = document.getElementById('slider');\n            this.reverseBtn\
  \ = document.getElementById('reverseBtn');\n            this.reverseBtn.addEventListener('click',\
  \ this.playReverse.bind(this));\n            this.playBtn = document.getElementById('playBtn');\n\
  \            this.playBtn.addEventListener('click', this.play.bind(this));\n   \
  \         this.stopBtn = document.getElementById('stopBtn');\n            this.stopBtn.addEventListener('click',\
  \ this.stop.bind(this));\n        }\n        clear() {\n            if (this.watcher)\
  \ {\n                this.watcher.remove();\n            }\n            if (this.handler)\
  \ {\n                this.handler.remove();\n            }\n            if (this.timer)\
  \ {\n                this.timer.remove();\n            }\n            this.recordStart();\n\
  \        }\n        recordStart() {\n            if (this.isPlaying || this.isPaused)\
  \ {\n                return;\n            }\n            this.timer = Scheduler.schedule(()\
  \ => {\n                this._cameraWatch();\n                this._sliderWatch();\n\
  \            });\n        }\n        play() {\n            if (this.isPlaying) {\n\
  \                return;\n            }\n            this.playBtn.classList.toggle('btn-info');\n\
  \            this.playBtn.classList.toggle('btn-success');\n            this._play(false);\n\
  \        }\n        stop() {\n            this.isPaused = !this.isPaused;\n    \
  \        this.stopBtn.classList.toggle('btn-info');\n            this.stopBtn.classList.toggle('btn-danger');\n\
  \            if (!this.isPaused) {\n                this.recordStart();\n      \
  \      }\n        }\n        playReverse() {\n            if (this.isPlaying) {\n\
  \                return;\n            }\n            this.reverseBtn.classList.toggle('btn-info');\n\
  \            this.reverseBtn.classList.toggle('btn-success');\n            this._play(true);\n\
  \        }\n        _cameraWatch() {\n            const view = this.view;\n    \
  \        const cameras = this.cameras;\n            const slider = this.slider;\n\
  \            this.watcher = view.watch('camera', (val) => {\n                cameras.push(val.clone());\n\
  \                slider.max = slider.value = cameras.length;\n                this.clear();\n\
  \            });\n        }\n        _sliderWatch() {\n            const view =\
  \ this.view;\n            const cameras = this.cameras;\n            this.handler\
  \ = on(this.slider, 'input', (e) => {\n                const val = Number(e.target.value);\n\
  \                view.goTo(cameras[val] || view.camera.clone());\n             \
  \   this.clear();\n            });\n        }\n        _play(inReverse) {\n    \
  \        this.isPlaying = true;\n            let intervalID = this.intervalID;\n\
  \            const slider = this.slider;\n            const view = this.view;\n\
  \            const cameras = this.cameras;\n            let len = cameras.length;\n\
  \            let i = 0;\n            intervalID = setInterval(() => {\n        \
  \        if (!inReverse) {\n                    slider.value = i;\n            \
  \        view.goTo(cameras[i++] || view.camera.clone());\n                    if\
  \ (i === len) {\n                        clearInterval(intervalID);\n          \
  \              this.playBtn.classList.toggle('btn-info');\n                    \
  \    this.playBtn.classList.toggle('btn-success');\n                        this.isPlaying\
  \ = false;\n                        this.recordStart();\n                    }\n\
  \                } else {\n                    slider.value = len;\n           \
  \         view.camera = cameras[len--] || view.camera.clone();\n               \
  \     if (len < 0) {\n                        clearInterval(intervalID);\n     \
  \                   this.reverseBtn.classList.toggle('btn-info');\n            \
  \            this.reverseBtn.classList.toggle('btn-success');\n                \
  \        this.isPlaying = false;\n                        this.recordStart();\n\
  \                    }\n                }\n            }, 100);\n        }\n   \
  \ }\n    const map = new Map({\n        basemap: 'streets'\n    });\n    const view\
  \ = new SceneView({\n        container: 'viewDiv',\n        map: map,\n        camera:\
  \ {\n            position: [-122.4194, 37.7749, 1000],\n            heading: 0,\n\
  \            tilt: 0\n        }\n    });\n    const camRecorder = new CameraRecorder({\n\
  \        view: view\n    });\n    view.watch('stationary', (val) => {\n        if\
  \ (val) {\n            camRecorder.recordStart();\n        }\n    });\n});\n```\n\
  \n`CameraRecorder` 类创建了一个 `CameraRecorder` 小部件。该类会监视 `SceneView` 的 `camera` 属性是否发生变化，一旦变化，就会克隆相机并将克隆的相机保存到一个数组中，以供后续使用。它提供了用于重放相机、反向重放或暂停监视器以停止保存相机变化的按钮。此外，它还提供了一个滑块，以便你可以回放到某个特定的\
  \ `Camera` 点。这个小应用程序展示了在 `SceneView` 中访问 `Camera` 的实用性，这样你不仅可以保存 `SceneView` 的快照，还可以根据需要操作\
  \ `Camera`。\n\n## environment 属性\n\n`environment` 属性有什么作用？注意到 3D 场景中建筑物和物体投射出的那些非常酷的阴影了吗？这些就是通过\
  \ `environment` 属性控制的。更具体地说，是通过环境的 `lighting` 属性来处理的。\n\n本质上，这允许你控制场景中太阳的位置。不仅如此，你还可以通过日期和一天中的时间来定义它。你知道吗，场景中星星的位置是与日期精确对应的？这是一个相当强大的细节。\n\
  \n`lighting` 的大部分属性都相当直观；`date` 和 `displayUTCOffset` 不言自明。`directShadowsEnabled`\
  \ 属性只是打开或关闭阴影。可能会让你感到困惑的是 `ambientOcclusionEnabled`。这基本上是指光线如何从表面反射。出于性能考虑，在低功耗设备（如手机）上，`ambientOcclusionEnabled`\
  \ 属性是禁用的（见图 5-3）。\n\n![A458961_1_En_5_Fig3_HTML.jpg](img/A458961_1_En_5_Fig3_HTML.jpg)\n\
  \n**图 5-3** 场景中更新后的环境设置\n\n\n\n## 局部场景\n\n局部场景是三维可视化中极为实用的工具。通过局部场景，您可以在三维环境中查看地下数据。创建局部场景需要完成两项设置：配置\
  \ `SceneView#viewingMode` 属性，并提供 `SceneView#clippingArea` 属性。\n\n```\n1   const\
  \ view = new SceneView({\n2     container: \"viewDiv\",\n3     map: map,\n4    \
  \ viewingMode: \"local\",\n5     clippingArea: myClippingArea\n6   });\n```\n\n\
  局部场景允许您将三维表面展平并裁剪至特定范围，从而查看地下元素。目前，该功能可用于查看钻井、地震数据、压裂数据，以及任何可映射至地下的数据。不过，目前尚无直接的方法来显示管道数据。\n\
  \n以下示例展示了如何创建局部场景以查看特定区域的钻井。您可以在此处查看在线演示：¹³\n\n```\n1   require([\n2     \"esri/Map\"\
  ,\n3     \"esri/views/SceneView\",\n4     \"esri/layers/FeatureLayer\",\n5     \"\
  esri/widgets/Home\"\n6   ], function(Map, SceneView, FeatureLayer, Home\n7   ) {\n\
  \n9     const wellsUrl = \"http://services.arcgis.com/jDGuO8tYggdCCnUJ/arcgis/rest/serv\\\
