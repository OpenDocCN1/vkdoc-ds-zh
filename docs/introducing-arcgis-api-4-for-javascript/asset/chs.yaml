  \ Portal API\n\n在使用 ArcGIS API 4 for JavaScript 时，`WebMap`、`WebScene` 乃至图层，其底层驱动大部分功能的\
  \ API 都是 Portal API。Portal API 由一系列模块组成，从 `Portal` 类本身到 `PortalItem`。你可以利用 Portal\
  \ API 为你的门户构建一个强大的数据浏览器，同时它也在整个 API 中以更微妙的方式被使用。\n\n```\n1   const webmap = new\
  \ WebMap({\n2     portalItem: {\n3       id: webmapid\n4     }\n5   });\n\n7   const\
  \ webscene = new WebScene({\n8     portalItem: {\n9       id: sceneid\n10     }\n\
  11   });\n```\n\n这些示例使用了自动转换（autocasting），相关内容将在第 4 章中介绍。\n\n`WebMap` 和 `WebScene`\
  \ 都在底层利用 Portal API 来构建各自的地图和场景。例如，一个 `WebMap` 可能包含来自门户的三个图层。每个图层通过其自身的门户项目 ID 进行引用。当你通过\
  \ ID 加载一个 `WebMap` 时，Portal API 会用于加载该 `WebMap`，然后递归加载每个由 ID 或可能只是 URL 引用的图层项目。其美妙之处在于，即使创建了地图甚至图层，这些资源也不会立即加载。这对你作为开发者意味着，你可以初始化一组\
  \ `WebMap` 或图层，而无需加载它们所有必需的资源，仅在需要时才加载这些数据。这对于开发目的来说效率极高。\n\n让我们看看加载门户项目的应用程序可能是什么样子（图\
  \ 3-2）。\n\n![A458961_1_En_3_Fig2_HTML.jpg](img/A458961_1_En_3_Fig2_HTML.jpg)\n\n\
