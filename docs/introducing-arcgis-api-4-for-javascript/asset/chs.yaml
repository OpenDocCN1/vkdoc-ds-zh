- "# 4. API 核心基础\n\n在 ArcGIS API 4 for JavaScript 中，有少数几个基本概念构成了 API 的构建方式。如果您熟悉这些核心概念，那么在使用\
  \ API 时将会受益匪浅。\n\n\n\n## 访问器\n\nArcGIS API for JavaScript 的一个重要新增功能是 `Accessor`¹\
  \ 模块。它位于 `esri/core/Accessor`，这足以说明它是该 API 的核心部分。这并非偶然，因为该 API 的大部分功能都构建在 `Accessor`\
  \ 及其能力之上。\n\n`Accessor` 模块大致基于通过 `Object.defineProperty`³ 方法实现的 ES5 getter/setter²。\n\
  \n### 监听属性变化\n\n`Accessor` 的有趣之处在于，你无需监听事件来了解对象何时发生了变化，而只需直接监听属性本身的变化即可。\n\n```\n\
  // 监听事件\nwidget.on(\"value-change\", (val) => {\n    console.log(val);\n});\n\n\
  // 新方法\nwidget.watch(\"value\", (val) => {\n    console.log(val);\n})\n```\n\n这也开启了监听任何值变化的能力，而不仅仅是那些分配了事件的变化。这与\
  \ `dojo/Stateful`⁴ 的工作方式类似，区别在于你无需使用 `get/set` 方法。\n\n```\n// dojo/stateful\nwidget.set(\"\
  value\", newValue);\n\n// Accessor\nwidget.value = newValue;\n```\n\n不过，你仍然可以使用\
  \ `set` 方法来设置 `Accessor` 的深层属性。\n\n```\n// 更新属性 \"view.map.basemap.title\"\nview.set(\"\
  map.basemap.title\", newTitle);\n```\n\n或者，你也可以一次性设置多个属性。\n\n```\n// 更新属性 \"view.map.basemap.title\"\
  \nview.set({\n  constraints: {\n    minScale: 250000,\n    maxScale: 0\n  },\n \
  \ rotation: 45\n});\n```\n\n你还可以监听嵌套属性的变化。\n\n```\n// 更新属性 \"view.map.basemap.title\"\
  \nview.watch(\"map.basemap.title\", (newValue) => /*处理结果*/);\n```\n\n每个方法都会返回一个\
  \ `WatchHandle`⁵，因此你可以通过 `remove` 方法停止监听属性变化。\n\n```\n// 更新属性 \"view.map.basemap.title\"\
  \nconst handler = view.watch(\"map.basemap.title\", (newValue) => /*处理结果*/);\n//\
  \ 在应用程序的某个时刻移除该处理器\nfunction cleanup() {\n  handler.remove();\n}\n```\n\n监听属性变化还有另一个很棒的特性，那就是能够同时监听多个属性的变化。\n\
  \n```\nimport Map from \"esri/Map\";\nimport MapView from \"esri/views/MapView\"\
  ;\n\nconst map = new Map({\n  basemap: \"streets\"\n});\n\nconst view = new MapView({\n\
  \  container: \"viewDiv\",\n  map: map,\n  zoom: 4,\n  center: [15, 65]\n});\n\n\
  view.watch(\"center, scale\", (value, oldValue, propertyName) => {\n  if (propertyName\
  \ === \"center\") {\n    // 打印 center 的 x 和 y 值\n    console.log(value.x, value.y);\n\
  \  } else {\n    // 打印 scale 值\n    console.log(value);\n  }\n});\n```\n\n在这个例子中，你同时监听了视图的\
  \ `center` 和 `scale` 属性。当这些属性发生变化时，你只需决定如何处理它们。在这个演示中，你只需将结果打印到开发者控制台。在你的应用程序中能够灵活地监听属性变化，这充分证明了\
  \ `Accessor` 为 API 带来的强大功能。\n\n由于监听属性变化的能力是 API 的核心功能，因此提供了一个实用模块来帮助你实现这一点。你可以在\
  \ `esri/core/watchUtils`⁶ 中找到这个实用工具。如果你发现在监听属性变化时需要进行一些条件检查，这个工具会非常有用。\n\n```\n\
  view.watch(\"stationary\", (value) => {\n  if (value) {\n    // 仅在值为 true 时执行某些操作\n\
  \  }\n});\n```\n\n这增加了一些认知负担，至少对我来说是这样，我想避免这种情况。我只关心值何时为 true，因此我可以使用一个实用工具来实现这一点。\n\
  \n```\nwatchUtils.whenTrue(view, \"stationary\", () => {\n  // 执行某些操作\n});\n```\n\
  \n让我们看一个示例，该示例会在你与地图交互时统计屏幕上的点数。\n\n以下是一些示例代码，展示了如何实现这一点：\n\n```\nimport Map from\
  \ \"esri/Map\";\nimport FeatureLayer from \"esri/layers/FeatureLayer\";\nimport\
  \ watchUtils from \"esri/core/watchUtils\";\nimport SceneView from \"esri/views/SceneView\"\
  ;\nimport QueryTask from \"esri/tasks/QueryTask\";\nimport Query from \"esri/tasks/supports/Query\"\
  ;\n\nconst url = \"http://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/US\\\
  \nA_Major_Cities/FeatureServer/0\";\nconst map = new Map({\n    basemap: \"streets\"\
  ,\n    layers: [ new FeatureLayer({ url }) ]\n}):\nconst query = new Query();\n\
  const queryTask = new QueryTask({ url });\nconst view = new SceneView({\n    container:\
  \ \"map\",\n    map: map,\n    center: [-118.182, 33.913],\n    scale: 836023\n\
  });\n\nquery.watch(\"geometry\", () =>{\n    qTask.executeForCount(query).then((count)\
  \ =>{\n        document.getElementById(\"cityCount\").innerText = count;\n    });\n\
  });\n\nview.then(() =>{\n    watchUtils.whenTrue(view, \"stationary\", () =>{\n\
  \        query.geometry = view.extent;\n    });\n    watchUtils.whenFalse(view,\
  \ \"stationary\", () =>{\n        document.getElementById(\"cityCount\").innerText\
  \ = \"...\";\n    });\n});\n```\n\n\n\n#### `watchUtils`\n\n正如我们所看到的，监听属性变化在 API\
  \ 中非常有用。由于在监听属性时，你的具体需求可能因应用程序而异，因此有一个名为`watchUtils`的辅助工具可供使用。⁷\n\n让我们来看几个更有趣的方法：\n\
  \n- `watchUtils.init()`：当你需要获取属性的初始值时，这个工具会派上用场。请记住，当你监听属性变化时，只有在属性实际发生变化时你才会收到通知。这意味着，除非你使用此工具来监听变化并同时获取初始值，否则你将无法知道许多属性的初始值。\n\
  \n    ```\n    1   watchUtils.init(view, \"stationary\", (value, oldValue) => console.log(`New/Initia\\\
  \n    2   l value is \"${value}\" and Old value is \"${oldValue}\"`));\n    ```\n\
  \n    这将为你提供属性的初始值（即默认值），以及像常规监听器一样的所有未来更新。如果你需要初始值来启动应用程序中的某个操作或在页面上显示一个值，但又不想等待值发生变化，这将非常有用。\n\
  \n- `watchUtils.once()`：顾名思义，当你只关心监听一次属性变化时，这个监听方法非常有用。它也是返回`PromiseWatchHandle`的监听辅助方法的一个子集。⁸\
  \ 这意味着你可以像对待任何 Promise 一样对待这个监听器，甚至可以在应用程序中链式调用此监听器的结果。\n\n    ```\n    1   watchUtils.once(view,\
  \ \"camera\").then(({ value, oldValue, propertyName, target })\\\n    2     => {\n\
  \    3      return geometryEngineAsync.union([oldValue.position, value.position]);\n\
  \    4   }).then(positionMultiPoints =>  {\n    5     // store or continue using\
  \ unioned points\n    6   });\n    ```\n\n    如你所见，某些监听辅助方法能够返回 Promise 是非常有用的。\n\
  \n- `watchUtils.pausable()`：我非常喜欢这个小工具。顾名思义，这是一个你可以暂停，然后根据需要恢复的监听器。\n\n    ```\n\
  \    1   const handler = watchUtils.pausable(view, \"center\", updateComponentMethod);\n\
  \    2   // resize component, no need to update during animated resize\n    3  \
  \ handler.pause();\n    4   // resize of component is done, resume updates\n   \
  \ 5   handler.resume();\n    ```\n\n    通过这个小示例，我可能有一个自定义组件，它会随着视图的`center`属性变化而更新。但是，我可能为调整此组件的大小或将其停靠到一个不完全可见的工具栏设置了动画。关键在于，我只想暂停此组件的更新，以便调用`handler.pause()`。然后，当组件处于我希望继续更新的状态时，我可以调用`handler.resume()`。我发现这个`pausable()`辅助方法是`watchUtils`辅助工具中最有用的一个。\n\
  \n我建议你查阅文档⁹，并在监听属性变化时遇到特殊情况时，记住这些辅助工具。\n\n### 自动转换（Autocasting）\n\n使用 Accessor 的另一个强大特性是，你可以定义能够自动转换为某个类或模块的属性。这允许你传入看起来像某种类型的数据，并将其转换为该类型。\n\
  \n```\n1   import Accessor from \"esri/core/Accessor\";\n2   import Extent from\
  \ \"esri/geometry/Extent\";\n\n4   const Model = Accessor.createSubclass({\n5  \
  \   properties: {\n6       extent: Extent\n7     }\n8   });\n\n10   export default\
  \ Model;\n```\n\n现在，你可以将一个类似`extent`的对象传递给这个 Accessor，它会被转换成一个真正的`Extent`对象。\n\n\
  ```\n1   const model = new Model({\n2     extent: {\n3       xmin: -122.68,\n4 \
  \      ymin: 45.53,\n5       xmax: -122.45,\n6       ymax: 45.6\n7     }\n8   });\n\
  \n10   model.watch(\"extent\", (val) => console.log(val));\n```\n\n如你所见，这使得构建模块和类变得非常容易，这些模块和类允许你传入简单的数据对象，这些对象可以自动转换为更复杂的对象。\n\
  \n自动转换在 API 中变得非常有用，以至于你甚至可能忘记它的存在。一个很好的例子是当你创建一个`WebMap`时。\n\n```\n1   const webmap\
  \ = new WebMap({\n2     portalItem: {\n3       id: \"e691172598f04ea8881cd2a4adaa45ba\"\
  \n4     }\n5   });\n\n7   const view = new MapView({\n8     map: webmap,  //the\
  \ WebMap instance created above\n9     container: \"viewDiv\"\n10   });\n```\n\n\
  `WebMap`在第 3 章中有详细介绍。但在这个例子中，你只是将一个`PortalItem`的`id`值传递给了`WebMap`的构造函数。在内部，`WebMap`知道`portalItem`属性的类型是`PortalItem`。因此，通过传入一个具有`PortalItem`所需最小属性的对象，`WebMap`可以将该对象自动转换为正确的实例。\n\
  \n如果你一直在使用 3.x 版本的 API，那么简单地监听属性变化而不是监听事件发生可能是一个新概念，但我希望你能看到在 4.x 版本的 API 中监听属性变化的简单性和灵活性，并从使用此功能中获得一些真正的好处。\n\
  \n### 扩展 Accessor\n\n从 ArcGIS API for JavaScript 的 4.2 版本开始，Accessor 文档现在包含了“实现\
  \ Accessor”部分。¹⁰ 该部分内容相当详尽，因此我们不重复其内容，而是来看几个基础点。\n\n你已经看到了如何使用`Accessor.createSubclass()`自己实现一个\
  \ Accessor。关键在于提供一个`properties`对象，该对象将包含有关你实现的信息。你已经看到了如何预定义属性的类型。\n\n```\n1   const\
  \ Model = Accessor.createSubclass({\n2     properties: {\n3       extent: Extent\n\
  4     }\n5   });\n```\n\n但你还可以更进一步，拥有一些计算属性。\n\n```\n1   const Model = Accessor.createSubclass({\n\
  2     properties: {\n3       graphic: new Graphic(/* Graphic Properties */),\n4\
  \       bufferedGeometry: {\n5         dependsOn: [\"graphic\"],\n6         get:\
  \ function() {\n7           return geometryEngine.buffer(this.graphic.geometry);\n\
  8         }\n9       }\n10     }\n11   });\n```\n\n在这个示例中，你想要一个基于`graphic`值的`bufferedGeometry`属性。在这种情况下，我不希望我的`Model`的用户在他们那边使用`GeometryEngine`，所以我可以简化它并为他们提供这个值。\n\
  \n#### TypeScript 集成\n\nAPI 的 4.2 版本还引入了改进的 TypeScript 集成，用于使用 Accessors。这种改进的集成还附带了一组装饰器¹¹，简化了实现过程。\n\
  \n这意味着你可以将之前的示例更新为如下所示：\n\n```\n1   /// \n3   /// \n\n5   import { declared, subclass,\
  \ property } from \"esri/core/accessorSupport/decorators\";\n\n7   @subclass()\n\
  8   class Model extends declared(Accessor) {\n\n10     @property()\n11     graphic:\
  \ Graphic = new Graphic();\n\n13     @property({\n14       dependsOn: [\"graphic]\n\
  15     })\n16     get bufferedGeometry(): Geometry {\n17       return geometryEngine.buffer(this.graphic.geometry);\n\
  18     }\n\n20   }\n```\n\n这些装饰器非常有用，可以使实现 Accessor¹² 和定义属性更加明确。你可以查阅装饰器文档以获取更多详细信息。¹³\n\
  \n\n\n## 集合\n\nArcGIS API 4 for JavaScript 中的集合是类似数组的数据容器。它们的外观和行为都像数组，但不能使用 `for`\
  \ 循环进行迭代。相反，您可以使用众多数组方法之一来处理集合。这些方法大多是典型的数组方法，其工作方式符合预期。有些方法是集合独有的，例如 `getItemAt()`。\n\
  \n在不直接复制文档的前提下，我想指出一些集合独有的方法。\n\n*   `ofType`：允许您创建类型化集合\n*   `add`：工作方式类似于 `Array.prototype.push`\n\
  *   `addMany`：接受一个对象数组并将其添加到集合中\n*   `clone`：顾名思义，创建集合的克隆\n*   `remove`：从集合中移除传入的参数\n\
  *   `removeAll`：清空集合\n*   `removeAt`：轻松地从集合中移除指定索引处的项\n*   `removeMany`：移除给定数组中的所有项\n\
  *   `reorder`：将集合中的某项移动到新的索引位置\n*   `toArray`：将集合导出为普通的原生数组\n\n集合的另一个特性是能够监听 `change`\
  \ 事件。\n\n```\ncollection.on(\"change\", ({ added, moved, removed }) => {/*执行一些酷炫的操作*/});\n\
  ```\n\n`change` 事件返回一个包含 `added`、`moved` 和 `removed` 属性的对象。每个属性都是一个数组，其中包含集合中发生变化的项。这是一个极其有用的特性，是原生\
  \ JavaScript 数组所不具备的。您可以监视对集合所做的任何更改并做出相应处理。\n\n## 承诺（Promises）\n\n视图和图层的一个共同点是它们都是承诺。\n\
  \n承诺对于执行异步操作非常有用。您会在整个 API 中发现承诺的身影。这是因为有大量的异步操作在进行。\n\n当您创建一个视图时，可以检查承诺方法 `then`\
  \ 来查看视图何时加载完成，并开始检查属性。\n\n```\nview.then(() => {\n  view.watch(\"extent.xmin\",\
  \ (xmin) => console.log(xmin));\n});\n```\n\n在视图加载并准备就绪后开始监听 Accessor 属性的变化也是一个好习惯。承诺非常有用，您可以对它们的结果进行链式调用。\n\
  \n```\nview.then(() => {\n  return view.whenLayerView(myLayer);\n})\n.then((layerView)\
  \ => {\n  return watchUtils.whenFalseOnce(layerView, \"updating\");\n})\n.then(({\
  \ target: layerView }) => {\n  return layerView.queryFeatures()\n})\n.then((features\
  \ => {\n  view.goTo(features);\n}))\n.otherwise(error => {\n  // 在此处捕获 Promise 链中的错误\n\
  });\n```\n\n在这段代码片段中，您等待视图加载，从视图中获取一个 `LayerView`，查询视图中的要素，然后使用 `goTo` 方法将地图动画定位到这些要素。\n\
  \n在这个示例中，您使用了 `watchUtils` 模块来帮助检查属性变化，但您只关心 `LayerView` 何时完成更新，以便获取要素。我将在下一章关于\
  \ Accessor 的内容中更详细地介绍这个方法。\n\n在整个 API 中使用承诺的能力对于处理 Web 地图应用中发生的多个异步操作非常有用。\n\n##\
  \ 总结\n\n至此，您应该对 ArcGIS API for JavaScript 的核心基础原理有了相当清晰的认识。扎实掌握 Accessor、集合和承诺的工作原理将极大地提升您使用该\
  \ API 构建应用程序的能力。\n\n*   Accessor 提供了一种轻松监听属性变化的方法，而无需监听事件。\n*   如果您想知道集合是否已更新，集合对于存储通常可能放在数组中的数据非常有用。\n\
  *   承诺允许您处理异步数据，并且在视图的情况下，让您知道它们何时可以使用。\n\n脚注\n\n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Accessor.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Accessor.html)\n\
