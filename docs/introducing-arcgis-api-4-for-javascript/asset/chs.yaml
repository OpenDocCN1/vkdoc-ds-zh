- "# 6. 弹出窗口\n\n自 ArcGIS API for JavaScript 1.0 版本以来，用户点击地图时的首次交互通常都是获取弹出窗口。`Popup`\
  \ ¹ 微件通常是访问地图上可视化效果背后原始数据的第一个入口点。地图上定义良好的数据可视化可能会根据色带颜色或显示点的大小，告诉您一个城市与相邻城市的人口密度对比。但您首次查看这些原始数据时，很可能需要点击该要素并在弹出窗口中查看数据。\n\
  \n由于弹出窗口对于探索地图中的数据至关重要，因此有多种选项可用于配置数据的显示方式。\n\n\n\n## 字段与别名\n\n你可以通过为图层定义 `popupTemplate`\
  \ 来快速开始配置弹出窗口，示例如下：\n\n```\n1   const featureLayer = new FeatureLayer({\n2     url:\
  \ \"https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\\\n\
  3   rver/3\",\n4     outFields: [\"*\"],\n5     popupTemplate: {\n6       title:\
  \ \"名称: {STATE_NAME}\",\n7       content: \"{*}\"\n8     }\n9   });\n```\n\n如果该要素的\
  \ `NAME` 字段值为 `Foghorn Leghorn`，则会创建一个标题为“名称: Foghorn Leghorn”的弹出窗口。通过将 `content`\
  \ 定义为 `\"{*}\"`，弹出窗口将显示一个简单的表格，列出所有字段名称及其值。\n\n这几乎是最简单的 `Popup` 组件定义方式了。但你还可以更进一步。\n\
  \n为图层和地图配置弹出窗口最简单的方法，可能是在 ArcGIS Online 地图查看器中配置 `Popup` ²。如果你通过 `WebMap` 或 `PortalItem`\
  \ 加载地图（如前面章节所述），你在弹出窗口中进行的配置将反映在应用程序中。\n\n如果需要，你可以配置 `Popup` 显示别名而非实际字段名称。你可以在 `popupTemplate`\
  \ 的 `content` 属性中进行配置。\n\n```\n1   const featureLayer = new FeatureLayer({\n2  \
  \   url: \"https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\\\
  \n3   rver/3\",\n4     outFields: [\"*\"],\n5     popupTemplate: {\n6       title:\
  \ \"名称: {STATE_NAME}\",\n7       content: [\n8         {\n9           type: \"fields\"\
  ,\n10           fieldInfos: [\n11             {\n12               fieldName: \"\
  POP2000\",\n13               visible: true,\n14               label: \"2000 年人口\"\
  ,\n15               format: {\n16                 places: 0,\n17               \
  \  digitSeparator: true\n18               }\n19             },\n20             {\n\
  21               fieldName: \"POP2007\",\n22               visible: true,\n23  \
  \             label: \"2007 年人口\",\n24               format: {\n25             \
  \    places: 0,\n26                 digitSeparator: true\n27               }\n28\
  \             }\n29           ]\n30         }\n31       ]\n32     }\n33   });\n\
  ```\n\n上述示例将显示两个字段：`POP2000` 和 `POP2007`。不过，你可以为每个字段提供与实际字段名称不同的 `label` 属性。由于处理的是包含数值的字段，你还可以定义这些数值的显示方式。在此例中，你希望不显示小数位，并且不使用数字分隔符（这取决于区域设置）。\n\
  \n如果你的数据包含日期字段，你还可以定义日期格式。\n\n```\n1   {\n2     fieldName: \"FAKEDATE\",\n3    \
  \ visible: true,\n4     label: \"假日期字段\",\n5     format: {\n6       dateFormat:\
  \ \"short-date\"\n7     }\n8   }\n```\n\n这很简单，对吧？\n\n如果你想要真正自定义输出，甚至可以在内容中使用纯 HTML。\n\
  \n```\n1   const featureLayer = new FeatureLayer({\n2     url: \"https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\\\
  \n3   rver/2\",\n4     outFields: [\"*\"],\n5     popupTemplate: {\n6       title:\
  \ \"名称: {STATE_NAME}\",\n7       content: `\n\n9           {STATE_ABBR}\n\n12  \
  \           2000 年人口: {POP2000}\n13             2007 年人口: {POP2007}\n14        \
  \     总户数: {HOUSEHOLDS}\n\n17       `\n18     }\n19   });\n```\n\n你甚至可以使用函数对内容进行进一步处理。假设你的应用程序中有一个已知的几何图形，比如某个围栏区域。当用户点击某个要素时，你想通知他们该位置是否在此围栏区域内。\n\
  \n```\n1   const featureLayer = new FeatureLayer({\n2     url: URL,\n3     outFields:\
  \ [\"*\"],\n4     popupTemplate: {\n5       title: \"名称: {name}\",\n6       content({\
  \ graphic }) {\n7         const isWithin = geometryEngine.contains(fencedGeometry,\
  \ graphic.geometry);\n8         return `\n9           该位置当前${isWithin ? \"位于\" :\
  \ \"不位于\"}围栏区域内。\n10         `;\n11       }\n12     }\n13   });\n```\n\n这只是自定义弹出窗口内容的另一种方式。\n\
  \n你还可以更进一步，基于视图的点击事件查询多个图层。\n\n```\n1   view.on(\"click\", ({ mapPoint }) => {\n\
  2     const screenPoint = view.toScreen(mapPoint);\n3     view.hitTest(screenPoint).then(({\
  \ results }) => {\n4       if (results[0].graphic) {\n5         view.popup.open({\n\
  6           location: mapPoint,\n7           promises: [() => {\n8             query.geometry\
  \ = results[0].graphic.geometry;\n9             return qTask.execute(query).then(({\
  \ features }) => {\n10               var names = features.map((feature) => {\n11\
  \                 return feature.attributes.state_name;\n12               }).join(\"\
  , \");\n13               return \"{route} 穿越以下州: \" + names;\n14             });\n\
  15           }]\n16         });\n17       }\n18     });\n19   });\n```\n\n这个特定示例将查询一个服务，以查看图形是否与该服务的要素相交。当添加到弹出窗口参数中\
  \ `promises` 属性的查询完成时，弹出窗口将打开并显示你的自定义结果。\n\n你甚至可以在弹出窗口中使用 Arcade³ 表达式。\n\n```\n\
  1   const featureLayer = new FeatureLayer({\n2     url: \"https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\\\
  \n3   rver/2\",\n4     outFields: [\"*\"],\n5     popupTemplate: {\n6       title:\
  \ \"名称: {STATE_NAME}\",\n7       expressionInfos: [\n8         {\n9           name:\
  \ \"percent-change\",\n10           title: \"2000 年至 2007 年变化百分比\",\n11        \
  \   expression: \"Abs((($feature.POP2000 - $feature.POP2007) / $feature.POP20\\\n\
  12   00) * 100) + '%'\"\n13         }\n14       ],\n15       content: \"2000 年至\
  \ 2007 年的变化百分比为 {expression/percent-change}\"\n16     }\n17   });\n```\n\n如你所见，自定义弹出窗口显示数据的方式并不困难。\n\
  \n## MediaInfos\n\n弹出窗口的内容还可以包含基于要素数据的图表。你可以采用与配置 `PopupTemplate` 的 `fieldInfos`\
  \ 类似的方式来定义。\n\n```\n1   {\n2     type: \"media\",\n3     mediaInfos: [\n4      \
  \ {\n5         title: \"人口\",\n6         type: \"column-chart\",\n7         caption:\
  \ \"\",\n8         value: {\n9           theme: \"BlueDusk\",\n10           fields:\
  \ [ \"POP2000\", \"POP2007\" ]\n11         }\n12       }\n13     ]\n14   }\n```\n\
  \n这将为字段 `POP2000` 和 `POP2007` 中提供的人口数据显示一个柱状图。其他可选的媒体类型包括 `image`（图片）、`pie-chart`（饼图）、`bar-chart`（条形图）或\
  \ `line-chart`（折线图）。如果类型是 `image`，则需要提供 `sourceURL` 属性，而不是 `fields` 属性。可用的主题基于 Dojox\
  \ 图表库主题。⁴ 你可以在文档中阅读更多关于 `mediaInfos` 选项的信息。⁵\n\n\n\n## 自定义操作\n\nArcGIS API 4 for\
  \ JavaScript 最有趣的补充功能之一就是添加自定义操作。自定义操作允许您在弹出窗口中添加可用于各种任务的小按钮。您可以使用它来打开新的网页、执行查询或执行其他任务。\n\
  \n在本示例中，您将根据城市名称搜索该城市中与啤酒相关的活动。\n\n```\n1   require([\n2     \"esri/views/MapView\"\
  ,\n3     \"esri/Map\",\n4     \"esri/layers/Layer\"\n5   ], function(\n6       \
  \    MapView, Map, Layer\n7           ) {\n\n9     const map = new Map({\n10   \
  \    basemap: \"streets-navigation-vector\"\n11     });\n\n13     const view = new\
  \ MapView({\n14       map: map,\n15       container: \"viewDiv\",\n16       center:\
  \ [-117.24, 34.05],\n17       zoom: 8\n18     });\n\n20     view.popup.on(\"trigger-action\"\
  , ({ action }) => {\n21       if (action.id === \"alcohol-details\") {\n22     \
  \    var attributes = view.popup.viewModel.selectedFeature.attributes;\n23     \
  \    var name = attributes.NAME;\n24         window.open(`https://www.google.com/search?q=${name}\
  \ Beer events`);\n25       }\n26     });\n\n28     Layer.fromPortalItem({\n29  \
  \     portalItem: {\n30         id: \"c531f67a12254c27af9479d436e23850\"\n31   \
  \    }\n32     })\n33     .then((layer) => {\n34       layer.popupTemplate = {\n\
  35         title: '{Name}',\n36         content: '{*}',\n37         actions: [{\n\
  38             id: 'alcohol-details',\n39             className: 'esri-icon-description',\n\
  40             title: 'Events'\n41         }]\n42       };\n43       map.add(layer);\n\
  44     })\n45     .otherwise(err => console.log(err));\n46   });\n```\n\n您可以在 [`http://jsbin.com/namufut/2/edit?js,output`](http://jsbin.com/namufut/2/edit?js,output)\
  \ 找到此应用程序的演示。\n\n需要记住的主要一点是，当您定义 `PopupTemplate` 时，您需要定义一个 `actions` 属性，该属性包含一个包含您可能想要使用的各种自定义操作的数组。\n\
  \n```\n1   {\n2     title: '{Name}',\n3     content: '{*}',\n4     actions: [{\n\
  5         id: 'alcohol-details',\n6         className: 'esri-icon-description',\n\
  7         title: 'Events'\n8     }]\n9   }\n```\n\n`className` 属性用于定义自定义图标。这可以是您在\
  \ CSS 代码中定义的图标，也可以是 API 提供的图标之一。您还可以提供一个 `image` 属性，该属性是您要使用的图像的 URL。如果您没有定义 `className`\
  \ 或 `image`，则会提供一个默认图标。您可以在文档中阅读有关自定义操作的更多信息。\n\n如果您想向第三方 Web 服务（例如用于提供客户详细信息的自定义\
  \ API）发出请求，自定义操作也会派上用场。\n\n```\n1   view.popup.on(\"trigger-action\", ({ action\
  \ }) => {\n2     if (action.id === \"customer-details\") {\n3       var attributes\
  \ = view.popup.viewModel.selectedFeature.attributes;\n4       var customerGroup\
  \ = attributes.CUSTOMER_GROUP;\n5       esriRequest(customAPIURL, {\n6         query:\
  \ {\n7           group: customerGroup\n8         },\n9         responseType: \"\
  json\"\n10       })\n11       .then({ data } => {\n12         // 解析数据并更新弹出窗口内容\n\
  13       })\n14       .otherwise(error => console.log(error));\n15     }\n16   });\n\
  ```\n\n## 总结\n\n在本章中，您学习了如何定义 `PopupTemplate`。您还学习了如何设置可在 `PopupTemplate` 中使用的字段和字段别名，从而更精细地控制数据的显示方式。`PopupTemplate`\
  \ 甚至可以包含自定义 HTML 或媒体元素（如图表），以提供对数据的更深入理解。您还了解了如何在 `PopupTemplate` 中使用自定义操作来执行一些自定义任务，例如搜索\
  \ Web 或访问第三方 Web 服务，从而为您的数据增加更多价值。\n\n`Popup` 通常是用户了解地图上数据详细信息的第一个入口点。它被广泛使用并且功能强大。任何使用\
  \ ArcGIS API for JavaScript 进行开发的人都应该学习如何充分利用它的功能。\n\n在下一章中，您将了解如何使用 ArcGIS API\
  \ for JavaScript 中的新微件框架来创建自定义微件！\n\n脚注\n\n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-widgets-Popup.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-widgets-Popup.html)\n\
  \n[`https://doc.arcgis.com/en/arcgis-online/create-maps/configure-pop-ups.htm`](https://doc.arcgis.com/en/arcgis-online/create-maps/configure-pop-ups.htm)\n\
  \n[`https://developers.arcgis.com/arcade/`](https://developers.arcgis.com/arcade/)\n\
  \n[`https://download.dojotoolkit.org/release-1.10.0/dojo-release-1.10.0/dojox/charting/tests/theme_preview.html`](https://download.dojotoolkit.org/release-1.10.0/dojo-release-1.10.0/dojox/charting/tests/theme_preview.html)\n\
  \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#media`](https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#media)\n\
  \n[`https://developers.arcgis.com/javascript/latest/guide/esri-icon-font/index.html`](https://developers.arcgis.com/javascript/latest/guide/esri-icon-font/index.html)\n\
  \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#actions`](https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#actions)\n\
  \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html)\n\
  \n## 微件\n\nArcGIS API for JavaScript 的版本 4 引入了自己的微件框架来构建自定义微件。自定义微件开发由名为 MaquetteJS\
  \ 的虚拟 DOM 库提供支持。这取代了以前用于构建微件的旧版 Dojo Dijit 框架。尽管 Dijit 是一个完全稳定且久经考验的微件框架，但虚拟 DOM\
  \ 库允许您使用 DOM 的抽象版本，从而可以高效地发现更改并更新 DOM。\n\n### 先决条件\n\n然而，自定义微件开发有一个您应该注意的先决条件：TypeScript。用于自定义微件开发的许多工具（例如前面章节中讨论的\
  \ Accessor 装饰器）都需要使用 TypeScript。\n\n我强烈建议您学习 TypeScript 教程。我还强烈推荐 Egghead.io 上的以下课程：\n\
  \n- 快速上手 TypeScript\n- 在 TypeScript 中有效使用类型\n\n\n\n#### 类型定义\n\n你可以在 GitHub 上阅读更多关于安装\
  \ ArcGIS API 或 JavaScript 类型定义的信息。¹⁰ 关键在于，你可以通过 `npm install --save @types/arcgis-js-api`\
  \ 轻松安装类型定义。\n\n需要注意的是，这并不会安装 Dojo 的类型定义。如果你想在 TypeScript 开发中使用一些 Dojo 模块，你可以获取 `dojo-typings`¹¹\
  \ 并在 `tsconfig.json` 文件中进行如下配置：\n\n```\n1     \"types\": [ \"arcgis-js-api\" ],\n\
  2     \"include\": [\n3       \"./src/app/**/*\"\n4     ],\n5     \"exclude\": [\n\
  6       \"node_modules\"\n7     ],\n8     \"files\": [\n9       \"node_modules/dojo-typings/dojo/1.11/modules.d.ts\"\
  ,\n10       \"node_modules/dojo-typings/dijit/1.11/modules.d.ts\",\n11       \"\
  node_modules/dojo-typings/dojox/1.11/modules.d.ts\",\n12       \"node_modules/dojo-typings/custom/dgrid/1.1/dgrid.d.ts\"\
  ,\n13       \"node_modules/dojo-typings/custom/dstore/1.1/dstore.d.ts\",\n14   \
  \    \"node_modules/intern/typings/intern/intern.d.ts\"\n15     ]\n```\n\n你可以阅读更多关于\
  \ `tsconfig.json` 文件的信息。¹² `tsconfig.json` 文件用于配置 TypeScript 编译器。\n\n#### JSX\n\n\
  这个更新的微件框架还引入了 JSX¹³ 的使用，该语法由 React¹⁴ 推广开来。JSX 在 JavaScript 中看起来非常像 HTML，只是其语法需要一个编译步骤来将\
  \ JSX 转换为 JavaScript 函数。\n\n例如，JSX `<h1>hello!</h1>` 会被编译成一个看起来像 `h('h1', 'hello!')`\
  \ 的函数。这种创建 DOM 元素的方法被称为 HyperScript。¹⁵ 在使用 ArcGIS API for JavaScript 进行自定义微件开发时，如果你使用了\
  \ JSX，则无需关心 HyperScript。\n\n### 构建自定义微件\n\n在深入构建自定义微件之前，你可以在 GitHub 上找到演示应用程序的源代码（见图\
  \ 7-1）。¹⁶\n\n![A458961_1_En_7_Fig1_HTML.jpg](img/A458961_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n\n自定义微件开发\n\n在此示例中，你将构建的微件将显示一个图表，该图表代表地图视图中可见的数据。关键在于确保图表仅基于可见数据，以便在平移地图时图表能够随之更新。\n\
  \n#### 存储与 ViewModel\n\n第一步是构建一个应用程序存储。这个应用程序存储将包含用于描述应用程序状态的属性。在此应用程序中，你需要关注 `View`\
  \ 和 `WebMap`。你可以参考前面的章节，了解如何为此类任务使用 `Accessor` 模块。¹⁷\n\n对于每个继承自 `Accessor` 的 TypeScript\
  \ 文件，你需要添加以下 `amd-dependency` 行：\n\n```\n1   /// \n3   /// \n```\n\n在后续示例中我将省略它们，但请注意它们是必需的。\n\
  \n```\n1   // app/stores/app.ts\n2   import EsriMap = require(\"esri/Map\");\n3\
  \   import MapView = require(\"esri/views/MapView\");\n4   import Accessor = require(\"\
  esri/core/Accessor\");\n\n6   import {\n7     subclass,\n8     declared,\n9    \
  \ property\n10     } from \"esri/core/accessorSupport/decorators\";\n\n12   type\
  \ UIParams = {\n13     element: any,\n14     position?: string\n15   };\n\n17  \
  \ interface Store {\n18     webmap: EsriMap;\n19     view: MapView;\n\n21     addToUI(params:\
  \ UIParams): void;\n22   }\n\n24   @subclass(\"app.stores.AppStore\")\n25   class\
  \ AppStore extends declared(Accessor) implements Store {\n\n27     @property()\n\
  28     webmap: EsriMap;\n\n30     @property()\n31     view: MapView;\n\n33     addToUI({\
  \ element, position }: UIParams) {\n34       this.view.ui.add(element, position);\n\
  35     }\n\n37   }\n\n39   export default new AppStore();\n```\n\n你在存储中有两个可观察的属性：`webmap`\
  \ 和 `view`。你还添加了一个方法 `addToUI()`，它充当代理，为你将组件添加到 UI 中。另外，请注意你导出模块的方式：`export default\
  \ new AppStore();`。这将创建你的存储的单例，这样每次模块导入它时就不会创建新的存储。\n\n接下来你要做的是为你的自定义微件构建一个 `ViewModel`。`ViewModel`\
  \ 的行为与应用程序存储非常相似。`ViewModel` 的职责是监视应用程序存储的变化，并根据这些变化更新自身状态。`ViewModel` 的另一个职责是管理微件的业务逻辑，即根据应用程序存储对数据执行任何查询或操作。\n\
  \n```\n1   // app/widgets/viewmodels/summaryviewmodel.ts\n\n3   import Accessor\
  \ = require(\"esri/core/Accessor\");\n4   import watchUtils = require(\"esri/core/watchUtils\"\
  );\n\n6   import FeatureLayerView = require(\"esri/views/layers/FeatureLayerView\"\
  );\n7   import Graphic = require(\"esri/Graphic\");\n\n9   import Query = require(\"\
  esri/tasks/support/Query\");\n\n11   import {\n12     subclass,\n13     declared,\n\
  14     property\n15     } from \"esri/core/accessorSupport/decorators\";\n\n17 \
  \  import store from \"../../stores/app\";\n\n19   const { init, whenOnce, whenFalse\
  \ } = watchUtils;\n\n21   export type Stats = {\n22     \"Carcinogen\": number,\n\
  23     \"PBT\": number,\n24     \"Non-PBT\": number,\n25     \"Metal\": number\n\
  26   };\n\n28   const stats: Stats = {\n29     \"Carcinogen\": 0, // CARCINOGEN\
  \ == \"Yes\"\n30     \"PBT\": 0,        // CLASS == \"PBT\"\n31     \"Non-PBT\"\
  : 0,    // CLASS == \"Non-PBT\"\n32     \"Metal\": 0       // METAL == \"Yes\"\n\
  33   };\n\n35   function errorHandler (error: Error) {\n36     console.log(\"LayerView\
  \ Query Error\", error);\n37   }\n\n39   @subclass(\"app.widgets.viewmodels.summaryviewmodel\"\
  )\n40   class SummaryViewModel extends declared(Accessor) {\n\n42     @property()\n\
  43     count: number = 0;\n\n45     @property()\n46     stats: Stats = stats;\n\n\
  48     constructor() {\n49       super();\n50       whenOnce(store, \"view\").then(_\
  \ => {\n51         return store.webmap.findLayerById(\"tri\");\n52       })\n53\
