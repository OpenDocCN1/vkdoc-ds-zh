- "# 5. 场景\n\n迄今为止，ArcGIS API 4 for JavaScript 最令人兴奋的功能之一便是引入了 3D 场景。3D 场景是一种可视化数据的非凡新方式（见图\
  \ 5-1）。\n\n![A458961_1_En_5_Fig1_HTML.jpg](img/A458961_1_En_5_Fig1_HTML.jpg)\n\n\
  图 5-1\n\n使用 Pictometry 影像的示例场景\n\n您可以使用场景查看器¹（Scene Viewer）创建和发布场景，该查看器是 ArcGIS\
  \ Online 平台²的一部分。当您在场景查看器中创作场景时，它们会保存到您的帐户中，您可以与他人共享。然后，您可以使用场景的项目 ID，将这些场景与您的 ArcGIS\
  \ API 4 for JavaScript 应用程序结合使用。\n\n场景本身是在 ArcGIS Pro³中创建和发布的。您可以在场景查看器中更新场景，并修改或创建新的幻灯片⁴。您在场景查看器中更新和修改的场景，随后便可在您的\
  \ ArcGIS API 4 for JavaScript 应用程序中查看。\n\n加载 `WebScene` ⁵ 非常简单；就像加载 `WebMap` 一样。\n\
  \n```\n1   import WebScene from \"esri/WebScene\";\n2   import SceneView from \"\
  esri/views/SceneView\";\n\n4   const scene = new WebScene({\n5     portalItem: {\n\
  6       id: \"082c4fd545104f159db39da11ea1e675\"\n7     }\n8   });\n\n10   const\
  \ view = new SceneView({\n11     map: scene,\n12     container: \"viewDiv\"\n13\
  \   });\n```\n\n这就是使用 ArcGIS JavaScript API 显示场景所需的全部操作。\n\n场景与常规地图有何不同？简单来说：3D。\n\
  \n场景包含高程数据，这意味着您可以处理地形和建筑物。当您在地图上放置要素时，可以像在床上铺床单一样将它们覆盖。您也可以像广告牌一样将符号立牌显示（见图 5-2）。\n\
  \n![A458961_1_En_5_Fig2_HTML.jpg](img/A458961_1_En_5_Fig2_HTML.jpg)\n\n图 5-2\n\n\
  场景中的示例 3D 符号\n\n## SceneView\n\n`SceneView` 与 `MapView` 共享相似的 API，因为它们都基于 `View`\
  \ ⁶ 模块。正如您已经了解到的，视图负责渲染 `Map`、`WebMap` 或 `WebScene` 中的数据。\n\n要理解 `SceneView`，您需要了解几个可以使用的独特属性。\n\
  \n*   `camera` ⁷\n*   `environment` ⁸\n\n\n\n### `camera` 属性\n\n你可以将相机想象为一台真实的摄像机，它位于特定位置，指向特定方向，并以特定视角和倾斜角度进行拍摄。这些恰好也是相机所具备的属性。在应用程序运行期间，你可以随时更新相机。如果你确实想要更新相机，建议使用视图的\
  \ `goTo` 方法，让视图平滑过渡到新的相机设置。如果直接使用 `view.camera = updatedCamera`，则无法实现平滑过渡。\n\n```\n\
  const view = new SceneView({\n  map,\n  container: \"viewDiv\",\n  camera: {\n \
  \   position: [7.654, 45.919, 5183],\n    tilt: 80\n  }\n});\n// 在应用程序的某个时刻，你可以更新相机。\n\
  view.goTo({\n  position: [7.654, 45.919, 7500],\n  tilt: 65\n});\n```\n\n你可以在 [`https://jsbin.com/sodeda/3`](https://jsbin.com/sodeda/3)\
  \ 的演示中查看更新相机的示例。\n\n还需要注意的是，视图不会反映对相机所做的任何直接更新。\n\n```\nview.camera.position = updatedPosition;\
  \ // 无效\n```\n\n不过，你可以克隆相机以保留当前相机设置，并仅更新单个属性。\n\n```\nconst camera = view.camera.clone();\n\
  camera.tilt = 120;\nview.camera = camera;\n// 或者\nview.goTo(camera);\n```\n\n现在，我将向你展示一个有趣的示例，演示如何在每次场景变化时克隆相机，并回放这些相机设置，从而为你的视图创建平滑的动画效果。\n\
  \n让我们看看这个示例的代码：\n\n```\n6  4.x 3D Camera Recorder\n```\n\n我们需要为这个小应用程序定义一些样式。\n\n\
