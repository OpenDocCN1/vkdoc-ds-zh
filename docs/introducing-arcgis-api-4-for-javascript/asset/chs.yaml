  \ Graphic[]) {\n  const _stats = (Object).assign({}, stats);\n  results.forEach(({\
  \ attributes: attr }) => {\n    if (attr.CARCINOGEN === \"Yes\") {\n      _stats[\"\
  Carcinogen\"]++;\n    }\n    if (attr.CLASS === \"PBT\") {\n      _stats[\"PBT\"\
  ]++;\n    }\n    else if (attr.CLASS === \"Non-PBT\") {\n      _stats[\"Non-PBT\"\
  ]++;\n    }\n    if (attr.METAL === \"Yes\") {\n      _stats[\"Metal\"]++;\n   \
