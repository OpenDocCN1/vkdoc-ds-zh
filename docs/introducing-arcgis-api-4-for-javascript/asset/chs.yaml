  \      })).then(this.parseResults.bind(this)\n    );\n}\n```\n\n找到可见数据后，你需要转换结果，使其与图表使用的数据对象匹配。\n\
  \n```typescript\nprivate parseResults(results: Graphic[]) {\n  const _stats = (Object).assign({},\
