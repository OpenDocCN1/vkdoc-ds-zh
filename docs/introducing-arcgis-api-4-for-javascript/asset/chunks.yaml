    # 5. 场景


    迄今为止，ArcGIS API 4 for JavaScript 最令人兴奋的功能之一便是引入了 3D 场景。3D 场景是一种可视化数据的非凡新方式（见图
    5-1）。


    ![A458961_1_En_5_Fig1_HTML.jpg](img/A458961_1_En_5_Fig1_HTML.jpg)


    图 5-1


    使用 Pictometry 影像的示例场景


    您可以使用场景查看器¹（Scene Viewer）创建和发布场景，该查看器是 ArcGIS Online 平台²的一部分。当您在场景查看器中创作场景时，它们会保存到您的帐户中，您可以与他人共享。然后，您可以使用场景的项目
    ID，将这些场景与您的 ArcGIS API 4 for JavaScript 应用程序结合使用。


    场景本身是在 ArcGIS Pro³中创建和发布的。您可以在场景查看器中更新场景，并修改或创建新的幻灯片⁴。您在场景查看器中更新和修改的场景，随后便可在您的
    ArcGIS API 4 for JavaScript 应用程序中查看。


    加载 `WebScene` ⁵ 非常简单；就像加载 `WebMap` 一样。


    ```

    1   import WebScene from "esri/WebScene";

    2   import SceneView from "esri/views/SceneView";


    4   const scene = new WebScene({

    5     portalItem: {

    6       id: "082c4fd545104f159db39da11ea1e675"

    7     }

    8   });


    10   const view = new SceneView({

    11     map: scene,

    12     container: "viewDiv"

    13   });

    ```


    这就是使用 ArcGIS JavaScript API 显示场景所需的全部操作。


    场景与常规地图有何不同？简单来说：3D。


    场景包含高程数据，这意味着您可以处理地形和建筑物。当您在地图上放置要素时，可以像在床上铺床单一样将它们覆盖。您也可以像广告牌一样将符号立牌显示（见图 5-2）。


    ![A458961_1_En_5_Fig2_HTML.jpg](img/A458961_1_En_5_Fig2_HTML.jpg)


    图 5-2


    场景中的示例 3D 符号


    ## SceneView


    `SceneView` 与 `MapView` 共享相似的 API，因为它们都基于 `View` ⁶ 模块。正如您已经了解到的，视图负责渲染 `Map`、`WebMap`
    或 `WebScene` 中的数据。


    要理解 `SceneView`，您需要了解几个可以使用的独特属性。


    *   `camera` ⁷

    *   `environment` ⁸

