    # 总结


    在本章中，你学习了如何使用 ArcGIS API for JavaScript 中的新微件框架来创建 `ViewModel` 和 `Widget`，使它们能够清晰地处理各自的任务。现在，你已经很好地掌握了如何使用一些辅助装饰器来简化属性与可渲染属性的绑定。同时，你也深入理解了如何将属性值绑定到
    JSX 中以进行显示。


    关于自定义微件开发的更多详细信息，你可以在文档中找到，此外还有一个 Hello World 示例和一个更复杂的示例。请记住，自定义微件开发确实需要对 `Accessor`
    有一定的了解。不过，与常规 JavaScript 相比，这些装饰器使得实现 `Accessor` 变得更加简单。


