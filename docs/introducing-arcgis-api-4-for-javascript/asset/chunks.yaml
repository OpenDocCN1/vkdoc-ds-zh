    # 摘要


    本章介绍了在 ArcGIS API for JavaScript 中使用场景的基础知识。3D 可视化是 ArcGIS API 4 for JavaScript
    中最新的、也是最令人兴奋的功能之一。它们为用户提供了以全新方式探索数据的机会，并且其用途在未来的版本中只会不断增加。现在，您应该熟悉以下内容：


    *   创建 `SceneView` 并使用 `WebScene`

    *   在场景中操作相机

    *   为应用程序中的场景自定义环境

    *   创建用于聚焦可视化和查看地下要素的局部场景


