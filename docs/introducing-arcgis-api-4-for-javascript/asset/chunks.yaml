    ## WebMaps


    Working with `WebMap` objects in version 4 of the API has never been easier. You
    can search for a variety of `WebMap`s in the ArcGIS gallery.[¹](#A458961_1_En_3_Chapter.html#Fn1)


    To create a `WebMap`, you simply need to have an `id` value for the item in the
    portal.


    ```

    1   import MapView from "esri/views/MapView";

    2   import WebMap from "esri/WebMap";


    4   const webmap = new WebMap({

    5     portalItem: {

    6       id: "2dfaf8bdb45a4dcf8511a849e4583873"

    7     }

    8   });


    10   const view = new MapView({

    11     map: webmap,

    12     container: "viewDiv"

    13   });

    ```


    That is it. That’s all you have to do to load the `WebMap` object into your application.
    But because the map is just a container of data, you can access the `WebMap` data
    before you display it on the page.


    Say, for example, that you wanted to adjust the `definitionExpression` of a layer
    in the `WebMap` object before it’s displayed. You could do something like this:


    ```

    1   // http://jsbin.com/lodihu/4/edit?html,output

    2   const webmap = new WebMap({

    3     portalItem: {

    4       id: "2dfaf8bdb45a4dcf8511a849e4583873"

    5     }

    6   });


    8   webmap.load().then(() => {

    9     const layer = webmap.layers.find({ id } => {

    10       return id.indexOf("CensusTractPoliticalAffiliationTotals") > -1;

    11     });

    12     layer.definitionExpression = "TOTPOP_CY > 10000"

    13     const view = new MapView({

    14       map: webmap,

    15       container: "viewDiv"

    16     });

    17   });

    ```


    That right there is pretty cool. Notice how you have to call the `load()` method
    of the `WebMap` object. This is because when the `WebMap` is initialized, the
    data is not prefetched. It’s only when a `WebMap` is added to a view does it load
    the data needed to display it. By calling the `load()` method, you are asking
    the `WebMap` to please load your data because you want to use it for whatever
    reason. This has the added benefit of letting you create multiple `WebMap` objects
    and passing them to the view as needed.


    ```

    1   const webmapids = [

    2     "e691172598f04ea8881cd2a4adaa45ba",

    3     "2dfaf8bdb45a4dcf8511a849e4583873"

    4   ];


    6   // create an array of WebMaps

    7   const webmaps = webmapids.map(webmapid => {

    8     return new WebMap({

    9       portalItem: {

    10         id: webmapid

    11       }

    12     });

    13   });

    ```


    You can then keep these `WebMap` objects sitting around until you actually need
    them and want to use them in a view. It is also possible to switch the map of
    the view during runtime.


    It should be noted that in the initial release of 4, not all layers and renderers
    are supported in the `WebMap` as of yet, but full support is currently in progess.
    Any layer that is not supported will be defined as `UnsupportedLayer`. There is
    also a layer type called `UnknownLayer`, which is used if a layer type cannot
    be determined. This layer is there in case new layer types are added in the future.


    ## LayerViews


    Since the map is simply a container of data and layers and the view is responsible
    for displaying that data, the way you interact with that data has changed. In
    the 3.x version of the ArcGIS API for JavaScript, you could access the graphics
    in a `FeatureLayer` directly from the layer. In version 4 of the API, the graphics
    are contained in the view, more precisely in the `LayerView` object, which is
    the views representation of the layer.


    You can get access to the layer as shown here:


    ```

    1   view.whenLayerView(layer).then((layerView)=>{

    2     // Do something with the LayerView

    3   });

    ```


    Once you have the `LayerView` and you want to interact with the features being
    displayed from a `FeatureLayer`, you can gain access to them via a method called
    `queryFeatures`.


    ```

    1   view.whenLayerView(layer).then((layerView)=>{

    2     // make sure the layeView is done drawing the graphics

    3     watchUtils.whenTrueOnce(layerView, "updating", ()=>{

    4       layerView.queryFeatures().then((graphics)=>{

    5         // Do something with the Graphics

    6       });

    7     });

    8   });

    ```


    There are a handful of other useful query methods you can use on a `FeatureLayer
    LayerView`.


    *   `queryExtent`: Returns the extent of the features in the `LayerView`

    *   `queryFeatureCount`: Returns a count of the features in the `LayerView`

    *   `queryObjectId`s: Returns an array of `ObjectId`s, which is pretty useful
    to do some more query tasks against the REST API


    These are all useful methods if you want to create a custom widget that can interact
    with the features being displayed.'
  trans: '

    # 3. 地图与视图


    最新版本的 ArcGIS API 创建地图的方式与 3.x 版本有所不同。


    ```

    1   import Map from "esri/Map";

    2   import SceneView from "esri/views/SceneView";


    4   const map = new Map({ basemap: "topo" });

    5   const view = new SceneView({

    6     container: "mainDiv",

    7     map,

    8     center: [-118.182, 33.913],

    9     scale: 836023

    10   });

    ```


    现在，地图（以及构成地图的图层）与地图数据的显示方式之间存在着明显的区别。你可以将地图视为数据源，而将视图视为地图的视觉表现。


    你可以在图 3-1 中看到这种关系。


    ![A458961_1_En_3_Fig1_HTML.jpg](img/A458961_1_En_3_Fig1_HTML.jpg)


    图 3-1


    地图-视图关系


    在图 3-1 中，你可以看到地图是各种空间服务的容器。同一张地图现在可以显示在 `MapView`（数据的二维表示）或 `SceneView`（数据的三维表示）中。每个视图负责数据的视觉显示方式。


    这意味着在 3.x API 中你可能认为理所当然的一些功能，例如直接在 `FeatureLayer` 上访问图形，将不再可用。这是因为一个视图可能显示一个图层中的
    10 个要素，而另一个视图可能显示同一图层中的 100 个要素。正如你在图 3-1 中所见，视图中的每个图层都表示为一个 `LayerView`。你可以通过使用
    `view.whenLayerView(sourceLayer)` 来获取视图的 `LayerView`。当 `LayerView` 完成时，这将返回一个
    `LayerView` 的 Promise。通过这样做，你可以访问视图中显示的实际图形。


    地图与视图的分离是 ArcGIS API for JavaScript 4 中引入的一个强大的新概念。借助此功能，你可以创建十几个使用不同服务的地图，而无需在将地图附加到视图之前预先加载所有数据。这允许你将地图视为应用程序中的纯数据源，即使不显示地图也能访问图层。


    ## WebMap


    在 API 的第 4 版中使用 `WebMap` 对象从未如此简单。你可以在 ArcGIS 图库中搜索各种 `WebMap`。¹


    要创建一个 `WebMap`，你只需要拥有门户中该项的 `id` 值。


    ```

    1   import MapView from "esri/views/MapView";

    2   import WebMap from "esri/WebMap";


    4   const webmap = new WebMap({

    5     portalItem: {

    6       id: "2dfaf8bdb45a4dcf8511a849e4583873"

    7     }

    8   });


    10   const view = new MapView({

    11     map: webmap,

    12     container: "viewDiv"

    13   });

    ```


    就是这样。将 `WebMap` 对象加载到应用程序中只需这些步骤。但由于地图只是一个数据容器，你可以在将其显示在页面上之前访问 `WebMap` 数据。


    例如，假设你想在显示 `WebMap` 对象中的某个图层之前调整其 `definitionExpression`。你可以这样做：


    ```

    1   // http://jsbin.com/lodihu/4/edit?html,output

    2   const webmap = new WebMap({

    3     portalItem: {

    4       id: "2dfaf8bdb45a4dcf8511a849e4583873"

    5     }

    6   });


    8   webmap.load().then(() => {

    9     const layer = webmap.layers.find({ id } => {

    10       return id.indexOf("CensusTractPoliticalAffiliationTotals") > -1;

    11     });

    12     layer.definitionExpression = "TOTPOP_CY > 10000"

    13     const view = new MapView({

    14       map: webmap,

    15       container: "viewDiv"

    16     });

    17   });

    ```


    这相当酷。请注意，你必须调用 `WebMap` 对象的 `load()` 方法。这是因为当 `WebMap` 被初始化时，数据不会被预取。只有当 `WebMap`
    被添加到视图时，它才会加载显示所需的数据。通过调用 `load()` 方法，你是在请求 `WebMap` 加载你的数据，因为你出于某种原因需要使用它。这还有一个额外的好处，即允许你创建多个
    `WebMap` 对象，并根据需要将它们传递给视图。


    ```

    1   const webmapids = [

    2     "e691172598f04ea8881cd2a4adaa45ba",

    3     "2dfaf8bdb45a4dcf8511a849e4583873"

    4   ];


    6   // 创建一个 WebMap 数组

    7   const webmaps = webmapids.map(webmapid => {

    8     return new WebMap({

    9       portalItem: {

    10         id: webmapid

    11       }

    12     });

    13   });

    ```


    然后，你可以将这些 `WebMap` 对象保留在内存中，直到你实际需要它们并在视图中使用它们。也可以在运行时切换视图的地图。


    需要注意的是，在 4 的初始版本中，`WebMap` 尚不支持所有图层和渲染器，但完全支持的工作正在进行中。任何不支持的图层都将被定义为 `UnsupportedLayer`。还有一种图层类型叫做
    `UnknownLayer`，当无法确定图层类型时使用。引入此图层是为了应对未来可能添加的新图层类型。


    ## LayerView


    由于地图仅仅是数据和图层的容器，而视图负责显示这些数据，因此你与数据交互的方式发生了变化。在 ArcGIS API for JavaScript 的 3.x
    版本中，你可以直接从图层访问 `FeatureLayer` 中的图形。在 API 的第 4 版中，图形包含在视图中，更确切地说，包含在 `LayerView`
    对象中，该对象是图层在视图中的表示。


    你可以像这样访问图层：


    ```

    1   view.whenLayerView(layer).then((layerView)=>{

    2     // 对 LayerView 执行某些操作

    3   });

    ```


    一旦你拥有了 `LayerView` 并希望与 `FeatureLayer` 显示的要素进行交互，你可以通过一个名为 `queryFeatures` 的方法来访问它们。


    ```

    1   view.whenLayerView(layer).then((layerView)=>{

    2     // 确保 layerView 已完成图形的绘制

    3     watchUtils.whenTrueOnce(layerView, "updating", ()=>{

    4       layerView.queryFeatures().then((graphics)=>{

    5         // 对 Graphics 执行某些操作

    6       });

    7     });

    8   });

    ```


    你可以在 `FeatureLayer LayerView` 上使用其他一些有用的查询方法。


    *   `queryExtent`：返回 `LayerView` 中要素的范围

    *   `queryFeatureCount`：返回 `LayerView` 中要素的计数

    *   `queryObjectIds`：返回一个 `ObjectId` 数组，这对于针对 REST API 执行更多查询任务非常有用


    如果你想创建一个能够与显示的要素进行交互的自定义微件，这些方法都非常有用。

