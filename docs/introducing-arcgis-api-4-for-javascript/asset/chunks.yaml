  trans: '

    ### `VectorTileLayer`


    矢量切片非常有趣。Mapbox 不久前发布了矢量切片规范⁷，事实证明它的用途极其广泛。矢量切片的文件体积很小，这使得我们可以构建高分辨率底图并高效缓存数据。矢量切片本质上是以一种紧凑的格式存储矢量数据，从而允许在浏览器中灵活地设置这些矢量要素的样式。这与创建无法在浏览器中设置样式的切片图像数据形成了对比。


    通常，你会有一个单一的服务来为你的应用程序提供所有矢量切片。不过，你可以为这些服务加载不同的样式，这样就能加载相同的数据，但呈现不同的外观。


    当你初始化一个 `VectorTileLayer` 时，其方式与其他图层相同。


    ```

    1   const tileLyr = new VectorTileLayer({

    2     url: "https://www.arcgis.com/sharing/rest/content/items/f96366254a564adda1dc46\

    3   38b447ed956/resources/styles/root.json"

    4   });

    ```


    如果你查看用于初始化 `VectorTileLayer` 的 URL，你会发现它实际上指向的是一个样式文件，而不是特定的图层 ID。你指向的 URL 是 `resources/styles/root.json`。这实际上只是一个样式文件，它定义了
    `VectorTileLayer` 在地图上渲染时应采用的样式。


    你实际上可以在运行时通过使用 `loadStyle()` 方法来切换 `VectorTileLayer` 的样式，例如 `vectorTileLayer.loadStyle(myNewStyleObject)`。


    矢量切片对制图师来说是一份礼物，因为矢量切片提供了灵活性，可以设计出非常时尚且富有影响力的底图。你可以通过这个矢量切片样式编辑器来测试 ArcGIS 矢量切片底图的样式：[`https://github.com/Esri/arcgis-vectortile-style-editor`](https://github.com/Esri/arcgis-vectortile-style-editor)。


    最近，ArcGIS API 4 for JavaScript 开始使用其自身的矢量切片实现。这种新的实现允许 API 渲染不同投影的矢量切片，并使其能够在
    3D 环境中使用；但是，当前的实现不支持 Mapbox 切片。


    矢量切片能提供极其清晰且美观的地图。重要的是要知道矢量切片使用了 WebGL⁸，这依赖于你的显卡和浏览器支持。如果你看到一些图形异常，或者注意到你的笔记本电脑冒烟，你可能需要考虑升级你的显卡驱动程序。


    ### `GroupLayer`


    `GroupLayer`⁹ 是一个有趣的图层。它不从网络服务拉取数据；但是，它允许你将多个图层组合在一起。这些图层不必是同一类型；你可以将一个 `GraphicsLayer`
    与一个 `TiledLayer` 组合在一起，一切都能正常工作。一个有用的场景是控制多个相似或相关的 `FeatureLayer` 的可见性。让我们看看下面的示例：


    ```

    1   import Map from "esri/Map";

    2   import MapView from "esri/views/MapView";

    3   import FeatureLayer from "esri/layers/FeatureLayer";

    4   import GroupLayer from "esri/layers/GroupLayer";


    6   const URL = "http://tmservices1.esri.com/arcgis/rest/services/LiveFeeds/NOAA_sto\

    7   rm_reports/MapServer";

    8   const titles = [

    9     "NOAA 冰雹风暴报告 (24 小时)",

    10     "NOAA 龙卷风风暴报告 (24 小时)",

    11     "NOAA 大风风暴报告 (24 小时)",

    12     "NOAA 龙卷风风暴报告 (过去一周)"

    13   ];

    14   const layers = [0, 1, 2, 3].map((index, idx) => {

    15     return new FeatureLayer({

    16       url: `${URL}/${index}`,

    17       outFields: ["*"],

    18       popupTemplate: {

    19         title: titles[idx],

    20         content: "{*}"

    21       }

    22     });

    23   });

    24   const groupLayer = new GroupLayer({ layers });

    25   const map = new Map({

    26     basemap: "streets",

    27     layers: [groupLayer]

    28   });

    29   const view = new MapView({

    30     container: "viewDiv",

    31     map,

    32     center: [-98.648, 36.374],

    33     zoom: 5,

    34     ui: {

    35       components: ["zoom", "attribution", "compass"]

    36     }

    37   });

    38   view.then(() => {

    39     const btn = document.createElement("div");

    40     btn.className = "esri-button esri-widget-button esri-interactive esri-icon-fea\

    41   ture-layer";

    42     btn.title = "切换风暴数据";

    43     view.ui.add(btn, "top-right");

    44     // 切换 GroupLayer 的图层可见性

    45     btn.addEventListener("click", () => {

    46       groupLayer.visible = !groupLayer.visible;

    47     });

    48   });

    ```


    这里你可以做的是切换 `GroupLayer` 的可见性。当你这样做时，被分组的图层的可见性也会随之切换。

    '
- fmt: '# Portal API


    While using the ArcGIS API 4 for JavaScript, with `WebMap`s, `WebScene`s, and
    even layers, the underlying API that powers most of this is the Portal API. The
    Portal API consists of a set of modules, ranging from the `Portal` class itself
    to `PortalItem`. You can utilize the Portal API to build a robust data explorer
    of your portal, but it’s also used in more subtle ways throughout the API.


    ```

    1   const webmap = new WebMap({

    2     portalItem: {

    3       id: webmapid

    4     }

    5   });


    7   const webscene = new WebScene({

    8     portalItem: {

    9       id: sceneid

    10     }

    11   });

    ```


    These examples use autocasting, which is covered in Chapter 4.


    Both `WebMap` and `WebScene` utilize the Portal API under the hood to build their
    respective maps and scenes. For example, a `WebMap` may consist of three layers
    from a portal. Each layer is referenced by its own portal item ID. When you load
    a `WebMap` by its ID, the Portal API is used to load that `WebMap` and then recursively
    load each layer item referenced by an ID or possibly simply a URL. The beauty
    of this is that when a map and even a layer is created, those resources are not
    immediately loaded. What this means for you as a developer is that you could initialize
    a group of `WebMap`s or layers without loading all their required resources and
    instead load that data only as needed. This is incredibly efficient for development
    purposes.


    Let’s look at what an application loading portal items may look like (Figure 3-2).


    ![A458961_1_En_3_Fig2_HTML.jpg](A458961_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Adding layers via portal items


    You’ll use `calcite-bootstrap` to help you style this app because it already has
    styling for nice-looking portal item cards built in. You can modify an existing
    sample to be a bit more explicit about working portal items and the generated
    layers.


    ```

    7     Fun with Portal Items


    9       html,

    10       body {

    11         font-family: sans-serif;

    12         padding: 0;

    13         margin: 0 !important;

    14         height: 100%;

    15         width: 100%;

    16       }

    17       #viewDiv {

    18         position: absolute;

    19         right: 0;

    20         left: 300px;

    21         top: 0;

    22         bottom: 0;

    23       }

    24       #itemDiv {

    25         position: absolute;

    26         left: 0;

    27         top: 0;

    28         bottom: 0;

    29         width: 300px;

    30         overflow-y: auto;

    31       }

    32       .description {

    33         margin: 0 auto;

    34         width: 100%;

    35         padding: 20px;

    36       }

    37       .card h6 {

    38         margin: 0 !important;

    39       }


    45       window.dojoConfig = {

    46         deps: [''app/main''],

    47         packages: [{

    48           name: ''app'',

    49           location: window.location.pathname.replace(/\/[^\/]+$/, ''''); +
    ''app'',

    50           main: ''main''

    51         }]

    52       };


    58       Add layer items to Map

    ```


    This is the code for the `app/main.js` file.


    ```

    1   import Map from ''esri/Map'';

    2   import MapView from ''esri/views/MapView'';

    3   import Layer from  "esri/layers/Layer";

    4   import PortalItem from "esri/portal/PortalItem";

    5   import esriLang from "esri/core/lang";

    6   import all from "dojo/promise/all";

    7   import on from "dojo/on";


    9   // create a card template to display Portal Item Information

    10   const template = `


    14       {title}


    16         {created}

    17         {owner}


    21            Add to map


    26   `;

    27   // Array of Portal Items for Layers

    28   const layerItems = [

