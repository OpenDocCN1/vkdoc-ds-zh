- fmt: '# Summary


    In this chapter, you learned how to use the new widget framework in the ArcGIS
    API for JavaScript to create a `ViewModel` and `Widget` that neatly handle their
    respective tasks. You now have a pretty good grasp on using some of the helper
    decorators to simplify the binding of properties to renderable properties. You
    also have a good understanding of how you can bind property values into JSX for
    display purposes.


    You can find more details about custom widget development in the documentation,
    in addition to a Hello World sample and a more involved sample. Don’t forget that
    custom widget development does require some familiarity with `Accessor`. However,
    the decorators make implementing `Accessor` much simpler than in regular JavaScript.


