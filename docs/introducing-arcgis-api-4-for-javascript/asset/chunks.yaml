  trans: '

    # 局部场景


    局部场景是三维可视化中极为实用的工具。通过局部场景，您可以在三维环境中查看地下数据。创建局部场景需要完成两项设置：配置 `SceneView#viewingMode`
    属性，并提供 `SceneView#clippingArea` 属性。


    ```

    1   const view = new SceneView({

    2     container: "viewDiv",

    3     map: map,

    4     viewingMode: "local",

    5     clippingArea: myClippingArea

    6   });

    ```


    局部场景允许您将三维表面展平并裁剪至特定范围，从而查看地下元素。目前，该功能可用于查看钻井、地震数据、压裂数据，以及任何可映射至地下的数据。不过，目前尚无直接的方法来显示管道数据。


    以下示例展示了如何创建局部场景以查看特定区域的钻井。您可以在此处查看在线演示：¹³


    ```

    1   require([

    2     "esri/Map",

    3     "esri/views/SceneView",

