    # 图层


    在 `WebMap` 中检索图层非常简单。要访问地图上的图层，只需从 `map.layers` 属性中获取即可。该属性会提供地图的操作图层，这意味着不包含底图。如果你想要包括底图在内的所有图层，可以使用
    `map.allLayers` 属性。相比 3.x 版本，这是一个更简单的 API。


    如果你只关心底图，可以通过 `map.basemap` 属性获取。


    重申一下，视图和 `LayerView` 才是实际绘制地图数据的部分。它们控制着图形的显示、范围以及任何其他视觉属性。而地图和图层则是这些数据的容器。它们是地图的模型，这意味着在应用程序开发中，你可以将它们视为模型来处理。地图和图层可以作为图表、表格或任何其他可能甚至没有地图显示的自定义组件的数据源。这是该
    API 的一个强大特性。


    API 中提供了多种图层，每种图层都有不同的用途。你可以在 API 文档中阅读每种图层类型的更多详细信息，但以下是一些常见的图层：


    *   `GraphicsLayer`

    *   `FeatureLayer`

    *   `MapImageLayer`

    *   `SceneLayer`

    *   `VectorTileLayer`


    ## GraphicsLayer


    `GraphicsLayer` 可能是你能用到的最简单的图层。顾名思义，它只包含显示在地图上的图形。


    注意


    如果你熟悉 ArcGIS API for JavaScript 3.x 版本的 `GraphicsLayer`，那么 4 版本中 `GraphicsLayer`
    的一个主要区别是它不支持渲染器。你需要在每个图形上定义符号，而不是在图层上定义。这是因为 `GraphicsLayer` 可以支持具有不同几何类型的图形。这大大简化了创建要显示在地图上的基本图形的过程。


    初始化一个 `GraphicsLayer` 相当简单。


    ```

    1   const graphicsLayer = new GraphicsLayer({

    2     graphics: [graphic1, graphic2, graphic3]

    3   });

    ```


    你可以通过几种方法向 `GraphicsLayer` 添加图形。


    ```

    1   // 添加单个图形

    2   graphicsLayer.add(graphic);

    3   // 添加图形数组

    4   graphicsLayer.addMany([graphic1, graphic2, graphic3]);

    ```


    由于无法为 `GraphicsLayer` 设置渲染器或弹出模板，你需要为每个图形单独定义符号和弹出窗口。


    ```

    1   // 创建一个图形

    2   let graphic = new Graphic({

    3     attributes: {

    4       id: 1,

    5       city: "Los Angeles"

    6     },

    7     geometry: { type: "point", x: xValue, y: yValue },

    8     symbol: { type: "simple-marker",

    9       style: ''circle'',

    10       color: ''red'',

    11       size: 10,

    12       outline: {

    13         color: ''rgba(255, 255, 255, 0.5)''

    14         width: 4

    15       }

    16     },

    17     popupTemplate: {

    18       title: "我的超棒图形！",

    19       content: "{*}" // 显示所有字段

    20     }

    21   });


    23   // 将其添加到 graphicsLayer

    24   graphicsLayer.add(graphic);

    ```


    弹出窗口将在后续章节中更详细地介绍。


    如果你需要更强大的图形支持，特别是使用渲染器和弹出窗口，那么你应该使用 `FeatureLayer`。`GraphicsLayer` 最适合作为简单的杂项图形容器。


    ## FeatureLayer


    `FeatureLayer` 可能是 ArcGIS 平台中用途最广泛、使用最广泛的图层类型。有几种不同的方法可以初始化一个 `FeatureLayer`。


    ```

    1   // 通过 URL 创建

    2   const featureLayer = new FeatureLayer({

    3     url: "http://services6.arcgis.com/m3L8QUZ93HeaQzKv/arcgis/rest/services/BeerAn\

    4   dBurgerJoints/FeatureServer/0"

    5   });


    7   // 通过 Portal 项目创建

    8   const featureLayer = new FeatureLayer({

    9     portalItem: {

    10       id: "b126510e440744169943fd8ccc9b0c4e"

    11     }

    12   });

    ```


    通过这两种方法之一初始化 `FeatureLayer` 后，该图层就绑定到了一个远程服务。就像你可以查询 `FeatureLayer` 的 `LayerView`
    一样，你也可以直接查询 `FeatureLayer` 来查找要素、`ObjectId` 或 `FeatureLayer` 的范围。


    你也可以通过 `FeatureCollection` 创建 `FeatureLayer`，尽管与 API 的 3.x 版本相比，这个过程已经简化了。


    ```

    1   const featureLayer = new FeatureLayer({

    2     objectIdField: "item_id",

    3     geometryType: "point",

    4     // 定义 FeatureLayer 中图形的字段

    5     fields: [{

    6       name: "item_id",

    7       alias: "项目 ID",

    8       type: "oid"

    9     }, {

    10       name: "description",

    11       alias: "描述",

    12       type: "string"

    13     }, {

    14       name: "title",

    15       alias: "标题",

    16       type: "string"

    17     }],

    18     // 为图层定义渲染器

    19     renderer: {

    20       type: "simple",

    21       symbol: {

    type: "simple-marker",

    22         style: ''circle'',

    23         color: ''red'',

    24         size: 10,

    25         outline: {

    26           color: ''rgba(255, 255, 255, 0.5)''

    27           width: 4

    28         }

    29       }

    30     },

    31     popupTemplate: {

    32       title: "{title}",

    33       content: "{description}"

    34     },

    35     // 这是一个图形集合

    36     source: [graphic1, graphic2, graphic3]

    37   });

    ```


    这里你正在做的是手动定义 `FeatureLayer` 的数据源。这基本上传递了一个图形集合，并为这些图形定义了渲染器，以及字段和弹出窗口。这样做的好处是能够为多个图形使用单个渲染器以及单个弹出窗口。你还可以像查询绑定到远程服务的
    `FeatureLayer` 一样，查询这个 `FeatureLayer`。


    现在，也许你想更新 `FeatureLayer` 中的源要素。你可以通过以下方式实现：


    ```

    1   const graphicOfInterest = featureLayer.source.find(x => x.attributes.OBJECTID
    ==\

    2   = oid);

    3   const target = graphicOfInterest.clone();

    4   const target.geometry = updatedGeometry;

    5   featureLayer.source.remove(graphicOfInterest);

    6   featureLayer.source.add(target);

    ```


    这允许你更新 `FeatureLayer` 源中的单个图形。如果你想显示更新的 GPS 数据或更改单个要素的符号，这会非常有用。

    '
- fmt: '### MapImageLayer


    `MapImageLayer`以前被称为`ArcGISDynamicMapServiceLayer`。它允许你将动态地图服务加载到应用程序中，与切片图像服务不同，它会为整个地图范围加载单个图像，而不是许多切片。


    这是一个相当简单的图层。你甚至可以在`MapImageLayer`中定义哪些子图层可见，这在以前是一项繁琐的任务。现在处理子图层要容易得多。


    ```

    1   const layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\

    3   r",

    4     sublayers: [{

    5       id: 0,

    6       visible: true

    7     }, {

    8       id: 1,

    9       visible: true

    10     }, {

    11       id: 2,

    12       visible: true

    13     }, {

    14       id: 3,

    15       visible: false

    16     }]

    17   });

    ```


    你可以简单地在`MapImageLayer`的`sublayers`属性中定义每个子图层的可见性。你甚至可以更进一步，为单个子图层提供`definitionExpression`。


    ```

    1   let layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\

    3   r",

    4     sublayers: [{

    5       id: 0,

    6       visible: true

    7     }, {

    8       id: 1,

    9       visible: true

    10     }, {

    11       id: 2,

    12       visible: true,

    13       // provide a definitionExpression

    14       definitionExpression: "pop2000 > 1000000"

    15     }, {

    16       id: 3,

    17       visible: false

    18     }]

    19   });

    ```


    现在，当请求图像时，这将为动态地图服务的子图层传递一个`definitionExpression`。这遵循了ArcGIS API for JavaScript整个第4版的主题，即提供更简单的API。我完全期望人们会利用这个更易用的API，在他们的应用程序中实现`MapImageLayer`的实用功能。


    在ArcGIS API 4 for JavaScript的第4版中，你定义的子图层将是`MapImageLayer`中唯一使用的子图层。如果你正在处理一个包含数百个图层的地图服务，这将非常有用，我个人见过太多这样的情况。


    你还可以为每个子图层定义一个`popupTemplate`²和一个`renderer`³。


    ```

    1   const layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver",

    4     sublayers: [

    5     {

    6       id: 3,

    7       visible: true,

    8       renderer: {type: "simple",

    9         symbol: { type: "simple-fill",

    10           style: "solid",

    11           color: "dodgerblue",

    12           outline: {

    13             width: 0.5,

    14             color: "white"

    15           }

    16         },

    17         label: "State boundaries"

    18       },

    19       opacity: 0.5

    20     },

    21     {

    22       id: 2,

    23       visible: true,

    24       popupTemplate: {

    25           title: "{NAME}",

    26           content: [

    27           {

    28             fieldInfos: [

    29               {

    30                 fieldName: "POP2000",

    31                 visible: true,

    32                 label: "Population for year 2000",

    33                 format: {

    34                   places: 0,

    35                   digitSeparator: true

    36                 }

    37               },

    38               {

    39                 fieldName: "POP2007",

    40                 visible: true,

    41                 label: "Population for year 2007",

    42                 format: {

    43                   places: 0,

    44                   digitSeparator: true

    45                 }

    46               }

    47             ]

    48           },

    49           {

    50             type: "media",

    51             mediaInfos: [

    52               {

    53                 title: "Population",

    54                 type: "column-chart",

    55                 caption: "",

    56                 value: {

    57                   theme: "Grasshopper",

    58                   fields: [ "POP2000", "POP2007" ],

    59                   normalizeField: null,

    60                   tooltipField: null

    61                 }

    62               }

    63             ]

    64           }

    65           ]

    66         }

    67     },

    68     {

    69       id: 0,

    70       visible: true,

    71       definitionExpression: "POP2000 > 100000"

    72     }]

    73   });

    ```


    这非常强大，因为你现在可以像使用`FeatureService`一样轻松地处理地图服务。在API的3.x版本中，为动态地图服务定义自定义渲染器的功能已经存在了一段时间，并且作为ArcGIS
    Server地图服务的一部分也已经存在了一段时间。从ArcGIS API for JavaScript的第4版开始，新特性是它简化了API，使开发人员更容易利用这一功能。能够为每个子图层定义弹出窗口的功能增加了`MapImageLayer`的实用性，我毫不避讳地说，我认为这是我现在个人最喜欢的API图层。


    你还可以通过查询表和表连接对`MapImageLayer`做更多事情，前提是你的服务中有这些数据。请查看文档⁴了解这些细节，并尽情享受`MapImageLayer`的强大功能。


    ### CSVLayer


    `CSVLayer`⁵在ArcGIS API 4 for JavaScript中非常有用，用于在空间上表示表格数据。


    只要CSV文件具有以下名称的坐标字段，它就可以为你转换文件：


    *   经度字段名称：`lon`、`lng`、`long`、`longitude`、`x`、`xcenter`、`longitude83`、`longdecdeg`、`POINT-X`

    *   纬度字段名称：`lat`、`latitude`、`y`、`ycenter`、`latitude83`、`latdecdeg`、`POINT-Y`


    如果你的CSV文件不符合该格式，你可以使用`CSVLayer`的`latitudeField`和`longitudeField`属性指定自定义的纬度和经度字段名称。


    ```

    1   let csvLayer = new CSVLayer({

    2    url: "http://ontheinternet/mydata.csv",

    3    copyright: "Please provide a copyright for the data"

    4   });

    ```


    请注意，根据CSV文件的来源，你可能需要在应用程序中提供一个`proxyRule`。


    ```

    1   urlUtils.addProxyRule({

    2    urlPrefix: "ontheinternet",

    3    proxyUrl: "/proxy/"

    4   });

    ```


    ### SceneLayer


    处理3D地图的一个关键组件是`SceneLayer`。`SceneLayer`允许你将场景服务⁶加载到你的3D地图应用程序中。一旦你有了`SceneLayer`，通过`SceneView`将其添加到你的3D地图中就相当简单了。


    ```

    1   const sceneLayer = new SceneLayer({

    2     url: "http://scene.arcgis.com/arcgis/rest/services/Hosted/Building_Boston/Scen\

    3   eServer/layers/0";

    4   });


    6   const map = new Map({

    7     basemap: "streets",

    8     ground: "world-elevation",

    9     layers: [sceneLayer]

    10   });


    12   const view = new SceneView({

    13     container: "viewDiv",

    14     map: map,

    15     scale: 50000000,

    16     center: [-101.17, 21.78]

    17   });

    ```


    我将在后面的章节中介绍3D可视化和`SceneView`，但你真正需要知道的是，将`SceneLayer`添加到你的地图中与添加其他图层的方式完全相同。'
  raw: '### MapImageLayer


    The `MapImageLayer` was previously known as the `ArcGISDynamicMapServiceLayer`.
    It lets you load dynamic map services into your application, which, unlike tiled
    image services, loads a single image for the entire map extent instead of many
    tiles.


    It’s a fairly simple layer to work with. You can even define what sublayers are
    visible in the `MapImageLayer`, which used to be a cumbersome task. Working with
    sublayers is now much easier.


    ```

    1   const layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\

    3   r",

    4     sublayers: [{

    5       id: 0,

    6       visible: true

    7     }, {

    8       id: 1,

    9       visible: true

    10     }, {

    11       id: 2,

    12       visible: true

    13     }, {

    14       id: 3,

    15       visible: false

    16     }]

    17   });

    ```


    You can simply define the visibility of each sublayer in the `sublayers` property
    of the `MapImageLayer`. You could even take it a step further and provide a `definitionExpression`
    for individual sublayers.


    ```

    1   let layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\

    3   r",

    4     sublayers: [{

    5       id: 0,

    6       visible: true

    7     }, {

    8       id: 1,

    9       visible: true

    10     }, {

    11       id: 2,

    12       visible: true,

    13       // provide a definitionExpression

    14       definitionExpression: "pop2000 > 1000000"

    15     }, {

    16       id: 3,

    17       visible: false

    18     }]

    19   });

    ```


    This will now pass a `definitionExpression` for the sublayer to the dynamic map
    service when it requests the image. This follows along with the theme of the entire
    version 4 of the ArcGIS API for JavaScript to provide a simpler API. I fully expect
    people to implement the utility of the `MapImageLayer` in their applications with
    this easier-to-use API.


    With version 4 of the ArcGIS API 4 for JavaScript , the sublayers you define will
    be the only sublayers used in the `MapImageLayer`. This is incredibly useful if
    you are working with a map service that contains hundreds of layers, which I have
    personally seen far too many times.


    You can also define a `popupTemplate` [²](#A458961_1_En_3_Chapter.html#Fn2) and
    even a `renderer` [³](#A458961_1_En_3_Chapter.html#Fn3) per sublayer.


    ```

    1   const layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver",

    4     sublayers: [

    5     {

    6       id: 3,

    7       visible: true,

    8       renderer: {type: "simple",

    9         symbol: { type: "simple-fill",

    10           style: "solid",

    11           color: "dodgerblue",

    12           outline: {

    13             width: 0.5,

    14             color: "white"

    15           }

    16         },

    17         label: "State boundaries"

    18       },

    19       opacity: 0.5

    20     },

    21     {

    22       id: 2,

    23       visible: true,

    24       popupTemplate: {

    25           title: "{NAME}",

    26           content: [

    27           {

    28             fieldInfos: [

    29               {

    30                 fieldName: "POP2000",

    31                 visible: true,

    32                 label: "Population for year 2000",

    33                 format: {

    34                   places: 0,

    35                   digitSeparator: true

    36                 }

    37               },

    38               {

    39                 fieldName: "POP2007",

    40                 visible: true,

    41                 label: "Population for year 2007",

    42                 format: {

    43                   places: 0,

    44                   digitSeparator: true

    45                 }

    46               }

    47             ]

    48           },

    49           {

    50             type: "media",

    51             mediaInfos: [

    52               {

    53                 title: "Population",

    54                 type: "column-chart",

    55                 caption: "",

    56                 value: {

    57                   theme: "Grasshopper",

    58                   fields: [ "POP2000", "POP2007" ],

    59                   normalizeField: null,

    60                   tooltipField: null

    61                 }

    62               }

    63             ]

    64           }

    65           ]

    66         }

    67     },

    68     {

    69       id: 0,

    70       visible: true,

    71       definitionExpression: "POP2000 > 100000"

    72     }]

    73   });

    ```


    This is incredibly powerful as you can now work with map services almost as easily
    as a `FeatureService`. The ability to define a custom renderer for dynamic map
    services has been available for quite some time in the 3.x version of the API,
    and it’s been available as part of the ArcGIS Server map service for some time
    as well. What is new, starting with the version 4 of the ArcGIS API for JavaScript,
    is that it has simplified the API for developers to more easily take advantage
    of this feature. The addition of being able to define popups per sublayer just
    adds to the utility of the `MapImageLayer`, and I’m not afraid to say that I think
    this is now my personal favorite layer to work with as part of the API.


    There is even more you can do with the `MapImageLayer` via query tables and table
    joins if you have that data available via your services. Check out the documentation[⁴](#A458961_1_En_3_Chapter.html#Fn4)
    for those details and bask in the glory of the `MapImageLayer`.


    ### CSVLayer


    The `CSVLayer` [⁵](#A458961_1_En_3_Chapter.html#Fn5) is incredibly useful in the
    ArcGIS API 4 for JavaScript to represent tabular data spatially.


    As long as the CSV file has fields of the following names with coordinates, it
    can convert the file for you:


    *   Longitude field names: `lon`, `lng`, `long`, `longitude`, `x`, `xcenter`,
    `longitude83`, `longdecdeg`, `POINT-X`

    *   Latitude field names: `lat`, `latitude`, `y`, `ycenter`, `latitude83`, `latdecdeg`,
    `POINT-Y`


    If your CSV file does not conform to that format, you can specify custom latitude
    and longitude field names using the `latitudeField` and `longitudeField` properties
    of the `CSVLayer`.


    ```

    1   let csvLayer = new CSVLayer({

    2    url: "http://ontheinternet/mydata.csv",

    3    copyright: "Please provide a copyright for the data"

    4   });

    ```


    Note that depending on where the CSV file is originating, you may need to provide
    a `proxyRule` in your application.


    ```

    1   urlUtils.addProxyRule({

    2    urlPrefix: "ontheinternet",

    3    proxyUrl: "/proxy/"

    4   });

    ```


    ### SceneLayer


    A key component of working with 3D maps is the `SceneLayer. SceneLayer`s allow
    you to load a scene service[⁶](#A458961_1_En_3_Chapter.html#Fn6) into your 3D
    mapping applications. Once you have a `SceneLayer`, it’s fairly straightforward
    to add it to your 3D map via the `SceneView`.


    ```

    1   const sceneLayer = new SceneLayer({

    2     url: "http://scene.arcgis.com/arcgis/rest/services/Hosted/Building_Boston/Scen\

    3   eServer/layers/0";

    4   });


    6   const map = new Map({

    7     basemap: "streets",

    8     ground: "world-elevation",

    9     layers: [sceneLayer]

    10   });


    12   const view = new SceneView({

    13     container: "viewDiv",

    14     map: map,

    15     scale: 50000000,

    16     center: [-101.17, 21.78]

    17   });

    ```


    I’ll cover 3D visualizations and the `SceneView` in later chapters, but all you
    really need to know is that adding a `SceneLayer` to your map is identical to
    how you add other layers.'
  trans: '

    ### MapImageLayer


    `MapImageLayer` 以前被称为 `ArcGISDynamicMapServiceLayer`。它允许你将动态地图服务加载到应用程序中，与切片图像服务不同，它会为整个地图范围加载单个图像，而不是许多切片。


    这是一个相当简单的图层。你甚至可以在 `MapImageLayer` 中定义哪些子图层可见，这在以前是一项繁琐的任务。现在处理子图层要容易得多。


    ```

    1   const layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServe\

    3   r",

    4     sublayers: [{

    5       id: 0,

    6       visible: true

    7     }, {

    8       id: 1,

    9       visible: true

    10     }, {

    11       id: 2,

    12       visible: true

    13     }, {

    14       id: 3,

    15       visible: false

    16     }]

    17   });

