    The `render()` method is where the actual widget is defined. As you can see, it
    looks like you have placed regular HTML into your JavaScript, with some slight
    differences. You can bind rendered data to properties of the widget. For example,
    `<label>Facilities Summary ({this.count})</label>` will display as `<label>Facilities
    Summary (81)</label>` if the `count` property is `81`. When the `count` property
    changes, the render method will be called again but will update the DOM with the
    new value of `count`.


    You first initialize some values to use the helper methods you created.


    ```typescript

    1       ...

    2       const max = roundToInt(allValues(this.stats), 10);

    3       const multi = 1;

    4       const chartHeight = { height: `${(max * multi)}px` };

    5       const styles = inlineStyle({ target: this.stats, multi });

    6       ...

    ```


    These values will be used to determine the CSS height and color of each category
    for your chart to display in your custom widget.


    I mentioned earlier that you use a `CSS` object to help you define the CSS for
    your widget. If you want to combine styles of the `CSS` object, there is a help
    method in `esri/widgets/support/widget` called `join`.


    ```typescript

    1    Carcinogen

    ```


    This will combine the different CSS classes into a single string when the DOM
    of the widget is built.


    Now you have wired your widget with your `ViewModel` and the `ViewModel` with
    your application store. The `ViewModel` will handle the business logic of updating
    the chart data as the map is panned around. The widget will handle the logic to
    create and display the chart data appropriately. In this case, you have a nice
    separation of concerns in your application.


    You can refer to the completed demo application[^(19)](#A458961_1_En_7_Chapter.html#Fn19)
    to see how to implement the custom widget and compile the TypeScript.'
