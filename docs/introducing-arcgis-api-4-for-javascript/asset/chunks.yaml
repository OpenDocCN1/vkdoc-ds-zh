- fmt: '# Summary


    This chapter covered the basics of working with scenes in the ArcGIS API for JavaScript.
    3D visualizations are the newest and one of the more exciting features in the
    ArcGIS API 4 for JavaScript. They provide an opportunity for users to explore
    their data in entirely new ways, and their usefulness will only grow in future
    releases. You should now be familiar with the following:


    *   Creating a `SceneView` and using `WebScene`s

    *   Working with the camera in a scene

    *   Customizing the environment for a scene in your application

    *   Creating local scenes for focused visualizations and viewing subsurface features


