    # 6. Popup


    Since version 1.0 of the ArcGIS API for JavaScript, a user’s first interaction
    when clicking a map has usually been to get a popup. The `Popup` [¹](#A458961_1_En_6_Chapter.html#Fn1)
    widget is typically the first entry point to the raw data behind the visualizations
    displayed on the map. A well-defined visualization of data on a map may tell you
    the population density of a city compared to an adjacent city based on a color
    from a color ramp or the size of the point displayed. But your first look at those
    raw numbers is probably going to come from clicking that feature and viewing the
    data in the popup.


    Because popups are so key to exploring the data in your map, there are various
    options for configuring how that data is displayed.'
