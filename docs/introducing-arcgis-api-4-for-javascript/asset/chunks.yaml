- fmt: '# Custom Actions


    One of the most interesting additions to the ArcGIS API 4 for JavaScript is the
    ability to add custom actions. Custom actions let you add small buttons to a popup
    that can be used for various tasks. You can use it to open new web pages, perform
    queries, or perform other tasks.


    In this sample, you are going to perform a search based on the city name for beer-related
    events in that city.


    ```

    1   require([

    2     "esri/views/MapView",

    3     "esri/Map",

    4     "esri/layers/Layer"

    5   ], function(

    6           MapView, Map, Layer

    7           ) {


    9     const map = new Map({

    10       basemap: "streets-navigation-vector"

    11     });


    13     const view = new MapView({

    14       map: map,

    15       container: "viewDiv",

    16       center: [-117.24, 34.05],

    17       zoom: 8

    18     });


    20     view.popup.on("trigger-action", ({ action }) => {

    21       if (action.id === "alcohol-details") {

    22         var attributes = view.popup.viewModel.selectedFeature.attributes;

    23         var name = attributes.NAME;

    24         window.open(`https://www.google.com/search?q=${name} Beer events`);

    25       }

    26     });


    28     Layer.fromPortalItem({

    29       portalItem: {

    30         id: "c531f67a12254c27af9479d436e23850"

    31       }

    32     })

    33     .then((layer) => {

    34       layer.popupTemplate = {

    35         title: ''{Name}'',

    36         content: ''{*}'',

    37         actions: [{

    38             id: ''alcohol-details'',

    39             className: ''esri-icon-description'',

    40             title: ''Events''

    41         }]

    42       };

    43       map.add(layer);

    44     })

    45     .otherwise(err => console.log(err));

    46   });

    ```


    You can find a demo of this application at [`http://jsbin.com/namufut/2/edit?js,output`](http://jsbin.com/namufut/2/edit?js,output).


    The main thing to remember is that when you define the `PopupTemplate`, you want
    to define an `actions` property that contains an array of the various custom actions
    you may want to use.


    ```

    1   {

    2     title: ''{Name}'',

    3     content: ''{*}'',

    4     actions: [{

    5         id: ''alcohol-details'',

    6         className: ''esri-icon-description'',

    7         title: ''Events''

    8     }]

    9   }

    ```


    The `className` property is used to define a custom icon. This can be an icon
    you define in your CSS code or one of the icons provided in the API. You could
    also provide an `image` property that is the URL of an image you want to use.
    If you don’t define a `className` or `image`, there is a default icon that will
    be provided. You can read more about custom actions in the documentation.


    The custom actions can also come in handy if you want to make requests to third-party
    web services such as a custom API that is used to provide detailed information
    about customers.


    ```

    1   view.popup.on("trigger-action", ({ action }) => {

    2     if (action.id === "customer-details") {

    3       var attributes = view.popup.viewModel.selectedFeature.attributes;

    4       var customerGroup = attributes.CUSTOMER_GROUP;

    5       esriRequest(customAPIURL, {

    6         query: {

    7           group: customerGroup

    8         },

    9         responseType: "json"

    10       })

    11       .then({ data } => {

    12         // parse data and update popup content

    13       })

    14       .otherwise(error => console.log(error));

    15     }

    16   });

    ```


    ## Summary


    In this chapter, you learned how to define a `PopupTemplate`. You also learned
    how to set up the fields and field aliases you can use in your `PopupTemplate`,
    giving you more fine-grained control over how your data is displayed. The `PopupTemplate`
    can even contain custom HTML or media elements such as charts to provide a deeper
    understanding of the data. You also saw how you can use custom actions in the
    `PopupTemplate` to perform some custom tasks such as searching the Web or accessing
    third-party web services to add even more value to your data.


    The `Popup` is typically the first entry point users have to details of the data
    on the map. It is widely used and has a lot of capabilities. Anyone developing
    with the ArcGIS API for JavaScript would do well to learn how to use it to its
    full capabilities.


    In the next chapter, you will look at how you can use the new widget framework
    in the ArcGIS API for JavaScript to create a custom widget!


    Footnotes


    [`https://developers.arcgis.com/javascript/latest/api-reference/esri-widgets-Popup.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-widgets-Popup.html)


    [`https://doc.arcgis.com/en/arcgis-online/create-maps/configure-pop-ups.htm`](https://doc.arcgis.com/en/arcgis-online/create-maps/configure-pop-ups.htm)


    [`https://developers.arcgis.com/arcade/`](https://developers.arcgis.com/arcade/)


    [`https://download.dojotoolkit.org/release-1.10.0/dojo-release-1.10.0/dojox/charting/tests/theme_preview.html`](https://download.dojotoolkit.org/release-1.10.0/dojo-release-1.10.0/dojox/charting/tests/theme_preview.html)


    [`https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#media`](https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#media)


    [`https://developers.arcgis.com/javascript/latest/guide/esri-icon-font/index.html`](https://developers.arcgis.com/javascript/latest/guide/esri-icon-font/index.html)


    [`https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#actions`](https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html#actions)


    [`https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-PopupTemplate.html)


    # Widgets


    Version 4 of the ArcGIS API for JavaScript introduced its own widget framework
    to build custom widgets. The custom widget development is powered by a virtual
    DOM library called MaquetteJS. This replaces the older Dojo Dijit framework that
    was previously used to build widgets. Although Dijit is a perfectly stable and
    battle-tested widget framework, a virtual DOM library allows you to work with
    an abstract version of the DOM, making it efficient to find changes and update
    the DOM.


    ## Prerequisites


    Custom widget development, however, does have one prerequisite you should be aware
    of: TypeScript. Much of the tooling used for custom widget development, such as
    the Accessor decorators discussed in earlier chapters, require the use of TypeScript.


    I highly recommend you review the TypeScript tutorials. I also highly recommend
    the following courses on Egghead.io:


    - Up and Running with TypeScript

    - Using Types Effectively in TypeScript'
