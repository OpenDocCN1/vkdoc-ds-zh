    # 微件


    ArcGIS API for JavaScript 的版本 4 引入了自己的微件框架来构建自定义微件。自定义微件开发由名为 MaquetteJS 的虚拟 DOM
    库提供支持。这取代了以前用于构建微件的旧版 Dojo Dijit 框架。尽管 Dijit 是一个完全稳定且久经考验的微件框架，但虚拟 DOM 库允许您使用
    DOM 的抽象版本，从而可以高效地发现更改并更新 DOM。


    ## 先决条件


    然而，自定义微件开发有一个您应该注意的先决条件：TypeScript。用于自定义微件开发的许多工具（例如前面章节中讨论的 Accessor 装饰器）都需要使用
    TypeScript。


    我强烈建议您学习 TypeScript 教程。我还强烈推荐 Egghead.io 上的以下课程：


    - 快速上手 TypeScript

    - 在 TypeScript 中有效使用类型

