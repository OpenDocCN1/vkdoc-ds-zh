    ![A458961_1_En_5_Fig4_HTML.jpg](A458961_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Local scene demo


    We are taking advantage of lots of autocasting in this example, but let’s take
    a look at some of the modules being used that are specific to 3D. You are being
    introduced to a few new symbols in this demo: `PointSymbol3D`,[^(14)](#A458961_1_En_5_Chapter.html#Fn14)
    `IconSymbol3DLayer`,[^(15)](#A458961_1_En_5_Chapter.html#Fn15) and `ObjectSymbol3DLayer`.[^(16)](#A458961_1_En_5_Chapter.html#Fn16)


    The `PointSymbol3D` symbol does exactly what it says it does. It allows you to
    display point data in a 3D `SceneView`. Alone, it doesn’t do much, but that’s
    what the other two symbols are used for.


    The `IconSymbol3DLayer` symbol lets you define a symbol that can be used in a
    3D environment and draped over a surface. Each of these symbols has primitive
    types that can be used in your applications. The primitive types for `IconSymbol3DLayer`.[^(17)](#A458961_1_En_5_Chapter.html#Fn17)
    You can also provide a URL to the `href` property to link to your own symbol to
    use here.


    The `ObjectSymbol3DLayer` symbol takes this a step further in a 3D environment
    and lets you define shapes, such as spheres, cylinders, cubes, and more. The primitive
    types of the `ObjectSymbol3DLayer` symbol are listed.[^(18)](#A458961_1_En_5_Chapter.html#Fn18)
    Note that the ArcGIS API for JavaScript documentation points out that if you want
    to use custom objects, you need to create and export them in ArcGIS Pro via the
    tutorial.[^(19)](#A458961_1_En_5_Chapter.html#Fn19)'
  raw: '## Local Scenes


    Local scenes are an extremely useful tool for 3D visualizations. A local scene
    will allow you to view subsurface data in a 3D environment. You need two things
    when you want to create a local scene. You need to set the `SceneView#viewingMode`
    property and provide a `SceneView#clippingArea` property .


    ```

    1   const view = new SceneView({

    2     container: "viewDiv",

    3     map: map,

    4     viewingMode: "local",

    5     clippingArea: myClippingArea

    6   });

    ```


    A local scene allows you to flatten a 3D surface and clip it to a particular extent
    so you can view subsurface elements. This is currently useful to view wells, earthquake
    data, fracking data, and essentially any data that can be mapped underground.
    There isn’t really a straightforward method to display pipeline data at the moment.


    Here is a sample of how you might create a local scene to view some wells in a
    specific area. You can see a live demo here:[^(13)](#A458961_1_En_5_Chapter.html#Fn13)


    ```

    1   require([

    2     "esri/Map",

    3     "esri/views/SceneView",

    4     "esri/layers/FeatureLayer",

    5     "esri/widgets/Home"

    6   ], function(Map, SceneView, FeatureLayer, Home

    7   ) {


    9     const wellsUrl = "http://services.arcgis.com/jDGuO8tYggdCCnUJ/arcgis/rest/serv\

    10   ices/CA%20Class%20II%20Injection%20Wells/FeatureServer/6";


    12     const wellsSurfaceRenderer = {

    13     type: “simple",

    14     symbol: {

    15       type: “point-3d",

    16       symbolLayers: [{

    17         type: “icon",

    18         material: {

    19           color: “#0D2644"

    20         },

    21         resource: {

    22           primitive: “circle"

    23         },

    24         size: 4

    25       }]

    26     }

    27   };


    29     const wellsDepthRenderer = {

    30      type: “simple",

    31      symbol: {

    32        type: “point-3d",

    33        symbolLayers: [{

    34          type: “object",

    35          resource: {

    36            primitive: “cylinder"

    37          },

    38          width: 50

    39        }]

    40      },

    41      visualVariables: [

    42      {

    43        type: “size",

    44        field: “WellDepthA",

    45        axis: “height",

    46        stops: [

    47        {

    48          value: 1,

    49          size: -0.3048 // meters!

    50        },

    51        {

    52          value: 10000,

    53          size: -3048 // meters!

    54        }]

    55      },

    56      {

    57        type: “size",

    58        axis: “width",

    59        useSymbolValue: true // sets the width to 50m

    60      },

    61      {

    62        type: “color",

    63        field: “WellDepthA",

    64        stops: [

    65          {

    66            value: 0,

    67            color: “#FFFCD4",

    68          },

    69          {

    70            value: 10000,

    71            color: “#FF0000"

    72          }

    73        ]

    74      }

    75      ]

    76    });


    78     // Underground wells

    79     const wellsLyr = new FeatureLayer({

    80       url: wellsUrl,

    81       definitionExpression: "WellDepthA > 0",

    82       outFields: ["*"],

    83       popupTemplate: {

    84         title: "Well",

    85         content: "{*}"

    86       },

    87       renderer: wellsDepthRenderer,

    88       // Keep the cylinders from poking above the ground

    89       elevationInfo: {

    90         mode: "relative-to-ground",

    91         offset: -10

    92       }

    93     });


    95     // Wells shown on surface

    96     const wellsSurfaceLyr = new FeatureLayer({

    97       url: wellsUrl,

    98       definitionExpression: "WellDepthA > 0",

    99       outFields: ["*"],

    100       popupTemplate: {

    101         title: "Well",

    102         content: "{*}"

    103       },

    104       renderer: wellsSurfaceRenderer,

    105       elevationInfo: {

    106         mode: "on-the-ground"

    107       }

    108     });


    110     const losAngelesExtent = {

    111       xmax: -13151509,

    112       xmin: -13160242,

    113       ymax: 3999804,

    114       ymin: 3992447,

    115       spatialReference: {

    116         wkid: 102100

    117       }

    118     };


    120     const map = new Map({

    121       basemap: "topo",

    122       layers: [

    123         wellsLyr,

    124         wellsSurfaceLyr

    125       ]

    126     });


    128     const view = new SceneView({

    129       container: "viewDiv",

    130       map: map,

    131       viewingMode: "local",

    132       clippingArea: losAngelesExtent,

    133       extent: losAngelesExtent,

    134       constraints: {

    135         collision: {

    136           enabled: false

    137         },

    138         tilt: {

    139           max: 360

    140         }

    141       },

    142       environment: {

    143         atmosphere: null,

    144         starsEnabled : false

    145       }

    146     });


    148     const homeBtn = new Home({

    149       view: view

    150     }, "homeDiv");

    151     homeBtn.startup();

    152   });

    ```


    You should get an application that looks similar to Figure [5-4](#A458961_1_En_5_Chapter.html#Fig4).


    ![A458961_1_En_5_Fig4_HTML.jpg](A458961_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


