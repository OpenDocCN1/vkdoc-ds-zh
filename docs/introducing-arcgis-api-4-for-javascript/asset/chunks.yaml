    \n17   interface Store {\n18     webmap: EsriMap;\n19     view: MapView;\n\n21\
    \     addToUI(params: UIParams): void;\n22   }\n\n24   @subclass(\"app.stores.AppStore\"\
    )\n25   class AppStore extends declared(Accessor) implements Store {\n\n27   \
    \  @property()\n28     webmap: EsriMap;\n\n30     @property()\n31     view: MapView;\n\
    \n33     addToUI({ element, position }: UIParams) {\n34       this.view.ui.add(element,\
    \ position);\n35     }\n\n37   }\n\n39   export default new AppStore();\n```\n\
    \n你在存储中有两个可观察的属性：`webmap` 和 `view`。你还添加了一个方法 `addToUI()`，它充当代理，为你将组件添加到 UI 中。另外，请注意你导出模块的方式：`export\
    \ default new AppStore();`。这将创建你的存储的单例，这样每次模块导入它时就不会创建新的存储。\n\n接下来你要做的是为你的自定义微件构建一个\
