    您将得到一个与图 5-4 相似的应用程序。


    ![A458961_1_En_5_Fig4_HTML.jpg](img/A458961_1_En_5_Fig4_HTML.jpg)


    图 5-4


    局部场景演示


    在此示例中，我们大量利用了自动类型转换功能，但让我们重点看看其中使用的几个三维专用模块。本演示将向您介绍几个新符号：`PointSymbol3D`、¹⁴ `IconSymbol3DLayer`、¹⁵
    和 `ObjectSymbol3DLayer`。¹⁶


    `PointSymbol3D` 符号的功能如其名称所示：允许您在三维 `SceneView` 中显示点数据。单独使用时，它功能有限，但另外两个符号正是为此而设计的。


    `IconSymbol3DLayer` 符号允许您定义可在三维环境中使用并覆盖在地表上的符号。每个符号都包含可在应用程序中使用的原始类型。`IconSymbol3DLayer`
    的原始类型列表如下。¹⁷ 您也可以向 `href` 属性提供 URL，以链接到您自己的符号。


    `ObjectSymbol3DLayer` 符号在三维环境中更进一步，允许您定义球体、圆柱体、立方体等形状。`ObjectSymbol3DLayer` 符号的原始类型已列出。¹⁸
    请注意，ArcGIS API for JavaScript 文档指出，如果您想使用自定义对象，需要通过教程在 ArcGIS Pro 中创建并导出它们。¹⁹

