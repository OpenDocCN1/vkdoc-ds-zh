    22           primitive: "circle"

    23         },

    24         size: 4

    25       }]

    26     }

    27   };


    29     const wellsDepthRenderer = {

    30      type: "simple",

    31      symbol: {

    32        type: "point-3d",

    33        symbolLayers: [{

    34          type: "object",

    35          resource: {

    36            primitive: "cylinder"

    37          },

    38          width: 50

    39        }]

    40      },

    41      visualVariables: [

