- fmt: '# Local Scenes


    Local scenes are an extremely useful tool for 3D visualizations. A local scene
    will allow you to view subsurface data in a 3D environment. You need two things
    when you want to create a local scene. You need to set the `SceneView#viewingMode`
    property and provide a `SceneView#clippingArea` property.


    ```

    1   const view = new SceneView({

    2     container: "viewDiv",

    3     map: map,

    4     viewingMode: "local",

    5     clippingArea: myClippingArea

    6   });

    ```


    A local scene allows you to flatten a 3D surface and clip it to a particular extent
    so you can view subsurface elements. This is currently useful to view wells, earthquake
    data, fracking data, and essentially any data that can be mapped underground.
    There isn’t really a straightforward method to display pipeline data at the moment.


    Here is a sample of how you might create a local scene to view some wells in a
    specific area. You can see a live demo here:[^(13)](#A458961_1_En_5_Chapter.html#Fn13)


    ```

    1   require([

    2     "esri/Map",

    3     "esri/views/SceneView",

    4     "esri/layers/FeatureLayer",

    5     "esri/widgets/Home"

    6   ], function(Map, SceneView, FeatureLayer, Home

    7   ) {


