    \ of a camera. You can update the camera at any time while your application is\
    \ running. If you do want to update the camera, you will probably want to use\
    \ the view’s `goTo` method to animate the view to the new camera settings. If\
    \ you simply use `view.camera = updatedCamera`, it will not be a smooth transition\
    \ to the new camera settings.\n\n```\nconst view = new SceneView({\n  map,\n \
    \ container: \"viewDiv\",\n  camera: {\n    position: [7.654, 45.919, 5183],\n\
