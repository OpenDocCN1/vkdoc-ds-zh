- fmt: "### Typings\n\nYou can read more about installing the ArcGIS API or JavaScript\
    \ typings on GitHub.[^(10)](#A458961_1_En_7_Chapter.html#Fn10) The key here is\
    \ that you can easily install the typings using `npm install --save @types/arcgis-js-api`.\n\
    \nIt should be noted that this does not install the Dojo typings. If you wanted\
    \ to use some Dojo modules in your TypeScript development, you can get `dojo-typings`[^(11)](#A458961_1_En_7_Chapter.html#Fn11)\
    \ and set them up in a `tsconfig.json` file like this:\n\n```\n1     \"types\"\
    : [ \"arcgis-js-api\" ],\n2     \"include\": [\n3       \"./src/app/**/*\"\n4\
    \     ],\n5     \"exclude\": [\n6       \"node_modules\"\n7     ],\n8     \"files\"\
    : [\n9       \"node_modules/dojo-typings/dojo/1.11/modules.d.ts\",\n10       \"\
    node_modules/dojo-typings/dijit/1.11/modules.d.ts\",\n11       \"node_modules/dojo-typings/dojox/1.11/modules.d.ts\"\
    ,\n12       \"node_modules/dojo-typings/custom/dgrid/1.1/dgrid.d.ts\",\n13   \
    \    \"node_modules/dojo-typings/custom/dstore/1.1/dstore.d.ts\",\n14       \"\
    node_modules/intern/typings/intern/intern.d.ts\"\n15     ]\n```\n\nYou can read\
    \ more about the `tsconfig.json` file.[^(12)](#A458961_1_En_7_Chapter.html#Fn12)\
    \ The `tsconfig.json` file is used to configure the TypeScript compiler.\n\n###\
    \ JSX\n\nThis updated widget framework also introduces the use of JSX,[^(13)](#A458961_1_En_7_Chapter.html#Fn13)\
    \ which was popularized by React.[^(14)](#A458961_1_En_7_Chapter.html#Fn14) JSX\
    \ looks very much like HTML in JavaScript, except the syntax needs a compilation\
    \ step to turn the JSX into JavaScript functions.\n\nFor example, the JSX `<h1>hello!</h1>`\
    \ would be compiled to a function that looks like `h('h1', 'hello!')`. This method\
    \ of creating DOM elements is called HyperScript.[^(15)](#A458961_1_En_7_Chapter.html#Fn15)\
    \ In the case of using JSX in custom widget development with the ArcGIS API for\
    \ JavaScript, you don’t need to concern yourself with HyperScript.\n\n## Building\
    \ a Custom Widget\n\nBefore diving right into building a custom widget, you can\
    \ find the source code for the demo application on GitHub (see Figure [7-1](#A458961_1_En_7_Chapter.html#Fig1)).[^(16)](#A458961_1_En_7_Chapter.html#Fn16)\n\
    \n![A458961_1_En_7_Fig1_HTML.jpg](A458961_1_En_7_Fig1_HTML.jpg)\n\nFigure 7-1\n\
    \nCustom widget development\n\nThe widget you will build in this example is going\
    \ to display a chart representing the data visible in the map view. The key is\
    \ to make sure the chart is based only on visible data so that it will update\
    \ as you pan around the map.\n\n### Store and ViewModel\n\nThe first step is to\
    \ build an application store. This application store will contain properties to\
    \ describe the state of your application. In this application, you are concerned\
    \ about the `View` and the `WebMap`. You can refer to the early chapters for information\
    \ on how to use the `Accessor` module[^(17)](#A458961_1_En_7_Chapter.html#Fn17)\
    \ for a task like this.\n\nFor each TypeScript file that extends `Accessor`, you\
    \ will want to add the following `amd-dependency` lines:\n\n```\n1   /// \n3 \
    \  /// \n```\n\nI’ll omit them from the following samples, but be aware that they\
    \ are required.\n\n```\n1   // app/stores/app.ts\n2   import EsriMap = require(\"\
    esri/Map\");\n3   import MapView = require(\"esri/views/MapView\");\n4   import\
    \ Accessor = require(\"esri/core/Accessor\");\n\n6   import {\n7     subclass,\n\
    8     declared,\n9     property\n10     } from \"esri/core/accessorSupport/decorators\"\
    ;\n\n12   type UIParams = {\n13     element: any,\n14     position?: string\n\
    15   };\n\n17   interface Store {\n18     webmap: EsriMap;\n19     view: MapView;\n\
    \n21     addToUI(params: UIParams): void;\n22   }\n\n24   @subclass(\"app.stores.AppStore\"\
    )\n25   class AppStore extends declared(Accessor) implements Store {\n\n27   \
    \  @property()\n28     webmap: EsriMap;\n\n30     @property()\n31     view: MapView;\n\
    \n33     addToUI({ element, position }: UIParams) {\n34       this.view.ui.add(element,\
    \ position);\n35     }\n\n37   }\n\n39   export default new AppStore();\n```\n\
    \nYou have two properties on the store that are watchable, `webmap` and `view`.\
    \ You also add a method, `addToUI()`, that acts as a proxy to add components to\
    \ the UI for you. Also, notice how you export the module: `export default new\
    \ AppStore();`. This will create a singleton of your store so a new store is not\
    \ created every time a module imports it.\n\nThe next thing you are going to do\
    \ is build a `ViewModel` for your custom widget. The `ViewModel` behaves very\
    \ much like the application store. It will be the job of the `ViewModel` to watch\
    \ for changes to the application store and update its own state based on those\
    \ changes. It is also the job of the `ViewModel` to manage the business logic\
    \ of the widget by performing any queries or operations on data based on the application\
    \ store.\n\n```\n1   // app/widgets/viewmodels/summaryviewmodel.ts\n\n3   import\
    \ Accessor = require(\"esri/core/Accessor\");\n4   import watchUtils = require(\"\
    esri/core/watchUtils\");\n\n6   import FeatureLayerView = require(\"esri/views/layers/FeatureLayerView\"\
    );\n7   import Graphic = require(\"esri/Graphic\");\n\n9   import Query = require(\"\
    esri/tasks/support/Query\");\n\n11   import {\n12     subclass,\n13     declared,\n\
    14     property\n15     } from \"esri/core/accessorSupport/decorators\";\n\n17\
    \   import store from \"../../stores/app\";\n\n19   const { init, whenOnce, whenFalse\
    \ } = watchUtils;\n\n21   export type Stats = {\n22     \"Carcinogen\": number,\n\
    23     \"PBT\": number,\n24     \"Non-PBT\": number,\n25     \"Metal\": number\n\
    26   };\n\n28   const stats: Stats = {\n29     \"Carcinogen\": 0, // CARCINOGEN\
    \ == \"Yes\"\n30     \"PBT\": 0,        // CLASS == \"PBT\"\n31     \"Non-PBT\"\
    : 0,    // CLASS == \"Non-PBT\"\n32     \"Metal\": 0       // METAL == \"Yes\"\
    \n33   };\n\n35   function errorHandler (error: Error) {\n36     console.log(\"\
    LayerView Query Error\", error);\n37   }\n\n39   @subclass(\"app.widgets.viewmodels.summaryviewmodel\"\
    )\n40   class SummaryViewModel extends declared(Accessor) {\n\n42     @property()\n\
    43     count: number = 0;\n\n45     @property()\n46     stats: Stats = stats;\n\
    \n48     constructor() {\n49       super();\n50       whenOnce(store, \"view\"\
    ).then(_ => {\n51         return store.webmap.findLayerById(\"tri\");\n52    \
    \   })\n53       .then(layer => {\n54         return store.view.whenLayerView(layer);\n\
    55       })\n56       .then(this.watchLayerView.bind(this))\n57       .otherwise(errorHandler);\n\
    58     }\n```"
