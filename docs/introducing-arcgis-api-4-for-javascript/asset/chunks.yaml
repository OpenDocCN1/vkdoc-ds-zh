    CameraRecorder class creates a `CameraRecorder` widget . This class will watch
    for the `camera` property of the `SceneView` to change, and when it does, it will
    clone the camera and save the cloned cameras into an array for later use. It has
    buttons to replay the cameras, replay them in reverse, or pause the watchers from
    saving the camera changes. It also provides a slider so that you can play back
    to a certain `Camera` point again. This small application shows the usefulness
    of having access to a `Camera` in the `SceneView` so that not only can you save
    a snapshot of the `SceneView` but also manipulate the `Camera` as needed.


    ### environment Property


    What does the `environment` property do? Notice all the really cool shadows cast
    by the buildings and objects in a 3D scene? That is controlled via the `environment`
    property. More specifically, it is handled via the `lighting` [^(11)](#A458961_1_En_5_Chapter.html#Fn11)
    property of the environment.


    Essentially, this allows you to control the position of the sun in your scene.
    Not only that, but you can define it by the date and time of day. Did you know
    that the locations of the stars in a scene are accurate to the date? That’s a
    pretty powerful detail.


    Most of the `lighting` properties are fairly straightforward; `date` and `displayUTCOffset`
    are pretty self-explanatory. The `directShadowsEnabled` property just turns the
    shadows on or off. The one that may throw you for a loop is `ambientOcclusionEnabled`.[^(12)](#A458961_1_En_5_Chapter.html#Fn12)
    This is basically how light is reflected off surfaces. The `ambientOcclusionEnabled`
    property is disabled on lower-powered devices, such as mobile phones for performance
    purposes (see Figure [5-3](#A458961_1_En_5_Chapter.html#Fig3)).


    ![A458961_1_En_5_Fig3_HTML.jpg](A458961_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Updated environment settings in a scene'
