    \n# 4. API 核心基础\n\n在 ArcGIS API 4 for JavaScript 中，有少数几个基本概念构成了 API 的构建方式。如果您熟悉这些核心概念，那么在使用\
    \ API 时将会受益匪浅。\n"
- fmt: "# Accessors\n\nAn important addition to the ArcGIS API for JavaScript is the\
    \ `Accessor`[¹](#A458961_1_En_4_Chapter.html#Fn1) module. It is located at `esri/core/Accessor`,\
    \ which should tell you that it is a core part of the API. This is no mistake\
    \ because most of the API is built on `Accessor`s and their capabilities.\n\n\
    The `Accessor` module is loosely based on ES5 getters/setters[²](#A458961_1_En_4_Chapter.html#Fn2)\
    \ via the `Object.defineProperty`[³](#A458961_1_En_4_Chapter.html#Fn3) method.\n\
    \n## Watching for Property Changes\n\nWhat makes an `Accessor` interesting is\
    \ that instead of listening for events to find out when changes have occurred\
    \ on an object, you can simply watch for changes on the properties themselves.\n\
    \n```\n// watching for events\nwidget.on(\"value-change\", (val) => {\n    console.log(val);\n\
    });\n\n// new method\nwidget.watch(\"value\", (val) => {\n    console.log(val);\n\
    })\n```\n\nThis also opens up the opportunity to watch for any value to change,\
    \ not just changes that have events assigned to them. This is similar to how `dojo/Stateful`[⁴](#A458961_1_En_4_Chapter.html#Fn4)\
    \ works, except you don’t need to use `get/set` methods.\n\n```\n// dojo/stateful\n\
    widget.set(\"value\", newValue);\n\n// Accessor\nwidget.value = newValue;\n```\n\
    \nYou can, however, still use the `set` method to set deep properties of an `Accessor`.\n\
    \n```\n// update the property \"view.map.basemap.title\"\nview.set(\"map.basemap.title\"\
    , newTitle);\n```\n\nOr you can set multiple properties at once.\n\n```\n// update\
    \ the property \"view.map.basemap.title\"\nview.set({\n  constraints: {\n    minScale:\
    \ 250000,\n    maxScale: 0\n  },\n  rotation: 45\n});\n```\n\nYou also have the\
    \ ability to watch for nested property changes.\n\n```\n// update the property\
    \ \"view.map.basemap.title\"\nview.watch(\"map.basemap.title\", (newValue) =>\
    \ /*handle result*/);\n```\n\nEvery method returns a `WatchHandle`,[⁵](#A458961_1_En_4_Chapter.html#Fn5)\
    \ so you can stop listening to property changes via a `remove` method.\n\n```\n\
    // update the property \"view.map.basemap.title\"\nconst handler = view.watch(\"\
    map.basemap.title\", (newValue) => /*handle result*/);\n// at some point in the\
    \ application remove the handler\nfunction cleanup() {\n  handler.remove();\n\
    }\n```\n\nThere is another great feature of being able to watch for property changes,\
    \ which is the ability to watch for multiple properties to change.\n\n```\nimport\
    \ Map from \"esri/Map\";\nimport MapView from \"esri/views/MapView\";\n\nconst\
    \ map = new Map({\n  basemap: \"streets\"\n});\n\nconst view = new MapView({\n\
    \  container: \"viewDiv\",\n  map: map,\n  zoom: 4,\n  center: [15, 65]\n});\n\
    \nview.watch(\"center, scale\", (value, oldValue, propertyName) => {\n  if (propertyName\
    \ === \"center\") {\n    // Print the x & y of center\n    console.log(value.x,\
    \ value.y);\n  } else {\n    // Print the scale value\n    console.log(value);\n\
    \  }\n});\n```\n\nIn this case, you’re watching for both the `center` and `scale`\
    \ properties of the view to change. When these changes occur, you just need to\
    \ decide how to handle them. For this demo, you’ll just print the results to the\
    \ developer console. The flexibility of being able to watch for property changes\
    \ in your application is a testament to the power that `Accessor`s bring to the\
    \ API.\n\nBecause the ability to watch for property changes is core to the API,\
    \ there is a utility module provided to help you do that. You can find this utility\
    \ in `esri/core/watchUtils`.[⁶](#A458961_1_En_4_Chapter.html#Fn6) This comes in\
    \ handy if you find yourself doing some conditional checks when watching for a\
    \ property change.\n\n```\nview.watch(\"stationary\", (value) => {\n  if (value)\
    \ {\n    // do something when only true\n  }\n});\n```\n\nThat adds some cognitive\
    \ overload, at least for me, that I would like to avoid. I only care about when\
    \ the value is true, so I can use a utility for that.\n\n```\nwatchUtils.whenTrue(view,\
    \ \"stationary\", () => {\n  // do something\n});\n```\n\nLet’s look at a sample\
    \ that will do a count of the number of points on the screen as you interact with\
    \ the map.\n\nHere is some sample code that shows how you might accomplish this:\n\
    \n```\nimport Map from \"esri/Map\";\nimport FeatureLayer from \"esri/layers/FeatureLayer\"\
    ;\nimport watchUtils from \"esri/core/watchUtils\";\nimport SceneView from \"\
    esri/views/SceneView\";\nimport QueryTask from \"esri/tasks/QueryTask\";\nimport\
    \ Query from \"esri/tasks/supports/Query\";\n\nconst url = \"http://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/US\\\
    \nA_Major_Cities/FeatureServer/0\";\nconst map = new Map({\n    basemap: \"streets\"\
    ,\n    layers: [ new FeatureLayer({ url }) ]\n}):\nconst query = new Query();\n\
    const queryTask = new QueryTask({ url });\nconst view = new SceneView({\n    container:\
    \ \"map\",\n    map: map,\n    center: [-118.182, 33.913],\n    scale: 836023\n\
    });\n\nquery.watch(\"geometry\", () =>{\n    qTask.executeForCount(query).then((count)\
    \ =>{\n        document.getElementById(\"cityCount\").innerText = count;\n   \
    \ });\n});\n\nview.then(() =>{\n    watchUtils.whenTrue(view, \"stationary\",\
    \ () =>{\n        query.geometry = view.extent;\n    });\n    watchUtils.whenFalse(view,\
    \ \"stationary\", () =>{\n        document.getElementById(\"cityCount\").innerText\
    \ = \"...\";\n    });\n});\n```"
  raw: '## Accessors


    An important addition to the ArcGIS API for JavaScript is the Accessor[¹](#A458961_1_En_4_Chapter.html#Fn1)
    module. It is located at `esri/core/Accessor`, which should tell you that it is
    a core part of the API. This is no mistake because most of the API is built on
    Accessors and their capabilities.


    The Accessor module is loosely based on ES5 getters/setters[²](#A458961_1_En_4_Chapter.html#Fn2)
    via the `Object.defineProperty` [³](#A458961_1_En_4_Chapter.html#Fn3) method .


    ### Watching for Property Changes


    What makes an Accessor interesting is that instead of listening for events to
    find out when changes have occurred on an object, you can simply watch for changes
    on the properties themselves.


    ```

    1   // watching for events

    2   widget.on("value-change", (val) => {

    3       console.log(val);

    4   });


    6   // new method

    7   widget.watch("value", (val) => {

    8       console.log(val);

    9   })

    ```


    This also opens up the opportunity to watch for any value to change, not just
    changes that have events assigned to them. This is similar to how `dojo/Stateful`
    [⁴](#A458961_1_En_4_Chapter.html#Fn4) works, except you don’t need to use `get/set`
    methods.


    ```

    1   // dojo/stateful

    2   widget.set("value", newValue);


    4   // Accessor

    5   widget.value = newValue;

    ```


    You can, however, still use the `set` method to set deep properties of an Accessor.


    ```

    1   // update the property "view.map.basemap.title"

    2   view.set("map.basemap.title", newTitle);

    ```


    Or you can set multiple properties at once.


    ```

    1   // update the property "view.map.basemap.title"

    2   view.set({

    3     constraints: {

    4       minScale: 250000,

    5       maxScale: 0

    6     },

    7     rotation: 45

    8   });

    ```


    You also have the ability to watch for nested property changes.


    ```

    1   // update the property "view.map.basemap.title"

    2   view.watch("map.basemap.title", (newValue) => /*handle result*/);

    ```


    Every method returns a `WatchHandle`,[⁵](#A458961_1_En_4_Chapter.html#Fn5) so
    you can stop listening to property changes via a `remove` method.


    ```

    1   // update the property "view.map.basemap.title"

    2   const handler = view.watch("map.basemap.title", (newValue) => /*handle result*/);

    3   // at some point in the application remove the handler

    4   function cleanup() {

    5     handler.remove();

    6   }

    ```


    There is another great feature of being able to watch for property changes, which
    is the ability to watch for multiple properties to change.


    ```

    1   import Map from "esri/Map";

    2   import MapView from "esri/views/MapView";


    4   const map = new Map({

    5     basemap: "streets"

    6   });


    8   const view = new MapView({

    9     container: "viewDiv",

    10     map: map,

    11     zoom: 4,

    12     center: [15, 65]

    13   });


    15   view.watch("center, scale", (value, oldValue, propertyName) => {

    16     if (propertyName === "center") {

    17       // Print the x & y of center

    18       console.log(value.x, value.y);

    19     } else {

    20       // Print the scale value

    21       console.log(value);

    22     }

    23   });

    ```


    In this case, you’re watching for both the `center` and `scale` properties of
    the view to change. When these changes occur, you just need to decide how to handle
    them. For this demo, you’ll just print the results to the developer console. The
    flexibility of being able to watch for property changes in your application is
    a testament to the power that Accessors bring to the API.


    Because the ability to watch for property changes is core to the API, there is
    a utility module provided to help you do that. You can find this utility in `esri/core/watchUtils`.[⁶](#A458961_1_En_4_Chapter.html#Fn6)
    This comes in handy if you find yourself doing some conditional checks when watching
    for a property change.


    ```

    1   view.watch("stationary", (value) => {

    2     if (value) {

    3       // do something when only true

    4     }

    5   });

    ```


    That adds some cognitive overload, at least for me, that I would like to avoid.
    I only care about when the value is true, so I can use a utility for that.


    ```

    1   watchUtils.whenTrue(view, "stationary", () => {

    2     // do something

    3   });

    ```


    Let’s look at a sample that will do a count of the number of points on the screen
    as you interact with the map.


    Here is some sample code that shows how you might accomplish this:


    ```

    1   import Map from "esri/Map";

    2   import FeatureLayer from "esri/layers/FeatureLayer";

    3   import watchUtils from "esri/core/watchUtils";

    4   import SceneView from "esri/views/SceneView";

    5   import QueryTask from "esri/tasks/QueryTask";

    6   import Query from "esri/tasks/supports/Query";


    8   const url = "http://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/US\

    9   A_Major_Cities/FeatureServer/0";

    10   const map = new Map({

    11       basemap: "streets",

    12       layers: [ new FeatureLayer({ url }) ]

    13   }):

    14   const query = new Query();

    15   const queryTask = new QueryTask({ url });

    16   const view = new SceneView({

    17       container: "map",

    18       map: map,

    19       center: [-118.182, 33.913],

    20       scale: 836023

    21   });


    23   query.watch("geometry", () =>{

    24       qTask.executeForCount(query).then((count) =>{

    25           document.getElementById("cityCount").innerText = count;

    26       });

    27   });


    29   view.then(() =>{

    30       watchUtils.whenTrue(view, "stationary", () =>{

    31           query.geometry = view.extent;

    32       });

    33       watchUtils.whenFalse(view, "stationary", () =>{

    34           document.getElementById("cityCount").innerText = "...";

    35       });

    36   });

    ```'
  trans: "\n# 访问器\n\nArcGIS API for JavaScript 的一个重要新增功能是 `Accessor`¹ 模块。它位于 `esri/core/Accessor`，这足以说明它是该\
    \ API 的核心部分。这并非偶然，因为该 API 的大部分功能都构建在 `Accessor` 及其能力之上。\n\n`Accessor` 模块大致基于通过\
    \ `Object.defineProperty`³ 方法实现的 ES5 getter/setter²。\n\n## 监听属性变化\n\n`Accessor`\
    \ 的有趣之处在于，你无需监听事件来了解对象何时发生了变化，而只需直接监听属性本身的变化即可。\n\n```\n// 监听事件\nwidget.on(\"\
    value-change\", (val) => {\n    console.log(val);\n});\n\n// 新方法\nwidget.watch(\"\
    value\", (val) => {\n    console.log(val);\n})\n```\n\n这也开启了监听任何值变化的能力，而不仅仅是那些分配了事件的变化。这与\
    \ `dojo/Stateful`⁴ 的工作方式类似，区别在于你无需使用 `get/set` 方法。\n\n```\n// dojo/stateful\n\
    widget.set(\"value\", newValue);\n\n// Accessor\nwidget.value = newValue;\n```\n\
    \n不过，你仍然可以使用 `set` 方法来设置 `Accessor` 的深层属性。\n\n```\n// 更新属性 \"view.map.basemap.title\"\
    \nview.set(\"map.basemap.title\", newTitle);\n```\n\n或者，你也可以一次性设置多个属性。\n\n```\n\
    // 更新属性 \"view.map.basemap.title\"\nview.set({\n  constraints: {\n    minScale:\
    \ 250000,\n    maxScale: 0\n  },\n  rotation: 45\n});\n```\n\n你还可以监听嵌套属性的变化。\n\
    \n```\n// 更新属性 \"view.map.basemap.title\"\nview.watch(\"map.basemap.title\", (newValue)\
    \ => /*处理结果*/);\n```\n\n每个方法都会返回一个 `WatchHandle`⁵，因此你可以通过 `remove` 方法停止监听属性变化。\n\
    \n```\n// 更新属性 \"view.map.basemap.title\"\nconst handler = view.watch(\"map.basemap.title\"\
    , (newValue) => /*处理结果*/);\n// 在应用程序的某个时刻移除该处理器\nfunction cleanup() {\n  handler.remove();\n\
    }\n```\n\n监听属性变化还有另一个很棒的特性，那就是能够同时监听多个属性的变化。\n\n```\nimport Map from \"esri/Map\"\
    ;\nimport MapView from \"esri/views/MapView\";\n\nconst map = new Map({\n  basemap:\
    \ \"streets\"\n});\n\nconst view = new MapView({\n  container: \"viewDiv\",\n\
    \  map: map,\n  zoom: 4,\n  center: [15, 65]\n});\n\nview.watch(\"center, scale\"\
    , (value, oldValue, propertyName) => {\n  if (propertyName === \"center\") {\n\
    \    // 打印 center 的 x 和 y 值\n    console.log(value.x, value.y);\n  } else {\n\
    \    // 打印 scale 值\n    console.log(value);\n  }\n});\n```\n\n在这个例子中，你同时监听了视图的\
    \ `center` 和 `scale` 属性。当这些属性发生变化时，你只需决定如何处理它们。在这个演示中，你只需将结果打印到开发者控制台。在你的应用程序中能够灵活地监听属性变化，这充分证明了\
    \ `Accessor` 为 API 带来的强大功能。\n\n由于监听属性变化的能力是 API 的核心功能，因此提供了一个实用模块来帮助你实现这一点。你可以在\
    \ `esri/core/watchUtils`⁶ 中找到这个实用工具。如果你发现在监听属性变化时需要进行一些条件检查，这个工具会非常有用。\n\n```\n\
    view.watch(\"stationary\", (value) => {\n  if (value) {\n    // 仅在值为 true 时执行某些操作\n\
    \  }\n});\n```\n\n这增加了一些认知负担，至少对我来说是这样，我想避免这种情况。我只关心值何时为 true，因此我可以使用一个实用工具来实现这一点。\n\
    \n```\nwatchUtils.whenTrue(view, \"stationary\", () => {\n  // 执行某些操作\n});\n```\n\
    \n让我们看一个示例，该示例会在你与地图交互时统计屏幕上的点数。\n\n以下是一些示例代码，展示了如何实现这一点：\n\n```\nimport Map from\
    \ \"esri/Map\";\nimport FeatureLayer from \"esri/layers/FeatureLayer\";\nimport\
    \ watchUtils from \"esri/core/watchUtils\";\nimport SceneView from \"esri/views/SceneView\"\
    ;\nimport QueryTask from \"esri/tasks/QueryTask\";\nimport Query from \"esri/tasks/supports/Query\"\
    ;\n\nconst url = \"http://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/US\\\
    \nA_Major_Cities/FeatureServer/0\";\nconst map = new Map({\n    basemap: \"streets\"\
    ,\n    layers: [ new FeatureLayer({ url }) ]\n}):\nconst query = new Query();\n\
    const queryTask = new QueryTask({ url });\nconst view = new SceneView({\n    container:\
    \ \"map\",\n    map: map,\n    center: [-118.182, 33.913],\n    scale: 836023\n\
    });\n\nquery.watch(\"geometry\", () =>{\n    qTask.executeForCount(query).then((count)\
    \ =>{\n        document.getElementById(\"cityCount\").innerText = count;\n   \
    \ });\n});\n\nview.then(() =>{\n    watchUtils.whenTrue(view, \"stationary\",\
    \ () =>{\n        query.geometry = view.extent;\n    });\n    watchUtils.whenFalse(view,\
    \ \"stationary\", () =>{\n        document.getElementById(\"cityCount\").innerText\
    \ = \"...\";\n    });\n});\n```\n"
- fmt: "### `watchUtils`\n\n正如我们所看到的，监听属性变化在 API 中非常有用。由于在监听属性时，你的具体需求可能因应用程序而异，因此有一个名为`watchUtils`的辅助工具可供使用。[⁷](#A458961_1_En_4_Chapter.html#Fn7)\n\
    \n让我们来看几个更有趣的方法：\n\n- `watchUtils.init()`：当你需要获取属性的初始值时，这个工具会派上用场。请记住，当你监听属性变化时，只有在属性实际发生变化时你才会收到通知。这意味着，除非你使用此工具来监听变化并同时获取初始值，否则你将无法知道许多属性的初始值。\n\
    \n    ```\n    1   watchUtils.init(view, \"stationary\", (value, oldValue) =>\
    \ console.log(`New/Initia\\\n    2   l value is \"${value}\" and Old value is\
    \ \"${oldValue}\"`));\n    ```\n\n    这将为你提供属性的初始值（即默认值），以及像常规监听器一样的所有未来更新。如果你需要初始值来启动应用程序中的某个操作或在页面上显示一个值，但又不想等待值发生变化，这将非常有用。\n\
    \n- `watchUtils.once()`：顾名思义，当你只关心监听一次属性变化时，这个监听方法非常有用。它也是返回`PromiseWatchHandle`的监听辅助方法的一个子集。[⁸](#A458961_1_En_4_Chapter.html#Fn8)\
    \ 这意味着你可以像对待任何 Promise 一样对待这个监听器，甚至可以在应用程序中链式调用此监听器的结果。\n\n    ```\n    1   watchUtils.once(view,\
    \ \"camera\").then(({ value, oldValue, propertyName, target })\\\n    2     =>\
    \ {\n    3      return geometryEngineAsync.union([oldValue.position, value.position]);\n\
    \    4   }).then(positionMultiPoints =>  {\n    5     // store or continue using\
    \ unioned points\n    6   });\n    ```\n\n    如你所见，某些监听辅助方法能够返回 Promise 是非常有用的。\n\
    \n- `watchUtils.pausable()`：我非常喜欢这个小工具。顾名思义，这是一个你可以暂停，然后根据需要恢复的监听器。\n\n    ```\n\
    \    1   const handler = watchUtils.pausable(view, \"center\", updateComponentMethod);\n\
    \    2   // resize component, no need to update during animated resize\n    3\
    \   handler.pause();\n    4   // resize of component is done, resume updates\n\
    \    5   handler.resume();\n    ```\n\n    通过这个小示例，我可能有一个自定义组件，它会随着视图的`center`属性变化而更新。但是，我可能为调整此组件的大小或将其停靠到一个不完全可见的工具栏设置了动画。关键在于，我只想暂停此组件的更新，以便调用`handler.pause()`。然后，当组件处于我希望继续更新的状态时，我可以调用`handler.resume()`。我发现这个`pausable()`辅助方法是`watchUtils`辅助工具中最有用的一个。\n\
    \n我建议你查阅文档[⁹](#A458961_1_En_4_Chapter.html#Fn9)，并在监听属性变化时遇到特殊情况时，记住这些辅助工具。\n\n\
    ## 自动转换（Autocasting）\n\n使用 Accessor 的另一个强大特性是，你可以定义能够自动转换为某个类或模块的属性。这允许你传入看起来像某种类型的数据，并将其转换为该类型。\n\
    \n```\n1   import Accessor from \"esri/core/Accessor\";\n2   import Extent from\
    \ \"esri/geometry/Extent\";\n\n4   const Model = Accessor.createSubclass({\n5\
    \     properties: {\n6       extent: Extent\n7     }\n8   });\n\n10   export default\
    \ Model;\n```\n\n现在，你可以将一个类似`extent`的对象传递给这个 Accessor，它会被转换成一个真正的`Extent`对象。\n\
    \n```\n1   const model = new Model({\n2     extent: {\n3       xmin: -122.68,\n\
    4       ymin: 45.53,\n5       xmax: -122.45,\n6       ymax: 45.6\n7     }\n8 \
    \  });\n\n10   model.watch(\"extent\", (val) => console.log(val));\n```\n\n如你所见，这使得构建模块和类变得非常容易，这些模块和类允许你传入简单的数据对象，这些对象可以自动转换为更复杂的对象。\n\
    \n自动转换在 API 中变得非常有用，以至于你甚至可能忘记它的存在。一个很好的例子是当你创建一个`WebMap`时。\n\n```\n1   const\
    \ webmap = new WebMap({\n2     portalItem: {\n3       id: \"e691172598f04ea8881cd2a4adaa45ba\"\
    \n4     }\n5   });\n\n7   const view = new MapView({\n8     map: webmap,  //the\
    \ WebMap instance created above\n9     container: \"viewDiv\"\n10   });\n```\n\
    \n`WebMap`在第 [3](#A458961_1_En_3_Chapter.html) 章中有详细介绍。但在这个例子中，你只是将一个`PortalItem`的`id`值传递给了`WebMap`的构造函数。在内部，`WebMap`知道`portalItem`属性的类型是`PortalItem`。因此，通过传入一个具有`PortalItem`所需最小属性的对象，`WebMap`可以将该对象自动转换为正确的实例。\n\
    \n如果你一直在使用 3.x 版本的 API，那么简单地监听属性变化而不是监听事件发生可能是一个新概念，但我希望你能看到在 4.x 版本的 API 中监听属性变化的简单性和灵活性，并从使用此功能中获得一些真正的好处。\n\
    \n## 扩展 Accessor\n\n从 ArcGIS API for JavaScript 的 4.2 版本开始，Accessor 文档现在包含了“实现\
    \ Accessor”部分。[^(10)](#A458961_1_En_4_Chapter.html#Fn10) 该部分内容相当详尽，因此我们不重复其内容，而是来看几个基础点。\n\
    \n你已经看到了如何使用`Accessor.createSubclass()`自己实现一个 Accessor。关键在于提供一个`properties`对象，该对象将包含有关你实现的信息。你已经看到了如何预定义属性的类型。\n\
    \n```\n1   const Model = Accessor.createSubclass({\n2     properties: {\n3   \
    \    extent: Extent\n4     }\n5   });\n```\n\n但你还可以更进一步，拥有一些计算属性。\n\n```\n1  \
    \ const Model = Accessor.createSubclass({\n2     properties: {\n3       graphic:\
    \ new Graphic(/* Graphic Properties */),\n4       bufferedGeometry: {\n5     \
    \    dependsOn: [\"graphic\"],\n6         get: function() {\n7           return\
    \ geometryEngine.buffer(this.graphic.geometry);\n8         }\n9       }\n10  \
    \   }\n11   });\n```\n\n在这个示例中，你想要一个基于`graphic`值的`bufferedGeometry`属性。在这种情况下，我不希望我的`Model`的用户在他们那边使用`GeometryEngine`，所以我可以简化它并为他们提供这个值。\n\
    \n### TypeScript 集成\n\nAPI 的 4.2 版本还引入了改进的 TypeScript 集成，用于使用 Accessors。这种改进的集成还附带了一组装饰器[^(11)](#A458961_1_En_4_Chapter.html#Fn11)，简化了实现过程。\n\
    \n这意味着你可以将之前的示例更新为如下所示：\n\n```\n1   /// \n3   /// \n\n5   import { declared, subclass,\
    \ property } from \"esri/core/accessorSupport/decorators\";\n\n7   @subclass()\n\
    8   class Model extends declared(Accessor) {\n\n10     @property()\n11     graphic:\
    \ Graphic = new Graphic();\n\n13     @property({\n14       dependsOn: [\"graphic]\n\
    15     })\n16     get bufferedGeometry(): Geometry {\n17       return geometryEngine.buffer(this.graphic.geometry);\n\
    18     }\n\n20   }\n```\n\n这些装饰器非常有用，可以使实现 Accessor[^(12)](#A458961_1_En_4_Chapter.html#Fn12)\
    \ 和定义属性更加明确。你可以查阅装饰器文档以获取更多详细信息。[^(13)](#A458961_1_En_4_Chapter.html#Fn13)"
  raw: "### watchUtils\n\nAs we have seen, watching for property changes is extremely\
    \ useful in the API. Because your specific needs while watching for properties\
    \ may differ based on your application needs, there is a helper you can use called\
    \ `watchUtils.` [⁷](#A458961_1_En_4_Chapter.html#Fn7)\n\nLet’s look at a few of\
    \ the more interesting ones:\n\n*   `watchUtils.init()`: This is a utility that\
    \ can come in handy when you need to grab the initial values of a property. Remember,\
    \ when you are watching for property changes , you won’t get notified until the\
    \ property actually changes. This means you won’t know what the initial values\
    \ for many properties are unless you use this utility to watch for changes, plus\
    \ get the initial value.\n\n    ```\n    1   watchUtils.init(view, \"stationary\"\
    , (value, oldValue) => console.log(`New/Initia\\\n    2   l value is \"${value}\"\
    \ and Old value is \"${oldValue}\"`));\n    ```\n\n    This will give you the\
    \ initial value of the property, which is the default value, and all future updates\
    \ like a regular watcher would. This is useful if you need the initial value to\
    \ kick off an action in your application or display a value on the page but don’t\
    \ want to wait for the value to change.\n*   `watchUtils.once()`: As the name\
    \ implies, this watch method is useful if you only care about watching for property\
    \ changes once. This is also a subset of the watch helper methods that return\
    \ a `PromiseWatchHandle`.[⁸](#A458961_1_En_4_Chapter.html#Fn8) This means you\
    \ can treat this watcher like any promise and even chain the results of this watcher\
    \ in your application.\n\n    ```\n    1   watchUtils.once(view, \"camera\").then(({\
    \ value, oldValue, propertyName, target })\\\n    2     => {\n    3      return\
    \ geometryEngineAsync.union([oldValue.position, value.position]);\n    4   }).then(positionMultiPoints\
    \ =>  {\n    5     // store or continue using unioned points\n    6   });\n  \
    \  ```\n\n    As you can see, the ability to have a promise for certain watch\
    \ helpers can be useful.\n*   `watchUtils.pausable()`: I’m a big fan of this little\
    \ helper. As the name advertises, this is a watcher you can pause and then simply\
    \ resume as needed.\n\n    ```\n    1   const handler = watchUtils.pausable(view,\
    \ \"center\", updateComponentMethod);\n    2   // resize component, no need to\
    \ update during animated resize\n    3   handler.pause();\n    4   // resize of\
    \ component is done, resume updates\n    5   handler.resume();\n    ```\n\n  \
    \  With this little sample, I may have a custom component that is updated as the\
    \ `center` property of the view changes . However, I may have some animation set\
    \ up for resizing this component or maybe docking it into a toolbar where it’s\
    \ not completely visible. The point is that I simply want to pause the updates\
    \ for this component so I can call `handler.pause()`. Then when the component\
    \ is in a state where I want the updates to continue, I can call `handler.resume()`.\
    \ I have found this `pausable()` helper to be one of the most useful of the `watchUtils`\
    \ helpers.\n\nI recommend looking through the documentation[⁹](#A458961_1_En_4_Chapter.html#Fn9)\
    \ and just keeping these helpers in mind when you come across an odd situation\
    \ while watching for property changes.\n\n## Autocasting\n\nAnother powerful feature\
    \ of using an Accessor is that you can define properties that can be autocast\
    \ to a class or module. This allows you to pass data that looks like a certain\
    \ type and have it converted to that type.\n\n```\n1   import Accessor from \"\
    esri/core/Accessor\";\n2   import Extent from \"esri/geometry/Extent\";\n\n4 \
    \  const Model = Accessor.createSubclass({\n5     properties: {\n6       extent:\
    \ Extent\n7     }\n8   });\n\n10   export default Model;\n```\n\nNow you can pass\
    \ an `extent`-like object to this Accessor and have it turned into a real extent.\n\
    \n```\n1   const model = new Model({\n2     extent: {\n3       xmin: -122.68,\n\
    4       ymin: 45.53,\n5       xmax: -122.45,\n6       ymax: 45.6\n7     }\n8 \
    \  });\n\n10   model.watch(\"extent\", (val) => console.log(val));\n```\n\nAs\
    \ you can see, this makes it pretty easy to build up modules and classes that\
    \ allow you to pass simple data objects that can autocast to more complex objects.\n\
    \nAutocasting becomes so useful in the API that you may even forget that it’s\
    \ there. A great example is when you create a `WebMap`.\n\n```\n1   const webmap\
    \ = new WebMap({\n2     portalItem: {\n3       id: \"e691172598f04ea8881cd2a4adaa45ba\"\
    \n4     }\n5   });\n\n7   const view = new MapView({\n8     map: webmap,  //the\
    \ WebMap instance created above\n9     container: \"viewDiv\"\n10   });\n```\n\
    \n`WebMap`s are covered in Chapter [3](#A458961_1_En_3_Chapter.html). But in this\
    \ case, you are simply passing the `id` value of a `PortalItem` to the constructor\
    \ of a `WebMap`. Internally, the `WebMap` knows that the property `portalItem`\
    \ is of the type `PortalItem`. So, by passing an object that has the minimum properties\
    \ required for a `PortalItem`, the `WebMap` can autocast that object to the correct\
    \ instance.\n\nThe ability to simply watch for when a property changes instead\
    \ of listening for events to occur is something of a new concept if you’ve been\
    \ using the 3.x version of the API, but I hope you can see the simplicity and\
    \ flexibility of watching for property changes in the 4.x version of the API and\
    \ gain some real benefits from using this feature.\n\n## Extending Accessor\n\n\
    As of version 4.2 of the ArcGIS API for JavaScript, the Accessor documentation\
    \ now includes the section “Implementing Accessor.”[^(10)](#A458961_1_En_4_Chapter.html#Fn10)\
    \ The section is pretty extensive, so without regurgitating what it provides,\
    \ let’s look at a couple of basics.\n\nYou have already seen how to implement\
    \ an Accessor on your own using `Accessor.createSubclass()` . The key here is\
    \ to provide a `properties` object that will contain information about your implementation.\
    \ You have already seen how you can predefine the types of properties.\n\n```\n\
    1   const Model = Accessor.createSubclass({\n2     properties: {\n3       extent:\
    \ Extent\n4     }\n5   });\n```\n\nBut you can take this a step further and have\
    \ some computed properties.\n\n```\n1   const Model = Accessor.createSubclass({\n\
    2     properties: {\n3       graphic: new Graphic(/* Graphic Properties */),\n\
    4       bufferedGeometry: {\n5         dependsOn: [\"graphic\"],\n6         get:\
    \ function() {\n7           return geometryEngine.buffer(this.graphic.geometry);\n\
    8         }\n9       }\n10     }\n11   });\n```\n\nIn this sample, you want a\
    \ property for `bufferedGeometry`, which is based on the `graphic` value. In this\
    \ case, I don’t want users of my `Model` to have to use the `GeometryEngine` on\
    \ their end, so I can simplify it and provide the value for them.\n\n### TypeScript\
    \ Integration\n\nVersion 4.2 of the API also introduced improved TypeScript integration\
    \ for using Accessors. This improved integration also comes with a set of decorators[^(11)](#A458961_1_En_4_Chapter.html#Fn11)\
    \ that simplifies the implementation process.\n\nThis means you can update your\
    \ previous sample to look more like this:\n\n```\n1   /// \n3   /// \n\n5   import\
    \ { declared, subclass, property } from \"esri/core/accessorSupport/decorators\"\
    ;\n\n7   @subclass()\n8   class Model extends declared(Accessor) {\n\n10     @property()\n\
    11     graphic: Graphic = new Graphic();\n\n13     @property({\n14       dependsOn:\
    \ [\"graphic]\n15     })\n16     get bufferedGeometry(): Geometry {\n17      \
    \ return geometryEngine.buffer(this.graphic.geometry);\n18     }\n\n20   }\n```\n\
    \nThe decorators are incredibly useful to make implementing Accessor[^(12)](#A458961_1_En_4_Chapter.html#Fn12)\
    \ and defining properties much more explicit. You can review the documentation\
    \ for decorators for more details.[^(13)](#A458961_1_En_4_Chapter.html#Fn13)"
  trans: "\n### `watchUtils`\n\n正如我们所看到的，监听属性变化在 API 中非常有用。由于在监听属性时，你的具体需求可能因应用程序而异，因此有一个名为`watchUtils`的辅助工具可供使用。⁷\n\
    \n让我们来看几个更有趣的方法：\n\n- `watchUtils.init()`：当你需要获取属性的初始值时，这个工具会派上用场。请记住，当你监听属性变化时，只有在属性实际发生变化时你才会收到通知。这意味着，除非你使用此工具来监听变化并同时获取初始值，否则你将无法知道许多属性的初始值。\n\
    \n    ```\n    1   watchUtils.init(view, \"stationary\", (value, oldValue) =>\
    \ console.log(`New/Initia\\\n    2   l value is \"${value}\" and Old value is\
    \ \"${oldValue}\"`));\n    ```\n\n    这将为你提供属性的初始值（即默认值），以及像常规监听器一样的所有未来更新。如果你需要初始值来启动应用程序中的某个操作或在页面上显示一个值，但又不想等待值发生变化，这将非常有用。\n\
    \n- `watchUtils.once()`：顾名思义，当你只关心监听一次属性变化时，这个监听方法非常有用。它也是返回`PromiseWatchHandle`的监听辅助方法的一个子集。⁸\
    \ 这意味着你可以像对待任何 Promise 一样对待这个监听器，甚至可以在应用程序中链式调用此监听器的结果。\n\n    ```\n    1   watchUtils.once(view,\
    \ \"camera\").then(({ value, oldValue, propertyName, target })\\\n    2     =>\
    \ {\n    3      return geometryEngineAsync.union([oldValue.position, value.position]);\n\
    \    4   }).then(positionMultiPoints =>  {\n    5     // store or continue using\
    \ unioned points\n    6   });\n    ```\n\n    如你所见，某些监听辅助方法能够返回 Promise 是非常有用的。\n\
    \n- `watchUtils.pausable()`：我非常喜欢这个小工具。顾名思义，这是一个你可以暂停，然后根据需要恢复的监听器。\n\n    ```\n\
    \    1   const handler = watchUtils.pausable(view, \"center\", updateComponentMethod);\n\
    \    2   // resize component, no need to update during animated resize\n    3\
    \   handler.pause();\n    4   // resize of component is done, resume updates\n\
    \    5   handler.resume();\n    ```\n\n    通过这个小示例，我可能有一个自定义组件，它会随着视图的`center`属性变化而更新。但是，我可能为调整此组件的大小或将其停靠到一个不完全可见的工具栏设置了动画。关键在于，我只想暂停此组件的更新，以便调用`handler.pause()`。然后，当组件处于我希望继续更新的状态时，我可以调用`handler.resume()`。我发现这个`pausable()`辅助方法是`watchUtils`辅助工具中最有用的一个。\n\
    \n我建议你查阅文档⁹，并在监听属性变化时遇到特殊情况时，记住这些辅助工具。\n\n## 自动转换（Autocasting）\n\n使用 Accessor\
    \ 的另一个强大特性是，你可以定义能够自动转换为某个类或模块的属性。这允许你传入看起来像某种类型的数据，并将其转换为该类型。\n\n```\n1   import\
    \ Accessor from \"esri/core/Accessor\";\n2   import Extent from \"esri/geometry/Extent\"\
    ;\n\n4   const Model = Accessor.createSubclass({\n5     properties: {\n6     \
    \  extent: Extent\n7     }\n8   });\n\n10   export default Model;\n```\n\n现在，你可以将一个类似`extent`的对象传递给这个\
    \ Accessor，它会被转换成一个真正的`Extent`对象。\n\n```\n1   const model = new Model({\n2   \
    \  extent: {\n3       xmin: -122.68,\n4       ymin: 45.53,\n5       xmax: -122.45,\n\
    6       ymax: 45.6\n7     }\n8   });\n\n10   model.watch(\"extent\", (val) =>\
    \ console.log(val));\n```\n\n如你所见，这使得构建模块和类变得非常容易，这些模块和类允许你传入简单的数据对象，这些对象可以自动转换为更复杂的对象。\n\
    \n自动转换在 API 中变得非常有用，以至于你甚至可能忘记它的存在。一个很好的例子是当你创建一个`WebMap`时。\n\n```\n1   const\
    \ webmap = new WebMap({\n2     portalItem: {\n3       id: \"e691172598f04ea8881cd2a4adaa45ba\"\
    \n4     }\n5   });\n\n7   const view = new MapView({\n8     map: webmap,  //the\
    \ WebMap instance created above\n9     container: \"viewDiv\"\n10   });\n```\n\
    \n`WebMap`在第 3 章中有详细介绍。但在这个例子中，你只是将一个`PortalItem`的`id`值传递给了`WebMap`的构造函数。在内部，`WebMap`知道`portalItem`属性的类型是`PortalItem`。因此，通过传入一个具有`PortalItem`所需最小属性的对象，`WebMap`可以将该对象自动转换为正确的实例。\n\
    \n如果你一直在使用 3.x 版本的 API，那么简单地监听属性变化而不是监听事件发生可能是一个新概念，但我希望你能看到在 4.x 版本的 API 中监听属性变化的简单性和灵活性，并从使用此功能中获得一些真正的好处。\n\
    \n## 扩展 Accessor\n\n从 ArcGIS API for JavaScript 的 4.2 版本开始，Accessor 文档现在包含了“实现\
    \ Accessor”部分。¹⁰ 该部分内容相当详尽，因此我们不重复其内容，而是来看几个基础点。\n\n你已经看到了如何使用`Accessor.createSubclass()`自己实现一个\
    \ Accessor。关键在于提供一个`properties`对象，该对象将包含有关你实现的信息。你已经看到了如何预定义属性的类型。\n\n```\n1 \
    \  const Model = Accessor.createSubclass({\n2     properties: {\n3       extent:\
    \ Extent\n4     }\n5   });\n```\n\n但你还可以更进一步，拥有一些计算属性。\n\n```\n1   const Model\
    \ = Accessor.createSubclass({\n2     properties: {\n3       graphic: new Graphic(/*\
    \ Graphic Properties */),\n4       bufferedGeometry: {\n5         dependsOn: [\"\
    graphic\"],\n6         get: function() {\n7           return geometryEngine.buffer(this.graphic.geometry);\n\
    8         }\n9       }\n10     }\n11   });\n```\n\n在这个示例中，你想要一个基于`graphic`值的`bufferedGeometry`属性。在这种情况下，我不希望我的`Model`的用户在他们那边使用`GeometryEngine`，所以我可以简化它并为他们提供这个值。\n\
    \n### TypeScript 集成\n\nAPI 的 4.2 版本还引入了改进的 TypeScript 集成，用于使用 Accessors。这种改进的集成还附带了一组装饰器¹¹，简化了实现过程。\n\
    \n这意味着你可以将之前的示例更新为如下所示：\n\n```\n1   /// \n3   /// \n\n5   import { declared, subclass,\
    \ property } from \"esri/core/accessorSupport/decorators\";\n\n7   @subclass()\n\
    8   class Model extends declared(Accessor) {\n\n10     @property()\n11     graphic:\
    \ Graphic = new Graphic();\n\n13     @property({\n14       dependsOn: [\"graphic]\n\
    15     })\n16     get bufferedGeometry(): Geometry {\n17       return geometryEngine.buffer(this.graphic.geometry);\n\
    18     }\n\n20   }\n```\n\n这些装饰器非常有用，可以使实现 Accessor¹² 和定义属性更加明确。你可以查阅装饰器文档以获取更多详细信息。¹³\n"
- fmt: "# Collections\n\nCollections in the ArcGIS API 4 for JavaScript API are array-like\
    \ containers of data. They look and act like arrays, but they cannot be iterated\
    \ over with a `for` loop. Instead, you would use one of the many array methods\
    \ to work with the collection. Most of these methods are typical array methods\
    \ that work as expected. Some methods are exclusive to the collection, such as\
    \ `getItemAt()`.\n\nWithout just copying the documentation, I want to point out\
    \ some methods exclusive to a collection.\n\n*   `ofType`: Allows you to create\
    \ typed collections\n*   `add`: Works like `Array.prototype.push`\n*   `addMany`:\
    \ Takes an array of objects to add to the collection\n*   `clone`: As advertised,\
    \ creates a clone of the collection\n*   `remove`: Removes the argument passed\
    \ in from the collection\n*   `removeAll`: Empties the collection\n*   `removeAt`:\
    \ Easily removes an item from the collection at a specific index\n*   `removeMany`:\
    \ Removes all items from the given array\n*   `reorder`: Moves an item to a new\
    \ index in the collection\n*   `toArray`: Exports the collection a normal native\
    \ array\n\nAnother feature of the collection is the ability to listen for `change`\
    \ events.\n\n```\ncollection.on(\"change\", ({ added, moved, removed }) => {/*do\
    \ something cool*/});\n```\n\nThe `change` event returns an object with the properties\
    \ `added`, `moved`, and `removed`. Each property is an array that will contain\
    \ the items that changed in the collection. This is an incredibly useful feature\
    \ that you can’t get with native JavaScript arrays. You’ll be able to watch for\
    \ any changes done to the collection and act accordingly.\n\n## Promises\n\nOne\
    \ thing that the views and layers all have in common is they are all promises.\n\
    \nPromises are incredibly useful for performing asynchronous operations. You’ll\
    \ find promises throughout the entire API. This is because there are numerous\
    \ asynchronous operations taking place.\n\nWhen you create a view, you can check\
    \ the promise method `then` to see when the view is done loading and start checking\
    \ on properties.\n\n```\nview.then(() => {\n  view.watch(\"extent.xmin\", (xmin)\
    \ => console.log(xmin));\n});\n```\n\nIt’s also good practice to start watching\
    \ for Accessor property changes after the view is loaded and ready. Promises come\
    \ in handy so you can chain their results.\n\n```\nview.then(() => {\n  return\
    \ view.whenLayerView(myLayer);\n})\n.then((layerView) => {\n  return watchUtils.whenFalseOnce(layerView,\
    \ \"updating\");\n})\n.then(({ target: layerView }) => {\n  return layerView.queryFeatures()\n\
    })\n.then((features => {\n  view.goTo(features);\n}))\n.otherwise(error => {\n\
    \  // catch errors in the Promise chain here\n});\n```\n\nIn this snippet of code,\
    \ you wait for the view to load, get a `LayerView` from the view, query the features\
    \ in the view, and then use the `goTo` method to animate to the features.\n\n\
    In this sample, you are using the `watchUtils` module to help check for a property\
    \ change, but you only care about when the `LayerView` is done updating so you\
    \ can get the features. I’ll cover this method a little more in the next chapter\
    \ on Accessors.\n\nThe ability to use promises throughout the API is incredibly\
    \ useful to handle the multiple asynchronous operations that take place in a web\
    \ mapping application.\n\n## Summary\n\nAt this point, you should have a pretty\
    \ good idea of how the core fundamentals of the ArcGIS API for JavaScript work.\
    \ Having a solid grasp of how Accessors, collections, and promises work will greatly\
    \ enhance your ability to build applications with the API.\n\n*   Accessors provide\
    \ a way for you to easily watch for property changes, instead of listening for\
    \ events.\n*   Collections are useful to store data that may normally sit in an\
    \ array if you want to know that the collection is updated.\n*   Promises allow\
    \ you to work with asynchronous data and, in the case of the views, let you know\
    \ when they are ready to be used.\n\nFootnotes\n\n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Accessor.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Accessor.html)\n\
    \n[`http://javascriptplayground.com/blog/2013/12/es5-getters-setters/`](http://javascriptplayground.com/blog/2013/12/es5-getters-setters/)\n\
    \n[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperty`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperty)\n\
    \n[`https://dojotoolkit.org/reference-guide/1.10/dojo/Stateful.html`](https://dojotoolkit.org/reference-guide/1.10/dojo/Stateful.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Accessor.html#~WatchHandle`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Accessor.html#~WatchHandle)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html#~PromisedWatchHandle`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html#~PromisedWatchHandle)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-watchUtils.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/guide/implementing-accessor/index.html`](https://developers.arcgis.com/javascript/latest/guide/implementing-accessor/index.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-accessorSupport-decorators.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-accessorSupport-decorators.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/guide/implementing-accessor/index.html`](https://developers.arcgis.com/javascript/latest/guide/implementing-accessor/index.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-accessorSupport-decorators.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-accessorSupport-decorators.html)\n\
    \n[`https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Collection.html`](https://developers.arcgis.com/javascript/latest/api-reference/esri-core-Collection.html)"
  raw: '## Collections


    Collections[^(14)](#A458961_1_En_4_Chapter.html#Fn14) in the ArcGIS API 4 for
    JavaScript API are array-like containers of data. They look and act like arrays,
    but they cannot be iterated over with a `for` loop. Instead, you would use one
    of the many array methods[^(15)](#A458961_1_En_4_Chapter.html#Fn15) to work with
    the collection. Most of these methods are typical array methods[^(16)](#A458961_1_En_4_Chapter.html#Fn16)
    that work as expected. Some methods are exclusive to the collection, such as `getItemAt()`
    .[^(17)](#A458961_1_En_4_Chapter.html#Fn17)


    Without just copying the documentation , I want to point out some methods exclusive
    to a collection.


    *   `ofType`:[^(18)](#A458961_1_En_4_Chapter.html#Fn18) Allows you to create typed
    collections

    *   `add`:[^(19)](#A458961_1_En_4_Chapter.html#Fn19) Works like `Array.prototype.push`
    [^(20)](#A458961_1_En_4_Chapter.html#Fn20)

    *   `addMany`:[^(21)](#A458961_1_En_4_Chapter.html#Fn21) Takes an array of objects
    to add to the collection

    *   `clone`:[^(22)](#A458961_1_En_4_Chapter.html#Fn22) As advertised, creates
    a clone of the collection

    *   `remove`:[^(23)](#A458961_1_En_4_Chapter.html#Fn23) Removes the argument passed
    in from the collection

    *   `removeAll`:[^(24)](#A458961_1_En_4_Chapter.html#Fn24) Empties the collection

    *   `removeAt`:[^(25)](#A458961_1_En_4_Chapter.html#Fn25) Easily removes an item
    from the collection at a specific index

    *   `removeMany`:[^(26)](#A458961_1_En_4_Chapter.html#Fn26) Removes all items
    from the given array

    *   `reorder`:[^(27)](#A458961_1_En_4_Chapter.html#Fn27) Moves an item to a new
    index in the collection

    *   `toArray`:[^(28)](#A458961_1_En_4_Chapter.html#Fn28) Exports the collection
    a normal native array


    Another feature of the collection is the ability to listen for `change` events.


    ```

    1   collection.on("change", ({ added, moved, removed }) => {/*do something cool*/});

    ```


    The `change` event returns an object with the properties `added`, `moved`, and
    `removed`. Each property is an array that will contain the items that changed
    in the collection. This is an incredibly useful feature that you can’t get with
    native JavaScript arrays. You’ll be able to watch for any changes done to the
    collection and act accordingly.


    ## Promises


    One thing that the views and layers all have in common is they are all promises.[^(29)](#A458961_1_En_4_Chapter.html#Fn29)


    Promises are incredibly useful for performing asynchronous operations. You’ll
    find promises throughout the entire API. This is because there are numerous asynchronous
    operations taking place.


    When you create a view, you can check the promise method `then` to see when the
    view is done loading and start checking on properties.


    ```

    1   view.then(() => {

    2     view.watch("extent.xmin", (xmin) => console.log(xmin));

    3   });

    ```


    It’s also good practice to start watching for Accessor property changes after
    the view is loaded and ready. Promises come in handy so you can chain their results.


    ```

    1   view.then(() => {

    2     return view.whenLayerView(myLayer);

    3   })

    4   .then((layerView) => {

    5     return watchUtils.whenFalseOnce(layerView, "updating");

    6   })

    7   .then(({ target: layerView }) => {

    8     return layerView.queryFeatures()

    9   })

    10   .then((features => {

    11     view.goTo(features);

    12   }))

    13   .otherwise(error => {

    14     // catch errors in the Promise chain here

    15   });

    ```


    In this snippet of code, you wait for the view to load, get a `LayerView` from
    the view, query the features in the view, and then use the `goTo` method[^(30)](#A458961_1_En_4_Chapter.html#Fn30)
    to animate to the features.


    In this sample, you are using the `watchUtils` module to help check for a property
    change, but you only care about when the `LayerView` is done updating so you can
    get the features. I’ll cover this method a little more in the next chapter on
    Accessors.


    The ability to use promises throughout the API is incredibly useful to handle
    the multiple asynchronous operations that take place in a web mapping application.


    ## Summary


    At this point, you should have a pretty good idea of how the core fundamentals
    of the ArcGIS API for JavaScript work. Having a solid grasp of how Accessors,
    collections, and promises work will greatly enhance your ability to build applications
    with the API.


    *   Accessors provide a way for you to easily watch for property changes, instead
    of listening for events.

    *   Collections are useful to store data that may normally sit in an array if
    you want to know that the collection is updated.

    *   Promises allow you to work with asynchronous data and, in the case of the
    views, let you know when they are ready to be used.


