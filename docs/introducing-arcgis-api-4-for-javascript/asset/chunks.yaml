  raw: '### Packages


    One area of confusion I have seen come up quite a bit is the idea of packages.
    Don’t worry, it’s something I was initially confused about when I first started
    out with AMD. Right now, you do not need to worry too much about packages, that
    is, until you decide that you want build your application. At that point, you
    should really learn what a package is.


    A package is essentially a namespace similar to something like Java.[⁶](#A458961_1_En_2_Chapter.html#Fn6)
    In the ArcGIS API for JavaScript 4, `esri` is a package and so is `dojo`. This
    means that `esri/Map` is a module in the `esri` package. When you write your own
    application code, you will typically create an `app` package. This lets you reference
    your own modules under the `app` package.


    So, your folder with source code may look like this:


    ```

    1   src

    2     ├── app

    3        ├── /widgets

    4        ├── /services

    ```


    If you are working with the Bower[⁷](#A458961_1_En_2_Chapter.html#Fn7) release
    of the ArcGIS API for JavaScript 4, you would ideally have all other packages
    in the same folder.


    ```

    1   src

    2     ├── app

    3     ├── dgrid

    4     ├── dijit

    5     ├── dojo

    6     ├── dojox

    7     ├── dstore

    8     ├── moment

    9     ├── esri

    ```


    This lets you easily organize your code and also lets the Dojo build tools[⁸](#A458961_1_En_2_Chapter.html#Fn8)
    know what packages you are using.


    There may be a need for you to use a library that is built using Universal Module
    Definition (UMD) . In this case, the Dojo build system will recognize that you
    are trying to load something that looks like an AMD module but isn’t quite an
    AMD module. You can let the Dojo build know how to load this package in the `packages`
    property of your build profile.


    Let’s take the `moment` library used in the API as an example. If you are going
    to do a custom local build using the Bower release of the API, you will want to
    make this small adjustment to your build profile:


    ```

    1   packages: [

    2     ''app'',

    3     ''dijit'',

    4     ''dojo'',

    5     ''dojox'',

    6     ''dstore'',

    7     ''dgrid'',

    8     ''esri'', {

    9       name: ''moment'',

    10       location: ''moment'',

    11       main: ''moment'',

    12       trees: [

    13         // don''t bother with .hidden, tests, min, src, and templates

    14         [".", ".", /(\/\.)|(~$)|(test|txt|src|min|templates)/]

    15       ],

    16       resourceTags: {

    17         amd: function(filename, mid){

    18           return /\.js$/.test(filename);

    19         }

    20       }

    21     }

    22   ]

    ```


    In this case, you are defining a `moment` package by defining the `name`, `location`,
    and `main` properties. This is similar to how you defined the `app` package earlier.
    However, for this package, you are defining a `resourceTags` property . This property
    tells the Dojo build system, via a regular expression, that all `.js` files are
    AMD modules. You also add a `trees` property , which tells the Dojo build system
    to ignore hidden files, test directories, minified files, and more files you don’t
    want the Dojo build system to try to build. These are the steps you would want
    to use to define a package for UMD files so they can be properly loaded into the
    Dojo build system.


    Normally, these properties are defined in a JavaScript file inside your package
    folder. This file can be called anything you want, but it typically is called
    something like `app.profile.js` and will look like this:


    ```

    1   var profile = (function () {

    2     return {

    3       resourceTags: {

    4         amd: function (filename, mid) {

    5           return /\.js$/.test(filename);

    6         }

    7       }

    8     };

    9   })();

    ```


    There are other options you could add here, which can be found in the documentation.[⁹](#A458961_1_En_2_Chapter.html#Fn9)


    You can let the Dojo build system know how to find your package profile via the
    `package.json` file.


    ```

    1   {

    2       "name": "app",

    3       "description": "My Application Package.",

    4       "version": "1.0",

    5       "dojoBuild": "app.profile.js"

    6   }

    ```


    The Dojo build system will look for the `dojoBuild` property in the `package.json`
    file to figure out how to load your AMD package via the defined settings.


    ## Summary


    In this short chapter, I covered how to set up a basic application and define
    a `dojoConfig` object. You learned about the AMD loader as well as how to define
    AMD packages and how they are used in creating custom builds of the API using
    the Dojo build system. With this thorough understanding of packages, let’s move
    on to some concepts of the ArcGIS API 4 for JavaScript.


