- fmt: '# Fields and Aliases


    You can get started quickly with defining a `popupTemplate` for popups on a layer
    like so:


    ```

    1   const featureLayer = new FeatureLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver/3",

    4     outFields: ["*"],

    5     popupTemplate: {

    6       title: "Name: {STATE_NAME}",

    7       content: "{*}"

    8     }

    9   });

    ```


    This will create a popup with the title “Name: Foghorn Leghorn” if the `NAME`
    field for that feature is `Foghorn Leghorn`. By defining the `content` as `"{*}"`,
    the popup will display a simple table showing all the field names and their values.


    That is just about as simple of a `Popup` widget as you can define. But you can
    take this a step further.


    Probably the easiest way to work with popups for your layers and maps is to configure
    the `Popup` [²](#A458961_1_En_6_Chapter.html#Fn2) in the ArcGIS Online map viewer.
    The configurations you make to your popup will be reflected in your application
    if you load it via a `WebMap` or via a `PortalItem`, as we discussed in previous
    chapters.


    You can configure the `Popup` to display an alias instead of the actual field
    name if you want. You configure this in the `content` property of the `popupTemplate`.


    ```

    1   const featureLayer = new FeatureLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver/3",

    4     outFields: ["*"],

    5     popupTemplate: {

    6       title: "Name: {STATE_NAME}",

    7       content: [

    8         {

    9           type: "fields",

    10           fieldInfos: [

    11             {

    12               fieldName: "POP2000",

    13               visible: true,

    14               label: "Population for year 2000",

    15               format: {

    16                 places: 0,

    17                 digitSeparator: true

    18               }

    19             },

    20             {

    21               fieldName: "POP2007",

    22               visible: true,

    23               label: "Population for year 2007",

    24               format: {

    25                 places: 0,

    26                 digitSeparator: true

    27               }

    28             }

    29           ]

    30         }

    31       ]

    32     }

    33   });

    ```


    The previous sample will display two fields, the `POP2000` and `POP2007` fields.
    However, you can provide a `label` property for each field that is different from
    the actual field name. Since you are dealing with fields that have numeric values,
    you can also define how those numeric values are displayed. In this case, you
    want zero decimal places and no separator for digits, which varies based on the
    locale.


    If your data had a date field, you could also define a date format.


    ```

    1   {

    2     fieldName: "FAKEDATE",

    3     visible: true,

    4     label: "Fake Date Field",

    5     format: {

    6       dateFormat: "short-date"

    7     }

    8   }

    ```


    That’s pretty simple, right?


    You could even use plain HTML in the content if you wanted to really customize
    the output.


    ```

    1   const featureLayer = new FeatureLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver/2",

    4     outFields: ["*"],

    5     popupTemplate: {

    6       title: "Name: {STATE_NAME}",

    7       content: `


    9           {STATE_ABBR}


    12             Year 2000 Pop: {POP2000}

    13             Year 2007 Pop: {POP2007}

    14             Total Households: {HOUSEHOLDS}


    17       `

    18     }

    19   });

    ```


    You could even use a function for the content to process it a bit further. Let’s
    assume you had a known geometry in your application, perhaps some sort of fenced-off
    area. You want to notify the user when they click an item that the location is
    within this fenced-off area.


    ```

    1   const featureLayer = new FeatureLayer({

    2     url: URL,

    3     outFields: ["*"],

    4     popupTemplate: {

    5       title: "Name: {name}",

    6       content({ graphic }) {

    7         const isWithin = geometryEngine.contains(fencedGeometry, graphic.geometry);

    8         return `

    9           Location ${isWithin ? "is" : "is not"} currently within fenced area.

    10         `;

    11       }

    12     }

    13   });

    ```


    This is just another way you can customize the content of your popup.


    You can take this a step further and query multiple layers based on a click of
    the view.


    ```

    1   view.on("click", ({ mapPoint }) => {

    2     const screenPoint = view.toScreen(mapPoint);

    3     view.hitTest(screenPoint).then(({ results }) => {

    4       if (results[0].graphic) {

    5         view.popup.open({

    6           location: mapPoint,

    7           promises: [() => {

    8             query.geometry = results[0].graphic.geometry;

    9             return qTask.execute(query).then(({ features }) => {

    10               var names = features.map((feature) => {

    11                 return feature.attributes.state_name;

    12               }).join(", ");

    13               return "{route} crosses the following States: " + names;

    14             });

    15           }]

    16         });

    17       }

    18     });

    19   });

    ```


    This particular sample will query a service to see whether a graphic intersects
    features from that service. When the queries added to the `promises` property
    in the argument for the popup are complete, the popup will open and display your
    custom results.


    You can even use Arcade[³](#A458961_1_En_6_Chapter.html#Fn3) expressions in your
    popup.


    ```

    1   const featureLayer = new FeatureLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver/2",

    4     outFields: ["*"],

    5     popupTemplate: {

    6       title: "Name: {STATE_NAME}",

    7       expressionInfos: [

    8         {

    9           name: "percent-change",

    10           title: "% change from 2000 to 2007",

    11           expression: "Abs((($feature.POP2000 - $feature.POP2007) / $feature.POP20\

    12   00) * 100) + ''%''"

    13         }

    14       ],

    15       content: "The percent change from 2000 to 2007 was {expression/percent-chang\

    16   e}"

    17     }

    18   });

    ```


    As you can see, it’s not difficult to customize how the popup will display the
    data.


    ## MediaInfos


    The content of the popup can also consist of charts based on the data of the feature.
    You can define this in a similar fashion as configuring the `fieldInfos` for the
    `PopupTemplate`.


    ```

    1   {

    2     type: "media",

    3     mediaInfos: [

    4       {

    5         title: "Population",

    6         type: "column-chart",

    7         caption: "",

    8         value: {

    9           theme: "BlueDusk",

    10           fields: [ "POP2000", "POP2007" ]

    11         }

    12       }

    13     ]

    14   }

    ```


    What this is going to do is display a `column-chart` for the population data provided
    in the fields `POP2000` and `POP2007`. Your other choices for the type of media
    are `image`, `pie-chart`, `bar-chart`, or `line-chart`. If the type is `image`,
    you would provide a `sourceURL` property instead of a `fields` property. The themes
    you can use are based on the Dojox charting library themes.[⁴](#A458961_1_En_6_Chapter.html#Fn4)
    You can read more about the `mediaInfos` options in the documentation.[⁵](#A458961_1_En_6_Chapter.html#Fn5)'
