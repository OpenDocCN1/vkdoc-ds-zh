- fmt: '# Layers


    Retrieving the layers in the `WebMap` is easy to do. To access the layers on the
    map, you can simply retrieve them from the `map.layers` property. This property
    will provide you with the operational layers of the map, which means no basemaps.
    If you want all the layers, including the basemap, you can use the `map.allLayers`
    property. This is a much simpler API than the 3.x version.


    If you only care about the basemap, you can get that via the `map.basemap` property.


    To reiterate, the views and the `LayerView`s are what actually draw the data for
    the map. They control the display of graphics, the extent, and any other visual
    properties. The map and layers are containers of that data. They are the models
    for your map, which means they can be treated like models in your application
    development. The map and the layer can be used as a data source for charts or
    tables or any other type of custom component that may not even have a map to display.
    That’s a powerful feature of the API.


    There are a handful of layers available in the API, and each serves a different
    purpose. You can read more details about each type of layer in the API documentation,
    but these are some of the more common layers:


    *   `GraphicsLayer`

    *   `FeatureLayer`

    *   `MapImageLayer`

    *   `SceneLayer`

    *   `VectorTileLayer`


    ## GraphicsLayer


    The `GraphicsLayer` is probably the simplest layer you can work with. As the name
    suggests, it simply contains graphics that are displayed on the map.


    Note


    If you are familiar with the `GraphicsLayer` from the 3.x version of the ArcGIS
    API for JavaScript, one main difference with the `GraphicsLayer` in version 4
    is that it does not support a renderer. You would need to define the symbology
    per graphic instead of on the layer. This is because the `GraphicsLayer` can support
    graphics with different geometry types. This greatly simplifies creating basic
    graphics to display on the map.


    Initializing a `GraphicsLayer` is fairly simple.


    ```

    1   const graphicsLayer = new GraphicsLayer({

    2     graphics: [graphic1, graphic2, graphic3]

    3   });

    ```


    You can add graphics to the `GraphicsLayer` via a couple of methods.


    ```

    1   // add a single graphic

    2   graphicsLayer.add(graphic);

    3   // add an array of graphics

    4   graphicsLayer.addMany([graphic1, graphic2, graphic3]);

    ```


    Since you can’t set up a renderer or popup template for a `GraphicsLayer`, you’ll
    need to define the symbology and popups on a per-graphic basis.


    ```

    1   // create a graphic

    2   let graphic = new Graphic({

    3     attributes: {

    4       id: 1,

    5       city: "Los Angeles"

    6     },

    7     geometry: { type: "point", x: xValue, y: yValue },

    8     symbol: { type: "simple-marker",

    9       style: ''circle'',

    10       color: ''red'',

    11       size: 10,

    12       outline: {

    13         color: ''rgba(255, 255, 255, 0.5)''

    14         width: 4

    15       }

    16     },

    17     popupTemplate: {

    18       title: "My Awesome Graphic!",

    19       content: "{*}" // display all fields

    20     }

    21   });


    23   // add it to graphicsLayer

    24   graphicsLayer.add(graphic);

    ```


    Popups will be covered in more detail in a later chapter.


    If you need more robust support for your graphics, in particular using a renderer
    and popups, you’ll want to use a `FeatureLayer`. The `GraphicsLayer` is ideal
    as simply a bag of miscellaneous graphics.


    ## FeatureLayer


    `FeatureLayer`s are probably the most versatile and widely used layer type in
    the ArcGIS platform. There are a few different ways you can initialize a `FeatureLayer`.


    ```

    1   // Create via URL

    2   const featureLayer = new FeatureLayer({

    3     url: "http://services6.arcgis.com/m3L8QUZ93HeaQzKv/arcgis/rest/services/BeerAn\

    4   dBurgerJoints/FeatureServer/0"

    5   });


    7   // Create via a Portal item

    8   const featureLayer = new FeatureLayer({

    9     portalItem: {

    10       id: "b126510e440744169943fd8ccc9b0c4e"

    11     }

    12   });

    ```


    By initializing a `FeatureLayer` via one of these two methods, the layer is now
    bound to a remote service. The same way you can query the `LayerView` of a `FeatureLayer`,
    you can query directly against the `FeatureLayer` to find the features, `ObjectId`s,
    or extent of a `FeatureLayer`.


    You can also create a `FeatureLayer` via a `FeatureCollection`, although it has
    been simplified since the 3.x version of the API.


    ```

    1   const featureLayer = new FeatureLayer({

    2     objectIdField: "item_id",

    3     geometryType: "point",

    4     // Define the fields of the graphics in the FeatureLayer

    5     fields: [{

    6       name: "item_id",

    7       alias: "Item ID",

    8       type: "oid"

    9     }, {

    10       name: "description",

    11       alias: "Description",

    12       type: "string"

    13     }, {

    14       name: "title",

    15       alias: "Title",

    16       type: "string"

    17     }],

    18     // Define a renderer for the layer

    19     renderer: {

    20       type: "simple",

    21       symbol: {

    type: "simple-marker",

    22         style: ''circle'',

    23         color: ''red'',

    24         size: 10,

    25         outline: {

    26           color: ''rgba(255, 255, 255, 0.5)''

    27           width: 4

    28         }

    29       }

    30     },

    31     popupTemplate: {

    32       title: "{title}",

    33       content: "{description}"

    34     },

    35     // This is a collection of Graphics

    36     source: [graphic1, graphic2, graphic3]

    37   });

    ```


    What you are doing here is defining the source for a `FeatureLayer` manually.
    This basically passes along a collection of graphics and defines the renderer
    for those graphics, as well as the fields and popup. The benefit here is the ability
    to use a single renderer for multiple graphics as well as a single popup. You
    will also have the ability to query against this `FeatureLayer` the same way you
    could query a `FeatureLayer` tied to a remote service.


    Now, maybe you want to update the source features in a `FeatureLayer`. You can
    do this in the following manner:


    ```

    1   const graphicOfInterest = featureLayer.source.find(x => x.attributes.OBJECTID
    ==\

    2   = oid);

    3   const target = graphicOfInterest.clone();

    4   const target.geometry = updatedGeometry;

    5   featureLayer.source.remove(graphicOfInterest);

    6   featureLayer.source.add(target);

    ```


    This lets you update individual graphics in the `FeatureLayer` source. This comes
    in handy if you want to display updated GPS data or maybe change the symbology
    for individual features.'
