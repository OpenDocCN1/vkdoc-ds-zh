    ## 关于作者与技术审校者\n\n关于作者  \n关于技术审校者\n\n# 1. 引言\n\nArcGIS API for JavaScript 多年来不断发展，纳入了能够利用\
    \ ArcGIS Server 和 ArcGIS Online 更新的新功能。向 API 第 4 版的迁移是自其首次发布以来在技术和功能上最大的飞跃之一。此版本的\
    \ API 为开发者引入了一些新概念，并使开发者能够更轻松地将 3D 场景添加到其应用程序中。\n\n## 如何获取 ArcGIS API\n\n您可以在\
    \ [`https://developers.arcgis.com/javascript/latest`](https://developers.arcgis.com/javascript/latest)\
    \ 找到有关该 API 的更多信息。\n\n## 关键概念\n\nArcGIS API 4 for JavaScript 继承了早期版本 API 中的一些概念，并引入了一些新概念。这些内容将在本书中更详细地讨论，但此处简要说明如下：\n\
    \n*   **异步模块定义 (AMD)**：这是 Dojo 使用的模块系统，非常适合大型应用程序开发。\n*   **地图、图层和视图**：地图及其图层和视图关系是关键。地图是一个数据源，可以链接到多个视图。\n\
    *   **访问器**：访问器是 API 的强大实现，提供了丰富的功能集。\n*   **集合**：这些是类似数组的数据存储，也可以发出更改事件。\n* \
    \  **Promise**：该 API 一直使用 Promise 进行异步操作，但在第 4 版中它们扮演着更重要的角色。\n*   **微件与 UI**：API\
    \ 中地图的微件和 UI 已针对第 4 版进行了完全重写和重新架构。\n*   **Web 场景与本地场景**：场景是 JavaScript API 中一个令人兴奋的新增功能，因为它们将\
    \ 3D 能力交到了开发者手中。\n\n## 你需要了解的内容\n\n我认为可以公平地说，如果你正在阅读本书，你应该具备一些基本的编程经验。如果你有 JavaScript\
    \ 经验，那就更好了，因为本书不会涵盖 JavaScript 基础知识。你可以在网上找到大量资源来学习 JavaScript，我建议你这样做。\n\n你不需要了解地理信息系统\
    \ (GIS)。我假设你知道地图是什么，仅此而已。\n"
- fmt: '# AMD


    For the purposes of this book, you won’t need to worry too much about the AMD
    used in the ArcGIS API for JavaScript. All the samples in this book will be using
    ES2015,[¹](#A458961_1_En_1_Chapter.html#Fn1) and you can compile them to AMD with
    `Babel`[²](#A458961_1_En_1_Chapter.html#Fn2) and `GruntJS`.[³](#A458961_1_En_1_Chapter.html#Fn3)


    What you do need to know is that the code you write for your ArcGIS JavaScript
    API applications will need to compile to AMD to use the Dojo loader[⁴](#A458961_1_En_1_Chapter.html#Fn4).


    Let’s get started!


    Footnotes [1](#A458961_1_En_1_Chapter.html#Fn1_source)


    [`https://babeljs.io/docs/learn-es2015/`](https://babeljs.io/docs/learn-es2015/)


    [2](#A458961_1_En_1_Chapter.html#Fn2_source)


    [`https://babeljs.io/`](https://babeljs.io/)


    [3](#A458961_1_En_1_Chapter.html#Fn3_source)


    [`http://gruntjs.com/`](http://gruntjs.com/)


    [4](#A458961_1_En_1_Chapter.html#Fn4_source)


    [`http://dojotoolkit.org/reference-guide/1.10/loader/amd.html#loader-amd`](https://dojotoolkit.org/documentation/tutorials/1.10/build/)


    # 2. Getting Started


    Let’s stop fooling around and write some code. The following is the simple HTML
    page for your first application. All of the `index.html` pages in this sample
    will work off this one. You’ll just be updating the JavaScript code as you go
    along.


    ```

    5       \

    6       ArcGIS API for JavaScript 4

    ```


    Here is the `dojoConfig.js` file:


    ```

    1   var locationPath = window.location.pathname.replace(/\/[^\/]+$/, ''/'');

    2   window.dojoConfig = {

    3     deps: [''app/main''],

    4     packages: [{

    5       name: ''app'',

    6       location: locationPath + ''/app'',

    7       main: ''main''

    8     }]

    9   };

    ```


    Here is the first sample JavaScript file, `app/main.js`:


    ```

    1   import Map from "esri/Map";

    2   import SceneView from "esri/views/SceneView";


    4   const map = new Map({ basemap: "topo" });

    5   const view = new SceneView({

    6     container: "mainDiv",

    7     map,

    8     center: [-118.182, 33.913],

    9     scale: 836023

    10   });

    ```


    That’s all you need to get a simple `SceneView` ready to go. You now have an interactive
    3D map you can work with.


    ## How About That dojoConfig?


    Let’s talk briefly about how `dojoConfig` works in your development environment.
    For most of the samples in this book, I’ll assume you are using the content delivery
    network (CDN) version of the ArcGIS API for JavaScript.


    What’s happening with this `locationPath`?


    ```

    1   var locationPath = window.location.pathname.replace(/\/[^\/]+$/, ''/'');

    ```


    Assume your application is hosted at `http://localhost/apps/myapplication`. The
    `location.pathname` would be `/apps/myapplication`. The regular expression `/\/[^\/]+$/`
    is going to turn it into `/apps/`. What you want to do is create a package for
    your application, which is basically a way for you to namespace your code into
    its own package to distinguish it from the dependencies.


    ```

    1   window.dojoConfig = {

    2     ...

    3     packages: [{

    4       name: ''app'',

    5       location: locationPath + ''/app'',

    6       main: ''main''

    7     }]

    8   };

    ```


    This is creating a package called `app`, and you are letting Dojo from the ArcGIS
    CDN know that the app is at `/apps/app` on your host and not the CDN. If you didn’t
    do this, Dojo would try looking for an `app` package on the CDN where it does
    not exist. You are also saying that the `app` package has an entry point in a
    module called `main`.


    ```

    1   window.dojoConfig = {

    2     deps: [''app/main''],

    3     ...

    4   };

    ```


    By stating `deps: [''app/main'']` is a dependency of the project, the `app/main`
    module will automatically load when the application starts. You can actually list
    any modules that need to load before your application starts in this array.


    You can read more about `dojoConfig` at [`https://dojotoolkit.org/documentation/tutorials/1.10/dojo_config/`](https://dojotoolkit.org/documentation/tutorials/1.10/dojo_config/).


    ## AMD and Packages


    I want to stress that you should write your code in ES6. This is to simplify how
    you actually write your code; in addition, for me at least, it lets me forget
    that I’m actually working with the Asynchronous Module Definition[¹](#A458961_1_En_2_Chapter.html#Fn1)
    for my code. The ES6 code you write will be turned into ES5-compatible AMD modules
    using a compiler such as `BabelJS`.[²](#A458961_1_En_2_Chapter.html#Fn2) At the
    end of the day, though, your code will still be AMD, and thus you should know
    a little bit about it and packages.


    ### AMD


    When you write code such as this:


    ```

    1   import Map from "esri/Map";

    2   import SceneView from "esri/views/SceneView";


    4   const map = new Map({ basemap: "topo" });

    5   const view = new SceneView({

    6     container: "mainDiv",

    7     map,

    8     center: [-118.182, 33.913],

    9     scale: 836023

    10   });

    ```


    Babel will compile it something more like this:


    ```

    1   define(["exports", "module", "esri/Map", "esri/views/SceneView"], function(exports\

    2   ts, module, _esriMap, _esriviewsSceneView) {


    4     function _interopRequireDefault(obj) { return obj && obj.__esModule ? obj
    : {\

    5   ''default'': obj }; }


    7     var _Map = _interopRequireDefault(_esriMap);

    8     var _SceneView = _interopRequireDefault(_esriviewsSceneView);


    10     var map = new Map["default"]({ basemap: "topo" });

    11     var view = new SceneView["default"]({

    12       container: "mainDiv",

    13       map,

    14       center: [-118.182, 33.913],

    15       scale: 836023

    16     });


    18   });

    ```


    Don’t let all this code throw you off. The amount of code has to do with ES6 modules[³](#A458961_1_En_2_Chapter.html#Fn3)
    and the `import`[⁴](#A458961_1_En_2_Chapter.html#Fn4) statement. When you write
    `import Map from "esri/Map";`, it is assumed that the source code exports a default
    `Object` that actually points to the `Map` module. However, we still live in a
    world where not everyone is writing ES6 code and the module system is not yet
    implemented in any browsers natively. So, you still need to account for some mixing
    and matching. That’s what this output code does.


    In AMD, you create modules with a `define` method. The first argument is an array
    that lists any other dependencies. The second argument is a function that returns
    the actual code for this module.


    As I said earlier, though, if you write your code in ES6 and let the compiler
    create your AMD modules, you don’t need to worry too much about some of these
    details. You should be aware of them, but don’t let them weigh you down.


    For more details, I’ll direct you to the Dojo documentation for AMD modules.[⁵](#A458961_1_En_2_Chapter.html#Fn5)'
