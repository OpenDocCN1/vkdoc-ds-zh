    /]+$/, '') + 'app',\n    main: 'main'\n  }]\n};\n```\n\n## My Amazing Portal Items\n\
    \nYou can write your application to load your own portal information.\n\n```javascript\n\
    import Portal from \"esri/portal/Portal\";\nimport PortalItem from \"esri/portal/PortalItem\"\
    ;\nimport OAuthInfo from \"esri/identity/OAuthInfo\";\nimport esriId from \"esri/identity/IdentityManager\"\
    ;\nimport PortalQueryParams from \"esri/portal/PortalQueryParams\";\nimport esriLang\
    \ from \"esri/core/lang\";\nimport on from \"dojo/on\";\n\n// create a card template\
    \ to display Portal Item Information\nconst template = `\n\n      {title}\n\n\
    \        {created}\n        {owner}\n\n        Open\n\n`;\n\n// container to hold\
    \ our cards\nconst $cardsList = document.querySelector(\".cards-list\");\nconst\
    \ info = new OAuthInfo({\n  appId: \"zppZ53G093yZV7tG\",\n  popup: false\n});\n\
    // Add the OAuthInfo to IdentityManager\nesriId.registerOAuthInfos([info]);\n\
    // now set up the Portal\nconst portal = new Portal({\n  // https://developers.arcgis.com/javascript/latest/api-reference/esri-portal-Portal.html#authMode\n\
    \  authMode: \"immediate\"\n});\n// Will trigger a login if the user is not already\n\
    // logged in via this application\nportal.load().then(() => {\n  const queryParams\
    \ = new PortalQueryParams({\n    query: `owner:${portal.user.username}`,\n   \
    \ sortField: \"numViews\",\n    sortOrder: \"desc\",\n    num: 20\n  });\n  return\
    \ portal.queryItems(queryParams);\n}).then(({ results }) => {\n  let docFrag =\
    \ document.createDocumentFragment();\n  // Iterate over each item to create a\
    \ card for it\n  results.forEach(item => {\n    // esri/lang::substitute will\
    \ create a new string using the PortalItem.\n    const card = esriLang.substitute(item,\
    \ template);\n    const elem = document.createElement(\"div\");\n    elem.className\
    \ = \"portal-item\";\n    elem.innerHTML = card;\n    docFrag.appendChild(elem);\n\
    \  });\n  // Append the completed list to the page.\n  $cardsList.appendChild(docFrag);\n\
    \  docFrag = undefined;\n});\n```\n\nWhat you are able to do here is use the `Portal`\
    \ module to get access to your portal items. Then you can simply iterate over\
    \ the portal items and add nice little cards with descriptions and thumbnails\
    \ for your portal items, with links to open the actual item. This is a great way\
    \ to be able to get access to your portal items quickly if you want to use them\
    \ in your application.\n\n## Summary\n\nIn this chapter, I covered the relationship\
    \ between maps and views and the benefits of having views manage the rendering\
    \ pipeline of the data in the map. I also covered how `LayerView` allows you to\
    \ access the features that are currently displayed in the view and the advantages\
    \ of being able to query those features. You learned about the various layer types\
    \ supported in the API and some of the new capabilities and functionality they\
    \ provide. I also covered the new capabilities of the Portal API and the simplicity\
    \ it provides for loading layers from a portal and also for searching for various\
    \ portal items. These are core concepts in the API that you can build on to create\
    \ awesome applications! In the next chapter, I will cover the core fundamentals\
    \ of the API—essentially the building blocks for how the API is designed—that\
    \ will let you take your skills to the next level.\n\n## Footnotes\n\n1.  [`www.arcgis.com/home/gallery.html`](http://www.arcgis.com/home/gallery.html)\n\
