    introduced to a few new symbols in this demo: `PointSymbol3D`,[^(14)](#A458961_1_En_5_Chapter.html#Fn14)
    `IconSymbol3DLayer`,[^(15)](#A458961_1_En_5_Chapter.html#Fn15) and `ObjectSymbol3DLayer`.[^(16)](#A458961_1_En_5_Chapter.html#Fn16)


    The `PointSymbol3D` symbol does exactly what it says it does. It allows you to
    display point data in a 3D `SceneView`. Alone, it doesn’t do much, but that’s
    what the other two symbols are used for.


    The `IconSymbol3DLayer` symbol lets you define a symbol that can be used in a
    3D environment and draped over a surface. Each of these symbols has primitive
