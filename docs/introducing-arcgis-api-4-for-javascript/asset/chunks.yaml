  trans: "\n### 类型定义\n\n你可以在 GitHub 上阅读更多关于安装 ArcGIS API 或 JavaScript 类型定义的信息。¹⁰ 关键在于，你可以通过\
    \ `npm install --save @types/arcgis-js-api` 轻松安装类型定义。\n\n需要注意的是，这并不会安装 Dojo 的类型定义。如果你想在\
    \ TypeScript 开发中使用一些 Dojo 模块，你可以获取 `dojo-typings`¹¹ 并在 `tsconfig.json` 文件中进行如下配置：\n\
    \n```\n1     \"types\": [ \"arcgis-js-api\" ],\n2     \"include\": [\n3      \
    \ \"./src/app/**/*\"\n4     ],\n5     \"exclude\": [\n6       \"node_modules\"\
    \n7     ],\n8     \"files\": [\n9       \"node_modules/dojo-typings/dojo/1.11/modules.d.ts\"\
    ,\n10       \"node_modules/dojo-typings/dijit/1.11/modules.d.ts\",\n11       \"\
    node_modules/dojo-typings/dojox/1.11/modules.d.ts\",\n12       \"node_modules/dojo-typings/custom/dgrid/1.1/dgrid.d.ts\"\
    ,\n13       \"node_modules/dojo-typings/custom/dstore/1.1/dstore.d.ts\",\n14 \
    \      \"node_modules/intern/typings/intern/intern.d.ts\"\n15     ]\n```\n\n你可以阅读更多关于\
    \ `tsconfig.json` 文件的信息。¹² `tsconfig.json` 文件用于配置 TypeScript 编译器。\n\n### JSX\n\
    \n这个更新的微件框架还引入了 JSX¹³ 的使用，该语法由 React¹⁴ 推广开来。JSX 在 JavaScript 中看起来非常像 HTML，只是其语法需要一个编译步骤来将\
    \ JSX 转换为 JavaScript 函数。\n\n例如，JSX `<h1>hello!</h1>` 会被编译成一个看起来像 `h('h1', 'hello!')`\
    \ 的函数。这种创建 DOM 元素的方法被称为 HyperScript。¹⁵ 在使用 ArcGIS API for JavaScript 进行自定义微件开发时，如果你使用了\
    \ JSX，则无需关心 HyperScript。\n\n## 构建自定义微件\n\n在深入构建自定义微件之前，你可以在 GitHub 上找到演示应用程序的源代码（见图\
    \ 7-1）。¹⁶\n\n![A458961_1_En_7_Fig1_HTML.jpg](img/A458961_1_En_7_Fig1_HTML.jpg)\n\
    \n图 7-1\n\n自定义微件开发\n\n在此示例中，你将构建的微件将显示一个图表，该图表代表地图视图中可见的数据。关键在于确保图表仅基于可见数据，以便在平移地图时图表能够随之更新。\n\
    \n### 存储与 ViewModel\n\n第一步是构建一个应用程序存储。这个应用程序存储将包含用于描述应用程序状态的属性。在此应用程序中，你需要关注 `View`\
    \ 和 `WebMap`。你可以参考前面的章节，了解如何为此类任务使用 `Accessor` 模块。¹⁷\n\n对于每个继承自 `Accessor` 的 TypeScript\
    \ 文件，你需要添加以下 `amd-dependency` 行：\n\n```\n1   /// \n3   /// \n```\n\n在后续示例中我将省略它们，但请注意它们是必需的。\n\
