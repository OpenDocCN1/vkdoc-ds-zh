    19   });

    ```


    现在，当请求图像时，这将为动态地图服务的子图层传递一个 `definitionExpression`。这遵循了 ArcGIS API for JavaScript
    整个第 4 版的主题，即提供更简单的 API。我完全期望人们会利用这个更易用的 API，在他们的应用程序中实现 `MapImageLayer` 的实用功能。


    在 ArcGIS API 4 for JavaScript 的第 4 版中，你定义的子图层将是 `MapImageLayer` 中唯一使用的子图层。如果你正在处理一个包含数百个图层的地图服务，这将非常有用，我个人见过太多这样的情况。


    你还可以为每个子图层定义一个 `popupTemplate`² 和一个 `renderer`³。


    ```

    1   const layer = new MapImageLayer({

    2     url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/Census/MapSe\

    3   rver",

    4     sublayers: [

    5     {

    6       id: 3,

    7       visible: true,

    8       renderer: {type: "simple",

    9         symbol: { type: "simple-fill",

    10           style: "solid",

    11           color: "dodgerblue",

    12           outline: {

    13             width: 0.5,

    14             color: "white"

    15           }

    16         },

    17         label: "State boundaries"

    18       },

    19       opacity: 0.5

    20     },

    21     {

    22       id: 2,

    23       visible: true,

    24       popupTemplate: {

    25           title: "{NAME}",

    26           content: [

    27           {

    28             fieldInfos: [

    29               {

    30                 fieldName: "POP2000",

    31                 visible: true,

    32                 label: "Population for year 2000",

    33                 format: {

    34                   places: 0,

    35                   digitSeparator: true

    36                 }

    37               },

    38               {

    39                 fieldName: "POP2007",

    40                 visible: true,

    41                 label: "Population for year 2007",

    42                 format: {

    43                   places: 0,

    44                   digitSeparator: true

    45                 }

    46               }

    47             ]

    48           },

    49           {

    50             type: "media",

    51             mediaInfos: [

    52               {

    53                 title: "Population",

    54                 type: "column-chart",

    55                 caption: "",

    56                 value: {

    57                   theme: "Grasshopper",

    58                   fields: [ "POP2000", "POP2007" ],

    59                   normalizeField: null,

    60                   tooltipField: null

    61                 }

    62               }

    63             ]

    64           }

    65           ]

    66         }

    67     },

    68     {

    69       id: 0,

    70       visible: true,

    71       definitionExpression: "POP2000 > 100000"

    72     }]

    73   });

    ```


    这非常强大，因为你现在可以像使用 `FeatureService` 一样轻松地处理地图服务。在 API 的 3.x 版本中，为动态地图服务定义自定义渲染器的功能已经存在了一段时间，并且作为
    ArcGIS Server 地图服务的一部分也已经存在了一段时间。从 ArcGIS API for JavaScript 的第 4 版开始，新特性是它简化了
    API，使开发人员更容易利用这一功能。能够为每个子图层定义弹出窗口的功能增加了 `MapImageLayer` 的实用性，我毫不避讳地说，我认为这是我现在个人最喜欢的
    API 图层。


    你还可以通过查询表和表连接对 `MapImageLayer` 做更多事情，前提是你的服务中有这些数据。请查看文档⁴了解这些细节，并尽情享受 `MapImageLayer`
    的强大功能。


    ### CSVLayer


    `CSVLayer`⁵ 在 ArcGIS API 4 for JavaScript 中非常有用，用于在空间上表示表格数据。


    只要 CSV 文件具有以下名称的坐标字段，它就可以为你转换文件：


    *   经度字段名称：`lon`、`lng`、`long`、`longitude`、`x`、`xcenter`、`longitude83`、`longdecdeg`、`POINT-X`

    *   纬度字段名称：`lat`、`latitude`、`y`、`ycenter`、`latitude83`、`latdecdeg`、`POINT-Y`


    如果你的 CSV 文件不符合该格式，你可以使用 `CSVLayer` 的 `latitudeField` 和 `longitudeField` 属性指定自定义的纬度和经度字段名称。


    ```

    1   let csvLayer = new CSVLayer({

    2    url: "http://ontheinternet/mydata.csv",

    3    copyright: "Please provide a copyright for the data"

    4   });

    ```


    请注意，根据 CSV 文件的来源，你可能需要在应用程序中提供一个 `proxyRule`。


    ```

    1   urlUtils.addProxyRule({

    2    urlPrefix: "ontheinternet",

    3    proxyUrl: "/proxy/"

    4   });

    ```


    ### SceneLayer


    处理 3D 地图的一个关键组件是 `SceneLayer`。`SceneLayer` 允许你将场景服务⁶ 加载到你的 3D 地图应用程序中。一旦你有了 `SceneLayer`，通过
    `SceneView` 将其添加到你的 3D 地图中就相当简单了。


    ```

    1   const sceneLayer = new SceneLayer({

    2     url: "http://scene.arcgis.com/arcgis/rest/services/Hosted/Building_Boston/Scen\

    3   eServer/layers/0";

    4   });


    6   const map = new Map({

    7     basemap: "streets",

    8     ground: "world-elevation",

    9     layers: [sceneLayer]

    10   });


    12   const view = new SceneView({

    13     container: "viewDiv",

    14     map: map,

    15     scale: 50000000,

    16     center: [-101.17, 21.78]

    17   });

    ```


    我将在后面的章节中介绍 3D 可视化和 `SceneView`，但你真正需要知道的是，将 `SceneLayer` 添加到你的地图中与添加其他图层的方式完全相同。

    '
- fmt: '### `VectorTileLayer`


    Vector tiles are pretty interesting. Mapbox released the Vector Tile Specification[⁷](#A458961_1_En_3_Chapter.html#Fn7)
    not too long ago, and it has proven to be incredibly versatile. The file size
    for vector tiles is small, which allows for some high-resolution basemaps and
    efficient caching of data. Vector tiles basically store vector data in a compact
    format that allows for a flexible styling of those vector features in the browser.
    This is as opposed to creating tiled images of that data that cannot be styled
    in the browser.


    You will typically have a single service that provides all the vector tiles for
    your applications. You can, however, load different styles for those services
    so you can load the same data but with a different look.


    When you initialize a `VectorTileLayer`, you do it the same way you do every other
    layer.


    ```

    1   const tileLyr = new VectorTileLayer({

    2     url: "https://www.arcgis.com/sharing/rest/content/items/f96366254a564adda1dc46\

    3   8b447ed956/resources/styles/root.json"

    4   });

    ```


    If you look at the URL used to initialize a `VectorTileLayer`, you can see that
    it actually points to a style file instead of a specific layer ID. The URL you
    point to is `resources/styles/root.json`. This is actually just a style file that
    defines how the `VectorTileLayer` should be styled when it is rendered on the
    map.


    You can actually switch the style of your `VectorTileLayer` during runtime by
    using the `loadStyle()` method, as in `vectorTileLayer.loadStyle(myNewStyleObject)`.


    Vector tiles are a treat for cartographers because vector tiles provide flexibility
    to design some very stylish and impactful basemaps. You can test the styling the
    ArcGIS vector tile basemaps via this vector tile style editor: [`https://github.com/Esri/arcgis-vectortile-style-editor`](https://github.com/Esri/arcgis-vectortile-style-editor).


    Recently, the ArcGIS API 4 for JavaScript started using its own implementation
    for vector tiles. This new implementation allows the API to render vector tiles
    of different projections and makes them usable in a 3D environment; however, the
    current implementation does not support Mapbox tiles.


    Vector tiles provide incredibly crisp and good-looking maps. It’s important to
    know that vector tiles make use of WebGL,[⁸](#A458961_1_En_3_Chapter.html#Fn8)
    which relies on your video card and browser support. If you see some artifacts
    or you notice smoke coming out of your laptop, you may want to look into upgrading
    your video card drivers.


    ### `GroupLayer`


    The `GroupLayer`[⁹](#A458961_1_En_3_Chapter.html#Fn9) is an interesting layer.
    It doesn’t pull data from a web service; however, it will allow you to group your
    layers together. The layers don’t need to be of the same type; you can group a
    `GraphicsLayer` with a `TiledLayer`, and everything will simply work. A use case
    where this could be useful is controlling the visibility of multiple similar or
    related `FeatureLayer`s. Let’s take a look at the following sample:


    ```

    1   import Map from "esri/Map";

    2   import MapView from "esri/views/MapView";

    3   import FeatureLayer from "esri/layers/FeatureLayer";

    4   import GroupLayer from "esri/layers/GroupLayer";


    6   const URL = "http://tmservices1.esri.com/arcgis/rest/services/LiveFeeds/NOAA_sto\

    7   rm_reports/MapServer";

    8   const titles = [

    9     "NOAA HAIL Storm Reports (24 hours)",

    10     "NOAA TORNADO Storm Reports (24 hours)",

    11     "NOAA WIND Storm Reports (24 hours)",

    12     "NOAA TORNADO Storm Reports (past week)"

    13   ];

    14   const layers = [0, 1, 2, 3].map((index, idx) => {

    15     return new FeatureLayer({

    16       url: `${URL}/${index}`,

    17       outFields: ["*"],

    18       popupTemplate: {

    19         title: titles[idx],

    20         content: "{*}"

    21       }

    22     });

    23   });

    24   const groupLayer = new GroupLayer({ layers });

    25   const map = new Map({

    26     basemap: "streets",

    27     layers: [groupLayer]

    28   });

    29   const view = new MapView({

    30     container: "viewDiv",

    31     map,

    32     center: [-98.648, 36.374],

    33     zoom: 5,

    34     ui: {

    35       components: ["zoom", "attribution", "compass"]

    36     }

    37   });

    38   view.then(() => {

    39     const btn = document.createElement("div");

    40     btn.className = "esri-button esri-widget-button esri-interactive esri-icon-fea\

    41   ture-layer";

    42     btn.title = "Toggle Storm Data";

    43     view.ui.add(btn, "top-right");

    44     // toggle layer visibility of GroupLayer

    45     btn.addEventListener("click", () => {

    46       groupLayer.visible = !groupLayer.visible;

    47     });

    48   });

    ```


    What you are able to do here is toggle the visibility of the `GroupLayer`. When
    you do this, the visibility of the grouped layers is also toggled.'
