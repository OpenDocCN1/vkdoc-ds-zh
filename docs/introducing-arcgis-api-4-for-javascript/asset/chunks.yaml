    # 5. Scenes


    By far one of the most exciting features of ArcGIS API 4 for JavaScript is the
    introduction of 3D scenes. A 3D scene is a remarkable new way to visualize your
    data (see Figure [5-1](#A458961_1_En_5_Chapter.html#Fig1)).


    ![A458961_1_En_5_Fig1_HTML.jpg](A458961_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Sample scene using Pictometry Imagery


    You can create and publish scenes using the Scene Viewer ,[¹](#A458961_1_En_5_Chapter.html#Fn1)
    which is part of the ArcGIS Online platform.[²](#A458961_1_En_5_Chapter.html#Fn2)
    When you author your scenes in the Scene Viewer, they are saved to your account
    where you can share them with others. You can then use these scenes with your
    ArcGIS API 4 for JavaScript application using the item ID of your scene.


    Scenes themselves are created and published in ArcGIS Pro.[³](#A458961_1_En_5_Chapter.html#Fn3)
    You can update the scene in the Scene Viewer and modify or create new slides.[⁴](#A458961_1_En_5_Chapter.html#Fn4)
    The scenes you can update and modify in the Scene Viewer can then be viewed in
    your ArcGIS API 4 for JavaScript application.


    Loading a `WebScene` [⁵](#A458961_1_En_5_Chapter.html#Fn5) is extremely easy;
    it’s just like loading a `WebMap`.


    ```

    1   import WebScene from "esri/WebScene";

    2   import SceneView from "esri/views/SceneView";


    4   const scene = new WebScene({

    5     portalItem: {

    6       id: "082c4fd545104f159db39da11ea1e675"

    7     }

    8   });


    10   const view = new SceneView({

    11     map: scene,

    12     container: "viewDiv"

    13   });

    ```


    That’s all you have to do to display your scene with the ArcGIS JavaScript API.


    What differentiates a scene from a regular map? I’ll make this simple: 3D.


    Scenes have elevation data, meaning you can work with terrains and buildings.
    When you place features on the map, you can drape them, as if you draping a sheet
    over your bed. You can also billboard the symbols, just like advertising billboards
    (see Figure [5-2](#A458961_1_En_5_Chapter.html#Fig2)).


    ![A458961_1_En_5_Fig2_HTML.jpg](A458961_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Sample 3D symbols in a scene


    ## SceneView


    The `SceneView` shares a similar API to a `MapView` because they both are based
    on the `View` [⁶](#A458961_1_En_5_Chapter.html#Fn6) module. As you have already
    learned, views are responsible for the rendering of data in the `Map`, `WebMap`,
    or `WebScene`.


    To understand the `SceneView`, you need to understand a couple of the unique properties
    you can work with.


    *   `camera` [⁷](#A458961_1_En_5_Chapter.html#Fn7)

    *   `environment` [⁸](#A458961_1_En_5_Chapter.html#Fn8)'
