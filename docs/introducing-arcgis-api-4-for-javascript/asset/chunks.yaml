    \ the Author and About the Technical Reviewer\n\nAbout the Author  \nAbout the\
    \ Technical Reviewer\n\n# 1. Introduction\n\nThe ArcGIS API for JavaScript has\
    \ evolved over the years to include new features that can take advantage of updates\
    \ in ArcGIS Server and ArcGIS Online. The move to version 4 of the API is one\
    \ of the biggest leaps in technology and features since its initial release. This\
    \ version of the API introduces some new concepts for developers and makes 3D\
    \ scenes easier for developers to add to their applications.\n\n## Where to Get\
    \ the ArcGIS API\n\nYou can find more information about the API at [`https://developers.arcgis.com/javascript/latest`](https://developers.arcgis.com/javascript/latest).\n\
    \n## Key Concepts\n\nThe ArcGIS API 4 for JavaScript embraces some concepts included\
    \ in earlier versions of the API and introduces some new concepts. These are discussed\
    \ in more detail through the book but are detailed briefly here:\n\n*   Asynchronous\
    \ Module Definition (AMD): This is the module system used by Dojo and is well\
    \ suited for larger application development.\n*   Maps, layers, and views: The\
    \ map, with its layers and view relationship, is key. A map is a data source that\
    \ can be linked to multiple views.\n*   Accessors: Accessors are powerful implementations\
    \ of the API that provide a rich suite of features.\n*   Collections: These are\
    \ array-like data stores that can also emit change events.\n*   Promises: The\
    \ API has always used promises for asynchronous operations, but they play an even\
    \ more important role in version 4.\n*   Widgets and the UI: The widgets and UI\
    \ of the Map in the API have been completely rewritten and rearchitected for version\
    \ 4.\n*   Web scenes and local scenes: Scenes are an exciting addition to the\
    \ JavaScript API because they bring 3D capabilities into the hands of developers.\n\
    \n## Things You Need to Know\n\nI think it's fair to say that you should have\
    \ some basic programming experience if you are reading this book. If you have\
    \ JavaScript experience, that would be even better because this book will not\
    \ cover JavaScript basics. There are plenty of resources you can find online to\
    \ get caught up with JavaScript, and I recommend you do.\n\nYou don't need to\
    \ know geographic information systems (GISs). I'm working under the assumption\
    \ you know what a map is, and that's all."
