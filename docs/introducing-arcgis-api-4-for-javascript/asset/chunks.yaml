  raw: '## Portal API


    While using the ArcGIS API 4 for JavaScript , with `WebMap`s, `WebScene`s, and
    even layers, the underlying API that powers most of this is the Portal API. The
    Portal API consists of a set of modules, ranging from the `Portal` class itself[^(10)](#A458961_1_En_3_Chapter.html#Fn10)
    to `PortalItem`.[^(11)](#A458961_1_En_3_Chapter.html#Fn11) You can utilize the
    Portal API to build a robust data explorer of your portal, but it’s also used
    in more subtle ways throughout the API.


    ```

    1   const webmap = new WebMap({

    2     portalItem: {

    3       id: webmapid

    4     }

    5   });


    7   const webscene = new WebScene({

    8     portalItem: {

    9       id: sceneid

    10     }

    11   });

    ```


    These examples use autocasting, which is covered in Chapter [4](#A458961_1_En_4_Chapter.html).


    Both `WebMap` and `WebScene` utilize the Portal API under the hood to build their
    respective maps and scenes. For example, a `WebMap` may consist of three layers
    from a portal. Each layer is referenced by its own portal item ID. When you load
    a `WebMap` by its ID, the Portal API is used to load that `WebMap` and then recursively
    load each layer item referenced by an ID or possibly simply a URL. The beauty
    of this is that when a map and even a layer is created, those resources are not
    immediately loaded. What this means for you as a developer is that you could initialize
    a group of `WebMap`s or layers without loading all their required resources and
    instead load that data only as needed. This is incredibly efficient for development
    purposes.


    Let’s look at what an application loading portal items may look like (Figure [3-2](#A458961_1_En_3_Chapter.html#Fig2)).


    ![A458961_1_En_3_Fig2_HTML.jpg](A458961_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Adding layers via portal items


    You’ll use `calcite-bootstrap` [^(12)](#A458961_1_En_3_Chapter.html#Fn12) to help
    you style this app because it already has styling for nice-looking portal item
    cards built in. You can modify an existing sample[^(13)](#A458961_1_En_3_Chapter.html#Fn13)
    to be a bit more explicit about working portal items and the generated layers.


    ```


