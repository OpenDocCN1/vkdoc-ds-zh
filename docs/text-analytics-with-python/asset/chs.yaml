  \    4800 non-null object\ngenres         4800 non-null object\npopularity     4800\
  \ non-null float64\ndescription    4800 non-null object\ndtypes: float64(1), object(5)\n\
  memory usage: 262.5+ KB\ndf.head()\n```\n\n现在，我们将构建自己的电影推荐系统。其流程中的主要组件如下：\n\n- 文本预处理\n\
  - 特征工程\n- 文档相似度计算\n- 基于样片查找最相似的电影\n- 构建电影推荐器\n\n推荐的核心在于理解那些使我们偏爱某一选择而非另一选择的内在特征。项目之间的相似性（在本例中为电影）是理解我们为何选择一部电影而非另一部的一种方式。计算两个项目相似度的方法有多种。最广泛使用的度量之一就是余弦相似度，我们之前使用过，很快将再次使用。\n\
  \n### 文本预处理\n\n在构建特征之前，我们将对电影描述进行一些基本的文本预处理。不需要太复杂，因为此处的重点在于文档相似度，而非文本处理本身。\n\n\
  ```\nimport nltk\nimport re\nimport numpy as np\nstop_words = nltk.corpus.stopwords.words('english')\n\
  def normalize_document(doc):\n"
- '# 转为小写并移除特殊字符/空白

  doc = re.sub(r''[^a-zA-Z0-9\s]'', ", doc, re.I|re.A)

  doc = doc.lower()

  doc = doc.strip()

  ### 分词

  tokens = nltk.word_tokenize(doc)

  '
- '# 过滤停用词

  filtered_tokens = [token for token in tokens if token not in stop_words]

  '
- "# 从过滤后的词元重新生成文档\ndoc = ' '.join(filtered_tokens)\nreturn doc\nnormalize_corpus\
  \ = np.vectorize(normalize_document)\nnorm_corpus = normalize_corpus(list(df['description']))\n\
  len(norm_corpus)\n```\n\n接下来，我们进行文本表示，这可以通过利用像 TF-IDF 这样的特征工程方案来实现。\n\n### 提取 TF-IDF\
  \ 特征\n\n我们在第 4 章中详细讨论了 TF-IDF 表示方案。在此，我们利用它来向量化预处理后的电影描述，从而将其转换为数值向量。\n\n```\nfrom\
  \ sklearn.feature_extraction.text import TfidfVectorizer\ntf = TfidfVectorizer(ngram_range=(1,\
  \ 2), min_df=2)\ntfidf_matrix = tf.fit_transform(norm_corpus)\ntfidf_matrix.shape\n\
  (4800, 20667)\n```\n\n我们采用一元分词和二元分词作为特征，并移除在整个语料库中仅出现在一个文档中的词汇。现在，我们已经使用基于 `tf-idf`\
  \ 的向量表示对文档进行了标准化和向量化处理，接下来将探讨如何使用余弦相似度计算文档相似度。\n\n### 用于成对文档相似度的余弦相似度\n\n我们已经了解了计算余弦相似度的概念，并将其应用于术语相似度。在此，我们复用相同的概念来计算文档之间的余弦相似度得分，而非术语。文档向量将是基于词袋模型的向量，但其中的值采用\
  \ TF-IDF 值而非词频。因此，最终我们将得到一个 *N x N* 的矩阵，其中 *N* 等于电影数量，即 4,800。见图 7-6。\n\n![../images/427287_2_En_7_Chapter/427287_2_En_7_Fig6_HTML.jpg](img/427287_2_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6  \n成对文档余弦相似度\n\n```\nfrom sklearn.metrics.pairwise import cosine_similarity\n\
  doc_sim = cosine_similarity(tfidf_matrix)\ndoc_sim_df = pd.DataFrame(doc_sim)\n\
  doc_sim_df.head()\n```\n\n现在，在构建电影推荐系统之前，我们将构建一个工作流，用于确定与样片最相似且值得推荐的电影。在此之前，我们先构建数据集中所有电影标题的列表。\n\
  \n```\nmovies_list = df['title'].values\nmovies_list, movies_list.shape\n(array(['Avatar',\
  \ \"Pirates of the Caribbean: At World's End\", 'Spectre',\n..., 'Signed, Sealed,\
  \ Delivered', 'Shanghai Calling',\n'My Date with Drew'], dtype=object), (4800,))\n\
  ```\n\n通常，我们可以索引成对相似度矩阵来获取用于推荐的文档相似度。\n\n### 查找样片的最相似电影\n\n以最受欢迎的电影之一《神偷奶爸》为例，尝试找出最相似的可推荐电影。以下是主要步骤，后续将有助于我们构建通用函数。\n\
  \n#### 查找电影 ID\n\n由于我们拥有电影列表，因此在数据集中找到该电影的位置索引非常简单。\n\n```\nmovie_idx = np.where(movies_list\
  \ == 'Minions')[0][0]\nmovie_idx\n```\n\n#### 获取电影相似度\n\n现在，我们将使用这个位置索引来获取与所有电影（与索引为\
  \ 546 的电影《神偷奶爸》相关）的成对电影相似度向量。\n\n```\nmovie_similarities = doc_sim_df.iloc[movie_idx].values\n\
  movie_similarities\narray([0.0104544 , 0.01072835, 0\\.        , ..., 0.00690954,\
  \ 0\\.        ,\n0\\.        ])\n```\n\n\n\n### 获取最相似的五个电影 ID\n\n现在，我们开始获取与电影*小黄人大眼萌*最相似的前五部电影。请记住，我们关注的是获取电影索引，而非显示相似度数值。\n\
  \n```\nsimilar_movie_idxs = np.argsort(-movie_similarities)[1:6]\nsimilar_movie_idxs\n\
  array([506, 614, 241, 813, 154], dtype=int64)\n```\n\n### 获取最相似的五个电影名称\n\n由于我们已经掌握了电影索引位置，可以轻松获得与*小黄人大眼萌*最相似的前五部电影。\n\
  \n```\nsimilar_movies = movies_list[similar_movie_idxs]\nsimilar_movies\narray(['Despicable\
  \ Me 2', 'Despicable Me',\n'Teenage Mutant Ninja Turtles: Out of the Shadows', 'Superman',\n\
  'Rise of the Guardians'], dtype=object)\n```\n\n效果不错！排名前两位的电影与*小黄人大眼萌*确实高度相似，事实上它们都属于*神偷奶爸*系列。\n\
  \n### 构建电影推荐系统\n\n现在，是时候整合我们学到的所有知识，构建一个电影推荐系统了。我们将创建一个电影推荐函数，它需要将电影标题、电影标题列表以及文档相似度矩阵数据框作为输入参数。\n\
  \n```\ndef movie_recommender(movie_title, movies=movies_list, doc_sims=doc_sim_df):\n\
  #### 查找电影 ID\nmovie_idx = np.where(movies == movie_title)[0][0]\n#### 获取电影相似度\n\
  movie_similarities = doc_sims.iloc[movie_idx].values\n"
- '# 获取前 5 个相似电影 ID

  similar_movie_idxs = np.argsort(-movie_similarities)[1:6]

  '
- '# 获取前 5 部电影

  similar_movies = movies[similar_movie_idxs]

  '
- "# 返回前 5 部电影\nreturn similar_movies\n```\n\n### 获取热门电影列表\n\n我们可以根据流行度评分对电影数据集进行排序，并选取一些最受欢迎的电影。然后，查看这些电影的推荐结果可能会发现一些有趣的现象！参见图\
