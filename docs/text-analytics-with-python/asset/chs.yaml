  67%。


  ## SentiWordNet 词典


  WordNet 语料库是英语中最流行的语料库之一，广泛应用于自然语言处理和语义分析。WordNet 为我们引入了同义词集（synset）的概念。SentiWordNet
  词典基于 WordNet 同义词集，可用于情感分析和意见挖掘。SentiWordNet 词典通常为每个 WordNet 同义词集分配三个情感得分。这些包括一个积极极性得分、一个消极极性得分和一个客观性得分。更多详细信息可在其官方网站
  [`http://sentiwordnet.isti.cnr.it`](http://sentiwordnet.isti.cnr.it) 上找到，包括研究论文和词典的下载链接。我们使用
  NLTK 库，它提供了对 SentiWordNet 的 Python 接口。假设我们有形容词 “awesome”。我们可以使用以下代码片段获取与此词同义词集相关的情感得分。


  ```

  In [8]: from nltk.corpus import sentiwordnet as swn

  ...:

  ...: awesome = list(swn.senti_synsets(''awesome'', ''a''))[0]

  ...: print(''Positive Polarity Score:'', awesome.pos_score())

  ...: print(''Negative Polarity Score:'', awesome.neg_score())

  ...: print(''Objective Score:'', awesome.obj_score())

  Positive Polarity Score: 0.875

  Negative Polarity Score: 0.125

  Objective Score: 0.0

  ```


  现在，让我们构建一个通用函数，用于基于文档中匹配的同义词集来提取和聚合整个文本文档的情感得分。


  ```

  def analyze_sentiment_sentiwordnet_lexicon(review, verbose=False):

  ```




  # 对文本进行分词与词性标注


  ```python

  tagged_text = [(token.text, token.tag_) for token in tn.nlp(review)]

  pos_score = neg_score = token_count = obj_score = 0


  '
- '# 基于词性标签获取 WordNet 同义词集


  '
- "# 若找到同义词集，则获取情感分数\nfor word, tag in tagged_text:\n    ss_set = None\n    if 'NN'\
  \ in tag and list(swn.senti_synsets(word, 'n')):\n        ss_set = list(swn.senti_synsets(word,\
  \ 'n'))[0]\n    elif 'VB' in tag and list(swn.senti_synsets(word, 'v')):\n     \
  \   ss_set = list(swn.senti_synsets(word, 'v'))[0]\n    elif 'JJ' in tag and list(swn.senti_synsets(word,\
  \ 'a')):\n        ss_set = list(swn.senti_synsets(word, 'a'))[0]\n    elif 'RB'\
  \ in tag and list(swn.senti_synsets(word, 'r')):\n        ss_set = list(swn.senti_synsets(word,\
  \ 'r'))[0]\n\n    # 若找到情感同义词集\n    if ss_set:\n        # 累加所有找到的同义词集分数\n       \
  \ pos_score += ss_set.pos_score()\n        neg_score += ss_set.neg_score()\n   \
  \     obj_score += ss_set.obj_score()\n        token_count += 1\n\n"
- "# 汇总最终分数\nfinal_score = pos_score - neg_score\nnorm_final_score = round(float(final_score)\
  \ / token_count, 2)\nfinal_sentiment = 'positive' if norm_final_score >= 0 else\
  \ 'negative'\nif verbose:\n    norm_obj_score = round(float(obj_score) / token_count,\
  \ 2)\n    norm_pos_score = round(float(pos_score) / token_count, 2)\n    norm_neg_score\
  \ = round(float(neg_score) / token_count, 2)\n\n    # 以美观表格展示结果\n    sentiment_frame\
  \ = pd.DataFrame([[final_sentiment, norm_obj_score, norm_pos_score, norm_neg_score,\
  \ norm_final_score]],\n                                    columns=pd.MultiIndex(levels=[['情感统计：'],\n\
  \                                                                    ['预测情感', '客观性',\n\
  \                                                                    '积极', '消极',\
  \ '综合']],\n                                                            labels=[[0,0,0,0,0],[0,1,2,3,4]]))\n\
  \    print(sentiment_frame)\n    return final_sentiment\n```\n\n我们的函数接收一条电影评论，对每个单词标注其对应词性标签，根据词性标签提取匹配同义词集标记的情感分数，最后汇总得分。当我们对示例文档运行该函数时，这一过程会更加清晰。\n\
  \n```python\nIn [10]: for review, sentiment in zip(test_reviews[sample_review_ids],\
  \ test_sentiments[sample_review_ids]):\n...:     print('评论：', review)\n...:    \
