  ## 模型性能评估


  选择最佳模型进行部署取决于多种因素，如模型速度、准确率、易用性、可理解性等。基于我们构建的所有模型，朴素贝叶斯模型训练速度最快，尽管 SVM 模型在测试集上的准确率可能略高，但
  SVM 以速度慢且通常难以扩展而闻名。让我们在测试数据集上对我们最佳调优后的朴素贝叶斯模型进行详细的性能评估。我们使用便捷的`model_evaluation_utils`模块进行模型评估。


