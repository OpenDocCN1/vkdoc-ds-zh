  ## 总结\n\n本章以一个真实世界案例研究为导向，介绍了 IMDB 电影评论数据集，其目标是根据文本内容预测评论的情感。我们涵盖了 NLP 的多个方面，包括文本预处理、标准化、特征工程和文本分类。我们详细介绍了使用情感词典（如\
  \ `TextBlob`、`Afinn`、`SentiWordNet` 和 `Vader`）的无监督学习技术，以展示如何在缺乏标记训练数据的情况下分析情感，这在当今的组织中是一个普遍存在的问题。详细的流程图将文本分类描绘为一个有监督的机器学习问题，帮助我们关联\
  \ NLP 与机器学习，从而在拥有标记数据的情况下，使用机器学习技术和方法论来解决这个预测情感的问题。\n\n对有监督方法的关注是双重的。这包括了传统的机器学习方法，如逻辑回归和支持向量机等模型，以及更新的深度学习模型，包括深度神经网络、RNN\
  \ 和 LSTM。为了以最佳模型性能从电影评论中预测情感，本章涵盖了详细的概念、工作流程、动手实践示例，以及使用多种有监督模型和不同特征工程技术进行的比较分析。本章的最后一部分涵盖了机器学习中一个非常重要的方面，而这在我们的分析中经常被忽视。我们研究了分析和解释正面或负面情感成因的方法。通过几个示例，我们介绍了分析和可视化模型解释及主题模型的方法，让您深入了解如何在您自己的数据集上重用这些框架。本章中使用的方法论应该有助于您在自己的文本数据中解决类似问题。\n\
  \n# 10. 深度学习的展望\n\n本书的重点主要是让您快速掌握自然语言处理的基本技术，因此详细讲解利用深度学习进行 NLP 的应用程序不在当前范围内。然而，我们仍然尝试在本书中展示一些有趣的\
  \ NLP 应用，包括第 4 章，我们在其中介绍了使用深度学习方法（如 `Word2Vec`、`GloVe` 和 `FastText`）处理词嵌入的有趣方法，以及第\
  \ 5 章，我们使用深度学习构建了文本分类模型。本章的目的是充分讨论在深度学习的帮助下 NLP 领域的最新进展，以及它在构建更好的模型、解决更复杂的问题以及帮助我们构建更好、更智能的系统方面所展现的前景。\n\
  \n关于深度学习和人工智能（AI），一直存在很多炒作，怀疑论者将其描绘为失败，而媒体则描绘了失业和所谓杀人机器人崛起的暗淡未来。本章的目的是破除炒作，聚焦于这些方法如何在特征工程和复杂建模等方面以更少的努力帮助构建更好、更通用的系统的现实。深度学习已经在机器翻译、文本生成、文本摘要和语音识别等领域持续取得成功，这些在过去都是非常棘手的问题。除了解决这些问题，它们还使得我们在过去几年中达到了人类水平的准确率！\n\
  \n另一个有趣的方面是构建通用模型或表示的范围，这样我们可以用极少的特征工程工作，在向量空间中表示任何文本语料库。其思想是利用某种形式的迁移学习，使我们能够在处理新文本数据时使用预训练模型（该模型已在大型、丰富的文本语料库上进行了训练）来泛化表示，特别是在数据缺乏的问题中。计算机视觉最好的部分是，我们拥有像\
  \ ImageNet 这样的大型数据集，以及一套预训练好的、精确的模型，如 VGG、Inception 和 ResNet，它们可以作为新问题的特征提取器。但 NLP\
  \ 呢？考虑到文本数据如此多样化、嘈杂且非结构化，这本身就是一个固有的挑战。我们在词嵌入方面取得了一些近期的成功，包括像 `Word2Vec`、`GloVe`\
  \ 和 `FastText` 这样的方法，这些都在第 4 章中介绍过。在本章中，我们将展示几种最先进的通用句子嵌入编码器，与词嵌入模型相比，它们在处理迁移学习任务时，尤其是在小数据量情况下，往往表现出令人惊讶的良好性能。这将展示深度学习为\
  \ NLP 带来的前景。我们将介绍以下模型：\n\n-   平均句子嵌入\n-   `Doc2Vec`\n-   神经网络语言模型 (动手实践演示!)\n- \
  \  Skip-thought 向量\n-   Quick-thought 向量\n-   `InferSent`\n-   通用句子编码器\n\n我们涵盖了基本概念，并展示了一些基于前一章数据集、聚焦情感分析的文本分类问题的动手实践示例，这些示例利用了\
  \ Python 和 TensorFlow。本章基于我最近在一篇热门文章中阐述的想法，如果您感兴趣，也可以在此处访问：[`towardsdatascience.com/deep-transfer-learning-for-natural-language-processing-text-classification-with-universal-1a2c69e5baa9`](https://towardsdatascience.com/deep-transfer-learning-for-natural-language-processing-text-classification-with-universal-1a2c69e5baa9)。本章的目的不仅是讨论一些关于\
  \ NLP 深度学习的通用内容，而且还要通过真实世界的动手实践示例，展示面向 NLP 的尖端、最先进的深度迁移学习模型。让我们开始吧！本章展示的所有代码示例都可以在本书的官方\
  \ GitHub 仓库中找到，您可以在此处访问：[`github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition`](https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition)。\n\
  \n## 我们为何痴迷于嵌入？\n\n嵌入背后这股突如其来的热潮是什么？我相信你们中的许多人都经常听到这个词。让我们先理清基础知识，破除炒作。\n\n*嵌入是一种固定长度的向量，通常用于编码和表示一个实体（文档、句子、单词、图！）。*\n\
  \n我已经在第 4 章和我的[一篇文章](https://towardsdatascience.com/understanding-feature-engineering-part-4-deep-learning-methods-for-text-data-96c44370bbfa)\
  \ (位于 [`towardsdatascience.com/understanding-feature-engineering-part-4-deep-learning-methods-for-text-data-96c44370bbfa`](https://towardsdatascience.com/understanding-feature-engineering-part-4-deep-learning-methods-for-text-data-96c44370bbfa))\
  \ 中，在文本数据和 NLP 的背景下讨论了嵌入的必要性。但为了方便起见，我在此简要重申一下。对于语音或图像识别系统，我们已经在高维数据集中以丰富的密集特征向量（如音频频谱图和图像像素强度）的形式获得了信息。然而，对于原始文本数据，特别是像词袋（BoW）这样的基于计数的模型，我们处理的是各自拥有独立标识符的单个词，这些标识符无法捕捉词之间的语义关系。这就导致了文本数据产生巨大的稀疏词向量，因此，如果没有足够的数据，我们可能会得到较差的模型，甚至会因为维度灾难而导致过拟合。见图\
  \ 10-1。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig1_HTML.jpg](img/427287_2_En_10_Fig1_HTML.jpg)\n\
  \n**图 10-1**  比较音频、图像和文本的特征表示\n\n像*基于神经网络的语言模型*这样的*预测方法*，试图通过查看语料库中的词序列，从相邻词中预测目标词。在此过程中，它学习到了分布式表示，从而为我们提供了密集的词嵌入。\n\
  \n现在你可能会想，这有什么了不起的，我们只是从文本中得到了很多向量。然后呢？嗯，如果我们有良好的文本数据数值表示，能够捕捉到上下文和语义，我们就可以将其用于各种下游真实世界的任务，例如情感分析、文本分类、聚类、摘要、翻译等等。事实是，机器学习或深度学习模型运行在数字上，而嵌入（见图\
  \ 10-2）是将文本数据编码以供这些模型使用的关键。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig2_HTML.jpg](img/427287_2_En_10_Fig2_HTML.jpg)\n\
  \n**图 10-2**  文本嵌入\n\n这里的一个大趋势是寻找所谓的“通用嵌入”，这本质上是在大型语料库上训练深度学习模型获得的预训练嵌入。这使我们能够在各种各样的任务中使用这些预训练的（通用的）嵌入，包括在缺乏足够数据等限制条件下。这是迁移学习的一个完美例子，它涉及利用来自预训练嵌入的先验知识来解决一个全新的任务！下图展示了通用词和句子嵌入的一些最新趋势，感谢\
  \ [HuggingFace](https://medium.com/huggingface) 团队提供的[一篇精彩文章](https://medium.com/huggingface/universal-word-sentence-embeddings-ce48ddc8fc3a)（[`medium.com/huggingface/universal-word-sentence-embeddings-ce48ddc8fc3a`](https://medium.com/huggingface/universal-word-sentence-embeddings-ce48ddc8fc3a)）（见图\
  \ 10-3）！\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig3_HTML.jpg](img/427287_2_En_10_Fig3_HTML.jpg)\n\
  \n**图 10-3**  通用词和句子嵌入的最新趋势（来源：[`medium.com/huggingface/universal-word-sentence-embeddings-ce48ddc8fc3a`](https://medium.com/huggingface/universal-word-sentence-embeddings-ce48ddc8fc3a)）\n\
  \n图 10-3 展示了一些有趣的趋势，包括谷歌的通用句子编码器，我们将详细探讨它。在深入探讨通用句子编码器之前，让我们简要回顾一下词和句子嵌入模型的趋势和发展。\n\
  \n## 词嵌入模型的趋势\n\n词嵌入模型或许是一些更成熟、更早期的模型，其发展始于 2013 年的 `Word2Vec`。利用深度学习（无监督方法），基于在连续向量空间中根据语义和上下文相似性嵌入词向量的三个最常见的模型是：\n\
  \n-   `Word2Vec`\n-   `GloVe`\n-   `FastText`\n\n这些模型基于*分布式语义学*领域的*分布式假设*，该假设告诉我们，在同一上下文中出现和使用的词彼此语义相似，并具有相似的含义（*“一个词由其伴随的伙伴所表征”*）。如果你对细节感兴趣，请务必参阅我关于词嵌入的文章，其中详细介绍了这三种方法！\n\
  \n该领域近期开发的另一个有趣的模型是 [ELMo](https://allennlp.org/elmo)（[`allennlp.org/elmo`](https://allennlp.org/elmo)）。它由艾伦人工智能研究所开发。ELMo\
  \ 取自著名布偶剧《芝麻街》中的同名角色，但同时也是“来自语言模型的嵌入”（Embeddings from Language Models）的缩写。\n\nELMo\
  \ 为我们提供了从深度双向语言模型（biLM）学习到的词嵌入，该模型通常在大规模文本语料库上进行预训练，从而实现迁移学习，并使这些嵌入能够跨不同的 NLP 任务使用。艾伦人工智能告诉我们，ELMo\
  \ 表示是上下文相关的、深层的且基于字符的。它利用形态学线索为即使是 OOV（词汇表外）的标记也形成表示。\n\n## 通用句子嵌入模型的趋势\n\n句子嵌入的概念并不新鲜，因为早在构建词嵌入的时候，构建基线句子嵌入模型的最简单方法之一就是使用平均法。\n\
  \n一个*基线句子嵌入模型*可以通过对每个句子/文档的单个词嵌入取平均来构建（这有点类似于词袋模型，我们丢失了句子中固有的上下文和词序）。我在[我的文章](https://towardsdatascience.com/understanding-feature-engineering-part-4-deep-learning-methods-for-text-data-96c44370bbfa)（[`towardsdatascience.com/understanding-feature-engineering-part-4-deep-learning-methods-for-text-data-96c44370bbfa`](https://towardsdatascience.com/understanding-feature-engineering-part-4-deep-learning-methods-for-text-data-96c44370bbfa)）以及第\
  \ 5 章中都有详细介绍。图 10-4 展示了一种实现方法。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig4_HTML.jpg](img/427287_2_En_10_Fig4_HTML.jpg)\n\
  \n**图 10-4**  基线句子嵌入模型\n\n当然，还有更复杂的方法，比如将句子编码为其词嵌入的线性加权组合，然后移除一些常见的主成分。详情请参阅 [“A\
  \ Simple but Tough-to-Beat Baseline for Sentence Embeddings”](https://openreview.net/forum?id=SyK00v5xx)\
  \ at [`openreview.net/forum?id=SyK00v5xx`](https://openreview.net/forum?id=SyK00v5xx)。\n\
  \n`Doc2Vec` 也是一个非常流行的方法，由 Mikolov 等人在其论文 [“Distributed Representations of Sentences\
  \ and Documents”](https://arxiv.org/abs/1405.4053) 中提出。在此，他们提出了段落向量，这是一种无监督算法，可以从可变长度的文本片段（如句子、段落和文档）中学习固定长度的特征嵌入（见图\
  \ 10-5）。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig5_HTML.jpg](img/427287_2_En_10_Fig5_HTML.jpg)\n\
  \n**图 10-5**  `Word2Vec` vs. `Doc2Vec` (来源: [`arxiv.org/abs/1405.4053`](https://arxiv.org/abs/1405.4053))\n\
  \n基于这种描述，该模型用密集向量表示每个文档，该向量经过训练以预测文档中的词。唯一的区别是，除了常规的词标记之外，还使用了段落或文档 ID 来构建嵌入。这种设计使该模型能够克服词袋模型的弱点。\n\
  \n*神经网络语言模型（NNLM）* 是一个非常早期的想法，基于 Bengio 等人在其 2013 年的论文“A Neural Probabilistic Language\
  \ Model”中提出的神经概率语言模型，他们在其中讨论了学习词的分布式表示，允许每个训练句子向模型提供关于指数级数量语义相邻句子的信息。该模型同时为每个词学习一个分布式表示，以及用这些表示来表达的词序列的概率函数。泛化之所以实现，是因为如果一个从未见过的词序列由与已见过句子中的词相似（在表示相近的意义上）的词组成，那么它就会获得高概率。\n\
  \n谷歌构建了一个通用句子嵌入模型 `nnlm-en-dim128` ([`tfhub.dev/google/nnlm-en-dim128/1`](https://tfhub.dev/google/nnlm-en-dim128/1))，这是一个基于标记的文本嵌入模型，通过在三层隐藏层前馈神经网络语言模型上使用英语\
  \ Google News 200B 语料库训练而成。该模型可以将任何文本映射到 128 维嵌入。稍后我们将在动手实践中使用它！\n\n*Skip-thought\
  \ 向量* 也是基于无监督学习的通用句子编码器领域的首批模型之一。在他们提出的论文 [“Skip-Thought Vectors”](https://arxiv.org/abs/1506.06726)\
  \ 中，他们利用文本（来自书籍）的连续性，训练了一个编码器-解码器模型，该模型试图重建已编码段落的周围句子。具有相似语义和句法属性的句子被映射到相似的向量表示。见图\
  \ 10-6。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig6_HTML.jpg](img/427287_2_En_10_Fig6_HTML.jpg)\n\
  \n**图 10-6**  `Word2Vec` vs. `Doc2Vec` (来源: [`arxiv.org/abs/1405.4053`](https://arxiv.org/abs/1405.4053))\n\
  \n这就像 Word2Vec 的 Skip-gram 模型，但用于句子，我们试图预测给定源句子的周围句子。\n\n*Quick-thought 向量* 是一种更新的、用于学习句子嵌入的无监督方法（见图\
  \ 10-7）。详情请参见论文 “An efficient framework for learning sentence representations”。有趣的是，他们通过用分类器替换常规编码器-解码器架构中的解码器，将预测句子出现上下文的问题重新表述为一个分类问题。\n\
  \n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig7_HTML.jpg](img/427287_2_En_10_Fig7_HTML.jpg)\n\
  \n**图 10-7**  Quick-thought 向量 (来源: [`openreview.net/forum?id=rJvJXZb0W`](https://openreview.net/forum?id=rJvJXZb0W))\n\
  \n因此，给定一个句子及其出现的上下文，一个分类器根据其嵌入表示将上下文句子与其他对比句子区分开来。输入句子首先通过某种函数进行编码。但是，模型不是生成目标句子，而是从一组候选句子中选择正确的目标句子。将生成视为从所有可能的句子中选择一个句子，这可以看作是生成问题的判别式近似。\n\
  \n*InferSent* 有趣地采用了有监督学习方法，使用自然语言推理数据来学习通用句子嵌入。这是硬核的有监督迁移学习，就像我们拥有在计算机视觉的 `ImageNet`\
  \ 数据集上训练的预训练模型一样，他们拥有使用来自斯坦福自然语言推理数据集的监督数据训练得到的通用句子表示。详情请参见他们的论文 [“Supervised Learning\
  \ of Universal Sentence Representations from Natural Language Inference Data”](https://arxiv.org/abs/1705.02364)。\n\
  \n该模型使用的数据集是 SNLI 数据集，包含 570,000 个由人工生成的英语句子对，并手动标记为三类之一：蕴含、矛盾或中立。它捕获了对理解句子语义有用的自然语言推理。见图\
  \ 10-8。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig8_HTML.jpg](img/427287_2_En_10_Fig8_HTML.jpg)\n\
  \n**图 10-8**  `InferSent` 训练方案 (来源: [`arxiv.org/abs/1705.02364`](https://arxiv.org/abs/1705.02364))\n\
  \n基于图 10-8 所示的架构，我们可以看到它使用了一个共享的句子编码器，输出前提 *u* 和假设 *v* 的表示。一旦生成了句子向量，就会应用三种匹配方法来提取\
  \ *u* 和 *v* 之间的关系：\n\n-   拼接 **(u, v)**\n-   逐元素乘积 **u** * **v**\n-   绝对逐元素差 **|u\
  \ - v|**\n\n结果向量然后被馈送到一个三分类器中，该分类器由多个全连接层组成，最后是一个 softmax 层。\n\n来自谷歌的通用句子编码器是最好且最新的通用句子嵌入模型之一，于\
  \ 2018 年初发布！通用句子编码器将任何文本编码为 512 维嵌入，可用于各种 NLP 任务，包括文本分类、语义相似度和聚类。它基于多种数据源和多种任务进行训练，旨在动态适应各种需要建模词序列（而不仅仅是单个词）意义的自然语言理解任务。他们的关键发现是，使用句子嵌入的迁移学习往往优于词嵌入级别的迁移。更多详情请查阅他们的论文\
  \ [“Universal Sentence Encoder”](https://arxiv.org/abs/1803.11175)。本质上，他们在 [TF-Hub](https://tfhub.dev/)\
  \ 上提供了他们模型的两个版本，分别为 [`universal-sentence-encoder`](https://tfhub.dev/google/universal-sentence-encoder/2)（[`tfhub.dev/google/universal-sentence-encoder/2`](https://tfhub.dev/google/universal-sentence-encoder/2)）。版本\
  \ 1 使用基于 transformer 网络的句子编码模型，版本 2 使用深度平均网络（DAN），其中单词和二元组的输入嵌入被平均在一起，然后通过一个前馈深度神经网络（DNN）以生成句子嵌入。稍后我们将在动手实践中使用版本\
  \ 2。\n\n## 理解我们的文本分类问题\n\n是时候将其中一些通用句子编码器付诸实践了！正如文章所述，我们在此演示的前提是聚焦于一个非常流行的 NLP 任务——文本分类，并将其应用于情感分析。我们将使用基准的\
  \ [IMDB 大型电影评论数据集](http://ai.stanford.edu/%257Eamaas/data/sentiment/)。请随意从 [`ai.stanford.edu/~amaas/data/sentiment/`](http://ai.stanford.edu/~amaas/data/sentiment/)\
  \ 下载，或者您也可以从我的 GitHub 仓库 [`github.com/dipanjanS/data_science_for_all/tree/master/tds_deep_transfer_learning_nlp_classification`](https://github.com/dipanjanS/data_science_for_all/tree/master/tds_deep_transfer_learning_nlp_classification)\
  \ 下载。见图 10-9。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig9_HTML.jpg](img/427287_2_En_10_Fig9_HTML.jpg)\n\
  \n**图 10-9**  电影评论情感分析\n\n该数据集总共包含 50,000 条电影评论，其中 25,000 条为正面情感，25,000 条为负面情感。我们将总共使用\
  \ 30,000 条评论作为训练数据集来训练模型，使用 5,000 条评论进行验证，并使用 15,000 条评论作为测试数据集。主要目标是正确预测每条评论的情感是正面还是负面。\n\
  \n## 通用句子嵌入的实际应用\n\n既然我们已经定义了主要目标，让我们将通用句子编码器付诸实践！代码可在本书的 GitHub 仓库 [`github.com/dipanjanS/text-analytics-with-python`](https://github.com/dipanjanS/text-analytics-with-python)\
  \ 中找到。请随意操作。我建议使用基于 GPU 的实例。我喜欢使用 [Paperspace](https://www.paperspace.com/)，你可以在云端启动\
  \ notebook，而无需担心手动配置实例。我的设置是 8 核 CPU、30GB 内存、250GB SSD 和一块 [NVIDIA Quadro P4000](https://www.leadtek.com/eng/products/workstation_graphics%25282%2529/NVIDIA_Quadro_P4000_%252810775%2529/detail)，这通常比大多数\
  \ AWS GPU 实例便宜（但我仍然喜欢 AWS！）。\n\n### 加载依赖项\n\n我们首先安装 `tensorflow-hub`，它能让我们轻松使用这些句子编码器。\n\
