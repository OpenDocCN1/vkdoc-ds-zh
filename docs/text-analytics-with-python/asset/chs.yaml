  \ `tagline` 列和 `overview` 列的文本内容合并成一个新列，命名为 `description`。见图 7-5。\n\n![../images/427287_2_En_7_Chapter/427287_2_En_7_Fig5_HTML.jpg](img/427287_2_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5  \n包含相关属性的 TMDB 5000 电影数据集\n\n```\ndf = df[['title', 'tagline', 'overview',\
  \ 'genres', 'popularity']]\ndf.tagline.fillna(\", inplace=True)\ndf['description']\
  \ = df['tagline'].map(str) + ' ' + df['overview']\ndf.dropna(inplace=True)\ndf.info()\n\
