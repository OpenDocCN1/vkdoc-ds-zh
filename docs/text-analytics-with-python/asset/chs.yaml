- "# 谓词逻辑变换规则\n\n在谓词逻辑中，还有其他几个关于变换规则的重要概念。这些包括实例化和泛化。全称实例化，也称为全称消去，是一条涉及全称量词的推理规则。它告诉我们，如果\
  \ `(∀x) F(x)` 为真，那么 `F(C)` 也为真，其中 `C` 是 `x` 域中存在的任何常量项。这里的变量符号可以被任何基础项替换。说明此规则的一个例子是\
  \ `(∀x) drinks(John, x)` → `drinks(John, Water)`。\n\n全称泛化，也称为全称引入，是一条推理规则，告诉我们如果\
  \ `F(A) ∧ F(B) ∧ F(C) ∧ …` 等都为真，那么我们可以推断 `(∀x) F(x)` 也为真。\n\n存在实例化，也称为存在消去，是一条涉及存在量词的推理规则。它告诉我们，如果给定的表示\
  \ `(∃x) F(x)` 存在，我们可以推断出 `F(C)` 成立，其中 `C` 是一个新的常量或变量符号。这假定在此规则中引入的常量或变量项 `C` 是一个新的常量，在此前的证明或我们现有的知识库中从未出现过。此过程也称为**斯科伦化**，常量\
  \ `C` 被称为**斯科伦常量**。\n\n存在泛化，也称为存在引入，是一条推理规则，告诉我们假定 `F(C)` 为真（其中 `C` 是一个常量项），那么我们可以由此推断出\
  \ `(∃x) F(x)`。这可以通过表示式 `eats_fish(Cat)` → `(∃x) eats_fish(x)` 来体现，该式可翻译为“猫吃鱼，因此至少存在某个东西或某个人吃鱼”。\n\
  \n现在我们来看一些关于如何使用一阶逻辑表示自然语言陈述以及如何从自然语言陈述转换为一阶逻辑的示例。表 1-3 中的示例展示了一阶逻辑表示自然语言陈述的典型用法。\n\
  \n**表 1-3** 使用一阶逻辑表示自然语言陈述\n\n| 序号 | 一阶逻辑表示 | 自然语言陈述 |\n| --- | --- | --- |\n| 1\
  \ | `¬ eats(John, fish)` | 约翰不吃鱼。 |\n| 2 | `is_hot(pie) ∧ is_delicious(pie)` | 这个派又热又美味。\
  \ |\n| 3 | `is_hot(pie) ∨ is_delicious(pie)` | 这个派要么是热的，要么是美味的。 |\n| 4 | `study(John,\
  \ exam) → pass(John, exam)` | 如果约翰复习了考试，他就会通过考试。 |\n| 5 | `∀x student(x) → pass(x,\
  \ exam)` | 所有学生都通过了考试。 |\n| 6 | `∃x student(x) ∧ fail(x, exam)` | 至少有一名学生考试不及格。\
  \ |\n| 7 | `(∃x student(x) ∧ fail(x, exam) ∧ (∀y fail(y, exam) → x=y))` | 恰恰有一名学生考试不及格。\
  \ |\n| 8 | `∀x (spider(x) ∧ black_widow(x)) → poisonous(x)` | 所有黑寡妇蜘蛛都是有毒的。 |\n\n\
  这让我们对一阶逻辑的各种组成部分以及它相对于命题逻辑所提供的实用性和优势有了很好的了解。然而，一阶逻辑也有其自身的局限性。就其本质而言，它允许我们对变量和对象进行量化，但不能对属性或关系进行量化。高阶逻辑则允许我们对关系、谓词和函数进行量化。更具体地说，**二阶逻辑**使我们能够对谓词和函数进行量化，而**三阶逻辑**则使我们能够对谓词的谓词进行量化。尽管它们表达能力更强，但要判定高阶逻辑中所有语句的有效性却极其困难。至此，我们关于语义表示的讨论就结束了。下一节我们将讨论文本语料库。\n\
  \n## 文本语料库\n\n文本语料库是“text corpus”的复数形式，可以定义为大型且结构化的文本或文本数据集合。它们通常由书面或口述文本的主体构成，通常以电子形式存储。这包括将古老的历史文本语料库从物理形式转换为电子形式，以便于分析和处理。文本语料库的主要目的是利用它们进行语言学和统计分析，并将其用作构建自然语言处理工具的数据。\n\
  \n单语语料库仅包含一种语言的文本数据，而多语语料库则包含多种语言的文本数据。要理解文本语料库的重要性，我们必须了解语料库的起源及其背后的原因。这一切都始于语言学的兴起以及人们为研究语言特性和结构而收集与语言相关的数据。在\
  \ 20 世纪 50 年代，人们使用统计和定量方法来分析收集到的数据。然而，由于缺乏大量文本数据来有效应用统计方法，这种方法很快就走到了尽头。除此之外，认知学习和行为科学也获得了大量关注。这促使杰出的语言学家**诺姆·乔姆斯基**构建并制定了一个复杂的、基于规则的语言模型，该模型为构建、标注和分析大规模文本语料库奠定了基础。\n\
  \n### 语料库标注与实用工具\n\n文本语料库都带有丰富的元数据标注，这在利用语料库进行自然语言处理和文本分析以获得有价值的见解时极为有用。文本语料库常见的标注包括词性标注、词干、词元等等。我们来看看一些最常用的文本语料库标注方法和技术。\n\
  \n-   **词性标注：** 这主要用于为每个单词标注一个词性标签，指示其关联的词性。\n-   **词干：** 词的词干是词的一部分，可以附加各种词缀。\n\
  -   **词元：** 词元是一组词的规范形式或基本形式，也称为**主词**。\n-   **依存语法：** 包括找出句子中各成分之间的各种关系并标注这些依存关系。\n\
  -   **成分语法：** 用于根据句子成分（包括短语和从句）为句子添加句法标注。\n-   **语义类型和角色：** 句子的各种成分，包括单词和短语，都会被标注上特定的语义类型和角色，这些类型和角色通常来自知识本体，用以指示它们的功能。这些包括地点、人物、时间、组织、施事、受事、主题等。\n\
  \n高级的标注形式包括为文本添加句法和语义结构。这些是基于依存语法和成分语法的句法分析树。这些专门的语料库也称为**树库**，被广泛用于构建词性标注器、句法分析器和语义分析器。语言学家也广泛使用语料库来创建新的词典和语法规则。诸如搭配、搭配关系和频率计数等特性，使他们能够找到词汇信息、模式、词法句法信息，并用于语言学习。除了语言学领域，语料库还被广泛应用于开发各种自然语言处理工具，如文本标注器、语音识别、机器翻译、拼写和语法检查器、文本转语音和语音转文本合成器、信息检索、实体识别和知识抽取。\n\
  \n\n\n### 流行语料库\n\n以下是一些随着时间推移而构建并不断发展的著名文本语料库资源。本节列举了部分最流行的语料库，旨在激发你的兴趣，你可以进一步查找并深入了解那些吸引你眼球的文本语料库的更多细节。下面列表描述了一些随时间构建的流行文本语料库。\n\
  \n*   **关键词索引：** `KWIC` 是一种诞生于 19 世纪 60 年代的方法论，但在 20 世纪 50 年代左右被语言学家广泛用于索引文档和创建索引语料库。\n\
  *   **布朗语料库：** 这是第一个百万词级的英语语料库，由 Kucera 和 Francis 于 1961 年发布；它也被称为“当代美国英语标准语料库”。该语料库包含来自各种来源和类别的文本。\n\
  *   **LOB 语料库：** 兰开斯特-奥斯陆-卑尔根（`LOB`）语料库是 20 世纪 70 年代由兰开斯特大学、奥斯陆大学和卑尔根挪威人文计算中心合作编纂的。该项目的主要动机是为布朗语料库提供一个对应的英式英语版本。该语料库同样是一个百万词级的语料库，包含来自各种来源和类别的文本。\n\
  *   **柯林斯语料库：** 柯林斯伯明翰大学国际语言数据库（`COBUILD`）于 1980 年在伯明翰大学建立，由柯林斯出版商资助，构建了一个大型的当代英语文本电子语料库，并为后来的语料库如“英语语料库银行”和“柯林斯\
  \ COBUILD 英语词典”铺平了道路。\n*   **CHILDES：** 儿童语言数据交换系统（`CHILDES`）是由 Brian 和 Catherine\
  \ 于 1984 年创建的语料库，作为语言习得数据的存储库，包含来自超过 130 个不同语料库的 26 种语言的转录文本、音频和视频。它最近与一个更大的名为 Talkbank\
  \ 的语料库合并。它被广泛用于分析幼儿的语言和言语。\n*   **WordNet：** 该语料库是一个面向语义的英语词汇数据库。它于 1985 年在乔治·阿米蒂奇的指导下于普林斯顿大学创建。该语料库包含单词和常被称为\
  \ `synsets` 的同义词集。除此之外，它还包含单词定义、关系以及使用单词和同义词集的示例。总的来说，它结合了词典和同义词词典的功能。\n*   **宾夕法尼亚树库：**\
  \ 该语料库包含经过词性标注和句法分析的英语句子，包括 `POS` 标签和基于语法的分析树，这些在树库中很常见。它也可以被定义为语言树库，由宾夕法尼亚大学创建。\n\
  *   **BNC 语料库：** 英国国家语料库（`BNC`）是最大的英语语料库之一，包含超过 1 亿个来自各种来源的口语和书面文本样本。该语料库是 20 世纪末英国英语口语和书面语的代表性样本。\n\
  *   **ANC 语料库：** 美国国家语料库（`ANC`）是一个大型的美式英语文本语料库。它包含自 20 世纪 90 年代以来的超过 2200 万个口语和书面文本样本。其数据来源广泛，包括一些新兴来源，如电子邮件、推文和网站，这些在\
  \ `BNC` 中是不存在的。\n*   **COCA 语料库：** 当代美式英语语料库（`COCA`）是最大的美式英语文本语料库，包含超过 4.5 亿个单词，包括来自不同类别和来源的口语转录文本和书面文本。\n\
  *   **Google N-gram 语料库：** Google N-gram 语料库包含来自书籍、网页等多种来源的超过一万亿个单词。该语料库包含每种语言最高至\
  \ 5-gram 的 n-gram 文件。\n*   **路透社语料库：** 该语料库是路透社新闻文章和报道的合集，于 2000 年发布，专门用于自然语言处理和机器学习研究。\n\
  *   **网页、聊天、电子邮件、推文：** 这些是随着社交媒体的兴起而变得重要的全新形式的文本语料库。我们可以从各种来源获取它们，包括 Twitter、Facebook、聊天室等。\n\
  \n这让我们了解了一些最流行的文本语料库及其随时间演变的情况。在下一节中，我们将讨论如何借助 Python 和自然语言工具包（`NLTK`）平台来访问其中的一些文本语料库。\n\
  \n### 访问文本语料库\n\n我们已经了解了什么是文本语料库，并查看了当今存在的一些流行文本语料库的列表。在本节中，我们利用 `NLTK` 来连接并访问其中一些文本语料库。我们将在下一章更详细地介绍\
  \ `NLTK` 和 Python，所以如果某些语法或代码看起来有点吃力，请不要担心。本节的主要目的是让你了解如何轻松访问和利用文本语料库来满足你的自然语言处理和分析需求。我们还会用到自然语言工具包（`nltk`）库，你可以访问\
  \ [`http://www.nltk.org/`](http://www.nltk.org/) 了解更多关于该项目的详细信息，该网站告诉我们 `NLTK` 是一个用于访问文本资源（包括用于各种自然语言处理和机器学习能力的语料库和库）的完整平台和框架。\n\
  \n首先，请确保你已经安装了 Python。你可以单独安装 Python，或者从 Anaconda 官网 [`https://www.anaconda.com/download`](https://www.anaconda.com/download)\
  \ 下载流行的 Anaconda Python 发行版，该发行版附带了一套完整的分析包，包括 `NLTK`。如果你想了解更多关于 Python 的细节，并确定哪种发行版最适合你，可以前往第\
  \ 2 章快速浏览一下，我们将在那里更详细地介绍这些主题。\n\n假设你现在已经安装了 Python，如果你安装了 Anaconda 发行版，那么你已经安装了\
  \ `NLTK`。请注意，我们在本书中全程使用 Python 3，我们建议每个人都使用最新版本的 Python，最好是 Python 3.5 或更高版本。如果你没有安装\
  \ Anaconda 发行版但安装了 Python，你可以打开终端或命令提示符，运行以下命令来安装 `NLTK`。\n\n```\n$ pip install\
  \ nltk\n```\n\n这将安装 `nltk` 库，你就可以使用它了。然而，`NLTK` 的默认安装并不包含本书所需的所有组件。要安装 `NLTK` 的所有组件和资源，你可以启动\
