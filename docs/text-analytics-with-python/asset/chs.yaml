  \n## 分析语义表示\n\n我们通常以消息的形式进行交流，无论是口语还是书面形式，与他人或界面交互。这些消息通常是词语、短语和句子的集合。它们具有自身的语义和语境。到目前为止，我们讨论了语义以及各种词汇单元之间的关系。但如何表示一条或多条消息所传达的语义含义呢？人类如何理解他人告诉他们的内容？我们如何相信陈述和命题，评估结果并决定采取什么行动？这很容易，因为大脑帮助我们进行逻辑和推理，但在计算上我们能做同样的事情吗？答案是肯定的。像命题逻辑和一阶逻辑这样的框架帮助我们表示语义。我们在第\
  \ 1 章的“语言语义学”部分下的“语义表示”小节中详细讨论过这一点。我们鼓励你再次阅读该部分以加深记忆。在接下来的部分中，我们将通过实际示例和代码，介绍表示命题逻辑和一阶逻辑的方法，以证明或反驳命题、陈述和谓词。\n\
  \n\n\n### 命题逻辑\n\n我们已经解释过，命题逻辑是研究命题、陈述和句子的学科。命题通常是陈述性的，具有真或假的二值。还存在各种逻辑运算符，如合取、析取、蕴含和等价，我们研究将这些运算符应用于多个命题后其行为和结果的影响。让我们以第\
  \ 1 章中关于两个命题 `P` 和 `Q` 的例子为例，它们可以表示如下。\n\n**P**：他饿了  \n**Q**：他会吃一个三明治\n\n现在，我们将基于第\
  \ 1 章中讨论的各种逻辑运算符（更多详情请参阅“命题逻辑”一节），尝试使用 NLTK 为这些命题的运算构建真值表，然后通过计算方式推导出结果。\n\n```\n\
  import nltk\nimport pandas as pd\nimport os\n"
- '# 分配符号和命题

  symbol_P = ''P''

  symbol_Q = ''Q''

  proposition_P = ''He is hungry''

  propositon_Q = ''He will eat a sandwich''

  '
- '# 为命题分配各种真值

  p_statuses = [False, False, True, True]

  q_statuses = [False, True, False, True]

  '
- '# 分配结合了逻辑运算符的各种表达式

  conjunction = ''(P & Q)''

  disjunction = ''(P | Q)''

  implication = ''(P -> Q)''

  equivalence = ''(P  Q)''

  expressions = [conjunction, disjunction, implication, equivalence]

  expressions

  [''(P & Q)'', ''(P | Q)'', ''(P -> Q)'', ''(P  Q)'']

  '
- "# 使用命题逻辑评估每个表达式\nresults = []\nfor status_p, status_q in zip(p_statuses, q_statuses):\n\
  \    dom = set([])\n    val = nltk.Valuation([(symbol_P, status_p),\n    (symbol_Q,\
  \ status_q)])\n    assignments = nltk.Assignment(dom)\n    model = nltk.Model(dom,\
  \ val)\n    row = [status_p, status_q]\n    for expression in expressions:\n   \
  \     # 基于命题真值评估每个表达式\n        result = model.evaluate(expression, assignments)\n\
  \        row.append(result)\n    results.append(row)\n"
- '# 构建结果表

  columns = [symbol_P, symbol_Q, conjunction,

  disjunction, implication, equivalence]

  result_frame = pd.DataFrame(results, columns=columns)

  '
- '# 显示结果

  print(''P:'', proposition_P)

  print(''Q:'', propositon_Q)

  print()

  print(''表达式结果：-'')

  print(result_frame)

  P: He is hungry

  Q: He will eat a sandwich

  Expression Outcomes:-

  P      Q (P & Q) (P | Q) (P -> Q) (P  Q)

  0  False  False   False   False     True      True

  1  False   True   False    True     True     False

  2   True  False   False    True    False     False

  3   True   True    True    True     True      True

  ```


  此输出描述了这两个命题的各种真值。当我们用各种逻辑运算符组合它们时，你会发现结果与我们第 1 章中手动评估的结果一致。例如，`P & Q` 表示“他饿了并且他会吃一个三明治”只有在两个独立命题都为真时才为真。我们使用
  NLTK 的 `Valuation` 类来创建命题及其各种结果状态的字典。我们使用 `Model` 类来评估每个表达式，其中 `evaluate()` 函数内部调用递归函数
  `satisfy()`，该函数有助于根据分配的真值评估每个表达式与命题的结果。


  ### 一阶逻辑


  命题逻辑 (PL) 有几个局限性，例如无法表示事实或复杂的关系与推理。PL 的表达能力也有限，因为对于每个新命题，我们都需要一个独特的符号表示，这使得很难概括事实。而一阶逻辑
  (FOL) 凭借其函数、量词、关系、连接词和符号等特性，在这方面表现出色。它为语义信息提供了更丰富、更强大的表示。第 1 章中“语义表示”下的“一阶逻辑”子节详细介绍了
  FOL 的工作原理。


  在本节中，我们将构建几个 FOL 表示，类似于我们在第 1 章中使用数学表示手动构建的方式。在这里，我们使用类似的语法在代码中构建它们，并利用 NLTK 和某些定理证明器，基于预定义的条件和关系来证明各种表达式的结果，类似于我们对
  PL 所做的。


  你从本节应该获得的关键收获是了解如何在 Python 中表示 FOL 表示，以及如何基于某个目标和预定义的规则与事件，通过证明来执行一阶逻辑推理。你可以使用多个定理证明器来评估表达式和证明定理。NLTK
  包提供了三个证明器，即 `Prover9`、`TableauProver` 和 `ResolutionProver`。第一个是免费的，可以从 [`https://www.cs.unm.edu/~mccune/prover9/download/`](https://www.cs.unm.edu/%257Emccune/prover9/download/)
  下载。你可以将其内容提取到你选择的任何位置。在我们的示例中，我们将同时使用 `ResolutionProver` 和 `Prover9`。以下代码片段有助于设置
  FOL 表达式和评估所需的依赖项。


  ```

  import nltk

  import os

  '
- '# 用于读取 FOL 表达式

  read_expr = nltk.sem.Expression.fromstring

  '
- '# 初始化定理证明器（你可以选择任何一个）

  os.environ[''PROVER9''] = r''E:/prover9/bin''

  prover = nltk.Prover9()

  '
- '# 我在示例中使用以下这个证明器

  prover = nltk.ResolutionProver()

  ```


  现在我们已经准备好了依赖项，让我们评估一些 FOL 表达式。考虑一个简单的表达式：“如果一个实体跳过了另一个实体，则反向情况不可能发生”。假设实体为 `x` 和
  `y`，我们在 FOL 中可以将其表示为 ∀`x` ∀`y` (`jumps_over(x, y)` → ¬`jumps_over(y, x)`)，这意味着对于所有
  `x` 和 `y`，如果 `x` 跳过了 `y`，则意味着 `y` 不能跳过 `x`。现在考虑我们有两个实体——`fox` 和 `dog`——并且 `fox`
  跳过了 `dog`。这个事件可以用 `jumps_over(fox, dog)` 表示。我们的目标是评估在这个表达式和已发生事件的条件下，`jumps_over(dog,
  fox)` 的结果。以下代码片段展示了我们如何做到这一点。


  ```

  '
- '# 设置规则表达式

  rule = read_expr(''all x. all y. (jumps_over(x, y) -> -jumps_over(y, x))'')

  '
- '# 设置已发生的事件

  event = read_expr(''jumps_over(fox, dog)'')

  '
- '# 设置我们想要评估的结果——目标

  test_outcome = read_expr(''jumps_over(dog, fox)'')

  '
- '# 获取结果

  prover.prove(goal=test_outcome,

  assumptions=[event, rule],

  verbose=True)

  [1] {-jumps_over(dog,fox)}                    A

  [2] {jumps_over(fox,dog)}                     A

  [3] {-jumps_over(z4,z3), -jumps_over(z3,z4)}  A

  [4] {-jumps_over(dog,fox)}                    (2, 3)

  Out[9]: False

  ```


  此输出显示，我们的目标 `test_outcome` 的最终结果为 false，即如果 `fox` 已经跳过了 `dog`，那么 `dog` 就不能跳过 `fox`。这基于我们的规则表达式以及分配给证明器中
  `assumptions` 参数的事件。输出中还显示了通向该结果的步骤序列。




  现在让我们考虑另一个 FOL 表达式规则：`∀x studies(x, exam) → pass(x, exam)`。这告诉我们，对于所有`x`的实例，如果`x`为考试而学习，他/她将通过考试。让我们表示这个规则，并考虑两名学生——John
  和 Pierre，假设 John 没有为考试学习，但 Pierre 学习了。那么，我们能根据这个表达式规则判断他们是否会通过考试吗？以下代码片段显示了结果。


  ```

  '
- '# 设置规则表达式

  rule = read_expr(''all x. (studies(x, exam) -> pass(x, exam))'')

  '
- '# 设置要判断的事件和结果

  event1 = read_expr(''-studies(John, exam)'')

  test_outcome1 = read_expr(''pass(John, exam)'')

  '
- '# 获取结果

  prover.prove(goal=test_outcome1,

  assumptions=[event1, rule],

  verbose=True)

  [1] {-pass(John,exam)}                  A

  [2] {-studies(John,exam)}               A

  [3] {-studies(z6,exam), pass(z6,exam)}  A

  [4] {-studies(John,exam)}               (1, 3)

  Out[10]: False

  '
- '# 设置要判断的事件和结果

  event2 = read_expr(''studies(Pierre, exam)'')

  test_outcome2 = read_expr(''pass(Pierre, exam)'')

  '
- '# 获取结果

  prover.prove(goal=test_outcome2,

  assumptions=[event2, rule],

  verbose=True)

  [1] {-pass(Pierre,exam)}                A

  [2] {studies(Pierre,exam)}              A

  [3] {-studies(z8,exam), pass(z8,exam)}  A

  [4] {-studies(Pierre,exam)}             (1, 3)

  [5] {pass(Pierre,exam)}                 (2, 3)

  [6] {}                                  (1, 5)

  Out[11]: True

  ```


  因此，从这些评估中你可以看到，Pierre 确实通过了考试，因为他为考试学习了。然而，John 没有通过考试，因为他没有为考试学习。让我们考虑一个更复杂的例子，涉及多个执行多个动作的实体，如下所示。


  * 有两只狗，Rover（`r`）和 Alex（`a`）

  * 有一只猫，Garfield（`g`）

  * 有一只狐狸，Felix（`f`）

  * 两只动物——Alex（`a`）和 Felix（`f`）——在跑，由 `runs()` 函数表示

  * 两只动物——Rover（`r`）和 Garfield（`g`）——在睡觉，由 `sleeps()` 函数表示

  * 两只动物——Felix（`f`）和 Alex（`a`）——可以跳过另外两只动物，由 `jumps_over()` 函数表示


  基于所有这些假设，以下代码片段构建了一个基于 FOL 的模型，其中包含基于实体和函数的域和赋值。一旦我们构建了这个模型，我们就评估各种基于 FOL 的表达式以确定它们的结果并证明定理，就像我们之前做的那样。


  ```

  '
- '# 定义符号（实体/函数）及其值

  rules = """

  rover => r

  felix => f

  garfield => g

  alex => a

  dog => {r, a}

  cat => {g}

  fox => {f}

  runs => {a, f}

  sleeps => {r, g}

  jumps_over => {(f, g), (a, g), (f, r), (a, r)}

  """

  val = nltk.Valuation.fromstring(rules)

  '
- '# 查看符号及其赋值（字典）的估值对象

  Val

  {''rover'': ''r'', ''runs'': set([(''f'',), (''a'',)]), ''alex'': ''a'', ''sleeps'':
  set([(''r'',), (''g'',)]), ''felix'': ''f'', ''fox'': set([(''f'',)]), ''dog'':
  set([(''a'',), (''r'',)]), ''jumps_over'': set([(''a'', ''g''), (''f'', ''g''),
  (''a'', ''r''), (''f'', ''r'')]), ''cat'': set([(''g'',)]), ''garfield'': ''g''}

  '
- '# 定义域并构建基于 FOL 的模型

  dom = {''r'', ''f'', ''g'', ''a''}

  m = nltk.Model(dom, val)

  '
- '# 评估各种表达式

  m.evaluate(''jumps_over(felix, rover) & dog(rover) & runs(rover)'', None)

  False

  m.evaluate(''jumps_over(felix, rover) & dog(rover) & -runs(rover)'', None)

  True

  m.evaluate(''jumps_over(alex, garfield) & dog(alex) & cat(garfield) & sleeps(garfield)'',
  None)

  True

  '
- '# 将域中的 rover 赋给 x，felix 赋给 y

  g = nltk.Assignment(dom, [(''x'', ''r''), (''y'', ''f'')])

  '
- '# 基于上述赋值的符号评估更多表达式

  m.evaluate(''runs(y) & jumps_over(y, x) & sleeps(x)'', g)

  True

  m.evaluate(''exists y. (fox(y) & runs(y))'', g)

  True

  ```


  此代码片段基于不同符号的估值，根据规则和域描绘了表达式的评估。我们创建基于 FOL 的表达式，并根据预定义的假设查看它们的结果。例如，第一个表达式返回假，因为
  Rover 从不`runs()`，第二个和第三个表达式为真，因为它们满足了所有条件，比如 Felix 和 Alex 可以跳过 Rover 或 Garfield，Rover
  是一只狗且不跑，而 Garfield 是一只猫。


  第二组表达式是基于将 Felix 和 Rover 赋值给域（`dom`）中的特定符号，并在评估表达式时传递该变量（`g`）来进行评估的。我们甚至可以使用`satisfiers()`函数来满足开放公式或表达式，如下所示：


  ```

  '
- '# 哪些动物在跑？

  formula = read_expr(''runs(x)'')

  m.satisfiers(formula, ''x'', g)

  {''a'', ''f''}

  '
- '# 跑且又是狐狸的动物？

  formula = read_expr(''runs(x) & fox(x)'')

  m.satisfiers(formula, ''x'', g)

  {''f''}

  ```


  这些输出不言自明，其中我们评估了一些开放性问题，比如哪些动物在跑？哪些动物既能跑又是狐狸？我们在输出中得到了相关的符号，可以将其映射回实际的动物名称（提示：`a:
  alex, f: felix`）。我们鼓励你通过构建自己的假设、域和规则，尝试更多命题和 FOL 表达式。


