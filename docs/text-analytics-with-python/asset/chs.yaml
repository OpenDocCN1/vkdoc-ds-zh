  \ 是一种非常强大的数学运算，在文档摘要部分，我们将看到更多它的应用！\n\n### 潜在狄利克雷分配\n\n潜在狄利克雷分配（LDA）技术是一种生成式概率模型，其中每个文档被认为包含多个主题的组合，类似于概率潜在语义索引模型。在这种情况下，潜在主题上存在一个狄利克雷先验分布。该技术背后的数学原理相当复杂，因此我们将尝试对其进行总结，因为深入具体细节超出了当前讨论范围。我们推荐读者阅读由\
  \ Christine Doig 在 [`http://chdoig.github.io/pygotham-topic-modeling/#/`](http://chdoig.github.io/pygotham-topic-modeling/#/)\
  \ 上所做的精彩演讲，我们将从中借鉴一些优秀的图示。LDA 模型的板式表示法如图 6-3 所示。\n\n![../images/427287_2_En_6_Chapter/427287_2_En_6_Fig3_HTML.jpg](img/427287_2_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\nLDA 板式表示法（图片由 C. Doug 提供，源自《Python 主题建模入门》）\n\n关于图 6-3 的更多详细信息，请参阅维基百科官方网站上的文章\
  \ [`https://en.wikipedia.org/wiki/Latent_Dirichlet_allocation`](https://en.wikipedia.org/wiki/Latent_Dirichlet_allocation)，其中详细讨论了这些参数。图\
  \ 6-3 很好地展示了每个参数如何与文本文档和词汇项相关联。该模型假定我们有 **M** 篇文档，文档中有 **N** 个词汇，并要生成 **K** 个主题。\n\
  \n![../images/427287_2_En_6_Chapter/427287_2_En_6_Fig4_HTML.jpg](img/427287_2_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n端到端 LDA 框架（图片由 C. Doug 提供，源自《Python 主题建模入门》）\n\n图 6-4 中的黑盒代表了核心算法，它使用前面提及的参数从文档中提取\
  \ **K** 个主题。以下步骤给出了该算法运行过程的极简说明，方便大家理解。\n\n1.  初始化必要的参数。\n\n2.  对于每篇文档，将每个词汇随机初始化为\
  \ **K** 个主题之一。\n\n3.  开始如下迭代过程，并重复多次。对于每篇文档 **D**，文档中的每个词汇 **W**，以及每个主题 **T**：\n\
  \    *   计算 `P(T| D)`，即文档 **D** 中分配给主题 **T** 的词汇比例。\n\n*   计算 `P(W| T)`，即所有包含词汇\
  \ **W** 的文档中，分配给主题 **T** 的比例。\n\n*   以概率 `P(T| D) × P(W| T)` 将词汇 **W** 重新分配为主题 **T**，同时考虑所有其他词汇及其主题分配。\n\
  \n经过多次迭代后，我们就得到了每篇文档的主题混合分布，然后可以从指向某个主题的词汇项中生成该主题的构成要素。这里流行使用的方法被称为*折叠吉布斯采样*。在下面的实现中，我们使用\
  \ `Gensim` 基于论文语料库构建一个基于 LDA 的主题模型。\n\n```\n%%time\nlda_model = gensim.models.LdaModel(corpus=bow_corpus,\
  \ id2word=dictionary, chunksize=1740, alpha=\"auto\", eta=\"auto\", random_state=42,\
  \ iterations=500, num_topics=TOTAL_TOPICS, passes=20, eval_every=None)\nCPU times:\
  \ user 5min 32s, sys: 10.7 s, total: 5min 43s\nWall time: 2min 31s\n```\n\n查看已训练好的主题模型中的主题非常容易，我们可以使用以下代码来生成它们。\n\
  \n\n```python\nfor topic_id, topic in lda_model.print_topics(num_topics=10, num_words=20):\n\
  \    print('主题 #'+str(topic_id+1)+':')\n    print(topic)\n    print()\n```\n`主题\
