  # 语义关系与相似性


  在前几节中，我们探讨了与词汇语义关系相关的各种概念。现在，我们将研究如何根据实体间的语义关系来连接相似实体，并衡量它们之间的语义相似度。语义相似性不同于我们在第
  6 章中讨论的传统相似性度量方法。我们将使用一些与生物实体相关的示例同义词集（如以下代码片段所示）进行分析。


  ```

  tree = wn.synset(''tree.n.01'')

  lion = wn.synset(''lion.n.01'')

  tiger = wn.synset(''tiger.n.02'')

  cat = wn.synset(''cat.n.01'')

  dog = wn.synset(''dog.n.01'')

  '
- '# 创建实体并提取名称和定义

  entities = [tree, lion, tiger, cat, dog]

  entity_names = [entity.name().split(''.'')[0] for entity in entities]

  entity_definitions = [entity.definition() for entity in entities]

  '
- "# 打印实体及其定义\nfor entity, definition in zip(entity_names, entity_definitions):\n\
  \    print(entity, '-', definition)\n    print()\ntree - a tall perennial woody\
  \ plant having a main trunk and branches forming a distinct elevated crown; includes\
  \ both gymnosperms and angiosperms\nlion - large gregarious predatory feline of\
  \ Africa and India having a tawny coat with a shaggy mane in the male\ntiger - large\
  \ feline of forests in most of Asia having a tawny coat with black stripes; endangered\n\
  cat - feline mammal usually having thick soft fur and no ability to roar: domestic\
  \ cats; wildcats\ndog - a member of the genus Canis (probably descended from the\
  \ common wolf) that has been domesticated by man since prehistoric times; occurs\
  \ in many breeds\n```\n\n现在我们对这些实体有了更多了解，我们将尝试基于共同上位词来关联它们。对于每一对实体，我们将在关系层级树中寻找它们的最低共同上位词。关联密切的实体应具有非常具体的上位词，而不相关的实体则应具有非常抽象或通用的上位词。以下代码片段展示了这一点。\n\
  \n![../images/427287_2_En_8_Chapter/427287_2_En_8_Fig2_HTML.jpg](img/427287_2_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n成对共同上位词矩阵\n\n```\ncommon_hypernyms = []\nfor entity in entities:\n  \
  \  # 获取成对的最低共同上位词\n    common_hypernyms.append([entity.lowest_common_hypernyms(compared_entity)[0].name().split('.')[0]\n\
  \                            for compared_entity in entities])\n"
- "# 构建成对最低共同上位词矩阵\ncommon_hypernym_frame = pd.DataFrame(common_hypernyms,\n     \
  \                               index=entity_names,\n                          \
  \          columns=entity_names)\ncommon_hypernym_frame\n```\n\n忽略矩阵的主对角线，对于每一对实体，我们可以看到它们的最低共同上位词，该词揭示了它们之间关系的本质（见图\
  \ 8-2）。树木与其他动物除了同属生物体外并无关联，因此我们得到了它们之间的“生物体”关系。猫与狮子、老虎有关联，因为它们都是猫科动物，在输出结果中我们也能看到这一点。老虎和狮子通过“大型猫科动物”关系相互连接。最后，我们可以看到狗与其他动物之间存在“食肉动物”的关系，因为它们通常都吃肉。\n\
  \n我们还可以使用各种语义概念来衡量这些实体之间的语义相似性。我们将使用*路径相似度*，它基于连接两个术语的最短路径（根据它们的上位词/下位词分类体系）返回一个介于\
  \ `[0, 1]` 之间的值。以下代码片段展示了如何生成这个相似性矩阵（见图 8-3）。\n\n![../images/427287_2_En_8_Chapter/427287_2_En_8_Fig3_HTML.jpg](img/427287_2_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n成对相似性矩阵\n\n```\nsimilarities = []\nfor entity in entities:\n    # 获取成对相似性\n\
  \    similarities.append([round(entity.path_similarity(compared_entity), 2)\n  \
  \                      for compared_entity in entities])\n"
- "# 构建成对相似性矩阵\nsimilarity_frame = pd.DataFrame(similarities, index=entity_names,\n\
  \                                columns=entity_names)\nsimilarity_frame\n```\n\n\
  从图 8-3 的输出结果来看，正如预期，`lion` 和 `tiger` 最为相似，相似度值为 `0.33`；其次是它们与 `cat` 的语义相似度，值为 `0.25`。与其他动物相比，`Tree`\
  \ 的语义相似度值最低。至此，我们关于词汇语义关系分析的讨论就结束了。我们鼓励您利用 WordNet，通过不同的示例探索更多相关概念。\n\n\n\n\n##\
  \ 词义消歧\n\n在上一节中，我们探讨了同形异义词和同音异义词，这些词基本是指外观或发音相似但含义截然不同的词语。其含义取决于词语的使用语境，并依赖于词语语义，也称为*词义*。根据词语的用法识别其正确语义或含义的过程被称为*词义消歧*，其前提是该词语根据语境具有多种含义。这是\
  \ NLP 中一个非常常见的问题，广泛应用于各种场景，例如提高搜索引擎结果的相关性、增强文本连贯性等。\n\n解决该问题有多种方法，包括基于词典和词库的方法，以及有监督和无监督的机器学习方法。全面涵盖所有方法超出了本文范围，因此我们将使用\
  \ Lesk 算法来演示词义消歧。Lesk 算法是由 M. E. Lesk 于 1986 年提出的经典算法。该算法的基本原理是利用词典或词汇定义来解释文本中待消歧的词语，并将这些定义中的词语与我们感兴趣的词语周围的一段文本进行比较。我们将使用\
  \ WordNet 词义库中的定义，而非普通词典。主要目标是返回与目标词语的语境句子及每个词义集的不同定义之间重叠词语或术语数量最多的词义集。以下代码片段利用\
  \ NLTK 演示了如何对多个示例进行词义消歧。\n\n```\nfrom nltk.wsd import lesk\nfrom nltk import word_tokenize\n\
  \n"
- "# 待消歧的样本文本和词语\nsamples = [('The fruits on that plant have ripened', 'n'),\n   \
  \        ('He finally reaped the fruit of his hard work as he won the race', 'n')]\n\
  \n"
- "# 执行词义消歧\nword = 'fruit'\nfor sentence, pos_tag in samples:\n    word_syn = lesk(word_tokenize(sentence.lower()),\
  \ word, pos_tag)\n    print('Sentence:', sentence)\n    print('Word synset:', word_syn)\n\
  \    print('Corresponding definition:', word_syn.definition())\n    print()\n\n\
  Sentence: The fruits on that plant have ripened\nWord synset: Synset('fruit.n.01')\n\
  Corresponding definition: the ripened reproductive body of a seed plant\n\nSentence:\
  \ He finally reaped the fruit of his hard work as he won the race\nWord synset:\
  \ Synset('fruit.n.03')\nCorresponding definition: the consequence of some effort\
  \ or action\n\n"
- "# 待消歧的样本文本和词语\nsamples = [('Lead is a very soft, malleable metal', 'n'),\n    \
  \       ('John is the actor who plays the lead in that movie', 'n'),\n         \
  \  ('This road leads to nowhere', 'v')]\nword = 'lead'\n\n"
- "# 执行词义消歧\nfor sentence, pos_tag in samples:\n    word_syn = lesk(word_tokenize(sentence.lower()),\
  \ word, pos_tag)\n    print('Sentence:', sentence)\n    print('Word synset:', word_syn)\n\
  \    print('Corresponding defition:', word_syn.definition())\n    print()\n\nSentence:\
  \ Lead is a very soft, malleable metal\nWord synset: Synset('lead.n.02')\nCorresponding\
  \ definition: a soft heavy toxic malleable metallic element; bluish white when freshly\
  \ cut but tarnishes readily to dull grey\n\nSentence: John is the actor who plays\
  \ the lead in that movie\nWord synset: Synset('star.n.04')\nCorresponding definition:\
  \ an actor who plays a principal role\n\nSentence: This road leads to nowhere\n\
  Word synset: Synset('run.v.23')\nCorresponding definition: cause something to pass\
  \ or lead somewhere\n```\n\n在这些示例中，我们尝试对两个词语——`fruit` 和 `lead`——在不同文本中进行消歧。你可以看到我们如何使用\
  \ Lesk 算法，根据待消歧词语在每个文档中的用法和语境，获取其正确的词义。这表明`fruit`既可以指一种可食用的实体，也可以指付出努力后所面临的某种后果。我们还看到了`lead`如何既可以指柔软的金属，表示促使某物/某人前往某地，甚至可以指在戏剧或电影中扮演主要角色的演员！\n\
  \n# 命名实体识别\n\n在任何文本文档中，都存在一些特定术语，它们代表更具信息量的实体，并且与文本的其他部分相比具有独特的语境。这些实体被称为*命名实体*，它们更具体地表示现实世界中的对象，例如人物、地点、组织等，通常由专有名词表示。我们可以通过查找文本文档中的名词短语来发现它们。*命名实体识别*，也称为*实体组块/提取*，是信息提取中一种常用的技术，用于识别和分割命名实体，并将其分类或归类到各种预定义的类别下。SpaCy\
  \ 在命名实体识别方面具有出色的能力，你可以在其网站上找到有关他们常用标注方案的详细信息：[`https://spacy.io/api/annotation#named-entities`](https://spacy.io/api/annotation#named-entities)。我们在图\
  \ 8-4 所示的表格中列出了主要的命名实体标签。\n\n![../images/427287_2_En_8_Chapter/427287_2_En_8_Fig4_HTML.jpg](img/427287_2_En_8_Fig4_HTML.jpg)\n\
  \n**图 8-4** 常见命名实体\n\nSpaCy 提供了一种基于多种技术的快速 NER 标注器。其具体算法并未被详细讨论，但文档指出“该算法是多种知名方法的混合体，目前没有在任何单一出版物中描述过”。现在，让我们尝试在一个样本语料库上进行命名实体识别（NER）。为此，我们定义一个示例新闻文档如下。\n\
  \n```\ntext = \"\"\"Three more countries have joined an \"international grand committee\"\
  \ of parliaments, adding to calls for Facebook's boss, Mark Zuckerberg, to give\
  \ evidence on misinformation to the coalition. Brazil, Latvia and Singapore bring\
  \ the total to eight different parliaments across the world, with plans to send\
  \ representatives to London on 27 November with the intention of hearing from Zuckerberg.\
  \ Since the Cambridge Analytica scandal broke, the Facebook chief has only appeared\
  \ in front of two legislatures: the American Senate and House of Representatives,\
  \ and the European parliament. Facebook has consistently rebuffed attempts from\
  \ others, including the UK and Canadian parliaments, to hear from Zuckerberg.He\
  \ added that an article in the New York Times on Thursday, in which the paper alleged\
  \ a pattern of behaviour from Facebook to \"delay, deny and deflect\" negative news\
  \ stories, \"raises further questions about how recent data breaches were allegedly\
  \ dealt with within Facebook.\"\n\"\"\"\n```\n\n多亏了 spaCy，获取命名实体现在变得非常简单。我们执行了一些基本的文本处理，并使用\
  \ spaCy 获得了 NER 标签，如下所示。\n\n\n```python\nimport spacy\nimport re\ntext = re.sub(r'\\\
  n', \", text) # 移除多余换行符\nnlp = spacy.load('en')\ntext_nlp = nlp(text)\n"
- '# 打印文章中的命名实体

  ner_tagged = [(word.text, word.ent_type_) for word in text_nlp]

  print(ner_tagged)

  ```


