- "# RegexpTokenizer\n\n在句子分词中，我们要介绍的最后一个分词器是使用 `RegexpTokenizer` 类的实例将文本分词为句子，我们将使用基于特定正则表达式的模式来分割句子。如果你想复习一下，可以回顾前一章的正则表达式。以下代码片段展示了如何使用正则表达式模式来分词句子。\n\
  \n```\nSENTENCE_TOKENS_PATTERN = r'(?<!\\w\\.\\w.)(?<![A-Z][a-z]\\.)(?<![A-Z]\\\
  .)(?<=\\.|\\?|\\!)\\s'\nregex_st = nltk.tokenize.RegexpTokenizer(\npattern=SENTENCE_TOKENS_PATTERN,\n\
  gaps=True)\nsample_sentences = regex_st.tokenize(sample_text)\nprint(np.array(sample_sentences))\n\
  [\"US unveils world's most powerful supercomputer, beats China.\"\n\"The US has\
  \ unveiled the world's most powerful supercomputer called 'Summit', beating the\
  \ previous record-holder China's Sunway TaihuLight.\"\n'With a peak performance\
  \ of 200,000 trillion calculations per second, it is over twice as fast as Sunway\
  \ TaihuLight, which is capable of 93,000 trillion calculations per second.'\n'Summit\
  \ has 4,608 servers, which reportedly take up the size of two tennis courts.']\n\
  ```\n\n此输出表明，我们得到了与使用其他分词器相同的句子。这让我们了解了如何使用不同的 NLTK 接口将文本分词为句子。在下一节中，我们将介绍使用几种技术将这些句子分词为单词。\n\
  \n\n\n### 分词\n\n分词是将句子分割或切分成其组成单词的过程。句子是由单词组成的集合，通过分词，我们本质上将句子分割成一个可用于重构句子的单词列表。分词在许多处理过程中都非常重要，尤其是在文本清洗和标准化环节，诸如词干提取和词形还原等操作，都需要基于每个单词各自的词干和词形来进行。与句子分割类似，NLTK\
  \ 也为分词提供了各种有用的接口。我们将主要介绍以下几个接口：\n\n- `word_tokenize`\n- `TreebankWordTokenizer`\n\
  - `TokTokTokenizer`\n- `RegexpTokenizer`\n- 从 `RegexpTokenizer` 继承的分词器\n\n我们将沿用上一节的示例文本来演示相关实例。\n\
  \n#### 默认分词器\n\n`nltk.word_tokenize(...)` 函数是 NLTK 指定的默认且推荐使用的分词器。该分词器在内部实现中是 `TreebankWordTokenizer`\
  \ 类的一个实例或对象，并充当该核心类的包装器。以下代码片段展示了其用法。\n\n```\ndefault_wt = nltk.word_tokenize\n\
  words = default_wt(sample_text)\nnp.array(words)\narray(['US', 'unveils', 'world',\
  \ \"'s\", 'most', 'powerful',\n'supercomputer', ',', 'beats', 'China', '.', 'The',\
  \ 'US', 'has',\n'unveiled', 'the', 'world', \"'s\", 'most', 'powerful',\n'supercomputer',\
  \ 'called', \"'Summit\", \"'\", ',', 'beating', 'the',\n'previous', 'record-holder',\
  \ 'China', \"'s\", 'Sunway', 'TaihuLight',\n'.', 'With', 'a', 'peak', 'performance',\
  \ 'of', '200,000',\n'trillion', 'calculations', 'per', 'second', ',', 'it', 'is',\n\
  'over', 'twice', 'as', 'fast', 'as', 'Sunway', 'TaihuLight', ',',\n'which', 'is',\
  \ 'capable', 'of', '93,000', 'trillion',\n'calculations', 'per', 'second', '.',\
  \ 'Summit', 'has', '4,608',\n'servers', ',', 'which', 'reportedly', 'take', 'up',\
  \ 'the', 'size',\n'of', 'two', 'tennis', 'courts', '.'], dtype='<U13')\n```\n\n\
  #### TreebankWordTokenizer\n\n`TreebankWordTokenizer` 基于 Penn Treebank，并使用多种正则表达式来对文本进行分词。当然，这里的一个主要前提是我们已经提前完成了句子分割。Penn\
  \ Treebank 中使用的原始分词器是以 `sed` 脚本形式提供的，你可以访问 [`http://www.cis.upenn.edu/~treebank/tokenizer.sed`](http://www.cis.upenn.edu/%257Etreebank/tokenizer.sed)\
  \ 查看，以了解用于将句子切分成单词的模式。该分词器的一些主要特点如下：\n\n- 分割并分离出现在句子末尾的句点\n- 分割并分离后跟空格的逗号和单引号\n\
  - 大多数标点符号会被分割并分离成独立的词元\n- 分割包含标准缩写形式的单词，例如将 don’t 分割为 do 和 n’t\n\n以下代码片段展示了使用 `TreebankWordTokenizer`\
  \ 进行分词的操作。\n\n```\ntreebank_wt = nltk.TreebankWordTokenizer()\nwords = treebank_wt.tokenize(sample_text)\n\
  np.array(words)\narray(['US', 'unveils', 'world', \"'s\", 'most', 'powerful',\n\
  'supercomputer', ',', 'beats', 'China.', 'The', 'US', 'has',\n'unveiled', 'the',\
  \ 'world', \"'s\", 'most', 'powerful',\n'supercomputer', 'called', \"'Summit\",\
  \ \"'\", ',', 'beating', 'the',\n'previous', 'record-holder', 'China', \"'s\", 'Sunway',\n\
  'TaihuLight.', 'With', 'a', 'peak', 'performance', 'of', '200,000',\n'trillion',\
  \ 'calculations', 'per', 'second', ',', 'it', 'is',\n'over', 'twice', 'as', 'fast',\
  \ 'as', 'Sunway', 'TaihuLight', ',',\n'which', 'is', 'capable', 'of', '93,000',\
  \ 'trillion',\n'calculations', 'per', 'second.', 'Summit', 'has', '4,608',\n'servers',\
  \ ',', 'which', 'reportedly', 'take', 'up', 'the', 'size',\n'of', 'two', 'tennis',\
  \ 'courts', '.'], dtype='<U13')\n```\n\n如预期所见，输出结果与 `word_tokenize()` 相似，因为它们使用了相同的分词机制。\n\
  \n#### TokTokTokenizer\n\n`TokTokTokenizer` 是 NLTK 引入的较新分词器之一，位于 `nltk.tokenize.toktok`\
  \ 模块中。总的来说，tok-tok 分词器是一个通用分词器，它假设输入内容每行包含一个句子。因此，只有句末的句点会被分词。不过，如有需要，我们可以使用正则表达式从单词中移除其他句点。Tok-tok\
  \ 已经在英语、波斯语、俄语、捷克语、法语、德语、越南语以及许多其他语言上进行了测试，并获得了相当不错的结果。它实际上是 [`https://github.com/jonsafari/tok-tok`](https://github.com/jonsafari/tok-tok)\
  \ 的一个 Python 移植版本，该仓库中也提供了一份 Perl 实现。以下代码展示了使用 `TokTokTokenizer` 进行分词的操作。\n\n```\n\
  from nltk.tokenize.toktok import ToktokTokenizer\ntokenizer = ToktokTokenizer()\n\
  words = tokenizer.tokenize(sample_text)\nnp.array(words)\narray(['US', 'unveils',\
  \ 'world', \"'\", 's', 'most', 'powerful',\n'supercomputer', ',', 'beats', 'China.',\
  \ 'The', 'US', 'has',\n'unveiled', 'the', 'world', \"'\", 's', 'most', 'powerful',\n\
  'supercomputer', 'called', \"'\", 'Summit', \"'\", ',', 'beating',\n'the', 'previous',\
  \ 'record-holder', 'China', \"'\", 's', 'Sunway',\n'TaihuLight.', 'With', 'a', 'peak',\
  \ 'performance', 'of', '200,000',\n'trillion', 'calculations', 'per', 'second',\
  \ ',', 'it', 'is',\n'over', 'twice', 'as', 'fast', 'as', 'Sunway', 'TaihuLight',\
  \ ',',\n'which', 'is', 'capable', 'of', '93,000', 'trillion',\n'calculations', 'per',\
  \ 'second.', 'Summit', 'has', '4,608',\n'servers', ',', 'which', 'reportedly', 'take',\
  \ 'up', 'the', 'size',\n'of', 'two', 'tennis', 'courts', '.'], dtype='<U13')\n```\n\
  \n\n\n### `RegexpTokenizer`\n\n现在我们来看如何使用正则表达式和`RegexpTokenizer`类将句子分词成单词。请记住，分词中有两个主要参数非常有用——用于构建分词器的正则表达式`pattern`（模式）以及`gaps`（间隔）参数，如果该参数设置为`true`，则用于查找分词之间的间隔；否则，用于查找分词本身。下面的代码片段展示了一些使用正则表达式执行单词分词的例子。\n\
  \n```\n# pattern to identify tokens themselves\nTOKEN_PATTERN = r'\\w+'\nregex_wt\
  \ = nltk.RegexpTokenizer(pattern=TOKEN_PATTERN,\ngaps=False)\nwords = regex_wt.tokenize(sample_text)\n\
  np.array(words)\narray(['US', 'unveils', 'world', 's', 'most', 'powerful', 'supercomputer',\n\
  'beats', 'China', 'The', 'US', 'has', 'unveiled', 'the', 'world',\n's', 'most',\
  \ 'powerful', 'supercomputer', 'called', 'Summit',\n'beating', 'the', 'previous',\
  \ 'record', 'holder', 'China', 's',\n'Sunway', 'TaihuLight', 'With', 'a', 'peak',\
  \ 'performance', 'of',\n'200', '000', 'trillion', 'calculations', 'per', 'second',\
  \ 'it',\n'is', 'over', 'twice', 'as', 'fast', 'as', 'Sunway', 'TaihuLight',\n'which',\
  \ 'is', 'capable', 'of', '93', '000', 'trillion',\n'calculations', 'per', 'second',\
  \ 'Summit', 'has', '4', '608',\n'servers', 'which', 'reportedly', 'take', 'up',\
  \ 'the', 'size',\n'of', 'two', 'tennis', 'courts'], dtype='<U13')\n# pattern to\
  \ identify tokens by using gaps between tokens\nGAP_PATTERN = r'\\s+'\nregex_wt\
  \ = nltk.RegexpTokenizer(pattern=GAP_PATTERN,\ngaps=True)\nwords = regex_wt.tokenize(sample_text)\n\
  np.array(words)\narray(['US', 'unveils', \"world's\", 'most', 'powerful', 'supercomputer,',\n\
  'beats', 'China.', 'The', 'US', 'has', 'unveiled', 'the',\n\"world's\", 'most',\
  \ 'powerful', 'supercomputer', 'called',\n\"'Summit',\", 'beating', 'the', 'previous',\
  \ 'record-holder',\n\"China's\", 'Sunway', 'TaihuLight.', 'With', 'a', 'peak',\n\
  'performance', 'of', '200,000', 'trillion', 'calculations', 'per',\n'second,', 'it',\
  \ 'is', 'over', 'twice', 'as', 'fast', 'as',\n'Sunway', 'TaihuLight,', 'which',\
  \ 'is', 'capable', 'of', '93,000',\n'trillion', 'calculations', 'per', 'second.',\
  \ 'Summit', 'has',\n'4,608', 'servers,', 'which', 'reportedly', 'take', 'up', 'the',\n\
  'size', 'of', 'two', 'tennis', 'courts.'], dtype='<U14')\n```\n\n因此，你可以看到有多种方法可以利用分词模式本身或间隔模式来获得相同的结果。以下代码向我们展示了如何在`tokenize`操作期间获取每个分词的边界。\n\
  \n```\nword_indices = list(regex_wt.span_tokenize(sample_text))\nprint(word_indices)\n\
  print(np.array([sample_text[start:end] for start, end in word_indices]))\n[(0, 2),\
