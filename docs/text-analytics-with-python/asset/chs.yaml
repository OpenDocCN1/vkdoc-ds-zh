  ## 特征工程技术


  有多种特征提取或特征工程技术可以应用于文本数据，但在深入探讨它们之前，让我们简要回顾一下特征的含义、为什么需要特征以及它们如何发挥作用。在一个数据集中，通常有许多数据点，通常是数据集的行；而列则是数据集的各种特征或属性，每一行或每个观察值都有特定的值。在机器学习术语中，特征是数据集中每个观察值或数据点的独特可测量属性或特性。特征本质上是数值型的，可以是绝对数值，也可以是分类特征。分类特征可以通过一种称为*独热编码*的过程，编码为列表中每个类别的二进制特征。它们也可以通过一种称为*标签编码*的过程，表示为不同的数值实体。提取和选择特征的过程既是一门艺术也是一门科学，这个过程被称为*特征提取*或*特征工程*。


  特征工程非常重要，通常被称为创建卓越且性能更优机器学习模型的秘诀。提取的特征被输入到机器学习算法中，用于学习模式，这些模式可以应用于未来的新数据点以获取洞察。这些算法通常期望特征以数值向量的形式出现，因为每个算法本质上都是一个数学优化过程，在尝试从数据点和观察值中学习模式时，它要最小化损失和误差。因此，处理文本数据带来了额外的挑战，即如何从文本数据中转换和提取数值特征。


  我们在第 4 章中详细介绍了文本数据的最新特征工程技术。在接下来的章节中，我们简要回顾本章所使用的方法。但为了深入学习，我建议读者查阅第 4 章。




  ### 传统特征工程模型


  针对文本数据的传统（基于计数）特征工程策略涉及一系列模型，这些模型通常统称为词袋模型（Bag of Words model）。虽然它们是有效的文本特征提取方法，但由于模型本质仅是一个无序词的集合，我们会丢失额外信息，例如每篇文本文档中单词的语义、结构、顺序以及附近单词的上下文。


  - **词袋（词频）模型（Bag of Words (term frequency) model）**：词袋模型将每篇文本文档表示为一个数值向量，其中每个维度对应语料库中的一个特定单词，其值可以是该单词在文档中的词频、是否出现（用
  1 或 0 表示），甚至可以是加权值。该模型得名于此，因为每篇文档都按字面意思被表示为其自身单词的一个词袋，而忽略了单词顺序、序列和语法。


  - **词袋 N-gram 模型（Bag of N-Grams model）**：N-gram 本质上是从文本文档中提取的一组连续且按序列出现的词元。二元组（Bi-grams）指阶数为
  2（两个单词）的 n-gram，三元组（tri-grams）指阶数为 3（三个单词）的 n-gram，以此类推。词袋 N-gram 模型只是词袋模型的一个扩展，因此我们也可以利用基于
  N-gram 的特征。


  - **TF-IDF 模型（TF-IDF model）**：TF-IDF 代表词频-逆文档频率（Term Frequency-Inverse Document
  Frequency），它是两个指标的组合：词频（TF）和逆文档频率（IDF）。该技术最初是作为一种根据用户查询展示搜索引擎结果的指标而开发的，现已成为信息检索和文本特征提取的一部分。


  ### 高级特征工程模型


  针对文本数据的传统（基于计数）特征工程策略涉及一系列模型，这些模型通常统称为词袋模型。这包括词频、TF-IDF（词频-逆文档频率）、N-gram 等。虽然它们是有效的文本特征提取方法，但存在严重的局限性，即我们会丢失额外信息，例如每篇文本文档中单词的语义、结构、顺序以及附近单词的上下文。这足以成为我们探索更复杂模型的动力，这些模型能够捕获这些信息，并提供以单词向量表示（通常称为*词嵌入*）为形式的特征。我们使用预测性方法，例如基于神经网络的语言模型，通过观察语料库中的单词序列，尝试从其相邻单词中预测单词。在此过程中，模型学习分布式表示，从而得到密集的词嵌入。这些模型通常也被称为词嵌入模型。


  - **Word2Vec 模型（Word2Vec model）**：该模型由 Google 于 2013 年创建，是一个基于预测的深度学习模型，用于计算和生成高质量、分布式且连续的单词密集向量表示，能够捕获上下文和语义相似性。您通常可以指定词嵌入向量的大小，而向量的总数实质上就是词汇表的大小。这使得密集向量空间的维度远低于使用传统词袋模型构建的高维稀疏向量空间。Word2Vec
  可以利用两种不同的模型架构来创建这些词嵌入表示。其中包括连续词袋模型（CBOW）和跳字模型（Skip-Gram）。


  - **GloVe 模型（GloVe model）**：GloVe 模型代表全局向量（Global Vectors）。它是一种无监督学习模型，可用于获取密集的词向量，类似于
  Word2Vec。然而，其技术不同，训练是在一个全局词-词共现矩阵上进行的，从而为我们提供一个具有有意义子结构的向量空间。


  - **FastText 模型（FastText model）**：FastText 模型由 Facebook 于 2016 年提出，作为原始 Word2Vec
  模型的扩展和所谓的改进。它基于 Mikolov 等人撰写的原始论文《利用子词信息丰富词向量》（Enriching Word Vectors with Subword
  Information），该论文对于深入理解该模型的工作原理来说是一份极佳的读物。总的来说，FastText 是一个用于学习单词表示并执行稳健、快速且准确的文本分类的框架。Word2Vec
  模型通常忽略每个单词的形态结构，将单词视为单个实体。而 FastText 模型将每个单词视为一个字符 N-gram 的词袋。这在论文中也被称为*子词*模型。


  以上内容应能让我们充分了解本文中使用的特征工程技术类型，从而能够将非结构化文本数据有效地表示为结构化的数值向量特征。在下一节中，我们将快速概念性地了解一些常见的监督学习/分类模型，稍后我们将使用它们来构建文本分类系统。



  好的，这是根据您的要求翻译并排版后的 Markdown 文档。



