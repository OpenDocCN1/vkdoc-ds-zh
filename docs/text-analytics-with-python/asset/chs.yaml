  \n\n\n### 亲和传播\n\nk-means 算法虽然非常流行，但存在一个缺点，即用户必须预先定义簇的数量。如果簇的数量发生变化怎么办？有些方法可以检查簇的质量，并确定最优\
  \ `k` 值可能为多少。感兴趣的读者可以了解一下肘部法和轮廓系数，它们是确定最优 `k` 值的流行方法。\n\n这里，我们讨论一种基于数据固有属性来构建簇的算法，该算法不对簇的数量做任何假设。亲和传播\
  \ (AP) 算法基于在各个待聚类数据点之间进行“消息传递”的概念，并且不对可能的簇数量做任何假设。\n\nAP 通过在成对数据点之间传递消息来创建这些簇，直到达到收敛。整个数据集随后由少量代表点表示，这些代表点充当样本的代表。这些代表点类似于从\
  \ k-means 或 k-medoids 算法中获得的质心。在成对点之间传递的消息表示了其中一个点作为另一个数据点的代表点或代表的合适程度。每次迭代都会更新这一信息，直到达到收敛，最终的代表点成为每个簇的代表。请记住，这种方法的一个缺点是计算量大。消息在整个数据集的每对数据点之间传递，对于大型数据集，收敛可能需要大量时间。\n\
  \n我们现在可以定义 AP 算法中涉及的步骤（致谢 Scikit-Learn）。假设我们有一个数据集 `X`，其中包含 `n` 个数据点，即 `X = {x[1],\
  \ x[2], … , x[n]}`，并且我们设 `sim(x, y)` 为相似度函数，它量化了两个点 `x` 和 `y` 之间的相似度。在我们的实现中，我们再次使用余弦相似度。AP\
  \ 算法通过迭代执行以下两个消息传递步骤来进行。\n\n1.  首先发送责任更新，其数学表示为\n\n    ![$$ r\\left(i,k\\right)\\\
  leftarrow sim\\left(i,k\\right)-\\underset{k^{\\prime}\\ne k}{\\max}\\left\\{a\\\
  left(i,{k}^{\\prime}\\right)+ sim\\left(i,{k}^{\\prime}\\right)\\right\\} $$](img/427287_2_En_7_Chapter_TeX_Equm.png)\n\
  \n    其中责任矩阵是 `R`，而 `r(i, k)` 是一个度量，用于量化 `x[k]` 与其他候选点相比，作为 `x[i]` 的代表点或代表的合适程度。\n\
  \n2.  然后发送可用性更新，其数学表示为\n\n    ![$$ a\\left(i,k\\right)\\leftarrow \\min \\left(0,r\\\
  left(k,k\\right)+\\sum \\limits_{i^{\\prime}\\notin \\left\\{i,k\\right\\}}\\max\
  \ \\left(0,r\\left({i}^{\\prime },k\\right)\\right)\\right) $$](img/427287_2_En_7_Chapter_TeX_Equn.png)\n\
  \n    对于 `i ≠ k` 的情况，而 `i = k` 时的可用性表示为\n\n    ![$$ a\\left(k,k\\right)\\leftarrow\
  \ \\sum \\limits_{i\\hbox{'}\\ne k}\\max \\left(0,r\\left({i}^{\\prime },k\\right)\\\
  right) $$](img/427287_2_En_7_Chapter_TeX_IEq4.png)\n\n    其中可用性矩阵是 `A`，而 `a(i, k)`\
  \ 表示考虑到所有其他点都倾向于选择 `x[k]` 作为代表点时，`x[i]` 选择 `x[k]` 作为其代表点的合适程度。\n\n这两个步骤在每次迭代中持续进行，直到达到收敛。该算法的主要缺点之一是最终可能会得到过多的簇。我们在这里只展示最大的十个簇：\n\
  \n```\nfrom sklearn.cluster import AffinityPropagation\nap = AffinityPropagation(max_iter=1000)\n\
  ap.fit(cosine_sim_features)\nres = Counter(ap.labels_)\nres.most_common(10)\n[(183,\
  \ 1355), (182, 93), (159, 80), (54, 74), (81, 57),\n(16, 51), (26, 47), (24, 45),\
  \ (48, 43), (89, 42)]\n```\n\n现在，让我们尝试展示这十个簇各自的热门电影（这里我们不考虑包含电影数量较少的簇）。\n\n```\n\
  df['affprop_cluster'] = ap.labels_\nfiltered_clusters = [item[0] for item in res.most_common(8)]\n\
