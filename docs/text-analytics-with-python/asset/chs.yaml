  # 从零开始构建命名实体识别标注器


  市场上有多种现成的解决方案能够执行命名实体提取（其中一些我们在前几节已经讨论过）。然而，有时业务需求会超出现成分类器的能力范围。在本节中，我们将通过一个练习，使用条件随机场（CRF）来构建我们自己的命名实体识别器。我们将使用一个名为
  `sklearn_crfsuite` 的流行框架来开发我们的命名实体识别器。


  这里需要记住的关键点是，命名实体识别本质上是一个序列建模问题。它更接近于分类问题类别，我们需要一个带有标签的数据集来训练分类器。没有训练数据，就没有命名实体识别模型！针对命名实体识别这类问题，有各种带标签的数据集。在本教程中，我们使用的是
  GMB（格罗宁根语义库）语料库的一个预处理版本。预处理后的版本可在 [`https://www.kaggle.com/abhinavwalia95/entity-annotated-corpus`](https://www.kaggle.com/abhinavwalia95/entity-annotated-corpus)
  获取。为了方便使用，我们也在 GitHub 仓库 [`https://github.com/dipanjanS/text-analytics-with-python`](https://github.com/dipanjanS/text-analytics-with-python)
  中提供了该数据集。加载数据集后，我们可以按如下方式检查主要字段。


  ```

