  # 文本预处理与标准化


  在深入特征工程和建模过程之前，关键步骤之一是清理、预处理和标准化文本，以便将短语和单词等文本组件转换为标准格式。我们多次提到这一点，因为它对于任何 NLP 流程都是最关键的阶段之一。预处理使得文档语料库能够实现标准化，这有助于构建有意义的特征，并减少因多种因素（例如无关符号、特殊字符、XML
  和 HTML 标签等）引入的噪声。我们在第 3 章中构建的 `text_normalizer` 模块包含了文本标准化所需的所有实用工具。您还可以参考一个名为 `Text
  Normalization Demo.ipynb` 的 Jupyter notebook 示例，以获得更具交互性的体验。为了帮您重温，本节将描述我们文本标准化流程中的主要组件。


  *   **清理文本：** 我们的文本通常包含 HTML 标签等不必要的内容，这些内容在分析情感时没有太大价值。因此，我们需确保在提取特征之前将其移除。BeautifulSoup
  库在提供必要函数方面表现出色。我们的 `strip_html_tags(...)` 函数负责清理并剥离 HTML 代码。


  *   **移除重音字符：** 在我们的数据集中，处理的是英文评论，因此我们需要确保将重音字符转换并标准化为 ASCII 字符。一个简单的例子是将 `é` 转换为
  `e`。我们的 `remove_accented_chars(...)` 函数在这方面提供了帮助。


  *   **扩展缩略形式：** 在英语中，缩略形式是单词的简写版本。这些现有单词或短语的简写版本是通过移除特定字母和发音创建的。通常情况下，单词中的元音会被移除。示例包括
  do not 变为 don''t，以及 I would 变为 I''d。缩略形式会在文本标准化中带来问题，因为我们不仅要处理撇号等特殊字符，还必须将每个缩略形式转换为其扩展后的原始形式。我们的
  `expand_contractions(...)` 函数使用正则表达式以及 `contractions.py` 模块中映射的各种缩略形式，来扩展文本语料库中的所有缩略词。


  *   **移除特殊字符：** 文本清理和标准化的另一个重要任务是移除那些会增加非结构化文本噪声的特殊字符和符号。使用简单的正则表达式即可实现此目的。我们的 `remove_special_characters(...)`
  函数用于移除特殊字符。在我们的代码中，我们保留了数字，但如果您不希望数字出现在标准化语料库中，也可以将其移除。


  *   **词干提取和词形还原：** 词干通常是单词可能的基本形式，可以通过在词干上附加词缀（如前缀和后缀）来创建新单词。这被称为*屈折变化*。获取单词基本形式的逆向过程被称为词干提取。一个简单的例子是
  `WATCHES`、`WATCHING` 和 `WATCHED`，它们都有词根词干 `WATCH`。NLTK 包提供了多种词干提取器，例如 `PorterStemmer`
  和 `LancasterStemmer`。词形还原与词干提取非常相似，都是移除单词词缀以获得单词的基本形式。然而，这里的基本形式被称为根词而不是根词干。区别在于根词始终是一个词汇正确的单词（存在于词典中），而根词干可能不正确。我们在标准化流程中仅使用词形还原来保留词汇正确的单词。`lemmatize_text(...)`
  函数在这方面提供了帮助。


  *   **移除停用词：** 尤其在从文本构建有意义的特征时，那些几乎没有或完全没有意义的词被称为停用词。如果你对文档语料库进行简单的术语或单词频率统计，这些通常是最终出现频率最高的词。像“a”、“an”、“the”等词就是停用词。没有通用的停用词列表，但我们使用来自
  NLTK 的标准英语停用词列表。如果需要，您还可以添加特定于您领域的停用词。`remove_stopwords(...)` 函数用于移除停用词，并保留语料库中最具意义和上下文的单词。


  我们在以下名为 `normalize_corpus(...)` 的函数中整合了这些组件，该函数可以将文档语料库作为输入，并返回经过清理和标准化文本文档的相同语料库。请参考第
  3 章，更详细地回顾文本预处理。现在我们的标准化模块已准备就绪，我们可以开始建模和分析语料库了。




  # 基于无监督词典的模型


  过去我们讨论过无监督学习方法，这类方法指的是无需标注数据即可直接应用于数据特征的特定建模方法。任何组织机构面临的主要挑战之一，就是由于缺乏时间和资源来完成繁琐的数据标注工作，导致难以获取标注数据集。在这种情况下，无监督方法就非常有用，本节我们将探讨其中几种方法。即使我们有标注数据，本节也能让你深入了解基于词典的模型是如何工作的，从而在你没有标注数据时，也能将它们应用到自己的数据集上。


  无监督情感分析模型使用精心整理的知识库、本体、词典和数据库，这些资源包含关于主观词汇、短语（包括情感、情绪、极性、客观性、主观性等）的详细信息。一个典型的词典模型会使用*词汇表*（lexicon），也称为专门用于情感分析的词典或词汇库。这些词汇表包含与正面和负面情感相关的词汇列表，还包括极性（负面或正面得分的强度）、词性标注、主观性分类（强、弱、中性）、情绪、情态等信息。你可以使用这些词汇表，通过匹配文本中出现的特定词汇，并考虑否定参数、周围词语、整体语境、短语等其他因素，以及聚合总体情感极性分数，来计算文本的情感倾向。目前有几种常用的情感分析词典模型，其中部分如下：


  - 刘兵词典

  - MPQA 主观性词典

  - Pattern 词典

  - TextBlob 词典

  - AFINN 词典

  - SentiWordNet 词典

  - VADER 词典


  这并不是一个详尽的词典模型列表，但它们绝对是当今最流行的几种。我们将利用电影评论数据集，通过实践代码和示例，更详细地介绍最后三种词典模型。我们使用最后 15,000
  条评论并预测其情感，然后根据模型评估指标（如准确率、精确率、召回率和 F1 分数，这些内容我们已在第 5 章详细讨论过）来评估模型的性能。由于我们有标注数据，因此可以很容易地看到这些电影评论的真实情感值与我们基于词典模型预测的情感值之间的匹配程度。你可以参考名为
  `Sentiment Analysis - Unsupervised Lexical.ipynb` 的 Jupyter 笔记本进行交互式体验。在开始分析之前，我们先使用以下代码片段加载必要的依赖项和配置设置。


  ```

