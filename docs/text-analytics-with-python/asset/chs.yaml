  我们还提取了一些样本评论，以便在这些样本上运行模型，并详细解读其结果。


  ## 刘兵词典


  该词典包含超过 6,800 个单词，已分为两个文件：`positive-words.txt`（包含约 2,000 个词/短语）和 `negative-words.txt`（包含超过
  4,800 个词/短语）。该词典由刘兵历经多年开发并维护，Nitin Jindal 和刘兵在其原始论文《*Identifying Comparative Sentences
  in Text Documents*》（发表于 2006 年西雅图第 29 届年度国际 ACM SIGIR 会议论文集）中对此进行了详细说明。如果你想使用该词典，可以从
  [`https://www.cs.uic.edu/~liub/FBS/sentiment-analysis.html#lexicon`](https://www.cs.uic.edu/%257Eliub/FBS/sentiment-analysis.html%2523lexicon)
  获取，该页面包含一个链接，可以将其作为压缩包（RAR 格式）下载。


  ## MPQA 主观性词典


  MPQA 是“多视角问答”的缩写，它包含一系列多样的资源，涉及意见语料库、主观性词典、主观性语义注释、论证词典、辩论语料库、观点查找器等。该资源由匹兹堡大学开发并维护，其官方网站
  [`http://mpqa.cs.pitt.edu/`](http://mpqa.cs.pitt.edu/) 包含所有必要信息。其中，主观性词典是其观点查找框架的一部分，包含主观性线索和上下文极性。更多细节可参见
  Theresa Wilson、Janyce Wiebe 和 Paul Hoffmann 的论文《“Recognizing Contextual Polarity
  in Phrase-Level Sentiment Analysis”》（发表于 HLT-EMNLP-2005 会议论文集）。你可以从其官方网站 [`http://mpqa.cs.pitt.edu/lexicons/subj_lexicon/`](http://mpqa.cs.pitt.edu/lexicons/subj_lexicon/)
  下载主观性词典。该词典包含数据集 `subjclueslen1-HLTEMNLP05.tff` 中的主观性线索。以下代码片段展示了词典中的一些示例行。


  ```

  type=weaksubj len=1 word1=abandonment pos1=noun stemmed1=n priorpolarity=negative

  type=weaksubj len=1 word1=abandon pos1=verb stemmed1=y priorpolarity=negative

  ...

  ...

  type=strongsubj len=1 word1=zenith pos1=noun stemmed1=n priorpolarity=positive

  type=strongsubj len=1 word1=zest pos1=noun stemmed1=n priorpolarity=positive

  ```


  每一行包含一个特定单词及其相关极性、词性标注信息、长度（目前仅有长度为 1 的单词）、主观性上下文以及词干信息。




  # 模式词典（Pattern Lexicon）


  `pattern` 包是一个用 Python 编写的完整自然语言处理框架，可用于文本处理、情感分析等。它由 CLiPS（计算语言学与心理语言学中心）开发，该中心是安特卫普大学文学院语言学系下属的一个研究机构。`pattern`
  使用其自身的情感模块，该模块内部使用一个词典，你可以从其官方 GitHub 仓库 [`https://github.com/clips/pattern/blob/master/pattern/text/en/en-sentiment.xml`](https://github.com/clips/pattern/blob/master/pattern/text/en/en-sentiment.xml)
  获取该词典。它包含了完整的基于主观性的词典数据库。词典中的每一行通常如下例所示。


  ```

  Thus you get important metadata information like WordNet corpus

  identifiers, polarity scores, word sense, POS tags, intensity,

  subjectivity scores, and so on. These can in turn be used to compute

  sentiment over a text document based on polarity and subjectivity.

  Unfortunately, the pattern has still not been ported officially for

  Python 3.x and it works on Python 2.7.x. However, you can load up this

  lexicon and do your own modeling as needed. Even better, the popular

  framework TextBlob

  uses this for sentiment analysis and is available in Python 3!

  ```


  ## TextBlob 词典


  如前所述，`pattern` 包有一个很好的情感分析模块，但遗憾的是它只适用于 Python 2.7.x。然而，我们的重点是构建基于 Python 3.x 的应用，所以我们可以直接使用
  `TextBlob`！`TextBlob` 使用的词典与 `pattern` 相同，并且可以在其 GitHub 上的源代码中获取，地址为 [`https://github.com/sloria/TextBlob/blob/dev/textblob/en/en-sentiment.xml`](https://github.com/sloria/TextBlob/blob/dev/textblob/en/en-sentiment.xml)。下面是从该词典中选取的一些示例。


  通常，特定的形容词具有极性得分（消极/积极，范围 -1.0 到 +1.0）和主观性得分（客观/主观，范围 +0.0 到 +1.0）。可靠性得分指明形容词是手动标记的（1.0）还是推断得出的（0.7）。词语按义项进行标记，例如，ridiculous
  (pitiful) = 消极，ridiculous (humorous) = 积极。Cornetto id（词汇单元 id）和 Cornetto synset
  id 指的是荷兰语的 Cornetto 词汇数据库。WordNet id 指的是英语的 WordNet3 词汇数据库。词性标注（POS）使用宾夕法尼亚树库约定。让我们看看如何使用
  `TextBlob` 进行情感分析。


  ```

