  \n*图 6-21. 可视化 NMF 模型中的主题*\n\n### 潜在语义分析\n\n在这里，我们通过利用文档句子来总结我们的游戏描述。文档中每个句子的术语已被提取出来，形成了我们在图\
  \ 6-21 中看到的术语-文档矩阵。我们对这个矩阵应用低秩奇异值分解。潜在语义分析的核心原理是：在任何文档中，上下文相关的术语之间都存在一种潜在结构，因此它们也应在同一个奇异空间中相关联。\n\
  \n我们实现中所遵循的方法，源自 2004 年 J. Steinberger 和 K. Jezek 发表的一篇知名论文，题为“在文本摘要和摘要评估中使用潜在语义分析”，该论文对\
  \ Y. Gong 和 X. Liu 于 2001 年发表的杰出工作“使用相关性度量和潜在语义分析进行通用文本摘要”提出了一些改进建议。如果你想更深入地了解这项技术，我们建议你阅读这两篇论文。\n\
  \n我们实现的主要思想是使用 SVD（回顾 `M = USV^T`），使得 `U` 和 `V` 是正交矩阵，`S` 是对角矩阵，也可以表示为奇异值向量。原始矩阵可以表示为一个术语-文档矩阵，其中行是术语，列是文档（在本例中，即我们文档中的句子）。这些值可以是任何类型的权重，例如基于词袋模型频率、TF-IDF\
  \ 或二进制出现次数。\n\n我们使用 `low_rank_svd()` 函数，基于概念数量 `k`（即我们的奇异值数量）为 `M` 创建低秩矩阵近似。矩阵 `U`\
  \ 中相同的 `k` 列将指向每个 `k` 概念的术语向量，而对于矩阵 `V`，基于前 `k` 个奇异值的 `k` 行则指向句子向量。一旦我们从 SVD 中，根据概念数量\
  \ `k`，获得了对应前 `k` 个奇异值的 `U`、`S` 和 `V^T`，我们就执行以下计算。请记住，我们需要的输入参数是概念数量 `k` 和摘要最终要包含的句子数量\
  \ `n`。\n\n1.  从矩阵 `V`（`k` 行）中获取句子向量。\n2.  从 `S` 中获取前 `k` 个奇异值。\n3.  应用基于阈值的策略，移除那些小于最大奇异值一半的奇异值（如果存在）。这是一个启发式方法，你可以根据需要调整这个值。数学上表示为：如果\
  \ `S_i < (1/2) * S`，则 `S_i = 0`。\n4.  将 `V` 中每个术语-句子列的平方与其对应奇异值 `S` 的平方相乘，以获得每个主题的句子权重。\n\
  5.  计算所有主题的句子权重之和，并对最终得分取平方根，以获得文档中每个句子的显著度得分。\n\n每个句子的显著度得分计算可以用数学表示如下：\n\n```\n\
  SS = sqrt(sum_{i=1}^k (S_i * V_i^T))\n```\n\n其中 `SS` 表示通过计算奇异值与 `V^T` 中句子向量点积得到的每个句子的显著性得分。一旦我们得到这些分数，就按降序排列，选出得分最高的前\
  \ `n` 个句子，并根据它们在原始文档中出现的顺序组合起来，形成最终的摘要。\n\n\n\n让我们用 Python 实现算法。第一步是选择摘要包含的句子数量`n`。由于我们有大约\
  \ 35 个句子，我们设定摘要包含八个句子。主题或概念的总数`k`设为三个，因为我们从维基百科原始评论的摘要、游戏玩法和剧情部分提取了游戏描述。然后我们执行低秩\
  \ SVD。\n\n```\nnum_sentences = 8\nnum_topics = 3\nu, s, vt = low_rank_svd(td_matrix,\
  \ singular_count=num_topics)\nprint(u.shape, s.shape, vt.shape)\nterm_topic_mat,\
  \ singular_values, topic_document_mat = u, s, vt\n(270, 3) (3,) (3, 35)\n```\n\n\
  接下来，我们应用一个阈值，将任何小于最大奇异值一半的奇异值设为`0`。\n\n```\n"
- "# 移除低于阈值的奇异值\nsv_threshold = 0.5\nmin_sigma_value = max(singular_values) * sv_threshold\n\
  singular_values[singular_values < min_sigma_value] = 0\n```\n\n现在我们可以利用前面描述的公式，为游戏描述中的每个句子（文档）计算句子显著性分数。\n\
  \n```\nsalience_scores = np.sqrt(np.dot(np.square(singular_values),\nnp.square(topic_document_mat)))\n\
  salience_scores\narray([0.53291263, 0.61639562, 0.60427539, 0.52307109, 0.50141128,\n\
  0.32352969, 0.1506046 , 0.25383436, 0.60567083, 0.35902104,\n0.22562997, 0.34608934,\
  \ 0.15781555, 0.40522541, 0.24505982,\n0.19874104, 0.39317895, 0.45392878, 0.31638528,\
  \ 0.47353378,\n0.18348908, 0.45731421, 0.13929749, 0.38932101, 0.36829067,\n0.57822992,\
  \ 0.40853736, 0.26260062, 0.38904585, 0.32776714,\n0.67662776, 0.21866561, 0.34687796,\
  \ 0.3234621 , 0.46107093])\n```\n\n现在只需根据显著性分数选择排名靠前的句子，并展示游戏描述的摘要。\n\n```\ntop_sentence_indices\
  \ = (-salience_scores).argsort()[:num_sentences]\ntop_sentence_indices.sort()\n\
