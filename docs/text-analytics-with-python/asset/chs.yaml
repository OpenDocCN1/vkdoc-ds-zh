  \ ASCII 字符。以下展示了一个简单的示例——将 `é` 转换为 `e`。下面的函数是处理此任务的一种简单方法。\n\n```python\nimport\
  \ unicodedata\n\ndef remove_accented_chars(text):\n    text = unicodedata.normalize('NFKD',\
  \ text).encode('ascii', 'ignore').decode('utf-8', 'ignore')\n    return text\n\n\
  remove_accented_chars('Sómě Áccěntěd těxt')\n```\n\n输出：\n```python\n'Some Accented\
  \ text'\n```\n\n前面的函数向我们展示了如何轻松地将带有变音符号的字符转换为正常的英文字符，这有助于标准化我们语料库中的单词。\n\n\n\n###\
  \ 缩写的扩展\n\n缩写是单词或音节的简写形式，存在于书面语和口语中。通过删除特定字母和发音，可以创建现有单词的简写版本。以英语缩写为例，通常通过删除单词中的一个元音来生成。例如，\"\
  is not\"缩写成\"isn't\"，\"will not\"缩写成\"won't\"，你可以注意到撇号用于表示缩写，同时删除了部分元音和其他字母。\n\n\
  在正式写作中，缩写通常会被避免，但在非正式交流中却广泛使用。存在多种形式的缩写，它们与助动词的类型相关，由此产生了普通缩写、否定缩写以及其他特殊的口语化缩写，其中有些可能不涉及助动词。\n\
  \n就其本质而言，缩写给自然语言处理和文本分析带来了问题，因为首先，单词中会出现特殊的撇号字符。除此之外，一个缩写还代表两个或多个单词，这在我们尝试对其进行分词或标准化处理时，会引出一系列复杂的问题。因此，在处理文本时，应该有某种确定的流程来应对缩写。\n\
  \n理想情况下，你可以为缩写及其对应的扩展形式建立一份合适的映射表，然后用它来扩展文本中的所有缩写。我创建了一个包含缩写及其对应扩展形式的词汇表，你可以访问名为\
  \ `contractions.py` 的文件（该文件与本章的代码文件一同提供），其中以 Python 字典的形式存储了这些映射。以下代码片段展示了该缩写字典的一部分。\n\
  \n```\nCONTRACTION_MAP = {\n\"ain't\": \"is not\",\n\"aren't\": \"are not\",\n\"\
  can't\": \"cannot\",\n\"can't've\": \"cannot have\",\n.\n.\n.\n\"you'll've\": \"\
  you will have\",\n\"you're\": \"you are\",\n\"you've\": \"you have\"\n}\n```\n\n\
  但请记住，有些缩写可能存在多种形式，例如缩写 \"you'll\" 既可以扩展为 \"you will\"，也可以扩展为 \"you shall\"。为简化处理，这里我们对每个缩写只使用一种扩展形式。下一步，为了扩展缩写，我们使用以下代码片段。\n\
  \n```\nfrom contractions import CONTRACTION_MAP\nimport re\ndef expand_contractions(text,\
  \ contraction_mapping=CONTRACTION_MAP):\ncontractions_pattern = re.compile('({})'.format('|'.join(contraction_mapping.keys())),\
  \ flags=re.IGNORECASE|re.DOTALL)\ndef expand_match(contraction):\nmatch = contraction.group(0)\n\
  first_char = match[0]\nexpanded_contraction = contraction_mapping.get(match)\\\n\
  if contraction_mapping.get(match)\\\nelse contraction_mapping.get(match.lower())\n\
  expanded_contraction = first_char+expanded_contraction[1:]\nreturn expanded_contraction\n\
  expanded_text = contractions_pattern.sub(expand_match, text)\nexpanded_text = re.sub(\"\
  '\", \"\", expanded_text)\nreturn expanded_text\n```\n\n在这个代码片段中，我们在主函数 `expand_contractions`\
  \ 内部使用了 `expanded_match` 函数，来查找与正则表达式模式（该模式由我们 `CONTRACTION_MAP` 字典中的所有缩写组成）匹配的每个缩写。一旦匹配到任何缩写，我们就用其对应的扩展版本进行替换，并保留单词正确的大小写。现在，让我们看看这个过程的实际运行效果！\n\
  \n```\nexpand_contractions(\"Y'all can't expand contractions I'd think\")\n'You\
  \ all cannot expand contractions I would think'\n```\n\n从上述输出中，我们可以看到函数如何帮助我们扩展缩写。有没有更好的方法？当然有！如果有足够的示例，我们甚至可以训练一个深度学习模型来获得更佳性能。\n\
  \n### 移除特殊字符\n\n特殊字符和符号通常是非字母数字字符，有时也可能是数字字符（取决于具体问题），它们会增加非结构化文本中的额外噪声。通常，可以使用简单的正则表达式来移除它们。以下代码帮助我们移除特殊字符。\n\
  \n```\ndef remove_special_characters(text, remove_digits=False):\npattern = r'[^a-zA-z0-9\\\
  s]' if not remove_digits else r'[^a-zA-z\\s]'\ntext = re.sub(pattern, '', text)\n\
  return text\nremove_special_characters(\"Well this was fun! What do you think? 123#@!\"\
  ,\nremove_digits=True)\n'Well this was fun What do you think '\n```\n\n我将移除数字选项保留为可选，因为预处理文本时，我们可能经常需要保留数字。\n\
  \n### 大小写转换\n\n有时你可能需要修改单词或句子的大小写，以使某些操作更简单，比如匹配特定单词或标记。通常，有两种常用的大小写转换操作。它们是小写转换和大写转换，即将文本完全转换为小写或大写。此外，还有句子大小写或标题大小写等其他形式。小写是指文本中所有字母都是小写字母，大写则全部大写。标题大小写会将句子中每个单词的首字母大写。以下代码片段说明了这些概念。\n\
  \n```\n# 小写\ntext = 'The quick brown fox jumped over The Big Dog'\ntext.lower()\n\
  'the quick brown fox jumped over the big dog'\n# 大写\ntext.upper()\n'THE QUICK BROWN\
  \ FOX JUMPED OVER THE BIG DOG'\n# 标题大小写\ntext.title()\n'The Quick Brown Fox Jumped\
  \ Over The Big Dog'\n```\n\n### 文本校正\n\n文本处理中面临的主要挑战之一是文本中存在不正确的单词。这里“不正确”的定义涵盖拼写错误的单词，以及那些重复了多个字母但对其整体意义贡献不大的单词。举例说明，单词“finally”可能被误写为“fianlly”，或者有人在表达强烈情感时可能将其写成“finalllllyyyyyy”。这里的主要目标是将这些单词的不同形式标准化为正确形式，以免最终丢失文本中不同标记所蕴含的关键信息。本节我们将探讨如何处理重复字符以及纠正拼写错误。\n\
  \n\n\n"
- "# 纠正重复字符\n\n我们之前提到，单词中常包含多个重复字符，这可能是拼写错误、俚语，甚至是人们想要表达强烈情感所致。这里介绍一种结合语法和语义的方法来纠正这些单词。我们先从纠正这些单词的语法入手，然后再处理语义问题。\n\
  \n我们算法的第一步是使用正则表达式模式识别单词中的重复字符，然后通过替换逐一移除这些字符。以之前例子中的单词 \"finalllyyy\" 为例。模式 `r'(\\\
  w*)(\\w)\\2(\\w*)'` 可用于识别单词中连续出现两次的字符。在每一步中，我们尝试利用正则表达式的匹配组（组 1、组 2 和组 3）通过模式 `r'\\\
  1\\2\\3'` 对匹配项进行替换，从而消除其中一个重复字符。然后我们不断重复这个过程，直到没有剩余重复字符为止。以下代码片段说明了这个过程。\n\n```\n\
  old_word = 'finalllyyy'\nrepeat_pattern = re.compile(r'(\\w*)(\\w)\\2(\\w*)')\n\
  match_substitution = r'\\1\\2\\3'\nstep = 1\nwhile True:\n# remove one repeated\
  \ character\nnew_word = repeat_pattern.sub(match_substitution,\nold_word)\nif new_word\
  \ != old_word:\nprint('Step: {} Word: {}'.format(step, new_word))\nstep += 1 # update\
  \ step\n# update old word to last substituted state\nold_word = new_word\ncontinue\n\
  else:\nprint(\"Final word:\", new_word)\nbreak\nStep: 1 Word: finalllyy\nStep: 2\
  \ Word: finallly\nStep: 3 Word: finally\nStep: 4 Word: finaly\nFinal word: finaly\n\
  ```\n\n这段代码展示了在每个阶段如何移除一个重复字符，并最终得到单词 \"finaly\"。然而，这个单词是不正确的，正确的单词是我们在第三步得到的 \"\
  finally\"。现在，我们将利用 WordNet 语料库在每个阶段检查有效单词，并在获得正确单词后终止循环。这为我们算法引入了所需的语义纠正，如下面的代码片段所示。\n\
  \n```\nfrom nltk.corpus import wordnet\nold_word = 'finalllyyy'\nrepeat_pattern\
  \ = re.compile(r'(\\w*)(\\w)\\2(\\w*)')\nmatch_substitution = r'\\1\\2\\3'\nstep\
  \ = 1\nwhile True:\n# check for semantically correct word\nif wordnet.synsets(old_word):\n\
  print(\"Final correct word:\", old_word)\nbreak\n# remove one repeated character\n\
  new_word = repeat_pattern.sub(match_substitution,\nold_word)\nif new_word != old_word:\n\
  print('Step: {} Word: {}'.format(step, new_word))\nstep += 1 # update step\n# update\
  \ old word to last substituted state\nold_word = new_word\ncontinue\nelse:\nprint(\"\
  Final word:\", new_word)\nbreak\nStep: 1 Word: finalllyy\nStep: 2 Word: finallly\n\
  Step: 3 Word: finally\nFinal correct word: finally\n```\n\n因此，我们从这段代码中看到，代码在第三步后正确终止，我们得到了既符合语法又符合语义的正确单词。我们可以通过将逻辑写入一个函数来构建此代码的更好版本，如下所示，使其更通用，能够处理来自标记列表中的错误标记。\n\
  \n```\nfrom nltk.corpus import wordnet\ndef remove_repeated_characters(tokens):\n\
  repeat_pattern = re.compile(r'(\\w*)(\\w)\\2(\\w*)')\nmatch_substitution = r'\\\
  1\\2\\3'\ndef replace(old_word):\nif wordnet.synsets(old_word):\nreturn old_word\n\
  new_word = repeat_pattern.sub(match_substitution, old_word)\nreturn replace(new_word)\
  \ if new_word != old_word else new_word\ncorrect_tokens = [replace(word) for word\
  \ in tokens]\nreturn correct_tokens\n```\n\n在这个代码片段中，我们使用内部函数 `replace()` 来模拟我们之前展示的算法行为，然后在外部函数\
  \ `remove_repeated_characters()` 中对句子中的每个标记重复调用它。我们可以在下面带有例句的代码片段中看到实际运行效果。\n\n\
  ```\nsample_sentence = 'My schooool is realllllyyy amaaazingggg'\ncorrect_tokens\
  \ = remove_repeated_characters(nltk.word_tokenize(sample_sentence))\n' '.join(correct_tokens)\n\
  'My school is really amazing'\n```\n\n从这个输出中我们可以看到，我们的函数按预期执行，替换了每个标记中的重复字符，并给出了我们想要的正确标记。\n\
  \n\n\n#### 纠正拼写\n\n我们在处理词语时遇到的第二个问题是因人为错误甚至机器错误导致的拼写不正确，你可能在自动更正文本等功能中见过这种情况。有多种方法可以处理不正确的拼写，其最终目标是获得拼写正确的文本标记。我们将讨论由谷歌研究总监彼得·诺维格开发的一种著名算法。你可以在\
  \ [`http://norvig.com/spell-correct.html`](http://norvig.com/spell-correct.html)\
  \ 找到详细解释该算法及其研究结果的完整文章，我们将在本节中探讨它。\n\n本练习的主要目标是，给定一个有问题的单词，我们需要找出该单词最有可能的正确形式。我们采用的方法是生成一组与输入单词相近的候选单词，并从这组单词中选出最有可能的单词作为正确单词。在此过程中，我们使用一个包含正确英语单词的语料库，根据候选单词在语料库中的频率，从与输入单词距离最近的最终候选集合中识别出正确的单词。这个距离衡量一个单词与输入单词的接近程度，也称为*编辑距离*。\n\
  \n我们使用的输入语料库是一个包含古腾堡计划中多本书籍以及来自维基词典和英国国家语料库的常用词列表的文件。你可以在本章的代码资源中找到名为 `big.txt`\
  \ 的文件，或者你也可以直接从诺维格的链接 [`http://norvig.com/big.txt`](http://norvig.com/big.txt) 下载并使用它。我们使用以下代码片段生成英语中常用词及其出现次数的映射。\n\
  \n```\nimport re, collections\ndef tokens(text):\n\"\"\"\n从语料库中获取所有单词\n\"\"\"\n\
  return re.findall('[a-z]+', text.lower())\nWORDS = tokens(open('big.txt').read())\n\
  WORD_COUNTS = collections.Counter(WORDS)\n# 语料库中的前 10 个单词\nWORD_COUNTS.most_common(10)\n\
  [('the', 80030), ('of', 40025), ('and', 38313), ('to', 28766), ('in', 22050),\n\
  ('a', 21155), ('that', 12512), ('he', 12401), ('was', 11410), ('it', 10681)]\n```\n\
  \n一旦我们有了词汇表，我们就定义三个函数，分别计算与输入单词相距零、一和两次编辑距离的单词集合。这些编辑操作可以通过插入、删除、替换和转置来实现。以下代码定义了这些函数。\n\
  \n```\ndef edits0(word):\n\"\"\"\n返回与输入单词相距零次编辑的所有字符串\n（即单词本身）。\n\"\"\"\nreturn\
  \ {word}\ndef edits1(word):\n\"\"\"\n返回与输入单词相距一次编辑的所有字符串。\n\"\"\"\nalphabet = 'abcdefghijklmnopqrstuvwxyz'\n\
  def splits(word):\n\"\"\"\n返回构成输入单词的所有可能的（第一部分，剩余部分）对。\n\"\"\"\nreturn [(word[:i],\
  \ word[i:])\nfor i in range(len(word)+1)]\npairs      = splits(word)\ndeletes  \
  \  = [a+b[1:]           for (a, b) in pairs if b]\ntransposes = [a+b[1]+b[0]+b[2:]\
  \ for (a, b) in pairs if len(b) > 1]\nreplaces   = [a+c+b[1:]         for (a, b)\
  \ in pairs for c in alphabet if b]\ninserts    = [a+c+b             for (a, b) in\
  \ pairs for c in alphabet]\nreturn set(deletes + transposes + replaces + inserts)\n\
  def edits2(word):\n\"\"\"\n返回与输入单词相距两次编辑的所有字符串。\n\"\"\"\nreturn {e2 for e1 in edits1(word)\
  \ for e2 in edits1(e1)}\n```\n\n我们还定义了一个名为 `known()` 的函数，该函数根据候选词是否出现在我们的词汇字典 `WORD_COUNTS`\
  \ 中，从编辑函数获得的候选词集合中返回一个子集。这从我们的候选词集合中给出了一个有效单词列表。\n\n```\ndef known(words):\n\"\"\
  \"\n返回实际存在于我们的 WORD_COUNTS 字典中的单词子集。\n\"\"\"\nreturn {w for w in words if w in WORD_COUNTS}\n\
  ```\n\n我们可以在以下代码片段中看到这些函数在测试输入单词上的运行结果，该代码片段展示了基于与输入单词编辑距离的可能候选词列表。\n\n```\n# 输入单词\n\
  word = 'fianlly'\n# 与输入单词编辑距离为 0\nedits0(word)\n{'fianlly'}\n# 返回空集，因为它不是一个有效单词\n\
  known(edits0(word))\nset()\n# 与输入单词编辑距离为 1\nedits1(word)\n{'afianlly',\n'aianlly',\n\
  .\n.\n'yianlly',\n'zfianlly',\n'zianlly'}\n# 从上述集合中获取正确单词\nknown(edits1(word))\n\
  {'finally'}\n# 与输入单词编辑距离为 2\nedits2(word)\n{'fchnlly',\n'fianjlys',\n.\n.\n'fiapgnlly',\n\
  'finanlqly'}\n# 从上述集合中获取正确单词\nknown(edits2(word))\n{'faintly', 'finally', 'finely',\
  \ 'frankly'}\n```\n\n此输出显示了一组有效的候选词，它们可能是错误输入单词的潜在替换词。我们通过优先选择与输入单词编辑距离最小的单词来从列表中选择候选词。以下代码片段说明了这一点。\n\
  \n```\ncandidates = (known(edits0(word)) or\nknown(edits1(word)) or\nknown(edits2(word))\
  \ or\n[word])\ncandidates\n{'finally'}\n```\n\n如果候选词出现平局，我们使用 `max(candidates, key=WORD_COUNTS.get)`\
  \ 函数选择词汇字典 `WORD_COUNTS` 中出现频率最高的单词来解决。因此，我们现在使用这个逻辑定义我们的单词纠正函数。\n\n```\ndef correct(word):\n\
  \"\"\"\n获取输入单词的最佳正确拼写\n\"\"\"\n# 优先考虑编辑距离为 0，然后是 1，然后是 2\n# 否则默认为输入单词本身。\ncandidates\
  \ = (known(edits0(word)) or\nknown(edits1(word)) or\nknown(edits2(word)) or\n[word])\n\
  return max(candidates, key=WORD_COUNTS.get)\n```\n\n我们可以直接对不正确的单词使用该函数进行纠正，如下面的代码片段所示。\n\
  \n```\ncorrect('fianlly')\n'finally'\ncorrect('FIANLLY')\n'FIANLLY'\n```\n\n我们看到这个函数是区分大小写的，并且对于非小写单词会纠正失败，因此我们编写以下函数使其适用于单词的大小写情况，并正确纠正其拼写。这里的逻辑是保留单词的原始大小写，将其转换为小写，纠正其拼写，最后使用\
  \ `case_of` 函数将其转换回原始大小写。\n\n```\ndef correct_match(match):\n\"\"\"\n对匹配中的单词进行拼写纠正，\n\
  并保留正确的大写/小写/标题大小写格式。\n\"\"\"\nword = match.group()\ndef case_of(text):\n\"\"\"\n\
  返回适用于文本的大小写函数：\n大写到、小写、标题式或仅保留原样。：\n\"\"\"\nreturn (str.upper if text.isupper()\
  \ else\nstr.lower if text.islower() else\nstr.title if text.istitle() else\nstr)\n\
  return case_of(word)(correct(word.lower()))\ndef correct_text_generic(text):\n\"\
  \"\"\n纠正文本中的所有单词，\n返回纠正后的文本。\n\"\"\"\nreturn re.sub('[a-zA-Z]+', correct_match,\
  \ text)\n```\n\n我们现在可以无视单词的大小写，使用该函数进行纠正，如下面的代码片段所示。\n\n```\ncorrect_text_generic('fianlly')\n\
  'finally'\ncorrect_text_generic('FIANLLY')\n'FINALLY'\n```\n\n当然，这种方法并非总是完全准确，如果某些单词没有出现在我们的词汇字典中，它们可能无法被纠正。在这种情况下，只要我们的词汇表能覆盖不同单词的正确拼写，使用更多数据会有所帮助。同样的算法可以在\
  \ TextBlob 库中开箱即用。如下面的代码片段所示。\n\n```\nfrom textblob import Word\nw = Word('fianlly')\n\
  w.correct()\n'finally'\n# 查看建议\nw.spellcheck()\n[('finally', 1.0)]\n# 另一个例子\nw =\
  \ Word('flaot')\nw.spellcheck()\n[('flat', 0.85), ('float', 0.15)]\n```\n\n\n\n\
  除此之外，Python 中还有其他几个功能强大的库可用，包括基于 `enchant` 库的 `PyEnchant`（[`http://pythonhosted.org/pyenchant/`](http://pythonhosted.org/pyenchant/)）、可在\
  \ [`https://github.com/phatpiglet/autocorrect/`](https://github.com/phatpiglet/autocorrect/)\
  \ 找到的 `autocorrect`，以及 `aspell-python`，后者是流行 GNU Aspell 的一个 Python 封装。随着深度学习的出现，结合词嵌入的\
  \ RNN 和 LSTM 等序列模型往往比这些传统方法表现更优。我还建议读者关注一下 `DeepSpell`，可在 [`https://github.com/MajorTal/DeepSpell`](https://github.com/MajorTal/DeepSpell)\
  \ 找到。它利用深度学习来构建拼写纠正器。请随意查看并使用它们来纠正单词拼写！\n\n## 词干提取\n\n要理解词干提取的过程，我们需要了解词干代表什么。在第\
  \ 1 章中，我们讨论了语素，它是任何自然语言中最小的独立单元。语素由词干和词缀等单元组成。词缀是诸如前缀、后缀等单元，它们附加在词干上以改变词义或创造全新的单词。词干通常也被称为单词的基本形式，我们可以通过附加词缀来创造新单词。这个过程被称为*屈折变化*。其逆过程是从单词的屈折变化形式中获得其基本形式，这被称为*词干提取*。\n\
  \n以单词 `JUMP` 为例，你可以添加词缀形成几个新单词，如 `JUMPS`、`JUMPED` 和 `JUMPING`。在这种情况下，基本词是 `JUMP`，这就是词干。如果我们对其三个屈折变化形式中的任何一个进行词干提取，我们都会得到其基本形式。这一点在图\
  \ 3-2 中更清晰地展示出来。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig2_HTML.jpg](img/427287_2_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n词干与屈折变化形式\n\n图 3-2 展示了词干如何存在于其所有屈折变化形式中，因为它是每个屈折变化形式通过词缀构建的基础。词干提取帮助我们标准化单词，使其回归基本词干，而无论其屈折变化形式如何，这有助于许多应用，例如文本分类或聚类，甚至是信息检索。搜索引擎广泛使用此类技术来提供更准确的结果，无论单词形式如何。NLTK\
  \ 包有几种词干提取器的实现。这些词干提取器在 `stem` 模块中实现，该模块继承了 `nltk.stem.api` 模块中的 `StemmerI` 接口。你甚至可以使用这个类（严格来说是接口）作为基类来创建你自己的词干提取器。最流行的词干提取器之一是\
  \ Porter 词干提取器，它基于其发明者 Martin Porter 开发的算法。最初，该算法据说有总共五个不同的阶段来将屈折变化形式还原为词干，每个阶段都有一套自己的规则。还存在一个\
  \ Porter2 算法，这是 Dr. Martin Porter 提出了一些改进后的原始词干提取算法。你可以在以下代码片段中看到 Porter 词干提取器的实际应用。\n\
  \n```\n# Porter 词干提取器\nIn [458]: from nltk.stem import PorterStemmer\n...: ps =\
  \ PorterStemmer()\n...: ps.stem('jumping'), ps.stem('jumps'), ps.stem('jumped')\n\
  (jump, jump, jump)\nIn [460]: ps.stem('lying')\n'lie'\nIn [461]: ps.stem('strange')\n\
  'strang'\n```\n\nLancaster 词干提取器基于 Lancaster 词干提取算法，通常也被称为 Paice/Husk 词干提取器，由 Chris\
  \ D. Paice 发明。这个词干提取器是一个迭代式词干提取器，拥有超过 120 条规则，这些规则指定了特定的词缀移除或替换方式，以获取词干。以下代码片段展示了\
  \ Lancaster 词干提取器的实际应用。\n\n```\n# Lancaster 词干提取器\nIn [465]: from nltk.stem import\
  \ LancasterStemmer\n...: ls = LancasterStemmer()\n...:  print ls.stem('jumping'),\
  \ ls.stem('jumps'), ls.stem('jumped')\n(jump, jump, jump)\nIn [467]: ls.stem('lying')\n\
  'lying'\nIn [468]: ls.stem('strange')\n'strange'\n```\n\n你可以看到，这个词干提取器的行为与之前的 Porter\
  \ 词干提取器不同。除了这两者之外，还有其他几种词干提取器，包括 `RegexpStemmer`（你可以基于用户定义的规则构建自己的词干提取器）和 `SnowballStemmer`（除英语外，还支持\
  \ 13 种不同语言的词干提取）。以下代码片段展示了使用它们进行词干提取的一些方法。`RegexpStemmer` 使用正则表达式来识别单词中的形态学词缀，并移除匹配到的任何字符串部分。\n\
  \n```\n# 基于正则表达式的词干提取器\nIn [471]: from nltk.stem import RegexpStemmer\n...: rs =\
  \ RegexpStemmer('ing$|s$|ed$', min=4)\n...:  rs.stem('jumping'), rs.stem('jumps'),\
  \ rs.stem('jumped')\n(jump, jump, jump)\nIn [473]: rs.stem('lying')\n'ly'\nIn [474]:\
  \ rs.stem('strange')\n'strange'\n```\n\n你可以看到词干提取结果与之前的词干提取器有何不同，它完全基于我们基于正则表达式自定义的规则。以下代码片段展示了我们如何使用\
  \ `SnowballStemmer` 对其他语言的单词进行词干提取。你可以在 [`http://snowballstem.org/`](http://snowballstem.org/)\
  \ 找到关于 Snowball 项目的更多详细信息。\n\n```\n# Snowball 词干提取器\nIn [486]: from nltk.stem import\
  \ SnowballStemmer\n...: ss = SnowballStemmer(\"german\")\n...: print('Supported\
  \ Languages:', SnowballStemmer.languages)\nSupported Languages: (u'danish', u'dutch',\
  \ u'english', u'finnish', u'french', u'german', u'hungarian', u'italian', u'norwegian',\
  \ u'porter', u'portuguese', u'romanian', u'russian', u'spanish', u'swedish')\n#\
  \ 对德语单词进行词干提取\n# autobahnen -> 汽车（复数）\n# autobahn -> 汽车（单数）\nIn [488]: ss.stem('autobahnen')\n\
  'autobahn'\n# springen -> 跳跃（现在分词形式）\n# spring -> 跳跃（基本形式）\nIn [489]: ss.stem('springen')\n\
  'spring'\n```\n\nPorter 词干提取器使用最频繁，但你应该根据你的问题并通过反复试验来选择词干提取器。以下是一个可用于文本词干提取的基本函数。\n\
  \n```\ndef simple_stemmer(text):\nps = nltk.porter.PorterStemmer()\ntext = ' '.join([ps.stem(word)\
  \ for word in text.split()])\nreturn text\nsimple_stemmer(\"My system keeps crashing\
  \ his crashed yesterday, ours crashes daily\")\n'My system keep crash hi crash yesterday,\
  \ our crash daili'\n```\n\n请随意利用这个函数来满足你自己的词干提取需求。此外，如果需要，你甚至可以根据自己定义的规则构建自己的词干提取器！\n\
  \n\n\n### 词形还原\n\n词形还原的过程与词干提取非常相似，都是去除单词词缀以得到单词的基本形式。但在此过程中，这种基本形式也被称为*词根*，而非词干。二者的区别在于，词干可能不总是词典学上正确的单词，即它可能不在字典中；而词根，也称为词元（lemma），则始终会出现在字典中。\n\
  \n词形还原过程比词干提取慢得多，因为其中包含一个额外步骤：只有当词元存在于字典中时，才会通过去除单词词缀来形成词根形式或词元。NLTK 包拥有一个强大的词形还原模块，它利用\
  \ WordNet 以及单词的句法和语义（如词性和上下文）来获取词根或词元。还记得第 1 章中我们讨论词性的时候吗？自然语言中出现频率最高的三种实体是名词、动词和形容词。以下代码片段展示了如何对属于这些类型的单词使用词形还原。\n\
  \n```\nIn [514]: from nltk.stem import WordNetLemmatizer\n...: wnl = WordNetLemmatizer()\n\
  # 对名词进行词形还原\nIn [515]: print(wnl.lemmatize('cars', 'n'))\n...: print(wnl.lemmatize('men',\
  \ 'n'))\ncar\nmen\n# 对动词进行词形还原\nIn [516]: print(wnl.lemmatize('running', 'v'))\n\
  ...: print(wnl.lemmatize('ate', 'v'))\nrun\neat\n# 对形容词进行词形还原\nIn [517]: print(wnl.lemmatize('saddest',\
  \ 'a'))\n...: print(wnl.lemmatize('fancier', 'a'))\nsad\nfancy\n```\n\n这段代码展示了如何使用词形还原将每个单词转换为其基本形式，这有助于我们统一词汇。该代码利用了\
  \ `WordNetLemmatizer` 类，该类内部使用了属于 `WordNetCorpusReader` 类的 `morphy()` 函数。此函数基本通过检查\
  \ WordNet 语料库，利用单词及其词性找到给定单词的基本形式或词元，并采用递归技术去除单词的词缀，直到在 WordNet 中找到匹配项。如果找不到匹配项，则原样返回输入的单词。词性极其重要，因为如果词性错误，词形还原将失效，如下方代码片段所示。\n\
  \n```\n# 无效的词形还原\nIn [518]: print wnl.lemmatize('ate', 'n')\n...: print wnl.lemmatize('fancier',\
  \ 'v')\nate\nfancier\n```\n\nSpaCy 则让事情变得简单得多，因为它会自动对文本文档中的每个词元进行词性标注和有效的词形还原，无需担心是否能有效使用词形还原。借助\
  \ spaCy，我们可以使用以下函数执行有效的词形还原！\n\n```\nimport spacy\nnlp = spacy.load('en_core', parse=True,\
  \ tag=True, entity=True)\ntext = 'My system keeps crashing his crashed yesterday,\
  \ ours crashes daily'\ndef lemmatize_text(text):\ntext = nlp(text)\ntext = ' '.join([word.lemma_\
  \ if word.lemma_ != '-PRON-' else word.text for word in text])\nreturn text\nlemmatize_text(\"\
  My system keeps crashing! his crashed yesterday, ours crashes daily\")\n'My system\
  \ keep crash ! his crash yesterday , ours crash daily'\n```\n\n你可以利用 NLTK 或 spaCy\
  \ 构建自己的词形还原器。请随意使用你自己的数据对这些函数进行试验。\n\n### 去除停用词\n\n`停用词` 是指那些意义很小或没有意义的词，在处理文本时通常被移除，以便保留具有最大意义和上下文信息的词。如果根据单一词元聚合文本语料库并检查其频率，停用词通常出现得最为频繁。像\
  \ \"a\"、\"the\"、\"and\" 等词都属于停用词。停用词没有通用或详尽的列表，通常每个领域或语言都有自己的停用词集合。我们在以下代码片段中展示了一种过滤并去除英文停用词的方法。\n\
  \n```\nfrom nltk.tokenize.toktok import ToktokTokenizer\ntokenizer = ToktokTokenizer()\n\
  stopword_list = nltk.corpus.stopwords.words('english')\ndef remove_stopwords(text,\
  \ is_lower_case=False):\ntokens = tokenizer.tokenize(text)\ntokens = [token.strip()\
  \ for token in tokens]\nif is_lower_case:\nfiltered_tokens = [token for token in\
  \ tokens if token not in stopword_list]\nelse:\nfiltered_tokens = [token for token\
  \ in tokens if token.lower() not in stopword_list]\nfiltered_text = ' '.join(filtered_tokens)\n\
  return filtered_text\nremove_stopwords(\"The, and, if are stopwords, computer is\
  \ not\")\n', , stopwords , computer'\n```\n\n没有通用的停用词列表，但我们使用了来自 NLTK 的标准英文停用词列表。你也可以根据需要添加自己领域特定的停用词。在上一个函数中，我们利用了\
  \ NLTK 提供的英文停用词列表，并据此过滤掉所有属于停用词的词元。输出结果显示，与之前相比，词元数量有所减少，你可以对比并检查被作为停用词移除的词元。要查看\
  \ NLTK 词汇表中的所有英文停用词列表，可以打印 `nltk.corpus.stopwords.words('english')` 的内容以了解各种停用词。需要记住的重要一点是，像\
  \ \"not\" 和 \"no\" 这样的否定词在此例中（第一句中）会被移除，而在诸如情感分析等应用中，保留这些词对于保持句子原意至关重要。因此，在这些场景下，你需要确保不要移除这些词。\n\
  \n\n\n### 融会贯通：构建文本规范化器\n\n现在，我们将学到的所有知识整合起来，串联这些操作，构建一个文本规范化器，用于预处理文本数据。我们专注于在自定义函数中包含文本处理中常用的主要组件。\n\
  \n```\ndef normalize_corpus(corpus, html_stripping=True, contraction_expansion=True,\n\
  accented_char_removal=True, text_lower_case=True,\ntext_lemmatization=True, special_char_removal=True,\n\
  stopword_removal=True, remove_digits=True):\nnormalized_corpus = []\n# 对语料库中的每个文档进行规范化\n\
  for doc in corpus:\n# 去除 HTML 标签\nif html_stripping:\ndoc = strip_html_tags(doc)\n\
  # 去除重音字符\nif accented_char_removal:\ndoc = remove_accented_chars(doc)\n# 展开缩写\n\
  if contraction_expansion:\ndoc = expand_contractions(doc)\n# 转换为小写\nif text_lower_case:\n\
  doc = doc.lower()\n# 去除多余换行符\ndoc = re.sub(r'[\\r|\\n|\\r\\n]+', ' ',doc)\n### 词形还原\n\
  if text_lemmatization:\ndoc = lemmatize_text(doc)\n# 去除特殊字符和/或数字\nif special_char_removal:\n\
  # 在特殊字符之间插入空格以隔离它们\nspecial_char_pattern = re.compile(r'([{.(-)!}])')\ndoc = special_char_pattern.sub(\"\
  \ \\\\1 \", doc)\ndoc = remove_special_characters(doc, remove_digits=remove_digits)\n\
  # 去除多余空格\ndoc = re.sub(' +', ' ', doc)\n### 去除停用词\nif stopword_removal:\ndoc = remove_stopwords(doc,\
  \ is_lower_case=text_lower_case)\nnormalized_corpus.append(doc)\nreturn normalized_corpus\n\
  ```\n\n现在，让我们来实际运用这个函数！我们将使用之前章节中的示例文本作为输入文档，并通过上述函数对其进行预处理。\n\n```\n{'Original':\
  \ sample_text,\n'Processed': normalize_corpus([sample_text])[0]}\n{'Original': \"\
  US unveils world's most powerful supercomputer, beats China. The US has unveiled\
  \ the world's most powerful supercomputer called 'Summit', beating the previous\
  \ record-holder China's Sunway TaihuLight. With a peak performance of 200,000 trillion\
  \ calculations per second, it is over twice as fast as Sunway TaihuLight, which\
  \ is capable of 93,000 trillion calculations per second. Summit has 4,608 servers,\
  \ which reportedly take up the size of two tennis courts.\",\n'Processed': 'us unveil\
  \ world powerful supercomputer beat china us unveil world powerful supercomputer\
  \ call summit beat previous record holder chinas sunway taihulight peak performance\
  \ trillion calculation per second twice fast sunway taihulight capable trillion\
  \ calculation per second summit server reportedly take size two tennis court'}\n\
  ```\n\n由此可见，我们的文本预处理器是如何帮助预处理示例新闻文章的！在下一节中，我们将探讨如何分析和理解文本数据的句法属性与结构。\n\n## 理解文本句法与结构\n\
  \n我们在第 1 章中详细讨论了语言句法和结构。如果你不记得基础知识，请前往第 1 章中“语言句法与结构”一节，快速浏览以了解分析和理解文本数据句法与结构的各种方法。为了唤起你的记忆，让我们简要回顾一下文本句法和结构的重要性。\n\
  \n对于任何语言而言，句法和结构通常密不可分，它们由一组特定的规则、惯例和原则构成，决定了词语如何组合成短语、短语如何组合成从句、从句如何组合成句子。本节将专门讨论英语的句法和结构。在英语中，词语通常组合成其他构成单位。这些构成单位包括词语、短语、从句和句子。句子“The\
  \ brown fox is quick and he is jumping over the lazy dog”由一组词语组成。仅看这些词语本身，我们获取的信息非常有限（参见图\
  \ 3-3）。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig3_HTML.jpg](img/427287_2_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** 一组无序的词语无法传达太多信息\n\n关于语言结构和句法的知识在文本处理、标注和解析等多个领域非常有用，可用于诸如文本分类或摘要等后续操作。在本节中，我们将实现一些用于理解文本句法和结构的概念与技术。这在自然语言处理中极为重要，通常在文本处理与整理之后进行。我们将重点实现以下技术：\n\
  \n- 词性标注\n- 浅层解析或组块分析\n- 依存句法分析\n- 成分句法分析\n\n本书面向实践者，强调并专注于在现实问题中实施和使用技术与算法的最佳方法。因此，在接下来的章节中，我们将探讨如何最佳地利用如`NLTK`和`spaCy`等库来实现其中一些技术。此外，鉴于你可能对内部原理以及自行实现这些技术感兴趣，我们也会介绍实现方法。在深入细节之前，我们先了解所需库的依赖关系和安装细节，因为其中一些库的安装并不十分简单。\n\
  \n\n\n### 安装必要的依赖\n\n我们将利用多个库和依赖：\n\n- `nltk` 库\n- `spacy` 库\n- Stanford Parser\n\
  - Graphviz 及用于可视化的必要库\n\n我们在第 1 章中简要介绍了安装 NLTK。你可以直接打开终端或命令提示符，输入 `pip install nltk`\
  \ 来下载并安装它。请务必安装版本不低于 3.2.4 的库。下载并安装 NLTK 后，记得下载语料库，我们在第 1 章中也讨论过这一点。关于下载和安装 NLTK\
  \ 的更多详细信息，你可以参考 [`http://www.nltk.org/install.html`](http://www.nltk.org/install.html)\
  \ 和 [`http://www.nltk.org/data.html`](http://www.nltk.org/data.html) 上的信息，其中说明了如何安装数据依赖。启动\
  \ Python 解释器并使用以下代码片段。\n\n```\nimport nltk\n# 下载所有依赖和语料库\nnltk.download('all', halt_on_error=False)\n\
  # 或者使用基于 GUI 的下载器并选择依赖\nnltk.download()\n```\n\n要安装 spaCy，请在终端中输入 `pip install spacy`\
