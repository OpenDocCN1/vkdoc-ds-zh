  \ u'roast', u'turkey'),\n (u'arithmetic', u'ambition', u'distraction'),\n (u'brother',\
  \ u'latin', u'grammar'),\n (u'canvas', u'bag', u'tied'),\n (u'cherry', u'tart',\
  \ u'custard'),\n (u'circle', u'exact', u'shape')]\n```\n\n现在你已经了解了如何使用 n-gram 生成方法计算语料库中的搭配。我们将在下一节探讨一种基于词性标注和术语加权的更好的关键词生成方法。\n\
  \n## 基于加权的词性标注短语提取\n\n现在我们来看一种略有不同的关键词提取方法。该方法借鉴了几篇论文的概念，即 K. Barker 和 N. Cornachhia\
  \ 的《使用名词短语中心词提取文档关键词》以及 Ian Witten 等人的《KEA：实用的自动关键词提取》，如果你对其实验和方法的更多细节感兴趣，可参考这些论文。我们的算法遵循两步流程，具体如下：\n\
  \n1.  使用浅层解析提取所有名词短语块。\n2.  计算每个块的 TF-IDF 权重，并返回权重最高的短语。\n\n第一步，我们使用基于词性标签的简单模式来提取名词短语块。你在第\
  \ 3 章中应该已经熟悉了这一点，当时我们探讨了组块分析和浅层解析。在讨论我们的算法之前，先加载将要测试实现的语料库。我们使用维基百科中关于大象的一段样本描述，该描述位于\
  \ `elephants.txt` 文件中，你可以从本书的 GitHub 仓库获取：[`https://github.com/dipanjanS/text-analytics-with-python`](https://github.com/dipanjanS/text-analytics-with-python)。\n\
  \n```python\ndata = open('elephants.txt', 'r+').readlines()\nsentences = nltk.sent_tokenize(data[0])\n\
  len(sentences)\n```\n\n```python\n# 查看前三行\nsentences[:3]\n['Elephants are large\
  \ mammals of the family Elephantidae and the order Proboscidea.',\n 'Three species\
  \ are currently recognised: the African bush elephant (Loxodonta africana), the\
  \ African forest elephant (L. cyclotis), and the Asian elephant (Elephas maximus).',\n\
  \ 'Elephants are scattered throughout sub-Saharan Africa, South Asia, and Southeast\
  \ Asia.']\n```\n\n现在，让我们使用精巧的 `text_normalizer` 模块对语料库进行一些非常基础的文本预处理。\n\n```python\n\
  norm_sentences = tn.normalize_corpus(sentences, text_lower_case=False,\n       \
  \                              text_stemming=False, text_lemmatization=False,\n\
  \                                     stopword_removal=False)\nnorm_sentences[:3]\n\
  ['Elephants are large mammals of the family Elephantidae and the order Proboscidea',\n\
  \ 'Three species are currently recognised the African bush elephant Loxodonta africana\
  \ the African forest elephant L cyclotis and the Asian elephant Elephas maximus',\n\
  \ 'Elephants are scattered throughout subSaharan Africa South Asia and Southeast\
  \ Asia']\n```\n\n语料库准备就绪后，我们将使用模式 `\" NP: {<DT>? <JJ>* <NN.*>+}\"` 从文档/句子语料库中提取所有可能的名词短语。你随时可以尝试更复杂的模式，后期甚至可融入动词、形容词或副词短语。但在此我们保持简洁，专注于核心逻辑。确定模式后，我们将定义一个函数，使用以下代码片段进行解析和提取。同时，在此处加载其他必要的依赖项。\n\
  \n```python\nimport itertools\nstopwords = nltk.corpus.stopwords.words('english')\n\
  \ndef get_chunks(sentences, grammar=r'NP: {<DT>?<JJ>*<NN.*>+}',\n              \
  \ stopword_list=stopwords):\n    all_chunks = []\n    chunker = nltk.chunk.regexp.RegexpParser(grammar)\n\
  \    for sentence in sentences:\n        tagged_sents = [nltk.pos_tag(nltk.word_tokenize(sentence))]\n\
  \        chunks = [chunker.parse(tagged_sent) for tagged_sent in tagged_sents]\n\
  \        wtc_sents = [nltk.chunk.tree2conlltags(chunk) for chunk in chunks]\n  \
  \      flattened_chunks = list(\n            itertools.chain.from_iterable(\n  \
  \              wtc_sent for wtc_sent in wtc_sents)\n        )\n        valid_chunks_tagged\
  \ = [(status, [wtc for wtc in chunk])\n                               for status,\
  \ chunk\n                               in itertools.groupby(flattened_chunks,\n\
  \                                                    lambda word_pos_chunk: word_pos_chunk[2]\
  \ != 'O')]\n        valid_chunks = [' '.join(word.lower()\n                    \
  \             for word, tag, chunk in wtc_group\n                              \
  \   if word.lower() not in stopword_list)\n                        for status, wtc_group\
  \ in valid_chunks_tagged\n                        if status]\n        all_chunks.append(valid_chunks)\n\
  \    return all_chunks\n```\n\n\n\n在这个函数中，我们定义了一个用于分块或提取名词短语的语法模式。我们基于相同的模式定义了一个分块器，对于文档中的每个句子，我们首先用词性标注对其进行标注，然后构建一个浅层解析树，其中名词短语作为语块，所有其他基于词性标注的单词作为非语块（不属于任何语块）。完成后，我们使用\
  \ `tree2conlltags` 函数生成 `(w, t, c)` *三元组*，即单词、词性标签和 IOB 格式的语块标签（详见第 3 章）。我们删除所有语块标签为\
  \ `O` 的标签，因为它们基本上是不属于任何语块的单词或术语。最后，从这些有效的语块中，我们组合分块后的术语，从每个语块组生成短语。我们可以在以下代码片段中的语料库上看到这个函数的实际应用。\n\
  \n```\nchunks = get_chunks(norm_sentences)\nchunks\n[['elephants', 'large mammals',\
  \ 'family elephantidae', 'order proboscidea'],\n['species', 'african bush elephant\
  \ loxodonta', 'african forest elephant l cyclotis', 'asian elephant elephas maximus'],\n\
  ['elephants', 'subsaharan africa south asia', 'southeast asia'],\n...,\n...,\n['incisors',\
  \ 'tusks', 'weapons', 'tools', 'objects'],\n['elephants', 'flaps', 'body temperature'],\n\
  ['pillarlike legs', 'great weight'],\n...,\n...,\n['threats', 'populations', 'ivory\
  \ trade', 'animals', 'ivory tusks'],\n['threats', 'elephants', 'habitat destruction',\
  \ 'conflicts', 'local people'],\n['elephants', 'animals', 'asia'],\n['past', 'war\
  \ today', 'display', 'zoos', 'entertainment', 'circuses'],\n['elephants', 'art folklore\
  \ religion literature', 'popular culture']]\n```\n\n此输出显示了文档中每个句子的所有有效关键短语。您已经可以看到，由于我们针对的是名词短语，因此所有短语都涉及基于名词的实体。现在我们基于\
  \ `get_chunks()` 函数，为步骤 2 实现必要的逻辑：我们将使用 Gensim 在关键短语上构建一个基于 TF-IDF 的模型，然后根据每个关键短语在语料库中的出现频率计算其\
  \ TF-IDF 权重。最后，我们根据这些关键短语的 TF-IDF 权重进行排序，并显示前 N 个关键短语，其中 `top_n` 由用户指定。\n\n```\n\
  from gensim import corpora, models\ndef get_tfidf_weighted_keyphrases(sentences,\n\
  grammar=r'NP: {? <NN.*>+}',\ntop_n=10):\n    valid_chunks = get_chunks(sentences,\
  \ grammar=grammar)\n    dictionary = corpora.Dictionary(valid_chunks)\n    corpus\
  \ = [dictionary.doc2bow(chunk) for chunk in valid_chunks]\n    tfidf = models.TfidfModel(corpus)\n\
  \    corpus_tfidf = tfidf[corpus]\n    weighted_phrases = {dictionary.get(idx):\
  \ value\n                       for doc in corpus_tfidf\n                      \
  \ for idx, value in doc}\n    weighted_phrases = sorted(weighted_phrases.items(),\n\
  \                              key=itemgetter(1), reverse=True)\n    weighted_phrases\
  \ = [(term, round(wt, 3)) for term, wt in weighted_phrases]\n    return weighted_phrases[:top_n]\n\
  ```\n\n我们现在可以在玩具语料库上测试这个函数，使用以下代码片段生成前 30 个关键短语。\n\n```\n# 前 30 个 tf-idf 加权关键短语\n\
  get_tfidf_weighted_keyphrases(sentences=norm_sentences, top_n=30)\n[('water', 1.0),\
  \ ('asia', 0.807), ('wild', 0.764), ('great weight', 0.707),\n('pillarlike legs',\
  \ 0.707), ('southeast asia', 0.693), ('subsaharan africa south asia', 0.693), ('body\
  \ temperature', 0.693), ('flaps', 0.693), ('fissionfusion society', 0.693), ('multiple\
  \ family groups', 0.693), ('art folklore religion literature', 0.693), ('popular\
  \ culture', 0.693), ('ears', 0.681), ('males', 0.653), ('males bulls', 0.653), ('family\
  \ elephantidae', 0.607), ('large mammals', 0.607), ('years', 0.607), ('environments',\
  \ 0.577), ('impact', 0.577), ('keystone species', 0.577), ('cetaceans', 0.577),\
  \ ('elephant intelligence', 0.577), ('primates', 0.577), ('dead individuals', 0.577),\
  \ ('kind', 0.577), ('selfawareness', 0.577), ('different habitats', 0.57), ('marshes',\
  \ 0.57)]\n```\n\n有趣的是，我们在关键短语中看到了各种类型的大象，如亚洲象和非洲象，以及大象的典型特征，如“巨大的重量”、“裂变-融合社会”和“柱状腿”。\n\
  \n我们还可以利用 Gensim 的摘要模块，它有一个从文本中提取关键字的 `keywords` 函数。这使用了 TextRank 算法的一个变体，我们将在文档摘要部分探讨该算法。\n\
  \n```\nfrom gensim.summarization import keywords\nkey_words = keywords(data[0],\
  \ ratio=1.0, scores=True, lemmatize=True)\n[(item, round(score, 3)) for item, score\
  \ in key_words][:25]\n[('african bush elephant', 0.261), ('including', 0.141), ('family',\
  \ 0.137),\n('cow', 0.124), ('forests', 0.108), ('female', 0.103), ('asia', 0.102),\n\
  ('objects', 0.098), ('tigers', 0.098), ('sight', 0.098), ('ivory', 0.098),\n('males',\
  \ 0.088), ('folklore', 0.087), ('known', 0.087), ('religion', 0.087),\n('larger\
  \ ears', 0.085), ('water', 0.075), ('highly recognisable', 0.075),\n('breathing\
  \ lifting', 0.074), ('flaps', 0.073), ('africa', 0.072),\n('gomphotheres', 0.072),\
  \ ('animals tend', 0.071), ('success', 0.071),\n('south', 0.07)]\n```\n\n因此，您可以看到关键短语提取如何从文本文档中提取关键重要概念并对其进行总结。尝试在其他语料库上使用这些函数，观察有趣的结果！\n\
  \n## 主题建模\n\n我们已经了解了如何使用几种技术提取关键短语。虽然这些短语指出了文档或语料库中的关键点，但这项技术过于简单，通常无法准确描述语料库中的各种主题或概念，特别是当我们处理包含不同区分主题或概念的文档语料库时。\n\
  \n主题模型是专门为从包含各种类型文档的大型语料库中提取各种区分概念或主题而设计的，其中每个文档涉及一个或多个概念。这些概念可以是思想、观点、事实、看法、陈述等等。主题建模的主要目的是使用数学和统计技术来发现语料库中隐藏和潜在的语义结构。\n\
  \n主题建模涉及从文档术语中提取特征，并使用数学结构和框架（如矩阵分解和 SVD）来生成彼此可区分的术语聚类或分组，这些词簇形成主题或概念。这些概念可用于解释语料库的主要主题，并在各种文档中频繁共现的词语之间建立语义联系。有多种框架和算法可用于构建主题模型。我们涵盖以下三种方法：\n\
  \n*   潜在语义索引\n*   潜在狄利克雷分配\n*   非负矩阵分解\n\n前两种方法相当流行且历史悠久。最后一种技术，非负矩阵分解，是一种较新但极其有效的技术，并能提供出色的结果。我们利用\
  \ Gensim 和 Scikit-Learn 进行实际实现，并研究如何基于潜在语义索引构建我们自己的主题模型。\n\n与上一版相比，我们在本版新书中采用了一些不同的做法。我们没有使用玩具数据集，而是像在其他章节中那样，使用一个复杂的真实世界数据集。在接下来的几节中，我们将演示如何使用前面提到的三种方法进行主题建模。为了演示，我们利用了两个最流行的框架——Gensim\
  \ 和 Scikit-Learn。这里的目标是理解如何轻松地利用这些框架构建主题模型，并理解幕后一些基本概念。\n\n\n\n"
- '# 研究论文主题建模


  我们将在此进行一项有趣的练习——对极受欢迎的 NIPS 会议（现称为 NeurIPS 会议）的过往研究论文进行主题建模。已故的 Sam Roweis 教授整理了一份优秀的
  NIPS 会议论文合集（第 1 卷至第 12 卷），你可以在[`https://cs.nyu.edu/~roweis/data.html`](https://cs.nyu.edu/%257Eroweis/data.html)找到。有趣的是，他是通过处理
  NIPS 1-12 期 OCR 数据获得这份合集的，那实际上还是电子投稿之前的时代。Yann LeCun 公开了这些数据。在[`http://ai.stanford.edu/~gal/data.html`](http://ai.stanford.edu/%257Egal/data.html)上还有一个更新至
  NIPS 17 期的数据集。不过，该数据集是 MAT 文件格式，你可能需要先进行一些额外的预处理，才能在 Python 中使用。


  ## 主要目标


  结合我们目前的讨论，我们的主要目标相当简单。给定一大批会议研究论文，我们能否利用无监督学习从中识别出一些关键主题或话题？我们并没有标注好的类别来告诉我们每篇研究论文的主要主题是什么。除此之外，我们处理的是通过
  OCR（光学字符识别）提取的文本数据。因此，可以预料到会出现拼写错误的单词、字符缺失的单词等问题，这使得我们的问题更具挑战性。我们此次主题建模练习的关键目标在于展示以下几点：


  *   使用 Gensim 和 Scikit-Learn 进行主题建模

  *   使用 LDA、LSI 和 NMF 实现主题模型

  *   如何利用像 MALLET 这样的第三方建模框架进行主题建模

  *   评估主题建模性能

  *   调优主题模型以获得最佳主题

  *   解读主题建模结果

  *   预测新研究论文的主题


  关键在于，我们可以利用主题建模从 NIPS 研究论文中识别出一些主要主题，解读这些主题，甚至能够预测新论文的主题！


