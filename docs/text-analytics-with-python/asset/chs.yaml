  \n\n\n# 8. 语义分析\n\n随着机器学习的兴起以及深度学习和人工智能等进一步的发展，自然语言理解在过去十年中获得了显著的重要性。计算机（或泛指机器）可以被编程以学习特定事物或执行特定操作。然而，关键的限制在于它们无法像人类一样感知、理解和领悟事物。随着神经网络的重新流行以及计算机架构的进步，我们现在拥有快速发展的深度学习和人工智能，我们一直在让机器自主学习、感知、理解和执行操作。你可能已经看到或听到过许多这样的成果，例如自动驾驶汽车、在象棋和围棋等游戏中击败资深玩家的计算机，以及最近的聊天机器人。到目前为止，我们已经研究了各种计算、语言处理和机器学习技术来对文本进行分类、聚类和摘要。我们还开发了一些方法和程序来分析理解文本的句法和结构。本章将探讨试图回答这样一个问题的方法：“我们能否分析和理解一段文本背后的含义和情感？”\n\
  \n自然语言处理有着广泛的应用。人们试图利用自然语言理解来推断文本背后的含义和上下文，并解决各种问题。我们在第 1 章中简要讨论了其中的一些应用。为了唤起你的记忆，以下应用需要从语义角度进行深入理解。\n\
  \n*   问答系统\n*   上下文识别\n*   语音识别（针对某些应用）\n\n文本语义专门处理理解文本或语言的含义。词汇在组合成句子时，会产生一些词汇关系和上下文关系。这导致了各种类型的关系和层次结构。语义学处于这一切的核心，因为它试图分析和理解这些关系，并从中推断出含义。我们将探索自然语言中各种类型的语义关系，并研究一些基于自然语言处理的技术，用于从文本中推断和提取有意义的语义信息。语义学纯粹关注上下文和含义，文本结构在此意义不大。然而，有时单词的句法或排列顺序有助于我们推断单词的上下文，并帮助我们区分诸如作为金属的“lead”和作为电影主角的“lead”这类词语！\n\
  \n在本章中，我们将涵盖语义分析的几个方面。我们首先探索`WordNet`（一个词汇数据库），并介绍一个称为*同义词集*的新概念。我们还将探索自然语言中的各种语义关系和表示。我们将涵盖如词义消歧和命名实体识别（NER）等技术，你甚至将从头开始构建你自己的\
  \ NER！让我们开始吧。本章展示的所有代码示例均可在本书的官方 GitHub 仓库中找到，你可以通过[`https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition`](https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition)访问。\n\
  \n## 语义分析\n\n我们已经了解了术语或单词如何被分组为短语，进而形成从句，最后形成句子。第 3 章向我们展示了自然语言中的各种结构成分，包括词性、组块和语法。所有这些概念都属于文本数据的句法和结构分析范畴。虽然我们确实探索了单词、短语和从句的关系，但这些纯粹是基于它们的位置、句法和结构。语义分析更侧重于理解文本中单词背后的实际上下文和含义，以及它们如何与其他单词关联并作为一个整体传达某些信息。\n\
  \n正如第 1 章所述，*语义学*是研究意义的学科。*语言语义学*是语言学中一个完整的分支，专门研究自然语言中的意义。这包括探索单词、短语和符号之间的关系。除此之外，还有多种方式来表示与陈述和命题相关的语义。我们将在语义分析下广泛涵盖以下主题：\n\
  \n*   探索`WordNet`和同义词集\n*   分析词汇语义关系\n*   词义消歧\n*   命名实体识别\n*   分析语义表示\n\n这些主题的主要目标是让你清楚了解可用于语义分析的方法论，以及如何使用它们。你可以通过重新阅读第\
  \ 1 章中的“语言语义学”部分来唤起回忆。我们将在本章中结合实际案例再次回顾其中的一些概念。事不宜迟，让我们开始吧！\n\n## 探索 WordNet\n\n\
  `WordNet`是一个庞大的英语词汇数据库。该数据库属于普林斯顿大学，你可以通过[`https://wordnet.princeton.edu/`](https://wordnet.princeton.edu/)（`WordNet`的官方网站）获取更详细的信息。它最初于\
  \ 1985 年在普林斯顿大学认知科学实验室由 G.A. Miller 教授指导下创建。该词汇数据库包含名词、形容词、动词和副词。相关的词汇术语根据共同概念被分组到集合中。这些集合被称为认知同义词集或*同义词集*，每一个都表达了一个独特、明确的概念。\n\
  \n在高层面上，`WordNet`可以比作一个提供单词及其同义词的同义词库或词典，但在更深的层面上，它的功能远不止于此。同义词集及其对应的术语基于其语义含义具有详细的关系和层次结构。`WordNet`在文本分析、自然语言处理和基于人工智能的应用中被广泛用作词汇数据库。\n\
  \n`WordNet`数据库包含超过 155,000 个单词，它们分布在 117,000 个同义词集中，并包含超过 206,000 个词-义对。该数据库大约 12MB，可以通过各种接口和\
  \ API 访问。官方网站有一个网络应用界面，用于访问与单词、同义词集和概念相关的各种详细信息。你可以通过[`http://wordnetweb.princeton.edu/perl/webwn`](http://wordnetweb.princeton.edu/perl/webwn)访问它，或者从[`https://wordnet.princeton.edu/wordnet/download/`](https://wordnet.princeton.edu/wordnet/download/)下载，那里包含与`WordNet`相关的各种包、文件和工具。我们将使用`NLTK`包提供的接口，以编程方式访问`WordNet`。我们首先探索同义词集，然后利用同义词集探索各种语义关系。\n\
  \n\n\n### 理解同义词集\n\n我们开始通过查看同义词集来探索 WordNet，因为它们可能是最重要的结构之一，并将所有内容联系在一起。通常，基于自然语言处理和信息检索的概念，同义词集被定义为一系列语义上相似的数据实体集合。这并不意味着它们完全相同，而是它们都围绕相似的语境和概念。具体到\
  \ WordNet 的上下文，同义词集被定义为一组可互换的、围绕特定概念的同义词集合。同义词集不仅包含简单的词汇，还包括搭配词。多义词形式（即读音和写法相同，但具有不同但相关的含义的词）会根据其含义被分配到不同的同义词集中。同义词集之间通过语义关系相互连接，我们将在后续章节中探讨这些关系。通常，每个同义词集都包含词汇本身、解释词汇含义的定义、一些可选示例以及与该词汇相关的词元（同义词集合）。某些词汇可能对应多个同义词集，每个同义词集都带有特定的上下文。\n\
  \n让我们通过使用 NLTK 的 WordNet 接口来查看一个实际示例，探索与单词“fruit”相关的同义词集。我们可以通过以下代码片段来实现。\n\n```\n\
  from nltk.corpus import wordnet as wn\nimport pandas as pd\nterm = 'fruit'\nsynsets\
  \ = wn.synsets(term)\n"
- '# 显示总同义词集数量

  print ''Total Synsets:'', len(synsets)

  Total Synsets: 5

