  \ == results_df['Test Accuracy'].max()]['Model Dir'].values[0]`\n\n# `加载模型`\n`embedding_feature\
  \ = hub.text_embedding_column(key='sentence', module_spec=\"https://tfhub.dev/google/universal-sentence-encoder/2\"\
  , trainable=True)`\n`dnn = tf.estimator.DNNClassifier(hidden_units=[512, 128], feature_columns=[embedding_feature],\
  \ n_classes=2, activation_fn=tf.nn.relu, dropout=0.1, optimizer=tf.train.AdagradOptimizer(learning_rate=0.005),\
  \ model_dir=best_model_dir)`\n\n# `定义获取模型预测的函数`\n`def get_predictions(estimator,\
  \ input_fn):`\n    `return [x[\"class_ids\"][0] for x in estimator.predict(input_fn=input_fn)]`\n\
  \n# `获取模型对测试数据的预测`\n`predictions = get_predictions(estimator=dnn, input_fn=predict_test_input_fn)`\n\
  `predictions[:10]`\n`[0, 1, 0, 1, 1, 0, 1, 1, 1, 1]`\n\n评估模型性能的最佳方法之一是以混淆矩阵的形式可视化模型预测（见图\
  \ 10-12）。\n\n![../images/427287_2_En_10_Chapter/427287_2_En_10_Fig12_HTML.jpg](img/427287_2_En_10_Fig12_HTML.jpg)\n\
  \n图 10-12：基于最佳模型预测的混淆矩阵\n\n```\nimport seaborn as sns\nimport matplotlib.pyplot\
  \ as plt\n%matplotlib inline\nwith tf.Session() as session:\ncm = tf.confusion_matrix(test_sentiments,\
  \ predictions).eval()\nLABELS = ['negative', 'positive']\nsns.heatmap(cm, annot=True,\
  \ xticklabels=LABELS, yticklabels=LABELS, fmt=\"g\")\nxl = plt.xlabel(\"Predicted\"\
  )\nyl = plt.ylabel(\"Actuals\")\n```\n\n我们还可以使用 Scikit-Learn 打印模型的分类报告，以描述可从混淆矩阵推导出的其他重要指标，包括精确率、召回率和\
  \ F1 分数。\n\n```\nfrom sklearn.metrics import classification_report\nprint(classification_report(y_true=test_sentiments,\
  \ y_pred=predictions, target_names=LABELS))\n```\n\n```\n          precision   \
  \ recall  f1-score   support\nnegative       0.90      0.90      0.90      7490\n\
  positive       0.90      0.90      0.90      7510\navg / total    0.90      0.90\
  \      0.90     15000\n```\n\n模型在测试数据上的整体准确率和 F1 分数达到了 90%，效果非常不错。你可以亲自尝试一下，或许能得到更高的分数；如果是这样，请告诉我！\n\
  \n## 总结与未来展望\n\n通用语句嵌入无疑是推动迁移学习在各种 NLP 任务中应用的一大步。事实上，我们已经看到像 ELMo、Universal Sentence\
  \ Encoder 和 ULMFiT 这样的模型通过展示预训练模型可用于在 NLP 任务中取得最优结果而登上了头条。我对 NLP 进一步泛化以及使我们能够轻松解决复杂任务的未来前景感到无比兴奋。\n\
  \n本书最后一章到此结束。希望这能帮助你在现实世界中应用在这里学到的一些知识，来解决你自己在 NLP 领域的实际问题。永远记住*奥卡姆剃刀*原则，即最简单的解决方案通常是最好的解决方案。尽管深度学习方法当下可能很热门，但它们并非解决所有问题的万能钥匙。只有当你认为这样做完全合理时，才应该利用它们；随着时间推移，通过直觉、实验、练习和阅读，你会更好地理解这一点。现在，去解决一些有趣的\
