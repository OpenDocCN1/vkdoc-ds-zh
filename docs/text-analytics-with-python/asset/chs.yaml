  \ '惊声尖叫 2', '16 街区', '幻影英雄', '情归新泽西', '第 25 小时', '校园兔女郎', '灵幻夹克', '挑战星期天']\n\n簇\
  \ #26\n热门电影: ['小黄人大眼萌', '阿凡达', '马达加斯加的企鹅', '钢铁侠 3', '伦敦陷落', '了不起的盖茨比', '超验骇客', '第五波',\
  \ '丧尸乐园', '精灵旅社', '灵魂战车 2：复仇时刻', '温暖的尸体', '保罗', '末日危途', '亚历山大', '世界末日', 'BJ 单身日记',\
  \ '特种部队：眼镜蛇的崛起', '发胶', '舞出我人生之舞动革命']\n```\n\n\n\n### 沃德凝聚层次聚类\n\n层次聚类算法族与之前讨论的其他聚类模型略有不同。层次聚类试图通过连续合并或分裂来构建一个嵌套的聚类层级结构。层次聚类主要有两种策略：\n\
  \n- **凝聚式：** 这类算法采用自底向上的方法。所有数据点最初都属于自己的独立簇，然后从这一底层开始，我们逐步合并簇，从而在上升过程中构建出簇的层级。\n\
  - **分裂式：** 这类算法采用自顶向下的方法。所有数据点最初都属于一个单一的大簇，然后随着我们逐步向下，开始递归地对其进行划分。这会产生一个自上而下的簇层级结构。\n\
  \n合并和分裂通常使用贪心算法进行，簇层级结构的最终结果可以可视化为一种树状结构，称为*树状图*。图 7-10 展示了如何使用凝聚层次聚类构建树状图。\n\n\
  ![../images/427287_2_En_7_Chapter/427287_2_En_7_Fig10_HTML.jpg](img/427287_2_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10：凝聚层次聚类表示\n\n图 7-10 清晰地展示了六个独立的数据点如何作为六个簇开始，然后我们如何在每一步，遵循自底向上的方法，缓慢地开始将它们分组。本节我们将使用凝聚层次聚类算法。在凝聚聚类中，当从单个数据点簇开始时，为了决定应该合并哪些簇，我们需要两样东西：\n\
  \n- 一个*距离度量*，用于衡量数据点之间的相似度或不相似度。在我们的实现中，将使用余弦距离/相似度。\n- 一个*链接准则*，它决定了用于簇合并策略的度量标准。这里我们将使用沃德方法。\n\
  \n沃德链接准则最小化所有簇内离差平方和的总和，是一种最小化方差的方法。这也被称为沃德最小方差法，最初由 J. Ward 提出。其思想是使用像两点间 L2 范数距离这样的目标函数来最小化每个簇内的方差。我们可以通过以下公式计算每对点之间的初始簇距离：\n\
  \n```\n$$ {d}_{ij}=d\\left(\\left\\{{C}_i,{C}_j\\right\\}\\right)=\\parallel {C}_i-{C}_j{\\\
  parallel}² $$\n```\n\n其中初始时 `C[i]` 表示包含一个文档的簇 **i**，并且在每次迭代中。我们找到那些在合并后导致该簇方差增加最少的簇对。如上公式所示的加权平方欧氏距离（或\
  \ L2 范数）足以满足此算法。我们使用余弦相似度来计算数据集中每对电影之间的余弦距离。以下函数实现了沃德凝聚层次聚类：\n\n```python\nfrom\
  \ scipy.cluster.hierarchy import ward, dendrogram\nfrom sklearn.metrics.pairwise\
  \ import cosine_similarity\n\ndef ward_hierarchical_clustering(feature_matrix):\n\
  \    cosine_distance = 1 - cosine_similarity(feature_matrix)\n    linkage_matrix\
  \ = ward(cosine_distance)\n    return linkage_matrix\n```\n\n要查看层次聚类的结果，我们需要使用链接矩阵绘制树状图。因此，我们实现以下函数，从层次聚类链接矩阵构建并绘制树状图。\n\
  \n```python\ndef plot_hierarchical_clusters(linkage_matrix, movie_data, p=100, figure_size=(8,12)):\n\
  \    # set size\n    fig, ax = plt.subplots(figsize=figure_size)\n    movie_titles\
  \ = movie_data['title'].values.tolist()\n    # plot dendrogram\n    R = dendrogram(linkage_matrix,\
  \ orientation=\"left\", labels=movie_titles,\n                   truncate_mode='lastp',\n\
  \                   p=p,\n                   no_plot=True)\n    temp = {R[\"leaves\"\
  ][ii]: movie_titles[ii] for ii in range(len(R[\"leaves\"]))}\n    def llf(xx):\n\
  \        return \"{}\".format(temp[xx])\n    ax = dendrogram(\n        linkage_matrix,\n\
  \        truncate_mode='lastp',\n        orientation=\"left\",\n        p=p,\n \
  \       leaf_label_func=llf,\n        leaf_font_size=10.,\n    )\n    plt.tick_params(axis=\
  \ 'x',\n                    which='both',\n                    bottom='off',\n \
  \                   top='off',\n                    labelbottom='off')\n    plt.tight_layout()\n\
  \    plt.savefig('movie_hierachical_clusters.png', dpi=200)\n```\n\n现在我们准备对我们的电影数据执行层次聚类！以下代码片段展示了沃德聚类的实际应用。\n\
  \n![../images/427287_2_En_7_Chapter/427287_2_En_7_Fig11_HTML.jpg](img/427287_2_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11：我们电影数据集上的沃德聚类树状图\n\n```python\nlinkage_matrix = ward_hierarchical_clustering(cv_matrix)\n\
  plot_hierarchical_clusters(linkage_matrix,\n                           p=100,\n\
  \                           movie_data=df,\n                           figure_size=(12,\
  \ 14))\n```\n\n图 7-11 中的树状图向我们展示了聚类分析结果。颜色表明有三个主要簇，它们进一步细分为更细粒度的簇，从而维持了一个层级结构。如果您难以阅读小字体或看不到颜色，您可以查看本章代码文件中提供的名为\
  \ `movie_hierachical_clusters.png` 的相同图形。由于可视化空间有限，我们仅在树状图中显示最后 100 部电影。\n\n## 总结\n\
