  \ 3'\n'Baahubali: The Beginning']\n```\n\n从结果来看，可以清晰地发现，我们基于文档相似度的简单推荐系统表现非常出色！我们推荐使用\
  \ Scikit-Learn 的 `cosine_similarity()` 工具函数，它非常实用。你也可以直接使用 Gensim 的 `similarities`\
  \ 模块或 `gensim.matutils` 模块中提供的 `cossim()` 函数。\n\n\n\n### 用于成对文档相似度的 Okapi BM25 排序\n\
  \n在信息检索和搜索引擎中有几种非常流行的技术，包括 PageRank 和 Okapi BM25。术语 BM 代表*最佳匹配*。这项技术也简称为 BM25，但为完整起见，我们称之为`Okapi\
  \ BM25`，因为尽管`BM25`函数背后的概念最初是理论性的，但伦敦城市大学在 1980-90 年代建立了`Okapi`信息检索系统，该系统实施此技术以在实际真实数据上检索文档。\n\
  \n此技术也可称为基于概率相关性的框架或模型，由包括计算机科学家`S. Robertson`和`K. Jones`在内的数人在 1970-80 年代开发。有多种基于不同因素对文档进行排名的函数，`BM25`是其中之一。其较新变体是`BM25F`，其他一些变体包括`BM15`和`BM25+`。\n\
  \n`Okapi BM25`技术可正式定义为一种基于词袋模型的文档排名与检索函数，用于根据用户输入查询检索相关文档。该查询可以是包含一个句子或一组句子的文档，甚至可以只是几个词。`Okapi\
  \ BM25`实际上并非单一函数，而是一个由整个评分函数集合组成的框架，这些函数被组合使用。\n\n考虑我们有一个查询文档`QD`，其中`QD = (q[1],\
  \ q[2], … , q[n])`包含`n`个术语或关键词，并且我们有一个语料库文档`CD`，我们希望从中基于相似度分数检索与查询文档最相关的文档。假设我们有这些，我们可以数学上将这两个文档之间的`BM25`分数定义如下：\n\
  \n```\nbm25(CD, QD) = Σ_{i=1}^{n} idf(q_i) · [f(q_i, CD) · (k1 + 1)] / [f(q_i, CD)\
  \ + k1 · (1 - b + b · (|CD| / avgdl))]\n```\n\n其中函数`bm25(CD, QD)`计算文档`CD`基于查询文档`QD`的`BM25`排名或分数。函数`idf(q[i])`给出术语`q[i]`在语料库中的逆文档频率（`idf`），该语料库包含`CD`，我们将从中检索相关文档。如果你还记得，我们在第\
  \ 4 章实现`tf-idf`特征提取器时计算了`idfs`。为了刷新记忆，它可以表示为：\n\n```\nidf(t) = 1 + log(C / (1 +\
  \ df(t)))\n```\n\n其中`idf(t)`表示术语`t`的`idf`，`C`表示语料库中文档的总数，`df(t)`表示包含术语`t`的文档数量。还有其他实现`idf`的方法，但我们将使用这一种。\n\
  \n附带说明，不同实现的最终结果非常相似。函数`f(q[i], CD)`给出术语`q[i]`在语料库文档`CD`中的频率。表达式`|CD|`表示文档`CD`的总长度，以单词数衡量，而`avgdl`表示我们将从中检索文档的语料库的平均文档长度。此外，你还会观察到有两个自由参数——`k[1]`通常在[1.2，2.0]范围内，`b`通常取\
  \ 0.75。在我们的实现中，将基于`Gensim`框架中`BM25`算法的流行实现，将`k[1]`的值取为 2.5，`b`取为 0.85。\n\n要成功实现并计算文档的`BM25`分数，我们必须经历几个步骤：\n\
  \n1. 计算文档和语料库中术语的频率。\n2. 计算术语的逆文档频率。\n3. 获取语料库文档和查询文档的基于词袋的特征。\n4. 构建一个函数，用于计算给定文档相对于语料库中特定文档的`BM25`分数。\n\
  5. 构建一个函数，利用步骤 4 中的函数，计算并返回给定文档相对于语料库中每个其他文档的`BM25`分数（类似于每个文档的相似度向量）。\n6. 构建一个函数，返回语料库中所有文档的成对`BM25`相似度分数（权重）（利用步骤\
  \ 5 中的函数）。\n\n我们在此实现的代码实际上源自`Gensim`框架，如果你有兴趣利用`BM25`相似度，我们强烈推荐它。我们展示了相似度框架的内部结构，以便你可以将其与先前定义的概念相关联。以下类有助于在我们定义的工作流程中实现从步骤\
  \ 1 到步骤 5 的所有组件。\n\n```\n\"\"\"\nData:\n\n.. data:: PARAM_K1 - Okapi BM25 的自由平滑参数。\n\
  .. data:: PARAM_B - Okapi BM25 的自由平滑参数。\n.. data:: EPSILON - 用于语料库中文档负 idf 的常量。\n\
  \"\"\"\nimport math\nfrom six import iteritems\nfrom six.moves import xrange\nPARAM_K1\
  \ = 2.5\nPARAM_B = 0.85\nEPSILON = 0.2\nclass BM25(object):\n\"\"\"最佳匹配 25 排序函数的实现。\n\
  属性\n\ncorpus_size : int\n语料库的大小（文档数量）。\navgdl : float\n`corpus`中文档的平均长度。\ncorpus\
  \ : list of list of str\n文档语料库。\nf : list of dicts of int\n`corpus`中每个文档的术语频率字典。\n\
  单词作为键，频率作为值。\ndf : dict\n整个`corpus`的术语频率字典。\n单词作为键，频率作为值。\nidf : dict\n整个`corpus`的逆术语频率字典。\n\
  单词作为键，频率作为值。\ndoc_len : list of int\n文档长度列表。\n\"\"\"\ndef __init__(self, corpus):\n\
  \"\"\"\n参数\n\ncorpus : list of list of str\n给定的语料库。\n\"\"\"\nself.corpus_size =\
  \ len(corpus)\nself.avgdl = sum(float(len(x)) for x in corpus) / self.corpus_size\n\
  self.corpus = corpus\nself.f = []\nself.df = {}\nself.idf = {}\nself.doc_len = []\n\
  self.initialize()\ndef initialize(self):\n\"\"\"计算文档和语料库中的术语频率。\n同时计算逆文档频率。\"\"\"\
  \nfor document in self.corpus:\nfrequencies = {}\nself.doc_len.append(len(document))\n\
  for word in document:\nif word not in frequencies:\nfrequencies[word] = 0\nfrequencies[word]\
  \ += 1\nself.f.append(frequencies)\nfor word, freq in iteritems(frequencies):\n\
  if word not in self.df:\nself.df[word] = 0\nself.df[word] += 1\nfor word, freq in\
  \ iteritems(self.df):\nself.idf[word] = math.log(self.corpus_size - freq + 0.5)\
  \ - math.log(freq + 0.5)\ndef get_score(self, document, index, average_idf):\n\"\
  \"\"计算给定`document`相对于由`index`选定的语料库文档的 BM25 分数。\n参数\n\ndocument : list of str\n\
  待评分的文档。\nindex : int\n语料库中与`document`进行评分比对的文档索引。\naverage_idf : float\n语料库中的平均\
  \ idf。\n返回\n\nfloat\nBM25 分数。\n\"\"\"\nscore = 0\nfor word in document:\nif word\
  \ not in self.f[index]:\ncontinue\nidf = self.idf[word] if self.idf[word] >= 0 else\
  \ EPSILON * average_idf\nscore += (idf * self.f[index][word] * (PARAM_K1 + 1)\n\
  / (self.f[index][word] + PARAM_K1 * (1 - PARAM_B + PARAM_B * self.doc_len[index]\
  \ / self.avgdl)))\nreturn score\ndef get_scores(self, document, average_idf):\n\"\
  \"\"计算并返回给定`document`相对于语料库中每个文档的 BM25 分数。\n参数\n\ndocument : list of str\n待评分的文档。\n\
  average_idf : float\n语料库中的平均 idf。\n返回\n\nlist of float\nBM25 分数列表。\n\"\"\"\nscores\
  \ = []\nfor index in xrange(self.corpus_size):\nscore = self.get_score(document,\
  \ index, average_idf)\nscores.append(score)\nreturn scores\n```\n\n\n\n我们现在已经在工作流程中实现了步骤\
  \ 6 的函数，用于计算文档间成对的 BM25 相似度得分，这正是我们所需要的！\n\n```python\ndef get_bm25_weights(corpus):\n\
  \    \"\"\"Returns BM25 scores (weights) of documents in corpus.\n    Each document\
  \ has to be weighted with every document in given corpus.\n    Parameters\n\n  \
  \  corpus : list of list of str\n        Corpus of documents.\n    Returns\n\n \
  \   list of list of float\n        BM25 scores.\n    Examples\n\n    >>> from gensim.summarization.bm25\
  \ import get_bm25_weights\n    >>> corpus = [\n    ...     [\"black\", \"cat\",\
  \ \"white\", \"cat\"],\n    ...     [\"cat\", \"outer\", \"space\"],\n    ...  \
  \   [\"wag\", \"dog\"]\n    ... ]\n    >>> result = get_bm25_weights(corpus)\n \
  \   \"\"\"\n    bm25 = BM25(corpus)\n    average_idf = sum(float(val) for val in\
  \ bm25.idf.values()) / len(bm25.idf)\n    weights = []\n    for doc in corpus:\n\
  \        scores = bm25.get_scores(doc, average_idf)\n        weights.append(scores)\n\
  \    return weights\n```\n\n根据文档说明，要使用此函数，首先需要分词语料库，如下所示：\n\n```python\nnorm_corpus_tokens\
  \ = np.array([nltk.word_tokenize(doc) for doc in norm_corpus])\nnorm_corpus_tokens[:3]\n"
