- '# 缺点：何时不应使用 Python？


  就像任何其他工具或语言一样，Python 有自身的优缺点，本节将重点介绍其中一些，以便你在用 Python 开发和编写代码时能有所了解。


  ### 执行速度性能


  “性能”是一个相当宽泛的术语，含义众多，因此我们在此聚焦于一个具体方面：执行速度。由于 Python 并非完全编译型语言，它的执行速度始终低于像 C 和 C++
  这样的底层全编译型语言。有几种方法可以优化你的代码，包括多线程和多进程处理，使用静态类型以及采用 Python 的 C 扩展，即所谓的 `Cython`。你也可以考虑使用
  `PyPy`，它通过即时（JIT）编译器，运行速度远超普通 Python。详见 [`http://pypy.org/`](http://pypy.org/)。通常情况下，如果你编写了优化良好的代码，完全可以仅用
  Python 开发出无需依赖其他语言的应用程序。请记住，问题往往不出在工具上，而在于你编写的代码本身——这是所有开发者和工程师随着时间的推移和经验的积累都会领悟到的一点。


  ### 全局解释器锁


  全局解释器锁（GIL）是一种互斥锁，用于 Python 和 Ruby 等多种编程语言的解释器。使用 GIL 的解释器即使运行在多核处理器上，也仅允许单个线程有效执行。这限制了通过多线程实现的并行性效率，具体取决于进程是
  I/O 密集型还是 CPU 密集型，以及它在解释器外部进行调用的次数。Python 3.x 还提供了诸如 `asyncio` 等模块，可用于异步 I/O 操作。


  ### 版本不兼容问题


  如果你一直密切关注 Python 的发展，就会知道一旦 Python 从 2.7.x 版本发布 3.x 版本，它在多个方面都存在向后不兼容的问题，从而引发了一连串的麻烦。许多主要的库和包都是在
  Python 2.7.x 中构建的，当用户在不知情的情况下更新 Python 版本时，它们就开始出现故障。代码弃用和版本变更通常是导致系统崩溃的最重要因素之一。不过，Python
  3.x 现在已经相当稳定，绝大多数用户在过去几年中已开始积极使用它。


  这些问题中有许多并非 Python 独有，其他语言也同样存在。因此，你不应仅仅因为上述几点就对使用 Python 望而却步。当然，在编写代码和构建系统时，你务必记住它们。


  '
- '# Python 实现与版本


  Python 有多种实现方式，并且由于 Python 正在积极开发中，不同版本会定期发布。本节我们将讨论这些实现和版本及其重要意义，这将让你了解存在哪些 Python
  环境，以及开发时可能需要使用哪些版本。目前，有四种主流、成熟且稳定的 Python 实现：


  ## CPython


  这就是我们通常所说的标准 Python。它既是编译器也是解释器，自带一套全部用标准 C 语言编写的标准包和模块。该版本可直接用于所有主流的现代平台。大多数 Python
  第三方包和库都与该版本兼容。


  ## PyPy


  一种速度更快的 Python 替代实现，它使用即时（JIT）编译器使代码运行速度超过 `CPython` 实现，有时可实现 10 到 100 倍的加速。它还更节省内存，支持
  greenlet 和 stackless 技术，以实现高度并行和并发。


  ## Jython


  一种针对 Java 平台的 Python 实现，支持任何版本（通常需高于 7 版）的 Java 虚拟机（JVM）。使用 `Jython`，你可以编写代码来利用所有类型的
  Java 库、包和框架。当你更熟悉 Java 语法以及 Java 中广泛使用的面向对象编程（OOP）原则（如类、对象和接口）时，它的效果最佳。


  ## IronPython


  一种针对微软 .NET 框架（也称为公共语言运行时 CLR）的 Python 实现。你可以在 `IronPython` 中使用所有微软的 CLR 库和框架，虽然你本质上不必用
  C# 编写代码，但了解更多的 C# 语法和构造有助于高效地使用 `IronPython`。


  作为入门，我建议你使用默认的 Python 即 `CPython` 实现，只有当你有兴趣与 C# 和 Java 等其他语言交互并需要在代码库中使用它们时，再尝试其他版本。


  Python 主要有两个大版本系列——2.x 系列和 3.x 系列，其中 `x` 代表数字。Python 2.7 是 2.x 系列于 2010 年发布的最后一个主要版本，此后发布的版本只包含错误修复和性能改进，不再增加新功能。一个需要牢记的要点是，Python
  2.x 的支持将于 2020 年结束。3.x 系列从 Python 3.0 开始，与 Python 2.x 相比引入许多不向后兼容的更改，并且每个 3.x 版本不仅包含错误修复和改进，还会引入新功能，例如
  `AsyncIO` 模块。在撰写本文时，Python 3.7 是 3.x 系列的最新版本，于 2018 年 6 月发布。关于应该使用哪个 Python 版本，一直存在诸多争议。考虑到
  Python 2 的支持将于 2020 年结束，且没有计划为其增加新功能或改进，我们建议你为所有项目、研究及开发工作使用 Python 3。



  好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项，将以下英文文本翻译成中文。



  '
- "# 搭建一个稳健的 Python 环境\n\n现在你已经了解了 Python，并对这门语言的功能、实现方式和版本有了更多认识，本节将介绍一些关于如何搭建开发环境以及处理包管理和虚拟环境的基本要点。本节将为后续学习本书中的各种动手实践示例做好充分准备。\n\
  \n## 选择哪个 Python 版本？\n\n我们之前讨论过两个主要的 Python 版本：2.x 系列和 3.x 系列。这两个版本非常相似；然而，3.x 版本中存在一些不向后兼容的更改，这导致\
  \ 2.x 和 3.x 的使用者之间产生了巨大的分歧。大多数遗留代码以及 PyPI 上的绝大部分 Python 包都是用 Python 2.7.x 开发的，包所有者没有时间或意愿将其所有代码库移植到\
  \ Python 3.x。3.x 中的一些更改如下：\n\n-   所有文本字符串默认均为 Unicode\n-   `print` 和 `exec` 现在都是函数，不再是语句\n\
  -   一些方法（如 `range()`）返回内存高效的迭代器，而不是列表\n-   类的风格发生了变化\n-   库和名称因约定俗成和风格违规而改变\n- \
  \  更多特性、模块和增强功能\n\n要了解更多关于 Python 3.x 引入的变化，请查看 [`https://docs.python.org/3/whatsnew/3.7.html`](https://docs.python.org/3/whatsnew/3.7.html)，这是列出这些更改的官方文档。这应该能让你清楚地了解，如果你将代码从\
  \ Python 2 移植到 Python 3，哪些更改可能导致代码出现问题。\n\n现在回到选择版本的问题上，我们强烈建议始终使用 Python 3。其主要原因是\
  \ Python 核心团队最近发布的一则公告，其中提到对 Python 2 的支持将于 2020 年结束，并且不会向 Python 2 推送任何新特性或增强功能。我们建议查看\
  \ PEP 373 [`https://legacy.python.org/dev/peps/pep-0373/`](https://legacy.python.org/dev/peps/pep-0373/)，该文档对此问题有更详细的说明。但是，如果你正在处理一个大型的基于\
  \ Python 2.x 的遗留代码库，你可能需要坚持使用它，直到将其移植到 Python 3 成为可能。本书中使用的是 Python 3.x，并建议你也这样做。对于\
  \ Python 2.x 的代码，你可以根据需要参考本书的先前版本。\n\n## 选择哪个操作系统？\n\n市面上有几种流行的操作系统，每个人都有自己的偏好。Python\
  \ 的美妙之处在于它可以毫无障碍地在任何操作系统上无缝运行。Python 支持的一些不同操作系统包括：\n\n-   Windows\n-   Linux\n\
  -   macOS（也称为 OS X）\n\n你可以选择任何你喜欢的操作系统并跟着示例操作。我们使用 Linux 和 Windows 的组合作为我们的操作系统平台。Python\
  \ 的外部包通常易于在基于 UNIX 的操作系统（如 Linux 和 macOS）上安装。然而，有时在 Windows 上安装它们会遇到主要问题，因此我们会强调此类情况并加以处理，以便我们的\
  \ Windows 读者也能轻松执行任何代码片段和示例。在随本书学习示例时，我们非常欢迎你使用任何你喜欢的操作系统！\n\n## 集成开发环境\n\n集成开发环境是一种软件产品，通过提供编写、管理和执行代码所必需的整套工具和功能，使开发人员能够高效工作。IDE\
  \ 的常见组件包括源代码编辑器、调试器、编译器、解释器以及重构和构建工具。它们还具有其他功能，如代码补全、语法高亮、错误高亮和检查、对象和变量浏览器。IDE 可用于管理整个代码库，远优于在简单的文本编辑器中编写代码，后者耗时更长。然而，经验更丰富的开发人员经常使用简单的纯文本编辑器来编写代码，尤其是在服务器环境中工作时。链接\
  \ [`https://wiki.python.org/moin/IntegratedDevelopmentEnvironments`](https://wiki.python.org/moin/IntegratedDevelopmentEnvironments)\
  \ 提供了一个专门用于 Python 的 IDE 列表。我们使用 PyCharm、Spyder、Sublime Text 和 Jupyter notebook\
  \ 的组合。本书中的代码示例大多在 Jupyter notebook 上演示，而 Jupyter notebook 是随 Anaconda Python 发行版一起安装的，用于编写和执行代码。\n\
  \n\n\n## 环境搭建\n\n在本节中，我们将详细说明如何以最小的精力搭建你的 Python 环境以及所需的主要组件。你可以前往 Python 官方网站，从\
  \ [`https://www.python.org/downloads/`](https://www.python.org/downloads/) 下载 Python\
  \ 3.7，或者从 Anaconda（原名 Continuum Analytics）下载一个完整的 Python 发行版，该发行版包含数百个专为数据科学和人工智能构建的包，即\
  \ Anaconda Python 发行版。这能带来诸多优势，尤其对 Windows 用户而言，因为安装 `NumPy` 和 `SciPy` 等包有时会引发重大问题。你可以访问\
  \ [`https://www.anaconda.com`](https://www.anaconda.com) 获取更多关于 Anaconda 及其出色工作的信息。Anaconda\
  \ 附带 `conda`（一个开源的包和环境管理系统）以及 Spyder（科学 Python 开发环境），后者是一个用于编写和执行代码的集成开发环境。\n\n\
  要开始环境搭建，你可以按照 [`https://docs.anaconda.com/anaconda/install/windows`](https://docs.anaconda.com/anaconda/install/windows)\
  \ 上针对 Windows 的说明进行操作，或者使用你选择的其他操作系统的说明。前往 [`https://www.anaconda.com/download/`](https://www.anaconda.com/download/)\
  \ 并根据你的操作系统版本下载适用于 Windows 的 64 位或 32 位 Python 3 安装程序。对于其他操作系统，你可以在网站上查看相关说明。启动可执行文件，并通过在每个阶段单击“下一步”按钮来按照屏幕上的说明进行操作。务必设置好合适的安装位置，如图\
  \ 2-1 所示。\n\n![../images/427287_2_En_2_Chapter/427287_2_En_2_Fig1_HTML.jpg](img/427287_2_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1：安装 Anaconda Python 发行版——设置安装位置\n\n在开始实际安装之前，务必勾选图 2-2 中显示的两个选项。\n\n![../images/427287_2_En_2_Chapter/427287_2_En_2_Fig2_HTML.jpg](img/427287_2_En_2_Fig2_HTML.jpg)\n\
