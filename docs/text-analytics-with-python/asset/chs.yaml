  blue、beautiful 和 sky 各出现一次，因此在上述输出的第一行中，相应的特征值都为 1。因此，如果一个文档语料库在所有文档中共包含 N 个不重复的词语，那么每个文档都会得到一个
  N 维的向量。


  ### 词袋 N 元模型


  一个词语通常是一个单独的标记，常被称为*一元组*或*1-gram*。我们已经知道词袋模型不考虑词语顺序。但如果我们还想考虑按顺序出现的短语或词语集合呢？N 元组（N-grams）就能帮助我们做到这一点。N
  元组本质上是从文本文档中提取的一组连续的词语标记，这些标记之间是连续的并按顺序出现。二元组指的是阶数为 2 的 N 元组（两个词），三元组指的是阶数为 3 的
  N 元组（三个词），以此类推。词袋 N 元模型只是词袋模型的一个扩展，它利用了基于 N 元组的特征。下面的示例展示了每个文档特征向量中基于二元组的特征。请参见图
  4-3。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig3_HTML.jpg](img/427287_2_En_4_Fig3_HTML.jpg)


  图 4-3


  使用词袋 N 元模型生成的基于二元组的特征向量


  ```

  # 你可以将 n-gram 范围设置为(1,2)，以同时获取一元组和二元组

  bv = CountVectorizer(ngram_range=(2,2))

  bv_matrix = bv.fit_transform(norm_corpus)

  bv_matrix = bv_matrix.toarray()

  vocab = bv.get_feature_names()

  pd.DataFrame(bv_matrix, columns=vocab)

  ```


  这为我们的文档生成了特征向量，其中每个特征都包含一个二元组，代表两个词的序列，其值表示该二元组在文档中出现的次数。我们鼓励你尝试调整 `ngram_range`
  参数。试着将 `ngram_range` 设置为 `(1, 3)` 并观察输出结果！




  ### TF-IDF 模型


  当词袋模型应用于大型语料库时，可能会出现一些潜在问题。由于特征向量基于绝对词频，可能会出现某些词在所有文档中频繁出现，从而在特征集合中掩盖其他词的情况。尤其是那些不常出现，但作为识别特定类别的特征可能更有趣且更有效的词。这时，TF-IDF
  就应运而生了。TF-IDF 代表*词频-逆文档频率*。它是两个指标的组合：词频 (`tf`) 和逆文档频率 (`idf`)。该技术最初是作为一种根据用户查询对搜索引擎结果进行排序的指标而开发的，现已成为信息检索和文本特征提取的一部分。


  现在让我们正式定义 TF-IDF，并在深入其实现之前，先看看其数学表示。数学上，TF-IDF 是两个指标的乘积，可以表示如下：


  ![$$ tfidf= tf\times idf $$](img/427287_2_En_4_Chapter_TeX_Equa.png)


  其中，词频 (`tf`) 和逆文档频率 (`idf`) 代表了我们刚刚讨论的两个指标。*词频*，由 `tf` 表示，就是我们上一节在词袋模型中计算的内容。任何文档向量中的词频都由该词在特定文档中的原始频率值表示。数学上可以表示如下：


  ![$$ tf\left(w,D\right)={f}_{w_D} $$](img/427287_2_En_4_Chapter_TeX_Equb.png)


  其中 ![$$ {f}_{w_D} $$](img/427287_2_En_4_Chapter_TeX_IEq1.png) 表示词 `w` 在文档 `D` 中的频率，这即为词频
  (`tf`)。有时你也可以使用对数或平均频率来对绝对原始频率进行归一化。在我们的计算中，我们使用原始频率。


  *逆文档频率*，由 `idf` 表示，是每个词文档频率的倒数，其计算方式是将语料库中的文档总数除以每个词的文档频率，然后对结果进行对数缩放。在我们的实现中，我们会为每个词的文档频率加
  1，以表示我们的语料库中还多了一个文档，该文档实质上包含了词汇表中的每一个词。这是为了防止潜在的除以零错误，并平滑逆文档频率。我们还会在 `idf` 计算结果上加
  1，以避免忽略那些可能 `idf` 为零的词。数学上，我们对 `idf` 的实现可以表示如下：


  ![$$ idf\left(w,D\right)=1+\log \frac{N}{1+ df(w)} $$](img/427287_2_En_4_Chapter_TeX_Equc.png)


  其中，`idf`(`w`, `D`) 表示词 `w` 在文档 `D` 中的 `idf`，`N` 表示语料库中的文档总数，`df`(`t`) 表示包含词 `w`
  的文档数量。


  因此，词频-逆文档频率可以通过将这两个度量相乘来计算。我们将使用的最终 TF-IDF 指标，是 `tf` 和 `idf` 乘积得到的 `tfidf` 矩阵的归一化版本。我们将
  `tfidf` 矩阵除以其 L2 范数（也称为欧几里得范数，即每个词 `tfidf` 权重的平方和再开平方根）来进行归一化。数学上，我们可以将最终的 `tfidf`
  特征向量表示如下：


  ![$$ tfidf=\frac{tfidf}{\parallel tfidf\parallel } $$](img/427287_2_En_4_Chapter_TeX_Equd.png)


  其中，`∥tfidf∥` 表示 `tfidf` 矩阵的欧几里得 L2 范数。这个模型有多种变体，但它们最终都能得到相似的结果。现在让我们将其应用到我们的语料库中！


  ### 使用 `TfidfTransformer`


  假设我们已经从前述章节中获得了基于词袋模型的特征向量，以下代码展示了获取基于 `tfidf` 的特征向量的实现。见图 4-4。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig4_HTML.jpg](img/427287_2_En_4_Fig4_HTML.jpg)


  图 4-4：使用 `TfidfTransformer` 基于我们的 TF-IDF 模型生成的文档特征向量


  ```python

  from sklearn.feature_extraction.text import TfidfTransformer

  tt = TfidfTransformer(norm=''l2'', use_idf=True)

  tt_matrix = tt.fit_transform(cv_matrix)

  tt_matrix = tt_matrix.toarray()

  vocab = cv.get_feature_names()

  pd.DataFrame(np.round(tt_matrix, 2), columns=vocab)

  ```


  您可以看到，我们在参数中使用了 L2 范数选项，并确保平滑了 IDF，以便为可能具有零 IDF 的词赋予权重，从而避免忽略它们。


  ### 使用 `TfidfVectorizer`


  在工程化 TF-IDF 特征之前，并不总是需要使用词袋或基于计数的模型来预先生成特征。Scikit-Learn 的 `TfidfVectorizer` 使我们能够直接以原始文档作为输入，在内部计算词频和逆文档频率，从而直接计算出
  `tfidf` 向量。这消除了使用 `CountVectorizer` 基于词袋模型计算词频的需要。此外，它还支持向特征向量中添加 n-gram。我们可以在以下代码片段中看到该函数的使用。见图
  4-5。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig5_HTML.jpg](img/427287_2_En_4_Fig5_HTML.jpg)


  图 4-5：使用 `TfidfVectorizer` 基于我们的 TF-IDF 模型生成的文档特征向量


  ```python

  from sklearn.feature_extraction.text import TfidfVectorizer

  tv = TfidfVectorizer(min_df=0., max_df=1., norm="l2",

  use_idf=True, smooth_idf=True)

  tv_matrix = tv.fit_transform(norm_corpus)

  tv_matrix = tv_matrix.toarray()

  vocab = tv.get_feature_names()

  pd.DataFrame(np.round(tv_matrix, 2), columns=vocab)

  ```


  您可以看到，和之前一样，我们在参数中使用了 L2 范数选项，并确保平滑了 `idfs`。从输出中可以看出，`tfidf` 特征向量与我们之前获得的相匹配。




  #### 理解 TF-IDF 模型


  本节专为机器学习专家以及那些对幕后工作原理充满好奇的读者们而设！我们首先加载必要的依赖项，并为我们的示例语料库计算词频（`TF`）。见图 4-6。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig6_HTML.jpg](img/427287_2_En_4_Fig6_HTML.jpg)


  图 4-6


  从零开始为我们的语料库构建基于计数的词袋特征


  ```

  # 获取独特词汇作为特征名称

  unique_words = list(set([word for doc in [doc.split() for doc in norm_corpus]

  for word in doc]))

  def_feature_dict = {w: 0 for w in unique_words}

  print(''特征名称:'', unique_words)

  print(''默认特征字典:'', def_feature_dict)

  特征名称: [''lazy'', ''fox'', ''love'', ''jumps'', ''sausages'', ''blue'', ''ham'',
  ''beautiful'', ''brown'', ''kings'', ''eggs'', ''quick'', ''bacon'', ''breakfast'',
  ''toast'', ''beans'', ''green'', ''today'', ''dog'', ''sky'']

  默认特征字典: {''lazy'': 0, ''fox'': 0, ''kings'': 0, ''love'': 0, ''jumps'': 0, ''sausages'':
  0, ''breakfast'': 0, ''today'': 0, ''brown'': 0, ''ham'': 0, ''beautiful'': 0, ''green'':
  0, ''eggs'': 0, ''blue'': 0, ''bacon'': 0, ''toast'': 0, ''beans'': 0, ''dog'':
  0, ''sky'': 0, ''quick'': 0}

  from collections import Counter

  # 为每个文档构建词袋特征 - 词频

  bow_features = []

  for doc in norm_corpus:

  bow_feature_doc = Counter(doc.split())

  all_features = Counter(def_feature_dict)

  bow_feature_doc.update(all_features)

  bow_features.append(bow_feature_doc)

  bow_features = pd.DataFrame(bow_features)

  bow_features

  ```


  现在，我们根据每个词项出现的文档数量来计算其文档频率（`DF`）。以下代码片段展示了如何从我们的词袋特征中获取该信息。见图 4-7。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig7_HTML.jpg](img/427287_2_En_4_Fig7_HTML.jpg)


  图 4-7


  我们语料库中每个特征的文档频率


  ```

  import scipy.sparse as sp

  feature_names = list(bow_features.columns)

  # 构建文档频率矩阵

  df = np.diff(sp.csc_matrix(bow_features, copy=True).indptr)

  df = 1 + df # 为后续平滑化 idf 加 1

  # 显示平滑后的文档频率

  pd.DataFrame([df], columns=feature_names)

  ```


  这告诉我们每个词项的文档频率（`DF`），你可以通过我们示例语料库中的文档进行验证。请记住，我们为每个频率值都加了 1，以便后续平滑 IDF 值，并假设存在一个包含所有词项一次的文档（虚构的），从而防止除以零错误。因此，如果你在语料库中检查，会发现“bacon”出现了
  2(+1) 次，“sky”出现了 3(+1) 次，依此类推（考虑到 (+1) 用于平滑处理）。


  现在我们有了文档频率，接下来使用之前定义的公式来计算逆文档频率（IDF）。请注意，为了平滑 IDF，我们需要在语料库的总文档数上加 1，这对应了我们之前假设的那个包含所有词项至少一次的文档。见图
  4-8。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig8_HTML.jpg](img/427287_2_En_4_Fig8_HTML.jpg)


  图 4-8


  我们语料库中每个特征的逆文档频率


  ```

  # 计算逆文档频率

  total_docs = 1 + len(norm_corpus)

  idf = 1.0 + np.log(float(total_docs) / df)

  # 显示平滑后的 idf

  pd.DataFrame([np.round(idf, 2)], columns=feature_names)

  ```


  因此，我们可以看到图 4-8 描绘了我们语料库中每个特征的（平滑后）逆文档频率。现在我们将其转换为一个矩阵，以便于后续计算整体 TF-IDF 分数。见图 4-9。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig9_HTML.jpg](img/427287_2_En_4_Fig9_HTML.jpg)


  图 4-9


  为我们语料库中的每个特征构建一个 n 维逆文档频率对角矩阵


  ```

  # 计算 idf 对角矩阵

  total_features = bow_features.shape[1]

  idf_diag = sp.spdiags(idf, diags=0, m=total_features, n=total_features)

  idf_dense = idf_diag.todense()

  # 打印 idf 对角矩阵

  pd.DataFrame(np.round(idf_dense, 2))

  ```


  你现在可以看到我们基于数学公式创建的 `idf` 矩阵。我们还将其转换为一个对角矩阵，这在后续需要与词频计算乘积时会很有帮助。现在，我们有了 TF 和 IDF，便可以使用矩阵乘法来计算原始
  TF-IDF 特征矩阵，如下所示。见图 4-10。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig10_HTML.jpg](img/427287_2_En_4_Fig10_HTML.jpg)


  图 4-10


  从 TF 和 IDF 分量构建原始 TF-IDF 矩阵


  ```

  # 计算 tfidf 特征矩阵

  tf = np.array(bow_features, dtype="float64")

  tfidf = tf * idf

  # 查看原始 tfidf 特征矩阵

  pd.DataFrame(np.round(tfidf, 2), columns=feature_names)

  ```


  现在我们就得到了 `tfidf` 特征矩阵，但是等等！如果你还记得我们之前展示的公式，我们还需要将其除以 L2 范数。以下代码片段计算了每个文档的 `tfidf`
  范数，然后将 `tfidf` 权重除以该范数，以得到最终所需的 `tfidf` 矩阵。见图 4-11。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig11_HTML.jpg](img/427287_2_En_4_Fig11_HTML.jpg)


  图 4-11


  构建最终归一化的 TF-IDF 矩阵


  ```

  from numpy.linalg import norm

  # 计算 L2 范数

  norms = norm(tfidf, axis=1)

  # 打印每个文档的范数

  print (np.round(norms, 3))

  [ 3.013  3.672  4.761  6.534  5.319  4.35   5.019  4.049]

  # 计算归一化的 tfidf

  norm_tfidf = tfidf / norms[:, None]

  # 显示最终的 tfidf 特征矩阵

  pd.DataFrame(np.round(norm_tfidf, 2), columns=feature_names)

  ```


  如果你将图 4-11 中为语料库文档得到的 `tfidf` 特征矩阵与之前使用 `TfidfTransformer` 或 `TfidfVectorizer` 得到的特征矩阵进行比较，会发现它们完全一致，从而验证了我们的数学实现是正确的。实际上，Scikit-Learn
  在后台正是采用了相同的实现，并进行了更多优化。


  ### 为新文档提取特征


  假设你构建了一个用于分类和归类新闻文章的机器学习模型，并且该模型目前正在生产环境中运行。你如何为完全新的文档生成特征，以便将其输入到机器学习模型中进行预测？Scikit-Learn
  API 为我们之前讨论过的向量化器提供了 `transform(...)` 函数，我们可以利用它为那些不在我们语料库中的全新文档（即训练模型时未包含的文档）获取特征。见图
  4-12。


  ![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig12_HTML.jpg](img/427287_2_En_4_Fig12_HTML.jpg)


  图 4-12


  为一个全新的文档生成 TF-IDF 特征向量


  ```

  new_doc = ''the sky is green today''

  pd.DataFrame(np.round(tv.transform([new_doc]).toarray(), 2),

  columns=tv.get_feature_names())

  ```


  因此，始终利用 `fit_transform(...)` 函数来为语料库中的所有文档构建特征矩阵。这通常会成为训练特征集，你将在此基础上构建和训练预测模型或其他机器学习模型。一旦准备就绪，就利用
  `transform(...)` 函数来生成新文档的特征向量。然后，这些特征向量可以被输入到你训练好的模型中，以按需生成洞察。




  '
- "# 文档相似度\n\n`文档相似度`是一个过程，它利用基于距离或相似度的度量方法，根据从文档中提取的特征（如词袋或 TF-IDF）来识别一个文本文档与任何其他文档的相似程度。因此，你可以看到我们可以基于上一节中设计的\
  \ TF-IDF 特征进行构建，并使用它们来生成新特征。像搜索引擎、文档聚类和信息检索等领域都可以利用这些基于相似度的特征。\n\n语料库中的两两文档相似度涉及计算语料库中每一对文档的文档相似度。因此，如果你的语料库中有\
  \ `C` 个文档，你最终会得到一个 `C` x `C` 的矩阵，其中每一行和每一列代表一对文档的相似度得分。这分别表示行和列的索引。有多种相似度和距离度量方法可用于计算文档相似度。这些包括余弦距离/相似度、欧几里得距离、曼哈顿距离、BM25\
  \ 相似度、杰卡德距离等。在我们的分析中，我们使用最流行和广泛使用的相似度度量之一——余弦相似度，并基于其 TF-IDF 特征向量比较两两文档相似度。请参见图\
  \ 4-13。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig13_HTML.jpg](img/427287_2_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n两两文档相似度矩阵（余弦相似度）\n\n```python\nfrom sklearn.metrics.pairwise import\
  \ cosine_similarity\nsimilarity_matrix = cosine_similarity(tv_matrix)\nsimilarity_df\
  \ = pd.DataFrame(similarity_matrix)\nsimilarity_df\n```\n\n余弦相似度为我们提供了一个度量，表示两个文本文档特征向量表示之间夹角的余弦值。文档之间的夹角越小，它们就越接近、越相似，如图\
  \ 4-13 中的得分以及图 4-14 中的一些示例文档向量所示。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig14_HTML.jpg](img/427287_2_En_4_Fig14_HTML.jpg)\n\
  \n图 4-14\n\n文本文档特征向量的余弦相似度示意图\n\n仔细观察图 4-13 中的相似度矩阵，你可以清楚地看到文档 0、1、6 与文档 2、5、7 彼此非常相似，而文档\
  \ 3 和 4 彼此略微相似。这必然表明这些相似的文档具有一些相似的特征。这是一个通过无监督学习解决分组或聚类问题的完美示例，尤其是在处理包含数百万文本文档的庞大语料库时。\n\
  \n## 基于相似度特征的文档聚类\n\n我们已经构建了许多特征，现在让我们将其中的一些用于一个现实世界的问题：对相似文档进行分组！聚类利用无监督学习将数据点（在此场景中为文档）分组或聚类。我们在此利用一种无监督的层次聚类算法，通过利用我们之前生成的文档相似度特征，尝试对我们的小型语料库中的相似文档进行分组。\n\
  \n层次聚类算法有两种类型——凝聚型和分裂型。我们使用凝聚型聚类算法，这是一种采用自下而上方法的层次聚类，即每个观测值或文档从自己的聚类开始，然后使用度量数据点之间距离的度量标准和链接合并准则依次合并聚类。图\
  \ 4-15 展示了一个示例示意图。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig15_HTML.jpg](img/427287_2_En_4_Fig15_HTML.jpg)\n\
  \n图 4-15\n\n凝聚型层次聚类\n\n链接准则的选择决定了合并策略。一些链接准则的例子包括 Ward 法、完全链接、平均链接等。此准则对于在每一步选择要合并的聚类对（在最低层是单个文档，在更高层是聚类）非常有用，这基于目标函数的最优值。我们选择\
  \ Ward 最小方差法作为我们的链接准则，以最小化总的聚类内方差。因此，在每一步，我们找到合并后导致总的聚类内方差增量最小的聚类对。由于我们已经有了相似度特征，让我们在我们的示例文档上构建链接矩阵。请参见图\
  \ 4-16。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig16_HTML.jpg](img/427287_2_En_4_Fig16_HTML.jpg)\n\
  \n图 4-16\n\n我们语料库的链接矩阵\n\n```python\nfrom scipy.cluster.hierarchy import dendrogram,\
  \ linkage\nZ = linkage(similarity_matrix, 'ward')\npd.DataFrame(Z, columns=['文档\\\
  聚类 1', '文档\\聚类 2',\n'距离', '聚类大小'], dtype=\"object\")\n```\n\n如果仔细查看图 4-16 中的链接矩阵，你可以看到链接矩阵的每一步（行）告诉我们哪些数据点（或聚类）被合并了。如果你有\
  \ `n` 个数据点，链接矩阵 `Z` 的形状将是 `(n − 1) × 4`，其中 `Z[i]` 会告诉我们在第 `i` 步合并了哪些聚类。每行有四个元素；前两个元素是数据点标识符或聚类标签（在矩阵的后面部分，一旦多个数据点被合并），第三个元素是前两个元素（数据点或聚类）之间的聚类距离，最后一个元素是合并完成后聚类中元素/数据点的总数。我们建议你参考\
  \ SciPy 文档，其中有详细解释。现在让我们将此矩阵可视化为树状图，以便更好地理解这些元素！请参见图 4-17。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig17_HTML.jpg](img/427287_2_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17\n\n可视化层次聚类过程的树状图\n\n```python\nplt.figure(figsize=(8, 3))\nplt.title('层次聚类树状图')\n\
  plt.xlabel('数据点')\nplt.ylabel('距离')\ndendrogram(Z)\nplt.axhline(y=1.0, c=\"k\",\
  \ ls=\"--\", lw=0.5)\n```\n\n我们可以看到每个数据点如何从一个单独的聚类开始，并逐渐与其他数据点合并形成聚类。从颜色和树状图的高级角度来看，如果你考虑距离度量大约为\
  \ 1.0 或以上（由虚线表示），你可以看到模型已正确识别出三个主要的聚类。利用这个距离，我们得到了聚类标签。请参见图 4-18。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig18_HTML.jpg](img/427287_2_En_4_Fig18_HTML.jpg)\n\
  \n图 4-18\n\n通过层次聚类将我们的文档分组到聚类中\n\n```python\nfrom scipy.cluster.hierarchy import\
  \ fcluster\nmax_dist = 1.0\ncluster_labels = fcluster(Z, max_dist, criterion=\"\
  distance\")\ncluster_labels = pd.DataFrame(cluster_labels, columns=['聚类标签'])\npd.concat([corpus_df,\
  \ cluster_labels], axis=1)\n```\n\n因此，你可以清楚地看到，基于分配给文档的聚类标签，我们的算法已正确识别出文档中的三个不同类别。这应该让你很好地了解我们的\
  \ TF-IDF 特征如何被用于构建相似度特征，而这些特征反过来又帮助我们对文档进行聚类。将来你可以使用这个流程来对你的文档进行聚类。我们将在本书后面的章节中，使用更多模型和示例进一步详细讨论文本聚类。\n\
  \n\n\n### 主题模型\n\n尽管我们会在本书的独立章节中详细讨论主题建模，但若未谈及主题模型，关于特征工程的讨论便不算完整。我们可以利用一些摘要技术，从文本文档中提取基于主题或概念的特征。主题模型的核心思想在于从文档语料库中提取关键主题或概念，这些主题或概念以“主题”的形式呈现。每个主题可以表示为文档语料库中词语/术语的集合。这些术语共同指代特定的主题、议题或概念，并且每个主题都能通过这些术语所传达的语义含义与其他主题轻松区分开来。\n\
  \n然而，根据数据的不同，你常常会得到一些相互重叠的主题。这些概念涵盖范围很广，从简单的事实陈述到观点和看法。主题模型在总结大型文本文档语料库以提取和描述关键概念方面极为有用。它们同样有助于从文本数据中提取能捕捉数据中潜在模式的特征。参见图\
  \ 4-19。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig19_HTML.jpg](img/427287_2_En_4_Fig19_HTML.jpg)\n\
  \n图 4-19：使用层次聚类将文档分组\n\n主题建模有多种技术，其中大部分涉及某种形式的矩阵分解。一些技术，如潜在语义索引（LSI），会使用矩阵分解操作，更具体地说是奇异值分解。我们采用另一种称为潜在狄利克雷分配（LDA）的技术，它使用生成式概率模型，其中每个文档由若干主题的组合构成，并且每个术语或单词可以归属于特定主题。这类似于基于\
  \ pLSI 的模型（概率潜在语义索引）。在 LDA 中，每个潜在主题上都有一个狄利克雷先验分布。该技术背后的数学原理相当复杂，所以我在此尽量简化说明。我们还会在后续章节中详细讨论主题建模！参见图\
  \ 4-20。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig20_HTML.jpg](img/427287_2_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20：端到端 LDA 框架（图片由 C. Doig 提供，源自《Python 主题建模入门》）\n\n图 4-20 中的黑盒代表了核心算法，该算法使用前述参数从\
  \ `M` 个文档中提取 `K` 个主题。图 4-22 中概述的步骤对幕后的工作原理进行了简单解释。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig21_HTML.jpg](img/427287_2_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21：LDA 主题建模算法的主要步骤\n\n经过多次迭代后，我们应该能得到每个文档的主题混合分布，然后根据指向每个主题的术语生成该主题的组成部分。像\
  \ `Gensim` 或 `Scikit-Learn` 这样的框架使我们能够利用 LDA 模型生成主题。就本章旨在探讨的特征工程而言，你需要记住：当 LDA 应用于文档-术语矩阵（TF-IDF\
  \ 或词袋特征矩阵）时，它会被分解成两个主要部分。\n\n*   一个**文档-主题矩阵**，即我们需要的特征矩阵。\n*   一个**主题-术语矩阵**，有助于我们查看语料库中的潜在主题。\n\
  \n现在，我们利用 `Scikit-Learn` 来获取文档-主题矩阵，操作如下。该矩阵可用作任何后续建模需求的特征。参见图 4-22。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig22_HTML.jpg](img/427287_2_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22：从 LDA 模型生成的文档-主题特征矩阵\n\n```\nfrom sklearn.decomposition import LatentDirichletAllocation\n\
  lda = LatentDirichletAllocation(n_topics=3, max_iter=10000, random_state=0)\ndt_matrix\
  \ = lda.fit_transform(cv_matrix)\nfeatures = pd.DataFrame(dt_matrix, columns=['T1',\
  \ 'T2', 'T3'])\nfeatures\n```\n\n在此输出中，你可以清晰地看到每个文档对这三个主题各自的贡献程度。你可以通过以下方式查看主题及其主要组成部分。\n\
  \n```\ntt_matrix = lda.components_\nfor topic_weights in tt_matrix:\n    topic =\
  \ [(token, weight) for token, weight in zip(vocab, topic_weights)]\n    topic =\
  \ sorted(topic, key=lambda x: -x[1])\n    topic = [item for item in topic if item[1]\
  \ > 0.6]\n    print(topic)\n    print()\n[('sky', 4.3324395825632624), ('blue',\
  \ 3.373753174831771), ('beautiful', 3.3323652405224857), ('today', 1.3325579841038182),\
  \ ('love', 1.3304224288080069)]\n[('bacon', 2.332695948479998), ('eggs', 2.332695948479998),\
  \ ('ham', 2.332695948479998), ('sausages', 2.332695948479998), ('love', 1.335454457601996),\
  \ ('beans', 1.332773525378464), ('breakfast', 1.332773525378464), ('kings', 1.332773525378464),\
  \ ('toast', 1.332773525378464), ('green', 1.3325433207547732)]\n[('brown', 3.3323474595768783),\
  \ ('dog', 3.3323474595768783), ('fox', 3.3323474595768783), ('lazy', 3.3323474595768783),\
  \ ('quick', 3.3323474595768783), ('jumps', 1.3324193736202712), ('blue', 1.2919635624485213)]\n\
  ```\n\n因此，根据其组成术语，你可以清楚地看到这三个主题彼此之间具有很高的区分度。第一个主题谈论天气，第二个关于食物，最后一个则关于动物。为主题建模选择主题数量本身是一门完整的技术，既是一门艺术，也是一门科学。有多种方法和启发式策略可以获取最佳的主题数量，但由于这些技术细节繁多，我们在此不做讨论。\n\
  \n\n\n### 高级特征工程模型\n\n传统的（基于计数的）文本数据特征工程策略涉及一系列模型，通常被称为词袋模型。这包括词频、`TF-IDF`（词频-逆文档频率）、`N-Grams`（N\
  \ 元组）等。虽然它们是有效的文本特征提取方法，但由于模型本质上只是非结构化单词的袋子，我们会丢失每个文本文档中诸如语义、结构、顺序以及周围单词的上下文等额外信息。这足以激励我们去探索更复杂的模型，这些模型能够捕捉这些信息，并为我们提供作为单词向量表示的特征，通常被称为*嵌入*。\n\
  \n虽然这听起来有些道理，但我们为什么要有足够的动力去学习和构建这些词嵌入呢？对于语音或图像识别系统而言，所有信息已经以丰富密集的特征向量形式存在，这些向量嵌入在高维数据集中，比如音频频谱图和图像像素强度。然而，对于原始文本数据，尤其是像词袋这样的基于计数的模型，我们处理的是可能具有自己标识符的单个单词，并且无法捕捉单词之间的语义关系。这会导致文本数据产生巨大的稀疏词向量，因此，如果没有足够的数据，我们可能会得到糟糕的模型，甚至由于维数灾难而导致过拟合。见图\
  \ 4-23。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig23_HTML.jpg](img/427287_2_En_4_Fig23_HTML.jpg)\n\
  \n图 4-23\n\n音频、图像和文本的特征表示对比\n\n为了克服词袋模型的缺点，我们需要使用*向量空间模型（VSM）*，以便能够基于语义和上下文相似性将词向量嵌入到这个连续向量空间中。事实上，*分布式语义学*领域的*分布假说*告诉我们，出现在并用于相同上下文中的单词在语义上彼此相似，并且具有相似的含义。简单来说，“一个词由它所处的环境所表征”。\n\
  \n一篇详细讨论这些语义词向量及各种类型的著名论文是 Baroni 等人的《不要计数，要预测！上下文计数与上下文预测语义向量的系统比较》。我们不会深入探讨，但简而言之，有两种主要的上下文词向量方法。*基于计数的方法*，如*潜在语义分析（LSA）*，可用于计算语料库中单词与其相邻单词共现频率的统计度量，然后根据这些度量为每个单词构建密集词向量。*预测方法*，如*基于神经网络的语言模型*，则通过观察语料库中的单词序列，试图从其相邻单词中预测单词。在此过程中，它学习了分布式表示，从而为我们提供了密集的词嵌入。我们在本节中重点介绍这些预测方法。\n\
  \n### 加载圣经语料库\n\n为了训练并展示这些基于深度学习的先进特征表示模型的部分能力，我们通常需要一个更大的语料库。虽然我们仍将使用之前的语料库进行演示，但我们也将使用\
  \ `NLTK` 加载另一个基于詹姆斯国王版本的圣经语料库。然后我们对文本进行预处理，以便根据我们稍后实现的模型，展示可能更相关的示例。\n\n```\nfrom\
  \ nltk.corpus import gutenberg\nfrom string import punctuation\nbible = gutenberg.sents('bible-kjv.txt')\n\
  remove_terms = punctuation + '0123456789'\nnorm_bible = [[word.lower() for word\
  \ in sent if word not in remove_terms] for sent in bible]\nnorm_bible = [' '.join(tok_sent)\
  \ for tok_sent in norm_bible]\nnorm_bible = filter(None, normalize_corpus(norm_bible))\n\
  norm_bible = [tok_sent for tok_sent in norm_bible if len(tok_sent.split()) > 2]\n\
  print('总行数:', len(bible))\nprint('\\n 样本行:', bible[10])\nprint('\\n 处理后的行:', norm_bible[10])\n\
  ```\n\n以下输出显示了语料库中的总行数以及预处理在圣经语料库上的工作方式。\n\n```\n总行数: 30103\n样本行: ['1', ':', '6',\
  \ 'And', 'God', 'said', ',', 'Let', 'there', 'be', 'a', 'firmament', 'in', 'the',\
  \ 'midst', 'of', 'the', 'waters', ',', 'and', 'let', 'it', 'divide', 'the', 'waters',\
  \ 'from', 'the', 'waters', '.']\n处理后的行: god said let firmament midst waters let\
  \ divide waters waters\n```\n\n现在，让我们来看一些流行的词嵌入模型，并从我们的语料库中提炼出有意义的特征吧！\n\n### Word2Vec\
  \ 模型\n\n该模型由谷歌于 2013 年创建，是一个基于深度学习的预测模型，用于计算和生成高质量、分布式且连续的密集词向量表示，这些表示能够捕捉上下文和语义相似性。本质上，这些是无监督模型，可以接收海量文本语料库，创建可能的词汇表，并为向量空间中代表该词汇表的每个单词生成密集的词嵌入。通常，您可以指定词嵌入向量的大小，而向量的总数基本上等于词汇表的大小。这使得这个密集向量空间的维度比使用传统词袋模型构建的高维稀疏向量空间低得多。\n\
  \n`Word2Vec` 可以利用两种不同的模型架构来创建这些词嵌入表示。它们包括：\n\n- 连续词袋（`CBOW`）模型\n- 跳字模型\n\n这些模型由\
  \ Mikolov 等人提出，我建议感兴趣的读者阅读围绕这些模型的原始论文，包括 Mikolov 等人的《词语和短语的分布式表示及其组合性》以及 Mikolov\
  \ 等人的《向量空间中词表示的高效估计》，以获取深入视角。\n\n#### 连续词袋（CBOW）模型\n\n`CBOW` 模型（见图 4-24）架构试图基于源上下文单词（周围单词）来预测当前目标单词（中心词）。考虑一个简单的句子，“the\
  \ quick brown fox jumps over the lazy dog”，这可以形成 (context_window, target_word) 的对，其中如果我们考虑大小为\
  \ 2 的上下文窗口，我们有这样的示例：(`[quick, fox]`, `brown`)、(`[the, brown]`, `quick`)、(`[the,\
  \ dog]`, `lazy`) 等等。因此，该模型试图基于 `context_window` 单词来预测 `target_word`。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig24_HTML.jpg](img/427287_2_En_4_Fig24_HTML.jpg)\n\
  \n图 4-24\n\n`CBOW` 模型架构（来源：[`https://arxiv.org/pdf/1301.3781.pdf`](https://arxiv.org/pdf/1301.3781.pdf)\
  \ Mikolov 等人）\n\n由于 `Word2Vec` 系列模型是无监督的，你只需给它一个语料库，无需额外的标签或信息，它就能从语料库中构建稠密的词嵌入。但是，一旦你拥有了这个语料库，你仍然需要利用一种有监督的分类方法才能获得这些嵌入。我们仅通过语料库本身来做到这一点，无需任何辅助信息。我们可以将这种\
  \ `CBOW` 架构建模为深度学习分类模型，其中我们将上下文单词作为我们的输入 `X`，并试图预测目标单词 `Y`。事实上，构建这种架构比跳字模型更简单，后者试图从一个源目标单词预测一大堆上下文单词。\n\
  \n\n\n### 实现连续词袋（CBOW）模型\n\n虽然使用像 Gensim 这样具备 Word2Vec 模型的强大框架非常棒，但我们不妨从头开始实现一次，以便更深入地理解其背后的运作原理。我们将利用存储在\
  \ `norm_bible` 变量中的圣经语料库来训练模型。实现过程将聚焦于以下四个部分：\n\n- 构建语料库词汇表\n- 构建 CBOW（上下文，目标词）生成器\n\
  - 构建 CBOW 模型架构\n- 训练模型\n- 获取词嵌入\n\n闲言少叙，我们马上开始！\n\n#### 构建语料库词汇表\n\n首先，我们将构建语料库词汇表，从中提取每个唯一的单词，并为其映射一个唯一的数字标识符。\n\
  \n```python\nfrom keras.preprocessing import text\nfrom keras.utils import np_utils\n\
  from keras.preprocessing import sequence\ntokenizer = text.Tokenizer()\ntokenizer.fit_on_texts(norm_bible)\n\
  word2id = tokenizer.word_index\n# 构建唯一单词的词汇表\nword2id['PAD'] = 0\nid2word = {v:k\
  \ for k, v in word2id.items()}\nwids = [[word2id[w] for w in text.text_to_word_sequence(doc)]\
  \ for doc in norm_bible]\nvocab_size = len(word2id)\nembed_size = 100\nwindow_size\
  \ = 2 # 上下文窗口大小\nprint('词汇表大小:', vocab_size)\nprint('词汇表样例:', list(word2id.items())[:10])\n\
  词汇表大小: 12425\n词汇表样例: [('base', 2338), ('feller', 10771), ('sanctuary', 455), ('plunge',\
  \ 10322), ('azariah', 1120), ('enlightened', 4438), ('horns', 838), ('kareah', 2920),\
  \ ('nursing', 5943), ('baken', 3492)]\n```\n\n由此可见，我们为语料库中的唯一单词创建了一个词汇表，并建立了单词到其唯一标识符（以及反向映射）的映射。`PAD`\
  \ 项通常用于在必要时将上下文单词填充到固定长度。\n\n#### 构建 CBOW（上下文，目标词）生成器\n\n我们需要由目标中心词及其周围上下文单词组成的配对。在我们的实现中，目标词长度为\
  \ 1，周围上下文长度为 2 × *window*_*size*，即取语料库中目标词前后的各 `window_size` 个单词。通过下面的例子，这一点会更清楚。\n\
  \n```python\ndef generate_context_word_pairs(corpus, window_size, vocab_size):\n\
  \    context_length = window_size*2\n    for words in corpus:\n        sentence_length\
  \ = len(words)\n        for index, word in enumerate(words):\n            context_words\
  \ = []\n            label_word   = []\n            start = index - window_size\n\
  \            end = index + window_size + 1\n            context_words.append([words[i]\n\
  \                                 for i in range(start, end)\n                 \
  \                if 0 <= i < sentence_length\n                                 and\
  \ i != index])\n            label_word.append(word)\n            x = sequence.pad_sequences(context_words,\
  \ maxlen=context_length)\n            y = np_utils.to_categorical(label_word, vocab_size)\n\
  \            yield (x, y)\ni = 0\nfor x, y in generate_context_word_pairs(corpus=wids,\
  \ window_size=window_size, vocab_size=vocab_size):\n    if 0 not in x[0]:\n    \
  \    print('上下文 (X):', [id2word[w] for w in x[0]], '-> 目标词 (Y):', id2word[np.argwhere(y[0])[0][0]])\n\
  \        if i == 10:\n            break\n        i += 1\n上下文 (X): ['old','testament','james','bible']\
  \ -> 目标词 (Y): king\n上下文 (X): ['first','book','called','genesis'] -> 目标词 (Y): moses\n\
  上下文 (X): ['beginning','god','heaven','earth'] -> 目标词 (Y): created\n上下文 (X): ['earth','without','void','darkness']\
  \ -> 目标词 (Y): form\n上下文 (X): ['without','form','darkness','upon'] -> 目标词 (Y): void\n\
  上下文 (X): ['form', 'void', 'upon', 'face'] -> 目标词 (Y): darkness\n上下文 (X): ['void',\
  \ 'darkness', 'face', 'deep'] -> 目标词 (Y): upon\n上下文 (X): ['spirit', 'god', 'upon',\
  \ 'face'] -> 目标词 (Y): moved\n上下文 (X): ['god', 'moved', 'face', 'waters'] -> 目标词\
  \ (Y): upon\n上下文 (X): ['god', 'said', 'light', 'light'] -> 目标词 (Y): let\n上下文 (X):\
  \ ['god', 'saw', 'good', 'god'] -> 目标词 (Y): light\n```\n\n上述输出应该能让你更清楚地了解 `X` 如何构成上下文单词，以及我们如何根据这些上下文预测目标中心词\
  \ `Y`。例如，假设原始文本是“in the beginning god created heaven and earth”，经过预处理和停用词移除后，变成了“beginning\
  \ god created heaven earth”。给定 [beginning, god, heaven, earth] 作为上下文，本例中的目标中心词就是“created”。\n\
  \n#### 构建 CBOW 模型架构\n\n现在，我们利用基于 TensorFlow 的 Keras 来构建 CBOW 模型的深度学习架构。为此，我们的输入将是上下文单词，它们被传递到一个嵌入层（使用随机权重初始化）。词嵌入被传递到一个\
  \ lambda 层，在那里我们对词嵌入进行平均（因此被称为 CBOW，因为平均时我们并不真正考虑上下文单词的顺序或序列）。然后，我们将这个平均后的上下文嵌入传递到一个密集的\
  \ softmax 层，该层预测我们的目标词。我们将此与实际目标词进行匹配，利用 `categorical_crossentropy` 损失函数计算损失，并在每个训练周期执行反向传播，以更新过程中的嵌入层。以下代码展示了模型架构。见图\
  \ 4-25。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig25_HTML.jpg](img/427287_2_En_4_Fig25_HTML.jpg)\n\
  \n**图 4-25.** CBOW 模型摘要与架构\n\n```python\nimport keras.backend as K\nfrom keras.models\
  \ import Sequential\nfrom keras.layers import Dense, Embedding, Lambda\n# 构建 CBOW\
  \ 架构\ncbow = Sequential()\ncbow.add(Embedding(input_dim=vocab_size, output_dim=embed_size,\
  \ input_length=window_size*2))\ncbow.add(Lambda(lambda x: K.mean(x, axis=1), output_shape=(embed_size,)))\n\
  cbow.add(Dense(vocab_size, activation=\"softmax\"))\ncbow.compile(loss='categorical_crossentropy',\
  \ optimizer=\"rmsprop\")\n# 查看模型摘要\nprint(cbow.summary())\n# 可视化模型结构\nfrom IPython.display\
  \ import SVG\nfrom keras.utils.vis_utils import model_to_dot\nSVG(model_to_dot(cbow,\
  \ show_shapes=True, show_layer_names=False,\n                 rankdir='TB').create(prog='dot',\
  \ format=\"svg\"))\n```\n\n如果你仍然难以可视化这个深度学习模型，我建议你阅读我前面提到的论文。我试着用简单的术语总结这个模型的核心概念。我们输入维度为\
  \ (2 × *window*_*size*) 的上下文单词，并将它们传递给大小为 (*vocab*_*size* × *embed*_*size*) 的嵌入层，这将为每个上下文单词生成密集的词嵌入（每个单词为\
  \ 1 × *embed*_*size*）。接着，我们使用一个 lambda 层对这些嵌入进行平均，得到一个平均的密集嵌入（1 × *embed*_*size*），然后将其发送到密集的\
  \ softmax 层，该层输出最可能的目标词。我们将其与实际目标词进行比较，计算损失，反向传播误差以调整权重（在嵌入层中），并对所有（上下文，目标词）配对重复此过程多个训练周期。图\
  \ 4-26 试图解释这个过程。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig26_HTML.jpg](img/427287_2_En_4_Fig26_HTML.jpg)\n\
  \n**图 4-26.** CBOW 深度学习模型的视觉描述\n\n现在，我们已经准备好使用我们的数据生成器向模型输入（上下文，目标词）配对，在语料库上训练这个模型了。\n\
  \n### 训练模型\n\n在完整的语料库上运行模型需要相当长的时间，所以我只运行了五个训练周期。你可以使用以下代码，并在必要时增加训练周期。\n\n```python\n\
  for epoch in range(1, 6):\n    loss = 0.\n    i = 0\n    for x, y in generate_context_word_pairs(corpus=wids,\
  \ window_size=window_size, vocab_size=vocab_size):\n        i += 1\n        loss\
  \ += cbow.train_on_batch(x, y)\n        if i % 100000 == 0:\n            print('已处理\
  \ {} 对 (上下文, 单词) 配对'.format(i))\n    print('训练周期:', epoch, '\\t 损失:', loss)\n  \
  \  print()\n训练周期: 1     损失: 4257900.60084\n训练周期: 2     损失: 4256209.59646\n训练周期:\
  \ 3     损失: 4247990.90456\n训练周期: 4     损失: 4225663.18927\n训练周期: 5     损失: 4104501.48929\n\
  ```\n\n### 注意\n运行此模型计算量很大，如果使用 GPU 进行训练，效果会更好。我在一个配备 Tesla K80 GPU 的 AWS p2.x 实例上进行了训练，仅五个训练周期就花了将近\
  \ 1.5 小时！\n\n一旦此模型训练完成，相似的单词在嵌入层中应具有相似的权重。\n\n\n\n### 获取词嵌入\n\n要获取整个词汇表的词嵌入，我们可以通过以下代码从嵌入层中提取。我们不提取位置\
  \ 0 处的嵌入，因为它属于填充（`PAD`）词，并非我们真正感兴趣的词。见图 4-27。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig27_HTML.jpg](img/427287_2_En_4_Fig27_HTML.jpg)\n\
  \n图 4-27\n\n基于 CBOW 模型的词汇表词嵌入\n\n```\nweights = cbow.get_weights()[0]\nweights =\
  \ weights[1:]\nprint(weights.shape)\npd.DataFrame(weights, index=list(id2word.values())[1:]).head()\n\
  ```\n\n因此，你可以清晰地看到每个词都有一个大小为（1×100）的密集嵌入，如图 4-27 的输出所示。让我们尝试基于这些嵌入为特定感兴趣的词找到一些上下文相似的词。为此，我们基于密集嵌入向量构建词汇表中所有词之间的成对距离矩阵，然后基于最短（欧几里得）距离找到每个感兴趣词的\
  \ n 个最近邻。\n\n```\nfrom sklearn.metrics.pairwise import euclidean_distances\n# 计算成对距离矩阵\n\
  distance_matrix = euclidean_distances(weights)\nprint(distance_matrix.shape)\n#\
  \ 查看上下文相似的词\nsimilar_words = {search_term: [id2word[idx]\nfor idx in distance_matrix[word2id[search_term]-1].argsort()[1:6]+1]\n\
  for search_term in ['god', 'jesus', 'noah', 'egypt', 'john', 'gospel', 'moses','famine']}\n\
  similar_words\n(12424, 12424)\n{'egypt': ['destroy', 'none', 'whole', 'jacob', 'sea'],\n\
  'famine': ['wickedness', 'sore', 'countries', 'cease', 'portion'],\n'god': ['therefore',\
  \ 'heard', 'may', 'behold', 'heaven'],\n'gospel': ['church', 'fowls', 'churches',\
  \ 'preached', 'doctrine'],\n'jesus': ['law', 'heard', 'world', 'many', 'dead'],\n\
  'john': ['dream', 'bones', 'held', 'present', 'alive'],\n'moses': ['pharaoh', 'gate',\
  \ 'jews', 'departed', 'lifted'],\n'noah': ['abram', 'plagues', 'hananiah', 'korah',\
  \ 'sarah']}\n```\n\n你可以清晰地看到其中一些在上下文中有意义（god 与 heaven，gospel 与 church 等），而有些则不然。通常，训练更多的周期会得到更好的结果。我们现在来探索\
  \ Skip-Gram 架构，它通常比 CBOW 能给出更好的结果。\n\n### Skip-Gram 模型\n\nSkip-Gram 模型架构试图实现 CBOW\
  \ 模型的反向功能。它试图根据一个目标词（中心词）来预测源上下文词（周围词）。考虑我们之前的简单句子“the quick brown fox jumps over\
  \ the lazy dog”。如果我们使用 CBOW 模型，我们会得到（`context_window`， `target_word`）对，例如，如果考虑大小为\
  \ 2 的上下文窗口，我们会得到诸如（`[quick, fox]`， `brown`）、（`[the, brown]`， `quick`）、（`[the, dog]`，\
  \ `lazy`）等示例。现在，考虑到 Skip-Gram 模型的目标是从目标词预测上下文，该模型通常会反转上下文和目标，并试图从每个目标词预测每个上下文词。因此任务变成了根据目标词`brown`预测上下文`[quick,\
  \ fox]`，或根据目标词`quick`预测上下文`[the, brown]`，依此类推。因此，模型试图基于`target_word`预测`context_window`中的词。见图\
  \ 4-28。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig28_HTML.jpg](img/427287_2_En_4_Fig28_HTML.jpg)\n\
  \n图 4-28\n\nSkip-Gram 模型架构（来源：[`https://arxiv.org/pdf/1301.3781.pdf`](https://arxiv.org/pdf/1301.3781.pdf)\
  \ Mikolov 等人）\n\n正如我们在 CBOW 模型中讨论的，我们需要将这个 Skip-Gram 架构建模为一个深度学习分类模型，因此我们将目标词作为输入，并尝试预测上下文词。这变得稍微复杂，因为我们的上下文中有多个词。我们通过将每个(*target*,\
  \ *context*_*words*)对分解为(*target*, *context*)对来进一步简化，这样上下文只包含一个词。因此我们之前的数据集被转换为类似（`brown`，\
  \ `quick`）、（`brown`， `fox`）、（`quick`， `the`）、（`quick`， `brown`）等对。但是，我们如何监督或训练模型来知道什么是上下文相关的，什么不是呢？\n\
  \n为此，我们向 Skip-Gram 模型提供（*X*， *Y*）对，其中*X*是输入，*Y*是标签。我们通过使用[(*target*, *context*)，\
  \ 1]对作为正输入样本来实现这一点，其中`target`是我们感兴趣的词，`context`是出现在目标词附近的上下文词。*正标签 1*表示这是一个上下文相关的对。我们还输入[(*target*,\
  \ *random*)， 0]对作为负输入样本，其中`target`同样是我们感兴趣的词，但`random`是从词汇表中随机选择的一个词，与我们的目标词没有上下文或关联。因此*负标签\
  \ 0*表示这是一个上下文无关的对。我们这样做是为了让模型能够学习哪些词对是上下文相关的，哪些不是，然后为语义相似的词生成相似的嵌入。\n\n### 实现 Skip-Gram\
  \ 模型\n\n现在让我们尝试从头实现这个模型，以深入了解其内部工作原理，并能够将其与我们实现的 CBOW 模型进行比较。我们照常使用包含在`norm_bible`变量中的圣经语料库来训练我们的模型。实现将集中在五个部分：\n\
  \n- 构建语料库词汇表\n- 构建 Skip-Gram [(目标词， 上下文词)， 相关性]生成器\n- 构建 Skip-Gram 模型架构\n- 训练模型\n\
  - 获取词嵌入\n\n让我们开始着手构建我们的 Skip-Gram Word2Vec 模型吧！\n\n#### 构建语料库词汇表\n\n首先，我们按照标准流程构建语料库词汇表，从词汇表中提取每个唯一的词并分配一个唯一标识符，类似于我们在\
  \ CBOW 模型中所做的。我们还维护映射关系，以便在词及其唯一标识符之间进行转换。\n\n```\nfrom keras.preprocessing import\
  \ text\ntokenizer = text.Tokenizer()\ntokenizer.fit_on_texts(norm_bible)\nword2id\
  \ = tokenizer.word_index\nid2word = {v:k for k, v in word2id.items()}\nvocab_size\
  \ = len(word2id) + 1\nembed_size = 100\nwids = [[word2id[w] for w in text.text_to_word_sequence(doc)]\
  \ for doc in norm_bible]\nprint('Vocabulary Size:', vocab_size)\nprint('Vocabulary\
  \ Sample:', list(word2id.items())[:10])\nVocabulary Size: 12425\nVocabulary Sample:\
  \ [('base', 2338), ('feller', 10771), ('sanctuary', 455), ('plunge', 10322), ('azariah',\
  \ 1120), ('enlightened', 4438), ('horns', 838), ('kareah', 2920), ('nursing', 5943),\
  \ ('baken', 3492)]\n```\n\n语料库中的每个唯一词现在都是我们词汇表的一部分，并拥有一个唯一的数字标识符。\n\n\n\n### 构建\
  \ Skip-Gram `[(目标词, 上下文词), 相关性]`生成器\n\n现在，我们来构建 Skip-Gram 生成器，它将为我们提供词对及其相关性，正如我们之前讨论的。幸运的是，Keras\
  \ 有一个便捷的 Skip-Grams 工具可以直接使用，我们无需像在 CBOW 中那样手动实现这个生成器。\n\n`skipgrams(...)` 函数位于\
  \ `keras.preprocessing.sequence` 中。该函数将词索引序列（整数列表）转换为以下形式的词元组：\n\n1.  `(词, 同一窗口内的词)`，标签为\
  \ 1（正样本）。\n2.  `(词, 词汇表中的随机词)`，标签为 0（负样本）。\n\n```python\nfrom keras.preprocessing.sequence\
  \ import skipgrams\n# 生成 skip-grams\nskip_grams = [skipgrams(wid, vocabulary_size=vocab_size,\
  \ window_size=10) for wid in wids]\n# 查看 skip-grams 样本\npairs, labels = skip_grams[0][0],\
  \ skip_grams[0][1]\nfor i in range(10):\n    print(\"({:s} ({:d}), {:s} ({:d}))\
  \ -> {:d}\".format(\n        id2word[pairs[i][0]], pairs[i][0],\n        id2word[pairs[i][1]],\
  \ pairs[i][1],\n        labels[i]))\n(bible (5766), stank (5220)) -> 0\n(james (1154),\
  \ izri (9970)) -> 0\n(king (13), bad (2285)) -> 0\n(king (13), james (1154)) ->\
  \ 1\n(king (13), lucius (8272)) -> 0\n(james (1154), king (13)) -> 1\n(james (1154),\
  \ bazluth (10091)) -> 0\n(james (1154), bible (5766)) -> 1\n(king (13), bible (5766))\
  \ -> 1\n(bible (5766), james (1154)) -> 1\n```\n\n因此，你可以看到我们已经成功生成了所需的 Skip-Grams，并且基于上述输出中的\
  \ Skip-Grams 样本，你可以根据标签（0 或 1）清晰地看出哪些是相关的，哪些是不相关的。\n\n### 构建 Skip-Gram 模型架构\n\n\
  现在，我们利用 TensorFlow 之上的 Keras 来构建 Skip-Gram 模型的深度学习架构。为此，我们的输入将是目标词和上下文词或随机词对。每个输入都将传入各自的嵌入层（使用随机权重初始化）。一旦我们获得目标词和上下文词的词嵌入，我们将其传递到一个合并层，在该层中计算这两个向量的点积。然后，我们将这个点积值传递到一个密集的\
  \ sigmoid 层，该层根据词对是上下文相关还是随机词，预测结果是 1 或 0。\n\n我们将其与实际相关性标签进行比较，利用`mean_squared_error`损失函数计算损失，并在每个训练周期执行反向传播，以更新嵌入层。以下代码展示了我们的模型架构。见图\
  \ 4-29。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig29_HTML.jpg](img/427287_2_En_4_Fig29_HTML.jpg)\n\
  \n**图 4-29** Skip-Gram 模型概要及架构\n\n```python\nfrom keras.layers import Dot\nfrom\
  \ keras.layers.core import Dense, Reshape\nfrom keras.layers.embeddings import Embedding\n\
  from keras.models import Sequential\nfrom keras.models import Model\n# 构建 skip-gram\
  \ 架构\nword_model = Sequential()\nword_model.add(Embedding(vocab_size, embed_size,\
  \ embeddings_initializer=\"glorot_uniform\", input_length=1))\nword_model.add(Reshape((embed_size,\
  \ )))\ncontext_model = Sequential()\ncontext_model.add(Embedding(vocab_size, embed_size,\
  \ embeddings_initializer=\"glorot_uniform\", input_length=1))\ncontext_model.add(Reshape((embed_size,)))\n\
  model_arch = Dot(axes=1)([word_model.output, context_model.output])\nmodel_arch\
  \ = Dense(1, kernel_initializer=\"glorot_uniform\", activation=\"sigmoid\")(model_arch)\n\
  model = Model([word_model.input, context_model.input], model_arch)\nmodel.compile(loss=\"\
  mean_squared_error\", optimizer=\"rmsprop\")\n# 查看模型概要\nprint(model.summary())\n\
  # 可视化模型结构\nfrom IPython.display import SVG\nfrom keras.utils.vis_utils import model_to_dot\n\
  SVG(model_to_dot(model, show_shapes=True, show_layer_names=False, rankdir='TB').create(prog='dot',\
  \ format=\"svg\"))\n```\n\n理解这个深度学习模型相当直接。不过，我将尽力用简单的术语总结这个模型的核心概念，以便于理解。对于每个训练样本，我们有一对输入词，包括一个具有唯一数字标识符的输入目标词和一个具有唯一数字标识符的上下文词。如果是正样本，则该词具有上下文意义，是一个上下文词，我们的标签\
  \ Y = 1。否则，如果是负样本，则该词没有上下文意义，只是一个随机词，我们的标签 Y = 0。我们将每个词传递给它们各自的嵌入层，其大小为（`vocab_size`\
  \ × `embed_size`），这将为这两个词生成稠密的词嵌入（每个词对应`1` × `embed_size`）。\n\n接下来，我们使用一个合并层来计算这两个嵌入的点积，并得到点积值。然后发送到密集的\
  \ sigmoid 层，该层输出 1 或 0。我们将其与实际标签 Y（1 或 0）进行比较，计算损失，反向传播误差以调整权重（在嵌入层中），并对所有`(目标词,\
  \ 上下文词)`对重复此过程，进行多个训练周期。图 4-30 试图解释这个过程。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig30_HTML.jpg](img/427287_2_En_4_Fig30_HTML.jpg)\n\
  \n**图 4-30** Skip-Gram 深度学习模型的可视化描述\n\n现在，让我们开始使用我们的 Skip-Grams 来训练模型。\n\n### 训练模型\n\
  \n在完整语料库上运行模型需要相当多的时间，但比 CBOW 模型要快。我运行了五个训练周期。你可以利用以下代码，并在需要时运行更多周期。\n\n```python\n\
  for epoch in range(1, 6):\n    loss = 0\n    for i, elem in enumerate(skip_grams):\n\
  \        pair_first_elem = np.array(list(zip(*elem[0]))[0], dtype=\"int32\")\n \
  \       pair_second_elem = np.array(list(zip(*elem[0]))[1], dtype=\"int32\")\n \
  \       labels = np.array(elem[1], dtype=\"int32\")\n        X = [pair_first_elem,\
  \ pair_second_elem]\n        Y = labels\n        if i % 10000 == 0:\n          \
  \  print('已处理 {} 个 (skip_first, skip_second, relevance) 对'.format(i))\n        loss\
  \ += model.train_on_batch(X,Y)\n    print('训练周期:', epoch, '损失:', loss)\nEpoch: 1\
  \ Loss: 4474.41281086\nEpoch: 2 Loss: 3750.71884749\nEpoch: 3 Loss: 3752.47489296\n\
  Epoch: 4 Loss: 3793.9177565\nEpoch: 5 Loss: 3718.15081862\n```\n\n模型训练完成后，基于嵌入层，相似的词应具有相似的权重。\n\
  \n\n\n### 获取词嵌入\n\n要获取整个词汇表的词嵌入，我们可以通过以下代码从嵌入层中提取。请注意，我们只关心目标词嵌入层，因此我们从 `word_model`\
  \ 嵌入层提取嵌入向量。我们不采用位置 0 的嵌入，因为词汇表中没有任何词的数值标识符为 0。参见图 4-31。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig31_HTML.jpg](img/427287_2_En_4_Fig31_HTML.jpg)\n\
  \n图 4-31 – 基于 Skip-Gram 模型的词汇表词嵌入\n\n```\nword_embed_layer = model.layers[2]\nweights\
  \ = word_embed_layer.get_weights()[0][1:]\nprint(weights.shape)\npd.DataFrame(weights,\
  \ index=id2word.values()).head()\n```\n\n因此，你可以清晰地看到每个词都拥有一个大小为 (1 × 100) 的稠密嵌入，如上文输出所示。这与我们从\
  \ CBOW 模型中得到的结果类似。现在，我们在这些稠密嵌入向量上应用欧几里得距离度量，为词汇表中的每个词生成成对距离度量。然后，我们可以基于最短（欧几里得）距离来确定每个目标词的\
  \ n 个最近邻，这与我们在 CBOW 模型嵌入上的操作类似。\n\n```\nfrom sklearn.metrics.pairwise import euclidean_distances\n\
  distance_matrix = euclidean_distances(weights)\nprint(distance_matrix.shape)\nsimilar_words\
  \ = {search_term: [id2word[idx]\nfor idx in distance_matrix[word2id[search_term]-1].argsort()[1:6]+1]\n\
  for search_term in ['god', 'jesus', 'noah', 'egypt', 'john', 'gospel', 'moses','famine']}\n\
  similar_words\n(12424, 12424)\n{'egypt': ['taken', 'pharaoh', 'wilderness', 'gods',\
  \ 'became'],\n'famine': ['moved', 'awake', 'driven', 'howl', 'snare'],\n'god': ['strength',\
  \ 'given', 'blessed', 'wherefore', 'lord'],\n'gospel': ['preached', 'must', 'preach',\
  \ 'desire', 'grace'],\n'jesus': ['disciples', 'christ', 'dead', 'peter', 'jews'],\n\
  'john': ['peter', 'hold', 'mountain', 'ghost', 'preached'],\n'moses': ['commanded',\
  \ 'third', 'congregation', 'tabernacle', 'tribes'],\n'noah': ['ham', 'terah', 'amon',\
  \ 'adin', 'zelophehad']}\n```\n\n从结果中可以清晰地看到，每个目标词的许多相似词都是合理的，并且与我们的 CBOW 模型相比，我们获得了更好的结果。现在，让我们使用\
  \ t-SNE（*t-分布随机邻域嵌入*）来可视化这些词嵌入。这是一种流行的降维技术，用于在低维空间（例如二维）中可视化高维空间。参见图 4-32。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig32_HTML.jpg](img/427287_2_En_4_Fig32_HTML.jpg)\n\
  \n图 4-32 – 使用 t-SNE 可视化 Skip-Gram Word2Vec 词嵌入\n\n```\nfrom sklearn.manifold import\
  \ TSNE\nwords = sum([[k] + v for k, v in similar_words.items()], [])\nwords_ids\
  \ = [word2id[w] for w in words]\nword_vectors = np.array([weights[idx] for idx in\
  \ words_ids])\nprint('Total words:', len(words), '\\tWord Embedding shapes:', word_vectors.shape)\n\
  tsne = TSNE(n_components=2, random_state=0, n_iter=10000, perplexity=3)\nnp.set_printoptions(suppress=True)\n\
  T = tsne.fit_transform(word_vectors)\nlabels = words\nplt.figure(figsize=(14, 8))\n\
  plt.scatter(T[:, 0], T[:, 1], c=\"steelblue\", edgecolors=\"k\")\nfor label, x,\
  \ y in zip(labels, T[:, 0], T[:, 1]):\nplt.annotate(label, xy=(x+1, y+1), xytext=(0,\
  \ 0), textcoords='offset points')\n```\n\n图 4-32 中的圆圈显示了在向量空间中彼此邻近、上下文语义相似的词。如果你发现其他有趣的规律，欢迎随时告知！\n\
  \n### 使用 Gensim 构建鲁棒的 Word2Vec 模型\n\n虽然我们的实现还算不错，但它们并未针对在大型语料库上高效运行进行优化。由 Radim\
  \ Řehůřek 创建的 *Gensim* 框架包含一个鲁棒、高效且可扩展的 Word2Vec 模型实现。我们将在圣经语料库上利用它。在我们的工作流程中，我们将对标准化后的语料库进行分词，然后重点关注\
  \ Word2Vec 模型中的以下四个参数进行构建。基本思想是提供文档语料库作为输入，并为输出获取特征向量。\n\n在内部，它会根据输入的文本文档构建一个词汇表，并基于我们之前提到的各种技术学习词的向量表示。完成后，它会构建一个模型，可用于提取文档中每个词的词向量。使用诸如平均加权或\
  \ TF-IDF 加权等多种技术，我们可以利用文档的词向量来计算其平均向量表示。你可以在 [`http://radimrehurek.com/gensim/models/word2vec.html`](http://radimrehurek.com/gensim/models/word2vec.html)\
  \ 获取有关 Gensim 的 Word2Vec 实现接口的更多详情。当我们基于示例训练语料库构建模型时，将主要关注以下参数。\n\n- `size`：此参数用于设置词向量的大小或维度，范围可以从几十到几千。你可以尝试不同的维度，看看哪种效果最佳。\n\
  - `window`：此参数用于设置上下文或窗口大小，该大小指定算法在训练时视为上下文的词窗口长度。\n- `min_count`：此参数指定词汇表中考虑一个词所需的最小词频。这有助于移除那些可能不太重要、因为在文档中出现频率极低的特定词。\n\
  - `sample`：此参数用于对高频词的降采样效果进行设置。通常在 0.01 到 0.0001 之间的值比较理想。\n\n构建模型后，我们将使用感兴趣的目标词来查看每个词对应的最相似词。\n\
  \n```\nfrom gensim.models import word2vec\n# tokenize sentences in corpus\nwpt =\
  \ nltk.WordPunctTokenizer()\ntokenized_corpus = [wpt.tokenize(document) for document\
  \ in norm_bible]\n# Set values for various parameters\nfeature_size = 100    # Word\
  \ vector dimensionality\nwindow_context = 30          # Context window size\nmin_word_count\
  \ = 1   # Minimum word count\nsample = 1e-3   # Downsample setting for frequent\
  \ words\nw2v_model = word2vec.Word2Vec(tokenized_corpus, size=feature_size,\nwindow=window_context,\
  \ min_count=min_word_count,\nsample=sample, iter=50)\n# view similar words based\
  \ on gensim's model\nsimilar_words = {search_term: [item[0]\nfor item in w2v_model.wv.most_similar([search_term],\
  \ topn=5)]\nfor search_term in ['god', 'jesus', 'noah', 'egypt', 'john', 'gospel',\
  \ 'moses','famine']}\nsimilar_words\n{'egypt': ['pharaoh', 'egyptians', 'bondage',\
  \ 'rod', 'flowing'],\n'famine': ['pestilence', 'peril', 'blasting', 'mildew', 'morever'],\n\
  'god': ['lord', 'promised', 'worldly', 'glory', 'reasonable'],\n'gospel': ['faith',\
  \ 'afflictions', 'christ', 'persecutions', 'godly'],\n'jesus': ['peter', 'messias',\
  \ 'apostles', 'immediately', 'neverthless'],\n'john': ['baptist', 'james', 'peter',\
  \ 'galilee', 'zebedee'],\n'moses': ['congregation', 'children', 'aaron', 'ordinance',\
  \ 'doctor'],\n'noah': ['shem', 'japheth', 'ham', 'noe', 'henoch']}\n```\n\n这些相似词与我们的目标词关联更紧密，这也是意料之中的，因为我们让模型运行了更多迭代，这必然会产生更好且更具上下文关联的嵌入。你是否注意到了任何有趣的关联？参见图\
  \ 4-33。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig33_HTML.jpg](img/427287_2_En_4_Fig33_HTML.jpg)\n\
  \n图 4-33\n\n\n\n"
- "# 诺亚的儿子与词嵌入\n\n诺亚的儿子们成为我们模型中最具上下文相似性的实体！\n\n接下来，我们使用词嵌入向量，通过 `t-SNE` 降维至二维空间，可视化目标词汇及其相似词汇。见图\
