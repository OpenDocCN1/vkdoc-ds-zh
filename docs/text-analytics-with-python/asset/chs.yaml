  \n## 总结\n\n在本章中，我们介绍了自然语言处理和文本分析中关于信息提取、文档摘要和主题建模的一些有趣领域。我们从世界信息生成的演进概述开始，了解了诸如信息过载等概念，这引出了对文本摘要和信息检索的需求。我们讨论了从文本数据中提取关键信息的各种方法，以及总结大型文档的方式。我们还涵盖了重要的数学概念，如奇异值分解和低秩矩阵近似，并在多个算法中应用了它们。\n\
  \n我们介绍了三种减少信息过载的方法，包括关键短语提取、主题模型和自动文档摘要。关键短语提取包括从语料库中获取关键短语或术语的方法，如搭配和加权标记词方法。\n\
  \n我们构建了几种主题建模技术，包括潜在语义索引、潜在狄利克雷分配以及近期使用 Gensim 和 Scikit-Learn 实现的非负矩阵分解。我们还调整了主题模型，并展示了找到最佳主题数量的方法。此外，我们探讨了解释和理解主题建模结果的有效方法。最后，我们研究了两种基于提取的自动文档摘要技术——潜在语义分析和\
  \ TextRank。我们实现了每种方法，并在真实数据上观察结果，以很好地了解这些方法的工作原理，以及简单的数学运算在生成可操作见解方面如何有效。\n\n\n\n\
  # 7. 文本相似度与聚类\n\n在前面的章节中，我们介绍了多种分析文本和提取有价值洞见的技术。我们探讨了有监督机器学习技术，用于将文本文档分类到几个预设的类别中。还介绍了无监督技术，如主题模型和文档摘要，这些技术涉及从大型文本文档和语料库中检索关键主题和信息。\n\
  \n在本章中，我们将研究一些利用无监督学习和信息检索概念的有趣技术和用例。如果你回忆一下第 5 章的内容，文本分类确实是一个有趣的问题，有着多种应用，最显著的包括新闻文章分类和电子邮件分类。但文本分类的一个限制是，我们需要大量带有手工标记类别的人工标注训练数据，因为我们使用有监督学习算法来构建分类模型。构建一个标注数据集绝非易事，因为你需要可观数量的训练数据。为此，我们需要花费时间和人力进行数据标注、模型构建，然后用它来对新文档进行分类。通常，任何企业可能都没有足够的时间在这方面投入（尽管收益可能是十倍的！）。我们能否让机器来完成这项任务呢？或许可以在一定程度上实现！本章将专门研究文本文档的内容，使用各种度量方法分析它们的相似性，并将相似的文档聚类在一起。\n\
  \n文本数据是非结构化的且噪声很高。在执行文本分类时，我们受益于良好标注的训练数据和有监督学习。然而，文档聚类是一个无监督学习过程，我们试图通过让机器学习各种文本文档、它们的特征、相似性和差异性，来将文档分割并分类到不同的类别中。这使得文档聚类更具挑战性，尽管也很有趣。假设有一个包含讨论各种不同概念和想法的文档的语料库。人类天生就能利用过往的学习经验来区分概念。例如，句子“狐狸比狗更聪明”与“狗比狐狸更快”的相似度，远高于其与“Python\
  \ 是一种优秀的编程语言”的相似度。我们可以轻易地凭直觉识别出像`Python`、`狐狸`、`狗`、`编程`这样的特定关键词，这有助于我们判断哪些句子或文档更相似。但我们能否以编程方式实现这一点呢？\n\
  \n在本章中，我们将重点关注与文本相似度相关的几个概念——距离度量和无监督机器学习算法——以回答以下问题。\n\n*   如何衡量词项和文档之间的相似度？\n\
  *   如何使用距离度量来找到最相关的文档？\n*   何时距离度量是一种度量标准？\n*   如何基于文本相似度构建推荐系统？\n*   如何将相似的文档分组？\n\
  \n在专注于回答这些问题的同时，我们还将涵盖理解解决这些问题所需的基本概念和信息。我们还将使用一些实际示例来说明与文本相似度、距离度量和文档聚类相关的概念。我们将通过一些有趣的案例研究来展示这些概念，例如利用文档相似度构建电影推荐系统，并将相似的电影聚类在一起！\n\
  \n这些技术中有许多可以与我们之前学到的一些技术结合使用，反之亦然。例如，结合特征工程的文本表示概念以及使用距离度量和特征的文本相似度，也可用于构建文档聚类。你还可以使用主题模型中的特征来衡量文本相似度。\n\
  \n除此之外，聚类可以让我们了解数据可能包含的潜在分组或类别，这些分组或类别基于相似的模式和属性。然后，这可以被接入其他系统，如监督分类系统。可能性确实是无穷无尽的！在本章中，我们首先介绍一些与距离度量、度量和无监督学习相关的重要概念。在打好基础之后，我们的目标是理解并分析词项相似度、文档相似度、推荐，最后是文档聚类。本章展示的所有代码示例均可在本书的官方\
  \ GitHub 仓库中找到，你可以通过[`https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition`](https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition)访问该仓库。\n\
  \n## 基本概念\n\n本章的主要目标是理解文本相似度和聚类。在进入具体技术和算法之前，本节将讨论与信息检索、文档相似度度量和机器学习相关的一些重要概念。尽管其中一些概念你可能在前面的章节中已经熟悉，但简要回顾一下仍会很有帮助。闲话少叙，我们开始吧。\n\
  \n### 信息检索\n\n信息检索被定义为根据某种需求，从语料库或持有信息的实体集合中检索相关信息源的过程。需求可以以用户输入到搜索引擎中的查询或搜索的形式出现。然后，他们会获得与其查询相关的搜索条目。实际上，搜索引擎是信息检索最流行的应用。相较于需求，包含信息的文档的相关性可以通过多种方式来衡量。这包括从搜索文本中查找特定的关键词，或者使用相似度度量来查看文档相对于输入查询的相似度排名或分数。这使得它明显不同于字符串匹配或正则表达式匹配，因为搜索字符串中的单词在文档（实体）集合中通常具有不同的顺序、上下文和语义，而且这些单词甚至可能基于同义词、反义词和否定修饰词有多种不同的解析或可能性。\n\
  \n### 特征工程\n\n到现在，你对特征工程或特征提取应该已经相当熟悉了。我们在第 4 章中详细介绍了这一点。诸如词袋模型、TF-IDF 和词嵌入模型等方法通常用于将文档表示为数值向量，以便更容易地应用数学或机器学习技术。你可以使用这些特征提取技术实现各种文档表示，甚至可以将每个字母或单词映射到一个对应的唯一数字标识符。\n\
  \n\n\n### 相似度度量\n\n相似度度量用于文本相似度分析和聚类。任何相似度或距离度量都用于衡量两个实体之间的接近程度，这些实体可以是任何文本格式，例如文档、句子甚至单个术语。这种相似度度量有助于识别相似的实体，并将明显不同的实体相互区分开来。相似度度量非常有效，有时选择合适的度量方法会对最终分析系统的性能产生很大影响。基于这些距离度量，人们还发明了各种评分或排序算法。决定实体间相似程度的因素主要有两个，如下所示：\n\
  \n-   实体的固有属性或特征\n-   度量公式及其属性\n\n有多种距离度量可用于衡量相似度，我们将在后续章节中介绍其中的几种。然而，需要记住的一个重要点是，并非所有相似度的距离度量都是相似度的距离指标。A.\
  \ Huang 的精彩论文《用于文本文档聚类的相似度度量》对此进行了详细讨论。考虑一个距离度量 `d` 和两个实体（在我们的上下文中，将之视为文档）`x` 和\
  \ `y`。`x` 和 `y` 之间的距离用于确定它们之间的相似程度，可表示为 `d(x, y)`。但度量 `d` 被称为*相似度的距离度量*，当且仅当它满足以下四个条件。\n\
  \n-   任意两个实体（例如 `x` 和 `y`）之间的距离必须始终为非负数，即 `d(x, y) ≥ 0`。\n-   两个实体之间的距离应为零，当且仅当它们完全相同时，即\
  \ `d(x, y) = 0`，当且仅当 `x = y`。\n-   此距离度量应始终是对称的，这意味着从 `x` 到 `y` 的距离始终等于从 `y` 到 `x`\
  \ 的距离。数学上可表示为 `d(x, y) = d(y, x)`。\n-   此距离度量应满足三角不等式性质，数学上可表示为 `d(x, z) ≤ d(x,\
  \ y) + d(y, z)`。\n\n这为我们提供了重要的标准和良好的框架，可用于检查某个距离度量是否可以作为衡量相似度的距离指标。进一步深入细节目前超出了本文的范围，但您可能有兴趣知道，非常流行的\
  \ KL 散度（也称为 Kullback-Leibler 散度）是一种违反第三性质的距离度量，该度量是不对称的。因此，将其用作文本文档的相似度度量是没有意义的。否则，它在区分不同分布和模式方面非常有用。\n\
  \n### 无监督机器学习算法\n\n这指的是一类试图从数据的各种属性和特征中发现潜在隐藏结构和模式的机器学习算法。除此之外，一些无监督学习算法也用于减少特征空间，通常是将高维特征空间降为低维。这些算法所操作的数据本质上是未标记的，因此没有预先确定的类别或分类。我们应用这些算法的目的是发现模式和有区分性的特征，从而帮助我们根据这些模式或特征将各个数据点分组或聚类。这些算法通常被称为*聚类算法*。上一章介绍的主题模型也属于无监督学习算法家族。至此，我们完成了对本章所必需的重要概念和背景信息的讨论。接下来，我们将进入文本规范化和特征提取，其中将介绍一些本章特有的概念。\n\
  \n## 文本相似度\n\n文本相似度的主要目标是分析和衡量两个文本实体之间的接近程度。这些文本实体可以是简单的标记或术语，如单词，也可以是整个文档，可能包含句子或文本段落。有多种分析文本相似度的方法，我们可以将文本相似度的意图大致分为以下两类。\n\
  \n-   **词汇相似度：** 这涉及观察文本文档的内容，包括其语法、结构和内容，并基于这些参数衡量它们的相似度。\n-   **语义相似度：** 这涉及确定文档的语义、含义和上下文，然后确定它们彼此的接近程度。依存句法分析和实体识别是可用于此的便捷工具。我们在第\
  \ 4 章中详细介绍了有助于捕获语义信息的词嵌入方法。\n\n本章主要介绍词汇相似度。距离度量通常用于衡量文本实体之间的相似度分数，我们将主要涵盖以下两个广泛的文本相似度领域：\n\
  \n-   **术语相似度：** 单个标记或单词之间的相似度\n-   **文档相似度：** 整个文本文档之间的相似度\n\n我们的想法是实现若干种距离度量，并看看如何衡量和分析简单单词之间的相似度。然后，我们将考察当衡量一组单词之间的相似度时情况会如何变化。\n\
  \n\n\n# 分析术语相似度\n\n我们将从分析术语相似度开始，更准确地说，是分析单个词元之间的相似度。尽管这在实际应用中用得不多，但它是理解文本相似度的绝佳起点。当然，自动补全、拼写检查和纠错器等应用场景会使用这些技术来纠正拼写错误的术语。我们在第\
  \ 3 章实现拼写检查时就见过不少这类应用！这里我们将选取几个单词，使用不同的词语表示方法和距离度量来计算它们之间的相似度。我们使用的词语表示方法如下：\n\n\
  *   字符向量化\n*   词袋字符向量化\n\n对于字符向量化，这是一个极其简单的过程，只需将术语中的每个字符映射到一个对应的唯一数字。我们可以使用下面代码片段中描述的函数来实现。\n\
  \n```python\nimport numpy as np\ndef vectorize_terms(terms):\n    terms = [term.lower()\
  \ for term in terms]\n    terms = [np.array(list(term)) for term in terms]\n   \
  \ terms = [np.array([ord(char) for char in term]) for term in terms]\n    return\
  \ terms\n```\n\n该函数接收一个单词或术语列表，并返回这些单词对应的字符向量。为了演示，我们总共使用四个示例术语，并计算它们之间的相似度。\n\n\
  ```python\nroot = 'Believe'\nterm1 = 'beleive'\nterm2 = 'bargain'\nterm3 = 'Elephant'\n\
  terms = [root, term1, term2, term3]\nterms\n"
