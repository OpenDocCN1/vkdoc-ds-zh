  # 9. 情感分析


  在本章中，我们将探讨自然语言处理（NLP）、文本分析和机器学习中一个最有趣且应用最广泛的领域。这里要解决的问题是情感分析或观点挖掘，即我们希望分析一些文本文档，并根据这些文档的内容来预测其情感或观点。情感分析或许是自然语言处理和文本分析中最流行的应用之一，有大量的网站、书籍和教程都在探讨这个主题。情感分析在处理主观文本时效果最佳，因为这类文本中人们会表达观点、感受和情绪。从实际工业应用的角度来看，情感分析被广泛用于分析公司调查、反馈问卷、社交媒体数据，以及针对电影、地点、商品等的评论。其核心思想是分析人们对特定实体的反应，并根据他们的情感采取有见地的行动。


  一个文本语料库由多个文本文档组成，每个文档可以简单到只有一个句子，也可以复杂到包含多个段落的完整文档。文本数据尽管高度非结构化，但可以分为两大类文档。*事实性文档*通常描述某种陈述或事实，不带任何特定的感受或情感。这类文档也被称为客观文档。另一方面，*主观性文档*则表达感受、情绪、情感和观点。


  情感分析通常也被称为观点分析或观点挖掘。其关键思想是运用文本分析、NLP、机器学习和语言学中的技术，从非结构化文本中提取重要信息或数据点。这反过来又能帮助我们得出定性输出，例如整体情感是积极、中性还是消极，以及定量输出，例如情感极性、主观性和客观性比例。情感极性通常是一个数值分数，分配给文本文档中积极和消极的方面，并基于表达感受和情感的具体词语和短语等主观参数。*中性*情感通常极性为
  `0`，因为它不表达任何特定情感；*积极*情感的极性为 `> 0`；而*消极*情感的极性为 `< 0`。当然，您可以根据所处理的文本类型随时更改这些阈值，对此没有硬性约束。


  在本章中，我们将专注于分析一个大型的电影评论语料库，并从中提取情感。我们将介绍多种用于分析情感的技术，包括：


  *   基于无监督词典的模型

  *   传统的监督式机器学习模型

  *   较新的监督式深度学习模型

  *   先进的监督式深度学习模型


  除了研究各种方法和模型，我们还将简要回顾机器学习流程中关于文本预处理和标准化的关键方面。此外，我们还会对我们的预测模型进行深入分析，包括模型解释和主题模型。


  这里的关键是理解我们如何解决像非结构化文本情感分析这样的问题，学习各种技术和模型，并理解如何解读结果。这将使您今后能够在自己的数据集上应用这些方法。本章展示的所有代码示例均可在本书的官方
  GitHub 仓库中找到，地址是 [`https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition`](https://github.com/dipanjanS/text-analytics-with-python/tree/master/New-Second-Edition)。让我们开始吧！


