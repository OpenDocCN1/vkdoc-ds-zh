  \ 应用 Word2Vec 特征于机器学习任务\n\n如果你还记得本章前一节的内容，你可能会看到我使用特征执行了一些实际的机器学习任务，例如聚类。让我们利用另一个语料库，尝试取得类似的结果。首先，我们在该语料库上构建一个简单的\
  \ `Word2Vec` 模型，并可视化嵌入向量。见图 4-35。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig35_HTML.jpg](img/427287_2_En_4_Fig35_HTML.jpg)\n\
  \n**图 4-35** – 在另一个示例语料库上可视化 `Word2Vec` 词嵌入\n\n```python\n# build word2vec model\n\
  wpt = nltk.WordPunctTokenizer()\ntokenized_corpus = [wpt.tokenize(document) for\
  \ document in norm_corpus]\n# Set values for various parameters\nfeature_size =\
  \ 10    # Word vector dimensionality\nwindow_context = 10          # Context window\
  \ size\nmin_word_count = 1   # Minimum word count\nsample = 1e-3   # Downsample\
  \ setting for frequent words\nw2v_model = word2vec.Word2Vec(tokenized_corpus, size=feature_size,\n\
  window=window_context, min_count = min_word_count, sample=sample, iter=100)\n# visualize\
  \ embeddings\nfrom sklearn.manifold import TSNE\nwords = w2v_model.wv.index2word\n\
  wvs = w2v_model.wv[words]\ntsne = TSNE(n_components=2, random_state=0, n_iter=5000,\
  \ perplexity=2)\nnp.set_printoptions(suppress=True)\nT = tsne.fit_transform(wvs)\n\
  labels = words\nplt.figure(figsize=(12, 6))\nplt.scatter(T[:, 0], T[:, 1], c=\"\
  orange\", edgecolors=\"r\")\nfor label, x, y in zip(labels, T[:, 0], T[:, 1]):\n\
  \    plt.annotate(label, xy=(x+1, y+1), xytext=(0, 0), textcoords='offset points')\n\
  ```\n\n请记住，我们的语料库非常小，因此为了获得有意义的词嵌入，并使模型获取更多上下文和语义信息，我们需要更多的数据。那么在这种场景下，什么是词嵌入？它通常是每个单词对应的稠密向量，如下面针对单词“sky”的示例所示。\n\
  \n```python\nw2v_model.wv['sky']\n# array([ 0.04576328,  0.02328374, -0.04483001,\
  \  0.0086611 ,  0.05173225,\n#         0.00953358, -0.04087641, -0.00427487, -0.0456274\
  \ ,  0.02155695], dtype=float32)\n```\n\n### 获取文档嵌入的策略\n\n现在，假设我们想要对我们的玩具语料库中的八个文档进行聚类。我们需要从每个文档中包含的每个单词中获取文档级嵌入。一种策略是对文档中每个单词的词嵌入取平均值。这是一个非常有用的策略，你可以将其应用到自己的问题中。让我们在语料库上应用这种方法来获取每个文档的特征。见图\
  \ 4-36。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig36_HTML.jpg](img/427287_2_En_4_Fig36_HTML.jpg)\n\
  \n**图 4-36** – 文档级嵌入\n\n```python\ndef average_word_vectors(words, model, vocabulary,\
  \ num_features):\n    feature_vector = np.zeros((num_features,),dtype=\"float64\"\
  )\n    nwords = 0.\n    for word in words:\n        if word in vocabulary:\n   \
  \         nwords = nwords + 1.\n            feature_vector = np.add(feature_vector,\
  \ model[word])\n    if nwords:\n        feature_vector = np.divide(feature_vector,\
  \ nwords)\n    return feature_vector\n\ndef averaged_word_vectorizer(corpus, model,\
  \ num_features):\n    vocabulary = set(model.wv.index2word)\n    features = [average_word_vectors(tokenized_sentence,\
  \ model, vocabulary, num_features) for tokenized_sentence in corpus]\n    return\
  \ np.array(features)\n\n# get document level embeddings\nw2v_feature_array = averaged_word_vectorizer(corpus=tokenized_corpus,\
  \ model=w2v_model, num_features=feature_size)\npd.DataFrame(w2v_feature_array)\n\
  ```\n\n现在我们已经获得了每个文档的特征，接下来使用亲和传播算法对这些文档进行聚类。这是一种基于数据点之间“消息传递”概念的聚类算法。它不需要显式指定簇的数量，而这是基于划分的聚类算法通常需要的。更详细的讨论请参见第\
  \ 7 章。见图 4-37。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig37_HTML.jpg](img/427287_2_En_4_Fig37_HTML.jpg)\n\
  \n**图 4-37** – 基于 `Word2Vec` 文档特征分配的簇\n\n```python\nfrom sklearn.cluster import\
  \ AffinityPropagation\nap = AffinityPropagation()\nap.fit(w2v_feature_array)\ncluster_labels\
  \ = ap.labels_\ncluster_labels = pd.DataFrame(cluster_labels, columns=['ClusterLabel'])\n\
  pd.concat([corpus_df, cluster_labels], axis=1)\n```\n\n可以看到，我们的算法基于 `Word2Vec` 特征成功将每个文档聚类到了正确的组中，非常巧妙！我们还可以使用*主成分分析\
  \ (PCA)* 将特征维度降至二维，然后通过颜色编码每个簇来可视化每个文档在簇中的位置。见图 4-38。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig38_HTML.jpg](img/427287_2_En_4_Fig38_HTML.jpg)\n\
  \n**图 4-38** – 可视化我们的文档簇\n\n```python\nfrom sklearn.decomposition import PCA\npca\
  \ = PCA(n_components=2, random_state=0)\npcs = pca.fit_transform(w2v_feature_array)\n\
  labels = ap.labels_\ncategories = list(corpus_df['Category'])\nplt.figure(figsize=(8,\
  \ 6))\nfor i in range(len(labels)):\n    label = labels[i]\n    color = 'orange'\
  \ if label == 0 else 'blue' if label == 1 else 'green'\n    annotation_label = categories[i]\n\
  \    x, y = pcs[i]\n    plt.scatter(x, y, c=color, edgecolors=\"k\")\n    plt.annotate(annotation_label,\
  \ xy=(x+1e-4, y+1e-3), xytext=(0, 0),\n                 textcoords='offset points')\n\
  ```\n\n一切看起来井井有条，因为每个簇中的文档彼此靠近，与其他簇相距较远。\n\n\n\n"
- "# GloVe 模型\n\nGloVe（*全局向量*）模型是一种无监督学习模型，可用于获取类似于 `Word2Vec` 的稠密词向量。不过，其技术有所不同，训练是在聚合的全局“词-词”共现矩阵上进行的，从而为我们提供一个具有有意义子结构的向量空间。该方法由斯坦福大学的\
  \ Pennington 等人发明，我建议你阅读关于 GloVe 的原始论文，即 Pennington 等人所著的《GloVe: Global Vectors\
  \ for Word Representation》，这是一篇极好的读物，能让你深入了解该模型的工作原理。\n\n我们不会过于详细地从头实现该模型，但如果你对实际代码感兴趣，可以查看官方的\
  \ GloVe 页面：[`https://nlp.stanford.edu/projects/glove/`](https://nlp.stanford.edu/projects/glove/)。这里我们保持简单，并尝试理解\
  \ GloVe 模型背后的基本概念。\n\n我们讨论过基于计数的矩阵分解方法（如 `LSA`）以及预测方法（如 `Word2Vec`）。论文指出，目前这两类方法都存在显著缺陷。像\
  \ `LSA` 这类方法能高效利用统计信息，但在词类比任务（例如寻找语义相似的词）上表现相对较差。像 `Skip-Gram` 这类方法在类比任务上可能表现更好，但它们未能很好地全局利用语料库的统计信息。\n\
  \nGloVe 模型的基本方法是：首先创建一个巨大的“词-上下文”共现矩阵，由（词，上下文）对组成，矩阵中的每个元素代表一个词与上下文（可以是一个词序列）共同出现的频次。然后，其思路是应用矩阵分解来近似这个矩阵，如图\
  \ 4-39 所示。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig39_HTML.jpg](img/427287_2_En_4_Fig39_HTML.jpg)\n\
  \n**图 4-39** GloVe 模型实现的概念模型\n\n考虑“词-上下文”（`WC`）矩阵、“词-特征”（`WF`）矩阵和“特征-上下文”（`FC`）矩阵，我们尝试进行因式分解：\n\
  \n![$$ WC= WF\\times FC $$](img/427287_2_En_4_Chapter_TeX_Eque.png)\n\n其目标是通过将 `WF`\
  \ 和 `FC` 相乘来重构 `WC`。为此，我们通常用一些随机权重初始化 `WF` 和 `FC`，尝试将它们相乘得到 `WC'`（`WC` 的近似值），并衡量其与\
  \ `WC` 的接近程度。我们使用*随机梯度下降法*（`SGD`）多次重复此过程以最小化误差。\n\n最后，“词-特征矩阵”（`WF`）为每个词提供了词嵌入，其中\
  \ `F` 可以预设为特定的维度数。需要记住的一个非常重要点是，`Word2Vec` 和 `GloVe` 模型在工作方式上非常相似。两者都旨在构建一个向量空间，其中每个词的位置都受到其相邻词（基于它们的上下文和语义）的影响。`Word2Vec`\
  \ 从局部的单个词共现对示例开始，而 `GloVe` 从语料库中所有词的全局聚合共现统计开始。\n\n## 将 GloVe 特征应用于机器学习任务\n\n让我们尝试将基于\
  \ GloVe 的嵌入用于我们的文档聚类任务。非常流行的 `spaCy` 框架具备基于不同语言模型利用 GloVe 嵌入的能力。你也可以从斯坦福 NLP 网站（[`https://nlp.stanford.edu/projects/glove/`](https://nlp.stanford.edu/projects/glove/)）获取预训练的词向量，并使用\
  \ `Gensim` 或 `spaCy` 按需加载。我们将安装 `spaCy` 并使用 `en_vectors_web_lg` 模型（[`https://spacy.io/models/en#en_vectors_web_lg`](https://spacy.io/models/en#en_vectors_web_lg)），该模型包含在\
  \ Common Crawl（[`http://commoncrawl.org/`](http://commoncrawl.org/)）上使用 GloVe 训练的\
  \ 300 维词向量稠密嵌入。\n\n```\n# 使用以下命令安装 spaCy\n> pip install -U spacy\n或\n> conda install\
  \ -c conda-forge spacy\n# 下载以下语言模型并将其存储在磁盘上\nhttps://github.com/explosion/spacy-models/releases/tag/en_vectors_web_lg-2.0.0\n\
  # 将其链接到 spaCy\n> python -m spacy link ./spacymodels/en_vectors_web_lg-2.0.0/en_vectors_web_lg\
  \ en_vecs\n链接成功\n./spacymodels/en_vectors_web_lg-2.0.0/en_vectors_web_lg --> ./Anaconda3/lib/site-packages/spacy/data/en_vecs\n\
  你现在可以通过 spacy.load('en_vecs') 加载模型\n```\n\n在 `spaCy` 中也有自动安装模型的方法。如果需要，你可以查看 [`https://spacy.io/usage/models`](https://spacy.io/usage/models)\
  \ 上的“模型与语言”页面了解更多信息。我在使用自动安装时遇到了一些问题，所以不得不手动加载它们。现在我们使用 `spaCy` 加载我们的语言模型。\n\n```\n\
  import spacy\nnlp = spacy.load('en_vecs')\ntotal_vectors = len(nlp.vocab.vectors)\n\
  print('词向量总数:', total_vectors)\n词向量总数: 1070971\n```\n\n这验证了一切正常且有序。现在让我们为玩具语料库中的每个词获取\
  \ GloVe 嵌入。见图 4-40。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig40_HTML.jpg](img/427287_2_En_4_Fig40_HTML.jpg)\n\
  \n**图 4-40** 样本语料库中词的 GloVe 嵌入\n\n```\nunique_words = list(set([word for sublist\
  \ in [doc.split() for doc in norm_corpus] for word in sublist]))\nword_glove_vectors\
  \ = np.array([nlp(word).vector for word in unique_words])\npd.DataFrame(word_glove_vectors,\
  \ index=unique_words)\n```\n\n现在我们可以使用 t-SNE 来可视化这些嵌入，类似于我们使用 `Word2Vec` 嵌入所做的操作。见图\
  \ 4-41。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig41_HTML.jpg](img/427287_2_En_4_Fig41_HTML.jpg)\n\
  \n**图 4-41** 在样本语料库上可视化 GloVe 词嵌入\n\n```\nfrom sklearn.manifold import TSNE\ntsne\
  \ = TSNE(n_components=2, random_state=0, n_iter=5000, perplexity=3)\nnp.set_printoptions(suppress=True)\n\
  T = tsne.fit_transform(word_glove_vectors)\nlabels = unique_words\nplt.figure(figsize=(12,\
  \ 6))\nplt.scatter(T[:, 0], T[:, 1], c=\"orange\", edgecolors=\"r\")\nfor label,\
  \ x, y in zip(labels, T[:, 0], T[:, 1]):\nplt.annotate(label, xy=(x+1, y+1), xytext=(0,\
  \ 0), textcoords='offset points')\n```\n\n`spaCy` 的妙处在于，它自动为每个文档中的词提供平均嵌入，而无需我们像在\
  \ `Word2Vec` 中那样实现一个函数。我们现在将利用 `spaCy` 为我们的语料库获取文档特征，并使用 k-means 聚类对文档进行聚类。见图 4-42。\n\
  \n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig42_HTML.jpg](img/427287_2_En_4_Fig42_HTML.jpg)\n\
  \n**图 4-42** 基于 GloVe 文档特征分配的聚类\n\n\n```python\ndoc_glove_vectors = np.array([nlp(str(doc)).vector\
  \ for doc in norm_corpus])\nkm = KMeans(n_clusters=3, random_state=0)\nkm.fit_transform(doc_glove_vectors)\n\
  cluster_labels = km.labels_\ncluster_labels = pd.DataFrame(cluster_labels, columns=['ClusterLabel'])\n\
  pd.concat([corpus_df, cluster_labels], axis=1)\n```\n\n我们看到与从 `Word2Vec` 模型获得的结果一致的聚类，这很好！如图\
  \ 4-43 所示（该图来自 Pennington 等人的原始论文），`GloVe` 模型声称在许多场景下表现优于 `Word2Vec` 模型。\n\n![../images/427287_2_En_4_Chapter/427287_2_En_4_Fig43_HTML.jpg](img/427287_2_En_4_Fig43_HTML.jpg)\n\
  \n**图 4-43** GloVe 与 Word2Vec 性能对比（来源：Pennington 等人发表于 [`https://nlp.stanford.edu/pubs/glove.pdf`](https://nlp.stanford.edu/pubs/glove.pdf)\
  \ 的论文）\n\n这些实验是在相同的 6B 词元语料库（Wikipedia 2014 + Gigaword 5）上训练 300 维向量，使用相同的 40 万词词汇表以及大小为\
  \ 10 的对称上下文窗口（如果你对细节感兴趣）进行的。\n\n### FastText 模型\n\n`FastText` 模型由 Facebook 于 2016\
  \ 年推出，作为基础 `Word2Vec` 模型的扩展和预期改进。它基于 Mikolov 等人题为 *《利用子词信息丰富词向量》* 的原始论文，该论文是深入理解该模型工作原理的极佳读物。总体而言，`FastText`\
  \ 是一个用于学习词表示并执行鲁棒、快速且准确文本分类的框架。该框架由 Facebook 在 GitHub 上开源，并声称具有以下特点：\n\n*   最新的最先进英语词向量\n\
  *   在 Wikipedia 和 Crawl 上训练的 157 种语言的词向量\n*   用于语言识别和各种监督任务的模型\n\n虽然我没有从头实现这个模型，但根据研究论文，我了解到以下关于该模型工作原理的内容。通常，像\
  \ `Word2Vec` 这样的预测模型将每个词视为一个独立的实体（例如，where），并为该词生成一个密集嵌入。然而，这对手词汇量庞大、罕见词众多的语言来说是一个严重的限制。`Word2Vec`\
  \ 模型通常会忽略每个词的形态结构，将词视为单一实体。`FastText` 模型则将每个词视为一个字符 n-gram 的袋。这在论文中也被称为*子词*模型。\n\
  \n我们在词的开头和结尾添加特殊的边界符号 `<` 和 `>`。这使我们能够区分前缀和后缀与其他字符序列。我们还将字母 `w` 包含在其 n-gram 集合中，以便学习每个词的表示（除了其字符\
  \ n-gram）。以词 \"where\" 和 `n=3`（三字符组）为例，它将被表示为字符 n-gram：`<wh`、`whe`、`her`、`ere`、`re>`\
  \ 以及代表整个词的特殊序列 `<where>`。请注意，对应于词 `<her>` 的序列与三字符组 \"her\" 以及词 \"where\" 是不同的。\n\
  \n在实践中，论文建议提取 `n ≥ 3` 和 `n ≤ 6` 的所有 n-gram。这是一种非常简单的方法，也可以考虑不同的 n-gram 集合，例如取所有前缀和后缀。我们通常为每个词的每个\
  \ n-gram 关联一个向量表示（嵌入）。因此，我们可以通过求其 n-gram 向量表示之和或这些 n-gram 嵌入的平均值来表示一个词。由于这种基于字符从单个词中利用\
  \ n-gram 的效果，罕见词获得良好表示的可能性更高，因为基于字符的 n-gram 应该会出现在语料库的其他词中。\n\n### 将 FastText 特征应用于机器学习任务\n\
  \n`Gensim` 包提供了包装器，可以借助 `gensim.models.fasttext` 模块下的 `FastText` 模型接口。我们再次将其应用于圣经语料库，查看感兴趣的词及其最相似的词。\n\
  \n```python\nfrom gensim.models.fasttext import FastText\nwpt = nltk.WordPunctTokenizer()\n\
  tokenized_corpus = [wpt.tokenize(document) for document in norm_bible]\n# 设置各种参数的值\n\
  feature_size = 100    # 词向量维度\nwindow_context = 50          # 上下文窗口大小\nmin_word_count\
  \ = 5   # 最小词频\nsample = 1e-3   # 高频词的下采样设置\n# sg 决定是否使用 skip-gram 模型 (1) 或 CBOW\
  \ (0)\nft_model = FastText(tokenized_corpus, size=feature_size, window=window_context,\
  \ min_count=min_word_count, sample=sample, sg=1, iter=50)\n# 基于 gensim 的 FastText\
  \ 模型查看相似词\nsimilar_words = {search_term: [item[0] for item in ft_model.wv.most_similar([search_term],\
  \ topn=5)] for search_term in ['god', 'jesus', 'noah', 'egypt', 'john', 'gospel',\
  \ 'moses','famine']}\nsimilar_words\n```\n输出：\n```\n{'egypt': ['land', 'pharaoh',\
