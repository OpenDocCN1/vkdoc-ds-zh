  ## 应用


  文本分类与归类在多个真实场景和应用中都有使用。其中包括：


  *   新闻分类

  *   垃圾邮件过滤

  *   音乐或电影类型分类

  *   情感分析

  *   语言检测


  文本数据的可能性确实是无穷无尽的，您只需付出一点努力，就能应用分类方法来解决各种问题，并自动化原本耗时耗力的操作和场景。


