  ...: test_reviews = reviews[35000:]\n...: test_sentiments = sentiments[35000:]\n\
  ...:\n...: # normalize datasets\n...: stop_words = nltk.corpus.stopwords.words('english')\n\
  ...: stop_words.remove('no')\n...: stop_words.remove('but')\n...: stop_words.remove('not')\n\
  ...:\n...: norm_train_reviews = tn.normalize_corpus(train_reviews)\n...: norm_test_reviews\
  \ = tn.normalize_corpus(test_reviews)\nreview sentiment\n0  One of the other reviewers\
  \ has mentioned that ...  positive\n1  A wonderful little production. The...  positive\n\
  2  I thought this was a wonderful way to spend ti...  positive\n3  Basically there's\
  \ a family where a little boy ...  negative\n4  Petter Mattei's \"Love in the Time\
  \ of Money\" is...  positive\n```\n\n我们的数据集现在已经准备好并标准化，因此我们可以从文本分类工作流程的步骤 3 开始，构建我们的分类系统。\n\
  \n## 传统监督机器学习模型\n\n在本节中，我们使用传统的分类模型来对电影评论的情感进行分类。我们的特征工程技术（步骤 3）将基于词袋模型和 TF-IDF\
  \ 模型，这些在第 4 章的“文本数据特征工程”部分已经详细讨论过。以下代码片段帮助我们在训练集和测试集上使用这两种模型来构建特征。\n\n```\nIn [3]:\
  \ from sklearn.feature_extraction.text import CountVectorizer, TfidfVectorizer\n\
  ...:\n...: # build BOW features on train reviews\n...: cv = CountVectorizer(binary=False,\
  \ min_df=0.0, max_df=1.0, ngram_range=(1,2))\n...: cv_train_features = cv.fit_transform(norm_train_reviews)\n\
  ...: # build TFIDF features on train reviews\n...: tv = TfidfVectorizer(use_idf=True,\
  \ min_df=0.0, max_df=1.0, ngram_range=(1,2), sublinear_tf=True)\n...: tv_train_features\
  \ = tv.fit_transform(norm_train_reviews)\n...:\n...: # transform test reviews into\
  \ features\n...: cv_test_features = cv.transform(norm_test_reviews)\n...: tv_test_features\
  \ = tv.transform(norm_test_reviews)\n...:\n...: print('BOW model:> Train features\
  \ shape:', cv_train_features.shape, ' Test features shape:', cv_test_features.shape)\n\
  ...: print('TFIDF model:> Train features shape:', tv_train_features.shape, ' Test\
  \ features shape:', tv_test_features.shape)\nBOW model:> Train features shape: (35000,\
  \ 2090724)  Test features shape: (15000, 2090724)\nTFIDF model:> Train features\
  \ shape: (35000, 2090724)  Test features shape: (15000, 2090724)\n```\n\n我们将单词和二元组纳入我们的特征集。我们现在可以使用一些在文本分类中效果很好的传统监督机器学习算法。我们建议将来在自己处理数据集时，使用逻辑回归、支持向量机和多项朴素贝叶斯模型。在本章中，我们使用逻辑回归和\
  \ SVM 构建了模型。以下代码片段有助于初始化这些分类模型估计器。\n\n```\nIn [4]: from sklearn.linear_model import\
  \ SGDClassifier, LogisticRegression\n...:\n...: lr = LogisticRegression(penalty='l2',\
  \ max_iter=100, C=1)\n...: svm = SGDClassifier(loss='hinge', max_iter=100)\n```\n\
  \n在不深入太多理论复杂性的情况下，逻辑回归模型是一种用于分类的监督线性机器学习模型，尽管其名称带有“回归”。在这个模型中，我们试图预测给定电影评论属于某个离散类别（在我们的场景中是二元类别）的概率。模型用于学习的函数表示如下：\n\
  \n`P(y= positive | X) = σ(θ^T X)`\n\n`P(y= negative | X) = 1 - σ(θ^T X)`\n\n其中，模型试图使用特征向量\
  \ *X* 预测情感类别，而 `σ(z) = 1 / (1 + e^(-z))`，这被广泛称为 **sigmoid 函数** 或 **逻辑函数**。该模型的主要目标是搜索\
  \ *θ* 的最优值，使得当特征向量 *X* 对应积极电影评论时，积极情感类别的概率最大，而当 *X* 对应消极电影评论时，该概率较小。逻辑函数有助于对概率进行建模以描述最终的预测类别。可以通过使用标准方法（如梯度下降）最小化适当的代价/损失函数来获得\
  \ *θ* 的最优值。逻辑回归也被广泛称为 ***MaxEnt (最大熵) 分类器***。\n\n我们现在使用 `model_evaluation_utils`\
  \ 模块中的工具函数 `train_predict_model(...)` 在训练特征上构建逻辑回归模型，并在测试特征上评估模型性能（步骤 4 和 5）。\n\n\
  ![../images/427287_2_En_9_Chapter/427287_2_En_9_Fig6_HTML.jpg](img/427287_2_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n基于词袋特征的逻辑回归模型性能指标\n\n```\nIn [5]: # Logistic Regression model on BOW features\n\
  ...: lr_bow_predictions = meu.train_predict_model(classifier=lr, train_features=cv_train_features,\
  \ train_labels=train_sentiments, test_features=cv_test_features, test_labels=test_sentiments)\n\
  ...: meu.display_model_performance_metrics(true_labels=test_sentiments, predicted_labels=lr_bow_predictions,\
  \ classes=['positive', 'negative'])\n```\n\n我们得到了 90.5% 的总体 F1 分数和模型准确率，如图 9-6 所示，这非常出色！现在我们可以使用以下代码片段类似地基于我们的\
  \ TF-IDF 特征构建一个逻辑回归模型。\n\n![../images/427287_2_En_9_Chapter/427287_2_En_9_Fig7_HTML.jpg](img/427287_2_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7\n基于 TF-IDF 特征的逻辑回归模型性能指标\n\n```\nIn [6]: # Logistic Regression model on\
  \ TF-IDF features\n...: lr_tfidf_predictions = meu.train_predict_model(classifier=lr,\
  \ train_features=tv_train_features, train_labels=train_sentiments, test_features=tv_test_features,\
