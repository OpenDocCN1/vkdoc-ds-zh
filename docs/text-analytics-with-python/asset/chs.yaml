  ## AFINN 词典


  AFINN 词典可能是最简单、最流行的词典之一，可广泛用于情感分析。它由 Finn Årup Nielsen 开发和维护，你可以在 Finn Årup Nielsen*
  的论文中找到关于此词典的更多详细信息，论文标题为 *“A New ANEW: Evaluation of a Word List for Sentiment Analysis
  in Microblogs”*，出自 ESWC2011 研讨会论文集。该词典的当前版本是 `AFINN-en-165.txt`，包含超过 3,300 个单词，每个单词都有一个极性得分。


  你可以在作者的官方 GitHub 仓库中找到此词典及其早期版本（包括 `AFINN-111`），地址为 [`https://github.com/fnielsen/afinn/blob/master/afinn/data/`](https://github.com/fnielsen/afinn/blob/master/afinn/data/)。作者还在其基础上用
  Python 创建了一个很好的包装库，也叫做 `afinn`，我们将用它来进行分析。你可以使用以下代码导入该库并实例化一个对象。


  ```

