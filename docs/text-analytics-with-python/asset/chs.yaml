  ...: print(''在原字符串 "{}" 中，找到从索引 {} 到 {} 的匹配项 "{}"''.format(m.group(0), m.start(),
  m.end(), s1))

  Found match Python ranging from index 0 - 6 in the string "Python is an excellent
  language"

