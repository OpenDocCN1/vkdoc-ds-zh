  \ + 0.003*\"训练\"`\n\n与 LSI 模型相比，这些主题明显更容易理解和解释，因为所有权重符号相同，能够告诉我们每个词在主题中的重要性。我们还可以查看模型的总体平均连贯性得分。\n\
  \n```python\ntopics_coherences = lda_model.top_topics(bow_corpus, topn=20)\navg_coherence_score\
  \ = np.mean([item[1] for item in topics_coherences])\nprint('平均连贯性得分:', avg_coherence_score)\n\
  ```\n`平均连贯性得分: -1.0433305600965899`\n\n主题连贯性本身就是一个复杂的话题，它可以在一定程度上用于衡量主题模型的质量。通常，如果一组陈述能够相互支持，则称其具有连贯性。主题模型是基于无监督学习的模型，它们在非结构化文本数据上进行训练，因此很难衡量输出结果的质量。关于主题连贯性框架的优质资源是\
  \ Michael Röder 等人的论文《探索主题连贯性度量空间》，您可以在[`http://svn.aksw.org/papers/2015/WSDM_Topic_Evaluation/public.pdf`](http://svn.aksw.org/papers/2015/WSDM_Topic_Evaluation/public.pdf)访问。同样的框架已在`Gensim`框架中以\
  \ Python 实现。Devashish 在[`https://rare-technologies.com/what-is-topic-coherence`](https://rare-technologies.com/what-is-topic-coherence)提供了详细的文章，他将这一简洁功能实现在了`Gensim`中！\n\
  \n我用他同样易于理解的类比来简要说明主题连贯性框架：假设我们有一个水源，水被分配给不同的人。要测量水质，我们必须依赖个别顾客的评价。现在假设我们有四个主要的配水枢纽，我们在四个水管上安装了一些设备，这些水管负责在每个枢纽中配水。这些设备帮助我们通过量化指标测量水质，从而节省了依赖主观评价的时间。现在将这个类比应用到主题模型中：水基本上就是我们从主题模型中获取的主题，而主题连贯性框架就是我们安装的设备，用于对主题质量进行定量评估。正如我们之前提到的研究论文所定义，这个连贯性框架是一个四阶段流水线，如图\
  \ 6-5 所示。\n\n![../images/427287_2_En_6_Chapter/427287_2_En_6_Fig5_HTML.jpg](img/427287_2_En_6_Fig5_HTML.jpg)\n\
  \n**图 6-5** 主题模型的统一连贯性框架\n\n图 6-5 所示的主题连贯性框架流水线中的四个主要阶段描述如下：\n\n1. **分割：** 这一阶段类似于我们将水分成若干杯，假设每杯水的质量不同。在这里，主题中的单词被分成子集，并创建词语对。\n\
  \n2. **概率计算：** 测量每杯水的水量。概率计算或估计的方法定义了如何从底层数据中推导出概率。布尔文档估计通过用单词出现的文档数除以总文档数来估计单个单词的概率。类似地，两个单词的联合概率通过包含这两个单词的文档数除以总文档数来估计。布尔滑动窗口则使用滑动窗口来确定单词计数。\n\
  \n\n### 3. 确认度量\n\n水杯中水的质量（基于某个指标）被测量，并根据其数量为每个杯子分配一个数值。在主题模型的背景下，确认度量接受一对单词或单词子集及其相应的概率，并计算条件词集对另一词的支持强度。通常有两种类型的度量——外部度量和内部度量。\n\
  \n- **直接或外部度量：** 最流行的一种是 `UCI` 度量。它使用点互信息（`PMI`）作为成对评分函数。在该研究论文中，他们提出了一种直接度量`C[p]`，该度量取得了最佳性能（详情见论文）。\n\
  \n- **间接或内部度量：** 间接确认度量声称能够捕捉到直接度量会遗漏的语义支持。最流行的度量之一是 `UMass` 度量，它使用以下评分函数：\n\n![$$\
  \ {\\mathrm{S}}_{\\mathrm{UMass}}\\left({w}_i,{w}_j\\right)=\\log \\frac{D\\left({w}_i,{w}_j\\\
  right)+1}{D\\left({w}_i\\right)} $$](img/427287_2_En_6_Chapter_TeX_Equc.png)\n\n\
  其中`D(w)`是词`w`的文档频率。该评分本质上是经验条件对数概率：\n\n![$$ \\log p\\left({w}_j|{w}_i\\right)=\\\
  log \\frac{p\\left({w}_i,{w}_j\\right)}{p\\left({w}_j\\right)} $$](img/427287_2_En_6_Chapter_TeX_Equd.png)\n\
  \n通过对分子中的文档频率加 1 进行平滑处理。研究论文声称发现了一个新的度量`C[v]`，它是间接余弦度量、`NPMI`和布尔滑动窗口的组合，取得了最佳结果。该度量在\
  \ Gensim 中也可用。\n\n### 4. 聚合\n\n这是将这些质量数值以某种方式（例如，算术平均值）组合起来得出一个定量指标的环节。每个主题的所有子集词对的确认度量被聚合并给出一个单一的连贯性分数。就像我们在之前的输出（`UMass`度量）中得到平均连贯性分数为-1.04\
  \ 一样。\n\n这为你评估和调整主题模型提供了足够的背景信息。现在，让我们以更易于理解的格式查看我们的`LDA`主题模型输出。一种方法是将主题可视化为词项和权重的元组。\n\
  \n```\ntopics_with_wts = [item[0] for item in topics_coherences]\nprint('LDA Topics\
  \ with Weights')\nprint('='*50)\nfor idx, topic in enumerate(topics_with_wts):\n\
  print('Topic #'+str(idx+1)+':')\nprint([(term, round(wt, 3)) for wt, term in topic])\n\
  print()\nLDA Topics with Weights\n==================================================\n\
  Topic #1:\n[('training', 0.017), ('word', 0.011), ('recognition', 0.008), ('trained',\
  \ 0.007), ('net', 0.006), ('unit', 0.006), ('feature', 0.006), ('speech', 0.006),\
