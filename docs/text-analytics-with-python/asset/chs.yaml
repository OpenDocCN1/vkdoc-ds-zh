  假设我们正在处理德语文本。我们可以使用已经训练好的 `sent_tokenize`，或者将一个针对德语文本的预训练分词模型加载到 `PunktSentenceTokenizer`
  实例中，并执行相同的操作。下面的代码片段展示了这一点。我们首先加载一个德语文本语料库并对其进行查看。


