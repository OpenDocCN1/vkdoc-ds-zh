  \n基于我们之前提到的，LSI 模型的核心涉及奇异值分解（`SVD`）。在这里，我们尝试使用低秩`SVD`从头实现一个 LSI 主题模型。`SVD`的第一步是获取源矩阵，通常是一个词项-文档矩阵。我们可以通过将稀疏的词袋表示转换为稠密矩阵，从`Gensim`中获取它。\n\
