  \ 0`为消极）的阈值为`>=0`。参见图 9-3。\n\n![../images/427287_2_En_9_Chapter/427287_2_En_9_Fig3_HTML.jpg](img/427287_2_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3** 基于 SentiWordNet 词典的模型性能指标\n\n```python\nIn [11]:  norm_test_reviews\
  \ = tn.normalize_corpus(test_reviews)\n...: predicted_sentiments = [analyze_sentiment_sentiwordnet_lexicon(review,\
  \ verbose=False) for review in norm_test_reviews]\n...: meu.display_model_performance_metrics(true_labels=test_sentiments,\
  \ predicted_labels=predicted_sentiments, classes=['positive', 'negative'])\n```\n\
  \n我们得到了整体 F1 分数为 60%，这相比我们之前的模型确实有所下降。可以看到大量消极评论被错误分类为积极。或许调整这里的阈值会有所帮助！\n\n## VADER\
  \ 词典\n\n由 C.J. Hutto 开发的 VADER 词典基于规则的情感分析框架，专门针对社交媒体中的情感分析进行了调优。VADER 代表情感意识词典与情感推理器。该框架的详细信息可阅读\
  \ Hutto, C.J.和 Gilbert, E.E. (2014)的原始论文《VADER：一种用于社交媒体文本情感分析的简约规则模型》，该论文收录于第八届国际博客与社交媒体会议(ICWSM-14)论文集。您可以使用基于\
  \ NLTK 接口的库，位于`nltk.sentiment.vader`模块下。您也可以从[`https://github.com/cjhutto/vaderSentiment`](https://github.com/cjhutto/vaderSentiment)下载实际词典或安装框架，该网站还包含\
  \ VADER 的详细信息。\n\n这个词典位于名为`vader_lexicon.txt`的文件中，包含了与单词、表情符号和俚语（如`wtf`、`lol`、`nah`等）相关的情感分数。总共超过\
  \ 9,000 个词汇特征，最终从中精选出超过 7,500 个经过验证的效价分数词汇特征纳入词典。每个特征均按`\"[-4] 极度消极\"`到`\"[4] 极度积极\"\
  `的等级进行评分，并允许`\"[0] 中性（或不在范围内、不适用）\"`。\n\n词汇特征的选择过程保留所有平均评分非零且标准差小于 2.5 的特征，该标准差由十位独立评分者的汇总结果确定。以下展示\
  \ VADER 词典的部分示例：\n\n```\n:(    -1.9   1.13578     [-2, -3, -2, 0, -1, -1, -2, -3,\
  \ -1, -4]\n:)    2.0    1.18322     [2, 2, 1, 1, 1, 1, 4, 3, 4, 1]\n...\nterrorizing\
  \  -3.0  1.0         [-3, -1, -4, -4, -4, -3, -2, -3, -2, -4]\nthankful     2.7\
  \   0.78102     [4, 2, 2, 3, 2, 4, 3, 3, 2, 2]\n```\n\n上述词典示例中的每一行都代表一个唯一的词条，可以是表情符号或单词。第一个标记表示单词/表情符号，第二个标记表示平均情感极性分数，第三个标记表示标准差，最后一个标记表示十位独立评分者给出的评分列表。现在让我们使用\
  \ VADER 来分析我们的电影评论！我们按如下方式构建自己的建模函数。\n\n```python\nfrom nltk.sentiment.vader import\
  \ SentimentIntensityAnalyzer\n\ndef analyze_sentiment_vader_lexicon(review, threshold=0.1,\
  \ verbose=False):\n    # 预处理文本\n    review = tn.strip_html_tags(review)\n    review\
  \ = tn.remove_accented_chars(review)\n    review = tn.expand_contractions(review)\n\
  \n    # 分析评论的情感\n    analyzer = SentimentIntensityAnalyzer()\n    scores = analyzer.polarity_scores(review)\n\
  \n    # 获取汇总分数与最终情感\n    agg_score = scores['compound']\n    final_sentiment = 'positive'\
  \ if agg_score >= threshold else 'negative'\n    if verbose:\n```\n\n\n\n# 显示详细情感统计信息\n\
  \n`positive = str(round(scores['pos'], 2)*100)+'%'`\n`final = round(agg_score, 2)`\n\
  `negative = str(round(scores['neg'], 2)*100)+'%'`\n`neutral = str(round(scores['neu'],\
  \ 2)*100)+'%'`\n`sentiment_frame = pd.DataFrame([[final_sentiment, final, positive,\
  \ negative, neutral]], columns=pd.MultiIndex(levels=[['SENTIMENT STATS:'],['Predicted\
  \ Sentiment', 'Polarity Score', 'Positive', 'Negative', 'Neutral']], labels=[[0,0,0,0,0],[0,1,2,3,4]]))`\n\
  `print(sentiment_frame)`\n`return final_sentiment`\n\n在我们的建模函数中，我们进行了一些基本的预处理，但保留了标点符号和表情符号。除此之外，我们使用\
  \ VADER 来获取评论文本的情感倾向性以及积极、中性和消极情感的占比。我们还基于用户为聚合情感倾向性设定的阈值来预测最终情感。通常，VADER 建议将聚合倾向性\
  \ >= 0.5 视为积极，[-0.5, 0.5] 之间视为中性，< -0.5 视为消极。在我们的语料库中，我们使用 >= 0.4 作为积极的阈值，< 0.4\
  \ 作为消极的阈值。以下是对我们样本评论的分析。\n\n```\nIn [13]: for review, sentiment in zip(test_reviews[sample_review_ids],\
  \ test_sentiments[sample_review_ids]):\n...:     print('REVIEW:', review)\n...:\
  \     print('Actual Sentiment:', sentiment)\n...:     pred = analyze_sentiment_vader_lexicon(review,\
  \ threshold=0.4, verbose=True)\n...:     print('-'*60)\nREVIEW: no comment - stupid\
  \ movie, acting average or worse... screenplay - no sense at all... SKIP IT!\nActual\
  \ Sentiment: negative\nSENTIMENT STATS:\nPredicted Sentiment Polarity Score Positive\
  \ Negative Neutral\n0            negative           -0.8     0.0%    40.0%   60.0%\n\
  \nREVIEW: I don't care if some people voted this movie to be bad. If you want the\
  \ Truth this is a Very Good Movie! It has every thing a movie should have. You really\
  \ should Get this one.\nActual Sentiment: positive\nSENTIMENT STATS:\nPredicted\
  \ Sentiment Polarity Score Positive             Negative Neutral\n0            negative\
  \          -0.16    16.0%  14.0%   69.0%\n\nREVIEW: Worst horror film ever but funniest\
  \ film ever rolled in one you have got to see this film it is so cheap it is unbelievable\
  \ but you have to see it really!!!! P.s watch the carrot\nActual Sentiment: positive\n\
  SENTIMENT STATS:\nPredicted Sentiment Polarity Score Positive Negative Neutral\n\
  0            positive           0.49    11.0%    11.0%   77.0%\n```\n\n我们可以看到每一条样本电影评论的情感倾向和倾向性得分的详细统计数据。让我们在完整的测试电影评论语料库上尝试我们的模型，并评估模型性能。\n\
  \n```\nIn [14]: predicted_sentiments = [analyze_sentiment_vader_lexicon(review,\
  \ threshold=0.4, verbose=False) for review in test_reviews]\n...: meu.display_model_performance_metrics(true_labels=test_sentiments,\
  \ predicted_labels=predicted_sentiments, classes=['positive', 'negative'])\n```\n\
  \n图 9-4 显示总体 F1 分数和模型准确率均为 71%，与基于 AFINN 的模型非常相似。基于 AFINN 的模型仅在平均精确率上领先 1%；否则，两个模型的性能相似。\n\
  \n![../images/427287_2_En_9_Chapter/427287_2_En_9_Fig4_HTML.jpg](img/427287_2_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n基于 VADER 词典的模型性能指标\n\n# 使用监督学习进行情感分类\n\n构建模型以理解文本内容并预测基于文本的评论的情感另一种方法是使用监督机器学习。更具体地说，我们使用分类模型来解决这个问题。我们在第\
  \ 1 章的“监督学习”部分介绍了与监督学习和分类相关的概念。关于构建和评估分类模型的细节，如果需要，可以前往第 5 章复习相关知识。在后续部分，我们将构建一个自动化的情感文本分类系统。实现这一目标的主要步骤如下：\n\
  \n1. 准备训练集和测试集（可选地还有一个验证集）。\n2. 预处理和标准化文本文档。\n3. 特征工程。\n4. 模型训练。\n5. 模型预测与评估。\n\n\
  这些是构建我们系统的主要步骤。最后一个可选步骤是将模型部署到你的服务器或云端。图 9-5 展示了使用监督学习（分类）模型构建标准文本分类系统的详细工作流程。\n\
  \n![../images/427287_2_En_9_Chapter/427287_2_En_9_Fig5_HTML.jpg](img/427287_2_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5\n构建自动化文本分类系统的蓝图\n\n在我们的场景中，文档指的是电影评论，类别指的是评论的情感，可以是积极或消极，这使得它成为一个二分类问题。在接下来的部分中，我们将使用传统的机器学习方法和较新的深度学习方法构建模型。你可以参考名为\
  \ `Sentiment Analysis - Supervised.ipynb` 的 Jupyter 笔记本以获得互动体验。让我们在开始之前加载必要的依赖项和设置。\n\
  \n```\nIn [1]: import pandas as pd\n...: import numpy as np\n...: import text_normalizer\
  \ as tn\n...: import model_evaluation_utils as meu\n...: import nltk\n...: np.set_printoptions(precision=2,\
  \ linewidth=80)\n```\n\n我们现在可以加载我们的 IMDB 电影评论数据集，使用前 35,000 条评论来训练模型，并保留其余 15,000\
  \ 条评论作为测试集来评估模型性能。除此之外，我们还使用我们的标准化模块来标准化我们的评论数据集（我们工作流程中的步骤 1 和 2）。\n\n```\nIn [2]:\
