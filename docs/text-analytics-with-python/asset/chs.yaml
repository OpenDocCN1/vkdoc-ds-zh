  \ 访问该仓库。\n\n## 文本摘要与信息提取\n\n文本摘要和信息提取致力于从庞大的文本语料库中提取关键概念和主题，本质上是在此过程中对内容进行缩减。在深入探讨概念和技术之前，我们首先需要理解文本摘要的必要性。**信息过载**这一概念是催生文本摘要需求的主要原因之一。自从印刷和口头媒体变得突出以来，书籍、文章、音频和视频的数量就变得极其丰富。这大约始于公元前\
  \ 3 或 4 世纪，当时人们将海量的书籍描述为“书籍的生产没有尽头”，而这种信息过载往往招致反对。\n\n文艺复兴时期，古腾堡大约在公元 1440 年发明了印刷机，这导致了书籍、手稿、文章和小册子的大规模生产。这再次引发了信息过载，学者们抱怨信息过多，这些信息变得极其难以消化、处理和管理。\n\
  \n随着计算机和技术的进步，我们在 20 世纪进入了数字时代，互联网由此诞生。这为通过社交媒体、新闻网站、电子邮件和即时通讯工具生产和消费信息开辟了全新的可能性窗口。这导致信息量激增，甚至产生了垃圾邮件、无用的状态更新、推文，以及网络上发布无意义内容的机器人等不受欢迎的信息。\n\
  \n现在，我们了解了信息生产和消费的现状，可以将**信息过载**定义为：由于存在过多的数据或信息，导致消费者难以处理这些信息并做出明智的决策。当输入系统的信息量开始超过系统的处理能力时，就会发生这种过载。人类的认知处理能力有限，并且我们的思维模式决定了我们无法长时间阅读单一的信息或数据，因为大脑会不时地走神。因此，当我们被信息淹没时，就会导致决策质量下降。\n\
  \n企业依靠做出明智的决策来蓬勃发展，而它们通常拥有海量的数据和信息。从这些信息中获取洞察并非易事，自动化这个过程也很困难，因为你必须知道如何处理这些数据。高管们很少有时间听长篇大论的演讲或翻阅好几页关于重要信息的内容。摘要和信息提取的目标是抓住关键的重要主题和主旨，并将庞大的信息文档浓缩成几行可以快速阅读、理解和解读的内容。最终目标是能够在更短的时间内做出明智的决策。我们需要高效且可扩展的流程和技术来对文本数据执行此操作。最流行的技术如下：\n\
  \n- 关键短语提取\n- 主题建模\n- 自动化文档摘要\n\n前两种技术涉及以概念、主题和主旨的形式从文档中提取关键信息，从而对其进行缩减。自动化文档摘要则是将大型文本文档总结成几行文字，用以解释文档试图传达的信息。我们将在后续章节详细探讨每种技术，并结合实践示例。首先，我们将简要介绍每种技术的内容及其范围。\n\
  \n\n\n## 关键词提取\n\n这可能是三种技术中最简单的一种。它涉及从文本文档或语料库中提取关键词或短语的过程，这些关键词或短语能够捕捉文档或语料库的主要概念或主题。可以说，这是主题建模的一种简化形式。你可能在学术论文中，甚至在线商店的某些产品中看到过用关键词或短语来描述实体，用几个词或短语捕捉该实体的核心思想或概念。\n\
  \n## 主题建模\n\n这通常涉及使用统计和数学建模技术，从文档语料库中提取主要主题、议题或概念。请注意，我们强调文档语料库，因为你拥有的文档集越多样化，就能生成越多的主题或概念。这与单个文档不同，如果单个文档谈论的是单一概念，你将无法获得太多主题或概念。主题模型通常被称为\
  \ ***概率统计模型*** ，它们使用特定的统计技术，包括奇异值分解（SVD）和潜在狄利克雷分配（LDA），来发现文本数据中连接的潜在语义结构，以产生主题和概念。它们在文本分析以及生物信息学等不同领域中得到了广泛应用。\n\
  \n## 自动文档摘要\n\n这是使用基于统计和机器学习技术的计算机程序或算法，对单个文档或文档语料库进行摘要，以获得一个能捕捉其基本概念和主题的简短摘要的过程。存在多种构建自动文档摘要器的技术，包括各种基于抽取和基于概括的技术。所有这些算法背后的关键概念是，找到一个原始数据集的代表性子集，使得该子集包含从语义和概念角度出发的数据集核心本质。文档摘要通常涉及从单个文档中抽取并构建一个执行摘要，但相同的算法也可以扩展到多个文档。然而，其目的并非将多个不同的文档合并在一起，因为那样会违背算法的初衷。同样的概念也适用于图像和视频摘要。\n\
  \n在进一步详细讨论每种技术之前，我们现在先讨论一些关于数学和机器学习的重要基础概念。\n\n## 重要概念\n\n本节我们将讨论几个重要的数学和机器学习基础概念，这些概念在后续内容中会很有用。其中一些你可能已经熟悉，但为了内容的完整性，我们会重复提及，以便你温故知新。本节我们还会涵盖一些自然语言处理的概念。\n\
  \n一个 ***文档*** 是一个包含完整文本数据体以及可选标题和其他元数据信息的实体。一个 ***语料库*** 通常由一组文档组成。这些文档可以是简单的句子，也可以是完整的文本段落。一个\
  \ ***分词后的语料库*** 指的是每个文档都被分词或分解成标记（通常是单词）的语料库。\n\n***文本整理*** 或 ***预处理*** 是使用特定技术（如移除特殊符号和字符、移除多余的\
  \ HTML 标签、移除停用词、纠正拼写、词干提取和词形还原）对文本数据进行清洗、规范化和标准化的过程。\n\n***特征工程*** 是从原始文本数据中提取有意义的特征或属性，并将其输入统计或机器学习算法的过程。这个过程也被称为\
  \ ***向量化*** ，因为该过程的最终转换结果是从原始文本标记生成的数值向量。原因是传统算法只能处理数值向量，不能直接处理原始文本数据。存在多种特征提取方法，包括基于词袋模型的二元特征（告诉我们文档中是否存在某个词或词组）、基于词袋模型的频率特征（告诉我们文档中某个词或词组的频率）以及词频-逆文档频率（TF-IDF）加权特征（它在对每个词项进行加权时会考虑词频和逆文档频率）。关于特征提取的更多细节，可以查看第\
  \ `4` 章。\n\n一个 ***特征矩阵*** 通常指的是从文档集合到特征的一个映射，其中每一行代表一个文档，每一列代表一个特定的特征（通常是一个词或一组词）。在特征提取之后，我们通过特征矩阵来表示一组文档或句子，并且在我们的实际示例中，我们通常会对这些矩阵应用统计和机器学习技术。特征矩阵也可以转置，这样，我们得到的就不是传统的文档-词项矩阵，而是词项-文档矩阵。我们也可以将其他特征（如文档相似度、主题-词项和主题-文档）表示为特征矩阵。\n\
  \n***奇异值分解（SVD）*** 是一种来自线性代数的技术，在摘要算法中非常常用。SVD 是对实数或复数矩阵进行因子分解的过程。形式上，我们可以如下定义 SVD。考虑一个维度为\
  \ *m* × *n* 的矩阵 `M`，其中 *m* 表示行数，*n* 表示列数。数学上，矩阵 `M` 可以使用 SVD 表示为如下的因子分解形式：\n\n```\n\
  M_{m×n} = U_{m×m} S_{m×n} V_{n×n}^T\n```\n\n其中我们有以下分解：\n\n-   `U` 是一个 *m* × *m*\
  \ 的酉矩阵，满足 `U^T U = I[m × m]`，其中 `I` 是单位矩阵。`U` 的列表示左奇异向量。\n-   `S` 是一个对角线的 *m × n*\
  \ 矩阵，其对角线上的元素为正实数。这通常也可以表示为一个包含 *m* 个值的向量，这些值表示奇异值。\n-   `V^T` 是一个 *n* × *n* 的酉矩阵，满足\
  \ `V^T V = I[n × n]`，其中 `I` 是单位矩阵。`V` 的行表示右奇异向量。\n\n\n\n这告诉我们 `U` 和 `V` 是正交的。`S`\
  \ 的奇异值在摘要算法中尤为重要。我们特别将 SVD 用于低秩矩阵近似，其中我们用矩阵 `M̂` 来近似原始矩阵 `M`，该新矩阵是原始矩阵 `M` 的截断版本，秩为\
  \ `k`，并且可以用 SVD 表示为 `M̂ = UŜV^T`，其中 `Ŝ` 是原始 `S` 矩阵的截断版本，现在只包含前 `k` 个最大的奇异值，其他奇异值用零表示。我们使用\
  \ SciPy 提供的一个优秀实现来提取前 `k` 个奇异值，并返回相应的 `U`、`S` 和 `V` 矩阵。我们使用的代码片段位于 `utils.py` 文件中，如下所示：\n\
  \n```python\nfrom scipy.sparse.linalg import svds\ndef low_rank_svd(matrix, singular_count=2):\n\
  u, s, vt = svds(matrix, k=singular_count)\nreturn u, s, vt\n```\n\n我们将在后续章节的主题建模和文档摘要中使用这个实现。图\
  \ 6-1 很好地展示了这一过程，它从原始的 SVD 分解中得到了 `k` 个奇异向量，并展示了我们如何确定低秩矩阵近似。\n\n![../images/427287_2_En_6_Chapter/427287_2_En_6_Fig1_HTML.jpg](img/427287_2_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1** 低秩矩阵近似的奇异值分解\n\n从图 6-1 中可以清楚地看到，`k` 个奇异值在低秩矩阵近似中被保留，以及原始矩阵 `M` 是如何通过\
  \ SVD 分解为 `U`、`S` 和 `VT` 的。\n\n*   `M` 通常被称为*词项-文档*矩阵，通常在对预处理后的文本数据进行特征工程后得到，其中矩阵的每一行代表一个词项，每一列代表一个文本文档。\n\
  *   `U` 被称为*词项-主题*矩阵，其中矩阵的每一行代表一个词项，每一列代表一个主题。当我们将它乘以奇异值时，有助于获取每个主题中具有影响力的词项。\n\
  *   `S` 是由低秩 SVD 后得到的*奇异值*列表组成的矩阵或数组，其数量通常等于我们在该操作之前确定的主题数量。\n*   `VT` 是*主题-文档*矩阵，如果对其进行转置，你会得到*文档-主题*矩阵，这对于了解每个主题对每个文档的影响程度非常有用。\n\
  \n在本章的其余部分，除非对理解算法工作原理至关重要，否则我们尽量将数学内容保持在最低限度。但我们鼓励读者深入研究这些技术，以便更好地理解它们在幕后是如何工作的。\n\
  \n## 关键词提取\n\n这是从非结构化文本文档中提取重要信息最简单但最强大的技术之一。关键词提取，也称为*术语提取*，是从非结构化文本主体中提取关键术语或短语的过程，以便捕获核心主题。该技术属于信息检索和提取的广泛范畴。关键词提取在许多领域都很有用，这里列举其中一些：\n\
  \n*   语义网\n*   基于查询的搜索引擎和爬虫\n*   推荐系统\n*   标签系统\n*   文档相似度\n*   翻译\n\n关键词提取通常是执行文本分析或自然语言处理中更复杂任务的起点，其输出可以作为更复杂系统的特征。关键词提取有多种方法；我们将介绍以下两种主要技术：\n\
  \n*   搭配\n*   基于加权标签的短语提取\n\n需要记住的一个要点是，我们将提取短语，这些短语通常是单词的集合，有时也可能只是单个单词。如果你正在提取关键词，这也被称为关键词提取，它是关键词提取的一个子集。\n\
  \n\n\n### 搭配词\n\n术语*搭配词*借用于语料库分析和语言学领域。搭配词可以定义为倾向于频繁出现的单词序列或词组，其出现频率往往高于随机或偶然出现的频率。基于词性（如名词、动词等），可以形成各种类型的搭配词。有几种提取搭配词的方法，最佳方法之一是采用\
  \ n-gram 分组或切分策略。这种方法通过从语料库构建 n-gram，然后统计每个 n-gram 的出现频率，并根据频率排序，从而获取最频繁的 n-gram\
  \ 搭配。\n\n其核心思想是：拥有一个文档语料库（由段落或句子组成），对其进行分词形成句子，将句子列表扁平化成一个长字符串或序列，然后基于 n-gram 的范围，滑动一个大小为\
  \ n 的窗口来计算整个字符串上的 n-gram。计算完成后，根据每个 n-gram 的出现频率进行计数并排序。这样，就能基于频率得到最频繁的搭配词。我们首先从头实现这一过程，以便更好地理解算法，然后使用\
  \ NLTK 的一些内置功能来进行演示。\n\n我们先加载一些必要的依赖项和一个用于计算搭配词的语料库。我们使用 NLTK 古腾堡语料库中的书籍——刘易斯·卡罗尔的\
  \ *《爱丽丝梦游仙境》* 作为语料库。同时，使用我们在前几章构建的便捷`text_normalizer`模块对语料库进行标准化处理，以统一文本内容。\n\n\
  ```\nfrom nltk.corpus import gutenberg\nimport text_normalizer as tn\nimport nltk\n\
  from operator import itemgetter\n# 加载语料库\nalice = gutenberg.sents(fileids='carroll-alice.txt')\n\
  alice = [' '.join(ts) for ts in alice]\nnorm_alice = list(filter(None,\ntn.normalize_corpus(alice,\
  \ text_lemmatization=False)))\n# 打印并对比第一行\nprint(alice[0], '\\n', norm_alice[0])\n\
  [ Alice ' s Adventures in Wonderland by Lewis Carroll 1865 ]\nalice adventures wonderland\
  \ lewis carroll\n```\n\n现在我们定义一个函数，基于输入的标记列表和参数 n（n 决定了 n-gram 的度数，如一元组、二元组等），来计算\
  \ n-gram。下面的代码片段计算了输入序列中的 n-gram。\n\n```\ndef compute_ngrams(sequence, n):\n   \
  \ return list(\n        zip(*(sequence[index:] for index in range(n)))\n    )\n\
  ```\n\n这个函数接收一个标记序列，并构建一个列表的列表，其中每个列表包含前一个列表中除第一个元素之外的所有元素。它会构建 n 个这样的列表，然后将它们压缩在一起，得到所需的\
  \ n-gram。由于在 Python 3 中，`zip` 函数返回的是一个生成器对象而非原始列表，我们将最终结果包装在一个列表中。下面的代码片段展示了该函数在示例序列上的运行情况。\n\
  \n```\nIn [7]: compute_ngrams([1,2,3,4], 2)\nOut[7]: [(1, 2), (2, 3), (3, 4)]\n\
  In [8]: compute_ngrams([1,2,3,4], 3)\nOut[8]: [(1, 2, 3), (2, 3, 4)]\n```\n\n上述输出展示了输入序列的二元组和三元组。现在，我们利用这个函数并在此基础上进行扩展，以生成基于出现频率的\
  \ top n-gram。为此，我们需要定义一个函数将语料库扁平化成一个大的文本字符串。以下函数帮助我们对文档语料库执行此操作。\n\n```\ndef flatten_corpus(corpus):\n\
  \    return ' '.join([document.strip() for document in corpus])\n```\n\n现在，我们可以构建一个函数来帮助从文本语料库中获取\
  \ top n-gram。\n\n```\ndef get_top_ngrams(corpus, ngram_val=1, limit=5):\n    corpus\
  \ = flatten_corpus(corpus)\n    tokens = nltk.word_tokenize(corpus)\n    ngrams\
  \ = compute_ngrams(tokens, ngram_val)\n    ngrams_freq_dist = nltk.FreqDist(ngrams)\n\
  \    sorted_ngrams_fd = sorted(ngrams_freq_dist.items(),\n                     \
  \         key=itemgetter(1), reverse=True)\n    sorted_ngrams = sorted_ngrams_fd[0:limit]\n\
  \    sorted_ngrams = [(' '.join(text), freq) for text, freq in sorted_ngrams]\n\
  \    return sorted_ngrams\n```\n\n我们使用 NLTK 的 `FreqDist` 类创建一个所有 n-gram 的计数器（基于它们的频率），然后根据频率排序，并根据用户指定的限制返回\
  \ top n-gram。现在，使用以下代码片段计算我们语料库中的 top 二元组和 top 三元组。\n\n```\n# 前 10 个二元组\nIn [11]:\
  \ get_top_ngrams(corpus=norm_alice, ngram_val=2,\n...:               limit=10)\n\
  Out[11]:\n[('said alice', 123),\n ('mock turtle', 56),\n ('march hare', 31),\n ('said\
  \ king', 29),\n ('thought alice', 26),\n ('white rabbit', 22),\n ('said hatter',\
  \ 22),\n ('said mock', 20),\n ('said caterpillar', 18),\n ('said gryphon', 18)]\n\
  \n# 前 10 个三元组\nIn [12]: get_top_ngrams(corpus=norm_alice, ngram_val=3,\n...:   \
  \            limit=10)\nOut[12]:\n[('said mock turtle', 20),\n ('said march hare',\
  \ 10),\n ('poor little thing', 6),\n ('little golden key', 5),\n ('certainly said\
  \ alice', 5),\n ('white kid gloves', 5),\n ('march hare said', 5),\n ('mock turtle\
  \ said', 5),\n ('know said alice', 4),\n ('might well say', 4)]\n```\n\n该输出显示了由\
  \ n-gram 生成的二词和三词序列，以及它们在语料库中出现的次数。我们可以看到，大多数搭配词都指向正在说话的人，格式为 \"said <人物>\"。我们还可以看到，搭配词中出现了《爱丽丝梦游仙境》中的知名角色，如假海龟、国王、兔子、帽匠和爱丽丝。\n\
  \n现在我们来看 NLTK 的搭配词查找器，它使我们能够使用原始频率、逐点互信息等各种度量标准来查找搭配词。简单解释一下，*逐点互信息*可以针对两个事件或术语进行计算，即它们共同出现的概率与假设它们相互独立时各自概率乘积之比的对数。数学上可以表示为：\n\
  \n![$$ pmi\\left(x,y\\right)=\\log \\frac{p\\left(x,y\\right)}{p(x)p(y)} $$](img/427287_2_En_6_Chapter_TeX_Equb.png)\n\
  \n这个度量是对称的。下面的代码片段展示了如何使用这些度量来计算搭配词。\n\n```\n# 二元组\nfrom nltk.collocations import\
  \ BigramCollocationFinder\nfrom nltk.collocations import BigramAssocMeasures\nfinder\
  \ = BigramCollocationFinder.from_documents([item.split() for item in norm_alice])\n\
  finder\n```\n\n\n\n"
