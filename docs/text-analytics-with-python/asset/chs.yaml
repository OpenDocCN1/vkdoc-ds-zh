  \ 上的神经模型以及晶体管。\n\n\n\n# 非负矩阵分解\n\n我们介绍的最后一门技术是非负矩阵分解（`NMF`），这是另一种类似于 `SVD` 的矩阵分解技术，但它作用于非负矩阵，并且对多变量数据效果良好。给定一个非负矩阵\
  \ `V`，`NMF` 的目标是找到两个非负矩阵因子 `W` 和 `H`，使得它们相乘后能够近似重构 `V`。用数学语言表示如下：\n\n![$$ V\\approx\
  \ WH $$](img/427287_2_En_6_Chapter_TeX_Eque.png)\n\n使得这三个矩阵都是非负的。为了得到这个近似，我们通常使用一个代价函数，例如两个矩阵之间的欧几里得距离或\
  \ `L2` 范数，或者 Frobenius 范数（它是对 `L2` 范数的一个微小改进）。这可以表示如下：\n\n![$$ \\arg \\underset{W,H}{\\\
  min}\\frac{1}{2}\\parallel V- WH{\\parallel}² $$](img/427287_2_En_6_Chapter_TeX_Equf.png)\n\
  \n其中我们有三个非负矩阵——`V`、`W` 和 `H`——这可以进一步简化为：\n\n![$$ \\frac{1}{2}\\ \\sum \\limits_{i,j}{\\\
  left({V}_{ij}-W{H}_{ij}\\right)}² $$](img/427287_2_En_6_Chapter_TeX_Equg.png)\n\n\
  这个实现可以在 Scikit-Learn 分解模块的 `NMF` 类中找到，我们将在本节中使用它。\n\n我们可以使用以下代码片段在玩具语料库上构建一个基于 NMF\
  \ 的主题模型，与 LDA 一样，它会给出特征名称及其权重。\n\n```\n%%time\nfrom sklearn.decomposition import\
  \ NMF\nnmf_model = NMF(n_components=TOTAL_TOPICS, solver=\"cd\", max_iter=500,\n\
  random_state=42, alpha=.1, l1_ratio=.85)\ndocument_topics = nmf_model.fit_transform(cv_features)\n\
