  ### 基于 Word2Vec 嵌入的分类模型


  接下来，我们尝试将更新的高级特征工程技术应用于分类模型。首先，从生成 Word2Vec 嵌入开始。这里需要注意的一点是，词嵌入模型会为每个单词生成一个固定长度的稠密嵌入向量。因此，我们需要某种方案来为每个文档生成固定长度的嵌入。一种方法是对文档中所有单词的词嵌入进行平均（甚至可以计算
  TF-IDF 加权平均值！）。下面我们来构建一个方案，通过平均词嵌入来生成文档嵌入。


  ```

  def document_vectorizer(corpus, model, num_features):

  vocabulary = set(model.wv.index2word)

  def average_word_vectors(words, model, vocabulary, num_features):

  feature_vector = np.zeros((num_features,), dtype="float64")

  nwords = 0.

  for word in words:

  if word in vocabulary:

  nwords = nwords + 1.

  feature_vector = np.add(feature_vector, model.wv[word])

  if nwords:

  feature_vector = np.divide(feature_vector, nwords)

  return feature_vector

  features = [average_word_vectors(tokenized_sentence, model, vocabulary, num_features)
  for tokenized_sentence in corpus]

  return np.array(features)

  ```


  我们使用优秀的 Python 框架 `Gensim`，为语料库中的所有单词生成 Word2Vec 嵌入。


  ```

  # 对语料库进行分词

  tokenized_train = [tn.tokenizer.tokenize(text)

  for text in train_corpus]

  tokenized_test = [tn.tokenizer.tokenize(text)

  for text in test_corpus]

  # 生成 word2vec 词嵌入

  import gensim

  # 构建 word2vec 模型

  w2v_num_features = 1000

  w2v_model = gensim.models.Word2Vec(tokenized_train, size=w2v_num_features, window=100,
  min_count=2, sample=1e-3, sg=1, iter=5, workers=10)

  # 生成文档级嵌入

  # 请记住，我们仅使用训练数据集的词汇嵌入

  # 这样测试数据集才能保持真正不可见的状态

  # 从 word2vec 模型生成平均词向量特征

  avg_wv_train_features = document_vectorizer(corpus=tokenized_train, model=w2v_model,
  num_features=w2v_num_features)

  avg_wv_test_features = document_vectorizer(corpus=tokenized_test, model=w2v_model,
  num_features=w2v_num_features)

  print(''Word2Vec model:> Train features shape:'', avg_wv_train_features.shape,''
  Test features shape:'', avg_wv_test_features.shape)

  Word2Vec model:> Train features shape: (12263, 1000)  Test features shape: (6041,
  1000)

  ```


