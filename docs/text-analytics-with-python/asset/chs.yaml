  # 欧几里得距离


  我们在前一节比较曼哈顿距离时简要提到了*欧几里得距离*。形式上，欧几里得距离也称为欧几里得范数、`L2`范数或 `L2`距离。它被定义为两点之间的最短直线距离。数学上可表示如下：


  ![$$ ed\left(u,v\right)=\parallel u-v{\parallel}_2=\sqrt{\sum \limits_{i=1}^n{\left({u}_i-{v}_i\right)}²}
  $$](img/427287_2_En_7_Chapter_TeX_Eque.png)


  其中在我们的场景中，两个点 `u` 和 `v` 是长度为 `n` 的向量化文本项。以下函数帮助我们计算两个项之间的欧几里得距离。


  ```python

  def euclidean_distance(u, v):

  if u.shape != v.shape:

  raise ValueError(''The vectors must have equal lengths.'')

  distance = np.sqrt(np.sum(np.square(u - v)))

  return distance

  ```


  现在，我们可以使用下面代码片段中描述的这个函数，来比较各项之间的欧几里得距离。


  ```python

  '
- '# compute Euclidean distance

  for term, term_vector in zip(other_terms, other_term_vecs):

  print(''Euclidean distance between root: {} and term: {} is {}''.format(root_term,
  term, round(euclidean_distance(root_term_vec, term_vector), 2)))

