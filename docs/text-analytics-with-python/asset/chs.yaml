  \n## 分析主题模型\n\n另一种分析关键术语、概念或主题（这些是造成情感的原因）的方法是使用一种不同的方法，称为*主题建模*。我们在第 4 章的“文本数据特征工程”一节的“主题模型”部分介绍了一些主题建模的基础知识。主题模型的主要目的是提取和描绘关键主题或概念，这些主题或概念通常是潜在的，在庞大的文本文档语料库中并不十分突出。我们在第\
  \ 6 章中看到了使用潜在狄利克雷分配（LDA）和非负矩阵分解（NMF）进行主题建模的方法。在本节中，我们使用非负矩阵分解。如需交互式体验，请参考名为 `Sentiment\
  \ Causal Analysis - Topic Models.ipynb` 的 Jupyter 笔记本。\n\n分析的第一步是合并所有标准化的训练和测试评论，并将这些评论分为正面情感评论和负面情感评论。完成此操作后，我们将使用\
  \ TF-IDF 特征向量化器从这两个数据集中提取特征。以下代码片段可帮助我们实现这一点。\n\n```\nIn [11]: from sklearn.feature_extraction.text\
  \ import TfidfVectorizer\n...:\n...: # 合并所有标准化评论\n...: norm_reviews = norm_train_reviews+norm_test_reviews\n\
  ...: # 仅对正面评论提取 tf-idf 特征\n...: positive_reviews = [review for review, sentiment\
  \ in zip(norm_reviews, sentiments) if sentiment == 'positive']\n...: ptvf = TfidfVectorizer(use_idf=True,\
  \ min_df=0.02, max_df=0.75,\nngram_range=(1,2), sublinear_tf=True)\n...: ptvf_features\
  \ = ptvf.fit_transform(positive_reviews)\n...: # 仅对负面评论提取 tf-idf 特征\n...: negative_reviews\
  \ = [review for review, sentiment in zip(norm_reviews, sentiments) if sentiment\
  \ == 'negative']\n...: ntvf = TfidfVectorizer(use_idf=True, min_df=0.02, max_df=0.75,\n\
  ngram_range=(1,2), sublinear_tf=True)\n...: ntvf_features = ntvf.fit_transform(negative_reviews)\n\
  ...: # 查看特征集维度\n...: print(ptvf_features.shape, ntvf_features.shape)\n(25000, 933)\
  \ (25000, 925)\n```\n\n从前面的输出维度可以看出，我们通过将 `min_df` 设为 0.02、`max_df` 设为 0.75，过滤掉了之前构建分类模型时使用的许多特征。这是为了加快主题建模过程，并移除那些出现频率过高或过低的特征。现在让我们导入主题建模过程所需的依赖项。\n\
  \n```\nIn [12]: import pyLDAvis\n...: import pyLDAvis.sklearn\n...: from sklearn.decomposition\
  \ import NMF\n...: import topic_model_utils as tmu\n...:\n...: pyLDAvis.enable_notebook()\n\
  ...: total_topics = 10\n```\n\nScikit-Learn 中的 `NMF` 类帮助我们进行主题建模。我们还使用 `pyLDAvis`\
  \ 来构建主题模型的交互式可视化。非负矩阵分解（NNMF）的核心原理是将矩阵分解（类似于 SVD）应用于一个非负特征矩阵 *X*，使得分解可以表示为 *X* ≈\
  \ *WH*，其中 *W* 和 *H* 都是非负矩阵，如果将它们相乘，应能近似重构出特征矩阵 *X*。可以使用像 L2 范数这样的代价函数来获得这种近似。让我们应用\
  \ NNMF 从我们的正面情感评论中提取 10 个主题。\n\n\n\n# 基于正面情感评论特征构建主题模型\n\n```python\npos_nmf = NMF(n_components=total_topics,\
  \ solver=\"cd\", max_iter=500,\n              random_state=42, alpha=.1, l1_ratio=.85)\n\
  pos_nmf.fit(ptvf_features)\n\n"
- '# extract features and component weights

  pos_feature_names = np.array(ptvf.get_feature_names())

  pos_weights = pos_nmf.components_


  '
- "# extract and display topics and their components\npos_feature_names = np.array(ptvf.get_feature_names())\n\
  feature_idxs = np.argsort(-pos_weights)[:, :15]\ntopics = [pos_feature_names[idx]\
  \ for idx in feature_idxs]\nfor idx, topic in enumerate(topics):\n    print('Topic\
  \ #'+str(idx+1)+':')\n    print(', '.join(topic))\n    print()\n```\n\n**主题 #1:**\n\
