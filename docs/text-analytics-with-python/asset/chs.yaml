- '# 数据预处理与规范化


  在对文档进行预处理和规范化之前，我们先查看数据集中可能存在的空文档并将其移除。


  ```python

  total_nulls = data_df[data_df.Article.str.strip() == "].shape[0]

  print("Empty documents:", total_nulls)

  Empty documents: 515

  ```


  现在，我们可以使用一个简单的 pandas 过滤操作，移除所有文章中没有文本内容的记录，如下所示。


  ```python

  data_df = data_df[~(data_df.Article.str.strip() == ")]

  data_df.shape

  (18331, 3)

  ```


  这很简洁！现在我们需要考虑一般的文本预处理或整理阶段。这包括清洗、预处理和规范化文本，将句子、短语和词语等文本成分转换为某种标准格式。这有助于在整个文档语料库中实现标准化，从而构建有意义的特征并减少噪声。噪声可能由多种因素引入，例如不相关的符号、特殊字符、XML
  和 HTML 标签等。我们已经在第三章中详细讨论过这一点。不过，为了简要回顾，我们的文本规范化流程中的主要组成部分描述如下。请记住，它们都可以在 `text_normalizer`
  模块中找到，该模块位于 `text_normalizer.py` 文件中。


  - **清洗文本：** 我们的文本通常包含不必要的内容，比如 HTML 标签，这些内容在分析情感时没有太大价值。因此，我们需要确保在提取特征之前将其移除。`BeautifulSoup`
  库为此提供了非常出色的函数。我们的 `strip_html_tags(...)` 函数负责清理并移除 HTML 代码。

  - **移除带重音符号的字符：** 在我们的数据集中，我们处理的是英文评论，因此需要确保任何其他格式的字符，尤其是带重音符号的字符，都被转换并标准化为 ASCII
  字符。一个简单的例子是将 é 转换为 e。我们的 `remove_accented_chars(...)` 函数在这方面提供了帮助。

  - **扩展缩写词：** 在英语中，缩写词本质上是单词或音节的缩略形式。这些现有单词或短语的缩略形式是通过移除特定字母和发音来创建的。通常情况下，单词中的元音会被移除。例如
  `do not` 变为 `don''t`，`I would` 变为 `I''d`。缩写词给文本规范化带来了问题，因为我们需要处理像撇号这样的特殊字符，还必须将每个缩写词转换为其扩展后的原始形式。`expand_contractions(...)`
  函数使用正则表达式以及 `contractions.py` 模块中映射的各种缩写词，来扩展我们文本语料库中的所有缩写词。

  - **移除特殊字符：** 文本清洗和规范化中的另一个重要任务是移除特殊字符和符号，这些字符和符号常常会增加非结构化文本中的额外噪声。可以使用简单的正则表达式来实现这一点。我们的函数
  `remove_special_characters(...)` 有助于移除特殊字符。在我们的代码中，我们保留了数字，但如果你不希望规范化后的语料库中出现数字，也可以将其移除。




  ### 词干提取与词形还原


  词干通常是可能通过附加词缀（如前缀和后缀）而创建的基础单词形式，这一过程被称为*屈折变化*。获取单词基础形式的反向过程被称为*词干提取*。一个简单的例子是“watches”、“watching”和“watched”，它们的基础词干是“watch”。NLTK
  包提供了广泛的词干提取器，例如 `PorterStemmer` 和 `LancasterStemmer`。


  词形还原与词干提取非常相似，都是通过去除单词词缀来获取基础形式。然而，此处的基础形式被称为词根，而非词干。不同之处在于，词根始终是一个符合词汇规范的正确单词（存在于词典中），而词干可能并不正确。我们在规范化流程中仅使用词形还原来保留符合词汇规范的正确单词。函数
  `lemmatize_text(...)` 在这方面可以帮助我们。


  ### 去除停用词


  在从文本构建有意义的特征时，那些几乎没有或根本没有意义的单词被称为停用词。如果你在文档语料库中进行简单的词频统计，这些单词通常最终会具有最高的出现频率。像“a”、“an”、“the”等单词都是停用词。虽然没有通用的停用词列表，但我们使用来自
  NLTK 的标准英语停用词列表。如果需要，你可以添加特定领域的自定义停用词。函数 `remove_stopwords(...)` 有助于去除停用词，并保留语料库中最具意义和上下文的单词。


  我们将所有这些组件整合到名为 `normalize_corpus(...)` 的函数中，该函数可用于接收文档语料库作为输入，并返回经过清洗和规范化文本处理的同一语料库。这在我们的文本规范化模块中已经提供。现在让我们来测试一下！见图
  5-4。


  ![../images/427287_2_En_5_Chapter/427287_2_En_5_Fig4_HTML.jpg](img/427287_2_En_5_Fig4_HTML.jpg)


  **图 5-4** – 经过文本预处理后的 20 个新闻组数据集


  ```python

  import nltk

  stopword_list = nltk.corpus.stopwords.words(''english'')

  # 仅为了在二元组中保留否定词（如果有的话）

  stopword_list.remove(''no'')

  stopword_list.remove(''not'')

  # 规范化我们的语料库

  norm_corpus = tn.normalize_corpus(corpus=data_df[''Article''], html_stripping=True,

  contraction_expansion=True, accented_char_removal=True,

  text_lower_case=True, text_lemmatization=True,

  text_stemming=False, special_char_removal=True,

  remove_digits=True, stopword_removal=True,

  stopwords=stopword_list)

  data_df[''Clean Article''] = norm_corpus

  # 查看样本数据

  data_df = data_df[[''Article'', ''Clean Article'', ''Target Label'', ''Target Name'']]

  data_df.head(10)

  ```


