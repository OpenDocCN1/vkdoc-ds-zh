  \n\n\n### 访问布朗语料库\n\n我们之前已经简单讨论过布朗语料库，该语料库于 1961 年在布朗大学开发。该语料库包含来自 500 个来源的文本，并被划分为多个类别。以下代码片段将布朗语料库加载到系统内存中，并展示其各个类别。\n\
  \n```python\n# 加载布朗语料库\nfrom nltk.corpus import brown\n# 总类别数\nprint('总类别数:', len(brown.categories()))\n\
  总类别数: 15\n# 打印类别\nprint(brown.categories())\n['adventure', 'belles_lettres', 'editorial',\
  \ 'fiction', 'government', 'hobbies', 'humor', 'learned', 'lore', 'mystery', 'news',\
  \ 'religion', 'reviews', 'romance', 'science_fiction']\n```\n\n上述输出告诉我们，该语料库共有 15\
  \ 个类别，包括新闻、悬疑、传说等。以下代码片段将进一步深入探索布朗语料库的悬疑类别。\n\n```python\n# 分词后的句子\nbrown.sents(categories='mystery')\n\
  [['There', 'were', 'thirty-eight', 'patients', 'on', 'the', 'bus', 'the', 'morning',\
  \ 'I', 'left', 'for', 'Hanover', ',', 'most', 'of', 'them', 'disturbed', 'and',\
  \ 'hallucinating', '.'], ['An', 'interne', ',', 'a', 'nurse', 'and', 'two', 'attendants',\
  \ 'were', 'in', 'charge', 'of', 'us', '.'], ...]\n# 词性标注后的句子\nbrown.tagged_sents(categories='mystery')\n\
  [[('There', 'EX'), ('were', 'BED'), ('thirty-eight', 'CD'), ('patients', 'NNS'),\
  \ ('on', 'IN'), ('the', 'AT'), ('bus', 'NN'), ('the', 'AT'), ('morning', 'NN'),\
  \ ('I', 'PPSS'), ('left', 'VBD'), ('for', 'IN'), ('Hanover', 'NP'), (',', ','),\
  \ ('most', 'AP'), ('of', 'IN'), ('them', 'PPO'), ('disturbed', 'VBN'), ('and', 'CC'),\
  \ ('hallucinating', 'VBG'), ('.', '.')], [('An', 'AT'), ('interne', 'NN'), (',',\
  \ ','), ('a', 'AT'), ('nurse', 'NN'), ('and', 'CC'), ('two', 'CD'), ('attendants',\
  \ 'NNS'), ('were', 'BED'), ('in', 'IN'), ('charge', 'NN'), ('of', 'IN'), ('us',\
  \ 'PPO'), ('.', '.')], ...]\n# 获取自然形式的句子\nsentences = brown.sents(categories='mystery')\n\
  sentences = [' '.join(sentence_token) for sentence_token in sentences]\nsentences[0:5]\
  \ # 查看前 5 个句子\n['There were thirty-eight patients on the bus the morning I left\
  \ for Hanover , most of them disturbed and hallucinating .',\n'An interne , a nurse\
  \ and two attendants were in charge of us .',\n\"I felt lonely and depressed as\
  \ I stared out the bus window at Chicago's grim, dirty West Side.\",\n'It seemed\
  \ incredible , as I listened to the monotonous drone of voices and smelled the fetid\
  \ odors coming from the patients , that technically I was a ward of the state of\
  \ Illinois , going to a hospital for the mentally ill .',\n'I suddenly thought of\
  \ Mary Jane Brennan , the way her pretty eyes could flash with anger , her quiet\
  \ competence , the gentleness and sweetness that lay just beneath the surface of\
  \ her defenses .']\n```\n\n从前面的代码片段和输出中，我们可以看到悬疑类体裁的书面内容，以及句子如何以分词和注释格式提供。假设我们想查看悬疑类体裁中的顶级名词？我们可以使用以下代码片段来获取它们。请记住，名词的词性标注中通常包含`NN`或`NP`，用以表示名词的不同形式。我们将在第\
  \ 3 章更详细地介绍词性标注。\n\n```python\n# 获取带词性标注的单词\ntagged_words = brown.tagged_words(categories='mystery')\n\
  # 从带词性标注的单词中获取名词\nnouns = [(word, tag) for word, tag in tagged_words if any(noun_tag\
  \ in tag\nfor noun_tag in ['NP', 'NN'])]\nnouns[0:10] # 查看前 10 个名词\n[('patients',\
  \ 'NNS'), ('bus', 'NN'), ('morning', 'NN'), ('Hanover', 'NP'), ('interne', 'NN'),\n\
  ('nurse', 'NN'), ('attendants', 'NNS'), ('charge', 'NN'), ('bus', 'NN'), ('window',\
  \ 'NN')]\n# 构建名词的频率分布\nnouns_freq = nltk.FreqDist([word for word, tag in nouns])\n\
  # 查看出现频率最高的前 10 个名词\nnouns_freq.most_common(10)\n[('man', 106), ('time', 82), ('door',\
  \ 80), ('car', 69), ('room', 65),\n('Mr.', 63), ('way', 61), ('office', 50), ('eyes',\
  \ 48), ('Mrs.', 46)]\n```\n\n前面的代码片段和输出展示了出现频率最高的前十个名词，包括诸如 man、time、room 等词汇。我们使用了一些高级结构和技巧，如列表推导式、可迭代对象和元组。在下一章中，我们将介绍使用\
  \ Python 结构处理文本的核心概念。目前，你只需要知道我们根据词性标注从所有其他单词中过滤出名词，然后计算它们的频率，从而得到语料库中出现频率最高的名词。\n\
  \n### 访问路透社语料库\n\n路透社语料库包含来自大约 90 个不同类别的 10,788 篇路透社新闻文档，并被划分为训练集和测试集。在机器学习术语中，训练集用于训练模型，测试集用于测试该模型的性能。以下代码片段向我们展示了如何访问路透社语料库的数据。\n\
  \n```python\n# 加载路透社语料库\nfrom nltk.corpus import reuters\n# 总类别数\nprint('总类别数:',\
  \ len(reuters.categories()))\n总类别数: 90\n# 打印类别\nprint(reuters.categories())\n['acq',\
  \ 'alum', 'barley', 'bop', 'carcass', 'castor-oil', 'cocoa', ..., 'yen', 'zinc']\n\
  # 获取住房和收入类别的句子\nsentences = reuters.sents(categories=['housing', 'income'])\nsentences\
  \ = [' '.join(sentence_tokens) for sentence_tokens in sentences]\nsentences[0:5]\
  \  # 查看前 5 个句子\n[\"YUGOSLAV ECONOMY WORSENED IN 1986 , BANK DATA SHOWS National\
  \ Bank economic data for 1986 shows that Yugoslavia ' s trade deficit grew , the\
  \ inflation rate rose , wages were sharply higher , the money supply expanded and\
  \ the value of the dinar fell .\",\n'The trade deficit for 1986 was 2 . 012 billion\
  \ dlrs , 25 . 7 pct higher than in 1985 .',\n'The trend continued in the first three\
  \ months of this year as exports dropped by 17 . 8 pct , in hard currency terms\
  \ , to 2 . 124 billion dlrs .',\n'Yugoslavia this year started quoting trade figures\
  \ in dinars based on current exchange rates , instead of dollars based on a fixed\
  \ exchange rate of 264 . 53 dinars per dollar .',\n\"Yugoslavia ' s balance of payments\
  \ surplus with the convertible currency area fell to 245 mln dlrs in 1986 from 344\
  \ mln in 1985 .\"]\n# 基于文件 ID 的访问\nprint(reuters.fileids(categories=['housing',\
  \ 'income']))\n['test/16118', 'test/18534', 'test/18540', ..., 'training/7006',\
  \ 'training/7015', 'training/7036', 'training/7098', 'training/7099', 'training/9615']\n\
  print(reuters.sents(fileids=[u'test/16118', u'test/18534']))\n[['YUGOSLAV', 'ECONOMY',\
  \ 'WORSENED', 'IN', '1986', ',', 'BANK', 'DATA', 'SHOWS', 'National', 'Bank', 'economic',\
  \ 'data', 'for', '1986', 'shows', 'that', 'Yugoslavia', \"'\", 's', 'trade', 'deficit',\
  \ 'grew', ',', 'the', 'inflation', 'rate', 'rose', ',', 'wages', 'were', 'sharply',\
  \ 'higher', ',', 'the', 'money', 'supply', 'expanded', 'and', 'the', 'value', 'of',\
  \ 'the', 'dinar', 'fell', '.'], ['The', 'trade', 'deficit', 'for', '1986', 'was',\
  \ '2', '.', '012', 'billion', 'dlrs', ',', '25', '.', '7', 'pct', 'higher', 'than',\
  \ 'in', '1985', '.'], ...]\n```\n\n这让我们了解了如何使用类别和文件标识符来访问语料库数据。接下来，我们将介绍如何访问 WordNet\
  \ 语料库。\n\n\n\n### 访问 WordNet 语料库\n\nWordNet 语料库或许是使用最广泛的语料库之一，因为它包含大量词汇以及每个词语在语义上相连的同义词集。我们在此探讨\
  \ WordNet 语料库的一些基本特性，包括同义词集和访问语料库数据的方法。有关 WordNet 功能的更深入分析和全面介绍，可参考第 3 章，其中涵盖了同义词集、词元、下位词、上位词以及我们在前面语义学部分讨论的其他几个概念。以下代码片段向我们展示了如何访问\
  \ WordNet 语料库数据和同义词集。\n\n```python\n# 加载 WordNet 语料库\nfrom nltk.corpus import wordnet\
  \ as wn\nword = 'hike' # 将 hike 作为我们感兴趣的词\n# 获取词语的同义词集\nword_synsets = wn.synsets(word)\n\
  word_synsets\n# 获取同义词集中每个同义词的详细信息\nfor synset in word_synsets:\n    print(('同义词集名称:\
  \ {name}\\n'\n           '词性标签: {tag}\\n'\n           '定义: {defn}\\n'\n        \
  \   '示例: {ex}\\n').format(name=synset.name(),\n                                \
  \      tag=synset.pos(),\n                                      defn=synset.definition(),\n\
  \                                      ex=synset.examples()))\n```\n\n这段代码展示了一个关于单词\
  \ `hike` 及其同义词集的有趣示例，其中包括作为名词和动词且具有不同含义的同义词。WordNet 使得在语义上将单词与同义词关联起来、轻松检索各种单词的含义和示例变得更加容易。这个示例告诉我们，“hike”既可以指一次长途步行，也可以指工资/租金的上涨。请随意尝试不同的单词，并确定它们的同义词集、定义、示例和关系。\n\
  \n除了这些流行的语料库外，还有大量可用的文本语料库，你只需查看 `nltk.corpus` 模块即可找到它们，该模块可用于访问这些语料库中的任何一个。因此，你可以看到，借助\
  \ Python 和 NLTK，访问和使用来自任何文本语料库的数据是多么容易。至此，我们关于文本语料库的讨论就结束了。在下一节中，我们将介绍有关自然语言处理和文本分析的一些基本概念。\n\
  \n## 自然语言处理\n\n我们在本章中多次提到了*自然语言处理*（NLP）这个术语。到现在为止，你可能已经对 NLP 的含义有了一些概念。NLP 被定义为计算机科学与工程以及人工智能的一个专业领域，其根源在于计算语言学。它主要关注设计和构建能够实现机器与人类创造的自然语言之间交互的应用程序和系统。这也使得\
  \ NLP 与人机交互（HCI）领域相关联。NLP 技术使计算机能够处理和理解人类的自然语言，并进一步利用它来提供有用的输出。接下来，我们将讨论 NLP 的一些主要应用。\n\
  \n### 机器翻译\n\n机器翻译或许是 NLP 中最令人向往、最受追捧的应用之一。它被定义为一种有助于在任意两种语言之间提供句法、语法和语义正确翻译的技术。这或许是\
  \ NLP 中第一个主要的研究和开发领域。简单来说，机器翻译就是由机器执行的自然语言翻译。默认情况下，机器翻译过程的基本构建块涉及将单词从一种语言简单替换为另一种语言，但在这种情况下，我们会忽略诸如语法和短语结构一致性之类的问题。因此，随着时间的推移，更复杂的技术已经发展起来，包括将大量的文本语料库资源与统计和语言学技术相结合。最流行的机器翻译系统之一就是谷歌翻译。图\
  \ 1-23 展示了谷歌翻译对句子“What is the fare to the airport?”从英语到意大利语的成功机器翻译操作。\n\n![../images/427287_2_En_1_Chapter/427287_2_En_1_Fig23_HTML.jpg](img/427287_2_En_1_Fig23_HTML.jpg)\n\
  \n**图 1-23** 谷歌翻译执行的机器翻译\n\n随着时间的推移，机器翻译系统在您对着应用程序说话或输入时实时提供翻译方面变得越来越好。\n\n### 语音识别系统\n\
  \n这或许是 NLP 中最困难的应用。人工智能系统真正智能的主要且也许是最困难的测试之一就是图灵测试。该测试指出，如果用户向计算机和人类提出一个问题，它将无法区分所获得的回答。随着时间的推移，通过使用语音合成、分析、句法分析和上下文推理等技术，该领域已经取得了很大进展。然而，语音识别系统的一个主要限制仍然是它们具有很强的领域特异性，如果用户稍微偏离系统所需的预期脚本输入，系统就无法正常工作。语音识别系统现在广泛应用于从计算机、手机到虚拟辅助系统等众多地方。\n\
  \n### 问答系统\n\n问答系统（QAS）是基于利用 NLP 和信息检索（IR）技术进行问答的原理构建的。QAS 主要关注构建稳健且可扩展的系统，这些系统能够为用户以自然语言形式提出的问题提供答案。想象一下，在一个完全陌生的国家，你用纯自然语言向你手机中的个性化助手提问，并得到类似的回复。这正是研究人员和技术人员日复一日努力追求的的理想状态。通过像\
  \ Siri 和 Cortana 这样的个性化助手，我们在这个领域取得了一些成功，但它们的范围仍然有限，因为它们只能理解整个人类自然语言中的一小部分关键子句和短语。\n\
  \n要构建一个成功的 QAS，你需要一个包含各个领域数据的巨大知识库。QAS 将利用对该知识库的高效查询系统来提供自然语言形式的问题答案。创建和维护一个可查询的庞大知识库极其困难，因此你会发现\
  \ QAS 在食品、医疗、电子商务等利基领域兴起。聊天机器人是广泛使用 QAS 的新兴趋势之一。\n\n\n\n"
- '# 语境识别与消解


  这涵盖了理解自然语言的广泛领域，包括基于句法和语义的推理。词义消歧是一种常见的应用，其目标是在给定句子中找出某个词语的语境含义。以“book”一词为例：当用作名词时，它可以指代包含知识和信息的物体（书）；当用作动词时，它则表示预订座位或餐桌等行为。根据语境检测句子中的这些差异，是词义消歧的主要前提，这也是一项艰巨的任务。


  共指消解是自然语言处理（NLP）试图解决的语言学中的另一个问题。根据定义，当文本中的两个或多个术语/表述指向同一实体时，就发生了共指现象，这些术语/表述被称为具有相同的指代对象。以例句“John
  just told me that he is going to the exam hall”为例，句中代词“he”的指代对象是“John”。解析这些代词是共指消解的一部分，一旦文本中出现多个指代对象，这项工作就变得颇具挑战性。例如，“John
  just talked with Jim. He told me we have a surprise test tomorrow”这段文本中，代词“he”可能指代“John”或“Jim”，这使得难以精确锁定其确切的指代对象。


  '
- '# 文本摘要


  文本摘要的主要目标是从包含文本、段落或句子的文本文档集合中，适当精简内容，生成一份保留文档集关键要点的摘要。可以通过分析不同文档，找出集合中具有显著性的关键词、短语和句子来执行摘要提取。文本摘要的两种主要技术包括基于抽取的摘要和基于生成的摘要。随着海量文本和非结构化数据的出现，快速获取有价值见解的文本摘要需求十分旺盛。


  文本摘要系统通常执行两类主要操作。第一类是通用摘要，旨在对分析中的文档集合提供一份通用摘要。第二类操作是基于查询的摘要，它提供与查询相关的文本摘要：首先根据特定查询进一步筛选语料，然后提取与查询相关的关键词和短语，并据此构建摘要。


  ### 文本分类


  文本分类的主要目标是根据文档内容，确定特定文档应归入哪个类别或类别。这是自然语言处理和机器学习最流行的应用之一，因为只要拥有合适的数据，理解其内部原理并实现一个可运行的文本分类系统就极为简单。监督和无监督机器学习技术均可用于解决此问题，有时也会结合使用两者。这已帮助构建了许多成功且实用的应用，包括垃圾邮件过滤器和新闻文章分类。


  ### 文本分析


  如前所述，随着海量计算能力、非结构化数据的出现，以及机器学习和统计分析技术的成功，文本分析很快便获得了大量关注。然而，你需要了解文本分析相较于常规分析方法所面临的一些挑战。自由文本高度非结构化，很少遵循特定模式（如天气数据或关系数据库中的结构化属性）。因此，标准的统计方法直接应用于非结构化文本数据时往往无济于事。在本节中，我们将介绍文本分析相关的一些核心概念，并讨论文本分析的定义与范畴，这将让你对后续章节的内容有一个大致的了解。


  文本分析，也称为文本挖掘，被定义为从文本数据中获取高质量、可操作信息与洞察的方法论和过程。这涉及使用自然语言处理、信息检索和机器学习技术，将非结构化文本数据解析为更结构化的形式，并从中推导出对最终用户有用的模式和见解。文本分析包含一系列机器学习、语言学和统计技术，主要用于从文本中建模和提取信息，以满足分析需求，包括商业智能、探索性分析、描述性分析和预测性分析。文本分析中的一些主要技术和操作如下所述：


  *   文本分类

  *   文本聚类

  *   文本摘要

  *   情感分析

  *   实体抽取与识别

  *   相似性分析与关系建模


  然而，相比于常规的统计分析或机器学习，进行文本分析有时是一个更复杂的过程。原因在于，在应用学习技术或算法之前，我们必须将非结构化文本数据转换为这些算法可接受的格式。根据定义，被分析的文本通常被称为文档，通过应用各种技术，我们将其转换为词向量。这通常是一个数值数组，其值为每个词的特定权重，可以是词频、词出现与否或各种其他表示形式（其中一些将在第
  3 章讨论）。通常需要对文本进行清洗和处理，以去除噪声项和数据，这一过程称为文本预处理。一旦数据变成机器可读且可理解的格式，我们就可以根据待解决的问题应用相关算法。文本分析的应用多种多样，一些常见的应用如下：


  *   垃圾邮件检测

  *   新闻文章分类

  *   社交媒体分析与监控

  *   生物医学

  *   安全情报

  *   市场营销与客户关系管理（CRM）

  *   情感分析

  *   广告投放

  *   聊天机器人

  *   虚拟助手


  ### 机器学习


  我们可以将机器学习（ML）定义为人工智能（AI）的一个子领域。机器学习是利用技术的艺术与科学。它能让机器从底层数据中自动学习潜在的（latent）模式和关系，并随着时间的推移自我改进，而无需显式编程或硬编码特定规则。解决现实世界的问题（如文本分类、聚类等）通常需要结合使用自然语言处理和机器学习。机器学习的三大主要类别包括监督学习算法、无监督学习算法和强化学习算法。




  ## 深度学习


  深度学习（DL）领域是机器学习的一个子领域，专注于受大脑工作原理和功能启发的模型与算法。事实上，人工神经网络（ANN）是第一个从人脑中获得灵感而构建的模型。尽管我们距离复制大脑的功能还相当遥远，但神经网络是极其复杂的非线性模型，能够自动学习数据的层次化表示。深度学习或深度神经网络通常使用多层非线性处理单元，这些单元也被称为神经元，但我们更倾向于称其为处理单元。每一层都利用前一层输出作为输入，自行执行特征提取、工程化和转换。因此，每一层最终都在不同的抽象层次上学习数据的层次化表示。我们可以利用这些模型来解决有监督和无监督问题。近年来，深度学习在解决自然语言处理（NLP）问题方面展现出了巨大的潜力。


  ## 总结


  恭喜你坚持读完了这漫长的一章！我们通过探索自然语言处理的世界及其相关的各种概念和领域，开启了使用 Python 进行文本分析的旅程。现在，你对自然语言的含义及其在我们世界中的重要性有了清晰的认识。我们还探讨了语言哲学、语言习得与使用等相关概念。语言学领域让我们领略了语言研究的起源及其随时间的演变。我们详细介绍了语言句法和语义，并辅以有趣的
  Python 动手示例，以便轻松理解。我们还讨论了自然语言的资源，即文本语料库，并通过代码实例展示了如何使用 Python 和 NLTK 来交互和访问语料库。最后，我们以自然语言处理和文本分析的各个方面作为结束讨论。在下一章中，我们将讨论如何使用
  Python 进行文本分析，包括设置用于自然语言处理的 Python 开发环境、Python 中用于文本处理的各种结构，并介绍一些用于 NLP 的流行且先进的库、框架和平台。


