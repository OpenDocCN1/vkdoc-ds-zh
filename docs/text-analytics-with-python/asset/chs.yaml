  '
- '# 预处理我们的文本语料库


  清理和预处理文本数据有多种方法。以下几点我们重点介绍自然语言处理（NLP）流程中常用的一些最重要方法。如果你已阅读过第 3 章，其中大部分内容可作为复习。


  - **移除标签：** 我们的文本通常包含像 HTML 标签这类无必要的内容，它们在文本分析时价值不大。`BeautifulSoup` 库在提供相应函数方面表现出色。

  - **移除重音字符：** 在任何文本语料库中，尤其是处理英语时，可能会遇到带重音的字符/字母。因此，需要确保这些字符被转换并标准化为 ASCII 字符。一个简单的例子是将
  `é` 转换为 `e`。

  - **扩展缩写：** 在英语中，缩写本质上是单词或音节的简写形式，通过移除特定字母和发音形成。例如 `do not` 缩写为 `don’t`，`I would`
  缩写为 `I’d`。将每个缩写扩展为其原始完整形式通常有助于文本标准化。

  - **移除特殊字符：** 通常是非字母数字字符的特殊字符和符号，往往会增加非结构化文本中的额外噪音。很多时候，简单的正则表达式即可实现此目的。

  - **词干提取与词形还原：** 词干是可能单词的基本形式，通过向词干附加前缀和后缀等词缀来创建新词，这被称为屈折变化。获取单词基本形式的反向过程被称为`词干提取`。一个简单的例子是单词
  `watches`、`watching` 和 `watched`，它们都以 `watch` 作为词根词干。`词形还原`与`词干提取`非常相似，都是移除单词词缀以获取单词的基本形式。不过，在这种情况下，基本形式被称为根词而非根词干。区别在于根词始终是词典中存在的词汇学上正确的单词，而根词干则可能并不总是正确。

  - **移除停用词：** 在从文本中构建有意义的特征时，意义很小或没有意义的单词被称为停用词。如果在一个语料库中进行简单的词频统计，这些词通常最终出现频率最高。像
  “a”、“an”、“the” 等词被认为是停用词。虽然没有通用的停用词列表，但我们使用来自 `NLTK` 的标准英语停用词列表。你也可以根据需要添加自己领域特定的停用词。


  你还可以进行其他标准操作，如分词、移除多余空白、文本小写化，以及更高级的操作，如拼写纠正、语法错误纠正、移除重复字符等。如果感兴趣，可以查看第 3 章中关于文本预处理和整理的详细章节。


  由于本文的重点是特征工程，我们构建一个简单的文本预处理器，其核心功能是移除特殊字符、多余空白、数字、停用词，然后将文本语料库转换为小写。


  ```

  wpt = nltk.WordPunctTokenizer()

  stop_words = nltk.corpus.stopwords.words(''english'')

  def normalize_document(doc):

  # 小写化并移除特殊字符/空白

  doc = re.sub(r''[^a-zA-Z\s]'', '''', doc, re.I|re.A)

  doc = doc.lower()

  doc = doc.strip()

  # 对文档进行分词

  tokens = wpt.tokenize(doc)

  # 从文档中过滤停用词

  filtered_tokens = [token for token in tokens if token not in stop_words]

  # 从过滤后的分词重新创建文档

  doc = '' ''.join(filtered_tokens)

  return doc

  normalize_corpus = np.vectorize(normalize_document)

  ```


  一旦基本预处理流程准备就绪，就将其应用到示例语料库上，以便用于特征工程。


  ```

  norm_corpus = normalize_corpus(corpus)

  norm_corpus

  array([''sky blue beautiful'', ''love blue beautiful sky'',

  ''quick brown fox jumps lazy dog'',

  ''kings breakfast sausages ham bacon eggs toast beans'',

  ''love green eggs ham sausages bacon'',

  ''brown fox quick blue dog lazy'', ''sky blue sky beautiful today'',

  ''dog lazy brown fox quick''], dtype=''<U51'')

  ```


  这个输出应能让你清楚了解预处理后每个示例文档的样子。现在，让我们探索各种特征工程技术！


  ### 传统特征工程模型


  用于文本数据的传统（基于计数）特征工程策略属于一类统称为词袋模型的模型。这包括词频、TF-IDF（词频-逆文档频率）、N-gram、主题模型等。虽然这些是从文本中提取特征的有效方法，但由于模型本质上只是一个非结构化单词的集合，我们会丢失额外信息，如每个文本文档中附近单词的语义、结构、顺序和上下文。还有更先进的模型可以处理这些方面，我们将在本章后续章节中介绍。传统特征工程模型是使用数学和统计方法论构建的。我们将研究其中一些模型，并将其应用于示例语料库。




  ### 词袋模型


  这或许是最简单的非结构化文本向量空间表示模型。向量空间模型本质上是一种数学模型，能将非结构化文本（或其他数据）表示为数值向量，其中向量的每一维都代表一个特定的特征/属性。词袋模型将每个文本文档表示为一个数值向量，其中每个维度对应语料库中的一个特定词语，其值可以是该词在文档中的频率、出现情况（用
  1 或 0 表示），甚至可以是加权值。这个模型之所以得名，是因为每个文档被字面意义上地视为“一袋”它自己的词语，而忽略了词语顺序、序列和语法。


  ```

  from sklearn.feature_extraction.text import CountVectorizer

  # 以稀疏格式获取词袋特征

  cv = CountVectorizer(min_df=0., max_df=1.)

  cv_matrix = cv.fit_transform(norm_corpus)

  cv_matrix

  ```


  ```

  <42x20 sparse matrix of type ''<class ''numpy.int64''>''

  with 42 stored elements in Compressed Sparse Row format>

  ```


  ```

  # 查看稀疏矩阵中的非零特征位置

  print(cv_matrix)

  (0, 2)     1

  (0, 3)     1

  (0, 17)    1

  (1, 14)    1

  ...

  ...

  (6, 17)    2

  (7, 6)     1

  (7, 13)    1

  (7, 8)     1

  (7, 5)     1

  (7, 15)    1

  ```


  特征矩阵传统上以稀疏矩阵形式表示，因为随着每个文档中不同词语成为特征，特征数量会惊人地增加。上述输出展示了每个 (`x`, `y`) 对的计数。其中，`x`代表一个文档，`y`代表一个特定的词语/特征，其值表示`y`在`x`中出现的次数。我们可以利用以下代码以稠密矩阵形式查看输出。


  ```

  # 查看稠密表示形式

  # 注意：如果数据量过大，可能导致内存错误

  cv_matrix = cv_matrix.toarray()

  cv_matrix

  ```


