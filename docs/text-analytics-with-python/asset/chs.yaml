- "# 前言\n\n文本分析和自然语言处理的力量正开始兑现其承诺，这要归功于机器学习领域的当代发展。\n\n如果你读过 Dipanjan Sarkar 的《Python\
  \ 文本分析：从数据中获取可行洞察的实用真实世界方法》一书，那么你可能已经对此有所体会。该书于 2016 年出版，已迅速成为自然语言处理领域的重要读物。然而，在技术领域，两年时间可能像是一辈子，所以欢迎来到更新后的《Python\
  \ 文本分析》第二版！\n\n虽然第一版原始材料的核心内容得以保留，但全书进行了许多更新和修改。值得注意的是，文本分类和情感分析章节已扩展，涵盖了传统机器学习和深度学习模型——随着神经网络在自然语言处理方法中日益核心化，这一点非常重要。此外，主题建模（一种用于抽象主题发现的技巧集合）也得到了进一步发展，增加了许多互补方法，并利用了额外的\
  \ Python 库。\n\n书中还新增了关于特征工程的完整章节——这在自然语言处理和文本数据中扮演着尤为核心的角色——其中涵盖了传统方法和基于神经网络的方法。此外，尽管如今深度学习的讨论常常围绕自然语言处理展开，但明显感觉到这仅仅是开始；为此，又一个全新章节专门探讨了深度学习在自然语言处理领域的潜力。\n\
  \n为什么要选择《Python 文本分析》？本书不仅涵盖了各种前沿文本分析和自然语言处理任务背后的概念与直觉，还详尽地介绍了实用方法和 Python 代码来巩固这些概念，以便读者能够自己应用这些知识。既然\
  \ Sarkar 已经证明了自己在文本分析领域的知识和指导价值，那么审视这本全面扩展和更新的第二版，无疑是一个绝佳的主意。\n\n> ——Matthew Mayo\n\
  > \n> KDnuggets 编辑\n> \n> @mattmayo13\n\n"
- '# 引言


  数据是新时代的石油，而非结构化数据——尤其是文本、图像和视频——蕴含着丰富的信息。然而，由于处理和分析此类数据的内在复杂性，人们常常不愿花费额外的时间和精力从结构化数据集转向分析这些潜在金矿的非结构化数据源。自然语言处理（NLP）就是利用工具、技术和算法来处理和理解基于自然语言的数据（通常是文本、语音等非结构化数据）的学问。在本书中，我们将探讨经过实践检验的策略——即方法和工作流程——从业者和数据科学家可以利用这些策略从文本数据中提取有用的洞察。


  在当今快节奏的世界中，专精于计算机视觉和自然语言处理等领域已不再是奢侈品，而是对任何数据科学家的必然要求！《Python 文本分析》是学习和应用 NLP 技术从嘈杂的非结构化文本数据中提取可行洞察的实践指南。本书帮助读者理解
  NLP 的核心概念，并结合大量案例研究和动手实践示例，掌握最先进的工具、技术和框架，以实际应用 NLP 解决现实问题。我们利用 Python 3 以及最新最好的先进框架，包括
  `NLTK`、`Gensim`、`spaCy`、`Scikit-Learn`、`TextBlob`、`Keras` 和 `TensorFlow`，来展示书中的示例。你可以在
  GitHub 上的 [`https://github.com/dipanjanS/text-analytics-with-python`](https://github.com/dipanjanS/text-analytics-with-python)
  找到本书使用的所有示例。


  在我迄今为止的领域旅程中，我遇到过各种问题，面临过许多挑战，并随着时间的推移学到了很多教训。这本书囊括了我在文本分析和自然语言处理领域获得的大部分知识，在这个领域，仅仅从一堆文本文档中构建一个花哨的词云已远远不够。学习文本分析最大的问题或许不在于信息匮乏，而在于信息过多，这通常被称为*信息过载*。有太多的资源、文档、论文、书籍和期刊包含海量内容，常常让该领域的新人感到无所适从。你可能曾有过这样的疑问：“解决某个问题的正确技术是什么？”，“文本摘要究竟是如何工作的？”，以及“哪些框架最适合解决多类别文本分类问题？”等等！通过将数学和理论概念与使用
  Python 实现真实世界案例研究相结合，本书试图解决这个问题，并帮助读者避免我在至今的旅程中遇到的棘手问题。


  本书采用全面且结构化的方法。首先，在开篇章节中讲解自然语言理解和 Python 处理文本数据的基础知识。一旦你熟悉了基础知识，我们将涵盖文本处理、解析和理解。然后，在后续的每个章节中，我们处理文本分析中有趣的问题，包括文本分类、聚类与相似性分析、文本摘要与主题模型、语义分析与命名实体识别，以及情感分析与模型解释。最后一章是关于深度学习和迁移学习为
  NLP 带来的最新进展的有趣章节，我们涵盖了一个使用通用句子嵌入进行文本分类的示例。


  本书的理念是让你领略文本分析和 NLP 广阔领域的风貌，并为你提供必要的工具、技术和知识来解决你自己的问题。我希望你觉得这本书有所帮助，并祝你在文本分析和 NLP
  的世界之旅中一切顺利！


  '
