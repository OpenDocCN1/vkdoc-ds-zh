  '
- "# 使用 Gensim 进行主题建模\n\nGensim 框架的核心标语是“面向人类主题建模”，这清楚地表明该框架专为主题建模而设计。我们可以利用该框架完成许多令人惊叹的工作，包括文本相似度分析、语义分析、主题建模和文本摘要。此外，与\
  \ Scikit-Learn 相比，Gensim 在构建、评估和调优主题模型方面提供了更多功能和更高的灵活性，我们很快就会看到这一点。在本节中，我们将使用以下方法构建主题模型。\n\
  \n*   潜在语义索引 (LSI)\n*   潜在狄利克雷分配 (LDA)\n\n话不多说，让我们从生成带有影响力二元词组的方法开始，并在特征工程之前删除一些可能无用的术语。\n\
  \n### 基于特征工程的文本表示\n\n在特征工程和向量化之前，我们希望从研究论文中提取一些有用的基于二元词组的短语，并删除一些不必要的术语。为此，我们利用了非常有用的\
  \ `gensim.models.Phrases` 类。此功能有助于我们从句子流中自动检测常见短语，这些短语通常是多词表达/词元组。此实现的灵感源自 Mikolov\
  \ 等人著名的论文《词语和短语的分布式表示及其组合性》，你可以在 [`https://arxiv.org/abs/1310.4546`](https://arxiv.org/abs/1310.4546)\
  \ 查看该论文。我们首先为每一篇经过分词处理的研究论文提取并生成单词和二元词组作为短语。我们可以使用以下代码轻松构建此短语生成模型，并在示例论文上进行测试。\n\
  \n```\nimport gensim\nbigram = gensim.models.Phrases(norm_papers, min_count=20,\
  \ threshold=20, delimiter=b'_') # 阈值越高，短语越少。\nbigram_model = gensim.models.phrases.Phraser(bigram)\n\
  # 示例演示\nprint(bigram_model[norm_papers[0]][:50])\n['scaling', 'property', 'coarse_coded',\
  \ 'symbol', 'memory', 'ronald', 'rosenfeld', 'david_touretzky', 'computer_science',\
  \ 'department', 'carnegie_mellon', 'university_pittsburgh', 'pennsylvania', 'abstract',\
  \ 'coarse_coded', 'symbol', 'memory', 'appeared', 'several', 'neural_network', 'symbol',\
  \ 'processing', 'model', 'order', 'determine', 'model', 'would', 'scale', 'one',\
  \ 'must', 'first', 'understanding', 'mathematics', 'coarse_coded', 'representa_tions',\
  \ 'define', 'general', 'structure', 'coarse_coded', 'symbol', 'memory', 'derive',\
  \ 'mathematical', 'relationship', 'among', 'essential', 'parameter', 'memor', 'size',\
  \ 'lmbol']\n```\n\n我们可以清晰地看到，输出中包含单个单词以及二元词组（由下划线分隔的两个单词），这表明我们的模型运行正常。我们利用了 `min_count`\
  \ 参数，它告诉模型要忽略在整个语料库（以分词句子列表形式输入的论文）中总出现次数低于 20 的所有单词和二元词组。我们还使用了阈值 20，它告诉模型根据此阈值接受特定的短语，因此，如果短语\
  \ `a` 后跟 `b` 的得分大于阈值 20，则该短语被接受。此阈值依赖于评分参数，有助于我们理解这些短语的评分方式，从而了解它们的影响力。\n\n通常使用默认评分器，并且它非常易于理解。你可以在文档\
  \ [`https://radimrehurek.com/gensim/models/phrases.html#gensim.models.phrases.original_scorer`](https://radimrehurek.com/gensim/models/phrases.html#gensim.models.phrases.original_scorer)\
  \ 以及前面提到的研究论文中查看更多详细信息。\n\n让我们为所有分词后的研究论文生成短语，并构建一个词汇表，这将有助于我们将唯一的术语/短语映射到数字编号（因为机器学习或深度学习只能处理数值张量）。\n\
  \n```\nnorm_corpus_bigrams = [bigram_model[doc] for doc in norm_papers]\n# 创建文档的字典表示。\n\
  dictionary = gensim.corpora.Dictionary(norm_corpus_bigrams)\nprint('单词到编号的映射示例：',\
  \ list(dictionary.items())[:15])\nprint('词汇表总大小：', len(dictionary))\n单词到编号的映射示例：\
  \ [(0, '8a'), (1, 'abandon'), (2, 'able'), (3, 'abo'), (4, 'abstract'), (5, 'accommodate'),\
  \ (6, 'accuracy'), (7, 'achieved'), (8, 'acknowledgment_thank'), (9, 'across'),\
  \ (10, 'active'), (11, 'activity'), (12, 'actual'), (13, 'adjusted'), (14, 'adjusting')]\n\
  词汇表总大小： 78892\n```\n\n哇！根据上述输出，我们的研究论文语料库中似乎包含大量独特的短语。其中许多术语用处不大，因为它们特定于某篇论文甚至论文中的某个段落。因此，是时候修剪我们的词汇表并开始删除术语了。利用文档频率是实现这一目标的好方法。到现在，你可能已经意识到，一个术语的文档频率基本上就是该术语在整个语料库所有文档中出现的总次数。\n\
  \n```\n# 过滤掉出现在少于 20 个文档中，或多于 50% 的文档中的词。\ndictionary.filter_extremes(no_below=20,\
  \ no_above=0.6)\nprint('词汇表总大小：', len(dictionary))\n词汇表总大小： 7756\n```\n\n我们删除了所有在整个语料库中出现次数少于\
  \ 20 次以及出现在超过 60% 文档中的所有术语。我们的目标是发现不同的主题和话题，而不是重复出现的主题。因此，这完全符合我们的需求。现在，我们可以通过使用简单的词袋模型来进行特征工程。\n\
  \n```\n# 将语料库转换为词袋向量\nbow_corpus = [dictionary.doc2bow(text) for text in norm_corpus_bigrams]\n\
  print(bow_corpus[1][:50])\n[(4, 1), (14, 2), (20, 1), (28, 1), (33, 1), (43, 1),\
  \ (50, 1), (60, 2), (61, 1), (62, 2), (63, 1), (72, 1), (84, 1), ..., (286, 39),\
  \ (296, 6), (306, 1), (307, 2), (316, 1)]\n# 查看实际的术语及其计数\nprint([(dictionary[idx]\
  \ , freq) for idx, freq in bow_corpus[1][:50]])\n[('achieved', 1), ('allow', 2),\
  \ ('american_institute', 1), ('another', 1), ('appeared', 1), ('argument', 1), ('assume',\
  \ 1), ('become', 2), ('becomes', 1), ('behavior', 2), ('behavioral', 1), ('bounded',\
  \ 1), ('cause', 1), ..., ('group', 39), ('hence', 6), ('implementation', 1), ('implemented',\
  \ 2), ('independent', 1)]\n# 语料库中的论文总数\nprint('论文总数：', len(bow_corpus))\n论文总数： 1740\n\
  ```\n\n我们的文档现已处理完毕，并通过词袋模型获得了足够好的表示形式，可以开始建模了。\n\n### 潜在语义索引\n\n我们的第一种技术是潜在语义索引\
  \ (LSI)，它于 20 世纪 70 年代开发，是一种用于关联语料库中语义相关术语的统计技术。LSI 不仅用于文本摘要，还用于信息检索和搜索。LSI 使用了非常流行的奇异值分解\
  \ (SVD) 技术，我们在“重要概念”部分详细讨论过该技术。LSI 背后的主要原理是，相似的术语往往在相同的上下文中使用，因此共现频率更高。LSI 这个名称来源于该技术能够揭示潜在的、隐藏的、在语义上相互关联以形成主题的术语。\n\
  \n我们现在利用 Gensim 实现 LSI，并从我们的 NIPS 研究论文语料库中提取主题。得益于 Gensim 简洁明了的 API，构建此模型相当简单。\n\
  \n```\n%%time\nTOTAL_TOPICS = 10\nlsi_bow = gensim.models.LsiModel(bow_corpus, id2word=dictionary,\
  \ num_topics=TOTAL_TOPICS, onepass=True, chunksize=1740, power_iters=1000)\nCPU\
  \ times: user 54min 30s, sys: 3min 21s, total: 57min 51s\nWall time: 3min 51s\n\
