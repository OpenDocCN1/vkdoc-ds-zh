  \ JDK 的 `java.exe` 文件的 `JAVA_HOME` 环境变量。\n\n根据我的经验，在从 Python 运行代码时，这两种方法对我都不起作用，我不得不显式使用\
  \ Python 的 `os` 库来设置环境变量，这在之后深入探讨实现细节时会展示。安装 Java 后，从 [`http://nlp.stanford.edu/software/stanford-parser-full-2015-04-20.zip`](http://nlp.stanford.edu/software/stanford-parser-full-2015-04-20.zip)\
  \ 下载官方 Stanford Parser，该版本运行良好。你可以通过访问 [`http://nlp.stanford.edu/software/lex-parser.shtml#Download`](http://nlp.stanford.edu/software/lex-parser.shtml#Download)\
  \ 并查看“发布历史”部分来尝试更新的版本。下载后，将其解压缩到文件系统中的已知位置。完成后，你就可以使用 NLTK 中的解析器了，我们很快就会探索这一点！\n\
  \nGraphviz 并非必需，我们仅用它来查看由 Stanford Parser 生成的依存句法树。你可以从 Graphviz 的官方网站 [`http://www.graphviz.org/Download_windows.php`](http://www.graphviz.org/Download_windows.php)\
  \ 下载并安装它。接下来，你需要安装 `pygraphviz`，你可以根据你的系统架构和 Python 版本从 [`http://www.lfd.uci.edu/~gohlke/pythonlibs/#pygraphviz`](http://www.lfd.uci.edu/%257Egohlke/pythonlibs/#pygraphviz)\
  \ 下载 wheel 文件来获取它。然后，对于运行 Python 3.x 的 64 位系统，使用命令 `pip install pygraphviz-1.3.1-cp34-none-win_amd64.whl`\
  \ 进行安装。安装完成后，`pygraphviz` 即可工作。有些人报告遇到了额外的问题，你可能需要按照相同的顺序，在终端中使用以下代码片段安装 `pydot-ng`\
  \ 和 `graphviz`。\n\n```\npip install pydot-ng\npip install graphviz\n```\n\n我们还利用\
  \ NLTK 的绘图功能在 Jupyter Notebook 中可视化句法树。要启用此功能，如果 NLTK 抛出错误，你可能需要安装 [`ghostscript`](https://www.ghostscript.com/download/gsdnld.html)。安装和设置说明如下所示。\n\
  \n```\n## 从 https://www.ghostscript.com/download/gsdnld.html 下载并安装 ghostscript\n\
  # 通常需要手动添加到路径中（针对 Windows）\nos.environ['PATH'] = os.environ['PATH']+\";C:\\\\Program\
  \ Files\\\\gs\\\\gs9.09\\\\bin\\\\\"\n```\n\n至此，我们已经完成了必要依赖的安装，可以开始实现并查看实际示例了。但我们还不能马上开始。在深入代码和示例之前，我们需要了解一些机器学习的基本概念。\n\
  \n\n\n### 重要的机器学习概念\n\n在接下来的部分，我们将利用语料库并借助现有标注工具，来构建和训练一些我们自己的标注器。有一些与分析和机器学习相关的重要概念，你必须了解它们才能更清晰地理解这些实现过程。\n\
  \n- **数据准备：** 通常包括在提取特征和训练之前对数据进行预处理。\n- **特征提取：** 从原始数据中提取有用特征的过程，这些特征用于训练机器学习模型。\n\
  - **特征：** 数据的各种有用属性（例如，对于个人数据，可以是年龄、体重等）。\n- **训练数据：** 用于训练模型的一组数据点。\n- **测试/验证数据：**\
  \ 用于测试和评估预训练模型性能的一组数据点。\n- **模型：** 通过结合数据/特征与机器学习算法（可以是监督式或非监督式）构建而成。\n- **准确率：**\
  \ 模型预测结果的好坏程度（还有其他详细的评估指标，如精确率、召回率和 `F1-score`）。\n\n这些术语足够让你入门。深入细节超出了当前的范围；不过，如果你有兴趣进一步探索，可以在网上找到大量关于机器学习的资源。如果你希望通过动手实践的方式学习机器学习，我们推荐阅读*《Python\
  \ 机器学习实战》*（Apress 2018 年出版）。此外，我们将在后续章节中介绍与文本数据相关的监督式和非监督式学习。\n\n### 词性标注\n\n词性（POS）是指根据单词的句法上下文和作用分配给它们的特定词汇类别。如果你还记得第\
  \ 1 章的内容，我们曾介绍过一些词性的基础知识，提到了主要的词性包括名词、动词、形容词和副词。对单词进行分类并标注词性标签的过程被称为词性标注（POS tagging）。\n\
  \n词性标签用于注解单词并描述其词性，这在后续基于 NLP 的应用中需要使用相同注解文本时非常有用，因为我们可以按特定词性进行筛选，并利用这些信息执行特定的分析。我们可以缩小名词范围，并确定哪些名词最为突出。以我们之前的例句“The\
  \ brown fox is quick and he is jumping over the lazy dog”为例，如果我们使用基本词性标签对其进行注解，结果将如图\
  \ 3-4 所示。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig4_HTML.jpg](img/427287_2_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n句子的词性标注\n\n因此，一个句子通常遵循由以下组成部分构成的层级结构：句子 → 从句 → 短语 → 单词。\n\n我们将使用宾夕法尼亚树库（Penn\
  \ Treebank）的标记法进行词性标注，大多数推荐的词性标注工具也采用这一标记法。你可以访问 [`http://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/Penn-Treebank-Tagset.pdf`](http://www.cis.uni-muenchen.de/%257Eschmid/tools/TreeTagger/data/Penn-Treebank-Tagset.pdf)\
  \ 了解各种词性标签及其标记法的更多信息，该文档中提供了详细的说明，并用示例解释了每个标签。宾夕法尼亚树库项目是宾夕法尼亚大学的一部分，其网页位于 [`https://catalog.ldc.upenn.edu/docs/LDC95T7/treebank2.index.html`](https://catalog.ldc.upenn.edu/docs/LDC95T7/treebank2.index.html)，可提供有关该项目的更多信息。请记住，有各种不同的标签，例如分配给单词的词性标签（POS\
  \ tags），通常分配给短语的组块标签（chunk tags），以及一些用于描述关系的次要标签。\n\n如果你不想通读宾夕法尼亚树库标签的详细文档，表 3-1\
  \ 提供了不同标签的详细概述及其示例。你可以随时将其作为参考，以便更好地理解词性标签和解析树。\n\n表 3-1\n\n词性标签\n\n| 序号 | **标签**\
  \ | 描述 | **示例** |\n| --- | --- | --- | --- |\n| 1 | `CC` | 并列连词 | and, or |\n| 2\
  \ | `CD` | 基数词 | five, one, 2 |\n| 3 | `DT` | 限定词 | a, the |\n| 4 | `EX` | 存在性 *there*\
  \ | there were two cars |\n| 5 | `FW` | 外来词 | d'hoevre, mais |\n| 6 | `IN` | 介词/从属连词\
  \ | of, in, on, that |\n| 7 | `JJ` | 形容词 | quick, lazy |\n| 8 | `JJR` | 形容词，比较级\
  \ | quicker, lazier |\n| 9 | `JJS` | 形容词，最高级 | quickest, laziest |\n| 10 | `LS`\
  \ | 列表项标记 | 2) |\n| 11 | `MD` | 动词，情态 | could, should |\n| 12 | `NN` | 名词，单数或集合名词\
  \ | fox, dog |\n| 13 | `NNS` | 名词，复数 | foxes, dogs |\n| 14 | `NNP` | 名词，专有单数 | John,\
  \ Alice |\n| 15 | `NNPS` | 名词，专有复数 | Vikings, Indians, Germans |\n| 16 | `PDT` |\
  \ 前位限定词 | both cats |\n| 17 | `POS` | 所有格结尾 | boss's |\n| 18 | `PRP` | 代词，人称 | me,\
  \ you |\n| 19 | `PRP$` | 代词，所有格 | our, my, your |\n| 20 | `RB` | 副词 | naturally,\
  \ extremely, hardly |\n| 21 | `RBR` | 副词，比较级 | better |\n| 22 | `RBS` | 副词，最高级 |\
  \ best |\n| 23 | `RP` | 副词，小品词 | about, up |\n| 24 | `SYM` | 符号 | %, $ |\n| 25 |\
  \ `TO` | 不定式 to | how to, what to do |\n| 26 | `UH` | 感叹词 | oh, gosh, wow |\n| 27\
  \ | `VB` | 动词，原形 | run, give |\n| 28 | `VBD` | 动词，过去式 | ran, gave |\n| 29 | `VBG`\
  \ | 动词，动名词/现在分词 | running, giving |\n| 30 | `VBN` | 动词，过去分词 | given |\n| 31 | `VBP`\
  \ | 动词，非第三人称单数现在时 | I think, I take |\n| 32 | `VBZ` | 动词，第三人称单数现在时 | he thinks,\
  \ he takes |\n| 33 | `WDT` | Wh-限定词 | which, whatever |\n| 34 | `WP` | Wh-代词，人称\
  \ | who, what |\n| 35 | `WP$` | Wh-代词，所有格 | whose |\n| 36 | `WRB` | Wh-副词 | where,\
  \ when |\n| 37 | `NP` | 名词短语 | the brown fox |\n| 38 | `PP` | 介词短语 | in between,\
  \ over the dog |\n| 39 | `VP` | 动词短语 | was jumping |\n| 40 | `ADJP` | 形容词短语 | warm\
  \ and snug |\n| 41 | `ADVP` | 副词短语 | also |\n| 42 | `SBAR` | 从属连词 | whether or not\
  \ |\n| 43 | `PRT` | 小品词 | up |\n| 44 | `INTJ` | 感叹词 | hello |\n| 45 | `PNP` | 介词性名词短语\
  \ | over the dog, as of today |\n| 46 | `-SBJ` | 句子主语 | the fox jumped over the\
  \ dog |\n| 47 | `-OBJ` | 句子宾语 | the fox jumped over the dog |\n\n该表格展示了宾夕法尼亚树库中使用的主要词性标签集，这也是各种文本分析和\
  \ NLP 应用中使用最广泛的词性标签集。在接下来的章节中，我们将探讨一些词性标注的实践实现方法。\n\n\n\n### 构建词性标注器\n\n我们将利用 NLTK\
  \ 和 spaCy，它们均使用 [*宾州树库标注集*](http://www.cis.uni-muenchen.de/~schmid/tools/TreeTagger/data/Penn-Treebank-Tagset.pdf)\
  \ 进行词性标注。为了演示工作原理，我们将使用前几节示例新闻文章中的一个新闻标题。让我们看看如何使用 spaCy 实现词性标注。见图 3-5。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig5_HTML.jpg](img/427287_2_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5 — 使用 spaCy 对新闻标题进行词性标注\n\n```\nsentence = \"US unveils world's most powerful\
  \ supercomputer, beats China.\"\nimport pandas as pd\nimport spacy\nnlp = spacy.load('en_core',\
  \ parse=True, tag=True, entity=True)\nsentence_nlp = nlp(sentence)\n# POS tagging\
  \ with Spacy\nspacy_pos_tagged = [(word, word.tag_, word.pos_) for word in sentence_nlp]\n\
  pd.DataFrame(spacy_pos_tagged, columns=['Word', 'POS tag', 'Tag type']).T\n```\n\
  \n因此，我们可以在图 3-5 中清晰地看到，示例新闻标题中每个标记的词性标注（由 spaCy 定义）完全合乎逻辑。让我们尝试使用 NLTK 完成相同的任务（见图\
  \ 3-6）。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig6_HTML.jpg](img/427287_2_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6 — 使用 NLTK 对新闻标题进行词性标注\n\n```\n# POS tagging with nltk\nimport nltk\nnltk_pos_tagged\
  \ = nltk.pos_tag(nltk.word_tokenize(sentence))\npd.DataFrame(nltk_pos_tagged, columns=['Word',\
  \ 'POS tag']).T\n```\n\n图 3-6 的输出提供了严格遵循宾州树库格式的标签，更详细地指定了形容词、名词或动词的具体形式。\n\n现在，我们将探索一些构建自定义词性标注器的技巧！我们将利用\
  \ NLTK 提供的一些类。为了评估我们标注器的性能，我们将使用 NLTK 中 `treebank` 语料库的一些测试数据。我们还将使用一些训练数据来训练部分标注器。首先，我们需要通过读取已标注的\
  \ `treebank` 语料库，获取训练和评估标注器所需的数据。\n\n```\nfrom nltk.corpus import treebank\ndata\
  \ = treebank.tagged_sents()\ntrain_data = data[:3500]\ntest_data = data[3500:]\n\
  print(train_data[0])\n[('Pierre', 'NNP'), ('Vinken', 'NNP'), (',', ','), ('61',\
  \ 'CD'), ('years', 'NNS'), ('old', 'JJ'), (',', ','), ('will', 'MD'), ('join', 'VB'),\
  \ ('the', 'DT'), ('board', 'NN'), ('as', 'IN'), ('a', 'DT'), ('nonexecutive', 'JJ'),\
  \ ('director', 'NN'), ('Nov.', 'NNP'), ('29', 'CD'), ('.', '.')]\n```\n\n我们将使用测试数据来评估标注器，并通过使用示例句子的标记作为输入，观察它们在该句子上的表现。我们将从\
  \ NLTK 中使用的所有标注器都属于 `nltk.tag` 包。每个标注器都是基类 `TaggerI` 的子类，并且每个标注器都实现了一个 `tag()` 函数，该函数接收一个句子标记列表作为输入，并返回相同的单词列表及其词性标注作为输出。除了标注之外，还有一个\
  \ `evaluate()` 函数，用于评估标注器的性能。其做法是：对每个输入测试句子进行标注，然后将结果与句子的实际标签进行比较。我们将使用相同的函数来测试我们的标注器在\
  \ `test_data` 上的性能。\n\n我们将首先了解 `DefaultTagger`，它继承自 `SequentialBackoffTagger` 基类，并为每个单词分配相同的用户输入词性标签。这看起来可能非常简单，但这是构建基准词性标注器并在此基础上进行改进的绝佳方法。\n\
  \n```\n# default tagger\nfrom nltk.tag import DefaultTagger\ndt = DefaultTagger('NN')\n\
  # accuracy on test data\ndt.evaluate(test_data)\n0.1454158195372253\n# tagging our\
  \ sample headline\ndt.tag(nltk.word_tokenize(sentence))\n[('US', 'NN'), ('unveils',\
  \ 'NN'), ('world', 'NN'), (\"'s\", 'NN'), ('most', 'NN'),\n('powerful', 'NN'), ('supercomputer',\
  \ 'NN'), (',', 'NN'), ('beats', 'NN'),\n('China', 'NN'), ('.', 'NN')]\n```\n\n从该输出中可以看出，我们在正确标注\
  \ treebank 测试数据集的单词方面获得了 14% 的准确率，这并不高。我们示例句子的输出标签都是名词，正如我们所料，因为我们向标注器提供了相同的标签。现在我们将使用正则表达式和\
  \ `RegexpTagger`，看看是否能够构建一个性能更好的标注器。\n\n```\n# regex tagger\nfrom nltk.tag import\
  \ RegexpTagger\n# define regex tag patterns\npatterns = [\n(r'.*ing$', 'VBG'), \
  \              # gerunds\n(r'.*ed$', 'VBD'),                # simple past\n(r'.*es$',\
  \ 'VBZ'),                # 3rd singular present\n(r'.*ould$', 'MD'),           \
  \    # modals\n(r'.*\\'s$', 'NN$'),               # possessive nouns\n(r'.*s$',\
  \ 'NNS'),                 # plural nouns\n(r'^-?[0-9]+(.[0-9]+)?$', 'CD'),  # cardinal\
  \ numbers\n(r'.*', 'NN')                     # nouns (default) ...\n]\nrt = RegexpTagger(patterns)\n\
  # accuracy on test data\nrt.evaluate(test_data)\n0.24039113176493368\n# tagging\
  \ our sample headline\nrt.tag(nltk.word_tokenize(sentence))\n[('US', 'NN'), ('unveils',\
  \ 'NNS'), ('world', 'NN'), (\"'s\", 'NN$'), ('most', 'NN'),\n('powerful', 'NN'),\
  \ ('supercomputer', 'NN'), (',', 'NN'), ('beats', 'NNS'),\n('China', 'NN'), ('.',\
  \ 'NN')]\n```\n\n此输出显示准确率已提升至 24%，但我们能否做得更好？现在我们将训练一些 n-gram 标注器。如果你还不知道，n-gram\
  \ 是指来自文本或语音序列中连续的 **n** 个项目序列。这些项目可以包含单词、音素、字母、字符或音节。Shingles 是指项目仅包含单词的 n-gram。我们将使用大小为\
  \ 1、2 和 3 的 n-gram，它们分别被称为一元模型（unigram）、二元模型（bigram）和三元模型（trigram）。`UnigramTagger`、`BigramTagger`\
  \ 和 `TrigramTagger` 类继承自基类 `NGramTagger`，而 `NGramTagger` 本身继承自 `ContextTagger` 类，`ContextTagger`\
  \ 又继承自 `SequentialBackoffTagger` 类。我们将使用 `train_data` 作为训练数据，基于句子标记及其词性标注来训练 n-gram\
  \ 标注器。然后，我们将在 `test_data` 上评估训练好的标注器，并查看它们在标注示例句子时的结果。\n\n```\n## N gram taggers\n\
  from nltk.tag import UnigramTagger\nfrom nltk.tag import BigramTagger\nfrom nltk.tag\
  \ import TrigramTagger\nut = UnigramTagger(train_data)\nbt = BigramTagger(train_data)\n\
  tt = TrigramTagger(train_data)\n# testing performance of unigram tagger\nprint(ut.evaluate(test_data))\n\
  print(ut.tag(nltk.word_tokenize(sentence)))\n0.8619421047536063\n[('US', 'NNP'),\
  \ ('unveils', None), ('world', 'NN'), (\"'s\", 'POS'), ('most', 'JJS'), ('powerful',\
  \ 'JJ'), ('supercomputer', 'NN'), (',', ','), ('beats', None), ('China', 'NNP'),\
  \ ('.', '.')]\n# testing performance of bigram tagger\nprint(bt.evaluate(test_data))\n\
  print(bt.tag(nltk.word_tokenize(sentence)))\n0.1359279697937845\n[('US', None),\
  \ ('unveils', None), ('world', None), (\"'s\", None), ('most', None), ('powerful',\
  \ None), ('supercomputer', None), (',', None), ('beats', None), ('China', None),\
  \ ('.', None)]\n# testing performance of trigram tagger\nprint(tt.evaluate(test_data))\n\
  print(tt.tag(nltk.word_tokenize(sentence)))\n0.08142124116565011\n[('US', None),\
  \ ('unveils', None), ('world', None), (\"'s\", None), ('most', None), ('powerful',\
  \ None), ('supercomputer', None), (',', None), ('beats', None), ('China', None),\
  \ ('.', None)]\n```\n\n\n\n这个输出清晰地表明，仅使用一元标注器，我们在测试集上就获得了 86% 的准确率，与我们上一个标注器相比，这个结果非常出色。`None`\
  \ 标签表示标注器无法标注该单词，其原因是它无法在训练数据中找到相似的词元。二元和三元模型的准确率要低得多，因为训练数据中观察到的相同的二元和三元组，在测试数据中并不总是以相同的方式出现。\n\
  \n现在我们来看一种通过创建一个包含标注器列表的组合标注器并结合所有标注器的方法，并使用一个回退标注器。本质上，我们会创建一个标注器链，如果某个标注器无法标注输入的词元，它就会回退到下一个标注器。\n\
  \n```\ndef combined_tagger(train_data, taggers, backoff=None):\nfor tagger in taggers:\n\
  backoff = tagger(train_data, backoff=backoff)\nreturn backoff\nct = combined_tagger(train_data=train_data,\n\
  taggers=[UnigramTagger, BigramTagger, TrigramTagger],\nbackoff=rt)\n# 评估带有回退标注器的新组合标注器\n\
  print(ct.evaluate(test_data))\nprint(ct.tag(nltk.word_tokenize(sentence)))\n0.9108335753703166\n\
  [('US', 'NNP'), ('unveils', 'NNS'), ('world', 'NN'), (\"'s\", 'POS'), ('most', 'JJS'),\
  \ ('powerful', 'JJ'), ('supercomputer', 'NN'), (',', ','), ('beats', 'NNS'), ('China',\
  \ 'NNP'), ('.', '.')]\n```\n\n现在我们在测试数据上获得了 91% 的准确率，这非常棒。此外，我们看到这个新的标注器能够成功标注我们示例句子中的所有词元（尽管其中几个不正确，比如\
  \ `beats` 应该是一个动词）。\n\n对于我们的最终标注器，我们将使用有监督分类算法来训练它。`ClassifierBasedPOSTagger` 类使我们能够通过\
  \ `classifier_builder` 参数使用有监督学习算法来训练标注器。该类继承自 `ClassifierBasedTagger`，并拥有一个 `feature_detector()`\
  \ 函数，该函数构成了训练过程的核心。这个函数用于从训练数据中生成各种特征，例如单词、前一个单词、标签、前一个标签、大小写等等。事实上，你甚至可以构建自己的特征检测器函数，并在实例化\
  \ `ClassifierBasedPOSTagger` 类的对象时，将其传递给 `feature_detector` 参数。\n\n我们将要使用的分类器是 `NaiveBayesClassifier`。它利用贝叶斯定理构建了一个概率分类器，并假设特征之间是独立的。你可以在\
  \ [`https://en.wikipedia.org/wiki/Naive_Bayes_classifier`](https://en.wikipedia.org/wiki/Naive_Bayes_classifier)\
  \ 了解更多相关信息，因为深入探讨该算法的细节超出了我们当前的范围。以下代码片段展示了一种基于分类的方法来构建和评估词性标注器。\n\n```\nfrom nltk.classify\
  \ import NaiveBayesClassifier, MaxentClassifier\nfrom nltk.tag.sequential import\
  \ ClassifierBasedPOSTagger\nnbt = ClassifierBasedPOSTagger(train=train_data,\nclassifier_builder=NaiveBayesClassifier.train)\n\
  # 在测试数据和示例句子上评估标注器\nprint(nbt.evaluate(test_data))\nprint(nbt.tag(nltk.word_tokenize(sentence)))\n\
  0.9306806079969019\n[('US', 'PRP'), ('unveils', 'VBZ'), ('world', 'VBN'), (\"'s\"\
  , 'POS'), ('most', 'JJS'), ('powerful', 'JJ'), ('supercomputer', 'NN'), (',', ','),\
  \ ('beats', 'VBZ'), ('China', 'NNP'), ('.', '.')]\n```\n\n使用这个标注器，我们在测试数据上获得了 93%\
  \ 的准确率，这是我们所有标注器中最高的。此外，如果你观察示例句子的输出标签，你会发现它们是正确的，并且完全合乎逻辑。这让我们了解到基于分类器的词性标注器可以多么强大和有效！你可以随意使用像\
  \ `MaxentClassifier` 这样的不同分类器，并与这个标注器的性能进行比较。我们在笔记本中包含了代码，以便操作更简单。\n\n使用 NLTK 和其他包，还有许多其他方法来构建和使用词性标注器。尽管并非必需，并且这些内容应该足以满足你的词性标注需求，但你也可以继续探索其他方法，与这些方法进行比较，以满足你的好奇心。\n\
  \n## 浅层解析或组块分析\n\n*浅层解析*，也称为*轻量解析*或*组块分析*，是一种分析句子结构的技术，旨在将句子分解成最小的组成部分（如单词等词元），并将它们组合成更高级别的短语。在浅层解析中，重点更多地放在识别这些短语或组块上，而不是深入探讨每个组块内部的语法结构和关系，就像我们在通过深层解析获得的基于语法的解析树中看到的那样。浅层解析的主要目标是获取具有语义意义的短语，并观察它们之间的关系。\n\
  \n你可以查看第 1 章的“语言语法和结构”部分，以重新了解单词和短语如何为包含一组单词的句子构建结构。基于我们之前描述的层次结构，单词组构成了短语。短语有五大主要类别：\n\
  \n- **名词短语（NP）：** 这些短语中，名词作为中心词。名词短语充当动词的主语或宾语。\n\n- **动词短语（VP）：** 这些短语是词汇单元，其中动词作为中心词。通常，动词短语有两种形式。一种形式包含动词成分以及作为宾语一部分的其他实体，如名词、形容词或副词。\n\
  \n- **形容词短语（ADJP）：** 这些短语以形容词作为中心词。它们的主要作用是描述或限定句子中的名词和代词，并且它们会放在名词或代词的前面或后面。\n\n\
  - **副词短语（ADVP）：** 这些短语的作用类似于副词，因为副词在其中作为中心词。副词短语用作名词、动词或副词的修饰语，提供进一步描述或限定它们的细节。\n\
  \n- **介词短语（PP）：** 这些短语通常包含一个介词作为中心词，以及其他词汇成分，如名词、代词等。它们的作用类似于形容词或副词，用于描述其他单词或短语。\n\
  \n图 3-7 展示了一个示例句子的浅层解析树，以帮助你重新回忆其结构。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig7_HTML.jpg](img/427287_2_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7\n\n一个浅层解析的示例，展示了更高层次的短语标注\n\n现在，我们将探讨如何利用多种技术对文本数据实施浅层解析，包括正则表达式、组块化、去组块化和基于标签的训练。\n\
  \n\n\n#### 构建浅层解析器\n\n我们使用正则表达式和基于标注的学习者等多种技术来构建自己的浅层解析器。与词性标注类似，如果需要，我们会使用一些训练数据来训练解析器，并在一些测试数据和示例句子上评估所有解析器的性能。NLTK\
  \ 中的`treebank`语料库包含组块标注。我们加载该语料库，然后使用以下代码片段准备训练和测试数据集。\n\n```python\nfrom nltk.corpus\
  \ import treebank_chunk\ndata = treebank_chunk.chunked_sents()\ntrain_data = data[:3500]\n\
  test_data = data[3500:]\n# view sample data\nprint(train_data[7])\n(S\n(NP A/DT\
  \ Lorillard/NNP spokewoman/NN)\nsaid/VBD\n,/,\n``/``\n(NP This/DT)\nis/VBZ\n(NP\
  \ an/DT old/JJ story/NN)\n./.)\n```\n\n从这个输出可以看出，我们的数据点是句子，并且已经用短语和词性标注元数据进行了标注，这些元数据在训练浅层解析器时非常有用。我们首先使用组块和去块的概念，通过正则表达式进行浅层解析。使用*组块*过程，我们可以指定特定的模式来识别我们想要在句子中组块或分割的内容，例如基于特定元数据的短语。*去块*是组块的逆过程，我们指定哪些特定的词元不希望成为任何组块的一部分，然后排除这些词元形成必要的组块。让我们考虑一个简单的句子（我们的新闻标题）并使用正则表达式。我们利用`RegexpParser`类来创建浅层解析器，以说明名词短语的组块和去块。\n\
  \n```python\nfrom nltk.chunk import RegexpParser\n# get POS tagged sentence\ntagged_simple_sent\
  \ = nltk.pos_tag(nltk.word_tokenize(sentence))\nprint('POS Tags:', tagged_simple_sent)\n\
  # illustrate NP chunking based on explicit chunk patterns\nchunk_grammar = \"\"\"\
  \nNP: {<DT|NN|NNP|JJ>*<NN>}\n\"\"\"\nrc = RegexpParser(chunk_grammar)\nc = rc.parse(tagged_simple_sent)\n\
  # print and view chunked sentence using chunking\nprint(c)\nc\n(S\n(NP US/NNP)\n\
  (NP unveils/JJ world/NN)\n's/POS\nmost/RBS\n(NP powerful/JJ supercomputer/NN)\n\
  ,/,\nbeats/VBZ\n(NP China/NNP)\n./.)\n```\n\n我们可以看到浅层解析树在图 3-8 中的样子，它仅使用组块来识别名词短语。现在让我们看看如何使用去块来构建它。\n\
  \n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig8_HTML.jpg](img/427287_2_En_3_Fig8_HTML.jpg)\n\
  \n**图 3-8** – 使用组块的浅层解析\n\n```python\n# illustrate NP chunking based on explicit\
  \ chink patterns\nchink_grammar = \"\"\"\nNP:\n{<.*>+}             # Chunk everything\
  \ as NP\n}<VBD|VBZ|JJ|IN>+{  # Chink sequences of VBD\\VBZ\\JJ\\IN\n\"\"\"\nrc =\
  \ RegexpParser(chink_grammar)\nc = rc.parse(tagged_simple_sent)\n# print and view\
  \ chunked sentence using chinking\nprint(c)\nc\n(S\n(NP US/NNP)\nunveils/JJ\n(NP\
  \ world/NN 's/POS most/RBS)\npowerful/JJ\n(NP supercomputer/NN ,/,)\nbeats/VBZ\n\
  (NP China/NNP ./.))\n```\n\n我们可以看到浅层解析树在图 3-9 中的样子，动词和形容词形成了去块区域，并将名词短语分隔开来。请记住，*组块*是包含在一个集体组（块）中的词元序列，而*去块*是从组块中排除的词元或词元序列。现在我们将训练一个更通用的基于正则表达式的浅层解析器，并在我们的测试`treebank`数据上测试其性能。在内部执行此解析需要执行几个步骤。NLTK\
  \ 中用于表示解析后句子的`Tree`结构会被转换为`ChunkString`对象。我们使用定义的组块和去块规则创建一个`RegexpParser`对象。`ChunkRule`和`ChinkRule`类的对象有助于基于指定的模式，使用必要的组块创建完整的浅层解析树。以下代码片段表示一个使用基于正则表达式模式的浅层解析器。\n\
  \n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig9_HTML.jpg](img/427287_2_En_3_Fig9_HTML.jpg)\n\
  \n**图 3-9** – 使用去块的浅层解析\n\n```python\n# create a more generic shallow parser\ngrammar\
  \ = \"\"\"\nNP: {<DT|NN|NNP|JJ>*<NN>}\nADJP: {<JJ|JJS|JJR>}\nADVP: {<RB|RBR|RBS>}\n\
  PP: {<IN>}\nVP: {<MD|VB|VBD|VBG|VBN|VBZ|VBP>+}\n\"\"\"\nrc = RegexpParser(grammar)\n\
  c = rc.parse(tagged_simple_sent)\n# print and view shallow parsed sample sentence\n\
  print(c)\nc\n(S\n(NP US/NNP)\n(NP unveils/JJ world/NN)\n's/POS\n(ADVP most/RBS)\n\
  (NP powerful/JJ supercomputer/NN)\n,/,\n(VP beats/VBZ)\n(NP China/NNP)\n./.)\n```\n\
  \n我们可以看到浅层解析树在图 3-10 中的样子，它对特定短语使用了更具体的规则。让我们看看这个解析器在我们之前构建的测试数据集上的表现如何。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig10_HTML.jpg](img/427287_2_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10** – 使用更具体规则的浅层解析\n\n```python\n# Evaluate parser performance on test\
  \ data\nprint(rc.evaluate(test_data))\nChunkParse score:\nIOB Accuracy:  46.1%%\n\
  Precision:     19.9%%\nRecall:        43.3%%\nF-Measure:     27.3%%\n```\n\n从输出中可以看出，我们示例句子的解析树与上一节中从即用型解析器获得的解析树非常相似。此外，整体测试数据的准确率为\
  \ 54.5%，对于一个开始来说已经相当不错了。要了解每个性能指标的具体含义，可以参考第 5 章中的“评估分类模型”部分。\n\n还记得我们说过文本的标注元数据在许多方面都很有用吗？现在我们使用带有组块和标注的`treebank`训练数据来构建一个浅层解析器。我们利用两个组块工具函数——`tree2conlltags`来获取每个词元的词、词性标签和组块标签三元组，以及`conlltags2tree`来从这些词元三元组生成解析树。\n\
  \n稍后我们将使用这些函数来训练我们的解析器。首先，让我们看看这两个函数是如何工作的。请记住，组块标签使用一种流行的格式，即 IOB 格式。在这种格式中，你会注意到一些带有`I`、`O`和`B`前缀的新符号，这是组块中流行的\
  \ IOB 符号。它表示内部（Inside）、外部（Outside）和开始（Beginning）。标签前的`B-`前缀表示这是组块的开始；`I-`前缀表示它在组块内部。`O`标签表示该词元不属于任何组块。当后面有相同类型的后续标签，且它们之间没有`O`标签时，总是使用`B-`标签。\n\
  \n```python\nfrom nltk.chunk.util import tree2conlltags, conlltags2tree\n# look\
  \ at a sample training tagged sentence\ntrain_sent = train_data[7]\nprint(train_sent)\n\
  (S\n(NP A/DT Lorillard/NNP spokewoman/NN)\nsaid/VBD\n,/,\n``/``\n(NP This/DT)\n\
  is/VBZ\n(NP an/DT old/JJ story/NN)\n./.)\n# get the (word, POS tag, Chunk tag) triples\
  \ for each token\nwtc = tree2conlltags(train_sent)\nwtc\n[('A', 'DT', 'B-NP'),\n\
  ('Lorillard', 'NNP', 'I-NP'),\n('spokewoman', 'NN', 'I-NP'),\n('said', 'VBD', 'O'),\n\
  (',', ',', 'O'),\n('``', '``', 'O'),\n('This', 'DT', 'B-NP'),\n('is', 'VBZ', 'O'),\n\
  ('an', 'DT', 'B-NP'),\n('old', 'JJ', 'I-NP'),\n('story', 'NN', 'I-NP'),\n('.', '.',\
  \ 'O')]\n# get shallow parsed tree back from the WTC triples\ntree = conlltags2tree(wtc)\n\
  print(tree)\n(S\n(NP A/DT Lorillard/NNP spokewoman/NN)\nsaid/VBD\n,/,\n``/``\n(NP\
  \ This/DT)\nis/VBZ\n(NP an/DT old/JJ story/NN)\n./.)\n```\n\n现在我们知道了这些函数的工作原理，我们定义一个名为`conll_tag_chunks()`的函数来从带有组块标注的句子中提取词性标签和组块标签，并复用词性标注中的`combined_taggers()`函数来训练多个具有回退标注器的标注器，如下面的代码片段所示。\n\
  \n```python\ndef conll_tag_chunks(chunk_sents):\n    tagged_sents = [tree2conlltags(tree)\
  \ for tree in chunk_sents]\n    return [[(t, c) for (w, t, c) in sent] for sent\
  \ in tagged_sents]\n\ndef combined_tagger(train_data, taggers, backoff=None):\n\
  \    for tagger in taggers:\n        backoff = tagger(train_data, backoff=backoff)\n\
  \    return backoff\n```\n\n\n\n现在我们定义一个 `NGramTagChunker` 类，该类将以带有词性标注的句子作为训练输入，提取其\
  \ WTC 三元组（单词、词性标签、组块标签），并使用 `UnigramTagger` 作为后备标注器来训练一个 `BigramTagger`。我们还定义了一个\
  \ `parse()` 函数，用于对新句子执行浅层句法分析（shallow parsing）。\n\n```\nfrom nltk.tag import UnigramTagger,\
  \ BigramTagger\nfrom nltk.chunk import ChunkParserI\nclass NGramTagChunker(ChunkParserI):\n\
  def __init__(self, train_sentences,\ntagger_classes=[UnigramTagger, BigramTagger]):\n\
  train_sent_tags = conll_tag_chunks(train_sentences)\nself.chunk_tagger = combined_tagger(train_sent_tags,\
  \ tagger_classes)\ndef parse(self, tagged_sentence):\nif not tagged_sentence:\n\
  return None\npos_tags = [tag for word, tag in tagged_sentence]\nchunk_pos_tags =\
  \ self.chunk_tagger.tag(pos_tags)\nchunk_tags = [chunk_tag for (pos_tag, chunk_tag)\
  \ in chunk_pos_tags]\nwpc_tags = [(word, pos_tag, chunk_tag) for ((word, pos_tag),\
  \ chunk_tag)\nin zip(tagged_sentence, chunk_tags)]\nreturn conlltags2tree(wpc_tags)\n\
  ```\n\n在这个类中，构造函数 `__init__()` 用于基于每个句子的 WTC 三元组，通过 n-gram 标注来训练浅层句法分析器。其内部接收一个带有组块解析树元数据注释的训练句子列表作为输入。它使用我们之前定义的\
  \ `conll_tag_chunks()` 函数，从每个组块解析树中获取一个 WTC 三元组列表。最后，它利用这些三元组训练一个以 `UnigramTagger`\
  \ 作为后备标注器的 `BigramTagger`，并将训练模型存储在 `self.chunk_tagger` 中。\n\n请记住，你可以通过使用 `tagger_classes`\
  \ 参数来解析其他基于 n-gram 的标注器进行训练。训练完成后，`parse()` 函数可用于在测试数据上评估标注器的性能，并对新句子进行浅层句法分析。其内部接收一个带有词性标注的句子作为输入，从句子中分离出词性标签，然后使用我们训练好的\
  \ `self.chunk_tagger` 获取该句子的 IOB 组块标签。接着，将这些标签与原始句子标记结合，并使用 `conlltags2tree()` 函数得到最终的浅层句法分析树。下面的代码片段展示了我们的分析器运行效果。见图\
  \ 3-11。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig11_HTML.jpg](img/427287_2_En_3_Fig11_HTML.jpg)\n\
  \n**图 3-11** 基于 n-gram 组块划分对树库数据进行浅层句法分析的新闻标题\n\n```\n# 训练浅层句法分析器\nntc = NGramTagChunker(train_data)\n\
  # 在测试数据上测试分析器性能\nprint(ntc.evaluate(test_data))\nChunkParse score:\nIOB Accuracy:\
  \  97.2%%\nPrecision:     91.4%%\nRecall:        94.3%%\nF-Measure:     92.8%%\n\
  # 解析我们的示例句子\nsentence_nlp = nlp(sentence)\ntagged_sentence = [(word.text, word.tag_)\
  \ for word in sentence_nlp]\ntree = ntc.parse(tagged_sentence)\nprint(tree)\ntree\n\
  (S\n(NP US/NNP)\nunveils/VBZ\n(NP world/NN 's/POS most/RBS powerful/JJ supercomputer/NN)\n\
  ,/,\nbeats/VBZ\n(NP China/NNP)\n./.)\n```\n\n这个输出展示了我们的分析器在树库测试集数据上的性能，总体准确率达到了\
  \ 99.6%，非常出色！图 3-11 也向我们展示了示例新闻标题的解析树形态。\n\n现在，让我们在 `conll2000` 语料库上训练并评估我们的分析器。该语料库包含来自《华尔街日报》的摘录，是一个规模大得多的语料库。我们将在前\
  \ 10,000 个句子上训练分析器，并在剩余的 940 多个句子上测试其性能。下面的代码片段描述了这一过程。\n\n```\nfrom nltk.corpus\
  \ import conll2000\nwsj_data = conll2000.chunked_sents()\ntrain_wsj_data = wsj_data[:10000]\n\
  test_wsj_data = wsj_data[10000:]\n# 查看语料库中的一个示例句子\nprint(train_wsj_data[10])\n(S\n\
  (NP He/PRP)\n(VP reckons/VBZ)\n(NP the/DT current/JJ account/NN deficit/NN)\n(VP\
  \ will/MD narrow/VB)\n(PP to/TO)\n(NP only/RB #/# 1.8/CD billion/CD)\n(PP in/IN)\n\
  (NP September/NNP)\n./.)\n# 训练浅层句法分析器\ntc = NGramTagChunker(train_wsj_data)\n# 在测试数据上测试性能\n\
  print(tc.evaluate(test_wsj_data))\nChunkParse score:\nIOB Accuracy:  89.1%%\nPrecision:\
  \     80.3%%\nRecall:        86.1%%\nF-Measure:     83.1%%\n```\n\n这个输出显示，我们的分析器实现了约\
  \ 89% 的总体准确率，考虑到这个语料库比 `treebank` 语料库大得多，这个结果已经相当不错了。让我们看看它如何对我们的示例新闻标题进行组块划分。\n\
  \n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig12_HTML.jpg](img/427287_2_En_3_Fig12_HTML.jpg)\n\
  \n**图 3-12** 基于 n-gram 组块划分对 `conll2000` 数据进行浅层句法分析的新闻标题\n\n```\n# 解析我们的示例句子\ntree\
  \ = tc.parse(tagged_sentence)\nprint(tree)\ntree\n(S\n(NP US/NNP)\n(VP unveils/VBZ)\n\
  (NP world/NN)\n(NP 's/POS most/RBS powerful/JJ supercomputer/NN)\n,/,\n(VP beats/VBZ)\n\
  (NP China/NNP)\n./.)\n```\n\n图 3-12 向我们展示了示例新闻标题的解析树形态。与之前的解析树相比，此处定义了更明确的动词短语。你还可以考虑利用\
  \ `ClassifierBasedTagger` 类，通过其他技术（如监督式分类器）来实现浅层句法分析器。\n\n\n\n### 依存句法分析\n\n在基于依存句法的分析中，我们尝试使用依存语法来分析和推断句子中词元之间的结构关系、语义依存关系以及关联。请参考第\
  \ 1 章“语言句法与结构”部分中“语法”下的“依存语法”小节，以加深记忆。依存语法帮助我们为句子标注依存标签，这些标签是词元之间的一一对应关系，用以表示它们之间的依存性。基于依存语法的句法树表示，更精确地说，是一个带标签的有向树或图。节点始终是词汇词元，而有标签的边则描述了核心词与其从属词之间的依存关系。边上的标签指明了从属词的语法角色。\n\
  \n依存语法的基本原则是：在语言的任何句子中，除了一个词之外，其他所有词都与句子中的其他词存在某种关系或依存性。那个没有依存关系的词被称为句子的*根*。在大多数情况下，动词被视为句子的根。所有其他词都通过表示依存关系的链接直接或间接地与根动词相连。如果我们想为句子“The\
  \ brown fox is quick and he is jumping over the lazy dog”绘制依存句法树，我们将得到如图 3-13 所示的结构。\n\
  \n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig13_HTML.jpg](img/427287_2_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\n一个示例句子的依存句法树\n\n这些依存关系各自具有特定含义，并且是通用依存类型列表的一部分。这方面在一篇题为“[Universal Stanford\
  \ Dependencies: A Cross-Linguistic Typology](https://nlp.stanford.edu/pubs/USD_LREC14_paper_camera_ready.pdf)”的原始论文[作者：de\
  \ Marneffe 等人，2014](https://nlp.stanford.edu/pubs/USD_LREC14_paper_camera_ready.pdf)中有所讨论。您可以在[`http://universaldependencies.org/u/dep/index.html`](http://universaldependencies.org/u/dep/index.html)查看依存类型及其含义的详尽列表。为了加深记忆，我们观察一些依存类型，理解它们并不难。\n\
  \n-   依存标签 `det` 很直观——它表示名词性核心词与限定词之间的限定关系。通常，带有 `POS` 标签 `DET` 的词也会具有 `det` 依存标签关系。示例包括\
  \ `fox → the` 和 `dog → the`。\n-   依存标签 `amod` 代表形容词修饰语，表示任何修饰名词含义的形容词。示例包括 `fox\
  \ → brown` 和 `dog → lazy`。\n-   依存标签 `nsubj` 代表充当小句主语或施动者的实体。示例包括 `is → fox` 和 `jumping\
  \ → he`。\n-   依存关系 `cc` 和 `conj` 更多与并列连词连接的词之间的关联有关。示例包括 `is → and` 和 `is → jumping`。\n\
  -   依存标签 `aux` 表示小句中的助动词或次要动词。示例：`jumping → is`。\n-   依存标签 `acomp` 代表形容词补足语，充当句子中动词的补足语或宾语。示例：`is\
  \ → quick`。\n-   依存标签 `prep` 表示介词修饰语，通常修饰名词、动词、形容词或介词的含义。通常，这种表示用于具有名词或名词短语补足语的介词。示例：`jumping\
  \ → over`。\n-   依存标签 `pobj` 用于表示介词的宾语。这通常是句子中介词后名词短语的核心词。示例：`over → dog`。\n\n让我们看看构建依存句法分析器来解析非结构化文本的一些方法！\n\
  \n### 构建依存句法分析器\n\n我们将使用包括 NLTK 和 spaCy 在内的几个最先进的库，来生成基于依存句法的句法树，并在我们的示例新闻标题上进行测试。*SpaCy*\
  \ 根据您使用的语言模型，有两种类型的英语依存句法分析器。您可以在 [`https://spacy.io/api/annotation#section-dependency-parsing`](https://spacy.io/api/annotation#section-dependency-parsing)\
  \ 找到更多详细信息。基于语言模型，您可以使用[通用依存方案](http://universaldependencies.org/u/dep/index.html)或\
  \ [CLEAR 风格依存方案](http://www.mathcs.emory.edu/~choi/doc/cu-2012-choi.pdf)，后者现在也可以在\
  \ [NLP4J](https://emorynlp.github.io/nlp4j/components/dependency-parsing.html) 中使用。我们现在利用\
  \ spaCy 并打印新闻标题中每个词元的依存关系。\n\n```\ndependency_pattern = '{left}{right}\\n--------'\n\
  for token in sentence_nlp:\nprint(dependency_pattern.format(word=token.orth_,\n\
  w_type=token.dep_,\nleft=[t.orth_\nfor t\nin token.lefts],\nright=[t.orth_\nfor\
  \ t\nin token.rights]))\n[][]\n\n['US']['supercomputer', ',', 'beats', '.']\n\n\
  [][\"'s\"]\n\n[][]\n\n[][]\n\n['most'][]\n\n['world', 'powerful'][]\n\n[][]\n\n\
  []['China']\n\n[][]\n\n[][]\n```\n\n此输出为我们提供了每个词元及其依存类型。左箭头指向其左侧的依存关系，右箭头指向其右侧的依存关系。很明显，动词\
  \ `beats` 是根，因为它与其他词元相比没有其他依存关系。要了解每个标注的更多信息，您可以随时参考 [`https://emorynlp.github.io/nlp4j/components/dependency-parsing.html`](https://emorynlp.github.io/nlp4j/components/dependency-parsing.html)\
  \ 上的 CLEAR 依存方案。我们还可以使用以下代码以更好的方式可视化这些依存关系。见图 3-14。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig14_HTML.jpg](img/427287_2_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\n使用 spaCy 可视化我们的新闻标题依存树\n\n```\nfrom spacy import displacy\ndisplacy.render(sentence_nlp,\
  \ jupyter=True,\noptions={'distance': 110,\n'arrow_stroke': 2,\n'arrow_width': 8})\n\
  ```\n\n您还可以利用 NLTK 和 Stanford Dependency Parser 来可视化和构建依存树。我们以原始形式和带注释形式展示依存树。我们首先构建带注释的依存树，并使用\
  \ Graphviz 显示它。见图 3-15。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig15_HTML.jpg](img/427287_2_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\n使用 NLTK 和 Stanford Dependency Parser 可视化我们带注释的新闻标题依存树\n\n```\nfrom nltk.parse.stanford\
  \ import StanfordDependencyParser\nsdp = StanfordDependencyParser(path_to_jar='E:/stanford/stanford-parser-full-2015-04-20/stanford-parser.jar',\
  \ path_to_models_jar='E:/stanford/stanford-parser-full-2015-04-20/stanford-parser-3.5.2-models.jar')\n\
  # perform dependency parsing\nresult = list(sdp.raw_parse(sentence))[0]\n# generate\
  \ annotated dependency parse tree\nresult\n```\n\n我们还可以使用以下代码片段以三元组的形式查看实际的依存成分。\n\
  \n```\n# generate dependency triples\n[item for item in result.triples()]\n[(('beats',\
  \ 'VBZ'), 'ccomp', ('unveils', 'VBZ')),\n(('unveils', 'VBZ'), 'nsubj', ('US', 'NNP')),\n\
  (('unveils', 'VBZ'), 'dobj', ('supercomputer', 'NN')),\n(('supercomputer', 'NN'),\
  \ 'nmod:poss', ('world', 'NN')),\n(('world', 'NN'), 'case', (\"'s\", 'POS')),\n\
  (('supercomputer', 'NN'), 'amod', ('powerful', 'JJ')),\n(('powerful', 'JJ'), 'advmod',\
  \ ('most', 'RBS')),\n(('beats', 'VBZ'), 'nsubj', ('China', 'NNP'))]\n```\n\n这让我们可以详细了解每个词元以及词元之间的依存关系。现在让我们构建并可视化原始的依存树。见图\
  \ 3-16。\n\n\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig16_HTML.jpg](img/427287_2_En_3_Fig16_HTML.jpg)\n\
  \n**图 3-16** 使用 NLTK 和斯坦福依存句法分析器可视化新闻标题的原始依存树\n\n```python\n# 打印简单的依存句法分析树\ndep_tree\
  \ = result.tree()\nprint(dep_tree)\n(beats (unveils US (supercomputer (world 's)\
  \ (powerful most))) China)\n# 可视化简单的依存句法分析树\ndep_tree\n```\n\n请注意该树与我们之前在图 3-15\
  \ 中得到的树之间的相似性。注释有助于理解不同词元之间的依存关系类型。您还可以看到，我们可以多么轻松地为句子生成依存句法分析树，并分析和理解词元之间的关系和依存关系。斯坦福解析器非常稳定且健壮，与\
  \ NLTK 的集成也很好。我们推荐使用 NLTK 或 spaCy 解析器，因为两者都相当出色。\n\n### 成分句法分析\n\n基于成分的语法用于分析和确定句子由哪些成分构成。除了确定成分外，另一个重要目标是确定这些成分的内部结构以及它们之间的连接方式。通常，根据短语所能包含的成分类型，存在多种规则，我们可以利用这些规则构建句法分析树。请参阅第\
  \ 1 章“语言语法与结构”部分中“语法”下的“成分语法”小节，以回顾记忆并查看一些句法分析树示例。\n\n通常，基于成分的语法有助于指定如何将句子分解为各种成分。完成这一步后，它会帮助将这些成分进一步细分；此过程重复进行，直到达到单个词元或单词的级别。通常，这些语法类型可用于根据句子成分的层次有序结构来建模或表示句子的内部结构。在这种结构中，每个单词通常属于特定的词汇类别，并构成不同短语的中心词。这些短语根据称为短语结构规则的规则形成。\n\
  \n*短语结构规则*构成了成分语法的核心，因为它们讨论了语法和规则，这些规则支配着句子中各种成分的层次结构和顺序。这些规则主要满足两件事：\n\n-   它们确定使用哪些单词来构建短语或成分。\n\
  -   它们确定我们需要如何排列这些成分。\n\n短语结构规则的通用表示为 `S → AB`，它表明结构 `S` 由成分 `A` 和 `B` 组成，且顺序为先\
  \ `A` 后 `B`。虽然有多种规则（如需深入了解，请参考第 1 章），但最重要的规则描述了如何划分句子或从句。短语结构规则将句子或从句的二分法表示为 `S\
  \ → NP VP`，其中 `S` 是句子或从句，它被分为主语（由名词短语 `NP` 表示）和谓语（由动词短语 `VP` 表示）。\n\n这些语法具有各种生成规则，通常使用上下文无关文法\
  \ (CFG) 或短语结构文法就足够了。可以基于这些语法/规则构建成分分析器，这些规则通常作为上下文无关文法或短语结构文法共同提供。解析器将根据这些规则处理输入的句子，并帮助构建句法分析树。图\
  \ 3-17 展示了一个示例树。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig17_HTML.jpg](img/427287_2_En_3_Fig17_HTML.jpg)\n\
  \n**图 3-17** 一个展示嵌套层次结构的成分句法分析示例\n\n解析器让语法活了起来，可以看作是对语法的过程式解释。有多种类型的句法分析算法，以下列举了一些：\n\
  \n-   递归下降解析\n-   移进-归约解析\n-   图表解析\n-   自底向上解析\n-   自顶向下解析\n-   PCFG 解析\n\n在当前的篇幅内，详细讨论这些算法是不可能的。然而，NLTK\
  \ 在其官方书籍 [`http://www.nltk.org/book/ch08.html`](http://www.nltk.org/book/ch08.html)\
  \ 上提供了一些极好的相关信息。我们简要介绍其中一些解析器，并在稍后实现自己的解析器时详细探讨 PCFG 解析。\n\n-   *递归下降解析*通常采用自顶向下的解析方法；它从输入句子中读取词元，并尝试将它们与语法生成规则中的终结符进行匹配。它每次向前看一个词元，并在匹配成功时向前移动输入读取指针。\n\
  -   *移进-归约解析*采用自底向上的解析方法，它找到与语法生成式右侧对应的词元（单词/短语）序列，然后将其替换为该规则的左侧部分。此过程持续进行，直到整个句子被归约为一个句法分析树。\n\
  -   *图表解析*使用动态规划来存储中间结果，并在需要时重用它们，以获得显著的效率提升。在这种情况下，图表解析器存储部分解决方案，并在需要得到完整解决方案时进行查找。\n\
  \n#### 构建成分句法分析器\n\n我们将使用 NLTK 和斯坦福解析器来生成句法分析树，因为它们是最先进的工具，并且运行效果非常好。\n\n\n\n###\
  \ 前提条件\n\n从 [`http://nlp.stanford.edu/software/stanford-parser-full-2015-04-20.zip`](http://nlp.stanford.edu/software/stanford-parser-full-2015-04-20.zip)\
  \ 下载官方斯坦福解析器，该版本运行效果良好。你也可以访问 [`http://nlp.stanford.edu/software/lex-parser.shtml#Download`](http://nlp.stanford.edu/software/lex-parser.shtml#Download)\
  \ 并查看“发布历史”部分，尝试更新的版本。下载完成后，将其解压到文件系统中已知的位置。完成这些操作后，你就可以通过 NLTK 使用该解析器了，我们稍后将进行探索。\n\
  \n斯坦福解析器通常使用*PCFG（概率上下文无关文法）解析器*。PCFG 是一种上下文无关文法，为其每条产生式规则关联一个概率。由 PCFG 生成的解析树的概率，就是生成该树所用各产生式各自概率的乘积。现在，让我们实际运行这个解析器！参见图\
  \ 3-18。\n\n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig18_HTML.jpg](img/427287_2_En_3_Fig18_HTML.jpg)\n\
  \n**图 3-18** 对示例新闻标题进行成分分析\n\n```\n# 设置 java 路径\nimport os\njava_path = r'C:\\Program\
  \ Files\\Java\\jdk1.8.0_102\\bin\\java.exe'\nos.environ['JAVAHOME'] = java_path\n\
  # 创建解析器对象\nfrom nltk.parse.stanford import StanfordParser\nscp = StanfordParser(path_to_jar='E:/stanford/stanford-parser-full-2015-04-20/stanford-parser.jar',\n\
  path_to_models_jar='E:/stanford/stanford-parser-full-2015-04-20/stanford-parser-3.5.2-models.jar')\n\
  # 获取解析树\nresult = list(scp.raw_parse(sentence))[0]\n# 打印成分分析树\nprint(result)\n(ROOT\n\
  (SINV\n(S\n(NP (NNP US))\n(VP\n(VBZ unveils)\n(NP\n(NP (NN world) (POS 's))\n(ADJP\
  \ (RBS most) (JJ powerful))\n(NN supercomputer))))\n(, ,)\n(VP (VBZ beats))\n(NP\
  \ (NNP China))\n(. .)))\n# 可视化解析树\nfrom IPython.display import display\ndisplay(result)\n\
  ```\n\n在上述输出中，我们可以看到成分的嵌套层次结构，这与浅层分析中的扁平结构形成对比。如果你对 SINV 的含义感到好奇，它表示*倒装陈述句*，即主语位于限定动词或情态动词之后的句子。如有需要，可参考\
  \ [`https://web.archive.org/web/20130517134339/http://bulba.sdsu.edu/jeanette/thesis/PennTags.html`](https://web.archive.org/web/20130517134339/http://bulba.sdsu.edu/jeanette/thesis/PennTags.html)\
  \ 上的“[Penn Treebank 参考手册](https://web.archive.org/web/20130517134339/http:/bulba.sdsu.edu/jeanette/thesis/PennTags.html)”来查询其他标签。\n\
  \n构建你自己的成分解析器有多种方法，包括创建你自己的 CFG 产生式规则，然后使用某个解析器来应用该文法。要构建你自己的 CFG，可以使用 `nltk.CFG.fromstring`\
  \ 函数输入你自己的产生式规则，然后使用诸如 `ChartParser` 或 `RecursiveDescentParser` 等解析器，它们都属于 NLTK\
  \ 包。你可以随意构建一些玩具文法，并用这些解析器进行实践。\n\n现在，我们来看一种构建可扩展且高效成分解析器的方法。常规 CFG 解析器（如图表解析器和递归下降解析器）的问题在于，它们很容易因可能的解析总数过多而不堪重负，变得极其缓慢。在这种情况下，像\
  \ PCFG（概率上下文无关文法）这样的加权文法和像 Viterbi 解析器这样的概率解析器被证明更有效。\n\nPCFG 是一种上下文无关文法，为其每条产生式规则关联一个概率。由\
  \ PCFG 生成的解析树的概率，就是生成该树所用各产生式各自概率的乘积。我们将使用 NLTK 的 `ViterbiParser`，基于 `treebank`\
  \ 语料库训练一个解析器，该语料库为其中的每个句子都提供了带标注的解析树。此解析器是一个自底向上的 PCFG 解析器，使用动态规划在每一步找出最可能的解析。我们通过加载必要的训练数据和依赖关系，开始构建自己的解析器。\n\
  \n```\nimport nltk\nfrom nltk.grammar import Nonterminal\nfrom nltk.corpus import\
  \ treebank\n# 加载并查看训练数据\ntraining_set = treebank.parsed_sents()\nprint(training_set[1])\n\
  (S\n(NP-SBJ (NNP Mr.) (NNP Vinken))\n(VP\n(VBZ is)\n(NP-PRD\n(NP (NN chairman))\n\
  (PP\n(IN of)\n(NP\n(NP (NNP Elsevier) (NNP N.V.))\n(, ,)\n(NP (DT the) (NNP Dutch)\
  \ (VBG publishing) (NN group))))))\n(. .))\n```\n\n现在，我们通过从带标注的训练句子中提取产生式并将其添加，来构建文法的产生式规则。\n\
  \n```\n# 提取所有带标注训练句子的产生式\ntreebank_productions = list(\nset(production\nfor sent\
  \ in training_set\nfor production in sent.productions()\n)\n)\n# 查看部分产生式规则\ntreebank_productions[0:10]\n\
  [VP -> VB NP-2 PP-CLR ADVP-MNR,\nNNS -> 'foods',\nNNP -> 'Joanne',\nJJ -> 'state-owned',\n\
  VP -> VBN PP-LOC,\nNN -> 'turmoil',\nSBAR -> WHNP-240 S,\nQP -> DT VBN CD TO CD,\n\
  NN -> 'cultivation',\nNNP -> 'Graham']\n# 为每个单词和词性标签添加产生式\nfor word, tag in treebank.tagged_words():\n\
  t = nltk.Tree.fromstring(\"(\"+ tag + \" \" + word  +\")\")\nfor production in t.productions():\n\
  treebank_productions.append(production)\n# 基于 PCFG 构建文法\ntreebank_grammar = nltk.grammar.induce_pcfg(Nonterminal('S'),\
  \ treebank_productions)\n```\n\n现在我们已经拥有了包含产生式规则的必要文法，接下来使用以下代码片段，通过在该文法上训练来创建解析器，然后尝试在我们的示例新闻标题上对其进行评估。\n\
  \n```\n# 构建解析器\nviterbi_parser = nltk.ViterbiParser(treebank_grammar)\n# 获取示例句子的令牌\n\
  tokens = nltk.word_tokenize(sentence)\n# 获取示例句子的解析树\nresult = list(viterbi_parser.parse(tokens))\n\
  \nValueError                                Traceback (most recent call last)\n\
  \ in ()\n\n17 # get parse tree for sample sentence\n---> 18 result = list(viterbi_parser.parse(tokens))\n\
  ValueError: Grammar does not cover some of the input words: \"'unveils', 'beats'\"\
  .\n```\n\n不幸的是，当我们尝试用新构建的解析器解析示例句子的令牌时，出现了错误。从错误信息中可以明显看出原因：示例句子中的某些单词未被基于 Treebank\
  \ 的文法覆盖，因为它们不在我们的 `treebank` 语料库中。由于这种基于成分的文法使用词性标签和短语标签，根据训练数据构建树，因此我们需要将示例句子的令牌和词性标签添加到文法中，并重新构建解析器。\n\
  \n![../images/427287_2_En_3_Chapter/427287_2_En_3_Fig19_HTML.jpg](img/427287_2_En_3_Fig19_HTML.jpg)\n\
  \n**图 3-19** 基于 Treebank 标注的示例新闻标题成分分析树\n\n\n\n"
