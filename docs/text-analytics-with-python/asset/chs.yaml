  \n**图 4-44** 摩西、他的兄弟亚伦以及摩西的会幕在我们的模型中作为相似实体出现\n\n有了这些嵌入，我们可以执行一些有趣的自然语言任务。其中之一是确定不同词（实体）之间的相似度。\n\
