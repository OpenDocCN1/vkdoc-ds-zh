  上述输出显示了数据集中不同标签不均衡的分布情况。GMB 数据集使用了 *IOB 标注*（内部、外部、开始）。IOB 是一种常见的用于标注令牌的格式，我们在第 3
  章中讨论过。为了帮你复习一下：


  - 标签前的 `I-` 前缀表示该标签位于一个组块内部。

  - 标签前的 `B-` 前缀表示该标签是一个组块的开头。

  - `O-` 标签表示一个令牌不属于任何组块（外部）。


  该数据集中的命名实体识别标签可以使用以下符号来解释，这与你迄今为止见过的命名实体识别标签类似：


  - `geo` = 地理实体

  - `org` = 组织机构

  - `per` = 人物

  - `gpe` = 地缘政治实体

  - `tim` = 时间指示符

  - `art` = 人工制品

  - `eve` = 事件

  - `nat` = 自然现象


  这些类别之外的任何内容都被称为 *other*，表示为 `O`。如前所述，命名实体识别属于序列建模问题类别。有不同的算法可以处理序列建模，而 CRF（条件随机场）就是其中之一。事实证明，CRF
  在命名实体识别及相关领域表现极其出色。在本教程中，我们将尝试基于 CRF 开发我们自己的命名实体识别器。详细讨论 CRF 超出了本书的范围，因为这不是一本硬核的机器学习书籍。但为了激起你的兴趣，CRF
  是一种无向图模型，其节点可以精确地划分为两个不相交的集合 `X` 和 `Y`，分别表示观测变量和输出变量；然后对条件分布 `p(Y | X)` 进行建模。我们建议感兴趣的读者查阅以下关于
  CRF 的文献以深入了解：[`https://repository.upenn.edu/cgi/viewcontent.cgi?article=1162&context=cis_papers`](https://repository.upenn.edu/cgi/viewcontent.cgi%253Farticle%253D1162%2526context=cis_papers)。


  特征工程对于构建任何机器学习或统计模型都至关重要，因为没有特征，就没有学习。同样，CRF 模型训练输入特征序列，以学习从一个状态（标签）到另一个状态的转换。为了支持这种算法，我们需要定义特征，这些特征需要考虑不同的转换。我们将开发一个名为
  `word2features()` 的函数，在该函数中，我们将每个单词转换为一个特征字典，描述以下属性或特征：


  - 单词的小写版本

  - 包含最后三个字符的后缀

  - 包含最后两个字符的后缀

  - 用于判断大写、标题大小写、数字数据和词性标签的标志


  我们还附加了与前一个或下一个单词或标签相关的属性，以判断句首（BOS）或句尾（EOS）。这些是基于最佳实践的特征，你可以通过实验添加自己的特征。请始终记住，特征工程既是一门艺术，也是一门科学。


  ```

  def word2features(sent, i):

  word = sent[i][0]

  postag = sent[i][1]

  features = {

  ''bias'': 1.0,

  ''word.lower()'': word.lower(),

  ''word[-3:]'': word[-3:],

  ''word[-2:]'': word[-2:],

  ''word.isupper()'': word.isupper(),

  ''word.istitle()'': word.istitle(),

  ''word.isdigit()'': word.isdigit(),

  ''postag'': postag,

  ''postag[:2]'': postag[:2],

  }

  if i > 0:

  word1 = sent[i-1][0]

  postag1 = sent[i-1][1]

  features.update({

  ''-1:word.lower()'': word1.lower(),

  ''-1:word.istitle()'': word1.istitle(),

  ''-1:word.isupper()'': word1.isupper(),

  ''-1:postag'': postag1,

  ''-1:postag[:2]'': postag1[:2],

  })

  else:

  features[''BOS''] = True

  if i < len(sent)-1:

  word1 = sent[i+1][0]

  postag1 = sent[i+1][1]

  features.update({

  ''+1:word.lower()'': word1.lower(),

  ''+1:word.istitle()'': word1.istitle(),

  ''+1:word.isupper()'': word1.isupper(),

  ''+1:postag'': postag1,

  ''+1:postag[:2]'': postag1[:2],

  })

  else:

  features[''EOS''] = True

  return features

  '
- '# 将输入句子转换为特征

  def sent2features(sent):

  return [word2features(sent, i) for i in range(len(sent))]

  '
- '# 获取输入句子对应的输出命名实体识别标签

  def sent2labels(sent):

  return [label for token, postag, label in sent]

  ```


  现在让我们定义一个函数，从句子中提取我们的单词、词性标签和命名实体识别标签三元组。我们将对所有输入句子应用此函数。


  ```

  agg_func = lambda s: [(w, p, t) for w, p, t in zip(s[''Word''].values.tolist(),

  s[''POS''].values.tolist(),

  s[''Tag''].values.tolist())]

  grouped_df = df.groupby(''Sentence #'').apply(agg_func)

  ```


