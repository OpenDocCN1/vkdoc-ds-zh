  ### 语序类型学


  语言学中的*类型学*是一个专门研究如何根据句法、结构和功能对语言进行分类的领域。分类方式有多种，其中最常见的模型之一是根据其主导语序进行分类，这也被称为*语序类型学*。我们感兴趣的主要语序出现在包含主语、动词和宾语的从句中。当然，并非所有从句都会使用主语、动词和宾语的格式，而且在某些语言中，主语和宾语也并非必需。然而，存在几种不同的语序类别，可用于对多种多样的语言进行分类。Russell
  Tomlin 于 1986 年进行了一项调查，表 1-1 展示了其分析得出的一些见解。


  **表 1-1**：Russell Tomlin 在 1986 年调查的基于语序的语言分类


  | 序号 | 语序 | 语言出现频率 | 示例语言 |

  | --- | --- | --- | --- |

  | 1 | 主语-宾语-动词 | 180 (45%) | 梵语、孟加拉语、哥特语、印地语、拉丁语 |

  | 2 | 主语-动词-宾语 | 168 (42%) | 英语、法语、普通话、西班牙语 |

  | 3 | 动词-主语-宾语 | 37 (9%) | 希伯来语、爱尔兰语、菲律宾语、阿拉姆语 |

  | 4 | 动词-宾语-主语 | 12 (3%) | Baure 语、马尔加什语、Aneityan 语 |

  | 5 | 宾语-动词-主语 | 5 (1%) | Apalai 语、Hixkaryana 语、Arecua 语 |

  | 6 | 宾语-主语-动词 | 1 (0%) | Warao 语 |


  从这张表中，我们可以观察到共有六大主要语序类别，像英语这样的语言遵循主语-动词-宾语的语序类别。一个简单的例子是句子“He ate cake”，其中“He”是主语，“ate”是动词，“cake”是宾语。表
  1-1 中的大多数语言遵循主语-宾语-动词语序。在这种情况下，如果将这些语言翻译过来，句子“He cake ate”才是正确的。英语到印地语对同一句子的翻译（如图
  1-20 所示，由谷歌翻译提供）就说明了这一点。


  ![../images/427287_2_En_1_Chapter/427287_2_En_1_Fig20_HTML.jpg](img/427287_2_En_1_Fig20_HTML.jpg)


  图 1-20：英语到印地语的翻译改变了句子的语序类别


  即使你不懂印地语，通过谷歌提供的英语注释也能理解：在印地语翻译下方的文本中，表示“蛋糕”的词“kek”移到了句子的中间，而表示动词“吃”的“khaaya”移到了句尾，从而使语序类别变为主语-宾语-动词，这正是印地语的正确形式。这向我们表明了语序的重要性，以及信息表达在不同语言中可能在语法上存在差异。至此，我们关于语言句法和结构的讨论就结束了。接下来，我们来看看围绕语言语义的一些概念。




