  你可以检查一些特定电影评论的情感倾向以及 `TextBlob` 预测的情感极性得分。通常，正分表示积极情感，负分表示消极情感。你可以使用特定的自定义阈值来确定什么是积极或消极。我们基于多次实验使用了
  0.1 的自定义阈值。以下代码计算了整个测试数据集上的情感倾向。见图 9-1。


