  \ = [vec_df[vec_df.index == term].dropna(axis=1).values[0] for term in other_terms]\n\
  ```\n\n我们现在准备开始计算相似度度量，并将使用这些术语及其向量表示来衡量相似度。\n\n## 汉明距离\n\n*汉明距离*是一种非常流行的距离度量，常用于信息论和通信系统中。它是在假设两个字符串等长的前提下，测量它们之间的距离。正式定义是：在两个等长字符串之间，对应位置字符不同的位置数量。考虑两个长度为`n`的术语`u`和`v`，汉明距离的数学表示如下：\n\
  \n![$$ hd\\left(u,v\\right)=\\sum \\limits_{i=1}^n\\left({u}_i\\ne {v}_i\\right)\
  \ $$](img/427287_2_En_7_Chapter_TeX_Equa.png)\n\n如果需要，你也可以通过将不匹配数除以术语的总长度来进行归一化。这样就得到了归一化的汉明距离，表示如下：\n\
  \n![$$ \\mathit{\\operatorname{norm}}\\_ hd\\left(u,\\kern0.5em v\\right)=\\frac{\\\
  sum_{i=1}^n\\left({u}_i\\ne {v}_i\\right)}{n} $$](img/427287_2_En_7_Chapter_TeX_Equb.png)\n\
  \n注意，`n`表示术语的长度。下面的函数计算两个术语之间的汉明距离，并且具备计算归一化距离的能力。\n\n```python\ndef hamming_distance(u,\
  \ v, norm=False):\n    if u.shape != v.shape:\n        raise ValueError('The vectors\
  \ must have equal lengths.')\n    return (u != v).sum() if not norm else (u != v).mean()\n\
  ```\n\n我们可以使用以下代码片段来测量根词与其他术语之间的汉明距离。\n\n```python\n"
