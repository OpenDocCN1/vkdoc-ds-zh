- '# 16. 巴斯·格尔丁克访谈


  ## 关于本次访谈


  | 人物 | 巴斯·格尔丁克 |

  | :--- | :--- |

  | 时间段 | 2013–2019 年 |

  | 项目管理框架 | Scrum |

  | 涉及公司 | ING、荷兰合作银行 |


  ### 背景


  巴斯·格尔丁克在创建数据驱动型公司以及在金融行业应用人工智能方面拥有丰富经验。他曾负责管理 ING 银行的数据团队，现在在荷兰合作银行工作。他拥有人工智能硕士学位。


  *ING 是一家拥有强大欧洲根基的全球性银行。我们的 53,000 名员工为超过 40 个国家的约 3840 万客户、企业客户和金融机构提供服务。我们的宗旨是赋能人们，让他们在生活和商业中保持领先一步。*


  *荷兰合作银行是一家由客户创建、为客户服务的银行，是一家合作制银行，也是一家具有社会责任感的银行。我们的目标是成为荷兰所有金融市场的领导者。同时，我们致力于成为全球食品与农业领域的领先银行。*——摘自其官网


  ### ING 的数据团队


  2013 年，ING 开始认真对待大数据。这一推动力来自 CEO 和董事会自顶向下的战略，他们深信数据的力量。巴斯说：“当时大数据还没有现在这么重要。一些高层管理者认识到必须使他们的数据环境专业化，并指定人员对此负责。”在团队成立之前，相关人员分散在整个组织中。ING
  借此机会将他们集中起来，组建了一个真正的数据团队。


  董事会甚至更进一步，举行了战略研讨会，以触及 ING 业务的本质。巴斯说：“事实上，我们所做的一切都关乎数据处理。这是一个强有力的信号。公司不仅在内部沟通中，也在媒体上大声宣扬这一点。你可以在
  YouTube 和各类会议上找到我们的 CEO 谈论此事的视频，他以强有力的方式传达了这个信息。我认为这种可见度确实有助于推动这些事情。”


  巴斯负责管理一个大型项目，旨在提升 ING 的数据成熟度专业水平，并创建一个达到生产标准的数据湖。当时，他领导着一个 20 人的团队。“当我听说这个倡议后，立刻变得热情高涨，并立即申请加入团队。还有很多其他人，要么主动请缨，要么被同事招募。所以我们很快就组建起并运作起了一个团队。”


  “我认为很多公司当时都是这种情况。数据在银行中一直存在，但在 ING，数据分散在旧的数据仓库、旧的 Oracle 数据库、旧的 COBOL 大型机应用程序中。我们的数据基础设施在银行收集数据的
  20 或 30 年间有机地发展起来。所以，这是第一次严肃地尝试使该环境专业化的举措之一，其目的是，好吧，我们要为数据存储构建一个新版本的真相。”ING 当时正在思考架构应该是什么样的。他们想要一个治理良好、组织有序且建模完善的银行数据真相源。


  每当一家大公司启动一个大型项目时，管理层都需要意识到其中涉及的政治因素。巴斯说：“在一个大型组织中，总是存在政治角力。人们想要保护旧的工作方式。”在 ING 的案例中，团队组建和推广进行得还算顺利。“真正有帮助的是，从项目一开始，管理者们就认识到这是一个无论如何都将进行的大项目。项目得到了业务部门、IT
  部门以及已经在旧系统上工作的人员的大力支持。”


  ING 是一家跨国银行。一个难点是协调不同国家，因为每个国家都有各自独立、互不往来的组织。“每个国家都有自己的数据部门和自己的 IT 系统。要整理好这种碎片化状态，使每个人都使用相同的工具、相同的数据模型等，需要大量的协调工作。这很困难，因为这意味着你必须协调银行内部的各个独立单位。”


  为了实现这种跨国家协调，“第一步是让所有人使用相同的工具和相同的标准。”他们为数据湖创建了一个参考架构。这使得每个国家都与该参考架构保持一致，并使每个人都能使用相同的工具和数据交换协议。“我们开始使用同一种数据语言，基本上可以说是一种用于数据的通用语，即元语言。”


  巴斯工作的一大部分就是要在整个企业和其他国家之间建立这种对齐。他通过“做演示、出差、沟通，有时可能还需要稍微推动一下，直接说‘这就是标准。这已经确定下来，这就是我们将要遵循的方式。’来做这件事。你只需要一些耐心和一些良好的项目管理，基本上就能把这些事情理顺。”


  在创建这个国际项目时，巴斯发现“沟通是关键”。他们知道这些国际项目会很困难。“不过，我们可以相信，至少从事国际数据整合工作的人员是支持这个项目并遵循技术规划的。在鹿特丹，我们暂时让他们专注于在一个国家构建项目，然后尝试将成果推广到其他国家。”为了在国际团队之间有效沟通，他们召开了大量的协调电话会议。




  ### ING 组织架构


  从顶层开始，CEO 向董事会汇报。在他之下是 CIO，负责所有基础设施和工程工作。再往下，汇报结构按国家划分，例如巴茨所在的荷兰。CIO 之下是各级主管经理，在他们之下是部门经理，ING
  称之为 IT 主管。


  ING 采用了在 Spotify 广受欢迎的敏捷团队组织形式。巴茨认为这种模式是该组织持续良好运营的较大成功因素之一。他们的架构将团队分为部落、分会和小队。巴茨说：“部落向一位类似业务经理或部门经理的主管汇报。分会是志同道合者组成团队的新名称。因此，在
  ING，数据工程和数据科学是不同的分会。小队基本上是一个多学科团队，根据团队需求随时组建和调整。”


  巴茨将数据科学家的角色定义为“在数据之上构建和训练预测模型”。数据工程师的角色是“在生产环境中运行这些模型，处理从数据输入到数据输出的全过程”。工程任务包括“准备数据，确保模型可以获取数据，最终获取模型结果，并将其放入任何需要使用结果的场景中：API、Web
  应用、报告或仪表盘。”他还指出，这两个角色之间存在一些重叠。


  巴茨曾隶属于 IT 主管之下，职位是 CIO 团队经理。之后，他成为了数据工程师的分会主管。ING 将所有国家的组织架构重组为与荷兰一致。一些国家人员较少，但职位头衔相同，有时管理层级也更少。


  这种组织架构的一部分包括一个*会议节奏*。其中包括产品负责人与每个团队的分会主管之间的月度会议。在会议上，部落主管们“讨论团队所涉及的一切事宜，包括团队成员、团队焦点和目的是否仍然正确、团队氛围，以及成员之间是否以正确的方式相处。”


  小队方式为数据工程师与数据科学家的比例提供了更大的灵活性。每个小队由不同的部落组成，通常持续一年或更长时间，“因为优秀的小队应该保持稳定。”团队构成会随着人员离职或替换而改变。其他小队的改变则是因为产品进入维护模式，他们需要再次开发新功能。“工作量和类型会随着项目进展而变化。”


  巴茨领导了一个创新项目。“我们一开始只有一位数据科学家，然后团队增长到三人，后来又缩减到一人。这显然是团队当时所需要的，我们没有提前计划，只是每个月审视我们的需求。”这种持续的沟通使他们能够根据需要扩编或缩减团队。管理层通过分会间的沟通，使得在需要时能够调配人员到小队工作。


  小队的日常管理由产品负责人负责。他们负责确保小队在项目上取得进展。分会主管则不参与日常互动或负责日常运营。


  以下是一些运作实例。“有些团队是功能团队，例如在 Spark 或 Flink 集群之上构建某个功能。这反过来为最终用户产生了一些功能结果，比如预测算法或移动应用中的某个功能。这些团队是通过从多个分会中挑选人员组建而成的——只要是构建该功能所需的人员。就我而言，我有几个小队只配备了一两名高素质工程师。其他人员来自移动软件开发、数据科学，或者来自业务部落，如市场营销或产品开发。”


  从不同数据科学家和数据科学家中临时组建小队的方式，凸显了在处理数据时多学科团队的重要性。这不仅仅涉及技术人员：它把产品负责人或业务人员与实施项目的团队紧密结合起来。巴茨说：“我们看到了数据科学家被孤立、脱离其他系统环境进行开发的后果。将数据科学家、数据工程师和业务人员聚在一起，让他们互相学习。在这些小队中，正确的事情正在发生。组建多学科小队也使得数据科学家能够专注于他们擅长的领域，例如构建预测模式的模型等。”


  巴茨继续说道：“但数据科学家也可以做一些小队所需的其他工作：一点编程、文档编写，或者维护小队正在构建的所有内容。其他人员也是如此。在这种情况下，你可以将 70%
  或 80% 的时间专注于你的主要角色，但你也必须处理一些可能不是你受训要做的事情，但这些事情是让你的小队成功所必需的。”


  从运营角度来看，数据工程师负责 DevOps。小队中也可能有来自运营背景的人员。通常，数据科学家负责其模型的运营方面，例如重新训练或监控模型漂移。


  ### 项目管理框架


  ING 使用 Scrum 作为其项目管理框架。巴茨说：“我认为当你做数据科学时，可以完美地结合像 Scrum 这样的框架进行敏捷工作。当然，构建模型有一些你可能想要遵循的结构。在某些情况下，你必须加入一些灵活性，因为你不知道第二天具体要做什么，但这同样适用于其他实践，如市场营销或软件工程。”他建议专注于重要且让你感到舒适的事情。


  要弄清楚哪里需要严谨，哪里可以灵活。“我们刚开始采用 Scrum 时，一切照本宣科。一切都遵循框架；它几乎就像圣杯；每个人都必须遵循进行 Scrum 时应有的精确会议安排。”当他们增加了灵活性之后，“继续使用
  Scrum 框架变得完全合理。”


  为确保团队良好协作，他建议遵循 Scrum 会议节奏、每日站会、冲刺规划和回顾会议。他更进一步建议，“不要把团队成员安排在不同的楼层或不同的办公桌。让他们在物理上保持近距离，这很有帮助。此外，我热衷于打造强大的团队文化。因此，团队建设、一起聚餐或小酌、共享午餐，诸如此类的事情，真的很有帮助。”


  ### 在银行业务中使用数据科学


  荷兰合作银行通过数据科学提高农场效率，从而帮助自身及其农民客户。更高效的农民能赚更多钱、花更少钱，而荷兰合作银行也从中受益，因为农民将更多资金存入银行，并降低了贷款风险。荷兰合作银行的收益还来自一种意识形态上的视角：帮助解决世界饥饿问题、减少浪费、更具可持续性，并改善全球食品链。


  为实现这一目标，荷兰合作银行正转型为农业领域的数据驱动型研究公司。这项研究必须具备全球视野。为了在全球范围内进行研究，荷兰合作银行必须雇佣大量分析师，并大规模使用数据科学。数据科学家构建的模型将帮助农民确定何时种植或收割作物。




  ### 数据团队的关键绩效指标


  Bas 为数据团队设定 KPI 的方式颇为独特。“我认为业务成果才是关键。技术性 KPI 是次要的。”


  在业务方面，他建议确定“有多少人真正对这个模型充满热情。给业务用户提供评分或调查，看看有多少人在日常使用你的模型，以及有多少人因此获得了帮助。”他的理由是，如果模型未能运行或产生任何业务成果，“它就没有被实际客户使用，因此毫无用处。”


  对于技术性 KPI，他建议审视模型或项目本应满足的需求。“你的模型性能高吗？维护得好吗？有管理吗？有监控吗？”


  ### 给其他人的建议


  Bas 建议，“最大的成功来自于，在一个小组或一个团队中，大家拥有共同的目标，这个团队由数据科学家、数据工程师和业务人员组成。并且让他们在相同的架构下紧密合作，频繁沟通。他们应该讨论相同的问题和相同的
  KPI，共同庆祝相同的成功。”


  在组织内部设定现实的目标和期望也很重要，“因为人工智能和机器学习有时被视为灵丹妙药。它们被认为能立刻解决你的问题。你必须现实一点。你不能指望通过一件简单的事情就能解决所有问题。”相反，你需要把一个非常大的项目分解成几个较小的部分，这些部分可能会产生几个不同的模型。通过逐步创建多个模型，你才能构建一个完整的解决方案。


  在大型组织中，标准化你们处理数据、数据湖以及其他技术模式的方法非常重要。“我认为我的部分职责就是实现标准化，例如，标准化两个人正在使用的基础设施，标准化模型在生产环境中的部署方式，标准化代码的版本控制流程。我们不希望看到五个团队，却以五种不同的方式使用工具。”长此以往，这五种不同的方式会扼杀创新与合作。团队可能会把所有时间都花在工具的选用和更换上。“你无法复用其他团队已构建好的成果。因此，让团队在工具使用上各自为政存在着诸多弊端。”


  拥有多学科团队非常重要。“我见过当来自不同背景的人为了一个共同目标而工作时，小组能展现出最高绩效。”这个单一目标给了团队明确的优先级和关注点。


  一个采用开源技术的公司更容易招到人。在我采访 Bas 之前，我就听说过 ING 正在做的事情以及那里的人才，口碑非常好。Bas 说：“我认为我们做得最正确的一件事，就是建立了内部工程的文化。我们有一个非常好的故事可以讲给软件工程师听：‘我们对开源充满热情。我们采用敏捷开发；只要你用正确的方式沟通，你基本上可以选择你想要的工具。’我认为引入这种开源敏捷文化是一个非常正确的决定。”


  '
- '# 17. 对 Harvinder Atwal 的访谈


  ## 关于本次访谈


  | 人员 | Harvinder Atwal |

  | 时间段 | 2012–2019 |

  | 项目管理框架 | Scrum, Kanban, Waterfall |

  | 涉及公司 | Moneysupermarket |


  ### 背景


  Harvinder Atwal 是 Moneysupermarket 的数据战略与高级分析主管。他拥有运筹学硕士学位。


  *Moneysupermarket Group PLC 是富时 250 指数的资深成员。通过我们领先且值得信赖的品牌，我们致力于为客户提供他们所需的增长财富的服务、工具和产品。我们的商业模式是一个数据驱动的市场，为客户提供他们在别处无法获得的优惠，为我们的供应商提供价值，并为投资者提供持续的回报记录。*——摘自其官网


  ### 团队结构


  Moneysupermarket 的数据职能组共有 70 人。数据组织由首席数据官领导。他们的职责范围从数据存入存储机制开始，一直延续到内部用户为分析目的访问这些数据为止。


  他们有一个数据管理团队，成员来自数据工程、数据治理、商业智能和数据创新等不同领域。


  有两个不同类型的分析团队，它们都集中在单一领导者之下。其中一个由 Harvinder 管理，侧重于横向，而另一个则侧重于纵向。侧重于纵向的团队负责处理某个品牌的所有产品。对于
  Moneysupermarket 来说，这些纵向领域包括公用事业、电信、金融产品以及旅游超市。Harvinder 指出，分析部门隶属于首席数据官的情况并不常见。通常，“它们都在
  IT 部门，尽管你可能会发现一些中央分析团队嵌入在某些业务单元中。”


  Harvinder 对数据科学家的定义是“从事高级分析工作的人”。他们主要负责创建有益于客户和内部流程的模型。“他们与产品团队的协作也非常紧密。因此我们做了大量的网站优化测试和一些
  A/B 测试。这些可以以批处理的形式完成；同时，我们也在越来越多地关注流式处理管道。”


  公司对数据工程师的定义随着时间的推移发生了变化。过去他们有更多的 ETL 开发者。Harvinder 描述了他们的角色。“他们帮助将数据转换成数据分析师和数据科学家可以使用的格式。”他们过去还负责获取一些机器学习模型并重新进行编码。


  在运营上，该团队遵循 DevOps 模式。Harvinder 说：“如果你构建了它，你就要拥有它并运行它。数据运营实际上是一个核心职能，隶属于数据管理部门，主要照看我们的数据库和服务器。因此，对于数据分析职能，我们减少了对运营部门的依赖。”


  Moneysupermarket 正在转向类似 Spotify 的基于小组的工作模式。这将使团队拥有更高的自主性，并具备完成任何必要工作所需的所有技能。


  Harvinder 说：“我们意识到，我们并不需要所有现有的数据科学家，而且实际上，他们会造成团队失衡。为了建立一个平衡良好的团队，我们正在寻找具备软件工程专长的人才。我们也想要有数据分析背景的人，这样我们就可以覆盖更广泛的技能范围，并开展交叉培训。即使你在一个团队中拥有了正确的技能组合，你仍然可能因为个体而形成孤岛。因此，我们关注的另一件事就是对人员进行交叉培训。他们永远不会完全精通彼此的领域，但只要他们知识足够，能够帮助其他团队成员并维持工作流的持续推进，这就比拥有一支全是专家的团队要好。”




  ### 消除障碍与摩擦


  `Moneysupermarket` 最初以较为传统的方式处理数据。数据科学家和数据分析师团队主要提供决策支持。但公司意识到，组织的需求及其使用的技术会随时间变化。起初，`IT`部门使用数据仓库，专注于治理和控制。而管理层希望创建更先进的机器学习模型。数据使用者希望在使用数据时获得更多访问权限、自由度和灵活性。平台实际上阻碍了数据团队使用数据的能力。


  为了实现这些变革，`Moneysupermarket` 必须消除所有障碍和摩擦。这些变革涉及组织和技术两个层面。正如 `Harvinder` 所说：“我们并非打算购买某个特定工具或平台来解决所有问题，也不是仅仅需要更好地组织就能解决所有问题。有很多东西需要改变。”


  从组织层面来看，公司存在“用错的人做错的事，这浪费了大家的时间”的问题。他们必须改变“团队所在的位置、向谁汇报以及其职责。”


  从技术层面来看，他们必须更换所使用的工具和平台。但他们不能完全移除对数据的所有治理和控制，因为他们存储着 `PII`（个人身份信息），必须确保这些信息不被滥用。团队必须创建一个既能保证安全又不妨碍使用的平台。


  作为这些组织和技术变革的一部分，数据团队自然而然地开始向 `DataOps` 模式靠拢。`Harvinder` 将他们的 `DataOps` 定义为“`DevOps`、精益思维和某种敏捷方法的结合。”


  他们向 `DataOps` 的转型是一个持续的过程，因为总有需要改进的地方。特别是，`Harvinder` 专注于改进“数据管理、数据治理以及数据流的监控。”


  他们在 `Moneysupermarket` 使用 `DataOps` 后发现的主要改进是速度的提升：他们能更快地创建数据产品并更快地使用它们。“从加速数据使用方式的能力来看，`DevOps`
  在分析领域确实大有裨益。”速度的提升帮助了组织内多个部门，例如市场部。


  在组建职能团队时，业务部门需要与多个不同部门、团队甚至 `CxO` 级高管进行优先级排序。每个团队都有自己的待办事项清单，他们的优先级可能与业务的优先级不匹配。这导致了优先级请求必须不断上报给高级管理层。每个小队或团队应具备完成任务所需的所有技能。


  将所有数据团队置于一位 `C 级` 高管之下也减少了摩擦。此前，`Moneysupermarket` 的一些团队隶属于 `CDO`，而另一些则隶属于 `IT`。这使得变更和更新的可见性变得困难得多。整合到一位高管之下后，沟通得以显著改善。`Harvinder`
  说：“我们有更多机会与他们沟通，了解我们对他们的期望以及如何使用数据，这带来了巨大的好处。” 重组改善了数据团队的目标设定。“这使得优先级决策更加容易，确保我们不会在完全不同的目标上工作。”


  减少摩擦的部分工作需要让数据团队与业务保持一致。“我们不希望分析或数据科学团队自行其是、进行实验，然后回过头来发现人们对他们的成果不感兴趣，因为还有其他的目标。”相反，他们首先与业务保持一致，弄清楚分析工作如何能推动业务目标。


  这种规划从路线图开始。数据团队与利益相关者坐下来，了解他们的路线图以及团队如何能做出贡献。通过转向小队形式，“我们在目标上高度一致。我们发现协作性大大增强。说服业务部门我们有一个真正能提供帮助的好主意变得容易多了。他们能看到这将如何帮助他们并使其受益。”


  良好的协调对于维持整个系统的运行是必要的。没有它，团队的工作很有可能无法投入生产，这会带来“工作被浪费的真实风险”。当工作被浪费时，数据科学家和数据工程师会感觉他们的努力没有产生任何影响。当人们看到自己的时间和精力因缺乏协调而被浪费时，他们就会跳槽到其他公司。这是“协调对我们来说如此重要的另一个原因。”


  并非团队所做的每件事都会出现在业务的路线图上。“仍然需要留出一些创新空间，以及回过头来清理我们积累的技术债务和引入新技术。”


  ### 项目管理框架


  `Moneysupermarket` 使用 `Scrum`、`Kanban` 和 `Waterfall` 项目管理框架。团队主要使用 `Scrum`，但管理层将决定权留给各个团队。“我们对强制推行某些工作方式并不严格；我们发现不同方式对其他人自然会更好些。我们在强制推行某些类型的最佳实践方面则稍严格一些。例如，我们确实有软件开发的生命周期。”


  有些团队可能会使用 `Waterfall`，因为存在一个特定的截止日期。例如，当一项旧技术的许可证即将到期时。团队需要规划以赶上那个最后期限。


  数据科学和分析团队发现 `Kanban` 更适合他们。“由于我们工作的探索性质，我们并不总能知道何时能获得可接受的结果或令我们满意的结果。” 在数据科学或分析领域，你很可能“在迭代结束时拿不出一个可交付的产品。”


  流程的多少还取决于结果是会投入生产以供反复使用，还是只为内部团队提供一次性洞察。如果某个结果要投入生产或可能涉及敏感数据，他们会为其设置软件工程流程并严格把控。


  一些数据科学家对软件工程流程感到不满。他们可能觉得挑战太大，或者流程对于他们要做的事情来说过于繁重。因此，`Moneysupermarket` 对每个团队的首席数据科学家进行了软件工程方法论的培训，并向他们展示了如何以对团队有效的方式使用这些方法。首席数据科学家反过来又培训他们的团队使用这些方法。实际上，由首席数据科学家负责在团队中推行软件工程最佳实践。数据科学家们认识到，“如果做对了，它能帮你避免犯错，而犯错只会浪费你的时间。所以，流程是用来帮助你，而不是阻碍你的。”




  ### 团队 KPI 与目标


  所有数据团队的 KPI 均与组织和技术目标保持一致。技术 KPI 用于监控数据质量、数据完整性、服务等级协议（SLA）以及数据的时效性等指标。


  对于组织层面的 KPI，实际衡量标准并非关注产出，而是关注成果。“他们有很大的自由去决定如何实现这些成果，但达成目标的唯一途径是与利益相关者合作。”这需要与业务部门保持良好的沟通。否则，他们可能创造出绝佳的模型、洞察或数据产品，却最终无人问津。


  组织目标每年设定一次。Moneysupermarket 的奖金结构更像传统金融公司，年终奖金是员工们追求的核心目标。“我们是一家上市公司，因此达成目标、让股东满意会带来相当大的压力。”Harvinder
  全年都会监控团队在组织目标上的进展。“每个季度，我都会把团队召集起来，检查我们的进度是否正常。我们还会进行回顾总结，探讨团队内部如何改进以提升绩效。”


  ### 数据团队的变迁


  机器学习带来了常规分析或软件工程无需应对的新挑战。Harvinder 将其比作计算器。如果你编写一个计算器，你总是希望它能永远给出正确的计算结果。然而，对于机器学习而言，计算结果是不断变化的。一旦模型被创建出来，就会面临诸如输入数据变化导致的模型漂移等问题，需要持续监控模型的漂移情况。如果模型确实发生了漂移，它就无法提供准确的预测或结果。


  这引出了一个问题：谁负责监控模型漂移？此人需要决定最佳的行动方案。是应该重新训练模型吗？还是到了采用完全不同模型或方法的时机？Harvinder 认为这可能是机器学习工程师的职责之一。


  Harvinder 认为数据工程师“对我们所做的工作至关重要，他们并非只是一个接受我们指令、在我们需要时提供数据集的独立职能部门。他们必须积极主动。”拥有合适的数据工程师能让组织的其他部分更富成效和效率。“我认为总体上我们可能不需要那么多数据科学家，但可能需要更多来自数据工程师的支持，因为我们已经拥有了远超整合能力的数据量，同时新的数据源还在不断涌现。”


  组织需要确保数据团队的每位贡献者都能因其工作获得认可。通常，数据科学家获得了绝大部分赞誉，因为他们是团队中最常与客户接触的部分。“但实际上，成功也属于其他所有人。我认为，作为数据运维（DataOps）团队的一员，能让他们做出更多贡献，同时也获得更多对他们工作的认可。”确保利益相关者了解谁做出了贡献，这是管理层的责任。“不应该只让报喜的人独占所有荣耀。”


  ### 给他人的建议


  当组织刚开始涉足数据科学时，他们会聘请“一些非常令人兴奋的人才，然后告诉他们去自由探索，找点有趣的事情做，提供一些见解。”数据科学家们会去寻找这些见解，“但他们提出的东西并不属于利益相关者的路线图或目标。”随后，数据科学家会发现，他们的模型或见解完全未被使用或投入生产，这让他们感到“极其沮丧”。Harvinder
  建议不要追求“特别炫酷或尖端”的任务，而是要先获得支持，再去实现真正出色的成果。


  新晋数据科学家对于入职后将要从事的工作往往抱有极不切实际的期望。他们认为自己将整天忙于创建机器学习模型和调整超参数。而实际上，数据科学家的职责是“运用数据来驱动决策”。这种对模型而非价值创造的过度关注，受到了各类会议、文章以及数据科学竞赛的推波助澜。“但我更希望拥有一个真正能应用于产品的好模型。”


  对于希望数据团队取得成功的大型组织，Harvinder 建议先夯实基础。组织需要制定清晰的数据战略。这意味着必须明确回答“你将如何获取数据、如何存储数据、以及如何落实数据治理和数据管理”。组织还需要统一其战略，确保每个人都理解最终目标，并清楚个人将如何为实现该目标做出贡献。管理层需要确保所需人员或数据团队不存在缺口，并确保团队成员拥有所有必备技能。没有坚实的基础，任何数据战略或数据项目都难有大的进展。


  小型组织倾向于聘用一名孤军奋战的数据科学家，期望他承担整个数据团队的所有职责。这名数据科学家往往经验不足。相反，初创公司应确保“为该职位招募到合适的人选”。


  接下来是数据本身及其数量的问题。一些小型公司“根本没有足够的数据来开展任何有价值的分析”。初创公司需要现实地评估自己起步时有多少数据，以及积累到足以进行可靠分析的数据量需要多长时间。如果没有足够的数据，就很难建立基准或有效追踪数据科学家带来的改进。


  在数据工程方面，Harvinder 建议重视“数据分析师、数据管家、数据血缘追踪以及元数据”。在 Moneysupermarket，他们的数据来自网站，是相对干净的
  JSON 格式。即便如此，他们在数据质量或数据血缘方面仍会遇到挑战。Harvinder 原本会“更早地投入更多时间来组建软件工程团队，并确保数据科学家和数据分析师也具备软件开发技能。”


