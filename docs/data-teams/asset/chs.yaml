- "# 9. 管理大数据项目\n\n> *爱你不论，不论时光好坏，悲喜与否*\n> \n> ——艾尔·格林，《让我们在一起》\n\n在前面的章节中，我们为你的数据团队配置了人员，并在更大的组织内为他们找到了支持。本章涵盖了随着团队进展，管理者必须面对的许多日常和长期问题：\n\
  \n*   规划数据产品的创建与使用\n*   将任务分配给合适的团队\n*   数据科学家的特殊需求\n*   长期项目管理\n*   技术选型\n*   当一切出错时\n\
  *   意外后果\n\n## 规划数据产品的创建与使用\n\n数据团队交付的价值以其数据产品的形式呈现，这些产品的生命周期各不相同。有些可能是单一的一次性报告，而另一些则通过便捷的渠道对外提供，业务用户在决策过程中会反复调用这些数据产品。\n\
  \n有时，数据工程团队通过创建新的或改进现有的数据产品来启动工作。数据科学团队消费这些数据产品。作为消费过程的一部分，数据科学团队可能会创建衍生的数据产品。最后，运维团队确保一切正确且最优地运行，以便数据产品能够持续自动生成。\n\
  \n### 一次性与临时性洞察\n\n数据工程通常专注于创建持续投产且具有长期视角的数据管道。这是大多数数据工程的工作方式，但并非每个数据产品都需要如此高的严谨性。\n\
  \n一次性或临时性的洞察分析不需要同等水平的工程投入，因为它不需要长期视角。相反，过多的工程投入反而会拖慢它。只要可能，临时性洞察应使用现有的数据产品和已有的基础设施。如果临时性洞察越来越常见，并且需要更快的周转时间，团队应考虑创建一个\
  \ DataOps 团队。这可以通过更快的周转时间来让业务方更满意。\n\n在这些场景下，团队的成功或 KPI 应该根据团队快速执行的能力以及尽可能利用现有资源的能力来衡量。当你发现一个资源被持续使用，但并未作为可用的数据产品对外提供时，数据工程团队可能需要投入工程精力，以持续自动地暴露该数据管道。此后，临时性的工作便可以更有效地利用新的数据管道。\n\
  \n在另一个更高级别的使用层面上，当你注意到有大量类似的临时性使用需求时，数据工程团队就应将一个一致的分析管道或报告投入生产。\n\n最后，管理层应该清楚\"\
  快速\"和\"临时\"意味着什么。这意味着团队不会将通常的工程严谨性应用于洞察。相反，团队优先考虑速度而非工程严谨性。这种速度上的差异可能会导致其他管理者好奇为什么不是所有事情都这么快。当某些洞察是可投产的还是仅是临时性洞察时，他们也可能产生误解。他们可能认为某个洞察已准备好长期使用，而实际上并非如此。数据团队应注意帮助组织管理层了解一个数据产品何时是可投产的，何时不是。\n\
  \n### 对外提供数据产品\n\n让业务方了解如何使用数据团队的数据产品，是决定其被采纳和使用率的关键。实际的数据产品应通过正确的技术来对外提供。请注意，这里的\"\
  技术\"是复数。这是因为分布式系统会以各种方式\"作弊\"（参见第 4 章\"架构师的角色\"部分）。\n\n用于对外提供数据产品的实际技术完全取决于具体用例。例如，运行快速且返回少量数据的查询可以通过\
  \ RESTful 调用对外提供。^(²⁴) 同时，操作并返回大量数据的查询则需要通过分布式系统直接暴露数据。合格的数据工程师和架构师会确保数据产品以正确的方式对外提供。\n\
  \n通常，管理层会希望使用单一技术来对外提供数据产品。但由于特定用例的读写模式，这并非总是可行的。\n\n某个特定分布式系统的\"作弊\"方式，会使它成为一项技术的绝佳选择，同时成为另一项技术的糟糕选择。这迫使数据工程团队与业务方协同，建立一个新的分布式系统来处理需要通过不同技术进行访问的用例。\n\
  \n## 为团队分配任务\n\n尽管第二部分试图在数据科学、数据工程、运维及其他相关团队之间划出清晰的界限，但现实情况要复杂得多。有时当一个新项目启动时，必须有人决定哪些任务属于哪个团队。\n\
  \n在处理任务、项目或用例时，管理者将是第一级分流人员。管理团队必须决定需要哪个或哪些团队来参与项目。正确做出这个决定至关重要，这样才能从项目一开始就让正确的团队参与进来，而不是等到太晚才发现需要其他团队的帮助。数据团队需要验证自己是否是该任务的合适团队，并且能够满足请求。如果一开始就做出了错误的选择，一个团队可能不得不拼命追赶，或者完全重做另一个团队的工作。\n\
  \n\n\n### 数据工程、数据科学，还是运维？\n\n在决定将任务分配给哪个团队时，请思考该问题最根本的用例所在。当然，决策者必须理解每个团队的实际职责及其核心竞争力。\n\
  \n数据工程团队适合处理工程类任务。适合数据工程的典型任务具备以下一个或多个特征：\n\n-   侧重代码开发\n-   优化现有算法，而非从零创建算法\n-\
  \   通过改变底层技术或技术栈来加速报告或分析流程\n\n数据科学团队适合处理高级分析和机器学习任务，其特点包含以下一个或多个方面：\n\n-   以数学或统计学为核心\n\
  -   优化业务方法或成果\n-   提升分析或报告背后的质量或统计数据\n\n运维团队则适合处理已投入生产或准备上线的事物，具备以下一个或多个特征：\n\n\
  -   可通过脚本完成的简单任务\n-   自动化现有流水线或代码示例\n-   生产中已存在但出现异常的数据产品\n\n### 协作\n\n有些任务可能需要三个团队同时参与。这时事情会变得特别复杂，因为你必须把一个看似简单的任务拆解成多个独立的任务。接着，你需要在组织中协调不同团队分别负责不同部分。最后，这些独立任务再整合为一组相互依赖、协同运作的任务。\n\
  \n当你收到这类任务时，务必预估用于协调跨三个团队的纯管理开销所花费的时间。这种开销包括必须召开的会议，而会议又涉及会前准备、实际会议时间，以及需要建立的额外沟通节点。数据团队的成员必须保持同步，才能正确完成任务。\n\
  \n### 解决现有团队的问题\n\n有时你的数据团队效率不高。他们之间协作不畅，无法维持高带宽的沟通连接，也无法利用数据创造价值。当问题出现时，相互指责不断，却没有真正的解决方案。业务部门无法使用他们创建的数据产品。在这种情况下，组织的首要任务就是修复数据团队。\n\
  \n在我与组织合作时，我花在与业务方沟通的时间，与花在与技术方沟通的时间一样多。通过与业务方交谈，我能接触到数据的实际最终用户，他们因此也在持续与数据互动。\n\
  \n与数据消费者交谈能揭示数据团队的问题。如果数据科学团队不与数据工程团队协作，你就会从洞察成果价值低下中听到这个问题。如果数据工程团队没有生产出优质的数据产品，你就会看到业务部门不信任这些结果。如果运维团队未能维持生产系统的稳定运行，你就会不断听到生产中断的消息，这使得业务部门无法真正信任数据项目能在需要时正常运行。\n\
  \n一旦你看到了这些反映出来的问题，就可以向团队确认它们的存在。确认问题后，你就可以开始探究其根源并加以解决。\n\n现有团队问题的根源多种多样。即便团队由优秀的个体（无论是管理层还是个人贡献者）组成，仍然可能出现沟通不畅和成果不佳的情况。另一方面，由表现不佳的个体组成的团队可能无法承担起应有的责任。这需要坦诚地审视团队，才能找出真正的根本原因，而不仅仅是表面问题。\n\
  \n### 任务分配不当的影响\n\n为任务选择错误团队的后果，会因分布式系统所需的复杂性和协调性而显著放大。\n\n一个常见的不良选择（特别是在新任管理者中）是将本应由数据工程师完成的任务分配给数据科学团队。做出这种选择可能是因为没有数据工程团队，或者该团队在组织内太新。分配任务的人可能只是未能理解这些团队之间的区别。\n\
  \n为了让你了解将数据工程任务交给数据科学团队会带来什么后果，让我分享一个我在许多不同组织中都见过的场景。问题的症状是数据科学家要么陷入僵局，要么在任务上进展极其缓慢。管理者会让我去与数据科学家聊聊发生了什么。通常，数据科学家已经在这个任务上花了一个月或更长时间，却几乎没有任何进展。\n\
  \n我们发现，该数据科学家正在处理一个 99%属于数据工程的任务。按照数据工程的标准，这个任务相对容易，几天内就能完成。但数据科学家缺乏选择正确工具、方法或算法的技术能力或知识。相反，数据科学家试图使用他们一直以来的方法来解决这个问题。当一个项目受阻时，加倍投入原有的方法很少奏效；团队应该寻找另一种方法。\n\
  \n也存在反例，即数据科学任务被分配给数据工程师。结果通常也不理想。\n\n## 长期项目管理\n\n当数据团队拥有类似于软件工程的长期项目时，组织需要制定一个总体路线图。这是因为数据团队需要与其他团队、部门及业务单元进行协调。路线图可以包括新技术的落地应用、新数据产品的创建，或对现有数据产品的改进。没有良好的计划，数据团队在创建和实施数据产品时将只能被动应对。\n\
  \n有些团队试图规划得过于遥远。近期计划——大约一年内——应该相对具体，明确指出细节；而超过一年的长期计划则应宽松得多，更多是概念性的。\n\n这是因为你的数据团队在一年内应该会发生变化。这些变化既可能是积极的，也可能是消极的。积极变化的例子：数据团队可能提升速度（参见第\
  \ 7 章“数据项目速度”部分），使得原本计划六个月的项目现在只需三个月。消极变化的例子：失去了一位项目资深成员或其他关键团队成员。原本计划由这位资深成员负责、耗时三个月的项目，现在可能分配给几位初级成员，耗时九个月。\n\
  \n过于长远的计划有可能忽视分布式系统演进的速度。规划三年后的情况，可能对数据团队产生巨大的技术影响。一项较新的技术，或者组织正在使用的技术的新版本，可能让你重新思考如何实现某个功能。而这种改变，反过来又会影响团队实现该功能所需的时间。这迫使团队必须制定新的计划或重新估算实现功能的时间。\n\
  \n## 技术选择\n\n管理者不被期望通晓数据团队所使用的技术，这些技术不仅复杂，而且不断在变化。本节内容面向管理者，旨在帮助他们评估技术，并引导数据团队做出有利于整个组织的选择。在某些部分，我会谈论特定的技术（尤其是编程语言），但我会解释管理者需要理解的关键概念。\n\
  \n\n\n### 新增或选择技术的心智框架\n\n管理层可以运用我在本节阐述的心智框架，帮助数据团队选择合适的技术。技术会来去更迭，但这个框架将始终如一。\n\
  \n当组织决定引入新技术时，我建议进行风险/回报评估。这包括明确新增技术的商业价值。该评估将有助于应对管理层对新增技术成本的任何质疑。通过设定商业价值，数据团队应能简洁地回答：引入某项技术后，能在公司内部实现什么。\n\
  \n请记住，并非所有技术都能直接增加商业价值；有些技术更具基础性。这些基础性技术将为未来预期中的用例提供支持，或使新功能的实现更快速、更便捷。\n\n管理层应理解新增技术的长期影响。这项技术或实现方式是否是一种最终会让我们后悔的糟糕变通方案？这可能需要与提出该技术的架构师或工程师进行一些非常尖锐且具有挑战性的对话。请记住，解决一个项目往往有多种不同方法。管理层会想知道还探索了哪些其他可能性，以及选择当前方案的原因。虽然管理层可能没有足够的技术背景来理解或中肯地评判这些选择，但他们可以尝试理解决策背后的动机。\n\
  \n警惕\"新技术能让一切变得更简单\"的承诺。这种承诺可能来自团队内部，也可能是推动新技术的供应商。新增技术可能会让某些部分变得更容易，却让其他部分更加复杂。对于某些技术，你可能需要数月甚至数年才能看到其收益。在我看来，分布式系统不可能变得简单。某些部分可以简化，但改进是有限的。当我开始听到供应商告诉我他们的分布式系统很简单时，我会立刻警觉起来，并建议检查一下他们还在哪些方面撒谎或过度承诺。\n\
  \n因此，管理者有时可以提前避免错误选择。当组织招聘架构师或首席工程师时，应询问候选人倾向于选择新技术的程度。问问他们，当他们引入一项新技术或设计时发生了什么。它真的达到了他们预期的效果吗？如果没有，他们是如何应对的？他们是试图掩盖问题、推卸责任，还是努力降低自身和组织的风险？组织应尽量避免雇佣那些有意或无意地为系统增加复杂性的人——因为他们增添复杂性的理由可能全都是错的。\n\
  \n### 约束技术选择\n\n管理者在面对采购技术的请求时，往往会提出反对。他们会问，数据团队真的需要 10 到 30 种不同的技术吗？他们理所当然地认为数据工程团队是在过度设计解决方案，或者是在为简历贴金。他们考虑了每种技术投入运营所需的成本，并断定这些技术并非数据产品真正所需。\n\
  \n我遇到的第二种常见反对意见是，分布式系统技术是否真的像我描述的那样复杂。这种感受可能源于将大数据团队与组织内的其他软件工程或数据仓库团队进行比较，后者在处理相同任务时表面上看效率更高。这种看法又回到了之前提到的管理层误解。数据团队需要与\
  \ 10 到 30 种不同的技术打交道（而且确实需要），才能取得成功，而软件工程和数据仓库团队只使用一到三种技术。管理层通常会接着问，为什么数据团队不能只用一到三种技术，或者把他们要求的\
  \ 10 到 30 种不同技术合并成少数几种？\n\n答案源于我在第 8 章\"用例与技术选择\"一节中的观察。当数据团队交付数据产品时，他们是在为特定的用例进行优化。一项尚未成为你技术生态一部分的新技术，可能正是该用例的更好选择。通过专注于赋能该用例，数据团队必须为工作选择正确的工具，而这可能意味着要投入运营一项新技术。\n\
  \n作为管理层，对引入新技术持反对意见是允许的。这是因为数据团队选择新技术的动机并不总是最佳或最无私的。这些利己的技术选择可能源于对当前组织使用的技术感到厌倦。也可能是数据工程师觉得自己的简历停滞不前，没有填满最新最好的技术。他们正准备离开组织，需要确保简历上显示出自己正在做新鲜且令人兴奋的事情。\n\
  \n然而，大多数情况下，他们的理由是为工作选择正确的工具。\n\n无论如何，引入新技术都伴随着固有的成本。在新增技术时，必须有一个清晰且有利的商业案例，证明该新技术能够实现或加速某种价值。\n\
  \n#### 爱上讨厌技术\n\n很多人告诉过我，在为未来项目选择技术时他们倍感压力。我认为这项任务的主要问题在于包含太多未知因素。有未来项目的需求和规模的未知因素。还有那些你可能没有一手经验的新技术的未知因素。最重要的是，我们被最新、最酷技术的广告狂轰滥炸，而事实上，当我们选择了那些变得有市场价值的技术时，我们还能获得经济回报。那么，该做什么，从何开始？\n\
  \n以下建议适用于那些希望项目成功，同时也能为未来布局的人。学会只选择你讨厌的技术，并且努力每天讨厌更多的技术。这乍听起来可能是个古怪的建议，但请听我说一分钟。\n\
  \n当你对某项技术了解得更多时，你就会知道它能做什么，不能做什么。我发现，最佳的技术选择发生在你完全清楚一个技术的缺点，但它仍然是完成该任务的最佳技术时。如果你遵循这个范式，你就绝不会陷入以下陷阱：\n\
  \n-   被过度承诺的技术\n-   需要超高端人才来管理的技术\n-   解决你并不存在的问题的技术\n\n——泰德·马拉斯卡，作家，Capital One\
  \ 企业架构总监\n\n\n\n### 编程语言支持\n\n企业甚至小型组织可能会使用多种不同的编程语言。虽然有些组织试图统一使用单一语言，但由于数据科学团队和数据工程团队的混合需求，这并非总是可行。另一些组织则将编程语言的选择权完全交给数据团队，希望他们能为工作选用合适的工具。这可能导致生产系统中出现多种多样的编程语言。由于数据需要被暴露出来，你将需要处理如何将数据产品暴露到每种语言中的问题。\n\
  \n将数据产品暴露出来——而非仅仅提供一个 API 端点——是数据产品与纯软件产品之间的关键区别之一。管理者和技术决策者在决定是否支持某种语言时，需要将如何向该语言暴露数据产品纳入考量。\n\
  \n不同编程语言对分布式系统的支持程度差异显著。有些语言提供一流的支持，而另一些则仅提供准一流支持。在后者的情况下，该语言只能部分跟上最新特性，但在最新功能方面会有所滞后。\n\
  \n还有一些语言以独立开源项目的形式提供支持。例如，某个分布式系统可能是 Apache 基金会的一个项目，仅支持单一语言。项目外的人若看到需求或有意愿支持自己选择的语言，便会创建自己的实现来支持该分布式系统。\n\
  \n通常，这些其他语言的支持实现会托管在 GitHub 上。但这些实现的水平参差不齐。有些源于个人的热情，而另一些则是由公司为满足自身需求而创建的。我通常建议组织选择那些已在企业投入生产、并为成熟公司创造价值的实现。这些项目更有可能获得所需的持续维护和关注。\n\
  \n#### 数据科学家使用的语言\n\n数据科学家主要使用 Python，但也有一些使用与 Java 库兼容的 Scala。绝大多数面向数据科学家的产品都会提供\
  \ Python API，有时也会提供其他语言的接口。\n\n**JVM 的价值**\n\n这里需要一些技术背景知识。\n\nJava 会被转换（编译）成一种快速运行的格式，并在一个名为\
  \ Java 虚拟机（JVM）的框架内运行。许多其他语言被设计为编译到同一个 JVM 上，因此它们可以轻松地与 Java 协同工作，并充分利用 Java 中创建的众多强大库。除\
  \ Java 之外，Scala 是最流行的基于 JVM 的语言。Scala 拥有比 Java 更现代的一些编程语言特性，并且占用的空间更少，因此编码速度通常也更快。\n\
  \n数据科学团队是数据工程团队创建的数据产品的消费者。数据工程团队通过使用正确的技术来暴露数据项目，这有助于缓解非 Java 语言支持的限制。由于数据工程师已经正确地暴露了数据产品，因此可能并不需要最新或完整的语言支持特性。\n\
  \n#### 数据工程师使用的语言\n\n数据工程师主要使用 Java 进行工作。有些团队会使用 Scala，通常与 Java 结合使用。还有一些团队会使用 Python。\n\
  \n作为数据产品的创建者，数据工程师承担了主要的技术重任。他们面临着数据团队职责中技术挑战性最高的部分：创建和暴露数据产品。这种技术挑战要求数据工程师手头拥有尽可能多的工具来正确暴露数据产品。语言的选择直接影响到他们甚至能否选择某种技术，因为该技术可能没有团队所选语言支持的\
  \ API。对你所选语言支持的缺失，可能意味着某个用例无法实现，或者团队必须等到分布式系统开始支持该语言。对于闭源和开源技术而言，这都可能需要数月甚至数年的时间。\n\
  \n大多数分布式系统——尤其是大数据技术——都会优先以 Java 为目标并提供支持。这是因为该技术或分布式系统本身就是在 JVM 上编程运行的（参见本章前面的边栏“JVM\
  \ 的价值”）。\n\n#### 跨语言暴露数据\n\n在跨语言暴露数据产品时，存在几个问题。应该使用哪种格式？如何处理不同语言类型系统间的差异？这个类型是浮点数还是整数？整数的大小是多少：32\
  \ 位还是 64 位？整数是有符号还是无符号？\n\n这些问题中的每一个听起来可能像是无关紧要的计算机科学主题，但它们确实重要。错误的类型可能意味着报告中计数正确与错误的天壤之别。要找出不准确报告的根源，可能需要花费数天时间，并深入探究编程语言内部的运作机制。这正是“一盎司的预防胜过一磅的治疗”的典型场景。\n\
  \n架构师和数据工程师需要在这些问题出现之前就想好周全的应对方案。像 Google 的 Protobuf 和 Apache Avro 这样的二进制格式通常被用来解决这些问题。请将本节内容视为一个强烈建议：务必把暴露数据产品的这一关键部分做对。\n\
  \n\n\n### 项目管理\n\n在项目管理方面，数据团队通常使用`看板`或某种版本的`Scrum`。`看板`和`Scrum`也可以结合使用。\n\n项目管理框架的选择部分取决于项目预估所需的时长。数据工程团队的需求可能与传统软件工程团队相似或略有不同。对于更传统的软件开发任务，`Scrum`风格的框架效果不错。更传统的任务是指类似于传统软件项目的长期项目。\n\
  \n对于其他需要更快完成的任务和项目，`Scrum`风格的框架可能过于繁琐。这会降低响应速度，并增加在短期任务报告上的时间投入。对于这类运营模式，`看板`可能是合适的项目管理框架。\n\
  \n数据科学团队对项目管理框架有独特而具体的需求。对于数据科学团队而言，阅读学术论文以准备项目并不适合`Scrum`框架。团队专注于实验，并可能面临假设被推翻的情况，这也不适合`Scrum`风格。这使得数据科学团队只能选择`看板`或其他低开销或无开销的项目管理框架。一些数据科学团队会创建适合自己工作风格的自有项目管理框架。\n\
  \n运维团队可能倾向于使用`看板`项目管理框架。这能让运维团队跟踪并优先处理任何非关键性工作。\n\n我发现有些团队仍在沿用瀑布模型或类似衍生方法，我建议转向`敏捷`框架。这是因为数据工程团队——尤其是新成立的数据工程团队——需要在短期内开始展示价值。遵循瀑布时间表会阻碍团队在数年之内展示价值或创建数据产品。\n\
  \n如果数据科学团队不使用`Scrum`，他们应如何与使用`Scrum`的数据工程团队整合或协作呢？例如，数据工程团队可能以两周为周期冲刺，而数据科学团队正在处理开放式或设定了时间限制的项目。\n\
  \n在这种情况下，一些组织会等到数据科学家完成某项工作后，再将其安排到冲刺周期中。另一些组织则会降低数据工程团队的工作饱和度，以便有时间与数据科学团队互动。例如，如果数据工程团队通常负载率是\
  \ 90%，管理者会将其降低到 70%或其他合适的比例，以便留出额外时间与数据科学家协作。\n\n## 当一切进展不顺时\n\n有时，即使你作为管理者尽了最大努力，项目仍会偏离正轨。这需要额外的主动性来找出并解决问题根源——通常有多个根源。仅仅找出问题所在就可能极其困难。根据我的经验，数据团队中的问题不会自行纠正，需要付出协调一致的努力。\n\
  \n你可能见过图表上的误差线。它们显示了进行测量或数据采集时测量的误差范围。\n\n![../images/499628_1_En_9_Chapter/499628_1_En_9_Fig1_HTML.png](img/499628_1_En_9_Fig1_HTML.png)\n\
  \n图 9-1\n\n大数据项目的风险/回报比远高于小数据项目\n\n对于小数据项目，其误差线相对较小。即便如此，当一个小数据项目偏离轨道时，修复它可能需要数周、数月甚至一年。而对于分布式系统，项目的误差线则要大得多。这意味着项目失败的可能性可能比你以往经历的任何情况都要严重。（从积极方面看，它也可能成功，并产生远超你想象的价值。）一个偏离轨道的大数据项目，修复起来可能需要数月或数年。\n\
  \n只有通过适当的规划、合适的团队和正确的资源，团队才有机会成功。管理层需要持续关注项目是否偏离轨道的迹象。根据我的经验，拯救一个项目永远不嫌晚。项目越老，拯救它所需的时间和经济成本就越高。话虽如此，如果一家公司考虑关停其大数据项目，很可能是因为时间流逝太多，而价值产出太少。我建议以本书为指导，找出需要采取哪些措施才能使项目重新取得进展。这将为管理层提供具体的步骤和变革措施，可以与那些支持关停项目的管理团队成员分享。\n\
  \n## 警惕高阶后果\n\n通常，问题的真正原因被隐藏了，你看到的是三阶、四阶或五阶后果。由于时间和篇幅限制，我无法一一列举所有问题的具体表现。只需知道，随着团队的进步和速度的提升，后续还会出现更多问题。在本书中，我主要关注一阶和二阶后果以及最常见的长期后果。一些更成熟或历史更悠久的团队还会面临本书未涉及的额外问题。\n\
  \n仅举几例，让你有所了解：\n\n*   如何应对团队资深成员的离职？他们很可能掌握着系统运作的大部分“传说”。当团队中只剩下大多（如果不是全部）依赖老手解决难题的初学者时，该如何应对？更糟糕的是，如果项目老手是唯一能够高效产出的人，你该怎么办？\n\
  \n*   如果你的团队过于成功，以至于其他组织开始挖角你的员工，你该怎么办？当其他组织提供你的组织无法给予的高额加薪时，你该如何留住员工？\n\n这些仅仅是成功（有时是成功与失败的混合）所导致的三阶、四阶和五阶后果的几个例子。某些问题可能是行业特有的，公司内部的历史原因，或纯粹的政治问题。问题越具体，内部观察者可能越难看清，解决起来也越困难。\n\
  \n脚注 1\n\n"
- "# 10. 组建团队\n\n> *我们将找到一片成长的空间*  \n> *是的，我们才刚刚开始*  \n> ——卡朋特乐队《我们才刚刚开始》\n\n在前面的章节中，我们讨论了团队及其管理方法。本章将介绍组建团队和招聘首批成员的步骤与考量。对于已经开始招聘的组织来说，本章将提醒你本应完成的事项，或确认你做出的决定是否正确。\n\
  \n*   确保团队正确起步\n\n*   决定团队在组织中的位置\n\n*   如何处理原有团队的考量\n\n*   根据组织规模组建合适的团队\n\n* \
  \  数据团队的汇报结构应如何\n\n*   与人力资源部门协调职位头衔和薪酬\n\n\n\n"
- '# 建立新团队


  某些组织需要从零开始组建数据团队。这包括聘请或选择一位管理者来运营团队，随后还需要招聘团队中的个人贡献者。这对组织而言是一个绝佳的机会，可以从一开始就让团队和管理步入正轨。


  在规划招聘时间线时，务必牢记整个流程的筹备周期。你可能需要询问人力资源部门，从人员编制获批到新员工正式入职总共需要多长时间。HR 部门可能没有招聘数据团队成员的具体数据，但你可以用类似职位作为参考来估算时间。例如，如果软件工程师的平均招聘时间是三个月，那么可以假设数据工程师的招聘至少需要三个月——甚至更长。


  未能充分考虑招聘的筹备周期，可能导致团队从一开始就在项目计划中落后。此外，等到团队真正准备就绪或急需新成员时才开始招聘，也会让你陷入被动。理想情况下，团队应提前预估何时需要新成员，并在该时间点之前启动招聘流程，预留出平均所需的招聘月份。


  ## 首位数据工程师


  由于数据工程师是数据产品的创造者，我建议首先招聘数据工程师。他们需要着手为后续的数据团队成员做好一切准备。正如你将在第 11 章中看到的，在预备阶段就需要一位合格的数据工程师。这是因为只有合格的数据工程师才能在早期就数据团队该做什么、不该做什么做出关键判断。


  首位数据工程师必须开始搭建基础设施和数据产品。在此之前，其他数据团队成员基本上会处于闲置状态，等待数据产品的产出。在招聘下一位成员之前，这位独立或小组中的数据工程师可能需要进行多次迭代。


  **切勿优先招聘数据科学家**


  组建数据团队时，一个常见错误就是优先招聘数据科学家。这源于管理层和 HR 对数据科学家与数据工程师之间差异的误解。


  从零开始招聘时，会遇到一个"先有鸡还是先有蛋"的问题。正如你所读到的，数据团队之间紧密集成，你需要三个团队。但当开始招聘时，你必须从一个人开始。有些组织招聘数据科学家，认为尽快开始分析工作能带来最大价值。这种想法的问题在于，数据科学家往往缺乏数据工程技能，甚至无法收集足够的数据来开始分析。正如我提到的，数据科学家是数据产品的消费者，而数据产品是由数据工程师创造的。


  此外，许多数据科学家非常讨厌做数据工程工作。这两个群体之间确实存在不同的思维方式。一些数据科学家加入团队时，期望组织不久后能招聘数据工程师。如果组织没有招聘数据工程师，数据科学家可能会在六个月左右后离职。


  ## 首位数据科学家


  当组织搭建好数据管道和数据基础设施后，就应该招聘数据科学家了。在此之前，数据科学家的时间大多会在等待数据产品和用于检验假设的基础设施中闲置。这是因为数据科学家是数据产品的消费者，而非创造者。


  ## 运维人员


  在将数据管道投入生产之前，组织需要招聘运维工程师。对于某些组织和应用场景，可能需要更早招聘运维人员。当所创建的系统相当复杂，且运维工程师需要更多时间来熟悉数据管道时，就会出现这种情况。


  有些组织采用 DevOps 实践，由数据工程团队负责分布式系统的运维。管理团队需要确保数据工程团队获得学习如何运维他们需要维护的分布式系统的资源。


  如果一个组织不采用 DevOps，却仍期望数据工程团队处理所有支持工作，可能会引发若干问题。一些数据工程师非常不喜欢执行运维任务，可能会离职。另一种情况是，数据工程师并非最佳的运维支持人员，因为支持系统需要不同的思维方式，而有些数据工程师缺乏这一点。一个在支持生产系统时不够谨慎的数据工程师可能会导致数据丢失。此外，处理运维工作带来的持续压力使工程师无法专注于他们创建数据管道的主要工作。如果这种情况频繁发生，数据工程师将无法取得进展。


  在任何情况下，即使使用了云服务，也需要人员来支持和运维集群。对于某些组织来说，这可能涉及 24/7 的支持服务级别协议。专业的运维人员是唯一能够承担并应该被期望承担此类责任的人。


  随着运维团队成员的加入，管理层应期望运维工程师能够减轻数据工程师的运维和支持负担。对于一个全新的数据管道，运维团队的初始支持可能仅限于更通用的运维工作。随着时间的推移，运维团队应积累更多经验，并为其他数据团队承担更重要的支持责任。


  ## 关键的首次招聘


  整个数据团队招聘的第一个人，以及各个团队内部招聘的第一个人，都是关键招聘。在这个阶段，没有人能对糟糕的想法提出反对意见，这第一位员工将做出所有决策。这种"一人秀"在数据产品的成败中扮演着至关重要的角色。你作为管理者的职责，就是为这个职位找到合适的人选。


  这第一位员工为后来者奠定基础，并初步搭建数据产品的基石。他们的决策——无论是好是坏，或好坏参半——都将影响后来加入的每一个人。糟糕的选择可能产生极其深远的影响。


  错误的决策、架构问题以及糟糕的技术选型会让你陷入困境。分布式系统的使用会放大这些问题。这意味着你不可能仅用一周时间重写代码或修复架构。通常，代码重写和架构变更可能需要数月乃至一整年。


  这第一位员工还会奠定团队的技术文化，从而吸引或排斥未来的候选人和员工。这第一位员工决定了以下核心问题：


  -   这是一个害怕批评和反馈的团队吗？

  -   这是一个注重最佳实践和迭代的团队吗？

  -   他们的设计是否糟糕到让新求职者不愿接手？

  -   他们的设计是否优秀到让求职者意识到他们可以从中学习？


  如你所见，良好的数据工程文化能够吸引合适的人才。从外部来看，候选人会感知到团队正在使用的优秀实践，并希望成为其中一员。他们会看到自己可以在这个团队中学习和进步。此外，良好的数据工程文化也会自动筛选掉那些不愿遵循最佳实践的人。


  糟糕或不良的数据工程文化则可能吓跑优秀的候选人。从外部看，他们能看到由糟糕的技术选型和有问题架构所引发的混乱和问题。


  '
- '# 数据团队的位置与状态


  日常运作和组织结构要么促进、要么削弱数据团队的有效性。




  ### 将数据团队嵌入业务单元


  一个常见的决策是，是否将数据团队成员嵌入到业务单元中。当业务单元觉得自身用例或需求没有得到足够重视时，高管有时会采取这种做法。他们认为，获得关注度的唯一方式就是拥有专属人员。这种抱怨可能源于真实需求，也可能是数据团队未能正确或公平地确定优先级的结果。无论如何，由于其对数据团队的影响，这一决策需要慎重考虑。


  一个需要考虑的问题是，将数据工程师和数据科学家调离核心团队可能会让他们感到无聊或不满。业务单元的用例可能本身就枯燥乏味，这或许正是没人愿意接手的原因。枯燥的项目会导致员工不快乐，而不快乐的员工往往会寻找团队或组织外的工作机会。你嵌入人员的业务单元，可能会变成员工离职的跳板。


  为防止无聊和不满情绪，组织可能需要采取措施来规避这些问题。这可以包括让团队成员定期轮换进出业务单元。轮换至少能给团队成员一个期限，之后他们就能调回核心团队，也许还能接手更有趣的项目。


  决定轮换能否成功的关键变量，是业务单元所需的领域知识深度。如果业务单元对领域知识要求相对较低，人员轮换会更轻松、更迅速。如果业务单元对领域知识要求很高，那么人员轮换就会变得困难。在这一点上，管理层确实需要在提升领域知识和防止员工离职之间找到良好的平衡点。


  另一种方法是，让业务单元员工与数据团队的一名或多名成员建立虚线汇报关系。这意味着该人员仍是数据团队成员，但其奖励基于满足业务单元需求的情况。这有助于数据团队成员应对孤立感——当一个人处理数据团队的问题，但身边没有其他数据团队成员以保持理性时，这种感觉便会滋生。


  困扰自行招聘人员的业务单元的一个大问题是，招聘经理对如何招聘数据科学家或数据工程师几乎一无所知。这种知识的匮乏通常会导致业务单元招聘到错误的人选或不合格的人选。这反过来又给数据团队增加了压力，他们既要支持业务单元，又要与一个有问题且难以开展工作的招聘对象协作，试图共同完成任务。随着时间的推移，这些分散的数据科学家或数据工程师接触不到组织的最佳实践或工具，培训和发展也缺乏一致性。


  ### 中心辐射模式


  组织内部工作的另一种变体是中心辐射模式。该模式以一个集中的中心团队为特征。当团队规模足够大时，部分团队成员可以脱离出来，在业务单元内部直接创建一个辐射点。


  这种模式的好处在于，分散出去的团队成员仍能与中心团队保持紧密联系，并能继续推行最佳实践。


  ### 卓越中心


  一些组织选择设立卓越中心。根据组织规模，该卓越中心可能是企业级团队的一部分，也可能设在某个业务单元内。这个卓越中心团队的任务是创建并示范组织内的最佳实践。


  要使卓越中心发挥作用，管理者需要确保该团队真正地示范并应用最佳实践。否则，卓越中心将会传播问题和功能障碍，导致组织内部的团队表现不佳或失败。


  ### 数据民主化


  还有一些组织则走了一条简单的路：仅向业务单元提供数据。这种方法通常被称为*数据民主化*或*自助服务*。组织创建数据以及用于运行分析的基础设施，但有时却没有人专门负责执行分析。一些组织会采用混合模式，既有团队被明确指定负责分析，也有团队可以根据需要自行进行分析。


  在提供数据时，请记住：当每个人都对某项任务负责时，最终会没人去做。每个团队手头的工作已经够多了。除非团队真的迫切需要分析，否则增加一项可选任务只会石沉大海。


  这种方法也倾向于低估执行分析的复杂性。即使数据工程团队在数据产品交付方面做得很好，执行分析的复杂性仍然会悄然而至。这可能意味着有很多不同的人都在尝试进行分析，却无法胜任。


  有时，数据民主化的真正症结在于组织缺乏资源——尤其是在教育和学习方面——这决定了业务单元能否实现自助服务。没有这些资源，组织其他部门可能会编写性能低劣的代码，或者根本无法执行分析。


  当组织处理敏感数据时，数据民主化还会引发安全问题。应谨慎核实并验证组织安全策略的有效性，以确保敏感数据的安全。


  #### 成功的数据民主化


  早期采用 Hadoop 的组织，往往几乎是偶然地走上了数据民主化之路，这得益于早期 Hadoop 版本有限的功能集。运营一个 Hadoop 集群的成本促使组织倾向于使用一个包含所有数据的单一大型集群，而访问控制的薄弱支持则导致数据被广泛访问。此外，缺乏对事务和可变数据存储的支持，迫使采用者基于不可变数据集和数据管道开展工作流程。不可变数据可以共享且运营风险很低，因此，在基于管道的处理环境中，数据重用的摩擦极小。早期的
  Hadoop 采用者通常是快速增长且频繁变化的组织，他们乐于接受新的工作流程。结果，他们有效地打破了数据孤岛，一个团队的数据可以被用于整个组织的创新。企业级 Hadoop
  的采用却未能产生同样的民主化效果；企业不太愿意改变工作流程，而 Hadoop 供应商则反而加强了细粒度访问控制和数据可变性的支持，这讽刺地削弱了 Hadoop
  的颠覆性影响。


  在一个数据未实现民主化的组织中，获取数据访问权限可能颇具挑战。一个拥有创新想法的功能团队，若其所需数据由其他团队的系统掌管，就必须获得这些团队的关注。他们需要支持来提取数据，需要文档来理解数据，需要帮助将数据从源系统的内部结构中转换出来，并且需要运营协作以避免影响生产源系统。完成所有这些步骤，源系统团队都需要在待办事项中分配时间。这种待办事项和优先级的同步，为数据驱动的创新增加了阻力。在一个数据（包括元数据和文档）实现了民主化的组织中，一个功能团队能够将数据驱动的功能更快地投入生产环境。




  '
- '# 数据平台团队与团队动态


  数据平台团队是成功实现数据民主化的关键。他们的激励措施和成功定义应与分析团队和功能团队的成功定义保持一致，同时需要管理全局风险。数据平台团队的产品经理肩负着一项微妙的任务：既要平衡功能团队无障碍使用数据的愿望，又要维护必要的治理和安全实践。平台团队与功能团队之间存在关系紧张的风险，尤其当它们地理位置分散时。实践证明，在不同团队之间进行人员调动是克服这种紧张关系的有效方法。将平台团队成员派驻到内部客户中，可以为平台开发提供高效的反馈。同样，让功能团队成员临时参与构建平台功能，也有助于他们理解平台的限制条件。


  ——拉尔斯·阿尔伯特森，Mapflat 创始人


  ## 从一开始就组建合适的团队


  本书的前几章描述了每个大数据项目都应拥有的三个主要团队，以及所需的基本技能组合。组建团队之初会面临特殊的挑战，下文将针对不同类型的组织进行说明。


  ### 数据科学初创公司


  如果你的业务专注于数据科学，无论是作为咨询公司，还是服务于像药物开发这样的单一项目，你都会感到很大的压力，希望立即着手并进行一些数据科学工作。


  除非你运气很好，否则你仍然需要第二部分中描述的所有三个数据团队。一个仅由数据科学家组成的团队会在数据工程环节遇到麻烦，并产生需要日后偿还的技术债务。


  ### 缺乏数据焦点的公司


  有些组织在其专业领域（如制造业、零售业、医疗保健）非常出色，但在 IT 方面却表现不佳。即使处理小规模数据，它们也常常勉力维持或能力不足。像这样的组织可能无法成功整合数据并从数据中获取洞察，因为这并非其强项。


  请考虑你的公司是否具备管理数据和 IT 的技能，以及是否准备好迎接成为技术驱动型公司所需的重大变革。你应该尝试利用分析的优势，但或许可以通过将工作外包给拥有相关专业知识的承包商来实现。


  并且需要注意：从大数据中获益的真正难点不在于数据收集和分析推导。真正的难点在于弄清楚分析如何能促进你组织内部有意义的行为改变，并有足够的毅力去贯彻执行分析师所建议的变革。


  一些组织错误地认为自己已经准备好组建自己的数据团队。这种错误认知可能源于组织正在使用现成程序进行分析，或者正在利用咨询公司的服务。某个组织可能是现成程序的高级用户，但可能远未达到创建自身数据产品所需的技术水平。当一个组织使用咨询公司时，顾问可能正在处理实施过程中最困难的部分，而组织内部人员实际上是在他们的辛勤工作成果上“搭便车”。那些没有诚实评估自身核心能力的组织，可能会以艰难的方式发现那些由他人代为处理的复杂问题。


  ### 小型组织和初创公司


  在小型组织中，每一次招聘都是重大决策，因为增加人员的机会很少。数据团队的第一个成员反映了组织认为最重要或最佳的投资方向在哪里。


  小型组织往往缺乏资源来招聘数据团队所需的所有成员。当一个人必须承担三个数据团队的任务时，招聘经理只能退而求其次，选择那些在这些领域技能不均的人，并且必须决定哪些优势最为重要。


  我建议处于这种情况的人寻找一位具备一定分析知识的数据工程师。如果存在商业智能团队，数据工程师可以开始与该团队合作，利用数据工程师创建的数据产品来开始创建分析报告。在此期间，应为你招聘数据科学家和其他员工的下一个阶段，预先为这位数据工程师做好安排。


  你也可能会发现，你所需的分析并没有最初想象的那么复杂，因此可以由数据工程师来完成。如果需要延迟或寻找其他途径来开始使用你向投资者承诺的那些精巧的机器学习模型，让数据工程师忙于管理你的数据也是有用的。


  如果你先招聘了数据科学家，请记住，会有一段时期，即使是技术能力更强的数据科学家也在创造技术债务（见第 3 章“数据科学团队中的技术债务”部分），这你日后需要偿还。预计从你招聘数据科学家到招聘第一位数据工程师之间，技术债务会不断增加。


  此外，你可能还没有招聘运维人员。如果幸运的话，你的数据工程师可能会对 DevOps 有所了解。这迫使你尽可能减少运维负载，可能的方法是利用大量的云托管服务。正如我在第
  5 章“云系统与本地系统”部分提到的，这些服务并不能完全消除运维需求，但它们确实能显著降低运维开销。是的，托管服务比自行构建的路径更昂贵，但内部自行构建的成本优势很快就会被第一次重大且耗时的事故所吞噬。


  同时要记住，你的员工花在运维上的时间越多，他们编写的代码就越少。


  #### 错误招聘的后果


  小型团队发现自己处于危险的境地，因为他们只有足够招聘一个人的预算，而这个人还要负责招聘后续的团队成员。


  如果你招聘了一个不理解数据科学要求或你业务需求的人，那么后续的招聘将会多次复制这个错误决定。你招聘的第一个人实际上可能会拒绝那些可能超越他或表现更出色的优秀候选人。他们的架构和设计决策可能会让优秀人才望而却步，因为没人愿意整天收拾别人的烂摊子，或者从一开始就发现自己在与自己的经理作斗争。


  因此，对于初创团队而言，第一个人是至关重要的招聘。纠正这个决定带来的后果可能需要数月甚至数年时间。


  这就引出了一个问题：招聘一个看起来合理的候选人（即使你对其能力有所怀疑），是否比推迟启动数据团队更好？根据我的经验，等待并找到合适的人是值得的。




  #### 只招聘初级员工的后果


  一些组织试图通过招聘数名初级员工来替代一名顶尖资深员工，以此规避招聘环节的问题。这些组织的逻辑是，团队的技术水平会趋于平均，一名成员可以弥补另一名成员留下的任何漏洞。无论如何，总会有足够的人力来编写代码。如果出现问题，也会有一大群人共同解决。


  但现实是，一群初级员工并不具备互补的技能。他们在该做什么的问题上都停留在初学者的理解层面。管理者们想象出一张饼图，其中有十个空白区域，代表了数据团队所需的各项技能（图
  10-1）。在他们看来，这些初级员工会分散开来，恰好填补所有十个空白区域，仅在每个人并非百分之百掌握某项技能的地方留下一点点空隙。这张想象中的饼图被填充了 90%到
  95%。但这并非现实。实际上，饼图只被填充了 10%，因为这些初级员工的技能和能力是相互重叠的。


  ![../images/499628_1_En_10_Chapter/499628_1_En_10_Fig1_HTML.jpg](img/499628_1_En_10_Fig1_HTML.jpg)


  **图 10-1** 新手彼此重叠，而正确的团队则相互补充


  通常，这类团队的成功纯粹是运气使然，就像看一座每天只准两次的停摆时钟。你可能最终发现一名潜力巨大、表现远超其资历的初级员工。但这种可能性不大——最好还是花钱请一位经验丰富的人，然后再用这位经验丰富者可以培训的初级员工来填充组织架构图。


  ### 中型组织


  这是一种已经设有 IT 或软件工程职能的组织。IT 部门中的一些软件工程师可能具备成为数据工程师的潜质。有些软件工程师甚至可能已经完成过一些数据工程项目。在数据科学方面，公司内部应该已经有一个分析或商业智能团队。


  很自然地，你会考虑用你信任且了解其技能的员工来组建你的数据团队。但要注意，不要扰乱现有的公司职能和内部政治。你的软件工程或商业智能团队将会失去一名成员。通常，这些员工是团队中的资深成员，这可能会给团队带来相当大的损失。调动的员工也有现有的项目和职责。要确保该人员不会在新数据工程团队和原软件工程团队之间左右为难。如果该人员不断被以前的职责打断，将无法取得进展。


  有时，中型组织的管理层可能怀有远超其预算和团队产出能力的宏大抱负。这些组织往往会在模仿某些前沿公司的架构或从会议上听来的想法上陷入困境。^(²⁵) 这些项目和团队往往毫无进展，无法在重要事情上取得任何进步。一个组织或许有可能复制前沿公司的能力，但这可能需要很长时间才能实现。如此长的时间周期既不令人兴奋，也无法创造足够价值，项目最终会被取消。


  与其复制那些似乎对别的公司有效的东西，不如寻找能够从数据中为你的组织创造独特价值的项目。你的组织和客户如何能从数据中受益？合适的项目能让高管们兴奋不已，并获得更多资金支持。相比之下，那些陷入困境或产出价值低于团队成本的项目则往往会被缩减或取消。


  总的来说，中型组织需要明确在何处投入资源。它们恰好庞大到容易野心过大，同时又足够小，能够真切感受到数据项目毫无进展的痛苦。以正确方式开展的数据项目，确实可以成为推动中型组织实现显著增长的催化剂。


  ### 大型组织


  大型组织通常有额外收入来投资数据团队并吸引优秀候选人，因此那里的主要问题往往在于政治。这些政治问题可能源于各种前因，如公司合并、不同的指挥链或部门，以及国家或文化差异。


  无论政治问题的根源是什么，其表现都是数据被隔离成许多不同的碎片。你可能听到数据分析师或数据科学家抱怨，他们无法从一个团队获取所需的所有数据，或者将所有数据集中到一个地方需要花费太长时间。在处理这些项目时，请确保你理解这既是一个技术问题（整合和协调多个不同的数据集），也是一个管理问题（应对不同的组织文化和竞争）。如果你让一线员工日复一日地独自应对这些政治斗争，他们很可能会选择离开。


  同样，大型组织缓慢地解决已识别问题或进行任何其他变革的步伐，对数据团队来说可能非常乏味。这种缺乏进展的状态会扼杀任何进步，让团队感到尽管付出了努力却陷入困境。在这些大型组织中，你可能被迫与那些从未合作过的部门，或者因表现不佳而令人畏惧的部门合作。然而，你必须想办法与他们共事。


  另一个问题可能源于组织从没有一个数据团队迅速发展到 20 到 30 人。这可能导致僵局，所有 30 个人都无所事事，等待数据或某人提供某些东西。特别是数据科学家，在等待可用的数据和基础设施时往往会闲置。这给数据工程团队带来了更高压力，要求他们创建所需的东西——常常投入超出平均工时的劳动——而数据科学家则在抱怨无事可做。教训是：在实现基础能力（即数据科学家可以使用的技术和数据集）之前，不要将团队规模扩大。


  在大型组织中，有时一线员工的最大资产就是他们对组织的独特之处和历史渊源的了解。我听说过这些人被称为数据考古学家。你可能需要让这些人留在团队中，以便挖掘或讲述发生了什么。这些人是数据团队领域知识中宝贵的一部分。


  ## 汇报结构应该是什么样的？


  数据团队的汇报结构对于业务如何与数据团队互动至关重要。正确的汇报结构可以带来组织目标一致和共同愿景。错误的汇报结构则可能导致摩擦、目标不重叠甚至相互冲突。


  在合适的领导下，数据团队可以变得更具生产力。为数据团队找到合适的领导可能具有挑战性，因为并非每个部门都天然适合数据团队的活动和角色。


  让我们考虑一些可能领导所有数据团队的领导者人选。根据组织的规模，数据团队可能会向该高管部门下的一位负责人汇报。




  ### 工程副总裁


  一位具备扎实数学背景的**工程副总裁**可能是不错的人选。他们的数学经验或许能让他们适应数据科学固有的不确定性。**工程副总裁**可能对统计学有足够了解，能够从宏观层面理解数据科学家使用的部分数学和概念。


  熟悉统计学不仅有助于他们理解统计模型（在宏观层面，这种理解可能并非必需），更重要的是能让他们对数据科学项目抱持合理的预期。项目目标往往是推翻一个假设。团队可能会在研究了几个月后报告说，某个项目或想法不可行。这种情况在软件工程中并不存在，对领导层来说可能是一个残酷的警醒。


  一位缺乏统计学知识的**工程副总裁**可能适合管理数据工程和运维，但并不适合管理数据科学。


  有些人认为，数据工程团队必须成为更大规模工程组织的一部分。否则，数据工程会被认为不是真正的工程。而相应地，组织中的其他部门可能不会认为数据工程团队与其他软件工程师拥有同等的软件工程背景。这可能导致内耗，以及数据工程师所需的与软件工程团队的合作匮乏。


  ### 首席技术官（CTO）


  **首席技术官**的背景可能与前面描述的**工程副总裁**不尽相同。**CTO**可能以类似的方式从基层晋升，甚至可能担任过**工程副总裁**一职。和**工程副总裁**一样，决策的关键在于他们对数学的适应程度。如果他们对统计学感到不适应，那么他们或许适合管理数据工程和运维，但不适合管理数据科学。


  ### 首席执行官（CEO）


  **首席执行官**有很多想法，如果执行得当，这无疑是好事。但想法太多也可能意味着**CEO**是“随风而动”的。这意味着**CEO**领导下的数据团队可能每天都会收到全新的优先任务。这显然不是团队所处的理想位置。


  如果一个团队接到一项需要数周或数月才能完成的新优先任务，他们至少需要花一天时间来规划。如果**CEO**接着又下达另一项需要数周或数月才能完成的任务，团队第二天又得重新规划。如果每天都源源不断地接到全新的任务，团队最终会把所有时间都花在规划上，而无法执行。


  这种荒谬的循环最终会发展到团队干脆停止规划，只是坐等——因为他们知道，花在设计或实施项目上的任何时间最终都会被浪费掉。到了这一步，团队成员就会开始纷纷离职。


  ### 首席信息官（CIO）


  **首席信息官**的头衔和职责可能千差万别。选择**CIO**作为数据团队的领导者，确实取决于组织对**CIO**的定义。有些**CIO**可能管理着软件工程团队或分析团队。鉴于他们已熟悉软件工程和分析两方面的需求，这些**CIO**可能是个不错的选择。另一些**CIO**则有不同的定义，更侧重于
  IT 支出和运维。这可能不适合数据团队。


  ### 市场副总裁


  **市场副总裁**可能不是数据团队的最佳管理者。他们可能过于关注数据科学的关键绩效指标，以至于没有足够的空间进行适当的实验、假设和接受失败。各组织的市场部门可能各不相同，但市场营销和数据工程可能并不十分契合。


  ### 产品副总裁


  **产品副总裁**可能不是数据团队的最佳归属。与**市场副总裁**类似，他们可能过于关注 KPI。他们也可能过于专注于打造产品，而忽视了能改善业务其他部分的数据。这可能导致在资源分配上产生争执和冲突，而这些资源本可用于削减成本或帮助业务提高效率。


  **产品副总裁**是另一个职责范围变化很大的职位。在某些组织中，软件工程和运维团队向其汇报。这对数据工程和运维团队来说可能是个合适的归属，但需要谨慎对待。


  ### 财务副总裁


  有人强烈推荐将数据科学团队置于**财务副总裁**之下。这是因为**财务副总裁**通常有良好的数学背景。如果他们学习过统计学这一数学分支，甚至可能对统计模型的不确定性感到适应。


  根据我的经验，**财务副总裁**可能会在成本方面过于严苛。尽管他们可能认可组建数据科学团队的价值和固有成本，但他们可能不理解要让（数据工程、数据科学、运维）三个团队都取得成功所需要的投入。这种困难可能源于他们没有意识到数据工程和运维中固有的复杂性。


  ### 首席数据官（CDO）


  **首席数据官**是一个新兴的角色，一些组织选择将其作为数据团队的归口部门。与任何新兴头衔或职位一样，**CDO**的定义在各组织中差异很大。在某些组织中，它可能是一位从技术管理岗位上成长起来的技术人员，也可能是一位几乎没有数据处理经验的人。有些**CDO**可能几乎没有管理数据团队的经验。另一些则可能来自高度监管的行业，其数据策略围绕防御性策略和心态展开，这可能会阻碍从数据中创造价值。


  ### 数据副总裁


  **数据副总裁**是另一个新兴角色。这可能是数据科学团队的合适归属。


  取决于**副总裁**的背景，他们可能在软件或数据工程方面拥有丰富的经验。但通常情况下，这个人是从数据科学家的岗位晋升上来的，因而缺乏软件或数据工程方面的背景。这可能导致此人不熟悉或无法强制执行取得成功所必需的工程严谨性。


  ## 与人力资源部门协作


  有些组织变革需要在组织架构图和纸面上完成，而不是通过代码和技术来实现。这意味着需要与组织的人力资源部门合作。与人力资源部门的合作范围可能很广，从快速沟通以确定职位描述，到像在迷宫般的企业人力资源体系中摸索前进。无论如何，人力资源部门都需要参与到有关数据团队所需变革的讨论中。


  人力资源方面的问题是管理层需要获得 C 级高管支持的部分原因。在创建数据团队的“为什么”、“是什么”和“怎么做”上，你可能会从人力资源部门那里遇到阻力。当常规的招聘策略失效时，人力资源部门的招聘环节可能会因招聘和录用数据团队的特殊性而陷入困境。你可能需要借助
  C 级高管的压力来推动解决人力资源方面的障碍。




  ### 这不仅仅关乎职位名称


  常见的反对意见之一围绕职位名称变更展开。人力资源部门可能会质疑新职位名称的必要性。例如，他们可能会问数据工程师与软件工程师有何不同。他们也可能质疑数据科学家与数据分析师或商业智能分析师的区别。


  人力资源部门的职责之一是定义职位的职责以及员工的薪酬。因此，你们的讨论涉及的是岗位描述和薪酬，而不仅仅是职位名称。


  数据工程师或数据科学家等专业化职位，其薪资预期高于非专业化人员。事实上，我认为数据工程师和数据科学家属于细分专业。例如，数据工程师是在分布式系统、软件工程和技术方面有专长的人。正是由于这些专长，数据工程师很可能不会接受软件工程师的薪资标准。


  一些组织会尝试将软件工程师的薪资标准定在高端水平，但这通常行不通，因为即使是高端薪资也不够高。其他组织则会尝试为数据团队成员提供一次性薪酬方案，并逐一处理每项薪资谈判。这种做法进展缓慢，并且占用了高管过多的时间。由于薪资指导方针过于严格，我的客户直接因此错失了一些杰出的候选人。


  这种对薪资的关注并不意味着这些数据团队成员贪财。他们选择进一步专业化是为了让自己的技能有更高的需求，从而获得更高的薪资水平。对于数据科学家来说，他们面临着偿还博士学业贷款的前景。纯粹从金钱角度来看，非专业化薪资通常比真正的专业薪资所对应的市场水平低
  20%到 40%甚至更多。


  ### 新增职位名称


  在大多数组织中，人力资源部门负责批准并将新职位名称添加到公认的职位分类列表中。说服人力资源部门认可新的专业化职位确实需要时间。我愿将本书作为说服人力资源部门、并展示专业化岗位描述与低技能岗位描述之间差异的一种手段。


  有些组织可能已经拥有数据团队成员的职位名称。在真正理解每个职位名称的实际职责后，你可能需要重新核对人力资源部门的岗位描述是否与实际情况相符。如果存在差异，你需要与人力资源部门合作，将岗位描述修正为更准确的定义。错误的岗位描述会引来不合适的人应聘空缺职位。有些组织还有额外的人力资源文书和描述，你需要查找并可能进行修正。


  #### 数据科学家职位名称


  将数据科学家这一职位添加到已批准的岗位描述列表中通常是比较容易的任务之一，这得益于数据科学家这一职位带来的热潮。许多人力资源人员都听说过它。由于内外都有压力要开始从事数据科学工作，人力资源人员可能已经在寻求新增这个职位名称。


  如果职位名称已存在，你需要确保其定义准确。这应包括日常工作任务。岗位描述还应明确数据科学家的实际技术期望以及团队所使用的语言。


  审视数据科学家的岗位要求。如果数据科学家的岗位描述要求博士学位，这真的反映了工作所需，还是反映了团队其他成员的教育水平？一些大学确实有数据科学项目，但尚不普遍。还有一些训练营和其他非博士项目也能培养出合格的数据科学家。岗位描述需要明确说明，这些训练营毕业生、没有数据科学专业背景的博士毕业生，或者没有博士学位的人是否可以接受。


  在一些组织中，有人推动将数据科学家这一职位进一步细分为更具体的部分。一些数据科学家可能更侧重于研究方面，或侧重于将数据科学应用于业务问题。另一些人可能专注于特定的技术领域，例如自然语言处理（NLP）或计算机视觉。一些组织会用不同于数据科学家的职位名称来列出这类专业。


  #### 数据工程师职位名称


  新增数据工程师职位名称难度可能更大。从人力资源角度来看，软件工程师和数据工程师之间的区别似乎是吹毛求疵。解释数据工程师处理的分布式系统与软件工程师处理的小型数据系统之间复杂性的提升，可能颇具挑战性。需要小心解释需要数据工程师这一职位名称的原因。


  如果职位名称已存在，请确保岗位描述定义准确。本书定义的数据工程师需要处理分布式系统和强大的编程背景，而一些对数据工程师的定义则侧重于小型数据和基于 SQL 的系统，与此不符。


  很少有大学将数据工程作为专业方向。一些数据工程师来自训练营，还有一些则是自学分布式系统和数据工程。确保岗位要求注明组织愿意接受的从业经验水平。


  #### 运维工程师职位名称


  新增运维工程师的职位名称——或者更准确地说，是运维领域内的这个专业方向——可能是说服人力资源部门最困难的事情。人力资源部门可能很难理解，排查和维护正在运行的分布式系统有多么困难。人力资源部门可能会说，任何运维工程师都能处理集群的运维工作。


  如果职位名称已存在，请确保岗位描述充分列出了运维工程师需要支持的分布式系统技术。数据团队中的大多数运维工程师出身于运维背景，并且刚开始专门从事分布式系统支持工作。




  ### 聚焦技术技能


  我发现 HR 的职位描述和筛选过于关注技术流行词汇。简历上有没有写上`X`分布式系统技术？HR 会默认，如果技术未列出，候选人必定无法胜任工作。而实际情况则要微妙得多。


  HR 应当明白，从小型数据技术迁移到分布式系统是一个重大跨越。分布式系统要复杂得多。人员必须以小型数据系统所不具备的方式来处理数据。这绝非不可实现的跨越，HR
  团队应当将这一因素纳入考量。


  从一个分布式系统迁移到另一个分布式系统则简单得多。例如，如果候选人熟悉与所需分布式系统相似的某系统，那么此人学习新分布式系统的难度通常会小很多。学习过程更多是理解两个分布式系统之间的差异，并熟悉新的
  API。从这个意义上说，从一个分布式系统迁移到另一个更像是一次横向移动。


  许多求职者没有分布式系统的专业经验。这在未来几年内仍将是常态，因为开设分布式系统课程的高校寥寥无几。新员工将面临渴望进入分布式系统领域却缺乏经验的困境。


  首先，分布式系统的专业经验与实际技能并非直接相关。有些简历看起来非常出色，但此人却根本不具备相应资质。在没有实际经验的情况下学习分布式系统技术是可能的。这仍然取决于候选人能否证明自己能够使用分布式系统构建系统，我建议这些候选人通过个人项目来展示他们的技能。^(²⁶)


  在评估没有分布式系统经验的候选人时，你可能需要追问一些问题。候选人以前是否做过与分布式系统类似的工作？他们是否觉得小型数据技术过于简单乏味？这些都是我所观察到的、适合从小型数据转向分布式系统的人员身上一些一致的标志性特征。


