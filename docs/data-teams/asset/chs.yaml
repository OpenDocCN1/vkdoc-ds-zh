- "# 6. 专业人才\n\n> *因为时代正在改变*\n> \n> ——鲍勃·迪伦《时代正在改变》\n\n随着组织在数据使用方面日趋成熟，他们开始需要更专业的技能。本章我们将探讨两个高级人员配置领域：DataOps（数据运维）和机器学习工程师。这两种技能都融合了软件工程、分析学和数据科学。\n\
  \n## DataOps（数据运维）\n\nDataOps 团队是一个跨职能团队，其主要目标（即使不是全部目标）是通过分析来创造价值。这种跨职能特性使团队能够利用数据创造端到端的价值，因为他们可以从原始数据入手，并将其转化为价值。\n\
  \n一个 DataOps 团队包含数据工程师、数据科学家、数据分析师和运维人员。拥有数据工程师意味着团队能够高效地创建数据产品。拥有数据科学家和数据分析师，团队就能构建完整的分析体系，从简单的分析到全面的模型创建。运维组件则使团队能够将产品投入生产环境，并获得生产支持，或者拥有使用生产数据或集群资源的生产权限。\n\
  \n即使团队能从零开始构建数据管道，也不意味着他们总是应该从零开始。他们应该利用数据工程团队已创建的其他数据管道。\n\n延续这种复用策略，他们可能不会为每条管道编写代码。DataOps\
  \ 团队可能会使用更多无需编码即可创建管道的工具。这些分布式系统或技术将能够创建分析管道或数据管道，而无需从头编写代码。DataOps 团队会更侧重于行动速度，而非追求最优化的工程方案。\n\
  \n这引出了 DataOps 与数据工程之间的关键区别——周期速度。数据工程（与大多数软件工程一样）工作周期较长。这是分布式系统固有的复杂性和耗时性的外在体现。提升数据工程团队的迭代速度可以改善这些时间周期，但这通常会受到数据工程团队的限制，因为他们要创建越来越复杂的数据管道。DataOps\
  \ 认识到商业条件变化迅速，每家企业都在竞相发现变化并做出响应；拥有成熟数据团队的组织要求新模型能尽快达到生产就绪状态并部署。为实现这一目标，DataOps 的工作周期要短得多。DataOps\
  \ 团队可以利用数据工程团队的数据产品，与业务部门合作创建分析方案，并从数据产品中创造具体的商业价值。这个更短的周期正是业务部门利用数据所真正需要的。\n\n\n\
  \n### DataOps 中的权衡取舍\n\n有些项目必须在大约一天的时间内完成，甚至可能只有几个小时。高管或首席某某官有时会要求为第二天的会议准备一份分析报告。DevOps\
  \ 团队可以解决这个临时需求。但要求数据工程或数据科学团队去做，会迫使他们完全停止手头工作、切换上下文，并开始匆忙拼凑代码。这种做法会不断给团队造成延误和问题——而且他们可能缺乏在期限内完成的技能和思维方式，因为他们的整个职业生涯都致力于编写一丝不苟、万无一失的代码。\n\
  \nDataOps 的关键原则是专注于开发和发布的速度，而非追求最优化的工程解决方案。DataOps 人员不会试图用自己的技能替代其他团队，也不会包揽其他团队的所有工作。相反，DataOps\
  \ 人员可能会让数据工程团队创建新的数据管道，然后运用 DataOps 技能来实现快速更新和发布。对于某些数据源，可能不存在现成的数据管道，DataOps 团队可能需要自己创建。DataOps\
  \ 可以使用工具来创建管道，而无需编写新代码。\n\n因此，数据工程团队会首先以与其他软件工程团队相当的速度完成其工作。他们需要大量时间，因为分布式系统很复杂且难以正确使用。另一方面，DataOps\
  \ 的工作周期要短得多。DataOps 可以接手数据工程团队的数据产品，与业务部门合作创建分析报告，并从数据产品中创造具体的商业价值。如果他们需要开拓创新，他们可能会创建一个数据产品，然后由数据工程团队回头将其打磨得更符合生产要求。\n\
  \n### Gartner 对 DataOps 定义的问题\n\nGartner 在科技领域的商业领袖中经常被引用，它对 DataOps 有自己的定义：\n\n\
  -   数据运维是收集和分发数据的中心，其任务是提供对客户和营销绩效数据记录系统的受控访问，同时保护隐私、使用限制和数据完整性。\n\n在我看来，Gartner\
  \ 的定义并没有充分区分 DevOps 带来的新技能与数据仓库团队 DBA 的传统角色。这个定义实际上暗示了一种抵抗性的方法：将用户与数据隔离。\n\n我的批评之所以重要，是因为历史上数据团队曾利用他们保护隐私和数据安全的职责来阻碍有价值的数据使用。数据用户和数据仓库团队之间常常因为这种保守主义而爆发地盘之争。我们需要的是一个强调敏捷性和增加数据访问权限的定义。\n\
  \n我在这里提到 Gartner 的定义，仅仅是因为你很可能在其他地方看到它被引用，我想确保你有一个更积极的定义可以参照。\n\n### 还有另外三种 DataOps\
  \ 的定义\n\n第一种是 DataOps 仅仅是面向分析的 DevOps。在这个定义中，我们借鉴了 DevOps 运动，并认为需要将其稍微扩展以包含数据。这种想法认为，只要我们发布得更快，就可以提高数据管道的质量。DevOps\
  \ 专注于通过软件工程和改进发布周期来创造价值。DataOps 团队应专注于从数据中创造价值。只有当数据质量足够高，使其可用时，DataOps 团队才能从数据中创造价值。理想情况下，DataOps\
  \ 团队应尽可能自给自足，以便自助提供数据产品并将任何产出投入生产。\n\n第二种定义是面向数据工程团队的实践。这个定义要求你的数据工程团队应用 DevOps\
  \ 原则。这意味着你的数据工程团队需要学习或增加具备运维和从数据中创造价值（通常是分析）能力的人员。将这两个新属性结合到数据工程团队中并非易事。在价值创造方面，数据工程团队需要学习如何分析数据并从数据中创建可用的见解。我再次强调，基于我广泛教授数据工程师的经验，这并不是一个普遍特征。如果从数据中创造的价值是简单或直接的计算，数据工程师可以做到。但我认为，如果你的分析产品如此简单，那么你实际上应该设定更高的目标，否则可能是在浪费时间和金钱。\n\
  \n第三种定义是 DevOps、精益、敏捷和数据管理的超集。这个定义允许 DataOps 团队优化从端到端创建数据产品的过程。该团队将能够控制数据产品的供应、质量和运维。\n\
  \n### 为 DataOps 寻找人员\n\n与其他团队和职位名称不同，我认为不会有一个统一的 `DataOps Engineer` 职位名称。因为 DataOps\
  \ 团队是跨职能的，你需要区分数据工程师、数据科学家、数据分析师和运维人员。因此，你雇佣或从其他团队抽调的人员很可能保留他们原来的职位头衔。\n\n已经拥有前面章节所述的数据科学、数据工程和运维团队的组织，通常通过以下方式之一找到\
  \ DataOps 人员：\n\n-   从数据工程团队中，教授他们必要的软件工程技能\n-   从运维团队中，教授他们必要的数据和分析技能\n\n真正的问题是：谁有软件工程经验？作为软件工程师拥有成熟的经验很重要，在此之后掌握其他必要技能并不太难。\n\
  \n对于数据科学家和数据分析师来说，所需的变化量可能从微乎其微到非常广泛不等。数据科学家和数据分析师通常习惯于在较短的时间框架内工作。如果不是这样，他们需要接受指导或培训，了解在哪些方面可以走捷径以快速产出成果。如果数据工程师正在使用无代码或低代码产品来快速创建数据管道，那么数据科学家和数据分析师可能需要接受培训，学习如何有效地使用这些产品。\n\
  \n### DataOps 的价值\n\n大多数组织开始涉足数据领域，是因为他们听说了数据科学取得的近乎奇迹的成就，并认为他们只需要数据科学家就够了。管理者们可能对处理数据的需求了解不多，所以他们期望数据科学家包揽一切，从寻找数据到从数据中创造商业价值。正如我们在这本书中已经看到的，有效的数据分析是一个需要多种技能的团队协作。\n\
  \n一些分析和数据工程组织仅靠一两个人的个人努力支撑。这种个人英雄主义给组织带来了各种风险。从技术角度来看，这种英雄主义涉及的权宜之计和不确定的希望可能比你想象的要多。对于短期分析项目，这没问题。但对于长期或企业级的分析来说，这种方法会产生大量的技术债务。这种英雄主义无法规模化，一旦那个人离开，组织就会通过艰难的方式认识到这一点。持续的个人英雄主义通常意味着组织内部存在更深层次的技术和人员问题。\n\
  \nDataOps 应该为组织提供一种方法来处理这些问题——问题总会出现的——同时将不合理的负担从个人肩上卸下。DataOps 团队应专注于渐进和持续改进，直到不再需要熬夜加班为止。\n\
  \n\n\n### DataOps 团队与数据工程团队之间的关系\n\n在规模较大的组织中，DataOps 团队与数据工程团队是相互独立的。这种分工要求他们明确各自的任务范畴，以及如何协同工作。\n\
  \n这两个团队往往持有不同的思维方式：数据工程团队出身于软件工程，而 DataOps 团队则聚焦于快速生成分析结果。\n\n由于思维方式的差异，DataOps\
  \ 团队可能会认为数据工程团队节奏过慢，且存在过度工程化的问题。反之，数据工程团队则认为 DataOps 在工程规范和最佳实践方面过于随意、缺乏严谨性。数据工程师们担心，最终他们可能需要接手一个在生产环境中实现得差、文档缺失、且随时可能出故障的系统。\n\
  \n这是一种你需要设法调和的基本矛盾。工程师，尤其是在大型企业中，其思考周期通常以十年为单位。他们认为自己的工作就是确保所开发的程序或系统能够稳健地运行并维护十年之久。任何新技术的落地都伴随着内在风险，工程师们正在权衡这些风险。他们之所以会考虑这些问题，是因为过去曾在这方面吃过亏。\n\
  \n而 DataOps 团队中的分析师或数据科学家则不会以十年或更久的时间线来思考问题。他们的工作周期很短，只关心分析是否能奏效，或者为某个短期需求实验一个新想法——这可能只需要几分钟或几天。\n\
  \n将所有问题简单地划分为短期问题或长期问题，正是 DataOps 和数据工程团队陷入困境的根源。他们必须学会在速度与企业级考量之间取得平衡。有时，某个短期问题或解决方案会一直停留在短期方案层面。但当一个短期方案逐渐“拥有了自己的生命”，并演变为长期方案时，会发生什么呢？\n\
  \n此外，有时你不得不将某个短期方案替换为更偏长期的不同方案。如果不能及时认识到调整时间框架的必要性，就会导致长期低效地使用短期方案反复解决同一个问题。\n\n\
  因此，DataOps 和数据工程团队应建立清晰的沟通流程，以预测并处理从快速短期方案向更具架构性的长期方案转型的过程。图 6-1 展示了两个团队在认识到转型需求时可以开展的对话。\n\
  \n![../images/499628_1_En_6_Chapter/499628_1_En_6_Fig1_HTML.png](img/499628_1_En_6_Fig1_HTML.png)\n\
  \n**图 6-1** — DataOps 与数据工程协同工作的模式\n\n仍然有一些项目需要遵循以月为单位的传统工程周期。随着分析复杂度的增长和数据处理需求的增加，你将同时需要常规的数据工程师和\
  \ DataOps 团队。\n\n### 何时开始实施 DataOps\n\n我发现，如果组织在发展的早期阶段就尝试推行 DataOps，往往会面临失败的风险，因为企业同时要应对过多的组织架构变革。团队会因不清楚向谁汇报或该做什么而陷入混乱。再加上向大数据迁移本身的技术难度，团队甚至可能完全失去生产力。\n\
  \n如果你的组织已经拥有跨职能团队，或者你一开始就组建了一个大型数据团队，并且有足够的人员来支撑所有必要的团队，那么你可以考虑在项目早期就开始推行 DataOps。在这种情况下，部分员工可以通过横向调动转入\
  \ DataOps 岗位。\n\n对于大多数组织而言，更好的做法是等到数据团队逐渐成熟，并真正遇到 DataOps 旨在解决的问题时再开始推行。届时，团队最初那种“只要让东西能跑起来并交付出去”的压力会逐渐消退，反而会开始听到“工具发布速度太慢”的抱怨。虽然数据产品已经就绪，但团队响应一个请求的速度却遭到诟病，如图\
  \ 6-2 的时间线所示。这时正是组建 DataOps 团队的绝佳时机。\n\n![../images/499628_1_En_6_Chapter/499628_1_En_6_Fig2_HTML.png](img/499628_1_En_6_Fig2_HTML.png)\n\
  \n**图 6-2** — DataOps 是一种更高级的团队结构\n\n## 机器学习工程师\n\n机器学习工程师负责填补数据科学和数据工程之间的技能鸿沟，如图\
  \ 6-3 所示。数据科学家在统计学和人工智能方面实力雄厚，而数据工程则擅长分布式系统和构建流水线。两者都具备一些用于大数据的编程和工具知识，但如图 6-3 中部所示，他们的技能水平在交叉区域急剧下降，形成了一道难以填补的鸿沟。这道鸿沟的严重程度因组织、任务难度以及数据科学家自身的编程能力而异。\n\
  \n![../images/499628_1_En_6_Chapter/499628_1_En_6_Fig3_HTML.jpg](img/499628_1_En_6_Fig3_HTML.jpg)\n\
  \n**图 6-3** — 数据工程师与数据科学家之间技能鸿沟的可视化呈现\n\n通常，数据科学家的代码在投入生产之前需要经过他人的重写。这种改动可能小至简单的代码审查，大到完全的重构和重写。但这仅仅是将代码交给一位经验丰富的程序员是不够的，因为其中包含了高级统计学和复杂的机器学习算法。程序员需要具备一定的数据科学技能才能胜任。在重写过程中，有些模型可能只需微调，而另一些则需完全重写。这项工作可能还包括使模型部署更直接、更自动化。有时，还有一些结合了运维和数据科学的考量，比如需要验证新模型的表现是否与旧模型持平或更优。\n\
  \n这正是机器学习工程师所填补的鸿沟。他们处在数据工程和数据科学两个世界之间。他们需要能够判断一个模型对于某个用例来说是否足够好，而不仅仅是能否达到发表博士论文的水平¹⁹。同时，他们还需要知道何时以及如何将工程严谨性应用于模型。图\
  \ 6-4 展示了机器学习工程师如何融入整个工作流程。\n\n![../images/499628_1_En_6_Chapter/499628_1_En_6_Fig4_HTML.jpg](img/499628_1_En_6_Fig4_HTML.jpg)\n\
  \n**图 6-4** — 机器学习工程师填补了数据工程师与数据科学家之间的鸿沟\n\n### 寻找机器学习工程师\n\n一名机器学习工程师应同时精通并自如运用软件工程和数据科学。因此，他们可能来自图\
  \ 6-3 的任意一侧：要么是拥有软件工程经验的数据科学家，要么是具备数据科学经验的软件工程师。\n\n转型为机器学习工程师的数据科学家，通常在本科阶段学习的是计算机科学或相关工程专业。有些还曾担任过软件工程师。无论哪种情况，他们都拥有大多数数据科学家所不具备的软件工程背景。\n\
  \n另一种背景是对数据科学感兴趣的数据工程师。他们通常对数据科学表现出极大兴趣，其在校学习经历可能包括辅修数学或某种数学相关的专业方向。另一些人则完全没有学历背景，但计划通过数据工程岗位逐步晋升到机器学习工程师职位。\n\
  \n\n\n### 机器学习工程师的归属\n\n如果你只有少数几位机器学习工程师，可以将他们安排到数据科学团队或数据工程团队中。我见过机器学习工程师大多归属于数据科学团队，因为对模型的重写与改进占据了他们工作中最耗时的部分。\n\
  \n当组织规模较大或机器学习工程师数量较多时，你可能需要组建一个专门的机器学习工程师团队。该团队将维持高带宽连接，并与数据工程团队进行广泛的协作。\n\n"
- '# 第三部分 协作与管理数据团队


  第 2 部分介绍了你需要组建的三个数据团队应招聘哪些人员。第 3 部分将展示如何协调数据团队与业务部门，利用数据创造出有价值的东西。


  有些业务和高管层面的人喜欢认为他们的工作就是招聘人员。另一些人则认为，一旦数据战略完成，他们的工作就结束了。现实情况是，成功的团队会始终如一地与业务对口方持续协作。


  大数据项目在投入生产的过程中有许多步骤。了解并遵循这些步骤对于取得成功至关重要。


  '
- "# 7. 作为数据团队开展工作\n\n> *我所知的生活*  \n> *无法与纯粹的想象相提并论*  \n> ——吉恩·怀尔德《纯粹想象》\n\n在书籍与业务需求之间，是组建和创建数据团队的现实。在真实世界中，你必须处理自负心理、公司政治，以及员工在离开学术生涯后的第一份工作中可能抱有的期望。本章探讨了你在构建或扩展大数据工作时必须面对的一些挑战：\n\
  \n- 团队中的角色与关系\n- 在管理员工期望与自负心理的同时，传达公司期望\n- 避免无益的干扰\n- 修复技术债务\n\n## 让团队成员协同工作\n\n\
  尽管公司通常重视数据科学家——他们堪称大数据领域的明星，但管理层往往低估了数据工程的重要性。如第 4 章所定义，大数据从业者经常表示，将数据转化为可用形式（例如数据清洗、数据产品创建以及运行模型的底层基础设施）占据了工作的\
  \ 80% 到 90%，而这些工作大部分落在数据工程师身上。然而，一些组织要么完全未考虑数据工程，要么假设数据科学家能够胜任。\n\n第 2 部分有助于你理解每个员工应扮演的实际角色。一些高级角色——第\
  \ 6 章讨论的 `DataOps` 人员和机器学习工程师——则在角色之间交叉并填补空缺。\n\n### 人员配置比例\n\n当数据工程师被聘用时，数据工程师与数据科学家的比例通常是一比一。实际上，你需要为每位数据科学家配备两到五名数据工程师。这个比例之所以如此之高，是因为\
  \ 80% 到 90% 的工作任务属于数据工程范畴，而非数据科学范畴。该比例取决于：\n\n- 数据工程方面的复杂度要求\n- 数据科学家掌握数据工程技能的程度\n\
  - 模型的复杂度与数量\n- 数据的复杂度与数据量\n\n运维人员与数据科学家或数据工程师之间的理想比例，在不同组织间差异可能更大。你需要的运维人员数量取决于\
  \ SLA（服务等级协议）、运营效率水平以及托管服务的使用情况。保持运维人员数量与生产环境中的数据管道及模型数量之间相对恒定的比例，可能是值得的。\n\n确定合适的比例并让团队高效运作确实需要一些技巧。如果存在疑问，宁可多招聘一些数据工程师——我保证，你会为他们找到合适工作的！\n\
  \n\n\n### 数据团队应当分设还是合并？\n\n对于规模较小的组织而言，将数据科学家、数据工程师、数据分析师、业务分析师和运维人员整合到一个团队中是有益的。将其拆散并为每一两个人指派一位管理者毫无意义。但大型组织则需要建立独立的团队——拥有一支\
  \ 50 人的团队同样不合理。\n\n一些管理者希望将所有成员合并到一个团队中能防止\"部门墙\"，尤其是在政治氛围浓厚的组织中。遗憾的是，政治斗争和权力博弈可能只会以不同的形式重新浮现。在分配人员到团队之前，需要审视组织政治功能失调背后的关键问题。\n\
  \n将数据科学家保留在一个团队，同时把数据工程师和运维人员合并到另一个团队的做法或许可行。\n\n当数据科学家、数据工程和运维团队分属组织不同部门并接受不同管理者领导时，政治问题尤其容易滋生。请观察在组织架构中需要上溯多少层级才能找到所有数据团队的共同领导者。对于小型组织，这个层级可能达到高管层；大型组织则可能是总监级、副总裁级，甚至仍停留在高管层。\n\
  \n应尽量调整公司架构，使共同管理者的层级不会过高。当出现问题需要决策时，若管理者层级过高，所有事项——包括优先级争议、资源分配或愿景冲突——都必须层层上报才能获得决策。在高度对立的环境中，这会成为持续且沉重的负担，严重降低生产力。\n\
  \n需要明确的是，我建议数据团队应有一位在组织架构中距离他们较近的共同领导者。这位共同领导者能跨团队建立起清晰、一致且互补的目标。\n\n但如果团队最终分属不同部门，其管理者必须主动跨部门协作，与兄弟数据团队的管理层建立良好的工作关系——这是管理工作中最具挑战性的环节。\n\
  \n第 6 章讨论的 DataOps 团队是个特例，因为其本质就是跨职能团队。当然，即使团队成员来自不同专业领域，它仍需要与其他团队进行有效协作。\n\n###\
  \ 产品团队 vs. 功能团队\n\n另一种划分数据团队组织方式的概念是：功能团队（全员集中）与产品团队。这里\"产品\"指任何由付费客户或关键内部利益相关者使用的成果。产品团队天然具有跨职能属性，混合了产品负责人、数据科学家、数据工程师、前端应用工程师、后端应用工程师等角色。\n\
  \n产品团队广受欢迎，因其能聚焦于交付对业务成果至关重要的产品。它们避免了功能团队的一些潜在问题，比如构建过于庞大复杂的库，这些库或许能满足*每个*团队的需求，但对*任何一个*团队而言都显得臃肿。换句话说，功能团队可能忽视组织目标——\"\
  大局观\"。\n\n产品团队的劣势在于，专家（如数据科学家和工程师）难以建立组织级标准、最佳实践和共享库。因此，这两种组织模式——产品团队与功能团队——之间存在天然的张力。\n\
  \n最佳选择取决于组织特性。对于大型成熟组织，采用功能团队标准化其专业领域可能是最优解，尤其当新产品发布通常只是组装或微调现有组件时。当需要完全创新而标准化尚未发挥作用时，产品团队则更具优势。\n\
  \n——Dean Wampler，《数据团队》作者兼 AnyScale 开发者关系主管\n\n### 高带宽连接\n\n如何克服将数据团队置于组织完全不同部门所带来的障碍？如何确保他们真正完成工作？解决方案是在团队间建立高带宽连接。\n\
  \n高带宽连接意味着数据团队成员彼此熟识。他们通过认可对方在各自领域的专业能力来建立信任与尊重。当一个人联系另一个人时，默认前提是联系者已经花费时间和精力尝试自行解决问题或寻找答案，而不是未经思考就干扰他人。\n\
  \n这种高带宽连接可以通过将某个团队的成员嵌入到另一个团队来实现。在组织架构图中，被嵌入的成员可以通过虚线连接至原团队或当前工作团队。\n\n例如，运维团队的成员可以永久或临时嵌入数据工程团队。此举可为满足团队的特定需求或填补技能缺口。\n\
  \n但将人员长期或永久嵌入不同团队时需谨慎。人们可能不希望长期脱离自己的\"原属团队\"。在指派前，最好先观察或主动征集志愿者。通过招募志愿者，你可能会找到原本就对跨岗培训或角色转换感兴趣的人。同时要注意填补该人员在原团队留下的空缺——这些通常是高级职位，会留下巨大空白，需要原管理者在人员和\
  \ workload 上予以填补。\n\n### 迭代过程\n\n让团队协同工作是一个逐步重复和改进的过程。如同某些敏捷方法，通过创建更短的改进周期来促使团队进步。数据团队无法一次性解决所有问题。\n\
  \n那些试图一次性解决所有问题的团队会陷入僵局，因为他们无法聚焦于可实现的目标。相反，数据团队应专注于在更短的周期内实现微小改进。这种努力会累积成整体性的显著提升。\n\
  \n## 政治、期望与自我\n\n太多项目在组织的政治斗争中萎靡不振。解决这一问题至关重要。虽然我无法在一本书中解决整个组织的政治问题，但可以在此提供一些常见问题及其可能的解决方案。我常建议团队先解决自己职权范围和团队内部的政治问题，而非试图解决更宏观的议题。\n\
  \n\n\n### 数据项目速度\n\n你可能听说过敏捷项目管理框架中一个名为*速度*的概念。速度是指团队在项目中完成工作的速率。一个健康团队的标志是，随着团队对项目管理框架的运用日益成熟，他们的速度会逐渐提升。\n\
  \n数据团队也有类似的速度，分布式系统及其使用也存在类似的加速期。数据团队最初需要额外的时间、空间和资源，才能开始借助分布式系统完成任务。健康数据团队的标志是他们的速度逐渐提升。这意味着团队对分布式系统越来越得心应手。他们正在积累经验，从而能够更快地编写出更优质的代码。只要有足够的时间和努力，团队成员最终都将成为项目老手。\n\
  \n项目计划和管理层常常期望新成立的数据团队或新加入的成员——无论是刚入职还是接受过某种培训后——从第一天起就是专家。期望新团队或新成员能产出专家级别的成果，会让他们陷入一种难以维系的境地：从一开始就落后，并且由于无法在规定冲刺内完成应做的工作，而逐渐越落越远。\n\
  \n无力跟上进度正是团队速度发挥作用的地方。如果团队永远没有机会赶上进度或调整项目计划，他们就会失败。\n\n另一方面，如果团队——尽管得到了所有的时间、资源和帮助——速度却从未提升，那就存在团队内部的问题需要管理层解决。数据团队的速度是双向的：既为个人贡献者提供所需资源，也为管理层提供衡量数据团队责任履行情况的指标。\n\
  \n在为一个全新的数据团队，或是一位刚学习分布式系统的成员计算速度时，你应该预计此人需要 3 到 12 个月才能对分布式系统完全得心应手。这充分说明了分布式系统的复杂性，以及数据工程师需要学习海量技术。每一项技术的学习都需要投入大量的时间和认知努力。\n\
  \n### 制定“爬行、行走、奔跑”计划\n\n数据团队不可能一夜之间从 0（分布式系统新手）达到 100（分布式系统专家）。团队必须先获得一些速度。\n\n\
  有时，我会发现某个团队的经理或主管工程师去参加了一个会议，观看了某个组织对其架构的演示。然后这个人就会根据那个演示来制定他们自己的整个架构、愿景和产品路线图。这个人没有意识到的是，演示成果的组织通常花了数年时间才真正实现其架构——只是在演示时没有提及这一点。\n\
  \n追逐其他组织的实现会让新数据团队陷入困境。他们没有意识到要实施他们试图照搬的架构需要花上数年时间。这使得团队在数年之内都无法展示任何价值。\n\n另一种常见情况是，CxO\
  \ 级别的管理者——通常是 CEO——对“利用大数据取得成功”抱有宏大愿景。但现实是，组织尚未准备好，也无法实现 CEO 的目标。这就迫使数据团队寻找方法，去创建一些尚可完成的东西。长期无法展示价值的项目往往会被取消或大幅削减。因此，我强烈建议团队进一步分解他们的用例和待办事项。我把这种进一步分解称为“爬行、行走、奔跑”。它能让数据团队逐步达到\
  \ 100%的目标，同时又不至于永远拿不出任何成果。\n\n在“爬行、行走、奔跑”模式中，数据团队根据自身速度何时足以完成任务来分阶段规划其待办事项。让每个人都清楚在每个时间点上什么是遥不可及的，这很有好处。每个阶段都应为团队实现下一步目标做好准备。\n\
  \n### 功劳均沾\n\n数据项目的功劳——即便不是全部，也多半归于数据科学家。这是因为数据科学家通常是数据产品的对外代言人。数据科学家是与业务部门合作创建数据产品的人。在业务方的认知中，数据科学家包揽了一切。如果你观察大多数组织，印象就是数据科学家完全靠自己、无需他人帮助就完成了任务。\n\
  \n因此，管理层也必须认可其他团队的工作。数据工程师和运维人员经常抱怨，荣誉只降临在数据科学家头上。当他们人手不足（参见本章前面的“人员配置比例”部分）、资金短缺，并且不断拼命努力以满足数据科学家的需求时，他们尤其感到愤怒。数据工程师和运维团队成员很可能会辞职，去往另一家认可他们价值的公司。团队经理有责任向高层管理者说明数据团队的跨职能特性，以及他人的贡献如何帮助数据科学家完成了工作。\n\
  \n### 传达数据工程、数据科学与运维的价值\n\n管理层有责任向组织内部传达每个数据团队的价值和重要性。组织内并非所有人都能理解数据团队创造的价值。这正是管理层需要进行内部教育的环节。\n\
  \n如果一个数据团队运作良好，它可能不会像运作糟糕的团队那样引起波澜。运作糟糕的团队会不断进行“英雄救火”，制造噪音，因为他们在修正自己或他人造成的问题。为了展示一个运作良好团队的价值，该团队需要自己制造“噪音”，告诉别人他们不必加班加点地修正错误，这是一件好事。\n\
  \n除非管理层齐心协力地教育其他人，否则数据工程——尤其是运维——将得不到应有的认可。无法获得赞誉会让其他团队认为某个人或整个团队对项目的成功并非必要。现实情况是，关键人物往往将自己的能力视为理所当然，不懂得如何吸引别人关注自己的成就。\n\
  \n\n\n### 数据科学家需要其他团队的贡献\n\n这本书始终如一地传达的信息是，大数据是一项团队工作，需要多学科协作，但数据科学家有时并未领会这一点。以下是当你试图从团队其他成员那里为数据科学家提供帮助时，可能会遇到的障碍。\n\
  \n如果数据科学家来自学术界，他们可能从未需要面对诸如数据存储的可访问性和可搜索性、代码的可维护性以及快速发布等工程问题。在学术界，数据科学家的价值来自于撰写论文，而非创建用于生产环境的模型。如果管理层被数据科学的光明前景所迷惑，也同样未能理解这些任务的重要性和难度，问题就会加剧。\n\
  \n不断被告知数据科学家是多么出色和独一无二，这可能会让他们冲昏头脑。再加上他们刚从学术环境中走出来，这就构成了麻烦的温床。这既需要个人成长，也需要整个组织对所有员工的贡献给予均衡的认可。\n\
  \n数据科学家通常是编程新手。将数据科学家的代码投入生产环境可能并非明智之举。我并非只针对数据科学家——这适用于任何刚开始成为软件工程师的人。将新人的代码投入生产环境可能会带来灾难性的后果。请记住，数据科学家往往是自学的程序员，或者他们的知识基础是那些只教授编程语法而不教授软件工程的大学课程。这让我们清醒地认识到，为什么他们的代码需要重写——或者至少需要审查。\n\
  \n数据科学家会对强加给他们的工程流程感到不满。值得向他们指出编程与软件工程之间的区别。编程是指掌握足够的代码或语法，以便用代码解决问题。软件工程则是创建一个遵循已知软件工程最佳实践（如单元测试、源代码控制以及底层技术的正确使用）的解决方案。对于一位刚毕业的数据科学家来说，所有这些工程工作似乎都是在浪费时间，属于过度工程。但确实有一些工程流程是数据科学家应该遵循的。管理层需要克服自大心理，向其展示协同合作的必要性。\n\
  \n告诉别人他们的代码需要重写，这其中涉及到自尊心问题。负责重写代码的数据工程师、经验更丰富的数据科学家或机器学习工程师需要谨记，这对于数据科学家来说可能是一个教学机会。数据科学家并非故意编写质量低劣的代码。大多数情况下，他们从未接受过关于最佳实践或为什么在软件工程中要以特定方式做某事的原因的指导。\n\
  \n重写代码的人面临着艰巨的挑战。他们很可能不理解数据科学家代码中使用的数学或统计学知识。这正是数据工程与数据科学之间需要高带宽连接的关键所在。\n\n###\
  \ 数据囤积\n\n政治问题不仅限于人际之间；它也可能延伸到数据本身。通常，公司称其数据处于“孤岛”状态。有时，这种孤岛状态是政治问题的直接体现，当一个团队希望通过不让其他团队访问其数据来获得优势时便是如此。在组建数据团队时，你首先要面对的斗争就是克服数据孤岛和政治问题，以便在组织内部按需共享数据。\n\
  \n解决政治问题的一部分在于让别人帮助你实现目标。有时，仅仅被指引到数据所在之处是不够的。在这些情况下，你实际上需要有人来帮助你理解数据或数据的含义。这可能意味着需要说服那个人的经理指派某人来完成这项任务，或者只是对某个不愿意帮助你的态度恶劣的人保持耐心。无论哪种方式，你都需要知道，某些关键数据并非以完美的方式持有或存储，你的数据团队需要对此进行纠正。\n\
  \n## 千刀万剐之死\n\n将简单的东西投入生产环境可能非常困难。困难不仅在于分布式系统复杂性等技术障碍，还在于组织的生态系统。此外，还在于处理让分布式系统正常运行所需的所有环节。每一个困难都可能导致团队生产力的死亡。我称之为“千刀万剐之死”。\n\
  \n### 复杂性的诅咒\n\n在足够大型的企业中，你可能会为仅仅搭建项目而挣扎于复杂性之中。这并不仅限于运行分布式系统的基础设施。它还源于像源代码控制和构建系统这样简单的任务。每个企业都会有其固有的细微差别和怪癖。这些怪癖在\
  \ Stack Overflow 上搜索不到，也无法公开讨论。它们通常是部落知识，要解决它们，就需要找到一位之前遇到过相同问题的高级人员。\n\n大多数数据管道使用许多不同的技术，这使得管道创建和故障排除都变得复杂。当出现问题，你不仅仅是在试图找出单一技术的问题——这通常是处理小数据时的情况。相反，你必须弄清楚五种复杂技术中哪一种是罪魁祸首。如果你运气特别差，可能会同时遇到其中几个技术的问题。\n\
  \n因此，在数据团队的技术栈中进行故障排除所花费的时间比在软件项目的其他部分要长得多。对系统进行调试可能是一个巨大的时间陷阱。这很快就会导致团队生产力的死亡，因为他们把时间都花在试图弄清楚问题出在哪里以及具体位置。\n\
  \n### 不走寻常路\n\n“不走寻常路”意味着以技术最初并非设计的方式使用它。这时，团队认为以某种方式使用（或滥用）某项技术是可行的，但却无法指出有其他组织以相同方式使用它。“不走寻常路”可能由多种原因引起。团队的使用场景可能需要一种新的或不太知名的技术来实现。有些团队只是想使用最新、最酷的技术，因为它们很“潮”。无论根本原因是什么，其表现都是一样的。\n\
  \n当你“不走寻常路”时，“千刀万剐之死”可能会逐渐发生。某天你可能会意识到，团队已经花了数月时间与同一个问题作斗争，却毫无进展。如果没有来自该技术或使用场景真正专家的外部帮助，团队通常无法自行解决问题。这些知识无法在互联网上搜索到，也找不到\
  \ Stack Overflow 上。这是一种部落知识，集中在少数使用该技术时间更长或项目创建者手中。\n\n面临较高技术风险的组织会希望采取特定行动来降低风险。这应该包括对新技术的帮助和支持。这种支持不仅限于运营支持——它还应包括架构和编程方面的支持。理想情况下，这应该包括对运营团队和数据工程团队进行相关技术本身的培训。\n\
  \n\n\n"
- '# 技术债务


  数据团队中技术债务的产生——如第 3 章所述——需要被指出并为人所知。当采用“爬行、行走、奔跑”的通用策略实施项目时，团队会有意制造技术债务，这些债务将在下一阶段逐步偿还。公开承认并认可技术债务，将有助于在团队无法
  100%实现某个用例时，避免自我谴责或他人的指责。对于那些目前处于 0%水平的业务，50%的水平或许暂时就足够了。剩余的 50%则作为技术债务留存，团队将在后续阶段或迭代中进一步偿还。


  管理层应敏锐地意识到正在产生的技术债务。管理者需要确保团队通过协同努力来偿还技术债务——无论这些债务是有意制造还是无意造成的。如果管理层主动或无意中阻止团队回头修复技术债务，数据团队对管理层的信心就会减弱。团队成员会认为管理层对未来不负责任，并且过度关注新功能。不修复技术债务最终会导致大规模的代码重写，耗费大量时间，因为团队从未获得过逐步偿还技术债务的时间。


  '
- '# 8. 业务如何与数据团队互动


  > *没有你，就没有改变*

  >

  > ——Mötley Crüe《Without You》


  要从数据中获得最大价值，本书所述的数据团队与你所在组织的业务部门之间需要持续互动。数据产品本身并不能创造价值。数据科学家可以全年分析数据，但只有在实现某种业务价值时，才能产生影响力。


  企业究竟如何从大数据中获益？这一切都始于将`不可能`变为`可能`。每个数据团队都以自己的方式支持价值链的创造。对于业务部门而言，价值链的最终收益可能来自许多方面，具体取决于组织及其收入形式。有时，业务部门从一开始就知道自己想要什么，并赞助一个项目或整个数据团队的创建。另一些时候，业务部门会以某种方式引入赞助或合作伙伴关系。无论如何，业务部门都在试图将客户或用户的问题与技术解决方案联系起来。


  业务互动对于确保数据产品回答以下问题至关重要：


  *   当前的数据产品是否真正满足了业务需求？


  *   数据产品是否创造了价值？


  *   数据产品的创建或完成时间是否在业务可接受的范围内？


  本章将从以下几个方面探讨这些互动：


  *   推动变革的源头


  *   数据团队及其成员应设在何处


  *   业务部门应如何与数据团队互动


  *   资金与资源


  *   互动的主题


  *   奖励与衡量成功


  ## 如何实现变革


  成为一家以数据为中心的公司需要经历巨大的变革。管理层需要站在推动这一变革的最前沿。组织如何实施变革将取决于推动变革的是组织的哪个层级：自上而下、中层还是自下而上。


  ### 自上而下的推动


  自上而下的推动意味着变革来自组织的首席级别或其他高管。在实现转变的三种方式中，这是影响变革最不痛苦的一种。


  高管面临的困难在于，如何让整个组织在数据目标和战略上达成一致。仅仅制定数据战略是不够的。高管们需要持续推动，使组织成为以数据为中心的机构。他们可以通过在决策时要求提供相关数据来以身作则。


  自上而下的压力在确保打破数据孤岛方面最为有效。高管们需要确保组织中的其他团队理解与数据团队合作的重要性。


  高管们还需要确保为团队提供适当的资源。这包括为新的数据团队设置人员编制。其他资源还包括团队在学习分布式系统或特定架构咨询方面所需的外部帮助。这可以防止团队陷入困境，无法在数据战略上取得进展。


  ### 中层的向上与向下施压


  有时，中层管理人员会更早地看到组织变革的必要性。他们的困难在于身处所有人的中间。他们必须通过向上和向下同时施压来推动变革。


  我经常发现架构师也处于中间位置。他们需要同时关注组织的技术和业务需求。他们可能是最早看到`不可能`的人之一。


  这个中间位置对于推动变革来说是困难的，但并非不可能。中层管理人员需要花时间说服高层管理人员，让他们认识到创建数据团队的需求和业务价值。中层管理人员还需要说服普通员工，让他们认为值得花时间和精力去学习分布式系统。我强烈建议管理者从寻找创建数据团队的业务价值开始，并将大部分精力用于说服高层管理人员相信其好处。


  可能无法说服所有人相信这些好处，尤其是高层管理人员。在这种情况下，我建议中层管理人员通过项目的成功来引领，例如，创建一个“臭鼬工厂”项目来解决组织中的一个`不可能`。这个项目应该清楚地展示出，如果组织开始直接投资于一个数据团队，将会带来怎样的潜在价值和好处。大多数人——尤其是高层管理人员——倾向于支持一个已经取得胜利并展现出前景的团队，而不是在一个未经证实的项目和团队上冒险。


  ### 自下而上


  虽然这本书是为管理层写的，但我猜普通员工也会阅读。我假设你看到了对数据团队的需求，并且正在想办法实现它。这也许是因为管理层——无论是中层还是高层——对此不感兴趣，或者并不真正理解数据的潜在价值。自下而上地推动会很有挑战性，但确实有人做到了。


  普通技术人员往往缺乏正确的措辞或定位来推动事情的发展。你是否在说我们需要开始使用分布式系统技术 X？这也许无法引起管理层的共鸣，因为他们不知道也不关心分布式系统技术
  X 能为组织做什么或将做什么。技术 X 可能并非完成这项工作的合适工具。相反，你应该谈论这项技术将为组织带来什么，或者能实现什么样的特定业务成果。如果你专注于将`不可能`变为`可能`，并说明在那之后业务能做什么，那么业务部门就会更容易接受关于创建数据团队的新想法。




  '
- '# 业务部门应如何与数据团队互动？


  业务部门应当与数据团队保持持续且频繁的互动，正如数据团队成员之间需要高带宽的沟通连接（参见第 7 章的“高带宽连接”部分）。


  数据团队的职责是获取原始数据并从中制作出数据产品。而业务部门的职责则是利用这些数据产品创造商业价值——或者至少告诉数据团队如何从数据中创造商业价值。有时，数据科学家也被期望能直接创造这种价值。部分数据科学家具备足够高的领域知识水平来做到这一点，但大多数人不具备。你可能需要一名业务分析师来补充或完全赋能数据科学家的领域知识。不同组织对领域知识的划分界限各不相同——多数情况下由业务分析师承担，有时也会部分落在数据科学家身上。


  从数据科学中衍生商业价值的关键步骤有时被称为`BizOps`。一些组织会在本书讨论的其他团队之外，专门设立一个`BizOps`团队。在我最初构思本书大纲时，曾考虑用整整一章来介绍`BizOps`。它属于那些对某些公司有用、但对其他公司未必适用的高级职能之一。是否要建立`BizOps`团队，最终取决于组织或业务单元领域知识的复杂程度。以下问题将帮助你判断所在组织领域知识的复杂层级：


  -   新员工需要掌握多少领域知识才能开始产出价值？

  -   组织中是否有人（或一些人）的核心价值在于了解系统从头到尾的运作方式？

  -   组织中是否有人（或一些人）的核心价值在于了解哪些数据正在被使用，以及每个字段的含义？

  -   第三方数据提供商与你们自有系统之间的交互是否复杂？

  -   理解数据在系统中从起点到终点的流转过程有多困难？


  ## 案例分析：医疗保险领域知识


  为了说明领域知识的复杂程度及需求，让我描述一下我过去的一位客户。根据我与客户打交道的经验，医疗保险行业对领域知识的要求是最具挑战性的之一。你们组织的需求可能有所不同，但我希望分享我所遇到过的最高难度案例。


  医疗保险公司在多个层面都受到领域知识复杂性的冲击：


  ### 医疗


  医疗术语，例如`slot`、`provider`等，外加无穷无尽的缩写列表。


  ### 保险


  各类手术编码以及保险公司通常极其繁琐的计费流程。


  ### 计费系统


  账单输入并发送至保险公司的系统。


  ### 数据系统


  关于患者、手术和账单的数据如何在系统中存储。


  在我与那位医疗保险客户合作之前，我并未完全理解领域知识所需的惊人复杂度。我曾与该公司的一位业务分析师讨论过，他们团队在数据团队中的定位及其原因。起初，我给出了我的标准回答：数据工程团队应尽可能简化数据访问。但这位分析师坚持追问：数据工程师或数据科学家是否真的知道该使用哪些正确的字段、应该暴露哪些字段，甚至是否理解列名的含义？


  就在那一刻，我豁然开朗。对于拥有复杂领域知识的组织而言，可能确实需要建立一个`BizOps`团队，该团队与其他数据团队之间的连接带宽，应与本书讨论的三个主要数据团队之间的连接带宽一样高。`BizOps`团队的存在是为了提供领域知识，并确保数据产品能够被业务部门实际使用。


  **这是规则，而非例外**


  致工程领导者的一席话：


  在过去大约四十年从事数据和机器学习工作的过程中，我学到了一点：总体而言，当经济危机发生时，技术应用会实现跨越式发展——尤其是在基础设施领域。仿佛优先级突然变得清晰，而冗余障碍则被清除。


  `Ben Lorica` 和我在 2018 年至 2019 年间进行了一项关于企业采用`ABC`（`AI`，`Big Data`，`Cloud`）情况的调研。我们设计了对比研究，比较了那些已在此领域投资五年以上并已获得`ROI`的企业，与那些甚至尚未开始的企业。分析结果令人信服，尤其是当我们把企业划分为领先者、追随者和落后者时。当然，少数“独角兽”企业在机器学习应用中占据主导地位，它们雇佣最优秀的人才，利用尖端技术巩固先发优势。另一大群体则在追随这些领先者的脚步，尽管它们在招聘合适岗位人员、应对数据质量问题以及寻找足够多能将现有技术转化为商业用例的人才方面困难重重。其余组织——超过一半的企业——则深陷技术债务，与不认为有投资必要的高管团队争论不休。换句话说，这些落后者距离拥有足够有效的数据基础设施以具备竞争力，尚有数年的差距。与此同时，先发者们正在
  aggressively 加大数据投资，从而加剧了企业界“拥有者”与“缺失者”之间的鸿沟。这一分析与 `MIT Sloan`、`McKinsey Global
  Institute` 等机构的类似研究相吻合。


  回顾 2000-2002 年的经济危机（互联网泡沫破裂及随后的 9/11 事件），那些后来成为领导者的公司当时正忙于创新：`Amazon`、`eBay`、`Google`
  和 `Yahoo` 早在 1997 年底就开始了横向扩展和利用机器数据的工作。2001 年，`Leo Breiman` 发表了著名的“两种文化”一文，为业界`ML`用例的普及奠定了基础——在此之前这类应用非常罕见。在随后的几年里，建立在大数据实践之上的`ML`逐渐成为规则，而非例外。在互联网泡沫破裂之前，这一切在《财富》500
  强公司中都是不可想象的。




  回顾 2008-2009 年经济危机，那段时间我正为一个蓬勃发展的二线广告网络组建并领导数据团队。就在几年前，我成了名为`AWS`的新服务的"小白鼠"，并在 2006
  年 8 月说服董事会押注 100%云架构。工作几个月后，我们发现了一些机器学习工作流的瓶颈，开始使用名为`Hadoop`的新开源项目来解决。随后在 2008 年中，我们被收购并入该广告网络，面临一个荒唐的截止日期：五周内为分析师和基础设施工程师部门完成人员配置；五周内，基于一个运行失败的`Netezza`实例，对一个关键推荐系统进行故障排查；接着再用五周时间，将公司的主要盈利系统重写为运行在`EC2`上的`Hadoop`应用。


  但我们竟然成功了。期间我们雇佣了一位名叫汤姆·怀特的合同工，来解决`Hadoop`的一个 Jira 工单：一个阻碍`EC2`上高效运行的 I/O 问题。最终成果成为运行在`AWS`上最大的`Hadoop`实例，并成了`Elastic
  MapReduce`服务的案例研究。一年后，当安迪·贾西向`SAP`推销云服务时，他请我担任推荐客户，那是我一生中最难忘的商业电话之一。在 2008 年危机之前，我根本无法想象打这通电话。而在危机过后，商业领袖们开始将这些团队称为"数据科学"团队。


  当然，2020 年的全球危机比 2000 年或 2008 年都严重得多。尽管如此，这些事件能帮助我们聚焦当前的优先事项。在 2019 年底，或许还难以想象，半数企业竟深陷技术债务和糟糕决策流程，以至于许多公司会成为收购目标。收购方是那些进行了投资、清理了技术债务、构建了有效数据基础设施、合理配置了数据工程和数据科学团队，并采纳了由"人+机器"团队利用数据实践的公司。这更可能成为常态，而非例外。以往"极端"的策略如今成了我们的前进方向。鉴于疫情期间数据分析需求激增，危机过后，将不再有企业能推迟转型与适应的决策。


  所以，现在正是环顾四周的好时机。看看谁在适应，如何适应，以及取得了多大成功。坦率地说，也看看谁懒得适应，并与之保持距离。


  2018 年及其关于`GDPR`和大规模安全漏洞的头条新闻，如今几乎像远古历史。过去 30 年左右，数据治理实践一直在波浪式推进，但稳健的`DG`实践往往只是例外。即便如此，一些公司确实从`GDPR`中吸取了教训，尽管他们的故事在
  2020 年初之前才刚被分享。我可以描述一组通用要点，指出了一条前进之路：让数据工程成为像会计一样的基础业务。


  当许多公司不情愿地推行各自的`GDPR`合规版本时，有一小部分公司发现了其积极面。如果你观察`Uber`、`Lyft`、`Netflix`、`LinkedIn`、`Stitch
  Fix`以及其他成熟度大致相当的公司，它们各自都有一个关于数据集使用元数据知识图谱的开源项目——`Amundsen`、`Data Hub`、`Marquez`等等。


  收集这些元数据是它们为应对`GDPR`合规问题做准备所必需的。组织这些元数据（关于数据如何"链接"在一起）自然适合用知识图谱来实现。一旦组织开始利用这些知识图谱，它们获得的远不止血缘信息。它们开始识别从数据收集、数据管理到创收用例的业务流程路径。它们可以绘制出数据管理实践与客户需求之间的组织依赖关系。当一些人发现数据团队如何浪费时间不停"重新发现"元数据时，另一些人则认识到基于现有数据开辟全新业务线的可能性。


  这是 2020 年初刚刚开始传颂的故事。它证明了构建稳健数据基础设施和数据治理实践的必要性。它将合规从风险转化为投资：企业整体如何利用其数据？此外，这种方法专为利用人工智能来建议其他潜在业务领域而设计。


  在这场危机过后，稳健的数据基础设施和数据治理实践将成为常态，而非例外。


  ——**帕科·内森**，作家兼邪恶疯狂科学家，`Derwin`




  ### 从“软件即产品”转向“数据即产品”


  大数据和分析需要一种思维上的转变，这对数据团队，尤其是数据工程团队来说可能很困难。软件工程关注的是发布软件。软件工程团队的核心价值在于发布修复错误或创建新功能的软件。而数据工程则侧重于利用数据创造业务价值。数据工程师仍在发布软件，但他们发布的是能改进数据产品的软件。


  这种从“软件即产品”到“数据即产品”的转变，对某些组织以及数据团队中的个人来说可能很困难。数据工程师通常来自软件工程背景，你的项目可能是他们第一次真正创建数据产品。管理层和业务部门需要协同努力，确保数据团队理解他们的工作重点是数据产品，而不仅仅是发布软件。


  ### 从“软件即产品”转向“数据即产品”


  如今部署软件服务涉及一系列相当成熟的概念，例如微服务架构、`DevOps` 实践、容器化等。其中许多概念仍然适用于以数据为中心的产品，但也有一些独特之处。其中重要的两点是：(1)
  数据科学家与数据工程师处理工作的不同方式，以及 (2) 以数据为中心的应用程序在应用架构、部署工件和监控要求方面的不同。


  数据科学家与所有科学家一样，通过探索和实验来发现利用数据的最佳方法，例如构建机器学习模型。他们通常不习惯典型软件部署中的流程化和自动化方面。


  这正是数据工程存在的首要原因——弥合这一差距。数据工程师通常创建应用程序基础设施，为数据科学家提供一种便捷的方式来添加和移除数据源与数据接收端，指定新的模型超参数（模型设计），有时还包括模型参数本身。


  然而，不建议让数据科学部门将临时模型直接交付到生产环境中。模型即数据，因此它们应受到与其他数据相同的治理，例如数据安全、审计和可追溯性。此外，成熟的生产环境会自动化创建和管理生产中的所有工件，以实现可重复性等目标。因此，组织实际上应该基于数据科学家指定的超参数，使用自动化的、`DevOps`
  风格的流水线来训练模型。


  生产基础设施还需要审计和监控模型性能，记录哪些数据是由哪个模型版本评分的，等等。


  监控模型性能的一个挑战在于机器学习模型固有的统计特性。工程师习惯于期望精确的结果（尽管分布式系统在这方面并不配合）。工程师必须习惯于监控一些能反映生产模型服务统计特性的指标。幸运的是，数据科学家理解概率和统计，因此他们可以帮助工程师理解如何解读新型指标。


  ——Dean Wampler，作者兼 AnyScale 开发者关系主管


  ### 交互不足或无效的症状


  管理层通常对其与数据团队的互动采取“放手”的态度。他们可能只在最初考虑数据战略和创建团队时密切合作。但数据战略只是需要互动以从数据中获取价值的众多不同阶段之一。


  当业务部门不参与数据产品创建的整个生命周期时，数据团队最终可能无法真正创造业务价值。实际的数据产品可能毫无用处，或者无法实现业务目标。业务部门和数据团队都应该为这些失败承担责任。如果数据团队采用敏捷方法，他们应该直接与客户（通常是内部业务用户）合作。同样，业务部门也需要腾出时间或积极推动，以便在产品生命周期中表达他们的意见。


  ![../images/499628_1_En_8_Chapter/499628_1_En_8_Fig1_HTML.jpg](img/499628_1_En_8_Fig1_HTML.jpg)


  **图 8-1** 团队离业务问题越远，数据产品就越可能与客户的需求不符


  当数据团队离业务问题太远时，他们很可能创建出不满足业务需求的数据项目。只有当数据团队相对接近业务问题时，他们才更有可能满足业务需求。你会注意到，当数据团队非常接近业务问题时，有效活动会急剧下降。


  我曾处理过一些团队，他们正经历着数据团队与业务部门之间缺乏协调所带来的后果。数据团队创建了他们自认为能解决问题的东西。但从业务部门的视角看，数据产品要么没有充分解决问题以至于不值得投入，要么解决了完全错误的问题。


  ### 与 QA 团队合作


  质量保证（`QA`）团队负责验证和检查软件是否正常运行。对于数据产品，这包括检查性能和数据本身。`QA` 团队从质量角度确认数据产品满足业务需求。这涉及检查软件本身、软件运行的分布式系统、正在创建的实际数据产品以及软件在系统上的性能。该团队需要回答以下问题：


  - 软件是否正常运行且没有抛出异常？

  - 模型在给定特定输入时是否产生正确的输出？

  - 软件是否在分布式系统上正确运行？

  - 创建的数据产品格式是否正确？

  - 软件的性能吞吐量是否与先前版本相同？


  根据 `QA` 团队的技术能力水平，这些测试可以是自动化测试、脚本化测试和手动测试的组合。测试越能实现自动化或脚本化，`QA` 测试的效果就越好、越一致。`QA`、数据工程和数据科学团队会注意确保充分的单元测试和集成测试覆盖率。


  为了正确运行性能测试，`QA` 团队需要针对已知的数据输入和硬件建立良好的基准线。否则，任何性能差异都可能轻易地被归因于硬件或数据问题，而非软件缺陷。


  `QA` 团队的技术能力各不相同。一些 `QA` 团队手动进行检查，其他团队使用脚本，而一些更高级的 `QA` 团队实际上会编写代码来自动测试和验证代码。


  `QA` 团队需要像数据工程师或数据科学家一样理解他们正在验证的系统。他们可能不需要像数据团队那样深入理解，但了解事情应该如何运作或不运作是至关重要的。`QA`
  团队需要获得与数据团队类似的学习资源。




  ### 与项目经理协作


  组织中的项目经理负责制定时间表，并计算完成项目所需的资源。产品经理则负责确保技术产品能够应用于解决业务问题。通常，产品经理会构思产品的新功能并确定其优先级。


  产品经理可能会与数据团队合作，或带着一些“小数据”观念加入团队。这些“小数据”观念会影响产品经理对技术和数据团队能否完成任务的判断。产品经理需要了解分布式系统和数据团队所能实现的可能性，这有助于他们提出改进产品本身的新思路和新方法。


  项目经理也需要理解，使用分布式系统会带来更高的难度和复杂性。如果不能理解复杂性的显著增加，项目经理就无法制定出合理且可行的项目计划。难以管理的时间表从一开始就会让团队落后于计划，这反过来又会让团队成员在项目之初就感觉自己没有做好工作。


  通常情况下，项目经理都有与不同技术团队协作管理项目的经验。这可能导致项目经理认为，大数据团队的时间表与小数据团队相似。例如，他们可能会困惑，为什么一个 Web
  开发团队的效率看起来比数据团队更高。管理和数据团队需要为项目经理提供资源，帮助他们理解在创建数据产品时，复杂性和时间表上的差异。


  产品经理会受到供应商的大量营销宣传，这些供应商往往对自己的产品能做什么夸下海口。产品经理很难从这些营销话术中分辨出真伪。同样重要的是，不要完全相信供应商的话。数据团队——尤其是合格的数据工程师——需要帮助产品经理梳理这些信息。


  ## 资金与资源


  一旦企业决定组建数据团队，管理层的首要任务就是为团队提供所需的人力与物力资源。当然，资金问题将涉及更广泛的关于目标与可行性的讨论，但我们先从落实资源开始，因为没有资源，一切都无从谈起。


  数据团队——或者当时最接近数据团队的现有组织——需要尽可能准确地估算组建数据团队所需的软件、硬件和人员成本。这需要最高管理层的支持。当人员配备和资源资金遇到阻碍——这种情况经常发生——你需要依靠高层的支持来推动事情进展。


  ### 人员配置


  数据团队的成长需要大量的人员投入，尤其是在初期阶段。数据团队中的合格成员——尤其是数据科学家和数据工程师——薪酬不菲。高管和其他管理层应设定符合市场水平的薪酬等级，否则，他们就得不断为数据团队成员的薪资进行特批或豁免。人力资源部门也必须了解如何提供合理的薪资等级和薪酬标准。


  人力资源部门还应参与职位名称和定义的制定。有些组织没有“数据工程师”这个头衔，或者他们现行的人力资源定义中，数据工程师仅局限于 SQL 方面。


  人力资源团队可能还需要批准调动管理人员来领导各个团队。他们可能需要协调将人员从其他团队调到新的数据团队。


  ### 软件与硬件


  管理层——尤其是高管层——普遍存在一个误解，认为大数据是廉价的。许多组织使用免费和开源软件，这种低成本认知源于对“开源”含义的误解。


  开源软件不是免费的吗？是的，但有一些注意事项你应当了解。让我简单概括一下开源软件的商业模式。


  你的组织可以从项目网站下载源代码、编译并部署生成的二进制代码。但这样会耗费大量员工时间，并需要等待所有漏洞被修复。


  下一步是获取一个打包好的二进制发行版，有时它已经预先打包在虚拟机中，由开源领域的公司创建。这些二进制发行版通常也是免费的——但在使用方式上可能存在一些附加条件。


  虽然这些二进制发行版听起来像是出于利他主义，但它们背后有其目的。开源公司试图让你轻松使用他们的开源发行版，以便你进行试用并基于它开发软件。一旦要部署到生产环境，你就需要考虑该发行版的服务和支持。既然你的代码已经在使用这家开源公司的发行版，那么他们就是你付费获取这些服务的合理选择。虽然他们的专业知识很有价值，但你可能会发现，为他们技术支持人员支付的费用比支付给自己的员工还多。这是本末倒置的计算方式——你应该投资于自己的员工。^(²⁰)


  理解了这些开源商业模式后，你就会明白，虽然开源软件是免费的，但相关的培训、服务和支持并不免费。有些组织选择独自尝试，自己支持一切。这种做法成功的程度不一。


  即便如此，开源的替代方案通常比闭源的专有方案更便宜。但请注意，这个词是“更便宜”，而不是“免费”。


  最后，还有硬件成本。无论你是在本地还是在云端创建分布式系统集群，硬件成本都会上升。这是因为需要启动许多不同的计算机来运行分布式系统，并从硬件故障中恢复。因此，硬件利用率并非
  100%。例如，某些分布式文件系统需要 1.5 倍到 3 倍的硬盘来冗余存储数据。换句话说，要存储 10 TB 的数据，你可能需要 30 TB 的原始存储空间。这简单举例说明了分布式系统下硬件成本会增加多少，具体程度会因分布式系统本身而异。


  所以现在我们可以开始讨论获得高层支持的问题。核心原因在于成本。组建成功的数据团队的成本，很可能超出高管的预期。管理团队必须认同实际成本；否则，成本问题会使任何数据管道项目都从一开始就难以启动。然而，有了足够的行政支持，项目和团队就能对成本进行准确的大致估算。




  ### Cloud


  有些管理团队和高管认为，使用云服务会让大数据变得廉价。使用云服务确实能让迁移成本更低，但并不意味着便宜。数据团队可以动态优化成本，这是本地集群无法做到的。


  如果团队使用云服务商提供的托管服务，就不会有特定的硬件或软件成本。通常也不会有授权费用，或类似开源供应商的附加成本。使用云服务不会对团队规模产生重大影响，运维团队除外。使用云服务商的托管服务能让数据工程和数据科学团队更高效，但通常不会显著改变团队规模。


  数据团队可能无法仅依赖云服务商的技术。他们可能需要使用某个供应商的技术。此时，团队又回到了为运行在云上的集群支付授权和支持费用的状态。


  同样，云服务商的费用不会成为组织的主要成本。数据团队的组建和合理的人员配置才是主要成本。执行赞助者需要理解这一点。


  ## 互动话题


  几乎所有组织都应该定期安排数据团队与业务部门就本节内容进行讨论。


  ### 数据策略


  数据策略包括从业务角度审视，数据产品如何增强或自动化决策。实际业务价值可以来自多个方面，常见的有：


  *   面向内部的产品，通过高级分析改善营销或销售

  *   面向内部的产品，用于降低成本

  *   面向客户的产品


  一个数据产品也可能同时服务于内部和外部客户。


  关于数据策略可以写一整本书，因为它依赖于众多不同因素：行业、产品、目标以及组织的风险承受能力。我不建议完全照搬竞争对手的数据策略，因为其中可能存在着你未知的深刻或微妙的差异。


  在制定数据策略时，我建议你邀请一位了解公司当前和潜在数据源的人，以及一位（可以是同一个人，也可以是不同的人）理解利用数据的技术可能性的人。这种专业知识让团队可以自由讨论各种想法，而不必因为缺乏信息而不断搁置讨论，或者向组织中的其他人询问数据问题的答案。


  将讨论锚定在技术现实上，也能防止团队在统治世界的计划上过于疯狂。通常，刚接触分布式系统的团队在判断可能性时，要么过于乐观，要么过于悲观，或者两者兼有。我以前参与过这样的讨论，帮助非技术人员抑制那种会失控的“银弹”观念很有帮助。


  管理层一个常见的错误是认为制定数据策略就是他们参与的终点。相反，这仅仅是开始。管理层需要引导数据团队走向有价值的业务目标。虽然数据团队会尽力而为，但这可能还不够。数据团队需要来自组织业务侧管理层的持续参与——但不要干涉他们的技术任务。


  ### 风险与回报


  数据策略的一个关键部分是评估开展项目的风险与回报。创建数据团队和数据产品会带来风险。如果项目失败会怎样？从积极的一面看，如果团队达成了他们承诺的目标，又会怎样？团队能为组织在成本节约或新收入创造方面带来多大的价值？


  当我与一个组织合作制定其数据策略时，我会寻找至少是项目成本 5 到 10 倍的价值创造。这种价值创造水平在“爬行”阶段可能无法实现，但应在后续的“行走”和“奔跑”阶段达成。请记住，数据团队项目的价值创造可能不会体现在收入增长上，而在于成本节约。


  如果一个项目未能创造可观的价值，下意识的反应就是归咎于技术。相反，管理团队应该真正重新审视他们启动数据项目的动机。可能是管理团队没有穷尽所有可以通过数据创造的价值，也可能意味着该组织没有将其数据视为一种可被利用的资产。问题可能源于数据团队资源配置不当。


  在这种情况下，“做对”意味着拥有一个具备适当技能和足够资源的数据团队来执行你分配的任务。让你的团队处于无法维持的境地是不公平的，并且会造成士气问题。这些士气问题最终会导致人员离开团队或组织。


  因这些原因而失败的项目，通常始于高层信息不足的指令。高层有人听说了分布式系统，并希望其公司引入，但没有考虑本书中描述的前提条件。


  具备这些起点的项目代表了最高的失败风险，同时价值创造最低。虽然一本书无法提供避免这种结果的具体建议，但我强烈建议重新评估这些项目的风险/回报。


  ### 管理并设定现实的目标


  高层管理中最具挑战的问题之一可能是为数据团队设定现实的期望和目标。高管们经常受到围绕数据产品可能性及其创造价值的市场宣传的猛烈冲击。这种宣传随后可能被那些对可能性只有二手或三手知识的高管们传达给整个组织。这些活动可能导致整个部门或组织对什么是可能的抱有不切实际的目标和想法。


  一个从一开始就面临不切实际目标的数据团队会有一个致命的问题。他们会落后，或者最终无法交付。我强烈建议在流程中尽早管理这些期望。请记住，你不仅要对抗组织内部的声音，还要对抗各种供应商的销售人员和营销机器告诉他们的可能性。所有这些人都省略了需要管理的关键细节和注意事项。




  ### 用例与技术选型


  我在本书中时常提及的用例，对于你在分布式系统上的成功至关重要。


  对于小数据和非分布式系统而言，99.9% 的项目都可以使用相同的技术栈。就我个人而言，这意味着我 99.9% 的工作都使用 `Java`、像 `MySQL` 这样的关系型数据库，以及像
  `Apache Tomcat` 这样的 Web 应用技术来完成。当我去开会讨论一个新功能时，很少会讨论我们需要哪些技术或可以改进项目。讨论总是围绕如何以不同方式使用现有技术或改进我们的使用方式。


  对于分布式系统，在讨论使用哪些技术之前，你必须先深入理解用例。^(²¹) 这是因为分布式系统存在小数据系统所不具备的权衡取舍。这些系统必须扩展的方式，以及系统中可能成为瓶颈的不同部分，决定了特定分布式系统是如何“取巧”的。我所说的“取巧”并非贬义。这些取巧方法是达到大数据所要求的规模所必需的。没有它们，你就无法扩展。请参阅第
  4 章的“架构师的角色”一节以及我的博客文章。^(²²)


  在完全理解用例之前做出技术选型，会使所选技术很可能无法处理该用例。你可能会为任务选错工具，这可能意味着完成用例期望在一秒钟内完成的事情需要花费一个小时。这可能意味着该技术只能进行批处理，或者处理输入至少需要
  1000 毫秒，而用例要求在实时环境下处理时间少于 200 毫秒。


  在选择技术之前理解用例，是我试图教给新数据工程团队和新数据工程师的首要事情之一。当我进行架构评审时，我们会花上几个小时在用例上。我们会深入探讨他们想要做的每一点细节以及背后的业务原因。通常，数据工程师们会变得焦急，想要开始在白板上画图、搭建架构图。我会促使他们更深入地挖掘用例及其背后的“为什么”。只有在那之后，我们才开始讨论技术。这样，在开始思考技术架构或实现之前，我们才能真正知道自己需要什么。


  ### 对权贵直言不讳


  对于高层管理者来说，一个中后期的问题来自数据本身。有时，你所在组织的数据或分析结果会与高管的决策或战略相悖。数据团队需要能够对权贵直言不讳，而不必担心被解雇。害怕失去项目或被解雇，会导致数据团队向高管隐瞒全部真相。最坏的结果是，团队开始篡改他们的发现，以迎合高管的先入之见。成为一家数据驱动的公司无关政治；它关乎改进业务和决策。


  高管可能会基于以往缺乏数据支撑的经验而产生偏见。模型的预测或分析可能与他们以往的经验相悖。数据科学家和高管可能需要共同努力，以消除这些观念，并逐步信任结果。可以通过展示那些被证实或证伪的假设，以及为得出这些结果所做的工作，来建立对结果的信任。


  随着组织成熟度的提高，对坏消息的容忍度也会增加。一个数据增强型组织将学会或知道如何处理和利用数据，发挥其最大价值。那些刚刚学习如何在决策中使用数据的组织，需要一个摸索期。


  对权贵直言不讳并不意味着数据团队应该采取敌对态度。这种情况确实时有发生，应该被注意并加以制止。


  ### 高管理层的关注


  日常工作的绝大部分是由组织的中层管理人员完成的，但高管对数据团队的成功也是至关重要的贡献者。在本章前面的“人员配置”部分，我们看到他们需要尽早发声，为组织的数据团队提供资金支持。这些决策应基于数据策略，以及基于对组织数据所能创造价值的持续精化估算。


  数据团队所需的一些变革必须在顶层发生。这可能是因为需要与组织其他部门进行协调合作。我见过中层管理人员努力向上推动变革，这简直是一项艰巨的任务。这些变革如果由顶层发起，会好得多，也高效得多。


  另一个后期决策与项目的成功有关。如果进展停滞或项目失败，高管层将决定是否继续推进。


  ## 应对不确定性


  数据科学在很大程度上是一项研究性工作。数据科学项目的实际结果是不确定的。它到底能成功吗？他们是否也能找到一个可以通过算法解决的问题？


  这与大多数工程任务形成了鲜明对比。给定一些工程任务，工程师有 99.9% 的几率能找到可以用数据改进或完成的事情。而对于数据科学，获得积极结果的几率并非 99.9%。一个完全可能的结果是，数据科学家花在任务上的时间最终一无所获。这种可能的不确定性结果是管理层常常不了解或不理解的。


  这种不确定性不仅关乎结果；它还延伸到验证可行性所需的时间。这就是为什么运行数据科学项目如此困难，因为你不能像管理工程团队那样管理它。你必须更像管理一个研发团队那样来运作。


  这种不确定性的一个显著例外是，当用例或数据被明确确定具有数据科学应用时。其中一些清晰的例子包括金融用例中的欺诈检测或各行各业的推荐引擎。我们知道，将数据用于这些用例是可能的。大问题在于结果有多好，以及对业务的影响。


  ### 数据源在变化


  除了这种困难，数据的多变性也增加了复杂性。当数据具有高周期性或历史数据很少时，情况会更糟。这意味着模型所用的数据经常变化，但你却没有足够的历史数据来观察其周期性趋势。


  即使在成熟的公司和行业中，数据也会发生变化。我见过出于不同原因发生这种情况，但我会分享一个易于理解的例子。在金融领域，使用机器学习进行欺诈检测非常普遍。在这些模型的另一边，是那些试图持续实施欺诈的人。这些欺诈者不会坐等好运降临。他们不断寻求更新、更高级的欺诈手段。数据科学团队需要随时了解数据源的变化——无论这些变化是有意还是无意的。


  其他时候，我们需要能够重现模型的结果。这可能是出于监管环境或实际法律的要求。你可能需要证明或展示模型是如何对一条数据进行评分的。你将需要各种随时间变化的数据片段。你需要知道用于训练和评分的确切代码，以及用于训练模型的正确数据。一些组织认为这可以通过时间戳和回溯来实现，但这并非总是可行，尤其是在数据源发生变化的情况下。一些组织将这种元数据嵌入到每条消息中，以便了解评分期间系统中正在发生什么。




  ### 模型的输出是一种确定性程度


  用于评分或推理的模型输出并非是一个真/假字段。它实际上是一个置信度或置信区间。对于不习惯数据科学的人来说，这可能会让他们感到震惊——尤其是对工程师而言。模型会给出一个它认为正在发生的情况的**正向或负向确定性**（通常是一个浮点数）。这个数据产品的最终消费者必须决定他们认为正常或在其容忍范围内的水平或数值。


  ### 不要畏惧数据产品的“死神”


  具有讽刺意味的是，数据科学家的分析和结果常常未被使用或被忽视。这可能是由于组织不相信这些结果、对其感到恐惧，或不理解其背后的数学原理。当然，最终也可能是因为结果与“薪酬最高者的意见”相悖而无法付诸行动。^(²³)
  当一个组织费尽心力与成本建立数据科学团队，却又对其输出视而不见时，这实在令人悲哀。


  这是一个关键点，问题的根源不在于技术或数据科学。这个问题纯粹是人为的——缺乏信任是核心问题。这是对创建算法的个人或团队缺乏信任。解决方案是开始让你的组织习惯于信任算法及其创建团队。


  这个问题在传统型组织中尤为普遍。在这些组织中，高管的直觉是决策背后的驱动力。对于这类组织，我建议将模型或输出定位为对决策或决策者的**增强**，而非完全取代。尽管这对数据科学团队来说并非最优情况，但这能让他们的数据产品投入使用，并给予人类时间和空间来适应。


  ### 不要忽视人的因素


  业务变革——尤其是数据团队带来的变革——可能会影响到整个组织中的人员。这些人员对项目的成功或失败同样至关重要，因为他们的热情或抵触情绪会积极地或消极地影响数据团队。


  当我与一个组织合作时，我不仅会询问有关商业价值或技术问题——我还会了解组织内部的政治动态和认同程度。为了不让数据团队的所有辛勤工作付诸东流，必须在整个公司范围内考虑这一点。


  例如，销售团队是否了解你希望数据对他们的工作产生何种影响？你是否就针对销售线索的优化建议咨询过他们的意见？客服代表是否知道你打算如何根据他们的专业领域和培训情况优化呼叫路由？外勤销售团队是否理解你希望为线索路由带来的变化和益处？


  如果你不考虑人的因素，你可能会面临内部的“哗变”。这种抵制行为是完全可以预防的，归根结底在于沟通。沟通正在发生的事情及其原因。争取人们站到你这一边，否则他们可能会破坏数据团队的工作。破坏的方式有很多：拒绝提供输入、无视建议，甚至积极采取行动让项目失败。


  #### 数据仓库/数据库管理员人员


  随着现代数据团队的出现，面临重大变革的团队之一是数据仓库团队和数据库管理员。新的数据团队正在接手并取代这些团队当前处理的用例。


  坦率地说，大多数组织一直在滥用数据库来做它们不擅长的事情。例如，需要扫描整个数据集的大规模分析查询就不是关系型数据库的擅长的领域。一旦消除这种滥用并改用其他技术，你的处境会好得多。处境更好意味着那些让数据仓库团队忙得不可开交的修补和持续性问题将不复存在。而这反过来又意味着你的数据库管理员团队规模不必那么大。


  管理团队需要审视对非数据团队的直接影响，并对它们进行 6 到 12 个月的评估。他们将面临一些关于人力规划的棘手问题。一旦数据团队处理了这些用例，其他团队需要多少人？有多少人可以升级为数据工程师并接受再培训？有多少人能在公司内部的其他岗位找到位置？他们是否需要到公司外部寻找职位？


  别误解我的意思——拥有数据库管理员和数据仓库团队的组织并不会完全消失。然而，他们的人员数量会逐渐减少，并且不会再填补空缺。也就是说，那些从未有过数据仓库团队、并且正在创建新的大数据团队的组织，不会回过头来再组建数据仓库团队。


  #### SQL 开发人员/ETL 开发人员


  SQL 和 ETL 开发人员也是一个难以处理的群体。很多时候，用例对他们的技术能力来说过于复杂。他们很难成为数据工程师。大多数情况下，他们的编程技能尚未达标，并且需要花费大量时间来准备。从组织的角度来看，你可能总是需要编写一些
  SQL 查询，但你的需求水平可能无法保持足够高，以维持 ETL 或 SQL 开发团队现有的人员编制。


  有些人争论 SQL 是否是一种编程语言。无论怎样，从 SQL 转到 Java 并不像从 C#转到 Java 那样是水平的转变。在 SQL 和 Java 之间，在语法复杂性和面向对象概念方面存在巨大的跳跃。这相当于从零开始学习，而非对现有知识的简单应用。相比之下，从
  C#转到 Java 更像是“我已经知道如何用 C#做这件事，我只需要弄清楚如何在 Java 中实现它”这样的转换。


  专注于 SQL 的员工或许能编写查询来支持一份报告。但要知道，他们可能需要依靠他人提供高级编程帮助，并且只能从数据工程团队产出的数据产品中创建这些数据产品。对于一些组织来说，报表的需求量足以让
  SQL 和 ETL 人员忙个不停。对于其他组织来说，用户——通常是业务用户——被期望自己编写 SQL，从而实现自助服务。到了这个时候，你甚至需要更少的专注于 SQL
  的人。


  SQL 在某些事情上很出色，但当某人仅限于使用 SQL 时，它就会被滥用。我见过用 SQL 编写的庞大且低效的查询，它们滥用了这门语言。这些查询虽然能勉强工作，但极其脆弱。只有最初编写该查询的人才能理解它，而更好的做法是将
  SQL 与某种传统编程语言（如 C 语言）的代码结合起来使用。


  ## 运维人员


  运维人员编制的变动将取决于集群是部署在本地还是在云端。这也将取决于数据工程团队是否会实践 DevOps。


  云服务，特别是托管服务，需要的运维人员更少。日常的硬件问题将主要由云提供商处理。对于托管服务，框架运维也将主要由云提供商处理。


  并非每个运维人员都能学会分布式系统。运维团队需要熟练掌握每个分布式系统的故障排除和操作技能。这种向分布式系统进一步专业化的转变，可能会催生需要一个专门处理分布式系统的独立运维团队。


  如果组织选择实践 DevOps，运维团队可能需要整合到数据工程团队内部，或者学会如何在问题出现时对问题进行分级处理。




  '
- '# 商业智能与数据分析团队


  总体而言，在向大数据转型过程中，商业智能或数据分析团队的人员编制即使有变化也会非常微小。对于数据团队而言，商业智能和数据分析团队获得的是新的数据产品用于分析，而非被取代。


  一些组织会晋升或调动部分技术能力较强的数据分析师，赋予其数据科学家的头衔，或使其成为数据科学团队的一员。如果这些人员未能 100%达到所需的技术或数学水平要求，组织应确保提供必要的学习资源。


  ## 建立关键绩效指标（KPI）


  为数据团队创建 KPI 能为其指明具体方向和需要达成的目标。除了公司层面的 KPI 或目标，我认为所有数据团队的 KPI 都应围绕这个问题："你是否在创造能产生商业价值的数据产品？"
  如果一个数据团队没有创建可用的数据产品，那么就应当有一个管理层能够指出的、表明他们未达标的 KPI。


  以下是为各团队提供的一些 KPI 建议。


  #### 数据科学团队


  *   手动任务的自动化程度提升

  *   时间、成本或欺诈行为的减少

  *   销售额、转化率或产品销量的提升

  *   分析或机器学习算法的周转时间缩短


  ### 数据工程团队


  *   数据质量的改进

  *   数据在内部和/或外部的共享程度

  *   内部数据自助消费能力的提高

  *   （针对新成立的数据工程团队）使数据科学团队能够完成以往不可能完成的任务

  *   数据科学家工作生活质量的改善

  *   机器学习、代码部署或代码创建的自动化程度提升


  ### 运维团队


  *   停机时间减少

  *   服务恢复的平均时间缩短

  *   数据及数据访问的安全性提升

  *   部署的自动化程度提高

  *   指标采集与监控能力的增强


