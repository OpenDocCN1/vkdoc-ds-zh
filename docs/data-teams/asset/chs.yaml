- '# 18. 某英国大型电信公司访谈实录


  ## 关于本次访谈


  | 访谈对象 | 匿名架构师 |

  | 时间段 | 2013–2019 |

  | 项目管理框架 | 瀑布模型与敏捷开发 |

  | 涉及公司 | 某英国大型电信公司 |


  ### 背景介绍


  本次访谈对象来自一家英国大型电信公司（TC）。为便于发布，我们必须对该公司及受访人进行匿名处理。


  匿名受访人（P1）是首席数据架构师。他已在该公司工作二十年，多年来随着公司从一项技术转型到另一项技术，他一直担任架构师。他负责从传统数据库到大数据及机器学习架构的全方位数据管理工作。他拥有工商管理硕士学位（MBA）。




  ### 启动计划


  从数据工程的角度来看，组织应保持高度的灵活性。应避免过于完整地定义最终状态或最终外观。组织对最终状态的看法会因技术或业务原因而改变。P1 表示，“感觉我们处于一种持续的进化状态中，我们大致了解已经发布的产品以及正在生产中的内容，但不太确定下一步会是什么。”
  架构需要支持数据科学家完成工作所需的渐进式变化和技术创新。预测这些变化是架构师的职责。


  创建架构需要一种微妙的平衡。它要求使用产品的各个工作组了解他们的真实需求。一旦对用例和理想的工作流程有了充分理解，P1 就必须审视现有技术以发现任何差距。这些差距可能存在于技术特性方面，也可能出现在处理规模和处理完成时间上。“这项工作涉及尝试、迭代，然后逐步发展，直到取得成功。”


  当数据团队刚刚起步时，最棘手的部分是弄清楚如何协同工作。P1 建议从仅两个项目开始。这能“与负责构建的团队、负责消费的团队，以及可能为你提供数据的团队建立共识。你可以获得足够的能力，让每个人都理解自己的角色和职责。”
  自此，事情将开始发展演变。


  ### 与业务部门合作


  TC 一直拥有深厚的研究与开发背景。因此，他们从一个应用研究团队起步，该团队由深厚的定量数学背景演变而来，并提升了编程技能。这使得 TC 能够创建集中式的数据科学能力，公司内的其他部门可以在其中找到电信领域高度专业化的技能。


  由此，越来越多的业务部门在其内部配备了二到六名数据科学家。这些业务部门包括消费者营销、网络运营和投资组合规划。数据工程和架构的工作就是为这些团队提供他们现在及未来所需的工具。


  他们数据分析演进的一个例子是旨在优化呼叫中心能力。传统上，他们有静态的专家系统，仅能查找来电者所说的关键词。在数据科学家创建了更复杂的模型后，通话时间从 40
  分钟缩短到了 5-10 分钟。将所有这些数据与需要集成的各种系统连接起来存在工程上的困难，而从业务部门获取想法并在多个不同部门之间进行协调则存在组织上的困难。呼叫中心项目通过缩短通话时间，既节省了成本，又改善了客户服务。


  ### 数据科学家与数据工程师


  对 P1 而言，最大的差距在于数据工程师应如何与数据科学家合作。在大型企业中，由于需要集成的系统数量庞大，数据工程变得困难重重。为了获得客户的 360 度全方位视图，工程师必须整合多个设计初衷并非相互集成的不同系统。除了这种架构上的困难，还面临着“购买还是自建”的决策难题。公司能否购买一个现成的产品来满足需求，从而以最小的定制化程度大幅加快项目进度？加上分布式系统带来的额外复杂性，这个决策变得更加困难。


  ### 为企业提供支持的模型


  与较旧形式的数据产品相比，现代机器学习模型被企业使用的时间往往更长。企业必须以超过十年的周期进行思考，因此其模型也必须具有同样的长久性。大多数企业都为软件工程和外部供应商关系制定了较短的流程。而现在，企业必须为模型制定长期计划。将模型长期部署在关键功能（如网络自动化）中，本身就存在巨大的风险。


  因此，P1 表示，TC“更倾向于使用我们自己构建的解决方案，因为我们可以精心构建它，并针对我们特定的客户群和产品集进行更深入的调优。我们可以构建比外部人员更好、更准确的模型。”
  通过创建自己的服务系统，他们还能够更快、更具扩展性地将模型投入生产。这些自建系统还使得数据科学家能够构建模型，确保良好的数据产品不仅服务于模型构建，也用于数据发现和探索。


  TC 还必须面对一个长期问题：每个模型应由谁长期支持？TC 传统的运营支持团队缺乏此类支持所需的技能。这项任务可能会落到数据工程师身上，需要教会他们模型如何工作以及应如何正常工作。他们会为置信区间分配一个容忍度，并确保所有评分都落在该容忍度范围内。如果模型未能做到，数据工程师会收到关于如何重新训练模型的指示。最后，他们会获得一个故障安全状态计划，即当一切崩溃无法工作时该怎么做。




  ### 从概念验证迈向生产环境


  Scrum 团队或小队存在陷入孤岛的风险。团队可能过度专注于自身的项目，而忽视组织其他部门的需求或工作。当一个组织从定义明确、分割清晰的项目，转向将数据作为服务或产品提供时，这种项目导向的思维就会成为问题。


  为了处理更多概念验证和探索性工作，TC 创建了其大数据平台和数据产品，并采用了“非常简单的标准化服务产品以及非常清晰的定义。这很像经典的福特模式。在这个平台上，你可以拥有任何你喜欢的东西，只要它符合这些标准之一，并附带半
  TB 的存储空间、一个启用了抢占功能的容器，并且你的作业可能被终止。” 这个大数据平台在推出时没有采用计费模式，这有助于规定其使用规则。


  这种模式对于快速引入团队效果很好。但对基础设施团队来说，这是一个巨大的变化，因为他们过去习惯于创建虚拟机后就再也不去管它们。运营一个平台或服务意味着基础设施团队必须了解正在运行的内容并监控这些进程。了解运行内容至关重要，因为“我们面临着所谓的‘噪音噩梦’，平台上有一些未受过充分教育、技能欠佳、并在整个生产环境中制造问题的租户。”
  因此，运营服务平台需要思维方式的转变。


  概念验证工作的一个权衡是，设置过多的工程规则或服务等级协议（SLA）会抑制创新。P1 说：“我认为我们成功做到的一件了不起的事情是，大幅降低了进行相当探索性的数据发现或洞察的门槛，比如一个小团队想要理解某个问题，或者进行一次性的分析，判断我们应该在哪里投资。这与大型项目形成对比，后者有相当清晰的需求、资金支持以及非常明确的收益预期。但我们必须在同一种基础设施上兼顾这两类需求，这本身就带来了挑战。”


  随着产品走出概念验证阶段，企业必须思考如何将基础设施投入生产。对 TC 而言，他们“天真地以为可以把所有东西都放在一个集群上，但显然这行不通。” 现在，他们为大多数用例使用专用集群。这样，TC
  就能防止有人“突然过来编写一些疯狂的作业，破坏整个系统的稳定性。” 创建这个生产集群包括了制定其 SLA。这些 SLA 需要同时满足用例的业务需求和技术需求。通过启动多个集群，大型组织在处理运维问题时可以运用“宠物与牲畜”的类比。单一的整体式集群意味着你必须像养宠物一样维护它。而有了多个集群，你就可以像管理牲畜一样对待它们。


  ### 构建企业基础设施与运营


  TC 大数据之旅的第一阶段是多租户环境。他们最初的目标是创建一个实现数据和用例民主化的场所。这使得业务部门能够开始创建和运行分析。当业务部门开始将这些分析和工作负载投入生产时，问题就出现了。业务部门开始依赖这些“生产”数据流，并期望数据工程和运营团队通过
  SLA 来支持它们。但当时团队仍在创建流程和工作流以实现 SLA。


  团队能力与业务预期之间的这种脱节，促使 TC 投入更多精力来汇总业务需求：对数据产品以及该数据产品的业务需求进行清晰定义。TC 建立了一个流程，让业务经理能够以清晰的方式定义他们的业务需求和所需的数据产品。随后，他们运行概念验证，定义技术需求，并创建最小可行产品（MVP）。这个过程包括与业务部门的定期接触点，让业务部门能够决定功能是否符合、超出还是低于预期。这个迭代过程会持续演进，直到业务部门确信数据产品满足其需求。


  业务和技术人员都需要理解的一个关键微妙之处在于，数据产品与典型的编程工件（如模块、API 端点和软件库）有何不同。为了帮助业务部门理解这种差异，TC 设立了一个集中式数据工程团队，同时在业务部门内部也设有独立的数据工程团队。集中式数据工程团队会审查每个业务部门团队的提案，确保其遵循最佳实践。验证业务部门提案的过程是迭代的。它不仅仅是一次性的提交给委员会审批。相反，业务部门可以得到集中式团队的全方位配合和智力支持，共同迭代提案，直到双方都满意为止。


  TC 一直拥有非常丰富的数据。然而，他们过去只保留不到 1% 的数据，而丢弃了另外 99%。这是因为团队只关注数据的某一种用例，而该用例仅需要那 1% 的数据。在这个用例中，数据仅用于处理故障。由于另外
  99% 的数据被丢弃，后续的用例只能研究故障，而无法利用那些被丢弃的数据可能带来的价值。


  因此，TC 开始捕获所有数据，以便能够处理各种类型的用例。这使得数据的适用性从单一的特定技术用例，扩展到可以服务于业务的其他部门。


  ### 项目管理框架


  TC 的大部分 IT 项目都采用瀑布式方法论。这些项目通常以三个月为交付周期。之所以采用瀑布式，是因为它允许一次性发布大型项目，并便于各个团队协调更大规模的发布。使用数据团队平台的团队更关注可预测的时间表，而非敏捷性。平台的租户希望获得可预测的性能，对新增或更新的组件需求较低。


  目前正在着手努力，为数据团队开始采用敏捷方法论。为了满足那些希望少变化甚至无变化的租户需求，公司正在将他们的项目迁移到单独的专用基础设施上。其他希望采用更快、更敏捷方法的团队则继续留在当前的基础设施上。




  ### 给其他人的建议


  `TC` 认识到，在数据项目中取得成功的关键在于人才。他们努力招聘那些真正有经验的人。许多人声称自己能构建大数据系统，但实际上从未动手实践过。他们的知识全是理论性的，而拥有实际经验的人至关重要。当人们缺乏实践经验时，他们是在一个可能并未完全理解的根基上构建系统，也无法理解自己的决策对架构或运营带来的影响。从长远来看，这类根本性错误将代价高昂。


  对于任何组织而言，在开启大数据之旅之前，获得业务部门的正确支持与投入至关重要。业务部门必须从一开始就投资组建合适的数据团队和人员。如果仅凭单人或小组包揽一切，最终改进效果或`ROI`都将微乎其微。组织将无法实现利用数据的目标。


  `P1` 建议管理层理解并内化分布式系统领域不断变化的技术格局。一项技术的有用生命周期正变得越来越短。在短短时间内，`P1` 已经目睹了多项技术的兴起，随后又被更新、更好的技术所取代。`P1`
  表示：“我的印象是，规划的周期变得越来越短，而业务部门却希望越来越快。他们希望现在就能把事情搞定。”


  业务部门要求变革的速度正迫使数据团队做出改变。数据团队必须思考如何快速将某个想法落地，然后将其产品化，从而使模型具备可扩展性。某个团队可能想在一个业务单元内实施某个方案，但同样的想法或工作流程完全可以广泛应用到组织的其他部分。`P1`
  总结道：“从小处着手，快速推进，迅速上线。”


  '
- '# 19. 米基奥·布劳恩访谈


  ## 关于本次访谈


  | 受访人 | 米基奥·布劳恩博士 |

  | 时间段 | 2015–2019 |

  | 项目管理框架 | `Scrum` |

  | 涉及公司 | `Zalando` |


  ### 背景


  米基奥·布劳恩博士是`Zalando`公司的首席研究员。他拥有计算机科学硕士学位以及计算机科学与机器学习博士学位。


  *关于`Zalando`：“作为欧洲领先的在线时尚平台，我们将商品送达 17 个国家的客户。在我们的时尚商店里，顾客可以找到来自 2500 多个品牌的丰富商品。”*
  —— 摘自其官方网站


  ### 组织结构


  数据对电商公司至关重要。`Zalando`的数据科学之旅始于一个名为“*数据智能*”的集中式团队，该团队主要致力于创建小型原型。


  2015 年，团队约有 30 名数据科学家。`Zalando`的`工程副总裁``埃里克·鲍曼`主导了一项名为“*激进敏捷*”的项目，旨在从组织和技术层面彻底改革公司。^(³²)
  公司决定解散集中式团队，将数据科学家分配到新组建的、围绕产品构建的跨职能团队中。这使得后端工程师和数据科学家得以与产品和业务部门一起，共同进入同一团队。每个职能小组按“*协会*”形式组织，以便相似职能的人员可以聚在一起交流学习。


  每个团队负责部署自己的系统、选择运行的底层技术以及所有的运维工作。他们曾担心，一个集中式集群很难为所有团队和用例提供正确的支持。高层管理层认为，去中心化的方式能让每个团队拥有最大的灵活性来做出自己的决策。


  然而，团队和决策权的去中心化带来了意想不到的后果。独立开发部署的系统大量涌现，导致难以准备和维护这些系统以支撑可投入生产的数数据项目。


  2017 年，`Zalando`开始组建专注于基础架构的数据工程团队。他们改进了支持数据科学家和其他团队的数据基础设施，包括集中化机器学习基础设施。由于团队内部已有构建平台的经验，他们能够利用这些经验选择有效的方案，并淘汰无效的部分。


  公共基础设施开始改善运营效率和最佳实践的共享。集中化的基础设施使得团队能够更好地处理那些难以配置的软件，方法是通过捕获其配置并实现自动化部署。引入自动化使他们能够加速从开发到生产的整个流程中的所有环节。公司并未强制要求迁移到新基础设施，因此采用速度较慢，且主要集中在新建团队。


  随着新团队开始涉足机器学习，他们能够利用已有的学习经验和集中化基础设施。`Zalando`希望避免新团队花费数年时间重蹈覆辙，重新解决先前团队已经经历过并解决过的问题。通过持续努力，`Zalando`
  改善了将模型从开发投入生产的用户体验。


  `Zalando` 围绕研究、产品和开发领域构建其团队。米基奥曾担任搜索与推荐团队的团队负责人。此后，他被提升为首席研究员，负责审视整个`Zalando`的机器学习工作。




  ## 将机器学习价值社会化


  任何机器学习项目面临的最大挑战之一都始于数据。获取数据需要与公司内多个不同部门协作。在 Zalando，生成数据的团队（通常是前端或后端工程师）并不精通机器学习，也不会对数据进行高级分析。


  Zalando 需要分析其生成的大量点击流数据。这些点击流数据来自前端团队。最初，前端团队并不理解他们创建的数据对公司和其他团队具有多大价值。对他们来说，这些数据仅仅用于跨系统的追踪和调试问题。他们并未意识到其他团队可以利用相同的数据，并以完全不同的方式加以运用。由于未能充分利用自身数据，他们错失了潜在的业务价值。


  为了向前端工程师传达他们数据的价值，公司必须改变工程师们对数据的文化和价值认知：向他们解释，其数据可以用于多种不同用途。这种对数据的认知和重视程度，正是数据工程师与前端及后端开发人员之间的根本区别。


  对新技术和趋势建立切合实际的预期至关重要。机器学习这类趋势尤其容易受到媒体和供应商炒作的影响。Zalando 通过确保产品经理和产品人员理解机器学习究竟是什么，来建立切合实际的预期。这一举措是通过其培训项目实现的。这些培训项目由一群热心的成员联合推动，其中包括人工智能赋能项目经理
  Mikio 以及内部培训团队。


  Mikio 表示：“我实际上意识到，在[我们能创建有用的数据产品之前]需要先解决的问题是，所有参与其中的人都要更好地理解如何开展数据科学相关的项目。”产品人员和技术团队负责人都需要了解新机器学习技术带来的差异，并且要明白“纯工程项目与涉及机器学习的项目，操作方法会截然不同”。


  高层管理人员也需要理解机器学习的价值。Mikio 与内部培训团队合作，以半天研讨会的形式向公司的高级副总裁和副总裁们提供了这方面的背景知识。这有助于区分炒作与现实。研讨会帮助他们理解了机器学习与其他分析方法的差异，以及机器学习对业务的潜在战略影响。培训强调，数据科学团队必须先获取正确的数据，才能加以利用。他们讨论了长期历史数据的必要性，以便从机器学习算法中获得最佳结果。由于无法回溯并重新创建数据，研讨会强调了在决定是否长期保存数据时，就需要考虑数据未来的用途。


  为了确保知识不仅局限于高层管理，还为公司的非技术人员举办了另一场专门研讨会。他们的重点是从更高层面思考机器学习，并突出解决问题的数据驱动方式。最终，超过 300
  人参加了这些研讨会。这帮助非技术人员将数据和机器学习纳入其战略规划。


  此外，还面向后端工程师举办了更具技术性的会议。这让对机器学习感兴趣的后端工程师能够开始加深对它的理解。会议之后是更密集的培训，后端工程师可以学习机器学习的基础知识。然后，他们可以开始与数据科学团队合作开展机器学习项目。通过提供多个难度逐渐递增的阶梯式步骤，公司能够服务于所有员工，同时将浅尝辄止的学习者与愿意投入时间和精力深入学习的人区分开来。


  ## 职位头衔的定义


  在 Zalando，有一个完整的职位家族被称为*研究职位家族*，包括数据科学家和研究工程师。数据科学家的职位描述遵循本书中给出的定义。他们对研究工程师的定义类似于机器学习工程师，这类工程师通常比数据科学家更擅长编程。


  软件工程师则属于另一个职位家族。数据工程师与前端工程师、后端工程师同属这一家族。数据工程师专精于大数据技术和基础设施。这使得数据工程师能够为数据科学家的努力提供支持。部分后端工程师也具备扎实的大数据背景并对数据感兴趣。


  由于 Zalando 践行 DevOps，因此没有专门的运维团队或运维职位。团队本身负责部署和支持自己的代码。SRE 团队提供第一级支持，而各团队则提供第二级支持。


  Zalando 为个人贡献者提供了一条可晋升至相当于副总裁级别的职业发展路径。首席工程师并非人员管理者，而是在公司内负责维护技术专长并提供技术领导力。首席工程师会被引入大型项目，以验证架构和确认技术解决方案。通过设定高层次的职业发展路径，工程师不会因感觉自己职业生涯需要进步而被强制转入人员管理岗位。




  ### 减少摩擦


  2015 年，Zalando 在组织和技术层面都经历了大量摩擦。他们花费大量时间试图跨团队协商资源和时间。例如，数据科学团队一直需要工程团队的帮助。而运行在单一数据中心中的单体代码库加剧了这种摩擦。


  更好地获取后端工程师的专业知识解决了数据科学团队的部分难题。数据科学家擅长创建小型原型。然而，原型与生产级别的代码或模型之间存在显著差异。数据科学家可以创建原型，但需要另一个团队将代码加固到生产级别。而那个生产团队有自己的优先级和任务。这通常意味着该生产团队的所有时间和资源已被占用。数据科学家和生产团队必须就资源请求进行协商和分类处理。


  Zalando 意识到，这种由其高度自上而下的结构加剧的限制，会抑制增长。协商和持续分类处理所产生的摩擦，导致组织无法规模化。


  Zalando 开始将来自不同职能的人员组合到单一团队中，以减少摩擦。这种组织结构接近于本书中定义的 DataOps。每个团队都将包含数据科学家和后端工程师。这使得团队能够创建完整的管道。


  团队将与产品人员合作，理解需求，创建原型，然后构建最终的生产系统。后端工程师将在编码和技术选型上支持数据科学家。数据科学家则负责创建模型或分析。现在，该团队可以在不依赖其他团队资源或时间线的情况下交付整个产品。


  最初决定合并团队的是工程副总裁 Eric Bowman。他首先决定进行技术转向，采用微服务和云。作为转向的一部分，他将数据科学和工程团队重组为自主的端到端团队。每个团队只负责服务的一部分。


  将员工整合到端到端团队中，基本消除了为实现目标而跨组织协调的需求。现在，数据科学家可以直接接触后端工程师，而无需尝试跨越组织边界来获取后端工程师的时间。端到端团队消除了瓶颈，提高了交付速度和增长。


  ### 项目管理框架


  Zalando 的大多数团队都使用某种形式的 Scrum 方法论。Scrum 框架更强调定期检查，例如每日站会和每周会议。“我认为这实际上与真正的研究非常相似。所以当我在大学指导博士生时，他们也会每周见面，看看这期间发生了什么，讨论下一步方向，”Mikio
  观察到。


  Scrum 可能难以在数据科学团队中使用，因为“数据科学很难承诺那个[以结果为导向的框架]，因为未知因素太多，”Mikio 说。为了使该框架更好地运作，他们“重新定义了冲刺结束时的成果是什么，并且让它更像是一种研究，或者更容易用作研究。”例如，一个冲刺的成果可以被定义为“确定新算法是否优于基线”，而不是“基于此算法部署新模型。”这些以研究为中心的成果使得数据科学家能够承诺在两周的冲刺中完成某些事情。


  这种对 Scrum 的诠释使 Zalando 能够进行频繁的检查，以确认数据科学家没有陷入困境，或者不再认为该算法可行。随着数据科学家的推进，他们能够更清晰地阐述其冲刺工作的可能成果。正是在这些检查期间，他们讨论可以采取哪些不同做法。“但在某个时刻，你也需要考虑是否还要继续下去。”


  ### 关键绩效指标


  Zalando 数据团队的关键绩效指标围绕他们负责的产品展开。例如，推荐团队的关键绩效指标关注的是由团队推荐所推广的产品的购买量。其他团队也有类似的关键绩效指标，这些指标基于他们创建的数据产品或模型以及为业务创造的价值。


  ### 提升数据科学家的工程技能


  从原型到生产代码，需要数据科学家的思维和行为方式发生若干改变。


  这始于改进围绕编码实践的软件工程规范。团队需要确保代码遵循软件工程最佳实践，以便长期可维护。


  起初，数据科学家在探索阶段沉迷于某些实践，而这些实践在发布到生产环境时仍会延续。数据科学家直接将代码更改部署到生产分支，他们需要明白这不是一个好的软件工程实践。团队还要求进行代码审查。除了直接规定这些改变外，他们还确保数据科学家理解这些在软件开发中为何是公认的最佳实践。


  文化变革延伸到了软件工程中一些更细微、更注重风格的方面。Zalando 开始教育数据科学家代码应该如何结构化以及为什么。这有助于数据科学家思考代码质量的长期影响。


  为了验证代码是否达到生产标准，Zalando 设立了若干流程。他们确保所有代码都已检入源代码控制并经过了代码审查。作为审查过程的一部分，代码还会被检查性能问题以及是否有足够的单元测试。


  整个流程旨在指导数据科学家。Zalando 理解变革是一个需要时间的过程。即使是拥有四年制学位的软件工程师也需要学习如何编写可投入生产且可维护的代码。“我认为这是一个指导过程，因为当数据科学家看到良好的代码布局时，数据工程师会解释他们为什么这样做以及他们在做什么。只要数据科学家对代码方面有兴趣，他们足够聪明，能够开始照做，”Mikio
  建议道。


  ### 整合业务与数据团队


  Zalando 并非设立业务部门和技术部门，而是围绕某个领域来组织团队。例如，一个单一的综合团队负责处理整个商品采购领域。该团队包括进行采购的业务人员、营销工作以及处理技术方面的数据团队。通过拥有完全整合的团队，业务部门得到了他们真正想要的东西，并且能够决定优先级。


  Zalando 并非一直如此。过去，技术部门和业务部门是分离的。在重组之后，两类团队被整合在一起。


  由于数据团队是业务部门的一部分，技术人员并非集中式管理。数据团队缺乏集中化可能会使得传递最佳实践和维护技术质量标准变得困难。Zalando 开始采用一种名为*公会*的新型组织结构，以保持数据团队之间的沟通与合作。这些公会包括每周的会谈，以促进信息和最佳实践的交流。




  ### 欧洲公司与美国公司的差异


  鉴于 Zalando 是一家欧洲公司，我向 Mikio 询问了这两个地区在文化、技术和组织方面的差异。


  Mikio 指出，欧洲公司对敏捷实践采取了不同的方法。欧洲公司通常不会在部门之间进行分隔或交接，而是由一个整合了不同职能岗位的团队来负责。他们更倾向于组建围绕产品而非基于头衔或职能的团队。


  欧洲的团队通常比美国公司在文化上更加多元。在美国，团队通常由 1 到 3 种不同文化背景的成员组成，而欧洲的团队则可能包含 5 到 7 种不同文化背景。由于不存在单一文化，数据团队能够避免陷入对概念的单一解读。文化差异带来的互补性贡献有助于团队提高生产力，并且更少陷入困境。


  《通用数据保护条例》（GDPR）是欧美公司之间的另一大差异。^(³³) GDPR 直接影响到数据团队，因为他们负责数据的存储与处理。Mikio 建议从一开始就考虑客户数据和相关法规。团队可以思考符合
  GDPR 要求的技术策略，例如对数据进行匿名化或加密。团队需要制定删除个人数据的计划。如果在设计过程中过晚才考虑法规合规问题，将会非常棘手，因为这可能需要重写代码，甚至调整架构。


  ### 给其他人的建议


  Mikio 建议：“*清楚地知道自己想要交付什么*”非常重要。这个清晰的构想包括项目落地和明确的 KPI，“这样他们就有了可以优化的良好 KPI。”这些清晰的目标和衡量标准在
  Zalando 形成了良性循环，使得他们能够持续放心地投资机器学习。“我认为对 Zalando 来说，有一点始终成立，那就是你在投入资源进行机器学习方面获得了大量支持。”


  每个数据团队的基础都是数据本身。“我认为这就是为什么从构建良好数据开始极其重要。”当一家公司刚开始处理数据时，Mikio 建议不要试图一次性收集所有数据。相反，数据团队应该专注于“以高质量且易于查找的方式收集数据”。数据团队的初始目标应该是拥有正确、格式规范且可查找的数据，这样“无论何时你想利用已收集的数据尝试新想法，都会非常容易实现”。这种轻松分析或处理数据的能力，可以避免团队为了开发目的而“在现有基础设施上做一个一次性补丁”，接着为了生产用途重写代码，变成“最终我们扩展的那个版本”。


  在公司将集中的数据团队拆分到各个产品团队之前，需要先建立一些最佳实践。对 Zalando 来说，在拆分为不同团队之前，先建立数据工程文化至关重要。“所以我认为这有助于定下基调，”让团队在拆分后继续保持之前良好的数据工程实践。


  最近，Zalando 开始思考这样一个问题：“一个团队构建的东西，对另一个团队是否有用？”这种探究催生了通用代码和共享库的创建，Mikio 希望他们能更早开始这项工作。“我们选取某个团队行之有效的东西，然后自然地加以构建，并使其对其他团队也有用，”这样每个团队就不必各自重复造轮子了。


  这种重复不仅限于代码，也延伸到了数据。不同领域的团队以相似或略有不同的方式处理着相同的数据。这些团队只能访问相同的基础数据。无法创建一个修改后的数据集，来提供经丰富或聚合的数据并供团队间共享。结果，每个团队都创建了自己对丰富或聚合数据的表示方式。甚至没有任何机制或流程能让每个团队意识到他们每次都在重复创建相同的数据。


  如今，Zalando 的团队真正理解了他们的目标和 KPI。他们拥有了良好的指标来了解自己的产品与 KPI 的符合程度。专注于改进 KPI 促进了进步，并鼓励团队尝试新方法。KPI
  创建了“离线评估新模型的代理指标”，能够快速轻松地判断新方法是否优于现有方法。他们可以“专注于在机器学习方面做出改进”。无需再思考“我得找到数据，我得把所有东西连接起来”，因为已经有了现成的评估框架，让一切变得简单而自动。“尝试一个新想法变得非常容易，并且可以很快看出它是否真的比之前的方法更好。”这形成了一个良性循环：实验的门槛极低，从而可以进行更多实验来寻找最优解决方案。




