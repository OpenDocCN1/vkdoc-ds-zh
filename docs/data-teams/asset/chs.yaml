  > ——蒙特尔·乔丹《这就是我们的方式》


  运行大数据项目与运行小型数据编程或分析项目不同。除了选择数据集和技术等显而易见的工作外，管理者和数据团队还需要落实许多微妙的构建模块。其中一些工作可能在数据团队被聘用之前就已经完成了。本章将阐述每个数据项目的步骤，大致按照它们应当发生的顺序排列。


  本章中的步骤最具普遍性，适用于几乎每个项目和每个组织。其他步骤可能特定于某些行业、特定规模的组织或特定组织。


  ## 准备步骤


  这些步骤应在编写第一行代码之前，甚至在做出任何技术选择之前就完成。成功的项目在编写第一行代码之前就已经奠定了成功的基础。它们始于正确的规划和聚焦。


  管理团队是完成这些准备步骤的主要力量。然而，他们将需要一位合格的数据工程师或数据架构师的协助。如此早地获取技术人员的意见可能会带来问题，因为这些步骤出现得太早，数据团队可能尚未有人入职。可能的情况是，当这些步骤需要合格的数据工程师时，你只能咨询一位初级数据工程师。根据组织规模的不同，可能存在另一个拥有数据架构师或合格数据工程师的团队。一些组织则会寻求外部帮助。在此阶段获得准确且称职的帮助，将在未来带来巨大回报。


  有些数据团队倾向于跳过准备工作，直接选择技术并开始编码来启动项目。如果数据团队跳过这些准备步骤，团队将面临在有人匆忙完成准备工作时停滞不前、毫无进展的风险。这些都是代价高昂的错误。


  ### 审视数据与数据问题


  由于分析结果首先且最主要地依赖于组织的数据，管理层需要深入组织内部，查找数据存在的问题。这将涉及与业务部门及其他非技术用户或潜在数据用户进行沟通。最好的信息来源是那些技术性更强的用户。这些对话将揭示可用的数据、数据的状况以及数据的归属方。同时，也能让人了解数据的孤立程度以及获取数据所涉及的博弈有多激烈。


  在此阶段，询问用户他们想做却做不到的事情。这些“做不到”的事情应当是技术性的；否则，数据团队可能无法解决。这些“做不到”的事情可能包括：


  -   报告/分析等运行时间过长。

  -   每当我请求运行报告时，都会被告知会导致生产数据库崩溃。

  -   团队告诉我，我的用例不可行，但我隐约觉得这是可行的——只是他们做不到。


  管理层可能会提出的一些问题包括：


  -   你现在做不到什么？

  -   如果能够做到，你会为组织增加什么价值？

  -   如果为这些“做不到”的事情设定一个货币价值，你认为解决它们价值多少？

  -   你为什么认为它做不到？


  一旦你对数据及其背后的博弈有了清晰的认识，就可以开始制定数据策略了。这正是专业技术人员的意见变得至关重要的地方。没有这些意见，管理层会制定出不可行或过于复杂的计划。我发现高层管理人员往往倾向于制定过于空泛或充斥流行词汇、难以执行的策略。为防止这个问题，我建议制定目标集中且可实现的短期或中期数据策略。管理层更应专注于一个迭代计划，随着团队和数据产品的推进定期更新该计划。




  ### 识别业务需求


  所有数据项目都应具有明确的业务需求。有些数据项目是基础性的，启动它们是为了未来能推动业务改进。但在基础性数据项目之后的下一个步骤，必须要有清晰的业务需求。仅仅搭建分布式系统集群是毫无价值的，除非有明确的愿景来说明这些集群将如何使用以及如何为业务带来益处。


  对于刚接手数据团队的管理者来说，确定业务需求或价值可能很困难。管理层可能无法直接提出他们需要什么样的业务需求并加以实施。原因可能是业务方缺乏回答该问题的技术知识。他们可能还不了解数据的价值，也不知道数据能为业务做什么。又或者，业务方提出的需求可能过于技术化且规定得过于具体，以至于解决方案只能解决某个特定的战术问题，而非满足更广泛的需求。


  当双方都不知道或无法阐明需要做什么时，数据团队就会陷入僵局。当业务方期望数据团队成为所有数据和技术事务的驱动者时，这种情况有时就会发生。当这种情况发生时，我建议举办一场研讨会，让业务方和技术方共同探讨可以做什么。这次会议需要有一位合格的数据工程师在场，以确保讨论的内容是可行的。


  这场研讨会无法直接回答需要创建哪些数据产品的问题，因此你必须聚焦于数据价值的次级效应。如果能更好地利用数据，组织能节省多少资金？组织能赚多少钱，或者能在多大程度上优化销售流程？业务能否通过网站、电子邮件或面对面互动来提升客户参与度，从而增加客户好感度？


  通过提出次级效应问题，并就行动方案展开良好对话，组织就能开始阐明清晰的业务需求。没有明确业务需求的数据团队，很难从数据中创造价值。


  ### 这是大数据问题吗？


  另一个需要回答的关键问题是，这些数据或用例是否涉及大数据。“大数据”的通常定义并不指定特定的大小，而是将其定义为当前系统难以处理的数据量。这实际上是一个分两步的问题。你现在拥有大数据吗？将来它会变成大数据吗？


  如果你没有大数据问题，也许其他团队更适合处理这项工作，例如数据仓库团队或软件工程团队。如果它是大数据问题，你就可以为组建数据团队提供依据了。


  在判断一个用例是否属于大数据时，请确保你能接触到具备技术能力的人来验证这个判断。你需要这种第二意见，因为管理层可能不了解用例或任务的真正细微差别。只有合格的数据工程师或数据架构师才能真正给出有约束力的答案。


  当这位技术人员参与评估时，他们需要确定所讨论的任务或数据是否将成为更大数据产品的一部分。成为更大数据产品的一部分可能意味着，尽管某部分数据本身并不明确符合大数据的标准，但它可能会汇入一个整体上属于大数据的更大型数据产品。这将使该数据有资格成为数据团队提供的数据产品的一部分。


  ### 决定执行策略


  在前置步骤中，管理层应该对项目及其初步范围有了大致的概念。完成项目需要多长时间？完成项目需要多少人？这些人是否已经在组织内部？如果是，将他们调入新的数据团队难度有多大？你是否需要从组织外部招聘来组建团队？你的组织通常需要多久才能招到新人？这些人（无论是内部还是外部）是否有能力执行项目？


  对于刚接触数据和分布式系统的新人，他们需要时间上手。团队实现这一目标需要多长时间？他们需要管理层提供哪些资源？在给予团队足够的时间和资源后，管理层应该等待多久才能开始期望团队产生产出？


  团队需要某种项目管理框架来保持工作推进并追踪当前状态。在提供团队所需的展示进展的结构与引入过于沉重的项目管理框架之间需要权衡（参见第 3 章）。如果流程过多，团队花费在走流程上的时间就会超过实际工作的时间。


  ## 规划与启动之间


  在规划项目与实际启动项目之间有一段“瓶颈期”。这段时间会发生什么，以及何时发生，取决于组织及其数据团队。有时，这些步骤会在规划和项目启动期间同时发生。另一些时候，它们会在规划阶段发生。对于较新的团队来说，这些“瓶颈期”步骤会在项目启动期间发生。


  实施这些步骤至关重要。省略它们会阻碍数据团队的前进。


  ### 寻找一些“低垂的果实”


  第 7 章介绍了数据团队“速度”的概念。这个速度是指数据团队基于其不断增长的分布式系统经验，能够实际工作的速度。在数据团队旅程的最初阶段，他们的速度会比较慢。正是在项目的这个阶段，数据团队的速度与创造业务价值所需的复杂程度相匹配。


  在项目的这个节点，你可能有一个待办事项列表，里面列出了项目需要完成的事情。你应该优先处理哪些？在现阶段，团队有能力完成哪些事情？待办事项中最具挑战性的任务是什么？对业务而言最关键的是什么？这些都是难以回答的问题，需要与多个不同的利益相关者进行沟通。


  有时，团队会首先瞄准能创造最高业务价值的任务。另一些时候，他们会从项目中最具挑战性的部分开始。我建议从寻找一些“低垂的果实”开始。项目的这个部分应该能展示业务价值，同时又处于团队技术能力可及的范围之内。通过这样做，管理层开始确认数据团队能胜任工作，同时又不需要花费无尽的时间来展示价值。


  让管理团队的其他成员知道，你们是从“低垂的果实”开始的。一些技术不太精通的管理者可能会认为，完成这一步后数据团队的工作就结束了，无需再付出更多努力。与此相反，数据团队需要非常明确地说明哪些已经做了，哪些还没有做。同时，管理层也需要清楚地了解这项努力或任务在多大程度上证明了数据团队的能力。




  ### 等待数据


  在任何组织中，数据都散布在各处。数据团队的价值之一，就是将数据汇集到一处，以便轻松访问。然而，他们能否成功还取决于组织的其他部门，以及其中存在的种种复杂情况和政治因素。


  在这种差距下，数据团队可能会发现自己只能干等数据。在大型组织中，我曾见过一些团队等待数据长达数月。在这些政治氛围浓厚的公司里，你需要依赖另一个团队来提供数据流，而他们对你能否成功几乎没有投入。这种等待状态对生产力是致命的打击。


  以下是我见过的一些等待状态示例：


  *   等待数据库管理员（DBA）或数据仓库团队为数据工程团队提供数据库访问凭证，以便数据流入分布式系统

  *   等待信息安全（InfoSec）人员批准你的数据移动、存储方式以及对分布式系统的安全审查

  *   必须说服另一个团队，让他们开始与数据工程团队共享数据

  *   应对某个政治对手，或某个认为数据团队的出现会对其团队产生负面影响的人，他们扣留数据作为一种策略，以阻止团队取得进展


  管理层应尽早着手启动数据获取流程。否则，数据团队将一直原地打转，因为缺失数据而寸步难行。


  ### 深入理解用例


  之前的步骤应该已经明确了组织的一般业务需求。通常情况下，这种理解是在宏观层面完成的。到了这个阶段，对业务需求的理解需要变得更加深入，彻底地充实用例。


  第 8 章讨论了深入理解用例意味着什么。我见过一些团队误解了需要理解用例的深度。这不仅仅是知道某个团队需要访问某些数据，团队还需要知道他们何时、何地以及为何要访问这些数据。


  只有在对用例进行深入调查之后，数据工程团队才应该考虑技术选型。在此之前就对技术或实现做出任何选择，都充满了风险。深入理解用例能让团队识别出技术上的注意事项，并为工作选择正确的工具。


  ## 启动项目


  在管理层和数据团队完成了所有准备工作之后，数据团队应该已掌握启动项目所需的全部信息和数据。


  ### 寻求外部帮助


  在项目的这个阶段，管理层应该对项目本身、数据团队的能力以及项目实施的难度有非常清晰的认识。这应能帮助管理层团队清楚地判断，在哪些方面需要咨询顾问或第三方供应商的帮助。


  是否寻求帮助的决定需要极大的坦诚和勇气。它要求管理者诚实地审视团队，评估他们是否能处理项目的复杂性。承认团队需要帮助并无不妥，尤其是当团队刚接触分布式系统时。分布式系统的巨大复杂性意味着大多数初学者都需要协助。


  团队内部的问题不会自行解决。需要齐心协力的努力才能实现变革，并且可能需要外部帮助。有些问题可能难以自行诊断。同样，寻找和修复这些问题也可能需要外部支持。


  两种常见的外部帮助形式是培训和咨询。


  #### 培训


  培训是个人贡献者和管理层快速学习新技能的一种方式。对于新兴和复杂的技术来说，培训尤其有用。现今有大量的培训方法，使团队更容易学习新技术。但并非所有培训方法都同样有效，价格与学习效果之间存在着权衡。


  一次优质的、为期两到三天的线下培训，可以为团队节省两周到两个月的开发时间。如果课程由真正的专家讲授，团队就能真正理解该技术以及如何在项目中应用它。反之，如果讲师只是站在台前照本宣科地读幻灯片，效果就大打折扣。培训课程质量的高低可以从其价格上窥见一斑，课程价格低廉通常意味着讲师的预算很少。而低薪酬的讲师很难成为技术专家。


  线上和虚拟课程的质量差异最大。在选择线上培训材料时，管理层应牢记培训的最终目标。如果管理层只希望数据团队对该技术有初步的了解，那么一门入门级课程就足够了。但如果管理层期望团队在项目中实际应用该技术，仅靠入门级课程是远远不够的。大多数线上和虚拟课程可能自称是“大师级”或“深度课程”，但人们很快就会发现，课程时长太短，无法达到精通该主题的程度。


  从某种程度上说，培训行业是自己最大的敌人。一旦某项技术变得热门，培训行业就会大量推出质量存疑的产品，这些产品只关注价格，而非真正的学习效果。在选择培训课程时，请记住，从长远来看，廉价的材料比由专家讲授的更昂贵的课程代价更高。要警惕那些只派出“充数”讲师来念
  PPT 的公司。


  如果做得好，培训课程能为数据团队带来最高的投资回报率（ROI）。培训教会的是团队如何创建自己的解决方案，而不是为他们设计好方案。借助专家，团队可以加速学习，而不是通过反复试错来摸索。




  #### 咨询


  咨询是数据团队获得帮助的另一种方式。不同层级的咨询合作范围从宏观指导到深度介入各不相同。在深度介入层面，顾问会编写所有代码并创建完整的解决方案。咨询有助于加速团队进展，管理层应根据团队的能力和雄心决定合适的介入程度。


  根据顾问的知识水平与项目复杂程度，顾问能够推动团队提速。然而，顾问将承担项目中大部分（如果不是全部）复杂环节的工作。数据团队自身并不会提升速度。这可能会对整个组织造成误导——看似数据团队在取得进展、不再需要顾问，但实际情况可能是顾问完成了所有工作，而团队自身并未深化其专业技能。根据团队对相关技术的掌握程度，组织需要额外分配时间和预算，用于将知识从顾问方转移至组织内部。


  选择咨询公司时，要警惕那些刚刚涉足分布式系统、编程或数据科学的咨询公司。这可能导致"无知者（咨询公司）引领无助者（你的组织）"。在这种情况下，你的组织可能缺乏经验或知识来识别咨询公司的无能。组织可以通过向曾与咨询公司有过顺利合作经验的人寻求推荐，来降低选错咨询方的风险。


  我曾遇到过不得不告知客户其另一家咨询公司毫无能力的情况。需要明确的是，这并非观点分歧。实际情况是那家咨询公司完全缺乏编程和分布式系统技能。他们只是学到足以说出正确术语并取得一点进展的程度。一旦项目复杂度超出他们对分布式系统的浅薄认知，就再也无法推进了。


  ### 选择正确的技术


  唯有深入理解业务用例，才能选择正确的技术。技术选择对项目成败起着决定性作用。选错工具会导致失败，选对工具则走向成功。新团队面临的重大困难在于，需要从海量的分布式系统技术中筛选出适用的。虽然数据团队最终需要实施和使用
  10-30 种不同技术，但他们必须从 100 多种候选技术中进行甄别。


  如果团队缺乏分布式系统经验，筛选所有技术的过程将耗费大量时间。这意味着团队会被技术选型问题拖延进度。为了避免日后重写代码，团队必须花时间研究正确的策略，而这些等待周期代价高昂。


  当新团队开始选择技术时，他们往往会倾向于行业里备受推崇的最新最热技术。使用最新技术存在固有风险。例如，团队可能选择一项新技术，但它缺乏足够的社区支持来获取帮助和解决问题。通常，那些经过时间考验的技术是更稳妥的初始选择。它们可能不够酷炫，但成功的概率更高。


  要做出正确选择，团队需要一位资深数据工程师或项目老手在场。这位专家能够带来将分布式系统投入生产环境的经验，以及长期使用分布式系统时会遇到的各类问题的处理经验。这种技术选型经验有助于降低选错技术或选错长期技术的风险。


  当数据团队开始选择技术时，他们可能倾向于分布式系统，但并非所有用例都需要分布式系统。在选择分布式系统之前，始终要审视用例的规模以及数据或处理量的潜在增长。在这种情况下使用不必要复杂的工具，可能意味着对某个用例的过度工程化。团队将在本应更快完成的事情上耗费过多时间。这里的"更快"既指编写代码所需的时间，也指查询执行的时间。


  其他时候，无论小数据系统还是分布式系统，初始代码可能写得极差，这才是问题的真正根源。虽然更换系统可能有帮助，但更重要的是重写那些性能低下的代码。


  技术选型是一个迭代过程，需要与"爬行、行走、奔跑"策略以及数据团队速度提升相配合。随着团队进步，他们需要为下一步添加所需的新技术。初始技术选择必须与团队当前速度所能承受的能力相匹配。随着团队速度提升，可以引入新技术以更好地管理某个用例，甚至开启高级用例。


  ### 编写代码


  只有在大量前期准备工作之后，团队才能开始编写实际代码。这种程度和数量的前期工作与小型数据系统形成鲜明对比。小型项目在编写第一行代码之前从不需要这种程度的准备工作。由于具备小数据背景，一些团队会直接开始编码而跳过前期准备。这是团队失败的另一个根源，因为技术可能需要更换，而且对用例的理解不够深入，无法正确编码。


  根据阶段不同，代码质量可能有所差异。团队可能编写原型级别的代码。重要的是要认识到，初学者团队的原型代码最终需要被丢弃或完全重写。因此，在生产环境中使用原型代码会导致团队日后必须偿还的技术债务。


  正是在这时，管理层可能需要重新审视是否寻求帮助的决定。如果管理层选择不寻求帮助，应密切监控数据团队是否陷入困境或进展缓慢。在这些情况下，管理团队可能应立即寻求帮助。如果管理层确实选择了寻求帮助，外部顾问提供的价值应该显而易见。如果顾问提供的价值微乎其微甚至没有，管理层可能需要做出一些人事调整。




  ### 创建计算集群


  数据团队需要创建多个计算集群。这些集群将使团队能够大规模运行或测试其代码。集群的数量和架构将取决于团队或个人的需求。例如，数据工程师需要哪种类型的集群资源来开发和测试他们的代码？数据科学家又需要哪种类型的集群资源来开发和测试他们的代码？


  数据工程和数据科学团队可能既需要独立的虚拟机，也需要集群。独立的虚拟机将用于在单机集群上运行分布式系统进程的同时开发代码。而集群将用于大规模测试代码和性能。这种划分有助于更轻松地调试和更快地编写代码。


  质量保证（QA）团队有自己的需求。QA 将如何以自动化和手动两种方式运行测试？QA 将如何进行负载测试或性能测试？QA 团队可能需要多个集群或多种类型的集群。如果组织是在本地部署，QA
  团队的硬件应该与生产环境的硬件完全匹配。否则，负载测试和性能测试的结果将与生产集群所能达到的效果或配置方式不符。


  对于许多组织来说，使用云是快速搭建数据工程、数据科学和质量保证集群的绝佳方式。使用云在集群的创建和使用方式上提供了极大的灵活性。许多组织将集群的创建过程自动化。这使得个人可以在完成任务后立即停止他们的集群。这为组织提供了两全其美的方案：仅在需要时启动集群，并在完成后关闭它以节省成本。


  ### 创建成功指标


  通常，数据团队对于需要完成的任务有明确的用例。他们对于需要做什么、为谁做有清晰的待办事项清单。然而，他们往往缺乏衡量成功的明确指标。没有明确的成功指标，他们可能会感觉无法成功，或者觉得目标在不断地变动。无论哪种情况，缺乏成功指标都会让团队感觉好像从未完成过目标。


  每个团队、项目和组织的目标和指标都会有所不同。这些目标通常基于组织的整体目标以及团队对该目标的特定贡献。它们通常与业务目标或为业务启用用例相关联。其他指标则与数据团队之间的交互有关。以下是一些示例：


  -   改善数据工程团队公开数据产品的方式

  -   通过更好的数据产品减少数据科学家花费在工程任务上的时间

  -   通过更好的指标和告警减少运营停机时间

  -   提高数据科学团队创建的机器学习模型的效率并对其进行优化


  ## 迭代步骤


  我强烈建议对项目采用迭代方法。某些步骤需要在更长的时期内执行，并贯穿爬、走、跑的每个阶段。


  ### 评估


  根据你的指标、目标和用例，你需要对项目和数据团队进行评估。


  关键问题是：你成功了吗？成功可以意味着很多不同的东西。你是否从组织的数据中获得了价值？团队的速度是否在提升？你是否从数据产品中创造了真正的商业价值，还是它们只是闲置在那里等待被使用？


  审视目标时，你是超越了目标还是未能达到目标？更有可能的情况是，你的组织会同时存在实现的目标和未实现的目标。为什么你会未达到目标或超越目标？团队是否需要更多帮助？管理层是否需要对团队进行一些调整？


  为了真正触及问题的根源，并获得对问题的 360 度视角，我强烈建议进行一次不追责的事后复盘。在会议中，团队以一种不追究责任的方式讨论哪些做对了，哪些做错了。让所有声音都参与会议以全面了解问题至关重要。例如，如果事后复盘没有质量保证团队参与，那么关于数据工程师如何将代码移交给测试的问题就不会被听到。团队可能不会意识到单元测试覆盖率过低且过于关注快乐路径。


  如果这些会议充满了指责并更多地聚焦于互相推诿，那么会议的价值就会降低。团队成员会变得防备并缄默不语，而只有最大的声音被听到。在这些会议期间，如果某人没有说话，我会专门询问他们是否有反馈或想要提及的事情。无论如何，主持这些会议的管理者必须充当调解人，以确保会议顺利进行，这一点至关重要。


  ### 何时重复


  在爬、走、跑的每个阶段，都需要重新审视这些步骤中的许多步骤（如果不是全部的话）。这些阶段之间的时间间隔可以是几个月或一年。在这些时期，事情应该会发生变化。团队应该获得更多经验。业务方面应该会发生变化，其对数据产品的使用和期望也应该会提高。


  例如，如果在“爬”和“走”阶段之间没有重新完成前置步骤，会有什么区别？数据和数据问题应该已经发生了变化。至少，“爬”阶段的数据应该已经到位。业务部门现在正在以一种以前不可能的方式（即最初的“不能”）看待数据。业务部门应该会看到他们想要用数据做的新事情。


  此外，数据团队的速度停留在“爬”的水平。当时，业务方的许多期望都超出了团队的速度范围。团队是否准备好迎接复杂性的下一次飞跃？


  正是基于诸如此类的原因，我推荐在项目工作中采用迭代方法。一个组织总是在变化之中，数据团队需要迭代地应对这些变化。


  '
- '# 12. 组织变革


  > *你尚未见到我最精彩的表现*

  > *请给我时间*

  >

  > ——艾瑞尼·卡拉的《名声》中的歌词


  创建数据团队不仅仅是获取一些新技能和部署一个集群那么简单。相反，要做好这件事需要一些组织变革。其中一些组织变革实施起来可能会很痛苦。本章将涵盖与技术变革同时发生的一些主要组织变革。


  -   如何与老员工合作并赢得他们的信任

  -   如何处理以前的任何团队

  -   数据工程和数据科学团队应该产生的创新与进步

  -   如何评估和处理团队内的技能差距

  -   团队所需的硬件变化




  ## 与保守派共事


  在大型组织或存在时间较长的组织中，总会有一些人会本能地抵制任何组织变革。这些保守派并非指年龄大的人，而是指那些在工作中安于现状的人。数据、数据团队以及新技术的变革会让保守派感到不适。保守派可以通过不作为或反对变革，让任何新项目或转型陷入停顿。管理层需要争取保守派的支持。


  争取对变革的支持可能是一项艰巨的任务——尤其是像创建数据团队这样涉及组织和技术层面广泛变革的情况。管理层需要探究变革为何会让保守派感到不安。他们是担心失业吗？还是担心自己能否学会需要掌握的新技术以及如何学习？他们可能觉得旧系统就像是自己的孩子，担心新系统会对他们的“孩子”造成什么影响。


  管理层必须提前准备好一针见血的答案来应对这些问题。否则，谣言就会四起，人们会因信息匮乏而变得焦虑不安。我曾与一些公司合作过，他们将保守派置于信息真空之中，结果我们花了更长时间来消除他们的恐惧和担忧。管理层最好在变革初期就尽早提供答案。


  在技术层面，创建新数据管道时获得保守派的帮助至关重要。那些存在已久的软件和组织积累了大量故事、决策和架构，新的数据管道需要与它们集成、从中接收数据，或者适应它们所有的特性和细微差别。正是这些保守派了解这些问题，他们将在确保整个系统正常运作方面发挥关键作用。管理层应深刻认识到这一点，并与保守派合作，尽可能建立顺畅的工作关系。


  我也经历过这样的情况：尽管我们竭尽全力，保守派还是拒绝提供帮助。处理数据的新方法让他们感到极度恐惧。他们明确表示会与我们作对，并尽可能拖延任何集成工作。这时问题就变得既是组织层面的，也是技术层面的。管理层可能需要开始向保守派的管理层施压。大多数情况下，这种抵制并不奏效，因为相关人员有资历，而且保守派的管理层更担心引起纷争。技术团队可能不得不开始对系统进行逆向工程，以了解其工作原理，并对如何进行集成做出有依据的推测。这种情况比一般项目耗时更长，管理层应相应调整时间表和期望值。


  ## 如何处理原有团队？


  并非每个人都能成功转型到数据团队。并非所有原本创建或使用数据产品的非数据团队都需要保持原有的人员编制。这引出了本书中最具挑战性的章节之一。它可能关乎人们的饭碗和生计。


  从基本层面来说，数据团队将取代某些用例，或者大大减少对其他某些团队的需求。在某些情况下，数据团队将完全消除对整个非数据团队的需求。


  非数据团队人员的减少将对劳动力规划提出新的要求。通常，有一个小型技术团队在生产环境中维护着一个数据产品，而管理层的计划是用分布式系统完全取代这个数据产品。这个新的数据产品将由数据团队创建和运营。随着时间的推移，原有的小型数据团队的责任将大大减少，而数据团队的责任将显著增加。


  那么，将原有小型数据项目的员工迁移到分布式系统上呢？这通常由于技术和非技术原因都很难实现。


  对于一些组织、团队和个人而言，他们当前的工作流程是他们多年创造和完善的成果。他们在那个领域感到非常舒适，而变革听起来困难重重问题不断。当新的数据需求出现时，这些员工可能没有意识到他们的工作方式正在给组织带来限制。这种问题甚至延伸到工作实践领域，例如开发与运维之间存在清晰的职责分离。当数据团队转向`DevOps`时，运维团队被迫提升编程技能，而数据工程师则被迫提升运维技能。


  对其他一些人来说，围绕他们数据的“孤岛”被视为保障工作安全的护城河。如果另一个团队绕过了他们的“护城河”或让数据变得更容易获取，就会触发防御机制，因为他们担心自己的“护城河”正在失效。


  有些员工在特定技术上下注进行了长期职业规划。多年来，他们从未重新评估这些长期赌注，而是加倍押注于原有的策略。可能会有一些拥有 10 到 20 年数据仓库、大型机或其他逐渐过时技术经验的人，他们会因数据管道和项目而感到威胁。这些变革将引入新的工作流程和组织变化，这与他们舒适且长期押注的领域截然相反。




  '
- '# 数据工程与数据科学的创新与演进


  数据工程应通过持续迭代，打造更优质的数据产品。这包括为数据科学家及其他分析目的创建更高质量的数据，也涉及引入新技术以提升数据产品的处理速度和规模。


  此外，数据工程需要实现新的应用场景。这是组织内部对数据产品需求增长的一部分。数据团队必须密切关注组织中涌现的、所需的新型数据产品，而数据工程团队将负责构建它们。


  数据科学家也应通过升级模型来持续改进。这种改进可能源于更高质量的数据，或是对各种参数的微调。无论在哪种情况下，模型都需要重新训练以获得最大价值。


  关于如何改进现有模型，或是创造更新、更精准、更快速的模型，新的研究成果层出不穷。数据科学家需要时间和空间来阅读最新的研究文献，这可能还包括花些时间尝试新方法，看看它是否能比当前方法带来提升。


  ## 数据团队是常设的吗？


  管理层常常会思考：数据团队是组织的常设部门，还是临时性补充？简单的答案是：他们是常设的。那些未能认识到这一点的组织，尚未充分领会数据文化的精髓。这可能是由于对数据团队及其工作缺乏了解，或是存在其他更棘手的问题。


  数据产品应被视为组织开发或制造的任何其他产品一样。数据产品不可能是交付后就彻底结束的短期项目。这一概念对许多组织来说可能还很新鲜，因为数据科学家需要持续改进和不断开发新的数据产品。


  数据科学家创建精准模型的能力，直接取决于数据的特征质量。数据会随时间推移而变化。保持高数据质量必须是一项持续的投资，因此数据团队必须是组织的常设部门。


  管理层——尤其是数据团队的管理层——需要向组织其他部门说明团队的工作内容及其提供的价值。同样，管理层也有责任为组织的其他部门创造实际价值。无法提供价值的数据团队会引发重大问题，必须解决。


  数据团队所提供的价值应该持续增长。老实说，如果应用场景、数据产品需求和使用率都没有增长，那一定是你做错了什么。组织之所以会自然壮大其数据团队，是因为其价值极高，且需求总是超过供给。如果供给过剩而需求不足，管理团队就需要弄清楚到底发生了什么。


  ## 评估技能差距


  第 2 部分讨论了数据科学、数据工程和运维团队所需的技能。所需的员工人数及其技能水平，将根据项目的复杂性、当前迭代速度以及人员编制预算而有所不同。然而，团队中至少要有一个人掌握每一项技能。如果团队中完全缺少某一项技能，就应该拉响警报。


  寻找缺失技能的工作被称为`技能差距评估`。这项工作应由管理层或团队负责人来完成。


  进行技能差距评估，需要对自己和评估对象保持绝对的诚实。我建议留出一些深度思考的时间，真正彻底地完成这份评估。


  有时，经理并不完全确定某人是否掌握了某项技能。这可能需要对当事人进行后续沟通，或者经理可以询问技术团队负责人的意见。


  ### 评估专业水平层次


  有些差距并非以技能形式呈现，而是对团队经验水平的评估。有些团队对经验水平有更严格的要求。例如，第 12 章曾提到，数据工程团队的经验层次分为：新手、合格数据工程师和资深专家。


  在进行差距分析时，你需要对团队成员的技能水平进行评级。当我们完成差距分析时，需要检查是否拥有合适的经验层次。


  ### 如何进行差距分析


  找一张纸横向摆开，或者打开一个电子表格，为团队应具备的每一项技能创建一个列。然后，为团队中的每个人创建一行。在第一行，列出数据团队需要的所有技能。接着，在最左侧一列列出团队中每个人的名字。如何进行此项操作，请参见图
  12-1。


  ![../images/499628_1_En_12_Chapter/499628_1_En_12_Fig1_HTML.jpg](img/499628_1_En_12_Fig1_HTML.jpg)


  图 12-1


  一张电子表格截图，展示了如何罗列技能和人员。


  现在，你要开始填写这张纸或电子表格了。逐一检查团队中的每个人，当他们具备某项特定技能时，就在对应的单元格里打上`"X"`，如图 12-2 所示。这需要坦诚地审视。能否尽可能诚实地进行此项分析，可能决定着团队的成败。


  ![../images/499628_1_En_12_Chapter/499628_1_En_12_Fig2_HTML.jpg](img/499628_1_En_12_Fig2_HTML.jpg)


  图 12-2


  一张显示某人已被标记为具备某项技能的截图。


  对三个数据团队都重复此项差距分析。


  有时，管理者可能想给某人标记为“发展中”状态，或者给某项技能打半分。有时人们在做差距分析时，会用百分比或带小数点的数字来代替`X`。他们可能会打上`0.1`或`0.5`而不是`X`。但这只会让你无法正视真正的技能差距。技能要么具备，要么不具备。根据我的经验，十个打了`"0.1"`的人，并不比给团队记零分好到哪里去。技能差距评估是非常二元的，因为每个个体必须达到某个确定的门槛。




  ### 解读您的差距分析


  现在您已经在每个人的技能上标记了 X，将它们汇总起来。这将告诉您关于团队构成的故事。它会告诉您团队的强项和弱项，甚至可能揭示出您的团队连基本工作都难以完成。如果每个团队都有各自的管理者，那么数据团队的管理者们可能需要聚在一起，对比他们关于差距所在之处的记录。


  在查看差距时，请开始问自己一些关键问题。技能评估是否准确？缺失的技能对项目成功有多关键？这项技能是现在就需要，还是短期内需要，或者更远之后才需要？培训某人掌握这项技能有多困难，以及需求的紧迫性是否足以招聘新人？招聘新人来填补这个缺口需要多长时间，这又是否会导致项目延期？


  有些团队比其它团队更需要某些技能。例如，在一个数据工程团队中，大多数成员需要掌握分布式系统和编程技能。^(²⁷) 如果他们完全缺乏某项必要技能，或者只有极少数人具备该技能，那么项目可能会耗时过长，甚至根本无法完成。编程技能和分布式系统技能的缺失，通常与那些从数据仓库团队或其它以
  SQL 为核心的团队中抽调人员组建数据工程团队的情况有关。


  填补某些技能缺口可能很困难，甚至无法通过招聘实现。在领域知识要求较高的组织中，培训拥有领域知识的现有员工掌握新技能，可能是更容易的方法。


  您还需要审视团队的经验水平以及一些紧迫的问题。团队里所有人都是新手吗？我至少有一名合格的数据工程师吗？我是否有机会接触或拥有一名经验丰富的资深成员？团队的经验水平是否与用例复杂程度所要求的水平相匹配？更高层级的经验无法通过培训传授，而需要亲身实践。这就是第
  4 章描述了一位项目老手关键作用的原因，他必须从基层一步步成长起来。


  ### 能力差距


  在本节的大部分内容中，我们一直假设团队中的每个人都能获得您所需的技能。技能差距意味着一个人目前缺乏知识，但具备学习该技能的天赋。情况并非总是如此。可能存在能力差距，这意味着一个人既缺乏知识，也缺乏成功学习该技能的天赋能力。无论投入多少时间、资源或专家帮助，都无法让他们达到下一个水平。


  在数据团队中，可能存在几个能力差距的例子。例如，视觉传达可能需要天生的艺术能力，而这几乎无法教授。期望一个没有创意天赋的人创造出外观和交互都优雅的作品，可能是不切实际的。同样，并非每个人都能达到数据团队所要求的水平来理解分布式系统或编程。期望一个完全是新手或从未编程的人去创建分布式算法，实际上也是不可行的。


  在进行技能差距评估时，管理者需要考虑差距是技能方面的还是能力方面的。如果某人最终无法掌握该技能，管理团队就需要做出其他安排。这可能包括招聘另一个人来补充，或者在组织内找到另一个更符合其才能的岗位。


  ## 硬件变化


  一些组织变革围绕着硬件展开。分布式系统带来了新的硬件需求。这些硬件需求在速度、尺寸和价格上，可能与组织之前在处理小数据时使用的硬件有所不同。


  ### 云服务使用


  如果可能的话，我建议使用云服务。这样，在`POC`（概念验证）启动之前，硬件采购就不会成为障碍。一些流行的分布式系统技术已经可以作为托管服务使用。这些托管服务消除了团队学习如何安装和启动分布式系统的需求。相反，他们可以直接开始使用该系统进行编程。


  云服务将允许团队根据需要随时启动和释放资源。这使得团队在开发和测试系统时，能够在精细的粒度上控制成本。如果团队不小心完全搞砸或摧毁了系统，他们可以轻松地重新启动集群。团队可以通过在非使用时间（例如过夜或周末）关闭集群来控制费用。


  ### 采购集群


  如果组织选择将其集群部署在本地，那么组织将需要采购硬件。由于更高的冗余需求，这些硬件可能比小数据服务器更昂贵。更高的冗余可以包括冗余电源，但主要区别在于存储和网络。


  在分布式系统中，数据会被整体存储多次——范围在 1.5 到 3 倍之间——在不同的计算机上。所有这些冗余数据都会通过网络在计算机之间传输。当读取数据进行处理时，这些数据可能会再次通过网络传输。


  一些组织期望或规定所有本地基础设施都必须使用虚拟化技术。虚拟化与裸机之间存在着明显的权衡，^(²⁸) 主要在于运维的便捷性。在我看来，选择本地部署而非云服务的主要理由是，可以决定是使用虚拟化部署还是直接在裸机上部署。一些分布式系统可能会利用裸机部署带来的更高速度和更低延迟。


  ### 大数据团队的硬件系统


  硬件的变更和升级不仅限于集群。组织大数据工作中一个常被遗忘的部分，在于编写代码人员所需的硬件和数据要求。这些硬件需求主要影响数据工程和数据科学团队。


  这些变化背后的主要原因是，大数据确实“大”。个人在开发代码时可能需要存储大量数据。他们还需要在自己的硬件上运行分布式系统。很少有分布式系统经过优化，能够在低内存或低
  CPU 的计算机上运行。分布式系统开发者的全部努力都集中在如何在集群上高效运行，而不是在开发者的个人电脑上。这些重量级的分布式系统将需要比处理小数据的开发者更多的
  CPU 和内存。这意味着，对于开发者来说，标准配置的硬件可能不够用。




  '
- '# 开发硬件


  考虑数据工程和数据科学团队将使用的硬件至关重要。在开发阶段，最好能让分布式系统在个人电脑上本地运行。这能消除许多变量，避免因开发人员使用共享资源构建分布式系统而可能出错或发生变更。如果他们已有笔记本电脑等硬件，其性能可能不足以运行他们正在编写代码的分布式系统。管理层可能需要尽早行动，要么购买新电脑，要么升级现有电脑以满足新的硬件要求。


  一些组织为开发人员提供运行在独立计算机上的虚拟机用于开发。这些虚拟机也可能面临资源不足的相同问题。管理层可能需要开始争取为分布式系统开发提供新等级或新类别的虚拟机。


  一些组织会锁定计算机，阻止开发人员获得操作系统根权限或管理员权限。这可能会严重拖慢开发进度，因为开发人员需要在他们的电脑上安装和运行分布式系统。没有根权限或管理员权限，他们将无法做到这一点。一些组织有经过批准的软件清单，可以方便地安装软件。但很可能这些分布式系统不会出现在清单上。管理层需要设法获得根权限，或与
  IT 部门合作来安装新软件。


  '
- '# 测试和 QA 硬件


  组织常常会忽略质量保证所需的硬件。他们需要的不仅是一个集群。QA 团队可能在每个测试阶段都需要几个不同的集群。他们将需要一个集群来验证软件功能，另一个集群用于性能和负载测试。用于性能和负载测试的硬件应与生产环境完全一致，但用于验证测试的硬件不必相同。


  如果 QA 团队缺乏所需的硬件资源，可能会损害数据产品的质量。硬件短缺可能导致新软件发布延迟，因为 QA 团队在等待硬件，或者因为他们的硬件速度不够快。如果 QA
  团队不进行性能和负载测试，新软件可能存在性能缺陷，运行速度不如之前版本。生产环境中的性能问题既令人压力巨大，又难以查找。最好在发布数据产品之前，通过性能和负载测试发现并修复这些问题。


  ## 为数据科学家提供数据


  为了完成工作，数据科学团队需要访问能代表生产环境中使用的数据。管理层、数据科学团队和数据工程团队需要找出将数据交到数据科学家手中的最佳方法。如果没有尽可能高质量的数据，数据科学家可能会看到有偏差的数据呈现，或者无法遇到所有边缘情况。


  由于多种原因，将数据交到数据科学家手中可能很困难。一个常见原因是安全方面的考量。如果数据包含个人身份信息或财务信息，组织应该怎么做？谁有责任选择处理个人身份信息的最佳方式？谁应该是实施处理个人身份信息方法的人？


  另一个问题可能是数据量过于庞大。数据科学家如何对 1PB 的数据进行探索或分析？需要牢记数据科学家的技术能力。数据科学家可能不具备选择合适的工具来完成工作的工程知识。这时，数据工程师必须帮助数据科学家理解他们的需求，以及如何使用正确的工具来实现这些需求。


  '
- '# 管理机器学习中的风险


  随着机器学习被嵌入到更多的系统和应用中，公司开始意识到那些结合了数据、模型和代码的产品所伴随的特定挑战。我倾向于使用的统称术语是“风险”，在过去的几年里，我一直在演讲中阐述公司如何管理机器学习中的风险。^(²⁹)


  从风险的角度来定义这种情况的好处是，某些行业（例如金融）已经有了明确定义的风险管理角色和流程。机器学习在许多公司内部仍然相对较新。由于它结合了数据、模型和代码，机器学习系统带来了从初始规划阶段到部署和可观测性都需要考虑的挑战。这些挑战和风险包括：


  - 隐私

  - 安全

  - 公平性

  - 可解释性和透明度

  - 安全性和可靠性


  机器学习中的风险管理需要团队吸纳来自不同背景和学科的人员。由背景多样的人员组成的团队可以确保更广阔的视角，这反过来有助于防止发布带有性别、文化或种族偏见的模型。根据具体应用，隐私、安全和合规方面的专家可能需要在项目更早阶段介入。如果机器学习要吞噬软件，我们也需要处理
  AI 和机器学习的安全问题！这意味着要吸纳安全和隐私方面的专家。很难找到精通密码学和隐私保护机器学习领域最新发展，或者了解对抗机器学习模型对抗攻击的最新防御手段的数据科学家或机器学习工程师。


  展望未来，我们需要建立更好的流程和工具来帮助团队管理机器学习中的风险。在一个机器学习日益普及的世界里，我们也需要重新思考如何组建和配备产品团队。公司需要拥有背景和技能组合更加多样化的数据团队。


  ——本·洛里卡，作者，顾问，会议组织者，Gradient Flow Research 负责人


  脚注 1 2 3


  '
- '# 13. 诊断与修复问题


  > *工作更努力，做得更好*

  > ——《Harder Better Faster Stronger》，傻朋克乐队


  本章涵盖我在与世界各地数据团队合作时遇到的一些常见问题。问题的解决方案各不相同。作为一名数据团队管理者，你需要找出问题的真正原因。这是数据团队管理中最具挑战性的部分。你的诊断将决定项目乃至整个数据团队的成败。


  如果你跳过了前面的所有章节直接来到这里，试图找出团队的问题，我强烈建议你回头阅读本书的其他部分。在我给出可能的修复方案时，我期望你已经理解并阅读了之前的所有概念。


  有些问题在外行看来可能相似。但在内行眼中，这些问题不同，因为根本原因不同。我努力将这些问题的原因区分开来，因为每个原因和解决方案都是独一无二的，需要用不同的方式去修复。


  ## 陷入困境的团队


  有时团队就是无法取得进展。每天的站会听起来都是一样的。每一份状态报告看起来都和几个月前的一样。团队可能意识到也可能没有意识到自己陷入了困境，管理层需要留意这种缺乏进展的情况。这些团队和问题不会自行解决。团队可能以为自己能搞定，但根据我的经验，他们做不到。这些问题通常源于技术或人事方面的问题，这些问题对于团队来说过于棘手或根深蒂固，以至于他们自己无法解决。




  '
- '# 团队停滞与表现不佳


  ## 团队说他们会完成任务，但一个月前他们也是这么说的


  当团队的状态听起来像电影《土拨鼠之日》时，团队陷入了停滞。在《土拨鼠之日》中，主角每天醒来都重复同一天。类似地，停滞的数据团队每天醒来都会做与前一天相同的事情。永远不会有任何真正或实质性的进展。


  团队停滞有几个常见根本原因：


  -   团队不了解他们在做什么。复杂性太高，或者团队缺乏尝试该项目所需的必要速度。

  -   团队不愿意告诉你存在问题。这可能是管理层应注意的文化问题。

  -   你使用的顾问并不了解他们在做什么。由于数据团队缺乏分布式系统或编程的知识，他们可能无法知道何时出现问题。他们只能看到顾问无法或没有取得任何进展的外在表现。


  ## 每当我给团队分配任务时，他们都会回来说任务不可能完成


  在健康的组织中，数据团队会创建被业务使用的数据产品。随着组织越来越受数据驱动，他们的需求和要求应该变得越来越复杂。但有时，数据团队可能会通过说任务不可能完成来拒绝请求。


  在这种情况下，`impossible`与`time-consuming`（耗时）或`tricky to implement`（难以实现）之间是有区别的。说`impossible`，团队是在声明没有实现该任务的技术路径。这可能是正确的，也可能不是。当团队说任务耗时，他们是在对面前的相对优先级进行推诿。他们在问：“你是想让我们做这个任务，还是做另一个耗时更少的任务？”管理层需要谨慎理解每个请求的优先级和技术难度。


  当一个团队持续说“不”时，通常源于以下原因之一：


  -   团队缺乏经验。可能是领域经验不足，或者对技术本身缺乏经验。团队可能没有完成任务所需的速度或基础（参见第 7 章）。

  -   团队中只有初学者。对于初学者来说，一切都会显得复杂且不可能完成。如果团队中有正确的经验组合，更多的任务将是可能的（参见第 10 章）。

  -   团队中没有项目老手。没有项目老手的指导，团队可能无法找到完成更复杂任务的方法，为了保全面子而简单地说不可能（参见第 4 章）。

  -   团队没有合适的人员。例如，数据工程团队中的数据工程师可能不符合数据工程师的定义。这些表面上称为数据工程师的人实际上无法完成任务。


  ## 我无法区分团队是在取得进展还是陷入停滞


  对于某些管理者来说，很难衡量团队在项目上取得了多少进展（如果有的话）。这通常发生在管理团队缺乏技术知识或之前没有领导过数据团队的情况下。在这种情况下，管理团队必须想办法从团队那里获得对其进展的准确评估。


  在某些情况下，项目复杂性的增加超过了团队成员的能力范围。在这种情况下，团队本身可能直到为时已晚才意识到项目超出了他们的能力范围。


  从团队获得准确评估需要管理团队与团队建立良好的关系。如果团队或项目已经存在问题，管理者和个人贡献者之间的信任可能岌岌可危。在问题开始之前就建立起信任关系和良好的互动关系至关重要。


  一旦管理层和个人贡献者之间建立了良好的关系，团队将更乐意分享他们在项目上的实际状态。


  在某些文化中，人们对承认失败或承认即将发生的失败极度抗拒。管理层应理解任何潜在的文化差异，并留意那些阻碍报告实际状态的文化问题。


  ## 我们在小数据系统上遇到麻烦，在遇到大数据时麻烦就更大了


  小数据和大数据之间复杂性的显著增加可以通过几种不同的方式表现出来。认为大数据系统和小数据系统一样容易的组织将会失败。如果一个组织在小数据系统上勉强能行，那么在创建大数据系统以及团队需要使用的分布式系统时，他们将面临极大的困难。


  在这种情况下，组织将需要大量的外部帮助。没有这种帮助，该组织很可能永远无法实现其大数据目标。根据团队能力水平的不同，培训可能是一个选项，但其效用有限。如果团队勉强能理解小数据系统，他们将无法理解或根据关于复杂得多的分布式系统的指导采取行动。更有可能的是，组织将需要大量的外部咨询来运行整个项目，而组织成员提供领域知识和项目管理。


  '
- '# 表现不佳的团队


  表现不佳意味着组织没有从数据中获得最大的价值。通常，这些团队或组织不知道或没有意识到自己表现不佳。该团队表面上满足了数据产品的所有条件，但当要求改进数据产品或创建更复杂的数据产品时，团队却做不到。


  停滞的团队和表现不佳的团队是有区别的。当团队停滞时，它在项目上没有任何明显的、真正的进展。当团队表现不佳时，团队确实取得了进展，但其增长在范围或复杂性上是有限的。


  ## 每当我给数据团队分配任务时，他们创建的东西都无法工作


  在爬行阶段，团队能够取得进展并创建数据产品。现在，随着项目变得更加复杂——例如在行走或奔跑阶段——团队无法创建在开发层面或生产环境中能够正常工作的东西。


  当团队无法创建正常工作的东西时，通常源于以下一个或多个原因：


  -   团队中缺乏合格的数据工程师。编写的代码缺少合格数据工程师所具备的“完工”质量。合格的数据工程师会亲身经历对高质量代码投入生产所需的良好单元测试和集成测试的需求（参见第
  7 章）。

  -   团队中只有初学者。当一个人对分布式系统完全陌生时，他们会创造出最糟糕的“怪胎”。这些“怪胎”在生产环境中无法工作（参见第 10 章）。

  -   团队未对他们本应使用的技术进行培训，或者其开发速度不足以应对项目复杂性的水平。在继续更复杂的项目之前，团队可能需要更多的培训和时间来理解分布式系统。

  -   组织缺乏卓越运维能力。组织可能需要一个运维团队，该团队已接受过他们需要维护的分布式系统的培训。




  ### 每次我给团队布置任务，他们做出来的东西都不是我真正想要的


  这里，业务方要求数据团队的管理层开发一个新功能或数据产品，团队表示他们理解了任务。团队开始工作，并带着数据产品回来交差。但当管理层或业务方去使用这个数据产品时，却发现它不可用，或者无法实现最初业务方提出的需求。


  不可用的数据产品通常源于以下一个或多个原因：


  -   数据工程团队缺乏领域知识。要真正创建一个可用的数据产品，数据工程团队需要非常详细地理解用例。如果没有该领域的背景知识，团队只能实现项目需求中的一小部分。

  -   可能没有足够的业务运营或管理层介入。有时，管理层或业务方将任务交给数据团队后就撒手不管了。业务团队和数据团队之间应该保持持续且一致的互动，以确保数据产品满足他们的需求。

  -   数据团队可能能力不足。他们可能不符合岗位描述中设定的资格要求。

  -   给出的指令含糊不清。尽管业务方和管理层认为指令很清晰，但它们其实不够明确，或者存在太多没有明确说明的细微差别。

  -   在各种情况下，这已经是最好的结果了。分布式系统很复杂，可能存在技术原因或限制，导致无法交付业务方或管理层要求的数据产品。


  ### 团队能处理基础事务，但永远无法完成更复杂的任务


  在项目初期——例如在“爬行”阶段——或者当任务很直接时，团队能够完成任务或创建数据产品，这可能涉及编写一个 SQL 查询或扩展现有数据产品的用途。但是，每当遇到更复杂的任务——例如在“行走”或“奔跑”阶段——团队就无法编写代码或创建更复杂的系统。


  这种无法完成复杂任务的情况通常源于以下一个或多个原因：


  -   团队可能存在技能缺口。例如，数据工程团队可能完全缺乏编程或分布式系统技能。即使提供了编程或分布式系统的学习资源，团队可能仍然存在这些缺口。此时，这些缺口就变成了能力差距（参见第
  4 章）。

  -   团队完全由新手组成。这样的团队只能创建复杂度非常低的系统（参见第 10 章）。

  -   团队对他们应该使用的技术缺乏培训。他们可能对必要的技术存在根本性的误解，因此无法完成更复杂的任务。


  ## 技能缺口与能力差距


  团队问题的根源可能在于技能缺口或能力差距。技能缺口意味着该技能对这个人来说是可达成的，只是需要时间或资源来获取该技能。能力差距则意味着该技能超出了这个人的能力范围，无论投入多少时间或资源，都无法让这个人掌握该技能。


  第 12 章解释了如何识别技能缺口。管理者可以通过培训或让员工积累更多经验来弥补技能缺口，而能力差距则必须通过人员变动来解决。具体的人员变动将取决于具体情况和所缺失的技能。


  技能缺口和能力差距通常只应在将现有团队或个人调动或迁移到数据团队时出现。如果你在组建或招聘新数据团队时遇到这种情况，那说明你没有招对人。在进行人员迁移时，管理团队可能缺乏经验或远见，无法识别团队中哪些人存在技能缺口或能力差距。确定真相的唯一方法就是投入时间、精力和资源。


  ### 如何区分技能缺口和能力差距？


  区分技能缺口和能力差距可能颇具挑战性。


  首先要看为这个人提供了什么资源。你是否为他们提供了可行且高质量的资源来学习这项技能？并非所有人都能从书本或视频中学习。这个人是否有机会向专家当面学习？为他们提供的学习资源质量如何？如果学习资源质量低下或过于入门，可能无法传授必要的技能。


  时间也是管理层需要提供的资源。这个人是否需要在继续执行当前任务和工作的同时学习新技能？管理团队是否期望这个人利用自己的时间——花费晚上和周末——来学习这些技能？


  如果管理层没有为这个人提供足够的资源，那么问题可能在于技能缺口，可以通过开始提供必要的资源和时间来弥补。


  如果管理层已经提供了足够的时间和高质量资源来学习这项技能，那么就该寻找能力差距了。当被问及为什么这个人学习或理解这些概念有困难时，他们是怎么说的？他们是否归咎于时间不足？他们是否说需要慢慢来？这些拖延和推诿的策略往往是能力差距的标志。管理层需要果断决定，必须为此任务招聘新人。


  ### 团队在学习编程方面有困难吗？


  不同的团队对编程能力的需求水平不同。运维团队需要相对适中的技能。而数据科学和数据工程团队则需要扎实的编程能力——其中数据工程团队的需求最大。


  如果数据科学家不懂编程，可能存在头衔膨胀的问题，因为这个人的技能可能更接近商业智能分析师或数据分析师。数据工程师应该拥有软件工程背景。如果数据工程师不懂编程，说明他们并非来自软件工程背景。


  如果一个数据科学或数据工程团队的编程技能水平较低或完全缺失，那么在对其团队进行重大整改之前，组织甚至不应尝试启动大型项目。如果这种缺失代表技能缺口，那么团队需要开始接受非常密集的编程培训。如果这种缺失代表能力差距，那么组织需要开始从外部招聘。




  ### 团队来自小数据背景，在学习大数据和分布式系统方面遇到困难


  分布式系统带来的困难程度各有不同，具体取决于遇到困难的团队是哪一类别。


  数据科学团队对分布式系统的要求门槛最低。他们可能只需要了解足够的知识，在数据工程团队的大量协助下勉强应付即可。例如，他们可能需要学习如何为机器学习或其他处理任务编写分布式代码。对于数据科学家来说，在分布式系统方面存在能力差距是比较常见的情况。


  如果运维团队不理解分布式系统，他们可能无法维持你的分布式系统正常运行。因此，生产环境可能会出现问题。运维团队的能力缺口令人担忧，因为这会迫使数据工程团队将资源投入到生产问题上，而不是用于创建数据产品。


  如果数据工程团队在分布式系统方面能力薄弱，那你就面临真正严重的问题了。并非每位软件工程师都能从小型数据系统成功转型到分布式系统，因为其复杂性显著增加。组织应该暂停项目，直到对团队进行实质性的调整为止。


  管理层需要迅速判断数据工程团队或运维团队是否存在能力缺口或技能差距。团队是否获得了必要的学习资源，以理解他们需要使用的分布式系统？团队中并非每个人都能拿起一本书就理解分布式系统的概念。可能需要不同的学习资源，例如针对技术本身的面授培训、关于该技术的培训视频，或者参加专门针对分布式系统或该技术的会议。


  时间也是一个关键因素。管理层通常认为学习和理解分布式系统所需的时间与小数据系统相同。根据我的经验，一个人大约需要六个月的时间才能开始熟练使用他们所接触的分布式系统技术。对于某些人来说，可能需要长达一年的时间。


  判断一个人是否在分布式系统方面存在能力差距需要时间。管理层需要在较短的时间间隔内重新评估员工，以确保他们随着时间的推移不断进步。否则，管理层就需要从外部招聘人员，或者聘请顾问将分布式系统技能传授给团队。


  ### 我的团队说你错了，这个任务很简单


  确实存在一些例外的团队和员工。通常，这些人已经在数据、多线程或大规模并行处理（MPP）系统方面拥有丰富的背景。对他们来说，转向分布式系统是一个横向的迁移，而不是系统创建复杂性的巨大提升。对于具有这些背景的人来说，学习的难度和门槛都会大大降低。在这种情况下，你可能会遇到一个例外团队：一个起点明显高于其他团队的团队。


  另一种可能性是，该团队尚未完全理解或内化与分布式系统相关的复杂性。基于对分布式系统的粗略了解，它们可能看起来很容易。然而，团队仅仅理解了所需知识的一小部分。一旦理解了全部问题和困难的广度，团队可能会意识到他们的任务更为复杂，要在分布式系统上取得成功需要付出大量的努力。


  ### 为什么我不能直接雇佣一些新手，让他们来创建这个项目？


  管理层的这种态度源自对数据团队工作难度和性质的几种误解。这些误解需要尽快澄清，否则团队将面临很高的失败概率。


  一种误解是，管理层认为不同的新手可以互相补充彼此的技能。管理层相信，一个新手不知道或不理解的东西，另一个新手会知道。实际情况是，新手们的知识水平是相同的，互补的理解程度非常低（`<<junior_only.>`）。


  另一个误解关系到分布式系统复杂性的增加。管理层可能曾通过将新手大量投入到一个小型数据项目中并成功将其推向了生产环境。管理层认为同样的计划在分布式系统上也会成功。


  这些误解的根源可能是一个更微妙的问题：为什么管理层想要团队里全是新手？是因为管理层觉得新手比有经验的人更便宜吗？他们认为组织支付给一个有经验的人的薪水，可以雇佣五个新手？管理者可能抱有幻想，认为五个人的生产率会等同于甚至远高于一个人。根据我的经验，一个分布式系统专家的工作效率至少是一个中等水平人员的
  10 倍，甚至可能是一个新手的 50 倍。


  现实情况是，一个数据团队会偏向于更多资深人员。团队中可以包括各种技能水平的人，但如果团队全是新手，其生产力将面临严重困难。我见过太多新手拖累团队中少数资深人员的情况，因为他们有太多问题需要解答，以及不断出现需要纠正的误解。


  ### 我们搭建了一个分布式系统集群，却没人使用


  一些组织认为，如果你搭建了一个集群，人们就会开始使用它。但这种情况并不会发生，过了一段时间，组织开始疑惑如何才能从数据产品中获益。


  首先，人们需要从技术上访问数据。即使有了分布式系统基础设施，数据可能仍然隐藏在孤岛中。要创造价值，数据需要被传输到组织内的各个地方。


  此外，组织中的其他团队也可能存在技能差距。虽然基础设施问题是问题的一部分，但它并非全部问题。团队需要投入时间和资源才能真正利用新的分布式系统。


  管理层常常犯一个错误，就是期望团队能在一个周末内学会分布式系统，并掌握所有必需的技能。技能习得所涉及的远不止这些。不要试图在成为数据驱动型组织这一漫长而具有挑战性的旅程中走捷径。


  ## 失衡的比例


  一些组织完全缺乏或只有极少数必需的数据团队成员。在这种情况下，员工无法完成本职工作，因为他们把时间浪费在了做自己不擅长的事情上：例如，数据科学家试图做数据工程或运维的工作。当管理层没有遵循数据团队的最佳实践，或者没有意识到数据团队需要不同的技能时，就会发生这种情况。




  ### 我的数据科学家们总是抱怨他们不得不包揽一切


  大多数数据科学家都希望将大部分时间花在数据科学的核心工作上：分析数据和开发模型。当他们无法做到这一点时，管理层就会开始听到他们的抱怨。他们会抱怨自己将时间花在了数据工程或运维任务上，而不是做他们以为被聘用来从事的数据科学工作。这通常源于以下一个或多个原因：


  -   数据工程师与数据科学家的比例失调。组织可能完全缺少数据工程团队。或者，数据工程师与数据科学家的比例可能跟不上组织的雄心壮志，导致没有足够的数据工程师来满足需求。

  -   有些组织认为他们有数据工程师，或者有人担任数据工程师的职位。然而，这些数据工程师可能并不符合本书对数据工程师的定义。他们可能缺乏创建必要系统和代码的技能。结果，这些职责就落到了数据科学家的肩上。

  -   对于某些组织而言，两个团队可能由于某种政治敌意或组织纷争而无法良好协作。这些问题可能阻碍两个团队有效合作，导致每一方都感觉必须独自承担所有工作。

  -   数据科学家可能不了解数据工程师的角色，或者不了解创建数据产品所需完成工作的复杂性。与开发数据产品所需付出的实际工作量相比，数据科学家实际所做的工作只是很小一部分。在他们自己眼中，数据科学家对整个产品相对微薄的贡献，似乎显得比他们实际作为整体数据产品一部分所做出的贡献要重要得多。

  -   数据工程团队创建的数据产品可能存在严重问题，导致数据科学家无法使用这些产品。作为回应，数据科学家将开始创建自己的数据产品，以规避数据工程师糟糕的工作成果。这些数据质量问题会使数据科学团队完全丧失对数据工程团队创建可用数据产品能力的信心，并持续感到被迫需要自行创建。


  当数据科学家觉得自己在数据工程任务上花费了太多时间时，他们最终会辞职，去寻找另一个拥有更好数据工程文化的组织。


  ### 我的数据科学家们不断放弃或中止项目


  在一些组织中，数据科学家会悄无声息地失败或停止数据项目的工作。数据科学家停止项目的原因可能多种多样，有些是对的，有些则不然。并非每个数据科学项目都可行，那些出于正当理由、没有结果就结束的项目是可以接受的。但是，当一个数据科学团队因技术限制而停止项目时，这个项目就被错误地终结了。这个技术限制对数据科学团队来说可能无法逾越，但有了优秀的数据工程团队却是可以实现的。


  当数据科学家因技术限制而放弃项目时，问题可能在于：


  -   组织完全没有数据工程团队，或者数据工程师与数据科学家的比例不正确。如果数据科学家没有可以求助的数据工程团队，他们将遇到技术瓶颈并就此止步。

  -   有些组织有挂着“数据工程师”头衔的人，但他们不符合本书中设定的定义。当数据科学家向数据工程团队寻求高级技术援助时，这些数据工程师会因自身的技术局限而无法提供必要的帮助或支持。这使得数据科学家只能自己在数据工程任务上单打独斗。


  ### 数据工程师的分析能力不佳


  数据工程团队中应该有人具备一些分析技能，以便创建报告或仪表盘。对于数据工程团队而言，所需的分析技能是基础的。它可能包括简单的数学运算，如计数或求和。为数据工程师提供一些数据科学的基本知识，以提升他们的分析能力，可能会有所帮助。


  ## 项目失败与银弹


  一些组织从一个技术迁移到另一个技术，或从一个流行词转移到另一个流行词。他们总是在寻找下一个“大事件”，却总是在没有实现目标的情况下继续前行。随着组织失败，他们总是将失败和错误归咎于技术。对于这些组织而言，难以正视自身并解决导致各种不足的管理原因。但除非组织解决了其管理问题，否则各个团队永远无法成功创建项目。


  一些组织在寻找“银弹”。他们相信，在某项技术上的赌注能挽救公司，或创造出巨大的投资回报率，从而解决组织的财务问题。尽管大数据项目能够创造巨大价值，但它们可能无法拯救一个正在衰败的组织。


  ### 我们已经尝试了好几个项目，但都毫无进展


  当多个数据项目毫无进展或未能展现出任何价值时，组织开始寻找答案。一个简单的退路是开始将失败归咎于技术。而那些更深入、更根本的问题则更难被发现和解决。在经历几次项目失败后，管理团队需要开始更深层次的探索，以找出事情出错的真正原因。


  管理层需要扪心自问：他们是否真的为团队的成功创造了条件，还是仅仅是在走过场？团队是否拥有所有必需的资源，或者只是拥有其中一部分？管理团队是否只是指定了不合格的人担任数据科学、数据工程和运维团队？


  有时，管理层不理解大数据项目所带来的复杂性增加。他们将创建数据产品等同于 Web 开发等其他相对简单得多的项目。结果，他们认为数据项目可以在与其他相对直接项目相同的时间框架内完成。在这些情况下，一个本需要四到五个月才能完成的项目，可能在一个月后就被取消了。管理层需要审查，团队是否获得了足够的时间来完成项目，并在必要时熟悉相关技术。



  ### 我们放弃大数据，是因为无法获得任何投资回报率


  大数据伴随着大量负担和开销。组织可能没有意识到或计划好大数据带来的额外复杂性。一些组织期望在数据项目中获得承诺的更高投资回报率，同时只需投入小数据项目所需的少得多的资金。


  在这些情况下，问题可能出在组织层面，而非技术层面。更可能的是，存在以下一个或多个问题：


  -   组织缺少一个或全部数据团队。组织尚未内化每个团队所创造的需求或价值。他们认为只需一两个团队就能应付，而不是全部都需要。

  -   团队中缺少具备实际岗位技能的人员。例如，数据工程团队可能缺乏创建数据管道所需的分布式系统和编程技能。没有创建数据管道的能力，组织就永远无法产生投资回报率，因为数据根本不存在。

  -   另一个问题可能是，组织在人员、技术或服务上吝啬支出或只支付最低价。一些组织试图以低于市场价 20%的薪资雇佣员工。他们在小数据项目中通过低成本取得了成功，但鉴于大数据带来的复杂性增加，这种做法不再奏效。其他组织试图寻求帮助，却寻找最便宜的指导来源——而这些来源反过来又给自己的员工支付低薪——如此循环往复。

  -   有时，人员没有获得成功的条件。如果一个团队刚刚接触分布式系统或数据，他们需要本书中列出的各种资源才能成功。

  -   对于更复杂的用例，团队可能缺乏所需的资深技能和领导力。没有这些技能，团队其他成员就无法规划或构思完成数据产品需要做什么。

  -   业务方可能轻视或不投入成功所需的努力。业务部门可能制定了一个缺乏任何实际细节或实质内容的模糊数据策略。他们将此交给数据团队去执行，然后业务部门就对后续投入撒手不管了。相反，业务部门需要持续与数据团队合作，验证数据产品是否真正满足业务需求。

  -   缺乏明确业务目标或成果的组织永远无法达成目标。没有最终目标，团队就无法创造任何投资回报率。业务和技术团队需要确定一个清晰的业务目标，并弄清楚数据产品如何实现这一目标。


  ### 我们尝试过云，但失败了；现在我们在大数据上也在失败


  一些组织将技术当作拐杖，用以处理更根本的问题。他们将每项新技术视为能改变组织命运的银弹。这些组织从一个技术跳到另一个技术，期望或相信技术供应商的炒作，认为新技术能极大地改善他们的业务。


  组织从未解决自己为何不断失败的根源问题。随着每项新技术的加入，组织只是重蹈失败的覆辙。之前的管理或组织问题没有得到解决，同样的错误会随着新技术再次上演。虽然组织把失败归咎于技术，但问题的根源在于管理和组织层面。


  在这些重复的技术失败场景中，问题可能源于：


  -   组织缺少一个或全部数据团队。技术供应商告诉他们，或者他们自己假设新技术能让一切变得更简单。基于这种假设的简易性，管理团队认为他们不需要所有三个团队。

  -   团队中缺少具备实际岗位技能的人员。例如，数据工程团队可能缺乏创建数据管道所需的分布式系统和编程技能。这阻碍了团队真正利用这些技术取得成功。

  -   另一个问题可能是，组织在人员、技术或服务上吝啬支出或只支付最低价。

  -   有时，人员没有获得成功的条件。组织期望每个人利用自己的时间学习新技术，而不是提供成功所需的资源。

  -   对于更复杂的用例，团队可能缺乏所需的资深技能和领导力。

  -   业务方可能轻视或不投入成功所需的努力。业务部门可能选择了最新的技术作为银弹，然后就推卸了所有后续责任。相反，业务部门需要持续与数据团队合作，验证技术实施是否真正满足业务需求。


  ### 这实在太难了；有没有更简单的方法？


  简短的回答是：没有。长的回答是：有，但不会像你希望的那么简单。没有一键即可启动数据系统的简单按钮。寻找简单答案和技术实施的组织往往失败或表现远低于预期。


  一种更简单的实现初步成功的方案是雇佣昂贵的顾问进来包办一切。组织实质上是将所有数据团队外包给外部供应商，由外部供应商为组织完成所有工作。为这项任务找到合适的外部供应商很复杂。要找到一家真正能胜任此任务的咨询公司很棘手。一个必然结果是，当管理层看到有能力的外部供应商进来包办一切的账单时，他们会感到标价震惊。于是他们开始寻找缺乏所有技能的更便宜的替代方案。


  我发现，那些过于关注开发便捷性的组织，成功几率非常低。在这种情况下，我认为这些组织最好甚至不要尝试大数据项目。


  管理层对便捷性的关注源于他们觉得存在一种能让这一切变得简单的技术。让我分享杰西关于复杂性的定律。大数据系统只有在针对特定用例或垂直行业时，才能变得不那么复杂。我不相信通用的分布式系统能够变得简单。我认为某些部分可以变得更容易，但那只是相对的——总体而言，这并不会使使用变得简单。


  在一些组织中，管理层团队认为缺乏便捷性在于编程的复杂性。如果团队能只使用不需要编程的技术，他们就能轻松解决问题。但编程只是大数据所需的其中一项关键技能。我将分布式系统单独列为一项技能是有关键原因的：它与编程同等重要。复杂性主要来自分布式系统，而且让通用分布式系统变得简单并没有捷径可走。你或许可以实施一些最佳实践或模板，但在可预见的未来，你仍然需要一名合格的数据工程师。




  ### 这些问题有简单的解决方法或捷径吗？


  是的，有时问题确实存在更直接的解决方案。找到更简单的解决方法，正是你的资深技能大显身手的用武之地。资深技能的价值在于防止团队——尤其是新成立的数据工程团队——做出愚蠢之举。这可以通过找到完成相同任务的更直接方式来解决。同时请记住，“简单”是相对的，管理团队永远不会因为事情简单而惊叹。


  有些团队和组织会试图一次性完成所有事，无论实现难度有多大。我强烈建议将项目分解为更易管理、更直接的步骤——即“先爬，再走，最后跑”。通过将更庞大、更长期的任务分解为更短期、更易实现的目标，团队才能创造出攻克难点所需的动力。


  刚接触分布式系统或大数据的团队很容易感到不知所措。当团队成员开始审视所需的工作时，从外部看，这些任务可能显得异常复杂。团队不可能毫无困难或成长阵痛地，就从 0（小数据）轻松跨越到
  100（大数据）。你的资深成员应当协助团队将复杂性分解为更易管理的部分，并引导他们克服这种不知所措的无力感。


  ### 我们雇了咨询公司帮忙，但他们却毫无进展


  我发现咨询公司的问题往往是自找的——组织自身因不遵循最佳实践而制造了麻烦。


  管理团队在选择咨询公司时，是否选择了报价最低的？为了报出极低的价格，咨询公司要么支付员工微薄的薪水，要么将工作转包给更低价的咨询公司。无论哪种情况，人员素质都可能低到无法完成任何工作。


  管理团队是否核查过这家咨询公司的推荐信，并找到其成功服务过的客户？在选择供应商时，会议室里是否有人知道该问哪些关键问题？销售人员的回应是仅仅安抚疑虑，还是确实言之有物？


  另一种常见手段是“偷梁换柱”。在销售周期和初次会面时，咨询公司会派出最能干的人；而项目启动、正式实施后，他们却派来资历较差的人员。这些能力不足的人无法完成任务，但不会承认任何问题，因为承认会导致自己被解雇。根据合同条款，咨询公司可能没有任何动力去做出改变，因为任何延误或问题都由客户方——而非咨询方——承担成本。


  ### 我们完全遵循供应商的指导，却依然未能成功


  可悲的事实是，许多供应商只为自己着想，而非为客户。为了促成交易，供应商会告诉客户他们想听的一切。销售人员更担心丢单，而非留住长期客户。


  在销售周期中，他们会告诉你他们的产品能解决什么问题，而不是推荐能解决问题的正确工具。销售人员也被“必须将每个技术问题映射到自家解决方案”的执念蒙蔽了双眼——无论该技术对当前用例多么不合适，也无论供应商自身技术实现得多么糟糕。可悲的是，有些客户依赖外部供应商提供技术建议，而供应商却认为做出正确选择是客户自己的责任。


  还有另一些供应商则像在“钓鱼”——到处寻找（任何人）来使用他们的产品。对于供应商推出的新产品尤其如此。他们更关心采用率，而非客户用产品取得的实际成功。最终，当产品无法成功时，背锅的只能是客户。


  ### 我们定义了数据战略，却毫无成果产生


  一些管理团队认为他们的工作在制定数据战略后就结束了。从他们的视角看，此后所有工作都应由组织其他部门完成。这是管理层——尤其是高管层——相当常见的误解。


  业务和管理团队持续与数据团队协同工作的重要性不容低估。在本书中，我专门用了一整章来阐述业务应如何与数据团队配合。


  创建数据团队不仅仅是技术层面的转变。整个组织都需要发生文化上的变革。数据团队只能带来有限的文化改变，而推动所需转变的主要责任在于管理团队。


  数据战略交到了谁手里？如果交给了通用的 IT 职能部门，IT 部门可能没有合适的人选，甚至可能只是把请求搁置了。这正是组织缺乏数据团队的表现。没有完整的各个数据团队，组织将无法执行整个数据战略。


  ### 我们的数据科学模型在生产环境中持续失效


  模型的优劣完全取决于输入的数据。如果存在不良数据，数据团队应花精力查明原因并预防问题。例如，程序可能需要更多错误检查和数据校验。


  模型本身也可能存在问题。数据工程师可能需要审查数据科学家模型的代码，以验证其对数据的校验是否到位。模型的调用方式也可能成为问题源头。如果数据或数据模型过于非结构化或定义不清晰，模型可能因编码问题而失效。


  ## 圣杯


  在大数据领域，追寻技术“圣杯”的组织相当普遍。这些“圣杯”代表着真正高级的公司经过长期创造的最复杂、最受追捧的设计与架构。这种追寻在刚涉足大数据和分布式系统的组织中尤为普遍——它们尚未充分理解或内化将要面对的复杂性变化，也未能认清组织自身需要进行多大变革才能最大化创造的价值。它们只是想当然地认为，照搬其他组织的做法就能获得完全相同的结果。


  有时，数据团队为了获得资金，不得不承诺能摘取“圣杯”。为了与其他预算项目竞争，数据团队只能许下无法实现或极其宏大的目标。这导致团队最终眼高手低、不堪重负。这些团队从未获得“先走——甚至‘先爬’”的机会，就被期望“直接跑甚至冲刺”了（参见第
  7 章“制定‘爬、走、跑’计划”一节）。





  ### 我们复制了别人的架构，却未能获得同等价值


  我与世界各地的许多组织合作过，其中一些是直接竞争对手。我曾深入研究过他们的架构和代码。尽管身处同一行业或业务领域，他们的技术栈和代码却截然不同。


  为什么相同业务的技术实现会如此迥异？数据的关键驱动力应围绕业务价值和业务目标。每个组织都有不同的目标，因此需要不同的实现方式来创造业务价值。


  技术应为特定用例提供支持。各公司的用例各不相同，因此会采用不同的技术。


  最后，组织之间的团队也各不相同。一个组织可能薪酬更高，拥有更有能力的人员，能够实施更复杂的用例；而另一个组织薪酬较低，人员水平参差不齐，难以实现复杂用例。


  虽然模仿可能是最真诚的恭维，但并非总是构建架构或选择技术的最佳途径。它被一些试图更快领先的组织当作捷径。复制而来的架构未必适合该组织的业务、用例或人员。


  在会议演讲和白皮书中，各组织自豪地分享他们成功架构的案例，但很少透露一些相关但至关重要的信息，例如：


  -   在实施架构过程中获得的外部帮助数量。演讲者所在组织可能得到了外部咨询公司或技术供应商解决方案架构师的大力支持。这种外部帮助可能使他们在实施所展示的架构时获得了巨大优势。

  -   团队在分布式系统、编程或相关技术方面的初始经验水平。团队中是否已有具备深厚分布式系统背景的人员，从而能相对轻松地实现横向技能迁移，而不是艰难应对复杂度的大幅提升？团队是否聘用了在之前工作中拥有该技术丰富经验的人，为团队带来了原本不存在的宝贵经验？

  -   演讲者通常不会提及他们实施该架构的时间跨度。很少有组织会诚实地分享从开始到当前状态的整个历程。对于一些拥有“圣杯式”架构的组织来说，这一历程可能长达十年以上。这个事实在演讲或白皮书中甚至可能根本不被提及。

  -   大多数技术会议演讲和白皮书都聚焦于技术或实现本身。它们要么忽略了业务案例的细微差别，要么根本未涉及业务案例。这使得听众或读者必须自行解读该技术或架构所支持的业务案例或创造的价值。

  -   我参加过许多会议，高管们会分享他们组织的转型历程。通常，我掌握关于该组织实际情况的内部信息或一手知识。高管所说的和实际情况往往是两回事。他们可能诚恳地夸大自己的成功，或者故意谎报进展程度。


  ### 我们有一个雄心勃勃的计划，却难以实现


  当你构想出一个“圣杯式”目标时，由此产生的雄心勃勃的计划本身就极具挑战性。


  如果一个组织刚刚涉足大数据领域，其团队很可能缺乏任何“速度感”（参见第`7`章）。这种“速度感”将使团队成员在分布式系统方面积累一些经验和信心。试图通过捷径获得“速度感”的组织会遇到巨大困难，项目也往往停滞不前。组织应更专注于可实现的目标，并为团队创造动力。


  在生产力方面将一个组织与另一个组织进行比较可能很困难。一个组织可能获得大量外部帮助，而另一个组织则在独自艰难前行。获得大量支持的组织可能明显更成功。管理层不应简单比较成功率，而应思考如何通过更多或更好的资源来提升团队的成功率。


  另一个问题可能是新手太多，而资深专家不足。当刚起步使用分布式系统的公司制定雄心勃勃的计划，并将实施工作交给新手时，他们正在制造一场灾难。这种情况有两种同样糟糕的结果。一种是团队用“权宜之计”拼凑出一个解决方案，试图满足宏伟计划，但该方案却无法达到生产环境使用标准。另一种可能结果是团队毫无进展。团队确实需要资深专家来帮助他们构建可供生产环境使用的系统——尤其是在架构特别雄心勃勃的情况下。


  ## 软件或数据管道在生产环境中不断出现故障


  一个组织可能会在代码部署到生产环境后自鸣得意，认为任务已经完成。分布式系统复杂性的众多表现之一，就体现在运维的困难上。问题不再局限于单一系统，而是散布在由数百个进程组成的集群中。


  许多软件产品和架构在理论上是可行的。真正的考验在于代码或架构被投入生产环境。正是在这时，最困难的运维问题才会得到解答：系统能否扩展以处理负载？有时答案是否定的，组织不得不紧急处理生产环境中故障的数据管道。


  ### 我们不断出现生产环境中断


  在开发环境中运行正常的系统，投入生产环境后常常会失败。这可能有多种根本原因。


  该组织是否完全没有运维团队？组织中或团队里谁负责生产环境中运行的软件、分布式系统框架和硬件？如果没有最终责任人，说明该组织缺少运维团队，需要创建一个。


  有些中断局限于特定领域。中断是否与数据团队最近部署的新分布式系统框架相关或直接由其引发？如果是，团队获得了多少资源来确保成功？运维中断可能源于代码或架构层面的根本原因，而非传统的运维问题。如果没有人获得培训等适当资源，数据工程师、数据科学家或运维团队可能缺乏足够的知识来正确使用该技术。


  运维团队可能缺乏故障排除技能。这项技能对于发现分布式系统中那些耗时费力才能追踪到的棘手问题至关重要。对于某些反复出现的生产问题或中断，最终需要依靠运维团队的故障排除能力来查明深层次或难以发现的问题。


  如果组织使用云服务，可能会遇到与云服务提供商相关的问题。在云端，所有资源都是共享的。有时，分布式系统集群中的单个节点会导致间歇性问题。其中一个典型问题是所谓的“吵闹的邻居”问题。运维团队不仅需要关注整个集群的性能，还需要关注单个节点的性能。




