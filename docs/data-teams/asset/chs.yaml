- '# 第一部分：数据团队介绍


  ## 数据团队介绍


  在深入探讨数据团队各个部分的细节以及如何与它们互动之前，我需要先给你一个关于数据团队的整体介绍。一旦你了解了每个团队的基础知识，我们就可以开始深入探讨细节了。




  '
- "# 1. 数据团队\n\n> *哦，我靠着朋友们的些许帮助才得以继续前行*\n> \n> —— 披头士《With a Little Help from My\
  \ Friends》\n\n利用大数据是一项团队运动。完成工作需要多种不同类型的人才，而在除最小型组织之外的所有组织中，这些人应当被组织成多个团队。当这些朋友的帮助汇聚一堂时，你就能做出一些了不起的事情。当你缺少这些朋友时，你就会失败，表现不佳。\n\
  \n这些朋友究竟是谁？他们应该做什么？又该如何去做？本书将解答这些问题。本书涵盖了组建数据团队的许多方面：在员工中寻找哪些技能、如何招聘或提拔员工、团队之间以及团队与整个组织之间应如何互动，以及如何识别并预防问题。\n\
  \n## 大数据与数据产品\n\n为了确保本书适合你——即我所讨论的主题与你的组织正在从事的工作相符——我将花些时间解释本书涉及的项目类型。\n\n一本关于大数据管理的书，怎能不先定义什么是大数据呢？我在此想做的，是超越那些流行词，得出一个真正对管理有帮助的定义。\n\
  \n### 可怕的 3V、4V、5V……​\n\n所有人都承认大数据是一个非常抽象的概念：你不能仅仅因为数据集大小达到了某个指标就说你拥有大数据。你必须找出小数据与大数据之间的质性差异。这很困难。\n\
  \nGartner 最初定义大数据的一次尝试催生了 3V 概念。最初的 V 是 Variety（多样性）、Velocity（速度）和 Volume（规模）。管理层很难理解这个定义。它太宽泛了。结果，每家公司都说自己的产品是大数据，而管理层仍然不明白这个定义。\n\
  \n这导致人们开始选择自己的定义。从 3 到 20 之间选一个数字，那就是被定义出来的 V 的数量。\n\n这些定义非但没有提供清晰的解释，反而真正混淆了问题。人们只是在字典里寻找听起来合适的、以\
  \ V 开头的单词。管理者们没有学到任何有助于管理现代数据项目的知识。\n\n### “无法”定义\n\n对于管理层，我更倾向于使用*无法*定义。当要求某人或某个团队用数据完成一项任务时，他们说自己做不到，通常是由于技术限制。例如，如果你要求你的分析团队提供一份报告，而他们说做不到，那你可能就遇到了大数据问题。\n\
  \n关键在于，*无法*必须是由于技术原因，而不是员工技能不足。倾听团队说他们无法完成任务的原因。以下是导致*无法*的技术原因的一些示例：\n\n-   任务运行时间过长。\n\
  -   任务会导致我们的生产数据库宕机或变慢。\n-   任务需要执行的步骤太多。\n-   数据分散在太多地方，无法运行该任务。\n\n显然，你那些受过更专业训练的技术人员会给出更精确、更专业的定义。我强烈建议你核实你的数据团队是否真正理解什么属于大数据、什么不属于。如果他们不理解，你可能正依赖一群并不真正理解需求的人。\n\
  \n有些组织规模较小或是初创公司。他们尚未出现“无法”的情况，那么应该怎么做呢？问题就变成了：该组织未来会拥有大数据吗？这种未来的大数据正是许多公司关注的焦点。事后回去重新设计大量的管道和代码以使用不同的技术栈是非常困难的。一些组织宁愿从一开始就解决这些问题，而不是等待。\n\
  \n### 为什么管理层需要知道大数据的定义\n\n管理层理解什么构成大数据至关重要，并且他们应该由技术合格的人员来指导。这是因为大数据与小数据问题的错配会严重打击生产力和价值创造。\n\
  \n用处理小数据的技术来解决大数据问题会导致“无法”。用处理大数据的技术来解决小数据问题也是个问题，不仅仅因为它会导致过度设计——还会产生巨大的成本和麻烦。^(¹)\n\
  \n许多大数据技术是开源的，这并不意味着它们很便宜。你的基础设施成本和人员工资都会上升。大数据技术往往尖锐且布满荆棘，而小数据技术则较少有需要你费力应对的细微差别。虽然小数据能让你在几台计算机上运行所有流程，但大数据的计算机数量会急剧膨胀。突然间，你的基础设施成本就高得多了。有了大数据，你的响应时间、处理时间和端到端时间可能会增加。大数据不一定更快；只是对于过大的数据来说，它比使用小数据技术更快、更高效。\n\
  \n管理层需要知道何时应该对大数据的热潮保持审慎。管理层不应该让工程师说服他们使用不适合当前工作的工具。这可能源于工程师方面为了美化简历。但在出现“无法”的情况下，大数据可能是正确的方法。\n\
  \n最后，如果你用小数据技术尚且勉强支撑，那么大数据技术只会更加困难。我发现，当一个组织几乎无法利用或产品化小数据技术时，复杂性的显著跃升会导致项目失败或表现不佳。\n\
  \n## 为什么大数据如此复杂？\n\n大数据使用起来比小数据复杂 10 到 15 倍。^(²) 这种复杂性从技术问题延伸到管理问题。误解、低估或忽视这种复杂性的显著增加，会导致组织失败。\n\
  \n从技术上讲，这种复杂性源于对分布式系统的需求。你必须在多台计算机上编写分布式代码，而不是在单台计算机上完成所有工作。分布式系统本身通常难以使用，并且必须谨慎选择，因为每个系统都有特定的权衡取舍。\n\
  \n*分布式系统*是将一个任务拆解并在多台计算机上同时运行。这也可能意味着将数据拆分并存储在多个计算机上。大数据框架和技术就是分布式系统的例子。我使用这个术语，而不是谈论某个具体的大数据框架或程序。老实说，不幸的是，这些大数据框架来了又去。\n\
  \n管理也变得更加复杂，因为员工必须以你前所未有的高度和一致性在整个组织内进行协调：不同的部门、小组和业务单元。例如，分析和商业智能团队以前从来不需要与 IT\
  \ 或工程部门有如此高频率的互动。IT 组织也从来不需要向运营团队解释数据格式。\n\n从技术和管理两个角度看，团队之前都不需要以如此高的带宽联系来协同工作。之前可能有一定程度的协调，但没有这么高。\n\
  \n其他组织面临的复杂性在于，数据本身就是产品，而不是软件或 API 作为产品。他们以前从来不需要宣传或推广组织内可用的数据。对于数据管道而言，数据团队甚至可能不知道或无法控制谁有权访问数据产品。\n\
  \n一些团队非常孤立。处理小数据时，他们还能勉强应付。从来没有需要去联系、协调或合作的必要。与这些特立独行的团队合作本身就可能是一个挑战。这恰恰是管理变得更复杂的地方。\n\
  \n\n\n### 数据管道与数据产品\n\n本书所讨论的团队处理的是*数据管道*与*数据产品*。简而言之，数据管道是一种让数据可用化的方式：将数据引入组织、传输给另一个团队等——但通常会在过程中对数据进行转换，以使其更具实用性。而数据产品则负责接收数据集，以可供他人消费的方式组织数据，并以他人可用的形式呈现。\n\
  \n更具体地说，数据管道是一个将原始数据转换的过程，使其对组织中的下一个接收方可用。要取得成功，这些数据必须通过合适的工具技术来交付，并且这些技术必须正确适用于相应用例。数据本身以能够反映数据动态变化本质及企业对其需求变化的格式提供。^(³)\n\
  \n这些数据管道的输出便是数据产品。这些数据产品应当成为组织的生命线。如果无法实现这一点，那么该组织就不是一个数据驱动型组织，也没有从数据投资中获益。\n\n\
  为了稳健可靠，数据产品必须具备可扩展性和容错性，以便最终用户在生产环境和关键场景中能够可靠地使用它们。数据产品应组织有序并编入目录，以便于查找和使用。它们应遵循一种商定的结构，这种结构可以在不涉及大规模重写代码的情况下演进，无论是创建数据产品的管道本身，还是下游消费者。\n\
  \n数据产品通常不是一次性或临时创建的产物。它们是自动化的，并持续不断地被更新和使用。只有在特定情况下，你才可以走捷径创建短期或临时的数据产品。\n\n数据产品的真实性和质量至关重要。否则，使用数据产品的团队将把时间花在清理数据上，而不是使用数据产品上。质量持续低下的数据产品最终会侵蚀人们对数据团队能力的全部信心。\n\
  \n## 常见误解\n\n在我们聚焦于如何让大数据为你所用之前，需要先破除一些迷思，这些迷思阻碍了管理者认识到大数据的特殊要求、招聘合适的人才来应对大数据，以及有效地管理人才。\n\
  \n### “这些都只是数据”\n\n有时人们会说，这些都只是数据。他们试图表达小数据和大数据之间没有区别。这种想法对管理尤其有害。它传递出的信息是，数据团队所做的工作很简单且可被替代。现实情况是，小数据和大数据之间存在着巨大的差异。你需要完全不同的工程方法、算法和技术。对这些差异认识不足，是导致项目失败的文化因素。\n\
  \n人们可能出于某些原因这么想。他们可能身处一个数据工程做得不错的组织。他们只是把数据团队的辛勤工作视为理所当然。从这个人的角度来看，一切都是容易的。这正是一个成功数据工程团队的标志之一。\n\
  \n另一个原因可能是该组织没有大数据。他们无需处理大数据带来的复杂性剧增也能应付过去。\n\n### “这不就是和……稍微有点不同吗？”\n\n关于数据团队的一个常见误解是，他们认为数据团队与组织中已有的、更传统的团队只有微小的差别。管理者认为我们只是在职位名称和团队划分上做得过火了，把事情搞得更复杂。这种想法会导致失败，因为由错误或不合格的团队主导了工作。\n\
  \n#### 商业智能\n\n有些人认为商业智能等同于数据科学。是的，两个团队都大量使用数学和统计学。然而，大多数商业智能团队并不编写代码。即使他们写了一些代码，也不会使用复杂的语言。简单来说，数据科学家需要掌握比\
  \ `SQL` 更多的知识才能真正高效。他们需要掌握一门高级且复杂的语言才能达成目标。\n\n#### 数据仓库\n\n另一些人则认为数据工程等同于数据仓库。是的，两个团队都大量使用数据。他们都会使用\
  \ `SQL` 作为处理数据的手段。然而，数据工程还需要具备中级到专家级的编程和分布式系统知识。这些额外的知识真正将这两个团队的基础技能区分开来。\n\n尽管本书会简要提及数据库管理员和数据仓库团队持续扮演的角色，但我并未将他们所做的工作视为本书所讨论的数据团队的一部分。对于本书涵盖的数据科学和分析类型而言，他们所能创建的数据产品过于局限。是的，有些团队能够创建一些有价值的产品，但他们无法创建当今组织所需的种类繁多的数据产品。\n\
  \n## 运维\n\n另一个混淆来源在于运维方面。这同样要追溯到分布式系统。保持分布式系统持续运行并正常工作是困难的。数据和计算处理不再位于单台计算机上，而是分布在多台计算机上。直接的结果就是，这些框架和你自己的代码会以复杂的方式失效。\n\
  \n运维问题并不仅仅停留在软件层面。运维还需要处理数据本身。有时，运维问题源于数据本身的问题：格式错误的数据、不在特定范围内的数据、不符合我们期望类型的数据——这样的例子不胜枚举。你的运维团队需要理解问题到底出在数据、框架，还是两者兼有。\n\
  \n#### 软件工程\n\n最后，软件工程和数据工程从外部看起来非常相似。你可能会在这里看到一个模式，但数据和分布式系统造成了所有的不同。软件工程也不例外，软件工程师需要进行专业化才能成为数据工程师。\n\
  \n我曾与世界各地的大量软件工程师共事过。软件工程技能与数据工程技能很接近，但还不够接近。在软件工程师的大部分职业生涯中，数据库就是他们的数据结构和存储机制。其他人可能从未编写过需要多进程、多线程或任何形式的分布式代码。大多数软件工程师没有像数据工程所需要的那样深入或协同地与业务方合作过。\n\
  \n数据工程师需要创建的分布式系统是复杂的。它们也经常变化。对于大多数数据管道而言，数据工程师必须使用 10 到 30 种技术来构建一个解决方案，相比之下，处理小数据仅需大约三种技术。这确实凸显了专业化的必要性。\n\
  \n\n\n"
- '# 为什么大数据需要数据团队？


  你翻开这本书，可能是因为你参与了一个全新的项目，或者一个正在进行的项目，并且发现了一些不对劲的地方，但又说不清问题出在哪里。我发现，当人们在数据项目上遇到麻烦时，情况往往就是这样。


  在本书中，数据团队是数据产品的创建者和维护者。我曾指导、培训并与世界各地不同的数据团队合作过。加入这些团队后，我反复遇到处于不同失败和表现不佳阶段的团队。数据项目的失败会使企业无法从大数据投资中获益或获得任何回报。到某个时候，组织就会停止投资大数据项目，因为它们变成了一个只吞噬资金、却几乎不产生任何价值的黑洞。


  为了不至于过度简化，我将用术语*小数据*来指代各地组织正在进行的、使用 `SQL`、数据仓库、传统商业智能和其他传统数据项目的规模较小的工作。该术语与*大数据*形成了对比，这是一个我们将在下一章探讨的热门词汇。这些新的大数据项目看似熟悉，但又有所不同且令人陌生。存在着一种难以捉摸、难以量化的差异，你无法确切地表达或指出它。


  你所看到的这种差异，正是决定数据项目成败的缺失环节。如果没有这种认知来指导你创建数据团队并与他们互动，你就不可能在大数据领域取得成功。关键在于获得人员与技能的恰当平衡——然后让他们有效地协作。


  ## 为什么有些团队会失败，而有些会成功


  多年前，我只能看出一个团队即将失败。我却无法告诉他们该怎么做才能修复问题、改进团队或防止失败。我感到十分无力。我就像看到一列火车正飞速驶向一堵混凝土墙，却只能告诉乘客在撞车前下车。


  我知道这远远不够。


  弄清楚这些失败的原因、内容和对象，对我来说变成了一种介于挑战、痴迷和堂吉诃德式冒险之间的事情。这成了我的研究课题。我非得弄清楚为什么只有极少数团队能成功，而那么多一开始看似前途无量的团队最终却以失败告终。


  我成了一个成功上瘾者，极度关注那些成功或自称成功的人和组织。当我找到这些人时，他们面临着一连串具体而苛刻的问题：你为什么成功？你是如何成功的？你做了什么与众不同的事情才取得了成功？你为什么认为自己是成功的？即使在我写这段文字时，我还能记起我问这些奇怪问题时人们的表情。我解读这个谜团的唯一方法就是不断提问并吸收他人的经验。


  我也从那些失败的项目中学到了很多。遇到一个濒临失败的项目，我审视了那些常见的嫌疑因素，却找不到任何明显的问题。大家工作努力吗？是的。他们聪明吗？是的。是技术的问题吗？不——至少通常不是。我必须看得更深。


  责怪技术很容易，这也是大多数组织在失败后所做的。但我知道那完全是逃避责任。是的，技术确实存在问题和局限性。但其他组织却能成功地将同样的技术投入生产，处理这些技术存在的问题，并取得成功。我们这里讨论的主要是那些在项目进入生产或首次发布之前就早早失败的项目。


  不，这些项目在周期中失败得太早，以至于有另一个罪魁祸首。大多数情况下，失败的模式一遍又一遍地重复。然而，你很难真正责怪员工或管理层。当时并没有任何著作来解释为什么会发生这种情况。


  就我个人而言，我肩负着为管理层创建这份知识体系的使命。我想消除导致所有这些浪费的无知。这本书就是这项努力的汇编。你会在书中看到一些我关于这个主题的相关文章以脚注形式出现。


  ## 三个团队


  要做好大数据，你需要三个不同的团队。每个团队在从数据中创造价值方面都做着非常具体的事情。从管理层 3 万英尺高的视角来看——而这正是管理层制造问题的地方——它们看起来都一样。它们都转换数据，都编写程序，等等。但从外部看，可能看起来有
  90%的重叠，实际上只有大约 10%。这种误解才是真正扼杀团队和项目的元凶。


  每个团队都拥有与其他团队互补的专业知识。每个团队都有其成员经验和技能所带来的固有优势和劣势。没有其他团队，事情只会越来越糟。


  我们将在第二部分深入探讨每个团队，但我想在这里先简要介绍一下。就像相亲节目一样，让我们请出我们的三位候选人！


  ### 数据科学


  一号候选人对计数、数学和数据感兴趣。他学过一点编程。欢迎数据科学团队！


  当大多数管理者思考或听到“大数据”时，他们想到的是数据科学的语境。现实情况是，数据科学只是拼图中的一块。


  数据科学团队消费数据管道以创建衍生数据。换句话说，他们获取先前创建的数据管道，并以各种方式对其进行增强。


  有时，这种增强包括高级分析，尤其是当下炙手可热的机器学习（ML）。数据科学团队的成员通常拥有深厚的数学学科背景，例如统计学。有了足够的统计学、数学和数据背景，你可以做一些非常有趣的事情。其结果通常是一个*模型*，该模型在您的特定数据上进行了训练，并为您的业务用例进行分析。通过模型，你可以获得极其有价值的信息，例如预测或异常检测。


  我对数据科学家的单句定义是：


  - 数据科学家是能够利用编程增强其数学和统计学背景，以分析数据并创建应用数学模型的人。


  在最初的这个阶段，关于数据科学家需要了解的主要几点是：


  - 他们拥有数学背景，但不一定有数学学位。

  - 他们理解数据的重要性和使用方法。

  - 他们通常对大数据工具有初级水平的理解。

  - 他们通常具备初级编程技能。


  理解这种初级技能水平很重要。我们稍后会深入探讨——只需知道这是我们需要其他团队的一个主要原因。


  刚刚起步接触大数据的组织常犯的一个错误是只雇佣数据科学家。这是因为他们是大数据中最显眼的元素，也是所创建分析成果的面孔。这个错误就像尝试只找一个主唱来组建乐队。如果你打算唱无伴奏合唱，那可能行得通。但如果你想要任何乐器伴奏，你就需要乐队的其他成员。本书的一个重点就是帮助你理解和明白为什么每个团队都必不可少，以及每个团队如何相互补充。




  '
- '# 数据工程


  二号学士喜欢搭建飞机模型、编程、数据和分布式系统。欢迎了解数据工程团队！


  将实验室中的数据科学转化为企业中大规模运行的数据科学并非易事。你需要有人能够创建可维护且可持续的数据系统，并且这些系统能被非专业人员使用。这需要具有工程背景的人才能做好。


  数据工程团队负责构建数据管道，为整个组织（包括数据科学家）提供数据。数据工程师需要具备创建符合以下要求的数据产品的技能：


  -   洁净

  -   有效

  -   可维护

  -   可大规模使用

  -   可持续扩展与改进


  有时，数据工程团队会重写数据科学家的代码。这是因为数据科学家专注于研究，缺乏时间或专业知识来最有效地使用编程语言。


  数据工程师还负责选择运行数据的基础设施。这些基础设施因项目而异，通常由名称奇特的开源项目，或云服务商提供的相关工具组成。这也是数据团队容易陷入困境、选错方案或实施错误而偏离正轨的地方。


  我对数据工程师的一句话定义是：


  -   数据工程师是那些专门围绕大数据创建软件解决方案的人。


  这个团队对你的成功至关重要。确保你拥有合适的人选和适当的资源来有效指导你。在这个初始阶段，关于数据工程师，你需要了解几个主要方面：


  -   他们出身于软件工程背景。

  -   他们专精于大数据领域。

  -   他们的编程技能至少达到中等水平，理想情况下是专家级别。

  -   他们可能需要被要求对数据科学家施加一些工程规范。


  这些数据工程师——本质上——是软件工程师，拥有随之而来的一切优点和缺点。他们同样需要他人来弥补自身的不足。因此，数据工程团队本身就是一个多学科团队，除了与其他团队密切互动外，其成员主要由数据工程师组成，但也可能包含其他职位。这些额外的人员将填补数据工程师不具备的角色或技能，或完成难度较低、可与数据工程师协作的任务。


  ## 运维


  三号学士喜欢准时运行的火车、硬件、软件和操作系统。欢迎了解运维团队！


  在生产环境中运行分布式系统框架，其稳定程度从坚如磐石到反复无常不一而足。你的代码行为也大致如此。谁来负责让这些技术持续运行并发挥作用？你需要一个运维团队来推动这艘船前行，确保一切顺利运转。


  组织通过两种不同的方式来实现其运维目标。


  第一种是更传统的运维路线。由一个团队负责让一切保持运行。该团队并不真正接触数据工程师的代码。他们可能参与自动化工作，但不编写管道代码。


  第二种更像是一种实践而非一个团队。这种实践融合了数据工程和运维职能。同一个团队既负责数据管道代码，也负责其持续运行。选择这种方法是为了防止长期存在于开发与运维人员之间的典型的“甩锅”问题——开发人员创建了质量存疑的代码，而运维团队被迫处理由此产生的问题。当开发人员负责在生产环境中维护自己的代码时，他们就需要让代码坚如磐石，而不是把质量问题当成别人的事。


  无论是作为一个独立团队还是作为工程部门的一个职能，运维团队都负责保持一切正常运行。这个“一切”的清单相当长，凸显了运维的必要性。这些事项包括：


  -   负责数据工程师和数据科学家（可能也包括其他人）编写的定制化软件在生产环境中的运维工作

  -   保持网络优化，因为你正在处理大量数据，而且绝大多数数据通过网络传输

  -   修复任何硬件问题，因为硬盘和其他物理硬件会发生故障（在云环境中较不常见，但偶尔仍需要故障排查知识）

  -   安装和修复定制代码可能需要的辅助软件

  -   安装和配置操作系统以优化其性能


  这份清单听起来像是所有运维工作都包含的内容，但让我再补充一些真正让大数据运维团队超负荷运转的事项。他们必须：


  -   负责已投入运维的集群软件及其他大数据技术的平稳运行

  -   比通常情况更熟悉正在运行的代码，并能理解其输出日志

  -   熟悉传入数据的预期数量、类型和格式


  我对运维工程师的一句话定义是：


  -   运维工程师是拥有运维或系统工程背景，专门从事大数据运维，理解数据，并学习了一些编程知识的人。


  在这个初始阶段，关于运维工程师，你需要了解几个主要方面：


  -   他们出身于系统工程或运维背景。

  -   他们专精于大数据领域。

  -   他们必须理解通过各种系统传输或访问的数据。


  重要的是要知道，数据工程师和运维工程师之间确实存在不同的思维方式。我屡见不鲜。维护和保持系统运行，与创建或研究最新的大数据框架，确实需要不同类型的人。


  '
- '# 为什么需要三个团队？


  我们刚刚了解了这三个团队的要点。但你可能仍然对每个团队的具体职责或它们之间的区别有疑问。我们将深入探讨这些差异以及团队如何相互支持。


  对某些人或者组织来说，由于存在一些重叠，很难量化这些差异。重要的是要知道，这种重叠是互补的，而不是地盘争夺战的根源。每个团队都在大数据中扮演着至关重要的角色。


  有时管理者认为，最好能找到一个将这三个团队所有技能集于一身的人。这非常困难，不仅仅是因为有太多专业技能。我发现每个团队都代表着不同的个性和思维方式。科学的思维方式不同于工程，工程又不同于运维。找到几个人并让他们协同工作更容易，也更省时。


  ## 小型组织的三个团队


  小型团队和小型组织面临着独特的挑战。他们没有资金组建 20 人的团队。相反，他们只有一到五个人。这些真正的小团队和组织应该怎么做呢？


  当然，实际情况是，组织会要求某些员工承担多个职能。这是一条艰难的道路。你必须找到那些既有能力承担这些职能，又对此感兴趣的人。这种人凤毛麟角。此外，要知道这些人可能无法
  100%胜任这些角色。他们可以在紧急情况下填补某个职能，但这不是长久之计。随着组织规模的扩大，你需要逐步填补这些缺口。




  '
- '# 如果组织管理不善会怎样？


  为了完善第一章的概述，我想分享跳过某些团队或安排不合适人员所带来的影响。简而言之，这会导致组织在大数据项目上失败或陷入困境。具体表现取决于项目复杂性、用例以及缺失的环节。无论如何，这都会让组织走上一条令人沮丧的道路。


  我经常能看到团队缺失所带来的二阶或三阶效应。通过问题的描述，我能看出团队中缺少什么。我之所以能识别出缺失的环节，是因为我在其他组织中也见过同样的问题。问题的根源几乎总是可以归结为少数几个类别。有时问题有多个层面，你需要层层剥开，直至触及问题的根源。只有这样，你才能真正发挥数据团队的最大潜力。


  本书将帮助你让组织和团队重回正轨，或修复存在的缺失。


  脚注 1 2 3


  '
- "# 2. 好、坏与丑陋的数据团队\n\n## 成功的数据团队\n\n> *你梦寐以求的梦想，终会成真*\n>\n> ——《彩虹之上》，以色列歌手 伊斯拉埃尔·卡马卡维沃奥莱\
  \ 演唱\n\n> *仅有 15%的企业报告其大数据项目已投入生产，与去年（14%）相比几乎没有变化。*^(⁴)\n>\n> ——Gartner 研究\n\n\
  这句引自 Gartner 的话解释了为何前一章我如此专注于成功与失败。绝大多数大数据项目要么彻底失败，要么表现不佳。这句话印证了我与团队和项目打交道的亲身经历。我真的厌倦了看到这么多项目失败。当没有回报时，组织迟早会停止对大数据计划和团队的投资。\n\
  \n显然，你的目标是成功，而你阅读这本书是为了预防失败或扭转败局。\n\n作为商业人士，我们会对企业进行案例分析，以探究其成功或失败的原因。关于这个话题的书不胜枚举。然而，在大数据领域，我们却不这么做。有一种倾向是隐瞒失败，从不谈论它们。这种不去回顾失败项目的做法只会让问题扩散，并导致下一次失败。如果我们不从错误中学习，就注定会重蹈覆辙。\n\
  \n当你试图扭转一个失败或表现不佳的组织时，你会面临一种先入为主的观念：认为什么都做不成，什么都不会变好。做出必要的改变取决于你。为了帮助你看到或展示可以做到什么，我想分享一些从数据团队和项目中获取价值的例子。\n\
  \n### 大数据成功是什么样子\n\n简而言之，当从数据中创造价值时，大数据就成功了。这意味着项目已投入生产，解决了业务需求，并且稳定运行。上述这句话的每个部分都是一个巨大的成就。我们来逐一谈谈。\n\
  \n进入生产阶段是一件大事。这意味着团队编写了足够的代码，构建了架构，并正确地实施了各项内容。这归根结底在于拥有合适的、合格的团队。\n\n解决业务需求也至关重要。这意味着团队与业务部门合作，确定了一个用例并为其提供了实际价值。这又意味着高层管理人员持续参与，以确保数据团队与业务部门正确协作。\n\
  \n如果系统不能稳定运行，所有这些工作都毫无意义。在这个方面取得成功意味着每个团队都编写了质量足够高、能在生产环境中运行的代码。更进一步说，这意味着代码经过了单元测试，并验证了它们能协同工作。最后，运维团队保证了所有动态组件持续运行。\n\
  \n在这三个大数据方面都取得成功的公司确实会脱颖而出。要识别成功，可以观察一家正在充分利用其数据的公司，再对比另一家没有做到这一点的公司。你应该能看到收入、客户满意度（包括内部和外部）、决策制定以及战略方面的可量化差异。一个成功的数据项目能显著增强并推动组织发展。\n\
  \n实际创造的价值会因行业和公司规模而异。很难给出一个固定的数额或适用于非特定行业的例子。此外，本书并非商业案例研究书籍。\n\n### 大数据失败是什么样子\n\
  \n失败比成功更容易量化和观察。项目从未投入生产，或在生产环境中失败。情况没有任何改善。截止日期来了又去，却始终没有交付成果。\n\n失败有一些常见的表现形式。最常见的是团队在拼命工作。他们挑灯夜战，却毫无进展。无论投入多少时间或精力，团队似乎都无法交付任何成果。这对任何人都不公平。\n\
  \n另一种失败的表现是完全无法执行。业务部门向团队提出一个想法或需求。团队回应说这不可能实现，或者实施起来太难。项目还没开始就已经夭折。直接后果是，只有最简单、最容易的项目得到关注，而即使这些项目也无法投入生产。\n\
  \n还有一些团队通过创建对组织毫无价值的数据产品来展示失败。要识别这种情况，不妨想象一下你的大数据项目消失了。会有人在乎吗？真的有人在用这些数据吗？还是集群只是为了满足自身膨胀的需求而不断扩大？^(⁵)\
  \ 如果大数据计划可以被终止而几乎不产生任何影响，那就是一个信号，表明该大数据计划没有在创造价值。\n\n\n\n### 表现不佳的项目是什么样子的\n\n表现不佳的组织从内部更难察觉。对于局外人来说，团队陷入困境时往往一目了然。这些团队只有“hello\
  \ world”级别或极其简单的项目上线。任何稍微复杂一点的项目都无法交付到生产环境。\n\n通常，这些团队并未意识到自己表现不佳。在我与这些团队的交流中，他们自认为表现良好，甚至优于其他团队。但经过仔细审视，就会发现他们确实表现不佳。\n\
  \n表现不佳和失败的团队可以从多个维度量化：有多少数据产品上线了？其中有多少足以满足业务需求并被实际使用？将产品交付到生产环境需要多长时间？大数据项目启动多久了？首批数据产品花了多长时间才发布？耗时数年的团队通常表现不佳。始终无法交付生产环境的团队则是失败的。\n\
  \n表现不佳的另一个表现是停止引入新技术。虽然我们不会为了充实简历而堆砌技术，但在健康的项目中，新技术往往是为了提升价值或处理新用例所必需的。团队需要引入这些新技术，因为它们能改善或增强团队实现目标的能力。如果你没有引入新技术，很可能是在原地踏步。如果你用老旧技术启动大量新项目，很可能没有有效利用资源。\n\
  \n表现不佳的另一个表现是业务部门抱怨未能从数据中获得价值。成功的组织能从数据中获取最大价值，而表现不佳的组织只能获得极少甚至零价值。你会听到业务部门提出这种抱怨，因为这个标准最终才是最重要的。\n\
  \n最后，看看你在数据团队和硬件上的投入。你从数据、分析和洞察中实际获得了多少投资回报率？如果实际上无法收支平衡，甚至无法弥补机会成本，那就存在严重问题。很可能是团队的表现与投入的资金不匹配。\n\
  \n### 缺失某个团队时会发生什么\n\n为了帮助人们理解数据团队框架下每个团队的贡献，我会请他们设想：如果缺失某个团队，数据团队会是什么样子。对于那些已经组建了数据团队但缺少我认为至关重要的一个或多个团队的组织而言，这并非假设性讨论，而是他们每天都在面临的问题。\n\
  \n- 如果缺少数据工程团队，就没有人能提供关于数据产品创建的工程视角。实际上，数据科学家将不得不承担所有数据工程工作。缺少数据工程团队并不意味着没有数据工程工作被执行，只是负担转移到了能力不足的数据科学家身上。这会导致在数据产品投入生产使用时必须修复的技术债务堆积如山，且修复成本高昂。缺乏数据工程团队会阻碍创建能够满足业务规模化需求的数据产品。从数据产品中获得结果将耗时漫长。\n\
  \n- 如果缺少数据科学团队，组织创建分析的能力将严重受限：分析工作只能由数据工程师、商业智能或数据分析师勉强完成。只有数据科学家才能进行机器学习等高级分析。没有数据科学团队，组织可能无法创建复杂到需要编程的分析。\n\
  \n- 如果缺少运维团队，没有人能依赖已创建的数据产品。今天基础设施和数据产品还能正常运行，明天就可能瘫痪。在徒劳地等待可靠的数据产品很长时间后，消费者会因为无法依赖它而停止使用。组织无法基于运行在不可靠基础设施上的不可靠数据产品来做决策。\n\
  \n只有三个团队都到位，组织才能真正开始为业务创造价值。\n\n### 衡量价值产出\n\n衡量数据产品或数据团队创造的价值水平可能很困难。在尝试衡量这种价值时，我不会询问数据团队本身。我发现数据团队对自己创造价值的看法往往比实际情况更乐观。为了获得更准确、更好的视角，我会向业务部门提出几个问题。我请他们设想，我们要取消整个数据项目并解散数据团队。面对这些将被彻底移除的数据产品和团队，我问他们会有何反应。根据回答，我通常会得到以下四种情况之一：\n\
  \n1.  第一种情况，数据团队实际上创造了最大价值。业务负责人会强烈反对：“绝对不行！”业务部门极力反对改变这一正在创造惊人业务价值的数据命脉。哪怕微小的改动或完全移除团队，都会影响他们日常对数据产品的使用，乃至决策。这些项目和团队正在为业务创造巨大价值。\n\
  \n2.  第二种情况，项目创造了最低限度的价值。业务负责人的反应是“嗯……”。他们的模棱两可表明业务部门并没有真正在日常工作中使用这些数据产品。\n\n3.\
  \  第三种情况，项目停滞不前，没有创造任何价值。业务部门对提议取消项目的反应是讽刺或痛苦的反问：“什么项目？”。在这种情况下，管理层曾向业务部门承诺可以利用数据做出更好的决策，但数据团队完全未能实现这一梦想。业务部门从未获得任何交付成果，也从未实现任何价值。\n\
  \n4.  第四种情况，项目正处于规划阶段。业务部门已被告知将获得新功能、新分析，以及解决之前无法实现的问题。业务部门满怀期待，希望能最终得到他们一直要求的东西。现在，是数据团队兑现这些承诺的时候了。\n\
  \n通过观察业务部门的反应，我可以更清晰地了解正在创造的业务价值，而无需承受询问数据团队自身所带来的现实扭曲效应。每个团队都应该向往第一种情况的价值产出水平。如果你的团队处于第二或第三种情况，这就是一个警示信号，表明团队、技能或其他方面需要改进。在第四种情况下，团队必须发挥其潜力，交付成果以达到第一种情况的水平。\n\
  \n\n### 数据科学中的规模问题\n\n数据科学与其他分析职能的区别之一在于其工作规模。对于数据科学团队而言，这种规模可能意味着不同的事情。它可能意味着数据科学家需要训练模型或在\
  \ 1 PB 的数据上进行探索。它也可能意味着模型评分需要扩展到每秒处理数十万事件。这种规模要求数据科学家不能使用他们可能习惯的小型数据系统或技术。这有时意味着他们的算法需要从一个无法扩展的算法转变为一个能够扩展的算法。\n\
  \n海量数据会带来小规模数据下不会遇到的问题。在 1 PB 的数据中，存在坏数据、超出限制的数据或完全格式错误的数据是可能的——而且可能性更大。这使数据科学家的代码成为焦点，因为它需要从错误数据中筛选出正确的数据。你肯定不希望一个运行了\
  \ 10 小时的任务因为数据科学家忘记了一项检查或代码防御性不足而停止。\n\n正是这种规模首先引出了分布式系统。如果我们保持在更适中的规模，我们始终可以使用我们一直使用的小型数据技术和算法。这一见解基于第\
  \ 1 章中关于大数据的定义，这对管理层理解至关重要。\n\n### 尽可能实现自动化\n\n如果你的组织手动进行中等或大量的数据整理工作，这可能是数据工程师缺乏编程技能或数据管道中缺少工具的征兆。如果一项任务手动执行超过两次，你就应该认真考虑如何将其自动化。一般来说，要寻找一切可能的方法将人从流程中移除。自动化将提高结果和基础设施设置的可重复性。由于缺乏工具和编程技能，数据整理者可能无法满足这一需求。\n\
  \n如果你在公司内部采取了适当的措施，但仍然发现团队在进行手动数据整理或其他步骤，你可能需要追溯到数据源头并施加压力，以改进原始数据或数据产品的暴露方式。当你合作的数据提供商缺乏数据工程团队来提供适当的数据管道时，可能会出现这个问题。在其他情况下，暴露不良的数据产品可能是内部数据工程团队需要解决的问题。虽然一些手动步骤的单一处理是正常的，但针对相同手动步骤有过多的一次性请求，则表明数据工程团队没有创建你的业务所需或想要的数据产品。这可能会暴露出你的数据产品消费中的一个需要填补的漏洞。一个技术足够成熟的团队应该能够从适当暴露的数据产品中自助获取数据，而不是依赖手动的一次性处理。\n\
  \n脚注 1  \n2\n\n"
- '# 第二部分：组建你的数据团队


  数据分析中的第一个管理任务是找到拥有合适技能的人，包括技术技能和组织技能。团队需要具备不同技能的多种人才——没有人能事事精通。本书的这一部分将解释你需要雇用什么样的人。


  许多组织仍然坚持全能型人才的观念，即能包揽一切：机器学习、编程以及让所有系统在生产环境中运行。这种全能型人才确实存在，但凤毛麟角。你会花费大量时间寻找这些人，而且他们的薪水会很高。


  包揽一切和*完美地*包揽一切之间也有很大的区别。有些全能型人才在紧急情况下可以应付，但常常在稳健性、可维护性或对业务需求的适用性上偷工减料。这些人很难看到自己技能和能力中的盲点。


  有时，对单一人才的渴望纯粹源于预算需求：一个小组织可能决定只能负担一名训练有素的人员。管理者被迫选择他们认为相对于薪资能产生最大影响的那个人。结果通常是雇用一名期望能完成所有工作的数据科学家。


  在其他情况下，不愿多样化配置员工源于希望避免协调多人或多个团队的困难。但依赖单个人才是通往问题和延误的路径，而数据团队管理中的棘手部分将不得不在以后处理。创建数据团队是一项艰巨的工作。避免组建团队的做法无法扩展。创建数据团队的解决方案就蕴含在本书的篇章之中。


  '
- "# 3. 数据科学团队\n\n> *而所有这些我不懂的科学  \n> 只是我每周五天的工作*\n>\n> ——埃尔顿·约翰《火箭人》\n\n在构成现代数据团队的三个团队中，我们从数据科学家开始，因为他们产出组织用于决策的成果。另外两个团队主要与数据科学家协作，其次与组织的其他部分协作。\n\
  \n数据科学团队的目标是创建高级分析。在高端，这些分析可以由人工智能（AI）生成，而机器学习（ML）是目前最常见的技术。在低端，这些分析则基于高级统计和数学构建。数据团队的其他成员可能也了解统计和数学，但达不到数据科学所需的复杂水平。\n\
  \n因此，数据科学家将高级数学和统计学背景与编程、领域知识以及沟通技巧相结合，以分析数据、创建应用数学模型，并以对组织有用的形式呈现结果。\n\n一些管理者认为数据科学家可以创建有用数据的端到端价值链，但大数据管道的运作方式并非如此。数据来自多种来源，如网络服务器日志、传感器和销售收据。数据工程师收集数据并将其整理成对分析有用的形式，而数据科学家则创建产生洞察的模型和分析。\n\
  \n在本章中，我们将讨论数据科学家是什么，他们需要哪些技能，并深入探讨数据科学家与数据工程师之间的差异。我们还将讨论公司如何招聘和培训数据科学家。最后，我们将解释为什么数据科学家必须能够应对不确定性。\n\
  \n同样，不应要求数据科学团队去创建他们用来创建数据产品、进行探索、训练模型或部署这些模型所需的数据基础设施或软件架构。这更多地属于数据工程团队的领域。此外，数据科学家是稀缺资产，除了创建基础设施，他们还有很多其他工作要做。因此，数据科学团队应依赖数据工程团队创建的数据基础设施和软件架构。\n\
  \n本章基于 Paco Nathan 在组建数据科学团队方面的工作。^(⁶)\n\n\n\n## 需要哪些技能？\n\n数据科学团队所需的技能包括：\n\n-\
  \ 数学\n- 编程\n- 分布式系统\n- 沟通能力\n- 领域知识\n\n这些都是非常概括的术语。我们将在以下小节中具体探讨它们对数据科学家的含义及其重要性。\n\
  \n我们将在接下来的两章中看到，数据工程团队和运营团队是跨学科的，可能包含多种职位描述。相比之下，数据科学团队只由数据科学家这一职位的人组成——尽管他们可以分工协作并拥有不同的技能水平。有些组织希望将数据分析师和商业智能用户纳入数据科学团队，但这并不是一个有效的组合。数据分析师和商业智能用户是数据科学团队和数据工程团队所创建数据产品的消费者。\n\
  \n### 数据分析师与数据科学\n\n并非每个问题都需要数据科学家提供高要求的机器学习技术水平。在这种情况下，使用数据科学家可能会大材小用。然而，描述性分析和诊断性分析的需求依然存在，数据分析师可以利用大数据技术来解答这些问题。通过让数据分析师处理这类问题，我们能够摆脱数据科学家数量有限的制约，并利用更充裕的数据分析师资源。\n\
  \n那么，在这个新型数据团队组织结构中，数据分析师应该放在哪里呢？在 Moneysupermarket 公司，我们实际上将数据科学家和数据分析师组合成跨职能团队。这些团队无需其他团队协助，就能独立负责其业务领域，交付成果。这种方法在加快交付速度、传播知识和交叉培训方面效果显著。数据科学家向数据分析师的知识传递，提升了数据分析师的技术和分析能力。我们观察到，随着数据分析师编程和机器学习能力的提高，从数据分析师晋升为数据科学家成为了一条职业发展路径。\n\
  \n——哈文德·阿特瓦尔，作者、技术审校、Moneysupermarket 首席数据官\n\n### 数学\n\n数据科学家至少应完成代数 2 课程，或达到世界其他地区高中数学教育的最高水平。这个数学水平能提供最基础的数学技能。而在高端层面，数据科学家应拥有统计学、数学或具备深厚数学背景领域的博士学位。我接触过的大多数数据科学家都拥有博士学位。这并不是说非博士就不能成为数据科学家——但他们确实需要大力提升数学技能。\n\
  \n由于聚焦数据科学的大学项目相对较新，许多数据科学家来自其他数理统计基础扎实的技术背景。我见过的一些能培养出成功数据科学家的学科包括经济学、物理学、天文学、火箭科学，以及神经科学或化学等生物学或物理科学。\n\
  \n如果一个数据科学团队所有成员的最高数学水平都只完成过代数 2，那么这个团队的能力将受到限制。他们可能对数学要求有基本了解，但无法进阶到需要深厚数学背景的下一层级机器学习。\n\
  \n### 编程\n\n大多数数据科学家具备初级到中级的编程技能。编程能力和使用的语言差异很大。通常，数据科学家使用 Python 编程，较少使用 Scala。此外，还有一些数据科学家使用\
  \ R 语言（但这在生产环境中大规模应用比较困难）。\n\n我发现大多数数据科学家是自学编程的。即使他们上过编程课，也通常是入门课程。数据科学家很少拥有硬核的计算机科学或软件工程背景。相反，他们通常是为了达到某个目的才开始学习编程，以一种临时的方式完成那位初露头角的数据科学家用其他方法无法完成的任务。\n\
  \n非正式学习编程的一个常见原因是，在他们攻读博士论文期间，需要编程实现某些功能。这促使他们进入编程领域并乐在其中，进而开始更深入的学习。不知不觉间，他们就以数据科学家的身份自居了。\n\
  \n延续这个主题，有些人曾面临需要处理海量数据集的任务。同样，这种学习也是为达到目的而采取的手段。他们该如何处理这个大型数据集以实现目标？他们会花时间学习如何使用分布式系统。有些人喜欢这种数据处理过程，并进一步深入研究。\n\
  \n数据科学家可以处于其技术生涯的不同阶段。他们可能刚刚开始学习编程，也可能已经编写了足以完成博士论文的代码，或者曾与软件工程团队一起工作过。了解你的数据科学家所处的阶段或水平，对你的成功至关重要。\n\
  \n### 分布式系统\n\n有些数据科学家对使用分布式系统（例如集群）所需的技能一无所知，而另一些最多只具备中级技能。分布式系统及其在创建分析系统中的应用，是事情变得真正复杂的地方——据我估计，其复杂程度比处理小数据要高出\
  \ 10 到 15 倍。\n\n因此，数据科学家需要掌握足够的分布式系统知识来完成他们的工作。这很可能也是他们最需要数据工程师帮助的领域。数据科学家需要理解分布式系统的实际水平，取决于数据工程师在多大程度上为用户消除了这种复杂性，以及数据科学家正在创建的衍生数据产品的固有难度。\n\
  \n### 沟通能力\n\n数据科学家需要向组织内部和团队成员口头传达他们的成果。他们常常需要向模型的业务使用者解释模型含义、得出该结论的过程，以及他们是否认为该结论在数学或统计上是正确的。\n\
  \n不要低估这项技能的重要性。它最终决定着数据科学团队模型的接受度和采用率。糟糕的口头沟通会导致模型被视为黑箱或魔法。出色的口头沟通则有助于人们从更高层面理解算法和推理过程。数据科学家真正有效的沟通能够赢得对数据产品的信任，从而提升采用率。\n\
  \n视觉沟通——例如图表和仪表盘——也是传达要点的关键部分。数据工程团队通常负责编写代码或创建这些图表和仪表盘，但数据科学家应该对\"这样是否能突出关键点\"\
  有判断力：例如，坐标轴是从零开始还是聚焦于一个窄范围以突显数据，以及如何让组织应该追踪的关键维度更加突出。数据科学家可以向数据工程团队的设计师或前端工程师解释这些标准。\n\
  \n### 领域知识\n\n数据科学家无法为那些他们不理解其业务的商业问题创建模型。他们可能无法达到业务领域专家的理解深度，但他们需要尽可能多地理解。\n\n\
  领域知识包括但不限于以下几点：\n\n#### 问题的特征是什么？\n\n例如，我们只是试图减少产品某些部分的缺陷吗？还是减少缺陷只是我们可能通过其他方式实现的更大目标的一部分？\n\
  \n#### 数据的适用性如何？\n\n假设我们有六百万行客户数据——太棒了！但这真的能反映我们的客户全貌吗？也许我们收集数据的方式（例如通过网页访问）排除了那些年龄较大或收入较低的客户，而他们恰是我们客户群的重要组成部分。\n\
  \n\n\n#### 我们还需要哪些其他数据？\n\n得益于收集数据的硬件和软件的改进，新的数据源不断涌现。这些潜在的新数据源中，哪些能为我们揭示新的见解？\n\
  \n领域知识越丰富，模型就越有可能解决业务目标或问题。这种领域知识既包括业务层面，也包括数据层面。数据科学家需要理解数据及其与业务领域知识之间的关系。\n\n\
  ## 数据科学团队的技术债\n\n在分布式系统上工作的数据团队几乎不可避免地会产生技术债：这是一个通用概念，指团队未来需要花费一定精力或时间来以“正确”的方式重写或重建系统。技术债就像是“我们以后会回来把它做对”的承诺，但往往，人们忙于新功能，再也不回头处理。技术债也可能源于业余的实现或用法，没有人意识到其不正确或非最优。\n\
  \n我们发现大多数数据科学家采用的是初学者的编程方法。随之而来的是难以理解和遵守软件工程的细微差别。数据科学家通常会将代码写得像在表达一个方程式。这与软件工程师编写代码的方式不同。最终，编程技能处于初学者水平且不懂软件工程的数据科学家会引发许多问题。我们将在本章和本书中探讨这些问题。\n\
  \n大多数数据科学家面临的软件工程短板会以不同方式显现。有些数据科学家患有“单一崇拜症”——即无论情况如何，都试图用同一种技术解决所有技术问题。数据科学家往往不知道或不明白每种任务的最佳技术是什么。例如，即使某个分布式系统对于他们的问题非常不正确或非最优，他们也会照用不误。这种短板同样体现在那句熟悉的比喻中：手里拿着锤子，看什么都是钉子。\n\
  \n在探索阶段，数据科学家需要快速迭代。如果数据科学家使用了错误的工具，将极大阻碍他们快速迭代的能力。我曾见过数据科学家应用错误的工具，结果每天只能运行 20\
  \ 次实验，而他们本应运行数千次。结果，他们要么止步于一个非最优的解决方案，要么浪费大量时间。\n\n说实话，这并非数据科学家的错。这源于管理层对数据科学家是什么以及能做什么的误解。这正是数据科学家需要与数据工程团队互动的地方，并确保数据产品能以数据科学家所需的方式呈现。如果没有数据工程团队，管理团队只能归咎于自己。\n\
  \n数据科学家认为自己将要从事的工作与他们实际所做的工作之间存在巨大脱节。如果组织中没有数据工程团队，这种情况会呈指数级加剧。数据科学家入职时以为他们会将 99%\
  \ 的时间花在数据科学工作上。残酷的现实是，数据科学家花在他们真正想做的事情——数据科学——上的时间更少，有时甚至少得多。\n\n谷歌曾发表过一篇论文，强调了这种脱节^(⁷)，指出绝大多数的时间、精力和问题都来自机器学习模型周围的一切，而不是机器学习模型本身。从标签可以看出，这些是数据工程任务，或者在某些组织中，是两个团队混合承担的任务。\n\
  \n这种对扎实软件工程的隐性关注，常常让数据科学家和管理层都感到意外。根据我的经验，数据科学团队要么在隐藏，要么没有意识到他们已产生了巨额技术债。这种技术债源于几乎没有工程背景的数据科学家创建的系统，这些系统即使对软件工程师来说也很困难——但它们本应在数据工程师及其应创建的系统的领域和权限之内。这种技术债表现为糟糕的临时解决方案和变通方法。这些临时方案被投入生产环境，引发了更多问题。\n\
  \n我在本章“编程”部分讨论数据科学家的历程时，多次重复了“达到目的的手段”这个说法。我强调这一点，是因为学习编程或搭建分布式系统并非数据科学家的首要关注点。他们的首要关注点是数学领域。编程和分布式系统技能只是他们实现目标的手段。\n\
  \n知识浅尝辄止或仅仅够用的人，与拥有专业知识的人之间存在显著差异。在分布式系统中尤其如此。如果数据科学家将初级的系统或代码投入生产，将导致严重问题。公司们都是通过惨痛教训才认识到这一点的。\n\
  \n因此，数据工程团队存在的部分原因，就是为了在分布式系统和编程方面帮助不擅长的数据科学团队。深入探讨这个主题可能会让本书过于庞杂。如果你想了解更多关于数据科学家和数据工程师之间的区别，可以查阅我关于此主题的深度文章。^(⁸)\n\
  \n## 招聘与培训数据科学家\n\n由于大多数公司的员工都具备数据科学家所需的部分技能，因此很容易放任他们去开展数据科学项目。但在这样做之前，请仔细斟酌。\n\
  \n\n\n### 再培训的障碍\n\n再培训的动机是双重的。首先，受过培训的数据科学家很稀缺，最优秀的人才都被专门从事分析的公司抢先挖走。出于同样的原因，他们也很昂贵。第二个动机是，许多数据分析师、数据库管理员和程序员都渴望踏入数据科学领域的大门。他们可能看到自己原有的角色在萎缩，因此有很强的动力去学习你所需要的新技能。\n\
  \n因此，提升现有员工的技能似乎是一种双赢。不幸的是，我发现这很难做到，而且常常会失败。所需的新技能与员工通常掌握的现有技能差异太大。根据团队及其基础技能的不同，再培训可能既昂贵又耗时。管理层需要谨慎权衡再培训整个团队、团队中的个别成员，或者选择外包等其他途径的利弊。\n\
  \n一条典型的团队晋升为数据科学团队的路径，是对数据分析师或商业智能人员进行再培训。这是因为数据分析师本身具备数学和统计学基础。好的一面是，这些团队应该已经对组织所面临的业务领域和分析问题有所了解。然而，并非这些团队中的每个人都能从他们之前的职位成功转型为数据科学家。\n\
  \n这些团队主要缺乏编程技能，并且很少有分布式系统的经验。人们需要花费大量的时间和精力来学习这些技能。我发现，数学家看待编程的方式与软件工程师或数据工程师截然不同。那些非常专注于数学、正在学习编程的人，编写的代码通常是为了执行数学问题。这并非最优秀或最易于维护的代码。\n\
  \n最后，这些团队通常没有创建过机器学习模型。需要教导他们开发和部署模型的工具和技术。这同样需要投入大量的精力。\n\n一些组织将目光投向他们的数据仓库或 DBA\
  \ 团队，希望从中发掘潜在的数据科学家，因为他们有数据和数据分析的背景。对于 DBA 来说，缺乏编程技能（除了`SQL`）和软件工程技能构成了一个高不可攀的障碍。而数据科学家使用的工具，比如用于流式数据的`Spark`和用于资源分配的`Kubernetes`，与他们过去使用的工具截然不同。\n\
  \n对于程序员来说，数学和统计学是巨大的障碍。\n\n因此，尽管向现有员工解释这一点可能很困难，但数据科学家还是应该从那些已经至少具备本章“需要哪些技能？”部分所列技能中相当强组合的人中招聘。\n\
  \n最糟糕的错误是为了依赖现有团队而跳过招聘新人才。仅仅给一个实际上不具备数据科学团队资格的小组重新命名，是欺骗不了任何人的。这会让你的组织和团队走向失败。\n\
  \n### 提升数据科学家的技能\n\n另一方面，组织经常帮助他们的数据科学家提升技能。通常，这种提升会延伸到那些绝对需要、但经常缺失或不足的核心技能上。\n\n\
  为了提高他们的数学和机器学习技能，数据科学家应该阅读研究论文。许多数据科学家已经在这样做，但管理层应该认识到其价值，并分配时间让数据科学家去执行。\n\n同样地，参加会议也很有帮助。有专门针对数据科学家或数据科学主题的会议。这些会议提供了机器学习在现实世界中应用的例子，而研究论文则更多地提供了关于最新进展的学术视角。数据科学家应该利用这些会议，从他人的经验中学习，并为自己所在组织的问题寻找更具创新性的解决方案。\n\
  \n通常，数据科学家最欠缺的领域是编程和分布式系统。在这些领域对他们进行培训，可以最显著地提高他们的生产力，但也存在着收益递减的风险。对于这种提升，肯定存在一个理想的平衡点。\n\
  \n换句话说，如果一个数据科学家的分布式系统知识完全是新手水平，那么提升他们在这些领域的知识是有价值的，而且可能意义重大。这有助于数据科学家更加自立，减少对数据工程团队的依赖。另一方面，如果一个数据科学家已经相当精通分布式系统，那么投入更多时间和精力去学习一个新的分布式系统可能不会产生回报。进一步的培训可能只是教会他们一些他们永远不会实施或没有能力执行的先进概念或用例。\n\
  \n### 寻找数据科学家\n\n大多数公司将不得不招聘数据科学家，无论是为了建立新团队，还是为了扩大现有团队的规模。\n\n大学里针对数据科学家的培养项目并不多。而且，这些大学项目通常范围有限，更侧重于学术而非行业，因此不能反映数据科学家真实的日常工作生活。\n\
  \n也有一些商业和训练营项目。从这些项目中走出来的人，在团队中能否高效工作的能力各不相同。在你招聘时，请记住，即使你找到了人选，也可能需要耐心地教他们很多东西。\n\
  \n因此，这些项目大多无法涵盖数据科学家日常工作真正需要的所有方面。从这些项目中招聘更像是一种投资，你需要相信你选择的人能够成长，并有潜力达到更高的水平。\n\n\
  从外部和内部招聘人才都会很困难。市场对各个经验水平的数据科学家都有着巨大的需求。请确保在你真正需要这个人之前很久就开始招聘。你可能需要 6 到 12 个月的提前期来招聘到一个人。通常情况下，候选人会收到多个录用通知，发出录用通知并不意味着这个人会加入你的组织。\n\
  \n请记住，并非每个潜在的数据科学家都拥有这个头衔、数学学位，或来自特定的以数学为重点的背景。有些数据科学家来自物理科学领域。\n\n我的许多客户和其他公司在招聘物理科学专业毕业生方面都取得了成功。他们是那些为了完成专业工作或学术论文而不得不学习编程和一些分布式系统知识的人。他们的很多工作都涉及获取数据、分析数据以及基于数据做出决策。这正是数据科学家所做的这类工作和数据思维。\n\
  \n\n\n\n"
- '# 满足数据科学家的需求


  管理数据科学家会给数据团队带来一些独特且具有挑战性的变化。这主要源于这是一门相对较新的学科，无法完全归入任何一个既有的类别。在某些方面，数据科学自成一派，但同时也会借鉴其他学科的思想和技术。这种借鉴使得管理数据科学团队颇具难度。以下几点值得了解：


  -   大多数数据科学家从未编写过大型程序，无论是从代码行数还是系统复杂度来衡量。

  -   数据科学家可能从未在企业或大型组织中工作过，因此不了解在大型组织中工作会伴随哪些问题。

  -   许多数据科学家有学术背景，要么刚获得博士学位，要么曾在学术界工作，而这是他们的第一份非学术工作。

  -   许多数据科学家通过自学掌握了编程，但从未在专业的工程化软件团队中工作过或与之合作过。

  -   一些数据科学家会高估自己在工程和编程方面的能力。

  -   一些数据科学家会低估数据工程的难度，尤其是与分布式系统相关的复杂性。

  -   一些数据科学家从未处理过真实世界中那些混乱且不完美的数据集。


  认识到数据科学家无法被放进组织预先设定好的类别中后，数据团队的管理者需要做出让步和考量。


  ## 引入软件工程实践


  有时，数据科学家会误以为自己是程序员或数据工程师。毕竟，数据科学家确实会创建软件。尽管偶尔会有数据科学家学习创建代码所需的软件工程规则和最佳实践，但大多数数据科学家并不了解真正需要什么。


  有些工程最佳实践是底线要求，而另一些则是锦上添花、可有可无。举个例子，我认为**源代码管理**是数据科学团队的底线要求。需要源代码管理来追踪代码在引入错误时是如何变化的，为源代码提供一个安全统一的存放位置，支持代码审查，并允许多人在最小化冲突的情况下共同处理代码。


  另一方面，我认为**持续集成和持续部署**只是一个不错但非必需的流程。有些数据科学团队已经采用了这个流程，它确实有帮助。但这也是大多数数据科学家不知道如何搭建或操作的内容。这正是一个数据工程团队可以发挥作用的领域，即搭建流程并向数据科学家展示如何使用。


  通常，软件工程师和数据工程师喜欢规则和秩序。而数据科学家则认为数据工程师倾向于把事情过度复杂化和过度工程化。这种看法使得数据科学家会抵制那些他们认为会拖慢速度、阻碍实验的规则。数据科学家和数据工程师在性格上确实存在可量化的差异。正因为这种差异，管理层需要明白，他们必须在要求哪些最佳实践上有所取舍。强制执行每一条最佳实践会导致数据科学家的抵制。


  ## 流程过多会阻碍进展


  很难将数据科学这样的工作放进一个单一的盒子里，因为它确实横跨多个学科。它处于科学和软件工程之间。此外，数据科学本质上是一个创造性的过程。强加过多繁重的流程会抑制数据科学家的创造力。另一方面，缺乏流程又可能使数据科学团队变成无法问责的、人人各行其是的局面。


  管理的关键在于找到那个恰到好处的平衡点，只建立足够多的流程。他们必须搞清楚哪些方法足以防止混乱。请记住，并非所有出现的问题都需要制定一条繁重的规则来防止其再次发生。


  有时，管理者会要求一个团队复制其他团队的流程，或者发布组织范围内的指令，要求使用特定的方法。这类严格的软件工程流程可能对数据工程很有效，但对数据科学团队却未必适用。理解数据科学项目与软件工程项目之间的区别至关重要。


  工程流程青睐于那些总能产生特定产出的精确结果，无论是一个全新的产品、一个缺陷修复，还是一个新产品功能。但数据科学项目是开放式的。一个数据科学项目可能有多种可能的结果，这更像研究而非工程。因此，其发现也与研究类似。数据科学项目一个完全可行的结果就是**证伪假设**。在这种情况下，没有实际的产品或可交付成果，数据科学家本身也没有失败。他们只是证明了一个方案行不通。


  再举一个问题的例子：一些组织试图将 Scrum 项目管理框架强加给他们的数据科学家。这要求数据科学家使用一个并非为其工作类型设计的框架。


  在大多数情况下，管理者只是想了解项目的状态，或者数据科学家正在做什么。组织通常只需规定足够多的流程来了解和汇报结果或状态，就能良好运转。


  要实现这种平衡，可能需要向组织内部的其他管理者和部门阐明数据科学的本质。他们可能期望数据科学更接近商业智能部门的职能——数据进来，报告出去。他们也可能期望数据科学像软件工程团队一样——持续开发软件，并且（至少在理论上）有稳定的软件发布。相反，组织可能需要认识到，数据科学团队的工作方式更像研究：投入时间和数据，在未知的时间范围内得出一个未知的结果。为了防止研究项目无休止地进行下去，一些组织会为研究设置时间盒（timebox）。有了时间盒，研究人员在经历一段非生产性时间后，就会转向其他工作。


