  \ WebDriverWait\nfrom selenium.webdriver.support import expected_conditions as EC\n\
  from selenium.webdriver.chrome.service import Service\ndef test_user_interface():\n\
  # chromedriver 的路径。请确保此路径与您的环境相符\ndriver_path = r'----------\\chromedriver.exe'\n\
  # 设置选项\noptions = Options()\noptions.add_argument('--headless')  # 不打开真实的 Chrome\
  \ 窗口\n# 使用 Service 指定驱动路径\nservice = Service(driver_path)\n# 使用选项和来自 WebDriverManager\
  \ 的驱动路径初始化驱动\nwith webdriver.Chrome(service=service, options=options) as driver:\n\
  url = 'http://127.0.0.1:8501'\ndriver.get(url)\n# 等待页面元素加载\ntry:\nWebDriverWait(driver,\
  \ 10).until(\nEC.presence_of_element_located((By.TAG_NAME, 'h1'))\n)\nhtml = driver.page_source\n\
  except Exception as e:\nprint(f'等待页面时出错: {e}')\nhtml = driver.page_source\n# 执行断言以检查页面内容\n\
  assert 'Add numbers' in html\nassert 'First Number' in html\nassert 'Second Number'\
  \ in html\ndef test_logic():\nassert calculate_sum(1, 1) == 2\nassert calculate_sum(1,\
  \ -1) == 0\nassert calculate_sum(1, 9) == 10\nif __name__ == '__main__':\ntest_logic()\n\
  test_user_interface()\n清单 1-2\nunit_test.py\n```\n\n```\nimport streamlit as st\n\
  def calculate_sum(n1, n2):\nreturn n1 + n2\nst.title('Add Numbers')\nn1 = st.number_input('First\
