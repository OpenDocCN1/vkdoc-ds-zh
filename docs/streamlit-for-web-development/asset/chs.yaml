  \n\n\n## 1.3 Streamlit 的工作原理\n\n与其他将静态文件发送到浏览器的 Web 框架不同，Streamlit 在服务端修改真实的 DOM\
  \ 及其状态来渲染最终的 Web 文档。在正常的用户行为下，不应存在安全问题。然而，与 PHP 类似，如果代码编写不当，Streamlit 也容易受到远程代码执行（RCE）的攻击，即用户输入未经清理，可能被利用执行操作系统级别的代码。最近在社区组件\
  \ `streamlit-geospatial` 中发现了此类漏洞的一个真实案例 [参考：(`https://securitylab.github.com/advisories/GHSL-2024-100_GHSL-2024-108_streamlit-geospatial/`)]。\n\
  \n运行一个 Streamlit Web 应用程序，首先要使用默认的 Python 解释器执行二进制文件（Windows 上是 `streamlit.exe`，macOS\
  \ 或 Linux 上是 `streamlit.sh`）。这会初始化应用程序配置，包括机密信息、设置、主题，以及最重要的**Delta 生成器（DG）**，它充当着\
  \ Python 脚本与 Streamlit 服务的 ReactJS Web 应用程序之间的中介。\n\n![IDE 中“运行/调试配置”窗口的截图。配置名称为“Streamlit”，设置为使用命令\
  \ `streamlit run main.py` 执行脚本文本。工作目录指定为 `C:/Users/.../part_1/chapter_1`。选中了在终端中执行的选项。“启动前”下没有列出任何任务。提供了显示标签页和激活工具窗口的选项，后者已被选中。底部有“确定”、“取消”和“应用”按钮。](img/523242_2_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13 创建一旦选择并运行当前配置就执行的 shell 命令\n\n### 1.3.1 Streamlit 架构\n\nDG 负责高效地传输要渲染到客户端侧的\
  \ HTML 组件，并检索其状态。初始渲染从 Python 文档的开头开始，一直持续到最后一行。后续渲染并非从文件开头开始，而是从用户与之交互或其状态发生改变的组件开始。这将在后面的章节中更详细地介绍。每个组件的每次新渲染都会在\
  \ DG 中排队，它要么替换现有的 HTML 片段，要么在最终 DOM 中的其他已渲染 HTML 组件之间插入。\n\nStreamlit 组件是逐个排队和渲染的，以避免因渲染耗时过长而出现空白页面，从而对用户体验产生负面影响。这种延迟可能由大量的计算、等待\
  \ API 响应，甚至是像清单 1-3 中演示的休眠函数引起，如图 1-15 和 1-16 所示。\n\n```\nimport streamlit as st\n\
