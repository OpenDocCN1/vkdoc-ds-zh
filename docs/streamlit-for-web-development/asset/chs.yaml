  ## 2.4 开发用户界面


  通常，为 Web 应用程序开发用户界面需要一套与图形设计和可用性研究相关的单独技能。前端开发人员首先通过绘制线框图来构思他们的想法，该线框图可以划分页面元素。然后，通过反复优化和测试，最终确定用户界面。`Streamlit`
  通过其直观、响应迅速且标准化的界面大大简化了这一过程，使开发人员无需担心复杂的设计细节即可渲染网页。


  换句话说，`Streamlit` 界面是即插即用的，使开发人员能够专注于程序的逻辑，同时将可视化实现留给 `Streamlit`。然而，对于那些需要更多定制化功能的人来说，他们可以集成自己的
  HTML 和/或 JavaScript 组件。可定制性和外部组件将在后续章节中介绍。


