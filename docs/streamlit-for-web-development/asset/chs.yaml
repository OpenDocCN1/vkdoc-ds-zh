  清单 7-2\nmain_page.py\n```\n\n## 7.2 介绍会话 ID\n\n会话 ID 是 Streamlit 会话每个新实例的唯一标识符。每当打开一个新的浏览器页面时，即使另一个连接已经处于活动状态，也会建立一个新的会话\
  \ ID。然而，服务器会将每个会话独立对待。\n\n这些唯一的 ID 可用于为最终用户提供个性化的体验。为了实现这一点，服务器需要将每个用户的进度和更新映射到其对应的\
  \ ID。这可以通过在 Streamlit 中生成唯一的会话 ID 来完成。在清单 7-4 中，我们演示了如何生成会话 ID。输出如图 7-3 所示，其中显示了两个都在\
  \ `http://localhost:8501/` 上运行的网页。\n\n![此图片为截图，显示两个并排的浏览器窗口。每个窗口显示一个会话 ID。左侧窗口显示会话\
