  ## 2.2 修改数据框


  鉴于 `Streamlit` 专注于开发机器学习和数据科学应用，开发者通常需要根据用户输入或需求来修改数据框。在本节中，我们将介绍一些最常用的修改 Pandas
  数据框的方法（非详尽列表）。


  ### 2.2.1 筛选


  可以使用清单 2-7 中所示的方法来筛选数据框。通过为某列指定一个数值或字符串条件，例如 `df[df[''Column 1''] > -1]`，我们可以根据该条件筛选行，如图
  2-9 所示。


  ![显示两个表格。第一个表格标记为"原始数据框"，包含四行和三列，标题为：Column 1、Column 2 和 Column 3。第二个表格标记为"修改后的数据框"，其结构和值与第一个表格相同。两个表格中的数据都是数值型，如
  1.7641、0.4002 和 0.9787。](img/523242_2_En_2_Fig9_HTML.jpg)


