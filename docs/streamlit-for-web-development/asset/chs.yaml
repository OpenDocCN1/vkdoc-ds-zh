  \n当你读到本章结尾时，你已经掌握了为 `Streamlit` 创建创新且令人兴奋的自定义组件所需的知识。通过使用简化版的 ReactJS 模板并参考在线资源，你不仅可以在\
  \ `Streamlit` 中复制 ReactJS 的 Material UI 视图，还可以控制浏览器功能，将原生 Web 应用的用户体验集成到你的应用中。本章还介绍了如何自定义\
  \ `Streamlit` 用户界面的各个方面，为你的应用增加多功能性和独特性。分享构建此库过程中所使用的技术，任何开发者都可以将其进行扩展和调整，以满足广泛的用途。最后，重要的是要记住，任何组件如果不与开源社区分享，就无法发挥其全部潜力；在社区中，它可以通过其他开发者的反馈和建议不断迭代改进。\n\
  \n\n\n# 11. Streamlit 用例\n\n在本章中，我们将探索 Streamlit 的几个实际应用案例，包括数据可视化、实时仪表盘和时间序列分析。我们还将演示如何将\
  \ Streamlit 应用与外部子系统（如 Arduino 微控制器、红外温度传感器和声纳模块）进行接口对接。通过与物理设备和外设集成，Streamlit 能够超越数字仪表盘的范畴，支持嵌入式系统和物联网应用。例如，我们可以开发一个运营仪表盘，用于远程监控建筑温度或控制工厂生产线上的阀门电机。可能性几乎是无限的。作为本书所涵盖概念的高潮，本章最后一节将引导读者开发一个高级机器学习应用，该应用整合了前面讨论过的许多技术。\n\
  \n## 11.1 仪表盘与实时应用\n\nWeb 应用中一个虽小但极具价值的分支是仪表盘——无论它们是否与实时设备接口。示例包括报告实时天气数据的气象应用，或允许用户通过实时反馈操作电机的控制面板。可能性巨大，实用性无与伦比。得益于\
  \ Streamlit 的多功能性——尤其是在处理数据可视化和动态占位符方面——我们具备了构建此类应用的绝佳条件。在接下来的章节中，我们将考察该类别的两个代表性示例。\n\
  \n### 11.1.1 温度数据记录器应用\n\n鉴于需要对物理参数进行实时洞察，许多实体——包括能源公司、研究机构和气象部门——正在迅速采用 SCADA 系统，但通常成本高昂，以增强数据可访问性。虽然大公司有能力为这类系统分配大量预算，但较小的企业或个人可能缺乏同样的财务资源。幸运的是，他们可以利用\
  \ Arduino 微控制器、爱好者级别的外设，以及最重要的 Streamlit，来开发经济高效的替代方案，从而创建直观的仪表盘和控制系统。\n\n在本节中，我们将演示一个基本温度数据记录系统的实现。具体来说，一个\
