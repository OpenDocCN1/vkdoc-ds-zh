  ```\n\n\n\n### 10.4.4 Cookie 管理器\n\n这个概念在前一章中作为一个黑盒被引入，它仅仅在客户端浏览器上存储数据。然而，`CookieManager`\
  \ 不仅是一个自定义组件，它还充当着一个 Python 服务。它在 Python 的上下文环境中处理数据管理，并在基于 ReactJS 的组件上执行增删改查操作。如果你是\
  \ Web 开发者，你很可能熟悉在客户端设置 cookie 的方法，这很简单直接。幸运的是，在 `Streamlit` 中，我们可以在同一个脚本里编写服务器端和客户端的代码。通过创建一个\
  \ React 自定义组件，我们可以在浏览器上执行它，并设置它来控制客户端的 cookie，如图 10-13 所示。\n\n![展示客户端-服务器交互的示意图。左侧，两个服务器图标堆叠在一起，带有一个皇冠符号，标注为“服务器端”。一个箭头从客户端指向服务器端，标注为“获取我所有的\
  \ cookie”。一个虚线箭头从服务器指向客户端，标注为“给你：{...}”。右侧，一个带有 React 标志的电脑显示器标注为“客户端”。](img/523242_2_En_10_Fig13_HTML.jpg)\n\
  \n**图 10-13** 使用 `Streamlit` 控制客户端数据\n\n通过利用本章介绍的知识，我们可以在 `Streamlit` 的服务器端和运行在客户端浏览器上的自定义\
  \ ReactJS 组件之间建立双向通信。这使我们能够指示组件在浏览器上收集、删除或添加 cookie，甚至监听任何返回值。从 ReactJS 端开始，如代码清单\
  \ 10-21 所示，我们首先读取预期的参数，例如所需的操作和要处理的数据。基于这些输入，我们使用 npm 包 `universal-cookie` 对 cookie\
  \ 执行必要的操作，最后，我们发回一个响应，指示操作的状态。\n\n在 Python 端，代码清单 10-22 封装了与浏览器组件的整个通信方法。它还会在初始化后将所有\
  \ cookie 存储在内存中，以减少网络流量。然而，如果类的构造函数在首次运行后未被缓存，它将不会提供任何附加价值，因为它会在每次 `Streamlit` 重新运行时都被执行。因此，建议在实现\
  \ `CookieManager` 时使用代码清单 10-23 中的代码片段。图 10-14 演示了这个自定义组件的实际应用。\n\n![Cookie 管理器应用程序的界面，显示用于管理\
  \ cookie 的部分。“所有 Cookie”部分显示了 JSON 数据，包含键“ajs_anonymous_id”和“_streamlit_xsrf”及其各自的值。下方有三个部分：“获取\
  \ Cookie”，包含输入 cookie 名称的字段和一个“获取”按钮；“设置 Cookie”，包含 cookie 名称和值的字段以及一个“添加”按钮；“删除\
  \ Cookie”，包含 cookie 名称的字段和一个“删除”按钮。](img/523242_2_En_10_Fig14_HTML.jpg)\n\n**图 10-14**\
  \ Extra-Streamlit-Components 中的 Cookie 管理器演示\n\n```\n@st.cache_resource\ndef get_manager():\n\
  \    return stx.CookieManager()\ncookie_manager = get_manager()\n```\n**代码清单 10-23**\
  \ 如何初始化并使用 `CookieManager`\n\n```\nimport os\nimport streamlit.components.v1 as\
  \ components\nimport datetime\nfrom extra_streamlit_components import IS_RELEASE\n\
  \nif IS_RELEASE:\n    absolute_path = os.path.dirname(os.path.abspath(__file__))\n\
  \    build_path = os.path.join(absolute_path, 'frontend/build')\n    _component_func\
  \ = components.declare_component('cookie_manager', path=build_path)\nelse:\n   \
  \ _component_func = components.declare_component('cookie_manager', url='http://localhost:3001')\n\
  \nclass CookieManager:\n    def __init__(self, key='init'):\n        self.cookie_manager\
  \ = _component_func\n        self.cookies = self.cookie_manager(method='getAll',\
  \ key=key, default={})\n\n    def get(self, cookie: str):\n        return self.cookies.get(cookie)\n\
  \n    def set(self, cookie, val,\n            expires_at=datetime.datetime.now()\
  \ + datetime.timedelta(days=1), key='set'):\n        if cookie is None or cookie\
  \ == '':\n            return\n        expires_at = expires_at.isoformat()\n    \
  \    did_add = self.cookie_manager(method='set', cookie=cookie, value=val, expires_at=expires_at,\
  \ key=key, default=False)\n        if did_add:\n            self.cookies[cookie]\
  \ = val\n\n    def delete(self, cookie, key='delete'):\n        if cookie is None\
  \ or cookie == '':\n            return\n        did_add = self.cookie_manager(method='delete',\
  \ cookie=cookie, key=key, default=False)\n        if did_add:\n            del self.cookies[cookie]\n\
  \n    def get_all(self, key='get_all'):\n        self.cookies = self.cookie_manager(method='getAll',\
  \ key=key, default={})\n        return self.cookies\n```\n**代码清单 10-22** `CookieManager/__init__.py`\n\
  \n```\nimport {\n    Streamlit,\n    ComponentProps,\n    withStreamlitConnection,\n\
  } from 'streamlit-component-lib'\nimport React, { useEffect, useState } from 'react'\n\
  import Cookies from 'universal-cookie'\n\nlet last_output = null\nconst cookies\
  \ = new Cookies()\n\nconst CookieManager = (props: ComponentProps) => {\n    const\
  \ setCookie = (cookie, value, expires_at) => {\n        cookies.set(cookie, value,\
  \ {\n            path: '/',\n            samesite: 'strict',\n            expires:\
  \ new Date(expires_at),\n        })\n        return true\n    }\n\n    const getCookie\
  \ = (cookie) => {\n        const value = cookies.get(cookie)\n        return value\n\
  \    }\n\n    const deleteCookie = (cookie) => {\n        cookies.remove(cookie,\
  \ { path: '/', samesite: 'strict' })\n        return true\n    }\n\n    const getAllCookies\
  \ = () => {\n        return cookies.getAll()\n    }\n\n    const { args } = props\n\
  \    const method = args['method']\n    const cookie = args['cookie']\n    const\
  \ value = args['value']\n    const expires_at = args['expires_at']\n\n    let output\
  \ = null\n    switch (method) {\n        case 'set':\n            output = setCookie(cookie,\
  \ value, expires_at)\n            break\n        case 'get':\n            output\
  \ = getCookie(cookie)\n            break\n        case 'getAll':\n            output\
  \ = getAllCookies()\n            break\n        case 'delete':\n            output\
  \ = deleteCookie(cookie)\n            break\n        default:\n            break\n\
  \    }\n\n    if (output && JSON.stringify(last_output) != JSON.stringify(output))\
  \ {\n        last_output = output\n        Streamlit.setComponentValue(output)\n\
  \        Streamlit.setComponentReady()\n    }\n\n    useEffect(() => Streamlit.setFrameHeight())\n\
  \n    return null\n}\n\nexport default withStreamlitConnection(CookieManager)\n\
