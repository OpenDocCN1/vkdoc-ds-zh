  ### 2.2.7 数据编辑器


  Streamlit 的`st.data_editor`小部件提供了一种强大且交互式的方式，可以直接在应用中编辑 DataFrame 中的数据。此功能对于从事机器学习和数据科学应用的开发者尤其有用，*它允许在运行中实时调整数据，从而节省宝贵时间*。用户无需离开应用或手动编辑源代码，即可更新、添加或删除数据条目。通过`st.data_editor`小部件所做的更改会立即反映在
  DataFrame 中，使得尝试不同数据配置并实时查看结果变得更加容易。


  除了交互功能外，`st.data_editor`小部件还支持多种自定义选项，以满足特定的编辑需求。开发者可以配置该小部件来允许或限制某些类型的编辑，从而确保数据完整性。


  ## 2.3 渲染静态和交互式图表


  数据可视化是 Streamlit 真正擅长的领域。创建和显示各种静态与交互式图表的便捷性令人印象深刻。Streamlit 原生支持多种图表，包括但不限于条形图、折线图和面积图，以及图形、地图和其他类型的交互式与非交互式可视化。此外，还有许多第三方绘图库可以与
  Streamlit 集成。在本节中，我们将使用 Pandas DataFrame 中的数据创建几个静态和交互式图表的示例。


  ### 2.3.1 静态条形图


