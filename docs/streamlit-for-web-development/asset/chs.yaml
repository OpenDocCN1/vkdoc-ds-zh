  \n1.  首先，在 [`www.mongodb.com/atlas/database`](http://www.mongodb.com/atlas/database)\
  \ 上注册账户并创建项目。\n\n2.  配置免费的 *M0 Sandbox* 集群，如图 5-9 和图 5-10 所示。如果需要，可调整托管区域以最小化数据库与服务器之间的延迟。\n\
