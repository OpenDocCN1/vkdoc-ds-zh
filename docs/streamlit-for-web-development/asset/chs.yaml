- "# 7. 实现会话状态\n\n为了开发更高级的 Streamlit 应用程序，建立特定于会话的数据以提供增强的用户体验至关重要。具体来说，应用程序需要使用所谓的会话状态来保留用户的数据和输入。这些状态可以根据需要在需要时设置和访问，并且当用户触发\
  \ Streamlit 应用程序的重新运行或在页面之间导航时，它们将持久存在。此外，我们将建立一种使用 Cookie 跨多个会话存储状态的方法，这可以将数据保存在用户的浏览器中，以便他们在重新启动关联的\
  \ Streamlit 应用程序时可以访问。最后，我们将学习如何记录和可视化用户与我们应用程序交互的丰富洞察，为开发人员和产品所有者提供分析数据。\n\n\n\n\
  ## 7.1 原生实现会话状态\n\n自 Streamlit 0.84.1 版本起，引入了一种原生方式来存储和管理会话特定数据——包括但不限于变量、组件、文本、图像和对象。会话状态的值以字典格式存储，每个值都分配有一个唯一键用于索引。在此之前，如果没有此功能，每当用户通过与应用程序交互触发\
  \ Streamlit 脚本重新运行时，所有变量都会被重置。同样，当用户从一个页面导航到另一个页面时，组件也会重置为其默认值。然而，借助会话状态，用户可以通过访问先前在应用程序其他页面上输入的变量或条目，获得增强且更个性化的体验。例如，用户可以一次性输入用户名和密码，并在整个应用程序中继续导航，而无需被提示重新输入凭据——直到他们登出。简而言之，会话状态使我们能够开发更复杂的应用程序，这将在后续章节中详细讨论。\n\
  \n设置和获取会话状态数据的方法可以按清单 7-1 所示实现，相关输出如图 7-1 所示。请注意，前两个键值条目（`KeyInput1` 和 `KeyInput2`）虽然并非由用户显式创建，但它们是存在的。这些键用于存储用户修改过的组件的状态——在本例中，即已定义的文本输入组件。这意味着开发者也有能力修改任何组件的值，只要该组件在定义时被分配了唯一的键。另一个重要点是，每个会话状态在读取之前必须被初始化；否则将发生错误。为防止这种情况，请务必确保使用空值或默认值来初始化状态。\n\
  \n![会话状态管理界面截图。左侧是一个 JSON 对象，显示键值对：\"KeyInput1\"对应\"AA\"，\"AA\"对应\"b\"，\"KeyInput2\"\
  对应\"DD\"。右侧有两个部分，分别标记为\"设置键\"和\"获取键\"。\"设置键\"部分包含\"键\"和\"值\"字段，分别填写了\"AA\"和\"b\"\
  ，以及一个\"设置\"按钮。\"获取键\"部分包含一个\"键\"字段，已输入\"DD\"，以及一个\"获取\"按钮。下方显示一条\"成功\"消息。](img/523242_2_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1\n会话状态数据显示与操作\n\n```\nimport streamlit as st\ndef get_state_value(key):\n\
  return st.session_state.get(key)\ndef set_state_value(key, value):\nst.session_state[key]\
  \ = value\nst.title('会话状态管理')\nc1, c2, c3 = st.columns(3)\nwith c1:\nst.subheader('全部')\n\
  st.write(st.session_state)\nwith c2:\nst.subheader('设置键')\nkey = st.text_input('键',\
  \ key='KeyInput1')\nvalue = st.text_input('值')\nif st.button('设置'):\nst.session_state[key]\
  \ = value\nst.success('成功')\nwith c3:\nst.subheader('获取键')\nkey = st.text_input('键',\
  \ key='KeyInput2')\nif st.button('获取'):\nst.write(st.session_state.get(key))\n清单\
  \ 7-1\nsession_state.py\n```\n\n### 7.1.1 使用会话状态构建应用程序\n\n为了演示会话状态的实用性，在以下示例中，我们将创建一个简单的多页面应用程序，用户可以使用状态来存储所选页面的键、上传的数据框以及滑块组件的值。如清单\
