  \      }\n    }\n    ```\n\n\n\n### 5.2.4 查询数据库\n\n要查询 MongoDB 中已建立索引的数据库，首先应使用图\
  \ 5-13 中获取的连接字符串连接到数据库。该字符串将帮助你建立客户端连接。为优化性能，建议将客户端作为一个函数调用，并使用 `@st.cache_resource`\
  \ 装饰器对其进行缓存。这样，Streamlit 会在后续查询中复用缓存的客户端，而非每次建立新连接，从而节省运行时间和资源。以下示例展示了这一方法：\n\n\
  ```python\nfrom pymongo import MongoClient\n@st.cache_resource\ndef create_client():\n\
  \    return MongoClient('')\n```\n\n接下来，你需要创建一个*聚合管道*（Aggregation），它本质上是一个用 JSON\
  \ 格式编写的多阶段过滤管道。该管道允许你在查询数据之前对其应用各种过滤和转换操作。聚合的结构取决于你想要执行的过滤和操作，它可用于相应地对查询结果进行塑形，如下例所示：\n\
  \n1. **使用模糊匹配进行搜索**\n\n    在此阶段，我们需要指定之前为搜索文档而创建的索引名称。此外，我们需要通过字符串拼接来输入用户的查询。我们还必须指定路径，换句话说，即文档中要搜索的对象，例如\
  \ `borough` 和 `address.street`（嵌套元素和/或对象可以通过英文句点访问，即 `address.street`）。最重要的是，我们需要启用模糊匹配，并使用\
  \ `maxEdits` 指定将查询与令牌匹配所需的单字符编辑次数，同时还需要使用 `prefixLength` 确定每个查询开头必须与令牌匹配的字符数。\n\n\
  \    ```json\n    \"$search\": {\n        \"index\": \"default\",\n        \"text\"\
  : {\n            \"query\": f\"{address}\",\n            \"path\": [\"borough\"\
  , \"address.street\"],\n            \"fuzzy\": {\n                \"maxEdits\":\
  \ 2,\n                \"prefixLength\": 2\n            }\n        }\n    }\n   \
  \ ```\n\n2. **投射包含搜索分数的文档**\n\n    在此阶段，我们将仅传递所需的文档对象，并使用 `searchScore` 标签计算相关性分数：\n\
  \n    ```json\n    \"$project\": {\n        \"Name\": \"$name\",\n        \"Cuisine\"\
  : \"$cuisine\",\n        \"Address\": \"$address.street\",\n        \"Borough\"\
  : \"$borough\",\n        \"Grade\": \"$grades.grade\",\n        \"Score\": {\n \
  \           \"$meta\": \"searchScore\"\n        }\n    }\n    ```\n\n3. **过滤文档**\n\
  \n    随后，我们将根据用户输入的菜系类型对传递的文档进行过滤。请注意，与模糊匹配不同，在此阶段，查询必须与文档中的令牌完全匹配才能成功过滤。\n\n  \
  \  ```json\n    \"$match\": {\n        \"Cuisine\": f\"{cuisine}\"\n    }\n    ```\n\
  \n4. **限制结果数量**\n\n    最后，在此阶段，我们将把传递的结果数量限制为所需数量：\n\n    ```json\n    \"$limit\"\
  : 5\n    ```\n\n有关聚合管道其他选项的信息，请参阅 [`https://docs.mongodb.com/manual/reference/aggregation/`](https://docs.mongodb.com/manual/reference/aggregation/)。\n\
  \n### 5.2.5 在 Streamlit 中显示表格\n\n聚合管道完成并返回查询结果后，在 Streamlit 中渲染表格之前需要进行后处理。具体来说，你需要将\
  \ MongoDB 查询结果转换为 Pandas DataFrame，并指定要保留的列。此外，还需要解析返回的任何列表（例如餐厅评级），并将其转换为纯文本，如下所示：\n\
  \n```python\ndf = pd.DataFrame(result)[['Name','Address','Grade','Score']]\ndf['Grade']\
  \ = [','.join(map(str, x)) for x in df['Grade']]\n```\n\n有关本节完整代码，可参见代码清单 5-4。此外，图\
  \ 5-18 显示了关联的 Streamlit 应用程序，其中演示了一个模糊匹配查询的示例以及在 Streamlit 中返回的表格。\n\n![一个标题为“Restaurants\
  \ Explorer”的网页应用截图。其中包含一个用于选择菜系的下拉菜单，当前设置为“American”，以及一个用于输入地址的文本框，输入内容为“brooklyn”。页面上有一个“Search”按钮。下方是一张表格，列出了餐厅的名称、地址、等级和分数。表项包括位于布鲁克林大道的“Brooklyn\
  \ Children's Museum”，等级为“A, A, A”，分数为 3.8616 等。浏览器 URL 显示为“localhost:5001”。](img/523242_2_En_5_Fig18_HTML.jpg)\n\
  \n**图 5-18** 代码清单 5-4 的输出\n\n```python\nimport streamlit as st\nimport pandas as\
  \ pd\nfrom pymongo import MongoClient\n\n@st.cache_resource\ndef create_client():\n\
  \    return MongoClient('')\n\ndef query(cuisine, address):\n    result = create_client()['sample_restaurants']['restaurants'].aggregate([\n\
  \        {\n            \"$search\": {\n                \"index\": \"default\",\n\
  \                \"text\": {\n                    \"query\": f\"{address}\",\n \
  \                   \"path\": [\"borough\", \"address.street\"],\n             \
  \       \"fuzzy\": {\n                        \"maxEdits\": 2,\n               \
  \         \"prefixLength\": 2\n                    }\n                }\n      \
  \      }\n        },\n        {\n            \"$project\": {\n                \"\
  Name\": \"$name\",\n                \"Cuisine\": \"$cuisine\",\n               \
  \ \"Address\": \"$address.street\",\n                \"Borough\": \"$borough\",\n\
  \                \"Grade\": \"$grades.grade\",\n                \"Score\": {\n \
  \                   \"$meta\": \"searchScore\"\n                }\n            }\n\
  \        },\n        {\n            \"$match\": {\n                \"Cuisine\":\
  \ f\"{cuisine}\"\n            }\n        },\n        {\n            \"$limit\":\
  \ 5\n        }\n    ])\n    try:\n        df = pd.DataFrame(result)[['Name','Address','Grade','Score']]\n\
  \        df['Grade'] = [','.join(map(str, x)) for x in df['Grade']]\n        return\
  \ df\n    except:\n        return None\n\nif __name__ == '__main__':\n    st.title('Restaurants\
  \ Explorer')\n    cuisine = st.selectbox('Cuisine', ['American', 'Chinese', 'Delicatessen',\n\
  \                                       'Hamburgers', 'Ice Cream, Gelato, Yogurt,\
  \ Ices', 'Irish'])\n    address = st.text_input('Address')\n    if st.button('Search'):\n\
  \        if address != \"\":\n            st.write(query(cuisine, address))\n  \
  \      else:\n            st.warning('Please enter an address')\n```\n\n**代码清单 5-4**\
  \ `mongodb.py`\n\n## 5.3 本章小结\n\n在本章中，我们探讨了用于存储和检索关系型与非关系型数据库，分别用于处理结构化和非结构化数据。我们学习了如何配置\
  \ PostgreSQL 数据库，并将其与 Streamlit 应用程序集成以管理和处理结构化数据集。同样，我们了解了如何配置 MongoDB 云数据库来处理非结构化数据，存储包含不同模式、对象和元素的文档集合。我们还演示了\
  \ MongoDB 如何创建全文索引，为每个文档中的每个令牌建立索引以改进查询，以及如何对查询词条与文档令牌执行模糊匹配，以减少拼写错误的影响。最后，我们将所有这些操作——设置数据库客户端、编写聚合管道以及后处理查询结果——集成到一个\
  \ Streamlit 应用程序中，完成了本章内容。\n\n"
- "# 6. 利用后端服务器\n\n在本章中，我们将介绍一种更复杂、更具可扩展性的 Web 应用程序设计方法。具体来说，我们将探讨如何将管理数据库的开销从 Streamlit\
  \ 服务器卸载到独立的后端服务器，这也是全栈环境中的典型做法。本章将引导开发者完成在 Python 中配置后端服务器的过程，该服务器将充当前端与数据库之间的中介。最后，开发者将了解一种高度模块化、多功能且安全的架构，该架构在应用程序和数据库之间增加了安全层。\n\
  \n\n\n## 6.1 后端服务器的必要性\n\n在构建可扩展且稳健的 `Streamlit` 应用时，某些在 `Streamlit` 应用内执行的任务，更适合在一个易于通信的隔离环境中处理。这个环境被称为后端，它负责管理认证、授权、数据库及其他网关连接。此外，它还处理那些不应该在前端（即\
  \ `Streamlit`）上执行的核心业务逻辑。虽然 `Streamlit` 本身是一个服务端 Web 框架，但将其与其他系统组件隔离，能够提高模块化和安全性。如果从身份验证到数据库管理的一切都直接在\
  \ `Streamlit` 中运行，而未妥善设计，可能会引入多种安全风险，例如 XSS、SSRF，甚至潜在的 RCE。\n\n尽管前后端架构并非无懈可击，但它通过使用\
  \ API 增加了额外的保护层。这使得恶意行为者更难绕过安全措施来访问受保护的系统组件。现代的 API 设计方法论还能确保每个请求都通过一致的机制进行路由，从而减少因人为错误导致漏洞的可能性。\n\
  \n## 6.2 前后端通信\n\n后端通常被称为服务器，而前端则被称为客户端。在这种架构中，客户端根据用户的操作触发对资源或信息的请求。然后，服务器响应并返回请求的数据。这种请求-响应通信模型是\
  \ HTTP 协议的基础，它由两个主要部分组成：标头（header）和主体（body）。\n\n请求和响应的标头包含关于请求以及主体中有效载荷的元数据。这些元数据包括但不限于：Cookie、请求标识符、密钥、令牌、主体的内容类型、服务器的主机或\
  \ IP 地址，以及数据的编码或压缩机制。基于本书的定位，我们将重点关注关键方面，如密钥、令牌、Cookie 和主体的内容类型。例如，请求主体类型如表 6-1\
  \ 所示。由于后端主要处理信息的发送和接收，JSON 是最广泛使用的通信格式。\n\n**表 6-1** 常见的 Content-Type 标头值\n\n| Content-Type\
  \ 值 | 描述 |\n| --- | --- |\n| `text/HTML` | 文本格式，但可解析为 HTML 以便渲染成网页 |\n| `application/JSON`\
  \ | JSON 格式 |\n| `application/xml` | XML 格式 |\n| `image/png` | PNG 类型的图像二进制数据 |\n\
  \n### 6.2.1 HTTP 方法\n\n如第 5.1 节所述，HTTP 请求带有方法。与 SQL 不同，HTTP 方法的语法变化不大。主要的方法包括 `GET`、`POST`、`PUT`\
  \ 和 `DELETE`，分别对应于检索、添加、修改和删除一个资源。添加和修改资源可以包含一个主体来更改资源，而 `GET` 和 `DELETE` 通常使用请求\
  \ URL 中的资源标识符。这些是 RESTful API 的核心功能，它作为 HTTP 网关来管理服务器端的资源或数据。\n\n访问一个网站，本质上就是向该\
  \ URL 发送一个 `GET` 请求，该请求在其标头、主体和响应码中包含了与请求相关的特定数据。例如，仅使用域名请求一个页面时，默认会请求其 HTTP 版本，但后端服务器可能会重定向到\
  \ HTTPS 版本。例如，谷歌会从 `google.com` 重定向到 `https://google.com`。你可以通过检查页面的网络流量或使用 `Curl`\
  \ 来验证这一点。`Curl` 是一个用于从终端或 CMD 发起 HTTP 请求的工具，允许你查看响应主体、标头和状态码。它还有助于理解后端命令，例如跟随重定向。图\
  \ 6-1 通过命令 `curl -i -L google.com` 演示了这一点，其中 `-i` 用于显示响应标头，`-L` 用于跟随重定向。\n\n![一个命令提示符窗口，显示使用\
  \ curl 命令成功向 www.google.com 发起 HTTP 请求。响应包含 HTTP 状态 200 OK、日期和时间、内容类型、缓存控制以及各种安全标头。文本显示在黑色背景上的绿色字符，这是命令行界面的典型风格。](img/523242_2_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1** 获取 `google.com` 并观察响应标头和重定向过程\n\n## 6.3 使用 JSON 文件\n\nJSON 文档可用于表示和解析数据。它们可以包含列表/数组或键/值对，类似于\
  \ Python 中的字典。它们还可以包含其他原始数据类型，例如整数、浮点数、字符串和布尔值。通过这些简单的数据类型，可以表示复杂的数据结构。清单 6-1 展示了一个示例\
  \ JSON，它表示之前介绍的一个例子。\n\n```json\n[\n{\n\"Name\": \"Adam\",\n\"DOB\": \"01/01/1990\"\
  ,\n\"Paygrade ID\": \"2\"\n},\n{\n\"Name\": \"Sara\",\n\"DOB\": \"01/01/1980\",\n\
  \"Paygrade ID\": \"1\"\n},\n{\n\"Name\": \"Bob\",\n\"DOB\": \"01/01/1970\",\n\"\
  Paygrade ID\": \"1\"\n},\n{\n\"Name\": \"Alice\",\n\"DOB\": \"01/01/2000\",\n\"\
  Paygrade ID\": \"3\"\n}\n]\n```\n\n**清单 6-1** `sample_json.json`\n\n## 6.4 配置后端服务器\n\
  \n为了与本书的 Python 主题保持一致，我们将构建一个 Python 风格的后端服务器。在众多可选方案中，`Flask` 和 `Django` 都是完成此任务的绝佳选择。虽然两者都可以通过提供供浏览器渲染的\
  \ HTML 来充当前端应用服务器，但 `Django` 正是为此目的而设计的，这归功于其内置的 Web 模板引擎 `Jinja`。另一方面，`Flask` 更加灵活且可根据开发者的需求进行配置，并且重量更轻。要开始使用，请使用\
  \ `pip` 安装 `Flask`。\n\n\n\n### 6.4.1 API 构建\n\n后端会执行一个或多个方法或函数，以响应发往服务器的请求。这些方法和函数依赖于\
  \ URL，并且可以配置为同时考虑请求头。清单 6-2 展示了一个简单的例子：请求 `http://<SERVER-HOST>/server_status` 会返回图\
  \ 6-2 中的页面，而任何其他请求则会返回一个 *404 Not Found* 错误。\n\n![网页浏览器截图，显示在 URL \"http:/127.0.0.1:5000/server_status\"\
  \ 上来自 Flask 服务器的 JSON 响应。该 JSON 数据包含三个键值对：\"message\" 的值为 \"Welcome to your Flask\
  \ Server\"，\"random\" 的值为 2，\"status\" 的值为 \"up\"。\"Pretty-print\" 选项已勾选。](img/523242_2_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n当在运行清单 6-2 的服务器上请求 `/server_status` 路由时返回的页面\n\n```\nfrom flask import\
  \ Flask\napp = Flask(__name__)\n@app.route('/server_status')\ndef welcome_controller():\n\
  return {\n'message': 'Welcome to your Flask Server',\n'status': 'up',\n'random':\
  \ 1 + 1\n}\napp.run()\n清单 6-2\nflask_sample.py\n```\n\n为了在请求某个路由时触发特定的函数调用，需要在该函数之前添加一个包含路由名称的函数装饰器。路由不必是静态的；通过使用特定的字符串格式可以使它们成为动态的，Flask\
  \ 会将这些动态路由映射到相应的函数。例如，`/text/1` 和 `/text/3` 可以映射到 `/text/<id>`。此外，可以通过在同一个函数装饰器中添加一个额外的参数来指定\
  \ HTTP 方法，如下所示：\n\n```\n@app.route('/text/', methods=['GET', 'PUT'])\n```\n\n接着前面关于员工和薪资等级的例子，我们将在本例中重用同一个数据库，但使用\
  \ *SQLAlchemy* 代替 *psycopg2*，以便利用 *ORM*（对象关系映射）将 SQL 命令映射到 Python 类对象。首先，我们需要将表表示为类，以及一个\
  \ Base 类，另外两个类将从该类继承 SQL 属性。这些属性包括 SQL 查询参数化，以防止 SQL 注入。清单 6-4 和 6-5 中的类将指向数据库中已有的表，其中\
  \ `__tablename__` 属性代表表名。\n\n```\nfrom sqlalchemy import Column, Integer, String\n\
