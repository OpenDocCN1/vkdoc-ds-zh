  \n**图 1-8** Streamlit 动画演示应用\n\n### 1.2.6 使用 PyCharm 编写和测试代码\n\n通常，代码会随时间增长，要么是通过向原始代码库添加新模块，要么是通过与第三方服务集成。为了确保代码完美运行，可以采用测试。代码测试通常分为两种方法：单元测试和集成测试。单元测试用于测试单个模块，而集成测试则确保整个系统按预期工作。在本例中，我们将重点关注单元测试，但相同的概念也可应用于集成测试。在这两种情况下，我们都需要提供输入，并将预期输出与实际输出进行比较。对于一个允许用户计算两个数字之和的简单\
  \ Streamlit 应用，我们可以测试两个主要方面：首先，Web 应用程序是否按预期渲染；其次，求和逻辑是否正确。这是两个独立的单元测试，但第一个测试在开发任何前端应用时都很常见。清单\
  \ 1-1 显示了我们将要测试的示例应用程序，当使用 Streamlit 运行时，其输出如图 1-12 所示。清单 1-2 则测试了该示例的渲染和求和逻辑。\n\
