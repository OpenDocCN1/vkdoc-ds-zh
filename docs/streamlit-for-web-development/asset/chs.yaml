  ## 9.2 部署到 Streamlit Community Cloud\n\n在云上部署 Web 应用程序可能是一项艰巨的任务，具体取决于你的云服务提供商。有些提供商，如\
  \ Heroku，已经将其简化为连接你的 GitHub 仓库、安装构建包、配置应用程序并启动它。其他提供商则需要你处理整个过程，包括设置虚拟机、创建容器、配置端口转发、负载均衡以及自行路由请求。无论如何，部署到云端至少需要对云计算概念有基本的了解——毕竟，这就是我们有\
  \ DevOps 工程师的原因。\n\n然而，Streamlit 正在使这最后一公里变得大众化，让部署几乎成为一键式流程。借助 Streamlit Cloud，你只需连接你的\
  \ GitHub 仓库并点击部署即可。Streamlit 会自动配置应用程序及其所有必需的依赖项，并在你每次推送新版本的源代码时进行更新。无需开发人员进行额外干预。此外，如果你需要多个私有应用程序、额外的计算资源或企业级功能，你可以升级到\
  \ Streamlit 的高级套餐。\n\n### 9.2.1 一键部署\n\n在将你的第一个应用程序部署到 Streamlit Cloud 之前，你应该创建一个\
