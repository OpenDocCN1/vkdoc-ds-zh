  ### 2.1.3 管理和调试错误


  如果你在开发模式下运行 `Streamlit`，并且按照 3.1 节中表 3-1 所示配置了 `showErrorDetails = True`，那么 `Streamlit`
  会在网页上显示运行时异常，就像 IDE 在控制台中显示此类消息一样。这并不理想，因为用户可能难以理解错误并感到困惑。更重要的是，未处理的异常可能会在你代码的后续部分触发一系列致命错误，从而可能影响其他系统。此外，`Streamlit`
  会显示导致异常的特定代码段，如果你的源代码受知识产权保护，这可能会带来风险。


  ```python

  import streamlit as st

  # 为输入创建列

  col1, col2 = st.columns(2)

  with col1:

  number_1 = st.number_input(''请输入第一个数字'',value=0,step=1)

  with col2:

  number_2 = st.number_input(''请输入第二个数字'',value=0,step=1)

  st.info(f''**{number_1}/{number_2}=** {number_1/number_2}'')

  清单 2-4

  without_try_and_except. py

  ```


  运行清单 2-4，我们可以创建一个简单的应用程序，用于一个数除以另一个数。如果用户除以非零数字，应用程序会正常运行并显示如图 2-5 所示的输出。然而，如果用户尝试除以零，Python
  会引发零除错误，`Streamlit` 会将其显示出来，如图 2-6 所示。


