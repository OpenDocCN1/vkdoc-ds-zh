  \n![MongoDB Atlas 创建共享集群界面截图。页面提供“无服务器”、“专用”和“共享”集群选项，其中“共享”被高亮标记为免费。一条消息说明无需信用卡即可开始，并提及了样本数据集的可用性。“云提供商和区域”设置为“AWS，\
