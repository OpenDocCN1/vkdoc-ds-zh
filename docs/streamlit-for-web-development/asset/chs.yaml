  \n既然我们已经讨论过如何保护 Streamlit 应用程序的密钥凭据免受外部访问，现在我们介绍另一种方法——在 Flask 中常用，同样可以应用于 Streamlit\
  \ 场景。本质上，我们需要一个文件来存储这些密钥。这包括 JWT 签名密钥和注册头部密钥，应将它们保存在磁盘上，然后在运行时加载到应用程序的内存中。虽然存储密钥和秘钥的方式有多种，但最用户友好的选项之一是使用\
  \ YAML 文件，如代码清单 8-12 所示。这些文件可以轻松解析并转换为 Python 字典。\n\n为了支持使用其他一键登录方式（如 Google 或 Microsoft）进行登录，您需要将必要的凭据添加到以下文件中，以允许您的应用程序使用这些登录方式。有关如何设置的更多详细信息，请访问\
  \ `https://docs.streamlit.io/develop/api-reference/user/st.login`。\n\n```yaml\n\
  jwt_secret: \"此处填写随机文本\"\nsign_up_key: \"此处填写另一段随机文本\"\nauth:\nredirect_uri: \"\
  http://localhost:8501/oauth2callback\"\ncookie_secret: \"xxx\"\nclient_id: \"xxx\"\
  \nclient_secret: \"xxx\"\nserver_metadata_url: \"https://accounts.google.com/.well-known/openid-configuration\"\
  \n```\n代码清单 8-12\n`Flask/secrets.yaml`\n\n## 8.4 使用 SQLAlchemy 的防 SQL 注入措施\n\n作为最终通过代码实现的保护措施，我们旨在通过防止意外操作来保护后端的\
  \ SQL 查询。首先，我们需要识别什么是 SQL 注入。它通常发生在用户控制的输入改变了 SQL 命令行为的时候。例如，假设我们要支持搜索姓名以最终用户提供的字符串开头的员工。这可能会导致如下查询：`SELECT\
  \ * FROM Employees WHERE name = 'input%'`。然而，如果输入是 `OR 1=1 --`，这会改变最终查询为：`SELECT\
  \ * FROM Employees WHERE name = '%' OR 1=1 --`。\n\n这会导致数据库返回所有员工，而不是将输入视为搜索字符串。\n\
  \n为了防止这个问题，我们使用参数化，这是一种将 SQL 命令与变化的变量分离开的技术。因此，在上面的例子中，查询将如下所示：`SELECT * FROM Employees\
  \ WHERE name = '@name%'`，其中 `@name` 是在提交查询之前初始化的 SQL 变量。作为开发者，这似乎是为了确保更安全的 SQL 而做的额外工作。但是，库和包可以为我们处理这件事。为此，我们使用\
  \ SQLAlchemy，它是一个连接多种数据库的库，并根据数据库架构、来源和版本调整 SQL 命令格式。它遵循直观的 API，在 `docs.sqlalchemy.org`\
  \ 上有完善的文档。\n\n\n  \n## 8.5 配置 Git 忽略变量  \n\n在大型项目中使用 Git 这类版本控制系统追踪所有文件至关重要，因为它能简化重要文件及其修改历史的管理。然而，并非所有文件都应被追踪，尤其是那些可能带来安全风险的文件。如果代码库是公开的，或者私有仓库遭到入侵，追踪文件中的机密信息就会变得脆弱。因此，开发者广泛认可的做法是不在版本控制中追踪机密文件。相反，应将机密信息存储在可通过多种认证方法访问的安全保管库中。\
  \  \n\n虽然这种做法增加了额外的安全层，但可能会对代码可读性造成负面影响，尤其是当不熟悉项目的开发者开始工作时。为了解决这个问题，我们可以添加一个名为 `Flask/secrets.example.yaml`\
  \ 的文件，其内容与实际机密文件相似，但将敏感键值替换为模糊占位符，如清单 8-13 所示。这为开发者提供了示例，同时不会暴露真实机密信息。  \n\n接下来，我们可以通过更新\
  \ `.gitignore` 文件来将实际机密文件排除在 Git 追踪之外，如清单 8-14 所示。如有必要，可以根据指定语法忽略或排除与 `.gitignore`\
  \ 处于同一目录下的任何文件或文件夹。  \n\n```\nSecrets.example.toml  \n清单 8-14  \nFlask/.gitignore\
  \  \n```  \n\n```\njwt_secret = \"\"  \nsing_up_key = \"\"  \n[auth]  \nredirect_uri\
  \ = \"http://localhost:8501/oauth2callback\"  \ncookie_secret = \"xxx\"  \nclient_id\
  \ = \"xxx\"  \nclient_secret = \"xxx\"  \nserver_metadata_url = \"https://accounts.google.com/.well-known/openid-configuration\"\
  \  # fmt: skip  \n清单 8-13  \nFlask/secrets.example.toml  \n```  \n\n## 8.6 总结  \n\
  \n作为任何 Web 应用公开化的一部分，通过验证每个用户的授权级别来管理所服务的资源至关重要。在本章中，我们解释了如何创建和管理用户账户，并利用它们进行身份认证。我们介绍了关键的安全机制，例如生成\
  \ JSON Web Token、对密码进行哈希处理，以及将安全签名嵌入到 Cookie 中。此外，我们还介绍了防止 SQL 注入攻击的技术，确保未经授权的用户无法访问数据库。最后，我们探讨了如何在部署过程中保护应用密钥和机密信息，以及如何将它们排除在版本控制系统（如\
  \ Git）的提交之外。  \n\n"
- "# 9. 本地部署与云端部署  \n\n随着 Streamlit 应用开发阶段接近尾声，它即将首次“面世”。换句话说，你已经准备好部署应用并与全世界分享你的成果。为此，你需要一台能够持续、稳健且弹性地运行应用的机器。虽然你可以将本地机器临时用作服务器，但更好的做法是将应用部署到强大的云端——使用\
  \ Amazon Web Services、Microsoft Azure、Google Cloud Platform，或者同样重要的 Streamlit 自身的平台。\
