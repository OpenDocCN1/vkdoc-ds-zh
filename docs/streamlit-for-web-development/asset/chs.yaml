  ### 2.2.6 合并


  多个 DataFrame 可以通过`Pandas`使用一个公共列作为参考合并在一起，如代码清单 2-12 所示。我们可以使用`df1.merge(df2, how="inner",
  on="Name")`命令指定合并时依据的列，以及合并结果是两个 DataFrame 的并集还是交集。这将创建一个合并后的 DataFrame，如图 2-14
  所示。


  ![图片显示了原始数据框与合并后数据框的对比。原始数据框由三个独立的表格组成，每个表格有两行，包含"Name"和"Exam"成绩列。第一个表格显示"Exam 1"的成绩：Jessica
  77, John 56。第二个表格显示"Exam 2"的成绩：Jessica 76, John 97。第三个表格显示"Exam 3"的成绩：Jessica 87,
  John 95。合并后的数据框将这些数据整合到一个表格中，包含"Name"、"Exam 1"、"Exam 2"和"Exam 3"列，展示了每个个体的相同成绩。](img/523242_2_En_2_Fig14_HTML.jpg)


  **图 2-14** 合并 Pandas DataFrame（代码清单 2-12 的输出）


  ```

  import streamlit as st

  import pandas as pd

  # Create the first DataFrame (df1)

  df1 = pd.DataFrame(data={''Name'': [''Jessica'', ''John''],

  ''Exam 1'': [77, 56]})

  # Create the second DataFrame (df2)

  df2 = pd.DataFrame(data={''Name'': [''Jessica'', ''John''],

  ''Exam 2'': [76, 97]})

  # Create the third DataFrame (df3)

  df3 = pd.DataFrame(data={''Name'': [''Jessica'', ''John''],

  ''Exam 3'': [87, 95]})

  # Display the original dataframes

  st.subheader(''Original DataFrames'')

  st.dataframe(df1)

  st.dataframe(df2)

  st.dataframe(df3)

  # Merge the dataframes on ''Name'' column using inner join

  df_merged = df2.merge(df3, how=''inner'', on=''Name'')

  df_merged = df1.merge(df_merged, how=''inner'', on=''Name'')

  # Display the mutated dataframe after merging

  st.subheader(''Mutated DataFrame'')

  st.dataframe(df_merged)

  ```

