  '/')\ndf = read_data('user_insights',engine)\ndf.to_excel('C:/Users/.../user_insights.xlsx',index=False)\n\
  代码清单 7-6\nread_user_insights.py\n```\n\n## 7.4 Cookie 管理\n\n我们已经讨论了如何使用原生方法和变通方法在会话中存储和管理数据。但是，可能缺少的是跨会话管理数据的能力。例如，存储一个计数器来追踪按钮被点击的次数，或者更有用的是，防止用户在每次启动新会话时都必须重新登录。为了实现这一点，我们需要利用\
  \ cookies。虽然 Streamlit 已经实现了自己的原生 cookie 管理甚至认证命令（`st.context` 和 `st.login`），但在本书中，我们将重点放在第三方组件上，因为它们提供了原生尚未涵盖的额外功能。\n\
  \nCookies 可用于跨多个网站追踪用户的操作，或存储个人信息，例如身份验证令牌。它们存储在用户端并由用户端管理，特别是在浏览器中，这意味着默认情况下服务器无法直接访问其内容。要查看任何\
  \ Web 应用程序上的 cookies，只需打开浏览器中的开发者工具并进入控制台选项卡。然后，输入 `document.cookie` 来显示 cookies，如图\
  \ 7-7 所示。\n\n![截图显示浏览器控制台执行了命令 `document.cookie`。输出显示了 cookie 数据，包括标识符，如 `ajs_user_id`\
  \ 和 `ajs_anonymous_id`，后跟字母数字字符串。](img/523242_2_En_7_Fig7_HTML.jpg)\n\n图 7-7\n\n\
  一个网页 cookie\n\n在典型的 Streamlit 应用程序中，可能还存在其他 cookies——除了图 7-7 中所示的那个——用于广告追踪等目的。这些\
  \ cookies 可能需要根据开发者采用的 cookie 政策进行删除。在其他情况下，开发者可能希望添加额外的 cookies 来增强应用程序的用户体验。无论哪种情况，都需要一种在任何\
  \ Web 应用程序中管理 cookies 的方法。\n\n为了在 Streamlit 应用程序中操作 cookies，我们需要使用一个第三方模块或库。对于这个示例，我们将使用\
  \ *Extra-Streamlit-Components*，它可以通过 `pip install extra-streamlit-components` 安装，并使用别名\
  \ `stx` 导入。别名中的 `X` 代表该库为标准 Streamlit 应用程序带来的额外功能。这个库包含一个名为 *Cookie Manager* 的模块，它将作为我们管理\
  \ cookies 的工具。代码清单 7-8 演示了一个简单的 Streamlit 应用程序，它能够设置、获取和删除 cookies。这些控件可以根据开发者的需求进行自定义。例如，可以为任何新\
  \ cookie 设置过期日期，一旦到达设定的日期，该 cookie 将自动被删除。图 7-8 和图 7-9 分别展示了添加和检索身份验证令牌的示例。\n\n\
  ![截图显示了一个使用 Extra-Streamlit-Components 的“Cookie 管理演示”界面。它显示了一个包含键和值的 cookie 列表，例如“ajs_anonymous_id”和“AuthToken”。下方有用于获取、设置和删除\
  \ cookies 的部分，每个部分都有输入字段和标有“获取”、“添加”和“删除”的按钮。](img/523242_2_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n获取一个 AuthToken cookie\n\n![截图显示了一个使用 Extra-Streamlit-Components 的“Cookie\
  \ 管理演示”界面。它显示了一个包含 cookie 详情的 JSON 对象：“ajs_anonymous_id”、“AuthToken”和“_streamlit_xsrf”。下方有用于获取、设置和删除\
  \ cookies 的部分，带有输入字段和标有“获取”、“添加”和“删除”的按钮。](img/523242_2_En_7_Fig8_HTML.jpg)\n\n\
  图 7-8\n\n添加一个 AuthToken cookie\n\n\n\n```python\nimport streamlit as st\nimport\
  \ extra_streamlit_components as stx\n\nst.title('Cookie Management Demo')\nst.subheader('_Featuring\
  \ Cookie Manager from Extra-Streamlit-Components_')\n\ncookie_manager = stx.CookieManager()\n\
  \nst.subheader('All Cookies:')\ncookies = cookie_manager.get_all()\nst.write(cookies)\n\
  \nc1, c2, c3 = st.columns(3)\n\nwith c1:\n    st.subheader('Get Cookie:')\n    cookie\
  \ = st.text_input('Cookie', key='0')\n    clicked = st.button('Get')\n    if clicked:\n\
  \        value = cookie_manager.get(cookie)\n        st.write(value)\n\nwith c2:\n\
  \    st.subheader('Set Cookie:')\n    cookie = st.text_input('Cookie', key='1')\n\
  \    val = st.text_input('Value')\n    if st.button('Add'):\n        cookie_manager.set(cookie,\
  \ val)\n\nwith c3:\n    st.subheader('Delete Cookie:')\n    cookie = st.text_input('Cookie',\
  \ key='2')\n    if st.button('Delete'):\n        cookie_manager.delete(cookie)\n\
  \n# 清单 7-8：cookie_management.py\n```\n\n请注意，图 7-8 和图 7-9 中的\"所有 Cookies\"部分以结构良好的\
  \ JSON 格式显示，出于隐私原因，部分 Cookies 已被遮盖。同样重要的是，这个使用新引入模块的 Streamlit 应用并不包含可视化组件。这是因为该模块被归类为服务——因此得名\
  \ *Cookie Manager*。然而，这并不意味着所有其他 Streamlit 兼容库都具有相同的行为；有些库可能确实将可视化元素作为其功能的一部分。\n\
  \n## 7.5 总结\n\n在本章中，我们探讨了如何原生地使用 Streamlit 存储和访问会话状态。会话状态在许多情况下都至关重要，并将在后续章节中广泛应用于开发高级应用。此外，读者还了解了会话\
  \ ID——即与每个 Streamlit 应用新实例相关联的唯一标识符——并学习了如何记录和可视化用户洞察。最后，我们涵盖了如何在浏览器中存储和检索 Cookies，这对于在同一个浏览器上维护\
  \ Streamlit 应用的多个会话之间的状态至关重要。这一点在用户希望自动登录而无需重新输入凭据的场景下尤为有用。\n\n"
- "# 8. 用户认证与应用安全\n\n在熟悉了一个结构良好的 Streamlit Web 应用的基本构建模块之后，我们现在需要一个额外的功能来部署一个可用于生产环境的应用：一个安全的用户认证服务。一旦所有请求访问该应用的用户都通过认证，我们就能确保一个安全的用户体验，其中私有数据保持安全，任何不受欢迎或恶意的请求都会被有效拒绝。在本章中，我们将学习如何建立用户账户、验证用户操作，以及实施任何称职的软件工程师都应掌握的其他维护措施。\n\
  \n## 8.1 开发用户账户\n\n在本章中，我们将基于第 5 章和第 6 章的示例进行扩展，引入能够查看和添加员工及其薪资等级的人力资源管理员。假设有指定的管理员负责这些操作，且公司会频繁更换或指派新的管理员。在这种情况下，我们的应用需要支持创建多个管理员账户，并相应地为他们授权。\n\
  \n由于这些操作需要授权人员执行，我们需要实现三个主要功能：在数据库中添加一个管理员表、启用管理员账户创建、以及授权具有管理员权限的用户访问服务的相关部分。\n\
  \n### 8.1.1 哈希处理\n\n要向数据库添加新表，我们将遵循与之前类似的过程，如图 8-1 所示。请注意，我们为每位管理员存储了两项关键信息：用户名和密码哈希值。我们没有保存密码本身，而是存储了一个哈希值——即密码的一种不可猜测的表示形式。这种方法有助于在数据泄露时保护用户隐私和凭据。如果发生此类泄露，攻击者需要花费数十亿年的时间暴力破解哈希值，才能找出单个用户的实际密码。哈希本质上是一种不可逆的数据单向转换。\n\
  \n![数据库管理界面截图，显示了一个用于创建名为\"Admins\"的表的 SQL 查询，该表包含\"id\"、\"username\"和\"password_hash\"\
  列。查询指定了数据类型和约束，其中\"id\"列使用\"SERIAL\"类型，其他列使用\"varchar(255) NOT NULL\"。一条消息显示该查询在\
  \ 104 毫秒内成功执行。界面左侧显示了包含表和模式的数据库结构。](img/523242_2_En_8_Fig1_HTML.jpg)\n\n**图 8-1**\
  \ — 使用 `Flask/create_admins_table.sql` 的内容创建用于存储管理员凭据的新表\n\n创建新表后，我们需要定义一个相应的 Python\
  \ 类来为 SQLAlchemy 创建 ORM 模型，如清单 8-1 所示。密码哈希可以使用多种算法执行，例如 MD5、SHA256、SHA512 等。然而，现代系统中最常用的算法是\
  \ Bcrypt。事实上，Bcrypt 是许多 Linux 环境中保护用户密码的默认选择。在深入了解 Bcrypt 的工作原理之前，我们首先需要理解用于使哈希更安全的方法。\n\
  \n如前所述，哈希转换数据。例如，文本\n\n```bash\nPassword123\n```\n\n使用 MD5 映射为\n\n```bash\n42f749ade7f9e195bf475f37a44cafcb\n\
  ```\n\n然而，即使对原始明文进行微小的修改，也可能导致哈希输出显著不同，如下所示：\n\n```bash\nMD5(Password1239) -> abd7fdbb048a611ea0a0937265765404\n\
  ```\n\n### 8.1.2 加盐\n\n在密码中包含额外的字节——也称为添加盐值——会产生完全不同的哈希。这在用户在不同网站重复使用密码，且其中某个网站被攻破的情况下尤其有用。通过对密码加盐，攻击者将无法判断同一密码是否在多个域名中使用，从而大大增加了破解难度。然而，如果攻击者知道盐值及其应用方式，这种方法的效果就会降低。而\
  \ Bcrypt 的突出之处在于，它引入了一种加密方法，将随机生成的盐值存储于哈希本身之中。因此，可以使用 Bcrypt 库中的抽象函数来验证某个 Bcrypt\
  \ 哈希是否由给定的明文生成，如清单 8-2 所示。\n\n```python\nimport bcrypt\n\nclass HashingService:\n\
  \    def __init__(self, bcrypt_gen_salt: int = 12):\n        self.gen_salt = bcrypt_gen_salt\n\
  \n    def hash_bcrypt(self, plain_text: bytes) -> bytes:\n        return bcrypt.hashpw(plain_text,\
  \ bcrypt.gensalt(self.gen_salt))\n\n    def check_bcrypt(self, plain_text: bytes,\
  \ hashed_password: bytes) -> bool:\n        try:\n            return bcrypt.checkpw(plain_text,\
  \ hashed_password)\n        except:\n            return False\n# 清单 8-2：Flask/Services/HashingService.py\n\
  ```\n\n```python\nfrom sqlalchemy import Column, Integer, String\nfrom .Base import\
  \ Base\n\nclass Admins(Base):\n    __tablename__ = 'admins'\n    id = Column(Integer,\
  \ primary_key=True)\n    username = Column(String)\n    password_hash = Column(String,\
  \ default=True)\n\n    def to_dict(self):\n        return {\n            'id': self.id,\n\
  \            'username': self.username,\n            'password_hash': self.password_hash\n\
  \        }\n# 清单 8-1：Flask/DataBase/Admins.py\n```\n\n\n\n## 8.2 验证用户凭证\n\n现在我们拥有了管理密码所需的服务和存储机制，可以着手重构后端，为每条路由提供身份验证支持。这意味着我们需要拦截每个发往服务器的请求，并判断其是否经过身份验证。换言之，我们需要一个独立的软件组件，位于客户端请求与访问控制器之间。后端开发人员通常将这种组件称为*中间件*。\n\
  \n身份验证过程必须检查请求中服务器可信任的特定标识符。该标识符被称为*身份验证令牌*，或简称*令牌*。令牌应由服务器签发，且必须是可验证的。\n\n令牌通常分为两类：自定义会话\
  \ ID 或 JWT。在本示例中，我们将使用 JWT，因为它们无需服务器端存储，属于无状态令牌。JWT 由三部分组成，采用 Base64 编码，并以句点分隔。第一部分包含签名算法的元数据，第二部分保存原始载荷，第三部分则是使用第一部分中指定的哈希算法对载荷创建的受密码保护的签名。该结构在*jwt.io*网站的图\
  \ 8-2 中有更详细的说明。\n\n![一张 JWT（JSON Web 令牌）调试器界面的截图。左侧面板显示了一个经过编码的 JWT，并附有“有效的 JWT”和“签名已验证”的消息。右侧面板以\
  \ JSON 格式展示了解码后的头部和载荷。头部包含算法“HS256”和类型“JWT”。载荷包含用户信息，例如“sub”的值为“1234567890”，“name”为“John\
  \ Doe”，“admin”为 true，以及带有时间戳的“iat”。界面上还提供了复制 JSON 数据的选项。](img/523242_2_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** JSON Web 令牌（JWT）内容\n\n当收到新请求时，我们将检查请求头中是否包含令牌。令牌的载荷经过签名，我们会将该签名与传入令牌中的签名进行比较。如果两者匹配，即可确认该令牌是由服务器签发的。为了增强安全性，防止攻击者窃取合法令牌，我们还将设置一个过期时间（*默认自签发起\
  \ 30 天*），过期后用户需要重新登录。由于此过程涉及多个逻辑步骤，最好将其隔离为一个专用于管理令牌的服务，如代码清单 8-3 所示。\n\n```python\n\
  from jwt import PyJWT\nfrom time import time\nfrom typing import Union\n\nclass\
  \ JWTService:\n    expires_in_seconds = 2592000\n    signing_algorithm = 'HS256'\n\
  \    \n    def __init__(self, signing_key: str, expires_in_seconds: int = 2592000):\n\
  \        self.signing_key = signing_key\n        self.expires_in_seconds = expires_in_seconds\n\
  \    \n    def generate(self,\n                 data: dict,\n                 expires_in_seconds:\
  \ int = expires_in_seconds) -> Union[str, None]:\n        try:\n            instance\
  \ = PyJWT()\n            curr_unix_epoch = int(time())\n            data['iat']\
  \ = curr_unix_epoch\n            if isinstance(expires_in_seconds, int):\n     \
  \           data['exp'] = curr_unix_epoch + expires_in_seconds\n            token\
  \ = instance.encode(\n                payload=data,\n                key=self.signing_key,\n\
  \                algorithm=self.signing_algorithm)\n            if type(token) ==\
  \ bytes:\n                token = token.decode('utf8')  # 某些版本的 PyJWT 需要此步骤\n  \
  \          return token\n        except BaseException as _:\n            return\
  \ None\n    \n    def is_valid(self, token: str, verify_time: bool = True) -> bool:\n\
  \        try:\n            payload = self.get_payload(token)\n            if payload\
  \ is None:\n                return False\n            if verify_time and 'exp' in\
  \ payload and payload['exp'] < int(time()):\n                return False\n    \
  \        return True\n        except:\n            return False\n    \n    def get_payload(self,\
  \ token: str):\n        try:\n            instance = PyJWT()\n            payload\
  \ = instance.decode(\n                jwt=token,\n                key=self.signing_key,\n\
  \                algorithms=[self.signing_algorithm])\n            return payload\n\
  \        except Exception as e:\n            return None\n```\n\n**代码清单 8-3** `Flask/Services/JWTService.py`\n\
  \n现在我们有了签发和验证令牌的方法，可以将此逻辑集成到我们的中间件类中，如代码清单 8-4 所示。该类包含一个函数，负责检查请求的路由是否需要身份验证。如果需要验证，中间件将验证提供的\
  \ JWT 是否有效。如果令牌无效或缺失，它将返回标准的 401 错误，表示*未授权*。否则，它将返回*None*，表示请求可以继续执行后端代码的下一步——在本例中，即控制器。\n\
  \n如第 8 行所示，我们指定登录和注册路由（这两者将在后面介绍）无需身份验证。这是因为成功登录后，系统会向用户签发一个令牌。注册路由同理，不过我们稍后会引入额外的保护层，以防止外部行为者在无人监管的情况下滥用创建账户。\n\
  \n```python\nfrom flask import Request\nfrom Services.JWTService import JWTService\n\
  from werkzeug import exceptions\n\nclass Middleware:\n    def __init__(self, jwt_service:\
  \ JWTService):\n        self.unauthenticated_route_names = {'/api/auth/login', '/api/auth/sing_up'}\n\
  \        self.jwt_service = jwt_service\n    \n    def auth(self, request: Request):\n\
  \        is_route_unauthenticated = request.path in self.unauthenticated_route_names\n\
  \        if is_route_unauthenticated:\n            return None\n        if 'token'\
  \ in request.headers:\n            token = request.headers['token']\n          \
  \  is_valid = self.jwt_service.is_valid(token)\n            if is_valid:\n     \
  \           return None\n            else:\n                return exceptions.Unauthorized()\n\
  \        return exceptions.Unauthorized()\n```\n\n**代码清单 8-4** `Flask/Middleware/Middleware.py`\n\
  \n最后，我们需要初始化之前创建的服务，并定义三个额外的路由，分别用于登录、注册和检查登录状态。最后一个路由是必需的，以便前端判断是否应显示登录页面。服务器的主文件应如代码清单\
  \ 8-5 所示。\n\n如清单所示，密钥和机密信息从一个外部的 YAML 文件中读取并解析。其中一个机密用于确保只有知道该机密的人才能创建新账户，如图 8-3\
  \ 和图 8-4 中使用 Postman 工具演示的那样。\n\n![一张 Postman 界面截图，显示一个 POST 请求发送至“127.0.0.1:5000/api/auth/sing_up”，JSON\
  \ 数据中包含“username”为“admin1”和“password”为“Password123”。响应体显示消息：“管理员账户创建成功”，状态码为 200\
  \ OK。](img/523242_2_En_8_Fig4_HTML.jpg)\n\n**图 8-4** 创建管理员账户，步骤 2：设置新账户的凭据\n\n![一张\
  \ Web API 测试工具界面的截图，显示一个 POST 请求发送至 URL“127.0.0.1:5000/api/auth/sing_up”。“Headers”选项卡已被选中，显示一个包含“KEY”、“VALUE”和“DESCRIPTION”列的表。列出了一个标头，键为“sing_up_key”，值为“ANOTHER\
  \ RANDOM TEXT HERE”。其他标头已隐藏，显示为“9 个隐藏”。界面包含“Params”、“Authorization”、“Body”、“Pre-request\
  \ Script”、“Tests”和“Settings”选项卡。右上角可见一个“Send”按钮。](img/523242_2_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3** 创建管理员账户，步骤 1：添加注册密钥\n\n\n\n```\nfrom flask import Flask, request\nfrom\
  \ DataBase import Employees, Admins\nfrom DataBase.Connection import session_manager\n\
  from Services import JWTService, HashingService\nfrom Middleware import Middleware\n\
  from werkzeug import exceptions\nimport yaml\napp = Flask(__name__)\nwith open(\"\
  .streamlit/secrets.toml\") as f:\nyaml_dict = yaml.safe_load(f)\nsing_up_key = yaml_dict['sing_up_key']\n\
  jwt_secret = yaml_dict['jwt_secret']\njwt_service = JWTService(jwt_secret)\nmiddleware\
  \ = Middleware(jwt_service)\nhashing_service = HashingService()\napp.before_request(lambda:\
  \ middleware.auth(request))\n@app.route('/api/employees')\ndef get_all_employees():\n\
  with session_manager() as session:\nemployees = session.query(Employees).all()\n\
