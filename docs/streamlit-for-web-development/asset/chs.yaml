  \ 的专属云服务 *Streamlit Cloud* 在远程服务器上部署应用。到本章结束时，你将掌握在局域网内以及万维网上为用户提供服务的技术知识。  \n\n\
  ## 9.1 将 Streamlit 暴露于万维网  \n\n用 Streamlit 构建应用后，你可以通过在浏览器中访问环回地址 `http://127.0.0.1:8501`\
  \ 来查看其运行情况。此外，你还可以与本地网络中的其他人和设备共享该应用，本地网络通常分配以 `192.168.*`、`172.(16-31).*` 或 `10.*`\
  \ 开头的 IP 地址。要从同一网络中的任何设备访问正在运行的 Streamlit 应用，只需在 IP 地址前加上 `http://`，并附加 `:8501`\
  \ 或 Streamlit 正在监听的端口即可。然而，如果没有从 ISP 租用静态公共 IP 或从主要提供商处租赁云服务器，就没有直接的方法可以临时向任何地方的任何人展示你的\
  \ Streamlit 应用。在本节中，我们将探索免费且易于配置的方法，让你无需额外成本即可在全球范围内展示你的应用。  \n\n### 9.1.1 通过网络网关进行端口转发\
  \  \n\n几乎每个家庭都有一个宽带设备，它充当着通往互联网的网关。然而，家庭网络和设备并不直接暴露在互联网上；相反，它们的互联网请求通过宽带设备进行路由。该设备使用\
  \ NAT（网络地址转换）将私有 IP 地址映射到公共 IP 地址。但反向操作——从互联网访问设备——默认情况下是行不通的，除非进行显式配置。大多数宽带设备都有一个内置的\
  \ Web 服务器，用于控制各种网络设置。通常，网络中的第一个 IP 地址属于宽带设备。在浏览器中输入此 IP 通常会打开一个配置页面，如图 9-1 所示。虽然不同设备的界面可能有所不同，但大多数都提供了配置\
  \ *端口转发* 或 *端口映射* 的选项。在该页面上，我们想要将一个内部 IP 和端口映射到宽带设备面向公众的某个端口上。理想情况下，我们会将 Streamlit\
  \ 的默认端口 8501 映射到 HTTP 的默认端口 80。  \n\n![“光纤网关”Web 界面的截图，显示了“端口映射配置”页面。该界面包含状态、广域网、局域网、无线局域网、安全、转发规则、网络应用和系统工具等选项卡。“端口映射配置”部分允许用户在局域网中设置虚拟服务器。选项包括启用端口映射、选择广域网名称、协议（TCP），并指定外部和内部的起始及结束端口。内部主机\
  \ IP 设置为 192.168.100.3。页面上有“新建”、“删除”、“应用”和“取消”按钮。该页面通过 192.168.100.1/index.asp 的非安全连接访问。](img/523242_2_En_9_Fig1_HTML.jpg)\
  \  \n\n图 9-1  \n宽带设备的配置网站  \n\n下一步是找出网关的公共 IP 地址。一种简单的方法是直接通过谷歌搜索，如图 9-2 所示。基本上，你访问的任何网站都能检测到你的公共\
  \ IP 并显示给你。一旦获得这个 IP，你可以将其粘贴到浏览器的地址栏中——如果一切配置正确——你将看到你的 Streamlit 应用。  \n\n![谷歌搜索结果页面截图，搜索内容为“what\
  \ is my IP”。页面显示大约 18 亿个结果，耗时 0.47 秒。下方有一个方框，显示文本“What's my IP”，以及一个部分遮挡的 IP 地址“89.XXX.XXX.173”，标注为“你的公共\
  \ IP 地址”。下方有一个链接，显示“了解关于 IP 地址的更多信息”。](img/523242_2_En_9_Fig2_HTML.jpg)  \n\n图 9-2\
  \  \n主机的公共 IP 地址  \n\n值得注意的是，公共 IP 由你的 ISP 分配，它通常会在一个 IP 地址池中为其客户轮换分配。这意味着你的公共 IP\
  \ 最终会发生变化——可能每小时一次，或者当网络重新连接时。除非你专门向 ISP 请求一个静态 IP，否则这种动态行为会持续下去。静态 IP 能确保即使你的网络暂时离线，宽带设备也始终被分配相同的\
  \ IP 地址。  \n\n\n\n### 9.1.2 使用 NGROK 进行 HTTP 隧道传输\n\n隧道传输的概念类似于在两台设备之间建立 VPN 连接，即使它们相距甚远且不在同一网络中。Ngrok\
  \ 利用隧道技术，使私有网络设备能够在短时间内（通常为两小时）被公共网络访问。它通过在其服务器上分配一个临时子域名来实现这一点，该子域名将请求转发到你的服务，并代表你将其暴露出来。简而言之，一个运行在\
  \ `http://127.0.0.1:8501` 的 Streamlit 应用可以通过一个特定的 ngrok URL 进行访问，该 URL 遵循以下格式：\n\
  \n```\nhttp://.ngrok-free.app\n```\n\n一旦 Ngrok 用户发起隧道命令，连接就会建立，并会提供 Ngrok URL。用户随后可以将此\
  \ URL 分享给任何人，以便他们在接下来的几个小时内访问其本地的 Streamlit 应用程序。在你的计算机上安装 Ngrok 后，你可以通过在 CMD 或终端中输入以下命令来运行它：\n\
  \n```\nngrok http\n```\n\n其中，`port_to_tunnel_to` 块可以替换为 `8501`，以建立隧道连接到正在运行的 Streamlit\
  \ 应用程序。清单 9-1 展示了一个简单的 Streamlit 应用程序，它使用 iframe 来显示用户的公网 IP 地址。在 CMD 中运行 ngrok\
  \ 并监听 8501 端口后，用户会看到分配的子域名，如图 9-3 所示。Ngrok 提到该子域名的位置列为美国。然而，当访问一个公网 IP 网站时，它并未显示来源是美国，如图\
  \ 9-4 所示。相反，显示的 IP 是用户来自卡塔尔的原始 IP，尽管 ngrok 的隧道是通过美国路由的。这是因为 ngrok 不是一个 VPN，而是一个网络，对页面的请求是通过\
  \ Streamlit 宿主机器路由的。\n\n![截图显示两个网页并排，标题均为\"Welcome, WWW\"，并带有标有\"IMIP\"的徽标。每个页面都显示部分隐藏的\
