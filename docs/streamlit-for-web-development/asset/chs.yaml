  \ SCADA 系统在数据记录过程中出现的错误。无论原因如何，同步时间序列数据集对于确保数据的准确分析和解读至关重要。\n\n为了解决这一问题，可以采用一种称为*动态时间规整*（DTW）的技术。DTW\
  \ 通过在需要的地方应用动态时间偏移来最大化两个数据集之间的相关性，从而同步错位的数据集。这种方法的优势在于，它能够根据需要调整时间偏移，以实现每个时间点上的最高可能相关性。此外，DTW\
  \ 还可以应用于不同长度的数据集。唯一的条件是，在执行 DTW 之前必须填充缺失值，以避免出错。\n\n在本示例中，我们将创建一个 Streamlit 应用，用于同步一个功率与电压读数的数据集，其中电压数据存在两小时的偏差。如清单\
  \ 11-7 所示，我们将定义 `power` 列作为参考数据集，用于同步目标数据集 `voltage` 列。同步函数将接收未同步的数据（如图 11-8 所示），并对目标数据的时间戳应用时间偏移，最终得到如图\
  \ 11-9 所示的同步后数据。\n\n![一张显示功率和电压两个变量在 2020 年 1 月 1 日至 1 月 2 日期间变化的时间序列 XY 散点图。图表显示两个变量的数值均有波动。界面包含上传时间序列数据集和下载同步后数据的选项。显示相关性数值为\
  \ 0.713。](img/523242_2_En_11_Fig9_HTML.jpg)\n\n图 11-9\n清单 11-7 的输出（已同步数据集）\n\n![一个显示时间序列同步数据的仪表板界面。左侧是上传时间序列数据集的部分，显示了一个名为“unsynchronized_data.csv”的文件。右侧是两个\
  \ XY 散点图。第一个图表描绘了“功率”和“电压”随时间的变化，两个变量波动显著。下方显示相关性数值为-0.831，接着是第二个数据模式相似的图表。图表的坐标轴标记为“日期时间”和“数值”。](img/523242_2_En_11_Fig8_HTML.jpg)\n\
