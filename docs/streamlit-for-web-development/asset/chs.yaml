  \ IDE\n\n### 1.2.3 下载并安装 Streamlit\n\n有多种方式可以下载并安装 Streamlit 库，在本节中，我们将介绍其中最常用的安装方式之一。\n\
  \n#### 直接 pip 安装\n\n1.  要下载并安装 Streamlit，首先请确保你处于正确的环境中，方法是在 Anaconda Prompt 中输入以下命令：\n\
  \n    ```\n    conda activate \n    ```\n\n2.  接下来，你可以通过输入以下命令来下载并安装 Streamlit：\n\
  \n    ```\n    pip install streamlit\n    ```\n\n#### 手动轮文件安装\n\n1.  确保你处于正确的环境中，方法是在\
  \ Anaconda Prompt 中输入以下命令：\n\n    ```\n    conda activate \n    ```\n\n2.  从以下地址手动下载轮安装文件：\n\
  \n    [`https://pypi.org/project/streamlit/`](https://pypi.org/project/streamlit/)\n\
  \n3.  将目录更改为轮文件所在的位置：\n\n    ```\n    cd C:/Users/.../\n    ```\n\n4.  然后通过输入以下命令安装下载的轮文件：\n\
  \n    ```\n    pip install streamlit-1.41.1-py2.py3-none-any.whl\n    ```\n\n如果安装成功，你可以继续创建脚本。为保险起见，请在此之前重启\
  \ Anaconda。\n\n#### 导入 Streamlit\n\n要将 Streamlit 导入你的 Python 脚本，请确保在你的其余代码之前包含以下代码行：\n\
  \n```\nimport streamlit as st\n```\n\n之后，任何 Streamlit 方法都可以通过在其前面加上 `st` 来调用，如下所示：\n\
  \n```\nst.write('Hello world')\n```\n\n### 1.2.4 Streamlit 控制台命令\n\n当 Streamlit\
  \ 安装完成后，Streamlit 命令行（CLI）工具也同时被安装。命令行可以帮助你运行、操作和诊断与 Streamlit 应用程序相关的问题。\n\n要获取更多帮助，请输入以下命令：\n\
  \n```\nstreamlit --help\n```\n\n要运行你的应用程序，请确保已将目录更改为你的脚本所在位置：\n\n```\ncd C:/Users/.../script\
  \ directory/\n```\n\n然后输入以下命令来运行你的脚本：\n\n```\nstreamlit run  [--script args]\n```\n\
  \n随后，你的应用程序的本地 URL 和网络 URL 将显示出来。同时，你的应用程序将自动出现在你的默认网页浏览器中。你可以使用本地 URL 在本地连接到你的应用程序，使用网络\
  \ URL 通过局域网在任何其他设备上连接。此外，你将能够看到你的 Streamlit 应用程序的控制台，如图 1-6 所示。\n\n![命令提示符窗口，显示用户导航到桌面目录并使用\
  \ Streamlit 运行 Python 脚本。命令 `streamlit run script.py` 已执行。输出表明 Streamlit 应用可在浏览器中通过本地\
  \ URL `http:/localhost:8501` 和网络 URL `http:/192.168.100.3:8501` 查看。](img/523242_2_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6\n\n运行 Streamlit 应用程序时的控制台\n\n要清除缓存，请输入以下命令：\n\n```\nstreamlit cache clear\n\
  ```\n\n要在网页浏览器中打开 Streamlit 的文档，请输入以下命令：\n\n```\nstreamlit docs\n```\n\n要显示 Streamlit\
  \ 的版本号，请输入以下命令：\n\n```\nstreamlit --version\n```\n\n#### 通过控制台配置 Streamlit\n\n你可以向\
  \ `streamlit run` 传递配置选项，以配置诸如应用程序运行端口、禁用“保存时运行”等选项。\n\n要查看完整的配置选项列表，请输入以下命令：\n\n\
  ```\nstreamlit run --help\n```\n\n你可以通过输入以下命令来查看已配置的选项列表：\n\n```\nstreamlit config\
  \ show\n```\n\n你可以通过以下四种方法之一来配置这些选项：\n\n1.  使用位于 `.streamlit/config.toml` 的全局配置文件：\n\
  \n    ```\n    [server]\n    port = 80\n    ```\n\n2.  在你的项目目录中使用每个项目的配置文件：\n\n\
  \    ```\n    C:/Users/.../.streamlit/config.toml\n    ```\n\n3.  使用 `STREAMLIT_*`\
  \ 环境变量，如下所示：\n\n    ```\n    export STREAMLIT_SERVER_PORT=80\n    ```\n\n4.  在运行脚本时使用命令行标志，如下所示：\n\
  \n    ```\n    streamlit run  --server.port 80\n    ```\n\n\n\n### 1.2.5 运行演示应用\n\
