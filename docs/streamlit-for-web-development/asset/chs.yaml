  #### 示例 1


  你可以限制 `st.number_input` 组件的输入值范围，但暂时假设你无法做到。在这种情况下，解决方案是在代码中使用 `try` 和 `except`
  块，如清单 2-5 所示，在可能出现意外问题的地方应用。在此示例中，我们尝试使用 `try` 语句执行脚本中可能出问题的部分。如果该部分因 `ZeroDivisionError`
  而失败，则通过 `except ZeroDivisionError` 语句处理，并向用户显示自定义错误消息，如图 2-7 所示。如果错误由其他问题引起，则可以使用通用的
  `except` 语句来跳过这部分代码而不执行它。


  ![一个用户界面截图，有两个输入字段，分别标记为"请输入第一个数字"和"请输入第二个数字"。第一个数字设置为 1，第二个数字设置为 0。下方一个粉红色框中显示消息："不能除以零。"](img/523242_2_En_2_Fig7_HTML.jpg)


