  \n> 图 10-6 — 构建自定义组件后生成的新文件夹\n\n## 10.4 核心组件：Extra-Streamlit-Components\n\nStreamlit\
  \ 作为一个框架，正在不断发展。然而，它可能无法始终提供生产级 Web 应用程序所需的某些定制功能。例如，应用路由、多视图的自定义 URL 或在浏览器端保存用户相关数据等功能可能不被原生支持。此外，您可能希望为应用程序提供独特的视觉风格，或添加尚未纳入\
  \ Streamlit 标准库的小部件。在组件方面，可能性是无限的。在本章中，我们将介绍 *Extra-Streamlit-Components（STX）*，这是一个包含多种复杂\
  \ Streamlit 组件和服务的开源集合。我们还将深入探讨每个子组件如何从 Streamlit 和 ReactJS 两个角度构建，希望能激发有创意的开发者构建自己独特的组件。\n\
