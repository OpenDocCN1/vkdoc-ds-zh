- "# 1. Streamlit 简介\n\n随着数据洪流及其生成速度的急剧增长，传统的计算方法越来越难以高效地交付结果。相比之下，云计算是一个强大的赋能者，有助于克服这些限制。云迁移提供了更强的可扩展性、更低的成本和更高的灵活性，使服务提供商、开发者和用户都能从中受益。\n\
  \n由于 `Python` 仍然是大多数软件开发社区首选的脚本语言，提供一个能够弥合开发者技能鸿沟的 Web 框架变得至关重要。虽然 `Flask` 和 `Django`\
  \ 等传统框架要求开发者扎实掌握 `HTML` 和 `CSS`，但 `Streamlit` 作为首个完全依赖 `Python` 的主流框架脱颖而出，将开发时间从数周大幅缩短至数小时。\n\
  \n## 1.1 为什么选择 Streamlit？\n\n将自己局限于本地计算已经是过去式，因为云计算释放了众多优势，赋予开发者对世界产生更大影响的能力。这正是新一代开发者全心全意拥抱云的原因，而向这种计算范式的快速转变也凸显了其变革潜力。在此背景下，像\
  \ `Streamlit` 这样的纯 `Python`  Web 框架变得无价，它为开发者提供了实现转型的可及桥梁，同时也成为了那些希望充分利用云计算潜力的人的有力赋能者。\n\
  \n### 1.1.1 本地计算 vs. 云端计算\n\n云正日益成为数据的代名词。哪里有海量数据，哪里就常常与云计算紧密相连。简而言之，不利用云，几乎不可能发掘大数据的价值。依靠\
  \ `Microsoft Excel` 为数据集创建过时仪表盘的日子已经一去不复返了。面对今天可用的庞大数据规模，仅靠本地计算已不再足够。\n\n话虽如此，本地计算也有其优点。原型设计通常更快，节点与服务器之间的延迟也显著更低。这就是为什么边缘计算在特定场景下仍保持关键优势。对于安全要求极高或法规严格的应用程序，本地计算可能是更好的选择。然而，除此之外，本地计算的弊端远大于其益处。维护基础设施的高昂开销，以及应对流量峰值（例如超级碗中场秀期间的流量暴增）时有限的适应性，都使得本地计算在许多现代应用中不切实际。\n\
  \n相比之下，云计算提供了经济高效的资源调配、卓越的可扩展性、高可靠性以及故障恢复能力。它可以通过两种方式进行扩展：水平扩展（使用相同资源的多个实例）和垂直扩展（使用\
  \ GPU、TPU 和高级数据库系统等定制资源）。最值得注意的是，云计算拓展了可能性，使得产品可以作为服务在网络上提供。这种向 *即服务*（aaS）模式的转变——涵盖软件即服务（SaaS）、机器学习即服务（MLaaS）等——重新定义了在线价值的交付方式。\n\
  \n这正是像 `Streamlit` 这样的框架变得无价之所在。它充当了云计算的赋能者，解决了阻碍许多开发者将其工作部署到网上的技能鸿沟。`Streamlit`\
  \ 赋能各个层次的开发者，使他们更容易将价值带到网络上，并参与到云计算驱动的软件开发未来中。\n\n\n\n### 1.1.2 云计算趋势\n\n云计算已成为现代技术的指南针，引导着学术界、企业、政府乃至情报机构，使其从本地系统迅速向云端迁移。随着传统软件难以实现增长和投资回报，各类组织越来越多地转向云服务提供商（CSP），以寻求敏捷性、成本效益及对先进计算资源的访问。甚至云服务提供商也在重新构想其产品，谷歌和微软正通过\
  \ Google G Suite 和 Microsoft Office 365 等平台，将其传统应用迁移至云端。\n\n从商业角度来看，拥抱云计算的理由比以往任何时候都更充分。颠覆性的企业已全面接纳了此前许多人所犹豫不决的事物，这使得采用云计算不再是一种选择，而是关乎生存的必要条件。缩短交付周期、可扩展性、降低资本支出以及加速创新，仅是推动这一转变的部分优势。对于云服务提供商而言，优势同样引人注目：资源池化、增强的弹性以及降低的维护成本构成了极具吸引力的价值主张。最值得一提的是，对于消费者来说，云计算已成为一种变革性的力量，堪比互联网本身。SaaS\
  \ 模式提供了无与伦比的灵活性、精细化的定价以及卓越的价值，创造了多方共赢的局面，让每个人都能从中获益。\n\n云计算的发展轨迹本已强劲，但全球疫情起到了催化剂的作用，打破了远程学习、在线考试、远程办公等领域长期存在的障碍。技术界数十年的努力未能实现的成就，竟被这一特殊事件在普及基于云的解决方案方面所达成。展望未来，云计算的采用率增长甚至可能超越最乐观的预测。如果趋势和数据可作为指引，那么方向已然明确，如图\
  \ 1-1 所示。\n\n![条形图显示了 2008 年至 2020 年公有云计算市场的增长情况。纵轴代表以十亿美元为单位的市场价值，范围从 0 到 160。横轴列出了从\
  \ 2008 年到 2020 年的年份。图表显示市场规模稳步增长，从 2008 年的 58.2 亿美元增长到 2020 年的 1592.8 亿美元。](img/523242_2_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n2008 年至 2020 年公有云计算市场的增长情况。[13]\n\n### 1.1.3 Python Web 框架的历史\n\nWeb\
  \ 开发通常需要一个具备前端、后端和服务器端开发专业知识的跨学科团队。这种需求催生了全栈开发者的兴起，他们掌握整个开发流程的知识，因此备受青睐，通常享有丰厚的薪酬。\n\
  \n从历史上看，Web 应用程序是使用 JavaScript、PHP 或 Perl 等语言开发的，而 Python 则被局限于本地脚本任务。这主要是因为 Python\
  \ 并非为 Web 开发原生设计，需要框架来与 Web 服务器和浏览器交互。然而，随着时间的推移，Python 社区引入了多个框架，使得高效的 Web 开发成为可能。得益于\
  \ Python 对简洁性、可读性的关注、其丰富的库生态系统以及开源特性，它已发展成为 Web 开发的热门选择。谷歌和 Instagram 等主要平台也采用了\
  \ Python，进一步巩固了其声誉。\n\nWeb 框架通常分为两类：全栈框架和微框架（非全栈框架）。两者都管理 Web 开发的基本方面，如通信和基础设施，但范围不同。全栈框架为处理解释请求、管理数据存储和渲染用户界面等任务提供全面、内置的解决方案，因此适用于复杂的应用程序。相比之下，微框架仅提供基本功能，例如路由\
  \ HTTP 请求、分派控制器和返回响应。开发者通常会将其与额外的 API 和工具集成来构建应用程序。下文将概述这两类框架中一些流行示例。\n\n### 1.1.4\
  \ Flask\n\nFlask 由 Armin Ronacher 于 2010 年开发，最初据称是作为愚人节玩笑诞生的。它是一个微框架，或称非全栈框架，提供了一个应用服务器，但提供的最小组件很少。Flask\
  \ 的核心围绕着两个关键工具构建：支持 HTTP 路由的 `Werkzeug`，以及用于渲染基本 HTML 页面的模板引擎 `Jinja`。此外，它还整合了用于字符串处理的\
  \ `MarkupSafe` 和用于安全数据序列化的 `ItsDangerous`，使得会话数据可以作为 Cookie 存储。\n\nFlask 是一个极简主义框架，仅配备了创建\
  \ Web 应用所必需的核心组件。这种设计赋予了开发者极大的灵活性和控制力，但也让他们承担了更多构建和管理应用程序基础设施的责任。因此，Flask 最适合静态网站，或者那些乐于自行设计基础设施和界面的经验丰富的开发者。\n\
  \n### 1.1.5 Django\n\nDjango 由一群 Web 程序员于 2003 年开发，使用 Python 构建 Web 应用程序。与 Flask\
  \ 相比，它允许开发者以更少的开销创建更复杂的应用。具体来说，Django 使得以更高的可扩展性渲染动态内容变得更加容易，并提供了通过对象关系映射（ORM）与数据库交互的内置能力。\n\
  \n此外，Django 包含了用于各种功能的广泛模块，例如电子商务、身份验证和缓存。这些预构建的包使开发者能够快速为他们的应用程序添加扩展服务。通过包含众多第三方包，Django\
  \ 允许开发者专注于其项目的核心思路，而无需处理实现的每个细节。\n\n### 1.1.6 Dash\n\nDash 是由 Plotly 开发的一个 Web 框架，用于使用\
  \ Python、R 甚至 Julia 构建企业级 Web 应用程序。虽然 Plotly 主要以其数据分析和可视化工具而闻名，但 Dash 通常用于创建交互式仪表盘。然而，凭借其广泛的定制选项，Dash\
  \ 也可用于通用目的的应用程序。\n\nDash 原生支持 D3.js 图表，并为开发者提供了默认的 HTML 和 CSS 模板。不过，要实现更定制化的界面，开发者需要具备前端编程的熟练技能。此外，Dash\
  \ 提供了一个企业级软件包，允许经验丰富的开发者在云上部署其应用程序，并附带身份验证和数据库集成等生产级功能。\n\n### 1.1.7 Web2Py\n\n\
  Web2Py 是一个 Python 的全栈 Web 框架，遵循模型-视图-控制器（MVC）架构模式，与 Django 类似。它允许开发者轻松创建动态内容，并提供与数据库系统的原生集成。Web2Py\
  \ 的独特功能之一是其内置的基于 Web 的集成开发环境（IDE），其中包含用于错误跟踪和管理的工单系统，简化了开发和调试过程。\n\n然而，Web2Py 的一个关键缺点在于，它在一个单一的全局环境中执行对象和控制器，该环境会在每次\
  \ HTTP 请求时重新初始化。虽然这种设置在某些情况下可能有益，但也可能导致性能问题，并与某些模块不兼容，尤其是在应用程序扩展时。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 1.1.8 对纯 Python Web 框架的需求\n\n以往，Python 开发者除非精通 `HTML`、`CSS` 和 `JavaScript`，否则只能将软件作为桌面应用部署在本地。虽然使用\
  \ `Tkinter` 和 `PyQt`，程序员可以创建复杂、动态且视觉上吸引人的界面，但缺点是无法在网页上渲染这些应用。许多 Python 爱好者都面临这一挑战，直到最近，他们还没有一种直接的方法仅使用\
  \ Python 就能将工作迁移到云上。\n\n浏览一个又一个由才华横溢的人开发的令人惊叹的应用仓库，最终却发现分享他们工作的唯一方式就是提供源代码，并希望其他人能在本地复现，这总是令人沮丧。更别提那些根本无法执行代码的非技术用户了。这些努力中有许多在很大程度上未被使用。简而言之，我们显然需要一个不需要高级\
  \ Web 技术知识的框架——一个能让开发者编写典型的 Python 脚本并直接将其部署到云端的工具。然后，`Streamlit` 出现了，它解放了开发者，使其不再需要\
  \ `HTML`、`CSS` 和 `JavaScript`。正如他们所说，剩下的就是历史了。\n\n### 1.1.9 学术意义\n\n能够轻松地用 Python\
  \ 直接创建 Web 应用，使得 `Streamlit` 成为学术界的一个宝贵工具 [1]。尽管它相对较新，首个测试版于 2019 年 4 月发布，但世界各地的研究团队已经开始采用该框架来展示其项目的成果。如今，许多出版物已经将\
  \ `Streamlit` 作为其可视化框架进行引用，涵盖了广泛的领域。其中一些领域包括健康 [2, 3, 4, 5]、计算机科学 [6, 7, 8, 9]、经济学\
  \ [10, 11] 和土木工程 [12] 等。\n\n## 1.2 开始使用\n\n作为高度通用且适应性强的框架，`Streamlit` 允许开发者利用各种计算资源和技术栈来使用它。即便如此，为了获得更好的易用性和可用性，我们仍建议遵循一些推荐的最佳实践。\n\
  \n### 1.2.1 技术建议\n\n虽然运行 `Streamlit` 没有一刀切的解决方案，但建议满足以下计算和系统要求（或更优配置），以确保开发和运行应用流畅。请参考表\
