  \ 9-2\n\n代码清单 9-2 中 Streamlit 应用程序的输出可以在图 9-12 中看到。\n\n![一个网页的截图，显示粗体文本\"Deployed\
  \ on Linux (posix)\"，下方有更多详细信息：\"Linux-5.15.167.4-microsoft-standard-WSL2-x86_64-with-glibc2.39\"\
  。浏览器地址栏显示\"http:/172.31.107.103:8501\"，并标注\"Not secure\"。](img/523242_2_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12\n\n代码清单 9-2 的输出，显示操作系统为 Linux\n\n要显示运行中的系统平台，可以运行代码清单 9-2 中所示的脚本。\n\n```\n\
  import os\nimport platform\nimport streamlit as st\nst.title(f'Deployed on {platform.system()}\
  \ ({os.name})') st.subheader('More details: ') st.write(f'_{platform.platform()}_')\n\
  代码清单 9-2\nmain.py\n```\n\n\n\n### 9.3.2 使用 Linux Docker 容器部署\n\n为了避免以特定方式运行 Streamlit\
  \ 应用程序的麻烦——并提高安全性——你可以使用 Docker 容器来运行它。Docker 允许你在任何操作系统环境中托管应用程序，并拥有其自身的变量、应用程序和服务，同时让你能够控制它可以访问的计算机资源。此外，如果应用程序遭到恶意攻击者入侵，只要容器配置正确，他们就不太可能突破\
  \ Docker 容器并进一步危害主机。\n\n既然我们已经了解了在容器化环境中部署服务的好处，接下来可以继续创建 Docker 的主文件，如代码清单 9-3\
  \ 所示。假设 Docker 已经安装，此文件会启动一个预装了 Python 3.8 的 Linux 环境，然后创建一个文件夹来存放你的 Streamlit/Python\
  \ 文件。接着，它会将你现有的 `requirements.txt` 文件（如代码清单 9-4 所示）复制到 Docker 的工作目录中，依赖项将在该目录下安装。一旦\
  \ Streamlit 安装完成，Docker 容器将被指示暴露端口 `8501` 以允许从容器外部访问——这是 Streamlit 的默认端口。最后，你的 Streamlit\
  \ 文件会被复制到工作目录并执行。\n\n```\nstreamlit==1.41.1 # 编写本书时的最新版本\n代码清单 9-4\nrequirements.txt\n\
  ```\n\n```\nFROM python:3.10\n# 设置工作目录\nWORKDIR /app\n# 安装依赖项\nCOPY requirements.txt\
  \ ./requirements.txt\nRUN pip install --no-cache-dir -r requirements.txt\n# 暴露 Streamlit\
  \ 端口\nEXPOSE 8501\n# 复制应用程序文件\nCOPY . /app\n# 添加一个简单的健康检查（每 30 秒尝试 curl 访问 Streamlit\
  \ 应用程序）\nHEALTHCHECK --interval=30s --timeout=10s --start-period=30s --retries=3\
  \ \\\nCMD curl -f http://localhost:8501/_stcore/health || exit 1\n# 显式入口点，绑定主机地址\n\
  ENTRYPOINT [\"streamlit\", \"run\", \"main.py\", \"--server.address=0.0.0.0\"]\n\
  代码清单 9-3\nDockerfile\n```\n\n准备好文件后，我们需要从项目中构建一个自定义的 Docker 镜像——类似于图 9-13 所示——方法是在项目的根文件夹（`Dockerfile`\
  \ 应位于此处）中运行代码清单 9-5 中的命令。\n\n![命令提示符截图展示了 Docker 构建过程。用户导航到桌面并运行命令 `docker build\
  \ -t custom_streamlit_app:latest .`。构建过程耗时 39.5 秒，使用了 Python 3.8。该过程包括加载 Dockerfile、上下文和元数据，并执行多个步骤，如设置工作目录、复制文件和安装依赖项。最终镜像命名为\
  \ `custom_streamlit_app`，大小为 1.47GB。](img/523242_2_En_9_Fig13_HTML.jpg)\n\n图 9-13\n\
  \n构建镜像并验证其存在\n\n```\ndocker build -t <镜像名称>:latest .\n代码清单 9-5\n构建 Docker 镜像\n```\n\
  \n运行镜像的方法是执行代码清单 9-6 中所示的代码；`-d` 选项用于将进程与命令行分离，类似于 Linux 中的 `disown` 命令。图 9-14 展示了进程未分离时的情形——因此它会占用同一个命令行窗口。现在，我们有一个正在运行的容器，用自己的端口覆盖了当前机器的\
  \ 8501 端口，这意味着可以通过本地主机访问 Streamlit 应用程序，如图 9-15 所示。\n\n![截图显示了网页和命令提示符。网页显示文本 \"\
  Deployed on Linux (posix)\" 以及 Linux 版本的详细信息。下方，命令提示符窗口显示 Docker 命令和输出，包括 Docker\
  \ 镜像列表和运行 Docker 容器的命令。](img/523242_2_En_9_Fig15_HTML.jpg)\n\n图 9-15\n\n从 Docker\
  \ 容器运行的 Streamlit 应用程序\n\n![命令提示符窗口显示 Docker 命令执行结果。输入了命令 `docker run -p 8501:8501\
  \ custom_streamlit_app:latest`。输出显示应用程序正在运行，并提供了用于访问 Streamlit 应用的网络和外部 URL：`http:/172.17.0.2:8501`\
  \ 和 `http:/37.186.42.154:8501`。](img/523242_2_En_9_Fig14_HTML.jpg)\n\n图 9-14\n\n\
  运行 Docker 镜像\n\n你可以通过执行代码清单 9-6 中所示的命令来运行镜像。`-d` 选项将进程与命令行分离，类似于 Linux 中的 `disown`\
  \ 命令。图 9-14 演示了进程未分离时的情况——它仍然与同一个命令行窗口绑定。现在，通过一个正在运行的容器，用其自身的端口覆盖了主机机器的 8501 端口，就可以通过本地主机访问\
  \ Streamlit 应用程序，如图 9-15 所示。\n\n```\ndocker run -d -p 8501:8501 <镜像名称>:latest\n\
  代码清单 9-6\n从 Docker 镜像创建容器\n```\n\n最后，我们可以通过运行代码清单 9-8 来销毁容器，而不会影响镜像。首先，我们需要通过运行代码清单\
  \ 9-7 来获取容器 ID，然后应用停止操作，如图 9-16 所示。\n\n![命令提示符截图显示 Docker 命令。用户使用 `docker ps` 列出正在运行的容器，显示一个\
  \ ID 为 `5f4e9a005110` 的容器正在运行自定义 Streamlit 应用。使用 `docker stop 5f4e9a005110` 停止该容器。再次运行\
  \ `docker ps` 命令，显示没有活动容器。](img/523242_2_En_9_Fig16_HTML.jpg)\n\n图 9-16\n\n检查活动容器并关闭特定容器\n\
  \n```\ndocker stop <容器 ID>\n代码清单 9-8\n停止特定的 Docker 容器\n```\n\n```\ndocker ps\n代码清单\
  \ 9-7\n显示所有正在运行的 Docker 容器元数据\n```\n\n## 9.4 部署到 Windows Server\n\n鉴于企业界对微软的偏爱，如果你要在公司服务器上部署\
  \ Streamlit 应用程序，你很有可能会使用 Windows Server。幸运的是，配置应用程序的过程简单直接。虽然本节重点介绍 Windows Server，但这些步骤同样适用于在标准\
  \ Windows 操作系统上进行部署。不过，在继续之前，我们将做一些假设：你的公司服务器位于远程位置，并且你只能访问本地内部网络，没有互联网连接。因此，需要额外的步骤来克服这些限制，这些步骤将在后续章节中说明。\n\
  \n\n\n### 9.4.1 建立远程桌面连接\n\n如前所述，你的服务器可能位于远程位置，连接它的最可能方式是通过远程桌面协议（RDP）。RDP 提供图形用户界面，让你能够通过网络连接访问远程服务器。微软的\
  \ RDP 客户端是远程桌面连接，如图 9-17 所示。要建立连接，请在`计算机`字段中输入远程服务器的 IP 地址，如有必要，在`用户名`字段中以`域名/用户名`格式追加域信息。然后，点击`连接`，系统将提示你输入密码以登录服务器。\n\
  \n![远程桌面连接窗口的截图。界面包含常规、显示、本地资源、体验和高级等标签页。在登录设置下，有“计算机”和“用户名”字段，并注明计算机名称字段为空白。底部的按钮包括“连接”、“帮助”、“保存”、“另存为”和“打开”。](img/523242_2_En_9_Fig17_HTML.jpg)\n\
  \n图 9-17\n\n建立与远程服务器的 RDP 连接\n\n由于你的远程服务器可能无法访问互联网，你可以通过在`本地资源`选项卡中选择`驱动器`复选框，使用\
  \ RDP 将文件从本地磁盘传输到服务器，如图 9-18 所示。此功能还允许你在需要时将其他本地资源（如 I/O 设备和外围设备）提供给服务器使用。\n\n![远程桌面连接设置窗口，显示本地设备和资源选项。复选框选项包括“智能卡或用于企业的\
  \ Windows Hello”、“端口”、“驱动器”、“视频捕获设备”和“其他支持的即插即用 (PnP) 设备”。“智能卡或用于企业的 Windows Hello”和“驱动器”已被勾选。底部有“确定”和“取消”按钮。](img/523242_2_En_9_Fig18_HTML.jpg)\n\
  \n图 9-18\n\n将本地资源传输到远程服务器\n\n### 9.4.2 开放 TCP/IP 端口\n\n在继续之前，请确保服务器上所有相关的入站和出站 TCP/IP\
  \ 端口均已开放，以便 Streamlit 应用程序能够在本地网络上转发：\n\n![Windows Defender 防火墙高级安全界面截图。主窗口显示一个入站规则列表，包含名称、组、配置文件、已启用状态、操作等列。一个标题为“新建入站规则向导”的对话框已打开，显示创建新规则的选项。“规则类型”步骤已高亮显示，包含程序、端口、预定义和自定义规则选项。“端口”选项被选中，表示规则用于控制\
  \ TCP 或 UDP 端口的连接。右侧面板列出了创建新规则和筛选选项等操作。](img/523242_2_En_9_Fig19_HTML.jpg)\n\n图\
  \ 9-19\n\n开放 TCP/IP 端口（1）\n\n1. 打开`具有高级安全性的 Windows Defender 防火墙`。\n2. 在左窗格中选择`入站规则`或`出站规则`。\n\
  3. 在右窗格中点击`新建规则`，打开`新建规则向导`窗口。\n4. 选择`端口`选项，然后点击下一步，如图 9-19 所示。\n\n![防火墙设置界面中“新建入站规则向导”的截图。显示“协议和端口”部分，提供将规则应用于\
  \ TCP 或 UDP 的选项。选择了 TCP。规则设置为应用于“特定本地端口”，并输入了端口号 8501。底部有“上一步”、“下一步”和“取消”导航按钮。](img/523242_2_En_9_Fig20_HTML.jpg)\n\
  \n图 9-20\n\n开放 TCP/IP 端口（2）\n\n1. 选择`TCP`，并输入你的 Streamlit 应用程序将要提供服务的端口号，例如`8501`，如图\
  \ 9-20 所示。\n\n![网络设置界面中“新建入站规则向导”的截图。“操作”步骤已高亮显示，询问当连接匹配指定条件时应采取什么操作。选项包括：“允许连接”、“如果连接是安全的则允许连接”和“阻止连接”。底部可见“下一步”按钮。](img/523242_2_En_9_Fig21_HTML.jpg)\n\
  \n图 9-21\n\n开放 TCP/IP 端口（3）\n\n1. 选择`允许连接`以向所有用户开放此端口，或者选择`如果连接是安全的则允许连接`以向特定用户开放此端口，如图\
  \ 9-21 所示。\n\n![计算机设置界面中“新建入站规则向导”窗口的截图。窗口标题为“配置文件”，询问“该规则何时应用？”并提供三个选项：“域”（用于企业域连接）、“专用”（用于专用网络位置）和“公用”（用于公用网络位置）。“域”和“专用”已被勾选。底部有“上一步”、“下一步”和“取消”导航按钮。左侧边栏列出步骤：规则类型、协议和端口、操作、配置文件及名称。](img/523242_2_En_9_Fig22_HTML.jpg)\n\
  \n图 9-22\n\n开放 TCP/IP 端口（4）\n\n1. 接下来，选择`域`和`专用`，以便向安全网络开放此端口，如图 9-22 所示。\n2. 最后，为你的规则输入一个名称，并按照相同步骤为入站和出站通信开放同一个端口。\n\
  \n### 9.4.3 Anaconda 离线包安装\n\n由于你的服务器可能无法访问互联网，你将无法像往常一样使用 Pip 安装 Python 包及其依赖项。相反，你需要按照以下步骤执行离线安装：\n\
  \n1. 在一台可以访问互联网的计算机上打开 Anaconda Prompt。\n2. 要下载所需的 Python 包及其所有相关依赖项，请键入以下命令，并指定保存该包的文件路径：\n\
  \n```\npip download -d <路径>\n```\n\n3. 下载完成后，将这些文件压缩，并使用 RDP 或任何其他可用方法将其传输到服务器。\n\
  4. 解压缩文件，然后在服务器的 Anaconda Prompt 中键入以下命令，将根目录更改为存储该包的位置：\n\n```\ncd <路径>\n```\n\n\
  5. 在 Anaconda Prompt 中输入以下命令，以启动所需包的离线安装：\n\n```\npip install <包名> -f ./ --no-index\n\
  ```\n\n\n\n### 9.4.4 将 Anaconda 添加到系统路径\n\n为了将你的 Streamlit 应用作为可执行的批处理文件运行（将在下一节中解释），你首先需要将\
  \ Anaconda 或你选择的任何其他 Python 解释器添加到 Windows 的系统路径中。请遵循以下步骤：\n\n1.  通过在 Anaconda Prompt\
  \ 中输入以下命令来确定 `Anaconda.exe` 的位置：\n\n```\nwhere anaconda\n```\n\n![一个系统环境变量编辑器窗口的截图。它显示了一个目录路径列表，包括\
  \ \"C:ProgramDataAnaconda3\" 和 \"C:ProgramDataAnaconda3Scripts\"。右侧的按钮包括新建、编辑、浏览、删除、上移、下移和编辑文本等选项。确定和取消按钮位于底部。](img/523242_2_En_9_Fig23_HTML.jpg)\n\
  \n图 9-23 将 Anaconda 添加到系统路径\n\n2.  打开 Windows 搜索栏，选择 *编辑系统环境变量*。\n3.  一旦 *系统属性*\
  \ 窗口打开，点击 *高级* 选项卡，然后选择 *环境变量*。\n4.  接着，高亮选中 *Path*，点击 *编辑* 以添加 Anaconda 的路径，如图\
  \ 9-23 所示。\n5.  如果必要的路径尚不存在，请通过输入以下两个路径来添加步骤 1 中找到的路径：\n\n```\nC:\\...\\Anaconda3\\\
  \n```\n\n和\n\n```\nC:\\...\\Anaconda3\\Scripts\\\n```\n\n6.  为了验证 Anaconda 已成功添加到系统路径，请打开\
  \ Windows 命令提示符并输入 `anaconda`。如果 Anaconda 尚未添加，将会出现错误。否则，你应该能够使用任何 Anaconda 命令，例如\
  \ `conda list`。\n\n### 9.4.5 将应用程序作为可执行批处理文件运行\n\n为了将你的 Streamlit 应用作为 Windows 服务运行（将在下一节中解释），你首先需要创建一个可执行的批处理文件。批处理文件类似于\
  \ `.exe` 文件，可以通过双击运行，就像任何其他应用程序一样。请遵循以下步骤为你的 Streamlit 应用创建一个批处理文件：\n\n1.  打开记事本或你选择的任何其他文本编辑器。\n\
  2.  在单独的行中输入以下命令：\n\n```\ncall activate \ncd \nstreamlit run \npause\n```\n\n3.\
  \  使用 `.bat` 扩展名保存文件以创建批处理文件。\n4.  运行该批处理文件以确保应用程序按预期启动。\n\n### 9.4.6 将应用程序作为持久化\
  \ Windows 服务运行\n\n为在 Windows Server 上部署做准备的最后一步是将你的 Streamlit 应用作为持久化 Windows 服务运行。虽然你仍然可以像对待任何普通\
  \ Streamlit 应用一样为其提供服务，但将其作为 Windows 服务运行具有以下几个好处：\n\n1.  你的应用程序将在后台运行，无需打开控制台。\n\
  2.  应用程序将独立于 RDP 会话，确保即使在 RDP 连接终止时也能继续运行。\n3.  你可以安排你的应用程序在 Windows 启动时或基于任何其他触发器运行。\n\
  \n为了获得一个健壮的配置，考虑使用像 NSSM (非吸吮式服务管理器) 这样的工具。NSSM 允许你将任何可执行文件（例如运行你的 Streamlit 应用的\
  \ `python.exe`）作为 Windows 服务运行。它提供了对日志记录、进程优先级和自动重启的更好控制，使你的部署更加可靠且易于管理。\n\n要将你的应用配置为持久化\
  \ Windows 服务，请遵循以下步骤：\n\n![Windows 任务计划程序界面的截图。主窗口显示了任务计划程序的概览、任务状态和活动任务。左侧面板显示任务计划程序库，右侧面板列出了创建和导入任务等操作。任务状态部分指示在过去\
  \ 24 小时内没有任务运行。界面包括刷新和访问帮助的选项。](img/523242_2_En_9_Fig24_HTML.jpg)\n\n图 9-24 将应用程序作为持久化\
  \ Windows 服务运行 (1)\n\n1.  打开 *Windows 任务计划程序*，并在右侧窗格中点击 *创建任务*，如图 9-24 所示。\n\n![任务计划程序应用程序中“创建任务”窗口的截图。“常规”选项卡是打开的，显示了“名称”、“位置”、“作者”和“描述”字段。该任务被命名为“Streamlit_application”。安全选项包括在指定用户帐户下运行任务，可以选择无论用户是否登录都运行，以及使用最高权限运行。该任务配置为适用于\
  \ Windows Vista 和 Windows Server 2008。“确定”和“取消”按钮位于底部。](img/523242_2_En_9_Fig25_HTML.jpg)\n\
  \n图 9-25 将应用程序作为持久化 Windows 服务运行 (2)\n\n2.  为任务输入一个名称，然后选择 *无论用户是否登录都运行* 和 *使用最高权限运行*\
  \ 选项，如图 9-25 所示。\n\n![标题为“新建操作”的对话框，用于设置任务。“操作”下拉菜单设置为“启动程序”。“程序/脚本”字段包含路径“C:UsersDesktopStreamlit_application.bat”。有用于添加参数和指定起始位置的可选字段。“确定”和“取消”按钮位于底部。](img/523242_2_En_9_Fig26_HTML.jpg)\n\
  \n图 9-26 将应用程序作为持久化 Windows 服务运行 (3)\n\n3.  导航到 *操作* 选项卡，从操作菜单中选择 *启动程序*，然后浏览到你为\
  \ Streamlit 应用创建的批处理文件的位置（在上一节中解释），如图 9-26 所示。\n\n![Windows 任务计划程序界面的截图。主窗口显示了一个名为“Streamlit_application”的任务的详细信息，其状态设置为“就绪”。该任务位于一台标记为“LAPTOP-T6KUT8BB”的设备上。作者列为“Mohammad\
  \ Khorasani”。安全选项指示该任务在用户帐户“Mohammad Khorasani”下运行，并设置为无论用户是否登录都运行。右侧面板显示创建任务、查看任务历史以及运行或禁用任务等操作。](img/523242_2_En_9_Fig27_HTML.jpg)\n\
  \n图 9-27 将应用程序作为持久化 Windows 服务运行 (4)\n\n4.  打开左侧窗格中的 *任务计划程序库*，在列表中选择你创建的任务，然后在右侧窗格中选择\
  \ *运行*，如图 9-27 所示。\n5.  为了验证你的 Windows 服务任务已成功配置，请终止 RDP 会话。然后，在本地网络中的另一台设备上打开浏览器，导航到你\
  \ Streamlit 应用的网络 URL，检查它是否正在运行。\n\n## 9.5 总结\n\n在本章中，我们探讨了如何通过网络网关进行端口转发，以及利用 `ngrok`\
  \ 进行 HTTP 隧道，将我们的 Streamlit 应用暴露到互联网。然后我们介绍了 Streamlit 的云平台 *Streamlit Cloud*，它简化了部署过程。借助\
  \ Streamlit Cloud，开发者只需连接他们的 GitHub 仓库，点击一下即可部署他们的应用。此外，我们学习了如何使用 Streamlit 的 *Secrets\
  \ Management* 功能，在本地和云端安全地将私有数据集成到我们的应用中。最后，我们涵盖了将应用程序部署到 Linux 容器和 Windows Server\
  \ 的过程，它们是全球大多数远程服务器的基础。至此，我们完成了 Streamlit 应用从开发到部署的整个生命周期。\n\n\n\n"
- "# 10. 构建 Streamlit 组件\n\nStreamlit 持续扩展其功能集，使开发者仅需几行代码就能获得新能力。然而，有时开发者需要自定义应用程序以满足特定用户需求。无论是修改用户界面还是提供定制化的用户体验，Streamlit\
  \ 都允许开发者根据需要创建自定义组件。此外，Streamlit 支持使用 ReactJS 构建组件，这些组件既可以作为实时 Web 服务器运行，也可以部署为生产级代码。在本章中，我们将指导你创建自定义\
  \ Streamlit 组件、将其集成到 Python 上下文中，并与更广泛的社区分享。\n\n## 10.1 Streamlit 自定义组件简介\n\n从根本上说，Streamlit\
  \ 充当后端服务器，使用 DG 向客户端浏览器提供网页更新。虽然 HTML 和 JavaScript 可以由各种 Web 框架生成，但 Streamlit 能够支持来自任何\
  \ Web 应用框架的组件。例如，ReactJS 等框架允许开发者使用 JSX 进行编码，然后将其编译为可从磁盘提供的静态文件组合。在生产环境中，强烈建议从磁盘提供静态文件，如图\
  \ 10-1 所示。不过，Streamlit 也支持本地托管的组件。这里需要权衡的是，当组件被导入到 Streamlit 应用中时，其行为可能会有所不同。例如，如果你从自定义组件中打印当前\
  \ URL，它不会反映 Streamlit 应用所托管的同一 URL。\n\n![图示展示了网络基础设施的流程图。左侧是客户端，显示了一个 URL 和两个原生组件。中心是一个标有“Streamlit\
  \ 服务器”的云图，代表服务器端和网络基础设施。箭头将服务器连接到客户端和右侧，右侧显示了服务器磁盘上的三个自定义组件 (X, Y, Z)。](img/523242_2_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1 自定义组件如何通过 Streamlit 提供服务\n\n## 10.2 使用 ReactJS 创建 Streamlit 自定义组件\n\n在本节中，我们将演示如何创建一个基于\
  \ ReactJS 的组件，用于 Streamlit。此外，我们还将展示如何促进 Streamlit 与组件之间的双向数据共享。此功能可用于发送初始值、触发用户操作，甚至将样式主题和颜色传递给自定义组件。\n\
  \n### 10.2.1 制作 ReactJS 组件\n\n首先，你需要从 *NodeJS.org* 安装 Node.js 和 npm。之后，我们将使用 Streamlit\
  \ 的官方 GitHub 模板来创建自定义组件。在本小节中，我们将逐步讲解构建 ReactJS 组件的过程。在此示例中，我们将使用 ReactJS 创建一个评分星形小部件，如图\
  \ 10-2 所示。ReactJS 开发者社区远大于其他框架，因此在此生态系统中创建组件是一项有价值的投入。\n\n![显示五颗星，其中四颗完全填充为黄色，第五颗星部分填充，表示四星半的评分。](img/523242_2_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2 Material UI 的交互式评分星形视图\n\n通过将 `component-template/template/my_component`\
  \ 的内容复制到我们的工作目录中，我们将设置一个 ReactJS 应用，其单个文件模块位于 `src/MyComponent.tsx`。这是我们为创建评分星形组件需要修改的文件。对此文件所做的更改将生成如代码清单\
  \ 10-1 所示的代码。\n\n```tsx\nimport {\nStreamlit,\nStreamlitComponentBase,\nwithStreamlitConnection,\n\
  }  from 'streamlit-component-lib'\nimport React, { ReactNode } from 'react'\ninterface\
  \ State {}\nclass MyComponent extends StreamlitComponentBase {\npublic state = {}\n\
  public render = (): ReactNode => {\nreturn (\n\n)\n}\n}\nexport default withStreamlitConnection(MyComponent)\n\
  ```\n\n代码清单 10-1 `stars_demo/rating_stars/frontend/src/CleanedTemplate.tsx`\n\n\
  使用以下命令安装 Material UI 库：\n\n```bash\nnpm i @mui/material\n```\n\n然后运行以下命令安装 `package.json`\
  \ 文件中的其他包：\n\n```bash\nnpm i\n```\n\n运行这两个命令后，请确保将 `package.json` 中的名称更改为你的组件在 Streamlit\
  \ 中的引用名称，如代码清单 10-2 所示。\n\n```json\n{\n\"name\": \"rating_star\",\n\"version\":\
  \ \"0.1.0\",\n\"private\": true,\n\"dependencies\": {\n\"@mui/material\": \"ˆ5.0.6\"\
  ,\n...\n},\n\"scripts\": ...,\n\"eslintConfig\": ...,\n\"browserslist\": ...,\n\"\
  homepage\": \". \"\n}\n```\n\n代码清单 10-2 更新后的 `package.json`\n\n在拥有必要的包并具备 JavaScript/TypeScript\
  \ 基础知识（或者稍微谷歌一下）后，我们就可以开始创建第一个用作 Streamlit 自定义组件的 ReactJS 模块了。我们将修改代码清单 10-1 以显示评分星形，如\
  \ Material UI 网站上所述。最终结果将是代码清单 10-3 所示的内容，该文件应位于 `frontend/src/` 中。另外，别忘了更新文件以在\
  \ `index.tsx` 中运行。\n\n```tsx\nimport {\nStreamlit,\nStreamlitComponentBase,\nwithStreamlitConnection,\n\
  }  from 'streamlit-component-lib'\nimport React, { ReactNode } from 'react'\nimport\
  \ { Rating } from '@mui/material';\ninterface State {}\nclass RatingStar extends\
  \ StreamlitComponentBase {\npublic state = {}\npublic render = (): ReactNode =>\
  \ {\nreturn (\n\n)\n}\n}\nexport default withStreamlitConnection(RatingStar)\n```\n\
  \n代码清单 10-3 `RatingStar.tsx` 的初始版本\n\n\n\n### 10.2.2 在 Streamlit 中使用 ReactJS 组件\n\
  \n要准备 React 应用，请运行以下命令。如果出现关于缺失软件包的错误，请使用之前提供的命令安装它们。\n\n```\nnpm start\n```\n\n\
  现在，在 Streamlit 这边，我们将通过使用 Streamlit 用于引入外部组件的 API，将正在运行的 ReactJS 应用作为一个组件集成进来。在此之前，我们需要填充\
  \ `__init__.py` 文件，如代码清单 10-4 所示。\n\n```\nimport os\nimport streamlit.components.v1\
  \ as components\nIS_RELEASE = False\nif IS_RELEASE:\nabsolute_path = os.path.dirname(os.path.abspath(__file__))\n\
  build_path = os.path.join(absolute_path, 'frontend/build')\n_component_func = components.declare_component('rating_stars',\
  \ path=build_path)\nelse:\n_component_func = components.declare_component('rating_stars',\
  \ url='http://localhost:3001')\ndef rating_stars():\n_component_func()\n代码清单 10-4\n\
  __init__.py 的初始版本\n```\n\n前面的代码片段使用了一个在本地 `3001` 端口上运行的实时组件，在本例中，这个组件指的是 ReactJS\
  \ 应用。然后它暴露了一个供任何其他 Python 源码使用的函数，使其能够作为一个 Streamlit 模块运行。使用 Streamlit 的 CLI 工具运行代码清单\
  \ 10-5 将产生如图 10-3 所示的输出。\n\n![文字显示 \"Rating stars demo!\"，后面跟着一行五颗星，前两颗星填充为黄色，其余三颗星为灰色轮廓，表示\
  \ 2 星评价（满分 5 星）。](img/523242_2_En_10_Fig3_HTML.jpg)\n\n图 10-3\n\n第一个自定义组件！\n\n```\n\
  import streamlit as st\nfrom rating_stars import rating_stars\nst.title('Rating\
  \ stars demo! ')\nrating_stars()\n代码清单 10-5\nmain.py 的初始版本\n```\n\n完成上述操作后，我们成功地在\
  \ Streamlit 环境中展示了一个实时的 ReactJS 应用。然而，随着我们更具创意并开发更多的自定义组件，在启动 Streamlit 应用之前，导航到每个组件的文件夹并将其作为\
  \ ReactJS 应用运行可能会变得很繁琐。这种方法也可能导致端口耗尽，因为每个自定义组件都需要自己唯一的本地 URL。为了克服这一点，我们可以在开发完成后通过运行以下命令将\
  \ ReactJS 应用构建成静态文件：\n\n```\nnpm run build\n```\n\n一旦你运行了 `build` 命令，一个名为 `build`\
  \ 的新文件夹将会出现在 `frontend` 文件夹内。该文件夹将包含 Streamlit 将组件加载到应用程序所需的 JavaScript、CSS 和 HTML\
  \ 文件。构建好组件的静态版本后，你需要将 `IS_RELEASE` 设置为 `True`，这将指示 Streamlit 从 `frontend/build/`\
  \ 文件夹加载自定义组件。此过程如图 10-1 所示。\n\n### 10.2.3 将数据发送到自定义组件\n\n至此，我们可以在 Streamlit 上下文中显示\
  \ ReactJS 应用了，不过前端和后端之间还没有通信机制。在下一节中，我们将演示如何将动态数据从 Streamlit 发送到 ReactJS，从而能够在每次重新渲染时传输信息。这将允许\
  \ Streamlit 在应用更新时将数据发送到 ReactJS 应用。\n\n为了增强我们的星级评定自定义组件的功能，我们将添加对设置总星数和已选星数的支持，所有这些都通过\
  \ Streamlit 的 Python 代码来实现。首先，理解 Streamlit 将从 Python 传递的参数（通过 `_component_func`）转换为\
  \ ReactJS 中的属性这一点非常重要。因此，我们的目标是重构组件的 `__init__.py` 文件以接受这些新参数，如代码清单 10-6 所示，然后在\
  \ `RatingStar.tsx` 中读取它们，并将它们赋值给视图的属性，如代码清单 10-7 所示。\n\n```\nimport {\nStreamlit,\n\
  StreamlitComponentBase,\nwithStreamlitConnection,\n}  from 'streamlit-component-lib'\n\
  import React, { ReactNode } from 'react'\nimport { Rating } from '@mui/material'\n\
  interface State {}\nclass RatingStar extends StreamlitComponentBase {\npublic state\
  \ = {}\npublic render = (): ReactNode => {\nconst {selected, stars_count} = this.props.args\n\
  return \n}\n}\nexport default withStreamlitConnection(RatingStar)\n代码清单 10-7\nRatingStar.tsx\
  \ 的第二个版本\n```\n\n```\nimport os\nimport streamlit.components.v1 as components\n\
  IS_RELEASE = False\nif IS_RELEASE:\nabsolute_path = os.path.dirname(os.path.abspath(__file__))\n\
  build_path = os.path.join(absolute_path, 'frontend/build')\n_component_func = components.declare_component('rating_stars',\
  \ path=build_path)\nelse:\n_component_func = components.declare_component('rating_stars',\
  \ url='http://localhost:3001')\ndef rating_stars(stars_count: int, selected: int):\n\
  _component_func(stars_count=stars_count, selected=selected)\n代码清单 10-6\n__init__.py\
  \ 的第二个版本\n```\n\n为了应用此更新，我们将创建一个 Streamlit 应用，如代码清单 10-8 所示，该应用并排展示了原生组件和自定义组件。图\
  \ 10-4 展示了我们新创建的可配置组件与 Streamlit 提供的默认组件之间的无缝集成。\n\n![图片显示 \"Rating stars demo\"\
  \ 以及两个水平滑块。第一个滑块标注为“总星数”，设置为 10（共 20）。第二个滑块标注为“已选星数”，设置为 7（共 10）。滑块下方是 7/10 星评级的可视化表示，其中\
  \ 7 颗星填充为黄色，3 颗星未填充。](img/523242_2_En_10_Fig4_HTML.jpg)\n\n图 10-4\n\n使用原生组件和自定义组件\n\
  \n```\nimport streamlit as st\nfrom rating_stars import rating_stars\nst.title('Rating\
  \ stars demo! ')\ntotal_stars = st.slider(label='Total Stars', min_value=0, max_value=20,\
  \ value=10, step=1) selected_stars = st.slider(label='Selected Stars', min_value=0,\
  \ max_value=total_stars, step=1) rating_stars(total_stars, selected_stars)\n代码清单\
  \ 10-8\nmain.py 的第二个版本\n```\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您的要求，将给定的英文文本翻译成中文。\n\n\n\
  ### 10.2.4 从自定义组件接收数据\n\n在尝试使用滑块来配置我们的自定义评分组件后，很明显，Streamlit 应用程序的视图会变得杂乱，因为多了仅用于控制另一个视图行为的小组件。理想情况下，用户只需悬停并点击星星，就能设置选中的星星数量。然而，要实现这一点，Streamlit\
  \ 应用程序需要知道选中的值——而这正是从自定义组件检索数据发挥作用的地方。\n\nStreamlit 不仅提供了嵌入 ReactJS 应用程序的 API，还实现了\
  \ Streamlit 与这些组件之间的双向通信。将数据从 ReactJS 发送回 Streamlit 可以使用组件模板的 `package.json` 中已经包含的一个库来实现。虽然这个库提供了几种特定于\
  \ ReactJS 的操作，但我们将重点介绍 `Streamlit.setComponentValue` 函数。此函数允许我们根据传递给它的参数，在 Streamlit\
  \ Python 上下文中设置组件的返回值。\n\n为了实现这一点，我们将在 ReactJS 的评分组件回调中添加函数调用，如清单 10-9 所示。然后，我们将相应地更新\
  \ `__init__.py` 文件，将返回值传播回正在运行的 Streamlit 脚本，如清单 10-10 所示。\n\n```\nimport os\nimport\
  \ streamlit.components.v1 as components\n\nIS_RELEASE = False\n\nif IS_RELEASE:\n\
  \    absolute_path = os.path.dirname(os.path.abspath(__file__))\n    build_path\
  \ = os.path.join(absolute_path, 'frontend/build')\n    _component_func = components.declare_component('rating_stars',\
  \ path=build_path)\nelse:\n    _component_func = components.declare_component('rating_stars',\
  \ url='http://localhost:3001')\n\ndef rating_stars(stars_count: int):\n    stars_selected\
  \ = _component_func(stars_count=stars_count)\n    if stars_selected is None:\n \
  \       stars_selected = 0\n    return stars_selected\n```\n\n清单 10-10：`__init__.py`\
  \ 的最终版本\n\n```\nimport { Streamlit, StreamlitComponentBase, withStreamlitConnection\
  \ } from 'streamlit-component-lib'\nimport React, { ReactNode } from 'react'\nimport\
  \ { Rating } from '@mui/material'\n\ninterface State {}\n\nclass RatingStar extends\
  \ StreamlitComponentBase<State> {\n    public state = {}\n\n    public render =\
  \ (): ReactNode => {\n        const { selected, stars_count } = this.props.args\n\
  \        return (\n            <Rating\n                name=\"rating-stars\"\n\
  \                value={selected}\n                max={stars_count}\n         \
  \       onChange={(event, newValue) => {\n                    Streamlit.setComponentValue(newValue)\n\
  \                }}\n            />\n        )\n    }\n}\n\nexport default withStreamlitConnection(RatingStar)\n\
  ```\n\n清单 10-9：`RatingStar.tsx` 的最终版本\n\n在我们主要的 Streamlit 文件中，我们移除了用于选择星星数量的滑块，并用我们自定义组件的输出替换它。最后，我们在应用程序上显示选中的星星数量，如清单\
  \ 10-11 所示，输出结果如图 10-5 所示。\n\n![一张显示“评分星星演示”的图片。图中有一个标签为“总星星数”、范围从 0 到 20 的水平条。该条从\
  \ 0 到 15 部分填充为红色，其余部分为浅蓝色。下方有 13 颗黄色星星和 2 颗灰色星星，表示在 15 颗星中选择了 13 颗。下面的文字显示为“已选择\
  \ 13 颗星”。](img/523242_2_En_10_Fig5_HTML.jpg)\n\n图 10-5：与自定义 Streamlit 组件来回通信的结果\n\
  \n```\nimport streamlit as st\nfrom rating_stars import rating_stars\n\nst.title('Rating\
  \ stars demo!')\ntotal_stars = st.slider(label='Total Stars', min_value=0, max_value=20,\
  \ value=10, step=1)\nselected_stars = rating_stars(total_stars)\nst.write(str(selected_stars)\
  \ + ' star(s) have been selected')\n```\n\n清单 10-11：`main.py`，要运行的 Streamlit 文件\n\
  \n## 10.3 将组件作为 Pip 包发布\n\n一旦您创建了第一个自定义组件，您很可能会像许多开发者一样，希望与朋友分享或将其贡献给开源社区。仅仅发送源代码的\
  \ zip 文件或将组件上传到像 GitHub 这样的版本控制服务，可能不是触及大量开发者的最可扩展的解决方案。这种方法会给其他人带来不必要的运行和设置负担。\n\
  \n一种对开发者更友好、更专业的共享 Python 包的方法是将其压缩成 pip wheel 格式。这种格式可以很容易地通过运行以下命令安装到 Python 解释器中：\n\
  \n```\npip install .whl\n```\n\n继续本章的示例，我们不需要安装任何额外的包来实现这一点，因为 Python 原生支持 wheel\
  \ 构建。目标是将 `rating_stars/` 文件夹打包成一个文件，然后该文件可以像本地包一样被安装并从任何脚本中引用。\n\n构建 pip 文件只需运行以下命令：\n\
  \n```\npython setup.py sdist bdist_wheel\n```\n\n在创建 pip wheel 之前，请确保自定义组件的 ReactJS\
  \ 部分已经构建好，因为它不会在用户端实时运行。相反，它应该为新的组件提供无缝的即插即用体验。为此，请导航到 `rating_stars/frontend/`\
  \ 目录并运行：\n\n```\nnpm run build\n```\n\n然而，wheel 构建器需要额外的信息，例如要打包的确切文件夹和其他元数据，包括版本号和描述。无需明确指定要打包的文件夹，因为\
  \ Python 会自动查找当前目录中的所有 Python 包。一个文件夹要被识别为 Python 包，它必须包含一个 `__init__.py` 文件，我们已经有了。但是，默认情况下，wheel\
  \ 构建器不会包含非 Python 文件和文件夹，除非它们包含至少一个 Python 文件。在我们的案例中，这成为了一个问题，因为我们的组件依赖于 `ReactJS\
  \ build` 文件夹，其中包含必要的静态 Web 文件。为了解决这个问题，我们需要在项目的根目录中添加一个新文件，如清单 10-12 所示。这将确保包含 `build`\
  \ 文件夹及其内容。\n\n```\nrecursive-include rating_stars/frontend/build *\n```\n\n清单 10-12：`MANIFEST.in`\n\
