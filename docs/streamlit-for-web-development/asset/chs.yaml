  ### 2.1.2 引入条件流程


  可能需要在 Streamlit 应用中引入条件流程，即某些操作依赖于先前的操作或组件的状态。这对于引导用户正确填写表单并按预期使用应用特别有用。如果没有条件流程，用户若错误地与应用交互，您的应用可能会遇到错误。


  #### 示例 1


  ```python

  import streamlit as st

  # 显示姓名的函数

  def display_name(name):

  st.info(f''**姓名：** {name}'')

  # 姓名输入

  name = st.text_input(''请输入您的姓名'')

  # 验证：如果输入了姓名，则显示信息；否则，显示错误消息

  if name:

  display_name(name)

  else:

  st.error(''未输入姓名'')

  代码清单 2-2

  conditional_flow_1.py

  ```


  在代码清单 2-2 中，我们使用一个 `if` 语句来检查姓名字段是否已填写。如果该字段为空，用户将看到一条错误消息（图 2-3）。如果该字段不为空，则调用一个函数来显示用户的输入（图
  2-4）。


  #### 示例 2


  ```python

  import streamlit as st

  # 显示姓名的函数

  def display_name(name):

  st.info(f''**姓名：** {name}'')

  # 姓名输入

  name = st.text_input(''请输入您的姓名'')

  # 检查是否输入了姓名

  if not name:

  st.error(''未输入姓名'')

  else:

  display_name(name)

  代码清单 2-3

  conditional_flow_2.py

  ```


  在代码清单 2-3 中，我们同样使用一个 `if` 语句来检查姓名字段是否不为空。这里的区别在于，如果字段为空，我们使用 `st.stop` 命令来停止脚本的执行。如果字段不为空，脚本继续执行，显示输入的姓名。这种方法的好处是它消除了对额外
  `if` 语句的需求，简化了脚本。就功能而言，这两种方法本质上是相同的。


