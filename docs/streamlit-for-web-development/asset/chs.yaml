  ## 11.3 数据管理与机器学习应用


  毫无疑问，基于 Python 的 Web 应用最常见的用例之一就是数据管理和机器学习。这正是 Streamlit 大放异彩的领域。凭借其丰富的用于数据整理和可视化的组件库，Streamlit
  使开发者能够轻松创建强大的数据分析应用。


  ### 11.3.1 数据仓库应用


  在本节中，我们将概述构建数据仓库应用的基本组件。虽然*仓库化*通常指数据的结构化存储，但在这里，我们将利用 Streamlit 提供一个丰富的图形界面来管理数据库和数据表。用户将能够在单个应用中创建、读取、更新和删除数据，并按需可视化存储的数据。使用此工具，用户可以连接到本地或远程的
  SQL 数据库，无需编写 SQL 查询或任何代码即可管理数据。


