  \n\n\n## 6.5 多线程与多进程请求\n\n当应用程序扩展时，或当其初始需求涉及大量独立计算或处理过程时，无论是在后端 Flask 端还是 Streamlit\
  \ 端，都会浪费大量算力。这是因为现代 CPU 的完整性能并未得到充分利用。现代 CPU 的强大之处不在于更快的时钟频率，而在于拥有更多核心。默认情况下，Streamlit\
  \ 和 Flask 都是单线程、单进程的应用程序。为了加速它们，我们可以利用*多进程*和*多线程*技术，从而实现真正的并行化。开发者可以控制使用这两种技术来多次运行某个函数，使其能被\
  \ CPU 并行执行。清单 6-9 展示了在 Streamlit 中使用这两种方法的示例，如图 6-5 所示。\n\n```\nimport streamlit\
  \ as st\nfrom multiprocessing import Pool, cpu_count\nimport threading\nimport time\n\
  def func(iterations, id):\ni = 0\nfor i in range(iterations):\ni += 1\nprint('Finished\
  \ job id =', id)\nif __name__ == '__main__':\npool = Pool(cpu_count())\nst.title('Speed\
  \ You Code! ')\njobs_count = 5\niterations = 10 ** 3\nc1, c2 = st.columns(2)\nwith\
  \ c1:\nif st.button('multiprocess'):\ninputs = [(iterations, i) for i in range(jobs_count)]\n\
  t11 = time.time()\npool.starmap(func, inputs)\nt21 = time.time()\nst.write(f'Finished\
  \ after {t21 - t11} seconds')\nwith c2:\nif st.button('multithread'):\nthreads =\
  \ [threading.Thread(target=func, args=(iterations, i)) for i in range(10)]\nt12\
  \ = time.time()\nfor thread in threads:\nthread.start()\nfor thread in threads:\n\
  thread.join()\nt22 = time.time()\nst.write(f'Finished after {t22 - t12} seconds')\n\
  Listing 6-9\nstreamlit_main.py\n```\n\n![页面顶部显示文字 \"Speed You Code!\"，下方是两个分别标有\
  \ \"multiprocess\" 和 \"multithread\" 的按钮，底部显示文字 \"Finished after 0.04653143882751465\
  \ seconds\"](img/523242_2_En_6_Fig5_HTML.jpg)\n\n**图 6-5** 清单 6-9 的输出\n\n注意在清单 6-9\
  \ 中，首先执行的代码在第 13 行之后，这对于整个示例无错运行至关重要。这确保了 Streamlit 知道该代码块只应执行一次，这意味着在重新运行时处理池不会被再次初始化。Flask\
  \ 应用程序也应采取类似的预防措施。\n\n多进程和多线程的主要区别在于，多线程重用现有的内存空间，在同一进程中生成新线程，这比生成全新进程（会增加 CPU 上下文切换的开销）更快。相比之下，多进程池中的每个新进程都需要独立的内存空间。此外，每个进程的输入都需要被复制或克隆，这会增加内存消耗。虽然多线程看起来是更优的选择，但事实并非总是如此。多进程在处理繁重任务时\
  \ CPU 效率更高，因为 CPU 调度程序会为这些进程分配更多时间。图 6-6 显示了在清单 6-9 中执行时间与任务迭代次数（以 10 倍递增）之间的相关性。\n\
  \n![图表显示了多进程和多线程的执行时间（秒）与迭代次数（10^x）的关系。红线代表多进程，蓝线代表多线程。两条线开始时执行时间都很低，但多线程在 7 次迭代后急剧上升，超过了多进程。](img/523242_2_En_6_Fig6_HTML.jpg)\n\
  \n**图 6-6** 随着迭代次数增加，五个任务的多进程与多线程对比\n\n## 6.6 将 Streamlit 连接到后端服务器\n\n一旦我们通过多进程和/或多线程优化了后端服务器，就可以将\
