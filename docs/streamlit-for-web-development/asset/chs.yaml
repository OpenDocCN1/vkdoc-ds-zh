  ## 11.2 时间序列应用


  时间序列数据是最常用的数据形式之一，因为它通常按时间、日期或两者共同索引。例如，来自恒温器的温度读数或 SCADA 系统的信号。然而，时间序列数据集也带来了一系列独特的挑战，例如如何有效地进行数据过滤、聚合和可视化。幸运的是，Streamlit
  提供了相应的工具，可以轻松构建满足这些需求的应用程序，使开发者能够创建处理时间序列数据的强大解决方案，具体示例如下节所示。




  ### 11.2.1 日期时间筛选应用


  基于时间范围筛选数据几乎是每个数据科学应用中的常见功能。通常，你只需要数据的一个子集，这可以通过选择前导或后置的日期时间对数据集进行截取来轻松实现。然而，时间戳的格式往往多种多样，有时日期和时间会被拆分到不同的列中，这使得创建通用的解决方案颇具挑战。


  在本例中，我们将为一种最常用的日期时间格式（`DD/MM/YYYY HH:MM`）构建一个筛选器，其中第一列为日期，第二列为任意测量值。我们将使用 Streamlit
  的 `st.slider`，允许用户截取时间序列数据的前端和后端。筛选后的数据将使用 Plotly 折线图进行可视化，如代码清单 11-5 和图 11-6 所示。只需调整代码中的时间戳格式，此应用即可适配其他日期时间格式。


