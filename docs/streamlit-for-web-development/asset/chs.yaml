  图 7-3\n两个具有不同会话 ID 的不同浏览器窗口\n\n```\nimport streamlit as st\nimport uuid\n# 检查会话\
  \ ID 是否已存在，如果不存在，则创建一个\nif 'session_id' not in st.session_state:\nst.session_state.session_id\
  \ = str(uuid.uuid4())\n# 访问并显示会话 ID\nst.title('您的会话 ID 是：')\nst.subheader(st.session_state.session_id)\n\
  清单 7-4\nsession_id_demo.py\n```\n\n\n\n## 7.3 用户洞察\n\n记录用户与 Web 应用程序的交互能力往往至关重要。开发者和产品负责人需要获取详细且准确的数据——例如有多少用户正在访问网站、访问时间以及用户如何与之互动——以便更好地定制和改进其产品或服务。假设一个经过精心开发的电子商务\
  \ Web 应用，却无法将潜在客户转化为实际销售，而原因尚不明确。可能是界面或后端存在隐藏的漏洞，阻碍了用户操作；也可能是服务器过载，无法处理传入的流量。无论是哪种情况，准确定位问题出在哪个环节都至关重要——而这就是用户洞察变得极具价值的原因。\n\
  \n虽然 Google Analytics 在服务器层面提供了强大的洞察能力——包括访问次数、用户人口统计特征以及在不同页面上的停留时间——但它无法有效捕捉应用程序层面的交互。因此，开发者必须自行实现方法来跟踪应用内的用户行为。如清单\
  \ 7-5 所示，一种简单的方法是在用户与特定代码部分交互时（例如，点击按钮或上传数据集，如图 7-4 所示）记录一个时间戳，并将这些数据存储在 PostgreSQL\
  \ 数据库中，如图 7-5 所示。同样，也可以记录上传数据集中的行数。每个数据点都存储在表中单独的列中，主键是会话的唯一 ID。当应用程序重新启动时，会创建一个具有新会话\
  \ ID 的新行。通过使用提供的更新函数，你可以在程序的任何步骤捕获并记录任何值。\n\n![pgAdmin 4 界面截图，显示了一个数据库查询。左侧面板列出了服务器、数据库、模式等数据库元素。主面板的查询编辑器中显示了一条\
  \ SQL 查询语句：\"SELECT * FROM public.user_insights\"。下方的数据输出部分显示了一个表，包含列：session_id、step_1、step_2\
  \ 和 no_rows，以及示例数据。](img/523242_2_En_7_Fig5_HTML.jpg)\n\n图 7-5\n\n清单 7-5 对应的 PostgreSQL\
  \ 数据库\n\n![一个标题为“Hello world”的网页界面截图，包含两个步骤。步骤 1 有一个标记为“Click”的按钮。步骤 2 涉及上传数据，有一个拖放区域和一个“浏览文件”按钮，允许上传最大\
  \ 200MB 的文件。下方列出了名为“Book1.csv”的文件，显示了一个包含列：Name、DOB、ID 和 Score 的表格。该表格包含三个条目：John\
  \ Smith、Rebecca Briggs 和 Sarah Watkins，以及各自的出生日期、ID 和分数。](img/523242_2_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\n清单 7-6 的输出\n\n```\nupdate_row(column, new_value, session_id, mutable,\
  \ engine)\n```\n\n请注意，通过将`mutable`参数设置为`True`，可以多次覆盖写入洞察数据；如果你只想在首次生成值时记录该值，则将其设置为`False`。\n\
  \n```\nimport streamlit as st\nimport uuid\nfrom datetime import datetime\nimport\
  \ pandas as pd\nimport psycopg2\nfrom sqlalchemy import create_engine, text\ndef\
  \ get_session_id():\nif 'session_id' not in st.session_state:\nsession_id = str(uuid.uuid4()).replace('-',\
  \ '_')\nst.session_state.session_id = '_id_' + session_id\nreturn st.session_state.session_id\n\
  def insert_row(session_id, engine):\nwith engine.connect() as conn:\nresult = conn.execute(text(f'SELECT\
  \ session_id FROM user_insights WHERE session_id = \"{session_id}\"')).fetchone()\n\
  if result is None:\nconn.execute(text(f'INSERT INTO user_insights (session_id) VALUES\
  \ (\"{session_id}\")'))\nconn.commit()\ndef update_row(column, new_value, session_id,\
  \ mutable, engine):\nwith engine.connect() as conn:\nif mutable:\nconn.execute(text(f'UPDATE\
  \ user_insights SET {column} = \"{new_value}\" WHERE session_id = \"{session_id}\"\
  '))\nconn.commit()\nelse:\nresult = conn.execute(text(f'SELECT {column} FROM user_insights\
  \ WHERE session_id = \"{session_id}\"')).fetchone()\nif result and result[0] is\
  \ None:\nconn.execute(text(f'UPDATE user_insights SET {column} = \"{new_value}\"\
  \ WHERE session_id = \"{session_id}\"'))\nconn.commit()\nif __name__ == '__main__':\n\
  engine = create_engine('postgresql://:@localhost:/')\nsession_id = get_session_id()\n\
  with engine.connect() as conn:\nconn.execute(text('CREATE TABLE IF NOT EXISTS user_insights\
  \ (session_id text, step_1 text, step_2 text, no_rows bigint)'))\nconn.commit()\n\
  insert_row(session_id, engine)\nst.title('Hello world')\nst.subheader('Step 1')\n\
  if st.button('Click'):\nst.write('Some content')\nupdate_row('step_1', datetime.now().strftime('%H:%M:%S\
  \ %d/%m/%Y'), session_id, True, engine)\nst.subheader('Step 2')\nfile = st.file_uploader('Upload\
  \ data')\nif file is not None:\ndf = pd.read_csv(file)\nst.write(df)\nupdate_row('step_2',\
  \ datetime.now().strftime('%H:%M:%S %d/%m/%Y'), session_id, False, engine)\nupdate_row('no_rows',\
  \ len(df), session_id, True, engine)\nListing 7-5\nrecord_user_insights.py\n```\n\
  \n\n\n### 7.3.1 可视化用户洞察\n\n既然我们已经确定了如何从 Streamlit 应用程序中捕获洞察并将其存储在 PostgreSQL 数据库中，下一步就是按需将数据可视化。首先，我们可以使用代码清单\
