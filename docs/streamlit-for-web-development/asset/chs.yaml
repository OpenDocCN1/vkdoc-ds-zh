  \ IP 地址的链接。](img/523242_2_En_5_Fig12_HTML.jpg)\n\n图 5-12\n\n为数据库创建用户凭证\n\n![“添加\
  \ IP 访问列表条目”界面截图。界面包含添加当前 IP 地址或允许来自任何位置的访问选项。“访问列表条目”字段显示“0.0.0.0/0”，下方有一个可选的注释字段。一个开关指示该条目为临时条目，并将在\
