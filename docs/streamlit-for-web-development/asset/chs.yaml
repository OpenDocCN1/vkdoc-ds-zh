- '# 2. Streamlit 基础


  得益于其便捷且高度直观的 API，Streamlit 简化了从构想到部署的创建界面、显示文本、可视化数据、渲染小部件以及管理 Web 应用程序的过程，附录中对此有重点说明。本章涵盖了创建输入表单、实现条件流程、处理错误、修改数据框以及渲染基本图表的技术。掌握基础知识后，开发者将能够在本机上生成、管理和部署一系列简单的
  Web 应用程序。这些应用程序可能包括数据浏览器、机器学习工具、多媒体处理工具、数据整理工具以及其他通用解决方案。一旦熟练掌握了这些基础，开发者就可以继续创建更高级和复杂的应用程序，这将在后续章节中探讨。




  ## 2.1 创建基础应用


  通过利用 Streamlit 强大的 API，我们可以创建从简单的微服务到与分布式架构集成的复杂系统等广泛的应用。Streamlit 让我们能够轻松适应不同用户的多样化需求。不过，在本节中，我们将先专注于探索较为简单的应用，然后在后续章节中再逐步深入到更复杂的应用。


  ### 2.1.1 生成用户输入表单


  在 Streamlit 中创建表单非常简单，只需在页面上对多个输入组件（例如文本和数字字段）进行分组，并添加一个按钮来触发操作（如将条目保存到数据库或存储在会话状态中）即可。然而，这种方法的一个关键考虑因素是，每当用户与任何组件交互时，Streamlit
  都会自动从头到尾重新运行整个脚本。虽然这确保了程序逻辑顺畅且无缝，但在某些情况下，将输入组件分组并仅在用户明确提示时才重新运行脚本更为实用。这可以通过使用 `st.form`
  命令来实现。


  ```python

  import streamlit as st

  from datetime import date  # 导入以使用当前日期

  # 创建反馈表单

  with st.form(''feedback_form''):

  st.header(''反馈表单'')

  # 将表单输入组织到列中

  col1, col2 = st.columns(2)

  with col1:

  name = st.text_input(''请输入您的姓名'', placeholder=''您的全名'')

  rating = st.slider(''给此应用评分 (0 = 最差, 10 = 最佳)'', 0, 10, 5)

  with col2:

  dob = st.date_input(''请输入您的出生日期'')

  recommend = st.radio(''您会向他人推荐此应用吗？'', (''是'', ''否''))

  # 提交按钮

  submit_button = st.form_submit_button(''提交'')

  # 处理表单提交

  if submit_button:

  # 检查姓名是否为空

  if not name.strip():

  st.error(''姓名不能为空。请提供您的姓名。'')

  # 检查出生日期是否有效

  elif dob > date.today():

  st.error(''出生日期不能是将来的日期。'')

  else:

  st.success(''感谢您的反馈！'')

  st.write(''**姓名：**'', name)

  st.write(''**出生日期：**'', dob)

  st.write(''**评分：**'', rating)

  st.write(''**会推荐吗？：**'', recommend)

  代码清单 2-1

  input_form. py

  ```


  可以使用 `with` 语句结合 `st.form` 命令来创建 Streamlit 表单。在代码清单 2-1 中，我们首先使用 `st.columns` 命令将表单内的组件组织成两个等宽的列。在第一列中，我们分别使用
  `st.text_input` 和 `st.slider` 命令包含一个文本输入和一个滑块组件。在第二列中，我们使用 `st.date_input` 和 `st.radio`
  命令添加了一个日期输入和一个单选按钮组件。


  在同一个 `with` 语句中，我们使用 `st.form_submit_button` 命令包含了一个表单提交按钮。该按钮允许通过一次点击集体提交表单中的所有组件条目，无论包含多少项内容。需要注意的是，`st.form_submit_button`
  与 `st.button` 不同，如果没有它，对于使用 `st.form` 创建的表单，Streamlit 将报错。


  如图 2-1 所示，所有组件都使用 `st.form` 命令分组到一个表单中。一旦点击表单提交按钮，组件条目将被一起处理，并显示输出，如图 2-2 所示。


