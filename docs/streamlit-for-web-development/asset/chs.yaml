  return {\"message\": \"New employee added successfully\"}\n@app.route('/api/auth/login',\
  \ methods=[\"POST\"])\ndef log_in():\nusername, password = request.json['username'],\
  \ request.json['password']\nwith session_manager() as session:\nadmin_account =\
  \ session.query(Admins).filter(\nAdmins.username == username).first()\nprint(1)\n\
  if admin_account is None:\n# 用户名不存在。但不要告知客户端，以免其用于暴力破解有效用户名\nreturn exceptions.Unauthorized(\n\
  description=\"Incorrect username/password combination\")\nprint(2)\n# 检查该密码是否能生成这样的哈希值\n\
  is_password_correct = hashing_service.check_bcrypt(\npassword.encode(\"utf8\"),\
  \ admin_account.password_hash.encode(\"utf8\"))\nprint(3)\nif not is_password_correct:\n\
  return exceptions.Unauthorized(\ndescription=\"Incorrect username/password combination\"\
  )\nprint(4)\ntoken_payload = {\"username\": username}\ntoken = jwt_service.generate(token_payload)\n\
  print(5)\nif token is None:\nreturn exceptions.InternalServerError(description=\"\
  Login failed\")\nprint(6)\nreturn {\"token\": token}\n@app.route('/api/auth/sing_up',\
  \ methods=[\"POST\"])\ndef sign_up():\nusername, password = request.json['username'],\
  \ request.json['password']\nif request.headers.get(\"sing_up_key\") != \"sing_up_key\"\
  :\nexceptions.Unauthorized(description=\"Incorrect Key\")\nwith session_manager()\
  \ as session:\npassword_hash = hashing_service.hash_bcrypt(\npassword.encode(\"\
  utf-8\")).decode(\"utf-8\")\nadmin = Admins(username=username, password_hash=password_hash)\n\
  session.add(admin)\nsession.commit()\nreturn {\"message\": \"Admin account created\
  \ successfully\"}\n@app.route('/api/auth/is_logged_in')\ndef is_logged_in():\n#\
  \ 如果到达此控制器，意味着认证中间件识别了传入的令牌\nreturn {\"message\": \"Token is valid\"}\napp.run()\n\
  ```\n代码清单 8-5 `Flask/flask_main.py`\n\n创建账户后，我们可以手动检查数据库以验证新凭证是否已存储。如图 8-5 所示，其中用户名与提供的用户名匹配，另一列则包含所提供密码的有效\
  \ Bcrypt 哈希值。\n\n![一张数据库查询界面的截图，显示 SQL 查询：\"SELECT * FROM public.admins ORDER BY\
  \ id ASC\"。下方的数据输出表显示了标记为 \"id\"、\"username\" 和 \"password_hash\" 的列。表中有一行数据，其中\
  \ \"id\" 为 1，\"username\" 为 \"admin1\"，以及一个哈希密码字符串。](img/523242_2_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5 数据库中创建的账户详情\n\n现在我们已经设置了管理员账户，可以继续下一步之前，使用 Postman 测试登录流程。通过向相应路由发送 POST\
  \ 请求，以 JSON 格式提交注册时使用的相同用户名和密码，我们将在响应中收到一个令牌，如图 8-6 所示。\n\n![Postman 界面的截图，显示向 `127.0.0.1:5000/api/auth/login`\
  \ 发送的 POST 请求。请求体包含带有用户名和密码的 JSON 数据。响应体显示了一个带有令牌的 JSON 对象。状态码为 200 OK，表示请求成功。](img/523242_2_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6 使用图 8-4 中的凭证通过 Postman 登录\n\n进入 Streamlit 端的下一开发阶段，我们将从重构代码清单 8-6 开始，使其支持使用认证令牌进行初始化。该令牌随后将包含在每个请求中——登录请求除外，因为此时令牌尚不可用。还需注意，`is_logged_in`\
  \ 函数用于快速检查当前令牌（若已提供）的有效性。\n\n```\nimport requests\nclass API:\ndef __init__(self,\
  \ base_url: str, token: str):\nself.base_url = base_url\nself.base_headers = {'token':\
  \ token}\ndef add_employee(self, name, dob, paygrade):\ntry:\ndata = {\n'name':\
  \ name,\n'date_of_birth': dob,\n'paygrade_id': paygrade\n}\nresponse = requests.post(self.base_url\
  \ + '/employee',\njson=data, headers=self.base_headers)\nif response.status_code\
  \ == 200:\nreturn True\nexcept:\nreturn False\ndef get_employees(self):\ntry:\n\
  response = requests.get(self.base_url + '/employees',\nheaders=self.base_headers)\n\
  return response.json()['data']\nexcept:\nreturn None\ndef login(self, username,\
  \ password):\ntry:\nresponse = requests.post(self.base_url + '/auth/login', json={\n\
  'username': username,\n'password': password\n})\nbody = response.json()\ntoken =\
  \ body.get('token') if type(body) == dict else None\nreturn token\nexcept:\nreturn\
  \ None\ndef is_logged_in(self):\nreturn requests.get(self.base_url + '/auth/is_logged_in',\
  \ headers=self.base_headers).status_code == 200\n```\n代码清单 8-6 `Streamlit/API.py`\n\
  \n我们的 API 现已适配为使用认证令牌，如代码清单 8-7 所示。接下来，我们可以进入前端开发，通过实现 Cookie 支持来存储这些令牌并按需使用，如代码清单\
  \ 8-8 所示。每当 Streamlit 渲染时，它会检查本地 Cookie 中是否存在认证令牌。如果令牌有效，应用程序将显示管理门户，并附带个性化的欢迎信息，如图\
  \ 8-8 所示。否则，它将提示用户登录，如图 8-7 所示。\n\n```\nimport streamlit as st\nfrom Views import\
  \ AddEmployee, DisplayEmployees, Login\nfrom API import API\nimport extra_streamlit_components\
  \ as stx\nimport base64, json\ncookie_manager = stx.CookieManager()\ncookies = cookie_manager.get_all()\n\
  authentication_token = cookies.get(\"token\")\\\nif type(cookies) == dict else cookies\n\
  api = API(\"http://127.0.0.1:5000/api\", authentication_token)\ndef get_username_from_token(auth_token):\n\
  b64 = str(auth_token).split(\".\")[1]\nb64 = b64 + \"=\" * (4 - (len(b64) % 4))\n\
  data = base64.b64decode(b64).decode(\"utf8\")\nusername = json.loads(data)['username']\n\
  return username\ndef manage_login(username, password):\ntoken = api.login(username,\
  \ password)\ncookie_manager.set(\"token\", token)\nreturn token is not None\nst.title(\"\
  公司管理门户\")\nif st.user.is_logged_in or api.is_logged_in():\nst.subheader(f\"_ 欢迎\
  \ \"\nf\"**{get_username_from_token(authentication_token)}**_\")\nif st.button(\"\
  登出\"):\ncookie_manager.delete(\"token\")\nst.write(\"_____\")\nAddEmployee(api.add_employee)\n\
  st.write(\"___\")\nDisplayEmployees(api.get_employees)\nelse:\nLogin(manage_login)\n\
