- fmt: "### Lists\n\nWrite a list with five items. Between two and three, add a paragraph\
    \ of text, but make sure that the numbers continue with four.\n\nAdd a label to\
    \ item three and refer to it in item five. Create a list of definitions as well.\
    \ Make them multi-line.\n\n### Tables\n\nMake a table with three columns where\
    \ you left-justify the first column, center the second column, and right-justify\
    \ the third.\n\nWrite a table with a caption. Until we format the Markdown with\
    \ `Pandoc` in the next chapter, you will not see the result but keep the text\
    \ so you can test it there.\n\n### Footnotes\n\nWrite a text with a footnote.\
    \ Use both notations for footnotes.\n\nFootnotes [1](#486315_1_En_4_Chapter.xhtml#Fn1_source)\
    \ [2](#486315_1_En_4_Chapter.xhtml#Fn2_source)\n\n# 5. Translating Documents\n\
    \nOnce we have a document written in Markdown, we want to translate it into other\
    \ file formats using `Pandoc`. First, though, we have to download `Pandoc`. Go\
    \ to Pandoc's installation guide at [`http://pandoc.org/installing.html`](http://pandoc.org/installing.html)\
    \ and follow the instructions relevant for your platform.\n\n## Formatting a Markdown\
    \ Document with Pandoc\n\nFor our first example, we can take the small Markdown\
    \ document shown here:\n\n```\n# This is a test document\nHere is some text in\
    \ the document.\n* This is a list\n* With two items\n```\n\nIf we save this Markdown\
    \ document in a file called `input.md`, we can translate it into an HTML file,\
    \ `output.html`, using the command:\n\n```\npandoc -o output.html input.md\n```\n\
    \nThe `-o` option specifies the output file. The `input.md` file is specified\
    \ without any options. You do not need any options for input files, and you can\
    \ provide more than one. If you provide more than one input file, they are in\
    \ effect concatenated before Pandoc processes them, so if you want to construct\
    \ a book from several chapters you have written in separate files, you can provide\
    \ them on the command line in the order you want the chapters to appear in the\
    \ book.\n\n`Pandoc` figures out the input and output format from the file extensions,\
    \ so if you use the preceding command, it will know that the input is Markdown\
    \ (filename suffix `.md`) and that the output should be HTML (filename suffix\
    \ `.html`). You can make the format of input and output formats explicit. You\
    \ can use the option `--from` to specify the input format and `--to` to specify\
    \ the output format. In most cases, you will not need to specify the formats—the\
    \ filenames contain all the information you need—but sometimes different formats\
    \ share the same filename suffixes, such as the EPUB and EPUB3 formats that both\
    \ use filename suffix `.epub`. In those cases, you need the options.\n\nIf you\
    \ specify the input and output document format, then you can also treat `pandoc`\
    \ as a program you can pipe input into and get the formatted document out from.\
    \ You could, for example, write:\n\n```\ncat input.md | \\\npandoc --from markdown\
    \ --to html \\\n> output.html\n```\n\nIn itself there is little use for this,\
    \ but combined with preprocessing (Chapter [10](#486315_1_En_10_Chapter.xhtml))\
    \ and filters (Chapter [11](#486315_1_En_11_Chapter.xhtml)), it is very handy.\n\
    \nBack to the output of `pandoc`. If you run the previous command:\n\n```\npandoc\
    \ -o output.html input.md\n```\n\nin your terminal, then the `output.html` file\
    \ should now contain the following HTML:\n\n```\nThis is a test document\n\nHere\
    \ is some text in the document.\n\nThis is a list\nWith two items\n```\n\nIf you\
    \ are not familiar with HTML, this might not be readable, but I hope that you\
    \ can at least recognize the elements from the input Markdown.\n\nThis HTML is\
    \ not a complete HTML file. It is a fragment of an HTML file that corresponds\
    \ to the Markdown document, but it is missing header and footer markup that is\
    \ needed for a complete HTML page. Per default, Pandoc creates HTML markup that\
    \ can be added to a web page, but not standalone documents. To get the header\
    \ and footer added as well, you can use the option `--standalone`.\n\n```\npandoc\
    \ --standalone -o output.html input.md\n```\n\nThe `--standalone` option is needed\
    \ for HTML output if you want a complete document. If you choose an output format\
    \ that is typically not meaningful as a fragment, such as PDF documents (suffix\
    \ `.pdf`), EPUB documents (suffix `.epub` or `.epub3`), or Word files (suffix\
    \ `.docx`), Pandoc will automatically create complete documents, and the `--standalone`\
    \ option is not needed.\n\nIf you run `pandoc --standalone -o output.html input.md`,\
    \ you will get a warning:\n\n```\n[WARNING] This document format requires a nonempty\
    \ element.\nPlease specify either 'title' or 'pagetitle' in the metadata,\ne.g.\
    \ by using --metadata pagetitle=\"...\" on the command line.\nFalling back to\
    \ 'input'\n```\n\nBut despite the warning, you will get an HTML document that\
    \ contains all the elements such a document needs:\n\n```\n<!DOCTYPE html>\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"\" xml:lang=\"\">\n<head>\n  <meta\
    \ charset=\"utf-8\" />\n  <meta name=\"generator\" content=\"pandoc\" />\n  <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=yes\"\
    \ />\n  <title>input</title>\n  <style>\n    code{white-space: pre-wrap;}\n  \
    \  span.smallcaps{font-variant: small-caps;}\n    span.underline{text-decoration:\
    \ underline;}\n    div.column{display: inline-block; vertical-align: top; width:\
    \ 50%;}\n  </style>\n</head>\n<body>\n<h1 id=\"this-is-a-test-document\">This\
    \ is a test document</h1>\n<p>Here is some text in the document.</p>\n<ul>\n<li>This\
    \ is a list</li>\n<li>With two items</li>\n</ul>\n</body>\n</html>\n```\n\nThere\
    \ is more general HTML here than there is in our text, but luckily we do not need\
    \ to worry about it; we can focus on the Markdown and let Pandoc worry about the\
    \ rest.\n\nThe warning we got has to do with the title we get in the line:\n\n\
    ```\n<title>input</title>\n```\n\nPandoc just took the name from the input file\
    \ but was hoping to get the title explicitly provided. You can do this using metadata;\
    \ see Chapter [8](#486315_1_En_8_Chapter.xhtml). Ignore it for now.\n\nYou can\
    \ try making different output formats with the commands:\n\n```\npandoc -o output.pdf\
    \ input.md\npandoc -o output.docx input.md\npandoc -o output.epub input.md\npandoc\
    \ --to=epub3 -o output.epub input.md\n```\n\nIn the last example, we explicitly\
    \ specify that the EPUB format to use in the output is EPUB3.\n\nAnother case\
    \ is where we might want to specify the `--to` format is for PDFs. By default,\
    \ Pandoc will create PDF files using LaTeX, but you can specify that it should\
    \ use ConTeXt instead with the command:\n\n```\npandoc --to=context -o output.pdf\
    \ input.md\n```\n\nTo get a complete list of supported input and output formats,\
    \ run the commands:\n\n```\npandoc --list-input-formats\n```\n\nand:\n\n```\n\
    pandoc --list-output-formats\n```\n\nrespectively.\n\nPandoc can translate between\
    \ many different input and output formats, but in this book, we will only consider\
    \ Markdown input and how to translate Markdown to other formats.\n\n## Frequently\
    \ Useful Options\n\nThere are many options you can use to influence how Pandoc\
    \ transforms a document. I refer you to the online manual[³](#fn3) for a full\
    \ list. Here, I will list a few that I find particularly useful in my own writing.\n\
    \n### Sections and Chapters\n\nFirst, we consider options that relate to how sections\
    \ are interpreted. In Markdown we specify the different levels of section headers\
    \ by the number of hashtags, but when we produce a document, we sometimes have\
    \ to worry about whether the top-level sections are parts, chapters, or sections.\
    \ If we are writing a short report or paper, we want the level-one headers to\
    \ start sections, but if we are writing a book, we want them to start chapters.\
    \ The default depends on the output we produce, and Pandoc does some guessing\
    \ for us, but you can choose explicitly what the top level should be using the\
    \ `--top-level-division` option. For my books, where I want the level-one headers\
    \ to be chapter headers, I use `--top-level-division=chapter`.\n\n### Table of\
    \ Contents\n\nTo add a table of contents to your output document, you can use\
    \ the option `--toc` or the option `--table-of-contents`; the first is just a\
    \ shorter version of the second. You can specify the level of sections you want\
    \ in the table of contents using the `--toc-depth` option. When I produce ebooks,\
    \ I typically only want the table of contents for the chapter level, so I use\
    \ `--toc-depth=1`. When I produce PDF, I am happy with the default. You can play\
    \ around with the option to see what you prefer."
