- fmt: '# Referencing Sections


    Using cross-referencing via links works well for HTML or EPUB documents, where
    you have hypertext, but less well for printed media, where you don’t. There, you
    would make references to chapters and sections using their numbers instead, but
    that isn’t supported in standard Markdown.


    Using `pandoc-crossref`, we can refer to sections via section numbers. We need
    to define labels for the headers we want to refer to, and these labels must start
    with the prefix `sec:` (in addition to the hashtag that all header labels must
    have). We can then insert cross-references to section numbers using `[@sec:label]`
    markup. An example could look like this:


    ```

    # This is a chapter {#sec:chapter}

    ## This is a section {#sec:section}

    See [@sec:chapter] and [@sec:section].

    ```


    Pandoc doesn’t number sections by default, and while it will number sections in
    some formats when we use `pandoc-crossref`, we should use the option `--number-sections`
    to make sure. If, for example, you generate PDF output, sections will not be numbered
    if you leave out this option, and consequently, it makes no sense to refer to
    sections by their numbers.


    ```

    pandoc --number-sections \

    --filter pandoc-crossref \

    -o output.pdf \

    input.md

    ```


    This approach will use the LaTeX section numbering system for PDF output but will
    also work for other output formats such as HTML.


    You can set the section numbering depth with the metavariable `secnumdepth`. For
    example, to number chapters and sections (or sections and subsections, depending
    on the top level section type), you can add the following line to your metadata
    header:


    ```

    secnumdepth: 2

    ```


    This will only affect LaTeX and PDF output, though, and not other output formats.


    Alternatively, you can leave the section numbering entirely up to the filter by
    setting metadata variable `numberSections` to `true` and set the section depth
    you want to be numbered with the metadata variable `sectionsDepth`. For example,
    in your header, you can add the following lines to get chapters and sections,
    but not subsections, numbered (assuming the top level headers are chapters; otherwise
    you get sections and subsection headers numbered):


    ```

    numberSections: true

    sectionsDepth: 2

    ```


    This will insert chapter and section numbers at the desired depth and let you
    cross-reference sections in HTML and EPUB format, but unfortunately the cross-referencing
    does not work in LaTeX and PDF. Here, you only get the section numbers but not
    the cross-references inserted.


    Neither of the two choices for section numbering is ideal for both PDF and EPUB
    output. Using `--number-sections` will insert section numbers in both output formats,
    but you can only control the numbering depth in PDF output. Using `numberSections`
    will insert section numbers to the desired depth in both output formats, but you
    can’t insert references to them in PDF output. You can’t use *both* `--number-sections`
    and `numberSections` either since both the Pandoc filter *and* LaTeX will insert
    section numbers, and you end up with two of them in each header.


    One solution I use for this is to call Pandoc with different options when generating
    EPUB and PDF. For EPUB output, I use:


    ```

    pandoc --metadata numberSections=true \

    --filter pandoc-crossref ...

    ```


    For PDF output, I use:


    ```

    pandoc --number-sections \

    --filter pandoc-crossref ...

    ```


    I set the numbering depth in my YAML header, using both options for controlling
    that:


    ```

    sectionsDepth: 2

    secnumdepth: 2

    ```


    ## Reference Prefixes


    When you need to refer to a section, you use the syntax `[@sec:label]`. When you
    reference a section this way, the filter will insert both the section number and
    a default prefix, which is “sec.” for a single section and “secs.” for multiple
    sections. You can refer to more than one section but separating the labels by
    semicolons inside the square brackets:


    ```

    [@sec:label1; @sec:label2]

    ```


    For documents where you have both chapters and sections, this might not be what
    you want. There you might want to use the prefix “Chapter” for chapters and “Section”
    for sections. Unfortunately, you cannot make prefixes that depend on the header
    depth, but you can disable the prefixes by overriding them.


    You can either change the reference prefix on a per-reference basis or globally
    through metadata. For referring to chapters as “Chapter” rather than “sec.”—as
    in this example—the best solution is probably to set the prefix explicitly when
    referring to a chapter, but we can see how both approaches work.


    To use a per-reference specific prefix, you need to insert the prefix you want
    between the start square bracket and the label. So, to make the prefix for the
    reference to a chapter be “Chapter,” we would write `[Chapter @sec:chapter]`.


    To change the prefixes globally, we need to set a metadata variable. The metadata
    variable that controls the section references prefix is `secPrefix`. If we set
    it to the empty string, we get rid of the prefixes.


    ```

    secPrefix: ""

    ```


    You can then manually insert the prefixes you want in the Markdown text:


    ```

    See Chapter[@sec:chapter]

    and Section[@sec:section].

    ```


    Notice the lack of spaces between prefix and references here. This is needed for
    PDF output; the LaTeX document that Pandoc generates for the references contain
    a hard space, so if we put a space between the prefix and reference, the PDF document
    will have too much space in the generated text. For HTML and EPUB, it doesn’t
    matter.


    Completely disabling a prefix can be done on a per-reference basis as well. Just
    add a “-” between the start bracket and the label. If you write `[-@sec:chapter]`,
    you only get the chapter number and not the prefix. You rarely need to set the
    default prefix to the empty string explicitly. But using that as an example gave
    me an excuse to introduce the variable.


    You can set the `secPrefix` metadata to a list. The first element is used for
    single references and the second for plural. So, to use “Sect.” as the prefix
    for a reference to a single section, and “Sects.” as the prefix for multiple sections,
    we could specify this metadata:


    ```

    secPrefix: ["Sect.", "Sects."]

    ```


    The prefix list can have any length, and the number of references is used to select
    a prefix. So, if you want a special prefix when you refer to three sections, you
    can add a third element to the list. When you have more references than prefixes,
    you get the last element in the list. Thus, if you specify two elements in the
    list, the first is used for singular references and the second for multiple references.


    You might want to use lowercase “sect.” when you refer to a section in the middle
    of a sentence but “Sect.” at the beginning of sentences. With `pandoc-crossref`
    it is simple to switch between uppercase and lowercase label prefixes. If you
    insert a label that starts with an uppercase, your prefix will be in uppercase
    as well. Thus, if you write `[@Sec:label]`, the default prefix will be “Sec.”;
    if you write `[@sec:label]`, the default prefix will be “sec.”. The same goes
    for references to figures, tables, equations, and so on.'
