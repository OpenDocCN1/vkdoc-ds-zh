  trans: "\n# 9. 使用模板\n\n当 `Pandoc` 创建独立文档时，它会使用一个输出模板。模板本质上是一个包含某些占位符变量的文档，元数据和你处理过的\
    \ Markdown 文本将被插入其中。模板中使用哪些元数据取决于输出格式；你可以在 Pandoc 手册中获取完整变量列表。^([13]) `Pandoc`\
    \ 会自动设置一些手册中描述的元数据，但你也可以在文件头中指定其他元数据。\n\n除非你明确指定另一个模板，否则 `Pandoc` 会使用输出格式的默认模板。你可以通过运行\
    \ `pandoc -D` 命令让 `Pandoc` 显示它用于特定输出的模板，例如，要查看生成 PDF 文件时（其过程是先生成 LaTeX 文档，然后编译它）会使用什么内容，可以输入\
    \ `pandoc -D latex`。你也可以在 [`https://github.com/jgm/pandoc-templates`](https://github.com/jgm/pandoc-templates)\
    \ 获取默认模板的完整列表及其样式。\n\n如果你不懂 LaTeX，运行 `pandoc -D latex` 得到的模板可能意义不大，那么让我们来看看 `pandoc\
    \ -D html`。输出内容相当长，我不会在此全部复现，只重点介绍其中几部分。\n\n还记得我们在第 8 章讨论的标题吗？在我们为标题提供元数据之前，它是空的。让我们看看模板中它是什么样子。你会找到这样一行代码：\n\
    \n```\n$if(title-prefix)$\n$title-prefix$ -\n$endif$\n$pagetitle$\n```\n\n美元符号内的内容指定了占位符以及模板应如何处理这些代码的语法。在\
    \ HTML 模板的 title 标签内，有两个可插入的元数据变量：`title-prefix` 和 `pagetitle`。只有存在标题前缀时才会插入它；这正是\
    \ `$if(title-prefix)$` 代码所检查的内容。严格来说，`pagetitle` 也只有在存在时才会被插入，否则会得到一个空字符串。但因为标题前缀后面应跟一个破折号，所以这里进行了一个显式检查，以确定是否应插入内容。\n\
    \n我们从未为 `title-prefix` 和 `pagetitle` 提供过元数据，因此很难看出它们与我们提供的 `title` 元数据有何关联。我们*可以*显式地提供这两个变量，但\
    \ `Pandoc` 会根据我们的标题自动创建它们。它在模板的其他地方直接使用了 `title` 变量，模板中包含：\n\n```\n$title$\n```\n\
    \n`Pandoc` 和过滤器可以访问元数据并创建新的元数据，这正是它为 `title-prefix` 和 `pagetitle` 所做的。`title`\
    \ 占位符只是直接插入你在元数据中指定的文本。\n\n我并不知道哪些文档能精确说明每种输出格式下可预期的元数据操作，而且我也不确定你是否应该依赖这些操作，因为它们在不同版本的\
    \ `Pandoc` 和过滤器中可能不稳定。然而，如果你不使用派生元数据，而是坚持使用明确定义的元数据，那么数据的使用方式就比较直接了。如果你有一个像 `$title$`\
    \ 这样的简单占位符，那么你在元数据中指定的字符串就会直接插入到输出文件的相应位置。\n\n正如我们在 `title-prefix` 中看到的，元数据也可以根据其是否被定义来条件性地插入。要仅在元变量\
    \ `variable` 被定义时插入 `some text`，模板可以包含这样的结构：\n\n```\n$if(variable)$ some text\
    \ $endif$\n```\n\n还有一种 if-else 结构，看起来像这样：\n\n```\n$if(variable)$\nsome text\n\
    $else$\nsome other text\n$endif$\n```\n\n最后，还有一种循环结构。在 HTML 模板中，你可以找到这样一段文本：\n\
    \n```\n$for(author)$\n$author$\n$endfor$\n```\n\n这行代码会遍历元数据中指定的作者，并逐个插入他们。如果 `author`\
    \ 不是一个列表，它仍然有效；它会被视为一个长度为 1 的列表。但如果我们确实有一个作者列表，我们就会为每个作者生成一个二级标题。\n\n请记住，元数据可以结构化，其值可以包含键值对列表。比如这个例子：\n\
    \n```\nauthor:\n- name: Thomas Mailund\n  affiliation: Unseen University\n- name:\
    \ Karsken Baelg\n  affiliation: Brakebills University\n```\n\n在这里，作者不是简单的字符串，而是一个键值结构的列表，每个结构包含姓名和所属机构。在模板内部，这些字段可以使用“点表示法”来访问，因此模板可能包含如下代码：\n\
    \n```\n$for(author)$\n$if(author.name)$\n$author.name$\n$if(author.affiliation)$\n\
    ($author.affiliation$)\n$endif$\n$else$\n$author$\n$endif$\n$endfor$\n```\n\n\
    这段代码遍历作者列表并插入作者的姓名（如果他们有姓名的话，通常应该如此）。如果他们有所属机构，则在姓名后添加所属机构。如果作者列表包含的项目不是由姓名和所属机构构成的结构，那么模板会直接插入该列表项（参见\
    \ `$if(author.name)$` 判断条件中的 `$else$` 部分）。\n\n当然，输出中最重要的部分来自输入文本中已处理的 Markdown。在模板中，它被插入到不起眼的\
    \ `$body$` 占位符处。它看起来不起眼，但当你所有的 Markdown 被处理成输出格式后，都会被插入到这里。\n\n## 编写你自己的模板\n\n\
    模板是另一个在需要时非常好用、不需要时也无需担心的特性。你可以完全不用关心模板就能使用 `Pandoc`，但如果你需要以特定格式排版文档，也无需为编写文本而放弃\
    \ `Pandoc`；你可以创建一个模板来处理格式。例如，如果你像我一样是学术界人士，需要为不同的期刊使用不同的格式，你可以为这些期刊制作模板。期刊通常会提供论文的\
    \ LaTeX 模板，你可以选取其中一个模板，放入 `Pandoc` 的占位符，瞬间你就拥有了一个 `Pandoc` 模板，然后就可以用 Markdown\
    \ 撰写论文，同时其格式仍符合期刊标准。\n\n你可以从 `Pandoc` 的用户贡献模板中获得编写自己模板的灵感。^([14]) 我发现创建新模板最简单的方法是拿一个\
    \ `Pandoc` 现有的模板进行修改，或者拿一个现有的 HTML 或 LaTeX 文件，放入元数据和 `$body$` 占位符。\n\n默认模板之所以冗长复杂，是因为它们需要设置很多内容，例如配置数学公式或源代码高亮。如果你需要\
    \ `Pandoc` 提供的所有功能，我建议你复制一个现有模板并进行修改。对于本章，我将编写更简单的模板，目标是清晰明了而非功能完备。相应的 Markdown\
    \ 输入也会很简单。如果你需要更多功能，可以在默认模板中找到所需的代码，通常不难找到。\n"
- fmt: '# Template Examples


    Consider this text. Most of it is metadata since that is what we are interested
    in here. As you can see, there are three variables in the YAML header: `title`,
    `subtitle`, and `author`. The first two holds a single value and the last is a
    list of simple values.


    ```

    title:

    A terrible novel

    subtitle:

    Seriously, one of the worst!

    author:

    - Thomas Mailund

    - Karsken Baelg


    It was a dark and stormy night

    ```


    If we write the following HTML template, we add a title and a subtitle in the
    HTML header and the level-one header in the main document. If there are any authors
    in the metadata, then we insert a `div` element to right-align the list of authors,
    and we get the said list by iterating over them. The `$sep$` variable is not a
    metavariable as such but a way to tag the following token. If you use `$sep$`,
    then the token—word or comma, for example—will be put between all the elements
    you iterate over but will not follow the last element. Try removing it and you
    will see.


    ```

    $title$$if(subtitle)$: $subtitle$$endif$


    $title$$if(subtitle)$: $subtitle$$endif$


    $if(author)$


    By

    $for(author)$$author$$sep$and $endfor$


    $endif$

    $body$

    ```


    If we format our text with this template, we get the following HTML:


    ```

    A terrible novel: Seriously, one of the worst!


    A terrible novel: Seriously, one of the worst!


    By

    Thomas Mailund and Karsken Baelg


    It was a dark and stormy night

    ```


    For PDF/LaTeX output, this template does the same as the preceding HTML template.


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{$for(author)$$author$$sep$and $endfor$}

    \begin{document}

    \maketitle

    \end{document}

    ```


    (The inclusion of `hyperref` is not relevant for the example, but it is one of
    those packages that Pandoc expects to be included. At the time I am writing this,
    it is the only one you need for this particular example).


    Applying the template to our document gives us this:


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{A terrible novel: Seriously, one of the worst! }

    \author{Thomas Mailund and Karsken Baelg}

    \begin{document}

    \maketitle

    \end{document}

    ```


    You can “dot” yourself into nested information in metadata, so if your data looks
    like this:


    ```

    title:

    A terrible novel

    subtitle:

    Seriously, one of the worst!

    author:

    - name: "Thomas Mailund"

    affiliation: "Unseen University"

    - name: "Karsken Baelg"

    affiliation: "Brakebills University"

    ```


    and your template looks like this:


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{$for(author)$$author.name$

    from $author.affiliation$

    $sep$ and

    $endfor$}

    \begin{document}

    \maketitle

    $body$

    \end{document}

    ```


    then progressing the document will generate this output:


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{A terrible novel: Seriously, one of the worst! }

    \author{Thomas Mailund from Unseen University

    and Karsken Baelg from Brakebills University}

    \begin{document}

    \maketitle

    It was a dark and stormy night

    \end{document}

    ```


    You need to get the name and affiliation for each author using `$author.name$`
    and `$author.affiliation$`. You cannot simply use `$author$` any more. You can
    still check if a value is set; just dot yourself into it. For example, if some
    authors do not have an affiliation, you can test for it and only insert it when
    it exists.


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{

    $for(author)$ $author.name$

    $if(author.affiliation)$

    from $author.affiliation$

    $endif$

    $sep$ and $endfor$

    }

    \begin{document}

    \maketitle

    $body$

    \end{document}

    ```


    If you have a LaTeX template as the preceding one (or for any other output format),
    you want it to apply to as many documents as possible. You don’t want to have
    to update it every few documents you write. There are often a few tweaks necessary
    for each document, though. For example, in LaTeX you might need to import one
    special package or you want to define some commands. You don’t want those modifications
    in your actual template, and you do not want to have many copies of the template
    lying around either. It is easy, however, to use metavariables to make your template
    adaptable.


    Considering the case of LaTeX files as I just described, we can add packages and
    definitions to the template like this^([(15)](#fn15)):


    ```

    \documentclass{book}

    \usepackage{hyperref}

    $for(packages)$

    \usepackage{$packages$}

    $endfor$

    $if(definitions)$

    $definitions$

    $endif$

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{

    $for(author)$

    $author.name$

    $if(author.affiliation)$

    from $author.affiliation$

    $endif$

    $sep$ and

    $endfor$

    }

    \begin{document}

    \maketitle

    $body$

    \end{document}

    ```


    We iterate over packages to insert each of them in a `usepackage` command. We
    just insert the definitions here. With this input:


    ```

    title:

    A terrible novel

    subtitle:

    Seriously, one of the worst!

    author:

    - name: "Thomas Mailund"

    affiliation: "Unseen University"

    - name: "Karsken Baelg"

    affiliation: "Brakebills University"

    packages:

    - amssymb

    - amsmath

    - booktabs

    - xspace

    definitions: |

    \newcommand{\TMRCA}%

    {\ensuremath{T_\textrm{MRCA}}\xspace}

    \newcommand{\tAC}%

    {\ensuremath{\tau_{AC}}\xspace}

    \newcommand{\tBC}%

    {\ensuremath{\tau_{BC}}\xspace}

    \newcommand{\tABC}%

    {\ensuremath{\tau_{ABC}}\xspace}

    \newcommand{\tadmix}%

    {\ensuremath{\tau_\text{admix}}\xspace}


    It was a dark and stormy night

    ```


    we get:


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \usepackage{amssymb}

    \usepackage{amsmath}

    \usepackage{booktabs}

    \usepackage{xspace}

    \newcommand{\TMRCA}%

    {\ensuremath{T_\textrm{MRCA}}\xspace}

    \newcommand{\tAC}%

    {\ensuremath{\tau_{AC}}\xspace}

    \newcommand{\tBC}%

    {\ensuremath{\tau_{BC}}\xspace}

    \newcommand{\tABC}%

    {\ensuremath{\tau_{ABC}}\xspace}

    \newcommand{\tadmix}%

    {\ensuremath{\tau_\text{admix}}\xspace}

    \title{A terrible novel: Seriously, one of the worst! }

    \author{

    Thomas Mailund

    from Unseen University

    and

    Karsken Baelg

    from Brakebills University

    }

    \begin{document}

    \maketitle

    It was a dark and stormy night

    \end{document}

    ```


    If you do not want this LaTeX-specific code to turn up in HTML output, then simply
    do not include it in the template. If you want separate header configurations
    in HTML and PDF documents, you can use two different metavariables. For LaTeX
    macros (unlike the package inclusion), you do not need to modify a template. Pandoc
    understands the definition of macros and will apply a macro you invoke when producing
    output. If you call a macro inside math, Pandoc will produce the result of calling
    the macro in the math format the output needs. Outside of math, the result of
    calling the macro will be included in LaTeX and Markdown output but left out in
    other formats.


    In case you are interested, the template I have used to format this book evolved
    over several books but currently looks like the following. I have not listed all
    the code that Pandoc has in its template but show, in a comment, where you can
    insert it.'
