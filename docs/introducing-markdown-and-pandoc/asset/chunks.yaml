  trans: "\n# 4\\. Pandoc Markdown 扩展\n\n遗憾的是，Markdown 并非标准化语言。不同的工具会支持不同的标记语法，并以不同方式处理它们。上一章描述的\
    \ Markdown 语法在大多数工具中（即使不是全部）都能正常工作。通常表格语法的支持度较差，但其余标记通常都能正常使用。\n\nPandoc 为上一章描述的\
    \ Markdown 语言提供了若干扩展。在本章中，我们将看到一些对列表和表格非常有用的扩展。如需获取 Pandoc 对 Markdown 扩展的完整列表，请查阅\
    \ Pandoc 文档：[`tinyurl.com/y87mstzf`](https://tinyurl.com/y87mstzf)。\n\n## 列表\n\
    \n通常，编写有序列表时使用的数字会被忽略。它们用于指示列表项，但实际编号并不重要。这使得在列表中间插入新项变得更容易，这是一件好事，但有时你想让列表从一个非\
    \ 1 的数字开始，在这种情况下，基本的 Markdown 就无法帮到你了。不过，使用 Pandoc，列表会从你给第一个列表项的数字开始编号。因此，你可以像这样从数字三开始一个列表：\n\
    \n```\n3. 此列表从数字三开始。\n5. 尽管我们使用 \"5.\" 来开始这个\n条目，它仍然会被编号为 4。\n```\n\n后续列表项中的数字仍然被忽略。结果如下所示：\n\
    \n-   3\\. 此列表从数字三开始。\n-   4\\. 尽管我们使用 \"5.\" 来开始这个条目，它仍然会被编号为 4。\n\n这是延续列表的好方法，但当你在前一个列表中添加或删除了项目后，你需要更新初始数字。\n\
    \n为了让列表自动延续到下一个编号，即使你改变了前一个列表，你也可以使用特殊符号 `“@”`。当你在列表中使用它时，它的作用与数字一样，并且它总是从你上次中断的地方开始计数。因此，你可以这样写：\n\
    \n```\n(@) 开始一个列表\n(@) 继续这个列表\n这里是列表之间的一些不\n属于该列表的文本。\n(@) 这继续了该列表，\n编号从我们上次中断\n\
    的地方开始。\n(@label) 此条目带有标签\n以便我们之后可以引用它。\n就像这样：参见条目\n(@label)。\n```\n\n结果如下所示：\n\
    \n1.  开始一个列表\n2.  继续这个列表\n\n这里是列表之间的一些不属于该列表的文本。\n\n1.  这继续了该列表，编号从我们上次中断的地方开始。\n\
    2.  此条目带有标签以便我们之后可以引用它。就像这样：参见条目 (4)。\n\n这对于示例列表等非常有用，但 `@` 计数器是全局的，因此你不能重置计数器。不幸的是，目前尚不支持同时实现自动编号*和*重置计数器。\n\
    \n在这个例子中，我们还看到了 Pandoc 的另一个特性。我们不必写一个数字后跟一个点。在前面的例子中，我们将数字（用 `@` 表示）放在了括号内，结果生成了一个使用括号的列表。你也可以使用一个单独的右括号：\n\
    \n```\n1) 这是一个\n2) 列表\n3) 它确实是\n```\n\n这将为你生成以下列表：\n\n1.  这是一个\n2.  列表\n3.  它确实是\n\
    \n如果你使用数字加句点来创建列表，你会得到标准的编号列表，但你也可以仅通过使用字母或罗马数字开头来使用它们。如果你希望使用括号而不是句点，你也可以这样做。例如，你可以像这样创建一个列表：\n\
    \n1.  此列表使用字母代替数字。\n2.  我们可以创建一个带罗马数字的子列表：\n    1.  此子列表也使用括号\n3.  很酷，不是吗？\n\n\
    创建该列表的源标记如下所示：\n\n```\n1.  此列表使用字母代替数字。\n2.  我们可以创建一个带罗马数字的子列表：\n    1.  此子列表也使用括号\n\
    3.  很酷，不是吗？\n```\n\n你可以混合使用不同的列表符号，这样你的子列表就有不同的列表格式，但如果你在同一层级混合使用它们，你就会开始一个新列表。\n\
    \n列表经常用于定义术语或概念，在 Pandoc 中，你可以通过在一个术语后面跟一个冒号，并用制表符或至少四个空格缩进定义的起始部分来创建定义列表。因此，你可以像这样创建定义列表：\n\
    \n**我们想要定义的事物。** 事物的定义\n\n只要我们缩进后续的行，它们就会成为定义的一部分。\n\n**这里开始我们定义的下一个事物。** 我们在这里写下定义。\n\
    \n定义的更多内容\n\n创建此列表的语法如下：\n\n```\n我们想要定义的事物。\n:    事物的定义\n只要我们缩进后续的行，它们\n就会成为定义的一部分。\n\
    这里开始我们定义的下一个事物。\n:    我们在这里写下定义。\n定义的更多内容\n```\n\n另一种语法使用波浪号 `\"~\"` 代替冒号：\n\n\
    - **术语 1** 定义 1\n- **术语 2** 定义 2a\n\n定义 2b\n\n```\n术语 1\n~ 定义 1\n术语 2\n~ 定义 2a\n\
    ~ 定义 2b\n```\n\n两种语法皆可。\n"
- fmt: '## Tables


    To add tables to a document, you can mark up the columns using dashes. You can
    write a table like this:


    ```

    Right    Left     Center    Default

    -------    ------ ----------  -------

    12    12        12           12

    123    123       123         123

    1    1          1            1

    ```


    The result will look like this:


    | Right | Left | Center | Default |

    | 12 | 12 | 12 | 12 |

    | 123 | 123 | 123 | 123 |

    | 1 | 1 | 1 | 1 |


    How you align the elements in the columns determine how you align the headers
    above the dashes. If the text is to the right, the column will be right-aligned.
    The same for left and center alignment, if the text is on the left or in the middle,
    the table column will be left-aligned or centered. If you start the header at
    the same position as the dashes, you get the default alignment, which is left
    alignment.


    You can leave out the headers, but then you need to repeat the dashes at the end
    of the table as well.


    | 12 | 12 | 12 | 12 |

    | 123 | 123 | 123 | 123 |

    | 1 | 1 | 1 | 1 |


    ```

    -------    ------ ---------- -------

    12    12        12          12

    123    123       123        123

    1    1          1           1

    -------    ------ ---------- -------

    ```


    If you do not provide a header, the alignment is determined by the first line
    in the table. In the preceding example, in the last column, the reason it isn’t
    right-aligned is that there is a space after the first number in the column before
    the end of the dashes that specify the column. Move the first number one position
    to the right, and that column would also be right-aligned.


    Tables are the Markdown markups with the least consistent support in different
    tools. The table syntax described often frequently works, but in the two editors
    I use for writing my books, they are not supported. In all the Markdown viewers
    I am familiar with, though, they display correctly.


    In Pandoc, there is excellent support for tables, and Pandoc provides some extensions
    to table markup beyond the preceding notation.


    For figures, you can add captions using the link syntax. For tables, you have
    no similar syntax. You can, however, add a caption to a table using `Table: Caption`
    following the table. So you can create a table with a caption like this:


    ```

    -------     ------ ---------- -------

    12     12        12         12

    123     123       123       123

    1     1          1          1

    -------     ------ ---------- -------

    Table: This is a caption

    ```


    The result looks like this:


    **Table 4-3.** *This is a caption*


    | 12 | 12 | 12 | 12 |

    | 123 | 123 | 123 | 123 |

    | 1 | 1 | 1 | 1 |


    You can leave out the `Table` part if you want; just having the colon will give
    you a caption.


    If you want table cells to span multiple lines, you can do this as well. For multi-line
    tables, you must put a row of dashes before the header (unless you don’t have
    a header), you must end the table with a row of dashes and then a blank line,
    and you must separate rows by a blank line. This example, from the Pandoc manual,
    shows how this works:


    ```


    Centred   Default      Right Left

    Header   Aligned    Aligned Aligned

    ----------- ------- ---------- ----------------------

    First   row           12.0 Example of a row that

    spans multiple lines.

    Second   row            5.0 Here''s another one.

    Note the blank line

    between rows.

    ----------- ------- ---------- ----------------------

    ```


    The result will look like this:


    | Centred Header | Default Aligned | Right Aligned | Left Aligned |

    | --- | --- | --- | --- |

    | First | row | 12.0 | Example of a row that spans multiple lines. |

    | Second | row | 5.0 | Here''s another one. Note the blank line between rows.
    |


    You can leave out the header, but then you must repeat the dashes that define
    the columns after the table, followed by a blank line.


    ```

    ----------- ------- ---------- ----------------------

    First    row           12.0 Example of a row that

    spans multiple lines.

    Second    row            5.0 Here''s another one.

    Note the blank line

    between rows.

    ----------- ------- ---------- ----------------------

    ```


    Result:


    | First | row | 12.0 | Example of a row that spans multiple lines. |

    | Second | row | 5.0 | Here''s another one. Note the blank line between rows.
    |


    An alternative syntax for tables uses plain text grids to separate columns. An
    example, with a header, looks like this:


    ```

    +---------------+---------------+--------------------+

    | Right         | Left          | Centered           |

    +==============:+:==============+:==================:+

    | Right         | Left          | Centered           |

    +---------------+---------------+--------------------+

    ```


    Result:


    | Right | Left | Centered |

    | Right | Left | Centered |


    Without headers, it looks like this:


    ```

    +--------------:+:--------------+:------------------:+

    | Right         | Left          | Centered           |

    +---------------+---------------+--------------------+

    ```


    Result:


    | Right | Left | Centered |


    For these types of headers, the colons determine the alignment. Put a colon at
    the end of the `=` or `-` of the cell-border to get right-aligned columns, at
    the left to get left-aligned columns, and at both ends to get centered columns,
    and leave them out for the default alignment.


    You can also use pipes, `|`, to specify the columns. Then, the syntax will look
    like this:


    ```

    | Right | Left | Default | Center |

    |------:|:-----|---------|:------:|

    |   12  |  12  |    12   |    12  |

    |  123  |  123 |   123   |   123  |

    |    1  |    1 |     1   |     1  |

    ```


    Result:


    | Right | Left | Default | Center |

    | 12 | 12 | 12 | 12 |

    | 123 | 123 | 123 | 123 |

    | 1 | 1 | 1 | 1 |


    ## Smart Punctuation


    Proper text typography uses different types of dashes—hyphens in words, en-dashes
    for numeric intervals, and em-dashes for parenthetical sentences and emphasis.
    Quotes are usually different at the beginning and end of a text in quotation marks.
    Three dots are different from ellipses. Many word editors will automatically substitute
    some dashes and translate straight quotes into the correct form, but not all.
    Since you are writing Markdown in plain text, and since most keyboards do not
    give you access to all typographic symbols, Pandoc can help you out with getting
    these symbols. To enable this, you need to call Pandoc with the option `--smart`
    (we see how to invoke Pandoc in Chapter 5).


    If you turn on smart punctuation, quotes will be handled correctly, three dots
    will be translated into ellipses, a single `-` will be a hyphen, two dashes will
    give you an en-dash, and three dashes will give you an em-dash.


    ## Footnotes


    You can insert footnotes in your text using a syntax resembling links and images.
    For footnotes, you need to add a caret (`^`). To put the footnote inside the text
    paragraph you are writing, you add a caret and then the footnote text in square
    brackets.


    ```

    Footnote inside a paragraph.^[This is the footnote.]

    ```


    Since footnotes tend to interfere with the main text, you can give them a label
    and add the text elsewhere. When you do this, you name the footnote and put the
    name in the main text.


    ```

    Reference to a footnote.[^footnotelabel]

    ```


    When you add a footnote this way, the caret has to go inside the brackets. If
    it goes before the brackets, you are adding the footnote inside the text.


    Somewhere the text you must define what a footnote label refers to. The syntax
    is the same as the one for defining links you can refer to inside the text, except
    that for defining footnotes the name must start with a caret.


    ```

    [^footnotelabel]: This is footnote two.

    If you want it to cover multiple lines, you

    have to indent the following footnote lines.

    by at least four spaces.

    ```


    The output of the two approaches should look like this: Footnote inside a paragraph.^([¹](#fn1))


    Reference to a footnote.^([²](#fn2))


