    command to the prefix and return the result. We put the LaTeX code in a `RawInline`
    object. This is similar to a `RawBlock` object but for inline text. We do not
    add a space here but a tilde.


    For other output formats, lines 17 to 25, we look up the exercise number from
    our map, assuming that there is an identifier, and then we add a space and the
