    如果您获取包含这些 `[@ref]` 引用的文件的 `native` 格式，您将得到一个复杂的文本，但您会看到我们有一个包含 `Citation` 元素的
    `Cite` 对象（可能不止一个，但我们这里只处理一个）。我们想要翻译这些元素。我们真正想要处理的是 `Citation`，但如果我们在其上过滤，我们将创建一个对象，该对象会进入包含它的
    `Cite` 中，因此我们将处理 `Cite` 对象并从中提取 `Citation` 对象。


    一个 `Cite` 对象包含几个属性，包括标识符（`@reference` 文本）、前缀（位于方括号内但引用之前的文本）和后缀（位于文本之后的文本）。这里我们只使用前缀和标识符，并忽略——实际上是移除——后缀。有关包含后缀的内容，请参阅练习部分。


    ```

    1   def handle_citations(elem, doc):

    2       if type(elem) == Cite:

    3           actual_cite = elem.citations[0]

    4           identifier = actual_cite.id

    5           if not identifier.startswith("ex:"):

    6               return elem


    8           prefix_text = actual_cite.prefix.list

    9           prefix_text.extend([Space, Str("exercise")])


    11           if doc.format == "latex":

    12               return actual_cite.prefix.list + [

    13                   RawInline(r"~\ref{" + identifier + "}",

    14                             "latex")

    15               ]


    17           if identifier in ex_dict:

    18               ex_num = ex_dict[identifier]

    19               prefix_text.extend([

    20                   Space, Str(str(ex_num))

    21               ])

    22           return [

    23               Link(*actual_cite.prefix.list,

    24               url = "#" + identifier)

    25           ]

    ```


    在过滤器的第一行，我们检查是否有一个 `Cite` 元素。这没什么新奇的。然后我们提取我们真正感兴趣的元素，它是一个 `Citation` 元素。


    我们获取标识符，即引用标签（第 4 行），并检查它是否是一个示例标签，即以 `"ex:"` 开头（第 5 行）。如果不是，我们返回该元素；我们不想修改其他引用对象，因为这些对象可能被其他过滤器使用。


    现在我们提取 `Citation` 对象的前缀；再次使用 `.list` 获取实际内容。我们在前缀中添加文本 `"exercise"`（第 9 行），这样引用也将包含此文本。我们需要添加一个空格以防止前缀与
    `"exercise"` 文本连接。我们还需要在 `"exercise"` 后面添加一个空格，但我在 LaTeX 输出中想要一个不间断空格，所以我想在那使用波浪号而不是空格（见下文）。


    我假设引用前面已经有一个空格，也就是说，引用看起来像 `[see @ex:ref]` 而不是 `[see@ex:ref]`；如果不是，我们需要在 `"exercise"`
    之前添加一个空格。我们还需要在引用之后添加它。否则，前缀和引用编号将会连接在一起。


    我们现在单独处理 LaTeX 输出（第 11 至 15 行）。我们将 `\ref{}` 命令附加到前缀并返回结果。我们将 LaTeX 代码放在一个 `RawInline`
    对象中。这与 `RawBlock` 对象类似，但用于行内文本。我们在这里不添加空格，而是添加一个波浪号。


    对于其他输出格式（第 17 至 25 行），我们根据映射查找练习编号，假设存在标识符，然后向前缀添加一个空格和该编号。我们在数字前添加一个空格，这样它就不会与
    `"exercise"` 连接。最后，我们从引用创建一个链接。

