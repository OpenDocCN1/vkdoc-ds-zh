    replaces `elem` with an empty block, effectively removing the solutions block,
    while the latter keeps `elem` as it is, that is, leaves the solutions block in
    the output. Finally, if `"solutions"` is in the metadata but not true, then we
    also remove the solutions block. The `solutions` metavariable can have more than
    true as a value, and those would be considered as true as well in the expression
    `meta["solutions"]`, so I explicitly check for `True`.


    If we do not get past the checks, we remove the solutions block. If the “solutions”
    is not set in the metadata, or if it is set to anything but `True`, we remove
    the block. Otherwise, we keep it by returning `None`.


    If the block is not a solutions block, if `"solutions"` is not set or set to anything
    except true, then we have a solutions block, and we are supposed to keep it.


    If we go back to the example Markdown


    ```

    Here is an exercise. Everyone can see it.

    ::: SOLUTION :::

    Here is a solution to the exercise.

    Do not give it to the students.

    :::

    ```


    then we can check how Pandoc reacts when the metavariable `"solutions"` is set
    to false:


    ```

    pandoc --metadata solutions:false -F solutions.py \

    solutions.md --to markdown

    ```


    This is the result:


    ```

    Here is an exercise. Everyone can see it.

    ```


    The solutions block is removed in the output. The same happens if you do not set
    the metavariable or if you set it to any other value, except true. If you do set
    it to true


    ```

    pandoc --metadata solutions:true -F solutions.py \

    solutions.md -- to markdown

    ```


    the solution block is included.


    ```

    Here is an exercise. Everyone can see it.

    ::: {.SOLUTION}

    Here is a solution to the exercise.

    Do not give it to the students.

    :::

    ```


    Pandoc uses this syntax in its output, but you can use either of the two ways
    to define a Div block.'
