    \ HTML、PDF 或 Word 文档。由于编写文本和格式化文本是分开的步骤，你可以将一个或多个文本文档应用于同一个转换程序，从而为相关文档获得一致的外观；或者，你也可以将同一文档转换为多种输出格式，例如使同一文档既能用于网页，也能用于印刷书籍。大多数\
    \ WYSIWYG 编辑器都可以导出为不同格式，但它们通常无法让你以不同的格式输出到同一文档类型，例如，输出 PDF 文件时，分别采用 A4、6 英寸×9\
    \ 英寸和 7 英寸×10 英寸三种尺寸，前两种使用 11 磅字号，最后一种使用 12 磅字号。使用标记语言，这相对容易实现。\n\n在各类标记语言中，Markdown\
    \ 即使不是最简单的，也是其中之一。你添加到文本中的注释极少，而且如果你偶尔使用纯文本文件，很可能已经见过其中大部分注释。例如，在 Word 中你会使用斜体或粗体，而在\
    \ Markdown 中你会写成`*斜体*`和`**粗体**`，你很可能之前就见过这种表示法。在我误入歧途的青年时代，我曾频繁使用 TeX/LaTeX 和\
    \ HTML/SGML/XML。我认识一些人，如果文本中充满了标记信息，他们就无法集中注意力。而在 Markdown 中，标记注释几乎不可见，因此他们使用起来毫无问题。借助\
    \ Markdown，你可以生成其他标记语言的文档，因此你无需了解这些语言。如果你希望完全按照自己的想法来格式化文档，我仍然建议你学习其他语言。你可以利用这些知识来创建模板（见第`9`章），然后在编写模板时只需要使用，例如，`LaTeX`或`HTML`。之后，你仍然可以将文档保留在\
    \ Markdown 中。一个例外情况是，如果你需要在文档中编写数学公式，你仍然需要使用`LaTeX`；具体请参见第`6`章。\n\n你需要一个程序将 Markdown\
    \ 转换为其他文件格式。本书将使用的工具是`Pandoc`。`Pandoc`支持基础 Markdown 以及多种扩展。它还允许你定义模板和样式表，以自定义转换后的文件。`Pandoc`的功能远不止将\
    \ Markdown 文件转换为不同的输出文件。它还可以在多种格式之间进行相互转换。本书仅介绍如何从 Markdown 转换为其他格式。例如，如果你有一个现成的\
