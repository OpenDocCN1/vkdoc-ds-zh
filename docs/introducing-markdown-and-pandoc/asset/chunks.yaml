- fmt: "# Lists\n\nYou have two kinds of lists: numbered and unnumbered. To create\
    \ a numbered list, you put a number, followed by a period, at the start of a line\
    \ and write the list item after it. For the next list item, you go to the next\
    \ line, add another number, followed by a dot, and write the next item text. An\
    \ example could look like this:\n\n```\n1\\. This is a numbered list.\n2\\. Where\
    \ this is list item two.\n3\\. And this is list item three.\n```\n\nThe result\
    \ will look like this:\n\n1.  This is a numbered list.\n2.  Where this is list\
    \ item two.\n3.  And this is list item three.\n\nThe actual numbers are ignored,\
    \ so you can get the same result if you wrote:\n\n```\n10\\. This is a numbered\
    \ list.\n51\\. Where this is list item two.\n42\\. And this is list item three.\n\
    ```\n\nIf you want your list items to span multiple lines, you need to indent\
    \ the lines following the number, like this:\n\n```\n1\\. This is a multi-line\
    \ list item.\nThis is also part of the list item.\nAnd so is this\n2\\. Here is\
    \ another one.\nWhere this is also part of the list item.\n```\n\nDoing that will\
    \ give you this list:\n\n1.  This is a multi-line list item. This is also part\
    \ of the list item. And so is this.\n2.  Here is another one. Where this is also\
    \ part of the list item.\n\nFor unnumbered lists, you use an asterisk or a dash\
    \ instead of numbers; so you can write an unnumbered list like this:\n\n*   This\
    \ is a numbered list\n*   Where this is list item two\n*   And this is list item\
    \ three\n\n```\n* This is a numbered list\n- Where this is list item two\n* And\
    \ this is list item three\n```\n\nAs you can see, you can mix asterisks and dashes,\
    \ or stick to any of the two you prefer. How the list is formatted when you create\
    \ a document is determined by the stylesheet and not which symbol you use to create\
    \ the list.\n\nIf you want to have sublists under a list item, you can do this\
    \ by indenting the lines for the sublists. So you can write a list with a sublist\
    \ like this:\n\n```\n* This is a top-level list item\n* Here is a sublist item\n\
    * Here is another\n* Now we are at the top level again.\n```\n\nJust add sufficient\
    \ spaces to put the sub-items under the enclosing item. The result will look like\
    \ this:\n\n*   This is a top-level list item\n    *   Here is a sublist item\n\
    \    *   Here is another\n*   Now we are at the top level again.\n\nWhen you indent,\
    \ you need at least four spaces or a tab per level.\n\n# Block Quotes\n\nShould\
    \ you need to add a quote to your text, you put a `>` before the quoted text.\n\
    \nSo you can write:\n\n```\n> This is a blockquote. The blockquote\n> can span\
    \ multiple lines. If you don't\n> put any new lines in it, you only\n> need to\
    \ put the \">\" at the beginning\n> of the line.\n> If you want multiple lines\
    \ where you\n> include new lines, you should add\n> the \">\" to each line.\n\
    ```\n\nThe result will look like this:\n\n> This is a blockquote. The blockquote\
    \ can span multiple lines. If you don’t put any new lines in it, you only need\
    \ to put the `>` at the beginning of the line. If you want multiple lines where\
    \ you include new lines, you should add the `>` to each line.\n\n# Verbatim Text\n\
    \nSometimes, you don’t want any formatting at all of a text; you want to leave\
    \ it verbatim as it is. When you want this, you can indent it with a tab (or four\
    \ spaces). You can write this:\n\n```\nThis will be shown\nabsolutely verbatim\n\
    ```\n\nThe result will then look like this:\n\n```\nThis will be shown\nabsolutely\
    \ verbatim\n```\n\nSometimes, you also want to add verbatim text inline in a paragraph.\
    \ To achieve this, simply put the verbatim text in backticks. So you can write\
    \ `` `'this'` `` to achieve `this`.\n\n# Links\n\nMarkdown was initially written\
    \ to make it easier to write content for web pages. Consequently, it has built-in\
    \ syntax for inserting hypertext links. These will work both with links to web\
    \ pages and for cross-references within your text.\n\nYou have two options for\
    \ specifying a link: you can put the destination URL where you insert the link,\
    \ or you can create a label and map it to the URL so you can refer to the label\
    \ when you insert a link. To put the URL where you insert the link, you put the\
    \ text you want to be the link in square brackets and the destination URL for\
    \ the link in round parentheses right after. You would write a text like this:\n\
    \n```\nThis is a link to [my blog](http://www.mailund.dk).\n```\n\nThis is fine\
    \ for most cases, but if you have many links in a paragraph, then the link annotations\
    \ start interfering with how easy it is to read the text. Instead, you can give\
    \ the destinations a shorter name and put the destination later in the text. To\
    \ do this, you replace the round parentheses with square brackets, like this:\n\
    \n```\nThis is a link to [my blog][blog].\n```\n\nThen, later in the text, you\
    \ define what the link should point to like this:\n\n```\n[blog]: http://www.mailund.dk\n\
    ```\n\nYou use the same syntax to make hypertext links within your document. The\
    \ simplest way to create a link to a section is to leave out the destination but\
    \ put the name of the section in square brackets. A link to this chapter would\
    \ then be written like this:\n\n```\nThis is a link to the [Writing Markdown]\
    \ chapter.\n```\n\nThis, of course, will not work if you want the link to contain\
    \ a different text than the section name, or if you have several sections with\
    \ the same name. You can work around this by giving the section headers explicit\
    \ labels. These, you put in curly brackets after the section header. You can assign\
    \ a label to a header like this:\n\n```\n# My header {#header}\n```\n\nThe hashtag\
    \ is needed here and is also necessary when linking to the section. The hashtags\
    \ are used in HTML to refer to sections of a web page, and it is from there that\
    \ Markdown gets its syntax. To link to the section we have labeled this way, we\
    \ would write the link like this:\n\n```\nThis is a link to [the section](#header).\n\
    ```\n\nLinks are only handy for hypertext documents, and in standard Markdown,\
    \ you cannot make cross-references to figures or tables or any non-section elements.\
    \ In Pandoc you can, using an extension, but we cover that in Chapter [7](#486315_1_En_7_Chapter.xhtml).\n\
    \n# Images\n\nTo insert figures in your document, you use a syntax similar to\
    \ inserting links. The difference is that you need to put a bang, `!`, before\
    \ the link.\n\n```\n![Title of the figure](URL-to-figure)\n```\n\nTypically, you\
    \ will have the figures as local files and there you use the path to the figure\
    \ file, either relative to where you build your document or as an absolute path.\n\
    \n```\n![Title of the figure](path-to/my-figure)\n```\n\n# Exercises\n\nIn the\
    \ following text are a few exercises where you can test yourself on the material\
    \ covered previously. If you use an editor that can immediately show you the result\
    \ of a Markdown text, then test your results there. Otherwise, put your answers\
    \ aside until we have covered how to format Markdown in Chapter [5](#486315_1_En_5_Chapter.xhtml).\n\
    \n## Sections\n\nWrite a document with three level-two sections and with two level-three\
    \ sections inside each. Remember that the number of `#` determines the section\
    \ level. Make them both numbered and unnumbered.\n\n## Emphasis\n\nWrite `*this*\
    \ **text** in *Markdown*`.\n\n## Lists\n\nTake the three items\n\n*   one item\n\
    *   two items\n*   three items\n\nand write them as a numbered and an unnumbered\
    \ list.\n\nNow, put\n\n*   four items\n*   five items\n\nas a sublist under `one\
    \ item`.\n\n## Block Quotes\n\nMake the following text a block quote:\n\n```\n\
    This is a text that we want to put in block quotes.\nYour task is to do this.\n\
    ```\n\n## Links\n\nWrite a text and insert a link to a web page and to a section\
    \ in your text.\n\n## Images\n\nFind an image file and insert it into a text."
