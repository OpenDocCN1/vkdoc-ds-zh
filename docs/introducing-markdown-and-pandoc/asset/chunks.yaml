    \ 语言允许你编写纯文本文档，并添加少量轻量级注释来指定文档的格式要求。这些注释正是标记语言的显著特征。标记语言将文档的语义或内容部分与文档的格式分离开来。文档的内容包括文本本身、哪些应为标题、哪些应被强调等等。格式则指定字体和字号、标题是否编号等。\n\
