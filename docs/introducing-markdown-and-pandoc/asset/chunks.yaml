    用于创建映射的过滤器很简单，如下所示：


    ```

    ex_dict = {}

    no_exercise = 1

    def collect_numbers(elem, doc):

    global no_exercise

    if type(elem) == Div and \

    "Exercise" in elem.classes:

    if elem.identifier:

