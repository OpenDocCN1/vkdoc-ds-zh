    我们使用一个全局变量 `no_exercise`（第 3 行）来递增每个练习的标题编号。在过滤器内部，我们首先检查是否有一个带有 `Exercise` 类的
    `Div` 块。如果是，我们从 `doc` 元素（第 10 行）获取 `meta` 对象，并使用它来检查其输出格式是 LaTeX 还是 HTML。如果是 LaTeX（第
