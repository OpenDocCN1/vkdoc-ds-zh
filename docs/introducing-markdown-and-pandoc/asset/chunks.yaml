- fmt: "# Referencing Figures, Tables, and Equations\n\nTo reference figures, you\
    \ use the same syntax as for sections, except for where you define figure labels\
    \ and the prefix of the labels. To define a label for a figure, you must give\
    \ it the prefix `#fig:` and place the label right after the markup for inserting\
    \ the figure, so using the syntax:\n\n```\n[Caption](link-to-figure){#fig:label}\n\
    ```\n\nYou cannot put a space between the figure insertion and the label definition.\
    \ You refer to figure labels as you would with references to sections.\n\nFor\
    \ tables, your labels must start with `#tbl:` and be placed after the table caption:\n\
    \n```\na   b   c\n--- --- ---\n1   2   3\n4   5   6\n: Caption {#tbl:label}\n\
    ```\n\nFor tables you *must* have a space between the caption and the label.\n\
    \nFor display-style math, math that stands on a line of its own and is written\
    \ with two dollar signs, you can add labels if they begin with `#eq:` and are\
    \ put on the same line as the math with a space between the label and the terminating\
    \ double dollar signs:\n\n```\n$$ f(x) = x^2 + a x $$ {#eq:label}\n```\n\nYou\
    \ can change the default prefix for figures, tables, and equations, as you can\
    \ for sections, with the metadata `figPrefix`, `tblPrefix`, and `eqnPrefix`, respectively.\n\
    \nFor more details on how to use the cross-reference filter, I will refer to its\
    \ online manual.^([⁹](#fn9))\n\n## Bibliographies\n\nIf your text requires citations\
    \ and a bibliography, you can enable the filter `pandoc-citeproc` by either running\
    \ Pandoc with the `--bibliography` option or using `--filter pandoc-citeproc`.\n\
    \nIf you use both `pandoc-crossref` and `pandoc-citeproc` filters, you must always\
    \ use `pandoc-crossref` first:\n\n```\npandoc --filter pandoc-crossref \\\n--filter\
    \ pandoc-citeproc ...\n```\n\nThe two filters use similar kinds of citation syntax,\
    \ and this means that the order in which you run the filters matters. The `citeproc`\
    \ filter gets confused if it sees cross-reference labels. The same does not happen\
    \ if you run the cross-reference filter first; it will leave the citation codes\
    \ alone so they can be handled by the citation filter.\n\nWith the `--bibliography`\
    \ option, you need to specify the file that contains your bibliography. Using\
    \ `--filter pandoc-citeproc`, you can specify the bibliography file as metadata\
    \ in your YAML header instead, for example:\n\n```\n---\nbibliography: citations.bib\n\
    ---\n```\n\nThe `pandoc-citeproc` filter can read bibliographies in various file\
    \ formats and will pick the format based on the file suffix. With `.bib` files\
    \ it will use BibTeX. For EndNote you would use `.enl` and for ISI `.wos`. Check\
    \ the online documentation^([^(10)](#fn10)) for a complete list.\n\nTo control\
    \ the format used for citations and the bibliography, you can specify a CSL^([^(11)](#fn11))\
    \ file with the metadata variable `csl` or the Pandoc option `--csl`. CSL files\
    \ for most journal styles can be downloaded from GitHub.^([^(12)](#fn12))\n\n\
    For example, if `smith12` is a key in your bibliography, you can insert a citation\
    \ using `[@smith12]`. You need to include `@` even though it isn’t part of the\
    \ reference key; the filter (and Pandoc) uses this to recognize citations. You\
    \ can cite more than one reference by separating the references with semicolons:\
    \ `[@smith12; @smith14]`.\n\nDepending on the citation style, the inserted reference\
    \ might contain author names. This doesn’t read well if you have already mentioned\
    \ authors in the text, and you can disable it with a minus before the reference:\
    \ `[-@smith12]`. The same effect is achieved by leaving out the square brackets\
    \ and writing `@smith12`.\n\nMore generally, you can insert text in the citations\
    \ to add, for example, page information or other comments, such as `[see @smith12,\
    \ chap1; also @smith14, chap 12]`. If you leave out the square brackets to get\
    \ an in-text citation, you can add comments to appear inside the parenthesis (again,\
    \ depending on your citation style) by writing the comments in square brackets\
    \ after the reference: `see @smith12 [chapter 11]`.\n\nThe bibliography will be\
    \ put at the end of your document. If you want to give the bibliography a section\
    \ header, you should end your Markdown document with the header for the bibliography.\n\
    \n## Exercises\n\n### Reference Sections\n\nWrite three sections. In two and three,\
    \ refer back to one and two, respectively.\n\n### Figures, Tables, and Equations\n\
    \nWrite a document with each of a figure, a table, and an equation. Make references\
    \ to each.\n\n### Bibliographies\n\nIf you have a bibliography, then make a document\
    \ that cites the elements in it.\n\nFootnotes [1](#486315_1_En_7_Chapter.xhtml#Fn1_source)\
    \ [2](#486315_1_En_7_Chapter.xhtml#Fn2_source) [3](#486315_1_En_7_Chapter.xhtml#Fn3_source)\
    \ [4](#486315_1_En_7_Chapter.xhtml#Fn4_source) [5](#486315_1_En_7_Chapter.xhtml#Fn5_source)\
    \ [6](#486315_1_En_7_Chapter.xhtml#Fn6_source) [7](#486315_1_En_7_Chapter.xhtml#Fn7_source)\n\
    \n# Metadata\n\nIf you go back and look at the standalone HTML document we looked\
    \ at in Chapter [5](#486315_1_En_5_Chapter.xhtml), the document was this:\n\n\
    ```\n# This is a test document\nHere is some text in the document.\n* This is\
    \ a list\n* With two items\n```\n\nWe compiled it like this:\n\n```\npandoc --standalone\
    \ -o output.html input.md\n```\n\nYou should get the warning:\n\n```\n[WARNING]\
    \ This document format requires a nonempty\n element.\nPlease specify either 'title'\
    \ or 'pagetitle' in\nthe metadata,\ne.g. by using --metadata pagetitle=\"...\"\
    \ on the\ncommand line.\nFalling back to 'input'\n```\n\nAnd the title in your\
    \ document will then, just as the warning says, look like this:\n\n```\ninput\n\
    ```\n\nPandoc inserted a title to your document, but it is set to a default value,\
    \ `input`, because we didn’t specify it. Try running this command instead:\n\n\
    ```\npandoc --metadata title=\"My Title\" \\\n--standalone -o output.html input.md\n\
    ```\n\nIf you now read the `output.html` file, you will see that Pandoc has inserted\
    \ \"My Title\" between the title tags and inserted a level-one header that says\
    \ \"My Title\".\n\nWhen Pandoc generates a standalone document, it uses metadata\
    \ such as title and author(s) to fill in some information. This data is usually\
    \ not specified in the Markdown input — there aren't any Markdown annotations\
    \ for defining such metadata — but you can set it using the `--metadata` option\
    \ or using YAML (see the following text).\n\nStrictly speaking, there are two\
    \ types of variables that are used when producing the output: metadata, specified\
    \ with `--metadata`, and variables, specified with `--variable`. The difference\
    \ between them is that metadata can be seen and processed by Pandoc and Pandoc\
    \ filters — scripts that process your input before it is formatted for the output\
    \ — while variables are used in templates. If you set a variable using the `--metadata`\
    \ tag, or in a metadata header, the variable will also be available to templates,\
    \ so you can usually stick to metadata. The output isn't *exactly* the same since\
    \ filters might do something with metadata that they won't do with variables,\
    \ but it is easier to stick with one kind of options. So unless you have good\
    \ reasons not to, use metadata."
