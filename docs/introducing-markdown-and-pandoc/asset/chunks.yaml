    element (line 10) and use it to check if its output format is LaTeX or HTML. If
    it is LaTeX (line 12), then we get the metavariable `exercise_env` (with `exercises`
    as default), and we create a new block as a replacement for the `Div` block.


    The `RawBlock` is just verbatim text but only inserted if the output format is
    “latex.” Of course, we know that the output is LaTeX here and we could leave out
    the argument, but in other cases, a `RawBlock` can be useful when you output roughly
    the same text for all output formats and do not want to check for the output format.


    For all other formats (line 24 and below), we use a default level of 1 and otherwise
    use the metavariable `exercise_header_level` (lines 26 and 27). We create the
