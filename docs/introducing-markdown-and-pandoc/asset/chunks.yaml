    # 10. 预处理


    Markdown 只是一个纯文本文档，你可以在将其传递给 `Pandoc` 之前对文本进行任何重写。在将文本交给 `Pandoc` 之前对其进行的任何重写都称为*预处理*。`Pandoc`
    会从标准输入读取内容，因此我们可以将预处理的结果通过管道传递到命令行中的 `Pandoc`（参见图 10-1）。


    假设预处理器将输入文件作为输入，并将其输出写入标准输出，那么管道可以如下所示：


    ```bash

    preprocessor infile.md | \

    pandoc --from markdown ... -o outfile

    ```


    你需要告诉 `Pandoc` 它从标准输入接收的是 Markdown 格式，可以通过 `--from` 选项来实现这一点。


    只要预处理器输出的文件是 `Pandoc` 能够处理的，它就可以执行你希望的任何操作。输出不必是 Markdown 格式——如果不是，你可以更改 `--from`
    选项——但它必须是 `Pandoc` 能够读取的格式。在接下来的内容中，我将使用 Markdown 作为输出格式。


    ![../images/486315_1_En_10_Chapter/486315_1_En_10_Fig1_HTML.png](img/486315_1_En_10_Fig1_HTML.png)


    图 10-1：包含预处理步骤的文档格式化管道


    ## 示例


    在以下示例中，前两个将使用 `GPP`^(¹⁶)，最后一个将使用 `Python`^(¹⁷)。`GPP` 是一个功能相对有限的预处理器，但在包含文件以及选择性地包含或排除文件片段方面，它表现得非常出色。让
    `Python` 实现相同的功能则需要更多工作。另一方面，由于 `Python` 是一种通用编程语言，我们可以让它对输入文档执行任何我们想要的操作。


    ### 包含文件


    使用预处理器的一个场景是，将一些可以在多个文件中重复使用的信息放在一些文件中，而将特定于文档的输入（如文档正文）放在另一个文件中。这正是模板的概念，但在其他情况下我们可能也会有类似的设置。


    想象一下，你正在教一个班级，并且每周都会布置练习。一些信息，例如班级名称和讲师姓名，每周都不变，但其他信息会变，例如周次。


    我们可以创建一个包含通用信息的 `header.yml` 文件：


    ```yaml

    class: Markdown and Pandoc

    instructor: Thomas Mailund

    ```


    当然，这里的头部信息是人为简化的。你只想包含一个具有一定复杂性的文件，但示例展示了基本原理。


    对于特定的一周，我们可以指定该周的信息，例如周次和该周的实际练习。这是一个文件；我们称之为 `exercises.md`。它包含该班级第 14 周的练习。


    ```markdown

    #include "header.yml"

    week: Week 14


    # 这是一个练习

    做点难的事情

    # 这是另一个练习

    做点更难的事情

    ```


    `#include "header.yml"` 就是预处理器发挥作用的地方。


    请注意，界定 YAML 规范的三个短横线*不*在 `header.yml` 中。如果它在里面，那么我们就无法包含它，并且仍然在 `exercises.md`
    文件中设置 `week` 变量。当我们将其包含到 YAML 头部时，我们可以将 `header.yml` 中设置的通用变量与特定于文件的变量结合起来。


    如果我们通过预处理器传递文档：


    ```bash

    gpp < exercises.md

    ```


    我们会得到以下结果：


    ```yaml

    class: Markdown and Pandoc

    instructor: Thomas Mailund

    week: Week 14


    # 这是一个练习

    做点难的事情

    # 这是另一个练习

    做点更难的事情

    ```


    我们可以将其与模板结合使用：


    ```latex

    \documentclass{article}

    \usepackage{hyperref}

    \title{$class$: $week$}

    \author{$instructor$}

    \begin{document}

    \maketitle

    \end{document}

    ```


    现在，将预处理器和 `Pandoc` 结合起来，我们就可以构建一个包含练习的文档：


    ```bash

    gpp exercises.md | \

    pandoc --template exercises.tex \

    --from markdown \

    -o exercises.pdf

    ```

