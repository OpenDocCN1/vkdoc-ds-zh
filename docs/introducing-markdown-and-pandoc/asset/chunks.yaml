  trans: "\n### 列表\n\n编写一个包含五个项目的列表。在第二项和第三项之间，添加一段文字，但确保编号从第四项继续。\n\n为第三项添加一个标签，并在第五项中引用它。同时创建一个定义列表，使其支持多行。\n\
    \n### 表格\n\n制作一个三列表格，其中第一列左对齐，第二列居中对齐，第三列右对齐。\n\n编写一个带标题的表格。在下一章我们使用`Pandoc`格式化\
    \ Markdown 之前，你将看不到最终效果，但请保留这段文本，以便届时进行测试。\n\n### 脚注\n\n编写一段包含脚注的文字。分别使用脚注的两种标记方式。\n\
    \n脚注 1 2\n\n# 5. 翻译文档\n\n当我们用 Markdown 编写好文档后，需要使用`Pandoc`将其翻译成其他文件格式。不过，首先需要下载`Pandoc`。请访问\
    \ Pandoc 的安装指南[`http://pandoc.org/installing.html`](http://pandoc.org/installing.html)，并按照适用于你平台的说明进行操作。\n\
    \n## 使用 Pandoc 格式化 Markdown 文档\n\n在第一个示例中，我们可以用下面这个简短的 Markdown 文档：\n\n```\n#\
    \ 这是一个测试文档\n文档中的一些文本。\n* 这是一个列表\n* 包含两个项目\n```\n\n如果将此 Markdown 文档保存为名为`input.md`的文件，我们可以使用以下命令将其转换为\
    \ HTML 文件`output.html`：\n\n```\npandoc -o output.html input.md\n```\n\n`-o`选项指定输出文件。`input.md`文件在指定时无需任何选项。输入文件不需要任何选项，并且你可以提供多个输入文件。如果提供多个输入文件，Pandoc\
    \ 在处理它们之前会先将其拼接在一起。因此，如果你想将分别写在多个文件中的几个章节组装成一本书，只需在命令行中按章节在书中出现的顺序提供这些文件即可。\n\n\
    `Pandoc`会根据文件扩展名识别输入和输出格式。因此，如果你使用上述命令，它会识别出输入是 Markdown（文件后缀`.md`），输出应为 HTML（文件后缀`.html`）。你还可以显式指定输入和输出格式。可以使用`--from`选项指定输入格式，使用`--to`选项指定输出格式。在大多数情况下，你无需指定格式——文件名已包含全部所需信息——但有时不同格式会共享相同的文件后缀，例如\
    \ EPUB 和 EPUB3 格式都使用文件后缀`.epub`。在这种情况下，你就需要用到这些选项了。\n\n如果你指定了输入和输出文档格式，还可以将`pandoc`视为一个可接受管道输入并输出格式化文档的程序。例如，你可以这样写：\n\
    \n```\ncat input.md | \\\npandoc --from markdown --to html \\\n> output.html\n\
    ```\n\n这种做法本身用途不大，但结合预处理（第 10 章）和过滤器（第 11 章）后，就会变得非常方便。\n\n回到`pandoc`的输出。如果你在终端中运行之前的命令：\n\
    \n```\npandoc -o output.html input.md\n```\n\n那么`output.html`文件现在应包含以下 HTML 内容：\n\
    \n```\n这是一个测试文档\n\n文档中的一些文本。\n\n这是一个列表\n包含两个项目\n```\n\n如果你不熟悉 HTML，可能看起来不太容易理解，但我希望你至少能识别出输入\
    \ Markdown 中的元素。\n\n这段 HTML 并非一个完整的 HTML 文件。它只是对应 Markdown 文档的一个 HTML 片段，缺少完整\
    \ HTML 页面所需的页眉和页脚标记。默认情况下，Pandoc 生成的 HTML 标记可以添加到网页中，但不能作为独立文档使用。要同时添加页眉和页脚，你可以使用`--standalone`选项。\n\
    \n```\npandoc --standalone -o output.html input.md\n```\n\n如果你想要生成一个完整的文档，`--standalone`选项对于\
    \ HTML 输出是必需的。如果你选择的输出格式通常不以片段形式存在（例如 PDF 文档（后缀`.pdf`）、EPUB 文档（后缀`.epub`或`.epub3`）或\
    \ Word 文件（后缀`.docx`）），Pandoc 会自动创建完整文档，此时不需要`--standalone`选项。\n\n如果你运行`pandoc\
    \ --standalone -o output.html input.md`，你会收到一条警告：\n\n```\n[警告] 此文档格式需要一个非空元素。\n\
    请在元数据中指定'title'或'pagetitle'，\n例如，在命令行中使用 --metadata pagetitle=\"...\"。\n回退为'input'\n\
    ```\n\n但尽管有警告，你仍然会得到一个包含所有必要元素的 HTML 文档：\n\n```\n<!DOCTYPE html>\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\" lang=\"\" xml:lang=\"\">\n<head>\n  <meta charset=\"\
    utf-8\" />\n  <meta name=\"generator\" content=\"pandoc\" />\n  <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=yes\"\
    \ />\n  <title>input</title>\n  <style>\n    code{white-space: pre-wrap;}\n  \
    \  span.smallcaps{font-variant: small-caps;}\n    span.underline{text-decoration:\
    \ underline;}\n    div.column{display: inline-block; vertical-align: top; width:\
    \ 50%;}\n  </style>\n</head>\n<body>\n<h1 id=\"this-is-a-test-document\">这是一个测试文档</h1>\n\
    <p>文档中的一些文本。</p>\n<ul>\n<li>这是一个列表</li>\n<li>包含两个项目</li>\n</ul>\n</body>\n</html>\n\
    ```\n\n这里的通用 HTML 代码比我们的文本多得多，但幸运的是我们无需为此担心；我们可以专注于 Markdown，而让 Pandoc 处理其余部分。\n\
    \n我们收到的警告与这行中获得的标题有关：\n\n```\n<title>input</title>\n```\n\nPandoc 只是从输入文件中获取了名称，但它原本期望得到显式提供的标题。你可以使用元数据来实现这一点；请参见第\
    \ 8 章。现在先忽略它。\n\n你可以尝试使用以下命令生成不同的输出格式：\n\n```\npandoc -o output.pdf input.md\n\
    pandoc -o output.docx input.md\npandoc -o output.epub input.md\npandoc --to=epub3\
    \ -o output.epub input.md\n```\n\n在最后一个示例中，我们明确指定输出中使用的 EPUB 格式为 EPUB3。\n\n另一个可能需要指定`--to`格式的情况是\
    \ PDF。默认情况下，Pandoc 会使用 LaTeX 创建 PDF 文件，但你可以通过以下命令指定它改用 ConTeXt：\n\n```\npandoc\
    \ --to=context -o output.pdf input.md\n```\n\n要获取支持的输入和输出格式的完整列表，请分别运行以下命令：\n\n\
    ```\npandoc --list-input-formats\n```\n\n和：\n\n```\npandoc --list-output-formats\n\
    ```\n\nPandoc 可以在多种不同的输入和输出格式之间进行转换，但在本书中，我们只考虑 Markdown 输入以及如何将 Markdown 转换为其他格式。\n\
    \n## 常用实用选项\n\n你可以使用许多选项来影响 Pandoc 转换文档的方式。完整列表请参考在线手册³。这里，我将列出一些在我自己的写作中觉得特别有用的选项。\n\
    \n### 节与章\n\n首先，我们考虑与节解释方式相关的选项。在 Markdown 中，我们通过井号的数量来指定不同级别的节标题，但在生成文档时，我们有时需要考虑顶级结构是部分、章还是节。如果我们写的是简短报告或论文，我们希望一级标题开始新的节；但如果我们写的是书，我们希望它们开始新的章。默认行为取决于我们生成的输出格式，Pandoc\
    \ 会为我们做一些猜测，但你可以使用`--top-level-division`选项显式选择顶级结构。对于我的书籍，我希望一级标题作为章标题，因此我使用`--top-level-division=chapter`。\n\
    \n### 目录\n\n要为输出文档添加目录，可以使用`--toc`选项或`--table-of-contents`选项；前者只是后者的缩写形式。你可以使用`--toc-depth`选项指定目录中包含的标题级别。在制作电子书时，我通常只需要章级别的目录，因此我使用`--toc-depth=1`。在制作\
    \ PDF 时，我接受默认设置。你可以尝试不同的选项值，看看哪种更符合你的偏好。\n"
- fmt: '### Image Extensions


    If you want to produce both PDFs and ebooks from your Markdown input, you might
    want to use PDF vector graphics for figures for the PDF output but bitmap PNG
    for the ebook version. Using bitmap graphics for the PDF output means you have
    to worry about the resolution, but using PDF graphics for ebooks doesn’t always
    work. When you insert images into your document using the


    ```

    ![Figure caption](graphics-file)

    ```


    syntax, you need to specify the input file name, but if you want to produce both
    ebooks and PDFs, you don’t want to have to change all the file names depending
    on which output format you are producing.


    You can leave out the filename suffix for graphics files and specify the desired
    suffix using the


    ```

    --default-image-extension

    ```


    option instead. Then, for any graphics file where you haven’t explicitly written
    the filename suffix, Pandoc will use the default. I always use


    ```

    --default-image-extension=pdf

    ```


    when producing PDF documents and


    ```

    --default-image-extension=png

    ```


    when producing ebooks .


    ### Ebook Covers


    Ebooks contain cover images together with their text. If you produce ebooks, you
    want to specify the cover image as well. You can do this using the `--epub-cover-image`
    option. If your cover image is in the file `cover.png`, you write


    ```

    --epub-cover-image=cover.png

    ```


    ## Using Makefiles


    For this book, I have all my text in a single `book.md` document. This is fine
    for a short book like this one, but usually, I keep each chapter in a separate
    file. The command line for compiling my books can get rather long, and I often
    have various options for different output formats that I need to remember, so
    if I had to use the command line each time I wanted to build a new version of
    a book, it would quickly become tedious and extremely error-prone. So I use Make
    ( `https://tinyurl.com/nyc2ec2` ) for compiling my books.


    If you are not familiar with Make, I will give you sufficient detail for to read
    the Makefile I give as an example, and maybe a starting point for your own Pandoc
    Makefile, but introducing Make in full detail is beyond the scope of this book.
    Many programs solve the same problem that Make does, so there are alternatives
    to choose from if you do not like Make.


    The Makefile I use is not sophisticated and it suffices to know this:


    1.  You define a variable by writing `VARIABLE_NAME := VALUES`.

    2.  You refer to the value that a variable holds using `$(VARIABLE_NAME)`.

    3.  When you write `target: dependencies` you say that of you want to have `target`
    and then, if any of the dependencies have changed since lasts time you constructed
    `target` then you need to construct it again. If dependencies of dependencies
    have changed, then you need to build the dependencies and then the target. And
    so on.

    4.  The lines after `target: dependencies` that are indented by a tab are the
    instructions your computer needs to make `target`.

    5.  The first `target: dependencies` line in the Makefile is the target that Make
    will handle if you do not provide another target on the command line.


    The Makefile I use for this book looks roughly like this (although I have left
    out a few options). I will walk you through it here.


    ```

    CHAPTERS := header.yml book.md

    PANDOC := pandoc

    OPTS_ALL := --toc --smart \

    --top-level-division=chapter

    PDF_OPTS := $(OPTS_ALL) \

    --default-image-extension=pdf

    EPUB_OPTS := $(OPTS_ALL) \

    --default-image-extension=png \

    -t epub3 --toc-depth=1 \

    --epub-cover-image=cover.png

    all: book.pdf book.epub book.docx

    book.pdf: $(CHAPTERS) Makefile

    $(PANDOC) $(PDF_OPTS) -o $@ $(CHAPTERS)

    book.epub: $(CHAPTERS) Makefile

    $(PANDOC) $(EPUB_OPTS) -o $@ $(CHAPTERS)

    book.docx: $(CHAPTERS) Makefile

    $(PANDOC) $(PDF_OPTS) -o $@ $(CHAPTERS)

    clean:

    rm book.pdf book.epub book.docx

    ```


    I use a variable to hold the input files. Just the header and the single Markdown
    file in this case. You can specify metadata (see Chapter 8) on the Pandoc command
    line or in a YML file. You can put the metadata in your Markdown text, but then
    it has to be at the top of the input, and you cannot translate a single chapter
    without including the first one. I prefer to put my metadata in a separate file,
    which in this case is `header.yml`.


    I only have one Markdown file for this book. I am writing this in the Ulysses
    editor where I can split the book into different sections but export it as one
    combined file. Since the partition into chapters and sections is kept in Ulysses
    and not in separate files, I do not have a file per chapter.


    I put the input files in the variable `CHAPTERS`. If you have several, you can
    add it to the `CHAPTERS` variable. I keep the Pandoc command tool in a variable
    as well. I have more than one version installed, and I can switch between them
    by updating the variable. After that, I put the arguments that all Pandoc runs
    share in `OPTS_ALL` and then PDF and EPUB-specific options in `PDF_OPTS` and `EPUB_OPTS`.
    I make a Word document, but I can use the PDF arguments for this; Pandoc will
    know how to make a Word document with the same options as used for the PDF. Next
    is all the targets, dependencies, and commands for making the targets. The targets
    `all` and `clean` are special. The first doesn’t build anything; it just triggers
    a build of its dependencies—so it is indirectly building these—which are the three
    book formats the Makefile knows how to make. The `clean` target doesn’t have any
    dependencies, but it will delete the books we generate with the middle three commands.


    I then define some options I want to use for all output formats and then options
    that I only want to use for PDF and others I only want to use for ebooks. In the
    metadata I set for PDF output, I could also have put in the header—they wouldn’t
    interfere with the EPUB output if I did—but I have chosen to set them here.


    I build an EPUB book in the Makefile, but if you are planning to publish on iBooks,
    I do not recommend using this file. I find it much easier to format and submit
    a book using Pages. Pages can read the Word document, and that is how I usually
    submit a book to iBooks: I make a Word document, open it in Pages, and then submit
    it. You might think that building a book in the right format and then use iTunes
    Connect to submit it would be easier. You would be wrong. If you want to publish
    on Amazon (on Kindle Direct Publishing), you are also better of using their tool
    Kindle Create. Kindle Create can read the Word file, and you can submit from there.
    There is a command line tool that can translate from EPUB to the MOBI file format
    used on Kindle, but Kindle Create is easier to use.


    # 6. Math and Computer Programming Languages


    You might not be in the habit of writing technical or scientific text, but if
    you are, then Pandoc supports both mathematics and computer programming code formatting.'
