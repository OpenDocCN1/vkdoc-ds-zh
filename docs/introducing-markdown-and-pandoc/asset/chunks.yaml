    # 代码块选项


    这种显示代码的语法被许多网站支持，例如在 GitHub 上，人们经常在其中编写文本代码。你可以为代码显示方式提供更高级的指令，但这时需要采用一种略有不同的、更特定于
    Pandoc 的语法。具体来说，你需要在前三个反引号后的花括号内放置指令。你必须指定编程语言，并在名称前加一个点，例如，对于 Python 应写为 `.python`。然后，你可以使用指令
    `.numberLines` 为代码行编号：


    ```

    ```{.python .numberLines}

    for i in range(n):

    print(i)

    ```

    ```


    结果将如下所示：


    ```

    1   for i in range(n):

    2       print(i)

    ```


    你可以使用选项 `startFrom` 指定起始行号。要从第 100 行开始，我们可以这样写：


    ```

    ```{.python .numberLines startFrom=100}

    for i in range(n):

    print(i)

    ```

    ```


    结果将如下所示：


    ```

    100  for i in range(n):

    101      print(i)

    ```


    你可以为代码块指定一个标识符：


    ```

    ```{#my-code .python .numberLines}

    for i in range(n):

    print(i)

    ```

    ```


    这将使代码块成为一个超文本目标（即 HTML 中的锚点），因此你可以创建指向它的超文本引用。锚点 id 与标识符相同（不包括井号）。也就是说，在前面的示例中，它是
    `my-code`。你可以像在 Markdown 文档中引用其他引用一样引用该目标，例如：


    ```

    ```{#my-code .python}

    for i in range(n):

    print(i)

    ```

    请参见我的代码

    ```


    在 HTML 输出中，你也可以使用 `.lineAnchors` 选项使每一行都成为一个锚点。


    ```

    ```{#my-code .python .numberLines .lineAnchors}

    for i in range(n):

    print(i)

    ```

    ```


    行标识符由代码块 id 后跟行号组成。在这个例子中，两行分别为 `my-code-1` 和 `my-code-2`。


    在 HTML 输出中，所有以 `.` 开头的选项都将被添加到包含代码的 `<pre>` 块的 class 属性中。通过样式表，你可以轻松地让代码块的格式与众不同。在过滤器（见第
    11 章）中，你可以使用这些选项进行任意转换或计算。如果你开始大量使用代码块选项，需要牢记的一个关键点是：所有不带参数的选项


    ```

    .python

    .numberLines

    ```


    *必须*以点开头，而所有带参数的选项


    ```

    startsFrom=100

    ```


    *不能*以点开头。如果你违反了这些规则，Pandoc 将不会按你期望的方式工作。


    ## 语法高亮样式


    语法高亮方案由样式表的变体控制：HTML 输出使用层叠样式表 (CSS)，而 LaTeX（以及 PDF）输出使用一组 `\newcommand` 选项。这些高亮指令会直接放入输出文件中（生成独立文档时），因此不易覆盖。不过，你可以从预定义的高亮样式列表中选择。你可以通过运行以下命令查看完整列表：


    ```

    pandoc --list-highlight-styles

    ```


    你使用 `--highlight-style` 选项来选择样式。当我构建书籍的打印版本时，我需要黑白输出，因此我使用以下选项：


    ```

    pandoc --highlight-style=monochrome

    ```


    这会产生黑白高亮效果，使用斜体和粗体来显示不同的语言组件。你也可以在使用代码块时完全禁用语法高亮，使用 `--no-highlight` 选项即可。


