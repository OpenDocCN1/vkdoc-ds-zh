    # 交叉引用


    标准 Markdown 不直接支持交叉引用。Markdown 主要是为网页编写超文本文档而发明的，因此引用章节编号、图表或表格并非其功能的一部分。我们可以使用链接语法创建指向章节的超文本引用，但无法获取章节编号等信息。


    Pandoc 本身不支持其他类型交叉引用的扩展，但有一个名为 `pandoc-crossref` 的“过滤器”可以添加此支持。过滤器（见第 11 章）是在
    Pandoc 解析文档之后、生成输出格式之前运行的脚本，用于修改文档。过滤器超出了本书的讨论范围，但本章和下一章我们将使用其中的两个。


    `pandoc-crossref` 过滤器不一定会随 Pandoc 自动安装，因此你可能需要手动安装它。具体安装方式取决于你的平台。我在 MacOS 上工作，使用的是
    Homebrew^(⁶) 包管理器，因此我通过以下命令安装：


    ```

    brew install pandoc-crossref

    ```


    该过滤器是一个 Haskell 包，因此如果你安装了 Haskell 系统，也可以使用 `cabal` 包管理器来安装。


    ```

    cabal update

    cabal install pandoc-crossref

    ```


    这可能需要一些时间。


    如果你使用 Pandoc 发布页面的任何包^(⁷) 安装了 Pandoc，则该过滤器应该已经包含在内。如果以上方法都失败了，你可以从 pandoc-crossref
    主页^(⁸) 下载源代码并自行编译。


    要使用 Pandoc 处理文档时调用该过滤器，需使用 `--filter` 选项（或更短的选项 `-F`）。要启用 `pandoc-crossref` 过滤器，请以如下方式运行
    Pandoc：


    ```

    pandoc --filter pandoc-crossref

    ```


    使用 `pandoc-crossref` 进行交叉引用的语法与超文本链接类似，但略有不同。你需要使用花括号指定标签，并使用方括号插入对它们的引用。不过，你需要将交叉引用类型作为标签的一部分。要插入一个标签，请使用语法
    `{#type:label}`；要引用它，请使用语法 `[@type:label]`。此处的类型指定了你引用的是章节、表格、图形还是公式。

