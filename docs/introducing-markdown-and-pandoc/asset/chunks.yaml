    # Cross-referencing


    Cross-referencing is not directly supported by standard Markdown. Markdown was
    mainly invented to write hypertext documents for web pages, so referencing section
    numbers, figures, or tables is not part of it. We can use the link syntax to make
    hypertext references to sections but not get section numbers and such.


    Pandoc itself doesn’t support extensions for other kinds of cross-referencing,
    but there is a so-called “filter,” `pandoc-crossref`, that adds this support.
    Filters (see Chapter [11](#486315_1_En_11_Chapter.xhtml)) are scripts that are
    run to modify a document after it has been parsed by Pandoc and before the output
    format is generated. Filters are beyond the scope of this book, but we will use
    two in this and the next chapter.


    The `pandoc-crossref` filter is not necessarily automatically installed when you
    install Pandoc, so you might need to install it manually. How you do this will
    depend on your platform. I work on MacOS and use the Homebrew^([⁶](#fn6)) package
    manager, so I installed it using


    ```

    brew install pandoc-crossref

    ```


    The filter is a Haskell package, so you can also install it using the `cabal`
    package manager if you have the Haskell system installed.


    ```

    cabal update

    cabal install pandoc-crossref

    ```


    It might take a little while.


    If you installed Pandoc using any of the packages from the Pandoc releases web
    page,^([⁷](#fn7)) the filter should already be included. If all else fails, you
    can download the source code and compile it at the pandoc-crossref homepage.^([⁸](#fn8))


    To invoke the filter when processing a document with Pandoc, you use the option
    `--filter` (or `-F` as a shorter option). To enable the `pandoc-crossref` filter
    , run Pandoc as


    ```

    pandoc --filter pandoc-crossref

    ```


    Cross-referencing using `pandoc-crossref` uses a syntax similar to hypertext links,
    but with a twist. You specify labels with curly brackets and insert references
    to them using square brackets. You need to include cross-referencing type as part
    of the labels, though. To insert a label, you use the syntax `{#type:label}`,
    and to refer to it, you use the syntax `[@type:label]`. The type, here, specifies
    whether you are referring to sections, tables, figures, or equations.'
  raw: '## Code Block Options


    This syntax for displaying code is supported by many web sites where it is usual
    to write code in text, such as on GitHub. You can give more advanced instructions
    for how code should be displayed, but then you need to use a slightly different
    syntax that is more Pandoc specific. There, you put instructions in curly brackets
    after the first three backticks. You must specify the programming language but
    prepend a dot to the name, for example, write `.python` for Python. You can then
    number the code lines with the instruction `.numberLines`:


    ```

    ```{.python .numberLines}

    for i in range(n):

    print(i)

    ```

    ```


    The result will look like this:


    ```

    1   for i in range(n):

    2       print(i)

    ```


    You can specify which line number to start from with the option `startFrom` .
    To start from line 100, we can write


    ```

    ```{.python .numberLines startFrom=100}

    for i in range(n):

    print(i)

    ```

    ```


    The result will look like this:


    ```

    100  for i in range(n):

    101      print(i)

    ```


    You can give the code block an identifier:


    ```

    ```{#my-code .python .numberLines}

    for i in range(n):

    print(i)

    ```

    ```


    This will make the code block a hypertext target (an anchor in HTML), so you can
    create hypertext references to it. The anchor id is the same as the identifier
    excluding the hashtag. That is, in the preceding example, it is `my-code`. You
    refer to the target as you would with other references in a Markdown document,
    for example:


    ```

    ```{#my-code .python}

    for i in range(n):

    print(i)

    ```

    See [my code](my-code)

    ```


    In HTML output, you can also make each line an anchor using the option `.lineAnchors`.


    ```

    ```{#my-code .python .numberLines .lineAnchors}

    for i in range(n):

    print(i)

    ```

    ```


    The line identifiers are the code block id followed by the line number. In this
    case, the two lines `my-code-1` and `my-code-2`.


    In HTML output, all the options that start with a `.` will be added to the class
    of the `<pre>` block that contains the code. With a stylesheet, you can easily
    make code blocks formatting distinct. In filters (see Chapter [11](#486315_1_En_11_Chapter.xhtml)),
    you can use the options for arbitrary transformations or calculations. One crucial
    thing to keep in mind if you start using code block options to a larger extent
    is that all options without arguments


    ```

    .python

    .numberLines

    ```


    *must* start with a dot, and all options that take an argument


    ```

    startsFrom=100

    ```


    *cannot* start with a dot. If you break these rules, Pandoc will not do what you
    want.


    ## Syntax Highlighting Styles


    The syntax highlighting scheme is controlled by variations of stylesheets: cascading
    style sheets (CSS) for HTML output and a set of `\newcommand` options for LaTeX
    (and thus PDF) output. These highlighting instructions are put directly in the
    output file (when you make a standalone document) and are thus not easy to override.
    You can, however, choose from a list of predefined highlighting styles. You can
    see the complete list by running the command


    ```

    pandoc --list-highlight-styles

    ```


    You select a style using the `--highlight-style` option. When I build print versions
    of my books, I want a black-and-white output, so I use the option


    ```

    pandoc --highlight-style=monochrome

    ```


    This gives me a black and white highlighting using italic and boldface to display
    different language components. You can also completely disable syntax highlighting
    while still using code blocks, using the option `--no-highlight`.


    ## Exercises


    ### Code blocks


    Write the Markdown to display this Python code:


    ```

    print("hello, world")

    for i in range(10):

    print(i)

    ```


    ### Code Block Options


    Now add line numbers to it


    ### Syntax Highlighting


    Format the code in at least three different highlight formats and check the results.


