    # 编号练习


    作为最后一个例子，让我们回到练习示例。这次，我们不关心是否包含或不包含解答，而是希望在输出为 LaTeX 时将练习放入一个 LaTeX 环境中，在其他情况下则对它们进行编号并添加一个标题。


    考虑如下输入：


    ```

    ::: Exercise :::

