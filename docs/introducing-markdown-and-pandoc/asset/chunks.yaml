    ## Reference Prefixes


    When you need to refer to a section, you use the syntax


    ```

    [@sec:label]

    ```


    When you reference a section this way, the filter will insert both the section
    number and a default prefix, which is “sec.” for a single section and “secs.”
    for multiple sections. You can refer to more than one section but separating the
    labels by semicolons inside the square brackets:


    ```

    [@sec:label1; @sec:label2]

    ```


    For documents where you have both chapters and sections, this might not be what
    you want. There you might want to use the prefix “Chapter” for chapters and “Section”
    for sections. Unfortunately, you cannot make prefixes that depend on the header
    depth, but you can disable the prefixes by overriding them.


    You can either change the reference prefix on a per-reference basis or globally
    through metadata. For referring to chapters as “Chapter” rather than “sec.”—as
    in this example—the best solution is probably to set the prefix explicitly when
    referring to a chapter, but we can see how both approaches work.


    To use a per-reference specific prefix, you need to insert the prefix you want
    between the start square bracket and the label. So, to make the prefix for the
    reference to a chapter be “Chapter,” we would write `[Chapter @sec:chapter]`.


    To change the prefixes globally, we need to set a metadata variable. The metadata
    variable that controls the section references prefix is `secPrefix`. If we set
    it to the empty string, we get rid of the prefixes .


    ```

    secPrefix: ""

    ```


    You can then manually insert the prefixes you want in the Markdown text:


    ```

    See Chapter[@sec:chapter]

    and Section[@sec:section].

    ```


    Notice the lack of spaces between prefix and references here. This is needed for
    PDF output; the LaTeX document that Pandoc generates for the references contain
    a hard space, so if we put a space between the prefix and reference, the PDF document
    will have too much space in the generated text. For HMTL and EPUB, it doesn’t
    matter.


    Completely disabling a prefix can be done on a per-reference basis as well. Just
    add a “-” between the start bracket and the label. If you write `[-@sec:chapter]`,
    you only get the chapter number and not the prefix. You rarely need to set the
    default prefix to the empty string explicitly. But using that as an example gave
    me an excuse to introduce the variable.


    You can set the `secPrefix` metadata to a list. The first element is used for
    single references and the second for plural. So, to use “Sect.” as the prefix
    for a reference to a single section, and “Sects.” as the prefix for multiple sections,
    we could specify this metadata:


    ```

    secPrefix: ["Sect.", "Sects."]

    ```


    The prefix list can have any length, and the number of references is used to select
    a prefix. So, if you want a special prefix when you refer to three sections, you
    can add a third element to the list. When you have more references than prefixes,
    you get the last element in the list. Thus, if you specify two elements in the
    list, the first is used for singular references and the second for multiple references
    .


    You might want to use lowercase “sect.” when you refer to a section in the middle
    of a sentence but “Sect.” at the beginning of sentences. With `pandoc-crossref`
    it is simple to switch between uppercase and lowercase label prefixes. If you
    insert a label that starts with an uppercase, your prefix will be in uppercase
    as well. Thus, if you write `[@Sec:label]`, the default prefix will be “Sec.”;
    if you write `[@sec:label]`, the default prefix will be “sec.”. The same goes
    for references to figures, tables, equations, and so on.'
