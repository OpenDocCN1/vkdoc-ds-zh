    We have two Div blocks with class `Exercise` and some text within them. Those
    are the ones we want to modify. For HTML, say, we want to give them a header,
    and for LaTeX, we want to put them inside a LaTeX environment.


    We can get the output format from the `doc` object . The input and output of filters
    are, as mentioned earlier, JSON, and if we just used shell pipes, we couldn’t
    know what the final output is. When we run a script as a filter, however, Pandoc
    knows what the final output will be, and we can get that information.


    The first attempt at the filter looks like this:


    ```

    1   from panflute import *


    3   no_exercise = 1


    5   def number_exercises(elem, doc):

    6       global no_exercise

    7       if type(elem) == Div and \

    8           "Exercise" in elem.classes:


    10           meta = doc.get_metadata()


    12           if doc.format == "latex":

    13               exercise_env = "exercises"

    14               if "exercise_env" in meta:

    15                   exercise_env = meta["exercise_env"]

    16               block = [

    17                   RawBlock(r"\begin{" + exercise_env + "}",

    18                            "latex"),

    19                   elem,

    20                   RawBlock(r"\end{" + exercise_env + "}",

    21                            "latex")

    22               ]

    23               return block


    25           level = 1

    26           if "exercise_header_level" in meta:

    27               level = int(meta["exercise_header_level"])


    29           title = [Str("Exercise"),

    30                    Space,

    31                    Str(str(no_exercise))]

    32           no_exercise += 1

    33           return [Header(*title, level = level,

    34                   classes = elem.classes), elem]


    36   run_filter(number_exercises)

    ```


    We use a global variable, `no_exercise` (line 3), for increasing the header number
    for each exercise. Inside the filter, we first check if we have a `Div` block
