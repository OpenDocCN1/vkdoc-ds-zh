  trans: '

    # 为什么选择 Markdown？


    有许多不同的标记语言可供您使用。`HTML`（超文本标记语言）用于网页。`TeX` 和 `LaTeX` 用于多种文本文档，但在数学排版方面尤为强大。而 **Markdown**
    则是我们在本书中使用的语言。


    Markdown 之所以特别适合用来写作，在于它的简洁性。例如，在 `HTML` 中，你需要使用标签来包裹每一个段落、每一个标题、每一个列表等，以此构建文本结构。当你编辑一份
    `HTML` 文档时，很难将注释与你真正想要撰写的文本区分开来。`LaTeX` 也存在同样的问题。当你想专注于写作时，文本的注释很难被忽略。


    更糟的是，如果你用 `HTML` 或 `LaTeX` 编写文档，大量的文本都是用于指定格式的标记代码。具体数量当然取决于你的文档，但任何你添加的标记指令都会让文本变得难以阅读。


    看看这份 Markdown 文档：


    ```

    # 这是一级标题

    这是一个段落

    ## 这是二级标题

    下面是一个段落，后跟

    * 一个无序

    * 列表

    1. 和一个有序

    2. 列表，共有

    3. 三个项目

    ```


    我希望你会同意，这里的标记非常少，并且它们不会妨碍文本的阅读或写作。


    作为对比，同一段文本的 `HTML` 版本看起来像这样：


    ```

    这是一级标题

    这是一个段落

    这是二级标题

    下面是一个段落，后跟


    一个无序

    列表


    和一个有序

    列表，共有

    三个项目


    ```


    这并不复杂，多看几眼之后，你肯定能理解文档的结构。但它远没有 Markdown 文件那样清晰。


    `LaTeX` 版本比 `HTML` 文件稍微易读一些，但仍然有不少格式指令妨碍纯粹的写作。


    ```

    \section{这是一级标题}

    这是一个段落

    \subsection{这是二级标题}

    下面是一个段落，后跟

    \begin{itemize}

    \item 一个无序

    \item 列表

    \end{itemize}

    \begin{enumerate}

    \item 和一个有序

    \item 列表，共有

    \item 三个项目

    \end{enumerate}

    ```


    Markdown 的设计旨在让你能用尽可能少的标记混乱来为文本添加语义信息。它的设计初衷是让阅读原始文本几乎和阅读格式化后的文本一样容易。使用 Markdown，你在格式控制方面的能力比不上
    `LaTeX` 这类语言，但 Markdown 的简洁性足以弥补这一点。


    ## 为什么选择 Pandoc？


    由于 Markdown 只是一种为文本添加结构的语言，它并不绑定任何特定的工具。当你需要处理文档时，可以使用任何支持 Markdown 的软件。许多博客平台允许你用
    Markdown 编写文本，并自动为你格式化。将 Markdown 转换为 `HTML` 毕竟是这门语言最初的主要动机之一。现在，许多文本编辑器也支持 Markdown，能够处理
    Markdown 格式并导出为各种文件格式，通常还能通过各种格式和样式选项决定输出文件的外观。


    如果你的编辑器可以导出为不同文件格式和不同样式，那么这显然是你导出 Markdown 文本最便捷的方式。然而，使用 `Pandoc`，你在文档处理上拥有更大的控制权。`Pandoc`
    比我所知的任何支持 Markdown 的文本编辑器都要强大得多。


    如果你想创建一个简单、无冗余的文档，用 `Pandoc` 很容易做到，但直接从编辑器内操作会更简单。不过，建议你在简单场景下尝试使用 `Pandoc`，以便熟悉这个工具。等你需要认真写作，并且希望完全控制最终文档的外观时，你就需要
    `Pandoc` 的强大功能了。学习曲线可能比较陡峭，但如果你熟悉了用 `Pandoc` 处理简单文档，那么当你探索高级功能时，就有了一个坚实的基础。


    # 编写 Markdown


    如果你过去曾使用纯文本编写和共享文档，那么你可能已经熟悉了大部分 Markdown 标记注释。Markdown 的许多语法都基于人们多年来编写纯文本文档的方式。本章涵盖了基本的
    Markdown 注释，这些占到了你日常使用中 99% 的注释量。我在本章中介绍的标记符号得到了所有 Markdown 工具的支持（据我所知）。下一章将介绍并非普遍支持的标记符号，尽管许多工具都支持这些功能。当然，所有这些符号都得到了
    `Pandoc` 的支持。


    如果你按照本章剩余部分列出的方式编写纯文本，而不使用任何特殊的标记命令，那么输出结果也将是纯文本。一行或多行文本将构成一个段落。如果你需要开始一个新段落，请使用两个换行符，也就是用一个空行分隔前后两个段落。


    ## 章节


    在最高层面上，文本文档由其章节构成。章节分为不同层级。在一本书中，最高层级可能是“章”，第二层级是“章”内的“节”，第三层级是“节”内的“小节”。


    要创建一个新章节，你需要为其添加一个标题。标题以井号（`#`）开头。使用一个井号会得到一级标题，在一本书中对应“章”，在较小的文档中对应“节”。两个井号会得到二级标题，如果一级标题是“章”则对应“节”，如果一级标题是“节”则对应“小节”。下一级标题使用三个井号，以此类推。


    ```

    # 一级标题

    ## 二级标题

    ### 三级标题

    ```


    对于前两个层级，你也可以分别用 `=` 和 `-` 来为章节标题添加下划线：


    ```

    一级标题

    ========

    二级标题

    --------

    ```


    你在标题之后写的任何文本都成为该章节的正文内容。


    默认情况下，标题是带编号的。你可以使用模板（参见第 9 章）来更改这一点，或者在标题后面加上 `{-}` 或 `{.unnumbered}` 来禁用所选标题的编号：


    ```

    # 无编号标题 {-}

    ## 另一个无编号标题 { .unnumbered }

    ```


    ## 强调


    我们通过将部分文本设置为斜体或粗体来强调它们。在 Markdown 中，我们使用星号 `∗` 来实现。要将一个词设为斜体，我们使用 `*一个*` 星号；如果要设为粗体，我们使用
    `**两个**`。


    上述部分在 Markdown 中看起来像这样：


    ```

    我们通过将部分文本设置

    为斜体或粗体来强调它们。在 Markdown

    中，我们使用星号 \* 来实现。

    要将一个词设为斜体，我们使用 *一个*

    星号；如果要设为粗体，我们

    使用 **两个**。

    ```


    你还会注意到，第一个星号使用了反斜杠进行转义。这个反斜杠可以防止 Markdown 将星号解释为斜体文本的开始。

