  trans: '

    # 书写数学公式


    只要你的输出文件格式支持，Pandoc 就能出色地处理数学公式的写入。Word 文件内置了对数学公式的支持，如果输出文件是 Word 文档，Pandoc 会使用该功能。对于
    PDF，Pandoc 使用 LaTeX 作为中间格式，而 LaTeX 处理数学公式的效果堪称完美。对于 HTML 和 EPUB，根据你用于显示数学公式的版本和库，你也能获得一定的数学公式支持。


    对于 HTML 和 EPUB，针对输出如何处理数学公式，你有不同的选择。当我的 HTML 或 EPUB 文档中包含数学公式时，我通常使用 MathML（⁴）或
    MathJax（⁵）。对于 MathML，你可以使用 `--mathml` 选项：


    ```

    pandoc --mathml -o document.epub document.md

    ```


    对于 MathJax，你需要生成 EPUB3 文档才能使其正常工作，因此你还需要指定输出格式：


    ```

    pandoc --to=epub3 --mathjax \

    -o document.epub document.md

    ```


    使用任一选项，你都能得到一个能良好显示数学公式的 EPUB 文档。虽然不像由 LaTeX 处理数学公式的 PDF 文档那样精美，但效果已相当不错。


    在文档中书写数学公式的方式是使用 TeX 语法。只有在你输出 LaTeX 文件或通过 LaTeX 构建 PDF 文件时，输出文档中的数学公式才会是 TeX
    格式；但在纯文本中书写数学公式的事实标准就是 TeX，Pandoc 正是采用这一标准。


    你使用美元符号来开始和结束数学公式。使用一个美元符号会得到行内公式，使用两个则会得到“展示”模式公式，这意味着数学公式会单独占一行并居中显示。这是一个行内公式：`$\int_aˆb
    x\,\mathrm{d}x$` 显示为 ![$$ \underset{a}{\overset{b}{\int }}x\kern0.5em \mathrm{d}x
    $$](img/486315_1_En_6_Chapter_TeX_IEq1.png)。在双美元符号之间书写展示模式公式，如下所示：


    ```

    $$\sum_{j=1}^N \frac{1}{j²}$$

    ```


    结果会是这样：


    ![$$ \sum \limits_{j=1}^N\frac{1}{j²} $$](img/486315_1_En_6_Chapter_TeX_Equa.png)


    Pandoc 支持用 LaTeX 书写的绝大部分数学公式。例如，下面是一个更复杂的方程：


    ![$$ d\left(i,j\right)=\Big\{{\displaystyle \begin{array}{l}i\\ {}j\\ {}\min \Big\{\begin{array}{l}d\left(i-1,j-1\right)\kern0.5em
    +\kern0.5em 1\left(i\ne j\right)\\ {}d\left(i,j-1\right)\kern0.5em +\kern0.5em
    1\\ {}d\left(i-1,j\right)\kern0.5em +\kern0.5em 1\end{array}\end{array}}\kern0.5em
    {\displaystyle \begin{array}{l}j=0\\ {}i=0\\ {}i&gt;0,\kern0.5em j&gt;0\end{array}}
    $$](img/486315_1_En_6_Chapter_TeX_Equb.png)


    其 LaTeX 代码如下所示：


    ```

    $$

    d(i,j) = \begin{cases}

    \,i & j = 0 \\

    \,j & i = 0 \\

    \,\min\begin{cases}

    d(i-1,j-1) + \mathrm{1}(i\neq j) \\

    d(i,j-1) + 1 \\

    d(i-1,j) + 1

    \end{cases} & i>0,j>0

    \end{cases}

    $$

    ```


    如果你书写了 Pandoc 无法处理的数学公式（例如，使用了 Pandoc 不认识的 LaTeX 包），你仍然可以直接写下该 LaTeX 代码。Pandoc
    不理解的内容会直接传递到输出中。因此，只要你的输出格式需要经过 LaTeX 处理，这就能正常工作。


    如果你的输出是 HTML 或 EPUB，并且使用了 MathML 或 MathJax，你也可以书写一个需要原样传递到输出的公式。


    如果你只有一个文档，但需要为不同的输出格式提供不同的公式，就不能仅仅让文本直接传递到输出。这种情况下，你需要为一个输出格式输出一个版本，为另一个格式输出另一个版本。对此，Pandoc
    允许你书写仅针对特定输出格式包含的原样文本。你可以这样写：


    ```

    ```{=latex}

    $$\sum_{j=1}^N \frac{1}{j²}$$

    ```

    ```


    来表示一个仅当输出为 LaTeX 时才包含的文本块，以及这样写：


    `` `$f(x)=x²$`{=latex} ``


    来表示行内文本。


    # 书写代码块


    Markdown 经常被程序员用来撰写关于程序的文档，因此它自然支持显示代码示例，通常还会带有语法高亮格式。不同工具对此的支持程度不同，但 Pandoc 对许多编程语言都有出色的支持。


    书写代码块的语法可以使用波浪线“~”或反引号“`”。其中，反引号更可能被其他工具支持；因此，我在这里会使用反引号。下文给出的每个示例中，如果你用 `~` 代替反引号也同样有效。


    用三个反引号开始一个代码块，然后写入你的代码，最后再用三个反引号结束该代码块。


    ```

    ```

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ```

    ```


    你也可以使用波浪线代替反引号，但本章我将使用反引号。


    ```

    ~~~

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ~~~

    ```


    如果你只使用反引号或 `~`，你会得到一个原样文本块，就像你缩进了文本一样。为了获得语法高亮，你还必须告知 Pandoc 你正在使用哪种编程语言。你可以通过在反引号的第一行之后写上该语言的名称来实现。为了对前面用
    C 编程语言编写的代码进行语法高亮，你应该写成：


    ```

    ```c

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ```

    ```


    结果会像这样：


    ```

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ```


    一个 Python 代码块会像这样：


    ```

    ```python

    for i in range(n):

    print(i)

    ```

    ```


    结果会像这样：


    ```

    for i in range(n):

    print(i)

    ```


    要获取支持的编程语言的完整列表，你可以运行以下命令：


    ```

    pandoc --list-highlight-languages

    ```

