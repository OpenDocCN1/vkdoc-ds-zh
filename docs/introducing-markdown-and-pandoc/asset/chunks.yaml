    `pandoc-crossref`）。我们的引用将如下所示：


    ```

    [@ex:identifier].

    ```


    然而，在处理引用之前，我们想要收集一个从标识符到练习编号的映射。LaTeX 会为环境和 `\ref{}` 命令处理这个，但对于其他格式，我们必须自己处理。由于我们不能保证在看到练习之前就引用它，因此我们必须遍历整个文档，在再次遍历并修改文档之前创建映射。


    遍历文档的最简单方法是使用 `run_filter` 函数，但我们不能多次运行它。还有另一个函数 `run_filters`（注意是复数形式）可以处理这种情况。一个过滤器将提供输入给下一个过滤器；我们不想用收集映射的过滤器修改任何东西，所以我们只需让它返回
