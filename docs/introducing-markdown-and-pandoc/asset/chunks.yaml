    A `Cite` object contains several attributes including the identifier (the `@reference`
    text), a prefix (text that goes inside the square brackets but before the reference),
    and a suffix (text that goes after the text). We will only use the prefix and
    the identifier here and ignore—effectively remove—the suffix. See the exercises
