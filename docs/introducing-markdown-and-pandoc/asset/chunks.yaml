  trans: '

    # 模板示例


    请阅读以下文本。其中大部分是元数据，因为这是我们在这里关注的重点。如你所见，YAML 头部有三个变量：`title`、`subtitle` 和 `author`。前两个变量各持有一个单一值，最后一个变量则是一个简单值的列表。


    ```

    title:

    一本糟糕的小说

    subtitle:

    说真的，最差劲的作品之一！

    author:

    - 托马斯·马伦德

    - 卡斯肯·贝尔格


    那是一个漆黑而风暴肆虐的夜晚

    ```


    如果我们编写下面的 HTML 模板，我们会在 HTML 头部添加标题和副标题，并在主文档中添加一级标题。如果元数据中有任何作者信息，我们会插入一个 `div`
    元素来右对齐作者列表，并通过遍历它们来获取该列表。`$sep$` 变量本身并非元变量，而是一种标记后续元素的方式。如果你使用 `$sep$`，那么该标记（例如单词或逗号）会被放置在你遍历的所有元素之间，但不会跟在最后一个元素后面。试着移除它，你就会明白了。


    ```

    $title$$if(subtitle)$: $subtitle$$endif$


    $title$$if(subtitle)$: $subtitle$$endif$


    $if(author)$


    作者

    $for(author)$$author$$sep$ 和 $endfor$


    $endif$

    $body$

    ```


    如果我们用此模板格式化文本，会得到如下 HTML：


    ```

    一本糟糕的小说: 说真的，最差劲的作品之一！


    一本糟糕的小说: 说真的，最差劲的作品之一！


    作者

    托马斯·马伦德 和 卡斯肯·贝尔格


    那是一个漆黑而风暴肆虐的夜晚

    ```


    对于 PDF/LaTeX 输出，该模板的功能与上述 HTML 模板相同。


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{$for(author)$$author$$sep$和 $endfor$}

    \begin{document}

    \maketitle

    \end{document}

    ```


    （包含 `hyperref` 对于本例而言并不相关，但它是 Pandoc 期望包含的软件包之一。在我撰写本文时，对于这个特定示例，它是你唯一需要的软件包。）


    将该模板应用于我们的文档会得到如下结果：


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{一本糟糕的小说: 说真的，最差劲的作品之一！ }

    \author{托马斯·马伦德 和 卡斯肯·贝尔格}

    \begin{document}

    \maketitle

    \end{document}

    ```


    你可以通过“点号”语法访问元数据中的嵌套信息。因此，如果你的数据如下：


    ```

    title:

    一本糟糕的小说

    subtitle:

    说真的，最差劲的作品之一！

    author:

    - name: "托马斯·马伦德"

    affiliation: "看不见的大学"

    - name: "卡斯肯·贝尔格"

    affiliation: "布雷克比尔斯大学"

    ```


    并且你的模板如下：


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{$for(author)$$author.name$

    来自 $author.affiliation$

    $sep$ 和

    $endfor$}

    \begin{document}

    \maketitle

    $body$

    \end{document}

    ```


    那么处理文档后将生成以下输出：


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{一本糟糕的小说: 说真的，最差劲的作品之一！ }

    \author{托马斯·马伦德 来自 看不见的大学

    和 卡斯肯·贝尔格 来自 布雷克比尔斯大学}

    \begin{document}

    \maketitle

    那是一个漆黑而风暴肆虐的夜晚

    \end{document}

    ```


    你需要使用 `$author.name$` 和 `$author.affiliation$` 来获取每位作者的姓名和所属机构。你不能简单地再使用 `$author$`。你仍然可以检查某个值是否已设置；只需通过点号语法进入即可。例如，如果某些作者没有所属机构，你可以对其进行测试，并只在存在时才插入它。


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{

    $for(author)$ $author.name$

    $if(author.affiliation)$

    来自 $author.affiliation$

    $endif$

    $sep$ 和 $endfor$

    }

    \begin{document}

    \maketitle

    $body$

    \end{document}

    ```


    如果你有一个像上面那样的 LaTeX 模板（或任何其他输出格式的模板），你希望它能适用于尽可能多的文档。你不希望每写几个文档就要更新它。不过，每个文档通常还是需要一些调整。例如，在
    LaTeX 中，你可能需要导入一个特殊的软件包，或者你想定义一些命令。你不想把这些修改放在实际的模板里，也不想到处保留模板的许多副本。然而，使用元变量来使模板具有适应性很容易。


    考虑到我刚才描述的 LaTeX 文件情况，我们可以像这样在模板中添加软件包和定义^((15))：


    ```

    \documentclass{book}

    \usepackage{hyperref}

    $for(packages)$

    \usepackage{$packages$}

    $endfor$

    $if(definitions)$

    $definitions$

    $endif$

    \title{$title$$if(subtitle)$: $subtitle$ $endif$}

    \author{

    $for(author)$

    $author.name$

    $if(author.affiliation)$

    来自 $author.affiliation$

    $endif$

    $sep$ 和

    $endfor$

    }

    \begin{document}

    \maketitle

    $body$

    \end{document}

    ```


    我们遍历 `packages` 列表，将每一个包插入到 `usepackage` 命令中。我们在此直接插入定义。使用以下输入：


    ```

    title:

    一本糟糕的小说

    subtitle:

    说真的，最差劲的作品之一！

    author:

    - name: "托马斯·马伦德"

    affiliation: "看不见的大学"

    - name: "卡斯肯·贝尔格"

    affiliation: "布雷克比尔斯大学"

    packages:

    - amssymb

    - amsmath

    - booktabs

    - xspace

    definitions: |

    \newcommand{\TMRCA}%

    {\ensuremath{T_\textrm{MRCA}}\xspace}

    \newcommand{\tAC}%

    {\ensuremath{\tau_{AC}}\xspace}

    \newcommand{\tBC}%

    {\ensuremath{\tau_{BC}}\xspace}

    \newcommand{\tABC}%

    {\ensuremath{\tau_{ABC}}\xspace}

    \newcommand{\tadmix}%

    {\ensuremath{\tau_\text{admix}}\xspace}


    那是一个漆黑而风暴肆虐的夜晚

    ```


    我们得到：


    ```

    \documentclass{book}

    \usepackage{hyperref}

    \usepackage{amssymb}

    \usepackage{amsmath}

    \usepackage{booktabs}

    \usepackage{xspace}

    \newcommand{\TMRCA}%

    {\ensuremath{T_\textrm{MRCA}}\xspace}

    \newcommand{\tAC}%

    {\ensuremath{\tau_{AC}}\xspace}

    \newcommand{\tBC}%

    {\ensuremath{\tau_{BC}}\xspace}

    \newcommand{\tABC}%

    {\ensuremath{\tau_{ABC}}\xspace}

    \newcommand{\tadmix}%

    {\ensuremath{\tau_\text{admix}}\xspace}

    \title{一本糟糕的小说: 说真的，最差劲的作品之一！ }

    \author{

    托马斯·马伦德

    来自 看不见的大学

    和

    卡斯肯·贝尔格

    来自 布雷克比尔斯大学

    }

    \begin{document}

    \maketitle

    那是一个漆黑而风暴肆虐的夜晚

    \end{document}

    ```


    如果你不想在 HTML 输出中出现这些特定于 LaTeX 的代码，那么只需不要在模板中包含它们即可。如果你想在 HTML 和 PDF 文档中使用独立的头部配置，你可以使用两个不同的元变量。对于
    LaTeX 宏（与包含软件包不同），你不需要修改模板。Pandoc 理解宏的定义，并会在生成输出时应用你调用的宏。如果你在数学环境内调用宏，Pandoc 会以输出所需的数学格式生成调用宏的结果。在数学环境之外，调用宏的结果会包含在
    LaTeX 和 Markdown 输出中，但在其他格式中会被忽略。


    如果你感兴趣的话，我用来格式化本书的模板在几本书的撰写过程中有所演变，但目前看起来如下所示。我没有列出 Pandoc 在其模板中的所有代码，而是在注释中指明了你可以在何处插入它。

    '
- fmt: '```latex

    \documentclass[11pt, openright,

    twoside, onecolumn, final]{memoir}

    %% Setting up the paper size

    \setstocksize{9in}{6in}

    \settrimmedsize{\stockheight}{\stockwidth}{∗}

