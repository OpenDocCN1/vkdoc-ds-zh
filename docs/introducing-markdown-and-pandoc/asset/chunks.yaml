  raw: '```

    Pandoc (Meta {unMeta = fromList []})

    [Header 1 ("this-is-a-level-one-header",[],[])

    [Str "This",Space,

    Str "is",Space,

    Str "a",Space,

    Str "level",Space,

    Str "one",Space,

    Str "header"],

    Para

    [Str "This",Space,

    Str "is",Space,

    Str "a",Space,

    Str "paragraph"]

    ]

    ```


    Except for the API version, which we are not concerned with for our filters, the
    two formats contain precisely the same information (obviously since it is JSON
    that is used between filters and a filter pipeline usually begins and ends with
    Pandoc).


    The document has a metadata header (it is empty in this document) and then a list
    of document nodes. There are two top-level nodes, the header and the paragraph.
    The header has level 1 and then a triplet of extra information. The first element
    in the triplet is its identifier—it is used for hyperlinks when formatted as HTML
    and LaTeX. The next two elements in the triplet are classes and options. Inside
    the header is a list of strings and spaces. It is the text in the document. We
    will use identifiers, classes, and options in the following examples. The paragraph
    contains a lists of strings and spaces.


    The hierarchy in this document is not deep. We have sequences of strings and spaces
    nested in the header and the paragraph. They can get deeper but usually not much.
    Consider this example:


    ```


    oh: my


    This is *very* important

    ```


    If we get its structure, we get a string inside an emphasis inside a paragraph,
    but the depth is still small.


    ```

    Pandoc

    (Meta

    {unMeta = fromList

    [("oh",MetaInlines [Str "my"])]}

    )

    [Para

    [Str "This",Space,

    Str "is",Space,

    Emph [Str "very"],

    Space,

    Str "important"]

    ]

    ```


    Here you also see an example of metadata. It looks more complicated than what
    we would expect from a simple map from `oh` to `my`, but it is what it is. In
    the following Python code, the `panflute` model will translate it into a simple
    map from keys to values.


    To write a filter, try to make a small Markdown file containing input that you
    expect to transform and the output you want it to become. Then run the example
    through Pandoc to see what the native structure is. From that, and a package for
    Pandoc filters, you should be able to get what you want.


    ## Exploring Panflute


    Before we see concrete examples of filters, let us explore how `panflute` lets
    us traverse a document. As an example I will use this script:


    ```

    import sys

    from panflute import *

    def print_structure(elem, doc):

    if type(elem) == Header:

    print("identifier:", elem.identifier,

    file = sys.stderr)

    print("classes:", elem.classes,

    file = sys.stderr)

    print("attributes:", elem.attributes,

    file = sys.stderr)

    run_filter(print_structure)

    ```


    The `run_filter` traverses the entire tree structure, depth-first, and calls a
    function we provide it; here that is `print_structure` . I have written a function
    that lets me show some of the properties of the header in the previous example.
    Let me add a few more properties to the header and process the document:


    ```

    # This is my header {#header-id

    .class1 .class2

    foo=bar baz=qux}

    This is *very* important

    ```


    I have broken the header classes over multiple lines; Pandoc doesn’t mind.


    In the `print_structure` function , I ignore all document elements that are not
    `Header`—simply because I only do anything in case the element is a header element.
    What I do is that I print the identifier, the classes, and the attributes of a
    header. I print them to standard error—if I printed them to standard out, I would
    mess up the JSON output that makes a filter work.


    The text I print to standard error looks like this:


    ```

    identifier: header-id

    classes: [''class1'', ''class2'']

    attributes: OrderedDict([(''foo'', ''bar''),

    (''baz'', ''qux'')])

    ```


    You can recognize the properties from the header.


    ```

    # This is my header {#header-id

    .class1 .class2

    foo=bar baz=qux}

    ```


    The identifier is first in the curly brackets, and it starts with #. The classes
    begin with a dot and otherwise standalone, and the attributes are key-value mappings.
    The different document elements have different properties but `panflute` is well
    documented, and you can find all the attributes each document element has.


    The `print_structure` function doesn’t explicitly return any values which means
    that it implicitly returns the `None` object. The `panflute` module will interpret
    that as saying that the function does not want to make any transformations but
    leave `elem` as it is. If we wanted to change anything, we must return an element
    to replace the input `elem`.


    If you translate the preceding document into HTML, you can see how the various
    components are used. The identifier becomes the `id` in the header tag, the classes
    become classes, and the attributes become data attributes .


    ```

    This is my header


    This is very important

    ```


    Not all of the components are used in all output formats. In LaTeX, for example,
    only the identifier is used.


    ```

    \hypertarget{header-id}{%

    \section{This is my header}\label{header-id}}

    This is \emph{very} important

    ```


    That classes and attributes are not used much in the output here does mean that
    they are useless. You just need to find a use for them yourself. We can abuse
    them for our own nefarious purposes in our own filters.'
