- fmt: '# Conditional Inclusion of Exercise Solutions


    Consider this example from the previous chapter: we have text with exercises and
    solutions, and we want to compile it into documents where the solutions have been
    removed and documents where they have not. The preprocessing solution is excellent,
    but now we can see how we can achieve the same thing using a filter.


    Let this be the input format:


    ```

    Here is an exercise. Everyone can see it.

    ::: SOLUTION :::

    Here is a solution to the exercise.

    Do not give it to the students.

    :::

    ```


    The `::: SOLUTION :::` syntax is not one we have seen before because it is relatively
    rare. It creates a `div` tag in HTML—you can use it with a CSS file for formatting—and
    it adds a hyper reference target in LaTeX. We want neither of that, but we can
    use a `Div` structure in our filter.


    You can see what the structure looks like by running this:


    ```

    pandoc solutions.md -s --to native

    ```


    where I assume that the Markdown is in the file `solutions.md`.


    ```

    Pandoc (Meta {unMeta = fromList []})

    [Para [

    Str "Here",Space,

    Str "is",Space,

    Str "an",Space,

    Str "exercise.",Space,

    Str "Everyone",Space,

    Str "can",Space,

    Str "see",Space,

    Str "it."

    ],

    Div ("",["SOLUTION"],[])

    [Para [

    Str "Here",Space,

    Str "is",Space,

    Str "a",Space,

    Str "solution",Space,

    Str "to",Space,

    Str "the",Space,

    Str "exercise.",Space,

    Str "Do",Space,

    Str "not",Space,

    Str "give",Space,

    Str "it",Space,

    Str "to",SoftBreak,

    Str "the",Space,

    Str "students."]

    ]

    ]

    ```


    The `::: SOLUTION :::` syntax sets the class of the `Div` structure to `SOLUTION`
    (the middle element in the `Div` object’s properties). Classes are always lists,
    so it really sets the classes to a list with a single element, which is `SOLUTION`.
    If you want to give the `Div` object more attributes, you can use an alternative
    syntax:


    ```

    ::: SOLUTION :::

    Solution 1

    :::

    ::: {#solution-2 .SOLUTION .advanced}

    Solution 2

    :::

    ::: {#solution-3 .SOLUTION level=difficult }

    Solution 3

    :::

    ```


    The first solution here has the same syntax as before. It will set the class of
    the `Div` object to `SOLUTION` and leave the other two properties empty. The second
    solution sets an identifier and adds another class to the list. The third solution
    is back to a single class but adds one key to value mapping to the attributes.


    If you use this filter


    ```

    import sys

    from panflute import *

    def print_structure(elem, doc):

    if type(elem) == Div:

    print("id:", elem.identifier,

    file = sys.stderr)

    print("classes:", elem.classes,

    file = sys.stderr)

    print("attributes:", elem.attributes,

    file = sys.stderr)

    run_filter(print_structure)

    ```


    on the preceding Markdown file, you will get this output:


    ```

    id:

    classes: [''SOLUTION'']

    attributes: OrderedDict()

    id: solution-2

    classes: [''SOLUTION'', ''advanced'']

    attributes: OrderedDict()

    id: solution-3

    classes: [''SOLUTION'']

    attributes: OrderedDict([(''level'', ''difficult'')])

    ```


    We can use this information to process the example. We want to include or exclude
    solutions based on metadata. We could not easily do that in the preprocessor,
    but there we could use preprocessor variables which are harder to do here. Each
    method has its pros and cons.


    The preceding information tells us that `''SOLUTION''` will be in the class of
    the `Div` if we have an `::: SOLUTION :::` block (or with the alternative syntax
    an `::: { .SOLUTION }` block). We want to check the metadata to see if we should
    include the solutions. We can get the meta information from the `doc` parameter
    that `run_filter` will give our filter function. If we call `doc.get_metadata()`,
    we will get a table from which we can get metavariables. We want our filter to
    remove `Div` objects that have `SOLUTION` as their class unless there is a metavariable
    called `solutions` and it is true.


    This filter does that:


    ```

    from panflute import *

    def solution(elem, doc):

    if type(elem) == Div:

    if ''SOLUTION'' not in elem.classes:

    # Return None to leave the node as it is

    return None

    meta = doc.get_metadata()

    if "solutions" not in meta:

    return Null

    if meta["solutions"] != True:

    return Null

    return None

    run_filter(solution)

    ```


    First, we check if `''SOLUTION''` is in the classes. If not, then we don’t have
    a solution block and we leave the element alone by returning `None`. We could
    also have returned `elem`; it would make no difference. Otherwise, we get hold
    of the metadata. We check if `"solutions"` is in the metadata. If it is not in
    the metadata, then it definitely cannot be true, so we return `Null` as a replacement
    for `elem` in the output. Notice that it is `Null` and not `None`! The former
    is an element in Pandoc, while the latter is an element in Python; the former
    replaces `elem` with an empty block, effectively removing the solutions block,
    while the latter keeps `elem` as it is, that is, leaves the solutions block in
    the output. Finally, if `"solutions"` is in the metadata but not true, then we
    also remove the solutions block. The `solutions` metavariable can have more than
    `True` as a value, and those would be considered as true as well in the expression
    `meta["solutions"]`, so I explicitly check for `True`.


    If we do not get past the checks, we remove the solutions block. If the `"solutions"`
    is not set in the metadata, or if it is set to anything but `True`, we remove
    the block. Otherwise, we keep it by returning `None`.


    If the block is not a solutions block, if `"solutions"` is not set or set to anything
    except true, then we have a solutions block, and we are supposed to keep it.


    If we go back to the example Markdown


    ```

    Here is an exercise. Everyone can see it.

    ::: SOLUTION :::

    Here is a solution to the exercise.

    Do not give it to the students.

    :::

    ```


    then we can check how Pandoc reacts when the metavariable `"solutions"` is set
    to false:


    ```

    pandoc --metadata solutions:false -F solutions.py \

    solutions.md --to markdown

    ```


    This is the result:


    ```

    Here is an exercise. Everyone can see it.

    ```


    The solutions block is removed in the output. The same happens if you do not set
    the metavariable or if you set it to any other value, except true. If you do set
    it to true


    ```

    pandoc --metadata solutions:true -F solutions.py \

    solutions.md -- to markdown

    ```


    the solution block is included.


    ```

    Here is an exercise. Everyone can see it.

    ::: {.SOLUTION}

    Here is a solution to the exercise.

    Do not give it to the students.

    :::

    ```


    Pandoc uses this syntax in its output, but you can use either of the two ways
    to define a `Div` block.'
