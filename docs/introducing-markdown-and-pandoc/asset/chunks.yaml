    # 11. Filters


    Filters let you manipulate your documents similarly to preprocessors. Unlike preprocessors,
    they do not modify the text before Pandoc gets hold of it, but instead, they are
    plugged into the text transformation that Pandoc does. Think of them as post-processors;
    it is not far from the truth except that Pandoc will run after they are done.


    Both preprocessors and filters have strength and weaknesses. They can do the same
    things to your files, but some things are easier to program in a preprocessor,
    while some things are easier to program in a filter.


    Pandoc can read from standard input and output to standard output—it does this
    by default—and you can control the input and output formats using the `--from`
    and `--to` options . As with any pipeline, you can connect multiple programs,
    so instead of manipulating the input to Pandoc, as with a preprocessor, you can
    read the output from Pandoc, transform it, through as many steps as you like,
    and pipe it back into Pandoc for the final formatting (see Figure [11-1](#486315_1_En_11_Chapter.xhtml#Fig1)).


    ![../images/486315_1_En_11_Chapter/486315_1_En_11_Fig1_HTML.png](images/486315_1_En_11_Chapter/486315_1_En_11_Fig1_HTML.png)


    Figure 11-1


    Document formatting pipeline with filters


    You can string together any number of programs this way, as long as the output
    format of one matches the input format of the next, but what Pandoc thinks of
    as filters, and what you can add using the `--filter` or `-F` options , should
    read and write in the JSON format. Consequently, any program that can read and
    write JSON can be used as a filter. You don’t want to parse JSON yourself, though,
    if you can avoid it, so to write filters, you wish to use a software package/modules/libraries
    that help you rewrite the input.


    There is support for filters in many languages, for some languages more than one
    package to support them; see a list at [`https://tinyurl.com/y2fsn89s`](https://tinyurl.com/y2fsn89s)
    . I am most familiar with Python, so in the following examples, I will use that
    language. The package I will use is `panflute` which is my favourite for writing
    Pandoc filters . To install `panflute` , you can run


    ```

    $ pip3 install panflute

    ```


    The JSON representation of a document can be thought of as a tree. A document
    contains paragraphs, paragraphs contain words and spaces, some words are emphasized,
    and so on. What the Pandoc filter packages typically will do is that they will
    traverse this tree structure and apply to each node a function that you provide.
    This function can leave the local tree structure alone, or it can return a modified
    tree. The output of the filter will be the input tree with your modifications.


    You can use `pandoc <inputfile> --to json` to see the JSON representation of a
    file, but I find it easier to see the structure using `pandoc <inputfile> -- native`
    . The native format is a format used internally by Pandoc and is what you will
    traverse over with a filter. I suggest using it to recognize the structure a document
    will have, what to match on to recognize what you wish to rewrite, and what the
    rewritten structure should be.


    Take a document like this:


    ```

    # This is a level one header

    This is a paragraph

    ```


    The JSON format of this document is this:


    ```

    {"blocks":[

    {"t":"Header",

    "c":[

    1,

    ["this-is-a-level-one-header",[],[]],

    [{"t":"Str","c":"This"},

    {"t":"Space"},

    {"t":"Str","c":"is"},

    {"t":"Space"},

    {"t":"Str","c":"a"},

    {"t":"Space"},

    {"t":"Str","c":"level"},

    {"t":"Space"},

    {"t":"Str","c":"one"},

    {"t":"Space"},

    {"t":"Str","c":"header"}

    ]]},

    {"t":"Para",

    "c":[{"t":"Str","c":"This"},

    {"t":"Space"},

    {"t":"Str","c":"is"},

    {"t":"Space"},

    {"t":"Str","c":"a"},

    {"t":"Space"},

    {"t":"Str","c":"paragraph"}]}

    ],

    "pandoc-api-version":[1,17,5,4],

    "meta":{}

    }

    ```


