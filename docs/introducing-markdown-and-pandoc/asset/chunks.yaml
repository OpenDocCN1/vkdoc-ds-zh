    Continuing with the exercise example, we could imagine that you have TAs for your
    class and you want to give them solutions to the exercise. It is easier to have
    the solutions in the same document as the exercises, but you don’t want to hand
    the solutions to your student. So, what you want is a way to include the solutions
    when you make documents to the TAs and exclude them otherwise. This is something
    GPP is excellent at as well.


    You can test if a variable is defined using `#ifdef`. A *variable* here should
    not be confused with the variables that Pandoc works with. Remember that the preprocessor
    sees the document before Pandoc and does not communicate with Pandoc other than
    piping its output into it.


    If we want to include or exclude a block of text, we can put them between `#ifdef`
    and `#endif`. We can do that for the solutions to our exercises:


    ```

    #include "header.yml"

    week: Week 14


    # This is an exercise

    Do something difficult

    #ifdef SOLUTIONS

    This is the solution to the exercise

    #endif

    # This is another exercises

    Do something even more difficult

    #ifdef SOLUTIONS

    This is the solution to the exercise

    #endif

    ```


    If you build a document as the preceding one, you will not get the solutions in
    the output. To get them, you need to define `SOLUTIONS`. You can do this in the
    file with a `#define` statement, but for this particular application, we might
    as well give them to `gpp` on the command line. Here we can use the option `-D`.
    This command line will build a PDF that contains both the exercises and the solutions.


    ```

    gpp -DSOLUTIONS week14_exercises.md | \

    pandoc --template exercises.tex \

    --from markdown \

    -o week14_exercises_solutions.pdf

    ```


    ### Running Code


    Leaving the exercises, imagine that you are writing a book about programming and
    you have code examples. You want to show the result of running the code, so you
    want to evaluate all your code and insert the result into your document.


    For example, you have the code


    ```

    ```python

    for i in range(10):

    print(i, end = '' '')

    ```

    ```python

    for i in range(10):

    print(-i, end = '' '')

    ```

    ```


    and you want the first code block to be followed by the numbers 0–9 and the second
    from 0 to -9.


    This Python code iterates over all lines in the input. It uses `sys.stdin` to
    read the input, so you *must* pipe input to it and not call it with a file name.
    For each line, it checks if it is a code block line, that is, whether it starts
    with three backticks. If it is, and it starts with `python`, then it starts collecting
    lines until it sees the end of the block. When it gets there, it evaluates the
    python code, using `exec`. This function will execute the code producing any output
    the code prints—which is what we want here. Since we are using `exec`, functions
    and variables defined in earlier blocks can be used in later blocks.


    ```

    from sys import stdin

    def main():

    exec_env = {}

    incode = False

    codeblock = []

    for line in stdin:

    print(line, end=“)

    if line.startswith("```python"):

    incode = True

    continue

    if incode:

    if line.startswith("```"):

    exec("".join(codeblock), exec_env)

    incode = False

    codeblock = []

    continue

    codeblock.append(line)

    if __name__ == "__main__":

    main()

    ```


