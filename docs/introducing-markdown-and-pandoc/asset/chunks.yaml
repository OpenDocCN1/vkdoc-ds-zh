    files and you can easily transform your Markdown input into all the output file
    formats and styles you need. Furthermore, someone else can work on the style specification
    while you concentrate on the text. Your Markdown doesn’t have to be in a single
    file either. You can split it into as many as you want, and then different authors
    can work on separate pieces of the text without worrying about how to merge files
    afterward. With version control, you can even work on the same file in parallel
    up to a point.


    ## Separating Semantics from Formatting


    Most documents have a semantic structure. Texts consist of chapters and sections,
    plain text and emphasized text, figures and citations, quotes, and lists. When
    we read a document, these semantic elements are visualized by different fonts,
    bold and italic text, different font sizes, and we do not directly see the semantic
    structure. Because we don’t immediately see the structure, it is easy to forget
    that it is there.


    Most word processors separate semantics from formatting. If you take care to use
    the formatting section when working on a Word document, then the semantic information
    needed to change styles, that is, the visual representation of all semantic units
    (e.g., headings) is readily available. Separating the semantics of a document
    from its formatting is not an exclusive property of markup languages. However,
    when the separation of text and semantics is not enforced, there is a potential
    for error. If you decide to change the font size of level-two section headers,
    for example, you can easily do this, but you can equally easy highlight a single
    section header and reformat that, changing only that single header. That makes
    this particular header different from all the rest, and if you later modify the
    formatting of level-two headers, you won’t be changing this one header. Great
    if this is on purpose; not great if this is not what you wanted.


    With WYSIWYG editors, you can separate semantics from formatting, but it is easy
    to break this separation. With markup languages, you can also define some text
    elements as special and their format different from related items, but you have
    to do this explicitly so you cannot easily do this by mistake. Keeping the core
    text consisting of semantic elements and separate from formatting is vital in
    many situations. If you want to translate your text into both paper documents
    and web pages, you typically want the format to be different in the two resulting
    documents. If the core text only contains the semantic structure, this is quickly
    done, by having a different mapping from semantic elements to formatting information,
    typically called *templates* or *stylesheets* (see Chapter [9](#486315_1_En_9_Chapter.xhtml)).
    With different stylesheets for different output formats, the formatting is tied
    to the output text rather than the input text (see Figure [2-1](#486315_1_En_2_Chapter.xhtml#Fig1)).


    ![../images/486315_1_En_2_Chapter/486315_1_En_2_Fig1_HTML.png](images/486315_1_En_2_Chapter/486315_1_En_2_Fig1_HTML.png)


    Figure 2-1


    You can translate the text in multiple documents, or multiple chapters that should
    be merged into a single document. You combine these with templates for formatting
    the documents, and using Pandoc you can combine it all to produce the documents
    you want.


    Explicitly representing the semantic elements in the text, rather than implicitly
    through how the text is formatted, is also essential if you want to automatically
    make a table of contents or lists of figures and tables. If all sections are marked
    up explicitly as sections, with headers at different section levels, any tool
    can scan your document and identify these. If the tools had to guess at the semantic
    meaning of text elements, based on how the text was formatted, this would be a
    much harder task.


    Using WYSIWYG word processors doesn’t prevent you from structuring your documents
    as semantic units—they usually support this—but having an explicit markup language
    makes it much easier to enforce.


    ## Preprocessing Documents


    If your documents are in plain text, you also get a lot of options for how to
    process your document before you format it into a final output. There are a large
    number of tools that will work well with plain text and let you preprocess your
    documents.


    Preprocessing documents often require a few programming skills, so it might not
    be the first thing you want to worry about if you are only interested in writing
    text, but since the option is there, you can write your text without worrying
    about processing it initially, and add such steps later.


    I write a lot about R programming, and in those books, I have a lot of code examples.
    Here, I use another preprocessor, one that lets me evaluate the code when processing
    the documents so I know that all the code examples work and so I can get the output
    of running code inserted into the documents automatically before I create the
    output formats.


    Preprocessing your documents adds some complications to how you format your text,
    but the complexities are only there when you need them. If you do not need a preprocessor,
    then you can ignore that they exist altogether. If you *do* need preprocessing,
    then read Chapter [10](#486315_1_En_10_Chapter.xhtml).'
  trans: '

    # 为什么要使用 Markdown 和 Pandoc


    如果你习惯了使用 Microsoft Word 这类所见即所得（WYSIWYG）编辑器，你很可能会问，为什么要使用 Markdown 文件。你可以按自己喜欢的方式编写文档并设置格式，也可以根据需要将文档导出为不同的文件格式。对于只需格式化一次、输出一种文件格式的短文档，你确实不需要
    Markdown。但我认为，即便对于这类文档，Markdown 仍然是一个绝佳的选择，只是它在更高级的应用中才能真正大放异彩。


    对于那些用 WYSIWYG 编辑器处理起来同样简单的文档，在你需要与他人共享文档时，纯文本可能是更好的选择。Word 文件是这类场景的事实标准格式，但并非所有人都有
    Word——我就没有。我确实有 Pages，可以导入 Word 文件，再导出为 Word 格式，但我不清楚这种转换会对格式产生什么影响。每个人都拥有能处理纯文件的编辑器，而使用纯文本文件时，你清楚知道自己在编辑什么。如果文本和格式分离，那么擅长排版的人可以处理格式，而我只负责撰写内容。Word
    的一个优势可能是修订追踪功能，这确实很重要。但对于纯文本文件，你可以将其纳入真正的版本控制系统（例如 GitHub），这比版本追踪功能要强大得多。


    如果你需要以不同格式呈现文档——例如，既要将文本内容放入打印版的进度报告，又要发布在网站上——那么你可以将文档导出为所需的各种文件格式。如果不同文件格式需要不同的排版样式，你可能需要进行大量手动操作。你可能需要手动修改所有文档样式，而当你需要对文本进行多次修改时，你可能需要不止一次地为每种文件格式调整样式。如果你将样式与文本分离，就能完全避免这个问题。


    使用标记语言来注释文本，可以让你更轻松地分辨文档的语义结构与其格式化方式。在 Markdown 文档中，你标记出标题和列表的位置，但并不指定它们在最终输出中应如何格式化。格式化样式保存在不同的文件中，你可以轻松地将
    Markdown 输入转换为你需要的所有输出文件格式和样式。此外，其他人可以专注于样式规范，而你则专注于文本内容。你的 Markdown 也不必局限于单个文件。你可以将其拆分成任意多个文件，然后不同的作者可以各自处理不同的文本部分，而无需担心之后如何合并文件。结合版本控制，你甚至可以在一定程度上并行处理同一个文件。


    ## 将语义与格式化分离开来


    大多数文档都具有语义结构。文本由章节、段落与强调文本、图表与引用、引文与列表组成。当我们阅读文档时，这些语义元素通过不同的字体、粗体和斜体文本、不同的字号来呈现，我们并不直接看到语义结构。正因为我们无法直接看到结构，所以很容易忽略它的存在。


    大多数文字处理器都能将语义与格式化分离开来。如果在处理 Word 文档时注意使用格式设置功能，那么修改样式所需的语义信息（即所有语义单元，如标题的视觉呈现方式）就唾手可得。将文档的语义与其格式化方式分离开来，并非标记语言的独有特性。然而，当文本与语义的分离不是强制性的时，就可能出现错误。例如，如果你决定修改二级章节标题的字体大小，你可以轻松做到，但你同样可以轻易地选中某一个标题并单独重新格式化它，从而只修改这一个标题。这会使这个特定的标题与其他所有标题不同，如果你之后修改二级标题的格式，这个标题并不会随之改变。如果这是有意为之，那很好；但如果这不是你的本意，那就糟糕了。


    使用 WYSIWYG 编辑器，你可以将语义与格式化分开，但很容易破坏这种分离。使用标记语言，你也可以将某些文本元素定义为特殊元素，并使其格式与其他同类元素不同，但你必须明确地这样做，因此你不会轻易误操作。在许多情况下，保持核心文本由语义元素构成、并与格式化方式分离至关重要。如果你希望将文本同时转换为纸质文档和网页，你通常希望这两种输出文档的格式有所不同。如果核心文本仅包含语义结构，那么只需为语义元素到格式化信息建立不同的映射（通常称为`模板`或`样式表`，参见第
    9 章）即可快速实现。通过为不同输出格式使用不同的样式表，格式与输出文本绑定，而非与输入文本绑定（参见图 2-1）。


    ![../images/486315_1_En_2_Chapter/486315_1_En_2_Fig1_HTML.png](img/486315_1_En_2_Fig1_HTML.png)


    图 2-1


    你可以翻译多个文档中的文本，或翻译多个应合并到单个文档中的章节。将这些文本与文档格式化模板相结合，并使用 Pandoc 将它们整合在一起，以生成你想要的文档。


    在文本中明确表示语义元素，而非通过文本的格式化方式来隐式表示，这对于自动生成目录、图表列表也至关重要。如果所有章节都明确标记为章节，并带有不同层级的标题，那么任何工具都可以扫描你的文档并识别它们。如果这些工具必须根据文本的格式化方式来猜测文本元素的语义含义，那将是一项艰巨得多的任务。


    使用 WYSIWYG 文字处理器并不会阻止你将文档组织成语义单元——它们通常支持这一点——但使用显式的标记语言能更容易地强制执行这一点。


    ## 预处理文档


    如果你的文档是纯文本格式，在将其格式化为最终输出之前，你还有许多预处理选项。有大量工具可以很好地处理纯文本，并允许你对文档进行预处理。


    预处理文档通常需要一些编程技能，所以如果你只对写作感兴趣，这可能不是你首先要担心的事情。但既然有这个选项，你可以先专注于写作，稍后再添加预处理步骤。


    我写了很多关于 R 编程的文章，在这些书中，我使用了大量代码示例。这里我用了另一个预处理器，它允许我在处理文档时执行代码，这样我就能确保所有代码示例都能运行，并且可以在创建输出格式之前，将代码运行结果自动插入到文档中。


    预处理文档会为你格式化文本的方式增加一些复杂性，但这些复杂性只在你需要时才存在。如果你不需要预处理器，那么完全可以忽略它们的存在。如果你*确实*需要预处理，请阅读第
    10 章。

    '
- fmt: '# Why Markdown?


    There are many different markup languages you can use. `HTML` (hypertext markup
    language) is used for web pages. `TeX` and `LaTeX` are used for many kinds of
    text documents but are especially powerful for typesetting mathematics. Markdown
    is what we do on in this book.


    What makes Markdown particularly pleasant to work with is its simplicity. In `HTML`,
    for example, you need to structure your text using tags that enclose every paragraph,
    every header, every list, and so on. When you edit an `HTML` document, it is hard
    to separate the annotations from just the text you want to write. `LaTeX` has
    the same problem. The annotation of the text can be hard to ignore when you want
    to focus on writing.


    Worse, if you write your documents in `HTML` or `LaTeX`, much of the text is markup
    codes that specify the formatting. How much, of course, depends on your document,
    but any markup instructions you make can make the text difficult to read.


    Consider this Markdown document:


    ```

    # This is a level one header

    This is a paragraph

    ## This is a level two header

    Here is a paragraph that is followed by

    * an unnumbered

    * list

    1\. and a numbered

    2\. list that is

    3\. three items long

    ```


    I hope you will agree that the markups here are minimal and that they do not get
    in the way of reading or writing the text.


    For comparison, the `HTML` version of the same text looks like this:


    ```

    This is a level one header

    This is a paragraph

    This is a level two header

    Here is a paragraph that is followed by


    an unnumbered

    list


    and a numbered

    list that is

    three items long


    ```


    It is not terribly complicated, and after looking at it a bit, you can certainly
    follow the structure of a document. It is far from as clean as the Markdown file.


    The `LaTeX` version is slightly easier to read than the `HTML` file, but there
    are still several formatting instructions that get in the way of just writing.


    ```

    \section{This is a level one header}

    This is a paragraph

    \subsection{This is a level two header}

    Here is a paragraph that is followed by

    \begin{itemize}

    \item an unnumbered

    \item list

    \end{itemize}

    \begin{enumerate}

    \item and a numbered

    \item list that is

    \item three items long

    \end{enumerate}

    ```


    Markdown is designed so you can annotate your text with semantic information with
    little annotation clutter. It is designed such that reading the input text is
    almost as easy as reading the formatted text. With Markdown you don’t have quite
    the same power to control your formatting as you do in a language like `LaTeX`,
    but the simplicity of Markdown more than makes up for it.


    ## Why Pandoc?


    Since Markdown is just a language for adding structure to a text, it is not tied
    to any particular tool. You can use any Markdown-aware software when you want
    to process your documents. Many blogging platforms will let you write your text
    in Markdown and automatically format it for you. Translating Markdown into `HTML`
    was, after all, one of the primary motivations for the language. Now, many text
    editors also support Markdown and will support formatting in Markdown and exporting
    to various file formats, usually with various formatting and style choices determining
    what your output files will look like.


    If your editor can export to different file formats and in different styles, then
    that is obviously the easiest way for you to export your Markdown text. With `Pandoc`,
    however, you have a lot of power over how your documents should be processed.
    `Pandoc` is vastly more versatile than any Markdown-aware text editor that I am
    aware of.


    If you want to create a simple document with no fluff, it is easy to do so with
    `Pandoc`, but easier to do from inside your editor. Try using `Pandoc` for simple
    cases though, so you get familiar with the tool. When you get into serious writing,
    and you want full control of how your final documents will look, then you need
    the power of `Pandoc`. The learning curve can be steep, but if you are familiar
    with using `Pandoc` for simple documents, then you have a foundation to build
    on when you explore advanced features.


    # Writing Markdown


    If you have used plain text to write and share documents in the past, then you
    are likely to be familiar with most Markdown markup annotations already. Much
    of the syntax for Markdown is based on how people have written plain text documents
    for years. This chapter covers the basic Markdown annotations, which make up 99%
    of the annotations you will use regularly. The notation I present in this chapter
    is supported by all Markdown tools (as far as I am aware). The next chapter covers
    notation that is not universally supported although many tools do support the
    features there. All of them, of course, are supported by `Pandoc`.


    If you write plain text with no special markup commands, as listed in the remainder
    of this chapter, then the result will be plain text in the output as well. One
    or more lines of text becomes a paragraph. If you need to start a new paragraph,
    then use two new lines, that is, separate one paragraph from the next with a blank
    line.


    ## Sections


    At the highest level, a text document is composed of its sections. Sections come
    at different levels. In a book, the top level might be chapters, the second level
    sections within the chapters, and the third level are subsections within the sections.


    To make a new section, you give it a header. The headers start with a hashtag.
    Using one hashtag gives you a level-one header, which will be a chapter in a book
    or a section in a smaller document. Two hashtags give you a level-two section,
    a section if the first level is chapters or a subsection if the first level is
    section. The next level sections have three hashtags, and so on.


    ```

    # Header level 1

    ## Header level 2

    ### Header level 3

    ```


    For the first two levels, you can alternatively underline the section titles with
    `=` and `-`, respectively:


    ```

    Level  one header

    =================

    Level  two header


    ```


    Any text you write following a header becomes the body of the section.


    By default the headers are numbered. You can change this using a template (see
    Chapter 9) or you can disable numbering on selected headers by putting `{-}` or
    `{.unnumbered}` after the header title:


    ```

    # Unnumbered header {-}

    ## Another unnumbered header { .unnumbered }

    ```


    ## Emphasis


    We emphasize part of a text by putting it in italic or boldface. In Markdown we
    use asterisks, `∗`, to do this. To put a word in italic, we use `*one*` asterisk,
    and to put it in boldface, we use `**two**`.


    The preceding section, in Markdown, looks like this:


    ```

    We emphasise part of a text by putting

    it in italic or boldface. In Markdown

    we use asterisks, \*, to do this.

    To put a word in italic, we use *one*

    asterisk and to put it in boldface we

    use **two**.

    ```


    You will also notice that the first asterisk is escaped using a backslash. That
    backslash prevents Markdown from interpreting the asterisks as the beginning of
    an italic text.'
