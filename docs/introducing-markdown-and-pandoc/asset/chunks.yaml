    # 10. Preprocessing


    Markdown is just a plain text document, and you can do any rewriting of that text
    before you pass it through `Pandoc`. Any rewriting of the text before you give
    it to `Pandoc` is called *preprocessing*. `Pandoc` will read from standard input,
    so we can pipe the result of preprocessing into it on the command line (see Figure
    [10-1](#486315_1_En_10_Chapter.xhtml#Fig1)).


    Assuming that the preprocessor takes the input file as input and that it writes
    its output to standard out, then a pipeline can look like this:


    ```bash

    preprocessor infile.md | \

    pandoc --from markdown ... -o outfile

    ```


    You need to tell `Pandoc` that it is getting Markdown as input if it reads it
    from standard in, and you do this with the `--from` option.


    The preprocessor can do whatever you want it to as long as it outputs a file that
    `Pandoc` can process. The output does not need to be Markdown—you can change the
    `--from` option if it is not—but it must be a file in a format that `Pandoc` can
    read. I will use Markdown as my output in the following.


    ![../images/486315_1_En_10_Chapter/486315_1_En_10_Fig1_HTML.png](images/486315_1_En_10_Chapter/486315_1_En_10_Fig1_HTML.png)


    Figure 10-1: Document formatting pipeline with a preprocessing step


    ## Examples


    In the following examples, I will use `GPP`^([^(16)](#fn16)) for the first two
    and `Python`^([^(17)](#fn17)) for the last. `GPP` is a preprocessor with somewhat
    limited functionality, but for including files and for selectively including or
    excluding segments of a file, it works excellently. Getting `Python` to do the
    same is additional work. On the other hand, since `Python` is a general-purpose
    programming language, we can get it to do whatever we want with the input document.


    ### Including Files


    One use for a preprocessor is to have some information we can reuse in some files
    and another document-specific input—like a document’s body—in another file. That
    is the idea with templates, but there are other cases we might have such a setup.


    Imagine that you are teaching a class and hand out exercises every week. Some
    information, such as the name of the class and the name of the instructor, do
    not change from week to week but other information does, for example, the week
    number.


    We can make a file `header.yml` with the general information:


    ```yaml

    class: Markdown and Pandoc

    instructor: Thomas Mailund

    ```


    The header here is, of course, artificially simple. You only want to include a
    file that is of some complexity, but the example shows the principle.


    For a specific week, we can then specify the week information, for example, the
    week number and the actual exercises for that week. Here is a file; let us call
    it `exercises.md`. It holds the exercises for week 14 of the class.


    ```markdown

    #include "header.yml"

    week: Week 14


    # This is an exercise

    Do something difficult

    # This is another exercises

    Do something even more difficult

    ```


    The `#include "header.yml"` is where the preprocessor does its thing.


    Notice that the three dashes delimiting the YAML specification are *not* in the
    `header.yml`. If it was then couldn’t include it and still set the variable `week`
    in the `exercises.md` file. When we include it into the YAML header, we can combine
    the general variables set in `header.yml` with the file-specific variables.


    If we pipe the document through the preprocessor:


    ```bash

    gpp < exercises.md

    ```


    We get this result:


    ```yaml

    class: Markdown and Pandoc

    instructor: Thomas Mailund

    week: Week 14


    # This is an exercise

    Do something difficult

    # This is another exercises

    Do something even more difficult

    ```


    We can combine this with a template:


    ```latex

    \documentclass{article}

    \usepackage{hyperref}

    \title{$class$: $week$}

    \author{$instructor$}

    \begin{document}

    \maketitle

    \end{document}

    ```


    Combining the preprocessor and `Pandoc` now lets us build a document with our
    exercises:


    ```bash

    gpp exercises.md | \

    pandoc --template exercises.tex \

    --from markdown \

    -o exercises.pdf

    ```'
