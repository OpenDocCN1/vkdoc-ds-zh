    \ page and to a section in your text.\n\n### Images\n\nFind an image file and\
    \ insert it into a text."
  trans: "\n# 列表\n\n你有两种列表：有序列表和无序列表。要创建有序列表，你需要在行首放置一个数字，后跟一个句点，然后写下列表项。对于下一个列表项，你需要换行，添加另一个数字，后跟一个句点，然后写下下一项文本。示例如下：\n\
    \n```\n1\\. 这是一个有序列表。\n2\\. 这是列表的第二项。\n3\\. 这是列表的第三项。\n```\n\n结果将如下所示：\n\n1. \
    \ 这是一个有序列表。\n2.  这是列表的第二项。\n3.  这是列表的第三项。\n\n实际数字会被忽略，因此如果你写成如下形式，也能得到相同结果：\n\n\
    ```\n10\\. 这是一个有序列表。\n51\\. 这是列表的第二项。\n42\\. 这是列表的第三项。\n```\n\n如果你希望列表项跨越多行，则需要缩进数字后的行，示例如下：\n\
    \n```\n1\\. 这是一个多行列表项。\n这也是列表项的一部分。\n这个也是。\n2\\. 这是另一项。\n这也是该列表项的一部分。\n```\n\n\
    这样做会得到如下列表：\n\n1.  这是一个多行列表项。这也是列表项的一部分。这个也是。\n2.  这是另一项。这也是该列表项的一部分。\n\n对于无序列表，你可以使用星号或短横线代替数字；因此你可以这样编写一个无序列表：\n\
    \n*   这是一个有序列表\n*   这是列表的第二项\n*   这是列表的第三项\n\n```\n* 这是一个有序列表\n- 这是列表的第二项\n* 这是列表的第三项\n\
    ```\n\n如你所见，你可以混合使用星号和短横线，或者只坚持使用其中你偏好的任何一种。当你创建文档时，列表的格式化方式由样式表决定，而非由你使用哪个符号来创建列表决定。\n\
    \n如果你希望在列表项下拥有子列表，可以通过缩进子列表的行来实现。因此，你可以这样编写一个带有子列表的列表：\n\n```\n* 这是一个顶级列表项\n*\
    \ 这是一个子列表项\n* 这是另一个子列表项\n* 现在我们又回到了顶级。\n```\n\n只需添加足够的空格，将子列表项置于其所属列表项的缩进之下。结果将如下所示：\n\
    \n*   这是一个顶级列表项\n    *   这是一个子列表项\n    *   这是另一个子列表项\n*   现在我们又回到了顶级。\n\n当你进行缩进时，每级缩进至少需要四个空格或一个制表符。\n\
    \n# 块引用\n\n如果你需要在文本中添加引用，你需要在被引用的文本前放置一个 `>`。\n\n因此你可以这样编写：\n\n```\n> 这是一个块引用。该块引用\n\
    > 可以跨越多行。如果你不\n> 在其中插入新行，你只需\n> 在行的开头放置“>”\n> 即可。\n> 如果你想要包含换行的多行内容，\n> 你应该在每一行\n\
    > 都添加“>”。\n```\n\n结果将如下所示：\n\n> 这是一个块引用。该块引用可以跨越多行。如果你不在其中插入新行，你只需在行的开头放置 `>`\
    \ 即可。如果你想要包含换行的多行内容，你应该在每一行都添加 `>`。\n\n# 逐字文本\n\n有时，你希望文本完全不应用任何格式；希望按原样逐字显示。当你有此需求时，你可以用制表符（或四个空格）对其进行缩进。你可以这样编写：\n\
    \n```\n这将以逐字显示\n绝对原样显示\n```\n\n结果将如下所示：\n\n```\n这将以逐字显示\n绝对原样显示\n```\n\n有时，你也希望在段落内内联添加逐字文本。要实现这一点，只需将逐字文本放在反引号内即可。因此你可以编写\
    \ `` `'this'` `` 来实现 `this`。\n\n# 链接\n\nMarkdown 最初是为了让编写网页内容更容易而创建的。因此，它内置了插入超文本链接的语法。这些链接既适用于网页链接，也适用于文本内部的交叉引用。\n\
    \n你有两种方式指定链接：你可以在插入链接的位置放置目标 URL，或者创建一个标签并将其映射到 URL，这样在插入链接时就可以引用该标签。要在插入链接的位置放置\
    \ URL，你需要将要作为链接的文本放在方括号内，并立即在后面用圆括号括上链接的目标 URL。你可以这样编写文本：\n\n```\n这是一个指向[我的博客](http://www.mailund.dk)的链接。\n\
    ```\n\n这在大多数情况下没问题，但如果你在一个段落中有很多链接，那么链接注释就会开始干扰文本的可读性。相反，你可以给目标链接一个更短的名称，并将目标定义放在文本后面。要做到这一点，你需要将圆括号替换为方括号，如下所示：\n\
    \n```\n这是一个指向[我的博客][blog]的链接。\n```\n\n然后，在后面的文本中，你这样定义链接指向的目标：\n\n```\n[blog]:\
    \ http://www.mailund.dk\n```\n\n你使用相同的语法来制作文档内部的超文本链接。创建指向某个章节的链接最简单的方法是省略目标，而是将章节名称放在方括号内。指向本章的链接可以这样编写：\n\
    \n```\n这是一个指向[编写 Markdown]章节的链接。\n```\n\n当然，如果你希望链接包含不同于章节名称的文本，或者你有几个同名的章节，这种方法就行不通了。你可以通过给章节标题添加显式标签来解决这个问题。这些标签需要放在章节标题后面的花括号内。你可以这样为标题分配标签：\n\
    \n```\n# 我的标题 {#header}\n```\n\n这里需要井号，并且在链接到该章节时也需要井号。井号在 HTML 中用于引用网页的各个部分，Markdown\
    \ 正是从那里继承的语法。为了链接到我们这样标记的章节，我们可以这样编写链接：\n\n```\n这是一个指向该章节的链接。\n```\n\n链接仅对超文本文档有用，在标准\
    \ Markdown 中，你无法创建对图表或任何非章节元素的交叉引用。在 Pandoc 中，你可以通过扩展来实现，但我们会在第 7 章中介绍。\n\n# 图片\n\
    \n要在文档中插入图片，你需使用与插入链接类似的语法。区别在于你需要在链接前加一个感叹号 `!`。\n\n```\n![图片标题](img/图片-URL)\n\
    ```\n\n通常，你会将图片作为本地文件，并使用图片文件的路径，可以是相对于构建文档位置的路径，也可以是绝对路径。\n\n```\n![图片标题](img/我的图片)\n\
    ```\n\n# 练习\n\n以下文本中包含一些练习，你可以借此测试自己对前面所学内容的掌握情况。如果你使用的编辑器能即时显示 Markdown 文本的结果，请在那里测试你的结果。否则，请先将你的答案放在一边，直到我们在第\
    \ 5 章中介绍了如何格式化 Markdown 后再进行处理。\n\n## 章节\n\n编写一个包含三个二级章节的文档，并且每个二级章节内包含两个三级章节。请记住，`#`\
    \ 的数量决定了章节的级别。请同时创建有编号和无编号的章节。\n\n## 强调\n\n编写 `*this* **text** in *Markdown*`。\n\
    \n## 列表\n\n取以下三个项目\n\n*   项目一\n*   项目二\n*   项目三\n\n并将它们分别写成一个有序列表和一个无序列表。\n\n\
    现在，将\n\n*   项目四\n*   项目五\n\n作为子列表放在 `项目一` 下面。\n\n## 块引用\n\n将以下文本制作成一个块引用：\n\n\
    ```\n这是一段我们希望放在块引用中的文本。\n你的任务是实现这一点。\n```\n\n## 链接\n\n编写一段文本，在其中插入一个指向网页的链接以及一个指向你文本中某个章节的链接。\n\
    \n## 图片\n\n找到一个图片文件并将其插入到文本中。\n"
- fmt: "# 4\\. Pandoc Markdown Extensions\n\nMarkdown is, unfortunately, not standardized.\
    \ Different tools will support different markup syntax and process them differently.\
    \ The Markdown described in the previous chapter will work in most, if not all,\
    \ tools. The table syntax is usually less well supported, but the rest of the\
    \ markup will ordinarily work.\n\nPandoc provides several extensions to the Markdown\
    \ language described in the previous chapter. In this chapter, we will see some\
    \ useful extensions for lists and tables. To get a complete list of Pandoc extensions\
    \ to Markdown, you should consult the Pandoc documentation at [https://tinyurl.com/y87mstzf](https://tinyurl.com/y87mstzf).\n\
    \n## Lists\n\nGenerally, the numbers you use when you write an ordered list are\
    \ ignored. They are used to indicate list items, but the actual numbering does\
    \ not matter. This makes it easier to insert a new item in the middle of a list,\
    \ which is a good thing, but sometimes you want to start a list at a different\
    \ number than one, and in that case, basic Markdown can’t help you. With Pandoc,\
    \ though, lists start with the number you give the first item in a list. So you\
    \ can start a list at number three like this:\n\n```\n3. This lists start at number\
    \ three.\n5. Although we used \"5.\" to start this\nitem, it still gets the number\
    \ 4.\n```\n\nThe numbers in the following list items are still ignored. The result\
    \ will look like this:\n\n-   3\\. This lists start at number three.\n-   4\\\
    . Although we used \"5.\" to start this item, it still gets the number 4.\n\n\
    This is a good way to continue lists, but you will have to update the initial\
    \ number when you have added or removed items in the previous list.\n\nTo automatically\
    \ make a list continue at the next number, even when you changed a previous list,\
    \ you can use the special symbol `“@”`. This works just as a number when you use\
    \ it in a list, and it always counts from where you left off. So you can write\
    \ something like this:\n\n```\n(@) Starting a list\n(@) Continuing the list\n\
    Here is some text that doesn't\nbelong to the list.\n(@) This continues the list,\n\
    numbered from where we\nleft off the list.\n(@label) This item is labelled\nso\
    \ that we can refer back\nto it. Like this: see item\n(@label).\n```\n\nThe result\
    \ will look like this:\n\n1.  Starting a list\n2.  Continuing the list\n\nHere\
    \ is some text that doesn’t belong to the list.\n\n1.  This continues the list,\
    \ numbered from where we left off the list.\n2.  This item is labelled so that\
    \ we can refer back to it. Like this: see item (4).\n\nThis can be very useful\
    \ for lists of examples or such, but the `@` counter is global so you cannot restart\
    \ the counter. Unfortunately, there is currently no support for both automatically\
    \ numbered items *and* restarting counters.\n\nIn this example, we also saw another\
    \ feature of Pandoc. We do not have to write a number followed by a dot. In the\
    \ previous example, we put numbers—represented by `@`—in parentheses, and the\
    \ result was a list that used parentheses. You can also use a single closing parenthesis:\n\
    \n```\n1) This is a\n2) list\n3) it really is\n```\n\nIt will give you this list:\n\
    \n1.  This is a\n2.  list\n3.  it really is\n\nIf you make lists using a number\
    \ and a period, you get the standard numbered lists, but you can also use letters\
    \ or Roman numerals just by starting the list with such. If you want to use parenthesis\
    \ instead of periods, you can also do this. You can, for example, create a list\
    \ like this:\n\n1.  This list uses letters instead of numbers.\n2.  We can make\
    \ a sublist with roman numerals:\n    1.  This sublist also uses parenthesis\n\
    3.  Cool, isn’t it?\n\nThe source markup for that list looks like this:\n\n```\n\
    1.  This list uses letters instead of numbers.\n2.  We can make a sublist with\
    \ a roman numerals:\n    1.  This sublist also uses parenthesis\n3.  Cool, isn’t\
    \ it?\n```\n\nYou can mix the different list notations so you have different list\
    \ formats as sublists, but if you mix them at the same level, you will start a\
    \ new list.\n\nLists are frequently used to define terms or concepts, and in Pandoc\
    \ you can create definition lists by following a term with a colon and indenting\
    \ the start of the definition with a tab or at least four spaces. So you can create\
    \ definition lists like this:\n\n**Something we want to define.** Definition of\
    \ the thing\n\nAs long as we indent the following lines, they become part of the\
    \ definition.\n\n**Here starts the next thing we define.** Here we write the definition.\n\
    \nMore of the definition\n\nThe syntax for creating this list is this:\n\n```\n\
    Something we want to define.\n:    Definition of the thing\nAs long as we indent\
    \ the following lines, they\nbecome part of the definition.\nHere starts the next\
    \ thing we define.\n:    Here we write the definition.\nMore of the definition\n\
    ```\n\nAn alternative syntax uses tildes, `\"~\"`, instead of colons:\n\n- **Term\
    \ 1** Definition 1\n- **Term 2** Definition 2a\n\nDefinition 2b\n\n```\nTerm 1\n\
    ~ Definition 1\nTerm 2\n~ Definition 2a\n~ Definition 2b\n```\n\nEither syntax\
    \ will do."
