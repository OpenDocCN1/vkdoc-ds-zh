  trans: '

    ### 图片扩展名


    如果你希望从 Markdown 输入同时生成 PDF 和电子书，你可能希望在 PDF 输出中使用 PDF 矢量图形，而在电子书版本中使用位图 PNG。在 PDF
    输出中使用位图图形意味着你需要考虑分辨率问题，但在电子书中使用 PDF 图形并不总是有效。当你使用如下语法在文档中插入图片时：


    ```

    ![图片标题](img/graphics-file)

    ```


    你需要指定输入文件名，但如果你想同时生成电子书和 PDF，你并不想因为输出格式不同而修改所有文件名。


    你可以省略图形文件的文件扩展名，并使用以下选项来指定所需的扩展名：


    ```

    --default-image-extension

    ```


    这样，对于任何你没有显式写出文件扩展名的图形文件，Pandoc 都会使用默认扩展名。我在生成 PDF 文档时总是使用


    ```

    --default-image-extension=pdf

    ```


    而在生成电子书时使用


    ```

    --default-image-extension=png

    ```


    ### 电子书封面


    电子书除了文本内容外还包含封面图片。如果你制作电子书，你也需要指定封面图片。你可以使用 `--epub-cover-image` 选项来实现。如果你的封面图片位于
    `cover.png` 文件中，你可以这样写：


    ```

    --epub-cover-image=cover.png

    ```


    ## 使用 Makefile


    对于本书，我将所有文本都放在一个 `book.md` 文档中。对于像这样的一本短书来说这没问题，但通常我会将每一章放在单独的文件中。编译我的书籍的命令行可能会变得相当长，而且我经常需要记住不同输出格式的各种选项，所以如果每次构建新版本书籍时都使用命令行，很快就会变得繁琐且极易出错。因此，我使用
    Make (`https://tinyurl.com/nyc2ec2`) 来编译我的书籍。


    如果你不熟悉 Make，我会提供足够的细节让你能够阅读我作为示例给出的 Makefile，并可能为你自己的 Pandoc Makefile 提供一个起点，但全面介绍
    Make 超出了本书的范围。许多程序都能解决 Make 所解决的相同问题，所以如果你不喜欢 Make，还有其他选择。


    我使用的 Makefile 并不复杂，了解以下几点就足够了：


    1.  通过编写 `VARIABLE_NAME := VALUES` 来定义一个变量。

    2.  使用 `$(VARIABLE_NAME)` 来引用变量所持有的值。

    3.  当你编写 `target: dependencies` 时，意思是如果你想要得到 `target`，那么如果自上次构建 `target` 以来任何依赖项发生了变化，你就需要重新构建它。如果依赖项的依赖项发生了变化，那么你需要先构建依赖项，然后再构建目标，以此类推。

    4.  `target: dependencies` 之后用制表符缩进的行是让你的计算机生成 `target` 所需的指令。

    5.  Makefile 中的第一个 `target: dependencies` 行是默认目标，如果你在命令行中没有提供其他目标，Make 将处理这个目标。


    我为本书使用的 Makefile 大致如下（尽管我省略了一些选项）。我将在这里为你逐行讲解。


    ```

    CHAPTERS := header.yml book.md

    PANDOC := pandoc

    OPTS_ALL := --toc --smart \

    --top-level-division=chapter

    PDF_OPTS := $(OPTS_ALL) \

    --default-image-extension=pdf

    EPUB_OPTS := $(OPTS_ALL) \

    --default-image-extension=png \

    -t epub3 --toc-depth=1 \

    --epub-cover-image=cover.png

    all: book.pdf book.epub book.docx

    book.pdf: $(CHAPTERS) Makefile

    $(PANDOC) $(PDF_OPTS) -o $@ $(CHAPTERS)

    book.epub: $(CHAPTERS) Makefile

    $(PANDOC) $(EPUB_OPTS) -o $@ $(CHAPTERS)

    book.docx: $(CHAPTERS) Makefile

    $(PANDOC) $(PDF_OPTS) -o $@ $(CHAPTERS)

    clean:

    rm book.pdf book.epub book.docx

    ```


    我使用一个变量来保存输入文件。本例中只是头文件和一个 Markdown 文件。你可以在 Pandoc 命令行或 YML 文件中指定元数据（见第 8 章）。你可以将元数据放在
    Markdown 文本中，但那样的话它必须位于输入的开头，并且你不能在不包含第一章的情况下翻译单个章节。我更喜欢将元数据放在一个单独的文件中，本例中就是 `header.yml`。


    本书我只有一个 Markdown 文件。我是在 Ulysses 编辑器中写作的，我可以在其中将书籍分成不同的部分，但将其导出为一个合并的文件。由于章节和部分的划分保存在
    Ulysses 中，而不是在单独的文件中，所以我没有每章一个文件。


    我将输入文件放在变量 `CHAPTERS` 中。如果你有多个文件，可以将其添加到 `CHAPTERS` 变量中。我也将 Pandoc 命令行工具放在一个变量中。我安装了多个版本，可以通过更新该变量来切换。之后，我将所有
    Pandoc 运行共享的参数放在 `OPTS_ALL` 中，然后将 PDF 和 EPUB 特定的选项分别放在 `PDF_OPTS` 和 `EPUB_OPTS`
    中。我也会制作 Word 文档，但我可以为此使用 PDF 参数；Pandoc 会知道如何用与 PDF 相同的选项来制作 Word 文档。接下来是所有目标、依赖项以及生成目标的命令。目标
    `all` 和 `clean` 是特殊的。第一个本身不构建任何东西；它只是触发其依赖项的构建——因此它是间接构建这些依赖项——这些依赖项是 Makefile
    知道如何制作的三种书籍格式。`clean` 目标没有任何依赖项，但它会删除我们用中间三条命令生成的书籍。


    然后我定义了一些我想用于所有输出格式的选项，以及一些我只想用于 PDF 的选项，以及其他我只想用于电子书的选项。在元数据中，我设置了 PDF 输出，我也可以把它放在头文件中——如果这样做，它们不会干扰
    EPUB 输出——但我选择在这里设置它们。


    我在 Makefile 中构建 EPUB 书籍，但如果你计划在 iBooks 上发布，我不建议使用这个文件。我发现使用 Pages 来排版和提交书籍要容易得多。Pages
    可以读取 Word 文档，这也是我通常向 iBooks 提交书籍的方式：我制作一个 Word 文档，在 Pages 中打开它，然后提交。你可能会认为以正确的格式构建书籍然后使用
    iTunes Connect 提交会更简单。你错了。如果你想在亚马逊（通过 Kindle Direct Publishing）上发布，你最好也使用他们的工具
    Kindle Create。Kindle Create 可以读取 Word 文件，你可以从那里提交。有一个命令行工具可以将 EPUB 转换为 Kindle
    上使用的 MOBI 文件格式，但 Kindle Create 更易于使用。


    # 6. 数学和计算机编程语言


    你可能没有编写技术或科学文本的习惯，但如果你有，那么 Pandoc 支持数学和计算机编程代码格式。'
- fmt: '# Writing Math


    Pandoc has some excellent support for writing math as long as your output file
    format supports it. Word files have built-in support for math, and Pandoc will
    use this if the output file is a Word document. With PDF, Pandoc uses LaTeX as
    an intermediate format, and LaTeX is spectacularly perfect for math. With HTML
    and EPUB, you have some math support depending on the version and libraries you
    use to display the math.


    For HTML and EPUB, you have different options for how the output should handle
    math. I usually use either MathML（⁴） or MathJax（⁵） when I have math in HTML or
    EPUB documents. For MathML you can use the option `--mathml`:


    ```

    pandoc --mathml -o document.epub document.md

    ```


    For MathJax, you need to produce EPUB3 documents to get it to work, so you must
    specify the output format as well:


    ```

    pandoc --to=epub3 --mathjax \

    -o document.epub document.md

    ```


    With either option, you get an EPUB document that displays the math well. Not
    as beautiful as in PDF documents, where LaTeX handles the math, but reasonably
    well.


    The way you write math in your document is by inlining TeX syntax. The math in
    output documents will only be TeX if you output a LaTeX file or go through LaTeX
    when building a PDF file, but the de facto standard for how to write math in plain
    text is TeX, so that is what Pandoc uses.


    You start and end math using dollar signs. If you use one, you get inline math,
    and if you use two, you get “display” math, which means you get the math on a
    single line and centered. This is inline math: `$\int_aˆb x\,\mathrm{d}x$` looks
    like ![$$ \underset{a}{\overset{b}{\int }}x\kern0.5em \mathrm{d}x $$](images/486315_1_En_6_Chapter/486315_1_En_6_Chapter_TeX_IEq1.png).
    You write display mode math between double dollar signs, so this


    ```

    $$\sum_{j=1}^N \frac{1}{j^2}$$

    ```


    will result in this:


    ![$$ \sum \limits_{j=1}^N\frac{1}{j^2} $$](images/486315_1_En_6_Chapter/486315_1_En_6_Chapter_TeX_Equa.png)


    Pandoc supports a large subset of math you can write in LaTeX. For example, here
    is a more complex equation:


    ![$$ d\left(i,j\right)=\Big\{{\displaystyle \begin{array}{l}i\\ {}j\\ {}\min \Big\{\begin{array}{l}d\left(i-1,j-1\right)\kern0.5em
    +\kern0.5em 1\left(i\ne j\right)\\ {}d\left(i,j-1\right)\kern0.5em +\kern0.5em
    1\\ {}d\left(i-1,j\right)\kern0.5em +\kern0.5em 1\end{array}\end{array}}\kern0.5em
    {\displaystyle \begin{array}{l}j=0\\ {}i=0\\ {}i&gt;0,\kern0.5em j&gt;0\end{array}}
    $$](images/486315_1_En_6_Chapter/486315_1_En_6_Chapter_TeX_Equb.png)


    The LaTeX code looks like this:


    ```

    $$

    d(i,j) = \begin{cases}

    \,i & j = 0 \\

    \,j & i = 0 \\

    \,\min\begin{cases}

    d(i-1,j-1) + \mathrm{1}(i\neq j) \\

    d(i,j-1) + 1 \\

    d(i-1,j) + 1

    \end{cases} & i>0,j>0

    \end{cases}

    $$

    ```


    If you write math that Pandoc cannot handle, for example, if you use a LaTeX package
    that Pandoc does not know about, then you can just write the LaTeX code anyway.
    What Pandoc doesn’t understand it passes on to the output. So, as long as your
    output is a format that goes through LaTeX, you are good to go.


    If your output is HTML or EPUB where you use MathML or MathJax, then you can also
    write an equation that should be passed along verbatim to the output.


    If you have a single document but want separate equations for different output
    formats, you cannot just let the text fall through to the output. There, you need
    to output one version for one output format and another for another format. Here,
    Pandoc lets you write verbatim text that will only be included for a specific
    output format. You can write


    ```

    ```{=latex}

    $$\sum_{j=1}^N \frac{1}{j^2}$$

    ```

    ```


    for a block of text that should only be included if the output is LaTeX and write


    `` `$f(x)=x^2$`{=latex} ``


    for inline text.


    # Writing Code Blocks


    Markdown is frequently used by programmers to write about programs, so not surprisingly
    it has support for displaying code examples, typically with formatting to syntax
    highlight the examples. This support varies between different tools, but Pandoc
    has terrific support for many programming languages.


    The syntax for writing a block of code uses either tilde, “~”, or backticks, “`”.
    Of these, backticks are more likely to be supported by other tools; so, I will
    use these here. Every example I give in the following will also work if you use
    `~` instead of a backtick.


    You start a block with three backticks, then write your code, and then end the
    block with another three backticks.


    ```

    ```

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ```

    ```


    You can also use tiles instead of backticks, but I will use backticks in this
    chapter.


    ```

    ~~~

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ~~~

    ```


    If you only use backticks or `~`, you get a verbatim text block, just as if you
    had indented the text. To get syntax highlighting, you must also inform Pandoc
    of which programming language you are using. You can do this by writing the name
    of the language after the first line of backticks. To syntax highlight the preceding
    code, which is written in C programming language, you would write


    ```

    ```c

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ```

    ```


    The result will look like this:


    ```

    for (int i = 0; i < n; i++) {

    printf("%d\n", i);

    }

    ```


    A block of Python code would look like this:


    ```

    ```python

    for i in range(n):

    print(i)

    ```

    ```


    The result would look like this:


    ```

    for i in range(n):

    print(i)

    ```


    To get a complete list of supported programming languages, you can run the command


    ```

    pandoc --list-highlight-languages

    ```'
