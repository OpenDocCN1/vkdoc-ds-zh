    \ \\\n--standalone -o output.html input.md\n```\n\nIf you now read the `output.html`\
    \ file, you will see that Pandoc has inserted “My Title” between the title tags\
    \ and inserted a level-one header that says “My Title”.\n\nWhen Pandoc generates\
    \ a standalone document, it uses metadata such as title and author(s) to fill\
    \ in some information. This data is usually not specified in the Markdown input—there\
    \ aren’t any Markdown annotations for defining such metadata—but you can set it\
    \ using the `--metadata` option or using YAML (see the following text).\n\nStrictly\
    \ speaking, there are two types of variables that are used when producing the\
    \ output: metadata, specified with `--metadata`, and variables, specified with\
    \ `--variable`. The difference between them is that metadata can be seen and processed\
    \ by Pandoc and Pandoc filters—scripts that process your input before it is formatted\
    \ for the output—while variables are used in templates. If you set a variable\
    \ using the `--metadata` tag , or in a metadata header, the variable will also\
    \ be available to templates, so you can usually stick to metadata. The output\
    \ isn’t *exactly* the same since filters might do something with metadata that\
    \ they won’t do with variables, but it is easier to stick with one kind of options.\
    \ So unless you have good reasons not to, use metadata."
  trans: "\n# 引用图表、表格和公式\n\n要引用图表，使用与引用章节相同的语法，只需注意图表标签的定义位置以及标签的前缀。要定义图表的标签，必须为其添加\
    \ `#fig:` 前缀，并将标签紧跟在插入图表的标记之后，因此使用如下语法：\n\n```\n标题文字{#fig:标签}\n```\n\n图表插入标记与标签定义之间不能有空格。引用图表标签的方式与引用章节标签相同。\n\
    \n对于表格，标签必须以 `#tbl:` 开头，并放置在表格标题之后：\n\n```\na   b   c\n--- --- ---\n1   2   3\n\
    4   5   6\n: 标题文字 {#tbl:标签}\n```\n\n对于表格，标题与标签之间*必须*有一个空格。\n\n对于显示风格的数学公式，即独占一行并使用两个美元符号书写的公式，如果标签以\
    \ `#eq:` 开头，并且标签与结尾的双美元符号之间有一个空格且写在同一行上，则可以为其添加标签：\n\n```\n$$ f(x) = x² + a x\
    \ $$ {#eq:标签}\n```\n\n你可以像更改章节的默认前缀一样，通过 `figPrefix`、`tblPrefix` 和 `eqnPrefix`\
    \ 元数据，分别更改图表、表格和公式的默认前缀。\n\n有关如何使用交叉引用过滤器的更多详细信息，请参考其在线手册。^(⁹)\n\n## 参考文献\n\n\
    如果你的文本需要引文和参考文献，可以通过使用 `--bibliography` 选项运行 Pandoc，或使用 `--filter pandoc-citeproc`\
    \ 来启用 `pandoc-citeproc` 过滤器。\n\n如果你同时使用 `pandoc-crossref` 和 `pandoc-citeproc`\
    \ 过滤器，必须始终先使用 `pandoc-crossref`：\n\n```\npandoc --filter pandoc-crossref \\\n\
    --filter pandoc-citeproc ...\n```\n\n这两个过滤器使用类似的引文语法，这意味着运行过滤器的顺序很重要。如果 `citeproc`\
    \ 过滤器遇到交叉引用标签，它就会混淆。但如果先运行交叉引用过滤器，则不会发生同样的问题；它会保留引文代码，以便引文过滤器可以处理它们。\n\n使用 `--bibliography`\
    \ 选项时，你需要指定包含参考文献的文件。使用 `--filter pandoc-citeproc` 时，你可以改为在 YAML 头信息中将参考文献文件指定为元数据，例如：\n\
    \n```\n---\nbibliography: citations.bib\n---\n```\n\n`pandoc-citeproc` 过滤器可以读取多种文件格式的参考文献，并根据文件后缀名选择格式。对于`.bib`\
    \ 文件，它将使用 BibTeX。对于 EndNote 文件，应使用 `.enl`，对于 ISI 文件，则使用 `.wos`。请查看在线文档^(¹⁰)以获取完整列表。\n\
    \n要控制引文和参考文献的格式，你可以使用元数据变量 `csl` 或 Pandoc 选项 `--csl` 指定一个 CSL^(¹¹) 文件。大多数期刊样式的\
    \ CSL 文件都可以从 GitHub 下载。^(¹²)\n\n例如，如果 `smith12` 是你参考文献中的一个键，你可以使用 `[@smith12]`\
    \ 插入一条引文。即使 `@` 不是参考键的一部分，你也需要包含它；过滤器（以及 Pandoc）使用它来识别引文。你可以通过用分号分隔参考文献来引用多个参考文献：`[@smith12;\
    \ @smith14]`。\n\n根据引文样式，插入的引用可能包含作者姓名。如果你在文本中已经提到了作者，这可能会影响阅读体验，你可以通过在参考文献前加上一个减号来禁用作者姓名：`[-@smith12]`。省略方括号直接写\
    \ `@smith12` 也能达到同样的效果。\n\n更一般地，你可以在引文中插入文本以添加例如页码或其他注释，如 `[see @smith12, chap1;\
    \ also @smith14, chap 12]`。如果你省略方括号以获得内嵌引文，则可以在参考文献后的方括号中写入注释，使其显示在括号内（同样，取决于你的引文样式）：`see\
    \ @smith12 [chapter 11]`。\n\n参考文献将被放在文档的末尾。如果你想为参考文献添加一个章节标题，应在你的 Markdown 文档末尾以该标题结束。\n\
    \n## 练习题\n\n### 引用章节\n\n编写三个章节。在第二个和第三个章节中，分别引用第一章和第二章。\n\n### 图表、表格和公式\n\n编写一个文档，其中包含一个图表、一个表格和一个公式。分别对它们进行引用。\n\
    \n### 参考文献\n\n如果你有参考文献，则编写一个引用其中条目的文档。\n\n脚注 1 2 3 4 5 6 7\n\n# 元数据\n\n如果你回过头来看第\
    \ 5 章中的独立 HTML 文档，该文档是这样的：\n\n```\n# 这是一个测试文档\n以下是文档中的一些文本。\n* 这是一个列表\n* 包含两个项目\n\
    ```\n\n我们是像这样编译它的：\n\n```\npandoc --standalone -o output.html input.md\n```\n\n\
    你应该会收到如下警告：\n\n```\n[WARNING] This document format requires a nonempty\n element.\n\
    Please specify either 'title' or 'pagetitle' in\nthe metadata,\ne.g. by using\
    \ --metadata pagetitle=\"...\" on the\ncommand line.\nFalling back to 'input'\n\
    ```\n\n然后你的文档标题将正如警告所说，如下所示：\n\n```\ninput\n```\n\nPandoc 在你的文档中插入了一个标题，但它被设置为了默认值\
    \ `input`，因为我们没有指定它。尝试改为运行以下命令：\n\n```\npandoc --metadata title=\"My Title\" \\\
    \n--standalone -o output.html input.md\n```\n\n如果你现在读取 `output.html` 文件，你会看到 Pandoc\
    \ 在标题标签之间插入了“My Title”，并插入了一个显示为“My Title”的一级标题。\n\n当 Pandoc 生成独立文档时，它会使用诸如标题和作者之类的元数据来填充一些信息。这些数据通常不在\
    \ Markdown 输入中指定——没有任何 Markdown 注释用于定义这种元数据——但你可以使用 `--metadata` 选项或 YAML（参见下文）来设置它。\n\
    \n严格来说，生成输出时使用的变量有两种：通过 `--metadata` 指定的元数据，以及通过 `--variable` 指定的变量。它们的区别在于，元数据可以被\
    \ Pandoc 和 Pandoc 过滤器（在输入格式化为输出之前处理输入的脚本）看到和处理，而变量则用于模板中。如果你使用 `--metadata` 标签或在元数据头信息中设置了一个变量，该变量也将对模板可用，因此你通常可以坚持使用元数据。输出并非*完全相同*，因为过滤器可能会对元数据进行一些不会对变量进行的操作，但坚持使用一种选项更容易。因此，除非你有充分的理由不这样做，否则请使用元数据。\n"
- fmt: "## YAML for metadata\n\nThere are potentially many values you want to specify\
    \ as metadata, so you don't want to rely on command line options for all of those.\
    \ Luckily, `Pandoc` can read metadata from a header in your input, specified in\
    \ another markup language called YAML (Yet Another Markup Language). YAML is a\
    \ different kind of markup language than Markdown. It is not intended for marking\
    \ up a text but for providing structured data to tools.\n\nYou can put a YAML\
    \ header with metadata at the top of your input text to provide `Pandoc` with\
    \ the information. I usually put my metadata in a separate file instead and give\
    \ that as the first input file when I run `Pandoc`. Since `Pandoc` concatenates\
    \ the input files you give it, this is equivalent to putting the metadata at the\
    \ top of the document, but it does give me the option of using different headers\
    \ when I produce output in different formats and I can easily format different\
    \ Markdown files with the same metadata.\n\nA YAML header starts with three hyphens\
    \ `---` on a line of their own and is terminated with another three hyphens. Inside\
    \ the header, you can put key-value information. The keys are followed by a colon,\
    \ and the values follow the colon. The header I use for this book looks like this:\n\
    \n```\n---\ntitle:\n\"My Markdown and Pandoc book\"\nauthor:\n- Thomas Mailund\n\
    year: 2019\n---\n```\n\nIt sets three values, the title, the author, and the year\
    \ I am writing the book, which is all that I need for this book. I didn't need\
    \ to put the title in quotes. I could write it as it is, the same way I write\
    \ my name in the author's field. However, if a title, or any value in general,\
    \ contains a colon, you do need to put the value in quotes. Here, I use the quotes\
    \ to show that as an example.\n\nYou will notice that for the `author:` field\
    \ I have a hyphen before my name. I didn't have to put that there either, but\
    \ I did to show you a list. When you want a key to refer to a sequence of values,\
    \ for example, if you have more than one author on a document, you use hyphens\
    \ before each element in the list. Here, I make `author` refer to a list of length\
    \ one. The result is the same as if I hadn't put my name in a list, but if I had\
    \ a coauthor, we would need the list syntax.\n\nI have this header in a file called\
    \ `header.yml`, and I can compile the book into a PDF file with the command\n\n\
    ```\npandoc -o book.pdf header.yml book.md\n```\n\nThe actual command line is\
    \ more complex (see the Makefile in Chapter [5](#486315_1_En_5_Chapter.xhtml)),\
    \ but this command would suffice to generate a book.\n\nThe YAML language is essentially\
    \ a way of mapping keys to values. In the preceding header, you have three keys:\
    \ `title`, `author`, and `year`. A key can map to a single scalar value. `title`\
    \ and `year` do that. They can also map to a list, as `author` does. Keys can\
    \ also map to nested key-value mappings. Consider this:\n\n```\nauthor:\n- name:\
    \ Thomas Mailund\n  affiliation: Unseen University\n- name: Karsken Baelg\n  affiliation:\
    \ Brakebills University\n```\n\nHere `author` is a list—you can see this because\
    \ you have dashes before each author. Each author is a nested mapping; they have\
    \ two keys, `name` and `affiliation`. That it is another mapping is because they\
    \ have keys followed by a colon and then values to the right of this. In short,\
    \ scalars are keys followed by a single value, lists are keys followed by a sequence\
    \ of items separated by hyphens, and nested maps are nested key-value maps. For\
    \ lists and maps, there is a more concise notation. For a list you can put its\
    \ values in square brackets and comma-separate them:\n\n```\nauthor_names: [\"\
    Thomas Mailund\", \"Karsken Baelg\"]\n```\n\nFor maps you can use curly brackets\
    \ instead:\n\n```\nauthor:\n- { name: \"Thomas Mailund\",\n    affiliation: \"\
    Unseen University\" }\n- { name: \"Karsken Baelg\",\n    affiliation: \"Brakebills\
    \ University\" }\n```\n\nHere, the items in the list have the same structure.\
    \ They need not have this; it is easier to write code to process it when they\
    \ do, though.\n\nIf you have a long text, you can break it into several lines\
    \ in the YAML file using either `|` or `>`:\n\n```\nabstract: |\n  This is a very\
    \ long abstract and\n  it is probably the best paper ever.\n  We are sure that\
    \ you will all agree.\n```\n\nThe difference between the two is that `|` will\
    \ preserve linebreaks, while `>` will remove new lines and replace them with space.\
    \ You can continue the text in these blocks as long as you want to, as long as\
    \ you indent each line.\n\nYou can write arbitrarily complex YAML, but `Pandoc`\
    \ will only use the metadata that it knows how to process. Which variables are\
    \ interpreted by `Pandoc` depends on the output format and the template you that\
    \ use (see Chapter [9](#486315_1_En_9_Chapter.xhtml)). Check the `Pandoc` manual\
    \ at [`https://tinyurl.com/yyxgole5`](https://tinyurl.com/yyxgole5) for details\
    \ on the default templates, and see Chapter [9](#486315_1_En_9_Chapter.xhtml)\
    \ for how to use metadata in your own templates."
  raw: '## YAML for metadata


    There are potentially many values you want to specify as metadata, so you don’t
    want to rely on command line options for all of those. Luckily, Pandoc can read
    metadata from a header in your input, specified in another markup language called
    YAML (Yet Another Markup Language). YAML is a different kind of markup language
    than Markdown. It is not intended for marking up a text but for providing structured
    data to tools.


    You can put a YAML header with metadata at the top of your input text to provide
    Pandoc with theinformation. I usually put my metadata in a separate file instead
    and give that as the first input file when I run Pandoc. Since Pandoc concatenates
    the input files you give it, this is equivalent to putting the metadata at the
    top of the document, but it does give me the option of using different headers
    when I produce output in different formats and I can easily format different Markdown
    files with the same metadata.


    A YAML header starts with three hyphens `---` on a line of their own and is terminated
    with another three hyphens. Inside the header, you can put key-value information.
    The keys are followed by a colon, and the values follow the colon. The header
    I use for this book looks like this:


    ```


    title:

    "My Markdown and Pandoc book"

    author:

    - Thomas Mailund

    year: 2019


    ```


    It sets three values, the title, the author, and the year I am writing the book,
    which is all that I need for this book. I didn’t need to put the title in quotes.
    I could write it as it is, the same way I write my name in the author’s field.
    However, if a title, or any value in general, contains a colon, you do need to
    put the value in quotes. Here, I use the quotes to show that as an example.


    You will notice that for the `author:` field I have a hyphen before my name. I
    didn’t have to put that there either, but I did to show you a list. When you want
    a key to refer to a sequence of values, for example, if you have more than one
    author on a document, you use hyphens before each element in the list. Here, I
    make `author` refer to a list of length one. The result is the same as if I hadn’t
    put my name in a list, but if I had a coauthor, we would need the list syntax.


    I have this header in a file called `header.yml`, and I can compile the book into
    a PDF file with the command


    ```

    pandoc -o book.pdf header.yml book.md

    ```


    The actual command line is more complex (see the Makefile in Chapter [5](#486315_1_En_5_Chapter.xhtml)),
    but this command would suffice to generate a book.


    The YAML language is essentially a way of mapping keys to values. In the preceding
    header, you have three keys: `title`, `author`, and `year`. A key can map to a
    single scalar value. `title` and `year` do that. They can also map to a list,
    as `author` does. Keys can also map to nested key-value mappings. Consider this:


    ```

    author:

    - name: Thomas Mailund

    affiliation: Unseen University

    - name: Karsken Baelg

    affiliation: Brakebills University

    ```


    Here `author` is a list—you can see this because you have dashes before each author.
    Each author is a nested mapping; they have two keys, `name` and `affiliation`.
    That it is another mapping is because they have keys followed by a colon and then
    values to the right of this. In short, scalars are keys followed by a single value,
    lists are keys followed by a sequence of items separated by hyphens, and nested
    maps are nested key-value maps. For lists and maps, there is a more concise notation.
    For a list you can put its values in square brackets and comma-separate them:


    ```

    author_names: ["Thomas Mailund", "Karsken Baelg"]

    ```


    For maps you can use curly brackets instead


    ```

    author:

    - { name: "Thomas Mailund",

    affiliation: "Unseen University" }

    - { name: "Karsken Baelg",

    affiliation: "Brakebills University" }

    ```


    Here, the items in the list have the same structure. They need not have this;
    it is easier to write code to process it when they do, though.


    If you have a long text, you can break it into several lines in the YAML file
    using either `|` or `>`


    ```

    abstract: |

    This is a very long abstract and

    it is probably the best paper ever.

    We are sure that you will all agree.

    ```


    The difference between the two is that `|` will preserve linebreaks, while `>`
    will remove new lines and replace them with space. You can continue the text in
    these blocks as long as you want to, as long as you indent each line.


    You can write arbitrarily complex YAML, but Pandoc will only use the metadata
    that it knows how to process. Which variables are interpreted by Pandoc depends
    on the output format and the template you that use (see Chapter [9](#486315_1_En_9_Chapter.xhtml)).
    Check the Pandoc manual at [`https://tinyurl.com/yyxgole5`](https://tinyurl.com/yyxgole5)
    for details on the default templates, and see Chapter [9](#486315_1_En_9_Chapter.xhtml)
    for how to use metadata in your own templates.'
  trans: "\n## 用于元数据的 YAML\n\n你可能想要指定的元数据有很多，因此你不想仅依赖命令行选项来设置所有这些信息。幸运的是，`Pandoc`\
    \ 可以从输入文件的头部读取元数据，该头部使用另一种名为 YAML（Yet Another Markup Language，另一种标记语言）的标记语言来指定。YAML\
    \ 是一种与 Markdown 不同的标记语言。它的目的不是对文本进行标记，而是为工具提供结构化数据。\n\n你可以将包含元数据的 YAML 头部放在输入文本的顶部，以便向\
    \ `Pandoc` 提供这些信息。我通常会将元数据放在一个单独的文件中，并在运行 `Pandoc` 时将其作为第一个输入文件给出。由于 `Pandoc`\
    \ 会连接你给出的所有输入文件，因此这等同于将元数据放在文档顶部，但这样做可以让我在生成不同格式的输出时使用不同的头部，并且我可以轻松地用相同的元数据格式化不同的\
    \ Markdown 文件。\n\n一个 YAML 头部以单独一行上的三个连字符 `---` 开始，并以另外三个连字符结束。在头部内部，你可以放置键值对信息。键后面跟一个冒号，值跟在冒号后面。我在这本书中使用的头部如下所示：\n\
    \n```\n---\ntitle:\n\"My Markdown and Pandoc book\"\nauthor:\n- Thomas Mailund\n\
    year: 2019\n---\n```\n\n它设置了三个值：标题、作者以及我撰写本书的年份，这些就是本书所需的所有信息。我其实不需要给标题加引号。我可以直接按原样书写，就像我在作者字段中写自己的名字一样。然而，如果标题（或任何值）包含冒号，则必须将值放在引号中。此处，我用引号来举例说明。\n\
    \n你会注意到，在 `author:` 字段中，我的名字前面有一个连字符。其实我也不必加这个连字符，但加上是为了向你展示一个列表。当希望一个键指向一系列值时，例如文档有多个作者时，你需要在列表的每个元素前使用连字符。这里，我让\
    \ `author` 指向一个长度为 1 的列表。结果与我没有将名字放在列表中是一样的，但如果我有合著者，我们就需要这种列表语法。\n\n我有这样一个头部文件，名为\
    \ `header.yml`，我可以通过以下命令将这本书编译成 PDF 文件：\n\n```\npandoc -o book.pdf header.yml\
    \ book.md\n```\n\n实际的命令行会更复杂（参见第 5 章的 Makefile），但这个命令足以生成一本电子书。\n\nYAML 语言本质上是一种将键映射到值的方法。在上述头部中，你有三个键：`title`、`author`\
    \ 和 `year`。一个键可以映射到一个单一的标量值。`title` 和 `year` 就是如此。它们也可以映射到一个列表，就像 `author` 那样。键还可以映射到嵌套的键值映射。考虑以下示例：\n\
    \n```\nauthor:\n- name: Thomas Mailund\n  affiliation: Unseen University\n- name:\
    \ Karsken Baelg\n  affiliation: Brakebills University\n```\n\n这里的 `author` 是一个列表——你可以从每个作者前的短横线看出。每个作者都是一个嵌套映射；它们有两个键：`name`\
    \ 和 `affiliation`。说它是一个映射，是因为它们有键，后面跟冒号，然后右边是值。简而言之，标量是键后跟一个单一值，列表是键后跟一系列用连字符分隔的项目，而嵌套映射则是嵌套的键值映射。对于列表和映射，还有一种更简洁的表示法。对于列表，你可以将值放在方括号内，并用逗号分隔：\n\
    \n```\nauthor_names: [\"Thomas Mailund\", \"Karsken Baelg\"]\n```\n\n对于映射，你可以改用花括号：\n\
    \n```\nauthor:\n- { name: \"Thomas Mailund\",\n    affiliation: \"Unseen University\"\
    \ }\n- { name: \"Karsken Baelg\",\n    affiliation: \"Brakebills University\"\
    \ }\n```\n\n这里，列表中的项目具有相同的结构。它们不必一定如此；不过，当它们结构相同时，编写代码来处理它们会更容易。\n\n如果你有一段较长的文本，可以在\
    \ YAML 文件中使用 `|` 或 `>` 将其分成多行：\n\n```\nabstract: |\n  This is a very long abstract\
    \ and\n  it is probably the best paper ever.\n  We are sure that you will all\
    \ agree.\n```\n\n两者的区别在于，`|` 会保留换行符，而 `>` 会移除换行符并用空格替换。你可以根据需要在这些块中继续书写文本，只要缩进每一行即可。\n\
    \n你可以编写任意复杂的 YAML，但 `Pandoc` 只会使用它知道如何处理的元数据。`Pandoc` 解释哪些变量取决于输出格式和你所使用的模板（参见第\
    \ 9 章）。有关默认模板的详细信息，请查看[`https://tinyurl.com/yyxgole5`](https://tinyurl.com/yyxgole5)上的\
    \ `Pandoc` 手册，并参阅第 9 章了解如何在自己的模板中使用元数据。\n"
- fmt: "# 9. Using Templates\n\nWhen `Pandoc` creates a standalone document, it uses\
    \ a template for the output. A template is essentially a document with some placeholder\
    \ variables, where metadata and your processed Markdown text will be inserted.\
    \ Which metadata will be used in a template depends on the output format; you\
    \ can get a full list of variables for your output in the Pandoc manual.^([13])\
    \ `Pandoc` automatically sets some metadata, described in the manual, but you\
    \ can specify other metadata in the header.\n\nUnless you specify another template\
    \ explicitly, `Pandoc` will use a default for the output format. You can get `Pandoc`\
    \ to show you the template it uses for a specific output by running the `pandoc\
    \ -D` command, for example, to see what it will use if you generate a PDF file—which\
    \ it does by generating a LaTeX document and then compiling it—you can write `pandoc\
    \ -D latex`. You can also get a full list of default templates and what they look\
    \ like at [`https://github.com/jgm/pandoc-templates`](https://github.com/jgm/pandoc-templates).\n\
    \nIf you don't know LaTeX, the template you get by running `pandoc -D latex` might\
    \ not make much sense, so let us look at `pandoc -D html` instead. The output\
    \ is rather long, and I won't replicate it all here but highlight a few parts\
    \ of it.\n\nRemember the title we discussed in Chapter 8. It was empty before\
    \ we provided metadata for the title. Let us see what it looks like in the template.\
    \ There you will find a line that looks like this：\n\n```\n$if(title-prefix)$\n\
    $title-prefix$ -\n$endif$\n$pagetitle$\n```\n\nThe stuff in dollar signs specifies\
    \ placeholders and code for how the template should be processed. Inside the title\
    \ tags in the HTML template, you have two metadata variables that can be inserted,\
    \ `title-prefix` and `pagetitle`. The title prefix will only be inserted if it\
    \ exists; that is what the `$if(title-prefix)$` code checks. Strictly speaking,\
    \ `pagetitle` will also only be inserted if it exists. Otherwise, we get an empty\
    \ string. But because the title prefix should be followed by a dash, there is\
    \ an explicit test to see if anything should be inserted.\n\nWe never provided\
    \ metadata for `title-prefix` and `pagetitle`, so it is hard to see how they relate\
    \ to the `title` metadata we provided. We *could* have provided those two explicitly,\
    \ but `Pandoc` creates them based on our title. It directly uses `title` variable\
    \ elsewhere in the template, where the template contains：\n\n```\n$title$\n```\n\
    \n`Pandoc` and filters can access metadata and create new metadata, which is what\
    \ it does for the `title-prefix` and `pagetitle`. The `title` placeholder is just\
    \ inserted directly as the text you specified in the metadata.\n\nI am not aware\
    \ of any documentation for precisely what metadata manipulations you can expect\
    \ for each output format, and I am not sure you should rely on any as it might\
    \ not be stable across different versions of `Pandoc` and filters. If you don't\
    \ work with derived metadata and stick to explicitly defined metadata, however,\
    \ how the data is used is relatively straightforward. If you have a simple placeholder\
    \ like `$title$`, then the string you specified in the metadata will just be inserted\
    \ there in the output file.\n\nAs we saw for `title-prefix`, metadata can also\
    \ be inserted conditionally on it being defined. To insert `some text` only if\
    \ a metavariable `variable` is defined, a template can contain this construction：\n\
    \n```\n$if(variable)$ some text $endif$\n```\n\nThere is also an if-else construction\
    \ that looks like this：\n\n```\n$if(variable)$\nsome text\n$else$\nsome other\
    \ text\n$endif$\n```\n\nFinally, there is a loop construction. In the HTML template,\
    \ you can find this piece of text：\n\n```\n$for(author)$\n$author$\n$endfor$\n\
    ```\n\nThis runs through the authors specified in the metadata and inserts each\
    \ of them. If `author` is not a list, it will still work; it will just be considered\
    \ a list of length one, but if we did have a list of authors, we would get a level-two\
    \ header for each of them.\n\nRemember that metadata can be structured with values\
    \ containing lists of key-value bindings. Take this example：\n\n```\nauthor:\n\
    - name: Thomas Mailund\n  affiliation: Unseen University\n- name: Karsken Baelg\n\
    \  affiliation: Brakebills University\n```\n\nHere, authors are not simple strings,\
    \ but a list of key-value structures, each with a name and an affiliation. Inside\
    \ a template, these fields can be accessed using \"dot-notation,\" so a template\
    \ might contain code like this：\n\n```\n$for(author)$\n$if(author.name)$\n$author.name$\n\
    $if(author.affiliation)$\n($author.affiliation$)\n$endif$\n$else$\n$author$\n\
    $endif$\n$endfor$\n```\n\nThis code iterates through the author list and inserts\
    \ authors' names (if they have a name, which they probably should have). If they\
    \ have an affiliation, the affiliation is added after the name. If the list of\
    \ authors contains items that are not structured with a name and an affiliation,\
    \ the template inserts the list item (see the `$else$` part of the `$if(author.name)$`\
    \ test).\n\nThe most important part of the output, of course, is the processed\
    \ Markdown from the input text. In the template, this is inserted at the hardly\
    \ noticeable `$body$` placeholder. It doesn't look like much, but this is where\
    \ all your Markdown will be inserted once it is processed to the output format.\n\
    \n## Writing Your Own Templates\n\nTemplates are another of those features that\
    \ are nice to have when you need them, but you don't have to worry about when\
    \ you don't. You can use `Pandoc` without ever having to worry about templates,\
    \ but if you have to format your documents in a specific way, you don't have to\
    \ abandon `Pandoc` to write your text; you can create a template to take care\
    \ of the formatting. For example, if you are an academic like me, and have to\
    \ use different formats for different journals, you can make templates to match\
    \ the journals. Journals often provide LaTeX templates for papers, and you can\
    \ take one of those templates and put in `Pandoc` placeholders, and presto you\
    \ have a `Pandoc` template and you can write the paper in Markdown and still have\
    \ it formatted according to the journal standard.\n\nYou can get inspiration for\
    \ writing your own templates from `Pandoc`'s user-contributed templates.^([14])\
    \ I find that the easiest way to create a new template is to take one of `Pandoc`'s\
    \ existing templates and modify it or by taking an existing HTML or LaTeX file\
    \ and put in metadata and `$body$` placeholders.\n\nThe reason that the default\
    \ templates are lengthy and complicated is that they need to set up a long list\
    \ of things, such as configuring math or source code highlighting. If you need\
    \ all the features that `Pandoc` provides, I suggest that you copy one of the\
    \ existing templates and modify it. For this chapter, I will write simpler templates,\
    \ aiming for clarity rather than completeness. The Markdown input is correspondently\
    \ simple. If you need more features, you can find the necessary code in the default\
    \ template. It is usually not hard to find."
