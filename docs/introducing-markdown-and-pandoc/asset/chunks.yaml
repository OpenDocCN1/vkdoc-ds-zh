    but for other formats we must. Since we are not guaranteed that we see an exercise
    before we reference it, we must traverse the entire document and make the map
    before we traverse it again and modify the document.


    The easiest way to traverse the document is with the `run_filter` function , but
    we cannot run it more than once. There is another function, `run_filters`—notice
    the plural—that handles that. One filter will provide the input to the next; we
    don’t want to modify anything with the filter that collects the map, so we just
    let it return None (implicitly by not returning another value).


    The filter for making the map is straightforward and looks like this:


    ```

    ex_dict = {}

    no_exercise = 1

    def collect_numbers(elem, doc):

    global no_exercise

    if type(elem) == Div and \

    "Exercise" in elem.classes:

    if elem.identifier:

    ex_dict[elem.identifier] = no_exercise

    no_exercise += 1

    ```


    When we number the exercises, in the filter that modifies the document, we need
    to reset `no_exercise` . This is not easy when the two scripts are called one
    after another, but a straightforward solution is to use a second counter. If you
    do this, then the preceding `number_exercises` filter will work as before. It
    adds the numbers, but it didn’t need the map earlier, and it doesn’t need it now.


    Instead, we will write a third filter that does this; let us call it `handle_citations`
    . I describe this function in the following text.


    We can call the three filters using


    ```

    run_filters([

    collect_numbers,

    number_exercises,

    handle_citations

    ])

    ```


    We must run `collect_numbers` before `handle_citations`, but `number_exercises`
