- "# 编写 Markdown\n\n如果你过去曾使用纯文本编写和共享文档，那么你可能已经熟悉了大部分 Markdown 标记注释。Markdown 的许多语法都基于人们多年来编写纯文本文档的方式。本章涵盖了基本的\
  \ Markdown 注释，这些占到了你日常使用中 99% 的注释量。我在本章中介绍的标记符号得到了所有 Markdown 工具的支持（据我所知）。下一章将介绍并非普遍支持的标记符号，尽管许多工具都支持这些功能。当然，所有这些符号都得到了\
  \ `Pandoc` 的支持。\n\n如果你按照本章剩余部分列出的方式编写纯文本，而不使用任何特殊的标记命令，那么输出结果也将是纯文本。一行或多行文本将构成一个段落。如果你需要开始一个新段落，请使用两个换行符，也就是用一个空行分隔前后两个段落。\n\
  \n## 章节\n\n在最高层面上，文本文档由其章节构成。章节分为不同层级。在一本书中，最高层级可能是“章”，第二层级是“章”内的“节”，第三层级是“节”内的“小节”。\n\
  \n要创建一个新章节，你需要为其添加一个标题。标题以井号（`#`）开头。使用一个井号会得到一级标题，在一本书中对应“章”，在较小的文档中对应“节”。两个井号会得到二级标题，如果一级标题是“章”则对应“节”，如果一级标题是“节”则对应“小节”。下一级标题使用三个井号，以此类推。\n\
  \n```\n### 一级标题\n#### 二级标题\n##### 三级标题\n```\n\n对于前两个层级，你也可以分别用 `=` 和 `-` 来为章节标题添加下划线：\n\
  \n```\n一级标题\n========\n二级标题\n--------\n```\n\n你在标题之后写的任何文本都成为该章节的正文内容。\n\n默认情况下，标题是带编号的。你可以使用模板（参见第\
  \ 9 章）来更改这一点，或者在标题后面加上 `{-}` 或 `{.unnumbered}` 来禁用所选标题的编号：\n\n```\n## 无编号标题 {-}\n\
  ### 另一个无编号标题 { .unnumbered }\n```\n\n## 强调\n\n我们通过将部分文本设置为斜体或粗体来强调它们。在 Markdown\
  \ 中，我们使用星号 `∗` 来实现。要将一个词设为斜体，我们使用 `*一个*` 星号；如果要设为粗体，我们使用 `**两个**`。\n\n上述部分在 Markdown\
  \ 中看起来像这样：\n\n```\n我们通过将部分文本设置\n为斜体或粗体来强调它们。在 Markdown\n中，我们使用星号 \\* 来实现。\n要将一个词设为斜体，我们使用\
  \ *一个*\n星号；如果要设为粗体，我们\n使用 **两个**。\n```\n\n你还会注意到，第一个星号使用了反斜杠进行转义。这个反斜杠可以防止 Markdown\
  \ 将星号解释为斜体文本的开始。\n\n\n\n### 列表\n\n你有两种列表：有序列表和无序列表。要创建有序列表，你需要在行首放置一个数字，后跟一个句点，然后写下列表项。对于下一个列表项，你需要换行，添加另一个数字，后跟一个句点，然后写下下一项文本。示例如下：\n\
  \n```\n1\\. 这是一个有序列表。\n2\\. 这是列表的第二项。\n3\\. 这是列表的第三项。\n```\n\n结果将如下所示：\n\n1.  这是一个有序列表。\n\
  2.  这是列表的第二项。\n3.  这是列表的第三项。\n\n实际数字会被忽略，因此如果你写成如下形式，也能得到相同结果：\n\n```\n10\\. 这是一个有序列表。\n\
  51\\. 这是列表的第二项。\n42\\. 这是列表的第三项。\n```\n\n如果你希望列表项跨越多行，则需要缩进数字后的行，示例如下：\n\n```\n\
  1\\. 这是一个多行列表项。\n这也是列表项的一部分。\n这个也是。\n2\\. 这是另一项。\n这也是该列表项的一部分。\n```\n\n这样做会得到如下列表：\n\
  \n1.  这是一个多行列表项。这也是列表项的一部分。这个也是。\n2.  这是另一项。这也是该列表项的一部分。\n\n对于无序列表，你可以使用星号或短横线代替数字；因此你可以这样编写一个无序列表：\n\
  \n*   这是一个有序列表\n*   这是列表的第二项\n*   这是列表的第三项\n\n```\n* 这是一个有序列表\n- 这是列表的第二项\n* 这是列表的第三项\n\
  ```\n\n如你所见，你可以混合使用星号和短横线，或者只坚持使用其中你偏好的任何一种。当你创建文档时，列表的格式化方式由样式表决定，而非由你使用哪个符号来创建列表决定。\n\
  \n如果你希望在列表项下拥有子列表，可以通过缩进子列表的行来实现。因此，你可以这样编写一个带有子列表的列表：\n\n```\n* 这是一个顶级列表项\n* 这是一个子列表项\n\
  * 这是另一个子列表项\n* 现在我们又回到了顶级。\n```\n\n只需添加足够的空格，将子列表项置于其所属列表项的缩进之下。结果将如下所示：\n\n*  \
  \ 这是一个顶级列表项\n    *   这是一个子列表项\n    *   这是另一个子列表项\n*   现在我们又回到了顶级。\n\n当你进行缩进时，每级缩进至少需要四个空格或一个制表符。\n\
  \n## 块引用\n\n如果你需要在文本中添加引用，你需要在被引用的文本前放置一个 `>`。\n\n因此你可以这样编写：\n\n```\n> 这是一个块引用。该块引用\n\
  > 可以跨越多行。如果你不\n> 在其中插入新行，你只需\n> 在行的开头放置“>”\n> 即可。\n> 如果你想要包含换行的多行内容，\n> 你应该在每一行\n\
  > 都添加“>”。\n```\n\n结果将如下所示：\n\n> 这是一个块引用。该块引用可以跨越多行。如果你不在其中插入新行，你只需在行的开头放置 `>` 即可。如果你想要包含换行的多行内容，你应该在每一行都添加\
  \ `>`。\n\n"
- '# 逐字文本


  有时，你希望文本完全不应用任何格式；希望按原样逐字显示。当你有此需求时，你可以用制表符（或四个空格）对其进行缩进。你可以这样编写：


  ```

  这将以逐字显示

  绝对原样显示

  ```


  结果将如下所示：


  ```

  这将以逐字显示

  绝对原样显示

  ```


  有时，你也希望在段落内内联添加逐字文本。要实现这一点，只需将逐字文本放在反引号内即可。因此你可以编写 `` `''this''` `` 来实现 `this`。


  ## 链接


  Markdown 最初是为了让编写网页内容更容易而创建的。因此，它内置了插入超文本链接的语法。这些链接既适用于网页链接，也适用于文本内部的交叉引用。


  你有两种方式指定链接：你可以在插入链接的位置放置目标 URL，或者创建一个标签并将其映射到 URL，这样在插入链接时就可以引用该标签。要在插入链接的位置放置 URL，你需要将要作为链接的文本放在方括号内，并立即在后面用圆括号括上链接的目标
  URL。你可以这样编写文本：


  ```

  这是一个指向[我的博客](http://www.mailund.dk)的链接。

  ```


  这在大多数情况下没问题，但如果你在一个段落中有很多链接，那么链接注释就会开始干扰文本的可读性。相反，你可以给目标链接一个更短的名称，并将目标定义放在文本后面。要做到这一点，你需要将圆括号替换为方括号，如下所示：


  ```

  这是一个指向[我的博客][blog]的链接。

  ```


  然后，在后面的文本中，你这样定义链接指向的目标：


  ```

  [blog]: http://www.mailund.dk

  ```


  你使用相同的语法来制作文档内部的超文本链接。创建指向某个章节的链接最简单的方法是省略目标，而是将章节名称放在方括号内。指向本章的链接可以这样编写：


  ```

  这是一个指向[编写 Markdown]章节的链接。

  ```


  当然，如果你希望链接包含不同于章节名称的文本，或者你有几个同名的章节，这种方法就行不通了。你可以通过给章节标题添加显式标签来解决这个问题。这些标签需要放在章节标题后面的花括号内。你可以这样为标题分配标签：


  ```

  ## 我的标题 {#header}

  ```


  这里需要井号，并且在链接到该章节时也需要井号。井号在 HTML 中用于引用网页的各个部分，Markdown 正是从那里继承的语法。为了链接到我们这样标记的章节，我们可以这样编写链接：


  ```

  这是一个指向该章节的链接。

  ```


  链接仅对超文本文档有用，在标准 Markdown 中，你无法创建对图表或任何非章节元素的交叉引用。在 Pandoc 中，你可以通过扩展来实现，但我们会在第 7
  章中介绍。


  ## 图片


  要在文档中插入图片，你需使用与插入链接类似的语法。区别在于你需要在链接前加一个感叹号 `!`。


  ```

  ![图片标题](img/图片-URL)

  ```


  通常，你会将图片作为本地文件，并使用图片文件的路径，可以是相对于构建文档位置的路径，也可以是绝对路径。


  ```

  ![图片标题](img/我的图片)

  ```


  ## 练习


  以下文本中包含一些练习，你可以借此测试自己对前面所学内容的掌握情况。如果你使用的编辑器能即时显示 Markdown 文本的结果，请在那里测试你的结果。否则，请先将你的答案放在一边，直到我们在第
  5 章中介绍了如何格式化 Markdown 后再进行处理。


  ## 章节


  编写一个包含三个二级章节的文档，并且每个二级章节内包含两个三级章节。请记住，`#` 的数量决定了章节的级别。请同时创建有编号和无编号的章节。


  ## 强调


  编写 `*this* **text** in *Markdown*`。


  ### 列表


  取以下三个项目


  *   项目一

  *   项目二

  *   项目三


  并将它们分别写成一个有序列表和一个无序列表。


  现在，将


  *   项目四

  *   项目五


  作为子列表放在 `项目一` 下面。


  ## 块引用


  将以下文本制作成一个块引用：


  ```

  这是一段我们希望放在块引用中的文本。

  你的任务是实现这一点。

  ```


  ## 链接


  编写一段文本，在其中插入一个指向网页的链接以及一个指向你文本中某个章节的链接。


  ## 图片


  找到一个图片文件并将其插入到文本中。




