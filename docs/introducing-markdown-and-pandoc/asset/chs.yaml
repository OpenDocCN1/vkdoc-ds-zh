- "# 4\\. Pandoc Markdown 扩展\n\n遗憾的是，Markdown 并非标准化语言。不同的工具会支持不同的标记语法，并以不同方式处理它们。上一章描述的\
  \ Markdown 语法在大多数工具中（即使不是全部）都能正常工作。通常表格语法的支持度较差，但其余标记通常都能正常使用。\n\nPandoc 为上一章描述的\
  \ Markdown 语言提供了若干扩展。在本章中，我们将看到一些对列表和表格非常有用的扩展。如需获取 Pandoc 对 Markdown 扩展的完整列表，请查阅\
  \ Pandoc 文档：[`tinyurl.com/y87mstzf`](https://tinyurl.com/y87mstzf)。\n\n### 列表\n\n\
  通常，编写有序列表时使用的数字会被忽略。它们用于指示列表项，但实际编号并不重要。这使得在列表中间插入新项变得更容易，这是一件好事，但有时你想让列表从一个非 1\
  \ 的数字开始，在这种情况下，基本的 Markdown 就无法帮到你了。不过，使用 Pandoc，列表会从你给第一个列表项的数字开始编号。因此，你可以像这样从数字三开始一个列表：\n\
  \n```\n3. 此列表从数字三开始。\n5. 尽管我们使用 \"5.\" 来开始这个\n条目，它仍然会被编号为 4。\n```\n\n后续列表项中的数字仍然被忽略。结果如下所示：\n\
  \n-   3\\. 此列表从数字三开始。\n-   4\\. 尽管我们使用 \"5.\" 来开始这个条目，它仍然会被编号为 4。\n\n这是延续列表的好方法，但当你在前一个列表中添加或删除了项目后，你需要更新初始数字。\n\
  \n为了让列表自动延续到下一个编号，即使你改变了前一个列表，你也可以使用特殊符号 `“@”`。当你在列表中使用它时，它的作用与数字一样，并且它总是从你上次中断的地方开始计数。因此，你可以这样写：\n\
  \n```\n(@) 开始一个列表\n(@) 继续这个列表\n这里是列表之间的一些不\n属于该列表的文本。\n(@) 这继续了该列表，\n编号从我们上次中断\n\
  的地方开始。\n(@label) 此条目带有标签\n以便我们之后可以引用它。\n就像这样：参见条目\n(@label)。\n```\n\n结果如下所示：\n\n\
  1.  开始一个列表\n2.  继续这个列表\n\n这里是列表之间的一些不属于该列表的文本。\n\n1.  这继续了该列表，编号从我们上次中断的地方开始。\n\
  2.  此条目带有标签以便我们之后可以引用它。就像这样：参见条目 (4)。\n\n这对于示例列表等非常有用，但 `@` 计数器是全局的，因此你不能重置计数器。不幸的是，目前尚不支持同时实现自动编号*和*重置计数器。\n\
  \n在这个例子中，我们还看到了 Pandoc 的另一个特性。我们不必写一个数字后跟一个点。在前面的例子中，我们将数字（用 `@` 表示）放在了括号内，结果生成了一个使用括号的列表。你也可以使用一个单独的右括号：\n\
  \n```\n1) 这是一个\n2) 列表\n3) 它确实是\n```\n\n这将为你生成以下列表：\n\n1.  这是一个\n2.  列表\n3.  它确实是\n\
  \n如果你使用数字加句点来创建列表，你会得到标准的编号列表，但你也可以仅通过使用字母或罗马数字开头来使用它们。如果你希望使用括号而不是句点，你也可以这样做。例如，你可以像这样创建一个列表：\n\
  \n1.  此列表使用字母代替数字。\n2.  我们可以创建一个带罗马数字的子列表：\n    1.  此子列表也使用括号\n3.  很酷，不是吗？\n\n创建该列表的源标记如下所示：\n\
  \n```\n1.  此列表使用字母代替数字。\n2.  我们可以创建一个带罗马数字的子列表：\n    1.  此子列表也使用括号\n3.  很酷，不是吗？\n\
  ```\n\n你可以混合使用不同的列表符号，这样你的子列表就有不同的列表格式，但如果你在同一层级混合使用它们，你就会开始一个新列表。\n\n列表经常用于定义术语或概念，在\
  \ Pandoc 中，你可以通过在一个术语后面跟一个冒号，并用制表符或至少四个空格缩进定义的起始部分来创建定义列表。因此，你可以像这样创建定义列表：\n\n**我们想要定义的事物。**\
  \ 事物的定义\n\n只要我们缩进后续的行，它们就会成为定义的一部分。\n\n**这里开始我们定义的下一个事物。** 我们在这里写下定义。\n\n定义的更多内容\n\
  \n创建此列表的语法如下：\n\n```\n我们想要定义的事物。\n:    事物的定义\n只要我们缩进后续的行，它们\n就会成为定义的一部分。\n这里开始我们定义的下一个事物。\n\
  :    我们在这里写下定义。\n定义的更多内容\n```\n\n另一种语法使用波浪号 `\"~\"` 代替冒号：\n\n- **术语 1** 定义 1\n-\
  \ **术语 2** 定义 2a\n\n定义 2b\n\n```\n术语 1\n~ 定义 1\n术语 2\n~ 定义 2a\n~ 定义 2b\n```\n\n\
  两种语法皆可。\n\n\n\n### 表格\n\n要在文档中添加表格，你可以使用短划线来标记列。你可以像这样编写一个表格：\n\n```\nRight    Left\
  \     Center    Default\n-------    ------ ----------  -------\n12    12       \
  \ 12           12\n123    123       123         123\n1    1          1         \
  \   1\n```\n\n结果将如下所示：\n\n| Right | Left | Center | Default |\n| 12 | 12 | 12 |\
  \ 12 |\n| 123 | 123 | 123 | 123 |\n| 1 | 1 | 1 | 1 |\n\n列内元素的对齐方式决定了短划线上方表头的对齐方式。如果文本靠右，则该列右对齐。左对齐和居中对齐同理：如果文本靠左或居中，则表格列左对齐或居中对齐。如果表头起始位置与短划线相同，则获得默认对齐方式，即左对齐。\n\
  \n你可以省略表头，但此时需要在表格末尾也重复一次短划线。\n\n| 12 | 12 | 12 | 12 |\n| 123 | 123 | 123 | 123\
  \ |\n| 1 | 1 | 1 | 1 |\n\n```\n-------    ------ ---------- -------\n12    12  \
  \      12          12\n123    123       123        123\n1    1          1      \
  \     1\n-------    ------ ---------- -------\n```\n\n如果不提供表头，则对齐方式由表格的第一行决定。在前面的示例中，最后一列没有右对齐的原因是该列第一个数字之后，在定义该列的短划线结束之前有一个空格。将第一个数字向右移动一个位置，该列也会右对齐。\n\
  \n表格是 Markdown 标记中在不同工具里支持一致性最差的部分。上面描述的表格语法通常有效，但在用于撰写书籍的两个编辑器中并不被支持。不过，在我熟悉的所有\
  \ Markdown 查看器中，它们都能正确显示。\n\n在 Pandoc 中，对表格的支持非常出色，并且 Pandoc 在上述符号之外还提供了一些表格标记的扩展。\n\
  \n对于图片，你可以使用链接语法添加标题。对于表格，则没有类似的语法。但是，你可以在表格之后使用 `Table: Caption` 来为表格添加标题。因此，你可以像这样创建一个带标题的表格：\n\
  \n```\n-------     ------ ---------- -------\n12     12        12         12\n123\
  \     123       123       123\n1     1          1          1\n-------     ------\
  \ ---------- -------\nTable: 这是一个标题\n```\n\n结果如下所示：\n\n**表 4-3.** *这是一个标题*\n\n|\
  \ 12 | 12 | 12 | 12 |\n| 123 | 123 | 123 | 123 |\n| 1 | 1 | 1 | 1 |\n\n如果需要，你可以省略\
  \ `Table` 部分；仅保留冒号即可获得标题。\n\n如果你希望表格单元格跨越多行，这也是可行的。对于多行表格，你必须在表头之前放置一行短划线（除非没有表头），必须在表格末尾放置一行短划线并紧跟一个空行，并且行与行之间必须用空行分隔。这个来自\
  \ Pandoc 手册的示例展示了其工作原理：\n\n```\n\nCentred   Default      Right Left\nHeader   Aligned\
  \    Aligned Aligned\n----------- ------- ---------- ----------------------\nFirst\
  \   row           12.0 Example of a row that\nspans multiple lines.\nSecond   row\
  \            5.0 Here's another one.\nNote the blank line\nbetween rows.\n-----------\
  \ ------- ---------- ----------------------\n```\n\n结果将如下所示：\n\n| Centred Header\
  \ | Default Aligned | Right Aligned | Left Aligned |\n| --- | --- | --- | --- |\n\
  | First | row | 12.0 | Example of a row that spans multiple lines. |\n| Second |\
  \ row | 5.0 | Here's another one. Note the blank line between rows. |\n\n你可以省略表头，但此时必须在表格之后重复定义列的短划线，并紧跟一个空行。\n\
  \n```\n----------- ------- ---------- ----------------------\nFirst    row     \
  \      12.0 Example of a row that\nspans multiple lines.\nSecond    row        \
  \    5.0 Here's another one.\nNote the blank line\nbetween rows.\n----------- -------\
  \ ---------- ----------------------\n```\n\n结果：\n\n| First | row | 12.0 | Example\
  \ of a row that spans multiple lines. |\n| Second | row | 5.0 | Here's another one.\
  \ Note the blank line between rows. |\n\n表格的另一种语法使用纯文本网格来分隔列。一个带有表头的示例如下：\n\n```\n\
  +---------------+---------------+--------------------+\n| Right         | Left \
  \         | Centered           |\n+==============:+:==============+:==================:+\n\
  | Right         | Left          | Centered           |\n+---------------+---------------+--------------------+\n\
  ```\n\n结果：\n\n| Right | Left | Centered |\n| Right | Left | Centered |\n\n没有表头时，如下所示：\n\
  \n```\n+--------------:+:--------------+:------------------:+\n| Right         |\
  \ Left          | Centered           |\n+---------------+---------------+--------------------+\n\
  ```\n\n结果：\n\n| Right | Left | Centered |\n\n对于这些类型的表头，冒号决定了对齐方式。在单元格边框的 `=` 或 `-`\
  \ 末尾放置冒号可实现右对齐，在开头放置冒号实现左对齐，在两端放置冒号实现居中对齐，而不使用冒号则采用默认对齐方式。\n\n你也可以使用竖线 `|` 来指定列。那么，语法将如下所示：\n\
  \n```\n| Right | Left | Default | Center |\n|------:|:-----|---------|:------:|\n\
  |   12  |  12  |    12   |    12  |\n|  123  |  123 |   123   |   123  |\n|    1\
  \  |    1 |     1   |     1  |\n```\n\n结果：\n\n| Right | Left | Default | Center\
  \ |\n| 12 | 12 | 12 | 12 |\n| 123 | 123 | 123 | 123 |\n| 1 | 1 | 1 | 1 |\n\n## 智能标点\n\
  \n正确的文本排版使用不同类型的短划线——单词中的连字符、数字区间的短划线、以及用于插入语和强调的长划线。引号通常在引文文本的开头和结尾有所不同。三个点与省略号也不同。许多文字编辑器会自动替换某些短划线，并将直引号转换为正确形式，但并非所有编辑器都如此。由于你是以纯文本形式编写\
  \ Markdown，并且大多数键盘无法输入所有排版符号，Pandoc 可以帮助你获得这些符号。要启用此功能，你需要使用 `--smart` 选项调用 Pandoc（我们将在第\
  \ 5 章了解如何调用 Pandoc）。\n\n如果你开启智能标点功能，引号将被正确处理，三个点将被转换为省略号，单个 `-` 是连字符，两个短划线将生成短破折号，三个短划线将生成长破折号。\n\
  \n### 脚注\n\n你可以使用类似于链接和图片的语法在文本中插入脚注。对于脚注，你需要添加脱字符（`^`）。要将脚注放在你正在书写的文本段落内部，可以添加一个脱字符，然后将脚注文本放在方括号内。\n\
  \n```\n段落内部的脚注。^[这是一个脚注。]\n```\n\n由于脚注往往会干扰正文，你可以为它们添加标签，并将文本放在其他地方。当你这样做时，需命名脚注并将名称放在正文中。\n\
  \n```\n对脚注的引用。[^footnotelabel]\n```\n\n当你以这种方式添加脚注时，脱字符必须放在方括号内部。如果脱字符放在方括号之前，则是在文本内部添加脚注。\n\
  \n你需要在文本的某个位置定义脚注标签所指代的内容。其语法与在文本内部定义可引用的链接相同，不同之处在于，定义脚注时名称必须以脱字符开头。\n\n```\n[^footnotelabel]:\
  \ 这是脚注二。\n如果希望它覆盖多行，则必须\n将后续的脚注行缩进\n至少四个空格。\n```\n\n两种方法的输出应如下所示：段落内部的脚注。^(¹)\n\n\
  对脚注的引用。^(²)\n\n## 练习\n\n\n\n### 列表\n\n编写一个包含五个项目的列表。在第二项和第三项之间，添加一段文字，但确保编号从第四项继续。\n\
  \n为第三项添加一个标签，并在第五项中引用它。同时创建一个定义列表，使其支持多行。\n\n### 表格\n\n制作一个三列表格，其中第一列左对齐，第二列居中对齐，第三列右对齐。\n\
  \n编写一个带标题的表格。在下一章我们使用`Pandoc`格式化 Markdown 之前，你将看不到最终效果，但请保留这段文本，以便届时进行测试。\n\n###\
  \ 脚注\n\n编写一段包含脚注的文字。分别使用脚注的两种标记方式。\n\n脚注 1 2\n\n"
- "# 5. 翻译文档\n\n当我们用 Markdown 编写好文档后，需要使用`Pandoc`将其翻译成其他文件格式。不过，首先需要下载`Pandoc`。请访问\
  \ Pandoc 的安装指南[`http://pandoc.org/installing.html`](http://pandoc.org/installing.html)，并按照适用于你平台的说明进行操作。\n\
  \n## 使用 Pandoc 格式化 Markdown 文档\n\n在第一个示例中，我们可以用下面这个简短的 Markdown 文档：\n\n```\n## 这是一个测试文档\n\
  文档中的一些文本。\n* 这是一个列表\n* 包含两个项目\n```\n\n如果将此 Markdown 文档保存为名为`input.md`的文件，我们可以使用以下命令将其转换为\
  \ HTML 文件`output.html`：\n\n```\npandoc -o output.html input.md\n```\n\n`-o`选项指定输出文件。`input.md`文件在指定时无需任何选项。输入文件不需要任何选项，并且你可以提供多个输入文件。如果提供多个输入文件，Pandoc\
  \ 在处理它们之前会先将其拼接在一起。因此，如果你想将分别写在多个文件中的几个章节组装成一本书，只需在命令行中按章节在书中出现的顺序提供这些文件即可。\n\n\
  `Pandoc`会根据文件扩展名识别输入和输出格式。因此，如果你使用上述命令，它会识别出输入是 Markdown（文件后缀`.md`），输出应为 HTML（文件后缀`.html`）。你还可以显式指定输入和输出格式。可以使用`--from`选项指定输入格式，使用`--to`选项指定输出格式。在大多数情况下，你无需指定格式——文件名已包含全部所需信息——但有时不同格式会共享相同的文件后缀，例如\
  \ EPUB 和 EPUB3 格式都使用文件后缀`.epub`。在这种情况下，你就需要用到这些选项了。\n\n如果你指定了输入和输出文档格式，还可以将`pandoc`视为一个可接受管道输入并输出格式化文档的程序。例如，你可以这样写：\n\
  \n```\ncat input.md | \\\npandoc --from markdown --to html \\\n> output.html\n```\n\
  \n这种做法本身用途不大，但结合预处理（第 10 章）和过滤器（第 11 章）后，就会变得非常方便。\n\n回到`pandoc`的输出。如果你在终端中运行之前的命令：\n\
  \n```\npandoc -o output.html input.md\n```\n\n那么`output.html`文件现在应包含以下 HTML 内容：\n\
  \n```\n这是一个测试文档\n\n文档中的一些文本。\n\n这是一个列表\n包含两个项目\n```\n\n如果你不熟悉 HTML，可能看起来不太容易理解，但我希望你至少能识别出输入\
  \ Markdown 中的元素。\n\n这段 HTML 并非一个完整的 HTML 文件。它只是对应 Markdown 文档的一个 HTML 片段，缺少完整 HTML\
  \ 页面所需的页眉和页脚标记。默认情况下，Pandoc 生成的 HTML 标记可以添加到网页中，但不能作为独立文档使用。要同时添加页眉和页脚，你可以使用`--standalone`选项。\n\
  \n```\npandoc --standalone -o output.html input.md\n```\n\n如果你想要生成一个完整的文档，`--standalone`选项对于\
  \ HTML 输出是必需的。如果你选择的输出格式通常不以片段形式存在（例如 PDF 文档（后缀`.pdf`）、EPUB 文档（后缀`.epub`或`.epub3`）或\
  \ Word 文件（后缀`.docx`）），Pandoc 会自动创建完整文档，此时不需要`--standalone`选项。\n\n如果你运行`pandoc --standalone\
  \ -o output.html input.md`，你会收到一条警告：\n\n```\n[警告] 此文档格式需要一个非空元素。\n请在元数据中指定'title'或'pagetitle'，\n\
  例如，在命令行中使用 --metadata pagetitle=\"...\"。\n回退为'input'\n```\n\n但尽管有警告，你仍然会得到一个包含所有必要元素的\
  \ HTML 文档：\n\n```\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ lang=\"\" xml:lang=\"\">\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"\
  generator\" content=\"pandoc\" />\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0, user-scalable=yes\" />\n  <title>input</title>\n  <style>\n\
  \    code{white-space: pre-wrap;}\n    span.smallcaps{font-variant: small-caps;}\n\
  \    span.underline{text-decoration: underline;}\n    div.column{display: inline-block;\
  \ vertical-align: top; width: 50%;}\n  </style>\n</head>\n<body>\n<h1 id=\"this-is-a-test-document\"\
  >这是一个测试文档</h1>\n<p>文档中的一些文本。</p>\n<ul>\n<li>这是一个列表</li>\n<li>包含两个项目</li>\n</ul>\n\
  </body>\n</html>\n```\n\n这里的通用 HTML 代码比我们的文本多得多，但幸运的是我们无需为此担心；我们可以专注于 Markdown，而让\
  \ Pandoc 处理其余部分。\n\n我们收到的警告与这行中获得的标题有关：\n\n```\n<title>input</title>\n```\n\nPandoc\
  \ 只是从输入文件中获取了名称，但它原本期望得到显式提供的标题。你可以使用元数据来实现这一点；请参见第 8 章。现在先忽略它。\n\n你可以尝试使用以下命令生成不同的输出格式：\n\
  \n```\npandoc -o output.pdf input.md\npandoc -o output.docx input.md\npandoc -o\
  \ output.epub input.md\npandoc --to=epub3 -o output.epub input.md\n```\n\n在最后一个示例中，我们明确指定输出中使用的\
  \ EPUB 格式为 EPUB3。\n\n另一个可能需要指定`--to`格式的情况是 PDF。默认情况下，Pandoc 会使用 LaTeX 创建 PDF 文件，但你可以通过以下命令指定它改用\
  \ ConTeXt：\n\n```\npandoc --to=context -o output.pdf input.md\n```\n\n要获取支持的输入和输出格式的完整列表，请分别运行以下命令：\n\
  \n```\npandoc --list-input-formats\n```\n\n和：\n\n```\npandoc --list-output-formats\n\
  ```\n\nPandoc 可以在多种不同的输入和输出格式之间进行转换，但在本书中，我们只考虑 Markdown 输入以及如何将 Markdown 转换为其他格式。\n\
  \n### 常用实用选项\n\n你可以使用许多选项来影响 Pandoc 转换文档的方式。完整列表请参考在线手册³。这里，我将列出一些在我自己的写作中觉得特别有用的选项。\n\
  \n#### 节与章\n\n首先，我们考虑与节解释方式相关的选项。在 Markdown 中，我们通过井号的数量来指定不同级别的节标题，但在生成文档时，我们有时需要考虑顶级结构是部分、章还是节。如果我们写的是简短报告或论文，我们希望一级标题开始新的节；但如果我们写的是书，我们希望它们开始新的章。默认行为取决于我们生成的输出格式，Pandoc\
  \ 会为我们做一些猜测，但你可以使用`--top-level-division`选项显式选择顶级结构。对于我的书籍，我希望一级标题作为章标题，因此我使用`--top-level-division=chapter`。\n\
  \n#### 目录\n\n要为输出文档添加目录，可以使用`--toc`选项或`--table-of-contents`选项；前者只是后者的缩写形式。你可以使用`--toc-depth`选项指定目录中包含的标题级别。在制作电子书时，我通常只需要章级别的目录，因此我使用`--toc-depth=1`。在制作\
  \ PDF 时，我接受默认设置。你可以尝试不同的选项值，看看哪种更符合你的偏好。\n\n\n\n#### 图片扩展名\n\n如果你希望从 Markdown 输入同时生成\
  \ PDF 和电子书，你可能希望在 PDF 输出中使用 PDF 矢量图形，而在电子书版本中使用位图 PNG。在 PDF 输出中使用位图图形意味着你需要考虑分辨率问题，但在电子书中使用\
  \ PDF 图形并不总是有效。当你使用如下语法在文档中插入图片时：\n\n```\n![图片标题](img/graphics-file)\n```\n\n你需要指定输入文件名，但如果你想同时生成电子书和\
  \ PDF，你并不想因为输出格式不同而修改所有文件名。\n\n你可以省略图形文件的文件扩展名，并使用以下选项来指定所需的扩展名：\n\n```\n--default-image-extension\n\
  ```\n\n这样，对于任何你没有显式写出文件扩展名的图形文件，Pandoc 都会使用默认扩展名。我在生成 PDF 文档时总是使用\n\n```\n--default-image-extension=pdf\n\
  ```\n\n而在生成电子书时使用\n\n```\n--default-image-extension=png\n```\n\n#### 电子书封面\n\n电子书除了文本内容外还包含封面图片。如果你制作电子书，你也需要指定封面图片。你可以使用\
  \ `--epub-cover-image` 选项来实现。如果你的封面图片位于 `cover.png` 文件中，你可以这样写：\n\n```\n--epub-cover-image=cover.png\n\
  ```\n\n### 使用 Makefile\n\n对于本书，我将所有文本都放在一个 `book.md` 文档中。对于像这样的一本短书来说这没问题，但通常我会将每一章放在单独的文件中。编译我的书籍的命令行可能会变得相当长，而且我经常需要记住不同输出格式的各种选项，所以如果每次构建新版本书籍时都使用命令行，很快就会变得繁琐且极易出错。因此，我使用\
  \ Make (`https://tinyurl.com/nyc2ec2`) 来编译我的书籍。\n\n如果你不熟悉 Make，我会提供足够的细节让你能够阅读我作为示例给出的\
  \ Makefile，并可能为你自己的 Pandoc Makefile 提供一个起点，但全面介绍 Make 超出了本书的范围。许多程序都能解决 Make 所解决的相同问题，所以如果你不喜欢\
  \ Make，还有其他选择。\n\n我使用的 Makefile 并不复杂，了解以下几点就足够了：\n\n1.  通过编写 `VARIABLE_NAME := VALUES`\
  \ 来定义一个变量。\n2.  使用 `$(VARIABLE_NAME)` 来引用变量所持有的值。\n3.  当你编写 `target: dependencies`\
  \ 时，意思是如果你想要得到 `target`，那么如果自上次构建 `target` 以来任何依赖项发生了变化，你就需要重新构建它。如果依赖项的依赖项发生了变化，那么你需要先构建依赖项，然后再构建目标，以此类推。\n\
  4.  `target: dependencies` 之后用制表符缩进的行是让你的计算机生成 `target` 所需的指令。\n5.  Makefile 中的第一个\
  \ `target: dependencies` 行是默认目标，如果你在命令行中没有提供其他目标，Make 将处理这个目标。\n\n我为本书使用的 Makefile\
  \ 大致如下（尽管我省略了一些选项）。我将在这里为你逐行讲解。\n\n```\nCHAPTERS := header.yml book.md\nPANDOC :=\
  \ pandoc\nOPTS_ALL := --toc --smart \\\n--top-level-division=chapter\nPDF_OPTS :=\
  \ $(OPTS_ALL) \\\n--default-image-extension=pdf\nEPUB_OPTS := $(OPTS_ALL) \\\n--default-image-extension=png\
  \ \\\n-t epub3 --toc-depth=1 \\\n--epub-cover-image=cover.png\nall: book.pdf book.epub\
  \ book.docx\nbook.pdf: $(CHAPTERS) Makefile\n$(PANDOC) $(PDF_OPTS) -o $@ $(CHAPTERS)\n\
  book.epub: $(CHAPTERS) Makefile\n$(PANDOC) $(EPUB_OPTS) -o $@ $(CHAPTERS)\nbook.docx:\
  \ $(CHAPTERS) Makefile\n$(PANDOC) $(PDF_OPTS) -o $@ $(CHAPTERS)\nclean:\nrm book.pdf\
  \ book.epub book.docx\n```\n\n我使用一个变量来保存输入文件。本例中只是头文件和一个 Markdown 文件。你可以在 Pandoc\
  \ 命令行或 YML 文件中指定元数据（见第 8 章）。你可以将元数据放在 Markdown 文本中，但那样的话它必须位于输入的开头，并且你不能在不包含第一章的情况下翻译单个章节。我更喜欢将元数据放在一个单独的文件中，本例中就是\
  \ `header.yml`。\n\n本书我只有一个 Markdown 文件。我是在 Ulysses 编辑器中写作的，我可以在其中将书籍分成不同的部分，但将其导出为一个合并的文件。由于章节和部分的划分保存在\
  \ Ulysses 中，而不是在单独的文件中，所以我没有每章一个文件。\n\n我将输入文件放在变量 `CHAPTERS` 中。如果你有多个文件，可以将其添加到\
  \ `CHAPTERS` 变量中。我也将 Pandoc 命令行工具放在一个变量中。我安装了多个版本，可以通过更新该变量来切换。之后，我将所有 Pandoc 运行共享的参数放在\
  \ `OPTS_ALL` 中，然后将 PDF 和 EPUB 特定的选项分别放在 `PDF_OPTS` 和 `EPUB_OPTS` 中。我也会制作 Word 文档，但我可以为此使用\
  \ PDF 参数；Pandoc 会知道如何用与 PDF 相同的选项来制作 Word 文档。接下来是所有目标、依赖项以及生成目标的命令。目标 `all` 和 `clean`\
  \ 是特殊的。第一个本身不构建任何东西；它只是触发其依赖项的构建——因此它是间接构建这些依赖项——这些依赖项是 Makefile 知道如何制作的三种书籍格式。`clean`\
  \ 目标没有任何依赖项，但它会删除我们用中间三条命令生成的书籍。\n\n然后我定义了一些我想用于所有输出格式的选项，以及一些我只想用于 PDF 的选项，以及其他我只想用于电子书的选项。在元数据中，我设置了\
  \ PDF 输出，我也可以把它放在头文件中——如果这样做，它们不会干扰 EPUB 输出——但我选择在这里设置它们。\n\n我在 Makefile 中构建 EPUB\
  \ 书籍，但如果你计划在 iBooks 上发布，我不建议使用这个文件。我发现使用 Pages 来排版和提交书籍要容易得多。Pages 可以读取 Word 文档，这也是我通常向\
  \ iBooks 提交书籍的方式：我制作一个 Word 文档，在 Pages 中打开它，然后提交。你可能会认为以正确的格式构建书籍然后使用 iTunes Connect\
  \ 提交会更简单。你错了。如果你想在亚马逊（通过 Kindle Direct Publishing）上发布，你最好也使用他们的工具 Kindle Create。Kindle\
  \ Create 可以读取 Word 文件，你可以从那里提交。有一个命令行工具可以将 EPUB 转换为 Kindle 上使用的 MOBI 文件格式，但 Kindle\
  \ Create 更易于使用。\n\n"
- '# 6. 数学和计算机编程语言


  你可能没有编写技术或科学文本的习惯，但如果你有，那么 Pandoc 支持数学和计算机编程代码格式。



  ## 书写数学公式


  只要你的输出文件格式支持，Pandoc 就能出色地处理数学公式的写入。Word 文件内置了对数学公式的支持，如果输出文件是 Word 文档，Pandoc 会使用该功能。对于
  PDF，Pandoc 使用 LaTeX 作为中间格式，而 LaTeX 处理数学公式的效果堪称完美。对于 HTML 和 EPUB，根据你用于显示数学公式的版本和库，你也能获得一定的数学公式支持。


  对于 HTML 和 EPUB，针对输出如何处理数学公式，你有不同的选择。当我的 HTML 或 EPUB 文档中包含数学公式时，我通常使用 MathML（⁴）或
  MathJax（⁵）。对于 MathML，你可以使用 `--mathml` 选项：


  ```

  pandoc --mathml -o document.epub document.md

  ```


  对于 MathJax，你需要生成 EPUB3 文档才能使其正常工作，因此你还需要指定输出格式：


  ```

  pandoc --to=epub3 --mathjax \

  -o document.epub document.md

  ```


  使用任一选项，你都能得到一个能良好显示数学公式的 EPUB 文档。虽然不像由 LaTeX 处理数学公式的 PDF 文档那样精美，但效果已相当不错。


  在文档中书写数学公式的方式是使用 TeX 语法。只有在你输出 LaTeX 文件或通过 LaTeX 构建 PDF 文件时，输出文档中的数学公式才会是 TeX 格式；但在纯文本中书写数学公式的事实标准就是
  TeX，Pandoc 正是采用这一标准。


  你使用美元符号来开始和结束数学公式。使用一个美元符号会得到行内公式，使用两个则会得到“展示”模式公式，这意味着数学公式会单独占一行并居中显示。这是一个行内公式：`$\int_aˆb
  x\,\mathrm{d}x$` 显示为 ![$$ \underset{a}{\overset{b}{\int }}x\kern0.5em \mathrm{d}x
  $$](img/486315_1_En_6_Chapter_TeX_IEq1.png)。在双美元符号之间书写展示模式公式，如下所示：


  ```

  $$\sum_{j=1}^N \frac{1}{j²}$$

  ```


  结果会是这样：


  ![$$ \sum \limits_{j=1}^N\frac{1}{j²} $$](img/486315_1_En_6_Chapter_TeX_Equa.png)


  Pandoc 支持用 LaTeX 书写的绝大部分数学公式。例如，下面是一个更复杂的方程：


  ![$$ d\left(i,j\right)=\Big\{{\displaystyle \begin{array}{l}i\\ {}j\\ {}\min \Big\{\begin{array}{l}d\left(i-1,j-1\right)\kern0.5em
  +\kern0.5em 1\left(i\ne j\right)\\ {}d\left(i,j-1\right)\kern0.5em +\kern0.5em 1\\
  {}d\left(i-1,j\right)\kern0.5em +\kern0.5em 1\end{array}\end{array}}\kern0.5em {\displaystyle
  \begin{array}{l}j=0\\ {}i=0\\ {}i&gt;0,\kern0.5em j&gt;0\end{array}} $$](img/486315_1_En_6_Chapter_TeX_Equb.png)


  其 LaTeX 代码如下所示：


  ```

  $$

  d(i,j) = \begin{cases}

  \,i & j = 0 \\

  \,j & i = 0 \\

  \,\min\begin{cases}

  d(i-1,j-1) + \mathrm{1}(i\neq j) \\

  d(i,j-1) + 1 \\

  d(i-1,j) + 1

  \end{cases} & i>0,j>0

  \end{cases}

  $$

  ```


  如果你书写了 Pandoc 无法处理的数学公式（例如，使用了 Pandoc 不认识的 LaTeX 包），你仍然可以直接写下该 LaTeX 代码。Pandoc 不理解的内容会直接传递到输出中。因此，只要你的输出格式需要经过
  LaTeX 处理，这就能正常工作。


  如果你的输出是 HTML 或 EPUB，并且使用了 MathML 或 MathJax，你也可以书写一个需要原样传递到输出的公式。


  如果你只有一个文档，但需要为不同的输出格式提供不同的公式，就不能仅仅让文本直接传递到输出。这种情况下，你需要为一个输出格式输出一个版本，为另一个格式输出另一个版本。对此，Pandoc
  允许你书写仅针对特定输出格式包含的原样文本。你可以这样写：


  ```

  ```{=latex}

  $$\sum_{j=1}^N \frac{1}{j²}$$

  ```

  ```


  来表示一个仅当输出为 LaTeX 时才包含的文本块，以及这样写：


  `` `$f(x)=x²$`{=latex} ``


  来表示行内文本。


  ## 书写代码块


  Markdown 经常被程序员用来撰写关于程序的文档，因此它自然支持显示代码示例，通常还会带有语法高亮格式。不同工具对此的支持程度不同，但 Pandoc 对许多编程语言都有出色的支持。


  书写代码块的语法可以使用波浪线“~”或反引号“`”。其中，反引号更可能被其他工具支持；因此，我在这里会使用反引号。下文给出的每个示例中，如果你用 `~` 代替反引号也同样有效。


  用三个反引号开始一个代码块，然后写入你的代码，最后再用三个反引号结束该代码块。


  ```

  ```

  for (int i = 0; i < n; i++) {

  printf("%d\n", i);

  }

  ```

  ```


  你也可以使用波浪线代替反引号，但本章我将使用反引号。


  ```

  ~~~

  for (int i = 0; i < n; i++) {

  printf("%d\n", i);

  }

  ~~~

  ```


  如果你只使用反引号或 `~`，你会得到一个原样文本块，就像你缩进了文本一样。为了获得语法高亮，你还必须告知 Pandoc 你正在使用哪种编程语言。你可以通过在反引号的第一行之后写上该语言的名称来实现。为了对前面用
  C 编程语言编写的代码进行语法高亮，你应该写成：


  ```

  ```c

  for (int i = 0; i < n; i++) {

  printf("%d\n", i);

  }

  ```

  ```


  结果会像这样：


  ```

  for (int i = 0; i < n; i++) {

  printf("%d\n", i);

  }

  ```


  一个 Python 代码块会像这样：


  ```

  ```python

  for i in range(n):

  print(i)

  ```

  ```


  结果会像这样：


  ```

  for i in range(n):

  print(i)

  ```


  要获取支持的编程语言的完整列表，你可以运行以下命令：


  ```

  pandoc --list-highlight-languages

  ```




  ### 代码块选项


  这种显示代码的语法被许多网站支持，例如在 GitHub 上，人们经常在其中编写文本代码。你可以为代码显示方式提供更高级的指令，但这时需要采用一种略有不同的、更特定于
  Pandoc 的语法。具体来说，你需要在前三个反引号后的花括号内放置指令。你必须指定编程语言，并在名称前加一个点，例如，对于 Python 应写为 `.python`。然后，你可以使用指令
  `.numberLines` 为代码行编号：


  ```

  ```{.python .numberLines}

  for i in range(n):

  print(i)

  ```

  ```


  结果将如下所示：


  ```

  1   for i in range(n):

  2       print(i)

  ```


  你可以使用选项 `startFrom` 指定起始行号。要从第 100 行开始，我们可以这样写：


  ```

  ```{.python .numberLines startFrom=100}

  for i in range(n):

  print(i)

  ```

  ```


  结果将如下所示：


  ```

  100  for i in range(n):

  101      print(i)

  ```


  你可以为代码块指定一个标识符：


  ```

  ```{#my-code .python .numberLines}

  for i in range(n):

  print(i)

  ```

  ```


  这将使代码块成为一个超文本目标（即 HTML 中的锚点），因此你可以创建指向它的超文本引用。锚点 id 与标识符相同（不包括井号）。也就是说，在前面的示例中，它是
  `my-code`。你可以像在 Markdown 文档中引用其他引用一样引用该目标，例如：


  ```

  ```{#my-code .python}

  for i in range(n):

  print(i)

  ```

  请参见我的代码

  ```


  在 HTML 输出中，你也可以使用 `.lineAnchors` 选项使每一行都成为一个锚点。


  ```

  ```{#my-code .python .numberLines .lineAnchors}

  for i in range(n):

  print(i)

  ```

  ```


  行标识符由代码块 id 后跟行号组成。在这个例子中，两行分别为 `my-code-1` 和 `my-code-2`。


  在 HTML 输出中，所有以 `.` 开头的选项都将被添加到包含代码的 `<pre>` 块的 class 属性中。通过样式表，你可以轻松地让代码块的格式与众不同。在过滤器（见第
  11 章）中，你可以使用这些选项进行任意转换或计算。如果你开始大量使用代码块选项，需要牢记的一个关键点是：所有不带参数的选项


  ```

  .python

  .numberLines

  ```


  *必须*以点开头，而所有带参数的选项


  ```

  startsFrom=100

  ```


  *不能*以点开头。如果你违反了这些规则，Pandoc 将不会按你期望的方式工作。


  ### 语法高亮样式


  语法高亮方案由样式表的变体控制：HTML 输出使用层叠样式表 (CSS)，而 LaTeX（以及 PDF）输出使用一组 `\newcommand` 选项。这些高亮指令会直接放入输出文件中（生成独立文档时），因此不易覆盖。不过，你可以从预定义的高亮样式列表中选择。你可以通过运行以下命令查看完整列表：


  ```

  pandoc --list-highlight-styles

  ```


  你使用 `--highlight-style` 选项来选择样式。当我构建书籍的打印版本时，我需要黑白输出，因此我使用以下选项：


  ```

  pandoc --highlight-style=monochrome

  ```


  这会产生黑白高亮效果，使用斜体和粗体来显示不同的语言组件。你也可以在使用代码块时完全禁用语法高亮，使用 `--no-highlight` 选项即可。


