- "# 元数据\n\n如果你回过头来看第 5 章中的独立 HTML 文档，该文档是这样的：\n\n```\n## 这是一个测试文档\n以下是文档中的一些文本。\n\
  * 这是一个列表\n* 包含两个项目\n```\n\n我们是像这样编译它的：\n\n```\npandoc --standalone -o output.html\
  \ input.md\n```\n\n你应该会收到如下警告：\n\n```\n[WARNING] This document format requires a\
  \ nonempty\n element.\nPlease specify either 'title' or 'pagetitle' in\nthe metadata,\n\
  e.g. by using --metadata pagetitle=\"...\" on the\ncommand line.\nFalling back to\
  \ 'input'\n```\n\n然后你的文档标题将正如警告所说，如下所示：\n\n```\ninput\n```\n\nPandoc 在你的文档中插入了一个标题，但它被设置为了默认值\
  \ `input`，因为我们没有指定它。尝试改为运行以下命令：\n\n```\npandoc --metadata title=\"My Title\" \\\n\
  --standalone -o output.html input.md\n```\n\n如果你现在读取 `output.html` 文件，你会看到 Pandoc\
  \ 在标题标签之间插入了“My Title”，并插入了一个显示为“My Title”的一级标题。\n\n当 Pandoc 生成独立文档时，它会使用诸如标题和作者之类的元数据来填充一些信息。这些数据通常不在\
  \ Markdown 输入中指定——没有任何 Markdown 注释用于定义这种元数据——但你可以使用 `--metadata` 选项或 YAML（参见下文）来设置它。\n\
  \n严格来说，生成输出时使用的变量有两种：通过 `--metadata` 指定的元数据，以及通过 `--variable` 指定的变量。它们的区别在于，元数据可以被\
  \ Pandoc 和 Pandoc 过滤器（在输入格式化为输出之前处理输入的脚本）看到和处理，而变量则用于模板中。如果你使用 `--metadata` 标签或在元数据头信息中设置了一个变量，该变量也将对模板可用，因此你通常可以坚持使用元数据。输出并非*完全相同*，因为过滤器可能会对元数据进行一些不会对变量进行的操作，但坚持使用一种选项更容易。因此，除非你有充分的理由不这样做，否则请使用元数据。\n\
  \n\n\n### 用于元数据的 YAML\n\n你可能想要指定的元数据有很多，因此你不想仅依赖命令行选项来设置所有这些信息。幸运的是，`Pandoc` 可以从输入文件的头部读取元数据，该头部使用另一种名为\
  \ YAML（Yet Another Markup Language，另一种标记语言）的标记语言来指定。YAML 是一种与 Markdown 不同的标记语言。它的目的不是对文本进行标记，而是为工具提供结构化数据。\n\
  \n你可以将包含元数据的 YAML 头部放在输入文本的顶部，以便向 `Pandoc` 提供这些信息。我通常会将元数据放在一个单独的文件中，并在运行 `Pandoc`\
  \ 时将其作为第一个输入文件给出。由于 `Pandoc` 会连接你给出的所有输入文件，因此这等同于将元数据放在文档顶部，但这样做可以让我在生成不同格式的输出时使用不同的头部，并且我可以轻松地用相同的元数据格式化不同的\
  \ Markdown 文件。\n\n一个 YAML 头部以单独一行上的三个连字符 `---` 开始，并以另外三个连字符结束。在头部内部，你可以放置键值对信息。键后面跟一个冒号，值跟在冒号后面。我在这本书中使用的头部如下所示：\n\
  \n```\n---\ntitle:\n\"My Markdown and Pandoc book\"\nauthor:\n- Thomas Mailund\n\
  year: 2019\n---\n```\n\n它设置了三个值：标题、作者以及我撰写本书的年份，这些就是本书所需的所有信息。我其实不需要给标题加引号。我可以直接按原样书写，就像我在作者字段中写自己的名字一样。然而，如果标题（或任何值）包含冒号，则必须将值放在引号中。此处，我用引号来举例说明。\n\
  \n你会注意到，在 `author:` 字段中，我的名字前面有一个连字符。其实我也不必加这个连字符，但加上是为了向你展示一个列表。当希望一个键指向一系列值时，例如文档有多个作者时，你需要在列表的每个元素前使用连字符。这里，我让\
  \ `author` 指向一个长度为 1 的列表。结果与我没有将名字放在列表中是一样的，但如果我有合著者，我们就需要这种列表语法。\n\n我有这样一个头部文件，名为\
  \ `header.yml`，我可以通过以下命令将这本书编译成 PDF 文件：\n\n```\npandoc -o book.pdf header.yml book.md\n\
  ```\n\n实际的命令行会更复杂（参见第 5 章的 Makefile），但这个命令足以生成一本电子书。\n\nYAML 语言本质上是一种将键映射到值的方法。在上述头部中，你有三个键：`title`、`author`\
  \ 和 `year`。一个键可以映射到一个单一的标量值。`title` 和 `year` 就是如此。它们也可以映射到一个列表，就像 `author` 那样。键还可以映射到嵌套的键值映射。考虑以下示例：\n\
  \n```\nauthor:\n- name: Thomas Mailund\n  affiliation: Unseen University\n- name:\
  \ Karsken Baelg\n  affiliation: Brakebills University\n```\n\n这里的 `author` 是一个列表——你可以从每个作者前的短横线看出。每个作者都是一个嵌套映射；它们有两个键：`name`\
  \ 和 `affiliation`。说它是一个映射，是因为它们有键，后面跟冒号，然后右边是值。简而言之，标量是键后跟一个单一值，列表是键后跟一系列用连字符分隔的项目，而嵌套映射则是嵌套的键值映射。对于列表和映射，还有一种更简洁的表示法。对于列表，你可以将值放在方括号内，并用逗号分隔：\n\
  \n```\nauthor_names: [\"Thomas Mailund\", \"Karsken Baelg\"]\n```\n\n对于映射，你可以改用花括号：\n\
  \n```\nauthor:\n- { name: \"Thomas Mailund\",\n    affiliation: \"Unseen University\"\
  \ }\n- { name: \"Karsken Baelg\",\n    affiliation: \"Brakebills University\" }\n\
  ```\n\n这里，列表中的项目具有相同的结构。它们不必一定如此；不过，当它们结构相同时，编写代码来处理它们会更容易。\n\n如果你有一段较长的文本，可以在 YAML\
  \ 文件中使用 `|` 或 `>` 将其分成多行：\n\n```\nabstract: |\n  This is a very long abstract and\n\
  \  it is probably the best paper ever.\n  We are sure that you will all agree.\n\
  ```\n\n两者的区别在于，`|` 会保留换行符，而 `>` 会移除换行符并用空格替换。你可以根据需要在这些块中继续书写文本，只要缩进每一行即可。\n\n你可以编写任意复杂的\
  \ YAML，但 `Pandoc` 只会使用它知道如何处理的元数据。`Pandoc` 解释哪些变量取决于输出格式和你所使用的模板（参见第 9 章）。有关默认模板的详细信息，请查看[`https://tinyurl.com/yyxgole5`](https://tinyurl.com/yyxgole5)上的\
  \ `Pandoc` 手册，并参阅第 9 章了解如何在自己的模板中使用元数据。\n\n\n\n"
- "# 9. 使用模板\n\n当 `Pandoc` 创建独立文档时，它会使用一个输出模板。模板本质上是一个包含某些占位符变量的文档，元数据和你处理过的 Markdown\
  \ 文本将被插入其中。模板中使用哪些元数据取决于输出格式；你可以在 Pandoc 手册中获取完整变量列表。^([13]) `Pandoc` 会自动设置一些手册中描述的元数据，但你也可以在文件头中指定其他元数据。\n\
  \n除非你明确指定另一个模板，否则 `Pandoc` 会使用输出格式的默认模板。你可以通过运行 `pandoc -D` 命令让 `Pandoc` 显示它用于特定输出的模板，例如，要查看生成\
  \ PDF 文件时（其过程是先生成 LaTeX 文档，然后编译它）会使用什么内容，可以输入 `pandoc -D latex`。你也可以在 [`https://github.com/jgm/pandoc-templates`](https://github.com/jgm/pandoc-templates)\
  \ 获取默认模板的完整列表及其样式。\n\n如果你不懂 LaTeX，运行 `pandoc -D latex` 得到的模板可能意义不大，那么让我们来看看 `pandoc\
  \ -D html`。输出内容相当长，我不会在此全部复现，只重点介绍其中几部分。\n\n还记得我们在第 8 章讨论的标题吗？在我们为标题提供元数据之前，它是空的。让我们看看模板中它是什么样子。你会找到这样一行代码：\n\
  \n```\n$if(title-prefix)$\n$title-prefix$ -\n$endif$\n$pagetitle$\n```\n\n美元符号内的内容指定了占位符以及模板应如何处理这些代码的语法。在\
  \ HTML 模板的 title 标签内，有两个可插入的元数据变量：`title-prefix` 和 `pagetitle`。只有存在标题前缀时才会插入它；这正是\
  \ `$if(title-prefix)$` 代码所检查的内容。严格来说，`pagetitle` 也只有在存在时才会被插入，否则会得到一个空字符串。但因为标题前缀后面应跟一个破折号，所以这里进行了一个显式检查，以确定是否应插入内容。\n\
  \n我们从未为 `title-prefix` 和 `pagetitle` 提供过元数据，因此很难看出它们与我们提供的 `title` 元数据有何关联。我们*可以*显式地提供这两个变量，但\
  \ `Pandoc` 会根据我们的标题自动创建它们。它在模板的其他地方直接使用了 `title` 变量，模板中包含：\n\n```\n$title$\n```\n\
  \n`Pandoc` 和过滤器可以访问元数据并创建新的元数据，这正是它为 `title-prefix` 和 `pagetitle` 所做的。`title` 占位符只是直接插入你在元数据中指定的文本。\n\
  \n我并不知道哪些文档能精确说明每种输出格式下可预期的元数据操作，而且我也不确定你是否应该依赖这些操作，因为它们在不同版本的 `Pandoc` 和过滤器中可能不稳定。然而，如果你不使用派生元数据，而是坚持使用明确定义的元数据，那么数据的使用方式就比较直接了。如果你有一个像\
  \ `$title$` 这样的简单占位符，那么你在元数据中指定的字符串就会直接插入到输出文件的相应位置。\n\n正如我们在 `title-prefix` 中看到的，元数据也可以根据其是否被定义来条件性地插入。要仅在元变量\
  \ `variable` 被定义时插入 `some text`，模板可以包含这样的结构：\n\n```\n$if(variable)$ some text $endif$\n\
  ```\n\n还有一种 if-else 结构，看起来像这样：\n\n```\n$if(variable)$\nsome text\n$else$\nsome other\
  \ text\n$endif$\n```\n\n最后，还有一种循环结构。在 HTML 模板中，你可以找到这样一段文本：\n\n```\n$for(author)$\n\
  $author$\n$endfor$\n```\n\n这行代码会遍历元数据中指定的作者，并逐个插入他们。如果 `author` 不是一个列表，它仍然有效；它会被视为一个长度为\
  \ 1 的列表。但如果我们确实有一个作者列表，我们就会为每个作者生成一个二级标题。\n\n请记住，元数据可以结构化，其值可以包含键值对列表。比如这个例子：\n\n\
  ```\nauthor:\n- name: Thomas Mailund\n  affiliation: Unseen University\n- name:\
  \ Karsken Baelg\n  affiliation: Brakebills University\n```\n\n在这里，作者不是简单的字符串，而是一个键值结构的列表，每个结构包含姓名和所属机构。在模板内部，这些字段可以使用“点表示法”来访问，因此模板可能包含如下代码：\n\
  \n```\n$for(author)$\n$if(author.name)$\n$author.name$\n$if(author.affiliation)$\n\
  ($author.affiliation$)\n$endif$\n$else$\n$author$\n$endif$\n$endfor$\n```\n\n这段代码遍历作者列表并插入作者的姓名（如果他们有姓名的话，通常应该如此）。如果他们有所属机构，则在姓名后添加所属机构。如果作者列表包含的项目不是由姓名和所属机构构成的结构，那么模板会直接插入该列表项（参见\
  \ `$if(author.name)$` 判断条件中的 `$else$` 部分）。\n\n当然，输出中最重要的部分来自输入文本中已处理的 Markdown。在模板中，它被插入到不起眼的\
  \ `$body$` 占位符处。它看起来不起眼，但当你所有的 Markdown 被处理成输出格式后，都会被插入到这里。\n\n## 编写你自己的模板\n\n模板是另一个在需要时非常好用、不需要时也无需担心的特性。你可以完全不用关心模板就能使用\
  \ `Pandoc`，但如果你需要以特定格式排版文档，也无需为编写文本而放弃 `Pandoc`；你可以创建一个模板来处理格式。例如，如果你像我一样是学术界人士，需要为不同的期刊使用不同的格式，你可以为这些期刊制作模板。期刊通常会提供论文的\
  \ LaTeX 模板，你可以选取其中一个模板，放入 `Pandoc` 的占位符，瞬间你就拥有了一个 `Pandoc` 模板，然后就可以用 Markdown 撰写论文，同时其格式仍符合期刊标准。\n\
  \n你可以从 `Pandoc` 的用户贡献模板中获得编写自己模板的灵感。^([14]) 我发现创建新模板最简单的方法是拿一个 `Pandoc` 现有的模板进行修改，或者拿一个现有的\
  \ HTML 或 LaTeX 文件，放入元数据和 `$body$` 占位符。\n\n默认模板之所以冗长复杂，是因为它们需要设置很多内容，例如配置数学公式或源代码高亮。如果你需要\
  \ `Pandoc` 提供的所有功能，我建议你复制一个现有模板并进行修改。对于本章，我将编写更简单的模板，目标是清晰明了而非功能完备。相应的 Markdown\
  \ 输入也会很简单。如果你需要更多功能，可以在默认模板中找到所需的代码，通常不难找到。\n\n\n\n### 模板示例\n\n请阅读以下文本。其中大部分是元数据，因为这是我们在这里关注的重点。如你所见，YAML\
  \ 头部有三个变量：`title`、`subtitle` 和 `author`。前两个变量各持有一个单一值，最后一个变量则是一个简单值的列表。\n\n```\n\
  title:\n一本糟糕的小说\nsubtitle:\n说真的，最差劲的作品之一！\nauthor:\n- 托马斯·马伦德\n- 卡斯肯·贝尔格\n\n那是一个漆黑而风暴肆虐的夜晚\n\
  ```\n\n如果我们编写下面的 HTML 模板，我们会在 HTML 头部添加标题和副标题，并在主文档中添加一级标题。如果元数据中有任何作者信息，我们会插入一个\
  \ `div` 元素来右对齐作者列表，并通过遍历它们来获取该列表。`$sep$` 变量本身并非元变量，而是一种标记后续元素的方式。如果你使用 `$sep$`，那么该标记（例如单词或逗号）会被放置在你遍历的所有元素之间，但不会跟在最后一个元素后面。试着移除它，你就会明白了。\n\
  \n```\n$title$$if(subtitle)$: $subtitle$$endif$\n\n$title$$if(subtitle)$: $subtitle$$endif$\n\
  \n$if(author)$\n\n作者\n$for(author)$$author$$sep$ 和 $endfor$\n\n$endif$\n$body$\n\
  ```\n\n如果我们用此模板格式化文本，会得到如下 HTML：\n\n```\n一本糟糕的小说: 说真的，最差劲的作品之一！\n\n一本糟糕的小说: 说真的，最差劲的作品之一！\n\
  \n作者\n托马斯·马伦德 和 卡斯肯·贝尔格\n\n那是一个漆黑而风暴肆虐的夜晚\n```\n\n对于 PDF/LaTeX 输出，该模板的功能与上述 HTML\
  \ 模板相同。\n\n```\n\\documentclass{book}\n\\usepackage{hyperref}\n\\title{$title$$if(subtitle)$:\
  \ $subtitle$ $endif$}\n\\author{$for(author)$$author$$sep$和 $endfor$}\n\\begin{document}\n\
  \\maketitle\n\\end{document}\n```\n\n（包含 `hyperref` 对于本例而言并不相关，但它是 Pandoc 期望包含的软件包之一。在我撰写本文时，对于这个特定示例，它是你唯一需要的软件包。）\n\
  \n将该模板应用于我们的文档会得到如下结果：\n\n```\n\\documentclass{book}\n\\usepackage{hyperref}\n\\\
  title{一本糟糕的小说: 说真的，最差劲的作品之一！ }\n\\author{托马斯·马伦德 和 卡斯肯·贝尔格}\n\\begin{document}\n\
  \\maketitle\n\\end{document}\n```\n\n你可以通过“点号”语法访问元数据中的嵌套信息。因此，如果你的数据如下：\n\n```\n\
  title:\n一本糟糕的小说\nsubtitle:\n说真的，最差劲的作品之一！\nauthor:\n- name: \"托马斯·马伦德\"\naffiliation:\
  \ \"看不见的大学\"\n- name: \"卡斯肯·贝尔格\"\naffiliation: \"布雷克比尔斯大学\"\n```\n\n并且你的模板如下：\n\
  \n```\n\\documentclass{book}\n\\usepackage{hyperref}\n\\title{$title$$if(subtitle)$:\
  \ $subtitle$ $endif$}\n\\author{$for(author)$$author.name$\n来自 $author.affiliation$\n\
  $sep$ 和\n$endfor$}\n\\begin{document}\n\\maketitle\n$body$\n\\end{document}\n```\n\
  \n那么处理文档后将生成以下输出：\n\n```\n\\documentclass{book}\n\\usepackage{hyperref}\n\\title{一本糟糕的小说:\
  \ 说真的，最差劲的作品之一！ }\n\\author{托马斯·马伦德 来自 看不见的大学\n和 卡斯肯·贝尔格 来自 布雷克比尔斯大学}\n\\begin{document}\n\
  \\maketitle\n那是一个漆黑而风暴肆虐的夜晚\n\\end{document}\n```\n\n你需要使用 `$author.name$` 和 `$author.affiliation$`\
  \ 来获取每位作者的姓名和所属机构。你不能简单地再使用 `$author$`。你仍然可以检查某个值是否已设置；只需通过点号语法进入即可。例如，如果某些作者没有所属机构，你可以对其进行测试，并只在存在时才插入它。\n\
  \n```\n\\documentclass{book}\n\\usepackage{hyperref}\n\\title{$title$$if(subtitle)$:\
  \ $subtitle$ $endif$}\n\\author{\n$for(author)$ $author.name$\n$if(author.affiliation)$\n\
  来自 $author.affiliation$\n$endif$\n$sep$ 和 $endfor$\n}\n\\begin{document}\n\\maketitle\n\
  $body$\n\\end{document}\n```\n\n如果你有一个像上面那样的 LaTeX 模板（或任何其他输出格式的模板），你希望它能适用于尽可能多的文档。你不希望每写几个文档就要更新它。不过，每个文档通常还是需要一些调整。例如，在\
  \ LaTeX 中，你可能需要导入一个特殊的软件包，或者你想定义一些命令。你不想把这些修改放在实际的模板里，也不想到处保留模板的许多副本。然而，使用元变量来使模板具有适应性很容易。\n\
  \n考虑到我刚才描述的 LaTeX 文件情况，我们可以像这样在模板中添加软件包和定义^((15))：\n\n```\n\\documentclass{book}\n\
  \\usepackage{hyperref}\n$for(packages)$\n\\usepackage{$packages$}\n$endfor$\n$if(definitions)$\n\
  $definitions$\n$endif$\n\\title{$title$$if(subtitle)$: $subtitle$ $endif$}\n\\author{\n\
  $for(author)$\n$author.name$\n$if(author.affiliation)$\n来自 $author.affiliation$\n\
  $endif$\n$sep$ 和\n$endfor$\n}\n\\begin{document}\n\\maketitle\n$body$\n\\end{document}\n\
  ```\n\n我们遍历 `packages` 列表，将每一个包插入到 `usepackage` 命令中。我们在此直接插入定义。使用以下输入：\n\n```\n\
  title:\n一本糟糕的小说\nsubtitle:\n说真的，最差劲的作品之一！\nauthor:\n- name: \"托马斯·马伦德\"\naffiliation:\
  \ \"看不见的大学\"\n- name: \"卡斯肯·贝尔格\"\naffiliation: \"布雷克比尔斯大学\"\npackages:\n- amssymb\n\
  - amsmath\n- booktabs\n- xspace\ndefinitions: |\n\\newcommand{\\TMRCA}%\n{\\ensuremath{T_\\\
  textrm{MRCA}}\\xspace}\n\\newcommand{\\tAC}%\n{\\ensuremath{\\tau_{AC}}\\xspace}\n\
