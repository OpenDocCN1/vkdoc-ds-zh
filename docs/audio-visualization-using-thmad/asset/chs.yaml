  ![A457467_1_En_6_Fig39_HTML.jpg](img/A457467_1_En_6_Fig39_HTML.jpg)\n\n**图 6-39.**\
  \ 位图粒子系统，无音频输入时的输出\n\n\n\n### 中心钳制粒子系统\n\n使用 `renderers → particlesystems → render_particle_center`\
  \ 模块，我们能得到一个虽然不太现实但效果令人印象深刻的粒子系统变体。\n\n其基本原理是将纹理定义的两个点钳制到一个中心点上。这里我们会提供一个示例，但与其一步步解释，不如请您参考安装时附带的源文件。本节仅从宏观角度进行说明，并指出一些重要的设置。\n\
  \n**注意**  \n本小节的示例作为源文件，位于 `TheArtOfAudioVisualization` 文件夹下的 `A-6.2.3_Particlesystems_Center*`\
  \ 目录中。\n\n将 `A-5.5.3_Particlesystems_Center_Blur` 状态加载到 Artiste 中，您将会看到如图 6-40 所示的画面。\n\
  \n![A457467_1_En_6_Fig40_HTML.jpg](img/A457467_1_En_6_Fig40_HTML.jpg)\n\n图 6-40.\
  \ 中心钳制粒子系统，完整状态\n\n标记为 (1) 的部分是常规的 3D 渲染管线。不过，`backface_culling`（背面剔除）和 `depth_buffer`（深度缓冲）都被禁用了；否则，纹理背景会与我们不希望看到的其他纹理重叠。灯光是开启的，且为全白，材质参数也均为全白，此外，`ALPHA`（透明通道）连接到了音频输入，这样图像会随着音量的增大而变得更加鲜明。\n\
  \n标记 (2) 的部分指定了我们将会看到的一组对象。其源是同心圆，在此例中，我们添加了一个由音频输入控制的绕 Y 轴旋转。\n\n标记 (3) 的部分是另一组不同颜色的同心钳制圆，这次我们通过音频输入来控制它们的速度。\n\
  \n标记 (4) 的部分负责实现模糊效果。如果不使用模糊，粒子被钳制到原点且生命周期有限这一特性会带来一些令人不悦的躁动感。该效果通过 `highblur` 模块实现，该模块使用了反馈技术，本章的另一处也会对此进行介绍。您可以调整这个子管线的参数，其中一个非常重要的参数就是所选的混合模式。此处设定的值是\
  \ `ONE`/`ONE`，这意味着原始图像和反馈图像会相互叠加绘制。为了达到预期效果，锚点 `color/global_alpha`（此处为 0.89）至关重要，这个值的微小变化都会导致输出结果发生巨大的改变。\n\
  \n最终结果如图 6-41 所示，其中紫罗兰色的射线组根据音频的低频部分旋转，而黄色的射线组则会随着音量的增大而增强其贡献。\n\n![A457467_1_En_6_Fig41_HTML.jpg](img/A457467_1_En_6_Fig41_HTML.jpg)\n\
  \n图 6-41. 中心钳制粒子系统，输出效果\n\n### 带状粒子\n\n`Renderers → particlesystems → render_particle_ribbon`\
  \ 模块会沿着一条在空间中移动的、受类似重力运动法则驱动的带状路径发射粒子。\n\n它可用于创造有趣的视觉效果，我们在此提供一个示例。与其提供逐步的操作指南，不如直接查看安装\
  \ ThMAD 后的最终状态，并解释其中的重要构建模块。\n\n**注意**  \n本小节的示例状态作为源文件，位于 `TheArtOfAudioVisualization`\
  \ 文件夹下的 `A-6.2.4_Particlesystems_Ribbon` 目录中。\n\n该状态如图 6-42 所示，图中高亮显示了主要部分。\n\n\
  *   部分 (1) 是典型的 3D 子管线；不过，`depth_buffer`（深度缓冲）模块被禁用了。您可以尝试同时禁用 `backface_culling`（背面剔除）看看会发生什么。灯光和材质都具有全部三个光照分量：环境光、漫反射光和高光。灯光会由部分\
  \ (4) 控制绕场景旋转，其环境光强度则由音频输入控制。\n*   部分 (2) 定义了粒子系统及其渲染器。渲染器本身不具备为渲染过程分配纹理的能力，但通过添加\
  \ `Texture → opengl → texture_bind` 模块，我们仍然可以实现这一点。这里我们分配了一个 `blob`（斑点）模块，这会使带状效果看起来像一个管子。此处，一些音频输入已被连接到带状宽度上。\n\
  *   部分 (3) 定义了一个恒定的主旋转，这会给场景带来深度感。振荡器设置为“saw”（锯齿波）模式，当我们希望以恒定角速度进行旋转时，经常使用这种模式。\n\
  *   部分 (4) 控制光源的旋转。它通过使用 `quat_mul` 模块组合两个旋转四元数来实现这一点。一个四元数内部由四个数字组成，完整定义了一个旋转轴和一个旋转角度。通过四元数乘法，我们可以精确实现绕两个不同轴、以两个不同角度进行两次连续旋转的效果。光源位置需要一个向量\
  \ (x, y, z)，如果使用 `float3_rotate_by_quat` 模块，从任意位置（如 (0,0,1)）开始，并利用上述组合后的四元数，输出将是\
  \ (0,0,1) 的一个旋转变体。通过将两个振荡器分别设置为“saw”（锯齿波）和“sine”（正弦波）模式，并给其中一个振荡器的角度添加一些音频输入，我们将获得一个稳定的旋转，加上一些受音频输入微弱影响的调制。后者是通过将音频音量累积相加到其中一个四元数旋转振荡器的\
  \ `phase`（相位）锚点上实现的。\n\n    ![A457467_1_En_6_Fig42_HTML.jpg](img/A457467_1_En_6_Fig42_HTML.jpg)\n\
  \n    图 6-42. 沿带状渲染的粒子系统\n\n输出将是一个旋转的、呈溅射状的管子世界，如图 6-43 所示。\n\n![A457467_1_En_6_Fig43_HTML.jpg](img/A457467_1_En_6_Fig43_HTML.jpg)\n\
  \n图 6-43. 沿带状渲染的粒子系统，输出效果\n\n\n\n## 发光物体\n\n通过在原始物体上叠加一个模糊版本，可以使物体获得闪亮的发光效果。作为示例，请将以下模块放置在画布上，并按图\
