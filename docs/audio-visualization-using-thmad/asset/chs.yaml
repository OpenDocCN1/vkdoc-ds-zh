  ## 纹理


  纹理是存在于图形硬件中的图像。它们对于实时图形处理非常重要。




  ### 缓冲区


  纹理缓冲区支持将渲染后的像素数据发送到图形硬件上的缓冲区，以实现快速渲染。其路径为：纹理 → 缓冲区。请参见表 8-199 至 8-202。


