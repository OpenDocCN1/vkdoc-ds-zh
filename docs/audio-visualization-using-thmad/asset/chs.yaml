  实现高性能图斑的基本构建块包括在图形硬件中存储和处理它们。这就是为什么没有像直接图斑渲染器这样的东西，而是称之为图斑纹理生成器。出于同样的原因，您通常不会直接将声音响应添加到图斑中。相反，您可以在处理纹理的状态位置添加声音响应，例如纹理变换、纹理映射，或者在合成纹理时。


