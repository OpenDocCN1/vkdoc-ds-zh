  在后端，确保 `backface_culling` 的 `status` 锚点切换到 `ENABLED`，在 `properties/enabled` 处开启光照，并在
  `camera` 模块中开启透视校正。此外，你可以将相机旋转参数设置为 `(0.0; 0.0; 1.0)`。结果将类似于图 5-24 和图 5-25。


  ![A457467_1_En_5_Fig25_HTML.jpg](img/A457467_1_En_5_Fig25_HTML.jpg)


  **图 5-25.** 自动纹理坐标，第 2 版


  ![A457467_1_En_5_Fig24_HTML.jpg](img/A457467_1_En_5_Fig24_HTML.jpg)


  **图 5-24.** 自动纹理坐标，第 1 版


  乍一看，这似乎是将图像正确地映射到了球体上。但实际上，所使用的公式并不真实。由于模块的 `OBJECT LINEAR` 模式，每个 (u,v) 坐标都被映射到
  (x,y,z) 空间的线性组合：`u = a ∙ x + b ∙ y + c ∙ z` 和 `v = d ∙ x + e ∙ y + f ∙ z`。这仅在球体表面的中心附近，并且只有在直视
  x,y 平面时才是真实的。通过调整缩放、平移和相机位置，图片可能看起来像图 5-25，揭示了这种自动纹理映射的缺陷。


  `texture_coord_gen` 模块的其他模式行为不同。当使用 `EYE_LINEAR` 模式时，你可以在模块的 `parameter_s` 和 `parameter_t`
  锚点中更改的 `a, b, c, d, e, f` 值会根据相机或眼睛位置进行投影。即便如此，在球体的边缘处投影也不正确，如图 5-26 所示。


  ![A457467_1_En_5_Fig26_HTML.jpg](img/A457467_1_En_5_Fig26_HTML.jpg)


  **图 5-26.** 自动纹理坐标，第 3 版


  `NORMAL MAP` 模式乍看起来似乎正确，如图 5-27 所示。它使用每个网格片元的法向量来生成纹理的相应部分。不过，映射是粘附在相机位置上的，即它不固定在物体上。事实上，你会看到光照似乎在旋转，这是因为球体是旋转不变的。


  `SPHERE_MAP` 和 `REFLECTION_MAP` 模式是边界情况，我们在此不讨论。当然，你仍然可以尝试它们。如果你想了解更多关于这些模式的信息，请查阅详细描述
  `glTexGen` 函数的 OpenGL 规范。


  ![A457467_1_En_5_Fig27_HTML.jpg](img/A457467_1_En_5_Fig27_HTML.jpg)


  **图 5-27.** 自动纹理坐标，第 4 版


  你也可以将纹理投影到立方体的表面。只需将同一个模块文件夹中的 `mesh_sphere_octahedron` 模块替换为 `mesh_box` 模块即可。你可能会猜想，之前在球体情况下遇到的
  `OBJECT_LINEAR` 模式在边缘处出现不自然失真的缺陷可能会消失，事实确实如此。但这仅在我们观察六个面中的单个面，并且不允许映射到达边缘的情况下才成立。为什么呢？因为到达边缘时，映射公式停止推进，相邻的面将由边缘的像素填充，如图
  5-28 所示。


  ![A457467_1_En_5_Fig28_HTML.jpg](img/A457467_1_En_5_Fig28_HTML.jpg)


  **图 5-28.** 立方体上的自动纹理坐标


  但是，如果你在 `tex_parameters` 中将两个坐标的重复模式都改为“clamp”，然后适当地缩放和平移纹理，你最终可能会在立方体的一个面上得到真实的纹理映射，如图
  5-29 所示。


  ![A457467_1_En_5_Fig29_HTML.jpg](img/A457467_1_En_5_Fig29_HTML.jpg)


  **图 5-29.** 立方体上的自动纹理坐标，第 2 版。为了说明目的，添加了线框以显示立方体的方向。


  综上所述，`texture_coord_gen` 模块在平坦表面上可能运行良好，但对于弯曲表面则缺乏物理正确性。尽管如此，它仍然可以帮助你实现心中的特效。




  ### 浮动纹理 I


  另一种我称之为浮动纹理的技术，使用了平面网格生成器。共有两种：


  - `Mesh → solid → mesh_planes`

  - `Mesh → solid → mesh_grid`


  第一种用于生成任意数量的、填充了纹理的堆叠幻灯片。这能产生令人印象深刻的效果，但你也可以将数量仅设为 1，从而在三维空间中获得一个悬浮的单独幻灯片。这种在三维空间中悬浮或浮动的特性，正是“浮动纹理”名称的由来。第二个生成器
  `mesh_grid` 不具备堆叠功能，因此它始终只生成单个幻灯片。然而，与 `mesh_planes` 不同的是，它由一个顶点网格组成，这些顶点均匀地映射到纹理坐标上。


  **注意：** 源码位于 `TheArtOfAudioVisualization` 文件夹内的 `A-5.2.2_Floating_texture` 目录下。


  我们首先描述 `mesh_planes` 组件。要使用它，请在画布上放置标准的 3D 链——`orbit_camera`、`light_directional`、`material_param`、`backface_culling`——并将相机连接到屏幕模块。添加以下模块：


  - `Texture → loaders → png_tex_load`

  - `Texture → modifiers → scale`

  - `Texture → modifiers → tex_parameters`

  - `Texture → modifiers → translate`

  - `Renderers → mesh → mesh_basic_render`

  - `Mesh → solid → mesh_planes`


