  对于纹理矩形和纹理三角形，我们有两种竞争的颜色概念：第一种是由顶点颜色给出的颜色，第二种是由纹理给出的颜色。最终哪个颜色胜出，或者它们如何混合，取决于渲染管线的其余部分和
  OpenGL 的内部状态。ThMAD 中的标准混合模式是 `MODULATE`，这意味着颜色值会被简单地相乘。不幸的是，我们无法轻易地在模块基础上更改此设置，因为
  OpenGL 遵循纹理单元的概念，并且每个纹理单元的纹理组合方式只能通过标准 API 函数进行设置。但还有另一种在模块基础上控制这一点的方法，而且它更加强大。


  实际上，使用着色器代替内置函数，可以赋予您极大的能力来定义混合方式。您可以通过在渲染器后面添加 `Renderers` → `Shaders` → `glsl_loader`
  模块来指定着色程序；请参见图 8-6。


  ![A457467_1_En_8_Fig6_HTML.jpg](img/A457467_1_En_8_Fig6_HTML.jpg)


  **图 8-6.** 使用着色器控制颜色混合


  例如，以下代码允许您对颜色值进行加法操作，而非乘法：


  顶点着色器：


  ```

  1   varying vec4 vColor;

  2   void main(void) {

  3     vColor = gl_Color;

  4     gl_TexCoord[0] = gl_MultiTexCoord0;

  5     gl_Position = gl_ModelViewProjectionMatrix * gl_Vertex;

  6   }

  ```


  片段着色器：


  ```

  1   varying vec4 vColor;

  2   uniform sampler2D sampler;

  3   void main(void) {

  4   vec4 tex = texture2D ( sampler,

  5       gl_TexCoord[0].st );

  6   gl_FragColor = vec4(vColor.r + tex.r,

  7     vColor.g + tex.g,

  8     vColor.b + tex.b,

  9     vColor.a + tex.a);

  10   }

  ```


  混合算法如片段着色器代码的第 6-9 行所示。




