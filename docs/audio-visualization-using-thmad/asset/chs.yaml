- '# 声音输入


  在本章中，我们将深入了解计算机如何准备捕捉传入的声音或产生的声音、声音在内部如何表示，以及数据如何到达 `ThMAD`。我们区分了直观的**空气压力随时间变化**的表示形式，以及**功率随频率变化**的表示形式（即频谱）。


  ## 准备声音输入


  当你购买一台装有 Ubuntu Linux 的 PC 或笔记本电脑后，或者在电脑上安装了 Ubuntu Linux 之后，基本上有两种选择——你可以使用外部音频源，或者让计算机自己播放声音。对于后者，你可以使用
  PC 的 CD 播放器、播放 U 盘或硬盘中的文件，或者通过互联网或其他方式流式传输音频文件。


  请注意，其他 Linux 发行版也可能适用。不妨一试——你很有可能会找到类似的程序、工具和设置来实现相同的目标。


  如果你希望使用外部音频源，则需要一个麦克风或具有线路输入功能的声卡进行连接。尤其是笔记本电脑，其内置麦克风质量并非最高，但可能足以满足你的需求。实际上，你并不需要精确还原声音，而是要对声音做出反应，因此拥有完全线性的输入曲线并不那么重要。另一方面，如果你不想因为廉价麦克风而失去低音中重要的冲击力，那么购买一个像样的麦克风可能会帮助你避免意外。同时请记住，在某些情况下，音频可视化可能会因输入声音的结构而变得不稳定。


  通常情况下，你希望避免这种情况，并且最终输出结果应对任何类型的音乐输入都能产生有趣的效果。通过不同的录音进行检查很容易做到这一点。但例如，如果由于麦克风缺失低音，导致低音永远无法以合适程度通过音频硬件，那么你的渲染管线可能会对输入声音的重要组成部分缺乏响应能力。相反，如果对于外部声音输入，你只需将某个音频源连接到电脑的线路输入插孔，就能自动确保安全。


  如果你想使用电脑的 CD 播放器播放 CD、播放音频文件或流式传输音频内容（例如使用浏览器），那么很可能你无需做任何事，只需启动合适的程序或让操作系统自动为你完成即可。对于较大的声音文件集合，一个用于管理的程序可能会很方便。Ubuntu
  上预装的 `RhythmBox` 是一个不错的选择。


  `ThMAD` 的当前版本 `1.0.0` 主要依赖于 `PulseAudio`，这是一个音频路由服务器，负责处理你计算机内的所有声音流。它知晓所有被捕捉或录制的声音，以及所有被播放的声音。Ubuntu
  Linux 预装并自动启动了 `PulseAudio`；对于其他 Linux 发行版，你可能需要先安装它。


  `ThMAD` 也可以连接到 `ALSA`（一种与声音硬件通信的低级技术），以及连接到 `JACK`（音乐专业人士通常偏好的声音服务器）。然而，与 `PulseAudio`
  相比，使用这些选项要困难得多，因此我们将 `PulseAudio` 作为文本中的标准案例来使用。


  关于标准 `PulseAudio` 声音链的图形描述，请参见图 1-1。


