  \ | 0; -0.97; 0 | 地面的位置 |\n\n将此子流水线连接到基础 3D 渲染流水线：使用`simple`模块的`render_out`锚点和`blend_mode`模块的`render_in`锚点。这将产生一个瀑布效果，如图\
