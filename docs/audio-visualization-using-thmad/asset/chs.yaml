- '# 7. ThMAD GUI 参考手册


  本章是 ThMAD GUI 操作的详尽手册。描述了 Artiste 的所有前端元素，包括主菜单、模块选择器、一些辅助小部件（即助手和检查器），以及不同的操作模式和键盘快捷键。随后介绍了用于描述可视化管线的状态保存与加载概念。我们探讨了什么是模块、模块的类型、如何控制它们以及如何将它们连接到其他模块。导出状态以便日后在
  ThMAD Player 中使用、定义子管线的宏描述以及注释小部件的介绍，共同构成了 Artiste 章节的完整内容。


  ThMAD Player 是 ThMAD 程序套件中负责展示已完成状态的部分，在 Player 的术语中，这些状态被称为可视化作品。在 Player 章节中，我们描述了所有
  GUI 操作选项，更确切地说，是可用于控制 ThMAD Player 的键盘快捷键。


  ## ThMAD Artiste GUI


  ### 启动与停止 GUI


  启动和停止 ThMAD Artiste 已在第 3 章“程序操作”中描述。本章其余部分假设 Artiste 正在运行。




  ### ThMAD 桌面及其组成部分


  空白状态如图 7-1 所示。


  ![A457467_1_En_7_Fig1_HTML.jpg](img/A457467_1_En_7_Fig1_HTML.jpg)


  **图 7-1.** 空白状态


  它有一个很大的空白区域，可以用于放置模块。这个区域通常被称为画布。您可以在中心看到一个模块——它是 `screen0` 模块，且始终存在。它代表屏幕输出，无法被删除。


  左上角显示的是输出窗口或预览窗口；由于状态为空，因此呈现黑色。在输出窗口下方，您可以找到模块列表。您将使用此列表或图形化模块选择器来选择要放置在画布上的模块。在
  Artiste 窗口的右下角，您可以看到最小化的助手。它将帮助您探索模块或参加课程，本章稍后将对此进行描述。


  要控制视图，请确保画布获得输入焦点。当您将鼠标移动到画布的空白位置时，画布将获得焦点。请务必理解这一点——在某些用户界面操作下，画布可能不会立即获得焦点，直到您至少稍微移动一下鼠标。如果画布获得焦点，与未获得焦点时相比，它会显得稍微亮一些。


  一旦画布获得焦点，您就可以使用表 7-1 中列出的键盘快捷键。


  **表 7-1.** 键盘快捷键


  | 按键 | 操作 |

  | --- | --- |

  | `S` 或 `←` | 向左平移 |

  | `F` 或 `→` | 向右平移 |

  | `E` 或 `↑` | 向上平移 |

  | `D` 或 `↓` | 向下平移 |

  | `W` 或 `Page ↓` | 缩小 |

  | `R` 或 `Page ↑` | 放大 |

  | `Ctrl+S` | 保存当前状态 |

  | `Ctrl+F` | 切换全窗口模式 |

  | `Ctrl+U` | 将当前状态保存到内存中作为撤销点。许多 GUI 操作会自动创建撤销点，因此您不需要使用 `Ctrl+U`。但某些操作（例如设置模块参数）不会。如果您希望这些操作也可撤销，请在执行操作前按下此键。自动撤销操作的列表在“菜单”部分给出。
  |

  | `Ctrl+Z` | 如果撤销缓冲区中有内容，则执行撤销。 |

  | `Ctrl+C` | 关闭所有打开的控制器。 |

  | `Ctrl+D` | 关闭所有打开的复杂锚点。 |

  | `Ctrl+O` | 启用或禁用对象检查器。 |

  | `Tab` | 更改助手的大小。 |

  | `Escape` | 退出程序。如果 ThMAD 检测到未保存的更改，您必须先确认一条警告消息。 |


  使用鼠标，您可以执行表 7-2 中列出的操作。


  **表 7-2.** 鼠标操作


  | 操作 | 描述 |

  | --- | --- |

  | 仅移动鼠标 | 如果您移动到预览窗口的调整大小手柄位置（即边缘或角落），则会高亮显示该位置。这是为了简化调整大小操作。如果您在模块列表上移动，则让模块列表获得焦点。如果您在空白画布上移动鼠标，则让画布获得输入焦点。
  |

  | 左键单击 | 如果该位置有一个模块，则选中它并让该模块获得焦点。如果没有模块，则从画布移除焦点。如果对象检查器已启用，则将其关闭（如果已显示）。 |

  | 单击并拖动 | 如果您在模块上，则移动模块。如果您在画布的空白位置，则平移视图。如果您在预览窗口、模块列表窗口或便签的标题栏上，则移动该窗口或便签。如果您在预览窗口、模块列表窗口或便签的边缘或角落，则调整其大小。
  |

  | 右键单击 | 如果该位置有模块、模块锚点或连接线，则显示相应的上下文弹出菜单。否则，显示主菜单。 |

  | 鼠标滚轮向下滚动 | 缩小。 |

  | 鼠标滚轮向上滚动 | 放大。 |

  | 左键单击窗口关闭按钮 | 退出程序。如果 ThMAD 检测到未保存的更改，您必须先确认一条警告消息。 |

  | `Ctrl+Alt` + 单击并拖动 | 如果您在一个模块上，则克隆它。将原始模块拖出后释放鼠标键。克隆的模块将继承原始模块的所有参数，这非常有用。 |

  | `Ctrl` + 单击并拖动 | 绘制一个多选矩形。矩形内的所有模块都将获得焦点，并且可以同时移动或删除。 |

  | 双击 | 如果您在空白位置，则打开图形化模块选择器。 |

  | `Ctrl`+双击 | 打开图形化模块选择器以加载新状态。如果当前状态有未保存的更改，用户必须首先确认一条警告消息。 |


  ### 窗口模式


  ThMAD 有几种不同的窗口模式：


  *   **标准桌面模式。** 这是在没有任何特殊标志启动 ThMAD Artiste 时看到的模式。您将看到带有预览窗口和模块列表的画布，如图 7-1 所示。

  *   **全窗口模式。** 画布被废弃，预览窗口占据整个窗口区域。

  *   **性能模式。** 这是桌面模式的一种特殊变体，其中预览窗口被关闭，其内容转而用作画布背景。您可以将其视为标准模式和全窗口模式的混合。

  *   **全屏模式。** ThMAD 不是在操作系统桌面管理器的窗口内呈现，而是强制覆盖整个屏幕。只有在启动 ThMAD 时使用特殊标志才会进入此模式。


  非标准模式将在以下小节中介绍。


  ### 全窗口模式


  您可以通过按 `Ctrl+F` 切换到全窗口模式。要切换回来，请再次按 `Ctrl+F`。参见图 7-2。


  ![A457467_1_En_7_Fig2_HTML.jpg](img/A457467_1_En_7_Fig2_HTML.jpg)


  **图 7-2.** 标准模式和全窗口模式


  如果在全窗口模式下，可以使用一些特殊按键，如表 7-3 所示。


  **表 7-3.** 全窗口按键控制


  | 按键 | 操作 |

  | --- | --- |

  | `Alt+T` | 切换标题信息可见性。在三种状态之间循环：隐藏/小字体/大字体。 |

  | `Ctrl+T` | 重置信息聚合状态。 |

  | `Ctrl+F` | 退出全窗口模式。 |

