  ![A457467_1_En_6_Fig44_HTML.jpg](img/A457467_1_En_6_Fig44_HTML.jpg)\n\n**图 6-44.**\
  \ 带发光效果的物体，基本状态\n\n按表 6-63 至 6-68 设置参数。\n\n**表 6-68.** `renderers → mesh → mesh_basic_render`\n\
