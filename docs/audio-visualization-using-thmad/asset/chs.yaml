  B2 的角色。![A457467_1_En_8_Figj_HTML.jpg](img/A457467_1_En_8_Figj_HTML.jpg) |

  | `bitm_blend_hard_mix` | `BLEND_HARD_MIX` | 对于每个 RGBA 值，如果 B1 比 B2 亮的部分暗，则设为 0。否则设为
  1。![A457467_1_En_8_Figk_HTML.jpg](img/A457467_1_En_8_Figk_HTML.jpg) |

  | `bitm_blend_lighten` | `BLEND_LIGHTEN` | 对于每个 RGBA 通道，取 B1 和 B2 中较大的值。![A457467_1_En_8_Figl_HTML.jpg](img/A457467_1_En_8_Figl_HTML.jpg)
  |

  | `bitm_blend_linear_burn` | `BLEND_LINEAR_BURN` | 与 `BLEND_SUBTRACT` 相同。 |

  | `bitm_blend_linear_dodge` | `BLEND_LINEAR_DODGE` | 与 `BLEND_ADD` 相同。 |

  | `bitm_blend_linear_light` | `BLEND_LINEAR_LIGHT` | 对于每个 RGBA 值，如果 B1 < 0.5，则使用
  `2 * B1` 和 B2 执行线性加深；否则，使用 `2 * (1.0 – B1)` 和 B2 执行线性减淡。![A457467_1_En_8_Figm_HTML.jpg](img/A457467_1_En_8_Figm_HTML.jpg)
  |

