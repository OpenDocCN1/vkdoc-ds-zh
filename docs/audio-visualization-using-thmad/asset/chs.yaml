  ThMAD 启动时立即开始播放。如果需要触发式播放，请使用模块 `raw_sample_trigger`。 |

  | --- | --- |

  | 输入 | `filename:resource` | 要播放的 RAW 文件 |

  | | `format:enum` | 单声道或立体声 |


