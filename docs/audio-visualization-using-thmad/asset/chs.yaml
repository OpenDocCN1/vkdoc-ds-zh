  \n图 6-15.\n\n`自相似性`主生成管线、混合器与输出\n\n你现在应该在输出屏幕的左上部分看到一颗星；见图 6-16。现在对于反馈子管线，将模块放置在画布上并绘制它们之间的连接；见图\
