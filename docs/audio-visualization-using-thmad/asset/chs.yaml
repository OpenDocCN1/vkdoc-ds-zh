  所有复合锚点都可以通过使用 `Ctrl+D` 键一次性折叠起来；当鼠标位于画布空白区域时，按 `Ctrl+C` 键可以关闭所有打开的控制器。


  ### 绘制锚点之间的连接


  要连接一个模块的锚点到另一个模块相同类型的锚点，只需单击任意一个锚点，将鼠标移动到另一个目标锚点，然后在悬停于其上时释放鼠标按钮。


  当你连接了复合锚点的子锚点并将其折叠后，看起来就像你画了一条到复合锚点的连接；见图 7-17。


  ![A457467_1_En_7_Fig17_HTML.jpg](img/A457467_1_En_7_Fig17_HTML.jpg)


  图 7-17. 使用复合锚点的锚点连接


  然而，情况并非如此，复合锚点不能直接连接。要查看连接的实际去向，你必须通过点击来展开复合锚点。


  要删除连接，请将鼠标移至连接线附近，然后右键单击并选择“断开连接”弹出菜单。见图 7-18。


  ![A457467_1_En_7_Fig18_HTML.jpg](img/A457467_1_En_7_Fig18_HTML.jpg)


  图 7-18. 移除锚点连接


  > 注意：要删除指向复合锚点内部某个锚点的连接，你必须先通过点击展开该复合锚点。




