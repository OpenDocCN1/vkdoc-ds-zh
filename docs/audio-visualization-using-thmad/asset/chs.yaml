  |

  | ![A457467_1_En_7_Figo_HTML.jpg](img/A457467_1_En_7_Figo_HTML.jpg) | 枚举锚点。用于控制枚举条目，例如“是”和“否”。截至
  `ThMAD` 1.0 版本，无法连接到其他模块。 |

