  ## Particlesystems


  粒子系统处理大量小尺寸对象。它们以某种方式弥补了状态内部缺少循环构造的问题。


  ### Fractals


  分形是几何对象或具有某些与分形相关的特殊数学属性的对象集合。这里的一个模块使用迭代函数系统算法生成分形。路径为 Particlesystems → Fractals。参见表
  8-113。


  **表 8-113**


  | `ifs_modifier` | 根据迭代函数系统（IFS）持续改变粒子的坐标。即 x → f(x) → f(f(x)) → f(f(f(x))) 等等。这里的函数
  f 是两个仿射映射的随机混合。 |

  | --- | --- |

  | 输入 | `in_particlesystem:particlesystem` | 输入粒子系统 |

  | | `change_probab:float` | 如果只想每帧（1/60 秒）更改一部分粒子，请将此值设置为小于 1.0。 |

  | | `change_random:enum` | 这是一个触发器。选择 `go` 将生成并使用一个随机的 IFS 参数集。请注意，只有一小部分随机生成的参数集会产出可用结果。
  |

  | | `save_params:enum` | 一个触发器，将当前参数集保存到 `/home/[USER]/thmad/[VERSION]/data/resources/ifs`
  文件，以便在未来的状态中使用。 |

  | | `load_params:resource` | 加载以前保存的参数集。此锚点的值不会被持久化，因此是一次性设置操作。当然，此处获取的参数将会被持久化。
  |

  | | `ifs:complex` | 当前参数集：两个仿射变换。算法以相等的概率在它们之间随机切换。 |

  | | `sys1:complex` | 第一个系统。![$$ \left(\begin{array}{cccc}a11& a12& a13& at1\\ {}a21&
  a22& a23& at2\\ {}a31& a32& a33& at3\\ {}0& 0& 0& 1\end{array}\right) $$](img/A457467_1_En_8_Chapter_IEq1.gif)
  |

  | | `sys2:complex` | 第二个系统。![$$ \left(\begin{array}{cccc}b11& b12& b13& bt1\\ {}b21&
  b22& b23& bt2\\ {}b31& b32& b33& bt3\\ {}0& 0& 0& 1\end{array}\right) $$](img/A457467_1_En_8_Chapter_IEq2.gif)
  |

  | 输出 | `particlesystem:particlesystem` | 输出粒子系统 |




