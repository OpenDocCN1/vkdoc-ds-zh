  \n图 6-32. 瀑布，无声音控制\n\n我们希望添加一些声音控制功能。为此，请添加以下模块：\n\n*   Maths → limiters → float_clamp\n\
  *   Maths → arithmetics → ternary → float → mult_add，共两个\n*   Sound → input_visualization_listener\n\
  \n按照图 6-33 所示连接它们。并按表 6-43 至 6-45 所示应用参数。\n\n表 6-44\n\n| `maths mult_add` | → |\
  \ `arithmetics` | → | `ternary` | → | `float` | → |\n| --- | --- | --- | --- | ---\
