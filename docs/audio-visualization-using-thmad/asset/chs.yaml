  \ -> `修改器` -> `基本重力`\n- `粒子系统` -> `生成器` -> `基本喷雾发射器`\n\n按照图 6-31 所示进行连接。\n\n![A457467_1_En_6_Fig31_HTML.jpg](img/A457467_1_En_6_Fig31_HTML.jpg)\n\
