- '# 枚举型输入作为模块参数


  若未连接至其他模块，可通过点击枚举类型输入锚点并在弹出菜单中选择相应条目来设定其值。


  某些枚举类型被误用作一次性的重置或执行操作。将其设为`Action`值后，一旦该操作被执行，该值将自动恢复原状。模块是否采用此类枚举由其自行决定；第八章的模块参考中包含了相关细节。


  '
- '# 浮点型输入作为模块参数


  若未连接至其他模块，可通过双击浮点类型输入锚点并使用控制器来设定其值。


  浮点型锚点会分配一个默认控制器，通常（但不一定）是一个旋钮。若要查看可用控制器并选择合适的类型，请右键点击锚点，并从表 7-8 所列选项中选择一个。


  **表 7-8.** 浮点数输入


  | 控制器 | 图标 | 描述 |

  |---|---|---|

  | 旋钮 | | 旋钮控制器。使用鼠标调整数值时，在靠近中心处单击并拖动（按住鼠标按钮移动鼠标）上下移动进行粗调，左右移动进行微调。另外，按住 `Shift`
  键可让数值以 `0.1` 的倍数吸附。要直接更改数值，请点击数字并使用键盘输入数值。按 `Ctrl+Del` 清除字段。完成后按 `Enter`/`Return`
  确认。如需在画布上移动旋钮，请点击并拖动黑色区域。双击旋钮可将其关闭。 |

  | 滑块 | | 滑块控制器。用于定义在浮点数值范围内操作的滑块。上方的旋钮定义浮点数值的最大值，下方的旋钮为最小值。每个旋钮的控制方式与单个旋钮控制器完全相同。可通过拖拽滑块手柄来调整滑块值。或者通过点击刻度上方数字并使用键盘输入数值（方式与单个旋钮控制器相同）来输入数值。如需在画布上移动滑块，请点击并拖动其中一个黑色区域。双击滑块任意位置可将其关闭。
  |

  | 直接输入 | | 使用键盘直接输入数值。点击数字并使用键盘输入新数值，然后按 `Enter` 或 `Return` 确认。先按 `Ctrl+Del` 清除字段。通过拖动黑色区域移动。双击可将其关闭。
  |


  '
- '# 三维浮点向量输入作为模块参数


  若未连接至其他模块，可通过双击三维浮点向量类型输入锚点（通常表示三维坐标集）来调整其值。有几种控制器可供使用，但通常默认控制器会显示出来。


  右键点击后所有可用的控制器类型列于表 7-9 中。


  **表 7-9.** 三维浮点向量输入


  | 控制器 | 图标 | 描述 |

  |---|---|---|

  | 滑块组 | | 三滑块组合。若锚点用于设定坐标，则三个滑块分别对应 x、y 和 z 坐标。每个上方的旋钮定义浮点数值的最大值，对应的下方旋钮为最小值。每个旋钮的控制方式与单个旋钮控制器完全相同。可通过拖拽滑块手柄来调整滑块值。或者通过点击刻度上方数字并使用键盘输入数值。如需在画布上移动滑块，请点击并拖动其中一个黑色区域。双击滑块任意位置可将其关闭。
  |

  | 轴视图 | | 旋转的图形化表示，显示为单位球面上的一个点。x 轴为白色，y 轴为紫色，z 轴为绿色，正向方向线条更粗。此控件对于定义向量范数应为 `1.0`
  的方向非常强大，但在其他情况下可能带来风险。当然，您可以尝试它来了解使用此控件是否有意义。要调整方向，请在靠近中心处点击并拖动鼠标，向任意方向移动。通过拖动角落附近的黑色区域在画布上移动，双击可将其关闭。
  |

  | 颜色 | | 此控件在此处用途有限，因为无法设置第四个颜色值 `ALPHA`，因此三维浮点向量锚点通常不对应颜色值。不过，如果您希望在 `[0;1.0]`
  范围内控制三维浮点向量的三个值，仍然可以使用它。要关闭，请双击右上角的方框。 |

  | 平面板 | | 使用此平面板只能控制三维浮点向量的前两个值；第三个值将始终设置为 `0.0`。使用旋钮定义边界（设置方式与其他旋钮相同）。用鼠标点击任意点以设定两个坐标。通过拖动黑色区域在画布上移动；双击可将其关闭。
  |

  | 直接输入 | | 如需直接输入所有三个值，请使用此控件。点击每个数字并使用键盘输入新数值，按 `Enter` 或 `Return` 确认。先按 `Ctrl+Del`
  清除字段。通过拖动黑色区域移动。双击可将其关闭。 |




