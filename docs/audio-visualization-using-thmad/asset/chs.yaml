- "# 引言\n\n音频可视化，就是捕捉来自外部的声音（使用麦克风或声卡的线性输入接口），或捕捉来自内部的声音（当计算机播放音频文件时）。ThMAD 软件套件允许以图形化方式构建音频处理管线，从而根据声音实时生成图形，产生美丽且有趣的输出。本章作为引言，将描述这样一个系统，介绍目标读者，并给出关于文本约定和本书推荐阅读方式的一些提示。\n\
  \n## 关于音频可视化与 ThMAD\n\n你可以购买 CD 或收听广播电台，或者通过流媒体或其他方式收听音乐。如果你喜欢某段音乐，它会带给你情感和/或智力上的感受，类似于一部好电影给你的感觉。就电影而言，音乐声音与视觉有着明显的结合——电影配有音轨，音轨与屏幕故事越匹配，带来的综合愉悦感就越强。制作电影通常意味着你首先编排好场景和对白，然后添加音轨。当然，如果你想制作一部好电影，并实现视觉与听觉两种感官的完美结合，这是一门高超的艺术。如果结合得非常好，两者会以某种方式相互增强。\n\
  \n至于音频可视化，你的感官会同时接收到视觉和听觉的输入。但它的实现方式与电影不同。顺序不同，且耦合方式看起来更为自动化。对于音频可视化，声音是首要的，然后基于声音，由某个程序生成联合艺术作品的视觉部分。至于第二种假设，我特意用了“看起来自动化”这个说法，因为一旦你拥有一个渲染程序，你可以启动它，坐在椅子上什么都不做，就能欣赏音乐的可视化效果。还有第三个区别：电影的音轨是基于情节的，绝不可能在改变情节的同时使用相同的音轨。而对于音频可视化，同一个可视化方案可以输入不同的声音，你仍能得到有趣的最终结果。\n\
  \n为了获得一个漂亮的可视化效果，并使其真正出彩，你必须用某种计算机语言构建一个渲染管线，这本身可能就是一种艺术。这需要手动完成。它的好处在于，你一开始并不需要是艺术大师或软件大师，因为入门并不复杂，使用正确的程序，你很快就能上手。\n\
  \nThinking Machine Audio Dreams（ThMAD，发音为“Thee-Mad”）软件套件正是这样一个程序。一旦你学会了基础知识，你就可以从一些简单易用的渲染设置开始；如果你有足够的时间去学习、实验并构建复杂的渲染管线，你最终将获得惊艳的音频可视化效果。\n\
  \nThMAD 基本上包含一个名为`Artiste`的程序，用于生成渲染管线，以及一个名为`Player`的程序，用于在可视化演出中运行该管线。在`Artiste`中工作时，你能实时看到操作的结果，它会根据你做出的更改迅速且恰当地对输入的声音做出反应，这极大地提高了你的工作效率。ThMAD\
  \ 及其周边系统如图 1 所示。\n\n![A457467_1_En_BookFrontmatter_Fig1_HTML.jpg](img/A457467_1_En_BookFrontmatter_Fig1_HTML.jpg)\n\
  \n图 1. ThMAD 及其周边系统\n\nThMAD 软件基于 Vovoid Media Technologies®公司的开源软件 VSXu，遵循 GNU\
  \ GPL 许可证（[`https://www.gnu.org/licenses/gpl-3.0.txt`](https://www.gnu.org/licenses/gpl-3.0.txt)）。该分支取自版本`0.5.0`。此后对其进行了大量工作，但引入了一些代码以允许正确加载和解释\
  \ VSXu 状态。\n\nThMAD 采用 GNU GPL 许可证，因此源代码对所有人开放。根据 GNU GPL，你不能出售它或将其用于你出售的产品中。但你可以将其用于个人或职业的娱乐，或在此基础上进行开发，并（仅！）以\
  \ GNU GPL 许可软件的形式分发它或你自己的衍生作品。你可以在此处找到源代码：[`https://sourceforge.net/projects/thmad/`](https://sourceforge.net/projects/thmad/)。\n\
  \n**注意**  \nVSXu 是瑞典 Vovoid Media Technologies AB 公司的注册商标或未注册商标。Dr. Peter Späth\
  \ 独立于 Vovoid Media。\n\n\n\n## ThMAD 系统要求与概述\n\n`ThMAD` 是为 Linux，更准确地说是 Ubuntu 设计的。不过，你可以通过在\
  \ Windows 或其他系统下的虚拟机中运行 Ubuntu，并在此环境中进行开发和实验。但不要期望这样的设置能提供高性能。对于严肃的应用，强烈建议你使用一台\
  \ Ubuntu 主机。如今，购买一台预装 Ubuntu 的 PC 或笔记本电脑，或者自行安装 Ubuntu，都不困难。后者有时可能会比较棘手，在特定情况下，你需要阅读大量文档和博客才能使其顺利运行。当然，Ubuntu\
  \ 主页会提供帮助，你也可以从可启动的 CD 运行试用版开始。除 Ubuntu 外的其他 Linux 发行版也可以运行，但你需要从源代码自行编译。就本书而言，`ThMAD`\
  \ 仅在 Ubuntu 上测试过。\n\n在底层，软件使用了 `OpenGL`，这是一个在复杂图形渲染（包括制造业和计算机游戏）中广泛采用的行业标准。你将能够使用多种显卡来运行\
  \ `ThMAD`。不过，对廉价硬件要谨慎，尤其是老旧显卡或过于精简的系统。你不能期望每个渲染管线都能流畅运行，一些更高级的管线甚至可能失败。请对自己好一些，至少多花点钱买一台中等配置的电脑和不错的图形硬件。\n\
  \n本书基于 `ThMAD` 版本 1.0.0。截至撰写时，相关的 `OpenGL` 版本为 3.0。\n\n## 本书的目标读者\n\n本书面向具有一定 IT\
  \ 背景的艺术家，或具有艺术倾向的开发者。开发经验并非必需，但对于一些高级功能（如着色器编程）肯定有帮助。不过，使用 `ThMAD` 完全不需要这些，如果涉及着色器源代码，本书还会通过示例帮助你作为工作基础。\n\
  \n本书不是开发指南，因此关于实际实现的提示较少出现，仅作为那些可能想要深入开发的人的锚点。\n\n为了完全理解 `ThMAD` 以及基于 `OpenGL` 的软件，你需要了解\
  \ 2D 和 3D 图形及坐标系的基础知识。不过，大多数几何概念都会在书中得到一定程度的解释。\n\n## 安装\n\n`ThMAD` 的安装过程在第 2 章“可视化基础”中讨论。\n\
