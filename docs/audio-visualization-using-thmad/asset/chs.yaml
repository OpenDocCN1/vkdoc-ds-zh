  \n图 6-18.\n\n组合主渲染管线与反馈管线\n\n\n\n现在您应该会看到如图 6-19 所示的输出。这一结果明显展示了自相似性：使用½、½ ∙ ½、½\
  \ ∙ ½ ∙ ½等缩放因子放大图片，总能得到与原图一致的效果。接下来我将详细解释其原理。主渲染管线会绘制一颗星并将其置于屏幕左上角。其位置和大小由`textured_rectangle`模块的设置决定。`blend_mode`模块将其与反馈子管线的输出（目前为空）混合，并将整体结果同时发送至屏幕和`render_-\
  \ surface_single`模块。后者将屏幕内容存储到图形硬件上的纹理存储器中。在下一帧中，`mesh_basic_render`模块将此存储纹理投影到由`mesh_grid`模块定义的平面网格上，该网格此时为`blend_mode`提供第二个输入。由于`mesh_grid`模块定义的网格坐标范围为(-0.5;\
  \ -0.5)到(+0.5; +0.5)，而屏幕输出范围为(-1; -1)到(+1; +1)，因此反馈图像的尺寸仅为输入图像的一半。此时`blend_mode`拥有两个非空输入，输出原始图像与反馈图像的叠加结果。下一帧中，此过程将产生一个尺寸为\
  \ 1/4 的克隆，再下一帧产生 1/16 尺寸的克隆，以此类推。\n\n![A457467_1_En_6_Fig19_HTML.jpg](img/A457467_1_En_6_Fig19_HTML.jpg)\n\
  \n**图 6-19.** 自相似性基础状态输出\n\n若想去除星形周围的黑色矩形（此处保留是为了更清晰地展示），只需将`render_surface_single`模块中`clear_color`锚点的`ALPHA`值设为\
  \ 0.0；参见表 6-19。\n\n**表 6-19.**\n\n| texture → buffers → render_surface_single |\n\
  | --- |\n| options / clear_color | 0, 0, 0, 0 |\n\n请记住，在 ThMAD 中`ALPHA`值始终是第四个颜色值。将其归零能有效阻止模块在每次绘制内部纹理缓冲区内容前清除其区域。\n\
  \n要改变此缩放因子并允许反馈图像平移，我们在`mesh_grid`模块与`mesh_basic_render`模块之间额外添加两个模块：Mesh → modifiers\
  \ → transformers → mesh_scale 与 Mesh → modifiers → transformers → mesh_translate。后续可用它们调整自相似舞台的整体特性。\n\
  \n到目前为止的状态如图 6-20 所示。请将其保存为自己的状态，因为您可以把它作为多种不同实验的基础。\n\n![A457467_1_En_6_Fig20_HTML.jpg](img/A457467_1_En_6_Fig20_HTML.jpg)\n\
