  | | `shad_param4:float` | |

  | | `shad_param5:float` | |

  | | `shad_param6:float` | |

  | | `shad_param7:float` | |

  | | `shad_param8:float` | |

  | 输出 | `result:texture` | 被选中的、可能经过插值的纹理 |


