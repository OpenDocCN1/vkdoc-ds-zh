  ## 宏


  宏是通过 Artiste GUI 生成的。它们是子管线的容器，其行为类似于带有输入和输出锚点的模块。


  一旦保存宏，它们将在下次启动 Artiste 时出现在模块列表菜单中。在操作系统文件结构中，宏将存储在这里：


  ```

  /home/[USER]/thmad/[VERSION]/data/macros/

  ```


  当前版本的 ThMAD 无法动态构建菜单，这就是为什么在修改模块结构后必须重启它的原因。


