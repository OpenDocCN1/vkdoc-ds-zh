  #### 渲染器


  当数据流在流程中到达渲染器时，我们就进入了对象的 OpenGL 世界。这意味着在渲染步骤之后，我们将得到点、线、多边形、四边形以及其他图形基元，这些基元最终会在屏幕上产生输出。本节描述了渲染数据的修改步骤，例如方向、渲染模式等。也就是说，具有渲染器输入和渲染器输出锚点的模块也在此处进行说明。渲染器根据其渲染的内容或对渲染对象执行的操作被划分为不同的部分。




  ##### 基础


