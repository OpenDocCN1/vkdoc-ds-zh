  = min → result = max(value, limit)` |


  ### 振荡器


  振荡器根据给定的频率 `f`，生成周期性重复的浮点数值。更正式地说，`function(t + n ∙ 1/f) = function(t)`，`n = 0,
  +/- 1, +/- 2, …`


  #### float_sequencer


  `float_sequencer` 允许从给定的序列中重复生成浮点数。路径为 `Maths → Oscillators → float_sequencer`。


  该序列在 Artiste GUI 内部使用图形化的 `float_sequence` 控制器定义。根据所选类型，数值会无条件重复或触发重复；参见表 8-52。


  表 8-52.


  序列器类型


  | `类型` | 描述 |

  | --- | --- |

  | `oscillating` | 无条件且无限重复。 |

  | `trigger` | 仅当触发器从 `trigger < 0 → trigger > 0` 变化时启动并运行一次。序列结束时，停止并发出最后一个值。当相同的触发器
  `trigger < 0 → trigger > 0` 再次被触发时，才会再次启动。 |

  | `trigger_pingpong` | 与 `trigger` 相同，但在触发器一次又一次被触发时，会交替地按正向和反向顺序运行序列。 |

  | `trigger_sync` | 与 `trigger_pingpong` 相同，但正向序列在触发 `trigger < 0 → trigger > 0`
  时运行，反向序列在 `trigger > 0 → trigger < 0` 时运行 |


  锚点参数如表 8-53 所示。


  表 8-53.


  | `float_sequencer` | 一个浮点数序列器 |

  | --- | --- |

  | 输入 | `float_sequence: sequence` | 浮点数序列。 |

  |   | `length:float` | 运行一次序列所需的秒数。 |

  | `options:complex` |   |

  | `behavior: enum` | 振荡器行为，可选 `oscillating`、`trigger`、`trigger_pingpong`、`trigger_sync`。
  |

  | `time_source: enum` | 时间（隐藏输入参数）源。可选：`operating_system`：使用操作系统的计时器；`sequence`：使用序列计时器，即可能忽略序列间隙。
  |

  | `trigger:float` | 触发值。当 `behavior = oscillating` 时未使用。 |

  | `drive_type: enum` | 时间（隐藏输入参数）模式。可选：`time_internal_relative`：传递自引擎启动以来用于渲染工作所经过的时间；`external`：使用
  `drive` 参数。 |

  | `drive:float` | 若 `drive_type` 使用了 `external`，则为时间参数。这样你可以使用自定义的时间概念。 |

  | 输出 | `float:float` | 振荡器输出值，为序列中的一个值。 |




  #### `inside_range`


  路径为 Maths → Oscillators → `inside_range`。参见表 8-54。


  表 8-54.


  | `inside_range` | 判断一个数字是否位于特定范围内 |

  | --- | --- |

  | 输入 | `sound_in:float` | 输入浮点数 |

  |    | `range_low:float` | 下限 |

  |    | `range_high:float` | 上限 |

  |    | `randomness: float` | 指定`random_beat`锚点的随机性。0 表示从不触发，100 表示始终触发。 |

  | 输出 | `every_beat:float` | 一旦进入范围，则触发一个值为`1.0`的单帧脉冲 |

  |    | `random_beat: float` | 与`every_beat`相同，但仅以特定概率触发 |

  |    | `in_range:float` | 当在范围内时为 1.0，否则为 0.0。 |


  严格来说，这并不是一个振荡器，而是一个输入数据的聚合器。当输入数据（如音乐）具有周期性成分时，对于连接到其输出的组件来说，它看起来就像一个振荡器，因此它被归入振荡器部分。


  这个伪振荡器对于声音节拍检测很有用。它能在一定程度上抹平不重要的副节拍。更详细地说，它的工作方式如下：给定输入数字序列 `a[1]`， `a[2]`， `a[3]`，
  `a[4]`，... 以及一个范围 `[r[1]，r[2]]`，模块的`in_range`输出锚点对于所有在该范围内的数字（即 `a[i] ∈ [r[1]，r[2]]`）输出
  1.0，对于其他所有数字输出 0.0。示例如图 8-2 所示。


  ![A457467_1_En_8_Fig2_HTML.jpg](img/A457467_1_En_8_Fig2_HTML.jpg)


  图 8-2. 范围内伪振荡器，范围内输出。白线表示输入信号，绿色表示范围，紫线表示`in_range`输出。


  此外，输出锚点`every_beat`会在每次`in_range`输出从 0.0 变为 1.0 时触发一个单脉冲。作为后者的一个变体，输出锚点`random_beat`会在`in_range`输出从
  0.0 变为 1.0 时，以随机方式触发单脉冲。“`randomness`”输入参数描述了触发率：只有当某个介于 0 和 100 之间的随机数落在 [0;`randomness`]
  范围内时，该脉冲才会被触发。因此，这种随机脉冲的概率为“`randomness`”百分比。`every_beat`输出的示例如图 8-3 所示。


  ![A457467_1_En_8_Fig3_HTML.jpg](img/A457467_1_En_8_Fig3_HTML.jpg)


  图 8-3. 范围内伪振荡器，节拍输出。白线表示输入信号，绿色表示范围，紫线表示`every_beat`输出。


  #### `oscillator`


  这取决于类型：可以是噪声、正弦、锯齿、方波、三角波或二次波振荡器。路径为 Maths → Oscillators → Oscillator。


  详细来说，如果`freq`是频率 `f`，`amp`是振幅，`ofs`是偏移量；参见表 8-55。


  表 8-55. 振荡器模块的类型


  | 名称 | 类型 | 描述 |

  | --- | --- | --- |

  | `noise` | 噪声 | 将每频率秒从 [-1;+1] ∙ `amp` + `ofs` 范围内创建一个随机值 |

  | `sin` | 正弦 | 对于 f = 1:![A457467_1_En_8_Figx_HTML.jpg](img/A457467_1_En_8_Figx_HTML.jpg)`ofs`
  将加到值上。注意：这不是数学上的 `sin(t)`，而是 `sin(t ∙ 2π)`，因此每 `t → t + 1` 有一个完整周期 |

  | `saw` | 锯齿 | 对于 f = 1:![A457467_1_En_8_Figy_HTML.jpg](img/A457467_1_En_8_Figy_HTML.jpg)`ofs`
  将加到值上 |

  | `square` | 方波 | 对于 f = 1:![A457467_1_En_8_Figz_HTML.jpg](img/A457467_1_En_8_Figz_HTML.jpg)`ofs`
  将加到值上 |

  | `triangle` | 三角波 | 对于 f = 1:![A457467_1_En_8_Figaa_HTML.jpg](img/A457467_1_En_8_Figaa_HTML.jpg)`ofs`
  将加到值上 |

  | `quadratic` | 重复的半条抛物线曲线 | 对于 f = 1:![A457467_1_En_8_Figab_HTML.jpg](img/A457467_1_En_8_Figab_HTML.jpg)`ofs`
  将加到值上 |


  此外，参数`phase`将加到时间上，这意味着水平移动曲线。这并不常用，如果不需要，可以保留其默认值 0 而无需关心。所有参数参见表 8-56。


  表 8-56.


  | `oscillator` | 一个振荡器 |

  | --- | --- |

  | 输入 | `osc:complex` | |

  |    | `osc_type: enum` | 振荡器类型；可以是`noise`， `sin`， `saw`， `square`， `triangle` 或
  `quadratic`。 |

  |    | `freq:float` | 频率（1/s） |

  |    | `amp:float` | 振幅；振荡器值将位于 [-amp; +amp] + `ofs` 范围内 |

  |    | `ofs:float` | 偏移量；振荡器值将位于 [-amp; +amp] + `ofs` 范围内 |

  |    | `phase:float` | 为时间参数增加一个值 |

  | `options:complex` | | |

  |    | `time_source: enum` | 时间源（隐藏输入参数）。可选值： − `operating_system`：将使用操作系统计时器 −
  `sequence`：将使用序列计时器，即可能会减去序列间隙 |

  |    | `drive_type: enum` | 时间模式（隐藏输入参数）。可选值： − `time_internal_absolute`：传递引擎启动以来经过的绝对时间
  − `time_internal_relative`：传递引擎启动以来用于渲染工作经过的时间。 − `external`：使用`drive`参数。 |

  |    | `drive:float` | 当`drive_type`为`external`时使用的时间参数。这样你可以有自己的时间概念。 |

  | 输出 | `float:float` | 振荡器值，始终位于 [-amp; +amp] + `ofs` 范围内 |


