- "# 资源作为模块参数的输入类型\n\n可以通过双击资源类型的输入 ![A457467_1_En_7_Figay_HTML.jpg](img/A457467_1_En_7_Figay_HTML.jpg)\
  \ 来设置。\n\n资源查看器将显示，如图 7-20 所示。\n\n![A457467_1_En_7_Fig20_HTML.jpg](img/A457467_1_En_7_Fig20_HTML.jpg)\n\
  \n图 7-20. 资源选择器\n\n在资源查看器中，从远离彩色框的任意位置开始点击并拖动进行导航。通过双击选择文件，或通过右键单击取消选择操作。\n\n请注意，如果您从\
  \ ThMAD 外部更改了资源，则需要告知 ThMAD 刷新其文件列表。您可以通过从主菜单中选择 `Refresh File Lists` 来实现。\n\n\n\
  \n### 将序列输入作为模块参数\n\n此控件用于需要 XY 序列的模块，例如浮点值随时间变化或类似情况。一个示例是输入参数`float_sequence`模块，位于\
  \ Maths ➤ oscillators ➤ float_sequencer，该振荡器输出值的序列在其中被定义。\n\n当对应的参数编辑器打开时（可通过双击锚点或右键单击上下文菜单），将出现图\
  \ 7-21 所示的图像。\n\n![A457467_1_En_7_Fig21_HTML.jpg](img/A457467_1_En_7_Fig21_HTML.jpg)\n\
  \n图 7-21.  \n序列编辑器\n\n这是一个所有值都等于 1.0 的序列。序列的锚点是线条起点和中间的小矩形。开始时我们只有两个锚点。您可以通过左键单击锚点并拖动来自由移动它们。\n\
  \n要添加新锚点，只需单击线条上的任意位置并按住`Shift`键。要移除锚点，请在按住`Shift`键的同时右键单击它。结果可能如图 7-22 所示。\n\n\
  ![A457467_1_En_7_Fig22_HTML.jpg](img/A457467_1_En_7_Fig22_HTML.jpg)\n\n图 7-22. \
  \ \n锚点被移动和添加后的序列编辑器\n\n在每个点上，插值类型决定了它如何与右侧的相邻点连接。默认是**无插值**，这意味着锚点会恰好在其位置（而非更早）突然强制将值改变。这可以在图\
  \ 7-22 的第二个锚点处看到。由于我们目前是通过`Shift`+点击来添加锚点，这些锚点将对其右侧邻居显示线性插值，这意味着值从一个点到下一个点线性变化。您可以通过右键单击锚点并选择所需选项来更改插值类型。\n\
  \n插值类型包括：\n\n- **无插值**：值保持恒定，直到到达下一个点的 x 坐标，然后突然改变其值。见图 7-23。\n\n  ![A457467_1_En_7_Fig23_HTML.jpg](img/A457467_1_En_7_Fig23_HTML.jpg)\n\
  \n  图 7-23.  \n  不同序列编辑器锚点插值：线性、无、余弦和贝塞尔。线条延伸末端的贝塞尔锚点已被选择，以使线段平滑匹配。\n\n- **线性插值**：默认选项。从一个点到下一个点线性变化。见图\
  \ 7-23。\n\n- **余弦插值**：一种平滑曲线，其函数参数为 0 或π，直到π或 2π，具体取决于值是减小还是增大。请注意，线段起点和终点的斜率为零。见图\
  \ 7-23。\n\n- **贝塞尔插值**：一种贝塞尔曲线，允许平滑的段间连接。一旦选择，贝塞尔段将添加两个用于贝塞尔参数的额外锚点，您可以选择、单击并拖动它们。这些额外的手柄很小，因此请务必放大以查看它们。见图\
  \ 7-23。\n\n在内部，出于性能考虑，序列的所有点都存储在一个包含 8192 个 XY 对的数组中。\n\n### 导出状态\n\n完成某个状态后，您可以将其保存到一个不可修改的文件单元中，称为视觉素材。若状态文件位于此文件夹内：\n\
  \n```\n/home/[USER]/thmad/[VERSION]/\ndata/states/\n```\n\n对于 ThMAD Artist 而言，视觉素材存放于以下文件夹之一：\n\
  \n- `/home/[USER]/thmad/[VERSION]/data/visuals/`\n- `/home/[USER]/thmad/[VERSION]/data/prods/`\n\
  - `/home/[USER]/thmad/[VERSION]/data/faders/`\n\n`visuals/`和`prods/`文件夹之间仅有逻辑上的区别；您将文件导出到`visuals/`以供后续在\
  \ ThMAD Player 中使用，而`prods/`更像是通用导出文件夹。`faders/`文件夹用于导出特殊的推杆状态，以供在 ThMAD Player\
  \ 内部进行转场时使用。内部文件结构是相同的。\n\n执行导出的步骤在“主菜单”部分的“编译 ➤ ”下进行了描述。\n\n\n\n## 宏\n\n`宏`是用于对模块进行分组的容器。除非展开，否则它们在画布上显示为单个符号，因此你可以使用它们来隐藏状态中的细节，提高可读性。此外，`宏`可以独立于状态单独保存，并在其他状态中重复使用。\n\
  \n要创建一个宏，请右键单击画布的空白区域，使用弹出的主菜单。点击`创建宏`项。\n\n操作列表见表 7-12。\n\n**表 7-12.** 宏操作\n\n\
  | 打开宏 | 右键单击宏，然后从弹出菜单中选择`打开/关闭`。 |\n| 关闭宏 | 与打开宏相同。 |\n| 移动宏 | 如果宏已关闭，只需像操作其他模块一样，单击并拖动它。如果宏已打开，则单击宏内的空白区域。\
  \ |\n| 删除宏 | 单击宏，然后按`Del`键。或者右键单击宏并选择`删除 [del]`项。 |\n| 重命名宏 | 确保已启用`对象检查器`（你可以通过在画布空白区域按`Ctrl+O`来切换其可见性）。单击宏，然后使用`对象检查器`中的`重命名`功能。\
  \ |\n| 克隆宏 | 与模块类似，按住`Ctrl+Alt`键，然后将宏拖到画布的空白区域。克隆宏也会克隆其所有组成模块！ |\n| 调整宏大小 | 右键单击并从出现的菜单中选择`双倍大小`或`一半大小`。这仅适用于已打开的宏（你可以在宏关闭时调整大小，但关闭的宏的符号大小不会改变）。\
  \ |\n| 修改/控制宏内部的模块 | 打开宏，然后执行与组件在宏外部时相同的操作。 |\n| 将单个模块移入宏 | 按住键盘上的`Ctrl+Shift`键，然后用鼠标左键将模块拖动到已打开的宏中（对已关闭的宏无效！）。一旦进入宏，只能通过删除来将模块从宏中移除。你不能将其移出（不过按`Ctrl+Z`撤销会有效）。\
  \ |\n| 一次将多个模块移入宏 | 选择多个模块。可以按住`Ctrl`键的同时单击选择，或者在按住`Ctrl`键的同时围绕模块绘制一个矩形（按下`Ctrl`，然后按住鼠标左键从左上角开始，移动到右下角，然后松开鼠标按钮，最后松开`Ctrl`）。选择完成后，按住`Ctrl+Shift`键，并将其中一个选中的模块拖动到已打开的宏中（对已关闭的宏无效！）。一旦进入宏，只能通过删除来将模块从宏中移除；你不能将其移出（不过按`Ctrl+Z`撤销会有效）。\
  \ |\n\n无论你是一次将单个模块还是多个模块移入宏，传入和传出的连接都会在宏的边缘显示为人工锚点。参见图 7-24。\n\n![A457467_1_En_7_Fig24_HTML.jpg](img/A457467_1_En_7_Fig24_HTML.jpg)\n\
  \n**图 7-24.** 宏锚点\n\n更多操作列于表 7-13。\n\n**表 7-13.** 宏扩展操作\n\n| 将内部模块的锚点暴露给外部世界 | 要暴露内部锚点（例如，你有一个内部模块带有输入锚点`xyz`，并且你想从宏外部控制它），将该锚点拖动到宏内的空白区域。\
  \ |\n| 移除宏锚点 | 右键单击一个宏锚点，然后从菜单中选择`取消别名`。 |\n| 保存宏 | 可以保存宏以便日后重用，方法是右键单击宏，然后从弹出菜单中选择`保存宏...`。下次重启\
  \ ThMAD 后，保存的宏将出现在模块列表中。 |\n| 将保存的宏插入当前状态 | 从模块列表的`宏`部分拖出，如同操作普通组件一样。 |\n\n保存的宏只能在\
  \ ThMAD 外部删除。请导航至以下文件夹并删除相应文件：\n\n```\n/home/[USER]/thmad/\n[VERSION]/data/macros/\n\
  ```\n\n### 备注\n\n`备注`有助于记录你的状态或其部分内容。要创建备注，请右键单击画布的空白区域，然后在弹出菜单中选择`创建备注`。在那里添加任何文本。参见图\
  \ 7-25。\n\n![A457467_1_En_7_Fig25_HTML.jpg](img/A457467_1_En_7_Fig25_HTML.jpg)\n\
  \n**图 7-25.** 一条备注\n\n要移动备注，请拖动其标题栏。要删除备注，请单击其右上角的关闭框。要更改其大小，请单击并拖动其任一边或一角。（遗憾的是，没有用户界面反馈来帮助找到正确的鼠标位置；你只能尝试。）\n\
  \n请注意，你不能向宏中添加备注，并且备注不参与多选（按`Ctrl`键点击并绘制矩形）。此外，节点不能像模块一样被克隆。\n\n### ThMAD 播放器\n\n\
  ### 启动和停止 GUI\n\n有关启动和停止 ThMAD 播放器的信息，请参见第 3 章。本章其余部分假设你已运行 ThMAD 播放器。\n\n#### 播放器\
  \ GUI 操作\n\n播放器对鼠标移动没有反应，但你可以使用键盘上的几个按键来控制它。\n\n播放器运行时，表 7-14 中列出的键盘操作可用。\n\n**表\
  \ 7-14.** ThMAD 播放器控制\n\n| `O` | 切换文本覆盖层的可见性。如果启用，当视觉效果切换时会短暂打印信息。默认为开启，除非通过程序调用禁用。\
  \ |\n| `F1` | 显示帮助。自动启用文本覆盖层；之后按`O`可禁用它。 |\n| `F` | 显示状态信息。自动启用文本覆盖层；之后按`O`可禁用它。\
  \ |\n| 光标左/右 | 返回到列表中的上一个或前进到下一个视觉效果。 |\n| 光标上/下 | 增加或减少对声音输入的灵敏度。 |\n| 翻页上/下 |\
  \ 加快/减慢速度。控制时间缩放因子。 |\n| `R` | 启用/禁用随机化。如果禁用，则停留在一个视觉效果上。如果启用，则在随机时间间隔后随机切换视觉效果。\
  \ |\n| `Ctrl+R` | 从列表中随机选择另一个视觉效果。 |\n| 退出键 | 退出播放器。 |\n\n## 总结\n\n在本章中，你学习了 ThMAD\
  \ Artiste 和 ThMAD 播放器的所有 GUI 功能。你了解了如何使用键盘控制一切，如何识别、放置和连接元素，以及如何使用参数控件来调整不同类型的模块参数。你还探讨了\
  \ Artiste 中的不同窗口模式和辅助小部件。你学习了文件处理方法，以及 Artiste 和播放器如何协同工作。\n\n下一章将提供可用于创建视觉效果的所有模块的完整参考手册。\n\
  \n\n\n"
- '# 8. ThMAD 模块参考


  在 ThMAD 中，模块是构建可视化效果的积木。本章提供完整的模块参考，描述每个模块的功能及其参数。其结构同时也说明了您可以通过该软件实现哪些功能。通读本章将有助于您获得一些印象和新想法。模块类别名称和模块名称与用户界面及实现代码紧密相关，其中侧重用户界面，以便您能轻松地利用用户界面进行自己的实验。


  所有模块都有零个或多个输出锚点（表示各种类型的数据），以及零个或多个输入锚点（表示各种类型的数据）。某些模块具有副作用，即它们会存储某些内容或执行某些操作，但这些并不反映在输出数据中。数据类型如下：


  *   `int`：一个整数。

  *   `float`：一个浮点数。

  *   `double`：一个双精度浮点数。ThMAD 中所有浮点数均为单精度浮点类型，因此这个双精度类型尽管已定义，但并未使用。

  *   `float3`：包含三个浮点数的向量。例如，3D 坐标。

  *   `float4`：包含四个浮点数的向量。例如，红、绿、蓝、阿尔法颜色值。

  *   `quaternion`：也是包含四个浮点数的向量，但遵循四元数运算规则。四元数精确表示 3D 旋转操作。

  *   `string`：一个字符串。

  *   `matrix`：一个 4x4 的浮点数矩阵。矩阵用于描述空间操作，如旋转、缩放和平移。

  *   `float_array`：一个可变数量的浮点数值数组。

  *   `float3_array`：一个可变数量的 float3 向量数组。

  *   `quaternion_array`：一个可变数量的四元数数据数组。

  *   `resource`：指向一个资源文件，可能是模块可以读取或写入的图片或文本文件。

  *   `enum`：一个枚举。用于需要从固定集合中选择字符串值的地方。枚举也用于一次性操作，例如重置或触发某些功能。

  *   `sequence`：包含 8192 个浮点数值的数组。用于需要指定某个浮点数值变化过程（通常在时域内）的模块。它与`float_array`的不同之处在于，在
  ThMAD Artiste 用户界面中有一个专门的图形编辑器。

  *   `render`：一个表示可绘制项目的内部队列。

  *   `texture`：表示图形硬件内部的有色像素位图。

  *   `mesh`：定义 3D 对象表面的一组点。可能表示面，即具有连接边的二维表面单元，但并非总是如此。

  *   `bitmap`：由 CPU 掌管的有色像素集合，意味着不直接由图形硬件处理。只能通过合适的渲染器模块发送到图形硬件。

  *   `particlesystem`：可能数量庞大的相同或相似 3D 对象集合。在内部处理，仅通过某些渲染器发送到图形硬件。

  *   `segment_mesh`：一种带有非连接边的特殊网格形式。通常在进一步处理前转换为网格。


  在本章的模块参考表中，所有模块控制锚点规范将写作：


  *   `参数名称 : 参数类型`


  其中参数名称不含空格或连字符。表中较长的名称会在下划线处换行，所以如果您看到类似`gamma_ correction:float` 的内容，实际指的是 `gamma_correction:float`。


  每个模块都属于一个类别，这体现在模块列表和模块浏览器中各模块的位置上。模块类别如下：


  *   屏幕：输出到图形硬件。

  *   位图：驻留于主内存并由 CPU 处理的有色像素存储。

  *   虚拟模块：通常原样传递值的模块。例如，当您想用一个浮点值同时控制多个输入锚点时使用。该类别实际上只包含对其他类别中虚拟模块的引用。

  *   数学：数学运算，如操作符（所有输入和输出类型相同）以及函数（输入和输出类型不同）。这里您还可以找到振荡器。

  *   网格：包含定义 3D 对象表面或表面部分的一组点，无论是否连接。

  *   粒子系统：可能数量庞大的相同或相似 3D 对象集合。用于雨、雾以及许多特殊效果。

  *   渲染器：将不同类型的输入转换为可直接连接到屏幕的输出锚点。也包含修改其他模块渲染器输出的模块。

  *   选择器：用于从某种数据类型的集合中获取单个元素或一个子范围。

  *   音频：处理声音输入。

  *   字符串：处理字符串。

  *   系统：系统相关模块的集合，如时间、系统状态或文件选择器相关模块。

  *   纹理：处理驻留在图形硬件上的位图。使用纹理而非位图可带来巨大的性能提升。纹理对于反向传播像素数据也很重要，即将子管线的输出反馈回其某个输入组成部分。

  *   宏：可重用的子管线。


  ## 屏幕


  这实际上包含一个内置模块 `screen0`，是图形输出的必备模块。任何模块最终都必须以某种方式连接到屏幕；否则它将不会处于活动状态。因此，它是可视化设置中的管线或管线组的最后一个模块，负责在显示器上产生视觉输出。


  ### screen0


  输出到图形硬件、显卡和显示器。见表 8-1。


  表 8-1.


  screen0 模块


  | `screen0` | 屏幕 |

  | --- | --- |

  | 输入 | `screen:render` | 任何可视化管线都必须连接至此。如果此连接未连接，则什么都看不到。如果多个管线连接到此锚点，渲染顺序可能非常重要。要更改
  ThMAD Artiste 用户界面中的顺序，请双击锚点并拖动锚点连接器。 |

  |   | `gamma_correction:float` | 伽马校正。默认值为 1.0。伽马校正是由于人类对视觉亮度的感知是非线性的，并且老式阴极射线管本身也表现出非线性行为。通常，伽马值大于
  1 会使阴影显得更暗，伽马值小于 1 会使阴影显得更亮。 |

  | 输出 | 无 | 将渲染到图形硬件。 |


  ## 位图


  位图是存在于 ThMAD 内部（而非图形硬件内部）的图像，因此可以在它们上传到图形硬件之前对其进行操作。




  ### 滤镜


  位图滤镜都涉及两个位图，并且都具有相同的结构。路径为 `Bitmaps` → `Filters`，然后参见表 8-2。


  **表 8-2.** 位图滤镜模块


  | 动态分配的名称 | | |

  | --- | --- | --- |

  | **输入** | `bmp1:complex` | 第一个位图 |

  | | `in1:bitmap` | 位图锚点；需要连接到位图发生器 |

  | | `bitm1_ofs: float3` | 这是混合发生前应用于位图像素坐标的偏移量。第三个坐标被忽略 |

  | | `bmp2:complex` | 第二个位图 |

  | | `in2:bitmap` | 位图锚点；需要连接到位图发生器 |

  | | `bitm2_ofs: float3` | 这是混合发生前应用于位图像素坐标的偏移量。第三个坐标被忽略 |

  | | `bitm2_opacity: float` | 定义混合因子，取值范围为 [0;1]。值为 0 时，输出为 B1。值为 1 时，输出为混合结果。所有其他值进行线性插值。
  |

  | | `target_size: float3` | 输出位图大小。第三个坐标被忽略。 |

  | | `set_target_size:enum` | 使用此选项将大小设置为以下正方形之一：8x8、16x16、32x32、64x64、128x128、256x256、512x512、1024x1024
  和 2048x2048。 |

  | | `blend_type: enum` | 混合类型——决定进行混合时应用的公式。可用模式在此章节中列出。请注意，所有不同的位图滤镜将仅在此锚点使用不同的设置。
  |

  | | `bitmap_type: enum` | 取值为 `integer` 或 `float`。未使用。 |

  | **输出** | `bitmap:bitmap` | 输出位图。您可以在此处添加更多滤镜，或将其发送到任何需要位图作为输入的模块。 |


  所有可用的混合模式列于表 8-3 中。若给出示例图片，我们使用 ![A457467_1_En_8_Figa_HTML.jpg](img/A457467_1_En_8_Figa_HTML.jpg)
  作为位图 B1（边缘的白色部分），并使用 ![A457467_1_En_8_Figb_HTML.jpg](img/A457467_1_En_8_Figb_HTML.jpg)
  作为位图 B2（已添加 `ALPHA` 通道，但所有位置读取值均为 1.0）。


  **表 8-3.** 位图滤镜混合模式


  | 滤镜模块名称 | 对应的“blend_type”锚点设置 | 描述 |

  | --- | --- | --- |

  | `bitm_blend_add` | `BLEND_ADD` | 对于每个 RGBA 值，将 B1 和 B2 相加。![A457467_1_En_8_Figc_HTML.jpg](img/A457467_1_En_8_Figc_HTML.jpg)
  将结果限制在最大值 1.0 范围内。混合这些图像将得到此处所示的图像。左上角的白色来自该处的 `ALPHA` 在混合前未被应用！因此，即使那里 `ALPHA`
  为 0，隐藏的 RGB 值（此处为白色）也会被计入！ |

  | `bitm_blend_average` | `BLEND_AVERAGE` | 对于每个 RGBA 值，取平均值 `(B1+B2) / 2`。![A457467_1_En_8_Figd_HTML.jpg](img/A457467_1_En_8_Figd_HTML.jpg)
  |

  | `bitm_blend_color_burn` | `BLEND_COLOR_BURN` | 对于每个 RGBA 值，将 B1 的反色除以 B2，再对结果取反，并限制在
  [0.0;1.0] 范围内。将 B2 的颜色烧入 B1。示例图片的结果如下所示；B1 越暗，其颜色使用得越多。![A457467_1_En_8_Fige_HTML.jpg](img/A457467_1_En_8_Fige_HTML.jpg)
  |

  | `bitm_blend_color_dodge` | `BLEND_COLOR_DODGE` | 对于每个 RGBA 值，用 B1 除以 B2 的反色。B2
  越亮，对结果颜色的影响越大。结果中 B1 的任何部分都不会变暗。![A457467_1_En_8_Figf_HTML.jpg](img/A457467_1_En_8_Figf_HTML.jpg)
  |

  | `bitm_blend_darken` | `BLEND_DARKEN` | 对于每个 RGBA 值，取 B1 和 B2 中较小的值。![A457467_1_En_8_Figg_HTML.jpg](img/A457467_1_En_8_Figg_HTML.jpg)
  |

  | `bitm_blend_difference` | `BLEND_DIFFERENCE` | 对于每个 RGBA 值，取绝对值差 `\| B1 – B2 \|`。在我们的示例中，我们只会在
  B1 的 `ALPHA ≠ 1.0` 的区域（即其周围）得到 `ALPHA` 值。如果 B2 的 `ALPHA` 并非处处为 1.0，你将得到更有趣的结果。![A457467_1_En_8_Figh_HTML.jpg](img/A457467_1_En_8_Figh_HTML.jpg)
  |

  | `bitm_blend_exclusion` | `BLEND_EXCLUSION` | 每个 RGBA 值的公式为：`B1 + B2 - 2 * B1 *
  B2` |

  | `bitm_blend_glow` | `BLEND_GLOW` | 对于每个 RGBA 值，取 B2 的平方，然后除以 B1 的反色。平方运算会强调 B2
  中较亮的部分，但对于较暗的部分，B1 中亮的部分会获得影响力。![A457467_1_En_8_Figi_HTML.jpg](img/A457467_1_En_8_Figi_HTML.jpg)
  |

