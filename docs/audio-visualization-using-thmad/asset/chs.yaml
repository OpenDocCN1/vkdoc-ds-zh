  ## 总结


  本章包含了一系列教程（或故事），涵盖了 ThMAD 的诸多方面并展示了其功能。你学习了多种 3D 技巧，包括变换、特殊图形渲染模式，以及一个名为 `ocean`
  的非常特别的模块。本章还介绍了纹理和 blob。


  虽然本章或多或少侧重于基础概念和技术，但第 6 章则是一系列更高级的故事。


