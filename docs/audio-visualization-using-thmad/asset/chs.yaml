  0)` 内使用一个包含 `n ∙ n` 个顶点的单一平面网格，并将给定的纹理线性映射到所有顶点。到目前为止，这并没有区别，因为网格的所有片段都能正确映射到纹理的对应片段。但我们可以调整纹理坐标以实现扭曲效果。要查看一个示例，请删除
