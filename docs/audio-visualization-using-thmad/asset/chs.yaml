  ### 柏林噪声图斑


  柏林噪声是一种算法，可以极大地改善具有起伏部分的 2D 或 3D 场景（如表面结构、水波、雾气或火焰）的自然外观。除了在场景内使用柏林噪声外，ThMAD 还允许您将其添加到图斑中。您将在此处了解如何实现这一点。


  **注意**


  本节示例可在 `TheArtOfAudioVisualization` 文件夹下的 `A-5.3.2_*` 路径中找到。


  通过右键单击空白区域并选择“新建”→“空项目”来创建一个空状态。


  然后在画布上放置以下模块：


