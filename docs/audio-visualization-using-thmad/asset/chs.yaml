  关于顺序的说明：ThMAD 底层使用的 OpenGL 是一个状态机，顺序并非在所有情况下都重要。但在很多情况下它确实很重要，尤其是在涉及矩阵运算时。在上面描述的状态中，`orbit_camera`
  和 `light_directional` 模块在空间中都有一个由矩阵描述的朝向。这里的顺序至关重要：如果我们把灯光放在相机之后，灯光的位臵就会随相机旋转，就像灯光和相机被绑在一起一样。但我们期望的是，旋转相机时灯光保持固定，因此灯光需要在状态中位于相机之前。


  这里新增了一个不起眼的模块叫 `auto_normalize`。它负责在变换之后、应用光照之前修正法向量。在某些情况下，特别是涉及任何类型的缩放变换时，忘记它可能会给你带来奇怪的光照问题和无数个不眠之夜。


  **注意：** 在任何可能存在缩放操作的 3D 状态中，务必在光照之前添加 `Renderers → opengl_modifiers → auto_normalize`
  模块。


