  ### 纹理映射


  纹理，更确切地说是纹理贴图，是一种使用预加载到图形硬件上的 2D 图像来有效描述 3D 对象各部分表面特征的方法。


  这样做有一个技术原因。考虑一个真实世界中移动的 3D 对象。为了逼真地表示它，我们必须通过观察数百万个微小的彩色点来描述它。这些点中的每一个都在移动，并且每秒需要计算几十次。如果所有这些都在计算机的
  CPU 中进行，那么每秒需要将过多的数据传输到图形硬件。相反，作为解决此困境的一个相当巧妙的方法，我们通过数量少得多的点或顶点（它们构成一个覆盖在表面上的网格）来描述每个
  3D 对象，并将预加载的 2D 图像的合适部分映射到网格的每个面上。这有效地将每秒需要传输到图形硬件的数据量减少了几个数量级。


  纹理映射的主要数学描述包括为构成形状的每个顶点分配两组坐标。例如，如果您绘制一个由以下坐标构成的四边形面


  `(x1，y1，z1) → (x2，y2，z2) → (x3，y3，z3) → (x4，y4，z4) → (x1，y1，z1)`


  并且您想要将 2D 纹理的一部分映射到其上，更准确地说是一个四边形：


  `(u1，v1) → (u2，v2) → (u3，v3) → (u4，v4) → (u1，v1)`


  那么这组双坐标正是您在程序内部必须提供的，以描述一个纹理贴图：


  `(x1，y1，z1， u1，v1) → (x2，y2，z2， u2，v2) → (x3，y3，z3， u3，v3) → (x4，y4，z4， u4，v4) →
  (x1，y1，z1， u1，v1)`


  图 5-22 以图形方式描绘了这一点。请注意，关于纹理还有很多要说的。纹理还有 1D、3D，甚至 4D 形式，以及针对不同分辨率的堆叠存储类型等等。在本书中，我们只描述所有这些功能的一部分，但您可以在互联网或其他书籍上阅读到的材料可能非常丰富，因此如果您愿意，可以随意使用其他来源扩展您的研究。


  ![A457467_1_En_5_Fig22_HTML.jpg](img/A457467_1_En_5_Fig22_HTML.jpg)


  **图 5-22.** 基本纹理映射


  首先，在 ThMAD 中，没有一种通用方法可以以被纹理化对象的结构和纹理所需的方式来描述这种逐点纹理映射。这是因为您通常不会输入点坐标，而是输入某种形式的形状，并且没有可靠的方法来猜测每个纹理点需要映射到哪里。但是，有一些变通方法可以涵盖一些有趣的情况，例如使用自动纹理坐标生成，以及
  OpenGL 中一个称为着色器的功能。两者都能产生引人入胜的效果，并且对您的可视化构思至关重要。




  ### 自动纹理坐标


  OpenGL 有一个名为 `glTexGen()` 的函数。它描述了一种古老的遗留技术，让渲染引擎自动生成纹理映射。现在它已被着色器取代，本书不涉及着色器。它在表现力方面存在一些不足。


  **注意：** 此源码位于 `TheArtOfAudioVisualization` 文件夹内的 `A-5.2.1_Automatic_texture_coordinates`
  目录下。


  尽管如此，你仍可将其用于你的草图中，因为 ThMAD 中有一个模块涵盖了这个功能。该模块名为 `Texture → opengl → texture_coord_gen`。要使用它，你还需要一个基本的
  3D 管线、一个网格和一个纹理。作为操作示例，以下章节描述了将纹理映射到球体以及立方体的一个面上。从这些模块开始：


  - `orbit_camera`

  - `light_directional`

  - `material_param`

  - `backface_culling`


  将相机连接到屏幕模块 `screen0`。这是管线的后端。从另一端，如果你喜欢，可以选择画布的左侧。我们从一条链开始，并将它们全部连接起来：


  - `Texture → loaders → png_tex_load`

  - `Texture → modifiers → scale`

  - `Texture → modifiers → tex_parameters`

  - `Texture → modifiers → translate`

  - `Renderers → mesh → mesh_basic_render`

  - `Texture → opengl → texture_coord_gen`


  同时，将 `texture_coord_gen` 模块的 `render_out` 锚点连接到 `material_param` 模块的 `render_in`
  锚点。作为最后一个模块，我们添加 `Mesh → solid → mesh_sphere_octahedron`，并将其输出连接到 `mesh_basic_render`
  模块的 `mesh_in` 锚点。参见图 5-23。


  ![A457467_1_En_5_Fig23_HTML.jpg](img/A457467_1_En_5_Fig23_HTML.jpg)


  **图 5-23.** 自动纹理坐标


  要准备这些锚点参数，请将一个 PNG 图像放置在此文件夹中：


  ```

  [HOME]/thmad/[VERSION]/data/resources

  ```


  确保其大小为 128x128 或 256x256，并使其背景透明。通常，让纹理在两个维度上尺寸相同且为 2 的幂次方是个好主意。我打算使用的小青蛙图已经在 `TheArtOfAudioVisualization`
  文件夹中；它名为 `frosch2.png`。锚点参数如表 5-29 至 5-34 所示。


  **表 5-34.** `texture → opengl → texture_coord_gen`


  | | gen_s | `OBJECT_LINEAR` | 注意，OpenGL 中的纹理坐标通常用 S、T 和 R 表示。这不是笔误，奇怪的顺序是由于历史原因造成的。
  |

  | --- | --- | --- | --- |

  | | gen_t | `OBJECT_LINEAR` | |

  | | gen_r | `<any>` | 忽略，因为我们使用的是 2D 纹理。 |


