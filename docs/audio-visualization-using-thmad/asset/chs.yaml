  ### Blobs, Blobs, Blobs


  Blobs 是 ThMAD 的主力军——您可以在任何需要绘制简单图形的地方使用它们。不要被“简单”这个词误导——借助 ThMAD 提供的所有功能，仅使用 blobs
  就能绘制出非常有趣的草图。


  根据参数的不同，blobs 可以是圆形、星形或叶形。技术细节可以在 `Bitmaps → Generators → Blob`（用于生成 blob 位图）和 `Texture
  → Particles → Blob`（用于生成直接发送到图形硬件以加速处理的 blob 纹理）的参考中找到。


  在本节中，我们将描述不同的使用场景。其可能性是无穷无尽的，所以请继续尝试您自己的想法。



  好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。



