  \n基本上，一旦你拥有了一种自动化方法，可以一次性运行大量 ML 算法并比较它们的性能，你就能想到这个工具在实验和生产阶段的一系列实际应用。自动化和模块化自然会导向低代码环境。\n\
  \n在第 12 章中，我们将讨论那些抽象了大量手动数据科学工作、仅需几行代码就能生成结果的低代码库和框架。这类低代码工具背后的主要驱动力之一，就是你在这里所做的这种模块化。实际上，通过利用自定义模块，你将重复实验所需的代码减少到了仅几行。这使得整体代码库更加精简，维护和调试也更为高效。\n\
  \n## 决策边界可视化\n\n对于监督学习领域中的许多分类问题，你可能希望超越数值预测（类别预测或概率预测），而将类别之间的实际决策边界可视化。当然，这特别适用于二分类问题和一对特征的情况：可视化结果将显示在二维平面上。例如，图\
  \ 4-9 展示了来自 scikit-learn 官方文档（`https://scikit-learn.org/stable/modules/svm.html`）中关于支持向量机（SVM）教程的决策边界可视化。\n\
  \n![](img/518852_1_En_4_Fig9_HTML.jpg)\n\n**图 4-9** — 不同核函数的 SVM 的决策边界可视化\n\n现在的问题是，scikit-learn\
  \ 并没有提供一个现成的、可直接使用的方法来完成这种可视化。然而，你可以创建自定义代码来实现这一点，这样当涉及决策边界可视化时，数据科学任务就能更高效。\n\n\
  ### 自定义函数\n\n该函数的完整描述和代码已在随附的 Jupyter 笔记本中提供。代码开头如下：\n\n```\ndef plot_decision_boundaries(X,\
  \ y,\nmodel_class,\n**model_params):\n\"\"\"\n绘制分类模型决策边界的函数。这仅使用数据的前两列来拟合模型，因为我们需要找到散点图中每个点的预测值。\n\
  参数：\nX: 特征数据，Numpy 类型数组。\ny: 标签数据，Numpy 类型数组。\nmodel_class: 一个 Scikit-learn ML 估计器类，\n\
  例如 GaussianNB 或 LogisticRegression\n**model_params: 要传递给 ML 估计器的模型参数\n\"\"\"\n```\n\
  \n注意使用了`**model_params`解包运算符，以便用户能够向函数传递与所讨论模型相关的任意数量和种类的参数。在内部，它通过创建一个二维网格，并绘制与预测类别相对应的彩色等高线区域来工作。\n\
  \n这里的`model_class`表示你调用的、用于实例化 ML 估计器对象的确切 scikit-learn 估计器类。请注意，你不必传递正在使用的具体 ML\
  \ 估计器，只需提供类名即可。此函数将在内部拟合数据并进行预测，以创建合适的决策边界（同时会考虑你传入的模型参数）。\n\n**什么是这个解包运算符？**\n\n\
  你可能在许多函数的 API 文档中见过参数`*args`和`**kwargs`。当你事先不知道参数的确切数量和顺序，必须在运行时动态决定时，它们允许你向函数传递多个参数或关键字参数。这篇文章提供了一个极好的教程。\n\
  \n\n\n### 示例结果\n\n为了进行演示，我们使用一个离婚分类数据集。该数据集包含了填写了个人信息表和离婚预测因子量表的参与者信息。这些数据是在注入了一些噪声之后，对\
  \ UCI 门户网站公开数据（[`https://archive.ics.uci.edu/ml/datasets/Divorce+Predictors+data+set`](https://archive.ics.uci.edu/ml/datasets/Divorce%252BPredictors%252Bdata%252Bset)）的修改版本。共有\
  \ 170 名参与者和 54 个属性（或预测变量），所有属性均为实数值。\n\n您将比较多个机器学习估计器在同一个数据集上的性能：\n\n*   朴素贝叶斯\n\
  *   逻辑回归\n*   K-近邻\n\n由于该数据集的二元类别是容易区分的，如图 4-10 所示，所有机器学习算法的表现几乎一样好。然而，它们各自的决策边界看起来各不相同，而这正是您希望通过此实用函数可视化的内容。\n\
  \n![图 4-10](img/518852_1_En_4_Fig10_HTML.jpg)\n\n图 4-10：离婚数据集的类别可分性\n\n朴素贝叶斯算法得出的决策边界平滑且略微非线性，如图\
  \ 4-11 所示。仅用四行代码即可实现：\n\n![图 4-11](img/518852_1_En_4_Fig11_HTML.jpg)\n\n图 4-11：朴素贝叶斯算法的决策边界\n\
  \n```\nplt.figure()\nplt.title(\"朴素贝叶斯决策边界\",fontsize=16)\nplot_decision_boundaries(X_train,y_train,GaussianNB)\n\
  plt.show()\n```\n\n不出所料，逻辑回归估计器的决策边界被可视化为一条线性分隔线，如图 4-12 所示。\n\n![图 4-12](img/518852_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12：逻辑回归算法的决策边界\n\nK-近邻的决策边界表现为非线性且不光滑，如图 4-13 所示。这是因为 KNN 是一种基于特征超平面上数据分布的局部几何特性（及其相对距离度量）的算法。\n\
  \n![图 4-13](img/518852_1_En_4_Fig13_HTML.jpg)\n\n图 4-13：KNN 算法的决策边界\n\n该函数适用于任何\
  \ scikit-learn 估计器，甚至是神经网络。以下是使用 scikit-learn 的 `MLPClassifier` 估计器得到的决策边界，该估计器模拟了一个具有用户可配置参数的密集连接神经网络（[`https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html`](https://scikit-learn.org/stable/modules/generated/sklearn.neural_network.MLPClassifier.html)）。请注意，在代码中，您传入了隐藏层设置、学习率和优化器（随机梯度下降或\
  \ SGD；[`https://towardsdatascience.com/stochastic-gradient-descent-clearly-explained-53d239905d31`](https://towardsdatascience.com/stochastic-gradient-descent-clearly-explained-53d239905d31)）。由代码生成的决策边界如图\
  \ 4-14 所示。\n\n![图 4-14](img/518852_1_En_4_Fig14_HTML.jpg)\n\n图 4-14：MLP 算法的决策边界与代码\n\
  \n### 参数实验\n\n如前所述，您可以将任何想要的模型参数传递给此实用函数。对于 KNN 分类器，随着邻近数据点数量的增加，决策边界变得更加平滑。使用此实用函数可以轻松地将其可视化，如图\
