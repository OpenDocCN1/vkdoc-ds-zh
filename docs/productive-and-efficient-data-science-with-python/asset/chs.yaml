  \ 的决策边界 – 算法实验\n\n## 其他 Scikit-learn 实用工具与技术\n\nScikit-learn 提供了许多其他工具和实用程序，以提高您的机器学习代码的生产力。对其进行详尽阐述超出了本书的范围。然而，在此我将简要提及一些最有用的工具，您可以在自己的数据科学代码中直接使用它们。\n\
  \n### 超参数搜索工具\n\n在 scikit-learn 中，超参数作为参数传递给估计器类的构造函数。为了实现良好的机器学习模型性能，通常需要仔细地调整这些超参数。然而，如果手动执行或缺乏系统计划，这项任务可能会变得繁重且低效。幸运的是，scikit-learn\
  \ 提供了高效的网格搜索工具，其行为类似于标准机器学习估计器，并允许您仅用几行代码即可运行大量实验（使用不同的超参数）。\n\n一次搜索包含以下内容：\n\n\
  *   一个估计器（一个回归器或分类器，例如 `sklearn.svm.SVC()`）\n*   一个参数空间\n*   一种搜索或采样候选参数的方法\n* \
  \  一个交叉验证方案\n*   一个评分函数\n\n请查阅 scikit-learn 的官方文档，网址是 [`https://scikit-learn.org/stable/modules/grid_search.html`](https://scikit-learn.org/stable/modules/grid_search.html)，以查看各种选项及其用法。为了提高数据科学代码的生产力，它们会非常有用。\n\
  \n### 并行任务运行器\n\n并非所有 scikit-learn 估计器都能原生地利用多核 CPU，但有些确实能够通过后端支持库并行化计算量大的数值运算：\n\
  \n*   使用 `joblib` 库。在这种情况下，可以通过 `n_jobs` 参数来控制线程或进程的数量。\n*   使用 `OpenMP`，用于 C 或\
  \ Python 代码中。\n\n`Joblib` 能够支持多处理和多线程。`joblib` 是选择生成线程还是进程，取决于其使用的后端。您可以在代码中按下述方式做出选择：\n\
  \n```\nfrom joblib import parallel_backend\nwith parallel_backend('threading', n_jobs=2):\n\
  # estimator.fit(X,y)\n```\n\n通常，`joblib` 使用 `loky` 后端。但也有其他更强大的替代方案。例如，Dask 可以通过提供一个替代的\
  \ `joblib` 后端来将 scikit-learn 算法扩展到机器集群上：\n\n```\nfrom dask.distributed import Client\n\
  import joblib\nclient = Client(processes=False) # 创建本地集群\n# 或连接到远程集群\n# client =\
  \ Client(\"scheduler-address:8786\")\nwith joblib.parallel_backend('dask'):\n# Scikit-learn\
  \ 代码\n```\n\n总的来说，这种类型的并行处理非常适合那些本身就支持并行化的机器学习模型（例如，包含多棵树的随机森林或包含多个基估计器的 AdaBoost）。我们将在第\
  \ 11 章讨论基于 Dask 的并行化时，更详细地回顾这一点。\n\n### 开箱即用的可视化方法\n\n机器学习模型输出和性能指标的可视化是一个广泛且复杂的主题。每位数据科学家都有自己选择的数据和模型输出可视化方式及风格。然而，为了高效的数据科学实践，拥有一组开箱即用的例程通常是很有益的，这些例程可以接收一个机器学习模型，并输出标准的可视化结果，例如\
  \ ROC 曲线、学习曲线、精确率-召回率曲线和混淆矩阵。\n\nScikit-learn 提供了一个统一的 API，可以接受估计器对象、测试数据或预测数据，并使用\
  \ Matplotlib 后端绘制出这些可视化结果。这对于快速原型设计和高效的数据科学工作流程非常有用。\n\n更多细节请参见 scikit-learn 可视化\
  \ API 的页面，网址是 [`https://scikit-learn.org/stable/visualizations.html#visualizations`](https://scikit-learn.org/stable/visualizations.html%2523visualizations)。\n\
  \n\n\n### 合成数据生成器\n\n`Scikit-learn` 提供了大量合成数据生成器，可用于快速评估和试验机器学习算法。虽然真实数据集的数据科学问题无法直接受益于这些生成器，但它们常用于衡量各种机器学习算法的相对优势与劣势，并测试不同的编码方法。\n\
  \n关于这些方法的更详细讨论以及合成数据生成的一般优势列表，可以在这篇文章中找到：“合成数据生成——数据科学新手的必备技能”（`https://towardsdatascience.com/synthetic-data-generation-a-must-have-skill-for-new-data-scientists-915896c0c1ae`）。\n\
