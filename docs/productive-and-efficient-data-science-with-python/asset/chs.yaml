- "# 1. 什么是高效且有生产力的数据科学？\n\n本章的目标是向你介绍高效且富有生产力地执行数据科学任务的好处。我还将阐述常规数据科学家日常工作中可能存在的一些潜在陷阱，以强调*高效数据科学*这一要点。\n\
  \n如同生活中任何其他计算（和非计算）任务一样，数据科学 (DS) 和机器学习 (ML) 可以在不同效率和生产力水平下实践。本书特别聚焦于**基于 Python\
  \ 的工具和技术**，旨在帮助数据科学家（无论是初学者还是经验丰富的专业人士）在**典型 DS 技术栈的各个方面实现高度生产力**（例如统计分析、可视化、模型选择、特征工程、代码质量测试、模块化、并行处理，甚至简易的\
  \ Web 应用部署）。\n\n但是，为什么要努力追求数据科学中的效率呢？如果在常规的数据科学流程中不考虑并勤勉地实践这些效率和生产力方面的要点，可能会出现什么问题？\n\
  \n为了理解这些问题，你首先需要审视一个典型的数据科学流程。让我带你走过这段旅程。\n\n\n\n## 典型的数据科学流水线\n\n数据科学是一个广阔且充满活力的领域。在现代商业和技术空间中，数据科学学科已扮演起真正变革性力量的角色。从医疗保健到交通运输，从在线零售到按需音乐，每一种行业和社会经济领域都以各种方式运用着数据科学工具与技术。每天，由复杂的**DataOps\
  \ 架构**所设计的日益复杂的 *数据流流水线* 会处理海量商业和个人数据，这些数据由数据库引擎或机器学习算法进行摄取、处理和分析，最终促成富有洞察力的商业决策或技术突破。\n\
  \n然而，为了说明高效数据科学实践的关键点，让我们以图 1-1 中所示的一个典型数据科学任务流程作为通用示例。你或许在入门数据科学课程中遇到过，或在日常工作中实践过。\n\
  \n![](img/518852_1_En_1_Fig1_HTML.jpg)\n\n图 1-1  \n典型的数据科学流水线，展示了数据摄取、整理、可视化、建模乃至\
  \ MLOps 等多个阶段\n\n你可能猜测，在数据整理或摄取阶段，编写低效代码的可能性很高。但你可能好奇，在机器学习/统计建模阶段会出什么问题呢？毕竟你使用的是像`Scikit-learn`、`Scipy`或`TensorFlow`这些高度优化的\
  \ Python 库中的现成方法和例程。此外，你可能还会想，为什么像质量测试和应用部署这类任务也应该包含在高效的数据科学流水线中。\n\n在下一节，我将通过简单的例子来回答这些问题。\n\
  \n## 数据科学中低效实践的典型示例\n\n图 1-1 中数据科学流水线的某些模块，例如数据整理、可视化、统计建模、机器学习训练和测试，相比其他模块更直接地受到低效编程风格和实践的影响。\n\
  \n让我展示几个简单的例子，并带你了解一些数据科学故事。\n\n### 在 pandas DataFrame 上迭代\n\n作为数据科学家，我们都遇到过这种情况。\n\
  \n我们拿到一个大型的 pandas DataFrame，需要逐行检查各列字段之间的某些关系。这可能是一个逻辑操作，或是对原始数据进行复杂的数学变换。\n\n\
  本质上，这是一个简单的按行迭代 DataFrame 并在每次迭代中执行某些处理的任务。然而，在选择执行这个看似简单任务的最有效方法时，事情可能就没那么简单了。例如，你可以从以下几种方法中选择。\n\
  \n#### 暴力 for 循环\n\n这种朴素方法的代码如下所示：\n\n```\nfor i in range(len(df)):\nif (some condition\
  \ is satisfied):\n df.iloc[i]\n```\n\n本质上，你是在使用通用的`for`循环逐行迭代（`df.iloc[i]`），并逐一处理。逻辑上没有问题，最终你会得到正确的结果。\n\
  \n但这注定是低效的。如果你尝试用这个方法处理一个行数很多（比如约 1,000,000 行，即 100 万行）且包含 10 列的 DataFrame，总迭代时间可能会运行几十秒或更久（即使在快速的机器上）。\n\
  \n现在，你可能会认为能够在几十秒内处理一百万条记录还是可以接受的。但是，随着列数或计算复杂度的增加（或者每次迭代中条件检查的复杂度增加），你会发现这些开销会迅速累积，因此在构建可扩展的数据科学流水线时应尽可能避免这种方法。更重要的是，如果你需要定期（在标准商业/生产环境中）对数百个数据集重复此类迭代任务，那么低效性会随着时间累积。\n\
  \n#### 更好的方法：`df.iterrows()` 和 `df.values()`\n\n根据具体情况，对于这个迭代任务，你可能会选择两种更好的方法。\n\
  \n*   pandas 库有一个专门用于逐行迭代的方法，名为 `iterrows()`，在这种特定情况下使用起来可能很方便。根据 DataFrame 的大小和行操作的复杂度，与`for`循环方法相比，这可以将总执行时间减少约\
  \ 10 倍。\n\n*   pandas 提供了一种返回 DataFrame 的 NumPy 表示的方法，名为 `df.values()`。这可以显著加快处理速度（甚至优于`iterrows()`）。然而，该方法会移除轴标签（列名），因此你必须使用通用的\
  \ NumPy 数组索引（如 0, 1）来处理数据。\n\n### 将大型数据集中的所有内容都绘制成散点图\n\n通常，在数据分析任务开始时，我们倾向于可视化数据集中所有数值特征之间的两两相互关系。这通常是探索性数据分析（EDA；参见\
  \ [`https://en.wikipedia.org/wiki/Exploratory_data_analysis`](https://en.wikipedia.org/wiki/Exploratory_data_analysis)）的必要步骤，并能揭示关于数据集整体模式的重要见解。然而，对于包含数百个特征（列）的大型数据集，这可能会给可视化例程带来极大的压力，导致出图质量差且响应缓慢。\n\
  \n#### 组合爆炸\n\n很容易解释为什么这个看似简单的（两两）散点图任务很快就会变得难以处理。原因是[组合爆炸](https://en.wikipedia.org/wiki/Combinatorial_explosion)（[`https://en.wikipedia.org/wiki/Combinatorial_explosion`](https://en.wikipedia.org/wiki/Combinatorial_explosion)）。本质上，你是在试图绘制所有两两关系的组合，因此你需要绘制的组合数为\
  \ ^n*C*[2]，其中 `n` 是数值特征的数量，`C` 表示组合符号。一些具体例子会有所帮助。\n\n*   ⁴*C*[2] = **6**，因此对于一个数据集的\
  \ 4 个特征进行两两绘图，你需要绘制 6 张图。\n\n*   ⁶*C*[2] = **15**，因此对于一个数据集的 6 个特征进行两两绘图，你需要绘制 15\
  \ 张图。\n\n*   ¹⁰*C*[2] = **45**，因此对于一个数据集的 10 个特征进行两两绘图，你需要绘制 45 张图。\n\n*   ²⁰*C*[2]\
  \ = **190**，因此对于一个数据集的 20 个特征进行两两绘图，你需要绘制 190 张图。\n\n如图 1-2 所示，图的数量增长得相当快！除此之外，如果你有一个大型数据集（包含数百万个样本），那么每张图都需要在屏幕上渲染数百万个数据点。在网页浏览器中为数百张图渲染数百万个点，这在计算上是不可行的。\n\
  \n![](img/518852_1_En_1_Fig2_HTML.jpg)\n\n图 1-2  \n组合爆炸如何即使对于一个中等规模的数据集，也能导致产生大量可能的二维图\n\
  \n#### 为什么我要提及网页浏览器？\n\nJupyter notebook 是数据科学家进行探索性数据分析（以及许多情况下的高级机器学习）最流行的选择。Jupyter\
  \ notebook 系统的核心运行着一个 Web 服务器，它允许你在浏览器窗口中编写代码、Markdown 文本并渲染图表（很多情况下使用 JavaScript\
  \ 代码）。因此，如果你试图渲染数百张包含数百万个数据点的图表，你的浏览器内存可能会不堪重负，甚至崩溃！\n\n\n\n### 重复编写相似的绘图代码\n\n\
  这是数据科学家非常普遍的做法：在分析用的`Jupyter`笔记本中反复复制粘贴相同的绘图代码（例如使用`Matplotlib`或`Seaborn`库）。虽然这本身可能不会增加代码的总运行时间，但这是一个糟糕的软件工程实践，违反了`DRY`原则（[不要重复自己](https://en.wikipedia.org/wiki/Don%27t_repeat_yourself)）。\n\
  \n本质上，当你在多个地方复制粘贴相同的绘图代码时，你就放弃了代码重构（[代码重构](https://en.wikipedia.org/wiki/Code_refactoring)）的机会，从而增加了引入错误的风险，并使代码在长期内难以阅读和维护。\n\
  \n#### 编写一个通用函数\n\n相反，你应该尝试编写一个通用函数，该函数能够生成所需样式和属性的绘图，然后只需向该函数传递变量即可进行绘图。一个伪代码示例如下：\n\
  \n```python\ndef plot_linechart(x):\n\"\"\"\nPlots line chart of given 'x' variable\
  \ from dataframe df\n\"\"\"\n# Extracts the values from the dataframe as Numpy array\n\
  x_array = df[x].values\n# Mean and upper and lower limits calculations\nx_mean =\
  \ x_array.mean()\nx_upper = x_mean+2*x_array.std()\nx_lower = x_mean-2*x_array.std()\n\
  # Data length\ndata_len = len(x_array)\n# Size and title\nplt.figure(figsize=(15,3))\n\
  plt.title(x,fontsize=15)\n# Main plot\nplt.plot(x_array,color='blue',alpha=0.6)\n\
  # Mean, upper limit, lower limit horizontal lines\nplt.hlines(y=x_mean,xmin=0,xmax=data_len,\n\
  linestyle='--',color='k',linewidth=4)\nplt.hlines(y=x_upper,xmin=0,xmax=data_len,\n\
  linestyle='--',color='red',linewidth=2.5)\nplt.hlines(y=x_lower,xmin=0,xmax=data_len,\n\
  linestyle='--',color='red',linewidth=2.5)\n# Show\nplt.show()\n```\n\n这里，工作空间中已经存在一个`pandas`的`DataFrame`对象`df`。这个函数只是将该`DataFrame`中的不同列绘制为折线图，并同时显示均值、上界和下界线。列名作为该函数的唯一参数传递。\n\
  \n这是一个常见场景吗？\n\n这是一个典型的数据分析场景，可能涉及某些制造过程或质量测试数据。你可能有包含大量参数的表格数据集（即包含多个列的`DataFrame`），并且希望并排或叠加绘制多个折线图，以比较性能或研究某种模式。通过首先编写一个经过良好规划的函数，然后不断重构该函数，你可以避免低效且容易出错的代码。\n\
  \n### 不编写测试模块\n\n测试能提升任何软件产品/服务的交付质量、性能和长期盈利能力，适用于各种类型的企业和行业。因此，**数据科学和机器学习也应养成测试每一个重要代码段的习惯**，这应该是不言而喻的。\n\
  \n我们越来越期望各种机器学习服务背后有一个高质量且健壮的软件框架，这些服务能预测最喜欢的餐厅，或在我们迷失在新城市时提供指引。对这些往往看似神奇的服务的信任，只有当我们知道其背后的软件是经过经过验证的、健壮的方法论测试后，才能建立。\n\
  \n在许多情况下，这类新服务的开发速度甚至高于传统软件产品。加快产品开发往往以牺牲质量为代价。一个好的软件测试策略可以帮助抵消这种取舍。\n\n换句话说，**一个健全的测试策略可以在长期内为数据科学任务流程节省大量开发时间**，同时保证最终产品的高质量。在编码和软件工程阶段节省时间本身就是一项富有成效且高效的举措。\n\
  \n## 需要避免的一些陷阱\n\n从前面的章节可以清楚地看到，数据科学家可能会以无数种方式陷入低效数据科学实践的陷阱。几乎不可能穷尽所有这些方式，但这里我将列出一些在进行商业或科学探索的数据科学任务时需要避免的常见陷阱。\n\
  \n### 不要活在无知中。要衡量效率。\n\n*你的代码运行速度或效率如何*？不要依赖猜测。没有可靠的度量标准，你就无法比较多种编码风格或选项，并从中选出最佳方案。简而言之，**没有某种效率的衡量，你甚至永远无法开始改进**。\n\
  \n因此，始终尝试在你的分析代码或测试模块中包含某种计时/速度衡量的代码，以便你能够测试和衡量各种数据科学任务或功能块实际上的效率。我们将在第[2]章中更详细地重新讨论这个主题。\n\
  \n### 不要让代码成为“孤儿”。要对它们进行模块化。\n\n如果你专注于构建模块化且表达力强的数据科学流水线，它将通过提高生产力来回报你。但什么会阻碍你这样做呢？令人惊讶的是，这可能正是我们所有人都已经接受并赞赏其强大和简单性的编程语言：`Python`。\n\
  \n#### Python 驱动的数据科学遗产可能存在问题\n\n我们在数据科学工作中大量使用`Python`。为什么？因为它对机器学习和数据科学社区来说非常棒。它正逐渐成为现代数据驱动分析和人工智能应用中增长最快的主要语言。它还被用于简单的脚本编写、自动化任务、测试假设、创建用于头脑风暴的交互式图表、控制实验室仪器等。\n\
  \n然而，用于软件开发的`Python`和用于脚本编写的`Python`并不完全相同，至少在数据科学领域是这样。**脚本编写（大部分）是为你自己写的代码。软件则是你（和其他队友）为他人编写的代码的集合。**\n\
  \n明智的做法是承认，当（大多数）没有软件工程背景的数据科学家为人工智能/机器学习模型和统计分析编写`Python`程序时，*他们倾向于为自己编写这类代码*。他们只想快速触及隐藏在数据中的模式核心。他们不会深入思考普通用户。他们编写一段代码来生成一张丰富而美观的图表，但不会将其封装成一个函数以便后续使用。他们从标准库中导入大量方法和类，但不会通过继承创建自己的子类并添加方法来扩展功能。\n\
  \n\n\n#### 尽可能拥抱面向对象编程原则\n\n`Functions`、`inheritance`、`methods`、`classes`：它们都是健壮的面向对象编程（OOP；[`www.educative.io/blog/object-oriented-programming`](http://www.educative.io/blog/object-oriented-programming)）的核心，但如果你只想创建一个包含数据分析与图表的\
  \ `Jupyter` 笔记本，它们在一定程度上是可以避免的。\n\n你可以避免使用 OOP 原则的初期痛苦，但这几乎总是会导致你的笔记本代码变得不可复用且不可扩展。简而言之，那段代码只为你自己服务（直到你忘记自己究竟编写了什么逻辑），其他人无法使用。\n\
  \n但可读性（以及由此带来的可复用性）至关重要。这是对你所产出的价值的真正考验。不是为了你自己，而是为了他人。\n\n因此，不要为了进行快速而粗糙的分析而陷入编写零散代码片段的陷阱。尽可能地将你的代码组织到规划良好的函数和模块（`class`\
  \ 和 `subclass`）中。我们将在第 5 章和第 6 章中更详细地讨论这个话题，并提供实际的代码示例。\n\n### 不要被硬件或传统工具所限制\n\n\
  许多数据科学家在面对大规模数据（例如数百 GB 或数 TB）时，会感到有些无助。虽然企业级软件解决方案每天都能常规处理这种数据量，但个人数据科学从业者在处理此类数据集时，仍然可能遇到可扩展性和执行方面的问题。这当然会影响他们的整体生产力。\n\
  \n#### 本地硬件内存限制是一个真实的问题\n\n大多数数据科学任务，尤其是初始的数据摄取、数据整理、探索性分析、统计建模和特征工程，都是在单个数据科学家（或一个团队）的本地硬件上完成的。这是这种工作方式的一个事实。随着\
  \ AutoML 工具的出现以及对“公民数据科学家”的强调，越来越鼓励个人承担数据科学任务，并启动当前每个可想象的业务都急需的分析工作负载。\n\n这具有彻底改变整个领域并将其推向更高高度的巨大潜力。然而，它也伴随着一个警告：在许多情况下，当处理\
  \ TB 级（甚至多 GB 级）规模的数据集时，个人数据科学家可能会撞上本地硬件内存或计算能力的“南墙”。\n\n个人笔记本电脑的内存（`RAM`）最多为 16\
  \ GB 或 32 GB，这限制了可以完整加载到工作内存中的数据集的大小。即使对于一个规模仅为 10 GB 的数据集，当你将整个数据加载到单个 `DataFrame`\
  \ 对象中时，像 `pandas` 这样的传统分析工具也会变得极其缓慢。许多这些广泛使用的 Python 数据科学包根本不支持并行计算。\n\n> **注意**\n\
  > \n> 1 GB（吉字节）约等于 10⁹ 字节或 1,000 MB。1 TB（太字节）等于 1,000 GB 或约 10¹² 字节。1 PB（拍字节）等于\
  \ 1,000 TB 或约 10¹⁵ 字节。据估计，整个美国国会图书馆的馆藏，包括照片、录音和电影，可能需要大约 3,000 TB 的存储空间。\n\n####\
  \ GPU 加速计算并未全面聚焦于数据科学\n\n从计算角度来看，`GPU` 对于使用大数据集进行高级机器学习来说一直是一大福音。然而，它们在深度学习任务上的讨论和实践远多于其他领域。无论深度学习对于\
  \ AI 和 ML 的崛起是多么伟大的成功故事，大多数数据科学和分析工作流仍然很少用到 `GPU`。\n\n因此，一个常见场景是：数据科学家可以访问一台配备 `GPU`\
  \ 的工作站或一个多 `GPU` 云计算实例，但却无法有效地利用这些硬件资源来完成他们想要完成的分析任务（图 1-3）。\n\n![](img/518852_1_En_1_Fig3_HTML.jpg)\n\
  \n**图 1-3** 基于 `GPU` 的加速计算需要成为主流数据分析（即使没有任何深度学习组件）的基本组成部分。\n\n#### 始终探索替代库/框架\n\n\
  因此，从以上讨论可以清楚地看到，为了实践高效且富有成效的数据科学，从业者必须学习：\n\n- 如何使用支持开箱即用的并行计算和多任务处理的库，高效地处理大型复杂数据集（使用传统数据科学工具将会很困难）。\n\
  - 如何充分利用 `GPU` 和多核处理器来执行各种数据科学和分析任务，而不仅仅是专门的深度学习建模。\n\n我们将在第 10 章至第 12 章中详细讨论这些问题的许多方面，并展示一些新兴的（且令人兴奋的）传统工具和框架的替代品。\n\
  \n## 效率与生产力相辅相成\n\n这是关于数据科学或任何技术事业中一个很少被理解和重视的事实：**高效、整洁并避免错误和漏洞，能直接提升职场生活的各个方面的生产力**。虽然其中一些联系很容易发现，但其他联系则不那么明显。因此，在本节中，我将提供一些关于数据科学实践方面实现高效率的关键技术示例。\n\
  \n### 度量效率大有裨益\n\n正如前一节所讨论的，如果你养成了度量代码或函数效率的习惯，你会自动创造一个环境，在这个环境中你可以跟踪这些指标以及你是如何逐步改进的。通过这种方式，你可以在日常任务中变得更有生产力，因为一旦它们出现任何延迟迹象，你就可以通过明确的目标来探查和改进。测量内存和计算占用就是一个突出的例子；我将在第\
  \ 9 章中详细讨论这一点。\n\n这个习惯也有助于在大型企业范围内提高生产力。例如，**只有当你确信你的团队已经彻底衡量了代码执行效率，并确保在面对千兆字节级的实时数据流时代码不会搞垮\
  \ API 端点时**，你才能自信地提交一段由你或你的团队编写的大型 ML 预测代码。\n\n### 测试降低返工几率\n\n在数据科学流水线或 ML 预测框架的开发阶段，计划并编写的单元测试或功能测试模块越多，在部署阶段发现关键错误的几率就越小。虽然对于纯探索性分析而言，测试对开发周期的整体速度影响较小，但任何实际部署的生产力都将取决于是否养成这个习惯。\n\
  \n然而，**传统的软件测试最佳实践可能无法 100% 适用于数据科学和 ML 代码测试，因为它们涉及大量概率性特征或随机化的输入/输出模式**。因此，周密的规划以及对这些系统随机性本质的深刻理解，是构建高性能测试框架的基本要素。这也要求测试工程团队具备一定的数据科学专业知识。\n\
  \n\n\n### 规划机器学习模型开发\n\n`ML 模型`的开发和调优通常以临时方式进行，唯一目标是获得最高精度或类似的模型性能指标。长期生产力提升并不被视为这类实验和模型迭代的主要目标。\n\
  \n然而，对流程进行微小的改变，例如正确记录超参数和指标，或创建系统存储和可视化调优过程的模型迭代例程，可以大大减少重复性工作中的浪费。我在第 4 章中讨论了一些这类最佳实践。\n\
  \n但重要的是，要从整体角度识别完整机器学习平台的生产力，**更强调整个系统的生产力，而非单个模型的开发速度**。加入模型跟踪、记录和可视化代码确实会给单个建模组件带来一些开销，但长期来看，其益处将在系统层面得以体现。这必须得到高层管理者的认可和支持，数据科学团队才能充满信心地执行。\n\
  \n### GUI 编程/Web 应用开发知识非常有帮助\n\n这听起来可能有些反直觉，但学习一点`GUI/API`编程知识，往往能提高数据科学管线的整体生产力。当然，这发生在你利用这些知识将图形用户界面封装在`机器学习模型`或数据分析代码周围，使其能够向广大用户群体展示的时候。\n\
  \n让我用一个具体例子来说明。通常，获得大规模机器学习平台开发批准的关键第一步，是为内部用户或利益相关者（如高层管理人员或销售与市场部门）制作一个可运行的原型。如果受众能以可视化方式看到原型，甚至能亲身体验平台（图\
  \ 1-4），他们就会更好地理解原型的目的和用途。\n\n![](img/518852_1_En_1_Fig4_HTML.jpg)\n\n**图 1-4** 向高层管理人员快速演示可运行的数据科学原型，通常能提升团队的整体生产力\n\
  \n这不仅需要构建机器学习模型和数据分析管线的后端，还需要一个前端应用，以尽可能直观和交互的方式展示内部工作原理。数据科学团队可能不会亲自编写创建这个演示应用的确切代码，但深入了解如何设计这些前端元素和组件并将其集成到后端机器学习平台中，将大大有助于原型的快速开发。减少这个阶段的时间间隔，自动意味着更快的决策时间线，并整体提升团队的上线时间和生产力。`Web/浏览器`类应用是此类任务的天然选择，我在第\
  \ 12 章中讨论了一些能够快速创建网页应用以展示数据科学成果的工具。\n\n## 践行高效数据科学的技能与态度\n\n不言而喻，你必须自觉地努力培养特定的技能和才能，才能步入高效数据科学的领域。数据科学本质上欢迎并接纳来自各种技术背景和专业训练的专业人士。虽然这总体上对这个领域是件好事，但也意味着任何想要打破低效循环的人都必须集中精力培养这些技能。\n\
  \n没有哪本书或课程能涵盖推动数据科学家走向高效数据科学之路所需的全部技能和主题。然而，如果我必须为这样一本理想书籍设想一些具体内容，我希望它能：\n\n- \
  \  教授如何识别标准数据科学代码中的低效和瓶颈，以及如何跳出常规思维来解决这些问题。\n-   教授如何编写模块化、高效的数据分析和机器学习代码，以在诸如探索性数据分析、可视化、深度学习等各种情境下提高生产力。\n\
  -   涵盖一系列辅助主题，如软件测试、模块开发、GUI 编程以及将机器学习模型部署为 Web 应用，这些对于初露头角的数据科学家来说是宝贵的技能集。\n- \
  \  教授如何快速构建用于演示数据科学/机器学习想法或模型调优的 GUI 应用，或者如何轻松（且快速）地将机器学习模型和数据分析代码部署到 Web 应用端点。\n\
  -   通过动手示例介绍并行计算、外核（大于系统内存）可扩展性以及基于 GPU 的数据科学技术栈。\n-   向读者展示并引导其进入更广阔且不断扩展的 Python\
  \ 数据科学工具生态系统，这些工具与软件工程和生产级部署的更广泛方面相关联。\n-   最重要的是，**灌输并强化对自身数据科学管线效率的探究意识**，以便从业者能够持续研究和开发自己的方法及最佳实践，来审视他们正在使用的代码和系统。\n\
  \n## 总结\n\n在这章引言中，我涵盖了很多内容，让你对高效数据科学的新兴概念有了相当详细的了解。我讨论了从技术角度看这意味着什么，以及它如何对整个组织有所帮助。我指出，低效可能渗透到典型数据科学管线的任何阶段：数据摄取、数据整理、可视化、`EDA`（探索性数据分析）、`机器学习`建模，甚至是演示阶段。\n\
  \n我深入探讨了在典型数据科学任务中频繁出现的一些具体例子，例如对大型数据集进行迭代或对复杂数据集进行可视化实践。特别是，我讨论了在从事`数据科学`任务时，采用良好的`OOP`（面向对象编程）原则并培养测试工程师的心态。\n\
  \n我描述了在这些方面需要避免的常见陷阱。我特别强调，在处理大型 TB 级数据集时，不要将自己局限于本地硬件或传统工具。我还讨论了`GPU`加速计算，这一领域在深度学习之外并未受到太多关注。我也提及了并行计算的概念，这些将在本书后续章节中更详细地探讨。\n\
  \n接着，我通过具体例子展示了在典型的数据科学任务或平台中，生产力和效率是如何相辅相成的。在这方面，我讨论了将`图形用户界面/应用`开发作为加速决策过程的工具加以运用。\n\
  \n最后，我讨论了为了养成高效数据科学的习惯而需要培养的理想技能和才能。你将在后续章节中通过动手示例来探索这些想法。\n\n\n\n"
- "# 2. 高效数据科学的更佳编程原则\n\n本章旨在向你介绍某些编程风格和习惯的概念，这些风格和习惯在开发高效的数据科学（DS）与机器学习（ML）系统及管道中起着至关重要的作用。我将通过简要示例（或在适用处使用伪代码）来阐述这些概念，并讨论如何衡量或追踪低效问题。\n\
  \n首先，我将介绍编程和算法中时间与空间复杂度（`https://levelup.gitconnected.com/time-and-space-complexity-725dcba31902`）的概念。你还会看到在此背景下使用的[大\
  \ O 表示法](https://en.wikipedia.org/wiki/Big_O_notation)（`https://en.wikipedia.org/wiki/Big_O_notation`）。这些是分析任何算法运行时或效率的基础概念，例如可用于衡量和描述标准\
  \ ML 算法的效率。我还将简要讨论为何复杂度度量对数据科学任务尤为重要。\n\n接着，我将演示常见、低效的数据科学和 ML 编码实践的实际示例。这绝非旨在详尽列举每一种低效的数据科学编程方式。不过，我会尽力让你一窥典型的低效代码片段，这些代码要么扩展性不佳，要么导致整体系统设计的某些方面变得低效。希望你能将这些示例内化，并将相同的思考过程应用于自己的分析工作，从而提高生产力。\n\
  \n在大多数情况下，我还会展示一些可行的替代示例，例如如何通过采用更佳的编程风格或在 Python 生态系统内选择不同的工具或函数，来改进同一任务的效率。\n\n\
  最后，我将介绍用于测量代码或功能块执行时间的工具和技术。在这方面，我会涵盖通用的 Python 模块和 Jupyter 魔术命令。\n\n## 时间与空间复杂度及大\
  \ O 表示法的概念\n\n算法的时间与空间复杂度，通常与给定输入下该算法的最坏情况执行时间及所需内存/存储空间相关。由于时间和空间几乎总是取决于输入规模（例如数组中的元素数量），这些复杂度度量被表示为输入规模的函数，因此对于包含`n`个元素的数组，用`f(n)`或`g(n)`表示，其中`f`或`g`分别代表时间复杂度和空间复杂度。\n\
  \n### 一个简单示例：搜索元素\n\n让我们用一个简单例子来演示。考虑以下在列表中搜索给定元素的 Python 程序。注意，你本可以用更符合*Python\
  \ 风格*的方式编写代码，如`if ele in lst`，但为了演示目的，我们使用朴素的列表遍历代码：\n\n```python\ndef ele_in_lst(ele,lst):\n\
  \    len_lst = len(lst)\n    for i in range(len_lst):\n        if lst[i] == ele:\n\
  \            return True\n    return False\n```\n\n如果你用以下输入测试此函数，会得到 `True`：\n\n\
  ```python\nele_in_lst(ele=2,lst=[3,4,5,2,9])\n>> True\n```\n\n但如果你用以下输入测试，则会得到 `False`：\n\
  \n```python\nele_in_lst(ele=2,lst=[3,4,5,5,9,11,3,4,-1,3,5,7,12,15])\n>> False\n\
  ```\n\n在上述第二个例子中，循环被完整遍历了，因此 `if lst[i] == ele` 的相等性检查操作执行了 14 次（即列表的长度）。这是程序的核心操作，由\
  \ CPU 执行，并构成代码时间复杂度的一部分。\n\n那么，这种搜索方法的时间复杂度是多少？显然，**在最坏情况下**，即当`ele`不在给定的`lst`中时，**所花费的时间总是与`lst`的长度成正比**（假设每次相等性操作耗费恒定时间）。这由函数\
  \ `O(n)` 表示，其中 `n` 表示输入数组中的元素数量。\n\n### 大 O 表示法\n\n函数 `O(n)` 中的这个 `O` 符号被称为大 O 表示法。根据维基百科的说法，“*它描述了当参数趋向于特定值或无穷大时，函数的极限行为*”（`https://en.wikipedia.org/wiki/Big_O_notation`）。具体来说，这是这种情况下最坏情况时间复杂度的一个例子（因为元素不在给定列表中），但在极限情况下，这正是每位计算机程序员应该关注的。\n\
  \n有人可能会好奇，为什么我们不计算*平均情况*的时间复杂度。事实证明，在大多数情况下，计算甚至估算平均情况的样子相当困难，而最坏情况则通常能以更简单的方式定义和理解。此外，`O(n)`\
  \ 表示法是在渐近意义上理解的，因此当 `n` 变大时，最坏情况所需时间不会偏离这种线性趋势。\n\n为什么是*线性*趋势？因为 `O(n)` 表示 `n` 的一次幂。类似地，我们有复杂度为\
  \ `O(n²)` 或 `O(n³)` 的算法，它们呈现二次或三次趋势。换句话说，所花费的时间将像问题规模`n`的二次或三次函数那样增长。\n\n这种大 O 表示法的起源深深植根于更高级的数学领域——[解析数论](https://en.wikipedia.org/wiki/Analytic_number_theory)（`https://en.wikipedia.org/wiki/Analytic_number_theory`），并且在许多数学定理的讨论中也会出现。但在计算机科学和编程的语境下，这是表示给定算法时间/空间复杂度的标准符号。\n\
  \n### 复杂度：线性、对数、二次及其他\n\n那么，如果这是 `O(n)`，搜索能否做得更好？是的，事实证明，如果列表预先排序，搜索可以快到 `O(log2(n))`。在这种情况下使用的特定算法称为*二分搜索*。而你大概能猜到，我们上面编写的朴素算法被称为*线性搜索*。\n\
  \n\n\n#### 速度能快多少？\n\n那么，`O(log2(n))` 到底比 `O(n)` 快多少呢？我们可以通过绘制函数 `f(n) = n` 和 `g(n)\
  \ = log2(n)` 随着数值 `n` 增大的曲线来找到答案。为了更清晰地说明，请参见图 2-1。图中包含两条曲线：一条是这两个函数的直接对比，另一条是对数函数乘以一个较大的常数（如\
  \ 25）后的结果。\n\n![](img/518852_1_En_2_Fig1_HTML.jpg)\n\n图 2-1\n\n对数时间复杂度和线性时间复杂度算法的函数值增长对比。在\
  \ (a) 中，两者的常数乘数均为 1。在 (b) 中，对数算法的乘数为 25\n\n图 2-1 中的第二种情况代表什么？它表示我们正在使用一个 `O(log2(n))`\
  \ 算法，但每次单位计算有较大的开销，即基本计算单元的速度远慢于 `O(n)` 线性算法中对应的单元操作。\n\n从图 2-1 中可以非常清楚地看出，无论常数乘数是多少（1\
  \ 或 25），随着 `n` 的增长，`O(log2(n))` 算法变得比 `O(n)` 算法快得多，因此代表算法运行时间的函数值随 `n` 增长得慢得多。因此，对于相同的任务，**我们应当始终使用对数复杂度算法来替代线性复杂度算法（如果我们能找到这样的算法的话）**。\n\
  \n对于搜索示例，这需要对列表进行预排序，而这本身具有其算法复杂度（参见 [`www.geeksforgeeks.org/time-complexities-of-all-sorting-algorithms`](http://www.geeksforgeeks.org/time-complexities-of-all-sorting-algorithms)\
  \ 上的排序算法复杂度）。但这一步通常是值得的，因为在典型的应用场景中，*你可能对列表进行排序的频率远低于对其执行搜索的频率*。\n\n#### 比线性更复杂的是什么？\n\
  \n尽管线性时间复杂度相比对数时间看起来更差，但实际上，在我们通常遇到的一般计算算法（无论是数据科学领域还是非数据科学领域）中，它已经是一种相当高效的算法了。可以想见，`n`\
  \ 的高次幂复杂度非常常见，并相应地表示为：\n\n- `O(n²)` 表示二次时间复杂度\n- `O(n³)` 表示三次时间复杂度\n- `O(2^n)` 表示指数时间复杂度（没错，这些可怕的东西确实存在！）\n\
  \n让我快速展示一下 `O(n²)` 和 `O(n³)` 算法的简单（且初级）示例。下面是一个简单的算法，它遍历给定的 NumPy 数组的维度，并统计大于零的元素个数（如果你对数据科学感兴趣，想必你一定了解\
  \ [`https://numpy.org/doc/stable/user/whatisnumpy.html`](https://numpy.org/doc/stable/user/whatisnumpy.html)\
  \ 上的 [NumPy 库和数组](https://numpy.org/doc/stable/user/whatisnumpy.html)，对吧？）：\n\n\
  ```\nimport numpy as np\narray_2D = np.random.normal(size=(5,5))\ndef count_positives(array):\n\
  \"\"\"\n统计二维随机数组中的正数个数\n\"\"\"\nm,n = array.shape\ncount = 0\nfor i in range(m):\n\
  for j in range(n):\nif array[i][j] > 0.0:\ncount+=1\nreturn count\n```\n\n核心计算单元（`if\
  \ array[i][j] > 0.0`）执行了多少次？显然，对于这个维度为 (5, 5) 的二维数组，它执行了 5 x 5 = 25 次。如果我们将数组维度改为\
  \ (100, 100)，那么该计算将执行 100 x 100 = 10,000 次！\n\n因此，这里的时间复杂度是 `O(m×n)`，其中 (`m`, `n`)\
  \ 是二维数组的维度。对于正方形数组，它大致等于我们熟悉的 `O(n²)`。\n\n## 为什么复杂度对数据科学很重要\n\n所有这些关于算法复杂度的讨论可能会让你思考，如何将这方面的知识应用于数据科学工作中，尤其是高效的数据科学实践。为了回答这个问题，首先你需要了解一些在数据科学任务中可能具有高算法复杂度的常见示例。我在上一节中介绍了线性、对数和二次复杂度。接下来，让我展示两个更糟的复杂度示例，它们出现在数据科学任务中。\n\
  \n### 图像数据：三次复杂度算法\n\n作为 `O(n²)` 案例中代码示例的自然延伸，如果我们将循环次数增加到 3 次（例如三维数组），那么时间复杂度就变成了\
  \ `O(n³)`。三维数组的一个典型示例（尤其是在数据科学领域）是图像数据：其中二维数组表示像素的坐标，每个像素中还有另一个数字表示颜色深度（`https://en.wikipedia.org/wiki/Color_depth`）或灰度值（示例见图\
  \ 2-2）。\n\n由于作为数据科学家，你可能需要频繁处理图像数据，因此遇到 `O(n³)` 算法的可能性很高。实际上，每个像素上的计算任务可能更复杂，因为它可能是一个包含多个颜色值（例如\
  \ RGB）的向量，而不仅仅是单个浮点数。\n\n![](img/518852_1_En_2_Fig2_HTML.jpg)\n\n图 2-2\n\n颜色深度和灰度图像示例（来源：维基共享资源，GNU\
  \ 自由文档许可证）\n\n\n\n### 最佳回归模型：指数级复杂度\n\n那令人望而生畏的 `O(2^n)` 复杂度呢？在日常数据科学工作中真的会遇到吗？是的，事实证明，这方面也有一个简单的数据科学实例。\n\
  \n考虑这样一个任务：为一个具有众多特征的大型数据集确定最佳线性回归模型。并非所有特征都同等重要或具有影响力。对于大多数实际情况，只有特定的特征子集是最优的。确定这个最优子集听起来是一项常见的数据科学任务。\n\
  \n我们知道，向模型中添加更多特征会提高简单的 *R*² 系数，但当我们考虑诸如调整后`R²`（详见 `www.statisticshowto.com/probability-and-statistics/statistics-definitions/adjusted-r2/`\
  \ ）或 AIC 准则（详见 `https://en.wikipedia.org/wiki/Akaike_information_criterion`）这类高级指标时，就需要对多种特征组合进行试验，以找出最佳组合。简而言之，我们需要搜索所有可能的特征组合空间，为每种组合构建回归模型，计算所需的性能指标，最后选出最优的那个（例如，性能指标最高的那个组合）。\n\
  \n用更数学化的语言来说，这相当于在给定集合的所有子集中找出最佳子集。这是一个计算上难度呈指数级增长的问题。也就是说，其算法复杂度为 `O(2^n)`。而且，这还仅仅是构建特征空间所有子集的工作量，尚未考虑为每种组合构建实际回归模型的计算成本。\n\
  \n为什么？原因在于下面这个我们可能在高中学过的简单等式。基本上，从 *n* 个可能的项目中选取 1、2、3……*n* 个的所有组合的总和为 `2^n`。在我们的回归问题中，我们是一次选取\
  \ 1 个、2 个、3 个或更多特征来构建模型。\n\n```\n∑(C^n_1 + C^n_2 + ... + C^n_n) = 2^n\n```\n\n正因如此，在回归模型优化中几乎从不鼓励使用穷举搜索法。取而代之的是，我们采用贪婪搜索法（详见\
  \ `https://en.wikipedia.org/wiki/Greedy_algorithm`），例如前向选择和后向选择算法（详见 `https://quantifyinghealth.com/stepwise-selection/`），这些方法能显著缩短搜索时间，同时在几乎所有实际情况下都能找到相当不错的解决方案。\n\
  \n### 相对增长速度对比\n\n为了说明具有不同复杂度阶数的算法所带来的优势（或劣势），我们可以绘制如图 2-3 所示的简单图表。很明显，对数时间算法增长最慢，其次是线性时间算法。更高次幂的算法增长很快，而指数型算法则像弹道导弹一样飞速上升！\n\
  \n图 2-3：不同时间复杂度算法的相对增长速度（未按比例绘制）\n\n同样值得注意的是，由于这些复杂度度量和大*O*表示法本质上是在渐近意义上定义的（即针对\
  \ ***n*** 值很大的极限情况），因此我们确实需要将它们视为属于完全不同的计算难度类别。这意味着，无论一个特定算法可以化简为什么具体的复杂度函数，如果它是三次的，那么从长远来看，它总是比线性或二次算法更差。\n\
  \n最快速的判断方法是查看算法的最高阶并确定其等级。指数级总是比多项式级差，多项式级总是比线性级差。以下是一些快速示例：\n\n-   复杂度为 `O(200n\
  \ + 3)` 的算法优于复杂度为 `O(0.1n² + 12)` 的算法。\n-   复杂度为 `O(3n³ + 2n + 5)` 的算法比复杂度为 `O(100n²\
  \ + 12)` 的算法差。\n-   复杂度为 `O(4^(0.1n))` 的算法比复杂度为 `O(100n¹⁰⁰)` 的算法差。\n\n上面列表中的最后一条一定让你感到惊讶！建议你尝试计算这两个函数，从较小的\
  \ `n` 值开始直到较大的值，并将它们叠加画图，以理解第一个函数如何在较大的 `n` 值下超越第二个函数。因此，从渐近意义上来判断，你仍然应该优先选择多项式阶算法（即使包含\
  \ `n¹⁰⁰` 这样的项），而不是指数阶算法（`4^(0.1n)`）。\n\n\n\n### 人工智能难以攻克，却行之有效\n\n> *深度学习网络*已经过训练，能够以高性能水平识别语音、为照片添加说明以及在语言之间进行文本翻译。尽管深度学习网络在现实世界问题中的应用已变得无处不在，但我们对它们为何如此有效仍缺乏理解。***根据统计学和非凸优化理论中的样本复杂度，这些实证结果本不可能实现。***\n\
  >\n> *特伦斯·J·塞诺夫斯基（*[*www.salk.edu/scientist/terrence-sejnowski/*](http://www.salk.edu/scientist/terrence-sejnowski/)*）*，*《人工智能中深度学习的惊人有效性》*\
  \ *（*[*www.pnas.org/doi/10.1073/pnas.1907373117*](http://www.pnas.org/doi/10.1073/pnas.1907373117)*），《美国国家科学院院刊》，2020\
  \ 年 12 月*\n\n从简单的搜索和排序算法跃升到深度学习中所使用的梯度下降和反向传播（[`https://blog.paperspace.com/intro-to-optimization-in-deep-learning-gradient-descent/`](https://blog.paperspace.com/intro-to-optimization-in-deep-learning-gradient-descent/)）的世界，是一个巨大的跨越，但为了阐明人工智能算法虽难以攻克却仍可管理这一观点，这一步是必要的。\n\
  \n那么，什么是**难解性**？这本身就是一个全新的主题，超出了本书的范围，尽管它与前面小节讨论的算法复杂度主题密切相关。简单来说，**难解问题是指那些无法找到有效算法（来求解它们）的计算问题**。在这里，术语*高效*在大多数情况下指的是多项式时间算法，即复杂度最多为\
  \ `O(n^k)` 的算法，而非 `O(2^n)` 或 `O(n!)` 这类算法。\n\n不幸的是，在人工智能领域，大多数常见问题在理论上都可被证明是难解的。特别是，对于人工智能问题，其最优化解决方案需要某种搜索本质上是指数级的空间算法，例如决策树中所有可能树（及分支）的数量，或简单多元回归中所有可能模型的数量。由于这些传统的机器学习任务属于难解范畴，深度学习网络同样受困于相同的计算难题也就不足为奇了。\n\
  \n然而，尽管存在理论上的不可能性（即找到最佳可行解），但常见的机器学习算法和解决方案通过运用诸如贪心搜索（[`www.programiz.com/dsa/greedy-algorithm`](http://www.programiz.com/dsa/greedy-algorithm)）、启发式方法（[`https://en.wikipedia.org/wiki/Heuristic_(computer_science)`](https://en.wikipedia.org/wiki/Heuristic_%2528computer_science%2529)）、动态规划（[`www.programiz.com/dsa/dynamic-programming`](http://www.programiz.com/dsa/dynamic-programming)）、随机化算法（[`https://en.wikipedia.org/wiki/Randomized_algorithm`](https://en.wikipedia.org/wiki/Randomized_algorithm)）等巧妙技术，在几乎所有实际情况下都能奏效。具体而言，**这些实用技术并非寻求绝对最佳解，而是寻找一个能够利用合理计算资源高效找到的“足够好”的解**。它们还大量利用领域知识和归纳偏置来缩减潜在解的搜索空间。\n\
  \n启发式搜索技术常被称为*知情搜索*，因为它们倾向于利用关于问题及环境（人工智能体可能所处的环境）的额外信息。想象一下，你身处异国他乡，无法使用谷歌地图！作为抵达最终目的地的旅程第一步，你可以从当前位置驾车前往几个城市。你可能不知道这些城市的确切驾驶距离，但你也许从朋友那里听说，她乘坐火车到城市\
  \ *A* 所花的时间比到城市 *B* 要少。这就是关于环境的*额外信息*，虽然它不能保证实际驾车到城市 *A* 的距离一定小于到城市 *B* 的距离，但这种情况很有可能为真。这被称为*启发式信息*，你可以用它来决定旅途中要采取的优化路径。大量的人工智能算法都使用这种技术来实现高效搜索。\n\
  \n因此，总结一下，前面关于计算复杂度和大*O*记法的小节，其目的是介绍常见算法的效率概念，并说明确实存在不同类别的算法，它们在输入规模增长时表现迥异。这样做是为了在你的脑海中培养一种探究意识，去检查你的代码和实现中的弱点，即使你不需要为某个特定的解严格分析并数学推导出精确的大*O*函数。此外，这也是为了让你确信，**即便面对看似难解的大数据问题，也存在巧妙的解决方案技术**，你应该抓住每次机会去探索它们。\n\
  \n## 数据科学中的低效编程\n\n数据科学代码可能以无数种方式受到低效实践和设计模式的困扰。造成这种情况的主要原因之一是，数据科学家通常来自不同的背景（例如物理学、生物学、经济学、统计学、电气工程等），而且他们并非总是遵循成熟完善的软件工程设计模式（[`https://en.wikipedia.org/wiki/Software_design_pattern`](https://en.wikipedia.org/wiki/Software_design_pattern)）。数据科学训练营、研讨会和在线课程（通常是许多崭露头角的数据科学家接受培训的地方）会教授涵盖\
  \ Python 编程、统计学和机器学习的大量主题，但未必会教授这些高效编程技术。\n\n然而，需要在一开始就指出，本书并非一本关于数据科学软件工程的人门读物。具体而言，本章的目标是展示数据科学任务中一些最明显且广泛重复的低效编程模式，以便你能识别并从这些示例中学习。这正是我接下来几个小节要做的事情。此外，为了确保效果，我也会展示应该更高效的变通方法和替代方案。\n\
  \n### 典型示例\n\n在本节中，我将展示一些在常规数据科学工作流中频繁出现的*低效编程模式*。我采用的方法偏重实用和动手操作，而非教学灌输。这意味着我不会采用严格的数学方法来计算和证明各种函数及代码片段的算法复杂度。相反，我鼓励你使用各种工具测量代码片段的执行时间，并自行探索可能的改进策略。关于如何改进这些代码片段，并没有唯一正确的答案。\n\
  \n需要指出的是，**本小节我讨论的并非像 `NumPy` 或 `pandas` 这样的特定库**。事实上，我将在下一章讨论使用这些库的高效最佳实践。这里，我展示的是基本的\
  \ Python 编码模式示例，你可以在许多场景（数据科学及其他领域）中加以利用。\n\n给读者的一条说明：我打算让代码片段保持简洁，因此不会让它们自包含且详尽无遗。这意味着这些代码片段并非设计为可独立运行。随附的笔记将提供完整的可运行代码。\n\
  \n\n\n"
- '# 使用过滤器代替 `for` 循环


  关于避免使用 `for` 循环来完成那些可以用其他数学逻辑形式简化的简单重复性任务，已有无数文章进行过讨论。诚然，对于许多复杂的逻辑和迭代场景，你无法回避 `for`
  循环。然而，在很多情况下，你可以使用替代方法，并且你应该时刻留意它们。Python 提供了一些内建方法，可用于数据过滤等特定场景。


  考虑以下包含三个函数定义的代码块：


  ```

  ONE_MILLION = list(range(int(1e6)))

  def for_loop():

  result = []

  for ele in ONE_MILLION:

  if not ele % 3:

  result.append(ele)

  return result

  def list_comprehension():

  return [num for num in ONE_MILLION if not num % 3]

  def filter_fn():

  return filter(lambda x: not x % 3, ONE_MILLION)

  ```


  第一个函数包含一个标准的 `for` 循环和列表追加操作。第二个函数更为简洁，使用了 Python 的列表推导式（[`https://realpython.com/list-comprehension-python/`](https://realpython.com/list-comprehension-python/)）。最后，第三个函数使用内建的
  `filter` 函数和 lambda 表达式（[`https://realpython.com/python-lambda/`](https://realpython.com/python-lambda/)）来实现相同的目标。


  让我们使用 Jupyter Notebook 的内建魔法命令（[`https://stackoverflow.com/questions/29280470/what-is-timeit-in-python`](https://stackoverflow.com/questions/29280470/what-is-timeit-in-python)）`%%timeit`
  来测量执行速度。


  对于 `for_loop` 函数：


  ```

  %%timeit -r20 -n5

  for_loop()

  >> 56.6 ms ± 3.03 ms per loop (mean ± std. dev. of 20 runs, 5 loops each)

  ```


  对于 `list_comprehension` 函数：


  ```

  %%timeit -r20 -n5

  list_comprehension()

  >> 44.2 ms ± 2.21 ms per loop (mean ± std. dev. of 20 runs, 5 loops each)

  ```


  对于 `filter_fn` 函数：


  ```

  %%timeit -r20 -n5

  filter_fn()

  >> 440 ns ± 93.6 ns per loop (mean ± std. dev. of 20 runs, 5 loops each)

  ```


  列表推导式的速度比普通 `for` 循环略快，而基于过滤器的方法则快得多。显然，对于这种情况——你本质上是在进行数据过滤（通过遍历列表，并根据每个元素是否满足特定条件来创建一个新列表）——你应该尽可能尝试使用
  `filter` 函数。


  关于本书中穿插的这些示例，有一点需要牢记：计时测量的精确数值结果会因机器不同而有巨大差异，甚至同台机器上的不同次执行结果也会不同。性能基准测试是一个棘手的话题，很难实现标准化。根据你所使用的硬件和本地软件设置，你可能会得到完全不同的结果。尽管如此，（在大多数情况下）示例呈现的整体趋势将是显而易见的。


