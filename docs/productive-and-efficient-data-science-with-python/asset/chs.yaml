  Calculation with 7 columns took 4.11 ms

  Calculation with 8 columns took 4.606 ms

  Calculation with 9 columns took 4.99 ms

  Calculation with 10 columns took 5.478 ms

  ```


  ### Dask 集成、用户自定义函数及其他特性


  `CuDF` 可以与 `Dask` 集群良好配合，利用多 GPU 的能力进行大规模并行数据处理。它还原生支持在选定的轴或列上应用复杂的用户自定义函数（简称 UDF）。这些函数逐块工作（针对
  GPU 内存中数据的内部表示），并且比基于 CPU 的 `pandas` 工作流表现出更快的计算速度。为简洁起见，我不会涵盖所有这些特性，但鼓励您查看 RAPIDS
  门户网站上提供的优秀教程：[`https://docs.rapids.ai/api/cudf/stable/user_guide/10min.html`](https://docs.rapids.ai/api/cudf/stable/user_guide/10min.html)。


  ## CuML vs. scikit-learn


  在介绍了 `CuPy` 和 `CuDF` 的基本用法，并展示了与 `NumPy` 和 `pandas` 的对比基准测试之后，接下来进入数据科学流程的下一阶段，讨论
  `scikit-learn` 的 GPU 加速等价物：`CuML`。


  由于传统上 GPU 硬件的大多数常规用途都集中在机器学习领域，因此有必要澄清本次对比讨论的内容。这里，我们只关注机器学习世界中非深度学习的方面（即数据科学家会应用源自
  `scikit-learn` API 的现成算法的情况）。关键在于，在这种情况下，如果数据科学家能够使用基于 GPU 的系统，他们可以在不花费任何时间或精力修改代码或学习
  GPU 编程的情况下，显著提升计算性能。这些情况下，不需要 `TensorFlow`，但必须充分利用 GPU 的能力。


  ### 使用随机森林进行分类


  在此练习中，您将使用 `scikit-learn` 的 `RandomForestClassifier` 在合成数据集上进行训练，并将其性能与速度与 `CuML`
  API 中类似的分类器进行比较。首先，创建一些包含 10,000 个样本和 20 个特征的合成数据：


  ```

  NUM_ROWS = 10000

  NUM_FEATURES = 20

  from sklearn.datasets import make_classification

  X,y = make_classification(n_samples=NUM_ROWS,

  n_classes=2,

  n_features=NUM_FEATURES,

  n_informative=NUM_FEATURES,

  n_redundant=0,

  n_repeated=0)

  ```


  您已经从各自 API 中导入了必要的函数和类。然而，对于此类对比研究，需要注意命名问题，因为 `scikit-learn` 和 `CuML` 的类和函数名称在很大程度上是相同的。因此，您可以在导入时创建自己的版本：


  ```

  from sklearn.model_selection import train_test_split as sk_tts

  from cuml.model_selection import train_test_split as cuml_tts

  from sklearn.ensemble import RandomForestClassifier as SKRF

  from cuml.ensemble import RandomForestClassifier as CURF

  ```


  请注意，您不仅导入了分类器，还从 `CuML` 导入了训练/测试拆分工具。通常的做法是，当您利用 GPU 的能力时，应尽可能使用 `CuML` 提供的每一个 API
  功能。


  为了进行恰当的对比和数据保护，您构建了两个独立的函数，一个使用 `scikit-learn` 流程，另一个使用 `CuML` API。以下是 `scikit-learn`
  版本：


  ```

  def sklearn_pipeline(X,y,n_estimators=100):

  """

  Executes Sklearn-based pipeline

  """

  t1 =time.time()

  X_train, X_test, y_train, y_test = sk_tts(X,y, test_size=0.3)

  model = SKRF(n_estimators=n_estimators)

  model.fit(X_train,y_train)

  t2 =time.time()

  del_t = round(1000*(t2-t1),3)

  score = round(model.score(X_test,y_test),3)

  return (score, del_t)

  ```


  以下代码是 `CuML` 版本。注意，为了与某些 GPU 计算兼容，数据类型被更改为 `np.float32`（即 `CuML` 使用 32 位浮点精度）。同时，`CuML`
  API 仅适用于 `CuPy` 数组，这就是需要进行 NumPy 到 `CuPy` 转换的原因。尽管如此，您测量的是整个流程所花费的总时间，而不仅仅是训练/拟合部分。该函数返回一个元组，包含（在测试集上的）分类分数和执行时间。


  ```

  def cuml_pipeline(X,y,n_estimators=100):

  """

  Executes CuML-based pipeline

  """

  t1 =time.time()

  X = cupy.array(X,dtype=np.float32)

  y = cupy.array(y,dtype=np.float32)

  X_train, X_test, y_train, y_test = cuml_tts(X,y, test_size=0.3)

  model = CURF(n_estimators=n_estimators)

  model.fit(X_train,y_train)

  t2 =time.time()

  del_t = round(1000*(t2-t1),3)

  score = round(model.score(X_test,y_test),3)

  return (score, del_t)

  ```


  然后，您只需连续运行这些流程。对于 `scikit-learn` 的情况，结果如下：


  ```

  score_sk, t_sk = sklearn_pipeline(X,y)

  print("Sklearn pipeline score: ",score_sk)

  print("Sklearn pipeline time (ms): ",t_sk)

  >>

  Sklearn pipeline score:  0.937

  Sklearn pipeline time (ms):  2132.17

  ```


  对于 `CuML` 流程，结果如下：


  ```

  score_cuml, t_cuml = cuml_pipeline(X,y)

  print("CuML pipeline score: ",score_cuml)

  print("CuML pipeline time (ms): ",t_cuml)

  >>

  CuML pipeline score:  0.936

  CuML pipeline time (ms):  100.471

  ```


  您可以观察到，对于相同的数据输入，`CuML` 流程实现了巨大的速度提升。两个流程的准确率得分几乎相同，`CuML` 的得分在第三位小数上存在差异，这可能是由于
  32 位浮点精度转换造成的。但速度的提升远远弥补了这一微小的精度变化。




  在运行代码（或关联的 Jupyter notebook）时，首次运行可能会得到一个结果显示 scikit-learn 管道比 CuML 管道更快。这与 GPU
  内存如何随代码和数据预取及缓存有关，并且仅发生在第一次运行时。这种情况应予忽略。若再次运行代码，您应得到与此处所示结果相同的趋势。


  进一步扩展，让我们研究当使用 CuML 时，模型复杂度是否会影响其相对于 scikit-learn 的性能提升。将相同的数据拟合到复杂度递增（即，根估计器/树的数量增加）的随机森林模型中。图
  11-14 所示结果清晰地表明：**随着模型复杂度的增长，CuML 及其并行化（GPU 驱动）操作能够显著帮助如随机森林这样的集成分类器**。虽然两个分类器的计算时间都在增加，但与
  scikit-learn 相比，CuML 的增长速度极小。准确率得分存在一些微小差异，但计算效率方面的收益更为显著。


  ![](img/518852_1_En_11_Fig14_HTML.png)


  **图 11-14：** 使用 scikit-learn 和 CuML 的不同复杂度随机森林分类器


  ### K-Means 聚类


  接下来，考虑一个使用广为人知的 k-means 算法的无监督聚类学习问题。在这里，您再次将 CuML 函数与 Scikit-learn 包中的等效估计器进行比较。仅供参考，图
  11-15 展示了这两个估计器之间的 API 比较。它们看起来几乎相同，除了 CuML 使用称为“可扩展 k-means++”作为初始化参数。CuML 的 k-means
  估计器还接受一个 `max_samples_per_batch` 参数，该参数允许进行受控的批量训练。


  ![](img/518852_1_En_11_Fig15_HTML.jpg)


  **图 11-15：** scikit-learn 和 CuML K-means 估计器之间的 API 比较


  图 11-16 展示了一个具有 10 个特征/维度的数据集的结果。


  ![](img/518852_1_En_11_Fig16_HTML.jpg)


  **图 11-16：** 10 个特征的 K-means 聚类速度比较


  图 11-17 展示了另一个具有 100 个特征的数据集实验的结果。显然，样本量（行数）和维度（列数）都对基于 GPU 的加速性能如此出色有影响。


