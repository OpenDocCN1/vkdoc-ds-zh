  \ `scikit-learn` 库中内置的一些实用工具和技术，它们可以提高你的机器学习代码和数据科学任务的效率。这些包括超参数搜索、并行任务运行、现成的可视化例程以及合成数据生成器。\n\
  \n在接下来的章节中，你将基于模块化和面向对象编码方法的概念，并探索它们在深度学习和经典机器学习任务中的实用性和应用。\n\n"
- "# 5. 模块化且高效的深度学习代码\n\n在上一章中，我探讨了一个观点：大多数数据科学家通常来自与传统计算机科学/软件工程相去甚远的背景。因此，他们编写的代码非常适合出色的探索性数据分析、统计建模或创新的机器学习实验，但对于大型商业平台的生产阶段来说，却不够健壮。数据科学家常常思考的是下一个分析脚本，而不是想着要集成到更大系统中的下一个软件模块。\n\
  \n脚本（大部分）是你为自己编写的代码。软件是你（和你的队友）为他人编写的代码集合。一个不可否认的事实是，大多数没有传统软件开发背景和训练的数据科学家，倾向于编写\
  \ AI/ML 分析代码，*主要是为了自己使用*。\n\n他们只想快速触及隐藏在数据中的模式核心。而不深入考虑普通用户。他们编写一段代码来生成一张丰富而美观的图表。但他们不会将其封装成一个函数以便日后重用。他们从标准库中导入大量方法和类。但他们不会通过继承创建自己的子类并添加方法来扩展功能。\n\
  \n在上一章中，你通过 `scikit-learn` 代码和一个典型的经典机器学习任务（拟合逻辑回归模型）探讨了其中一些问题。在本章中，你将通过一些使用 `Keras`/`TensorFlow`\
  \ 的动手实践示例，探讨类似的原则如何帮助你为深度学习任务编写更好的代码。\n\n## 模块化代码与面向对象风格，实现高效深度学习\n\n*函数、继承、方法、类*：它们是健壮的面向对象编程（OOP）的核心。但如果你只是想创建一个\
  \ Jupyter notebook 来进行探索性数据分析和绘图，你可能并不想深入研究它们。\n\n你可以避免一开始就使用 OOP 原则带来的痛苦，但这几乎总是导致你的\
  \ notebook 代码不可重用、不可扩展。更准确地说，那段代码只为你服务（直到你忘记自己编写的确切逻辑），而不能为其他人所用。但对于任何优秀的软件产品/服务来说，可读性（以及由此带来的可重用性）至关重要。这才是衡量你作品价值的真正考验。不是为了你自己，而是为了他人。\n\
  \n涉及深度学习模型和代码的数据科学也不例外。如今，像 `TensorFlow` 或 `PyTorch` 这样强大而灵活的框架使得编写复杂的神经网络架构变得相对简单和简短。然而，如果整个数据科学代码没有按照第\
  \ [4] 章“为什么（以及如何）为机器学习模块化代码”一节中讨论的大部分风格进行模块化和良好组织，那么它也会受到不可复现和不可重用等问题的困扰。让我们看一些如何在数据科学工作中组织和模块化深度学习代码的例子。\n\
  \n### 高效深度学习任务流程示例\n\n深度学习使得为高度非线性（甚至带噪声）的数据集和现象训练机器学习模型变得容易。像 `Keras`/`TensorFlow`/`PyTorch`\
  \ 这样的现代框架提供了强大且灵活的 API，可以用相对简单且数量惊人的少量代码来构建这些模型。然而，如果你遵循一些关于如何构建、管理和使用深度学习代码的简单指导原则，端到端的数据科学流程可以变得高效得多。采用构建紧凑模块和系统化流程的方法（如图\
  \ 5-1 所示）会有所帮助。以下以问题的形式讨论了一些相关指导原则的示例。\n\n![图 5-1](img/518852_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1：以模块化方式组织的深度学习任务流程\n\n*   深度学习分析中最常见和重复的任务之一是**构建一个深度神经网络（DNN）对象**。数据科学家通常使用非模块化的代码，仅仅是通过添加层（例如，来自\
  \ `Keras` (`https://keras.io/api/layers/`) 或 `PyTorch` (`https://pytorch.org/tutorials/recipes/recipes/defining_a_neural_network.html`)\
  \ 的 API）并将其作为 Jupyter notebook 中的局部变量来构建。为此任务创建一个自定义函数不是更好的主意吗？\n\n*   构建了一个（未训练的）模型后，你必须**编译**（设置学习率、批量大小等）并使用数据**运行**模型。自定义函数是否也能帮助将此任务模块化？\n\
  \n*   当你创建这样一个 **DNN 构建器**函数时，哪些参数需要传递？哪些是可选的？默认值是什么？如果遇到不知道需要传递多少个参数的情况，你是否使用了\
  \ Python 提供的 `*args` 和 `**kwargs`？\n\n*   你是否为该函数编写了**文档字符串**，以便让他人知道该函数的作用、期望的参数以及一个示例？\n\
  \n*   你是否也能将用于根据那些模型函数的输出**创建可视化分析**的代码模块化？\n\n\n\n### 封装器、构建器与回调\n\n从根本上来说，在上述小节中，我描述了将基于深度学习工作流中最核心的任务封装到自定义函数中，并将其用作数据科学代码的核心构建模块。此外，你还可以用类似的方式封装与数据格式化/转换以及预测/推理相关的任务。\n\
  \n需要注意的是，用于回归和分类任务的封装函数可以拥有各自独立的架构和参数集。因此，将它们分别定制构建是合理的。封装函数中默认参数值的选择也至关重要。\n\n\
  除了简单的函数封装器，你还可以利用一种名为*回调*的强大构造，它能够适应深度神经网络训练的动态特性。本质上，回调是一个能够在深度神经网络训练的不同阶段（例如，在一个周期开始或结束时，或者在开始处理单个批次之前）执行动作的对象。你可以在多种场景下使用回调，包括但不限于以下情况：\n\
  \n-   基于某个错误或计算标准的**早停法**\n-   **定期将模型保存**到磁盘（使系统能够抵御意外故障）\n-   在训练进行中（即中途）获取模型各种内部状态和统计信息的概览\n\
  \n最后，如果你希望将这种方法完全扩展到面向对象编程范式中，你可以构建包含所有这些封装器（作为特殊方法）的类和工具模块。你可以将此称为深度学习工具模块，在任何需要监督式机器学习建模的数据科学任务中，都可以调用该模块。\n\
  \n### 用于快速实验的模块化代码\n\n让我们用一个简单的案例来演示上述讨论的思路：一个使用 Fashion MNIST（`https://github.com/zalandoresearch/fashion-mnist`）数据集的深度学习图像分类问题。核心的机器学习任务很简单：为这个数据集构建一个分类器，这是对著名的原始\
  \ MNIST 手写数字数据集的一个趣味性变体。Fashion MNIST 包含 60,000 张训练图像，每张大小为 28 x 28 像素，内容与时尚物品相关（例如，帽子、鞋子、裤子、T\
  \ 恤、连衣裙等）。此外，它还包含 10,000 张测试图像，用于模型验证和测试。图 5-2 展示了该数据集的一个切片以供说明。\n\n![](img/518852_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2: Fashion MNIST 数据集的一个切片\n\n#### 业务/数据科学问题\n\n针对该数据集的基本机器学习任务看似直接。但如果围绕这个核心机器学习任务存在一个更高阶的优化或可视化分析问题呢：*模型架构的复杂性如何影响达到期望精度所需的最小训练周期数？*\n\
  \n你应该清楚我们为何要关心这样的问题：因为这关系到整体的业务优化。训练神经网络并非一个微不足道的计算任务（`www.technologyreview.com/s/613630/training-a-single-ai-model-can-emit-as-much-carbon-as-five-cars-in-their-lifetimes/`）。因此，明智的做法是**调查必须投入的最小训练量**以达成目标性能指标，以及架构的选择如何影响这个量。\n\
  \n图像分类的精度可能与更广泛的业务成果相关联，例如时尚推荐或商店中的服装识别。核心的数据科学任务有助于优化执行该业务任务的成本——即使用机器学习代码作为底层基础，以最优的计算资源支出来使用图像数据库。\n\
  \n在这个例子中，你甚至不会使用通常用于图像分类任务的卷积神经网络（CNN；`https://towardsdatascience.com/a-comprehensive-guide-to-convolutional-neural-networks-the-eli5-way-3bd2b1164a53`）。这是因为对于这个数据集，一个简单的全连接神经网络就能达到相当高的精度，并且，实际上，需要一个次优的性能表现才能阐明上述高阶优化问题的核心要点。\n\
  \n因此，你必须解决两个问题：\n\n-   达到*期望精度*目标所需的*最小周期数*是多少？你如何确定这个值？\n-   *模型的具体架构*如何影响这个数字或训练行为？\n\
  \n为了实现这些目标，你将使用两个简单的面向对象编程原则：\n\n-   从一个基类对象创建继承类\n-   创建工具函数，并从紧凑的代码块中调用它们，该代码块可以呈现给外部用户，用于高阶优化和分析\n\
  \n#### 从 Keras 回调继承\n\n你继承一个 Keras 回调类（作为基类），并通过添加一个方法来编写你自己的子类，该方法检查训练精度并根据该值执行操作。代码快照和一些解释如图\
  \ 5-3 所示。更多细节可以在 TensorFlow 官方文章《编写你自己的回调》（`www.tensorflow.org/guide/keras/custom_callback`）中找到。\n\
  \n![](img/518852_1_En_5_Fig3_HTML.jpg)\n\n图 5-3: 基于 Keras 回调构建的自定义类\n\n基本上，这个简单的回调实现了对**训练周期的动态控制**；当精度达到期望阈值时，训练自动停止。图\
  \ 5-4 展示了一个示例运行的快照。\n\n![](img/518852_1_En_5_Fig4_HTML.jpg)\n\n图 5-4: 启用回调的示例运行快照\n\
  \n#### 模型构建器与编译/训练函数\n\n接下来，你将 Keras 模型构建代码放入一个工具函数中，这样，通过简单的用户输入（以函数参数的形式），就可以生成具有任意层数和架构（只要它们是全连接的）的模型。代码快照及相关解释如图\
  \ 5-5 所示。\n\n![](img/518852_1_En_5_Fig5_HTML.jpg)\n\n图 5-5: 模型构建函数快照\n\n你还可以将编译和训练代码放入一个工具函数中，以便在高阶优化循环中方便地使用这些超参数。代码快照及相关解释如图\
  \ 5-6 所示。\n\n![](img/518852_1_En_5_Fig6_HTML.jpg)\n\n图 5-6: 模型编译与训练函数快照\n\n####\
  \ 可视化函数\n\n接下来，是时候进行可视化了。通用的绘图函数接受原始数据作为输入。但是，如果你有一个特定的目的，即绘制训练集精度的演变过程（并展示其与目标值的对比），那么你的绘图函数应该只接受（训练好的）深度学习模型作为输入，并生成所需的图表。代码快照及相关解释如图\
  \ 5-7 所示。\n\n![](img/518852_1_En_5_Fig7_HTML.jpg)\n\n图 5-7: 可视化函数快照\n\n一个典型的结果（损失-精度图）如图\
  \ 5-8 所示。\n\n![](img/518852_1_En_5_Fig8_HTML.jpg)\n\n图 5-8: 来自训练好的深度学习模型的典型损失-精度图\n\
  \n\n\n### 终极分析代码：简洁而紧凑\n\n到目前为止，您已经将核心深度学习代码模块化。现在，您可以利用之前定义的所有函数和类，将它们整合在一起以完成更高层次的优化任务。因此，您的最终代码将非常紧凑，但对于各种精度阈值和深度神经网络架构（神经元数量），它仍会生成同样有趣的损失和准确率变化曲线图。\n\
  \n这将使您能够用极少的代码生成可视分析结果，来审视性能指标（此处为分类准确率）和深度神经网络架构的选择。这是构建优化机器学习系统的第一步。\n\n生成一些待研究的案例：\n\
  \n```python\nfrom itertools import product\naccuracy_desired = [0.85,0.9,0.95]\n\
  num_neurons = [16,32,64,128]\ncases = list(product(accuracy_desired,num_neurons))\n\
  print(\"因此，我们正在考虑的案例如下...\\n\")\nfor i,c in enumerate(cases):\nprint(\"准确率目标 {},\
  \ 神经元数量: {}\".format(c[0],c[1]))\nif (i+1)%4==0 and (i+1)!=len(cases):\nprint(\"\
  -\"*50)\n```\n\n这段代码生成了图 5-9 所示的案例。\n\n![](img/518852_1_En_5_Fig9_HTML.jpg)\n\n\
  **图 5-9** – 为优化任务生成的一些代表性案例\n\n最终的分析/优化代码简洁易懂，适合那些不需要了解 Keras 模型构建或回调类复杂性的高级用户。这是面向对象编程背后的核心原则，即**对复杂性层次进行抽象**，您现在能够为您的深度学习任务实现这一点。\n\
  \n请注意如何将 `print_msg=False` 传递给类实例。虽然在初始检查/调试时需要基本的打印状态，但在执行优化任务时应静默分析。如果类定义中没有这个参数，就无法停止打印调试信息：\n\
  \n```python\nfor c in cases:\n    # 一个具有特定准确率目标的 mycallback 类\n    callbacks = myCallback(c[0],\
  \ print_msg=False)\n    # 构建具有特定神经元数量的模型\n    model = build_model(num_layers=1,architecture=[c[1]])\n\
  \    # 使用回调类编译并训练模型。\n    # 选择适当的批量大小和最大 epoch 数\n    model = compile_train_model(model,\
  \ x_train,y_train,callbacks=callbacks,\n                                batch_size=32,epochs=30)\n\
  \    # 合适的标题字符串\n    title = \"损失与准确率随 epoch 变化\\n 准确率阈值 \\\n               {} 和神经元数量\
  \ {}\".format(c[0],c[1])\n    # 使用绘图函数，传递准确率目标、\n    # 训练好的模型和自定义标题字符串\n    plot_loss_acc(model,target_acc=c[0],title=title)\n\
  ```\n\n一些代表性结果如图 5-10 所示；它们是通过执行上述代码块自动生成的。这清楚地表明，只需编写极少量高级代码，就能生成可视分析结果，用以判断不同神经网络架构在不同性能指标水平下的相对表现。这使得用户无需调整底层函数，就能根据期望的准确率和复杂度，轻松做出模型选择判断。\n\
  \n![](img/518852_1_En_5_Fig10_HTML.jpg)\n\n**图 5-10** – 不同模型架构（每隐藏层神经元数量）和准确率目标的代表性结果\n\
  \n此外，请注意每个图表的自定义标题。这些标题清晰地阐述了目标性能和神经网络的复杂度，从而使分析变得简单。虽然这只是在绘图工具函数中添加的一个小功能，但它体现了创建此类函数时进行仔细规划的必要性。如果您没有为函数规划这样的参数，就不可能为每个图表生成自定义标题。**这种对\
  \ API（应用程序编程接口）的仔细规划是优秀面向对象编程的重要组成部分**。\n\n### 将脚本转化为工具模块\n\n到目前为止，您可能一直在使用 Jupyter\
  \ notebook，但您可能希望将这项工作转化为一个整洁的 Python 模块，以便随时导入使用。就像您编写 `from matplotlib import\
  \ pyplot` 一样，您可以在任何地方导入这些工具函数（Keras 模型构建、训练和绘图）。其思路如图 5-11 所示。\n\n![](img/518852_1_En_5_Fig11_HTML.jpg)\n\
  \n**图 5-11** – 构建深度学习工具模块（供您个人使用）\n\n### 良好实践总结\n\n您刚刚学习了一些源自面向对象编程的良好实践，并将其应用于深度学习分析任务。对经验丰富的软件开发人员来说，这些实践几乎都微不足道。然而，本章是为那些可能没有结构化编程背景，但需要理解将这些良好实践融入机器学习工作流重要性的崭露头角的数据科学家所设计的。\n\
  \n请允许我冒着重复的风险，在此总结一下这些良好实践：\n\n-   只要有机会，就将重复的代码块转化为**工具函数**。\n-   非常仔细地考虑**函数的\
  \ API**（即所需的参数最小集合，以及它们如何为更高级别的编程任务服务）。\n-   别忘了为函数编写**文档字符串**，即使只是一行描述。\n-   如果开始积累许多与同一对象相关的工具函数，考虑将该对象转化为一个**类**，并将这些工具函数作为**方法**。\n\
  -   只要有机会，就通过继承来**扩展类功能**，以完成复杂的分析。\n-   不要止步于 Jupyter notebook。将其转化为可执行的脚本，并放入一个小的**模块**中。养成将工作模块化的习惯，以便任何人都可以轻松地**重复使用和扩展**。\n\
  \n在下一章中，您将尝试基于这些原则构建自己的机器学习估算器类。如需了解深度学习工具函数和神经网络训练器类的具体实现，请阅读 `https://github.com/tirthajyoti/Deep-learning-with-Python/tree/master/utils`\
  \ 上的“Deep learning with Python”。\n\n## 简化图像分类任务流程\n\n图像分类是涉及深度学习工具的数据科学工作流中最常见的任务之一。因此，简化或自动化此类任务，是我一直在倡导的自动化和模块化理念的典型应用。\n\
  \n对于这个特定任务，数据科学家可能希望有一个单一的函数，能够自动从磁盘上的指定目录（或从网络地址）拉取图像，并返回一个完全训练好的神经网络模型，随时可用于预测。因此，在本节中，您将探索如何使用\
  \ Keras (TensorFlow) API 中的几个工具方法来简化此类模型（特别是针对分类任务）的训练过程，并包含内置的数据预处理功能。\n\n简单来说，您希望：\n\
  \n-   获取一些数据。\n-   按类别将它们放入目录/文件夹中。\n-   用最少的代码/麻烦训练一个神经网络模型。\n\n最终，您的目标是编写一个**单一的工具函数**，该函数只需接受存储训练图像的文件夹名称/地址，就能返回一个完全训练好的卷积神经网络模型。该思路如图\
  \ 5-12 所示。\n\n![](img/518852_1_En_5_Fig12_HTML.jpg)\n\n**图 5-12** – 简化（并精简）图像分类任务\n\
  \n\n\n## 数据集\n\n本演示将使用一个包含 4000 多张花卉图片的数据集。该数据集可从 Kaggle 网站下载，链接如下：。数据收集基于 Flickr、Google\
  \ 和 Yandex 的图片。这些图片被分为五类：\n\n- 雏菊\n- 郁金香\n- 玫瑰\n- 向日葵\n- 蒲公英\n\n每个类别约有 800 张照片。这些照片分辨率不算特别高（每张约\
  \ 320 x 240 像素）。由于照片比例不同，它们没有被统一调整为一个尺寸。然而，这些照片被整齐地组织在五个以相应类别标签命名的目录中。你可以利用这种组织方式，应用\
  \ Keras 方法来简化卷积网络的训练过程。\n\n完整的 Jupyter notebook 文件可以在 GitHub 仓库中找到。本部分我将选取代码中的关键片段来展示重要部分以便说明。\n\
  \n**是否需要使用 GPU？**\n\n建议在 GPU 上运行此脚本。你将构建一个包含五个卷积层的卷积神经网络（CNN）；因此，如果不使用某种 GPU，对数千张图片的训练过程可能会计算量巨大且速度缓慢。对于花卉数据集，在我配备\
  \ NVidia GTX 1060 Ti GPU（6GB 显存）、Core i-7 8770 CPU 和 16GB DDR4 内存的笔记本电脑上，单次训练周期大约需要\
  \ 1 分钟。\n\n为便于说明，图 5-13 展示了这些图片在本地硬盘上的存储方式。一些示例图片则展示在图 5-14 中。\n\n![示例花卉图像。注意形状和分辨率的差异](img/518852_1_En_5_Fig14_HTML.png)\n\
  \n图 5-14: 示例花卉图像。注意形状和分辨率的差异\n\n![存储的花卉图像数据](img/518852_1_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13: 存储的花卉图像数据\n\n### 构建数据生成器对象\n\n这才是真正的魔法发生之处。`ImageDataGenerator` 类的官方描述是：“*生成批量张量图像数据，并进行实时数据增强。数据将（按批次）循环。*”\
  \ 基本上，它可用于通过大量内置预处理功能（如缩放、平移、旋转、添加噪声、白化等）来增强图像数据。现在，你只需使用 `rescale` 属性将图像张量的值缩放到\
  \ 0 和 1 之间。关于该类这方面的功能，这里有一篇有用的文章：“**[如何使用 Keras ImageDataGenerator 扩增您的少量图像数据集](https://medium.com/@arindambaidya168/https-medium-com-arindambaidya168-using-keras-imagedatagenerator-b94a87cdefad)**”\
  \ (`https://medium.com/@arindambaidya168/https-medium-com-arindambaidya168-using-keras-imagedatagenerator-b94a87cdefad`)。\n\
  \n但在当前演示中，该类真正实用之处在于其名为 `flow_from_directory` 的超实用方法，它能从指定目录中逐个提取图像文件。请注意，该目录必须是顶层目录，所有各个类别的子目录都分别存放在其中。`flow_from_directory`\
  \ 方法会自动扫描这些子目录，并获取图像及其相应的标签。\n\n你可以指定类别名称（就像你在此处使用 `classes` 参数所做的那样），但这是可选的。不过，你稍后会看到，这对于从大量数据中进行选择性训练非常有用。\n\
  \n另一个有用的参数是 `target_size`，它允许你将源图像调整为统一的 200 x 200 尺寸，无论原始图像大小如何。只需一个简单的函数参数就能实现如此酷炫的图像处理。\n\
  \n你还可以指定批次大小。如果不指定 `batch_size`，默认情况下它将被设置为 32。由于在此处进行多类别分类，请将 `class_mode` 设置为\
  \ `categorical`。以下是代码片段：\n\n```\nbatch_size = 128\nfrom tf.keras.preprocessing.image\
  \ import ImageDataGenerator\n# 所有图像都将按 1./255 重新缩放\ntrain_datagen = ImageDataGenerator(rescale=1/255)\n\
  # 以 128 为一批次流式传输训练图像\n# 所有图像都将调整为 200 x 200\ntrain_generator = train_datagen.flow_from_directory(\n\
  '../Data//flowers-recognition',\ntarget_size=(200, 200),\nbatch_size=batch_size,\n\
  classes = ['daisy','dandelion','rose','sunflower','tulip'],\nclass_mode='categorical')\n\
  ```\n\n运行此代码时，Keras 函数会扫描顶层目录，查找所有图像文件，并根据它们所在的子目录自动为它们打上正确的类别标签。该工具在花卉数据集上的工作流程如图\
  \ 5-15 所示。\n\n![ImageDataGenerator 对象对花卉数据集进行操作](img/518852_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15: `ImageDataGenerator` 对象对花卉数据集进行操作\n\n更有趣的是，这还是一个 Python 生成器对象（`https://realpython.com/introduction-to-python-generators/`）。这意味着它将用于在训练过程中*逐个生成数据*。这极大地缓解了处理内容无法一次性全部加载到内存中的超大数据集的问题。\n\
  \n### 构建卷积神经网络模型\n\n为简洁起见，我不会深入探讨 CNN 模型的代码细节。简而言之，它由五个卷积层/最大池化层组成，末端是 128 个神经元，接着是一个带有\
  \ `SoftMax` 激活函数的 5 神经元输出层，用于多类别分类。你使用 `RMSprop` 优化器，初始学习率为 0.001。模型摘要如图 5-16 所示。它拥有超过\
  \ 20 万个可训练参数。\n\n![用于花卉分类的 CNN 模型摘要](img/518852_1_En_5_Fig16_HTML.jpg)\n\n图 5-16:\
  \ 用于花卉分类的 CNN 模型摘要\n\n### 使用 `fit_generator` 方法进行训练\n\n我之前讨论了 `train_generator`\
  \ 对象配合 `flow_from_directory` 方法及其参数所实现的酷炫功能。现在，让我们在之前定义的 CNN 模型的 `fit_generator`\
  \ 方法中利用这个对象。\n\n注意 `fit_generator` 的 `steps_per_epoch` 参数。由于 `train_generator` 是一个通用的\
  \ Python 生成器，它永远不会停止，因此 `fit_generator` 无法知道一个训练周期在哪里结束，下一个又从哪里开始。你需要告知它在单个训练周期中的步数。在大多数情况下，这等于总训练样本数除以批次大小。在前面的部分中，你已计算出总样本数为\
  \ `total_sample`。因此，在这种特定情况下，`steps_per_epoch` 被设置为 `int(total_sample/batch_size)`，即\
  \ 34，所以在下面的训练日志中，你将看到每个训练周期有 34 步。\n\n```\nhistory = model.fit_generator(\ntrain_generator,\n\
  steps_per_epoch=int(total_sample/batch_size),\nepochs=epochs,\nverbose=1)\n```\n\
  \n执行后，模型开始训练，你可以使用常见的绘图代码来检查准确率/损失（图 5-17）。\n\n![CNN 训练任务的代表性损失/准确率图](img/518852_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17: CNN 训练任务的代表性损失/准确率图\n\n\n\n### 将所有步骤封装到单个函数中\n\n到目前为止你完成了什么？你已经能够利用 Keras\
  \ 的`ImageDataGenerator`和`fit_generator`方法，从单个目录中自动提取图像、标注标签、调整大小和缩放比例，并逐一（按批次）输入图像以训练神经网络。那么，你能将所有步骤封装到单个函数中吗？\n\
  \n构建实用软件/计算系统的核心目标之一是**抽象化**（即隐藏内部计算和数据操作的繁琐细节，向用户呈现简单直观的工作接口/API）。为实现此目标，让我们将上述流程封装到单个函数中。图\
  \ 5-18 展示了这一思路。\n\n![](img/518852_1_En_5_Fig18_HTML.jpg)\n\n**图 5-18** 将核心组件封装到单个函数中。用户提供目录名称，即可获得训练好的模型\n\
  \n设计高级 API 时，应追求比特定演示所需更高的通用性。基于此，你可以考虑为函数增加更多参数，使其适用于其他图像分类场景（稍后将看到示例）。\n\n具体而言，函数中包含以下参数：\n\
  \n- `train_directory`：存放训练图像的目录，图像按类别存储在不同的子文件夹中，子文件夹应以类别命名。\n- `target_size`：训练图像的目标尺寸，例如元组(200,200)。\n\
  - `classes`：Python 列表，指定需要训练的类别。这强制生成器从`train_directory`中选择特定文件，而非处理所有数据。\n- `batch_size`：训练时的批次大小。\n\
  - `num_epochs`：训练轮数。\n- `num_classes`：输出类别的数量。\n- `verbose`：训练的详细程度，直接传递给`fit_generator`方法。\n\
  \n当然，你还可以增加与整体模型架构或优化器设置相关的参数。本章不关注此类问题，因此保持简洁。完整代码在 GitHub 仓库中。图 5-19 展示了文档字符串部分，强调如何使其成为灵活的\
  \ API。\n\n![](img/518852_1_En_5_Fig19_HTML.jpg)\n\n**图 5-19** 简化分类任务的单一实用函数截屏\n\n\
  ### 测试实用函数\n\n你可以通过简单提供文件夹/目录名称来测试`train_CNN`函数，并获得可用于预测的已训练模型。假设你只想训练`daisy`、`rose`和`tulip`这三个类，忽略其他两种花卉数据。只需将列表传递给`classes`参数。此时，必须将`num_classes`参数设置为\
  \ 3。\n\n你会注意到，由于训练样本数量少于之前的情况，每轮步数自动减少到 20。此外，上述函数中`verbose`默认设置为 0，因此如需监控每轮训练进度，需显式指定`verbose=1`。\n\
  \n基本上，现在你可以**用两行代码获得一个完整的 CNN 训练模型**！\n\n```\n# 定义文件夹\ntrain_directory = \"../Data//flowers-recognition/\"\
  \n# 获取模型\ntrained_model = train_CNN(train_directory=train_directory,\n         \
  \                 classes=['daisy','rose','tulip'],\n                          num_epochs=30,\n\
  \                          num_classes=3,\n                          verbose=1)\n\
  ```\n\n### 该函数能（直接）用于其他数据集吗？\n\n这是对此类函数实用性的严峻考验：*我们能否直接将其应用于另一个数据集而无需大幅修改？* 让我们一探究竟。\n\
  \n一个丰富且可管理的图像分类数据集是 Caltech-101（[www.vision.caltech.edu/Image_Datasets/Caltech101/](http://www.vision.caltech.edu/Image_Datasets/Caltech101/)）。所谓“可管理”，是指它不像著名的\
  \ ImageNet（[www.image-net.org/about.php](http://www.image-net.org/about.php)）数据库那样庞大（ImageNet\
  \ 需要大规模硬件基础设施进行训练，因此在笔记本电脑上快速测试想法不现实），但又足够多样化，可用于实践和学习卷积神经网络的技巧。该数据集包含 101 个类别的多种物体图像。每个类别有\
  \ 40 到 800 张图像，多数类别约 50 张图像。每张图像尺寸约为 300 x 200 像素。部分类别如图 5-20 所示。\n\n![](img/518852_1_En_5_Fig20_HTML.jpg)\n\
  \n**图 5-20** Caltech-101 图像数据集\n\n**谁创建了 Caltech-101？** Caltech-101 数据集由著名的斯坦福大学教授李飞飞博士（[`profiles.stanford.edu/fei-fei-li`](https://profiles.stanford.edu/fei-fei-li)）及其同事（Marco\
  \ Andreetto 和 Marc Aurelio Ranzato）于 2003 年在加州理工学院创建，当时她是一名研究生。因此可以推断，Caltech-101\
  \ 是她后续 ImageNet 工作的直接前身。\n\n下载数据集并将其解压到之前的`Data`文件夹中。目录结构应如图 5-21 所示。\n\n![](img/518852_1_En_5_Fig21_HTML.jpg)\n\
  \n**图 5-21** 存储的 Caltech-101 图像目录\n\n现在你已具备所需条件：一个顶层目录，其子目录包含训练图像。然后，同样只需两行代码：\n\
  \n```\n# 定义文件夹\ntrain_directory = \"../Data/101_ObjectCategories/\"\n# 获取模型\nmodel_caltech101\
  \ = train_CNN(train_directory=train_directory,\n                             classes=['crab','cup'],\n\
  \                             batch_size=4,\n                             num_epochs=25,\n\
  \                             num_classes=2,\n                             verbose=1)\n\
  ```\n\n你所做的只是将目录地址传递给函数，并选择要训练的图像类别。假设你希望训练模型以区分*cup*（杯子）和*crab*（螃蟹）。只需像之前一样，将类别名称作为列表传递给`classes`参数。\n\
  \n此外，请注意，对于此数据集，你可能需要显著减小`batch_size`，因为训练图像总数会比花卉数据集少得多；若`batch_size`超过总样本数，`steps_per_epoch`将变为\
  \ 0，导致训练时出错。\n\n瞧！函数会自动找到相关图像（共 130 张），并以每批次 4 张进行训练，因此每轮步数为 33。结果如图 5-22 所示。\n\n\
  ![](img/518852_1_En_5_Fig22_HTML.jpg)\n\n**图 5-22** 使用 Caltech-101 图像（两个类别：杯子和螃蟹）进行训练\n\
  \n你看到了将训练图像目录地址传递给函数，并针对所选类别训练 CNN 模型是多么简单。但模型性能如何？让我们通过测试从互联网下载的随机图片来验证。假设你下载了螃蟹和杯子的图片。你需要进行一些基础图像处理（调整大小和维度扩展），以匹配模型要求，并得到输出对象`img_crab`和`img_cup`。然后使用这些图像测试模型。\n\
  \n```\nmodel_caltech101.predict(img_crab)\n>> array([[1., 0.]], dtype=float32)\n\
  ```\n\n模型正确预测了螃蟹测试图像的类别。对于杯子的图像：\n\n```\nmodel_caltech101.predict(img_cup)\n>> array([[0.,\
  \ 1.]], dtype=float32)\n```\n\n\n\n你可以下载任意随机图像来测试模型性能。如果不满意，你应该通过使用模块化函数修改架构和超参数来重新训练模型。\n\
  \n然而，重点在于，**你能够仅使用与最初完全不同的数据集完全相同的两行代码来训练一个 CNN 模型**。这就是模块化代码和构建一个适用于多种数据源的通用 API\
  \ 的力量。这节省了宝贵的时间，并使代码可重用。高效数据科学的基石正是建立在这些基础元素之上。\n\n### 其他扩展\n\n到目前为止，在你的`fit_generator`内部，你只有一个用于训练的`train_generator`对象。但验证集怎么办？它遵循与`train_generator`完全相同的概念。你可以从训练图像中随机分割出一个验证集，并将其放在一个单独的目录中（与训练目录相同的子目录结构），然后你应该能够将其传递给`fit_generator`函数。\n\
  \n想直接操作一个存储了你图像的 pandas DataFrame？没问题。`ImageDataGenerator`类有一个名为`flow_from_dataframe`的方法，你可以将图像文件名（包含在\
  \ pandas DataFrame 中）传递给它，然后训练就可以进行了。\n\n我们强烈鼓励你根据自己的应用需求来查看并扩展这些想法。\n\n### 仅需几行代码的激活图\n\
  \n深度学习模型使用数百万个参数，并为其输入的图像或数据集创建极其复杂且高度非线性的内部表示。因此，它们通常被称为完美的黑盒机器学习技术（[`www.wired.com/story/inside-black-box-of-neural-network/`](http://www.wired.com/story/inside-black-box-of-neural-network/)）（图\
  \ 5-23）。在用大型数据集训练后，我们可以从中获得高度准确的预测，但我们几乎无法理解模型用来将特定图像分类到某个类别中的内部特征和表示（[`www.technologyreview.com/s/604087/the-dark-secret-at-the-heart-of-ai/`](http://www.technologyreview.com/s/604087/the-dark-secret-at-the-heart-of-ai/)）。简而言之，*深度学习的黑盒问题*\
  \ 是指拥有强大的预测能力，却缺乏直观且易于理解的解释。\n\n![](img/518852_1_En_5_Fig23_HTML.png)\n\n图 5-23\n\
  \n深度学习的黑盒问题（来源：[CMU ML 博客](https://blog.ml.cmu.edu/2019/05/17/explaining-a-black-box-using-deep-variational-information-bottleneck-approach/),\
  \ [*https://blog.ml.cmu.edu/2019/05/17/explaining-a-black-box-using-deep-variational-information-bottleneck-approach/*](https://blog.ml.cmu.edu/2019/05/17/explaining-a-black-box-using-deep-variational-information-bottleneck-approach/)）。\n\
  \n这并非好兆头，因为我们人类是视觉生物（[`www.seyens.com/humans-are-visual-creatures/`](http://www.seyens.com/humans-are-visual-creatures/)）。数百万年的进化赋予了我们一双极其复杂的眼睛（[`www.relativelyinteresting.com/irreducible-complexity-intelligent-design-evolution-and-the-eye/`](http://www.relativelyinteresting.com/irreducible-complexity-intelligent-design-evolution-and-the-eye/)）和一个更为复杂的视觉皮层（[`www.neuroscientificallychallenged.com/blog/know-your-brain-primary-visual-cortex`](http://www.neuroscientificallychallenged.com/blog/know-your-brain-primary-visual-cortex)），我们使用这些器官来理解世界。科学过程始于观察，而这几乎总是视觉的同义词。在商业中，只有我们能够观察和衡量的东西，我们才能有效地控制和驾驭。观察/看见是我们开始构建世间现象的思维模型（[`https://medium.com/personal-growth/mental-models-898f70438075`](https://medium.com/personal-growth/mental-models-898f70438075)）、对周围物体进行分类、区分敌友等等的方式。\n\
  \n激活图被提出来帮助可视化复杂 CNN 模型的内部工作原理。让我们来讨论一下它们。\n\n## 激活图\n\n文献中已经开发了多种理解和可视化 CNN 的方法，部分原因是为了回应常见的批评，即\
  \ CNN 中学到的内部特征是不可解释的。最直接的 Visualization 技术是在网络前向传播期间显示其激活情况。\n\n简单来说，激活函数有助于决定一个神经元是否应该被激活。这有助于确定该神经元接收到的信息是否与输入相关。激活函数是对输入信号进行的非线性变换，转换后的输出被发送到下一个神经元。\n\
  \n激活图只是一个给定图像在经过各种线性代数运算后，在网络不同层上这些激活数值的视觉表示。人们可以从这些图中推断出网络的工作机制和设计限制。对于基于 ReLU\
  \ 激活的网络，激活图通常开始时看起来相对模糊和密集，但随着训练的进行，激活图通常会变得更加稀疏和局部化。通过这种可视化可以轻松捕获的一个设计陷阱是，某些激活图对于许多不同的输入可能全为零，这可能表明存在死亡过滤器，并且可能是高学习率的一个症状。\n\
  \n然而，即使你已经很好地训练了你的神经网络并从中进行预测，可视化这些激活图也是一项非平凡的任务。*如何仅用几行代码就轻松可视化和展示一个相当复杂的 CNN 的激活图*？\n\
  \n### 仅需几行代码的激活图\n\n在上一节中，我展示了如何编写一个单一紧凑的函数，通过自动从磁盘逐个读取图像文件来获得一个完全训练好的 CNN 模型。现在，你将使用这个函数以及一个名为\
  \ **Keract** 的出色的小型库，它使得激活图的可视化变得非常容易。它是 Keras 的一个高级辅助库，用于在神经网络的各个层上显示有用的热力图和激活图。\n\
  \n因此，对于这段代码，你需要使用你之前构建的模块`train_CNN_keras`和`preprocess_image`中的几个工具函数，来使一个随机的 RGB\
  \ 图像兼容以生成激活图。\n\n你将使用上一节讨论的相同的 Caltech-101 数据集。但是，你只使用五类图像进行训练：*螃蟹*，*杯子*，*大脑*，*相机*\
  \ 和 *椅子*。\n\n#### 训练\n\n训练仅需几行代码即可完成：\n\n```\ntrain_directory = \"../Data/101_ObjectCategories/\"\
  \ntarget_size=(512,512)\nbatch_size=4\nclasses = ['crab','cup','brain','camera','chair']\n\
  num_classes = len(classes)\nnum_epochs=10\nmodel = train_CNN_keras(train_directory=train_directory,\n\
  num_epochs=num_epochs,\ntarget_size=target_size,\nclasses = classes,\nbatch_size=batch_size,\n\
  num_classes=num_classes)\n```\n\n为了生成激活图，你可以从互联网或任何其他来源选择一张随机的人脑图像。将测试图像存储为文件`brain-1.jpg`。\n\
  \n\n\n### 激活\n\n再添几行代码即可生成激活值：\n\n```python\nfrom keract import get_activations\n\
  # 图像路径\nimg_path = '../images/brain-1.jpg'\n# 为模型预处理图像\nimg = preprocess_image(img_path=img_path,\
  \ model=model, resize=target_size)\n# 生成激活值\nactivations = get_activations(model,\
  \ img)\n```\n\n你会得到一个字典，其中层名称作为键，NumPy 数组作为值，这些数组对应着激活值。图 5-24 展示了激活值数组长度随特定卷积层滤波器映射尺寸而变化的情况。\n\
  \n![](img/518852_1_En_5_Fig24_HTML.jpg)\n\n**图 5-24** 激活映射数组已存储（数组长度可变，与当前层卷积滤波器尺寸对应）\n\
  \n接着，用两行代码显示激活映射：\n\n```python\nfrom keract import display_activations\ndisplay_activations(activations,\
  \ save=False)\n```\n\n你可以逐层查看激活映射。图 5-25 展示了第一个卷积层（16 张图像对应 16 个滤波器）。实际显示的图像可能因测试图像不同而有所差异，但激活层可视化的思想已清晰呈现。\n\
  \n![](img/518852_1_En_5_Fig25_HTML.jpg)\n\n**图 5-25** 第一个卷积层的激活映射\n\n图 5-26 展示了第二层（32\
  \ 张图像对应 32 个滤波器）。\n\n![](img/518852_1_En_5_Fig26_HTML.jpg)\n\n**图 5-26** 第二个卷积层的激活映射\n\
  \n对于该模型，共有 5 个卷积层（每个卷积层后紧跟最大池化层），因此你会得到 10 组图像。为简洁起见，此处不再展示其余图像，但建议你通过 Jupyter notebook\
  \ 自行探索查看。\n\n### 另一个用于 Web 界面的库\n\n另一个漂亮的激活可视化库是 `Quiver`。不过，它基于 Python 微服务器框架 Flask\
  \ 构建，并在浏览器端口中显示激活映射，而非在 Jupyter Notebook 内。它还需要一个训练好的 Keras 模型作为输入。因此，你可以轻松使用上一节介绍的实用函数，并尝试使用该库进行交互式激活映射可视化。\n\
  \n### 这如何促进高效数据科学？\n\n在本章中，你学会了仅用几行代码（利用某个特殊模块的紧凑函数以及 Keras 的一个实用小附属库）就能从头开始训练 CNN、生成激活映射并逐层显示。这使你能够基于任何图像数据集（只需将图像按简单目录格式整理）训练\
  \ CNN 模型（从简单到复杂），并深入查看你想要的任何测试图像的内部结构。\n\n一旦构建了必要的实用模块和激活映射脚本，你就可以将它们重复应用于各种图像数据。这有助于快速高效地探索大量图像，适用于各种应用场景。正因如此，这种方法与高效数据科学的理念相契合。\n\
  \n## 使用 Scikit-learn 进行超参数搜索\n\nKeras 是深度学习初学者和专业人士最常用的 Python 库/API 之一。尽管它最初是 François\
  \ Chollet 的一个独立项目，但从 2.0 版本开始，它已原生集成到 TensorFlow 中。更多信息请点击此处（[`keras.io/about/`](https://keras.io/about/)）。根据其官方文档，它是“*为人类而非机器设计的\
  \ API*”，因为它“*遵循减少认知负荷的最佳实践*”。\n\n超参数调优正是认知负荷必然会增加的情况之一。深度学习模型从一开始就有大量超参数：学习率、衰减率、激活函数、丢弃率、动量、批量大小等等。优化深度学习模型以获得最佳性能和计算成本，关键在于正确选择这些超参数。因此，数据科学家花费大量时间和精力手动调优，或通过自动化脚本、优化策略/框架进行调优。\n\
  \n尽管有许多支持库和框架来处理超参数调优，但对于简单的网格搜索，Keras 提供了一个出色的 API，可与我们钟爱的 scikit-learn 库集成。本节将对此进行讨论。\n\
  \n### Scikit-learn 与 Keras 的融合\n\n几乎所有 Python 机器学习从业者都熟悉 scikit-learn 库及其简洁的 API\
  \ 方法（[`www.tutorialspoint.com/scikit_learn/scikit_learn_estimator_api.htm`](http://www.tutorialspoint.com/scikit_learn/scikit_learn_estimator_api.htm)），例如\
  \ `fit`、`get_params` 和 `predict`。该库还提供了极其有用的方法，用于交叉验证、模型选择、流水线构建和网格搜索。数据科学家每天都会使用这些工具处理经典的机器学习问题。但是，能否将相同的\
  \ API 用于深度学习问题呢？\n\n事实证明，Keras 提供了几个特殊的包装类，分别用于回归和分类问题，以便充分利用 scikit-learn 原生的这些\
  \ API 的强大功能。在本节中，你将使用简单的 k 折交叉验证（[`https://medium.com/datadriveninvestor/k-fold-cross-validation-6b8518070833`](https://medium.com/datadriveninvestor/k-fold-cross-validation-6b8518070833)）和基于\
  \ Keras 分类器（[`www.tensorflow.org/api_docs/python/tf/keras/wrappers/scikit_learn/KerasClassifier`](http://www.tensorflow.org/api_docs/python/tf/keras/wrappers/scikit_learn/KerasClassifier)）模型的穷举网格搜索。它利用了\
  \ Keras 对 scikit-learn 分类器 API 的一种实现。\n\n### 数据与（初步）Keras 模型\n\n首先，你创建一个简单的函数，用于合成并编译一个\
  \ Keras 模型，其中内置了一些可调参数：\n\n```python\nfrom tf.keras.models import Sequential\nfrom\
  \ tf.keras.layers import Dense\ndef create_model():\n    # 创建模型\n    model = Sequential()\n\
  \    model.add(Dense(30, input_dim=8, activation='relu'))\n    model.add(Dense(15,\
  \ activation='relu'))\n    model.add(Dense(1, activation='sigmoid'))\n    # 编译模型\n\
  \    model.compile(loss='binary_crossentropy', optimizer='adam', metrics=['accuracy'])\n\
  \    return model\n```\n\n你将使用流行的 Pima Indians Diabetes 数据集（[`www.kaggle.com/uciml/pima-indians-diabetes-database`](http://www.kaggle.com/uciml/pima-indians-diabetes-database)）处理一个简单的二分类任务。该数据集最初来自美国国立糖尿病、消化和肾脏疾病研究所（[`www.niddk.nih.gov/`](http://www.niddk.nih.gov/)）。数据集的目的是根据其中包含的某些诊断测量值，诊断性地预测患者是否患有糖尿病。\n\
  \n你进行了一些最小限度的数据预处理，包括使用 scikit-learn 的 `MinMaxScaler` 对特征数据进行缩放。你可以将这个 `X_scaled`\
  \ 向量传递给将要创建的特殊包装类。\n\n\n\n### `KerasClassifier`类\n\n这是来自 Keras 的特殊封装类，它将 scikit-learn\
  \ 分类器 API 与 Keras 参数化模型结合在一起。你可以将对应于`create_model`函数的各种模型参数以及其他超参数（如`epochs`和`batch_size`）传递给该类。代码如下：\n\
  \n```\nfrom tf.keras.wrappers.scikit_learn import KerasClassifier\nmodel = KerasClassifier(build_fn=create_model,\n\
  epochs=10,\nbatch_size=32,\nverbose=0)\n```\n\n注意，你将模型创建函数作为`build_fn`参数传递。这是 Python\
  \ 中将函数作为一等对象使用的示例（[`https://dbader.org/blog/python-first-class-functions`](https://dbader.org/blog/python-first-class-functions)），你可以将函数作为常规参数传递给其他类或函数。\n\
  \n目前，你已经固定了`batch_size`和`epochs`的数量，因为你只想对该模型运行交叉验证。稍后，你将把它们视为超参数，并进行全面的网格搜索以找到最佳组合。\n\
  \n### 使用 scikit-learn API 进行交叉验证\n\n以下是使用 Keras 模型进行 10 折交叉验证的代码。首先，你必须从 scikit-learn\
  \ 的`model_selection`模块中导入评估器。然后，你可以使用以下代码简单运行模型，其中传递了你之前构建的`KerasClassifier`对象以及特征向量和目标向量。这里的重要参数是`cv`，你传递了`kfold`对象。这告诉`cross_val_score`评估器在\
  \ 10 折分层交叉验证设置中，使用提供的数据运行 Keras 模型。\n\n```\nfrom sklearn.model_selection import\
  \ StratifiedKFold\nfrom sklearn.model_selection import cross_val_score\nnum_folds\
  \ = 10\nkfold = StratifiedKFold(n_splits=num_folds,\nshuffle=True)\ncv_results =\
  \ cross_val_score(model,\nX_scaled, Y,\ncv=kfold,\nverbose=2)\n```\n\n输出变量`cv_results`是一个由所有准确率分数组成的\
  \ NumPy 数组。`accuracy`（准确率）是你在模型编译过程中编码的度量标准。显然，你可以选择任何其他分类度量标准，如`precision`（精确率）或`recall`（召回率），在这种情况下，该度量标准将被计算并存储在`cv_results`数组中。\n\
  \n你可以轻松计算 10 折交叉验证运行的平均值和标准差，以估计模型预测的稳定性。这是交叉验证运行的主要用途之一，现在你可以使用此方法评估任何 Keras 模型的稳定性。\n\
  \n### 使用更新后的模型进行网格搜索\n\n在此示例中，你将搜索以下超参数：\n\n*   激活函数\n*   优化器类型\n*   初始化方法\n*  \
  \ 批量大小\n*   迭代轮数\n\n然而，要使此功能生效，你必须将前三个参数集成到模型定义代码中：\n\n```\ndef create_model_grid(activation\
  \ = 'relu',\noptimizer='rmsprop',\ninit='glorot_uniform'):\n# create model\nmodel\
  \ = Sequential()\nif activation=='relu':\nmodel.add(Dense(12, input_dim=8,\nkernel_initializer=init,\
  \ activation='relu'))\nmodel.add(Dense(8, kernel_initializer=init, activation='relu'))\n\
  if activation=='tanh':\nmodel.add(Dense(12, input_dim=8,\nkernel_initializer=init,\
  \ activation='tanh'))\nmodel.add(Dense(8, kernel_initializer=init, activation='tanh'))\n\
  if activation=='sigmoid':\nmodel.add(Dense(12, input_dim=8,\nkernel_initializer=init,\
  \ activation='sigmoid'))\nmodel.add(Dense(8, kernel_initializer=init, activation='sigmoid'))\n\
  model.add(Dense(1, kernel_initializer=init, activation='sigmoid'))\n# Compile model\n\
  model.compile(loss='binary_crossentropy',\noptimizer=optimizer,\nmetrics=['accuracy'])\n\
  return model\n```\n\n然后，你创建与之前相同的`KerasClassifier`对象，但将其命名为`model_grid`：\n\n```\n\
  model_grid = KerasClassifier(build_fn=create_model_grid, verbose=0)\n```\n\n将穷举超参数搜索空间大小设为**3\
  \ × 3 × 3 × 3 × 3 = 243**。请注意，Keras 的实际运行次数还取决于你选择的交叉验证折数，因为交叉验证将用于每组参数组合。总共有 729\
  \ 次模型拟合，即 243 个参数组合中的每个组合都进行 3 次交叉验证。如果你不喜欢完整的网格搜索，总是可以尝试随机网格搜索。\n\n图 5-27 展示了此穷举网格搜索的选项。\n\
  \n![](img/518852_1_En_5_Fig27_HTML.jpg)\n\n**图 5-27**：穷举网格搜索选项\n\n你必须创建一个搜索参数字典，并将其传递给\
  \ scikit-learn 的`GridSearchCV`评估器：\n\n```\nfrom sklearn.model_selection import GridSearchCV\n\
  param_grid = dict(activation =  activations,\noptimizer = optimizers,\nepochs =\
  \ epochs,\nbatch_size = batches,\ninit = initializers)\ngrid = GridSearchCV(estimator\
  \ = model_grid,\nparam_grid = param_grid,\ncv = 3,\nverbose = 2,)\n```\n\n你设置`cv\
  \ = 3`以减少运行时间。默认情况下，如果你省略该参数，scikit-learn 会将其设置为 5。\n\n**选择何种详细程度？**\n\n建议将`GridSearchCV`的`verbose`（详细程度）设置为\
  \ 2，以便直观地跟踪运行过程。不过，请记住为主`KerasClassifier`类保持`verbose=0`，因为你可能不希望显示训练单个轮次时所有琐碎的细节。\n\
  \n之后，只需使用缩放后的特征数据和标签进行拟合！\n\n```\ngrid_result = grid.fit(X_scaled, Y)\n```\n\n结果如何？与标准\
  \ scikit-learn 评估器的预期结果一样，所有参数都内部存储以供探索（图 5-28）。\n\n![](img/518852_1_En_5_Fig28_HTML.jpg)\n\
  \n**图 5-28**：包含所有参数的拟合后网格搜索评估器\n\n你可以通过已拟合评估器的`best_score_`和`best_params_`属性找到最佳组合。图\
  \ 5-29 展示了快照。\n\n![](img/518852_1_En_5_Fig29_HTML.jpg)\n\n**图 5-29**：最佳超参数选择的快照\n\
  \n你使用`ReLU`激活函数和`Adam`优化器进行了初始的 10 折交叉验证，得到了 0.691 的平均准确率。在进行穷举网格搜索后，你发现对于此问题，`tanh`激活函数和`rmsprop`优化器可能是更好的选择。\n\
  \n从网格搜索结果中创建 pandas DataFrame 并进一步分析也是非常简单的。你将平均分和标准差分数包含在此表中。\n\n```\nimport pandas\
  \ as pd\nparams = grid_result.cv_results_['params']\nd = pd.DataFrame(params)\n\
  d['Mean'] = grid_result.cv_results_['mean_test_score']\nd['Std. Dev'] = grid_result.cv_results_['std_test_score']\n\
  ```\n\nDataFrame 看起来如图 5-30 所示。\n\n![](img/518852_1_En_5_Fig30_HTML.jpg)\n\n**图\
  \ 5-30**：从网格搜索参数创建的 DataFrame\n\n你可以从该数据集中创建有针对性的可视化图表，以检查哪些超参数能够提高性能并减少准确率度量标准的波动。图\
  \ 5-31 展示了一些示例。\n\n![](img/518852_1_En_5_Fig31_HTML.jpg)\n\n**图 5-31**：网格搜索结果的可视化\n\
  \n\n\n## 摘要\n\n本章围绕如何让常用的深度学习代码与任务更具生产力和效率这一核心思想，探讨了多个主题。我延续了前一章中代码模块化的理念，并通过 Keras\
  \ 框架中实用的模型构建与绘图函数，提供了具体示例。此外，本章还讨论了一种名为 Keras 回调的强大构造。\n\n接下来，我探讨了如何简化数据科学家最常遇到的深度学习任务之一：图像分类。目标是构建一个单一的实用函数，为用户提供极其简单的\
  \ API。您只需向此函数传递一个文件夹名称，它就能通过处理该文件夹中的所有图像，返回一个经过完整训练的卷积神经网络模型。我们不仅逐步构建了这个函数，还通过将其应用于一个完全不同的数据集，演示了此类\
  \ API 的实用价值。\n\n在下一部分中，您进一步使用此函数，并将其与一个能够提取并可视化深度学习模型各卷积层激活图的专用库集成。基本上，您演示了如何仅用几行代码就能可视化复杂深度学习模型的内部工作原理。这两部分共同体现了通往高效且富有生产力的数据科学（涵盖深度学习）的真正旅程。\n\
  \n最后，您探讨了如何轻松无缝地进行超参数搜索这个主题。尽管有许多专用库和框架可以完成此任务，但您看到了一种简单直观的方法，即使用 `scikit-learn`\
  \ 中的网格搜索工具以及 Keras 的一些特殊包装类。这也展示了 Keras 和 `scikit-learn` 这两个最流行的机器学习库如何无缝协同工作。\n\
  \n让深度学习代码和产品变得快速高效本身就是一个巨大的课题。有无数的研究方法和方向专注于这一点。本章仅旨在引入一些基础概念，以便您可以进行更深入的探索。\n\n"
- "# 6. 构建你自己的机器学习估算器/包\n\n本章开头，我沿用第 4 章的观点：*数据科学家通常来自与传统计算机科学/软件工程截然不同的背景*，例如物理学、生物学、统计学、经济学和电气工程。图\
  \ 6-1 证实了这一点。\n\n![](img/518852_1_En_6_Fig1_HTML.jpg)\n\n**图 6-1** 数据科学家来自各种各样的领域和专业背景。来源：“[数据科学家来自何处](https://medium.com/indeed-engineering/where-do-data-scientists-come-from-fc526023ace)？”\
  \ ([*https://medium.com/indeed-engineering/where-do-data-scientists-come-from-fc526023ace*](https://medium.com/indeed-engineering/where-do-data-scientists-come-from-fc526023ace))\n\
  \n但最终，数据科学家需要掌握足够的编程/软件工程技能，才能对其组织和业务产生真正的影响。即使数据科学家不编写机器学习平台/服务的最终生产代码，他们也期望能够与经验丰富的软件开发团队进行高度集成的工作。这对于确保顺畅的交付体验、机器学习产品的完美执行，以及当然，实现期望的业务成果至关重要。\n\
  \n这意味着数据科学家必须学习如何高效地编写机器学习代码（无论是最终模型还是仅用于实验的原型）。\n\n-   代码必须有恰当的**组织**和**模块化**，以便能够与标准的软件工程工具和技术良好对接。\n\
  -   代码中必须有一定程度的**自动化**，以减少探索、评估和试验数据与模型的时间。\n-   数据科学家必须能够自如地编写**功能和模块测试**、**融入面向对象原则**等。\n\
  -   数据科学家还必须养成为其代码编写良好**文档**的习惯，以便其他开发者可以重用和阅读。\n\n在第 4 章和第 5 章中，我触及了其中一些概念，特别是模块化和面向对象编程原则。本章将带领你经历开发一个轻量级但实用的机器学习包的过程，让你体验为数据科学制作完整软件的诸多方面。根据我的经验，编写（并发布）一个机器学习包这项练习，能给任何即将入行的数据科学家上几堂宝贵的课。\n\
  \n## 为什么要开发你自己的机器学习包？\n\n对于上述问题，有一个非常简洁的答案：*以便他人（世界各地的任何人）能够使用你的工作成果并从中受益*。\n\n\
  想象一下那种感觉。你的代码不再局限于一个独立的 Jupyter notebook。它首先被恰当地结构化和模块化，这样你就可以像使用你最喜欢的 Python 库（例如\
  \ `NumPy` 和 `pandas`）一样调用其中的有用方法。更进一步，你将代码打包成一个可下载的 Python 库，这样世界上的任何人都可以通过一个简单的\
  \ `pip` 命令安装它，并开始从你的工作中受益。这个想法在图 6-2 中得到了简单说明。\n\n![](img/518852_1_En_6_Fig2_HTML.jpg)\n\
  \n**图 6-2** 从 Jupyter notebook 到 PyPi 安装包\n\n经历此过程的一些步骤（及相关学习要点）如下：\n\n-   **代码组织思维**：发布一个开源的\
  \ Python 包会迫使数据科学家精心规划和组织他们的代码和模块。\n-   **编写文档字符串**：在高度欢迎协作的高质量开源包中，文档字符串是一项基本的良好实践。数据科学家在此过程中将学到其价值。好的文档字符串甚至可能为包带来高质量的文档（通常维护在\
  \ `readthedoc.io` 等网站上）。\n-   **单元测试和功能测试**：测试对良好软件开发的重要性怎么强调都不为过。对于数据科学来说，测试带来了其自身的挑战。包的开发通常包括编写一套基本的测试用例。这将在数据科学家的技能储备中添加一项具有根本价值的能力。\n\
  -   **GitHub 提交和动作**：虽然发布开源包并非严格必需，但强烈建议建立一个 GitHub 仓库和 GitHub actions（例如，基于代码更改或提交触发的命令），以便长期维护和更新包（例如，发布新版本或修复错误）。\n\
  \n讨论所有这些方面超出了本书的范围。因此，我将主要专注于从头开始构建代码结构。不过，网上有很多关于如何编写优秀文档字符串或为开源包设置 GitHub actions\
  \ 的优秀教程，鼓励你去探索。\n\n## 一个数据科学家的示例\n\n有一些教程和指南涉及教授数据科学家面向对象编程和模块化编码的原则。然而，几乎所有这些都是标准的、现成的面向对象编程示例，并不吸引数据科学家。让我举例说明我的意思。\n\
  \n\n\n### 一个算术示例\n\n如果有人让你编写一个程序，实现对两个变量 `a` 和 `b` 的加、减、乘、除运算，你最可能怎么做？你很可能打开一个 Jupyter\
  \ notebook，在单元格中输入以下内容，然后按下 Shift-Enter，得到结果：\n\n```\na+b\na-b\na*b\na/b\n```\n\n\
  如果你喜欢用函数来整理代码，那么你可能会这样做：\n\n```\ndef add(a,b):\nreturn a + b\ndef subtract(a,b):\n\
  return a - b\n...\n```\n\n但是，你会进一步定义一个 `Calc` 类（包含一个初始化方法），并将这些函数作为方法放入该类中吗？这些都是性质类似的操作，并且处理类似的数据。为什么不将它们封装在一个更高级的对象中呢？为什么不采用下面的代码呢？\n\
  \n```\nclass Calc:\ndef __init__(self,a,b):\nself.a = a\nself.b = b\ndef add(self):\n\
  return self.a+self.b\ndef sub(self):\nreturn self.a-self.b\ndef mult(self):\nreturn\
  \ self.a*self.b\ndef div(self):\nreturn self.a/self.b\n```\n\n不，你很可能不会这样做。对于这个问题来说，这样做也没有意义。但这个想法是合理的：如果你有可以在逻辑上组合的数据和函数（在面向对象编程的术语中称为方法），那么它们应该被封装在一个类中。\n\
  \n但仅仅为了快速得到一些简单数值计算的结果，这看起来工作量太大了。那么，意义何在？数据科学家通常以能否找到数据问题的正确答案来衡量，而不是看他们在代码中使用了多么复杂精美的编程结构。\n\
  \n这类示例常被用来向数据科学家传授面向对象编程原则。它们是非常好的示例，涵盖了编写优秀的面向对象 Python 代码所需的所有必要知识。然而，由于最终产品可能相当刻板（比如一个算术计算器），所以缺少了一点火花。\n\
  \n### 数据科学家一直在使用面向对象编程\n\n如果数据科学家不这样编码，那是不是意味着他们真的不需要使用这些复杂的编程结构呢？\n\n错误。\n\n数据科学家在不知不觉中大量利用了面向对象编程范式的优势。一直在利用。\n\
  \n你还记得 `import matplotlib.pyplot as plt` 之后的 `plt.plot` 吗？那些 `.` 符号？你当时就接触到了一点面向对象编程。\n\
  \n或者你还记得在 Jupyter notebook 中学会的一个酷炫技巧：输入一个点（`.`）后按 Tab 键，就可以显示所有与该对象关联的函数（见图 6-3）吗？\n\
  \n![](img/518852_1_En_6_Fig3_HTML.jpg)\n\n图 6-3\n\n面向对象编程范式使得访问方法和参数变得容易\n\n这个例子展示了对逻辑一致性的遵循。如果不遵循面向对象编程范式，我们可能不得不将函数命名为\
  \ `linear_model_linear_regression_fit`、`linear_model_linear_regression_predict`\
  \ 等等。它们将无法被分组在同一个逻辑单元下。\n\n为什么这样？因为它们是不同的函数，并且处理不同的数据集。`fit` 函数需要训练特征和训练目标，而 `predict`\
  \ 只需要测试数据集。`fit` 函数不期望返回任何东西，而 `predict` 函数期望返回一组预测值。\n\n那么，为什么它们会出现在同一个下拉菜单中呢？尽管功能不同，但它们有一个共同点，即都可以被视为整个线性回归过程中的基本组成部分。我们期望一个线性回归模型能够拟合一些训练数据，然后能够对未见过的未来数据进行预测。我们还期望线性回归模型能够提供一些关于拟合优度的指示，通常以单个数值或得分的形式呈现，称为回归系数或\
  \ *R*²。正如预期的那样，我们看到一个 `score` 函数，它正好返回那个 *R*² 数值，也位于 `fit` 和 `predict` 旁边。这既简洁又干净。*数据、函数和参数共存于一个单一的逻辑单元中*（图\
  \ 6-4）。\n\n![](img/518852_1_En_6_Fig4_HTML.jpg)\n\n图 6-4\n\n数据、函数和参数共存于一个单一的逻辑单元中\n\
  \n### 它是如何实现的？\n\n这之所以成为可能，是因为有人（scikit-learn 项目的开发者）将线性回归视为一个高级过程，并决定了它应该提供哪些基本操作，以及应该告知用户哪些关键参数。有人创建了一个名为\
  \ `LinearRegression` 的高级类，所有那些看似不相关的函数都可以被归入其中，以便于管理和提升可用性。\n\n作为数据科学家，一旦你从库中导入这个类，你只需创建该类的一个实例（命名为\
  \ `lm`）。仅此而已。所有归入该类的函数，都可以通过这个新定义的实例访问。如果你对某些函数的内部实现不满意，你可以对其进行修改，并在修改后重新挂接到主类上。只有内部函数的代码发生变化，其他一切不变。图\
  \ 6-5 直观地展示了这个思想。\n\n![](img/518852_1_En_6_Fig5_HTML.png)\n\n图 6-5\n\n根据需要将函数和方法附加到类上\n\
  \n在接下来的章节中，你将逐步了解从头开始构建这样一个有用的机器学习估算器所涉及的步骤和思考过程。你将从一个基础的数据和参数开始，根据需要添加方法，并将它们归入合适的逻辑单元下。\n\
  \n## 线性回归估算器——增添一点新意\n\n传统的面向对象编程入门教程会大量使用诸如动物、运动、几何形状等类的示例。但对于数据科学家来说，为什么不以他们在代码中每天都会用到的对象——机器学习估算器——为例来阐述这些概念呢？它就像上面图片中展示的来自\
  \ scikit-learn 库的 `LinearRegression` 对象一样。\n\n接下来，你将逐步构建一个遵循面向对象编程范式的简单线性回归（单变量或多变量）估算器类。是的，就是那个经典的线性回归类。它拥有与\
  \ scikit-learn 中 `LinearRegression` 类类似的常规 `fit` 和 `predict` 方法。但它增添了一点新意：*它提供了更多功能*。图\
  \ 6-6 展示了其中一二。\n\n![](img/518852_1_En_6_Fig6_HTML.jpg)\n\n图 6-6\n\n一个带有额外统计函数和绘图工具的线性回归估算器\n\
  \n如上所示，这个估算器比 scikit-learn 的估算器更丰富，因为它除了标准的 `fit`、`predict` 和 *R*² 得分函数外，还拥有一系列其他对线性回归建模任务至关重要的工具，特别适用于那些不仅想要预测，还希望进行以下操作的数据科学家和统计建模人员：\n\
  \n*   衡量拟合优度\n*   验证线性回归的假设\n*   检查数据中的多重共线性\n*   检测异常值\n\n让我们看看如何开始构建它。\n\n## 如何开始构建这个类？\n\
  \n在本节中，我将展示如何从机器学习估算器开始，并添加基本方法。接下来的部分将涵盖添加更多实用函数、对它们进行分组等内容。然而，我想指出的是，为简洁起见，将跳过大量实际代码，仅通过代码片段展示核心概念。要获取完整代码，你可以查看本书附带的\
  \ Jupyter notebook 或 Python 脚本文件。\n\n\n\n### 基类定义\n\n我们先从一个简单的代码片段开始，定义基类：`MyLinearRegression`。这里，`self`\
  \ 代表对象本身，而 `__init__` 是一个特殊函数，当在代码中某处创建类的实例时会被调用。顾名思义，`__init__` 可用于用必要的参数（如果有）初始化类。我们再添加一个包含\
  \ `__repr__` 方法的简单描述符。\n\n```\nimport numpy as np\n\nclass MyLinearRegression:\n\
  \    def __init__(self, fit_intercept=True):\n        self.coef_ = None\n      \
  \  self.intercept_ = None\n        self._fit_intercept = fit_intercept\n\n    def\
  \ __repr__(self):\n        return \"I am a Linear Regression model!\"\n```\n\n这些带有双下划线的方法（`__init__`\
  \ 和 `__repr__`）在 Python 类中具有特殊用途，被称为**特殊方法**。\n\n### 什么是特殊方法？\n\n它们是 Python 类定义中的**魔术方法**，可以帮助为自定义类重写内置函数的功能。之所以这样称呼，是因为它们的名称中带有双下划线。一些常见的有：\n\
  \n- `__init__`：用默认参数和状态初始化类\n- `__repr__`：类的通用描述\n- `__str__`：当用 `print` 函数打印类时，返回类某个属性的字符串描述\n\
  - `__len__`：返回类/对象的长度（在合理的情况下，例如，如果类代表某种集合或数组）\n\n这里有一篇关于它们的好文章：“Python 中的特殊/魔术方法”\
  \ (`www.section.io/engineering-education/dunder-methods-python/`)。\n\n基本上，你现在可以实例化一个对象并打印它：\n\
  \n```\nmlr = MyLinearRegression()\nprint(mlr)\n>> I am a Linear Regression model!\n\
  ```\n\n### 添加实用方法\n\n到目前为止，你有一个正确但无用的类定义，因为它没有执行任何机器学习任务。在本节中，你将开始添加一些有用的方法，并了解如何测试它们。\n\
  \n#### 拟合方法\n\n首先，让我们为 ML 估计器添加最有用的方法：`fit` 方法，它执行与给定数据的训练/拟合。这是代码。请注意，此函数定义将放在基类内部。\n\
  \n```\ndef fit(self, X, y):\n    \"\"\"\n    Fit model coefficients.\n\n    Arguments:\n\
  \    X: 1D or 2D numpy array\n    y: 1D numpy array\n    \"\"\"\n    # Data type\
  \ check and conversion\n    if type(X) is not np.ndarray:\n        try:\n      \
  \      X = np.array(X)\n        except:\n            print(\"Could not convert features\
  \ to Numpy array\")\n            return None\n    if type(y) is not np.ndarray:\n\
  \        try:\n            y = np.array(y)\n        except:\n            print(\"\
  Could not convert labels to Numpy array\")\n            return None\n    # check\
  \ if X is 1D or 2D array\n    if len(X.shape) == 1:\n        X = X.reshape(-1, 1)\n\
  \    # add bias if fit_intercept is True\n    if self._fit_intercept:\n        X_biased\
  \ = np.c_[np.ones(X.shape[0]), X]\n    else:\n        X_biased = X\n    # closed\
  \ form solution\n    xTx = np.dot(X_biased.T, X_biased)\n    inverse_xTx = np.linalg.inv(xTx)\n\
  \    xTy = np.dot(X_biased.T, y)\n    coef = np.dot(inverse_xTx, xTy)\n    # set\
  \ attributes\n    if self._fit_intercept:\n        self.intercept_ = coef[0]\n \
  \       self.coef_ = coef[1:]\n    else:\n        self.intercept_ = 0\n        self.coef_\
  \ = coef\n```\n\n代码很长，但借助文档字符串和精心添加的注释，它不言自明。你使用 NumPy 矩阵求逆（`np.linalg.inv`）从普通最小二乘法（`en.wikipedia.org/wiki/Ordinary_least_squares`）的角度解决线性回归问题，并获得最佳拟合系数。同时，注意开头的**基本检查**（`if\
  \ type(X) is not np.ndarray`）和数据形状的变换（`X = X.reshape(-1, 1)`），以确保线性代数计算无误。\n\n####\
  \ 测试该方法\n\n让我们通过生成一些随机数据来测试这个方法：\n\n```\nX = 10 * np.random.random(size=(20, 2))\n\
  y = 3.5 * X.T[0] - 1.2 * X.T[1] + np.random.randn(20)\n```\n\n因此，在 2D 向量 `X` 和 1D\
  \ 向量 `y` 之间存在线性关系。你可以在图 6-7 中可视化这种线性关系（注意数据中添加了刻意为之的噪声）。\n\n![](img/518852_1_En_6_Fig7_HTML.jpg)\n\
  \n**图 6-7** 测试（随机生成的）数据图\n\n创建一个新实例：\n\n```\nmlr = MyLinearRegression()\n```\n\n\
  你可以尝试打印系数（`mlr.coef_`），但要先检查 `mlr.fitted_` 状态。如果未拟合，则打印该消息。\n\n```\nif mlr.fitted_:\n\
  \    print(\"Regression coefficients:\", mlr.coef_)\nelse:\n    print(\"Not fitted\
  \ yet\")\n>> Not fitted yet\n```\n\n然后进行拟合，如下所示：\n\n```\nmlr.fit(X, y)\n```\n\n\
  现在，对于相同的打印系数的代码，你将得到预期的结果：\n\n```\nif mlr.fitted_:\n    print(\"Regression coefficients:\"\
  , mlr.coef_)\nelse:\n    print(\"Not fitted yet\")\n>> Regression coefficients:\
  \ [ 3.40807972 -1.23152211]\n```\n\n因此，实际系数是 3.5 和 -1.2，但由于添加了随机噪声，你得到的最佳拟合系数约为\
  \ 3.4 和 -1.23。你还可以得到截距，如下所示：\n\n```\nprint(\"The intercept term is given by: \"\
  , mlr.intercept_)\n>> The intercept term is given by:  0.7673816772685598\n```\n\
  \n请注意，**估计的系数和截距每次运行此代码时都会改变**，因为数据生成过程中添加了随机噪声。\n\n#### 预测方法\n\n现在，让我们向类中添加 `predict`\
  \ 方法：\n\n```\ndef predict(self, X):\n    \"\"\"\n    Output model prediction.\n\n\
  \    Arguments:\n    X: 1D or 2D numpy array\n    \"\"\"\n    # check if X is 1D\
  \ or 2D array\n    if len(X.shape) == 1:\n        X = X.reshape(-1, 1)\n    # Calculates\
  \ only if already fitted\n    if self.fitted_:\n        self.predicted_ = self.intercept_\
  \ + np.dot(X, self.coef_)\n    else:\n        print(\"Not fitted yet\")\n      \
  \  return None\n    return self.predicted_\n```\n\n#### 测试预测\n\n你使用旧的（训练）数据进行拟合，并使用一组新点进行预测。以下是测试的示例代码：\n\
  \n```\nnum_new_samples = 10\nX_new = 10 * np.random.random(size=(num_new_samples,\
  \ 2))\ny_new = 3.5 * X_new.T[0] - 1.2 * X_new.T[1] + np.random.randn(num_new_samples)\n\
  \nmlr = MyLinearRegression()\nmlr.fit(X, y)\ny_pred = mlr.predict(X_new)\n```\n\n\
  当你绘制预测值与真实值时，将得到如图 6-8 所示的结果。\n\n![](img/518852_1_En_6_Fig8_HTML.jpg)\n\n**图 6-8**\
  \ y 向量的预测值与真实值\n\n现在你已经解决了基本方法，接下来让我们讨论添加一些实用方法，例如可视化和统计分析。\n\n### 添加实用方法\n\n此时，你可以开始扩展你的回归类，并添加即使标准\
  \ `scikit-learn` 类中也不存在的功能！例如，你总是希望看到拟合值与真实值的比较。这正是上面绘制的内容。但与其让那段代码散落在 Jupyter notebook\
  \ 中，你可以为此创建一个函数并将其添加到类中。\n\n\n\n### 绘制真实值与预测值图表的方法\n\n我们将此方法命名为 `plot_fitted`。请注意，方法如同普通函数，可以接受额外参数。此处有一个参数\
  \ `reference_line`（默认设为 `False`），用于在拟合值与真实值图上绘制一条 45 度参考线。此外，请注意文档字符串中的说明。\n\n```\n\
  def plot_fitted(self,reference_line=False):\n\"\"\"\n绘制拟合值与真实输出值的对比图\n参数：\nreference_line:\
  \ 布尔开关，用于在图上绘制 45 度参考线\n\"\"\"\nif self.fitted_:\ny_pred = np.dot(X,self.coef_)\
  \ + self.intercept_\nplt.title(\"真实值与拟合值\",fontsize=14)\nplt.scatter(y,y_pred,\n\
  s=150,alpha=0.75,\ncolor='orange',\nedgecolor='k')\nif reference_line:\nplt.plot(y,y,c='k',linestyle='dotted')\n\
  plt.xlabel(\"真实值\")\nplt.ylabel(\"拟合值\")\nplt.grid(True)\nplt.show()\nelse:\nprint(\"\
  尚未拟合\")\nreturn None\n```\n\n请注意，绘图代码内部进行了预测（`y_pred = np.dot(X, self.coef_) + self.intercept_`），然后使用该向量进行绘图。和往常一样，只有在确保已有数据被拟合后（`if\
  \ self.fitted_`），才会执行绘图代码。\n\n以下代码展示了此方法的实用性。仅需三行代码，你就能创建一个全新的估计器，拟合数据，并绘制真实值与预测值的对比图！\n\
  \n```\n# 创建一个新的估计器\nmlr = MyLinearRegression()\n# 用数据拟合\nmlr.fit(X, y)\n# 调用 'plot_fitted'\
  \ 方法\nmlr.plot_fitted()\n```\n\n图 6-9 展示了结果。它与图 6-8 类似，但使用的是内置方法而非独立代码。\n\n![](img/518852_1_En_6_Fig9_HTML.jpg)\n\
  \n图 6-9\n\n使用内置绘图工具绘制的预测值与真实值对比图\n\n以下是可以添加的更多实用绘图工具：\n\n*   **配对图**（绘制所有特征与输出之间的配对关系，非常类似于\
  \ R 语言中的 `pairs` 函数）\n*   **拟合值与残差图**（属于线性回归的诊断图，用于检验回归基本假设的有效性，参考链接：[`https://towardsdatascience.com/how-do-you-check-the-quality-of-your-regression-model-in-python-fa61759ff685`](https://towardsdatascience.com/how-do-you-check-the-quality-of-your-regression-model-in-python-fa61759ff685)）\n\
  *   残差的**直方图**和**分位数-分位数 (Q-Q) 图**（用于检验误差分布的正态性假设）\n\n### 各类误差度量指标\n\n你可以像这样在基类中添加一系列误差度量指标：\n\
  \n```\ndef sse(self):\n'''返回误差平方和（模型值与实际值）'''\nsquared_errors = (self.resid_) **\
  \ 2\nself.sq_error_ = np.sum(squared_errors)\nreturn self.sq_error_\ndef sst(self):\n\
  '''返回总平方和（实际值与平均值）'''\navg_y = np.mean(self.target_)\nsquared_errors = (self.target_\
  \ - avg_y) ** 2\nself.sst_ = np.sum(squared_errors)\nreturn self.sst_\ndef r_squared(self):\n\
  '''返回计算得到的 r² 值'''\nself.r_sq_ = 1 - self.sse()/self.sst()\nreturn self.r_sq_\n\
  # 更多度量指标在此处\ndef pretty_print_stats(self):\n'''返回给定模型对象的统计报告'''\nitems = ( ('sse:',\
  \ self.sse()), ('sst:', self.sst()),\n('mse:', self.mse()), ('r²:', self.r_squared()),\n\
  ('adj_r²:', self.adj_r_squared()))\nfor item in items:\nprint('{0:8} {1:.4f}'.format(item[0],\
  \ item[1]))\n```\n\n为了让上述代码生效，你必须在拟合数据时计算一个关键属性——*残差*（`self.resid_`）。因此，当然要将该代码添加到\
  \ `fit` 方法中：\n\n```\n# 特征与数据\nself.features_ = X\nself.target_ = y\n\n# 预测的/拟合的\
  \ y 值\nself.predicted_ = np.dot(X, self.coef_) + self.intercept_\n# 残差\nself.resid_\
  \ = self.target_ - self.predicted_\n```\n\n然而，与其用这么多方法把基类弄得杂乱无章，不如回到逻辑一致性和分组的思路上，利用更多面向对象编程（OOP）原则来更好地组织代码。让我们在下一节中看看如何实现。\n\
  \n## 以面向对象编程风格完成更多工作\n\n当你满怀热情地计划向类中添加实用方法时，你意识到这种方法可能会使主类的代码变得非常冗长且难以调试。为了解决这个难题，你可以利用面向对象编程中另一个精妙的原则——继承（参考链接：[`www.geeksforgeeks.org/inheritance-in-python/`](http://www.geeksforgeeks.org/inheritance-in-python/)）。\n\
  \n### 分离绘图类\n\n你意识到并非所有绘图都属于同一类型。配对图以及拟合值与真实数据图性质相似，因为它们可以仅从数据中衍生出来。而其他绘图则与拟合优度和残差相关。因此，你可以创建两个独立的类来包含这些绘图函数：`Data_plots`\
  \ 和 `Diagnostic_plots`。此外，你还可以根据这些工具类来定义主类 `MyLinearRegression`。这便是继承的一个实例。整个方法如图\
  \ 6-10 所示。\n\n![](img/518852_1_En_6_Fig10_HTML.png)\n\n图 6-10\n\n定义若干个不同的绘图类并在基类中使用它们\n\
  \n`Diagnostic_plots` 的部分代码如下：\n\n```\nclass Diagnostics_plots:\n\"\"\"\n诊断图及相关方法\n\
  参数：\nfitted_vs_residual: 绘制拟合值与残差对比图\nfitted_vs_features: 以网格形式绘制残差与所有特征变量的对比图\n\
  histogram_resid: 绘制残差直方图（可归一化）\nshapiro_test: 对残差执行 Shapiro-Wilk 正态性检验\nqqplot_resid:\
  \ 创建残差的分位数-分位数图，与正态分布进行比较\n\"\"\"\ndef __init__():\npass\ndef fitted_vs_residual(self):\n\
  \"\"\"绘制拟合值与残差对比图\"\"\"\n```\n\n而对于 `Data_plots`：\n\n```\nclass Data_plots:\n\"\"\
  \"\n数据相关绘图的方法\npairplot: 创建所有变量与目标变量的配对图\nplot_fitted: 绘制拟合值与数据中真实输出值的对比图\n\"\"\"\
  \ndef __init__():\npass\ndef pairplot(self):\n\"\"\"使用 Seaborn 库创建所有变量与目标变量的配对图\"\
  \"\"\nif not self.is_fitted:\nprint(\"模型尚未拟合！\")\nreturn None\n```\n\n因此，主类的定义现在略有改变：\n\
  \n```\nclass MyLinearRegression(Data_plots, Diagnostics_plots):\ndef __init__(self,\
  \ fit_intercept=True):\nself.coef_ = None\nself.intercept_ = None\nself._fit_intercept\
  \ = fit_intercept\n```\n\n类定义 `MyLinearRegression(Data_plots, Diagnostics_plots)`\
  \ 允许主类继承在绘图类中定义的所有实用绘图方法。现在，你可以通过仅三四行代码绘制诊断图和数据图来检查回归拟合的质量：\n\n```\nmlr = MyLinearRegression()\n\
  mlr.fit(X, y)\n```\n\n拟合值与残差图如图 6-11 所示：\n\n![](img/518852_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11\n\n拟合值与残差图\n\n```\nmlr.fitted_vs_residual()\n```\n\n残差直方图（图 6-12）：\n\n\
  ![](img/518852_1_En_6_Fig12_HTML.jpg)\n\n图 6-12\n\n归一化残差直方图\n\n```\nmlr.histogram_resid()\n\
  ```\n\n残差的 Q-Q 图（图 6-13）：\n\n![](img/518852_1_En_6_Fig13_HTML.jpg)\n\n图 6-13\n\n\
  残差的分位数-分位数图\n\n```\nmlr.qqplot_resid()\n```\n\n代码的模块化在此处发挥作用。你可以在不触及主类的情况下修改和改进核心绘图工具。这是一种高度灵活且不易出错的方法，能够提高数据科学家的生产力和效率。\n\
  \n\n\n### 更多支持类与语法糖\n\n为了完整性，请考虑以下内容：\n\n*   用于计算各类回归指标的 `Metrics` 类：SSE、SST、MSE、*R*²\
