  \ `modin.pandas`。\n\n```python\nimport modin.pandas as pd\nimport numpy as np\n\
  raw_data = np.random.randint(0, 100, size=(2**20, 2**8))\ndf = pd.DataFrame(raw_data).add_prefix(\"\
  col\")\n```\n\n当你第一次执行这段代码时，可能会看到一些关于 Dask 集群设置的用户警告和消息（图 9-15） （假设你使用 Dask 后端进行并行处理/集群）。在下一章中，你将了解如何启动和监控\
