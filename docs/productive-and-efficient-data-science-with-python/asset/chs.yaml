  \n要在数据科学领域保持高生产力，你必须紧跟这些新发展，并在合适的场景中拥抱这些专注的实用工具包。在本章中，我将介绍几个这样精巧的包，并通过一些实际示例展示高效数据科学的操作。目的是向你介绍探索的理念，以便你能够充分利用这个伟大的\
  \ Python 数据科学动物园。\n\n## 使用 pdpipe 构建流水线\n\n`pandas` 是 Python 生态系统中用于数据分析和机器学习的出色库。它在数据世界（Excel/CSV\
  \ 文件和 SQL 表所在之处）和建模世界（`scikit-learn` 和 `TensorFlow` 施展魔法之处）之间架起了一座完美的桥梁。\n\n一个数据科学流程通常由一系列步骤组成：在使用强大的机器学习算法之前，数据集必须经过清洗、缩放和验证。当然，这些任务可以通过\
  \ `pandas` 等包提供的许多单步函数/方法来完成。然而，一个优雅的替代方案是使用**流水线**。在几乎所有情况下，流水线都能通过自动化重复性任务来减少出错几率并节省时间。在数据科学世界中，具备流水线特性的包的代表有\
  \ R 语言中的 `dplyr` (`https://dplyr.tidyverse.org/`) 和 Python 生态系统中的 `scikit-learn`\
  \ 模块组合与流水线 (`https://scikit-learn.org/stable/modules/compose.html`)。\n\n`pandas`\
  \ 也提供了一个 `pipe` 方法，可以与用户自定义函数一起用于类似目的。但是，在本节中，我将讨论一个名为 `pdpipe` 的出色小库，它专门针对 `pandas`\
  \ 的 `DataFrame` 解决了流水线化的问题，并以一种优雅直观的方式解决了问题。\n\n## 数据集\n\n你将使用一个 [美国房价](https://www.kaggle.com/vedavyasv/usa-housing)\
  \ 数据集（从 Kaggle 的 `www.kaggle.com/vedavyasv/usa-housing` 下载）。你可以在 `pandas` 中加载该数据集。其汇总统计信息如图\
  \ 7-2 所示。\n\n![图 7-2](img/518852_1_En_7_Fig2_HTML.jpg)\n**图 7-2** 用于演示的数据集的汇总统计信息\n\
  \n然而，这只是一个局部视图。它还包含一个 `Address` 字段（图 7-3），其中包含原始文本数据。这不会出现在上面的汇总统计中，因为它不是数值列。\n\n\
