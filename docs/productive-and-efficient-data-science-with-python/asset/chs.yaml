  \ CPU 核心（图 10-25）。这一点很重要，因为 CPU 核心的默认起始数量可能仅为 1，这无法体现并行处理任务的预期加速效果。关于如何创建此类虚拟机的详细指南，请参阅本文（`https://brb.nci.nih.gov/seqtools/installUbuntu.html`）。如果你使用的是原生\
  \ Linux 或 Mac OS 机器，则可跳过此步骤。\n\n![](img/518852_1_En_10_Fig25_HTML.png)\n\n图 10-25：分配给运行\
  \ Ray 的虚拟机的多个逻辑 CPU 核心\n\n你可以通过 `ray.init()` 方法启动 Ray：\n\n```\nimport ray\nray.init()\n\
  ```\n\n运行此代码后，你可能会看到类似以下输出：\n\n```\n{'node_ip_address': '10.0.2.15',\n'raylet_ip_address':\
