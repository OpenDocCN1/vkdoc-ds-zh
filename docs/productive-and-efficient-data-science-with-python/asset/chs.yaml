  \ *隐藏的宝石*，如图 7-1 所示），它们可以帮助你更快、更高效地完成常见的数据科学工作。它们不像 `NumPy` 或 `pandas` 那样是通用的大型项目。相反，它们专注于类似数据科学任务中的某些特定方面，并将这些方面做得很好。\n\
