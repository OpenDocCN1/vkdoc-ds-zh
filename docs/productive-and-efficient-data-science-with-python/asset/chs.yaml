  for i in range(4):\ndata = np.random.normal(size=(NUM_ROWS, NUM_COLS))\ndata_dict['df'+str(i)]\
  \ = pd.DataFrame(data,\ncolumns=['Col-'+str(i) for i in range(NUM_COLS)])\n```\n\
  \n对于 pandas，你可以编写一个直接返回统计结果的函数：\n\n```\ndef build_stats(df):\nreturn df.describe().T\n\
