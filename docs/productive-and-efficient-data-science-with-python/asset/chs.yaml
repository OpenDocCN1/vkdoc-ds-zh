  \n```\nplot_model(best, plot = 'auc')\n```\n\n这会生成图 12-14 所示的曲线下面积图。\n\n![](img/518852_1_En_12_Fig14_HTML.jpg)\n\
  \n图 12-14  \n单独图表。图片来源：[*https://pycaret.gitbook.io/docs/get-started/quickstart*](https://pycaret.gitbook.io/docs/get-started/quickstart)，经\
  \ PyCaret 创建者许可使用\n\n预测，正如所料，只有一行代码。评估指标在测试集上计算得出。\n\n```\npredict_model(best)\n\
  ```\n\n最后，保存模型（实际上是完整流程）并重新加载也很简单（图 12-15）。\n\n![](img/518852_1_En_12_Fig15_HTML.jpg)\n\
  \n图 12-15  \n保存的模型。图片来源：[*https://pycaret.gitbook.io/docs/get-started/quickstart*](https://pycaret.gitbook.io/docs/get-started/quickstart)，经\
  \ PyCaret 创建者许可使用\n\n```\nsave_model(best, 'my_best_pipeline')\nloaded_model = load_model('my_best_pipeline')\n\
  ```\n\n从这个动手演示中可以清楚地看出，这些库的主要目标之一是通过简化前端 API、减少所需的原始编码行数，甚至以自动驾驶模式帮助运行多个机器学习实验，从而为数据科学实践者节省时间。所有这些目标都与高效数据科学的目标非常契合，因此我坚信，低代码库将在未来成为这一倡议的重要组成部分。\n\
  \n## 总结\n\n本章并非讨论特定主题或某种特定类型的 Python 框架。它是一个主题和技能的集合，数据科学家通常需要在使用高效数据科学议程的实践中并行学习和掌握这些内容。虽然这些技能并不作为明确的组成部分直接出现在数据科学流程中，但它们往往能提供额外的价值和奠定基础。学习它们确实可以放大标准数据科学任务流程的能力和效率。\n\
  \n本着这种学习精神，我首先讨论了学习基本 Web 技术（HTML、CSS 和 JavaScript）的重要性。接着，我谈到了为数据科学项目创建 Web 应用的实用性，并指出数据科学任务的最终成功关键取决于其产生的洞察的传达方式，而交互式\
  \ Web 应用是最好的传达方式。我演示了如何使用 Flask 和 PyWebIO 这两种不同风格的 Python 库构建简单的 Web 应用。\n\n几乎无一例外，Web\
  \ 应用都依赖于云基础设施，这是现代高科技社会的支柱。在数据科学的背景下，我还讨论了诸如亚马逊云服务和谷歌云平台等云技术，以及像 Databricks 和 Saturn\
  \ Cloud 这样专注于数据的平台。我还提供了将云计算的强大能力引入本地数据科学环境的简单流程指引。\n\n最后，我转换了话题，讨论了在许多情况下，使用“低代码”框架对于数据科学任务是多么有用和高效。我使用\
  \ PyCaret（此类工具中一个流行的 Python 库）演示了一个机器学习分类任务，并展示了以低代码为核心的抽象如何使整个数据科学工作变得高效、快速且直观简单。\n\
  \n"
- '# 13. 总结一下


  在过去的 12 章里，你经历了一段漫长而艰辛的旅程。当你开始阅读本书的最后部分时，让我们总结一下这些章节的关键要点和突出内容。这很重要，因为本章我将重点讨论的主题之一是*未曾涉及的内容*。自然，通过审视和回顾*已经涵盖*的内容，你会更好地理解*未曾涉及*的部分。




  ## 第一章


  如同生活中的任何其他计算（及非计算）任务一样，数据科学和机器学习可以以不同程度的效率和生产力来实践。因此，第一章的目标是向你介绍高效且富有成效地执行数据科学任务的好处。我还通过阐述普通数据科学家日常工作中可能存在的陷阱，来强调*高效数据科学*这一核心观点。


  ## 第二章


  第二章的目标是向你介绍某些在开发高效数据科学系统和流程中至关重要的编程风格与习惯的概念。我通过简要示例阐述了这些概念，并讨论了如何衡量或追踪低效问题。文中介绍了编程和算法中时间与空间复杂度的概念，以及大
  O 表示法。随后，我演示了常见低效数据科学和机器学习编码实践的实际示例，让你一窥那些典型低效（但普遍使用）的编码模式，这些模式无法良好扩展，或导致整体系统设计的某些方面效率低下。


  ## 第三章


  在第三章中，我在某种意义上触及了本书的核心。这是一本基于探索使用 Python 编程语言实现高效数据科学的书籍。选择这门语言几乎是理所当然的。毫无疑问，Python
  是全球数据科学家（以及机器学习工程师或人工智能研究员等相关专业人士）使用最广泛、增长最快的编程语言。其流行的一个主要原因，是存在大量专注于数据科学、质量高、功能强大且易于学习的库。


  然而，仅仅因为这些库提供了简便的 API 和平缓的学习曲线，并不意味着每个人都能以高生产力和高效率的方式使用它们。你必须深入探索这些库，理解它们的力量与弱点，才能充分利用它们进行高效的数据科学工作。


  这正是本章的目标：展示*在典型的数据科学任务中，应如何以及为何使用这些库以达到高效*。你从 `Numpy` 库开始，因为它也是 `Pandas` 和 `Scipy`
  的基础。接着，你探索了 `Pandas` 库，随后浏览了 `Matplotlib` 和 `Seaborn` 可视化包。


  ## 第四章


  本章建立在上一章讨论的数据科学家与 Python 语言之间的联系之上。数据科学家通常来自与传统计算机科学/软件工程相去甚远的背景，例如物理、生物、统计、经济和电气工程，他们的工作也大量使用
  Python。虽然 Python 是现代数据驱动分析和人工智能应用中最广泛使用的主流语言，但它也用于简单的脚本编写、自动化任务以及构建 Web 框架后端。事实证明，用于数据科学工作的
  Python 与用于脚本编写和通用软件开发的 Python，在风格和特性上可能差异巨大。


  *脚本（大部分）是你为自己编写的代码。软件是你（和其他队友）为他人编写的代码集合*。人们普遍观察到，当（大多数）没有软件工程背景的数据科学家为 AI/ML 模型和统计分析编写
  Python 程序时，他们倾向于*主要为自己*编写此类代码。编写高质量、生产级代码是一项需要终身学习和磨练的技能，是软件工程师和开发者的基本功。并非所有数据科学家都有动力和驱动力去获取这些技能。然而，一些好的实践可以在日常工作中学习和应用。本章在高效数据科学的背景下提供了一些指导。


  ## 第五章


  函数、继承、方法、类：它们是健壮的面向对象编程的核心。但是，如果一个典型的数据科学家只想创建一个带有探索性数据分析和图表的 Jupyter notebook，他们可能不会深入探究这些概念。因此，他们可以避免一开始就使用
  OOP 原则的痛苦，但这几乎总是会导致 notebook 代码变得不可重用和不可扩展。更准确地说，那段代码只为个人服务（直到那个个人忘记自己究竟编写了何种逻辑），而无法服务于他人。


  然而，可读性（以及由此带来的可重用性）对于任何优秀的软件产品/服务都至关重要。在第四章讨论了模块化、可读、可重用的编码实践之后，本章聚焦于这些实践在深度学习领域的具体例子。如今，像
  `TensorFlow` 或 `PyTorch` 这样强大而灵活的框架使得编写复杂神经网络架构的实际代码变得相对简单和简洁。但是，如果整个数据科学代码没有模块化和良好组织，它同样会面临不可复现和不可重用的问题。


  具体来说，我讨论了如何封装基于深度学习的工作流程中最基本的任务，例如构建和编译分类或回归模型、创建有针对性的可视化分析、在自定义函数内创建合适的文档字符串，并将它们用作主要数据科学流程的核心构建块。此外，你可以以类似的方式封装与数据格式化/转换以及预测/推断相关的任务。除了简单的函数封装器，我还讨论了一个强大的构造——回调函数，它适应了训练深度神经网络的动态特性。我展示了如何将此方法一直扩展到完整的
  OOP 范式，构建出类及实用工具模块，并将所有这些封装器作为特殊方法纳入其中。我将其称为深度学习实用工具模块，可以从任何数据科学任务中调用它。


  ## 第六章


  在前两章中，我说明了数据科学家必须学会如何高效地编写机器学习代码（无论是最终模型还是只是一个实验原型）。代码中必须有恰当的组织和模块化，以便能与标准软件工程工具和技术良好衔接。代码中必须包含一定程度的自动化，以减少探索、评估和试验数据与模型的时间。数据科学家必须习惯于编写功能测试和模块测试，融入面向对象原则等。最后，数据科学家还必须培养为代码编写良好文档的习惯，以便其他开发者能够重用和理解代码。


  本章将带你踏上一段旅程，开发属于你自己的一个轻量级但有用的机器学习包，以便你能体验为数据科学制作一整套软件产品的多个方面。根据我的经验，这个编写（并发布）机器学习包的过程会给任何有抱负的数据科学家带来宝贵的教训。




