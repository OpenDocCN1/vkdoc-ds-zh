  关于线性回归问题的进一步讨论和结果可在我写的这篇文章中找到：`https://medium.com/dataseries/gpu-powered-data-science-not-deep-learning-with-rapids-29f9ed8d51f3`。建议您查阅一下。


  ## 总结


  本章重点介绍基于 GPU 的硬件系统在数据科学任务中的使用和应用，这些任务不一定涉及深度学习模型或推理，但仍然可以从以硬件为中心的优化中显著受益。


  我向您介绍了 RAPIDS 这个出色的生态系统，它是一个以 GPU 为中心的数据科学框架，拥有用于数值计算、表格数据分析、经典机器学习、图分析甚至信号处理的独立库。该框架由
  CUDA 加速库驱动，并充分利用了 NVIDIA GPU（高于特定代的 GPU 类别和计算能力）。


  然而，其最佳特性是所有模块都试图模仿它们的非 GPU 纯 Python 对应物，如 NumPy、pandas 和 scikit-learn。因此，对于数据科学家来说，学习曲线很短，并且在大多数情况下，几乎可以原样替换代码。遵循这一原则，接下来您看到了多个动手示例，展示了使用由
  Tesla T4 GPU 驱动的托管运行时（在云端）对这些库进行基本应用。我还展示了等效操作和机器学习算法的计算性能基准测试比较，以清晰展示 GPU 加速数据科学的优势。


