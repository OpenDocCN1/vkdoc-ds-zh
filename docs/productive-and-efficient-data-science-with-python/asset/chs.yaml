  \n\n\n"
- "# 用于分布式加载和计算的 Ray Dataset\n\nRay Datasets（`https://docs.ray.io/en/latest/data/dataset.html`）是在\
  \ Ray 生态系统中加载和交换数据的标准（也是推荐）方式。这些对象提供了基本的分布式数据转换功能，例如 `map`、`filter` 和 `repartition`，并且能够与多种文件格式、数据源和分布式框架良好配合，便于加载和转换。它们还专为高性能加载和预处理数据而设计，适用于基于\
  \ Ray 构建的分布式机器学习训练流水线，例如 Ray-Train（`https://docs.ray.io/en/latest/train/train.html#train-docs`）。\n\
  \nRay Datasets 是一个相对较新的功能，从 Ray 1.8+ 版本起以 Beta 形式提供。如果你使用的是较旧版本的 Ray，则需要升级才能使用它们。此外，请确保已安装\
  \ `PyArrow` 库。\n\nRay Datasets 非常适合作为数据处理的“最后一公里”模块（在数据输入到并行化机器学习任务流程之前），适用于初始数据源为传统关系型数据库、ETL\
  \ 流水线输出甚至 Spark DataFrames 的场景。\n\n此前，我讨论过 Apache Arrow 以及这些现代数据存储格式如何彻底改变数据科学领域。Ray\
  \ Datasets 的核心实现了分布式 Arrow。每个 Dataset 本质上是一个包含块的 Ray 对象引用列表，这些块持有 Arrow 表（某些情况下为\
  \ Python 列表）。这种块级结构带来了并行性，并使其与分布式机器学习训练兼容。这样看来，Ray Datasets 与你在 Dask 中看到的情况类似。此外，由于\
  \ Datasets 只是 Ray 对象引用的列表，它们可以在 Ray 的任务、Actor 和库之间自由传递（几乎没有内存操作开销）。这让你在使用和集成方面拥有极大的灵活性，同时提升了系统性能。\n\
  \n如前所述，Ray Datasets 支持日常工作中使用的几乎所有类型的数据源。图 10-28 展示了其输入兼容性的部分概览。\n\n![](img/518852_1_En_10_Fig28_HTML.jpg)\n\
  \n图 10-28\n\nRay Datasets 输入兼容性概览\n\n例如，你可以使用 `range` 函数创建一个 Ray Dataset：\n\n```\n\
  ds = ray.data.range(100000)\n```\n\n如果你在 Jupyter notebook 单元格中键入 `ds` 进行查看，将看到：\n\
  \n```\nDataset(num_blocks=200, num_rows=100000, schema=<class 'int'>)\n```\n\n因此，默认情况下，它创建了\
  \ 200 个对象引用块，并为数据分配了整数模式。这种并行性和数据类型集成使得 Dataset 天然比传统数据源（如 pandas DataFrame）更高效。\n\
  \n你可以像对待其他数据集一样对 Dataset 应用映射函数：\n\n```\nop_ds = ds.map(lambda x: np.sin(x)+np.cos(x))\n\
  ```\n\n`op_ds` 本身现在是一个 Ray Dataset，但其模式因操作而发生了变化。\n\n```\nop_ds\n>> Dataset(num_blocks=200,\
  \ num_rows=100000, schema=<class 'numpy.float64'>)\n```\n\n由于模式发生了变化，现在可以直接使用许多\
  \ NumPy 方法。\n\n```\nop_ds.std()\n>> 1.0000051823664913\n```\n\n一个很酷的地方是，你可以将数据的批次（原始数据为整数）作为\
  \ Python 列表或 pandas DataFrames 读取，并对这些批次进行计算。这对于在此类数据上进行分布式机器学习训练非常有用。以下代码每次以 pandas\
  \ DataFrame 的形式读取大小为 25,000 的批次，并打印其统计信息：\n\n```\ni = 1\nfor batch in ds.iter_batches(batch_size=25000,\
  \ batch_format='pandas'):\n    print(\"批次编号：\", i)\n    print(\"=\" * 40)\n    print(batch.describe(percentiles=[0.5]))\n\
  \    print(\"=\" * 40)\n    i += 1\n```\n\n结果如图 10-29 所示。\n\n![](img/518852_1_En_10_Fig29_HTML.jpg)\n\
  \n图 10-29\n\n以 pandas DataFrame 块形式迭代 Ray Dataset 批次的部分结果\n\nDataset 使得在数据块上以 pandas\
  \ 方式运行并行数据转换任务成为可能。以下是一个伪代码示例：\n\n```\n# 一个 pandas DataFrame UDF\ndef transform_batch(df:\
  \ pd.DataFrame):\n    # 删除空值。\n    df = df.dropna(...)\n    # 添加新列。\n    df[\"new_col\"\
  ] = (...)\n    # 转换现有列。\n    df[\"feature_1\"] = (...)\n    # 删除列。\n    df.drop(...)\n\
  \    # 独热编码。\n    categories = [\"cat_1\", \"cat_2\", \"cat_3\"]\n    for category\
  \ in categories:\n        (...)\n    return df\n\n# batch_format=\"pandas\" 告诉 Datasets\
  \ 为转换器提供\n# 表示为 pandas DataFrame 的块。\nds = ds.map_batches(transform_batch, batch_format=\"\
  pandas\")\n```\n\n## 总结\n\n在本章中，我继续讨论了如何利用并行（及分布式）计算工具，使数据科学在大型数据集和模型上具备可扩展性。我探讨了原始数据和大模型都可以通过这些并行处理技术进行处理。随着现代多核\
  \ CPU 的出现以及以合理成本（来自云供应商）轻松获取大型计算集群，并行化数据科学的前景一片光明。\n\n我特别关注了两个 Python 框架：Dask 和\
  \ Ray。我详细介绍了 Dask 提供的各种核心数据结构和内部表示，它们让并行计算变得简单又有趣。我还结合动手示例详细讨论了 Dask 分布式客户端。对于 Ray，我介绍了基本的\
  \ Ray 并行性（使用特殊的装饰器和方法）以及分布式数据加载功能。\n\n在下一章中，我将超越 CPU 的范畴，探讨另一种可扩展性：如何移植到基于 GPU 的系统并利用其优势来完成数据科学任务。\n\
  \n\n\n"
- '# 11. 基于 GPU 的高效数据科学


  在前两章中，你了解了用于执行超大数据集及分布式/并行化数据科学的多种工具和框架。其核心目标始终如一：提升数据科学管道的生产力。生产力通常与各类数据科学任务（包括数值处理、数据整理和特征工程）的执行速度直接相关。当进入高级机器学习阶段时，根据建模的复杂程度，速度和性能问题甚至会变得至关重要。


  如今已公认，现代机器学习系统前所未有的成功，在很大程度上取决于其利用任务优化硬件以并行方式处理海量原始数据的能力。机器学习的历史已清晰表明，像图形处理器（GPU）这样的专用硬件在机器学习的早期成功中发挥了重要作用。


  例如，2012 年，亚历克斯·克里热夫斯基（[`https://qz.com/1307091/the-inside-story-of-how-ai-got-good-enough-to-dominate-silicon-valley/`](https://qz.com/1307091/the-inside-story-of-how-ai-got-good-enough-to-dominate-silicon-valley/)）与伊利亚·苏茨克弗以及[杰弗里·辛顿](https://www.cs.toronto.edu/%257Ehinton/)（[`www.cs.toronto.edu/~hinton/`](http://www.cs.toronto.edu/%257Ehinton/)）合作，设计了一个最终被称为
  AlexNet（[`https://proceedings.neurips.cc/paper/2012/file/c399862d3b9d6b76c8436e924a68c45b-Paper.pdf`](https://proceedings.neurips.cc/paper/2012/file/c399862d3b9d6b76c8436e924a68c45b-Paper.pdf)）的神经网络，该网络赢得了著名的
  ImageNet 大规模视觉识别挑战赛（[`https://en.wikipedia.org/wiki/ImageNet_Large_Scale_Visual_Recognition_Challenge`](https://en.wikipedia.org/wiki/ImageNet_Large_Scale_Visual_Recognition_Challenge)）。在众多创新特性中，它是早期在并行
  GPU 组合上训练的神经网络之一，并在 ImageNet 竞赛中以巨大优势击败了经典机器学习算法。因此，深度神经网络的整体概念得到了巨大推动，基于 GPU 的训练硬件在这一成功中所起的关键作用也随之凸显。自那以后，人们投入大量精力构建高度优化的软件工具和定制化的数学处理引擎（包括硬件和软件），以利用
  GPU 的算力与架构以及并行计算来服务于人工智能和机器学习。


  虽然 GPU 和分布式计算在学术界和商业界被广泛讨论用于核心 AI/ML 任务（例如，运行超过 100 层的深度神经网络进行图像分类，或拥有数十亿参数的 BERT
  语言合成模型（[`https://towardsdatascience.com/bert-explained-state-of-the-art-language-model-for-nlp-f8b21a9b6270`](https://towardsdatascience.com/bert-explained-state-of-the-art-language-model-for-nlp-f8b21a9b6270)）），但在常规数据科学和数据工程任务中的实用性却较少被关注。这些与数据相关的任务是
  AI 管道中任何机器学习工作负载的必要前提，并且它们通常占据了数据科学家甚至机器学习工程师所花费的时间和智力投入的大部分比例。


  事实上，著名的 AI 先驱吴恩达最近谈到，AI 工具开发应从以模型为中心转向以数据为中心（[`https://spectrum.ieee.org/andrew-ng-data-centric-ai`](https://spectrum.ieee.org/andrew-ng-data-centric-ai)）。其核心思想是**不使用大型数据集，而使用更高质量的小型数据集**。这意味着在
  AI 工作负载在管道上实际执行之前，需要花费更多时间处理原始数据并进行预处理。观看吴恩达在[`www.youtube.com/watch?v=06-AZXmwHjo`](http://www.youtube.com/watch%253Fv%253D06-AZXmwHjo)的采访（注意这是一个
  YouTube 视频链接）。这也意味着，如果能够将 GPU 的强大能力应用到这类 ML 前置数据处理任务中，那么整个管道的效率将立即得到提升。


  然而，一个重要问题依然存在：**我们能否将 GPU 的强大能力用于常规数据科学工作（例如数据整理、描述性统计）？** 答案并非显而易见，需要一些特别的考量与知识共享（图
  11-1）。在本章中，我将重点介绍一套名为`RAPIDS`的专用工具套件，它能够帮助任何数据科学家在广泛的数据科学任务（不一定是深度学习或高级 ML）中利用基于
  GPU 的硬件。我们期望通过利用 GPU 固有的并行处理能力，能够显著提升这类常见数据科学任务的生产力。


  ## 什么是 ImageNet？


  ImageNet 是一项持续进行的研究工作，旨在为全球研究人员提供一个易于访问的图像数据库。该项目源于图像与视觉研究领域日益强烈的共识：对更多数据的需求。**该项目对推动计算机视觉和深度学习研究起到了关键作用**。这些数据免费提供给研究人员用于非商业用途。每年都会围绕这个数据仓库举办一场竞赛，最新的深度学习架构在此相互角逐，算法/架构/技术的性能将根据它们对来自该数据源的图像的处理效果进行衡量。


  ![](img/518852_1_En_11_Fig1_HTML.jpg)


  **图 11-1** “我们能否利用 GPU 的强大能力来处理常规数据科学工作？”




  ## RAPIDS 生态系统


  RAPIDS 是一套开源软件库和 API，能够完全在 GPU 上执行端到端的数据科学和分析流程。Nvidia 孵化了这个项目，并构建了利用 CUDA 原语进行底层计算优化的工具。它特别专注于通过广受数据科学家和分析专业人士喜爱的友好型
  Python 语言，来展现 GPU 的并行能力和高带宽内存速度特性。


  常见的数据准备和数据整理任务在 RAPIDS 生态系统中备受重视，因为它们占据了典型数据科学流程中的大量时间。一个类数据框式的熟悉 API 已被开发出来，其中融入了大量优化和健壮性设计。它还被定制为能够与多种机器学习算法集成，从而实现端到端的流程加速，且无需承担序列化成本。


  RAPIDS 还包含大量对多节点、多 GPU 部署和分布式处理的内置支持。它与其它库集成，使得处理内存溢出（即数据集大小超过单个计算机内存）的数据变得简单易行，方便单个数据科学家使用。


  以下各小节将简要介绍该生态系统中数据科学家会发现非常有用的几个最突出的库。


  ## 什么是 CUDA？


  CUDA 是由 NVIDIA 创建的并行计算平台和编程模型。它于 2006 年首次推出，现已发展成为实现 GPU 加速计算的最常见选择，支持多种编程语言（例如
  C、C++、Fortran、Python 和 MATLAB）和 API。


  一个值得注意的点是，CUDA 本身既不是一种编程语言，也不是一个 API。它是一个用于构建第三方库、SDK 以及性能分析和优化工具的平台。它主要提供用于添加到现有编程语言中的扩展或原语，这些扩展本质上是将计算（由高级语言或
  API 执行）直接连接到底层 GPU 硬件。


  CUDA 工具包（`https://developer.nvidia.com/cuda-toolkit`）包含 GPU 加速库、编译器、开发工具和 CUDA 运行时。为了在从
  AI 到 HPC 的多个应用领域提升性能，开发者可以利用 NVIDIA CUDA-X——一个基于 CUDA 构建的库、工具和技术集合（`www.nvidia.com/en-us/technologies/cuda-x/`）。


  ## CuPy


  CuPy 是一个由 CUDA 驱动的数组库，其外观和操作方式与 NumPy 相似，而 NumPy 是所有使用 Python 进行数值计算和机器学习的基础。在底层，它使用基于
  CUDA 的低级库，包括 `cuBLAS`、`cuDNN`、`cuRand`、`cuSolver`、`cuSPARSE`、`cuFFT` 和 `NCCL`，以充分利用给定
  GPU 架构，目标是通过 Python 提供 GPU 加速计算。


  CuPy 的接口与 NumPy 高度相似，在大多数用例中可以简单地直接替换使用。以下是 CuPy 和 NumPy 之间 API 兼容性的模块级详细列表：`https://docs.cupy.dev/en/stable/reference/comparison.html`。请注意，几乎所有常见的
  NumPy 方法都在 CuPy 中进行了复制，并且名称也完全相同。对于数据科学任务，这基本上为您提供了由 GPU 驱动的加速效果，而无需任何显著的学习曲线。


  相对于 NumPy 的加速效果可能非常显著，具体取决于数据类型和用例。在下一节中，我将展示一个动手实践示例，比较 CuPy 和 NumPy 在两种不同数组大小以及各种常见数值运算（如切片、对多维数组的
  `sum` 和标准差等统计运算、矩阵乘法和逆运算、快速傅里叶变换 (FFT) 以及奇异值分解 (SVD)）上的速度差异。


  ## CuDF


  CuDF 基于 Apache Arrow 列式内存格式构建，是一个 GPU 加速的数据分析库，用于以各种可能的方式加载、连接、聚合、过滤和操作表格数据。它提供了一个类似
  pandas 的 API，这对于几乎所有数据工程师和数据科学家来说都不陌生，这并不意外。其理念是数据科学家应该能够使用 CuDF，通过强大的 GPU 轻松加速他们的工作流程，而无需深入研究
  CUDA 编程的细节。就像 CuPy 一样，大多数方法都可以从现有的 pandas 代码库中直接替换使用。


  但是请注意，目前 CuDF 仅支持 Linux 操作系统，并且适用于 Python 3.7 及更高版本。安装和使用 CuDF 的其他要求包括：


  * CUDA 11.0+

  * NVIDIA 驱动 450.80.02+

  * Pascal 架构或更新版本（计算能力 >=6.0）


  因此，在使用 CuDF 之前，您必须完成一些环境设置和安装步骤。这是快速开始使用这个强大库的资源：`https://docs.rapids.ai/api/cudf/stable/10min.html`。


  总的来说，无论数据科学家是否使用深度学习，CuPy 和 CuDF 都为他们提供了一个绝佳的机会，可以利用 GPU 加速的计算能力来提高工作效率。


  ## CuML


  CuML 是 RAPIDS 中的另一个库，它使数据科学家、分析师和研究人员能够在 GPU 上运行传统/经典的机器学习算法任务（主要处理表格数据），而无需了解太多
  CUDA 编程细节。在大多数情况下，CuML 的 Python API 与流行的 Python 库 `scikit-learn` 相匹配，从而可以快速、轻松地过渡到
  GPU 硬件。这是该库的 GitHub 页面，供您关注和深入研究：`https://github.com/rapidsai/cuml`。


  除了 CuPy 和 CuDF，在下一节中，您还将探索一些 CuML 函数和方法在常见机器学习任务上的动手实践示例，并将其执行速度和可扩展性与等效的 `scikit-learn`
  算法进行比较。


  超越笔记本电脑单 GPU 的场景，CuML 还在可能的情况下与 Dask 集成，为越来越多的利用这种分布式处理的算法提供多 GPU 和多节点 GPU 支持。基本上，许多现代高端硬件平台不是配备单个
  GPU，而是配备四个甚至八个 GPU，有时通过特殊的内存总线和数据接口通道互连，这些通道完全绕过 CPU 和传统的低速主板通信总线，实现 GPU 到 GPU 的直接连接。


  ## CuGraph


  CuGraph 是 GPU 加速图算法的集合，用于处理 GPU 数据框中的数据。CuGraph 的愿景是使图分析普及到用户只需从分析角度思考，而无需考虑技术或框架的程度。


  数据科学家将很容易掌握 CuGraph 如何与类似 pandas 的 CuDF API 集成。另一方面，熟悉 NetworkX 的用户将很快识别出 CuGraph
  中提供的类似 NetworkX 的 API，其目标是允许现有代码以最小的代价移植到 RAPIDS 中。目前，它支持广泛的图分析算法：


  *   中心性分析

  *   社区发现

  *   链接分析

  *   链接预测

  *   遍历算法


  许多科学和商业分析任务涉及到对大型数据集使用广泛的图算法。当工程师投资于 GPU 驱动的工作站时，像 CuGraph 这样的库为他们提供了更高生产率的保障。




  ## 硬件发展史


  硬件在这一领域所扮演的角色，其重要性无论如何强调都不为过。在人工智能和机器学习解决方案取得巨大成功并被广泛采用（尤其是深度学习应用）的推动下，针对运行此类工作负载的定制化硬件领域涌现了大量投资和开发。例如，所有主要服务器和工作站供应商（如
  HP、IBM、联想、Super Micro 等），此前只专注于为云计算构建计算基础设施，如今也提供了令人眼花缭乱的 GPU 优化硬件选项。谷歌的张量处理单元（TPU；[`https://en.wikipedia.org/wiki/Tensor_Processing_Unit`](https://en.wikipedia.org/wiki/Tensor_Processing_Unit)）就是一个典型的专用集成电路，它从零开始设计，唯一目标就是加速机器学习和深度学习工作负载特有的计算，例如线性代数、矩阵乘法、特殊非线性变换，并支持多种浮点数格式。GPU
  研发领域的领导者英伟达也同样在开创许多此类突破性的硬件平台。事实上，一个包含专用存储、共享内存架构和芯片组、主板设计以及数据通信通道和标准的完整硬件生态系统正在积极开发中，以满足人工智能工作负载的需求（图
  11-2）。


  诚然，此类硬件开发的焦点一直是特定类型的人工智能工作负载，例如大规模计算机视觉、强大的聊天机器人或工业级自然语言处理。尽管如此，借助像 RAPIDS 这样的框架，数据科学家和分析师（即那些在日常工作中不一定使用深度学习的群体）终于可以欢呼雀跃，并使用这些强大的人工智能工作站来提高他们的生产力。


