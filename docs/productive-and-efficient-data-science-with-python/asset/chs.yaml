- "# DataFrames\n\n如果你已经熟悉 pandas，Dask DataFrames 同样易于使用。你可以使用 Dask 内置的 `datasets`\
  \ 模块创建一个包含时间序列数据的 DataFrame：\n\n```python\nfrom dask import datasets\ndf = datasets.timeseries(\n\
  start='2022-01-01',\nend='2022-01-31',\nfreq='1min',\npartition_freq='1d',)\n```\n\
  \n现在，如果在 Jupyter notebook 单元格中仅输入 `df`，它不会显示你习惯在 pandas DataFrame 中看到的数据快照。这是因为\
  \ Dask 采用延迟计算，仅输入 `df` 并不要求任何实际计算。相反，它会显示模式（即数据类型）和一般结构信息（图 10-13）。注意它有 30 个分区，因为你在代码中选择了\
  \ `partition_freq = '1d'`，并且开始和结束日期分别落在该月的 1 日和 31 日。\n\n![](img/518852_1_En_10_Fig13_HTML.jpg)\n\
  \n图 10-13 Dask 中的时间序列 DataFrame，显示数据模式\n\n如果你想查看前几条记录，熟悉的 `head` 方法可以满足这一目的，并且默认情况下将进行计算（即显示实际数据），如图\
  \ 10-14 所示。\n\n![](img/518852_1_En_10_Fig14_HTML.jpg)\n\n图 10-14 显示前几条记录的 Dask DataFrame\n\
  \n大多数 pandas 类型的操作都受支持。例如，要知道有多少个唯一的名字，可以编写以下代码：\n\n```python\ndf['name'].nunique().compute()\n\
