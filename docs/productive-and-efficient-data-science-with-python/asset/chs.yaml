  6 或更高版本的 GPU。NVIDIA 提供了一个 GPU 及其计算能力的列表（[`https://developer.nvidia.com/cuda-gpus#compute`](https://developer.nvidia.com/cuda-gpus%2523compute)），你可以查看以确保拥有合适的
  GPU，从而利用 RAPIDS 框架。


