  \n让我们根据 `Avg. Area Number of Bedrooms` 列添加一个小转换。代码如下：\n\n```\ndef size(n):\nif n<=4:\n\
  return 'Small'\nelif 4<n<=6:\nreturn 'Medium'\nelse:\nreturn 'Big'\ndf['House_size']=df['Avg.\
  \ Area Number of Rooms'].apply(size)\n```\n\n你定义了一个名为 `size` 的函数，并将其应用于 `Avg. Area\
  \ Number of Rooms` 列。得到的数据集如图 7-4 所示。\n\n![图 7-4](img/518852_1_En_7_Fig4_HTML.jpg)\n\
  **图 7-4** 应用房屋大小转换后的数据集\n\n### 开始铺设管道\n\n从最简单的流水线开始，只包含一个操作。假设机器学习团队和领域专家认为，在建模时可以安全地忽略\
  \ `Avg. Area House Age` 数据。因此，你可以从数据集中删除这一列。为此，你可以使用 `pdpipe` 中的 `ColDrop` 方法创建一个名为\
  \ `drop_age` 的流水线对象，并将 `DataFrame` 传递给该流水线：\n\n```\nimport pdpipe as pdp\ndrop_age\
  \ = pdp.ColDrop(‘Avg. Area House Age’)\ndf2 = drop_age(df)\n```\n\n就这样。不出所料，得到的\
  \ `DataFrame` 如图 7-5 所示。\n\n![图 7-5](img/518852_1_En_7_Fig5_HTML.jpg)\n**图 7-5**\
  \ 使用管道操作删除 `Age` 列后的数据集\n\n#### 仅通过相加来连接流水线的多个阶段\n\n现在，单个管道很有趣，但只有当流水线具有**多个（连接的）阶段**时，它才真正有用且实用。在\
  \ `pdpipe` 中，有多种方法可以实现这一点。然而，最简单直观的方法是使用 `+` 运算符。就像手动连接管道一样。只需将一个管道添加到另一个管道上。\n\n\
  假设除了删除 `Age` 列之外，你还希望对 `House_size` 列进行独热编码，以便在数据集上轻松运行分类或回归算法。你可以通过编写以下代码轻松实现：\n\
  \n```\npipeline = pdp.ColDrop('Avg. Area House Age')\npipeline += pdp.OneHotEncode(‘House_size’)\n\
  df3 = pipeline(df)\n```\n\n因此，你首先使用 `ColDrop` 方法创建了一个流水线对象来删除 `Avg. Area House Age`\
  \ 列。之后，你只需使用常见的 Python `+=` 语法将 `OneHotEncode` 方法添加到此 `pipeline` 对象中。新的流水线现在处理 `DataFrame`\
  \ 对象。得到的 `DataFrame` 如图 7-6 所示。请注意由独热编码过程创建的额外指示列 `House_size_Medium` 和 `House_size_Small`。\n\
  \n![图 7-6](img/518852_1_En_7_Fig6_HTML.jpg)\n**图 7-6** 在流水线中添加独热编码后的数据集\n\n\n\n\
  ### 基于行值删除行\n\n接下来，你可能希望根据行中的数据值来移除某些行。具体来说，你可能需要删除所有房价低于 250,000 的数据。你可以使用 `ApplybyCol`\
  \ 方法将任意用户自定义函数应用到 `DataFrame` 上。还可以使用 `ValDrop` 方法根据特定值来删除行。你可以轻松地将这些方法串联到你的管道中，以选择性删除行（你仍在向已有的管道对象中添加内容，该对象已负责处理列删除和独热编码等其他任务）。通过创建一个名为\
  \ `price_tag` 的小型用户自定义函数，并在管道中使用它来实现这一点：\n\n```python\ndef price_tag(x):\n    if\
  \ x > 250000:\n        return 'keep'\n    else:\n        return 'drop'\n\npipeline\
  \ += pdp.ApplyByCols('Price', price_tag, 'Price_tag', drop=False)\npipeline += pdp.ValDrop(['drop'],\
  \ 'Price_tag')\npipeline += pdp.ColDrop('Price_tag')\n```\n\n请注意，在上述代码中，对于第一个操作，`ApplyByCols`\
  \ 方法的第二个参数代表用户自定义函数，而第三个参数 `Price_tag` 代表结果列的名称。图 7-7 显示了数据集。\n\n![](img/518852_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7：应用价格标签函数后的数据集\n\n现在，`ValDrop` 方法介入，它在 `Price_tag` 列中查找字符串 \"drop\"，并删除那些匹配的行。最后，`ColDrop`\
  \ 方法移除 `Price_tag` 列，从而清理 `DataFrame`。本质上，这个 `Price_tag` 列只是暂时需要，用于标记特定行，在完成其用途后应被移除。\n\
  \n其高效之处在于，所有这些只需在同一管道上简单地串联操作阶段即可完成。此时，你可以回顾一下，看看你的管道从一开始对 `DataFrame` 做了哪些处理：\n\
  \n- 删除指定列\n- 对分类数据列进行独热编码以供建模\n- 根据用户自定义函数标记数据\n- 根据标记删除行\n- 删除临时标记列\n\n所有这些操作仅需六行代码：\n\
  \n```python\npipeline = pdp.ColDrop('Avg. Area House Age')\npipeline += pdp.OneHotEncode('House_size')\n\
  pipeline += pdp.ApplyByCols('Price', price_tag, 'Price_tag', drop=False)\npipeline\
  \ += pdp.ValDrop(['drop'], 'Price_tag')\npipeline += pdp.ColDrop('Price_tag')\n\
  df5 = pipeline(df)  # 最终的 DataFrame\n```\n\n此外，该包的最新版本实现了另一种直接方法，可以用一行代码完成所有这些操作，如下所示：\n\
  \n```python\npdp.RowDrop({'Price': lambda x: x <= 250000})\n```\n\n### scikit-learn\
  \ 与 NLTK 阶段\n\n`pdpipe` 中还有许多更有用且直观的 `DataFrame` 操作方法，可以使数据科学任务高效且富有成效。此外，`pdpipe`\
  \ 甚至包含了来自 `scikit-learn` 和 `NLTK` 包的一些操作，用于构建出色的管道。\n\n#### 使用 scikit-learn 方法缩放数据\n\
  \n例如，构建机器学习模型最常见的任务之一是数据缩放。`scikit-learn` 提供了几种不同类型的缩放方法，例如最小-最大缩放或基于标准化的缩放（即先减去数据集均值，再除以标准差）。你可以直接将此类缩放操作串联到管道中。以下代码演示了其用法：\n\
  \n```python\nexclude = ['House_size_Medium', 'House_size_Small']\npipeline_scale\
  \ = pdp.Scale('StandardScaler', exclude_columns=exclude)\ndf6 = pipeline_scale(df5)\n\
  ```\n\n在这里，你应用了 `scikit-learn` 包中的 `StandardScaler` 估计器，以转换数据用于聚类或神经网络拟合。你可以选择排除不需要此类缩放的列，就像这里对指示列\
  \ `House_size_Medium` 和 `House_size_Small` 所做的那样。生成的 `DataFrame` 显示了缩放的效果（图 7-8）。\n\
  \n![](img/518852_1_En_7_Fig8_HTML.jpg)\n\n图 7-8：对选定列应用标准正态缩放后的数据集\n\n#### 来自 NLTK\
  \ 的分词器\n\n`DataFrame` 中的 `Address` 字段目前毫无用处。但是，如果你能从这些字符串中提取出邮政编码或州名，它们可能对某些可视化或机器学习任务有用。\n\
  \n为此，你可以使用一个分词器。`NLTK` 是一个流行且强大的 Python 文本挖掘和自然语言处理（NLP）库，它提供了一系列分词器方法。在这里，你可以使用其中一个分词器来分割\
  \ `Address` 字段中的文本，并从中提取州名。你注意到，州名是地址字符串中的倒数第二个单词。因此，你可以为这个任务创建以下串联管道：\n\n```python\n\
  def extract_state(token):\n    return str(token[-2])\n\npipeline_tokenize = pdp.TokenizeWords('Address')\n\
  pipeline_state = pdp.ApplyByCols('Address', extract_state, result_columns='State')\n\
  pipeline_state_extract = pipeline_tokenize + pipeline_state\ndf7 = pipeline_state_extract(df6)\n\
  ```\n\n生成的 `DataFrame` 如图 7-9 所示。请注意新增的 `State` 列。\n\n![](img/518852_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9：对 Address 列应用 NLTK 分词器方法后的数据集\n\n### 汇总\n\n图 7-10 总结了本演示中展示的所有操作。\n\n![](img/518852_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10：对 Address 列应用 NLTK 分词器方法后的数据集\n\n所有这些操作都可以根据需要频繁地应用于类似类型的数据集。拥有一套简单的顺序代码块作为预处理操作，能够提高数据科学家的工作效率。管道是实现这一统一顺序代码块的关键。`pandas`\
  \ 是数据科学团队中最广泛用于此类数据预处理任务的 Python 库，而 `pdpipe` 则提供了一种简单而强大的方式，利用 `pandas` 类型的操作来构建管道。\n\
  \n## 加速 NumPy 与 pandas\n\n`NumPy` 和 `pandas` 可能是用于数据科学和机器学习任务的两个最广泛使用的核心 Python\
  \ 库。显然，数值表达式求值的速度对于这些数据科学/机器学习任务至关重要，而这两个库在这方面不会令人失望。\n\n在底层，它们尽可能使用快速且优化的向量化操作来加速数学运算。已有大量文章阐述\
  \ `NumPy` 与普通的 Python 循环或基于列表的操作相比，具有多大优势（尤其是在可以向量化计算时）。在本节中，我将展示如何使用一个名为 `NumExpr`\
  \ 的简单扩展库来提升核心 `NumPy` 和 `pandas` 所执行的数学运算的速度。\n\n### 这是什么库？\n\n首先，使用 `pip` 命令安装它：\n\
  \n```bash\npip install numexpr\n```\n\n该项目托管在 GitHub 上，地址为 [`github.com/pydata/numexpr`](https://github.com/pydata/numexpr)。它来自\
  \ PyData（[`pydata.org/`](https://pydata.org/)）生态系统，该生态系统隶属于 NumFocus（[`numfocus.org/`](https://numfocus.org/)），`NumPy`\
  \ 和 `pandas` 也源于此。\n\n根据官方来源：\n\n> “NumExpr 是 NumPy 的快速数值表达式求值器。使用它，操作数组的表达式会得到加速，并且比在\
  \ Python 中执行相同计算占用更少内存。此外，其多线程功能可以利用所有核心——与 NumPy 相比，通常会带来显著的性能提升。”\n\n以下是该库的详细文档和各种用例示例：[`numexpr.readthedocs.io/projects/NumExpr3/en/latest/`](https://numexpr.readthedocs.io/projects/NumExpr3/en/latest/)。\n\
  \n\n\n### 加速运算\n\n首先，我们从一个非常简单的数学运算开始：将一个标量数值（比如 1）与一个 NumPy 数组相加。要使用`Numexpr`包，你只需将相同的计算过程，以符号表达式的形式，包裹在一个名为`evaluate`的特殊方法中即可。以下代码清晰地展示了其用法：\n\
  \n```\nimport numpy as np\nimport numexpr as ne\na = np.arange(1e6)\nb = np.arange(1e6)\n\
  %%timeit -n200 -r10\nc = a+1\n>> 3.55 ms ± 52.1 μs per loop (mean ± std. dev. of\
  \ 10 runs, 200 loops each)\n%%timeit -n200 -r10\nc = ne.evaluate(\"a + 1\")\n>>\
  \ 1.94 ms ± 86.5 μs per loop (mean ± std. dev. of 10 runs, 200 loops each)\n```\n\
  \n效果惊人！你只需将熟悉的 NumPy 代码 `a+1` 改写为符号表达式的形式 `\"a+1\"`，并将其传递给 `ne.evaluate()` 函数即可。结果，速度得到了显著提升，平均执行时间从\
  \ 3.55 毫秒降至 1.94 毫秒。\n\n请注意，为了保证一致性，你在一个 10 次循环的测试中，将同一计算重复运行了 200 次以计算执行时间。当然，具体结果在一定程度上取决于底层硬件。欢迎你在自己的机器上进行评估，看看能获得多大的性能提升。\n\
  \n#### 涉及两个数组的算术运算\n\n让我们稍微提高一点难度，引入两个数组。以下是使用两个数组计算一个简单线性表达式的代码：\n\n```\n%%timeit\
  \ -n100 -r10\nc = 2*a+3*b\n>> 11.7 ms ± 177 μs per loop (mean ± std. dev. of 10\
  \ runs, 100 loops each)\n%%timeit -n100 -r10\nc = ne.evaluate(\"2*a+3*b\")\n>> 2.14\
  \ ms ± 130 μs per loop (mean ± std. dev. of 10 runs, 100 loops each)\n```\n\n对于双数组运算，性能提升甚至比简单的标量加法更为显著，平均耗时从\
  \ 11.7 毫秒降低到了 2.14 毫秒。\n\n#### 一个稍复杂的运算\n\n现在，让我们进一步加大难度，通过在一个较为复杂的有理函数表达式中引入更多数组。假设你想计算图\
  \ 7-11 所示的表达式，它涉及五个 NumPy 数组，每个数组包含一百万个随机数（取自正态分布）。\n\n![](img/518852_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11：一个涉及多个 NumPy 数组的复杂有理函数\n\n代码如下。你创建一个形状为 (1000000, 5) 的 NumPy 数组，然后从中提取出五个\
  \ (1000000,1) 的向量用于有理函数中。另外，请注意`Numexpr`方法中的符号表达式如何原生地理解字符串符号`sqrt`（你只需直接写`sqrt`）。\n\
  \n```\na = np.random.normal(size=(1000000,5))\na1,a2,a3,a4,a5 = a[:,0],a[:,1],a[:,2],a[:,3],a[:,4]\n\
  %%timeit -n100 -r10\nc = (a1**2+2*a2+(3/a3))/(np.sqrt(a4**2+a5**2))\n>> 47 ms ±\
  \ 220 μs per loop (mean ± std. dev. of 10 runs, 100 loops each)\n%%timeit -n100\
  \ -r10\nne.evaluate(\"(a1**2+2*a2+(3/a3))/(sqrt(a4**2+a5**2))\")\n>> 3.96 ms ± 218\
  \ μs per loop (mean ± std. dev. of 10 runs, 100 loops each)\n```\n\n这显示出了巨大的速度提升，平均耗时从\
  \ 47 毫秒降至约 4 毫秒。事实上，这是一个趋势；你会发现，*表达式越复杂，涉及的数组数量越多*，使用`Numexpr`带来的速度提升就越大。\n\n####\
  \ 逻辑表达式 / 布尔过滤\n\n此外，你并不局限于上面展示的简单算术表达式。NumPy 数组最有用的功能之一，是直接在涉及逻辑运算符（如 `>` 或 `<`\
  \ ）的表达式中使用它们，以创建布尔过滤器或掩码。你可以使用`Numexpr`实现同样的功能，并加速过滤过程。以下是一个检查涉及四个向量的欧几里得距离是否大于某个阈值的例子：\n\
  \n```\nx1 = np.random.random(1000000)\nx2 = np.random.random(1000000)\ny1 = np.random.random(1000000)\n\
  y2 = np.random.random(1000000)\n%%timeit -n100 -r10\nc = np.sqrt((x1-x2)**2+(y1-y2)**2)\
  \ > 0.5\n>> 23.2 ms ± 143 μs per loop (mean ± std. dev. of 10 runs, 100 loops each)\n\
  %%timeit -n100 -r10\nc = ne.evaluate(\"sqrt((x1-x2)**2+(y1-y2)**2) > 0.5\")\n>>\
  \ 1.86 ms ± 112 μs per loop (mean ± std. dev. of 10 runs, 100 loops each)\n```\n\
  \n这种过滤操作在数据科学/机器学习流程中司空见惯，你可以想象，通过策略性地用`Numexpr`表达式替换 NumPy 评估，可以节省多少计算时间。\n\n####\
  \ 复数\n\n从实数领域跨越到虚数领域相当容易。`Numexpr`在处理复数方面同样出色，复数由 Python 和 NumPy 原生支持。以下是一个例子，同时也展示了一个超越数运算——对数运算：\n\
  \n```\na = np.random.random(1000000)\nb = np.random.random(1000000)\ncplx = a +\
  \ b*1j\n%%timeit -n100 -r10\nc = np.log10(cplx)\n>> 55.9 ms ± 159 μs per loop (mean\
  \ ± std. dev. of 10 runs, 100 loops each)\n%%timeit -n100 -r10\nc = ne.evaluate(\"\
  log10(cplx)\")\n>> 9.9 ms ± 117 μs per loop (mean ± std. dev. of 10 runs, 100 loops\
  \ each)\n```\n\n#### 数组大小的影响\n\n接下来，让我们考察 NumPy 数组的大小对速度提升的影响。为此，我们选择一个涉及两个数组的简单条件表达式，如\
  \ `2*a+3*b < 3.5`，并针对一系列不同的大小绘制相对执行时间（取 10 次运行的平均值）。代码在随附的 Jupyter notebook 中，最终结果如图\
  \ 7-12 所示。\n\n![](img/518852_1_En_7_Fig12_HTML.jpg)\n\n图 7-12：数组大小对速度提升的影响\n\n###\
  \ `pandas eval` 方法\n\n事实证明，pandas 有一个`eval`方法，你可以选择使用`Numexpr`引擎来加速对 Python 符号表达式（作为字符串）的求值操作。图\
  \ 7-13 展示了官方 pandas 文档中该方法的快照。\n\n![](img/518852_1_En_7_Fig13_HTML.jpg)\n\n图 7-13：pandas\
  \ `eval` 方法中使用 `numexpr` 引擎的部分快照\n\n以下代码演示了一个例子，你构建了四个各有 50000 行、100 列的 DataFrame（填充均匀随机数），并计算涉及这些\
  \ DataFrame 的一个非线性变换。一种情况使用原生 pandas 表达式，另一种情况使用`pd.eval()`方法：\n\n```\nnrows, ncols\
  \ = 50000, 100\ndf1,df2,df3,df4 = [pd.DataFrame(np.random.randn(nrows, ncols)) for\
  \ _ in range(4)]\n%%timeit -n20 -r10\nc=2*df1 - (df2/2) + (df3/df4)\n>> 55.8 ms\
  \ ± 1.8 ms per loop (mean ± std. dev. of 10 runs, 20 loops each)\n%%timeit -n20\
  \ -r10\npd.eval('2*df1 - (df2/2) + (df3/df4)')\n>> 17.3 ms ± 539 μs per loop (mean\
  \ ± std. dev. of 10 runs, 20 loops each)\n```\n\n注意，在第二种情况下，你如何为 DataFrame 使用带有符号表达式的字符串：`pd.eval('2*df1\
  \ - (df2/2) + (df3/df4)')`。\n\n你进行了类似的分析，探究 DataFrame 的大小（行数，同时保持列数固定为 100）对速度提升的影响。结果如图\
  \ 7-14 所示。\n\n![](img/518852_1_En_7_Fig14_HTML.jpg)\n\n图 7-14：DataFrame 大小对速度提升的影响\n\
  \n\n\n### 工作原理与支持的运算符\n\n`Numexpr` 工作机制的细节相当复杂，涉及对底层计算架构的最优利用。本书不对此进行深入介绍。其基本流程是：表达式通过\
  \ Python 的 `compile` 函数进行编译，提取变量，并构建一棵解析树。随后，这棵树被编译成字节码程序，该程序通过一种称为*向量寄存器*（每个寄存器宽度为\
  \ 4096 个元素）来描述逐元素的操作流程。速度提升的关键在于`Numexpr`能够一次处理多个元素块。\n\n它规避了 NumPy 使用临时数组的做法，后者既浪费内存，又无法将大数组缓存到内存中。此外，其虚拟机完全用\
  \ C 语言编写，这使得它比原生 Python 更快。它还支持多线程，从而能在合适的硬件上实现更快的并行操作。简化的示意图如图 7-15 所示。\n\n![图\
  \ 7-15: Numexpr 内部工作原理的简化示意图](img/518852_1_En_7_Fig15_HTML.jpg)\n\n`Numexpr`支持在表达式中使用大量的数学运算符，但不支持类似`if`或`else`的条件运算符。完整的运算符列表可在[`https://numexpr.readthedocs.io/projects/NumExpr3/en/latest/user_guide.html#supported-operators`](https://numexpr.readthedocs.io/projects/NumExpr3/en/latest/user_guide.html%2523supported-operators)找到。\n\
  \n您还可以通过设置环境变量`NUMEXPR_MAX_THREAD`来控制用于大数组并行操作的线程数。目前，最大线程数为 64，但如果超过底层 CPU 节点可用的虚拟核心数，并不会带来实际收益。\n\
  \n因此，在本节中，您了解了如何利用这种特殊的基于虚拟机的表达式求值范式来加速 NumPy 和 pandas 中的数学计算。尽管这种方法可能不适用于所有任务，但数据科学、数据整理和统计建模流程中的很大一部分都能通过最少的代码改动而受益于此。\n\
  \n## 快速发现最佳拟合分布\n\n假设您有一些数值数据点，并想找出它们可能来自哪种统计分布。这是一个经典的统计推断问题。\n\n当然，有严谨的统计方法可以实现这一目标。但也许您是一位忙碌的数据科学家。或者是一位更忙碌的软件工程师，偶然获得这个数据集，需要快速编写一个应用端点，以便另一个机器学习应用可以使用基于与数据最匹配的分布生成的合成数据。\n\
  \n简而言之，您手头时间不多，想找到一种快速方法来发现数据可能来自的最佳匹配分布。在这种场景下，您希望自动对多个分布进行一批拟合优度（GOF）测试（[`https://en.wikipedia.org/wiki/Goodness_of_fit`](https://en.wikipedia.org/wiki/Goodness_of_fit)），并迅速总结结果。当然，您也可以从头开始编写代码，使用\
  \ Scipy 库逐个对多个分布进行标准的 GOF 测试。\n\n或者，您可以使用一个虽小但有用的 Python 库——`distfit`来完成繁重的工作。\n\
  \n### 什么是 GOF 测试？\n\n统计模型的拟合优度描述了该模型与一组观测值的拟合程度。简言之，拟合优度度量通常总结观测值与所讨论模型下预期值之间的差异。它们广泛用于各种统计问题和假设检验场景。\n\
  \n### 简单拟合示例\n\n您将生成一些随机的合成数据，并仅用几行代码找到最佳匹配的分布：\n\n```python\nfrom distfit import\
  \ distfit\nimport numpy as np\n# 生成测试数据\ndata1 = np.random.normal(loc=5.0, scale=10,\
  \ size=1000)\n```\n\n然后，您初始化一个模型并将数据拟合到其中：\n\n```python\n# 初始化模型\ndist1 = distfit(bins=25,\
  \ alpha=0.02, stats='ks')\n# 拟合数据\ndist1.fit_transform(data1, verbose=1)\n```\n\n\
  注意它与 scikit-learn API 的相似之处；它有一个您刚刚使用的`fit_transform`方法。这里，`alpha`表示拟合的置信区间，`stats='ks'`表示评分策略，即\
  \ Kolmogorov-Smirnov 统计量（[`https://en.wikipedia.org/wiki/Kolmogorov%E2%80%93Smirnov_test`](https://en.wikipedia.org/wiki/Kolmogorov%25E2%2580%2593Smirnov_test)）。当您在\
  \ Jupyter notebook 中运行这段代码时，会得到如图 7-16 所示的（非常）详细的输出。\n\n![图 7-16: 分布拟合的详细（部分）输出](img/518852_1_En_7_Fig16_HTML.jpg)\n\
  \n实际上，拟合过程会在`dist1`对象中创建并存储各种信息。也许您最感兴趣的是看到一些匹配的可视化结果以及与各种分布匹配性能的摘要。\n\n### 绘图与摘要\n\
  \n一个简单的`plot`命令会显示最佳拟合的分布以及它与数据点的匹配情况：\n\n```python\ndist1.plot(verbose=1)\n```\n\
  \n这会生成如图 7-17 所示的图表。\n\n![图 7-17: 与测试数据点最佳匹配的分布](img/518852_1_En_7_Fig17_HTML.jpg)\n\
  \n一行代码即可获得一个漂亮的摘要表格：\n\n```python\ndist1.summary\n```\n\n它显示了`fit_transform`方法在后台遍历的所有分布的相关信息。这里的分数是确定最佳匹配分布的指标。它类似于误差或距离度量，因此分数越低，匹配越好。在本例中，有不少分布的分数几乎为零。查看图\
  \ 7-18 中的摘要表格后，您可以根据需要决定选择哪个分布。\n\n![图 7-18: 数据被评估的所有分布的摘要表格](img/518852_1_En_7_Fig18_HTML.jpg)\n\
  \n为什么这个摘要中只有 11 个分布？因为默认情况下，它使用一个最常见的分布列表进行扫描。如果您想搜索一个固定的分布列表，可以在初始化`distfit`对象时，将确切列表作为参数指定，其中分布名称使用通用字符串。\n\
  \n\n\n### 小心处理小数据集\n\n与所有其他统计学习模型拟合过程一样，该方法在大数据集上效果最佳。对于小数据，拟合结果可能不明确（多个分布显示相似的匹配度）或次优（错误的分布被识别为最佳拟合）。\n\
  \n例如，让我们从 Beta 分布 ([`https://en.wikipedia.org/wiki/Beta_distribution`](https://en.wikipedia.org/wiki/Beta_distribution))\
  \ 生成一些数据，选择的参数使其看起来几乎像正态分布。如果你选择的参数 `α` 和 `β` 相等或接近，就可以实现这一点。然后，如果你拟合 1，000 个数据点，你可能会得到正态分布作为最佳拟合分布（图\
  \ 7-19）。\n\n![](img/518852_1_En_7_Fig19_HTML.jpg)\n\n图 7-19  \n由 Beta 分布生成并用 1，000\
  \ 个点拟合的数据\n\n```\nimport numpy as np\ndata2 = np.random.beta(a=2.2,b=2.0,size=500)\n\
  dist2 = distfit(bins=50,alpha=0.02,stats='ks')\ndist2.fit_transform(data2,verbose=1)\n\
  dist2.plot(title=\"Best-fitted with 500 data points\",verbose=1)\n```\n\n然而，如果你将数据集大小扩展到\
  \ 10，000 个点，你很可能得到正确的答案（图 7-20）。\n\n![](img/518852_1_En_7_Fig20_HTML.jpg)\n\n图 7-20\
  \  \n由 Beta 分布生成并用 10，000 个点拟合的数据\n\n### 其他可以做的事情\n\n使用 `distfit` 库你可以做很多事情：\n\n\
  -   你可以选择使用哪种**统计检验**（RSS、Kolmogorov-Smirnov 等）来确定最佳拟合。\n-   你可以控制你想要运行的确切分布列表。\n\
  -   你可以使用 `distfit.predict` 方法来**预测**响应变量的概率。\n-   你可以使用 `distfit.generate` 方法生成**合成**数据。\n\
  -   我仅展示了连续分布拟合的示例。然而，你也可以轻松地对**离散**分布进行拟合。\n\n## 总结\n\n在本章中，你探索了轻量级的 Python 包，这些包可以加速常见的数据科学任务，例如流水线化数据\
  \ wrangling 和清洗、使用 NumPy 和 pandas 进行数值操作，以及为数值数据点找到最佳匹配的统计分布。\n\nPython 生态系统中存在数百个这样的专用库，如果你去寻找它们，它们可以带来高效和高产的数据科学工作。GitHub\
  \ 是开始搜索这些库的好地方。请注意一个 GitHub 项目获得的星标数量，以判断该包的质量，并确定它是否足够成熟/稳定，可以纳入你的数据科学工具栈。\n\n\
  也有优秀的文章和博客专门讨论新的、令人兴奋的 Python 包，作为老牌产品的替代品。Khyuen Tran 的开源书籍，第 5 章，紧凑地（尽管代码较多）讨论了许多此类有用的库。\n\
  \n"
- "# 8. 内存与时间剖析\n\n数据科学任务伴随着各种各样的空间和时间计算成本。数据 wrangling 工作可能需要大容量存储的支持，而高级 ML 算法需要高强度的计算速度。一些\
  \ ML 算法在拥有大型本地内存（RAM）支持时表现更好，并且无法与位于硬盘上远离 CPU 的数据良好配合，而其他算法则针对分布式数据存储进行了优化。\n\n\
  此外，数据的性质可能根据应用场景变化缓慢或频繁。一些模型和数据科学代码能够随着输入数据规模和复杂性的增加而优雅地扩展，而另一些则不能。当扩展没有妥善规划或嵌入代码中时，性能可能会下降，甚至可能导致时间上的灾难性故障。在许多此类情况下，代码的过度内存使用（或对内存带宽的需求）是问题的根源。\n\
  \n为了规划此类情况或稳健地设计数据科学代码，你必须从基础开始：衡量代码在内存使用或剖析方面的效率。显然，这与本书主题——高效数据科学的核心哲学——紧密相连。根据代码和底层硬件的不同，有许多用于此类测量的工具和技术。在第\
  \ 2 章中，我们讨论了基本的时间测量和一个用于测量 ML 函数执行时间的时间装饰器。在本章中，我的目标是向你介绍一些工具（附带动手示例），这些工具可用于衡量数据科学和\
  \ ML 代码的内存使用情况。\n\n## 为什么要分析内存使用情况？\n\n对于大多数数据科学工作来说，内存使用测量或剖析可能被视为事后考虑。然而，它正变得越来越普遍和关键。作为一名数据科学家，如果你能够可靠地测量代码的内存使用情况并规划更大的代码库，你肯定会对你软件平台的稳健性产生积极影响。\n\
  \n### 一个常见场景\n\n假设你编写了一个很酷的机器学习应用程序或创建了一个闪亮的神经网络模型。现在你想通过某个 Web 服务或 REST API 部署这个模型。或者，你可能基于来自制造工厂工业传感器的数据流开发了一个模型，现在你必须将该模型部署在某个工业控制\
  \ PC 上，以根据连续输入的数据提供决策。\n\n作为一名数据科学家，你可能会从工程/平台团队那里收到一个非常常见的问题：“**你的模型/代码的内存占用是多少？**”或“**在给定数据负载下运行时，你的代码的峰值内存使用量是多少？**”\
  \ 这很自然，因为硬件资源可能有限，单个 ML 模块不应占用系统的所有内存。这对于边缘计算场景尤其如此，例如 ML 应用程序可能在最边缘运行，比如在工业 PC\
  \ 上的虚拟化容器内（并且没有云支持的自动扩展内存或动态分配）。\n\n此外，你的模型可能只是运行在那块硬件上的数百个模型之一。因此，你必须对模型的峰值内存使用量有所了解，因为如果多个模型同时达到内存使用峰值，可能会导致整个系统崩溃。而且这些模型并不一定都来自同一位数据科学家。不同的团队可能在不同时间开发了它们。因此，拥有一个通用机制来测量或评估所有这些模型（以及一般的数据科学代码）的内存使用情况（峰值和平均值）是合理的。该想法如图\
  \ 8-1 所示。\n\n![](img/518852_1_En_8_Fig1_HTML.jpg)\n\n图 8-1  \n对运行在单个系统上的众多 ML 模型的内存和\
  \ CPU（执行）情况进行测量（评估）\n\n\n\n### 不在于模型大小（或压缩）\n\n你可能会认为制作一个紧凑且复杂度较低的机器学习模型就能解决所有问题。但这将是一个错误的假设。当谈到峰值内存使用问题时，我们讨论的是整个代码的运行时内存概况（一个动态量）。这与你的机器学习模型的大小（甚至压缩程度）关系甚微（这些模型可能作为特殊对象保存在磁盘上，例如`scikit-learn`的`Joblib`转储、简单的\
  \ Python `pickle`转储，或 TensorFlow 的`HFD5`文件）。\n\n模型压缩和规模调整也相当重要。在许多情况下，你可能需要特别注意这一点。你可能需要通过选择更简单的模型架构来限制自己训练拥有数百万参数的模型。你可能需要尝试训练后模型压缩（例如，有意降低数值系数的浮点精度）来减小模型在磁盘上的大小。通常，这些操作会降低模型运行时的活动内存使用量。然而，你仍然需要有效的代码和机制来测量运行时的内存使用情况。\n\
  \n### Scalene：一个精巧的内存分析器\n\n尽管有许多内存和 CPU 分析器，但拥有一个能够全面审视整个数据科学代码的“一站式”工具是件好事。**Scalene**\
  \ 就是这样一个全面的工具。我们来详细了解一下。\n\n根据其 GitHub 页面描述，“Scalene 是一个用于 Python 的高性能 CPU、GPU 和内存分析器，它能做其他\
  \ Python 分析器做不到或不能做的几件事。它比其他分析器快几个数量级，同时提供更详细的信息。” 它由马萨诸塞大学开发。可以观看[`www.youtube.com/watch?v=5iEf-_7mM1k&feature=youtu.be`](http://www.youtube.com/watch%253Fv%253D5iEf-_7mM1k%2526feature%253Dyoutu.be)上的视频以获取全面介绍。\n\
  \n因此，Scalene 承诺以下功能：\n\n*   分析 CPU、GPU 和内存\n*   执行速度比其他分析器快一个数量级\n*   提供比其他类似工具更详细的信息\n\
  \n### 基本用法\n\n通过`pip`安装：\n\n```\npip install scalene\n```\n\n一个明显的限制是**目前它仅适用于 Linux\
  \ 操作系统**。如果你使用的是 Windows 或 MacOS，可以通过创建虚拟机并在其中运行脚本来使用它。\n\nScalene 的使用非常简单。你只需在\
  \ Python 脚本名称前输入`scalene`：\n\n```\nscalene my_script.py\n```\n\n或者，你可以在 Jupyter\
  \ 笔记本中使用它，首先执行这个魔法命令：\n\n```\n%load_ext scalene\n```\n\n典型的输出快照如图 8-2 所示。后面会有更详细的解释。\n\
  \n![](img/518852_1_En_8_Fig2_HTML.jpg)\n\n图 8-2：来自 Scalene 的典型输出快照\n\n#### 特性\n\n\
  以下是 Scalene 的一些酷炫特性。其中大部分不言自明，可以从图 8-2 中看出。\n\n*   **行或函数**：报告整个函数以及每个独立代码行的信息\n\
  *   **线程**：支持 Python 线程\n*   **多进程**：支持使用`multiprocessing`库\n*   **Python vs. C\
  \ 时间**：Scalene 区分在 Python 和原生代码（例如库）上花费的时间\n*   **系统时间**：它区分了系统时间（例如，休眠或执行 I/O 操作）\n\
  *   **GPU**：它还可以报告在 NVIDIA GPU 上花费的时间（如果存在）\n*   **复制量**：报告每秒复制的兆字节数据\n*   **检测泄漏**：Scalene\
  \ 可以自动定位可能导致内存泄漏的代码行！\n\n### 一个具体的机器学习示例\n\n现在让我们着手将 Scalene 用于标准机器学习代码的内存分析。你将查看两种不同类型的机器学习模型，原因稍后会说明。你将使用`scikit-learn`库来构建所有三个模型，并利用其合成数据生成函数来创建数据集：\n\
  \n*   一个多元线性回归模型\n*   一个基于相同数据集的深度神经网络模型\n\n这两个模型的建模代码遵循完全相同的结构。外部 I/O 操作也在图 8-3\
  \ 中进行了标注，你将会看到，它们是否主导内存分布取决于模型类型。\n\n![](img/518852_1_En_8_Fig3_HTML.jpg)\n\n图 8-3：用于\
  \ Scalene 演示示例的通用 ML 模型代码流程\n\n#### 线性回归模型\n\n完整代码在随附的 Jupyter 笔记本中。你使用标准导入和两个名为`NUM_FEATURES`和`NUM_SAMPLES`的变量，以便稍后进行一些实验：\n\
  \n```\nimport pandas as pd\nimport pickle\nimport numpy as np\nfrom sklearn.linear_model\
  \ import LinearRegression\nfrom sklearn.datasets import make_regression\n\nNUM_FEATURES\
  \ = 10\nNUM_SAMPLES = 1000\n```\n\n为简洁起见，我将不展示数据生成和模型拟合的代码，因为它们是标准流程。你将拟合好的模型保存为\
  \ pickle 转储文件，并加载该 pickle 对象以及一个用于推理的测试 CSV 文件：\n\n```\n# 模型保存函数\ndef save(lm):\n\
  \    \"\"\"\n    将 sklearn 线性模型保存为 pickle 对象\n    \"\"\"\n    with open('LinearModel.sav',\
  \ mode='wb') as f:\n        pickle.dump(lm, f)\n\n# 模型运行函数\ndef model_run(model,\
  \ testfile):\n    \"\"\"\n    从 pickle 对象加载并运行 sklearn 线性模型\n    \"\"\"\n    lm\
  \ = pickle.load(open(model, 'rb'))\n    X_test = pd.read_csv(testfile)\n    _ =\
  \ lm.predict(X_test)\n    return None\n```\n\n为了清晰起见，你将所有代码放在一个主循环下运行，以便于 Scalene\
  \ 执行和报告（稍后你会理解）：\n\n```\nif __name__ == '__main__':\n    data = make_data()\n  \
  \  X_train, y_train, X_test, y_test = test_train(data)\n    lm = fitting(X_train,\
  \ y_train)\n    save(lm)\n    model_run('LinearModel.sav', 'Test.csv')\n```\n\n\
  运行命令：\n\n```\n$ scalene linearmodel.py --html >> linearmodel-scalene.html\n```\n\
  \n你将得到如图 8-4 所示的输出结果。请注意，你使用了`--html`标志和管道操作符（`>>`）将输出导向到一个 HTML 文件，以便于报告。\n\n![](img/518852_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4：线性回归模型代码通过 Scalene 分析后的输出\n\n从这个分析中得到的最重要的观察结果是，**内存占用几乎完全由外部 I/O 主导**，例如\
  \ pandas 和`scikit-learn`估计器的加载。仅有极少的内存用于将测试数据写入磁盘上的 CSV 文件。\n\n*实际的机器学习建模、NumPy\
  \ 或 pandas 操作以及推理完全不影响内存*。这是一个有些出乎意料且不直观的事实。显然，如果没有像`scalene`这样的合适内存分析器，你是不可能发现这一点的。\n\
  \n\n\n#### 随着模型和数据规模的扩大，会发生什么？\n\n你可以扩展数据集大小（行数）和模型复杂度（特征数），并运行相同的内存分析，以记录各种操作在内存消耗方面的表现。\n\
  \n结果如图 8-5 所示。X 轴以成对形式表示特征数/数据点数。请注意，此图描绘的是百分比而非绝对值，以展示各类操作的相对重要性。\n\n![图 8-5](img/518852_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5 数据和模型（参数数量）规模对线性模型的影响\n\n从这些实验中，你可以得出结论：`scikit-learn`线性回归估计器非常高效，并且**在实际模型拟合或推理时不会消耗太多内存**。然而，它在代码方面有一个固定的内存占用，并且在加载时会消耗那么多内存。但是，随着数据大小和模型复杂度的增加，该代码占用量的百分比会下降。\n\
  \n因此，如果你处理的是小型到中型的线性模型（例如，数千个数据点但只有数十个参数），你可能需要关注数据文件 I/O，以优化数据加载、存储、建模和推理代码，从而实现更好的内存利用。例如，你可以使用不同于纯\
  \ CSV 的文件存储选项（如`Parquet`或类似的针对内存分析优化的现代数据格式；访问[`https://medium.com/productive-data-science/why-you-should-use-parquet-files-with-pandas-b0ca8cb14d71`](https://medium.com/productive-data-science/why-you-should-use-parquet-files-with-pandas-b0ca8cb14d71)了解更多信息）。\n\
  \n#### 深度学习模型\n\n如果你对具有两个隐藏层（每个隐藏层 50 个神经元）的神经网络运行类似的实验，结果将如图 8-6 所示。它使用了来自`sklearn.neural_network`模块的`MLPRegressor`估计器。代码在附带的\
  \ Python 脚本中。\n\n![图 8-6](img/518852_1_En_8_Fig6_HTML.jpg)\n\n图 8-6 数据和模型（参数数量）规模对神经网络模型的影响\n\
  \n显然，与线性回归模型不同，神经网络模型在训练/拟合步骤中消耗了大量内存。然而，对于少量特征和大数据量，拟合所需的内存较低。你还可以尝试不同的架构和超参数，并记录内存使用情况，以找到适用于特定数据科学任务的配置。\n\
  \n### 关键方法和建议\n\n如果你用相同的代码文件重复实验，结果会根据你的硬件（磁盘/CPU/GPU/内存类型）而有很大差异。上面展示的结果的目的不是关注实际值甚至趋势。我希望你能学会为自己代码做内存分析实验。\n\
  \n#### 关键建议\n\n在这方面，一些关键建议如下：\n\n*   最好编写专注于单一任务的小函数。\n*   保留一些自由变量，如特征数和数据点数，以便在数据/模型规模变化时，能以最少的更改运行相同的代码文件来检查内存配置。\n\
  *   如果你在比较两种机器学习算法，尽量保持整体代码的结构和流程尽可能一致，以减少混淆。最好只更改估计器类并比较内存配置。\n*   数据和模型 I/O（导入语句、模型持久化到磁盘）的内存占用可能出乎意料地高，具体取决于你的建模场景。在进行优化时，切勿忽略它们。\n\
  *   基于上述原因，考虑比较来自多个实现/包（例如，`Keras` vs. `PyTorch` vs. `scikit-learn`）的同一算法的内存配置。如果内存优化是你的主要目标，你可能需要寻找一个占用内存最小但仍能令人满意地完成工作的实现，即使它在功能或性能上并非绝对最佳。\n\
  *   如果数据 I/O 成为瓶颈，可以探索更快的选项或其他存储类型，例如将`pandas`的`CSV`替换为`Parquet`文件和`Apache Arrow`存储。\n\
  \n#### 使用`Scalene`可以做的其他事情\n\n在本节中，我讨论了以规范的机器学习建模代码为重点的最基本的内存分析。`Scalene` CLI 还有其他选项可以利用：\n\
  \n*   仅分析 CPU 时间，不分析内存配置\n*   仅对非零内存占用进行简化分析\n*   指定 CPU 和内存分配的最小阈值\n*   设置 CPU\
  \ 采样率\n*   多线程并检查差异\n\n#### 有时最终验证是必要的\n\n在许多情况下，机器学习模型运行在硬件资源（尤其是内存/RAM 端）有限的边缘设备上。对于这种低资源场景，最好托管一个验证环境/服务器，该环境/服务器将接受给定的建模代码（在开发和测试之后，但在部署之前），并通过内存分析器运行它以生成运行时统计信息。如果它通过了内存占用的预定标准，然后就可以被接受进行进一步部署。这个想法如图\
  \ 8-7 所示。\n\n![图 8-7](img/518852_1_En_8_Fig7_HTML.png)\n\n图 8-7 部署机器学习模型前的内存配置验证检查\n\
  \n像`Scalene`这样的框架在这些情况下非常有用。通过设置这样的验证网关，数据科学家可以使整个平台更加稳定和健壮，抵御偶然的内存过冲和系统崩溃。\n\n\
  ## 使用`cProfile`进行时间分析\n\n你已经看到了一些使用计时装饰器测量简单代码块或函数执行时间的基本技巧和技术。在本节中，我将讨论一个名为`cProfile`的内置\
  \ Python 库，它可以通过一个简单的命令为你提供关于数据科学代码各个部分的详细时间分析。其优点是你不必在多个地方插入像`time.time()`这样的代码片段（如第\
  \ 2 章所示）并手动跟踪它们。\n\n\n\n### 基本用法\n\n`cProfile`库随默认 Python 安装提供，因此无需额外安装。以下是其基本用法，通过简单代码实现两个\
  \ NumPy 数组的相加：\n\n```\nimport numpy as np\nimport cProfile\nSIZE = 10_000_000\n\
  a = np.arange(SIZE)\nb = np.random.normal(size=SIZE)\ncProfile.run('a+b')\n```\n\
  \n主要需要注意，你必须将代码包裹在字符串中，并将其传递给`cProfile.run`函数。此处代码仅为`'a+b'`。输出可能类似于图 8-8 所示。当然，具体耗时将根据底层硬件而有所不同。\n\
  \n![](img/518852_1_En_8_Fig8_HTML.jpg)\n\n**图 8-8**：对简单 NumPy 数组加法执行`cProfile`运行的输出快照\n\
  \n值得记住的是，唯一被计时测量的代码段是`a+b`。此处并未测量数组的创建过程，仅测量了加法操作。\n\n如果你想测量所有步骤的时序分析，可以编写如下代码：\n\
  \n```\ncode = \"\"\"SIZE = 10_000_000\na = np.arange(SIZE)\nb = np.random.normal(size=SIZE)\n\
  a+b\"\"\"\ncProfile.run(code)\n```\n\n这里你将所有代码放入字符串变量`code`中，然后将其传递给`cProfile.run`函数。输出结果有所不同（图\
  \ 8-9），符合预期。\n\n![](img/518852_1_En_8_Fig9_HTML.jpg)\n\n**图 8-9**：包含数组创建和加法操作的`cProfile`运行输出快照\n\
  \n注意，额外的数组创建操作总共导致了五次函数调用，而基本加法代码仅三次。\n\n### 将函数作为参数传入\n\n当然，你也可以创建一个独立的函数，并将该函数名称传递给`cProfile.run`函数来执行相同任务：\n\
  \n```\ndef add():\nSIZE = 10_000_000\na = np.arange(SIZE)\nb = np.random.normal(size=SIZE)\n\
  c=a+b\ncProfile.run('add()')\n```\n\n输出（图 8-10）与图 8-9 中的输出类似，但多注册了一次由`add`函数本身构造所产生的函数调用。\n\
  \n![](img/518852_1_En_8_Fig10_HTML.jpg)\n\n**图 8-10**：对独立函数（相同 NumPy 操作）执行`cProfile`运行的输出快照\n\
  \n传递给`cProfile`的函数也可以带有任意参数。在许多情况下，你可以更改参数并观察其对分析结果的影响。这是该库最明显的用例之一。让我们重写`add`函数，使其接受一个`size`参数：\n\
  \n```\ndef add(size):\na = np.arange(size)\nb = np.random.normal(size=size)\nc =\
  \ a+b\n```\n\n然后，你可以使用它来对包含 1000 万个元素的数组操作进行分析（图 8-11）：\n\n![](img/518852_1_En_8_Fig11_HTML.jpg)\n\
  \n**图 8-11**：运行`cProfile`并向函数传递 1000 万个元素的参数\n\n```\nSIZE = 10_000_000\ncProfile.run('add(SIZE)')\n\
  ```\n\n当你将元素数量改为 2000 万时，结果会立即反映出来（图 8-12）：\n\n![](img/518852_1_En_8_Fig12_HTML.jpg)\n\
  \n**图 8-12**：运行`cProfile`并向函数传递 2000 万个元素的参数\n\n```\nSIZE = 20_000_000\ncProfile.run('add(SIZE)')\n\
  ```\n\n### 使用`Profiler`类\n\n`cProfile`有一个特殊的`Profiler`类，用于存储所有重要信息，并且可以通过编程方式启用/禁用。你还可以使用`pstats`库，并将此`Profiler`对象传递给它，以打印和提取数据。以下是测量并打印总执行时间的代码：\n\
  \n```\nimport cProfile, pstats\nprofiler = cProfile.Profile()\n# Enable profiler\n\
  profiler.enable()\n# Function execution\nadd(SIZE)\n# Disable profiler\nprofiler.disable()\n\
  # pstats\nstats = pstats.Stats(profiler)\n# Print the total time and number of calls\n\
  print(\"Total function calls:\", stats.total_calls)\nprint(\"Total time (seconds):\"\
  , stats.total_tt)\n```\n\n结果如下所示：\n\n```\n>> Total function calls: 48\n>> Total\
  \ time (seconds): 1.1527893999999999\n```\n\n这里，你从`stats`对象的`total_tt`属性获取执行时间，并从`total_calls`属性获取调用次数。\n\
  \n因此，这开启了一种可能性，即可以根据需要以编程方式控制性能分析和信息存储。例如，你可以在一系列数组大小上分析相同`add`函数的执行情况：\n\n```\n\
  size = [int(i*1e6) for i in range(5,26,5)]\ntotal_tt = []\nfor s in size:\nprofiler\
  \ = cProfile.Profile()\nprofiler.enable()\nadd(s)\nprofiler.disable()\nstats = pstats.Stats(profiler)\n\
  total_tt.append(round(stats.total_tt,3))\n```\n\n计时结果存储在`total_tt`数组中。绘制成图后，显示出预期的模式（图\
  \ 8-13）。\n\n![](img/518852_1_En_8_Fig13_HTML.jpg)\n\n**图 8-13**：使用`cProfile`提取的不同数组大小的计算时间\n\
  \n### 数据科学工作流分析\n\n虽然测量这些小型独立函数的执行时间只是这些分析器用法的基本演示，但其真正价值体现在大规模数据科学工作流中。此类工作流包含多种模块和函数，必要时你可以为所有这些模块和函数设置性能分析。输出结果可以记录到数据库中，甚至可以馈送到一个监控系统，该系统将随时间跟踪模块的性能，并在需要时采取行动（例如，如果某个函数在特定运行中或针对特定输入数据耗时过长，性能表现不佳）。该思路如图\
  \ 8-14 所示。\n\n![](img/518852_1_En_8_Fig14_HTML.png)\n\n**图 8-14**：数据科学工作流各个阶段的时间和内存分析\n\
  \n## 总结\n\n在本章中，你了解了内存分析对于机器学习代码的重要性，以确保与负责在服务/机器上部署代码的平台/工程团队顺利进行接口对接。分析内存还可以提示你，根据所处理的具体数据集和算法组合，采用出人意料的方式来优化代码。你看到了一个典型的机器学习建模代码示例，并使用一个功能强大且轻量级的\
  \ Python 库对其进行了分析。你看到了线性回归和神经网络模型的代表性结果，并获得了一些通用建议。\n\n接下来，你学习了内置 Python 时序分析器`cProfile`的基本用法，以及如何将其用于原始代码或函数模块。你了解了如何使用该库提取\
  \ NumPy 操作的总执行时间或函数调用次数。这一思路可以扩展到任何包含多个阶段和模块的数据科学工作流。\n\n每个数据科学团队或组织都有自己的测量代码和模块效率及内存占用风格。本章的目的是向你介绍这些测量的重要性，并展示一些动手示例，以便你能进一步探索并为此类实现做好准备。\n\
  \n\n\n"
- "# 可扩展数据科学\n\n数据科学任务可能会处理规模千差万别的数据集，小至千字节，大至拍字节。有些企业电子表格可能只有几百行，而整个工厂可能将海量传感器数据源源不断地发送到单个数据集中，导致每天甚至每小时产生数十亿行数据。有些数据集可能行数众多但列数较少，而另一些则可能只有少量行，但特征维度却可达数百万列。即使在同一个组织或数据科学团队内部，也可能存在多条处理不同类型输入的数据管道，它们面临的数据集规模和复杂度可能存在巨大差异。\n\
  \n数据科学家通常会自然地构建数据科学任务（例如结合数据整理、机器学习算法和一些预测功能）的可扩展原型。他们构建这样一个原型，用预期会进入管道的典型数据集进行测试，利用几种机器学习算法评估结果或衡量某些性能指标，进行调优，最终做出选择。这是一种实验性思维，非常符合\"\
  *用数据做科学*\"的精神。然而，为了支持这种快速分析和原型设计，数据科学家必须能够根据需求，快速地在各种数据集规模和复杂度之间进行扩展。他们不应该在笔记本电脑上构建原型时遇到内存不足等问题。\n\
  \n本章将讨论在扩展到更大数据集时出现的常见问题和限制，以及目前有哪些工具可以解决这些问题。具体来说，你将了解在使用最常用的数据分析库 Python pandas\
  \ 处理大型数据集时出现的一些限制，并探索两种可以克服这些限制的替代库或扩展插件。\n\n事实上，可扩展性与大型数据的并行处理能力密切相关。因此，这一主题将在下一章继续展开，届时你将探索在数据科学任务中原生支持并行处理的\
  \ Python 库。\n\n## 可扩展性的常见问题\n\nPython 是一种优秀的数据科学语言。像 pandas 这样的库为数据科学家提供了无限可能，让他们能够以任意方式对数据进行切片和切块，并用相对较少的编程工作生成有意义的见解和影响深远的分析报告。然而，在处理大型数据集（即使是像包含十亿行数据的\
  \ CSV 文件这样简单的结构）时，它们存在一些严重的局限性。\n\n随着数据规模的增长，数据科学家可能遇到的两个最常见问题是核心外故障以及与 Python 单线程特性相关的低效问题。\n\
  \n*核心外*实际上是指无法将完整数据正确加载到机器的工作内存（RAM）中。单线程问题与 Python 的基本设计特性——全局解释器锁（GIL）（`https://realpython.com/python-gil/`）有关，该特性允许单个线程锁定解释器，从而阻止其他线程获取控制权。两者共同作用，使得在硬件有限的情况下，对大型数据集（任何大于几\
  \ GB 的数据集）进行高效数据分析变得相当棘手。\n\n### 核心外（即内存不足）\n\n`pandas` 是 Python 中最流行的数据分析库，也是任何标准数据科学流程的前端。然而，如果你曾尝试处理大于几\
  \ GB 的数据文件，你可能见过 pandas 抛出的内存错误（图 9-1）。\n\n`图 9-1` pandas 抛出的内存错误\n\n当然，这个错误取决于系统内存的具体状态，例如有多少其他进程与\
  \ pandas 代码同时运行，以及它们占用了哪种类型的内存。尽管如此，一个众所周知的事实是，pandas 无法高效处理多 GB 级别的数据集（无论其结构多么简单）。\n\
  \n此外，即使一个大型数据集最初能够以某种方式加载到内存中而不出现任何内存错误，这种低效和局限性也可能在之后显现出来。由于 pandas 处理内存中对象和计算的方式，你的数据科学代码很容易遇到同样的内存错误。如果代码在快速连续的计算中产生大量大型的内存中\
  \ DataFrame，这种情况会进一步加剧。\n\n例如，想象一下以下代码可能导致的后果。假设 `Large-file.csv` 有 1000 万行和 20\
  \ 列。\n\n```python\ndf1 = pd.read_csv(\"Large-file.csv\") # 成功加载\ndf2 = df1.dropna()\n\
  df3 = df2[(df2['col1'] > 10) & (df2['col2'] < 20)]\ndef complex_calc(x):\n    #\
  \ 一些复杂的数学运算\ndf3['new-col'] = df3['col3'].apply(complex_calc)\ndef some_transformation(df):\n\
  \    # 转换代码\n    return transformed_df\ndf4 = some_transformation(df3)\n...\n```\n\
  \n这是一个通用的代码片段，但你应该能看出这段代码效率低下，尤其是在处理大型 pandas DataFrame 对象时。它生成了多个中间 DataFrame，并且在它们完成任务后没有从内存中清除。最终，它可能只使用最终的\
  \ DataFrame 进行机器学习建模，但系统内存已经被这么多无用的对象堵塞，结果导致内存错误，整个流程崩溃。如图 9-2 所示。\n\n`图 9-2` 即使可以从磁盘读取大文件，过多中间\
  \ DataFrame（不良编码习惯）也会导致内存错误\n\n当然，解决这个问题的一种方法是严格保持良好编码习惯，定期跟踪和清除未使用的对象。然而，在 Jupyter\
  \ notebook 上进行原型设计时，数据科学家往往会编写快速且粗糙的代码，而不遵循这一实践，这将阻碍他们在处理大型数据集时的可扩展性。\n\n### Python\
  \ 单线程\n\nGIL 是 Python 语言的早期设计选择之一，它解决了与内存泄漏和竞争条件相关的几个重要问题。简而言之，它是一种锁定机制，只允许一个线程持有对\
  \ Python 解释器的控制权。这意味着在任何给定时间点，只有一个线程可以处于执行状态。\n\n通常，对于执行单线程程序的程序员来说，其影响并不明显。事实上，许多数据科学任务可以正常运行，无需担心\
  \ GIL，因为它们按顺序执行一系列任务，并且不使用许多并行处理技巧。然而，在 CPU 密集型和多线程代码中，它可能会成为性能瓶颈。\n\n对于更大的数据集，有时将数据分成多个块并利用并行处理执行流程是合理的。其理念是将分块后的数据发送到\
  \ CPU 的每个核心，并尽可能并行地执行分析。当执行完成后，可以合并结果以得到转换后的数据集。虽然这不一定有助于将更大的数据集放入内存，但可以通过并行执行来加快对同一数据集的分析速度。\n\
  \n美妙之处在于，即使不租用云上的大型 CPU 集群，这种方法也能加速数据科学探索和原型设计任务。这实际上是利用数据科学家笔记本电脑中单个现代 CPU 通常配备的\
  \ 8 核或 16 核的问题。然而，你必须确保数据科学代码和库不会成为障碍，并且你正在使用能够充分利用多核硬件平台的库。\n\n\n\n"
- "# 有哪些可选方案？\n\n要解决内存问题（在加载和转换大型数据集时），根据你所处的具体情况，有多种可能的解决方案。有些与硬件选择有关，有些则与数据加载策略相关。让我们系统地探讨一下这些方案。\n\
  \n## 云实例\n\n对于越来越大的数据集，总有一种简单粗暴的解决方案：租用一台配备大容量内存的云实例。例如，目前你可以租用一台配备 128GB 内存的 AWS（亚马逊云服务）弹性计算（EC2）实例，每小时费用不到\
  \ 1 美元。图 9-3 显示了 `r6g.4xlarge` 实例（一种所谓的内存优化型 EC2 实例，[`www.amazonaws.cn/en/ec2/instance-types/#Memory_Optimized_Instances`](http://www.amazonaws.cn/en/ec2/instance-types/%2523Memory_Optimized_Instances)）的定价。\n\
  \n![](img/518852_1_En_9_Fig3_HTML.jpg)\n\n图 9-3\n\n一个内存优化型 EC2 (AWS) 实例的定价\n\n设置好之后，你可以安装所有常用的\
  \ Python 库，读取存储在本地（例如，映射到固态硬盘）或来自 AWS S3 文件夹的大型数据文件，并进行 `pandas` 数据转换，而无需担心内存错误。虽然这对普通用户来说可能仍然昂贵，但对于需要大量内存来定期处理\
  \ `pandas` DataFrames 的组织或团队来说，他们可能不会介意为流畅且无错误的数据科学任务流程支付每小时约 0.8 美元的费用。\n\n然而，请记住，`pandas`\
  \ 仍然仅限于一次使用一个 CPU 核心，并且默认情况下，它在加载和处理大型文件时会表现出速度慢的问题。仅仅在大内存的云实例上运行普通的 pandas 代码可能会阻止一些常见的内存错误情况，但它**无法从根本上使数据科学流程在规模化应用中变得高效或富有成效**。\n\
  \n### 什么是内存优化型 EC2 实例？\n\n像 AWS 这样的云服务必须满足具有各种需求的广泛用户群体。有人可能需要使用 CPU 集群进行快速处理，有人可能需要高网络带宽，还有人可能需要大容量的板载内存（RAM）。内存优化型实例正是为此而设计的：它们以优化的成本提供大量\
  \ RAM。它们不一定拥有顶级的 CPU 或网络带宽，但对于在执行过程中需要大量物理内存的任务来说，它们的效果最佳。在这些实例中，根据成本和可用的 CPU 类型有多种选择。`r6g.4xlarge`\
  \ 实际上是该系列的起点，最高可提供 768GB 内存选项，且每小时成本合理。\n\nAWS 并非唯一提供此服务的云服务商。每一个主要玩家——例如 Google\
  \ Cloud 或 Microsoft Azure——都提供类似的高内存实例作为基础设施即服务（IaaS），可以解决在（本地机器上）执行数据科学任务时内存不足的问题。\n\
  \n## Google Colab\n\nGoogle Colaboratory（或广为人知的 Colab；[`https://research.google.com/colaboratory/faq.html`](https://research.google.com/colaboratory/faq.html)）本质上也是一种云服务。基本上，它运行一个托管在\
  \ Google 云服务器上的 Jupyter notebook 服务。你只需拥有一个 Google 帐户，就可以免费使用 CPU、GPU，甚至 TPU（如果你运气好的话）。\n\
  \n**与 AWS 或 GCP 相比，Colab 最大的优势在于其易用性和低准入门槛。** 如果你的数据科学 Python 代码在 Jupyter notebook\
  \ 中，Colab 可以让你立即在该云实例上开始工作（只要你将 notebook 上传到实例）。与 AWS 或 GCP 的裸机实例不同，无需任何设置或安装。你可以直接通过浏览器访问\
  \ Colab notebooks，并在几分钟内开始运行代码。\n\n### 什么是张量处理单元？\n\n张量处理单元（TPU）是 Google 定制开发的专用集成电路（ASIC），用于加速机器学习工作负载。这些\
  \ ASIC 从底层设计之初，唯一目标就是优化深度学习中出现计算任务的速度和功耗，例如矩阵乘法和加法、特殊激活函数、其他线性代数例程（如矩阵求逆）等。它们的内部架构与为通用计算任务设计的传统\
  \ CPU 截然不同。TPU 的内存带宽和内存传输速度也得到了增强，因为这些因素对深度学习训练性能有决定性影响。\n\n在某些特定情况下，这确实可以提高生产力和效率。例如，如果本地笔记本电脑没有足够好的\
  \ CPU 或 GPU 显卡，或者 RAM 低于 8GB，那么切换到 Google Colab 应该能立即提升生产力。\n\n典型的（免费）实例拥有约 12-13\
  \ GB 的 RAM 和一个相当于 Intel Xeon 处理器的 CPU。获取一个 GPU 实例也相当容易，最常见的 GPU 是 Tesla K80（计算能力\
  \ 3.7，拥有 2496 个 CUDA 核心和 12GB GDDR5 显存）。虽然 CPU 核心数并不值得夸耀，但拥有更大的 RAM 和 GPU 内存可能有助于数据科学探索，特别是当它涉及\
  \ GPU 密集型任务时，例如训练深度神经网络，甚至涉及 NumPy 数组的矢量化计算。如果觉得 12GB RAM 太少，你可以升级到 Colab Pro（[`https://colab.research.google.com/signup`](https://colab.research.google.com/signup)），它提供双倍内存，每月仅需\
  \ 10 美元（这比租用等效的 24GB RAM EC2 实例便宜得多）。\n\n然而，尽管功能吸引人，但**对于试图探索更大数据集并扩展其数据科学工作流程的实践型数据科学家来说，Colab\
  \ 确实存在一些严重的局限性。** 首先，它对 notebook 的运行时间设置了时间限制，因此如果你让它闲置一段时间，实例将会终止（连同所有变量和内部状态）。基本上，你必须仔细规划代码执行，并时刻保持警惕，才能充分利用\
  \ Colab。\n\n此外，文件加载（无论是从本地驱动器上传还是从网络读取）都非常缓慢（这很可能是为了控制 Google 云基础设施的带宽使用而有意为之）。因此，虽然你可以相当快速地进行内存分析和数据转换，但初始加载可能会耗费过多时间，甚至可能导致你的\
  \ notebook 崩溃。从完全免费的帐户升级到 Colab Pro 或 Pro+ 可以在一定程度上缓解这些问题，但无法完全解决。\n\n## pandas\
  \ 特有的技巧\n\n既然我是通过指出 `pandas` 中的内存溢出问题来开始可扩展性讨论的，那么回到原点，审视一下 `pandas` 开发者针对此问题提出了哪些建议，就显得很有意义了。\n\
  \n在 `pandas` 文档门户网站上有一个专门的资源页面讨论这个主题：“扩展到大型数据集”（[`https://pandas.pydata.org/pandas-docs/stable/user_guide/scale.html`](https://pandas.pydata.org/pandas-docs/stable/user_guide/scale.html)）。该页面开头这样写道：\n\
  \n> *Pandas 提供了用于内存分析的数据结构，这使得使用 pandas 分析大于内存的数据集有些棘手。即使是占内存相当大一部分的数据集也变得难以处理，因为一些\
  \ pandas 操作需要创建中间副本。*\n\n该页面接着指出了一些处理内存问题的有用技巧和技术。我在下面讨论其中的一些内容，并补充了几个技巧。\n\n\n\n\
  #### 只加载你需要的列\n\n通常，特定的数据转换任务只需要完整数据集中的一小部分列。如果你有一个包含 1000 万行和 100 列的数据集，而你只需要前\
  \ 5 列，那么只加载这 5 列，完全不碰其余列是完全合理的。这样可以避免将高达 9.5 亿个数据条目加载到内存中。这里的关键技巧是在数据加载函数中包含必要的参数。\n\
  \n请这样写：\n\n```\ndf = pd.read_csv(\"Large-file.csv\",\nnames = ['Col-1','Col-2','Col-3'])\n\
  ```\n\n而不是：\n\n```\ndf = pd.read_csv(\"Large-file.csv\")\n```\n\n这个小小的改动确实能决定你的数据转换管道的成败。\n\
  \n#### 针对特定列的函数（如适用）\n\n遵循上述相同思路，根据需求编写处理数据集中特定列/特征的独立函数是一个好习惯（在适用情况下）（图 9-4）。例如，一个数据集可能包含以下内容：\n\
  \n-   **字符串数据**，对应姓名和地址。这可由一个特定的函数处理。\n-   **日期时间数据**，对应某些业务交易。这应由另一个专门的函数处理，该函数只加载和处理这些列。\n\
  -   **纯数值数据**，可以通过多种方式处理，甚至可以作为纯`NumPy`数组读取，并利用向量化技巧（如本书其他部分所述）来加速数据转换过程。\n\n![图\
  \ 9-4](img/518852_1_En_9_Fig4_HTML.png)\n\n*图 9-4：用于处理大型磁盘文件特定列的函数，从不将超过一小部分数据加载到内存中。*\n\
  \n#### 显式指定/转换数据类型\n\npandas 中的默认数据类型并非设计为最高内存效率的。对于拥有相对较少唯一值的文本/字符串数据列（也称为*低基数数据*）尤其如此。通过使用更高效且更有针对性的数据类型，你可以显著减少内存使用并处理更大的数据集。\n\
  \n有一个名为 `loan_data.csv` 的数据集（随书提供）。让我们看看在處理这个数据集时，显式指定数据类型如何能减少内存使用：\n\n```\nimport\
  \ pandas as pd\ndf = pd.read_csv(\"../loan_data.csv\")\ndf.memory_usage(deep=True)\n\
  ```\n\n函数 `memory_usage()` 显示了内存中对象的真实内存使用情况。输出如图 9-5 所示。`df.info()` 的输出也显示在同一个图中，表明默认加载将通用的\
  \ `object` 数据类型分配给了该列，而其他列则被分配了像 `int64` 或 `float` 这样的数据类型。\n\n![图 9-5](img/518852_1_En_9_Fig5_HTML.jpg)\n\
  \n*图 9-5：默认数据加载为文本/字符串列分配了通用数据类型，导致其占用过多内存。*\n\n你可能还注意到 `credit.policy` 是一个无符号整数，其值为\
  \ 1 或 0。为什么要用 64 位整数数据类型来表示它呢？那么，让我们也对该列进行类型转换：\n\n```\ndf['credit.policy'].unique()\n\
  >> array([1, 0], dtype=int64)\n```\n\n以下是执行数据类型转换（显式指定）的代码：\n\n```\ndf2 = df.copy()\n\
  df2['purpose'] = df2['purpose'].astype('category')\ndf2['credit.policy'] = df2['credit.policy'].astype('uint8')\n\
  del(df)\n```\n\n在这里，首先你复制了现有的 `DataFrame`。然后，你使用 `astype` 函数将 `category` 数据类型分配给\
  \ `purpose` 列，并将 `uint8`（8 位无符号整数）分配给 `credit.policy` 列。最后，作为一个好习惯，你从内存中删除了旧的 `DataFrame`\
  \ 对象，因为你的数据科学管道不再需要它。\n\n你可以在图 9-6 中看到鲜明的对比。\n\n![图 9-6](img/518852_1_En_9_Fig6_HTML.jpg)\n\
  \n*图 9-6：显式数据类型指定/转换后的贷款数据集内存使用情况。*\n\n对于这个例子来说，这种内存节省可能微不足道，但对于一个漫长且数据密集型的管道来说，像这样的小节省会迅速累积起来，并能显著减少总开销。\n\
  \n### 用于并行处理的库\n\n并行计算本身就是一个广阔的领域。在 Python 中实现能完美且高性能地执行并行线程/进程的优化代码并非易事。幸运的是，有一些出色的\
  \ Python 框架可以用最小的学习成本进行并行处理。\n\n我将在下一章通过动手示例讨论其中的两个，`Dask` 和 `Ray`，所以这里我不深入介绍这些细节。\n\
  \n### 用于处理超大数据集（无法全部装入内存）的库\n\n有一些专门的库用于处理超大数据集。`Vaex` 和 `Modin` 就是这样的两个框架。接下来我们将通过动手示例更详细地讨论它们。\n\
  \n### 关于首选操作系统的说明\n\n尽管许多数据科学家在日常工作中使用 Windows 操作系统，但已经观察到（总体而言，以及在本书的技术审阅过程中），像\
  \ `Vaex`、`Modin`、`Ray` 和 `Dask` 这样的高级库在 Windows 操作系统上可能难以设置或无法顺畅运行。因此，强烈建议你使用基于\
  \ Linux 的操作系统来练习使用这些库并运行提供的一些 Jupyter Notebook。你可以：\n\n-   在本地机器上原生使用基于 Linux 的操作系统（例如\
  \ Ubuntu、Fedora 或 Red Hat）。\n-   在你基于 Windows 的机器上使用 Oracle VirtualBox 等工具运行虚拟机，并在虚拟机上安装基于\
  \ Linux 的操作系统。\n-   使用带有 Linux 操作系统的云实例（包括任何 EC2 实例自带的 Amazon Linux 版本）。\n\n## Vaex\
  \ 动手示例\n\n`Vaex` 是一个 Python 库，专为处理**惰性超大数据集 DataFrame** 而设计。其主要目标之一是帮助可视化和探索大型表格数据集。`Vaex`\
  \ 在处理大型数据集时性能优异。例如，它可以帮助计算均值、总和、计数、标准差等统计量，在包含多达十亿个对象/行的 *N* 维网格上，每秒可处理高达十亿行。\n\n\
  在本节中，你将看到使用 `Vaex` 库进行此类计算和可视化的动手示例。\n\n### 功能一览\n\n以下是 `Vaex` 关键特性的快速总结：\n\n- \
  \  **性能**：能轻松处理巨型表格数据。其处理能力可达每秒数十亿行。\n-   **惰性/虚拟列**：计算即时完成，不浪费宝贵的 RAM/虚拟内存。\n-\
  \   **内存效率高**：在执行常规数据切片（如过滤、选择、子集）时，无需复制内存。\n-   **可视化**：原生直接支持。拥有众多函数，可从大型表格数据集中实现常规可视化。\n\
  -   **用户友好的 API**：`DataFrame` 对象是主要 API，也是普通用户所需的一切。该 API 与 pandas 非常相似，因此在用 `Vaex`\
  \ 替换 pandas 代码进行超大数据处理时，学习曲线极小。\n-   **精简且模块化**：`Vaex` 被拆分为多个子包，你可以根据具体需求安装它们的任意组合。例如，`Vaex-astro`\
  \ 支持与天文学相关的转换和 FITS 文件读取。`Vaex-viz` 支持所有可视化。但如果你只是想计算统计量而不可视化数据，则不必安装它。对于像 Apache\
  \ Arrow 这样的现代文件类型，它有一个名为 `Vaex-arrow` 的包。\n\n\n\n### 基本使用示例\n\n从使用 Vaex 提供的示例数据集开始：\n\
  \n```python\nimport vaex\ndf = vaex.example()\n```\n\n首次运行这段代码时，它会从网络下载数据集，因此首次运行时需要网络连接。数据集（一个`.hdf5`文件）会存储在名为`data`的文件夹中。\n\
  \n你可以查看文件的相关信息：\n\n```python\ndf.info()\n```\n\n你将看到类似图 9-7 的内容。\n\n![图 9-7](img/518852_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7: Vaex 示例数据集信息\n\n数据的切片和索引操作与 pandas 类似。例如，你想查看第 3 行到第 7 行的`x`、`y`、`vx`和`vy`列：\n\
  \n```python\ndf[['x','y','vx','vy']][3:8]\n```\n\n它将给出预期的输出（图 9-8）。\n\n![图 9-8](img/518852_1_En_9_Fig8_HTML.jpg)\n\
  \n图 9-8: Vaex 数据集索引示例\n\n统计计算非常快速。在我的笔记本上，计算 33 万行数据的平均值耗时不到 20 毫秒。\n\n```python\n\
  %%timeit\ndf.x.mean()\n>> 19.6 ms ± 2.1 ms per loop (mean ± std. dev. of 7 runs,\
  \ 10 loops each)\n```\n\n## 无不必要的内存复制\n\nVaex 最出色的特性之一在于，在执行简单的过滤操作或中间计算时，它不会创建`DataFrame`对象的不必要副本。即使是基础的`DataFrame`也占用极小的内存。所有计算都采用惰性、即时（必要时）的方式完成。\n\
  \n使用以下代码检查内存占用：\n\n```python\nimport sys\n# Vaex 数据框\nprint(\"Size of Vaex DF:\"\
  , sys.getsizeof(df))\n# 转换为 Pandas 数据框\ndf_pandas = df.to_pandas_df()\nprint(\"\
  Size of Pandas DF:\", sys.getsizeof(df_pandas))\n```\n\n输出结果令人惊叹：\n\n```\nSize of\
  \ Vaex DF: 48\nSize of Pandas DF: 13530144\n```\n\n你可以在 Vaex 数据框对象上运行所有必要的计算，而无需过多担心内存错误突然出现。\n\
  \n例如，你可以过滤数据框，只保留那些`x`值为负且`z`值为正的行：\n\n```python\ndf_filtered = df[df.x < 0][df.z\
  \ > 0]\nsys.getsizeof(df_filtered)\n>> 48\n```\n\n正如预期，新的`df_filtered`数据框仍然保持较低的内存占用，但它只有\
  \ 164464 行，而原始数据有 33 万行。\n\n```python\ndf_filtered.shape\n>> (164464, 11)\n```\n\
  \n## 表达式与虚拟列\n\n你可以创建自定义表达式，并将其赋值给虚拟列，同样无需内存复制。在使用纯 pandas 代码时，每次此类操作都有可能产生内存开销。假设你想计算示例数据集中两个列平方和的平方根：\n\
  \n```python\nimport numpy as np\nsqroot_exp = np.sqrt(df['x']**2+df['y']**2)\n```\n\
  \n现在，如果你检查这个`sqroot_exp`，你会发现它是一个特殊的表达式（尚未被求值）。它没有产生任何内存开销。\n\n```python\ntype(sqroot_exp)\n\
  >> vaex.expression.Expression\n```\n\n如果在 pandas 中执行此操作，它会创建一个 pandas 序列对象：\n\n\
  ```python\nsqroot_pandas = np.sqrt(df_pandas['x']**2+df_pandas['y']**2)\ntype(sqroot_pandas)\n\
  >> pandas.core.series.Series\n```\n\n现在，这种 Vaex 表达式可以添加到 DataFrame 中，从而创建一个*虚拟列*。这些虚拟列类似于普通的\
  \ DataFrame 列，只是它们不浪费任何内存。\n\n```python\n# 将表达式赋值给虚拟列\ndf['sqroot'] = sqroot_exp\n\
  # 仅在需要时求值\ndf['sqroot'].mean()\n>> array(8.38820497)\n```\n\n## 在多维网格上进行计算\n\nVaex\
  \ 最有趣的功能之一，是能够快速、高效地在用户可选的网格上计算统计数据。当你想从大量数字中寻找局部最小值或最大值，或数字量在特定区域内的分布时，这有许多实际应用。\n\
  \n```python\ncounts_x = df.count(binby=df.x, limits=[-5, 5], shape=32)\ncounts_x\n\
  >> array([4216, 4434, 4730, 4975, 5332, 5800, 6162, 6540, 6805, 7261, 7478,7642,\
  \ 7839, 8336, 8736, 8279, 8269, 8824, 8217, 7978, 7541, 7383,7116, 6836, 6447, 6220,\
  \ 5864, 5408, 4881, 4681, 4337, 4015], dtype=int64)\n```\n\n结果只是一个 NumPy 数组，包含分布在\
  \ x = -5 到 x = 5 之间的 32 个分箱中的数量计数。这里需要注意的关键点是函数内部的`binby`参数，其作用类似于 SQL 或 pandas\
  \ 中的`GroupBy`。此处数据是按 x 列分组的（`binby=df.x`）。\n\n因此，通过这一行代码，你：\n\n- 将数据过滤/限制在 -5 到\
  \ 5 之间\n- 统计了数据点的数量\n- 将计数分成了 32 个分箱\n\n图 9-9 展示了可视化效果。\n\n![图 9-9](img/518852_1_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9: 特定范围和分箱计数下 x 列数据的计数\n\n想要一个更强大的例子吗？你可以计算速度分量`vx`、`vy`和`vz`平方和的平方根，以获得合速度。不过，你可能只想针对特定的`x`和`y`数据范围执行此操作，并将结果分箱以便于可视化。\n\
  \n```python\n# 只是一个表达式\nvelo = np.sqrt(df.vx**2 + df.vy**2 + df.vz**2)\n# 将表达式传递给函数\n\
  # 按 x 和 y 分箱，范围限制在 -10 到 10\nxy_mean_v = df.mean(velo, binby=[df.x, df.y],\nlimits=[[-10,\
  \ 10], [-10, 10]],\nshape=(64, 64))\n```\n\n你可以绘制合速度在同一 xy 范围内的二维图：\n\n```python\n\
  plt.figure(dpi=120,figsize=(3,3))\nplt.imshow(xy_mean_v.T,\norigin='lower',\nextent=[-10,\
  \ 10, -10, 10])\nplt.show()\n```\n\n图 9-10 显示了结果。\n\n![图 9-10](img/518852_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10: 在 x 和 y 数据的特定范围内计算并可视化的合速度\n\n## 使用控件和其他绘图库的动态可视化\n\n基于 N 维网格的计算在设计上利用了\
  \ Vaex 的快速性。这使得你可以使用控件和 bqplot 等第三方库将可视化扩展到动态形式。遗憾的是，这些动态可视化无法在书籍页面中呈现。不过，Jupyter\
  \ notebook 中展示了一些代码和结果。\n\n例如，这段简单的代码在 Jupyter notebook 中创建了一个绘图控件，你可以在其中平移和缩放，并从下拉菜单中选择一些数据转换。（图\
  \ 9-11 显示了该控件的静态快照。）\n\n![图 9-11](img/518852_1_En_9_Fig11_HTML.jpg)\n\n图 9-11: 使用\
  \ Vaex 绘图控件方法实现的动态可视化快照\n\n对于大规模数据分析而言，此类实用方法的重要性怎么强调都不为过。你可以仅用几行代码，在庞大的、超出核心内存的数据集（例如大小为\
  \ 10GB 或 20GB）上绘制复杂的转换，以可视化隐藏的模式。这极大地提高了此类数据分析流程的生产力和效率，远超仅使用 pandas 和 Matplotlib\
  \ 代码所能达到的水平。\n\n\n\n### Vaex 首选 HDF5 格式\n\nVaex 的强大之处源于其内部优化和数据结构设计。其设计选择之一便是尽可能使用\
  \ HDF5 文件格式。因此，使用 Vaex 的最佳实践是在开始探索数据之前，将其他类型的数据加载为这种格式。为方便起见，Vaex 提供了许多实用方法，可将其他文件或数据结构转换为此格式。你可以从\
  \ CSV、Arrow 表、Python 字典、NumPy 数组、JSON 等格式进行转换。\n\n例如，以下代码将一个中等大小的 CSV 文件（接近一百万行和\
  \ 15 列）转换为 HDF5 文件：\n\n```\ndf2 = vaex.from_csv(\"Large-data.csv\", convert=True)\n\
  ```\n\n运行此代码时，`Large-data.csv` 文件所在文件夹中会生成另一个名为 `Large-data.csv.hdf5` 的文件。切记必须设置\
  \ `convert=True` 才能实现此转换。\n\n之后，你可以读取/打开此 HDF5 文件，其速度远超 pandas 读取 CSV 的速度。以下是完整代码：\n\
  \n```\n# Pandas 读取 CSV\nt1 = time.time()\ndf2_pandas = pd.read_csv(\"Large-data.csv\"\
  )\nt2 = time.time()\nprint(f\"使用 Pandas 耗时 {round(1000*(t2-t1),3)} 毫秒\")\n# Vaex\
  \ 从 CSV 转换\ndf2 = vaex.from_csv(\"Large-data.csv\", convert=True)\n# Vaex 读取 HDF5\n\
  t1 = time.time()\ndf2 = vaex.open(\"Large-data.csv.hdf5\")\nt2 = time.time()\nprint(f\"\
  使用 Vaex 耗时 {round(1000*(t2-t1),3)} 毫秒\")\n```\n\n结果不言自明：\n\n```\n使用 Pandas 耗时 2354.523\
  \ 毫秒\n使用 Vaex 耗时 14.057 毫秒\n\"\n\n在当今的数据科学世界中，包含一百万行的数据集并不算特别大。即使是这样中等大小的文件，pandas\
  \ 从磁盘读取也需要超过 2 秒。而使用 Vaex，在转换为 HDF5 后，读取速度要快得多。因此，对于利用 Vaex 等库的功能的数据处理管道，以系统的方式将所有基于文本的数据文件（CSV，甚至是\
  \ JSON，如果可行）转换为 HDF5，并尽可能将其作为 Vaex DataFrame 读取是合理的，如图 9-12 所示。\n\n![图 9-12](img/518852_1_En_9_Fig12_HTML.png)\n\
  \n转换为 HDF5 并使用 Vaex 可构建更快、更高产的数据科学管道，尤其适用于*内存外（out-of-core）*数据集。\n\n## Modin 实战示例\n\
  \nModin 是一个实际效用属于并行处理或多核处理领域的库。它使用 `Ray` 或 `Dask` 后端，为加速 pandas 笔记本、脚本和库提供了一种轻松的方法。Modin\
  \ 的主要吸引力在于它与 pandas 的紧密集成和完全相同的 API。\n\n你将在下一章看到 Dask DataFrame 和 Ray 的使用。然而，与这些分布式\
  \ DataFrame 库不同，Modin 与现有 pandas 代码（包括 DataFrame 构建）提供了无缝集成和兼容性。基本上，你只需要更改一行代码即可开始使用。\n\
  \n### 从单 CPU 核心到多核心\n\n对于大多数数据科学工作负载，要使用 Modin，你只需像这样开始：\n\n```\nimport modin.pandas\
  \ as pd\n`\n\n仅通过一行代码的简单更改，你就能获得巨大的好处。这是因为，尽管 pandas 拥有众多强大的特性和功能，但其核心实现本质上是单线程的。这意味着在任何给定时间，执行普通的\
  \ pandas 代码只能利用多个 CPU 核心中的一个。在单 CPU 机器（例如，数据科学家的笔记本电脑）上，情况如图 9-13 所示。\n\n![图 9-13](img/518852_1_En_9_Fig13_HTML.png)\n\
  \n仅利用系统单核心的 pandas 代码。\n\n然而，只需用 Modin 包装 pandas 代码（一行代码的更改），你就可以利用所有核心（通过设置 Dask\
  \ 或 Ray 后端集群/工作节点系统），如图 9-14 所示。\n\n![图 9-14](img/518852_1_En_9_Fig14_HTML.png)\n\
  \n利用所有 CPU 核心的 Modin 代码。\n\n\n\n### 核外处理\n\n现在让我们来演示 `Modin` 的核外处理能力。这里的“核”（core）并非指\
