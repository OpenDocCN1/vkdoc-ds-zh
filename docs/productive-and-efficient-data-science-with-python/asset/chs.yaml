  \n带有所有支持类的线性回归评估器\n\n一旦你继承了其他类，它们的行为就像你熟悉的普通 Python 模块一样。因此，你可以向主类添加实用方法，以同时执行子类中的多个方法。例如，下面的方法一次性运行所有常用的诊断检查。请注意，你是通过使用简单的\
