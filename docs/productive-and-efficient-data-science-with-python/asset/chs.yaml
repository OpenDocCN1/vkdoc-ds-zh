  def build_stats_ray(df):\nreturn df.describe().T\n```\n\n现在可以编写类似的代码来测量时间：\n\n```\n\
  t1 = time.time()\nresults = ray.get([build_stats_ray.remote(data_dict['df'+str(i)])\
