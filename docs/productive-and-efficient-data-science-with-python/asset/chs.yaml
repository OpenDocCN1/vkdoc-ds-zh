  ### 简易速度基准测试


  通过一个非常简单的基准测试，你可以展示使用 `CuDF`（当然，是在 T4 GPU 上）带来的计算性能提升。


  首先，构建一个包含 100 万行、100 列随机数（从高斯分布中抽取）的 `NumPy` 数组，然后将其分别转换为 `pandas` DataFrame 和 `CuDF`
  DataFrame：


  ```

