  特别感谢技术审稿人奥斯汀，他提供了极好的反馈和鼓励。在一封邮件中，他写道：“仅供告知，我从你的第 4 章中学到了`CUSUM`，并将其在我们……上运行的基于音频的运动检测器中进行了测试。从指标来看，我发现它效果非常好，明显优于指数加权移动平均（`EWMA`）方法，现在它已成为我们所有产品中运动检测器的默认变化检测算法！”




