- "# 3. 大数据真实性验证方法\n\n机器学习 变化检测 优化技术 自然语言处理 形式化方法 模糊逻辑 信息检索技术 区块链 总结\n\n真实性对于许多研究领域都至关重要。哲学、逻辑学和法律都在深入探讨“何为真”。因此，判定真相往往是多学科交叉的。计算机科学将现实生活及其他学科中的许多现象进行建模。在本章中，我们将广泛审视那些有潜力检测数据真实性层面的框架和技术。这些技术大致可分为以下几类：机器学习、变化检测（用于最小化谎言成本的优化技术）、自然语言处理、形式化方法、模糊逻辑、协同过滤、相似度度量，当然还有区块链技术的应用前景。我们首先从机器学习开始，它常被称为“现代化的砂浆”，有时也被比作在\
  \ 19 世纪末 20 世纪初彻底改变世界的电力。\n\n## 机器学习\n\n正如我们所见，数据的真实性是一个棘手的问题——用软件行业的术语来说，是 NP 难问题。NP\
  \ 代表非确定性多项式时间，这意味着我们无法为该问题找到一个运行时间可以用多项式表示的方法。即使我们找到了一个解决 NP 难问题的算法，它也需要耗费极其漫长的时间，以至于这种方法根本不切实际。研究文献中有充分证据表明，虚假信息遏制（MC）是\
  \ NP 难的。幸运的是，当涉及到生活的复杂问题时，数学总是能伸出援手。数学是事物的核心。一旦用数学表达出来，问题便会迎刃而解，就如同触动人心的对话能化解矛盾一样。但在深入探讨数学抽象概念之前，让我们先思考一下在现实世界中是如何做到这一点的。在现实生活中，我们如何得知某件事是真的？如前所述，许多计算机科学解决方案都源自现实世界或受到现实世界现象的启发。人们常说，数据就像人一样——只要你足够用力地审问它，它就会告诉你任何你想听的话。在重大犯罪案件中，执法人员正是通过这种方式对嫌疑人进行审问以获取真相。我们需要构建合适的框架来审问大数据——这正是大数据分析的全部意义所在。\n\
  \n> **注意**  \n> 大数据真实性问题与执法中的相同问题非常相似。区别在于，前者使用的是数据和工具，而非人。\n\n确立真相是法律斗争的症结所在。我们如何判断某人是否在说实话？我们会检查相关的细节——即场景的某些特征。例如，测谎仪会检测脉搏率、血压、呼吸频率等特征。类似地，大数据也拥有一些分析软件将检测的特征。分析软件中使用的机器学习算法依赖于从现实世界中提取的特征来对数据进行分类。这些特征指示了数据所属的类别。因此，特征对于构建检测真相的模型至关重要。现在让我们来审视评估真实性过程中的步骤。\n\
  \n> **注意**  \n> 就像人一样，数据也拥有能够揭示真相的特征。\n\n为了建立一个数学模型，我们以一个水果摊贩为例。假设我们是没有任何先验知识或直觉的机器。我们如何知道摊贩卖的苹果真的是苹果，橙子确实是橙子，而他并没有说谎？这是通过观察它们的一系列特征得出的，例如颜色、形状、大小、果皮质地、硬度和气味。在此过程中，我们之前已经观察过大量被标记并已知类别的苹果、橙子和其他水果。这些特征并非恒定不变——它们的值不是二元的，而是变化的。我们不能确信任何特征，比如形状或颜色。例如，我们无法肯定地断言所有橙子都是完美的球形，或者所有苹果都是红色的。橙子也可能是椭圆形的，苹果则可能有栗色或其它深浅不一的红色。对这种不确定性进行建模的最佳工具是概率。每个特征（如形状和颜色）都可以被视为一个具有概率分布的随机变量。我们也可以称它们为预测变量（因为它们有助于预测）或自变量，就像坐标系中的自变量\
  \ `x`。\n\n> **注意**  \n> 概率是用于对数据不确定性特征进行建模的主要工具。\n\n\n\n我们大致知道水果特征的概率分布——通过观察一组苹果样本，我们了解了苹果通常的形状和大小。我们将这组数据称为“训练集”，因为通过检查该集合中苹果的特征，我们训练自己识别苹果。依赖于这些特征的变量是水果的类别，在这个例子中就是苹果。给定一个新水果的特征，问题便在于确定其类别——它是苹果、橙子、梨，还是其他水果。我们需要从训练集中构建一个模型，该模型将根据新水果的特征帮助预测其类别。可以将模型视为一个黑盒、一种数学抽象，它接收新水果作为输入，并判断该水果是苹果、橙子还是其他水果。这个黑盒本质上基于训练集中它观察到的带标签的水果，计算关于苹果、橙子等想法的模型。我们将从中抽取新水果的集合称为“测试集”，因为该集合中的水果用于测试我们从训练集构建的模型。我们可以将上述讨论用以下方程表示：\n\
  \n![$$ P(Y=1|X)=f(X) $$](img/A436227_1_En_3_Chapter_Equ1.gif)\n\n(1) 其中\n\n*   ![$$\
  \ X=\\left\\{{x}_1,{x}_2,\\dots, {x}_n\\right\\}, $$](img/A436227_1_En_3_Chapter_IEq1.gif)\
  \ 随机变量`x[i]`的集合\n*   `x[i]` 是表示水果特征的随机变量。\n*   ![$$ P\\left(Y=1|X\\right) $$](img/A436227_1_En_3_Chapter_IEq2.gif)\
  \ 是指在给定特征`X`的条件下，一个水果是苹果（例如）的概率。\n\n> 注意：数据特征在概率分布中被表示为随机变量。\n\n现在让我们继续构建模型。很容易看出，并非所有特征都同等重要。例如，在确定类别时，形状不如颜色或表皮纹理重要，因为橙子和苹果大致都可以是球形的。因此，并非所有特征都具有相同的重要性或权重。我们需要在决定水果类别时对每个特征进行加权。权重越大，该特征对我们的决策就越重要。在上述方程（1）中，`f(X)`\
  \ 用权重表示为：\n\n![$$ f(X)={w}_0+{\\sum}_{i=1}^n{w}_i{x}_i $$](img/A436227_1_En_3_Chapter_Equ2.gif)\n\
  \n(2)\n\n> 注意：数据特征（如同所有真实事物的特征）的重要性只是相对的，因此在做出决策时需要对其进行加权。\n\n在我们将方程（2）代入方程（1）之前，需要意识到方程（1）的左侧（L.H.S.）作为概率，其值总是在\
  \ 0 和 1 之间。因此，我们需要想出一些方法，使得右侧（R.H.S）也始终在 0 和 1 之间。有几种方法可以实现这一点，其中之一是使用“逻辑函数”，表示如下：\n\
  \n![$$ logistic(z)=\\frac{e^z}{1+{e}^z} $$](img/A436227_1_En_3_Chapter_Equ3.gif)\n\
  \n(3)\n\n上述函数始终保证为正但小于 1，非常适合我们的使用。在方程（1）中使用逻辑函数将得到一个模型，该模型有助于识别水果的真实分类。以这种方式使用逻辑函数构建的模型称为“逻辑回归”模型。方程（1）现在转变为：\n\
  \n![$$ P\\left(Y=1|X\\right)=\\frac{e^{w_0+\\sum {w}_i{x}_i}}{1+{e^{w_0+\\sum {w}_i{x}_i}}}\
  \ $$](img/A436227_1_En_3_Chapter_Equ4.gif)\n\n(4)\n\n> 注意：权重（有时也称为特征参数）在确定数据的真实性方面起着关键作用。\n\
  \n现在，确定真实性的问题归结为在上述方程（4）中找到权重`w[0]`、`w[1]`、…、`w[i]`、…、`w[n]`。很容易理解，权重的目标是减少观测值与使用上述方程估计值之间不匹配所产生的误差。在上述方程（4）中，产生最高估计概率的水果类别就是观测水果被选定的类别。如果我们使用上述方程估计一个水果是苹果，我们希望观测到的水果确实是苹果。如果它结果是橙子，那么估计就出错了。我们使用所谓的“最大似然”来减少这种误差的机会，从而通过将上述方程应用于训练集来确定权重。“最大”一词应该让人回想起微积分课程中的“极大值和极小值”。确实，在计算权重时，使用相同的方法和原则。\n\
  \n> 注意：选择权重的目标是减少我们在确定数据真实性时出错的机会。\n\n当我们拿到一个具有给定特征的新水果时，我们将从训练集中推导出的权重以及从新水果中提取的特征代入上述方程（4），以确定该水果是否确实是商家试图销售的那种水果。上述类比适用于任何大数据集。该过程总结如下方的图\
  \ 3-1 所示。大数据可以是社交媒体帖子（如推文）、物联网设备传感器的测量值或其他包含有价值数据的记录。特征可以被提取，结果可以通过手动或自动过程进行标注（打标签）。需要注意的是，训练模型和测试模型必须使用同一组特征。诸如`Amazon\
  \ Mechanical Turk`之类的众包工具通常用于手动标注和特征提取。特征提取通常由本书未涉及的方法自动完成。提出特征的过程（正式称为“特征工程”）本身就是一个研究领域。事实上，机器学习算法的效率在很大程度上取决于提取的特征。对于本书中的示例，我们假设特征是手动提取的。\n\
  \n> 注意：机器学习中的一个重要步骤是对训练数据进行标注。\n\n![A436227_1_En_3_Fig1_HTML.jpg](img/A436227_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1 确定大数据真实性的机器学习过程\n\n自动特征提取的一个例子，比如对于像推文这样的社交媒体帖子，是使用情感分析，它为每条推文输出情感分数。\n\n\
  一旦特征（如情感分数）用数学表示出来，我们就无需再处理原始数据了。我们可以使用统计技术，如上述示例中使用的逻辑回归，对这种数学抽象进行分类，从而得出分类结果。整个流程如图\
  \ 3-1 所示。\n\n> 注意：使用机器学习技术确定大数据的真实性，就像解决数学问题一样，是一个循序渐进的过程。\n\n\n\n### 变化检测\n\n正如我们在机器学习部分所见，数据具有特征。特征在验证事实真伪中起着关键作用。以人类说谎为例，他们的心跳、呼吸、排汗、脉率及其他压力反应生命体征等特征会发生变化，从而表明此人在说谎。测谎仪本质上就是通过检测这些变化来判断说话内容的真实性。同样的原理也适用于某些类别的数据。无正当理由的变化表明可能存在虚假或欺诈行为。例如，如果传感器测量值在某个时间段内出现异常，则可能存在恶意攻击。本书后面关于此主题的章节将讨论如何通过分析微博帖文中情感波动来检测对微博网站的恶意攻击。\n\
  \n**注意**  \n监测变化有助于检测谎言。\n\n数学在这类技术中也发挥着作用。本书讨论的一些变化检测技术包括序列概率比检验（`SPRT`）、`CUSUM`技术以及有时被誉为\
  \ 20 世纪最伟大发明的`卡尔曼滤波器`。这些变化检测技术背后的原理很简单。数据通常遵循某种模式，或者或多或少保持恒定。例如，在持续监护患者时，测量其生命体征的传感器数据通常不会超出特定范围。脉搏率、心率、血压、动脉血氧饱和度、体温和呼吸频率通常恒定或仅有轻微波动。\n\
  \n在这种情况下，对下一个数据点的良好估计通常是当前的观测值，代表维持现状。为了适应波动，需要将后续观测值纳入估算方案中。因此，我们从第一个值作为估计值开始。下一个估计值可以是前一个估计值与当前观测值的平均值，以此类推。在此过程中，我们观察数值相对于估计值的变化，并分析这些变化以确定是否存在完整性丧失的可能性。例如，如果观测值比估计值高出某个阈值，则可能存在异常。\n\
  \n并非所有变化都是异常导致的，因此变化检测比简单地寻找与前一个值相差特定阈值的变化要复杂得多。需要更深入地分析这些变化才能获得更准确的结果。许多变化检测技术，如`卡尔曼滤波器`、`CUSUM`和`SPRT`，都可以用于以更可靠的方式分析变化。此方案的总体概览如图\
  \ 3-2 所示。使用估计或其他统计技术对观测到或给定的数据进行变化分析。`卡尔曼滤波器`使用估计，而`CUSUM`使用累积和来分析变化。根据分析结果，数据可能被标记为虚假或真实。\n\
  \n**注意**  \n与机器学习一样，在某些变化检测技术中，估计或预测真实值是关键。\n\n![A436227_1_En_3_Fig2_HTML.jpg](img/A436227_1_En_3_Fig2_HTML.jpg)\
  \  \n**图 3-2** – 用于大数据真实性检测的变化检测方法概览\n\n上述通过使用估计值与观测值的平均值进行估算的简单方案忽略了从错误中学习。通常需要一个反馈循环来提高估计的准确性。像`卡尔曼滤波器`这样的技术除了在得出估计值方面进行其他改进外，还包含一个反馈循环来改进估计。下一章将详细讨论这些内容。反馈循环本质上是一种测量更新——基于观测值或测量值对估计值进行更新。反馈循环如图\
  \ 3-3 所示。\n\n**注意**  \n根据性能反馈调整行为是一个关键的系统概念，是一些算法（如可用于变化检测的`卡尔曼滤波器`）的特征。\n\n![A436227_1_En_3_Fig3_HTML.jpg](img/A436227_1_En_3_Fig3_HTML.jpg)\
  \  \n**图 3-3** – 插入反馈循环以改进估计\n\n尽管像`卡尔曼滤波器`这样的技术有助于检测变化，但并非所有被算法标记为虚假的数据都是真的虚假。算法会受到误报的影响。像`CUSUM`这样的算法在离线数据上表现最佳。由于这些原因，单一的变化检测算法有时不足以准确发现异常。在这种情况下，为了获得更好的准确性，会使用一种或多种算法的集成。每种算法都可以通过调整其内置的特定参数来进行微调，以提高准确性。就像机器学习一样，这些微调参数是使用数据的“训练集”预先确定的。然后，这些参数可以应用于输入的实时数据。\n\
  \n**注意**  \n`卡尔曼滤波器`实际上是一种也可以用于变化检测的估计算法。\n\n确定微调参数的过程如图 3-4 所示。在训练数据上依次运行这些算法以获得参数。训练数据中的数据点已经标注了真实和虚假。用多种可能的参数值运行算法；其中，与标注的训练数据匹配度最高的参数组合被保留下来，用于后续对实时数据（也称为“测试数据”）的处理。\n\
  \n![A436227_1_En_3_Fig4_HTML.jpg](img/A436227_1_En_3_Fig4_HTML.jpg)  \n**图 3-4**\
  \ – 在训练数据上获取算法的微调参数\n\n然后，可以使用算法的集成来克服彼此的局限性。例如，`CUSUM`在离线数据上效果最佳，但受误报影响较小。另一方面，`卡尔曼滤波器`受误报影响，但适用于实时数据。当作为集成使用时，这两种算法可以相互补充。集成方法如图\
  \ 3-5 所示。输入的实时数据首先由`卡尔曼滤波器`算法处理。如果该算法表明数据完整性可能受损，则对到目前为止已接收的数据调用`CUSUM`算法。如果`CUSUM`未指示数据被篡改，处理将停止，这意味着`卡尔曼滤波器`算法产生了误报。否则，可以进一步利用其他变化检测方案来评估数据是否确实受到了不利质量的影响。\n\
  \n![A436227_1_En_3_Fig5_HTML.jpg](img/A436227_1_En_3_Fig5_HTML.jpg)  \n**图 3-5**\
  \ – 使用变化检测技术确定大数据真实性的集成方法\n\n集成算法的另一种方法是实现一个简单的投票机制，即由不同算法独立处理数据，并且只有当大多数算法指示篡改时，才认为数据已受损。我们将在后面的章节中更详细地研究变化检测方案和集成方法。\n\
  \n\n\n### 优化技术\n\n在上述关于变化检测技术的讨论中，我们看到微调参数是通过在训练数据上对算法进行多次试验获得的，而这些训练数据已被标注为真或假。粗暴地遍历大量可能的取值是低效的。我们需要优化寻找参数的方式。只要有改进的空间，优化技术就会发挥作用。优化的目标是尽量减少与做事方式相关的低效或“成本”。从数学上讲，成本可以抽象为多个变量的函数。许多问题当被表述为优化问题时就能得到解决。真实性验证问题也不例外。\n\
  \n在讨论机器学习方法时，我们已经粗略地谈到了最小化成本。我们试图最小化的成本是估算水果种类时的出错概率。我们选择权重或参数的方式是为了使这种成本或出错概率最小化。对于变化检测算法，选择次优参数是有成本的。这个成本就是因选择次优参数而导致的错误分类数量。在这种情况下，成本函数可以是由所谓的“混淆矩阵”推导出的一个表达式。\n\
  \n> **注意**  \n> 谎言和受损的数据是有成本的——即虚假成本。优化技术有助于选择算法和方法，通过解决朝着此目标的子问题来最小化这种成本。\n\n混淆矩阵，有时也称为“误差矩阵”，是一个简单的二维表格，其中观测值作为行，估计值作为列。查看该表格，我们可以了解我们用于判断真实性的算法有多“困惑”。如果算法表现良好，预测值（列）应与观测值（行）匹配。混淆矩阵能直观地展示算法的表现。混淆矩阵有助于可视化真正例、假正例、真负例和假负例。这些术语如图\
  \ 3-6 所示。假正例也称为第一类错误，假负例称为第二类错误。\n\n![A436227_1_En_3_Fig6_HTML.jpg](img/A436227_1_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6** 可以从各种性能指标计算出成本函数\n\n假负例条件或第二类错误的一个例子是，当发生火灾时火警没有响。假正例则是没有火灾时火警响了。就像火警的情况一样，数据的真实性本质上是一个分类问题——数据需要被分类为真或假。错误的分类具有随领域而变化的成本。成本中一个常用的组成部分是错误率，其定义如下面的公式(5)所示：\n\
  \n```\nξ = (FP + FN) / (TP + TN + FP + FN)\n```\n\n(5)\n\n```\n其中：\n      FP = 假正例数量；\n\
  \      FN = 假负例数量；\n      TP = 真正例数量；\n      TN = 真负例数量\n```\n\n对于某些领域如健康领域，可以理解的是，在某些情况下假正例或第一类错误的成本比假负例高出许多倍。例如，如果诊断测试错误地显示患者的血糖水平偏高，并基于此假设给予胰岛素，这可能是致命的。另一方面，如果测试错误地显示血糖水平不高，而实际上血糖确实高，患者可能仍能忍受这种状况，直到症状恶化并进行另一次测试。在其他一些情况下，比如未能及早识别恶性肿瘤，这可能是致命的。在这种情况下，假正例的成本可能不高，因为它可能只会导致进一步的检查，而这些检查最终可能得出这是假正例的结论。或者，它可能导致不必要的手术切除良性肿瘤，这成本也不高。\n\
  \n另一种不同类型的例子是我们之前考虑的火警。在这种情况下，假负例比假正例更具灾难性。通常（但并非总是），维持现状比得出错误结论的成本更低。在确定成本函数时，需要考虑这些因素。简单的错误率可能并不总是合适的。反映领域特征的参数需要包含在成本函数中。从我们之前讨论的关于机器学习方法的水果商贩例子和逻辑回归模型中可以很容易地看出，成本随我们为特征选择的权重而变化。\n\
  \n> **注意**  \n> 假正例通常具有更高的成本。\n\n例如，如果我们对水果形状的权重高于对其表皮纹理的权重，那么橙子也有可能被归类为苹果，从而增加模型的成本。应该选择权重以最小化成本。实际上，机器学习模型会选择在应用于训练数据时使模型成本最小化的参数或权重。训练数据已经具有正确的分类或观测值，因为它已被标注，因此我们可以计算上面讨论的错误率。机器学习模型本质上用参数或权重（通常用`θ`表示）来表示成本，并试图找到使成本最小的`θ`。\n\
  \n在试图找到最小化成本的参数时，通常需要满足一些约束条件。一个典型的约束可能是参数或权重大于 0。即使成本函数和约束函数是“平滑的”，求解优化问题也相当困难。平滑函数在绘制时具有直观的连续含义，没有任何突变。从数学上讲，这意味着该函数在给定域内具有连续导数（斜率）。尽管求解困难，但存在有效的方法来解决优化问题。\n\
  \n机器学习模型是优化框架的一个特例。优化技术的应用范围远远超过机器学习模型所能解决的问题。优化实际上是一个普遍存在的问题。从原子结合成分子以优化能量，到在生活中实现和平与繁荣，优化在大多数宇宙现象中都扮演着角色。因此，在优化问题中，被最小化的并不总是成本。被优化的函数更通用的术语是“目标函数”。一旦我们有了目标函数和定义参数约束的函数，优化框架的工作就是最小化或最大化目标函数。如果目标函数是成本，我们选择参数来最小化它。\n\
  \n> **注意**  \n> 根据领域的不同，可能需要使用超出典型机器学习模型范围的优化技术来解决真实性验证问题。\n\n\n\n### 自然语言处理\n\n\
  大量大数据以英语和中文等自然语言形式存在。数据真实性问题在这种数据形式中尤为普遍，这要归功于 Web 2.0——社交媒体。讽刺的是，同样的数据也可用于验证其他领域数值数据的真实性，例如纳税申报。最近，印度中央直接税局将价值\
  \ 1 亿美元的项目授予 L&T Infotech 公司，旨在根据社交媒体帖子检测逃税行为。该公司计划根据网络上可获取的个人及其家庭信息，建立“个人的系统化网络”。随后，该“系统化网络”将被用于识别表明逃税的模式。\n\
  \n文本数据的真实性问题比数值数据更为棘手。处理文本数据的一种方法是从中生成数值，例如通过情感分析。有趣的是，文本本身已被证明具有某些统计特性。例如，任何语言的文本都遵循齐普夫定律，该定律指出：在大型语料库（如书籍）中，单词出现的频率与其在频率表中的排名成反比。这一统计特性有一个有趣的推论：任何语言的相当大一部分都由少量词汇组成。例如，在英语中，仅“the”和“be”等\
  \ 10 个单词就占据了语料库——即世界上所有英语文本的普遍集合——的 25%。因此，大型语料库中词汇的统计分布遵循所谓的幂律分布，即一个变量随另一个变量的幂次变化。\n\
  \n统计学和概率论可用于检测独特的语言风格，从而识别谎言，因为欺诈性语言通常遵循某些特定风格。语言模型对此很有用，它是词语序列的概率分布。给定一个词语序列`w[1]`、`w[2]`、……`w[i]`、……、`w[n]`，语言模型可以给出这些词语按顺序出现的概率`P(w[1],\
  \ w[2], … w[i], …, w[n])`。有了被分类为真实或欺诈的训练文本数据的语言模型，机器学习分类技术可用于判断给定测试文本数据的语言模型是否指向虚假信息。\n\
  \n> **注意**  \n> 文本数据展现出数值属性，并且出人意料地适合进行数值和计算处理。\n\n一个相关的工具是`PCFG`，即概率上下文无关文法。文法是一套构建某种语言句子的规则。上下文无关文法（`CFG`）是指这些语言规则可以不考虑上下文而使用。上下文是除表达式本身之外有助于我们理解表达式的所有信息。`CFG`忽略上下文，只关注生成语言所用的规则。`PCFG`则是每条规则都关联一个概率的文法。`PCFG`在分析给定文本的句法风格方面非常高效。将概率引入`CFG`使得推导语言模型时更加灵活。`PCFG`可以使用被标记为真实或欺诈的训练文本集进行训练。对于新的文本集，可以将`PCFG`生成的解析器与训练集生成的解析器进行比较，以判断文本真实性。\n\
  \n> **注意**  \n> 解决真实性问题的多种技术中，一个共同的主题是概率。\n\n真实性的特征之一是正式性。人们在会见陌生人、处理重要事务或发表演讲时会穿着西装、领带等正式服装。即使在语言中，正式性也一直是可信赖的标志。就表达所施加的严谨性而言，语言正式性与逻辑或数学的正式性密切相关。有许多\
  \ NLP 工具可以衡量给定文本片段的正式性。正式性得分可作为文本真实性的一项指标。\n\n当文本以适当格式表示时，可以进行风格和结构上的比较。其中一种表示方式是解析丛（Parse\
  \ Thicket）。解析丛是一个捕获给定文本片段句法细节的图。解析是分析句子并将其句法结构捕获到数据结构（如树）中的活动，该数据结构使得句子能够被计算处理。Thicket（丛）在英语中意为茂密的树丛。因此，解析丛是文本片段中每个句子的解析树的密集集合。解析丛可以多种方式应用于解决现实世界问题，其中之一就是真实性。例如，可以通过搜索两个文本片段之间的公共子图来检测抄袭。通过将给定文本的解析丛与已知为真实的文本的解析丛进行比较，可以确定给定文本的真实性。\n\
  \n以上是句法工具。一种可用于确定给定文本真实性的良好语义语言学技术是文本蕴含——分析给定句子是否在语义上遵循其他句子。当一个句子从真实句子推导出来时，它更可能是真实的。类似地，从已知为假的句子蕴含出的句子可以被推定为假。有许多工具用于识别文本蕴含（`RTE`）。这里的关键仍然是对文本进行可计算处理的表示。我们将在后续章节研究一些工具和表示方法。\n\
  \n> **注意**  \n> 知识表示是计算处理以及验证知识内在真实性的关键。\n\n\n\n### 形式化方法\n\n我们能否为真实信息设定一套语法？很多人最初会明确回答“不能”。但正如我们将看到的，在数理逻辑中，确定一个陈述的真实性是一个句法处理问题。因此，这个问题并非完全离谱，并且很可能是未来建立真实世界研究的关键。正如我们之前所说，数学是事物的核心。一旦用数学表达，问题便迎刃而解。形式化方法恰恰帮助我们做到这一点。它们为我们提供了将现实世界系统表示为数学实体的工具集。当被表示为数学实体时，这些系统可以在更深层次和更细微的层面上得到客观评估，其属性也能得到验证。\n\
  \n形式化方法以有助于推理的方式简洁地描述系统的行为。系统使用具有标准化语法和精确定义语义的语言进行规约，以支持形式化推理，即从一组其他真实陈述中推断出一个陈述。机器学习接受了不精确性和模糊性。我们在这里需要转换思路，要求像布尔逻辑这样的形式化方法要有效工作，已知为真的知识必须清晰明确地表达，不能有任何模糊或不确定性。还有一种布尔逻辑的扩展，称为模糊逻辑，它可以处理不精确性和模糊性。形式化方法可以分为形式化规约、证明、模型检验和抽象化。\n\
  \n与真实性问题特别相关的是形式化方法中的逻辑规约类别。逻辑是数学的一个分支，帮助我们推理系统、其规约和属性。命题演算，也称为零阶逻辑，是一个基本的规约系统，允许我们表达陈述；陈述之间的关系；并利用这些关系计算复合陈述的真值。真值可以通过真值表逐行检查。\n\
  \n如果一个逻辑句子有 `n` 个命题符号（可以把它们想象成英文语句），通过像 `or` 和 `and` 这样的运算符连接起来，那么要检查该句子的真实性，需要\
  \ `2^n` 行来处理这 `n` 个符号各自可以取的两个值（真和假）的所有排列组合。这在计算上是显然不可行的。实际上，这是第一个被证明是 `NP-Complete`\
  \ 的问题——`NP` 代表非确定性多项式时间，我们之前也讨论过。此外，利用命题演算系统有限的表达能力，我们能够实现的目标非常有限。因此，我们考虑下一阶的逻辑，即\
  \ `First-Order-Logic`（一阶逻辑，FOL）系统。\n\n`FOL` 比命题演算更具表达能力。它允许对变量进行量化。`FOL` 中使用的量化运算符是全称量词，写作\
  \ `∀`，以及存在量词 `∃`。这些额外的运算符使得处理所有或某些实体成为可能。在 `FOL` 中，可以通过使用‘证明’形式的推理规则来推导真值。一个证明是一个陈述序列，能够成功地论证给定陈述的真实性或其缺失。在这种证明中使用的一个规则示例称为‘假言推理’。该规则简单陈述为：如果\
  \ `p` 则 `q`，并且 `p` 为真，那么 `q` 为真。无论这听起来多么直观和基础，这个规则都非常强大，整个名为 Prolog 的语言就是基于这个基本规则。\n\
  \n一个可靠的逻辑系统是指：如果一个句子是可证明的，那么它也必定是真的。一个可靠的系统永远不会证明一个不真的句子。另一方面，一个完备的系统能够证明所有真的句子。如果一个句子在完备系统中是真的，那么它就是可证明的。在一个可靠且完备的\
  \ `FOL` 中，真值的推理已被证明是难以处理的，在计算上不可行。因此，在推理系统中只使用了 `FOL` 的一个小子集。例如，在 Prolog 中，推理主要就是像前面指出的那样，仅使用假言推理规则来完成。\n\
  \n> **注意**  \n> 逻辑在很大程度上对计算机来说是难以处理的。在逻辑等较为软性的方面，人类思维远远优于机器。\n\n系统已知为真的知识库包含了事实和规则。例如，Prolog\
  \ 中一个简单事实的例子是：\n\n```\nfemale(Mary)\nparent(Mary, Ann)\nfemale(Coco)\nparent(Coco,\
  \ Mary)\n```\n\n而规则的例子是：\n\n```\nmother(X, Y) :- parent(X, Y), female(X)\ngrandmother(X,\
  \ Y) :- mother(X, Z), parent(Z, Y)\n```\n\n现在，如果我们被问及 Coco 是否是 Ann 的祖母，写成：\n\n```\n\
  grandmother(Coco, Ann)?\n```\n\n通过应用假言推理规则以及知识库中的上述两条规则，可以推断出该陈述确实是真。从上面可以看出，只要系统被适当地规约，推断真值就变成了一个句法处理问题。因此，在大数据真实性问题中，知识表示或规约起着关键作用。\n\
  \n\n\n## 模糊逻辑\n\n如上所述，使用可靠且完备的逻辑系统进行推理，即便表征精确且无歧义，对计算机而言也是难以处理的。与系统被完整且精确地描述时相比，歧义性、不确定性和不精确性使得人类处理系统变得更加复杂。令人惊讶的是，得益于该领域的众多发明，机器处理不精确性的能力远超我们的预期。最早为处理不精确性和不确定性而发明的科学之一被称为**模糊逻辑**。它更契合人类在非理想化世界中的思考和行为方式。例如，假设第一位主讲人拉曼今天抵达的可能性为\
  \ 60%，第二位主讲人威廉今天抵达的可能性为 20%，那么关于拉曼和威廉今天都抵达的可能性，我们能得出什么结论？常识告诉我们，两人都今天抵达的可能性是 20%，因为这是两者中可能性最小的百分比值。\n\
  \n在模糊逻辑中，上述常识推理被抽象为模糊`与`运算符。使用模糊逻辑的符号表示，上述内容可写成：\n\n```\n{\\mathrm{m}}_{R\\cap W}(today)=\\\
  min \\left({\\mathrm{m}}_R(today),{\\mathrm{m}}_W(today)\\right)\n```\n\n其中`{\\\
  mathrm{m}}_{R\\cap W}(today)`是今天属于拉曼可能抵达的天数集合与威廉可能抵达的天数集合之交集时的隶属函数。利用类似的常识，我们可以写出：\n\
  \n```\n{\\mathrm{m}}_{R\\cup W}(today)=\\max \\left({\\mathrm{m}}_R(today),{\\mathrm{m}}_W(today)\\\
  right)\n```\n\n这里，`{\\mu}_{R\\cup W}`是拉曼或威廉今天抵达的可能性。推理过程类似于我们在“形式化方法”部分讨论的传统逻辑，但结合了上述的隶属函数计算。使用模糊逻辑进行推理是近似的，因此被称为*近似推理*。事实上，使用传统逻辑进行推理可以看作是近似推理的一个边界情况，即所有隶属函数都等于\
  \ 1 或 0 的情况。\n\n从以上描述可以看出，在不确定条件下推断真值是一个可能性的问题。模糊逻辑只能推断出一定程度的真值。在上述会议主讲人的例子中，它只能推断出拉曼和威廉今天抵达的可能性为\
  \ 20%，而传统逻辑如果能拥有进行预测所需的 100% 准确信息，则会推断出两人都抵达的可能性为 100% 或 0%。可以通过将隶属函数代入为 1 或 0，并确保其行为与传统逻辑系统等价，来确认模糊逻辑系统的正确性。传统逻辑系统只能处理隶属函数为\
  \ 1 或 0 这一种完美情况，而模糊逻辑提供了处理这些情况以及介于两者之间所有情况的工具。\n\n> 注：模糊逻辑可以被视为清晰逻辑（也称为布尔逻辑）的超集或扩展。\n\
  \n### 信息检索技术\n\n寻找真相有时会涉及信息检索。当我们对一个新陈述不确定时，大脑会从过去检索信息来与之进行比较和对比。信息检索科学提供了许多计算工具，利用机器来完成大脑的相同任务。其中两个工具是向量空间模型（VSM）和协同过滤。为了发现两个文档之间的相似性，我们再次求助于数学，更具体地说，是向量代数，当然，也依赖于使用向量代数原理表示信息。\n\
  \n在用于文本挖掘的向量空间模型（VSM）中，每个文档被表示为多维空间中的一个向量。多维空间中的每个轴代表一个词，在信息检索的术语中也称为一个*术语*。如果语料库包含\
  \ 10,000 个术语，那么我们的多维向量空间中就会有 10,000 个轴。要在这种高维向量空间中表示一个文档，我们需要该文档在每个维度上的一个值，就像笛卡尔平面上的坐标一样。这个值通常是某个术语的`TF.IDF`。`TF`代表词频，`IDF`代表逆文档频率。`TF`是术语（即词）在给定文档中出现的次数。`IDF`表示该术语的独特程度。`IDF`由以下表达式给出：\n\
  \n```\n{\\displaystyle \\begin{array}{l}\\kern19.75em ID{F}_t=\\log \\left(\\frac{N}{d{f}_t}\\\
  right)\\\\ {} where\\\\ {}\\kern4.75em N\\kern0.5em is\\kern0.5em the\\kern0.5em\
  \ number\\kern0.5em of\\kern0.5em documents\\kern0.5em in\\kern0.5em the\\kern0.5em\
  \ collection\\kern0.5em and\\\\ {}\\kern4.25em d{f}_t\\kern0.5em is\\kern0.5em the\\\
  kern0.5em number\\kern0.5em of\\kern0.5em documents\\kern0.5em in\\kern0.5em which\\\
  kern0.5em the\\kern0.5em term,\\kern0.5em t\\kern0.5em appears\\end{array}}\n```\n\
  \n`TF.IDF`就是`TF`和`IDF`的乘积。当今的计算设备功能强大，即使语料库相当庞大，也能在瞬间计算出这些值。一旦针对某个给定文档获得了每个术语的`TF.IDF`，就可以将其绘制成高维空间中的一个向量。一旦被绘制成向量，寻找文档相似性的问题就简化为寻找向量之间的接近度。寻找向量接近度有多种方法，其中流行的是余弦相似度，它测量两个给定向量之间的夹角。向量空间模型（VSM）对于解决诸如抄袭之类的真实性问题以及通过将新文档与已知的真实信息源进行比较来建立信息的可信度特别有用。\n\
  \n> 注：即使在处理真实性问题的信息检索方法中，解决方案也在于使用数学结构表示数据并高效地处理它们。\n\n推荐系统中一种广泛使用的技术是协同过滤（CF）。我们在日常生活中以多种方式使用这种技术：从图书馆的“近期归还”书架上选书，而不是进去搜索；收听其他人喜欢的\
  \ Top 10 歌曲；在树林中沿着有人走过的小径徒步；在我们自己的论文中引用高质量的研究论文，等等。所有这些例子中的共同点是，我们依赖他人的品味、工作或研究来从事与他们相似的活动。协同过滤（CF）是一种依赖他人判断来过滤信息并做出自己选择的行为，从而间接地与他们协作。CF\
  \ 的经典应用传统上是根据一组其他用户对某个产品的评价，预测一个用户是否会喜欢一个她从未评价过的物品。\n\n显而易见，CF 如何有助于解决真实性问题。举个简单的例子，一个供应商的可信度可以通过将其价格与其他供应商的价格进行比较来确定。CF\
  \ 可以有效地用于信任传播。正如我们根据他人的判断形成意见并塑造我们的工作一样，可信度也可以基于他人的意见来确定。必须注意，CF 与投票机制截然不同。正如我们将在后续章节中看到的，CF\
  \ 使用了相似度度量，例如我们上面讨论的余弦相似度。\n\n\n\n### 区块链\n\n近年来出现的一种全新信任范式是区块链技术，它是革命性加密货币的基础。鉴于对加密货币的投资以及它在全球赢得的信任，区块链显然是一项有望在很大程度上解决真实性问题的前景技术。Facebook\
  \ 最近宣布将利用区块链技术打击假新闻。还有其他一些公司正在利用区块链解决这一问题。这项技术本身能够成为无需任何中介或政府干预的重要货币的基础，这恰恰证明了其在解决真实性问题上的可信度与潜力。\n\
  \n区块链本质上就是一条由区块组成的链条——类似于链表数据结构，但具有一些特殊特性。在区块链技术中，通过使用加密哈希函数确保历史记录的不可篡改性。所使用的哈希链有一个有趣的特性：若不改变链中的每一个其他元素，就无法更改其中任何一个元素。区块链作为所有参与者共享的分布式账本。交易中出现的任何分歧都通过共识机制来解决。在某种程度上，区块链技术具备维基百科的一些要素，这使其值得信赖。然而，它们有着根本性的不同：维基百科的数据库是中心化的，而区块链基于点对点（`P2P`）网络。\n\
  \n**注：** 区块链技术带来了一种构建系统和流程的机制，这些系统和流程可以完全值得信赖，达到完美的程度。\n\n## 总结\n\n真实性在许多领域都是一个难题，可以通过多种方式加以解决。在本章中，我们介绍了可用于解决该问题的一些方法。本章的内容必然会激发读者的好奇心，同时也留下了一些未解答的问题。在后续章节中，我们将更详细地探讨每种方法，并回答本章可能引发的疑问。下一章将从变更检测技术开始。\n\
  \n### 练习题\n\n1. 在本章中，我们提到了印度政府授予了一份价值 1 亿美元的合同，用于从社交媒体数据中检测逃税迹象。请搜索更多类似示例，说明大数据如何帮助解决真实性问题。\n\
  2. 还有其他更多用于验证信息完整性的方法，已在其他应用中使用。分布式计算领域的一个例子是拜占庭将军模型。请描述如何将其用于大数据真实性问题的背景中。\n3.\
  \ 研究将区块链技术用于不同类型大数据的可行性。\n\n"
- "# 变更检测技术\n\n序贯概率比检验 (SPRT) | CUSUM 技术 | 卡尔曼滤波器 | 总结\n\n大数据的虚假性和不准确性表现为不同形式。在本章中，我们将探讨其中一种表现形式，并考虑识别它的方法。这种表现在网络上发布的信息中尤为常见。通过网络上发布的信息以某种方式影响在线好友和关注者的情况并不少见。当这种影响带有隐藏目的、基于谎言、意图恶毒并波及大量人群时，就成为了一个问题。本章介绍的技术正是针对这种虚假性表现。这些技术也可应用于其他场景，例如物联网中传感器数据质量在短时间内下降的情况。\n\
  \n唯有真理长存。其余一切终将湮没。谎言无法长久。真理是纯粹的。它是人类沟通、共存乃至文明本身的基础。真理可被视为现状、常态。那么，虚假则可被视为一种变化、一种杂质、一种对预期的偏离。借用电气工程的类比，真理是信号，谎言是噪声。因此，可以通过使用变化和噪声检测技术，从真理中辨别出谎言。举个简单的例子：考虑一个分析学校作文的软件程序。如果所有作文都把大象描述为一种四足动物，而有一篇作文把大象描述成鸟，那么后者可以被判定为虚假。如果该程序将不同作文中对大象的描述制成表格，那篇把大象描述成鸟的作文中的虚假说法就会凸显出来，表现为一种变化或噪声。\n\
  \n变更检测是许多工程、生物和金融流程中常用的常规方法。这些技术本质上主要是统计性的。我们将在从量化过程获得的数据点时间序列上使用这些技术，正如第三章“建立大数据真实性的方法”中所述。在微博客的情况下，时间序列包括从情感分析中获得的分数。通过部署黑客手段来影响和操纵公众舆论的微博客，其情感分数必然异常，因此可以使用本章描述的一些技术来检测它们。\n\
  \n**注：** 谎言是对常态的偏离。真理经得起时间的考验。没有谎言能瞒过时间。不真实就像一次尖峰、一阵炒作，无法持久。\n\n事实证明，微博客对公众舆论有重大影响。我们从美国大选中就看到了它们的影响力，最早可追溯到\
  \ 2008 年巴拉克·奥巴马首次参选之时。在像 Twitter 这样的微博客网站上发布虚假、破坏性的信息，无异于在电影院大喊“着火 了”。安德烈斯·塞普尔韦达意识到了微博客在总统选举等重要社会进程中的作用。“当我意识到人们更相信互联网上说的话而非现实时，我发现自己拥有了让人们相信几乎任何事情的能力，”他说。\n\
  \n![A436227_1_En_4_Fig1_HTML.png](img/A436227_1_En_4_Fig1_HTML.png)\n\n**图 4-1**\
  \ 大数据时间序列中不真实性的图形化描述\n\n\n\n\n近十年来，正如他所坚信的那样，人们一直相信他在某微博网站上实施的内容注入攻击。这种注入式影响左右了南美国家总统选举的结果长达十年之久，而其始作俑者安德烈斯·塞普尔维达（Andrés\
  \ Sepúlveda）目前正因该罪行服刑十年。这个故事再次有力地证明了大数据真实性的重要性。如果微博网站当时设有检测此类注入式影响攻击的机制，那么安德烈斯·塞普尔维达所左右的总统选举结果或许会截然不同。正如本章将要探讨的，实施这些检测机制并非难事。\n\
  \n> **注**  \n> 微博网站上的注入式影响攻击可定义为：发布蓄意的、恶意的微博内容的行为（通常（但并非总是）借助自动化手段和黑客技术），以影响其他用户的观点。\n\
  \n图 4-1 是对大数据中虚假性的一种解读。图中的线条并非刻意画得笔直，因为数据质量确实会随时间波动。但与存在大量不实信息时相比，这些波动是微乎其微的。为了检测诸如图中所示的不准确、不确定数据点的时间序列变化，我们需要一种方法来捕捉截至任何给定时间点所有数据点的代表性状态。这是能完整且递归地总结给定系统所有先前状态的最小构件。这种代表性状态应能累积截至某个时间点的状态相关方面。监控这种代表性状态将有助于检测可疑的变化。\n\
  \n打个比方，就像一个人陷入抑郁。负面情绪、失败经历以及各种其他影响个人心理的因素会随时间累积，最终导致抑郁。当一个通常快乐积极的人变得悲伤时，我们能够察觉到这种变化并试图加以预防。快乐是常态或“信号”，而悲伤则是可被检测到的变化或“噪音”。这个人的精神状态代表了时间线上所有发生过的事情。如果我们监控精神状态，就有可能检测到心理抑郁的进展。当心理状态悲伤和抑郁超过某个临界点，就意味着发生了不良变化，需要采取纠正措施。\n\
  \n> **注**  \n> 要使变化检测生效，我们需要一种方法来为大数据值的时间序列建立代表性状态模型。\n\n本章描述的技术，正是将上述类比中的过程应用于数据。这些技术是统计性的，因此只能处理数字。因此，如果数据（如微博内容）是非数值型的，量化就至关重要。即使数据是数值型的，确保数据值本身的准确性也很重要。因此，我们在第一章中介绍的价值评估也扮演着重要角色。本章介绍的变化检测技术也对底层数据的某些统计特性做出了假设。\n\
  \n一个常见的假设是“高斯假设”，即数据符合正态概率分布。高斯分布的均值、众数和中位数都相等。这个假设并不苛刻，因为大多数自然科学和社会科学的数据通常都会收敛于正态分布，尤其是当数据样本量足够大时（正如大数据所呈现的那样）。感兴趣的读者可以参考中心极限定理了解更多细节。经典统计学在不少价值评估方案中也扮演着重要角色。因此，大数据理论需要相当扎实的理论概率论和统计学基础。\n\
  \n本章所介绍技术的一个优势是，它们相关性较弱，并且对底层数据的概率分布不太敏感。我们无需严格确保数据是正态分布才能应用这些技术。此外，研究表明，诸如来自微博的大数据具有某些统计特性，通过对微博进行情感分析可以实现意见挖掘。例如，美国语言学家乔治·金斯利·齐夫（George\
  \ Kingsley Zipf，1902–1950）的一个惊人发现是，在任何一个大型语料库中，英语单词（或任何自然语言的单词）的出现频率与该词在频率降序排列中的排名成反比。\n\
  \n举个例子，在当代美国英语语料库（COCA）中，单词“the”是最常用的词，其次是单词“be”。根据齐夫的发现，“the”在 COCA 中出现的频率应该是“be”的两倍左右，而令人惊讶的是，事实确实如此。当语料库遵循齐夫定律时，我们称其近似于齐夫概率分布，这是一种幂律分布。幂律分布的特点是图形具有长尾特征，只有少数值主导着分布。正是基于这一特性，在布朗美国英语文本语料库中发现，仅\
  \ 135 个单词就占据了语料库的一半，而许多单词只被使用了几次，这使得分布对于那些使用较少的众多单词呈现出一条长尾。研究已证明，微博数据符合齐夫定律，展现出齐夫分布的统计特征。在这些发现的保证下，我们现在可以继续检视一些用于变化检测的技术。\n\
  \n> **注**  \n> 令人惊讶的是，我们周围看似混乱的数据中存在着秩序，尤其是当数据像大数据那样庞大时。\n\n既然我们已经确信大数据具有某些统计特性，接下来就要探讨监控数据以识别虚假性的方法。一种粗暴、粗略且简单的变化检测方法是监控数值是否存在任何异常模式，并根据观察结果得出数据被篡改的结论。但这样做，我们忽略了问题中涉及的不确定性成分。如果这些异常模式实际上是真实的，而非任何篡改的结果，该怎么办呢？例如，一个人变得易怒和极度悲伤，并不一定意味着他正在陷入抑郁。偶尔的情绪波动并不罕见。因此，仅仅监控时间序列值（或本例中的情绪状态）是不够的。我们需要监控截至当时整个时间序列的代表性状态。因此，我们需要稳健的算法。\n\
  \n我们无法确定某个特定的变化是否真的意味着虚假。我们需要引入概率来处理这种不确定性。正如我们将在以下章节中看到的，使用统计学和概率论来监控数据流，也能使变化检测更快。算法对变化会更加敏感。事实上，与需要观察一段时间异常模式才能得出相同结论相比，通过使用概率，我们或许能够在篡改或虚假行为刚开始时就检测到不良变化。我们将首先从一项自\
  \ 1945 年发明以来就非常流行的检验开始。\n\n\n\n\n"
- "# 序贯概率比检验（`SPRT`）\n\n`SPRT` 由亚伯拉罕·瓦尔德（Abraham Wald）发明，并于 1945 年 6 月发表在他的论文《统计假设的序贯检验》中。他证明，在速度与精度的权衡（`SAT`）中，该检验是最优的，并且只要数据点是独立同分布的（一个常见的假设，缩写为\
  \ i.i.d.），它只需要很少的数据点就能检测到变化。\n\n与统计假设检验一样，`SPRT` 提出两个假设，并在这两个假设的背景下评估时间序列数据：\n\n\
  - `H[0]`：数据质量未受损，且可接受为真；\n- `H[1]`：数据为假，触发警报；\n\n`H[0]` 称为零假设——即现状或常态，而 `H[1]` 称为备择假设，表示发生了某种变化。\n\
  \n在序贯概率比检验中，对于每个数据点，我们计算对数似然比（`LLR`）。`LLR` 是似然比的对数。`LLR` 包含四个组成部分：\n\n1.  在 `H[1]`\
  \ 为真且数据已被操纵的情况下，从估值过程获得该数据点的似然性\n2.  在 `H[0]` 为真且数据未受损的情况下，从估值过程获得该数据点的似然性\n3. \
  \ 上述 (a) 和 (b) 两者的比率\n4.  (c) 中比率的对数\n\n用方程形式表示：\n\n`LLR = log(p(x_k | H[1]) / p(x_k\
  \ | H[0]))`，其中 `x_k` 是第 `k` 个时间点的数据值。\n\n(4.1)\n\n分子和分母中的似然性取决于基础数据的分布。例如，如果基础数据符合正态分布，则概率密度函数（`PDF`）由下式给出：\n\
  \n`p(x | μ, σ) = (1 / sqrt(2πσ)) * e^((- (x - μ)²) / (2σ²))`\n\n(4.2) 其中 `μ` 是分布的均值，`σ`\
  \ 是标准差，对于给定的总体可以很容易地推断出来。对于每个数据值，`LLR` 被累加到累积的对数似然比 `CLLR[i]` 中，如下方方程 (4-3) 所示：\n\
  \n`CLLR[i] = CLLR[i - 1] + LLR[i]`\n\n(4.3)\n\n我们现在明白了为什么该技术被称为 `SPRT`——这个过程是序贯（Sequential）的，并使用概率（Probability）比（Ratios）来检验（Test）变化。累积\
  \ `LLR`（`CLLR`）代表了到目前为止收集到的数据的状态。监控累积 `LLR` 可以帮助我们检测到变化。我们使用 `CLLR` 来决定以下三种结果之一：\n\
  \n1.  接受 `H[0]` 并停止监控数据，得出结论数据质量完好\n2.  接受 `H[1]` 并停止监控数据，得出结论发生了伪造\n3.  推迟决定并继续监控\n\
  \n上述每个决定在何时触发，取决于两种常见且直观的错误类型：\n\n1.  第一类错误：在 `H[0]` 为真时接受了 `H[1]`，导致误报\n2.  第二类错误：在\
  \ `H[1]` 为真时接受了 `H[0]`，导致漏报\n\n我们需要事先决定系统可以容忍的第一类和第二类错误的程度。令 `α` 表示预先确定的遭遇第一类错误的可接受概率，`β`\
  \ 表示遭遇第二类错误的可接受概率。可以证明，决策边界如下：\n\n`A = log(β / (1 - α))` 和 `B = log((1 - β) / α)`\n\
  \n(4.4)\n\n以下是基于上述边界的决策，如图 4-2 所示：\n\n![图 4-2: 使用 CLLR 的 SPRT 决策边界](img/A436227_1_En_4_Fig2_HTML.png)\n\
  \n1.  如果 `CLLR < A`，接受 `H[0]` 并停止\n2.  如果 `CLLR > B`，接受 `H[1]`，得出结论存在伪造并停止\n3. \
  \ 如果 `CLLR` 位于 \\( A \\) 和 \\( B \\) 这两个值之间，则推迟决定并继续监控\n\n**注意：** 序贯概率比检验正是一种对序贯计算出的似然累积比进行检验的方法。\n\
  \n正如我们所看到的，将概率引入解决方案会使其稍微复杂，因为监控现在取决于基础数据的分布，并且以更复杂的方式使用了数学。我们需要一种更简单的技术，将指数运算（如方程\
  \ (4.2) 中的形式）从算法中剥离出来。正如我们将在下一节中看到的，`CUSUM` 解决了这一复杂性，使算法变得更加简单。\n\n必须指出的是，`SPRT`\
  \ 旨在判断数据是由两个假设中的哪一个生成的，而从根本上来说并非用于检测变化。可以通过引入一个“阈值”对其进行修改以实现变化检测。当 `LLR` 超过这个预定阈值时，我们停止监控并得出结论检测到了变化。由此产生的技术被称为\
  \ `CUSUM`，将在下一节中讨论。\n\n\n\n## CUSUM 技术\n\n`CUSUM`是“Cumulative Sum”（累积和）的缩写。它是一种由\
  \ E. S. Page 于 1954 年提出的简单、巧妙且直观的技术。该技术常用于金融领域的股票投资组合监控和工程领域的过程控制，以检测被监控值的变化，从而聚焦于可能出现问题的产品。尽管其数学推导假设了底层数据具有一定的统计特性，但该技术在很大程度上对数据的统计和概率特性不敏感。它是已知的检测变化（哪怕是微小变化）最快的技术。与\
  \ `SPRT`（如方程(4.2)中那样计算涉及指数的移动平均）相比，其性能要好得多。\n\n虽然实现起来比 `SPRT` 简单得多，但 `CUSUM` 实际上是一种\
  \ `SPRT` 的形式。不像 `SPRT` 中有两个边界 A 和 B，我们只有一个停止点，即当代表状态超过某个阈值时停止。这里的代表状态是每个数据点处的累积残差。残差可以简单地理解为数据值与目标值之间的差值。直观地看，目标值就是到目前为止数据值的均值。因此，该算法是简单的算术运算，无需处理概率密度函数(`PDF`)和指数移动平均。\n\
  \n`CUSUM` 既简单又复杂。我们刚刚看到 `CUSUM` 的应用是简单的算术。我们将采取一种中间路线，提供足够多的细节来理解简洁背后的数学原理。让我们从给出\
  \ `CUSUM` 算法中代表状态 `r[k]` 的方程开始：\n\n```\nr_k = max(r_{k-1} + log(p(x_k | H_1) / p(x_k\
  \ | H_0)), 0)\n```\n\n```\n其中：\n    x_k 是第 k 个时间点的数据值\n    r_k 是第 k 个时间点的代表状态\n\
  ```\n\n上述方程中的对数比率可以立即被识别为我们在 `SPRT` 中使用的`对数似然比`(`LLR`)。这里使用的假设也与之前相同。`CUSUM` 的改进在于我们正在累积`对数似然比`(`LLR`)，并为累积值设置了一个下界。当数据分布是高斯分布或正态分布时（这是常见情况），我们可以将以下概率密度函数(`PDF`)代入方程：\n\
  \n```\np(x_k | H_1) = 1 / (sqrt(2 * pi * sigma)) * e^(-(x_k - mu_1)² / (2 * sigma²))\n\
  p(x_k | H_0) = 1 / (sqrt(2 * pi * sigma)) * e^(-(x_k - mu_0)² / (2 * sigma²))\n\
  ```\n\n均值 `mu_0` 和 `mu_1` 分别对应于两个假设。代表状态 `r[k]` 的方程现在简化为：\n\n```\nr_k = max(r_{k-1}\
  \ + (x_k - mu_0 - (mu_1 - mu_0) / 2), 0)\n```\n\n并进一步简化为：\n\n```\nr_k = max(r_{k-1}\
  \ + (x_k - mu_0 - rho / 2), 0)\n```\n\n其中 `rho` 是一个决定 `CUSUM` 算法灵敏度的常数。`rho` 的值越小，算法对变化越敏感。上述方程就是我们之前描述的简单算术。我们本质上是在监控数据值不断变化的均值，并累积新数据值相对于该均值的差值或残差。我们现在需要知道何时停止监控数据流并判定数据已被破坏。为此，我们引入一个阈值\
  \ `tau`。当代表状态 `r[k]` 超过阈值 `tau` 时，我们就停止监控。此时 `rho` 的值被称为停止时间。还必须指出，尽管我们通过代入高斯概率密度函数(`PDF`)推导出了简化方程，但已有证明表明，即使数据分布不是高斯分布，该简化方程也适用良好。\n\
  \n> 注：世界上所有的复杂性都是为了简化生活。`CUSUM` 的推导就是一个例子。\n\n通常，我们并不希望在检测到虚假情况后立即停止。我们希望继续监控并检测所有欺诈发生的情况。我们不希望仅确定停止时间，而是希望检测数据被破坏的所有时间区间。`CUSUM`\
  \ 可以很容易地扩展到实现这一目标。之前的“停止时间”现在变成了可疑区间的“开始时间”。该区间的结束时间是代表状态达到峰值的时间点。回到一个人陷入抑郁的类比，当一个人的精神状态开始恶化或超过某个阈值时，我们判定抑郁症发作。我们判定一个人即将走出抑郁，是在其精神状态最糟糕并开始好转之后不久。同样的原理也适用于用于检测所有可疑区间的扩展\
  \ `CUSUM` 算法。\n\n![A436227_1_En_4_Fig3_HTML.jpg](img/A436227_1_En_4_Fig3_HTML.jpg)\n\
  \n**图 4-3**：用于检测可疑区间的扩展 `CUSUM`；上图中的点代表数据值\n\n图 4-3 是对刚刚讨论过程的说明。本例中的数据值在 -5 到 +5\
  \ 之间变化。上图将数值绘制为离散点。这里大约有两千个数据值。x 轴代表时间，显示了两千个时间索引，代表了数据收集的顺序。从上图的前半部分可以看出，即使有可能，仅通过观察数据值也很难判断数据是否被破坏。当我们在下方的图表中绘制\
  \ `CUSUM` 代表状态 `r[k]`（以较浅的绿色阴影显示）时，可疑区间几乎变得显而易见，如图所示。在整个可疑区间内，曲线都在上升。\n\n区间从 `CUSUM`\
  \ 超过阈值时开始，在 `CUSUM` 值达到峰值并开始下降后不久结束。阈值被设定为接近于零，因此也接近于数据值，这使得它在以稍深色（蓝色）阴影绘制并与数据值的折线图混合在一起时不太明显。`CUSUM`\
  \ 算法累积每个数据值相对于预期平均值的残差，从图中可以看出，对于数值上不超过 5 的数值，其累积和可以一直上升到接近 500。上图中的点模式存在差异，但除非像下图那样绘制出\
  \ `CUSUM` 代表状态，否则我们无法真正确定。右侧的不少点也形成了某种类似的模式，但下图显示它们实际上并不可疑。\n\n> 注：除非通过统计过程方法进行评估，否则数据可能具有欺骗性。\n\
  \n![A436227_1_En_4_Fig4_HTML.jpg](img/A436227_1_En_4_Fig4_HTML.jpg)\n\n**图 4-4**：当虚假值间歇性出现时的扩展\
  \ `CUSUM`。彩色图显示在源代码文件和电子书中。\n\n\n\n在图 4-3 中，所有异常数据一次性出现在一个较大的时间间隔内。然而，也存在可疑值偶尔出现的情况。图\
  \ 4-4 展示了当虚假数据值间歇性出现时，用较浅色（绿色）绘制的 CUSUM 状态。在这种情况下，可疑间隔内仅包含一个虚假值，但同样的逻辑仍然适用。CUSUM\
  \ 技术在这种情况下效果不佳，因为残差的累积会受到间隔中真实值的影响。图 4-3 中的最大累积残差接近 500，而在图 4-4 中仅为 5。CUSUM 算法在这种情况下显然不太敏感。\n\
  \n这正是卡尔曼滤波更具优势之处。它基于先前状态递归地估计下一个值，因此虚假值之前的真实值越多，对下一个值的估计就越准确。先前状态中真实值所占比重越大，估计效果就越好。下一节将讨论这项广泛应用于众多实际场景的重要技术。\n\
  \n### 卡尔曼滤波\n\nM. S. Grewal 等人是这一领域最热门书籍的作者之一，他们将卡尔曼滤波称为“20 世纪最伟大的发现”。这是一种线性状态空间方法，应用范围从预测天体的不可控轨迹到控制制造过程和航空领域。简而言之，给定一系列数据点，卡尔曼滤波会计算出下一个数据点的最佳猜测值。当信号被高斯白噪声干扰时，它本质上是对线性动态系统下一状态的估计。如前所述，高斯假设在许多随机过程中相当常见，并且在大多数情况下至少近似成立。由于它能预测信号，卡尔曼滤波自然被视作滤除噪声的方法。噪声是卡尔曼滤波检测到的变化，因此从这个意义上说，我们将其用作一种变化检测技术。可以理解的是，它在电气工程、电信工程和信号处理领域得到了广泛应用。\n\
  \n正如本章开篇所述，谎言本质上是在一个主要依赖诚实生存的文明中的噪声。大数据中的虚假信息可以被视为统计噪声，并且可以通过与信号处理系统中滤除噪声相同的方式来检测。这正是卡尔曼滤波的用武之地。通过一个直观的例子，比如股票价格，可以理解这一强大技术背后的复杂数学原理。假设我们今天预期某只股票的价格为`![$$\
  \ {\\widehat{x}}_k $$](img/A436227_1_En_4_Chapter_IEq1.gif)`，但实际观察到的价格是`z[k]`。给定这两个值，对明天价格的最佳估计是这两个值的平均值：\n\
  \n```\n![$$ {\\widehat{x}}_{k+1}=0.5{z}_k+\\kern0.5em 0.5{\\widehat{x}}_k $$](img/A436227_1_En_4_Chapter_Equf.gif)\n\
  ```\n\n但股市中的传言和影响使情况并非如此理想，我们可能需要给予它们比自身预期更高的权重。让我们将这一权重称为`w[k]`。那么上述方程变为：\n\n```\n\
  ![$$ {\\widehat{x}}_{k+1}={w}_k\\cdot {z}_k+\\left(1-{w}_k\\right)\\cdot {\\widehat{x}}_k\
  \ $$](img/A436227_1_En_4_Chapter_Equg.gif)\n```\n\n这本质上就是线性情况下卡尔曼滤波的状态方程。方程右侧包含一个观测分量和一个预期分量。我们计算出一个预期值的猜测，然后根据现实世界的观测或测量进行更新。比例项或权重`w[k]`在卡尔曼滤波术语中被称为“卡尔曼增益，`K[k]`”，以纪念其发明者——麻省理工学院毕业生鲁道夫·卡尔曼。权重`w[k]`代表了噪声——即股市中的传言和其他影响。\n\
  \n可以理解的是，权重`w[k]`或卡尔曼增益`K[k]`不能仅凭直觉估计，还需要一些数学上的严谨性。它是通过另一组前向递归方程进行估计的，这些方程涉及另一个状态方差变量`P[k]`以及两个噪声方差常数`Q`和`R`。方差是一种常用的统计指标，用于表示变量偏离其平均值的程度。`Q`是估计值的噪声方差，`R`是观测值的噪声方差。实际上，`Q`和`R`可能随状态或观测值变化，但为简化起见，在大多数情况下假设它们是常数。如前所述，`z[k]`是观测值。综合以上讨论，在时间序列数据值的线性情况下，卡尔曼滤波的方程组如下所示。\n\
  \n```\n![$$ {{\\widehat{x}}^{-}}_k={\\widehat{x}}_{k-1} $$](img/A436227_1_En_4_Chapter_Equh.gif)\n\
  ```\n\n```\n![$$ {P^{-}}_k={P}_{k-1}+Q $$](img/A436227_1_En_4_Chapter_Equi.gif)\n\
  ```\n\n```\n![$$ {K}_k=\\frac{{P^{-}}_k}{{P^{-}}_k+R} $$](img/A436227_1_En_4_Chapter_Equj.gif)\n\
  ```\n\n```\n![$$ {\\widehat{x}}_k={K}_k\\cdot {z}_k+\\left(1-{K}_k\\right)\\cdot\
  \ {{\\widehat{x}}^{-}}_k $$](img/A436227_1_En_4_Chapter_Equk.gif)\n```\n\n\n\n![$$\
  \ {P}_k=\\left(1-{K}_k\\right)\\cdot \\kern0.5em {P^{-}}_k $$](img/A436227_1_En_4_Chapter_Equl.gif)\n\
  \n在通用形式中，上述方程中的项均为矩阵，`P[k]`、`Q` 和 `R` 是协方差矩阵。但为简化并应用于单一维度的数据值时间序列，我们可以将它们视为标量和方差。尽管它们的取值取决于具体领域，但为简化起见，初始估计均值\
  \ `x̂₀` 的初始值设为零，先验状态方差 `P[0]` 可设为一或凭直觉确定。随后，上述方程中的其他变量可递归计算。假设常数 `Q` 和 `R` 的最优值，可通过将算法应用于机器学习术语中所称的“训练数据”来获得。在训练数据或真实数据中，我们已知哪些值是真值、哪些是假值。因此，我们利用这一已知数据样本校准常数，以实现高准确率。\n\
  \n![A436227_1_En_4_Fig5_HTML.jpg](img/A436227_1_En_4_Fig5_HTML.jpg)\n\n**图 4-5**\
  \  \n卡尔曼滤波器解释为反馈控制系统\n\n卡尔曼滤波器是最优的，因为可以证明它能使估计值的均方误差最小化。均方误差（MSE）是用于确定预测或估计算法准确性的常用指标。必须指出，卡尔曼滤波方程有多种形式，它们在代数上均可证明彼此等价。这些方程本质上实现了一个反馈控制系统。通过观测值将先前估计的反馈纳入下一次估计。从这个意义上说，前两个方程可归类为“时间更新”方程，后三个为“测量更新”方程。后者用于纳入反馈，前者用于将当前表征状态投影到未来。因此，时间更新方程也可称为预测方程，而后者称为校正方程。图\
  \ 4-5 阐释了这些概念。\n\n这些方程均具有直观解释，并基于概率论。例如，当观测值不准确性的方差 `R` 趋近于零时，卡尔曼增益 `K[k]` 趋近于一，表明观测值\
  \ `z[k]` 可被越来越多地信任。在这种情况下，也意味着估计分量的权重越来越小。当初始状态方差 `P⁻ₖ` 趋近于零时，卡尔曼增益 `K[k]` 也趋近于零，表明对估计值的依赖多于对观测值的依赖。卡尔曼滤波器的概率或贝叶斯解释是：给定观测值后，递归方程本质上传播了数据流中信号的条件概率分布。\n\
  \n还必须注意，`Q` 和 `R` 会随时间收敛到稳态值。这些稳态值可事先利用训练数据获得。`R` 基于测量值，因此比 `Q` 更容易获得，因为 `Q` 基于估计过程。卡尔曼滤波过程的准确性取决于噪声方差\
  \ `Q` 和 `R` 的估计准确度。\n\n> **注意**  \n> 卡尔曼滤波器利用一组数学方程，结合截至当前时刻的所有可用信息，递归计算下一个数据值的最佳估计值。之前的估计值和观测值都会被纳入新估计值的权重。\n\
  \n图 4-6 展示了卡尔曼滤波器如何帮助将虚假值与真值分离。这些数据来自注入负面情绪后的微博情感得分。使用前述方程递归计算出的估计值以蓝色线条显示。如图所示，它大致呈直线并接近于零值。由于我们不能总是期望真实数据值与估计值完全匹配，因此我们允许一个容差范围，即一个固定偏移量，在图中以蓝色线条下方的红色线条显示。所有低于红色容差线的数据值都被卡尔曼滤波算法判定为虚假值。由于数据来自注入负面情绪后的微博情感得分，我们只考虑容差线以下的数据。在其他情况下，我们可以设置上下两条线来界定容差区间。区间外的数据值被视为虚假值。在此情感得分案例中，虚假值用红色“+”标记，真值用深绿色“*”显示在上方。容差范围（即距预期值的固定偏移量）再次通过将算法应用于训练数据进行校准，以最大化准确性。\n\
  \n![A436227_1_En_4_Fig6_HTML.jpg](img/A436227_1_En_4_Fig6_HTML.jpg)\n\n**图 4-6**\
  \  \n卡尔曼滤波器应用于与图 4-4 相同的数据\n\n卡尔曼滤波器正确工作的一个前提是信号应远强于噪声，这通常是成立的。在图 4-6 的示例中，深绿色星号的数量大约是红色叉号的四倍。大多数值为正值且真实，因此低于某一容差范围的负值被判定为虚假值，这在当前情况下基本正确。\n\
  \n## 总结\n\n不真实性是对常态的一种偏离。在大数据原本真实的价值评估中，它可以被视为噪声。因此，我们可以应用变化检测技术来确立大数据的真实性。在本章中，我们研究了三种有趣且重要的变化检测技术。SPRT\
  \ 展示了似然比的简单应用如何在检测中发挥作用。CUSUM 进一步推进并简化了这一思想，利用累积残差的简单算术来识别数据流中发生前所未有变化的虚假区间。关于卡尔曼滤波器的讨论展示了如何将与预测相反的噪声或虚假信息从信号或正常数据中滤除。我们了解到训练数据有助于校准算法或模型的重要参数。在下一章中，我们将扩展利用训练数据学习模型本身的思想。在此过程中，我们将研究多种机器学习算法，并将其应用于真实性领域。\n\
  \n## 练习\n\n1.  现实世界中有哪些检测变化的方式？其中哪些可以应用于大数据真实性问题？还能想到其他有助于解决该问题的现实世界过程吗？\n2.  研究卡尔曼滤波器在各种应用中的使用方式。你是否相信卡尔曼滤波器是“二十世纪最伟大的发现”？\n\
  3.  根据本章给出的卡尔曼滤波方程，从向量形式的状态空间表示中推导出这些方程（该状态空间表示可见于任何相关主题的书籍）。\n\n\n"
- '# 5. 机器学习算法


  微博示例 收集真实数据 逻辑回归 朴素贝叶斯分类器 支持向量机 人工神经网络 K 均值聚类 总结


  在上一章中，我们学习了如何在更精细的数据粒度层面运用技术，处理单个数据值。在本章中，我们将从更宏观的层面批量处理数据，以提取特征、模式及其相对权重。有趣的是，机器学习是一把双刃剑，它既能用于创建虚假内容，也能用于检测虚假内容。谷歌的“DeepDream”项目便是一个很好的例子。该项目最初旨在构建图像识别软件，但如今，该软件更多因能生成宛如机器幻觉般的虚构图像而闻名。在本章中，我们将重点介绍有助于检测欺诈和虚假信息的机器学习算法。


  机器学习的灵感源于人类学习的概念。例如，一个孩子是如何学会识别猫的呢？她的父母或其他长辈会向她展示大量狗、猫和其他宠物的样本，并反复向孩子指出每种宠物。换句话说，父母为孩子提供了大量带有标签的数据用于训练，这些数据也被称为训练数据。孩子开始识别这些宠物的诸多特征——脸型、皮肤纹理、躯干长度、耳朵大小、眼睛颜色等。孩子识别的特征越多，看到的带标签样本越多，她识别猫的本领就学得越好。


  这种确定特征、特征相对重要性并据此得出结论的学习过程，并不仅限于识别猫和狗。几乎任何事情，包括区分真话与谎言，都是通过类似方法从经验中习得的。长辈们常有“逗弄”孩子的习惯。很快，随着经验积累，孩子们就能学会辨别长辈何时在“开玩笑”，何时在说真话。尽管问题在于判断真伪，但确定性的方法并不适用于此目的。“真相”并没有被确定性地定义出来，从而向孩子提供一套规则来描述猫，或判断长辈是否在开玩笑。用软件术语来说，这个过程是难以处理的，或者说属于
  NP 难问题。相反，孩子是通过大量样本来进行经验性学习的。让我们更详细地审视这一过程。


  > **注意**

  >

  > 精确定义什么是“真相”是棘手的。真相如同信仰，最好通过经验来领悟，而非通过确定性定义来理解。


  当孩子看到一只新的四足动物，而附近又没有长辈可以指认时，她关于宠物的学习成果就要接受新数据的检验。这将以多种方式之一启动其思维过程。其中一种方法是频率学派（Frequentist）方法——孩子看到圆脸、绿眼睛、小耳朵、短躯干等的猫的频率越高，她就越可能得出结论：这只新的圆脸、绿眼睛、小耳朵、短躯干的动物也是一只猫。这种方法被形式化为朴素贝叶斯方法，这是频率学派方法的一个例子。


  我们也可以构建一棵决策树——这只动物是圆脸吗？如果是，眼睛是绿色的吗？耳朵小吗？等等。我们提出这些问题的“智能”程度越高，得出结论的速度就越快。在这种情况下，“智能”的目标是选择那些能使两个类别之间分离度最大的问题。例如，如果我们在检查脸型之前，先询问关于躯干长度的问题，那么我们构建的决策树必定是次优的，因为有些狗的躯干可能和猫一样短。因此，关于躯干长度的问题对类别的区分能力不如脸型问题。后者的问题应优先于前者。


  > **注意**

  >

  > 像机器学习算法这样的经验方法倾向于融入智能，以快速得出最佳答案，而非通过蛮力穷尽所有可能性。


  一种常用的探寻真相的方法是“剥洋葱法”——逐层深入。我们从手头已有的信息输入开始，逐层进行质询。问题越复杂，需要提问的层次就越多。所有这些问题答案都需要联系起来，才能得出结论。在大脑中，这种通过神经元层收集并连接答案的过程，可以在机器上使用神经网络进行模拟。神经网络接收输入，通过一系列层级，计算出分类结果为真或假。


  本章中我们考虑的所有学习过程或算法的最终目标，都是划分或分类解空间。划分得越好、越清晰，算法就越有效。虽然拥有带标签的样本供学习是好事，但时常也会遇到没有此类数据的情况。在这种情况下，学习过程是在无监督下进行的——没有长辈通过展示样本并为其打标签来监督学习过程。例如，孩子从装有许多不同玩具的玩具箱里挑出所有芭比娃娃，就是一个例子。她学会了将最喜欢的芭比娃娃聚类在一起，而无需任何人告诉她该怎么做。


  > **注意**

  >

  > 学习可以在有监督或无监督的方式下进行。就真实性判断而言，这两种方式的最终目标都是将问题空间划分为两类——真实的和不真实的。


  聚类同样基于特征。面对并非完全真实的数据和信息，无监督学习方法会根据数据或信息的特征，将其分组到真实和虚假两个类别中。在本章中，我们将研究有监督学习方法（如神经网络）和无监督学习方法（如`k-means`），以解决数据真实性判断问题。但首先，让我们考虑一个合适的例子来说明这些概念。



  ## 微博客示例


  诸如 Twitter 之类的微博客网站已发展成为能够产生重大影响的强大媒体。在第二章中，我们看到了 Twitter 如何被用来抬高股价然后抛售以获取非法利润，并且其上发布的谎言导致公司市值损失高达
  28%。在第四章中，我们看到了安德烈斯·塞普尔维达如何利用 Twitter 甚至改变了总统选举的结果。还有许多类似的例子，其中微博客网站上的欺诈行为造成了重大损害。因此，我们以
  Twitter 为例，来说明如何使用机器学习来检测虚假推文。


  问题如图 5-1 所示。给定大量推文，我们需要提出一个分类器，它表现为一条曲线，将图中星号所示的真实推文与圆圈所示的虚假推文分隔开。可以看出，我们仍然使用数学来表达问题，使其易于处理。该图是一个笛卡尔平面，推文被表示为点。乍一看，该图提出了三个问题：


  1.  我们如何将推文绘制在图中所示的空间中？

  2.  在这样的空间中，坐标轴应该代表什么？

  3.  我们如何提出分类器？


  ![A436227_1_En_5_Fig1_HTML.jpg](img/A436227_1_En_5_Fig1_HTML.jpg)


  **图 5-1** 示例问题说明：区分真实推文与虚假推文


  在第三章和第四章中，我们学习了量化、特征提取以及使用数学抽象的概念。在回答上述问题时，这些概念会派上用场。


  微博，例如推文，具有特征。其中一些特征可能如下：


  *   转发、回复、点赞的数量

  *   推文中话题标签的数量

  *   使用的话题标签被列为（全球）热门趋势

  *   是否存在 URL 及其页面排名，以及诸如 NIMH、WHO、NCI 等可信实体

  *   是否存在对其他用户的引用

  *   推文语气的正式程度（不使用‘d’、‘n’等缩写）

  *   使用肯定、确定、绝对的词语，而非“可能”

  *   多媒体内容（照片、视频、音频）

  *   是否存在数字、引号

  *   该推文是否被置顶


  这些特征表明了推文的真实性。例如，如果一条推文有很多点赞和回复，那么它更可能是真实的。一条引用了其他用户的推文不太可能撒谎，因为被引用用户的声誉也会受到影响。同样，有图片和音频佐证的推文更有可能是真实的。每个这样的特征都可以在坐标轴上表示，并且每个推文对应的特征值可以绘制出来，从而为我们提供一个包含所有推文的多维空间。对于熟悉向量代数的人来说，可以将这个多维空间想象成一个向量空间，而点就是向量。图
  5-1 是这个多维空间的二维投影，而分类器实际上是该多维空间中的一个超曲面。由于当空间维度超过三维时很难可视化超曲面，因此像图 5-1 所示的正交投影非常有帮助。


  超曲面将多维空间一分为二。在一个 n 维空间中，超曲面具有 (n-1) 维。例如，在图 5-1 所示的二维空间中，超曲面是一个一维表面，即一条线（可以是曲线或直线）。如果空间是三维的，那么超曲面就是一个二维平面或曲面。超曲面的方程是线性的。对于二维情况，我们知道一条直线的方程形式为


  ![$$ y= mx+c $$](img/A436227_1_En_5_Chapter_Equa.gif)


  更一般地表达，我们可以将方程写为


  ![$$ {\theta}_0+{\theta}_1{x}_1+{\theta}_2{x}_2=0 $$](img/A436227_1_En_5_Chapter_Equb.gif)


  ![$$ 其中\kern0.5em y\kern0.5em 是\kern0.5em {x}_2,\kern0.5em x\kern0.5em 是\kern0.5em
  {x}_1,\kern0.5em m\kern0.5em 是-\frac{\theta_1}{\theta_2}\kern0.5em 而\kern0.5em c\kern0.5em
  是-\frac{\theta_0}{\theta_2} $$](img/A436227_1_En_5_Chapter_Equc.gif)


  将上述方程扩展到 n 维空间，超曲面的方程可以写为


  ![$$ {\displaystyle \begin{array}{l}{\theta}_0+{\theta}_1{x}_1+{\theta}_2{x}_2+\dots
  +{\theta}_n{x}_n=0\\ {}\mathrm{或}\kern0.5em \mathrm{简写为},\kern0.5em \Sigma {\theta}_i{x}_i=0\end{array}}
  $$](img/A436227_1_En_5_Chapter_Equ1.gif)


  (5.0)


  我们稍后将不断地遇到不同形式的(5.0)。上述方程将多维空间分割成两个空间，如下面方程所示。


  ![$$ {\displaystyle \begin{array}{l}\Sigma {\theta}_i{x}_i>0\dots \dots \dots \dots
  \dots \dots \dots \dots \dots \dots \dots \dots \dots \dots .\left( 超曲面的一侧\right)\\
  {}\Sigma {\theta}_i{x}_i<0\dots \dots \dots \dots \dots \dots \dots \dots \dots
  \dots \dots \dots \dots \dots .\left( 超曲面的另一侧\right)\end{array}} $$](img/A436227_1_En_5_Chapter_Equd.gif)


  给定一条新推文的特征 `X = {x1, ..., xi, ..., xn}`，并且从训练集计算出参数 `Θ = {θ0, θ1, θ2, ..., θi, ...,
  θn}`（具体方法我们稍后会看到），基于上述不等式，我们可以轻松确定一个新的数据点将落在哪一侧。我们从训练数据集中确定权重或参数，并将它们用于测试数据集，以对新的数据点进行分类，就像孩子识别猫一样。当然，算法应确保学习不会过度依赖训练数据集——这种情况称为过拟合。我们不希望孩子只认识与她之前见过的某些非常相似的猫的子集。我们希望她学会从总体上识别猫。


  > **注意** 机器学习算法可以看作是将数据视为多维空间中的一组点，每个维度代表数据的一个特征。


  下面列出了与用户相关的其他一些有助于确定推文真实性的特征。


  *   粉丝数、用户被列入的列表数、一段时间内的推文数量、个人资料和推文中的照片和视频

  *   社会地位：用户是名人吗？

  *   用户名中是否存在“dr”、“prof”、“governor”、“mayor”等头衔，以及是否为认证账户

  *   用户个人资料的可信特征：真实姓名、照片、职业、教育背景、所属机构、注册日期、电子邮件地址中的域名（如`stanford.edu`）等

  *   其个人资料中 URL 的 PageRank

  *   用户被列入的列表类别数量

  *   被转发、收藏、回复的帖子数量

  *   其他用户推文中对该用户的引用次数（推文中的`@用户`）

  *   该用户推文中`@用户`引用的数量；这些用户的质量

  *   一段时间内其帖子中 URL 的数量（知识传播者）

  *   以其粉丝的粉丝等加权的粉丝数量——一种 PageRank


  > **注意** 用户的可信度越高，其推文越有可能是真实的。




  '
- "# 这些特征的含义不言自明，很容易就能看出它们代表了推文的真实性。借助这些特征，我们现在有了一个多维空间，推文在其中被绘制成点。本章大部分内容致力于推导出分类器，即那条（实际上是超平面）将真实推文与虚假推文分隔开的界线。但在此之前，让我们先简要了解一下机器学习算法的一个重要方面——收集训练数据集。\n\
  \n### 收集真实数据\n\n孩子看到的样本越多，他就能越了解真相。因此，用于训练的标注数据集越多，我们就越能学习如何判断真相。训练集在学习过程中充当了真实数据的角色。如果是\
  \ Twitter 数据集，训练集的大小通常包含数千条推文。Twitter 等微博网站提供了流式 API，通过它帖子、事件和其他数据会被自动推送，从而避免了客户端昂贵的轮询操作。人们也可以使用\
  \ REST API 从这些网站收集静态数据。一些论文的作者也会提供一些静态数据集，他们可能在自己的已发表项目中使用过这些数据。\n\n收集完训练数据集后，下一步是对数据进行分类或标注。如果不进行标注，除非我们使用无监督或半监督学习算法，否则数据集将无法用于训练。标注数据需要有人逐一检查每个样本，并在仔细检查后应用标签。这通常通过众包完成——即利用互联网让大量人员完成任务的过程。假设有\
  \ 30 万个样本，我们或许可以众包给 3000 人，每人处理 100 个样本。其金钱成本取决于任务本身以及接受任务的人员。\n\n在我们的微博示例中，如果我们只考虑与健康相关的推文（这些推文若不完全真实，会造成严重的负面影响），这个过程可能会昂贵得令人望而却步。将健康相关推文标注为真实或虚假需要大量的医学专业知识，而我们知道这类专业知识既稀缺又昂贵。即使假设美国的护士等医疗专业人员每小时薪酬约为\
  \ `$50`，并且每小时能标注 30 条推文，那么 30 万个样本将需要 1 万小时，以及高达 50 万美元的惊人费用！\n\n**注意**\n\n收集训练数据可能是一项成本极其高昂的工作。\n\
  \n上面的例子清楚地表明，迫切需要自动化真实数据的收集过程。一种方法是收集我们确信为真实的推文，以及另一组我们确信为虚假的推文。对于后者而言，举例来说，许多人会基于某些已确立的谣言发推。一个这样的谣言是“微波炉加热会杀死营养成分”。令人惊讶的是，大量实时推文都基于这个已被证实为假的谣言。我们可以找到诸如“我打赌你们都不知道，用微波炉加热食物会减少营养”、“烤箱和炉子效果也一样。炉子的热量和烤箱的干热也会杀死营养，但不如微波炉严重”或者“快节奏的生活压力和‘方便’食品。用微波炉烹饪会杀死所有营养”之类的推文，它们还获得了点赞、转发和回复。\n\
  \n**注意**\n\n谣言和被误解的真相仍然是公共话语中虚假信息的主要来源。\n\n可以通过搜索这类基于谣言的帖子来收集虚假推文。只需搜索流行谣言中的短语，例如“微波炉营养”，即可完成此操作。这为我们提供了数据集的一个类别。对于真实推文，我们同样搜索那些已知肯定为真实的模式。例如，引用知名医学期刊并带有引号的推文通常是真实的。同样，辟谣的推文也已知肯定是真实的。作者在\
  \ Twitter 上找到的此类推文包括：“经常用微波炉加热蔬菜？这样做，你可能在保留重要营养”和“关于土豆的冷知识：保留烤土豆营养的最佳方法是用微波炉加热。有真正的科学依据\
  \ [#EatWellForLess](https://twitter.com/hashtag/EatWellForLess?src=hash)。”收集完所有此类自动标注的推文后，我们可能需要人工检查其中一部分，以剔除任何误报。\n\
  \n因此，通过一些创造性思考，我们可以在相当多的情况下实现真实数据收集的自动化。必须指出的是，推文仅作为讨论算法的示例。这些技术同样适用于其他形式的数据——只是特征不同，且取决于数据领域。现在我们有了训练集，就可以进入下一步——寻找分类器。有许多机器学习算法及其变体可以完成这项任务。我们只讨论其中的一部分，以了解其基本内容。\n\
  \n**注意**\n\n创造性思考是自动化的核心，包括真实数据的收集。\n\n\n\n## 逻辑回归\n\n我们在第 3 章曾简要提及逻辑回归，现在让我们从该算法入手，深入探讨更多细节。在我们的推特示例中，推文具有许多特征，这些特征可以作为自变量在多维空间的坐标轴上表示。我们将这个特征向量称为\
  \ `X`。\n\n```\nX = (x_0, x_1, x_2, ..., x_n)\n```\n\n(5.1)\n\n我们知道，并非所有这些特征都同等重要。例如，我们发现基于谣言的推文也能获得点赞、回复和转发。在判断推文真实性时，点赞数、回复数和转发数显然重要性不高\
  \ —— 与推文是否被置顶等特征相比，其权重更低。用户通常不会置顶一条已知为假的推文。显然，需要对这些特征进行加权，以得出推文真实性的评分。我们按如下方式计算评分\
  \ `s`：\n\n```\ns = Σ_{i=0}^n w_i x_i\n```\n\n(5.2)\n\n其中 `w_i` 是分配给第 `i` 个特征 `x_i`\
  \ 的权重。\n\n可以看出，(5.2) 与 (5.0) 相似。实际上，两者完全相同，权重正是需要估计的参数。\n\n但我们真正需要的是推文为真的估计概率，而上述评分\
  \ `s` 并不保证介于 0 和 1 之间，而概率值必须在此区间。我们使用一种称为逻辑函数的特殊函数，将此评分转换为概率。我们将为解决方案采用的参数统计模型称为“逻辑回归”。逻辑函数的定义如下：\n\
  \n```\nlogistic(z) = e^z / (1 + e^z)\n```\n\n(5.3)\n\n该函数如图 5-2 所示。可以看出，其值范围从 0\
  \ 到 1。更具体地说，从图 5-2 中可以看出：\n\n```\nlogistic(-∞) = 0\nlogistic(0) = 0.5\nlogistic(∞)\
  \ = 1\nlogistic(-z) = 1 - logistic(z)\n```\n\n![A436227_1_En_5_Fig3_HTML.jpg](img/A436227_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3 – 阶跃函数\n\n![A436227_1_En_5_Fig2_HTML.jpg](img/A436227_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2 – 逻辑函数图像\n\n从图 5-2 中还可以观察到，逻辑函数的图像呈字母 S 形。图像呈 S 形的函数类别通常称为 S 形函数。\n\n图 5-3\
  \ 展示了一个阶跃函数。逻辑函数图像在形状上与阶跃函数非常相似，但具有几个显著且有用的特征：它平滑、连续且单调。许多现实世界中的现象都符合此模型，其值连续变化，而非像阶跃函数那样离散变化。逻辑函数还与优势比有关。如我们所知，“优势”一词指的是事件发生的可能性。如果\
  \ `p` 是事件发生的概率，则优势由 `p / (1 - p)` 给出。逻辑函数的反函数，称为 Logit 函数，本质上就是这些优势的对数。\n\n**注：**\
  \ 逻辑函数与概率密切相关，在概率论、统计学和机器学习中应用极为广泛。\n\n```\nlogit(p) = log(p / (1 - p))\n```\n\n\
  (5.4)\n\n```\nlogit^{-1}(p) = logistic(p) = e^p / (1 + e^p)\n```\n\n(5.5)\n\n可以看出，逻辑函数在多个方面都非常适合我们的目的。因此，我们使用此函数，通过取评分的逻辑函数值，将真实性评分表示为概率，如下所示：\n\
  \n```\nP(推文 = 真 | X) = e^{Σ_{i=0}^n w_i x_i} / (1 + e^{Σ_{i=0}^n w_i x_i})\n```\n\
  \n(5.6)\n\n其中 `X` 是特征 `x_i` 的集合。\n\n我们刚刚将评分表达式 (5.2) 代入逻辑函数 (5.3) 中的 `z` 位置。现在，机器学习问题简化为：根据训练数据中推文的特征\
  \ `x[i]` 及其各自的概率（1 或 0），找到权重 `w[i]`。一旦我们从训练数据中获知权重，就可以使用相同的权重，通过 (5.6) 为任何新推文确定\
  \ `P(推文 = 真 | X)`。此操作如图 5-4 所示。\n\n![A436227_1_En_5_Fig4_HTML.jpg](img/A436227_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4 – 公式 (5.6) 的图解，展示了特征、权重、乘积之和，最后代入 S 形函数的过程\n\n一个值得注意的观察点是对 (5.6) 进行如下重排得到\
  \ (5.7)，这重申了逻辑函数的反函数是对数优势比这一事实。\n\n```\n由 (5.6) 得：\nP(推文 = 真 | X) * (1 + e^{Σ_{i=0}^n\
  \ w_i x_i}) = e^{Σ_{i=0}^n w_i x_i}\n因此：\nP(推文 = 真 | X) = e^{Σ_{i=0}^n w_i x_i}\
  \ (1 - P(推文 = 真 | X))\n并且：\nP(推文 = 真 | X) / (1 - P(推文 = 真 | X)) = e^{Σ_{i=0}^n w_i\
  \ x_i}\n```\n\n(5.7)\n\n我们很容易认出 (5.7) 的左边就是优势比。\n\n寻找权重的问题，也称为参数估计，可以通过使用所谓的极大似然估计（MLE）来解决，其目标是最大化关于权重的似然函数。MLE\
  \ 是统计学中用于估计参数的基本概念。从数学上讲，我们找到权重 `w[i]`，使得以下表达式给出的所有概率的乘积最大。\n\n```\nΠ P(推文的真实性，给定其特征及其相应权重)\
  \ = Π P(Y | X, W)\n```\n\n更明确地说，`Π` 表示对后续 `P` 项进行连乘，`P` 表示推文真实性的概率；`Y` 表示推文的标记值（真或假）；“|”\
  \ 表示“给定”；`X` 是该推文的特征集合；`W` 是需要确定的权重集合。\n\n出于最大化目的，即使我们对上述表达式取对数（称为对数似然），结果也更容易且等效。通过最大化对数似然，我们得到相同的结果。能够最大化\
  \ (5.7) 中表达式对数的相同权重，也同样能最大化函数本身。取对数（log）很有用，因为对数函数将上述乘积转换为求和，注意到：\n\n```\nlog(ab)\
  \ = log(a) + log(b)\n```\n\n由于 `Y` 只能取两个值（1 或 0），这进一步简化了最大化问题的求解。可以使用优化技术来确定使 (5.7)\
  \ 最大化的权重。利用从训练数据中获得的权重，对于一条新推文，我们可以计算：\n\n```\nP(推文 = 真 | 其特征集合 X)\n```\n\n\n\n\
  机器学习的复杂问题通常被简化为寻找所选模型（在此为逻辑回归）的权重或参数这一看似简单的问题。\n\n## 朴素贝叶斯分类器\n\n到目前为止，在我们对真实性问题的讨论中，概率一直扮演着关键角色。概率研究的核心是贝叶斯定理。本节将探讨如何直接应用贝叶斯定理来解决真实性问题。\n\
  \n在逻辑回归中，我们假设逻辑函数有助于区分真实推文和虚假推文。我们直接估计推文真实性得分（这也被称为条件概率的指示），作为特征在公式 (5.2) 中的线性函数。我们没有学习什么构成真实推文，什么构成虚假推文。我们只关心如何区分两者。这被称为机器学习的判别式方法。如果我们只需要区分两个类别，这是一种更实用的方法。例如，如果必须区分两种口语（比如英语和中文），更实际的做法是根据单词的发音来区分，而不是学习每种语言。然而，在某些情况下，我们确实会学习语言以确定给定句子属于哪种语言。这被称为生成式方法。朴素贝叶斯技术属于生成式算法这一类。\n\
  \n一方面，生成式方法之所以得名，是因为我们能够自己生成数据点。例如，如果我们学习中文和英文来区分二者，我们也能生成自己的句子——而不仅仅是区分二者。另一方面，判别式方法只能区分两个类别，但无法生成新的数据点。用概率术语来说，生成式模型从训练数据中学习先验概率和条件概率分布，而在像逻辑回归这样的判别式模型中，我们并不尝试计算这些概率。在概率世界中，“学习”一个类别（如英语）本质上就是计算与该类别相关的概率分布函数。\n\
  \n> **注意**：机器学习算法可以分为判别式或生成式，后者具有生成数据点的能力。\n\n学习语言的例子仅用于说明生成式与判别式方法之间的区别，不应从字面上理解。事实上，生成式方法的结果通常不如判别式方法准确，而在学习语言的例子中，直觉上生成式方法应该产生更好的结果，因为语言是经过学习的。因此，这个类比仅用于说明，并非精确对应。\n\
  \n在我们的推文真实性问题中，对于特征集 `X`，涉及以下几个概率：\n\n- `p(X|Y)`：给定推文为真（或假）时，该推文具有特征 `X` 的概率。\n\
  - `p(X,Y)`：给定特征的推文为真（或假）的联合概率。\n- `p(Y) = Σ_X p(X,Y)`：数据集中出现真实（或虚假）推文的概率。\n- `p(Y|X)`：具有特征\
  \ `X` 的推文为真（或假）的条件概率。\n- `p(X)`：具有特征 `X` 的推文出现的概率。\n\n真实性问题旨在计算 `p(Y|X)`。一条真实（或虚假）推文具有特征\
  \ `X` 的概率是 `p(X|Y)`。在频率主义方法中，`p(Y)` 告诉我们真实（或虚假）推文在给定数据集中出现的频率。`p(X)` 实际上无关紧要，因为无论对真实推文还是虚假推文，它的值相同，但如下文所述，它仍然用于计算我们的目标\
  \ `p(Y|X)`。\n\n熟悉概率的读者会记得 18 世纪英国统计学家托马斯·贝叶斯给出的基本定理，如下方公式 (5.8) 所示。\n\n贝叶斯定理：`p(X,Y)\
  \ = p(X|Y) * p(Y) = p(Y|X) * p(X)`  \n(5.8)\n\n我们可以利用上述贝叶斯定理 (5.8) 来实现我们的目标：根据特征找出推文为真的概率，如下方公式\
  \ (5.9) 所示。\n\n`p(Y|X) = p(X|Y) * p(Y) / p(X)`  \n(5.9)\n\n大多数算法都基于某些假设。朴素贝叶斯分类器的一个基本假设是，所有特征相互独立。这意味着，例如，拥有更多的转推次数与拥有更多的点赞次数无关。在现实世界中，这不一定完全成立，但在大多数情况下是一个合理的近似。独立性假设导出了下方公式\
  \ (5.10)。\n\n`p(X|Y) = p(x₁|Y) * p(x₂|Y) * p(x₃|Y) * ... * p(xₙ|Y)`  \n(5.10)\n\n\
  示例：`p`(推文包含多媒体内容，被置顶，引用其他用户 | 推文被标记为真)  \n= `p`(推文包含多媒体内容 | 推文被标记为真) *  \n`p`(推文被置顶\
  \ | 推文被标记为真) *  \n`p`(推文引用其他用户 | 推文被标记为真)\n\n类似地：\n\n`p(X) = p(x₁) * p(x₂) * ...\
  \ * p(xₙ)`  \n(5.11)\n\n> **注意**：过去的事件频率（计为出现次数）可以转换为概率，而概率有助于预测未来。\n\n公式 (5.10)\
  \ 右侧的概率可以通过统计训练数据中各自事件的出现频率来计算。例如，训练数据可以告诉我们，有多少条被标记为真的推文是被置顶的。那么，条件概率就是这些事件的数量与数据集中真实推文总数的比值。因此，我们可以使用公式\
  \ (5.10) 计算出 `p(X|Y)`。类似地，`p(X)` 可以使用公式 (5.11) 计算。`p(x[i])` 就是具有特定特征的推文数量除以推文总数的比值。我们将每个特征对应的这些概率相乘，即可得到\
  \ `p(X)`。\n\n\n\n### 朴素贝叶斯\n\n在计算公式 (5.9) 左侧目标之前，右侧唯一需要计算的项是 `p(Y)`。这本质上是在给定数据集中，随机找到一条真实（或虚假）推文的概率。它类似于计算从一个装有\
  \ `m` 个红球和 `n` 个绿球的袋子中摸到红球的概率。对于训练数据而言，`p(Y)` 就是训练数据集中被标记为真实（或虚假）的推文数量与推文总数量的比值。现在，既然我们已经得到了右侧的所有项，就可以轻松计算出左侧的值，从而得到一条具有给定特征的新推文为真实的期望概率。\n\
  \n> **注：** 这个复杂的机器学习问题，有时可以通过简单应用贝叶斯定理来解决，只需做一个朴素假设：在给定标签的条件下，各特征之间是条件独立的。\n\n##\
  \ 支持向量机\n\n一种相对较新的机器学习算法，在上世纪九十年代因分类任务（在我们的案例中，是将数据点分类为真实和虚假）而流行起来，被称为**支持向量机（SVM）**。SVM\
  \ 的核心思想是：以最大化已分离训练数据的间隔为目标，来绘制图 5-1 中的分类器。间隔是指分类器两侧最接近的数据点之间的距离。让我们通过推特示例来进一步探讨细节。\n\
  \n如同本章开头所讨论的，假设训练数据已经绘制完成，如图 5-5 所示。左侧绘制的是真实推文，右侧是虚假推文。\n\n![A436227_1_En_5_Fig5_HTML.jpg](img/A436227_1_En_5_Fig5_HTML.jpg)\n\
  \n*图 5-5* – 一条新推文落在真实推文和虚假推文之间\n\n现在我们希望判断一条落在图中真实和虚假推文之间的新推文的真实性，如图 5-5 所示。有几种方法可以构建一个分类器，将训练集中的真实和虚假推文分开。我们先将自己限制在线性分类器的范围内。图\
  \ 5-6 展示了一些可能的线性分类器。根据我们选择的分类器不同，新推文可能被标记为真实或虚假。例如，选择图中的分类器 2 或分类器 5 会导致新推文被标记为虚假，而选择其他任何分类器则会导致新推文被标记为真实。\n\
  \n![A436227_1_En_5_Fig6_HTML.jpg](img/A436227_1_En_5_Fig6_HTML.jpg)\n\n*图 5-6* –\
  \ 我们可以选择的各种分类器会对新推文产生不同的分类结果\n\n我们显然需要一种更具决定性的方法来选择分类器。理想情况下，分类器应尽可能地将真实推文与虚假推文分离开来。这种尽可能分离推文的问题可以用数学方式更清晰地表达如下：我们希望找到一个分类器，使得最接近的真实推文与最接近的虚假推文之间的距离尽可能宽。为此，我们识别出位于分隔两个类别边界上的点（更精确地说是向量）。在图\
  \ 5-7 中，这些点或向量被称为**支持向量**。我们希望能找到一个距这些向量最远的超曲面。图 5-8 展示了这样一个超曲面，也称为**最大间隔分类器**。之所以这样称呼，是因为它最大化了两个类别边界之间的间隔。\n\
  \n![A436227_1_En_5_Fig8_HTML.jpg](img/A436227_1_En_5_Fig8_HTML.jpg)\n\n*图 5-8* –\
  \ 距离两个边界最远的超曲面\n\n![A436227_1_En_5_Fig7_HTML.jpg](img/A436227_1_En_5_Fig7_HTML.jpg)\n\
  \n*图 5-7* – 位于边界上的向量\n\n图 5-9 解释了为什么边界上的向量被称为**支持向量** —— 它们可以被视为支撑着分类超曲面。如果这些向量稍有移动，超曲面也必须随之移动。相关的一点是，超曲面只依赖于这些点，而不依赖于训练集中的任何其他数据点，除非那些点越过边界成为了支持向量。\n\
  \n![A436227_1_En_5_Fig9_HTML.jpg](img/A436227_1_En_5_Fig9_HTML.jpg)\n\n*图 5-9* –\
  \ 边界上的向量可以被视为“支撑”着最大间隔分类器超曲面\n\n> **注：** 仅凭过去数据集中的几个数据点，就能帮助预测所有未来数据点的类别。\n\n最大间隔分类器的数学方程仍然采用公式\
  \ (5.0) 的形式。只是参数的求解方式不同，使用了与逻辑回归等方法不同的标准。然而，必须指出的是，我们为了简化讨论，只考虑了线性分类器。情况并非总是如此。例如，在图\
  \ 5-10 中，决策边界远非线性。此时，公式 (5.0) 中的超曲面方程不再适用。在这种情况下，我们使用所谓的**核函数**来建模分类器。寻找最大间隔所需的数学方法涉及二次规划，这超出了本书的范围。不过，即使不了解二次规划的复杂细节，也可以掌握实现\
  \ SVM 的软件。\n\n![A436227_1_En_5_Fig10_HTML.jpg](img/A436227_1_En_5_Fig10_HTML.jpg)\n\
  \n*图 5-10* – 类别边界并不总是线性的，如图所示\n\n\n\n## 人工神经网络\n\n我们的大脑通过连接大量神经元，并利用这些连接在神经元之间传递信号来运作。学习过程通过神经元、它们之间的连接以及传递的信号逐步推进。让我们更深入地了解学习是如何在我们的算法中实现的。图\
  \ 5-11 展示了在逻辑回归等机器学习算法中发生的过程。我们从训练数据集中提取若干特征，并将其作为输入 `x[i]`。每个输入 `x[i]` 通过对应的权重进行加权处理。权重与输入结合后，通过逻辑函数等函数进行处理，最终将输出分类为真或假。\n\
  \n![A436227_1_En_5_Fig11_HTML.jpg](img/A436227_1_En_5_Fig11_HTML.jpg)\n\n**图 5-11**\
  \ 多个输入节点连接到输出节点，输出节点进行一些处理后，将新的数据点分类为真或假\n\n类比人脑，每个输入都可以被视为一个神经元，更准确地说，是接收输入的人工神经元。每个输入神经元连接到另一个神经元，该神经元进行一些处理后产生输出。产生输出的节点称为输出神经元。这是一种简单的学习方式。直观上，通过在输入层和输出层之间引入更多神经元、更多连接以及更复杂的处理，可以使输出更加精确。这些神经元的功能是中介性的——它们既不从外部来源收集输入，也不向外部来源输出。因此，它们对外部世界是隐藏的。据此，它们可以被称为隐藏节点。图\
  \ 5-12 展示了人工神经元的这样一种排列。在此例中，隐藏层有三个节点。回到我们的推特示例，假设这三个隐藏节点分别回答以下三个问题：a) 发布推文的用户有多高的声誉？b)\
  \ 这篇推文是否吸引了大量关注？c) 推文内容的真实性如何？这三个答案是从输入层的节点中获得的，而这些节点实际上代表了特征。为了回答第一个问题，与用户相关的特征所对应的权重预计会很高，而其他权重则较低。\n\
  \n![A436227_1_En_5_Fig12_HTML.jpg](img/A436227_1_En_5_Fig12_HTML.jpg)\n\n**图 5-12**\
  \ 引入神经元的“隐藏层”以实现更精细的处理\n\n> **注** 人工神经网络展示了机器学习与人类学习的生物过程有多么接近。\n\n类似地，为了回答第二个和第三个问题，与用户相关的特征的权重被赋值为较低的值。为了避免混乱，图中未显示这些权重。对于第二个问题，与转发数、点赞数和回复数相关的特征的权重被赋值为较高的值。第三个问题则需要与内容相关的特征（例如是否包含多媒体内容，或是否引用其他用户、期刊等）的权重较高。这三个隐藏节点的值与其各自的权重（图中表示为\
  \ `w[21]`、`w[22]` 和 `w[23]`）相结合，最终得出真或假的分类结果。如图 5-12 所示的网络被称为人工神经网络（ANN）。它们可以包含任意数量的隐藏层。隐藏层和输出节点的数量是通过经验确定的。在我们的案例中，输出节点当然只有一个，因为分类是二元的——要么是真，要么是假。\n\
  \n隐藏层数量越多，学习就越深入，从而引出深度学习。上述讨论可能会引发一个问题：逻辑回归与神经网络的处理方式有何不同？实际上，图 5-11 是逻辑回归的一种表示，类似于图\
  \ 5-4。从这个意义上说，逻辑回归可以被视为最简单的人工神经网络（ANN）。人工神经网络中隐藏层和输出节点所进行的处理与逻辑回归中的处理类似。这些节点的处理过程涉及使用\
  \ sigmoid 函数（通常就是逻辑函数本身）对加权特征进行变换。多层人工神经网络中的神经元本身也可以被视为逻辑回归单元。因此，当特征集非常庞大，并且在最终分类之前需要解决许多中间问题时，神经网络就显得非常有用。\n\
  \n> **注** 人工神经网络比某些其他机器学习算法（如逻辑回归）强大数倍。因此，基于神经网络的深度学习日益受到关注。\n\n\n\n## K 均值聚类\n\n\
  到目前为止，我们一直假设给定一个带标签的数据集，可用于训练模型以计算权重。然而，如前所述，获取训练数据集并非总是易事，我们需要仅凭无标签数据对数据分类。这是无监督学习的任务之一。一种广泛使用的无监督学习方法是`K\
  \ 均值聚类`，它能将数据项自动分组为不同簇。最终数据集被划分为`K`个簇或子集，每个子集中的数据共享共同特征。针对我们的真实性判断问题，`K=2`，因为我们的分类是二元的，两个簇分别为真和假。\n\
  \n注意这里使用“簇”而非“类”。类是人为定义的，而簇是无需任何人工干预自动确定的。但对于我们的微博问题，我们希望簇能代表人为定义的类，即真实推文或虚假推文。这可以通过恰当选择特征来实现，使得所有真实推文具有相似特征，所有虚假推文也具有相似特征但不同于真实推文。在图表上绘制时，所有真实推文彼此接近，虚假推文也彼此接近，但与真实推文分开。正如我们在图\
  \ 5-1 中所见，情况确实如此。`K 均值`算法无需像图 5-1 那样构建分类器，就能找到这两个分组。\n\n在没有任何带标签训练数据的情况下，图 5-1 看起来就像图\
  \ 5-13——空间中代表推文的点或向量起初看起来完全相同，属于同一类。现在的问题是将它们分为两类：真实推文和虚假推文，每类因其特征性质而聚集在一起。正如我们在支持向量机（SVM）中看到的，目标是让识别出的两个集合尽可能远离。与支持向量机一样，分离过程需要使用距离的概念。有多种方法可以测量两个点、向量或数据点之间的距离，其中包括堪培拉度量、相关系数、余弦相似度和曼哈顿距离。为了使讨论直观且与常用方法一致，我们仅使用欧氏距离，即两点之间常见的几何距离概念。\n\
  \n![A436227_1_En_5_Fig14_HTML.jpg](img/A436227_1_En_5_Fig14_HTML.jpg)\n\n图 5-14:\
  \ K 均值算法流程图\n\n![A436227_1_En_5_Fig13_HTML.jpg](img/A436227_1_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13: 无监督学习：所有推文一开始都无标签且无法区分\n\n`K 均值`是一种迭代算法。聚类基于质心概念，质心可视为簇的中心。数学上，\n\n```\n\
  \\mu(C) = \\frac{\\Sigma \\vec{x}_i}{|C|}\n其中 \\mu(C) 是簇 C 的质心（均值）\n|C| 是簇 C 中点的数量，且\n\
  x_i 是簇 C 中各点特征的值\n```\n\n在我们的例子中，`K=2`，因此初始时随机选择两个点作为两个簇的质心。对于每个其他点，计算两个距离：a) 距离质心\
  \ 1 的距离，b) 距离质心 2 的距离。如果该点更接近质心 1，则归入簇 1，否则归入簇 2。经过这种新的分组，质心必然发生变化。为新簇计算新质心。计算新质心和重新分组点的过程持续进行，直到所有点都留在上一轮迭代中分配的簇中，且质心不再变化。\n\
  \n`K 均值`算法保证收敛，其证明超出了本书范围。它属于坐标下降算法类别。我们可以确信，经过若干次迭代后，当算法停止时，质心不再变化。整个过程如图 5-14\
  \ 所示。围绕这些质心的簇就是真实推文组和虚假推文组。\n\n**注**：将数据点分类为真和假可以在无监督情况下进行。\n\n## 总结\n\n学习区分真相与谎言是一个有趣的机器学习问题。我们看到了几种有助于实现这一目标的算法。这些算法要么通过提供带标签的训练数据来进行监督学习，要么是无监督学习。除此之外，算法可以是生成式的或判别式的，前者能够在学习概率分布后合成数据点。判别式方法的一个关键要素是参数估计。模型参数的估计方式需要能够优化算法的准确性。在下一章中，我们将转换方向，探讨逻辑和形式化方法如何帮助我们解决真实性判断领域的问题。\n\
  \n### 练习题\n\n1.  诸如逻辑函数之类的 Sigmoid 函数在本章的讨论中发挥了重要作用。还有哪些其他函数可能替代 Sigmoid 函数并有助于机器学习？\n\
  2.  本章介绍了几种可用于解决真实性判断问题的机器学习算法。探索其他算法，如随机森林和线性判别分析，评估其对真实性判断问题的适用性。\n3.  `K 均值`算法假设均值能代表簇。然而在现实世界中，通常是最“能言善辩”、最“有影响力”、最“富有”或其他“最\
  \ ____”的人当选为代表选民的议员。研究一种基于“众数”而非“均值”的聚类算法在准确性和应用实用性方面的表现。\n4.  实现一个人工神经网络来解决本章讨论的推文真实性判断问题。\n\
  5.  比较本章讨论的各种算法在解决微博真实性判断问题时的性能和适用性。\n\n\n\n"
- "# 6. 形式化方法\n\n术语 命题逻辑 谓词演算 模糊逻辑 小结\n\n我们能否为真实信息设定一套语法？当作者在一些会议上向听众提出这个问题时，答案绝大多数是“不能”。确实，常识告诉我们，真实性更多与语义相关，而非语法。处理语义，尤其是自然语言的语义，远比处理语法复杂得多，这使得真实性发现成为一项艰巨的任务。数学再次伸出援手，这次以不同的形式出现。本章中的数学直击问题的核心——信息表示。信息的表示在处理信息的算法中起着关键作用。表示越精确、越形式化，信息就越适合进行自动化处理。\n\
  \n表示在日常生活中的影响也很大。当思想以攻击性、好斗、对抗性的语言表达时，问题往往会升级。同样的思想，如果用有益、真实、支持性的句子表达，实际上可以解决问题。熟悉计算机科学中数据结构的人很容易理解，将数据表示为链表、栈或哈希表，如何对解决问题产生巨大影响。在本章中，我们将研究用逻辑符号表示数据，并利用这种表示来解决真实性问题。在语义网中使用的三元组存储是大数据中运用逻辑的一个很好示例。三元组存储使用资源描述框架（RDF）进行数据表示。本章介绍的技术要求对大数据表示方式进行类似的转变。\n\
  \n之前的方法是事后追溯式的——我们检查已经发生过的事情并判断其真实性。迄今为止的方法无法直接用于预防错误信息。它们只能帮助控制错误信息。如果我们能为真实信息施加一套语法，或许就能防止错误信息甚至进入系统。毕竟，信息最初的形式只有真理。只有当思想、互动和行为开始被扭曲后，人们才发明了语言结构来表达错误信息。\n\
  \n如果表示可以被再次限制为一套严格有效的结构，就有可能构建完全可靠的系统，而不给不精确和虚假信息留有任何空间。这些想法并不像看起来那样遥不可及。上一章讨论的区块链技术，就是一个接近构建完全可靠、可信任系统理念的例子。通过利用表示结构，可能很快就能构建出完全可靠的系统。当然，表示必须由定义清晰的语义来支持，这些语义有助于推导真实性或非真实性。\n\
  \n> **注**  \n> 知识和信息表示在系统演进中始终发挥着重要作用，并将继续如此。\n\n形式化方法是用于对计算系统进行严格表示的数学技术，以帮助进行系统设计和验证。这些方法是形式化的，因为其规范和操作是精确的并且符合规则。关于系统行为和属性的数据，以便于推导的简洁语法被捕获。数学逻辑是形式化方法的组成部分之一。正如我们将看到的，逻辑完全关乎语法以及用于对语法进行操作的公理和规则。验证、推理或证明真实性，变成了策略性地应用公理和规则，将信息转化为蕴含真实性或非真实性的过程。当数据使用逻辑结构表示时，它通过将真实性问题转化为逻辑推理问题来帮助解决该问题。\n\
  \n> **注**  \n> 形式化方法提供了强大的技术，能够使用标准化语法将关于系统的一般描述转化为精确的规范语言，并以日益自动化的方式进行推理。\n\n形式化规范有助于检查一致性，但可以理解的是，它并不能保证是完备的。不可能捕捉到与系统相关的每一个细节以使规范完备。因此，通常的假设是，如果一个语句在系统中未被证明为真，则假定它为假。这被称为封闭世界假设。直观上，句法操作（如同在自动推理中使用的那样）不太可能使用领域特定的规则和知识；因此它被认为是一种弱方法。然而，有些软件程序（如专家系统）基于逻辑，能够将领域知识捕获到规则库中，从而提供更强的推理方法。\n\
  \n系统需求和描述有时是模糊且不一致的。将它们转化为形式化规范会揭示出任何此类不精确性并将其消除。因此，知识表示在防止错误信息进入系统方面大有可为。任何需要成为系统一部分的新语句都需要经历蕴含验证过程，这确保了被接受的语句是真实的。IBM、微软和英特尔等许多公司已成功将形式化方法用于软件和硬件验证。\n\
  \n我们在第 3 章中简要介绍过基于形式化方法的一些方法。以下各节将更形式化地论述这一主题。\n\n\n\n## 术语\n\n在前言以及本章开头，我们已经使用了形式化方法领域中的一些术语。现在，让我们使用更精确、更严格的术语来正式定义更多的概念。这些术语及其定义紧密遵循现实世界的现象，因此，正如我们在第\
  \ 3 章和本章开头几段所看到的，它们不需要过多的解释。首先，`proof`是最有用的概念。`证明`是一种论证形式，由一系列遵循少量推理规则的步骤组成。这些规则有助于从前述陈述中得出结论。`证明`的目标是证明某事物为真。如果目标失败且无法被证明为真，则在封闭世界假设（`CWA`）中，它被假定为假。\n\
  \n通过形式证明被证明为真的陈述称为`theorem`。有时，定理的证明会变得非常长。在这种情况下，`lemma`被用作中间定理，用于另一个定理的证明过程中。一个定理通常会引出其他结论，称为`corollaries`。这些也是定理，可以从已经证明的其他定理中推导出来。在现实世界中，我们发现许多事实是不证自明的，不需要证明。这些是作为起点的基本真理。用来表示这种始终被假定为真的基本真理的术语是`axiom`。\n\
  \n如果我们不能同时证明一个定理及其逆命题，则称该系统是一致的。一个相同的概念是可靠性，它要求所有可证明的陈述都为真。通常，研究论文会因工作不具可靠性而被拒稿。为了急于发表更多论文，一些研究人员试图证明他们的假设，而这些假设可能并非为真。编辑委员会会将此类论文退回，并附上评论称该工作不可靠。在所有可能的解释中均为真的表达式称为`tautology`。另一方面，始终为假的陈述称为`contradiction`。不属于这两类的陈述称为`contingents`。\n\
  \n正如我们将看到的，定理证明是如此机械化，以至于构建证明的过程可以被编写成计算机编程语言。这种自动定理证明（`ATP`）广泛应用于数学、软件设计与验证以及硬件验证的各种应用中。目前有许多成功的`ATP`系统在使用中。还有许多其他术语，其中一些将在我们学习本章的过程中逐步介绍。目前，我们已经掌握了足够的专业术语，可以开始讨论当我们的数据以逻辑符号表示时，如何解决真实性问题。\n\
  \n> **注意**  \n> 形式化方法包含许多定义明确的术语，这些术语本身也是形式化陈述的，没有任何歧义。\n\n## 命题逻辑\n\n一个`proposition`是可以为真或假的陈述。命题可以通过逻辑连接词进行连接。命题逻辑提供了连接或改变命题以构建其他命题的方法。通过使用\
  \ `and`、`or` 组合自然语言句子的常见方式同样适用于命题逻辑。命题可以使用诸如 `and` 和 `or` 之类的运算符进行组合。同样，就像使用 `not`\
  \ 来改变英语句子的含义一样，它在命题逻辑中也被用作具有相同语义的运算符。所有这些听起来都像英语和其他自然语言。那么，逻辑在处理真实性问题时如此有用的不同之处是什么呢？正是数学抽象赋予了这些概念将真值问题转化为数学推理问题的能力。\n\
  \n数学需要符号。表 6-1 展示了我们在上一段讨论的运算符的语法（符号）。`negation` 运算符只是将真命题的值改为假，反之亦然。其他运算符的语义在表\
  \ 6-2 至表 6-5 中给出。这些语义解释非常直观，并且紧密遵循现实世界的解释。例如，两个由 `and` 运算符连接的真陈述会产生一个真陈述。如果这两个陈述中的任意一个为假，则\
  \ `and` 合取产生的陈述将为假。例如，如果“约翰英语成绩为 A”和“约翰科学成绩为 A”是真陈述，那么组合陈述“约翰英语成绩为 C 且科学成绩为 A”直观上是假的，并且根据表\
  \ 6-2 的真值表判断，它也是假的。表中的 `T` 代表真，`F` 代表假。\n\n运算符可以在一个句子中任意多次使用。例如，`(p → q) ∧ (q →\
  \ p)` 是一个有效的句子。事实上，如果为这个表达式绘制真值表，可以验证它等同于 `(p ↔︎ q)`。真值表同样用于确定不同表达式的等价性。使用真值表，可以确定\
  \ `(p ∨ ¬p)` 是一个永真式，而 `(p ∧ ¬p)` 是一个始终为假的矛盾式。还可以确定 `(p → q)` 等同于 `(¬p ∨ q)`，并且 `¬(p\
  \ ∨ q)` 等同于 `(¬p ∧ ¬q)`。\n\n**表 6-6** 蕴含式的逆命题、否命题和逆否命题\n\n| 符号 | 含义 |\n| --- | ---\
  \ |\n| `p → q` | 如果 `p` 则 `q` |\n| `q → p` | 第一行的逆命题（如果 `q` 则 `p`） |\n| `¬p → ¬q`\
  \ | 第一行的否命题（如果非 `p` 则非 `q`） |\n| `¬q → ¬p` | 第一行的逆否命题（如果非 `q` 则非 `p`） |\n\n**表 6-5**\
  \ 等价运算符的语义\n\n| 命题 p | 命题 q | `p ↔︎ q` |\n| --- | --- | --- |\n| `T` | `T` | `T`\
  \ |\n| `T` | `F` | `F` |\n| `F` | `T` | `F` |\n| `F` | `F` | `T` |\n\n**表 6-4**\
  \ 蕴含运算符的语义\n\n| 命题 p | 命题 q | `p → q` |\n| --- | --- | --- |\n| `T` | `T` | `T`\
  \ |\n| `T` | `F` | `F` |\n| `F` | `T` | `T` |\n| `F` | `F` | `T` |\n\n**表 6-3**\
  \ 析取 `or` 运算符的语义\n\n| 命题 p | 命题 q | `p ⋎ q` |\n| --- | --- | --- |\n| `T` | `T`\
  \ | `T` |\n| `T` | `F` | `T` |\n| `F` | `T` | `T` |\n| `F` | `F` | `F` |\n\n**表\
  \ 6-2** 合取 `and` 运算符的语义\n\n| 命题 p | 命题 q | `p ⋏ q` |\n| --- | --- | --- |\n| `T`\
  \ | `T` | `T` |\n| `T` | `F` | `F` |\n| `F` | `T` | `F` |\n| `F` | `F` | `F` |\n\
  \n**表 6-1** 命题逻辑符号\n\n| 符号 | 含义 |\n| --- | --- |\n| `⋏` | 且（合取） |\n| `⋎` | 或（析取）\
  \ |\n| `→` | 如果（蕴含） |\n| `¬` | 非（否定） |\n| `↔︎` | 当且仅当（等价） |\n\n\n\n表 6-6 展示了术语 `converse`、`inverse`\
  \ 和 `contrapositive` 的语义，这些术语在构造引理、定理的证明以及推导推论时有时会派上用场。其解释同样非常直观。假设 `p` 代表“约翰成绩为\
  \ A”，`q` 代表“约翰学习努力”。那么它们蕴含式的 **逆否命题** 就是“如果约翰不努力学习，那么约翰成绩不会为 A”。\n\n可以看出，随着我们围绕信息表示发展出更多数学工具，我们用来判断复杂陈述真伪的手段也越来越多。真值表就是其中一种工具。然而，如果表达式中有\
  \ `n` 个命题，表中就需要 `2^n` 行和相应数量的计算。显然，这种计算将变得难以处理。因此，大多数逻辑系统依赖于推理规则。真伪可以通过真值表逐行检查，或运用推理规则来判断。我们在第\
  \ 3 章中看到了一个名为 `modus ponens` 的推理规则示例。表 6-7 列出了更多此类规则。请注意，表格中的 `c` 代表矛盾。如果第二列中给出的命题为真，则第三列中的命题也可以推断为真。因此，给定的表达式可以被转化为推断出的表达式。\n\
  \n> **注意**\n>\n> 推理规则！\n\n**表 6-7** 命题逻辑的推理规则；`c` 代表矛盾\n\n| 推理规则 | 已知前提 | 推断结论 |\n\
  | --- | --- | --- |\n| 肯定前件 | `p`, `p → q` | `q` |\n| 否定后件 | `¬ q`, `p → q` | `¬\
  \ p` |\n| 一般化 | `p` 或 `q` | `p ∨ q` |\n| 特殊化 | `p ∧ q` | `p` 或 `q` |\n| 合取引入 | `p`,\
  \ `q` | `p ∧ q` |\n| 替换 | `p → q` | `¬ p ∨ q` |\n| 选言三段论 | `p ∨ q`, `¬ p` | `q`\
  \ |\n| 选言三段论 | `p ∨ q`, `¬ q` | `p` |\n| 传递性 | `p → q`, `q → r` | `p → r` |\n| 矛盾\
  \ | `¬ p →` | `p` |\n| 情况分析 | `p ∨ q`, `p → r`, `q → r` | `r` |\n\n与 `modus ponens`\
  \ 的情况类似，这些规则是相当直观的。以表 6-7 中描述的 `Disjunction Syllogism` 为例。设 `p` 代表“约翰很聪明”，`q` 代表“约翰考试不及格”。如果我们知道\
  \ `¬p` 和 `p ∨ q` 为真，意味着“约翰不聪明”且“要么约翰很聪明，要么约翰考试不及格”，那么直观上，“约翰考试不及格”必然为真。表 6-7 中 `Disjunction\
  \ Syllogism` 一行实质上确认了这一点。同样，`transitivity` 规则也可以直观理解。如果约翰很聪明，那么约翰会通过考试；如果约翰会通过考试，那么约翰会毕业。根据前面这些蕴含式，可以推断出：如果约翰很聪明，那么约翰会毕业。表\
  \ 6-8 给出了一个逻辑恒等式列表，其中 `LHS` 与 `RHS` 相同。这些恒等式可以通过为 `LHS` 和 `RHS` 构建真值表来验证。这些逻辑恒等式在展开证明时也很有用。\n\
  \n表 6-7 中的规则也有不同的名称。例如，`Generalization` 规则也称为 `or introduction`，有时记作 `∨I`——第一个符号代表“或”，第二个代表“引入”。这是因为我们从前提开始，然后在\
  \ `RHS` 上引入 `or`。类似地，`Specialization` 等同于 `and Introduction`，记作 `∧I`。必须注意，所有推理规则都可以被证明是可靠的。\n\
  \n> **注意**\n>\n> 推理所需的语义被封装在命题逻辑的语法中，因此定理证明或推导真伪的任务就简化为句法操作。\n\n**表 6-8** 命题逻辑恒等式\n\
  \n| 恒等式名称 | 左边 L.H.S. | 右边 R.H.S. |\n| --- | --- | --- |\n| 同一律 | `p ∧ T` 和 `p ∨\
  \ F` | `p` 和 `p` |\n| 幂等律 | `p ∨ p` 和 `p ∧ p` | `p` 和 `p` |\n| 德摩根律 | `¬(p ∧ q)`\
  \ 和 `¬(p ∨ q)` | `¬p ∨ ¬q` 和 `¬p ∧ ¬q` |\n| 交换律 | `p ∨ q` 和 `p ∧ q` | `q ∨ p` 和\
  \ `q ∧ p` |\n| 吸收律 | `p ∨ (p ∧ q)` 和 `p ∧ (p ∨ q)` | `p` 和 `p` |\n| 否定律 | `¬(p →\
  \ q)` 和 `¬(p ↔ q)` | `p ∧ ¬q` 和 `¬p ↔ q` |\n| 分配律 | `p ∧ (q ∨ r)` 和 `p ∨ (q ∧ r)`\
  \ | `(p ∧ q) ∨ (p ∧ r)` 和 `(p ∨ q) ∧ (p ∨ r)` |\n| 结合律 | `(p ∨ q) ∨ r` 和 `(p ∧ q)\
  \ ∧ r` | `p ∨ (q ∨ r)` 和 `p ∧ (q ∧ r)` |\n| 双重否定律 | `¬(¬p)` | `p` |\n| 蕴含律 | `p\
  \ → q` 和 `p → q` | `¬p ∨ q` 和 `¬q → ¬p` |\n| 双条件律 | `p ↔ q` 和 `p ↔ q` | `¬q ↔ ¬p`\
  \ 和 `(p → q) ∧ (q → p)` |\n\n利用推理规则、给定公理和逻辑恒等式，证明通过用推断表达式替换给定表达式机械地进行。因此，证明变成了一系列句法替换，每次替换都保持了真值不变。让我们考虑一个示例问题。在约翰的学校，要注册\
  \ `COEN498`，他必须先完成 `COEN490` 以及 `COEN200` 或 `COEN220` 中的一门。`COEN498`、`COEN490`、`COEN200`\
  \ 和 `COEN220` 是该学校提供的不同课程。我们知道约翰没有完成 `COEN200`，但完成了 `COEN498`。约翰声称他完成了 `COEN220`。他说的是真话吗？\n\
  \n使用命题逻辑查找真值的第一步是，利用我们刚学过的记号将问题转化为命题。我们首先建立以下命题：\n\n- `p` 代表“约翰完成了 `COEN498`”\n\
  - `q` 代表“约翰完成了 `COEN490`”\n- `r` 代表“约翰完成了 `COEN200`”\n- `s` 代表“约翰完成了 `COEN220`”\n\
  \n现在，问题是在给定以下前提的情况下证明 `s`：\n\n```\np → q ∧ (r ∨ s)\n```\n\n(6.1)\n\n```\np\n```\n\
  \n(6.2)\n\n```\n¬r\n```\n\n(6.3)\n\n\n\n我们从证明的前两条公理开始，依次应用基于推理规则的代换，并在适当时使用第三条公理。该证明见表\
  \ 6-9，它证实了约翰的主张是正确的，并且他确实完成了 `COEN220` 课程。从表中可以看出，该证明纯粹是句法层面的，这进一步佐证了我们在本章开头提出的问题。从公理出发，逐步应用规则以达成目标的方法称为**正向链接**。另一方面，从目标出发反向推导至公理的方法称为**反向链接**。这两种算法都可以被证明是可靠且完备的，其复杂度为\
  \ `O(n)`，其中 `n` 是由给定的前提集合构成的知识库的大小。\n\n> **注**  \n> 正向链接是数据驱动的，而反向链接是目标驱动的。\n\n\
  ### 表 6-9 约翰完成 COEN220 课程的证明\n\n| 序号 | 变换 | 应用的规则 |\n| --- | --- | --- |\n| 1 |\
  \ `p → q ∧ (r ∨ s)` | 给定公理 |\n| 2 | `p` | 给定公理 |\n| 3 | `q ∧ (r ∨ s)` | 对 1 和 2\
  \ 应用假言推理 |\n| 4 | `r ∨ s` | 特化规则 |\n| 5 | `¬r` | 给定公理 |\n| 6 | `s` | 对 4 和 5 应用选言三段论\
  \ |\n\n在上述例子中，我们从若干前提（6.1）、（6.2）、（6.3）出发，并由此推断出 `s`。通常，当数据使用逻辑符号表示时，真值验证问题可以转化为：给定若干前提\
  \ `p[1]`、`p[2]`、`p[3]`、…、`p[n]`，推导出结论 `s`。这可以表示为：\n\n```\np1, p2, p3, ..., pn ⊢\
  \ s\n```\n\n(6.4)\n\n像 (6.4) 这样，从一组给定前提推导出结论的表达式称为** sequent**。用于此类证明的逻辑系统称为** sequent\
  \ 演算**。\n\n一种成功运用了上述部分概念的语言是 `Prolog`。一个 `Prolog` 程序包含用户提供的知识库（`KB`），该知识库由一组事实和规则组成。`Prolog`\
  \ 的推理引擎主要基于单一的推理规则——假言推理。利用用户提供的 `KB` 和推理引擎，`Prolog` 能够得出结论并判断某个主张为真还是为假。图 6-1 对此进行了说明。`KB`\
  \ 中的事实和规则以子句的形式存在。子句是通过析取（或运算）连接的字面量。字面量是原子命题或其否定形式。`Prolog` 程序中的事实和规则称为**霍恩子句**，以逻辑学家阿尔弗雷德·霍恩的名字命名。\n\
  \n![A436227_1_En_6_Fig1_HTML.jpg](img/A436227_1_En_6_Fig1_HTML.jpg)\n\n**图 6-1**\
  \ 在 Prolog 中判定真值\n\n如今，`Prolog` 甚至以意想不到的方式被应用于诸如代码审查工具 `Gerrit` 等应用程序中。它曾在欧洲和日本被广泛使用，特别是在\
  \ 20 世纪 80 年代至 90 年代初期的第五代计算机项目中。`Prolog` 程序是一组霍恩子句，并附加了一些增值功能，例如对算术函数的支持以及用于防止回溯的截断（cut）等结构。对新主张真伪的评估通过前面描述的反向链接进行。在反向链接过程中，回溯是指当当前子目标失败时，返回之前的分支点以查看是否存在其他解决方案的过程。\n\
  \n`Prolog` 中的目标搜索以深度优先、从左到右的方式进行，这由以下两个子句中的递归表示。\n\n```\ndfs(X):- goal(X)\n```\n\
  \n```\ndfs(X):- successor(X, Subgoal), dfs(SubGoal)\n```\n\n`Prolog` 中的运算符 `:–`\
  \ 表示“如果”的意思。在上述两行中，`X` 是一个变量。给定一个需要证明为真或假的目标，`Prolog` 以如上递归方式进行。第一行是递归的终止条件。如果我们已有前提表明变量\
  \ `X` 代表了知识库，则第一个条件匹配，程序终止并针对给定目标返回 `True` 值。否则，第二条规则生效。`Prolog` 会以深度优先搜索的方式遍历知识库，继续尝试该目标。根据前面讨论的封闭世界假设（`CWA`），如果\
  \ `Prolog` 无法证明该目标，则假定其为假。\n\n> **注**  \n> 逻辑令人惊奇地将验证真理的问题转化为对符号的机械操作。\n\n命题逻辑也称为**零阶逻辑**。其表达能力和功能是有限的。高阶逻辑（`HOL`）系统则更具表达能力和更强大。例如，一阶逻辑（`FOL`）允许对变量进行量化，二阶逻辑允许对变量集合进行量化，三阶逻辑允许对集合的集合进行量化，以此类推。利用量化，我们可以对数量进行操作，例如一个实体的所有实例或至少一个实例。对于大多数目的而言，一阶逻辑（也称为**一阶谓词演算**或简称为**谓词演算**）通常在复杂性限制内就足够了。我们将在下一节中探讨这种重要的逻辑阶，它是强大逻辑系统的基础。\n\
  \n\n\n## 谓词演算\n\n到目前为止，我们还没有使用变量的概念。每个实体都是常量。想象一下没有变量概念的数学！我们仍然在没有使用任何占位变量的情况下做了很多工作。当我们谈论大数据时，我们应该能够表示许多变体，因此需要变量。现实世界的数据主要涉及实体的数量，这一点此前也未被使用。将两者结合，一阶逻辑（`FOL`）提供了对变量的量化能力，这是命题逻辑所不具备的。变量的数量方面通常在英语等自然语言中通过“存在”（there\
  \ exists）和“对所有”（for all）等短语表达。这些短语表明了实体的数量；因此在逻辑中它们被称为量词。\n\n命题要么为真，要么为假。它们的真值不会变化。例如，命题“玛丽是安的母亲”要么为真，要么为假。如果它为真，那么它始终保持为真。而谓词，例如“`x`\
  \ 是安的母亲”，则可以根据变量 `x` 的值而变为真或假。在这里，玛丽和安是常量符号，是现实世界中的实体。谓词表示一种关系。前面的谓词可以符号化地写为\n\n\
  ```\nMother(x, Ann)\n```\n\n(6.4)\n\n在上述 (6.4) 的谓词中，`x` 和 `Ann` 被称为项，表示对象。上述谓词是二元的，因为它包含两个项。谓词可以使用我们在命题逻辑中使用的算子进行组合。例如，(6.5)\
  \ 中的句子可以表示“玛丽是安的母亲，并且安是可可的母亲”。\n\n```\nMother(Mary, Ann) ∧ Mother(Ann, Coco)\n```\n\
  \n(6.5)\n\n```\nMother(Mary, Ann) → Female(Mary)\n```\n\n(6.6)\n\n句子 (6.6) 使用“如果”算子组合谓词，意思是“如果玛丽是安的母亲，那么玛丽是女性”。可以看出，在用一阶逻辑构建句子方面，它在表示数据和通过推理确定断言真实性方面起着关键作用。\n\
  \n如前所述，`FOL` 提供了两个额外的算子：全称量词 `∀`，意为“对所有”；以及存在量词 `∃`，意为“存在”。使用全称量词，(6.6) 可以推广为下面的\
  \ (6.7) 和 (6.8)。(6.7) 可以解释为“对所有实体 `x`，如果 `x` 是任何其他实体 `y` 的母亲，那么 `x` 是女性。”另一方面，(6.8)\
  \ 可以解释为“存在一个实体 `x`，使得如果另一个实体 `y` 是活着的，那么 `x` 是 `y` 的母亲。”\n\n```\n∀x Mother(x, y)\
  \ → Female(x)\n```\n\n(6.7)\n\n```\n∃x IsLiving(y) → Mother(x, y)\n```\n\n(6.8)\n\
  \n从真实性的角度来看，我们主要关注推理真值。新的连接词将需要新的推理规则。就像在命题逻辑中一样，我们有两个量词的引入规则和消去规则。同样像在命题逻辑中一样，这些规则可以被证明是可靠的。让我们从最简单的开始——全称量词的消去。我们可以通过用特定实例实例化变量来消去\
  \ `∀` 算子。例如，在 (6.7) 中，我们可以用特定值“玛丽”实例化 `x`，并消去全称量词。结果句子如下面的 (6.9) 所示。\n\n```\nMother(Mary,\
  \ y) → Female(Mary)\n```\n\n(6.9)\n\n在 (6.9) 中，我们用常量“玛丽”替换了 `x`。我们也可以用函数来实例化变量，例如\
  \ `MotherOf(Ann)`，它看起来很像谓词，但非常不同。谓词要么为真，要么为假，没有其他情况。另一方面，函数在一个域中返回一个值。例如，`MotherOf(Ann)`\
  \ 可能返回“玛丽”，而 `Mother(Mary, Ann)` 只能返回 `true` 或 `false`。我们也可以通过将 (6.7) 转换为下面的 (6.10)\
  \ 来消去全称量词。\n\n```\nMother(MotherOf(Ann), y) → Female(MotherOf(Ann))\n```\n\n(6.10)\n\
  \n必须注意，实例化必须在整个句子中一致地发生。因此，在 (6.9) 中，我们不能在左侧（LHS）用“玛丽”实例化 `x`，而在右侧（RHS）用其他值实例化。全称量词消去规则记为\
  \ `∀E`。\n\n下一个更简单的规则是存在量词引入 `∃I`，有时称为存在泛化。它很简单，因为如果一个句子对一个实例为真，那么我们可以泛化得出存在一个实体使得该句子为真。使用此规则，(6.9)\
  \ 可以泛化为下面的 (6.11)。\n\n```\n∃x Mother(x, y) → Female(x)\n```\n\n(6.11)\n\n我们在句子 (6.9)\
  \ 中用变量 `x` 替换了“玛丽”，并引入了存在量词。\n\n在一阶逻辑中构建证明有时需要引入全称量词，记为 `∀I`。其目标是将像 (6.10) 这样的句子转换为像\
  \ (6.7) 这样的泛化形式。这只有在能够证明 (6.9) 中的值“玛丽”没有什么特殊性使得该句子仅对该实例为真，并且该句子对可以替换“玛丽”的其他值也为真时，才能做到。对于\
  \ (6.10) 的情况，这很容易证明，因为 (6.10) 是从 (6.7) 进行全称消去的结果。因此，在对同一句子进行全称消去后的一系列句子之后，可以很容易地对一个句子进行全称引入。\n\
  \n现在来看最难的规则，存在量词消去 `∃E`。它可以用于将像 (6.11) 这样包含存在量词的句子转换为消去该量词的 (6.9)，方法是将变量 `x` 替换为一个特定值。但我们如何知道实例化的特定值使句子为真呢？因此，只有当能够证明特定实例在替换变量后，在整个句子中满足该句子时，才能进行存在量词消去。\n\
  \n让我们考虑一个例子。根据已知事实“班上有一名学生获得了 A 等”和“班上的每个学生都毕业了”，我们想知道老师声称的“毕业了的学生获得了 A 等”是否为真。与之前的命题逻辑示例一样，我们首先构建以下前提：\n\
  \n*   `Student(x)` 表示“`x` 是班上的学生”\n*   `Agrade(x)` 表示“`x` 获得了 A 等”\n*   `Graduated(x)`\
  \ 表示“`x` 毕业了”\n\n这里的论域，更正式地称为论域或话语域，是班上所有学生的集合。给定的前提可以写为下面的 (6.12) 和 (6.13)。\n\n\
  ```\n∃x (Student(x) ∧ Agrade(x))\n```\n\n(6.12)\n\n```\n∀x (Student(x) → Graduated(x))\n\
  ```\n\n(6.13)\n\n需要评估其真实性的老师声称可以写为下面的 (6.14)。\n\n```\n∃x (Graduated(x) ∧ Agrade(x))\n\
  ```\n\n(6.14)\n\n从表 6-10 的证明来看，老师声称 (6.14) 确实是真命题。\n\n**表 6-10** 老师声称是真命题的证明\n\n\
  \n\n| 序号 | 转换 | 应用的规则 |\n| --- | --- | --- |\n| 1 | `$ \\exists x\\left( Student(x)\\\
  wedge Agrade(x)\\right) $` | 给定前提 (6.12) |\n| 2 | `$ \\left( Student(joe)\\wedge\
  \ Agrade(joe)\\right) $` | `$ \\exists E\\, from\\, \\#1, assuming\\, joe\\, satisfies\\\
  , (6.12) $` |\n| 3 | `Student(joe)` | 对上面第 2 条的特化 |\n| 4 | `$ \\forall x\\Big( Student(x)\\\
  to Graduated(x) $` | 给定前提 (6.13) |\n| 5 | `$ Student(joe)\\to Graduated(joe) $`\
  \ | `$ \\forall E\\, from\\, \\#4\\, above $` |\n| 6 | `Graduated(joe)` | 对第 3 条和第\
  \ 5 条应用肯定前件规则 |\n| 7 | `Agrade(joe)` | 对第 2 条的特化 |\n| 8 | `$ Graduated(joe)\\wedge\
  \ Agrade(joe) $` | 对第 6 条和第 7 条应用合取引入 |\n| 9 | `$ \\exists x\\left( Graduated(x)\\\
  wedge Agrade(x)\\right) $` | `$ \\exists I\\, into\\, \\#8\\, above $` |\n\n**注意**\
  \  \n逻辑是真理的语言。真理或其缺失，在经受逻辑检验时便得以显现。\n\n## 模糊逻辑\n\n前述讨论假设数据可以精确地表示，不带有任何歧义或不确定性。然而，这种精度对现实世界的要求过于苛刻——我们无法总是以绝对的真假或\
  \ 1 和 0 来谈论事物。在机器学习的章节（第 5 章）中的 Twitter 示例里，我们看到无法确定地表达依赖关系。例如，我们不能因为一条推文包含多媒体内容就断定它是真的。我们只能得出结论：它有很大的概率是真的。显然，这种不精确的讨论领域无法用布尔逻辑来建模，因为布尔逻辑只有“真”或“假”两种可能结果。此外，神经网络等机器学习算法可能会变得计算密集且难以处理。我们显然需要一种在不确定性条件下进行推理的方法。\n\
  \n模糊逻辑由洛特菲·扎德在 20 世纪 60 年代提出，将布尔逻辑的概念扩展到涵盖不精确性。它更接近于现实世界以及人们的思维方式。事实上，布尔逻辑是模糊逻辑的一个边界情况。我们不再进行精确建模，而是使用弹性约束来定义场景。这些弹性约束会贯穿整个推理过程。弹性约束是主观的，基于观点而非频率或精确测量。类别之间的边界是柔性的，其过渡是平滑的。一个很好的类比是：教授有时会对学生宽松一些，给答案部分分数，而不是直接给零分。像模糊逻辑这样类别边界柔性的技术，属于所谓的“软计算”范畴。\n\
  \n**注意**  \n模糊逻辑比理想化的布尔逻辑更贴近现实世界。\n\n在经典集合论中，元素的归属是明确的——要么在集合中，要么不在。在模糊理论中，元素在集合`A`中的归属是模糊的，由隶属函数`μ[A]`给出，该函数取值在\
  \ 0 到 1 之间。隶属函数表示元素属于某个集合的程度。图 6-2 和图 6-3 展示了我们在第 5 章讨论的推文示例的两种隶属函数。隶属函数根据推文获得的转发次数，将每条推文划分为三个类别（图中由细线、粗线和虚线围成的区域）：a)\
  \ 假，b) 真，c) 不确定。可以看出，这些类别之间的界限并不清晰。实际上，类别之间存在相当大的重叠。这意味着，拥有特定转发次数的推文可能为真、可能为假，或者我们无法判断其真伪。这种情况更接近现实世界。仅仅因为一条推文有特定数量的转发，并不能断定它是真还是假。因此，我们成功地建模了一个在布尔逻辑中无法实现的现实情境。\n\
  \n![A436227_1_En_6_Fig3_HTML.jpg](img/A436227_1_En_6_Fig3_HTML.jpg)\n\n图 6-3 高斯隶属函数\n\
  \n![A436227_1_En_6_Fig2_HTML.jpg](img/A436227_1_En_6_Fig2_HTML.jpg)\n\n图 6-2 梯形隶属函数\n\
  \n\n\n"
- '# 6. 模糊逻辑


  图 6-2 中的隶属函数呈梯形，具有平行的水平边。但从概率论和统计学中，我们知道许多论域中的数据呈正态分布，并由形式为 `e^(-βx²)` 的高斯函数表示，其中
  `β` 是一个正实数。例如，正态分布的概率密度函数由高斯函数 `1/(√(2πσ)) * e^(-(x-μ)²/(2σ²))` 给出，该函数属于后一种形式。因此，模糊隶属函数常采用高斯函数的形式，其图形与图
  6-3 中的图形类似。


  再举一个例子，一个与 1 近似相等的实数模糊集的隶属函数，可以用下面(6.15)中给出的高斯函数来建模。


  ```

  μ_X = e^(-β(x-1)²)

  ```


  (6.15)


  必须注意，隶属函数可以有多种形状。图 6-2 和图 6-3 是其中的两种形状，可能也是更常见的两种。梯形隶属函数的值如下表 6-11 所示。


  **表 6-11** 梯形隶属函数的值


  | `μ[X]` 的值 | 当 `x` 的值为 |

  | --- | --- |

  | `1 - (a-x)/α` | `a - α ≤ x ≤ a` |

  | `1` | `a ≤ x ≤ b` |

  | `1 - (x-b)/β` | `b ≤ x ≤ b + β` |

  | `0` | 所有其他值 |


  利用隶属函数的概念，可以扩展命题逻辑和谓词演算来对模糊性进行建模。运算符的定义如表 6-12 所示，以纳入模糊性。在表中所给的示例中，假设 `T` 是真推文的集合，`F`
  是假推文的集合。隶属函数 `μ[T]` 给出推文为真的可能性，`μ[F]` 表示推文为假的可能性。可以看出，它们的总和超过 1.0，这体现了模糊集的粒化与渐变。粒化指的是一类对象关联着一个范围，而不仅仅是单个值。渐变意味着不同类之间的转换是渐进的，并存在一些重叠。


  **表 6-12** 逻辑运算符的模糊解释


  | 运算符 | 含义 | 模糊解释 | 示例 (`μ[T] = 0.7`, `μ[F] = 0.4`) |

  | --- | --- | --- | --- |

  | `⋏` | 与（合取） | `min(μ[T], μ[F])` | 0.4 |

  | `⋎` | 或（析取） | `max(μ[T], μ[F])` | 0.7 |

  | `¬` | 非（否定） | `1 - μ_T` | 0.3 |


  将`μ[T]`和`μ[F]`限制为只能取 1 或 0，并与布尔逻辑的解释进行交叉验证，可以证明表 6-12 中的解释是正确的。例如，当 `μ_T = 1` 且
  `μ_F = 0` 时，合取结果为 0，因为 `min(μ_T, μ_F) = 0`，而析取结果为 1。表 6-8（在命题逻辑一节中给出）中的交换律、结合律、分配律、幂等律和德摩根定律，同样适用于模糊逻辑。布尔逻辑的推理机制也可以类似地扩展，以处理模糊逻辑中的不精确性。


  模糊集的一个有用度量是其熵。它在下面的(6.16)中定义。


  ```

  Entropy(T) = |T ∩ T^C| / |T ∪ T^C|

  ```


  (6.16)


  熵是类中无序或不精确性的一个指标。对于清晰集和布尔逻辑，可以很容易地看出熵为零，因为 `|T ∩ T^C| = 0`。


  > **注意**：尽管经典布尔逻辑在时间上发明得更早，但它可以被视为模糊逻辑的一个特例。


  ## 小结


  以适当的方式表示数据有助于通过推理来确定其真实性。在本章中，我们研究了如何使用经典布尔逻辑和模糊逻辑来建模现实世界并推理得出结论。我们使用了在第 5 章中使用的同一个推特示例，来演示模糊逻辑如何帮助处理推文真实性中的熵。本章提出的技术需要对大数据的表示方式进行变革。这个主题还有很大的空间可以进一步演进，以覆盖各种形式的大数据。在下一章中，我们将考察更多的方法，特别是来自信息检索领域的方法，以解决真实性问题。


  ### 练习题


