  \ 的计算挑战”，《自然》，2015 年 7 月 7 日，[`www.nature.com/news/genome-researchers-raise-alarm-over-big-data-1.17912`](http://www.nature.com/news/genome-researchers-raise-alarm-over-big-data-1.17912)\n\
