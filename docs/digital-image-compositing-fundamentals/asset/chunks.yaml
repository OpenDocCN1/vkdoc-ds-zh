  trans: '

    ### 在 GIMP 中选择 Alpha 通道数据


    在 GIMP 中，用于选择连续像素（颜色或透明度）的工具称为 `Fuzzy Select`（模糊选择）工具，而非 Photoshop 中的 `Magic Wand`（魔棒）工具。其图标非常相似，如图
    6-8 右上角蓝色高亮所示。确保选中 `RingElement.png` 图层，然后在圆环内部点击以创建选区。接着，使用 `Select ➤ Grow`（选择
    ➤ 扩大）菜单序列打开 `Grow Selection`（扩大选区）对话框。如果扩大 3 个像素，就能确保你的选区以及生成的图像数据完全覆盖在圆环下方。


    ![A978-1-4842-4060-1_6_Fig8_HTML.jpg](img/A978-1-4842-4060-1_6_Fig8_HTML.jpg)


    图 6-8.


    要确保图像完全位于圆环下方，首先在圆环内部点击，然后使用 `Select ➤ Grow`（选择 ➤ 扩大）并扩大 3 个像素。


    本质上，我是在扩大选区以确保其边缘“隐藏”在 `RingElement`（圆环元素）之后。在图 6-8 中，你可以看到选区边缘在圆环元素内侧可见；而在图 6-9
    中，它位于圆环元素下方，即使你的选区“行军蚁”看起来实际上在圆环元素上方（其实并非如此）。


    ![A978-1-4842-4060-1_6_Fig9_HTML.jpg](img/A978-1-4842-4060-1_6_Fig9_HTML.jpg)


    图 6-9.


    要反选图像中已选中的部分，请在圆环内部点击，然后使用 `Select ➤ Invert`（选择 ➤ 反选）菜单。


    在本书中，我会频繁使用这一技巧，以便你熟悉如何扩大选区，使其不正好位于合成图层的边缘，从而避免图像边缘出现微小瑕疵。


    接下来，使用 `Select ➤ Invert`（选择 ➤ 反选）菜单序列来反选选区。这样做会选中圆环下方和外部的图像部分，而非内部区域——从而保留圆环内部的内容。图
    6-9 展示了该菜单序列，以及通过 `Grow Selection`（扩大选区）对话框向外扩大 3 个像素后的内环选区。现在，你只需选中 `Niki.png`
    图层，然后点击 `Delete`（删除）键，即可移除位于圆环元素外部的背景图像像素！


    图 6-10 展示了选中 `Niki.png` 图层并按下 `Delete`（删除）键后的 GIMP 界面。正如你所见，GIMP 会在图层后面使用白色背景色，这是该程序与
    Photoshop CS6 的众多不同之处之一。


    ![A978-1-4842-4060-1_6_Fig10_HTML.jpg](img/A978-1-4842-4060-1_6_Fig10_HTML.jpg)


    图 6-10.


    你可以选中 `Niki.png` 图层并按 `Delete`（删除）键来移除背景图像。


    如果你想去除白色背景并获得透明度，需要在激活原始 3 像素扩选区的状态下，右键点击 `Niki.png` 图层，然后选择 `Add Layer Mask`（添加图层蒙版）对话框中的
    `Selection`（选区）选项。


    这会将选区转换为图层蒙版，使图层本身的背景底板变为透明，而非使用白色。不过，这将是第 7 章的主题，届时我们将更深入地探讨蒙版技术。


    随着本书内容的推进，我们会越来越频繁地使用图层蒙版，所以你将逐渐熟悉这个重要且强大的概念。我在此处提前引入，旨在让你尽早开始接触它。


    幸运的是，下一章正是相关内容，因此这又是章节主题间一次无缝的过渡，我希望在本书中始终保持这种流畅的衔接。


    ## 本章小结


    在本第六章中，我们深入探讨了数字图像 Alpha 通道的概念。图像 Alpha 值定义了在数字图像合成管线中，每个合成图层内的像素如何表现半透明度。你了解了
    Photoshop 和 GIMP 分别如何表示 Alpha 数据，以及用于显示这些数据的 `Layers`（图层）和 `Channels`（通道）面板。你还学习了如何将一个包含
    Alpha 值的 PNG32 图像对象叠加合成到一个不含任何 Alpha 值的 PNG24 图像对象（因为它只是一个底板，也称为背景图像）上。


    我们还介绍了如何在 Photoshop 中使用 `Magic Wand`（魔棒）工具以及在 GIMP 中使用 `Fuzzy Select`（模糊选择）工具选择透明像素区域。此外，我们还学习了如何扩大和反选选区，以及如何删除选中的像素，从而在我们的数字图像合成管线中创造出更多像素透明度。


    在下一章中，你将学习更多关于数字图像蒙版的知识，以及如何使用像素选择工具“提取”数字图像蒙版，并通过 Alpha 通道将其保存以供日后使用。正如你所见，本书的章节编排顺序是很有道理的！


    # 7. 数字图像的隔离：蒙版工具


    既然你已经了解了 Alpha 通道数据及其在数字图像合成管线中的使用方法，以及如何利用它来“存储”数字图像对象，那么下一步自然就是学习如何使用蒙版工具从数字图像中提取主体。这在数字图像合成行业被称为“提取蒙版”。


    Photoshop 和 GIMP 提供了多种蒙版工具，可用于实现这种像素提取的最终效果。我们将在本章中探讨其中一些工具，以及可用于从 24 位数字图像素材中提取蒙版并将其转换为
    32 位图像素材的方法和工作流程。由此产生的素材将包含 Alpha 通道。该 Alpha 通道用于隔离图像中你想要在图层堆栈中进行合成的任何主体素材。


    ## 蒙版：隔离与提取像素


    蒙版是从图像中提取不规则形状像素区域的过程，通常用于数字图像合成。通常，期望的结果是将这些像素与另一张图像组合，以实现某种艺术效果或特殊特效。这通过图层来实现，我们将在第
    8 章中详细介绍图层，以及更高级的功能，例如 Porter-Duff 混合和传输模式。所有这些功能都利用了这些复杂的、多模态操作的数字图像合成软件包，例如我们本书所使用的这些。我建议你获取并掌握它们。


    我不打算深入探讨关于蒙版的大量术语、理论等等，因为它更多地关乎工作流程以及这些软件包提供的各种以多种不同方式选择像素的工具。


    如果你不想学习手动创建图像蒙版，可以购买一块绿幕或蓝幕，在幕前拍摄你的主体（对象），然后使用流行的插件之一来自动生成蒙版。

