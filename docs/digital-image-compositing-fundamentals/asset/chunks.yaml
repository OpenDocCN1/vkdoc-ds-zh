- fmt: '# Practice Makes Perfect: Keeping It All in Your Mind


    Using digital image compositing software might look easy as you look over another
    operator’s shoulder, because you cannot see what is going on inside of their mind.
    However, in your endeavor to master these types of software packages, you will
    find that it is a challenge to keep all of these operation modes straight in your
    mind, in real time, as you attempt to get the software package to function in
    exactly the way you are intending it to, in order to accomplish the project objective—that
    is, to achieve your desired visual end result.


    What this means is that you’ll need to consciously start to practice keeping track
    of all of these different operational modes, and how they affect one another,
    as part of your learning process, if you want to truly master any digital image
    compositing software package.


    As you have seen already during the book, all of these digital image editing and
    compositing software package offerings process their operational modes pipeline
    differently!


    This is why in this book I have chosen to show the different work processes for
    both of the most popular image compositing software programs—the open source program,
    GIMP, and paid software program, Photoshop—which ultimately achieve the same results.
    In this way, the book covers a much larger user base and also drives home a modal
    operation point, since these two packages use different work processes.


    ## Modal Operation: A Photoshop Example


    Let’s continue to make your current compositing project more advanced, and this
    time look specifically at how a modal operation approach is being undertaken as
    we go along. We will learn about some new features and tools within Photoshop
    and about how to turn the pixels inside of the `RingElement` into color, while
    keeping the pixels outside of the `RingElement` in black and white.


    Continuing to implement more advanced features will allow you to continue to see
    how using the modal operation is important in getting the desired results in your
    digital image compositing software package; in this case, Photoshop CS6.


    ### Photoshop Magic Wand Tool: Modal Selection Sets


    Open up your [Chapter 9](#A978-1-4842-4060-1_9_Chapter.html) Photoshop file `Chapter9usingModes.psd`,
    if it’s not open already. Then, click the `RingElement` layer to set the layer
    you will be operating on. Next, click the `Magic Wand` tool, shown as selected
    on the top left toolbar in Figure [10-1](#A978-1-4842-4060-1_10_Chapter.html#Fig1).
    Now, click inside the `RingElement` in your image composite to select that area.
    Use the `Select ➤ Modify ➤ Expand` menu sequence to open the `Expand Selection`
    dialog, and then expand the selection by 9 pixels, so that the selection is halfway
    underneath the `RingElement`.


    ![A978-1-4842-4060-1_10_Fig1_HTML.jpg](A978-1-4842-4060-1_10_Fig1_HTML.jpg)


    Figure 10-1. To begin your modal operation, select the inside of the ring and
    expand it by 9 pixels


    If you wanted to save the selection as an alpha channel, you would use `Select
    ➤ Save Selection`, and name your selection `RingSelection`.


    Now that you have a selection area lying under the `RingElement`, since the `Niki`
    layer is your back plate, and at a lower compositing order than your `RingElement`
    layer is in the layer stack, it is time to learn how to apply this selection as
    a `Layer Mask`, to, or for, your `Black & White Adjustment` layer.


    ### Photoshop Layer Mask: Delete Default Layer Mask


    Start by selecting the orange adjustment layer, as shown in Figure [10-2](#A978-1-4842-4060-1_10_Chapter.html#Fig2),
    and right-click on the white `Layer Mask` Preview icon at the right side of the
    adjustment layer. Then, use the `Delete Layer Mask` menu option to remove the
    white layer mask. This layer mask selects the entire image for black-and-white
    adjustment processing, since every pixel in the mask is fully on (white or `#FFFFFF`
    value, which means that there is a full adjustment application for each pixel
    in the entire image). What we’re doing here is deleting the default layer created
    by Photoshop, so that in the next section we can instruct Photoshop to make a
    new layer mask using the selection set that we created in the previous section
    using the `Magic Wand` in conjunction with the `RingElement` layer.


    ![A978-1-4842-4060-1_10_Fig2_HTML.jpg](A978-1-4842-4060-1_10_Fig2_HTML.jpg)


    Figure 10-2. To remove the white layer mask set up by Photoshop, right-click the
    adjustment layer mask and delete it


    There’s another work process that you can use to achieve what we’re about to do
    in the next section—replace the default (all pixels selected) layer mask using
    your custom selection set inside the `RingElement`. This work process would involve
    selecting an inside area of your `RingElement`, as you did in the previous section,
    before you apply the `Layer ➤ New Adjustment Layer` work process. If you do things
    in this order, your selection will then appear as the layer mask that is shown
    in the adjustment layer automatically.


    ### Custom Layer Mask: Add Selection as Layer Mask


    The orange adjustment layer should still be selected at this point, as seen in
    Figure [10-3](#A978-1-4842-4060-1_10_Chapter.html#Fig3), with an additional square
    around a `Black & White Adjustment` icon showing that the layer mask is empty.
    To add the selection set to the adjustment layer as its mask, you would hold down
    the `Alt` key on the keyboard and click the `Add Layer Mask` icon at the bottom
    of your `Layer` palette. This will make the inside of the `RingElement` show `Niki`
    in color and show the outside of the `RingElement` in black and white. If you
    wanted to get the reverse effect—that is to reverse the mask that is generated—simply
    do not hold down the `Alt` key, and then click the `Add Layer Mask` icon.


    ![A978-1-4842-4060-1_10_Fig3_HTML.jpg](A978-1-4842-4060-1_10_Fig3_HTML.jpg)


    Figure 10-3. To add the selection set to the adjustment layer, hold down the `Alt`
    key and click the `Add Layer Mask` icon


    Figure [10-3](#A978-1-4842-4060-1_10_Chapter.html#Fig3) also shows the pop-up
    tool tip at the bottom right corner of the screen, telling you which icon is your
    `Add Layer Mask` icon. The other icons can be used to access `Layer Style` (`fx`)
    and things such as creating a new layer, deleting a layer, locking a layer, and
    other core layer functions.


    Mouse over these icons yourself if you want to memorize which of them perform
    which layer functions, something you should do if you want to become a professional
    digital image compositor.


    As you can see in Figure [10-4](#A978-1-4842-4060-1_10_Chapter.html#Fig4), your
    adjustment layer now shows your selection as its `Layer Mask`, and, the inside
    of your ring element is now using colored pixels whereas the outside is using
    black-and-white (grayscale, or, desaturated) pixels.


    ![A978-1-4842-4060-1_10_Fig4_HTML.jpg](A978-1-4842-4060-1_10_Fig4_HTML.jpg)


    Figure 10-4. Convert your selection to an adjustment layer mask


    Notice that we’ve done all the compositing work with only four layers, and yet,
    we have applied half a dozen or more special effects.


    Now, let’s take a look at how this work process should be done using modal operations
    native to GIMP 2.8.14.'
