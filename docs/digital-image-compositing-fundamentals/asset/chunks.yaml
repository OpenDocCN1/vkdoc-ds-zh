- fmt: '# Subtractive Color: Print Using CMYK Color Plates


    Modern color printers use at least the four ink colors in `CMYK` allowing for
    the creation of a wide range of different colors. High-end inkjet printers are
    coming out with six- or eight-color ink cartridge models that create more color
    variations.


    Printer inks use the subtractive color model, according to which inks remove color
    from each other—that is, two colors darken the other (by removing the light inks)
    when combined, which is why it is called a “subtractive” color process.


    For example, the cyan and magenta inks create purple, which is darker than either
    source color ink is by itself.


    A subtractive color model produces fewer colors than an additive color model,
    which I will discuss next. This is quite logical if you think about it, because
    subtraction takes away, whereas addition adds more. In Photoshop, as well as GIMP,
    your color modes can be accessed using an `Image ➤ Mode` menu sequence and a submenu
    that contains all of the supported color modes. The path is shown in Figure [4-1](#A978-1-4842-4060-1_4_Chapter.html#Fig1)
    along with a CMYK warning dialog. The warning dialog in the lower-right corner
    advises you that you are about to convert from an `RGB` to a `CMYK` color profile
    and suggests that more control over the conversion can be exercised using an `Edit
    ➤ Convert to Profile` menu sequence.


    ![A978-1-4842-4060-1_4_Fig1_HTML.jpg](A978-1-4842-4060-1_4_Fig1_HTML.jpg)


    Figure 4-1.


    You can use an `Image ➤ Mode` menu sequence to set color mode


    Generally you will want to work in an `RGB` color profile as `RGB` has 16,777,216
    colors to work with, whereas `CMYK` would have significantly fewer colors, and
    because smart phones, iTV sets, tablets, e-book e-readers, laptops, notebooks
    or netbooks do not support the `CMYK` color model.


    Just like you want to match resolution and aspect ratio pixel for pixel, within
    each of these pixels, you also want to match those color channels which are supported
    for that device (printer or display) that you are creating your digital imagery
    for.


    As you can see in Figure [4-2](#A978-1-4842-4060-1_4_Chapter.html#Fig2), the dialog
    accessed by this menu sequence allows you to select predefined color profiles,
    which are a standard in the industry to create different applications such as
    newspaper print (as selected) or sheet-fed print.


    ![A978-1-4842-4060-1_4_Fig2_HTML.jpg](A978-1-4842-4060-1_4_Fig2_HTML.jpg)


    Figure 4-2.


    A `Convert to Profile` dialog offers a profile selector


    It is important to note that digital cameras use the `RGB` color mode to capture
    digital image data using something called a charge-coupled device, or `CCD` for
    short. This means that data coming into your digital image editing and compositing
    software package is in the `RGB` color mode, so it is logical to also edit it
    in this color mode, as a conversion to `CMYK` will cause your image to lose some
    colors.


    For these reasons, most digital image compositors use an `RGB` color model for
    doing their image compositing work and then convert to `CMYK` before they print.
    In this way, you can produce both a `CMYK` and an `RGB` representation of your
    current digital image compositing project. This is an advantage, as your image
    compositing work can be used on displays as well as printed.


    This conversion process to print being used less and less by image compositors
    might account for `GIMP` not having moved to add a full `CMYK` color model to
    its software package. This is especially true since the age of digital cameras
    and display devices has greatly reduced the public’s reliance on analog and print
    media forms. This trend continues each and every day, as more smart phones, smart
    watches, tablets, e-readers, and iTV sets explode into the current marketplace.


    As you can see in Figure [4-3](#A978-1-4842-4060-1_4_Chapter.html#Fig3), GIMP’s
    `Image ➤ Mode` submenu does not have subtractive color mode support. If you do
    want to use `GIMP` for `CMYK` color models and print work, though, there’s a way
    around this. A plug-in called `Separate` is available for `GIMP` that adds the
    `CMYK` color mode support, and `AUR` offers an advanced version of this plug-in
    called `Separate+` (Plus) for Linux users. It can be found at the following URL:
    [`https://aur4.archlinux.org/`](https://aur4.archlinux.org/).


    ![A978-1-4842-4060-1_4_Fig3_HTML.jpg](A978-1-4842-4060-1_4_Fig3_HTML.jpg)


    Figure 4-3.


    The GIMP `Image ➤ Mode` menu only supports additive color


    These plug-ins can separate an `RGB` image into `CMYK`, offer color management
    using `ICC` profiles and `LCMS`, allow the soft-proofing of colors, and allow
    you to attach the `ICC CMYK` profile to your color-separated digital image files.


    The `Separate+` plug-in has the same features as `Separate`, but it also has the
    ability to convert `RGB` profiles to other `RGB` profiles and offers duotone support.


    # Additive Color: Display Using RGB Color Channels


    `LED`, `LCD`, and `OLED` displays, on the other hand, use an `RGB` additive color
    model, in that they use light instead of ink. An advantage of using light, or
    additive color, is that more color is possible. If you have ever seen colors coming
    out of a prism or in a rainbow, you realize that color produced using light is
    nothing short of spectacular, and is something ink simply can’t reproduce. This
    is why the book focuses primarily on `RGB` color.


    Additive color is the opposite of subtractive color, and so, whereas combining
    red and green ink gives you a dark purple color, combining red and green light
    gives you a yellow color!


    Pixel color is defined using three colors of light: red, green, and blue; hence
    “`RGB`”. These colors are present in varying amounts in each pixel. Display screens
    utilize additive colors, by summing together the wavelength of light for each
    `RGB` color plane (or channel). This color mode is utilized in popular `LED`,
    `LCD`, and `OLED` displays used in tablets, e-readers, smart watches, smart phones,
    iTV sets, netbooks, PCs, and laptops.


    In Figure [4-4](#A978-1-4842-4060-1_4_Chapter.html#Fig4), I have turned on `Use
    Color Channel Color` mode in the Photoshop Preferences dialog. Now, by selecting
    the eye icon on the left side of the color channel, you can see the green intensity
    data values using the Green channel’s color.


    ![A978-1-4842-4060-1_4_Fig4_HTML.jpg](A978-1-4842-4060-1_4_Fig4_HTML.jpg)


    Figure 4-4.


    The Green color channel, selected in Photoshop CS6


    GIMP uses the same color channel palette, using an icon that mimics a stacked
    layer of colored vellum. As shown in Figure [4-5](#A978-1-4842-4060-1_4_Chapter.html#Fig5),
    I have turned on the Green and Red channels by using the same eye icons, to produce
    the Green + Red = Yellow additive color summary effect. You can selectively apply
    effects and specifications to desired color channels.


    ![A978-1-4842-4060-1_4_Fig5_HTML.jpg](A978-1-4842-4060-1_4_Fig5_HTML.jpg)


    Figure 4-5.


    The Red and Green channels selected in GIMP


    This separation of color channels into their own modal palette makes image-editing
    software more powerful by allowing users to isolate color by individual channels.


    The ability to work on, and apply effects to, individual color channels is an
    important and powerful feature of digital image editing software.


    Additive color can be used to create tens of millions of different color values.
    We are going to take a look at the mathematics behind how this can happen in the
    next section.'
