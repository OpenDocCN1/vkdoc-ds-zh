- fmt: 'To save your file as a JPEG, enter `filename.jpg`, select desired options,
    and click the **Export** button.


    The **Optimize** and **Progressive** options can be used to make your JPEG file
    size smaller. You can save a thumbnail image for your desktop using the **Save
    Thumbnail** option. You can also apply Blur with the **Smoothing** slider. I used
    a value of `0.08` to apply a blur, which you cannot see but which will improve
    compression.


    You can even specify advanced **Subsampling** configurations, and you can also
    specify which DCT (Discrete Cosine Transform) method will be utilized by the JPEG
    Codec’s primary algorithm.


    Next, let’s replicate what we did with Photoshop CS6 by saving out a PNG-32 image
    with the *RingElement* and *Niki* model photograph in the center on top of a transparent
    alpha channel.


    Since your GIMP `2.8.14` digital image composite utilizes a different compositing
    structure than your Photoshop composite does, we’ll need to use a different work
    process to accomplish this objective. Let’s get into that next, and then we will
    be finished with our data footprint optimization for this chapter.


    ## Creating a Masked PNG-32 Object in GIMP


    In order to create a masked PNG-32 object, the first thing you need to do is to
    transfer and invert the mask used on the second and third layer (I tried to drag
    and drop it, but no such luck), and apply it to the first (bottom) layer.


    The work process to do this is to select either your second or third layer, and
    then right-click on the layer and select the **Mask to Selection** option, as
    shown in Figure [13-14](#A978-1-4842-4060-1_13_Chapter.html#Fig14).


    ![A978-1-4842-4060-1_13_Fig14_HTML.jpg](A978-1-4842-4060-1_13_Fig14_HTML.jpg)


    **Figure 13-14.** To transfer a layer mask to an interim selection set, select
    the Layer Mask and use the **Mask to Selection** option.


    We will have to use the following work process to bridge a layer mask across from
    the *Filter* and *Black & White* layers to the `Niki.png` color layer that does
    not yet have a layer mask: **Mask to Selection**, **Invert Selection**, **Select
    a Target Layer**, and **Add Layer Mask (Selection to Mask)**.


    Next, use a **Select ➤ Invert** menu sequence and invert the selection, as seen
    in Figure [13-15](#A978-1-4842-4060-1_13_Chapter.html#Fig15).


    ![A978-1-4842-4060-1_13_Fig15_HTML.jpg](A978-1-4842-4060-1_13_Fig15_HTML.jpg)


    **Figure 13-15.** To invert a mask (as a selection) use **Select ➤ Invert**.


    The source layer that you have selected, either *Filter Special Effect* or *Niki
    Black & White*, makes no difference, as they both have the same layer mask that
    you can turn into the selection prior to the **Invert Selection** operation. However,
    you must select the `Niki.png` layer before you use **Add Layer Mask**.


    It is important to note that your selections are held in system memory and are
    not attached to any particular layer—not until you use the **Add Layer Mask**
    to attach them, that is!


    Now you are ready to add your layer mask. To do this, select your `Niki.png` layer,
    and then right-click and select the **Add Layer Mask** option. In the dialog that
    comes up, check off the **Selection** option and click the **Add** button, shown
    in Figure [13-16](#A978-1-4842-4060-1_13_Chapter.html#Fig16). This will turn the
    inverted selection into a layer mask that looks like an exact opposite of the
    other two layer masks, which are black circular areas on a white background.


    ![A978-1-4842-4060-1_13_Fig16_HTML.jpg](A978-1-4842-4060-1_13_Fig16_HTML.jpg)


    **Figure 13-16.** To add your layer mask, select the `Niki.png` layer and right-click
    on the selected layer and select **Add Layer Mask**.


    As you can see in Figure [13-17](#A978-1-4842-4060-1_13_Chapter.html#Fig17), this
    gives you a result you were looking for—the color photographic model image inside
    the wine metal ring element on a transparency background—which is being created
    with alpha channel data. If you export with a `.png` extension, you’ll get a PNG-32
    image, just as you desired.


    ![A978-1-4842-4060-1_13_Fig17_HTML.jpg](A978-1-4842-4060-1_13_Fig17_HTML.jpg)


    **Figure 13-17.** After turning your inverted selection into a layer mask, the
    `Niki.png` layer mask is now the exact opposite of layers two and three as shown
    selected in the **Layers** palette.


    We’ll continue to look at exporting files during [Chapter 14](#A978-1-4842-4060-1_14_Chapter.html),
    when we go over how to “bridge” digital image compositing with various open source
    programming languages and platforms.


    ## Summary


    In this thirteenth chapter, we reviewed data footprint optimization during the
    **File Save for Web** and **File Export As** work processes for Photoshop and
    GIMP. We looked at how to do these work processes for the three most widely used
    digital image file formats—PNG, GIF, and JPEG. You first learned how to optimize
    for these files in Photoshop, then you saw how layer visibility in an image composite
    can affect what is saved in the file format, and finally you found out about the
    same exact work processes that you can utilize with GIMP `2.8.14`.


    In the final chapter, you will learn more about some of the important considerations
    involved with bridging your work in your digital image compositing software packages,
    looking at some of the most popular coding environments, such as Python, Java,
    JavaFX, HTML5, CSS3, JavaScript, and Android Studio.


    # 14. The Automation of Digital Imaging: Programming


    Now that we have looked at how to create professional digital images using the
    powerful features in both of the digital image compositing software packages and
    to export them to the most popular file formats, it’s time to take a look at those
    programming platforms themselves, just in case you want to take your digital image
    compositing career to the next level. In this chapter, you will learn about the
    internal programming languages used for GIMP (Python) and Photoshop (JavaScript)
    as well as external programming languages that support digital imaging such as
    C# (.NET); ObjectiveC (iOS); Java (Android Studio, Linux); JavaFX; JavaScript;
    HTML5; and CSS3 (WebKit Browsers, HTML5 OSs).


    This is important information to know if you plan to use the digital imagery from
    this book’s compositing concepts and work processes in your own programming projects,
    open-software development platforms, or if you have any interest in learning more
    about adding programming to your vast repertoire.


    The platforms that we will cover in this chapter run a majority of the consumer
    electronics industry’s hardware devices and include Java (Android Studio and WebKit);
    JavaFX (Android, iOS, Windows, Linux, Mac OS X, Solaris); and JavaScript with
    CSS3 and HTML5 scripting (WebKit browsers).


    This chapter is not going to teach you programming—that would take a number of
    books (and coding experience) to do—but it will expose you to what’s possible
    if you extend the journey you are on from digital image compositing to new media
    software development. Everything that we will be covering in the chapter is free
    for commercial use, and you can easily download Android Studio (IntelliJ), Java
    and JavaFX (NetBeans), HTML5 (NetBeans), and Python (Eclipse).


    We will start with the internal scripting languages for Photoshop and GIMP, and
    then cover the popular open platforms.


    ## Internal Scripting Languages: Automation


    Both Photoshop and GIMP include several scripting languages for automating work
    processes within their software packages. This automation is traditionally referred
    to in the computer industry as “batch processing”—a term which comes from the
    old mainframe days where data was input during the day by employees and then batch
    processed at night by the computers while the employees got some sleep. I will
    cover the various scripting languages used by Photoshop and GIMP in these first
    two sections of the chapter, and then look at other languages that support digital
    image compositing pipelines over the rest of the chapter. This will show you what
    is available to bridge your digital compositing pipeline from digital imaging
    software to programming.'
