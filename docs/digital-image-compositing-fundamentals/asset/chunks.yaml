- fmt: '# Digital Image Compositing Fundamentals


    `Digital Image Compositing Fundamentals` is intended for digital photographers;
    multimedia producers; 2D-application developers; 2D or 3D web site developers;
    user interface or user experience designers; social media users of image-centric
    web sites and/or apps, including `Instagram`, `Pinterest`, `Facebook`, `LinkedIn`,
    `XING`, `YouTube`, and similar; and just about anyone interested in generating
    high-quality digital imagery or special effects delivered in popular `PNG`, `JPEG`,
    `GIF` and `animGIF` file formats.


    The book covers digital image editing and compositing; in the early chapters,
    that equates to fundamentals: proper terms, topics, concepts, and definitions.
    The subsequent chapters each build on the knowledge of the previous chapter. So,
    by the time we get to the later chapters in the book, our readers should be creating
    some fairly advanced digital imagery compositing pipelines, by using alpha channels,
    masks, and blending modes, special effects, adjustment layers, and the like.


    There is even coverage at the end of this book on data footprint optimization
    as well as on creating digital image compositing pipelines that use open source
    platforms such as `Java`, `JavaFX`, `HTML5`, `CSS3`, `JavaScript`, `Python`, and
    `Android`.


    [Chapter 1](#A978-1-4842-4060-1_1_Chapter.html) focuses on one of the foundations
    of digital imaging, the pixel, and [Chapter 2](#A978-1-4842-4060-1_2_Chapter.html)
    looks at the size of digital imaging, or resolution. [Chapter 3](#A978-1-4842-4060-1_3_Chapter.html)
    covers aspect ratio and the shape of digital imaging, and [Chapter 4](#A978-1-4842-4060-1_4_Chapter.html)
    takes on digital imaging color theory.


    As we get into [Chapter 5](#A978-1-4842-4060-1_5_Chapter.html), we take on the
    digitization of digital images using color depth, and [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html)
    goes on to cover digital image transparency and the alpha channel. [Chapter 7](#A978-1-4842-4060-1_7_Chapter.html)
    looks at isolating areas in digital images using masking tools, and [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html)
    addresses organizing the digital image composite by using layers.


    [Chapter 9](#A978-1-4842-4060-1_9_Chapter.html) starts to get into more advanced
    concepts, like blending modes, and [Chapter 10](#A978-1-4842-4060-1_10_Chapter.html)
    discusses the modal operational nature of digital image compositing software packages,
    such as `GIMP` and `Photoshop CS6`. [Chapter 11](#A978-1-4842-4060-1_11_Chapter.html)
    covers the installation and usage of plug-ins, and [Chapter 12](#A978-1-4842-4060-1_12_Chapter.html)
    discusses the finer points of the digital image compositing pipeline using both
    `Photoshop CS6` and `GIMP 2.8.14`.


    In [Chapter 13](#A978-1-4842-4060-1_13_Chapter.html), we look at data footprint
    optimization and, finally, in [Chapter 14](#A978-1-4842-4060-1_14_Chapter.html)
    we review how computer programming languages factor into image compositing, both
    inside of `GIMP` and `Photoshop` and with popular open source platforms such as
    `Python`, `Java`, `JavaFX`, `Android`, `JavaScript`, `CSS3`, and `HTML5`.


    If you''re interested in digital photography or in digital imaging and want to
    learn the fundamentals, and how everything works in the digital domain from pixel
    to compositing pipeline, this is the digital image editing and special effects
    book for you. I even show how to do everything with free digital imaging software,
    `GIMP 2.8.14`, so your only expense will be this book.


    Chock full of tips, tricks, tools, topics, terminology, techniques, and work processes,
    `Digital Image Compositing Fundamentals` can help you to transition from a digital
    imaging amateur to a knowledgable professional where your digital image compositing
    pipeline is concerned.


    ## Acknowledgments


    I would like to acknowledge all my fantastic editors and their support staff at
    Apress, who worked those long hours and toiled so very hard on this book to make
    it the ultimate digital image compositing fundamentals book title currently on
    the market.


    I thank:


    Steve Anglin for his work as the Acquisitions Editor for the book and for recruiting
    me to write development titles at Apress covering widely popular open source content
    development platforms (`Android`, `Java`, `JavaFX`, `HTML5`, `CSS3`, `JS`, `GIMP`,
    etc.).


    Matthew Moodie for his work as the Development Editor on the book and for his
    experience and guidance during the process of making the book one of the leading
    image compositing titles.


    Mark Powers for his work as the Coordinating Editor for the book and for his constant
    diligence in making sure that I either hit my chapter delivery deadlines or far
    surpassed them.


    Jana Weinstein for her work as the Copy Editor on this book, for her careful attention
    to minute details, and for conforming the text to current Apress book writing
    standards.


    Chád Darby for his work as the Technical Reviewer on the book and for making sure
    that I didn’t make technical mistakes.


    Anna Ishchenko for her work as a Book Cover Designer for the book and for creating
    the graphic design for the book.


    Finally, I’d like to acknowledge Oracle for acquiring Sun Microsystems and continuing
    to enhance `Java` and `JavaFX`, which allows their `Java` and `JavaFX` to remain
    the premiere open source programming languages, and allows digital image compositing
    pipelines to be written in `Java` code, taking this industry to the next level.'
