  trans: '

    # 像素混合：波特·达夫模式理论


    我在此将这些像素传输和像素混合模式称为“波特·达夫”，因为我是程序员，这样你就能知道它们是什么以及从何而来。尽管在安卓（编程）中是这样称呼的，但在 Photoshop
    和 GIMP 中并非如此，所以这个术语实际上只是你在行业交流中用来显得自己知识渊博的谈资。这些模式通常称为混合模式、传输模式，有时也称为图层模式或合成模式。


    波特·达夫模式应用于数字成像软件中，使用设置为其中一种模式的图层——默认为“正常”。正如你所料，默认的像素组合（混合）模式根本不使用任何算法，因此保持正常设置意味着不应用任何像素混合算法。


    但值得注意的是，Alpha 通道数据仍然会被应用，因为它定义了半透明度，并且始终会纳入你的合成管线，无论你的混合模式是设置为正常还是其他某种像素混合算法。


    Alpha 通道定义了直线（正常）不透明度，并不是一种通过混合像素颜色来改变其实际颜色值的复杂算法方法。Alpha 允许在图像图层和其下方内容之间进行逐像素淡入淡出，因此它使用的是简单的数学方法，至少与这些混合和传输模式中使用的复杂算法相比是这样。


    这意味着你可以利用 Alpha 通道在逐像素基础上控制混合模式的应用位置，并且拥有 256 个级别（8 位）的控制能力来调节这种混合的应用程度。因此，你的
    Alpha 通道和不透明度滑块（同时控制所有像素的淡入淡出，位于图 9-1 屏幕右上方）可以用来微调混合模式的应用效果。


    ![A978-1-4842-4060-1_9_Fig1_HTML.jpg](img/A978-1-4842-4060-1_9_Fig1_HTML.jpg)


    图 9-1.


    如果你在 Photoshop 中选择模式下拉菜单，可以查看所有可用的模式


    正如你将看到的，这些图层变得越来越复杂，因为你必须记住越来越多的东西，例如 Alpha 通道、混合模式、图层不透明度、图层蒙版、图层样式（特殊效果子图层）、图层调整以及构成像素数据的颜色通道等，仅举几例。


    这就是为什么我使用“模态”一词来描述如何在数字图像合成软件和 Photoshop 工具中工作。合成预览中发生的情况直接与许多操作模式的设置相关，例如你正在使用的工具、该工具的选项、当前选中的图层、选中的混合算法等等。我们将在下一章探讨数字成像软件的模态性，因为意识到所有这些模式是你作为合成师成功的关键。


    ## Photoshop 混合：支持的混合模式


    让我们从第 8 章打开 Photoshop 文件，如果它尚未在你的桌面上打开的话。打开后，单击“图层”面板顶部的“混合模式”菜单（向下箭头展开菜单），如图
    9-1 所示。正如你将看到的，Photoshop 有五组混合模式。最上面的是“正常”（未应用模式）和“溶解”（随机像素颜色传输）模式，因为它们不使用任何像素混合算法。下一部分描述了产生变暗效果的模式；再下一部分概述了产生变亮效果的模式；随后列出了混合像素以提供特殊效果的模式；再后面概述了提供基本数学布尔算法的模式。最后一部分描述了将通过传输像素颜色属性来创建特殊效果的模式。


    如图 9-1 所示，我选择了“滤色”模式，以便你可以查看此效果，它会将彩色文本变成一种滤色层，从而使其背后图层的某些细节可以作为彩色文本对象的一部分显示出来。这些模式可以为你的图像合成管线增添一些非常微妙而专业的细节，以及一些疯狂的特殊效果，在本章中我们查看其中一些算法混合和传输模式时，你将会看到这一点。


    Photoshop 有 26 种混合模式算法。接下来让我们看看 GIMP，了解该程序支持多少种混合模式用于数字图像合成。


    ## GIMP 混合：支持的混合模式


    首先，使用 GIMP 打开 `Chapter8usingLayers.xcf` 文件，如图 9-2 所示。你会注意到，GIMP 的混合模式功能比 Photoshop
    少，但图像合成所需的核心混合和传输模式全部具备。它们以不同的方式分组，包括变亮、变暗、混合、布尔，然后是颜色类模式，可用于创建图像效果。与在 Photoshop
    CS 中访问它们的方式类似，这些混合模式可以在 GIMP 的“图层”菜单顶部访问。我在图 9-2 中展开了 GIMP 的“模式”菜单，以便你可以看到 GIMP
    当前支持的二十种模式（比 Photoshop 少六种）。我猜测另外六种算法是受专利保护的，在那些专利过期之前不会出现在 GIMP 3.0 中。


    ![A978-1-4842-4060-1_9_Fig2_HTML.jpg](img/A978-1-4842-4060-1_9_Fig2_HTML.jpg)


    图 9-2.


    如果你在 GIMP 中选择模式下拉菜单，可以查看所有可用的模式


    除了“正常”（不应用混合模式算法）之外，最常用的模式包括“正片叠底”模式（我们将在下一节中使用它来应用阴影），以及“滤色”、“叠加”、“柔光”和数学布尔传输模式（“相加”、“减去”、“划分”和“差值”）。了解这些模式效果的最佳方法就是尝试使用它们！你可以使用彩色文本对象图层来尝试，也可以（或者）结合你的
    `RingElement` 对象图层一起使用。


    对每个图层（或两个图层）尝试不同的模式，以观察它们如何与黑白 Niki 图层以及真彩色 Niki 图层交互。要在 Photoshop 中获得真彩色图层，请关闭调整图层的可见性（眼睛图标）。对于
    GIMP，两个 Niki 图层也可以使用该图层可见性（眼睛）图标进行切换开启和关闭。


    正如你所见，GIMP 包含了创建数字图像合成效果所需的所有基础模式。我承诺过要向你展示如何在 GIMP 中创建投影效果，那么接下来我们就使用“正片叠底”模式来搞定它。

    '
- fmt: '## Using Modes in GIMP: Multiplying a Shadow


    Let’s continue building the composite you started in [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html)
    and use the `Chapter8usingLayers` file in GIMP, shown in Figure [9-2](#A978-1-4842-4060-1_9_Chapter.html#Fig2),
    which we just opened. Start by clicking the COMPOSITING Text layer to select it,
    and then use the `Layer ➤ Duplicate Layer` menu sequence to duplicate it. You
    could also simply right-click the Text layer and select `Duplicate Layer` if you
    want to use a faster context-sensitive menu shortcut. Select the duplicate layer,
    name the layer `Shadow`, click the `Text` tool, and use the color picker to set
    the color to black.


    If your text color picker is not showing the gold color, be sure that you have
    clicked the text object itself in your composite image view on the left. After
    you click on the actual text object in your image compositing pixel display area,
    GIMP will then allow you to click the color swatch dialog, and drag the color
    picker crosshair, from gold over to black.


    As you can see in Figure [9-3](#A978-1-4842-4060-1_9_Chapter.html#Fig3), I’ve
    named the layer, set its color to black, and finally right-clicked it and selected
    `Discard Text Information`. This menu option rasterizes the black text so that
    it becomes pixel data, which you will turn into a drop shadow over the rest of
    the work process.


    ![A978-1-4842-4060-1_9_Fig3_HTML.jpg](A978-1-4842-4060-1_9_Fig3_HTML.jpg)


    Figure 9-3. To turn the black text into pixel data, first right-click the selected
    `Shadow` layer and then click `Discard Text Information`


    Next, click the `Move` tool, shown as selected in the upper-right-hand corner
    of Figure [9-4](#A978-1-4842-4060-1_9_Chapter.html#Fig4), and then choose `Move
    the Active Layer` in the Tool Options area located underneath the tools palette.


    ![A978-1-4842-4060-1_9_Fig4_HTML.jpg](A978-1-4842-4060-1_9_Fig4_HTML.jpg)


    Figure 9-4. You can use the `Move` tool with arrow keys to offset the black text
    by 2 pixels


    Click the `Shadow` layer to select it, and then the black text in the image preview
    area, to show the `Move` tool what it is that you wish it to move. Be sure to
    just click, not click and then drag, as this will move the black text too much.


    You can then use the arrow keys to move the text object, or any selected object
    in GIMP, by one pixel at a time. This is a useful feature, so be sure to practice
    using it.


    Now, hit the left arrow key twice and the up arrow key twice. This will offset
    your black text from your gold text, as you can see in Figure [9-4](#A978-1-4842-4060-1_9_Chapter.html#Fig4).


    You are starting to see how this work process could yield a plethora of drop shadow
    possibilities—that is, once you apply a blur effect to make it look more like
    a drop shadow, of course! First, we have a masking step to go through, however,
    before we apply the blur filter, to make the shadow look more photo-realistic.


    Now, right-click on the `Compositing` layer, to select it (I’ve renamed the layer
    in sentence case letters so that it fits in the layer), and then choose the `Alpha
    to Selection` option as shown in Figure [9-5](#A978-1-4842-4060-1_9_Chapter.html#Fig5)
    (and be sure to read the pop-up info for hints, tips and shortcuts).


    ![A978-1-4842-4060-1_9_Fig5_HTML.jpg](A978-1-4842-4060-1_9_Fig5_HTML.jpg)


    Figure 9-5. Selecting the `Compositing` layer and using the `Alpha to Selection`
    option


    > Tip: If you mouse over any of the GIMP user interface components, such as menu
    items and tool icons, you’ll get yellow pop-up information regarding what that
    GIMP function does, as well as additional tips, tricks and shortcuts. This is
    a great way to learn the software.


    Next, select your `Shadow` layer, and use the `Edit ➤ Clear` menu sequence, to
    remove the majority of the pixels, using the selection that you culled from your
    `Compositing` text layer, as shown in Figure [9-6](#A978-1-4842-4060-1_9_Chapter.html#Fig6).
    This is an example of a “modal operational move,” as I call it, where you select
    a layer and the tool that is executed after selection becomes of tantamount importance.


    ![A978-1-4842-4060-1_9_Fig6_HTML.jpg](A978-1-4842-4060-1_9_Fig6_HTML.jpg)


    Figure 9-6. To remove the majority of the pixels, select the `Shadow` layer and
    use the `Edit ➤ Clear` sequence


    Then, remove your black text selection (marching ants), using a `Select ➤ None`
    menu sequence, and select your `Shadow` layer, so you can apply your blur.


    Use the `Filter ➤ Blur ➤ Gaussian Blur` menu sequence, and open the Gaussian Blur
    dialog, as shown in Figure [9-7](#A978-1-4842-4060-1_9_Chapter.html#Fig7). Apply
    2 pixels of blur, in both the X and Y dimensions. Make sure that the chain icon
    is locking the aspect ratio for this dialog.


    ![A978-1-4842-4060-1_9_Fig7_HTML.jpg](A978-1-4842-4060-1_9_Fig7_HTML.jpg)


    Figure 9-7. To blur the shadow edge, use the `Filter ➤ Blur ➤ Gaussian Blur` menu
    sequence


    Click the OK button, to apply your Gaussian blur setting to the `Shadow` layer,
    and the shadow will immediately look more realistic.


    Then select the `Move` tool, click on the `Shadow` part of the preview image to
    tell GIMP that is what you want to move, and use the arrow keys to position the
    shadow treatment.


    Position the drop shadow so that you achieve the same effect that you got in Photoshop
    with the `Layer Style Inner Shadow` tool. You may have to use the arrow keys to
    move the shadow a couple of pixels in the X and Y dimensions so that it looks
    like the shadow is on the inside of the text object, making it look like it is
    being cut into the image.


    To make the drop shadow color blend (multiply) with the gold text color, set the
    `Mode` drop down menu to `Multiply`, as is shown in Figure [9-8](#A978-1-4842-4060-1_9_Chapter.html#Fig8)
    at the top right of the screenshot, circled in red. This adds even more realism,
    especially in the areas of the shadow which have been blurred.


    ![A978-1-4842-4060-1_9_Fig8_HTML.jpg](A978-1-4842-4060-1_9_Fig8_HTML.jpg)


    Figure 9-8. You can fine-tune the shadow using the `Move` tool and a `Multiply`
    mode


    As you can see, you can also accomplish the majority of what you can in Photoshop
    using GIMP. It took you four layers to create this effect in Photoshop, and five
    in GIMP, but the end result can be tweaked to be identical across both programs.


    I will use Photoshop to look at the remaining modes, which are used the most frequently
    for compositing, to make sure that I give equal billing to both software packages
    in each chapter in the book.


    ## Photoshop Blending Modes: Cool Effects


    During the rest of this chapter, let’s take a look at some of the blending modes
    in Photoshop, which can provide you with some really powerful image compositing
    “looks” and special effects. Because some of them are very similar to one another,
    I’m not going to cover all 26 modes here, but I will go over some of the modes
    you’ll find yourself using frequently. These include modes that can simulate light
    shining on your imagery, overlay one image on top of another, and create similar
    pixel-based 2D special effects. We have already covered the `Screen` mode and
    `Multiply` modes in GIMP 2.8.14, so I am going to focus on the other modes in
    Photoshop CS6, as these two work the same way in Photoshop as they do in GIMP.
    Let’s get started looking at all the cool effects that blending modes can create,
    using the image composite we have created thus far.'
