    As you can see in Figure [6-5](#A978-1-4842-4060-1_6_Chapter.html#Fig5), a center
    area of your ring will then become selected, with what is popularly termed in
    the industry as “marching ants.”


    You can expand this area of selection, if you like, by a few pixels using the
    Select ➤ Modify ➤ Expand menu sequence and the Expand Selection dialog, which
    are also seen in Figure [6-5](#A978-1-4842-4060-1_6_Chapter.html#Fig5). I decided
    to expand my circular selection by 3 pixels in width.


    I did this to make sure that my selection went underneath the edge of the ring,
    so there was no visible edge transition right at the edge of the ring, where the
    tool will put your selection edge. This is a popular digital image compositing
    trick that compositing professionals often utilize.


    Then, click the Niki layer, and use Select ➤ Inverse, to select the image pixels
    outside the ring as seen in Figure [6-6](#A978-1-4842-4060-1_6_Chapter.html#Fig6).


    ![A978-1-4842-4060-1_6_Fig6_HTML.jpg](A978-1-4842-4060-1_6_Fig6_HTML.jpg)


    Figure 6-6.


    The selection inverted and the Niki layer selected


    You can hit the Delete key, to delete pixels, as seen in Figure [6-7](#A978-1-4842-4060-1_6_Chapter.html#Fig7).


    ![A978-1-4842-4060-1_6_Fig7_HTML.jpg](A978-1-4842-4060-1_6_Fig7_HTML.jpg)


    Figure 6-7.


    By using the Delete key, you can delete the selected pixels


    Since Photoshop CS is modal, the key “move” is to select the pixels while the
    RingElement layer is selected, and before you press the Delete key, change the
    selected layer to the Niki layer, so that those are the pixels that will be removed.
    This will leave only the round Niki decorative element, ready to use on a web
    site, an app, or social media.


    Now let’s take a look at the work process for doing the same thing using GIMP,
    being that ultimately these two digital imaging software packages are quite different,
    as far as your work process goes. This particular process is fairly similar for
    the two software packages, others are not similar at all.'
  trans: '

    我还选择了 `Alpha Channel`，在 `Load Selection` 对话框中，我通过 `Select ➤ Load Selection` 菜单顺序访问了该对话框。这会在图像上生成一个红色蒙版，以便更好地向你展示
    Alpha 通道数据所在的位置（或者相反，不在的位置）。我们将在第 7 章中了解更多关于蒙版的知识，届时我们将真正开始在 Alpha 通道内处理像素，以实现高级数字图像合成效果。


    我向你展示了我如何选择我的 `RingElement` 数据，以便我可以继续使用 `Edit ➤ Copy` 菜单顺序，将该数据复制到剪贴板，然后将其粘贴到图
    6-1 中所示的 Niki 图像合成中，该图位于选定的右侧标签页中。


    为了将戒指图像数据放置在 Niki 图层顶部的另一个图层中，我选择了 Niki 图层，并使用了 `Edit ➤ Paste` 菜单顺序。这会将选定的像素数据粘贴到自动创建于
    Niki 图层上方的图层中，用 Alpha 透明度值填充任何未使用的像素，并自动为新图层创建一个 Alpha 通道。最后，我双击了图层标签，并为其提供了我自己的
    `RingElement` 图层标签，可以在图 6-1 中看到它以灰色选中状态显示。


    接下来，让我们看看如何使用 GIMP 创建相同的合成流程。GIMP 2.8.14 中有一个非常酷的功能，可以方便地将 32 位图像（例如 `RingElement.png32`
    文件）导入 GIMP。此功能会在图像合成流程（图层堆栈）中自动创建一个图层，并将导入的图像放置到该图层组件中。


    使用 GIMP 的 `File ➤ Open as Layer` 菜单顺序比我在 Photoshop CS 中使用的工作流程要简单得多，你可以在图 6-1
    和图 6-2 中看到 Photoshop 的工作流程。要使用此命令，请选择 `Niki.png` 图层（在图 6-3 中以蓝色显示），然后使用 `File
    ➤ Open as Layer` 顺序，如图 6-3 左侧所示。


    ![A978-1-4842-4060-1_6_Fig3_HTML.jpg](img/A978-1-4842-4060-1_6_Fig3_HTML.jpg)


    图 6-3.


    你可以使用 `Open as Layer` 菜单选项在 GIMP 中插入戒指


    如果你从 `File Open` 对话框中选择一个 `RingElement.png` 文件，GIMP 会将其作为一个合成图层添加到你的 `Niki.png`
    图层之上，如图 6-4 所示。你将看到 GIMP 也使用棋盘格图案来表示透明度，如图 6-4 右侧的图层调板所示。请注意，GIMP 还会使用一个黑黄相间的虚线方块来显示
    `RingElement.png` 图层的像素尺寸，该虚线框在 `RingElement` 图层上框住了 Niki 图像合成中间的区域。


    ![A978-1-4842-4060-1_6_Fig4_HTML.jpg](img/A978-1-4842-4060-1_6_Fig4_HTML.jpg)


    图 6-4.


    `RingElement.png` 图层显示尺寸和 Alpha


    Alpha 通道不仅用于在合成流程（图层堆栈）中定义透明区域，还可以用于更创造性的目的，例如存储选区。


    ## 选区：使用 Alpha 进行选区集


    正如你在图 6-2 中已经看到的，Alpha 通道也可以用来存储对象，以便在以后的数字图像合成项目中轻松选择使用。我们将在第 7 章中更详细地介绍选区集和蒙版，但我将在这里向你展示一些工具和技术，以便我们能够更无缝地过渡到本书后面相关章节的主题。


    ### 在 Photoshop CS 中选择 Alpha 通道数据


    让我们继续使用我们在图 6-1 中开始的 Photoshop 示例，看看这是如何工作的。我随书附带了 PSD 文件；它名为 `Chapter6alphaChannels.psd`，位于
    `apress.com` 网站上本书的文件仓库中，如果你想现在打开它并跟随我一起操作。


    你要做的第一件事是单击左侧工具栏顶部的魔棒工具，如图 6-5 中被选中的那样（它看起来像一个仙女棒）。


    ![A978-1-4842-4060-1_6_Fig5_HTML.jpg](img/A978-1-4842-4060-1_6_Fig5_HTML.jpg)


    图 6-5.


    使用 Photoshop 的魔棒工具选择戒指内部


    然后，单击戒指中间区域，并确保你的 `RingElement` 图层是右侧面板中选中的图层。数字成像软件是“模态”的，我们将在涵盖模态操作的第 10 章中更详细地讨论这一点。


    如图 6-5 所示，戒指的中心区域随即被选中，呈现出行业俗称的“行军蚁”效果。


    如果你愿意，可以使用 `Select ➤ Modify ➤ Expand` 菜单顺序和 `Expand Selection` 对话框将选区向外扩展几个像素，这些也在图
    6-5 中可见。我决定将我的圆形选区宽度扩展 3 个像素。


    我这样做是为了确保我的选区延伸到戒指边缘下方，这样在工具放置选区边缘的地方，戒指边缘就不会有可见的边缘过渡。这是合成专业人员经常使用的一种流行的数字图像合成技巧。


    然后，单击 Niki 图层，并使用 `Select ➤ Inverse`，选择戒指外部的图像像素，如图 6-6 所示。


    ![A978-1-4842-4060-1_6_Fig6_HTML.jpg](img/A978-1-4842-4060-1_6_Fig6_HTML.jpg)


    图 6-6.


    选区已反转且 Niki 图层被选中


    你可以按下 `Delete` 键来删除像素，如图 6-7 所示。


    ![A978-1-4842-4060-1_6_Fig7_HTML.jpg](img/A978-1-4842-4060-1_6_Fig7_HTML.jpg)


    图 6-7.


    通过使用 `Delete` 键，你可以删除选定的像素


    由于 Photoshop CS 是模态的，关键的“一步”是在选中 `RingElement` 图层时选择像素，然后在按下 `Delete` 键之前，将选中的图层切换到
    Niki 图层，这样被删除的将是那些像素。这将只留下圆形的 Niki 装饰元素，可用于网站、应用程序或社交媒体。


    现在，让我们看看使用 GIMP 完成相同操作的工作流程，因为归根结底，就工作流程而言，这两款数字成像软件差别很大。这个特定的流程对于这两个软件来说相当相似，但其他流程则完全不同。

