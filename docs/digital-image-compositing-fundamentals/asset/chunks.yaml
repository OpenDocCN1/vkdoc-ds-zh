    ![A978-1-4842-4060-1_7_Fig13_HTML.jpg](A978-1-4842-4060-1_7_Fig13_HTML.jpg)


    Figure 7-13.


    Click along the edge of your object to create an outline


    The Scissors tool is like an intelligent spline that automatically looks behind
    itself and conforms its curvature as it travels between points (I call them nodes
    for the tool) and sets the tension handles (the curvature in and out of each node).
    You can even refine node positions to adjust the curves!'
  trans: '

    ### 遮罩微调：Alpha 边缘精修技术


    创建蒙版工作流程的下一步，是完善蒙版白色（不透明）与黑色（透明）区域之间的边缘。这是蒙版的反走样处理。如果你在`魔术棒`工具中选择了`反走样`选项，那么算法生成的蒙版中可能已经存在一些这样的处理。如果你没有选择此选项，蒙版边缘将只存在黑色和白色像素。让我们使用缩放（放大镜）工具，看看是否有灰色像素。这些灰色像素将提供一种具有“实时”色彩混合的蒙版（利用反走样技术），处理对象（鸟）与任何你之后可能希望将对象合成到其上的背景图像之间的过渡，因为它们定义了透明度。


    如图 7-9 所示，蒙版已被反转，并且边缘确实存在灰色像素，提供了这种反走样功能。为了创建这张图像，我将鸟尾底部一条“干净”边缘上略微弯曲的区域放大了。正如标签所示，我放大了
    700%，这样你就能看到边缘像素和反走样效果。


    ![A978-1-4842-4060-1_7_Fig9_HTML.jpg](img/A978-1-4842-4060-1_7_Fig9_HTML.jpg)


    **图 7-9.** 你可以放大蒙版边缘来查看反走样效果。


    现在，让我们通过使用 `查看 ➤ 100%` 菜单序列缩小视图，然后在 Photoshop CS 中启用 `蒙版叠加` 功能。这通过点击 `RGB` 通道旁边的
    `眼睛` 图标来完成。


    这将在蒙版的透明区域上叠加一层红色色调，如图 7-10 所示。这层色调允许你在编辑蒙版的同时，也能看到你正在抠图的图像，这样你正在处理的图像就可以用作参考指南。


    ![A978-1-4842-4060-1_7_Fig10_HTML.jpg](img/A978-1-4842-4060-1_7_Fig10_HTML.jpg)


    **图 7-10.** 选择 `RGB` 通道的 `眼睛` 图标来启用蒙版叠加。


    如图 7-11 所示，我使用了一个 13 像素的柔和边缘 `笔刷` 工具，并将视图放大 400% 来修复鸟尾的顶部边缘和背部。正如你所见，这些区域在微调该蒙版与鸟形对象的边缘贴合度方面，确实需要一些工作。


    ![A978-1-4842-4060-1_7_Fig11_HTML.jpg](img/A978-1-4842-4060-1_7_Fig11_HTML.jpg)


    **图 7-11.** 要编辑鸟尾边缘，请使用 13 像素的柔和笔刷并放大视图。


    你可以使用 `RGB` 通道的 `眼睛` 图标来开启和关闭这种红色蒙版辅助显示。你需要在工作中反复使用此功能，以便看到实际的蒙版本身。


    你也可以在没有此蒙版叠加的黑白模式下工作，确保蒙版完全是黑色和白色，并在两种颜色之间的边缘处保留了灰色的反走样像素。


    这通常是遮罩艺术家的操作方式：他们使用红色蒙版叠加指南来查看蒙版处理的进展，然后关闭它以处理高对比度的黑白表示，因为在边缘之外的蒙版区域，这样做更容易看清你的操作。


    你应该花足够的时间来完善蒙版，以确保获得你想要的结果。请记住，和其他一切技能一样，成为一名专业的合成师需要大量的练习！需要重点注意的是，虽然我们使用了一个
    484×372 分辨率的示例图像来观察这个蒙版处理过程，但使用更高分辨率的图像来进行蒙版处理，几乎总能得到更高质量的图像合成结果。单个像素相对于整个图像的尺寸比例（百分比）更小，因此边缘和反走样效果也更加精细。


    在 GIMP 中与 `魔术棒` 工具等效的是 `模糊选择` 工具。由于它在两个软件中的工作方式极其相似，我决定改为向你展示如何在 GIMP 中通过使用另一种创新的、采用了不同方法的算法来提取蒙版。这个算法可以通过使用
    `剪刀选择` 工具来实现。


    ### GIMP 剪刀工具：智能抠图算法


    要访问 `剪刀选择` 工具，请使用 `文件 ➤ 打开` 菜单序列在 GIMP 中打开 `MaskExercise.png` PNG24 数字图像文件。然后，选择屏幕右上角显示的
    `剪刀` 工具图标（如图 7-12 所示），点击你想提取的对象边缘，开始勾勒你要放置的轮廓线。当你点击对象上的第二个点时，`剪刀选择` 工具将应用其边缘检测算法。这在图
    7-12 中鸟的头部顶端可以看到。


    ![A978-1-4842-4060-1_7_Fig12_HTML.jpg](img/A978-1-4842-4060-1_7_Fig12_HTML.jpg)


    **图 7-12.** 要从图像中提取对象，请打开图像，选择 `剪刀` 工具，然后点击其边缘。第二次点击将启用边缘检测。


    如果你选中了`交互式边界`选项（如图 7-13 屏幕左下角勾选所示），当你调整选区轮廓上的点以细化蒙版节点时，边缘检测算法将实时重新计算。


    ![A978-1-4842-4060-1_7_Fig13_HTML.jpg](img/A978-1-4842-4060-1_7_Fig13_HTML.jpg)


    **图 7-13.** 沿着对象边缘点击以创建轮廓线。


    `剪刀` 工具就像一个智能样条线，在点与点之间（我称之为该工具的节点）移动时会自动向后查看并调整其曲率，同时设置张力手柄（每个节点的进出曲率）。你甚至可以细化节点的位置来调整曲线！

    '
- fmt: '### Adjusting the Scissors Tool: Intelligent Spline Nodes


    I have found that I get better edge detection algorithm results when I put nodes
    at color changes in the object, as shown in Figure [7-14](#A978-1-4842-4060-1_7_Chapter.html#Fig14),
    in the gray and yellow areas of the bird. You can move node positions by dragging
    them, at any time during the process of laying down the curve, including after
    it is closed. The curve is closed by clicking on the first node that you placed,
    which, in this case, is at the top of the bird’s head. As you can see in the figure,
    the line between nodes straightens as you drag the node to reposition it, with
    the new curve fit algorithm being calculated when you drop or release a node in
    a new position.


    ![A978-1-4842-4060-1_7_Fig14_HTML.jpg](A978-1-4842-4060-1_7_Fig14_HTML.jpg)


    Figure 7-14. You can move the nodes any time to get a better result


    If you reposition your right-hand node in the middle of the bird’s chest, you
    get 100 percent-superior results from the intelligent-curve-placement algorithm
    as compared with any other edge placement (try it for yourself, using the `MaskExercise.png`
    file that’s included with the book). The results are shown in Figure [7-15](#A978-1-4842-4060-1_7_Chapter.html#Fig15),
    with perfect edge detection.


    ![A978-1-4842-4060-1_7_Fig15_HTML.jpg](A978-1-4842-4060-1_7_Fig15_HTML.jpg)


    Figure 7-15. This node placement has a better edge-match result


    In Figure [7-16](#A978-1-4842-4060-1_7_Chapter.html#Fig16), I have zoomed in 200
    percent, so I can see the talons more clearly for the node placement at the bottom
    of the bird image. As you can see, there are a few nodes that I had to slightly
    reposition to get a better edge fit from the Scissor tool algorithm, specifically
    the one at the tip of the wing (compare Figure [7-16](#A978-1-4842-4060-1_7_Chapter.html#Fig16)
    with Figure [7-17](#A978-1-4842-4060-1_7_Chapter.html#Fig17)).


    ![A978-1-4842-4060-1_7_Fig17_HTML.jpg](A978-1-4842-4060-1_7_Fig17_HTML.jpg)


    Figure 7-17. To close the spline, click on the first node you laid down


    ![A978-1-4842-4060-1_7_Fig16_HTML.jpg](A978-1-4842-4060-1_7_Fig16_HTML.jpg)


    Figure 7-16. Position easier nodes first, save details for the end


    Also, notice that in Figures [7-14](#A978-1-4842-4060-1_7_Chapter.html#Fig14)
    through [7-16](#A978-1-4842-4060-1_7_Chapter.html#Fig16), I have started the outline
    next to the bird’s talons, as this is the detailed area for your mask, and so
    I wanted to work on this part last. So my first point is to the right of the talons,
    and I position nodes counter-clockwise, ending to the left of the talons, so the
    last nodes that I lay down are the talon detail.


    The reason for this is that I can zoom in to the talons area last, once the majority
    of the mask area has been outlined using the Scissors Select tool.


    It’s important to note that if you click another GIMP tool, the one you are using
    will abort, and so if you want to zoom, you will have to use the `View` ➤ `Zoom`
    ➤ `Zoom In` menuing sequence (or `View` ➤ `Zoom` ➤ `Zoom Out`) to keep this Scissors
    tool active. It’s useful to know both the menu sequences, as well as the tool
    icons, for both Photoshop and GIMP for this reason.


    As you can see in Figure [7-17](#A978-1-4842-4060-1_7_Chapter.html#Fig17), the
    Scissors algorithm is doing a fairly good job on the talon area, except for the
    claws, which I will have to deal with manually, once I convert this to a selection,
    and save it as an alpha (for editing).


    To close the selection curve completely, position your pointer over the first
    node you placed, and when it changes to the close curve pointer, click and the
    curve will be closed. It is important to note that you can still adjust (move)
    the nodes when the selection curve has been closed. To turn the selection curve
    into a selection area, click the inside of the curve.


    As you can see in Figure [7-18](#A978-1-4842-4060-1_7_Chapter.html#Fig18), I’ve
    turned the curve into a selection, and can now use the same work process that
    I did in Photoshop to save the selection set and edit it in a channel. The menu
    sequence to do this in GIMP is `Select` ➤ `Save to Channel`. Then you can toggle
    the Quick Mask (red color guide) mode with `Select` ➤ `Toggle Quick Mask`.


    ![A978-1-4842-4060-1_7_Fig18_HTML.jpg](A978-1-4842-4060-1_7_Fig18_HTML.jpg)


    Figure 7-18. Click inside of the closed spline to create your final selection


    As you can see in Figure [7-19](#A978-1-4842-4060-1_7_Chapter.html#Fig19), saving
    to a channel will allow you to reopen the channel and edit further using the Brush
    tool (selected) with black and white colors, which can be toggled using that curved
    arrow between the color swatches, under your tool icons.


    ![A978-1-4842-4060-1_7_Fig19_HTML.jpg](A978-1-4842-4060-1_7_Fig19_HTML.jpg)


    Figure 7-19. Using Quick Mask mode in GIMP to refine your mask


    As you can see in Figure [7-19](#A978-1-4842-4060-1_7_Chapter.html#Fig19), I used
    the Brush tool to make sure the right toe was included inside of the mask area,
    and cleaned up the other areas a little bit.


    This Scissors Select tool really gets you to the point where 99% of the masking
    work is done by your node positioning and the tool algorithm, which is pretty
    amazing if you think about it, especially since GIMP is free for commercial use.
    Of course, you can spend as much time as you want on edge clean-up and perfect
    the mask, since you have the `XCF` file now. Practice makes perfect.


    In the next chapter, we’ll be taking a look at using the Layers palette.


    ## Summary


    In this seventh chapter, we reviewed the most common ways to pull a mask using
    Photoshop (Magic Wand tool) and GIMP (Scissors Select tool). You learned about
    how to use the Photoshop Magic Wand and its Sample Size and Tolerance settings,
    and how to save the selection to an alpha channel and edit it further to perfect
    your end result. In GIMP, you learned about the Scissors Select tool, which takes
    a different approach of using a powerful algorithm to create a spline that curve
    fits to any of the object’s edges, which you direct it to by laying down nodes
    on the perimeter of the object. We also went over saving this result to an alpha
    channel and further editing the mask, just like you did in Photoshop CS6.


    In [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html), you will learn more about
    digital image compositing Layers and how to work with their functions, which are
    accessed using the Layer palette in both Photoshop CS6 and GIMP 2.8.14.'
