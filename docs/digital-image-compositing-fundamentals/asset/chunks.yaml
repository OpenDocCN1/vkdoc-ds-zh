    # Photoshop 的滤镜菜单：使用插件滤镜


    现在，让我们在 Photoshop 中模拟刚才在 GIMP 中完成的合成过程。由于调整图层没有滤镜蒙版，我们需要更改调整图层的设置，实质上是将其反转，这将会向你展示一些新的模态操作“技巧”（我这么称呼它们），以便设置
    Photoshop 合成，使其能够完成我们在 GIMP 合成中所做的事情。


    开始你的模态工作流程：打开 第 10 章 的 Photoshop 文件 `Chapter10modalOperation.psd`，并选择底板（底层）背景图像图层。然后使用
    `图层 ➤ 复制图层` 菜单序列来打开 `复制图层` 对话框，如图 11-7 所示，并将新图层命名为“插件滤镜效果”。


    ![A978-1-4842-4060-1_11_Fig7_HTML.jpg](img/A978-1-4842-4060-1_11_Fig7_HTML.jpg)


    **图 11-7.** 要在 Photoshop 中启动合成过程，请遵循 `图层 ➤ 复制图层` 菜单序列以打开 `复制图层` 对话框。


    此工作流程的第二步，也就是模拟你在 GIMP 中所做的操作，是将这个“插件滤镜效果”图层拖到图层堆栈的底部，使其成为底板，并确保当你对其应用插件滤镜时，它将位于合成管线（像素处理顺序）中所有其他元素的后方或下方。


    下一步是将调整图层蒙版图标从橙色调整图层中拖出，并将其放到你的 `Niki` 图层上，此时 `Niki` 图层应该直接位于调整图层下方，如图 11-8 所示。当图标正确悬停在图层上方时，你会在
    `Niki` 图层周围看到一个白色轮廓。看到此轮廓后，松开图层蒙版图标。这将改变此蒙版的名称，从调整图层蒙版变为图层蒙版。


    ![A978-1-4842-4060-1_11_Fig8_HTML.jpg](img/A978-1-4842-4060-1_11_Fig8_HTML.jpg)


    **图 11-8.** 合成过程的第二步是将调整图层蒙版拖到 `Niki` 图层上。


    调整图层蒙版现在又变回全白色，这正是你对整个底板应用调整所需要的状态。请注意，Photoshop 拥有更高级的拖放功能，例如能够简单地在图层之间拖动图层蒙版数据，而
    GIMP 2.8.14 尚不具备此功能。GIMP 3.0 有可能在后续软件开发周期中添加这些功能。


    工作流程的下一步是将橙色调整图层拖到你的 `Niki` 图层下方，但位于“插件滤镜效果”图层之上，如图 11-9 所示。由于此调整现在仅应用于底板，你不需要“剪切到图层”选项，该选项会将调整（隔离后）仅附加到直接位于其下方的图层。


    ![A978-1-4842-4060-1_11_Fig9_HTML.jpg](img/A978-1-4842-4060-1_11_Fig9_HTML.jpg)


    **图 11-9.** 下一步是将调整图层拖到你的 `Niki` 图层下方。


    如图 11-9 所示，期望的效果与我们所需的效果相反。如果你需要这个效果，就必须保持 `Niki` 图层蒙版不变；如果你想要在 GIMP 中创建的效果，则需要反转图层蒙版。


    实现该目标的工作流程包括：选择 `Niki` 图层，然后选择 `Niki` 图层内的图层蒙版图标，向 Photoshop 表明这是你希望提交进行图像调整处理的数据。


    请记住，使用模态操作是成功使用数字图像合成软件的关键。在这种情况下，这涉及在调用 `反转调整蒙版` 操作之前，先选择 `Niki` 图层的图层蒙版组件。在
    Photoshop CS6 中，我们接下来将通过选择 `调整蒙版` 并将其反转来执行此操作。


    再次强调，你可以看到 `Niki` 图层以灰色高亮显示，如图 11-10 所示，而图层蒙版则以带有四个角方块的白色轮廓高亮显示。


    ![A978-1-4842-4060-1_11_Fig10_HTML.jpg](img/A978-1-4842-4060-1_11_Fig10_HTML.jpg)


    **图 11-10.** 要反转图层蒙版，请选择 `Niki 图层蒙版` 并反转图层蒙版像素。


    接下来，你将使用 `图像 ➤ 调整 ➤ 反转` 菜单序列（也显示在图 11-10 中）来反转所选图层蒙版。这将导致你的 `RingElement` 图层对象外部变为黑白，而内部变为彩色，这是因为图层蒙版告知调整图层要处理和显示的内容发生了反转。


    如图 11-11 所示，所需的效果现在已经就位。现在你可以选择你的“插件滤镜效果”图层，并使用 `滤镜 ➤ 滤镜库` 菜单序列来访问 Photoshop CS6
    的艺术效果插件滤镜集合。


    ![A978-1-4842-4060-1_11_Fig11_HTML.jpg](img/A978-1-4842-4060-1_11_Fig11_HTML.jpg)


    **图 11-11.** 要访问艺术效果插件滤镜集合，请选择底板并遵循 `滤镜 ➤ 滤镜库` 菜单序列。


    `滤镜库` 插件集合曾由单独的插件滤镜组成，所有这些滤镜都可以通过 Photoshop 的滤镜菜单访问。现在它们已被整合到一个用户界面中，如图 11-12
    所示。我选择了 `画笔描边` 部分，然后点击 `墨水轮廓` 滤镜来应用它。


    ![A978-1-4842-4060-1_11_Fig12_HTML.jpg](img/A978-1-4842-4060-1_11_Fig12_HTML.jpg)


    **图 11-12.** 选择 `画笔描边` 部分并单击 `墨水轮廓` 滤镜进行应用后的结果。


    如图 11-13 所示，尽管不完全相同，但你的合成项目已经实现了与在 GIMP 中类似的视觉升级：带有文字的环形元素外部呈现风格化效果，内部则是原始照片级别的图像质量。


    ![A978-1-4842-4060-1_11_Fig13_HTML.jpg](img/A978-1-4842-4060-1_11_Fig13_HTML.jpg)


    **图 11-13.** 视觉升级将使底板通过特殊效果进行区分。


    在下一章中，我们将更仔细地审视你这个项目的合成管线及其工作原理，同时进一步优化图像合成，并学习 Photoshop CS6 和 GIMP 2.8.14 的一些新软件功能。


    ## 总结


    在这第十一章中，我们详细介绍了 Photoshop 和 GIMP 中的插件滤镜，以及如何将它们用作“程序中的小程序”，为你的数字图像合成管线和项目增添更多特殊效果的震撼力。你了解了
    GIMP 的插件仓库，然后使用 GIMP 和 Photoshop 中的滤镜实现了特殊效果。


    在 GIMP 中，你通过添加另一个可用于应用特殊效果滤镜的图层，再次实现了无损编辑。这次，基于 GIMP 的工作方式，工作流程（模态操作）更加简单，因为你只需复制一个图层，该图层恰好包含了所需的图层蒙版。


    为了在 Photoshop 中实现类似的图像合成处理管线结果，你必须重新调整图层、图层蒙版、调整图层和调整图层蒙版处理管线。这向你展示了如何在 Photoshop
    CS6 中使用一些非常实用的新技巧、工作流程和艺术滤镜功能。


    在 第 12 章 中，我们将学习更多关于数字图像合成软件管线的知识，以及底层究竟发生了什么，从而让你理解为什么模态操作如此重要。

