- fmt: "### Photoshop Magic Wand: Tolerance and Sampling\n\nLet’s take a closer look\
    \ at how the Magic Wand masking tool in Photoshop works by extracting a bird figure\
    \ from a PNG24 image. In Figure [7-1](#A978-1-4842-4060-1_7_Chapter.html#Fig1),\
    \ I have set a `Tolerance` of 16 and clicked in the wood area of the image to\
    \ show what the tolerance threshold is for this particular image. `Tolerance`\
    \ is how many similar colors in the point sample (pixel) that is clicked on will\
    \ be included in the selection (set) of pixels. Let’s increase the `Tolerance`.\n\
    \n![A978-1-4842-4060-1_7_Fig1_HTML.jpg](A978-1-4842-4060-1_7_Fig1_HTML.jpg)\n\n\
    Figure 7-1.  \nResult of clicking on the wood tabletop after setting a `Tolerance`\
    \ of 16\n\nFigure [7-2](#A978-1-4842-4060-1_7_Chapter.html#Fig2) shows the visual\
    \ result of using a three-times-greater `Tolerance` setting of 48. As you can\
    \ see, you will use this `Tolerance` setting extensively, to get the tool to give\
    \ you the selection result that you desire.\n\n![A978-1-4842-4060-1_7_Fig2_HTML.jpg](A978-1-4842-4060-1_7_Fig2_HTML.jpg)\n\
    \nFigure 7-2.  \nResult of clicking on the wood tabletop after setting a `Tolerance`\
    \ of 48\n\nThe work process I use is to set the `Tolerance` and point sample sample\
    \ size, click a color I want to eliminate, and then use the `Select` ➤ `Deselect`\
    \ (`Select` ➤ `None` in GIMP) menu sequence to deselect the selection if it is\
    \ not close to what I’m trying to achieve, and set a different `Tolerance`, and\
    \ sample size, if necessary. Then I take a similar pixel color sample and repeat\
    \ the process until I get close to the selection result I need.\n\nNow you know\
    \ what different `Tolerance` settings produce. You can change the value at any\
    \ time during your masking work process (do this between clicks to select pixel\
    \ areas). Let’s move on to the `Sample Size`, which we will change from a single\
    \ point sample, done in pixels, to a 3-by-3 average pixel block, as is shown in\
    \ Figure [7-3](#A978-1-4842-4060-1_7_Chapter.html#Fig3).\n\n![A978-1-4842-4060-1_7_Fig3_HTML.jpg](A978-1-4842-4060-1_7_Fig3_HTML.jpg)\n\
    \nFigure 7-3.  \nResult of selecting `3 by 3 Average` sample size and clicking\
    \ on the wood tabletop on the screen\n\nNow when I click in the lower-left-hand\
    \ side of the wood tabletop, I get more pixels in the selection set just as if\
    \ I had increased the `Tolerance` to a higher value. `Tolerance` is how much the\
    \ selection can vary from the selected color, and `Sample Size` allows you to\
    \ give the algorithm an average from the color culled from the (matrix of) adjacent\
    \ pixels. Using the two settings will allow you to fine-tune any selection, so\
    \ be sure to play around with these to get a feel for how they affect the selection\
    \ set that is obtained.\n\nThe other options (checkboxes) allow you to anti-alias\
    \ a selection edge (I always use this function), and afford you a contiguous selection\
    \ area. Anti-aliasing averages pixel colors along an edge to provide a smoother\
    \ edge result. You can also sample color from other layers, if you need to, but\
    \ normally, you’ll be working on just one image plate at a time.\n\nThe reason\
    \ I select `Contiguous` will become evident after you read the next section of\
    \ this chapter, but, in brief, what this option does is to only expand the selection\
    \ that you have just clicked to contiguous color pixels.\n\nIf you deselect `Contiguous`\
    \ (`Antialias` and `Contiguous` are selected by default), you’ll get selection\
    \ “islands” throughout your image, wherever that sampled color and its tolerance\
    \ range occur. The reason `Contiguous` gives you more control is that it allows\
    \ you to extend the current selection. I will tell you how to do this extension\
    \ in the next section, during my discussion of adding to a selection set by using\
    \ (holding down) the `Shift` key modifier. This is the most popular Magic Wand\
    \ work process.\n\n### Adding to a Selection Set: Using the Shift Modifier\n\n\
    If you have an area of uniform color (or uniform color gradient) around the subject\
    \ you’re trying to mask, you can theoretically tweak the sample size and tolerance\
    \ until you get the numeric inputs that generate the selection set that will extract\
    \ your subject matter perfectly. However, most images, such as the one we are\
    \ using here, are “busier” than that, and will require more than one pixel of\
    \ color sampling (click).\n\nA solution to this is to sample different colors\
    \ and add to the selection, by holding down your `Shift` modifier key, when you\
    \ are selecting any pixels after the first pixel you select.\n\nFor this particular\
    \ image, there were tan, brown, crème, pink, and black areas next to the bird\
    \ that we are trying to extract, so we will need to use this technique. I used\
    \ a low `Tolerance`—in this case, 12—as is shown in Figure [7-4](#A978-1-4842-4060-1_7_Chapter.html#Fig4).\n\
    \n![A978-1-4842-4060-1_7_Fig4_HTML.jpg](A978-1-4842-4060-1_7_Fig4_HTML.jpg)\n\n\
    Figure 7-4.  \nThe `RingElement.png` layer shows dimension and alpha\n\nTo achieve\
    \ this selection set (of pixels), start a click sequence in the lower-left-hand\
    \ corner of the wood tabletop, and after the first click, hold down the `Shift`\
    \ key on your keyboard and click in the other unselected areas around your bird.\
    \ This will add to a selection set, and your selection area will expand and refine\
    \ until you finally obtain the result seen in Figure [7-4](#A978-1-4842-4060-1_7_Chapter.html#Fig4).\n\
    \nOnce you have most of the area around the bird selected, as shown in Figure\
    \ [7-4](#A978-1-4842-4060-1_7_Chapter.html#Fig4), you can then learn how to use\
    \ the alpha channel to refine your selection, which is what we are going to cover\
    \ in the next section of the chapter. It is interesting that many digital artisans\
    \ never think to pull their main mask quickly using the selection tools, save\
    \ the result as an alpha, and finish the task simply by using a brush, and then\
    \ later on, reload the result as a selection set, using that alpha channel!"
  raw: '### Photoshop Magic Wand: Tolerance and Sampling


    Let’s take a closer look at how the Magic Wand masking tool in Photoshop works
    by extracting a bird figure from a PNG24 image. In Figure [7-1](#A978-1-4842-4060-1_7_Chapter.html#Fig1),
    I have set a Tolerance of 16 and clicked in the wood area of the image to show
    what the tolerance threshold is for this particular image. Tolerance is how many
    similar colors in the point sample (pixel) that is clicked on will be included
    in the selection (set) of pixels. Let’s increase the Tolerance.


    ![A978-1-4842-4060-1_7_Fig1_HTML.jpg](A978-1-4842-4060-1_7_Fig1_HTML.jpg)


    Figure 7-1.


    Result of clicking on the wood tabletop after setting a Tolerance of 16


    Figure [7-2](#A978-1-4842-4060-1_7_Chapter.html#Fig2) shows the visual result
    of using a three-times-greater Tolerance setting of 48\. As you can see, you will
    use this Tolerance setting extensively, to get the tool to give you the selection
    result that you desire.


    ![A978-1-4842-4060-1_7_Fig2_HTML.jpg](A978-1-4842-4060-1_7_Fig2_HTML.jpg)


    Figure 7-2.


    Result of clicking on the wood tabletop after setting a Tolerance of 48


    The work process I use is to set the Tolerance and point sample sample size, click
    a color I want to eliminate, and then use the Select ➤ Deselect (Select ➤ None
    in GIMP) menu sequence to deselect the selection if it is not close to what I’m
    trying to achieve, and set a different Tolerance, and sample size, if necessary.
    Then I take a similar pixel color sample and repeat the process until I get close
    to the selection result I need.


    Now you know what different Tolerance settings produce. You can change the value
    at any time during your masking work process (do this between clicks to select
    pixel areas). Let’s move on to the Sample Size, which we will change from a single
    point sample, done in pixels, to a 3-by-3 average pixel block, as is shown in
    Figure [7-3](#A978-1-4842-4060-1_7_Chapter.html#Fig3).


    ![A978-1-4842-4060-1_7_Fig3_HTML.jpg](A978-1-4842-4060-1_7_Fig3_HTML.jpg)


    Figure 7-3.


    Result of selecting 3 by 3 Average sample size and clicking on the wood tabletop
    on the screen


    Now when I click in the lower-left-hand side of the wood tabletop, I get more
    pixels in the selection set just as if I had increased the Tolerance to a higher
    value. Tolerance is how much the selection can vary from the selected color, and
    Sample Size allows you to give the algorithm an average from the color culled
    from the (matrix of) adjacent pixels. Using the two settings will allow you to
    fine-tune any selection, so be sure to play around with these to get a feel for
    how they affect the selection set that is obtained.


    The other options (checkboxes) allow you to anti-alias a selection edge (I always
    use this function), and afford you a contiguous selection area. Anti-aliasing
    averages pixel colors along an edge to provide a smoother edge result. You can
    also sample color from other layers, if you need to, but normally, you’ll be working
    on just one image plate at a time.


    The reason I select Contiguous will become evident after you read the next section
    of this chapter, but, in brief, what this option does is to only expand the selection
    that you have just clicked to contiguous color pixels.


    If you deselect Contiguous (Antialias and Contiguous are selected by default),
    you’ll get selection “islands” throughout your image, wherever that sampled color
    and its tolerance range occur. The reason Contiguous gives you more control is
    that it allows you to extend the current selection. I will tell you how to do
    this extension in the next section, during my discussion of adding to a selection
    set by using (holding down) the Shift key modifier. This is the most popular Magic
    Wand work process.


    ### Adding to a Selection Set: Using the Shift Modifier


    If you have an area of uniform color (or uniform color gradient) around the subject
    you’re trying to mask, you can theoretically tweak the sample size and tolerance
    until you get the numeric inputs that generate the selection set that will extract
    your subject matter perfectly. However, most images, such as the one we are using
    here, are “busier” than that, and will require more than one pixel of color sampling
    (click).


    A solution to this is to sample different colors and add to the selection, by
    holding down your Shift modifier key, when you are selecting any pixels after
    the first pixel you select.


    For this particular image, there were tan, brown, crème, pink, and black areas
    next to the bird that we are trying to extract, so we will need to use this technique.
    I used a low Tolerance—in this case, 12—as is shown in Figure [7-4](#A978-1-4842-4060-1_7_Chapter.html#Fig4).


    ![A978-1-4842-4060-1_7_Fig4_HTML.jpg](A978-1-4842-4060-1_7_Fig4_HTML.jpg)


    Figure 7-4.


    The RingElement.png layer shows dimension and alpha


    To achieve this selection set (of pixels), start a click sequence in the lower-left-hand
    corner of the wood tabletop, and after the first click, hold down the Shift key
    on your keyboard and click in the other unselected areas around your bird. This
    will add to a selection set, and your selection area will expand and refine until
    you finally obtain the result seen in Figure [7-4](#A978-1-4842-4060-1_7_Chapter.html#Fig4).


    Once you have most of the area around the bird selected, as shown in Figure [7-4](#A978-1-4842-4060-1_7_Chapter.html#Fig4),
    you can then learn how to use the alpha channel to refine your selection, which
    is what we are going to cover in the next section of the chapter. It is interesting
    that many digital artisans never think to pull their main mask quickly using the
    selection tools, save the result as an alpha, and finish the task simply by using
    a brush, and then later on, reload the result as a selection set, using that alpha
    channel!'
  trans: "\n### Photoshop 魔术棒：容差与取样\n\n接下来，让我们通过从一张 PNG24 图像中提取鸟形图案，来仔细探究 Photoshop\
    \ 中魔术棒遮罩工具的工作原理。在图 7-1 中，我将 `容差` 设置为 16，并点击图像中的木质区域，以此展示这张特定图片的容差阈值。`容差` 决定了点击取样点（像素）时，其周围多少种相似颜色会被纳入像素选区（集合）。现在，我们增加一下\
    \ `容差`。\n\n![A978-1-4842-4060-1_7_Fig1_HTML.jpg](img/A978-1-4842-4060-1_7_Fig1_HTML.jpg)\n\
    \n图 7-1.  \n将 `容差` 设置为 16 后点击木质桌面的结果\n\n图 7-2 显示了使用三倍于前的 `容差`（设置为 48）后的视觉效果。如你所见，你将频繁使用这个\
    \ `容差` 设置，以便让工具给出你期望的选区结果。\n\n![A978-1-4842-4060-1_7_Fig2_HTML.jpg](img/A978-1-4842-4060-1_7_Fig2_HTML.jpg)\n\
    \n图 7-2.  \n将 `容差` 设置为 48 后点击木质桌面的结果\n\n我通常的工作流程是：先设置好 `容差` 和点取样大小，点击想要消除的颜色，如果选区结果不理想，就通过\
    \ `选择` ➤ `取消选择`（在 GIMP 中是 `选择` ➤ `无`）菜单操作来取消选区，然后设置不同的 `容差`，并在必要时调整取样大小。接着，再选取一个相似颜色的像素点，重复以上步骤，直到获得接近我需要的选区结果。\n\
    \n现在你已经了解不同 `容差` 设置带来的效果。你可以在遮罩工作流程中的任何时刻更改此值（在两次点击选取像素区域之间进行更改）。接下来，我们看看 `取样大小`，我们将把它从单一点取样（基于像素）更改为\
    \ 3x3 的平均像素块，如图 7-3 所示。\n\n![A978-1-4842-4060-1_7_Fig3_HTML.jpg](img/A978-1-4842-4060-1_7_Fig3_HTML.jpg)\n\
    \n图 7-3.  \n选择 `3 by 3 平均` 取样大小后点击屏幕木质桌面的结果\n\n现在，当我点击木质桌面左下角时，选区集合中包含了更多像素，效果就像我把\
    \ `容差` 调高了一样。`容差` 控制选区与所选颜色的差异范围，而 `取样大小` 则允许你为算法提供一个从相邻像素（矩阵）中提取颜色的平均值。结合使用这两个设置，你可以精细调整任何选区，所以一定要多尝试，感受它们如何影响最终获得的选区集合。\n\
    \n其他选项（复选框）允许你柔化选区边缘（我始终使用此功能），并实现连续选区。反锯齿功能会对选区边缘的像素颜色进行平均处理，从而产生更平滑的边缘效果。你也可以根据需要从其他图层取样颜色，但通常情况下，你一次只处理一个图像图层。\n\
    \n我选择 `连续` 的原因，在你阅读完本章下一节后会更加明了。简而言之，这个选项的作用是，只将你点击的选区扩展到颜色连续的像素区域。\n\n如果你取消勾选\
    \ `连续`（`消除锯齿` 和 `连续` 默认是勾选的），那么图像中凡是出现该取样颜色及其容差范围内的像素区域，都会形成选区“孤岛”。`连续` 之所以能给你更多控制权，是因为它允许你扩展当前的选区。我将在下一节讨论如何使用（按住）`Shift`\
    \ 键修饰符来增加选区时，告诉你如何执行这种扩展操作。这是最常用的魔术棒工作流程。\n\n### 增加选区：使用 Shift 修饰符\n\n如果你要遮罩的主体周围有颜色均匀的区域（或均匀的颜色渐变区域），理论上你可以调整取样大小和容差，直到输入数值生成的选区集合能够完美提取出主体。然而，大多数图像，比如我们这里使用的这张，都“繁忙”得多，需要多次颜色取样（点击）。\n\
    \n一个解决方案是：在选取第一个像素之后的所有像素时，按住键盘上的 `Shift` 修饰键，对不同颜色进行取样并添加到选区中。\n\n就这张特定图像而言，小鸟旁边有棕褐色、棕色、奶油色、粉色和黑色区域，因此我们需要使用这个技巧。我使用了较低的\
    \ `容差`——这里是 12——如图 7-4 所示。\n\n![A978-1-4842-4060-1_7_Fig4_HTML.jpg](img/A978-1-4842-4060-1_7_Fig4_HTML.jpg)\n\
    \n图 7-4.  \n`RingElement.png` 图层显示了尺寸和 Alpha 通道\n\n要获得这个（像素）选区集，请从木质桌面左下角开始点击序列，第一次点击后，按住键盘上的\
    \ `Shift` 键，再点击小鸟周围其他未被选中的区域。这会不断扩大选区集合，你的选区范围会逐渐扩大并精细化，直到最终得到图 7-4 所示的结果。\n\n\
    一旦你选中了小鸟周围的大部分区域，如图 7-4 所示，你就可以学习如何使用 Alpha 通道来精炼你的选区，这将是本章下一节要介绍的内容。有趣的是，许多数字艺术家从未想过用选区工具快速提取主遮罩，将结果保存为\
    \ Alpha 通道，然后用画笔简单地完成任务，之后再通过这个 Alpha 通道将结果重新加载为选区集合！\n"
- fmt: '### Selection Editing: Using an Alpha to Edit Selection


    As you have already seen in [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html) (in
    Figure [6-2](#A978-1-4842-4060-1_6_Chapter.html#Fig2)), an alpha channel can be
    used to store masked objects and easily select them later on when you want to
    use them. Interestingly, you can also edit these black and white alpha channel
    pixels, by using any and all of the digital image editing and compositing tools
    that your digital image editing software offers.


    Let’s use this fact to our advantage in the masking work process, and use the
    `Save Selection` dialog shown in Figure [7-5](#A978-1-4842-4060-1_7_Chapter.html#Fig5),
    to turn what you have done with the `Magic Wand` tool so far into alpha channel
    data. You can probably refine this mask faster by using image editing tools than
    if you try to `Shift`-click inside of progressively smaller and smaller pixel
    selection set areas!


    ![A978-1-4842-4060-1_7_Fig5_HTML.jpg](A978-1-4842-4060-1_7_Fig5_HTML.jpg)


    **Figure 7-5.** You can save your alpha channel as something like `BirdSelection`
    in the `Save Selection` dialog


    As shown in the figure, Photoshop’s menu sequence for this process is `Select
    ➤ Save Selection`. You can name your alpha channel something like `BirdSelection`
    and then click the `OK` button to create the new alpha channel, which will contain
    the selection data (grayscale) that the `Magic Wand` tool has created for you
    thus far in your masking-work process.


    To view this alpha channel, select your `Channels` palette tab, as is shown on
    the right side of Figure [7-6](#A978-1-4842-4060-1_7_Chapter.html#Fig6), and click
    the `BirdSelection` alpha channel visibility icon (it is an eye), and turn off
    the color channel visibility icons, using the main `RGB` channel, which can be
    seen at the top of your `Channels` palette.


    ![A978-1-4842-4060-1_7_Fig6_HTML.jpg](A978-1-4842-4060-1_7_Fig6_HTML.jpg)


    **Figure 7-6.** You can select `BirdSelection` in the `Channels` palette to edit
    it


    This `RGB` channel at the top of the `Channels` palette is a convenience (summary)
    channel which when selected, will operate on the red, green and blue channels
    at the same time, which I’d call a summary operation, as it applies any tool,
    or algorithm, to the three color channels in exactly the same fashion. In this
    case, that happens to be a visibility selection, or visibility deselection, more
    precisely, of your pixel color data, for the currently selected image composite
    layer.


    You can use any editing tool to clean up the black areas outside of the black
    bird outline, including an eraser or brush tool (set to use white). The fastest
    way to remove large, black areas is to outline a rectangle over the area that
    you want to remove, which will select that area, as is shown in Figure [7-7](#A978-1-4842-4060-1_7_Chapter.html#Fig7),
    and then use the `Edit ➤ Fill` menu sequence, after you have set the `Fill` contents
    to a color value of `White`.


    ![A978-1-4842-4060-1_7_Fig7_HTML.jpg](A978-1-4842-4060-1_7_Fig7_HTML.jpg)


    **Figure 7-7.** To remove large black areas, select the content and go to `Edit
    ➤ Fill ➤ White`


    You can remove all of the black pixels on the outside of your black bird outline,
    using the `Fill`, `Eraser` or `Brush` tools, so that you create a clean delineation,
    between black and white pixels, as can be seen in Figure [7-8](#A978-1-4842-4060-1_7_Chapter.html#Fig8).


    ![A978-1-4842-4060-1_7_Fig8_HTML.jpg](A978-1-4842-4060-1_7_Fig8_HTML.jpg)


    **Figure 7-8.** After the outside of mask is clean, use `Image ➤ Invert`


    Once your general masking areas are cleaned up, you will invert the selection.
    This will then select the bird—currently, everything except for the bird itself
    is what has been selected as that is the easy way to do masking: in reverse. Sometimes
    in digital imaging, the best way to approach a work process is in an exact opposite
    way of what you might have thought was the best approach! Masking is a perfect
    example of this, as you select what you don’t want, and then flip (invert) the
    selection to grab what you do want!


    The `Invert` function can be located by using the `Image ➤ Adjustments ➤ Invert`
    menu sequence, as you can see highlighted in blue at the top left portion of Figure
    [7-8](#A978-1-4842-4060-1_7_Chapter.html#Fig8).


    Once you invert your selection, the fine-tuning stage of mask editing begins.
    This stage is when you will begin to work on the edges of your mask. The mask’s
    edge is its most important area, as the edge quality is what will affect the perceived
    quality of your mask. This is important when you use your masked object in a layer
    of one of your digital image composites, to combine the pixels of the mask with
    the rest of the digital image composite’s layers.'
