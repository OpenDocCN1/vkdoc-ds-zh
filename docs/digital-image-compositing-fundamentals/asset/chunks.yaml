  trans: '

    # 在 GIMP 中使用图层：基础合成


    让我们通过右键单击上下文菜单的工作流程在 GIMP 中添加新图层。右键单击浅蓝色的 `RingElement` 图层，如图 8-10 所示，然后选择 `New
    Layer` 以打开 `New Layer` 对话框。将图层命名为 `TextLayer`，并将 `Layer Fill Type` 设置为 `Transparency`。此对话框会将图层大小设置为与文档大小设置相等。这与您在
    Photoshop 中创建新图层的第一步相同。


    ![A978-1-4842-4060-1_8_Fig10_HTML.jpg](img/A978-1-4842-4060-1_8_Fig10_HTML.jpg)


    图 8-10.


    要在 GIMP 中添加新图层，请右键单击 `RingElement` 图层并选择 `New Layer`


    您在 Photoshop 中执行的下一步是单击 `T` 图标（GIMP 使用的是 `A`）来添加文本，选择 `Vertical Type` 工具，然后输入单词“COMPOSITING”。由于
    GIMP 没有 `Vertical Text` 工具，为了获得类似的结果，您必须在输入每个字母后按下 `Enter` 键。如图 8-11 所示，您可以使用类似的拾色器对话框设置金色。您可以在屏幕右下方的
    `Tool Options` 下设置字体、样式、抗锯齿和行间距。


    ![A978-1-4842-4060-1_8_Fig11_HTML.jpg](img/A978-1-4842-4060-1_8_Fig11_HTML.jpg)


    图 8-11.


    要在 GIMP 中输入文本，请单击 `A` 图标，选择 `Text tool` 选项，将颜色设置为金色，然后输入文本


    您在 Photoshop 中做的下一件事是添加 `Inner Shadow` 效果，使其看起来像是文本从图像中剪裁出来。GIMP 没有像 Photoshop
    CS6 那样的 `Layer Styles`，因此我将在第 9 章中介绍像素混合模式时向您展示如何创建阴影。


    如图 8-11 所示，当您创建文本时，GIMP 会为您创建图层，因此您将不需要 `TextLayer`！我只是想向您展示如何在该程序中创建一个新图层，以便您知道如何操作。如图中所示，这样做的一个方便之处在于，GIMP
    的 `Text` 工具会自动为您设置文本图层的大小（宽度和高度）。


    GIMP 也没有调整图层功能，因此我将向您展示一种不同的（非破坏性）工作流程，使用可以模拟此最终结果的功能。


    要在 GIMP 中删除图层，请右键单击 `TextLayer`，然后从出现的下拉菜单中选择 `Delete Layer`，如图 8-12 所示。


    ![A978-1-4842-4060-1_8_Fig12_HTML.jpg](img/A978-1-4842-4060-1_8_Fig12_HTML.jpg)


    图 8-12.


    右键单击 `TextLayer`，然后选择 `Delete Layer`


    要对您的 `Niki` 图像实施非破坏性编辑，请右键单击 `Niki.png` 图层并选择 `Duplicate Layer` 菜单选项，如图 8-13 所示。将新图层命名为
    `Niki Black & White`。此工作流程将保持 `Niki.png` 图层中的原始颜色数据完好无损，允许您将这个黑白 `Niki` 图层变成一个包含其各自独立图层中去饱和图像数据的图层。


    ![A978-1-4842-4060-1_8_Fig13_HTML.jpg](img/A978-1-4842-4060-1_8_Fig13_HTML.jpg)


    图 8-13.


    右键单击 `Niki.png` 图层并选择 `Duplicate Layer`


    重命名复制的图层，方法是双击新图层的名称以使其可编辑。结果如图 8-14 所示。


    ![A978-1-4842-4060-1_8_Fig14_HTML.jpg](img/A978-1-4842-4060-1_8_Fig14_HTML.jpg)


    图 8-14.


    使用 `Colors ➤ Hue-Saturation` 对 `Niki Black & White` 图层进行去饱和处理


    然后使用 `Colors ➤ Hue-Saturation` 菜单序列，打开 `Hue-Saturation` 对话框，以便您可以移除任何颜色饱和度，如图
    8-15 所示。


    ![A978-1-4842-4060-1_8_Fig15_HTML.jpg](img/A978-1-4842-4060-1_8_Fig15_HTML.jpg)


    图 8-15.


    将 `Saturation` 滑块设置为 `-100` 以进行去饱和处理


    `Hue-Saturation` 对话框允许您调整 `Hue`（色温）、`Lightness`（图像中白色或黑色的程度）和 `Saturation`（颜色相对于黑色或白色的量），从而完全控制图像图层的颜色。


    如果您确保选中对话框底部的 `Preview` 选项，则可以在移动每个滑块时实时查看所选图层中滑块设置的结果，以便您可以微调或“调整”结果，直到它完全符合您的预期为止。


    如图 8-16 所示，您已经使用 GIMP 图层实现了与在 Photoshop 中基本相同的最终结果，只是文本图层内部没有投影。


    ![A978-1-4842-4060-1_8_Fig16_HTML.jpg](img/A978-1-4842-4060-1_8_Fig16_HTML.jpg)


    图 8-16.


    现在您在 GIMP 中得到了相同的去饱和结果


    在下一章介绍混合模式时，您将学习如何使用 GIMP 创建这些阴影。这些模式对于创建逼真的投影效果是必需的，因此，本书各章主题的顺序再次完美契合。


    ## 总结


    在本章（第八章）中，我们回顾了如何使用图层来组织使用 Photoshop 和 GIMP 的数字图像合成。我们查看了 Photoshop 和 GIMP 中的基本图层菜单，以了解这些软件包支持哪些图层功能，并观察到高级图层功能是区分
    Photoshop CS6 和 GIMP 2.8.14 的领域之一。


    您学习了如何在 Photoshop 中创建新图层以及如何向图层添加垂直文本对象。您还学习了如何在 Photoshop 中创建和应用图层样式，以及如何使用 Photoshop
    创建和应用调整图层。


    然后，我们介绍了如何使用不同的工作流程在 GIMP 中创建完全相同的合成。您使用水平文本工具创建了垂直文本，并学习了如何通过使用标准图层（而不是使用调整图层）来应用非破坏性编辑，因为
    GIMP 2.8 版本不支持调整图层。


    在第 9 章中，您将学习更多关于混合模式如何与图层及图层功能在数字图像合成中协同工作的知识，因为这两者是相辅相成的。在 Photoshop CS6 和 GIMP
    2.8 中，您也可以使用图层调板访问混合模式。


    # 数字成像算法：混合模式


    既然您已经学会了如何在数字图像合成流程中使用图层，在本章中，我们将深入探讨并查看每个图层中包含的混合模式功能。这些混合模式在 GIMP 和 Photoshop
    中都存在，它们提供了跨不同图层组合像素的算法功能。这些混合算法最初由 Thomas Porter 和 Tom Duff 创建，在 Android API 中，混合模式实际上是
    `PorterDuff` 类的一部分，该类以这两人的名字命名。


    除了这些像素混合算法现在已可用于 Android 5 API 之外，Porter-Duff 模式也可在 JavaFX API 中使用，这意味着它们现在也包含在
    Java 7、Java 8 和 Java 9 中。最近，它们也被添加到 HTML5 中，使用了 CSS3 和 JavaScript，因此它们非常值得学习，特别是如果您有兴趣使用所有这些流行的开源软件开发平台来制作交互式新媒体内容。


    如果您想学习如何在 Java 代码中使用混合模式，而不仅仅是在数字图像合成软件内部，我有多本涵盖此内容的书，包括《Beginning Java 8 Games
    Development》（2014 年）、《Pro Android Graphics》（2013 年）和《Pro Java Games Development》（2016
    年），所有这些都由 Apress 出版。

    '
- fmt: '# Pixel Blending: Porter Duff Modes Theory


    I am only calling these pixel transfer and pixel blending modes “Porter Duff”
    here because I’m a programmer, and so that you’ll know what they are and where
    they came from. Although they’re called this in Android (programming), they’re
    not in Photoshop and GIMP, so the term is really just something for you to throw
    out in industry conversations to make yourself look super knowledgeable. These
    modes are usually called blending modes, or transfer modes, or sometimes layer
    modes, or compositing modes.


    Porter Duff modes are applied in digital imaging software using layers that are
    set to one of the modes—the default being “normal.” As you might imagine, the
    default pixel combination (blending) mode uses no algorithm at all, so keeping
    it on the normal setting means that no pixel blending algorithm is applied.


    It is important to note that alpha channel data will still be applied, though,
    as it defines translucency, and is always factored into your compositing pipeline,
    whether your blending mode is set to normal or some other pixel blending algorithm.


    Alpha channels define straight (normal) opacity and are not a complex algorithmic
    way of blending pixel colors in order to change their actual color values. Alpha
    allows a per-pixel fade between your image plate (layer) and what’s underneath
    it, so it uses simple mathematics, at least compared to the complex algorithms
    that are used in these blending and transfer modes.


    This means that you can use your alpha to control where a blending mode is applied
    on a pixel-by-pixel basis as well as have 256 levels (8 bits) of control over
    how much of this blending is applied. So your alpha channel and opacity slider,
    which controls all pixel fading at the same time (seen at the top right side of
    the screen in Figure [9-1](#A978-1-4842-4060-1_9_Chapter.html#Fig1)), can be used
    to fine-tune the application of your blending mode.


    ![A978-1-4842-4060-1_9_Fig1_HTML.jpg](A978-1-4842-4060-1_9_Fig1_HTML.jpg)


    Figure 9-1.


    If you select the mode drop-down menu in Photoshop, you can view all of the available
    modes


    As you will see, these layers are getting to be more and more complex, as you
    have to keep a growing number of things in mind, such as the alpha channel, blending
    mode, layer opacity, layer masking, layer styles (special effects sub-layer),
    layer adjustments, and the color channels that make up your pixel data, to name
    a few.


    This is why I use the term “modal” to describe how one works in digital image
    compositing software and the Photoshop tool being used. What happens in your composite
    preview is directly related to the setting for a number of the operational modes,
    such as the tool you are using, that tool’s options, the layer that is currently
    selected, the blending algorithm that is selected, and so forth. We’ll be looking
    at the modality of digital imaging software in the next chapter, as being aware
    of all of these modes is the key to your success as a compositor.


    ## Photoshop Blending: Blending Modes Supported


    Let’s open the Photoshop file from [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html),
    if it’s not open on your desktop already. Once you do so, click the Blending Mode
    menu (the down-arrow drops the menu down) at the top of the Layers palette, as
    shown in Figure [9-1](#A978-1-4842-4060-1_9_Chapter.html#Fig1). As you will see,
    Photoshop has five groups of blending modes. The Normal (no mode applied) and
    Dissolve (random pixel color transfer) modes are at the top, as they don’t use
    any pixel blending algorithm. The next section describes modes that result in
    a darkening effect; the section after that outlines modes that result in a lightening
    effect; the section that follows lists those modes that mix pixels to provide
    special effects; and the section after that outlines the modes that provide basic
    mathematical Boolean algorithms. A final section describes modes which will create
    special effects by transferring pixel color attributes.


    As you can see in Figure [9-1](#A978-1-4842-4060-1_9_Chapter.html#Fig1), I selected
    the Screen mode, so that you can view this effect, which turns your colored text
    into a screen, so that some of the details of the layer behind it can be seen
    as part of your colored text object. These modes can add some very subtle and
    professional details to your image compositing pipeline as well as some crazy
    special effects, as you’ll see during the chapter as we look at some of these
    algorithmic blending and transfer modes.


    Photoshop has 26 blending mode algorithms. Let’s take a look at GIMP next to see
    how many of these blending modes the program supports for your digital image compositing.


    ## GIMP Blending: Blending Modes Supported


    To get started, open the `Chapter8usingLayers.xcf` file using GIMP, which can
    be seen in Figure [9-2](#A978-1-4842-4060-1_9_Chapter.html#Fig2). As you will
    notice, GIMP has fewer blending mode features than Photoshop, but again the core
    blending and transfer modes that are needed for image compositing are all there.
    They’re grouped in a different way, with lighten, darken, mix, Boolean, then color-based
    modes, which can be used to create image effects. Just like you access them in
    Photoshop CS, these blending modes can be accessed at the top of the Layer menu
    in GIMP. I’ve dropped down the Mode menu in GIMP in the Figure [9-2](#A978-1-4842-4060-1_9_Chapter.html#Fig2),
    so that you can see the twenty modes (six short of Photoshop) that GIMP currently
    supports. I would guess that the other six algorithms are patented and will not
    show up in GIMP 3.0 until after those patents expire.


    ![A978-1-4842-4060-1_9_Fig2_HTML.jpg](A978-1-4842-4060-1_9_Fig2_HTML.jpg)


    Figure 9-2.


    If you select the mode drop-down in GIMP, you can view all of the available modes


    Besides Normal (no blending mode algorithm is applied), the most commonly used
    modes include the Multiply mode, which we will be using in the next section to
    apply shadows, as well as the Screen, Overlay, Soft Light, and math Boolean transfer
    modes (Addition, Subtract, Divide, and Difference). The best way to see what these
    do is to experiment with using them! You could do this using the colored Text
    object layer, and (or) use them in conjunction with your `RingElement` object
    layer.


    Try different modes for each (or both) of the layers to see how they interact
    with both the Black & White Niki layer and the truecolor Niki layer. To get the
    truecolor layer in Photoshop, turn off the adjustment layer visibility (eye icon).
    For GIMP, both the Niki layers can be toggled on and off, using this layer visibility
    (eye) icon as well.


    As you can see, GIMP includes all the foundational modes that you’ll need to create
    digital image composite effects. I promised to show you how to create drop shadow
    effects in GIMP, so let’s get that out of the way next, using the Multiply mode.'
