  trans: '

    ### 使用成像软件：确定分辨率


    要在 Photoshop 中查看数码图像的分辨率，需使用 `图像 ➤ 图像大小` 菜单序列，如图 2-1 所示。


    ![A978-1-4842-4060-1_2_Fig1_HTML.jpg](img/A978-1-4842-4060-1_2_Fig1_HTML.jpg)


    图 2-1. 在 Photoshop 中使用 `图像 ➤ 图像大小` 菜单序列


    GIMP 拥有不同的图像大小对话框，如图 2-2 所示。该对话框会显示图像大小（数据体积）、尺寸、宽度、高度、DPI（每英寸像素数），并提供重采样（缩放）选项，我们将在第
    3 章中介绍。


    ![A978-1-4842-4060-1_2_Fig2_HTML.jpg](img/A978-1-4842-4060-1_2_Fig2_HTML.jpg)


    图 2-2. GIMP 图像大小对话框显示图像大小和尺寸


    对话框中还有一个“减少杂色”选项，缩放操作总会引入杂色，这支持了我在本章前面提出的观点：应使内容分辨率与设备的屏幕尺寸或物理硬件屏幕像素分辨率相匹配。


    这样做将确保你的数码图像合成项目和数码图像获得最高质量的视觉效果。


    现在，让我们看看开源软件包 GIMP 2.8.14 中的图像分辨率功能，如图 2-3 所示。如你所见，图像的统计信息直接显示在 GIMP 数码图像合成软件包顶部的标题栏中，无需打开任何对话框。


    ![A978-1-4842-4060-1_2_Fig3_HTML.jpg](img/A978-1-4842-4060-1_2_Fig3_HTML.jpg)


    图 2-3. GIMP 在其标题栏中显示图像的统计信息


    这些统计信息包括颜色深度（我们将在第 5 章中介绍）、该合成图中的图层数量（我们将在第 8 章中介绍）以及图像的分辨率，采用 `WxH` 格式，本例中为 240x180
    像素。


    如果你想知道这些截图为何包含 14 个图层，那是因为我打开的文件是 GIF 动画（或 aGIF）格式，因此每个动画单元都位于不同的图层上。本例中，该数码图像（或
    3D 动画）文件数据格式包含我的 3D 动画 Mind Taffy Design 徽标。


    GIMP 确实有一个可用于查看图像分辨率并将其缩放至新分辨率的对话框，名为 `缩放图像` 对话框。


    该对话框可在屏幕左上角的 `图像` 菜单下找到，如图 2-3 所示。如果你想查看它，请执行 `图像 ➤ 缩放图像` 菜单序列。


    GIMP 也将其 `图像大小` 对话框称为 `缩放图像` 对话框，如图 2-4 所示。它允许你通过几种不同的插值（缩放）算法来选择质量。


    ![A978-1-4842-4060-1_2_Fig4_HTML.jpg](img/A978-1-4842-4060-1_2_Fig4_HTML.jpg)


    图 2-4. GIMP 的 `缩放图像` 对话框


    我们将在第 3 章中介绍缩放时讨论宽高比。缩放是一个非常重要的考量因素，这就是为什么我们要将图像的像素分辨率与目标设备的屏幕分辨率相匹配，以便设备或平台不会替我们进行缩放，因为这样做会降低质量。


    你应始终掌握数码图像资产的缩放（也称为重采样）控制权，这样才能向观众保证最高的质量水平。


    你可能想到，图像的分辨率与其存储大小（数据体积）之间存在关系。由于图像的像素需要被存储，像素越多，系统内存中保存它们所需的数据量就越大。这似乎显而易见，但我想还是说明一下。


    ### 总结


    在本第二章中，我们了解了容纳图像像素的 x,y 像素阵列显示结构，并学习了数码图像分辨率的概念。我们探讨了计算数码图像中包含像素数量的数学原理，并考察了如何在两个最广泛使用的数码图像合成软件包——Photoshop
    CS6 和 GIMP 2.8.14 中确定图像分辨率。我们了解到，这两个软件包都允许你通过一个称为重采样或缩放的过程来更改图像分辨率，该过程使用插值算法。我们将在下一章中更详细地研究这个过程。


    我们还将探讨由 x,y 像素阵列的分辨率参数定义的图像形状，即图像宽高比的概念。最后，我们还将介绍如何正确地进行图像缩放而不失真，以及如何通过裁剪图像（而非缩放）来控制宽高比。


    ## 数码成像的形状：宽高比


    现在你已经了解了图像分辨率以及如何计算构成光栅图像的像素数量，是时候考虑数码图像的形状（矩形或正方形）了。数码图像的形状，行业术语称为“宽高比”，其重要性可能超乎你的想象，尤其是在你通过图像缩放（称为重采样）或图像裁剪来改变它的时候。


    为了防止图像失真，不应以任何方式操纵或改变宽高比。充分了解宽高比将确保你不会扭曲数码图像，这就是为什么本章对于你的数码图像合成知识体系极其重要。


    在探讨计算宽高比所涉及的数学原理之后，我们将研究如何“锁定”该比例。锁定宽高比可以消除图像缩放过程中的失真，无论是向上采样（放大图像分辨率）还是向下采样（缩小图像分辨率）。你也可以通过裁剪来避免失真，即从数码图像的顶部、底部和两侧移除像素。


    ### 宽高比：2D 中的像素比例


    数码图像中包含的像素数量称为分辨率，而数码图像中 x 与 y 的比例则称为宽高比。宽高比是图像分辨率中一个更复杂的方面（无意双关），因为它是宽度与高度的比值，即
    w:h，体现在图像分辨率规格中，或者在谈论图像的 x 轴和 y 轴时表示为 x:y。


    宽高比定义了数码图像的形状，也适用于设备显示屏的形状。例如，智能手表拥有方形屏幕，而宽屏 iTV 电视则拥有矩形屏幕。在本章中，我们将探讨如何根据这些不同的屏幕形状来更改宽高比。


    1:1 宽高比的数码图像（或显示屏）可以说是完美的正方形。根据定义，1:1 宽高比等同于 2:2 或 3:3 宽高比。需要注意的是，正是这两个数字之间的比例（而非数字本身）定义了图像或屏幕的形状，这就是它被称为宽高比的原因，尽管通常简称为宽高。


    2:1 的宽高比属于宽屏宽高比，而 3:1 的宽高比则可称为全景宽高比。

