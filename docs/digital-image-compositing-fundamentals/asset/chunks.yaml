- fmt: '# Layer Visibility: Selecting Which Pixels Will Be Saved


    Before we look at GIMP data footprint optimization, which will follow the same
    principles, as it uses the same image codecs, I wanted to show you a principle
    that holds across both Photoshop and GIMP. I am only going to show you this principle
    for Photoshop, as the same exact principle will work using GIMP.


    As you may have surmised on your own, the `Save for Web` (Photoshop) and `File
    Export` (GIMP) engines will only save data from visible layers into your image
    files. So if you wanted to save a `PNG-32` with the image of Niki inside of the
    ring to use elsewhere, you would turn off `Textlayer`, `Special Effect Color Blend`,
    `Black & White`, `Plug-In Filter Effect`, and `Effects` (the `RingElement` sub-layer),
    as can be seen in Figure [13-6](#A978-1-4842-4060-1_13_Chapter.html#Fig6).


    ![A978-1-4842-4060-1_13_Fig6_HTML.jpg](A978-1-4842-4060-1_13_Fig6_HTML.jpg)


    Figure 13-6.

    You can turn off layers whose data you don’t want to appear in the final image
    file export operation


    This will create a wine-colored metal ring to encircle Niki, perfectly masked
    on top of a transparency, as can be seen in both Figure [13-6](#A978-1-4842-4060-1_13_Chapter.html#Fig6)
    and in the Photoshop `Save for Web` preview, shown in Figure [13-7](#A978-1-4842-4060-1_13_Chapter.html#Fig7),
    as I’m exporting in a `PNG-32` file format.


    ![A978-1-4842-4060-1_13_Fig7_HTML.jpg](A978-1-4842-4060-1_13_Fig7_HTML.jpg)


    Figure 13-7.

    Select `PNG-24` and `Transparency` to create a `PNG-32`


    If you check off the `Transparency` option, as seen in Figure [13-7](#A978-1-4842-4060-1_13_Chapter.html#Fig7),
    the alpha channel will appear as a checkerboard pattern, just like in Photoshop.
    If you don’t select this option, the exported image will use a white background
    color.


    At this point, you are probably wondering to yourself, What if I’d left the `Drop
    Shadow Layer` style selected before I chose `Save for Web`? We are going to take
    a look at that next, in order to see if Photoshop will put transparency data from
    the `FX` settings dialog into an alpha channel for us. I think you will be pleased
    with the results!


    To take a look, select your `Drop Shadow Effects` visibility eye icons, and turn
    the `RingElement` drop shadow effect back on, as seen underneath your gray (selected)
    `RingElement` layer, on the right-hand side of the screen in Figure [13-8](#A978-1-4842-4060-1_13_Chapter.html#Fig8).


    ![A978-1-4842-4060-1_13_Fig8_HTML.jpg](A978-1-4842-4060-1_13_Fig8_HTML.jpg)


    Figure 13-8.

    In order to add a drop shadow to the `PNG32`, select your `Drop Shadow Effects`
    visibility icons


    As you can see in the `Save for Web` dialog in Figure [13-9](#A978-1-4842-4060-1_13_Chapter.html#Fig9),
    the drop shadow has the subtle transparency you were hoping it would, so this
    transparent object will indeed carry its own shadow with it.


    ![A978-1-4842-4060-1_13_Fig9_HTML.jpg](A978-1-4842-4060-1_13_Fig9_HTML.jpg)


    Figure 13-9.

    To create a `PNG-32`, select `PNG-24` and `Transparency`


    If you’re going to create the additional special effect, be sure to add a dozen
    or so pixels of height to the bottom of the image size, so that the bottom of
    your drop shadow effect does not get cut off.


    As you have already learned, this should be accomplished by using the `Canvas
    Size` function, not the `Image Size` function, which scales the image, and which
    would just make the cut-off shadow artifact (mistake) larger and more noticeable.


    Using `Canvas Size` makes the canvas larger, so that the bottom of the drop shadow
    special effect has the room (pixels) it needs to render the complete drop shadow
    including the fade out portion which makes it look more realistic.


    Now we’re ready to take a look at GIMP’s `File ➤ Export As` work process, which
    is quite different from Photoshop’s.


    ## GIMP Optimization: File ➤ Export As


    Saving files, or “exporting” files, as it is called in GIMP, is in no way as intuitive
    as it is in Photoshop. However, if you know how the GIMP file export system works,
    you can do just about anything that you can do in Photoshop, by using the GIMP
    `File ➤ Export As` menu sequence.


    Let’s see how file exporting works in GIMP, by opening the `Chapter12compositing.xcf`
    file, which can be seen in Figure [13-10](#A978-1-4842-4060-1_13_Chapter.html#Fig10).
    Then, follow the `File ➤ Export As` menu sequence to bring up an `Export Image`
    dialog, which is quite similar to the `File Save` dialog of any standard operating
    systems, except that it has a button labeled `Export`, instead of `Save`.


    ![A978-1-4842-4060-1_13_Fig10_HTML.jpg](A978-1-4842-4060-1_13_Fig10_HTML.jpg)


    Figure 13-10.

    To bring up the `Export Image` dialog in GIMP, use the `File ➤ Export As` menu
    sequence


    If you use `File ➤ Save` or `File ➤ Save As` in GIMP you will be saving the GIMP
    image compositing project itself, which uses the `.XCF` file extension, which
    is native to GIMP and not supported on many (if any) other platforms, even open
    source ones such as `HTML5`, `Java`, `JavaFX`, or `Android Studio`.


    The `Export Image` dialog will select an image file format codec based on the
    `File Name` extension. Let’s call the `PNG-24` format file `Chapter12compositing.png`,
    as is highlighted in Figure [13-11](#A978-1-4842-4060-1_13_Chapter.html#Fig11).


    ![A978-1-4842-4060-1_13_Fig11_HTML.jpg](A978-1-4842-4060-1_13_Fig11_HTML.jpg)


    Figure 13-11.

    To export a file in GIMP, enter `filename.png`, select your desired options, and
    then hit the `Export` button


    The way GIMP knows whether to use `PNG-24` or a `PNG-8` is that it looks at the
    `Color Mode` setting for your composite, which we covered in [Chapter 5](#A978-1-4842-4060-1_5_Chapter.html),
    and is found under the `Image` menu, and then under the `Mode` sub-menu.


    Once you hit the `Export` button, it will open the `File Format Options` dialog—in
    this case `Export Image as PNG`—allowing you to select the options and `Compression
    Level` that you wish to use, as shown in Figure [13-11](#A978-1-4842-4060-1_13_Chapter.html#Fig11)
    on the bottom-right hand side.


    As you can see in the figure, I selected the `Save Color Values from Transparent
    Pixels` and set the maximum compression level of `9`, leaving the other options
    unselected to save on the data footprint for the file, as these are not necessary
    for the application I am using the digital image composite for.


    Notice at the bottom right of Figure [13-11](#A978-1-4842-4060-1_13_Chapter.html#Fig11)
    that you can also save and load default settings, so if you have certain option
    combinations, you can save these using unique file names if you like. Then you
    don’t have to be checking option checkboxes all of the time during this stage
    of your image data footprint optimization work process.


    To save a file as a `GIF`, simply change the extension to `.gif` and click the
    `Export` button. If you’re using `Truecolor` mode, GIMP will convert the file
    to indexed color and give you the `Export Image as GIF` settings dialog, shown
    in Figure [13-12](#A978-1-4842-4060-1_13_Chapter.html#Fig12). I got this error
    dialog as well, seen in the upper-right corner of the figure, so I selected the
    `Crop` option to trim the unused transparency.


    ![A978-1-4842-4060-1_13_Fig12_HTML.jpg](A978-1-4842-4060-1_13_Fig12_HTML.jpg)


    Figure 13-12.

    To save a file as a `GIF`, enter `filename.gif`, select your desired options,
    and then click `Export`


    If you want to save the file as a `JPEG`, change the extension to `.jpg`, click
    the `Export` button, and set the options in the `Export Image as JPEG` dialog,
    shown on the right-hand side of Figure [13-13](#A978-1-4842-4060-1_13_Chapter.html#Fig13).
    Check off the `Show Preview in Image Windows` box to see a preview of your settings
    just like you would (and need to) with Photoshop’s `Save for Web` function.


    ![A978-1-4842-4060-1_13_Fig13_HTML.jpg](A978-1-4842-4060-1_13_Fig13_HTML.jpg)


    Figure 13-13.'
