  trans: '

    接着，选中 `Niki Black & White` 图层并设置图层混合模式为“`颜色加深`”，如图 12-4 所示。这会产生一种彩色玻璃效果，即在将颜色底板像素传递给“`滤镜特效`”图层中的“`明度`”模式进行进一步处理之前，先对其进行过滤。


    ![A978-1-4842-4060-1_12_Fig4_HTML.jpg](img/A978-1-4842-4060-1_12_Fig4_HTML.jpg)


    图 12-4.


    若要创建彩色玻璃效果，请选中 `Niki Black & White` 图层并选择“`颜色加深`”图层混合模式


    现在你开始明白，利用本书中我逐章添加的所有内容，如何通过现代合成引擎（借助软件）建立一个相当复杂的像素处理流程。


    需要注意的是，你同样可以通过代码来完成所有这些数字图像合成流程中的像素处理，使用的工具包括 `Android Studio`、`Java JDK`、`JavaFX
    8`、`HTML5`、`iOS`、`C#`、`JavaScript`，甚至 `CSS3`。


    接下来，让我们为当前的合成处理流程增加更多处理，并淡化上一步获得的彩色玻璃效果。我们将再次使用图像合成流程中的“`不透明度`”引擎（滑块）组件来实现。


    这一次，我们将利用图层的“`不透明度`”功能，将之前的特效与新的特效进行“混合”，这为我们提供了另一种微调结果的方法。


    这将在我们寻求的两种效果之间达成一种视觉上的妥协，从而得到完美的最终视觉效果。


    首先，确保仍选中 `Niki Black & White` 图层，然后将“`不透明度`”滑块向左拖动，设置到 `60%`，或者在用户界面的数字输入组件中输入
    `60.0`，该输入组件在图 12-5 中 `图层` 选项卡右上角以红色圆圈标出。


    ![A978-1-4842-4060-1_12_Fig5_HTML.jpg](img/A978-1-4842-4060-1_12_Fig5_HTML.jpg)


    图 12-5.


    你可以通过将图层“`不透明度`”设置为 `60%` 来减弱“`颜色加深`”模式的效果


    这实质上会将两个图层“混合”在一起，并得到如图 12-5 所示的结果。图像包含了一些通过在 `Niki Black & White` 图层中使用“`颜色加深`”模式而产生的强化颜色，其中
    60% 的颜色随后会由“`滤镜特效图层`”模式实现的“`明度`”模式进行处理。


    现在，让我们从图层的底部（底板或背景图像）向上审视整个合成流程，看看究竟发生了什么。`Niki.png` 是底板 `PNG24` 图像，其图层混合模式设置为“`正常`”（无混合），“`不透明度`”设置为
    `100%`。


    `Niki Black & White` 图层通过图层蒙版中的白色像素处理黑白像素图像。这使得其下方的彩色像素能够穿过蒙版的黑色区域，并仅使用蒙版的白色区域将“`颜色加深`”模式算法应用于彩色底板像素。


    你的“`滤镜特效`”图层使用相同的蒙版，以 `100%` 强度（“`不透明度`”）的“`明度`”模式处理了 60% 的“`颜色加深`”模式结果，并将处理结果向上传递给
    `RingShadow` 图层。该图层大部分是透明的（包含 Alpha 通道）。它使用几个经过运动模糊处理的像素来应用阴影效果，这些像素以 `70%` 强度（或“`不透明度`”）的“`变暗`”模式进行处理，然后向上传递给
    `RingElement` 图层。


    `RingElement` 图层使用 Alpha 通道，在不使用任何混合模式且“`不透明度`”（或像素强度）为 `100%` 的情况下，将色调偏移的葡萄酒色金属环叠加在底部四个图层之上。


    “`合成文本`”图层也使用 Alpha 通道，使用“`强光`”混合模式，以 `100%` 的“`不透明度`”（或像素强度）将文本叠加在底部五个图层上。


    `Shadow` 投影效果图层使用 Alpha 通道和“`正片叠底`”模式，以 `100%` 的“`不透明度`”（或强度），将“`内阴影`”效果叠加在“`合成文本`”图层之上。


    尝试将这些图层及其 Alpha 通道（或蒙版）、混合模式、“`不透明度`”设置以及像素数据想象成正在通过一个数字图像算法合成流程进行处理。在脑海中形成这个过程的图像，可能有助于你理解幕后发生的事情，并将帮助你成为一名更出色的数字图像合成师。

    '
- fmt: '# Photoshop Compositing: Using Layers


    Since Photoshop has a different codebase and compositing pipeline features than
    GIMP, we have to approach adding these new features to your digital image composite
    in a different way. The first thing that you want to do is to duplicate the `Niki`
    layer, along with its layer mask, by selecting it and then using the `Layer ➤
    Duplicate Layer` menu sequence. This will open the `Duplicate Layer` dialog, seen
    in Figure [12-6](#A978-1-4842-4060-1_12_Chapter.html#Fig6), where you will name
    the layer `Special Effect Color Blend`, which is what the layer function will
    provide once you set-up the layer. Then, click the `OK` button and create the
    new layer, to control your fine-tune color blending for your special effect.


    ![A978-1-4842-4060-1_12_Fig6_HTML.jpg](A978-1-4842-4060-1_12_Fig6_HTML.jpg)


    Figure 12-6. Name your layer “Special Effect Color Blend” using the `Duplicate
    Layer` dialog


    You want to control color saturation blending outside of your Ring, so invert
    the layer mask, as shown in Figure [12-7](#A978-1-4842-4060-1_12_Chapter.html#Fig7).


    ![A978-1-4842-4060-1_12_Fig7_HTML.jpg](A978-1-4842-4060-1_12_Fig7_HTML.jpg)


    Figure 12-7. To control color saturation blending outside the ring, invert your
    `Special Effect Color Blend` layer mask


    Remember that you can select the layer mask inside of a specific layer, as can
    be seen in Figure [12-7](#A978-1-4842-4060-1_12_Chapter.html#Fig7), using the
    white outline, featuring four corner areas. After you select this and use the
    `Image ➤ Adjustments ➤ Invert` menu sequence, you will see that your layer mask
    has been inverted, as shown in Figure [12-8](#A978-1-4842-4060-1_12_Chapter.html#Fig8),
    and that it is now affecting the outside area of your `Ring Element`, instead
    of the inside area. If you were to leave this layer at the `Normal` blending mode,
    with `100% Opacity`, using this layer would not be necessary, as you would simply
    manipulate your adjustment layer to blend color in. You are going to attach an
    advanced mode and opacity to it later on, to simulate what we did using GIMP `2.8.14`
    earlier in the chapter.


    ![A978-1-4842-4060-1_12_Fig8_HTML.jpg](A978-1-4842-4060-1_12_Fig8_HTML.jpg)


    Figure 12-8. Add an adjustment layer to the `RingElement` layer


    The next steps you need to take are to select the `Ring Element` layer, set the
    `Normal` mode, and color shift the color to be a Wine color. This is done non-destructively
    in Photoshop using an adjustment layer. Use the `Layer ➤ New Adjustment Layer
    ➤ Hue-Saturation` menu sequence, as is shown in Figure [12-8](#A978-1-4842-4060-1_12_Chapter.html#Fig8).


    Name the new layer `Ring Hue Shift 140` (referring to 140 degrees) and set the
    orange color that we’re using to denote adjustment layers.


    Be sure not to color layers just because it is fun! You should have a good reason;
    in this case, we’re highlighting the adjustment layers by using the color orange.


    Photoshop’s `Hue-Saturation` dialog is similar to GIMP’s, allowing you to drag
    the slider to a setting of `140` or enter the value directly into the numeric
    text data entry field on the right hand side.


    Next, select the `Special Effect Color Blend` layer again and set a `Color` (Value)
    mode, which GIMP calls a “Value” mode, to have an `Opacity` value of `50%`.


    This will decrease the saturation that you see on the outside of your `RingElement`
    in Figure [12-8](#A978-1-4842-4060-1_12_Chapter.html#Fig8) and give you a more
    subtle (and more professional) result.


    The result can be seen in Figure [12-9](#A978-1-4842-4060-1_12_Chapter.html#Fig9),
    along with the selected layer, and the `Mode` and `Opacity` settings, which are
    encircled in red, at the top right of the screenshot.


    ![A978-1-4842-4060-1_12_Fig9_HTML.jpg](A978-1-4842-4060-1_12_Fig9_HTML.jpg)


    Figure 12-9. You can set the `Color` mode and `Opacity` to `50%` to get special
    effects blending


    The next upgrade you did in GIMP was to make your Ring drop shadow look more realistic.
    The way to do this in Photoshop is to edit your `Drop Shadow Layer Style`, whose
    dialog is shown in Figure [12-10](#A978-1-4842-4060-1_12_Chapter.html#Fig10).
    Since we used the `Darken Only` mode in GIMP, we will select the equivalent `Darker
    Color` blend mode, using the drop-down menu, and match the `60% Opacity` setting
    that we used in GIMP as well. This will provide a more realistic shadow.


    ![A978-1-4842-4060-1_12_Fig10_HTML.jpg](A978-1-4842-4060-1_12_Fig10_HTML.jpg)


    Figure 12-10. To provide a more realistic shadow in Photoshop, change the `Drop
    Shadow` to use the `Darker Color` mode


    The final move that we made in GIMP was to enhance the color and contrast of your
    backplate’s special effect digital painting algorithm (filter) application by
    applying the `Burn` blend mode in the `Niki Black & White` layer above the `Niki.png`
    color layer.


    In Photoshop, we can do this by setting a `Color Burn` mode on the `Black & White`
    adjustment layer! The adjustment layer can apply its digital image adjustment
    algorithm and then run that result through the blending mode algorithm as well.
    This allows you to “stack” multiple compositing pipeline processing special effects
    into one single image compositing special effect layer.


    After all, that is what this chapter is focusing on: how to maximize the compositing
    capabilities of the digital imaging software package in order to get the maximum
    result by using the minimum amount of layers.


    In Figure [12-11](#A978-1-4842-4060-1_12_Chapter.html#Fig11), I have set the `Opacity`
    at `60%` to tone down the `Color Burn` mode algorithm application, exactly like
    I did in GIMP. As you can see, you have achieved a similarly professional result
    even though you are using a different plug-in filter to create your special effect.


    ![A978-1-4842-4060-1_12_Fig11_HTML.jpg](A978-1-4842-4060-1_12_Fig11_HTML.jpg)


    Figure 12-11. Results of setting the `Color Burn` mode and `60% Opacity` on the
    `Black & White` layer


    Let’s take a look at the compositing pipeline process from the bottom of your
    layer stack up, to see what is actually going on here under the hood. In Photoshop,
    your `Plug-In Filter Effect` is your back plate, again with the `Normal` (no)
    blending mode and `100% Opacity`. This is significantly different from how this
    composite was set up using GIMP, which is interesting to note.


    Your `Black & White` adjustment layer then creates a black-and-white pixel image
    using the `Black & White` algorithm and passes that data over to the `Color Burn`
    blend mode algorithm.


    All this intra-layer pixel pipeline processing should be applied to each pixel
    of your `Plug-In Filter Effect` layer, as prescribed by the all-white adjustment
    layer mask, which delineates a full opacity processing on all pixels in the digital
    image composite.


    The `Niki` layer essentially uses a layer mask along with a `Normal` (no blending)
    mode and `100% Opacity` to overlay imagery in a circular masked region of the
    original (unprocessed) image of the model inside (and under the edges of) the
    `RingElement`.


    The `Special Effect Color Blend` layer uses this same `Niki` image with the opposite
    (inverted) layer mask to overlay color pixels on the outside area (and under the
    edges) of the `Ring Element`.


    Setting a `50% Transparency` (blend), and processing the pixels from the layers
    underneath this layer, on the outside of the `Ring Element`, through the `Color`
    mode algorithm, allowed you to add some color to that `Black & White` special
    effect filter you applied.


    A `RingElement` layer primarily leverages an alpha channel and a `Drop Shadow
    Effects (fx)` algorithm sublayer to overlay a cyan-colored metal ring over the
    bottom four layers using the `Normal` (no blending) mode and `100% Opacity` (full
    pixel strength).


    Your `Ring Hue Shift 140` adjustment layer applies the hue-shifting algorithm
    to invoke a positive `140`-degree hue shift, as needed to reproduce the same wine
    color that you used in GIMP.'
