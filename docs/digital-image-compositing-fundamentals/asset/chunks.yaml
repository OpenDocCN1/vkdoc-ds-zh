  trans: '

    # 12. 数字影像的工作流程：合成


    在体验了插件滤镜软件（你可能余生都会乐此不疲地尝试）的乐趣后，是时候回归更高级的“引擎盖下”思考，探究数字图像合成管线的运作方式及其在系统内存中执行的操作。如果你还打算利用本书中的数字图像合成概念和技术，在
    Java、JavaFX、Android 或 HTML5 等主流平台上开展新媒体编程项目，这至关重要。作为一名程序员，我本身倾向于按此思路思考；在处理复杂的
    2D 和 3D 软件包时，了解核心处理层面的运作能带来优势，并帮助你理解软件工具正在执行（以及将要执行）的操作。


    正如优秀的程序员能编写出“紧凑”的代码，优秀的图像合成师也能在合成管线（图层堆栈）中使用更少的图层获得更高的效率。我们将在本章探讨这一点，并进一步优化我们试图实现的专业合成项目最终效果。我希望能确保你在本书结束时能完成一个相对复杂的数字图像合成项目。尽管这是一本基础级别的书籍，但我仍力求在信息和体验上都让你物超所值。


    本章我们再次从 GIMP 开始，以平衡一下学习体验，因为本书大部分章节都是从 Photoshop CS6 开始的。你将通过利用现有图层层级中尚未启用的特性，继续完善合成的视觉效果，探索仅使用七个图层能实现多少像素管线处理。我相信你一定会对仅使用
    Photoshop CS6 和 GIMP 2.8.14 中的七个合成图层所能达到的效果感到惊讶。


    ## GIMP 合成：使用图层特性


    要开始在 GIMP 2.8.14 中进行数字图像合成，请打开 `Chapter11pluginFilter.xcf` 文件，如图 12-1 所示，然后选择
    `Filter Special Effect` 图层，该图层当前包含特效像素和图层蒙版。通过将 `Normal` 模式（表示未启用任何混合模式）更改为 `Value`
    混合模式（颜色），为此图层添加混合模式。


    ![A978-1-4842-4060-1_12_Fig1_HTML.jpg](img/A978-1-4842-4060-1_12_Fig1_HTML.jpg)


    **图 12-1.** 要了解 GIMP 中图层特性的使用，首先选择 `Filter Effect` 图层并设置 `Value` 模式


    从数字图像合成管线的角度来看，这样做的效果是：从 `Filter Special Effect` 图层下方的 `Niki.png` 图层获取颜色数值，并利用图层蒙版将这些颜色数值应用到特效图层中原来为白色的区域。


    由于 `Niki Black & White` 图层被排除在像素处理管线之外（因为眼睛图标（可见性）已关闭），合成引擎会认为颜色 `Niki` 图层位于 `Filter
    Special Effect` 图层下方。因此，可见性图标不仅会影响你所看到的内容，还会影响图像软件内部合成引擎所处理的内容。


    如果你希望合成引擎在不包含颜色数据的情况下重新处理管线，只需通过开启 `Niki Black & White` 图层的可见性来屏蔽颜色数据即可。


    如果你已完成对 `Filter Special Effect` 图层的操作，还可以使用 `图层` 面板顶部的 `锁定：画笔` 和 `锁定：Alpha` 图标来锁定该图层的蒙版和像素数据。这些是模态图标，因此你必须先选择要锁定的图层（如图
    12-1 所示），然后点击这些图标中的任意一个（或本例中的两个）来锁定图层数据。当你选择不同图层时，若锁定功能已启用，图标会变为蓝色；若未启用，则保持白色。


    由于你合成的图像因使用所有这些效果而变得有些“繁杂”，让我们将 `RingElement` 图层重新设置为 `Normal`（无混合）模式，并将金属颜色偏移至酒红色，以更好地衬托金色玻璃文字图层效果。


    为此，选择 `RingElement` 图层并将模式设置为 `Normal`，如图 12-2 所示，以恢复青色金属环。接着，使用 `颜色 ➤ 色相-饱和度`
    菜单序列打开 `色相-饱和度` 对话框。将 `色相` 在色谱上偏移 140 度，创建出漂亮的酒红色，以平衡你的金色文字。


    ![A978-1-4842-4060-1_12_Fig2_HTML.jpg](img/A978-1-4842-4060-1_12_Fig2_HTML.jpg)


    **图 12-2.** 要降低图像中的色彩强度，将 `RingElement` 设置为 `Normal` 模式，并将 `色相` 偏移 140 度


    我曾在南加州大学就读，所以这种颜色组合特别吸引人。这个合成图像中接下来需要处理的问题是 `RingElement` 下方投影的真实感。为了使用混合模式添加微妙的暗化效果，选择
    `仅变暗` 模式（见图 12-3），并将 `不透明度` 设置为 70%。这将提亮阴影图层，使其看起来更加逼真。


    ![A978-1-4842-4060-1_12_Fig3_HTML.jpg](img/A978-1-4842-4060-1_12_Fig3_HTML.jpg)


    **图 12-3.** 要添加微妙的暗化效果，将 `RingShadow` 设置为使用 `仅变暗` 模式，并将 `不透明度` 设为 70%


    `不透明度` 可以通过使用数值微调器设置，也可以在 `不透明度` 级别指示条内拖动灰色区域右侧的垂直条来调整。


    既然我们正在利用现有的图层管线，让我们重新开启 `Niki Black & White` 图层，并将其用于增强背景特效中环状区域的细节。

    '
- fmt: 'Then, select the `Niki Black & White` layer and set a `Burn` mode, as shown
    in Figure [12-4](#A978-1-4842-4060-1_12_Chapter.html#Fig4). This will create a
    stained glass effect, by filtering the color backplate pixels, before passing
    them to the `Value` mode for further processing inside the `Filter Special Effects`
    layer.


    ![A978-1-4842-4060-1_12_Fig4_HTML.jpg](A978-1-4842-4060-1_12_Fig4_HTML.jpg)


    Figure 12-4.


    To create a stained glass effect, select the `Niki Black & White` layer and select
    the `Burn` layer blending mode


    Now you are starting to see how a fairly complex pixel-processing pipeline can
    be set up with a modern-day compositing engine (via software) using all of the
    things I’ve been adding on, chapter by chapter, during the course of this book.


    It is important to note that you can also do all of this digital image compositing
    pipeline pixel processing in code as well, using `Android Studio`, `Java JDK`,
    `JavaFX 8`, `HTML5`, `iOS`, `C#`, `JavaScript`, and even `CSS3`.


    Next, let’s add even more processing to your current compositing processing pipeline
    and tone down the stained glass effect that you got in the previous step. We will
    do this by again using the `Opacity` engine (slider) component of the image compositing
    pipeline.


    This time, we will use the `Opacity` capability of the layer to “blend” the previous
    special effect with the new special effect, giving us another way to fine-tune
    our result.


    This will give us a visual compromise between the two effects we are seeking,
    which should give us the perfect visual end result.


    To start, make sure the `Niki Black & White` layer is still selected and drag
    the `Opacity` slider to the left to a setting of `60%`, or enter `60.0` in the
    numeric entry component of the user interface element, shown circled in red at
    the top right of the `Layers` tab in Figure [12-5](#A978-1-4842-4060-1_12_Chapter.html#Fig5).


    ![A978-1-4842-4060-1_12_Fig5_HTML.jpg](A978-1-4842-4060-1_12_Fig5_HTML.jpg)


    Figure 12-5.


    You can subdue the `Burn` mode by setting the layer `Opacity` to `60%`


    This will essentially “mix” the two layers together and give you the result seen
    in Figure [12-5](#A978-1-4842-4060-1_12_Chapter.html#Fig5). The image has some
    of the enhanced colors created by using the `Burn` mode in your `Niki Black &
    White` layer, 60 percent of which then get processed by a `Value` mode implemented
    using the `Filter Special Effect Layer` mode.


    Now let’s take a look at the compositing pipeline process from the bottom of the
    layer (back plate or background image) up, and see what is really going on here.
    `Niki.png` is the backplate `PNG24` image, where the `Normal` blending mode (no
    blending) and `100%` `Opacity` is set.


    The `Niki Black & White` layer processes a black-and-white pixel image through
    the white pixels in a layer mask. This allows the color pixels underneath it to
    pass through the black areas of the mask and applies the `Burn` mode algorithm
    to the color back plate pixels, again using only the white areas of the mask.


    Your `Filter Special Effect` layer processes 60 percent of the `Burn` mode using
    a `Value` mode with `100%` strength (`Opacity`), using the same mask and passing
    the result up through the `RingShadow` layer. Most of this layer is transparent
    (an alpha channel). It applies a shadow effect using a few motion-blurred pixels
    that are processed using a `Darken only` mode set at a `70%` strength, or `Opacity`,
    and passes these up to the `RingElement` layer.


    The `RingElement` layer uses an alpha channel to overlay a hue-shifted wine-colored
    metal ring over the bottom four layers with no blending mode and `100%` `Opacity`,
    or pixel strength.


    The `Compositing text` layer also uses an alpha channel to overlay text on the
    bottom five layers using a `Hard Light` blend mode and `100%` `Opacity`, or pixel
    strength.


    A `Shadow` drop shadow effect layer uses an alpha channel and a `Multiply` mode,
    with `100%` `Opacity`, or strength, to overlay the `Inner Shadow` effects on top
    of the `Compositing text` layer.


    Try to visualize these layers and their alpha channel, or mask, blending mode,
    `Opacity` setting, and pixel data, as being processed through a digital image
    algorithm compositing pipeline. Forming a mental image of this process may help
    you to understand what’s happening under the hood, and will help you to become
    a better digital image compositor.'
