- fmt: 'I am going to use the Motion Blur algorithm for a few reasons: First, it’s
    Hollywood oriented; second, I will not have to move what I blur using the Move
    tool, as this algorithm will move those pixels for me; and third, I want the blur
    to run straight to the left, which is generally how a motion blur will be implemented
    (applied). Also, since the ring element touches the top and bottom edge of this
    composite, the shadow needs to be directly to your left, so that it is not cut
    off at the top or bottom of this digital image composite.


    With your `RingShadow` layer selected, follow the `Filter ➤ Blur ➤ Motion Blur`
    menu sequence to open the `Motion Blur` dialog shown on the left side of Figure
    [10-12](#A978-1-4842-4060-1_10_Chapter.html#Fig12). Then, set an `Angle` of 0,
    with a `Length` of 12 pixels of Motion Blur, and click the `OK` button. The 0–360
    degrees starts at 9 o’clock and progresses clockwise, so you want to create your
    `Angle`, and the resulting direct left setting, using the value 0.


    Now, select the `RingElement` layer, and then the `Normal` blend mode, if you
    have not done so already, as is shown at the top of Figure [10-13](#A978-1-4842-4060-1_10_Chapter.html#Fig13).
    This will allow you to see the effect of the motion blur shadowing with your solid
    blue metal ring element in place. You’ll notice what a great job this GIMP Motion
    Blur algorithm can do at creating a directional drop shadow special effect!


    ![A978-1-4842-4060-1_10_Fig13_HTML.jpg](A978-1-4842-4060-1_10_Fig13_HTML.jpg)

    *Figure 10-13.*


    To see the effect of the motion blur shadowing on your solid blue metal ring element,
    select the `RingElement` layer and the `Normal` blend mode.


    It is also important to note that we cut out a couple of steps that you did for
    the Inner Shadow effect work process, as you did not have to use the Move tool
    to position this effect!


    I just noticed that I forgot to apply the Compositing Text layer’s colored glass
    effect, as we did in Photoshop using the Hard Light mode, so next, let’s select
    the `Compositing` text layer and set the `Hard Light` mode.


    This will make the vertical text look much better, as can be seen in Figure [10-14](#A978-1-4842-4060-1_10_Chapter.html#Fig14).


    ![A978-1-4842-4060-1_10_Fig14_HTML.jpg](A978-1-4842-4060-1_10_Fig14_HTML.jpg)

    *Figure 10-14.*


    To apply a colored glass effect to the text in GIMP, select the `Compositing`
    layer and set the `Hard Light` mode.


    Now you are ready to address this problem of your `RingShadow` layer blocking
    the pixels of the `Niki` layer from the `Difference` mode algorithm. We need to
    deal with this as we seek to simulate our Photoshop compositing result here, using
    GIMP.


    To fix the problem, select your `RingElement` layer, then right-click it and again
    use `Alpha to Selection`. Next, click your `RingShadow` layer to select it, and
    hit your `Delete` key.


    As you can see in Figure [10-15](#A978-1-4842-4060-1_10_Chapter.html#Fig15), this
    process removes the black (unused or unseen) pixels underneath your `RingElement`.
    I turned off the layer visibility so you could see this clearly. Now the `Difference`
    algorithm can process the `Niki` layer pixels and your drop shadow effect will
    still be in place.


    ![A978-1-4842-4060-1_10_Fig15_HTML.jpg](A978-1-4842-4060-1_10_Fig15_HTML.jpg)

    *Figure 10-15.*


    To remove the black (unseen) pixels underneath your `RingElement`, select the
    `RingShadow` layer and hit `Delete`.


    Now, get rid of the selection by using the `Select ➤ None` menu sequence, and
    let’s finish up!


    With your `RingElement` layer selected, set your mode back to `Difference`, which,
    as you can see in Figure [10-16](#A978-1-4842-4060-1_10_Chapter.html#Fig16), now
    gives you the intended result. You have simulated all the effects you created
    in four layers in Photoshop using six layers in GIMP.


    ![A978-1-4842-4060-1_10_Fig16_HTML.jpg](A978-1-4842-4060-1_10_Fig16_HTML.jpg)

    *Figure 10-16.*


    Select the `RingElement` layer and set the mode to `Difference` to color the ring
    element with your special effect.


    It is important to observe here, in this layer-by-layer comparison, that two of
    your Photoshop layers utilize (fx) sublayers. One could look at that as meaning
    that Photoshop also uses six layers, making the number of layers in the two programs
    quite similar.


    As you can see, both 2D digital image compositing software packages are able to
    produce stunning visual results, using the proper work process and the correct
    modal operation sequences (order). This is what I intended to demonstrate in this
    chapter, and now we can move along to look at special effects applications, using
    the Filter menu in both Photoshop and GIMP.


    It is important to note that if you want to install plug-ins in your digital imaging
    software, the Filter menu is where you can access these specialized effect algorithms.


    ## Summary


    In this tenth chapter, we went over how the modal operations in Photoshop and
    GIMP will greatly affect the success (and failure) of your digital image compositing
    endeavors. Every once in a while, a mistake in mode settings will also end up
    producing some very cool unintended results, which you may claim that you intended
    to create!


    We also looked at how digital image editing and compositing software tools, tool
    options, layers, channels, selections, modes, and menus all work together modally
    to create your collective end result based on their individual settings.


    You saw that complex image compositing is not as easy as it might look from the
    outside. After we looked at some of the general considerations of modal operation,
    we created some more advanced compositing with Photoshop.


    Later in the chapter, we replicated the same visual results using GIMP 2.8.14,
    along with different tools, modal operations, and work processes.


    You added adjustment layer masking that only colored the pixels inside of your
    ring element in the `RingElement` layer, using Photoshop. In order to make your
    GIMP image composite identical to your Photoshop digital image composite, you
    then simulated that effect in GIMP and created the drop shadowing effect for your
    `RingElement` layer, and the glass text effect for your `Compositing` text layer.


    In [Chapter 11](#A978-1-4842-4060-1_11_Chapter.html), you’ll learn more about
    digital image compositing software’s third party plug-ins and how to access them
    along with integrated (permanent) plug-ins, using the Filter menu in both software
    packages.


    # 11. The Automation of Digital Imaging: Plug-In Filters


    Now that we have gone over the primary fundamental topics in digital image compositing,
    let’s take a chapter to have some fun and take a look at plug-in software. Plug-ins
    can automate specialized imaging effects for you, by allowing you to simply set
    a number of options and click the `OK` button in the dialog! These plug-ins are
    generally found in the `Filter` (Photoshop) or `Filters` (GIMP) menu in your digital
    image compositing software package.


    The first thing that we will do, since plug-ins for GIMP are free, is to see how
    you would find, install, and utilize plug-in filters for the GIMP 2.8.14 software
    package.


    Photoshop also has a plethora of plug-ins, most of which are already a part of
    the Photoshop CS6 software package, and there are a couple of third-party companies
    that provide additional plug-ins for Photoshop as well. To find these on the Internet,
    do a Google search, using the term “Photoshop plug-ins.”


    After that, we will take a look at how to incorporate the plug-in filter into
    the digital image compositing work process, and continue to apply special effects
    using your [Chapter 10](#A978-1-4842-4060-1_10_Chapter.html) image compositing
    creations, for both Photoshop CS6 and GIMP 2.8.14.'
