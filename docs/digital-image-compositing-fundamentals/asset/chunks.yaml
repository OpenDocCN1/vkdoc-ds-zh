  trans: '

    # 减色模型：使用 CMYK 印版进行打印


    现代彩色打印机至少使用`CMYK`中的四种墨水颜色，从而能够生成多种多样的颜色。高端喷墨打印机正推出配备六色或八色墨盒的型号，能够产生更丰富的色彩变化。


    打印机墨水采用减色模型，该模型的工作原理是墨水相互去除颜色——也就是说，两种颜色混合时会相互加深（通过去除浅色墨水），这就是为什么它被称为“减色”色彩过程。


    例如，青色和品红色墨水混合会产生紫色，这比单独使用任何一种墨水时产生的颜色都要深。


    减色模型产生的颜色比加色模型少，这一点我将在接下来讨论。仔细想想，这相当合乎逻辑，因为减法是在减少，而加法是在增加。在 Photoshop 以及 GIMP
    中，你可以通过`图像 ➤ 模式`菜单序列及其包含所有支持颜色模式的子菜单来访问颜色模式。该路径如图 4-1 所示，同时还有一个 CMYK 警告对话框。右下角的警告对话框提示你，即将从`RGB`转换到`CMYK`色彩配置文件，并建议使用`编辑
    ➤ 转换为配置文件`菜单序列来对转换过程进行更精细的控制。


    ![A978-1-4842-4060-1_4_Fig1_HTML.jpg](img/A978-1-4842-4060-1_4_Fig1_HTML.jpg)


    图 4-1.


    你可以使用`图像 ➤ 模式`菜单序列设置颜色模式


    通常你更愿意在`RGB`色彩配置文件下工作，因为`RGB`拥有 16,777,216 种颜色可供使用，而`CMYK`的颜色数量要少得多，而且智能手机、iTV
    电视机、平板电脑、电子书阅读器、笔记本电脑、上网本或超级本都不支持`CMYK`颜色模型。


    就像你希望像素对像素地匹配分辨率和宽高比一样，在每个像素内，你也希望匹配你创建数字图像所针对的设备（打印机或显示器）所支持的那些颜色通道。


    如图 4-2 所示，通过此菜单序列访问的对话框允许你选择预定义的色彩配置文件，这些配置文件是行业中用于创建不同应用的标准，例如报纸印刷（如所选）或单页印刷。


    ![A978-1-4842-4060-1_4_Fig2_HTML.jpg](img/A978-1-4842-4060-1_4_Fig2_HTML.jpg)


    图 4-2.


    `转换为配置文件`对话框提供了一个配置文件选择器


    重要的是要注意，数码相机使用`RGB`颜色模式，通过一种称为电荷耦合器件（简称`CCD`）的设备来捕获数字图像数据。这意味着输入到你的数字图像编辑和合成软件包中的数据是`RGB`颜色模式，因此在这种颜色模式下进行编辑也是合乎逻辑的，因为转换为`CMYK`会导致图像丢失一些颜色。


    基于这些原因，大多数数字图像合成师使用`RGB`颜色模型进行图像合成工作，然后在打印前转换为`CMYK`。这样，你可以为当前数字图像合成项目生成`CMYK`和`RGB`两种表示形式。这是一个优势，因为你的图像合成作品既可以在显示器上使用，也可以进行打印。


    这种为打印而进行的转换过程被图像合成师用得越来越少，这或许可以解释为什么`GIMP`没有在其软件包中添加完整的`CMYK`颜色模型。尤其是随着数码相机和显示设备时代的到来，公众对模拟和印刷媒体形式的依赖大大减少。这种趋势每天都在持续，因为更多的智能手机、智能手表、平板电脑、电子阅读器和
    iTV 电视机正大量涌入当前的市场。


    如图 4-3 所示，GIMP 的`图像 ➤ 模式`子菜单不支持减色颜色模式。不过，如果你确实希望使用`GIMP`进行`CMYK`颜色模型和打印工作，有一种变通方法。有一个名为`Separate`的插件可用于`GIMP`，它能添加`CMYK`颜色模式支持，而`AUR`为
    Linux 用户提供了一个名为`Separate+`（增强版）的高级版本。你可以在以下网址找到它：[`https://aur4.archlinux.org/`](https://aur4.archlinux.org/)。


    ![A978-1-4842-4060-1_4_Fig3_HTML.jpg](img/A978-1-4842-4060-1_4_Fig3_HTML.jpg)


    图 4-3.


    GIMP 的`图像 ➤ 模式`菜单仅支持加色模型


    这些插件可以将`RGB`图像分离为`CMYK`，通过`ICC`配置文件和`LCMS`提供色彩管理，允许颜色的软打样，并允许你将`ICC CMYK`配置文件附加到已分色的数字图像文件上。


    `Separate+`插件具有与`Separate`相同的功能，但它还能够将`RGB`配置文件转换为其他`RGB`配置文件，并提供双色调支持。


    # 加色模型：使用 RGB 颜色通道进行显示


    另一方面，`LED`、`LCD`和`OLED`显示器使用`RGB`加色模型，因为它们使用的是光而不是墨水。使用光（即加色模型）的一个优点是能产生更多的颜色。如果你曾见过棱镜或彩虹中呈现的颜色，你就会意识到用光产生的颜色极其绚丽多彩，这是墨水根本无法复制的。这就是本书主要关注`RGB`颜色的原因。


    加色模型与减色模型相反，因此，虽然混合红色和绿色墨水会得到深紫色，但混合红色和绿色光却会得到黄色！


    像素颜色由三种颜色的光定义：红色、绿色和蓝色；因此称为“`RGB`”。这些颜色在每个像素中以不同的量存在。显示屏幕通过将每个`RGB`颜色平面（或通道）的光波长相加来利用加色模型。这种颜色模式用于平板电脑、电子阅读器、智能手表、智能手机、iTV
    电视机、上网本、个人电脑和笔记本电脑中流行的`LED`、`LCD`和`OLED`显示器。


    在图 4-4 中，我已在 Photoshop 首选项对话框中开启了“使用通道颜色显示”模式。现在，通过选择颜色通道左侧的眼睛图标，你可以使用绿色通道的颜色查看绿色强度数据值。


    ![A978-1-4842-4060-1_4_Fig4_HTML.jpg](img/A978-1-4842-4060-1_4_Fig4_HTML.jpg)


    图 4-4.


    在 Photoshop CS6 中选中的绿色通道


    GIMP 使用相同的颜色通道面板，其图标模仿了彩色描图纸堆叠的效果。如图 4-5 所示，我已通过使用相同的眼睛图标打开了绿色和红色通道，以产生绿色 + 红色
    = 黄色的加色模型叠加效果。你可以有选择地对所需的颜色通道应用效果和规格。


    ![A978-1-4842-4060-1_4_Fig5_HTML.jpg](img/A978-1-4842-4060-1_4_Fig5_HTML.jpg)


    图 4-5.


    在 GIMP 中选中的红色和绿色通道


    这种将颜色通道分离到各自独立面板的做法，通过允许用户按单个通道隔离颜色，使图像编辑软件变得更加强大。


    能够对单个颜色通道进行处理并应用效果，是数字图像编辑软件的一个重要且强大的功能。


    加色模型可用于创建数千万种不同的颜色值。我们将在下一节探讨这背后所涉及的数学原理。

    '
- fmt: '# The Mathematics of RGB Color: Multiplying Your Intensities


    The number of red, green, and blue shades, or levels of intensity, of light you
    have available to mix together will determine the total amount of color that you
    can reproduce. In today’s digital devices, pixels can produce 256 levels of light
    intensity for each red, green, and blue (RGB) color.


    Colors will be generated for each image pixel, so every pixel in your image will
    have 256 levels of color intensity for each of these RGB color data values.


    Each of these RGB channels, plates, or planes, would use one byte, or eight bits.
    Eight bits of data will hold up to 256 different values, so you have 256 levels
    of brightness for each red, green, and blue color.


    The color-intensity (brightness) data inside each of the digital-image pixels
    in your digital image is represented with a brightness level for each color. This
    level can range between zero (brightness turned off) and 256 (brightness fully
    on).


    To calculate the total amount of available color is easy; it is again simple multiplication.
    If you multiply 256 by 256 by 256, you get 16,777,216 colors, which represents
    the total unique color combinations you can get, with 256 levels per color to
    work with across three different color channels. You will often see this 16,777,216
    color value represented for marketing purposes as 16.8M colors, rounding it up
    a bit.


    # Representing RGB Color Values: Using Hexadecimal Data Values


    The 256 levels of brightness for each red, green, and blue color value in each
    pixel allow you to set eight bits of value to control the variation of color brightness
    for each of the color values. The color brightness can vary from a minimum of
    zero to a maximum of 255, which, if you count from 1, comes to 256 different color
    intensity data values.


    The number of bits that are used to represent a digital image pixel color can
    be coded by using Base16, or Hexadecimal, notation. Base16 counts from zero to
    F, so that you will have sixteen values (bits) to represent color with. Having
    two of these hexadecimal values will give you 16 x 16 = 256 values, which is the
    number of colors that you will need to have for each of your RGB color channels.
    Hey! This all makes sense!


    In Android and HTML5, JavaScript, and CSS3, this is done using the Hash or Pound
    sign (`#`), and in Java, this is done using the `0x` prefix. For instance, to
    represent the color BLACK, for which all values are off, or zero, the code would
    look like:


    ```

    colorValue = #000000    // Android, HTML5, JS, CSS3 Color Value Hexadecimal

    colorValue = 0x000000   // Java and JavaFX Color Value Hexadecimal

    ```


    The color WHITE, on the other hand, has all pixels fully on, and as such would
    be represented using the following code:


    ```

    colorValue = #FFFFFF    // Android, HTML5, JS, CSS3 Color Value Hexadecimal

    colorValue = 0xFFFFFF   // Java and JavaFX Color Value Hexadecimal

    ```


    For the color RED, you would only turn on the Red channel pixels, so your hexadecimal
    code would look like this:


    ```

    colorValue = #FF0000    // Android, HTML5, JS, CSS3 Color Value Hexadecimal

    colorValue = 0xFF0000   // Java and JavaFX Color Value Hexadecimal

    ```


    For the color GREEN, you would turn on your Green channel pixels, so your hexadecimal
    notation would look like:


    ```

    colorValue = #00FF00    // Android, HTML5, JS, CSS3 Color Value Hexadecimal

    colorValue = 0x00FF00   // Java and JavaFX Color Value Hexadecimal

    ```


    And, similarly, the color BLUE has the Blue channel pixels turned on, so your
    hexadecimal notation would look like:


    ```

    colorValue = #0000FF    // Android, HTML5, JS, CSS3 Color Value Hexadecimal

    colorValue = 0x0000FF   // Java and JavaFX Color Value Hexadecimal

    ```


    In the next chapter, we will be taking a look at how these bit depths apply to
    different digital image file formats, such as an 8-bit GIF, or a 16-bit TIFF,
    or a 24-bit JPEG, or a 32-bit PNG, or even a 48-bit or 64-bit RAW image file format.
    Lots of learning left to go, but I promise, it will be fun!


    # Summary


    In the fourth chapter, we took a look at the concept of color theory, which defines
    how the color is represented in each pixel of a digital image. You learned about
    the difference between additive (RGB) and subtractive (CMYK) color modes as well
    as the mathematics behind calculating the total available colors for a standard
    24-bit RGB digital image. We went over how color modes are set in Photoshop and
    GIMP, how the RGB color mode is converted into industry-standard CMYK color representations
    in Photoshop CS6, how to add CMYK support to GIMP using the Separate+ plug-in,
    how color channels are represented, and how to select them for use in both Photoshop
    CS6 and GIMP 2.8.14.


    In the next chapter, you will learn about digital-image color depth and how different
    image formats support different color depths.


    # 5. The Digitization of Digital Imaging: Color Depth


    Now that you have an understanding of the primary two color theory models used
    in digital image editing and compositing, and the reason why we are going to be
    focusing on the RGB mode from here on out, it is time to take a more in-depth
    look at how colors are represented digitally for each pixel. The number of bits
    used to define color within a digital image and its file format are traditionally
    referred to as the digital image color depth. The most common color depth, used
    in the most common image format, JPEG, is true color, or 24-bit color. There are
    also other image formats that use different bit-level color depths, such as the
    GIF format, which uses 8-bit or indexed color; the Targa format, which uses 16-bit
    or high color; and the RAW format and HDRI format, which can use up to 48-bit
    and even use 64-bit color.


    We will build upon the knowledge from the previous chapter and learn about the
    32-bit RGBA mode, or if you prefer, the ARGB color mode (and 32-bit color depth).
    This mode is important for compositing, because it adds an alpha (A) channel,
    which I will cover in detail in Chapter 6, because it is just that important to
    the digital image compositing work process and pipeline (what I call the data
    processing path).


    We will be looking at four primary color depths used in digital imaging today.
    The 8-bit or “indexed color” color depth is used for data footprint optimization,
    a 16-bit “high color” color depth is rarely used, the popular 24-bit “true color”
    is used in JPEG, and a compositing 32-bit PNG format has an alpha channel, which
    we will be covering in great detail in the next chapter as it gives us an ability
    to blend or fade imagery.


    We will be looking at these four color depths during this chapter as well as the
    best color depth, or “bit depth,” to use with your digital image compositing pipeline.
    It is key that you understand how color values are digitized for pixels.'
