  trans: '

    # Java 与 JavaFX：`javafx.scene.effect` API


    使用 Java 编程语言编写的代码可以构建和控制数字图像合成流水线，如图 14-5 所示。背景板图像为 PNG24 格式，3D 标志为 PNG32 格式，脚本文本图像同样采用
    PNG32 格式。Java 有一个名为 JavaFX 的库，它支持丰富的新媒体资源，涵盖数字成像、数字音频、数字视频以及 i3D 实时 OpenGL 渲染。我们在本书中使用的大部分数字成像模式、滤镜和效果都位于
    `javafx.scene.effects` 库中。Java 可用于 Android Studio、HTML5 浏览器、Windows、Macintosh
    OSX、Linux 发行版和 Open Solaris OS。JavaFX 应用可以在 Android 和 iOS 上运行；因此，作为全球最流行的编程语言，Java
    7 和 8 真正实现了“一次编写，随处运行”。


    ![A978-1-4842-4060-1_14_Fig5_HTML.jpg](img/A978-1-4842-4060-1_14_Fig5_HTML.jpg)


    图 14-5. 使用 Java 和 JavaFX 的图像合成流水线


    我正在为即将由 Apress 在 2016 年出版的《Pro Java Games Development》一书编写的游戏启动界面如图 14-5 所示。左上角象限即为启动界面本身，它使用一张
    PNG24 背景板图像，叠加 PNG23 合成图像（两张）、文本元素和用户界面按钮元素。


    Java 和 JavaFX 代码如图 14-6 所示。JavaFX API 是 Java API 的一部分；因此，JavaFX 就是 Java。在 JavaFX
    被 Sun Microsystems 收购（恰好在被 Oracle 收购之前）之前，这两者是独立的编程语言。


    ![A978-1-4842-4060-1_14_Fig6_HTML.jpg](img/A978-1-4842-4060-1_14_Fig6_HTML.jpg)


    图 14-6. Java 和 JavaFX 代码创建启动界面变体


    图 14-6 展示了我为两个按钮编写的代码——即“说明”和“版权”按钮，在 Java 代码中分别称为 `helpButton` 和 `legalButton`。我并非意图在本章教授编码；不过，Java
    代码足够易于理解，足以解释图 14-5 所示的特定合成流水线的工作原理。


    在图 14-6 中，Java 语句 `boardGameBackPlate.setImage(transparentLogo);` 正在使用您现已从本书中熟悉的术语来更换背景板层中的数字图像资源。


    Java 语句 `colorAdjust.setHue(0.4);` 将标志的颜色沿色轮偏移 40%（您之前将其偏移了 140%，从青色变成了酒红色）。Java
    代码 `colorAdjust.setHue(-0.4);` 则将标志颜色沿色轮向相反方向偏移 40%。用颜色滑块来可视化，这分别相当于向右（正值）偏移 40%
    和向左（负值）偏移 40%。


    垂直方向（Y 轴）的像素定位通过 `infoOverlay.setTranslateY(350);` 实现，而 Java 代码中的文本间距则通过 `infoOverlay.setLineSpacing(-12);`
    语句实现。这就是使用代码创建图像合成的方式！


    接下来，让我们看看仅使用基本标记语言（HTML5 和 CSS3）实现的图像合成流水线。


    ## HTML5 和 CSS3：标记合成


    虽然 Java (JavaFX) 是最流行的编程语言，但就使用范围而言，HTML5 和 CSS3 标记语言最为广泛。这是因为后两者在每个浏览器中都有体现，并使用名为
    WebKit 的 API，Android 和 iOS 也类似地使用了该 API，因此 HTML5 和 CSS3 在这些操作系统中也得到支持。毫不意外，目前已有多种
    HTML5 操作系统问世，它们来自 HTML5 浏览器的制造商，包括 Chrome OS、Firefox OS 和 Opera OS。这些系统用于智能手机、平板电脑和
    iTV 设备。例如，松下 iTV 设备使用 Firefox OS；索尼 Bravia iTV 设备使用 Opera OS；谷歌拥有一系列 Chrome 硬件产品；而阿尔卡特在国际上为其智能手机使用
    Mozilla Firefox OS。


    我使用无损编解码器，并结合 PNG24 和动画 GIF 用于背景板部分，以及 PNG32 用于所有 i3D UI 元素叠加层，合成了 HDTV 分辨率的网站
    [`www.iTVset.com`](http://www.itvset.com/)。如图 14-7 所示，整个网站看起来像是一幅真彩色数字图像，但却具有动画效果和交互性。该网站仅使用
    24 行 HTML5 代码编写，并且图形图像资源数据的占用空间总量不到 2MB。


    ![A978-1-4842-4060-1_14_Fig7_HTML.jpg](img/A978-1-4842-4060-1_14_Fig7_HTML.jpg)


    图 14-7. 我使用 HTML5 和 CSS3 标记合成的网站


    如此小的数据占用空间得益于这种数字图像合成流水线，因为它允许将数字图像资源细化为更小的文件，从而在互联网上实现更快的数据传输速度。


    这种数据细化可以类比为沙漏中的沙粒：沙粒越细，在任何瓶颈场景中流动得就越顺畅、越快。


    这里使用了许多索引色资源，使得网站看起来像真彩色，但实际并非如此。例如，页面上的所有六个动画 3D 元素都可以使用带 1 位预乘 Alpha 通道的索引色
    animGIF 文件格式。我使用平均背景色对反锯齿颜色进行预乘，以在平均周围背景色值中隐藏反锯齿效果。例如，对于蝴蝶鱼，这是一种淡蓝色的水色值。


    i3D 用户界面按钮元素采用 PNG32 格式，其中 Alpha 通道可将 UI 无缝合成到网站任何部分的任何背景图像上，包括数字视频、Java (JavaFX)
    应用程序、首页上看到的 3D 动画以及全屏图像。


    图形元素存放在 HTML5 的 `<DIV>` 标签中，CSS3 则用于混合、透明度、定位和交互性。我的代码绝不会以任何方式妨碍右键点击操作，因此在网站开发的任何时刻，您都可以在网站上右键点击“查看源代码”来查看任何代码。文本由
    WebKit 在其自身的 `<DIV>` 标签区域内渲染，使用 HTML5 定义内容和元标签，并使用 CSS3 定义透明度、字体、颜色、大小以及边距和内边距（文本
    `<DIV>` 容器间距）值。


    如您所见，与 Java 或 JavaFX 一样，HTML5 和 CSS3 可以为您提供一个几乎与您使用 GIMP 和 Photoshop 创建的自定义图像合成流水线一样强大的图像合成流水线。然而，您需要成为一名富有创造力且精通编程的程序员，才能从这些流行的开源计算机编程语言中“挖掘”出这些能力。我保证，这种努力是值得的！

    '
- fmt: '# Android Studio: The PorterDuff Class


    The Google Android OS platform is running more smart phones, e-book e-readers,
    tablets, iTV sets, game consoles, smart watches, and IoT devices than any other
    OS platform in the history of the world. In fact, I have written a series of Pro
    Android titles for Apress, from 2013 through 2016, including Pro Android Graphics
    (2013), Pro Android UI (2014), and Pro Android Wearables (2015), and I am currently
    writing Pro Android IoT (2016). I cover how to code for PorterDuff pixel blending
    and pixel transfer modes in Pro Android Graphics.


    Figure [14-8](#A978-1-4842-4060-1_14_Chapter.html#Fig8) shows one of the screenshots
    from that book, showing three different blending modes in use in the Nexus One
    Emulator in the Eclipse IDE. As of Android 5, the IntelliJ IDE is the primary
    IDE that Android Studio developers will now use for their Android OS application
    development.


    ![A978-1-4842-4060-1_14_Fig8_HTML.jpg](A978-1-4842-4060-1_14_Fig8_HTML.jpg)


    Figure 14-8. Screenshot from Pro Android Graphics using a PorterDuff mode example


    The Java code to put together this compositing pipeline is quite complex, including
    a PNG24 back plate, a PNG32 ring element, a PNG32 3D logo, and a mask-controlled
    (alpha channel) black fill color, as can be seen in Figure [14-9](#A978-1-4842-4060-1_14_Chapter.html#Fig9).


    ![A978-1-4842-4060-1_14_Fig9_HTML.jpg](A978-1-4842-4060-1_14_Fig9_HTML.jpg)


    Figure 14-9. The Java code implementing a compositing pipeline


    I will now go through what the statements in Figure [14-9](#A978-1-4842-4060-1_14_Chapter.html#Fig9)
    do so that you can see a compositing code pipeline that matches up with the layer-based
    compositing pipeline that you have become familiar with over the course of this
    book.


    Layers are called `LayerDrawable` in Android, so the first line of code loads
    the `LayerDrawable` with a `contents_layers.png` asset using a `getResources().getDrawable()`
    method call “dot chain.”


    I commented out a `backgroundImage` plate, for testing, so I will just cover the
    `foregroundImage` plate code here. To make the image layer, I create a `Bitmap`
    object named `foregroundImage` and then I load it with an image asset named `cloudsky.png`
    using a `BitmapFactory.decodeResource()` method call.


    I then make that `Bitmap` object mutable (changeable) by putting it into memory
    using a `.copy()` method call specifying the 32-bit ARGB color depth (this also
    can be called a “color space”). `ARGB_8888` means each of the channels uses 8-bit
    data values.


    I then set a PorterDuff transfer mode (sometimes called a “blending mode,” although
    technically, some blending modes will transfer pixels, rather than blending them
    together) on a `Paint` object using the `.setXfermode()` method, using the XOR
    mode.


    I next created my `Drawable` object, named `layerOne`, and I then load it with
    a `Bitmap` object named `composite`, and load that into memory as a `mutableComposite`.


    Using that object, I then create a `Bitmap` object named `compositeImage`. I then
    created a `Canvas` object to draw on, named `imageCanvas` and then I loaded that
    `Canvas` object with the `compositeImage` `Bitmap` object.


    Next I draw the `Bitmap` object on the `Canvas` object using the `imageCanvas.drawBitmap()`
    method call that specifies an area using a square 1,000-pixel `Rect` object, with
    the blending mode using the `paintObject` and a `mutableForegroundImage` as a
    `Bitmap` object. This is the bitmap or raster image that I specified as having
    a color depth or color space of 32-bit, or `ARGB_8888`.


    I create an `ImageView` named `porterDuffImageComposite`, to hold (display) this
    digital image compositing pipeline in my user interface design, and I then loaded
    this `ImageView`, by using the `.setImageBitmap()` method call.


    As you can see, there are many of the elements that I’ve covered over the course
    of this book in this Java code, and you can bet that all of these concepts are
    supported in each of the major platform (Java, JavaFX, HTML5, CSS3, JavaScript,
    Android) areas that I’ve covered in this chapter.


    A lot of the reason for this is because these platforms are all open source, and
    so are all of the Porter Duff modes, OpenGL, JPEG, GIF, and PNG formats, alpha
    channels, and even the GIMP digital image compositing software.


    Since all of the areas of digital image compositing will be “Free for commercial
    use,” it is logical for the open source platforms to completely incorporate them.


    All of this is certainly excellent news for all of you digital image compositing
    aficionados, to be sure! I hope you have all enjoyed learning more regarding each
    of the different digital image compositing fundamentals over the course of these
    fourteen chapters.


    ## Summary


    In this fourteenth and final chapter, we got into some advanced topics that relate
    to computer programming and how different programming languages can support your
    digital image compositing endeavors, either inside digital image compositing software,
    as work process or special effects plug-in scripting tools, or outside your digital
    image compositing software. These languages can take your creation to the next
    level, by adding interactivity, as well as other useful features; the possibilities
    are limited only by your imagination!


    First, we went over VBScript, AppleScript, JavaScript, and ExtendScript languages,
    for Photoshop. Then, we looked at the LISP-based Scheme, and Python-based PyGIMP
    languages used for scripting in GIMP, and how they are accessed inside of the
    digital image compositing software packages, in case you wanted to immediately
    utilize other scripts written by third parties. After that, we reviewed some of
    the popular open-source platform programming languages and how they can be utilized
    to create the same digital image compositing effects set-up, using Photoshop and
    GIMP.


    We first went over Java and its JavaFX new media engine and saw how that platform
    supports digital image compositing as well as advanced blending modes and special
    effects algorithms. Then we took a look at HTML5 and CSS3, and saw that this platform
    could also implement the digital image compositing concepts and techniques you
    learned in this book using only markup languages for deliverables such as web
    sites and HTML5 OS applications.


    Finally, we took a look at the Android 5.3 OS, which is currently using Java 7,
    but will run both HTML5 and JavaFX apps in the future. We looked at the `PorterDuff`
    class and some advanced code, showing that a compositing pipeline with blending
    modes can be coded in Android for advanced apps that are digital image compositing
    savvy.


    I hope you have enjoyed this book, and the digital image compositing concepts,
    techniques, and fundamentals I’ve covered in it. Go forth, and blend into your
    surroundings!'
