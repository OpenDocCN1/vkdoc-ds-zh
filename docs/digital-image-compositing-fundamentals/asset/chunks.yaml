- fmt: '# The Data Footprint of Digital Images: Optimization


    The `Textlayer` also leverages an alpha channel to overlay text on the bottom
    six layers using a Hard Light blend mode and a 100% Opacity, or pixel strength,
    along with an Inner Shadow FX (Effects) layer, which creates your cut-out text
    special effect.


    Now that you’ve put together an impressive digital image compositing pipeline
    on steroids, it’s now time to switch gears and to take a look at saving files,
    data footprint optimization and how to use open source programming languages in
    the digital image compositing work process.


    Be sure and play around with all of the things which you have learned about during
    the first dozen chapters of this book so that you can continue to master these
    concepts and features!


    ## Summary


    In this twelfth chapter, you learned more about, and looked specifically at, digital
    image compositing pipeline processing in both Photoshop and GIMP. You fine-tuned
    your digital image compositing project, adding subtle color effects and detail
    to the special effects filter you applied in [Chapter 11](#A978-1-4842-4060-1_11_Chapter.html),
    and made your `RingElement` have better color composition with the rest of the
    image composite.


    In GIMP you color shifted your cyan metal ring and added layers that will give
    you some new mode special effects, and that you can blend with your special effects
    filter results.


    In order to achieve a similar digital image compositing processing pipeline result
    in Photoshop CS6, you again had to change around the layer, layer mask, and adjustment
    layers; add an adjustment layer; and update some of the Layer Style Effects (fx)
    settings.


    In the next chapter, you will learn about how to save out your files, and about
    data footprint optimization concepts and techniques.


    # 13. The Data Footprint of Digital Images: Optimization


    Now that we have gone over how to create professional digital images using the
    powerful features in digital image compositing software packages, which you could
    probably base a lucrative career on, it’s time to take a look at how to output,
    or “export,” these digital image composites, as highly optimized files. In this
    chapter, you will learn about the considerations of data footprint optimization,
    so that you can export (save) a digital image file in the proper format for what
    you’re doing. The objective in this chapter is to use the smallest possible number
    of bytes possible to create the file that contains your digital image compositing
    pipeline creation; that is, your resulting visual image multimedia asset for use
    in whatever digital playground you happen to be playing in at the time.


    This is important if you are planning to use the digital images you create with
    the compositing concepts and techniques in this book in your new media programming
    projects, using popular and widespread platforms like Java, JavaFX, Android, and
    HTML5.


    Since I am a programmer, I am going to devote the next two chapters in this book
    to how to optimize ([Chapter 13](#A978-1-4842-4060-1_13_Chapter.html)) and interface
    ([Chapter 14](#A978-1-4842-4060-1_14_Chapter.html)) digital imaging assets, with
    digital deliverables (as I call them), such as web sites and apps.


    ## Photoshop Optimization: Save for Web


    To start the optimization, open the `Chapter12compositing.psd` file, as seen in
    Figure [13-1](#A978-1-4842-4060-1_13_Chapter.html#Fig1), and follow the File ➤
    Save for Web menu sequence.


    ![A978-1-4842-4060-1_13_Fig1_HTML.jpg](A978-1-4842-4060-1_13_Fig1_HTML.jpg)


    **Figure 13-1.** To start the optimization process in Photoshop, follow the File
    ➤ Save for Web menu sequence


    This will bring up the Save for Web dialog, shown in Figure [13-2](#A978-1-4842-4060-1_13_Chapter.html#Fig2),
    which, in the case of this utility, is more like a command console. It has a preview
    area that reflects what the settings are doing at the left, along with tool icons
    for panning, zooming, and color sampling; a data footprint information printout
    at the bottom left side of the console; settings at the top right; and scaling
    (resampling) tools at the bottom right.


    ![A978-1-4842-4060-1_13_Fig2_HTML.jpg](A978-1-4842-4060-1_13_Fig2_HTML.jpg)


    **Figure 13-2.** To get the highest-quality result, select PNG-24, using the file
    format drop-down selector


    Photoshop has really done a great job, especially when you compare the data footprint
    optimization work process in GIMP, of providing an image data optimization control
    panel, allowing you to select settings, see the results, tweak these results,
    and even do things you would normally have to exit the dialog to accomplish, such
    as resampling (scaling) your image.


    The highest quality result, which has the largest data footprint, is obtained
    using a PNG-24 format, which also can be written as `PNG24`, seen in Figure [13-2](#A978-1-4842-4060-1_13_Chapter.html#Fig2).


    This format also supports an alpha channel; hence the Transparency option seen
    on the top right side of the dialog. If this is selected, the file becomes a PNG-32,
    also written as `PNG32`, because you have added an 8-bit transparency data plane.


    You would use the Transparency option if you were exporting an object and its
    mask, such as the `RingElement.png` you used in this book. The Interlaced option
    may add data footprint overhead, as it causes additional bytes to be added to
    the file size. This allows the image to “stream” on slow connections, so that
    it writes to the screen as the image data arrives over the Internet. Obviously,
    this option is closely associated with web page design, development and user experience.


    As you’ll see when you drop down the file format options list, there is also a
    PNG-8 option for using the indexed color format, which we covered in [Chapter
    5](#A978-1-4842-4060-1_5_Chapter.html). Let’s look at that next.'
