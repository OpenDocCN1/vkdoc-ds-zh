  trans: '

    # Photoshop 合成：图层运用


    由于 Photoshop 与 GIMP 拥有不同的代码库和合成管线功能，我们必须采用不同的方式为你的数字图像合成作品添加这些新功能。首先要做的，是选择 `Niki`
    图层及其图层蒙版，然后使用 `图层 ➤ 复制图层` 菜单序列进行复制。这将打开 `复制图层` 对话框，如图 12-6 所示，在对话框中，将该图层命名为 `特殊效果颜色混合`，完成图层设置后，该图层功能将提供相应效果。然后，点击
    `确定` 按钮创建新图层，以便控制特效中的精细颜色混合。


    ![A978-1-4842-4060-1_12_Fig6_HTML.jpg](img/A978-1-4842-4060-1_12_Fig6_HTML.jpg)


    图 12-6. 使用 `复制图层` 对话框将图层命名为“特殊效果颜色混合”


    你需要控制圆环外部的颜色饱和度混合，因此请反转图层蒙版，如图 12-7 所示。


    ![A978-1-4842-4060-1_12_Fig7_HTML.jpg](img/A978-1-4842-4060-1_12_Fig7_HTML.jpg)


    图 12-7. 为控制圆环外部的颜色饱和度混合，请反转 `特殊效果颜色混合` 图层的蒙版


    请注意，您可以选择特定图层内的图层蒙版，如图 12-7 所示，通过带有四个边角区域的白色轮廓进行选择。选中后，使用 `图像 ➤ 调整 ➤ 反相` 菜单序列，您会看到图层蒙版已被反转，如图
    12-8 所示，并且它现在影响的是 `圆环元素` 的外部区域，而非内部区域。如果将此图层保留为 `正常` 混合模式，并设置 `100% 不透明度`，则无需使用此图层，因为你可以直接操作调整图层来混合颜色。稍后，我们将为其附加高级模式和透明度，以模拟我们本章前面使用
    GIMP `2.8.14` 所做的操作。


    ![A978-1-4842-4060-1_12_Fig8_HTML.jpg](img/A978-1-4842-4060-1_12_Fig8_HTML.jpg)


    图 12-8. 为 `RingElement` 图层添加调整图层


    接下来需要执行的操作是：选择 `圆环元素` 图层，设置 `正常` 模式，并将颜色偏移为酒红色。在 Photoshop 中，这可以通过使用调整图层以非破坏性方式完成。使用
    `图层 ➤ 新建调整图层 ➤ 色相/饱和度` 菜单序列，如图 12-8 所示。


    将新图层命名为 `圆环色相偏移 140`（指代 140 度），并设置我们用于标记调整图层的橙色。


    切勿仅仅为了有趣而给图层着色！你应该有充分的理由；在此例中，我们使用橙色来突出显示调整图层。


    Photoshop 的 `色相/饱和度` 对话框与 GIMP 类似，允许你将滑块拖动到 `140` 的设置，或者直接将数值输入右侧的数值文本数据输入字段。


    接下来，再次选择 `特殊效果颜色混合` 图层，设置 `颜色`（数值）模式（GIMP 称之为“数值”模式），并将 `不透明度` 值设为 `50%`。


    这将降低你在图 12-8 中 `圆环元素` 外部看到的饱和度，并为你带来更微妙（且更专业）的效果。


    结果如图 12-9 所示，同时显示了选中的图层，以及用红色圆圈标出的 `模式` 和 `不透明度` 设置，它们位于截图的右上方。


    ![A978-1-4842-4060-1_12_Fig9_HTML.jpg](img/A978-1-4842-4060-1_12_Fig9_HTML.jpg)


    图 12-9. 你可以将 `颜色` 模式和 `不透明度` 设置为 `50%`，以获得特殊效果混合


    你在 GIMP 中进行的下一步升级是让圆环的投影看起来更真实。在 Photoshop 中实现此目的的方法是编辑 `投影图层样式`，其对话框如图 12-10
    所示。由于我们在 GIMP 中使用了 `仅变暗` 模式，我们将使用下拉菜单选择等效的 `颜色加深` 混合模式，并匹配在 GIMP 中也使用的 `60% 不透明度`
    设置。这将提供更真实的阴影。


    ![A978-1-4842-4060-1_12_Fig10_HTML.jpg](img/A978-1-4842-4060-1_12_Fig10_HTML.jpg)


    图 12-10. 为了在 Photoshop 中提供更真实的阴影，请将 `投影` 更改为使用 `颜色加深` 模式


    我们在 GIMP 中执行的最终操作是，通过在 `Niki.png` 彩色图层上方的 `Niki 黑与白` 图层中应用 `加深` 混合模式，来增强背板特效数字绘画算法（滤镜）应用的颜色和对比度。


    在 Photoshop 中，我们可以通过在 `黑白` 调整图层上设置 `颜色加深` 模式来实现这一点！调整图层可以应用其数字图像调整算法，然后将该结果也通过混合模式算法进行处理。这允许你将多个合成管线处理特效“堆叠”到单个图像合成特效图层中。


    毕竟，这就是本章的重点：如何最大限度地利用数字图像软件包的合成能力，以便使用最少的图层获得最大的效果。


    在图 12-11 中，我将 `不透明度` 设置为 `60%`，以减弱 `颜色加深` 模式算法的应用效果，这与我在 GIMP 中的操作完全相同。如您所见，尽管使用了不同的插件滤镜来创建特效，但您已经获得了同样专业的结果。


    ![A978-1-4842-4060-1_12_Fig11_HTML.jpg](img/A978-1-4842-4060-1_12_Fig11_HTML.jpg)


    图 12-11. 在 `黑白` 图层上设置 `颜色加深` 模式和 `60% 不透明度` 的结果


    让我们从图层堆栈的底部向上查看合成管线流程，了解其内部的实际运作情况。在 Photoshop 中，你的 `插件滤镜效果` 是背板，同样采用 `正常`（无）混合模式和
    `100% 不透明度`。这与使用 GIMP 设置此合成的方式显著不同，这一点值得注意。


    然后，你的 `黑白` 调整图层使用 `黑白` 算法创建黑白像素图像，并将该数据传递给 `颜色加深` 混合模式算法。


    所有这些图层内像素管线处理都应应用于 `插件滤镜效果` 图层的每个像素，正如全白的调整图层蒙版所规定的那样，该蒙版描述了数字图像合成中所有像素的完全不透明度处理。


    `Niki` 图层主要使用一个图层蒙版，配合 `正常`（无混合）模式和 `100% 不透明度`，在 `圆环元素` 内部（及其边缘下方）的原始（未处理）模特图像的圆形蒙版区域上叠加图像。


    `特殊效果颜色混合` 图层使用同一张 `Niki` 图像，但使用相反（反转）的图层蒙版，在 `圆环元素` 的外部区域（及其边缘下方）叠加彩色像素。


    设置 `50% 透明度`（混合），并通过 `颜色` 模式算法处理 `圆环元素` 外部此图层下方图层的像素，使你能够为你应用的 `黑白` 特效滤镜添加一些颜色。


    `RingElement` 图层主要利用一个 Alpha 通道和一个 `投影效果 (fx)` 算法子图层，使用 `正常`（无混合）模式和 `100% 不透明度`（全像素强度），在底部四个图层之上叠加一个青色金属环。


    你的 `圆环色相偏移 140` 调整图层应用色相偏移算法，调用正向的 `140` 度色相偏移，以复现你在 GIMP 中使用的相同酒红色。

