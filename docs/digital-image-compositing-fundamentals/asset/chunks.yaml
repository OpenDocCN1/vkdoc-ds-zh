    [1-5](#A978-1-4842-4060-1_1_Chapter.html#Fig5), and then create a shortcut icon
    for the quick launch taskbar on your OS so that you can launch GIMP if you need
    it by using just a single mouse click.


    ![A978-1-4842-4060-1_1_Fig5_HTML.jpg](A978-1-4842-4060-1_1_Fig5_HTML.jpg)


    Figure 1-5.


    Click the Finish button to finish the install


    Now that you have installed a digital imaging software package, we can take a
    look at a foundational element for all digital image processing work flows, the
    pixel.


    ## A Foundation for Digital Images: The Pixel


    Digital images are made up of two-dimensional, or 2D, arrays (or grids) containing
    something called pixels. Pixel, an industry term, is a conjugation of two words:
    pictures (which are commonly called “pix”) and elements (shortened to be just
    “els”). So the foundation for any digital image that you’ll be working with is
    its picture elements.


    These elements dictate everything about a digital image, including its file size,
    dimension, color, translucency, shape, format, and many other characteristics.
    I will devote a chapter to each characteristic over the course of the book as
    I build logical concept on top of logical concept. There are also digital illustrations,
    which are not made up of pixels.


    ### Raster vs. Vector: Imaging vs. Illustration


    Besides the term pixel, let’s get into some other terminology related to pixels
    to make sure we cover everything thoroughly in this first chapter of the book.
    Pixel-based digital imagery is also called “raster imagery.” This is because the
    array of pixels can be said to be “rasterized” by the device that is displaying
    these pixels. These devices include everything from an iTV to a tablet to a smart
    phone to a smart watch.


    There is another type of digital image called a “vector” image, which is defined
    using mathematics rather than pixels. A vector image uses points, called “vertices,”
    and lines or curves to draw out your “digital illustration,” which is what a vector
    image is commonly referred to as in the multimedia industry today.


    Vector imagery has its own genre of 2D software that is called digital illustration
    software. You may be familiar with Inkscape, an open source digital illustration
    software package, or Adobe Illustrator, or Macromedia Freehand, or Corel Draw.


    ### Rendering: Turning Convert Vector Art into Raster Imagery


    Vector imagery can be converted into raster imagery with a process called “rendering.”
    A rendered image is inherently a raster image, and both 2D vector artwork and
    3D vector artwork can be rendered into raster imagery, which, as you now know,
    is pixel-based imagery.


    At this point, all of the concepts that are outlined in this book can be applied,
    or inherently would be applied, to this pixel-format raster imagery. Remember
    to keep a back-up of your vector artwork, so that you can enhance it and render
    it at any time, because once it is rasterized, or rendered, it is no longer vector
    artwork anymore, so keep your vector format.


    The primary advantage of vector illustration over raster imagery is that since
    it’s defined using math it can be scaled up or down to any size. Scaling raster
    imagery causes what is known as “pixelation.”


    ## Summary


    In this first chapter, we made sure that you had a digital image compositing software
    package installed and ready to explore and also took a look at the foundational
    element of a digital image, the pixel. We also covered the distinction between
    raster, or pixel-based imagery, and vector, or mathematics-based imagery.


    Next, we looked at the concept of rendering, or taking a vector math-based digital
    illustration and turning it into a raster pixel-based digital image representation.


    In the next chapter, we will take a look at how pixels are stored in X,Y arrays
    and the concept of image resolution.'
