  trans: '

    ### 调整剪刀工具：智能样条节点


    我发现，将节点置于对象颜色变化处时，边缘检测算法的结果更好，如图 7-14 所示，位于鸟的灰色和**黄色**区域。在绘制曲线的整个过程中（包括闭合曲线后），你都可以随时通过拖拽来移动节点位置。曲线通过点击你放置的第一个节点来闭合，在本例中，该节点位于鸟的头顶。如图所示，当你拖拽节点重新定位时，节点之间的线条会变直，当你将节点放到新位置时，会重新计算新的曲线拟合算法。


    ![A978-1-4842-4060-1_7_Fig14_HTML.jpg](img/A978-1-4842-4060-1_7_Fig14_HTML.jpg)


    图 7-14. 你可以随时移动节点以获得更好的结果


    如果你将图右侧的节点重新定位到鸟的胸部中央，智能曲线放置算法将获得比任何其他边缘放置算法都高出**100%** 的结果（你可以使用本书附带的`MaskExercise.png`文件亲自尝试）。结果如图
    7-15 所示，边缘检测效果完美。


    ![A978-1-4842-4060-1_7_Fig15_HTML.jpg](img/A978-1-4842-4060-1_7_Fig15_HTML.jpg)


    图 7-15. 这种节点放置方式获得了更好的边缘匹配结果


    在图 7-16 中，我将图像放大到 200%，以便能更清楚地看到鸟图像底部的利爪，从而进行节点放置。如图所示，有几个节点我不得不稍微重新定位，以便从剪刀工具算法中获得更好的边缘拟合效果，特别是翅膀尖端的那个节点（将图
    7-16 与图 7-17 进行比较）。


    ![A978-1-4842-4060-1_7_Fig17_HTML.jpg](img/A978-1-4842-4060-1_7_Fig17_HTML.jpg)


    图 7-17. 要闭合样条曲线，请点击你放置的第一个节点


    ![A978-1-4842-4060-1_7_Fig16_HTML.jpg](img/A978-1-4842-4060-1_7_Fig16_HTML.jpg)


    图 7-16. 先放置简单节点，细节留到最后处理


    另外，请注意在图 7-14 到图 7-16 中，我将轮廓的起点设在了鸟爪旁边，因为这是你蒙版的细节区域，所以我打算最后处理这部分。因此，我的第一个点在鸟爪的右侧，我按逆时针方向放置节点，结束于鸟爪的左侧，这样我最后放置的节点就是鸟爪的细节部分。


    这样做的原因是，我可以最后再放大到鸟爪区域，此时已经使用剪刀选择工具勾勒出了大部分蒙版区域。


    需要注意的是，如果你点击其他 GIMP 工具，当前正在使用的工具将中止运行。因此，如果你想缩放，必须使用`视图` ➤ `缩放` ➤ `放大`的菜单序列（或`视图`
    ➤ `缩放` ➤ `缩小`），以保持此剪刀工具处于激活状态。出于这个原因，了解 Photoshop 和 GIMP 的菜单序列以及工具图标都很有用。


    如图 7-17 所示，剪刀算法在鸟爪区域的表现相当不错，除了爪子部分，我需要将其转换为选区并保存为 Alpha 通道（以便编辑）后手动处理。


    要完全闭合选择曲线，请将指针悬停在你放置的第一个节点上，当指针变为闭合曲线指针时，点击鼠标，曲线便会闭合。需要注意的是，选择曲线闭合后，你仍然可以调整（移动）节点。要将选择曲线转换为选区区域，请点击曲线内部。


    如图 7-18 所示，我已经将曲线转换为选区，现在就可以使用与 Photoshop 中相同的工作流程来保存选区集并在通道中编辑。在 GIMP 中执行此操作的菜单序列是`选择`
    ➤ `保存到通道`。然后，你可以使用`选择` ➤ `切换快速蒙版`来切换快速蒙版（红色颜色指示）模式。


    ![A978-1-4842-4060-1_7_Fig18_HTML.jpg](img/A978-1-4842-4060-1_7_Fig18_HTML.jpg)


    图 7-18. 点击闭合样条曲线内部以创建最终选区


    如图 7-19 所示，保存到通道后，你可以重新打开该通道，并使用画笔工具（已选择）配合黑色和白色进行进一步编辑。颜色可以通过工具图标下方的颜色样本之间的弧形箭头进行切换。


    ![A978-1-4842-4060-1_7_Fig19_HTML.jpg](img/A978-1-4842-4060-1_7_Fig19_HTML.jpg)


    图 7-19. 在 GIMP 中使用快速蒙版模式来优化蒙版


    如图 7-19 所示，我使用画笔工具确保右脚趾包含在蒙版区域内，并稍微清理了其他区域。


    这个剪刀选择工具确实可以让你达到 99%的蒙版工作都由你放置的节点和工具算法完成的程度。想想看，这相当令人惊叹，尤其是 GIMP 可以免费用于商业用途。当然，由于你现在已经拥有了`XCF`文件，你可以在边缘清理和蒙版完善上花费任意多的时间。熟能生巧。


    在下一章中，我们将研究如何使用图层面板。


    ## 总结


    在本章中，我们回顾了使用 Photoshop（魔棒工具）和 GIMP（剪刀选择工具）创建蒙版的最常用方法。你学习了如何使用 Photoshop 魔棒及其采样大小和容差设置，以及如何将选区保存到
    Alpha 通道并进一步编辑以完善最终结果。在 GIMP 中，你学习了剪刀选择工具，它采用了一种不同的方法，利用强大的算法创建一条样条曲线，使其贴合对象的任何边缘，你通过沿对象周边放置节点来引导它。我们还介绍了将此结果保存到
    Alpha 通道并进一步编辑蒙版的方法，操作方式与在 Photoshop CS6 中相同。


    在第 8 章中，你将学习更多关于数字图像合成图层的内容，以及如何使用它们的功能，这些功能可以通过 Photoshop CS6 和 GIMP 2.8.14 中的图层面板来访问。

