  trans: '

    ## 在 GIMP 中使用模式：制作阴影副本


    让我们继续完善你在第 6 章中开始的合成图像，使用 GIMP 中的 `Chapter8usingLayers` 文件，如图 9-2 所示，我们刚刚打开它。首先，点击“COMPOSITING
    文字”图层将其选中，然后使用 `图层 ➤ 复制图层` 菜单命令来复制它。如果你想使用更快捷的右键菜单，也可以直接右键点击文字图层，选择 `复制图层`。选中复制出的图层，将其命名为
    `阴影`，点击`文字`工具，使用取色器将颜色设置为黑色。


    如果你的文字取色器没有显示金色，请确保你已点击了左侧合成图像视图中的文字对象本身。在你点击了图像合成像素显示区域中的实际文字对象后，GIMP 将允许你点击色板对话框，并将取色器十字准线从金色拖到黑色。


    如图 9-3 所示，我已命名了图层，将其颜色设置为黑色，最后右键点击它并选择了 `丢弃文字信息`。此菜单选项会将黑色文字栅格化，使其成为像素数据，后续你将通过工作流程将其转变为投影。


    ![A978-1-4842-4060-1_9_Fig3_HTML.jpg](img/A978-1-4842-4060-1_9_Fig3_HTML.jpg)


    图 9-3. 要将黑色文字转换为像素数据，首先右键点击选中的 `阴影` 图层，然后点击 `丢弃文字信息`


    接下来，点击`移动`工具（如图 9-4 右上角所示已被选中），然后在位于工具面板下方的“工具选项”区域中选择`移动活动图层`。


    ![A978-1-4842-4060-1_9_Fig4_HTML.jpg](img/A978-1-4842-4060-1_9_Fig4_HTML.jpg)


    图 9-4. 你可以使用`移动`工具配合方向键将黑色文字偏移 2 个像素


    点击`阴影`图层将其选中，然后在图像预览区域点击黑色文字，以此告知`移动`工具你想要移动的对象。确保只是点击，而不是点击并拖动，否则黑色文字会被移动太多。


    之后，你可以使用方向键来移动文字对象（或 GIMP 中的任何选中对象），每次移动一个像素。这是一个有用的功能，请务必练习使用它。


    现在，按两次左方向键和两次上方向键。这会令你的黑色文字相对于金色文字产生偏移，如图 9-4 所示。


    你开始看到这个工作流程如何能产生大量投影可能性了——当然，是在你应用模糊效果使其看起来更像投影之后！不过，在应用模糊滤镜之前，我们还需要先完成一个遮罩步骤，让阴影看起来更逼真。


    现在，右键点击`合成`图层将其选中（我已将该图层重命名为首字母大写，以便适应图层空间），然后选择 `Alpha 到选区` 选项，如图 9-5 所示（并务必阅读弹出信息以获取提示、技巧和快捷键）。


    ![A978-1-4842-4060-1_9_Fig5_HTML.jpg](img/A978-1-4842-4060-1_9_Fig5_HTML.jpg)


    图 9-5. 选择`合成`图层并使用 `Alpha 到选区` 选项


    > 提示：如果你将鼠标悬停在 GIMP 用户界面的任何组件上（例如菜单项和工具图标），你将看到关于该 GIMP 功能的黄色弹出信息，以及额外的提示、技巧和快捷键。这是学习该软件的好方法。


    接下来，选中你的`阴影`图层，然后使用 `编辑 ➤ 清除` 菜单命令，利用你从`合成`文字图层中提取的选区来移除大部分像素，如图 9-6 所示。这是我所说的“模式化操作步骤”的一个例子，即你选择一个图层，而选择后执行的工具变得至关重要。


    ![A978-1-4842-4060-1_9_Fig6_HTML.jpg](img/A978-1-4842-4060-1_9_Fig6_HTML.jpg)


    图 9-6. 要移除大部分像素，请选择`阴影`图层并使用 `编辑 ➤ 清除` 命令


    然后，使用 `选择 ➤ 无` 菜单命令取消你的黑色文字选区（闪烁的虚线框），并选中你的`阴影`图层，以便应用模糊效果。


    使用 `滤镜 ➤ 模糊 ➤ 高斯模糊` 菜单命令，打开高斯模糊对话框，如图 9-7 所示。在 X 和 Y 两个维度上应用 2 个像素的模糊。确保该对话框中的链条图标已锁定宽高比。


    ![A978-1-4842-4060-1_9_Fig7_HTML.jpg](img/A978-1-4842-4060-1_9_Fig7_HTML.jpg)


    图 9-7. 要模糊阴影边缘，请使用 `滤镜 ➤ 模糊 ➤ 高斯模糊` 菜单命令


    点击确定按钮，将高斯模糊设置应用到`阴影`图层，阴影会立刻看起来更真实。


    然后选择`移动`工具，点击预览图像中的`阴影`部分，以告知 GIMP 这是你想要移动的对象，并使用方向键来定位阴影效果。


    调整投影位置，使其达到与在 Photoshop 中使用`图层样式 内阴影`工具相同的效果。你可能需要使用方向键在 X 和 Y 维度上将阴影移动几个像素，使其看起来像是位于文字对象的内部，营造出文字被切割进图像的效果。


    为了让投影颜色与金色文字颜色进行混合（正片叠底），将`模式`下拉菜单设置为`正片叠底`，如图 9-8 截图右上角红色圆圈所示。这能增加更多真实感，尤其是在已经模糊的阴影区域。


    ![A978-1-4842-4060-1_9_Fig8_HTML.jpg](img/A978-1-4842-4060-1_9_Fig8_HTML.jpg)


    图 9-8. 你可以使用`移动`工具和`正片叠底`模式对阴影进行微调


    如你所见，在 GIMP 中你也能完成在 Photoshop 中能做到的大部分工作。在 Photoshop 中创建此效果需要四个图层，在 GIMP 中则需要五个，但最终结果经过调整，在两个软件中可以做到完全相同。


    我将使用 Photoshop 来查看其余最常用于合成的模式，以确保我在本书的每个章节中都能公平地介绍这两个软件。


    ## Photoshop 混合模式：炫酷特效


    在本章的剩余部分，让我们看看 Photoshop 中的一些混合模式，它们能为你提供一些非常强大的图像合成“外观”和特殊效果。由于其中一些模式非常相似，我不打算在此处介绍全部
    26 种模式，但我会讲解一些你发现自己会经常用到的模式。这些模式包括可以模拟光线照射到图像上的模式、将一个图像叠加到另一个图像之上的模式，以及创建类似的基于像素的二维特效的模式。我们已经在
    GIMP 2.8.14 中介绍了`滤色`模式和`正片叠底`模式，因此我将重点介绍 Photoshop CS6 中的其他模式，因为这两种模式在 Photoshop
    中的工作方式与在 GIMP 中相同。让我们开始看看，使用我们目前创建的图像合成，混合模式可以创建出哪些炫酷特效。

    '
- fmt: '### Soft Light: Shining a Light on Your Digital Imagery


    The Photoshop `Soft Light` mode is useful for simulating a light shining on an
    image. Let’s create this effect in our [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html)
    image composite, which is seen in Figure [9-9](#A978-1-4842-4060-1_9_Chapter.html#Fig9).
    Start by turning off the `Text Layer Effects` by clicking the visibility eye icon
    next to the `Effects` layer in the `Layers Palette` on the right side of the screen.
    Then, select the `Text` tool, and click on the gold color swatch at the top of
    the screen, and use the color picker to change the text color to white. We will
    do this so that we can simulate a light shining on the image. Next, click the
    `Move` icon at the top of the icon toolbar, which is on the left side of the screen,
    and move the vertical text to the right side of the image composite. Finally,
    select the `Soft Light` mode from the drop-down menu in the `Layers Palette`,
    and you will get an effect similar to a text shaped flashlight shining on your
    digital image composite. Pretty Cool Stuff!


    ![A978-1-4842-4060-1_9_Fig9_HTML.jpg](A978-1-4842-4060-1_9_Fig9_HTML.jpg)


    Figure 9-9. Select the `TextLayer`, and change mode to `Soft Light`


    We have been looking at the `Soft Light` mode; now let’s see if a `Hard Light`
    mode provides us with a significantly different special effect. It is important
    to note here that both `Soft Light` and `Hard Light` modes are also available
    in GIMP 2.8.14, so you can create these effects using that software package as
    well, if you like, possibly to get a little bit more practice at digital image
    compositing.


    ### Hard Light: Adding a Glass Overlay Effect to Text


    For the `Hard Light` test, I reset the text to an orange-gold color using the
    `Text` tool and turned the `Inner Shadow Layer Style` back on using the visibility
    eye icon, as I want to show you how to combine drop-shadowing effects and blending
    modes for a maximum visual impact. I also moved the vertical text back to its
    original location between the wood beams in the image and selected the `Hard Light`
    mode from the drop-down menu at the top of the layer. A professional end result
    is seen in Figure [9-10](#A978-1-4842-4060-1_9_Chapter.html#Fig10).


    ![A978-1-4842-4060-1_9_Fig10_HTML.jpg](A978-1-4842-4060-1_9_Fig10_HTML.jpg)


    Figure 9-10. Left-click the `TextLayer` and set a `Hard Light` mode


    ### Linear Burn: Turning a 3D Metal Hoop into Glass


    Let’s set modes for both the text and ring-object layers next, in order to increase
    the amount of pixel effects data that Photoshop is processing. We will have blending
    modes calculated on two layers and `Inner Shadow` effects on the text layer as
    well as `Black & White` image adjustments on the `Niki` layer.


    First, select your `RingElement Layer`, and replace the `Normal` blending mode
    with the `Linear Burn` mode, which will turn your aqua chrome hoop into an aqua
    glass hoop, as shown in Figure [9-11](#A978-1-4842-4060-1_9_Chapter.html#Fig11).


    ![A978-1-4842-4060-1_9_Fig11_HTML.jpg](A978-1-4842-4060-1_9_Fig11_HTML.jpg)


    Figure 9-11. To turn your aqua chrome hoop into an aqua glass hoop, select the
    `RingElement` layer and set the `Linear Burn Mode` in the drop-down menu


    The `Linear Burn` blending mode is similar to the `Color Burn` blending mode.
    Where the `Color Burn` mode increases contrast, the `Linear Burn` mode decreases
    brightness, darkening the base color and reflecting the blend color, which makes
    the metal look like glass. The `Linear Burn` mode is similar to the `Multiply`
    blend mode, but the `Linear Burn` mode produces a much more realistic result with
    this particular special effect implementation (metal to glass). In fact, try selecting
    a `Multiply` mode now for comparison purposes.


    It’s important to note that using `White` as a blend color with a `Linear Burn`
    blending mode will produce no image changes.


    Digital photographers can utilize the `Linear Burn` blend mode to make both tonal
    and color adjustments to their digital photography. This mode, which was introduced
    in Photoshop 7, is particularly useful when you want enhanced effects in those
    darker areas of your digital photography. It is sometimes known as `Subtract`
    in other imaging software packages.


    Next, let’s use a `Luminosity` mode to turn your blue ring element into a chrome
    hoop element by removing the saturation. As we have seen in [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html),
    removing color Saturation leaves only `Luminosity` (black and white, or grayscale)
    values.


    The `Hue` affects the color temperature, or the color, of the image; the `Saturation`
    affects how much color (versus how much grayscale) it contains; and the `Luminosity`
    affects how bright (white values) or dark (black values) the image uses.


    ### Luminosity: Turning Your Metal Hoop into Chrome


    Here again, start by selecting your `RingElement Layer`, as shown in Figure [9-12](#A978-1-4842-4060-1_9_Chapter.html#Fig12).
    Then replace the `Linear Burn` blending mode with the `Luminosity` blending mode.
    This will transform your aqua-tinted chrome ring element into a darkened-silver
    chrome ring element. When using blending modes, this is as simple as setting the
    `Luminosity` blending mode on the layer that contains your 3D ring element.


    ![A978-1-4842-4060-1_9_Fig12_HTML.jpg](A978-1-4842-4060-1_9_Fig12_HTML.jpg)


    Figure 9-12. Select a `RingElement` layer and set `Luminosity` mode


    `Luminosity` is one of your four color-oriented, which could be termed “tonal,”
    blending modes, in a group located at the bottom of Photoshop’s blending mode
    drop-down menu, as you saw in Figure [9-1](#A978-1-4842-4060-1_9_Chapter.html#Fig1).
    These four color blending modes operate on those `Hue-Saturation` dialog values
    that you have seen before, affecting only the `Hue`, `Saturation` or `Lightness`
    components of the pixels between the two images.


    In simple terms, when you combine a layer with another layer set to use the `Luminosity`
    blending mode, the resulting pixel color keeps the original (underneath) layer’s
    hue and saturation values, but the luminosity value comes only from the blending
    layer set to `Luminosity`. Next, let’s add the `Drop Shadow Layer Style` to your
    `Ring Element Layer` and use the `Difference` blending mode to create a cool special
    effect, so that you are using all the capabilities of these four layers that we
    have implemented in Photoshop CS6.'
  raw: '### Soft Light: Shining a Light on Your Digital Imagery


    The Photoshop Soft Light mode is useful for simulating a light shining on an image.
    Let’s create this effect in our [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html)
    image composite, which is seen in Figure [9-9](#A978-1-4842-4060-1_9_Chapter.html#Fig9).
    Start by turning off the Text Layer Effects by clicking the visibility eye icon
    next to the Effects layer in the Layers Palette on the right side of the screen.
    Then, select the Text tool, and click on the gold color swatch at the top of the
    screen, and use the color picker to change the text color to white. We will do
    this so that we can simulate a light shining on the image. Next, click the Move
    icon at the top of the icon toolbar, which is on the left side of the screen,
    and move the vertical text to the right side of the image composite. Finally,
    select the Soft Light mode from the drop-down menu in the Layers Palette, and
    you will get an effect similar to a text shaped flashlight shining on your digital
    image composite. Pretty Cool Stuff!


    ![A978-1-4842-4060-1_9_Fig9_HTML.jpg](A978-1-4842-4060-1_9_Fig9_HTML.jpg)


    Figure 9-9.


    Select the TextLayer, and change mode to Soft Light


    We have been looking at the Soft Light mode; now let’s see if a Hard Light mode
    provides us with a significantly different special effect. It is important to
    note here that both Soft Light and Hard Light modes are also available in GIMP
    2.8.14, so you can create these effects using that software package as well, if
    you like, possibly to get a little bit more practice at digital image compositing.


    ### Hard Light: Adding a Glass Overlay Effect to Text


    For the Hard Light test, I reset the text to an orange-gold color using the Text
    tool and turned the Inner Shadow Layer Style back on using the visibility eye
    icon, as I want to show you how to combine drop-shadowing effects and blending
    modes for a maximum visual impact. I also moved the vertical text back to its
    original location between the wood beams in the image and selected the Hard Light
    mode from the drop-down menu at the top of the layer. A professional end result
    is seen in Figure [9-10](#A978-1-4842-4060-1_9_Chapter.html#Fig10).


    ![A978-1-4842-4060-1_9_Fig10_HTML.jpg](A978-1-4842-4060-1_9_Fig10_HTML.jpg)


    Figure 9-10.


    Left-click the TextLayer and set a Hard Light mode


    ### Linear Burn: Turning a 3D Metal Hoop into Glass


    Let’s set modes for both the text and ring-object layers next, in order to increase
    the amount of pixel effects data that Photoshop is processing. We will have blending
    modes calculated on two layers and Inner Shadow effects on the text layer as well
    as Black & White image adjustments on the Niki layer.


    First, select your RingElement Layer, and replace the Normal blending mode with
    the Linear Burn mode, which will turn your aqua chrome hoop into an aqua glass
    hoop, as shown in Figure [9-11](#A978-1-4842-4060-1_9_Chapter.html#Fig11).


    ![A978-1-4842-4060-1_9_Fig11_HTML.jpg](A978-1-4842-4060-1_9_Fig11_HTML.jpg)


    Figure 9-11.


    To turn your aqua chrome hoop into an aqua glass hoop, select the RingElement
    layer and set the Linear Burn Mode in the drop-down menu


    The Linear Burn blending mode is similar to the Color Burn blending mode. Where
    the Color Burn mode increases contrast, the Linear Burn mode decreases brightness,
    darkening the base color and reflecting the blend color, which makes the metal
    look like glass. The Linear Burn mode is similar to the Multiply blend mode, but
    the Linear Burn mode produces a much more realistic result with this particular
    special effect implementation (metal to glass). In fact, try selecting a Multiply
    mode now for comparison purposes.


    It’s important to note that using White as a blend color with a Linear Burn blending
    mode will produce no image changes.


    Digital photographers can utilize the Linear Burn blend mode to make both tonal
    and color adjustments to their digital photography. This mode, which was introduced
    in Photoshop 7, is particularly useful when you want enhanced effects in those
    darker areas of your digital photography. It is sometimes known as Subtract in
    other imaging software packages.


    Next, let’s use a Luminosity mode to turn your blue ring element into a chrome
    hoop element by removing the saturation. As we have seen in [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html),
    removing color Saturation leaves only Luminosity (black and white, or grayscale)
    values.


    The Hue affects the color temperature, or the color, of the image; the Saturation
    affects how much color (versus how much grayscale) it contains; and the Luminosity
    affects how bright (white values) or dark (black values) the image uses.


    ### Luminosity: Turning Your Metal Hoop into Chrome


    Here again, start by selecting your RingElement Layer, as shown in Figure [9-12](#A978-1-4842-4060-1_9_Chapter.html#Fig12).
    Then replace the Linear Burn blending mode with the Luminosity blending mode.
    This will transform your aqua-tinted chrome ring element into a darkened-silver
    chrome ring element. When using blending modes, this is as simple as setting the
    Luminosity blending mode on the layer that contains your 3D ring element.


    ![A978-1-4842-4060-1_9_Fig12_HTML.jpg](A978-1-4842-4060-1_9_Fig12_HTML.jpg)


    Figure 9-12.


    Select a RingElement layer and set Luminosity mode


    Luminosity is one of your four color-oriented, which could be termed “tonal,”
    blending modes, in a group located at the bottom of Photoshop’s blending mode
    drop-down menu, as you saw in Figure [9-1](#A978-1-4842-4060-1_9_Chapter.html#Fig1).
    These four color blending modes operate on those Hue-Saturation dialog values
    that you have seen before, affecting only the Hue, Saturation or Lightness components
    of the pixels between the two images.


    In simple terms, when you combine a layer with another layer set to use the Luminosity
    blending mode, the resulting pixel color keeps the original (underneath) layer’s
    hue and saturation values, but the luminosity value comes only from the blending
    layer set to Luminosity. Next, let’s add the Drop Shadow Layer Style to your Ring
    Element Layer and use the Difference blending mode to create a cool special effect,
    so that you are using all the capabilities of these four layers that we have implemented
    in Photoshop CS6.'
  trans: '

    ### 柔光：为数字图像投下一束光


    Photoshop 中的`柔光`模式非常适合模拟光线照射在图像上的效果。接下来，我们在第 8 章的合成图（见图 9-9）中创建这一效果。首先，点击屏幕右侧`图层`面板中`效果`图层旁的可见性眼睛图标，关闭`文字图层效果`。然后，选择`文字`工具，点击屏幕顶部的金色色板，使用拾色器将文字颜色更改为白色。这样做的目的是为了模拟光线照射在图像上的效果。接着，点击屏幕左侧图标工具栏顶部的`移动`图标，将垂直文字移动到合成图的右侧。最后，从`图层`面板的下拉菜单中选择`柔光`模式，你就能看到一个类似文字形状的手电筒照射在数字合成图上的效果。是不是很棒！


    ![A978-1-4842-4060-1_9_Fig9_HTML.jpg](img/A978-1-4842-4060-1_9_Fig9_HTML.jpg)


    图 9-9. 选中`文字图层`，将模式更改为`柔光`


    我们刚刚了解了`柔光`模式；现在来看看`强光`模式是否能带来截然不同的特殊效果。值得注意的是，`柔光`和`强光`模式在 GIMP 2.8.14 中同样可用，因此如果你喜欢，也可以使用该软件包创建这些效果，或许还能借此多练习一下数字图像合成。


    ### 强光：为文字添加玻璃叠加效果


    在`强光`测试中，我使用`文字`工具将文字重置为橙金色，并通过可见性眼睛图标重新开启了`内阴影图层样式`。我想向您展示如何将投影效果与混合模式相结合，以实现最大的视觉冲击力。我还将垂直文字移回了图像中木梁之间的原始位置，并从图层顶部的下拉菜单中选择了`强光`模式。最终的专业效果如图
    9-10 所示。


    ![A978-1-4842-4060-1_9_Fig10_HTML.jpg](img/A978-1-4842-4060-1_9_Fig10_HTML.jpg)


    图 9-10. 左键单击`文字图层`，设置`强光`模式


    ### 线性加深：将 3D 金属环变成玻璃


    接下来，我们同时为文字和圆环对象图层设置模式，以增加 Photoshop 处理的像素效果数据量。我们将在两个图层上计算混合模式，在文字图层上应用`内阴影`效果，并在`Niki`图层上进行`黑白`图像调整。


    首先，选择`圆环元素图层`，将`正常`混合模式替换为`线性加深`模式。这将把您的青绿色铬环变成青绿色玻璃环，如图 9-11 所示。


    ![A978-1-4842-4060-1_9_Fig11_HTML.jpg](img/A978-1-4842-4060-1_9_Fig11_HTML.jpg)


    图 9-11. 要将青绿色铬环变成青绿色玻璃环，请选择`圆环元素`图层，并在下拉菜单中设置`线性加深模式`


    `线性加深`混合模式与`颜色加深`混合模式类似。`颜色加深`模式增加对比度，而`线性加深`模式则降低亮度，使基色变暗并反映混合色，从而使金属看起来像玻璃。`线性加深`模式与`正片叠底`模式相似，但在这种特定的特殊效果实现（金属变玻璃）中，`线性加深`模式能产生更真实的效果。事实上，您可以尝试选择`正片叠底`模式进行对比。


    需要注意的是，使用`白色`作为混合色与`线性加深`模式结合，不会对图像产生任何改变。


    数字摄影师可以利用`线性加深`混合模式对其数码照片进行色调和颜色调整。该模式从 Photoshop 7 开始引入，当您希望增强数码照片中较暗区域的效果时尤为有用。在其他图像软件包中，它有时被称为`减去`。


    接下来，我们使用`明度`模式，通过去除饱和度来将蓝色圆环元素变成铬环元素。正如我们在第 8 章中看到的，去除颜色饱和度只会留下`明度`（黑白或灰度）值。


    `色相`影响图像的色温或颜色；`饱和度`影响图像包含多少颜色（相对于灰度）；`明度`影响图像使用的明亮程度（白色值）或黑暗程度（黑色值）。


    ### 明度：将金属环变成铬面


    同样，首先选择您的`圆环元素图层`，如图 9-12 所示。然后将`线性加深`混合模式替换为`明度`混合模式。这将把您的青绿色铬环元素转变为深色银铬环元素。在使用混合模式时，只需在包含
    3D 圆环元素的图层上设置`明度`混合模式即可。


    ![A978-1-4842-4060-1_9_Fig12_HTML.jpg](img/A978-1-4842-4060-1_9_Fig12_HTML.jpg)


    图 9-12. 选择`圆环元素`图层并设置`明度`模式


    `明度`是您四种面向颜色（可称为“色调”）的混合模式之一，位于 Photoshop 混合模式下拉菜单的底部，如图 9-1 所示。这四种颜色混合模式作用于您之前见过的`色相/饱和度`对话框中的值，仅影响两个图像之间像素的`色相`、`饱和度`或`明度`分量。


    简单来说，当您将一个图层与另一个设置为`明度`混合模式的图层组合时，结果像素的颜色会保留原始（下方）图层的色相和饱和度值，但明度值仅来自设置为`明度`的混合图层。接下来，让我们为`圆环元素图层`添加`投影图层样式`，并使用`差值`混合模式来创建一个酷炫的特殊效果，从而充分利用我们在
    Photoshop CS6 中实现的这四个图层的所有功能。

    '
- fmt: '### Difference: Using a Layer to Invert Pixel Colors


    Now, let’s add some more complexity to our existing layers by adding a Layer Style
    to the `RingElement` layer, so that we can drop shadow it over the `Niki` image
    layer and have it look like it is floating above the image.


    To do so, right-click your `RingElement` layer after you select it and choose
    the `Blending Options` menu item, to access the `Layer Style` dialog, as shown
    in Figure [9-13](#A978-1-4842-4060-1_9_Chapter.html#Fig13).


    ![A978-1-4842-4060-1_9_Fig13_HTML.jpg](A978-1-4842-4060-1_9_Fig13_HTML.jpg)


    Figure 9-13.


    Set the Drop Shadow Layer Style settings


    Then, select a `Multiply` blend mode, an `Opacity` of 75 percent, and an `Angle`
    of 45 degrees. Select `Use Global Light`, and then set a `Distance` of 9 pixels,
    a `Spread` of 3 pixels, and a `Size` of 9 pixels.


    Check off the `Anti-aliased` and `Preview` checkboxes, as is shown in the figure.


    Once you click the `OK` button, you will have a realistic drop shadow underneath
    your ring element that you did not have to create.


    You saw the work process that it would take to create this drop shadow effect
    in GIMP. In Photoshop, the `Layer Style` dialog does this for you, which is one
    of the program’s advanced features that GIMP does not yet have. Next, select the
    `Difference` Mode under the `Layers` tab, as shown in Figure [9-14](#A978-1-4842-4060-1_9_Chapter.html#Fig14).


    ![A978-1-4842-4060-1_9_Fig14_HTML.jpg](A978-1-4842-4060-1_9_Fig14_HTML.jpg)


    Figure 9-14.


    Select a `RingElement` layer and set `Difference` mode


    Now, turn your visibility (eye) icon off in your orange adjustment layer, which
    will bring back the original color data from the `Niki` layer so that you can
    see the effect of the mode better. Areas of the ring will turn red or blue, based
    on image data in the layer underneath the `RingElement` layer.


    Make sure to spend some time experimenting with all the blending modes in Photoshop
    and GIMP so that you can get a feel for what they’ll do for your digital image
    compositing pipeline in combination with alpha channels, opacity, layers, and
    layer styles. This is one area where experience with the modes helps you to know
    what will work and what will not for a given image.


    ## Summary


    In this ninth chapter, we explored using blending modes to apply powerful, pixel-based
    algorithms to your digital image composites using Photoshop and GIMP. We looked
    at the basic `Mode` menus in Photoshop and GIMP to see what blending mode algorithms
    those packages supported, and observed that the advanced functionality of blending
    modes is one of the areas that differentiates Photoshop CS6 from GIMP 2.8.14,
    with Photoshop giving you six additional blending mode algorithms.


    You learned about how to create the inner drop shadow in GIMP using the multiply
    mode and a work process that involved duplicating text, selecting alpha data,
    masking, and applying a blur filter.


    We looked at some of the other popular blending modes in Photoshop, which we did
    not look at in GIMP, and applied these to your Photoshop file for the chapter.
    We also added blending modes and layer styles to more of your layers to increase
    the complexity of the project even further and demonstrate what blending modes
    can do in conjunction with alpha channels and layer styles.


    In [Chapter 10](#A978-1-4842-4060-1_10_Chapter.html), you will learn more about
    digital image compositing software’s Modal Operation and how these modal operations
    work with digital image compositing layers and layer functionality, as the two
    go hand in hand.


    # 10. The Modality of Digital Imaging: Modal Operation


    Now that you’ve learned some of the basic components of digital image compositing,
    such as concepts and terms, alpha channels, selection sets (masking), layers,
    blending modes, and the like, let’s spend a chapter taking a closer look at the
    nature of the modal operation of advanced digital imaging software. This modal
    operation is also present in other high-end multimedia production software packages,
    such as 3D, digital video editing and special effects, and audio packages. This
    modal functionality is also part of programming languages, such as C, C#, C++,
    Python, Java, JavaFX, and JavaScript.


    Due to the modality of these advanced software packages, there are a number of
    factors—in this case, operational modes— whose settings you need to keep track
    of in your mind at all times during your operation (use) of the program.


    This is because the settings for these modes—for example, what tool you are using;
    your tool option settings; which layer is selected; what keyboard modifier (e.g.,
    `Shift`, `Control`, `Alternate`) is being held down; which blending mode is selected;
    which icon (e.g., visibility, lock, etc.) is on or off; and so on—will determine
    the end result that you get with the software.


    ## Modal Operation: Part of the Pipeline


    Just like there is a compositing pipeline that processes your image layer, mode,
    and channel settings as it progresses up the layer stack from bottom to top, there
    is a more complex operational-settings pipeline that the digital image compositing
    software is processing in real time as you use the software. To be able to produce
    the result you are asking the software to create, it has to pay attention to the
    tool you have selected, the layer you are working on, and the options you have
    selected, as well as what you are doing with your mouse and keyboard.


    ### Processing Pipeline: Tool, Options, and Settings


    Since this is a book about the fundamentals of digital image compositing, and
    not its advanced functions, I am not going to get into the level of what tool,
    option, layer, alpha channel, selection set, blending mode, key modifier, and
    pixel location (real-time mouse location, movement, drag, etc.) is processed in
    what order inside of the software code base. From a user perspective, that does
    not really matter anyway, because before you use the tool (move the mouse, click,
    drag, or depress keyboard keys), you set all of the modes that define what is
    going to happen before you start using your selected tool. If you set these operational
    modes incorrectly, you will get unintended results. Sometimes, these can even
    be really cool unintended results, which you might decide to keep!


    Since these expert software packages have many different tools and options, most
    of which can affect one another, the use of complex, new media software can quickly
    become an advanced project, as you have to keep all of these settings, and relationships,
    straight in your mind. This is similar to computer programming where you have
    to keep track of variables and how you are processing them in a similar fashion.
    The more complex your image composite (or software application) gets, the more
    components you have to keep straight in your mind, in real time, as you work on
    it.'
