  trans: '

    # Android Studio：PorterDuff 类


    Google Android 操作系统平台所驱动的智能手机、电子书阅读器、平板电脑、智能电视、游戏机、智能手表以及物联网设备，数量远超历史上任何其他操作系统平台。事实上，从
    2013 年到 2016 年，我为 Apress 撰写了一系列 Pro Android 专业书籍，包括《Pro Android Graphics》（2013）、《Pro
    Android UI》（2014）和《Pro Android Wearables》（2015），目前我正在撰写《Pro Android IoT》（2016）。我在《Pro
    Android Graphics》中详细讲解了如何使用 PorterDuff 像素混合与像素传输模式进行编码。


    图 14-8 展示了该书中的一张截图，显示了 Eclipse IDE 中 Nexus One 模拟器上使用的三种不同混合模式。自 Android 5 起，IntelliJ
    IDE 已成为 Android Studio 开发者进行 Android 应用开发的主要集成开发环境。


    ![A978-1-4842-4060-1_14_Fig8_HTML.jpg](img/A978-1-4842-4060-1_14_Fig8_HTML.jpg)


    图 14-8. 《Pro Android Graphics》中使用 PorterDuff 模式示例的截图


    组装这个合成管道的 Java 代码相当复杂，包括一个 PNG24 背景板、一个 PNG32 环形元素、一个 PNG32 3D 标志，以及一个由蒙版（Alpha
    通道）控制的黑色填充色，如图 14-9 所示。


    ![A978-1-4842-4060-1_14_Fig9_HTML.jpg](img/A978-1-4842-4060-1_14_Fig9_HTML.jpg)


    图 14-9. 实现合成管道的 Java 代码


    下面我将逐一讲解图 14-9 中每条语句的作用，这样你可以看到一个与本书前面章节中熟悉的基于图层的合成管道相匹配的代码合成管道。


    在 Android 中，图层被称为 `LayerDrawable`，因此第一行代码通过 `getResources().getDrawable()` 方法调用（即“点链”）将
    `contents_layers.png` 资源加载到 `LayerDrawable` 中。


    为了测试，我注释掉了 `backgroundImage` 板，因此这里只介绍 `foregroundImage` 板的代码。为了创建图像图层，我创建了一个名为
    `foregroundImage` 的 `Bitmap` 对象，然后通过 `BitmapFactory.decodeResource()` 方法调用将名为
    `cloudsky.png` 的图像资源加载到其中。


    接着，我通过 `.copy()` 方法调用将该 `Bitmap` 对象放入内存，并指定 32 位 ARGB 颜色深度（这也称为“色彩空间”），使其成为可变的（即可更改的）。`ARGB_8888`
    表示每个通道使用 8 位数据值。


    然后，我在一个 `Paint` 对象上通过 `.setXfermode()` 方法设置了一个 PorterDuff 传输模式（有时称为“混合模式”，尽管严格来说，某些混合模式会传输像素，而不是将它们混合在一起），这里使用了
    XOR 模式。


    接下来，我创建了一个名为 `layerOne` 的 `Drawable` 对象，然后将一个名为 `composite` 的 `Bitmap` 对象加载到其中，并作为
    `mutableComposite` 加载到内存中。


    使用该对象，我创建了一个名为 `compositeImage` 的 `Bitmap` 对象。接着，我创建了一个用于绘制的 `Canvas` 对象，命名为 `imageCanvas`，然后将
    `compositeImage` 这个 `Bitmap` 对象加载到该 `Canvas` 对象中。


    之后，我使用 `imageCanvas.drawBitmap()` 方法调用在 `Canvas` 对象上绘制 `Bitmap` 对象，该方法使用一个 1000
    像素的正方形 `Rect` 对象指定绘制区域，并通过 `paintObject` 和作为 `Bitmap` 对象的 `mutableForegroundImage`
    来应用混合模式。这就是我指定颜色深度或色彩空间为 32 位（即 `ARGB_8888`）的位图或光栅图像。


    我在用户界面设计中创建了一个名为 `porterDuffImageComposite` 的 `ImageView` 来承载（显示）这个数字图像合成管道，然后通过
    `.setImageBitmap()` 方法调用加载了该 `ImageView`。


    如你所见，这段 Java 代码中包含了许多我在本书中讲解过的元素，而且可以肯定，所有这些概念都得到了本章所涉及的每个主流平台（Java、JavaFX、HTML5、CSS3、JavaScript、Android）领域的支持。


    这很大程度上是因为这些平台都是开源的，同样开源的还有所有 Porter Duff 模式、OpenGL、JPEG、GIF 和 PNG 格式、Alpha 通道，甚至包括
    GIMP 数字图像合成软件。


    由于数字图像合成的所有领域都将“免费用于商业用途”，因此开源平台完全整合这些技术是合情合理的。


    对于所有数字图像合成爱好者来说，这无疑是个极好的消息！我希望你们在阅读这十四个章节的过程中，都能享受到学习各种数字图像合成基础知识所带来的乐趣。


    ## 总结


    在这第十四个也是最后一个章节中，我们深入探讨了一些与计算机编程相关的高级主题，以及不同的编程语言如何在数字图像合成软件内部（作为工作流程或特效插件脚本工具）或外部，支持你的数字图像合成工作。这些语言可以通过添加交互性以及其他有用功能，将你的创作提升到新的水平；其可能性仅受限于你的想象力！


    首先，我们介绍了 Photoshop 中使用的 VBScript、AppleScript、JavaScript 和 ExtendScript 语言。接着，我们探讨了
    GIMP 中用于脚本编程的基于 LISP 的 Scheme 和基于 Python 的 PyGIMP 语言，以及如何在数字图像合成软件包中访问它们，方便你直接使用第三方编写的其他脚本。之后，我们回顾了一些流行的开源平台编程语言，以及如何利用它们创建与
    Photoshop 和 GIMP 中相同的数字图像合成效果配置。


    我们首先介绍了 Java 及其 JavaFX 新媒体引擎，并看到了该平台如何支持数字图像合成，以及高级混合模式和特效算法。然后，我们审视了 HTML5 和
    CSS3，并发现该平台也能仅使用标记语言来实现你在本书中学到的数字图像合成概念和技术，用于网站和 HTML5 操作系统应用等交付成果。


    最后，我们探讨了目前使用 Java 7 的 Android 5.3 操作系统，但未来它将能运行 HTML5 和 JavaFX 应用。我们研究了 `PorterDuff`
    类和一些高级代码，展示了在 Android 中如何为精通数字图像合成的先进应用编写包含混合模式的合成管道。


    我希望你喜欢这本书，以及我在其中讲解的数字图像合成概念、技术和基础知识。现在，去实践吧，并融入你周围的环境！

