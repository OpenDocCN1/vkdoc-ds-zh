  trans: '

    我决定使用**运动模糊**算法，原因有三：首先，它面向好莱坞风格；其次，我无需使用移动工具来移动需要模糊的对象，因为该算法会自动移动像素；第三，我希望模糊效果径直向左，这通常是实现（应用）运动模糊的通用方式。此外，由于圆环元素触及了该合成图像的顶部和底部边缘，阴影必须位于你的正左方，这样才能避免它在数字图像合成的顶部或底部被裁切。


    选择你的 `RingShadow` 图层，然后依次点击 `滤镜 ➤ 模糊 ➤ 运动模糊` 菜单，打开图 10-12 左侧所示的 `运动模糊` 对话框。接着，将
    `角度` 设置为 0，`长度` 设置为 12 像素的运动模糊，并点击 `确定` 按钮。0–360 度的角度从 9 点钟方向开始顺时针递增，因此你需要使用值
    0 来创建你的 `角度`，从而得到正左方的设置。


    现在，如果你尚未操作，请选择 `RingElement` 图层，然后选择 `正常` 混合模式，如图 10-13 顶部所示。这将使你能够在蓝色金属圆环元素就位的情况下，看到运动模糊阴影的效果。你会注意到，GIMP
    的这一运动模糊算法在创建定向投影特效方面表现出色！


    ![A978-1-4842-4060-1_10_Fig13_HTML.jpg](img/A978-1-4842-4060-1_10_Fig13_HTML.jpg)

    *图 10-13.*


    要查看运动模糊阴影对你的蓝色金属圆环元素产生的效果，请选择 `RingElement` 图层和 `正常` 混合模式。


    还需要注意的一点是，我们省略了你在内阴影效果工作流程中执行的几个步骤，因为你无需使用移动工具来定位此效果！


    我刚意识到我忘记应用合成文本图层的彩色玻璃效果了，就像我们在 Photoshop 中使用强光模式所做的那样。因此，接下来，让我们选择 `Compositing`
    文本图层并设置 `强光` 模式。


    这将使垂直文本看起来好得多，如图 10-14 所示。


    ![A978-1-4842-4060-1_10_Fig14_HTML.jpg](img/A978-1-4842-4060-1_10_Fig14_HTML.jpg)

    *图 10-14.*


    要在 GIMP 中为文本应用彩色玻璃效果，请选择 `Compositing` 图层并设置 `强光` 模式。


    现在，你需要解决 `RingShadow` 图层在 `差值` 模式下阻挡 `Niki` 图层像素的问题。在尝试使用 GIMP 模拟我们的 Photoshop
    合成结果时，我们必须处理这个问题。


    要解决此问题，请选择你的 `RingElement` 图层，然后右键单击它，再次使用 `Alpha 到选区`。接着，点击你的 `RingShadow` 图层将其选中，然后按下
    `Delete` 键。


    如图 10-15 所示，此过程会移除 `RingElement` 下方黑色的（未使用或不可见）像素。我关闭了图层可见性，以便你能清晰地看到这一点。现在，`差值`
    算法可以处理 `Niki` 图层的像素，而你的投影效果仍将保留。


    ![A978-1-4842-4060-1_10_Fig15_HTML.jpg](img/A978-1-4842-4060-1_10_Fig15_HTML.jpg)

    *图 10-15.*


    要移除 `RingElement` 下方黑色的（不可见）像素，请选择 `RingShadow` 图层并按下 `Delete`。


    现在，通过使用 `选择 ➤ 取消选择` 菜单序列来取消选区，我们收尾吧！


    选择你的 `RingElement` 图层，将模式设置回 `差值`，如图 10-16 所示，现在你将得到预期的结果。你已经使用 GIMP 中的六个图层，模拟了之前在
    Photoshop 中用四个图层创建的所有效果。


    ![A978-1-4842-4060-1_10_Fig16_HTML.jpg](img/A978-1-4842-4060-1_10_Fig16_HTML.jpg)

    *图 10-16.*


    选择 `RingElement` 图层并将模式设置为 `差值`，以使用特效为圆环元素着色。


    在这里逐层比较时，重要的是要观察到，你的两个 Photoshop 图层使用了 (fx) 子图层。有人可能会认为，这意味着 Photoshop 也使用了六个图层，这使得两个软件中的图层数量非常接近。


    如你所见，这两个 2D 数字图像合成软件都能够通过使用正确的工作流程和正确的模式操作序列（顺序），产生令人惊叹的视觉效果。这正是我本章想要演示的内容，现在我们可以继续探讨特殊效果应用，使用
    Photoshop 和 GIMP 中的滤镜菜单。


    需要注意的是，如果你想在数字成像软件中安装插件，滤镜菜单就是访问这些专用特效算法的地方。


    ## 总结


    在第十章中，我们详细介绍了 Photoshop 和 GIMP 中的模式操作将如何极大地影响你的数字图像合成努力的成功（和失败）。偶尔，模式设置中的错误也会产生一些非常酷的意外结果，你可以声称这些结果是你有意创造的！


    我们还研究了数字图像编辑和合成软件工具、工具选项、图层、通道、选区、模式和菜单如何以模态方式协同工作，根据各自的设置来共同创建最终的合成结果。


    你看到，复杂的图像合成并不像表面上看起来那么容易。在我们探讨了模式操作的一些一般考虑因素之后，我们使用 Photoshop 创建了一些更高级的合成作品。


    在本章后面，我们使用 GIMP 2.8.14 以及不同的工具、模式操作和工作流程，复制了相同的视觉效果。


    你使用 Photoshop 添加了调整图层蒙版，该蒙版仅对 `RingElement` 图层中的圆环元素内部的像素进行着色。为了使你的 GIMP 图像合成与
    Photoshop 数字图像合成完全一致，你随后在 GIMP 中模拟了该效果，并为你的 `RingElement` 图层创建了投影效果，为 `Compositing`
    文本图层创建了玻璃文字效果。


    在第 11 章中，你将了解更多关于数字图像合成软件的第三方插件，以及如何通过两个软件包中的滤镜菜单访问它们以及集成（永久）插件。


    # 11. 数字成像的自动化：插件滤镜


    既然我们已经涵盖了数字图像合成中的主要基础主题，让我们花一章的时间来轻松一下，看看插件软件。插件可以通过让你在对话框中简单地设置一些选项并点击 `确定` 按钮，来自动为你实现专门的成像效果！这些插件通常位于你的数字图像合成软件包中的
    `滤镜`（Photoshop）或 `过滤器`（GIMP）菜单中。


    由于 GIMP 的插件是免费的，我们要做的第一件事就是了解如何为 GIMP 2.8.14 软件包查找、安装和使用插件滤镜。


    Photoshop 也有大量的插件，其中大多数已经是 Photoshop CS6 软件包的一部分，并且还有几家第三方公司也为 Photoshop 提供额外的插件。要在互联网上找到这些，请使用关键词“Photoshop
    插件”进行谷歌搜索。


    之后，我们将研究如何将插件滤镜整合到数字图像合成工作流程中，并继续为你第 10 章的图像合成作品（针对 Photoshop CS6 和 GIMP 2.8.14）应用特效。

    '
- fmt: "# GIMP Plug-In Filters: Enhancing GIMP 2.8\n\nThere are dozens of plug-ins\
    \ already installed in GIMP when you buy the program, including the most popular\
    \ plug-in filters, under the Filters menu and its many submenus. In this section\
    \ of the chapter, I am going to show you how to access hundreds more of these\
    \ plug-in filters from the Gimp.org web site, and then, over the remainder of\
    \ the chapter, we will take a look at how to use and apply plug-in filters to\
    \ your digital image compositing work process. If you go to the GIMP home page\
    \ at `gimp.org`, you will see a Plug-in Registry link in blue on the lower-right-hand\
    \ side of the home page links, as shown in Figure [11-1](#A978-1-4842-4060-1_11_Chapter.html#Fig1).\
    \ This link accesses the plug-in registry, where you will find hundreds of plug-ins\
    \ that you can download. These plug-ins are created by people and companies for\
    \ other users of GIMP to use in their digital image compositing work process.\
    \ You can also write your own plug-ins using the `PyGIMP`, `Scheme` or `Script-Fu`\
    \ languages which are a part of GIMP. I will be covering this in [Chapter 14](#A978-1-4842-4060-1_14_Chapter.html).\n\
    \n![A978-1-4842-4060-1_11_Fig1_HTML.jpg](A978-1-4842-4060-1_11_Fig1_HTML.jpg)\n\
    \nFigure 11-1. On the right side of the `gimp.org` home page, you can find a Plug-in\
    \ Registry link\n\nAfter you click the blue Plug-in Registry link, you will be\
    \ taken to the `registry.gimp.org` page, which is shown in Figure [11-2](#A978-1-4842-4060-1_11_Chapter.html#Fig2).\
    \ Look for the Browse the Registry section, which has links allowing you to browse\
    \ the plug-ins by date, tags, or alphabetically. If you find any plug-ins that\
    \ you want, click the corresponding link to download the file to your hard drive.\
    \ Later you can transfer the file to the `Gimp/Downloads` folder, which I am going\
    \ to show you how to find on your hard drive next.\n\n![A978-1-4842-4060-1_11_Fig2_HTML.jpg](A978-1-4842-4060-1_11_Fig2_HTML.jpg)\n\
    \nFigure 11-2. In the Browse the Registry section on the `registry.gimp.org` page,\
    \ you can browse the plug-ins by various criteria\n\nTo install a plug-in, simply\
    \ place it into your GIMP Plug-Ins folder and restart the program. It will then\
    \ load into system memory. It is important to note that the Plug-Ins folder is\
    \ not under your `C:/Program Files/Gimp 2` folder but is instead located in the\
    \ Users subfolder. On my machine, the path to this folder is `C:/Users/Default.Default-PC/.gimp-2.8/plug-ins`,\
    \ as seen in the navigation bar in Figure [11-3](#A978-1-4842-4060-1_11_Chapter.html#Fig3).\n\
    \n![A978-1-4842-4060-1_11_Fig3_HTML.jpg](A978-1-4842-4060-1_11_Fig3_HTML.jpg)\n\
    \nFigure 11-3. You can find the Plug-Ins folder in the Users subfolder, which,\
    \ for my computer, is at `C:/Users/Default.Default-PC/.gimp-2.8/plug-ins`\n\n\
    Since I just installed GIMP 2.8 for the book, the folder is empty, as the plug-ins\
    \ that are a part of GIMP are no longer stored in it. In this chapter, I’m going\
    \ to cover plug-ins that are a part of GIMP 2.8.14, as these have been selected\
    \ and approved by the GIMP software development team.\n\n## GIMP’s Filters Menu:\
    \ Using Plug-In Filters\n\nLet’s get right down to business and start making our\
    \ digital image compositing project have even more visual impact than it has already.\
    \ We will do this by applying filters to the backplate, or background image if\
    \ you prefer that term, and I will also show you how to do this using a non-destructive\
    \ work process. In this chapter we will start with the GIMP Filters menu, and\
    \ then finish up by taking a look at the Photoshop Filter menu. Both packages\
    \ have a significant number of impressive, and powerful, plug-in filter offerings\
    \ that you will enjoy exploring and using to enhance your artistic creations.\n\
    \nStart by opening your `Chapter10modalOperation.xcf` native GIMP format file\
    \ and left-clicking the Niki Black & White layer to select. Right-click and choose\
    \ Duplicate Layer, to duplicate the layer, and to implement your non-destructive\
    \ editing, as seen in Figure [11-4](#A978-1-4842-4060-1_11_Chapter.html#Fig4).\n\
    \n![A978-1-4842-4060-1_11_Fig4_HTML.jpg](A978-1-4842-4060-1_11_Fig4_HTML.jpg)\n\
    \nFigure 11-4. To use Plug-In Filters, first select the Niki Black & White layer,\
    \ then right-click on the layer and select the Duplicate Layer menu option\n\n\
    Notice that along with the black-and-white version of Niki, your Layer Mask (alpha\
    \ channel data) is also copied, so that we can apply a cool pixel processing effect\
    \ to the background, behind the ring, and keep the photograph of Niki in color\
    \ by using the Layer Mask. First, I double-clicked the layer name (copy), renaming\
    \ it “Filter Special Effect.” With this new layer selected, I next used the `Filters\
    \ ➤ Artistic ➤ Cartoon` menu sequence to access a Cartoon dialog, where I set\
    \ a 7 pixel mask radius, and 100 percent black value of 1.000 (which is 100 percent\
    \ using floating point math terms), as shown in Figure [11-5](#A978-1-4842-4060-1_11_Chapter.html#Fig5).\n\
    \n![A978-1-4842-4060-1_11_Fig5_HTML.jpg](A978-1-4842-4060-1_11_Fig5_HTML.jpg)\n\
    \nFigure 11-5. To access the Cartoon dialog, I selected a layer and used the `Filters\
    \ ➤ Artistic ➤ Cartoon` menu sequence\n\nIf you select the Preview check box in\
    \ any Filter dialog, you will be able to see the effect of that filter’s settings.\
    \ You can also drag the preview window area to show areas of the image you are\
    \ interested in previewing. In this case, it was the lace blouse that I wanted\
    \ to preview, because I wanted to bring it out (make it “pop”) by using this Cartoon\
    \ filter.\n\nNotice the white outline in the selected layer in both Figures [11-5](#A978-1-4842-4060-1_11_Chapter.html#Fig5)\
    \ and [11-6](#A978-1-4842-4060-1_11_Chapter.html#Fig6), showing the respective\
    \ preview icon that I selected for the filter to operate on (and use for a preview)\
    \ before I invoked the filter. This is another example of a modal operation, as\
    \ the filter looks to a selected layer preview icon, to see whether to operate\
    \ on the layer image or the layer mask.\n\n![A978-1-4842-4060-1_11_Fig6_HTML.jpg](A978-1-4842-4060-1_11_Fig6_HTML.jpg)\n\
    \nFigure 11-6. A masked cartoon effect greatly enhances the image background outside\
    \ the ring\n\nThis also lends more flexibility to your special effects application,\
    \ as you can apply any of these filters to either an image or a mask (alpha channel),\
    \ which allows far more artistic latitude when you want to create visually impressive\
    \ special effects.\n\nLet’s now take a look at how to use plug-ins in Photoshop.\
    \ The plug-in filters are one of the features that are different between GIMP\
    \ and Photoshop. Filters are essentially image special effects algorithms. You\
    \ will not be able to get exactly the same background outside of the ring effect\
    \ in both software packages.\n\nHowever, you can get the same result by using\
    \ Photoshop and GIMP at the same time! That’s right—I do it all the time, by creating\
    \ a computer clipboard feature to transfer pixel arrays back and forth between\
    \ the different layers in the programs, using the following modal operations (1\
    \ and 2 apply to the source; 3 and 4 apply to the target):\n\n- Select the layer\
    \ containing filtered effect  \n- `Select ➤ All`, and then: `Edit ➤ Copy`  \n\
    - `Layer ➤ New Layer` (bottom of layer stack)  \n- `Edit ➤ Paste` (with the new\
    \ layer selected)\n\nI’m hoping that this book will assist you in thinking outside\
    \ of the “digital image compositing box” a little bit!"
  raw: '## GIMP Plug-In Filters: Enhancing GIMP 2.8


    There are dozens of plug-ins already installed in GIMP when you buy the program,
    including the most popular plug-in filters, under the Filters menu and its many
    submenus. In this section of the chapter, I am going to show you how to access
    hundreds more of these plug-in filters from the Gimp.org web site, and then, over
    the remainder of the chapter, we will take a look at how to use and apply plug-in
    filters to your digital image compositing work process. If you go to the GIMP
    home page at gimp.org, you will see a Plug-in Registry link in blue on the lower-right-hand
    side of the home page links, as shown in Figure [11-1](#A978-1-4842-4060-1_11_Chapter.html#Fig1).
    This link accesses the plug-in registry, where you will find hundreds of plug-ins
    that you can download. These plug-ins are created by people and companies for
    other users of GIMP to use in their digital image compositing work process. You
    can also write your own plug-ins using the PyGIMP, Scheme or Script-Fu languages
    which are a part of GIMP. I will be covering this in [Chapter 14](#A978-1-4842-4060-1_14_Chapter.html).


    ![A978-1-4842-4060-1_11_Fig1_HTML.jpg](A978-1-4842-4060-1_11_Fig1_HTML.jpg)


    Figure 11-1.


    On the right side of the gimp.org home page, you can find a Plug-in Registry link


    After you click the blue Plug-in Registry link, you will be taken to the registry.gimp.org
    page, which is shown in Figure [11-2](#A978-1-4842-4060-1_11_Chapter.html#Fig2).
    Look for the Browse the Registry section, which has links allowing you to browse
    the plug-ins by date, tags, or alphabetically. If you find any plug-ins that you
    want, click the corresponding link to download the file to your hard drive. Later
    you can transfer the file to the Gimp/Downloads folder, which I am going to show
    you how to find on your hard drive next.


    ![A978-1-4842-4060-1_11_Fig2_HTML.jpg](A978-1-4842-4060-1_11_Fig2_HTML.jpg)


    Figure 11-2.


    In the Browse the Registry section on the registry.gimp.org page, you can browse
    the plug-ins by various criteria


    To install a plug-in, simply place it into your GIMP Plug-Ins folder and restart
    the program. It will then load into system memory. It is important to note that
    the Plug-Ins folder is not under your C:/Program Files/Gimp 2 folder but is instead
    located in the Users subfolder. On my machine, the path to this folder is C:/Users/Default.Default-PC/.gimp-2.8/plug-ins,
    as seen in the navigation bar in Figure [11-3](#A978-1-4842-4060-1_11_Chapter.html#Fig3).


    ![A978-1-4842-4060-1_11_Fig3_HTML.jpg](A978-1-4842-4060-1_11_Fig3_HTML.jpg)


    Figure 11-3.


    You can find the Plug-Ins folder in the Users subfolder, which, for my computer,
    is at C:/Users/Default.Default-PC/.gimp-2.8/plug-ins


    Since I just installed GIMP 2.8 for the book, the folder is empty, as the plug-ins
    that are a part of GIMP are no longer stored in it. In this chapter, I’m going
    to cover plug-ins that are a part of GIMP 2.8.14, as these have been selected
    and approved by the GIMP software development team.


    ## GIMP’s Filters Menu: Using Plug-In Filters


    Let’s get right down to business and start making our digital image compositing
    project have even more visual impact than it has already. We will do this by applying
    filters to the backplate, or background image if you prefer that term, and I will
    also show you how to do this using a non-destructive work process. In this chapter
    we will start with the GIMP Filters menu, and then finish up by taking a look
    at the Photoshop Filter menu. Both packages have a significant number of impressive,
    and powerful, plug-in filter offerings that you will enjoy exploring and using
    to enhance your artistic creations.


    Start by opening your Chapter10modalOperation.xcf native GIMP format file and
    left-clicking the Niki Black & White layer to select. Right-click and choose Duplicate
    Layer, to duplicate the layer, and to implement your non-destructive editing,
    as seen in Figure [11-4](#A978-1-4842-4060-1_11_Chapter.html#Fig4).


    ![A978-1-4842-4060-1_11_Fig4_HTML.jpg](A978-1-4842-4060-1_11_Fig4_HTML.jpg)


    Figure 11-4.


    To use Plug-In Filters, first select the Niki Black & White layer, then right-click
    on the layer and select the Duplicate Layer menu option


    Notice that along with the black-and-white version of Niki, your Layer Mask (alpha
    channel data) is also copied, so that we can apply a cool pixel processing effect
    to the background, behind the ring, and keep the photograph of Niki in color by
    using the Layer Mask. First, I double-clicked the layer name (copy), renaming
    it “Filter Special Effect.” With this new layer selected, I next used the Filters
    ➤ Artistic ➤ Cartoon menu sequence to access a Cartoon dialog, where I set a 7
    pixel mask radius, and 100 percent black value of 1.000 (which is 100 percent
    using floating point math terms), as shown in Figure [11-5](#A978-1-4842-4060-1_11_Chapter.html#Fig5).


    ![A978-1-4842-4060-1_11_Fig5_HTML.jpg](A978-1-4842-4060-1_11_Fig5_HTML.jpg)


    Figure 11-5.


    To access the Cartoon dialog, I selected a layer and used the Filters ➤ Artistic
    ➤ Cartoon menu sequence


    If you select the Preview check box in any Filter dialog, you will be able to
    see the effect of that filter’s settings. You can also drag the preview window
    area to show areas of the image you are interested in previewing. In this case,
    it was the lace blouse that I wanted to preview, because I wanted to bring it
    out (make it “pop”) by using this Cartoon filter.


    Notice the white outline in the selected layer in both Figures [11-5](#A978-1-4842-4060-1_11_Chapter.html#Fig5)
    and [11-6](#A978-1-4842-4060-1_11_Chapter.html#Fig6), showing the respective preview
    icon that I selected for the filter to operate on (and use for a preview) before
    I invoked the filter. This is another example of a modal operation, as the filter
    looks to a selected layer preview icon, to see whether to operate on the layer
    image or the layer mask.


    ![A978-1-4842-4060-1_11_Fig6_HTML.jpg](A978-1-4842-4060-1_11_Fig6_HTML.jpg)


    Figure 11-6.


    A masked cartoon effect greatly enhances the image background outside the ring


    This also lends more flexibility to your special effects application, as you can
    apply any of these filters to either an image or a mask (alpha channel), which
    allows far more artistic latitude when you want to create visually impressive
    special effects.


    Let’s now take a look at how to use plug-ins in Photoshop. The plug-in filters
    are one of the features that are different between GIMP and Photoshop. Filters
    are essentially image special effects algorithms. You will not be able to get
    exactly the same background outside of the ring effect in both software packages.


    However, you can get the same result by using Photoshop and GIMP at the same time!
    That’s right—I do it all the time, by creating a computer clipboard feature to
    transfer pixel arrays back and forth between the different layers in the programs,
    using the following modal operations (1 and 2 apply to the source; 3 and 4 apply
    to the target):


    Select the layer containing filtered effect   Select ➤ All, and then: Edit ➤ Copy
      Layer ➤ New Layer (bottom of layer stack)   Edit ➤ Paste (with the new layer
    selected)


    I’m hoping that this book will assist you in thinking outside of the “digital
    image compositing box” a little bit!'
  trans: '

    # GIMP 插件滤镜：强化 GIMP 2.8


    当你购买 GIMP 时，该程序中已安装了数十个插件，其中包括最受欢迎的插件滤镜，它们位于“滤镜”菜单及其众多子菜单下。在本章的这部分，我将向你展示如何从 Gimp.org
    网站访问数百个这类插件滤镜，然后在本章剩余部分，我们将探讨如何将插件滤镜运用到你数字图像合成的工作流程中。如果你访问 `gimp.org` 上的 GIMP
    主页，你会在主页链接的右下角看到一个蓝色的**插件注册表**链接，如图 11-1 所示。此链接可访问插件注册表，你可以在其中找到数百个可供下载的插件。这些插件由个人和公司为其他
    GIMP 用户创建，供其在数字图像合成工作流程中使用。你也可以使用 GIMP 附带的 `PyGIMP`、`Scheme` 或 `Script-Fu` 语言编写自己的插件。我将在第
    14 章中介绍这一点。


    ![A978-1-4842-4060-1_11_Fig1_HTML.jpg](img/A978-1-4842-4060-1_11_Fig1_HTML.jpg)


    图 11-1. 在 `gimp.org` 主页的右侧，你可以找到一个插件注册表链接


    点击蓝色的插件注册表链接后，你将被带到 `registry.gimp.org` 页面，如图 11-2 所示。找到“浏览注册表”部分，其中包含允许你按日期、标签或字母顺序浏览插件的链接。如果你找到任何想要的插件，请点击相应的链接将文件下载到你的硬盘。之后，你可以将文件传输到
    `Gimp/Downloads` 文件夹，接下来我将向你展示如何在你的硬盘上找到该文件夹。


    ![A978-1-4842-4060-1_11_Fig2_HTML.jpg](img/A978-1-4842-4060-1_11_Fig2_HTML.jpg)


    图 11-2. 在 `registry.gimp.org` 页面的“浏览注册表”部分，你可以按各种条件浏览插件


    要安装插件，只需将其放入你的 GIMP 插件文件夹，然后重新启动程序。它将会加载到系统内存中。需要注意的是，插件文件夹不在 `C:/Program Files/Gimp
    2` 文件夹下，而是位于用户子文件夹中。在我的机器上，该文件夹的路径是 `C:/Users/Default.Default-PC/.gimp-2.8/plug-ins`，如图
    11-3 的导航栏所示。


    ![A978-1-4842-4060-1_11_Fig3_HTML.jpg](img/A978-1-4842-4060-1_11_Fig3_HTML.jpg)


    图 11-3. 你可以在用户子文件夹中找到插件文件夹，以我的电脑为例，路径是 `C:/Users/Default.Default-PC/.gimp-2.8/plug-ins`


    由于我是为了本书才刚安装 GIMP 2.8，该文件夹是空的，因为作为 GIMP 一部分的插件不再存储在其中。在本章中，我将介绍属于 GIMP 2.8.14
    的插件，因为这些插件已经过 GIMP 软件开发团队的挑选和批准。


    ## GIMP 的滤镜菜单：使用插件滤镜


    让我们直接进入正题，开始让我们的数字图像合成项目比以往具有更强的视觉冲击力。我们将通过对背景板（如果你更喜欢这个术语，也可以叫背景图像）应用滤镜来做到这一点，同时我还会向你展示如何使用无损工作流程来做到这一点。在本章中，我们将从
    GIMP 的滤镜菜单开始，最后以查看 Photoshop 的滤镜菜单结束。这两个软件包都提供了大量令人印象深刻且功能强大的插件滤镜供你探索和使用，从而增强你的艺术创作。


    首先，打开你的 `Chapter10modalOperation.xcf` 原生 GIMP 格式文件，左键点击选择“Niki 黑白”图层。右键点击并选择“复制图层”来复制该图层，以实现你的无损编辑，如图
    11-4 所示。


    ![A978-1-4842-4060-1_11_Fig4_HTML.jpg](img/A978-1-4842-4060-1_11_Fig4_HTML.jpg)


    图 11-4. 要使用插件滤镜，首先选择“Niki 黑白”图层，然后右键点击该图层并选择“复制图层”菜单选项


    请注意，连同 Niki 的黑白版本，你的图层蒙版（Alpha 通道数据）也被复制了，这样我们就可以给戒指后面的背景应用一个酷炫的像素处理效果，并通过使用图层蒙版保留
    Niki 的彩色照片。首先，我双击图层名称（副本），将其重命名为“滤镜特效”。选中这个新图层后，接着我使用 `滤镜 ➤ 艺术效果 ➤ 卡通` 菜单序列打开“卡通”对话框，在其中设置
    7 像素的蒙版半径和数值为 1.000 的 100% 黑色（使用浮点数术语即为 100%），如图 11-5 所示。


    ![A978-1-4842-4060-1_11_Fig5_HTML.jpg](img/A978-1-4842-4060-1_11_Fig5_HTML.jpg)


    图 11-5. 要打开“卡通”对话框，我选择了一个图层并使用了 `滤镜 ➤ 艺术效果 ➤ 卡通` 菜单序列


    如果你在任何滤镜对话框中选中“预览”复选框，你将能够看到该滤镜设置的效果。你还可以拖动预览窗口区域，显示你感兴趣预览的图像区域。在这种情况下，我想预览的是蕾丝衬衫，因为我希望通过使用这个卡通滤镜来突出它（让它“跃然眼前”）。


    请注意，在图 11-5 和图 11-6 中，选中图层内部的白色轮廓，显示了我在调用滤镜之前为滤镜操作（并用于预览）选择的相应预览图标。这是模态操作的另一个示例，因为滤镜会查看所选图层的预览图标，以确定是对图层图像还是图层蒙版进行操作。


    ![A978-1-4842-4060-1_11_Fig6_HTML.jpg](img/A978-1-4842-4060-1_11_Fig6_HTML.jpg)


    图 11-6. 带蒙版的卡通效果极大地增强了戒指外部的图像背景


    这还为你的特效应用提供了更多灵活性，因为你可以将任何这些滤镜应用于图像或蒙版（Alpha 通道），当你想创建视觉上令人印象深刻的特效时，这能提供更多的艺术自由度。


    现在，让我们来看看如何在 Photoshop 中使用插件。插件滤镜是 GIMP 和 Photoshop 之间的不同之处之一。滤镜本质上是图像特效算法。在这两个软件包中，你无法在戒指外部背景区域获得完全相同的效果。


    然而，你可以通过同时使用 Photoshop 和 GIMP 来获得相同的结果！没错——我一直都在这样做，方法是利用计算机剪贴板功能，在程序的不同图层之间来回传输像素阵列，使用以下模态操作（操作
    1 和 2 应用于源图层；操作 3 和 4 应用于目标图层）：


    - 选择包含滤镜效果的图层

    - `选择 ➤ 全部`，然后：`编辑 ➤ 复制`

    - `图层 ➤ 新建图层`（图层堆栈底部）

    - `编辑 ➤ 粘贴`（选中新图层的情况下）


    我希望这本书能帮助你跳出“数字图像合成”的传统思维框架！

    '
- fmt: '# Photoshop’s Filter Menu: Using Plug-In Filters


    Let’s simulate the same compositing process that we just completed in GIMP, in
    Photoshop. Since the adjustment layer does not have a filter mask, we will need
    to change the set-up for our adjustment layer, essentially reversing it, which
    will show you some new modal operation “moves,” as I call them, to set the Photoshop
    composite up to be able to do what we were doing in the GIMP composite.


    Start your modal work process by opening up your [Chapter 10](#A978-1-4842-4060-1_10_Chapter.html)
    Photoshop file, `Chapter10modalOperation.psd`, and selecting the back plate (bottom
    layer) background image layer. Then use your `Layer ➤ Duplicate Layer` menu sequence
    to access the `Duplicate Layer` dialog, shown in Figure [11-7](#A978-1-4842-4060-1_11_Chapter.html#Fig7),
    and name your new layer, “Plug-In Filter Effect.”


    ![A978-1-4842-4060-1_11_Fig7_HTML.jpg](A978-1-4842-4060-1_11_Fig7_HTML.jpg)


    **Figure 11-7.** To start the compositing process in Photoshop, follow the `Layer
    ➤ Duplicate Layer` menu sequence to access the `Duplicate Layer` dialog.


    The second step in this work process, to simulate what you have done with GIMP,
    is to drag this `Plug-In Filter Effect` layer to the bottom of your layer stack,
    thereby making it the backplate, and guaranteeing that when you apply the plug-in
    filter to it, it will be behind or underneath everything else that is in the compositing
    pipeline (the pixel processing order).


    The next step is to drag the adjustment layer mask icon out of (from) the orange
    adjustment layer, and drop it on your `Niki` layer, which should now be directly
    underneath your adjustment layer, as shown in Figure [11-8](#A978-1-4842-4060-1_11_Chapter.html#Fig8).
    You will see a white outline around the `Niki` layer when your icon is over the
    layer correctly. When you see this, drop the layer mask icon. This will change
    what this mask is referred to, from the adjustment layer mask, to being a layer
    mask.


    ![A978-1-4842-4060-1_11_Fig8_HTML.jpg](A978-1-4842-4060-1_11_Fig8_HTML.jpg)


    **Figure 11-8.** The second step of the compositing process is to drag the adjustment
    layer mask onto the `Niki` layer.


    The adjustment layer mask is now back to being all white, as you need it to be
    to apply adjustments to the entire backplate. Notice that Photoshop has more advanced
    drag and drop capabilities, such as this ability to simply drag layer mask data
    between layers, that GIMP 2.8.14 does not yet feature. There is always the chance
    that GIMP 3.0 will add these capabilities at some later date in the software development
    cycle.


    The next step in the work process is to drag the orange adjustment layer so that
    it goes underneath your `Niki` layer, but over the `Plug-In Filter Effect` layer,
    as can be seen in Figure [11-9](#A978-1-4842-4060-1_11_Chapter.html#Fig9). Since
    this adjustment is now only applied to the backplate, you don’t need the `clip
    to layer` option, which attaches (isolated the adjustment) only to layers which
    are directly underneath it.


    ![A978-1-4842-4060-1_11_Fig9_HTML.jpg](A978-1-4842-4060-1_11_Fig9_HTML.jpg)


    **Figure 11-9.** The next step is to drag the adjustment layer underneath your
    `Niki` layer.


    As you can see in Figure [11-9](#A978-1-4842-4060-1_11_Chapter.html#Fig9), the
    desired effect is the opposite of what we need. If you want the effect, you will
    need to keep the `Niki` layer mask as is; if you wanted the effect you created
    in GIMP, you would need to invert the layer mask.


    The work process to accomplish the objective will involve selecting the `Niki`
    layer, then the layer mask icon, within your `Niki` layer, indicating to Photoshop
    that this is the data you wish to submit for image adjustment processing.


    Remember, using the modal operation is the key to the successful usage of digital
    image compositing software. In this case, this would involve the selection of
    the layer mask component of the `Niki` layer before you invoke your `Invert Adjustment
    Mask` operation in Photoshop CS6 by selecting the `Adjustment Mask` and inverting
    it, which we’ll do next.


    Again, you can see that the `Niki` layer is selected using the gray color, as
    is shown in Figure [11-10](#A978-1-4842-4060-1_11_Chapter.html#Fig10), and that
    the layer mask is selected using a white outline with four corner squares.


    ![A978-1-4842-4060-1_11_Fig10_HTML.jpg](A978-1-4842-4060-1_11_Fig10_HTML.jpg)


    **Figure 11-10.** To invert the layer mask, select `Niki Layer Mask` and invert
    the layer mask pixels.


    Next, you will use the `Image ➤ Adjustments ➤ Invert` menu sequence, also shown
    in Figure [11-10](#A978-1-4842-4060-1_11_Chapter.html#Fig10), to invert the selected
    layer mask. This will result in the outside of your `RingElement` layer object
    being changed to black and white, while the inside becomes color, due to the reversal
    of what the layer mask is telling the adjustment layer to process and display.


    As you can see in Figure [11-11](#A978-1-4842-4060-1_11_Chapter.html#Fig11), the
    desired effect is now in place, and you can now select your `Plug-In Filter Effect`
    layer and use the `Filter ➤ Filter Gallery` menu sequence to access the Photoshop
    CS6 artistic effects plug-in filter collection.


    ![A978-1-4842-4060-1_11_Fig11_HTML.jpg](A978-1-4842-4060-1_11_Fig11_HTML.jpg)


    **Figure 11-11.** To access the artistic effects plug-in filter collection, select
    the backplate and follow the `Filter ➤ Filter Gallery` menu sequence.


    The `Filter Gallery` plug-in collection, at one time, consisted of individual
    plug-in filters, all accessed using the Photoshop Filter menu. These have now
    been consolidated into one user interface, which can be seen in Figure [11-12](#A978-1-4842-4060-1_11_Chapter.html#Fig12).
    I selected the `Brush Strokes` section, and then clicked an `Ink Outline` filter
    to apply it.


    ![A978-1-4842-4060-1_11_Fig12_HTML.jpg](A978-1-4842-4060-1_11_Fig12_HTML.jpg)


    **Figure 11-12.** Results of selecting the `Brush Stokes` section and clicking
    the `Ink Outline` filter to apply it.


    As you can see, in Figure [11-13](#A978-1-4842-4060-1_11_Chapter.html#Fig13),
    although not identical, you have achieved a similar visual upgrade to your compositing
    project as you did in GIMP: the outside of the ring element with the text is stylized
    and the inside is original photographic quality imagery.


    ![A978-1-4842-4060-1_11_Fig13_HTML.jpg](A978-1-4842-4060-1_11_Fig13_HTML.jpg)


    **Figure 11-13.** Your visual upgrade will result in the backplate being differentiated
    using a special effect.


    In the next chapter, we will take a closer look at your compositing pipeline for
    this project, and what it is doing, as well as further enhance the image composite
    and learn some new software features in both Photoshop CS6 and GIMP 2.8.14.


    ## Summary


    In this eleventh chapter, we went over the plug-in filters in Photoshop and GIMP
    and how they can be used as “miniature programs within a program” to add even
    more special effects wow factor to your digital image compositing pipeline and
    projects. You learned about GIMP’s plug-in repository and then implemented special
    effects, using filters inside both GIMP and Photoshop.


    In GIMP, you again implemented non-destructive editing by adding another layer
    that you can use for applying the special effects filter. This time, the work
    process (modal operation) was easier, based on how GIMP works, as you simply had
    to duplicate one single layer that conveniently includes the layer mask that you
    need.


    In order to achieve similar image compositing processing pipeline results in Photoshop,
    you had to change your layer, layer mask, adjustment layer, and adjustment layer
    mask processing pipeline around. This showed you how to use some really useful
    new moves, work processes, and artistic filter features in Photoshop CS6.


    In [Chapter 12](#A978-1-4842-4060-1_12_Chapter.html), we will learn more about
    digital image compositing software pipelines and what exactly is going on under
    the hood, so you can see why the modal operation is important.'
