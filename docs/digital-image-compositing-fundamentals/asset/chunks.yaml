  trans: '

    ### Photoshop 脚本：JavaScript 与 ExtendScript


    脚本是一系列编程语句，用于指示数字图像合成应用程序执行一系列任务，或者我称之为“操作”或工作流程。像 Photoshop 这样的 Adobe 应用程序支持基础的脚本语言，包括
    JavaScript 和 Adobe 自有的扩展 JavaScript，称为 ExtendScript。JavaScript 是一种脚本语言，最初作为 ECMAScript
    开发，用于使网页具有交互性。事实上，它至今仍被用于此目的，并且其功能强大到足以编写休闲游戏。


    如果你使用 Mac OSX，还可以选择使用 `AppleScript`；如果使用 Windows，则可以使用 `VBScript`（也称为 `VBA` 或
    `Visual Basic`）。`VBScript` 是 `Visual Basic` 的一个版本，由微软开发的编程语言，但不包含该程序的所有高级功能。`VBScript`
    可以通过 ActiveX Scripting 与宿主应用程序通信。你可以在互联网上找到许多专业的 `VBScript` 编辑器。如果你使用 Microsoft
    Office，可以通过 `工具 ➤ 宏 ➤ Visual Basic 编辑器` 菜单序列找到内置的 `Visual Basic` 编辑器。我推荐使用 JavaScript，因为它是开源的，因此不像
    `AppleScript` 和 `VBScript` 那样具有专有性。


    你应该养成使用 `.jsx` 扩展名（而非标准的 `.js` 扩展名）保存 JavaScript 脚本的习惯，以防你升级使用 Adobe ExtendScript
    (JSX) Photoshop 脚本语言。


    如果你喜欢分享自己的脚本作品，JavaScript 相比 `VBScript` 和 `AppleScript` 还有另一个重要优势：JavaScript 既可以在微软
    Windows 操作系统上使用，也可以在苹果 Macintosh OSX 上使用。


    在 Photoshop 中，你只能从应用程序内部访问 `.jsx` 文件。使用 JavaScript 的另一个优势是，你必须从应用程序外部运行 `AppleScript`
    或 `Visual Basic` 脚本。学习使用开放平台语言进行编程有很多好处，因为这类语言正在被广泛使用。


    要编写 JavaScript 脚本，你可以使用文本编辑器，也可以使用 Adobe 应用程序提供的 ESTK ExtendScript 工具包。ESTK 具有许多功能，使其比文本编辑器更容易使用。这些功能包括内置的语法检查器，可以识别脚本中的问题所在，以及无需将脚本保存到文件即可直接从
    ESTK 运行脚本的能力。此功能可以为你节省大量的开发时间，因为你需要多次测试脚本才能使其正常工作。


    要运行 JavaScript 脚本（无论是由你还是他人编写），请使用 `文件 ➤ 脚本 ➤ 浏览` 菜单序列，如图 14-1 所示。


    ![A978-1-4842-4060-1_14_Fig1_HTML.jpg](img/A978-1-4842-4060-1_14_Fig1_HTML.jpg)


    图 14-1. 要加载 JavaScript，请转到 `文件 ➤ 脚本 ➤ 浏览`


    正如你可能已经推测到的，GIMP 中的脚本编写与 Photoshop 中的非常不同，并且使用不同的语言。


    ### GIMP 脚本：Scheme、Script-Fu 和 Python


    GIMP 有两种不同复杂程度的脚本编写方式。GIMP 内置了一种名为 `Scheme` 的 LISP 编程语言变体，它运行一种名为 Script-Fu（嘿，大家跟我一样猜的！）的脚本语言。此外还有
    `PyGIMP`，它是一个支持 GIMP 功能的定制版 Python，可以访问底层 API（应用程序编程接口）调用。`PyGIMP` 比 `Scheme`
    更强大。因此，如果你要编写复杂的插件，请使用 `PyGIMP`；如果是要自动化工作流程，请使用 Script-Fu。


    你可以在网上找到大量免费的 Script-Fu 脚本，通过一个相当简单的工作流程，即可下载并安装到你自己的 GIMP 副本中。下载脚本后，你应该将其复制或移动到你的
    GIMP 脚本目录。如果你不知道针对操作系统的脚本目录路径，可以使用 GIMP 的 `文件 ➤ 首选项` 菜单序列打开首选项对话框来查找，如图 14-2 所示。


    ![A978-1-4842-4060-1_14_Fig2_HTML.jpg](img/A978-1-4842-4060-1_14_Fig2_HTML.jpg)


    图 14-2. 要查找操作系统对应的脚本目录路径，请从 `文件 ➤ 首选项` 菜单序列开始操作


    打开首选项对话框后，在 `文件夹 ➤ 脚本` 区域查找脚本路径，如图 14-3 所示。我的路径是：`C:/Users/PC-Name-Here/.gimp-2.8/scripts`。


    ![A978-1-4842-4060-1_14_Fig3_HTML.jpg](img/A978-1-4842-4060-1_14_Fig3_HTML.jpg)


    图 14-3. 打开首选项对话框后，在 `文件夹 ➤ 脚本` 区域查找脚本目录的路径


    要安装已复制到脚本文件夹的这些脚本，你可以退出并重新启动 GIMP，或者直接刷新 GIMP 的菜单结构。


    这可以通过使用 `滤镜 ➤ Script-Fu ➤ 刷新脚本` 菜单序列来完成，如图 14-4 所示。执行此操作后，你的新脚本将出现在某个菜单中。如果找不到它们，请在
    `滤镜` 菜单下查找。如果它们没有出现在任何地方，说明 Script-Fu 出现了问题，并产生了语法（编程或脚本）错误。


    ![A978-1-4842-4060-1_14_Fig4_HTML.jpg](img/A978-1-4842-4060-1_14_Fig4_HTML.jpg)


    图 14-4. 你可以通过 `滤镜 ➤ Script-Fu` 菜单序列访问 GIMP 脚本


    正如你所见，如果你需要在 GIMP 或 Photoshop 中自动化工作流程，这些编程工具完全可以做到。在下一节中，让我们来看看一些最流行平台上的数字图像合成：Java
    和 JavaFX、HTML5 和 CSS3，以及适用于 Android 操作系统的 Android Studio。

    '
- fmt: '# Java and JavaFX: `javafx.scene.effect` API


    Digital image compositing pipelines can be built and controlled using code in
    the Java programming language, as can be seen in Figure [14-5](#A978-1-4842-4060-1_14_Chapter.html#Fig5).
    The back plate imagery is a PNG24, the 3D logo is a PNG32, and the script text
    images are PNG32 as well. Java has a library called JavaFX that provides support
    for expansive new media assets, spanning digital imaging, digital audio, digital
    video, and i3D real-time OpenGL rendering. Most of the digital imaging modes,
    filters, and effects we’ve been using in this book are located in the `javafx.scene.effects`
    library. Java is used in Android Studio, HTML5 Browsers, Windows, Macintosh OSX,
    Linux Distributions, and Open Solaris OS. JavaFX apps can run on Android and iOS;
    thus Java 7 and 8, the world’s most popular programming language, is truly “Code
    once, deliver everywhere.”


    ![A978-1-4842-4060-1_14_Fig5_HTML.jpg](A978-1-4842-4060-1_14_Fig5_HTML.jpg)


    Figure 14-5. Image compositing pipelines using Java and JavaFX


    The splash screen for a game I am coding for my upcoming “Pro Java Games Development”
    title, coming out from Apress in 2016, can be seen in Figure [14-5](#A978-1-4842-4060-1_14_Chapter.html#Fig5).
    The upper-left quadrant is the splash screen itself and uses a PNG24 back plate
    image overlaid with PNG23 composite images (two), text elements, and user interface
    button elements.


    The Java and JavaFX code can be seen in Figure [14-6](#A978-1-4842-4060-1_14_Chapter.html#Fig6).
    The JavaFX API is part of the Java API; thus, JavaFX is Java. These were separate
    programming languages until JavaFX was acquired by Sun Microsystems, right before
    it was acquired by Oracle.


    ![A978-1-4842-4060-1_14_Fig6_HTML.jpg](A978-1-4842-4060-1_14_Fig6_HTML.jpg)


    Figure 14-6. Java and JavaFX code creates splash screen variants


    I show the code for two of the buttons—the Instructions and the Copyrights buttons,
    called `helpButton` and `legalButton` in the Java code—in Figure [14-6](#A978-1-4842-4060-1_14_Chapter.html#Fig6).
    I do not seek to teach you coding during this chapter; however Java code is understandable
    enough for explaining what is going on for this particular compositing pipeline,
    which is shown in Figure [14-5](#A978-1-4842-4060-1_14_Chapter.html#Fig5).


    In Figure [14-6](#A978-1-4842-4060-1_14_Chapter.html#Fig6), the `boardGameBackPlate.setImage(transparentLogo);`
    Java statement is changing my digital image asset in my back plate layer, using
    terms that you are now familiar with from this book.


    The `colorAdjust.setHue(0.4);` Java statement color shifts the logo 40 percent
    (you previously color shifted it 140 percent, going from a cyan to a wine color)
    around the color wheel. The `colorAdjust.setHue(-0.4);` Java code color shifts
    the logo 40 percent around the color wheel in the opposite direction. With a color
    slider visualization, this would be 40 percent to your right (positive) and 40
    percent to your left (negative), respectively.


    Vertical, y-axis pixel positioning is being accomplished using the `infoOverlay.setTranslateY(350);`
    and the Java code and text spacing are being accomplished using an `infoOverlay.setLineSpacing(-12);`
    Java statement. This is how an image composite is created with code!


    Next, let’s take a look at image compositing pipelines, implemented using only
    basic markup languages (HTML5 and CSS3).


    ## HTML5 and CSS3: Markup Compositing


    Whereas Java (JavaFX) is the most popular programming language, the HTML5 and
    CSS3 markup languages are the most widespread as far as usage is concerned. This
    is because the latter two are featured in every browser, using an API called WebKit,
    which is similarly used by Android and iOS and so HTML5 and CSS3 are therefore
    also supported in these OSs. There are also several HTML5 OSs out now, not surprisingly,
    from the makers of the HTML5 browsers, including Chrome OS, Firefox OS, and Opera
    OS. They are used in smart phones, tablets, and iTV sets. For instance, Panasonic
    iTV sets use Firefox OS; Sony Bravia iTV sets use the Opera OS; Google has a range
    of Chrome hardware products; and Alcatel uses the Mozilla Firefox OS for its smart
    phones internationally.


    I composited the HDTV resolution [`www.iTVset.com`](http://www.itvset.com/) web
    site, using only lossless codecs and using a combination of PNG24 and animated
    GIF for backplate sections, and PNG32 for all i3D UI element overlays. As you
    can see, in Figure [14-7](#A978-1-4842-4060-1_14_Chapter.html#Fig7), this entire
    site looks like a truecolor digital image, but is animated and interactive. The
    site was coded using only 24 lines of HTML5, and features a less-than-2-MB total
    graphic image asset data footprint overhead.


    ![A978-1-4842-4060-1_14_Fig7_HTML.jpg](A978-1-4842-4060-1_14_Fig7_HTML.jpg)


    Figure 14-7. A website I composited using HTML5 and CSS3 markup


    This small data footprint was made possible by using this digital image compositing
    pipeline, because it allowed the granularization of digital image assets into
    smaller file sizes for faster data transfer speeds over the Internet.


    A good analogy for this data granularization is sand through an hourglass, the
    finer the sand, the smoother and the faster it will flow through any bottlenecked
    scenario.


    A lot of indexed color assets were used, allowing for a site that looks like it
    is truecolor, but in fact, is not. For instance, all six animated 3D elements
    on this page can use an indexed color animGIF file format with the 1-bit premultiplied
    alpha channel. I premultiplied the anti-aliasing color using an average background
    color, to hide anti-aliasing in the average surrounding background color value.
    For the Butterfly fish this was a bluish water color value, for instance.


    The i3D user interface button elements use the PNG32 format, where the alpha channel
    composites the UI seamlessly over any background image, in any section of the
    web site, including digital video, Java (JavaFX) applications, 3D animation as
    seen on the home page, and full-screen imagery.


    Graphics elements are held in HTML5 `<DIV>` tags, and CSS3 is used for blending,
    opacity, positioning, and interactivity. I do not obstruct the right-click action
    with my code, in any way, so you can right-click on the site to “view as source”
    to look at any of this code, at any time during this site’s development. The text
    is rendered by WebKit in its own `<DIV>` tag regions, using HTML5 to define the
    content and metatags, and using CSS3 to define transparency, font, color, size,
    and the margins and padding (text `<DIV>` container spacing) values.


    As you can see, just like Java or JavaFX, HTML5 and CSS3 can provide you with
    an image compositing pipeline that can be almost as powerful as the custom image
    compositing pipelines that you can create using GIMP and Photoshop. However, you
    will have to be a creative and a savvy programmer in order to “pull” these capabilities
    out of these popular, open source, computer programming languages. It’s worth
    the effort, I promise!'
