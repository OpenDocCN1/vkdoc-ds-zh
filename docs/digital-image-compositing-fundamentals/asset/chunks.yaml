    裁剪对话框的结果如图 3-5 所示。


    ![A978-1-4842-4060-1_3_Fig5_HTML.jpg](img/A978-1-4842-4060-1_3_Fig5_HTML.jpg)


    图 3-5.


    `图像 ➤ 画布大小`操作的结果


    就像 Photoshop CS 同时具备`图像 ➤ 画布大小`功能和裁剪工具一样，GIMP 也拥有裁剪工具。请在工具面板中寻找刀形图标，如图 3-6 中以蓝色高亮选中的部分所示。该工具具有大量选项，可在工具面板下方查看。


    ![A978-1-4842-4060-1_3_Fig6_HTML.jpg](img/A978-1-4842-4060-1_3_Fig6_HTML.jpg)


    图 3-6.


    如图中以蓝色高亮显示的部分，GIMP 具备一个裁剪工具（刀形图标），并带有许多选项


    Photoshop 的选项沿屏幕顶部显示，如图 3-3 所示。在 GIMP 中，我选择了`五等分规则`选项来使用精细裁剪网格。我将左边缘定位在 x 轴上的
    121 位置（在 Photoshop 中我使用了 116）。


    GIMP 还会向我显示这个 571 像素图像的大小，以便我获得想要实现的精确结果。如你所见，这两个图像工具对裁剪操作提供了不同的方法，但两者都能达到同样专业水平的最终结果。


    如你所见，只要你善加利用，GIMP 和 Photoshop 都提供了强大的图像裁剪和图像缩放工具。


    ## 总结


    在第三章中，我们探讨了宽高比的概念，它用于定义图像的矩形形状。你了解了一些当今消费电子硬件设备最常用的宽高比，以及计算宽高比背后的数学原理。最后，我们学习了如何通过在缩放时锁定宽高比，或使用裁剪工具或`画布大小`对话框，来避免在更改图像分辨率或宽高比时产生变形。我们详细介绍了在
    Photoshop CS6 和 GIMP 2.8.14 中如何访问和使用裁剪工具及`画布大小`对话框。


    在下一章中，我们将深入研究数字图像色彩理论，并探讨颜色在数字图像合成流程和数字图像中是如何表示的。


    # 4. 数字成像的色彩：色彩理论


    既然你已经了解了如何使用定义图像分辨率和图像宽高比的`x,y`网格来定位像素，那么现在是时候深入每个像素内部，看看它是如何定义其色彩空间的。虽然数字图像在数据层面上保存了其分辨率和宽高比，但每个像素都包含其自身的特性，例如`x,y`网格（阵列）位置、颜色构成、透明度或不透明度、混合模式等等。我们将在本书的各个章节中逐一探讨所有这些领域。


    构成数字图像的像素颜色最终决定了图像的外观，因此色彩理论在此是一个重要主题。Photoshop CS6 和 GIMP 2.8.14 都拥有大量的工具，使我们能够调整颜色，以及根据颜色值来选择像素。


    如果你正在使用现代的消费电子设备，那么你就在使用`RGB`（红、绿、蓝）像素颜色模型。如果你在处理现代打印机，那么你就在使用`CMYK`（青、品红、黄、黑）颜色模型。


    如果你想知道为什么缩写不是`CMYB`，那是因为它的黑色版被称为“关键”版，其他颜色版都与其对齐。


    在本章中，我们将研究这两种颜色模型，以及最适合用于数字图像合成流程的颜色模型或“模式”。现在，让我们开始吧！


    ## 色彩理论：使用像素颜色通道


    无论你是在合成用于显示屏的数字图像，还是使用油墨在打印机上进行打印，你的像素都会包含使用一个或多个“通道”的颜色值。在印刷行业中，这些通道有时被称为“印版”，延续了老式印刷机使用金属印版的传统（其中一些至今仍在使用）。在
    Photoshop 和 GIMP 中，颜色通道拥有自己的浮动面板，允许你只处理单个颜色通道（或印版），这对于特殊效果或其他高级图像操作来说非常有用。

