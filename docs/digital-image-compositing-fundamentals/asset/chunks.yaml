- fmt: '# Color Depth: Bit Levels that Define Color


    In addition to the number of bits used to define color within a digital image
    and the file format, color depth uses those data bits to define the amount of
    color available to each of the pixels in a digital image. Common color depths
    used in the digital imaging industry include 8-bit, 16-bit, 24-bit, and 32-bit.
    I’ll outline the common file formats for each bit depth (color depth) in this
    chapter and mention the new High Dynamic Range Image (HRDI) and RAW formats, which
    can hold 48 bits or 64 bits of color image data, here as well. I will also point
    out which widely used digital image formats are supported in Android, HTML5, Java
    and JavaFX, in case you are a multimedia producer, or a computer programmer, as
    well.


    A medium color depth image features a 16-bit color depth and thus contains 65,536
    colors (calculated as 256 times 256). It is supported by the Targa (TGA) and Tagged
    Image File Format (TIFF) digital image formats. If you want to use digital image
    formats other than the standard GIF, JPEG, and PNG in your Java programming, you
    would need to import the Java Image library.


    True color imagery features the 24-bit color depth, and thus contains over 16
    million colors. This is calculated as 256 times 256 times 256, which will equal
    16,777,216 colors. File formats supporting 24-bit color depth include: JPEG (or
    JPG), PNG, BMP, XCF, PSD, TGA, TIFF, and RAW. Java supports three of these: JPEG,
    PNG24 (24 bit), and PNG32 (32 bit). Using 24-bit color depth will give you the
    highest quality level. This is why I’m recommending the use of PNG24 or PNG32
    for Java, HTML5 and Android-based apps and games.


    ## Indexed Color: Using Palettes to Hold 256 Colors


    The lowest color depth exists in 8-bit indexed color images. These images feature
    a maximum of 256 color values, which is why they are considered 8-bit images,
    and use an indexed “palette” of colors, which is why they are called “indexed
    color images.” Popular image file formats for indexed color include GIF, PNG8,
    TIFF, BMP, and TGA.


    The way that you convert your 24-bit, true color imagery data into an indexed
    color image format (GIF or PNG8) using Photoshop is to use a `File ➤ Save for
    Web` menu sequence. This opens the Save for Web dialog shown in Figure [5-1](#A978-1-4842-4060-1_5_Chapter.html#Fig1),
    which will allow you to set the file format (GIF or PNG8); number of colors; color
    conversion algorithm (perceptual, selective, adaptive, or restrictive); dithering
    algorithm (diffusion, pattern or noise); and a number of other advanced options.


    ![A978-1-4842-4060-1_5_Fig1_HTML.jpg](A978-1-4842-4060-1_5_Fig1_HTML.jpg)


    **Figure 5-1.** You can use Save for Web in Photoshop to create indexed color
    images


    The number of colors that I selected for this image is 8 bit (256 colors), to
    show you what a good job the indexed color algorithm does. Notice that the image
    preview looks just like a true color image. You can select any number of colors,
    between 2 and 256, that is.


    As an example of color depth, if you selected 2 colors that would be a 1-bit (PNG1)
    image, 4 colors would be a PNG2 (2-bit color depth) image, 16 colors would be
    a 4-bit PNG4 color depth image, 64 colors would be a 6-bit PNG6, and 128 colors
    would be a 7-bit PNG7 image.


    The color selection algorithm drop-down, which is to the left of the number of
    colors drop-down selector, offers several different algorithms that select colors
    for your indexed color palette. I prefer Perceptual, however there are also Selective,
    Adaptive, and Restrictive algorithms. The best way to approach the use of these
    algorithms is visually, selecting one and then taking a look at your preview for
    the result. You can observe your file size in the bottom-left corner of the screen,
    as can be seen in Figure [5-1](#A978-1-4842-4060-1_5_Chapter.html#Fig1).


    You can see the dithering selection algorithm drop-down menu underneath the color
    selection algorithm menu. I prefer Diffusion dithering, but there is also a Pattern
    setting, and a Noise (random) setting, as well. Dithering is the process of placing
    dot patterns between two different colors in a gradient to reduce an effect often
    seen in indexed color imagery, called “banding.” There is also a drop-down menu
    to set the amount of dithering that the algorithm will apply; I usually leave
    it set at 100 percent, and let the algorithm do its thing.


    The Interlaced option usually adds to the data footprint (file size), and allows
    progressive rendering, for use on your web page. The Matte option allows edge
    smoothing against color values which you can supply if you are using an alpha
    channel in an indexed color image. We’ll be covering this in [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html).


    You also have the choice of using the following functions: Embed your Color Profile
    (for this image, inside of the file) and Convert to sRGB (for the image color
    profile), but generally, you will want to keep these unselected, unless you have
    a good reason for using them present itself to you.


    Next, let’s take a look at how to convert true color image data to indexed color
    image data using GIMP 2.8.14. As you will see in Figure [5-2](#A978-1-4842-4060-1_5_Chapter.html#Fig2),
    the way to get this dialog in GIMP is to use the `Image ➤ Mode ➤ Indexed` menu
    sequence. This will bring up an Indexed Color Conversion dialog. This has fewer
    options than Photoshop’s Save for Web dialog, but the important ones are there,
    so that you can specify color depth (bit level) and dithering.


    ![A978-1-4842-4060-1_5_Fig2_HTML.jpg](A978-1-4842-4060-1_5_Fig2_HTML.jpg)


    **Figure 5-2.** GIMP’s `Image ➤ Mode ➤ Indexed` creates indexed color


    In GIMP, I usually use one of the Floyd-Steinberg diffuse dithering algorithms;
    in this case, it is the one that reduces color bleeding, which keeps the color
    edges clean and tight. I also select the full 256 colors, which you’ll usually
    want to do, unless you need to save a few kilobytes in data footprint, which isn’t
    really worth the loss in image quality.


    ## High Color: Using a 15-Bit and 16-Bit Color Depth


    A medium color depth exists in rare 15- or 16-bit high-color images. The reason
    I say “rare” is because 15- and 16-bit file formats are not widely supported in
    the open source platforms (Android, Java, JavaFX, HTML5, CSS3, JavaScript) that
    everyone is using across all of their cool consumer electronics devices.


    A 15-bit high-color format supports 32,768 color values, usually configured in
    the 555 RGB format, which means 5 bits of data are used for each of your 15-bit
    color RGB color channels.


    A 16-bit high-color format supports 65,536 color values, usually configured in
    the 565 RGB format, which means 5 bits of data are used for each of the Red and
    Blue channels with 6 bits of data being utilized in the Green color channel.


    You might be wondering why this extra bit of resolution, representing an additional
    32,768 levels of color intensity, is allocated to the Green color channel. The
    reason is that the green channel in your image holds the majority of the contrast
    data for your imagery! This is one of those key tidbits of information that makes
    this book so valuable, as the application of this knowledge to how you do things
    in GIMP or Photoshop will make a major difference in the quality of the resulting
    imagery.


    Therefore, using a 565 RGB configuration for a high-color image will always produce
    a crisper, clearer image result. The digital imagery formats that support high
    color include: TIFF, TGA, BMP, and (Photoshop) PSD. Unfortunately, none of these
    formats are supported in Android or HTML5, or even in Java, JavaFX, or JavaScript,
    at least without using third-party image file format import libraries.


    Next, let’s take a look at the true-color (24-bit) image format, which we used
    to learn about color theory in [Chapter 4](#A978-1-4842-4060-1_4_Chapter.html).'
