  trans: '

    # 色深：定义颜色的位深


    除了用于定义数字图像内颜色以及文件格式的位数之外，色深还利用这些数据位来定义数字图像中每个像素可用颜色的数量。数字图像行业中常用的色深包括 8 位、16 位、24
    位和 32 位。我将在本章中概述每种位深（色深）的常见文件格式，并在此提及能够存储 48 位或 64 位彩色图像数据的新型高动态范围图像（HRDI）和 RAW
    格式。此外，考虑到您可能是多媒体制作人或计算机程序员，我也会指出 Android、HTML5、Java 和 JavaFX 所支持的广泛使用的数字图像格式。


    中等色深图像采用 16 位色深，因此包含 65,536 种颜色（计算方式为 256 乘以 256）。Targa（TGA）和标签图像文件格式（TIFF）这两种数字图像格式支持该色深。如果您想在
    Java 编程中使用除标准 GIF、JPEG 和 PNG 之外的其他数字图像格式，则需要导入 Java 图像库。


    真彩色图像采用 24 位色深，因此包含超过 1600 万种颜色。计算方式为 256 乘以 256 再乘以 256，结果等于 16,777,216 种颜色。支持
    24 位色深的文件格式包括：JPEG（或 JPG）、PNG、BMP、XCF、PSD、TGA、TIFF 和 RAW。Java 支持其中三种：JPEG、PNG24（24
    位）和 PNG32（32 位）。使用 24 位色深将为您提供最高级别的图像质量。这就是我建议在基于 Java、HTML5 和 Android 的应用程序和游戏中使用
    PNG24 或 PNG32 的原因。


    ## 索引颜色：使用调色板容纳 256 种颜色


    最低的色深存在于 8 位索引颜色图像中。这些图像最多包含 256 种颜色值，这就是它们被认为是 8 位图像的原因，并且它们使用一种索引“调色板”来管理颜色，因此被称为“索引颜色图像”。索引颜色的流行图像文件格式包括
    GIF、PNG8、TIFF、BMP 和 TGA。


    使用 Photoshop 将您的 24 位真彩色图像数据转换为索引颜色图像格式（GIF 或 PNG8）的方法是使用 `文件 ➤ 存储为 Web 所用格式`
    菜单序列。这将打开如图 5-1 所示的“存储为 Web 所用格式”对话框，该对话框允许您设置文件格式（GIF 或 PNG8）、颜色数量、颜色转换算法（感知、选择性、自适应或受限）、抖动算法（扩散、图案或噪声）以及许多其他高级选项。


    ![A978-1-4842-4060-1_5_Fig1_HTML.jpg](img/A978-1-4842-4060-1_5_Fig1_HTML.jpg)


    **图 5-1.** 您可以在 Photoshop 中使用“存储为 Web 所用格式”来创建索引颜色图像


    我为此图像选择的颜色数量是 8 位（256 色），以便向您展示索引颜色算法的出色表现。请注意，图像预览看起来就像一张真彩色图像。您可以选择介于 2 到 256
    种之间的任意颜色数量。


    作为色深的一个示例，如果您选择 2 种颜色，那将是一个 1 位（PNG1）图像；4 种颜色将是 PNG2（2 位色深）图像；16 种颜色将是 4 位的 PNG4
    色深图像；64 种颜色将是 6 位的 PNG6 图像；128 种颜色将是 7 位的 PNG7 图像。


    位于颜色数量下拉选择器左侧的颜色选择算法下拉菜单，提供了几种用于为您的索引颜色调色板选择颜色的不同算法。我偏好“感知”算法，但也有“选择性”、“自适应”和“受限”算法。使用这些算法的最佳方法是直观地选择一种，然后查看预览结果。您可以观察屏幕左下角的文件大小，如图
    5-1 所示。


    您可以在颜色选择算法菜单下方看到抖动选择算法下拉菜单。我偏好“扩散”抖动，但也有“图案”设置和“噪声”（随机）设置。抖动是一种在渐变的两种不同颜色之间放置点阵图案的过程，用以减少索引颜色图像中常见的一种称为“条带”的效果。还有一个下拉菜单用于设置算法将应用的抖动程度；我通常将其设置为
    100%，让算法自行处理。


    “交错”选项通常会增大数据占用空间（文件大小），并允许渐进式渲染，适用于您的网页。“杂边”选项允许针对您提供的颜色值进行边缘平滑处理，前提是您在索引颜色图像中使用
    Alpha 通道。我们将在第 6 章中讨论这一点。


    您还可以选择使用以下功能：嵌入颜色配置文件（针对此图像，位于文件内部）和转换为 sRGB（针对图像颜色配置文件），但通常情况下，您会希望保持这些选项不被选中，除非您有充分的理由使用它们。


    接下来，让我们看看如何使用 GIMP 2.8.14 将真彩色图像数据转换为索引颜色图像数据。正如您将在图 5-2 中看到的，在 GIMP 中调出此对话框的方法是使用
    `图像 ➤ 模式 ➤ 索引` 菜单序列。这将弹出一个“索引颜色转换”对话框。它比 Photoshop 的“存储为 Web 所用格式”对话框选项少，但重要的选项都在，以便您可以指定色深（位深）和抖动。


    ![A978-1-4842-4060-1_5_Fig2_HTML.jpg](img/A978-1-4842-4060-1_5_Fig2_HTML.jpg)


    **图 5-2.** GIMP 的 `图像 ➤ 模式 ➤ 索引` 创建索引颜色


    在 GIMP 中，我通常使用 Floyd-Steinberg 扩散抖动算法之一；在这种情况下，使用的是能减少颜色渗色的那种，它可以保持颜色边缘干净而紧凑。我还选择了完整的
    256 种颜色，除非您需要节省几 KB 的数据占用空间，否则通常您都会想这么做，但牺牲图像质量来节省这点空间并不值得。


    ## 高彩色：使用 15 位和 16 位色深


    中等色深存在于较少见的 15 位或 16 位高彩色图像中。我说“较少见”是因为 15 位和 16 位文件格式在所有人都用于其各种酷炫消费电子设备的开源平台（Android、Java、JavaFX、HTML5、CSS3、JavaScript）上并未得到广泛支持。


    15 位高彩色格式支持 32,768 种颜色值，通常配置为 555 RGB 格式，这意味着您的 15 位颜色 RGB 颜色通道各使用 5 位数据。


    16 位高彩色格式支持 65,536 种颜色值，通常配置为 565 RGB 格式，这意味着红色和蓝色通道各使用 5 位数据，而绿色通道则使用 6 位数据。


    您可能会好奇，为什么这额外的分辨率位（代表了额外的 32,768 级颜色强度）被分配给了绿色通道。原因在于，图像中的绿色通道承载了您图像的大部分对比度数据！这是使本书如此有价值的关键知识点之一，因为将这些知识应用到您在
    GIMP 或 Photoshop 中的操作方式上，将对最终图像的质量产生重大影响。


    因此，为高彩色图像使用 565 RGB 配置总能产生更清晰、更鲜明的图像效果。支持高彩色的数字图像格式包括：TIFF、TGA、BMP 和（Photoshop）PSD。不幸的是，在
    Android 或 HTML5 中，甚至在 Java、JavaFX 或 JavaScript 中，这些格式均不受支持，至少在不使用第三方图像文件格式导入库的情况下是不支持的。


    接下来，让我们看看真彩色（24 位）图像格式，我们在第 4 章中曾用它学习色彩理论。

    '
- fmt: '### True Color: Using a 24-Bit Color Image Backplate


    As I have already pointed out, one of the most widely used file formats in digital
    imaging is the JPEG file format, which comes in one flavor: 24 bit. Other file
    formats that support 24 bits of color data include `BMP`, `TIFF`, `TGA`, `PSD`,
    and `PNG24`. Since `PNG` also supports 8 bit (`PNG8`) or 32 bit (`PNG32`) color,
    I call a 24-bit PNG format `PNG24`, to be precise.


    As you learned in [Chapter 4](#A978-1-4842-4060-1_4_Chapter.html), true color
    (also known as “truecolor”) imagery uses an `RGB 888` color configuration. The
    difference between the true color file formats comes in one primary differentiating
    factor: lossy compression.


    Lossy compression means that an algorithm, which is also called a “codec” (COde-DECode),
    is throwing away some of the data in order to achieve a smaller data footprint.
    The opposite is lossless compression. It is useful to save your original file
    in a lossless data format, prior to applying any lossy compression, primarily
    this would be the JPEG algorithm.


    Lossless compression, used by the `PSD`, `BMP`, `TGA`, and `TIFF` formats, doesn’t
    throw away any original image data; it applies an algorithm that finds patterns
    that result in less data being used. This guarantees high resulting image quality.


    “Digital vehicles” that deliver your digital images primarily use true color,
    24-bit imagery. These include web sites, e-books, mobile applications, iTV programs,
    smart watches, digital signage, and similar digital image display devices and
    digital image social sharing forums.


    In image compositing, however, only one layer (or plate) in the pipeline, which
    we’ll get into in detail in [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html), uses
    24-bit data. I like to call it a backplate, or background plate (layer), because
    it’s at the bottom (back) of the layer stack, and therefore doesn’t need (or use)
    transparency.


    All of the other layers in your compositing stack above the background plate need
    to support transparency and therefore require 32 bits of data, which is also known
    as `ARGB` or `RGBA`.


    This transparency is provided by a fourth channel, known as the alpha channel.
    In the following section, I am going to introduce you to this fourth channel,
    and we are also going to cover the alpha channel in more detail in [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html),
    and every chapter after that, as transparency is an important digital image compositing
    concept.


    ### True Color Plus Alpha: Using 32-Bit Digital Images


    Besides 8-bit, 16-bit, and 24-bit digital images, there are 32-bit digital images.
    Formats that support 32-bit color data include `PNG`, `TIFF`, `TGA`, `BMP`, and
    `PSD`. I like to use `PNG32` as it is supported in `HTML5`, `Java`, `JavaFX`,
    `CSS3`, `JavaScript`, and `Android`, whereas the other file formats are not integrated
    with the open source OSs and browsers like the `PNG` format is. These 32 bits
    of image data include 24 bits of `RGB` color data, plus 8 bits of “alpha” or transparency
    value data, held in what is commonly referred to as an alpha channel.


    Since you now know that 8 bits holds 256 values, it will make sense to you that
    an alpha channel will hold 256 different levels of transparency data values for
    each pixel in a digital image.


    This is an important concept for your digital image compositing because it means
    that layers that hold this 32-bit image data allow some portion (from 0 to 256,
    or all) of the pixel’s color to bleed through to (or blend with) layers below
    it, allowing a composite (blended) image to be created.


    Finally, let’s take a look at how the four data channels translate into `Java`,
    `JavaFX` and `JavaScript` code, `HTML5` and `CSS3` mark-up, and `Android Studio`.
    That’s right, we’re talking about hexadecimal notation, for all of you programmers
    and multimedia producers that happen to be reading this foundational material.


    In `Android`, `HTML5`, `JavaScript`, and `CSS3`, hexadecimal for color plus alpha
    takes the `ARGB` format, so the two alpha value positions go first. For example,
    to represent `TRANSPARENT`, which in code has all values off, or zero, this would
    look like this:


    ```

    colorValue = #00000000   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0x00000000  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    The color `WHITE`, with 50 percent translucency, on the other hand, uses all `RGB`
    pixels full on for `WHITE` plus 8 (which is 7 when you count from zero) in each
    of the alpha channel data value slots:


    ```

    colorValue = #77FFFFFF   // Android, HTML5, JS, CSS3 Alpha+Color Value

    colorValue = 0x77FFFFFF  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    The color `RED`, with 25 percent translucency, would use a value of 3 for each
    alpha channel slot and turn on only the Red channel pixels using `FF`, or turn
    the Red fully on and leave Green and Blue fully off as follows:


    ```

    colorValue = #33FF0000   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0x33FF0000  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    For the color `GREEN`, with 37.5 percent translucency, you would use a value of
    5 for each alpha channel and turn on only the Green channel pixels using `FF`,
    or turn the Green fully on and leave Red and Blue fully off:


    ```

    colorValue = #5500FF00   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0x5500FF00  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    And for the color `BLUE`, with 75 percent translucency, you would use a value
    of `B` for each alpha channel slot and turn on only the Blue channel pixels using
    `FF`, or turn the Blue fully on and leave Green and Red fully off:


    ```

    colorValue = #BB0000FF   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0xBB0000FF  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    In the next chapter, we will dive into how to use alpha channel data in Photoshop
    and GIMP—it just gets more exciting!


    ## Summary


    In this fifth chapter, we took a look at the concept of color depth, which defines
    how many bits are used to represent the color in each pixel of your digital image.
    You learned about the different digital image file formats that support these
    different bit levels, like the 8-bit `GIF`, and the 16-bit `TGA`, and the 24-bit
    `JPEG` and the 32-bit `PNG`. We looked at how true color mode is converted into
    indexed color palettes in both Photoshop and GIMP and reviewed concepts such as
    color selection algorithms, dithering algorithms, and progressive interlacing.
    You learned about high color 15- and 16-bit color imagery, revisited true color
    24-bit imagery, and added an 8-bit alpha channel to create a 32-bit digital image
    format that is perfect for image compositing, especially if you are using `HTML5`
    with `CSS3`, `Android Studio`, or `Java` and `JavaFX`. This is because `PNG32`
    allows you to export your compositing layers from Photoshop or GIMP into `NetBeans
    8.1` (the Java and `HTML5` IDE) or `IntelliJ 14` (the Android `IDEA`).


    In the next chapter, you’ll learn more about the digital image alpha channel and
    how it can be used to facilitate image compositing pipelines by allowing more
    than one layer to exist.'
