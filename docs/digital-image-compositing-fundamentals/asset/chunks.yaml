- fmt: '# 12. The Work Process of Digital Imaging: Compositing


    Now that we have had some fun using plug-in filter software, which you could probably
    experiment with for the rest of your life, it’s time to get back into some more
    advanced “under the hood” thinking about how the digital image compositing pipeline
    works, and what it is doing in system memory. This is important if you are also
    going to leverage digital image compositing concepts and techniques in this book
    in your new media programming projects using popular widespread platforms such
    as Java, JavaFX, Android, or HTML5. Since I’m a programmer, I tend to think along
    these lines anyway, and with complex 2D and 3D software packages, knowing what
    is happening at the core processing level can be an advantage and help you to
    understand what the software tool is doing (and what it is going to do).


    Just as a good programmer can write “dense” code, a good image compositor can
    get more mileage using fewer layers in the compositing pipeline (layer stack).
    We will take a look at this during the chapter, as well as further enhance the
    professional compositing project end result that we are trying to achieve. I wanted
    to make sure you have a relatively complex digital image compositing project in
    place, by the end of the book. Even though this is a fundamentals level book,
    I wanted to be sure and give you your money’s worth, in both information, and
    in experience.


    Let’s again start with GIMP for this chapter, just so we can even the score, since
    we’ve been starting with Photoshop CS6 for most of this book. You will continue
    to refine your visuals for this composite by leveraging features of the existing
    layer hierarchy, which we have not yet enabled, to see how much pixel pipeline
    processing can be achieved by using only seven layers. I think you will be amazed
    at what you can achieve, using only seven compositing layers in both Photoshop
    CS6 and GIMP 2.8.14.


    ## GIMP Compositing: Using Layer Features


    To begin digital image compositing in GIMP 2.8.14, open up the `Chapter11pluginFilter.xcf`
    file, as shown in Figure 12-1, and select the `Filter Special Effect` layer, which
    currently contains special effect pixels and a layer mask. Add a blending mode
    to this layer by changing the `Normal` mode (signifying that no blending mode
    is enabled) to a `Value` blending mode (color).


    ![A978-1-4842-4060-1_12_Fig1_HTML.jpg](A978-1-4842-4060-1_12_Fig1_HTML.jpg)


    **Figure 12-1.** To learn about layer feature usage in GIMP, start by selecting
    the `Filter Effect` layer and setting the `Value` mode


    What this does, from the digital image compositing pipeline perspective, is to
    take the color values from the `Niki.png` layer, underneath the `Filter Special
    Effect` layer, and use the layer mask to apply these color values to the areas
    of the special effect layer that were white.


    Since the `Niki Black & White` layer is excluded from the pixel processing pipeline,
    because the eye (visibility) icon is turned off, the compositing engine will consider
    the color `Niki` layer to be underneath the `Filter Special Effect` layer. Thus,
    the visibility icon will not only affect what you see, but also what is processed
    by an imaging software’s internal compositing engine.


    If you want to make the compositing engine reprocess the pipeline without the
    color data, simply block the color data by turning on the visibility of your `Niki
    Black & White` layer.


    You can also lock the mask and pixel data for the `Filter Special Effect` layer
    if you are finished working with it, using the `Lock: Brush` and `Lock: Alpha`
    icons at the top of your `Layers` palette. These are modal icons, and as such
    you must select the layer you want to lock, as shown in Figure 12-1, and then
    click either (or both in this case) of these icons to lock your layer data. As
    you select different layers, they will turn blue if they’re enabled or remain
    white if they’re not.


    Since your composite is getting kind of “busy” using all of these effects, let’s
    set the `RingElement` layer back to using `Normal` (no blending) and color shift
    the metal color to Wine to better complement the golden glass text layer effect.


    To accomplish this, select the `RingElement` layer and set the mode to `Normal`,
    as shown in Figure 12-2, to get back the cyan metal ring. Next, use the `Colors
    ➤ Hue-Saturation` menu sequence to open the `Hue-Saturation` dialog. Shift your
    `Hue` 140 degrees around the color spectrum, creating a nice wine color, to offset
    your gold text.


    ![A978-1-4842-4060-1_12_Fig2_HTML.jpg](A978-1-4842-4060-1_12_Fig2_HTML.jpg)


    **Figure 12-2.** To tone down the colors in your image, set the `RingElement`
    to `Normal` mode and shift the `Hue` 140 degrees


    I attended USC, so this color combination is especially appealing. The next issue
    with this composite that you need to address is the realism of the drop shadow
    that’s underneath the `RingElement`. To add a subtle level of darkening with a
    blending mode, select the `Darken Only` mode, seen in Figure 12-3, and set the
    `Opacity` to 70%. This will lighten the shadow layer and make it look much more
    realistic.


    ![A978-1-4842-4060-1_12_Fig3_HTML.jpg](A978-1-4842-4060-1_12_Fig3_HTML.jpg)


    **Figure 12-3.** To add a subtle level of darkening, set the `RingShadow` to use
    the `Darken Only` mode, and 70% `Opacity`


    The `Opacity` can be set by using a numeric spinner, or by dragging the vertical
    bar to the right of the gray area, inside of the `Opacity` level indicator bar.


    Since we’re leveraging our existing layer pipeline here, let’s turn the `Niki
    Black & White` layer back on and use it for more detail enhancement in the ring
    background special effect.'
  raw: '# 12. The Work Process of Digital Imaging: Compositing


    Now that we have had some fun using plug-in filter software, which you could probably
    experiment with for the rest of your life, it’s time to get back into some more
    advanced “under the hood” thinking about how the digital image compositing pipeline
    works, and what it is doing in system memory. This is important if you are also
    going to leverage digital image compositing concepts and techniques in this book
    in your new media programming projects using popular widespread platforms such
    as Java, JavaFX, Android, or HTML5\. Since I’m a programmer, I tend to think along
    these lines anyway, and with complex 2D and 3D software packages, knowing what
    is happening at the core processing level can be an advantage and help you to
    understand what the software tool is doing (and what it is going to do).


    Just as a good programmer can write “dense” code, a good image compositor can
    get more mileage using fewer layers in the compositing pipeline (layer stack).
    We will take a look at this during the chapter, as well as further enhance the
    professional compositing project end result that we are trying to achieve. I wanted
    to make sure you have a relatively complex digital image compositing project in
    place, by the end of the book. Even though this is a fundamentals level book,
    I wanted to be sure and give you your money’s worth, in both information, and
    in experience.


