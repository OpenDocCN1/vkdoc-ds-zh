- fmt: '# 2. The Size of Digital Imaging: Resolution


    Now you have an understanding of the pixel building blocks that make up raster
    images as well as what the difference is between a raster image that is 2D and
    pixel based, and a vector image that is 2D (or 3D), and vertex and line (or curve)
    based. In this chapter, we build on these concepts by looking at the x and y dimensions
    of digital image compositing. Since you now have GIMP downloaded onto your computer,
    I will illustrate concepts in the book using both Photoshop and GIMP, as those
    are the most widely used digital image packages.


    Whereas a single pixel is just one point in space, which is called 1D or one dimensional
    (do not call your spouse this), an image is a 2D array, or grid, of pixels that
    uses both an x and a y dimension.


    There are many implications of what this means, which is why I dedicate the entire
    chapter to this two-dimensional array of pixels and what its implications include.


    Having a 2D array involves having an image size, also called a data footprint,
    and a resolution, which defines how many pixels will be used to form the digital
    image, and will define how much detail your digital image will contain.


    In the following sections, you’ll be learning about the mathematics used to calculate
    the resolution for your images as well as the details about a wide range of the
    standard consumer electronics device display resolutions currently available in
    the industry, which you will be designing images for during [Chapters 6](#A978-1-4842-4060-1_6_Chapter.html)
    through [13](#A978-1-4842-4060-1_13_Chapter.html).


    ## Resolution: The Number of Pixels in 2D


    The number of pixels contained in your digital image assets is expressed using
    a term called resolution. This term refers to the number of pixels contained in
    the image, incorporating both the width, which is usually denoted by using a `w`,
    or alternatively an `x` for the x-axis, and the height, which is usually denoted
    using an `h`, or a `y` for the y-axis. The resolution gives your digital imagery
    its 2D dimensions.


    The resolution of your image asset is expressed using two numbers (the width,
    or `x`, and the height, or `y`) with an `x` in the middle. For instance, the common
    VGA resolution would be expressed as `640 x 480`. Alternately, you could also
    use the word “by,” such as `640 by 480` pixels. Now let’s get into some basic
    mathematics, so that you can see how to calculate how many pixels are contained
    in your image.


    ### Doing the Math: Calculating Total Image Pixels


    To find the total number of pixels that are contained in any 2D image, you will
    want to multiply the pixel width by the pixel height. Hopefully you remember the
    equation for the area of a rectangle from school; well here it is again, in a
    professional imaging example. Since I didn’t realize that there would be professional
    applications for what was being taught in school, I didn’t listen, and I had to
    go back and relearn math and physics.


    As an example, by multiplying the width and the height of a true HD resolution,
    `1920 x 1080` image, you will get the result of `2,073,600` pixels. If you are
    a digital photographer, you will be familiar with the phrase two megapixels, referring
    to 2 million pixels, which is essentially what true High Definition, or “HD” resolution
    will give you in pixel count.


    The more pixels that are used within a digital image, the higher its resolution
    is said to be. Higher resolution gives a viewer more detail or image subject matter
    definition, which is why an HDTV is called high definition television, and why
    these new 4K resolution UHDTVs are now called ultra high definition television.


    Next, let’s take a look at a few of the most popular consumer electronics device
    resolutions, so that you will know what pixel resolutions you should use for your
    digital image compositing pipelines, so your images will go full screen.


    ### Matching Resolution to Target: Device Resolutions


    One of the objectives in digital image compositing is to match the number of pixels
    in your digital image to the hardware device that it is going to be viewed on.
    There used to be dozens of devices with different resolutions in the marketplace,
    but recently devices have been conforming to HDTV resolutions, since the pixel
    pitch (dot size) has been getting smaller with new display technologies such as
    OLED (organic light-emitting diodes), allowing printer-like resolution on a display
    screen.


    The first HDTV screens were what I like to call “quasi-HD” and were `1280 by 720`
    resolution; `1280 x 720 = 921,600` pixels. This `1280` resolution is still a common
    resolution and I see it used on a lot of entry-level smart phones or entry-level
    tablets, netbooks, and laptops. The reason for this is because a lot of film,
    video, and TV content continues to be produced in Blu-ray `1280 x 720` format,
    and matching content resolution to device resolution yields the best visual result,
    because zero pixel scaling is necessary. We will be covering pixel scaling in
    [Chapter 3](#A978-1-4842-4060-1_3_Chapter.html).


    The next type of HDTV display screen available in the market today is what the
    industry calls True HD; it features a `1920 by 1080` resolution. As you know,
    this gives you 2 million pixels, in contrast to the 1 million pixels that you
    get with `1280` HD resolution. You see True HD resolution on entry-level iTV sets,
    mainstream smart phones, medium-size tablets, e-book readers, and high-end laptops
    (also called notebook computers).


    A recent type of HDTV display screen that is available in the market today is
    what the industry calls Ultra HD, or UHD, and consists of a `4096 x 2160` resolution.
    If you do the math, this display screen resolution contains `8,847,360` pixels,
    or nearly nine megapixels, in contrast to the 2 million pixels that you get with
    `1920` HD resolution. You see Ultra HD resolution on high-level iTV sets, cutting-edge
    smart phones, high-end tablets, and e-book e-readers, as well as the latest UHD
    laptops (also called UHD notebook computers).


    There’s one other category of consumer electronic device with lower resolutions.
    Smart watches have resolutions of `320 by 320`, and Huawei’s smart watch is at
    `400 by 400`. Look for higher pixel density (pixel pitch) in the smart watch space
    by 2016, affording `480-by-480` pixel screens, and, hopefully, `560-by-560` or
    `640-by-640` pixel screens by late 2016 or early 2017.'
