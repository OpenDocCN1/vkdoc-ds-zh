- fmt: '### Photoshop Scripting: JavaScript and ExtendScript


    A script is a series of programming statements that instructs a digital image
    compositing application to perform a series of tasks, or what I refer to as "moves"
    or a work process. Adobe applications like Photoshop support basic scripting languages,
    including JavaScript and Adobe''s own extended JavaScript, which is called ExtendScript.
    JavaScript is a scripting language that was originally developed as ECMAScript
    and was used to make Web pages interactive. In fact, it is still being used for
    this purpose, and it''s powerful enough to write casual games.


    If you use Mac OSX, you''ll also have the choice of using `AppleScript`, and if
    you use Windows, you can also use `VBScript`, known as `VBA`, or `Visual Basic`.
    A version of `Visual Basic`, `VBScript` is the programming language developed
    by Microsoft and does not include all of the program''s advanced features. `VBScript`
    can talk to host applications using ActiveX Scripting. You can find a number of
    professional `VBScript` editors on the Internet. If you use Microsoft Office,
    you can find the built-in `Visual Basic` editors by following the `Tools ➤ Macro
    ➤ Visual Basic Editor` menu sequence. I recommend using JavaScript, since it''s
    open source, and is therefore it is not proprietary, like `AppleScript` and `VBScript`
    are.


    You should get into the habit of appending your JavaScript scripts using a `.jsx`
    extension, rather than the standard `.js` extension, in case you upgrade to using
    the Adobe ExtendScript (JSX) Photoshop scripting language.


    JavaScript also has another important advantage over `VBScript` and `AppleScript`,
    if you like to share your scripting work, in that JavaScript can be used in either
    Microsoft Windows OS or in Apple Macintosh OSX.


    In Photoshop, you can access only `.jsx` files from within the application. Another
    advantage to using JavaScript is that you must run `AppleScript` or `Visual Basic`
    script from outside of the application. There''s a lot to be said for learning
    to code with open-platform languages, as they are the ones exploding in use.


    To write script in JavaScript, you can use a text editor or you can use the ESTK
    ExtendScript tool kit provided with the Adobe application. ESTK has many features,
    which makes it easier to use than text editors. These include a built-in syntax
    checker that identifies where the problems are in your script and the ability
    to run the scripts right from the ESTK without saving them out to a file. This
    feature can save you an incredible amount of development time since you have to
    test your scripts a significant number of times to get them to work.


    To run a JavaScript, whether it was written by you or someone else, you use the
    `File ➤ Scripts ➤ Browse` menu sequence, as seen in Figure 14-1.


    ![A978-1-4842-4060-1_14_Fig1_HTML.jpg](A978-1-4842-4060-1_14_Fig1_HTML.jpg)


    Figure 14-1. To load JavaScript, go to `File ➤ Scripts ➤ Browse`


    As you have probably surmised, scripting in GIMP is very different than it is
    in Photoshop and uses different languages.


    ### GIMP Scripting: Scheme, Script-Fu, and Python


    GIMP has two different levels of scripting complexity. There is a LISP programming
    language variant, called `Scheme`, built into GIMP that runs a Script-Fu (hey,
    your guess is as good as mine!) scripting language. There is also `PyGIMP`, a
    custom version of Python supporting GIMP features, which can access low-level
    API (application programming interface) calls. `PyGIMP` is more powerful than
    `Scheme`. So if you''re writing complex plug-ins, use `PyGIMP`; if you''re automating
    a work process, use Script-Fu.


    You''ll find a plethora of free Script-Fu scripts available online that you can
    download and install inside of your copy of GIMP by using a fairly simple work
    process. Once you download your scripts, you should copy or move them to your
    GIMP scripts directory. If you don''t know the path to the scripts directory for
    your OS, you can find it using the GIMP `File ➤ Preferences` menu sequence to
    open a Preferences dialog, as seen in Figure 14-2.


    ![A978-1-4842-4060-1_14_Fig2_HTML.jpg](A978-1-4842-4060-1_14_Fig2_HTML.jpg)


    Figure 14-2. To find the path to the scripts directory for your OS, start with
    the `File ➤ Preferences` menu sequence


    Once you have the Preferences dialog open, look in the `Folders ➤ Scripts` area
    for the scripts path, as shown in Figure 14-3. Mine was in: `C:/Users/PC-Name-Here/.gimp-2.8/scripts`.


    ![A978-1-4842-4060-1_14_Fig3_HTML.jpg](A978-1-4842-4060-1_14_Fig3_HTML.jpg)


    Figure 14-3. After you open the Preferences dialog, look in the `Folders ➤ Scripts`
    area for the path to your scripts directory


    To install these scripts that you have copied into your scripts folder, you could
    both exit and restart GIMP, or you could simply refresh GIMP''s menu structure.


    This can be done using the `Filters ➤ Script-Fu ➤ Refresh Scripts` menu sequence,
    as is shown in Figure 14-4. After you do this, your new scripts will appear in
    one of your menus. If you don''t find them, look for them under the `Filters`
    menu. If they don''t appear anywhere, something went wrong with the Script-Fu
    and it produced syntax (programming or scripting) errors.


    ![A978-1-4842-4060-1_14_Fig4_HTML.jpg](A978-1-4842-4060-1_14_Fig4_HTML.jpg)


    Figure 14-4. You can access GIMP scripts by following the `Filters ➤ Script-Fu`
    menu sequence


    As you can see, if you need to automate the work process in GIMP or Photoshop,
    the programming tools are there to do so. In the next section, let''s take a look
    at digital image compositing in some of the most popular platforms: Java and JavaFX,
    HTML5 and CSS3, and Android Studio for Android OS.'
