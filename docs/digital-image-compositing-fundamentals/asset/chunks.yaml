    # 2. 数字图像的大小：分辨率


    现在你已经了解了构成光栅图像的像素基础模块，以及基于像素的二维光栅图像与基于顶点和线（或曲线）的二维（或三维）矢量图像之间的区别。在本章中，我们将通过考察数字图像合成的
    x 与 y 维度来深化这些概念。既然你已经在电脑上安装了 GIMP，我将在书中同时使用 Photoshop 和 GIMP 来阐述概念，因为它们是最广泛使用的数字图像处理软件包。


    单个像素只是空间中的一个点，被称为一维（请不要这样称呼你的配偶），而图像则是一个使用 x 和 y 两个维度的二维像素阵列或网格。


    这其中的含义非常丰富，因此我将用整整一章来探讨这个二维像素阵列及其影响。


    一个二维阵列涉及图像尺寸（也称为数据足迹）和分辨率。分辨率定义了构成数字图像所需的像素数量，并决定了数字图像所能包含的细节量。


    在接下来的小节中，你将学习用于计算图像分辨率的数学方法，以及当前行业中各种标准消费电子设备显示分辨率的详细信息。从第 6 章到第 13 章，你将需要为这些设备设计图像。


    ## 分辨率：二维空间中的像素数量


    数字图像资产中包含的像素数量用一个称为分辨率的术语来表示。该术语指的是图像中包含的像素数量，同时考虑宽度（通常用`w`表示，或者用`x`表示 x 轴）和高度（通常用`h`表示，或者用`y`表示
    y 轴）。分辨率赋予了数字图像其二维尺寸。


    图像资产的分辨率用两个数字（宽度，即`x`，和高度，即`y`）表示，中间用`x`连接。例如，常见的 VGA 分辨率表示为`640 x 480`。另一种表述方式是使用“by”这个词，例如`640
    by 480`像素。现在让我们学习一些基础数学，以便了解如何计算图像中包含的像素总数。


    ### 计算数学：计算图像总像素数


    要计算任何二维图像中包含的总像素数，你需要将像素宽度乘以像素高度。希望你还能记得在学校学过的矩形面积公式；现在，我们将以专业成像的示例再次应用它。由于我当年没意识到学校所教的内容还会有专业用途，所以没认真听，后来不得不重新学习数学和物理。


    举个例子，将真正的 HD 分辨率图像`1920 x 1080`的宽度和高度相乘，你会得到`2,073,600`像素。如果你是一位数码摄影师，你会熟悉“两百万像素”这个说法，它指的是
    200 万像素，而这正是真正高清晰度（HD）分辨率所能提供的像素数量。


    数字图像中使用的像素越多，其分辨率就越高。更高的分辨率为观看者提供更多细节或更清晰的图像主体定义，这也是为什么高清电视（HDTV）被称为高清晰度电视，而新兴的
    4K 分辨率 UHDTV 被称为超高清电视的原因。


    接下来，让我们看看几种最流行的消费电子设备分辨率，这样你就会知道在数字图像合成流程中应该使用哪些像素分辨率，以便你的图像能够全屏显示。


    ### 匹配目标分辨率：设备分辨率


    数字图像合成的目标之一，是使数字图像中的像素数量与将要显示它的硬件设备相匹配。过去市场上曾有数十种不同分辨率的设备，但近年来设备已趋向于符合 HDTV 分辨率标准，因为随着
    OLED（有机发光二极管）等新显示技术的出现，像素间距（点距）越来越小，使得显示屏幕可以达到类似打印机的分辨率。


    第一批 HDTV 屏幕的分辨率我称之为“准高清”，即`1280 by 720`；`1280 x 720 = 921,600`像素。这种`1280`分辨率至今仍很常见，我在许多入门级智能手机、入门级平板电脑、上网本和笔记本电脑上都能看到它的身影。原因在于，许多电影、视频和电视内容仍然采用蓝光`1280
    x 720`格式制作，将内容分辨率与设备分辨率匹配可以获得最佳的视觉效果，因为无需任何像素缩放。我们将在第 3 章中讨论像素缩放。


    当今市场上另一种常见的 HDTV 显示屏分辨率是业内所谓的“全高清”；它具有`1920 by 1080`的分辨率。如你所知，这提供了 200 万像素，而`1280`高清分辨率只提供
    100 万像素。你可以在入门级 iTV 电视、主流智能手机、中型平板电脑、电子书阅读器和高端笔记本电脑（也称为笔记本计算机）上看到全高清分辨率。


    近年来市场出现了一种新型 HDTV 显示屏分辨率，业内称为“超高清”（UHD），它由`4096 x 2160`分辨率组成。计算一下，这种显示屏的分辨率包含`8,847,360`像素，即接近
    900 万像素，而`1920`高清分辨率只提供 200 万像素。你可以在高端 iTV 电视、前沿智能手机、高端平板电脑、电子书阅读器以及最新的 UHD 笔记本电脑（也称为
    UHD 笔记本计算机）上看到超高清分辨率。


    还有另一类消费电子设备，其分辨率较低。智能手表的分辨率为`320 by 320`，而华为的智能手表为`400 by 400`。预计到 2016 年，智能手表领域将出现更高的像素密度（像素间距），带来`480-by-480`像素的屏幕，并有望在
    2016 年底或 2017 年初出现`560-by-560`或`640-by-640`像素的屏幕。'
- fmt: '### Using Imaging Software: Determining Resolution


    To find your digital image resolution in Photoshop, you use the `Image ➤ Image
    Size` menu sequence, which is shown in Figure [2-1](#A978-1-4842-4060-1_2_Chapter.html#Fig1).


    ![A978-1-4842-4060-1_2_Fig1_HTML.jpg](A978-1-4842-4060-1_2_Fig1_HTML.jpg)


    Figure 2-1. In Photoshop use an `Image ➤ Image Size` menu sequence


    The GIMP has a different Image Size dialog, which is shown in Figure [2-2](#A978-1-4842-4060-1_2_Chapter.html#Fig2).
    This dialog will tell you the image size (the data footprint), dimension, width,
    height, DPI (pixels per inch) and gives you options for resampling (scaling),
    which we cover in [Chapter 3](#A978-1-4842-4060-1_3_Chapter.html).


    ![A978-1-4842-4060-1_2_Fig2_HTML.jpg](A978-1-4842-4060-1_2_Fig2_HTML.jpg)


    Figure 2-2. The GIMP Image Size dialog shows image size and dimension


    There’s also an option to Reduce Noise which will always be introduced by scaling,
    which supports my contention earlier in the chapter that you want to match the
    content resolution to the screen size of the device dimensions, or the physical
    hardware screen pixel resolution.


    Doing this will ensure the highest quality visual result for your digital image
    compositing projects and digital images.


    Now, let’s take a look at the image resolution features in the open source GIMP
    2.8.14 software package, as shown in Figure [2-3](#A978-1-4842-4060-1_2_Chapter.html#Fig3).
    As you can see, the statistics for the image are right there in the title bar
    at the top of the GIMP digital image compositing software package, without having
    to open up a dialog at all.


    ![A978-1-4842-4060-1_2_Fig3_HTML.jpg](A978-1-4842-4060-1_2_Fig3_HTML.jpg)


    Figure 2-3. GIMP shows your image statistics in its title bar


    These statistics include the color depth, which we’ll be covering in [Chapter
    5](#A978-1-4842-4060-1_5_Chapter.html); the number of layers in this composite,
    which we cover in [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html); and the resolution
    of your image, using the `WxH` format, which in this case is 240x180 pixels.


    If you are wondering why these screenshots contain 14 layers, the file that I
    opened is in the animated-GIF, or aGIF, format, and thus each of my animation
    cels are on a different layer. In this case the digital image, or 3D animation,
    file data format contains my 3D animated Mind Taffy Design logo.


    GIMP does have a dialog that can be used to see what the resolution for your imagery
    is, as well as to scale it to a new resolution, called the `Scale Image` dialog.


    This can be found under the `Image` menu, on the top left side of the screen,
    as shown in Figure [2-3](#A978-1-4842-4060-1_2_Chapter.html#Fig3). If you want
    to take a look at it, follow the `Image ➤ Scale Image` menu sequence.


    GIMP also calls its `Image Size` dialog the `Scale Image` dialog, as you can see
    in Figure [2-4](#A978-1-4842-4060-1_2_Chapter.html#Fig4). It allows you to select
    Quality via several different Interpolation (scaling) algorithms.


    ![A978-1-4842-4060-1_2_Fig4_HTML.jpg](A978-1-4842-4060-1_2_Fig4_HTML.jpg)


    Figure 2-4. GIMP’s `Scale Image` dialog


    We’re going to cover scaling in [Chapter 3](#A978-1-4842-4060-1_3_Chapter.html),
    when we cover aspect ratio. Scaling is a very important consideration, which is
    why we match pixel resolution for an image to target device screen resolution,
    so the device or platform does not scale it for us, as doing so decreases quality.


    You want to always have control over the scaling, also called re-sampling, of
    your digital image assets, so that you can assure the highest level of quality
    for your viewers.


    As you might imagine, there’s a relationship between the resolution of your image
    and its storage size (data footprint). Since your image pixels need to be stored,
    the more there are of them, the more data will be required to hold them in system
    memory. This seems kind of obvious, but I thought I’d state it.


    ### Summary


    In this second chapter, we took a look at the x,y pixel array display structure
    that holds your image pixels, and you learned about the concept of digital image
    resolution. We looked at the mathematics behind calculating the number of pixels
    that are contained in the digital image and looked at how you ascertain the image
    resolution in the two most widely used digital image compositing software packages,
    Photoshop CS6 and GIMP 2.8.14. We learned that both of these software packages
    also allow you to change the resolution of your image using a process called resampling,
    or scaling, which uses interpolation algorithms. We are going to be taking a closer
    look at this process in the next chapter.


    We will also take a look at image shape defined by the resolution parameters for
    an x,y pixel array, or the concept of image aspect ratio. Last, we will also cover
    how image scaling can be done correctly, without distortion, and how your image
    can be cropped instead of scaled to control aspect ratio.


    ## The Shape of Digital Imaging: Aspect Ratio


    Now that you have an understanding of the image resolution and how to calculate
    the number of pixels that make up your raster image, it is time to consider the
    shape (rectangular or square) of your digital imagery. Your digital imagery’s
    shape, known in the industry as its “aspect ratio,” is more important than you
    might think, especially when you’re changing it using image scaling (known as
    resampling) or image cropping.


    The aspect ratio should not be manipulated or changed in any way, in order to
    prevent image distortion. Developing full knowledge about the aspect ratio will
    allow you to make sure that you do not distort your digital imagery, and that
    is why this chapter is extremely important to your digital image compositing knowledge
    base.


    After we look at the mathematics involved in calculating your aspect ratio, we
    will take a look at how to “lock” the ratio. Locking the aspect ratio allows you
    to eliminate distortion from the image-scaling process, whether that be up-sampling,
    or scaling the image resolution up, or down-sampling, or scaling the image resolution
    down. You can also avoid distortion by using cropping, which is removing pixels
    from the top, bottom and sides of your digital image.


    ### Aspect Ratio: The Ratio of Pixels in 2D


    Whereas the number of pixels contained in your digital image is called resolution,
    the ratio of x to y in your digital image is called the aspect ratio. Aspect ratio
    is a more complicated aspect, no pun intended, of image resolution, because it
    is the ratio of width to height, or w:h, within your image resolution specification,
    or x:y when speaking of an image’s x and y axis.


    The aspect ratio defines the shape of your digital image and also applies to the
    shape of the device display screen. For instance, smart watches have a square
    screen and widescreen iTV sets have a rectangular screen. We will be looking at
    how you can change the aspect ratio according to these different screen shapes
    over the course of the chapter.


    A 1:1 aspect ratio digital image (or display screen) can be said to be perfectly
    square. By its very definition, a 1:1 aspect ratio is the same as a 2:2 or 3:3
    aspect ratio. It is important to note that it is the ratio between these two numbers,
    not the numbers themselves, that defines the shape of the image or screen, and
    that’s why it is called an aspect ratio, although it’s often called an aspect
    for short.


    A 2:1 aspect ratio would use a widescreen aspect ratio, and a 3:1 aspect ratio
    could be referred to as a panoramic aspect ratio.'
