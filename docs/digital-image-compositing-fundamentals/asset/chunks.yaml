  trans: '

    ### 真彩色：使用 24 位彩色图像背景板


    正如我之前指出的，数字图像中最广泛使用的文件格式之一是 JPEG 格式，它只有一种类型：24 位。其他支持 24 位颜色数据的文件格式包括`BMP`、`TIFF`、`TGA`、`PSD`和`PNG24`。由于`PNG`也支持
    8 位（`PNG8`）或 32 位（`PNG32`）颜色，为了精确起见，我将 24 位的 PNG 格式称为`PNG24`。


    正如你在第 4 章中学到的，真彩色图像使用`RGB 888`颜色配置。这些真彩色文件格式之间的主要区别在于一个关键因素：有损压缩。


    有损压缩意味着算法（也称为“编解码器”）会丢弃部分数据以获得更小的数据体积。与之相反的是无损压缩。在应用任何有损压缩（主要是 JPEG 算法）之前，最好将原始文件保存为无损数据格式。


    `PSD`、`BMP`、`TGA`和`TIFF`格式使用的无损压缩不会丢弃任何原始图像数据；它会应用一种算法来查找模式，从而使用更少的数据。这保证了最终的高图像质量。


    传递数字图像的“数字载体”主要使用真彩色、24 位图像。这些载体包括网站、电子书、移动应用程序、iTV 节目、智能手表、数字标牌以及类似的数字图像显示设备和数字图像社交分享论坛。


    然而，在图像合成中，流程中只有一个图层（或板块）使用 24 位数据，我们将在第 8 章中详细介绍。我喜欢称其为背景板或背景图层，因为它位于图层堆栈的底部（背面），因此不需要（或使用）透明度。


    合成堆栈中背景板上方的所有其他图层都需要支持透明度，因此需要 32 位数据，这通常被称为`ARGB`或`RGBA`。


    这种透明度由第四个通道提供，称为 Alpha 通道。在下一节中，我将向你介绍这第四个通道，我们还会在第 6 章及之后的每一章中更详细地介绍 Alpha 通道，因为透明度是数字图像合成中的一个重要概念。


    ### 真彩色加 Alpha：使用 32 位数字图像


    除了 8 位、16 位和 24 位数字图像，还有 32 位数字图像。支持 32 位颜色数据的格式包括`PNG`、`TIFF`、`TGA`、`BMP`和`PSD`。我喜欢使用`PNG32`，因为它受到`HTML5`、`Java`、`JavaFX`、`CSS3`、`JavaScript`和`Android`的支持，而其他文件格式不像`PNG`格式那样与开源操作系统和浏览器深度集成。这
    32 位图像数据包括 24 位的`RGB`颜色数据，加上 8 位的“Alpha”或透明度值数据，这些数据保存在通常被称为 Alpha 通道的通道中。


    既然你现在知道 8 位可以保存 256 个值，那么你应该能理解 Alpha 通道可以为数字图像中的每个像素保存 256 个不同级别的透明度数据值。


    这对你的数字图像合成来说是一个重要概念，因为它意味着包含这 32 位图像数据的图层允许像素颜色的部分（从 0 到 256，或全部）渗透到（或与）其下方的图层混合，从而可以创建合成（混合）图像。


    最后，让我们看看这四个数据通道如何转换为`Java`、`JavaFX`和`JavaScript`代码、`HTML5`和`CSS3`标记以及`Android
    Studio`。没错，我们要讨论的是十六进制表示法，适用于所有恰好正在阅读这些基础材料的程序员和多媒体制作人员。


    在`Android`、`HTML5`、`JavaScript`和`CSS3`中，颜色加 Alpha 的十六进制采用`ARGB`格式，因此两个 Alpha 值位置放在前面。例如，表示`TRANSPARENT`（透明），在代码中所有值都是关闭的或为零，则如下所示：


    ```

    colorValue = #00000000   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0x00000000  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    而对于颜色`WHITE`（白色），具有 50%的半透明度，则将所有`RGB`像素设置为全亮以显示`WHITE`，并在 Alpha 通道数据值槽中每个使用 8（如果从零开始计数则为
    7）：


    ```

    colorValue = #77FFFFFF   // Android, HTML5, JS, CSS3 Alpha+Color Value

    colorValue = 0x77FFFFFF  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    对于颜色`RED`（红色），具有 25%的半透明度，应在每个 Alpha 通道槽中使用值 3，并使用`FF`仅开启红色通道像素，即完全开启红色，完全关闭绿色和蓝色，如下所示：


    ```

    colorValue = #33FF0000   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0x33FF0000  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    对于颜色`GREEN`（绿色），具有 37.5%的半透明度，应在每个 Alpha 通道中使用值 5，并使用`FF`仅开启绿色通道像素，即完全开启绿色，完全关闭红色和蓝色：


    ```

    colorValue = #5500FF00   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0x5500FF00  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    对于颜色`BLUE`（蓝色），具有 75%的半透明度，应在每个 Alpha 通道槽中使用值`B`，并使用`FF`仅开启蓝色通道像素，即完全开启蓝色，完全关闭绿色和红色：


    ```

    colorValue = #BB0000FF   // Android, HTML5, JS, CSS3 Alpha+Color (ARGB)

    colorValue = 0xBB0000FF  // Java and JavaFX Alpha+Color Value Hexadecimal

    ```


    在下一章中，我们将深入探讨如何在 Photoshop 和 GIMP 中使用 Alpha 通道数据——接下来会更加精彩！


    ## 本章小结


    在第五章中，我们探讨了颜色深度的概念，它定义了用于表示数字图像中每个像素颜色的位数。你了解了支持不同位深度的各种数字图像文件格式，例如 8 位的`GIF`、16
    位的`TGA`、24 位的`JPEG`和 32 位的`PNG`。我们研究了如何在 Photoshop 和 GIMP 中将真彩色模式转换为索引调色板，并回顾了诸如颜色选择算法、抖动算法和渐进式交错等概念。你学习了高彩色
    15 位和 16 位图像，重新审视了真彩色 24 位图像，并添加了 8 位 Alpha 通道以创建 32 位数字图像格式，这种格式非常适合图像合成，特别是当你将`HTML5`与`CSS3`、`Android
    Studio`或`Java`与`JavaFX`结合使用时。这是因为`PNG32`允许你将合成图层从 Photoshop 或 GIMP 导出到`NetBeans
    8.1`（Java 和`HTML5` IDE）或`IntelliJ 14`（Android `IDEA`）。


    在下一章中，你将了解更多关于数字图像 Alpha 通道的信息，以及如何利用它通过允许多个图层共存来促进图像合成流程。

    '
- fmt: '# 6. The Transparency of Digital Imaging: Alpha Channel


    Now that you have an understanding of the basic color depths used in most digital
    image editing and compositing pipelines, we are going to be focusing on the 32-bit
    `RGBA` mode from here on out. The `RGBA` mode is tantamount for all of the compositing
    layers in an image composite other than the 24-bit color image back plate. We
    are also not going to focus on High Dynamic Range Imagery (`HDRI`) because it
    is data heavy and not practical for the types of usage that most of the book’s
    readers will target, which include the Internet, e-books, iTV sets, smart phones,
    smart watches, tablets, netbooks, laptops and so forth.


    In this chapter we are going to be focusing on the alpha component of the `ARGB`
    (I’ll use these acronyms interchangeably) image data mode. Notice I’m a stickler
    here and am not calling this a “color mode,” because only the `RGB` components
    are color. This other `A` component is transparency, which is not a color at all
    but a way to combine color across layers, planes, or plates in your digital image
    compositing “pipeline.”


    We will also be taking a look at how to access the alpha channel in Photoshop
    and GIMP as well as some valuable tools in both programs. These tools will allow
    you to work more easily with the transparency data that is held in the alpha channels.


    ## Alpha Channels: Defining Transparency


    Let’s take a look at how alpha channels define digital image pixel transparency
    values, and how these channels can be used for compositing digital imagery. Alpha
    channels can provide transparency inside of your digital image compositing software,
    which I would term a “static” use, and can also be used via `PNG32` image assets
    to composite digital imagery in real time using platforms such as Java, JavaFX,
    JavaScript, HTML5, CSS3, and Android. I would term the latter a “dynamic” use,
    as the code allows you to access your pixel transparency values by the millisecond,
    and animate this data, in any way that you like.


    Digital image compositing involves the seamless blending together of more than
    one layer of digital imagery, and, as you might imagine, having control over the
    pixel transparency is an extremely important concept. Digital image compositing
    is often utilized in industries from graphic design to feature films, in game
    design, and more recently, for applications development.


    Digital image compositing would be used when you want to create an image on your
    display that appears as though it were one single image (or even an animation)
    when it is actually the seamless collection of more than one composited image
    layers.


    One of the principle reasons you would want to set up an image, or animation,
    composition, is to allow yourself to exert more control over the various elements
    in an image composite by having components on different layers. We’ll be covering
    layers in much more detail, in [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html).


    To accomplish multilayer compositing, you always need to have an alpha channel
    transparency value, which you can utilize to precisely control the blending of
    the pixel’s color with the color of those pixels in that same `x,y` image location,
    in other layers in the compositing pipeline (layer stack) below it.


    Like the `RGB` color channels, the alpha channel will have `256` levels of transparency
    ranging from 100 percent transparent (`0`) to 100 percent opaque (`255`). Each
    pixel will have different alpha transparency data, just as each pixel will have
    different `RGB` color data. Therefore the alpha channel is exactly like the color
    channels it accompanies, except that it defines blending, whereas the other three
    channels are defining red, green, and blue color value amounts, or levels of intensity.


    Let’s see how this looks in Photoshop CS6 using a simple example where we put
    a ring element over the model in the image that I have been using thus far for
    the book. As you can see in Figure [6-1](#A978-1-4842-4060-1_6_Chapter.html#Fig1),
    I’ve added the `RingElement.png`, `PNG32` digital image to the top of the layer
    stack in Photoshop CS to show the alpha channel data (transparent versus opaque
    areas) for a decorative ring element, and what this alpha channel capability allows
    you to accomplish within your digital image compositing pipeline.


    ![A978-1-4842-4060-1_6_Fig1_HTML.jpg](A978-1-4842-4060-1_6_Fig1_HTML.jpg)


    Figure 6-1.


    A PNG32 RingElement added to the layer on top of Niki in Photoshop


    You can see that the alpha channel transparency value is shown for each pixel
    using a checkerboard pattern, seen in your layer preview icon in the Layers palette
    on the right-hand side of the screen.


    The checkerboard pattern shows in any area of the layer that has a transparency
    value, so if a pixel (or area of pixel values) is partially opaque (50% translucent,
    for instance) it will show 50% of the checkerboard pattern. This is an example
    of a simple digital image composite, and, as you can see, the visual result is
    seamless.


    You can see the checkerboard transparency representation in Figure [6-2](#A978-1-4842-4060-1_6_Chapter.html#Fig2),
    along with the Channels palette, selected on the right side of the screen.


    ![A978-1-4842-4060-1_6_Fig2_HTML.jpg](A978-1-4842-4060-1_6_Fig2_HTML.jpg)


    Figure 6-2.


    The alpha channel, and the Load Selection dialog'
  raw: '# 6. The Transparency of Digital Imaging: Alpha Channel


    Now that you have an understanding of the basic color depths used in most digital
    image editing and compositing pipelines, we are going to be focusing on the 32-bit
    RGBA mode from here on out. The RGBA mode is tantamount for all of the compositing
    layers in an image composite other than the 24-bit color image back plate. We
    are also not going to focus on High Dynamic Range Imagery (HDRI) because it is
    data heavy and not practical for the types of usage that most of the book’s readers
    will target, which include the Internet, e-books, iTV sets, smart phones, smart
    watches, tablets, netbooks, laptops and so forth.


    In this chapter we are going to be focusing on the alpha component of the ARGB
    (I’ll use these acronyms interchangeably) image data mode. Notice I’m a stickler
    here and am not calling this a “color mode,” because only the RGB components are
    color. This other A component is transparency, which is not a color at all but
    a way to combine color across layers, planes, or plates in your digital image
    compositing “pipeline.”


    We will also be taking a look at how to access the alpha channel in Photoshop
    and GIMP as well as some valuable tools in both programs. These tools will allow
    you to work more easily with the transparency data that is held in the alpha channels.


    ## Alpha Channels: Defining Transparency


    Let’s take a look at how alpha channels define digital image pixel transparency
    values, and how these channels can be used for compositing digital imagery. Alpha
    channels can provide transparency inside of your digital image compositing software,
    which I would term a “static” use, and can also be used via PNG32 image assets
    to composite digital imagery in real time using platforms such as Java, JavaFX,
    JavaScript, HTML5, CSS3, and Android. I would term the latter a “dynamic” use,
    as the code allows you to access your pixel transparency values by the millisecond,
    and animate this data, in any way that you like.


    Digital image compositing involves the seamless blending together of more than
    one layer of digital imagery, and, as you might imagine, having control over the
    pixel transparency is an extremely important concept. Digital image compositing
