  trans: '

    ### 差异：使用图层反转像素颜色


    现在，让我们为现有的图层增加一些复杂度，为 `RingElement` 图层添加一个图层样式，这样我们就可以在 `Niki` 图像图层上为其添加投影，使其看起来像是漂浮在图像上方。


    为此，选中 `RingElement` 图层后，右键单击并选择 `混合选项` 菜单项，以打开 `图层样式` 对话框，如图 9-13 所示。


    ![A978-1-4842-4060-1_9_Fig13_HTML.jpg](img/A978-1-4842-4060-1_9_Fig13_HTML.jpg)


    图 9-13.


    设置投影图层样式


    然后，选择 `正片叠底` 混合模式，将 `不透明度` 设为 75%，`角度` 设为 45 度。勾选 `使用全局光`，接着设置 `距离` 为 9 像素，`扩展`
    为 3 像素，`大小` 为 9 像素。


    勾选 `消除锯齿` 和 `预览` 复选框，如图所示。


    点击 `确定` 按钮后，戒指元素下方就会出现一个逼真的投影，而无需手动创建。


    你在 GIMP 中看到了创建这种投影效果所需的工作流程。在 Photoshop 中，`图层样式` 对话框会自动为你完成这项工作，这是 GIMP 尚不具备的高级功能之一。接下来，在
    `图层` 选项卡下选择 `差值` 模式，如图 9-14 所示。


    ![A978-1-4842-4060-1_9_Fig14_HTML.jpg](img/A978-1-4842-4060-1_9_Fig14_HTML.jpg)


    图 9-14.


    选择 `RingElement` 图层并设置 `差值` 模式


    现在，关闭橙色调整图层的可见性（眼睛）图标，这将恢复 `Niki` 图层的原始颜色数据，以便你更好地观察该模式的效果。根据 `RingElement` 图层下方图层的图像数据，戒指的某些区域会变为红色或蓝色。


    请务必花些时间在 Photoshop 和 GIMP 中尝试所有混合模式，以便了解它们与 Alpha 通道、不透明度、图层和图层样式结合使用时，能为你的数字图像合成流程带来什么效果。在这个领域，丰富的模式使用经验能帮助你判断在特定图像上哪些模式有效、哪些无效。


    ## 本章小结


    在第九章中，我们探讨了如何使用混合模式，通过 Photoshop 和 GIMP 将强大的基于像素的算法应用于数字图像合成。我们查看了 Photoshop 和
    GIMP 中的基本 `模式` 菜单，了解这些软件包支持哪些混合模式算法，并注意到混合模式的高级功能是区分 Photoshop CS6 和 GIMP 2.8.14
    的领域之一，Photoshop 提供了额外的六种混合模式算法。


    你学习了如何在 GIMP 中使用正片叠底模式创建内部投影，以及涉及复制文本、选择 Alpha 数据、遮罩和应用模糊滤镜的工作流程。


    我们研究了 Photoshop 中其他一些流行的混合模式（这些模式未在 GIMP 中探讨），并将它们应用于本章的 Photoshop 文件。我们还为更多图层添加了混合模式和图层样式，以进一步增加项目的复杂度，并演示混合模式如何与
    Alpha 通道和图层样式协同作用。


    在 第 10 章 中，你将进一步了解数字图像合成软件的模态操作，以及这些模态操作如何与数字图像合成图层和图层功能协同工作，二者相辅相成。


    # 10. 数字成像的模态：模态操作


    既然你已经学习了一些数字图像合成的基本组件，例如概念与术语、Alpha 通道、选区（遮罩）、图层、混合模式等，让我们用一章的时间来更深入地研究高级数字成像软件的模态操作本质。这种模态操作也存在于其他高端多媒体制作软件包中，例如
    3D、数字视频编辑与特效以及音频软件中。这种模态功能也是编程语言的一部分，如 C、C#、C++、Python、Java、JavaFX 和 JavaScript。


    由于这些高级软件包的模态性，有多个因素——在这里指操作模式——其设置需要你在操作（使用）软件时始终牢记在心。


    这是因为这些模式的设置——例如，你正在使用的工具；你的工具选项设置；选择了哪个图层；按住哪个键盘修饰键（如 `Shift`、`Control`、`Alt`）；选择了哪种混合模式；哪个图标（如可见性、锁定等）处于开启或关闭状态；等等——将决定你使用软件最终获得的结果。


    ## 模态操作：流程的一部分


    就像有一个合成流程处理你的图像图层、模式和通道设置，该流程从图层堆栈的底部向上逐层处理一样，还有一个更复杂的操作设置流程，数字图像合成软件在你使用它时会实时处理这个流程。要能够生成你要求软件创建的结果，它必须关注你选择的工具、正在处理的图层、已选择的选项，以及你使用鼠标和键盘进行的操作。


    ### 处理流程：工具、选项和设置


    由于这是一本关于数字图像合成基础知识的书，而非其高级功能，因此我不会深入到在软件代码库内部，工具、选项、图层、Alpha 通道、选区、混合模式、按键修饰符和像素位置（实时鼠标位置、移动、拖动等）以何种顺序处理的具体层面。从用户的角度来看，这其实并不重要，因为在使用工具（移动鼠标、点击、拖动或按下键盘按键）之前，你已经设置了所有定义将要发生什么的模式。如果你错误地设置了这些操作模式，就会得到非预期的结果。有时，这些结果甚至可能非常酷，你也许会决定保留它们！


    由于这些专业软件包包含许多不同的工具和选项，其中大部分会相互影响，因此复杂新媒体软件的使用可能会很快变成一个高级项目，因为你必须在脑海中理清所有这些设置及其相互关系。这与计算机编程类似，你需要以类似的方式跟踪变量及其处理方式。你的图像合成（或软件应用）越复杂，在处理过程中，你需要实时记住的组件就越多。

