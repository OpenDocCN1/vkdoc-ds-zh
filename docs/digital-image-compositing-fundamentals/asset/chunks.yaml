    # 数字图像的数据占用：优化


    `Textlayer`（文本图层）也利用一个 alpha 通道，通过强光混合模式、100% 的不透明度（即像素强度）以及内阴影效果层，将文本叠加在底部六个图层之上，从而创建出镂空文本的特殊效果。


    既然你已经构建了一个非常强大的数字图像合成管线，现在是时候转换思路，看看文件保存、数据占用优化以及如何将开源编程语言应用于数字图像合成工作流程了。


    请务必动手尝试本书前十二章所学到的所有内容，以便你能持续掌握这些概念和特性！


    ## 本章小结


    在本章中，你进一步深入了解了 Photoshop 和 GIMP 中的数字图像合成管线处理。你对数字图像合成项目进行了微调，为你在第 11 章中应用的特效滤镜添加了微妙的色彩效果和细节，并使你的
    `RingElement` 与图像合成的其余部分拥有更好的色彩搭配。


    在 GIMP 中，你对青色金属环进行了颜色偏移，并添加了一些图层，这些图层将为你提供一些新的模式特殊效果，并且你可以将这些效果与你的特效滤镜结果进行混合。


    为了在 Photoshop CS6 中获得类似的数字图像合成处理管线结果，你再次需要调整图层、图层蒙版和调整图层；添加一个调整图层；并更新一些图层样式效果（fx）设置。


    在下一章中，你将学习如何保存文件，以及数据占用优化的概念和技术。


    # 13. 数字图像的数据占用：优化


    既然我们已经学习了如何使用数字图像合成软件包中的强大功能来创建专业的数字图像（你甚至可以以此为基础开创一份收入丰厚的职业），现在是时候来看看如何将这些数字图像合成作品输出或“导出”为高度优化的文件了。在本章中，你将学习数据占用优化的相关考量，以便你能够根据当前需求，以正确的格式导出（保存）数字图像文件。本章的目标是使用尽可能少的字节数来创建包含你数字图像合成管线成果的文件；也就是说，为你当时所处的任何数字应用场景，提供你最终的视觉图像多媒体资产。


    如果你计划使用本书中的合成概念和技术创建的图像，并将其应用于你的新媒体编程项目（例如使用 Java、JavaFX、Android 和 HTML5 这些流行且广泛的平台），这一点至关重要。


    由于我是一名程序员，我将在本书的接下来两章中，专门讲解如何优化（第 13 章）和集成（第 14 章）数字图像资产，并与数字交付成果（我习惯这么称呼），例如网站和应用程序，进行衔接。


    ## Photoshop 优化：存储为 Web 所用格式


    要开始优化，请打开 `Chapter12compositing.psd` 文件，如图 13-1 所示，然后依次选择 文件 ➤ 存储为 Web 所用格式 菜单。


    ![A978-1-4842-4060-1_13_Fig1_HTML.jpg](img/A978-1-4842-4060-1_13_Fig1_HTML.jpg)


    **图 13-1.** 要在 Photoshop 中启动优化过程，请依次选择 文件 ➤ 存储为 Web 所用格式 菜单


    这将打开“存储为 Web 所用格式”对话框，如图 13-2 所示，就这个实用工具而言，它更像一个命令控制台。它包含一个预览区域，可显示左侧当前设置的效果，以及用于平移、缩放和颜色取样的工具图标；控制台左下角有数据占用信息打印输出；右上角是设置选项；右下角是缩放（重采样）工具。


    ![A978-1-4842-4060-1_13_Fig2_HTML.jpg](img/A978-1-4842-4060-1_13_Fig2_HTML.jpg)


    **图 13-2.** 要获得最高质量的结果，请使用文件格式下拉选择器选择 PNG-24


    Photoshop 在提供图像数据优化控制面板方面做得非常出色，特别是与 GIMP 中的数据占用优化工作流程相比。它允许你选择设置、查看结果、微调这些结果，甚至完成通常需要退出对话框才能完成的操作，例如图像的重新采样（缩放）。


    获得最高质量结果（同时也是最大数据占用）的方式是使用 PNG-24 格式，该格式也可写作 `PNG24`，如图 13-2 所示。


    此格式也支持 alpha 通道；因此对话框右上角会出现“透明度”选项。如果勾选此选项，文件将变成 PNG-32（也可写作 `PNG32`），因为你增加了一个
    8 位的透明度数据平面。


    如果你正在导出一个对象及其蒙版（例如本书中使用的 `RingElement.png`），你应该使用“透明度”选项。“交错”选项可能会增加数据占用的开销，因为它会为文件大小增加额外的字节。该选项允许图像在慢速连接下“流式传输”，这样随着图像数据通过网络到达，图像就能逐步显示在屏幕上。显然，此选项与网页设计、开发和用户体验密切相关。


    当你下拉文件格式选项列表时，你会看到还有一个 PNG-8 选项，用于使用索引颜色格式，我们在第 5 章中介绍过。我们接下来就看看这个。

    '
- fmt: '### Indexed Color Format: Using Less Color to Reduce File Size


    With the `PNG-8` indexed color algorithm option, seen selected in the drop-down
    in the top-right corner of Figure [13-3](#A978-1-4842-4060-1_13_Chapter.html#Fig3),
    you can set a color selection algorithm, a number of colors, the dithering type
    and amount, and an Interlaced option.


    ![A978-1-4842-4060-1_13_Fig3_HTML.jpg](A978-1-4842-4060-1_13_Fig3_HTML.jpg)


    Figure 13-3. Selecting `PNG-8` from the file format drop-down selector will allow
    you to choose from a number of additional indexed color optimization options


    If you select Transparency, you will need a Matte color, since only a 1-bit (black
    and white only, no gray values) alpha channel is supported, which has no anti-aliasing
    (gray) values. Choosing `PNG-32` will give you a far-better compositing (edge
    quality) result than choosing `PNG-8`, since it uses 8-bit, or 256 grayscale,
    levels for its alpha channel data representations. So always use `PNG-32` if you
    can, as it will represent any alpha-based objects with perfect quality.


    The `PNG-8` option gives you a 332 percent-greater data footprint reduction than
    `PNG-24`—from 906K to 273K. As you set, or tweak, these different options, this
    dialog (optimization engine) will calculate a new data footprint, shown at the
    lower-left portion of your display, along with how long it should take to transfer
    over the Internet, for users using old fashioned 56KB modem connections.


    As you can see in the cheek areas of Niki’s face, a quality trade-off does exist
    when using indexed color formats. If the pixels are small enough, and you use
    diffusion dithering, this will not be noticeable. Small pixels are found in printers,
    high resolution images, and modern “super fine dot pitch” consumer electronics
    devices.


    The `PNG-8` compression algorithm, or codec, is more recent than the Compuserve
    `GIF` indexed color codec, and thus gives you a better data footprint result.
    I took a screenshot (Figure [13-4](#A978-1-4842-4060-1_13_Chapter.html#Fig4))
    using the same settings to show you the `GIF` compression result of 307KB. This
    has a 12 percent-larger data footprint, so for this image, `PNG-8` is 12 percent
    more efficient than `GIF`, just from an algorithmic standpoint. The `GIF` settings
    and the data footprint result can be seen in Figure [13-4](#A978-1-4842-4060-1_13_Chapter.html#Fig4).
    The only reason I use `GIF` is for its animation capability. This is referred
    to as the aGIF, AnimGIF, or Animated GIF indexed color file format.


    ![A978-1-4842-4060-1_13_Fig4_HTML.jpg](A978-1-4842-4060-1_13_Fig4_HTML.jpg)


    Figure 13-4. To compare the compression capabilities of `GIF`, select `GIF` from
    the file format drop-down selector in the upper right corner


    So if you’re using animation, use `GIF`; if you are using static (still) indexed
    color digital imagery, use `PNG-8`. Next, let’s take a look at the lossy `JPEG`
    codec, so we can see how it changes the original image data, to reduce the data
    footprint.


    ### Lossy Compression: Using JPEG to Reduce File Size


    With the `JPEG` true-color algorithm option chosen from the drop-down menu in
    Figure [13-5](#A978-1-4842-4060-1_13_Chapter.html#Fig5), you can set a quality
    level and numeric value (amount), which will tell the `JPEG` algorithm how much
    of the original image pixel quality can be changed. Below that, there is a Progressive
    option that you can check off; it is similar to the indexed color Interlaced option,
    but using it results in a smaller file size, rather than a larger file size!


    ![A978-1-4842-4060-1_13_Fig5_HTML.jpg](A978-1-4842-4060-1_13_Fig5_HTML.jpg)


    Figure 13-5. To set a quality level and numeric value (amount), select `JPEG`,
    using the file format drop-down selector


    You can also apply a Blur factor to the image, using the Blur checkbox in the
    upper right hand corner. Blur will reduce data footprint when used with a `JPEG`
    algorithm, because edges, especially sharp (high adjacent pixel contrast) edges,
    are hard (difficult) for the `JPEG` algorithm to optimize efficiently. Use a small
    value for the Blur drop-down, if you use any at all.


    The proper way to use a `JPEG` algorithm is to tweak the Quality percentage while
    at the same time observing visual preview quality and the resulting data footprint
    at the bottom left side of this dialog. You will have to decide what your trade-off
    between data footprint reduction and image quality will be relative to your intended
    usage of an image. In this case, I utilized a high 75% Quality setting with Progressive
    downloading, and I got a 233KB data footprint, which is 389 percent smaller than
    the `PNG-24` data footprint. `JPEG` Quality values between 60% and 100% will generally
    give you an excellent visual result; values under 20% generally will not.'
  raw: '### Indexed Color Format: Using Less Color to Reduce File Size


    With the PNG-8 indexed color algorithm option, seen selected in the drop-down
    in the top-right corner of Figure [13-3](#A978-1-4842-4060-1_13_Chapter.html#Fig3),
    you can set a color selection algorithm, a number of colors, the dithering type
    and amount, and an Interlaced option.


    ![A978-1-4842-4060-1_13_Fig3_HTML.jpg](A978-1-4842-4060-1_13_Fig3_HTML.jpg)


    Figure 13-3.


    Selecting PNG-8 from the file format drop-down selector will allow you to choose
    from a number of additional indexed color optimization options


    If you select Transparency, you will need a Matte color, since only a 1-bit (black
    and white only, no gray values) alpha channel is supported, which has no anti-aliasing
    (gray) values.


    Choosing PNG-32 will give you a far-better compositing (edge quality) result than
    choosing PNG-8, since it uses 8-bit, or 256 grayscale, levels for its alpha channel
    data representations. So always use PNG-32 if you can, as it will represent any
    alpha-based objects with perfect quality.


    The PNG-8 option gives you a 332 percent-greater data footprint reduction than
    PNG-24—from 906K to 273K. As you set, or tweak, these different options, this
    dialog (optimization engine) will calculate a new data footprint, shown at the
    lower-left portion of your display, along with how long it should take to transfer
    over the Internet, for users using old fashioned 56KB modem connections.


    As you can see in the cheek areas of Niki’s face, a quality trade-off does exist
    when using indexed color formats.


    If the pixels are small enough, and you use diffusion dithering, this will not
    be noticeable. Small pixels are found in printers, high resolution images, and
    modern “super fine dot pitch” consumer electronics devices.


    The PNG-8 compression algorithm, or codec, is more recent than the Compuserve
    GIF indexed color codec, and thus gives you a better data footprint result. I
    took a screenshot (Figure [13-4](#A978-1-4842-4060-1_13_Chapter.html#Fig4)) using
    the same settings to show you the GIF compression result of 307KB. This has a
    12 percent-larger data footprint, so for this image, PNG-8 is 12 percent more
    efficient than GIF, just from an algorithmic standpoint. The `GIF` settings and
    the data footprint result can be seen in Figure [13-4](#A978-1-4842-4060-1_13_Chapter.html#Fig4).
    The only reason I use GIF is for its animation capability. This is referred to
    as the aGIF, AnimGIF, or Animated GIF indexed color file format.


    ![A978-1-4842-4060-1_13_Fig4_HTML.jpg](A978-1-4842-4060-1_13_Fig4_HTML.jpg)


    Figure 13-4.


    To compare the compression capabilities of GIF, select GIF from the file format
    drop-down selector in the upper right corner


    So if you’re using animation, use GIF, if you are using static (still) indexed
    color digital imagery, use PNG-8\. Next, let’s take a look at the lossy JPEG codec,
    so we can see how it changes the original image data, to reduce the data footprint.


    ### Lossy Compression: Using JPEG to Reduce File Size


    With the JPEG true-color algorithm option chosen from the drop-down menu in Figure
    [13-5](#A978-1-4842-4060-1_13_Chapter.html#Fig5), you can set a quality level
    and numeric value (amount), which will tell the JPEG algorithm how much of the
    original image pixel quality can be changed. Below that, there is a Progressive
    option that you can check off; it is similar to the indexed color Interlaced option,
    but using it results in a smaller file size, rather than a larger file size!


    ![A978-1-4842-4060-1_13_Fig5_HTML.jpg](A978-1-4842-4060-1_13_Fig5_HTML.jpg)


    Figure 13-5.


    To set a quality level and numeric value (amount), select JPEG, using the file
    format drop-down selector


    You can also apply a Blur factor to the image, using the Blur checkbox in the
    upper right hand corner. Blur will reduce data footprint when used with a JPEG
    algorithm, because edges, especially sharp (high adjacent pixel contrast) edges,
    are hard (difficult) for the JPEG algorithm to optimize efficiently. Use a small
    value for the Blur drop-down, if you use any at all.


    The proper way to use a JPEG algorithm is to tweak the Quality percentage while
    at the same time observing visual preview quality and the resulting data footprint
    at the bottom left side of this dialog. You will have to decide what your trade-off
    between data footprint reduction and image quality will be relative to your intended
    usage of an image. In this case, I utilized a high 75% Quality setting with Progressive
    downloading, and I got a 233KB data footprint, which is 389 percent smaller than
    the PNG-24 data footprint. JPEG Quality values between 60% and 100% will generally
    give you an excellent visual result; values under 20% generally will not.'
  trans: '

    ### 索引颜色格式：使用更少颜色来减小文件大小


    通过 `PNG-8` 索引颜色算法选项（如图 13-3 右上角下拉菜单中所选），您可以设置颜色选择算法、颜色数量、抖动类型和程度，以及一个**交错**选项。


    ![A978-1-4842-4060-1_13_Fig3_HTML.jpg](img/A978-1-4842-4060-1_13_Fig3_HTML.jpg)


    图 13-3. 从文件格式下拉选择器中选择 `PNG-8` 将使您能够从众多额外的索引颜色优化选项中进行选择


    如果您选择了**透明度**，则需要一种**蒙版**颜色，因为只支持 1 位（仅黑白，无灰度值）的 Alpha 通道，该通道没有抗锯齿（灰度）值。选择 `PNG-32`
    会得到比选择 `PNG-8` 好得多的合成（边缘质量）效果，因为它使用 8 位或 256 级灰度来表示其 Alpha 通道数据。因此，只要可能，请始终使用
    `PNG-32`，因为它能以完美的质量呈现任何基于 Alpha 的对象。


    `PNG-8` 选项带来的数据体积缩减比 `PNG-24` 高出 332%——从 906K 减小到 273K。当您设置或调整这些不同选项时，此对话框（优化引擎）会计算出新的数据体积，并显示在显示器左下角，同时还会显示对于使用老式
    56KB 调制解调器连接的用户，传输所需的时间。


    正如您在 Niki 脸颊区域所看到的，使用索引颜色格式时确实存在质量折衷。如果像素足够小，并且您使用了扩散抖动，这将不会引人注意。小像素常见于打印机、高分辨率图像以及现代“超精细点距”消费电子设备中。


    `PNG-8` 压缩算法（或称**编解码器**）比 Compuserve 的 `GIF` 索引颜色编解码器更新，因此能提供更好的数据体积效果。我使用相同的设置截取了一张截图（图
    13-4），向您展示 `GIF` 压缩结果为 307KB。这多了 12% 的数据体积，因此对于这张图像，单从算法角度看，`PNG-8` 比 `GIF` 效率高
    12%。`GIF` 设置及数据体积结果可见图 13-4。我使用 `GIF` 的唯一原因是它的动画功能。这被称为 aGIF、AnimGIF 或动画 GIF 索引颜色文件格式。


    ![A978-1-4842-4060-1_13_Fig4_HTML.jpg](img/A978-1-4842-4060-1_13_Fig4_HTML.jpg)


    图 13-4. 要比较 `GIF` 的压缩能力，请从右上角的文件格式下拉选择器中选择 `GIF`


    因此，如果您使用动画，请使用 `GIF`；如果您使用静态（静止）的索引颜色数字图像，请使用 `PNG-8`。接下来，让我们看看有损的 `JPEG` 编解码器，以便了解它如何改变原始图像数据，从而减小数据体积。


    ### 有损压缩：使用 JPEG 减小文件大小


    从图 13-5 的下拉菜单中选择 `JPEG` 真彩色算法选项后，您可以设置一个质量级别和数值（程度），这将告诉 `JPEG` 算法可以改变多少原始图像像素质量。在其下方，有一个**渐进式**选项可以勾选；它类似于索引颜色中的**交错**选项，但使用它会导致更小的文件大小，而不是更大的文件大小！


    ![A978-1-4842-4060-1_13_Fig5_HTML.jpg](img/A978-1-4842-4060-1_13_Fig5_HTML.jpg)


    图 13-5. 要设置质量级别和数值（程度），请使用文件格式下拉选择器选择 `JPEG`


    您还可以使用右上角的**模糊**复选框对图像应用模糊因子。当与 `JPEG` 算法一起使用时，模糊会减少数据体积，因为边缘，特别是锐利（高相邻像素对比度）的边缘，对于
    `JPEG` 算法来说是难以高效优化的。如果您要使用模糊，请在模糊下拉菜单中使用一个较小的值。


    正确使用 `JPEG` 算法的方法是调整**质量**百分比，同时观察此对话框左下角的视觉预览质量和最终的数据体积。您必须决定在数据体积缩减和图像质量之间如何权衡，这取决于您对图像的预期用途。在此例中，我使用了
    75% 的高质量设置并启用了渐进式下载，得到了 233KB 的数据体积，比 `PNG-24` 的数据体积小了 389%。`JPEG` 质量值在 60% 到
    100% 之间通常能带来极佳的视觉效果；低于 20% 的值则通常不行。

