- fmt: 'I also selected the `Alpha Channel`, in the `Load Selection` dialog, which
    I accessed using the `Select ➤ Load Selection` menu sequence. This will produce
    a red mask over the image to better show you where the alpha channel data is (or
    alternately, where it is not). We’ll be learning more about masking during [Chapter
    7](#A978-1-4842-4060-1_7_Chapter.html), when we start actually working on pixels
    inside of the alpha channel to achieve advanced digital image compositing results.


    I showed you how I selected my `RingElement` data, so that I could go on to use
    an `Edit ➤ Copy` menu sequence, to copy that data into the clipboard, and then
    paste it into the Niki image composite, shown in Figure [6-1](#A978-1-4842-4060-1_6_Chapter.html#Fig1),
    in the selected right-hand tab.


    To place the ring image data in another layer on the top of the Niki layer, I
    selected the Niki layer and used the `Edit ➤ Paste` menu sequence. This pasted
    the selected pixel data into a layer automatically created above the Niki layer,
    filling any unused pixels with alpha transparency values, and automatically creating
    an alpha channel for the new layer. Finally, I double-clicked the layer label
    and supplied it with my own `RingElement` layer label, which can be seen selected
    in gray in Figure [6-1](#A978-1-4842-4060-1_6_Chapter.html#Fig1).


    Next, let’s take a look at how you would create the same compositing pipeline
    using GIMP. There is a really cool feature in GIMP 2.8.14 that makes bringing
    32-bit imagery, such as the `RingElement.png32` file, into GIMP. This feature
    automatically creates a layer in the image compositing pipeline (layer stack)
    and places the imported imagery into this layer component.


    Using the GIMP `File ➤ Open as Layer` menu sequence is far easier than the work
    process that I used in Photoshop CS, which you see in Figures [6-1](#A978-1-4842-4060-1_6_Chapter.html#Fig1)
    and [6-2](#A978-1-4842-4060-1_6_Chapter.html#Fig2). To use this command, select
    the `Niki.png` layer, shown selected in blue in Figure [6-3](#A978-1-4842-4060-1_6_Chapter.html#Fig3),
    and use a `File ➤ Open as Layer` sequence, shown on the left in Figure [6-3](#A978-1-4842-4060-1_6_Chapter.html#Fig3).


    ![A978-1-4842-4060-1_6_Fig3_HTML.jpg](A978-1-4842-4060-1_6_Fig3_HTML.jpg)


    Figure 6-3.


    You can use the `Open as Layer` menu option to insert a ring in GIMP


    If you select a `RingElement.png` file from your `File Open` dialog, GIMP will
    add it for you, as a compositing layer, above your `Niki.png` layer, as shown
    in Figure [6-4](#A978-1-4842-4060-1_6_Chapter.html#Fig4). You will see that GIMP
    also uses a checkerboard pattern to represent transparency as you can see in the
    Layer palette on the right side of Figure [6-4](#A978-1-4842-4060-1_6_Chapter.html#Fig4).
    Notice that GIMP also shows you the pixel dimension of the `RingElement.png` layer,
    using a black-and-yellow dashed square, framing the hoop in the middle of the
    Niki image composite, on the `RingElement` layer.


    ![A978-1-4842-4060-1_6_Fig4_HTML.jpg](A978-1-4842-4060-1_6_Fig4_HTML.jpg)


    Figure 6-4.


    The `RingElement.png` layer shows dimension and alpha


    Alpha channels aren’t only used for defining transparent areas in your compositing
    pipeline (layer stack), they can also be used for more creative purposes such
    as storing selections.


    ## Selection: Using Alpha for Selection Sets


    As you have already seen in Figure [6-2](#A978-1-4842-4060-1_6_Chapter.html#Fig2),
    alpha channels can also be used to store objects so that they can be easily selected
    for later use in your digital image compositing projects. We’ll be looking at
    selection sets more in [Chapter 7](#A978-1-4842-4060-1_7_Chapter.html), when we
    look at masking, but I will show you some of the tools and techniques here, so
    that we can bridge into the related topics in these later chapters in the book
    more seamlessly.


    ### Selecting Alpha Channel Data in Photoshop CS


    Let’s take a look at how this works by continuing with a Photoshop example we
    started in Figure [6-1](#A978-1-4842-4060-1_6_Chapter.html#Fig1). I have included
    the PSD file with this book; it is called `Chapter6alphaChannels.psd` and is in
    the files repository for this book on the `apress.com` website, if you want to
    open it now, and follow along with me.


    The first thing you’ll want to do is to click the magic wand tool at the top of
    the left-hand toolbar, as seen selected in Figure [6-5](#A978-1-4842-4060-1_6_Chapter.html#Fig5)
    (it looks like a sparkler).


    ![A978-1-4842-4060-1_6_Fig5_HTML.jpg](A978-1-4842-4060-1_6_Fig5_HTML.jpg)


    Figure 6-5.


    Using Photoshop’s Magic Wand tool to select the inside of a ring


    Then, click inside the middle of the ring, and make sure your `RingElement` layer
    is the one that is selected in the right panel. Digital imaging software is “modal,”
    as we will get into in greater detail during [Chapter 10](#A978-1-4842-4060-1_10_Chapter.html)
    covering modal operations.


    As you can see in Figure [6-5](#A978-1-4842-4060-1_6_Chapter.html#Fig5), a center
    area of your ring will then become selected, with what is popularly termed in
    the industry as “marching ants.”


    You can expand this area of selection, if you like, by a few pixels using the
    `Select ➤ Modify ➤ Expand` menu sequence and the `Expand Selection` dialog, which
    are also seen in Figure [6-5](#A978-1-4842-4060-1_6_Chapter.html#Fig5). I decided
    to expand my circular selection by 3 pixels in width.


    I did this to make sure that my selection went underneath the edge of the ring,
    so there was no visible edge transition right at the edge of the ring, where the
    tool will put your selection edge. This is a popular digital image compositing
    trick that compositing professionals often utilize.


    Then, click the Niki layer, and use `Select ➤ Inverse`, to select the image pixels
    outside the ring as seen in Figure [6-6](#A978-1-4842-4060-1_6_Chapter.html#Fig6).


    ![A978-1-4842-4060-1_6_Fig6_HTML.jpg](A978-1-4842-4060-1_6_Fig6_HTML.jpg)


    Figure 6-6.


    The selection inverted and the Niki layer selected


    You can hit the `Delete` key, to delete pixels, as seen in Figure [6-7](#A978-1-4842-4060-1_6_Chapter.html#Fig7).


    ![A978-1-4842-4060-1_6_Fig7_HTML.jpg](A978-1-4842-4060-1_6_Fig7_HTML.jpg)


    Figure 6-7.


    By using the `Delete` key, you can delete the selected pixels


    Since Photoshop CS is modal, the key “move” is to select the pixels while the
    `RingElement` layer is selected, and before you press the `Delete` key, change
    the selected layer to the Niki layer, so that those are the pixels that will be
    removed. This will leave only the round Niki decorative element, ready to use
    on a web site, an app, or social media.


    Now let’s take a look at the work process for doing the same thing using GIMP,
    being that ultimately these two digital imaging software packages are quite different,
    as far as your work process goes. This particular process is fairly similar for
    the two software packages, others are not similar at all.'
