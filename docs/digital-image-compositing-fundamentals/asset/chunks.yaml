- fmt: '# Screen Shapes: Common Display Aspect Ratios


    Many HDTV resolution display screens, discussed in [Chapter 2](#A978-1-4842-4060-1_2_Chapter.html),
    use an HDTV widescreen aspect ratio of `16:9`. However, some displays use a less
    wide, or taller, `16:10` (or `8:5`, if you prefer to go by lowest common denominators)
    aspect ratio. Even-wider screens will surely appear on the market soon, so look
    for `16:8` (which is also `2:1`) ultrawide screens, which will have a `2160 x
    1080` screen resolution.


    The original television screens were almost square, using a `3:2` aspect ratio.
    Computer screens featured a `4:3` aspect ratio, such as Macintosh’s `512-by-384`
    screen resolution, or `640 by 480` for the PC. Once you learn how to calculate
    the aspect ratio in the next section of this chapter, you can check my math!


    As time went on, PC displays kept getting wider, until a `2:1`-widescreen `2160
    x 1080` display appeared in 2013. It won’t be long before the Ultra High Definition,
    or UHD, 4K iTV Set `2:1` display (`4096 by 2048` pixels) will show up in the market.


    The most recent aspect ratio change was introduced by the smart watch industry,
    with square `1:1`-aspect-ratio displays showing up in 2015. Custom-screen aspect
    ratios can get fairly extreme; we’ve all seen the `9:1` aspect ratio screens in
    sports stadiums, ringing around the top and ends of the stadium walls.


    ## Doing the Math: How to Arrive at the Aspect Ratio


    An image aspect ratio is usually expressed as the smallest pair of numbers that
    can be achieved on either side of the aspect ratio colon. If you paid attention
    in high school when you were being taught about lowest (or least) common denominators,
    then this aspect ratio mathematics should be fairly easy to calculate.


    I usually do the mathematical matriculation (say it five times rapidly, to make
    what you are about to do seem easier) by continuing to divide each side by a factor
    of two. Let’s take a fairly oddball `1280 x 1024` (it’s called SXGA) resolution
    as the example. Half of `1280:1024` is `640:512`, and half of that, should be
    `320:256`. Half of that is `160:128`, and half of that is `80:64`. Half of that’s
    `40:32`, and another half is `20:16`. From `10:8`, our last half gets us to `5:4`.
    Therefore, an SXGA resolution uses a `5:4` aspect ratio.


    Interestingly, all the above ratios were the same aspect ratio, and all were valid.
    Thus, if you want to take the really easy way out, replace that `x` in your image
    resolution with the colon and you have an aspect ratio for the image. The industry
    standard involves distilling an aspect ratio down to its lowest format, as we’ve
    done here, as that is a far more useful ratio.


    ## Using Imaging Software: Maintaining Aspect Ratio


    To change a digital image’s resolution in Photoshop you use the `Image ➤ Image
    Size` menu sequence, which was shown in Figure [2-1](#A978-1-4842-4060-1_2_Chapter.html#Fig1)
    of the last chapter. Notice the chain icon in the `Image Size` dialog in Figure
    [3-1](#A978-1-4842-4060-1_3_Chapter.html#Fig1) and how it connects the width and
    height data fields when it is turned on. This “locks” the aspect ratio, so that
    when you change one value, the other value will change, based on the current image
    aspect ratio, keeping the scaling uniform across both the `x` and the `y` axes.


    ![A978-1-4842-4060-1_3_Fig1_HTML.jpg](A978-1-4842-4060-1_3_Fig1_HTML.jpg)


    Figure 3-1. In Photoshop use an `Image ➤ Image Size` menu sequence


    If you look ahead a little bit in the chapter at Figure [3-2](#A978-1-4842-4060-1_3_Chapter.html#Fig2),
    you can also see the unlocked aspect ratio icon, and see how these two lines (connecting
    to Width and Height fields) disappear when the chain icon is clicked on and unlocked.


    ![A978-1-4842-4060-1_3_Fig2_HTML.jpg](A978-1-4842-4060-1_3_Fig2_HTML.jpg)


    Figure 3-2. `Image Size` dialog showing the `w:h` aspect ratio unlocked


    The user interface design of this `Image Size` (`Image Scaling`) dialog demonstrates
    how important the concept of locking the aspect ratio in order to prevent distortion
    truly is to your digital image editing and compositing work process.


    Let’s unlock the aspect ratio in this dialog, and resize the image, so that it’s
    a square `571-by-571`-pixel image, so that you can see this distortion that is
    caused by changing the aspect ratio for yourself.


    Figure [3-2](#A978-1-4842-4060-1_3_Chapter.html#Fig2) shows this image along with
    another preview image with the width distorted along the `x` axis. At some point
    you will see this mistake happen in images on the Internet. It is quite common,
    if you see a face that is unnaturally thin, or one that is unnaturally pudgy,
    you will likely be looking at `x`-axis and `y`-axis image aspect ratio distortion.


    The more drastically you change the aspect ratio, the more noticeable the distortion
    will become. It is also much more noticeable with people and animals than it is
    with landscapes or textures such as pictures of stone or foliage, for instance.


    The way to achieve this change in aspect ratio without a distortion occurring
    is to use image cropping rather than image scaling. Image cropping changes the
    number of pixels by cutting some of them off of the top, bottom or sides, rather
    than by scaling or re-sampling the same pixels to different resolution specifications.


    Figure [3-3](#A978-1-4842-4060-1_3_Chapter.html#Fig3) shows the Photoshop crop
    tool, as selected on the left side of the screen, underneath the Magic Wand Tool.


    ![A978-1-4842-4060-1_3_Fig3_HTML.jpg](A978-1-4842-4060-1_3_Fig3_HTML.jpg)


    Figure 3-3. Use Photoshop’s crop tool to create an image with a `1:1` aspect ratio


    As you can see, the Photoshop tool provides you with cropping grid guidelines
    as well as with a current image width in pixels indicator, both overlaid over
    the top of the image.


    These allow you to ascertain in real-time exactly what you are doing to your image
    and what you will get when you are finished with the tool. To complete a crop
    tool operation, you will need to double-click on the inside of your cropping area.


    GIMP features a `Set Image Canvas Size` dialog that offers an image-cropping function,
    as you can see in Figure [3-4](#A978-1-4842-4060-1_3_Chapter.html#Fig4). Setting
    a new canvas size allows you to crop the digital image to your desired aspect
    ratio without introducing any distortion. It is important to note that Photoshop
    also has a `Canvas Size` dialog that can be used instead of the crop tool to achieve
    the same result. You can also click the `Center` button for your crop operation.


    ![A978-1-4842-4060-1_3_Fig4_HTML.jpg](A978-1-4842-4060-1_3_Fig4_HTML.jpg)


    Figure 3-4. GIMP’s `Set Image Canvas Size` dialog allows you to crop an image'
