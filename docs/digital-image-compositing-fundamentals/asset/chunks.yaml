  trans: '

    # 屏幕形状：常见的显示宽高比


    第 2 章中讨论的许多高清电视分辨率显示屏，都采用了 `16:9` 的高清电视宽屏宽高比。然而，有些显示器则使用了不那么宽、或者说更高的 `16:10`（或者按最小公分母来说是
    `8:5`）宽高比。更宽的屏幕无疑很快也会出现在市场上，因此请关注 `16:8`（也就是 `2:1`）的超宽屏幕，其屏幕分辨率将为 `2160 x 1080`。


    最初的电视屏幕几乎是方形的，采用了 `3:2` 的宽高比。计算机屏幕则采用了 `4:3` 的宽高比，例如 Macintosh 的 `512 x 384` 屏幕分辨率，或
    PC 的 `640 x 480`。一旦你在本章下一节学会了如何计算宽高比，你就可以验证我的计算了！


    随着时间的推移，PC 显示器变得越来越宽，直到 2013 年出现了 `2:1` 宽屏的 `2160 x 1080` 显示器。不久之后，采用 `2:1` 显示比例（`4096
    x 2048` 像素）的超高清（UHD）4K iTV 电视也将出现在市场上。


    最新的宽高比变化是由智能手表行业带来的，2015 年出现了方形的 `1:1` 宽高比显示屏。定制的屏幕宽高比可能会变得相当极端；我们都见过体育场馆中环绕在馆墙顶部和两端的
    `9:1` 宽高比屏幕。


    ## 计算：如何得出宽高比


    图像的宽高比通常表示为宽高比冒号两侧都能得到的最小整数对。如果你在高中学习最小公分母时认真听讲了，那么这种宽高比的计算应该相当容易。


    我通常采用不断将两边同时除以 2 的方法来进行这种数学演算（快速念五遍，这会让接下来的操作看起来更简单）。我们以一个比较特殊的 `1280 x 1024`（称为
    SXGA）分辨率为例。`1280:1024` 的一半是 `640:512`，再一半是 `320:256`。再一半是 `160:128`，再一半是 `80:64`。再一半是
    `40:32`，再一半是 `20:16`。从 `10:8` 开始，最后一半得到 `5:4`。因此，SXGA 分辨率采用了 `5:4` 的宽高比。


    有趣的是，上述所有比例都是相同的宽高比，并且都是有效的。因此，如果你想走最简单的捷径，只需将图像分辨率中的 `x` 替换为冒号，你就得到了该图像的宽高比。行业标准要求将宽高比简化为其最简形式，正如我们在此所做的那样，因为这是一个更有用的比例。


    ## 使用图像软件：保持宽高比


    要在 Photoshop 中更改数字图像的分辨率，你需要使用 `图像 ➤ 图像大小` 菜单序列，如上一章的图 2-1 所示。请注意图 3-1 中 `图像大小`
    对话框里的链条图标，以及当它被启用时如何连接宽度和高度数据字段。这会“锁定”宽高比，因此当你更改一个值时，另一个值将根据当前图像宽高比自动更改，从而保持缩放沿
    `x` 轴和 `y` 轴均匀一致。


    ![A978-1-4842-4060-1_3_Fig1_HTML.jpg](img/A978-1-4842-4060-1_3_Fig1_HTML.jpg)


    图 3-1. 在 Photoshop 中使用 `图像 ➤ 图像大小` 菜单序列


    如果你提前看一下本章中的图 3-2，你也可以看到未锁定的宽高比图标，以及当链条图标被点击解锁后，这两条线（连接到宽度和高度字段的线）是如何消失的。


    ![A978-1-4842-4060-1_3_Fig2_HTML.jpg](img/A978-1-4842-4060-1_3_Fig2_HTML.jpg)


    图 3-2. `图像大小` 对话框显示 `宽:高` 宽高比已解锁


    这个 `图像大小`（`图像缩放`）对话框的用户界面设计表明，锁定宽高比以防止图像失真这一概念，对于你的数字图像编辑和合成工作流程至关重要。


    让我们解锁此对话框中的宽高比，并将图像大小调整为方形 `571 x 571` 像素的图像，这样你就可以亲眼看到因更改宽高比而引起的失真。


    图 3-2 显示了这个图像，以及另一个宽度沿 `x` 轴失真的预览图像。在某些时候，你会在互联网上的图片中看到这种错误。这很常见，如果你看到一张脸异常瘦长，或者异常臃肿，你很可能看到的是图像在
    `x` 轴和 `y` 轴上的宽高比失真。


    你改变宽高比的程度越剧烈，失真就越明显。并且，对于人物和动物来说，这种失真比对于风景或纹理（例如石头或树叶的照片）要明显得多。


    要在不发生失真的情况下实现宽高比的改变，方法是使用图像裁剪而非图像缩放。图像裁剪通过从顶部、底部或两侧切掉部分像素来改变像素数量，而不是通过缩放或对相同像素进行重采样以达到不同的分辨率规格。


    图 3-3 展示了 Photoshop 的裁剪工具，它在屏幕左侧的魔棒工具下方被选中。


    ![A978-1-4842-4060-1_3_Fig3_HTML.jpg](img/A978-1-4842-4060-1_3_Fig3_HTML.jpg)


    图 3-3. 使用 Photoshop 的裁剪工具创建一张 `1:1` 宽高比的图像


    如你所见，Photoshop 工具提供了裁剪网格引导线以及当前图像宽度（以像素为单位）的指示器，两者都叠加在图像上方。


    这些功能使你能够实时准确地了解你对图像所做的操作，以及当你完成工具操作后会得到什么结果。要完成裁剪工具操作，你需要双击裁剪区域内部。


    GIMP 提供了一个 `设置图像画布大小` 对话框，它提供了图像裁剪功能，如图 3-4 所示。设置新的画布大小允许你将数字图像裁剪为所需的宽高比，而不会引入任何失真。重要的是要注意，Photoshop
    也有一个 `画布大小` 对话框，可以用来代替裁剪工具以达到相同的结果。你还可以点击 `居中` 按钮进行裁剪操作。


    ![A978-1-4842-4060-1_3_Fig4_HTML.jpg](img/A978-1-4842-4060-1_3_Fig4_HTML.jpg)


    图 3-4. GIMP 的 `设置图像画布大小` 对话框允许你裁剪图像

    '
- fmt: 'The result of the crop dialog is seen in Figure [3-5](#A978-1-4842-4060-1_3_Chapter.html#Fig5).


    ![A978-1-4842-4060-1_3_Fig5_HTML.jpg](A978-1-4842-4060-1_3_Fig5_HTML.jpg)


    Figure 3-5.


    The result of the `Image ➤ Canvas Size` operation


    Just like Photoshop CS has both an `Image ➤ Canvas Size` function and a crop tool,
    GIMP also has a crop tool. Look for the knife icon in the tool palette, shown
    as selected in blue in Figure [3-6](#A978-1-4842-4060-1_3_Chapter.html#Fig6).
    This tool has a plethora of options that can be seen underneath the tools palette.


    ![A978-1-4842-4060-1_3_Fig6_HTML.jpg](A978-1-4842-4060-1_3_Fig6_HTML.jpg)


    Figure 3-6.


    As highlighted in blue, GIMP has a crop tool (knife icon) with many options


    The Photoshop options are shown along the top of the screen, as you can see in
    Figure [3-3](#A978-1-4842-4060-1_3_Chapter.html#Fig3). In GIMP, I selected the
    `Rule of Fifths` option to use a fine cropping grid. I positioned the left edge
    at position 121 on the x axis (I used 116 in Photoshop).


    GIMP also shows me the size of the 571 pixel-image so that I can get the precise
    result I’m trying to achieve. As you can see, these two imaging tools provide
    different approaches to the cropping operation, but both are able to achieve the
    same professional level end result.


    As you can see, both GIMP and Photoshop provide powerful image-cropping and image-scaling
    tools, if you use them wisely.


    ## Summary


    In the third chapter, we took a look at the concept of aspect ratio, which is
    used to define the rectangular shape of an image. You learned about some of the
    most popular aspect ratios used for today’s consumer electronics hardware devices
    as well as the mathematics behind calculating your aspect ratio. Finally, we looked
    at how to avoid distortion when changing the resolution, or the aspect ratio,
    of the imagery, by either locking the aspect ratio during scaling or using the
    Crop tool or `Canvas Size` dialog. We went over how to access and use the crop
    tool and `Canvas Size` dialog in both Photoshop CS6 and GIMP 2.8.14.


    In the next chapter, we’ll take a close look at digital image color theory, and
    delve into how colors are represented in digital image compositing pipelines and
    in digital imagery.


    # 4. The Color of Digital Imaging: Color Theory


    Now that you have an understanding of the positioning of pixels using an `x,y`
    grid, which defines the image resolution as well as the image aspect ratio, it
    is time to look inside of each pixel, and see how it defines its color space.
    Whereas a digital image holds its resolution and aspect ratio, from a data perspective,
    each pixel contains its own characteristics, such as the `x,y` grid (array) position,
    color composition, transparency or opacity, blending mode, and the like. We will
    be looking at all of these areas individually, each in their own chapters within
    this book.


    The color of the pixels that make up the digital imagery ultimately define what
    an image looks like, and so color theory is an important topic here. Photoshop
    CS6 and GIMP 2.8.14 both feature a plethora of tools that will allow us to adjust
    color, as well as to select pixels using their color values.


    If you’re using modern-day consumer electronics devices, then you’re using an
    `RGB`, or red, green, and blue, pixel color model. If you are working with a modern
    printer, then you are using a `CMYK`, or cyan, magenta, yellow, and black, color
    model.


    If you’re wondering why the acronym is not `CMYB`, it is because its black plate
    is known as the “key” plate, which the other color plates are aligned to (or aligned
    with).


    In this chapter, we will be looking at these two color models as well as the best
    color model, or “mode,” to use with your digital image compositing pipeline. Now
    let’s get started!


    ## Color Theory: Using Pixel Color Channels


    Whether you are compositing digital imagery to be used on display screens or to
    be printed using inks on printers, your pixels will be holding color values that
    use one or more “channels.” These are sometimes referred to as “plates” in the
    printing industry, continuing the tradition of older printing presses that used
    metal plates, some of which are still in use today. In Photoshop and GIMP, the
    color channels have their own floating palette and allow you to work on just one
    color channel (or plate), which can be quite useful for special effects, or other
    advanced image operations.'
