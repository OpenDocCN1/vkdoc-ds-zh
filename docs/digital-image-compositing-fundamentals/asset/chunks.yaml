    要将文件保存为 JPEG 格式，请输入 `filename.jpg`，选择所需选项，然后点击**导出**按钮。


    **优化**和**渐进式**选项可用于减小 JPEG 文件的体积。你可以使用**保存缩略图**选项为桌面保存一张缩略图。此外，你还可以通过**平滑度**滑块应用模糊效果。我使用了
    `0.08` 的值来应用模糊，虽然你看不到这种模糊，但它能提升压缩效率。


    你甚至可以指定高级的**子采样**配置，还能指定 JPEG 编解码器主算法将使用哪种 DCT（离散余弦变换）方法。


    接下来，让我们复现之前在 Photoshop CS6 中的操作：导出一张 PNG-32 图像，该图像在透明 Alpha 通道背景上居中放置了*环元素*和*Niki*
    模特照片。


    由于你使用的 GIMP `2.8.14` 数字图像合成结构与 Photoshop 合成结构不同，我们需要采用不同的工作流程来实现此目标。接下来我们就讨论这个问题，完成这部分后，本章关于数据占用空间优化的内容就结束了。


    ## 在 GIMP 中创建带遮罩的 PNG-32 对象


    为了创建带遮罩的 PNG-32 对象，你首先需要将第二层和第三层使用的遮罩转移并反转（我尝试过拖放，但没能成功），然后将其应用到第一层（底层）。


    实现此操作的工作流程是：选中第二层或第三层，然后右键点击该图层，选择**将遮罩转换为选区**选项，如图 13-14 所示。


    ![A978-1-4842-4060-1_13_Fig14_HTML.jpg](img/A978-1-4842-4060-1_13_Fig14_HTML.jpg)


    **图 13-14.** 要将图层遮罩传输到临时选区集，请选中该图层遮罩并使用**将遮罩转换为选区**选项。


    我们需要使用以下工作流程，将图层遮罩从*滤镜*和*黑白*图层桥接到尚未具有图层遮罩的 `Niki.png` 颜色图层：**将遮罩转换为选区**、**反转选区**、**选择目标图层**以及**添加图层遮罩（选区成为遮罩）**。


    接下来，使用 **选择 ➤ 反转**菜单序列反转选区，如图 13-15 所示。


    ![A978-1-4842-4060-1_13_Fig15_HTML.jpg](img/A978-1-4842-4060-1_13_Fig15_HTML.jpg)


    **图 13-15.** 要反转遮罩（作为选区），请使用 **选择 ➤ 反转**。


    你选中的源图层是*滤镜特殊效果*还是*Niki 黑白*并不重要，因为它们都拥有相同的图层遮罩，你可以在**反转选区**操作之前将其转换为选区。但是，在使用**添加图层遮罩**之前，你必须选中
    `Niki.png` 图层。


    需要注意的是，你的选区存储在系统内存中，并不依附于任何特定图层——直到你使用**添加图层遮罩**将其附着到图层上！


    现在你可以添加图层遮罩了。为此，请选中你的 `Niki.png` 图层，然后右键点击并选择**添加图层遮罩**选项。在弹出的对话框中，勾选**选区**选项并点击**添加**按钮，如图
    13-16 所示。这会将反转后的选区转换为一个图层遮罩，该遮罩看起来与其他两个图层遮罩（白色背景上的黑色圆形区域）完全相反。


    ![A978-1-4842-4060-1_13_Fig16_HTML.jpg](img/A978-1-4842-4060-1_13_Fig16_HTML.jpg)


    **图 13-16.** 要添加图层遮罩，请选中 `Niki.png` 图层，右键点击选中的图层，然后选择**添加图层遮罩**。


    如图 13-17 所示，这为你带来了期望的结果——在一个透明背景上，酒环金属元素内的彩色摄影模特图像——该图像正通过 Alpha 通道数据创建。如果你使用
    `.png` 扩展名导出，你将得到一幅 PNG-32 图像，正如你所愿。


    ![A978-1-4842-4060-1_13_Fig17_HTML.jpg](img/A978-1-4842-4060-1_13_Fig17_HTML.jpg)


    **图 13-17.** 将反转的选区转换为图层遮罩后，`Niki.png` 的图层遮罩现在与第二层和第三层完全相反，如**图层**调板中选中所示。


    我们将在第 14 章中继续探讨文件导出，届时我们将介绍如何使用各种开源编程语言和平台“桥接”数字图像合成。


    ## 本章小结


    在本章中，我们回顾了在 Photoshop 和 GIMP 的**文件存储为 Web 所用格式**和**文件导出为**工作流程中的数据占用空间优化。我们研究了针对三种最常用的数字图像文件格式——PNG、GIF
    和 JPEG——如何执行这些工作流程。你首先学习了如何在 Photoshop 中优化这些文件，然后了解了图像合成中的图层可见性如何影响保存到文件格式中的内容，最后你了解了可以在
    GIMP `2.8.14` 中使用的完全相同的工作流程。


    在最后一章中，你将了解更多关于桥接你在数字图像合成软件包中的工作所涉及的一些重要考量，并审视一些最流行的编码环境，如 Python、Java、JavaFX、HTML5、CSS3、JavaScript
    和 Android Studio。


    # 14. 数字成像自动化：编程


    既然我们已经了解了如何利用这两款数字图像合成软件包中的强大功能创建专业数字图像，并将它们导出为最流行的文件格式，那么是时候来审视这些编程平台本身了，以防你想将自己的数字图像合成职业生涯提升到新的高度。在本章中，你将了解
    GIMP（Python）和 Photoshop（JavaScript）使用的内部编程语言，以及支持数字成像的外部编程语言，如 C# (.NET)、ObjectiveC
    (iOS)、Java (Android Studio, Linux)、JavaFX、JavaScript、HTML5 和 CSS3 (WebKit 浏览器,
    HTML5 OSs)。


    如果你计划在自己的编程项目或开源开发平台中使用本书合成概念和工作流程中的数字图像，或者你有兴趣了解更多关于将编程纳入你丰富技能库的知识，这些都是需要了解的重要信息。


    本章将涵盖的平台运行着消费电子行业绝大多数硬件设备，包括 Java（Android Studio 和 WebKit）；JavaFX（Android、iOS、Windows、Linux、Mac
    OS X、Solaris）；以及带有 CSS3 和 HTML5 脚本的 JavaScript（WebKit 浏览器）。


    本章不会教你编程——这需要多本书籍（以及编程经验）才能做到——但如果你将当前的数字图像合成之旅延伸到新媒体软件开发领域，它会向你展示可能实现的目标。本章将要涉及的所有内容均可免费用于商业用途，你可以轻松下载
    Android Studio (IntelliJ)、Java 和 JavaFX (NetBeans)、HTML5 (NetBeans) 以及 Python
    (Eclipse)。


    我们将从 Photoshop 和 GIMP 的内部脚本语言开始，然后介绍流行的开放平台。


    ## 内部脚本语言：自动化


    Photoshop 和 GIMP 都包含几种用于在其软件包内自动化工作流程的脚本语言。这种自动化在计算机行业中传统上被称为“批处理”——这个术语源于旧的大型机时代，当时员工在白天输入数据，然后在晚上由计算机在员工睡觉时进行批处理。我将在本章的前两节中介绍
    Photoshop 和 GIMP 使用的各种脚本语言，然后在剩余章节中审视其他支持数字图像合成管线的语言。这将向你展示可用的选项，以便将你的数字合成管线从数字成像软件桥接到编程。

