- fmt: '### Selecting Alpha Channel Data in GIMP


    In GIMP, the contiguous pixel (color or transparency) selection tool is called
    the `Fuzzy Select` tool, rather than the `Magic Wand` tool in Photoshop. The icon
    is quite similar, and is shown selected in blue in the top-right corner of Figure
    [6-8](#A978-1-4842-4060-1_6_Chapter.html#Fig8). Make sure the `RingElement.png`
    layer is selected and click inside of the ring to create your selection. Next
    use the `Select ➤ Grow` menu sequence to access a `Grow Selection` dialog. If
    you grow your selection by 3 pixels, you will make sure your selection, and resulting
    image data, goes underneath the ring completely.


    ![A978-1-4842-4060-1_6_Fig8_HTML.jpg](A978-1-4842-4060-1_6_Fig8_HTML.jpg)


    Figure 6-8.


    To make sure the image goes underneath the ring completely, start by clicking
    inside of the ring and then use `Select ➤ Grow` and enlarge by 3 pixels.


    Essentially I’m expanding a selection to make sure its edge is “hidden” behind
    the `RingElement`. You can see the selection edge is visible on the inside of
    the ring element in Figure [6-8](#A978-1-4842-4060-1_6_Chapter.html#Fig8), whereas,
    in Figure [6-9](#A978-1-4842-4060-1_6_Chapter.html#Fig9), it is underneath the
    ring element, even though your selection marching ants look like they’re actually
    on top of the ring element (they’re not).


    ![A978-1-4842-4060-1_6_Fig9_HTML.jpg](A978-1-4842-4060-1_6_Fig9_HTML.jpg)


    Figure 6-9.


    To invert the part of the image that is selected, click inside the ring and then
    use the `Select ➤ Invert` menu.


    I will be using this technique a lot, over the course of this book, so that you
    will become familiar with expanding your selection so that it is not right on
    the edge of your composite layer, which might cause slight edge imperfections
    in an image.


    Next, use a `Select ➤ Invert` menu sequence to invert the selection. Doing this
    will select the part of the image that is underneath and outside of the ring instead
    of that which is inside of it—leave what is inside of the ring intact. The menu
    sequence can be seen in Figure [6-9](#A978-1-4842-4060-1_6_Chapter.html#Fig9),
    along with the inner ring selection once it has been expanded 3 pixels outward
    by using the `Grow Selection` dialog. Now, all you have to do is to select the
    `Niki.png` layer and click `Delete` to remove the background image pixels which
    are located outside of the ring element!


    Figure [6-10](#A978-1-4842-4060-1_6_Chapter.html#Fig10) shows the GIMP screen
    after I have selected the `Niki.png` layer, and hit the `Delete` key. As you will
    see, GIMP uses a white background color behind the layer, one of the many ways
    that the program differs from Photoshop CS6.


    ![A978-1-4842-4060-1_6_Fig10_HTML.jpg](A978-1-4842-4060-1_6_Fig10_HTML.jpg)


    Figure 6-10.


    You can select the `Niki.png` layer and hit the `Delete` key to remove the background
    image.


    If you want to get rid of the white background and have the transparency, you
    will need to right-click on the `Niki.png` layer, with your original 3-pixel-expanded
    selection activated, and then select the `Add Layer Mask` dialog and `Selection`
    option.


    This will turn the selection into the layer mask, making the layer itself transparent
    in its own background plate rather than using the white color. However, that’s
    a topic for [Chapter 7](#A978-1-4842-4060-1_7_Chapter.html), when we get into
    a more advanced look at masking techniques.


    We will be using layer masks more and more as this book progresses, so you will
    become familiar with this important and powerful concept. I just wanted to expose
    you to it here early on, so that you could start getting familiar with it.


    Fortunately, that chapter is next, so this turns out to be another seamless transition
    between chapter topics, which I am trying to apply consistently in this book so
    that it flows nicely.


    ## Summary


    In this sixth chapter, we took a closer look at the concept of the digital image
    alpha channel. Image alpha values define how a pixel represents translucency within
    each of the compositing layers within the digital image compositing pipeline.
    You learned about how Photoshop and GIMP each represent alpha data and about the
    `Layers` and `Channels` palettes used to display this data. You also learned how
    to composite a PNG32 image object overlay with alpha values over a PNG24 image
    object that does not have any alpha values, because it is only a backplate, also
    known as a background image.


    We also went over how to select areas of transparent pixels in Photoshop using
    the `Magic Wand` tool and in GIMP using the `Fuzzy Select` tool. In addition,
    we looked at how to expand and invert a selection and delete selected pixels to
    create even more pixel transparency in our digital image compositing pipeline.


    In the next chapter, you will learn more about digital image masking and how to
    use pixel selection tools to “pull” a digital image mask and save it for later
    use by using an alpha channel. As you can see, there is a good reason for the
    chapter order in this book!


    # 7. The Isolation of Digital Imaging: Masking Tools


    Now that you have an understanding of alpha channel data and how it can be used
    in a digital image compositing pipeline, as well as how to use it to “store” digital
    image objects, the next logical step is to learn how to use masking tools to extract
    subject matter from your digital images. This is called “pulling a mask” in the
    digital image compositing industry.


    Photoshop and GIMP have a number of masking tools that can be used to achieve
    this pixel extraction end result. We will be looking at some of them in this chapter
    along with some of the approaches and work processes that can be used to pull
    a mask out of your 24-bit digital image assets, and thereby turn them into 32-bit
    image assets. The assets that result include alpha channels. The alpha channel
    serves to isolate any subject material in images that you want to composite in
    a layer stack.


    ## Masking: Isolating and Extracting Pixels


    Masking is the process of extracting an irregularly shaped area of pixels from
    an image, usually for the purpose of digital image compositing. Generally, the
    desired outcome is the combination of these pixels with another image to achieve
    some artistic end result, or a special effect. This is done with layers, which
    we’re going to be covering in detail in [Chapter 8](#A978-1-4842-4060-1_8_Chapter.html),
    as well as more advanced features, such as Porter-Duff blending and transfer modes.
    All of these functions use these complex, multi-modal operation, digital image
    compositing software packages, such as the ones that we’re using for this book,
    both of which I recommend that you acquire, and master.


    I’m not going to go into a whole lot of terms and theory and the like regarding
    masking because it’s more about the work process and all the different tools the
    software packages offer to select pixels, in a significant number of different
    ways.


    If you do not want to learn how to mask images by hand, you can purchase a green
    screen or blue screen, and photograph your subjects (objects) in front of it and
    then use one of the popular plug-ins that auto-generates your mask for you.'
