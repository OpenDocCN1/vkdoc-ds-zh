    # 图层可见性：选择要保存的像素


    在我们探讨遵循相同原理的 GIMP 数据占用优化（因为它使用相同的图像编解码器）之前，我想先向你展示一个同时适用于 Photoshop 和 GIMP 的原则。我只会以
    Photoshop 为例来演示这个原则，因为完全相同的原则在 GIMP 中同样适用。


    你可能已经自行推测到了，`存储为 Web 所用格式`（Photoshop）和`文件导出`（GIMP）引擎只会将可见图层的数据保存到你的图像文件中。因此，如果你想保存一个包含圆环内
    Niki 图像的 `PNG-32` 文件以便在其他地方使用，就需要关闭 `文本图层`、`特效色彩混合`、`黑白`、`插件滤镜效果`和`效果`（`RingElement`
    子图层），如图 13-6 所示。


    ![A978-1-4842-4060-1_13_Fig6_HTML.jpg](img/A978-1-4842-4060-1_13_Fig6_HTML.jpg)


    图 13-6.

    你可以关闭那些不希望其数据出现在最终导出图像文件中的图层


    这将创建一个酒红色的金属环环绕着 Niki，并完美地蒙版在透明背景之上，如图 13-6 以及 Photoshop 的`存储为 Web 所用格式`预览（图 13-7）所示，因为我正在以
    `PNG-32` 文件格式导出。


    ![A978-1-4842-4060-1_13_Fig7_HTML.jpg](img/A978-1-4842-4060-1_13_Fig7_HTML.jpg)


    图 13-7.

    选择 `PNG-24` 和`透明度`以创建 `PNG-32`


    如果你勾选`透明度`选项，如图 13-7 所示，Alpha 通道将显示为棋盘格图案，就像在 Photoshop 中一样。如果你不选择此选项，导出的图像将使用白色背景。


    此时，你可能在暗自思忖：如果我在选择`存储为 Web 所用格式`之前，让`投影图层`样式保持选中状态会怎么样呢？我们接下来就会探讨这个问题，看看 Photoshop
    是否会自动将 `FX` 设置对话框中的透明度数据放入 alpha 通道中。我相信你会对结果感到满意！


    为了观察一下，请点击选中你的`投影效果`可见性眼睛图标，并重新打开 `RingElement` 投影效果，如图 13-8 屏幕右侧灰色（选中）的 `RingElement`
    图层下方所示。


    ![A978-1-4842-4060-1_13_Fig8_HTML.jpg](img/A978-1-4842-4060-1_13_Fig8_HTML.jpg)


    图 13-8.

    为了给 `PNG32` 添加投影，请点击选中你的`投影效果`可见性图标


    正如你在图 13-9 的`存储为 Web 所用格式`对话框中所见，投影具有你所期望的微妙透明度，因此这个透明对象确实会携带其自身的阴影。


    ![A978-1-4842-4060-1_13_Fig9_HTML.jpg](img/A978-1-4842-4060-1_13_Fig9_HTML.jpg)


    图 13-9.

    要创建 `PNG-32`，请选择 `PNG-24` 和`透明度`


    如果你打算创建额外的特效，请务必在图像尺寸的底部增加十几个像素的高度，这样投影效果的底部就不会被裁切掉。


    正如你已了解到的，这应该通过使用`画布大小`功能来实现，而不是使用`图像大小`功能（后者会缩放图像，只会使被裁切的阴影伪影（错误）变得更大、更明显）。


    使用`画布大小`会使画布变大，以便投影特效的底部有足够的空间（像素）来渲染完整的投影，包括使其看起来更逼真的淡出部分。


    现在我们准备来看看 GIMP 的 `文件 ➤ 导出为`工作流程，这与 Photoshop 的差别很大。


    ## GIMP 优化：文件 ➤ 导出为


    在 GIMP 中，保存文件或“导出”文件远没有在 Photoshop 中那么直观。然而，如果你了解 GIMP 文件导出系统的工作原理，就可以通过使用 GIMP
    的 `文件 ➤ 导出为`菜单序列，完成你可以在 Photoshop 中实现的几乎任何操作。


    让我们打开 `Chapter12compositing.xcf` 文件（如图 13-10 所示），来看看文件导出在 GIMP 中是如何工作的。然后，按照 `文件
    ➤ 导出为`菜单序列操作，调出`导出图像`对话框，该对话框与任何标准操作系统的`文件保存`对话框非常相似，只是它的按钮上写着`导出`，而不是`保存`。


    ![A978-1-4842-4060-1_13_Fig10_HTML.jpg](img/A978-1-4842-4060-1_13_Fig10_HTML.jpg)


    图 13-10.

    要在 GIMP 中调出`导出图像`对话框，请使用 `文件 ➤ 导出为`菜单序列


    如果在 GIMP 中使用 `文件 ➤ 保存`或 `文件 ➤ 另存为`，你将保存 GIMP 图像合成项目本身，该项目使用 `.XCF` 文件扩展名，这是 GIMP
    的原生格式，在许多（甚至任何）其他平台上都不受支持，即使是诸如 `HTML5`、`Java`、`JavaFX` 或 `Android Studio` 这样的开源平台也不例外。


    `导出图像`对话框将根据`文件名`扩展名选择图像文件格式编解码器。我们将 `PNG-24` 格式文件命名为 `Chapter12compositing.png`，如图
    13-11 中高亮显示的那样。


    ![A978-1-4842-4060-1_13_Fig11_HTML.jpg](img/A978-1-4842-4060-1_13_Fig11_HTML.jpg)


    图 13-11.

    要在 GIMP 中导出文件，请输入 `filename.png`，选择所需的选项，然后点击`导出`按钮


    GIMP 判断是使用 `PNG-24` 还是 `PNG-8` 的方式是查看合成的`颜色模式`设置，我们在第 5 章中介绍过，它位于`图像`菜单下的`模式`子菜单中。


    一旦你点击`导出`按钮，它将打开`文件格式选项`对话框——在这个例子中是`将图像导出为 PNG`——允许你选择要使用的选项和`压缩级别`，如图 13-11
    右下角所示。


    如图所示，我选择了`保存透明像素的颜色值`，并将压缩级别设为最高值 `9`，其他选项保持未选中状态，以节省文件的数据占用空间，因为我正在使用的数字图像合成应用程序不需要这些选项。


    注意图 13-11 的右下角，你还可以保存和加载默认设置，因此，如果你有某些选项组合，可以酌情使用唯一的文件名保存它们。这样，在图像数据占用优化工作流程的这个阶段，你就不必每次都勾选选项复选框了。


    要将文件保存为 `GIF`，只需将扩展名更改为 `.gif` 并点击`导出`按钮。如果你正在使用`真彩色`模式，GIMP 会将文件转换为索引颜色，并弹出`将图像导出为
    GIF` 设置对话框，如图 13-12 所示。我也得到了这个错误对话框，如图右上角所示，所以我选择了`裁剪`选项来修剪未使用的透明区域。


    ![A978-1-4842-4060-1_13_Fig12_HTML.jpg](img/A978-1-4842-4060-1_13_Fig12_HTML.jpg)


    图 13-12.

    要将文件保存为 `GIF`，请输入 `filename.gif`，选择所需的选项，然后点击`导出`


    如果你想将文件保存为 `JPEG`，请将扩展名更改为 `.jpg`，点击`导出`按钮，然后在`将图像导出为 JPEG` 对话框（如图 13-13 右侧所示）中设置选项。勾选`在图像窗口中显示预览`复选框，即可像使用
    Photoshop 的`存储为 Web 所用格式`功能时那样（也需要）预览你的设置效果。


    ![A978-1-4842-4060-1_13_Fig13_HTML.jpg](img/A978-1-4842-4060-1_13_Fig13_HTML.jpg)


    图 13-13.

