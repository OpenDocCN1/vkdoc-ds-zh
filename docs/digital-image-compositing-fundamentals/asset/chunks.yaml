    **图 10-10.** 要在`RingElement`下方创建新图层，首先选择`Niki Black & White`图层，然后使用 **Layer ➤
    New Layer** 菜单序列


    请注意，由于数字成像软件的模态操作，选区独立于图层存在，因此你可以从`RingElement`图层获取（或提取）此选区，然后在选择`RingShadow`图层后填充它。


    这是一个展示模态操作如何强大的例子，也是一个如何创造性地利用它的例子。


    现在，选择你的新`RingShadow`图层（如图 10-11 所示），并使用 **Edit ➤ Fill with FG Color** 菜单序列，用纯黑色填充与`RingElement`相同的区域（尽管在其下方）。你会注意到你的圆环将恢复为蓝色金属色，因为黑色现在会遮挡`Niki`图层的像素颜色。目前无需使用
    **Difference** 模式，因此现在我打算将此模式设置改回 **Normal**，直到稍后在此模态操作密集的工作流程中解决这个问题。


    ![A978-1-4842-4060-1_10_Fig11_HTML.jpg](img/A978-1-4842-4060-1_10_Fig11_HTML.jpg)


    **图 10-11.** 要用黑色填充新图层上的选区，选择你的新`RingShadow`图层，并使用 **Edit ➤ Fill with FG Color**
    菜单序列


    现在我们可以使用 GIMP 强大的模糊功能之一，在蓝色圆环下方创建逼真的投影效果。


    由于你已经使用过 **Gaussian Blur**，让我们使用另一个 GIMP 模糊算法，如图 10-12 中间的子菜单所示。


    ![A978-1-4842-4060-1_10_Fig12_HTML.jpg](img/A978-1-4842-4060-1_10_Fig12_HTML.jpg)


    **图 10-12.** 使用 **Motion Blur** 算法时，按照 **Filter ➤ Blur ➤ Motion Blur** 顺序操作，并将
    **Length** 设置为 12

