- fmt: '# Modal Operation: The GIMP Example


    打开`Chapter9usingModes.xcf`文件，选择`RingElement`图层和`Fuzzy Select`工具。点击圆环内部创建你在Photoshop中创建的选区，如图[10-5](#A978-1-4842-4060-1_10_Chapter.html#Fig5)所示。


    ![A978-1-4842-4060-1_10_Fig5_HTML.jpg](A978-1-4842-4060-1_10_Fig5_HTML.jpg)


    **图10-5.** 使用`Fuzzy Select`工具选择`RingElement`图层，启动GIMP模态操作


    然后，使用GIMP的**Select ➤ Grow**菜单序列访问**Grow Selection**对话框，输入9像素的值，就像你在Photoshop中所做的那样。点击**OK**按钮，你将获得可作为图层蒙版使用的蒙版选区。


    由于此选区使圆环外部变为黑色（透明），而你希望圆环内部透明，请使用GIMP的**Select ➤ Invert**菜单序列，如图[10-6](#A978-1-4842-4060-1_10_Chapter.html#Fig6)所示。


    ![A978-1-4842-4060-1_10_Fig6_HTML.jpg](A978-1-4842-4060-1_10_Fig6_HTML.jpg)


    **图10-6.** 要使圆环内部透明而非外部，选择`Niki Black & White`图层并反转选区


    如果你希望圆环内部显示黑白版本的`Niki.png`而非彩色版本，则保持选区不变，因为此时无需反转。


    现在，我们准备为黑白`Niki.png`图层添加图层蒙版，这将允许彩色`Niki.png`图层透显。这正是你的Photoshop调整图层蒙版所做的事情，但它是在系统内存中“幕后”进行的，而不是像你在GIMP中这样在图层调板中显式操作。不同的工作流程，相同的结果。


    ## GIMP图层蒙版：添加图层蒙版


    要为`Niki Black & White`图层添加图层蒙版，以便`Niki.png`（彩色）图层透显，你需要选择`Niki Black & White`图层进行此模态操作，然后右键单击它。你还需要选择**Add
    Layer Mask**菜单选项（如图[10-7](#A978-1-4842-4060-1_10_Chapter.html#Fig7)所示），以及其弹出工具提示和**Add
    Layer Mask**对话框中的**Selection**选项，然后点击**Add**按钮。这将把当前活动选区作为图层蒙版添加到你的`Niki Black
    & White`图层。


    ![A978-1-4842-4060-1_10_Fig7_HTML.jpg](A978-1-4842-4060-1_10_Fig7_HTML.jpg)


    **图10-7.** 要使`Niki.png`彩色图层透显，选择`Niki Black & White`图层，然后选择**Add Layer Mask**


    图层蒙版随后将允许部分`Niki.png`彩色像素数据从其上方的图层透显出来，如图[10-8](#A978-1-4842-4060-1_10_Chapter.html#Fig8)所示。


    ![A978-1-4842-4060-1_10_Fig8_HTML.jpg](A978-1-4842-4060-1_10_Fig8_HTML.jpg)


    **图10-8.** 图层蒙版揭示`Niki.png`图层的像素颜色数据


    请注意，如果你选择了任何其他图层，然后执行相同的**Add Layer Mask**工作流程，你将无法得到期望的结果。


    为了完成GIMP对你在Photoshop图像合成中所做操作的模拟，你需要为`RingElement`添加投影。这将为你提供更多体验模态操作的机会。让我们来了解一下GIMP的图层、工具、选项、选区、蒙版、模式和工作流程。


    ## GIMP特殊效果：创建圆环投影


    我差点忘了将`RingElement`的混合模式更改为**Difference**，所以我现在就做。混合模式不影响实际像素数据，因此无论我们将该图层设置为使用什么模式，你仍然可以创建投影效果以将其与下面的图层合成。


    如图[10-9](#A978-1-4842-4060-1_10_Chapter.html#Fig9)顶部所示，我已将模式设置为**Difference**并选择了`RingElement`图层，以便从其透明区域获取选区集。这将通过GIMP中的**Alpha
    to Selection**功能完成。


    ![A978-1-4842-4060-1_10_Fig9_HTML.jpg](A978-1-4842-4060-1_10_Fig9_HTML.jpg)


    **图10-9.** 选择`RingElement`图层和**Alpha to Selection**


    要访问此功能，请右键单击所选图层。在上下文相关菜单的底部，你应该会看到**Alpha to Selection**选项。如果选择此项，GIMP将选择你的圆环元素所占用的区域。


    工作流程（模态操作序列）的下一步是在`RingElement`下方创建一个新图层，我们将其命名为`RingShadow`，以容纳投影像素。


    这需要添加到`RingElement`图层的下方，因为阴影逻辑上应位于圆环元素的下方。


    要创建它，请选择`RingElement`下方的一个图层——对于此合成，它将是`Niki Black & White`图层——然后按照**Layer ➤ New
    Layer**菜单序列操作，如图[10-10](#A978-1-4842-4060-1_10_Chapter.html#Fig10)所示，并将其命名为`RingShadow`。


    ![A978-1-4842-4060-1_10_Fig10_HTML.jpg](A978-1-4842-4060-1_10_Fig10_HTML.jpg)


    **图10-10.** 要在`RingElement`下方创建新图层，首先选择`Niki Black & White`图层，然后使用**Layer ➤ New
    Layer**菜单序列


    请注意，由于数字成像软件的模态操作，选区独立于图层存在，因此你可以从`RingElement`图层获取（或提取）此选区，然后在选择`RingShadow`图层后填充它。


    这是一个展示模态操作如何强大的例子，也是一个如何创造性地利用它的例子。


    现在，选择你的新`RingShadow`图层（如图[10-11](#A978-1-4842-4060-1_10_Chapter.html#Fig11)所示），并使用**Edit
    ➤ Fill with FG Color**菜单序列，用纯黑色填充与`RingElement`相同的区域（尽管在其下方）。你会注意到你的圆环将恢复为蓝色金属色，因为黑色现在会遮挡`Niki`图层的像素颜色。目前无需使用**Difference**模式，因此现在我打算将此模式设置改回**Normal**，直到稍后在此模态操作密集的工作流程中解决这个问题。


    ![A978-1-4842-4060-1_10_Fig11_HTML.jpg](A978-1-4842-4060-1_10_Fig11_HTML.jpg)


    **图10-11.** 要用黑色填充新图层上的选区，选择你的新`RingShadow`图层，并使用**Edit ➤ Fill with FG Color**菜单序列


    现在我们可以使用GIMP强大的模糊功能之一，在蓝色圆环下方创建逼真的投影效果。


    由于你已经使用过**Gaussian Blur**，让我们使用另一个GIMP模糊算法，如图[10-12](#A978-1-4842-4060-1_10_Chapter.html#Fig12)中间的子菜单所示。


    ![A978-1-4842-4060-1_10_Fig12_HTML.jpg](A978-1-4842-4060-1_10_Fig12_HTML.jpg)


    **图10-12.** 使用**Motion Blur**算法时，按照**Filter ➤ Blur ➤ Motion Blur**顺序操作，并将**Length**设置为12'
  raw: '## Modal Operation: The GIMP Example


    Open the `Chapter9usingModes.xcf` file and select the RingElement layer and Fuzzy
    Select tool. Click inside the ring to create the selection you created in Photoshop,
    as seen in Figure [10-5](#A978-1-4842-4060-1_10_Chapter.html#Fig5).


    ![A978-1-4842-4060-1_10_Fig5_HTML.jpg](A978-1-4842-4060-1_10_Fig5_HTML.jpg)


    Figure 10-5.


    Start the GIMP modal operation by selecting the RingElement Layer using the Fuzzy
    Select tool


    Then, use GIMP’s Select ➤ Grow menu sequence to access a Grow Selection dialog
    and enter a value of 9 pixels, just like you did in Photoshop. Hit the OK button,
    and you will have your mask selection ready to use as a layer mask.


    Since this selection makes the outside of the ring black (transparent), and you
    want the inside of your ring to be transparent, use GIMP’s Select ➤ Invert menu
    sequence, as shown in Figure [10-6](#A978-1-4842-4060-1_10_Chapter.html#Fig6).


    ![A978-1-4842-4060-1_10_Fig6_HTML.jpg](A978-1-4842-4060-1_10_Fig6_HTML.jpg)


    Figure 10-6.


    To make the inside of the ring transparent rather than the outside, select the
    Niki Black & White layer and invert the selection


    If you want a black-and-white Niki.png version to be inside of the RingElement
    instead of the color version, then leave the selection as is, as you do not then
    need to invert it.


    Now we’re ready to add a layer mask to the black-and-white Niki.png layer, which
    will allow a color Niki.png layer to show through. This is precisely what your
    Photoshop adjustment layer mask was doing, but it was doing it “under the hood”
    in system memory, rather than up-front in the Layers palette, as you are doing
    here in GIMP. Different work process, same end result.


    ### GIMP Layer Mask: Adding a Layer Mask


    To add a layer mask to the Niki Black & White layer, so that the Niki.png (color)
    layer will show through, you’ll need to select the Niki Black & White layer for
    this modal operation and then right-click on it. You’ll also need to select the
    Add Layer Mask menu option, as shown in Figure [10-7](#A978-1-4842-4060-1_10_Chapter.html#Fig7),
    along with its pop-up tool tip and the Selection option in the Add Layer Mask
    dialog and then click the Add button. This will add the currently active selection
    as the Layer Mask for your Niki Black & White layer.


    ![A978-1-4842-4060-1_10_Fig7_HTML.jpg](A978-1-4842-4060-1_10_Fig7_HTML.jpg)


    Figure 10-7.


    To get the Niki.png color layer to show through, select the Niki Black & White
    Layer and then Add Layer Mask


    The layer mask will then allow a portion of the Niki.png color pixel data to show
    through the layer above it, as you can see in Figure [10-8](#A978-1-4842-4060-1_10_Chapter.html#Fig8).


    ![A978-1-4842-4060-1_10_Fig8_HTML.jpg](A978-1-4842-4060-1_10_Fig8_HTML.jpg)


    Figure 10-8.


    Layer Mask revealing Niki.png Layer pixel color data


    Note that if you have any other layer selected, and then perform the same Add
    Layer Mask work process, you won’t get the desired end result.


    To complete the GIMP simulation of what you have done in your Photoshop image
    composite, you need to add a drop shadow to your RingElement. This will give you
    more opportunity to experience modal operation. Let’s go through GIMP layers,
    tools, options, selections, masks, modes, and work processes.


    ### GIMP Special Effects: Creating a Ring Drop Shadow


    I almost forgot to change the RingElement blending mode to Difference, so I will
    do that now. The blending mode does not affect the actual pixel data, so regardless
    of what mode we may have that layer set to utilize, you can still create your
    drop shadow effect to composite it with the layers underneath it.


    As you can see at the top of Figure [10-9](#A978-1-4842-4060-1_10_Chapter.html#Fig9),
    I have set the Mode to Difference and selected the RingElement layer so that I
    can cull a selection set from its transparency areas. This will be accomplished
    using the Alpha to Selection function in GIMP.


    ![A978-1-4842-4060-1_10_Fig9_HTML.jpg](A978-1-4842-4060-1_10_Fig9_HTML.jpg)


    Figure 10-9.


    Select a RingElement layer and Alpha to Selection


    To access this feature, right-click on a selected layer. At the bottom of the
    context-sensitive menu, you should see the Alpha to Selection option. If you select
    this, GIMP will select the area occupied by your ring element.


    The next step in your work process (your modal operation sequence) is to create
    a new layer underneath RingElement, which we will call RingShadow, in which to
    hold your drop shadow pixels.


    This needs to be added underneath your RingElement layer, as a shadow logically
    would be underneath the ring element.


    To create it, select a layer underneath RingElement—for this composite, it would
    be the Niki Black & White layer—and follow your Layer ➤ New Layer menu sequence,
    as seen in Figure [10-10](#A978-1-4842-4060-1_10_Chapter.html#Fig10), and name
    it RingShadow.


    ![A978-1-4842-4060-1_10_Fig10_HTML.jpg](A978-1-4842-4060-1_10_Fig10_HTML.jpg)


    Figure 10-10.


    To create a new layer underneath the RingElement, start by selecting the Niki
    Black & White layer and use Layer ➤ New Layer menu sequence


    Notice that, due to the modal operation of the digital imaging software, the selection
    exists independently of the layer, so you can cull, or pull, if you prefer, this
    selection from the RingElement layer, and then fill it once you have selected
    your RingShadow layer.


    This is an example of how modal operation can be powerful, as well as how to leverage
    it creatively.


    Now, select your new RingShadow Layer, shown as selected in Figure [10-11](#A978-1-4842-4060-1_10_Chapter.html#Fig11),
    and use the Edit ➤ Fill with FG Color menu sequence to fill the same area as the
    RingElement (albeit underneath it) with a flat black area of color. You will notice
    that your ring will turn back to being its blue metal color, as the black will
    now block the pixel color from the Niki layers. There is currently no need to
    use the Difference mode, so for now I’m going to change this mode setting back
    to Normal, until we address this problem a bit later on, during this modal operation
    heavy work process.


    ![A978-1-4842-4060-1_10_Fig11_HTML.jpg](A978-1-4842-4060-1_10_Fig11_HTML.jpg)


    Figure 10-11.


    To fill the selection on your new layer with a black color, select your new Ring
    Shadow Layer and use the Edit ➤ Fill with FG Color menu sequence


    Now we can use one of GIMP’s powerful blur functions and create a realistic drop
    shadow effect underneath the blue ring.


    Since you have already utilized the Gaussian Blur, let’s use one of the other
    GIMP Blur algorithms, which can be seen on the submenu shown in the middle of
    Figure [10-12](#A978-1-4842-4060-1_10_Chapter.html#Fig12).


    ![A978-1-4842-4060-1_10_Fig12_HTML.jpg](A978-1-4842-4060-1_10_Fig12_HTML.jpg)


    Figure 10-12.


    When using your Motion Blur algorithm, follow the Filter ➤ Blur ➤ Motion Blur
    sequence and set the Length to 12'
