  trans: '

    ### 选区编辑：利用 Alpha 通道编辑选区


    正如你在第 6 章（图 6-2）中所见，Alpha 通道可用于存储已蒙版的对象，以便日后需要时轻松将其选中。有趣的是，你还可以利用数字图像编辑软件提供的所有图像编辑和合成工具，来编辑这些黑白
    Alpha 通道像素。


    让我们在蒙版工作流程中充分利用这一点，使用如图 7-5 所示的 `保存选区` 对话框，将目前使用 `魔术棒` 工具所做的操作转换为 Alpha 通道数据。相比在逐渐缩小的像素选区内尝试
    `Shift` 单击，使用图像编辑工具可能能让你更快速地优化此蒙版！


    ![A978-1-4842-4060-1_7_Fig5_HTML.jpg](img/A978-1-4842-4060-1_7_Fig5_HTML.jpg)


    **图 7-5.** 你可以在 `保存选区` 对话框中将 Alpha 通道保存为类似 `BirdSelection` 的名称


    如图所示，Photoshop 中此操作的菜单路径为 `选择 ➤ 保存选区`。你可以将 Alpha 通道命名为类似 `BirdSelection` 的名称，然后点击
    `确定` 按钮创建新的 Alpha 通道，该通道将包含 `魔术棒` 工具在蒙版工作过程中迄今为止为你创建的选区数据（灰度）。


    要查看此 Alpha 通道，请选择你的 `通道` 面板选项卡，如图 7-6 右侧所示，点击 `BirdSelection` Alpha 通道的可见性图标（一个眼睛图标），并利用位于
    `通道` 面板顶部的 `RGB` 主通道，关闭颜色通道的可见性图标。


    ![A978-1-4842-4060-1_7_Fig6_HTML.jpg](img/A978-1-4842-4060-1_7_Fig6_HTML.jpg)


    **图 7-6.** 你可以在 `通道` 面板中选择 `BirdSelection` 进行编辑


    `通道` 面板顶部的这个 `RGB` 通道是一个便捷（汇总）通道，当选中它时，将同时作用于红色、绿色和蓝色通道。我将其称之为汇总操作，因为它以完全相同的方式将任何工具或算法应用于这三个颜色通道。在此案例中，对当前选中的图像合成图层来说，这恰好是对其像素颜色数据进行可见性选择，或者更精确地说，是取消可见性选择。


    你可以使用任何编辑工具来清理黑色鸟形轮廓外部的黑色区域，包括橡皮擦或画笔工具（设置为使用白色）。清除大面积黑色区域最快的方法是，在你想要移除的区域上画一个矩形，从而选中该区域，如图
    7-7 所示。然后，在将 `填充` 内容设置为 `白色` 颜色值后，使用 `编辑 ➤ 填充` 菜单序列。


    ![A978-1-4842-4060-1_7_Fig7_HTML.jpg](img/A978-1-4842-4060-1_7_Fig7_HTML.jpg)


    **图 7-7.** 要移除大面积黑色区域，请选中内容并前往 `编辑 ➤ 填充 ➤ 白色`


    你可以使用 `填充`、`橡皮擦` 或 `画笔` 工具，清除黑色鸟形轮廓外部的所有黑色像素，从而在黑色和白色像素之间创建清晰的界限，如图 7-8 所示。


    ![A978-1-4842-4060-1_7_Fig8_HTML.jpg](img/A978-1-4842-4060-1_7_Fig8_HTML.jpg)


    **图 7-8.** 蒙版外部清理干净后，使用 `图像 ➤ 反相`


    一旦通用蒙版区域清理完毕，你需要对选区进行反相。这样就会选中鸟——目前，除了鸟本身之外的所有内容都被选中了，因为这是进行蒙版的简便方法：反向操作。在数字图像处理中，处理工作流程的最佳方式有时可能恰好与你原本认为的最佳方法相反！蒙版就是一个完美的例子：你先选中不想要的部分，然后翻转（反相）选区，从而抓取你想要的部分！


    `反相` 功能可以通过 `图像 ➤ 调整 ➤ 反相` 菜单序列找到，如图 7-8 左上角蓝色高亮显示。


    反相选区后，就进入了蒙版编辑的微调阶段。在此阶段，你将开始处理蒙版的边缘。蒙版的边缘是其最重要的区域，因为边缘质量将影响你蒙版的感知质量。当你将蒙版对象用于某个数字图像合成图层，以将此蒙版的像素与合成图像中其他图层的像素合并时，这一点至关重要。

    '
- fmt: '### Mask Fine-Tuning: Alpha Edge Editing Techniques


    The next step in the mask creation work process is to perfect the edge between
    the white (opaque) and the black (transparent) areas of your mask. This is the
    anti-aliasing of the mask, and if you selected the `Anti-alias` option in the
    `Magic Wand` tool, there may already be some of this in place in the algorithmic
    mask. If you didn’t select this option, there will only be black and white pixels
    along the edges of your mask. Let’s use the zoom (magnifying glass) tool, and
    see if there are any gray pixels. These gray pixels will provide a mask with “real-time”
    color blending (using anti-aliasing) between the subject matter (bird), and any
    background image that you may wish to composite the object on top of later on,
    since these define transparency.


    As you can see in Figure [7-9](#A978-1-4842-4060-1_7_Chapter.html#Fig9), the mask
    has been inverted and there are indeed gray pixels along the edges providing this
    antialiasing function. To create this image, I zoomed into the slightly curved
    area on a “clean” edge along the bottom portion of the bird’s tail. As you can
    see in the tab, I zoomed in 700% so that you could see the edge pixels and the
    anti-aliasing.


    ![A978-1-4842-4060-1_7_Fig9_HTML.jpg](A978-1-4842-4060-1_7_Fig9_HTML.jpg)


    **Figure 7-9.** You can zoom into the edge of the mask to see antialiasing.


    Now, let’s zoom back out, by using the `View ➤ 100%` menu sequence, and turn on
    the `Mask Overlay` feature in Photoshop CS. This is done by clicking the `Eye`
    icon, next to the `RGB` channel.


    This will tint a red value over the transparent areas in the mask, as is seen
    in Figure [7-10](#A978-1-4842-4060-1_7_Chapter.html#Fig10). The tint will allow
    you to edit the mask while also seeing the image that you are masking, so that
    the image that you are masking can be used as a guide.


    ![A978-1-4842-4060-1_7_Fig10_HTML.jpg](A978-1-4842-4060-1_7_Fig10_HTML.jpg)


    **Figure 7-10.** Select the `RGB` channel’s `Eye` icon to turn on the mask.


    As you can see in Figure [7-11](#A978-1-4842-4060-1_7_Chapter.html#Fig11), I used
    a `Brush` tool, with a 13-pixel fuzzy edge, and zoomed in 400 percent to fix the
    top edge and back of the bird’s tail, which, as you can see, needed some work,
    in terms of fine-tuning the edge conformance of this mask to the bird object.


    ![A978-1-4842-4060-1_7_Fig11_HTML.jpg](A978-1-4842-4060-1_7_Fig11_HTML.jpg)


    **Figure 7-11.** To edit the edge of the bird’s tail, use the 13-pixel fuzzy brush
    and zoom in.


    You can turn this red masking color aid on and off using the `RGB` channel `Eye`
    icon. You will do this as you work, so that you can see the actual mask itself.


    You can also work in black-and-white mode, without this mask overlay, to make
    sure the mask is all black and all white, with gray anti-aliasing pixels along
    the edges between the two colors.


    This is typically how masking artists work; they use the red mask overlay guide
    to get an image of how the mask is progressing, and then turn it off to work with
    the high contrast black and white representation as it is easier to see what you
    are doing in areas of the mask other than the edges.


    You should spend as much time perfecting the mask as you need to get the result
    you want. Keep in mind, like everything else, it takes a lot of practice to become
    a professional compositor! It’s important to note that although we used a 484-by-372
    resolution sample image to look at this masking process, using a higher resolution
    image for your masking process will almost always yield a higher quality image
    compositing result. The individual pixel size, relative to the entire image, is
    a smaller ratio (percent), so edges and anti-aliasing is finer.


    The equivalent of the `Magic Wand` tool in GIMP is the `Fuzzy Select` tool. Since
    it works in an extremely similar way in both programs, I have decided to instead
    show you how to pull masks in GIMP by using another innovative algorithm that
    takes a different approach. This algorithm can be implemented by using the `Scissors
    Select` tool.


    ### GIMP Scissors Tool: Intelligent Masking Algorithm


    To access the `Scissors Select` tool, open the `MaskExercise.png` PNG24 digital
    image file in GIMP using the `File ➤ Open` menu sequence. Then, select the `Scissors`
    tool icon, shown on the top right side of the screen in Figure [7-12](#A978-1-4842-4060-1_7_Chapter.html#Fig12),
    and click the edge of the object you want to extract (cut out with these digital
    scissors) to start the outline you are going to be laying down. When you click
    a second point on the object, the `Scissors Select` tool will apply its edge detection
    algorithm. This can be seen at the top of the bird’s head in Figure [7-12](#A978-1-4842-4060-1_7_Chapter.html#Fig12).


    ![A978-1-4842-4060-1_7_Fig12_HTML.jpg](A978-1-4842-4060-1_7_Fig12_HTML.jpg)


    **Figure 7-12.** To extract an object from an image, open the image, select the
    `Scissor` tool, and click on its edge. Clicking it a second time enables edge
    detection.


    If you select the `Interactive Boundary` option, as shown, checked off in the
    lower-left-hand side of the screen in Figure [7-13](#A978-1-4842-4060-1_7_Chapter.html#Fig13),
    an edge detection algorithm will recalculate in real time as you adjust the points
    on your selection outline to refine the mask nodes.


    ![A978-1-4842-4060-1_7_Fig13_HTML.jpg](A978-1-4842-4060-1_7_Fig13_HTML.jpg)


    **Figure 7-13.** Click along the edge of your object to create an outline.


    The `Scissors` tool is like an intelligent spline that automatically looks behind
    itself and conforms its curvature as it travels between points (I call them nodes
    for the tool) and sets the tension handles (the curvature in and out of each node).
    You can even refine node positions to adjust the curves!'
