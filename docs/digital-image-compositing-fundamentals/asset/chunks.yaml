- fmt: '# 8. The Organization of Digital Imaging: Using Layers


    Now that you have learned how to mask objects for use in your digital image compositing
    pipelines, the next logical step is to learn how to leverage the Layers palette
    to organize your digital image compositing projects. Layers allow you to isolate
    masked objects as well as to apply imaging special effects to individual layers
    and your digital image backplate—that is, the foundational background image upon
    which your digital image composite is based.


    Originally, in early digital imaging software revisions, layers were just used
    to isolate masked objects, in the same way that vellum on an overhead projector
    allows you to add to your presentations. The layer was solely designed to hold
    image compositing components. At a certain point in the development cycle, developers
    started adding other cool features to layers, making them an order of magnitude
    more powerful.


    I have included this chapter covering the Layers palette since at this point,
    using layers will enable you to do a whole lot more than just organizing your
    digital image compositing! Indeed, one could write an entire book just on using
    the Layers palette, since it is now packed with so many features, as you will
    see during the remainder of this book.


    `Photoshop` and `GIMP` both support a plethora of cool layer organization tools,
    which can be used to organize very complex digital image compositing pipelines
    and create special effects constructs, as you will see over the next five chapters.


    Because `Photoshop` is especially adept when it comes to using layers, allowing
    you to implement all manner of imaging matriculations and special effects, we
    will spend a bit more time looking this program’s layer features, and then take
    a gander at the impressive features that `GIMP 2.8.14` supports.


    Hopefully, `GIMP 3.0` will add some of the powerful layer features that `Photoshop
    CS6` currently offers, specifically the adjustment layer concept that gives you
    the ability to perform a digital image pixel adjustment, in the form of an adjustment
    layer, complete with non-destructive settings that can later be changed by editing
    the adjustment layer itself!


    You’ll be learning all about `Photoshop` adjustment layers during the course of
    this chapter. Let’s get started—we have a lot to cover! Layers and layers of relevant
    imaging information in fact, and no pun intended!


    ## Layer Differentiation: `Photoshop` vs. `GIMP`


    One of the areas where `Photoshop` and `GIMP` differ the most as far as features
    are concerned is in the area of Layers. If you are really serious about digital
    image editing or compositing, chances are you will pay the $10 per month to get
    `Photoshop CS`, or have one of your clients pay the $120 annual stipend as part
    of your project contract. `GIMP 2.8` has enough layer features to perform professional
    digital image compositing, but `Photoshop CS` has some special effects application
    features that make tweaking results or changing something at the client’s request
    significantly easier. `GIMP 3.0` will be adding significant power and features
    in 2016 after these are tested out in version 2.9.


    ### `Photoshop` Layers: Organization and Effects


    As you will see if you drop down `Photoshop`’s `Layer` menu, shown in Figure [8-1](#A978-1-4842-4060-1_8_Chapter.html#Fig1),
    there are a plethora of layer organization, masking, and digital imaging algorithms
    (called “adjustments”). I will be focusing on the `New` and `New Adjustment Layer`
    submenus in this chapter, as there is not enough time or pages to cover everything
    that `Photoshop` offers via its `Layers` palette. It’s another one of those topics
    that could make up its own book, as there are fill layers, video layers, Smart
    objects, layer styles, and even a feature that does your web slicing for you!


    ![A978-1-4842-4060-1_8_Fig1_HTML.jpg](A978-1-4842-4060-1_8_Fig1_HTML.jpg)


    Figure 8-1.


    `Photoshop` `Layer` menu offers many advanced features


    We will be looking at those layer features that are most often used in your digital
    image compositing work process over the course of this chapter. These include
    a new layer creation, duplicating layers, grouping layers, naming layers, merging
    layers, adjustment layers, and deleting layers. I’ll show you how to access a
    number of these commands in multiple places in the software, both in this chapter
    as well as in subsequent chapters during the rest of the book.


    To get the empty `Layer 1` seen in Figure [8-1](#A978-1-4842-4060-1_8_Chapter.html#Fig1),
    I opened up `Photoshop` and used the `File ➤ New` menu sequence. This is how to
    create your empty digital image compositing pipeline.


    I will show you the `Layer` menu in `GIMP` next, so that we cover both software
    packages, which I am trying to do in each chapter over the course of this book.


    ### `GIMP` Layers: Organization and Masking


    To access the digital image compositing layers in `GIMP`, open the `GIMP` program
    and use the `File ➤ New` menu sequence to create a new empty digital image compositing
    document. To see how layer features compare with `Photoshop`, drop down `GIMP`’s
    `Layer` menu and `Mask` submenu, as shown in Figure [8-2](#A978-1-4842-4060-1_8_Chapter.html#Fig2).
    As you will see, `GIMP` has far fewer layer features than `Photoshop CS6`, but
    the core features needed for image compositing are all there. These are some of
    the layer features we will be covering in the chapter, as well as in subsequent
    chapters as we build on your knowledge of the software and learn new features.


    ![A978-1-4842-4060-1_8_Fig2_HTML.jpg](A978-1-4842-4060-1_8_Fig2_HTML.jpg)


    Figure 8-2.


    `GIMP` `Layer` menu and its `Mask` sub-menu


    Just like in `Photoshop`, these `GIMP` layer features can be accessed by using
    the `Layer` menu, or the context-sensitive menu system, which can be accessed
    by right-clicking on the layer itself, as a short-cut to make your work flow proceed
    faster.


    As you can see in Figure [8-2](#A978-1-4842-4060-1_8_Chapter.html#Fig2), `GIMP`
    allows you to create a `New Layer` or `New Layer Group` as well as to duplicate
    layers, merge layers down (together), anchor layers, and delete layers. We’ll
    be looking at compositing work processes that use these functions during the rest
    of the book, so you will see how they are used, even if we don’t specifically
    cover them during this particular chapter.


    You can also `Scale` your layer in `GIMP`, or change the `Layer Boundary Size`,
    to make the layer larger than the digital image it contains. You can also make
    the layer smaller than the image if the layer boundary is larger than its image,
    by using a `Layer to Image Size` option. There is also the `New from Visible`
    option, which merges layers marked as visible (where the eye icon is displayed)
    into a single (new) layer located at the top of the layer compositing stack so
    that it is at the top of your compositing rendering preview.


    As you can see in Figure [8-2](#A978-1-4842-4060-1_8_Chapter.html#Fig2), `GIMP`
    layers each use white as a background color. `GIMP` has a `Layer ➤ Mask` submenu
    allowing you to `Add Layer Mask` to get the transparency that you get as a default
    in `Photoshop`. There are also other layer mask functions (seen in gray) that
    become enabled once a `GIMP` layer has a mask associated with it. They include
    `Apply` (render to pixel), `Show`, `Delete`, `Edit`, and `Disable` (turn off temporarily)
    `Layer Mask`.


    As you can see, `GIMP` includes all the foundational layer support that you need
    to create and organize complicated image composites. Since the program’s composites
    work in much the same way as they do in `Photoshop`, let’s take a look at layer
    compositing in `Photoshop` first and look at `GIMP`’s layers later.'
