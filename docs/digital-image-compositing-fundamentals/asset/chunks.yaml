  trans: '

    # 8. 数字成像的组织：使用图层


    既然你已经学会了如何在数字图像合成流程中为对象创建蒙版，那么下一个合乎逻辑的步骤就是学习如何利用图层面板来组织你的数字图像合成项目。图层允许你将已添加蒙版的对象隔离开来，并将成像特效应用于单个图层和你的数字图像底板——即作为数字图像合成基础的底层背景图像。


    最初，在早期的数字图像软件版本中，图层仅用于隔离带蒙版的对象，就像投影仪上的描图纸可以让你在演示中添加内容一样。图层最初的设计目的仅仅是容纳图像合成组件。在开发周期的某个阶段，开发者开始为图层添加其他很酷的功能，使其功能变得强大一个数量级。


    我将本章内容安排为介绍图层面板，因为到目前为止，图层的作用远不止是组织你的数字图像合成！事实上，仅关于如何使用图层面板就可以写一整本书，因为它现在集成了如此多的功能，你将在本书的剩余部分中看到这一点。


    `Photoshop` 和 `GIMP` 都支持一系列很酷的图层组织工具，这些工具可用于组织非常复杂的数字图像合成流程并创建特效结构，你将在接下来的五章中看到这些内容。


    由于 `Photoshop` 在使用图层方面尤其擅长，能让你实现各种图像处理和特效，因此我们将花更多时间来研究这个软件的图层功能，然后看看 `GIMP 2.8.14`
    支持的那些令人印象深刻的功能。


    希望 `GIMP 3.0` 能增加一些 `Photoshop CS6` 当前提供的强大图层功能，特别是调整图层概念，它允许你以调整图层的形式执行数字图像像素调整，并附带非破坏性设置，随后可以通过编辑调整图层本身来更改这些设置！


    在本章中，你将全面学习 `Photoshop` 的调整图层。让我们开始吧——我们有很多内容要讲！实际上，是无数层相关的成像信息，绝无双关之意！


    ## 图层的差异：`Photoshop` 与 `GIMP`


    就功能而言，`Photoshop` 和 `GIMP` 差异最大的领域之一就是图层。如果你对数字图像编辑或合成非常认真，你很可能会每月支付 10 美元来获得
    `Photoshop CS`，或者让你的客户在你的项目合同中支付每年 120 美元的订阅费。`GIMP 2.8` 拥有足够的图层功能来执行专业的数字图像合成，但
    `Photoshop CS` 具有一些特效应用功能，使得调整结果或根据客户要求进行更改变得容易得多。`GIMP 3.0` 将在 2016 年（这些功能在 2.9
    版中测试之后）增加更多强大的功能和特性。


    ### `Photoshop` 图层：组织与特效


    如果你下拉 `Photoshop` 的 `图层` 菜单（如图 8-1 所示），你会看到大量的图层组织、蒙版和数字图像算法（称为“调整”）。本章我将重点介绍
    `新建` 和 `新建调整图层` 子菜单，因为没有足够的时间或篇幅来涵盖 `Photoshop` 通过其 `图层` 面板提供的所有功能。这是另一个可以自成一本专著的话题，因为它包含填充图层、视频图层、智能对象、图层样式，甚至还有一个为你进行网页切片的工具！


    ![A978-1-4842-4060-1_8_Fig1_HTML.jpg](img/A978-1-4842-4060-1_8_Fig1_HTML.jpg)


    图 8-1.


    `Photoshop` 的 `图层` 菜单提供了许多高级功能


    在本章中，我们将重点介绍那些在数字图像合成工作流程中最常用的图层功能。这些功能包括创建新图层、复制图层、图层编组、命名图层、合并图层、调整图层以及删除图层。我会在本章以及本书后续章节中，向你展示如何在软件的多个位置访问这些命令。


    为了得到图 8-1 中看到的空白 `图层 1`，我打开了 `Photoshop`，并使用 `文件 ➤ 新建` 菜单序列。这就是如何创建你的空白数字图像合成流水线的方法。


    接下来我将向你展示 `GIMP` 中的 `图层` 菜单，以便在本章的每一节中都涵盖这两个软件包。


    ### `GIMP` 图层：组织与蒙版


    要访问 `GIMP` 中的数字图像合成图层，请打开 `GIMP` 程序，并使用 `文件 ➤ 新建` 菜单序列创建一个新的空白数字图像合成文档。要了解其图层功能与
    `Photoshop` 的对比，请下拉 `GIMP` 的 `图层` 菜单及其 `蒙版` 子菜单（如图 8-2 所示）。正如你将看到的，`GIMP` 的图层功能远少于
    `Photoshop CS6`，但图像合成所需的核心功能一应俱全。这些内容将是我们本章以及后续章节中，在构建你对软件的知识并学习新功能时将要涵盖的部分图层功能。


    ![A978-1-4842-4060-1_8_Fig2_HTML.jpg](img/A978-1-4842-4060-1_8_Fig2_HTML.jpg)


    图 8-2.


    `GIMP` 的 `图层` 菜单及其 `蒙版` 子菜单


    和 `Photoshop` 一样，这些 `GIMP` 的图层功能可以通过 `图层` 菜单或右键单击图层本身唤出的上下文相关菜单系统访问，这是一条能让你工作流程更快的快捷方式。


    如图 8-2 所示，`GIMP` 允许你创建 `新建图层` 或 `新建图层组`，以及复制图层、向下合并图层、固定图层和删除图层。在本书的其余部分，我们将研究使用这些功能的合成工作流程，因此即使本章没有专门介绍它们，你也会了解它们是如何使用的。


    你还可以在 `GIMP` 中 `缩放` 图层，或更改 `图层边界大小`，使图层大于其包含的数字图像。如果图层边界大于其图像，你也可以使用 `图层适配图像大小`
    选项来使图层小于图像。此外还有 `从可见区域新建图层` 选项，它将标记为可见（显示眼睛图标）的图层合并到一个位于图层合成堆栈顶部的新图层中，使其位于合成渲染预览的顶端。


    如图 8-2 所示，`GIMP` 的每个图层默认都使用白色作为背景色。`GIMP` 有一个 `图层 ➤ 蒙版` 子菜单，允许你 `添加图层蒙版` 以获得 `Photoshop`
    中默认的透明度。一旦 `GIMP` 的图层关联了蒙版，其他图层蒙版功能（显示为灰色）就会被启用。这些功能包括 `应用`（渲染为像素）、`显示`、`删除`、`编辑`
    和 `禁用`（暂时关闭）`图层蒙版`。


    如你所见，`GIMP` 包含了创建和组织复杂图像合成所需的所有基础图层支持。由于该程序的合成工作方式与 `Photoshop` 非常相似，因此我们先来看看
    `Photoshop` 中的图层合成，稍后再研究 `GIMP` 的图层。

    '
- fmt: "## Using Layers in Photoshop: Compositing\n\nLet’s continue building the composite\
    \ we started in [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html). Begin by opening\
    \ the `Chapter6alphaChannels.psd` file and then use the `Layer` ➤ `New Layer`\
    \ menu sequence, shown in Figure [8-1](#A978-1-4842-4060-1_8_Chapter.html#Fig1),\
    \ to access the `New Layer` dialog shown in Figure [8-3](#A978-1-4842-4060-1_8_Chapter.html#Fig3).\
    \ Name the layer `TextLayer`, select `Color: None` (transparency) and `Mode: Normal`,\
    \ and finally, `Opacity: 100%`. You will be learning about modes in [Chapter 9](#A978-1-4842-4060-1_9_Chapter.html).\
    \ I wanted to show you how to add Text objects to your composite as a part of\
    \ this exercise, as it has many practical applications.\n\n![A978-1-4842-4060-1_8_Fig3_HTML.jpg](A978-1-4842-4060-1_8_Fig3_HTML.jpg)\n\
    \nFigure 8-3. Use `Layer` ➤ `New Layer` menu sequence and then `Name: TextLayer`\n\
    \nWe are now ready to take a look at the Photoshop CS Text tool, which is accessed\
    \ using the capital `T` in the lower part of the icon toolbar on the left side\
    \ of the screen. You have already used the Magic Wand tool for mask creation;\
    \ now you are going to explore some of the other tools.\n\n**Tip**  \nIf you click\
    \ any of these icons on the Photoshop toolbar at the left side of the screen,\
    \ and hold your mouse button down, a pop-up will appear, that shows other closely\
    \ related tools that you can select.\n\n### Adding a Text Object: Using the Vertical\
    \ Text Tool\n\nIn order to add a text object, click and hold the letter `T` icon\
    \ from the left toolbar, and select `Vertical Type Tool` from the drop-down menu\
    \ that will appear, as shown in Figure [8-4](#A978-1-4842-4060-1_8_Chapter.html#Fig4).\
    \ Make sure your `TextLayer` is still selected, and then click the top right in\
    \ your composite and type \"COMPOSITING\" using a gold color and 54-point Arial\
    \ Black font. As you can see at the top of the figure, you can set the font, style,\
    \ point size, anti-aliasing, justification, and color in the Text Tool Options\
    \ toolbar underneath your top menus.\n\n![A978-1-4842-4060-1_8_Fig4_HTML.jpg](A978-1-4842-4060-1_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4. In order to add a text object, click the letter `T` icon and select\
    \ the `Vertical Type Tool`, and then type, \"COMPOSITING\"\n\nTo fine-tune the\
    \ position of the Text object once you're done, click the Move tool (the top icon\
    \ on the toolbar) and use your arrow keys to move it by single pixels, or drag\
    \ the object with your mouse.\n\n### Special Effects Layers: Adding Effects to\
    \ the Text\n\nNext, let's add some drop shadowing to your Text object to make\
    \ it \"pop\" and add a bit of professionalism to your image composite. To do so,\
    \ right-click the `TextLayer` and select the `Blending Options` in the drop-down\
    \ menu that appears on the right-hand side of the screen, as is shown in Figure\
    \ [8-5](#A978-1-4842-4060-1_8_Chapter.html#Fig5).\n\n![A978-1-4842-4060-1_8_Fig5_HTML.jpg](A978-1-4842-4060-1_8_Fig5_HTML.jpg)\n\
    \nFigure 8-5. To add drop shadowing, right-click the `TextLayer` and select `Blending\
    \ Options` from the drop-down menu\n\nI like to use an Inner Shadow, as selected\
    \ on the left side of the screen of Figure [8-6](#A978-1-4842-4060-1_8_Chapter.html#Fig6),\
    \ to achieve shading on the text, giving it the effect that of being cut into\
    \ the image.\n\n![A978-1-4842-4060-1_8_Fig6_HTML.jpg](A978-1-4842-4060-1_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6. To shade your text, select the `Inner Shadow` option and set `Angle`\
    \ and `Size`\n\nTo do this, I set a 135-degree angle, 3 pixels for both `Size`\
    \ and `Distance`, an `Opacity` of 75%, the `Multiply Blend Mode`, zero pixels\
    \ of `Choke`, and an `Anti-aliased Contour`.\n\nIf you make sure the `Preview`\
    \ option on the right side of the dialog is selected, you can play around with\
    \ these settings and their effects will be rendered, in real-time, on your Text\
    \ object, so that you will be able to see your result and refine it in this settings\
    \ dialog until it is exactly what you wanted.\n\nOnce you click `OK`, you will\
    \ see your resulting Inner Shadow effect, as shown in Figure [8-7](#A978-1-4842-4060-1_8_Chapter.html#Fig7),\
    \ and notice that Photoshop is using a new sublayer to encapsulate the settings.\
    \ This is the use of layers that I was referring to earlier when I discussed using\
    \ a layer paradigm to contain special-effects settings and visibility. As you\
    \ can see, you can edit these settings at any time (try it!) or preview the effect\
    \ using the layer visibility (eye) icons.\n\n![A978-1-4842-4060-1_8_Fig7_HTML.jpg](A978-1-4842-4060-1_8_Fig7_HTML.jpg)\n\
    \nFigure 8-7. To turn the `Inner Shadow` effect on and off, toggle the eye icons\n\
    \nIf you click the eye icons next to the Inner Shadow effects, you will see that\
    \ you can turn just this effect on and off. This enhances the modal nature of\
    \ the digital image compositing software and allows everything to be composed\
    \ as separate items, or what I like to call \"moves,\" within the layer stack,\
    \ or \"compositing pipeline.\"\n\n### Adjustment Layer: Adjusting Image Characteristics\n\
    \nLet's now take a look at a unique type of layer in Photoshop called the Adjustment\
    \ layer. An \"adjustment\" in Photoshop is a change that a photographer would\
    \ make to the digital imagery. This might include shifting the color, or increasing\
    \ the contrast, or turning a color image into a black-and-white photograph, which\
    \ we will be doing next by using one of the adjustment layers. These layers, in\
    \ essence, allow for what can be termed as \"non-destructive\" editing, as the\
    \ adjustment is held separately, inside of the layer itself, and is never permanently\
    \ applied to your digital image data.\n\nTo create a black-and-white adjustment\
    \ layer, select the `Niki` layer and using the `Layer` ➤ `New Adjustment Layer`\
    \ ➤ `Black & White` menu sequence to open a `New Layer` dialog, as seen in Figure\
    \ [8-8](#A978-1-4842-4060-1_8_Chapter.html#Fig8).\n\n![A978-1-4842-4060-1_8_Fig8_HTML.jpg](A978-1-4842-4060-1_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8. You can add a `Black & White` adjustment layer to `Niki` layer\n\
    \nThen, select the `Use Previous Layer to Create a Clipping Mask` option in the\
    \ `New Adjustment Layer` Dialog, which will then attach this adjustment layer\
    \ to the `Niki` layer.\n\nI also selected an Orange color, to show you how you\
    \ can color code your layers, as another way to organize what you're doing. Throughout\
    \ the book I will color adjustment layers with the Orange color to make them stand\
    \ out to the readers.\n\nOnce you click `OK`, and create an adjustment layer,\
    \ `Niki` will be turned into a black-and-white image, as can be seen in Figure\
    \ [8-9](#A978-1-4842-4060-1_8_Chapter.html#Fig9). You can click on the eye icon\
    \ to toggle this effect (image desaturation adjustment) and turn it on and off\
    \ at will.\n\n![A978-1-4842-4060-1_8_Fig9_HTML.jpg](A978-1-4842-4060-1_8_Fig9_HTML.jpg)\n\
    \nFigure 8-9. An adjustment layer displays the image adjustment data that you\
    \ have input\n\nLet's proceed to take a look at some of these same compositing\
    \ features in GIMP, to see how that software matches up as far as creating a composite\
    \ is concerned. Like the Photoshop image composite, we will include an image,\
    \ object, vertical text, and a special effect in the GIMP image."
  raw: '## Using Layers in Photoshop: Compositing


    Let’s continue building the composite we started in [Chapter 6](#A978-1-4842-4060-1_6_Chapter.html).
    Begin by opening the `Chapter6alphaChannels.psd` file and then use the Layer ➤
    New Layer menu sequence, shown in Figure [8-1](#A978-1-4842-4060-1_8_Chapter.html#Fig1),
    to access the New Layer dialog shown in Figure [8-3](#A978-1-4842-4060-1_8_Chapter.html#Fig3).
    Name the layer TextLayer, select Color: None (transparency) and Mode: Normal,
    and finally, Opacity: 100%. You will be learning about modes in [Chapter 9](#A978-1-4842-4060-1_9_Chapter.html).
    I wanted to show you how to add Text objects to your composite as a part of this
    exercise, as it has many practical applications.


    ![A978-1-4842-4060-1_8_Fig3_HTML.jpg](A978-1-4842-4060-1_8_Fig3_HTML.jpg)


    Figure 8-3.


    Use Layer ➤ New Layer menu sequence and then Name: TextLayer


    We are now ready to take a look at the Photoshop CS Text tool, which is accessed
    using the capitalT in the lower part of the icon toolbar on the left side of the
    screen. You have already used the Magic Wand tool for mask creation; now you are
    going to explore some of the other tools.


    Tip


    If you click any of these icons on the Photoshop toolbar at the left side of the
    screen, and hold your mouse button down, a pop-up will appear, that shows other
    closely related tools that you can select.


    ### Adding a Text Object: Using the Vertical Text Tool


    In order to add a text object, click and hold the letter T icon from the left
    toolbar, and select Vertical Type Tool from the drop-down menu that will appear,
    as shown in Figure [8-4](#A978-1-4842-4060-1_8_Chapter.html#Fig4). Make sure your
    TextLayer is still selected, and then click the top right in your composite and
    type “COMPOSITING” using a gold color and 54-point Arial Black font. As you can
    see at the top of the figure, you can set the font, style, point size, anti-aliasing,
    justification, and color in the Text Tool Options toolbar underneath your top
    menus.


    ![A978-1-4842-4060-1_8_Fig4_HTML.jpg](A978-1-4842-4060-1_8_Fig4_HTML.jpg)


    Figure 8-4.


    In order to add a text object, click the letter T icon and select the Vertical
    Type Tool, and then type, “COMPOSITING”


    To fine-tune the position of the Text object once you’re done, click the Move
    tool (the top icon on the toolbar) and use your arrow keys to move it by single
    pixels, or drag the object with your mouse.


    ### Special Effects Layers: Adding Effects to the Text


    Next, let’s add some drop shadowing to your Text object to make it “pop” and add
    a bit of professionalism to your image composite. To do so, right-click the TextLayer
    and select the Blending Options in the drop-down men that appears on the right-hand
    side of the screen, as is shown in Figure [8-5](#A978-1-4842-4060-1_8_Chapter.html#Fig5).


    ![A978-1-4842-4060-1_8_Fig5_HTML.jpg](A978-1-4842-4060-1_8_Fig5_HTML.jpg)


    Figure 8-5.


    To add drop shadowing, right-click the TextLayer and select Blending Options from
    the drop-down menu


    I like to use an Inner Shadow, as selected on the left side of the screen of Figure
    [8-6](#A978-1-4842-4060-1_8_Chapter.html#Fig6), to achieve shading on the text,
    giving it the effect that of being cut into the image.


    ![A978-1-4842-4060-1_8_Fig6_HTML.jpg](A978-1-4842-4060-1_8_Fig6_HTML.jpg)


    Figure 8-6.


    To shade your text, select the Inner Shadow option and set Angle and Size


    To do this, I set a 135-degree angle, 3 pixels for both Size and Distance, an
    Opacity of 75%, the Multiply Blend Mode, zero pixels of Choke, and an Anti-aliased
    Contour.


    If you make sure the Preview option on the right side of the dialog is selected,
    you can play around with these settings and their effects will be rendered, in
    real-time, on your Text object, so that you will be able to see your result and
    refine it in this settings dialog until it is exactly what you wanted.


    Once you click OK, you will see your resulting Inner Shadow effect, as shown in
    Figure [8-7](#A978-1-4842-4060-1_8_Chapter.html#Fig7), and notice that Photoshop
    is using a new sublayer to encapsulate the settings. This is the use of layers
    that I was referring to earlier when I discussed using a layer paradigm to contain
    special-effects settings and visibility. As you can see, you can edit these settings
    at any time (try it!) or preview the effect using the layer visibility (eye) icons.


    ![A978-1-4842-4060-1_8_Fig7_HTML.jpg](A978-1-4842-4060-1_8_Fig7_HTML.jpg)


    Figure 8-7.


    To turn the Inner Shadow effect on and off, toggle the eye icons


    If you click the eye icons next to the Inner Shadow effects, you will see that
    you can turn just this effect on and off. This enhances the modal nature of the
    digital image compositing software and allows everything to be composed as separate
    items, or what I like to call “moves,” within the layer stack, or “compositing
    pipeline.”


    ### Adjustment Layer: Adjusting Image Characteristics


    Let’s now take a look at a unique type of layer in Photoshop called the Adjustment
    layer. An “adjustment” in Photoshop is a change that a photographer would make
    to the digital imagery. This might include shifting the color, or increasing the
    contrast, or turning a color image into a black-and-white photograph, which we
    will be doing next by using one of the adjustment layers. These layers, in essence,
    allow for what can be termed as “non-destructive” editing, as the adjustment is
    held separately, inside of the layer itself, and is never permanently applied
    to your digital image data.


    To create a black-and-white adjustment layer, select the Niki layer and using
    the Layer ➤ New Adjustment Layer ➤ Black & White menu sequence to open a New Layer
    dialog, as seen in Figure [8-8](#A978-1-4842-4060-1_8_Chapter.html#Fig8).


    ![A978-1-4842-4060-1_8_Fig8_HTML.jpg](A978-1-4842-4060-1_8_Fig8_HTML.jpg)


    Figure 8-8.


    You can add a Black & White adjustment layer to Niki layer


    Then, select the Use Previous Layer to Create a Clipping Mask option in the New
    Adjustment Layer Dialog, which will then attach this adjustment layer to the Niki
    layer.


    I also selected an Orange color, to show you how you can color code your layers,
    as another way to organize what you’re doing. Throughout the book I will color
    adjustment layers with the Orange color to make them stand out to the readers.


    Once you click OK, and create an adjustment layer, Niki will be turned into a
    black-and-white image, as can be seen in Figure [8-9](#A978-1-4842-4060-1_8_Chapter.html#Fig9).
    You can click on the eye icon to toggle this effect (image desaturation adjustment)
    and turn it on and off at will.


    ![A978-1-4842-4060-1_8_Fig9_HTML.jpg](A978-1-4842-4060-1_8_Fig9_HTML.jpg)


    Figure 8-9.


    An adjustment layer displays the image adjustment data that you have input


    Let’s proceed to take a look at some of these same compositing features in GIMP,
    to see how that software matches up as far as creating a composite is concerned.
    Like the Photoshop image composite, we will include an image, object, vertical
    text, and a special effect in the GIMP image.'
  trans: "\n## 在 Photoshop 中使用图层：合成图像\n\n让我们继续构建在第 6 章中开始的合成图像。首先打开 `Chapter6alphaChannels.psd`\
    \ 文件，然后使用 `图层` ➤ `新建图层` 菜单序列（如图 8-1 所示）来访问“新建图层”对话框，如图 8-3 所示。将图层命名为 `TextLayer`，选择“颜色：无”（透明）和“模式：正常”，最后设置“不透明度：100%”。你将要在第\
    \ 9 章中了解关于模式的知识。我想在本次练习中向你展示如何将文本对象添加到你的合成图像中，因为这具有许多实际应用。\n\n![A978-1-4842-4060-1_8_Fig3_HTML.jpg](img/A978-1-4842-4060-1_8_Fig3_HTML.jpg)\n\
    \n图 8-3. 使用 `图层` ➤ `新建图层` 菜单序列，然后设置“名称：TextLayer”\n\n现在我们准备看看 Photoshop CS 的文字工具，可以通过点击屏幕左侧图标工具栏下部的大写字母\
    \ `T` 来访问。你已经使用过魔棒工具来创建蒙版；现在你将探索一些其他工具。\n\n**提示**  \n如果你点击 Photoshop 工具栏（屏幕左侧）上的任意图标并按住鼠标按钮，将出现一个弹出菜单，显示你可以选择的其他紧密相关的工具。\n\
    \n### 添加文本对象：使用垂直文字工具\n\n为了添加文本对象，点击并按住左侧工具栏中的字母 `T` 图标，然后从弹出的下拉菜单中选择“垂直文字工具”，如图\
    \ 8-4 所示。确保你的 `TextLayer` 仍处于选中状态，然后在合成图像的右上角点击并输入“COMPOSITING”，使用金色和 54 号 Arial\
    \ Black 字体。如图顶部所示，你可以在顶部菜单下方的文字工具选项工具栏中设置字体、样式、字号、消除锯齿、对齐方式和颜色。\n\n![A978-1-4842-4060-1_8_Fig4_HTML.jpg](img/A978-1-4842-4060-1_8_Fig4_HTML.jpg)\n\
    \n图 8-4. 要添加文本对象，请点击字母 `T` 图标并选择“垂直文字工具”，然后输入“COMPOSITING”\n\n完成后若要微调文本对象的位置，请点击移动工具（工具栏上的顶部图标），并使用键盘上的方向键以单个像素为单位移动它，或用鼠标拖动对象。\n\
    \n### 特效图层：为文本添加效果\n\n接下来，让我们为文本对象添加一些投影效果，使其“脱颖而出”，并为你的图像合成增添一些专业感。为此，右键点击 `TextLayer`，并在屏幕右侧出现的下拉菜单中选择“混合选项”，如图\
    \ 8-5 所示。\n\n![A978-1-4842-4060-1_8_Fig5_HTML.jpg](img/A978-1-4842-4060-1_8_Fig5_HTML.jpg)\n\
    \n图 8-5. 要添加投影，请右键点击 `TextLayer` 并从下拉菜单中选择“混合选项”\n\n我倾向于使用“内阴影”（如图 8-6 屏幕左侧所示）来为文字添加阴影效果，使其看起来像是嵌入到图像中。\n\
    \n![A978-1-4842-4060-1_8_Fig6_HTML.jpg](img/A978-1-4842-4060-1_8_Fig6_HTML.jpg)\n\
    \n图 8-6. 要添加文字阴影，请选择“内阴影”选项并设置“角度”和“大小”\n\n为此，我设置了 135 度的角度，“大小”和“距离”均为 3 像素，“不透明度”为\
    \ 75%，“混合模式”为“正片叠底”，“收缩”为 0 像素，并选择了“消除锯齿”的“等高线”。\n\n如果你确保选中了对话框右侧的“预览”选项，就可以随意调整这些设置，它们的效果将实时渲染在你的文本对象上，这样你就能在设置对话框中看到结果并进行调整，直到它完全符合你的要求。\n\
    \n点击“确定”后，你将看到最终的内阴影效果，如图 8-7 所示。请注意，Photoshop 使用了一个新的子图层来封装这些设置。这就是我先前讨论使用图层范式来包含特效设置和可见性时所提到的分层用法。正如你所见，你可以随时编辑这些设置（试试看！），或者使用图层可见性（眼睛）图标来预览效果。\n\
    \n![A978-1-4842-4060-1_8_Fig7_HTML.jpg](img/A978-1-4842-4060-1_8_Fig7_HTML.jpg)\n\
    \n图 8-7. 要开启或关闭“内阴影”效果，请切换眼睛图标\n\n如果你点击内阴影效果旁边的眼睛图标，就会看到你可以单独开启或关闭这个效果。这增强了数字图像合成软件的模块化特性，并允许所有内容作为独立的项目（我称之为“动作”）在图层堆栈（或“合成管线”）中进行组合。\n\
    \n### 调整图层：调整图像特性\n\n现在让我们来看一下 Photoshop 中一种独特的图层类型——调整图层。在 Photoshop 中，“调整”是指摄影师对数字图像所做的更改。这可能包括调整颜色、增加对比度，或者将彩色图像转换为黑白照片——接下来我们将使用其中一个调整图层来完成后者。从本质上讲，这些图层允许进行所谓的“无损”编辑，因为调整操作被单独保存在图层本身内部，永远不会永久性地应用到你的数字图像数据上。\n\
    \n要创建黑白调整图层，请选择 `Niki` 图层，然后使用 `图层` ➤ `新建调整图层` ➤ `黑白` 菜单序列来打开“新建图层”对话框，如图 8-8\
    \ 所示。\n\n![A978-1-4842-4060-1_8_Fig8_HTML.jpg](img/A978-1-4842-4060-1_8_Fig8_HTML.jpg)\n\
    \n图 8-8. 你可以为 `Niki` 图层添加一个“黑白”调整图层\n\n然后，在“新建调整图层”对话框中选择“使用前一图层创建剪贴蒙版”选项，这会将此调整图层附加到\
    \ `Niki` 图层上。\n\n我还选择了一种橙色，向你展示如何为图层设置颜色编码，这也是组织工作的另一种方式。在本书中，我将使用橙色为调整图层着色，以便读者能一目了然。\n\
    \n点击“确定”并创建调整图层后，`Niki` 将变成黑白图像，如图 8-9 所示。你可以点击眼睛图标来切换此效果（图像去色调整），随意开启或关闭它。\n\n\
    ![A978-1-4842-4060-1_8_Fig9_HTML.jpg](img/A978-1-4842-4060-1_8_Fig9_HTML.jpg)\n\
    \n图 8-9. 调整图层显示了你输入的图像调整数据\n\n让我们继续看看 GIMP 中一些类似的合成功能，了解该软件在创建合成图像方面的表现。与 Photoshop\
    \ 图像合成类似，我们将在 GIMP 图像中包含一张图片、对象、垂直文本和一个特效。\n"
- fmt: '# Using Layers in GIMP: Basic Compositing


    Let’s use a right-click, context-sensitive menu work process to add the new layer
    in GIMP. Right-click the aqua `RingElement` layer, as seen in Figure [8-10](#A978-1-4842-4060-1_8_Chapter.html#Fig10),
    and select `New Layer` to access a `New Layer` dialog. Name the layer `TextLayer`
    and set a `Layer Fill Type` of `Transparency`. This dialog will set a size for
    the layer that is equal to the document size settings. This is the equivalent
    to the first step you took in Photoshop to create a new layer.


    ![A978-1-4842-4060-1_8_Fig10_HTML.jpg](A978-1-4842-4060-1_8_Fig10_HTML.jpg)


    Figure 8-10.


    To add a new layer in GIMP, right-click the `RingElement` layer and select `New
    Layer`


    The next step you performed in Photoshop was to add text by clicking the `T` icon
    (GIMP uses an `A`), selecting the `Vertical Type` tool, and then entering the
    word "COMPOSITING." Since GIMP doesn''t have a `Vertical Text` tool, to get a
    similar result, you have to hit the `Enter` key after you type in each letter.
    As you can see in Figure [8-11](#A978-1-4842-4060-1_8_Chapter.html#Fig11), you
    set your gold color using a similar color picker dialog. You can set the font,
    style, antialiasing, and line spacing under the `Tool Options` on the lower-right
    side of the screen.


    ![A978-1-4842-4060-1_8_Fig11_HTML.jpg](A978-1-4842-4060-1_8_Fig11_HTML.jpg)


    Figure 8-11.


    To enter text in GIMP, click the `A` icon, select `Text tool` options, set the
    color to gold, and enter the text


    The next thing you did in Photoshop was to add the `Inner Shadow` effect so that
    it looked like the text was cut out of your image. GIMP does not have `Layer Styles`
    like Photoshop CS6 does, so I will show you how to create shadows during [Chapter
    9](#A978-1-4842-4060-1_9_Chapter.html) when I cover pixel Blending modes.


    As you can see in Figure [8-11](#A978-1-4842-4060-1_8_Chapter.html#Fig11), GIMP
    creates the layer for you when you create text, so you will not need the `TextLayer`!
    I only wanted to show you how to create a new layer in the program, so that you
    would know how to do it. One of the convenient things about this, as you see in
    the figure, is that your text layer sizes (width and height) are set for you automatically
    by GIMP’s `Text` tool.


    GIMP doesn’t have adjustment layer functionality either, so I will show you a
    different (non-destructive) work process, using features that will simulate this
    end result.


    To delete layers in GIMP, right-click the `TextLayer` and select `Delete Layer`
    from the drop-down menu that appears, as seen in Figure [8-12](#A978-1-4842-4060-1_8_Chapter.html#Fig12).


    ![A978-1-4842-4060-1_8_Fig12_HTML.jpg](A978-1-4842-4060-1_8_Fig12_HTML.jpg)


    Figure 8-12.


    Right-click on `TextLayer`, and select `Delete Layer`


    To implement non-destructive editing of your `Niki` image, right-click the `Niki.png`
    layer and select the `Duplicate Layer` menu option, as shown in Figure [8-13](#A978-1-4842-4060-1_8_Chapter.html#Fig13).
    Name the new layer `Niki Black & White`. This work process keeps your original
    color data intact in the `Niki.png` layer, allowing you to turn this black-and-white
    `Niki` layer into a layer that contains this desaturated image data in its own
    separate layer.


    ![A978-1-4842-4060-1_8_Fig13_HTML.jpg](A978-1-4842-4060-1_8_Fig13_HTML.jpg)


    Figure 8-13.


    Right-click the `Niki.png` layer and select `Duplicate Layer`


    Rename the duplicated layer, by double-clicking the new layer’s name to enable
    it for editing. The result can be seen in Figure [8-14](#A978-1-4842-4060-1_8_Chapter.html#Fig14).


    ![A978-1-4842-4060-1_8_Fig14_HTML.jpg](A978-1-4842-4060-1_8_Fig14_HTML.jpg)


    Figure 8-14.


    Use `Colors ➤ Hue-Saturation` to desaturate `Niki Black & White` layer


    Then use the `Colors ➤ Hue-Saturation` menu sequence, and open the `Hue-Saturation`
    dialog, so that you can remove any color saturation, as shown in Figure [8-15](#A978-1-4842-4060-1_8_Chapter.html#Fig15).


    ![A978-1-4842-4060-1_8_Fig15_HTML.jpg](A978-1-4842-4060-1_8_Fig15_HTML.jpg)


    Figure 8-15.


    Set the `Saturation` slider to `-100` to desaturate


    The `Hue-Saturation` dialog allows you to adjust the `Hue` (the color temperature),
    `Lightness` (the level of white or black in the image), and `Saturation` (the
    amount of color versus black or white), for complete control over your image layer’s
    color.


    If you make sure that the `Preview` option at the bottom of the dialog is selected,
    you can see the results of your slider settings in real time in the selected layer
    as you move each slider, so that you can fine-tune, or "tweak" your result until
    it is exactly as you intended it to be.


    As you can see in Figure [8-16](#A978-1-4842-4060-1_8_Chapter.html#Fig16), you
    have used GIMP layers to achieve essentially the exact-same end results as you
    got in Photoshop, except for drop shadowing inside of your text layer.


    ![A978-1-4842-4060-1_8_Fig16_HTML.jpg](A978-1-4842-4060-1_8_Fig16_HTML.jpg)


    Figure 8-16.


    You now have the same desaturated result in GIMP


    You will be learning how to create these shadows using GIMP in the next chapter
    covering blending modes. These modes are necessary for use in the creation of
    photo-realistic drop shadowing effects, so, here again, the order of the topics
    in the book chapters is a perfect fit.


    ## Summary


    In this eighth chapter, we reviewed how to use layers to organize your digital
    image composites using Photoshop and GIMP. We looked at the basic Layer menus
    in Photoshop and GIMP to see what layer features those packages support, and observed
    that advanced layer functionality is one of the areas that differentiates Photoshop
    CS6 from GIMP 2.8.14.


    You learned about how to create a new layer in Photoshop and how to add a Vertical
    Text object to the layer. You learned how to create and apply Layer Styles in
    Photoshop as well as how to create and apply Adjustment Layers, using Photoshop.


    We then went over how to create the very same composite in GIMP, using a different
    work process. You created vertical text, using a horizontal text tool, and learned
    how to apply non-destructive editing, by utilizing standard layers, rather than
    by using adjustment layers, since GIMP does not support those in version 2.8.


    In [Chapter 9](#A978-1-4842-4060-1_9_Chapter.html), you will learn more about
    how Blending Modes work with layers and layer functionality in digital image compositing,
    as the two go hand in hand. Blending modes can also be accessed using your Layer
    palette in both Photoshop CS6 and GIMP 2.8.


    # The Algorithms of Digital Imaging: Blending Modes


    Now that you have learned how to use layers in a digital image compositing pipeline,
    in this chapter, we’ll dive in deeper and take a look at the blending mode functionality
    contained within each of these layers. These blending modes are present in both
    GIMP and Photoshop, and they allow algorithmic functions for combining pixels
    across different layers. These blending algorithms were originally the work of
    Thomas Porter and Tom Duff, and in the Android API, blending modes are, in fact,
    a part of a `PorterDuff` class, named after these two men.


    In addition to these pixel blending algorithms now being made available in the
    Android 5 API, Porter-Duff modes are also available in the JavaFX API, which means
    that they are also now included in Java 7, Java 8, and Java 9. They have also
    recently been added to HTML5, using CSS3 and JavaScript, and so they are really
    worth learning about, especially if you’re interested in producing interactive
    new media content using all these popular open source software application development
    platforms.


    If you want to learn how to use blending modes with Java code, in addition to
    inside digital image compositing software, I have several titles that cover this,
    including *Beginning Java 8 Games Development* (2014), *Pro Android Graphics*
    (2013), and *Pro Java Games Development* (2016), all of which are published by
    Apress.'
