- '# 数字图像合成基础


  《数字图像合成基础》面向数字摄影师、多媒体制作人、二维应用开发者、二维或三维网站开发者、用户界面或用户体验设计师、以图像为中心的社交媒体网站或应用的用户（包括
  `Instagram`、`Pinterest`、`Facebook`、`LinkedIn`、`XING`、`YouTube` 等），以及任何对使用流行的 `PNG`、`JPEG`、`GIF`
  和 `animGIF` 文件格式生成高质量数字图像或特效感兴趣的人。


  本书涵盖数字图像编辑与合成；在早期章节中，这相当于基础知识：恰当的术语、主题、概念和定义。后续的每一章都建立在上一章的知识基础之上。因此，当我们进入本书后面的章节时，读者应该能够利用
  Alpha 通道、蒙版、混合模式、特效、调整图层等工具，创建一些相当高级的数字图像合成流程。


  本书末尾甚至涵盖了数据占用空间优化，以及如何使用如 `Java`、`JavaFX`、`HTML5`、`CSS3`、`JavaScript`、`Python` 和
  `Android` 等开源平台来创建数字图像合成流程。


  第 1 章 专注于数字成像的基础之一——像素，第 2 章 探讨数字成像的尺寸，即分辨率。第 3 章 涵盖宽高比和数字成像的形状，第 4 章 则讨论数字成像的色彩理论。


  进入第 5 章，我们将利用色深进行数字图像的数字化，第 6 章 接着介绍数字图像的透明度和 Alpha 通道。第 7 章 研究如何使用蒙版工具隔离数字图像中的区域，第
  8 章 则讲解如何通过图层来组织数字图像合成。


  第 9 章 开始涉及更高级的概念，如混合模式，第 10 章 讨论了像 `GIMP` 和 `Photoshop CS6` 这类数字图像合成软件包的模态操作性质。第
  11 章 涵盖插件的安装与使用，第 12 章 则详细阐述使用 `Photoshop CS6` 和 `GIMP 2.8.14` 进行数字图像合成流程的细节。


  在第 13 章中，我们将探讨数据占用空间优化，最后在第 14 章里，我们回顾了计算机编程语言如何在图像合成中发挥作用，无论是在 `GIMP` 和 `Photoshop`
  内部，还是借助诸如 `Python`、`Java`、`JavaFX`、`Android`、`JavaScript`、`CSS3` 和 `HTML5` 等流行的开源平台。


  如果你对数字摄影或数字成像感兴趣，并想学习基础知识，了解从像素到合成流程的整个数字领域是如何运作的，那么这本书正是为你准备的数字图像编辑与特效书籍。我甚至展示了如何使用免费的数字图像软件
  `GIMP 2.8.14` 来完成所有操作，因此你唯一的开销就是这本书。


  《数字图像合成基础》充满了技巧、窍门、工具、主题、术语、技术和工作流程，能够帮助你在数字图像合成流程方面，从一位数字成像爱好者转变为专业的知识型人士。


