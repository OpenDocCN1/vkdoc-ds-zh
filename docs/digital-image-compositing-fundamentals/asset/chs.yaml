  \ Alpha 通道，该通道将包含 `魔术棒` 工具在蒙版工作过程中迄今为止为你创建的选区数据（灰度）。\n\n要查看此 Alpha 通道，请选择你的 `通道`\
  \ 面板选项卡，如图 7-6 右侧所示，点击 `BirdSelection` Alpha 通道的可见性图标（一个眼睛图标），并利用位于 `通道` 面板顶部的 `RGB`\
  \ 主通道，关闭颜色通道的可见性图标。\n\n![A978-1-4842-4060-1_7_Fig6_HTML.jpg](img/A978-1-4842-4060-1_7_Fig6_HTML.jpg)\n\
  \n**图 7-6.** 你可以在 `通道` 面板中选择 `BirdSelection` 进行编辑\n\n`通道` 面板顶部的这个 `RGB` 通道是一个便捷（汇总）通道，当选中它时，将同时作用于红色、绿色和蓝色通道。我将其称之为汇总操作，因为它以完全相同的方式将任何工具或算法应用于这三个颜色通道。在此案例中，对当前选中的图像合成图层来说，这恰好是对其像素颜色数据进行可见性选择，或者更精确地说，是取消可见性选择。\n\
  \n你可以使用任何编辑工具来清理黑色鸟形轮廓外部的黑色区域，包括橡皮擦或画笔工具（设置为使用白色）。清除大面积黑色区域最快的方法是，在你想要移除的区域上画一个矩形，从而选中该区域，如图\
  \ 7-7 所示。然后，在将 `填充` 内容设置为 `白色` 颜色值后，使用 `编辑 ➤ 填充` 菜单序列。\n\n![A978-1-4842-4060-1_7_Fig7_HTML.jpg](img/A978-1-4842-4060-1_7_Fig7_HTML.jpg)\n\
  \n**图 7-7.** 要移除大面积黑色区域，请选中内容并前往 `编辑 ➤ 填充 ➤ 白色`\n\n你可以使用 `填充`、`橡皮擦` 或 `画笔` 工具，清除黑色鸟形轮廓外部的所有黑色像素，从而在黑色和白色像素之间创建清晰的界限，如图\
  \ 7-8 所示。\n\n![A978-1-4842-4060-1_7_Fig8_HTML.jpg](img/A978-1-4842-4060-1_7_Fig8_HTML.jpg)\n\
  \n**图 7-8.** 蒙版外部清理干净后，使用 `图像 ➤ 反相`\n\n一旦通用蒙版区域清理完毕，你需要对选区进行反相。这样就会选中鸟——目前，除了鸟本身之外的所有内容都被选中了，因为这是进行蒙版的简便方法：反向操作。在数字图像处理中，处理工作流程的最佳方式有时可能恰好与你原本认为的最佳方法相反！蒙版就是一个完美的例子：你先选中不想要的部分，然后翻转（反相）选区，从而抓取你想要的部分！\n\
  \n`反相` 功能可以通过 `图像 ➤ 调整 ➤ 反相` 菜单序列找到，如图 7-8 左上角蓝色高亮显示。\n\n反相选区后，就进入了蒙版编辑的微调阶段。在此阶段，你将开始处理蒙版的边缘。蒙版的边缘是其最重要的区域，因为边缘质量将影响你蒙版的感知质量。当你将蒙版对象用于某个数字图像合成图层，以将此蒙版的像素与合成图像中其他图层的像素合并时，这一点至关重要。\n\
  \n\n\n#### 遮罩微调：Alpha 边缘精修技术\n\n创建蒙版工作流程的下一步，是完善蒙版白色（不透明）与黑色（透明）区域之间的边缘。这是蒙版的反走样处理。如果你在`魔术棒`工具中选择了`反走样`选项，那么算法生成的蒙版中可能已经存在一些这样的处理。如果你没有选择此选项，蒙版边缘将只存在黑色和白色像素。让我们使用缩放（放大镜）工具，看看是否有灰色像素。这些灰色像素将提供一种具有“实时”色彩混合的蒙版（利用反走样技术），处理对象（鸟）与任何你之后可能希望将对象合成到其上的背景图像之间的过渡，因为它们定义了透明度。\n\
  \n如图 7-9 所示，蒙版已被反转，并且边缘确实存在灰色像素，提供了这种反走样功能。为了创建这张图像，我将鸟尾底部一条“干净”边缘上略微弯曲的区域放大了。正如标签所示，我放大了\
  \ 700%，这样你就能看到边缘像素和反走样效果。\n\n![A978-1-4842-4060-1_7_Fig9_HTML.jpg](img/A978-1-4842-4060-1_7_Fig9_HTML.jpg)\n\
  \n**图 7-9.** 你可以放大蒙版边缘来查看反走样效果。\n\n现在，让我们通过使用 `查看 ➤ 100%` 菜单序列缩小视图，然后在 Photoshop\
  \ CS 中启用 `蒙版叠加` 功能。这通过点击 `RGB` 通道旁边的 `眼睛` 图标来完成。\n\n这将在蒙版的透明区域上叠加一层红色色调，如图 7-10\
  \ 所示。这层色调允许你在编辑蒙版的同时，也能看到你正在抠图的图像，这样你正在处理的图像就可以用作参考指南。\n\n![A978-1-4842-4060-1_7_Fig10_HTML.jpg](img/A978-1-4842-4060-1_7_Fig10_HTML.jpg)\n\
  \n**图 7-10.** 选择 `RGB` 通道的 `眼睛` 图标来启用蒙版叠加。\n\n如图 7-11 所示，我使用了一个 13 像素的柔和边缘 `笔刷`\
  \ 工具，并将视图放大 400% 来修复鸟尾的顶部边缘和背部。正如你所见，这些区域在微调该蒙版与鸟形对象的边缘贴合度方面，确实需要一些工作。\n\n![A978-1-4842-4060-1_7_Fig11_HTML.jpg](img/A978-1-4842-4060-1_7_Fig11_HTML.jpg)\n\
  \n**图 7-11.** 要编辑鸟尾边缘，请使用 13 像素的柔和笔刷并放大视图。\n\n你可以使用 `RGB` 通道的 `眼睛` 图标来开启和关闭这种红色蒙版辅助显示。你需要在工作中反复使用此功能，以便看到实际的蒙版本身。\n\
  \n你也可以在没有此蒙版叠加的黑白模式下工作，确保蒙版完全是黑色和白色，并在两种颜色之间的边缘处保留了灰色的反走样像素。\n\n这通常是遮罩艺术家的操作方式：他们使用红色蒙版叠加指南来查看蒙版处理的进展，然后关闭它以处理高对比度的黑白表示，因为在边缘之外的蒙版区域，这样做更容易看清你的操作。\n\
  \n你应该花足够的时间来完善蒙版，以确保获得你想要的结果。请记住，和其他一切技能一样，成为一名专业的合成师需要大量的练习！需要重点注意的是，虽然我们使用了一个\
  \ 484×372 分辨率的示例图像来观察这个蒙版处理过程，但使用更高分辨率的图像来进行蒙版处理，几乎总能得到更高质量的图像合成结果。单个像素相对于整个图像的尺寸比例（百分比）更小，因此边缘和反走样效果也更加精细。\n\
  \n在 GIMP 中与 `魔术棒` 工具等效的是 `模糊选择` 工具。由于它在两个软件中的工作方式极其相似，我决定改为向你展示如何在 GIMP 中通过使用另一种创新的、采用了不同方法的算法来提取蒙版。这个算法可以通过使用\
  \ `剪刀选择` 工具来实现。\n\n#### GIMP 剪刀工具：智能抠图算法\n\n要访问 `剪刀选择` 工具，请使用 `文件 ➤ 打开` 菜单序列在 GIMP\
  \ 中打开 `MaskExercise.png` PNG24 数字图像文件。然后，选择屏幕右上角显示的 `剪刀` 工具图标（如图 7-12 所示），点击你想提取的对象边缘，开始勾勒你要放置的轮廓线。当你点击对象上的第二个点时，`剪刀选择`\
  \ 工具将应用其边缘检测算法。这在图 7-12 中鸟的头部顶端可以看到。\n\n![A978-1-4842-4060-1_7_Fig12_HTML.jpg](img/A978-1-4842-4060-1_7_Fig12_HTML.jpg)\n\
  \n**图 7-12.** 要从图像中提取对象，请打开图像，选择 `剪刀` 工具，然后点击其边缘。第二次点击将启用边缘检测。\n\n如果你选中了`交互式边界`选项（如图\
  \ 7-13 屏幕左下角勾选所示），当你调整选区轮廓上的点以细化蒙版节点时，边缘检测算法将实时重新计算。\n\n![A978-1-4842-4060-1_7_Fig13_HTML.jpg](img/A978-1-4842-4060-1_7_Fig13_HTML.jpg)\n\
  \n**图 7-13.** 沿着对象边缘点击以创建轮廓线。\n\n`剪刀` 工具就像一个智能样条线，在点与点之间（我称之为该工具的节点）移动时会自动向后查看并调整其曲率，同时设置张力手柄（每个节点的进出曲率）。你甚至可以细化节点的位置来调整曲线！\n\
  \n\n\n#### 调整剪刀工具：智能样条节点\n\n我发现，将节点置于对象颜色变化处时，边缘检测算法的结果更好，如图 7-14 所示，位于鸟的灰色和**黄色**区域。在绘制曲线的整个过程中（包括闭合曲线后），你都可以随时通过拖拽来移动节点位置。曲线通过点击你放置的第一个节点来闭合，在本例中，该节点位于鸟的头顶。如图所示，当你拖拽节点重新定位时，节点之间的线条会变直，当你将节点放到新位置时，会重新计算新的曲线拟合算法。\n\
  \n![A978-1-4842-4060-1_7_Fig14_HTML.jpg](img/A978-1-4842-4060-1_7_Fig14_HTML.jpg)\n\
  \n图 7-14. 你可以随时移动节点以获得更好的结果\n\n如果你将图右侧的节点重新定位到鸟的胸部中央，智能曲线放置算法将获得比任何其他边缘放置算法都高出**100%**\
  \ 的结果（你可以使用本书附带的`MaskExercise.png`文件亲自尝试）。结果如图 7-15 所示，边缘检测效果完美。\n\n![A978-1-4842-4060-1_7_Fig15_HTML.jpg](img/A978-1-4842-4060-1_7_Fig15_HTML.jpg)\n\
  \n图 7-15. 这种节点放置方式获得了更好的边缘匹配结果\n\n在图 7-16 中，我将图像放大到 200%，以便能更清楚地看到鸟图像底部的利爪，从而进行节点放置。如图所示，有几个节点我不得不稍微重新定位，以便从剪刀工具算法中获得更好的边缘拟合效果，特别是翅膀尖端的那个节点（将图\
  \ 7-16 与图 7-17 进行比较）。\n\n![A978-1-4842-4060-1_7_Fig17_HTML.jpg](img/A978-1-4842-4060-1_7_Fig17_HTML.jpg)\n\
  \n图 7-17. 要闭合样条曲线，请点击你放置的第一个节点\n\n![A978-1-4842-4060-1_7_Fig16_HTML.jpg](img/A978-1-4842-4060-1_7_Fig16_HTML.jpg)\n\
  \n图 7-16. 先放置简单节点，细节留到最后处理\n\n另外，请注意在图 7-14 到图 7-16 中，我将轮廓的起点设在了鸟爪旁边，因为这是你蒙版的细节区域，所以我打算最后处理这部分。因此，我的第一个点在鸟爪的右侧，我按逆时针方向放置节点，结束于鸟爪的左侧，这样我最后放置的节点就是鸟爪的细节部分。\n\
  \n这样做的原因是，我可以最后再放大到鸟爪区域，此时已经使用剪刀选择工具勾勒出了大部分蒙版区域。\n\n需要注意的是，如果你点击其他 GIMP 工具，当前正在使用的工具将中止运行。因此，如果你想缩放，必须使用`视图`\
  \ ➤ `缩放` ➤ `放大`的菜单序列（或`视图` ➤ `缩放` ➤ `缩小`），以保持此剪刀工具处于激活状态。出于这个原因，了解 Photoshop 和 GIMP\
  \ 的菜单序列以及工具图标都很有用。\n\n如图 7-17 所示，剪刀算法在鸟爪区域的表现相当不错，除了爪子部分，我需要将其转换为选区并保存为 Alpha 通道（以便编辑）后手动处理。\n\
  \n要完全闭合选择曲线，请将指针悬停在你放置的第一个节点上，当指针变为闭合曲线指针时，点击鼠标，曲线便会闭合。需要注意的是，选择曲线闭合后，你仍然可以调整（移动）节点。要将选择曲线转换为选区区域，请点击曲线内部。\n\
  \n如图 7-18 所示，我已经将曲线转换为选区，现在就可以使用与 Photoshop 中相同的工作流程来保存选区集并在通道中编辑。在 GIMP 中执行此操作的菜单序列是`选择`\
  \ ➤ `保存到通道`。然后，你可以使用`选择` ➤ `切换快速蒙版`来切换快速蒙版（红色颜色指示）模式。\n\n![A978-1-4842-4060-1_7_Fig18_HTML.jpg](img/A978-1-4842-4060-1_7_Fig18_HTML.jpg)\n\
  \n图 7-18. 点击闭合样条曲线内部以创建最终选区\n\n如图 7-19 所示，保存到通道后，你可以重新打开该通道，并使用画笔工具（已选择）配合黑色和白色进行进一步编辑。颜色可以通过工具图标下方的颜色样本之间的弧形箭头进行切换。\n\
  \n![A978-1-4842-4060-1_7_Fig19_HTML.jpg](img/A978-1-4842-4060-1_7_Fig19_HTML.jpg)\n\
  \n图 7-19. 在 GIMP 中使用快速蒙版模式来优化蒙版\n\n如图 7-19 所示，我使用画笔工具确保右脚趾包含在蒙版区域内，并稍微清理了其他区域。\n\
  \n这个剪刀选择工具确实可以让你达到 99%的蒙版工作都由你放置的节点和工具算法完成的程度。想想看，这相当令人惊叹，尤其是 GIMP 可以免费用于商业用途。当然，由于你现在已经拥有了`XCF`文件，你可以在边缘清理和蒙版完善上花费任意多的时间。熟能生巧。\n\
  \n在下一章中，我们将研究如何使用图层面板。\n\n### 总结\n\n在本章中，我们回顾了使用 Photoshop（魔棒工具）和 GIMP（剪刀选择工具）创建蒙版的最常用方法。你学习了如何使用\
  \ Photoshop 魔棒及其采样大小和容差设置，以及如何将选区保存到 Alpha 通道并进一步编辑以完善最终结果。在 GIMP 中，你学习了剪刀选择工具，它采用了一种不同的方法，利用强大的算法创建一条样条曲线，使其贴合对象的任何边缘，你通过沿对象周边放置节点来引导它。我们还介绍了将此结果保存到\
  \ Alpha 通道并进一步编辑蒙版的方法，操作方式与在 Photoshop CS6 中相同。\n\n在第 8 章中，你将学习更多关于数字图像合成图层的内容，以及如何使用它们的功能，这些功能可以通过\
  \ Photoshop CS6 和 GIMP 2.8.14 中的图层面板来访问。\n\n\n\n"
- "# 8. 数字成像的组织：使用图层\n\n既然你已经学会了如何在数字图像合成流程中为对象创建蒙版，那么下一个合乎逻辑的步骤就是学习如何利用图层面板来组织你的数字图像合成项目。图层允许你将已添加蒙版的对象隔离开来，并将成像特效应用于单个图层和你的数字图像底板——即作为数字图像合成基础的底层背景图像。\n\
  \n最初，在早期的数字图像软件版本中，图层仅用于隔离带蒙版的对象，就像投影仪上的描图纸可以让你在演示中添加内容一样。图层最初的设计目的仅仅是容纳图像合成组件。在开发周期的某个阶段，开发者开始为图层添加其他很酷的功能，使其功能变得强大一个数量级。\n\
  \n我将本章内容安排为介绍图层面板，因为到目前为止，图层的作用远不止是组织你的数字图像合成！事实上，仅关于如何使用图层面板就可以写一整本书，因为它现在集成了如此多的功能，你将在本书的剩余部分中看到这一点。\n\
  \n`Photoshop` 和 `GIMP` 都支持一系列很酷的图层组织工具，这些工具可用于组织非常复杂的数字图像合成流程并创建特效结构，你将在接下来的五章中看到这些内容。\n\
  \n由于 `Photoshop` 在使用图层方面尤其擅长，能让你实现各种图像处理和特效，因此我们将花更多时间来研究这个软件的图层功能，然后看看 `GIMP 2.8.14`\
  \ 支持的那些令人印象深刻的功能。\n\n希望 `GIMP 3.0` 能增加一些 `Photoshop CS6` 当前提供的强大图层功能，特别是调整图层概念，它允许你以调整图层的形式执行数字图像像素调整，并附带非破坏性设置，随后可以通过编辑调整图层本身来更改这些设置！\n\
  \n在本章中，你将全面学习 `Photoshop` 的调整图层。让我们开始吧——我们有很多内容要讲！实际上，是无数层相关的成像信息，绝无双关之意！\n\n###\
  \ 图层的差异：`Photoshop` 与 `GIMP`\n\n就功能而言，`Photoshop` 和 `GIMP` 差异最大的领域之一就是图层。如果你对数字图像编辑或合成非常认真，你很可能会每月支付\
  \ 10 美元来获得 `Photoshop CS`，或者让你的客户在你的项目合同中支付每年 120 美元的订阅费。`GIMP 2.8` 拥有足够的图层功能来执行专业的数字图像合成，但\
  \ `Photoshop CS` 具有一些特效应用功能，使得调整结果或根据客户要求进行更改变得容易得多。`GIMP 3.0` 将在 2016 年（这些功能在 2.9\
  \ 版中测试之后）增加更多强大的功能和特性。\n\n#### `Photoshop` 图层：组织与特效\n\n如果你下拉 `Photoshop` 的 `图层`\
  \ 菜单（如图 8-1 所示），你会看到大量的图层组织、蒙版和数字图像算法（称为“调整”）。本章我将重点介绍 `新建` 和 `新建调整图层` 子菜单，因为没有足够的时间或篇幅来涵盖\
  \ `Photoshop` 通过其 `图层` 面板提供的所有功能。这是另一个可以自成一本专著的话题，因为它包含填充图层、视频图层、智能对象、图层样式，甚至还有一个为你进行网页切片的工具！\n\
  \n![A978-1-4842-4060-1_8_Fig1_HTML.jpg](img/A978-1-4842-4060-1_8_Fig1_HTML.jpg)\n\
