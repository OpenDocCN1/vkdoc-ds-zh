  既然我们已经涵盖了数字图像合成中的主要基础主题，让我们花一章的时间来轻松一下，看看插件软件。插件可以通过让你在对话框中简单地设置一些选项并点击 `确定` 按钮，来自动为你实现专门的成像效果！这些插件通常位于你的数字图像合成软件包中的
  `滤镜`（Photoshop）或 `过滤器`（GIMP）菜单中。


  由于 GIMP 的插件是免费的，我们要做的第一件事就是了解如何为 GIMP 2.8.14 软件包查找、安装和使用插件滤镜。


  Photoshop 也有大量的插件，其中大多数已经是 Photoshop CS6 软件包的一部分，并且还有几家第三方公司也为 Photoshop 提供额外的插件。要在互联网上找到这些，请使用关键词“Photoshop
  插件”进行谷歌搜索。


  之后，我们将研究如何将插件滤镜整合到数字图像合成工作流程中，并继续为你第 10 章的图像合成作品（针对 Photoshop CS6 和 GIMP 2.8.14）应用特效。




