  ### 本章小结


  在本第六章中，我们深入探讨了数字图像 Alpha 通道的概念。图像 Alpha 值定义了在数字图像合成管线中，每个合成图层内的像素如何表现半透明度。你了解了 Photoshop
  和 GIMP 分别如何表示 Alpha 数据，以及用于显示这些数据的 `Layers`（图层）和 `Channels`（通道）面板。你还学习了如何将一个包含 Alpha
  值的 PNG32 图像对象叠加合成到一个不含任何 Alpha 值的 PNG24 图像对象（因为它只是一个底板，也称为背景图像）上。


  我们还介绍了如何在 Photoshop 中使用 `Magic Wand`（魔棒）工具以及在 GIMP 中使用 `Fuzzy Select`（模糊选择）工具选择透明像素区域。此外，我们还学习了如何扩大和反选选区，以及如何删除选中的像素，从而在我们的数字图像合成管线中创造出更多像素透明度。


  在下一章中，你将学习更多关于数字图像蒙版的知识，以及如何使用像素选择工具“提取”数字图像蒙版，并通过 Alpha 通道将其保存以供日后使用。正如你所见，本书的章节编排顺序是很有道理的！


