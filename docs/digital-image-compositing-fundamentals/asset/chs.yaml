- '# 4. 数字成像的色彩：色彩理论


  既然你已经了解了如何使用定义图像分辨率和图像宽高比的`x,y`网格来定位像素，那么现在是时候深入每个像素内部，看看它是如何定义其色彩空间的。虽然数字图像在数据层面上保存了其分辨率和宽高比，但每个像素都包含其自身的特性，例如`x,y`网格（阵列）位置、颜色构成、透明度或不透明度、混合模式等等。我们将在本书的各个章节中逐一探讨所有这些领域。


  构成数字图像的像素颜色最终决定了图像的外观，因此色彩理论在此是一个重要主题。Photoshop CS6 和 GIMP 2.8.14 都拥有大量的工具，使我们能够调整颜色，以及根据颜色值来选择像素。


  如果你正在使用现代的消费电子设备，那么你就在使用`RGB`（红、绿、蓝）像素颜色模型。如果你在处理现代打印机，那么你就在使用`CMYK`（青、品红、黄、黑）颜色模型。


  如果你想知道为什么缩写不是`CMYB`，那是因为它的黑色版被称为“关键”版，其他颜色版都与其对齐。


  在本章中，我们将研究这两种颜色模型，以及最适合用于数字图像合成流程的颜色模型或“模式”。现在，让我们开始吧！


  ### 色彩理论：使用像素颜色通道


  无论你是在合成用于显示屏的数字图像，还是使用油墨在打印机上进行打印，你的像素都会包含使用一个或多个“通道”的颜色值。在印刷行业中，这些通道有时被称为“印版”，延续了老式印刷机使用金属印版的传统（其中一些至今仍在使用）。在
  Photoshop 和 GIMP 中，颜色通道拥有自己的浮动面板，允许你只处理单个颜色通道（或印版），这对于特殊效果或其他高级图像操作来说非常有用。




  ### 减色模型：使用 CMYK 印版进行打印


  现代彩色打印机至少使用`CMYK`中的四种墨水颜色，从而能够生成多种多样的颜色。高端喷墨打印机正推出配备六色或八色墨盒的型号，能够产生更丰富的色彩变化。


  打印机墨水采用减色模型，该模型的工作原理是墨水相互去除颜色——也就是说，两种颜色混合时会相互加深（通过去除浅色墨水），这就是为什么它被称为“减色”色彩过程。


  例如，青色和品红色墨水混合会产生紫色，这比单独使用任何一种墨水时产生的颜色都要深。


  减色模型产生的颜色比加色模型少，这一点我将在接下来讨论。仔细想想，这相当合乎逻辑，因为减法是在减少，而加法是在增加。在 Photoshop 以及 GIMP 中，你可以通过`图像
  ➤ 模式`菜单序列及其包含所有支持颜色模式的子菜单来访问颜色模式。该路径如图 4-1 所示，同时还有一个 CMYK 警告对话框。右下角的警告对话框提示你，即将从`RGB`转换到`CMYK`色彩配置文件，并建议使用`编辑
  ➤ 转换为配置文件`菜单序列来对转换过程进行更精细的控制。


  ![A978-1-4842-4060-1_4_Fig1_HTML.jpg](img/A978-1-4842-4060-1_4_Fig1_HTML.jpg)


  图 4-1.


  你可以使用`图像 ➤ 模式`菜单序列设置颜色模式


  通常你更愿意在`RGB`色彩配置文件下工作，因为`RGB`拥有 16,777,216 种颜色可供使用，而`CMYK`的颜色数量要少得多，而且智能手机、iTV 电视机、平板电脑、电子书阅读器、笔记本电脑、上网本或超级本都不支持`CMYK`颜色模型。


  就像你希望像素对像素地匹配分辨率和宽高比一样，在每个像素内，你也希望匹配你创建数字图像所针对的设备（打印机或显示器）所支持的那些颜色通道。


  如图 4-2 所示，通过此菜单序列访问的对话框允许你选择预定义的色彩配置文件，这些配置文件是行业中用于创建不同应用的标准，例如报纸印刷（如所选）或单页印刷。


  ![A978-1-4842-4060-1_4_Fig2_HTML.jpg](img/A978-1-4842-4060-1_4_Fig2_HTML.jpg)


  图 4-2.


  `转换为配置文件`对话框提供了一个配置文件选择器


  重要的是要注意，数码相机使用`RGB`颜色模式，通过一种称为电荷耦合器件（简称`CCD`）的设备来捕获数字图像数据。这意味着输入到你的数字图像编辑和合成软件包中的数据是`RGB`颜色模式，因此在这种颜色模式下进行编辑也是合乎逻辑的，因为转换为`CMYK`会导致图像丢失一些颜色。


  基于这些原因，大多数数字图像合成师使用`RGB`颜色模型进行图像合成工作，然后在打印前转换为`CMYK`。这样，你可以为当前数字图像合成项目生成`CMYK`和`RGB`两种表示形式。这是一个优势，因为你的图像合成作品既可以在显示器上使用，也可以进行打印。


  这种为打印而进行的转换过程被图像合成师用得越来越少，这或许可以解释为什么`GIMP`没有在其软件包中添加完整的`CMYK`颜色模型。尤其是随着数码相机和显示设备时代的到来，公众对模拟和印刷媒体形式的依赖大大减少。这种趋势每天都在持续，因为更多的智能手机、智能手表、平板电脑、电子阅读器和
  iTV 电视机正大量涌入当前的市场。


  如图 4-3 所示，GIMP 的`图像 ➤ 模式`子菜单不支持减色颜色模式。不过，如果你确实希望使用`GIMP`进行`CMYK`颜色模型和打印工作，有一种变通方法。有一个名为`Separate`的插件可用于`GIMP`，它能添加`CMYK`颜色模式支持，而`AUR`为
  Linux 用户提供了一个名为`Separate+`（增强版）的高级版本。你可以在以下网址找到它：[`https://aur4.archlinux.org/`](https://aur4.archlinux.org/)。


  ![A978-1-4842-4060-1_4_Fig3_HTML.jpg](img/A978-1-4842-4060-1_4_Fig3_HTML.jpg)


  图 4-3.


  GIMP 的`图像 ➤ 模式`菜单仅支持加色模型


  这些插件可以将`RGB`图像分离为`CMYK`，通过`ICC`配置文件和`LCMS`提供色彩管理，允许颜色的软打样，并允许你将`ICC CMYK`配置文件附加到已分色的数字图像文件上。


  `Separate+`插件具有与`Separate`相同的功能，但它还能够将`RGB`配置文件转换为其他`RGB`配置文件，并提供双色调支持。


  ### 加色模型：使用 RGB 颜色通道进行显示


  另一方面，`LED`、`LCD`和`OLED`显示器使用`RGB`加色模型，因为它们使用的是光而不是墨水。使用光（即加色模型）的一个优点是能产生更多的颜色。如果你曾见过棱镜或彩虹中呈现的颜色，你就会意识到用光产生的颜色极其绚丽多彩，这是墨水根本无法复制的。这就是本书主要关注`RGB`颜色的原因。


  加色模型与减色模型相反，因此，虽然混合红色和绿色墨水会得到深紫色，但混合红色和绿色光却会得到黄色！


  像素颜色由三种颜色的光定义：红色、绿色和蓝色；因此称为“`RGB`”。这些颜色在每个像素中以不同的量存在。显示屏幕通过将每个`RGB`颜色平面（或通道）的光波长相加来利用加色模型。这种颜色模式用于平板电脑、电子阅读器、智能手表、智能手机、iTV
  电视机、上网本、个人电脑和笔记本电脑中流行的`LED`、`LCD`和`OLED`显示器。


  在图 4-4 中，我已在 Photoshop 首选项对话框中开启了“使用通道颜色显示”模式。现在，通过选择颜色通道左侧的眼睛图标，你可以使用绿色通道的颜色查看绿色强度数据值。


  ![A978-1-4842-4060-1_4_Fig4_HTML.jpg](img/A978-1-4842-4060-1_4_Fig4_HTML.jpg)


  图 4-4.


