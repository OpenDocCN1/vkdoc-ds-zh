- '# 6. 数字成像的透明度：Alpha 通道


  现在你已经了解了大多数数字图像编辑和合成流程中使用的基本色彩深度，接下来我们将重点关注 32 位 `RGBA` 模式。`RGBA` 模式几乎等同于图像合成中除
  24 位彩色背景板之外的所有合成图层。我们也不会重点讨论高动态范围图像（`HDRI`），因为其数据量过大，且对本书大多数读者所针对的使用场景（包括互联网、电子书、智能电视、智能手机、智能手表、平板电脑、上网本、笔记本电脑等）并不实用。


  本章我们将重点讨论 `ARGB`（我会交替使用这些缩写）图像数据模式中的 alpha 分量。请注意，我在此处严格区分，并未将其称为“色彩模式”，因为只有 `RGB`
  分量是颜色。而额外的 `A` 分量代表透明度，它根本不是一种颜色，而是在数字图像合成“流程”中跨图层、平面或背景板合并颜色的方式。


  我们还将探讨如何在 Photoshop 和 GIMP 中访问 alpha 通道，以及这两个程序中的一些实用工具。这些工具将使你能够更轻松地处理 alpha 通道中保存的透明度数据。


  ### Alpha 通道：定义透明度


  让我们来看看 alpha 通道如何定义数字图像像素的透明度值，以及这些通道如何用于数字图像合成。Alpha 通道可以在数字图像合成软件中提供透明度（我称之为“静态”用途），也可以通过
  `PNG32` 图像资源，使用 Java、JavaFX、JavaScript、HTML5、CSS3 和 Android 等平台实时合成数字图像（我称之为“动态”用途）。在动态用途中，代码允许你以毫秒级精度访问像素透明度值，并按任意方式对这些数据进行动画处理。


  数字图像合成涉及无缝融合多个数字图像图层。可想而知，控制像素透明度是一个极其重要的概念。数字图像合成广泛应用于平面设计、故事片制作、游戏设计，以及近年来的应用程序开发等领域。


  当你希望在显示器上创建一幅看似单一图像（甚至动画），但实际上是由多个合成图像图层无缝集合而成的画面时，就会用到数字图像合成。


  设置图像或动画合成的主要原因之一，是让你能够通过将不同组件置于不同图层来对图像合成中的各个元素施加更精细的控制。我们将在第 8 章中更详细地介绍图层。


  要实现多层合成，始终需要 alpha 通道透明度值。你可以利用它精确控制像素颜色与其下方合成流程（图层堆栈）中其他图层同一 `x,y` 图像位置像素颜色的混合程度。


  与 `RGB` 色彩通道类似，alpha 通道具有 `256` 级透明度，范围从 100% 透明（`0`）到 100% 不透明（`255`）。每个像素都有不同的
  alpha 透明度数据，就像每个像素都有不同的 `RGB` 颜色数据一样。因此，alpha 通道与其伴随的色彩通道非常相似，区别在于它定义的是混合程度，而其他三个通道定义的是红、绿、蓝颜色的值或强度级别。


  让我们通过一个简单示例来看看这在 Photoshop CS6 中的效果：将一个环形元素叠加到我迄今为止在本书中一直使用的模特图像上。如图 6-1 所示，我将 `RingElement.png`（`PNG32`
  数字图像）添加到 Photoshop CS 图层堆栈的顶层，展示了装饰性环形元素的 alpha 通道数据（透明区域与不透明区域），以及这种 alpha 通道功能使你能够在数字图像合成流程中实现的效果。


