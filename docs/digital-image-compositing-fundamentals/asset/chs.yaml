  如此小的数据占用空间得益于这种数字图像合成流水线，因为它允许将数字图像资源细化为更小的文件，从而在互联网上实现更快的数据传输速度。


  这种数据细化可以类比为沙漏中的沙粒：沙粒越细，在任何瓶颈场景中流动得就越顺畅、越快。


  这里使用了许多索引色资源，使得网站看起来像真彩色，但实际并非如此。例如，页面上的所有六个动画 3D 元素都可以使用带 1 位预乘 Alpha 通道的索引色 animGIF
  文件格式。我使用平均背景色对反锯齿颜色进行预乘，以在平均周围背景色值中隐藏反锯齿效果。例如，对于蝴蝶鱼，这是一种淡蓝色的水色值。


