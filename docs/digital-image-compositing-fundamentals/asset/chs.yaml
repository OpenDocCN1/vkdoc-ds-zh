  等）的开发类书籍。


  Matthew Moodie，感谢他担任本书的开发编辑，感谢他在将本书打造成为领先的图像合成类书籍过程中所分享的经验和给予的指导。


  Mark Powers，感谢他担任本书的统筹编辑，感谢他始终勤勉尽责，确保我按时甚至提前完成各章节的交付。


