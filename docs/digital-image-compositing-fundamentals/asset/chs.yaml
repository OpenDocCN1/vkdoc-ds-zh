  棋盘格图案会显示在图层中任何具有透明度值的区域。因此，如果一个像素（或像素值区域）是部分不透明的（例如 50% 半透明），它就会显示 50% 的棋盘格图案。这是一个简单的数字图像合成示例，如图所示，视觉效果是无缝的。


