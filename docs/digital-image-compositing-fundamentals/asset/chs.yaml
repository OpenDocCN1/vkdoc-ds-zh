  这就是为什么我使用“模态”一词来描述如何在数字图像合成软件和 Photoshop 工具中工作。合成预览中发生的情况直接与许多操作模式的设置相关，例如你正在使用的工具、该工具的选项、当前选中的图层、选中的混合算法等等。我们将在下一章探讨数字成像软件的模态性，因为意识到所有这些模式是你作为合成师成功的关键。


