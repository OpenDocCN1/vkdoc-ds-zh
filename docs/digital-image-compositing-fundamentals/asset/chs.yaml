  ### HTML5 和 CSS3：标记合成


  虽然 Java (JavaFX) 是最流行的编程语言，但就使用范围而言，HTML5 和 CSS3 标记语言最为广泛。这是因为后两者在每个浏览器中都有体现，并使用名为
  WebKit 的 API，Android 和 iOS 也类似地使用了该 API，因此 HTML5 和 CSS3 在这些操作系统中也得到支持。毫不意外，目前已有多种
  HTML5 操作系统问世，它们来自 HTML5 浏览器的制造商，包括 Chrome OS、Firefox OS 和 Opera OS。这些系统用于智能手机、平板电脑和
  iTV 设备。例如，松下 iTV 设备使用 Firefox OS；索尼 Bravia iTV 设备使用 Opera OS；谷歌拥有一系列 Chrome 硬件产品；而阿尔卡特在国际上为其智能手机使用
  Mozilla Firefox OS。


  我使用无损编解码器，并结合 PNG24 和动画 GIF 用于背景板部分，以及 PNG32 用于所有 i3D UI 元素叠加层，合成了 HDTV 分辨率的网站 [`www.iTVset.com`](http://www.itvset.com/)。如图
  14-7 所示，整个网站看起来像是一幅真彩色数字图像，但却具有动画效果和交互性。该网站仅使用 24 行 HTML5 代码编写，并且图形图像资源数据的占用空间总量不到
  2MB。


