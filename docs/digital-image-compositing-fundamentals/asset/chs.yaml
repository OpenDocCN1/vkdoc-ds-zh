  在这第十一章中，我们详细介绍了 Photoshop 和 GIMP 中的插件滤镜，以及如何将它们用作“程序中的小程序”，为你的数字图像合成管线和项目增添更多特殊效果的震撼力。你了解了
  GIMP 的插件仓库，然后使用 GIMP 和 Photoshop 中的滤镜实现了特殊效果。


  在 GIMP 中，你通过添加另一个可用于应用特殊效果滤镜的图层，再次实现了无损编辑。这次，基于 GIMP 的工作方式，工作流程（模态操作）更加简单，因为你只需复制一个图层，该图层恰好包含了所需的图层蒙版。


  为了在 Photoshop 中实现类似的图像合成处理管线结果，你必须重新调整图层、图层蒙版、调整图层和调整图层蒙版处理管线。这向你展示了如何在 Photoshop
  CS6 中使用一些非常实用的新技巧、工作流程和艺术滤镜功能。


  在 第 12 章 中，我们将学习更多关于数字图像合成软件管线的知识，以及底层究竟发生了什么，从而让你理解为什么模态操作如此重要。




