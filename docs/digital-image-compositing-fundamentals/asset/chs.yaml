  网站访问数百个这类插件滤镜，然后在本章剩余部分，我们将探讨如何将插件滤镜运用到你数字图像合成的工作流程中。如果你访问 `gimp.org` 上的 GIMP 主页，你会在主页链接的右下角看到一个蓝色的**插件注册表**链接，如图
  11-1 所示。此链接可访问插件注册表，你可以在其中找到数百个可供下载的插件。这些插件由个人和公司为其他 GIMP 用户创建，供其在数字图像合成工作流程中使用。你也可以使用
