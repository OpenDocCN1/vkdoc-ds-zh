- '# 数字成像算法：混合模式


  既然您已经学会了如何在数字图像合成流程中使用图层，在本章中，我们将深入探讨并查看每个图层中包含的混合模式功能。这些混合模式在 GIMP 和 Photoshop
  中都存在，它们提供了跨不同图层组合像素的算法功能。这些混合算法最初由 Thomas Porter 和 Tom Duff 创建，在 Android API 中，混合模式实际上是
  `PorterDuff` 类的一部分，该类以这两人的名字命名。


  除了这些像素混合算法现在已可用于 Android 5 API 之外，Porter-Duff 模式也可在 JavaFX API 中使用，这意味着它们现在也包含在
  Java 7、Java 8 和 Java 9 中。最近，它们也被添加到 HTML5 中，使用了 CSS3 和 JavaScript，因此它们非常值得学习，特别是如果您有兴趣使用所有这些流行的开源软件开发平台来制作交互式新媒体内容。


  如果您想学习如何在 Java 代码中使用混合模式，而不仅仅是在数字图像合成软件内部，我有多本涵盖此内容的书，包括《Beginning Java 8 Games
  Development》（2014 年）、《Pro Android Graphics》（2013 年）和《Pro Java Games Development》（2016
  年），所有这些都由 Apress 出版。




  ### 像素混合：波特·达夫模式理论


  我在此将这些像素传输和像素混合模式称为“波特·达夫”，因为我是程序员，这样你就能知道它们是什么以及从何而来。尽管在安卓（编程）中是这样称呼的，但在 Photoshop
  和 GIMP 中并非如此，所以这个术语实际上只是你在行业交流中用来显得自己知识渊博的谈资。这些模式通常称为混合模式、传输模式，有时也称为图层模式或合成模式。


  波特·达夫模式应用于数字成像软件中，使用设置为其中一种模式的图层——默认为“正常”。正如你所料，默认的像素组合（混合）模式根本不使用任何算法，因此保持正常设置意味着不应用任何像素混合算法。


  但值得注意的是，Alpha 通道数据仍然会被应用，因为它定义了半透明度，并且始终会纳入你的合成管线，无论你的混合模式是设置为正常还是其他某种像素混合算法。


  Alpha 通道定义了直线（正常）不透明度，并不是一种通过混合像素颜色来改变其实际颜色值的复杂算法方法。Alpha 允许在图像图层和其下方内容之间进行逐像素淡入淡出，因此它使用的是简单的数学方法，至少与这些混合和传输模式中使用的复杂算法相比是这样。


  这意味着你可以利用 Alpha 通道在逐像素基础上控制混合模式的应用位置，并且拥有 256 个级别（8 位）的控制能力来调节这种混合的应用程度。因此，你的 Alpha
  通道和不透明度滑块（同时控制所有像素的淡入淡出，位于图 9-1 屏幕右上方）可以用来微调混合模式的应用效果。


