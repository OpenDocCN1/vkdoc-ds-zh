  由于 `Niki Black & White` 图层被排除在像素处理管线之外（因为眼睛图标（可见性）已关闭），合成引擎会认为颜色 `Niki` 图层位于 `Filter
  Special Effect` 图层下方。因此，可见性图标不仅会影响你所看到的内容，还会影响图像软件内部合成引擎所处理的内容。


  如果你希望合成引擎在不包含颜色数据的情况下重新处理管线，只需通过开启 `Niki Black & White` 图层的可见性来屏蔽颜色数据即可。


  如果你已完成对 `Filter Special Effect` 图层的操作，还可以使用 `图层` 面板顶部的 `锁定：画笔` 和 `锁定：Alpha` 图标来锁定该图层的蒙版和像素数据。这些是模态图标，因此你必须先选择要锁定的图层（如图
  12-1 所示），然后点击这些图标中的任意一个（或本例中的两个）来锁定图层数据。当你选择不同图层时，若锁定功能已启用，图标会变为蓝色；若未启用，则保持白色。


  由于你合成的图像因使用所有这些效果而变得有些“繁杂”，让我们将 `RingElement` 图层重新设置为 `Normal`（无混合）模式，并将金属颜色偏移至酒红色，以更好地衬托金色玻璃文字图层效果。


