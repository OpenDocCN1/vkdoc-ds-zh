- '# 数字图像的数据占用：优化


  `Textlayer`（文本图层）也利用一个 alpha 通道，通过强光混合模式、100% 的不透明度（即像素强度）以及内阴影效果层，将文本叠加在底部六个图层之上，从而创建出镂空文本的特殊效果。


