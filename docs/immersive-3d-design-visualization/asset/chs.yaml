  ## 测试与修复错误


  在上一章中，你创建了一个非常基础的关卡。现在，我们来修复一些常见错误。其中大部分与光照有关。每个问题的解决方法有很多种，因此在本章中，我将分享我在遇到某些问题时使用的方法。




  ## 照明问题


  在使用模块化资源时，经常会遇到如图 13-1 所示的照明问题。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig1_HTML.jpg](img/502922_1_En_13_Fig1_HTML.jpg)


  图 13-1


  光线泄漏


  你可以看到有一小束光线从墙壁中漏出，这看起来是错误的。发生此类情况通常是因为网格体中的某处存在缝隙或孔洞，导致整体未形成封闭水密结构。如果仔细检查网格体四周，您可能会看到类似图
  13-2 所示的情况。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig2_HTML.jpg](img/502922_1_En_13_Fig2_HTML.jpg)


  图 13-2


  网格体间的缝隙


  但如果从另一侧观察，却看不到缝隙，如图 13-3 所示。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig3_HTML.jpg](img/502922_1_En_13_Fig3_HTML.jpg)


  图 13-3


  网格体上无可见缝隙


  这是由于*背面剔除*造成的，这意味着网格体面只有一侧被渲染，另一侧被*剔除*，即未渲染。你可以直接看穿它，因此场景中的任何光线都会穿过被剔除的面。


  此情况的修复方法非常简单，只需将网格体重叠以封闭缝隙即可，如图 13-4 所示。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig4_HTML.jpg](img/502922_1_En_13_Fig4_HTML.jpg)


  图 13-4


  重叠网格体


  这会导致重叠区域出现*Z-fighting*现象，即重叠面会闪烁，因为 UE4 不确定哪个面应渲染在另一个面之上。但在我们的案例中，这可以接受，因为这种情况发生在玩家看不到的区域。然而，如果此现象发生在可见区域，则需通过仔细移动网格体以避免重叠来解决。


  ### 阴影接缝问题


  我们来看看阴影接缝问题及其解决方法。在上一章中，你调整了 Lightmass 设置以减少阴影接缝效果。图 13-5 再次展示了这些设置。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig5_HTML.jpg](img/502922_1_En_13_Fig5_HTML.jpg)


  图 13-5


  Lightmass 设置


  使用这些设置构建光照可以减少出现的光照接缝数量。但如果这不能完全解决问题，我们还有一个工具可用。选择存在阴影接缝的墙壁，如图 13-6 所示。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig6_HTML.jpg](img/502922_1_En_13_Fig6_HTML.jpg)


  图 13-6


  选择有接缝问题的墙壁


  接着，右键点击任意选中的墙壁，打开资源操作菜单。在此菜单中选择“合并 Actor”，如图 13-7 所示。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig7_HTML.jpg](img/502922_1_En_13_Fig7_HTML.jpg)


  图 13-7


  合并 Actor


  在“合并 Actor”设置面板中，找到“网格体替换方法”，选择“移除原有 Actor”，然后点击“合并 Actor”按钮（见图 13-8）。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig8_HTML.jpg](img/502922_1_En_13_Fig8_HTML.jpg)


  图 13-8


  合并 Actor 设置


  完成后，重新烘焙光照。阴影接缝应该不再出现。合并 Actor 不仅能消除此类问题，还能优化场景。图 13-9 是墙壁的最终效果。


  ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig9_HTML.jpg](img/502922_1_En_13_Fig9_HTML.jpg)


  图 13-9


  阴影接缝已消除


  本章内容到此结束。希望你现在能够解决场景中的这些常见问题。


  下一章，我们将扩展并完善场景。


  '
- '# 14. 设计可视化综合项目：美学提升


  你已经创建了一个简单关卡，设置了基础照明，并修复了此类项目中常见的一些错误。在本章中，你将扩展关卡并应用最终的光照设置。让我们开始吧。


  ## 扩展关卡


  到目前为止，我们的关卡还非常基础。我们将对其进行进一步扩展。首先，从俯视角度观察地图的大致布局（见图 14-1）。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig1_HTML.jpg](img/502922_1_En_14_Fig1_HTML.jpg)


  图 14-1


  房间布局


  如你所见，这是一个类似办公室的环境，并且使用了一些额外的资源。我们再次使用 UE4 的吸附系统。将吸附设置为 10 个单位，然后扩展之前创建的房间以形成一条走廊，如图
  14-2 所示。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig2_HTML.jpg](img/502922_1_En_14_Fig2_HTML.jpg)


  图 14-2


  放置墙壁


  让我们为扩展出的走廊添加一些窗户，如图 14-3 所示。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig3_HTML.jpg](img/502922_1_En_14_Fig3_HTML.jpg)


  图 14-3


  为走廊添加窗户


  接下来，添加其他区域的墙壁，如图 14-1 所示。然后，添加装饰物品。我们场景的内部区域因为没有照明而显得昏暗。为了在这些场景中工作，请点击图 14-4 中所示的“无光照”选项，切换到无光照模式。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig4_HTML.jpg](img/502922_1_En_14_Fig4_HTML.jpg)


  图 14-4


  切换到无光照模式


  在无光照模式下，开始为场景添加一些灯光。按住`Alt`键并沿任意轴拖动之前创建的光源以复制它。复制光源后，将其放置在每一个灯光模型下方，如图 14-5 所示。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig5_HTML.jpg](img/502922_1_En_14_Fig5_HTML.jpg)


  图 14-5


  放置灯光 Actor


  之后，烘焙光照以查看结果。如果某些地方过暗，则添加更多灯光以达到你想要的亮度。我的结果如图 14-6 和图 14-7 所示。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig6_HTML.jpg](img/502922_1_En_14_Fig6_HTML.jpg)


  图 14-6


  接待区视图


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig7_HTML.jpg](img/502922_1_En_14_Fig7_HTML.jpg)


  图 14-7


  办公工作区


  如果你的电脑难以处理如此多的灯光，还有替代方案。尝试增加灯光强度并进一步提高`衰减半径`值。你还可以禁用`使用平方反比衰减`，这样灯光可以在更远距离保持强度。这需要一些试错和参数调整。作为最后的手段，如果你遇到严重的性能问题，可以尝试此方法。




  ## 添加最后的润色


  现在让我们为关卡添加一些最后的润色。当场景中需要反射表面时，你需要添加一个*反射捕获*。前往`放置 Actor`，使用搜索栏搜索`reflection`（参见图
  14-8）。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig8_HTML.jpg](img/502922_1_En_14_Fig8_HTML.jpg)


  图 14-8：搜索反射捕获


  将`球体反射捕获`拖放到你的场景中。你可以在场景中看到该 Actor 的边界（参见图 14-9）。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig9_HTML.jpg](img/502922_1_En_14_Fig9_HTML.jpg)


  图 14-9：反射捕获的边界


  你可以缩放该 Actor 来增大边界球体的大小。这将决定它在场景中影响的网格体数量。一个常规场景需要分散放置几个这样的 Actor，如图 14-10 所示。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig10_HTML.jpg](img/502922_1_En_14_Fig10_HTML.jpg)


  图 14-10：场景中的球体反射捕获


  你可以使用相同的方式，通过平面反射来创建镜子。将`平面反射`拖放到你的场景中并进行缩放，使其覆盖镜面的大致表面区域（参见图 14-11）。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig11_HTML.jpg](img/502922_1_En_14_Fig11_HTML.jpg)


  图 14-11：添加平面反射


  添加一个玻璃透视视图，如图 14-12 所示。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig12_HTML.jpg](img/502922_1_En_14_Fig12_HTML.jpg)


  图 14-12：玻璃透视视图


  最后，图 14-13 展示了一个画廊视图。


  ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig13_HTML.jpg](img/502922_1_En_14_Fig13_HTML.jpg)


  图 14-13：画廊视图


  本章关于设计可视化的内容到此结束。在下一章中，你将通过一些最后的提示和建议以及作品集展示来结束本书。


  '
- "# 15. 沉浸式设计作品集\n\n你已经设置好了关卡和光照。在本章中，你将进行清理和最终定稿。最后，我会为你提供一些关于如何在这个领域继续前行的最终建议。\n\
  \n## 清理和预览场景\n\n浏览你的`内容浏览器`，找到已导入但未使用的资产。通常，导入商城包时会包含大量你最终用不到的额外资产。你可以逐一检查并将其从项目中删除，以减小项目体积。如果有任何不需要的入门内容文件，直接删除即可（参见图\
  \ 15-1）。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig1_HTML.jpg](img/502922_1_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1：删除不需要的文件\n\n现在，让我们以第一人称视角预览场景。你可以点击`播放`（参见图 15-2）或按 `Alt+P` 开始播放场景。\n\n\
  ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig2_HTML.jpg](img/502922_1_En_15_Fig2_HTML.jpg)\n\
  \n图 15-2：播放场景\n\n你可以像玩家体验一样在场景中四处移动。要在 VR 中播放场景，你需要将 VR 头显连接到电脑。点击`播放`旁的箭头，你应该能看到`VR\
  \ 预览`选项，如图 15-3 所示。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig3_HTML.jpg](img/502922_1_En_15_Fig3_HTML.jpg)\n\
  \n图 15-3：VR 预览选项\n\n## 交互式模拟\n\n场景中有几扇门，你可以在图片中看到。在本节中，你将创建用于开关门的交互系统。这是一个非常简单的设置，需要两个关键组件。首先，需要两个名为`门框`和`门`本身的网格体（如果你没有自己的网格体，可以在\
  \ UE4 的入门内容中找到）。其次，需要一个带有约束的简单物理设置来控制运动。\n\n让我们先在一个合适的位置添加一个门框，如图 15-4 所示。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig4_HTML.jpg](img/502922_1_En_15_Fig4_HTML.jpg)\n\
  \n图 15-4：添加门框\n\n接下来，将门网格体添加到门框中，如图 15-5 所示。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig5_HTML.jpg](img/502922_1_En_15_Fig5_HTML.jpg)\n\
  \n图 15-5：添加门网格体\n\n接下来，在`内容浏览器`中双击门网格体，打开`资产详情`窗口。在此处，点击`碰撞`并启用`简单碰撞`以可视化碰撞边界。选择并删除你拥有的任何默认碰撞（参见图\
  \ 15-6）。它应该显示为一个绿色方框。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig6_HTML.jpg](img/502922_1_En_15_Fig6_HTML.jpg)\n\
  \n图 15-6：可视化并删除默认碰撞。\n\n接下来，通过点击`碰撞 > 添加盒体简单碰撞`来添加`简化盒体碰撞`（参见图 15-7）。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig7_HTML.jpg](img/502922_1_En_15_Fig7_HTML.jpg)\n\
  \n图 15-7：向网格体添加简单盒体碰撞。\n\n选择该简单盒体碰撞，按 `R` 键并缩放它，如图 15-8 所示。将其缩放到足够小，以确保墙壁和周围门框的碰撞不会干扰它。\n\
  \n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig8_HTML.jpg](img/502922_1_En_15_Fig8_HTML.jpg)\n\
  \n图 15-8：缩放碰撞\n\n在右侧的`细节`面板中，向下滚动直到看到`碰撞`选项卡。在其下方，确保`碰撞复杂度`设置为`项目默认值`。接下来，将`碰撞预设`设置为`自定义`（参见图\
  \ 15-9）。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig9_HTML.jpg](img/502922_1_En_15_Fig9_HTML.jpg)\n\
  \n图 15-9：碰撞设置\n\n在`碰撞响应`下，通过点击复选框，将`PhysicsBody`设置为`忽略`，如图 15-10 所示。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig10_HTML.jpg](img/502922_1_En_15_Fig10_HTML.jpg)\n\
  \n图 15-10：设置 PhysicsBody 的碰撞响应\n\n到此你就完成了所有设置，点击左上角的`保存`来保存所有设置。\n\n选择你添加到场景中的那扇门。在`细节`面板中，将`移动性`设置为`可移动`，这允许门投射动态阴影，并防止光照从固定位置烘焙到门上（参见图\
  \ 15-11）。这与物理无关；纯粹是为了光照目的。如果你不想要动态阴影，并且更看重性能而非视觉效果，完全可以忽略此步骤。或者，你也可以将其设置为`固定`，作为静态和动态之间的折衷方案。\n\
  \n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig11_HTML.jpg](img/502922_1_En_15_Fig11_HTML.jpg)\n\
  \n图 15-11：将网格体设置为可移动\n\n\n\n向下滚动。在“`Physics`”选项卡下，启用`Simulate Physics`和`MassInKg`，并取消勾选`Enable\
  \ Gravity`复选框以禁用重力（见图 15-12）。顾名思义，`Simulate Physics`使我们的对象模拟物理效果。`MassInKg`允许你设置体重。禁用重力是因为我们不希望网格体受到重力影响，否则会产生不良效果。\n\
  \n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig12_HTML.jpg](img/502922_1_En_15_Fig12_HTML.jpg)\n\
  \n图 15-12\n\n物理设置-1\n\n我们将`MassInKg`提高到一个较大的数值，比如 300，因为你希望门感觉很重。不过，按照现实世界的标准，这对门来说可能是一个荒谬的重量，但在\
  \ UE4 中，这却是正常的感觉。接下来，将`Angular Damping`增加到 6 或 7 这样的数值。这会增加门旋转时的阻力，仿佛存在来自现实世界的摩擦力、空气阻力以及其他因素（见图\
  \ 15-13）。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig13_HTML.jpg](img/502922_1_En_15_Fig13_HTML.jpg)\n\
  \n图 15-13\n\n设置 MassInKg 和 Angular Damping\n\n当我们的玩家与门发生碰撞时，我们希望门旋转，但根据当前设置，当你触碰门时，门会直接向后飞出去。现在播放你的关卡来测试一下。你需要约束这个物体，使其在触碰时仅能沿\
  \ Z 轴旋转。为什么是 Z 轴？按下`E`键，在所有三个轴上选择并旋转你的门。注意，沿 Z 轴的旋转感觉是门最自然的旋转方式。\n\n现在，让我们在门上激活相关的约束。首先，锁定门在\
  \ X、Y、Z 轴上的位置，这些轴是门的铰链所在，使其无法移动。在“`Physics`”选项卡下，找到“`Constraints`”。点击“`Lock Position`”旁边所有\
  \ X、Y、Z 的复选框。此外，你希望旋转仅沿 Z 轴发生，因此点击“`Lock Rotation`”旁边的 X 和 Y 复选框。你的设置应类似于图 15-14。\n\
  \n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig14_HTML.jpg](img/502922_1_En_15_Fig14_HTML.jpg)\n\
  \n图 15-14\n\n约束设置\n\n现在播放你的关卡，并尝试推门。你会看到你的门现在可以像真门一样被推开并自然打开，如图 15-15 所示。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig15_HTML.jpg](img/502922_1_En_15_Fig15_HTML.jpg)\n\
  \n图 15-15\n\n启用了物理效果的门\n\n## 作品集展示\n\n让我们来看一些渲染图并进行分析。图 15-16 展示了来自 Quixel Megascans\
  \ 的植物素材。它们是现成的 3D 资源，可以直接导入并使用，无需太多麻烦。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig16_HTML.jpg](img/502922_1_En_15_Fig16_HTML.jpg)\n\
  \n图 15-16\n\n来自 Quixel Megascans 的植物资源\n\n接下来，我们来看看场景中的玻璃材质。它叫做“`Advanced Glass\
  \ Material Pack`”，是 UE4 市场上一款免费资源包的一部分（见图 15-17）。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig17_HTML.jpg](img/502922_1_En_15_Fig17_HTML.jpg)\n\
  \n图 15-17\n\n玻璃材质\n\n同样的玻璃材质也出现在图 15-18 中。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig18_HTML.jpg](img/502922_1_En_15_Fig18_HTML.jpg)\n\
  \n图 15-18\n\n大型窗户的玻璃材质\n\n图 15-19 和 15-20 展示了一个浴室的全景镜头。目的是捕捉其中放置的所有物品。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig20_HTML.jpg](img/502922_1_En_15_Fig20_HTML.jpg)\n\
  \n图 15-20\n\n浴室的俯视角\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig19_HTML.jpg](img/502922_1_En_15_Fig19_HTML.jpg)\n\
  \n图 15-19\n\n浴室全景镜头\n\n接下来是配备了所有电脑和家具的办公室房间。如你所见，这里有很多重复的对象。这就是模块化设计的优势。你可以用较少的资源填充整个场景（见图\
  \ 15-21 和 15-22）。\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig22_HTML.jpg](img/502922_1_En_15_Fig22_HTML.jpg)\n\
  \n图 15-22\n\n办公室全景镜头 2\n\n![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig21_HTML.jpg](img/502922_1_En_15_Fig21_HTML.jpg)\n\
