- "# 8. PBR 集成纹理\n\n在本章中，你将了解 PBR 集成纹理工作流程。有多种工具可用于辅助你为资源添加纹理。在本章中，我们将使用 Quixel Megascans\
  \ 和 Substance Painter。首先简单介绍一下这两款软件。\n\n## Substance Painter\n\nSubstance Painter\
  \ 是一款行业标准的纹理绘制工具，被 AAA 级和独立工作室广泛使用。它非常用户友好且易于使用。庞大的社区不断提供免费资源，供你在项目中使用。还有一个名为 Substance\
  \ Source 的高级资源库，如果你订阅了 Substance Suite，就可以访问其中经过精选的高质量资源库。\n\n让我们来看看 Substance Painter\
  \ 的基本控制和界面。本书使用的是 2019.3.2 版本。当你首次启动 Substance Painter 时，你的窗口看起来类似于图 8-1。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig1_HTML.jpg](img/502922_1_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** Substance Painter 界面\n\n屏幕底部是*资源架*，它允许你访问纹理处理过程中所需的各种资源。**属性**窗口用于更改和调整图层、笔刷、材质等。**图层**面板允许你添加、编辑和管理图层。Substance\
  \ Painter 是一个基于图层的纹理绘制程序；因此，你会经常与图层打交道。**纹理集设置**面板允许你管理与纹理集相关的属性。\n\n现在让我们讨论 Substance\
  \ Painter 的控制方式。按下 `Alt + 鼠标左键` 可旋转视图。按下 `Alt + 鼠标中键` 可平移视图。按下 `Alt + 鼠标右键` 可缩放视图。表\
  \ 8-1 列出了许多快捷键及其用途。\n\n**表 8-1** Substance Painter 快捷键\n\n| 快捷键 | 作用 |\n| :--- |\
  \ :--- |\n| `Alt + 鼠标左键` | 旋转视图 |\n| `Alt + 鼠标中键` | 平移视图 |\n| `Alt + 鼠标右键` | 缩放视图\
  \ |\n| `Alt + Shift + 鼠标左键` | 旋转相机并吸附 |\n| `F` | 将相机居中到网格体 |\n| `F5` | 切换到透视相机 |\n\
  | `F6` | 切换到正交相机 |\n| `鼠标左键` | 绘制 / 使用工具 |\n| `]` | 增大工具尺寸 |\n| `[` | 减小工具尺寸 |\n\
  | `F9` | 绘制模式 |\n| `F10` | 渲染模式 |\n| `Shift + 鼠标左键` | 绘制直线 |\n| `Ctrl + Shift +\
  \ 鼠标左键` | 绘制直线并吸附 |\n| `B` | 切换显示的网格贴图 |\n| `M` | 材质模式 |\n| `C` | 切换显示的通道 |\n\n\n\
  \n## Quixel Megascans\n\n现在让我们看看 Quixel Megascans，特别是 Quixel Bridge。Quixel Bridge\
  \ 是一款软件，只需点击几下，即可将 Quixel Megascans 无缝集成到其他 DCC 应用程序中。图 8-2 展示了 Quixel Bridge 的界面。\n\
  \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig2_HTML.jpg](img/502922_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\nQuixel Bridge\n\nQuixel Megascans 对虚幻引擎 4 用户免费。您可以访问包含超过 12，000 个 3D\
  \ 扫描资产的完整库，其中包括纹理和 3D 网格体。在 Quixel Bridge 中点击一个资产即可下载并将其存储在您的硬盘上。资产下载完成后，您可以将其导出到您选择的任何\
  \ DCC 应用程序（见图 8-3）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig3_HTML.jpg](img/502922_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\nQuixel Bridge 导出设置\n\n对于您导出的每个应用程序，都有一个插件来辅助此交换过程。当您从列表中选择一个 DCC 应用程序时，您将可以选择下载并安装相关插件，如图\
  \ 8-4 所示。\n\n一旦插件下载并安装完毕，您就可以开始使用了。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig4_HTML.jpg](img/502922_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n为所选 DCC 下载插件\n\n本项目使用虚幻引擎 4 及其插件。首先，下载 UE4 插件。接着，将引擎版本设置为您正在使用的版本。然后，将安装文件夹设置为与\
  \ UE4 安装目录相同。项目位置则应与您保存项目的文件夹相同（见图 8-5）。在导出资产时，请确保保持 UE4 运行；否则，会出现错误提示。在将资产导出到 UE4\
  \ 之前，UE4 应处于运行状态，并且 Livelink 应已安装并激活。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig5_HTML.jpg](img/502922_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5\n\n为 UE4 设置插件\n\n## PBR 纹理绘制\n\n让我们开始为部分资产绘制纹理。我们将从 Substance Painter 开始。首先，您需要导入一个资产——此处我们使用沙发资产。启动\
  \ Substance Painter，然后点击“文件” ➤ “新建项目”（见图 8-6）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig6_HTML.jpg](img/502922_1_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6\n\n新建项目\n\n将项目模板设置为“虚幻引擎 4”，选择沙发文件，其余选项保持默认。接着，点击“确定”创建项目（见图 8-7）。确保“导入摄像机”未被勾选，因为本项目不需要导入摄像机。\n\
  \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig7_HTML.jpg](img/502922_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7\n\n新项目设置\n\n沙发应显示在屏幕中央。现在您可以准备烘焙网格贴图了。前往“纹理集设置”并点击“烘焙网格贴图”（见图 8-8）。首次打开\
  \ Substance Painter 时，屏幕会分为两个视图。您可以按 `F1`、`F2` 或 `F3` 在布局模式之间切换，它们分别对应分割布局、仅 3D\
  \ 布局和仅 2D 布局。按 `F2` 切换到仅 3D 视图模式。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig8_HTML.jpg](img/502922_1_En_8_Fig8_HTML.jpg)\n\
  \n图 8-8\n\n烘焙网格贴图\n\n烘焙窗口打开后，您可以更改与网格贴图烘焙相关的若干属性。首先，禁用 ID 通道，因为我们的网格体没有任何 ID 贴图。接着，点击“高清晰度网格体”选项旁边的添加文件图标，导入高多边形网格体（见图\
  \ 8-9）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig9_HTML.jpg](img/502922_1_En_8_Fig9_HTML.jpg)\n\
  \n图 8-9\n\n导入高多边形网格体\n\n让我们稍微增加最大前向和后向距离（分别增加 0.03 和 0.05）。这会略微增加光线投射距离，有助于烘焙。这个数字通常难以确定；尝试一个较小的值看看效果会很有帮助。\n\
  \n一个名为“平均法线”的选项默认是启用的。如果您的网格体有硬法线，启用它是有益的，这样 Substance Painter 会平均高多边形和低多边形贴图之间的法线，确保更平滑的结果。当然，如果出于某些原因需要保留硬法线，您可以禁用此选项。由于高多边形和低多边形网格体都使用了平滑法线，您可以禁用它。但如果您希望网格体上的法线保持平滑，也可以保持启用；这不会有太大区别。至此，您的设置应该类似于图\
  \ 8-10 所示。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig10_HTML.jpg](img/502922_1_En_8_Fig10_HTML.jpg)\n\
  \n图 8-10\n\n烘焙设置\n\n接下来，向下滚动并将“匹配”设置更改为“按网格体名称”，如图 8-11 所示。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig11_HTML.jpg](img/502922_1_En_8_Fig11_HTML.jpg)\n\
  \n图 8-11\n\n按网格体名称匹配\n\n转到“环境光遮蔽”并将“自身遮蔽”设置为“按相同网格体名称”。接着，禁用“厚度”，因为您不需要这张贴图。然后，点击“烘焙”。烘焙完成后，您会看到法线贴图细节已烘焙到您的网格体中（见图\
  \ 8-12）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig12_HTML.jpg](img/502922_1_En_8_Fig12_HTML.jpg)\n\
  \n图 8-12\n\n烘焙到网格体中的法线信息\n\n\n\n### 贴图制作\n\n现在我们为沙发添加纹理。将 `Fabric Rough Aligned`\
  \ 拖放到你的 `Layer Stack`（图层堆栈）中。你应该会看到类似于图 8-13 所示的效果。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig13_HTML.jpg](img/502922_1_En_8_Fig13_HTML.jpg)\n\
  \n图 8-13\n\n`Fabric Rough Aligned`（粗糙织物对齐）\n\n你的网格看起来应该像图 8-14。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig14_HTML.jpg](img/502922_1_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14\n\n应用了`Fabric`（织物）材质的网格\n\n接下来，进入 `Properties`（属性）窗口，在 `Projection`（投影）菜单中，选择\
  \ `Tri-planar`（三平面投影），这样可以确保你的 UV 接缝被隐藏起来（见图 8-15）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig15_HTML.jpg](img/502922_1_En_8_Fig15_HTML.jpg)\n\
  \n图 8-15\n\n`Tri-planar`（三平面）投影\n\n接着，在 `UV transformations`（UV 变换）下，将 `Scale`（缩放）增加到\
  \ `4`。你的结果应该类似于图 8-16。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig16_HTML.jpg](img/502922_1_En_8_Fig16_HTML.jpg)\n\
  \n图 8-16\n\n材质已缩放\n\n然后，在 `Parameters`（参数）下，将颜色改为深蓝色（见图 8-17）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig17_HTML.jpg](img/502922_1_En_8_Fig17_HTML.jpg)\n\
  \n图 8-17\n\n更改材质颜色\n\n你的结果看起来应该类似于图 8-18。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig18_HTML.jpg](img/502922_1_En_8_Fig18_HTML.jpg)\n\
  \n图 8-18\n\n最终的沙发\n\n沙发已准备好导出到 UE4。\n\n接下来，我们为耳机添加纹理（见图 8-19）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig19_HTML.jpg](img/502922_1_En_8_Fig19_HTML.jpg)\n\
  \n图 8-19\n\n重叠的高模和低模\n\n选择低模，转到 `File ➤ Export`（文件 ➤ 导出），选择 `Obj exporter`（Obj 导出器）。将其导出到方便的位置，并命名为\
  \ `Headset_low`。用同样的方式导出高模，但使用名称 `Headset_high`。之后，打开 `Substance Painter`。\n\n以导入沙发模型相同的方式导入耳机模型。完成后，转到\
  \ `Bake`（烘焙），使用与沙发类似的设置，但这一次，导入 `Headset_high` 模型作为高模（见图 8-20），并将 `Match`（匹配）保持为默认设置（即，不要将其设置为\
  \ `By Mesh Name`（按网格名称））。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig20_HTML.jpg](img/502922_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20\n\n烘焙设置\n\n完成此操作后，你应能看到细节已被烘焙到你的网格中。\n\n你的结果应该看起来像图 8-21。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig21_HTML.jpg](img/502922_1_En_8_Fig21_HTML.jpg)\n\
  \n图 8-21\n\n烘焙结果\n\n### 应用材质\n\n让我们开始应用一些材质，从素材库中将 `Plastic Matte Pure`（纯哑光塑料）材质添加到我们的网格中（见图\
  \ 8-22）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig22_HTML.jpg](img/502922_1_En_8_Fig22_HTML.jpg)\n\
  \n图 8-22\n\n`Plastic Matte Pure`（纯哑光塑料）\n\n接下来，转到 `Material Properties`（材质属性）并更改设置，如图\
  \ 8-23 所示。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig23_HTML.jpg](img/502922_1_En_8_Fig23_HTML.jpg)\n\
  \n图 8-23\n\n材质设置\n\n在 `Layer Stack`（图层堆栈）中双击 `Plastic Material`（塑料材质）并将其重命名为 `Metal_Default`（见图\
  \ 8-24）。这是可选项。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig24_HTML.jpg](img/502922_1_En_8_Fig24_HTML.jpg)\n\
  \n图 8-24\n\n重命名材质\n\n图 8-25 显示整个网格都附加上了该材质——甚至连那些你不想让它变成金属的区域也是如此。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig25_HTML.jpg](img/502922_1_En_8_Fig25_HTML.jpg)\n\
  \n图 8-25\n\n材质覆盖了整个网格\n\n右键点击该材质并选择 `Add Black Mask`（添加黑色遮罩）（见图 8-26）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig26_HTML.jpg](img/502922_1_En_8_Fig26_HTML.jpg)\n\
  \n图 8-26\n\n添加黑色遮罩\n\n你会看到整个模型变得没有纹理了。确保选中该遮罩，然后点击 `Polygon Fill`（多边形填充）和 `Mesh\
  \ Fill`（网格填充）。同时，确保填充颜色设置为白色（见图 8-27）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig27_HTML.jpg](img/502922_1_En_8_Fig27_HTML.jpg)\n\
  \n图 8-27\n\n填充设置\n\n点击你想要变成金属的部分。金属材质就会填充到网格的那些部分（见图 8-28）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig28_HTML.jpg](img/502922_1_En_8_Fig28_HTML.jpg)\n\
  \n图 8-28\n\n填充金属颜色\n\n接下来，尝试用 `Fabric`（织物）材质填充网格上白色、无纹理的区域。首先，添加一个你选择的 `Fabric`（织物）材质（在本例中，是深色的\
  \ `Knitted Sweater`（针织毛衣）材质），然后在该材质上应用一个黑色遮罩。使用图 8-27 中所示的填充设置，点击无纹理的区域。你的结果应该类似于图\
  \ 8-29。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig29_HTML.jpg](img/502922_1_En_8_Fig29_HTML.jpg)\n\
  \n图 8-29\n\n织物材质应用于网格的某些部分\n\n如你所见，网格过于干净了。让我们为其添加一些粗糙度变化——特别是针对金属部分。首先，右键点击你的金属材质并选择\
  \ `Duplicate`（复制）。接着，右键点击复制后材质的遮罩并选择 `Clear Mask`（清除遮罩）。最后，右键点击复数金属材质现已清除的遮罩，并选择\
  \ `Add Generator`（添加生成器）（见图 8-30）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig30_HTML.jpg](img/502922_1_En_8_Fig30_HTML.jpg)\n\
  \n图 8-30\n\n添加生成器\n\n接下来，点击 `Generator`（生成器）并选择 `Dirt`（污垢）生成器（见图 8-31）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig31_HTML.jpg](img/502922_1_En_8_Fig31_HTML.jpg)\n\
  \n图 8-31\n\n添加 `Dirt`（污垢）生成器\n\n\n\n### 处理污垢效果\n\n现在你会在网格上看到程序化生成的污垢。你可以在`属性`面板中修改`污垢`设置。使用`污垢级别`选项（见图\
  \ 8-32）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig32_HTML.jpg](img/502922_1_En_8_Fig32_HTML.jpg)\n\
  \n图 8-32  \n控制污垢量\n\n接下来，点击`复制`的材质，使其属性显示在`属性`选项卡中。在此向下滚动，并禁用除`粗糙度`外的所有通道（见图 8-33）。\n\
  \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig33_HTML.jpg](img/502922_1_En_8_Fig33_HTML.jpg)\n\
  \n图 8-33  \n禁用除粗糙度外的所有通道\n\n接着，将`粗糙度`数值增加到`0.35`。现在你的网格应该看起来类似于图 8-34。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig34_HTML.jpg](img/502922_1_En_8_Fig34_HTML.jpg)\n\
  \n图 8-34  \n网格上的程序化污垢效果\n\n如你所见，污垢效果现在已出现在我们的网格上。但此刻它过于强烈。右键点击遮罩，并从列表中选择一个滤镜（见图\
  \ 8-35）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig35_HTML.jpg](img/502922_1_En_8_Fig35_HTML.jpg)\n\
  \n图 8-35  \n添加滤镜\n\n点击空的滤镜容器，并从`滤镜`菜单中选择`模糊`（见图 8-36）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig36_HTML.jpg](img/502922_1_En_8_Fig36_HTML.jpg)\n\
  \n图 8-36  \n应用模糊滤镜\n\n在`属性`面板中将`模糊强度`降低至`0.3`（见图 8-37）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig37_HTML.jpg](img/502922_1_En_8_Fig37_HTML.jpg)\n\
  \n图 8-37  \n降低模糊强度\n\n如果模糊效果仍然过于明显，点击当前通道下拉菜单并选择`粗糙度`（见图 8-38）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig38_HTML.jpg](img/502922_1_En_8_Fig38_HTML.jpg)\n\
  \n图 8-38  \n更改当前通道\n\n接下来，将图层的不透明度降低到一个较低的值；在我们的案例中，设为`40`（见图 8-39）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig39_HTML.jpg](img/502922_1_En_8_Fig39_HTML.jpg)\n\
  \n图 8-39  \n降低图层不透明度\n\n接着，通过点击图 8-40 高亮显示的按钮，创建一个`绘制`图层。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig40_HTML.jpg](img/502922_1_En_8_Fig40_HTML.jpg)\n\
  \n图 8-40  \n创建新的绘制图层\n\n创建好此图层后，进入其属性，并禁用除`法线`外的所有通道（见图 8-41）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig41_HTML.jpg](img/502922_1_En_8_Fig41_HTML.jpg)\n\
  \n图 8-41  \n仅激活法线通道\n\n切换到工具架上的`硬表面`类别，并选择任意一个你喜欢的法线贴图（见图 8-42）。我选择了`通风圆孔`。\n\n\
  ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig42_HTML.jpg](img/502922_1_En_8_Fig42_HTML.jpg)\n\
  \n图 8-42  \nSubstance Painter 自带的硬表面贴图\n\n将其拖放到`属性`窗口中的`法线贴图`槽位内（见图 8-43）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig43_HTML.jpg](img/502922_1_En_8_Fig43_HTML.jpg)\n\
  \n图 8-43  \n将法线贴图拖放到法线贴图槽位\n\n现在你已经准备好绘制这个细节了。你可以使用`[`和`]`键分别减小和增大笔刷的大小。在开始绘制之前，你需要移除笔刷的阿尔法贴图。为此，向上滚动并点击`阿尔法贴图`槽位旁边的`X`按钮（见图\
  \ 8-44）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig44_HTML.jpg](img/502922_1_En_8_Fig44_HTML.jpg)\n\
  \n图 8-44  \n移除阿尔法贴图\n\n之后，只需点击你的网格来绘制阿尔法贴图。你可以随时将另一张法线贴图拖放到法线贴图槽位来绘制不同的图案。我的结果如图\
  \ 8-45 所示。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig45_HTML.jpg](img/502922_1_En_8_Fig45_HTML.jpg)\n\
  \n图 8-45  \n法线绘制\n\n最后，创建另一个`绘制`图层，但这次，仅启用`颜色`通道。使用默认笔刷，为绘制的法线细节填充一些颜色，如图 8-46 所示。请记住，你可以按住`Shift`键在两次点击之间绘制直线。\n\
  \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig46_HTML.jpg](img/502922_1_En_8_Fig46_HTML.jpg)\n\
  \n图 8-46  \n绘制一些细节\n\n如果在`透视`视图中绘制时遇到问题，你可以按`F6`切换到`正交`视图。按`F5`切换回`透视`视图。此外，你可以通过点击图\
  \ 8-47 中高亮显示的按钮来启用`对称`。`对称`允许你在一侧进行工作，同时你的操作会自动应用到另一侧。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig47_HTML.jpg](img/502922_1_En_8_Fig47_HTML.jpg)\n\
  \n图 8-47  \n启用对称\n\n本章概述了基于 PBR 的贴图工作流程。创建真实的贴图还有更多内容，但这已超出本书范围。希望到目前为止你所学到的知识能够引导你走得更远。\n\
  \n在下一章中，你将学习 UE4 中的材质集成。\n\n"
- '# 9. 材质设计与集成


  你已经创建了一些材质，现在让我们看看如何在 UE4 中导入和集成它们。在本章中，你将导出 Substance Painter 中的材质，并学习如何为 UE4 设置导出器。然后，将纹理导入
  UE4 并设置主材质。之后，你将使用 Quixel Bridge 从 Quixel Megascans 导入材质，并见证 Quixel Bridge 的速度和强大功能。




  ## 从 Substance Painter 导出


  首先，打开你在 Substance Painter 中创建的文件。然后前往 `文件 ➤ 导出纹理`（见图 9-1）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig1_HTML.jpg](img/502922_1_En_9_Fig1_HTML.jpg)


  图 9-1


  导出纹理


  在 `导出文档` 窗口中，将 `配置` 设置为 `Unreal Engine 4 (Packed)`，如图 9-2 所示。这可确保纹理以 UE4 能够正确使用的方式导出。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig2_HTML.jpg](img/502922_1_En_9_Fig2_HTML.jpg)


  图 9-2


  更改导出配置


  要查看纹理是如何设置的，请前往 `配置 ➤ Unreal Engine 4 (Packed)`（见图 9-3）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig3_HTML.jpg](img/502922_1_En_9_Fig3_HTML.jpg)


  图 9-3


  导出的纹理配置


  在 `配置` 窗口的 `输出贴图` 下，我们的纹理贴图已准备好导出。请注意各项设置。名为 `BaseColor` 的贴图有一个 RGB（红、绿、蓝）输入和一个
  A 输入；每个输入都连接了一张输入贴图。根据输出贴图中的颜色和输入贴图中对应的颜色，你可以看出连接了哪张贴图。


  `OcclusionRoughnessMetallic` 贴图有三个输入连接到一张输出纹理贴图。为了简便，这张贴图有时被称为 ORM（环境光遮蔽、粗糙度、金属度）贴图。环境光遮蔽贴图、粗糙度贴图和金属度贴图都是灰度图。当三个不同通道被连接到一张纹理上时，可以节省内存和空间，并优化你的项目。


  这些预设由 Substance Painter 团队设置，以便你可以快速导出纹理贴图并将其发送到你选择的数字内容创作（DCC）应用程序中。


  现在，让我们切换回 `导出` 选项卡，更改更多设置。将文档分辨率提高到 `2048×2048`，并将图像格式设置为 `targa`，如图 9-4 所示。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig4_HTML.jpg](img/502922_1_En_9_Fig4_HTML.jpg)


  图 9-4


  导出设置


  现在，你可以导出贴图了。将导出目标设置到所需的文件夹，然后点击 `导出`（见图 9-5）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig5_HTML.jpg](img/502922_1_En_9_Fig5_HTML.jpg)


  图 9-5


  设置导出目标并导出纹理


  ## 在 UE4 中处理材质


  材质导出后，打开 UE4。但在将这些材质放入 UE4 之前，请遵循纹理的命名约定。在你保存纹理的任何位置打开它们，然后将它们分别重命名为 `T_Sofa_BaseColor`、`T_Sofa_OcclusionRoughnessMetallic`
  和 `T_Sofa_Normal`。


  创建一个用于存储纹理贴图的文件夹。将此文件夹命名为 `Textures`。将你的纹理拖放到此文件夹中。你应该会在内容浏览器中看到你的材质（见图 9-6）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig6_HTML.jpg](img/502922_1_En_9_Fig6_HTML.jpg)


  图 9-6


  导入 UE4 的纹理贴图


  现在，让我们使用这些纹理贴图创建一个材质。双击 `T_Sofa_ORM`，在 `纹理` 下，确保 `sRGB` 已禁用（UE4 应该已经自动完成了此操作）。在内容浏览器的空白处右键单击，在
  `创建基本资产` 下，选择 `材质`（见图 9-7）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig7_HTML.jpg](img/502922_1_En_9_Fig7_HTML.jpg)


  图 9-7


  创建材质资产


  以与你的资产对应的方式命名此材质。我将其命名为 `MM_Sofa`。接下来，双击它以启动材质编辑器窗口。你的窗口应该类似于图 9-8。你可以通过前往 `窗口 ➤
  内容浏览器 ➤ 内容浏览器 1` 来打开内容浏览器。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig8_HTML.jpg](img/502922_1_En_9_Fig8_HTML.jpg)


  图 9-8


  材质编辑器窗口


  这是一个基于节点的材质编辑器，你可以使用各种节点和函数来创建材质。


  首先，从内容浏览器中拖拽我们的纹理并将它们放入材质编辑器窗口。按图 9-9 所示排列纹理。这是你对蓝图系统的初步了解。你正在使用基于节点的编程来创建材质。通过连接节点，你为整体节点树分配不同的功能，执行后即可生成材质。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig9_HTML.jpg](img/502922_1_En_9_Fig9_HTML.jpg)


  图 9-9


  在材质编辑器中引入并排列材质


  现在，让我们添加一些材质函数来编辑我们的材质。在空白处右键单击，搜索 `CheapContrast_RGB`，并将其添加到编辑器中。接下来，搜索 `Multiply`
  并将其也添加进来。将 `Base Color` 节点的 `RGB` 输出引脚连接到 `CheapContrast_RGB` 的输入引脚。接着，将 `CheapContrast_RGB`
  的输出连接到 `Multiply` 的输入。最后，将 `Multiply` 连接到 `MM_Sofa` 的 `Base Color` 输入。你的设置应该类似于图
  9-10。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig10_HTML.jpg](img/502922_1_En_9_Fig10_HTML.jpg)


  图 9-10


  目前的设置


  接下来，按住键盘上的字母数字键 `1` 并左键单击任意位置以添加一个 `常量` 节点。右键单击此常量，并选择 `转换为参数`（见图 9-11）。或者，你可以按下
  `S` 并单击以添加一个 `参数` 节点。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig11_HTML.jpg](img/502922_1_En_9_Fig11_HTML.jpg)


  图 9-11


  将常量转换为参数


  在左侧的细节面板中，将此参数命名为 `Contrast`（见图 9-12）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig12_HTML.jpg](img/502922_1_En_9_Fig12_HTML.jpg)


  图 9-12


  命名参数


  将参数连接到 `CheapContrast_RGB` 的 `Contrast (S)` 引脚。




  接下来，右键添加 `Constant3Vector`，并将其同样转换为参数。命名为 `Tint`。将其连接到 `Multiply` 节点的底部输入引脚。你的设置应类似于图
  9-13。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig13_HTML.jpg](img/502922_1_En_9_Fig13_HTML.jpg)


  图 9-13 当前设置


  点击 `Tint` 参数节点。在**细节**面板中，将其默认值设置为纯白色（见图 9-14）。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig14_HTML.jpg](img/502922_1_En_9_Fig14_HTML.jpg)


  图 9-14 设置色调参数的默认值


  将法线贴图连接到主材质，如图 9-15 所示。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig15_HTML.jpg](img/502922_1_En_9_Fig15_HTML.jpg)


  图 9-15 连接法线贴图


  对于图 9-15 中的两张贴图，你需要使用纹理贴图中所有三个通道存储的数据。但对于下一张 ORM 贴图，你需要使用各个纹理通道（即**红色**、**绿色**和**蓝色**通道）中存储的数据。为此，连接方式如下：


  1.  将红色（`R`）引脚连接到材质节点的**环境光遮蔽**引脚。

  2.  将绿色（`G`）引脚连接到材质节点的**粗糙度**引脚。

  3.  将蓝色（`B`）引脚连接到材质节点的**金属感**引脚。


  你的设置应类似于图 9-16。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig16_HTML.jpg](img/502922_1_En_9_Fig16_HTML.jpg)


  图 9-16 ORM 纹理的设置


  你可以将 ORM 纹理的绿色通道乘以一个参数，以控制材质的粗糙度。只需创建一个名为 `Roughness` 的参数，并添加一个 `Multiply` 节点。按照图
  9-17 所示的方式连接它们。操作方法是：从新 `Multiply` 节点上的 `B` 节点拖出连线并搜索 `param`，然后选择**标量**参数并将其重命名为
  `Roughness`。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig17_HTML.jpg](img/502922_1_En_9_Fig17_HTML.jpg)


  图 9-17 控制粗糙度的设置


  ### 将材质应用于网格体


  保存材质后，即可将其应用于网格体。将材质从**内容浏览器**拖放到场景中的资源上。材质应该会像你在 **Substance Painter** 中制作的那样带有纹理。最终结果取决于你创建的内容，但图
  9-18 显示了我的场景结果。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig18_HTML.jpg](img/502922_1_En_9_Fig18_HTML.jpg)


  图 9-18 应用材质的结果


  在进行建筑设计可视化时，你可能需要使用一个资源与其他资源协同作用，以创建完整的场景。图 9-19 至 9-22 是使用放置在可视化室内设计场景中的三个沙发副本进行渲染的预览图。


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig22_HTML.jpg](img/502922_1_En_9_Fig22_HTML.jpg)


  图 9-22 远景 4 场景


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig21_HTML.jpg](img/502922_1_En_9_Fig21_HTML.jpg)


  图 9-21 远景 3 场景


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig20_HTML.jpg](img/502922_1_En_9_Fig20_HTML.jpg)


  图 9-20 远景 2 场景


  ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig19_HTML.jpg](img/502922_1_En_9_Fig19_HTML.jpg)


  图 9-19 远景 1 场景


  本章以这些结果作为结尾。


  在下一章中，你将创建更多材质，并处理主材质和实例化材质。


