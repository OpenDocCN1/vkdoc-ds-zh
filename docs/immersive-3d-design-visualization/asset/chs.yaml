  | `Ctrl+Shift+A` | 全选 |\n| `Del` | 删除选定的对象/面/顶点（取决于选择） |\n| `Backspace` | 删除边 |\n\
  | `Ctrl+Backspace` | 删除边以及顶点 |\n| `Shift+D` | 复制 |\n| `鼠标左键` | 选择 |\n| `Shift+Ctrl+鼠标左键`\
  \ | 添加到选区 |\n| `Ctrl+鼠标左键` | 从选区中移除 |\n| `Ctrl+S` | 保存文件 |\n| `Ctrl+Z` | 撤销 |\n\
  | `Ctrl+Y` | 重做 |\n| `空格键` | 切换编辑器区域的最小化/最大化 |\n\n您可以向场景中添加许多对象。单击立方体图标（在图 3-3 中高亮显示）即可向场景中添加一个立方体。\n\
  \n`右键单击` 打开对象饼状菜单（见图 3-4）。您可以使用它进入对象的编辑模式，选择并编辑其基本体，例如顶点、边和面。选择 Maya 自带的标准形状（如球体或圆柱体）中的基本体，并以图\
  \ 3-4 作为参考。*边*是网格上的一条线。*顶点*是边相互交叉的极点。*面*是由边围成的区域。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig4_HTML.jpg](img/502922_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n顶点、边和面基本体\n\n在编辑模式下，有一些快捷键可以打开提供各种功能和工具的菜单。\n\n*   `右键单击` 显示模式菜单，允许您切换编辑模式。\n\
  *   `Shift+右键单击` 打开一个工具菜单，可以访问诸如 `插入循环边`、`多切割`、`合并`、`倒角` 和 `桥接` 等工具。（这些工具将在本书后面讨论。）\n\
  *   `Ctrl+Shift+右键单击` 打开所选变换工具的上下文菜单。（变换工具是移动、旋转和缩放）。\n*   如果您选择了一个循环边，您可以向任何方向滑动它。按下\
  \ `Shift+Ctrl` 并使用操纵器来滑动选中的边/边。\n*   选择一条边或一个顶点，然后按下 `Shift` 键，即可选择将选中的边/面向您选择的方向挤出。\n\
  \n我还可以讨论更多，但边工作边学习新的快捷键和技巧效果更好。不过在继续之前，请确保您已经练习了所讨论的所有快捷键和热键。\n\n现在让我们开始创建一个简单的头戴设备。\n\
  \n\n\n## 构建基础模型\n\n让我们开始构建基础模型。构建基础模型是确定资源外观的重要环节。通过基础模型，你可以自由灵活地试验想法，并决定哪些符合需求、哪些不符合。由于基础模型的几何形状非常简单，可以轻松修改，以验证不同方案的可行性。\n\
  \n首先，点击`多边形建模`选项卡下的圆柱体图标来创建一个圆柱体。你需要确保其拥有足够的边数。你可以在`通道`面板（快捷键`Ctrl+A`）中设置基础体的参数（见图\
  \ 3-5）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig5_HTML.jpg](img/502922_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n修改参数\n\n`通道`面板提供了 3D 模型的基本参数，你可以通过编辑这些参数进行常规修改。每个轴都有`平移`、`旋转`和`缩放`选项。\n\
  \n让我们为圆柱体添加`28`个细分。这能让它更平滑，并提供更多可操作的边。现在，按`R`键，使用操纵器将圆柱体在`Y`轴上缩放至约`0.2`，如图 3-6 所示。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig6_HTML.jpg](img/502922_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n\n压扁对象\n\n接下来，使用`缩放`操纵器中的绿色方块，沿`Z-X`平面对圆柱体进行缩放。将其在`X`轴和`Z`轴上拉宽至`7`（见图 3-7）。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig7_HTML.jpg](img/502922_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7\n\n将对象缩放得更宽\n\n然后在面模式下选中顶盖和底盖并将其删除，如图 3-8 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig8_HTML.jpg](img/502922_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\n删除圆柱体端盖\n\n在面模式下，选中并删除对象的一半，只保留剩余的一半（见图 3-9）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig9_HTML.jpg](img/502922_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9\n\n删除对象的一半\n\n选中形状的最后两条边，并确保`移动`操纵器处于激活状态（按`W`键激活）。然后按住`Shift`键，将鼠标悬停在一个操纵器上。你应该会看到`挤出`字样出现，这意味着使用操纵器平移选中的边时，会将边挤出。使用`挤出`功能，将边向后挤出，如图\
  \ 3-10 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig10_HTML.jpg](img/502922_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10\n\n向后挤出边\n\n如果不小心，或者对单个基础体多次使用挤出，`挤出`可能会产生不需要的几何体。为了检查，选中任意一条边并移动它，观察是否出现多余的面。如果发现有多余的面与预期面重叠，应选中这些不需要的几何体并按`Backspace`键将其删除。\n\
  \n### 添加对称\n\n现在让我们为对象启用`对称`功能。对称是一个强大的工具，因为当你编辑网格的一侧时，它会将操作复制到另一侧。你无需手动编辑网格的两侧。要启用`对称`功能，右键单击并从饼状菜单中选择`对象模式`。然后按`Ctrl+Shift+右键`打开`工具`菜单。`对称`是顶部的选项（见图\
  \ 3-11）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig11_HTML.jpg](img/502922_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11\n\n对称选项\n\n将鼠标悬停在`对称`上可以显示更多选项。\n\n`对称`选项旁边有一个复选框。默认情况下，它是未选中的（见图 3-12）。将鼠标悬停在其上，选中它，然后右键单击以切换为开启状态。用同样的方法可以将其关闭。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig12_HTML.jpg](img/502922_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12\n\n切换对称开启\n\n启用后，你就可以开始编辑模型了。你会看到，你对网格一侧所做的任何编辑都会自动复制到另一侧。\n\n进入`边编辑`模式，选中所有顶部的边。将它们稍微向上移动，然后再稍微向后移动，如图\
  \ 3-13 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig13_HTML.jpg](img/502922_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13\n\n定位顶部边缘\n\n选中除最后一条之外的所有底部边，并将其向下挤出，如图 3-14 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig14_HTML.jpg](img/502922_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14\n\n向下挤出边\n\n再次选中末端边，并再次向后挤出，如图 3-15 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig15_HTML.jpg](img/502922_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15\n\n向后挤出边\n\n选中挤出的底部边，通过将其稍微向后移动并向下移动一点来调整它们的位置，如图 3-16 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig16_HTML.jpg](img/502922_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n定位我们的边\n\n接下来，让我们为形状添加另一个边循环。首先，确保你处于`边编辑`模式。然后，按`Shift+右键`打开边工具菜单。在其中找到`插入边循环工具`选项（见图\
  \ 3-17）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig17_HTML.jpg](img/502922_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\n插入边循环工具\n\n将鼠标悬停在它上面，然后右键单击以激活该工具。你的光标会改变形状，表示工具已激活。现在点击垂直边，可以水平添加一条边，如图\
  \ 3-18 所示。如果你点击水平边，则会垂直添加一条边。这一点通过实际操作最能理解。尝试为你的网格添加一条边。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig18_HTML.jpg](img/502922_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\n添加边循环\n\n之后，选中底部的末端边，并向后挤出该边，如图 3-19 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig19_HTML.jpg](img/502922_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n向后挤出边\n\n选中网格最前端底部的两条边。然后按住`Shift+Ctrl`键，将边向上滑动，如图 3-20 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig20_HTML.jpg](img/502922_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\n将这些边向上滑动\n\n\n\n网格上的边缘目前看起来生硬且有棱角。通过在其周围绘制一个选择框，选中网格上的所有边缘。确保选中每一条边缘。按下\
  \ `Shift+右键单击`，从菜单中选择 `软化/硬化边缘` 选项（见图 3-21）。\n\n网格法线是垂直于网格每个面并向外延伸的线。它们决定了模型的外观。法线可以硬化、软化或翻转。平滑网格法线后，着色值会被平均化，从而产生更平滑的外观。网格法线有时会朝向错误的方向，使你的网格看起来是黑色的。这些都是你应该留意的问题。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig21_HTML.jpg](img/502922_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21：选择“软化/硬化边缘”\n\n将鼠标悬停在 `软化/硬化边缘` 上，会打开一个新的子菜单，其中提供了更多与软化、硬化边缘相关的选项。选择 `软化边缘`\
  \ 选项并释放右键（见图 3-22）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig22_HTML.jpg](img/502922_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22：选择“软化边缘”\n\n完成此操作后，你会看到边缘不再有硬法线。这正是你想要的效果。\n\n### 添加重复面\n\n让我们为网格再添加几个部分。选择并复制图\
  \ 3-23 中高亮显示的面。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig23_HTML.jpg](img/502922_1_En_3_Fig23_HTML.jpg)\n\
  \n图 3-23：选择这些面\n\n接下来，按下 `Shift+右键单击`，并从列表中选择 `复制面`（图 3-24）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig24_HTML.jpg](img/502922_1_En_3_Fig24_HTML.jpg)\n\
  \n图 3-24：“复制面”选项\n\n一旦面被复制，它们就会形成一个新的对象。你还可以使用偏移值来在旧面和新复制的面之间创建空间。你可以使用 `移动` 工具来保持它们之间的间距。\n\
  \n切换到 `对象` 模式，并选择由复制面创建的网格。然后将它们移回并定位，如图 3-25 所示。或者，你可以使用 `通道` 框，并在 `X` 轴输入 `2.0`\
  \ 的值来移动它。如果你的网格方向错误，意味着你的网格在另一个轴上发生了旋转。这种情况下，按 `Ctrl+Z` 撤销，然后在 `Z` 轴输入 `2.0` 的值（注意：Maya\
  \ 使用 `Y` 轴作为向上轴，所以在 `Z` 轴输入 `2.0`）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig25_HTML.jpg](img/502922_1_En_3_Fig25_HTML.jpg)\n\
  \n图 3-25：定位我们复制的面\n\n现在切换到对象的顶点编辑模式，并选择最后四个顶点。按下 `B` 键打开 `软选择`。（你可以随时按 `B` 键来打开或关闭\
  \ `软选择`）。按下 `B+鼠标中键` 并向左拖动鼠标以增加 `软选择` 的笔刷大小。使笔刷足够大，以覆盖网格的大部分区域，如图 3-26 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig26_HTML.jpg](img/502922_1_En_3_Fig26_HTML.jpg)\n\
  \n图 3-26：调大“软选择”笔刷\n\n然后使用 `移动` 工具将选中的顶点定位到图 3-27 所示的位置。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig27_HTML.jpg](img/502922_1_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27：定位顶点\n\n如果对称在你的 `X` 轴上不能正常工作，尝试切换到不同的 `对称` 轴。为此，进入 `对象` 模式。按下 `Ctrl+Shift+右键单击`，转到\
  \ `对称`，然后选择 `Z` 轴。这应该能解决你的问题。同时，确保你的网格位于网格的中心。\n\n再次按下 `B` 键以停用 `软选择`。选择并移动所有物体，使每个网格都位于网格之上，如图\
  \ 3-28 所示。网格与网格重叠会非常分散注意力。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig28_HTML.jpg](img/502922_1_En_3_Fig28_HTML.jpg)\n\
  \n图 3-28：将网格移动到网格上方\n\n接下来，进入较小部件的编辑模式，并选择图 3-29 所示的边缘。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig29_HTML.jpg](img/502922_1_En_3_Fig29_HTML.jpg)\n\
  \n图 3-29：选择以下边缘\n\n选中后，按住 `Shift` 键并使用 `移动` 工具将它们向下挤出，如图 3-30 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig30_HTML.jpg](img/502922_1_En_3_Fig30_HTML.jpg)\n\
  \n图 3-30：挤出边缘\n\n**注意**：如果挤出效果不如预期，则禁用 `对称`，然后再尝试挤出。确保在挤出后重新启用 `对称`。\n\n挤出后，将边缘稍微向后移动一点。无需过于精确；只需确保比例看起来大致正确即可。\n\
  \n现在让我们为耳机的前部主体添加一些细节。首先为网格添加几个循环边。进入前部部件的 `边选择` 模式，然后按下 `Shift+右键单击`。从菜单中选择 `插入循环边工具`（见图\
  \ 3-31）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig31_HTML.jpg](img/502922_1_En_3_Fig31_HTML.jpg)\n\
  \n图 3-31：“插入循环边工具”\n\n现在添加两个循环边，如图 3-32 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig32_HTML.jpg](img/502922_1_En_3_Fig32_HTML.jpg)\n\
  \n图 3-32：添加循环边\n\n通过双击选择形状顶部第一个循环边，并将其稍微向前移动，使其产生轻微的弧度（见图 3-33）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig33_HTML.jpg](img/502922_1_En_3_Fig33_HTML.jpg)\n\
  \n图 3-33：为形状添加弧度\n\n切换到面模式并选中网格的所有面。你可以双击任意面以选中网格上的所有面。按下 `Shift+右键单击`，然后从菜单中选择\
  \ `挤出面`（见图 3-34）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig34_HTML.jpg](img/502922_1_En_3_Fig34_HTML.jpg)\n\
  \n图 3-34：“挤出面”\n\n将 `厚度` 值设置为 `0.3`，如图 3-35 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig35_HTML.jpg](img/502922_1_En_3_Fig35_HTML.jpg)\n\
  \n图 3-35：挤出我们的形状\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例，为您翻译以下英文文本。\n\n\n### 使用多切割工具\n\
  \n现在，切换至顶点编辑模式，并在工具栏中选择`多切割`工具（见图 3-36）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig36_HTML.jpg](img/502922_1_En_3_Fig36_HTML.jpg)\n\
  \n图 3-36\n\n多切割工具\n\n使用`多切割`工具进行两次边缘切割，如图 3-37 所示。您可以按 `Enter` 键确认切割操作。保持工具的激活状态，以便您可以立即执行下一次切割操作。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig37_HTML.jpg](img/502922_1_En_3_Fig37_HTML.jpg)\n\
  \n图 3-37\n\n添加边缘切割\n\n调整切割产生的顶点，使其更水平。不必追求完美，目测对齐即可。如果需要精确调整，可以使用`缩放`工具。向下缩放直到顶点对齐。\n\
  \n使用`多切割`工具精确地连接边缘，如图 3-38 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig38_HTML.jpg](img/502922_1_En_3_Fig38_HTML.jpg)\n\
  \n图 3-38\n\n连接边缘\n\n您的连接现在应类似于图 3-39。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig39_HTML.jpg](img/502922_1_En_3_Fig39_HTML.jpg)\n\
  \n图 3-39\n\n最终的边缘连接\n\n在网格的另一侧执行相同操作。接下来，选中高亮显示的边缘并将其删除（见图 3-40）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig40_HTML.jpg](img/502922_1_En_3_Fig40_HTML.jpg)\n\
  \n图 3-40\n\n选择并删除这些边缘\n\n您的新连接应类似于图 3-41。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig41_HTML.jpg](img/502922_1_En_3_Fig41_HTML.jpg)\n\
  \n图 3-41\n\n最终连接\n\n现在，稍微移动中心边缘，使其呈现出平滑的弯曲形状（参考图 3-42）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig42_HTML.jpg](img/502922_1_En_3_Fig42_HTML.jpg)\n\
  \n图 3-42\n\n为边缘赋予弯曲形状\n\n### 合并对象\n\n现在，我们来创建一个有 20 个侧面的圆柱体。调整其厚度，使其大致与耳机的前片相同。然后将其定位，如图\
  \ 3-43 所示。在对象模式下，您可以使用通道盒为圆柱体输入更精确的位置。如果手动定位难以进行微调，这有助于精确调整位置。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig43_HTML.jpg](img/502922_1_En_3_Fig43_HTML.jpg)\n\
  \n图 3-43\n\n定位圆柱体\n\n让我们将这个圆柱体合并到主体上，这样您就可以连接面，形成一个统一的对象。首先，选择前面的头戴部件。按住`Shift`并左键单击圆柱体以将其选中。然后按`Shift+右键单击`，从菜单中选择`合并`（见图\
  \ 3-44）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig44_HTML.jpg](img/502922_1_En_3_Fig44_HTML.jpg)\n\
  \n图 3-44\n\n合并网格\n\n合并后，进入编辑模式并删除图 3-45 中所示的面。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig45_HTML.jpg](img/502922_1_En_3_Fig45_HTML.jpg)\n\
  \n图 3-45\n\n选择并删除这些面\n\n接下来，删除头戴部件上朝向圆柱体的那个面。然后，选中图 3-46 中所示的边缘。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig46_HTML.jpg](img/502922_1_En_3_Fig46_HTML.jpg)\n\
  \n图 3-46\n\n选择这些边缘\n\n然后按住`Shift`，将这些边缘向头戴部件方向挤出。接着，切换至顶点模式。按`Shift+右键单击`，选择`合并顶点`（见图\
  \ 3-47）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig47_HTML.jpg](img/502922_1_En_3_Fig47_HTML.jpg)\n\
  \n图 3-47\n\n合并顶点\n\n从菜单中选择`目标焊接工具`（见图 3-48）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig48_HTML.jpg](img/502922_1_En_3_Fig48_HTML.jpg)\n\
  \n图 3-48\n\n目标焊接工具\n\n启用后，您的光标会变成一个`+`（加号形状）图标。此工具允许您将选中的顶点与目标顶点合并。操作非常简便。首先，选择您要合并的顶点，然后选择您要合并到的目标顶点。在此案例中，选择圆柱体挤出部分顶部的顶点，然后将其拖放到耳机上相邻的顶点上（见图\
  \ 3-49）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig49_HTML.jpg](img/502922_1_En_3_Fig49_HTML.jpg)\n\
  \n图 3-49\n\n目标焊接顶点\n\n对圆柱体一侧的所有顶点执行相同操作：将圆柱体所有挤出的顶点合并到耳机头戴的同一个顶部顶点上，直到得到类似于图 3-50\
  \ 的结果。将圆柱体的最底部顶点与耳机头戴的底部顶点合并。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig50_HTML.jpg](img/502922_1_En_3_Fig50_HTML.jpg)\n\
  \n图 3-50\n\n合并顶点后的结果\n\n您可能会发现圆柱体的细节只存在于耳机的一侧。如果是这种情况，您可以将网格一侧的所有细节镜像到另一侧。请确保您的对象位于网格上，并且没有以奇怪的角度旋转。确保所有条件都满足后，点击工具栏上的`镜像`工具（见图\
  \ 3-51）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig51_HTML.jpg](img/502922_1_En_3_Fig51_HTML.jpg)\n\
  \n图 3-51\n\n镜像工具\n\n`镜像`工具会将网格一侧的所有细节复制到另一侧。如果结果不符合预期，请尝试将对象旋转 90 度后再镜像一次。您的结果应类似于图\
  \ 3-52。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig52_HTML.jpg](img/502922_1_En_3_Fig52_HTML.jpg)\n\
  \n图 3-52\n\n当前结果\n\n\n\n### 添加细节\n\n现在让我们为耳机添加更多细节。选择圆柱体上的所有面并进行挤出，如图 3-53 所示。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig53_HTML.jpg](img/502922_1_En_3_Fig53_HTML.jpg)\n\
  \n图 3-53：挤出色圆柱体上的面\n\n以类似方式再次挤出它们。按下 `R` 键切换到缩放工具。使用中心控制点或红色方块小控件（两者效果相同），然后将其缩小，使形状类似于图\
  \ 3-54 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig54_HTML.jpg](img/502922_1_En_3_Fig54_HTML.jpg)\n\
  \n图 3-54：使用缩放工具缩小形状\n\n转到形状的另一侧，选择高亮显示的边缘，即圆柱体的边界边缘（见图 3-55）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig55_HTML.jpg](img/502922_1_En_3_Fig55_HTML.jpg)\n\
  \n图 3-55：选择这些面\n\n通过按 `Shift+右键单击` 并在菜单中选择 `Duplicate faces` 来复制这些面。缩小这些面，使其类似于图\
  \ 3-56。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig56_HTML.jpg](img/502922_1_En_3_Fig56_HTML.jpg)\n\
  \n图 3-56：复制并缩放面\n\n接下来，选择形状的边界边缘环，并按住 `Shift` 键使用移动操纵器向外挤出边缘。向外缩放边缘，使形状类似于图 3-57。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig57_HTML.jpg](img/502922_1_En_3_Fig57_HTML.jpg)\n\
  \n图 3-57：挤出并塑形边缘\n\n再次沿直线向外挤出边缘。之后，向内挤出并缩放它们，使形状类似于图 3-58 所示。这就是*耳罩*。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig58_HTML.jpg](img/502922_1_En_3_Fig58_HTML.jpg)\n\
  \n图 3-58：当前形状\n\n面是黑色的，因为它们的法线方向错误。让我们在继续之前修复这个问题。选择所有面，单击菜单栏上的 `Mesh Display` 选项卡，然后在菜单中选择\
  \ `Reverse`（见图 3-59）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig59_HTML.jpg](img/502922_1_En_3_Fig59_HTML.jpg)\n\
  \n图 3-59：反转法线\n\n现在你的网格应该具有正确的着色，只有内部面是黑色的。\n\n让我们暂时切换到对象模式。单击 `Isolate Selection`\
  \ 按钮（见图 3-60）以隔离耳罩（或按 `Shift+I`，这是一个快捷键）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig60_HTML.jpg](img/502922_1_En_3_Fig60_HTML.jpg)\n\
  \n图 3-60：隔离选择按钮\n\n现在耳罩已被隔离，你可以在没有其他网格干扰的情况下处理它。选择并删除耳罩的背面（见图 3-61）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig61_HTML.jpg](img/502922_1_En_3_Fig61_HTML.jpg)\n\
  \n图 3-61：选择并删除这些面\n\n再次单击 `Isolate Selection` 按钮以显示所有其他物体。\n\n现在，让我们继续处理耳罩。挤出、缩放，并创建如图\
  \ 3-62 所示的形状。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig62_HTML.jpg](img/502922_1_En_3_Fig62_HTML.jpg)\n\
  \n图 3-62：耳罩当前结果\n\n选择朝向物体中心的最内侧边缘。再次通过按住 `Shift` 键并使用缩放工具同时进行挤出和缩小。这使你能够封闭耳罩中心的孔洞。之后，按\
  \ `Shift+右键单击` 并选择 `Merge/Collapse Edges`（见图 3-63）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig63_HTML.jpg](img/502922_1_En_3_Fig63_HTML.jpg)\n\
  \n图 3-63：合并/塌陷边缘\n\n在新菜单中，选择 `Merge Edges To Center`（见图 3-64）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig64_HTML.jpg](img/502922_1_En_3_Fig64_HTML.jpg)\n\
  \n图 3-64：将边缘合并到中心\n\n边缘在一个中心点合并。在合并处会形成三角形。你可以暂时忽略这一点，或者删除交替的边缘使其变成四边形——随你喜欢。游戏引擎无论如何都会自动三角化网格，而对于平坦的硬表面，只要三角形不会引起建模问题，就可以安全地使用它们。在我们的案例中，你可以直接忽略它们并继续前进。\n\
  \n按 `Shift+右键单击` 并在菜单中选择 `Insert Edge Loop Tool`，添加另一个如图 3-65 所示（绿色虚线）的边缘环。\n\n\
  ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig65_HTML.jpg](img/502922_1_En_3_Fig65_HTML.jpg)\n\
  \n图 3-65：添加另一个边缘环\n\n接下来，选择整个环并将其稍微向外移动，使整个区域具有漂亮的曲线（见图 3-66）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig66_HTML.jpg](img/502922_1_En_3_Fig66_HTML.jpg)\n\
  \n图 3-66：为形状添加一些弧度\n\n接下来，切换到面模式，按 `Ctrl+Shift+A` 选择所有面，并向上缩放它们，使耳罩足够大，看起来更真实；目前它太小了。参见图\
  \ 3-67 作为参考。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig67_HTML.jpg](img/502922_1_En_3_Fig67_HTML.jpg)\n\
  \n图 3-67：缩放并调整大小\n\n现在大小应该合适了，但你可以根据自己的喜好调整。让我们将其镜像到耳机的另一侧，这样两侧都有耳罩。为此，单击工具栏上的 `Mirror`\
  \ 按钮。你的结果应类似于图 3-68。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig68_HTML.jpg](img/502922_1_En_3_Fig68_HTML.jpg)\n\
  \n图 3-68：镜像的结果\n\n\n\n## 隔离内部对象\n\n先处理内部耳机部分。首先将其隔离，然后切换到`边编辑`模式并添加一条循环边，如图 3-69\
  \ 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig69_HTML.jpg](img/502922_1_En_3_Fig69_HTML.jpg)\n\
  \n*图 3-69* — 如图所示添加循环边\n\n现在选择图 3-70 中所示的边。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig70_HTML.jpg](img/502922_1_En_3_Fig70_HTML.jpg)\n\
  \n*图 3-70* — 选择高亮显示的边\n\n按下`Shift+Ctrl`键，并使用`移动`操纵器，将这些边向上滑动，使网格的上部区域变薄。参考图 3-71。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig71_HTML.jpg](img/502922_1_En_3_Fig71_HTML.jpg)\n\
  \n*图 3-71* — 向上滑动边\n\n接下来，将图 3-72 中高亮显示的面作为视孔。首先，你需要对它们周围的几何体进行一些修改。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig72_HTML.jpg](img/502922_1_En_3_Fig72_HTML.jpg)\n\
  \n*图 3-72* — 视孔\n\n启用`目标焊接`工具，将顶点合并到角点，如图 3-73 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig73_HTML.jpg](img/502922_1_En_3_Fig73_HTML.jpg)\n\
  \n*图 3-73* — 将顶点合并到角点\n\n你的结果应该类似于图 3-74。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig74_HTML.jpg](img/502922_1_En_3_Fig74_HTML.jpg)\n\
  \n*图 3-74* — 顶点已合并到角点\n\n接下来，选择并删除图 3-75 中高亮显示的面。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig75_HTML.jpg](img/502922_1_En_3_Fig75_HTML.jpg)\n\
  \n*图 3-75* — 选择并删除这些面\n\n如有需要，你可以进一步调整形状。现在对形状进行任何修改都很重要，因为在此之后，你将挤出所有面来创建厚度。一旦厚度创建完成，任何后续编辑都需要付出很大努力。\n\
  \n通过按下`Ctrl+Shift+A`选择所有面。转到`编辑网格 > 挤出`，将`厚度`值设为`0.25`进行挤出。你的结果应该类似于图 3-76。\n\n\
  ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig76_HTML.jpg](img/502922_1_En_3_Fig76_HTML.jpg)\n\
  \n*图 3-76* — 挤出各个面\n\n接下来，通过按下`Ctrl+右键`并选择`插入循环边工具`来添加一条循环边。在图 3-77 中高亮显示的位置单击以添加一条循环边。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig77_HTML.jpg](img/502922_1_En_3_Fig77_HTML.jpg)\n\
  \n*图 3-77* — 添加循环边\n\n之后，选择孔周围的所有面并将其提取出来（参见图 3-78）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig78_HTML.jpg](img/502922_1_En_3_Fig78_HTML.jpg)\n\
  \n*图 3-78* — 提取这些面\n\n接下来，以`0.3`的值挤出它们。你的结果应该类似于图 3-79。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig79_HTML.jpg](img/502922_1_En_3_Fig79_HTML.jpg)\n\
  \n*图 3-79* — 当前结果\n\n选择图 3-80 中高亮显示的面并复制它们。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig80_HTML.jpg](img/502922_1_En_3_Fig80_HTML.jpg)\n\
  \n*图 3-80* — 选择并复制这些面\n\n如果在处理复制面时遇到问题，还有一种替代方法。首先，按下`Ctrl+Z`撤销所有复制操作。转到`对象`模式，按住`Shift`键并使用`平移`工具克隆整个网格。然后选择并删除除图\
  \ 3-80 中高亮显示的面之外的所有面（按`退格键`）。这样，你就不必处理可能很难操作的`复制面`工具了。之后，确保放置克隆的网格，使其大致与原始网格重叠。\n\
  \n接下来，选择图 3-81 中显示的所有顶点并将它们向上移动。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig81_HTML.jpg](img/502922_1_En_3_Fig81_HTML.jpg)\n\
  \n*图 3-81* — 调整对象的形状\n\n再次进入复制面的`边编辑`模式，选择图 3-82 中高亮显示的顶部边。将它们稍微向下滑动。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig82_HTML.jpg](img/502922_1_En_3_Fig82_HTML.jpg)\n\
  \n*图 3-82* — 向下滑动边\n\n对该部件上的所有边界边执行相同操作。你的结果应该类似于图 3-83。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig83_HTML.jpg](img/502922_1_En_3_Fig83_HTML.jpg)\n\
  \n*图 3-83* — 调整边界\n\n调整边界后，按住`Shift`键并挤出这些边，如图 3-84 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig84_HTML.jpg](img/502922_1_En_3_Fig84_HTML.jpg)\n\
  \n*图 3-84* — 挤出边\n\n## 移除不需要的面\n\n由于一些边穿过了耳机的前部，需要进行一些手动调整。选择它们并将其向后移动，使其不会从前部突出。无需过于精确。完成此操作后，选择并删除网格的背面（参见图\
  \ 3-85）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig85_HTML.jpg](img/502922_1_En_3_Fig85_HTML.jpg)\n\
  \n*图 3-85* — 选择并删除这些面\n\n让我们移除更多不需要的面。选择并隔离图 3-86 中所示的网格，并选择其凸面上的面。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig86_HTML.jpg](img/502922_1_En_3_Fig86_HTML.jpg)\n\
  \n*图 3-86* — 在此网格上选择这些面\n\n然后删除它们。你不需要这些面，而且它们也看不见，所以最好直接去掉它们（参见图 3-87）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig87_HTML.jpg](img/502922_1_En_3_Fig87_HTML.jpg)\n\
  \n*图 3-87* — 选择这些循环边\n\n\n\n### 进行调整与完善\n\n按住 `Shift+右键`，然后从菜单中选择`填充孔洞`（见图 3-88）。接下来，我们来制作目镜。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig88_HTML.jpg](img/502922_1_En_3_Fig88_HTML.jpg)\n\
  \n图 3-88\n\n填充孔洞\n\n这将创建一个新面。选中这个新面，按住 `Shift+右键`，然后选择`提取面`（见图 3-89）。如果提取出的面是独立的物体，请同时选中它们，按住\
  \ `Shift+右键`，然后从菜单中选择`合并`。这会将两个网格合并为一个，之后，你便可以启用`对称`功能。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig89_HTML.jpg](img/502922_1_En_3_Fig89_HTML.jpg)\n\
  \n图 3-89\n\n提取面\n\n提取并合并后，切换到顶点编辑模式，使用刀具工具连接中心顶部和底部的顶点（见图 3-90）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig90_HTML.jpg](img/502922_1_En_3_Fig90_HTML.jpg)\n\
  \n图 3-90\n\n连接中心顶点\n\n接下来，进入面编辑模式，选中所有面。点击工具栏中的`挤出`工具（见图 3-91）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig91_HTML.jpg](img/502922_1_En_3_Fig91_HTML.jpg)\n\
  \n图 3-91\n\n挤出工具\n\n将`厚度`值设为 0，`偏移量`值设为 0.3 进行挤出（见图 3-92）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig92_HTML.jpg](img/502922_1_En_3_Fig92_HTML.jpg)\n\
  \n图 3-92\n\n使用偏移量值进行挤出\n\n接着，再次按住 `Shift+右键`，从菜单中选择`圆形化组件`（见图 3-93）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig93_HTML.jpg](img/502922_1_En_3_Fig93_HTML.jpg)\n\
  \n图 3-93\n\n圆形化组件\n\n将`径向偏移`设为 –0.4（见图 3-94）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig94_HTML.jpg](img/502922_1_En_3_Fig94_HTML.jpg)\n\
  \n图 3-94\n\n减小径向偏移\n\n再次挤出，将`偏移量`值设为 0.1（见图 3-95）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig95_HTML.jpg](img/502922_1_En_3_Fig95_HTML.jpg)\n\
  \n图 3-95\n\n使用偏移值进行挤出\n\n再次挤出，将`偏移量`设为 0，`厚度`设为 0.6（见图 3-96）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig96_HTML.jpg](img/502922_1_En_3_Fig96_HTML.jpg)\n\
  \n图 3-96\n\n使用厚度值进行挤出\n\n再次挤出，将`偏移量`设为 0.1，`厚度`设为 0。最后，再进行一次挤出，将`偏移量`设为 0，`厚度`设为\
  \ –0.5。此时你应该得到一个类似于图 3-97 所示的形状。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig97_HTML.jpg](img/502922_1_En_3_Fig97_HTML.jpg)\n\
  \n图 3-97\n\n最终形状\n\n取消隐藏所有物体，并切换到该网格的面编辑模式。按 `Ctrl+Shift+A` 选中所有面。将它们缩放，以更好地贴合孔洞（见图\
  \ 3-98），因为当前看起来太小了。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig98_HTML.jpg](img/502922_1_En_3_Fig98_HTML.jpg)\n\
  \n图 3-98\n\n缩放网格\n\n请根据你的需求决定是放大还是缩小。你的网格可能与我的不同，因此请进行相应调整。到此，头显的基本粗模搭建就完成了。\n\n\
  接下来，我们对整体形状和比例进行一些微调。首先，如图 3-99 所示，两个网格之间存在间隙。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig99_HTML.jpg](img/502922_1_En_3_Fig99_HTML.jpg)\n\
  \n图 3-99\n\n网格之间的间隙\n\n要修复这个问题，可以选中较小的网格，并使用`缩放`工具沿 Z-X 平面进行缩放（见图 3-100）。这并非最佳方法，因为网格的比例会被压缩。另一种方法在下一步中说明。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig100_HTML.jpg](img/502922_1_En_3_Fig100_HTML.jpg)\n\
  \n图 3-100\n\n使用 Z-X 平面手柄进行缩放\n\n或者，你可以选择较小形状侧面的顶点，并使用`软选择`来调整形状。请记住，你可以按 `B` 键启用/禁用`软选择`。启用后，选中图\
  \ 3-101 所示的顶点，然后将网格的这部分向侧面移动。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig101_HTML.jpg](img/502922_1_En_3_Fig101_HTML.jpg)\n\
  \n图 3-101\n\n使用软选择调整形状\n\n还需要调整网格中任何受影响的其他部分，因为它们可能变得不对齐。之后，增加图 3-102 中高亮部分的厚度。当前，这部分看起来太薄了。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig102_HTML.jpg](img/502922_1_En_3_Fig102_HTML.jpg)\n\
  \n图 3-102\n\n增加网格厚度\n\n最终的调整由你决定。如果你认为网格的某一部分需要调整，就按你的想法去做。除非你对自己的操作非常有把握，否则请确保不要对整体形状或设计做出剧烈的更改。\n\
  \n\n\n### 开始细节化阶段\n\n完成调整阶段后，便进入细节化阶段。在此部分，你开始为网格添加细节，使其外观更佳。首先处理最前面的网格。选中它，然后按下数字`3`键，启用细分网格显示。按下`3`后，你的网格应类似于图\
  \ 3-103 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig103_HTML.jpg](img/502922_1_En_3_Fig103_HTML.jpg)\n\
  图 3-103\n细分网格显示\n\n如你所见，网格现在变得平滑，所有硬角和硬边都消失了。你可以通过逐个选中所有网格部件并按下`3`来为它们全部启用此效果。这会对它们进行细分（见图\
  \ 3-104）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig104_HTML.jpg](img/502922_1_En_3_Fig104_HTML.jpg)\n\
  图 3-104\n耳机模型的细分显示\n\n现在看起来可能不太理想，但你需要添加支撑边环，将硬边恢复出来。这是一个很好的可视化过程，便于你后续操作和添加细节。在细节化工作中，你需要添加大量边环。我们来复习一下如何操作，因为这是本阶段不可或缺的一部分。如果存在法线反转的黑色背面，会分散注意力。选中带有背面的物体，然后依次点击“显示”➤“多边形”➤“背面消隐”。这会禁止背面渲染。再次点击“背面消隐”即可禁用此功能。\n\
  \n要添加边环，只需按住 Shift+右键点击，并选择“插入边环工具”（见图 3-105）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig105_HTML.jpg](img/502922_1_En_3_Fig105_HTML.jpg)\n\
  图 3-105\n插入边环工具\n\n让我们添加几个边环，如图 3-106 所示。如果因网格曲率问题无法添加边环，可以按下数字`1`键来禁用细分视图。\n\n\
  ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig106_HTML.jpg](img/502922_1_En_3_Fig106_HTML.jpg)\n\
  图 3-106\n添加边环\n\n如你所见，你正将边环添加得非常靠近边界边缘。这确保了细分网格时，该处会形成更硬的棱角。现在，在另一侧同样非常靠近边界边缘的位置添加另一个边环。按下`3`键查看结果（见图\
  \ 3-107）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig107_HTML.jpg](img/502922_1_En_3_Fig107_HTML.jpg)\n\
  图 3-107\n添加边环后的结果\n\n如你所见，现在的棱角更硬了，网格看起来也好多了。这类边被称为*支撑边环*，因为它们支撑着物体的形状，防止细分功能使网格过于平滑。\n\
  \n现在，让我们为前面耳机部件的下部添加一些支撑边环。添加几个边环，如图 3-108 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig108_HTML.jpg](img/502922_1_En_3_Fig108_HTML.jpg)\n\
  图 3-108\n添加几个边环，如图所示\n\n添加边环后，按下`3`键查看结果。你会发现前面耳机部件的下部现在保持得更好了。这正符合需求。\n\n在希望保持硬棱角的地方（任何棱角变得过于圆润的地方）添加支撑边。我在高亮区域添加了几个（见图\
  \ 3-109）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig109_HTML.jpg](img/502922_1_En_3_Fig109_HTML.jpg)\n\
  图 3-109\n在此处添加支撑边环\n\n在另一侧也添加一个边环。然后，再添加几个，如图 3-110 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig110_HTML.jpg](img/502922_1_En_3_Fig110_HTML.jpg)\n\
  图 3-110\n添加支撑边环\n\n按下`3`键，你的结果应类似于图 3-111 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig111_HTML.jpg](img/502922_1_En_3_Fig111_HTML.jpg)\n\
  图 3-111\n添加支撑边环后的结果\n\n在网格的侧面，你会发现平坦面上存在的三角形阻止了你添加支撑边。要解决这个问题，首先选中所有面，如图 3-112 所示。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig112_HTML.jpg](img/502922_1_En_3_Fig112_HTML.jpg)\n\
  图 3-112\n选中这些面\n\n然后使用图 3-113 所示的参数挤出这些面。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig113_HTML.jpg](img/502922_1_En_3_Fig113_HTML.jpg)\n\
  图 3-113\n挤出设置\n\n按下`3`键查看结果。\n\n让我们对遮阳板的前部也进行同样的操作。选中图 3-114 所示的所有面。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig114_HTML.jpg](img/502922_1_En_3_Fig114_HTML.jpg)\n\
  图 3-114\n选中这些面\n\n挤出这些面，将“偏移”设为`0.05`，“厚度”设为`0`。你应该会得到与图 3-115 相似的结果。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig115_HTML.jpg](img/502922_1_En_3_Fig115_HTML.jpg)\n\
  图 3-115\n带偏移的挤出\n\n按下`3`键后，细分视图显示出非常漂亮的锐利棱角，形状并未坍塌。我们对后部也进行同样的操作。选中所有面，并将“偏移”设为`0.09`进行挤出（见图\
  \ 3-116）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig116_HTML.jpg](img/502922_1_En_3_Fig116_HTML.jpg)\n\
  图 3-116\n带偏移挤出后部区域\n\n再添加一个边环，如图 3-117 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig117_HTML.jpg](img/502922_1_En_3_Fig117_HTML.jpg)\n\
  图 3-117\n添加另一个边环\n\n大部分工作都在耳机部件的前部完成了。你只需解决最后一个问题。看看网格的前部，你之前通过向上拉出面来创建了一个造型。应用细分会使形状变圆，这不是你想要的；但如果你尝试添加支撑边环，形状又会出现你不想要的硬棱角。试试看会发生什么。\n\
  \n\n\n### 修正角度问题\n\n要解决角度问题，你必须对`插入边环`工具进行修改。首先，按下`Shift+右键`，然后点击`插入边环工具`名称旁的小方块图标（见图\
  \ 3-118）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig118_HTML.jpg](img/502922_1_En_3_Fig118_HTML.jpg)\n\
  \n图 3-118  \n`插入边环工具`选项\n\n在`工具设置`窗口中，将`维持位置`设置为`多个边环`，并将`边环数量`设置为`1`（见图 3-119）。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig119_HTML.jpg](img/502922_1_En_3_Fig119_HTML.jpg)\n\
  \n图 3-119  \n`插入边环`工具的工具设置\n\n当你插入边环时，它会被精确地插入到区域的中心。插入四个边环，如图 3-120 中高亮显示的部分。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig120_HTML.jpg](img/502922_1_En_3_Fig120_HTML.jpg)\n\
  \n图 3-120  \n按图示插入边环\n\n接下来，按住空格键，在热键栏中点击`Maya`，并从饼状菜单中选择`顶`视图，以切换到顶视图（见图 3-121）。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig121_HTML.jpg](img/502922_1_En_3_Fig121_HTML.jpg)\n\
  \n图 3-121  \n切换到顶视图\n\n在顶视图中，确保你添加的边环已被选中（见图 3-122），并注意整个区域看起来是多么平坦。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig122_HTML.jpg](img/502922_1_En_3_Fig122_HTML.jpg)\n\
  \n图 3-122  \n确保这些边环被选中\n\n你需要消除这种平坦感，因为当你细分网格时，这种平坦感会变得明显——而你并不希望如此。你希望这个区域是平滑的。要解决这个问题，请将这些边稍微向外移动（见图\
  \ 3-123）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig123_HTML.jpg](img/502922_1_En_3_Fig123_HTML.jpg)\n\
  \n图 3-123  \n为我们的形状添加曲线\n\n通过手动将边环向外移动，你已经消除了平坦感，并重新引入了平滑的曲线。正如你在图 3-124 中所见，现在的形状保持得更好。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig124_HTML.jpg](img/502922_1_En_3_Fig124_HTML.jpg)\n\
  \n图 3-124  \n添加支撑边后的形状\n\n如你所见，现在的形状有了一些硬度。如果我们以传统方式添加支撑边，角度可能会出现一些不必要的硬化。\n\n现在我们开始处理耳机的另一个部分。在添加边环之前，先重置其设置。按下`Shift+右键`，并选择`插入边环工具`设置（见图\
  \ 3-125）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig125_HTML.jpg](img/502922_1_En_3_Fig125_HTML.jpg)\n\
  \n图 3-125  \n工具设置\n\n首先，添加几个支撑边环，如图 3-126 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig126_HTML.jpg](img/502922_1_En_3_Fig126_HTML.jpg)\n\
  \n图 3-126  \n按图示插入几个边环\n\n向所有网格添加额外的支撑边，结果应类似于图 3-127。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig127_HTML.jpg](img/502922_1_En_3_Fig127_HTML.jpg)\n\
  \n图 3-127  \n支撑边环的放置位置\n\n如你所见，我将支撑边朝向中心放置，因为我希望这个区域更柔和。将边彼此靠近放置会使它们细分得更紧密，但保持一定距离则会使细分更宽松、更平滑。你可以利用这一信息来自定义硬度。\n\
  \n接下来，选择并删除交替的边，如图 3-128 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig128_HTML.jpg](img/502922_1_En_3_Fig128_HTML.jpg)\n\
  \n图 3-128  \n选择并删除交替的边\n\n接着，在任何`边编辑`模式下，按下`Ctrl+Shift+A`选择网格中的每一条边。然后转到`网格显示 ➤\
  \ 柔化/硬化边`，点击小方块按钮打开工具选项。将`角度`从`30`度增加到`180`度（见图 3-129）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig129_HTML.jpg](img/502922_1_En_3_Fig129_HTML.jpg)\n\
  \n图 3-129  \n柔化边\n\n点击`应用`以应用柔化边效果。你的网格现在应该看起来更平滑了，如图 3-130 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig130_HTML.jpg](img/502922_1_En_3_Fig130_HTML.jpg)\n\
  \n图 3-130  \n硬边与软边\n\n### 进行着色器测试\n\n让我们快速进行一个着色器测试（见图 3-131）。右键点击并选择`指定新材质`。然后应用`Lambert`。在`属性编辑器`中，应用轻微的颜色变化。这是一个可选步骤，所以不必过于担心。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig131_HTML.jpg](img/502922_1_En_3_Fig131_HTML.jpg)\n\
  \n图 3-131  \n进行快速着色器测试\n\n在所有网格上应用支撑边环后，首先按下`Ctrl+Shift+A`选择所有内容。然后按住`Shift`键，并使用任意`移动`操纵器，创建整个头戴设备模型的副本（如图\
  \ 3-132 所示），以复制项目中的所有对象。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig132_HTML.jpg](img/502922_1_En_3_Fig132_HTML.jpg)\n\
  \n图 3-132  \n复制整个模型\n\n将其放置在较高位置，以免干扰您正在处理的模型。然后，选择下方模型的任意部件，并通过点击`网格 ➤ 平滑`来应用`平滑`选项（见图\
  \ 3-133）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig133_HTML.jpg](img/502922_1_En_3_Fig133_HTML.jpg)\n\
  \n图 3-133  \n应用平滑\n\n在`平滑`选项窗口中，将`细分次数`设置为`1`（见图 3-134）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig134_HTML.jpg](img/502922_1_En_3_Fig134_HTML.jpg)\n\
  \n图 3-134  \n对网格应用平滑\n\n\n\n### 降低多边形数量\n\n接下来，手动选择并删除循环边，将多边形数量降低到可接受的范围。如图 3-135\
  \ 所示选择循环边，然后按下`Ctrl+Backspace`删除它们。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig135_HTML.jpg](img/502922_1_En_3_Fig135_HTML.jpg)\n\
  \n图 3-135  \n选择这些循环边\n\n接着，选择并删除图中高亮显示的循环边。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig136_HTML.jpg](img/502922_1_En_3_Fig136_HTML.jpg)\n\
  \n图 3-136  \n选择并删除这些边\n\n然后，启用目标焊接工具，合并所有高亮的顶点，如图 3-137 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig137_HTML.jpg](img/502922_1_En_3_Fig137_HTML.jpg)\n\
  \n图 3-137  \n合并这些顶点，下方的顶点合并到上方的顶点\n\n如图 3-138 所示合并顶点。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig138_HTML.jpg](img/502922_1_En_3_Fig138_HTML.jpg)\n\
  \n图 3-138  \n如图所示合并顶点，下方的顶点合并到上方的顶点\n\n最后，删除图 3-139 中高亮显示的边。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig139_HTML.jpg](img/502922_1_En_3_Fig139_HTML.jpg)\n\
  \n图 3-139  \n选择并删除高亮显示的边\n\n我们也来降低其他网格体的多边形数量。如图 3-140 所示，选择并删除所有边。\n\n图 3-140 显示，我们成功地将资源的多边形数量降低到了即使是性能较弱的\
  \ PC 也能进行烘烤的程度。让我们对其他资源也进行同样的操作。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig140_HTML.jpg](img/502922_1_En_3_Fig140_HTML.jpg)\n\
  \n图 3-140  \n降低了资源的多边形数量\n\n重复此过程，直到得到类似图 3-141 的结果。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig141_HTML.jpg](img/502922_1_En_3_Fig141_HTML.jpg)\n\
  \n图 3-141  \n多边形数量降低后的网格体\n\n你可以用它来在 Substance Painter 中烘烤网格贴图。图 3-142 显示了低多边形网格的拓扑结构。它毫无问题地接受我们的高多边形细节。\n\
  \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig142_HTML.jpg](img/502922_1_En_3_Fig142_HTML.jpg)\n\
  \n图 3-142  \n我们的低多边形模型\n\n这个模型的多边形数量仍然很高，因此在 Substance Painter 中烘烤网格贴图时，将其用作高多边形网格。确保保留原始网格体；它作为你烘烤所有内容的低多边形网格。\n\
  \n如你所见，网格的某些部分没有被处理，这没问题。你不想破坏任何细节，因为它们会影响纹理烘烤。\n\n下一章将探索虚幻引擎 4 的基础知识。\n\n## 使用\
  \ UE4 进行交互式可视化\n\n虚幻引擎 4 是一个游戏引擎，用于使用资源和代码构建游戏、建筑漫游、产品可视化等。它们可以在任何支持的平台上发布。UE4 是一个非常流行的游戏引擎。许多\
  \ AAA 级开发者和独立工作室都使用它来制作现代游戏。如今，如果有人想在游戏行业找到工作，包含 UE4 技能的作品集是非常推荐的。\n\n### 虚幻引擎 4\
  \ 界面\n\n让我们从虚幻引擎 4 的基础知识开始。首先，看看如何打开它。打开 Epic Games 启动器，浏览到虚幻引擎部分（见图 4-1）。\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig1_HTML.jpg](img/502922_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1  \n切换到虚幻引擎部分\n\n在“库”标签下，有一个加号图标。点击它，将一个 UE4 版本添加到你的库中。接下来，点击“安装”按钮并选择你的目录，开始\
  \ UE4 安装（见图 4-2）。始终下载最新版本，以便使用最新的功能。\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig2_HTML.jpg](img/502922_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2  \n安装 UE4 版本\n\n图 4-2 显示，UE4 版本 4.25.3 已安装并可启动。（版本 4.24.3 尚未下载，因此仍显示“安装”按钮。）\n\
  \n点击“启动”按钮启动你安装的引擎版本。在打开的新窗口中，通过选择“包含初学者内容包”及其设置来创建第一人称项目，如图 4-3 所示。\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig3_HTML.jpg](img/502922_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3  \n默认设置\n\n创建项目后，你看到的第一个窗口如图 4-4 所示。\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig4_HTML.jpg](img/502922_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4  \n虚幻引擎 4 界面\n\n现在，我们来讨论 UE4 中的基本控制。你可以按下`Alt+鼠标左键`来*旋转*视角摄像机。按下`Alt+鼠标中键`来*平移*摄像机。按下`Alt+鼠标右键`来*缩放*。或者，你可以按住`鼠标右键`，并使用\
  \ `W`、`S`、`A` 和 `D` 键飞行。表 4-1 列出了一些重要的虚幻引擎 4 快捷键。\n\n表 4-1  \n重要虚幻引擎 4 快捷键\n\n|\
  \ 快捷键 | 效果 |\n| :--- | :--- |\n| `W` | 移动 |\n| `E` | 旋转 |\n| `R` | 缩放 |\n| `Ctrl+A`\
  \ | 全选 |\n| `Ctrl+X` | 剪切 |\n| `Ctrl+C` | 复制 |\n| `Ctrl+V` | 粘贴 |\n| `Del` | 删除\
  \ |\n| `Ctrl+W` | 复制 |\n| `Ctrl+Z` | 撤销 |\n| `Ctrl+Y` | 重做 |\n| `F2` | 重命名 |\n|\
  \ `F` | 聚焦 |\n| `Alt+G` | 透视视图 |\n| `Alt+H` | 前视图 |\n| `Alt+K` | 侧视图 |\n| `Alt+J`\
  \ | 顶视图 |\n| `Alt+P` | 运行世界 |\n| `F11` | 沉浸模式 |\n| `G` | 游戏视图 |\n| `End` | 吸附到地面\
  \ |\n| `Ctrl+S` | 全部保存 |\n| `Ctrl+Shift+S` | 保存当前 |\n\n视口的左侧是放置 Actor 面板（见图 4-5）。在\
  \ UE4 中，你放置在世界中的一切都是一个 Actor，并附有组件来决定其行为。\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig5_HTML.jpg](img/502922_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5  \n放置 Actor 窗口\n\n内容浏览器位于屏幕底部（见图 4-6）。它是 UE4 的文件浏览器。它显示了你为游戏导入或创建的所有内容，包括资源、代码、蓝图等等。\n\
  \n在继续之前，你需要了解蓝图，以及为什么它对于不熟悉编程的人来说是革命性的。蓝图是一种基于节点的可视化编程语言，它允许 UE4 用户使用节点来创建游戏逻辑，而无需编写一行代码。你甚至可以仅使用蓝图制作整个游戏，这对可视化来说很好。一个更大的游戏不应该仅使用蓝图创建，因为它不是那么优化。尽管如此，很多游戏逻辑都是用蓝图制作的，所以它非常有用。\n\
  \n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig6_HTML.jpg](img/502922_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6  \n内容浏览器\n\n\n\n`World Outliner`位于屏幕右上角（见图 4-7）。它列出了你放置在场景中的所有`Actor`，包括资源、灯光、视觉效果、体积等。\n\
  \n![../images/502922\\_1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig7\\_HTML.jpg](img/_HTML.jpg)\n\
  \n*图 4-7：World Outliner*\n\n`Details`面板位于屏幕右下角（见图 4-8）。该面板展示了场景中选定资源的属性和可编辑参数。\n\
  \n![../images/502922\\_1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig8\\_HTML.jpg](img/_HTML.jpg)\n\
  \n*图 4-8：Details 面板*\n\n工具栏位于屏幕顶部中央。它列出了你在项目中工作时最常用的工具（见图 4-9）。\n\n![../images/502922\\\
  _1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig9\\_HTML.jpg](img/_HTML.jpg)\n\n\
  *图 4-9：UE4 工具栏*\n\n### Level Editor\n\n`Level Editor`是 UE4 的核心编辑器。它允许用户管理和编辑关卡。关卡通过将`Actor`放置并编辑到场景中来创建和编辑。这些`Actor`定义了玩家在与该关卡及其`Actor`交互时将体验到的内容。若要打开`Level\
  \ Editor`，请导航至 `Window` ➤ `Levels`（见图 4-10）。\n\n![../images/502922\\_1\\_En\\_4\\\
  _Chapter/502922\\_1\\_En\\_4\\_Fig10\\_HTML.jpg](img/_HTML.jpg)\n\n*图 4-10：打开 Levels\
  \ 面板*\n\n一旦打开`Levels`面板，你将看到如图 4-11 所示的窗口。\n\n![../images/502922\\_1\\_En\\_4\\\
  _Chapter/502922\\_1\\_En\\_4\\_Fig11\\_HTML.jpg](img/_HTML.jpg)\n\n*图 4-11：Levels\
  \ 窗口*\n\n`Levels`面板显示场景中所有存在的关卡。目前，默认的示例关卡是打开的。你可以看到这个窗口被命名为`Persistent Level`。你可以通过点击其名称前的睁眼图标来禁用此关卡（见图\
  \ 4-12）。\n\n![../images/502922\\_1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig12\\\
  _HTML.jpg](img/_HTML.jpg)\n\n*图 4-12：关卡可见性切换*\n\n一旦你禁用一个关卡，场景中的所有内容都会消失。这表明你场景中的每一个`Actor`都是一个关卡的一部分。通过编辑这些`Actor`，你可以修改该关卡。你可以通过点击窗口右下角的铅笔图标来保存更改（见图\
  \ 4-13）。\n\n![../images/502922\\_1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig13\\\
  _HTML.jpg](img/_HTML.jpg)\n\n*图 4-13：保存关卡更改*\n\n当没有新的更改需要保存时，会显示一个软盘图标。\n\n### Output\
  \ Log\n\n`Output Log`面板是一个开发者工具，用于显示与后台发生情况相关的调试消息和错误消息。错误消息会被记录在此，这提供了有关错误原因的宝贵信息，以便你进行调查和修复问题。若要打开输出日志，请导航至\
  \ `Windows` ➤ `Developer Tools` ➤ `Output Log`（见图 4-14）。\n\n![../images/502922\\\
  _1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig14\\_HTML.jpg](img/_HTML.jpg)\n\n\
  *图 4-14：打开输出日志*\n\n一旦输出日志打开，你应该会看到许多与你在引擎后台所做的一切相关的消息（见图 4-15）。\n\n![../images/502922\\\
  _1\\_En\\_4\\_Chapter/502922\\_1\\_En\\_4\\_Fig15\\_HTML.jpg](img/_HTML.jpg)\n\n\
  *图 4-15：输出日志*\n\n现在你已经了解了 UE4 界面，我们将在你使用工具的过程中详细探索所有工具。不要被本章中的大量信息所淹没。你通常不需要使用每一个工具和参数；如果你知道如何正确使用最常见的工具，就可以轻松创建任何你想要的东西。至于其余的，练习得越多，你就会变得越熟练。在一个测试场景中尝试所有内容。下一章将讨论如何为我们的项目创建资源。\n\
  \n"
- '# 5. 创建虚拟世界


  在本章中，你将使用在 Maya 中创建的一些非常基本的形状来创建一个关卡。这将作为我们的白盒关卡，为你试图创建的内容奠定基础。


  ## 创建资源库


  既然你已经完成了建模工作，这里便不再提供关于简单白盒形状的分步教程。图 5-1 展示了你将用于此项目的资源库。


  ![../images/502922\_1\_En\_5\_Chapter/502922\_1\_En\_5\_Fig1\_HTML.jpg](img/_HTML.jpg)


  *图 5-1：资源库*



  好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，精准地完成这篇英文文档的翻译工作。



  ## 创建基础关卡布局


  如图 5-1 所示，这个场景中没有什么特别之处；它只包含非常简单的几何形状。


  以下是您拥有的资源清单，所有资源均已导出为 FBX 格式。


  *   `Floor`

  *   `Grass_Pot`

  *   `Plant_Pot`

  *   `Rail_Central`

  *   `Rail_Mid`

  *   `Rail_Main`

  *   `Rail_Central_End`

  *   `Rail_Side`

  *   `Sofa`

  *   `Stairs`

  *   `Wall_Door`

  *   `Wall_Short`

  *   `Wall_Short_Side`

  *   `Wall_Split`

  *   `Wall_High`

  *   `Wall_High_Side`


  让我们先在 UE4 中创建一个新的空白场景。首先，点击 `File`，然后点击 `New Level`（见图 5-2）。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig2_HTML.jpg](img/502922_1_En_5_Fig2_HTML.jpg)


  图 5-2


  创建新关卡


  在 `New Level` 窗口中，选择 `Default`（见图 5-3）。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig3_HTML.jpg](img/502922_1_En_5_Fig3_HTML.jpg)


  图 5-3


  创建一个默认关卡


  您的新基础关卡应该看起来像图 5-4。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig4_HTML.jpg](img/502922_1_En_5_Fig4_HTML.jpg)


  图 5-4


  新的默认关卡


  这个关卡只设置了基本元素，例如灯光和雾。


  现在，让我们导入资源并开始工作。要导入资源，只需在 `Explorer` 中选择它，然后将其拖放到 UE4 的 `Content Browser` 中。执行此操作时，会打开一个导入窗口，为您提供许多文件导入选项（见图
  5-5）。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig5_HTML.jpg](img/502922_1_En_5_Fig5_HTML.jpg)


  图 5-5


  资源的导入选项


  您现在不做任何更改，因此将所有选项保留为默认值。点击 `Import All` 按钮。导入资源后，将它们放在一个名为 `Assets` 的文件夹中，以保持所有内容井井有条。路径应为
  `Content ➤ FirstPersonBP ➤ Assets`。现在，您就在 UE4 中拥有了这些资源（见图 5-6）。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig6_HTML.jpg](img/502922_1_En_5_Fig6_HTML.jpg)


  图 5-6


  `Content Browser` 中的资源


  接下来，您需要保存此关卡。按下 `Ctrl+S` 启动保存。在 `Save Level As` 窗口中，为您的地图命名，然后点击 `Save`（见图 5-7）。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig7_HTML.jpg](img/502922_1_En_5_Fig7_HTML.jpg)


  图 5-7


  保存窗口


  接下来，让我们从 `Content Browser` 中将 `Floor` 资源拖放到场景中。在 `Details` 窗口中，将其 `Location` 的所有轴设置为
  `0.0`（见图 5-8）。这将使我们的资源在三维空间中的位置为 `0,0,0`，即世界的中心。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig8_HTML.jpg](img/502922_1_En_5_Fig8_HTML.jpg)


  图 5-8


  设置资源位置


  在编辑任何参数的输入字段值时，您可以按 `Tab` 键在不同属性字段之间快速切换。这使您可以快速编辑数值。


  接下来，删除场景中现有的默认地板。然后，在 `0,0,0` 位置将 `Floor` 资源添加到场景中。现在，您的场景应该类似于图 5-9。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig9_HTML.jpg](img/502922_1_En_5_Fig9_HTML.jpg)


  图 5-9


  目前的场景


  现在，当您拖动资源时，您会注意到网格会以 UU（Unreal Units，等于 1 厘米）为单位吸附到地板上。您可以通过单击视口右上角的 `Grid Snap
  Value` 选项来更改此默认吸附值（见图 5-10）。网格吸附非常重要，因为它允许您将资源精确地放置到所需位置。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig10_HTML.jpg](img/502922_1_En_5_Fig10_HTML.jpg)


  图 5-10


  网格吸附值选项


  有了这个功能，您可以轻松地移动模块化资源，并将它们精确地放置在您想要的位置。


  接下来，让我们通过按住 `Alt` 键并沿任意轴拖动地板来复制它。如图 5-11 所示放置复制的副本。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig11_HTML.jpg](img/502922_1_En_5_Fig11_HTML.jpg)


  图 5-11


  放置复制的副本


  使用这种方法，您可以多次复制地板，并创建一个类似于图 5-12 的场景。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig12_HTML.jpg](img/502922_1_En_5_Fig12_HTML.jpg)


  图 5-12


  创建地板布局


  接下来，拖放 `Wall_Low` 和 `Wall_Short_Side` 资源，并按图 5-13 所示进行设置。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig13_HTML.jpg](img/502922_1_En_5_Fig13_HTML.jpg)


  图 5-13


  墙壁布局


  接下来，拖放 `Wall_Tall` 和 `Wall_Tall_Side` 资源，并按图 5-14 所示进行设置。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig14_HTML.jpg](img/502922_1_En_5_Fig14_HTML.jpg)


  图 5-14


  高墙的布局


  接下来，复制地板以创建屋顶，如图 5-15 所示。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig15_HTML.jpg](img/502922_1_En_5_Fig15_HTML.jpg)


  图 5-15


  通过复制地板创建屋顶


  接下来，复制矮墙并创建屋顶布局，如图 5-16 所示。


  ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig16_HTML.jpg](img/502922_1_En_5_Fig16_HTML.jpg)


  图 5-16


  目前的场景


  这个场景可以根据您的意愿进行修改。正如您所见，所有部件都是模块化的，您可以轻松地根据需要重新利用它们。这就是白盒关卡的目的：灵活性是关键。


