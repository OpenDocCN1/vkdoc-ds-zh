- fmt: '# Quixel Megascans


    Let’s now look at Quixel Megascans—specifically, Quixel Bridge. Quixel Bridge
    is software that allows you to seamlessly integrate Quixel Megascans with other
    DCC applications in just a few clicks. Figure [8-2](#502922_1_En_8_Chapter.xhtml#Fig2)
    shows the Quixel Bridge interface.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig2_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    Quixel Bridge


    Quixel Megascans is free to Unreal Engine 4 users. You can access the entire library
    of more than 12,000 3D scanned assets, including textures and 3D meshes. Click
    an asset in Quixel Bridge to download and store it on your hard drive. Once an
    asset is downloaded, you can export it to any DCC application you choose (see
    Figure [8-3](#502922_1_En_8_Chapter.xhtml#Fig3)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig3_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Quixel Bridge export settings


    For every application that you export to, there is a plugin that aids in this
    exchange process. When you select a DCC application from the list, you are given
    the option to download and install the related plugin, as shown in Figure [8-4](#502922_1_En_8_Chapter.xhtml#Fig4).


    Once the plugin has been downloaded and installed, you are good to go.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig4_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Downloading plugin for DCC of choice


    This project uses Unreal Engine 4 and its plugins. First, download the UE4 plugin.
    Next, set the Engine Version to the one you are using. Then, set the Installation
    Folder the same as the UE4 installation directory. The Project Location is the
    same folder in which you have saved your project (see Figure [8-5](#502922_1_En_8_Chapter.xhtml#Fig5)).
    Make sure to keep UE4 running when exporting assets; otherwise, it gives an error
    message. The UE4 should be running, and the Livelink should be installed and active
    before you export assets to UE4.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig5_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Setting up a plugin for UE4


    # PBR Texturing


    Let’s start texturing some of our assets. We will begin with Substance Painter.
    First, you need to import an asset—the sofa asset for this purpose. Launch Substance
    Painter and click File ➤ New Project (see Figure [8-6](#502922_1_En_8_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig6_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Creating a new project


    Set Project Template to Unreal Engine 4, select the sofa file, and leave everything
    else at the default. Next, click OK to create a project (see Figure [8-7](#502922_1_En_8_Chapter.xhtml#Fig7)).
    Make sure that Import Cameras is not checked because you are not importing cameras
    for this project.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig7_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    New project settings


    The sofa should be in the center of the screen. And now you are ready to bake
    the mesh maps. Go to Texture Set Settings and click Bake Mesh Maps (see Figure
    [8-8](#502922_1_En_8_Chapter.xhtml#Fig8)). Your screen is split into two when
    you open Substance Painter for the first time. You can press `F1`, `F2`, or `F3`
    to switch between modes, which are the Split layout, 3D-only layout, and 2D-only
    layout, respectively. Press `F2` to switch to 3D-only view mode.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig8_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig8_HTML.jpg)


    Figure 8-8


    Baking mesh maps


    The Baking window opens, allowing you to change several properties related to
    mesh map baking. First, disable the ID channel because there aren’t any ID maps
    for our mesh. Next, add the high poly mesh by clicking the add-file icon next
    to the High Definition Meshes option (see Figure [8-9](#502922_1_En_8_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig9_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig9_HTML.jpg)


    Figure 8-9


    Importing high poly mesh


    Let’s slightly increase the Max Frontal and Rear Distances (i.e., by 0.03 and
    0.05, respectively). This increases the ray casting distance by a small amount
    and helps with baking. This number is usually hard to determine; trying out a
    small value to see what works can be helpful.


    An option called Average Normals is enabled by default. If your mesh has hard
    normals, then it is beneficial to enable it so that Substance Painter averages
    the normals between the high poly and low poly maps, ensuring a smoother result.
    Although you may disable this if the hard normals need to be preserved for some
    reason. Since both high poly and low poly meshes have smoothed normals, you can
    disable it. But you should keep it enabled if you want smooth normals across the
    mesh; it won’t make much difference. With that, your settings should look similar
    to Figure [8-10](#502922_1_En_8_Chapter.xhtml#Fig10).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig10_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig10_HTML.jpg)


    Figure 8-10


    Bake settings


    Next, scroll down and change the Match setting to By Mesh Name, as shown in Figure
    [8-11](#502922_1_En_8_Chapter.xhtml#Fig11).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig11_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig11_HTML.jpg)


    Figure 8-11


    Match by mesh name


    Go to Ambient Occlusion and set Self Occlusion to By Same Mesh Name. Next, disable
    Thickness because you won’t need this map. Then, click Bake. Once the baking has
    finished, you see the normal map details baked into your mesh (see Figure [8-12](#502922_1_En_8_Chapter.xhtml#Fig12)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig12_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig12_HTML.jpg)


    Figure 8-12


    Normal information baked into the mesh'
