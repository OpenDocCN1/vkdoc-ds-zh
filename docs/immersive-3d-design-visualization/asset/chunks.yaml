    Let’s add another edge to the other side very close to the border edge. Press
    3 again to see the result (see Figure [3-107](#502922_1_En_3_Chapter.xhtml#Fig107)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig107_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig107_HTML.jpg)


    Figure 3-107


    Result after adding edge loops


    As you can see, the angles are harder now, and the mesh looks much better. These
    types of edges are called *supporting edge loops* because they support the object’s
    shape so that the Subdivide function doesn’t make the mesh too smooth.


    Let’s add some supporting edge loops to the lower part of the front headset piece.
    Add a couple of edge loops, as shown in Figure [3-108](#502922_1_En_3_Chapter.xhtml#Fig108).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig108_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig108_HTML.jpg)


    Figure 3-108


    Add a couple of edge loops as shown


    After adding the edge loops, press 3 and look at the results. You see that the
    lower parts of the front headset piece now hold on better. This is exactly what
    you want.


    Add supporting edges to places where you want to preserve the hard angles (any
    place where an angle is becoming too rounded). I added a couple to the highlighted
    region (see Figure [3-109](#502922_1_En_3_Chapter.xhtml#Fig109)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig109_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig109_HTML.jpg)


    Figure 3-109


    Adding support edge loop here


    Add another loop to the other side. Then add a couple more, as shown in Figure
    [3-110](#502922_1_En_3_Chapter.xhtml#Fig110).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig110_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig110_HTML.jpg)


    Figure 3-110


    Adding supporting edge loops


    If you press 3, your results should look similar to Figure [3-111](#502922_1_En_3_Chapter.xhtml#Fig111)
    .


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig111_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig111_HTML.jpg)


    Figure 3-111


    Result after supporting edge loops


    On the side of the mesh, you see that the triangles present on the flat face prevent
    you from adding supporting edges. To get around that, first, select all the faces,
    as shown in Figure [3-112](#502922_1_En_3_Chapter.xhtml#Fig112).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig112_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig112_HTML.jpg)


    Figure 3-112


    Select these faces


    Then extrude the faces with the parameters shown in Figure [3-113](#502922_1_En_3_Chapter.xhtml#Fig113).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig113_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig113_HTML.jpg)


    Figure 3-113


    Extrude settings


    Press 3 and look at the results.


    Let’s do the same with the front part of the visor. Select all the faces shown
    in Figure [3-114](#502922_1_En_3_Chapter.xhtml#Fig114).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig114_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig114_HTML.jpg)


    Figure 3-114


    Select these faces


    Extrude these faces with Offset set to 0.05 and Thickness set to 0\. You should
    get a result similar to Figure [3-115](#502922_1_En_3_Chapter.xhtml#Fig115).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig115_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig115_HTML.jpg)


    Figure 3-115


    Extruding with offset


    If you press 3, the subdivided view has very nice sharp angles, and the shape
    does not collapse. Let’s do the same thing for the back part. Select all the faces
    and extrude with Offset set to 0.09 (see Figure [3-116](#502922_1_En_3_Chapter.xhtml#Fig116)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig116_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig116_HTML.jpg)


    Figure 3-116


    Extruding the back region with offset


    Add one more edge loop, as shown in Figure [3-117](#502922_1_En_3_Chapter.xhtml#Fig117).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig117_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig117_HTML.jpg)


    Figure 3-117


    Adding another edge loop


    Most of the work is done on the front part of the headpiece. You only need to
    solve one final problem. Look at the front of the mesh where you created a design
    by pulling the faces upward. Applying subdivision rounds off the shape, and you
    don’t want that; but if you try to add supporting edge loops, the shape gets hard
    angles that you don’t want either. Try it and see what happens.'
  trans: '

    ### 开始细节化阶段


    完成调整阶段后，便进入细节化阶段。在此部分，你开始为网格添加细节，使其外观更佳。首先处理最前面的网格。选中它，然后按下数字`3`键，启用细分网格显示。按下`3`后，你的网格应类似于图
    3-103 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig103_HTML.jpg](img/502922_1_En_3_Fig103_HTML.jpg)

    图 3-103

    细分网格显示


    如你所见，网格现在变得平滑，所有硬角和硬边都消失了。你可以通过逐个选中所有网格部件并按下`3`来为它们全部启用此效果。这会对它们进行细分（见图 3-104）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig104_HTML.jpg](img/502922_1_En_3_Fig104_HTML.jpg)

    图 3-104

    耳机模型的细分显示


    现在看起来可能不太理想，但你需要添加支撑边环，将硬边恢复出来。这是一个很好的可视化过程，便于你后续操作和添加细节。在细节化工作中，你需要添加大量边环。我们来复习一下如何操作，因为这是本阶段不可或缺的一部分。如果存在法线反转的黑色背面，会分散注意力。选中带有背面的物体，然后依次点击“显示”➤“多边形”➤“背面消隐”。这会禁止背面渲染。再次点击“背面消隐”即可禁用此功能。


    要添加边环，只需按住 Shift+右键点击，并选择“插入边环工具”（见图 3-105）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig105_HTML.jpg](img/502922_1_En_3_Fig105_HTML.jpg)

    图 3-105

    插入边环工具


    让我们添加几个边环，如图 3-106 所示。如果因网格曲率问题无法添加边环，可以按下数字`1`键来禁用细分视图。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig106_HTML.jpg](img/502922_1_En_3_Fig106_HTML.jpg)

    图 3-106

    添加边环


    如你所见，你正将边环添加得非常靠近边界边缘。这确保了细分网格时，该处会形成更硬的棱角。现在，在另一侧同样非常靠近边界边缘的位置添加另一个边环。按下`3`键查看结果（见图
    3-107）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig107_HTML.jpg](img/502922_1_En_3_Fig107_HTML.jpg)

    图 3-107

    添加边环后的结果


    如你所见，现在的棱角更硬了，网格看起来也好多了。这类边被称为*支撑边环*，因为它们支撑着物体的形状，防止细分功能使网格过于平滑。


    现在，让我们为前面耳机部件的下部添加一些支撑边环。添加几个边环，如图 3-108 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig108_HTML.jpg](img/502922_1_En_3_Fig108_HTML.jpg)

    图 3-108

    添加几个边环，如图所示


    添加边环后，按下`3`键查看结果。你会发现前面耳机部件的下部现在保持得更好了。这正符合需求。


    在希望保持硬棱角的地方（任何棱角变得过于圆润的地方）添加支撑边。我在高亮区域添加了几个（见图 3-109）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig109_HTML.jpg](img/502922_1_En_3_Fig109_HTML.jpg)

    图 3-109

    在此处添加支撑边环


    在另一侧也添加一个边环。然后，再添加几个，如图 3-110 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig110_HTML.jpg](img/502922_1_En_3_Fig110_HTML.jpg)

    图 3-110

    添加支撑边环


    按下`3`键，你的结果应类似于图 3-111 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig111_HTML.jpg](img/502922_1_En_3_Fig111_HTML.jpg)

    图 3-111

    添加支撑边环后的结果


    在网格的侧面，你会发现平坦面上存在的三角形阻止了你添加支撑边。要解决这个问题，首先选中所有面，如图 3-112 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig112_HTML.jpg](img/502922_1_En_3_Fig112_HTML.jpg)

    图 3-112

    选中这些面


    然后使用图 3-113 所示的参数挤出这些面。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig113_HTML.jpg](img/502922_1_En_3_Fig113_HTML.jpg)

    图 3-113

    挤出设置


    按下`3`键查看结果。


    让我们对遮阳板的前部也进行同样的操作。选中图 3-114 所示的所有面。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig114_HTML.jpg](img/502922_1_En_3_Fig114_HTML.jpg)

    图 3-114

    选中这些面


    挤出这些面，将“偏移”设为`0.05`，“厚度”设为`0`。你应该会得到与图 3-115 相似的结果。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig115_HTML.jpg](img/502922_1_En_3_Fig115_HTML.jpg)

    图 3-115

    带偏移的挤出


    按下`3`键后，细分视图显示出非常漂亮的锐利棱角，形状并未坍塌。我们对后部也进行同样的操作。选中所有面，并将“偏移”设为`0.09`进行挤出（见图 3-116）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig116_HTML.jpg](img/502922_1_En_3_Fig116_HTML.jpg)

    图 3-116

    带偏移挤出后部区域


    再添加一个边环，如图 3-117 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig117_HTML.jpg](img/502922_1_En_3_Fig117_HTML.jpg)

    图 3-117

    添加另一个边环


    大部分工作都在耳机部件的前部完成了。你只需解决最后一个问题。看看网格的前部，你之前通过向上拉出面来创建了一个造型。应用细分会使形状变圆，这不是你想要的；但如果你尝试添加支撑边环，形状又会出现你不想要的硬棱角。试试看会发生什么。

    '
- fmt: "### Correcting Angle Problems\n\nTo get around the angle problem, you must\
    \ make changes to the `Insert Edge Loop` tool. First, press `Shift+Right-click`\
    \ and click the small square icon next to the `Insert Edge Loop Tool` name (see\
    \ Figure [3-118](#502922_1_En_3_Chapter.xhtml#Fig118)).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig118_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig118_HTML.jpg)\n\
    \nFigure 3-118  \n`Insert Edge Loop Tool` options\n\nIn the `Tool Settings` window,\
    \ set `Maintain Position` to `Multiple Edge Loops` and set `Number of Edge Loops`\
    \ to `1` (see Figure [3-119](#502922_1_En_3_Chapter.xhtml#Fig119)).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig119_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig119_HTML.jpg)\n\
    \nFigure 3-119  \nTool settings for `Insert Edge Loop` tool\n\nWhen you insert\
    \ an edge loop, it is inserted exactly in the center of the region. Insert four\
    \ edge loops, as highlighted in Figure [3-120](#502922_1_En_3_Chapter.xhtml#Fig120).\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig120_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig120_HTML.jpg)\n\
    \nFigure 3-120  \nInsert edge loops as shown\n\nNext, go to the top view by holding\
    \ the spacebar, clicking `Maya` in the Hotbar, and selecting `Top` from the pie\
    \ menu (see Figure [3-121](#502922_1_En_3_Chapter.xhtml#Fig121)).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig121_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig121_HTML.jpg)\n\
    \nFigure 3-121  \nSwitching to top view\n\nIn the top view, make sure that the\
    \ edge loops you added are selected (see Figure [3-122](#502922_1_En_3_Chapter.xhtml#Fig122))\
    \ and note how the entire region appears flat.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig122_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig122_HTML.jpg)\n\
    \nFigure 3-122  \nMake sure these loops are selected\n\nYou need to remove this\
    \ flatness because when you subdivide the mesh, the flatness is visible—and you\
    \ don’t want that. You want this region to be smooth. To fix this, move the edges\
    \ slightly outward (see Figure [3-123](#502922_1_En_3_Chapter.xhtml#Fig123)).\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig123_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig123_HTML.jpg)\n\
    \nFigure 3-123  \nGiving our shape a curve\n\nBy manually moving the edge loops\
    \ out, you have removed the flatness and reintroduced the smooth curve. And as\
    \ you can see in Figure [3-124](#502922_1_En_3_Chapter.xhtml#Fig124), the design\
    \ is now holding up better.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig124_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig124_HTML.jpg)\n\
    \nFigure 3-124  \nShape after adding supporting edges\n\nAs you can see, the shape\
    \ has some hardness now. Had we added supporting edges in the traditional way,\
    \ there would have been some unwanted hardening of the angles.\n\nNow let’s work\
    \ on another part of the headset. Before you add edge loops, reset its settings.\
    \ Press `Shift+Right-click` and select the `Insert Edge Loop Tool` settings (see\
    \ Figure [3-125](#502922_1_En_3_Chapter.xhtml#Fig125)).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig125_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig125_HTML.jpg)\n\
    \nFigure 3-125  \nTool settings\n\nFirst, add a couple of supporting edge loops,\
    \ as shown in Figure [3-126](#502922_1_En_3_Chapter.xhtml#Fig126).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig126_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig126_HTML.jpg)\n\
    \nFigure 3-126  \nInsert a couple of edge loops as shown\n\nAdd additional supporting\
    \ edges to all the meshes, and the result should look similar to Figure [3-127](#502922_1_En_3_Chapter.xhtml#Fig127).\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig127_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig127_HTML.jpg)\n\
    \nFigure 3-127  \nPlacement of supporting edge loops\n\nAs you can see, I placed\
    \ the supporting edge toward the center because I wanted this region softer. Placing\
    \ edges close to each other makes them tightly subdivided, but having some distance\
    \ makes the subdivision more relaxed and smoother. You can use this information\
    \ to customize the hardness.\n\nNext, select and delete the alternating edges,\
    \ as shown in Figure [3-128](#502922_1_En_3_Chapter.xhtml#Fig128).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig128_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig128_HTML.jpg)\n\
    \nFigure 3-128  \nSelect and delete alternating edges\n\nNext, while in any `Edge\
    \ Edit` mode, press `Ctrl+Shift+A` to select every edge in the mesh. Then go to\
    \ `Mesh Display ➤ Soften/Harden Edges` and click the small square button to open\
    \ the tool options. Increase `Angle` from `30` to `180` degrees (see Figure [3-129](#502922_1_En_3_Chapter.xhtml#Fig129)).\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig129_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig129_HTML.jpg)\n\
    \nFigure 3-129  \nSoftening the edges\n\nClick `Apply` to apply softening edges.\
    \ Your mesh should now look smoother, as shown in Figure [3-130](#502922_1_En_3_Chapter.xhtml#Fig130).\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig130_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig130_HTML.jpg)\n\
    \nFigure 3-130  \nHard and soft edges\n\n### Doing a Shader Test\n\nLet’s do a\
    \ quick Shader test (see Figure [3-131](#502922_1_En_3_Chapter.xhtml#Fig131)).\
    \ Right-click and go to `Assign New Material`. Then apply `Lambert`. In the `Attribute\
    \ Editor`, apply a slight color variation. This is an optional step, so no need\
    \ to worry too much about it.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig131_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig131_HTML.jpg)\n\
    \nFigure 3-131  \nDoing a quick Shader test\n\nWith supporting edge loops applied\
    \ to all the meshes, first select everything by pressing `Ctrl+Shift+A`. Then\
    \ hold the `Shift` key, and using any `Move` manipulator, create a copy of the\
    \ entire headgear model (as shown in Figure [3-132](#502922_1_En_3_Chapter.xhtml#Fig132))\
    \ to duplicate all the objects in your project.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig132_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig132_HTML.jpg)\n\
    \nFigure 3-132  \nDuplicating the entire model\n\nPlace it high to not interfere\
    \ with the model that you’re working with. Then, select any piece of the lower\
    \ model and apply the `Smooth` option by clicking `Mesh ➤ Smooth` (see Figure\
    \ [3-133](#502922_1_En_3_Chapter.xhtml#Fig133)).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig133_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig133_HTML.jpg)\n\
    \nFigure 3-133  \nApplying smooth\n\nIn the `Smooth` options window, set `Divisions`\
    \ to `1` (see Figure [3-134](#502922_1_En_3_Chapter.xhtml#Fig134)).\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig134_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig134_HTML.jpg)\n\
    \nFigure 3-134  \nApplying smooth to the mesh"
  raw: '### Correcting Angle Problems


    To get around the angle problem , you must make changes to the Insert Edge Loop
    tool. First, press Shift+Right-click and click the small square icon next to the
    Insert Edge Loop Tool name (see Figure [3-118](#502922_1_En_3_Chapter.xhtml#Fig118)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig118_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig118_HTML.jpg)


    Figure 3-118


    Insert Edge Loop Tool options


    In the Tool Settings window, set Maintain Position to Multiple Edge Loops and
    set Number of Edge Loops to 1 (see Figure [3-119](#502922_1_En_3_Chapter.xhtml#Fig119)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig119_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig119_HTML.jpg)


    Figure 3-119


    Tool settings for Insert Edge Loop tool


    When you insert an edge loop, it is inserted exactly in the center of the region.
    Insert four edge loops, as highlighted in Figure [3-120](#502922_1_En_3_Chapter.xhtml#Fig120).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig120_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig120_HTML.jpg)


    Figure 3-120


    Insert edge loops as shown


    Next, go to the top view by holding the spacebar, clicking Maya in the Hotbar,
    and selecting Top from the pie menu (see Figure [3-121](#502922_1_En_3_Chapter.xhtml#Fig121)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig121_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig121_HTML.jpg)


    Figure 3-121


    Switching to top view


    In the top view, make sure that the edge loops you added are selected (see Figure
    [3-122](#502922_1_En_3_Chapter.xhtml#Fig122)) and note how the entire region appears
    flat.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig122_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig122_HTML.jpg)


    Figure 3-122


    Make sure these loops are selected


    You need to remove this flatness because when you subdivide the mesh, the flatness
    is visible—and you don’t want that. You want this region to be smooth. To fix
    this, move the edges slightly outward (see Figure [3-123](#502922_1_En_3_Chapter.xhtml#Fig123)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig123_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig123_HTML.jpg)


    Figure 3-123


    Giving our shape a curve


    By manually moving the edge loops out, you have removed the flatness and reintroduced
    the smooth curve. And as you can see in Figure [3-124](#502922_1_En_3_Chapter.xhtml#Fig124),
    the design is now holding up better.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig124_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig124_HTML.jpg)


    Figure 3-124


    Shape after adding supporting edges


    As you can see, the shape has some hardness now. Had we added supporting edges
    in the traditional way, there would have been some unwanted hardening of the angles.


    Now let’s work on another part of the headset. Before you add edge loops, let
    reset its settings. Press Shift+Right-click and select the Insert Edge Loop Tool
    settings (see Figure [3-125](#502922_1_En_3_Chapter.xhtml#Fig125)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig125_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig125_HTML.jpg)


    Figure 3-125


    Tool settings


    First, add a couple of supporting edge loops, as shown in Figure [3-126](#502922_1_En_3_Chapter.xhtml#Fig126).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig126_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig126_HTML.jpg)


    Figure 3-126


    Insert a couple of edge loops as shown


    Add additional supporting edges to all the meshes, and the result should look
    similar to Figure [3-127](#502922_1_En_3_Chapter.xhtml#Fig127).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig127_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig127_HTML.jpg)


    Figure 3-127


    Placement of supporting edge loops


    As you can see, I placed the supporting edge toward the center because I wanted
    this region softer. Placing edges close to each other makes them tightly subdivided,
    but having some distance makes the subdivision more relaxed and smoother. You
    can use this information to customize the hardness.


    Next, select and delete the alternating edges, as shown in Figure [3-128](#502922_1_En_3_Chapter.xhtml#Fig128).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig128_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig128_HTML.jpg)


    Figure 3-128


    Select and delete alternating edges


    Next, while in any Edge Edit mode, press Ctrl+Shift+A to select every edge in
    the mesh. Then go to Mesh Display ➤ Soften/Harden Edges and click the small square
    button to open the tool options. Increase Angle from 30 to 180 degrees (see Figure
    [3-129](#502922_1_En_3_Chapter.xhtml#Fig129)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig129_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig129_HTML.jpg)


    Figure 3-129


    Softening the edges


    Click Apply to apply softening edges. Your mesh should now look smoother, as shown
    in Figure [3-130](#502922_1_En_3_Chapter.xhtml#Fig130).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig130_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig130_HTML.jpg)


    Figure 3-130


    Hard and soft edges


    ### Doing a Shader Test


    Let’s do a quick Shader test (see Figure [3-131](#502922_1_En_3_Chapter.xhtml#Fig131)).
    Right-click and go to Assign New Material. Then apply Lambert. In the Attribute
    Editor, apply a slight color variation. This is an optional step, so no need to
    worry too much about it.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig131_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig131_HTML.jpg)


    Figure 3-131


    Doing a quick Shader test


    With supporting edge loops applied to all the meshes, first select everything
    by pressing Ctrl+Shift+A. Then hold the Shift key, and using any Move manipulator,
    create a copy of the entire headgear model (as shown in Figure [3-132](#502922_1_En_3_Chapter.xhtml#Fig132))
    to duplicate all the objects in your project.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig132_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig132_HTML.jpg)


    Figure 3-132


    Duplicating the entire model


    Place it high to not interfere with the model that you’re working with. Then,
    select any piece of the lower model and apply the Smooth option by clicking Mesh
    ➤ Smooth (see Figure [3-133](#502922_1_En_3_Chapter.xhtml#Fig133)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig133_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig133_HTML.jpg)


    Figure 3-133


    Applying smooth


    In the Smooth options window, set Divisions to 1 (see Figure [3-134](#502922_1_En_3_Chapter.xhtml#Fig134)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig134_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig134_HTML.jpg)


    Figure 3-134


    Applying smooth to the mesh'
  trans: "\n### 修正角度问题\n\n要解决角度问题，你必须对`插入边环`工具进行修改。首先，按下`Shift+右键`，然后点击`插入边环工具`名称旁的小方块图标（见图\
    \ 3-118）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig118_HTML.jpg](img/502922_1_En_3_Fig118_HTML.jpg)\n\
    \n图 3-118  \n`插入边环工具`选项\n\n在`工具设置`窗口中，将`维持位置`设置为`多个边环`，并将`边环数量`设置为`1`（见图 3-119）。\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig119_HTML.jpg](img/502922_1_En_3_Fig119_HTML.jpg)\n\
    \n图 3-119  \n`插入边环`工具的工具设置\n\n当你插入边环时，它会被精确地插入到区域的中心。插入四个边环，如图 3-120 中高亮显示的部分。\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig120_HTML.jpg](img/502922_1_En_3_Fig120_HTML.jpg)\n\
    \n图 3-120  \n按图示插入边环\n\n接下来，按住空格键，在热键栏中点击`Maya`，并从饼状菜单中选择`顶`视图，以切换到顶视图（见图 3-121）。\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig121_HTML.jpg](img/502922_1_En_3_Fig121_HTML.jpg)\n\
    \n图 3-121  \n切换到顶视图\n\n在顶视图中，确保你添加的边环已被选中（见图 3-122），并注意整个区域看起来是多么平坦。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig122_HTML.jpg](img/502922_1_En_3_Fig122_HTML.jpg)\n\
    \n图 3-122  \n确保这些边环被选中\n\n你需要消除这种平坦感，因为当你细分网格时，这种平坦感会变得明显——而你并不希望如此。你希望这个区域是平滑的。要解决这个问题，请将这些边稍微向外移动（见图\
    \ 3-123）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig123_HTML.jpg](img/502922_1_En_3_Fig123_HTML.jpg)\n\
    \n图 3-123  \n为我们的形状添加曲线\n\n通过手动将边环向外移动，你已经消除了平坦感，并重新引入了平滑的曲线。正如你在图 3-124 中所见，现在的形状保持得更好。\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig124_HTML.jpg](img/502922_1_En_3_Fig124_HTML.jpg)\n\
    \n图 3-124  \n添加支撑边后的形状\n\n如你所见，现在的形状有了一些硬度。如果我们以传统方式添加支撑边，角度可能会出现一些不必要的硬化。\n\n\
    现在我们开始处理耳机的另一个部分。在添加边环之前，先重置其设置。按下`Shift+右键`，并选择`插入边环工具`设置（见图 3-125）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig125_HTML.jpg](img/502922_1_En_3_Fig125_HTML.jpg)\n\
    \n图 3-125  \n工具设置\n\n首先，添加几个支撑边环，如图 3-126 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig126_HTML.jpg](img/502922_1_En_3_Fig126_HTML.jpg)\n\
    \n图 3-126  \n按图示插入几个边环\n\n向所有网格添加额外的支撑边，结果应类似于图 3-127。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig127_HTML.jpg](img/502922_1_En_3_Fig127_HTML.jpg)\n\
    \n图 3-127  \n支撑边环的放置位置\n\n如你所见，我将支撑边朝向中心放置，因为我希望这个区域更柔和。将边彼此靠近放置会使它们细分得更紧密，但保持一定距离则会使细分更宽松、更平滑。你可以利用这一信息来自定义硬度。\n\
    \n接下来，选择并删除交替的边，如图 3-128 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig128_HTML.jpg](img/502922_1_En_3_Fig128_HTML.jpg)\n\
    \n图 3-128  \n选择并删除交替的边\n\n接着，在任何`边编辑`模式下，按下`Ctrl+Shift+A`选择网格中的每一条边。然后转到`网格显示\
    \ ➤ 柔化/硬化边`，点击小方块按钮打开工具选项。将`角度`从`30`度增加到`180`度（见图 3-129）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig129_HTML.jpg](img/502922_1_En_3_Fig129_HTML.jpg)\n\
    \n图 3-129  \n柔化边\n\n点击`应用`以应用柔化边效果。你的网格现在应该看起来更平滑了，如图 3-130 所示。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig130_HTML.jpg](img/502922_1_En_3_Fig130_HTML.jpg)\n\
    \n图 3-130  \n硬边与软边\n\n### 进行着色器测试\n\n让我们快速进行一个着色器测试（见图 3-131）。右键点击并选择`指定新材质`。然后应用`Lambert`。在`属性编辑器`中，应用轻微的颜色变化。这是一个可选步骤，所以不必过于担心。\n\
    \n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig131_HTML.jpg](img/502922_1_En_3_Fig131_HTML.jpg)\n\
    \n图 3-131  \n进行快速着色器测试\n\n在所有网格上应用支撑边环后，首先按下`Ctrl+Shift+A`选择所有内容。然后按住`Shift`键，并使用任意`移动`操纵器，创建整个头戴设备模型的副本（如图\
    \ 3-132 所示），以复制项目中的所有对象。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig132_HTML.jpg](img/502922_1_En_3_Fig132_HTML.jpg)\n\
    \n图 3-132  \n复制整个模型\n\n将其放置在较高位置，以免干扰您正在处理的模型。然后，选择下方模型的任意部件，并通过点击`网格 ➤ 平滑`来应用`平滑`选项（见图\
    \ 3-133）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig133_HTML.jpg](img/502922_1_En_3_Fig133_HTML.jpg)\n\
    \n图 3-133  \n应用平滑\n\n在`平滑`选项窗口中，将`细分次数`设置为`1`（见图 3-134）。\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig134_HTML.jpg](img/502922_1_En_3_Fig134_HTML.jpg)\n\
    \n图 3-134  \n对网格应用平滑\n"
- fmt: "### Reducing Poly Count\n\nNext, manually select and delete the edge loops\
    \ to bring down the poly count to acceptable amounts. Select the edge loops as\
    \ shown in Figure 3-135, and delete them by pressing `Ctrl+Backspace`.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig135_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig135_HTML.jpg)\n\
    \nFigure 3-135  \nSelect these edge loops\n\nNext, select and delete the edge\
    \ loops highlighted in Figure.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig136_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig136_HTML.jpg)\n\
    \nFigure 3-136  \nSelect and delete these edges\n\nNext, enable the Target Weld\
    \ tool and merge all the highlighted vertices, as shown in Figure 3-137.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig137_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig137_HTML.jpg)\n\
    \nFigure 3-137  \nMerge these vertices, bottom one to the top one\n\nMerge the\
    \ vertices as shown in Figure 3-138.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig138_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig138_HTML.jpg)\n\
    \nFigure 3-138  \nMerge vertices as shown, bottom one to top one\n\nFinally, delete\
    \ the highlighted edge shown in Figure 3-139.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig139_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig139_HTML.jpg)\n\
    \nFigure 3-139  \nSelect and delete the highlighted edge\n\nLet’s reduce the polygon\
    \ count for the other meshes as well. Select and delete all the edges, as shown\
    \ in Figure 3-140.\n\nFigure 3-140 shows that we successfully reduced the polycount\
    \ of the asset to an amount that even weaker PCs can bake. Let’s do the same for\
    \ other assets.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig140_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig140_HTML.jpg)\n\
    \nFigure 3-140  \nReduced polycount of asset\n\nRepeat the process until you have\
    \ something similar to Figure 3-141.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig141_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig141_HTML.jpg)\n\
    \nFigure 3-141  \nMesh with reduced polygon count\n\nYou can use it for baking\
    \ mesh maps in Substance Painter. Figure 3-142 shows the topology of the low poly\
    \ mesh. It accepts our high poly details with no problems.\n\n![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig142_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig142_HTML.jpg)\n\
    \nFigure 3-142  \nOur low poly model\n\nThis model still has a high number of\
    \ polygons, so use it as a high poly mesh when baking mesh maps in Substance Painter.\
    \ Make sure to keep the original mesh; it serves as a low poly mesh on which you\
    \ bake everything.\n\nAs you can see, certain parts of the mesh have been left\
    \ untouched, which is fine. You don’t want to destroy any details because they\
    \ affect the texture bake.\n\nThe next chapter explores the basics of Unreal Engine\
    \ 4.\n\n# Interactive Visualization with UE4\n\nUnreal Engine 4 is a game engine\
    \ for building games, architectural walkthroughs, product visualizations, and\
    \ more using assets and codes. They can be released on any supported platform.\
    \ UE4 is a very popular game engine. Many AAA developers and indie studios use\
    \ it to create modern games. Nowadays, if someone wants a job in the game industry,\
    \ a portfolio that includes UE4 skills is highly recommended.\n\n## The Unreal\
    \ Engine 4 Interface\n\nLet’s start with the basics of Unreal Engine 4. First,\
    \ let’s look at how to open it. Open the Epic Games Launcher and browse to the\
    \ Unreal Engine section (see Figure 4-1).\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig1_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1  \nSwitching to the Unreal Engine section\n\nUnder the Library tab,\
    \ there is a plus icon. Click it to add a version of UE4 to your library. Next,\
    \ click the Install button and select your directory to start the UE4 installation\
    \ (see Figure 4-2). Always download the latest version so that you can use the\
    \ latest features.\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig2_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2  \nInstalling UE4 version\n\nFigure 4-2 shows that UE4 version 4.25.3\
    \ is installed and ready to launch. (Version 4.24.3 was not downloaded, so the\
    \ Install button is still showing.)\n\nLaunch the version of the engine that you\
    \ installed by clicking the Launch button. In the new window that opens, create\
    \ a first-person project by selecting With Starter Content and its settings, as\
    \ shown in Figure 4-3.\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig3_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig3_HTML.jpg)\n\
    \nFigure 4-3  \nDefault settings\n\nAnd after creating a project, the first window\
    \ that you see is shown in Figure 4-4.\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig4_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4  \nThe Unreal Engine 4 interface\n\nNow, let’s discuss the basic\
    \ controls in UE4. You can press `Alt+Left-click` to *rotate* the view camera.\
    \ Press `Alt+Middle-click` to *pan* the camera. Press `Alt+Right-click` to *zoom\
    \ in and out*. Alternatively, you can hold `Right-click` and fly around with the\
    \ `W`, `S`, `A`, and `D` keys. Table 4-1 lists some of the important Unreal Engine\
    \ 4 hotkeys.\n\nTable 4-1  \nImportant Unreal Engine 4 Hotkeys\n\n| Hotkey | Effect\
    \ |\n| :--- | :--- |\n| `W` | Translate |\n| `E` | Rotate |\n| `R` | Scale |\n\
    | `Ctrl+A` | Select all |\n| `Ctrl+X` | Cut |\n| `Ctrl+C` | Copy |\n| `Ctrl+V`\
    \ | Paste |\n| `Del` | Delete |\n| `Ctrl+W` | Duplicate |\n| `Ctrl+Z` | Undo |\n\
    | `Ctrl+Y` | Redo |\n| `F2` | Rename |\n| `F` | Focus |\n| `Alt+G` | Perspective\
    \ view |\n| `Alt+H` | Front view |\n| `Alt+K` | Side view |\n| `Alt+J` | Top view\
    \ |\n| `Alt+P` | Play world |\n| `F11` | Immersive mode |\n| `G` | Game view |\n\
    | `End` | Snap to floor |\n| `Ctrl+S` | Save all |\n| `Ctrl+Shift+S` | Save current\
    \ |\n\nOn the left side of the viewport is the Place Actors panel (see Figure\
    \ 4-5). In UE4, everything that you place in the world is an actor with components\
    \ attached to them to dictate their behavior.\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig5_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5  \nPlace Actors window\n\nThe Content Browser is at the bottom of\
    \ the screen (see Figure 4-6). It is the UE4 file browser. It shows you everything\
    \ that you have imported or created for your game, including assets, codes, blueprints,\
    \ and so forth.\n\nBefore proceeding, you need to know about Blueprints and why\
    \ it is a game-changer for people who are not very familiar with programming.\
    \ Blueprints is a node-based visual programming language that allows UE4 users\
    \ to create gameplay logic using nodes without writing a single line of code.\
    \ You can even make an entire game only using Blueprints, which is good for visualization.\
    \ A bigger game should not be created by only using Blueprints because it is not\
    \ that optimized. Still, a lot of gameplay logic is made with Blueprints, so it\
    \ is very useful.\n\n![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig6_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig6_HTML.jpg)\n\
    \nFigure 4-6  \nContent Browser"
  raw: '### Reducing Poly Count


    Next, manually select and delete the edge loops to bring down the poly count to
    acceptable amounts. Select the edge loops as shown in Figure [3-135](#502922_1_En_3_Chapter.xhtml#Fig135),
    and delete them by pressing Ctrl+Backspace.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig135_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig135_HTML.jpg)


    Figure 3-135


    Select these edge loops


    Next, select and delete the edge loops highlighted in Figure.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig136_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig136_HTML.jpg)


    Figure 3-136


    Select and delete these edges


    Next, enable the Target Weld tool and merge all the highlighted vertices, as shown
    in Figure [3-137](#502922_1_En_3_Chapter.xhtml#Fig137).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig137_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig137_HTML.jpg)


    Figure 3-137


    Merge these vertices, bottom one to the top one


    Merge the vertices as shown in Figure [3-138](#502922_1_En_3_Chapter.xhtml#Fig138).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig138_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig138_HTML.jpg)


    Figure 3-138


    Merge vertices as shown, bottom one to top one


    Finally, delete the highlighted edge shown in Figure [3-139](#502922_1_En_3_Chapter.xhtml#Fig139).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig139_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig139_HTML.jpg)


    Figure 3-139


    Select and delete the highlighted edge


    Let’s reduce the polygon count for the other meshes as well. Select and delete
    all the edges, as shown in Figure [3-140](#502922_1_En_3_Chapter.xhtml#Fig140).


    Figure [3-140](#502922_1_En_3_Chapter.xhtml#Fig140) shows that we successfully
    reduced the polycount of the asset to an amount that even weaker PCs can bake.
    Let’s do the same for other assets.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig140_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig140_HTML.jpg)


    Figure 3-140


    Reduced polycount of asset


    Repeat the process until you have something similar to Figure [3-141](#502922_1_En_3_Chapter.xhtml#Fig141).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig141_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig141_HTML.jpg)


    Figure 3-141


    Mesh with reduced polygon count


    You can use it for baking mesh maps in Substance Painter. Figure [3-142](#502922_1_En_3_Chapter.xhtml#Fig142)
    shows the topology of the low poly mesh. It accepts our high poly details with
    no problems.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig142_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig142_HTML.jpg)


    Figure 3-142


    Our low poly model


    This model still has a high number of polygons, so use it as a high poly mesh
    when baking mesh maps in Substance Painter. Make sure to keep the original mesh;
    it serves as a low poly mesh on which you bake everything.


    As you can see, certain parts of the mesh have been left untouched, which is fine.
    You don’t want to destroy any details because they affect the texture bake.


    The next chapter explores the basics of Unreal Engine 4.


    # 4. Interactive Visualization with UE4


    Unreal Engine 4 is a game engine for building games, architectural walkthroughs,
    product visualizations, and more using assets and codes. They can be released
    on any supported platform. UE4 is a very popular game engine. Many AAA developers
    and indie studios use it to create modern games. Nowadays, if someone wants a
    job in the game industry, a portfolio that includes UE4 skills is highly recommended.


    ## The Unreal Engine 4 Interface


    Let’s start with the basics of Unreal Engine 4\. First, let’s look at how to open
    it. Open the Epic Games Launcher and browse to the Unreal Engine section (see
    Figure [4-1](#502922_1_En_4_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig1_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Switching to the Unreal Engine section


    Under the Library tab, there is a plus icon. Click it to add a version of UE4
    to your library. Next, click the Install button and select your directory to start
    the UE4 installation (see Figure [4-2](#502922_1_En_4_Chapter.xhtml#Fig2)). Always
    download the latest version so that you can use the latest features.


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig2_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Installing UE4 version


    Figure [4-2](#502922_1_En_4_Chapter.xhtml#Fig2) shows that UE4 version 4.25.3
    is installed and ready to launch. (Version 4.24.3 was not downloaded, so the Install
    button is still showing.)


    Launch the version of the engine that you installed by clicking the Launch button.
    In the new window that opens, create a first-person project by selecting With
    Starter Content and its settings, as shown in Figure [4-3](#502922_1_En_4_Chapter.xhtml#Fig3).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig3_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Default settings


    And after creating a project, the first window that you see is shown in Figure
    [4-4](#502922_1_En_4_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig4_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    The Unreal Engine 4 interface


    Now, let’s discuss the basic controls in UE4\. You can press Alt+Left-click to
    *rotate* the view camera. Press Alt+Middle-click to *pan* the camera. Press Alt+Right-click
    to *zoom in and out*. Alternatively, you can hold Right-click and fly around with
    the W, S, A, and D keys. Table [4-1](#502922_1_En_4_Chapter.xhtml#Tab1) lists
    some of the important Unreal Engine 4 hotkeys.


    Table 4-1


    Important Unreal Engine 4 Hotkeys


    | Hotkey | Effect |

    | --- | --- |

    | W | Translate |

    | E | Rotate |

    | R | Scale |

    | Ctrl+A | Select all |

    | Ctrl+X | Cut |

    | Ctrl+C | Copy |

    | Ctrl+V | Paste |

    | Del | Delete |

    | Ctrl+W | Duplicate |

    | Ctrl+Z | Undo |

    | Ctrl+Y | Redo |

    | F2 | Rename |

    | F | Focus |

    | Alt+G | Perspective view |

    | Alt+H | Front view |

    | Alt+K | Side view |

    | Alt+J | Top view |

    | Alt+P | Play world |

    | F11 | Immersive mode |

    | G | Game view |

    | End | Snap to floor |

    | Ctrl+S | Save all |

    | Ctrl+Shift+S | Save current |


    On the left side of the viewport is the Place Actors panel (see Figure [4-5](#502922_1_En_4_Chapter.xhtml#Fig5)).
    In UE4, everything that you place in the world is an actor with components attached
    to them to dictate their behavior.


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig5_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Place Actors window


    The Content Browser is at the bottom of the screen (see Figure [4-6](#502922_1_En_4_Chapter.xhtml#Fig6)).
    It is the UE4 file browser. It shows you everything that you have imported or
    created for your game, including assets, codes, blueprints, and so forth.


    Before proceeding, you need to know about Blueprints and why it is a game-changer
    for people who are not very familiar with programming. Blueprints is a node-based
    visual programming language that allows UE4 users to create gameplay logic using
    nodes without writing a single line of code. You can even make an entire game
    only using Blueprints, which is good for visualization. A bigger game should not
    be created by only using Blueprints because it is not that optimized. Still, a
    lot of gameplay logic is made with Blueprints, so it is very useful.


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig6_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Content Browser'
