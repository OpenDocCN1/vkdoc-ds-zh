- fmt: '### Unity3D


    Unity3D is a free game engine and an alternative to `Unreal Engine 4`. Unity3D
    is very easy to use and thus is very popular among indie and smaller game studios.
    Unity3D is a very lightweight engine and is commonly used for creating mobile
    games. It is widely used by indie studios to make minimalistic platformer, arcade,
    and similar types of games. But that doesn’t mean Unity3D can’t make impressive
    games with good graphics. Many studios take advantage of Unity3D’s simplicity
    and amazing graphics to create fantastic-looking games. Figure [2-8](#502922_1_En_2_Chapter.xhtml#Fig8)
    shows the Unity3D interface.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig8_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    Unity3D


    The software that you choose is entirely your decision. The methods shown in this
    book are not software specific. The same techniques can be easily carried over
    to other tools. The more software that you are familiar with, the stronger your
    portfolio because it shows the flexibility of your skills. The more you know,
    the better.


    There are certain things you need to be wary about, though.


    This chapter provided a brief introduction to the software that we are using throughout
    the book. In the next chapter, we jump into Maya and start modelling our first
    asset.


    # 3. Basic of 3D Modeling: Assets


    Let’s start with the basics of Maya. It is important to have a good grasp of modeling
    before you move on to making advanced stuff. Maya is a very complex software application,
    and you need to memorize many hotkeys and shortcuts if you want maximum efficiency
    while working. After that, I cover how to block out assets and scenes in Maya.


    ## Basic Maya Controls


    Let’s start with basic navigation controls. Press `Alt+Left-click` to rotate your
    viewport. Press `Alt+Middle-click` to pan your view. Press `Alt+Right-click` and
    drag to zoom in or out. Alternatively, you can use the scroll wheel to zoom in
    and out. You begin in `Perspective view`. You can change the view mode by pressing
    and holding the spacebar to open the `Hotbox menu` (see Figure [3-1](#502922_1_En_3_Chapter.xhtml#Fig1)).
    It is a condensed menu of all the Maya tools and tabs.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig1_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Hotbox menu


    You can use the `Hotbox menu` to switch between different views. To switch views,
    press and hold the spacebar. `Left-click` while hovering over the `Maya` option.
    A pie menu shows you all the available view modes (see Figure [3-2](#502922_1_En_3_Chapter.xhtml#Fig2)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig2_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    View pie menu


    From the pie menu, you can select which view you want to switch to. By default,
    you work in `Perspective view`, but you can easily switch to another view.


    Next, let’s look at working with objects. Click the `Poly Modeling tab` (see Figure
    [3-3](#502922_1_En_3_Chapter.xhtml#Fig3)) to see all the standard primitives that
    you can add to your viewport.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig3_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Poly Modeling tab


    You begin in `Object mode` by default. Table [3-1](#502922_1_En_3_Chapter.xhtml#Tab1)
    lists and describes the shortcuts that you can use in `Object mode`.


    Table 3-1


    Hotkeys and Shortcuts


    | Hotkey | Function |

    | --- | --- |

    | `W` | Move |

    | `E` | Rotate |

    | `R` | Scale |

    | `Ctrl+Shift+A` | Select all |

    | `Del` | Delete selected objects/faces/vertices (depending on selection) |

    | `Backspace` | Delete edges |

    | `Ctrl+Backspace` | Delete Edges as well as vertices |

    | `Shift+D` | Duplicate |

    | `Left-click` | Select |

    | `Shift+Ctrl+Left-click` | Add to selection |

    | `Ctrl+Left-click` | Remove from selection |

    | `Ctrl+S` | Save file |

    | `Ctrl+Z` | Undo |

    | `Ctrl+Y` | Redo |

    | `Spacebar` | Toggle Minimize/Maximize editor area |


    There are many objects that you can add to a scene. Click the cube icon (highlighted
    in Figure [3-3](#502922_1_En_3_Chapter.xhtml#Fig3)) to add a cube to your scene.


    `Right-click` to open the object pie menu (see Figure [3-4](#502922_1_En_3_Chapter.xhtml#Fig4)).
    You can use it to go to an object’s edit mode to select and edit its primitives,
    such as vertices, edges, and faces. Select the primitives in the standard shapes
    that come with Maya (like sphere or cylinder), and use Figure [3-4](#502922_1_En_3_Chapter.xhtml#Fig4)
    as a reference. An *edge* is a line on the mesh. A *vertex* is a pole where the
    edges intersect with one another. A *face* is an area enclosed by the edges.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig4_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    The vertex, edge, and face primitives


    There are certain shortcut keys in edit mode that open menus that offer various
    functionalities and tools.


    *   `Right-click` presents the mode menu that allows you to switch the edit mode.


    *   `Shift+Right-click` opens a tools menu that gives access to tools like `Insert
    Edge Loop`, `Multi-Cut`, `Merge`, `Bevel`, and `Bridge`. (These tools are discussed
    later in the book.)


    *   `Ctrl+Shift+Right-click` opens the selected transform tool’s context menu.
    (The transform tools are move, rotate, and scale).


    *   If you select an edge loop, you can slide it in any direction. Press `Shift+Ctrl`
    and use manipulators to slide the selected edge/edges.


    *   Select an edge or vertex and press the `Shift` key for the option to extrude
    the selected edge/face in the direction of your choice.


    I could discuss more, but it is better to learn new shortcuts and techniques as
    you work. But before going ahead, make sure that you have practiced all the shortcuts
    and hotkeys discussed.


    Now let’s start by creating a simple headset.'
