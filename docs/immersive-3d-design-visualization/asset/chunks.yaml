    The toolbar is at the center top of the screen. It features the tools that are
    most used as you work on your project (see Figure [4-9](#502922_1_En_4_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig9_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig9_HTML.jpg)


    Figure 4-9


    UE4 toolbar


    ## Level Editor


    The Level Editor is a core UE4 editor. It allows users to manage and edit levels.
    Levels are created and edited by placing and editing Actors in a scene. These
    actors define what any player will experience when interacting with that level
    and its actors. To open the Level Editor, go to Window ➤ Levels (see Figure [4-10](#502922_1_En_4_Chapter.xhtml#Fig10)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig10_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig10_HTML.jpg)


    Figure 4-10


    Opening the Levels panel


    Once the Levels panel is open, you see the window shown in Figure [4-11](#502922_1_En_4_Chapter.xhtml#Fig11).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig11_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig11_HTML.jpg)


    Figure 4-11


    Levels window


    The Levels panel shows all the levels present in your scene. Currently, the default
    example level is open. You can see that this window is named Persistent Level.
    You can disable this level by clicking the open eye icon before its name (see
    Figure [4-12](#502922_1_En_4_Chapter.xhtml#Fig12)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig12_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    Level visibility toggle


    Once you disable a level, everything in the scene disappears. This shows that
    every actor in your scene is a part of a level. By editing these actors, you modify
    the level. You can save your changes by clicking the pencil icon in the right
    corner of the window (see Figure [4-13](#502922_1_En_4_Chapter.xhtml#Fig13)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig13_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    Saving changes in a level


    A floppy disk icon is shown when there are no new changes to save.


    ## Output Log


    The Output Log panel is a developer tool that displays debug messages and error
    messages related to what’s happening in the background. Error messages are logged
    here, which provides valuable information on what went wrong so that you can investigate
    and fix problems. To open the output log, go to Windows ➤ Developer Tools ➤ Output
    Log (see Figure [4-14](#502922_1_En_4_Chapter.xhtml#Fig14)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig14_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig14_HTML.jpg)


    Figure 4-14


    Opening the output log


    Once the output log is open, you should see that there are many messages related
    to everything that you have done in the backend of the engine (see Figure [4-15](#502922_1_En_4_Chapter.xhtml#Fig15)).


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig15_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig15_HTML.jpg)


    Figure 4-15


    Output log


    Now you have seen the UE4 interface, and we will explore all the tools in detail
    as you use them. Don’t get too overwhelmed by the amount of information in this
    chapter. You usually don’t need to use every tool and parameter; if you know how
    to properly use the most common tools, you can easily create whatever you want.
    As for the rest, the more you practice, the more you practise the more proficient
    you become. Try everything out in a test scene. The next chapter discusses how
    to create assets for our project.


    # 5. Creating Virtual Worlds


    In this chapter, you create a level by using some very basic shapes created in
    Maya. This will be our white-box level, which serves as a foundation for what
    you are trying to make.


    ## Creating the Asset Library


    Since you have already done modelling work, there won’t be any step-by-step tutorial
    for the simple blockout shapes. Figure [5-1](#502922_1_En_5_Chapter.xhtml#Fig1)
    shows the asset library that you are using for this project.


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig1_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Asset library'
