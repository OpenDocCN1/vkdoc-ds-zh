    向下滚动。在“`Physics`”选项卡下，启用`Simulate Physics`和`MassInKg`，并取消勾选`Enable Gravity`复选框以禁用重力（见图
    15-12）。顾名思义，`Simulate Physics`使我们的对象模拟物理效果。`MassInKg`允许你设置体重。禁用重力是因为我们不希望网格体受到重力影响，否则会产生不良效果。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig12_HTML.jpg](img/502922_1_En_15_Fig12_HTML.jpg)


    图 15-12


    物理设置-1


    我们将`MassInKg`提高到一个较大的数值，比如 300，因为你希望门感觉很重。不过，按照现实世界的标准，这对门来说可能是一个荒谬的重量，但在 UE4
    中，这却是正常的感觉。接下来，将`Angular Damping`增加到 6 或 7 这样的数值。这会增加门旋转时的阻力，仿佛存在来自现实世界的摩擦力、空气阻力以及其他因素（见图
    15-13）。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig13_HTML.jpg](img/502922_1_En_15_Fig13_HTML.jpg)


    图 15-13


    设置 MassInKg 和 Angular Damping


    当我们的玩家与门发生碰撞时，我们希望门旋转，但根据当前设置，当你触碰门时，门会直接向后飞出去。现在播放你的关卡来测试一下。你需要约束这个物体，使其在触碰时仅能沿
    Z 轴旋转。为什么是 Z 轴？按下`E`键，在所有三个轴上选择并旋转你的门。注意，沿 Z 轴的旋转感觉是门最自然的旋转方式。


    现在，让我们在门上激活相关的约束。首先，锁定门在 X、Y、Z 轴上的位置，这些轴是门的铰链所在，使其无法移动。在“`Physics`”选项卡下，找到“`Constraints`”。点击“`Lock
    Position`”旁边所有 X、Y、Z 的复选框。此外，你希望旋转仅沿 Z 轴发生，因此点击“`Lock Rotation`”旁边的 X 和 Y 复选框。你的设置应类似于图
    15-14。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig14_HTML.jpg](img/502922_1_En_15_Fig14_HTML.jpg)


    图 15-14


    约束设置


    现在播放你的关卡，并尝试推门。你会看到你的门现在可以像真门一样被推开并自然打开，如图 15-15 所示。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig15_HTML.jpg](img/502922_1_En_15_Fig15_HTML.jpg)


    图 15-15


    启用了物理效果的门


    ## 作品集展示


    让我们来看一些渲染图并进行分析。图 15-16 展示了来自 Quixel Megascans 的植物素材。它们是现成的 3D 资源，可以直接导入并使用，无需太多麻烦。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig16_HTML.jpg](img/502922_1_En_15_Fig16_HTML.jpg)


    图 15-16


    来自 Quixel Megascans 的植物资源


    接下来，我们来看看场景中的玻璃材质。它叫做“`Advanced Glass Material Pack`”，是 UE4 市场上一款免费资源包的一部分（见图
    15-17）。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig17_HTML.jpg](img/502922_1_En_15_Fig17_HTML.jpg)


    图 15-17


    玻璃材质


    同样的玻璃材质也出现在图 15-18 中。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig18_HTML.jpg](img/502922_1_En_15_Fig18_HTML.jpg)


    图 15-18


    大型窗户的玻璃材质


    图 15-19 和 15-20 展示了一个浴室的全景镜头。目的是捕捉其中放置的所有物品。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig20_HTML.jpg](img/502922_1_En_15_Fig20_HTML.jpg)


    图 15-20


    浴室的俯视角


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig19_HTML.jpg](img/502922_1_En_15_Fig19_HTML.jpg)


    图 15-19


    浴室全景镜头


    接下来是配备了所有电脑和家具的办公室房间。如你所见，这里有很多重复的对象。这就是模块化设计的优势。你可以用较少的资源填充整个场景（见图 15-21 和 15-22）。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig22_HTML.jpg](img/502922_1_En_15_Fig22_HTML.jpg)


    图 15-22


    办公室全景镜头 2


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig21_HTML.jpg](img/502922_1_En_15_Fig21_HTML.jpg)


    图 15-21


    办公室全景镜头 1


    图 15-23 展示了从小办公室内部望向大办公室的另一个角度。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig23_HTML.jpg](img/502922_1_En_15_Fig23_HTML.jpg)


    图 15-23


    小办公室镜头


    图 15-24 展示了带有所有灯光的办公室走廊全景镜头。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig24_HTML.jpg](img/502922_1_En_15_Fig24_HTML.jpg)


    图 15-24


    走廊全景镜头


    最后，图 15-25 展示了配有沙发和一些植物的接待区。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig25_HTML.jpg](img/502922_1_En_15_Fig25_HTML.jpg)


    图 15-25


    办公室接待区镜头 1


    从不同角度拍摄的同一地点的另一个镜头如图 15-26 所示。


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig26_HTML.jpg](img/502922_1_En_15_Fig26_HTML.jpg)


    图 15-26


    接待区全景镜头 2

