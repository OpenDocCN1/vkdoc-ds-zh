    Replace the sofa materials with the lamp materials. Drag and drop the emissive
    map that you created into the Content Browser and then into the material editor.
    Plug it into the Emissive Color channel, as shown in Figure [10-13](#502922_1_En_10_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig13_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig13_HTML.jpg)


    Figure 10-13


    Plugging emissive map into Emissive Color input


    Save and apply this material on your mesh and see what happens. Your result should
    look somewhat similar to Figure [10-14](#502922_1_En_10_Chapter.xhtml#Fig14).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig14_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig14_HTML.jpg)


    Figure 10-14


    Results so far


    As you can see in Figure [10-14](#502922_1_En_10_Chapter.xhtml#Fig14), our lamp
    is barely glowing. Let’s fix that. Add a Multiply node and a Constant node. Convert
    the constant into a parameter and name it Emissive_Intensity. Connect them as
    shown in Figure [10-15](#502922_1_En_10_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig15_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig15_HTML.jpg)


    Figure 10-15


    Connection setup


    Save and create a material from this and name it M_Lamps. Next, drag and drop
    it on the mesh. Double-click to open the M_Lamps settings and enable the Emissive_Intensity
    parameter. Set its value to a high number like 10 (see Figure [10-16](#502922_1_En_10_Chapter.xhtml#Fig16)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig16_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig16_HTML.jpg)


    Figure 10-16


    Increasing Emissive Intensity


    Now your lamp should produce a bright glow, similar to what’s shown in Figure
    [10-17](#502922_1_En_10_Chapter.xhtml#Fig17).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig17_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig17_HTML.jpg)


    Figure 10-17


    Emissive glow from our mesh


    The next chapter explores the object properties editor in depth.


    # 11. Importing Assets in Detail


    You have already imported assets into UE4, but you haven’t explored all the tools
    in depth. This chapter is dedicated to the important settings and functions available
    as you import your assets and modify asset properties after they have been imported.'
  trans: '

    # 创建自发光材质


    让我们来创建一种自发光材质。这是一种能够自身发光或发出光线的材质类型。它能令环境呈现出良好的视觉效果。在我们的案例中，它将使灯光网格体看起来像是处于开启状态。在
    UE4 中创建自发光材质非常简单。你只需要一张图像来告诉 UE4 网格体的哪些部分需要具有自发光效果。这被称为*自发光贴图*；它通常是一张灰度图像。白色部分代表发光区域，黑色部分代表网格体上非自发光的区域（参见图
    10-7）。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig7_HTML.jpg](img/502922_1_En_10_Fig7_HTML.jpg)


    图 10-7


    一个非常简单的自发光贴图


    创建它非常容易。你只需要一款图像编辑软件，比如 Photoshop 或 GIMP，甚至 Windows 自带的默认画图应用程序也行。你可能已经猜到了，你只需要将
    UV 贴图的一些区域涂成白色，其余区域保持黑色即可。对于这个示例，我们使用一个简单的 UV 展开的灯罩形状（参见图 10-8）。让我们使用 Maya 来创建网格体和
    UV。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig8_HTML.jpg](img/502922_1_En_10_Fig8_HTML.jpg)


    图 10-8


    简单的灯罩形状


    你希望朝下的面发出光线，就像你在这类扁平灯具中看到的那样。选择 UV 壳并将其移动，如图 10-9 所示。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig9_HTML.jpg](img/502922_1_En_10_Fig9_HTML.jpg)


    图 10-9


    放置发光面


    通过点击“图像” ➤ “UV 快照”来导出此 UV（参见图 10-10）。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig10_HTML.jpg](img/502922_1_En_10_Fig10_HTML.jpg)


    图 10-10


    UV 快照


    在“UV 快照选项”面板中，将“图像格式”设置为“PNG”，“大小”设置为“1024”，然后保存（放在方便的位置）（参见图 10-11）。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig11_HTML.jpg](img/502922_1_En_10_Fig11_HTML.jpg)


    图 10-11


    图像快照设置


    在你选择的图像编辑应用程序中打开它。由于这几乎花不了一分钟，你可以使用 Windows 画图软件来绘制图像，如图 10-12 所示。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig12_HTML.jpg](img/502922_1_En_10_Fig12_HTML.jpg)


    图 10-12


    手绘自发光贴图


    图 10-12 显示了整张贴图被涂成黑色，而需要发光的面的 UV 壳所在的大致区域被涂成了白色。稍后在 UE4 中你会用到这张贴图，因此将它保存为 TGA
    文件，放在方便的位置。从 Maya 中将灯罩模型以 FBX 格式导出，命名为 `SM_Lamp_S`（SM 代表*静态网格体*）。接着，使用 Substance
    Painter 在此网格体上应用一个通用金属材质（参考第 8 章）。然后，返回 UE4。将你的网格体导入到 `Lamp_S` 文件夹中。右键点击并复制沙发主材质，将其移动到
    `Lamp_S` 文件夹。


    将复制的沙发主材质重命名为 `MM_Lamps`。双击将其打开。将沙发材质替换为灯具材质。将你创建的自发光贴图拖放到内容浏览器中，然后拖入材质编辑器。将其连接到“自发光颜色”通道，如图
    10-13 所示。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig13_HTML.jpg](img/502922_1_En_10_Fig13_HTML.jpg)


    图 10-13


    将自发光贴图连接到自发光颜色输入


    保存并将此材质应用到你的网格体上，看看会发生什么。你的结果应该与图 10-14 有些相似。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig14_HTML.jpg](img/502922_1_En_10_Fig14_HTML.jpg)


    图 10-14


    目前的结果


    如图 10-14 所示，我们的灯几乎不发光。让我们来修复这个问题。添加一个“乘法”节点和一个“常量”节点。将常量转换成一个参数，并将其命名为 `Emissive_Intensity`。按图
    10-15 所示连接它们。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig15_HTML.jpg](img/502922_1_En_10_Fig15_HTML.jpg)


    图 10-15


    连接设置


    保存并由此创建一个材质，命名为 `M_Lamps`。接下来，将其拖放到网格体上。双击打开 `M_Lamps` 设置，并启用 `Emissive_Intensity`
    参数。将其值设置为一个较高的数字，例如 10（参见图 10-16）。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig16_HTML.jpg](img/502922_1_En_10_Fig16_HTML.jpg)


    图 10-16


    增加自发光亮度


    现在你的灯应该会产生明亮的辉光，类似于图 10-17 所示的效果。


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig17_HTML.jpg](img/502922_1_En_10_Fig17_HTML.jpg)


    图 10-17


    网格体发出的自发光辉光


    下一章将深入探讨对象属性编辑器。


    # 11. 详细导入资源


    你已经将资源导入到 UE4 中了，但还没有深入探索所有工具。本章将专门介绍在导入资源以及导入后修改资源属性时可用的重要设置和功能。

    '
- fmt: '# Import Settings for Assets


    When importing assets, the Import Options panel provides several important settings.
    Drag and drop the `Headset` asset into the UE4 Content Browser. Now, let’s look
    at the Import settings. Figure [11-1](#502922_1_En_11_Chapter.xhtml#Fig1) highlights
    some important settings that are discussed in this chapter.


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig1_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig1_HTML.jpg)


    Figure 11-1: Some important import settings


    Let’s discuss them one by one. `Auto Generate Collisions` is a setting that you
    have already indirectly seen in action when assembling our first level. Automatic
    collisions generate rough collision data for meshes imported into UE4, if you
    haven’t created a collision on your own or if you are testing out assets. It does
    quick and rough work, and typically, it does not produce good collisions for complex
    meshes. You can see the collision of meshes by double-clicking them in the Content
    Browser. In the Asset Details window, click `Collision` and enable `Simple Collision`
    (see Figure [11-2](#502922_1_En_11_Chapter.xhtml#Fig2)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig2_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig2_HTML.jpg)


    Figure 11-2: Enabling collision display


    You should see the outline of the collision on your mesh, as shown in Figure [11-3](#502922_1_En_11_Chapter.xhtml#Fig3).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig3_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig3_HTML.jpg)


    Figure 11-3: Outline of the collision


    As you can see, the collision has problems. An autogenerated simple collision
    covers the mesh’s general bounds instead of accurately tracing the shape of the
    object. It is good only when testing assets or for very simple assets like walls
    or floors that have no “holes” and so forth. If you want to import another collision
    mesh for your custom-made mesh, you can import it by clicking `Complex Collision
    Mesh` under `Collision` (see Figure [11-4](#502922_1_En_11_Chapter.xhtml#Fig4)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig4_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig4_HTML.jpg)


    Figure 11-4: Assigning custom collision mesh


    ## Generating Automatic Lightmap UVs and Other Settings


    Let’s look at `Generate Lightmap UVs`. Lightmaps for assets are always generated
    in the DCC application. This option is disabled when you are importing assets
    because it is redundant most of the time. But when you are working on a white-box
    or test level, it is useful because you are not very concerned about the quality.
    It provides automatic creation of lightmaps when you want to quickly prototype
    a map or develop a simple level design. You can check your lightmap UV by clicking
    `UV` and (typically) selecting `UV Channel 1` (see Figure [11-5](#502922_1_En_11_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig5_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig5_HTML.jpg)


    Figure 11-5: Checking our UV channel


    To determine your Lightmap UV channel, check `Destination Lightmap Index` under
    Build Settings (see Figure [11-6](#502922_1_En_11_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig6_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig6_HTML.jpg)


    Figure 11-6: Destination Lightmap Index


    The lightmap index starts at 0 and goes up. The index that you see +1 is the UV
    channel number that your lightmap is located in.


    Next, let’s look at `Import Mesh LODs`. An LOD, or Level of Detail, is an important
    aspect of game assets. A game asset can render in full detail when a player is
    close to the asset. But when a player moves far away from that asset, and it is
    barely visible, there is no reason for it to have the same amount of detail as
    it does when it is close to the player.


    When you create an asset, you can also create a similar low-detail version of
    it to use as the LOD. An asset can have multiple LOD models, each one with a diminishing
    amount of polycount and detail. When imported into UE4, you can set up the fade
    distance of the asset. This determines the distance when an asset starts to fade
    into its low-detail version as the player moves further away from it.


    You can import LOD assets by going to LOD Settings and clicking `LOD Import` (see
    Figure [11-7](#502922_1_En_11_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig7_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig7_HTML.jpg)


    Figure 11-7: Import LOD


    Once the LOD has been imported, it has a default loading distance set. Save your
    asset and zoom away to see the LOD mesh that you chose to load. If you don’t have
    an LOD model, then UE4 has a built-in LOD generation tool that you can use to
    automatically decimate the details in your model. First, check the number of polygons
    on the mesh in the top-right corner of the screen (see Figure [11-8](#502922_1_En_11_Chapter.xhtml#Fig8)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig8_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig8_HTML.jpg)


    Figure 11-8: Current polycount of our asset


    Under LOD Settings, go to the LOD group and select `Deco` from the list. This
    means our asset is categorized as a Decoration asset, and UE4 has an LOD preset
    set for it. Now save the asset, and try flying away from it. You see that the
    LOD number and polycount change based on the distance you are from the mesh (see
    Figure [11-9](#502922_1_En_11_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig9_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig9_HTML.jpg)


    Figure 11-9: LOD number and polycount changes


    Let’s now look at the `Normal Import Method`. If you click its drop-down menu,
    you see three suboptions (see Figure [11-10](#502922_1_En_11_Chapter.xhtml#Fig10)).


    ![../images/502922_1_En_11_Chapter/502922_1_En_11_Fig10_HTML.jpg](images/502922_1_En_11_Chapter/502922_1_En_11_Fig10_HTML.jpg)


    Figure 11-10: Normal Import Methods


    Each option has a different effect. The default is `Import Normals`, which imports
    the normal data stored in the mesh and generates only tangent information in UE4.
    The normal and smoothing group is something that you create in the DCC application.
    The `Import Normals` option simply imports everything that your mesh has already
    stored.


    `Compute Normals` overrides the normal information stored on the mesh and generates
    new information in UE4. This includes smoothing groups and tangent information.


    The `Import Normals and Tangents` option imports all the smoothing group and tangent
    data stored directly in the imported mesh, and nothing is calculated internally.


    Each of these options has use cases. Generally, it is best to remain in the default
    `Import Normals` method.


    That’s all for this chapter. In the next chapter, you utilize all the information
    you have learned so far to create a small scene using all the assets.


    # 12. Creating a Level


    Previously, you created a basic level and learned how to use basic shapes to block
    out an idea. In this chapter, you create a very basic level, but with more details
    this time. Let’s begin by creating a rectangular area, which will be our room,
    and then populate it with some simple assets. After that, let’s bring in the headset
    that you created in previous chapters, and then finally, light our scene.'
