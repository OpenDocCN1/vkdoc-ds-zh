- fmt: '### Using the Multi-Cut Tool


    Now switch to vertex edit mode and select the `Multi-Cut` tool in the toolbar
    (see Figure [3-36](#502922_1_En_3_Chapter.xhtml#Fig36)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig36_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig36_HTML.jpg)


    Figure 3-36


    Multi-Cut tool


    Use the `Multi-Cut` tool to make two edge cuts, as shown in Figure [3-37](#502922_1_En_3_Chapter.xhtml#Fig37).
    You can press `Enter` to confirm the cut operation. Keep the tool active so that
    you can immediately perform another cut operation.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig37_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig37_HTML.jpg)


    Figure 3-37


    Adding Edge-Cuts


    Adjust the vertices of the cut to make them more horizontal. It does not have
    to be perfect; just eyeball it. Use the `Scale` tool if you want to be precise.
    Scale downward until the vertices are aligned.


    Use the `Multi-Cut` tool to connect the edges exactly as shown in Figure [3-38](#502922_1_En_3_Chapter.xhtml#Fig38).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig38_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig38_HTML.jpg)


    Figure 3-38


    Connect the edges


    Your connection should now look similar to Figure [3-39](#502922_1_En_3_Chapter.xhtml#Fig39).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig39_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig39_HTML.jpg)


    Figure 3-39


    Final edge connections


    Do the same thing on the other side of the mesh. Next, select the highlighted
    edges and delete them (see Figure [3-40](#502922_1_En_3_Chapter.xhtml#Fig40)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig40_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig40_HTML.jpg)


    Figure 3-40


    Select and delete these edges


    Your new connection should look similar to Figure [3-41](#502922_1_En_3_Chapter.xhtml#Fig41).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig41_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig41_HTML.jpg)


    Figure 3-41


    Final connection


    Now slightly move the central edge to give it a curved, smoother look (see Figure
    [3-42](#502922_1_En_3_Chapter.xhtml#Fig42) for reference).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig42_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig42_HTML.jpg)


    Figure 3-42


    Giving a curved shape to edges


    ### Joining Objects


    Let’s now create a cylinder with 20 sides. Adjust its thickness to be roughly
    the same as the front piece of the headset. Then position it as shown in Figure
    [3-43](#502922_1_En_3_Chapter.xhtml#Fig43). While in Object mode, you can use
    the Channel box to enter a more precise location for your cylinder. This helps
    fine-tune the location if positioning it manually makes it difficult to perform
    small adjustments.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig43_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig43_HTML.jpg)


    Figure 3-43


    Positioning the cylinder


    Let’s join this cylinder to the main body so that you can connect the faces and
    make one unified object. To begin, select the front headpiece. `Shift+Left-click`
    the cylinder to select it. Then press `Shift+Right-click` and select `Combine`
    from the menu (see Figure [3-44](#502922_1_En_3_Chapter.xhtml#Fig44)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig44_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig44_HTML.jpg)


    Figure 3-44


    Combining meshes


    After combining, go to edit mode and delete the faces shown in Figure [3-45](#502922_1_En_3_Chapter.xhtml#Fig45).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig45_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig45_HTML.jpg)


    Figure 3-45


    Select and delete these faces


    Next, delete the face on the headpiece facing the cylinder. Then, select the edges
    shown in Figure [3-46](#502922_1_En_3_Chapter.xhtml#Fig46).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig46_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig46_HTML.jpg)


    Figure 3-46


    Select these edges


    Then hold `Shift` and extrude the edges toward the headpiece. Next, switch to
    vertex mode. Press `Shift+Right-click`, and select `Merge Vertices` (see Figure
    [3-47](#502922_1_En_3_Chapter.xhtml#Fig47)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig47_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig47_HTML.jpg)


    Figure 3-47


    Merge Vertices


    From the menu, select `Target Weld Tool` (see Figure [3-48](#502922_1_En_3_Chapter.xhtml#Fig48)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig48_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig48_HTML.jpg)


    Figure 3-48


    Target Weld Tool


    Once enabled, your cursor changes to a `+` (plus-shaped) icon. This tool allows
    you to merge the selected vertex with a target vertex. It is very easy to use.
    First, select the vertex that you want to merge, and then select the target vertex
    where you want to merge it. In this case, select the top vertex on the extruded
    part of the cylinder, and then drag and drop it onto the adjacent vertex on the
    headset (see Figure [3-49](#502922_1_En_3_Chapter.xhtml#Fig49)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig49_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig49_HTML.jpg)


    Figure 3-49


    Target welding vertices


    Do the same for all the vertices on one side of the cylinder: merge all the extruded
    vertices of the cylinder with the same top vertex of the headset until you have
    a result similar to Figure [3-50](#502922_1_En_3_Chapter.xhtml#Fig50). Merge the
    very bottom vertex of the cylinder with the bottom vertex of the headset.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig50_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig50_HTML.jpg)


    Figure 3-50


    The result after merging vertices


    You may find yourself in a situation where you have the cylindrical detail on
    only one side of the headset. If this is the case, you can mirror all the details
    from one side of the mesh to the other side. Make sure that your object is sitting
    on the grid and is not rotated at some weird angle. Once you have ensured all
    that, click the `Mirror` tool on the toolbar (see Figure [3-51](#502922_1_En_3_Chapter.xhtml#Fig51)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig51_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig51_HTML.jpg)


    Figure 3-51


    Mirror tool


    The `Mirror` tool copies all the details from one side of the mesh to the other.
    If the result is not what you want, try rotating your object 90 degrees and mirror
    it again. Your results should look similar to Figure [3-52](#502922_1_En_3_Chapter.xhtml#Fig52).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig52_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig52_HTML.jpg)


    Figure 3-52


    Results so far'
  raw: '### Using the Multi-Cut Tool


    Now switch to vertex edit mode and select the Multi-Cut tool in the toolbar (see
    Figure [3-36](#502922_1_En_3_Chapter.xhtml#Fig36)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig36_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig36_HTML.jpg)


    Figure 3-36


    Multi-Cut tool


    Use the Multi-Cut tool to make two edge cuts, as shown in Figure [3-37](#502922_1_En_3_Chapter.xhtml#Fig37).
    You can press Enter to confirm the cut operation. Keep the tool active so that
    you can immediately perform another cut operation.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig37_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig37_HTML.jpg)


    Figure 3-37


    Adding Edge-Cuts


    Adjust the vertices of the cut to make them more horizontal. It does not have
    to be perfect; just eyeball it. Use the Scale tool if you want to be precise.
    Scale downward until the vertices are aligned.


    Use the Multi-Cut tool to connect the edges exactly as shown in Figure [3-38](#502922_1_En_3_Chapter.xhtml#Fig38).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig38_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig38_HTML.jpg)


    Figure 3-38


    Connect the edges


    Your connection should now look similar to Figure [3-39](#502922_1_En_3_Chapter.xhtml#Fig39).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig39_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig39_HTML.jpg)


    Figure 3-39


    Final edge connections


    Do the same thing on the other side of the mesh. Next, select the highlighted
    edges and delete them (see Figure [3-40](#502922_1_En_3_Chapter.xhtml#Fig40)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig40_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig40_HTML.jpg)


    Figure 3-40


    Select and delete these edges


    Your new connection should look similar to Figure [3-41](#502922_1_En_3_Chapter.xhtml#Fig41).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig41_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig41_HTML.jpg)


    Figure 3-41


    Final connection


    Now slightly move the central edge to give it a curved, smoother look (see Figure
    [3-42](#502922_1_En_3_Chapter.xhtml#Fig42) for reference).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig42_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig42_HTML.jpg)


    Figure 3-42


    Giving a curved shape to edges


    ### Joining Objects


    Let’s now create a cylinder with 20 sides. Adjust its thickness to be roughly
    the same as the front piece of the headset. Then position it as shown in Figure
    [3-43](#502922_1_En_3_Chapter.xhtml#Fig43). While in Object mode, you can use
    the Channel box to enter a more precise location for your cylinder. This helps
    fine-tune the location if positioning it manually makes it difficult to perform
    small adjustments.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig43_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig43_HTML.jpg)


    Figure 3-43


    Positioning the cylinder


    Let’s join this cylinder to the main body so that you can connect the faces and
    make one unified object. To begin, select the front headpiece. Shift+Left-click
    the cylinder to select it. Then press Shift+Right-click and select Combine from
    the menu (see Figure [3-44](#502922_1_En_3_Chapter.xhtml#Fig44)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig44_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig44_HTML.jpg)


    Figure 3-44


    Combining meshes


    After combining, go to edit mode and delete the faces shown in Figure [3-45](#502922_1_En_3_Chapter.xhtml#Fig45).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig45_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig45_HTML.jpg)


    Figure 3-45


    Select and delete these faces


    Next, delete the face on the headpiece facing the cylinder. Then, select the edges
    shown in Figure [3-46](#502922_1_En_3_Chapter.xhtml#Fig46).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig46_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig46_HTML.jpg)


    Figure 3-46


    Select these edges


    Then hold Shift and extrude the edges toward the headpiece. Next, switch to vertex
    mode. Press Shift+Right-click, and select Merge Vertices (see Figure [3-47](#502922_1_En_3_Chapter.xhtml#Fig47)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig47_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig47_HTML.jpg)


    Figure 3-47


    Merge Vertices


    From the menu, select Target Weld Tool (see Figure [3-48](#502922_1_En_3_Chapter.xhtml#Fig48)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig48_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig48_HTML.jpg)


    Figure 3-48


    Target Weld Tool


    Once enabled, your cursor changes to a + (plus-shaped) icon. This tool allows
    you to merge the selected vertex with a target vertex. It is very easy to use.
    First, select the vertex that you want to merge, and then select the target vertex
    where you want to merge it. In this case, select the top vertex on the extruded
    part of the cylinder, and then drag and drop it onto the adjacent vertex on the
    headset (see Figure [3-49](#502922_1_En_3_Chapter.xhtml#Fig49)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig49_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig49_HTML.jpg)


    Figure 3-49


    Target welding vertices


    Do the same for all the vertices on one side of the cylinder: merge all the extruded
    vertices of the cylinder with the same top vertex of the headset until you have
    a result similar to Figure [3-50](#502922_1_En_3_Chapter.xhtml#Fig50). Merge the
    very bottom vertex of the cylinder with the bottom vertex of the headset.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig50_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig50_HTML.jpg)


    Figure 3-50


    The result after merging vertices


    You may find yourself in a situation where you have the cylindrical detail on
    only one side of the headset. If this is the case, you can mirror all the details
    from one side of the mesh to the other side. Make sure that your object is sitting
    on the grid and is not rotated at some weird angle. Once you have ensured all
    that, click the Mirror tool on the toolbar (see Figure [3-51](#502922_1_En_3_Chapter.xhtml#Fig51)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig51_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig51_HTML.jpg)


    Figure 3-51


    Mirror tool


    The Mirror tool copies all the details from one side of the mesh to the other.
    If the result is not what you want, try rotating your object 90 degrees and mirror
    it again. Your results should look similar to Figure [3-52](#502922_1_En_3_Chapter.xhtml#Fig52).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig52_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig52_HTML.jpg)


    Figure 3-52


    Results so far'
  trans: '好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例，为您翻译以下英文文本。



    ### 使用多切割工具


    现在，切换至顶点编辑模式，并在工具栏中选择`多切割`工具（见图 3-36）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig36_HTML.jpg](img/502922_1_En_3_Fig36_HTML.jpg)


    图 3-36


    多切割工具


    使用`多切割`工具进行两次边缘切割，如图 3-37 所示。您可以按 `Enter` 键确认切割操作。保持工具的激活状态，以便您可以立即执行下一次切割操作。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig37_HTML.jpg](img/502922_1_En_3_Fig37_HTML.jpg)


    图 3-37


    添加边缘切割


    调整切割产生的顶点，使其更水平。不必追求完美，目测对齐即可。如果需要精确调整，可以使用`缩放`工具。向下缩放直到顶点对齐。


    使用`多切割`工具精确地连接边缘，如图 3-38 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig38_HTML.jpg](img/502922_1_En_3_Fig38_HTML.jpg)


    图 3-38


    连接边缘


    您的连接现在应类似于图 3-39。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig39_HTML.jpg](img/502922_1_En_3_Fig39_HTML.jpg)


    图 3-39


    最终的边缘连接


    在网格的另一侧执行相同操作。接下来，选中高亮显示的边缘并将其删除（见图 3-40）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig40_HTML.jpg](img/502922_1_En_3_Fig40_HTML.jpg)


    图 3-40


    选择并删除这些边缘


    您的新连接应类似于图 3-41。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig41_HTML.jpg](img/502922_1_En_3_Fig41_HTML.jpg)


    图 3-41


    最终连接


    现在，稍微移动中心边缘，使其呈现出平滑的弯曲形状（参考图 3-42）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig42_HTML.jpg](img/502922_1_En_3_Fig42_HTML.jpg)


    图 3-42


    为边缘赋予弯曲形状


    ### 合并对象


    现在，我们来创建一个有 20 个侧面的圆柱体。调整其厚度，使其大致与耳机的前片相同。然后将其定位，如图 3-43 所示。在对象模式下，您可以使用通道盒为圆柱体输入更精确的位置。如果手动定位难以进行微调，这有助于精确调整位置。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig43_HTML.jpg](img/502922_1_En_3_Fig43_HTML.jpg)


    图 3-43


    定位圆柱体


    让我们将这个圆柱体合并到主体上，这样您就可以连接面，形成一个统一的对象。首先，选择前面的头戴部件。按住`Shift`并左键单击圆柱体以将其选中。然后按`Shift+右键单击`，从菜单中选择`合并`（见图
    3-44）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig44_HTML.jpg](img/502922_1_En_3_Fig44_HTML.jpg)


    图 3-44


    合并网格


    合并后，进入编辑模式并删除图 3-45 中所示的面。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig45_HTML.jpg](img/502922_1_En_3_Fig45_HTML.jpg)


    图 3-45


    选择并删除这些面


    接下来，删除头戴部件上朝向圆柱体的那个面。然后，选中图 3-46 中所示的边缘。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig46_HTML.jpg](img/502922_1_En_3_Fig46_HTML.jpg)


    图 3-46


    选择这些边缘


    然后按住`Shift`，将这些边缘向头戴部件方向挤出。接着，切换至顶点模式。按`Shift+右键单击`，选择`合并顶点`（见图 3-47）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig47_HTML.jpg](img/502922_1_En_3_Fig47_HTML.jpg)


    图 3-47


    合并顶点


    从菜单中选择`目标焊接工具`（见图 3-48）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig48_HTML.jpg](img/502922_1_En_3_Fig48_HTML.jpg)


    图 3-48


    目标焊接工具


    启用后，您的光标会变成一个`+`（加号形状）图标。此工具允许您将选中的顶点与目标顶点合并。操作非常简便。首先，选择您要合并的顶点，然后选择您要合并到的目标顶点。在此案例中，选择圆柱体挤出部分顶部的顶点，然后将其拖放到耳机上相邻的顶点上（见图
    3-49）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig49_HTML.jpg](img/502922_1_En_3_Fig49_HTML.jpg)


    图 3-49


    目标焊接顶点


    对圆柱体一侧的所有顶点执行相同操作：将圆柱体所有挤出的顶点合并到耳机头戴的同一个顶部顶点上，直到得到类似于图 3-50 的结果。将圆柱体的最底部顶点与耳机头戴的底部顶点合并。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig50_HTML.jpg](img/502922_1_En_3_Fig50_HTML.jpg)


    图 3-50


    合并顶点后的结果


    您可能会发现圆柱体的细节只存在于耳机的一侧。如果是这种情况，您可以将网格一侧的所有细节镜像到另一侧。请确保您的对象位于网格上，并且没有以奇怪的角度旋转。确保所有条件都满足后，点击工具栏上的`镜像`工具（见图
    3-51）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig51_HTML.jpg](img/502922_1_En_3_Fig51_HTML.jpg)


    图 3-51


    镜像工具


    `镜像`工具会将网格一侧的所有细节复制到另一侧。如果结果不符合预期，请尝试将对象旋转 90 度后再镜像一次。您的结果应类似于图 3-52。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig52_HTML.jpg](img/502922_1_En_3_Fig52_HTML.jpg)


    图 3-52


    当前结果

