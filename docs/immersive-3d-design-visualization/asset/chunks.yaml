- fmt: '### Making Final Adjustments


    Press `Shift+Right-click` and select `Fill Hole` from the menu (see Figure [3-88](#502922_1_En_3_Chapter.xhtml#Fig88)).
    Let’s create the eyepieces.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig88_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig88_HTML.jpg)


    Figure 3-88


    Fill Hole


    This creates a new face. Select the new face, press `Shift+Right-click`, and select
    `Extract Faces` (see Figure [3-89](#502922_1_En_3_Chapter.xhtml#Fig89)). If the
    extracted faces are separate objects, select both, press `Shift+Right-click`,
    and select `Combine` from the menu. This combines the two meshes into one, and
    after that, you can enable `Symmetry`.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig89_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig89_HTML.jpg)


    Figure 3-89


    Extracting Faces


    After extracting and combining, switch to vertex edit mode, and using a knife
    tool, connect the central top and bottom vertices (see Figure [3-90](#502922_1_En_3_Chapter.xhtml#Fig90)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig90_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig90_HTML.jpg)


    Figure 3-90


    Connecting the central vertices


    Next, go to the face edit mode and select all the faces. Click the `Extrude` tool
    in the toolbar (see Figure [3-91](#502922_1_En_3_Chapter.xhtml#Fig91)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig91_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig91_HTML.jpg)


    Figure 3-91


    Extrude tool


    Extrude with the `Thickness` value set to 0 and an `Offset` value set to 0.3 (see
    Figure [3-92](#502922_1_En_3_Chapter.xhtml#Fig92)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig92_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig92_HTML.jpg)


    Figure 3-92


    Extruding with the Offset value


    Next, press `Shift+Right-click` again and select `Circularize Components` from
    the menu (see Figure [3-93](#502922_1_En_3_Chapter.xhtml#Fig93)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig93_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig93_HTML.jpg)


    Figure 3-93


    Circularize Components


    Set `Radial Offset` to –0.4 (see Figure [3-94](#502922_1_En_3_Chapter.xhtml#Fig94)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig94_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig94_HTML.jpg)


    Figure 3-94


    Reducing Radial offset


    Extrude again with the `Offset` value set to 0.1 (see Figure [3-95](#502922_1_En_3_Chapter.xhtml#Fig95)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig95_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig95_HTML.jpg)


    Figure 3-95


    Extruding with offset


    Extrude again with `Offset` set to 0 and `Thickness` set to 0.6 (see Figure [3-96](#502922_1_En_3_Chapter.xhtml#Fig96)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig96_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig96_HTML.jpg)


    Figure 3-96


    Extruding with thickness value


    Extrude again with `Offset` set to 0.1 and `Thickness` set to 0. Finally, extrude
    one last time with `Offset` set to 0 and `Thickness` set to –0.5. You should have
    a shape similar to Figure [3-97](#502922_1_En_3_Chapter.xhtml#Fig97).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig97_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig97_HTML.jpg)


    Figure 3-97


    Final shape


    Un-isolate everything and switch to the face edit mode of this mesh. Select all
    the faces by pressing `Ctrl+Shift+A`. Scale them up to fit the hole in a better
    way (see Figure [3-98](#502922_1_En_3_Chapter.xhtml#Fig98)) because currently,
    it appears to be too small.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig98_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig98_HTML.jpg)


    Figure 3-98


    Scaling our mesh


    Make sure to scale it up or down, depending on what you want. Your mesh may be
    different from mine, so make changes accordingly. With that, you are done with
    the basic blockout of the headset.


    Let’s make some slight changes to the overall shape and proportions. First, there
    is a gap between the two meshes, as visible in Figure [3-99](#502922_1_En_3_Chapter.xhtml#Fig99).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig99_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig99_HTML.jpg)


    Figure 3-99


    Gaps between meshes


    Fix this by selecting the smaller mesh and scale it along the Z – X plane using
    the `Scale` tool (see Figure [3-100](#502922_1_En_3_Chapter.xhtml#Fig100)). This
    may not be the best method because the mesh gets squished in proportions. An alternative
    method is described in the next step.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig100_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig100_HTML.jpg)


    Figure 3-100


    Scale using the Z – X plane handle


    Or you can select the side vertices of the smaller shape, and use `Soft Selection`
    to adjust the shape. Remember, you can enable/disable `Soft Selection` by pressing
    the `B` key. After enabling, select the vertices shown in Figure [3-101](#502922_1_En_3_Chapter.xhtml#Fig101)
    and move part of the mesh sideways.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig101_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig101_HTML.jpg)


    Figure 3-101


    Adjust shape using Soft Selection


    Also adjust any other part of the mesh that is affected because other regions
    can get misaligned. Afterward, increase the thickness of the part highlighted
    in Figure [3-102](#502922_1_En_3_Chapter.xhtml#Fig102). Currently, it appears
    to be too thin.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig102_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig102_HTML.jpg)


    Figure 3-102


    Making the mesh thicker


    Final adjustments are up to you. If you think a certain part of the mesh needs
    to be adjusted, then do as you choose. Make sure not to make any drastic changes
    to the overall shape or design unless you’re confident about what you are doing.'
  raw: '### Making Final Adjustments


    Press Shift+Right-click and select Fill Hole from the menu (see Figure [3-88](#502922_1_En_3_Chapter.xhtml#Fig88)).
    Let’s create the eyepieces.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig88_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig88_HTML.jpg)


    Figure 3-88


    Fill Hole


    This creates a new face. Select the new face, press Shift+Right-click, and select
    Extract Faces (see Figure [3-89](#502922_1_En_3_Chapter.xhtml#Fig89)). If the
    extracted faces are separate objects, select both, press Shift+Right-click, and
    select Combine from the menu. This combines the two meshes into one, and after
    that, you can enable Symmetry.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig89_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig89_HTML.jpg)


    Figure 3-89


    Extracting Faces


    After extracting and combining, switch to vertex edit mode, and using a knife
    tool, connect the central top and bottom vertices (see Figure [3-90](#502922_1_En_3_Chapter.xhtml#Fig90)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig90_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig90_HTML.jpg)


    Figure 3-90


    Connecting the central vertices


    Next, go to the face edit mode and select all the faces. Click the Extrude tool
    in the toolbar (see Figure [3-91](#502922_1_En_3_Chapter.xhtml#Fig91)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig91_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig91_HTML.jpg)


    Figure 3-91


    Extrude tool


    Extrude with the Thickness value set to 0 and an Offset value set to 0.3 (see
    Figure [3-92](#502922_1_En_3_Chapter.xhtml#Fig92)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig92_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig92_HTML.jpg)


    Figure 3-92


    Extruding with the Offset value


    Next, press Shift+Right-click again and select Circularize Components from the
    menu (see Figure [3-93](#502922_1_En_3_Chapter.xhtml#Fig93)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig93_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig93_HTML.jpg)


    Figure 3-93


    Circularize Components


    Set Radial Offset to –0.4 (see Figure [3-94](#502922_1_En_3_Chapter.xhtml#Fig94)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig94_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig94_HTML.jpg)


    Figure 3-94


    Reducing Radial offset


    Extrude again with the Offset value set to 0.1 (see Figure [3-95](#502922_1_En_3_Chapter.xhtml#Fig95)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig95_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig95_HTML.jpg)


    Figure 3-95


    Extruding with offset


    Extrude again with Offset set to 0 and Thickness set to 0.6 (see Figure [3-96](#502922_1_En_3_Chapter.xhtml#Fig96)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig96_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig96_HTML.jpg)


    Figure 3-96


    Extruding with thickness value


    Extrude again with Offset set to 0.1 and Thickness set to 0\. Finally, extrude
    one last time with Offset set to 0 and Thickness set to –0.5\. You should have
    a shape similar to Figure [3-97](#502922_1_En_3_Chapter.xhtml#Fig97).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig97_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig97_HTML.jpg)


    Figure 3-97


    Final shape


    Un-isolate everything and switch to the face edit mode of this mesh. Select all
    the faces by pressing Ctrl+Shift+A. Scale them up to fit the hole in a better
    way (see Figure [3-98](#502922_1_En_3_Chapter.xhtml#Fig98)) because currently,
    it appears to be too small.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig98_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig98_HTML.jpg)


    Figure 3-98


    Scaling our mesh


    Make sure to scale it up or down, depending on what you want. Your mesh may be
    different from mine, so make changes accordingly. With that, you are done with
    the basic blockout of the headset.


    Let’s make some slight changes to the overall shape and proportions. First, there
    is a gap between the two meshes, as visible in Figure [3-99](#502922_1_En_3_Chapter.xhtml#Fig99).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig99_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig99_HTML.jpg)


    Figure 3-99


    Gaps between meshes


    Fix this by selecting the smaller mesh and scale it along the Z – X plane using
    the Scale tool (see Figure [3-100](#502922_1_En_3_Chapter.xhtml#Fig100)). This
    may not be the best method because the mesh gets squished in proportions. An alternative
    method is described in the next step.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig100_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig100_HTML.jpg)


    Figure 3-100


    Scale using the Z – X plane handle


    Or you can select the side vertices of the smaller shape, and use Soft Selection
    to adjust the shape. Remember, you can enable/disable Soft Selection by pressing
    the B key. After enabling, select the vertices shown in Figure [3-101](#502922_1_En_3_Chapter.xhtml#Fig101)
    and move part of the mesh sideways.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig101_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig101_HTML.jpg)


    Figure 3-101


    Adjust shape using Soft Selection


    Also adjust any other part of the mesh that is affected because other regions
    can get misaligned. Afterward, increase the thickness of the part highlighted
    in Figure [3-102](#502922_1_En_3_Chapter.xhtml#Fig102). Currently, it appears
    to be too thin.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig102_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig102_HTML.jpg)


    Figure 3-102


    Making the mesh thicker


    Final adjustments are up to you. If you think a certain part of the mesh needs
    to be adjusted, then do as you choose. Make sure not to make any drastic changes
    to the overall shape or design unless you’re confident about what you are doing.'
  trans: '

    ### 进行调整与完善


    按住 `Shift+右键`，然后从菜单中选择`填充孔洞`（见图 3-88）。接下来，我们来制作目镜。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig88_HTML.jpg](img/502922_1_En_3_Fig88_HTML.jpg)


    图 3-88


    填充孔洞


    这将创建一个新面。选中这个新面，按住 `Shift+右键`，然后选择`提取面`（见图 3-89）。如果提取出的面是独立的物体，请同时选中它们，按住 `Shift+右键`，然后从菜单中选择`合并`。这会将两个网格合并为一个，之后，你便可以启用`对称`功能。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig89_HTML.jpg](img/502922_1_En_3_Fig89_HTML.jpg)


    图 3-89


    提取面


    提取并合并后，切换到顶点编辑模式，使用刀具工具连接中心顶部和底部的顶点（见图 3-90）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig90_HTML.jpg](img/502922_1_En_3_Fig90_HTML.jpg)


    图 3-90


    连接中心顶点


    接下来，进入面编辑模式，选中所有面。点击工具栏中的`挤出`工具（见图 3-91）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig91_HTML.jpg](img/502922_1_En_3_Fig91_HTML.jpg)


    图 3-91


    挤出工具


    将`厚度`值设为 0，`偏移量`值设为 0.3 进行挤出（见图 3-92）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig92_HTML.jpg](img/502922_1_En_3_Fig92_HTML.jpg)


    图 3-92


    使用偏移量值进行挤出


    接着，再次按住 `Shift+右键`，从菜单中选择`圆形化组件`（见图 3-93）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig93_HTML.jpg](img/502922_1_En_3_Fig93_HTML.jpg)


    图 3-93


    圆形化组件


    将`径向偏移`设为 –0.4（见图 3-94）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig94_HTML.jpg](img/502922_1_En_3_Fig94_HTML.jpg)


    图 3-94


    减小径向偏移


    再次挤出，将`偏移量`值设为 0.1（见图 3-95）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig95_HTML.jpg](img/502922_1_En_3_Fig95_HTML.jpg)


    图 3-95


    使用偏移值进行挤出


    再次挤出，将`偏移量`设为 0，`厚度`设为 0.6（见图 3-96）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig96_HTML.jpg](img/502922_1_En_3_Fig96_HTML.jpg)


    图 3-96


    使用厚度值进行挤出


    再次挤出，将`偏移量`设为 0.1，`厚度`设为 0。最后，再进行一次挤出，将`偏移量`设为 0，`厚度`设为 –0.5。此时你应该得到一个类似于图 3-97
    所示的形状。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig97_HTML.jpg](img/502922_1_En_3_Fig97_HTML.jpg)


    图 3-97


    最终形状


    取消隐藏所有物体，并切换到该网格的面编辑模式。按 `Ctrl+Shift+A` 选中所有面。将它们缩放，以更好地贴合孔洞（见图 3-98），因为当前看起来太小了。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig98_HTML.jpg](img/502922_1_En_3_Fig98_HTML.jpg)


    图 3-98


    缩放网格


    请根据你的需求决定是放大还是缩小。你的网格可能与我的不同，因此请进行相应调整。到此，头显的基本粗模搭建就完成了。


    接下来，我们对整体形状和比例进行一些微调。首先，如图 3-99 所示，两个网格之间存在间隙。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig99_HTML.jpg](img/502922_1_En_3_Fig99_HTML.jpg)


    图 3-99


    网格之间的间隙


    要修复这个问题，可以选中较小的网格，并使用`缩放`工具沿 Z-X 平面进行缩放（见图 3-100）。这并非最佳方法，因为网格的比例会被压缩。另一种方法在下一步中说明。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig100_HTML.jpg](img/502922_1_En_3_Fig100_HTML.jpg)


    图 3-100


    使用 Z-X 平面手柄进行缩放


    或者，你可以选择较小形状侧面的顶点，并使用`软选择`来调整形状。请记住，你可以按 `B` 键启用/禁用`软选择`。启用后，选中图 3-101 所示的顶点，然后将网格的这部分向侧面移动。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig101_HTML.jpg](img/502922_1_En_3_Fig101_HTML.jpg)


    图 3-101


    使用软选择调整形状


    还需要调整网格中任何受影响的其他部分，因为它们可能变得不对齐。之后，增加图 3-102 中高亮部分的厚度。当前，这部分看起来太薄了。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig102_HTML.jpg](img/502922_1_En_3_Fig102_HTML.jpg)


    图 3-102


    增加网格厚度


    最终的调整由你决定。如果你认为网格的某一部分需要调整，就按你的想法去做。除非你对自己的操作非常有把握，否则请确保不要对整体形状或设计做出剧烈的更改。

    '
- fmt: '### Starting the Detailing Phase


    Once you are done with the adjustment phase, you begin the detailing phase. In
    this section, you start adding details to our mesh and make it look better. You
    start with the very front mesh. Select it and press the alphanumeric `3` key to
    enable the subdivided mesh display. Your mesh should appear similar to Figure
    [3-103](#502922_1_En_3_Chapter.xhtml#Fig103) after pressing `3`.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig103_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig103_HTML.jpg)

    Figure 3-103

    Subdivided mesh display


    As you can now see, the mesh appears smooth and has lost all the hard corners
    and hard edges. You can enable this for all the mesh pieces by selecting them
    one by one and pressing `3`. This subdivides them (see Figure [3-104](#502922_1_En_3_Chapter.xhtml#Fig104)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig104_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig104_HTML.jpg)

    Figure 3-104

    Subdivided display of our headset


    It may not look good now, but add supporting edge loops and bring back the hard
    edges. It is a good visualization as you work and add details. For detailing work,
    you are adding a lot of edge loops. Let’s review how to do that because it is
    an integral part of this phase. If you have black-colored backfaces with reversed
    normals, it’s distracting. Select the object with backfaces, then go to Display
    ➤ Polygons ➤ Backface Culling. This stops the backfaces from rendering. You can
    disable it by clicking Backface Culling again.


    To add an edge loop, simply press Shift+Right-click, and select Insert Edge Loop
    Tool (see Figure [3-105](#502922_1_En_3_Chapter.xhtml#Fig105)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig105_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig105_HTML.jpg)

    Figure 3-105

    Insert Edge Loop Tool


    Let’s add a couple of edge loops, as shown in Figure [3-106](#502922_1_En_3_Chapter.xhtml#Fig106).
    You can press the alphanumeric `1` key to disable the subdivided view if you have
    problems adding an edge loop due to the curvature of the mesh.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig106_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig106_HTML.jpg)

    Figure 3-106

    Adding edge loop


    And as you can see, you are adding the edge loop very close to the border edge.
    This ensures that when you subdivide the mesh, that place has a harder angle.
    Let’s add another edge to the other side very close to the border edge. Press
    `3` again to see the result (see Figure [3-107](#502922_1_En_3_Chapter.xhtml#Fig107)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig107_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig107_HTML.jpg)

    Figure 3-107

    Result after adding edge loops


    As you can see, the angles are harder now, and the mesh looks much better. These
    types of edges are called *supporting edge loops* because they support the object’s
    shape so that the Subdivide function doesn’t make the mesh too smooth.


    Let’s add some supporting edge loops to the lower part of the front headset piece.
    Add a couple of edge loops, as shown in Figure [3-108](#502922_1_En_3_Chapter.xhtml#Fig108).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig108_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig108_HTML.jpg)

    Figure 3-108

    Add a couple of edge loops as shown


    After adding the edge loops, press `3` and look at the results. You see that the
    lower parts of the front headset piece now hold on better. This is exactly what
    you want.


    Add supporting edges to places where you want to preserve the hard angles (any
    place where an angle is becoming too rounded). I added a couple to the highlighted
    region (see Figure [3-109](#502922_1_En_3_Chapter.xhtml#Fig109)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig109_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig109_HTML.jpg)

    Figure 3-109

    Adding support edge loop here


    Add another loop to the other side. Then add a couple more, as shown in Figure
    [3-110](#502922_1_En_3_Chapter.xhtml#Fig110).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig110_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig110_HTML.jpg)

    Figure 3-110

    Adding supporting edge loops


    If you press `3`, your results should look similar to Figure [3-111](#502922_1_En_3_Chapter.xhtml#Fig111)
    .


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig111_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig111_HTML.jpg)

    Figure 3-111

    Result after supporting edge loops


    On the side of the mesh, you see that the triangles present on the flat face prevent
    you from adding supporting edges. To get around that, first, select all the faces,
    as shown in Figure [3-112](#502922_1_En_3_Chapter.xhtml#Fig112).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig112_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig112_HTML.jpg)

    Figure 3-112

    Select these faces


    Then extrude the faces with the parameters shown in Figure [3-113](#502922_1_En_3_Chapter.xhtml#Fig113).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig113_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig113_HTML.jpg)

    Figure 3-113

    Extrude settings


    Press `3` and look at the results.


    Let’s do the same with the front part of the visor. Select all the faces shown
    in Figure [3-114](#502922_1_En_3_Chapter.xhtml#Fig114).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig114_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig114_HTML.jpg)

    Figure 3-114

    Select these faces


    Extrude these faces with Offset set to `0.05` and Thickness set to `0`. You should
    get a result similar to Figure [3-115](#502922_1_En_3_Chapter.xhtml#Fig115).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig115_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig115_HTML.jpg)

    Figure 3-115

    Extruding with offset


    If you press `3`, the subdivided view has very nice sharp angles, and the shape
    does not collapse. Let’s do the same thing for the back part. Select all the faces
    and extrude with Offset set to `0.09` (see Figure [3-116](#502922_1_En_3_Chapter.xhtml#Fig116)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig116_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig116_HTML.jpg)

    Figure 3-116

    Extruding the back region with offset


    Add one more edge loop, as shown in Figure [3-117](#502922_1_En_3_Chapter.xhtml#Fig117).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig117_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig117_HTML.jpg)

    Figure 3-117

    Adding another edge loop


    Most of the work is done on the front part of the headpiece. You only need to
    solve one final problem. Look at the front of the mesh where you created a design
    by pulling the faces upward. Applying subdivision rounds off the shape, and you
    don’t want that; but if you try to add supporting edge loops, the shape gets hard
    angles that you don’t want either. Try it and see what happens.'
