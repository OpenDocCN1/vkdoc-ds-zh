- fmt: '# VR for Product Visualization


    Businesses are increasingly investing in developing tools, applications, and devices
    for VR and AR support. Even though few people use it now, people become interested
    in products if presented in a fancy way. It shows that a company is progressive
    and interested in the quality of its products and modernization. Companies can
    attractively display their product lineup.


    This can attract a potential customer who may have previously overlooked the product,
    which is especially useful in the automobile industry since users need to see
    what kind of vehicle they are purchasing. A potential customer can virtually preview
    the car they are interested in purchasing to help make their decision. A customer
    can digitally explore a catalog of vehicles from the comfort of their home, and
    then they can easily choose the one they like. Figure [1-6](#502922_1_En_1_Chapter.xhtml#Fig6)
    represents the digital construction of a vehicle.


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig6_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    Product visualization (Source: [*https://pixabay.com/*](https://pixabay.com/))


    # VR for Space Exploration Simulation


    Virtual reality has found a lot of use in space and planetary exploration. It
    is used by scientists to train pilots to drive rovers on other planets by simulating
    the experience of piloting a spacecraft or rover, which are difficult to drive,
    and one mistake can have a high cost. Space-faring organizations must train their
    pilots well. Figure [1-7](#502922_1_En_1_Chapter.xhtml#Fig7) represents space
    exploration simulation.


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig7_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Representation of space exploration simulation (Source: [*https://pixabay.com/*](https://pixabay.com/))


    With all of this in mind, let’s jump to the next chapter, which discusses the
    tools of the trade—that is, the software that we use throughout the book to create
    a design visualization product and an immersive 3D scene.


    # 2. Tools for Architectural Visualization


    Welcome to Chapter [2](#502922_1_En_2_Chapter.xhtml). This chapter introduces
    the software and tools used throughout the book so that you can familiarize yourself
    with them. These tools are not the only software that you can use, however. The
    skills you learn are transferrable to any DCC (digital content creation) application,
    whether free or paid. For example, you can easily apply the same principles used
    in `Blender` or `3DS Max` for modelling, `Quixel Mixer` for texturing, or `Unity3D`
    as a game engine to similar software.


    ## Maya for Design Visualization


    `Maya` is an industry-standard modelling and content-creation software application
    that is used across a wide variety of fields. Experience with `Maya` is desirable
    if you want a job in the modelling, unwrapping, or animation sectors of CGI or
    the game industry. Initially developed by `Wavefront Technologies`, version 1.0
    was released in February 1998. `Autodesk` acquired it in 2005.


    In this book, we use `Maya` for modelling and unwrapping. `Maya` has robust modelling
    tools that simplify your work with shortcuts and accessible pie menus.


    Figure [2-1](#502922_1_En_2_Chapter.xhtml#Fig1) shows the default `Maya` interface.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig1_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    The default Maya interface


    ## Substance Painter for PBR Texturing


    `Substance Painter` is a 3D, physically based rendering (PBR) texturing software
    with a real-time viewport. Texturing assets in `Substance Painter` is straightforward.
    Painting in 3D and immediately seeing the effects in real time is handy, but that’s
    not all that makes `Substance Painter` so good; it is the incredible arsenal of
    procedural effects, smart materials, smart masks, and generators. Figure [2-2](#502922_1_En_2_Chapter.xhtml#Fig2)
    shows `Substance Painter`’s default interface when launched.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig2_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Substance Painter interface


    The large selection of expertly crafted materials that come with a `Substance`
    suite subscription in the form of `Substance Source` is an excellent resource
    for any project. Also, `Substance Share` is a platform on which the `Substance`
    community shares their creations for free, which further makes `Substance Painter`
    such a good 3D texturing tool.


    ## Quixel Mixer


    `Quixel Mixer` is a free 3D texturing and material authoring tool for texturing
    assets or generating new material by leveraging `Quixel Megascans`, a vast library
    at your disposal while you are texturing. Figure [2-3](#502922_1_En_2_Chapter.xhtml#Fig3)
    shows the `Quixel Mixer` interface.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig3_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Quixel Mixer


    ## Acquiring Materials from Quixel Megascans


    `Quixel Megascans` is a premium photoscanned library of assets like materials,
    textures, decals, grunges, imperfection maps, 3D assets, and more. It is a high-quality
    library used by large AAA companies for developing games and movies. It is a good
    resource for materials and textures that are not only realistic but also perfectly
    tileable and game ready. This allows you to easily create modular designs with
    very little effort—enabling you to be as creative as you want. It also has outstanding
    3D assets, such as models and foliage that allow you to populate your scenes with
    realistic assets in a single click.


    `Quixel Megascans` provides ready-to-use assets that are easily imported into
    any DCC tool. The best thing about `Quixel Megascans` is that it is completely
    free to use with `Unreal Engine 4`. Figure [2-4](#502922_1_En_2_Chapter.xhtml#Fig4)
    shows the default `Quixel Bridge` interface.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig4_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Quixel Bridge


    ## Immersive Design Visualization Using UE4


    Now let’s look at the final software—the game engine. We are using `Unreal Engine
    4`, which is a very popular in indie studios and many AAA studios. `UE4` is very
    easy to use and comes with many templates and tools to help you speed up your
    workflow. Figure [2-5](#502922_1_En_2_Chapter.xhtml#Fig5) shows the default interface
    for `UE4`’s First-Person Shooter template.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig5_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    UE4 first-person template


    ## Alternative Applications for Design


    ### Blender


    `Blender` is a free DCC application that creates models, UVs, textures, animations,
    visual effects (VFX), and more. This tool is a good entry point for beginners
    because it has no entry fee. `Blender` has a large community and good beginner
    guides on YouTube. The newer versions of `Blender` are easy to use, and it has
    a very user-friendly minimalist interface. `Blender` may not be popular in the
    AAA industry, but indie studios use it a lot because it is completely free and
    open source. Figure [2-6](#502922_1_En_2_Chapter.xhtml#Fig6) shows `Blender`’s
    default interface.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig6_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    Blender interface


    ### 3DS Max


    `3DS Max` is a DCC app by `Autodesk`. It is similar to `Maya` in form and function,
    but when it comes to layout and the method of working, it is quite different.
    It has slightly different controls and other hotkeys for functions. Like `Maya`,
    `3DS Max` is popular in gaming studios and is widely used for making architectural
    assets. Figure [2-7](#502922_1_En_2_Chapter.xhtml#Fig7) shows the `3DS Max` interface.


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig7_HTML.jpg](images/502922_1_En_2_Chapter/502922_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    The 3DS Max interface'
  raw: '## VR for Product Visualization


    Businesses are increasingly investing in developing tools, applications, and devices
    for VR and AR support. Even though few people use it now, people become interested
    in products if presented in a fancy way. It shows that a company is progressive
    and interested in the quality of its products and modernization. Companies can
    attractively display their product lineup.


    This can attract a potential customer who may have previously overlooked the product,
    which is especially useful in the automobile industry since users need to see
    what kind of vehicle they are purchasing. A potential customer can virtually preview
