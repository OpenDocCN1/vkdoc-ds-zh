- fmt: '# Creating Emissive Materials


    Let’s create an emissive material. It is a type of material that glows or emits
    light on its own. It gives a nice look to an environment. In our case, they will
    make the light meshes appear to be on. Creating an emissive material is simple
    in UE4. All you need is an image that tells the UE4 which parts of your mesh need
    to have the emissive effect. This is called an *emissive map*; it is usually a
    grayscale image. The white parts represent the glowing areas, and the black parts
    represent the non-emissive areas on the mesh (see Figure [10-7](#502922_1_En_10_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig7_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig7_HTML.jpg)


    Figure 10-7


    A very simple emissive map


    Creating one is very easy. All you need is an image-editing software like Photoshop
    or GIMP, or even the default Paint application that comes with Windows. As you
    may have already guessed, you just need to paint some areas of your UV map white,
    and the rest of the areas remain black. For this example, let’s use a simple UV
    unwrapped lamp shape (see Figure [10-8](#502922_1_En_10_Chapter.xhtml#Fig8)).
    Let’s use Maya to create our mesh and UVs.


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig8_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig8_HTML.jpg)


    Figure 10-8


    Simple lamp shape


    You want the bottom-facing face to produce light, as you see in flat lamps like
    these. Select the UV shell and move it as shown in Figure [10-9](#502922_1_En_10_Chapter.xhtml#Fig9).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig9_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig9_HTML.jpg)


    Figure 10-9


    Place the glowing face


    Let’s export this UV by clicking Image ➤ UV Snapshot (see Figure [10-10](#502922_1_En_10_Chapter.xhtml#Fig10)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig10_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig10_HTML.jpg)


    Figure 10-10


    UV snapshot


    In the UV Snapshot Options panel, set Image Format to PNG and Size to 1024, and
    then save (somewhere convenient) (see Figure [10-11](#502922_1_En_10_Chapter.xhtml#Fig11)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig11_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig11_HTML.jpg)


    Figure 10-11


    Image snapshot settings


    Open it in the image-editing application of your choice. Since this takes barely
    a minute to do, you can use Windows Paint to paint the image, as shown in Figure
    [10-12](#502922_1_En_10_Chapter.xhtml#Fig12).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig12_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig12_HTML.jpg)


    Figure 10-12


    Hand-painted emissive map


    Figure [10-12](#502922_1_En_10_Chapter.xhtml#Fig12) shows the entire map painted
    black and the general area where the UV shell of the face that needs to glow is
    painted white. You need this map later in UE4, so save it as a TGA file in a convenient
    location. Export the lamp model from Maya as `SM_Lamp_S` (SM stands for *static
    mesh*) in FBX format. Next, apply a generic metal material on this mesh using
    Substance Painter (refer to Chapter [8](#502922_1_En_8_Chapter.xhtml)). Then,
    return to UE4. Import your mesh into a `Lamp_S` folder. Right-click and duplicate
    the sofa master material and move it to the `Lamp_S` folder.


    Rename the duplicated sofa master material `MM_Lamps`. Double-click to open it.
    Replace the sofa materials with the lamp materials. Drag and drop the emissive
    map that you created into the Content Browser and then into the material editor.
    Plug it into the Emissive Color channel, as shown in Figure [10-13](#502922_1_En_10_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig13_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig13_HTML.jpg)


    Figure 10-13


    Plugging emissive map into Emissive Color input


    Save and apply this material on your mesh and see what happens. Your result should
    look somewhat similar to Figure [10-14](#502922_1_En_10_Chapter.xhtml#Fig14).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig14_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig14_HTML.jpg)


    Figure 10-14


    Results so far


    As you can see in Figure [10-14](#502922_1_En_10_Chapter.xhtml#Fig14), our lamp
    is barely glowing. Let’s fix that. Add a Multiply node and a Constant node. Convert
    the constant into a parameter and name it `Emissive_Intensity`. Connect them as
    shown in Figure [10-15](#502922_1_En_10_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig15_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig15_HTML.jpg)


    Figure 10-15


    Connection setup


    Save and create a material from this and name it `M_Lamps`. Next, drag and drop
    it on the mesh. Double-click to open the `M_Lamps` settings and enable the `Emissive_Intensity`
    parameter. Set its value to a high number like 10 (see Figure [10-16](#502922_1_En_10_Chapter.xhtml#Fig16)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig16_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig16_HTML.jpg)


    Figure 10-16


    Increasing Emissive Intensity


    Now your lamp should produce a bright glow, similar to what’s shown in Figure
    [10-17](#502922_1_En_10_Chapter.xhtml#Fig17).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig17_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig17_HTML.jpg)


    Figure 10-17


    Emissive glow from our mesh


    The next chapter explores the object properties editor in depth.


    # 11. Importing Assets in Detail


    You have already imported assets into UE4, but you haven’t explored all the tools
    in depth. This chapter is dedicated to the important settings and functions available
    as you import your assets and modify asset properties after they have been imported.'
