    ## Level Editor


    `Level Editor`是 UE4 的核心编辑器。它允许用户管理和编辑关卡。关卡通过将`Actor`放置并编辑到场景中来创建和编辑。这些`Actor`定义了玩家在与该关卡及其`Actor`交互时将体验到的内容。若要打开`Level
    Editor`，请导航至 `Window` ➤ `Levels`（见图 [4-10](#502922_1_En_4_Chapter.xhtml#Fig10)）。


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig10_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig10_HTML.jpg)


    *图 4-10：打开 Levels 面板*


    一旦打开`Levels`面板，你将看到如图 [4-11](#502922_1_En_4_Chapter.xhtml#Fig11) 所示的窗口。


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig11_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig11_HTML.jpg)


    *图 4-11：Levels 窗口*


    `Levels`面板显示场景中所有存在的关卡。目前，默认的示例关卡是打开的。你可以看到这个窗口被命名为`Persistent Level`。你可以通过点击其名称前的睁眼图标来禁用此关卡（见图
    [4-12](#502922_1_En_4_Chapter.xhtml#Fig12)）。


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig12_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig12_HTML.jpg)


    *图 4-12：关卡可见性切换*


    一旦你禁用一个关卡，场景中的所有内容都会消失。这表明你场景中的每一个`Actor`都是一个关卡的一部分。通过编辑这些`Actor`，你可以修改该关卡。你可以通过点击窗口右下角的铅笔图标来保存更改（见图
    [4-13](#502922_1_En_4_Chapter.xhtml#Fig13)）。


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig13_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig13_HTML.jpg)


    *图 4-13：保存关卡更改*


    当没有新的更改需要保存时，会显示一个软盘图标。


    ## Output Log


    `Output Log`面板是一个开发者工具，用于显示与后台发生情况相关的调试消息和错误消息。错误消息会被记录在此，这提供了有关错误原因的宝贵信息，以便你进行调查和修复问题。若要打开输出日志，请导航至
    `Windows` ➤ `Developer Tools` ➤ `Output Log`（见图 [4-14](#502922_1_En_4_Chapter.xhtml#Fig14)）。


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig14_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig14_HTML.jpg)


    *图 4-14：打开输出日志*


    一旦输出日志打开，你应该会看到许多与你在引擎后台所做的一切相关的消息（见图 [4-15](#502922_1_En_4_Chapter.xhtml#Fig15)）。


    ![../images/502922_1_En_4_Chapter/502922_1_En_4_Fig15_HTML.jpg](images/502922_1_En_4_Chapter/502922_1_En_4_Fig15_HTML.jpg)


    *图 4-15：输出日志*


    现在你已经了解了 UE4 界面，我们将在你使用工具的过程中详细探索所有工具。不要被本章中的大量信息所淹没。你通常不需要使用每一个工具和参数；如果你知道如何正确使用最常见的工具，就可以轻松创建任何你想要的东西。至于其余的，练习得越多，你就会变得越熟练。在一个测试场景中尝试所有内容。下一章将讨论如何为我们的项目创建资源。


    # 5. 创建虚拟世界


    在本章中，你将使用在 Maya 中创建的一些非常基本的形状来创建一个关卡。这将作为我们的白盒关卡，为你试图创建的内容奠定基础。


    ## 创建资源库


    既然你已经完成了建模工作，这里便不再提供关于简单白盒形状的分步教程。图 [5-1](#502922_1_En_5_Chapter.xhtml#Fig1) 展示了你将用于此项目的资源库。


