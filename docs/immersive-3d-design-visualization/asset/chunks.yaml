    ## Using Lightmass Importance Volume


    Before you do the final baking, let’s bring in a very important volume that tells
    UE4 where to focus the light calculation in the world. UE4 does not automatically
    know how you set up your level and where you want to focus the lighting. `Lightmass
    Importance Volume` serves this purpose. In the **Place Actors** panel, click **Volumes**,
    and you see it in the list (see Figure 7-13).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig13_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig13_HTML.jpg)


    **Figure 7-13** Lightmass Importance Volume


    Drag and drop `Lightmass Importance Volume` into your scene. It is small at first.
    Use the **Scale** tool (shortcut `R`) and scale it large enough to completely
    surround the entire scene and contain it inside itself (see Figure 7-14).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig14_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig14_HTML.jpg)


    **Figure 7-14** The boundary of `Lightmass Importance Volume` in light yellow
    color.


    ## Eliminating Baking Errors


    It’s time to tweak a few settings in the light to eliminate some baking errors.
    Go to the **Windows** tab in the menu bar and click **World Settings** (see Figure
    7-15). This opens a **World Settings** panel next to your **Details** panel.


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig15_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig15_HTML.jpg)


    **Figure 7-15** World Settings


    In the **World Settings** panel, under the **Lightmass** tab, you need to change
    a few settings (see Figure 7-16). First, reduce the `Static Lighting Level Scale`
    to 0.4. Then, increase the `Indirect Lighting Quality` to 3.0. Finally, increase
    the `Num Indirect Lighting Bounces` to 7.


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig16_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig16_HTML.jpg)


    **Figure 7-16** Lightmass Settings


    Next, increase the `Num Sky Lighting Bounces` to 5 and `Indirect Lighting Smoothness`
    to 1.2 (see Figure 7-17).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig17_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig17_HTML.jpg)


    **Figure 7-17** Changing more Lightmass settings.


    ## Baking the Scene


    You are ready to bake the scene. Switch the **Lighting Quality** to **Production**,
    and click **Bake** (see Figure 7-18).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig18_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig18_HTML.jpg)


    **Figure 7-18** Increase Lighting Quality


    The results of the completed baking are shown in Figures 7-19, 7-20, and 7-21.


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig21_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig21_HTML.jpg)


    **Figure 7-21** Result of bake 3


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig20_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig20_HTML.jpg)


    **Figure 7-20** Result of bake 2


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig19_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig19_HTML.jpg)


    **Figure 7-19** Result of bake 1


    Tweak the lightmap settings for all the other assets, and you can achieve good
    results. In the next chapter, you learn about PBR Integrated Texturing workflows.


    # 8. PBR Integrated Texturing


    In this chapter, you see PBR integrated texturing workflows. There are multiple
    tools available to aid in texturing your assets. Throughout this chapter, Quixel
    Megascans and Substance Painter are used. Let’s start with a short introduction
    to both software applications.


    ## Substance Painter


    Substance Painter is an industry-standard texturing tool used by both AAA and
    indie studios. It is very user-friendly and easy to use. A large community constantly
    offers free assets that you can use for your projects. A premium asset library
    called Substance Source provides a high-quality and curated library of assets
    that you can access if you subscribe to Substance Suite.


    Let’s look at Substance Painter’s basic controls and interface. This book uses
    version 2019.3.2. When you first launch Substance Painter, your window looks similar
    to Figure 8-1.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig1_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig1_HTML.jpg)


    **Figure 8-1** Substance Painter interface


    At the bottom of the screen is the *shelf*, which allows you to access various
    assets that you need during the texturing process. The **Properties** window is
    where you change and tweak your layers, brushes, materials, and so on. The **Layer**
    panel allows you to add, edit, and manage layers. Substance Painter is a layer-based
    texturing program; therefore, you work with layers a lot. The **Texture Set Settings**
    panel allows you to manage attributes related to texture sets.


    Now let’s discuss Substance Painter’s controls. Press `Alt + Left-click` to rotate
    the view. Press `Alt + Middle-click` to pan the view. Press `Alt + Right-click`
    to zoom the view. Table 8-1 lists many of the hotkeys and their purposes.


    **Table 8-1** Substance Painter Hotkeys


    | Hotkey | Effect |

    | :--- | :--- |

    | `Alt + LMB` | Rotate view |

    | `Alt + MMB` | Pan view |

    | `Alt + RMB` | Zoom view |

    | `Alt + Shift + LMB` | Rotate camera while snapping |

    | `F` | Center camera on mesh |

    | `F5` | Switch to perspective camera |

    | `F6` | Switch to orthographic camera |

    | `LMB` | Paint / Use tool |

    | `]` | Increase tool size |

    | `[` | Decrease tool size |

    | `F9` | Painting mode |

    | `F10` | Rendering mode |

    | `Shift + LMB` | Draw straight line |

    | `Ctrl + Shift + LMB` | Draw straight line while snapping |

    | `B` | Switch mesh map being displayed |

    | `M` | Material mode |

    | `C` | Switch channel displayed |'
