- fmt: '# Isolating the Inner Object


    Let’s work on the inner headset. Isolate it first, and then switch to `Edge Edit`
    mode and add an edge loop, as shown in Figure 3-69.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig69_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig69_HTML.jpg)


    *Figure 3-69* — Add edge loop as shown


    Now select the edges shown in Figure 3-70.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig70_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig70_HTML.jpg)


    *Figure 3-70* — Select the highlighted edges


    Press `Shift+Ctrl`, and using the `Move` manipulator, slide these edges upward
    to make the upper region of the mesh thinner. See Figure 3-71 for reference.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig71_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig71_HTML.jpg)


    *Figure 3-71* — Slide edges up


    Next, make the faces highlighted in Figure 3-72 as the viewing holes. First, you
    need to make changes in the geometries surrounding them.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig72_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig72_HTML.jpg)


    *Figure 3-72* — Viewing holes


    Enable the `Target Weld` tool and merge the vertices with the corner vertex, as
    shown in Figure 3-73.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig73_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig73_HTML.jpg)


    *Figure 3-73* — Merge vertices to the corner


    Your results should look similar to Figure 3-74.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig74_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig74_HTML.jpg)


    *Figure 3-74* — Merged vertices at corner


    Next, select and delete the faces highlighted in Figure 3-75.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig75_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig75_HTML.jpg)


    *Figure 3-75* — Select and delete these faces


    You can adjust the shape more if needed. It is important to make any changes to
    the shape now because, after this, you extrude all the faces to create thickness.
    Once the thickness has been created, any further editing takes a lot of effort.


    Select all the faces by pressing `Ctrl+Shift+A`. Go to `Edit Mesh > Extrude` to
    extrude with the `Thickness` value set to `0.25`. Your results should look similar
    to Figure 3-76.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig76_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig76_HTML.jpg)


    *Figure 3-76* — Extruding faces


    Next, add an edge loop by pressing `Ctrl+Right-click` and selecting `Insert Edge
    Loop Tool`. Click to add an edge loop where it is highlighted in Figure 3-77.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig77_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig77_HTML.jpg)


    *Figure 3-77* — Adding edge loop


    After that, select all the faces around the holes and extract them (see Figure
    3-78).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig78_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig78_HTML.jpg)


    *Figure 3-78* — Extract these faces


    Next, you extrude them with a value of `0.3`. Your results should look similar
    to Figure 3-79.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig79_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig79_HTML.jpg)


    *Figure 3-79* — Result so far


    Select the faces highlighted in Figure 3-80 and duplicate them.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig80_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig80_HTML.jpg)


    *Figure 3-80* — Select and duplicate these faces


    If you have problems working with duplicated faces, there is an alternative. First,
    press `Ctrl+Z` to undo any duplicating operations. Go to `Object` mode and clone
    the entire mesh by holding `Shift` and using the `Translate` tool. Then select
    and delete all the faces (by pressing the `Backspace` key) except the ones highlighted
    in Figure 3-80. This way, you don’t have to deal with the `Duplicate faces` tool,
    which can be tricky to work with. After that, make sure to place the cloned mesh
    so that it roughly overlaps the original mesh.


    Next, select all the vertices shown in Figure 3-81 and move them upward.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig81_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig81_HTML.jpg)


    *Figure 3-81* — Adjusting the shape of the object


    Once again, go to the `Edge Edit` mode of the duplicated faces and select the
    top edge highlighted in Figure 3-82. Slide them down slightly.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig82_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig82_HTML.jpg)


    *Figure 3-82* — Sliding edges down


    Do the same thing for all the border edges on this piece. Your results should
    look similar to Figure 3-83.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig83_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig83_HTML.jpg)


    *Figure 3-83* — Adjusting the border


    After adjusting the border, hold the `Shift` key and extrude the edges, as shown
    in Figure 3-84.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig84_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig84_HTML.jpg)


    *Figure 3-84* — Extrude the edges


    # Removing Unwanted Faces


    Some manual adjustment is required because some edges clip through the front part
    of the headset. Select them and move them back so that they are not sticking out
    from the front. There is no need to be too precise. After doing this, select and
    delete the mesh’s backfaces (see Figure 3-85).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig85_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig85_HTML.jpg)


    *Figure 3-85* — Select and delete these faces


    Let’s remove more unwanted faces. Select and isolate the mesh shown in Figure
    3-86, and select the faces present on its convex side.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig86_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig86_HTML.jpg)


    *Figure 3-86* — Select these faces on this mesh


    And then delete them. You don’t need these faces, and they won’t be visible either,
    so it is better to just get rid of them (see Figure 3-87).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig87_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig87_HTML.jpg)


    *Figure 3-87* — Select these edge loops'
  raw: '### Isolating the Inner Object


    Let’s work on the inner headset. Isolate it first, and then switch to Edge Edit
    mode and add an edge loop, as shown in Figure [3-69](#502922_1_En_3_Chapter.xhtml#Fig69).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig69_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig69_HTML.jpg)


    Figure 3-69


    Add edge loop as shown


    Now select the edges shown in Figure [3-70](#502922_1_En_3_Chapter.xhtml#Fig70).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig70_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig70_HTML.jpg)


    Figure 3-70


    Select the highlighted edges


    Press Shift+Ctrl, and using the Move manipulator, slide these edges upward to
    make the upper region of the mesh thinner. See Figure [3-71](#502922_1_En_3_Chapter.xhtml#Fig71)
    for reference.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig71_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig71_HTML.jpg)


    Figure 3-71


    Slide edges up


    Next, make the faces highlighted in Figure [3-72](#502922_1_En_3_Chapter.xhtml#Fig72)
    as the viewing holes. First, you need to make changes in the geometries surrounding
    them.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig72_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig72_HTML.jpg)


    Figure 3-72


    Viewing holes


    Enable the Target Weld tool and merge the vertices with the corner vertex, as
    shown in Figure [3-73](#502922_1_En_3_Chapter.xhtml#Fig73).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig73_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig73_HTML.jpg)


    Figure 3-73


    Merge vertices to the corner


    Your results should look similar to Figure [3-74](#502922_1_En_3_Chapter.xhtml#Fig74).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig74_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig74_HTML.jpg)


    Figure 3-74


    Merged vertices at corner


    Next, select and delete the faces highlighted in Figure [3-75](#502922_1_En_3_Chapter.xhtml#Fig75).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig75_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig75_HTML.jpg)


    Figure 3-75


    Select and delete these faces


    You can adjust the shape more if needed. It is important to make any changes to
    the shape now because, after this, you extrude all the faces to create thickness.
    Once the thickness has been created, any further editing takes a lot of effort.


    Select all the faces by pressing Ctrl+Shift+A. Go to Edit Mesh ➤ Extrude to extrude
    with the Thickness value set to 0.25\. Your results should look similar to Figure
    [3-76](#502922_1_En_3_Chapter.xhtml#Fig76).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig76_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig76_HTML.jpg)


    Figure 3-76


    Extruding faces


    Next, add an edge loop by pressing Ctrl+Right-click and selecting Insert Edge
    Loop Tool. Click to add an edge loop where it is highlighted in Figure [3-77](#502922_1_En_3_Chapter.xhtml#Fig77).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig77_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig77_HTML.jpg)


    Figure 3-77


    Adding edge loop


    After that, select all the faces around the holes and extract them (see Figure
    [3-78](#502922_1_En_3_Chapter.xhtml#Fig78)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig78_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig78_HTML.jpg)


    Figure 3-78


    Extract these faces


    Next, you extrude them with a value of 0.3\. Your results should look similar
    to Figure [3-79](#502922_1_En_3_Chapter.xhtml#Fig79).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig79_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig79_HTML.jpg)


    Figure 3-79


    Result so far


    Select the faces highlighted in Figure [3-80](#502922_1_En_3_Chapter.xhtml#Fig80)
    and duplicate them.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig80_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig80_HTML.jpg)


    Figure 3-80


    Select and duplicate these faces


    If you have problems working with duplicated faces, there is an alternative. First,
    press Ctrl+Z to undo any duplicating operations. Go to Object mode and clone the
    entire mesh by holding Shift and using the Translate tool. Then select and delete
    all the faces (by pressing the Backspace key) except the ones highlighted in Figure
    [3-80](#502922_1_En_3_Chapter.xhtml#Fig80). This way, you don’t have to deal with
    the Duplicate faces tool, which can be tricky to work with. After that, make sure
    to place the cloned mesh so that it roughly overlaps the original mesh.


    Next, select all the vertices shown in Figure [3-81](#502922_1_En_3_Chapter.xhtml#Fig81)
    and move them upward.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig81_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig81_HTML.jpg)


    Figure 3-81


    Adjusting the shape of the object


    Once again, go to the Edge Edit mode of the duplicated faces and select the top
    edge highlighted in Figure [3-82](#502922_1_En_3_Chapter.xhtml#Fig82). Slide them
    down slightly.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig82_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig82_HTML.jpg)


    Figure 3-82


    Sliding edges down


    Do the same thing for all the border edges on this piece. Your results should
    look similar to Figure [3-83](#502922_1_En_3_Chapter.xhtml#Fig83).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig83_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig83_HTML.jpg)


    Figure 3-83


    Adjusting the border


    After adjusting the border, hold the Shift key and extrude the edges, as shown
    in Figure [3-84](#502922_1_En_3_Chapter.xhtml#Fig84).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig84_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig84_HTML.jpg)


    Figure 3-84


    Extrude the edges


    ### Removing Unwanted Faces


    Some manual adjustment is required because some edges clip through the front part
    of the headset. Select them and move them back so that they are not sticking out
    from the front. There is no need to be too precise. After doing this, select and
    delete the mesh’s backfaces (see Figure [3-85](#502922_1_En_3_Chapter.xhtml#Fig85)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig85_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig85_HTML.jpg)


    Figure 3-85


    Select and delete these faces


    Let’s remove more unwanted faces. Select and isolate the mesh shown in Figure
    [3-86](#502922_1_En_3_Chapter.xhtml#Fig86), and select the faces present on its
    convex side.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig86_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig86_HTML.jpg)


    Figure 3-86


    Select these faces on this mesh


    And then delete them. You don’t need these faces, and they won’t be visible either,
    so it is better to just get rid of them (see Figure [3-87](#502922_1_En_3_Chapter.xhtml#Fig87)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig87_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig87_HTML.jpg)


    Figure 3-87


    Select these edge loops'
  trans: '

    # 隔离内部对象


    先处理内部耳机部分。首先将其隔离，然后切换到`边编辑`模式并添加一条循环边，如图 3-69 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig69_HTML.jpg](img/502922_1_En_3_Fig69_HTML.jpg)


    *图 3-69* — 如图所示添加循环边


    现在选择图 3-70 中所示的边。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig70_HTML.jpg](img/502922_1_En_3_Fig70_HTML.jpg)


    *图 3-70* — 选择高亮显示的边


    按下`Shift+Ctrl`键，并使用`移动`操纵器，将这些边向上滑动，使网格的上部区域变薄。参考图 3-71。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig71_HTML.jpg](img/502922_1_En_3_Fig71_HTML.jpg)


    *图 3-71* — 向上滑动边


    接下来，将图 3-72 中高亮显示的面作为视孔。首先，你需要对它们周围的几何体进行一些修改。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig72_HTML.jpg](img/502922_1_En_3_Fig72_HTML.jpg)


    *图 3-72* — 视孔


    启用`目标焊接`工具，将顶点合并到角点，如图 3-73 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig73_HTML.jpg](img/502922_1_En_3_Fig73_HTML.jpg)


    *图 3-73* — 将顶点合并到角点


    你的结果应该类似于图 3-74。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig74_HTML.jpg](img/502922_1_En_3_Fig74_HTML.jpg)


    *图 3-74* — 顶点已合并到角点


    接下来，选择并删除图 3-75 中高亮显示的面。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig75_HTML.jpg](img/502922_1_En_3_Fig75_HTML.jpg)


    *图 3-75* — 选择并删除这些面


    如有需要，你可以进一步调整形状。现在对形状进行任何修改都很重要，因为在此之后，你将挤出所有面来创建厚度。一旦厚度创建完成，任何后续编辑都需要付出很大努力。


    通过按下`Ctrl+Shift+A`选择所有面。转到`编辑网格 > 挤出`，将`厚度`值设为`0.25`进行挤出。你的结果应该类似于图 3-76。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig76_HTML.jpg](img/502922_1_En_3_Fig76_HTML.jpg)


    *图 3-76* — 挤出各个面


    接下来，通过按下`Ctrl+右键`并选择`插入循环边工具`来添加一条循环边。在图 3-77 中高亮显示的位置单击以添加一条循环边。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig77_HTML.jpg](img/502922_1_En_3_Fig77_HTML.jpg)


    *图 3-77* — 添加循环边


    之后，选择孔周围的所有面并将其提取出来（参见图 3-78）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig78_HTML.jpg](img/502922_1_En_3_Fig78_HTML.jpg)


    *图 3-78* — 提取这些面


    接下来，以`0.3`的值挤出它们。你的结果应该类似于图 3-79。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig79_HTML.jpg](img/502922_1_En_3_Fig79_HTML.jpg)


    *图 3-79* — 当前结果


    选择图 3-80 中高亮显示的面并复制它们。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig80_HTML.jpg](img/502922_1_En_3_Fig80_HTML.jpg)


    *图 3-80* — 选择并复制这些面


    如果在处理复制面时遇到问题，还有一种替代方法。首先，按下`Ctrl+Z`撤销所有复制操作。转到`对象`模式，按住`Shift`键并使用`平移`工具克隆整个网格。然后选择并删除除图
    3-80 中高亮显示的面之外的所有面（按`退格键`）。这样，你就不必处理可能很难操作的`复制面`工具了。之后，确保放置克隆的网格，使其大致与原始网格重叠。


    接下来，选择图 3-81 中显示的所有顶点并将它们向上移动。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig81_HTML.jpg](img/502922_1_En_3_Fig81_HTML.jpg)


    *图 3-81* — 调整对象的形状


    再次进入复制面的`边编辑`模式，选择图 3-82 中高亮显示的顶部边。将它们稍微向下滑动。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig82_HTML.jpg](img/502922_1_En_3_Fig82_HTML.jpg)


    *图 3-82* — 向下滑动边


    对该部件上的所有边界边执行相同操作。你的结果应该类似于图 3-83。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig83_HTML.jpg](img/502922_1_En_3_Fig83_HTML.jpg)


    *图 3-83* — 调整边界


    调整边界后，按住`Shift`键并挤出这些边，如图 3-84 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig84_HTML.jpg](img/502922_1_En_3_Fig84_HTML.jpg)


    *图 3-84* — 挤出边


    # 移除不需要的面


    由于一些边穿过了耳机的前部，需要进行一些手动调整。选择它们并将其向后移动，使其不会从前部突出。无需过于精确。完成此操作后，选择并删除网格的背面（参见图 3-85）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig85_HTML.jpg](img/502922_1_En_3_Fig85_HTML.jpg)


    *图 3-85* — 选择并删除这些面


    让我们移除更多不需要的面。选择并隔离图 3-86 中所示的网格，并选择其凸面上的面。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig86_HTML.jpg](img/502922_1_En_3_Fig86_HTML.jpg)


    *图 3-86* — 在此网格上选择这些面


    然后删除它们。你不需要这些面，而且它们也看不见，所以最好直接去掉它们（参见图 3-87）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig87_HTML.jpg](img/502922_1_En_3_Fig87_HTML.jpg)


    *图 3-87* — 选择这些循环边

