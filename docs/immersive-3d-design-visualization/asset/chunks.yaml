    # 7. Lightmap Analysis and Correction


    This chapter analyzes lightmaps and their importance. First, let’s apply some
    placeholder materials to the scene that you created in UE4. Then, go to the Content
    folder ➤ StarterContent ➤ Materials and drag and drop the `M_AssetPlatform` material
    into all the meshes in your scene (see Figure [7-1](#502922_1_En_7_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig1_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig1_HTML.jpg)


    Figure 7-1: Applying custom material to our mesh


    ## Lightmap Analysis


    Now you are ready to bake lights and see what happens. Click the drop-down arrow
    next to Build and select Build Lighting Only (see Figure [7-2](#502922_1_En_7_Chapter.xhtml#Fig2)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig2_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig2_HTML.jpg)


    Figure 7-2: Building lights only


    Give it some time. Light building can take a while, depending on your settings.
    You can go to Lighting Quality and see which quality setting is active (see Figure
    [7-3](#502922_1_En_7_Chapter.xhtml#Fig3)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig3_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig3_HTML.jpg)


    Figure 7-3: Setting lighting quality level


    Preview quality bakes the fastest, but it is the lowest quality. Production takes
    the longest time to bake, but the lighting quality is the highest. In this case,
    you can set the lighting quality to Medium or Preview quality. Once baking is
    finished, you should see a result similar to Figure [7-4](#502922_1_En_7_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig4_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig4_HTML.jpg)


    Figure 7-4: Lighting build result


    The result in Figure [7-4](#502922_1_En_7_Chapter.xhtml#Fig4) may look slightly
    yellowish. You can produce a similar result by increasing the light intensity
    to a high number, in our case 15, by enabling Temperature in the Details panel.
    Then, decrease the temperature value to 4000 (see Figure [7-5](#502922_1_En_7_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig5_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig5_HTML.jpg)


    Figure 7-5: Light settings


    Now let’s come back to the result of the light bake. As you can see, our bake
    has many problems, including low resolution for the shadows and sharp transitions.
    To fix this, you need to create lightmap UVs.


    Double-click the `Wall_Tall` asset in the Content Browser to open the window that
    gives detailed information about that asset (see Figure [7-6](#502922_1_En_7_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig6_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig6_HTML.jpg)


    Figure 7-6: Asset details window


    You can click the UV drop-down menu to view the UVs present in your mesh. UV Channel
    0 is the map created in Maya. UV Channel 1 is a lightmap UV that UE4 generated
    automatically (see Figure [7-7](#502922_1_En_7_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig7_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig7_HTML.jpg)


    Figure 7-7: Viewing UV channels


    As you can see in Figure [7-8](#502922_1_En_7_Chapter.xhtml#Fig8), the automatic
    lightmap UV generated by UE4 is displayed.


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig8_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig8_HTML.jpg)


    Figure 7-8: Lightmap UV


    To generate some lightmap UVs of your own, scroll down to Build Settings and set
    the Destination Lightmap Index channel number. In our case, it is channel 1, although
    you can select what you want, and then click Apply Changes (see Figure [7-9](#502922_1_En_7_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig9_HTML.jpg](images/502922_1_En_7_Chapter/502922_1_En_7_Fig9_HTML.jpg)


    Figure 7-9: Generating lightmaps


    This generates new lightmap UVs based on the UV map that you created. It uses
    a flawed algorithm that does not always produce good results, but you can sometimes
    use it to create lightmap UVs for small and simple assets.


    Once you click Apply Changes, a new channel is created if you entered a number
    larger than the number of available channels in your mesh. A new lightmap is regenerated.


    Next, let’s increase the lightmap’s resolution to store higher-resolution shadow
    information and various other kinds of light information. To do this, scroll down
    and locate Light Map Resolution under General Settings (see Figure [7-10](#502922_1_En_7_Chapter.xhtml#Fig10)).'
