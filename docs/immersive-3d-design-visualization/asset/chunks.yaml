- fmt: '# Master and Instanced Materials


    Let’s look at the sofa material that you created in the last chapter. You named
    it `MM_Sofa`. The `MM` stands for *master material*. `Master material` is the
    main or parent material that contains all the maps and calculations required to
    build material. `Instanced material` creates minor variations to the master material
    by using parameters that you expose in the related master material. An instanced
    material is the child of a master material. An instanced material allows you to
    make quick adjustments to the master material without having to recompile the
    entire material. You can create multiple child instances of the same master material,
    each one having a different look.


    Let’s demonstrate the need for instanced materials. Suppose you wish to change
    the color of the sofa. Open your sofa master material, and using the `Tint` node,
    select a color (see Figure [10-1](#502922_1_En_10_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig1_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig1_HTML.jpg)


    Figure 10-1


    Changing the color of our material


    Click the `Save` button (see Figure [10-2](#502922_1_En_10_Chapter.xhtml#Fig2)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig2_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig2_HTML.jpg)


    Figure 10-2


    Saving changes to asset


    The save takes time, depending on the material’s complexity. Making a change like
    this in the master material if certainly *not recommended* because it takes a
    long time to compile. You can share multiple instanced materials from a single
    master. Any changes may negatively alter every instanced material. It is not convenient,
    but there is a better way to make minor changes. It is by creating an instanced
    material.


    Right-click `MM_Sofa` in the `Content Browser` and select `Create Material Instance`
    from the list (see Figure [10-3](#502922_1_En_10_Chapter.xhtml#Fig3)). Name this
    material `M_Sofa`.


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig3_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig3_HTML.jpg)


    Figure 10-3


    Creating a material instance


    Once the material instance has been created, drag and drop it from the `Content
    Browser` and onto your sofa mesh. After that, double-click it to reveal its settings.
    The parameter nodes that you created in the last chapter are here as editable
    settings (see Figure [10-4](#502922_1_En_10_Chapter.xhtml#Fig4)).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig4_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig4_HTML.jpg)


    Figure 10-4


    Material instance window


    If you want to make any changes to the parameters, you must enable them by clicking
    the check boxes next to each of their names and then setting the desired values.
    Let’s do that now. Enable `Tint` and `Roughness` and set their values, as shown
    in Figure [10-5](#502922_1_En_10_Chapter.xhtml#Fig5).


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig5_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig5_HTML.jpg)


    Figure 10-5


    Editing instanced material


    You immediately see the changes that you made without any load or compile time.
    Figure [10-6](#502922_1_En_10_Chapter.xhtml#Fig6) shows the changed look of the
    sofa resulting from the adjustments that you made.


    ![../images/502922_1_En_10_Chapter/502922_1_En_10_Fig6_HTML.jpg](images/502922_1_En_10_Chapter/502922_1_En_10_Fig6_HTML.jpg)


    Figure 10-6


    Resulting outcome


    If you want multiple sofas of different colors in your scene, simply make multiple
    instances of your sofa master material. Make sure to make instances of your master
    material only. This is very important; otherwise, you may have an unwanted outcome.
    If you create an instance of another instanced material, then any changes you
    make to the previous one affects its child. The master material is kept constant
    so that you can make as many variations from it as you want. Drag and drop the
    different variations of instanced materials to the assets in your scene.'
