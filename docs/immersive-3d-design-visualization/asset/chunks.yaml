    # 15. Immersive Design Portfolio


    You have a level and lighting set up. In this chapter, you clean up and finalize
    everything. At the end, I give you some final advice on how to proceed with your
    journey in this field.


    ## Cleaning up and Previewing Our Scene


    Go through your `Content Browser` and find any assets that you have imported but
    did not use. It’s common to import Marketplace packages that contain lots of extra
    assets that you don’t end up using. You can go through and delete these from your
    project to reduce its size. If you have any Starter Content files that you don’t
    need, simply delete them (see Figure [15-1](#502922_1_En_15_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig1_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig1_HTML.jpg)


    Figure 15-1: Deleting unwanted files


    Let’s now preview our scene from the first-person perspective. You can click `Play`
    (see Figure [15-2](#502922_1_En_15_Chapter.xhtml#Fig2)) or press `Alt+P` to start
    playing your scene.


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig2_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig2_HTML.jpg)


    Figure 15-2: Play a scene


    You can move around the scene like a player would experience it. To play the scene
    in VR, you need to have a VR headset connected to your PC. Click the arrow next
    to `Play`, and you should see the `VR Preview` option, as shown in Figure [15-3](#502922_1_En_15_Chapter.xhtml#Fig3).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig3_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig3_HTML.jpg)


    Figure 15-3: VR Preview option


    ## Interactive Simulation


    There are several doors in the scene, as you can see in the images. In this section,
    you create the interaction system for opening and closing them. This is a very
    simple setup requiring two key components. First, two meshes named `Door Frame`
    and `Door` itself (you can find these in UE4’s Starter Content if you don’t have
    your own meshes). Second, a simple physics setup with constraints to control the
    movement.


    Let’s begin by adding a door frame in a suitable place, as shown in Figure [15-4](#502922_1_En_15_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig4_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig4_HTML.jpg)


    Figure 15-4: Adding a door frame


    Next, add a door mesh to the door frame, as shown in Figure [15-5](#502922_1_En_15_Chapter.xhtml#Fig5).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig5_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig5_HTML.jpg)


    Figure 15-5: Adding a door mesh


    Next, double-click the door mesh in the `Content Browser` to open the `Asset details`
    window. Here, click `Collision` and enable `Simple Collision` to visualize the
    bounds of the collision. Select and delete whatever default collision you have
    (see Figure [15-6](#502922_1_En_15_Chapter.xhtml#Fig6)). It should appear as a
    green box.


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig6_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig6_HTML.jpg)


    Figure 15-6: Visualize and delete the default collision.


    Next, add `Simplified Box Collision` by clicking `Collision > Add Box Simplified
    Collision` (see Figure [15-7](#502922_1_En_15_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig7_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig7_HTML.jpg)


    Figure 15-7: Add a simple box collision to the mesh.


    Select the simple box collision, press `R`, and scale it down, as shown in Figure
    [15-8](#502922_1_En_15_Chapter.xhtml#Fig8). Scale it down small enough so that
    the collisions for the wall and the door frame around it don’t interfere with
    it.


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig8_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig8_HTML.jpg)


    Figure 15-8: Scaling the collision


    In the `Details` panel on the right-hand side, scroll down until you see the `Collision`
    tab. Under it, make sure that `Collision Complexity` is set to `Project Default`.
    Next, set `Collision Preset` to `Custom` (see Figure [15-9](#502922_1_En_15_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig9_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig9_HTML.jpg)


    Figure 15-9: Collision settings


    Under `Collision Responses`, set `PhysicsBody` to `Ignore` by clicking the check
    box, as shown in Figure [15-10](#502922_1_En_15_Chapter.xhtml#Fig10).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig10_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig10_HTML.jpg)


    Figure 15-10: Setting collision response of PhysicsBody


    You’re all done here, so click `Save` in the top-left corner to save all the settings.


    Select the door that you added to the scene. In the `Details` panel, set `Mobility`
    to `Movable`, which allows the door to cast dynamic shadows and prevent light
    from baking into it from a fixed location (see Figure [15-11](#502922_1_En_15_Chapter.xhtml#Fig11)).
    This has nothing to do with physics; it is purely for lighting purposes. You can
    completely ignore this step if you don’t want dynamic shadows and prefer performance
    over visuals. Alternatively, you can set this to `Stationary` for a middle ground
    between static and dynamic.


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig11_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig11_HTML.jpg)


    Figure 15-11: Setting the mesh to Movable'
