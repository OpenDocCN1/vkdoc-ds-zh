    ## About the Author


    ## About the Technical Reviewer


    # 1. Design for Creative and Immersive Technology


    Welcome to a journey on design for creative and immersive technology. This book
    goes through creating assets for visualization in `Maya`, texturing in `Substance
    Painter`, setting up a scene in `Unreal Engine 4` (`UE4`), creating materials,
    and the final render of a scene.


    This book is geared toward beginners and amateurs who have very basic knowledge
    of 3D tools and want to know more about advanced topics. We go through every step
    of the asset creation pipeline, including modeling, unwrapping, and importing.


    In the end, you create a simple architectural scene that you can use as a portfolio.
    The goal is to show off the assets that you created.


    ## AR, VR, and Emerging Technologies


    Augmented reality (AR) and virtual reality (VR) have become very popular with
    the surge of highly affordable GPUs and applications harnessing the power and
    immersiveness of these technologies. AR and VR have applications in medical science,
    military simulations, education, architectural visualization, and gaming. AR and
    VR are two different types of technologies. Augmented reality projects digital
    elements into the real world by using devices like smartphones. Virtual reality
    is a completely immersive experience that uses VR headsets to completely surround
    the users within a digital world. A visual example is shown in Figure [1-1](#502922_1_En_1_Chapter.xhtml#Fig1).


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig1_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** A visual representation of immersive technology (Source: [*https://pixabay.com/*](https://pixabay.com/))


    ## VR for Entertainment


    VR is not limited to videogames but is making its way into other fields in our
    daily lives. The pace and application may be limited for now, but there is no
    denying that VR will soon be a very practical and useful gadget—used in virtual
    tours and education. Figure [1-2](#502922_1_En_1_Chapter.xhtml#Fig2) is a visual
    example of how digital elements make their way into entertainment.


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig2_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig2_HTML.jpg)


    **Figure 1-2** Representation of VR integration for entertainment (Source: [*https://pixabay.com/*](https://pixabay.com/))


    ## VR for Digital Architecture


    As technology quickly advances, there are opportunities for companies to harness
    its potential. Many companies are investing in the development of VR applications
    and devices. This ranges from advertising to new ways of experiencing daily activities
    like shopping. VR transports people into a digital world, as represented in Figure
    [1-3](#502922_1_En_1_Chapter.xhtml#Fig3).


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig3_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig3_HTML.jpg)


    **Figure 1-3** VR immerses people in the digital world (Source: [*https://pixabay.com/*](https://pixabay.com/))


    It allows users to explore a house before it is built or a big theme park before
    visiting. It has lots of potential benefits. Visualizing a house before it is
    constructed is a massive benefit for the buyer. It gives the customer a good idea
    of what they are buying, enabling them to decide what they want to have added
    or removed during the planning stage before the designers and builders construct
    the house. This is especially useful in constructing large homes where there is
    a lot of work involved, and there is huge room for improvement. Figure [1-4](#502922_1_En_1_Chapter.xhtml#Fig4)
    represents a digital construction of historical architecture.


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig4_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig4_HTML.jpg)


    **Figure 1-4** Digital reconstruction of historical architecture (Source: [*https://pixabay.com/*](https://pixabay.com/))


    ## VR for Simulation and Training


    VR has other useful functions, like in military simulations and training soldiers
    for different combat scenarios and in aviation training, to provide immersive
    flight simulation experiences. You can understand why aspiring CGI programmers
    must do a lot of research in AR and VR technology. It not only opens doors to
    careers but keeps you updated on the latest developments in technology.


    The military uses VR for training soldiers in situations that cannot be easily
    constructed using traditional methods. By using immersive technology, the military
    can efficiently train soldiers to deal with various kinds of situations on the
    battlefield. Combat scenarios with realistic explosions and weapon simulation
    can create an amount of stress similar to a real encounter, which is beneficial
    in preparing for a real-life combat scenario. Figure [1-5](#502922_1_En_1_Chapter.xhtml#Fig5)
    shows a military simulation.


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig5_HTML.jpg](images/502922_1_En_1_Chapter/502922_1_En_1_Fig5_HTML.jpg)


    **Figure 1-5** Representation of military simulation training (Source: [*https://pixabay.com/*](https://pixabay.com/))'
