    图 5-16


    目前的场景


    这个场景可以根据您的意愿进行修改。正如您所见，所有部件都是模块化的，您可以轻松地根据需要重新利用它们。这就是白盒关卡的目的：灵活性是关键。


    完成基础布局后，按图 5-17 所示放置 `Stairs` 和 `Wall_Stairs` 资源。您可以将楼梯在 Y 轴上的位置设为 `660 UU`，以使其精确出现在图像所示的位置。


