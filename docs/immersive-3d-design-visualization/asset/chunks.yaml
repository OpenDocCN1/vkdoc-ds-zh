    Placing the `Wall_Door` asset


    Next, place the `Sofa` assets, as shown in Figure [5-19](#502922_1_En_5_Chapter.xhtml#Fig19).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig19_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig19_HTML.jpg)


    Figure 5-19


    Placing the sofas


    Now, let’s place the plant pots, as shown in Figure [5-20](#502922_1_En_5_Chapter.xhtml#Fig20).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig20_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig20_HTML.jpg)


    Figure 5-20


    Placing plant and grass pots


    Finally, let’s place the metal rail, as shown in Figure [5-21](#502922_1_En_5_Chapter.xhtml#Fig21).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig21_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig21_HTML.jpg)


    Figure 5-21


    Placing rail assets


    Press `Alt+P` to play and explore your level in First Person mode. You may experience
    some problems navigating around the environment because there are some incorrect
    collisions on certain meshes, like `Wall_Door`, `Stairs`, and `Wall_Stairs`. To
    fix this, double-click the asset you want to correct in the Content Browser. A
    new asset details window opens. In the `Properties` tab, scroll down until you
    see the `Collisions` option. Click the drop-down menu, select `Use Complex Collision
    As Simple`, and save (see Figure [5-22](#502922_1_En_5_Chapter.xhtml#Fig22)).


    Note that complex collision is only good if you are working on a very small scene
    or an architectural vizualization scene. It is never used in a game environment
    because it uses a lot of memory. Complex collision calculates the collision for
    each vertex in the mesh. A complex model with lots of vertices easily hogs up
    memory and makes scenes unoptimized, so use complex collision sparingly, even
    in personal projects.


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig22_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig22_HTML.jpg)


    Figure 5-22


    Modifying collision setting for asset


    Now that you are done blocking out of the level, you can adjust the level layout
    the way that you want. It is a good practice to create something on your own based
    on what you have learned so far. In the next chapter, you unwrap our 3D assets.


    # 6. Creating UVs


    In this chapter, you learn how to unwrap your assets and prepare them for texturing.
    Unwrapping is a vital step in 3D asset creation. In the unwrapping process, you
    layout the surface of the 3D model in a 3D format so that you can paint on it,
    apply bitmap textures, or procedurally texture it. Without unwrapping, it is usually
    not possible to texture assets properly.


    When unwrapping, you need to keep the UV islands as flat as possible to reduce
    distortion on the applied texture. You should also keep the UV islands as even
    and as close to their original size as possible to ensure that you don’t give
    too much UV space to tiny assets. Likewise, make sure to give the larger assets
    as much UV space as possible.


    ## Unwrapping the Headset Asset


    Let’s begin by deleting the history. Go to `Edit` ➤ `Delete All by Type` ➤ `History`
    (see Figure [6-1](#502922_1_En_6_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig1_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Deleting the edit history of an object


    Next, click the quad view icon (see Figure [6-2](#502922_1_En_6_Chapter.xhtml#Fig2))
    to split your screen into four viewports.


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig2_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Splitting viewport to quad mode


    Now hold the center of the quad viewport and drag it down to only have two viewports
    (see Figure [6-3](#502922_1_En_6_Chapter.xhtml#Fig3)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig3_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig3_HTML.jpg)


    Figure 6-3


    Adjusting the viewport


    Next, let’s change one of the panels (preferably the left one) to UV Editor mode
    by going to `Panels` ➤ `Panel` ➤ `UV Editor` (see Figure [6-4](#502922_1_En_6_Chapter.xhtml#Fig4)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig4_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Switching a panel to UV Editor


    Click the object to view its UVs. You see that the UVs are currently a complete
    mess (see Figure [6-5](#502922_1_En_6_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig5_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    The current state of the asset UVs


    Let’s fix this by creating a proper UV layout. Click the `UV` tab in the menu
    bar at the top and then click the blue-dotted region to detach the panel to become
    a separate floating window (see Figure [6-6](#502922_1_En_6_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig6_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    Separating UV menu into a separate window


    Next, select the entire circular region of the front headset, as shown in Figure
    [6-7](#502922_1_En_6_Chapter.xhtml#Fig7).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig7_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    Selecting the circular region of the front headset


    Click the `Planar` option in the floating UV panel window (see Figure [6-8](#502922_1_En_6_Chapter.xhtml#Fig8)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig8_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Applying a planar map to our asset


    In the `Planar Mapping Options` window, select the correct axis (in our case,
    the `X` axis works), and click `Apply` (see Figure [6-9](#502922_1_En_6_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig9_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Applying projection axis to planner mapping


    Once the UV is laid out, drag it away from the pile of other UVs (see Figure [6-10](#502922_1_En_6_Chapter.xhtml#Fig10)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig10_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Isolating the UV shell


    Next, select the front region, as shown in Figure [6-11](#502922_1_En_6_Chapter.xhtml#Fig11).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig11_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    Selecting the front piece


    Next, apply a Normal Based unwrap method to unwrap this region. Then drag it away
    from other UVs (see Figure [6-12](#502922_1_En_6_Chapter.xhtml#Fig12)).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig12_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig12_HTML.jpg)


    Figure 6-12


    Normal-based unwrapping


    Your results should look similar to Figure [6-13](#502922_1_En_6_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_6_Chapter/502922_1_En_6_Fig13_HTML.jpg](images/502922_1_En_6_Chapter/502922_1_En_6_Fig13_HTML.jpg)


    Figure 6-13


    Result of unwrap'
