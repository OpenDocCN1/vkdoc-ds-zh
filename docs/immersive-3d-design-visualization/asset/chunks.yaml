- fmt: "### Dealing with Dirt\n\nYou now see procedural dirt being generated on your\
    \ mesh. You can modify the `Dirt` settings in the `Properties` panel. Use the\
    \ `Dirt Level` option (see Figure [8-32](#502922_1_En_8_Chapter.xhtml#Fig32)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig32_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig32_HTML.jpg)\n\
    \nFigure 8-32  \nControlling Dirt amount\n\nNext, click the `Duplicated` material\
    \ so that its properties appear in the `Properties` tab. Here you scroll down\
    \ and disable all channels except `Rough` (see Figure [8-33](#502922_1_En_8_Chapter.xhtml#Fig33)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig33_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig33_HTML.jpg)\n\
    \nFigure 8-33  \nDisable all channels except rough\n\nNext, increase `Roughness`\
    \ to a value of `0.35`. Your mesh should now look similar to Figure [8-34](#502922_1_En_8_Chapter.xhtml#Fig34).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig34_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig34_HTML.jpg)\n\
    \nFigure 8-34  \nProcedural dirt effect on mesh\n\nAs you can see, the dirt effect\
    \ now appears on our mesh. But right now, it is too strong. Right-click the mask\
    \ and apply a filter from the list (see Figure [8-35](#502922_1_En_8_Chapter.xhtml#Fig35)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig35_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig35_HTML.jpg)\n\
    \nFigure 8-35  \nAdding a filter\n\nClick the empty filter container, and from\
    \ the `Filter` menu, select `Blur` (see Figure [8-36](#502922_1_En_8_Chapter.xhtml#Fig36)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig36_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig36_HTML.jpg)\n\
    \nFigure 8-36  \nApplying Blur filter\n\nReduce `Blur Intensity` to `0.3` in the\
    \ `Properties` panel (see Figure [8-37](#502922_1_En_8_Chapter.xhtml#Fig37)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig37_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig37_HTML.jpg)\n\
    \nFigure 8-37  \nDecreasing Blur Intensity\n\nIf the blur effect is still too\
    \ strong and visible, click the active channel drop-down menu and select `Roughness`\
    \ (see Figure [8-38](#502922_1_En_8_Chapter.xhtml#Fig38)).\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig38_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig38_HTML.jpg)\n\
    \nFigure 8-38  \nChanging the active channel\n\nNext, reduce the opacity of the\
    \ layer to a low value; in our case, `40` (see Figure [8-39](#502922_1_En_8_Chapter.xhtml#Fig39)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig39_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig39_HTML.jpg)\n\
    \nFigure 8-39  \nReducing layer opacity\n\nNext, create a `Paint` layer by clicking\
    \ the button highlighted in Figure [8-40](#502922_1_En_8_Chapter.xhtml#Fig40).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig40_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig40_HTML.jpg)\n\
    \nFigure 8-40  \nCreating a new paint layer\n\nOnce this layer has been created,\
    \ go to its properties, and disable all channels except `Normals` (see Figure\
    \ [8-41](#502922_1_En_8_Chapter.xhtml#Fig41)).\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig41_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig41_HTML.jpg)\n\
    \nFigure 8-41  \nOnly Normal channel is active\n\nSwitch to the `Hard Surfaces`\
    \ category on the shelf and select any one normal map that you like (see Figure\
    \ [8-42](#502922_1_En_8_Chapter.xhtml#Fig42)). I selected `Vent Circles`.\n\n\
    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig42_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig42_HTML.jpg)\n\
    \nFigure 8-42  \nHard surfaces that ship with Substance Painter\n\nDrop it into\
    \ the `Normal map` slot in the `Properties` window (see Figure [8-43](#502922_1_En_8_Chapter.xhtml#Fig43)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig43_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig43_HTML.jpg)\n\
    \nFigure 8-43  \nDrag and drop Normal map into Normal map slot\n\nYou are now\
    \ ready to paint this detail. You can use the `[` and `]` keys to decrease and\
    \ increase the size of the brush, respectively. Before you paint, you need to\
    \ remove the alpha map from the brush. To do this, scroll up and click the `X`\
    \ button next to the `Alpha map` slot (see Figure [8-44](#502922_1_En_8_Chapter.xhtml#Fig44)).\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig44_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig44_HTML.jpg)\n\
    \nFigure 8-44  \nRemoving alpha map\n\nAfter that, simply click your mesh to paint\
    \ the alpha map. You can drag and drop another normal map into the normal map\
    \ slot to paint a different pattern at any time. My results are shown in Figure\
    \ [8-45](#502922_1_En_8_Chapter.xhtml#Fig45).\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig45_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig45_HTML.jpg)\n\
    \nFigure 8-45  \nNormal painting\n\nFinally, create another `Paint` layer, but\
    \ this time, enable only the `Color` channel. Using the default brush, fill some\
    \ color into the painted Normal details, as shown in Figure [8-46](#502922_1_En_8_Chapter.xhtml#Fig46).\
    \ Remember, you can hold the `Shift` key to draw a straight line between two clicks.\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig46_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig46_HTML.jpg)\n\
    \nFigure 8-46  \nPainting some details\n\nIf you experience problems painting\
    \ in `Perspective` view, you can change to `Orthographic` view by pressing `F6`.\
    \ Press `F5` to switch back to `Perspective` view. Also, you can enable `Symmetry`\
    \ by clicking the button highlighted in Figure [8-47](#502922_1_En_8_Chapter.xhtml#Fig47).\
    \ `Symmetry` allows you to work on one side as your work is automatically carried\
    \ over to the other side.\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig47_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig47_HTML.jpg)\n\
    \nFigure 8-47  \nEnabling Symmetry\n\nThis chapter overviewed a PBR-based texturing\
    \ workflow. There is more to creating realistic texturing, but that is beyond\
    \ the scope of this book. Hopefully, what you have learned so far will guide you\
    \ going further.\n\nIn the next chapter, you learn about material integration\
    \ in UE4.\n\n# 9. Material Design and Integration\n\nYou have created some materials,\
    \ now let’s look at how to import and integrate them in UE4. In this chapter,\
    \ you export materials from Substance Painter and learn how to set up the exporter\
    \ for UE4. Then, you import textures into UE4 and set up master materials. After\
    \ that, you use Quixel Bridge to import materials from Quixel Megascans and witness\
    \ how fast and powerful Quixel Bridge can be."
  raw: '### Dealing with Dirt


    You now see procedural dirt being generated on your mesh. You can modify the Dirt
    settings in the Properties panel. Use the Dirt Level option (see Figure [8-32](#502922_1_En_8_Chapter.xhtml#Fig32)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig32_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig32_HTML.jpg)


    Figure 8-32


    Controlling Dirt amount


    Next, click the Duplicated material so that its properties appear in the Properties
    tab. Here you scroll down and disable all channels except Rough (see Figure [8-33](#502922_1_En_8_Chapter.xhtml#Fig33)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig33_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig33_HTML.jpg)


    Figure 8-33


    Disable all channels except rough


    Next, increase Roughness to a value of 0.35\. Your mesh should now look similar
    to Figure [8-34](#502922_1_En_8_Chapter.xhtml#Fig34).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig34_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig34_HTML.jpg)


    Figure 8-34


    Procedural dirt effect on mesh


    As you can see, the dirt effect now appears on our mesh. But right now, it is
    too strong. Right-click the mask and apply a filter from the list (see Figure
    [8-35](#502922_1_En_8_Chapter.xhtml#Fig35)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig35_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig35_HTML.jpg)


    Figure 8-35


    Adding a filter


    Click the empty filter container, and from the Filter menu, select Blur (see Figure
    [8-36](#502922_1_En_8_Chapter.xhtml#Fig36)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig36_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig36_HTML.jpg)


    Figure 8-36


    Applying Blur filter


    Reduce Blur Intensity to 0.3 in the Properties panel (see Figure [8-37](#502922_1_En_8_Chapter.xhtml#Fig37)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig37_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig37_HTML.jpg)


    Figure 8-37


    Decreasing Blur Intensity


    If the blur effect is still too strong and visible, click the active channel drop-down
    menu and select Roughness (see Figure [8-38](#502922_1_En_8_Chapter.xhtml#Fig38)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig38_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig38_HTML.jpg)


    Figure 8-38


    Changing the active channel


    Next, reduce the opacity of the layer to a low value; in our case, 40 (see Figure
    [8-39](#502922_1_En_8_Chapter.xhtml#Fig39)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig39_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig39_HTML.jpg)


    Figure 8-39


    Reducing layer opacity


    Next, create a Paint layer by clicking the button highlighted in Figure [8-40](#502922_1_En_8_Chapter.xhtml#Fig40).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig40_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig40_HTML.jpg)


    Figure 8-40


    Creating a new paint layer


    Once this layer has been created, go to its properties, and disable all channels
    except Normals (see Figure [8-41](#502922_1_En_8_Chapter.xhtml#Fig41)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig41_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig41_HTML.jpg)


    Figure 8-41


    Only Normal channel is active


    Switch to the Hard Surfaces category on the shelf and select any one normal map
    that you like (see Figure [8-42](#502922_1_En_8_Chapter.xhtml#Fig42)). I selected
    Vent Circles.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig42_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig42_HTML.jpg)


    Figure 8-42


    Hard surfaces that ship with Substance Painter


    Drop it into the Normal map slot in the Properties window (see Figure [8-43](#502922_1_En_8_Chapter.xhtml#Fig43)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig43_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig43_HTML.jpg)


    Figure 8-43


    Drag and drop Normal map into Normal map slot


    You are now ready to paint this detail. You can use the [ and ] keys to decrease
    and increase the size of the brush, respectively. Before you paint, you need to
    remove the alpha map from the brush. To do this, scroll up and click the X button
    next to the Alpha map slot (see Figure [8-44](#502922_1_En_8_Chapter.xhtml#Fig44)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig44_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig44_HTML.jpg)


    Figure 8-44


    Removing alpha map


    After that, simply click your mesh to paint the alpha map. You can drag and drop
    another normal map into the normal map slot to paint a different pattern at any
    time. My results are shown in Figure [8-45](#502922_1_En_8_Chapter.xhtml#Fig45).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig45_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig45_HTML.jpg)


    Figure 8-45


    Normal painting


    Finally, create another Paint layer, but this time, enable only the Color channel.
    Using the default brush, fill some color into the painted Normal details, as shown
    in Figure [8-46](#502922_1_En_8_Chapter.xhtml#Fig46). Remember, you can hold the
    Shift key to draw a straight line between two clicks.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig46_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig46_HTML.jpg)


    Figure 8-46


    Painting some details


    If you experience problems painting in Perspective view, you can change to Orthographic
    view by pressing F6\. Press F5 to switch back to Perspective view. Also, you can
    enable Symmetry by clicking the button highlighted in Figure [8-47](#502922_1_En_8_Chapter.xhtml#Fig47).
    Symmetry allows you to work on one side as your work is automatically carried
    over to the other side.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig47_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig47_HTML.jpg)


    Figure 8-47


    Enabling Symmetry


    This chapter overviewed a PBR-based texturing workflow. There is more to creating
    realistic texturing, but that is beyond the scope of this book. Hopefully, what
    you have learned so far will guide you going further.


    In the next chapter, you learn about material integration in UE4.


    # 9. Material Design and Integration


    You have created some materials, now let’s look at how to import and integrate
    them in UE4\. In this chapter, you export materials from Substance Painter and
    learn how to set up the exporter for UE4\. Then, you import textures into UE4
    and set up master materials. After that, you use Quixel Bridge to import materials
    from Quixel Megascans and witness how fast and powerful Quixel Bridge can be.'
  trans: "\n### 处理污垢效果\n\n现在你会在网格上看到程序化生成的污垢。你可以在`属性`面板中修改`污垢`设置。使用`污垢级别`选项（见图 8-32）。\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig32_HTML.jpg](img/502922_1_En_8_Fig32_HTML.jpg)\n\
    \n图 8-32  \n控制污垢量\n\n接下来，点击`复制`的材质，使其属性显示在`属性`选项卡中。在此向下滚动，并禁用除`粗糙度`外的所有通道（见图 8-33）。\n\
    \n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig33_HTML.jpg](img/502922_1_En_8_Fig33_HTML.jpg)\n\
    \n图 8-33  \n禁用除粗糙度外的所有通道\n\n接着，将`粗糙度`数值增加到`0.35`。现在你的网格应该看起来类似于图 8-34。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig34_HTML.jpg](img/502922_1_En_8_Fig34_HTML.jpg)\n\
    \n图 8-34  \n网格上的程序化污垢效果\n\n如你所见，污垢效果现在已出现在我们的网格上。但此刻它过于强烈。右键点击遮罩，并从列表中选择一个滤镜（见图\
    \ 8-35）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig35_HTML.jpg](img/502922_1_En_8_Fig35_HTML.jpg)\n\
    \n图 8-35  \n添加滤镜\n\n点击空的滤镜容器，并从`滤镜`菜单中选择`模糊`（见图 8-36）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig36_HTML.jpg](img/502922_1_En_8_Fig36_HTML.jpg)\n\
    \n图 8-36  \n应用模糊滤镜\n\n在`属性`面板中将`模糊强度`降低至`0.3`（见图 8-37）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig37_HTML.jpg](img/502922_1_En_8_Fig37_HTML.jpg)\n\
    \n图 8-37  \n降低模糊强度\n\n如果模糊效果仍然过于明显，点击当前通道下拉菜单并选择`粗糙度`（见图 8-38）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig38_HTML.jpg](img/502922_1_En_8_Fig38_HTML.jpg)\n\
    \n图 8-38  \n更改当前通道\n\n接下来，将图层的不透明度降低到一个较低的值；在我们的案例中，设为`40`（见图 8-39）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig39_HTML.jpg](img/502922_1_En_8_Fig39_HTML.jpg)\n\
    \n图 8-39  \n降低图层不透明度\n\n接着，通过点击图 8-40 高亮显示的按钮，创建一个`绘制`图层。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig40_HTML.jpg](img/502922_1_En_8_Fig40_HTML.jpg)\n\
    \n图 8-40  \n创建新的绘制图层\n\n创建好此图层后，进入其属性，并禁用除`法线`外的所有通道（见图 8-41）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig41_HTML.jpg](img/502922_1_En_8_Fig41_HTML.jpg)\n\
    \n图 8-41  \n仅激活法线通道\n\n切换到工具架上的`硬表面`类别，并选择任意一个你喜欢的法线贴图（见图 8-42）。我选择了`通风圆孔`。\n\n\
    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig42_HTML.jpg](img/502922_1_En_8_Fig42_HTML.jpg)\n\
    \n图 8-42  \nSubstance Painter 自带的硬表面贴图\n\n将其拖放到`属性`窗口中的`法线贴图`槽位内（见图 8-43）。\n\n\
    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig43_HTML.jpg](img/502922_1_En_8_Fig43_HTML.jpg)\n\
    \n图 8-43  \n将法线贴图拖放到法线贴图槽位\n\n现在你已经准备好绘制这个细节了。你可以使用`[`和`]`键分别减小和增大笔刷的大小。在开始绘制之前，你需要移除笔刷的阿尔法贴图。为此，向上滚动并点击`阿尔法贴图`槽位旁边的`X`按钮（见图\
    \ 8-44）。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig44_HTML.jpg](img/502922_1_En_8_Fig44_HTML.jpg)\n\
    \n图 8-44  \n移除阿尔法贴图\n\n之后，只需点击你的网格来绘制阿尔法贴图。你可以随时将另一张法线贴图拖放到法线贴图槽位来绘制不同的图案。我的结果如图\
    \ 8-45 所示。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig45_HTML.jpg](img/502922_1_En_8_Fig45_HTML.jpg)\n\
    \n图 8-45  \n法线绘制\n\n最后，创建另一个`绘制`图层，但这次，仅启用`颜色`通道。使用默认笔刷，为绘制的法线细节填充一些颜色，如图 8-46\
    \ 所示。请记住，你可以按住`Shift`键在两次点击之间绘制直线。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig46_HTML.jpg](img/502922_1_En_8_Fig46_HTML.jpg)\n\
    \n图 8-46  \n绘制一些细节\n\n如果在`透视`视图中绘制时遇到问题，你可以按`F6`切换到`正交`视图。按`F5`切换回`透视`视图。此外，你可以通过点击图\
    \ 8-47 中高亮显示的按钮来启用`对称`。`对称`允许你在一侧进行工作，同时你的操作会自动应用到另一侧。\n\n![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig47_HTML.jpg](img/502922_1_En_8_Fig47_HTML.jpg)\n\
    \n图 8-47  \n启用对称\n\n本章概述了基于 PBR 的贴图工作流程。创建真实的贴图还有更多内容，但这已超出本书范围。希望到目前为止你所学到的知识能够引导你走得更远。\n\
    \n在下一章中，你将学习 UE4 中的材质集成。\n\n# 9. 材质设计与集成\n\n你已经创建了一些材质，现在让我们看看如何在 UE4 中导入和集成它们。在本章中，你将导出\
    \ Substance Painter 中的材质，并学习如何为 UE4 设置导出器。然后，将纹理导入 UE4 并设置主材质。之后，你将使用 Quixel Bridge\
    \ 从 Quixel Megascans 导入材质，并见证 Quixel Bridge 的速度和强大功能。\n"
- fmt: '# Exporting from Substance Painter


    Let’s start by opening the file that you created in Substance Painter. Then go
    to `File ➤ Export Textures` (see Figure [9-1](#502922_1_En_9_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig1_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Export textures


    In the `Export Document` window, set `Config` to `Unreal Engine 4 (Packed)`, as
    shown in Figure [9-2](#502922_1_En_9_Chapter.xhtml#Fig2). This ensures that the
    textures are exported in a way that UE4 can properly use them.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig2_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    Changing export config


    To see how the textures are set up, go to `Configuration ➤ Unreal Engine 4 (Packed)`
    (see Figure [9-3](#502922_1_En_9_Chapter.xhtml#Fig3)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig3_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Texture configuration for export


    In the `Configuration` window, under `Output Maps`, our texture maps are ready
    to be exported. Note the various settings. The map named `BaseColor` has one RGB
    (red, green, blue) input and one A input; an input map is plugged into each of
    them. You can see which one is plugged in based on the color in the output map
    and the corresponding color in the input map.


    The `OcclusionRoughnessMetallic` map has three inputs plugged into a single output
    texture map. This map is sometimes referred to as the ORM (Ambient Occlusion,
    Roughness, Metallic) map for convenience. Occlusion maps, Roughness maps, and
    Metallic maps are grayscale. When the three different channels are plugged into
    a texture, you can save memory and space, and optimize your project.


    These presets are set up by the Substance Painter team so that you can quickly
    export your texture maps and send them to the DCC application of your choice.


    Let’s now switch back to the `Export` tab and change some more settings. Increase
    the document resolution to `2048×2048`, and set the image format to `targa`, as
    shown in Figure [9-4](#502922_1_En_9_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig4_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Export settings


    Now, you are ready to export your maps. Set the export destination to the folder
    that you want, and then click `Export` (see Figure [9-5](#502922_1_En_9_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig5_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Setting the export destination and exporting textures


    # Working with Materials in UE4


    Once your materials have been exported, open UE4. But before you drop these materials
    into UE4, use the naming convention for textures. Open the textures wherever you
    have saved them, and then rename them `T_Sofa_BaseColor`, `T_Sofa_OcclusionRoughnessMetallic`,
    and `T_Sofa_Normal`, respectively.


    Create a folder for storing the texture maps. Name this folder `Textures`. Drag
    and drop your textures into this folder. You should see your materials in the
    Content Browser (see Figure [9-6](#502922_1_En_9_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig6_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig6_HTML.jpg)


    Figure 9-6


    Texture maps imported in UE4


    Now let’s create a material using these texture maps. Double-click `T_Sofa_ORM`,
    and under `Texture`, make sure that `sRGB` is disabled. (UE4 should have done
    this automatically.) Right-click in an empty space in the Content Browser, and
    under `Create Basic Asset`, select `Material` (see Figure [9-7](#502922_1_En_9_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig7_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig7_HTML.jpg)


    Figure 9-7


    Creating Material asset


    Name this material in a way that corresponds to your asset. I named it `MM_Sofa`.
    Next, double-click it to launch the Material Editor window. Your window should
    look similar to Figure [9-8](#502922_1_En_9_Chapter.xhtml#Fig8). You can open
    the Content Browser by going to `Window ➤ Content Browser ➤ Content Browser 1`.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig8_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig8_HTML.jpg)


    Figure 9-8


    Material Editor window


    This is a node-based Material Editor, where you use various nodes and functions
    to create material.


    Let’s begin by dragging our textures from the Content Browser and dropping them
    into the Material Editor window. Arrange the textures as shown in Figure [9-9](#502922_1_En_9_Chapter.xhtml#Fig9).
    This is your introduction to the Blueprints system. You are using node-based programming
    to create materials. By connecting nodes, you assign different functions to your
    overall node tree, which, once executed, produces the material.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig9_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig9_HTML.jpg)


    Figure 9-9


    Bringing and arranging our material in Material Editor


    Let’s now add some material functions to edit our materials. Right-click in an
    empty space, search for `CheapContrast_RGB`, and add it to the editor. Next, search
    for `Multiply` and add it as well. Connect the `Base Color` node’s `RGB` output
    pin to the `CheapContrast_RGB` input pin. Next, connect the `CheapContrast_RGB`
    output to the `Multiply` input. Finally, connect `Multiply` to `MM_Sofa`’s `Base
    Color` input. Your setup should look similar to Figure [9-10](#502922_1_En_9_Chapter.xhtml#Fig10).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig10_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig10_HTML.jpg)


    Figure 9-10


    Setup so far


    Next, press and hold the alphanumeric `1` key on your keyboard and left-click
    anywhere to add a `Constant` node. Right-click this constant, and select `Convert
    to Parameter` (see Figure [9-11](#502922_1_En_9_Chapter.xhtml#Fig11)). Alternatively,
    you can press `S` and click to add a `Parameter` node.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig11_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig11_HTML.jpg)


    Figure 9-11


    Converting constant to parameter


    Name this parameter `Contrast` in the Details panel on the left (see Figure [9-12](#502922_1_En_9_Chapter.xhtml#Fig12)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig12_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig12_HTML.jpg)


    Figure 9-12


    Naming our parameter


    Connect the parameter to `CheapContrast_RGB`’s `Contrast (S)` pin.'
  raw: '## Exporting from Substance Painter


    Let’s start by opening the file that you created in Substance Painter. Then go
    to File ➤ Export Textures (see Figure [9-1](#502922_1_En_9_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig1_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Export textures


    In the Export Document window, set Config to Unreal Engine 4 (Packed), as shown
    in Figure [9-2](#502922_1_En_9_Chapter.xhtml#Fig2). This ensures that the textures
    are exported in a way that UE4 can properly use them.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig2_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    Changing export config


    To see how the textures are set up, go to Configuration ➤ Unreal Engine 4 (Packed)
    (see Figure [9-3](#502922_1_En_9_Chapter.xhtml#Fig3)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig3_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Texture configuration for export


    In the Configuration window, under Output Maps, our texture maps are ready to
    be exported. Note the various settings. The map named BaseColor has one RGB (red,
    green, blue) input and one A input; an input map is plugged into each of them.
    You can see which one is plugged in based on the color in the output map and the
    corresponding color in the input map.


    The OcclusionRoughnessMetallic map has three inputs plugged into a single output
    texture map. This map is sometimes referred to as the ORM (Ambient **O**cclusion,
    **R**oughness, **M**etallic) map for convenience. Occlusion maps, Roughness maps,
    and Metallic maps are grayscale. When the three different channels are plugged
    into a texture, you can save memory and space, and optimize your project.


    These presets are set up by the Substance Painter team so that you can quickly
    export your texture maps and send them to the DCC application of your choice.


    Let’s now switch back to the Export tab and change some more settings. Increase
    the document resolution to 2048×2048, and set the image format to targa, as shown
    in Figure [9-4](#502922_1_En_9_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig4_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Export settings


    Now, you are ready to export your maps. Set the export destination to the folder
    that you want, and then click Export (see Figure [9-5](#502922_1_En_9_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig5_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Setting the export destination and exporting textures


    ## Working with Materials in UE4


    Once your materials have been exported, open UE4\. But before you drop these materials
    into UE4, use the naming convention for textures. Open the textures wherever you
    have saved them, and then rename them T_Sofa_BaseColor, T_Sofa_OcclusionRoughnessMetallic,
    and T_Sofa_Normal, respectively.


    Create a folder for storing the texture maps. Name this folder Textures. Drag
    and drop your textures into this folder. You should see your materials in the
    Content Browser (see Figure [9-6](#502922_1_En_9_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig6_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig6_HTML.jpg)


    Figure 9-6


    Texture maps imported in UE4


    Now let’s create a material using these texture maps. Double-click T_Sofa_ORM,
    and under Texture, make sure that sRGB is disabled. (UE4 should have done this
    automatically.) Right-click in an empty space in the Content Browser, and under
    Create Basic Asset, select Material (see Figure [9-7](#502922_1_En_9_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig7_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig7_HTML.jpg)


    Figure 9-7


    Creating Material asset


    Name this material in a way that corresponds to your asset. I named it MM_Sofa.
    Next, double-click it to launch the Material Editor window. Your window should
    look similar to Figure [9-8](#502922_1_En_9_Chapter.xhtml#Fig8). You can open
    the Content Browser by going to Window ➤ Content Browser ➤ Content Browser 1.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig8_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig8_HTML.jpg)


    Figure 9-8


    Material Editor window


    This is a node-based Material Editor, where you use various nodes and functions
    to create material.


    Let’s begin by dragging our textures from the Content Browser and dropping them
    into the Material Editor window. Arrange the textures as shown in Figure [9-9](#502922_1_En_9_Chapter.xhtml#Fig9).
    This is your introduction to the Blueprints system. You are using node-based programming
    to create materials. By connecting nodes, you assign different functions to your
    overall node tree, which, once executed, produces the material.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig9_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig9_HTML.jpg)


    Figure 9-9


    Bringing and arranging our material in Material Editor


    Let’s now add some material functions to edit our materials. Right-click in an
    empty space, search for CheapContrast_RGB, and add it to the editor. Next, search
    for Multiply and add it as well. Connect the Base Color node’s RGB output pin
    to the CheapContrast_RGB input pin. Next, connect the CheapContrast_RGB output
    to the Multiply input. Finally, connect Multiply to MM_Sofa’s Base Color input.
    Your setup should look similar to Figure [9-10](#502922_1_En_9_Chapter.xhtml#Fig10).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig10_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig10_HTML.jpg)


    Figure 9-10


    Setup so far


    Next, press and hold the alphanumeric 1 key on your keyboard and left-click anywhere
    to add a Constant node. Right-click this constant, and select Convert to Parameter
    (see Figure [9-11](#502922_1_En_9_Chapter.xhtml#Fig11)). Alternatively, you can
    press S and click to add a Parameter node.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig11_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig11_HTML.jpg)


    Figure 9-11


    Converting constant to parameter


    Name this parameter Contrast in the Details panel on the left (see Figure [9-12](#502922_1_En_9_Chapter.xhtml#Fig12)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig12_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig12_HTML.jpg)


    Figure 9-12


    Naming our parameter


    Connect the parameter to CheapContrast_RGB’s Contrast (S) pin.'
  trans: '

    # 从 Substance Painter 导出


    首先，打开你在 Substance Painter 中创建的文件。然后前往 `文件 ➤ 导出纹理`（见图 9-1）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig1_HTML.jpg](img/502922_1_En_9_Fig1_HTML.jpg)


    图 9-1


    导出纹理


    在 `导出文档` 窗口中，将 `配置` 设置为 `Unreal Engine 4 (Packed)`，如图 9-2 所示。这可确保纹理以 UE4 能够正确使用的方式导出。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig2_HTML.jpg](img/502922_1_En_9_Fig2_HTML.jpg)


    图 9-2


    更改导出配置


    要查看纹理是如何设置的，请前往 `配置 ➤ Unreal Engine 4 (Packed)`（见图 9-3）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig3_HTML.jpg](img/502922_1_En_9_Fig3_HTML.jpg)


    图 9-3


    导出的纹理配置


    在 `配置` 窗口的 `输出贴图` 下，我们的纹理贴图已准备好导出。请注意各项设置。名为 `BaseColor` 的贴图有一个 RGB（红、绿、蓝）输入和一个
    A 输入；每个输入都连接了一张输入贴图。根据输出贴图中的颜色和输入贴图中对应的颜色，你可以看出连接了哪张贴图。


    `OcclusionRoughnessMetallic` 贴图有三个输入连接到一张输出纹理贴图。为了简便，这张贴图有时被称为 ORM（环境光遮蔽、粗糙度、金属度）贴图。环境光遮蔽贴图、粗糙度贴图和金属度贴图都是灰度图。当三个不同通道被连接到一张纹理上时，可以节省内存和空间，并优化你的项目。


    这些预设由 Substance Painter 团队设置，以便你可以快速导出纹理贴图并将其发送到你选择的数字内容创作（DCC）应用程序中。


    现在，让我们切换回 `导出` 选项卡，更改更多设置。将文档分辨率提高到 `2048×2048`，并将图像格式设置为 `targa`，如图 9-4 所示。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig4_HTML.jpg](img/502922_1_En_9_Fig4_HTML.jpg)


    图 9-4


    导出设置


    现在，你可以导出贴图了。将导出目标设置到所需的文件夹，然后点击 `导出`（见图 9-5）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig5_HTML.jpg](img/502922_1_En_9_Fig5_HTML.jpg)


    图 9-5


    设置导出目标并导出纹理


    # 在 UE4 中处理材质


    材质导出后，打开 UE4。但在将这些材质放入 UE4 之前，请遵循纹理的命名约定。在你保存纹理的任何位置打开它们，然后将它们分别重命名为 `T_Sofa_BaseColor`、`T_Sofa_OcclusionRoughnessMetallic`
    和 `T_Sofa_Normal`。


    创建一个用于存储纹理贴图的文件夹。将此文件夹命名为 `Textures`。将你的纹理拖放到此文件夹中。你应该会在内容浏览器中看到你的材质（见图 9-6）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig6_HTML.jpg](img/502922_1_En_9_Fig6_HTML.jpg)


    图 9-6


    导入 UE4 的纹理贴图


    现在，让我们使用这些纹理贴图创建一个材质。双击 `T_Sofa_ORM`，在 `纹理` 下，确保 `sRGB` 已禁用（UE4 应该已经自动完成了此操作）。在内容浏览器的空白处右键单击，在
    `创建基本资产` 下，选择 `材质`（见图 9-7）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig7_HTML.jpg](img/502922_1_En_9_Fig7_HTML.jpg)


    图 9-7


    创建材质资产


    以与你的资产对应的方式命名此材质。我将其命名为 `MM_Sofa`。接下来，双击它以启动材质编辑器窗口。你的窗口应该类似于图 9-8。你可以通过前往 `窗口
    ➤ 内容浏览器 ➤ 内容浏览器 1` 来打开内容浏览器。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig8_HTML.jpg](img/502922_1_En_9_Fig8_HTML.jpg)


    图 9-8


    材质编辑器窗口


    这是一个基于节点的材质编辑器，你可以使用各种节点和函数来创建材质。


    首先，从内容浏览器中拖拽我们的纹理并将它们放入材质编辑器窗口。按图 9-9 所示排列纹理。这是你对蓝图系统的初步了解。你正在使用基于节点的编程来创建材质。通过连接节点，你为整体节点树分配不同的功能，执行后即可生成材质。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig9_HTML.jpg](img/502922_1_En_9_Fig9_HTML.jpg)


    图 9-9


    在材质编辑器中引入并排列材质


    现在，让我们添加一些材质函数来编辑我们的材质。在空白处右键单击，搜索 `CheapContrast_RGB`，并将其添加到编辑器中。接下来，搜索 `Multiply`
    并将其也添加进来。将 `Base Color` 节点的 `RGB` 输出引脚连接到 `CheapContrast_RGB` 的输入引脚。接着，将 `CheapContrast_RGB`
    的输出连接到 `Multiply` 的输入。最后，将 `Multiply` 连接到 `MM_Sofa` 的 `Base Color` 输入。你的设置应该类似于图
    9-10。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig10_HTML.jpg](img/502922_1_En_9_Fig10_HTML.jpg)


    图 9-10


    目前的设置


    接下来，按住键盘上的字母数字键 `1` 并左键单击任意位置以添加一个 `常量` 节点。右键单击此常量，并选择 `转换为参数`（见图 9-11）。或者，你可以按下
    `S` 并单击以添加一个 `参数` 节点。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig11_HTML.jpg](img/502922_1_En_9_Fig11_HTML.jpg)


    图 9-11


    将常量转换为参数


    在左侧的细节面板中，将此参数命名为 `Contrast`（见图 9-12）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig12_HTML.jpg](img/502922_1_En_9_Fig12_HTML.jpg)


    图 9-12


    命名参数


    将参数连接到 `CheapContrast_RGB` 的 `Contrast (S)` 引脚。

