- fmt: '# Creating a Basic Level Layout


    As you can see in Figure [5-1](#502922_1_En_5_Chapter.xhtml#Fig1), there is nothing
    fancy in this scene; it has very simple geometric shapes.


    Here is a list of the assets that you have, all exported in FBX format.


    * `Floor`

    * `Grass_Pot`

    * `Plant_Pot`

    * `Rail_Central`

    * `Rail_Mid`

    * `Rail_Main`

    * `Rail_Central_End`

    * `Rail_Side`

    * `Sofa`

    * `Stairs`

    * `Wall_Door`

    * `Wall_Short`

    * `Wall_Short_Side`

    * `Wall_Split`

    * `Wall_High`

    * `Wall_High_Side`


    Let’s begin by creating a new empty scene in UE4. First, click `File` and then
    click `New Level` (see Figure [5-2](#502922_1_En_5_Chapter.xhtml#Fig2)).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig2_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Creating a new level


    In the `New Level` window, select `Default` (see Figure [5-3](#502922_1_En_5_Chapter.xhtml#Fig3)).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig3_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Create a default level


    Your new basic level should look like Figure [5-4](#502922_1_En_5_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig4_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    New default level


    This level has only the basic elements set up, such as light and fog.


    Now let’s import our assets and get started. To import an asset, simply select
    it in `Explorer` and then drag and drop it into the UE4 `Content Browser`. When
    you do this, an import window opens, giving you many options for file import (see
    Figure [5-5](#502922_1_En_5_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig5_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Import options for assets


    You are not going to change anything for now, so leave everything at default.
    Click the `Import All` button. Once your assets have been imported, put them in
    a folder named `Assets` to keep everything organized. The location should be `Content
    ➤ FirstPersonBP ➤ Assets`. And now you have assets in UE4 (see Figure [5-6](#502922_1_En_5_Chapter.xhtml#Fig6)).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig6_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Our assets in the `Content Browser`


    Next, you need to save this level. Press `Ctrl+S` to initiate save. In the `Save
    Level As` window, name your level appropriately, and then click `Save` (see Figure
    [5-7](#502922_1_En_5_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig7_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Save window


    Next, let’s drag and drop the `Floor` asset from the `Content Browser` into the
    scene. Set its `Location` to `0.0` on all the axes in the `Details` Window (see
    Figure [5-8](#502922_1_En_5_Chapter.xhtml#Fig8)). This gives our asset a location
    of `0,0,0` in the 3D space, which means the center of the world.


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig8_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    Setting the asset location


    When editing values in the input fields of any parameter, you can press the `Tab`
    key to quickly switch between the different property fields. This allows you to
    quickly edit the values.


    Next, delete the default floor that was present in the scene. Then, add the `Floor`
    asset to the scene in the `0,0,0` location. Now you should have a scene similar
    to Figure [5-9](#502922_1_En_5_Chapter.xhtml#Fig9).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig9_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Scene so far


    When you drag your assets now, you notice that the mesh snaps to the grid floor
    by the number of UU (Unreal Units, which are equal to 1 cm). You can change this
    default snapping value by clicking the `Grid Snap Value` option located in the
    top-right corner of the viewport (see Figure [5-10](#502922_1_En_5_Chapter.xhtml#Fig10)).
    Grid snapping is very important because it allows you to accurately place your
    assets where you want them.


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig10_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Grid snap value option


    With this feature, you can easily move the modular assets around and place them
    exactly as you want.


    Next, let’s duplicate our floor by pressing and holding the `Alt` key and dragging
    the floor along any axis. Place the duplicated floor as shown in Figure [5-11](#502922_1_En_5_Chapter.xhtml#Fig11).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig11_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Placing a duplicated floor


    Using that method, you can duplicate the floor multiple times and create a scene
    similar to Figure [5-12](#502922_1_En_5_Chapter.xhtml#Fig12).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig12_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig12_HTML.jpg)


    Figure 5-12


    Creating a floor setup


    Next, drag and drop the `Wall_Low` and `Wall_Short_Side` assets and set them up
    as shown in Figure [5-13](#502922_1_En_5_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig13_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig13_HTML.jpg)


    Figure 5-13


    Wall setup


    Next, drag and drop the `Wall_Tall` and `Wall_Tall_Side` assets and set them up
    as shown in Figure [5-14](#502922_1_En_5_Chapter.xhtml#Fig14).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig14_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig14_HTML.jpg)


    Figure 5-14


    Setup for the tall walls


    Next, duplicate the floors to create a roof, as shown in Figure [5-15](#502922_1_En_5_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig15_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig15_HTML.jpg)


    Figure 5-15


    Creating a roof by duplicating floors


    Next, duplicate the short walls and create the roof setup, as shown in Figure
    [5-16](#502922_1_En_5_Chapter.xhtml#Fig16).


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig16_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig16_HTML.jpg)


    Figure 5-16


    Scene so far


    This scene can be changed according to your wishes. As you can see, all the pieces
    are modular, and you can easily repurpose them as you want. That is the purpose
    of the white-box level: flexibility is the key component.


    With the basic layout done, place the `Stairs` and `Wall_Stairs` assets as shown
    in Figure [5-17](#502922_1_En_5_Chapter.xhtml#Fig17). You can position the stairs
    to a value of `660 UU` in the Y axis to place it exactly as it appears in the
    image.


    ![../images/502922_1_En_5_Chapter/502922_1_En_5_Fig17_HTML.jpg](images/502922_1_En_5_Chapter/502922_1_En_5_Fig17_HTML.jpg)


    Figure 5-17


    Scene so far


    This is a very basic level layout. It can be easily changed any time before you
    start populating the scene with detail assets.'
