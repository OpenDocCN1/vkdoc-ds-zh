  trans: '

    ### Unity3D


    Unity3D 是一款免费的游戏引擎，也是 `Unreal Engine 4` 的替代品。Unity3D 非常易于使用，因此在独立游戏工作室和小型游戏工作室中非常受欢迎。Unity3D
    是一款非常轻量级的引擎，常用于制作手机游戏。独立游戏工作室广泛使用它来制作简约的平台游戏、街机游戏以及类似类型的游戏。但这并不意味着 Unity3D 无法制作出画面精美的、令人印象深刻的游戏。许多工作室利用
    Unity3D 的简易性和出色的图形能力来制作画面精美的游戏。图 2-8 展示了 Unity3D 的界面。


    ![../images/502922_1_En_2_Chapter/502922_1_En_2_Fig8_HTML.jpg](img/502922_1_En_2_Fig8_HTML.jpg)


    图 2-8


    Unity3D


    选择使用哪种软件完全由您自己决定。本书中展示的方法并非针对特定软件。同样的技术可以轻松应用到其他工具上。您熟悉的软件越多，您的作品集就越有分量，因为这展示了您技能的灵活性。您知道得越多，就越好。


    不过，有些事情您需要注意。


    本章简要介绍了我们在本书中将要使用的软件。在下一章中，我们将进入 Maya 并开始建模我们的第一个资源。


    # 3. 3D 建模基础：资源


    让我们从 Maya 的基础知识开始。在开始制作高级内容之前，扎实掌握建模技巧非常重要。Maya 是一款非常复杂的软件应用程序，如果您希望在工作时达到最高效率，您需要记住许多热键和快捷键。之后，我将介绍如何在
    Maya 中进行资源与场景的粗模制作。


    ## Maya 基本控制


    让我们从基本导航控制开始。按下 `Alt+鼠标左键` 旋转视口。按下 `Alt+鼠标中键` 平移视图。按下 `Alt+鼠标右键` 并拖动以缩放视图。或者，您也可以使用滚轮进行缩放。您从`透视图`开始。您可以通过按下并按住空格键打开`热盒菜单`来更改视图模式（见图
    3-1）。这是一个包含了所有 Maya 工具和选项卡的紧凑菜单。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig1_HTML.jpg](img/502922_1_En_3_Fig1_HTML.jpg)


    图 3-1


    热盒菜单


    您可以使用`热盒菜单`在不同视图之间切换。要切换视图，请按下并按住空格键。将鼠标悬停在 `Maya` 选项上时 `左键单击`。会弹出一个饼状菜单，显示所有可用的视图模式（见图
    3-2）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig2_HTML.jpg](img/502922_1_En_3_Fig2_HTML.jpg)


    图 3-2


    视图饼状菜单


    从饼状菜单中，您可以选择要切换到的视图。默认情况下，您在`透视图`中工作，但您可以轻松切换到其他视图。


    接下来，让我们看看如何处理对象。单击`多边形建模选项卡`（见图 3-3）查看所有可以添加到视口中的标准基本体。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig3_HTML.jpg](img/502922_1_En_3_Fig3_HTML.jpg)


    图 3-3


    多边形建模选项卡


    默认情况下，您从`对象模式`开始。表 3-1 列出并描述了您可以在`对象模式`中使用的快捷键。


    表 3-1


    热键与快捷键


    | 热键 | 功能 |

    | --- | --- |

    | `W` | 移动 |

    | `E` | 旋转 |

    | `R` | 缩放 |

    | `Ctrl+Shift+A` | 全选 |

    | `Del` | 删除选定的对象/面/顶点（取决于选择） |

    | `Backspace` | 删除边 |

    | `Ctrl+Backspace` | 删除边以及顶点 |

    | `Shift+D` | 复制 |

    | `鼠标左键` | 选择 |

    | `Shift+Ctrl+鼠标左键` | 添加到选区 |

    | `Ctrl+鼠标左键` | 从选区中移除 |

    | `Ctrl+S` | 保存文件 |

    | `Ctrl+Z` | 撤销 |

    | `Ctrl+Y` | 重做 |

    | `空格键` | 切换编辑器区域的最小化/最大化 |


    您可以向场景中添加许多对象。单击立方体图标（在图 3-3 中高亮显示）即可向场景中添加一个立方体。


    `右键单击` 打开对象饼状菜单（见图 3-4）。您可以使用它进入对象的编辑模式，选择并编辑其基本体，例如顶点、边和面。选择 Maya 自带的标准形状（如球体或圆柱体）中的基本体，并以图
    3-4 作为参考。*边*是网格上的一条线。*顶点*是边相互交叉的极点。*面*是由边围成的区域。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig4_HTML.jpg](img/502922_1_En_3_Fig4_HTML.jpg)


    图 3-4


    顶点、边和面基本体


    在编辑模式下，有一些快捷键可以打开提供各种功能和工具的菜单。


    *   `右键单击` 显示模式菜单，允许您切换编辑模式。

    *   `Shift+右键单击` 打开一个工具菜单，可以访问诸如 `插入循环边`、`多切割`、`合并`、`倒角` 和 `桥接` 等工具。（这些工具将在本书后面讨论。）

    *   `Ctrl+Shift+右键单击` 打开所选变换工具的上下文菜单。（变换工具是移动、旋转和缩放）。

    *   如果您选择了一个循环边，您可以向任何方向滑动它。按下 `Shift+Ctrl` 并使用操纵器来滑动选中的边/边。

    *   选择一条边或一个顶点，然后按下 `Shift` 键，即可选择将选中的边/面向您选择的方向挤出。


    我还可以讨论更多，但边工作边学习新的快捷键和技巧效果更好。不过在继续之前，请确保您已经练习了所讨论的所有快捷键和热键。


    现在让我们开始创建一个简单的头戴设备。

    '
- fmt: '# Blocking Out an Asset


    Let’s start blocking out our assets. Blocking out is an important part of deciding
    what an asset looks like. A blockout gives you the freedom and flexibility to
    experiment with your ideas and decide what you like and what you don’t. Since
    a blockout has very simple geometry, it can be easily modified to see what works
    and what doesn’t.


    First, let’s create a cylinder by clicking the cylinder icon under the `Poly Modeling`
    tab. You need to make sure that it has many sides. You can set the parameters
    of your primitives in the `Channel` box (shortcut `Ctrl+A`) (see Figure [3-5](#502922_1_En_3_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig5_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Changing parameters


    The `Channel` box provides the basic parameters of your 3D model, which you can
    edit to make general modifications. There are `Translate`, `Rotate`, and `Scale`
    options for each axis.


    Let’s add `28` subdivisions to our cylinder. This makes it smoother and gives
    it lots of edges to work with. Now let’s scale down the `Y` axis by pressing the
    `R` key and using a manipulator to flatten the cylinder to a value of about `0.2`,
    as shown in Figure [3-6](#502922_1_En_3_Chapter.xhtml#Fig6).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig6_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Flattening an object


    Next, scale the cylinder along the `Z-X` Plane using the green square in the `Scale`
    manipulator. Make it wide—such as `7`—on both the `X` and `Z` axes (see Figure
    [3-7](#502922_1_En_3_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig7_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Scaling the object wider


    Then select the top cap and bottom cap in face mode and delete them, as shown
    in Figure [3-8](#502922_1_En_3_Chapter.xhtml#Fig8).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig8_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    Deleting cylinder caps


    In face mode, select and delete half of the object so that you are left with only
    the remaining half (see Figure [3-9](#502922_1_En_3_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig9_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Deleting half of the object


    Select the last two edges of the shape and make sure the `Move` manipulator is
    active. Press `W` if it’s not. Then press the `Shift` key while hovering over
    one of the manipulators. You should see the word `Extrude` appear, which means
    if you translate the selected edges using the manipulator, it extrudes the edges.
    Using the `Extrude` feature, extrude the edges backward, as shown in Figure [3-10](#502922_1_En_3_Chapter.xhtml#Fig10).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig10_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Extruding edges backward


    `Extrude` can create unwanted geometry if you are not careful or if you used extrude
    several times on a single primitive. Select any edge and move it around to see
    if any unwanted faces appear. If you find extra faces that seem to overlap with
    the ones that you want, you should delete them by selecting the unwanted geometry
    and pressing the `Backspace` key to delete it.


    ## Adding Symmetry


    Now let’s enable `Symmetry` on our object. Symmetry is a great tool because as
    you work on one side of the mesh, it copies your actions to the other side. You
    don’t have to manually work on both sides of the mesh. To enable `Symmetry`, right-click
    and select `Object mode` from the pie menu. Then press `Ctrl+Shift+Right-click`
    to open the `Tool` menu. `Symmetry` is the top option (see Figure [3-11](#502922_1_En_3_Chapter.xhtml#Fig11)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig11_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Symmetry option


    Hover over `Symmetry` to reveal more options.


    The `Symmetry` option has a check box next to it. By default, it is unchecked
    (see Figure [3-12](#502922_1_En_3_Chapter.xhtml#Fig12)). Hover over it, select
    it, and right-click to toggle it on. The same method toggles it off.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig12_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig12_HTML.jpg)


    Figure 3-12


    Toggling symmetry On


    Once enabled, you can start editing the model. You see that any edits that you
    do on one side of the mesh are automatically carried over to the other side of
    it.


    Go to the `Edge Edit` mode and select all the top edges. Move them up slightly
    and then move them back slightly, as shown in Figure [3-13](#502922_1_En_3_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig13_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Positioning the top edge


    Select all the bottom edges except for the last one, and extrude them downward,
    as shown in Figure [3-14](#502922_1_En_3_Chapter.xhtml#Fig14).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig14_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig14_HTML.jpg)


    Figure 3-14


    Extruding edges down


    Select the end edges again and extrude them back once more, as shown in Figure
    [3-15](#502922_1_En_3_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig15_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig15_HTML.jpg)


    Figure 3-15


    Extrude edge back


    Select the extruded bottom edges and adjust their positions by moving them back
    slightly and moving them down a bit, as shown in Figure [3-16](#502922_1_En_3_Chapter.xhtml#Fig16).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig16_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig16_HTML.jpg)


    Figure 3-16


    Positioning our edges


    Next, let’s add another edge loop to our shape. First, ensure that you are in
    `Edge Edit` mode. Then, press `Shift+Right-click` to open the edge tools menu.
    There you find the `Insert Edge Loop Tool` option (see Figure [3-17](#502922_1_En_3_Chapter.xhtml#Fig17)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig17_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig17_HTML.jpg)


    Figure 3-17


    Insert Edge Loop Tool


    Hover over it and right-click to activate the tool. Your cursor changes shape,
    ensuring tool activation. Now click the vertical edges to add an edge horizontally,
    as shown in Figure [3-18](#502922_1_En_3_Chapter.xhtml#Fig18). If you click the
    horizontal edges, an edge is added vertically. This is best understood by doing.
    Try adding an edge to your mesh.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig18_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig18_HTML.jpg)


    Figure 3-18


    Adding edge loop


    After that, select the bottom end edge and extrude the edge backward, as shown
    in Figure [3-19](#502922_1_En_3_Chapter.xhtml#Fig19).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig19_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig19_HTML.jpg)


    Figure 3-19


    Extruding edge back


    Select the bottom two edges at the very front of the mesh. Then press `Shift+Ctrl`
    and slide the edges up, as shown in Figure [3-20](#502922_1_En_3_Chapter.xhtml#Fig20).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig20_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig20_HTML.jpg)


    Figure 3-20


    Slide these edges up'
  raw: '## Blocking Out an Asset


    Let’s start blocking out our assets. Blocking out is an important part of deciding
    what an asset looks like. A blockout gives you the freedom and flexibility to
    experiment with your ideas and decide what you like and what you don’t. Since
    a blockout has very simple geometry, it can be easily modified to see what works
    and what doesn’t.


    First, let’s create a cylinder by clicking the cylinder icon under the Poly Modeling
    tab. You need to make sure that it has many sides. You can set the parameters
    of your primitives in the Channel box (shortcut Ctrl+A) (see Figure [3-5](#502922_1_En_3_Chapter.xhtml#Fig5)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig5_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Changing parameters


    The Channel box provides the basic parameters of your 3D model, which you can
    edit to make general modifications. There are Translate, Rotate, and Scale options
    for each axis.


    Let’s add 28 subdivisions to our cylinder. This makes it smoother and gives it
    lots of edges to work with. Now let’s scale down the Y axis by pressing the R
    key and using a manipulator to flatten the cylinder to a value of about 0.2, as
    shown in Figure [3-6](#502922_1_En_3_Chapter.xhtml#Fig6).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig6_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Flattening an object


    Next, scale the cylinder along the Z-X Plane using the green square in the Scale
    manipulator. Make it wide— such as 7—on both the X and Z axes (see Figure [3-7](#502922_1_En_3_Chapter.xhtml#Fig7)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig7_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Scaling the object wider


    Then select the top cap and bottom cap in face mode and delete them, as shown
    in Figure [3-8](#502922_1_En_3_Chapter.xhtml#Fig8).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig8_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    Deleting cylinder caps


    In face mode, select and delete half of the object so that you are left with only
    the remaining half (see Figure [3-9](#502922_1_En_3_Chapter.xhtml#Fig9)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig9_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Deleting half of the object


    Select the last two edges of the shape and make sure the Move manipulator is active.
    Press W if it’s not. Then press the Shift key while hovering over one of the manipulators.
    You should see the word Extrude appear, which means if you translate the selected
    edges using the manipulator, it extrudes the edges. Using the Extrude feature,
    extrude the edges backward, as shown in Figure [3-10](#502922_1_En_3_Chapter.xhtml#Fig10).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig10_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Extruding edges backward


    Extrude can create unwanted geometry if you are not careful or if you used extrude
    several times on a single primitive. Select any edge and move it around to see
    if any unwanted faces appear. If you find extra faces that seem to overlap with
    the ones that you want, you should delete them by selecting the unwanted geometry
    and pressing the Backspace key to delete it.


    ### Adding Symmetry


    Now let’s enable Symmetry on our object. Symmetry is a great tool because as you
    work on one side of the mesh, it copies your actions to the other side. You don’t
    have to manually work on both sides of the mesh. To enable Symmetry, right-click
    and select Object mode from the pie menu. Then press Ctrl+Shift+Right-click to
    open the Tool menu. Symmetry is the top option (see Figure [3-11](#502922_1_En_3_Chapter.xhtml#Fig11)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig11_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Symmetry option


    Hover over Symmetry to reveal more options.


    The Symmetry option has a check box next to it. By default, it is unchecked (see
    Figure [3-12](#502922_1_En_3_Chapter.xhtml#Fig12)). Hover over it, select it,
    and right-click to toggle it on. The same method toggles it off.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig12_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig12_HTML.jpg)


    Figure 3-12


    Toggling symmetry On


    Once enabled, you can start editing the model. You see that any edits that you
    do on one side of the mesh are automatically carried over to the other side of
    it.


    Go to the Edge Edit mode and select all the top edges. Move them up slightly and
    then move them back slightly, as shown in Figure [3-13](#502922_1_En_3_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig13_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Positioning the top edge


    Select all the bottom edges except for the last one, and extrude them downward,
    as shown in Figure [3-14](#502922_1_En_3_Chapter.xhtml#Fig14).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig14_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig14_HTML.jpg)


    Figure 3-14


    Extruding edges down


    Select the end edges again and extrude them back once more, as shown in Figure
    [3-15](#502922_1_En_3_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig15_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig15_HTML.jpg)


    Figure 3-15


    Extrude edge back


    Select the extruded bottom edges and adjust their positions by moving them back
    slightly and moving them down a bit, as shown in Figure [3-16](#502922_1_En_3_Chapter.xhtml#Fig16).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig16_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig16_HTML.jpg)


    Figure 3-16


    Positioning our edges


    Next, let’s add another edge loop to our shape. First, ensure that you are in
    Edge Edit mode. Then, press Shift+Right-click to open the edge tools menu. There
    you find the Insert Edge Loop Tool option (see Figure [3-17](#502922_1_En_3_Chapter.xhtml#Fig17)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig17_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig17_HTML.jpg)


    Figure 3-17


    Insert Edge Loop Tool


    Hover over it and right-click to activate the tool. Your cursor changes shape,
    ensuring tool activation. Now click the vertical edges to add an edge horizontally,
    as shown in Figure [3-18](#502922_1_En_3_Chapter.xhtml#Fig18). If you click the
    horizontal edges, an edge is added vertically. This is best understood by doing.
    Try adding an edge to your mesh.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig18_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig18_HTML.jpg)


    Figure 3-18


    Adding edge loop


    After that, select the bottom end edge and extrude the edge backward, as shown
    in Figure [3-19](#502922_1_En_3_Chapter.xhtml#Fig19).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig19_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig19_HTML.jpg)


    Figure 3-19


    Extruding edge back


    Select the bottom two edges at the very front of the mesh. Then press Shift+Ctrl
    and slide the edges up, as shown in Figure [3-20](#502922_1_En_3_Chapter.xhtml#Fig20).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig20_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig20_HTML.jpg)


    Figure 3-20


    Slide these edges up'
  trans: '

    # 构建基础模型


    让我们开始构建基础模型。构建基础模型是确定资源外观的重要环节。通过基础模型，你可以自由灵活地试验想法，并决定哪些符合需求、哪些不符合。由于基础模型的几何形状非常简单，可以轻松修改，以验证不同方案的可行性。


    首先，点击`多边形建模`选项卡下的圆柱体图标来创建一个圆柱体。你需要确保其拥有足够的边数。你可以在`通道`面板（快捷键`Ctrl+A`）中设置基础体的参数（见图
    3-5）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig5_HTML.jpg](img/502922_1_En_3_Fig5_HTML.jpg)


    图 3-5


    修改参数


    `通道`面板提供了 3D 模型的基本参数，你可以通过编辑这些参数进行常规修改。每个轴都有`平移`、`旋转`和`缩放`选项。


    让我们为圆柱体添加`28`个细分。这能让它更平滑，并提供更多可操作的边。现在，按`R`键，使用操纵器将圆柱体在`Y`轴上缩放至约`0.2`，如图 3-6 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig6_HTML.jpg](img/502922_1_En_3_Fig6_HTML.jpg)


    图 3-6


    压扁对象


    接下来，使用`缩放`操纵器中的绿色方块，沿`Z-X`平面对圆柱体进行缩放。将其在`X`轴和`Z`轴上拉宽至`7`（见图 3-7）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig7_HTML.jpg](img/502922_1_En_3_Fig7_HTML.jpg)


    图 3-7


    将对象缩放得更宽


    然后在面模式下选中顶盖和底盖并将其删除，如图 3-8 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig8_HTML.jpg](img/502922_1_En_3_Fig8_HTML.jpg)


    图 3-8


    删除圆柱体端盖


    在面模式下，选中并删除对象的一半，只保留剩余的一半（见图 3-9）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig9_HTML.jpg](img/502922_1_En_3_Fig9_HTML.jpg)


    图 3-9


    删除对象的一半


    选中形状的最后两条边，并确保`移动`操纵器处于激活状态（按`W`键激活）。然后按住`Shift`键，将鼠标悬停在一个操纵器上。你应该会看到`挤出`字样出现，这意味着使用操纵器平移选中的边时，会将边挤出。使用`挤出`功能，将边向后挤出，如图
    3-10 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig10_HTML.jpg](img/502922_1_En_3_Fig10_HTML.jpg)


    图 3-10


    向后挤出边


    如果不小心，或者对单个基础体多次使用挤出，`挤出`可能会产生不需要的几何体。为了检查，选中任意一条边并移动它，观察是否出现多余的面。如果发现有多余的面与预期面重叠，应选中这些不需要的几何体并按`Backspace`键将其删除。


    ## 添加对称


    现在让我们为对象启用`对称`功能。对称是一个强大的工具，因为当你编辑网格的一侧时，它会将操作复制到另一侧。你无需手动编辑网格的两侧。要启用`对称`功能，右键单击并从饼状菜单中选择`对象模式`。然后按`Ctrl+Shift+右键`打开`工具`菜单。`对称`是顶部的选项（见图
    3-11）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig11_HTML.jpg](img/502922_1_En_3_Fig11_HTML.jpg)


    图 3-11


    对称选项


    将鼠标悬停在`对称`上可以显示更多选项。


    `对称`选项旁边有一个复选框。默认情况下，它是未选中的（见图 3-12）。将鼠标悬停在其上，选中它，然后右键单击以切换为开启状态。用同样的方法可以将其关闭。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig12_HTML.jpg](img/502922_1_En_3_Fig12_HTML.jpg)


    图 3-12


    切换对称开启


    启用后，你就可以开始编辑模型了。你会看到，你对网格一侧所做的任何编辑都会自动复制到另一侧。


    进入`边编辑`模式，选中所有顶部的边。将它们稍微向上移动，然后再稍微向后移动，如图 3-13 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig13_HTML.jpg](img/502922_1_En_3_Fig13_HTML.jpg)


    图 3-13


    定位顶部边缘


    选中除最后一条之外的所有底部边，并将其向下挤出，如图 3-14 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig14_HTML.jpg](img/502922_1_En_3_Fig14_HTML.jpg)


    图 3-14


    向下挤出边


    再次选中末端边，并再次向后挤出，如图 3-15 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig15_HTML.jpg](img/502922_1_En_3_Fig15_HTML.jpg)


    图 3-15


    向后挤出边


    选中挤出的底部边，通过将其稍微向后移动并向下移动一点来调整它们的位置，如图 3-16 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig16_HTML.jpg](img/502922_1_En_3_Fig16_HTML.jpg)


    图 3-16


    定位我们的边


    接下来，让我们为形状添加另一个边循环。首先，确保你处于`边编辑`模式。然后，按`Shift+右键`打开边工具菜单。在其中找到`插入边循环工具`选项（见图 3-17）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig17_HTML.jpg](img/502922_1_En_3_Fig17_HTML.jpg)


    图 3-17


    插入边循环工具


    将鼠标悬停在它上面，然后右键单击以激活该工具。你的光标会改变形状，表示工具已激活。现在点击垂直边，可以水平添加一条边，如图 3-18 所示。如果你点击水平边，则会垂直添加一条边。这一点通过实际操作最能理解。尝试为你的网格添加一条边。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig18_HTML.jpg](img/502922_1_En_3_Fig18_HTML.jpg)


    图 3-18


    添加边循环


    之后，选中底部的末端边，并向后挤出该边，如图 3-19 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig19_HTML.jpg](img/502922_1_En_3_Fig19_HTML.jpg)


    图 3-19


    向后挤出边


    选中网格最前端底部的两条边。然后按住`Shift+Ctrl`键，将边向上滑动，如图 3-20 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig20_HTML.jpg](img/502922_1_En_3_Fig20_HTML.jpg)


    图 3-20


    将这些边向上滑动

    '
- fmt: 'The edges on the mesh currently look hard and jagged. Select all the edges
    on the mesh by drawing a selection box around it. Make sure to select every single
    edge. Press `Shift+Right-click` and from the menu, select the `Soften/Harden Edges`
    option (see Figure 3-21).


    Mesh normals are perpendicular lines that can be drawn facing out from each face
    of a mesh. They dictate how your models look. They can be hardened, softened,
    or flipped. After smoothing the mesh normals, the shading values are averaged,
    which produces a smoother look. Mesh normals can sometimes face the wrong direction,
    making your mesh look black. These are the things that you should look out for.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig21_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig21_HTML.jpg)


    Figure 3-21: Select `Soften/Harden Edges`


    Hover over `Soften/Harden Edges` to open a new submenu, which offers more options
    related to softening and hardening edges. Select the `Soften Edge` option and
    release right-click (see Figure 3-22).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig22_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig22_HTML.jpg)


    Figure 3-22: Select `Soften Edge`


    Once you do that, you see that the edges no longer have hard normals. This is
    exactly how you want it to be.


    ### Adding Duplicate Faces


    Let’s add a few more pieces to our mesh. Select and duplicate the faces highlighted
    in Figure 3-23.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig23_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig23_HTML.jpg)


    Figure 3-23: Select these faces


    Next, press `Shift+Right-click` and select `Duplicate Face` from the list (Figure
    3-24).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig24_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig24_HTML.jpg)


    Figure 3-24: `Duplicate Face` option


    Once your faces have been duplicated, they form a new object. You can also use
    the offset value to create space between the old and new duplicated faces. You
    can use the `Move` tool to maintain the spacing between them.


    Switch to `Object` mode and select the mesh created by the duplicated faces. Then
    move them back and position them as shown in Figure 3-25. Alternatively, you can
    use the `Channel` box and enter a value of `2.0` for the `X` axis to translate
    it. If your mesh goes in the wrong direction, it means your mesh is rotated on
    a different axis. In that case, press `Ctrl+Z` to undo and enter a value of `2.0`
    for the `Z` axis (Note: Maya uses the `Y` axis as Up, so enter `2.0` for the `Z`
    axis).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig25_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig25_HTML.jpg)


    Figure 3-25: Positioning our duplicated faces


    Now switch to the object’s vertex editing mode and select the last four vertices.
    Press `B` to toggle `Soft Selection` on. (You can press `B` any time to toggle
    `Soft Selection` on or off). Press `B+Middle-click` and drag the mouse to the
    right to increase the `Soft Selection` brush size. Make the brush large enough
    to cover a large portion of the mesh, as shown in Figure 3-26.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig26_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig26_HTML.jpg)


    Figure 3-26: Make `Soft Selection` brush large


    Then use the `Move` tool to position the selected vertices as shown in Figure
    3-27.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig27_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig27_HTML.jpg)


    Figure 3-27: Positioning the vertices


    If the symmetry does not work correctly on your `X` axis, try switching to a different
    `Symmetry` axis. To do this, go to `Object` mode. Press `Ctrl+Shift+Right-click`,
    go to `Symmetry`, and select the `Z` axis. This should fix your problem. Also,
    make sure that your mesh is centered on the grid.


    Press `B` again to disable `Soft Selection`. Select and move everything so that
    every mesh is sitting on top of the grid, as shown in Figure 3-28. The grid overlapping
    the mesh is very distracting.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig28_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig28_HTML.jpg)


    Figure 3-28: Moving our meshes on top of the grid


    Next, go to edit mode of the smaller piece and select the edges shown in Figure
    3-29.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig29_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig29_HTML.jpg)


    Figure 3-29: Select the following edges


    Once selected, extrude them downward by pressing and holding the `Shift` key and
    using the `Move` tool, as shown in Figure 3-30.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig30_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig30_HTML.jpg)


    Figure 3-30: Extrude the edges


    **Note**: If the extrude does not behave as intended, then disable `Symmetry`
    and then try extruding again. Make sure that you enable `Symmetry` again after
    extruding.


    After extruding, move the edges back very slightly. There is no need to be too
    precise; just make sure that the proportions look somewhat correct.


    Now let’s add some details to the front body of the headset. Start by adding a
    couple of edge loops to the mesh. Go to `Edge Select` mode of the front piece
    and press `Shift+Right-click`. From the menu, select `Insert Edge Loop Tool` (see
    Figure 3-31).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig31_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig31_HTML.jpg)


    Figure 3-31: `Insert Edge Loop Tool`


    Now add two edge loops, as shown in Figure 3-32.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig32_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig32_HTML.jpg)


    Figure 3-32: Adding edge loops


    Select the first edge loop from the top of the shape by double-clicking it and
    moving it slightly forward to give it a slight curve (see Figure 3-33).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig33_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig33_HTML.jpg)


    Figure 3-33: Giving curve to our shape


    Switch to face mode and select all the faces of the mesh. You can double-click
    any face to select all the faces on the mesh. `Shift+Right-click` and select `Extrude
    Face` from the menu (see Figure 3-34).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig34_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig34_HTML.jpg)


    Figure 3-34: `Extrude Face`


    Set the `Thickness` value to `0.3`, as shown in Figure 3-35.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig35_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig35_HTML.jpg)


    Figure 3-35: Extruding our shape'
  raw: 'The edges on the mesh currently look hard and jagged. Select all the edges
    on the mesh by drawing a selection box around it. Make sure to select every single
    edge. Shift+Right-click and from the menu, select the Soften/Harden Edges option
    (see Figure [3-21](#502922_1_En_3_Chapter.xhtml#Fig21)).


    Mesh normals are perpendicular lines that can be drawn facing out from each face
    of a mesh. They dictate how your models look. They can be hardened, softened,
    or flipped. After smoothing the mesh normals, the shading values are averaged,
    which produces a smoother look. Mesh normals can sometimes face the wrong direction,
    giving making your mesh look black. These are the things that you should look
    out for.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig21_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    Select Soften/Harden Edges


    Hover over Soften/Harden Edges to open a new submenu, which offers more options
    related to softening and hardening edges. Select the Soften Edge option and release
    right-click (see Figure [3-22](#502922_1_En_3_Chapter.xhtml#Fig22)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig22_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    Select Soften Edge


    Once you do that, you see that the edges no longer have hard normals. This is
    exactly how you want it to be.


    ### Adding Duplicate Faces


    Let’s add a few more pieces to our mesh . Select and duplicate the faces highlighted
    in Figure [3-23](#502922_1_En_3_Chapter.xhtml#Fig23).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig23_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Select these faces


    Next, press Shift+Right-click and select Duplicate Face from the list (Figure
    [3-24](#502922_1_En_3_Chapter.xhtml#Fig24)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig24_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig24_HTML.jpg)


    Figure 3-24


    Duplicate Face option


    Once your faces have been duplicated, they form a new object. You can also use
    the offset value to create space between the old and new duplicated faces. You
    can use the Move tool to maintain the spacing between them.


    Switch to Object mode and select the mesh created by the duplicated faces. Then
    move them back and position them as shown in Figure [3-25](#502922_1_En_3_Chapter.xhtml#Fig25).
    Alternatively, you can use the Channel box and enter a value of 2.0 for the X
    axis to translate it. If your mesh goes in the wrong direction, it means your
    mesh is rotated on a different axis. In that case, press Ctrl+Z to undo and enter
    a value of 2.0 for the Z axis (Note: Maya uses the Y axis as Up, so enter 2.0
    for the Z axis).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig25_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Positioning our duplicated faces


    Now switch to the object’s vertex editing mode and select the last four vertices.
    Press B to toggle Soft Selection on. (You can press B any time to toggle Soft
    Selection on or off). Press B+Middle-click and drag the mouse to the right to
    increase the Soft Selection brush size. Make the brush large enough to cover a
    large portion of the mesh, as shown in Figure [3-26](#502922_1_En_3_Chapter.xhtml#Fig26).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig26_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig26_HTML.jpg)


    Figure 3-26


    Make Soft Selection brush large


    Then use the Move tool to position the selected vertices as shown in Figure [3-27](#502922_1_En_3_Chapter.xhtml#Fig27).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig27_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig27_HTML.jpg)


    Figure 3-27


    Positioning the vertices


    If the symmetry does not work correctly on your X axis, try switching to a different
    Symmetry axis. To do this, go to Object mode. Press Ctrl+Shift+Right-click, go
    to Symmetry, and select the Z axis. This should fix your problem. Also, make sure
    that your mesh is centered on the grid.


    Press B again to disable Soft Selection. Select and move everything so that every
    mesh is sitting on top of the grid, as shown in Figure [3-28](#502922_1_En_3_Chapter.xhtml#Fig28).
    The grid overlapping the mesh is very distracting.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig28_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig28_HTML.jpg)


    Figure 3-28


    Moving our meshes on top of the grid


    Next, go to edit mode of the smaller piece and select the edges shown in Figure
    [3-29](#502922_1_En_3_Chapter.xhtml#Fig29).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig29_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig29_HTML.jpg)


    Figure 3-29


    Select the following edges


    Once selected, extrude them downward by pressing and holding the Shift key and
    using the Move tool, as shown in Figure [3-30](#502922_1_En_3_Chapter.xhtml#Fig30).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig30_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig30_HTML.jpg)


    Figure 3-30


    Extrude the edges


    Note


    If the extrude does not behave as intended, then disable Symmetry and then try
    extruding again. Make sure that you enable Symmetry again after extruding.


    After extruding, move the edges back very slightly. There is no need to be too
    precise; just make sure that the proportions look somewhat correct.


    Now let’s add some details to the front body of the headset. Start by adding a
    couple of edge loops to the mesh. Go to Edge Select mode of the front piece and
    press Shift+Right-click. From the menu, select Insert Edge Loop Tool (see Figure
    [3-31](#502922_1_En_3_Chapter.xhtml#Fig31)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig31_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig31_HTML.jpg)


    Figure 3-31


    Insert Edge Loop Tool


    Now add two edge loops, as shown in Figure [3-32](#502922_1_En_3_Chapter.xhtml#Fig32).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig32_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig32_HTML.jpg)


    Figure 3-32


    Adding edge loops


    Select the first edge loop from the top of the shape by double-clicking it and
    moving it slightly forward to give it a slight curve (see Figure [3-33](#502922_1_En_3_Chapter.xhtml#Fig33)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig33_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig33_HTML.jpg)


    Figure 3-33


    Giving curve to our shape


    Switch to face mode and select all the faces of the mesh. You can double-click
    any face to select all the faces on the mesh. Shift+Right-click and select Extrude
    Face from the menu (see Figure [3-34](#502922_1_En_3_Chapter.xhtml#Fig34)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig34_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig34_HTML.jpg)


    Figure 3-34


    Extrude Face


    Set the Thickness value to 0.3, as shown in Figure [3-35](#502922_1_En_3_Chapter.xhtml#Fig35).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig35_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig35_HTML.jpg)


    Figure 3-35


    Extruding our shape'
  trans: '

    网格上的边缘目前看起来生硬且有棱角。通过在其周围绘制一个选择框，选中网格上的所有边缘。确保选中每一条边缘。按下 `Shift+右键单击`，从菜单中选择 `软化/硬化边缘`
    选项（见图 3-21）。


    网格法线是垂直于网格每个面并向外延伸的线。它们决定了模型的外观。法线可以硬化、软化或翻转。平滑网格法线后，着色值会被平均化，从而产生更平滑的外观。网格法线有时会朝向错误的方向，使你的网格看起来是黑色的。这些都是你应该留意的问题。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig21_HTML.jpg](img/502922_1_En_3_Fig21_HTML.jpg)


    图 3-21：选择“软化/硬化边缘”


    将鼠标悬停在 `软化/硬化边缘` 上，会打开一个新的子菜单，其中提供了更多与软化、硬化边缘相关的选项。选择 `软化边缘` 选项并释放右键（见图 3-22）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig22_HTML.jpg](img/502922_1_En_3_Fig22_HTML.jpg)


    图 3-22：选择“软化边缘”


    完成此操作后，你会看到边缘不再有硬法线。这正是你想要的效果。


    ### 添加重复面


    让我们为网格再添加几个部分。选择并复制图 3-23 中高亮显示的面。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig23_HTML.jpg](img/502922_1_En_3_Fig23_HTML.jpg)


    图 3-23：选择这些面


    接下来，按下 `Shift+右键单击`，并从列表中选择 `复制面`（图 3-24）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig24_HTML.jpg](img/502922_1_En_3_Fig24_HTML.jpg)


    图 3-24：“复制面”选项


    一旦面被复制，它们就会形成一个新的对象。你还可以使用偏移值来在旧面和新复制的面之间创建空间。你可以使用 `移动` 工具来保持它们之间的间距。


    切换到 `对象` 模式，并选择由复制面创建的网格。然后将它们移回并定位，如图 3-25 所示。或者，你可以使用 `通道` 框，并在 `X` 轴输入 `2.0`
    的值来移动它。如果你的网格方向错误，意味着你的网格在另一个轴上发生了旋转。这种情况下，按 `Ctrl+Z` 撤销，然后在 `Z` 轴输入 `2.0` 的值（注意：Maya
    使用 `Y` 轴作为向上轴，所以在 `Z` 轴输入 `2.0`）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig25_HTML.jpg](img/502922_1_En_3_Fig25_HTML.jpg)


    图 3-25：定位我们复制的面


    现在切换到对象的顶点编辑模式，并选择最后四个顶点。按下 `B` 键打开 `软选择`。（你可以随时按 `B` 键来打开或关闭 `软选择`）。按下 `B+鼠标中键`
    并向左拖动鼠标以增加 `软选择` 的笔刷大小。使笔刷足够大，以覆盖网格的大部分区域，如图 3-26 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig26_HTML.jpg](img/502922_1_En_3_Fig26_HTML.jpg)


    图 3-26：调大“软选择”笔刷


    然后使用 `移动` 工具将选中的顶点定位到图 3-27 所示的位置。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig27_HTML.jpg](img/502922_1_En_3_Fig27_HTML.jpg)


    图 3-27：定位顶点


    如果对称在你的 `X` 轴上不能正常工作，尝试切换到不同的 `对称` 轴。为此，进入 `对象` 模式。按下 `Ctrl+Shift+右键单击`，转到 `对称`，然后选择
    `Z` 轴。这应该能解决你的问题。同时，确保你的网格位于网格的中心。


    再次按下 `B` 键以停用 `软选择`。选择并移动所有物体，使每个网格都位于网格之上，如图 3-28 所示。网格与网格重叠会非常分散注意力。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig28_HTML.jpg](img/502922_1_En_3_Fig28_HTML.jpg)


    图 3-28：将网格移动到网格上方


    接下来，进入较小部件的编辑模式，并选择图 3-29 所示的边缘。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig29_HTML.jpg](img/502922_1_En_3_Fig29_HTML.jpg)


    图 3-29：选择以下边缘


    选中后，按住 `Shift` 键并使用 `移动` 工具将它们向下挤出，如图 3-30 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig30_HTML.jpg](img/502922_1_En_3_Fig30_HTML.jpg)


    图 3-30：挤出边缘


    **注意**：如果挤出效果不如预期，则禁用 `对称`，然后再尝试挤出。确保在挤出后重新启用 `对称`。


    挤出后，将边缘稍微向后移动一点。无需过于精确；只需确保比例看起来大致正确即可。


    现在让我们为耳机的前部主体添加一些细节。首先为网格添加几个循环边。进入前部部件的 `边选择` 模式，然后按下 `Shift+右键单击`。从菜单中选择 `插入循环边工具`（见图
    3-31）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig31_HTML.jpg](img/502922_1_En_3_Fig31_HTML.jpg)


    图 3-31：“插入循环边工具”


    现在添加两个循环边，如图 3-32 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig32_HTML.jpg](img/502922_1_En_3_Fig32_HTML.jpg)


    图 3-32：添加循环边


    通过双击选择形状顶部第一个循环边，并将其稍微向前移动，使其产生轻微的弧度（见图 3-33）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig33_HTML.jpg](img/502922_1_En_3_Fig33_HTML.jpg)


    图 3-33：为形状添加弧度


    切换到面模式并选中网格的所有面。你可以双击任意面以选中网格上的所有面。按下 `Shift+右键单击`，然后从菜单中选择 `挤出面`（见图 3-34）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig34_HTML.jpg](img/502922_1_En_3_Fig34_HTML.jpg)


    图 3-34：“挤出面”


    将 `厚度` 值设置为 `0.3`，如图 3-35 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig35_HTML.jpg](img/502922_1_En_3_Fig35_HTML.jpg)


    图 3-35：挤出我们的形状

