- fmt: "## Conclusion\n\nYou have now completed this book. I hope the information\
    \ that you got from it has been useful. Creating a complete scene from scratch\
    \ is a pretty big project, and it takes a lot of time and patience to finish.\n\
    \nHere are some additional useful tips for when you are working on a similar project.\n\
    \n- **Gather references.** References are very useful and important for creating\
    \ anything. Have reference images for everything.\n- **Always name your assets\
    \ properly.** `UE4` uses certain naming conventions to identify assets and their\
    \ types, which is convenient when multiple people are working on the same project.\
    \ `SM_` is used for static meshes and followed by the asset name. `M_` or `MM_`\
    \ is used for master materials. `MI_` or `_Inst` is used for material instances.\
    \ `MF_` is used for material functions. `BP_` is used for blueprint classes and\
    \ objects. Use these as naming conventions for your assets.\n- **Create a plan/layout.**\
    \ Never go in blind. Create a rough layout for your level in software application\
    \ like `Photoshop`. You can even hand-draw it.\n- **Start simple.** Start with\
    \ simple walls and floors to see whether your layout works or not. Blockout is\
    \ important before going into detail.\n- **Layer details.** When adding details,\
    \ go in layer by layer. Start with a simple layout and then add larger details,\
    \ such as furniture. After that, add smaller details, such as decorations.\n-\
    \ **Always have a folder structure for storing your assets.** When you start a\
    \ new project, create the following folders immediately: `Assets`, `Blueprints`,\
    \ and `Maps`. Inside the `Assets` folder, add `Master_Materials`, `Material_Instances`,\
    \ `Material_Functions`, `Meshes`, and `Textures`. Inside `Blueprints`, add folders\
    \ like `Tools`, `Gameplay`, and so forth. This allows you to handle and manage\
    \ your assets well and organize your project.\n\nAssets can be used in a variety\
    \ of ways in your portfolio. In architectural visualization, there usually aren’t\
    \ restrictions on polygon count or performance because the scenes are entirely\
    \ designed to show off your assets in the highest visual fidelity. In these cases,\
    \ you can freely create whatever you want without worrying about light baking\
    \ or polygons.\n\nOf course, there are some restrictions. You shouldn’t bring\
    \ fully subdivided models into `UE4` because it completely overloads the Engine.\
    \ But if you have a decently powerful system, then `UE4` can easily handle several\
    \ hundred thousand polygons in a scene, depending on the complexity of the materials\
    \ that you use.\n\nIt is best to optimize your assets because it allows your skills\
    \ to be transferred to game development and VR, which has a strict memory budget.\
    \ Make sure to keep your skills scalable.\n\nThese scenes can be easily used as\
    \ a portfolio for Archviz scenes, but it is important to know `Blueprints` well\
    \ to create more interactions. `Blueprints` is an entirely different subject that\
    \ requires its own dedicated book.\n\nGame-level design is a good environment\
