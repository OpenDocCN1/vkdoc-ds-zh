- fmt: 'Next, right-click to add `Constant3Vector`, and convert it to a parameter
    as well. Name it `Tint`. Connect it to the `Multiply` node’s bottom input pin.
    Your setup should look similar to Figure [9-13](#502922_1_En_9_Chapter.xhtml#Fig13).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig13_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig13_HTML.jpg)


    Figure 9-13 Setup so far


    Click the `Tint` parameter node. In the **Details** panel, set its default value
    to be completely white (see Figure [9-14](#502922_1_En_9_Chapter.xhtml#Fig14)).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig14_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig14_HTML.jpg)


    Figure 9-14 Setting the default value of our tint parameter


    Connect your normal map to the main material, as shown in Figure [9-15](#502922_1_En_9_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig15_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig15_HTML.jpg)


    Figure 9-15 Connecting normal map


    For the two maps in Figure [9-15](#502922_1_En_9_Chapter.xhtml#Fig15), you need
    the data stored in all three channels of the texture map. But for the next map,
    which is the ORM map, you need the data stored in the individual texture channels,
    namely the **Red**, **Green**, and **Blue** channels. For this, the connecting
    goes as follows:


    1.  Connect the red (`R`) pin to the Material node’s **Ambient Occlusion** pin.

    2.  Connect the green (`G`) pin to the Material node’s **Roughness** pin.

    3.  Connect the blue (`B`) pin to the Material node’s **Metallic** pin.


    Your setup should look similar to Figure [9-16](#502922_1_En_9_Chapter.xhtml#Fig16).


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig16_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig16_HTML.jpg)


    Figure 9-16 Setup for ORM texture


    You can multiply the ORM texture’s green channel by a parameter to control the
    roughness of your asset. Simply create a parameter named `Roughness` and add a
    `Multiply` node. Connect them as shown in Figure [9-17](#502922_1_En_9_Chapter.xhtml#Fig17).
    Do this by dragging away the `B` node on the new `Multiply` node and searching
    for `param`. Then select the **Scalar** parameter and rename it `Roughness`.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig17_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig17_HTML.jpg)


    Figure 9-17 Setup for controlling Roughness


    ## Applying the Material to a Mesh


    Once you have saved your material, you are ready to apply it to your mesh. Drag
    and drop the material from the **Content Browser** to the asset on your scene.
    It should be textured, as you did in **Substance Painter**. The result depends
    on what you created, but Figure [9-18](#502922_1_En_9_Chapter.xhtml#Fig18) shows
    the result from my scene.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig18_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig18_HTML.jpg)


    Figure 9-18 Result of applying material


    When working on architectural design visualization, you may have to use an asset
    that plays a role with other assets to create a complete scene. Figures [9-19](#502922_1_En_9_Chapter.xhtml#Fig19)
    through [9-22](#502922_1_En_9_Chapter.xhtml#Fig22) are previews of a render using
    three copies of a sofa placed in a design visualization interior set.


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig22_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig22_HTML.jpg)


    Figure 9-22 Long shot 4 scene


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig21_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig21_HTML.jpg)


    Figure 9-21 Long shot 3 scene


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig20_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig20_HTML.jpg)


    Figure 9-20 Long shot 2 scene


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig19_HTML.jpg](images/502922_1_En_9_Chapter/502922_1_En_9_Fig19_HTML.jpg)


    Figure 9-19 Long shot 1 scene


    This chapter concludes with these results.


    In the next chapter, you create more materials and work with master and instanced
    materials.


    # 10. Real-Time Emissive Materials


    You have created standard materials. Now let’s look at creating real-time emissive
    materials. In this chapter, you also create instanced materials and learn their
    importance.'
