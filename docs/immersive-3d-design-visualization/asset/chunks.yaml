- fmt: 'Scroll down. Under the `Physics` tab, enable `Simulate Physics` and `MassInKg`,
    and uncheck the `Enable Gravity` checkbox to disable gravity (see Figure [15-12](#502922_1_En_15_Chapter.xhtml#Fig12)).
    `Simulate Physics` makes our bodies simulate physics, as the name suggests. `MassInKg`
    allows you to set body weight. And you disable gravity because you don’t want
    our mesh to be affected by gravity because it produces undesirable effects.


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig12_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig12_HTML.jpg)


    Figure 15-12


    Physics settings-1


    Let’s increase `MassInKg` to a high number like 300 because you want the door
    to feel heavy. However, it may seem like an absurd weight for a door by real-world
    standards, but in UE4, this is what feels normal. Next, increase `Angular Damping`
    to a number like 6 or 7. This adds resistance to the rotation of the door, as
    if there is friction and air resistance, and other factors from the real world
    (see Figure [15-13](#502922_1_En_15_Chapter.xhtml#Fig13)).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig13_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig13_HTML.jpg)


    Figure 15-13


    Set MassInKg and Angular Damping


    When our player collides with the door, you want the door to rotate, but with
    the current settings, the door simply flies backward when you touch it. Play your
    level to test this now. You need to constraint this object to rotate along only
    the Z axis when you touch it. Why the Z axis? Select and rotate your door by pressing
    the `E` key on all three axes. Notice that rotation along the Z axis feels like
    the most normal rotation of the door.


    Now, let’s activate the relevant constraints on our door. First, lock its position
    on all X, Y, and Z axes on which the door is hinged so that they can’t move from
    their positions. Under the `Physics` tab, find `Constraints`. Click all the X,
    Y, and Z check boxes next to `Lock Position`. Also, you want the rotation to happen
    only along the Z axis, so click the X and Y check boxes next to `Lock Rotation`.
    Your settings should look similar to Figure [15-14](#502922_1_En_15_Chapter.xhtml#Fig14).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig14_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig14_HTML.jpg)


    Figure 15-14


    Constraints settings


    Now play your level and try pushing your door. You see that your door can now
    be pushed and open naturally like a real door, as shown in Figure [15-15](#502922_1_En_15_Chapter.xhtml#Fig15).


    ![../images/502922_1_En_15_Chapter/502922_1_En_15_Fig15_HTML.jpg](images/502922_1_En_15_Chapter/502922_1_En_15_Fig15_HTML.jpg)


    Figure 15-15


    Physics enabled door


