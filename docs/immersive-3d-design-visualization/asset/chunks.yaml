  trans: '

    ### 导入 Quixel Megascans 纹理


    在之前的章节中，你已经了解了如何下载、安装 Quixel Bridge，并将其配置到 UE4 中。现在，我们来看看如何将纹理从 Bridge 发送到 UE4
    并在场景中使用。首先，确保 UE4 和 Bridge 都已运行。然后，在 UE4 中，点击 Megascans 图标来运行 Quixel 插件（见图 12-1）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig1_HTML.jpg](img/502922_1_En_12_Fig1_HTML.jpg)


    图 12-1：Megascans 插件


    启动 Megascans 窗口后，切换到 Quixel Bridge 应用程序。选择要导出到 UE4 的纹理，然后点击 Download（下载）。假设你选择了一个现代瓷砖地板纹理（见图
    12-2）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig2_HTML.jpg](img/502922_1_En_12_Fig2_HTML.jpg)


    图 12-2：选择材质


    资源下载完成后，你会看到所有导出选项（见图 12-3）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig3_HTML.jpg](img/502922_1_En_12_Fig3_HTML.jpg)


    图 12-3：导出设置


    图 12-3 显示纹理分辨率设置为 2K，纹理格式设置为 TGA。这些是 UE4 的最佳设置。选择好保存项目的目录位置后，点击 EXPORT（导出）将材质发送到
    UE4。短暂的导出过程后，你会在内容浏览器的 `Megascans/Surfaces` 文件夹中找到该材质（见图 12-4）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig4_HTML.jpg](img/502922_1_En_12_Fig4_HTML.jpg)


    图 12-4：材质已导出到 UE4


    材质会自动为你设置好。你只需将其拖放到想要应用它的网格体上即可（见图 12-5）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig5_HTML.jpg](img/502922_1_En_12_Fig5_HTML.jpg)


    图 12-5：材质已应用到我们的地板网格体


    以下是为本项目准备的材质。


    - 水磨石地板 2×2 M

    - 墙面石膏 2×2 M

    - 光滑混凝土砌块 2×2 M

    - 猫掌（如果你想要一个 3D 植物来装饰场景）


    现在，如图 12-6 所示，创建一个由十面墙和六面地板组成的简单房间。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig6_HTML.jpg](img/502922_1_En_12_Fig6_HTML.jpg)


    图 12-6：房间搭建


    我们为网格体应用 Megascans 材质，如图 12-7 所示。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig7_HTML.jpg](img/502922_1_En_12_Fig7_HTML.jpg)


    图 12-7：材质已应用到我们的网格体


    接下来，拖入沙发、桌子和装饰品，并将它们放置在场景中（见图 12-8）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig8_HTML.jpg](img/502922_1_En_12_Fig8_HTML.jpg)


    图 12-8：带有装饰品的场景


    接下来，让我们从 Substance Painter 导出头戴式耳机模型。使用 UE4 预设和 targa 图像格式进行导出（见图 12-9）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig9_HTML.jpg](img/502922_1_En_12_Fig9_HTML.jpg)


    图 12-9：导出设置


    完成后，在 UE4 内容浏览器中为头戴式耳机资源创建一个文件夹，并将导出的网格体和材质拖放到此文件夹中。按照你在上一章中的相同方式设置材质（见图 12-10）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig10_HTML.jpg](img/502922_1_En_12_Fig10_HTML.jpg)


    图 12-10：头戴式耳机的材质设置


    将头戴式耳机拖放到场景中。将其放置在沙发上，然后为其应用材质。结果应该类似于图 12-11。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig11_HTML.jpg](img/502922_1_En_12_Fig11_HTML.jpg)


    图 12-11：头戴式耳机资源


    现在为场景添加一些基础光照。在放置 Actor 面板的 Lights（灯光）类别中，找到聚光源（见图 12-12）。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig12_HTML.jpg](img/502922_1_En_12_Fig12_HTML.jpg)


    图 12-12：聚光源 Actor


    接下来，设置光照设置，如图 12-13 所示。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig13_HTML.jpg](img/502922_1_En_12_Fig13_HTML.jpg)


    图 12-13：光照设置


    将光源位置调整为略向墙面倾斜，如图 12-14 所示。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig14_HTML.jpg](img/502922_1_En_12_Fig14_HTML.jpg)


    图 12-14：定位光源


    如果需要更好的照明效果，可以在场景中复制该光源。完成后，进行光照烘焙。


    ### 最终渲染


    图 12-15 至 12-17 显示了结果。


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig17_HTML.jpg](img/502922_1_En_12_Fig17_HTML.jpg)


    图 12-17：最终结果 3


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig16_HTML.jpg](img/502922_1_En_12_Fig16_HTML.jpg)


    图 12-16：最终结果 2


    ![../images/502922_1_En_12_Chapter/502922_1_En_12_Fig15_HTML.jpg](img/502922_1_En_12_Fig15_HTML.jpg)


    图 12-15：最终结果 1


    本章内容就到这里。


    在下一章中，你将查找并修复一些常见错误。


    # 测试与修复错误


    在上一章中，你创建了一个非常基础的关卡。现在，我们来修复一些常见错误。其中大部分与光照有关。每个问题的解决方法有很多种，因此在本章中，我将分享我在遇到某些问题时使用的方法。

    '
- fmt: '# Lighting Problems


    When you work with modular assets, it is common to encounter lighting problems
    like the one shown in Figure [13-1](#502922_1_En_13_Chapter.xhtml#Fig1).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig1_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig1_HTML.jpg)


    Figure 13-1


    Light leaking


    You can see a small beam of light leaking through the wall, which looks wrong.
    Something like this usually happens when there is a gap or hole somewhere in the
    mesh, and everything is not watertight. If you look around the mesh, you may see
    something like what’s shown in Figure [13-2](#502922_1_En_13_Chapter.xhtml#Fig2).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig2_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig2_HTML.jpg)


    Figure 13-2


    Gaps between meshes


    But if you look at it from the other side, there is no gap, as seen in Figure
    [13-3](#502922_1_En_13_Chapter.xhtml#Fig3).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig3_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig3_HTML.jpg)


    Figure 13-3


    No visible gaps in the mesh


    This is due to *backface culling*, which means that only one side of a mesh face
    is rendered, and the other side is *culled*, meaning it was not rendered. You
    can simply see through it, and thus any light in the scene passes through the
    culled side of the face.


    The way to fix it in this case is to simply close the gap by overlapping the meshes,
    as shown in Figure [13-4](#502922_1_En_13_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig4_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig4_HTML.jpg)


    Figure 13-4


    Overlapping our mesh


    This results in *z-fighting* in the overlapping areas, which means the overlapping
    faces flicker because UE4 is confused about which one to render on top of the
    other one. But this is fine in our case because this happens where the players
    cannot see. If this happens in a visible area, however, you should fix it by carefully
    moving the meshes so that overlapping does not happen.


    ## Shadow Seam Problems


    Let’s look at shadow seam issues and how to fix them. In the previous chapter,
    you changed lightmass settings to reduce the shadow seam effect. Figure [13-5](#502922_1_En_13_Chapter.xhtml#Fig5)
    shows the settings once again.


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig5_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig5_HTML.jpg)


    Figure 13-5


    Lightmass settings


    Building light with these settings means a lower number of light seams appear.
    But if this doesn’t correctly solve the problem, there is one more tool at our
    disposal. Select the walls with shadow seams, as shown in Figure [13-6](#502922_1_En_13_Chapter.xhtml#Fig6).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig6_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig6_HTML.jpg)


    Figure 13-6


    Selecting the walls with seam issues


    Next, right-click any of the selected walls to open the Asset actions menu. In
    this menu, select Merge Actors, as shown in Figure [13-7](#502922_1_En_13_Chapter.xhtml#Fig7).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig7_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig7_HTML.jpg)


    Figure 13-7


    Merge actors


    In the Merge Actors settings panel, go to Mesh Replacement Method, select Remove
    Original Actors, and click the Merge Actors button (see Figure [13-8](#502922_1_En_13_Chapter.xhtml#Fig8)).


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig8_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig8_HTML.jpg)


    Figure 13-8


    Merge actor settings


    Once done, bake your lights again. The shadow seams should no longer appear. Merging
    actors not only removes problems like this but also optimizes your scene. Figure
    [13-9](#502922_1_En_13_Chapter.xhtml#Fig9) is a final look at the wall.


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig9_HTML.jpg](images/502922_1_En_13_Chapter/502922_1_En_13_Fig9_HTML.jpg)


    Figure 13-9


    Shadow seams removed


    That’s it for this chapter. Hopefully, you are now able to solve these common
    problems in your scene.


    In the next chapter, you extend and complete the scene.


    # 14. Design Visualization Capstone Project: Aesthetic Development


    You have created a simple level, set up basic lighting, and fixed some common
    errors that occur in projects like these. In this chapter, you extend the level
    and apply the final lighting setup. Let’s get started.


    ## Extending the Level


    So far, our level is very basic. You are going to extend it some more. First,
    let’s look at our map’s rough layout from a top-down view (see Figure [14-1](#502922_1_En_14_Chapter.xhtml#Fig1)).


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig1_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig1_HTML.jpg)


    Figure 14-1


    The layout of our room


    As you can see, it is an office-like environment, and some extra assets have been
    used. Once again, you are using the UE4 snapping system. Set the snapping to 10
    units and extend your previously created room to create a hallway, as shown in
    Figure [14-2](#502922_1_En_14_Chapter.xhtml#Fig2).


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig2_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig2_HTML.jpg)


    Figure 14-2


    Placing walls


    Let’s add some windows to the extended hallway, as shown in Figure [14-3](#502922_1_En_14_Chapter.xhtml#Fig3).


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig3_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig3_HTML.jpg)


    Figure 14-3


    Adding windows to our hallway


    Next, add the walls for the other areas, as shown in Figure [14-1](#502922_1_En_14_Chapter.xhtml#Fig1).
    Then, add the decoration items. The interior areas of our scene are dark because
    they don’t have any lighting. To work on these scenes, switch to Unlit mode by
    clicking the Unlit option shown in Figure [14-4](#502922_1_En_14_Chapter.xhtml#Fig4).


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig4_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig4_HTML.jpg)


    Figure 14-4


    Switching to Unlit mode


    In Unlit mode, start adding some lights to your scene. Duplicate the light you
    previously created by holding the `Alt` key and dragging it along any axis. Once
    you duplicate the light, place it under every light model, as shown in Figure
    [14-5](#502922_1_En_14_Chapter.xhtml#Fig5).


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig5_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig5_HTML.jpg)


    Figure 14-5


    Placing light actors


    After this, bake the lights to see the result. If there is darkness in places,
    add more lights to make it as bright as you want. My results are shown in Figures
    [14-6](#502922_1_En_14_Chapter.xhtml#Fig6) and Figure [14-7](#502922_1_En_14_Chapter.xhtml#Fig7).


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig7_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig7_HTML.jpg)


    Figure 14-7


    Office work area


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig6_HTML.jpg](images/502922_1_En_14_Chapter/502922_1_En_14_Fig6_HTML.jpg)


    Figure 14-6


    Reception area view


    If your PC is struggling to handle so many lights, there are alternative solutions.
    Try increasing the intensity of the lights and increasing the `Attenuation Radius`
    value even more. You can also disable `Use Inverse Square Falloff` so that light
    retains its strength over a longer range. This requires some trial and error and
    playing with values. It is something that you can try as a last resort if you
    face serious performance issues.'
