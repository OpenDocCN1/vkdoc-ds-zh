    Bake results


    ### Applying Materials


    Let’s start applying some materials by adding Plastic Matte Pure material from
    the shelf to our mesh (see Figure [8-22](#502922_1_En_8_Chapter.xhtml#Fig22)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig22_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig22_HTML.jpg)


    Figure 8-22


    Plastic Matte Pure


    Next, go to Material Properties and change the settings as shown in Figure [8-23](#502922_1_En_8_Chapter.xhtml#Fig23).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig23_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig23_HTML.jpg)


    Figure 8-23


    Material settings


    Double-click Plastic Material in the Layer Stack and rename it Metal_Default (see
    Figure [8-24](#502922_1_En_8_Chapter.xhtml#Fig24)). This is optional.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig24_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig24_HTML.jpg)


    Figure 8-24


    Renaming our material


    Figure [8-25](#502922_1_En_8_Chapter.xhtml#Fig25) shows that the entire mesh picked
    up the material—even those places that you don’t want to be metal.


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig25_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig25_HTML.jpg)


    Figure 8-25


    Material covering the whole mesh


    Right-click the material and select Add Black Mask (see Figure [8-26](#502922_1_En_8_Chapter.xhtml#Fig26)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig26_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig26_HTML.jpg)


    Figure 8-26


    Add black mask


    You see that the entire model has become untextured. Make sure the mask is selected,
    and then click Polygon Fill and then Mesh Fill. Also, make sure the fill color
    is set to white (see Figure [8-27](#502922_1_En_8_Chapter.xhtml#Fig27)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig27_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig27_HTML.jpg)


    Figure 8-27


    Fill settings


    Click the parts that you want to be metal. The metal material fills those parts
    of the mesh (see Figure [8-28](#502922_1_En_8_Chapter.xhtml#Fig28)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig28_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig28_HTML.jpg)


    Figure 8-28


    Filling metal color


    Next, try filling the white, untextured regions of the mesh with a Fabric material.
    First, add a Fabric material of your choice (in our case, it is the Knitted Sweater
    material with a dark color) and then apply a black mask to the material. Using
    the fill settings shown in Figure [8-27](#502922_1_En_8_Chapter.xhtml#Fig27),
    click the untextured regions. Your results should look similar to Figure [8-29](#502922_1_En_8_Chapter.xhtml#Fig29).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig29_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig29_HTML.jpg)


    Figure 8-29


    Fabric material applied to parts of the mesh


    As you can see, the mesh is way too clean. Let’s add some roughness variation
    to it—specifically, to the metal parts. First, right-click your metal material
    and select Duplicate. Next, right-click the mask of the duplicated material and
    select Clear Mask. Finally, right-click the now clear mask of the duplicated metal
    material and select Add Generator (see Figure [8-30](#502922_1_En_8_Chapter.xhtml#Fig30)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig30_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig30_HTML.jpg)


    Figure 8-30


    Add generator


    Next, click Generator and select the Dirt generator (see Figure [8-31](#502922_1_En_8_Chapter.xhtml#Fig31)).


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig31_HTML.jpg](images/502922_1_En_8_Chapter/502922_1_En_8_Fig31_HTML.jpg)


    Figure 8-31


    Adding Dirt generator'
  trans: '

    ### 贴图制作


    现在我们为沙发添加纹理。将 `Fabric Rough Aligned` 拖放到你的 `Layer Stack`（图层堆栈）中。你应该会看到类似于图 8-13
    所示的效果。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig13_HTML.jpg](img/502922_1_En_8_Fig13_HTML.jpg)


    图 8-13


    `Fabric Rough Aligned`（粗糙织物对齐）


    你的网格看起来应该像图 8-14。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig14_HTML.jpg](img/502922_1_En_8_Fig14_HTML.jpg)


    图 8-14


    应用了`Fabric`（织物）材质的网格


    接下来，进入 `Properties`（属性）窗口，在 `Projection`（投影）菜单中，选择 `Tri-planar`（三平面投影），这样可以确保你的
    UV 接缝被隐藏起来（见图 8-15）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig15_HTML.jpg](img/502922_1_En_8_Fig15_HTML.jpg)


    图 8-15


    `Tri-planar`（三平面）投影


    接着，在 `UV transformations`（UV 变换）下，将 `Scale`（缩放）增加到 `4`。你的结果应该类似于图 8-16。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig16_HTML.jpg](img/502922_1_En_8_Fig16_HTML.jpg)


    图 8-16


    材质已缩放


    然后，在 `Parameters`（参数）下，将颜色改为深蓝色（见图 8-17）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig17_HTML.jpg](img/502922_1_En_8_Fig17_HTML.jpg)


    图 8-17


    更改材质颜色


    你的结果看起来应该类似于图 8-18。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig18_HTML.jpg](img/502922_1_En_8_Fig18_HTML.jpg)


    图 8-18


    最终的沙发


    沙发已准备好导出到 UE4。


    接下来，我们为耳机添加纹理（见图 8-19）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig19_HTML.jpg](img/502922_1_En_8_Fig19_HTML.jpg)


    图 8-19


    重叠的高模和低模


    选择低模，转到 `File ➤ Export`（文件 ➤ 导出），选择 `Obj exporter`（Obj 导出器）。将其导出到方便的位置，并命名为 `Headset_low`。用同样的方式导出高模，但使用名称
    `Headset_high`。之后，打开 `Substance Painter`。


    以导入沙发模型相同的方式导入耳机模型。完成后，转到 `Bake`（烘焙），使用与沙发类似的设置，但这一次，导入 `Headset_high` 模型作为高模（见图
    8-20），并将 `Match`（匹配）保持为默认设置（即，不要将其设置为 `By Mesh Name`（按网格名称））。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig20_HTML.jpg](img/502922_1_En_8_Fig20_HTML.jpg)


    图 8-20


    烘焙设置


    完成此操作后，你应能看到细节已被烘焙到你的网格中。


    你的结果应该看起来像图 8-21。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig21_HTML.jpg](img/502922_1_En_8_Fig21_HTML.jpg)


    图 8-21


    烘焙结果


    ### 应用材质


    让我们开始应用一些材质，从素材库中将 `Plastic Matte Pure`（纯哑光塑料）材质添加到我们的网格中（见图 8-22）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig22_HTML.jpg](img/502922_1_En_8_Fig22_HTML.jpg)


    图 8-22


    `Plastic Matte Pure`（纯哑光塑料）


    接下来，转到 `Material Properties`（材质属性）并更改设置，如图 8-23 所示。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig23_HTML.jpg](img/502922_1_En_8_Fig23_HTML.jpg)


    图 8-23


    材质设置


    在 `Layer Stack`（图层堆栈）中双击 `Plastic Material`（塑料材质）并将其重命名为 `Metal_Default`（见图 8-24）。这是可选项。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig24_HTML.jpg](img/502922_1_En_8_Fig24_HTML.jpg)


    图 8-24


    重命名材质


    图 8-25 显示整个网格都附加上了该材质——甚至连那些你不想让它变成金属的区域也是如此。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig25_HTML.jpg](img/502922_1_En_8_Fig25_HTML.jpg)


    图 8-25


    材质覆盖了整个网格


    右键点击该材质并选择 `Add Black Mask`（添加黑色遮罩）（见图 8-26）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig26_HTML.jpg](img/502922_1_En_8_Fig26_HTML.jpg)


    图 8-26


    添加黑色遮罩


    你会看到整个模型变得没有纹理了。确保选中该遮罩，然后点击 `Polygon Fill`（多边形填充）和 `Mesh Fill`（网格填充）。同时，确保填充颜色设置为白色（见图
    8-27）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig27_HTML.jpg](img/502922_1_En_8_Fig27_HTML.jpg)


    图 8-27


    填充设置


    点击你想要变成金属的部分。金属材质就会填充到网格的那些部分（见图 8-28）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig28_HTML.jpg](img/502922_1_En_8_Fig28_HTML.jpg)


    图 8-28


    填充金属颜色


    接下来，尝试用 `Fabric`（织物）材质填充网格上白色、无纹理的区域。首先，添加一个你选择的 `Fabric`（织物）材质（在本例中，是深色的 `Knitted
    Sweater`（针织毛衣）材质），然后在该材质上应用一个黑色遮罩。使用图 8-27 中所示的填充设置，点击无纹理的区域。你的结果应该类似于图 8-29。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig29_HTML.jpg](img/502922_1_En_8_Fig29_HTML.jpg)


    图 8-29


    织物材质应用于网格的某些部分


    如你所见，网格过于干净了。让我们为其添加一些粗糙度变化——特别是针对金属部分。首先，右键点击你的金属材质并选择 `Duplicate`（复制）。接着，右键点击复制后材质的遮罩并选择
    `Clear Mask`（清除遮罩）。最后，右键点击复数金属材质现已清除的遮罩，并选择 `Add Generator`（添加生成器）（见图 8-30）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig30_HTML.jpg](img/502922_1_En_8_Fig30_HTML.jpg)


    图 8-30


    添加生成器


    接下来，点击 `Generator`（生成器）并选择 `Dirt`（污垢）生成器（见图 8-31）。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig31_HTML.jpg](img/502922_1_En_8_Fig31_HTML.jpg)


    图 8-31


    添加 `Dirt`（污垢）生成器

