    ## 关于作者


    ## 关于技术审校者


    # 1. 面向创意与沉浸式技术的设计


    欢迎踏上创意与沉浸式技术设计的旅程。本书将带你经历在 `Maya` 中创建可视化资产、在 `Substance Painter` 中制作纹理、在 `Unreal
    Engine 4`（`UE4`）中设置场景、创建材质以及最终渲染场景的全过程。


    本书面向对 3D 工具有非常基础了解，并希望深入了解高级主题的初学者和业余爱好者。我们将逐步讲解资产创建流程的每一个步骤，包括建模、拆解 UV 和导入。


    最后，你将创建一个简单的建筑场景，可以用作你的作品集。目标是展示你创建的资产。


    ## AR、VR 与新兴技术


    随着价格亲民的 GPU 以及利用这些技术强大功能和沉浸感的应用程序的激增，增强现实（AR）和虚拟现实（VR）变得非常流行。AR 和 VR 在医学、军事模拟、教育、建筑可视化和游戏等领域都有应用。AR
    和 VR 是两种不同类型的技术。增强现实通过使用智能手机等设备，将数字元素投射到现实世界中。虚拟现实则是一种完全沉浸式的体验，通过使用 VR 头戴设备，将用户完全包围在一个数字世界中。图
    1-1 显示了一个视觉示例。


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig1_HTML.jpg](img/502922_1_En_1_Fig1_HTML.jpg)


    **图 1-1** 沉浸式技术的视觉呈现（来源：[*https://pixabay.com/*](https://pixabay.com/)）


    ## 用于娱乐的 VR


    VR 不仅限于电子游戏，还在我们日常生活的其他领域崭露头角。虽然目前其应用步伐和范围可能有限，但不可否认的是，VR 很快将成为一种非常实用和有用的设备——用于虚拟导览和教育。图
    1-2 是一个数字元素如何融入娱乐领域的视觉示例。


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig2_HTML.jpg](img/502922_1_En_1_Fig2_HTML.jpg)


    **图 1-2** VR 融入娱乐领域的呈现（来源：[*https://pixabay.com/*](https://pixabay.com/)）


    ## 用于数字建筑的 VR


    随着技术的快速进步，企业有机会利用其潜力。许多公司正在投资开发 VR 应用和设备。这涵盖了从广告到购物等日常活动的新体验方式。VR 将人们带入一个数字世界，如图
    1-3 所示。


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig3_HTML.jpg](img/502922_1_En_1_Fig3_HTML.jpg)


    **图 1-3** VR 让人们沉浸在数字世界中（来源：[*https://pixabay.com/*](https://pixabay.com/)）


    它允许用户在一栋房子尚未建成或一个大型主题公园尚未到访之前进行探索。这有许多潜在的好处。在房子建造前进行可视化，对买家来说是一个巨大的优势。它能让客户很好地了解他们正在购买什么，使他们能够在设计师和建筑商建造房屋之前，在规划阶段决定添加或移除哪些内容。这在建造涉及大量工作的大型房屋时尤其有用，并且有巨大的改进空间。图
    1-4 展示了历史建筑的数字化建造。


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig4_HTML.jpg](img/502922_1_En_1_Fig4_HTML.jpg)


    **图 1-4** 历史建筑的数字化重建（来源：[*https://pixabay.com/*](https://pixabay.com/)）


    ## 用于模拟和训练的 VR


    VR 还有其他有用的功能，例如在军事模拟中训练士兵应对不同的战斗场景，以及在航空训练中提供沉浸式的飞行模拟体验。你可以理解为什么有抱负的 CGI 程序员必须在
    AR 和 VR 技术上做大量的研究。这不仅为职业打开了大门，还能让你及时了解最新的技术发展。


    军方使用 VR 来训练士兵应对那些难以通过传统方法构建的场景。通过使用沉浸式技术，军队可以有效地训练士兵处理战场上的各种情况。具有逼真爆炸效果和武器模拟的战斗场景可以产生类似于真实遭遇的压力，这有助于为真实的战斗场景做好准备。图
    1-5 展示了一个军事模拟场景。


    ![../images/502922_1_En_1_Chapter/502922_1_En_1_Fig5_HTML.jpg](img/502922_1_En_1_Fig5_HTML.jpg)


    **图 1-5** 军事模拟训练的呈现（来源：[*https://pixabay.com/*](https://pixabay.com/)）


