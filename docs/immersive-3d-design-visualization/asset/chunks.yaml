    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig21_HTML.jpg](img/502922_1_En_7_Fig21_HTML.jpg)


    **图 7-21** 烘焙结果 3


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig20_HTML.jpg](img/502922_1_En_7_Fig20_HTML.jpg)


    **图 7-20** 烘焙结果 2


    ![../images/502922_1_En_7_Chapter/502922_1_En_7_Fig19_HTML.jpg](img/502922_1_En_7_Fig19_HTML.jpg)


    **图 7-19** 烘焙结果 1


    调整所有其他资源的光照贴图设置，你就能获得良好的效果。在下一章中，你将学习 PBR 集成纹理工作流程。


    # 8. PBR 集成纹理


    在本章中，你将了解 PBR 集成纹理工作流程。有多种工具可用于辅助你为资源添加纹理。在本章中，我们将使用 Quixel Megascans 和 Substance
    Painter。首先简单介绍一下这两款软件。


    ## Substance Painter


    Substance Painter 是一款行业标准的纹理绘制工具，被 AAA 级和独立工作室广泛使用。它非常用户友好且易于使用。庞大的社区不断提供免费资源，供你在项目中使用。还有一个名为
    Substance Source 的高级资源库，如果你订阅了 Substance Suite，就可以访问其中经过精选的高质量资源库。


    让我们来看看 Substance Painter 的基本控制和界面。本书使用的是 2019.3.2 版本。当你首次启动 Substance Painter
    时，你的窗口看起来类似于图 8-1。


    ![../images/502922_1_En_8_Chapter/502922_1_En_8_Fig1_HTML.jpg](img/502922_1_En_8_Fig1_HTML.jpg)


    **图 8-1** Substance Painter 界面


    屏幕底部是*资源架*，它允许你访问纹理处理过程中所需的各种资源。**属性**窗口用于更改和调整图层、笔刷、材质等。**图层**面板允许你添加、编辑和管理图层。Substance
    Painter 是一个基于图层的纹理绘制程序；因此，你会经常与图层打交道。**纹理集设置**面板允许你管理与纹理集相关的属性。


    现在让我们讨论 Substance Painter 的控制方式。按下 `Alt + 鼠标左键` 可旋转视图。按下 `Alt + 鼠标中键` 可平移视图。按下
    `Alt + 鼠标右键` 可缩放视图。表 8-1 列出了许多快捷键及其用途。


    **表 8-1** Substance Painter 快捷键


    | 快捷键 | 作用 |

    | :--- | :--- |

    | `Alt + 鼠标左键` | 旋转视图 |

    | `Alt + 鼠标中键` | 平移视图 |

    | `Alt + 鼠标右键` | 缩放视图 |

    | `Alt + Shift + 鼠标左键` | 旋转相机并吸附 |

    | `F` | 将相机居中到网格体 |

    | `F5` | 切换到透视相机 |

    | `F6` | 切换到正交相机 |

    | `鼠标左键` | 绘制 / 使用工具 |

    | `]` | 增大工具尺寸 |

    | `[` | 减小工具尺寸 |

    | `F9` | 绘制模式 |

    | `F10` | 渲染模式 |

    | `Shift + 鼠标左键` | 绘制直线 |

    | `Ctrl + Shift + 鼠标左键` | 绘制直线并吸附 |

    | `B` | 切换显示的网格贴图 |

    | `M` | 材质模式 |

    | `C` | 切换显示的通道 |

