  trans: "\n## 结论\n\n至此，您已完成本书。希望您从中获取的信息有所助益。从头创建一个完整场景是一项相当庞大的工程，需要投入大量时间和耐心才能完成。\n\
    \n以下是处理类似项目时的一些额外实用技巧。\n\n- **收集参考图。** 参考图对于创作任何事物都非常有用且重要。请确保所有内容都有参考图像。\n- **始终正确命名资源。**\
    \ `UE4` 使用特定的命名规范来标识资源及其类型，这在多人协作同一项目时非常方便。`SM_` 用于静态网格体，后跟资源名称。`M_` 或 `MM_` 用于主材质。`MI_`\
    \ 或 `_Inst` 用于材质实例。`MF_` 用于材质函数。`BP_` 用于蓝图类和对象。请将这些规范作为您资源的命名约定。\n- **制定计划/布局。**\
    \ 切勿盲目行事。先在 `Photoshop` 等软件应用程序中为您的关卡创建粗略布局。甚至手绘也可以。\n- **从简单开始。** 从简单的墙壁和地板开始，以检验您的布局是否可行。在深入细节之前，先进行白模布局非常重要。\n\
    - **分层添加细节。** 添加细节时，请逐层进行。从简单的布局开始，然后添加较大的细节，例如家具。之后，再添加较小的细节，例如装饰品。\n- **始终为存储资源创建文件夹结构。**\
    \ 当您开始一个新项目时，请立即创建以下文件夹：`Assets`、`Blueprints` 和 `Maps`。在 `Assets` 文件夹内，添加 `Master_Materials`、`Material_Instances`、`Material_Functions`、`Meshes`\
    \ 和 `Textures`。在 `Blueprints` 文件夹内，添加类似 `Tools`、`Gameplay` 等子文件夹。这将使您能够妥善管理和组织项目。\n\
    \n资源可以在作品集中以多种方式使用。在建筑可视化中，通常对多边形数量或性能没有限制，因为场景完全是为了以最高视觉保真度展示您的资源而设计的。在这些情况下，您可以自由创建任何您想要的内容，无需担心光照烘焙或多边形问题。\n\
    \n当然，也存在一些限制。您不应将完全细分的模型导入 `UE4`，因为这会使引擎完全过载。但是，如果您拥有性能相当强大的系统，`UE4` 可以轻松处理场景中数十万个多边形，具体取决于您所使用的材质的复杂度。\n\
    \n最好对您的资源进行优化，因为这能使您的技能迁移到内存预算严格的游戏开发和 VR 领域。请确保您的技能具有可扩展性。\n\n这些场景可以轻松用作 Archviz（建筑可视化）场景的作品集，但要想创建更多交互，充分了解\
    \ `Blueprints` 至关重要。`Blueprints` 是一个完全不同的主题，需要专门的书籍来讲解。\n\n游戏关卡设计是一个很好的环境，可以用作展示您所有技能的作品集。如果规划得当，您可以使用非常少量的可平铺资源来创建令人惊叹的场景。\n\
