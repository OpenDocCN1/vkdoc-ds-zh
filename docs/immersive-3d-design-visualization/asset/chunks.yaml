- fmt: '### Adding Details


    Now let’s add more details to our headset. Select all the faces on the cylinder
    and extrude them, as shown in Figure [3-53](#502922_1_En_3_Chapter.xhtml#Fig53).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig53_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig53_HTML.jpg)


    Figure 3-53: Extruding the faces on the cylinder


    Extrude them again in a similar way. Press the `R` key to switch to the Scale
    tool. Use the central control point or the red square gizmo (both have the same
    effect), and then scale it down so that the shape is similar to what’s shown in
    Figure [3-54](#502922_1_En_3_Chapter.xhtml#Fig54).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig54_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig54_HTML.jpg)


    Figure 3-54: Scaling down our shape using the Scale tool


    Go to the other side of the shape and select the highlighted edges, which are
    the cylinder’s border edges (see Figure [3-55](#502922_1_En_3_Chapter.xhtml#Fig55)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig55_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig55_HTML.jpg)


    Figure 3-55: Select these faces


    Duplicate these faces by pressing `Shift+Right-click` and selecting `Duplicate
    faces` in the menu. Scale down the faces so that they are similar to Figure [3-56](#502922_1_En_3_Chapter.xhtml#Fig56).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig56_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig56_HTML.jpg)


    Figure 3-56: Duplicate and scale the faces


    Next, select the shape’s border edge loop and extrude by holding the `Shift` key
    and using the Move manipulator to extrude the edges outward. Scale the edges outward
    so that you have a shape similar to Figure [3-57](#502922_1_En_3_Chapter.xhtml#Fig57).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig57_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig57_HTML.jpg)


    Figure 3-57: Extruding and shaping the edges


    Extrude the edges outward once again in a straight line. After that, extrude and
    scale them inward so that you have a shape similar to what is shown in Figure
    [3-58](#502922_1_En_3_Chapter.xhtml#Fig58). This is the *earpad*.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig58_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig58_HTML.jpg)


    Figure 3-58: Shape so far


    The faces are black because their normals are facing the wrong direction. Let’s
    fix that before proceeding. Select all the faces, click the `Mesh Display` tab
    on the menu bar, and select `Reverse` in the menu (see Figure [3-59](#502922_1_En_3_Chapter.xhtml#Fig59)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig59_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig59_HTML.jpg)


    Figure 3-59: Reversing normals


    Your mesh should now have the correct shading, and only the interior faces should
    be black.


    Let’s switch to Object mode for a moment. Click the `Isolate Selection` button
    (see Figure [3-60](#502922_1_En_3_Chapter.xhtml#Fig60)) to isolate the earpad
    (or press `Shift+I`, which is a shortcut).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig60_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig60_HTML.jpg)


    Figure 3-60: Isolate Selection button


    Now that the earpad is isolated, you can work on it without any other mesh in
    the way. Select and delete the backfaces of the earpad (see Figure [3-61](#502922_1_En_3_Chapter.xhtml#Fig61)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig61_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig61_HTML.jpg)


    Figure 3-61: Select and delete these faces


    Click the `Isolate Selection` button once again to reveal everything else.


    Now, let’s continue working on the earpad. Extrude, scale, and create a shape
    like the one shown in Figure [3-62](#502922_1_En_3_Chapter.xhtml#Fig62).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig62_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig62_HTML.jpg)


    Figure 3-62: Earpad result so far


    Select the very internal edge toward the center of the object. Extrude once again
    by holding the `Shift` key and using the Scale tool to extrude and scale down
    at the same time. This allows you to close the hole in the center of the earpad.
    After that, press `Shift+Right-click` and select `Merge/Collapse Edges` (see Figure
    [3-63](#502922_1_En_3_Chapter.xhtml#Fig63)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig63_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig63_HTML.jpg)


    Figure 3-63: Merge/Collapse Edges


    From the new menu, select `Merge Edges To Center` (see Figure [3-64](#502922_1_En_3_Chapter.xhtml#Fig64)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig64_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig64_HTML.jpg)


    Figure 3-64: Merge Edges To Center


    The edges merge at a central point. Triangles form where they merge. You can ignore
    that for now or delete alternating edges to make them quads—whichever you prefer.
    Game engines automatically triangulate meshes anyway, and for a flat hard surface,
    you can safely use triangles if they do not cause any issues with modeling. In
    our case, you can simply ignore them and move forward.


    Add another edge loop as shown (dotted in green) in Figure [3-65](#502922_1_En_3_Chapter.xhtml#Fig65)
    by pressing `Shift+Right-click` and selecting `Insert Edge Loop Tool` in the menu.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig65_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig65_HTML.jpg)


    Figure 3-65: Adding another edge loop


    Next, select the entire loop and move it out slightly to give the entire region
    a nice curve (see Figure [3-66](#502922_1_En_3_Chapter.xhtml#Fig66)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig66_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig66_HTML.jpg)


    Figure 3-66: Giving our shape some roundness


    Next, switch to face mode and press `Ctrl+Shift+A` to select all the faces and
    scale them upward so that the earpad is large enough to appear realistic; right
    now, it’s too small. See Figure [3-67](#502922_1_En_3_Chapter.xhtml#Fig67) for
    reference.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig67_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig67_HTML.jpg)


    Figure 3-67: Scaling and adjusting the size


    Now the size should look right, but you can adjust according to your preferences.
    Let’s mirror it to the other side of the headset so that you have earpads on both
    sides. To do that, click the `Mirror` button on the toolbar. Your results should
    look similar to Figure [3-68](#502922_1_En_3_Chapter.xhtml#Fig68).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig68_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig68_HTML.jpg)


    Figure 3-68: Result of the mirror'
  raw: '### Adding Details


    Now let’s add more details to our headset. Select all the faces on the cylinder
    and extrude them, as shown in Figure [3-53](#502922_1_En_3_Chapter.xhtml#Fig53).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig53_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig53_HTML.jpg)


    Figure 3-53


    Extruding the faces on the cylinder


    Extrude them again in a similar way. Press the R key to switch to the Scale tool.
    Use the central control point or the red square gizmo (both have the same effect),
    and then scale it down so that the shape is similar to what’s shown in Figure
    [3-54](#502922_1_En_3_Chapter.xhtml#Fig54).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig54_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig54_HTML.jpg)


    Figure 3-54


    Scaling down our shape using the Scale tool


    Go to the other side of the shape and select the highlighted edges, which are
    the cylinder’s border edges (see Figure [3-55](#502922_1_En_3_Chapter.xhtml#Fig55)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig55_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig55_HTML.jpg)


    Figure 3-55


    Select these faces


    Duplicate these faces by pressing Shift+Right-click and selecting Duplicate faces
    in the menu. Scale down the faces so that they are similar to Figure [3-56](#502922_1_En_3_Chapter.xhtml#Fig56).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig56_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig56_HTML.jpg)


    Figure 3-56


    Duplicate and scale the faces


    Next, select the shape’s border edge loop and extrude by holding the Shift key
    and using the Move manipulator to extrude the edges outward. Scale the edges outward
    so that you have a shape similar to Figure [3-57](#502922_1_En_3_Chapter.xhtml#Fig57).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig57_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig57_HTML.jpg)


    Figure 3-57


    Extruding and shaping the edges


    Extrude the edges outward once again in a straight line. After that, extrude and
    scale them inward so that you have a shape similar to what is shown in Figure
    [3-58](#502922_1_En_3_Chapter.xhtml#Fig58). This is the *earpad*.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig58_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig58_HTML.jpg)


    Figure 3-58


    Shape so far


    The faces are black because their normals are facing the wrong direction. Let’s
    fix that before proceeding. Select all the faces, click the Mesh Display tab on
    the menu bar, and select Reverse in the menu (see Figure [3-59](#502922_1_En_3_Chapter.xhtml#Fig59)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig59_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig59_HTML.jpg)


    Figure 3-59


    Reversing normals


    Your mesh should now have the correct shading, and only the interior faces should
    be black.


    Let’s switch to Object mode for a moment. Click the Isolate Selection button (see
    Figure [3-60](#502922_1_En_3_Chapter.xhtml#Fig60)) to isolate the earpad (or press
    Shift+I, which is a shortcut).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig60_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig60_HTML.jpg)


    Figure 3-60


    Isolate Selection button


    Now that the earpad is isolated, you can work on it without any other mesh in
    the way. Select and delete the backfaces of the earpad (see Figure [3-61](#502922_1_En_3_Chapter.xhtml#Fig61)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig61_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig61_HTML.jpg)


    Figure 3-61


    Select and delete these faces


    Click the Isolate Selection button once again to reveal everything else.


    Now, let’s continue working on the earpad. Extrude, scale, and create a shape
    like the one shown in Figure [3-62](#502922_1_En_3_Chapter.xhtml#Fig62).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig62_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig62_HTML.jpg)


    Figure 3-62


    Earpad result so far


    Select the very internal edge toward the center of the object. Extrude once again
    by holding the Shift key and using the Scale tool to extrude and scale down at
    the same time. This allows you close the hole in the center of the earpad. After
    that, press Shift+Right-click and select Merge/Collapse Edges (see Figure [3-63](#502922_1_En_3_Chapter.xhtml#Fig63)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig63_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig63_HTML.jpg)


    Figure 3-63


    Merge/Collapse Edges


    From the new menu, select Merge Edges To Center (see Figure [3-64](#502922_1_En_3_Chapter.xhtml#Fig64)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig64_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig64_HTML.jpg)


    Figure 3-64


    Merge Edges To Center


    The edges merge at a central point. Triangles form where they merge. You can ignore
    that for now or delete alternating edges to make them quads—whichever you prefer.
    Game engines automatically triangulate meshes anyway, and for a flat hard surface,
    you can safely use triangles if they do not cause any issues with modeling. In
    our case, you can simply ignore them and move forward.


    Add another edge loop as shown (dotted in green) in Figure [3-65](#502922_1_En_3_Chapter.xhtml#Fig65)
    by pressing Shift+Right-click and selecting Insert Edge Loop Tool in the menu.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig65_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig65_HTML.jpg)


    Figure 3-65


    Adding another edge loop


    Next, select the entire loop and move it out slightly to give the entire region
    a nice curve (see Figure [3-66](#502922_1_En_3_Chapter.xhtml#Fig66)).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig66_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig66_HTML.jpg)


    Figure 3-66


    Giving our shape some roundness


    Next, switch to face mode and press Ctrl+Shift+A to select all the faces and scale
    them upward so that the earpad is large enough to appear realistic; right now,
    it’s too small. See Figure [3-67](#502922_1_En_3_Chapter.xhtml#Fig67) for reference.


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig67_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig67_HTML.jpg)


    Figure 3-67


    Scaling and adjusting the size


    Now the size should look right, but you can adjust according to your preferences.
    Let’s mirror it to the other side of the headset so that you have earpads on both
    sides. To do that, click the Mirror button on the toolbar. Your results should
    look similar to Figure [3-68](#502922_1_En_3_Chapter.xhtml#Fig68).


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig68_HTML.jpg](images/502922_1_En_3_Chapter/502922_1_En_3_Fig68_HTML.jpg)


    Figure 3-68


    Result of the mirror'
  trans: '

    ### 添加细节


    现在让我们为耳机添加更多细节。选择圆柱体上的所有面并进行挤出，如图 3-53 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig53_HTML.jpg](img/502922_1_En_3_Fig53_HTML.jpg)


    图 3-53：挤出色圆柱体上的面


    以类似方式再次挤出它们。按下 `R` 键切换到缩放工具。使用中心控制点或红色方块小控件（两者效果相同），然后将其缩小，使形状类似于图 3-54 所示。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig54_HTML.jpg](img/502922_1_En_3_Fig54_HTML.jpg)


    图 3-54：使用缩放工具缩小形状


    转到形状的另一侧，选择高亮显示的边缘，即圆柱体的边界边缘（见图 3-55）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig55_HTML.jpg](img/502922_1_En_3_Fig55_HTML.jpg)


    图 3-55：选择这些面


    通过按 `Shift+右键单击` 并在菜单中选择 `Duplicate faces` 来复制这些面。缩小这些面，使其类似于图 3-56。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig56_HTML.jpg](img/502922_1_En_3_Fig56_HTML.jpg)


    图 3-56：复制并缩放面


    接下来，选择形状的边界边缘环，并按住 `Shift` 键使用移动操纵器向外挤出边缘。向外缩放边缘，使形状类似于图 3-57。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig57_HTML.jpg](img/502922_1_En_3_Fig57_HTML.jpg)


    图 3-57：挤出并塑形边缘


    再次沿直线向外挤出边缘。之后，向内挤出并缩放它们，使形状类似于图 3-58 所示。这就是*耳罩*。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig58_HTML.jpg](img/502922_1_En_3_Fig58_HTML.jpg)


    图 3-58：当前形状


    面是黑色的，因为它们的法线方向错误。让我们在继续之前修复这个问题。选择所有面，单击菜单栏上的 `Mesh Display` 选项卡，然后在菜单中选择 `Reverse`（见图
    3-59）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig59_HTML.jpg](img/502922_1_En_3_Fig59_HTML.jpg)


    图 3-59：反转法线


    现在你的网格应该具有正确的着色，只有内部面是黑色的。


    让我们暂时切换到对象模式。单击 `Isolate Selection` 按钮（见图 3-60）以隔离耳罩（或按 `Shift+I`，这是一个快捷键）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig60_HTML.jpg](img/502922_1_En_3_Fig60_HTML.jpg)


    图 3-60：隔离选择按钮


    现在耳罩已被隔离，你可以在没有其他网格干扰的情况下处理它。选择并删除耳罩的背面（见图 3-61）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig61_HTML.jpg](img/502922_1_En_3_Fig61_HTML.jpg)


    图 3-61：选择并删除这些面


    再次单击 `Isolate Selection` 按钮以显示所有其他物体。


    现在，让我们继续处理耳罩。挤出、缩放，并创建如图 3-62 所示的形状。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig62_HTML.jpg](img/502922_1_En_3_Fig62_HTML.jpg)


    图 3-62：耳罩当前结果


    选择朝向物体中心的最内侧边缘。再次通过按住 `Shift` 键并使用缩放工具同时进行挤出和缩小。这使你能够封闭耳罩中心的孔洞。之后，按 `Shift+右键单击`
    并选择 `Merge/Collapse Edges`（见图 3-63）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig63_HTML.jpg](img/502922_1_En_3_Fig63_HTML.jpg)


    图 3-63：合并/塌陷边缘


    在新菜单中，选择 `Merge Edges To Center`（见图 3-64）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig64_HTML.jpg](img/502922_1_En_3_Fig64_HTML.jpg)


    图 3-64：将边缘合并到中心


    边缘在一个中心点合并。在合并处会形成三角形。你可以暂时忽略这一点，或者删除交替的边缘使其变成四边形——随你喜欢。游戏引擎无论如何都会自动三角化网格，而对于平坦的硬表面，只要三角形不会引起建模问题，就可以安全地使用它们。在我们的案例中，你可以直接忽略它们并继续前进。


    按 `Shift+右键单击` 并在菜单中选择 `Insert Edge Loop Tool`，添加另一个如图 3-65 所示（绿色虚线）的边缘环。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig65_HTML.jpg](img/502922_1_En_3_Fig65_HTML.jpg)


    图 3-65：添加另一个边缘环


    接下来，选择整个环并将其稍微向外移动，使整个区域具有漂亮的曲线（见图 3-66）。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig66_HTML.jpg](img/502922_1_En_3_Fig66_HTML.jpg)


    图 3-66：为形状添加一些弧度


    接下来，切换到面模式，按 `Ctrl+Shift+A` 选择所有面，并向上缩放它们，使耳罩足够大，看起来更真实；目前它太小了。参见图 3-67 作为参考。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig67_HTML.jpg](img/502922_1_En_3_Fig67_HTML.jpg)


    图 3-67：缩放并调整大小


    现在大小应该合适了，但你可以根据自己的喜好调整。让我们将其镜像到耳机的另一侧，这样两侧都有耳罩。为此，单击工具栏上的 `Mirror` 按钮。你的结果应类似于图
    3-68。


    ![../images/502922_1_En_3_Chapter/502922_1_En_3_Fig68_HTML.jpg](img/502922_1_En_3_Fig68_HTML.jpg)


    图 3-68：镜像的结果

