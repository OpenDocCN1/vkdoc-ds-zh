  trans: '

    # 照明问题


    在使用模块化资源时，经常会遇到如图 13-1 所示的照明问题。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig1_HTML.jpg](img/502922_1_En_13_Fig1_HTML.jpg)


    图 13-1


    光线泄漏


    你可以看到有一小束光线从墙壁中漏出，这看起来是错误的。发生此类情况通常是因为网格体中的某处存在缝隙或孔洞，导致整体未形成封闭水密结构。如果仔细检查网格体四周，您可能会看到类似图
    13-2 所示的情况。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig2_HTML.jpg](img/502922_1_En_13_Fig2_HTML.jpg)


    图 13-2


    网格体间的缝隙


    但如果从另一侧观察，却看不到缝隙，如图 13-3 所示。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig3_HTML.jpg](img/502922_1_En_13_Fig3_HTML.jpg)


    图 13-3


    网格体上无可见缝隙


    这是由于*背面剔除*造成的，这意味着网格体面只有一侧被渲染，另一侧被*剔除*，即未渲染。你可以直接看穿它，因此场景中的任何光线都会穿过被剔除的面。


    此情况的修复方法非常简单，只需将网格体重叠以封闭缝隙即可，如图 13-4 所示。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig4_HTML.jpg](img/502922_1_En_13_Fig4_HTML.jpg)


    图 13-4


    重叠网格体


    这会导致重叠区域出现*Z-fighting*现象，即重叠面会闪烁，因为 UE4 不确定哪个面应渲染在另一个面之上。但在我们的案例中，这可以接受，因为这种情况发生在玩家看不到的区域。然而，如果此现象发生在可见区域，则需通过仔细移动网格体以避免重叠来解决。


    ## 阴影接缝问题


    我们来看看阴影接缝问题及其解决方法。在上一章中，你调整了 Lightmass 设置以减少阴影接缝效果。图 13-5 再次展示了这些设置。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig5_HTML.jpg](img/502922_1_En_13_Fig5_HTML.jpg)


    图 13-5


    Lightmass 设置


    使用这些设置构建光照可以减少出现的光照接缝数量。但如果这不能完全解决问题，我们还有一个工具可用。选择存在阴影接缝的墙壁，如图 13-6 所示。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig6_HTML.jpg](img/502922_1_En_13_Fig6_HTML.jpg)


    图 13-6


    选择有接缝问题的墙壁


    接着，右键点击任意选中的墙壁，打开资源操作菜单。在此菜单中选择“合并 Actor”，如图 13-7 所示。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig7_HTML.jpg](img/502922_1_En_13_Fig7_HTML.jpg)


    图 13-7


    合并 Actor


    在“合并 Actor”设置面板中，找到“网格体替换方法”，选择“移除原有 Actor”，然后点击“合并 Actor”按钮（见图 13-8）。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig8_HTML.jpg](img/502922_1_En_13_Fig8_HTML.jpg)


    图 13-8


    合并 Actor 设置


    完成后，重新烘焙光照。阴影接缝应该不再出现。合并 Actor 不仅能消除此类问题，还能优化场景。图 13-9 是墙壁的最终效果。


    ![../images/502922_1_En_13_Chapter/502922_1_En_13_Fig9_HTML.jpg](img/502922_1_En_13_Fig9_HTML.jpg)


    图 13-9


    阴影接缝已消除


    本章内容到此结束。希望你现在能够解决场景中的这些常见问题。


    下一章，我们将扩展并完善场景。


    # 14. 设计可视化综合项目：美学提升


    你已经创建了一个简单关卡，设置了基础照明，并修复了此类项目中常见的一些错误。在本章中，你将扩展关卡并应用最终的光照设置。让我们开始吧。


    ## 扩展关卡


    到目前为止，我们的关卡还非常基础。我们将对其进行进一步扩展。首先，从俯视角度观察地图的大致布局（见图 14-1）。


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig1_HTML.jpg](img/502922_1_En_14_Fig1_HTML.jpg)


    图 14-1


    房间布局


    如你所见，这是一个类似办公室的环境，并且使用了一些额外的资源。我们再次使用 UE4 的吸附系统。将吸附设置为 10 个单位，然后扩展之前创建的房间以形成一条走廊，如图
    14-2 所示。


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig2_HTML.jpg](img/502922_1_En_14_Fig2_HTML.jpg)


    图 14-2


    放置墙壁


    让我们为扩展出的走廊添加一些窗户，如图 14-3 所示。


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig3_HTML.jpg](img/502922_1_En_14_Fig3_HTML.jpg)


    图 14-3


    为走廊添加窗户


    接下来，添加其他区域的墙壁，如图 14-1 所示。然后，添加装饰物品。我们场景的内部区域因为没有照明而显得昏暗。为了在这些场景中工作，请点击图 14-4 中所示的“无光照”选项，切换到无光照模式。


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig4_HTML.jpg](img/502922_1_En_14_Fig4_HTML.jpg)


    图 14-4


    切换到无光照模式


    在无光照模式下，开始为场景添加一些灯光。按住`Alt`键并沿任意轴拖动之前创建的光源以复制它。复制光源后，将其放置在每一个灯光模型下方，如图 14-5 所示。


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig5_HTML.jpg](img/502922_1_En_14_Fig5_HTML.jpg)


    图 14-5


    放置灯光 Actor


    之后，烘焙光照以查看结果。如果某些地方过暗，则添加更多灯光以达到你想要的亮度。我的结果如图 14-6 和图 14-7 所示。


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig6_HTML.jpg](img/502922_1_En_14_Fig6_HTML.jpg)


    图 14-6


    接待区视图


    ![../images/502922_1_En_14_Chapter/502922_1_En_14_Fig7_HTML.jpg](img/502922_1_En_14_Fig7_HTML.jpg)


    图 14-7


    办公工作区


    如果你的电脑难以处理如此多的灯光，还有替代方案。尝试增加灯光强度并进一步提高`衰减半径`值。你还可以禁用`使用平方反比衰减`，这样灯光可以在更远距离保持强度。这需要一些试错和参数调整。作为最后的手段，如果你遇到严重的性能问题，可以尝试此方法。

