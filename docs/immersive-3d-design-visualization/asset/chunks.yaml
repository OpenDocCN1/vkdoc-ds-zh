    接下来，右键添加 `Constant3Vector`，并将其同样转换为参数。命名为 `Tint`。将其连接到 `Multiply` 节点的底部输入引脚。你的设置应类似于图
    9-13。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig13_HTML.jpg](img/502922_1_En_9_Fig13_HTML.jpg)


    图 9-13 当前设置


    点击 `Tint` 参数节点。在**细节**面板中，将其默认值设置为纯白色（见图 9-14）。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig14_HTML.jpg](img/502922_1_En_9_Fig14_HTML.jpg)


    图 9-14 设置色调参数的默认值


    将法线贴图连接到主材质，如图 9-15 所示。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig15_HTML.jpg](img/502922_1_En_9_Fig15_HTML.jpg)


    图 9-15 连接法线贴图


    对于图 9-15 中的两张贴图，你需要使用纹理贴图中所有三个通道存储的数据。但对于下一张 ORM 贴图，你需要使用各个纹理通道（即**红色**、**绿色**和**蓝色**通道）中存储的数据。为此，连接方式如下：


    1.  将红色（`R`）引脚连接到材质节点的**环境光遮蔽**引脚。

    2.  将绿色（`G`）引脚连接到材质节点的**粗糙度**引脚。

    3.  将蓝色（`B`）引脚连接到材质节点的**金属感**引脚。


    你的设置应类似于图 9-16。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig16_HTML.jpg](img/502922_1_En_9_Fig16_HTML.jpg)


    图 9-16 ORM 纹理的设置


    你可以将 ORM 纹理的绿色通道乘以一个参数，以控制材质的粗糙度。只需创建一个名为 `Roughness` 的参数，并添加一个 `Multiply` 节点。按照图
    9-17 所示的方式连接它们。操作方法是：从新 `Multiply` 节点上的 `B` 节点拖出连线并搜索 `param`，然后选择**标量**参数并将其重命名为
    `Roughness`。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig17_HTML.jpg](img/502922_1_En_9_Fig17_HTML.jpg)


    图 9-17 控制粗糙度的设置


    ## 将材质应用于网格体


    保存材质后，即可将其应用于网格体。将材质从**内容浏览器**拖放到场景中的资源上。材质应该会像你在 **Substance Painter** 中制作的那样带有纹理。最终结果取决于你创建的内容，但图
    9-18 显示了我的场景结果。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig18_HTML.jpg](img/502922_1_En_9_Fig18_HTML.jpg)


    图 9-18 应用材质的结果


    在进行建筑设计可视化时，你可能需要使用一个资源与其他资源协同作用，以创建完整的场景。图 9-19 至 9-22 是使用放置在可视化室内设计场景中的三个沙发副本进行渲染的预览图。


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig22_HTML.jpg](img/502922_1_En_9_Fig22_HTML.jpg)


    图 9-22 远景 4 场景


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig21_HTML.jpg](img/502922_1_En_9_Fig21_HTML.jpg)


    图 9-21 远景 3 场景


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig20_HTML.jpg](img/502922_1_En_9_Fig20_HTML.jpg)


    图 9-20 远景 2 场景


    ![../images/502922_1_En_9_Chapter/502922_1_En_9_Fig19_HTML.jpg](img/502922_1_En_9_Fig19_HTML.jpg)


    图 9-19 远景 1 场景


    本章以这些结果作为结尾。


    在下一章中，你将创建更多材质，并处理主材质和实例化材质。


    # 10. 实时自发光材质


    你已经创建了标准材质。现在让我们学习如何创建实时自发光材质。在本章中，你还会创建实例化材质并了解其重要性。

