  \ `DetectRequest()` 函数来发起请求，并返回 `detect_entire_series()` 的结果。\n\n```python\ndef\
  \ detect_outliers_azure(client, df):\n    sensitivity = 55\n    max_anomaly_ratio\
  \ = 0.25\n    series = []\n    for index, row in df.iterrows():\n        series.append(TimeSeriesPoint(timestamp\
  \ = dt.datetime.strftime(row[0], '%Y-%m-%dT%H:%M:%SZ'), value = row[1]))\n    request\
  \ = DetectRequest(series=series, custom_interval=5, sensitivity=sensitivity, max_anomaly_ratio=max_anomaly_ratio)\n\
  \    return client.detect_entire_series(request)\n```\n*代码清单 19-4 — 在 Python 中调用异常检测器服务*\n\
