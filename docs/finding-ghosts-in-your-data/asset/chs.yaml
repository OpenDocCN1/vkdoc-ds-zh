  \ 14-3 中，我们就能看到游戏驿站公司的股价从 2021 年 1 月到撰写本文时的过去 18 个月里剧烈波动。\n\n![](img/521828_1_En_14_Fig3_HTML.png)\n\
  \n一个折线图绘制了游戏驿站公司股价随时间的波动情况。估计值为 (2017, 25), (2021, 325), (2022, 140)。\n\n图 14-3\n\
  \n游戏驿站公司的股价虽未真正“一飞冲天”，但确实增长了一个数量级，并且，对我们的目的而言重要的是，它经历了大幅波动。\n\n为了纪念这只股票的疯狂之旅，另外两个集成测试考察了\
  \ GME 在 2021 年 1 月 6 日至 2021 年 2 月 2 日期间的收盘价。在这段时间内，我们注意到在敏感度评分为 60 的情况下，存在五个独立的变化点。\n\
  \n\n\n### 网站更新\n\n本章最后一项主要考虑是更新网站以支持单时间序列分析。在 `site.py` 中，我们需要做一些修改。首先，我们将包含一个默认数据集，向新用户展示如何为单时间序列调用构建数据。与集成测试类似，我们将使用\
  \ 2021 年 1 月 6 日至 2021 年 2 月 2 日的 GME 股票数据作为示例。我们还将创建一个函数，将单时间序列列表转换为 JSON 数组。代码清单\
  \ 14-6 展示了这段代码，它与多变量转换函数非常相似。\n\n```\n@st.cache\ndef convert_single_time_series_list_to_json(time_series_str):\n\
  mv_ast = ast.literal_eval(time_series_str)\nreturn json.dumps([{\"key\": k, \"dt\"\
  :dt, \"value\": v} for idx,[k,dt,v] in enumerate(mv_ast)])\n代码清单 14-6\n将时间序列数据数组转换为\
  \ JSON，以便在异常检测引擎中使用。\n```\n\n另一个重大变化涉及我们如何显示时间序列数据。通常，折线图是显示时间序列数据的绝佳选择，尤其是当时间序列显示季节性、周期性等因素时。为了在将整个趋势显示为折线的同时，将异常值显示为点，我们将使用两个独立的图表。代码清单\
  \ 14-7 展示了我们将用于显示这些图表的代码。\n\n```\nelif method==\"timeseries/single\":\nst.header('每个数据点的异常分数')\n\
  colors = {True: '#481567', False: '#3CBB75'}\nl = px.line(df, x=df[\"dt\"], y=df[\"\
