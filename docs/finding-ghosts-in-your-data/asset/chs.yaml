  \n## 多峰数据\n\n现在，我们的单变量异常检测引擎已经就位，本章也即将收尾。不过，在结束之前，我想再讨论一个主题：多峰数据。\n\n\n\n### 一个隐藏的假设\n\
  \n到目前为止，我们一直基于一个相当直接且合理的假设：我们的数据近似服从正态分布。此外，我们还假设数据是单峰的。图 7-4 是本章开头图 7-1 的复现。\n\n\
  ![](img/521828_1_En_7_Fig4_HTML.png)\n\n一张密度与数值的关系图。对数正态曲线呈右偏态，正态曲线则为标准正态曲线。\n\n\
  **图 7-4** 两个单峰数据分布\n\n该图展示了两个单峰曲线。存在一个明确的中心值，其密度最高。相比之下，图 7-5 展示了一个多峰曲线的示例，其中包含几组相互竞争的值。\n\
  \n![](img/521828_1_En_7_Fig5_HTML.png)\n\n一条正弦曲线绘制了密度与数值的关系。数值为估计值。多峰（负 4, 0.00）、（0,\
  \ 0.17）、（5, 0.00）、（12, 0.11）和（16, 0.00）。\n\n**图 7-5** 一个具有两个明显峰值的数据集\n\n在这种情况下，极端值——即小于约\
  \ -3 或大于约 20 的值——仍然是离群点，但约 3 到 8 之间的一些中心值也成了离群点。事实证明，我们现有的异常检测测试在多峰数据上表现不佳。例如，在集成测试库中，我添加了一个名为\
  \ `Ch07 – Univariate – Outliers Slip in with Multi-Peaked Data` 的测试。该测试检查以下数据集：`{\
  \ 1, 2, 3, 4, 5, 6, 50, 95, 96, 97, 98, 99, 100 }`。基于我们对离群点的人类理解，可以看出该数据集中的离群点是\
  \ 50。然而，如果我们在此数据集上运行现有的离群点检测程序，最终会得到表 7-1 中令人惊讶的结果。\n\n**表 7-1** 多峰数据测试结果\n\n| 值\
  \ | 异常分数 |\n| --- | --- |\n| 1 | 0.169 |\n| 2 | 0.164 |\n| 3 | 0.158 |\n| 4 | 0.153\
  \ |\n| 5 | 0.149 |\n| 6 | 0.146 |\n| 50 | 0.001 |\n| 95 | 0.148 |\n| 96 | 0.151\
  \ |\n| 97 | 0.155 |\n| 98 | 0.160 |\n| 99 | 0.165 |\n| 100 | 0.171 |\n\n50 不仅没有被标记为离群点，反而被认为是*最不可能*成为离群点的数据点！原因在于我们的统计测试围绕均值和中间值展开，而在此例中，两者都（近似）等于\
  \ 50。\n\n### 解决方案：先睹为快\n\n既然我们看到了问题所在，就可以想出解决这个问题的方法。我们需要的解决方案的核心理解是，我们不应将数据视为一组近似服从正态分布的单峰数值。相反，我们可能会遇到数据分组的情况，我们称之为*簇*。这里，我们有两个数值簇：一个从\
  \ 1 到 6，另一个从 95 到 100。我们将在本书第三部分详细讨论聚类。\n\n## 结论\n\n在本章中，我们扩展了执行单变量异常检测的能力。我们学习了如何检查输入数据集是否近似服从正态分布，如果数据不服从正态分布，如何对其执行\
  \ Box-Cox 变换，并整合了需要归一化数据才能工作的额外测试。我们的单变量异常检测器已增长到近 400 行代码，并且在挑选离群点方面变得更好，随着我们提高灵敏度级别，返回的虚假离群点也更少。\n\
  \n在下一章中，我们将暂时离开这个代码库。我们将构建一个辅助小项目来可视化我们的结果，提供一种比阅读数百行 JSON 输出更简单的方法来查看输出。\n\n"
- '# 8. 可视化结果


  在过去的两个章节中，我们与离群点检测服务进行了交互：我们构建并扩展了功能，创建并更新了测试，并通过阅读大量 JSON 输出来诊断问题。在本章中，我们将提供一种更用户友好的方法来与离群点检测器集成。这将采用
  Web 应用程序的形式。


  ## 制定计划


  在解决这个方案时，首先要记住的是，Web 服务是我们离群点检测服务的*消费者*，而不是服务本身的一部分。因此，我们将构建一个独立的应用程序。该应用程序将调用我们的检测服务，并以一种使用户更容易看到结果的方式显示结果。由于我们希望在此处尽量减少应用程序开发工作量，我们将重点放在
  Web 应用程序上，而不是桌面应用程序。此外，这个可视化工具并非我们打算向公众开放的东西——至少本书中使用的版本不是。这些原则可以驱动一个更完整的产品，但就我们的目的而言，我们只是想要一些比
  JSON 块更容易阅读的东西。


  牢记这些基本原则，让我们来看看我们目前可用的信息以及如何最好地展示这些信息。


  ### 我们想展示什么？


  我们希望在简单的应用程序上展示几项内容。首先，我们希望提供一种让用户输入数据的方式。我们还应该提供足够的指导，以确保用户知道我们需要这些数据以何种形式提供。这样，如果他们开发了调用我们离群点检测服务的生产级应用程序，他们就会知道需要发送的数据结构。我们还应该提供选择检测方法的能力。到目前为止，我们完全专注于单变量离群点检测，但这很快就会改变，我们应该为此做好准备。我们还应该允许用户选择是否希望查看调试数据。


  至于输出，我们希望做得比简单地复述我们收到的 JSON 更好。相反，我们可以提供数据的图形化解释。对于单变量离群点检测，解决方案相当简单：我们的单一输入变量 `value`
  成为散点图的 X 轴，异常分数代表 Y 轴。我们还可以以表格格式写出数据点。这两种功能的结合将使人类更容易解释数据，并判断我们检测到的离群点是真正的异常还是仅仅是噪声。以逻辑合理的方式显示调试细节也会很好。我们可以分别显示不同的数据集合，例如调试权重、运行的测试以及不同的计算。这样，人们可以快速扫描到所需部分并查看结果。如果某个调试部分不相关，例如当我们不执行归一化时的拟合计算，我们可以什么都不显示，或者显示一条消息解释为什么某个部分不相关。




  ### 我们想如何展示它？


  在构建用于调用异常检测服务的 Web 应用时，我们有很多选择。由于我们将调用 REST API，因此无需用 Python 编写客户端应用，可以选择任何支持调用
  REST API 的语言。为简单起见，我们实际上会用 Python 开发这个应用，但如果你更熟悉 Java、F#、C#、R 或其他语言，构建自己的应用来调用此服务也不失为一次有益的练习。


  坚持使用 Python，我们在应用开发方面也有不少选择。一种选择是使用 Django、TurboGears 或 CherryPy 等框架构建一个完整的网站。这将使我们能够设计一套详细的交互流程，对于恰好集成了异常检测功能的完整
  Web 应用来说，这可能是最佳路径。然而，对于本章而言，这样的网站对我们来说有些大材小用。幸运的是，还有其他更适合当前任务的选择。


  其中一个选择是 Dash，它基于一个名为 Plotly 的可视化库。Dash 为我们提供了出色的仪表盘开发体验，使其成为生产级应用开发的自然之选。不过，Dash
  有一定的学习曲线，因此我们将改用名为 Streamlit 的库。Streamlit 的存在是为了让数据科学家能够轻松快速地搭建一个简单的网站来处理数据和模型。与
  Dash 不同，Streamlit 并非“生产级”服务，因此我们不会将其暴露给普通公众。然而，就我们构建内部工具的目的而言，Streamlit 将是一个绝佳的选择。


  ## 开发可视化应用


  要安装 Streamlit，请在命令行中运行 `pip install streamlit`。这将为我们安装所有必要的库和依赖项。接下来，在 `\src\` 文件夹中创建一个名为
  `\web\` 的文件夹，并在其中创建 `site.py`。我们将使用这个单独的文件夹来管理 Streamlit 网站。


  ### Streamlit 入门


  Streamlit 有一系列内置函数，旨在轻松地在屏幕上显示文本和数据。`write()` 函数允许我们显示使用 Markdown 格式创建的内容。除此之外，还有各种输入字段，如复选框、单选按钮、文本框和文本区域，允许我们接收用户输入。Streamlit
  最大的生活质量特性是它能够轻松显示 Pandas DataFrame 以及来自 Plotly、Seaborn 和 matplotlib 等库的图表。Streamlit
  在 [`https://docs.streamlit.io/library/cheatsheet`](https://docs.streamlit.io/library/cheatsheet)
  上有一个很好的速查表，其网站上也有大量的 API 文档。


  由于我们可以保持这个网站简单，所有网站代码都将放在一个 Python 文件中。因此，我们需要一个主函数。清单 8-1 展示了我们网站的基本框架。


