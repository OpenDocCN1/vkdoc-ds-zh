  ### 自回归模型


  我们将探讨的最后一类算法采用了一种称为*自回归*的技术。自回归源于*自相关*的概念，即仅根据某个值在先前时间点的数值来预测其当前值的可预测性。自相关的取值范围为+1
  到-1，其中+1 表示先前的数据点与当前数据点完全正相关，-1 则表示完全负相关。自相关值为 0 表示先前的数值对当前数值没有影响。自回归（AR）本身是一种观察并利用当前数据点与若干先前数据点之间关系的技术。在自相关中，我们假设只有两个组成部分：若干过去数值的加权信息和一个随机误差项。


  除了自回归，我们还有*移动平均*（MA）模型的概念。这与我们之前讨论的加权移动平均算法略有不同。像`SWMA`这样的加权移动平均算法为我们提供了一种*平滑*估计，通过平均多个时间段的结果来平滑波峰和波谷。相比之下，MA
  模型利用了自相关的思想，帮助我们判断“随机”误差项是否真的是随机的，或者其中是否隐藏着相关信息。另一种理解方式是：平滑移动平均计算是对先前时间点的实际值创建加权移动平均，而移动平均模型则是对误差项创建加权移动平均。


  然后，我们可以将自回归模型和移动平均模型结合起来，形成 ARMA 模型。在 ARMA 模型中，我们考察先前数据滞后（AR 部分）以及先前残差（MA 部分）的影响。关于
  AR、MA 和 ARMA 模型，我们尚未涉及的一个要求是数据必须是*平稳的*。如果一个时间序列的性质不依赖于你观察该序列的时间点，则该序列是平稳的。我们在此关注的关键因素包括特定数据切片的均值、方差和自相关因子（ACF）。如果我们回到达拉斯-沃斯堡-阿灵顿地区电价示例，我们知道平均价格随时间推移而上涨。这种随时间推移的上涨导致数据*非平稳*，因为
  2007 年的均值与 2021 年的均值不同，因此我们观察数据的时间点很重要。如果我们简单地尝试对该数据集应用 AR、MA 或 ARMA 模型，可能会得出无效的结论。为了解决这个问题，我们使用一种称为*差分*的概念。最简单的差分形式涉及从当前值中减去先前数据点的值。我们可以执行多级差分来估计二次或更高阶的趋势。一旦我们引入了差分，我们就得到了一个使用积分（差分）技术的自回归移动平均模型，即
  ARIMA。ARIMA 是分析时间序列数据和生成预测的强大技术。


  现在我们已经了解了多种时间序列建模技术的工作原理，接下来让我们思考一下时间序列数据点构成异常值意味着什么。


  ## 什么构成异常值？


  到目前为止，我们大部分的时间序列分析都集中在从单个时间序列预测下一个值（或接下来的几个值）。在本节中，我们将开始分类在时间序列数据集中什么构成异常值。我们还将拓宽时间序列分析的范畴，从单个数据集扩展到单个数据集中的多个时间序列。股票市场数据就是一个例子：在同一市场中，有多种股票的价格涨跌互现。在本节中，让我们模拟一栋办公楼内的行为，其中每个人使用门禁卡进入，并且我们能够记录谁在什么时间点进入。


  ### 局部异常值


  我们可以将*局部异常值*定义为某个时间序列中噪声分量异常大的数据点。例如，假设我们有一名员工通常每天刷卡三次：一次在一天开始时，一次在午餐后，一次在短暂的下午休息后。偶尔，该员工可能跳过休息或休息两次，因此我们通常每天看到两到四次刷卡，这种情况已经持续了几年（意味着数据集是平稳的），且没有季节性成分。今天，这名员工刷卡了八次。这个数字异常高，误差项比趋势值
  3 高出 5。这必然有外部原因：可能是该员工正在帮忙搬运办公室聚会的物资，可能是读卡器故障导致每次进入都重复刷卡，或者该员工复制了门禁卡并将复制的卡交给同伙，试图在下班后洗劫办公室。我们无法仅从时间序列数据集中辨别这一差异的具体原因，但我们可以判断出存在足够显著的差异，值得引起我们的注意，并且这构成了一个异常值。


  ### 随时间推移的行为变化


  我们可能关心的第二种异常值是随时间推移发生的行为变化。由于一系列严格的截止日期，我们的员工无法再外出午餐，必须在办公桌前吃饭。他们还几乎将下午的户外休息次数减少到零。现在，他们平均每天不再刷卡三次，而是平均每天刷卡一次，并且整天待在楼内。这种变化之前的趋势与变化之后的趋势不同，而变化发生的点——也称为*变化点*（下一章的主题）——对我们来说很有意义。


  ### 全局变化中的局部非异常值


  第三类异常值不像前两类那样直接。假设我们的员工继续平均每天刷卡三次。与此同时，由于不明原因，办公室关闭了多年，所有其他员工的平均每日刷卡次数从 2.85 次下降到
  0 次。我们员工的行为没有改变，但他们*相对于组织其他成员*的行为发生了显著变化，使他们从接近平均水平的员工变成了远高于正常水平的员工。


  ### 与同组群体的差异


  第四类异常值取决于了解数据集中各个时间序列之间的关系。回到我们员工的例子，我们可以考虑正式的同组群体，例如在同一部门工作的人。我们也可以考虑非正式的同组群体，例如每天一起吃午餐的一群人，或者在相似时间一起抽烟休息的一群人。如果我们对这些正式或非正式的关系有足够了解，我们可以将数据集中的这些时间序列分组，并理解它们之间协同变化的程度。然后，如果我们看到组内某个序列的行为发生变化，即使该序列本身没有剧烈变化，我们也可能认为这是异常行为。一个具体的例子是，我们那位通常每天刷卡三次的员工属于一个共同群体。由于某种原因，该共同群体的平均每日刷卡次数下降到大约
  2.4 次，但我们的员工却增加到 3.4 次。从每天刷卡 3 次增加到 3.4 次不一定足以表明异常行为，尤其是如果这种变化是渐进的。尽管如此，该员工的行为与其（前？）同组群体行为之间的差异要显著得多。




  ### 常见技术类别


  在了解了时间序列异常值的一些成因后，我们将对技术进行一个总体分类。时间序列分析技术共有三大常见类别（Mehrotra 等人，第 69 页）。第一类是*基于核的技术*，即在整个时间序列上计算某种相似性度量。由此，我们可以使用经典技术（例如计算数据点最近邻的相似性度量）来执行异常检测。


  第二类技术是*基于窗口的技术*。这些技术着眼于时间序列数据窗口，并为序列中的每个窗口计算异常分数。然后，我们可以将每个相对较小窗口的分数结合起来，计算出一个总体异常分数。


  第三类技术是*马尔可夫技术*，其模式仿照*马尔可夫链*。马尔可夫链是一种基于状态的过程，其中当前值高度依赖于上一个值，而任何更早的值都没有意义。换句话说，`x[t]`
  的值依赖于 `x[t-1]`，但不依赖于 `x[t-2]` 或更早的值。马尔可夫技术倾向于稍微放宽这一要求，而是将我们限制在相对较少的先前数据点上。一个例子是，一只股票今天的预期价格将严重依赖于过去几天的价格，而完全不受六个月前价格的影响。


  在第四部分中，我们将主要关注基于窗口的技术，因为它能最清晰地展示哪些时间段最可能是异常值。如果我们有大量相对较短的序列，并希望找出整个序列范围内的异常值，那么基于核的技术非常出色；而马尔可夫技术则非常适合追踪序列内短期行为的剧烈、意外变化。


  ## 结论


  本章概述了时间序列分析。我们定义了什么是时间序列分析，并了解了时间序列分析与非时间序列分析的区别。接着，我们回顾了几种常见的时间序列分析模型。这些模型主要适用于基于历史信息预测未来的时间序列值，但也可以利用预测值与实际值之间的差异来指示某个数据点是否为异常值。在介绍了时间序列分析技术之后，我们更好地理解了数据点在时间序列中成为异常值的含义。最后，我们学习了时间序列异常值检测的三大主要类别。


  在下一章中，我们将使用一种常见技术——变点检测——来实现单序列时间序列异常值检测。


