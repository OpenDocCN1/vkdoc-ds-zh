  \n\n\n## 结论\n\n在本章中，我们学习了足够多的关于 copula 函数的知识，以理解基于 Copula 的异常检测（`COPOD`）方法的基本工作原理。随后，我们将\
  \ `COPOD` 集成到我们的多变量异常检测集成模型中，并取得了良好效果。最后，我们对配套的异常检测应用程序进行了一些微小但有用的改进。\n\n在进入第四部分和时间序列分析之前，我们应该花点时间反思一下我们已经取得的成果，以及如何改进当前的多变量异常检测系统。在第三部分中，我们构建了一个由三种算法组成的独立集成模型：基于连通性的离群因子（`COF`）、局部相关积分（`LOCI`）和\
  \ `COPOD`。这三种算法以不同的方式工作，以发现某个数据点是否可能是异常值，其中两种算法使用基于密度的方法，第三种算法使用基于 copula 函数的分布方法。我们已经看到，这三种算法的组合为我们提供了一个相当稳定的异常值判定基础，这意味着，给定不同的敏感度分数或最近邻数量，被标记为异常值的数据点数量不会出现巨大差异。我们还受益于选择了两种无需用户输入的算法和一种只需少量用户输入的算法，这非常符合我们的理念，即让统计知识较少的用户也能轻松使用我们的服务。\n\
  \n还有几十种其他算法可用于多变量异常检测，我们可以进行研究，但每增加一种算法都会带来新的复杂性，并且在添加之前应仔细评估。根据 Mehrotra 的研究（Mehrotra\
  \ 等人，第 116-117 页），`COF` 和 `LOCI`（特别是 `ALOCI`，它是 `LOCI` 算法的一种线性近似，在 `PyOD` 中不可用）表现相当不错，这项研究发表于\
  \ `COPOD` 论文之前。以此为起点，并非越多越好。为了确保我们在进一步选择算法时做出可靠决策，对更多带标签的数据集进行更深入的分析至关重要。\n\n这种更深入的分析也将有助于我们微调权重。`LOCI`\
  \ 算法的作者为其提供了强大的超参数指导，但 `COF` 和 `COPOD` 没有。我们为每个权重做出了合理的决策，但更多的数据集可以让我们调整这些度量以获得更好的结果。\n\
  \n我们现在已经完成了多变量异常检测，并将转向第四部分：时间序列分析。在下一章中，我们将概述时间序列问题。\n\n"
- '# 第四部分：时间序列异常检测


  到目前为止，时间一直不是我们异常检测引擎中的一个因素。在第四部分中，我们通过将时间纳入流程，为问题引入了一个新的难点。第 13 章向我们展示了为什么时间在异常检测中是一个如此特殊的考量因素，并向我们展示了解决时间序列问题的几种技术。接着，第
  14 章为我们提供了关于一个称为变点检测的概念的信息，这是一种用于时间序列异常检测的有效方法。在第 15 章中，我们从单序列时间序列问题过渡到多序列时间序列问题。我们将了解什么是多序列时间序列，它与单序列时间序列有何不同，以及解决多序列问题需要做出哪些假设。之后，我们在第
  16 章中实现了一种称为差异标准差（`DIFFSTD`）的时间序列分析技术，并了解如何使用这种成对比较技术来解决多序列问题。最后，第 17 章涵盖了另一种称为符号聚合近似（`SAX`）的时间序列技术。


  '
- '# 13. 时间与异常


  现在我们已经进入本书的第四部分，是时候介绍异常检测中的一个重要主题了：时间序列异常检测。与第二和第三部分一样，我们将根据特征数量来划分时间序列分析：首先，我们将处理单序列时间序列异常检测；然后，在建立了单序列时间序列异常检测模型之后，我们将处理多序列情况。


  本章将首先介绍单序列时间序列分析的基础。我们将理解为什么时间序列是一个如此重要的主题。我们还将学习时间序列分析如何改变我们对异常检测的思考方式。之后，我们将研究一些最常见的时间序列分析问题，最后将讨论在执行时间序列异常检测时，什么才真正构成异常值。


  ## 什么是时间序列？


  其核心是，*时间序列数据* 是除了至少一个特征之外，还包含某种日期和时间组合的数据。单序列时间序列分析意味着我们收集的所有数据点都代表了同一现象在不同时间点的发现结果。为简单起见，我们也将任何日期和时间的组合称为“时间”——仅按日期回顾股票市场数据仍然构成时间序列分析。图
  13-1 展示了一个时间序列数据的示例，图表显示了 Greg Maddux 在其美国职业棒球大联盟职业生涯中的自责分率。在这种情况下，我们时间序列数据的*粒度*是年度的，因为这是自责分率最常见的粒度。


  ![图 13-1：Greg Maddux 每年的自责分率](img/521828_1_En_13_Fig1_HTML.png)


  时间序列分析之所以重要，有几个原因。首先，时间是一个特殊的变量，因为它总是朝一个方向移动——尽管如果我确实能使用时间机器回到过去，我一定会更新书中的这条评论！


  时间序列分析重要的第二个原因是，时间不仅是线性的，而且它还是过程的促成原因之一。换句话说，过程将时间作为一个输入：如果我们决定今天采取行动，某些事情可能会在未来的某个时间点取得成果。我们的语言中甚至充满了像“成果”这样的术语，它指的是随着时间的推移结出果实的过程。大多数过程都将时间作为一个输入组件，这一事实使得时间成为我们可以用来分析数据的一个有趣特征。


  这引出了第三个原因：许多商业问题都包含时间因素。例如，我们可以跟踪收入随时间增长的情况，期望它平均以某个固定的百分比增长。另一个例子是，我们可以估计目录中各种产品的需求，以便提前知道需要制造或采购多少。


  话虽如此，时间序列分析当然不是我们可以执行的唯一分析类型，这也不应贬低我们迄今为止在*静态*（即，与时间无关的）异常检测技术方面所做的工作。我们应该在合理的情况下使用时间序列分析，但仅仅为了将其变成时间序列分析而加入一个不必要的时间特征，最终会损害我们对某个现象的分析。


  ## 时间序列改变了我们的思维方式


  时间作为输入特征的特殊性质，对我们应如何分析包含时间序列成分的数据集产生了若干影响。在本节中，我们将探讨时间序列分析与经典数据分析不同的几个方面。




  ### 自相关


  时间序列数据表现出*自相关*，也称为*序列相关*。自相关意味着时间点 `T` 的数据值直接受到时间点 `T-1`（或更一般地，对于某个 `k >= 1` 的 `T-k`）数据值的影响。例如，如果你穿过一个又大又拥挤的房间，三秒后你的位置将取决于几秒前你所在的位置。这背后的直觉是，我们无法瞬间移动，而只能在几秒钟内移动一段最大距离。忽略可能决定该最大距离的因素（例如身高、步态、受伤等），我们知道，如果一个人在三秒内能移动的最大距离是
  `d`，并且他在三秒结束时位于点 `x`，那么我们可以以点 `x` 为中心画一个半径为 `d` 的圆，并知道此人在三秒前一定位于该圆内。图 13-2 展示了这一原理的实际应用。


  ![](img/521828_1_En_13_Fig2_HTML.jpg)


  一个圆心为点 x 的圆。圆的半径标记为 d。


  图 13-2


  给定一个人当前的位置以及该人在固定时间范围内能移动的最大距离，我们知道他在该时间范围开始时一定位于圆内


  值得反复强调这一点，因为同样的图 13-2 也能让我们了解此人在下一个三秒时间范围结束时可能的位置：位于以点 `x` 为圆心、半径为 `d` 的圆内的某处。如果我们有足够的信息了解此人在不同时间点的位置，我们可能会得出类似图
  13-3 的结果，其中我们看到一个人从 `t-5` 到现在（时间 `t`）的运动轨迹，以及他们在时间 `t+1` 可能所处的位置范围。


  ![](img/521828_1_En_13_Fig3_HTML.jpg)


  一个圆心为点 x sub t、半径为 d 的圆。从圆中延伸出 5 个气泡，分别标记为 x sub t minus 1、x sub t minus 2 等。


  图 13-3


  一个人在六个时间段内的运动轨迹。该图还包含了此人在下一个时间段可能前往的位置


  诚然，图 13-3 忽略了关于运动物体的一些物理定律：以非零速度移动的人正朝着某个方向前进。假设他们能保持相同的速度，此人可能会继续朝同一方向移动并移动距离 `d`。如果此人想要掉头，则需要一些时间来减速、掉头，然后朝新方向加速。这就引出了我们的下一个要点。


  ### 平滑运动


  在处理时间序列数据时，我们通常期望数据呈现相当平滑的运动。稍微换个例子，假设你坐在一辆停在直道上的汽车里，我们使用传感器来追踪你的瞬时加速度、速度和距离。当你踩下油门时，正向加速度会推动速度增加，这进而转化为每单位时间移动越来越远的距离。即便如此，我们仍期望这种运动是相对平滑的——我们不会期望你从
  0 英里/小时的速度开始，立即跳到 80 英里/小时，再降到 12 英里/小时，然后增加到 95 英里/小时，等等。事实上，如果我们的传感器确实报告了这种情况，我们更可能认为是传感器故障，而不是速度突然变化。这是因为，在适当的时间范围内，车辆加速度是*连续的*：数据中没有跳跃或不连续点；相反，只要我们有适当粒度的数据，我们就可以绘制出一条平滑的曲线。这条曲线当然会根据你所采取的行动而上下波动，但除非我们开发出某种瞬时移动方式，否则运动就是连续的。


  我们期望看到平滑运动的程度，将取决于场景的性质和数据的粒度。以毫秒为单位追踪车辆加速度、速度和距离，将产生相当平滑的数据，即使是火箭助推器升入太空的情况也是如此。相比之下，以日为单位追踪股票市场价格，则会导致数据点之间出现更大的跳跃。这种运动引出了第三个要点。




  ### 变化的本质


  一旦我们开始处理时间序列数据，我们就会对随时间发生的变化产生预期。也就是说，如果某事物在相关时间范围内没有变化，那么它很可能就不是时间序列数据。如果我们查看某个州所有四年级学生的一组考试成绩并寻找异常值，这不是时间序列数据：这些分数本身在明天或下个月都不会改变。相比之下，如果我们希望追踪学生在一年内的成长情况，并定期进行测试，那么我们就面临一个时间序列问题，因为我们预期在一个学年的相关时间间隔内会发生某种变化。


  有四种类型的变化对我们很重要。第一种是*趋势*，它是在时间序列分析过程中向上或向下的广泛运动。如果我们追踪某种产品随时间变化的价格，有几个因素会驱动趋势。其中一个因素是通货膨胀，即货币供应量相对于市场中的商品和服务的增加。另一个因素是需求随时间的变化。一些产品变得更受欢迎，这种需求的变化可能会推高价格。例如，如果一支本地运动队成为联盟中最好的队伍之一，我们可以预期观看他们比赛的门票需求（和价格）会增加。这个特定的例子被我们的第三个趋势加剧了：供应的变化。在运动队的例子中，主体育场的可用座位数量几乎是固定的——球队可以采取一些措施，比如封锁某些座位区以减少供应，但他们在短期内增加座位的方法很少。相比之下，随着人们采用某种新技术，更多的竞争者进入市场，老牌厂商提高产量，从而增加了供应水平，进而影响了价格。


  第二种重要的变化是*季节性*。季节性涉及时间序列数值的周期性波动。沙滩伞的销售量在春季和夏季很可能远高于隆冬时节。同样，如果每个人都在每月 15 号发一次工资，我们可以预期每月
  16 号到 18 号售出的商品数量会比 12 号到 14 号出现激增，因为人们刚刚手头宽裕，而之前则是在精打细算。这种季节性数据的*周期性*告诉我们完成一个季节性波动需要多长时间。对于沙滩伞来说，周期是年度。对于虚构的工资例子，周期将是月度。如果我们追踪沙漠环境中太阳能电池板每小时产生的能量，我们会预期有日度季节性：一天中产生的能量逐渐增加，到晚上减少，第二天这个循环又重新开始。


  第三种变化是*周期性变动*。这与季节性类似，不同之处在于它往往跨越更长的时间框架，并且不那么规律。例如，假设我们试图预测某个热带岛屿的降雨量。其中的季节性成分是一年中的时间：我们可能在冬季有雨季，夏季有热季。假设我们还知道一个大约
  13 年的周期，降雨量在此周期内涨落。一个周期可能持续十六年，而另一个周期可能持续九年，因此它并不像计算机能轻易识别的那样具有真正的周期性。这可能会使自动化的时间序列分析很难捕捉到非季节性周期。


  第四种变化是*噪声*。这些是不规则的变化，既不是趋势变化，也不是季节性行为，也不是周期的一部分。对于噪声，我们无法仅根据现有信息知道变化的原因。


  图 13-4 展示了一个使用消费者价格指数数据进行时间序列分析的例子。该特定序列涵盖了 1997 年 1 月至 2021 年 7 月期间，德克萨斯州达拉斯-沃斯堡-阿灵顿地区城市消费者的电力和管道燃气成本。消费者价格指数数据是价格的相对衡量指标，这个特定例子使用
  1982 年至 1984 年的平均价格作为 100 的基准线。与 100 的差异表示百分点差异，因此 200 的值意味着价格是基准线的两倍。


  ![](img/521828_1_En_13_Fig4_HTML.png)


