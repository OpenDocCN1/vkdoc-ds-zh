  计算数据集的对称加权移动平均

  ```


  SWMA 基于这样一个理念：大多数时间序列操作往往呈现周期性行为，因此用先前周期的结果来缓和最近周期的结果是合理的。除了 SWMA，还有其他移动平均模型，它们更强调近期周期、包含更多先前周期，或以其他方式调整标准公式。


  ### 指数平滑


  *指数平滑*是一种随时间逐步建立估计值的技术，它对近期数据赋予更高的权重，而对先前数据的权重则逐渐降低。代码清单 13-2 展示了计算一种变体（称为*简单指数平滑*）的两部分公式，从第一个时间段的“基准情况”开始，然后是一个递归函数作为通用情况。


