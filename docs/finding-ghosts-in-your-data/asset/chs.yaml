  \ 网站更新\n\n在结束多变量异常值检测的讨论之前，我们还需要向 Streamlit 网站添加少量功能。代码清单 12-4 展示了第一组更改，我们在其中将各个异常评分组件包含在每个数据点的悬停数据以及结果表中。这将使我们能够看到哪些算法对给定的数据点最有发言权。\n\
