  在上一节的末尾，我们的按钮在屏幕上输出了一条“TODO”消息。现在，我们将用调用异常检测服务的代码来替换它。我们可以在 `main()` 函数中直接进行此调用，但将调用拆分为独立函数有两个好处。首先，我们的主函数会因构建用户界面而变得有些笨重。因此，将操作调用拆分出来，可以避免日后排查故障时的麻烦。其次，如清单
