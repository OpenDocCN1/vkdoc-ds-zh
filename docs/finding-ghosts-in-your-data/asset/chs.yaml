  15 个左右的 CPI 点范围，这意味着季节性在我们的分析中起着重要作用，但并非主要驱动因素。


  最后一个图表显示了*噪声*，即时间序列分析中的“随机”分量。这是去除趋势和季节性之后剩余的所有变化。我们期望它平均值为 0，并且不遵循任何可察觉的模式。如果我们在噪声分量中确实看到了强烈的模式，这是一个很好的指标，表明我们未能考虑到一个重要因素。例如，如果我们有周期性变动，我们可能会在噪声分量或趋势分量中观察到它。另一个常见的例子是我们弄错了季节性周期。如果我们假设是月度季节性——电费在月初上涨但在月末下跌——那么我们将错过前面描述的季度趋势。时间序列库可以帮助我们检测最可能的季节性候选周期，但最好的办法是对你的领域有深入的了解，包括是什么驱动了周期性行为。我们还需要更多的数据。




  ### 数据要求


  在处理单变量和多变量数据集时，我们选择的某些算法有最小数据量要求，通常为 15`–`30 个数据点。而在处理时间序列数据时，我们需要更多的数据。这种需求的直觉在于，事物会随时间变化，因此我们需要更多数据点来理解这些变化，并判断变化是由趋势、季节性还是噪声引起的。为了将季节性与其他因素区分开，我们至少需要两个完整的季节周期。这意味着，如果我们预期季节周期为一年，就像图
  13-4 中的电力场景那样，就需要收集至少两年的数据。理想情况下，我们应拥有四到六个季节周期，以确保不仅能捕捉到季节性效应，还能理解所观察的现象是否包含*子周期*，即周期中的周期。举一个人为的子周期行为例子：假设我们绘制欧洲游客的国际旅游图表。我们可能会预期一个在夏季达到峰值的年度周期，因为人们会享受长假并前往异国旅行。而每四年一次，由于夏季奥运会，国际旅游会出现更大的爆发。如果我们仅基于年度周期建模，可能会因此错过每四年一次“噪声”中的向上尖峰。相反，如果我们知道存在两种季节性效应，就可以对此建模——但前提是我们拥有至少八年的数据，这样就能观察到两次奥运会。


  ## 时间序列建模


  现在我们已经了解了时间序列分析与非时间序列分析的区别，接下来简要回顾四种时间序列技术。每种技术的目标都是基于先前的数据走势预测未来的行为。重要的是，这些技术并非用于发现异常值，而是用于估计目的；尽管如此，它们能帮助我们更好地理解时间序列分析的本质，并有助于我们在后续章节中掌握合适的异常值检测技术。


  ### （加权）移动平均


  *移动平均*是一种简单但效果出奇好的时间序列数据分析与未来数据预测技术。移动平均的一种常见形式是*对称加权移动平均*（SWMA），如代码清单 13-1 所示。在这种形式中，我们对固定数量的周期取移动平均，对中间周期的权重高于最近周期和最远周期。


  ![$$ {x}_t=\frac{1}{6}{x}_{t-1}+\frac{2}{6}{x}_{t-2}+\frac{2}{6}{x}_{t-3}+\frac{1}{6}{x}_{t-4}
  $$](img/521828_1_En_13_Chapter_TeX_Equa.png)


  ```

  t

