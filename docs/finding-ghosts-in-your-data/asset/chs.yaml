  DataFrame 形式存在。


  创建 DataFrame 后，我们将调用一个检测方法。在这种情况下，该函数名为 `detect_univariate_statistical()`，并将返回一个新的
  DataFrame，其中包含原始数据以及一个描述该结果是否为异常的附加属性。然后，我们可以将此数据重新格式化为 JSON，这一点很重要，因为外部世界运行在 JSON
  上，而不是 Pandas DataFrame 上。


  我们还将包含一个调试部分，这将在开发过程中提供帮助，并包含故障排除信息。目前，我们将把它作为一个包含一些基本细节的桩，但随着我们逐步完善流程的具体工作方式，我们将更好地理解我们可以且应该在此处包含什么。这些调试结果将与我们的异常集位于同一个输出
  JSON 中，这意味着我们的调用者不需要任何额外的软件或功能来读取调试信息。


  最后，我们返回结果 JSON 对象。这个相同的基本布局也将很好地服务于其他三个方法。


  ## 定义异常值


  我们现在已经定义了检测异常值的大部分基本方法，但仍有一些模块需要填充，特别是关于输入的部分。在开发方法时，我们希望为用户提供一定程度的控制，以决定什么构成异常值。然而，重要的是要注意，我们并不期望用户知道定义异常值的精确标准——如果他们知道，他们一开始就不需要异常值检测器了！不过，有几种度量标准我们可以期望用户来控制。


  ### 敏感度与异常值比例


  第一个关键度量是敏感度。在这种情况下，我们所说的敏感度并非技术定义，而是一个滑动标尺。理想情况下，调用者无需了解阈值的具体细节，就能控制我们的异常值检测器将某物标记为异常值的可能性。我们将敏感度分数范围设定为
  1 到 100（含），其中 1 表示最不敏感，100 表示最敏感。具体如何实现将取决于所使用的技术，但这为调用者提供了一个简单的控制机制。


  此外，我们需要控制数据集中预期出现的最大异常值比例。某些异常值检测技术期望输入中包含可能异常的最大项目数。与其试图为用户估算这个值，我们可以直接询问这个答案。该值范围从
  0.0 到 1.0（含），其中 1.0 意味着每个数据点都可能是一个异常值。在实践中，我们期望值在 0.05 到 0.10 之间，意味着不超过 5-10% 的记录是异常值。这个比例也可以为我们标记为异常值的项目数量提供一个硬性限制，这意味着如果调用者发送了
  100 个数据点，且最大异常值比例为 0.1，我们保证返回的异常值不超过十个。这将与敏感度分数协同工作：将敏感度分数视为一个滑动标尺，而最大异常值比例则是一个硬性上限。


  ### 单一解决方案


  如果对于某一类问题，存在一种最佳技术来解决该问题，我们可以使用这种技术而排除所有其他可能的技术。在这种情况下，计算相当直接：我们将输入数据应用于给定的算法，如果该技术需要敏感度分数和/或最大异常值比例，则一并传入。我们得到异常项目的数量，然后需要确定是直接返回这个结果集，还是需要执行额外的工作。对于输入技术接受敏感度分数或最大异常值比例的情况，我们的工作可能到此就完成了。否则，我们需要开发一种方法来应用敏感度分数，然后截断超出最大异常值比例的任何项目。这是可行的，因为每种技术都会为每个数据点应用一个分数，并且我们可以对这些分数进行排序，使得分数越高的越有可能是异常值。有了这些分数，即使我们使用的技术没有敏感度或截止点的概念，我们也可以自行实现。



  ### 组合模型


  更复杂的情况是，我们需要创建*集成模型*，即包含多个输入算法的模型。此时，我们需要对哪些项目被标记为异常值有更多控制权，因为集成中的每种技术都会对给定数据点的异常程度有自己的判断。我们需要汇总结果，并自行执行最终评分和阈值划分。


  我们还需要为每个输入算法提供权重。某些技术比其他技术更擅长发现异常值，因此我们希望赋予它们更高的权重。但整合多种输入策略具有很大价值，因为没有任何单一技术能够完美地发现所有异常并忽略所有噪声。正因如此，即使是相对噪声较大的技术也能提供价值，尤其是在同时使用多种此类技术时。我们希望噪声能在不同技术之间“相互抵消”，从而留下更多异常值，并且（理想情况下！）更少的噪声。


  在最简单的情况下，我们可以为每种技术赋予相同的权重，这相当于让每种技术投票一次，然后统计票数，以确定某个特定数据点是否为异常值。当技术数量较多时，这本身就可以作为灵敏度评分的有效标准——假设我们有
  20 个独立的测试。我们可以给每个测试分配 5 分的权重，这样最高分就是 5 * 20 = 100。这与灵敏度评分非常契合，因此如果调用方传入的灵敏度评分为 75，那就意味着一个特定数据点必须至少在
  20 个测试中的 15 个中被判定为异常值，才能出现在我们的最终列表中。


  当采用差异化权重时，数学原理基本相同，但会稍微复杂一些。我们不再为每个触发的测试分配 5 分，而是根据感知到的准确性，为某些测试分配 10 分，为其他测试分配
  2 分。最终结果仍然是，我们期望总分加起来为 100，因为这能使评分与我们的灵敏度评分保持一致。


  无论我们如何对技术进行加权，我们都希望返回关于如何执行此加权的信息。这样，我们就能调试这些技术，并更好地了解我们的灵敏度评分是否按预期工作。


  ## 构建解决方案


  结合上一节的背景，让我们重新审视代码清单 4-3 中的代码，并扩展解决方案以包含我们所需的一切。就输入而言，我们需要将 `input_data` 定义为正确的列表类型。FastAPI
  包含一个名为 `BaseModel` 的概念，它使我们能够轻松解释调用方传入的 JSON，并将其转换为 Python 能够理解的对象。对于单变量统计输入，我们需要一个单一的
  `value` 列。同时，添加一个 `key` 列也是合适的。这样，如果调用方希望为特定值赋予特定含义，他们可以使用 key 列来实现。我们不会将 key 用于数据分析，但会保留它并将其返回给用户。


  `detect_univariate_statistical()` 函数应接收灵敏度评分和最大异常值比例，并输出分配给特定模型的权重，以及任何其他可能有助于调试的详细信息。


  代码清单 4-4 展示了单变量检测函数的更新版本，其中增加了灵敏度评分和最大异常值比例作为输入，以及权重和模型详细信息作为输出。


  ```

  class Univariate_Statistical_Input(BaseModel):

  key: str

  value: float

  @app.post("/detect/univariate")

  def post_univariate(

  input_data: List[Univariate_Statistical_Input],

  sensitivity_score: float = 50,

  max_fraction_anomalies: float = 1.0,

  debug: bool = False

  ):

  df = pd.DataFrame(i.__dict__ for i in input_data)

  (df, weights, details) = univariate.detect_univariate_statistical(df, sensitivity_score,
  max_fraction_anomalies)

  results = { "anomalies": json.loads(df.to_json(orient=''records'')) }

  if (debug):

  ### TODO: 添加调试数据

  ### 权重、集成细节等

  results.update({ "debug_msg": "这是一条日志消息。" })

  results.update({ "debug_weights": weights })

  results.update({ "debug_details": details })

  return results

