- '# 第一部分：什么是异常？


  ## 什么是异常？


  本书第一部分的目的是回答“什么是异常？”这个问题。在本部分中，我们将了解什么是异常、异常检测的一些常见用例，以及你大脑中那个异常检测引擎有多么强大。我们将涵盖各种心理学、技术和统计学概念，到第一部分结束时，我们将掌握足够关于异常和异常检测的知识，从而开始编写代码。


  在第 1 章中，我们将了解离群值和异常，以及异常检测的用例和一种对不同类型的异常检测技术进行分类的方法。然后，在第 2 章中，我们将深入探讨心理学，特别是格式塔心理学派。我们将回顾一些关于人脑如何对模式做出反应的研究，以及向人们分享信息的良好方法。第
  3 章从人类方面转向计算机。人类天生是出色的模式匹配者，但计算机并非如此。我们能做的是训练机器理解什么是正常的，什么偏离了正常。这第三章为我们提供了一些统计技术，我们可以用它们来训练计算机检测离群值。


  '
- '# 1. 异常与异常检测的重要性


  在我们开始构建异常检测器之前，理解异常具体是什么非常重要。本章的第一部分将为我们提供对异常的基本理解。然后，在本章的第二部分，我们将探讨跨多个行业的异常检测用例。在本章的第三部分，我们将列举三类异常检测方法，这些方法将在本书中反复出现，我们将对每种方法获得高层次的理解，为后续的深入探讨做准备。最后，我们将以一些关于构建自己的异常检测器时需要考虑的要点来结束本章。


  ## 定义异常


  在我们开始构建异常检测器之前，我们需要理解什么是异常。同样，在我们定义异常的概念之前，我们需要理解离群值。



  ### 异常值


  `outlier`（异常值）是指与正常值存在显著差异的数据点。例如，在 2008 年夏季奥运会男子 200 米比赛中，尤塞恩·博尔特以 19.30 秒的成绩创造了世界纪录，比第二名肖恩·克劳福德快了超过
  0.6 秒。其余五名选手（除两名被取消资格的选手外）的成绩在 19.96 秒到 20.59 秒之间，这意味着第二名与最后一名之间的差距略大于第一名与第二名之间的差距。因此，第二名到第六名的成绩属于`inliers`（内值），即与正常值没有显著差异的值。表
  1-1 显示了决赛中运动员的成绩。


  **表 1-1** 2008 年夏季奥运会男子 200 米比赛完成时间（来源：[*https://w.wiki/4CpZ*](https://w.wiki/4CpZ)（维基百科））


  | 运动员 | 时间（秒） |

  | --- | --- |

  | 尤塞恩·博尔特 | 19.30 |

  | 肖恩·克劳福德 | 19.96 |

  | 沃尔特·迪克斯 | 19.98 |

  | 布赖恩·津加伊 | 20.22 |

  | 克里斯蒂安·马尔科姆 | 20.40 |

  | 金·柯林斯 | 20.59 |


  基于这些信息，很明显博尔特的成绩是一个异常值。接下来的问题是，这是一个离群点吗？


  ### 噪声与离群点


  在异常值的范畴内，我们定义了两个子类别：`noise`（噪声）和`anomalies`（离群点）。这两个术语之间的区别最终取决于人类的兴趣。噪声是我们不感兴趣的异常值，而离群点则是我们感兴趣的异常值。这个离群点的定义与
  Aggarwal（1`–`4）中的定义一致，但并非普遍适用——例如，Mehrotra 等人将“异常值”和“离群点”作为同义词使用（Mehrotra 等人，4）。


  另一种区分噪声和离群点的方法是考虑带有误差项的模型。假设我们有一个函数，它接受一组输入，并返回对该运动员跑完 200 米比赛所需秒数的估计值。如果我们输入各种不同的参数，就有可能描绘出这个函数的形状，同时理解到我们的估计值与实际时间之间存在一定的方差。我们通过添加一个误差项来展示这一点：


  ```

  T_Athlete = f(A, B, ...) + ε

  ```


  有时，在给定一组输入值和实际时间的情况下，我们可能会看到与预期时间相差 0.25 秒的情况。如果我们认为这次特定的比赛仍然遵循相同的底层函数，并且所有差异都归因于误差项，那么我们的估计值与实际时间之间的差异，严格来说，就是噪声。


  相比之下，假设对于像博尔特这样的传奇运动员，存在一个不同的函数：


  ```

  T_Bolt = f(A, B, ...) + ε

  ```


  这个函数对时间的估计值远低于普通的奥运选手（如果存在这种可能的话！）。如果我们使用这个函数，得到的结果比使用正常模型的数据点快 0.25 秒，那么这个结果就非常合理。然而，如果我们预期得到普通运动员的输出，却得到了博尔特的输出，那么这个结果就是一个离群点：一个与正常值不同且我们感兴趣的结果，因为生成该结果所依据的底层函数不同。


  在实践中，这种对离群点的理解更多是概率性的而非确定性的，因为我们不一定知道生成任何给定数据点的具体函数，这使得区分噪声和离群点变得困难。在博尔特的案例中，我们可以预期这是一个离群点而非噪声，不仅因为博尔特在该项目中创造了新的世界纪录，还因为他的成绩远低于其他世界级运动员，这佐证了他属于另一个级别的观点。


  ### 诊断一个示例


  我们已经看了一个例子，现在来回顾一个图形示例。图 1-1 显示了 2020 赛季某周美国国家橄榄球联盟（NFL）比赛中得分与传球码数的散点图。


  ![](img/521828_1_En_1_Fig1_HTML.png)


  一个点图绘制了得分与传球码数的关系。一些估计值为（160, 24）、（310, 34）、（330, 32）、（380, 34）、（430, 44）。


  **图 1-1** 2020 年某周 NFL 球队的得分与传球码数


  作为人类，我们具备某些先天和后天训练的能力来分析这些信息并从中得出结论，我们将在第 2 章中更详细地讨论这一点。目前，只需说明在该图中，传球码数与得分之间似乎存在正相关关系就足够了。


  根据现有信息，我们可以想象一个相当紧密的带状区域，用于估计给定传球码数下的得分，画一条粗线，这条线接近或完全覆盖了大部分数据点。这样做会使我们估计，一个四分卫传球
  300 码的球队，在正常情况下可能得到大约 28`–`35 分。


  在提出这个理论模型后，我们可以转向两个异常值：尽管球队的四分卫分别传出了大约 290 码和 335 码，但这两支球队只得到了 17 分。这引出了我们需要回答的两个关键问题——至少是暂时性地回答——以便继续进行离群点检测的过程。第一个问题是，我们的模型是否足够好，能够正确区分内值和异常值？如果答案是“是”，那么第二个问题是，异常值数据点遵循与内值完全不同的过程的可能性有多大？


  在本书中，我们将探讨有助于回答这两个问题的思路和技术。话虽如此，第二个问题可能很难得出确切的结论，因为它取决于我们对生成这些数据点的过程内部运作的理解。


  这引出了另一个重要的考量：领域知识对于`outlier detection`（异常值检测）并非必需，但对于`anomaly detection`（离群点检测）却是必需的。回到图
  1-1 中的例子，一个对美式橄榄球一无所知的人也能感知到数据中的关系以及数据集中的两个异常值。然而，这个人无法判断这些数据点仅仅是噪声，还是暗示着一种不同的行为模式。具体来说，如果那些球队只得到
  17 分是由于运气不佳、射门失误或面对强大的红区防守，那么这些因素将指向这些异常值为噪声。另一方面，如果这些球队的教练策略效率低下，能够将球推进到前场，但始终无法将进攻势头转化为得分，那么我们可以恰当地将这些点称为离群点。一个拥有足够信息的领域专家可以帮助我们区分这两种结果。正如我们将在本章后面看到的，我们构建离群点检测器的目的是为这样的领域专家提供足够的信息，以便他们分析、解释，然后根据我们传递的信号采取行动。




  ### 如果我们错了呢？


  在判断一个数据点是否为异常值时，我们可以通过根据某些潜在特征将结果分为两个或多个类别来执行*分类*操作。在异常检测中，我们通常最终会得到两个类别：这个事物是异常，或者这个事物不是异常。如果我们有两个可能的类别（这是离群值或这不是离群值），并且我们可以预测这两个类别中的任何一个，那么最终会得到如表
  1-2 所示的结果，该表给出了在给定预测类别及其实际类别的情况下的可能结果。


  **表 1-2** 基于离群值预测与数据点实际异常状态的结果


  | | 预测为离群值 | 预测为非离群值 |

  | --- | --- | --- |

  | **实际异常** | 正确（真阳性） | 第二类错误（假阴性） |

  | **实际非异常** | 第一类错误（假阳性） | 正确（真阴性） |


  查看此表，我们看到两个维度：给定的数据点是否实际上是异常，以及我们对那个数据点做出的预测是阳性（是，这是离群值）还是阴性（不，这不是离群值）。当我们正确判断出离群值确实是异常，或者非离群值确实是非异常时，我们注意到分类是正确的，然后可以继续。然而，我们可能出错的方式有两种。第一种出错方式是，我们预测一个数据点是离群值，但结果它并不是异常——它只是噪声。这也被称为*第一类错误*或*假阳性*。与此相反的情况是，尽管某个数据点是真正的异常，但我们未能将其判定为离群值。后一种失败被称为*第二类错误*或*假阴性*。我们应尽可能避免任何一种错误，但将这些错误分开分类的事实引出了一个有趣的问题：这两种错误哪一种更糟糕？


  答案是咨询师那句著名的口头禅：视情况而定。在这种情况下，关键的考量因素涉及错过至少一个真实异常且未对其采取行动的负面后果，与接收警报或对最终被证明完全正常但被我们的检测服务错误分类的数据点进行研究之间的权衡。你愿意接受多少假阳性来限制假阴性的可能性，将取决于几个因素，例如假阳性活动的频率、确定预测的离群值是否真的是异常所需的工作量，以及假阴性结果的成本。诸如此类的因素将帮助你决定离群值检测器应该有多严格，不过我们将在第
  4 章开始看到一种有助于解决此问题的替代方法。


  ## 现实世界中的异常


  在本节中，我们将简要介绍几个异常检测在决策中发挥重要作用的行业。对其中任何一个行业的详细分析都远远超出了本书的范围，但即使是简短的总结也足以阐明异常检测是一个跨行业关注点的论点。


  ### 金融


  异常检测在金融领域有多种用途。与此相关的最明显场景之一是资产定价。异常资产定价的典型代表非 GameStop 公司（GME）莫属，其每日收盘股价构成了图 1-2。


  ![](img/521828_1_En_1_Fig2_HTML.png)


  **图 1-2** GameStop 公司（GME）从 2020 年 4 月 13 日到 2021 年 9 月 24 日的每日收盘价。异常判定来自 `ML.NET`
  库


  很少有股票会经历我们在 GameStop 身上看到的持续数月之久的动荡，但根据我们在撰写本书时可用的信息，许多离群数据点都与媒体宣传活动（无论是大众媒体还是社交媒体）、期权到期日以及市场参与者在这一代人最大的市场事件之一中选边站队有关。


  资产定价并非异常检测在金融行业唯一有意义的地方。异常检测可能很重要的另一种情况是法务会计，即审查会计实务和财务文件，以确定组织成员是否实施了欺诈行为。法务会计师所做的远不止仔细审查资产负债表和日记账分录，但当他们确实审查财务文件时，他们是在寻找模式和异常情况。


  其中一种模式是本福特定律，该定律指出，足够大的数字集合的首位数字通常遵循一种特定模式，即较小的数字比较之大的数字出现得更频繁。图 1-3 以图形形式展示了这种分布。


  ![](img/521828_1_En_1_Fig3_HTML.jpg)


  **图 1-3** 如果遵循本福特定律，数字序列首位数字分布的直观描述


  并非所有数据集都会遵循这种模式，但一个快速的“经验法则”是，如果一个数据集包含的数据点跨越至少三个（或更多）数量级，那么它很可能遵循本福特定律。这个经验法则之所以成立，是因为许多确实遵循本福特定律的分布类型——例如指数分布或对数正态分布——通常包含跨越多个数量级的各种值，而不遵循本福特定律的分布——最常见的是均匀分布和高斯分布——则通常不会。关于本福特定律背后数学原理的深入探讨，我推荐
  Hall (2019)。


  然而，就我们的目的而言，只要理解本福特定律可以为法务会计师提供某些数据集分布应如何的预期就足够了，特别是像公司或政府机构的日记账分录集合这样的数据集。与本福特定律的显著偏差本身并不能证明存在不法行为，但它对审计师来说是一个危险信号，通常值得进一步调查，以了解为什么这个特定数据集不典型。


  ### 医学


  异常检测对医学领域至关重要。关于什么构成健康与不健康的身体指标，存在着大量的研究。这些指标的例子包括血压、体温、血氧饱和度和心电图（ECG）数据。我们可以根据一个人的测量值与正常值相比的显著变化推断出他当前处于不健康状态。请注意，这个正常值可能是通过对大量人群的数据进行汇总和平均得出的，也可能来自该个体处于已知健康状态的情况。


  借助现代电子设备，我们可以以前在医院病房之外不可能的方式收集和比较数据。填补这一空白的消费产品的一个例子是 Apple Watch，它能够跟踪心率数据并通过 ECG
  应用程序显示。该设备可以通知异常高或低的心率，以及心律不齐。Mehrotra 等人提供了其他例子，说明异常检测在医学领域可能具有价值（11-12）。




  ### 体育数据分析


  体育是全球性的大生意，据《福布斯》统计，截至 2020 年，有 12 支体育特许经营权的价值至少达到 35 亿美元。此外，根据运动项目的不同，一支球队每个赛季可能在球员薪资上投入
  2 亿美元或更多。为了最大化这笔投资回报，球队在体育数据分析领域投入了大量时间和金钱。在这种对数据分析的重视下，分析和理解异常值至关重要，以免被误导，认为一个赛季的统计成功必然会延续到下一个赛季。


  #### 一个价值 2300 万美元的错误


  克里斯·约翰逊在 2013 赛季开始时是亚特兰大勇士队的首发三垒手。那个赛季他以 0.321 的击球率收官，这为他赢得了一份为期四年、价值 2300 万美元的合同。进入
  2014 赛季，勇士队期望他成为进攻端的关键贡献者；然而，他的击球率却下降到了 0.263，到了 2015 年底，亚特兰大总经理约翰·哈特将克里斯·约翰逊作为与克利夫兰印第安人队交换不良合同的一部分交易了出去。在他签下那份合同时，就有充分理由相信约翰逊无法达到预期，图
  1-4 通过一项名为“场内击球率”（BABIP）的统计数据揭示了原因。BABIP 衡量的是球员将球击入场内时的表现，即忽略本垒打以及三振或保送等球未进入比赛的情况。BABIP
  的正常值通常在`.270`–`.330`范围内，但克里斯·约翰逊的 BABIP 高达`.394`，这使他在 2013 赛季至少拥有 150 次打数的 383 名合格球员中排名第一。


  ![](img/521828_1_En_1_Fig4_HTML.png)


  一个点图，横轴为 BABIP。这些点绘制成一条平行于横轴的直线。


  **图 1-4** 克里斯·约翰逊在 2013 年以`.394`的 BABIP 领跑美国职业棒球大联盟


  约翰逊领跑联盟且其 BABIP 至少高出正常值 60 个点（即 0.060）这一点很重要，因为有大量证据表明，决定击入场内的球是出局还是安打的主要是防守方，而非击球手本人。这一普遍原则存在例外，但其含义是，通常情况下，一个赛季
  BABIP 非常高的球员不太可能在下一个赛季重现这一表现。以约翰逊为例，他的 BABIP 从 2013 年的`.394`下降到了 2014 年的`.345`。由于缺乏强大的长打或上垒能力，约翰逊比大多数球员更依赖击球率来贡献进攻火力，而他的
  BABIP 向均值回归正是其进攻崩溃的原因。如果勇士队当时能理解约翰逊在这一关键指标上是一个多么极端的异常值，他们或许就不会在 2013 赛季后给他提供那份糟糕的合同，而是让其他球队犯下那个错误。


  #### 一个持久的反常现象


  格雷格·马杜克斯是有史以来最伟大的投手之一。他在大联盟的 23 个赛季中持续压制击球手，这得益于他对球路不可思议的控制力以及几乎无与伦比的变速球能力，且不会让击球手提前察觉。马杜克斯还享有另一项殊荣：在
  1988 年至 2007 年间，他是自责分率（ERA）与独立防守投球数据（FIP）差值最大的投手，这一时间段涵盖了马杜克斯从年轻先发投手崭露头角到退役前一年的整个巅峰期。


  FIP 这一衡量指标源于对投手究竟能控制哪些因素、而哪些因素取决于防守的研究。研究结果表明，投手主要负责三件事：保送、三振和本垒打。除此之外，击入场内球的大部分贡献则完全取决于防守——正如我们在上一节关于
  BABIP 的讨论中所看到的那样。


  FIP 的一个结论是，它往往比投手当前赛季的 ERA 更能预测其下一赛季的 ERA，因为防守表现会趋向均值。这意味着，如果你看到一名投手的 ERA 远低于其 FIP，我们可以预期他在下一年会出现回归。除非他是格雷格·马杜克斯。图
  1-5 展示了来自投手的 1703 个赛季数据，显示了他们的 ERA 与 FIP 之间的差值，其中负值表示投手表现优于其 FIP 预期，正值则表示表现不及预期。


  ![](img/521828_1_En_1_Fig5_HTML.png)


  一个点图，横轴为 ERA，纵轴为 ERA 与 FIP 的差值。呈现上升趋势。


  **图 1-5** 横轴为 ERA，纵轴为 ERA 与 FIP 的差值。格雷格·马杜克斯在亚特兰大勇士队效力期间（其职业生涯巅峰期）的赛季数据以黑色突出显示


  格雷格·马杜克斯创造了 ERA 与 FIP 之间最大的两个差值——而且这两个差值连续出现，这意味着他并没有像预期那样向均值回归。在这一时间段内，马杜克斯占据了前
  30 个最佳球员赛季中的四个席位，并且持续表现优于其 FIP 预期。图 1-6 显示了 1988 年至 2007 年间所有投手 ERA 与 FIP 差值的累计总和，马杜克斯位居榜首，紧随其后的是佩德罗·马丁内斯、何塞·里霍和丹尼斯·马丁内斯。


  ![](img/521828_1_En_1_Fig6_HTML.jpg)


  一个点图，横轴为 ERA 与 FIP 的差值。这些点绘制成一条平行于横轴的直线。


  **图 1-6** 1998 年至 2007 年间所有投手 ERA 与 FIP 差值的职业生涯总和


  在这个案例中，我们再次看到了一个异常值：马杜克斯的 ERA 持续优于 FIP 的预期，这是极少数投手能够做到的。基于他整个职业生涯的表现，这是一个马杜克斯的异常状态本身就是一种反常现象的例子：他的行为模式与其他投手差异巨大，以至于可以公平地说，他遵循着与大多数其他投手不同的表现函数。




  ### 网站分析


  网站分析是异常检测的一个绝佳领域，原因有二。首先，网站往往会产生大量流量，人类无法在合理时间内解析这些数据。这迫使人们使用日志聚合和分析工具来简化工作，但即使有了这些工具，进行全面分析所需的时间也可能令人望而生畏。第二个原因更为重要：任何网站都持续存在着一股错误暗流。自动化工具会持续扫描网站和公共
  IP 地址，寻找已知的常见漏洞。这可能导致对托管在.NET 网站上的 `index.php` 等文件的请求产生 404（文件未找到）错误。这些并非合法请求，而且频率很高，以至于在任何假设你未过滤掉这些消息、就会广播警报的简单系统中，它们都会因噪音而过载。


  过滤掉非法错误可能就足够了，但至少还存在另外两类无趣的错误：过时链接和意外错误。关于前者的例子：假设我发送了一封电子邮件，其中包含一个指向我上传到网上的照片的链接。几年后，我从网站上删除了这张照片，但你的邮箱里仍然保留着这个链接。如果你打开那个链接，你会得到一个
  404（文件未找到）错误，因为该资源已不复存在。关于后者的例子：我可能试图凭记忆访问一个 URL，在此过程中不小心按错了键，导致了一个拼写错误。这也可能导致 404
  错误。类似地，我可能不小心点击了一个受保护的链接，被提示输入凭据，然后选择了“取消”，从而导致 403（未授权）错误。这些是合法的错误，但从系统管理员的角度来看，这是正常且预期的行为。系统管理员没有什么需要“修复”的，因为一切都在按设计运行。


  异常检测的有趣之处在于，能够发现超出“互联网背景辐射”（此比喻感谢史蒂夫·吉布森）和常见失误之外的错误。假设一个新版本的产品发布，开发团队启用了一个功能开关，将
  1%的流量发送到一个新页面，而 99%的流量仍停留在现有页面上。再进一步假设新页面上存在问题，导致一定比例的用户收到与页面上缺失资源相关的 404 错误。现在我们有了不同的行为模式——不再是针对某个特定资源的一两次失败请求，也不是广泛的噪音。一个能够发现这类错误并发出警报，同时过滤掉大部分前述噪音的异常检测系统，可以为系统管理员和开发团队节省大量时间，同时还能在客户提交故障单之前发现代码发布问题。


  ### 更多应用场景


  至此，应该清楚异常检测并不局限于某个单一的行业或研究领域，而是具有广泛的适用性。此外，事实证明，存在一套独立于领域或行业的通用异常检测技术，这意味着我们在本书中学到的技术将适用于任何行业。


  既然我们已经简要调查了现实世界中的异常现象，下一步就是审视异常检测的三个类别。


  ## 异常检测的类别


  我们有三大类异常检测技术可供使用。我们将根据它们在后续章节中出现的顺序，逐一进行探讨。所有这三种技术在其各自的领域都很有价值，因此理解每种技术的关键组成部分，以便针对特定问题应用最佳方法，是值得的。


  ### 统计异常检测


  第一类异常检测技术是统计异常检测技术。使用这些技术时，我们假设数据遵循某种特定的底层分布——目前，可以将其理解为数据集的形状——但除了数据的分布之外，我们不对数据“应该”是什么样子做任何假设。换句话说，我们没有一个模型，能够根据给定的输入集得到特定的预测输出。


  对于统计异常检测技术，异常值是指那些显著偏离我们分布中心的数据点——也就是说，它们距离中心足够远，以至于我们可以预期它们并非真正属于同一分布。“显著不同”和“足够远”的定义必然是宽松的，因为它们可能是用户可配置的，并且很可能取决于具体领域。


  第 6 章到第 8 章将重点介绍如何将统计技术整合到一个通用的异常检测服务中。


  ### 聚类异常检测


  第二类异常检测技术侧重于聚类。聚类的概念是，我们根据数据点彼此之间的距离将它们分组。当数据点彼此足够接近时，我们将这些分组称为*簇*。我们不对数据中的底层关系做任何假设——即单个数据点最终是如何聚类在一起的。我们不假设数据遵循任何特定的分布，也不尝试构建输入与输出相关的模型。相反，我们只关心输出以及它们所形成的簇。


  当使用聚类技术进行异常值检测时，如果一个数据点距离任何给定的簇都足够远，我们就认为它是一个异常值。鉴于我们将异常值定义为距离常态足够远的点，这是有道理的，但这要求我们将对“常态”的理解从一个点（如分布的中心）扩展为一组点，其中每个点可能都独立于其他点。


  第 9 章到第 11 章将重点介绍如何将聚类技术整合到一个通用的异常检测服务中，而第 12 章将介绍一种有趣的聚类变体。




  ### 基于模型的异常检测


  本书将介绍的最后一类技术是建模技术。在这种情况下，我们会训练某种预期数据行为的模型。通常，这些模型遵循相似的路径：给定一个或一组输入，我们根据每个输入的价值为其分配权重，然后以某种方式将这些加权输入组合起来生成输出。这种技术被称为*回归*，在数据科学领域极为常见。我们预测短跑运动员成绩的公式就是回归的一个例子：


  ![$$ {T}_{Athlete}=f\left(A,B,\dots \right)+\varepsilon $$](img/521828_1_En_1_Chapter_TeX_Equc.png)


  在此，我们并未明确指定具体的权重或变量的组合方式，因为这些属于实现细节，取决于具体问题的性质。例如，我们可能假设预测奥运运动员的成绩基于一个线性模型，其中每个加权变量相加后得出对时间的估算，如下所示：


  ![$$ {T}_{Athlete}={w}_1{x}_1+{w}_2{x}_2+\dots +{w}_n{x}_n+\varepsilon $$](img/521828_1_En_1_Chapter_TeX_Equd.png)


  在这种情况下，异常值指的是实际计算出的数据点与预测数据点存在显著差异的情况。回到尤塞恩·博尔特的例子，我们可能会将一组加权输入代入模型，得到（例如）男子 200
  米比赛的成绩为 20.10 秒。当他以 19.30 秒完赛时，我们的预测偏差足够大，使得博尔特的成绩成为一个异常值。于是，我们可以凭直觉推断：博尔特并不遵循我们的常规模型，而是遵循另一种模型——该模型对输入变量的权重可能不同，甚至可能包含与其他运动员无关的变量。无论具体情况如何，一旦我们假设博尔特遵循不同的模型，就可以断言这些异常值实际上是异常点：它们是由与生成大部分数据不同的过程产生的。


  做出这一推断需要一个关键假设：我们选择的模型在绝大多数情况下都能充分拟合底层现象的行为。如果我们的模型不擅长预测结果，那么对异常值的描述就会出现错误，因为模型无法足够好地判断什么是正常行为。如果情况如此，我们就不应信任模型来告诉我们某个数据点是异常值。


  第 13 章至第 17 章将重点介绍基于模型的异常检测中一个特别有趣的变体：时间序列分析。


  ## 构建异常检测器


  现在，我们对什么是异常以及可能用于发现异常的技术有了高层次的理解，是时候开始构建一个异常检测服务了——这也是本书将贯穿始终的工作。然而，在编写一行代码或深入研究学术论文之前，我们需要更好地了解客户可能如何使用异常检测服务。目前，我们将探讨三个关键设计概念。


  ### 关键目标


  我们首先需要理解的是：异常检测服务的目的是什么？人们可能出于多种原因想要使用异常检测服务。第一个原因是当出现问题时向人类发出警报。例如，回到网络分析的案例，当出现导致用户无法看到相关网络资源的问题时，我们希望向系统管理员和开发人员发出警报。同时，我们不想就诸如自动机器人探测常见漏洞（且未能发现）或用户输错
  URL 等情况向工作人员发出警报。


  第二个原因与警报完全无关，即检验一个猜想。表 1-1 向我们展示了尤塞恩·博尔特在 2008 年奥运会上的速度之快，我们可以看到博尔特与其他选手之间的成绩差异非常显著。尽管如此，我们可能希望看到对数据更客观的分析，例如确定一名普通奥运运动员以博尔特的
  19.30 秒跑完 200 米的概率。这种回顾性分析并不必然导致后续的警报需求，因此它被标记为一个独立的用例。


  第三个使用异常检测服务的原因确实源于第一个用例中的警报场景，但它更进一步：我们可以利用异常检测服务让程序在无需人工干预的情况下修复问题。例如，假设你销售高端电脑显示器，平均零售价为
  1500 美元。一个重大节日即将来临，你希望将显示器价格打折 150 美元，以总计 1350 美元的价格出售。不幸的是，在尝试应用折扣时，你将`price`设置为
  150 美元，于是大量订单涌入，因为人们发现这款显示器的价格仅为零售价的 10%。这使公司陷入困境：要么允许订单并承受重大损失，要么取消订单并可能激起顾客和购物平台的愤怒——在后一种情况下，可能危及客户与平台的关系，甚至导致客户被禁止在该平台销售。一个警报服务可能会提示，这款显示器的价格范围从未偏离
  1300–1500 美元，而新价格与此截然不同。我们可以设想一个系统，在人工确认这确实是预期价格之前，阻止价格变更生效。


  最后，我们甚至可能不知道“正常”是什么样子，并希望发现它。例如，假设我们希望找出哪种类型的人最有可能购买 1500 美元的显示器。根据人口统计细节，我们可能会发现存在某些倾向于购买我们显示器的客户群体，并可以针对这些客户进行营销。这一过程中的异常值也很有趣，因为它们可能预示着潜在的客户群体——这些群体尚未购买我们的显示器，但如果我们更了解他们的需求，他们可能会倾向于购买。根据异常值的信息，我们的分析师可以进行市场研究，判断是否存在尚未开发的市场细分领域，如果存在，又该如何触达这些人群。




  ### 人类如何处理异常？


  接下来需要考虑的是，问问自己：使用你的异常检测服务的人类将如何处理异常值报告，并判断某个异常值究竟是真正的异常，还是仅仅是噪声？例如，是否存在人类应遵循的特定调查流程？在制造业场景中，我们可以想象对传感器进行异常检测，例如机器温度或某台机器在压制和折叠纸箱时所施加的压力。假设一名操作员观察机器温度，如果温度升高到可接受水平以上，操作员会按下按钮释放冷却剂。如果该操作未能将温度降至可接受水平，操作员会再按另一个按钮来降低运行速度。最后，如果温度仍然远超出正常参数范围，操作员会按下第三个按钮来停止生产线，直到机器冷却或技术人员完成对机器的检查。


  理解人们将如何使用你的异常检测服务之所以重要，是因为你或许能帮助他们自动化某些流程。在上述场景中，我们很容易想象一个系统将温度数据输入异常检测服务，并在给定时间范围内收到一定数量的异常值后，自动执行上述三个步骤。如果提供更精细的解决方案，也许该服务会在将警告写入日志的同时自动释放冷却剂。然后，如果系统降低了运行速度，它可能会向在职技术人员发出警报，让他们意识到问题，而将完全停机的选项留给人类。


  如果我们无法自动化这类活动，用户可能仍会发现异常检测服务的价值，因为它可以为调查提供基础。回到网站分析示例，异常数量的错误——无论是总体上异常大量的错误，还是特定类别错误（如`404`（文件未找到）或`403`（未授权））的异常数量——都能为系统管理员提供足够的信息，让他们深入日志，追踪可能导致行为变化的原因，无论是代码部署、基础设施变更还是服务故障。


  在这两种交互级别之间，我们还可以设想一种依赖于异常检测服务的服务，它在收到异常值后，会将某些内容排队等待人工审核。一个例子是对产品自动价格变动的人工审核。在大多数情况下，我们可能不希望人工审核价格变动，因为变动的产品数量可能相当大。然而，当某个产品的价格与其正常水平出现巨大差异时，在实际价格变动之前进行人工审核将是一个很好的案例。这可能会为公司避免后续的严重损失。


  在试图辨别服务调用者的具体意图时，最重要的问题是：当你向人类发出潜在异常警报时，他们需要具备哪些领域知识？根据我们公认的定义，异常必然是有趣的。人类拥有哪些信息使得这件事变得有趣，而不仅仅是另一起噪声事件？此外，这些信息中有多少我们可以自动化或转移给机器？并非所有事情都适合自动化，无论是由于缺乏合适的设备，还是因为不同人头脑中分散、主观的知识量过大，导致自动化解决方案不可行。话虽如此，异常检测服务存在的典型原因是为后续调查和潜在行动提供关于潜在异常的信息。


  ### 已知的未知


  在我们结束关于异常的讨论时，还有一个最后的考虑：我们对现有异常已经掌握了多少信息？假设我们有一台机器所有温度记录的历史数据。此外，一位专家仔细检查了每一条记录，并确定了机器是否运行异常，这使我们能够将高温与需要维修或报废的加工不良产品关联起来。有了这些信息，我们可以执行*监督学习*，这是机器学习的一个子集，它利用已知的正确信息对未知信息得出结论。监督学习在商业世界中是一种特别流行的机器学习类别——大多数机器学习问题往往符合监督学习场景，并且存在大量关于监督学习技术的工具和研究。


  不幸的是，对于异常检测来说，它往往不适合监督学习的范畴，因为我们很少有幸能拥有专家为我们构建全面的数据集。大多数情况下，我们必须执行*无监督学习*，这是机器学习的另一个类别，在这种学习中，我们对于某个特定数据点是否为异常，并没有已知的正确答案。相反，我们需要自己去发现该数据点是否异常。正如我们将在本书中看到的，有很多技术可以用于无监督学习，但所有这些技术都有一个前提：我们无法轻易确定异常检测器的正确（或错误）程度，因为我们缺乏关于什么是异常、什么不是异常的可靠信息。


  有时，我们可能了解一些先前的异常场景。这是两种变体之间的中间地带，被称为*半监督学习*。其思路是，我们可能拥有少量已知的正确数据，例如一些异常的历史记录，并利用这些信息像监督学习场景那样训练模型。从这个微小的样本出发，我们使用聚类技术来确定哪些数据点与已知异常足够相似，然后将这些相似的数据点标记为异常。我们可以将这些标记为异常值的点展示给人类，让他们告诉我们预测是否正确，从而在不花费大量时间和精力审查大量数据的情况下，扩展我们的已知输入数据。假设你有足够有效的数据来创建初始模型，半监督学习通常比无监督学习更准确。


  ## 结论


  在第一章中，我们阐述了异常值、噪声和异常的本质。异常值是与常态有显著差异的值。噪声和异常是异常值集合的划分。不感兴趣的异常值是噪声，而有趣的异常值则是异常。在任何涉及问题统计分析的地方，异常检测都很重要，这意味着异常检测在广泛的行业和领域中都有用武之地。


  本书将重点介绍三类异常检测技术：统计技术、聚类技术和基于模型的技术。每一类技术都带有自身对数据和场景的假设，并且各自都有其价值。我们将看到，某些类型的问题更适合某一类技术而非其他，因此充分理解所有三类技术非常重要。


  最后，我们探讨了异常检测中的人为因素。无论你的服务检测异常的能力有多强，它的价值都体现在为人类提供帮助的程度上。因此，理解服务使用者的需求有助于你构建极具价值的东西。尽管我们将重点讨论异常值检测和软件开发的技术方面，但在开发实际产品时，请务必牢记你的最终用户。




  '
- '# 2. 人类是模式匹配者


  在上一章中，我们了解了*异常值*、*噪声*和*异常*。我们还利用了人类直觉发现异常的能力。在本章中，我们将进一步了解人类如何解读和处理信息。具体来说，我们将重点关注格式塔心理学派的发现。


  ## 格式塔学派入门


  1912 年，马克斯·韦特海默撰写了一篇题为《运动视觉的实验研究》（*Experimentelle Studien über das Sehen von Bewegung*）的论文。在这篇论文中，韦特海默描述了*似动*的概念，即当物体并未移动时，观察者却感知到了运动。随后，韦特海默与同事库尔特·考夫卡和沃尔夫冈·苛勒共同创立了柏林格式塔心理学派，我们简称为格式塔学派。术语*格式塔*（*Gestalt*）意为“形式”或“图形”，代表了其理论的主要基础之一：我们的思维是以结构化整体而非单个感觉来运作的。简单来说，人们是基于心理模式来观察事物的。更具体地说，人们会以最简单的方式解读事物，这意味着我们倾向于将排列解读为元素更少而非更多、结构对称而非不对称，并且看起来像我们之前见过的事物。这就是*普雷格朗茨*定律（*Prägnanz*，意为“简洁”或“精炼”），考夫卡在其《格式塔心理学原理》一书中对此进行了最佳阐述。


  格式塔学派在学术界经历了起伏，过去一个世纪中受到了一系列批评和复兴。本书不会评判心理学领域研究者的各种主张与反驳，但我们会采纳那些拥有最多实验支持的发现，并将其作为理解人类行为的指南。


  ## 格式塔学派的关键发现


  本节的目标是回顾构成普雷格朗茨概念的四个关键格式塔学派发现。然后，我们将回顾这些发现的 12 个推论，并观察人类如何运用这些原则来观察视觉元素，并基于这些观察得出结论。


  ### 涌现性


  格式塔学派的第一个关键发现是*涌现性*概念。涌现性是指当大脑识别出熟悉的模式时，我们会立即且无需刻意努力地感知到事物。例如，我可能会觉得某朵云看起来像一只长颈鹿。这种感知并非我明确想要看到长颈鹿，而是自动发生的。一个从未见过长颈鹿（无论是实物还是图片）的人，不会像我一样观察那朵云。


  当然，四足哺乳动物并非我们大脑会无意识感知的唯一事物。另一个常见的例子是面孔。例如，图 2-1 是一张拍摄于中国天津的岩石照片。从我第一眼看到这块岩石起，我就知道它非常像经济学家和道德哲学家亚当·斯密。


  ![](img/521828_1_En_2_Fig1_HTML.png)


  一块酷似人脸的岩石。


  图 2-1


  中国天津的一块岩石，与亚当·斯密相似


  我们的大脑后来可能会拒绝这种关联，但那种即时的识别确实发生了。我最终可能会断定图 2-1 中的岩石实际上并不像亚当·斯密（尽管它确实很像！），但这并不能阻止那种即时的、前意识的解读发生。


  ### 具体化


  第二个关键发现与第一个紧密相关，即*具体化*概念。在此语境下，具体化意味着我们在识别时会感知到完整、有意义、具体的物体。此外，当我们确实识别出某个特定物体时，需要额外的脑力才能专注于抽象形状。


  例如，人类从人群中认出熟悉之人的能力，远比原始概率所假设的要强。在拥挤的餐厅里找到一群朋友出奇地容易，即使部分身体或面孔被桌子或路人遮挡。我们也非常擅长发现部分被遮挡的人或物，比如大部分身体被被子盖住的人，或者试图用爪子捂住眼睛来躲藏的小猫。


  一个基于具体化概念的笑话出自《辛普森一家》第八季的一集，名为《我们信任玛琦》。在这一集中，荷马在日本洗衣粉吉祥物“斯帕克尔先生”身上看到了自己的形象。这个吉祥物是由松村鱼业公司（以一条微笑的鱼为代表）和玉渊重工公司（一个灯泡）组合而成的。由于观众已经看过荷马·辛普森的脸超过七年，他们自然会把这个“鱼灯泡”与荷马联系起来。


  具体化也解释了迷彩的关键原理。严格来说，迷彩的目的并非让你隐形；相反，它的作用是打破你自然的形状，使他人更难完整地观察到你。在自然界中，迷彩以多种形式出现，例如条纹（老虎）、斑点（豹子）和反荫蔽（瞪羚）。对人类而言，迷彩通常出现在军事或狩猎场景中，具体图案取决于地形。一个特别有趣的历史例子是“眩目迷彩”，这是第一次世界大战期间涂在舰船上的一系列高对比度、相互交叉的几何图形。眩目迷彩的目的是让德国潜艇更难判断特定船只的速度和航向，从而使德国潜艇更难击沉英美船只。在这种情况下，迷彩实际上使船只更容易被发现，但（至少在理论上——关于眩目迷彩是否真的有效，结果尚无定论）却增加了瞄准和击沉船只的难度。


  ### 不变性


  第三个值得注意的发现是*不变性*概念。不变性意味着即使存在一定程度的变异，我们也能识别出大多数形状和图形。例如，我知道圆形是什么样子，即使这个圆形比我之前看到的更大或填充颜色不同，我也能识别出来。我可以观察一只从未见过的狗，并知道这是一只狗。此外，我还能在不同时间点识别出同一事物或同一个人——尽管有时会有困难。如果我十年没见过一位老同学，即使对方发型、穿着和腰围都变了，我可能仍然能认出这个人。这里发生的是，我们的大脑能够提取一个人或事物的基本特征，并让我们将其推广到其他情况和时间。


  然而，不变性并不等同于完美的记忆或理解。十二年前看过一张 DVD 封面，我今天可能就认不出来了。通常，那些我们最常见到或与我们联系最紧密的人或事物，即使有显著变化，也能随着时间的推移被识别出来。




  ### 多稳态


  我们最后的关键发现被称为*多稳态*。多稳态的概念是指，如果缺乏足够的视觉线索来解析特定情境，我们会在对场景的不同解读之间来回切换。例如，图 2-2 展示了一个文献中经典的例子——鲁宾的花瓶。鲁宾的花瓶以心理学家埃德加·鲁宾的名字命名，他本人并非格式塔学派心理学家，但却是科夫卡等人的同事和灵感来源。


  ![](img/521828_1_En_2_Fig2_HTML.jpg)


  一个瓶口宽阔、中部狭窄、底部宽大的花瓶，形似两张面孔。


  图 2-2


  由 Yamachem 制作的鲁宾花瓶变体，托管于 Open Clipart


  观看这幅图像时，我们的大脑可以解读出两种截然不同的图像：它要么是一个花瓶的图片，要么是两张相对的面孔。由于两种图像都可能成立，且对我们的大脑来说都有意义，我们难以判断哪一个是“正确”的图像，因此每个图像都会在我们的意识中占据一段时间，随后又被另一个所取代。这种状态会持续到我们获得足够的视觉线索来消除图像的歧义。对于鲁宾的花瓶而言，这通常是通过增加第三个维度来实现的，这样我们就能清晰地看到花瓶的深度或面孔的深度。增加这种深度消除了任何歧义，使得看到“错误”答案变得困难得多。


  ## 关键发现中蕴含的原则


  这四项关键发现本身很有趣，但它们也引出了一系列后续原则，我们可以利用这些原则来理解一个人如何解读眼睛发送给大脑的信号。本节总共将回顾 12 条原则，其排列顺序使得各原则能够相互递进。


  ### 意义性


  从上述发现中推导出的第一条原则是*意义性*原则。意义性是指我们可以将视觉元素组合在一起，形成有意义或相关的场景。这一原则直接源于涌现的概念。在图 2-1 中，我将几块岩石的形状组合在一起，解读出一张人脸，并赋予了该形态以意义。类似地，仰望云朵的人常常会看到形状或动物，这也是这种能力的副产品。在数据分析的背景下，我们可以查看散点图并辨别出数据中的趋势。趋势本身并非视觉元素，而是我们基于先前经验或直觉推断出来的东西。


  意义性的另一面是，我们可能会将某些属性归因于并非事实的事物。假设我们有一个随机数生成器，它以相等的概率生成 1 到 100 之间的整数，并打印出序列 `{8,
  9, 10}`。我们可能会看到一个趋势，并假设下一个值将是 11，但假设随机数生成器没有损坏，那么下一个数字*不是* 11 的概率是 99%。在这种情况下，我们识别出了一个虚假的趋势——或者用第
  1 章的语言来说，我们有一个形成离群值的序列，但结果证明它是噪声，而非真正的异常。


  ### 简洁性


  第二条原则是*简洁性*原则。人类倾向于将现实简化为尽可能简单的形式。例如，图 2-3 展示了两幅图像。左侧我们看到一幅图像。右侧是同一幅图像，但每个形状都有不同的颜色。在这两种情况下，我们都能立即感知到左侧的“形状”实际上是三角形、圆形和正方形的组合，正如我们在右侧看到的那样。


  ![](img/521828_1_En_2_Fig3_HTML.jpg)


  一幅分为两部分的插图。底部是一个正方形，中间是一个圆形，顶部是一个三角形。这些形状相互重叠。


  图 2-3


  即使形状重叠且缺乏明确的颜色差异或边界（如左侧所示），我们仍然能找到方法将它们分解为最小的有意义的元素


  我们看到三个形状而非一个的原因在于，我们脑海中没有与左侧物体相似的心理图像；因此，我们将其分解为我们能理解的组成部分。类似地，如果我给你看一张猫懒洋洋地躺在软垫椅子扶手上的照片，你会看到一把椅子和一只猫，而不是某种两者混合而成的怪物。这一原则与具体化的概念相关联，即我们尽可能地将事物感知为完整、有意义且具体的对象。如果我们经常将左侧的图像看作一个有着巨大莫西干发型但发际线严重后退的人物漫画，我们就会开始将其感知为一个整体对象，因为我们现在可以独立于其底层形状来赋予它意义。


  ### 闭合性


  第三条原则是*闭合性*原则，即大脑会自动补充缺失的视觉信息以完成图像。图 2-4 展示了一个闭合性的例子，我可以自信地说，你会分别看到一个正方形、一个圆形和一个三角形。


  ![](img/521828_1_En_2_Fig4_HTML.jpg)


  一个正方形、一个圆形和一个三角形由虚线构成。


  图 2-4


  由于闭合性原则，一个正方形、圆形和三角形出现在视野中


  我同样可以自信地说，这些图形实际上都不是正方形、圆形或三角形。相反，我们看到的只是这三个形状的标记被打散了，但我们的大脑会不假思索地“连接这些点”，为我们完成图案。同样的能力也使我们能够辨别出某个东西是什么，即使它被部分遮挡。例如，图
  2-5 展示了一条蜿蜒到树后的小径。尽管小径的一部分位于树后，超出了我们的视线，我们仍然可以合理地推断出存在铺路石完成了这条小径。


  ![](img/521828_1_En_2_Fig5_HTML.jpg)


  花园中一条蜿蜒到树后的小径。


  图 2-5


  我们的大脑“补全”了绕到树后的小径部分




  ### 相似性


  最强大的原则之一是*相似性*原则。该原则发现，我们会自然而然地根据颜色、大小、形状和其他视觉特征对项目进行分组。此外，在颜色方面，我们在讨论定义相似性的因素时，可以包括色相、饱和度、明度、鲜艳度和色温。当以灰度显示图像时，我们会丢失大量此类信息，但图
  2-6 仍然足够清晰，让我们能够看到三种不同的颜色（或印刷品中的灰色阴影）。


  ![](img/521828_1_En_2_Fig6_HTML.png)


  一张由 10 列 5 行圆点组成的示意图。


  图 2-6


  相似性原则的体现


  当我们观察图 2-6 中的图像时，在缺乏其他信息的情况下，人们倾向于认为相同颜色的圆点具有某种共同含义，例如，散布在图像中的黑色圆点都代表着与蓝色和黄色圆点无关的某种事物。由此，我们可以引入额外的复杂性，例如将一些圆点改为正方形和三角形。然后，我们会认为相似的颜色和形状代表同一事物，或许相同颜色的形状具有某种相似性，但并不完全等同。更进一步，我可能会包含各种颜色的更大和更小的形状，同样，在缺乏其他信息的情况下，我们倾向于认为尺寸相似的元素彼此之间具有共同点。随着我们增加更多层次的复杂性，这些假设会不断累积，你更有可能让观看者感到困惑，而不是阐明情况。即便如此，借助一些提示，我们的大脑可以毫无问题地跨多个视觉维度处理信息。


  ### 良好连续性


  第五个原则是*良好连续性*，即我们的大脑倾向于遵循平滑、可预测的路径。图 2-7 展示了良好连续性原则的一个示例。在这里，我们利用封闭性属性，从一系列圆点中看出两条线。最上面的一条线向下弯曲，与图像中间的一条直线相交。


  ![](img/521828_1_En_2_Fig7_HTML.jpg)


  一条由圆点组成的水平线。一条由圆点组成的最上面的线向下弯曲，与水平线相交。


  图 2-7


  封闭性和良好连续性原则让我们看到一条直线和一条曲线


  尽管图像中并没有实际的线条，但我们很容易从出现的圆点的间距中看出这两条线的轮廓，我们的大脑可以据此解读场景。此外，我们可以假设其他人也会以相同的方式解读这些线条——很少有人会看到三条（或更多）线条，或者认为这两条线没有相交。


  为了确保其他人确实看到两条不相交的线，我们可以引入颜色，并利用相似性原则。现在，在图 2-8 中，我们有两组圆点序列：黑色和蓝色（或印刷品中的灰色）。


  ![](img/521828_1_En_2_Fig8_HTML.png)


  一条由圆点组成的水平线。一条由圆点组成的最上面的线向下弯曲，与水平线相交。


  图 2-8


  我们的大脑天生抗拒图像中的不连续性


  随着颜色的变化，我们勉强看到线条彼此弯曲分开。这也给我们一个指示：某些原则比其他原则更强：相似性，尤其是在颜色方面，压倒了大多数其他原则，使我们能够引导观看者，尽管存在其他倾向。这也是一个很好的总结，说明为什么你不应该在视觉设计中过度使用颜色，因为这样做会失去吸引观看者注意力并纠正错误假设的能力。


  ### 图形与背景


  另一个与格式塔学派密切相关的原则是*图形*与*背景*的二元性。图形是我们图像的主体，而背景则代表主体周围的场景。我们可以利用视觉线索来决定什么是重要的图形，什么构成背景。通常，最好的线索之一是图形相对于背景往往更小。另一个线索是图形和背景在颜色上形成鲜明对比。


  回到格式塔学派的关键发现，多稳态的概念可以更好地表述为活动图形与背景之间的混淆。鲁宾的花瓶，如图 2-2 所示，就是一个例子，其中图形有两种可能的解读，导致我们轮流看到每一种，并持续一段时间。有趣的是，即使在这种多稳态的情况下，我们最终也不会出现面孔和花瓶同时成为图形的情况——一个必须是背景，而另一个则成为图形。


  ### 接近性


  *接近性*原则表明，我们会认为紧密排列在一起的事物比分散得更远的事物关联性更强。例如，图 2-9 展示了一系列沿直线分布的圆点。每个圆点的颜色和大小完全相同，但我们却看到了四个独立的组，这完全是由于圆点之间的间距造成的。


  ![](img/521828_1_En_2_Fig9_HTML.png)


  4 组圆点。第一组有 3 个圆点，第二组有 1 个，第三组有 2 个，第四组有 1 个。


  图 2-9


  尽管是相同颜色、相同大小的圆点，但我们根据接近性感知到了四个组


  这个接近性原则将联系到本书的第三部分，其中我们将介绍基于距离的异常检测技术。基于距离的异常检测技术依赖于一个假设：距离较近的数据点是相似的，如果我们有足够多的数据点足够接近，那么所有这些点都是内点。


  ### 连通性


  *连通性*是指我们倾向于将物理上连接的项目视为一个整体。举个简单的例子，想象一支经典的黄色 2 号铅笔。我们把铅笔本身说成一个东西，但它却由石墨芯、包裹石墨的木框、橡胶橡皮擦、将橡皮擦固定在木框上的金属箍以及木材上的黄色油漆涂层组成。当然，必要时我们可以专注于其中任何一个组件，但我们的默认解读是将铅笔视为一个整体。连通性可视为接近性原则的最终体现。


  ### 共同区域


  *共同区域*原则比接近性原则更进一步。根据共同区域原则，我们假设位于一个明确划分的空间区域内的东西必然是相似的。图 2-10 向我们展示了这种现象的一个示例。在这个例子中，我们有一系列规则的圆点，它们都具有相同的颜色、大小和形状。它们彼此等距排列，使得这个视觉画面尽可能同质。然后，我们画一个方框，作为一组圆点后面的背景。现在，方框内的所有圆点似乎都属于一个共同区域，而剩下的圆点则位于第二个没有方框的区域。


  ![](img/521828_1_En_2_Fig10_HTML.jpg)


  圆点排列成 10 列 5 行。前 6 列中的圆点位于一个高亮区域中。


  图 2-10


  灰色区域内的点属于一个视觉组，而区域外的点则隐含地属于第二个视觉组




  ### 对称性


  我们倾向于将对称排列的元素视为同一组的一部分。这就是**对称性**原则。尽管该原则以对称命名，但它同样适用于反射、旋转和平移。举例来说，如果我看到一个人站在镜子前，我的大脑不会将镜中的映像视为另一个人。再举一个更抽象的例子，我可以任意旋转一个三角形，但仍然能认出它是一个三角形。如果我看到两个三角形，其中一个的旋转角度与另一个不同，尽管存在旋转差异，我仍然会将它们归为一组。回到实际例子，一组箭头可以指引穿过走廊的路线，尽管后续的箭头指向不同方向——有时指向左，有时指向右，有时直行——我仍然可以将它们归为一组，视为我必须遵循才能到达目的地的方向序列。


  增加人们基于对称性进行匹配可能性的方法之一是运用相似性属性。回到之前箭头引路的例子，如果所有箭头颜色相同且大小相近，会有所帮助。这样做能降低人们认为一种颜色的箭头属于一组方向指示，而另一种颜色的箭头属于另一组方向指示的可能性。这种箭头引路的策略在医院中很常见，医院利用墙壁上的箭头和彩色线条来指示不同病房的方向。


  ### 共同命运


  **共同命运**原则指出，我们倾向于将朝同一方向移动的元素归为一组。例如，如果我们看到一条道路上满是朝一个方向行驶的汽车，我们会将其视为一个集合名词：车流。单个车辆成为单一心理组的一部分，但该组不包括同一图像中朝相反方向行驶的汽车。


  我们可以通过观察时间序列数据将这一点与可视化世界联系起来。两条序列的变动看起来越协调，我们就越倾向于将它们视为一个整体。图 2-11 展示了 1997 年 1
  月至 2021 年 7 月期间美国三个地区服装类消费者价格指数的示例。


  ![](img/521828_1_En_2_Fig11_HTML.png)


  标题为“各地区服装消费者价格指数”的折线图。图中的线条呈现下降趋势。


  图 2-11


  三个地区遵循相似的模式


  每条序列都遵循一个共同的模式，尽管中西部地区的序列在早期年份下降幅度更大。由于这些模式大致相同，具有相似的起伏，我们将这三条线解读为遵循一个共同模式，并且可以针对这三条独立的线谈论“这个”模式。


  ### 同步性


  我们将要介绍的最后一个原则是**同步性**。在这种情况下，我们将代表同步事件的视觉元素归为一组。另一种表述方式是，大约同时发生的多件事物似乎会相互关联。假设我向窗外望去，看到一辆汽车飞驰而过，紧随其后是一辆警车，警灯闪烁，警笛鸣响。我会自然而然地认为这两个事件相互关联，并且可能在脑海中构建一个故事来解释这种情况是如何发生的。


  然而，在思考同步性时，牢记“相关性并不意味着因果关系”这一概念非常重要。两件事在时间上接近发生，并不意味着它们就有关联。那两辆在路上飞驰的汽车可能实际上并无关联，也许警车正赶往一个重大事件现场，甚至没有时间报告或理会另一辆超速车辆。在这种情况下，这两个事件先后发生只是巧合。


  同步性和共同命运都在时间序列分析中扮演着重要角色，这将是第四部分的重点。


  ## 帮助人们发现异常


  我们可以利用格式塔原则，在以可视化格式展示数据时帮助最终用户发现异常。在下一节中，我们将总结一些关键技巧，你可以用它们来帮助报告查看者和应用程序用户发现离群值和异常。


  ### 使用颜色作为信号


  我们感知颜色差异的能力是人类最重要的信号指示器之一。即使对于患有各种形式色觉缺陷（俗称色盲）的人来说，发现颜色差异也是我们大脑无需刻意关注就能做到的事情。用格式塔术语来说，颜色是一种涌现现象。


  鉴于此，我们应该只在最有意义的情况下使用颜色变化。如果我们创建的可视化图像看起来像彩虹爆炸了一样，大量的颜色变化会压倒我们大脑有效处理变化的有限能力。结果，我们在图像中引入了噪声源。这种噪声可能与我们第一章（其中噪声是指不感兴趣的离群值）中定义的不完全相同，但它在分散观看者注意力这一点上是相同的。


  不要将颜色随意散布在可视化图像上，而应谨慎使用颜色变化来表示重要事项。通过限制可视化图像中使用的颜色数量，观看者将有可能发现离群值，从而使具有足够领域知识的细心观看者能够调查并确定离群值的原因。


  ### 限制无意义信息


  与我们第一点类似，我们希望限制可视化图像中的无意义信息。目标是让故事的重要部分成为图形而非背景。也就是说，可视化图像中争夺注意力的元素越多，就越有可能有一些多余的、无信息量的元素夺走我们的注意力。我们在这些原则中看到，人类擅长找出差异和发现离群值，但我们也同样看到，那些对我们有利的原则也可能反过来欺骗我们，让我们错过存在的东西，或者看到不存在的东西。




  ### 启用“串联线索”


  最后，要展示能让观众“串联线索”的内容，使他们能以最有效的方式运用自己的领域知识。实现串联线索的最佳方法是利用邻近性、相似性和共同命运等原则。


  在邻近性方面，应尽量以这样的方式布置视觉元素：让彼此靠近的点在相关维度上也接近。这在数轴上绘制点时很直观，因为彼此靠近的点在数值上也会相似。理想情况下，你可以调整比例尺，使得观众眼中靠近的点属于同一相关集群，而点之间的间隔则代表显著差异。你无法总是完美控制这一点，但需要考虑图像尺寸、坐标轴的最小最大值以及点的大小。


  为了提升观众运用相似性原则的能力，尽量使用相同的形状、颜色和大小来表示同类事物。如果确实使用了不同大小的形状，要确保大小代表一个有意义的连续变量，例如事件数量。同时，尽量保证比例尺的相对差异合理，避免出现某个点完全压倒其他所有点的情况。


  最后，关于共同命运原则，如果可能的话，尽量强调或指出那些运动轨迹相似的情况，将它们与不符合的元素区分开来分组。例如，查看图 2-11，我们可以看到三个地区在服装类别的消费者价格指数上走势非常相似。而实际上还有第四个地区，其表现略有不同。图
  2-12 展示了一个示例：用相同颜色表示具有共同命运的地区，并用不同颜色突出显示东北地区。


  ![](img/521828_1_En_2_Fig12_HTML.png)


  一张折线图，标题为“各地区服装类消费者价格指数”。图中有一条线被标注为“东北地区表现与其他地区不同”。


  图 2-12


  使用相同颜色表示具有共同命运的地区，从而让我们能够指出一个表现略有不同的地区


  ## 结论


  在马克斯·韦特海默的开创性论文发表一百多年后，格式塔学派仍然具有现实意义，尤其是在感官识别领域。深入理解本章阐述的原则，将极大帮助报告读者和应用程序用户理解你所提供的信息。这是一个值得称赞的目标，但在异常检测方面，仅凭这些原则还不足以创建一个能让计算机在数据中发现异常值的程序。即便如此，我们将在本书中多次回顾这些原则，因为归根结底，异常检测问题是一项人类事业：正是人类为异常值提供了必要的意义标准，从而将异常与单纯的噪声区分开来。


  '
- "# 3. 形式化异常检测\n\n在上一章中，我们探讨了人类用于执行离群值和异常检测的感官工具，并花时间理解了它们的工作原理。计算机不具备这些感官工具，因此我们需要使用其他流程来让它们检测离群值。具体来说，我们需要至少实现三种离群值检测方法中的一种，以便为计算机提供某种离群值检测流程。本章将开始阐述本书将涵盖的三种离群值检测方法中的第一种：统计方法。\n\
  \n## 形式化的重要性\n\n第 2 章明确指出，人类总体上非常擅长模式匹配和识别问题。人类在严酷生态系统中赖以生存的许多技能，同样有助于观察更平凡的事物，例如按业务部门和时间绘制的公司收入散点图。尽管如此，人类及其使用的工具都会犯错。在本节中，我们将探讨为何完全由人类驱动的离群值检测程序不太可能成功。\n\
  \n### “我一看就知道”是不够的\n\n将一组原始数据交给一个人，并期望从中获得完整准确的离群值集合，通常是一件徒劳无功的事情。我们的处理能力是矛盾的：在某些情况下，我们能够轻松地在海量信息中辨别出模式或发现异常，但即使是很小的数据集，如果没有正式的工具，也可能让我们的头脑不堪重负。此外，我们在前一章中讨论的许多格式塔见解都带有学习成分。例如，涌现发生在大脑*识别*出模式时，有意义性适用于*个人相关*的场景，而具体化则取决于我们*认出*某个事物。由于背景和经验不同，两个人可能不会在给定的数据集中发现相同的离群值。因为我们不能假设所有观众都具有相同的背景、经验和能力，所以将数据交给观众并期望得到输出是不可行的。\n\
  \n### 人类的易错性\n\n这也引出了下一点：人类会犯错。我们的眼睛并不完美，我们也不总能完美地回忆起特定的数值、模式或概念。由于我们容易忘记先前的模式、观察到虚假或不存在的模式，以及忽略眼前存在的模式，因此我们并非完全可靠的离群值检测工具。\n\
  \n然而，我不想过分强调这一点——人类*确实*非常擅长这项任务，并且应该成为任何异常检测系统的重要组成部分。至少，人类是必要的，以便为离群值赋予意义，并确定某个离群值最终是否属于异常。除此之外，人类还能提供一些能力，以发现机器或自动化技术遗漏的离群值。顺便提一下，这有助于我们了解自动化离群值检测过程的效果——如果人类经常发现该过程遗漏的异常，那可不是一个好兆头！\n\
  \n### 边缘离群值\n\n人类易错性的一类表现是边缘离群值的情况。在查看图表时，某些类型的离群值很容易发现。图 3-1 是我们在第 1 章中看到过的一张图片的复现，其中两个离群值很容易被识别出来。\n\
  \n![](img/521828_1_En_3_Fig1_HTML.png)\n\n一张散点图，横轴为传球码数，纵轴为得分。估计值分别为 (160, 24)、(290,\
  \ 17)、(310, 34)、(340, 31)、(380, 34) 和 (420, 44)。\n\n图 3-1\n\nNFL 单周比赛中得分与传球码数的关系。我们在图表上看到两个离群值，它们的得分均未达到\
  \ 20 分\n\n这些很容易发现，但最上面的那个点——四分卫传球约 415 码，其球队得到 44 分——是离群值吗？如果不是，那么如果他的球队得到 45 分或\
  \ 47 分呢？这个数据点需要得多少分才能成为离群值？人类非常擅长发现与常态差异很大的事物，但在注意到非常微小的差异时，我们的准确性往往大打折扣。因此，我们可能会遗漏那些刚好处于边缘的离群值，或者误将那些实际上是正常值但接近边缘的数据点纳入其中。\n\
  \n\n\n### 可视化的局限性\n\n最后，人类在审查可视化形式的数据时表现最佳。像图 3-1 这样的图表，能让我们比查看数字表格更高效地利用感官感知能力。人类可以很好地处理少量变量，但普通人一次能处理的最大变量数是五个：分别对应`X`、`Y`和`Z`轴各一个；一个用于表示数据点的大小；以及通过随时间在图表上移动数据点来捕捉时间度量。即便这样，在许多情况下也可能有些勉强，让我们通常只能舒适地处理不超过两三个变量。\n\
  \n这说明，一旦事情变得复杂，我们需要在越来越高的维度上审视关系时，人类的肉眼往往就不太灵光了。我们或许可以使用诸如降维之类的技术来简化分析工作，但即使是像主成分分析（`PCA`）这样的降维技术也有其局限性。在更复杂的场景中，我们可能仍然无法将成分数量减少到足够少，以便于轻松可视化。\n\
  \n## 第一个正式工具：单变量分析\n\n基于上一节的认知，我们可以引入额外的工具和技术来增强人类能力，并使领域专家更容易从数据集中识别出异常。在本章中，我们将从讨论统计分析技术开始，特别是*单变量分析*。术语“单变量”意为“一个变量”，指的是我们只有一个变量需要分析的数据集。当我们说“一个变量”时，是认真的：它仅仅是一组值的集合，我们可能用一维数组之类的东西来实现它。\n\
  \n这种方法听起来对于任何实际分析来说都过于局限，但在实践中，它实际上非常有效。在许多情况下，我们可以通过假设任何其他变量都是*独立的*（即没有外部变量影响给定数据点的值），将分析范围缩小到一个重要的输入变量。这是一个几乎永远不成立的朴素假设，然而在实践中它通常效果不错，足以让我们据此进行合理的统计分析。\n\
  \n### 分布与直方图\n\n在查看一维数据时，我们的关注点在于数据的分布。理解*分布*（或*统计分布*）的一个简单方法就是将其视为数据的形状。也就是说，在数据集中，某个特定值出现的频率有多高？对于一维数据，我们可以创建一种称为*直方图*的图表，它展示了数据集中某个值出现的频率。\n\
  \n在了解直方图的实际应用之前，我们先简要介绍一下变量的一个属性：变量是*离散的*还是*连续的*。离散变量具有有限且已知的可能值数量。如果我让你给一部电影打分，分数范围是\
  \ 1 到 5 星，5 星最高且不允许半星，那么我就创建了一个离散变量，它包含从 1 到 5（含）的一系列回答。相比之下，连续变量具有无限数量的可能值。但在实践中，“无限”通常意味着“非常大的数量”，而非真正的无穷。如果我询问一群人去年赚了多少钱（必要时换算成美元），我会得到各种各样的回答。虽然一个人一年能赚到的美元和美分数量是有限的——显然，不会超过去年全球所有国家的\
  \ GDP 总和——但在实践中我们仍认为这个变量是连续的，因为我们很可能会得到大量独特的回答。\n\n此外，在根据连续变量构建直方图时，我们通常不那么关心变量的精确值，而是可以用近似值来代替，从而将某个范围内的值聚合起来，作为一个组来显示，我们称之为*组距*。图\
  \ 3-2 展示了一个此类直方图的示例，其中包含了某个赛季中投球局数至少达到 150 局的美国职棒大联盟所有投手的自责分率（`ERA`），共有 4897 条记录。我使用\
  \ R 语言中的`ggplot2`库生成了这张图，该库默认使用 30 个组距。\n\n![](img/521828_1_En_3_Fig2_HTML.png)\n\
  \n直方图绘制了投手赛季次数与`ERA`的关系。估计值为 (1, 10), (3, 450), (4, 490), (6, 10), 和 (7, 0)。\n\n\
  **图 3-2**  \n使用 30 个组距的单赛季自责分率直方图\n\n图 3-3 展示了组距选择的重要性，我们将组距数量减少到了 5 个。\n\n![](img/521828_1_En_3_Fig3_HTML.png)\n\
  \n直方图绘制了投手赛季次数与`ERA`的关系。值为估计值。(1, 100), (2, 2400), (4, 2700), 和 (6, 250)。\n\n**图\
  \ 3-3**  \n当使用五个组距时，我们丢失了数据中的大量细节\n\n将数据减少到仅仅五个区间，我们丢失了巨大的数据保真度。话虽如此，对于所有数据集而言，并没有一个单一的“正确”区间数量。我们通常使用直方图来帮助理解数据的形状，因此“正确”的组距数量是能够在不引入过多噪声的情况下，为我们提供分布形状信息的数量。图\
  \ 3-4 展示了噪声的一个例子，我们将组距数量增加到了 500 个。\n\n![](img/521828_1_En_3_Fig4_HTML.png)\n\n\
  直方图绘制了投手赛季次数与`ERA`的关系。值为估计值。(1, 1), (3, 17), (4, 58), (4.5, 32), 和 (6, 1)。\n\n**图\
  \ 3-4**  \n组距过多和过少一样，都会妨碍我们对数据的理解\n\n在这种情况下，将数据分成 500 个组距妨碍了我们对数据分布的理解；组距实在太多，难以从生成的图像中看出什么名堂。在选择组距数量时，一个经验法则是减少组距数量，直到它不再像图\
  \ 3-4 那样看起来参差不齐。对于这个例子，这个数量大概在 30 到 50 个组距之间，而默认设置已经足以让我们对数据的整体感觉有一个概念。\n\n现在，我们对分布有了基本概念，并了解了一种可用于展示单变量分布的工具，接下来让我们简要介绍一下最著名的分布，以及它用于异常检测的一些相关属性。\n\
  \n\n\n### 正态分布\n\n*正态分布*（或称*高斯分布*）无疑是最广为人知的分布。这是任何学生在统计学课程中最早学习的分布之一，原因很充分：它易于理解，具有若干有用的性质，并且在实践中我们经常见到它，因此值得关注。尽管自然界中存在其他更常见的分布——例如对数正态分布——但让我们像统计学教科书一样，首先聚焦于正态分布。\n\
  \n图 3-5 展示了正态分布的*概率密度函数*（PDF）。\n\n![](img/521828_1_En_3_Fig5_HTML.png)\n\n一张图绘制了密度与数值的关系。估计值为（负\
  \ 4，0.0）、（0，0.4）和（4，0.0）。\n\n**图 3-5** 正态分布的概率密度函数。此 PDF 通过从正态分布中随机选取 15,000 个值并绘制所得密度函数生成\n\
  \n这张图向我们展示了两点：首先，如果我们从正态分布中随机选取一个点，得到某个特定值的可能性有多大。我们从 X 轴上的一个无穷小区间内选取一个特定值的概率，就是该值在\
  \ Y 轴上的高度。这告诉我们，我们更可能得到接近 0 的值，而不是远离 0 的值。其次，我们可以累加曲线下的面积，从而了解我们选取一个小于等于（或大于等于）X\
  \ 轴上某个特定值的可能性有多大。例如，如果我们累加曲线下直到-2 这个值的面积，这大约相当于曲线总面积的 2.5%。这告诉我们，如果我们从正态分布中随机选取一个点，我们选取到一个小于等于-2\
  \ 的点的概率大约为 2.5%。\n\n这两个性质几乎适用于我们将在第 3 章中看到的所有分布。现在我们对分布有了基本概念，接下来看看三个有助于我们理解大多数分布的度量指标。\n\
  \n### 均值、方差与标准差\n\n对我们而言，第一个重要的度量指标是*均值*，它是我们俗称“平均值”的两个术语之一（另一个是*中位数*）。我们可以通过`μ\
  \ = Σ values / N`来计算一组点的均值。换句话说，如果我们对数值求和并除以数值的个数，就得到了均值。\n\n在前面展示的正态分布示例中，均值为 0。由于正态分布的曲线是对称且单峰的，通过观察概率密度函数很容易确定均值：它就是峰值。对于其他分布，均值不一定那么容易找到，我们将在后文中看到。\n\
  \n既然我们已经弄清楚了均值，描述正态分布的另一个关键方式是*方差*，即曲线的分散程度。计算一组点的方差比计算均值稍微复杂一些：`σ² = (1/N) Σ (x_i\
  \ - μ)²`。换句话说，我们对每个点与均值之差的平方求和。然后，将其除以数据点的数量，就得到了方差的计算结果。\n\n一旦理解了方差，*标准差*就很简单了：标准差是方差的平方根。标准差对于正态分布是一个相当重要的度量指标，因为关于我们随机抽取一个点与均值相距一定距离的可能性，存在一些经验法则。图\
  \ 3-6 展示了这个 68-95-99.7 法则。\n\n![](img/521828_1_En_3_Fig6_HTML.png)\n\n一张图绘制了密度与数值的关系。估计值为（负\
  \ 4，0.0）、（0，0.4）和（4，0.0）。矩形的值为 68%、95%和 99.7%。\n\n**图 3-6** 正态分布遵循 68-95-99.7 法则\n\
  \n从图 3-6 中我们可以看到，抽取一个介于-1 和 1 之间的值的概率约为 68%。抽取一个介于-2 和 2 之间的值的概率为 95%。最后，抽取一个介于-3\
  \ 和 3 之间的值的概率约为 99.7%。这引出了我们对异常值的第一个技术性定义：如果给定点与均值的距离超过三个标准差，并且我们假设底层分布是正态分布，那么该点就是一个异常值。如果分布确实是正态的，这意味着大约每\
  \ 1000 个点中就有 3 个会落在正常范围之外。一个点离均值越远，它就越可能是异常的。假设我们发现一个点与均值相距六个标准差。那么，找到一个与均值相距六个标准差的数据点的概率大约为五亿分之一，因此，除非你处理数十亿行数据，否则这个与均值相距六个标准差的点极有可能并非来自我们的正态分布，而很可能来自其他某个分布。这类似于我们在第\
  \ 1 章中所说的，该数据点很可能是由其他过程生成的。\n\n在结束本节之前，让我区分一下*标准*正态分布和*一般*正态分布。标准正态分布是均值为 0、方差为\
  \ 1 的正态分布。任何其他遵循正态分布性质但均值不为 0 或方差不为 1 的分布，其运作方式仍然与正态分布类似。原因在于，我们可以对集合中的每个点执行等效操作，使其转化为标准正态分布。这在实践中意味着，我们可以对图\
  \ 3-7 中的所有分布应用同一套工具。\n\n![](img/521828_1_En_3_Fig7_HTML.png)\n\n一张图绘制了密度与数值的关系。它有三条正态曲线：均值=0\
  \ 标准差=1，均值=0 标准差=2，以及均值=3 标准差=0.6。\n\n**图 3-7** 此图表上显示了三个正态分布。第一个正态分布是标准正态分布，均值为\
  \ 0，标准差为 1。第二条较矮的曲线代表一个均值为 0、标准差为 2 的正态分布。第三条曲线的均值为 3，标准差为 0.6\n\n当方差不等于 1 时，我们可以将每个点乘以某个缩放因子，使方差变为\
  \ 1。当均值不为 0 时，我们可以加上某个因子（正数或负数），使均值变为 0。重要的是，这些操作不会影响数据中各元素之间的关系，这使得我们在实践中可以将一个分布视为正态分布，即使其均值或方差与标准正态分布不同。\n\
  \n### 其他分布\n\n正态分布是我们首先回顾的分布，因为它具有若干优良性质，并且在实践中经常出现。然而，它当然不是唯一与我们相关的分布。现在让我们看看另外三个分布，每个分布都有其独特的细微差别。请注意，由于时间和范围限制，本章不会涵盖所有分布。这些分布仍然可能很重要，因此请不要认为这组分布是全面的或涵盖了所有实际案例。\n\
  \n\n\n### 对数正态分布\n\n正态分布在我们生活中相当常见，但许多重要的事物并不遵循正态分布。例如，如果你观察某个州各城镇的人口数量、预算项目中的金额，或者一个国家所有居民的净资产，这些数据集并不服从正态分布。相反，它们遵循*对数正态分布*，这意味着数值的对数服从正态分布，而非数值本身。图\
  \ 3-8 展示了对数正态分布与正态分布的对比示例。\n\n![](img/521828_1_En_3_Fig8_HTML.png)\n\n一张密度与数值的关系图。对数正态分布是一条右偏曲线，正态分布则是一条标准正态曲线。\n\
  \n图 3-8\n\n对数正态分布与正态分布的对比，每个分布各使用了 15,000 个采样点。对数正态分布呈现出“长尾”效应。请注意，该图略有误差：此数据集中最小的对数正态值为\
  \ 0.02，因此所有值均大于 0。\n\n正态分布呈对称的“钟形曲线”，而对数正态分布则有一条“长尾”，这意味着你在峰值左侧看到数值的可能性要高于右侧。另一种描述方式是它具有*偏度*，即曲线的一侧比另一侧延伸得显著更远。\n\
  \n另一点需要注意的是，由于这是对数计算，集合中的所有值必须大于零，因为你无法对负数或零取对数。如果你的现象不可能为负（例如过去一年的收入），这便是一个提示，表明该分布更可能是对数正态分布而非正态分布。\n\
  \n如果你假设一个集合服从正态分布，而它实际上服从对数正态分布，你很可能会得到大量高值的异常点，而这些异常点最终被证明是噪声：也就是说，有些人确实那么富有，或者有些城市确实那么大。\n\
  \n### 均匀分布\n\n均匀分布是最容易理解的一种分布。如果我们有一个取值范围在 0 到 9（含）之间的均匀分布，那么得到值 0、9 或 5 的可能性是完全相同的。图\
  \ 3-9 展示了一个均匀分布的示例。\n\n![](img/521828_1_En_3_Fig9_HTML.png)\n\n一张计数与数值的直方图。估计值分别为\
  \ (0, 14900)、(1, 15000)、(3, 15100)、(5, 15000)、(7, 15100) 和 (9, 15000)。\n\n图 3-9\n\
  \n从 0 到 9 的均匀分布中抽取的 150,000 个点。由于这是一个样本点集合，计数上存在微小差异，而在均匀分布的理想形式中我们不会看到这些差异。\n\n\
  对于均匀分布，我们不能将任何单个点称为异常点，因为每个值出现的概率都相同。相反，如果我们有理由相信该分布应该是均匀的——例如在使用 SQL Server 等数据库中的\
  \ `RAND()` 函数或 Python 中的 `random()` 函数时——我们需要观察一系列事件，并计算在给定均匀分布下该序列发生的可能性。具体来说，掷六面骰子掷出\
  \ 6 点是很常见的——事实上，它应该以 1/6 的概率发生。但连续掷出 20 次 6 点，就会让人怀疑这个骰子是否被做了手脚。\n\n### 柯西分布\n\n\
  最后一种分布是一种华丽但所幸不常见的分布。柯西分布看起来很像正态分布，如图 3-10 所示。\n\n![](img/521828_1_En_3_Fig10_HTML.png)\n\
  \n一张密度与数值的关系图。估计值分别为 (负 50, 0.0)、(负 8, 0.02)、(0, 0.31)、(8, 0.01) 和 (45, 0.0)。\n\n\
  图 3-10\n\n一个包含 1000 个采样值的柯西分布示例。图中的“肥尾”现象十分明显。在该样本中，最小值为 -425，最大值为 222。相比之下，正态分布的范围会落在\
  \ -4 到 4 之间。\n\n关键区别在于柯西分布具有“肥尾”，而正态分布则没有。换句话说，正态分布渐近地趋近于零，这意味着你可以实际地忽略在均值六到七个标准差之外找到点的可能性，并且距离越远，这种可能性就越可以忽略。然而，对于柯西分布，始终存在一种现实的可能性，即得到一个看起来与你所认为的均值相差\
  \ 10 或 20 个标准差的点。我之所以需要用这种方式表述最后一句，是因为柯西分布实际上并没有均值或方差。在概率密度函数中，存在一个最高概率点，看起来可能像均值，但由于肥尾的存在，我们永远无法收敛到一个稳定的均值。\n\
  \n在自然界中，我们会在少数情况下看到柯西分布，主要是在光谱学领域。幸运的是，这些情况很少见，因为它们会大大增加我们判断某事物是否为异常现象的难度！\n\n##\
  \ 稳健性与均值\n\n到目前为止，我们主要关注围绕均值和标准差（尤其是正态分布）的异常值检测。在本节中，我们将理解为什么这种方法会给我们带来问题，以及我们可以采取什么措施。\n\
  \n### 异常值的敏感性\n\n使用均值和标准差进行异常检测的最大问题在于，它们对少量异常值非常敏感。假设我们的集合中有以下六个数据点：`{ 7.3, 8.2,\
  \ 8.4, 9.1, 9.3, 9.6 }`。计算该集合的标准差，我们得到值为 0.85。计算该集合的均值，我们得到值为 8.65。假设这些数据来自近似正态分布，并使用我们第一个关于异常的技术定义，我们可以认为，如果一个点与\
  \ 8.65 的距离在任一方向上超过 3 * 0.85，则该点为异常点。换句话说，根据我们上面的数据，正常值的范围应在 6.1 到 11.2 之间。\n\n现在让我们添加一个异常值：1.9。我们可以判断它是异常值，因为它远在我们的预期范围之外；因此，系统是有效的。但看看它对我们的系统造成了什么影响：加入值\
  \ 1.9 后，标准差变为 2.67，均值下降到 7.69。我们可接受值的范围现在变成了 -0.32 到 15.7，这意味着我们刚刚称之为异常值的那个点，如果再次出现，现在反而会变成正常值！\n\
  \n\n\n### 中位数与“稳健”统计\n\n均值和标准差存在的问题催生了“稳健”统计的发展，其稳健性体现在：在结果像之前示例那样崩溃之前，能够抵御一定数量的异常值。在计算平均值时，我们可以从非稳健的均值切换到稳健的*中位数*。中位数是数据集的第\
  \ 50 百分位数，也就是所有数值的中点。在前面的例子中，集合 `{ 7.3, 8.2, 8.4, 9.1, 9.3, 9.6 }` 的中位数是 8.75。计算方法是：成对地移除最小值和最大值，直到剩下一个或两个数值。在这个例子中，我们先移除\
  \ 7.3 和 9.6，再移除 8.2 和 9.3，剩下 8.4 和 9.1。由于剩下两个数值，我们取这两个数值的中点，即 8.75。\n\n接下来，我们可以计算*中位数绝对偏差*，简称\
  \ MAD。MAD 是另一种稳健统计量，可作为标准差的替代。其公式为 `MAD = median(|X_i - X̃|)`。也就是说，我们取每个数值与集合中位数之差的绝对值的中位数。由于我们的中位数是\
  \ 8.75，我们从每个集合元素中减去 8.75 并取绝对值，得到 `{ 1.45, 0.55, 0.35, 0.35, 0.55, 0.85 }`。这个集合的中位数是\
  \ 0.55。\n\n应用与之前类似的公式，我们可以将距离中位数超过三个 MAD 的值视为异常值。也就是说，如果一个数值与 8.75 的距离超过 `3 * 0.55`\
  \ 个单位（即超出 7.1 到 10.4 的范围），我们就将其标记为异常值。这里的 1.9 显然是一个异常值，但让我们看看它对我们后续计算的影响。\n\n集合\
  \ `{ 1.9, 7.3, 8.2, 8.4, 9.1, 9.3, 9.6 }` 的中位数是 8.4。这已经让我们看到了稳健性的实际体现：我们遇到一个异常值并立即将其排除。它确实将中位数拉低了，但只是拉低到下一个正常值点。然后，要计算\
  \ MAD，我们需要计算与 8.4 的差值的绝对值的中位数，即 `{ 6.5, 1.1, 0.2, 0, 0.7, 0.9, 1.2 }`。这个集合的中位数是\
  \ 0.9，因此 MAD 为 0.9。这意味着我们的可接受值范围扩大到了距离 8.4 的 `3 * 0.9` 个单位，即 5.7 到 11.1。范围确实有所扩大，但远没有之前那么严重——即使在这个扩大的集合中，我们仍然会将\
  \ 1.9 视为异常值。此外，MAD 从异常值中“恢复”的速度比标准差快得多，这意味着与使用非稳健统计量相比，使用稳健统计量时，我们的可接受值窗口打开得更慢、关闭得更快，这使得稳健统计量在我们数据集中恰好有多个异常值时，更不容易“隐藏”它们。\n\
  \n### 超越中位数：计算百分位数\n\n我们已经了解了一种百分位数的计算：中位数，即第 50 百分位数。在异常值检测中，还有其他有用的百分位数，而包含多个百分位数的最有用的可视化图表之一就是箱线图。图\
  \ 3-11 展示了一个箱线图的示例。\n\n![图 3-11](img/521828_1_En_3_Fig11_HTML.png)\n\n一个箱线图绘制了发票数量与年份的关系。它包含八个箱体。\n\
  \n一个箱线图至少包含五个有用的百分位数：最小值（第 0 百分位数）、最大值（第 100 百分位数）、中位数（第 50 百分位数），以及第 25 和第 75 百分位数。箱体本身由第\
  \ 25 和第 75 百分位数之间的范围构成，我们称之为*四分位距*（IQR）。我们可以看到中位数所在的一条线，这让我们了解数据的偏斜程度（因为向一个方向偏斜的数据会显示出中位数与外侧百分位数之间的距离，与其相反方向上的对应距离存在差异）。接着，我们看到从箱体延伸出的“须”。这些须代表距离箱体顶部或底部在\
  \ `1.5 * IQR` 个单位范围内的所有数据点。超出此范围的点即为异常值，这给出了我们关于异常值的第三个技术定义：异常值是指任何低于第 25 百分位数或高于第\
  \ 75 百分位数超过 1.5 倍四分位距的点。\n\n当我们开始收集这些关于异常值的技术定义时，重要的是要注意，这些定义并不保证完全重叠，这意味着一个过程可能将某个值称为异常值，而另一个过程可能将其称为正常值。我们将从第\
  \ 6 章开始处理这种复杂性。\n\n## 控制图\n\n在结束本章之前，让我们再看一种异常可视化的变体：*统计过程控制图*，我将其简称为控制图。控制图的主要目的是判断一个给定的过程是否按预期运行。控制图的一个常见用例是在制造业中，其中操作有特定的允许公差。例如，假设我们要监控一台将两块金属板铆接在一起的机器。我们知道铆钉的预期位置，也知道在需要修复或报废金属板之前，允许偏离该预期位置的最大方差。有了这些信息，我们可以创建如图\
  \ 3-12 所示的控制图。这种特定类型的图称为 I 图，它以固定间隔测量单个值，例如铆钉距离“完美”位置的距离。随着机器处理更多数据，我们随时间追踪这些值，并将每个值与均值进行比较。\n\
  \n![图 3-12](img/521828_1_En_3_Fig12_HTML.png)\n\n一个折线图绘制了数值与子组的关系。估计值为 (0, 4.5)、(10,\
  \ 2) 和 (25, 11)。矩形框值为 -1.9、1.2 和 4.3。\n\n一个称为 I 图的特定统计过程控制图示例。阴影区域代表距离均值线三个标准差的范围。最后两个数据点位于阴影区域之外，表明该过程刚刚“失控”\n\
  \n在此图中，我们看到预期值用一条线表示，可容忍范围用阴影区域表示。在美国，需要控制图的受监管行业通常将界限设定为均值两侧各三个标准差，这构成了图中的阴影区域。当你想到标准差是非稳健统计量这个问题时，这可能会让你犹豫，但这里有一个关键区别：在使用控制图时，我们预先计算了均值和标准差，并且不会根据新值进行更新。因此，如果新信息表明存在异常值，它不会影响阴影区域的位置或大小。\n\
  \n从这个例子中我们可以看到，该过程开始时处于“受控”状态，即位于阴影区域内。经过若干步骤后，它进入了“失控”状态，表明存在问题。使用我们之前的例子，我们可能会看到铆钉靠得太近，或者它们相对于应有位置太靠左或太靠右。无论原因是什么，控制图都告诉我们，需要采取行动并解决这个问题。\n\
  \n## 结论\n\n在本章中，我们从使用格式塔原则对异常值和异常进行可视化解释，过渡到了对异常值的统计理解。朝这个方向发展，使我们能够创建出比人类更一致地发现异常值的系统。\n\
  \n在下一章中，我们将开始构建这样一个系统，搭建出本书后续部分将使用的框架。\n\n\n\n"
- '# 第二部分：构建异常检测器


  构建异常检测器


  在本书的第二部分中，我们将构建一个异常检测引擎的框架，并完善四个用例之一：单变量异常检测。我们从第 4 章开始，概述工具和技术栈的选择，比较不同方案并做出实现决策。然后，我们将规划出本书后续部分使用的基本框架。第
  5 章承接第 4 章的内容，使我们能够在此过程中创建单元测试。框架搭建完成后，我们将在第 6 章实现第一个检测技术（以及第一个集成方法）。在第 7 章中，我们将进一步扩展，为符合正态分布的数据添加多种测试。最后，在第
  8 章中，我们将构建一个简单的 Web 应用程序来可视化我们的结果。


  '
- '# 4. 搭建框架


  到目前为止，我们一直专注于离群点和异常检测的理论方面。在后续章节中，我们仍需要多次深入探讨理论，但我们已经掌握了足够的知识，可以开始开发一个合适的异常检测服务了。


  在本章中，我们将为实时离群点检测服务搭建基础框架。然后，在下一章中，我们将集成一个测试库，以降低在迭代技术时破坏代码的风险。


  ## 行业工具


  在编写一行代码之前，我们需要做出几个重要决策：选择哪种编程语言、使用哪些包来简化流程，甚至如何与最终用户及其他程序交互。最后这一选择涉及协议以及如何*序列化*和*反序列化*数据，以确保在尽可能简化调用服务流程的同时，仍能兑现我们的承诺。


  ### 选择编程语言


  第一个重大选择是挑选编程语言。在本书中，我们将使用 Python 编程语言来开发服务。Python 是一种极其流行的编程语言，既可作为通用语言，尤其在数据科学和机器学习领域应用广泛。具体来说，我们将使用
  Anaconda 发行版的 Python，因为它自带了多种适用于异常检测项目的有用库。其中包括提供类似表格数据结构的 `pandas`、提供多种数学和统计函数的
  `numpy`，以及 Python 的机器学习库 `scikit-learn`。除了这些库之外，我们还会在本书中陆续介绍并使用更多其他库。


  当然，Python 并非构建异常检测服务的唯一编程语言。其他几种语言也具备内置功能或易于安装的库，使异常检测过程相当直接。例如，R 语言包含多种异常检测包，其中就包括优秀的
  `anomalydetector` 库。R 是一种出色的领域特定语言，专用于数据科学、数据分析和统计学。虽然它不一定是一种优秀的通用编程语言，但我们所需的功能完全在其能力范围之内，而且作者和技术编辑此前也曾合作，用
  R 语言构建过一个功能完备的异常检测服务。


  如果你希望使用通用编程语言，.NET 框架提供了两种非常适合异常检测引擎的语言：面向对象的 C# 和函数式 F#。这两种语言都可以配合多种包来简化统计分析。例如，`Math.NET`
  项目就包含多个旨在解决组合数学、数值分析和统计分析问题的包。


  简而言之，我们将使用 Python，因为它既是此类开发的不错选择，也是流行选择，但你不必拘泥于仅使用 Python 来完成这项任务。




  ### 做出管道决策


  在确定了语言选择之后，我们需要就最终用户如何与服务交互做出一些决定。首先要问的问题是：客户为什么需要这项服务？我们越了解他们想要解决什么样的问题，就越能定制服务以满足其需求。针对我们的场景，假设最终用户希望调用服务并近乎实时地获得响应，而不是发送大型数据集并请求对整个数据集进行批量操作。本书中使用的技术同样适用于这两种情况，但这一决策将导致我们向外界暴露服务的方式截然不同。


  鉴于我们希望允许最终用户在实时场景中进行交互，我们很可能希望选择*超文本传输协议*（HTTP）作为传输机制。我们也可以选择使用*传输控制协议*（TCP）套接字自行设计解决方案，但这会显著增加开发解决方案的开销，并且要求用户开发自定义客户端来与服务交互。开发自定义的
  TCP 解决方案可能会带来更好的性能，但这远远超出了本书的讨论范围。


  坚持使用 HTTP 作为首选协议后，我们有两种主要方式来创建服务，这两种方式在 Python 中都得到了广泛支持：远程过程调用框架 `gRPC`，或者使用 *JavaScript
  对象表示法*（JSON）构建*表述性状态转移*（REST）API，以便在服务与客户端之间传递数据。基于 `gRPC` 的解决方案具有一些显著优势，首先是有效载荷大小。`gRPC`
  中的有效载荷采用*协议缓冲区*（*Protobuf*）格式，这是一种二进制格式，能很好地压缩请求大小。相比之下，JSON 是一种相对较大且未压缩的文本格式。JSON
  比其他格式（如*可扩展标记语言*（XML））更紧凑，但 `Protobuf` 和 JSON 之间的有效载荷大小可能存在显著差异，尤其是在批量处理场景中。此外，使用
  `gRPC` 时我们拥有严格的契约，这意味着客户端确切知道服务器将提供什么、存在哪些参数和标志，以及如何构建请求。与早期的 REST API 实现相比，这是一个显著优势，尽管较新的
  REST API 实现了 OpenAPI 规范（以前称为 *Swagger*），该规范描述了 REST API。OpenAPI 规范提供了与 `gRPC` 在其契约中描述的信息类似的内容，从而大大简化了跨服务开发。


  出于本书的目的，我们将选择使用 JSON 构建 REST API。做出这一选择有三个原因。首先，使用 REST 允许我们利用免费可用的工具与服务交互，包括网络浏览器。`gRPC`
  框架对基于浏览器的交互支持非常有限，而 REST 则原生支持浏览器。选择 REST 而非 `gRPC` 的第二个原因是，支持 JSON 的 REST API 提供了人类可读的请求，使人们更容易解析和解释请求，并纠正客户端或服务中的潜在错误。虽然有技术可以将
  `Protobuf` 请求转换为 JSON，但出于教学目的，我们将坚持使用较慢但更易于理解的方法。我们选择 REST API 而非 `gRPC` 的最后一个原因是，更多开发者熟悉前者而非后者。向基于微服务开发的转变使
  `gRPC` 成为一个流行的框架，但我们在行业中拥有几十年的 REST 使用经验，并且已经解决了其大部分问题。然而，如果你正在为生产发布开发异常检测套件，`gRPC`
  将是一个很好的选择，特别是如果你开发的客户端或调用者熟悉该框架。


  ### 减少架构变量


  在确定了部分“管道”决策后，我们可以寻找其他方法来简化开发过程。例如，考虑到我们打算为调用者实现一个 REST API，有多个基于 Python 的框架可以简化
  API 开发，包括 `Flask` 和 `FastAPI`。`Flask` 是一个用于核心 API 开发的成熟包，并且与 `Gunicorn` 等代理解决方案集成良好。与此同时，`FastAPI`
  是一个较新的解决方案，具有许多优点，包括出色的性能以及使用名为 `ReDoc` 的工具自动实现 OpenAPI 规范。图 4-1 展示了基于我们将在本章开发的
  API 构建的文档示例。


  ![](img/521828_1_En_4_Fig1_HTML.png)


  FastAPI 0.1.0 的截图，显示用于下载文档的界面，包含 post univariate 和多个选项。


  图 4-1


  我们 API 的自动 API 文档


  除此之外，我们还可以使用 Docker 容器来部署应用程序。这样，无论你运行的是哪种操作系统，或者安装了哪些库，都可以轻松部署最终解决方案。使用我们构建的解决方案的容器版本是可选的，但如果你确实安装了
  Docker 并希望简化依赖管理过程，本章末尾提供了基于 Docker 部署的说明。


  ## 开发初始框架


  在决定了语言和技术之后，是时候开始开发了。在本节中，我们将安装托管 API 所需的先决条件。然后，我们将创建一个存根 API。在下一节中，我们将开始填充细节。




  ### 战场准备


  如果你想跟着本书的步骤，创建自己的异常值检测 API 服务，你需要在电脑上安装 Python 3.5 或更高版本。最简单的入门方法是安装 Anaconda 发行版的
  Python，地址为 [`https://anaconda.com`](https://anaconda.com)。然后，安装 Anaconda 个人版，该版本适用于
  Windows、macOS 和 Linux。Anaconda 还预装了许多 Python 库，使其成为数据科学和机器学习操作的绝佳选择。


  接下来，如果你还没有获取本书的代码仓库，请访问 [`https://github.com/Apress/finding-ghosts-in-your-data`](https://github.com/Apress/finding-ghosts-in-your-data)
  获取，并根据 `\src\README.md` 中的说明进行操作，具体取决于你是想跟着本书的代码创建自己的异常值检测器，还是想使用代码库的完整版本。请注意，如果你想跟着本书的代码操作，你仍然需要参考代码的完整版本，因为为了节省篇幅，某些代码段会被省略。


  该仓库包含几个文件夹。`\doc\` 文件夹包含项目的基本文档，包括如何运行项目的不同部分。`\src\app\` 文件夹包含我们将在本书中逐步创建的代码库的完整版本。`\src\comp\`
  文件夹包含我们将在本书最后一章中介绍的对比工作。`\src\web\` 文件夹包含一个配套网站，我们将在本书中创建并持续更新。离开 `\src\` 目录，`\test\`
  文件夹包含两组独立的测试：一组单元测试和一组集成测试。最后，我们还有一个 `Dockerfile`，供希望将解决方案作为 Docker 容器运行的人使用，以及一个
  `requirements.txt` 文件。


  安装 Anaconda（或类似的 Python 变体）后，打开代码仓库中的 `requirements.txt` 文件。该文件包含一组包，每行一个，我们将在本书中使用这些包。你可以使用
  `pip` 包管理系统手动安装这些包，也可以在仓库的根目录下打开一个 shell 并运行 `pip install -r requirements.txt`。


  **提示**


  如果你收到一条错误消息，提示找不到 `pip`，请确保你的 `Path` 环境变量包含 Anaconda 及其目录。例如，如果你将 Anaconda 安装在 `E:\Anaconda3`，请将该目录以及
  `E:\Anaconda3\Library\bin`、`E:\Anaconda3\Library\usr\bin\` 和 `E:\Anaconda\Scripts`
  添加到你的路径中。然后，重启你的 shell 并重试。


  如果你使用的是 Anaconda，你需要确保你在一个新的 conda 环境下工作。你可以在代码仓库的主目录下使用命令 `conda create --name
  finding_ghosts` 在 conda 中创建一个环境。然后，使用 `conda activate finding_ghosts` 激活该环境。之后，你就可以运行
  `pip` 命令，而不会影响其他包的安装。


  ### 构建 API 框架


  现在我们已经安装好所有东西，让我们来构建一个 API。如果你已经从配套仓库中获取了源代码，请务必将现有的 `app` 文件夹重命名为类似 `app_complete`
  的名称。然后，创建一个新的 `app` 文件夹。在这个文件夹内，创建一个名为 `__init__.py` 的空 Python 文件，确保在“init”前后各有两个下划线。这个文件有助于让
  Python 解释器知道我们的 `app` 文件夹包含一个 Python 模块的代码。创建此文件后，再创建另一个名为 `main.py` 的文件。这个文件将是我们
  API 的入口点。用你选择的编辑器打开这个新文件。如果你没有偏好的编辑器，三个不错的选择是 Visual Studio Code、Wing IDE 和 PyCharm。Anaconda
  还附带 Spyder，这是另一个 Python 集成开发环境（IDE）。


  在 `main.py` 的顶部，输入代码清单 4-1 中的代码。这将确保我们可以引用 API 所需的项目和库。


  ```

  from fastapi import FastAPI

  from pydantic import BaseModel

