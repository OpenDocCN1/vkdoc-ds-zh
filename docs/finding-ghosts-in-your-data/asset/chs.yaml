- "# 7. 扩展集成模型\n\n第 6 章为我们提供了前三个离群点检测测试。在本章中，我们将在先前工作的基础上，包含几个额外的测试。我们还将重构现有代码，重新思考一些设计选择，并完成单变量统计分析的核心要素。\n\
  \n## 添加新测试\n\n我们在前一章中添加的三个测试非常有用，甚至可能足以单独解决许多常见的单变量离群点检测问题。然而，如果你的输入数据遵循特定的形状，还有其他测试在追踪离群点方面非常有用。具体来说，如果数据足够接近正态分布，我们可以执行几种测试。\n\
  \n> **注意：** 在第 3 章中，我们描述了各种分布，包括正态分布。简要总结一下，*标准*正态分布的均值为 0，方差为 1。*一个*正态分布是指我们可以仅通过加法和乘法，将数据转换到正态分布，而不会扭曲数据点之间的关系。在本章的其余部分，任何对正态分布（甚至提到“标准”正态分布）的引用都将指代更通用的概念，而不是均值为\
  \ 0、方差为 1 的特定正态分布。\n\n\n\n### 正态性检验\n\n有多种检验方法可以判断特定数据集是否服从正态分布。我们将介绍的第一种检验称为夏皮罗-威尔克检验。该检验以塞缪尔·夏皮罗和马丁·威尔克命名，在判断给定样本是否近似正态分布方面通常最为准确。在\
  \ Python 中，夏皮罗-威尔克检验是 `scipy.stats` 库中的一个函数。\n\n第二种检验称为达戈斯蒂诺 K 平方检验，以拉尔夫·达戈斯蒂诺命名。该检验衡量数据集呈现的*偏度*和*峰度*。在统计学中，样本的偏度衡量的是左尾更长（负偏态）、右尾更长（正偏态）还是两尾长度相等（无偏态）。图\
  \ 7-1 展示了一个无偏态的正态分布示例，以及一个呈现正偏态的对数正态分布。\n\n![](img/521828_1_En_7_Fig1_HTML.png)\n\
  \n该图绘制了密度与数值的关系。对数正态曲线是右偏曲线，正态曲线是正态曲线。\n\n图 7-1\n\n正态分布无偏态。相比之下，对数正态分布呈现正偏态\n\n\
  数据集的峰度表示分布尾部所含的数据量。正态分布的峰度为 3，随着峰度增加，出现异常数据点的可能性也随之增加。使用图 7-1 中的数据集，我们的正态分布偏度为 0，峰度为\
  \ 2.99。对数正态数据集的偏度为 5.34，峰度为 58.34。\n\n达戈斯蒂诺 K 平方检验（即 `scipy.stats` 中的 `normaltest()`\
  \ 函数）利用这些度量来估计数据集的分布是否与正态分布存在显著差异。\n\n我们将使用的第三种检验是安德森-达林检验，以西奥多·安德森和唐纳德·达林命名。该检验与夏皮罗-威尔克检验类似。其精确度通常不如夏皮罗-威尔克检验，但在\
  \ Python 中，`anderson()` 函数可在多种显著性水平下执行检验，这意味着你可以一次性在多个显著性水平上进行测试。\n\n代码清单 7-1 包含了本章的新导入语句以及三个函数调用中的两个：夏皮罗-威尔克检验和达戈斯蒂诺\
  \ K 平方检验。\n\n```\nfrom scipy.stats import shapiro, normaltest, anderson, boxcox\n\
  import scikit_posthocs as ph\nimport math\ndef check_shapiro(col, alpha=0.05):\n\
  return check_basic_normal_test(col, alpha, \"夏皮罗-威尔克检验\", shapiro)\ndef check_dagostino(col,\
  \ alpha=0.05):\nreturn check_basic_normal_test(col, alpha, \"达戈斯蒂诺 K² 检验\", normaltest)\n\
  def check_basic_normal_test(col, alpha, name, f):\nstat, p = f(col)\nreturn ( (p\
  \ > alpha), (f\"{name}检验, W = {stat}, p = {p}, alpha = {alpha}.\") )\n代码清单 7-1\n\
  运行两个基本的正态性检验\n```\n\n这两个检验的形式相似，因此我们将代码集中到 `check_basic_normal_test()` 中，该函数接受四个参数：DataFrame\
  \ 中的值（`col`）、在将结果标记为非正态之前允许结果偏离正态分布程度的指标（`alpha`）、用于标记的函数名称（`name`）以及实际的函数名（`f`）。在\
  \ Python 中，我们可以将一个函数作为另一个函数的输入。这样做时，请注意，无论是在 `check_basic_normal_test()` 的参数中，还是在\
  \ `check_shapiro()` 或 `check_dagostino()` 的调用中，我们都不在函数名后加括号。我们将函数调用 `f(col)` 保留在\
  \ `check_basic_normal_test()` 的函数体内，在其中我们调用 `shapiro()` 或 `normaltest()` 并将 `col`\
  \ 作为参数传入。这些检验会计算一个 p 值，并将其与我们提供的 `alpha` 参数进行比较。如果 p 值大于 alpha，则我们假设该样本可能来自正态分布。如果\
  \ p 值小于或等于 alpha，我们认为数据不是正态的。\n\n代码清单 7-2 包含了安德森-达林检验。由于该检验涉及的内容比其他检验更多，它不能完全套用相同的模式，因此我们需要采用略有不同的方式。\n\
  \n```\ndef check_anderson(col):\n#### 首先假设为正态性。\nanderson_normal = True\nreturn_str\
  \ = \"安德森-达林检验。\"\nresult = anderson(col)\nreturn_str = return_str + f\"结果统计量: {result.statistic}\"\
  \nfor i in range(len(result.critical_values)):\nsl, cv = result.significance_level[i],\
  \ result.critical_values[i]\nif result.statistic < cv:\nreturn_str = return_str\
  \ + f\"显著性水平 {sl}: 临界值 = {cv}, 看起来呈正态分布。 \"\nelse:\nanderson_normal = False\nreturn_str\
  \ = return_str + f\"显著性水平 {sl}: 临界值 = {cv}, 看起来不呈正态分布！ \"\nreturn ( anderson_normal,\
  \ return_str )\n代码清单 7-2\n安德森-达林正态性检验\n```\n\n安德森-达林检验会提供一个结果统计量，并允许你将该统计量与每个显著性水平（即每个\
  \ alpha 值）的临界值进行比较。每个显著性水平的临界值取决于输入数据点的数量。图 7-2 展示了针对通过正态性检验的数据集，夏皮罗-威尔克检验、达戈斯蒂诺检验和安德森-达林检验的示例结果。\n\
  \n![](img/521828_1_En_7_Fig2_HTML.png)\n\n针对通过正态性检验的数据集，夏皮罗-威尔克检验、达戈斯蒂诺检验和安德森-达林检验的伪代码。\n\
  \n图 7-2\n\n三次正态性检验的结果。注意，安德森-达林检验的显著性水平范围是从 0 到 100，而非 0 到 1\n\n在此图中，我们可以看到夏皮罗-威尔克检验和达戈斯蒂诺检验的\
  \ p 值都远高于 0.05，因此该数据集通过了这些正态性检验。对于安德森-达林检验，结果统计量的值为 0.141。为了将数据集视为来自正态分布，该数值应低于每个显著性水平的临界值。正如我们所见，统计量值\
  \ 0.141 远低于 15% 显著性水平的临界值 0.501，因此也低于更弱的显著性水平。相比之下，图 7-3 展示了一个输入数据集似乎并非来自正态分布的示例。\n\
  \n![](img/521828_1_En_7_Fig3_HTML.png)\n\n针对似乎并非来自正态分布的输入数据集，夏皮罗-威尔克检验、达戈斯蒂诺检验和安德森-达林检验的伪代码。\n\
  \n图 7-3\n\n一个明显非正态的样本\n\n\n\n在这种情况下，Shapiro-Wilk 检验和 D’Agostino 检验的 p 值均远低于 0.05，这意味着两项检验都表明该数据集似乎并非来自正态分布。Anderson-Darling\
  \ 检验的统计量值大于 5.0，远高于 15% 显著性水平下的 0.501，甚至超过了 1% 显著性水平下的 0.951。\n\n现在我们已经完成了三项检验，接下来要构建另一个函数，该函数能够判断何时调用每种方法、进行调用、汇总结果，并判定输入数据集是否服从正态分布。清单\
  \ 7-3 包含了该函数的代码。\n\n```\ndef is_normally_distributed(col):\nalpha = 0.05\nif col.shape[0]\
  \ = 5k. n = {col.shape[0]}\"\nif col.shape[0] >= 8:\n(dagostino_normal, dagostino_exp)\
  \ = check_dagostino(col, alpha)\nelse:\ndagostino_normal = True\ndagostino_exp =\
  \ f\"D'Agostino's test did not run because n < 8\\. n = {col.shape[0]}\"\n(anderson_normal,\
  \ anderson_exp) = check_anderson(col)\ndiagnostics = {\"Shapiro-Wilk\": shapiro_exp,\
  \ \"D'Agostino\": dagostino_exp, \"Anderson-Darling\": anderson_exp}\nreturn (shapiro_normal\
  \ and dagostino_normal and anderson_normal, diagnostics)\n清单 7-3\n一个用于判断输入数据集是否服从正态分布的函数\n\
  ```\n\n该函数首先将 alpha 值设为 0.05，遵循我们的一般原则：不让用户做出需要详细统计知识的选择。然后，如果数据集包含的观测值少于 5000 个，则运行\
  \ Shapiro-Wilk 检验；否则跳过该检验。如果我们至少有八个观测值，则可以运行 D’Agostino 的 K 平方检验。最后，无论样本量大小如何，我们都可以运行\
  \ Anderson-Darling 检验。\n\n在基于这三项检验做出判定时，我们需要做出类似于集成学习权重分配的决定。我们可以进行简单投票，或者对某些检验赋予更高的权重。在本例中，我们将采用简单的一致同意规则：如果所有三项检验都一致认为数据集服从正态分布，那么我们就假定它是正态分布的；否则，我们就假定它不服从正态分布。诊断结果会生成我们在图\
  \ 7-2 和图 7-3 中看到的 JSON 片段。\n\n### 趋近正态分布\n\n既然我们已经有了正态性检验的方法，那么接下来自然会问：如果我们需要正态分布的数据，而我们的数据集并非正态分布，我们能否对此做些什么？这个问题的答案是肯定的：“很可能可以！”\n\
  \n有几种技术可以将数据转换得看起来更像服从正态分布。其中或许最流行的是 Box-Cox 变换，它以乔治·博克斯和大卫·考克斯的名字命名。Box-Cox 变换根据清单\
  \ 7-4 中的公式对一个变量进行变换。\n\n***清单 7-4.*** Box-Cox 变换背后的公式\n\n![$$ y=\\left\\{\\begin{array}{c}\\\
  \ \\log (x)\\kern1.25em if\\ \\lambda =0;\\kern0.75em \\\\ {}\\frac{\\left({x}^{\\\
  lambda }-1\\right)}{\\lambda}\\kern1em otherwise.\\end{array}\\right. $$](img/521828_1_En_7_Chapter_TeX_Equa.png)\n\
  \n假设我们有一个目标变量 *x*。这代表我们单变量数据集的单一特征。我们想要将 x 的值转换为一个服从正态分布的变量，我们称之为 *y*。给定某个 lambda\
  \ (λ) 值，我们可以通过执行两种操作之一来实现这一点。如果 lambda 为 0，那么我们对 x 取对数，结果即为 y。这对于我们在第 3 章中看到的对数正态分布数据效果很好。否则，我们有一个非零的\
  \ lambda，将 x 提升到该次幂，从结果中减去 1，再除以 lambda。Lambda 可以是任何正值或负值，尽管 Box-Cox 变换中常用的值范围在\
  \ -5 到 5 之间。\n\n这就引出了下一个问题：我们如何知道 lambda 的正确值是多少？嗯，SciPy 库为我们提供了一个解决方案：`scipy.stats.boxcox()`\
  \ 接受一个可选的 lambda 参数。如果你为 lambda 传入一个值，该函数将使用该值执行 Box-Cox 变换。否则，如果你没有为 lambda 参数指定值，该函数将确定\
  \ lambda 的最优值并将其返回给你。即使我们得到了 lambda 的最优值，也不能保证变换后的数据实际上服从正态分布，因此，我们应该在之后检查结果，看看我们的变换效果如何。\n\
  \n考虑到上述情况，清单 7-5 展示了我们用于对输入数据集进行正态化的代码。\n\n```\ndef normalize(col):\nl = col.shape[0]\n\
  col_sort = sorted(col)\ncol80 = col_sort[ math.floor(.1 * l) + 1 : math.floor(.9\
  \ * l) ]\ntemp_data, fitted_lambda = boxcox(col80)\n#### Now use the fitted lambda\
  \ on the entire dataset.\nfitted_data = boxcox(col, fitted_lambda)\nreturn (fitted_data,\
  \ fitted_lambda)\n清单 7-5\n使用 Box-Cox 技术对输入数据进行正态化的函数\n```\n\n我们做的第一件事是找出输入数据中间 80%\
  \ 的部分。这样做的理由是，Box-Cox 变换在数据变换方面非常有效。事实上，它效果如此之好，以至于可能会掩盖数据中的异常值，并使后续检验在识别异常值方面失去很多价值。因此，我们将重点关注中间\
  \ 80% 的数据，这部分数据通常预计不会包含太多异常值。对中间 80% 的数据运行 `boxcox()`，我们会得到一个拟合的 lambda 值。然后，我们可以将该值作为参数传入，对整个数据集执行变换，并返回整个拟合数据集以及我们从中间\
  \ 80% 数据构建的拟合 lambda 值。\n\n我们在清单 7-6 中使用了这一点，该清单包含了关于我们能否对数据进行正态化以及正态化成功程度的规则。\n\
  \n\n\n```python\ndef perform_normalization(base_calculations, df):\n    use_fitted_results\
  \ = False\n    fitted_data = None\n    (is_naturally_normal, natural_normality_checks)\
  \ = is_normally_distributed(df['value'])\n    diagnostics = {\"Initial normality\
  \ checks\": natural_normality_checks}\n    if is_naturally_normal:\n        fitted_data\
  \ = df['value']\n        use_fitted_results = True\n    if ((not is_naturally_normal)\n\
  \        and base_calculations[\"min\"] > 0\n        and df['value'].shape[0] >=\
  \ 8):\n        (fitted_data, fitted_lambda) = normalize(df['value'])\n        (is_fitted_normal,\
  \ fitted_normality_checks) = is_normally_distributed(fitted_data)\n        use_fitted_results\
  \ = True\n        diagnostics[\"Fitted Lambda\"] = fitted_lambda\n        diagnostics[\"\
