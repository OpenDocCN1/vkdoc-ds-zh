  一张散点图。在右侧、左侧和左上角形成了三个聚类。


  图 9-3


  三个新的聚类质心凭空出现


  创建这些质心后，我们计算每个数据点距离哪个质心最近，并将其分配到该质心所在的聚类。图 9-4 展示了分配的结果。


