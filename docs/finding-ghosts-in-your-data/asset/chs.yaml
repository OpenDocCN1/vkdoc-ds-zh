  \ = base_calculations[\"min\"] > 0\n        enough_observations = df['value'].shape[0]\
  \ >= 8\n        diagnostics[\"Fitting Status\"] = f\"Elided for space\"\n    return\
  \ (use_fitted_results, fitted_data, diagnostics)\n```\n\n清单 7-6 — 对数据集执行归一化的函数\n\
  \n`清单 7-6` 首先检查数据是否已经服从正态分布。如果是，则无需执行任何变换，可以直接使用原始数据。否则，在满足以下所有条件时，我们会执行 Box-Cox\
  \ 变换：第一，数据必须不服从正态分布；第二，数据必须存在一定的方差；第三，数据中所有值必须大于 0，因为无法对 0 或负数取对数；第四，我们需要至少八个观测值，Box-Cox\
  \ 变换才能生效。\n\n如果满足所有这些条件，则调用 `normalize()` 函数，获取拟合后的数据和 lambda 值。然后，对得到的数据集再次调用 `is_normally_distributed()`。请注意，由于我们基于数据集中央的\
  \ 80% 来配置 lambda 值，因此变换后数据中可能*仍然*存在极端异常值，导致最终结果仍是非归一化的。因此，我们会记录结果，但不会让 `is_normally_distributed()`\
  \ 阻止我们继续执行。\n\n如果未满足所有相关条件，我们会找出哪些条件不满足，并将其写入诊断字典。最后，将所有结果返回给最终用户。现在，我们有了一个在需要时对数据进行归一化的函数，接下来可以更新\
  \ `run_tests()` 函数，将其纳入其中，并添加一系列新测试。\n\n### 新测试的框架\n\n到目前为止，无论数据形态和观测数量如何，我们都有三个必须运行的测试。除了这三个测试，我们还应该添加在特定场景下有意义的测试。`清单\
  \ 7-7` 展示了更新后的 `run_tests()` 函数框架，该函数将能够运行所有统计测试。\n\n```python\ndef run_tests(df):\n\
