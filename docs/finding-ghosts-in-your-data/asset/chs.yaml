  其他方法将具有非常相似的方法签名，尽管每个调用都需要自己的模型。对于多变量异常检测，我们将用值列表替换名为 `value` 的单个浮点数。单输入时间序列异常检测将恢复使用单个值，但会包含一个用于日期和时间的
  `dt` 参数。最后，多序列时间序列异常检测将添加日期以及一个 `series_key` 值，该值表示给定数据点所属的特定时间序列。


  在勾勒出 API 应有的样子之后——并且理解到我们尚未完成，因为我们需要在设计过程中整合调试信息——我们可以为四种检测方法中的每一种创建桩代码。*桩代码*或*桩方法*是一种快速开发技术，我们硬编码函数的输出签名，以便在填充所有细节之前，可以先处理调用此函数的操作。创建桩方法使我们能够解决创建
  API 的更高层次问题，并确保 API 代码本身在尝试处理更艰巨的异常检测实现任务之前能够正常工作。然后，当我们准备好深入研究每种技术时，我们已经有了一个现成的代码框架可供使用。


