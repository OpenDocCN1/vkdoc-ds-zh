  \ -0.484，但仍然不如替代方案。\n\n### 经验教训\n\n将我们的异常检测引擎与付费产品进行比较的机会非常宝贵。我们能够针对人工和真实时间序列数据集的组合进行比较，并且知道我们的引擎从未见过这些数据，因此我们无法作弊以获得更美观的解决方案。回到我们的单序列时间序列解决方案，我们专注于将变化点检测用于异常值检测。这为我们提供了一些推测性的见解，解释了为什么我们的引擎在此测试中表现不佳，因为我们有意设计用于检测趋势变化，而非单个异常数据点。重新审视我们当前的引擎，通过引入其他技术（例如\
  \ ARIMA 风格的建模技术或 SAX）到我们的单序列时间序列检测器中，我们有可能显著提升性能。\n\n另一点需要牢记的是，尽管我们的表现不如认知服务，但差距并不巨大。这是一个积极的信号，表明改进我们的异常检测引擎是有价值的，这也是下一节的重点。\n\
  \n## 打造更好的异常检测器\n\n在本书的整个过程中，我们采取了一种有目的性的方法来构建异常检测引擎。我们始终遵循的最重要的原则是确保用户无需对其数据的分布有任何系统性了解，包括数据是否遵循特定的统计分布、可能有多少个（如果有的话）异常值，以及针对其输入数据，各种统计函数的正确分界点是什么。这对我们的方法至关重要，我甚至不认为它是一种限制；相反，它是我们构建的引擎的指导原则。话虽如此，为了提升整体产品质量，我们可以放宽一些限制，并实施一些技术。\n\
  \n### 增强鲁棒性\n\n在开发过程中，我们引入了一些限制，其目的是简化代码并使其更易于理解。这种简化是以牺牲引擎的鲁棒性为代价的。例如，在处理多序列时间序列数据时，我们假设所有序列具有完全相同的时间戳和采集间隔。这个假设并非糟糕透顶，但它确实降低了我们解决方案的鲁棒性，并且如果一个序列具有不同的采集间隔，就会引入问题。一个解决方案可能是构建一个流程，为每个序列合成一个共同的采集间隔。其思路是想象每个数据点出现在时间线上，并在每个序列的数据点之间进行线性插值。然后，我们在每个序列的相同位置切割时间线，并找到每个切割点的合成值。\n\
  \n另一种增强系统鲁棒性的方法是处理不良数据，例如单个数据点具有无效值的情况。目前，检测引擎要求所有数据点的值都是有效的浮点数。然而，有时不良数据会混入：`NULL`\
  \ 或 `NA` 表示缺失数据，`X` 等字符表示无效样本，或者其他出现在真实世界数据集中的错误。处理不良数据所需的具体技术取决于你公司的具体情况和用例。你可以在运行任何异常值检测测试之前，删除无效行、对结果进行插值（尤其对于时间序列数据）、删除非数字字符，或以其他方式转换数据。\n\
  \n\n\n### 扩展集成模型\n\n改进异常检测引擎的下一步是扩展每个集成模型。在本章中，我们仅研究了单序列时间序列分析，这是唯一一个我们没有为其创建显式集成模型的机制。集成模型是一种在不确定性下做出合理推测的绝佳技术，尤其是当集成模型基于不同假设并执行不同统计运算时。正如我们在第\
  \ 6 章所学到的，精心选择的集成模型能让我们从多个中等有效的测试中最大化收益。此外，对于我们实现的每一类异常检测技术，都有大量我们未纳入集成模型的统计技术和方法。回顾这些其他技术并将其整合进来——无论是单纯添加，还是替换掉某些现有技术——都可能带来整体上更好的结果。\n\
  \n### 训练参数值\n\n改进异常检测引擎的最终方法是更明智地选择各个参数值，例如`COF`、`LOCI`和`SAX`等技术的截断点。做出更明智选择的难点在于，这需要满足以下两个条件之一：要么你的用户足够了解他们的数据，能够提供相关输入；要么你足够了解用户的数据，能够定义相关输入。前者与我们项目的理念相悖，而后者虽然相当困难，但却是可行的。困难的原因在于我们假设这是一个通用型异常检测服务，这意味着我们可以从任何源系统获取数据，并尽最大努力进行处理。然而，如果你对用户将提交的数据集有较好的了解，就可以利用这一知识。例如，假设你拥有标注了异常的公司数据，类似于本章中使用的\
  \ NAB 数据集。有了这些标注数据，你可以将本书中硬编码的各种参数视为*超参数*，即在训练模型之前设定其值的参数。你还需要一个评分函数，可以是本章中使用的那个。有了这两者，你就可以找到一组最适合你训练引擎所用数据集的截断点。这里的风险在于，你假设未来数据集在最优截断点方面会遵循旧数据集的规律，但只要这个假设成立，你最终获得的结果就可能显著优于一个需要满足所有可能数据集、且事先对数据一无所知的通用引擎。\n\
  \n## 结论\n\n在本章中，我们了解了我们的异常检测引擎与 Azure 认知服务异常检测器中的商用引擎在一系列人工和真实数据集上的对比情况。虽然商用产品确实胜过了我们的解决方案，但差距并不大。此外，我们还获得了一些关于如何改进引擎的见解。在本章结尾，我们提出了几个关于如何提升引擎质量以及改善用户服务体验的想法。\n\
