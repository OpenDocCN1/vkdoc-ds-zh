- "# 10. 基于连通性的离群因子 (COF)\n\n前一章向我们介绍了聚类技术以及其中一种聚类技术——高斯混合模型的使用。在本章中，我们将实现另一种用于多变量聚类的技术：基于连通性的离群因子。\n\
  \n## 距离还是密度？\n\n异常检测有两种关键方法：基于距离的方法和基于密度的方法。对于单变量异常检测，我们通常侧重于基于距离的方法。正如 Mehrotra\
  \ 所解释的：“距离分布中心较远意味着观察到这样一个数据点的概率非常小。由于观察到这样一个点（从该分布中抽取）的概率很低，因此距离中心较远的数据点被视为异常”（Mehrotra,\
  \ 97）。我们一开始隐含地假设单变量数据集适合一个聚类，该聚类的形状可能近似于正态分布。到了第 9 章，我们放宽了这一假设，并允许使用高斯混合模型形成多个聚类。在此过程中，我们还引入了一种基于密度的异常检测方法。\n\
  \n图 10-1 展示了基于密度的方法在异常检测中的重要性。如果我们仅使用距离作为异常程度的衡量标准，那么左侧聚类中标记的数据点将比右侧聚类中标记的数据点获得更高的异常分数。然而，我们的整体感知能力并不同意这种评估：我们可以看到，尽管向量\
  \ A 实际上比向量 B 长，但与向量 A 关联的数据点与其他数据点形成了规则的模式。每个数据点与至少两个邻居大致等距。相比之下，与向量 B 关联的数据点与其邻居的距离比其任何同伴都远。换句话说，对于基于密度的方法，我们更关心邻居之间的距离，而不是到质心的距离。\n\
  \n![](img/521828_1_En_10_Fig1_HTML.jpg)\n\n一组关于点 A 和点 B 的两幅插图，包含 7 个小圆圈。在点 A 中，圆圈分散；在点\
  \ B 中，圆圈密集。\n\n**图 10-1**  \n向量 A 比向量 B 长。因此，纯基于距离的方法可能会让我们认为点 A 比点 B 更可能是异常值\n\n\
  在基于密度的方法中，我们以邻域的概念来思考，我们可以将邻域定义为给定数量的最近邻居。我们在第 9 章中通过 k 近邻（`knn`）算法看到了这一点。`knn`\
  \ 与我们将在后续章节中使用的基于密度的异常检测算法的区别在于，`knn` 在定义邻域后就停止了。而基于密度的异常检测算法则更进一步：在确定给定点的邻域后，我们比较该数据点与其邻居的密度。如果数据点的密度明显小于其最近邻居的密度，那么该数据点很可能是异常值。\n\
  \n图 10-2 展示了这一概念的一个示例。在此例中，我们展示了沿单一维度的点示例。但请注意，该问题的多维版本在概念上是相同的，只是我们需要使用某种距离度量，如*曼哈顿距离*或*马氏距离*来计算点之间的距离。这些度量技术超出了本书的范围，但在深入研究算法时具有一定相关性。\n\
  \n![](img/521828_1_En_10_Fig2_HTML.jpg)\n\n两个数据点与其两个最近邻居之间距离的示意图。\n\n**图 10-2**\
