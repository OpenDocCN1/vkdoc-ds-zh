  ## 结论


  在本章中，我们创建了一个简单的网站，用于展示异常值检测服务的结果。在接下来的章节中，随着我们实现新的异常值检测技术，我们需要对这个服务进行扩展和修订。在本书下一部分中，我们将实现其中一种技术：多元异常值检测。此外，我们还将利用该过程中的一些见解来改进单变量异常值检测。


