- '# 第三部分 多元异常检测


  单变量异常值检测是本书第二部分的主题；在这一部分，我们将转向多元异常值检测。第 9 章作为起点，我们探讨了聚类的概念，并了解聚类技术如何帮助我们找到异常值。我们还将通过将一种单变量聚类技术整合到现有的集成方法中，来结束单变量异常值检测。在第
  10 章中，我们将介绍将要使用的一种多元聚类技术：基于连通性的异常因子（COF）。第 11 章将介绍另一种多元聚类技术：局部相关积分（LOCI）。第 12 章提供了一个重要的提醒：聚类技术并非多元分析的唯一有用工具，我们将回顾并实现基于
  Copula 的异常值检测（COPOD）。


  '
- '# 9. 聚类与异常


  作为第三部分的第一章，本章也充当着第二部分（单变量分析）与第三部分（多元分析）之间的桥梁。在本章中，我们将探讨如何利用聚类技术来解决我们在第 7 章结束时遇到的问题：我们凭直觉可以理解，在一个包含值
  `{ 1, 2, 3, 50, 97, 98, 99 }` 的数据集中，值 50 是一个异常值，但我们的异常值检测引擎却坚决不这么认为。


  本章将首先描述聚类的概念。然后，我们将介绍两种非常流行的聚类技术：k-means 聚类和 k-近邻算法。之后，我们将讨论聚类技术适用的场景以及它们可能引入的问题。在打下坚实的聚类技术基础后，我们将为单变量异常检测过程添加另一种方法：高斯混合模型。我们将学习该算法的工作原理，以及如何在不引入太多混乱的情况下，将其见解整合到我们现有的异常检测器中。最后，我们将介绍三种多元异常检测的替代方法，这些方法我们不会在异常值检测过程中使用，但仍值得一提。


  ## 什么是聚类？


  聚类背后的关键见解是，我们通常会看到数据点聚集在一起，尤其是当我们引入越来越多的变量时。以著名的鸢尾花数据集为例，该数据集最初由埃德加·安德森于 1935 年收集。图
  9-1 展示了三种鸢尾花及其花瓣长度和花瓣宽度的数值。


  ![](img/521828_1_En_9_Fig1_HTML.png)


  一张标题为“埃德加·安德森的鸢尾花数据”的散点图。该图绘制了花瓣宽度与花瓣长度的关系，右上角聚类密集。


  **图 9-1** 鸢尾花数据集中的两个变量显示了数值的聚类情况


  我们可以看到至少有两个清晰的数据聚类：一个的花瓣长度为 1–2 厘米，宽度为 0–0.5 厘米；另一个更宽的聚类包含花瓣长度为 3–7 厘米，宽度为 1–2.5
  厘米。我们没有看到任何宽度超过 1 厘米但长度小于 3 厘米的花瓣，也没有看到细长的花瓣。


  我提到“至少”两个聚类，是因为我们可以合理地论证这里存在三个聚类，每个聚类对应数据集中的一种鸢尾花。尽管有两个类别有相当程度的重叠，但我们的眼睛能够区分它们，并在两者之间划出一个模糊的边界。


  现在我们对聚类的概念有了直观的理解，在探讨不同的聚类方法之前，让我们先深入了解几个术语。


  ### 常见聚类术语


  我们希望执行*聚类分析*，即以某种方式将观测值分组，以最大化*簇内相似度*并最小化*簇间相似度*。另一种表述方式是，我们希望每个簇的大小尽可能小，并且簇与簇之间的距离尽可能大。


  通常，我们从簇的*质心*或中心点开始绘制一个簇。这个质心不必是一个特定的数据点，而可以位于数据点之间。


  我们用来计算簇内相似度的一个度量称为*簇内平方和*（WCSS）。我们通过计算给定点到质心的欧几里得距离的平方和，来为每个簇计算 WCSS。清单 9-1 正式展示了这一点，假设有一个名为
  C 的簇。


  **清单 9-1.** 计算簇内平方和的公式


  ```

  WCSS = Σ (x ∈ C) ||x - μ||²

  ```


  用于衡量簇间相似度的度量称为*簇间平方和*（BCSS）。我们可以通过计算数据集中的总平方和并减去簇内平方和来得到 BCSS；这样剩下的就是簇间平方和。


  现在我们已经掌握了必要术语的基础知识，可以开始研究聚类算法了。




  #### K-Means 聚类


  `K-means clustering` 是一种常见的聚类方法，因为它速度相当快且非常易于理解。我们将从图 9-2 开始，该图展示了一组分布在两个维度上的点，我们将其映射为散点图的
  X 轴和 Y 轴。


  ![](img/521828_1_En_9_Fig2_HTML.jpg)


  一张散点图。这些点分别聚集在右侧、左侧和左上角。


  图 9-2


  一个展示聚类行为的数据示例


  从这些数据中我们可以清晰地看到存在三个聚类。K-means 聚类的工作原理是，我们需要确定数据中我们认为会存在的聚类数量。这使得我们基于整体感知的观察可能非常有用。如果你不知道聚类的数量，或者在分析之前没有见过这些数据，因此无法产生任何预期，你可以尝试使用不同数量的聚类来运行此算法，我们稍后会看到这一点。在这种情况下，在目视观察数据后，我可能会确定存在三个聚类。在第一阶段，算法会任意分配聚类质心的位置，如图
  9-3 所示。


