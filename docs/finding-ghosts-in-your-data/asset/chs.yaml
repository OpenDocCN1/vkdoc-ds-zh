  ## 容器化解决方案


  我们已有一个解决方案，可以在本地机器上直接运行。但假设我们希望将此解决方案部署到 Azure 应用服务之类的平台上，该如何打包代码并使其可运行呢？最简单的打包方式之一就是将其容器化。容器的核心理念是：将代码和所有项目依赖项整合到一个单一的*镜像*中。这个镜像随后可以作为一个独立的*容器*，部署到任何运行相应软件的平台上。我可以将本
  API 的软件打包，并为你提供这个镜像。然后，你可以获取该镜像，并将其部署到自己的环境中，无需安装任何其他东西。


  安装和配置 Docker 这类容器化解决方案已超出本书的讨论范围。如果你已安装或能够安装相应软件，请继续阅读；如果不行，你也可以在非容器环境下运行本书中的所有内容，这并不会影响理解。


  对于 Windows 用户，在撰写本文时，市面上有一款主要的容器操作产品：Docker Desktop。Docker Desktop 对个人非商业用途免费。对于
