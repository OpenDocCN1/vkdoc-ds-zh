    \ values taken from the column names, and the value column will contain the data\
    \ from the original columns.\n\nConsider the mean income data frame. We want the\
    \ actual years to be different outcomes of a year variable and have the income\
    \ for each year to be another variable, `income`. We can get such a tibble by\
    \ calling `pivot_longer()` with these parameters:\n\n```\nmean_income |> pivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"income\",\ncols = c(`2001`, `2001`, `2002`,\n\
    `2003`, `2004`, `2005`)\n)\n## # A tibble: 25 × 3\n##    country  year  income\n\
    ##          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002  132654\n##  3\
    \ Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor  2005  325416\n\
    ##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##  8 Westeros 2003\
    \  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005  561423\n## # . .\
    \ . with 15 more rows\n```\n\nThe first argument is the input data from `mean_income`,\
    \ and I provide it using the `|>` operator. This works exactly as if I had given\
    \ `mean_income` as the first argument to the function call, but using the operator\
    \ signals to the reader that `mean_income` is data flowing into the function and\
    \ different from other arguments because of it.\n\nThe `names_to` and `values_to`\
