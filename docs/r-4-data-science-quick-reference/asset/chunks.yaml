  trans: "```r\nread_csv(\n\"A, B, C,   D   # 这是一个注释\n# 缩进是个潜在问题；是否缺少列？\n1, a, a,\
    \   1.2   # 另一个注释\n2, b, b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types\
    \ =FALSE\n)\n## 警告：存在一个或多个解析问题，详见\n## 'problems()'\n## # A tibble: 4 × 4\n## \
    \      A B     C         D\n##      \n## 1    NA        NA\n## 2     1 a     a\
    \       1.2\n## 3     2 b     b       2.1\n## 4     3 c     c      13\n```\n\n\
    关于影响输入文件解析方式的更多选项，请阅读函数文档：`?read_csv`。\n\n## 列类型\n\n当 `read_csv` 解析文件时，它会推断每一列的类型。这种推断可能速度较慢，更糟的是推断结果可能不准确。如果你*事先*知道列的类型，可以使用\
    \ `col_types` 选项来指定。若如此做，则 `read_csv` 将不会猜测类型，但它会将无法按指定类型解析的值替换为 `NA`。^(³)\n\n\
    ### 基于字符串的列类型指定\n\n在最简单的字符串指定格式中，你必须提供一个长度与列数相同的字符串，字符串中的每个字符指定一列的类型。指定不同类型的字符如下：\n\
    \n| 字符 | 类型 |\n| --- | --- |\n| `c` | 字符型 |\n| `i` | 整型 |\n| `n` | 数值型 |\n| `d`\
    \ | 双精度型 |\n| `l` | 逻辑型 |\n| `f` | 因子型 |\n| `D` | 日期型 |\n| `T` | 日期时间型 |\n| `t`\
    \ | 时间型 |\n| `?` | 猜测（默认） |\n| `_/-` | 跳过该列 |\n\n默认情况下，`read_csv` 会进行猜测，因此我们可以使用类型指定\
    \ `\"????\"` 来明确表示：\n\n```r\nread_csv(\nfile =\"data/data.csv\",\ncol_types =\"\
    ????\"\n)\n## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1\
    \      1 a    a       1.2\n## 2      2 b    b       2.1\n## 3      3 c    c  \
    \    13\n```\n\n猜测的结果是：列 `A` 和 `D` 为双精度型，列 `B` 和 `C` 为字符型。如果要明确指定，可以使用 `\"dccd\"\
    `。\n\n```r\nread_csv(\nfile =\"data/data.csv\",\ncol_types =\"dccd\"\n)\n## #\
    \ A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a     a\
    \       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\n\
    如果希望列 `A` 为整型，可以使用 `\"iccd\"`：\n\n```r\nread_csv(\nfile =\"data/data.csv\",\n\
    col_types =\"iccd\"\n)\n## # A tibble: 3 × 4\n##       A B     C         D\n##\
    \      \n## 1     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3    \
    \ 3 c     c      13\n```\n\n如果尝试将列 `D` 也解释为整型，你将收到一系列警告消息，且列 `D` 中的值将全部变为 `NA`；列\
    \ `D` 中的数字无法被解释为整数，`read_csv` 也不会将它们四舍五入为整数。\n\n```r\nread_csv(\nfile =\"data/data.csv\"\
    ,\ncol_types =\"icci\"\n)\n## 警告：存在一个或多个解析问题，详见\n## 'problems()'\n## # A tibble:\
    \ 3 × 4\n##       A B     C         D\n##      \n## 1     1 a     a        NA\n\
    ## 2     2 b     b        NA\n## 3     3 c     c        NA\n```\n\n如果指定某列为 `d`\
    \ 类型，则该列中的数字必须是整数或小数。如果使用 `n` 类型（`read_csv` 默认猜测的类型），你也会得到双精度值，但后者能够处理可被解释为数字的字符串，例如金额、百分比和数字中的千位分隔符。`n`\
    \ 列类型会忽略首尾文本并处理数字分隔符：\n\n通过以下函数调用\n\n```r\nread_csv(\n'A, B, C,   D,   E\n$1,a,a,1.2%,\"\
    1,100,200\"\n$2,b,b,2.1%,\"140,000\"\n$3,c,c,13.0%,\"2,005,000\"',\ncol_types\
    \ =\"nccnn\"\n)\n## # A tibble: 3 × 5\n##       A B     C         D        E\n\
    ##          \n## 1     1 a     a       1.2  1100200\n## 2     2 b     b      \
    \ 2.1   140000\n## 3     3 c     c      13    2005000\n```\n\n列 `A`、`D` 和 `E`\
    \ 将被读取为数值型。如果使用类型指定 `d`，则不会如此，所有值都会变为 `NA`。\n\n小数点指示符和千位分隔符在全球各地有所不同。默认情况下，`read_csv`\
    \ 使用美国惯例：小数点用点号，千位分隔符用逗号。在许多欧洲国家，情况则相反。你可以使用 `locale` 选项来更改这些设置：\n\n```r\nread_csv(\n\
    'A, B, C,   D,   E\n$1,a,a,\" 1,2%\",\"1.100.200\"\n$2,b,b,\" 2,1%\",\"   140.000\"\
    \n$3,c,c,\"13,0%\",\"2.005.000\"',\nlocale=locale(decimal_mark =\",\",grouping_mark\
    \ =\".\"),\ncol_types =\"nccnn\")\n## # A tibble: 3 × 5\n##       A B     C  \
    \       D        E\n##          \n## 1     1 a     a       1.2  1100200\n## 2\
    \     2 b     b       2.1   140000\n## 3     3 c     c      13    2005000\n```"
- fmt: "In the preceding example, I explicitly specified how `read_csv` should interpret\
    \ numbers, but you can also use ISO 639-1 language codes.^([⁴](#fn4)) If you do,\
    \ you also get the local time conventions and local day and month names. The default\
    \ is English, but if your data is from Denmark, for example, you want to use Danish\
    \ conventions, you would use the local `locale(\"da\")`. For French data, you\
    \ would use `fr, locale(\"fr\")`. If you type this into an R console, you will\
    \ see the month and week names, including their abbreviated forms, in these languages.\n\
    \nSee the `?locale` documentation for more options.\n\nIn files that use commas\
    \ as decimal points and “`.`” for number groupings, the column delimiter is usually\
    \ “`;`” rather than “`,`”. This way, it is not necessary to put decimal numbers\
    \ in quotes. The `read_csv2` function works as `read_csv` but uses “`;`” as column\
    \ delimiter and “`.`” for number groupings.\n\nThe *logical* type is used for\
    \ boolean values. If a column only contains `TRUE` and `FALSE` (case doesn’t matter):\n\
    \n```\nread_csv(\n'A, B, C,   D\nTRUE, a, a,   1.2\nfalse, b, b,   2.1\ntrue,\
    \ c, c, 13',\nshow_col_types =FALSE\n)\n## # A tibble: 3 × 4\n##   A     B   \
    \  C         D\n##      \n## 1 TRUE  a     a       1.2\n## 2 FALSE b     b   \
    \    2.1\n## 3 TRUE  c     c      13\n```\n\nthen `read_csv` will guess that the\
    \ type is logical.\n\nIt is not unusual to code boolean values as 0 and 1, however,\
    \ and since these will be interpreted as numbers by default, you can make their\
    \ type explicit using `l`:\n\n```\nread_csv(\n'A, B, C,   D\n1, a, a,   1.2\n\
    0, b, b,   2.1\n1, c, c, 13',\ncol_types =\"lccn\"\n)\n## # A tibble: 3 × 4\n\
    ##   A     B     C         D\n##      \n## 1 TRUE  a     a       1.2\n## 2 FALSE\
    \ b     b       2.1\n## 3 TRUE  c     c      13\n```\n\nIf you use type `l`, you\
    \ can mix `TRUE/FALSE` (ignoring case) with 0/1. Any other number or string will\
    \ be translated into `NA`.\n\nThe `D`, `t`, and `T` types are for *dates*, *time\
    \ points*, and *datetime*, in that order. Dates and time are what you might expect.\
    \ A date specifies a range of days, for example, a single day, a week, a month,\
    \ or a year. A time point specifies a specific time of the day, for example, an\
    \ hour, a minute, or a second. A datetime combines a day and a time, that is,\
    \ it specifies a specific time during a specific day.\n\n```\nread_csv(\n'D, T,\
    \ t\n\"2018-08-23\", \"2018-08-23T14:30\", 14:30',\ncol_types =\"DTt\"\n)\n##\
    \ # A tibble: 1 × 3\n##   D          T                   t\n##               \
    \       \n## 1 2018-08-23 2018-08-23 14:30:00 14:30\n```\n\nIf you use one of\
    \ these type specifications, the time and dates should be in ISO 8601 format.^([⁵](#fn5))\
    \ Local conventions for writing time and date, however, differ substantially and\
    \ are rarely ISO 8601. When your time data are not ISO 8601, you need to tell\
    \ `read_csv` how to read them.\n\nThe default time parser handles times in the\
    \ `hh:mm, hh:mm:ss` formats and handles `am` and `pm` suffixes; it suffices for\
    \ most time formats (but notice that it wants time in `hh:mm` or `hh:mm:ss` format;\
    \ it is flexible in the number of characters you use for hours, and you can leave\
    \ out seconds, but you cannot leave out minutes). Date and datetime vary much\
    \ more than time formats, and there, you usually need to specify the encoding\
    \ format.\n\nYou can use the locale option to change how `read_csv` parses dates\
    \ (`D`) and time (`t`).\n\n```\nread_csv(\n'D, t\n\"23 Oct 2018\", 2pm',\ncol_types\
    \ =\"Dt\",\nlocale =locale(\ndate_format =\"%d %b %Y\",\ntime_format =\"%I%p\"\
    \n)\n)\n## # A tibble: 1 × 2\n##   D          t\n##        \n## 1 2018-10-23 14:00\n\
    ```\n\nThe `date_format \"%d %b %Y\"` says that dates are written as day, three-letter\
    \ month abbreviation, and year with four digits, and each of the three separated\
    \ by a space. The `time_format \"%I%p\"` says that we want time to be written\
    \ as a number from 1 to 12, with no minute information, the hour immediately followed\
    \ by am/pm without any space between.\n\nFor datetimes (`T`), we cannot specify\
    \ the format using `locale`. We need a more verbose type specification that we\
    \ will return to later. We also return to formatting specifications for parsing\
    \ dates and time later.\n\nColumns that are not immediately parsed as numbers,\
    \ booleans, dates, or times will be parsed as *strings*. If you want these to\
    \ be factors instead, you use the `f` type specification.\n\n```\nread_csv(\n\
    'A, B, C,   D\n1, a, a,   1.2\n0, b, b,   2.1\n1, c, c, 13',\ncol_types =\"lcfn\"\
    )\n## # A tibble: 3 × 4\n##   A     B     C         D\n##      \n## 1 TRUE  a\
    \     a       1.2\n## 2 FALSE b     b       2.1\n## 3 TRUE  c     c      13\n\
    ```\n\nIf you only want to use some of the columns, you can skip the rest using\
    \ the “type” `-` or `_`:\n\n```\nread_csv(\nfile =\"data/data.csv\",\ncol_type\
    \ =\"_cc-\"\n)\n## # A tibble: 3 × 2\n##   B     C\n##    \n## 1 a     a\n## 2\
    \ b     b\n## 3 c     c\n```\n\nIf you specify the column types using a string,\
    \ you should specify the types of all columns. If you only want to define the\
    \ types of a subset of columns, you can use the function `cols()` to specify types.\
    \ You call this function with named parameters, where the names are column names\
    \ and the arguments are types.\n\n```\nread_csv(\nfile =\"data/data.csv\",\ncol_types\
    \ =cols(A =\"c\")\n)\n## # A tibble: 3 × 4\n##   A     B     C        D\n##  \
    \    \n## 1 1     a     a       1.2\n## 2 2     b     b       2.1\n## 3 3    \
    \ c     c      13\nread_csv(\nfile =\"data/data.csv\",\ncol_types =cols(A =\"\
    c\",D =\"c\")\n)\n## # A tibble: 3 × 4\n##   A     B     C      D\n##      \n\
    ## 1 1     a     a     1.2\n## 2 2     b     b     2.1\n## 3 3     c     c   \
    \  13.0\n```"
  raw: "In the preceding example, I explicitly specified how `read_csv` should interpret\
    \ numbers, but you can also use ISO 639-1 language codes.^([⁴](#fn4)) If you do,\
    \ you also get the local time conventions and local day and month names. The default\
    \ is English, but if your data is from Denmark, for example, you want to use Danish\
    \ conventions, you would use the local `locale(\"da\")`. For French data, you\
    \ would use `fr, locale(\"fr\")`. If you type this into an R console, you will\
    \ see the month and week names, including their abbreviated forms, in these languages.\n\
    \nSee the `?locale` documentation for more options.\n\nIn files that use commas\
    \ as decimal points and “`.`” for number groupings, the column delimiter is usually\
    \ “`;`” rather than “`,`”. This way, it is not necessary to put decimal numbers\
    \ in quotes. The `read_csv2` function works as `read_csv` but uses “`;`” as column\
    \ delimiter and “`.`” for number groupings.\n\nThe *logical* type is used for\
    \ boolean values. If a column only contains `TRUE` and `FALSE` (case doesn’t matter)\n\
    \n```\nread_csv(\n'A, B, C,   D\nTRUE, a, a,   1.2\nfalse, b, b,   2.1\ntrue,\
    \ c, c, 13',\nshow_col_types =FALSE\n)\n## # A tibble: 3 × 4\n##   A     B   \
    \  C         D\n##      \n## 1 TRUE  a     a       1.2\n## 2 FALSE b     b   \
    \    2.1\n## 3 TRUE  c     c      13\n```\n\nthen `read_csv` will guess that the\
    \ type is logical.\n\nIt is not unusual to code boolean values as 0 and 1, however,\
    \ and since these will be interpreted as numbers by default, you can make their\
    \ type explicit using l:\n\n```\nread_csv(\n'A, B, C,   D\n1, a, a,   1.2\n0,\
    \ b, b,   2.1\n1, c, c, 13',\ncol_types =\"lccn\"\n)\n## # A tibble: 3 × 4\n##\
    \   A     B     C         D\n##      \n## 1 TRUE  a     a       1.2\n## 2 FALSE\
    \ b     b       2.1\n## 3 TRUE  c     c      13\n```\n\nIf you use type `l`, you\
    \ can mix `TRUE/FALSE` (ignoring case) with 0/1\\. Any other number or string\
    \ will be translated into `NA`.\n\nThe `D`, `t`, and `T` types are for *dates*,\
    \ *time points*, and *datetime*, in that order. Dates and time are what you might\
    \ expect. A date specifies a range of days, for example, a single day, a week,\
    \ a month, or a year. A time point specifies a specific time of the day, for example,\
    \ an hour, a minute, or a second. A datetime combines a day and a time, that is,\
    \ it specifies a specific time during a specific day.\n\n```\nread_csv(\n'D, T,\
    \ t\n\"2018-08-23\", \"2018-08-23T14:30\", 14:30',\ncol_types =\"DTt\"\n)\n##\
    \ # A tibble: 1 × 3\n##   D          T                   t\n##               \
    \       \n## 1 2018-08-23 2018-08-23 14:30:00 14:30\n```\n\nIf you use one of\
    \ these type specifications, the time and dates should be in ISO 8601 format.^([⁵](#fn5))\
    \ Local conventions for writing time and date, however, differ substantially and\
    \ are rarely ISO 8601\\. When your time data are not ISO 8601, you need to tell\
    \ `read_csv` how to read them.\n\nThe default time parser handles times in the\
    \ `hh:mm, hh:mm:ss` formats and handles `am` and `pm` suffixes; it suffices for\
    \ most time formats (but notice that it wants time in `hh:mm` or `hh:mm:ss` format;\
    \ it is flexible in the number of characters you use for hours, and you can leave\
    \ out seconds, but you cannot leave out minutes). Date and datetime vary much\
    \ more than time formats, and there, you usually need to specify the encoding\
    \ format.\n\nYou can use the locale option to change how `read_csv` parses dates\
    \ (`D`) and time (`t`).\n\n```\nread_csv(\n'D, t\n\"23 Oct 2018\", 2pm',\ncol_types\
    \ =\"Dt\",\nlocale =locale(\ndate_format =\"%d %b %Y\",\ntime_format =\"%I%p\"\
    \n)\n)\n## # A tibble: 1 × 2\n##   D          t\n##        \n## 1 2018-10-23 14:00\n\
    ```\n\nThe `date_format \"%d %b %Y\"` says that dates are written as day, three-letter\
    \ month abbreviation, and year with four digits, and each of the three separated\
    \ by a space. The `time_format \"%I%p\"` says that we want time to be written\
    \ as a number from 1 to 12, with no minute information, the hour immediately followed\
    \ by am/pm without any space between.\n\nFor datetimes (`T`), we cannot specify\
    \ the format using `locale`. We need a more verbose type specification that we\
    \ will return to later. We also return to formatting specifications for parsing\
    \ dates and time later.\n\nColumns that are not immediately parsed as numbers,\
    \ booleans, dates, or times will be parsed as *strings*. If you want these to\
    \ be factors instead, you use the `f` type specification .\n\n```\nread_csv(\n\
    'A, B, C,   D\n1, a, a,   1.2\n0, b, b,   2.1\n1, c, c, 13',\ncol_types =\"lcfn\"\
    )\n## # A tibble: 3 × 4\n##   A     B     C         D\n##      \n## 1 TRUE  a\
    \     a       1.2\n## 2 FALSE b     b       2.1\n## 3 TRUE  c     c      13\n\
    ```\n\nIf you only want to use some of the columns, you can skip the rest using\
    \ the “type” `-` or `_`:\n\n```\nread_csv(\nfile =\"data/data.csv\",\ncol_type\
    \ =\"_cc-\"\n)\n## # A tibble: 3 × 2\n##   B     C\n##    \n## 1 a     a\n## 2\
    \ b     b\n## 3 c     c\n```\n\nIf you specify the column types using a string,\
    \ you should specify the types of all columns. If you only want to define the\
    \ types of a subset of columns, you can use the function `cols()` to specify types.\
    \ You call this function with named parameters, where the names are column names\
    \ and the arguments are types.\n\n```\nread_csv(\nfile =\"data/data.csv\",\ncol_types\
    \ =cols(A =\"c\")\n)\n## # A tibble: 3 × 4\n##   A     B     C        D\n##  \
    \    \n## 1 1     a     a       1.2\n## 2 2     b     b       2.1\n## 3 3    \
    \ c     c      13\nread_csv(\nfile =\"data/data.csv\",\ncol_types =cols(A =\"\
    c\",D =\"c\")\n)\n## # A tibble: 3 × 4\n##   A     B     C     D\n##      \n##\
    \ 1 1     a     a     1.2\n## 2 2     b     b     2.1\n## 3 3     c     c    \
    \ 13.0\n```"
  trans: "\n在前一个示例中，我明确指定了 `read_csv` 应如何解释数字，但你也可以使用 ISO 639-1 语言代码。^(⁴) 如果这样做，你还能获得本地的时间惯例以及本地化的月份和星期名称。默认语言是英语，但如果你的数据来自丹麦，例如，你想要使用丹麦语惯例，你可以使用本地化的\
    \ `locale(\"da\")`。对于法语数据，你可以使用 `fr, locale(\"fr\")`。如果你在 R 控制台中输入这些，你将会看到这些语言下的月份和星期名称，包括它们的缩写形式。\n\
    \n更多选项请参阅 `?locale` 文档。\n\n在使用逗号作为小数点、“`.`”作为数字分组符的文件中，列分隔符通常是“`;`”而非“`,`”。这样就不必用小括号将十进制数字括起来。`read_csv2`\
    \ 函数的作用与 `read_csv` 相同，但使用“`;`”作为列分隔符，“`.`”用于数字分组。\n\n*逻辑*类型用于布尔值。如果某一列只包含 `TRUE`\
    \ 和 `FALSE`（不区分大小写）：\n\n```\nread_csv(\n'A, B, C,   D\nTRUE, a, a,   1.2\nfalse,\
    \ b, b,   2.1\ntrue, c, c, 13',\nshow_col_types =FALSE\n)\n## # A tibble: 3 ×\
    \ 4\n##   A     B     C         D\n##      \n## 1 TRUE  a     a       1.2\n##\
    \ 2 FALSE b     b       2.1\n## 3 TRUE  c     c      13\n```\n\n那么 `read_csv`\
    \ 将会推测该列的类型是逻辑型。\n\n然而，用 0 和 1 来编码布尔值的情况也并不少见，由于默认情况下它们会被解释为数字，你可以使用 `l` 来明确指定其类型：\n\
    \n```\nread_csv(\n'A, B, C,   D\n1, a, a,   1.2\n0, b, b,   2.1\n1, c, c, 13',\n\
    col_types =\"lccn\"\n)\n## # A tibble: 3 × 4\n##   A     B     C         D\n##\
    \      \n## 1 TRUE  a     a       1.2\n## 2 FALSE b     b       2.1\n## 3 TRUE\
    \  c     c      13\n```\n\n如果你使用类型 `l`，你可以将 `TRUE/FALSE`（忽略大小写）与 0/1 混合使用。任何其他数字或字符串都将被转换为\
    \ `NA`。\n\n`D`、`t` 和 `T` 类型分别用于*日期*、*时间点*和*日期时间*。日期和时间正如你所期望的那样。一个日期指定一个天数范围，例如，一天、一周、一个月或一年。一个时间点指定一天的特定时间，例如，一小时、一分钟或一秒钟。日期时间则结合了某一天和某个时间，也就是说，它指定了特定某一天的特定时间。\n\
    \n```\nread_csv(\n'D, T, t\n\"2018-08-23\", \"2018-08-23T14:30\", 14:30',\ncol_types\
    \ =\"DTt\"\n)\n## # A tibble: 1 × 3\n##   D          T                   t\n##\
    \                      \n## 1 2018-08-23 2018-08-23 14:30:00 14:30\n```\n\n如果你使用这些类型规范之一，时间和日期应采用\
    \ ISO 8601 格式。^(⁵) 然而，书写时间和日期的本地惯例差异很大，很少是 ISO 8601 格式。当你的时间数据不是 ISO 8601 格式时，你需要告诉\
    \ `read_csv` 如何读取它们。\n\n默认的时间解析器处理 `hh:mm、hh:mm:ss` 格式的时间，并支持 `am` 和 `pm` 后缀；它足以应对大多数时间格式（但请注意，它要求时间采用\
    \ `hh:mm` 或 `hh:mm:ss` 格式；它对表示小时的字符数很灵活，并且你可以省略秒，但不能省略分钟）。日期和日期时间的变化比时间格式大得多，因此通常需要指定编码格式。\n\
    \n你可以使用区域设置选项来改变 `read_csv` 解析日期 (`D`) 和时间 (`t`) 的方式。\n\n```\nread_csv(\n'D, t\n\
    \"23 Oct 2018\", 2pm',\ncol_types =\"Dt\",\nlocale =locale(\ndate_format =\"%d\
    \ %b %Y\",\ntime_format =\"%I%p\"\n)\n)\n## # A tibble: 1 × 2\n##   D        \
    \  t\n##        \n## 1 2018-10-23 14:00\n```\n\n`date_format \"%d %b %Y\"` 表示日期写作日、三个字母的月份缩写和四位年份，三者之间用空格分隔。`time_format\
    \ \"%I%p\"` 表示我们希望时间写作从 1 到 12 的数字，不含分钟信息，小时后紧跟着 am/pm 且中间没有任何空格。\n\n对于日期时间 (`T`)，我们无法通过\
    \ `locale` 指定格式。我们需要一个更详细的类型规范，稍后会再讨论。我们稍后也会回到用于解析日期和时间的格式规范。\n\n未被立即解析为数字、布尔值、日期或时间的列将被解析为*字符串*。如果你希望这些列被识别为因子，请使用\
    \ `f` 类型规范。\n\n```\nread_csv(\n'A, B, C,   D\n1, a, a,   1.2\n0, b, b,   2.1\n\
    1, c, c, 13',\ncol_types =\"lcfn\")\n## # A tibble: 3 × 4\n##   A     B     C\
    \         D\n##      \n## 1 TRUE  a     a       1.2\n## 2 FALSE b     b      \
    \ 2.1\n## 3 TRUE  c     c      13\n```\n\n如果你只想使用部分列，你可以使用“类型” `-` 或 `_` 来跳过其余列：\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_type =\"_cc-\"\n)\n## # A tibble:\
    \ 3 × 2\n##   B     C\n##    \n## 1 a     a\n## 2 b     b\n## 3 c     c\n```\n\
    \n如果你使用字符串指定列类型，则应指定所有列的类型。如果你只想定义列的子集的类型，你可以使用函数 `cols()` 来指定类型。你使用命名参数来调用这个函数，其中名称是列名，参数是类型。\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_types =cols(A =\"c\")\n)\n## #\
    \ A tibble: 3 × 4\n##   A     B     C        D\n##      \n## 1 1     a     a \
    \      1.2\n## 2 2     b     b       2.1\n## 3 3     c     c      13\nread_csv(\n\
    file =\"data/data.csv\",\ncol_types =cols(A =\"c\",D =\"c\")\n)\n## # A tibble:\
    \ 3 × 4\n##   A     B     C      D\n##      \n## 1 1     a     a     1.2\n## 2\
    \ 2     b     b     2.1\n## 3 3     c     c     13.0\n```\n"
- fmt: "### Function-Based Column Type Specification\n\nIf you are like me, you might\
    \ find it hard to remember the single-character codes for different types. If\
    \ so, you can use longer type names that you specify using function calls. These\
    \ functions have names that start with `col_`, so you can use autocomplete to\
    \ get a list of them. The types you can specify using functions are the same as\
    \ those you can specify using characters, of course, and the functions are as\
    \ follows:\n\n| **Function** | **Type** |\n| --- | --- |\n| `col_character()`\
    \ | Character |\n| `col_integer()` | Integer |\n| `col_number()` | Number |\n\
    | `col_double()` | Double |\n| `col_logical()` | Logical |\n| `col_factor()` |\
    \ Factor |\n| `col_date()` | Date |\n| `col_datetime()` | Datetime |\n| `col_time()`\
    \ | Time |\n| `col_guess()` | Guess (default) |\n| `col_skip()` | Skip the column\
    \ |\n\nYou need to wrap the function-based type specifications in a call to `cols`.\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_types =cols(A =col_integer())\n\
    )\n## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a\
    \     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n\
    read_csv(\nfile =\"data/data.csv\",\ncol_types =cols(D =col_character())\n)\n\
    ## # A tibble: 3 × 4\n##       A B     C     D\n##      \n## 1     1 a     a \
    \    1.2\n## 2     2 b     b     2.1\n## 3     3 c     c     13.0\n```\n\nMost\
    \ of the `col_` functions do not take any arguments, but they are affected by\
    \ the `locale` parameter the same way that the string specifications are.\n\n\
    For factors, date, time, and datetime types, however, you have more control over\
    \ the format using the `col_` functions. You can use arguments to these functions\
    \ for specifying how `read_csv` should parse dates and how it should construct\
    \ factors.\n\nFor factors, you can explicitly set the levels. If you do not, then\
    \ the column parser will set the levels in the order it sees the different strings\
    \ in the column. For example, in `data/data.csv` the strings in columns C and\
    \ D are in the order `a`, `b`, and `c`:\n\n```\nA, B, C,   D\n1, a, a,  1.2\n\
    2, b, b,  2.1\n3, c, c, 13.0\n```\n\nBy default, the two columns will be interpreted\
    \ as characters, but if we specify that C should be a factor, we get one where\
    \ the levels are `a`, `b`, and `c`, in that order.\n\n```\nmy_data<-read_csv(\n\
    file = \"data/data.csv\",\ncol_types = cols(C =col_factor())\n)\nmy_data$C\n##\
    \ [1] a b c\n## Levels: a b c\n```\n\nIf we want the levels in a different order,\
    \ we can give `col_factor()` a `levels` argument.\n\n```\nmy_data<-read_csv(\n\
    \"A, B, C\nFoo, 12.4, Medium\nBar, 5.2,   Small\nBaz, 42.0, Large\n\",\ncol_types\
    \ =cols(\nC =col_factor(levels =c(\"Small\",\"Medium\",\"Large\"))\n)\n)\nmy_data$C\n\
    ## [1] Medium Small   Large\n## Levels: Small Medium Large\n```\n\nWe can also\
    \ make factors ordered using the `ordered` argument.\n\n```\nmy_data<-read_csv(\n\
    file =\"data/data.csv\",\ncol_types =cols(\nB =col_factor(ordered =TRUE),\nC =col_factor(levels\
    \ =c(\"c\",\"b\",\"a\"))\n)\n)\nmy_data$B\n## [1] a b c\n## Levels: a b c\nmy_data$C\n\
    ## [1] a b c\n## Levels: c b a\n```\n\n## Parsing Time and Dates\n\nThe most complex\
    \ types to read (or write) are dates and time (and datetime), just because these\
    \ are written in many different ways. You can specify the format that dates and\
    \ datetime are in using a string with codes that indicate how time information\
    \ is represented.\n\nThe codes are these:\n\n| **Code** | **Time format** | **Example\
    \ string** | **Interpretation** |\n| --- | --- | --- | --- |\n| `%Y` | 4-digit\
    \ year | 1975 | The year 1975 |\n| `%y` | 2-digit year^([⁶](#fn6)) | 75 | Also\
    \ the year 1975 |\n| `%m` | 2-digit month | 02 | February |\n| `%b` | Abbreviated\
    \ month name^([⁷](#fn7)) | Feb | February |\n| `%B` | Full month name | February\
    \ | February |\n| `%d` | 2-digit day | 15 | The 15th of a month |\n| `%H` | Hour\
    \ number on a 24-hour clock | 18 | Six o’clock in the evening |\n| `%I` | Hour\
    \ number on a 12-hour clock^([⁸](#fn8)) | 6 pm | 18:00 hours |\n| `%p` | AM/PM\
    \ indicator | 6 pm | 18:00 hours |\n| `%M` | Two-digit minutes | 18:30 | Half\
    \ past six |\n| `%S` | Integer seconds | 18:30:10 | Ten seconds past 18:00 |\n\
    | `%Z` | Time zone as name^([⁹](#fn9)) | America/Chicago | Central Time |\n| `%z`\
    \ | Time zone as offset from UTC | “+0100” | Central European Time |\n\nThere\
    \ are shortcuts for frequently used formats:\n\n| **Shortcut** | **Format** |\n\
    | --- | --- |\n| `%D` | `%m/%d/%y` |\n| `%x` | `%y/%m/%d` |\n| `%F` | `%Y-%m-%d`\
    \ |\n| `%R` | `%H:%M` |\n| `%T` | `%H:%M:%S` |\n\nAs we saw earlier, you can set\
    \ the date and time format using the `locale()` function. If you do not, the default\
    \ codes will be `%AD` for dates and `%AT` for time (there is no `locale()` argument\
    \ for datetime). These codes specify `YMD` and `H:M`/`H:M:S` formats, respectively,\
    \ but are more relaxed in matching the patterns. The date parse, for example,\
    \ will allow different separators. For dates, both “1975-02-15” and “1975/02/15”\
    \ will be read as February 15, 1975, and for time, both “18:00” and “6:00 pm”\
    \ will be six o’clock in the evening.\n\nIn the following text, I give a few examples.\
    \ I will use the functions `parse_date`, `parse_time`, and `parse_datetime` rather\
    \ than `read_csv` with column type specifications. These functions are used by\
    \ `read_csv` when you specify a date, time, or datetime column type, but using\
    \ `read_csv` for the examples would be unnecessarily verbose. Each takes a vector\
    \ string representation of dates and time. For more examples, you can read the\
    \ function documentation `?col_datetime`.\n\nParsing time is simplest; there is\
    \ not much variation in how time points are written. The main differences are\
    \ in whether you use 24-hour clocks or 12-hour clocks. The `%R` and `%T` codes\
    \ expect 24-hour clocks and differ in whether seconds are included or not.\n\n\
    ```\nparse_time(c(\"18:00\"),format =\"%R\")\n## 18:00:00\nparse_time(c(\"18:00:30\"\
    ),format =\"%T\")\n## 18:00:30\n```\n\nThere is no shortcut for 12-hour codes,\
    \ but you must combine `%I` with `%p` to read PM/AM formats.\n\n```\nparse_time(c(\"\
    6 pm\"),format =\"%I %p\")\n## 18:00:00\n```\n\nHere, I have specified that the\
    \ input only includes hours and not minutes. If we want hours (and not minutes)\
    \ in 24-hour clocks, we need to use `%H` rather than `%R`.\n\n```\nparse_time(c(\"\
    18\"),format =\"%R\")\n## 18:00:00\n```\n\nFor dates, ISO 8601 says that the format\
    \ should be `YYYY-MM-DD`. The default date parser will accept this format, but\
    \ the explicit format string is\n\n```\nparse_date(c(\"1975-02-05\"),format =\"\
    %Y-%m-%d\")\n## [1] \"1975-02-05\"\n```\n\nIf you do not want to include the day,\
    \ and you want to use two-digit years, you need\n\n```\nparse_date(c(\"75-02\"\
    ),format =\"%y-%m\")\n## [1] \"1975-02-01\"\n```\n\nThis is February 1975; remember\
    \ that the `%y` code assumes that numbers above 68 are in the 20th century."
  raw: "### Function-Based Column Type Specification\n\nIf you are like me, you might\
    \ find it hard to remember the single-character codes for different types. If\
    \ so, you can use longer type names that you specify using function calls. These\
    \ functions have names that start with `col_`, so you can use autocomplete to\
    \ get a list of them. The types you can specify using functions are the same as\
    \ those you can specify using characters, of course, and the functions are as\
    \ follows:\n\n| **Function** | **Type** |\n| --- | --- |\n| `col_character()`\
    \ | Character |\n| `col_integer()` | Integer |\n| `col_number()` | Number |\n\
    | `col_double()` | Double |\n| `col_logical()` | Logical |\n| `col_factor()` |\
    \ Factor |\n| `col_date()` | Date |\n| `col_datetime()` | Datetime |\n| `col_time()`\
    \ | Time |\n| `col_guess()` | Guess (default) |\n| `col_skip()` | Skip the column\
    \ |\n\nYou need to wrap the function-based type specifications in a call to `cols`.\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_types =cols(A =col_integer())\n\
    )\n## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a\
    \     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n\
    read_csv(\nfile =\"data/data.csv\",\ncol_types =cols(D =col_character())\n)\n\
    ## # A tibble: 3 × 4\n##       A B     C     D\n##      \n## 1     1 a     a \
    \    1.2\n## 2     2 b     b     2.1\n## 3     3 c     c     13.0\n```\n\nMost\
    \ of the `col_` functions do not take any arguments, but they are affected by\
    \ the `locale` parameter the same way that the string specifications are.\n\n\
    For factors, date, time, and datetime types, however, you have more control over\
    \ the format using the `col_` functions. You can use arguments to these functions\
    \ for specifying how `read_csv` should parse dates and how it should construct\
    \ factors.\n\nFor factors, you can explicitly set the levels. If you do not, then\
    \ the column parser will set the levels in the order it sees the different strings\
    \ in the column. For example, in `data/data.csv` the strings in columns C and\
    \ D are in the order `a`, `b`, and `c`:\n\n```\nA, B, C,   D\n1, a, a,  1.2\n\
    2, b, b,  2.1\n3, c, c, 13.0\n```\n\nBy default, the two columns will be interpreted\
    \ as characters, but if we specify that C should be a factor, we get one where\
    \ the levels are `a`, `b`, and `c`, in that order.\n\n```\nmy_data<-read_csv(\n\
    file = \"data/data.csv\",\ncol_types = cols(C =col_factor())\n)\nmy_data$C\n##\
    \ [1] a b c\n## Levels: a b c\n```\n\nIf we want the levels in a different order,\
    \ we can give `col_factor()` a `levels` argument.\n\n```\nmy_data<-read_csv(\n\
    \"A, B, C\nFoo, 12.4, Medium\nBar, 5.2,   Small\nBaz, 42.0, Large\n\",\ncol_types\
    \ =cols(\nC =col_factor(levels =c(\"Small\",\"Medium\",\"Large\"))\n)\n)\nmy_data$C\n\
    ## [1] Medium Small   Large\n## Levels: Small Medium Large\n```\n\nWe can also\
    \ make factors ordered using the `ordered` argument .\n\n```\nmy_data<-read_csv(\n\
    file =\"data/data.csv\",\ncol_types =cols(\nB =col_factor(ordered =TRUE),\nC =col_factor(levels\
    \ =c(\"c\",\"b\",\"a\"))\n)\n)\nmy_data$B\n## [1] a b c\n## Levels: a b c\nmy_data$C\n\
    ## [1] a b c\n## Levels: c b a\n```\n\n## Parsing Time and Dates\n\nThe most complex\
    \ types to read (or write) are dates *and* time (and datetime), just because these\
    \ are written in many different ways. You can specify the format that dates and\
    \ datetime are in using a string with codes that indicate how time information\
    \ is represented.\n\nThe codes are these:\n\n| **Code** | **Time format** | **Example\
    \ string** | **Interpretation** |\n| --- | --- | --- | --- |\n| `%Y` | 4-digit\
    \ year | 1975 | The year 1975 |\n| `%y` | 2-digit year^([⁶](#fn6)) | 75 | Also\
    \ the year 1975 |\n| `%m` | 2-digit month | 02 | February |\n| `%b` | Abbreviated\
    \ month name^([⁷](#fn7)) | Feb | February |\n| `%B` | Full month name | February\
    \ | February |\n| `%d` | 2-digit day | 15 | The 15th of a month |\n| `%H` | Hour\
    \ number on a 24-hour clock | 18 | Six o’clock in the evening |\n| `%I` | Hour\
    \ number on a 12-hour clock^([⁸](#fn8)) | 6 pm | 18:00 hours |\n| `%p` | AM/PM\
    \ indicator | 6 pm | 18:00 hours |\n| `%M` | Two-digit minutes | 18:30 | Half\
    \ past six |\n| `%S` | Integer seconds | 18:30:10 | Ten seconds past 18:00 |\n\
    | `%Z` | Time zone as name^([⁹](#fn9)) | America/Chicago | Central Time |\n| `%z`\
    \ | Time zone as offset from UTC | “+0100” | Central European Time |\n\nThere\
    \ are shortcuts for frequently used formats:\n\n| **Shortcut** | **Format** |\n\
    | --- | --- |\n| `%D` | `%m/%d/%y` |\n| `%x` | `%y/%m/%d` |\n| `%F` | `%Y-%m-%d`\
    \ |\n| `%R` | `%H:%M` |\n| `%T` | `%H:%M:%S` |\n\nAs we saw earlier, you can set\
    \ the date and time format using the `locale()` function . If you do not, the\
    \ default codes will be `%AD` for dates and `%AT` for time (there is no `locale()`\
    \ argument for datetime). These codes specify `YMD` and `H:M`/`H:M:S` formats,\
    \ respectively, but are more relaxed in matching the patterns. The date parse,\
    \ for example, will allow different separators. For dates, both “1975-02-15” and\
    \ “1975/02/15” will be read as February 15, 1975, and for time, both “18:00” and\
    \ “6:00 pm” will be six o’clock in the evening.\n\nIn the following text, I give\
    \ a few examples. I will use the functions `parse_date`, `parse_time`, and `parse_datetime`\
    \ rather than `read_csv` with column type specifications. These functions are\
    \ used by `read_csv` when you specify a date, time, or datetime column type, but\
    \ using `read_csv` for the examples would be unnecessarily verbose. Each takes\
    \ a vector string representation of dates and time. For more examples, you can\
    \ read the function documentation `?col_datetime`.\n\nParsing time is simplest;\
    \ there is not much variation in how time points are written. The main differences\
    \ are in whether you use 24-hour clocks or 12-hour clocks. The `%R` and `%T` codes\
    \ expect 24-hour clocks and differ in whether seconds are included or not.\n\n\
    ```\nparse_time(c(\"18:00\"),format =\"%R\")\n## 18:00:00\nparse_time(c(\"18:00:30\"\
    ),format =\"%T\")\n## 18:00:30\n```\n\nThere is no shortcut for 12-hour codes,\
    \ but you must combine `%I` with `%p` to read PM/AM formats.\n\n```\nparse_time(c(\"\
    6 pm\"),format =\"%I %p\")\n## 18:00:00\n```\n\nHere, I have specified that the\
    \ input only includes hours and not minutes. If we want hours (and not minutes)\
    \ in 24-hour clocks, we need to use %H rather than %R.\n\n```\nparse_time(c(\"\
    18\"),format =\"%R\")\n## 18:00:00\n```\n\nFor dates, ISO 8601 says that the format\
    \ should be `YYYY-MM-DD`. The default date parser will accept this format, but\
    \ the explicit format string is\n\n```\nparse_date(c(\"1975-02-05\"),format =\"\
    %Y-%m-%d\")\n## [1] \"1975-02-05\"\n```\n\nIf you do not want to include the day,\
    \ and you want to use two-digit years, you need\n\n```\nparse_date(c(\"75-02\"\
    ),format =\"%y-%m\")\n## [1] \"1975-02-01\"\n```\n\nThis is February 1975; remember\
    \ that the `%y` code assumes that numbers above 68 are in the 20th century."
  trans: "\n### 基于函数的列类型指定\n\n如果你和我一样，可能会觉得记住不同列类型的单字符代码很困难。如果是这样，你可以使用通过函数调用指定的更长类型名称。这些函数以\
    \ `col_` 开头，因此你可以利用自动补全功能来获取它们的列表。通过函数指定的类型与使用字符指定的类型当然是一样的，具体函数如下：\n\n| **函数**\
    \ | **类型** |\n| --- | --- |\n| `col_character()` | 字符型 |\n| `col_integer()` |\
    \ 整型 |\n| `col_number()` | 数值型 |\n| `col_double()` | 双精度型 |\n| `col_logical()`\
    \ | 逻辑型 |\n| `col_factor()` | 因子型 |\n| `col_date()` | 日期型 |\n| `col_datetime()`\
    \ | 日期时间型 |\n| `col_time()` | 时间型 |\n| `col_guess()` | 猜测（默认） |\n| `col_skip()`\
    \ | 跳过该列 |\n\n你需要将基于函数的类型规范包裹在对 `cols` 的调用中。\n\n```\nread_csv(\nfile =\"data/data.csv\"\
    ,\ncol_types =cols(A =col_integer())\n)\n## # 一个 tibble: 3 × 4\n##       A B \
    \    C         D\n##      \n## 1     1 a     a       1.2\n## 2     2 b     b \
    \      2.1\n## 3     3 c     c      13\nread_csv(\nfile =\"data/data.csv\",\n\
    col_types =cols(D =col_character())\n)\n## # 一个 tibble: 3 × 4\n##       A B  \
    \   C     D\n##      \n## 1     1 a     a     1.2\n## 2     2 b     b     2.1\n\
    ## 3     3 c     c     13.0\n```\n\n大多数 `col_` 函数不接受任何参数，但它们的处理方式与字符串规范一样，都会受到\
    \ `locale` 参数的影响。\n\n然而，对于因子、日期、时间和日期时间类型，你可以使用 `col_` 函数对格式进行更多控制。你可以使用这些函数的参数来指定\
    \ `read_csv` 应如何解析日期以及如何构建因子。\n\n对于因子，你可以显式地设置其水平。如果不设置，列解析器将按照列中不同字符串出现的顺序来设置水平。例如，在\
    \ `data/data.csv` 中，C 列和 D 列中的字符串顺序为 `a`、`b` 和 `c`：\n\n```\nA, B, C,   D\n1, a,\
    \ a,  1.2\n2, b, b,  2.1\n3, c, c, 13.0\n```\n\n默认情况下，这两列将被解释为字符型，但如果我们将 C 指定为因子，则会得到一个水平顺序为\
    \ `a`、`b`、`c` 的因子。\n\n```\nmy_data<-read_csv(\nfile = \"data/data.csv\",\ncol_types\
    \ = cols(C =col_factor())\n)\nmy_data$C\n## [1] a b c\n## Levels: a b c\n```\n\
    \n如果我们希望水平按不同的顺序排列，可以给 `col_factor()` 一个 `levels` 参数。\n\n```\nmy_data<-read_csv(\n\
    \"A, B, C\nFoo, 12.4, Medium\nBar, 5.2,   Small\nBaz, 42.0, Large\n\",\ncol_types\
    \ =cols(\nC =col_factor(levels =c(\"Small\",\"Medium\",\"Large\"))\n)\n)\nmy_data$C\n\
    ## [1] Medium Small   Large\n## Levels: Small Medium Large\n```\n\n我们还可以使用 `ordered`\
    \ 参数将因子设置为有序因子。\n\n```\nmy_data<-read_csv(\nfile =\"data/data.csv\",\ncol_types\
    \ =cols(\nB =col_factor(ordered =TRUE),\nC =col_factor(levels =c(\"c\",\"b\",\"\
    a\"))\n)\n)\nmy_data$B\n## [1] a b c\n## Levels: a b c\nmy_data$C\n## [1] a b\
    \ c\n## Levels: c b a\n```\n\n## 解析时间和日期\n\n读取（或写入）时最复杂的类型是日期和时间（以及日期时间），仅仅是因为它们有多种不同的书写方式。你可以使用一个包含代码的字符串来指定日期和日期时间的格式，这些代码指示时间信息是如何表示的。\n\
    \n这些代码如下：\n\n| **代码** | **时间格式** | **示例字符串** | **解释** |\n| --- | --- | --- | ---\
    \ |\n| `%Y` | 4 位年份 | 1975 | 年份 1975 |\n| `%y` | 2 位年份^(⁶) | 75 | 同样表示年份 1975\
    \ |\n| `%m` | 2 位月份 | 02 | 二月 |\n| `%b` | 缩写的月份名称^(⁷) | Feb | 二月 |\n| `%B` | 完整的月份名称\
    \ | February | 二月 |\n| `%d` | 2 位日期 | 15 | 某月的第 15 天 |\n| `%H` | 24 小时制的小时数 |\
    \ 18 | 下午六点 |\n| `%I` | 12 小时制的小时数^(⁸) | 6 pm | 18:00 小时 |\n| `%p` | 上午/下午指示符\
    \ | 6 pm | 18:00 小时 |\n| `%M` | 两位数的分钟数 | 18:30 | 六点半 |\n| `%S` | 整数秒数 | 18:30:10\
    \ | 18:00 过 10 秒 |\n| `%Z` | 时区名称^(⁹) | America/Chicago | 中部时间 |\n| `%z` | 相对于\
    \ UTC 的时区偏移量 | “+0100” | 欧洲中部时间 |\n\n为常用格式提供了一些快捷方式：\n\n| **快捷方式** | **格式** |\n\
    | --- | --- |\n| `%D` | `%m/%d/%y` |\n| `%x` | `%y/%m/%d` |\n| `%F` | `%Y-%m-%d`\
    \ |\n| `%R` | `%H:%M` |\n| `%T` | `%H:%M:%S` |\n\n正如我们之前所见，你可以使用 `locale()` 函数设置日期和时间格式。如果不设置，默认代码会分别是针对日期的\
    \ `%AD` 和针对时间的 `%AT`（日期时间没有 `locale()` 参数）。这些代码分别指定了 `YMD` 和 `H:M`/`H:M:S` 格式，但在模式匹配方面更为宽松。例如，日期解析器允许使用不同的分隔符。对于日期，“1975-02-15”和“1975/02/15”都会被解读为\
    \ 1975 年 2 月 15 日；对于时间，“18:00”和“6:00 pm”都会被解读为下午六点。\n\n在下面的文字中，我将给出几个例子。我将使用 `parse_date`、`parse_time`\
    \ 和 `parse_datetime` 函数，而不是带有列类型规范的 `read_csv`。当你指定日期、时间或日期时间列类型时，`read_csv` 内部会使用这些函数，但在这个例子中使用\
    \ `read_csv` 会显得过于冗长。每个函数都接受一个表示日期和时间的字符串向量。获取更多示例，你可以阅读函数文档 `?col_datetime`。\n\
    \n解析时间是最简单的；时间点的书写方式变化不大。主要区别在于你是使用 24 小时制还是 12 小时制。`%R` 和 `%T` 代码期望使用 24 小时制，区别在于是否包含秒数。\n\
    \n```\nparse_time(c(\"18:00\"),format =\"%R\")\n## 18:00:00\nparse_time(c(\"18:00:30\"\
    ),format =\"%T\")\n## 18:00:30\n```\n\n没有用于 12 小时制的快捷方式，但你必须将 `%I` 与 `%p` 结合使用才能读取上午/下午格式。\n\
    \n```\nparse_time(c(\"6 pm\"),format =\"%I %p\")\n## 18:00:00\n```\n\n在这里，我指定了输入仅包含小时而不包含分钟。如果我们想在\
    \ 24 小时制中只表示小时（而不包含分钟），则需要使用 `%H` 而不是 `%R`。\n\n```\nparse_time(c(\"18\"),format\
    \ =\"%R\")\n## 18:00:00\n```\n\n对于日期，ISO 8601 规定格式应为 `YYYY-MM-DD`。默认的日期解析器会接受这种格式，但显式的格式字符串是\n\
    \n```\nparse_date(c(\"1975-02-05\"),format =\"%Y-%m-%d\")\n## [1] \"1975-02-05\"\
    \n```\n\n如果你不想包含日期，并且想使用两位数的年份，你需要\n\n```\nparse_date(c(\"75-02\"),format =\"\
    %y-%m\")\n## [1] \"1975-02-01\"\n```\n\n这是 1975 年 2 月；请记住，`%y` 代码假定大于 68 的数字属于\
    \ 20 世纪。\n"
- fmt: "日期以 `15/02/75` 形式书写时，根据你在世界上的位置，可能表示 1975 年 2 月 15 日，也可能表示 1975 年 5 月 2 日。欧洲使用合理的\
    \ `DD/MM/YY` 格式，顺序是从最小的时间单位（天）到中等的时间单位（月），再到年。在美国，他们使用 `MM/DD/YY` 格式。要得到 2 月 15\
    \ 日，你需要使用以下格式之一：\n\n```\nparse_date(c(\"15/02/75\"), format = \"%d/%m/%y\")\n\
    ## [1] \"1975-02-15\"\nparse_date(c(\"02/15/75\"), format = \"%m/%d/%y\")\n##\
    \ [1] \"1975-02-15\"\n```\n\n仅使用数字的日期规范不受本地语言影响，但如果包含月份名称，则会受到影响。月份名称及其缩写因语言而异，这很明显。星期几的名称也是如此，但在撰写本文时，`readr`\
    \ 暂不支持解析周和星期几。如果你使用语言代码，可以通过 `locale()` 获取名称信息。在以下示例中，我解析了英文和丹麦文的日期。月份名称几乎相同，但丹麦文的缩写后面需要跟一个点，并且日期后面也跟一个点。\n\
    \n```\nparse_date(c(\"Feb 15 1975\"), format = \"%b %d %Y\", locale = locale(\"\
    en\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"15. feb. 1975\"), format = \"%d.\
    \ %b %Y\", locale = locale(\"da\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"February\
    \ 15 1975\"), format = \"%B %d %Y\", locale = locale(\"en\"))\n## [1] \"1975-02-15\"\
    \nparse_date(c(\"15. feb. 1975\"), format = \"%d. %b %Y\", locale = locale(\"\
    da\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"Oct 15 1975\"), format = \"%b %d\
    \ %Y\", locale = locale(\"en\"))\n## [1] \"1975-10-15\"\nparse_date(c(\"15. okt.\
    \ 1975\"), format = \"%d. %b %Y\", locale = locale(\"da\"))\n## [1] \"1975-10-15\"\
    \nparse_date(c(\"October 15 1975\"), format = \"%B %d %Y\", locale = locale(\"\
    en\"))\n## [1] \"1975-10-15\"\nparse_date(c(\"15. oktober 1975\"), format = \"\
    %d. %B %Y\", locale = locale(\"da\"))\n## [1] \"1975-10-15\"\n```\n\n“日期时间”可以通过组合日期和时间字符串来解析。此外，你还需要考虑时区。对于仅限日期和时间的情况，你可以忽略时区，但除非你确定永远不需要考虑时区，否则不应依赖默认时区（即\
    \ UTC）。[^(10)](#fn10)\n\n你可以使用 `%z` 指定相对于 UTC 的时区，或者如果输入中给出了时区，使用 `%Z` 指定基于位置的时区；如果所有输入的时区都相同，你也可以使用\
    \ `locale()`。\n\n如果你指定基于位置的时区，R 会自动调整夏令时；但如果使用相对于 UTC 的日期，则不会自动调整——UTC 没有夏令时。欧洲中部时间（CET）是“+0100”，夏令时为“+0200”。美国太平洋时间（PST）是“-0800”，夏令时（PDT）为“-0700”。在夏令时之间来回切换的时间由你的位置决定。\n\
    \n以下两个日期时间是相同的：\n\n```\nparse_datetime(c(\"Feb 15 1975 18:00 US/Pacific\"), format\
    \ = \"%b %d %Y %R %Z\")\n## [1] \"1975-02-16 02:00:00 UTC\"\nparse_datetime(c(\"\
    Feb 15 1975 18:00 -0800\"), format = \"%b %d %Y %R %z\")\n## [1] \"1975-02-16\
    \ 02:00:00 UTC\"\n```\n\n以下两个也是相同的：\n\n```\nparse_datetime(c(\"Jun 15 1975 18:00\
    \ US/Pacific\"), format = \"%b %d %Y %R %Z\")\n## [1] \"1975-06-16 01:00:00 UTC\"\
    \nparse_datetime(c(\"Jun 15 1975 18:00 -0700\"), format = \"%b %d %Y %R %z\")\n\
    ## [1] \"1975-06-16 01:00:00 UTC\"\n```\n\n如果你使用 `locale()` 来指定时区，则不能使用相对于 UTC\
    \ 的时区。使用 `locale()` 的目的是本地格式，而非时区。不过，解析器仍然会为你处理夏令时。以下两个日期时间相同：\n\n```\nparse_datetime(\n\
    \  c(\"Aug 15 1975 18:00\"),\n  format = \"%b %d %Y %R\",\n  locale = locale(tz\
    \ = \"US/Pacific\")\n)\n## [1] \"1975-08-15 18:00:00 PDT\"\nparse_datetime(\n\
    \  c(\"Aug 15 1975 18:00 US/Pacific\"),\n  format = \"%b %d %Y %R %Z\"\n)\n##\
    \ [1] \"1975-08-16 01:00:00 UTC\"\n```\n\n它们打印出来的结果不同，但正如我们之前所见，下午 6 点（`18:00`）PDT\
    \ 与次日的 UTC 时间 `01:00` 相同。\n\n如果你打印解析出的对象，使用 `locale()` 和使用 `%Z` 会有区别，但时间本身是相同的。使用\
    \ `%Z` 时，时间会自动转换为 UTC；使用 `locale()` 时则不会。但你可以比较两次调用的结果，并发现它们是等价的对象：\n\n```\nx\
    \ <- parse_datetime(\n  c(\"Aug 15 1975 18:00\"),\n  format = \"%b %d %Y %R\"\
    ,\n  locale = locale(tz = \"US/Pacific\")\n)\ny <- parse_datetime(\n  c(\"Aug\
    \ 15 1975 18:00 US/Pacific\"),\n  format = \"%b %d %Y %R %Z\"\n)\nx == y\n## [1]\
    \ TRUE\n```\n\n`parse_datetime()` 的输出在打印时看起来像字符串，但对象的类并非 `character`，这也是比较能够正常工作的原因之一。\n\
    \n## 空格分隔的列\n\n前面的函数都用于读取分隔符分隔的列。它们期望使用单个字符来分隔列。如果参数 `trim_ws` 为真，它们会忽略空白。该参数在\
    \ `read_csv`、`read_csv2` 和 `read_tsv` 中默认为真，但在 `read_delim` 中默认为假。\n\n`read_table`\
    \ 函数则通过一个或多个空格来分隔列：\n\n```\nread_table(\n  \"A   B   C   D\n  1   2   3   4\n\
    \  15  16  17  18\"\n)\n## # A tibble: 2 × 4\n##       A     B     C     D\n##\
    \   <int> <int> <int> <int>\n## 1     1     2     3     4\n## 2    15    16  \
    \  17    18\n```\n\n与前面的函数一样，第一行被解释为表头，但你可以使用 `col_names = FALSE` 禁用它：\n\n```\n\
    read_table(\n  \"A   B   C   D\n  1   2   3   4\n  15  16  17  18\",\n  col_names\
    \ = FALSE\n)\n## # A tibble: 3 × 4\n##   X1    X2    X3    X4\n##   <chr> <chr>\
    \ <chr> <chr>\n## 1 A     B     C     D\n## 2 1     2     3     4\n## 3 15   \
    \ 16    17    18\n```\n\n`read_table` 函数接受许多与 `read_csv` 或 `read_tsv` 相同的参数，主要区别在于它对列分隔符的定义——该函数使用空白而非特定的字段分隔符（如逗号或分号）。\n\
    \n`readxl` 包在加载 `tidyverse` 包时不会被加载，但它非常有用。其 `read_excel` 函数顾名思义，用于将 Excel 电子表格读入\
    \ R。其接口与 `readr` 中的函数类似。不同之处在于 Excel 特定的选项，例如要读取哪个工作表。这些选项显然仅在读取 Excel 文件时需要。"
  raw: "Dates written on the form 15/02/75 can mean both February 15, 1975, and May\
    \ 2, 1975, depending on where you are in the world. Europe uses the sensible DD/MM/YY\
    \ format, where the order goes from the smallest time unit, days, to the medium\
    \ time units, months, and then to years. In the United States, they use the MM/DD/YY\
    \ format. To get the 15th of February, you need one of these formats :\n\n```\n\
    parse_date(c(\"15/02/75\"),format =\"%d/%m/%y\")\n## [1] \"1975-02-15\"\nparse_date(c(\"\
    02/15/75\"),format =\"%m/%d/%y\")\n## [1] \"1975-02-15\"\n```\n\nDate specifications\
    \ that only use numbers are not affected by the local language, but if you include\
    \ the name of months, they are. The name of months and their abbreviation varies\
    \ from language to language, obviously. So does the name of weekdays, but at the\
    \ time of writing, parsing weeks and weekdays is not supported by `readr`. You\
    \ can get the name information from `locale()` if you use a language code. In\
    \ the following examples, I parse dates in English and Danish. The month names\
    \ are almost the same, but abbreviations in Danish require a dot following them,\
    \ and the day is followed by a dot as well.\n\n```\nparse_date(c(\"Feb 15 1975\"\
    ),format =\"%b %d %Y\",locale =locale(\"en\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"\
    15\\. feb. 1975\"),format =\"%d. %b %Y\",locale =locale(\"da\"))\n## [1] \"1975-02-15\"\
    \nparse_date(c(\"February 15 1975\"),format =\"%B %d %Y\",locale =locale(\"en\"\
    ))\n## [1] \"1975-02-15\"\nparse_date(c(\"15\\. feb. 1975\"),format =\"%d. %b\
    \ %Y\",locale =locale(\"da\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"Oct 15 1975\"\
    ),format =\"%b %d %Y\",locale =locale(\"en\"))\n## [1] \"1975-10-15\"\nparse_date(c(\"\
    15\\. okt. 1975\"),format =\"%d. %b %Y\",locale =locale(\"da\"))\n## [1] \"1975-10-15\"\
    \nparse_date(c(\"October 15 1975\"),format =\"%B %d %Y\",locale =locale(\"en\"\
    ))\n## [1] \"1975-10-15\"\nparse_date(c(\"15\\. oktober 1975\"),format =\"%d.\
    \ %B %Y\",locale =locale(\"da\"))\n## [1] \"1975-10-15\"\n```\n\n“Datetimes” can\
    \ be parsed using combinations of date and time strings . With these, you also\
    \ want to consider time zones. You can ignore those for dates and time, but unless\
    \ you are sure that you will never have to consider time zones, you should not\
    \ rely on the default time zone (which is UTC).^([^(10)](#fn10))\n\nYou can either\
    \ specify that time zones are relative to UTC with `%z` or location based, with\
    \ `%Z` if the time zone is given in the input, or you can use `locale()` if it\
    \ is the same for all the input.\n\nIf you specify a time zone based on a location,\
    \ R will automatically adjust for daylight saving time, but if you use dates relative\
    \ to UTC, you will not—UTC does not have daylight savings. Central European Time\
    \ (CET) is “+0100” and with daylight saving time “+0200”. US Pacific Time (PST)\
    \ is “-0800”, but with daylight saving time (PDT), it is “-0700”. When you switch\
    \ back and forth between daylight savings is determined by your location.\n\n\
    These two datetimes are the same:\n\n```\nparse_datetime(c(\"Feb 15 1975 18:00\
    \ US/Pacific\"),format =\"%b %d %Y %R %Z\")\n## [1] \"1975-02-16 02:00:00 UTC\"\
    \nparse_datetime(c(\"Feb 15 1975 18:00 -0800\"),format =\"%b %d %Y %R %z\")\n\
    ## [1] \"1975-02-16 02:00:00 UTC\"\n```\n\nas are these two:\n\n```\nparse_datetime(c(\"\
    Jun 15 1975 18:00 US/Pacific\"),format =\"%b %d %Y %R %Z\")\n## [1] \"1975-06-16\
    \ 01:00:00 UTC\"\nparse_datetime(c(\"Jun 15 1975 18:00 -0700\"),format =\"%b %d\
    \ %Y %R %z\")\n## [1] \"1975-06-16 01:00:00 UTC\"\n```\n\nIf you use `locale()`\
    \ to specify a time zone, you cannot use zones relative to UTC. The point of using\
    \ `locale()` is local formats, not time zones. The parser will still handle daylight\
    \ savings for you, however. These two are the same datetimes:\n\n```\nparse_datetime(\n\
    c(\"Aug 15 1975 18:00\"),\nformat =\"%b %d %Y %R\",\nlocale =locale(tz =\"US/Pacific\"\
    )\n)\n## [1] \"1975-08-15 18:00:00 PDT\"\nparse_datetime(\nc(\"Aug 15 1975 18:00\
    \ US/Pacific\"),\nformat =\"%b %d %Y %R %Z\"\n)\n## [1] \"1975-08-16 01:00:00\
    \ UTC\"\n```\n\nThey are printed differently, but as we saw earlier, 6 pm (18:00)\
    \ PDT is the same as 01:00 (the following day) in UTC.\n\nIf you print the objects\
    \ you parse, there is a difference between using `locale()` and using `%Z`, but\
    \ the time will be the same. Using `%Z`, you will automatically translate the\
    \ time into UTC; using `locale()`, you will not. But you can compare the result\
    \ of the two calls and see that they are equivalent objects:\n\n```\nx<-parse_datetime(\n\
    c(\"Aug 15 1975 18:00\"),\nformat =\"%b %d %Y %R\",\nlocale =locale(tz =\"US/Pacific\"\
    )\n)\ny<-parse_datetime(\nc(\"Aug 15 1975 18:00 US/Pacific\"),\nformat =\"%b %d\
    \ %Y %R %Z\"\n)\nx==y\n## [1] TRUE\n```\n\nThe output of `parse_datetime()` looks\
    \ like strings when you print them, but the object classes are not `character`,\
    \ which, among other things, is why the comparison works.\n\n## Space-Separated\
    \ Columns\n\nThe preceding functions all read delimiter-separated columns . They\
    \ expect a single character to separate one column from the next. If the argument\
    \ `trim_ws` is true, they ignore whitespace. This argument is true by default\
    \ for `read_csv`, `read_csv2`, and `read_tsv`, but false for `read_delim`.\n\n\
    The function `read_table` instead separates columns by one or more spaces:\n\n\
    ```\nread_table(\n\"A   B   C   D\n1   2   3   4\n15  16  17  18\"\n)\n## # A\
    \ tibble: 2 × 4\n##       A     B     C     D\n##      \n## 1     1     2    \
    \ 3     4\n## 2    15    16    17    18\n```\n\nThe first line is interpreted\
    \ as a header, just as for the previous functions, but you can disable that with\
    \ `col_names = FALSE` again:\n\n```\nread_table(\n\"A   B   C   D\n1   2   3 \
    \  4\n15  16  17  18\",\ncol_names =FALSE\n)\n## # A tibble: 3 × 4\n##   X1  \
    \  X2    X3    X4\n##      \n## 1 A     B     C     D\n## 2 1     2     3    \
    \ 4\n## 3 15    16    17    18\n```\n\nThe `read_table` function takes many of\
    \ the same arguments as `read_csv` or `read_tsv` and mostly differs in what it\
    \ considers the column separator—this function uses whitespace instead of a specific\
    \ field separator such as a comma or a semicolon.\n\nThe package `readxl` is not\
    \ loaded when you load the package `tidyverse`, but can be quite useful. Its `read_excel`\
    \ function does exactly what it says on the tin; it reads Excel spreadsheets into\
    \ R. Its interface is similar to the functions in `readr`. Where the interface\
    \ differs is in Excel-specific options such as which sheet to read. Such options\
    \ are clearly only needed when reading Excel files."
  trans: "\n日期以 `15/02/75` 形式书写时，根据你在世界上的位置，可能表示 1975 年 2 月 15 日，也可能表示 1975 年 5 月\
    \ 2 日。欧洲使用合理的 `DD/MM/YY` 格式，顺序是从最小的时间单位（天）到中等的时间单位（月），再到年。在美国，他们使用 `MM/DD/YY`\
    \ 格式。要得到 2 月 15 日，你需要使用以下格式之一：\n\n```\nparse_date(c(\"15/02/75\"), format = \"\
    %d/%m/%y\")\n## [1] \"1975-02-15\"\nparse_date(c(\"02/15/75\"), format = \"%m/%d/%y\"\
    )\n## [1] \"1975-02-15\"\n```\n\n仅使用数字的日期规范不受本地语言影响，但如果包含月份名称，则会受到影响。月份名称及其缩写因语言而异，这很明显。星期几的名称也是如此，但在撰写本文时，`readr`\
    \ 暂不支持解析周和星期几。如果你使用语言代码，可以通过 `locale()` 获取名称信息。在以下示例中，我解析了英文和丹麦文的日期。月份名称几乎相同，但丹麦文的缩写后面需要跟一个点，并且日期后面也跟一个点。\n\
    \n```\nparse_date(c(\"Feb 15 1975\"), format = \"%b %d %Y\", locale = locale(\"\
    en\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"15. feb. 1975\"), format = \"%d.\
    \ %b %Y\", locale = locale(\"da\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"February\
    \ 15 1975\"), format = \"%B %d %Y\", locale = locale(\"en\"))\n## [1] \"1975-02-15\"\
    \nparse_date(c(\"15. feb. 1975\"), format = \"%d. %b %Y\", locale = locale(\"\
    da\"))\n## [1] \"1975-02-15\"\nparse_date(c(\"Oct 15 1975\"), format = \"%b %d\
    \ %Y\", locale = locale(\"en\"))\n## [1] \"1975-10-15\"\nparse_date(c(\"15. okt.\
    \ 1975\"), format = \"%d. %b %Y\", locale = locale(\"da\"))\n## [1] \"1975-10-15\"\
    \nparse_date(c(\"October 15 1975\"), format = \"%B %d %Y\", locale = locale(\"\
    en\"))\n## [1] \"1975-10-15\"\nparse_date(c(\"15. oktober 1975\"), format = \"\
    %d. %B %Y\", locale = locale(\"da\"))\n## [1] \"1975-10-15\"\n```\n\n“日期时间”可以通过组合日期和时间字符串来解析。此外，你还需要考虑时区。对于仅限日期和时间的情况，你可以忽略时区，但除非你确定永远不需要考虑时区，否则不应依赖默认时区（即\
    \ UTC）。¹⁰\n\n你可以使用 `%z` 指定相对于 UTC 的时区，或者如果输入中给出了时区，使用 `%Z` 指定基于位置的时区；如果所有输入的时区都相同，你也可以使用\
    \ `locale()`。\n\n如果你指定基于位置的时区，R 会自动调整夏令时；但如果使用相对于 UTC 的日期，则不会自动调整——UTC 没有夏令时。欧洲中部时间（CET）是“+0100”，夏令时为“+0200”。美国太平洋时间（PST）是“-0800”，夏令时（PDT）为“-0700”。在夏令时之间来回切换的时间由你的位置决定。\n\
    \n以下两个日期时间是相同的：\n\n```\nparse_datetime(c(\"Feb 15 1975 18:00 US/Pacific\"), format\
    \ = \"%b %d %Y %R %Z\")\n## [1] \"1975-02-16 02:00:00 UTC\"\nparse_datetime(c(\"\
    Feb 15 1975 18:00 -0800\"), format = \"%b %d %Y %R %z\")\n## [1] \"1975-02-16\
    \ 02:00:00 UTC\"\n```\n\n以下两个也是相同的：\n\n```\nparse_datetime(c(\"Jun 15 1975 18:00\
    \ US/Pacific\"), format = \"%b %d %Y %R %Z\")\n## [1] \"1975-06-16 01:00:00 UTC\"\
    \nparse_datetime(c(\"Jun 15 1975 18:00 -0700\"), format = \"%b %d %Y %R %z\")\n\
    ## [1] \"1975-06-16 01:00:00 UTC\"\n```\n\n如果你使用 `locale()` 来指定时区，则不能使用相对于 UTC\
    \ 的时区。使用 `locale()` 的目的是本地格式，而非时区。不过，解析器仍然会为你处理夏令时。以下两个日期时间相同：\n\n```\nparse_datetime(\n\
    \  c(\"Aug 15 1975 18:00\"),\n  format = \"%b %d %Y %R\",\n  locale = locale(tz\
    \ = \"US/Pacific\")\n)\n## [1] \"1975-08-15 18:00:00 PDT\"\nparse_datetime(\n\
    \  c(\"Aug 15 1975 18:00 US/Pacific\"),\n  format = \"%b %d %Y %R %Z\"\n)\n##\
    \ [1] \"1975-08-16 01:00:00 UTC\"\n```\n\n它们打印出来的结果不同，但正如我们之前所见，下午 6 点（`18:00`）PDT\
    \ 与次日的 UTC 时间 `01:00` 相同。\n\n如果你打印解析出的对象，使用 `locale()` 和使用 `%Z` 会有区别，但时间本身是相同的。使用\
    \ `%Z` 时，时间会自动转换为 UTC；使用 `locale()` 时则不会。但你可以比较两次调用的结果，并发现它们是等价的对象：\n\n```\nx\
    \ <- parse_datetime(\n  c(\"Aug 15 1975 18:00\"),\n  format = \"%b %d %Y %R\"\
    ,\n  locale = locale(tz = \"US/Pacific\")\n)\ny <- parse_datetime(\n  c(\"Aug\
    \ 15 1975 18:00 US/Pacific\"),\n  format = \"%b %d %Y %R %Z\"\n)\nx == y\n## [1]\
    \ TRUE\n```\n\n`parse_datetime()` 的输出在打印时看起来像字符串，但对象的类并非 `character`，这也是比较能够正常工作的原因之一。\n\
    \n## 空格分隔的列\n\n前面的函数都用于读取分隔符分隔的列。它们期望使用单个字符来分隔列。如果参数 `trim_ws` 为真，它们会忽略空白。该参数在\
    \ `read_csv`、`read_csv2` 和 `read_tsv` 中默认为真，但在 `read_delim` 中默认为假。\n\n`read_table`\
    \ 函数则通过一个或多个空格来分隔列：\n\n```\nread_table(\n  \"A   B   C   D\n  1   2   3   4\n\
    \  15  16  17  18\"\n)\n## # A tibble: 2 × 4\n##       A     B     C     D\n##\
    \   <int> <int> <int> <int>\n## 1     1     2     3     4\n## 2    15    16  \
    \  17    18\n```\n\n与前面的函数一样，第一行被解释为表头，但你可以使用 `col_names = FALSE` 禁用它：\n\n```\n\
    read_table(\n  \"A   B   C   D\n  1   2   3   4\n  15  16  17  18\",\n  col_names\
    \ = FALSE\n)\n## # A tibble: 3 × 4\n##   X1    X2    X3    X4\n##   <chr> <chr>\
    \ <chr> <chr>\n## 1 A     B     C     D\n## 2 1     2     3     4\n## 3 15   \
    \ 16    17    18\n```\n\n`read_table` 函数接受许多与 `read_csv` 或 `read_tsv` 相同的参数，主要区别在于它对列分隔符的定义——该函数使用空白而非特定的字段分隔符（如逗号或分号）。\n\
    \n`readxl` 包在加载 `tidyverse` 包时不会被加载，但它非常有用。其 `read_excel` 函数顾名思义，用于将 Excel 电子表格读入\
    \ R。其接口与 `readr` 中的函数类似。不同之处在于 Excel 特定的选项，例如要读取哪个工作表。这些选项显然仅在读取 Excel 文件时需要。\n"
- fmt: "### Functions for Writing Data\n\nWriting data to a file is more straightforward\
    \ than reading data because we have the data in the correct types and we do not\
    \ need to deal with different formats. With `readr`’s writing functions, we have\
    \ fewer options to format our output—for example, we cannot give the functions\
    \ a `locale()` and we cannot specify date and time formatting, but we can use\
    \ different functions to specify delimiters and time will be output in ISO 8601\
    \ which is what the reading functions will use as default.\n\nThe functions are\
    \ `write_delim`, `write_csv`, `write_csv2`, and `write_tsv`, and for formats that\
    \ Excel can read, `write_excel_csv` and `write_excel_csv2`. The difference between\
    \ `write_csv` and `write_excel_csv` and between `write_csv2` and `write_excel_csv2`\
    \ is that the Excel functions include a UTF-8 byte order mark so Excel knows that\
    \ the file is UTF-8 encoded.\n\nThe first argument to these functions is the data\
    \ we want to write, and the second is the path to the file we want to write to.\
    \ If this file has suffix `.gz`, `.bz2`, or `.xz`, the output is automatically\
    \ compressed.\n\nI will not list all the arguments for these functions here, but\
    \ you can read the documentation for them from the R console. The argument you\
    \ are most likely to use is `col_names`, which, if true, means that the function\
    \ will write the column names as the first line in the output, and if false, it\
    \ will not. If you use `write_delim`, you might also want to specify the delimiter\
    \ character using the `delim` argument. By default, it is a single space; if you\
    \ write to a file using `write_delim` with the default options, you get the data\
    \ in a format that you can read using `read_table`.\n\nThe delimiter characters\
    \ and the decimal points for `write_csv`, `write_csv2`, and `write_tsv` are the\
    \ same as for the corresponding read functions.\n\nFootnotes [1](#476587_2_En_2_Chapter.xhtml#Fn1_source)\
    \  [2](#476587_2_En_2_Chapter.xhtml#Fn2_source)  [3](#476587_2_En_2_Chapter.xhtml#Fn3_source)\
    \  [4](#476587_2_En_2_Chapter.xhtml#Fn4_source)  [5](#476587_2_En_2_Chapter.xhtml#Fn5_source)\
    \  [6](#476587_2_En_2_Chapter.xhtml#Fn6_source)  [7](#476587_2_En_2_Chapter.xhtml#Fn7_source)\
    \  [8](#476587_2_En_2_Chapter.xhtml#Fn8_source)  [9](#476587_2_En_2_Chapter.xhtml#Fn9_source)\n\
    \n# Representing Tables: `tibble`\n\nThe data that the `readr` package returns\
    \ are represented as `tibble` objects. These are tabular data representations\
    \ similar to the base R data frames but are a more modern version.\n\nThe package\
    \ that implements tibbles is `tibble`. You can load it using\n\n```r\nlibrary(tibble)\n\
    ```\n\nor as part of the tidyverse:\n\n```r\nlibrary(tidyverse)\n```\n\n## Creating\
    \ Tibbles\n\nTidyverse functions that create tabular data will create tibbles\
    \ rather than data frames. For example, when we use `read_csv` to read a file\
    \ into memory, the result is a tibble:\n\n```r\nx <- read_csv(\"some_file.csv\"\
    )\nx\n## # A tibble: 3 × 4\n##       A B     C         D\n##   <int> <chr> <chr>\
    \ <dbl>\n## 1     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3    \
    \ 3 c     c      13\n```\n\nThe table that `read_csv()` creates has several superclasses,\
    \ but the last is `data.frame`.\n\n```r\nclass(x)\n## [1] \"spec_tbl_df\" \"tbl_df\"\
    \    \"tbl\"\n## [4] \"data.frame\"\n```\n\nThis means that generic functions,\
    \ if not specialized in the other classes, will use the `data.frame` version,\
    \ and this, in turn, means that you can often use tibbles in functions that expect\
    \ data frames. It does not mean that you can *always* use tibbles as a replacement\
    \ for a data frame. If you run into this problem, you can translate a tibble into\
    \ a data frame using `as.data.frame()`:\n\n```r\ny <- as.data.frame(x)\ny\n##\
    \   A B C     D\n## 1 1 a a   1.2\n## 2 2 b b   2.1\n## 3 3 c c  13.0\nclass(y)\n\
    ## [1] \"data.frame\"\n```\n\nNotice that the two objects, when printed, give\
    \ different output. When printing a tibble, there is more information about the\
    \ column types.\n\nIf you have a data frame, you can translate it into a tibble\
    \ using `as_tibble()`:\n\n```r\nz <- as_tibble(y)\nz\n## # A tibble: 3 × 4\n##\
    \       A B     C         D\n##   <int> <chr> <chr> <dbl>\n## 1     1 a     a\
    \       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\n\
    You can create a tibble from vectors using the `tibble()` function:\n\n```r\n\
    x <- tibble(\n  x = 1:100,\n  y = x^2,\n  z = y^2\n)\nx\n## # A tibble: 100 ×\
    \ 3\n##        x     y     z\n##    <int> <dbl> <dbl>\n##  1     1     1     \
    \ 1\n##  2     2     4     16\n##  3     3     9     81\n##  4     4    16   \
    \ 256\n##  5     5    25    625\n##  6     6    36   1296\n##  7     7    49 \
    \  2401\n##  8     8    64   4096\n##  9     9    81   6561\n## 10    10   100\
    \  10000\n## # . . . with 90 more rows\n```\n\nTwo things to notice here: when\
    \ you print a tibble, you only see the first 10 lines. This is because the tibble\
    \ has enough lines that it will flood the console if you print all of them. If\
    \ a tibble has more than 20 rows, you will only see the first 10. If it has fewer,\
    \ you will see all the rows.\n\nYou can change how many lines you will see using\
    \ the `n` option to `print()`:\n\n```r\nprint(x, n = 2)\n## # A tibble:  100 ×\
    \ 3\n##        x     y     z\n##    <int> <dbl> <dbl>\n## 1     1     1     1\n\
    ## 2     2     4    16\n## # . . . with 98 more rows\n```\n\nIf a tibble has more\
    \ columns than your console can show, only some will be printed. You can change\
    \ the number of characters it will print using the `width` option to `print`.\n\
    \n```r\nprint(x, n = 2, width = 15)\n## # A tibble:\n## #   100 × 3\n##      \
    \ x     y\n##    <int> <dbl>\n## 1     1     1\n## 2     2     4\n## # . . . with\
    \ 98\n## #   more rows,\n## #   and 1 more\n## #   variable:\n## #   z\n```\n\n\
    You can set either option to `Inf`. If `n` is `Inf`, you will see all rows, and\
    \ if `width` is `Inf`, you will see all the columns.\n\nThe second thing to notice\
    \ is that you can refer to previous columns when specifying later columns. When\
    \ we created `x`, we used\n\n```r\ntibble(\n  x = 1:100,\n  y = x^2,\n  z = y^2\n\
    )\n```\n\nwhere column `y` refers to column `x` and column `z` refers to column\
    \ `y`. You cannot refer to a variable in the following columns, so this would\
    \ be an error:\n\n```r\ntibble(\n  w = x/2,\n  x = 1:100\n)\n```\n\nWhen you use\
    \ `tibble()` to create a data frame, you specify the columns as named arguments.\
    \ If you indent your code as I have earlier, then you can think of this as defining\
    \ each column in one line. You can also create a tibble with one line per row.\n\
    \n```r\ntribble(\n  ~x, ~y, ~z,\n  1, 10, 100,\n  2, 20, 200,\n  3, 30, 300\n\
    )\n## # A tibble: 3 × 3\n##       x     y     z\n##   <dbl> <dbl> <dbl>\n## 1\
    \     1    10    100\n## 2     2    20    200\n## 3     3    30    300\n```\n\n\
    The first line names the columns, and the `~` is necessary before the names. For\
    \ large tibbles, using `tribble()` is not that helpful, but for example code or\
    \ small tables, it can be."
  raw: "## Functions for Writing Data\n\nWriting data to a file is more straightforward\
    \ than reading data because we have the data in the correct types and we do not\
    \ need to deal with different formats. With `readr`’s writing functions, we have\
    \ fewer options to format our output—for example, we cannot give the functions\
    \ a `locale()` and we cannot specify date and time formatting, but we can use\
    \ different functions to specify delimiters and time will be output in ISO 8601\
    \ which is what the reading functions will use as default.\n\nThe functions are\
    \ `write_delim`, `write_csv`, `write_csv2`, and `write_tsv`, and for formats that\
    \ Excel can read, `write_excel_csv` and `write_excel_csv2`. The difference between\
    \ `write_csv` and `write_excel_csv` and between `write_csv2` and `write_excel_csv2`\
    \ is that the Excel functions include a UTF-8 byte order mark so Excel knows that\
    \ the file is UTF-8 encoded.\n\nThe first argument to these functions is the data\
    \ we want to write, and the second is the path to the file we want to write to.\
    \ If this file has suffix .`gz`, `.bz2`, or .`xz`, the output is automatically\
    \ compressed.\n\nI will not list all the arguments for these functions here, but\
    \ you can read the documentation for them from the R console. The argument you\
    \ are most likely to use is `col_names`, which, if true, means that the function\
    \ will write the column names as the first line in the output, and if false, it\
    \ will not. If you use `write_delim`, you might also want to specify the delimiter\
    \ character using the `delim` argument. By default, it is a single space; if you\
    \ write to a file using `write_delim` with the default options, you get the data\
    \ in a format that you can read using `read_table`.\n\nThe delimiter characters\
    \ and the decimal points for `write_csv`, `write_csv2`, and `write_tsv` are the\
    \ same as for the corresponding read functions.\n\nFootnotes [1](#476587_2_En_2_Chapter.xhtml#Fn1_source)\
    \   [2](#476587_2_En_2_Chapter.xhtml#Fn2_source)   [3](#476587_2_En_2_Chapter.xhtml#Fn3_source)\
    \   [4](#476587_2_En_2_Chapter.xhtml#Fn4_source)   [5](#476587_2_En_2_Chapter.xhtml#Fn5_source)\
    \   [6](#476587_2_En_2_Chapter.xhtml#Fn6_source)   [7](#476587_2_En_2_Chapter.xhtml#Fn7_source)\
    \   [8](#476587_2_En_2_Chapter.xhtml#Fn8_source)   [9](#476587_2_En_2_Chapter.xhtml#Fn9_source)\n\
    \n# 3. Representing Tables: **tibble**\n\nThe data that the `readr` package returns\
    \ are represented as `tibble` objects. These are tabular data representations\
    \ similar to the base R data frames but are a more modern version.\n\nThe package\
    \ that implements tibbles is `tibble`. You can load it using\n\n```\nlibrary(tibble)\n\
    ```\n\nor as part of the tidyverse:\n\n```\nlibrary(tidyverse)\n```\n\n## Creating\
    \ Tibbles\n\nTidyverse functions that create tabular data will create tibbles\
    \ rather than data frames. For example, when we use `read_csv` to read a file\
    \ into memory, the result is a tibble:\n\n```\nx   \n## 1     1 a     a      \
    \ 1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\nThe table\
    \ that `read_csv()` creates has several superclasses, but the last is `data.frame`.\n\
    \n```\nclass(x)\n## [1] \"spec_tbl_df\" \"tbl_df\"    \"tbl\"\n## [4] \"data.frame\"\
    \n```\n\nThis means that generic functions, if not specialized in the other classes,\
    \ will use the `data.frame` version , and this, in turn, means that you can often\
    \ use tibbles in functions that expect data frames. It does not mean that you\
    \ can *always* use tibbles as a replacement for a data frame. If you run into\
    \ this problem, you can translate a tibble into a data frame using `as.data.frame()`:\n\
    \n```\ny<-as.data.frame(x)\ny\n##   A B C     D\n## 1 1 a a   1.2\n## 2 2 b b\
    \   2.1\n## 3 3 c c  13.0\nclass(y)\n## [1] \"data.frame\"\n```\n\nNotice that\
    \ the two objects, when printed, give different output. When printing a tibble,\
    \ there is more information about the column types.\n\nIf you have a data frame,\
    \ you can translate it into a tibble using `as_tibble()` :\n\n```\nz   \n## 1\
    \     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c  \
    \    13\n```\n\nYou can create a tibble from vectors using the `tibble()` function\
    \ :\n\n```\nx    \n## 1      1     1      1\n## 2      2     4     16\n## 3  \
    \    3     9     81\n## 4      4    16    256\n## 5      5    25    625\n## 6\
    \      6    36   1296\n## 7      7    49   2401\n## 8      8    64   4096\n##\
    \ 9      9    81   6561\n## 10    10   100  10000\n## # . . . with 90 more rows\n\
    ```\n\nTwo things to notice here: when you print a tibble, you only see the first\
    \ 10 lines. This is because the tibble has enough lines that it will flood the\
    \ console if you print all of them. If a tibble has more than 20 rows, you will\
    \ only see the first 10\\. If it has fewer, you will see all the rows.\n\nYou\
    \ can change how many lines you will see using the n option to `print()` :\n\n\
    ```\nprint(x,n =2)\n## # A tibble:  100 × 3\n##        x     y     z\n##     \
    \ \n## 1      1     1     1\n## 2      2     4    16\n## # . . . with 98 more\
    \ rows\n```\n\nIf a tibble has more columns than your console can show, only some\
    \ will be printed. You can change the number of characters it will print using\
    \ the width option to print.\n\n```\nprint(x,n =2,width =15)\n## # A tibble:\n\
    ## #   100 × 3\n##       x     y\n##    \n## 1     1     1\n## 2     2     4\n\
    ## # . . . with 98\n## #   more rows,\n## #   and 1 more\n## #   variable:\n##\
    \ #   z \n```\n\nYou can set either option to Inf. If `n` is `Inf`, you will see\
    \ all rows, and if `width` is `Inf`, you will see all the columns.\n\nThe second\
    \ thing to notice is that you can refer to previous columns when specifying later\
    \ columns. When we created x, we used\n\n```\ntibble(\nx =1:100,\ny =xˆ2,\nz =yˆ2\n\
    )\n```\n\nwhere column `y` refers to column `x` and column `z` refers to column\
    \ `y`. You cannot refer to a variable in the following columns, so this would\
    \ be an error :\n\n```\ntibble(\nw =x/2,\nx =1:100\n)\n```\n\nWhen you use `tibble()`\
    \ to create a data frame, you specify the columns as named arguments. If you indent\
    \ your code as I have earlier, then you can think of this as defining each column\
    \ in one line. You can also create a tibble with one line per row.\n\n```\ntribble(\n\
    ~x,~y, ~z,\n1,10,100,\n2,20,200,\n3,30,300\n)\n## # A tibble: 3 × 3\n##      \
    \ x     y     z\n##     \n## 1     1    10    100\n## 2     2    20    200\n##\
    \ 3     3    30    300\n```\n\nThe first line names the columns, and the `~` is\
    \ necessary before the names. For large tibbles, using `tribble()` is not that\
    \ helpful, but for example code or small tables, it can be."
  trans: "\n### 写入数据的函数\n\n将数据写入文件比读取数据更直接，因为我们拥有正确类型的数据，无需处理不同格式。借助 `readr` 的写入函数，我们用于格式化输出的选项较少——例如，我们无法为函数提供\
    \ `locale()`，也无法指定日期和时间格式，但我们可以使用不同函数来指定分隔符，时间将按 ISO 8601 格式输出，这也是读取函数默认使用的格式。\n\
    \n相关函数包括 `write_delim`、`write_csv`、`write_csv2` 和 `write_tsv`，以及针对 Excel 可读格式的\
    \ `write_excel_csv` 和 `write_excel_csv2`。`write_csv` 与 `write_excel_csv` 之间的区别，以及\
    \ `write_csv2` 与 `write_excel_csv2` 之间的区别在于：Excel 函数会包含一个 UTF-8 字节顺序标记，以便 Excel\
    \ 识别文件是 UTF-8 编码的。\n\n这些函数的第一个参数是要写入的数据，第二个参数是目标文件路径。如果该文件的后缀为 `.gz`、`.bz2` 或\
    \ `.xz`，输出将自动压缩。\n\n此处我不会列出这些函数的所有参数，但你可以从 R 控制台中查阅它们的文档。你最可能用到的参数是 `col_names`，如果设为\
    \ `true`，函数会将列名作为输出文件的第一行写入；如果设为 `false`，则不会。如果你使用 `write_delim`，可能还需要通过 `delim`\
    \ 参数指定分隔符。默认情况下，它是一个空格；如果你使用默认选项的 `write_delim` 写入文件，你将获得一种可以通过 `read_table` 读取的数据格式。\n\
    \n`write_csv`、`write_csv2` 和 `write_tsv` 的分隔符和小数点与对应的读取函数相同。\n\n脚注 1  2  3  4\
    \  5  6  7  8  9\n\n# 表示表格：`tibble`\n\n`readr` 包返回的数据以 `tibble` 对象表示。这些是类似于基础\
    \ R 数据框的表格数据表示形式，但属于更现代的版本。\n\n实现 tibble 的包是 `tibble`。你可以通过以下方式加载它：\n\n```r\n\
    library(tibble)\n```\n\n或者作为 tidyverse 的一部分：\n\n```r\nlibrary(tidyverse)\n```\n\
    \n## 创建 Tibble\n\n创建表格数据的 Tidyverse 函数将生成 tibble 而非数据框。例如，当我们使用 `read_csv` 将文件读入内存时，结果就是一个\
    \ tibble：\n\n```r\nx <- read_csv(\"some_file.csv\")\nx\n## # A tibble: 3 × 4\n\
    ##       A B     C         D\n##   <int> <chr> <chr> <dbl>\n## 1     1 a     a\
    \       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\n\
    `read_csv()` 创建的表具有多个超类，但最后一个类是 `data.frame`。\n\n```r\nclass(x)\n## [1] \"spec_tbl_df\"\
    \ \"tbl_df\"    \"tbl\"\n## [4] \"data.frame\"\n```\n\n这意味着，泛型函数如果未在其他类中特化，将使用\
    \ `data.frame` 版本，而这也意味着你通常可以在期望数据框的函数中使用 tibble。但这并不表示你*始终*能用 tibble 替代数据框。如果遇到此问题，你可以使用\
    \ `as.data.frame()` 将 tibble 转换为数据框：\n\n```r\ny <- as.data.frame(x)\ny\n##   A\
    \ B C     D\n## 1 1 a a   1.2\n## 2 2 b b   2.1\n## 3 3 c c  13.0\nclass(y)\n\
    ## [1] \"data.frame\"\n```\n\n注意，这两个对象在打印时输出不同。打印 tibble 时，会包含更多关于列类型的信息。\n\n\
    如果你有一个数据框，可以使用 `as_tibble()` 将其转换为 tibble：\n\n```r\nz <- as_tibble(y)\nz\n## #\
    \ A tibble: 3 × 4\n##       A B     C         D\n##   <int> <chr> <chr> <dbl>\n\
    ## 1     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c\
    \      13\n```\n\n你可以使用 `tibble()` 函数从向量创建 tibble：\n\n```r\nx <- tibble(\n  x\
    \ = 1:100,\n  y = x²,\n  z = y²\n)\nx\n## # A tibble: 100 × 3\n##        x   \
    \  y     z\n##    <int> <dbl> <dbl>\n##  1     1     1      1\n##  2     2   \
    \  4     16\n##  3     3     9     81\n##  4     4    16    256\n##  5     5 \
    \   25    625\n##  6     6    36   1296\n##  7     7    49   2401\n##  8     8\
    \    64   4096\n##  9     9    81   6561\n## 10    10   100  10000\n## # . . .\
    \ with 90 more rows\n```\n\n这里需要注意两件事：当你打印一个 tibble 时，只会看到前 10 行。这是因为如果 tibble\
    \ 行数足够多，打印全部会淹没控制台。如果一个 tibble 有超过 20 行，你只会看到前 10 行；如果行数更少，你将看到所有行。\n\n你可以使用 `print()`\
    \ 的 `n` 选项来更改显示的行数：\n\n```r\nprint(x, n = 2)\n## # A tibble:  100 × 3\n##    \
    \    x     y     z\n##    <int> <dbl> <dbl>\n## 1     1     1     1\n## 2    \
    \ 2     4    16\n## # . . . with 98 more rows\n```\n\n如果一个 tibble 的列数超出控制台显示范围，则只打印部分列。你可以使用\
    \ `print` 的 `width` 选项来更改打印的字符数。\n\n```r\nprint(x, n = 2, width = 15)\n## # A\
    \ tibble:\n## #   100 × 3\n##       x     y\n##    <int> <dbl>\n## 1     1   \
    \  1\n## 2     2     4\n## # . . . with 98\n## #   more rows,\n## #   and 1 more\n\
    ## #   variable:\n## #   z\n```\n\n你可以将任一选项设置为 `Inf`。如果 `n` 为 `Inf`，你将看到所有行；如果\
    \ `width` 为 `Inf`，你将看到所有列。\n\n第二件要注意的事情是，在指定后面的列时可以引用前面的列。当我们创建 `x` 时，我们使用了\n\n\
    ```r\ntibble(\n  x = 1:100,\n  y = x²,\n  z = y²\n)\n```\n\n其中列 `y` 引用了列 `x`，列\
    \ `z` 引用了列 `y`。你不能引用后续列中的变量，因此以下代码会报错：\n\n```r\ntibble(\n  w = x/2,\n  x = 1:100\n\
    )\n```\n\n当你使用 `tibble()` 创建数据框时，需要将列指定为命名参数。如果你像我之前那样缩进代码，可以将此视为每行定义一个列。你也可以按行创建\
    \ tibble，每行对应一行数据。\n\n```r\ntribble(\n  ~x, ~y, ~z,\n  1, 10, 100,\n  2, 20, 200,\n\
    \  3, 30, 300\n)\n## # A tibble: 3 × 3\n##       x     y     z\n##   <dbl> <dbl>\
    \ <dbl>\n## 1     1    10    100\n## 2     2    20    200\n## 3     3    30  \
    \  300\n```\n\n第一行命名列，名称前必须加 `~`。对于大型 tibble，使用 `tribble()` 并不是很有帮助，但对于示例代码或小型表格，则很方便。\n"
- fmt: "# Indexing Tibbles\n\nYou can index a tibble in much the same way as you can\
    \ index a data frame. You can extract a column using a single-bracket index (`[]`),\
    \ either by name or by index:\n\n```\nx\n## 1     1\n## 2     2\n## 3     3\n\
    y[\"A\"]\n##   A\n## 1 1\n## 2 2\n## 3 3\nx[1]\n## # A tibble: 3 × 1\n##     \
    \  A\n##   \n## 1     1\n## 2     2\n## 3     3\ny[1]\n##   A\n## 1 1\n## 2 2\n\
    ## 3 3\n```\n\nThe result is a `tibble` or `data.frame`, respectively, containing\
    \ a single column.\n\nIf you use double brackets (`[[]]`), you will get the vector\
    \ contained in a column rather than a tibble/data frame :\n\n```\nx[[\"A\"]]\n\
    ## [1] 1 2 3\ny[[\"A\"]]\n## [1] 1 2 3\n```\n\nYou will also get the underlying\
    \ vector of a column if you use `$` indexing:\n\n```\nx$A\n## [1] 1 2 3\ny$A\n\
    ## [1] 1 2 3\n```\n\nUsing `[]`, you can extract more than one column.\n\n```\n\
    x[c(\"A\",\"C\")]\n## # A tibble: 3 × 2\n##       A C\n##    \n## 1     1 a\n\
    ## 2     2 b\n## 3     3 c\ny[c(\"A\",\"C\")]\n##   A C\n## 1 1 a\n## 2 2 b\n\
    ## 3 3 c\nx[1:2]\n## # A tibble: 3 × 2\n##       A B\n##    \n## 1     1 a\n##\
    \ 2     2 b\n## 3     3 c\ny[1:2]\n##   A B\n## 1 1 a\n## 2 2 b\n## 3 3 c\n```\n\
    \nYou cannot do this using `[]`.\n\nYou can extract a subset of rows and columns\
    \ if you use two indices. For example, you can get the first two rows in the first\
    \ two columns using `[1:2,1:2]`:\n\n```\nx[1:2,1:2]\n## # A tibble: 2 × 2\n##\
    \       A B\n##    \n## 1     1 a\n## 2     2 b\ny[1:2,1:2]\n##   A B\n## 1 1\
    \ a\n## 2 2 b\n```\n\nWith a single index , you always extract a subset of columns.\
    \ If you want to extract a subset of rows for all columns, you can use\n\n```\n\
    x[1:2,]\n## # A tibble: 2 × 4\n##       A B     C         D\n##      \n## 1  \
    \   1 a     a        1.2\n## 2     2 b     b        2.1\ny[1:2,]\n##   A B C \
    \  D\n## 1 1 a a  1.2\n## 2 2 b b  2.1\n```\n\nIf you extract a subset of rows\
    \ from a single column, tibbles and data frames no longer have the same behavior.\
    \ A tibble will give you a tibble in return, while a data frame will give you\
    \ a vector:\n\n```\nx[1:2,2]\n## # A tibble: 2 × 1\n##   B\n##   \n## 1 a\n##\
    \ 2 b\ny[1:2,2]\n## [1] \"a\" \"b\"\n```\n\nTibbles are more consistent than `data.frame`\
    \ objects. When you extract part of a tibble, you always get a tibble in return.\
    \ Data frames sometimes give you a data frame and sometimes (in this particular\
    \ case) a vector. In any function that expects a data frame and only use subscripts\
    \ that return a data frame, you can also use a tibble. Tibbles return tibbles,\
    \ and since a tibble is also a data frame, this will not cause any problems. If\
    \ a function expects to extract a vector, you cannot use a tibble. This is where\
    \ you will need to use `as.data.frame()` to get a `data.frame()` with data frame\
    \ behavior.\n\n# Tidy Select\n\nSo-called “tidy select” is not a package you would\
    \ use on its own (although you can import it and it is called `tidyselect`), rather\
    \ it is a small language for selecting columns in a data frame or tibble. Many\
    \ packages in the following chapters support this language, so rather than describing\
    \ it in each chapter, I decided to put a description in its own chapter, and this\
    \ is as good a place as any. We cannot, however, use the language without functionality\
    \ from packages that are described in later chapters, so I will use the function\
    \ `select` from the `dplyr` package; see Chapter [8](#476587_2_En_8_Chapter.xhtml).\n\
    \nThe `select` function helps you select columns from a tibble or a data frame.\
    \ Its first argument is a table, so we can use it with a pipe operator, and then\
    \ the remaining can be the columns we want to extract.\n\n```\ntblselect(sample,\
    \ min_size, min_weight)\n## # A tibble: 2 × 3\n## sample min_size min_weight\n\
    ##            \n## 1 foo         13      45.2\n## 2 bar         12      83.1\n\
    ```\n\nThis simple way of selecting columns is useful in itself, of course, but\
    \ doesn’t add much on top of just indexing into tables. The power of tidy select\
    \ is the small language that we can use instead of explicitly listing columns.\n\
    \n## Ranges\n\nIf you want a range of columns, say from `min_size` to `max_weight`,\
    \ you can use `:` to select the columns:\n\n```\ntbl|>select(min_size:max_weight)\n\
    ## # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n##         \
    \           \n## 1     13       16       45.2       67.2\n## 2     12       17\
    \       83.1      102.\n```\n\nThis only works for contiguous columns, but you\
    \ can select multiple ranges if you want:\n\n```\ntbl|>select(sample:min_size,\
    \ min_weight:max_weight)\n## # A tibble: 2 × 4\n##   sample min_size min_weight\
    \ max_weight\n##                    \n## 1  foo         13       45.2       67.2\n\
    ## 2  bar         12       83.1      102.\n```\n\n## Complements\n\nSometimes,\
    \ it is easier to specify which columns you do *not* want, and then you can use\
    \ the complement operator `!`. This works both for the complement of a single\
    \ column, so “everything except this column”:\n\n```\ntbl|>select(!sample)\n##\
    \ # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n##          \
    \         \n## 1     13       16       45.2      67.2\n## 2     12       17  \
    \     83.1     102.\n```\n\nbut it also works if you select columns some other\
    \ way, for example, through ranges. If `sample:min_size` selects the columns `sample`\
    \ and `min_size`, then `!sample:min_size` is everything except those columns:\n\
    \n```\ntbl|>select(!(sample:min_size))\n## # A tibble: 2 × 3\n##  max_size min_weight\
    \ max_weight\n##                 \n## 1      16      45.2        67.2\n## 2  \
    \    17      83.1       102.\n```\n\n## Unions and Intersections\n\nIt gets a\
    \ bit strange if you include both the complements of columns and the columns themselves,\
    \ but you will get all the columns you ask for, so with\n\n```\ntbl|>select(sample,!(sample:min_size))\n\
    ## # A tibble: 2 × 4\n## sample max_size min_weight max_weight\n##           \
    \       \n## 1 foo        16      45.2        67.2\n## 2 bar        17      83.1\
    \       102.\n```\n\ncolumn `sample`, and then we get all the columns that are\
    \ not in the range `sample:min_size`.\n\nYou can explicitly ask for unions or\
    \ intersections of selections using `&` (intersection) and `|` (union).\n\n```\n\
    tbl|>select(\nsample:min_weight   # sample, min_size, max_size, and min_weight\n\
    &                   # intersect with\nmax_size:max_weight # max_size, min_weight,\
    \ max_weight\n)\n## # A tibble: 2 × 2\n##   max_size min_weight\n##          \
    \ \n## 1       16      45.2\n## 2       17      83.1\ntbl|>select(\nsample:min_weight\
    \    # sample, min_size, max_size, and min_weight\n|                    # union\
    \ with\nmax_size:max_weight  # max_size, min_weight, max_weight\n)\n## # A tibble:\
    \ 2 × 5\n##   sample min_size max_size min_weight max_weight\n##             \
    \           \n## 1 foo          13      16        45.2       67.2\n## 2 bar  \
    \        12      17        83.1      102.\n```"
  raw: "## Indexing Tibbles\n\nYou can index a tibble in much the same way as you\
    \ can index a data frame. You can extract a column using a single-bracket index\
    \ (`[]`), either by name or by index:\n\n```\nx\n## 1     1\n## 2     2\n## 3\
    \     3\ny[\"A\"]\n##   A\n## 1 1\n## 2 2\n## 3 3\nx[1]\n## # A tibble: 3 × 1\n\
    ##       A\n##   \n## 1     1\n## 2     2\n## 3     3\ny[1]\n##   A\n## 1 1\n\
    ## 2 2\n## 3 3\n```\n\nThe result is a `tibble` or `data.frame`, respectively,\
    \ containing a single column.\n\nIf you use double brackets (`[[]]`), you will\
    \ get the vector contained in a column rather than a tibble/data frame :\n\n```\n\
    x[[\"A\"]]\n## [1] 1 2 3\ny[[\"A\"]]\n## [1] 1 2 3\n```\n\nYou will also get the\
    \ underlying vector of a column if you use `$` indexing:\n\n```\nx$A\n## [1] 1\
    \ 2 3\ny$A\n## [1] 1 2 3\n```\n\nUsing `[]`, you can extract more than one column.\n\
    \n```\nx[c(\"A\",\"C\")]\n## # A tibble: 3 × 2\n##       A C\n##    \n## 1   \
    \  1 a\n## 2     2 b\n## 3     3 c\ny[c(\"A\",\"C\")]\n##   A C\n## 1 1 a\n##\
    \ 2 2 b\n## 3 3 c\nx[1:2]\n## # A tibble: 3 × 2\n##       A B\n##    \n## 1  \
    \   1 a\n## 2     2 b\n## 3     3 c\ny[1:2]\n##   A B\n## 1 1 a\n## 2 2 b\n##\
    \ 3 3 c\n```\n\nYou cannot do this using [`[]`].\n\nYou can extract a subset of\
    \ rows and columns if you use two indices. For example, you can get the first\
    \ two rows in the first two columns using [`1:2,1:2`]:\n\n```\nx[1:2,1:2]\n##\
    \ # A tibble: 2 × 2\n##       A B\n##    \n## 1     1 a\n## 2     2 b\ny[1:2,1:2]\n\
    ##   A B\n## 1 1 a\n## 2 2 b\n```\n\nWith a single index , you always extract\
    \ a subset of columns. If you want to extract a subset of rows for all columns,\
    \ you can use\n\n```\nx[1:2,]\n## # A tibble: 2 × 4\n##       A B     C      \
    \   D\n##      \n## 1     1 a     a        1.2\n## 2     2 b     b        2.1\n\
    y[1:2,]\n##   A B C   D\n## 1 1 a a  1.2\n## 2 2 b b  2.1\n```\n\nIf you extract\
    \ a subset of rows from a single column, tibbles and data frames no longer have\
    \ the same behavior. A tibble will give you a tibble in return, while a data frame\
    \ will give you a vector:\n\n```\nx[1:2,2]\n## # A tibble: 2 × 1\n##   B\n## \
    \  \n## 1 a\n## 2 b\ny[1:2,2]\n## [1] \"a\" \"b\"\n```\n\nTibbles are more consistent\
    \ than `data.frame` objects. When you extract part of a tibble, you always get\
    \ a tibble in return. Data frames sometimes give you a data frame and sometimes\
    \ (in this particular case) a vector. In any function that expects a data frame\
    \ and only use subscripts that return a data frame, you can also use a tibble.\
    \ Tibbles return tibbles, and since a tibble is also a data frame, this will not\
    \ cause any problems. If a function expects to extract a vector, you cannot use\
    \ a tibble. This is where you will need to use `as.data.frame()` to get a `data.frame()`\
    \ with data frame behavior.\n\n# 4. Tidy Select\n\nSo-called “tidy select ” is\
    \ not a package you would use on its own (although you can import it and it is\
    \ called `tidyselect`), rather it is a small language for selecting columns in\
    \ a data frame or tibble. Many packages in the following chapters support this\
    \ language, so rather than describing it in each chapter, I decided to put a description\
    \ in its own chapter, and this is as good a place as any. We cannot, however,\
    \ use the language without functionality from packages that are described in later\
    \ chapters, so I will use the function `select` from the `dplyr` package; see\
    \ Chapter [8](#476587_2_En_8_Chapter.xhtml).\n\nThe select function helps you\
    \ select columns from a tibble or a data frame . Its first argument is a table,\
    \ so we can use it with a pipe operator, and then the remaining can be the columns\
    \ we want to extract.\n\n```\ntblselect(sample, min_size, min_weight)\n## # A\
    \ tibble: 2 × 3\n## sample min_size min_weight\n##            \n## 1 foo     \
    \    13      45.2\n## 2 bar         12      83.1\n```\n\nThis simple way of selecting\
    \ columns is useful in itself, of course, but doesn’t add much on top of just\
    \ indexing into tables. The power of tidy select is the small language that we\
    \ can use instead of explicitly listing columns.\n\n## Ranges\n\nIf you want a\
    \ range of columns, say from `min_size` to `max_weight`, you can use : to select\
    \ the columns:\n\n```\ntbl|>select(min_size:max_weight)\n## # A tibble: 2 × 4\n\
    ## min_size max_size min_weight max_weight\n##                    \n## 1     13\
    \       16       45.2       67.2\n## 2     12       17       83.1      102.\n\
    ```\n\nThis only works for contiguous columns, but you can select multiple ranges\
    \ if you want:\n\n```\ntbl|>select(sample:min_size, min_weight:max_weight)\n##\
    \ # A tibble: 2 × 4\n##   sample min_size min_weight max_weight\n##          \
    \          \n## 1  foo         13       45.2       67.2\n## 2  bar         12\
    \       83.1      102.\n```\n\n## Complements\n\nSometimes, it is easier to specify\
    \ which columns you do *not* want, and then you can use the complement operator\
    \ `!` . This works both for the complement of a single column, so “everything\
    \ except this column”:\n\n```\ntbl|>select(!sample)\n## # A tibble: 2 × 4\n##\
    \ min_size max_size min_weight max_weight\n##                   \n## 1     13\
    \       16       45.2      67.2\n## 2     12       17       83.1     102.\n```\n\
    \nbut it also works if you select columns some other way, for example, through\
    \ ranges. If `sample:min_size` selects the columns `sample` and `min_size`, then\
    \ `!sample:min_size` is everything except those columns:\n\n```\ntbl|>select(!(sample:min_size))\n\
    ## # A tibble: 2 × 3\n##  max_size min_weight max_weight\n##                 \n\
    ## 1      16      45.2        67.2\n## 2      17      83.1       102.\n```\n\n\
    ## Unions and Intersections\n\nIt gets a bit strange if you include both the complements\
    \ of columns and the columns themselves, but you will get all the columns you\
    \ ask for, so with\n\n```\ntbl|>select(sample,!(sample:min_size))\n## # A tibble:\
    \ 2 × 4\n## sample max_size min_weight max_weight\n##                  \n## 1\
    \ foo        16      45.2        67.2\n## 2 bar        17      83.1       102.\n\
    ```\n\ncolumn `sample`, and then we get all the columns that are not in the range\
    \ “sample:min_size”.\n\nYou can explicitly ask for unions or intersections of\
    \ selections using & (intersection) and | (union).\n\n```\ntbl|>select(\nsample:min_weight\
    \   # sample, min_size, max_size, and min_weight\n&                   # intersect\
    \ with\nmax_size:max_weight # max_size, min_weight, max_weight\n)\n## # A tibble:\
    \ 2 × 2\n##   max_size min_weight\n##           \n## 1       16      45.2\n##\
    \ 2       17      83.1\ntbl|>select(\nsample:min_weight    # sample, min_size,\
    \ max_size, and min_weight\n|                    # union with\nmax_size:max_weight\
    \  # max_size, min_weight, max_weight\n)\n## # A tibble: 2 × 5\n##   sample min_size\
    \ max_size min_weight max_weight\n##                        \n## 1 foo       \
    \   13      16        45.2       67.2\n## 2 bar          12      17        83.1\
    \      102.\n```"
  trans: "\n# 索引 tibble\n\n你可以像索引数据框（data frame）一样索引 tibble。使用单括号索引（`[]`）可以通过列名或索引提取一列：\n\
    \n```\nx\n## 1     1\n## 2     2\n## 3     3\ny[\"A\"]\n##   A\n## 1 1\n## 2 2\n\
    ## 3 3\nx[1]\n## # A tibble: 3 × 1\n##       A\n##   \n## 1     1\n## 2     2\n\
    ## 3     3\ny[1]\n##   A\n## 1 1\n## 2 2\n## 3 3\n```\n\n结果分别是一个包含单个列的 `tibble`\
    \ 或 `data.frame`。\n\n如果使用双括号（`[[]]`），你将获得列中包含的向量，而不是 tibble 或 data frame：\n\n\
    ```\nx[[\"A\"]]\n## [1] 1 2 3\ny[[\"A\"]]\n## [1] 1 2 3\n```\n\n如果使用 `$` 索引，你也会获得列底层的向量：\n\
    \n```\nx$A\n## [1] 1 2 3\ny$A\n## [1] 1 2 3\n```\n\n使用 `[]`，你可以提取多列。\n\n```\n\
    x[c(\"A\",\"C\")]\n## # A tibble: 3 × 2\n##       A C\n##    \n## 1     1 a\n\
    ## 2     2 b\n## 3     3 c\ny[c(\"A\",\"C\")]\n##   A C\n## 1 1 a\n## 2 2 b\n\
    ## 3 3 c\nx[1:2]\n## # A tibble: 3 × 2\n##       A B\n##    \n## 1     1 a\n##\
    \ 2     2 b\n## 3     3 c\ny[1:2]\n##   A B\n## 1 1 a\n## 2 2 b\n## 3 3 c\n```\n\
    \n你不能使用 `[]` 来做到这一点。\n\n如果使用两个索引，你可以提取行和列的子集。例如，你可以使用 `[1:2,1:2]` 获取前两列中的前两行：\n\
    \n```\nx[1:2,1:2]\n## # A tibble: 2 × 2\n##       A B\n##    \n## 1     1 a\n\
    ## 2     2 b\ny[1:2,1:2]\n##   A B\n## 1 1 a\n## 2 2 b\n```\n\n使用单个索引时，你总是提取列的子集。如果你想提取所有列中的行子集，可以使用：\n\
    \n```\nx[1:2,]\n## # A tibble: 2 × 4\n##       A B     C         D\n##      \n\
    ## 1     1 a     a        1.2\n## 2     2 b     b        2.1\ny[1:2,]\n##   A\
    \ B C   D\n## 1 1 a a  1.2\n## 2 2 b b  2.1\n```\n\n如果你从单个列中提取行子集，tibble 和 data\
    \ frame 的行为不再相同。tibble 会返回一个 tibble，而 data frame 会返回一个向量：\n\n```\nx[1:2,2]\n##\
    \ # A tibble: 2 × 1\n##   B\n##   \n## 1 a\n## 2 b\ny[1:2,2]\n## [1] \"a\" \"\
    b\"\n```\n\nTibble 比 `data.frame` 对象更一致。当你提取 tibble 的一部分时，你总是得到一个 tibble。而 data\
    \ frame 有时返回 data frame，有时（在这个特定情况下）返回向量。在任何期望 data frame 且只使用返回 data frame 的下标函数中，你也可以使用\
    \ tibble。Tibble 返回 tibble，并且由于 tibble 也是一种 data frame，这不会引起任何问题。如果某个函数期望提取向量，则你不能使用\
    \ tibble。这时你需要使用 `as.data.frame()` 来获得具有 data frame 行为的 `data.frame()`。\n\n# Tidy\
    \ Select\n\n所谓的“tidy select”并不是一个你单独使用的包（尽管你可以导入它，它叫做 `tidyselect`），而是一种用于在 data\
    \ frame 或 tibble 中选择列的小型语言。后续章节中的许多包都支持这种语言，因此与其在每个章节中描述它，我决定将其放在自己的章节中，这里就是一个合适的位置。然而，如果没有后续章节中描述的包的功能，我们无法使用这种语言，因此我将使用\
    \ `dplyr` 包中的 `select` 函数；请参阅第 8 章。\n\n`select` 函数帮助您从 tibble 或 data frame 中选择列。它的第一个参数是一个表格，因此我们可以将其与管道操作符一起使用，然后剩下的参数可以是我们想要提取的列。\n\
    \n```\ntblselect(sample, min_size, min_weight)\n## # A tibble: 2 × 3\n## sample\
    \ min_size min_weight\n##            \n## 1 foo         13      45.2\n## 2 bar\
    \         12      83.1\n```\n\n这种简单的选择列方式本身就很有用，但相对于直接索引表格并没有增加太多功能。tidy select\
    \ 的强大之处在于我们可以使用一种小型语言，而不是显式列出列名。\n\n## 范围\n\n如果你想要一个列的范围，例如从 `min_size` 到 `max_weight`，你可以使用\
    \ `:` 来选择这些列：\n\n```\ntbl|>select(min_size:max_weight)\n## # A tibble: 2 × 4\n\
    ## min_size max_size min_weight max_weight\n##                    \n## 1     13\
    \       16       45.2       67.2\n## 2     12       17       83.1      102.\n\
    ```\n\n这只适用于连续的列，但如果你愿意，你也可以选择多个范围：\n\n```\ntbl|>select(sample:min_size, min_weight:max_weight)\n\
    ## # A tibble: 2 × 4\n##   sample min_size min_weight max_weight\n##         \
    \           \n## 1  foo         13       45.2       67.2\n## 2  bar         12\
    \       83.1      102.\n```\n\n## 补集\n\n有时，指定你*不*想要的列更容易，然后你可以使用补集运算符 `!`。这既适用于单个列的补集，即“除了这一列之外的所有内容”：\n\
    \n```\ntbl|>select(!sample)\n## # A tibble: 2 × 4\n## min_size max_size min_weight\
    \ max_weight\n##                   \n## 1     13       16       45.2      67.2\n\
    ## 2     12       17       83.1     102.\n```\n\n但也适用于通过其他方式选择列，例如通过范围。如果 `sample:min_size`\
    \ 选择了 `sample` 和 `min_size` 列，那么 `!sample:min_size` 就是除这些列之外的所有内容：\n\n```\ntbl|>select(!(sample:min_size))\n\
    ## # A tibble: 2 × 3\n##  max_size min_weight max_weight\n##                 \n\
    ## 1      16      45.2        67.2\n## 2      17      83.1       102.\n```\n\n\
    ## 并集与交集\n\n如果你同时包含列的补集和列本身，情况会有点奇怪，但你会得到所有你要求的列，所以使用\n\n```\ntbl|>select(sample,!(sample:min_size))\n\
    ## # A tibble: 2 × 4\n## sample max_size min_weight max_weight\n##           \
    \       \n## 1 foo        16      45.2        67.2\n## 2 bar        17      83.1\
    \       102.\n```\n\n列 `sample`，然后我们得到所有不在范围 `sample:min_size` 内的列。\n\n你可以使用 `&`（交集）和\
    \ `|`（并集）显式地请求选择的并集或交集。\n\n```\ntbl|>select(\nsample:min_weight   # sample, min_size,\
    \ max_size, and min_weight\n&                   # 与以下范围取交集\nmax_size:max_weight\
    \ # max_size, min_weight, max_weight\n)\n## # A tibble: 2 × 2\n##   max_size min_weight\n\
    ##           \n## 1       16      45.2\n## 2       17      83.1\ntbl|>select(\n\
    sample:min_weight    # sample, min_size, max_size, and min_weight\n|         \
    \           # 与以下范围取并集\nmax_size:max_weight  # max_size, min_weight, max_weight\n\
    )\n## # A tibble: 2 × 5\n##   sample min_size max_size min_weight max_weight\n\
    ##                        \n## 1 foo          13      16        45.2       67.2\n\
    ## 2 bar          12      17        83.1      102.\n```\n"
- fmt: "# Select Columns Based on Name\n\nThere are several functions that will let\
    \ you select columns based on their names. The `starts_with()` function will pick\
    \ columns that start with a specific string:\n\n```\ntbl|>select(starts_with(\"\
    min\"))\n## # A tibble: 2 × 2\n##   min_size min_weight\n##             \n## 1\
    \       13        45.2\n## 2       12        83.1\n```\n\nSimilarly, the `ends_with()`\
    \ function will let you pick columns with names that end with a specific string:\n\
    \n```\ntbl|>select(ends_with(\"weight\"))\n## # A tibble: 2 × 2\n##   min_weight\
    \ max_weight\n##              \n## 1       45.2       67.2\n## 2       83.1  \
    \    102.\n```\n\nIf you want to pick all columns whose names contain a string,\
    \ you use the function `contains()`:\n\n```\ntbl|>select(contains(\"_\"))\n##\
    \ # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n##          \
    \          \n## 1     13       16       45.2       67.2\n## 2     12       17\
    \       83.1      102.\n```\n\nFor more complex matching, the `matches()` function\
    \ lets you pick columns based on regular expressions. Here, I'll just pick the\
    \ columns with names that contain an underscore again, because there really isn't\
    \ anything complicated to select for in this example table:\n\n```\ntbl|>select(matches(\"\
    .*_.*\"))\n## # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n\
    ##                    \n## 1     13       16       45.2       67.2\n## 2     12\
    \       17       83.1      102.\n```\n\n## Everything\n\nIt might not seem like\
    \ much of a feature, since selecting all columns just gives you the original table\
    \ back, but there is a function, `everything()`, that does just that.\n\n```\n\
    tbl|>select(everything())\n## # A tibble: 2 × 5\n##   sample min_size max_size\
    \ min_weight max_weight\n##                        \n## 1 foo          13    \
    \   16      45.2        67.2\n## 2 bar          12       17      83.1       102.\n\
    ```\n\nYou wouldn't use that with `select()`, of course, because it doesn't do\
    \ anything, but there are other functions that require that you select columns\
    \ for some transformation of the data, and there `everything()` can be used to\
    \ pick all the columns in a data frame.\n\n## Indexing from the Last Column\n\n\
    If you just want to select the last column, you can use the function `last_col()`:\n\
    \n```\ntbl|>select(last_col())\n## # A tibble: 2 × 1\n##   max_weight\n##    \
    \    \n## 1       67.2\n## 2      102.\n```\n\nbut you can also use the function\
    \ to select by indexing from the right. If you give it an integer argument, `i`,\
    \ it will select the column that is `i` from the right:\n\n```\ntbl|>select(last_col(0))\n\
    ## # A tibble: 2 × 1\n##   max_weight\n##       \n## 1      67.2\n## 2     102.\n\
    tbl|>select(last_col(1))\n## # A tibble: 2 × 1\n##   min_weight\n##        \n\
    ## 1       45.2\n## 2       83.1\ntbl|>select(last_col(2))\n## # A tibble: 2 ×\
    \ 1\n##    max_size\n##       \n## 1        16\n## 2        17\ntbl|>select(last_col(3))\n\
    ## # A tibble: 2 × 1\n##   min_size\n##      \n## 1       13\n## 2       12\n\
    ```\n\nand you can, of course, use this in ranges:\n\n```\ntbl|>select(last_col(3):last_col())\n\
    ## # A tibble: 2 × 4\n##   min_size max_size min_weight max_weight\n##       \
    \              \n## 1       13       16       45.2      67.2\n## 2       12  \
    \     17       83.1     102.\n```\n\n## Selecting from Strings\n\nIf you have\
    \ the column names you want to select in a vector of strings\n\n```\nvars<-c(\"\
    min_size\",\"min_weight\")\n```\n\nyou can use the `all_of()` or `any_of()` functions\
    \ to pick them:\n\n```\ntbl|>select(all_of(vars))\n## # A tibble: 2 × 2\n##  \
    \ min_size min_weight\n##         \n## 1       13    45.2\n## 2       12    83.1\n\
    tbl|>select(any_of(vars))\n## # A tibble: 2 × 2\n##   min_size min_weight\n##\
    \           \n## 1       13      45.2\n## 2       12      83.1\n```\n\nThe difference\
    \ between the two functions is that `all_of()` considers it an error if `vars`\
    \ contain a name that isn't found in the table, while `any_of()` does not.\n\n\
    ```\nvarsselect(all_of(vars))\n## Error in 'select()':\n## ! Can't subset columns\
    \ past the end.\n## x Column 'foo' doesn't exist.\ntbl|>select(any_of(vars))\n\
    ## # A tibble: 2 × 2\n##   min_size min_weight\n##         \n## 1       13   \
    \ 45.2\n## 2       12    83.1\n```\n\n## Selecting Columns Based on Their Content\n\
    \nPerhaps the most powerful selection function is `where`. You give it a function\
    \ as an argument, that function is called with each column, and the columns for\
    \ which the function returns `TRUE` are selected.\n\nSo, for example, if you only\
    \ want columns that are numeric, you can use `where` combined with `is.numeric`:\n\
    \n```\ntbl|>select(where(is.numeric))\n## # A tibble: 2 × 4\n## min_size max_size\
    \ min_weight max_weight\n##                 \n## 1     13       16     45.2  \
    \    67.2\n## 2     12       17     83.1     102.\n```\n\nOr if you want columns\
    \ that are numeric and the largest value is greater than 100, you can use\n\n\
    ```\ntbl|>select(where(\\(x)is.numeric(x)&&max(x)>100.0))\n## # A tibble: 2 ×\
    \ 1\n##   max_weight\n##       \n## 1      67.2\n## 2     102.\n```\n\n(The syntax\
    \ `\\(args) body` was introduced in R 4 as a short form of `function(args)` body\
    \ but means the same thing).\n\n## It Is a Growing Language, so Check for Changes\n\
    \nThe language used by functions that support tidy select is evolving and growing,\
    \ so there is likely more you can do by the time you read this. Check the documentation\
    \ of the `select` function\n\n```\n?select\n```\n\nto get the most recent description.\n\
    \n# 5. Reformatting Tables: tidyr\n\nEven if we only consider tabular data, there\
    \ are still many different ways to format this data. The packages in the Tidyverse\
    \ expect that data is represented as so-called \"tidy data\" (which is where the\
    \ name Tidyverse comes from). The `tidyr` package helps you with formatting your\
    \ data into tidy data.\n\nYou can load `tidyr` as part of the tidyverse:\n\n```\n\
    library(tidyverse)\n```\n\nor on its own:\n\n```\nlibrary(tidyr)\n```\n\n## Tidy\
    \ Data\n\nThe fundamental properties that characterize tidy data are that each\
    \ variable is in a column, and each observation is a row. The terms like variables\
    \ and observations should be familiar from statistics, but what the tidy data\
    \ properties say is that you should not put the values of a variable in different\
    \ columns and you should not put more than one observation in the same row.\n\n\
    Consider data such as this:\n\n```\nmean_income<-tribble(\n~country,~  '2001',~\
    \ '2002',~ '2003',~ '2004',~ '2005',\n\"Numenor\",  123456,  132654,  321646,\
    \  324156,  325416,\n\"Westeros\", 314256,  432165,  546123,  465321,  561423,\n\
    \"Narnia\",   432156,  342165,  564123,  543216,  465321,\n\"Gondor\",   531426,\
    \  321465,  235461,  463521,  561423,\n\"Laputa\",   14235,   34125,   45123,\
    \   51234,    54321\n)\n```\n\nWe could imagine that this table contains the mean\
    \ income in five (fictional) countries in the first five years of the 21st century.\
    \ Let us say that you are interested in knowing if there is a pattern in income\
    \ over time when taking the different countries into account. To do this, you\
    \ might consider a formula such as `income ~ country + year`, but the data is\
    \ not formatted in a way that makes this easy. If year is a variable that you\
    \ can use in the model, it is a problem that different observations, the actual\
    \ years, are split into different columns. Similarly, if the mean income per year\
    \ is a variable, it is a problem that all the observations for a country are in\
    \ the same row. You cannot use `income ~ country + year` because the data is not\
    \ tidy."
  raw: "## Select Columns Based on Name\n\nThere are several functions that will let\
    \ you select columns based on their names. The `starts_with()` function will pick\
    \ columns that start with a specific string :\n\n```\ntbl|>select(starts_with(\"\
    min\"))\n## # A tibble: 2 × 2\n##   min_size min_weight\n##             \n## 1\
    \       13        45.2\n## 2       12        83.1\n```\n\nSimilarly, the `ends_with()`\
    \ function will let you pick columns with names that end with a specific string:\n\
    \n```\ntbl|>select(ends_with(\"weight\"))\n## # A tibble: 2 × 2\n##   min_weight\
    \ max_weight\n##              \n## 1       45.2       67.2\n## 2       83.1  \
    \    102.\n```\n\nIf you want to pick all columns whose names contain a string,\
    \ you use the function `contains()` :\n\n```\ntbl|>select(contains(\"_\"))\n##\
    \ # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n##          \
    \          \n## 1     13       16       45.2       67.2\n## 2     12       17\
    \       83.1      102.\n```\n\nFor more complex matching, the `matches()` function\
    \ lets you pick columns based on regular expressions. Here, I’ll just pick the\
    \ columns with names that contain an underscore gain, because there really isn’t\
    \ anything complicated to select for in this example table:\n\n```\ntbl|>select(matches(\"\
    .*_.*\"))\n## # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n\
    ##                    \n## 1     13       16       45.2       67.2\n## 2     12\
    \       17       83.1      102.\n```\n\n## Everything\n\nIt might not seem like\
    \ much of a feature, since selecting all columns just gives you the original table\
    \ back, but there is a function, `everything()` , that does just that.\n\n```\n\
    tbl|>select(everything())\n## # A tibble: 2 × 5\n##   sample min_size max_size\
    \ min_weight max_weight\n##                        \n## 1 foo          13    \
    \   16      45.2        67.2\n## 2 bar          12       17      83.1       102.\n\
    ```\n\nYou wouldn’t use that with `select()`, of course, because it doesn’t do\
    \ anything, but there are other functions that requires that you select columns\
    \ for some transformation of the data, and there `everything()` can be used to\
    \ pick all the columns in a data frame.\n\n## Indexing from the Last Column\n\n\
    If you just want to select the last column, you can use the function `last_col()`:\n\
    \n```\ntbl|>select(last_col())\n## # A tibble: 2 × 1\n##   max_weight\n##    \
    \    \n## 1       67.2\n## 2      102.\n```\n\nbut you can also use the function\
    \ to select by indexing from the right. If you give it an integer argument, i,\
    \ it will select the column that is i from the right:\n\n```\ntbl|>select(last_col(0))\n\
    ## # A tibble: 2 × 1\n##   max_weight\n##       \n## 1      67.2\n## 2     102.\n\
    tbl|>select(last_col(1))\n## # A tibble: 2 × 1\n##   min_weight\n##        \n\
    ## 1       45.2\n## 2       83.1\ntbl|>select(last_col(2))\n## # A tibble: 2 ×\
    \ 1\n##    max_size\n##       \n## 1        16\n## 2        17\ntbl|>select(last_col(3))\n\
    ## # A tibble: 2 × 1\n##   min_size\n##      \n## 1       13\n## 2       12\n\
    ```\n\nand you can, of course, use this in ranges:\n\n```\ntbl|>select(last_col(3):last_col())\n\
    ## # A tibble: 2 × 4\n##   min_size max_size min_weight max_weight\n##       \
    \              \n## 1       13       16       45.2      67.2\n## 2       12  \
    \     17       83.1     102.\n```\n\n## Selecting from Strings\n\nIf you have\
    \ the column names you want to select in a vector of strings\n\n```\nvars<-c(\"\
    min_size\",\"min_weight\")\n```\n\nyou can use the `all_of()` or `any_of()` functions\
    \ to pick them:\n\n```\ntbl|>select(all_of(vars))\n## # A tibble: 2 × 2\n##  \
    \ min_size min_weight\n##         \n## 1       13    45.2\n## 2       12    83.1\n\
    tbl|>select(any_of(vars))\n## # A tibble: 2 × 2\n##   min_size min_weight\n##\
    \           \n## 1       13      45.2\n## 2       12      83.1\n```\n\nThe difference\
    \ between the two functions is that `all_of()` considers it an error if `vars`\
    \ contain a name that isn’t found in the table, while `any_of()` does not.\n\n\
    ```\nvarsselect(all_of(vars))\n## Error in 'select()':\n## ! Can't subset columns\
    \ past the end.\n## x Column 'foo' doesn't exist.\ntbl|>select(any_of(vars))\n\
    ## # A tibble: 2 × 2\n##   min_size min_weight\n##         \n## 1       13   \
    \ 45.2\n## 2       12    83.1\n```\n\n## Selecting Columns Based on Their Content\n\
    \nPerhaps the most powerful selection function is where. You give it a function\
    \ as an argument, that function is called with each column, and the columns for\
    \ which the function returns `TRUE` are selected.\n\nSo, for example, if you only\
    \ want columns that are numeric, you can use `where` combined with `is`.`numeric`:\n\
    \n```\ntbl|>select(where(is.numeric))\n## # A tibble: 2 × 4\n## min_size max_size\
    \ min_weight max_weight\n##                 \n## 1     13       16     45.2  \
    \    67.2\n## 2     12       17     83.1     102.\n```\n\nOr if you want columns\
    \ that are numeric and the largest value is greater than 100, you can use\n\n\
    ```\ntbl|>select(where(\\(x)is.numeric(x)&&max(x)>100.0))\n## # A tibble: 2 ×\
    \ 1\n##   max_weight\n##       \n## 1      67.2\n## 2     102.\n```\n\n(The syntax\
    \ `\\(args) body` was introduced in R 4 as a short form of `function(args)` body\
