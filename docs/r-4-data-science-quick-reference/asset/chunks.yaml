    \  0.902  1.58      451\\. 4.63e-26\n## # . . . with 7 more variables: df ,\n\
    ## #   logLik ,  AIC , BIC ,\n## #   deviance , df.residual , nobs \n```\n\n如果我们对\
    \ `x` 的**经验分布**感兴趣，那么我们可以提取自助数据中的分布，然后继续分析。\n\n```r\nget_x <- function(models)\
    \ {\n  models |>\n    filter(term == \"x\") |>\n    select(estimate) %>% as.double()\n\
    }\nfitted_models$fits |> map_dbl(get_x)\n## [1] 15.54085 13.25745 15.50705\n```\n\
    \n如果你想比较**模型**（而不是数据样本），`modelr` 也提供了支持。你可以创建一个想要拟合的公式列表。`formulae()` 函数可以帮你创建这样一个列表。\n\
    \n```r\nmodels <- formulae(~y, linear = ~x, quadratic = ~I(xˆ2) + x)\n```\n\n\
    第一个参数是响应变量（公式左侧），其余参数是（命名的）参数，用于描述解释变量，即模型公式的右侧部分。\n\n如果你使用数据、要使用的拟合函数（此处是 `lm()`）以及你想要拟合的公式来调用\
    \ `fit_with()`，那么你就能得到所需的结果——每个公式对应一个拟合模型。\n\n```r\nfits <- dat |> fit_with(lm,\
    \ models)\nfits |> \n  map(glance) |> \n  bind_rows()\n## # A tibble: 2 × 12\n\
    ##   r.squared adj.r.squared sigma statistic   p.value\n##                   \
    \        \n## 1     0.873         0.871 1.83       330\\.  3.67e-23\n## 2    \
    \ 0.983         0.983 0.674      1379\\. 1.86e-42\n## # . . . with 7 more variables:\
    \ df ,\n## #   logLik ,  AIC , BIC ,\n## #   deviance , df.residual , nobs \n\
    ```\n\n你可以在 `modelr` 中找到许多模型质量度量指标，例如**均方根误差**：\n\n```r\nfits |> map_dbl(rmse,\
    \ data = dat)\n##    linear quadratic\n## 1.7973686 0.6533399\n```\n\n**平均绝对误差**：\n\
    \n```r\nfits |> map_dbl(mae, data = dat)\n##    linear quadratic\n## 1.5265158\
    \ 0.5116268\n```\n\n以及更多其他指标。\n\n由于过拟合始终是一个问题，你可能希望使用至少尝试考虑模型复杂度的质量度量指标。`broom`\
    \ 包的 `glance()` 函数中就提供了一些这样的指标。\n\n```r\nfits |> map_dbl(~ glance(.x)$AIC)\n##\
    \   linear quadratic\n## 206.5262  107.3281\n```\n\n然而，如果可能的话，你应该使用**测试数据**来衡量模型的泛化能力。为此，你首先需要将模型拟合到训练数据上，然后在测试数据上进行预测。在下面的例子中，我在剔除一个样本的数据上拟合了\
    \ `lm(y ~ x)` 模型，然后在测试数据上进行了应用。接着，我使用 RMSE 来衡量泛化质量。\n\n```r\nsamples <- dat |>\
    \ crossv_loo()\ntraining_fits <- samples$train |> map(~lm(y ~ x, data = .))\n\
    training_fits |> map2_dbl(samples$test, rmse) |> head(10)\n##         1      \
    \   2         3         4         5\n## 2.8223916 1.3057640 1.3454227 0.7254241\
    \ 2.5129973\n##         6         7         8         9        10\n## 1.1552629\
    \ 1.2763827 0.9248123 0.8273398 0.2941659\n```\n\n脚注 [1]\n\n# 13. 绘图：`ggplot2`\n\
    \n`ggplot2` 包包含大量用于创建各种图形的函数。要全面覆盖需要一整本书——事实上已有好几本这样的书——因此我无法在此详述。在本章中，我只会尝试让你了解该包的工作原理。\n\
    \n当你加载 `tidyverse` 时，`ggplot2` 包也会被加载，但你也可以单独使用它：\n\n```r\nlibrary(ggplot2)\n\
    ```\n\n## `ggplot2` 的基本绘图组件\n\n与 R 的基础图形不同，使用 `ggplot2` 时，你不需要通过绘制线条、点或任何所需元素到图形画布上来创建独立的图形组件。相反，你需指定如何将数据映射到抽象的图形美学属性，例如\
    \ x 和 y 坐标、颜色、形状等。然后指定这些美学属性应如何在图形中呈现，例如 x 和 y 坐标应该绘制为散点图还是线条。在此基础上，你还可以添加图形信息，例如散点图中的点应该是什么形状、颜色美学属性映射到什么颜色等。你通过**分步添加**属性来构建图形，这使得修改图形变得容易。如果你想在图中添加一条线性回归线，只需一个命令即可；由于\
    \ `ggplot2` 已经知道你的哪些数据变量被映射到了 x 和 y 坐标，它会自动计算线性回归并将其添加到图中。如果你想以对数比例绘制数据，只需告诉 `ggplot2`\
    \ 轴应进行对数变换即可。\n\n起初，`ggplot2` 可能看起来比 R 的基础图形更复杂，但你很快就会习惯。\n\n`ggplot2` 的主要组件如下：\n\
    \n*   **数据**——显然，你有要绘制的数据。\n*   **美学属性**——美学属性将数据映射到抽象的图形概念，例如 x 和 y 坐标、颜色和填充。\n\
    *   **几何对象**——几何对象决定了你要制作的图形类型，例如是直方图、散点图还是箱线图。\n*   **统计变换**——统计变换指定了在绘图前应如何汇总数据。你的数据并非总是需要汇总，也就是说，统计变换可以是恒等映射。散点图不会对\
    \ x 和 y 坐标进行汇总计算，但回归线或直方图会。\n*   **标度**——标度指定了通过美学属性映射到图形概念的数据应如何在图上实际放置。你的 x\
    \ 和 y 坐标数据可能以米为单位，但这些米应映射到图上的点。标度负责处理这件事。\n*   **坐标系**——坐标系允许你转换将数据缩放为图形组件的结果。例如，如果你想让图形以对数比例显示\
    \ y 轴，那么坐标变换可以完成此操作。\n*   **分面**——分面根据数据中的变量将图形拆分为子图。\n\n你可以使用 `ggplot()` 函数创建\
    \ `ggplot2` 图形。然后可以添加上述一个或多个组件。在打印该图形对象之前，不会发生任何事情；打印它才会生成图形。一个典型的模式是立即打印它，并在创建图形对象的同一语句中添加组件。\n\
    \n```r\nggplot(. . . ) + . . . 组件 . . .\n```\n\n要向图形添加组件，你使用**加法**。`ggplot2` 包**不**使用管道操作符。不过，你经常会看到数据通过管道传递给\
    \ `ggplot()` 调用，但在那之后，你必须记得使用加法而不是管道。\n\n一个**图层**创建了你可以看到的（部分）图形。它至少必须包含数据、美学属性、一个统计变换（可以是恒等映射）和一个几何对象（该对象可能指定了统计变换）。在图形显示你的数据之前，你的图形必须至少有一个图层。\n"
- fmt: "## Adding Components to a Plot Object\n\nThe simplest plot we can create is\
    \ empty. You can create it by calling `ggplot()` without any arguments.\n\n```\n\
    p <- ggplot()\n```\n\nYou can see what it consists of by calling the `summary()`\
    \ function, but most of the information is not relevant here. I will highlight\
    \ lines relevant to the components we see in this section as we go along.\n\n\
    ```\nsummary(p)\n## data: [x]\n## faceting: \n##     compute_layout: function\n\
    ##     draw_back: function\n##     draw_front: function\n##     draw_labels: function\n\
    ##     draw_panels: function\n##     finish_data: function\n##     init_scales:\
    \ function\n##     map_data: function\n##     params: list\n##     setup_data:\
    \ function\n##     setup_params: function\n##     shrink: TRUE\n##     train_scales:\
    \ function\n## vars: function\n## super:  \n```\n\nTo create a plot, you print\
    \ the plot object. You can do this explicitly:\n\n```\nprint(p)\n```\n\nor just\
    \ type it into your R terminal:\n\n```\np\n```\n\nbut in this case, the plot is\
    \ empty—we didn’t add anything to it when we created `p`—so I haven’t shown the\
    \ result.\n\nSince putting an object at the outermost level in an R script will\
    \ print an object, `ggplot` objects are not always assigned to a variable and\
    \ then plotted later. You can just write the `ggplot()` object.\n\n```\nggplot()\n\
    ```\n\nWhy would anyone create an empty plot object? You cannot print the empty\
    \ object. Well, you can, but you will get an empty canvas, so there is not much\
    \ point to that. You can, however, build up a plot by adding components to it.\
    \ You can start with the empty plot and add all you want to it in separate commands.\n\
    \n### Adding Data\n\nYou add data to a plot as an argument to `ggplot()`. If you\
    \ want to add data to the empty plot, you will use geometries; see the following\
    \ example. If you add data in the `ggplot()` function, then all components you\
    \ add to the plot later will be able to see the data.\n\nWith some random test\
    \ data, we can create a plot object with associated data.\n\n```\ndat <- tibble(\n\
    foo = runif(100),\nbar = 20 * foo + 5 + rnorm(100, sd = 10),\nbaz = rep(1:2, each\
    \ = 50)\n)\np <- ggplot(data = dat)\n```\n\nIf you call `summary(p)`, you can\
    \ see the line:\n\n```\n## data: foo, bar, baz [100x3]\n```\n\nat the top. It\
    \ shows you the variables in the data. They are not mapped to any graphical objects\
    \ yet; that is the purview of aesthetics.\n\n### Adding Aesthetics\n\nWhat we\
    \ see in a plot are points, lines, colors, etc. To create these plots, `ggplot2`\
    \ needs to know which variables in the data should be interpreted as coordinates,\
    \ which determines line thickness, which determines colors, and so on. Aesthetics\
    \ do this.\n\nConsider this plot object:\n\n```\np <- ggplot(data = dat, aes(x\
    \ = foo, y = bar, color = baz))\n```\n\nHere, we have specified that `foo` determines\
    \ the x-coordinate, `bar` the y-coordinate, and `baz` the color. If you check\
    \ the summary of the plot, you can see the mapping from data variables to graphical\
    \ objects below the `data` line:\n\n```\n## data: foo, bar, baz [100x3]\n## mapping:\
    \  x = ~foo, y = ~bar, colour = ~baz\n```\n\nPlotting (printing) this will give\
    \ you an empty plot where the x- and y-axes match the range of the data’s x and\
    \ y (`foo` and `bar`) values. The plot is otherwise empty because it does not\
    \ have a geometry.\n\n### Adding Geometries\n\nGeometries specify the type of\
    \ the plot. They use the aesthetics’ maps from the data to graphical properties\
    \ and create a plot based on them.\n\nOne of the most straightforward plots is\
    \ a scatter plot. We can add the `geom_point()` geometry to the plot we created\
    \ earlier to get a scatter plot.\n\n```\np <- ggplot(data = dat, aes(x = foo,\
    \ y = bar, color = baz)) +\ngeom_point()\n```\n\nIf you call `summary(p)`, you\
    \ will see these lines at the bottom of the output:\n\n```\n## geom_point: na.rm\
    \ = FALSE\n## stat_identity: na.rm = FALSE\n## position_identity\n```\n\nThey\
    \ tell you that you have a point geometry and that the statistic that maps from\
    \ the data to a summary is the identity. We do not make any summary of the data\
    \ when we plot it as points. You can create the plot by printing the plot object;\
    \ you can see the result in Figure [13-1](#476587_2_En_13_Chapter.xhtml#Fig1).\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig1_HTML.jpg)\n\nA scatter\
    \ plot was created using `ggplot2`. The dots with slight variation in the shades\
    \ are scattered all over the plot.\n\nFigure 13-1\n\nPoint geometry plot\n\n```\n\
    print(p)\n```\n\nYou can add data and aesthetics directly to the geometry. This\
    \ is especially useful if you want to overlay alternative data onto a plot, but\
    \ as an example, consider moving the same data and aesthetics to the `geom_point()`\
    \ call.\n\n```\np <- ggplot() +\ngeom_point(data = dat, aes(x = foo, y = bar,\
    \ color = baz))\n```\n\nIf you look at the summary, you will see that the mapping\
    \ from the aesthetics is now grouped with the geometry:\n\n```\n## mapping: x\
    \ = ~foo, y = ~bar, colour = ~baz\n## geom_point: na.rm = FALSE\n## stat_identity:\
    \ na.rm = FALSE\n## position_identity\n```\n\nbut otherwise, there is little change.\
    \ This can be used to add additional data to a plot. It also shows that it sometimes\
    \ can make sense to start with an empty plot object and then add different data\
    \ sets in different geometries.\n\nSince `baz` is numerical, it is interpreted\
    \ as a continuous variable. You can get a discrete color mapping by transforming\
    \ it into a factor.\n\n```\nggplot(data = dat, aes(x = foo, y = bar, color = factor(baz)))\
    \ +\ngeom_point()\n```\n\nYou can see the result in Figure [13-2](#476587_2_En_13_Chapter.xhtml#Fig2).\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig2_HTML.jpg)\n\nA scatterplot\
    \ with an added aesthetic parameter of color change in `ggplot2`. Two differently\
    \ shaded dots labeled factors 1 and 2 are scattered.\n\nFigure 13-2\n\nDiscrete\
    \ color aesthetics\n\nYou can change the levels in the factor to reorder the legend.\
    \ See Chapter [10](#476587_2_En_10_Chapter.xhtml) for more on manipulating factors.\n\
    \nAnother simple geometry is a line plot.\n\n```\nggplot(data = arrange(dat, foo),\n\
    aes(x = foo, y = bar, color = factor(baz))) +\ngeom_line()\n```\n\nSee the result\
    \ in Figure [13-3](#476587_2_En_13_Chapter.xhtml#Fig3). I sorted the data with\
    \ respect to the x-axis before I plotted it using `arrange()`. Otherwise, the\
    \ lines would not go left to right but jump back and forth (try it out if you\
    \ want to see what I mean).\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig3_HTML.jpg)\n\
    \nA line plot geometry in `ggplot2`. The differently shaded lines, labeled factors\
    \ 1 and 2, rise and decline to form closely spaced sharp peaks.\n\nFigure 13-3\n\
    \nA line plot\n\nYou can have more than one geometry; see the following example.\n\
    \n```\np <- ggplot(data = dat,\naes(x = foo, y = bar, color = baz)) +\ngeom_point()\
    \ +\ngeom_smooth(formula = y ~ x, method = \"loess\")\n```\n\nIf you call `summary(p)`,\
    \ you will see two layers at the bottom of the output.\n\n```\n## geom_point:\
    \ na.rm = FALSE\n## stat_identity: na.rm = FALSE\n## position_identity\n##\n##\
    \ geom_smooth: na.rm = FALSE, orientation = NA, se = TRUE\n## stat_smooth: na.rm\
    \ = FALSE, orientation = NA, se = TRUE, method = loess\n## position_identity\n\
    ```\n\nObserve that the smooth geometry does not have the identity statistics.\
    \ It shows a summary of the data, and the mapping from the data to that summary\
    \ is handled by a `stat_smooth` statistics.\n\nWe can print the plot:\n\n```\n\
    print(p)\n```"
