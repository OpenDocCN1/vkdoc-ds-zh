  trans: "\n### 扩展、交叉和补全\n\n对于某些应用场景，创建两个或多个列中所有值的组合（即使这些组合在数据中缺失）非常有用。为此，你可以使用 `expand()`\
    \ 函数：\n\n```\ntbl %>% expand(A, B)\n## # A tibble: 6 × 2\n##       A     B\n##\
    \   <int> <int>\n## 1     1    11\n## 2     1    13\n## 3     2    11\n## 4  \
    \   2    13\n## 5     4    11\n## 6     4    13\n```\n\n这里，我们获取了列 `A` 和 `B` 中所有值的组合，而列\
    \ `C` 被忽略。如果某列包含的值来自一个比数据中实际值更大的集合，你可以向 `expand()` 传递一个值向量：\n\n```\ntbl %>% expand(A\
    \ = 1:4, B)\n## # A tibble: 8 × 2\n##       A     B\n##   <int> <int>\n## 1  \
    \   1    11\n## 2     1    13\n## 3     2    11\n## 4     2    13\n## 5     3\
    \    11\n## 6     3    13\n## 7     4    11\n## 8     4    13\n```\n\n如果你有想以这种方式组合的向量，也可以使用\
    \ `crossing()` 函数。\n\n```\ncrossing(A = 1:3, B = 11:13)\n## # A tibble: 9 × 2\n\
    ##       A     B\n##   <int> <int>\n## 1     1    11\n## 2     1    12\n## 3 \
    \    1    13\n## 4     2    11\n## 5     2    12\n## 6     2    13\n## 7     3\
    \    11\n## 8     3    12\n## 9     3    13\n```\n\n如果你只想要数据中存在的组合，可以将 `expand()`\
    \ 与 `nesting()` 函数结合使用：\n\n```\ntbl  \n## 1     1    11\n## 2     2    11\n##\
    \ 3     4    13\n```\n\n这种组合会为你提供所有指定列的组合（所有其他列被忽略），并且只返回唯一的组合，这与通过索引提取列不同。如果你的数据包含大量重复项，但只需计算唯一组合的某些统计量，这会非常有用。\n\
    \n如果你需要数据框中的所有组合，但允许缺失值出现在那些不存在的组合中，可以使用 `complete()` 函数。它确保你拥有所有组合，并为原始数据中不存在的组合在剩余列中放入缺失值。\n\
    \n```\ncomplete(tbl, A = 1:4)\n## # A tibble: 6 × 3\n##       A     B     C\n\
    ##   <int> <int> <int>\n## 1     1    11    21\n## 2     2    11    22\n## 3 \
    \    2    11    12\n## 4     3    NA    NA\n## 5     4    13    42\n## 6     4\
    \    13    32\ncomplete(tbl, B = 11:13)\n## # A tibble: 6 × 3\n##       B    \
    \ A     C\n##   <int> <int> <int>\n## 1    11     1    21\n## 2    11     2  \
    \  22\n## 3    11     2    12\n## 4    12    NA    NA\n## 5    13     4    42\n\
    ## 6    13     4    32\ncomplete(tbl, A = 1:4, B = 11:13)\n## # A tibble: 14 ×\
    \ 3\n##       A     B     C\n##   <int> <int> <int>\n## 1     1    11    21\n\
    ## 2     1    12    NA\n## 3     1    13    NA\n## 4     2    11    22\n## 5 \
    \    2    11    12\n## 6     2    12    NA\n## 7     2    13    NA\n## 8     3\
    \    11    NA\n## 9     3    12    NA\n## 10    3    13    NA\n## 11    4    11\
    \    NA\n## 12    4    12    NA\n## 13    4    13    42\n## 14    4    13    32\n\
    ```\n\n### 缺失值\n\n当数据存在缺失值时，通常需要应用领域的知识才能正确处理。`tidyr` 包提供了一些基础功能用于清理包含缺失值的数据；你可能需要更多功能来妥善处理缺失值，而这些功能很可能在\
    \ `dplyr` 包中找到（参见第 8 章）。\n\n处理缺失值最简单的方法是将其移除。一种粗略的做法是删除所有包含一个或多个缺失变量值的观测。`drop_na()`\
    \ 函数正是为此而生。\n\n```\nmean_income           \n## # A tibble: 5 × 5\n##   country\
    \  `2002` `2003` `2004` `2005`\n##   <chr>     <dbl>  <dbl>  <dbl>  <dbl>\n##\
    \ 1 Numenor  123456 132654     NA 324156\n## 2 Westeros 314256     NA     NA 465321\n\
    ## 3 Narnia   432156     NA     NA     NA\n## 4 Gondor   531426 321465 235461\
    \ 463521\n## 5 Laputa    14235  34125  45123  51234\n```\n\n在这个例子中，如果任何一个年份有缺失数据，我们就会完全失去一个国家。这通常难以接受，也是支持整洁数据的又一个有力论据。如果我们重新格式化表格并删除缺失值，则只会移除那些特定年份收入缺失的观测。\n\
    \n```\nmean_income %>% pivot_longer(\n  names_to = \"year\",\n  values_to = \"\
    mean_income\",\n  -country\n) %>% drop_na()\n## # A tibble: 14 × 3\n##    country\
    \  year  mean_income\n##    <chr>    <chr>       <dbl>\n## 1  Numenor  2002  \
    \    123456\n## 2  Numenor  2003      132654\n## 3  Numenor  2005      324156\n\
    ## 4  Westeros 2002      314256\n## 5  Westeros 2005      465321\n## 6  Narnia\
    \   2002      432156\n## 7  Gondor   2002      531426\n## 8  Gondor   2003   \
    \   321465\n## 9  Gondor   2004      235461\n## 10 Gondor   2005      463521\n\
    ## 11 Laputa   2002       14235\n## 12 Laputa   2003       34125\n## 13 Laputa\
    \   2004       45123\n## 14 Laputa   2005       51234\n```\n\n有时，你可以用适当的数据替换缺失值。例如，我们可以将\
    \ `mean_income` 表中的缺失数据替换为每列的平均值。`replace_na()` 函数可以做到这一点。它的第一个参数是一个数据框，第二个参数是一个指定替换值的列表。这个列表应为每个你想要替换缺失值的列设置一个名称，并且分配给这些名称的值应该是你希望用来替换的值。\n\
    \n```\nreplace_na(mean_income, list(\n  `2003` = mean(mean_income$`2003`, na.rm\
    \ = TRUE)\n))\n## # A tibble: 5 × 5\n##   country  `2002` `2003`  `2004` `2005`\n\
    ##   <chr>     <dbl>  <dbl>   <dbl>  <dbl>\n## 1 Numenor  123456 132654     NA\
    \  324156\n## 2 Westeros 314256 162748     NA  465321\n## 3 Narnia   432156 162748\
    \     NA      NA\n## 4 Gondor   531426 321465  235461 463521\n## 5 Laputa    14235\
    \  34125   45123  51234\nreplace_na(mean_income, list(\n  `2003` = mean(mean_income$`2003`,\
    \ na.rm = TRUE),\n  `2004` = mean(mean_income$`2004`, na.rm = TRUE),\n  `2005`\
    \ = mean(mean_income$`2005`, na.rm = TRUE)\n))\n## # A tibble: 5 × 5\n##   country\
    \  `2002` `2003` `2004` `2005`\n##   <chr>     <dbl>  <dbl>  <dbl>  <dbl>\n##\
    \ 1 Numenor  123456 132654 140292 324156\n## 2 Westeros 314256 162748 140292 465321\n\
    ## 3 Narnia   432156 162748 140292 326058\n## 4 Gondor   531426 321465 235461\
    \ 463521\n## 5 Laputa    14235  34125  45123  51234\n```\n\n在这个例子中，使用每年平均值可能并不实用；更合理的做法是用每个国家的平均值来替换缺失数据。不过，仅靠\
    \ `tidyr` 函数无法直接实现这一点。借助 `dplyr`，我们拥有相应的工具，我将在第 8 章中再讨论这个问题。\n\n最后一个用于处理缺失数据的函数是\
    \ `fill()` 函数。它会用列中上面的值（或者，如果将参数 `.direction` 设为 `\"up\"`，则用下面的值）替换缺失值。假设我们有一个每年每季度收入的表格，但年份只在第一季度标明。\n\
    \n```\ntbl <- read_csv(\n  \"year, quarter, income\n  2011, Q1, 13\n  , Q2, 12\n\
    \  , Q3, 14\n  , Q4, 11\n  2012, Q1, 12\n  , Q2, 14\n  , Q3, 15\n  , Q4, 17\"\
    ,\n  show_col_types = FALSE\n)\nspec(tbl)\n## cols(\n##   year = col_double(),\n\
    ##   quarter = col_character(),\n##   income = col_double()\n## )\n```\n\n我们可以使用\
    \ `fill()` 将年份向下重复填充到各个季度：\n\n```\nfill(tbl, year)\n## # A tibble: 8 × 3\n## \
    \   year quarter income\n##   <dbl> <chr>    <dbl>\n## 1  2011 Q1          13\n\
    ## 2  2011 Q2          12\n## 3  2011 Q3          14\n## 4  2011 Q4          11\n\
    ## 5  2012 Q1          12\n## 6  2012 Q2          14\n## 7  2012 Q3          15\n\
    ## 8  2012 Q4          17\n```\n"
- fmt: "# Nesting Data\n\nA final functionality that tidyr provides is nesting data.\
    \ A tibble entry usually contains simple data, such as numbers or strings, but\
    \ it can also hold complex data, such as other tables.\n\nConsider this table:\n\
    \n```\ntbl<-tribble(\n~A,~B,~C,\n1,11,21,\n1,11,12,\n2,42,22,\n2,15,22,\n2,15,32,\n\
    4,13,32\n)\n```\n\nFrom this table, we can create one that, for each value in\
    \ the `A` column, contains a table of `B` and `C` for that `A` value.\n\n```\n\
    nested_tbl <- tbl |> nest(BC = c(B, C))\nnested_tbl\n## # A tibble: 3 × 2\n##\
    \       A BC\n##    \n## 1     1 \n## 2     2 \n## 3     4 \nnested_tbl[[1,2]]\n\
    ## [[1]]\n## # A tibble: 2 × 2\n##       B     C\n##    \n## 1     11   21\n##\
    \ 2     11   12\n```\n\nThe column that contains the nested table is named `BC`\
    \ because we used a named argument with that name, `BC = c(B, C)`.\n\nThe reverse\
    \ operation is `unnest()`:\n\n```\nnested_tbl |> unnest(cols = c(BC))\n## # A\
    \ tibble: 6 × 3\n##       A     B     C\n##     \n## 1     1    11    21\n## 2\
    \     1    11    12\n## 3     2    42    22\n## 4     2    15    22\n## 5    \
    \ 2    15    32\n## 6     4    13    32\n```\n\nNesting is not a typical operation\
    \ in data analysis, but it is there if you need it, and in the packages in Chapter\
    \ [12](#476587_2_En_12_Chapter.xhtml), we see some usages.\n\nFootnotes [1](#476587_2_En_5_Chapter.xhtml#Fn1_source)\
    \ [2](#476587_2_En_5_Chapter.xhtml#Fn2_source) [3](#476587_2_En_5_Chapter.xhtml#Fn3_source)\n\
    \n# 6. Pipelines: magrittr\n\nData analysis consists of several steps, where your\
    \ data moves through different stages of transformations and cleaning before you\
    \ finally get to model construction. In practical terms, this means that your\
    \ `R` code will consist of a series of function calls where the output of one\
    \ is the input of the next. The pattern is typical, but a straightforward implementation\
    \ of it has several drawbacks. The Tidyverse has for many years provided a “pipe\
    \ operator” to alleviate this, and with R 4.1, there is also a built-in operator\
    \ in the language itself. Although this chapter is mainly about the `magrittr`\
    \ pipe operator, `%>%`, I will describe the native `|>` operator as well and point\
    \ out a few places where they differ in their behavior.\n\nThe native operator,\
    \ `|>`, is readily available in any R version greater than 4.1.0. You can get\
    \ the pipe operator implemented in the `magrittr` package if you load the `tidyverse`\
    \ package:\n\n```\nlibrary(tidyverse)\n```\n\nor explicitly load the package:\n\
    \n```\nlibrary(magrittr)\n```\n\nIf you load `magrittr` through the `tidyverse`\
    \ package, you will get the most common pipe operator, `%>%`, but not alternative\
    \ ones—see the following section. For those, you need to load `magrittr`.\n\n\
    ## The Problem with Pipelines\n\nConsider this data from Chapter [5](#476587_2_En_5_Chapter.xhtml).\n\
    \n```\nwrite_csv(\ntribble(\n~country,  ~`2002`, ~`2003`, ~`2004`, ~`2005`,\n\"\
    Numenor\",  123456,  132654,      NA,  324156,\n\"Westeros\", 314256,  NA,   \
    \       NA,  465321,\n\"Narnia\",   432156,  NA,          NA,      NA,\n\"Gondor\"\
    ,   531426,  321465,  235461,  463521,\n\"Laputa\",    14235,   34125,   45123,\
    \   51234,\n),\n\"data/income.csv\"\n)\n```\n\nI have written it to a file, `data/income.csv`,\
    \ to make the following examples easier to read.\n\nIn Chapter [5](#476587_2_En_5_Chapter.xhtml),\
    \ we reformatted and cleaned this data using `pivot_longer()` and `drop_na()`:\n\
    \n```\nmydata <- read_csv(\"data/income.csv\",\ncol_types = \"cdddd\")\nmydata\
    \ <- pivot_longer(\ndata = mydata,\nnames_to = \"year\",\nvalues_to = \"mean_income\"\
    ,\n!country\n)\nmydata <- drop_na(mydata)\n```\n\nThis is a typical pipeline,\
    \ although a short one. It consists of three steps: (1) read the data into R,\
    \ (2) tidy the data, and (3) clean the data.\n\nThere is nothing inherently wrong\
    \ with code like this. Each step is easy to read; it is a function call that transforms\
    \ your data from one form to another. The pipeline nature of the code, however,\
    \ is not explicit. We can read the code and see that the output of one function\
    \ is the input of the next, but what if it isn't?\n\nConsider this:\n\n```\nmydata\
    \ <- read_csv(\"data/income.csv\",\ncol_types = \"cdddd\")\ndata <- pivot_longer(...)\
    \ # Are we assigning to the right name?\nmydata <-drop_na(mydata) # Input from\
    \ read_csv() not pivot_longer()\n```\n\nThe result of `pivot_longer()` is assigned\
    \ to the variable `data`, and then `drop_na()` is called on `mydata`. If our intent\
    \ were the preceding pipeline, this would be a mistake. But maybe we wanted the\
    \ result of `pivot_longer()` to be a separate data table needed for some downstream\
    \ analysis.\n\nA series of transformation steps that constitute a pipeline can\
    \ only be recognized as such by following programming conventions, and unless\
    \ the code is well documented and well understood, we cannot immediately see from\
    \ the code whether assigning to `data` instead of `mydata` is an error.\n\nWe\
    \ can make pipelines more explicit. If the output of one function should be the\
    \ input of the next, we can nest the function calls:\n\n```\nmydata <- drop_na(\n\
    pivot_longer(\ndata = read_csv(\"data/income.csv\",\ncol_types = \"cdddd\"),\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)\n)\n```\n\nThis\
    \ makes the pipeline intention explicit, but the code very hard to read; you have\
    \ to work out the pipeline from the innermost function call to the outermost.\n\
    \nThe `magrittr` package gives us notation for explicitly describing specifying\
    \ readable pipelines."
