    { print(ggplot(., aes(x = year, y = mean_income)) + geom_point()) }%>%\ndrop_na()\
    \ %>% write_csv(\"data/tidy-income.csv\")\n```\n\nFootnotes [1](#476587_2_En_6_Chapter.xhtml#Fn1_source)\n\
    \n# 7. Functional Programming: **purrr**\n\nA pipeline-based approach to data\
    \ processing necessitates a functional programming approach. After all, pipelines\
    \ are compositions of functions, and loops and variable assignment do not work\
    \ well with pipelines . You are not precluded from imperative programming, but\
    \ you need to wrap it in functions.\n\nThe package `purrr` makes functional programming\
    \ easier. As with the other packages in this book, it will be loaded if you import\
    \ `tidyverse`, but you can load it explicitly with\n\n```\nlibrary(purrr)\n```\n\
    \nI will not describe all the functions in the `purrr` package , there are many\
    \ and more could be added between the time I write this and the time you read\
    \ it, but I will describe the functions you will likely use often.\n\nMany of\
    \ the examples in this chapter are so trivial that you would not use `purrr` for\
    \ them. Many reduce to vector expressions, and vector expressions are both more\
    \ straightforward to read and faster to evaluate. However, applications where\
    \ you cannot use vector expressions are more involved, and I do not want the examples\
    \ to overshadow the syntax.\n\n## General Features of purrr Functions\n\nThe functions\
    \ in the `purrr` package are “high-order” functions, which means that the functions\
    \ either take other functions as input or return functions when you call them\
    \ (or both). Most of the functions take data as their first argument and return\
    \ modified data. Thus, they are immediately usable with pipelines. As additional\
    \ arguments, they will accept one or more functions that specify how you want\
    \ to translate the input into the output.\n\nOther functions do not transform\
    \ data but instead modify functions. These are used, so you do not need to write\
    \ functions for the data transformation functions explicitly; you can use a small\
    \ set of functions and adapt them where needed.\n\n## Filtering\n\nOne of the\
    \ most straightforward functional programming patterns is filtering . Here, you\
    \ use a high-order filter function. This function takes a predicate function,\
    \ that is, a function that returns a logical value, and then returns all elements\
    \ where the predicate evaluates to `TRUE` (the function `keep()`) or all elements\
    \ where the predicate evaluates to `FALSE` (the function `discard()`).\n\n```\n\
    is_even  keep(is_even)\n## [1] 2 4 6\n1:6 |> discard(is_even)\n## [1] 1 3 5\n\
    ```\n\nWhen you work with predicates, the `negate()` function can come in handy.\
    \ It changes the truth value of your predicate, such that if your predicate, `p`,\
    \ returns `TRUE`, then `negate(p)` returns `FALSE` and vice versa.\n\n```\n1:6\
    \ |> keep(negate(is_even))\n## [1] 1 3 5\n1:6 |> discard(negate(is_even))\n##\
    \ [1] 2 4 6\n```\n\nSince you already have complementary functions in `keep()`\
    \ and `discard()`, you would not use `negate()` for filtering, though.\n\nA special-case\
    \ function, `compact()`, removes `NULL` elements from a list.\n\n```\ny  compact()\n\
    ## [[1]]\n## [1] 1 2 3\n```\n\nIf you access attributes on objects, and those\
    \ are not set, R will give you `NULL` as a result, and for such cases, `compact()`\
    \ can be useful.\n\nIf we define lists\n\n```\nx <- y <- 1:3\nnames(y) <- c(\"\
    one\", \"two\", \"three\")\n```\n\nthen `y`’s values will be named, while `x`’s\
    \ will not. If we try to get the names from `x`, we will get `NULL`.\n\n```\n\
    names(x)\n## NULL\nnames(y)\n## [1] \"one\"   \"two\"   \"three\"\n```\n\nUsing\
    \ `compact()` with `names()`, we will discard `x`.\n\n```\nz  compact(names)\n\
