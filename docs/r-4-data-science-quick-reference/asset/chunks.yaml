    ## [1] 1

    ## [1] 2

    ## [1] 3

    ```


    If you need to map over multiple sequences, you have two choices of map functions
    to choose from. Some functions map over exactly two sequences. For each of the
    `map()` functions, there are similar `map2()` functions. These take two sequences
    as the first two arguments.


    ```

    x <- 1:3

    y <- 3:1

    map2_dbl(x, y, `+`)

    ## [1] 4 4 4

    ```


    You can also create lists of sequences and use the `pmap()` functions .


    ```

    list(x, y) |> pmap_dbl(`+`)

    ## [1] 4 4 4

    ```


    There are the same type-specific versions as there are for `map()` and `map2()`,
    but with the `pmap()` functions, you can map over more than one or two input sequences.


    ```

    z  pmap_dbl(f)

    ## [1] 0 -1 -2

    ```


    If you need to know the indices for each value you map over, you can use the `imap()`
    variations. When you use these to map over a sequence, your function needs to
    take two arguments where the first argument is the sequence value and the second
    the value’s index in the input.


    ```

    x  imap_chr(f)

    ## [1] "1: foo" "2: bar" "3: baz"

    ```


    There is yet another variant of the mapping functions, the `modify()` functions
    . These do not have the type variants (but the `_at`, `_if`, `_depth`, and so
    on); instead, they will always give you an output of the same type as the input:


    ```

    modify2(1:3, 3:1, `+`)

    ## [1] 4 4 4

    x  imodify(f)

    ## [1] "1: foo" "2: bar" "3: baz"

    ```


    ## Reduce and Accumulate


    If you want to summarize all your input into a single value, you probably want
    to `reduce()` them. Reduce repeatedly applies a function over your input sequence.
    If you have a function of two arguments, *f*(*a*, *x*), and a sequence *x* [1],
    *x* [2], …, *x* [*n*], then `reduce(f)` will compute *f*(… *f*(*f*(*x*[1], *x*[2]),
    *x*[3]), …, *x*[*n*]), that is, it will be called on the first two elements of
    the sequence, the result will be paired with the next element, and so forth. Think
    of the argument *a* as an accumulator that keeps the result of the calculation
    so far.


    To make the order of function application clear, I define a “pair” type:


    ```

    pair  toString() |> cat() |> invisible()

    }

    ```


    If we reduce using `pair()`, we see how the values are paired when the function
    is called:


    ```

    1:4 |> reduce(pair)

    ## [[[1, 2], 3], 4]

    ```


    If you reverse the input, you can reduce in the opposite order, combining the
    last pair first and propagating the accumulator in that order.


    ```

    1:4 |> rev() |> reduce(pair)

    ## [[[4, 3], 2], 1]

    ```


    If, for some reason, you want to apply the function *and* have the accumulator
    as the last argument, you can use the `.dir = “backward”` argument.


    ```

    1:4 |> reduce(pair, .dir = "backward")

    ## [1, [2, [3, 4]]]

    ```


    The first (or last) element in the input does not have to be the value for the
    initial accumulator. If you want a specific starting value, you can pass that
    to `reduce()` using the `.init` argument.


    ```

    1:3 |> reduce(pair, .init = 0)

    ## [[[0, 1], 2], 3]

    1:3 |> rev() |> reduce(pair, .init = 4)

    ## [[[4, 3], 2], 1]

    1:3 |> reduce(pair, .init = 4, .dir = "backward")

    ## [1, [2, [3, 4]]]

    ```


    If your function takes more than one argument, you can provide the additional
    arguments to `reduce()` and then input sequence and function. Consider, for example,
    a three-argument function like this:


    ```

    # additional arguments

    loud_pair  toString() |>

    paste(volume, ''\n'', sep = '''') |>

    cat()

    # Then return the new pair

    ret

    }

    ```


    It builds a pair object but, as a side effect, prints the pair followed by a string
    that indicates how “loud” the printed value is. We can provide the volume as an
    extra argument to `reduce()`:


    ```

    1:3 |>

    reduce(loud_pair, volume = ''!'') |>

    invisible()

    ## [1, 2]!

    ## [[1, 2], 3]!

    1:3 |>

    reduce(loud_pair, volume = ''!!'') |>

    invisible()

    ## [1, 2]!!

    ## [[1, 2], 3]!!

    ```


    If you want to reduce two sequences instead of one—similar to a second argument
    to `reduce()` but a sequence instead of a single value—you can use `reduce2()`:


    ```

    volumes  reduce2(volumes, loud_pair) |> invisible()

    ## [1, 2]!

    ## [[1, 2], 3]!!

    1:3 |>

    reduce2(c(''!'', ''!!'', ''!!!''), .init = 0, loud_pair) |>

    invisible()

    ## [0, 1]!

    ## [[0, 1], 2]!!

    ## [[[0, 1], 2], 3]!!!

    ```


    If you want all the intermediate values of the reductions, you can use the `accumulate()`
    function . It returns a sequence of the results of each function application.


    ```

    res  accumulate(pair)

    print(res[[1]])

    ## [1] 1

    print(res[[2]])

    ## [1, 2]

    print(res[[3]])

    ## [[1, 2], 3]

    res  accumulate(pair, .init = 0)

    print(res[[1]])

    ## [1] 0

    print(res[[4]])

    ## [[[0, 1], 2], 3]

    res  accumulate(

    pair, .init = 0,

    .dir = "backward"

    )

    print(res[[1]])

    ## [1, [2, [3, 0]]]

    print(res[[4]])

    ## [1] 0

    ```


    The `accumulate2()` function works like `reduce2()`, except that it keeps the
    intermediate values like `accumulate()` does.'
