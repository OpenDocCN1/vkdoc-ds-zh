- fmt: '# Transforming Strings


    We can replace a substring that matches a pattern with some other string.


    ```

    lego_str <- str_replace(strings, "ice cream[s]?", "LEGO")

    lego_str

    ## [1] "Give me an LEGO"

    ## [2] "Get yourself an LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two ice creams,\n  three ice creams"

    ## [6] "I want an LEGO. Do you want an ice cream?"

    lego_str <- str_replace(lego_str, "an LEGO", "a LEGO")

    lego_str

    ## [1] "Give me a LEGO"

    ## [2] "Get yourself a LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two ice creams,\n  three ice creams"

    ## [6] "I want a LEGO. Do you want an ice cream?"

    ```


    These two replacement operators can be written as a pipeline to make the code
    more Tidyverse-y:


    ```

    strings %>%

    str_replace("ice cream[s]?", "LEGO") %>%

    str_replace("an LEGO", "a LEGO")

    ## [1] "Give me a LEGO"

    ## [2] "Get yourself a LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two ice creams,\n  three ice creams"

    ## [6] "I want a LEGO. Do you want an ice cream?"

    ```


    Like most of the previous functions, the function only affects the first match.
    To replace all occurrences, you need `str_replace_all()`.


    ```

    strings %>%

    str_replace_all("ice cream[s]?", "LEGO") %>%

    str_replace_all("an LEGO", "a LEGO")

    ## [1] "Give me a LEGO"

    ## [2] "Get yourself a LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two LEGO,\n  three LEGO"

    ## [6] "I want a LEGO. Do you want a LEGO?"

    ```


    You can refer back to matching groups in the replacement string, something you
    will be familiar with for regular expressions.


    ```

    us_dates <- c(

    valentines = "2/14",

    my_birthday = "2/15",

    # no one knows but let''s just go with this

    jesus_birthday = "12/24"

    )

    # US date format to a more sane format

    str_replace(us_dates, "(.*)/(.*)", "\\2/\\1")

    ## [1] "14/2" "15/2" "24/12"

    ```


    The `str_dup()` function duplicates a string, that is, it repeats a string multiple
    times.


    ```

    str_c(

    "NA",

    str_dup("-NA", times = 7),

    " BATMAN!"

    )

    ## [1] "NA-NA-NA-NA-NA-NA-NA-NA BATMAN!"

    ```


    Here, we also used `str_c()` to concatenate strings. This function works differently
    from `c()`; the latter will create a vector of multiple strings, while the former
    will create one string.


    ```

    # -- concatenation -------------------------------------------

    c("foo", "bar", "baz")

    ## [1] "foo" "bar" "baz"

    str_c("foo", "bar", "baz")

    ## [1] "foobarbaz"

    ```


    A more direct way to extract and modify a substring is using `str_sub()`. It lets
    you extract a substring specified by a start and an end index, and if you assign
    to it, you replace the substring. The `str_sub()` function is less powerful than
    the other functions as it doesn’t work on regular expressions, but because of
    this, it is also easier to understand.


    If you do not know where a substring is found, you must first find it. You can
    use `str_locate()` for this.


    ```

    my_string <- "this is my string"

    my_location <- str_locate(my_string, "my")

    my_location

    ##     start end

    ## [1,]    9  10

    s <- my_location[,"start"]

    e <- my_location[,"end"]

    str_sub(my_string, s, e)

    ## [1] "my"

    my_string_location <- str_locate(my_string, "string")

    s <- my_string_location[,"start"]

    e <- my_string_location[,"end"]

    str_sub(my_string, s, e)

    ## [1] "string"

    your_string <- my_string

    s <- my_location[,"start"]

    e <- my_location[,"end"]

    str_sub(your_string, s, e) <- "your"

    your_string

    ## [1] "this is your string"

    your_banana <- your_string

    your_string_location <- str_locate(your_string, "string")

    s <- your_string_location[,"start"]

    e <- your_string_location[,"end"]

    str_sub(your_banana, s, e) <- "banana"

    your_banana

    ## [1] "this is your banana"

    ```


    When you assign to a call to `str_sub()`, it looks like you are modifying a string.
    This is an illusion. Assignment functions create new data and change the data
    that a variable refers to. So, if you have more than one reference to a string,
    be careful. Only one variable will point to the new value; the remaining will
    point to the old string. This is not specific to `str_sub()` but for R in general,
    and it is a potential source of errors.


    ```

    my_string

    ## [1] "this is my string"

    your_string

    ## [1] "this is your string"

    your_banana

    ## [1] "this is your banana"

    ```


    If you often write code to produce standard reports, virtually the same text each
    time but with a few selected values changed, then you are going to love `str_glue()`.
    This does precisely what you want. You give `str_glue()` a template string, a
    string with the mutable pieces in curly brackets. The result of calling `str_glue()`
    is the template text but with the values in the curly brackets replaced by what
    R expression they contain.


    The most straightforward use is when the template refers to variables.


    ```

    macdonald <- "Old MacDonald"

    eieio <- "E-I-E-I-O"

    str_glue("{macdonald} had a farm. {eieio}")

    ## Old MacDonald had a farm. E-I-E-I-O

    ```


    The variables do not need to be global. They can also be named arguments to `str_glue()`.


    ```

    str_glue(

    "{macdonald} had a farm. {eieio}",

    macdonald = "Thomas",

    eieio = "He certainly did not!"

    )

    ## Thomas had a farm. He certainly did not!

    ```


    Generally, you can put R expressions in the curly brackets, and the result of
    evaluating the expressions will be what is inserted into the template string.


    ```

    str_glue(

    "{str_dup(\"NA-\", times = 7)}NA BATMAN!"

    )

    ## NA-NA-NA-NA-NA-NA-NA-NA BATMAN!

    x <- seq(1:10)

    str_glue(

    "Holy {mean(x)} BATMAN!"

    )

    ## Holy 5.5 BATMAN!

    ```


    # Working with Factors: `forcats`


    If you work with categorical data, you can often represent the categories by strings.
    Strings have some drawbacks, however. For example, a spelling mistake can easily
    go undiscovered. If you want your categories ordered, then the lexicographical
    order on strings will not always be the order you need. As an alternative to encoding
    categories as strings we have factors. In this chapter, we look at the functionality
    that the `forcats` package provides for creating and manipulating factors.


    The package is loaded when you import `tidyverse`:


    ```

    library(tidyverse)

    ```


    but you can also load it explicitly:


    ```

    library(forcats)

