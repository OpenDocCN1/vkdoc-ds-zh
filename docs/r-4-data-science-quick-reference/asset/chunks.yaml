    # 添加水平


    `fct_drop()` 的反向操作是添加额外的水平。正如我们之前所做的那样，对 `levels()` 进行赋值会添加那些因子中不一定存在的水平，但同时也可能会重命名现有的水平。水平被重命名了，而不仅仅是添加。这一点在之前的
    `f1` 上就发生了。当我们添加新水平时，它原有的水平 1、2、3 和 4 被替换为了 A、B、C 和 D。


    使用 `fct_expand()` 函数，你可以添加因子中不存在的水平，而任何数据中已有的水平都会被忽略。


    ```

    f1

    ## [1] C B B A D

    ## Levels: A B C D E F G H I J

    f3

    ## [1] X Y A

    ## Levels: X Y A

    fct_expand(f1, levels(f3))

    ## [1] C B B A D

    ## Levels: A B C D E F G H I J X Y

    ```


    在 R 中，缺失数据并不被视为缺失数据，我们通常可以直接忽略它。然而，有时缺失数据中也包含我们需要考虑的信息。由于 R 在许多统计检验中无法很好地处理缺失数据（我补充这一点是有充分理由的，因为并没有一种普遍正确的方法来处理它），最好的办法是将其转换为
    R **能够**处理的类别。你可以使用 `fct_explicit_na()` 将所有缺失数据映射到一个新的类别中：


    ```

    f2

    ## [1] C B B A D

    ## Levels: C B A D

    fna   A D

    ## Levels: C B A D

    fna <- fct_explicit_na(fna, na_level = "Missing")

    fna

    ## [1] C    Missing Missing A   D

    ## Levels: C B A D Missing

    ```


    ## 重排序水平


    如果你使用 `factor()` 构造函数，可以通过 `levels` 参数来控制水平的顺序。如果你使用 `as.factor()`，水平将按名称排序；如果你使用
    `as_factor()`，水平将按它们在数据中出现的顺序排序。不过，如果有需要，你也可以在这些顺序之间进行转换。


    如果你使用 `factor()` 创建因子时没有指定 `levels`，那么水平将是输入中出现的所有元素，并按它们的自然顺序排序。


    ```

    f <- factor(sample(LETTERS[1:5], 10, replace = TRUE))

    f

    ## [1] C A B D E C B A B B

    ## Levels: A B C D E

    ```


    `fct_inorder()` 函数会将你的水平顺序调整为与数据中类别出现的顺序一致——即使用 `as_factor()` 时得到的顺序。


    ```

    fct_inorder(f)

    ## [1] C A B D E C B A B B

    ## Levels: C A B D E

    ```


    用于重排序水平的函数也可以使因子成为有序因子。^(¹⁸)


    ```

    fct_inorder(f, ordered = TRUE)

    ## [1] C A B D E C B A B B

    ## Levels: C < A < B < D < E

    ```


    如果你想对水平进行排序，并不需要 `forcats` 包中的函数。使用传统的 `factor()` 就可以很好地完成。


    ```

    factor(f, levels = sort(levels(f)))

    ## [1] C A B D E C B A B B

    ## Levels: A B C D E

    factor(f, levels = sort(levels(f)), ordered = TRUE)

    ## [1] C A B D E C B A B B

    ## Levels: A < B < C < D < E

    ```


    你可以使用 `fct_infreq()` 根据水平在因子中出现的频率对其进行排序：


    ```

    table(f)

    ## f

    ## A B C D E

    ## 2 4 2 1 1

    fct_infreq(f)

    ## [1] C A B D E C B A B B

    ## Levels: B A C D E

    f |> fct_infreq() |> table()

    ##

    ## B A C D E

    ## 4 2 2 1 1

    f |> fct_infreq(ordered = TRUE)

    ## [1] C A B D E C B A B B

    ## Levels: B < A < C < D < E

    f |> fct_infreq() |> fct_rev() |> table()

    ##

    ## E D C A B

    ## 1 1 2 2 4

    ```


    在最后一个示例中，我反转了水平顺序，因此顺序是从最小到最大，而不是从最大到最小。`fct_rev()` 函数用于反转水平顺序；它的一个常见用途是当你绘制图表，并且某个坐标轴由因子决定时，你可能希望反转其顺序。


    脚注 1


    # 11. 处理日期：lubridate


    `lubridate` 包是处理日期所必需的，并且与 Tidyverse 配合良好。但是，在导入 `tidyverse` 包时并不会自动加载它，因此你需要显式地加载它。


    ```

    library(lubridate)

    ```


    ## 时间点


    你可以使用 `ymd()` 函数的各种变体来创建日期以及包含一天中时间的日期时间。字母 `y`、`m` 和 `d` 分别代表年、月和日。使用 `ymd()`
    时，你应该将数据写成年份在前、月份其次、日期在最后的格式。该函数在解析日期方面非常灵活。


    ```

    ymd("1975 Feb 15")

    ## [1] "1975-02-15"

    ymd("19750215")

    ## [1] "1975-02-15"

    ymd("1975/2/15")

    ## [1] "1975-02-15"

    ymd("1975-02-15")

    ## [1] "1975-02-15"

    ```


    如果年、月、日的顺序不同，你可以对字母 `y`、`m` 和 `d` 进行排列组合。每种排列都对应一个解析器，它会按照指定的顺序解释输入。


    ```

    dmy("150275")

    ## [1] "1975-02-15"

    mdy("February 15th 1975")

    ## [1] "1975-02-15"

    ```


    如果你想在日期中添加一天中的时间，可以通过使用 `ymd()` 函数的 `_h()`、`_hm()` 和 `_hms()` 变体来分别添加小时、小时和分钟，或者小时、分钟和秒。


    ```

    dmy_h("15/2/1975 2pm")

    ## [1] "1975-02-15 14:00:00 UTC"

    dmy_hm("15/2/1975 14:30")

    ## [1] "1975-02-15 14:30:00 UTC"

    dmy_hms("15/2/1975 14:30:10")

    ## [1] "1975-02-15 14:30:10 UTC"

    ```


    如果你有一个时间对象


    ```

    x <- dmy_hms("15/2/1975 14:30:10")

    ```


    那么你可以通过专门的函数提取其组成部分：


    ```

    c(day(x), month(x), year(x))

    ## [1]   15    2 1975

    c(hour(x), minute(x), second(x))

    ## [1] 14 30 10

    c(week(x), # 一年中的第几周

    wday(x), # 一周中的第几天

    yday(x)) # 一年中的第几天

    ## [1] 7 7 46

    ```


    这些函数有对应的赋值函数，你可以使用它们来修改时间点的组成部分。


    ```

    minute(x) <- 15

    wday(x) <- 42

    x

    ## [1] "1975-03-22 14:15:10 UTC"

    ```


    ## 时区


    当你添加一天中的时间时，时区也是必需的。毕竟，在知道我们所在的时区之前，我们无法知道一个给定的小时对应的是什么时间。如果我告诉你我打算两点钟给你打电话，你不能想当然地认为那是你所在时区的两点钟。^(¹⁹)
    除非你另外指定，否则这些函数会默认采用 UTC 时区。你可以通过 `tz` 参数指定其他时区。


    ```

    dmy_hm(

    "15/2/1975 14:00",

    tz = "Europe/Copenhagen"

    )

    ## [1] "1975-02-15 14:00:00 CET"

    ```


    你可以通过两种不同的方式，将一个时区的时间点转换到另一个时区。一种方式是设置时区，并假定时日和时间原本就在这个时区。也就是说，你只改变对象的时区属性，而不改动时间信息本身。你可以使用
    `force_tz()` 函数来完成此操作。


    ```

    force_tz(

    # 这是一个 CET 时区的日期/时间

    dmy_hm("15/2/1975 14:00", tz = "Europe/Copenhagen"),

    # 它将被转换到 GMT 时区

    tz = "Europe/London"

    )

    ## [1] "1975-02-15 14:00:00 GMT"

    ```


    尽管 CET 和 GMT 是不同的时区，`force_tz()` 函数仍保持小时数为 14:00，并仅更新时区信息。


    更常见的情况是，你想知道一个时区的时间点在另一个时区是什么时间。例如，如果我答应在丹麦时间两点钟给你打电话，而你在英国，你可以使用 `with_tz()`
    将时间从我的时区转换到你的时区。


    ```

    with_tz(

    # 这是一个 CET 时区的日期/时间

    dmy_hm("15/2/1975 14:00", tz = "Europe/Copenhagen"),

    # 这将其转换为相同时间点但表示为 GMT

    tz = "Europe/London"

    )

    ## [1] "1975-02-15 13:00:00 GMT"

    ```


    哥本哈根比伦敦早一个小时，因此当我们将 14:00 从哥本哈根转换到 GMT 时，得到的小时数是 13:00。

