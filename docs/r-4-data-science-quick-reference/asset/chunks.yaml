- fmt: '## Partial Evaluation and Function Composition


    When you filter, map, or reduce over sequences, you sometimes want to modify a
    function to match the interface of `purrr`’s functions. If you have a function
    that takes too many arguments for the interface, but where you can fix some of
    the parameters to get the application you want, you can do what is called a *partial
    evaluation*. This just means that you create a new function that calls the original
    function with some of the parameters fixed.


    For example, if you filter, you want a function that takes one input value and
    returns one (Boolean) output value. If you want to filter the values that are
    less than or greater than, say, three, you can create functions for this.


    ```

    greater_than_three <- function(x) x > 3

    less_than_three <- function(x) x < 3

    1:6 |> keep(greater_than_three)

    ## [1] 4 5 6

    1:6 |> keep(less_than_three)

    ## [1] 1 2

    ```


    The drawback of doing this is that you might need to define many such functions,
    even if you only use each once in your pipeline.


    Using the `partial()` function, you can bind parameters without explicitly defining
    new functions. For example, to bind the first parameter to `<`, as in the `greater_than_three()`
    function, you can use `partial()`:


    ```

    1:6 |> keep(partial(`<`, 3))

    ## [1] 4 5 6

    ```


    By default, you always bind the first parameter(s). To bind others, you need to
    name which parameters to bind. The less than operator has these parameter names:


    ```

    `<`

    ## function (e1, e2) .Primitive("<")

    ```


    so you can use this partial evaluation for `less_than_three()`:


    ```

    1:6 |> keep(partial(`<`, e2 = 3))

    ## [1] 1 2

    ```


    Similarly, you can use partial evaluation for mapping:


    ```

    1:6 |> map_dbl(partial(`+`, 2))

    ## [1] 3 4 5 6 7 8

    1:6 |> map_dbl(partial(`-`, 1))

    ## [1] 0 -1 -2 -3 -4 -5

    1:3 |> map_dbl(partial(`-`, e1 = 4))

    ## [1] 3 2 1

    1:3 |> map_dbl(partial(`-`, e2 = 4))

    ## [1] -3 -2 -1

    ```


    If you need to apply more than one function, for example


    ```

    1:3 |>

    map_dbl(partial(`+`, 2)) |>

    map_dbl(partial(`*`, 3))

    ## [1] 9 12 15

    ```


    you can also simply combine the functions. The function composition, °, works
    as this: (*g* ° *f*)(*x*) = *g*(*f*(*x*)).


    So the pipeline earlier can also be written:


    ```

    1:3 |> map_dbl(

    compose(partial(`*`, 3), partial(`+`, 2))

    )

    ## [1] 9 12 15

    ```


    With `partial()` and `combine()`, you can modify functions, but using them does
    not exactly give you code that is easy to read. A more readable alternative is
    using *lambda expressions*.


    ## Lambda Expressions


    Lambda expressions are a concise syntax for defining anonymous functions, that
    is, functions that we do not name. The name "lambda expressions" comes from "lambda
    calculus," a discipline in formal logic, but in computer science, it is mostly
    used as a synonym for anonymous functions. In some programming languages, you
    cannot create anonymous functions; you need to name a function to define it. In
    other languages, you have special syntax for lambda expressions. In R, you define
    anonymous functions the same way that you define named functions. You always define
    functions the same way; you only give them a name when you assign a function definition
    to a variable.


    If this sounds too theoretical, consider this example. When we filtered values
    that are even, we defined a function, `is_even()`, to use as a predicate.


    ```

    is_even <- function(x) x %% 2 == 0

    1:6 |> keep(is_even)

    ## [1] 2 4 6

    ```


    We defined the function using the expression `function(x) x %% 2 == 0`, and then
    we assigned the function to the name `is_even`. Instead of assigning the function
    to a name, we could use the function definition directly in the call to `keep()`:


    ```

    1:6 |> keep(function(x) x %% 2 == 0)

    ## [1] 2 4 6

    ```


    R 4 introduced new syntax for defining functions, giving us a slightly shorter
    form:


    ```

    1:6 |> keep(\(x) x %% 2 == 0)

    ## [1] 2 4 6

    ```


    that I tend to use in situations such as this, but this is entirely a question
    of taste. There is nothing wrong with the `function(`…`)` … syntax.


    So, R already has lambda expressions, but the syntax can be verbose, especially
    before R 4 and the `\(...) ...` syntax. In `purrr`, you can use a formula as a
    lambda expression instead of a function. You can define an `is_even()` function
    using a formula like this:


    ```

    is_even_lambda <- ~ .x %% 2 == 0

    1:6 |> keep(is_even_lambda)

    ## [1] 2 4 6

    ```


    or use the formula directly in your pipeline.


    ```

    1:6 |> keep(~ .x %% 2 == 0)

    ## [1] 2 4 6

    ```


    The variable `.x` in the expression will be interpreted as the first argument
    to the lambda expression.


    Lambda expressions are not an approach you can use to define functions in general.
    They only work because `purrr` functions understand formulae as function specifications.
    You cannot write


    ```

    is_even_lambda <- ~ .x %% 2 == 0

    is_even_lambda(3)

    ```


    This will give you an error. The error message is not telling you that you try
    to use a formula as a function, unfortunately, but just that it cannot find the
    function `is_even_lambda`. This is because R will look for a function when you
    call a variable as a function and ignore other variables with the same name. If
    you reassign to a variable


    ```

    f <- function(x) 2 * x

    f <- 5

    f(2)

    ## Error in f(2): could not find function "f"

    ```


    you are told that it cannot find a function with the name you call—not that the
    variable does not refer to a nonfunction. That is the error you get if you attempt
    to call a lambda expression outside a `purrr` function (or certain other Tidyverse
    functions).


    R''s rule for looking for functions can be even more confusing if there is a variable
    in an inner scope and a function in an outer scope:


    ```

    f <- function(x) 2 * x

    g <- function() {

    f <- 5 # not a function

    f(2) # will look for a function

    }

    g()

    ## [1] 4

    ```


    Here, the `f()` function in the outer scope is called because it is a function;
    the variable in the inner scope is ignored.


    Getting back to lambda expressions in `purrr` functions, you can use them as more
    readable versions of partial evaluation.


    ```

    1:4 |> map_dbl(~ .x / 2)

    ## [1] 0.5 1.0 1.5 2.0

    1:3 |> map_dbl(~ 2 + .x)

    ## [1] 3 4 5

    1:3 |> map_dbl(~ 4 - .x)

    ## [1] 3 2 1

    1:3 |> map_dbl(~ .x - 4)

    ## [1] -3 -2 -1

    ```


    Or you can use them for more readable versions of function composition.


    ```

    1:3 |> map_dbl(~ 3 * (.x + 2))

    ## [1] 9 12 15

    ```


    If you need a lambda expression with two arguments, you can use `.x` and `.y`
    as the first and second arguments, respectively.


    ```

    map2_dbl(1:3, 1:3, ~ .x + .y)

    ## [1] 2 4 6

    ```


    If you need more than two arguments, you can use `.*n*` for the *n*th argument:


    ```

    list(1:3, 1:3, 1:3) %>% pmap_dbl(~ .1 + .2 + .3)

    ## [1] 0.6 0.6 0.6

    ```


    # Manipulating Data Frames: `dplyr`


    The `dplyr` package resembles the functionality in the `purrr` package, but it
    is designed for manipulating data frames. It will be loaded with the `tidyverse`
    package, but you can also load it using


    ```

    library(dplyr)

    ```


    The usual way that you use `dplyr` is similar to how you use `purrr`. You string
    together a sequence of actions in a pipeline, with the actions separated by the
    `%>%` operator. The difference between the two packages is that the `purrr` functions
    work on sequences while the `dplyr` functions work on data frames.


    This package is huge and more functionality is added in each new release, so it
    would be impossible for me to describe everything you can do with `dplyr`. I can
    only give you a flavor of the package functionality and refer you to the documentation
    for more information.'
