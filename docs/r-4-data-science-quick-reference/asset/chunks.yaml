  trans: "\n## 映射（Mapping）\n\n将函数 *f* 映射到序列 *x* = *x* [1], *x* [2], …, *x* [*n*] 上，会返回一个与输入长度相同的新序列，其中每个元素都是该函数应用后的结果：*f*(*x*\
    \ [1]), *f*(*x* [2]), …, *f*(*x* [*n*])。\n\n函数`map()`用于执行此操作，并返回一个`list`（列表）作为输出结果。列表是\
    \ R 语言中的通用序列数据结构，因为它可以容纳所有类型的 R 对象。\n\n```\nis_even <- function(x) x %% 2 == 0\n\
    list(1, 2, 3, 4) |> map(is_even)\n## [[1]]\n## [1] FALSE\n##\n## [[2]]\n## [1]\
    \ TRUE\n##\n## [[3]]\n## [1] FALSE\n##\n## [[4]]\n## [1] TRUE\n```\n\n通常，我们需要处理特定类型的向量。对于所有原子类型，`purrr`\
    \ 都有专门的映射函数。用于逻辑值的函数名为`map_lgl()`。\n\n```\n1:4 |> map_lgl(is_even)\n## [1] FALSE\
    \ TRUE FALSE TRUE\n```\n\n对于像这样简单的例子，你不应该使用`purrr`。向量表达式更快且更易于使用。\n\n```\n1:4\
    \ %% 2 == 0\n## [1] FALSE TRUE FALSE TRUE\n```\n\n然而，你并不总能使用向量表达式。假设你想从一个正态分布中对一个不同\
    \ *n* 值的序列分别抽取 *n* 个元素，然后计算均值的标准误。向量表达式\n\n```\nsd(rnorm(n = n)) / sqrt(n) # 不是\
    \ SEM！\n```\n\n无法完成此计算。如果你向`rnorm()`传入一个序列作为其`n`参数，它会将输入的*长度*作为要抽取的元素个数。\n\n```\n\
    n <- seq.int(100, 1000, 300) # 我们想要的不同的 n 值\nn\n## [1]  100  400  700 1000\n#\
    \ 我们是否为每个 n 值都进行了抽样？\nrnorm(n) # 不是，rnorm() 使用了 length(n) 作为样本数量\n## [1]  0.6691846\
    \ -0.4554893 -0.8175801  1.7794664\n```\n\n当你有一个非向量化的函数时，可以使用 `map` 系列函数来将其应用于列表中的所有元素。\n\
    \n```\nsem <- function(x) sd(x) / sqrt(length(x))\nlist(1:10, 100:110, 20:30,\
    \ 50:70) |> map_dbl(sem)\n## [1] 0.10197308 0.05138140 0.03673840 0.03057261\n\
    ```\n\n这里，我使用了`map_dbl()`来获得双精度型（数值型）输出。函数`map_chr()`和`map_int()`将分别返回字符串和整型。\n\
    \n```\n1:3 %>% map_dbl(identity) %T>% print() %>% class()\n## [1] 1 2 3\n## [1]\
    \ \"numeric\"\n1:3 %>% map_chr(identity) %T>% print() %>% class()\n## [1] \"1\"\
    \ \"2\" \"3\"\n## [1] \"character\"\n1:3 %>% map_int(identity) %T>% print() %>%\
    \ class()\n## [1] 1 2 3\n## [1] \"integer\"\n```\n\n如果你应用的函数返回的值不符合映射函数期望的类型，不同的映射函数会报错。有时，映射函数会进行类型转换，就像之前那样，但并非总是如此。它通常乐于进行不丢失信息的转换，例如，从逻辑型到整型，从整型到双精度型，但反过来则不行。\n\
    \n例如，即使你可以进行类型转换，但如果你向`map_lgl()`提供`identity()`函数，它也不会将整型转换为逻辑型。类似地，你可以使用`as.numeric()`将字符串转换为整型，但如果我们向`map_dbl()`提供`identity()`，它也不会这样做。映射函数比基础\
    \ R 语言的转换函数更加严格。因此，你应该使用能返回正确类型的函数。\n\n`map_dfr()`和`map_dfc()`函数返回数据框（tibble）。映射的函数应返回数据框，这些数据框将通过`map_dfr()`按行合并，通过`map_dfc()`按列合并。\n\
    \n```\nx <- list(a = 1:2, b = 3:4)\nx |> map_dfr(identity)\n## # A tibble: 4 ×\
    \ 2\n##       a     b\n##    <int> <int>\n## 1     1     3\n## 2     2     4\n\
    ## 3     1     3\n## 4     2     4\nlist(a = x, b = x) |> map_dfc(identity)\n\
    ## New names:\n## · `a` -> `a...1`\n## · `b` -> `b...2`\n## · `a` -> `a...3`\n\
    ## · `b` -> `b...4`\n## # A tibble: 2 × 4\n##   a...1  b...2  a...3  b...4\n##\
    \   <int> <int>  <int>  <int>\n## 1     1     3     1     3\n## 2     2     4\
    \     2     4\n```\n\n`map_df()`函数与`map_dfr()`功能相同：\n\n```\nlist(a = x, b = x)\
    \ |> map_df(identity)\n## # A tibble: 4 × 2\n##       a     b\n##    <int> <int>\n\
    ## 1     1     3\n## 2     2     4\n## 3     1     3\n## 4     2     4\n```\n\n\
    你不需要向数据框函数输入数据框，只要你对输入应用的函数返回数据框即可。这适用于所有映射函数。它们接受任何序列输入；它们仅限制和转换输出。\n\n如果你映射的项本身是序列，你可以通过索引提取元素；无需向\
    \ `map` 函数提供函数。\n\n```\nx <- list(c(1, 2, 3), c(4, 5, 6))\nx |> map_dbl(1)\n##\
    \ [1] 1 4\nx |> map_dbl(3)\n## [1] 3 6\n```\n\n如果这些项有名称，你也可以使用这些名称提取值。\n\n```\n\
    x <- list(a = c(a = 42, b = 13), b = c(a = 24, b = 31))\nx |> map_dbl(\"a\")\n\
    ## [1] 42 24\nx |> map_dbl(\"b\")\n## [1] 13 31\n```\n\n这主要用于在数据框上映射时。\n\n```\n\
    a <- data.frame(foo = 1:3, bar = 11:13)\nb <- data.frame(foo = 4:6, bar = 14:16)\n\
    ab <- list(a = a, b = b)\nab |> map(\"foo\")\n## $a\n## [1] 1 2 3\n##\n## $b\n\
    ## [1] 4 5 6\n```\n\n与按名称或索引提取元素相关，你可以使用`map_depth()`对输入的不同深度应用函数。深度零是列表本身，因此映射到这个深度等同于直接将函数应用于输入。\n\
    \n```\nab |> map_depth(0, length)\n## [1] 2\nab |> length()\n## [1] 2\n```\n\n\
    深度 1 给我们序列中的每个元素，因此这行为类似普通的映射。深度 2 允许我们对嵌套元素进行映射。考虑之前的列表`ab`。顶层，深度 0，是列表。深度 1\
    \ 是数据框`a`和`b`。深度 2 是这些数据框中的列。深度 3 是这些列中的各个元素。\n\n```\nab |> map_depth(1, sum)\
    \ |> unlist()\n##  a  b\n## 42 60\nab |> map_depth(2, sum) |> unlist()\n## a.foo\
    \ a.bar b.foo b.bar\n##     6    36    15    45\nab |> map_depth(3, sum) |> unlist()\n\
    ## a.foo1 a.foo2 a.foo3 a.bar1 a.bar2 a.bar3 b.foo1\n##      1      2      3 \
    \    11     12     13      4\n## b.foo2 b.foo3 b.bar1 b.bar2 b.bar3\n##      5\
    \      6     14     15     16\n```\n\n如果你只想将函数应用于部分元素，可以使用`map_if()`。它接受一个谓词和一个函数，并将该函数应用于谓词为真的元素。它返回一个列表，但如果你想要其他类型，可以进行转换。\n\
    \n```\nis_even <- function(x) x %% 2 == 0\nadd_one <- function(x) x + 1\n1:6 |>\
    \ map_if(is_even, add_one) |> as.numeric()\n## [1] 1 3 3 5 5 7\n```\n\n请注意，这与组合过滤（filtering）和映射不同；组合操作会移除不满足谓词的元素。\n\
    \n```\n1:6 |> keep(is_even) |> map_dbl(add_one)\n## [1] 3 5 7\n```\n\n使用`map_if()`，你会保留所有元素，但函数仅应用于部分元素。\n\
    \n如果你希望对谓词为真的元素应用一个函数，而对谓词为假的元素应用另一个函数，你可以向`.else`参数提供一个函数：\n\n```\nadd_two <-\
    \ function(x) x + 2\n1:6 |>\n  map_if(is_even, add_one, .else = add_two) |>\n\
    \  as.numeric()\n## [1] 3 3 5 5 7 7\n```\n\n如果你知道要应用函数的索引，而不是它们必须满足的谓词，可以使用`map_at()`。此函数接受一个索引序列而不是谓词，但在其他方面与`map_if()`工作方式相同。\n\
    \n```\n1:6 |> map_at(2:5, add_one) |> as.numeric()\n## [1] 1 3 4 5 6 6\n```\n\n\
    如果你映射一个列表`x`，你的函数将被调用并传入列表中的元素`x[[i]]`。如果你希望获取包装在长度为 1 的列表中的元素，即使用索引`x[i]`，你可以使用`lmap()`。\n\
    \n```\nlist(a = 1:3, b = 4:6) |> map(print) |> invisible()\n## [1] 1 2 3\n## [1]\
    \ 4 5 6\nlist(a = 1:3, b = 4:6) |> lmap(print) |> invisible()\n## $a\n## [1] 1\
    \ 2 3\n##\n## $b\n## [1] 4 5 6\n```\n\n你应用的函数必须始终返回一个列表，并且`lmap()`会将它们连接起来。\n\n\
    ```\nf <- function(x) list(\"foo\")\nlist(a = 1:3, b = 4:6) |> lmap(f)\n## [[1]]\n\
    ## [1] \"foo\"\n##\n## [[2]]\n## [1] \"foo\"\nf <- function(x) if (x[[1]] == 1)\
    \ list(\"foo\") else list(\"bar\")\nlist(1:3, 4:6) |> lmap(f)\n## [[1]]\n## [1]\
    \ \"foo\"\n##\n## [[2]]\n## [1] \"bar\"\n##\n## [[3]]\n## [1] \"foo\"\n##\n##\
    \ [[4]]\n## [1] \"bar\"\n```\n\n例如，虽然你可以使用`map()`和`length()`获取列表中元素的长度：\n\n```\n\
    list(a = 1:3, b = 4:8) |> map(length) |> unlist()\n## a b\n## 3 5\n```\n\n但如果你尝试用`lmap()`做同样的事情，你会得到一个错误。这是因为`length()`返回一个数值型，而不是一个列表。你需要用`list()`包裹`length()`，这样结果就是包裹在（长度为\
    \ 1 的）列表中的长度。\n"
- fmt: "```r\nwrapped_length <- function(x) {\n  x |>\n    length() |>          #\
    \ get the length of x (result will be numeric)\n    list() |>            # go\
    \ back to a list\n    set_names(names(x))  # and give it the original name\n}\n\
    list(a = 1:3, b = 4:8) |> lmap(wrapped_length) |> unlist()\n## a b \n## 1 1 \n\
    ```\n\nIf it surprises you that the lengths are one here, remember that the function\
    \ is called with the length-one lists at each index. If you want the length of\
    \ what they contain, you need to extract that.\n\n```r\nwrapped_length <- function(x)\
    \ {\n  x |>\n    pluck(1) |>          # pluck(x, 1) from purrr does that same\
    \ as x[[1]]\n    length() |>          # now we have the underlying vector and\
    \ get the length\n    list() |>            # go back to a list\n    set_names(names(x))\
    \  # and give it the original name\n}\nlist(a = 1:3, b = 4:8) %>% lmap(wrapped_length)\
    \ %>% unlist()\n## a b \n## 3 5 \n```\n\nIf you want to extract the nested data,\
    \ though, you probably want `map()` and not `lmap()`.\n\nThe functions `lmap_if()`\
    \ and `lmap_at()` work as `map_if()` and `map_at()` except for how they index\
    \ the input and handle the output as lists to be concatenated.\n\nSometimes, we\
    \ only want to call a function for its side effect. In that case, you can pipe\
    \ the result of a map into `invisible()`. The function `walk()` does that for\
    \ you, and using it makes it explicit that this is what you want, but it is simply\
    \ syntactic sugar for `map()` + `invisible()`.\n\n```r\n1:3 |> map(print) |> invisible()\n\
    ## [1] 1\n## [1] 2\n## [1] 3\n1:3 |> walk(print)\n## [1] 1\n## [1] 2\n## [1] 3\n\
    ```\n\nIf you need to map over multiple sequences, you have two choices of map\
    \ functions to choose from. Some functions map over exactly two sequences. For\
    \ each of the `map()` functions, there are similar `map2()` functions. These take\
    \ two sequences as the first two arguments.\n\n```r\nx <- 1:3\ny <- 3:1\nmap2_dbl(x,\
    \ y, `+`)\n## [1] 4 4 4\n```\n\nYou can also create lists of sequences and use\
    \ the `pmap()` functions.\n\n```r\nlist(x, y) |> pmap_dbl(`+`)\n## [1] 4 4 4\n\
    ```\n\nThere are the same type-specific versions as there are for `map()` and\
    \ `map2()`, but with the `pmap()` functions, you can map over more than one or\
    \ two input sequences.\n\n```r\nz <- list(a = 1:3, b = 4:8, c = 10:12)\nf <- function(a,\
    \ b, c) a - b - c\nlist(x, y, z) |> pmap_dbl(f)\n## [1]  0 -1 -2\n```\n\nIf you\
    \ need to know the indices for each value you map over, you can use the `imap()`\
    \ variations. When you use these to map over a sequence, your function needs to\
    \ take two arguments where the first argument is the sequence value and the second\
    \ the value's index in the input.\n\n```r\nx <- c(\"foo\", \"bar\", \"baz\")\n\
    f <- function(val, idx) paste0(idx, \": \", val)\nx |> imap_chr(f)\n## [1] \"\
    1: foo\" \"2: bar\" \"3: baz\"\n```\n\nThere is yet another variant of the mapping\
    \ functions, the `modify()` functions. These do not have the type variants (but\
    \ the `_at`, `_if`, `_depth`, and so on); instead, they will always give you an\
    \ output of the same type as the input:\n\n```r\nmodify2(1:3, 3:1, `+`)\n## [1]\
    \ 4 4 4\nx <- c(\"foo\", \"bar\", \"baz\")\nf <- function(val, idx) paste0(idx,\
    \ \": \", val)\nx |> imodify(f)\n## [1] \"1: foo\" \"2: bar\" \"3: baz\"\n```\n\
    \n## Reduce and Accumulate\n\nIf you want to summarize all your input into a single\
    \ value, you probably want to `reduce()` them. `Reduce` repeatedly applies a function\
    \ over your input sequence. If you have a function of two arguments, *f*(*a*,\
    \ *x*), and a sequence *x* [1], *x* [2], …, *x* [*n*], then `reduce(f)` will compute\
    \ *f*(… *f*(*f*(*x*[1], *x*[2]), *x*[3]), …, *x*[*n*]), that is, it will be called\
    \ on the first two elements of the sequence, the result will be paired with the\
    \ next element, and so forth. Think of the argument *a* as an accumulator that\
    \ keeps the result of the calculation so far.\n\nTo make the order of function\
    \ application clear, I define a \"pair\" type:\n\n```r\npair <- function(x, y)\
    \ {\n  ret <- list(x, y)\n  ret |>\n    toString() |> cat() |> invisible()\n \
    \ ret\n}\n```\n\nIf we reduce using `pair()`, we see how the values are paired\
    \ when the function is called:\n\n```r\n1:4 |> reduce(pair)\n## [[[1, 2], 3],\
    \ 4]\n```\n\nIf you reverse the input, you can reduce in the opposite order, combining\
    \ the last pair first and propagating the accumulator in that order.\n\n```r\n\
    1:4 |> rev() |> reduce(pair)\n## [[[4, 3], 2], 1]\n```\n\nIf, for some reason,\
    \ you want to apply the function *and* have the accumulator as the last argument,\
    \ you can use the `.dir = \"backward\"` argument.\n\n```r\n1:4 |> reduce(pair,\
    \ .dir = \"backward\")\n## [1, [2, [3, 4]]]\n```\n\nThe first (or last) element\
    \ in the input does not have to be the value for the initial accumulator. If you\
    \ want a specific starting value, you can pass that to `reduce()` using the `.init`\
    \ argument.\n\n```r\n1:3 |> reduce(pair, .init = 0)\n## [[[0, 1], 2], 3]\n1:3\
    \ |> rev() |> reduce(pair, .init = 4)\n## [[[4, 3], 2], 1]\n1:3 |> reduce(pair,\
    \ .init = 4, .dir = \"backward\")\n## [1, [2, [3, 4]]]\n```\n\nIf your function\
    \ takes more than one argument, you can provide the additional arguments to `reduce()`\
    \ and then input sequence and function. Consider, for example, a three-argument\
    \ function like this:\n\n```r\n# additional arguments\nloud_pair <- function(x,\
    \ y, volume) {\n  ret <- list(x, y)\n  ret |>\n    toString() |>\n    paste(volume,\
    \ '\\n', sep = '') |>\n    cat()\n  # Then return the new pair\n  ret\n}\n```\n\
    \nIt builds a pair object but, as a side effect, prints the pair followed by a\
    \ string that indicates how \"loud\" the printed value is. We can provide the\
    \ volume as an extra argument to `reduce()`:\n\n```r\n1:3 |>\n  reduce(loud_pair,\
    \ volume = '!') |>\n  invisible()\n## [1, 2]!\n## [[1, 2], 3]!\n1:3 |>\n  reduce(loud_pair,\
    \ volume = '!!') |>\n  invisible()\n## [1, 2]!!\n## [[1, 2], 3]!!\n```\n\nIf you\
    \ want to reduce two sequences instead of one—similar to a second argument to\
    \ `reduce()` but a sequence instead of a single value—you can use `reduce2()`:\n\
    \n```r\nvolumes <- c('!', '!!', '!!!')\n1:3 |>\n  reduce2(volumes, loud_pair)\
    \ |> invisible()\n## [1, 2]!\n## [[1, 2], 3]!!\n1:3 |>\n  reduce2(c('!', '!!',\
    \ '!!!'), .init = 0, loud_pair) |>\n  invisible()\n## [0, 1]!\n## [[0, 1], 2]!!\n\
    ## [[[0, 1], 2], 3]!!!\n```\n\nIf you want all the intermediate values of the\
    \ reductions, you can use the `accumulate()` function. It returns a sequence of\
    \ the results of each function application.\n\n```r\nres <- 1:3 |>\n  accumulate(pair)\n\
    print(res[[1]])\n## [1] 1\nprint(res[[2]])\n## [1, 2]\nprint(res[[3]])\n## [[1,\
    \ 2], 3]\nres <- 1:3 |>\n  accumulate(pair, .init = 0)\nprint(res[[1]])\n## [1]\
    \ 0\nprint(res[[4]])\n## [[[0, 1], 2], 3]\nres <- 1:3 |>\n  accumulate(\n    pair,\
    \ .init = 0,\n    .dir = \"backward\"\n  )\nprint(res[[1]])\n## [1, [2, [3, 0]]]\n\
    print(res[[4]])\n## [1] 0\n```\n\nThe `accumulate2()` function works like `reduce2()`,\
    \ except that it keeps the intermediate values like `accumulate()` does."
