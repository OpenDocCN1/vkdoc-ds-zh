    \ expression, however, will not work since you cannot refer to variables you are\
    \ adding later in the `mutate()` call:\n\n```\ndf %>% mutate(\narea_cm = height_cm\
    \ * width_cm,\nheight_cm = cm_per_inch * height,\nwidth_cm = cm_per_inch * width\n\
    )\n## Error in `mutate()`:\n## ! Problem while computing `area_cm = height_cm\
