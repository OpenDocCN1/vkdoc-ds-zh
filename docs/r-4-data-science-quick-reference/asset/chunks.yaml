- fmt: "# Time Intervals\n\nIf you have two time points, you also have a time interval:\
    \ the time between the two points. You can create an interval object from two\
    \ time points using the `interval()` function.\n\n```\nstart <- dmy(\"02 11 1949\"\
    )\nend <- dmy(\"15 02 1975\")\ninterval(start, end)\n## [1] 1949-11-02 UTC--1975-02-15\
    \ UTC\n```\n\nThe infix operator `%--%` does the same thing.\n\n```\nstart %--%\
    \ end\n## [1] 1949-11-02 UTC--1975-02-15 UTC\n```\n\nYou can get the start and\
    \ end points of an interval using `int_start()` and `int_end()`.\n\n```\nint <-\
    \ interval(start, end)\nint\n## [1] 1949-11-02 UTC--1975-02-15 UTC\nint_start(int)\n\
    ## [1] \"1949-11-02 UTC\"\nint_end(int)\n## [1] \"1975-02-15 UTC\"\n```\n\nThe\
    \ start point does not have to be before the end point. You can define an interval\
    \ that starts after it ends.\n\n```\nend %--% start\n## [1] 1975-02-15 UTC--1949-11-02\
    \ UTC\nint_start(start %--% end)\n## [1] \"1949-11-02 UTC\"\nint_start(end %--%\
    \ start)\n## [1] \"1975-02-15 UTC\"\n```\n\nYou can flip an interval using `int_flip()`.\n\
    \n```\nint_flip(end %--% start)\n## [1] 1949-11-02 UTC--1975-02-15 UTC\n```\n\n\
    The function `int_standardize()` will flip the interval if the start point comes\
    \ after the end point but otherwise will leave the interval as it is.\n\n```\n\
    int_standardize(start %--% end)\n## [1] 1949-11-02 UTC--1975-02-15 UTC\nint_standardize(end\
    \ %--% start)\n## [1] 1949-11-02 UTC--1975-02-15 UTC\n```\n\nThe `int_length()`\
    \ will give you the length of an interval in seconds.\n\n```\nx <- now()\nint\
    \ <- interval(x, x + minutes(1)) # from now and one minute forward\nint_length(int)\
    \ # the length is one minute, so 60 seconds\n## [1] 60\nint <- interval(x, x +\
    \ minutes(20)) # now and 20 minutes forward\nint_length(int) / 60 # Dividing by\
    \ 60 to get the length in minutes\n## [1] 20\n```\n\nYou can check if a point\
    \ is in an interval using the `%within%` operator.\n\n```\nymd(\"1867 05 02\"\
    ) %within% int\n## [1] FALSE\nymd(\"1959 04 23\") %within% int\n## [1] FALSE\n\
    x %within% int # start point is inside the interval\n## [1] TRUE\n(x + minutes(20))\
    \ %within% int # end point is inside the interval\n## [1] TRUE\n```\n\nYou can\
    \ update the start and end points in an interval by assigning to `int_start()`\
    \ or `int_end()`:\n\n```\nint_start(int) <- dmy(\"19 Aug 1950\")\nint\n## [1]\
    \ 1950-08-19 01:00:00 CET--2022-08-23 11:50:29 CEST\nint_end(int) <- dmy(\"19\
    \ Sep 1950\")\nint\n## [1] 1950-08-19 01:00:00 CET--1950-09-19 01:00:00 CET\n\
    ```\n\nYou can move the entire interval by a fixed amount. For example, you can\
    \ move the interval one month forward using `int_shift()`:\n\n```\nint_shift(int,\
    \ months(1))\n## [1] 1950-09-19 01:00:00 CET--1950-10-19 01:00:00 CET\n```\n\n\
    Given two intervals, the `int_overlaps()` function checks if they overlap.\n\n\
    ```\nint1 <- interval(dmy(\"19 Aug 1950\"), dmy(\"19 Sep 1950\"))\nint2 <- interval(dmy(\"\
    19 oct 1950\"), dmy(\"25 nov 1951\"))\nint3 <- interval(dmy(\"19 oct 1948\"),\
    \ dmy(\"25 aug 1951\"))\nint4 <- interval(dmy(\"19 oct 1981\"), dmy(\"25 aug 2051\"\
    ))\n# int1 ends before int2\nint_overlaps(int1, int2)\n## [1] FALSE\n# int3 starts\
    \ before int1 but they overlap\nint_overlaps(int1, int3)\n## [1] TRUE\n# no overlap,\
    \ int4 is far in the future compared to int1\nint_overlaps(int1, int4)\n## [1]\
    \ FALSE\n```\n\nThe function `int_aligns()` checks if any of the four start/end\
    \ points are equal. That is, either the start or the end point of the first interval\
    \ must be equal to at least one of the points in the second interval.\n\nThe four\
    \ intervals we have created earlier do not have shared interval end points.\n\n\
    ```\nc(\nint_aligns(int1, int2),\nint_aligns(int1, int3),\nint_aligns(int1, int4)\n\
    )\n## [1] FALSE FALSE FALSE\n```\n\nWe can create intervals that do share end\
    \ points and test `int_aligns()`:\n\n```\nint5 <- interval(int_start(int1), int_end(int1)\
    \ + years(3))\nint6 <- int_shift(int5, -years(3))\nint7 <- int_shift(int6, -years(3))\n\
    c(\nint_aligns(int1, int5), # share start\nint_aligns(int1, int6), # share end\n\
    int_aligns(int1, int7) # overlaps but does not share endpoints\n)\n## [1] TRUE\
    \ TRUE FALSE\n```\n\n# Working with Models: broom and modelr\n\nThere are many\
    \ models to which you can fit your data, from classical statistical models to\
    \ modern machine learning methods, and a thorough exploration of R packages that\
    \ support this is well beyond the scope of this book. The main concerns when choosing\
    \ and fitting models is not the syntax, and this book is, after all, a syntax\
    \ reference. We will look at two packages that aim at making a tidy interface\
    \ to models.\n\nThe two packages, `broom` and `modelr`, are not loaded with `tidyverse`,\
    \ so you must load them individually.\n\n```\nlibrary(broom)\nlibrary(modelr)\n\
    ```\n\n## broom\n\nWhen you fit a model, you get an object in return that holds\
    \ information about the data and the fit. This data is represented in different\
    \ ways—it depends on the implementation of the function used to fit the data.\
    \ For a linear model, for example, we get this information:\n\n```\nmodel <- lm(mpg\
    \ ~ hp + wt, data = mtcars)\nsummary(model)\n##\n## Call:\n## lm(formula = mpg\
    \ ~ hp + wt, data = mtcars)\n##\n## Residuals:\n##    Min     1Q Median     3Q\
    \    Max\n## -3.941 -1.600 -0.182  1.050  5.854\n##\n## Coefficients:\n##    \
    \         Estimate Std. Error t value Pr(>|t|)\n## (Intercept) -129.9506    29.1890\
    \  -4.452 0.000116\n## hp             0.6578     0.1649   3.990 0.000411\n## wt\
    \            82.1125    11.5518   7.108 8.04e-08\n##\n## (Intercept) ***\n## hp\
    \          ***\n## wt          ***\n## ---\n## Signif. codes:\n## 0 '***' 0.001\
    \ '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n##\n## Residual standard error: 47.35 on 29\
    \ degrees of freedom\n## Multiple R-squared:  0.8635, Adjusted R-squared:  0.8541\n\
    ## F-statistic: 91.71 on 2 and 29 DF,  p-value: 2.889e-13\n```\n\nThe problem\
    \ with this representation is that it can be difficult to extract relevant data\
    \ because the data isn't tidy. The `broom` package fixes this. It defines three\
    \ generic functions, `tidy()`, `glance()`, and `augment()`. These functions return\
    \ tibbles. The first gives you the fit, the second a summary of how good the fit\
    \ is, and the third gives you the original data augmented with fit summaries.\n\
    \n```\ntidy(model) # transform to tidy tibble\n## # A tibble: 3 × 5\n##   term\
    \        estimate std.error statistic p.value\n##                          \n\
    ## 1 (Intercept) -130\\.       29.2       -4.45 1.16e-4\n## 2 hp             0.658\
    \     0.165      3.99 4.11e-4\n## 3 wt            82.1      11.6        7.11 8.04e-8\n\
    glance(model) # model summaries\n## # A tibble: 1 × 12\n##   r.squared adj.r.squared\
    \ sigma statistic p.value\n##                         \n## 1     0.863       \
    \  0.854  47.3      91.7 2.89e-13\n## # . . . with 7 more variables: df ,\n##\
    \ #   logLik , AIC , BIC ,\n## #   deviance , df.residual , nobs \naugment(model)\
    \ # add model info to data\n## # A tibble: 32 × 10\n##    .rownames        disp\
    \    hp    wt .fitted .resid\n##                      \n##  1 Mazda RX4      \
    \  160    110  2.62    158\\.   2.45\n##  2 Mazda RX4 Wag    160    110  2.88\
    \    178\\. -18.5\n##  3 Datsun 710       108     93  2.32    122\\. -13.7\n##\
    \  4 Hornet 4 Drive   258    110  3.22    206\\.  51.6\n##  5 Hornet Sporta. .\
    \ .   360    175  3.44    268\\.  92.4\n##  6 Valiant          225    105  3.46\
    \    223\\.   1.77\n##  7 Duster 360       360    245  3.57    324\\.  35.6\n\
    ##  8 Merc 240D        147\\.    62  3.19    173\\. -26.1\n##  9 Merc 230    \
    \     141\\.    95  3.15    191\\. -50.4\n## 10 Merc 280         168\\.   123\
    \  3.44    233\\. -65.8\n## # . . . with 22 more rows, and 4 more variables:\n\
    ## #    .hat , .sigma , .cooksd ,\n## #    .std.resid \n```\n\nThe `broom` package\
    \ implements specializations for most models. Not all of the three functions are\
    \ meaningful for all models, so some models only have a subset of the functions.\
    \ If you want your own model to work with `broom`, let us call it `mymodel`, then\
    \ you have to implement specializations of the functions, `tidy.mymodel()`, `glance.mymodel()`,\
    \ and `augment.mymodel()`, that are relevant for the model."
