- fmt: "# 2. Importing Data: readr\n\nBefore we can analyze data, we need to load\
    \ it into R. The main Tidyverse package for this is called `readr`, and it is\
    \ loaded when you load the `tidyverse` package:\n\n```\nlibrary(tidyverse)\n```\n\
    \nbut you can also load it explicitly using\n\n```\nlibrary(readr)\n```\n\nTabular\
    \ data is usually stored in text files or compressed text files with rows and\
    \ columns matching the table’s structure. Each line in the file is a row in the\
    \ table, and columns are separated by a known delimiter character. The `readr`\
    \ package is made for such data representation and contains functions for reading\
    \ and writing variations of files formatted in this way. It also provides functionality\
    \ for determining the types of data in each column, either by inferring types\
    \ or through user specifications.\n\n## Functions for Reading Data\n\nThe `readr`\
    \ package provides the following functions for reading tabular data :\n\n| Function\
    \ | File format |\n| --- | --- |\n| `read_csv()` | Comma-separated values |\n\
    | `read_csv2()` | Semicolon-separated values |\n| `read_tsv()` | Tab-separated\
    \ values |\n| `read_delim()` | General column delimiters^([²](#fn2)) |\n| `read_table()`\
    \ | Space-separated values (fixed-length columns) |\n| `read_table2()` | Space-separated\
    \ values (variable-length columns) |\n\nThe interface to these functions differs\
    \ little. In the following text, I describe `read_csv`, but I highlight when the\
    \ other functions differ. The `read_csv` function reads data from a file with\
    \ comma-separated values. Such a file could look like this:\n\n```\nA,B,C,D\n\
    1,a,a,1.2\n2,b,b,2.1\n3,c,c,13.0\n```\n\nUnlike the base R `read.csv` function,\
    \ `read_csv` will also handle files with spaces between the columns, so it will\
    \ interpret the following data the same as the preceding file:\n\n```\nA,  B,\
    \  C,    D\n1,  a,  a,   1.2\n2,  b,  b,   2.1\n3,  c,  c,  13.0\n```\n\nIf you\
    \ use R’s `read.csv` function instead, the spaces before columns B and C will\
    \ be included as part of the data and the text columns will be interpreted as\
    \ factors.\n\nThe first line in the file will be interpreted as a header, naming\
    \ the columns, and the remaining three lines as data rows.\n\nAssuming the file\
    \ is named `data/data.csv`, you read its data like this:\n\n```\nmy_data<-read_csv(file\
    \ =\"data/data.csv\")\n## Rows: 3 Columns: 4\n##---- Column specification --------------------------\n\
    ## Delimiter: \",\"\n## chr (2): B, C\n## dbl (2): A, D\n##\n## i Use 'spec()'\
    \ to retrieve the full column specification for this data.\n## i Specify the column\
    \ types or set 'show_col_types = FALSE' to quiet this message.\n```\n\nThe message\
    \ you get from `read_csv()` tells you that you can get information about the type\
    \ it has inferred for each column if you use the `spec()` function :\n\n```\n\
    spec(my_data)\n## cols(\n##   A = col_double(),\n##   B = col_character(),\n##\
    \   C = col_character(),\n##   D = col_double()\n## )\n```\n\nWhen reading the\
    \ file, `read_csv` will infer that columns A and D are numbers and columns `B`\
    \ and `C` are strings.\n\nIf you are happy with that, and don’t want to be told\
    \ about it in the future, you can use the option\n\n```\nshow_col_types = FALSE:\n\
    my_data<-read_csv(file =\"data/data.csv\",\nshow_col_types =FALSE)\n```\n\nIf\
    \ the file contains tab-separated values\n\n```\nA  B  C  D\n1  a  a  1.2\n2 \
    \ b  b  2.1\n3  c  c  13.0\n```\n\nyou should use `read_tsv()` instead.\n\n```\n\
    my_data<-read_tsv(file =\"data/data.tsv\",\nshow_col_types =FALSE)\n```\n\nThe\
    \ file you read with `read_csv` can be compressed. If the suffix of the file name\
    \ is `.gz`, `.bz2`, `.xz`, or `.zip`, it will be uncompressed before `read_csv`\
    \ loads the data.\n\n```\nmy_data<-read_csv(file =\"data/data.csv.gz\",\nshow_col_types\
    \ =FALSE)\n```\n\nIf the file name is a URL (i.e., has prefix `http://`, `https://`,\
    \ `ftp://`, or `ftps://`, the file will automatically be downloaded.\n\nYou can\
    \ also provide a string as the file object:\n\n```\nread_csv(\n\"A, B, C,    D\n\
    1, a, a,  1.2\n2, b, b,  2.1\n3, c, c, 13.0\n\", show_col_types = FALSE)\n## #\
    \ A tibble: 3 × 4\n##      A B     C         D\n##     \n## 1    1 a     a   \
    \    1.2\n## 2    2 b     b       2.1\n## 3    3 c     c      13\n```\n\nThis\
    \ is rarely useful in a data analysis project, but you can use it to create examples\
    \ or for debugging.\n\n## File Headers\n\nThe first line in a comma-separated\
    \ file is not always the column names; that information might be available from\
    \ elsewhere outside the file. If you do not want to interpret the first line as\
    \ column names, you can use the option `col_names = FALSE`.\n\n```\nread_csv(\n\
    file =\"data/data.csv\",\ncol_names =FALSE,\nshow_col_types =FALSE\n)\n## # A\
    \ tibble: 4 × 4\n##   X1    X2    X3    X4\n##      \n## 1 A     B     C     D\n\
    ## 2 1     a     a     1.2\n## 3 2     b     b     2.1\n## 4 3     c     c   \
    \  13.0\n```\n\nSince the `data/data.csv` file *has* a header, that is interpreted\
    \ as part of the data, and because the header consists of strings, `read_csv`\
    \ infers that all the column types are strings. If we did not have the header,\
    \ for example, if we had the file `data/data-no-header.csv`:\n\n```\n1, a, a,\
    \ 1.2\n2, b, b, 2.1\n3, c, c, 13.0\n```\n\nthen we would get the same data frame\
    \ as before, except that the names would be autogenerated:\n\n```\nread_csv(\n\
    file =\"data/data-no-header.csv\",\ncol_names =FALSE,\nshow_col_types =FALSE\n\
    )\n## # A tibble: 3 × 4\n##      X1 X2    X3        X4\n##      \n## 1     1 a\
    \     a        1.2\n## 2     2 b     b        2.1\n## 3     3 c     c       13\n\
    ```\n\nThe autogenerated column names all start with `X` and are followed by the\
    \ number the columns have from left to right in the file.\n\nIf you have data\
    \ in a file without a header, but you do not want the autogenerated names, you\
    \ can provide column names to the `col_names` option:\n\n```\nread_csv(\nfile\
    \ =\"data/data-no-header.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"W\"),\nshow_col_types\
    \ =FALSE\n)\n## # A tibble: 3 × 4\n##       X Y     Z         W\n##      \n##\
    \ 1     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c\
    \        13\n```\n\nIf there is a header line, but you want to rename the columns,\
    \ you cannot just provide the names to `read_csv` using `col_names`. The first\
    \ row will still be interpreted as data. This gives you data you do not want in\
    \ the first row, and it also affects the inferred types of the columns.\n\nYou\
    \ can, however, skip lines before `read_csv` parse rows as data. Since we have\
    \ a header line in `data/data.csv`, we can skip one line and set the column names.\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"\
    W\"),\nskip =1,\nshow_col_types =FALSE\n)\n## # A tibble: 3 × 4\n##       X Y\
    \     Z         W\n##      \n## 1     1 a     a       1.2\n## 2     2 b     b\
    \       2.1\n## 3     3 c     c      13\n```\n\nYou can also put a limit on how\
    \ many data rows you want to load using the `n_max` option.\n\n```\nread_csv(\n\
    file =\"data/data.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"W\"),\nskip =1,\nn_max\
    \ =2,\nshow_col_types =FALSE\n)\n```\n\nIf your input file has comment lines,\
    \ identifiable by a character where the rest of the line should be considered\
    \ a comment, you can skip them if you provide the `comment` option :\n\n```\n\
    read_csv(\n\"A, B, C,      D   # this is a comment\n1, a, a,   1.2     # another\
    \ comment\n2, b, b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types =FALSE)\n\
    ## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a   \
    \  a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\
    \nYou can leave a whole line as a comment, but then you want the comment character\
    \ to start to the left of that line:\n\n```\nread_csv(\n\"A, B, C,   D   # this\
    \ is a comment\n# whole line comment\n1, a, a,   1.2   # another comment\n2, b,\
    \ b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types =FALSE)\n## # A\
    \ tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a     a  \
    \     1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\nIf\
    \ you have space before the comment, the function can’t tell if there is an error—it\
    \ looks like a line with missing columns rather than a blank line—so you will\
    \ get a warning and a row with `NA` where the comment line was."
  raw: "# 2. Importing Data: **readr**\n\nBefore we can analyze data, we need to load\
    \ it into R. The main Tidyverse package for this is called `readr`, and it is\
    \ loaded when you load the `tidyverse` package:\n\n```\nlibrary(tidyverse)\n```\n\
    \nbut you can also load it explicitly using\n\n```\nlibrary(readr)\n```\n\nTabular\
    \ data is usually stored in text files or compressed text files with rows and\
    \ columns matching the table’s structure. Each line in the file is a row in the\
    \ table, and columns are separated by a known delimiter character. The `readr`\
    \ package is made for such data representation and contains functions for reading\
    \ and writing variations of files formatted in this way. It also provides functionality\
    \ for determining the types of data in each column, either by inferring types\
    \ or through user specifications.\n\n## Functions for Reading Data\n\nThe `readr`\
    \ package provides the following functions for reading tabular data :\n\n| Function\
    \ | File format |\n| --- | --- |\n| `read_csv()` | Comma-separated values |\n\
    | `read_csv2()` | Semicolon-separated values |\n| `read_tsv()` | Tab-separated\
    \ values |\n| `read_delim()` | General column delimiters^([²](#fn2)) |\n| `read_table()`\
    \ | Space-separated values (fixed-length columns) |\n| `read_table2()` | Space-separated\
    \ values (variable-length columns) |\n\nThe interface to these functions differs\
    \ little. In the following text, I describe `read_csv`, but I highlight when the\
    \ other functions differ. The `read_csv` function reads data from a file with\
    \ comma-separated values. Such a file could look like this:\n\n```\nA,B,C,D\n\
    1,a,a,1.2\n2,b,b,2.1\n3,c,c,13.0\n```\n\nUnlike the base R `read.csv` function,\
    \ `read_csv` will also handle files with spaces between the columns, so it will\
    \ interpret the following data the same as the preceding file:\n\n```\nA,  B,\
    \  C,    D\n1,  a,  a,   1.2\n2,  b,  b,   2.1\n3,  c,  c,  13.0\n```\n\nIf you\
    \ use R’s `read.csv` function instead, the spaces before columns B and C will\
    \ be included as part of the data and the text columns will be interpreted as\
    \ factors.\n\nThe first line in the file will be interpreted as a header, naming\
    \ the columns, and the remaining three lines as data rows.\n\nAssuming the file\
    \ is named `data/data.csv`, you read its data like this:\n\n```\nmy_data<-read_csv(file\
    \ =\"data/data.csv\")\n## Rows: 3 Columns: 4\n##---- Column specification --------------------------\n\
    ## Delimiter: \",\"\n## chr (2): B, C\n## dbl (2): A, D\n##\n## i Use 'spec()'\
    \ to retrieve the full column specification for this data.\n## i Specify the column\
    \ types or set 'show_col_types = FALSE' to quiet this message.\n```\n\nThe message\
    \ you get from `read_csv()` tells you that you can get information about the type\
    \ it has inferred for each column if you use the `spec()` function :\n\n```\n\
    spec(my_data)\n## cols(\n##   A = col_double(),\n##   B = col_character(),\n##\
    \   C = col_character(),\n##   D = col_double()\n## )\n```\n\nWhen reading the\
    \ file, `read_csv` will infer that columns A and D are numbers and columns `B`\
    \ and `C` are strings.\n\nIf you are happy with that, and don’t want to be told\
    \ about it in the future, you can use the option\n\n```\nshow_col_types = FALSE:\n\
    my_data<-read_csv(file =\"data/data.csv\",\nshow_col_types =FALSE)\n```\n\nIf\
    \ the file contains tab-separated values\n\n```\nA  B  C  D\n1  a  a  1.2\n2 \
    \ b  b  2.1\n3  c  c  13.0\n```\n\nyou should use `read_tsv()` instead.\n\n```\n\
    my_data<-read_tsv(file =\"data/data.tsv\",\nshow_col_types =FALSE)\n```\n\nThe\
    \ file you read with `read_csv` can be compressed. If the suffix of the file name\
    \ is .`gz`, `.bz2`, `.xz`, or `.zip`, it will be uncompressed before `read_csv`\
    \ loads the data.\n\n```\nmy_data<-read_csv(file =\"data/data.csv.gz\",\nshow_col_types\
    \ =FALSE)\n```\n\nIf the file name is a URL (i.e., has prefix `http://`, `https://`,\
    \ `ftp://`, or `ftps://`, the file will automatically be downloaded.\n\nYou can\
    \ also provide a string as the file object:\n\n```\nread_csv(\n\"A, B, C,    D\n\
    1, a, a,  1.2\n2, b, b,  2.1\n3, c, c, 13.0\n\", show_col_types = FALSE)\n## #\
    \ A tibble: 3 × 4\n##      A B     C         D\n##     \n## 1    1 a     a   \
    \    1.2\n## 2    2 b     b       2.1\n## 3    3 c     c      13\n```\n\nThis\
    \ is rarely useful in a data analysis project, but you can use it to create examples\
    \ or for debugging.\n\n## File Headers\n\nThe first line in a comma-separated\
    \ file is not always the column names; that information might be available from\
    \ elsewhere outside the file. If you do not want to interpret the first line as\
    \ column names, you can use the option `col_names = FALSE`.\n\n```\nread_csv(\n\
    file =\"data/data.csv\",\ncol_names =FALSE,\nshow_col_types =FALSE\n)\n## # A\
    \ tibble: 4 × 4\n##   X1    X2    X3    X4\n##      \n## 1 A     B     C     D\n\
    ## 2 1     a     a     1.2\n## 3 2     b     b     2.1\n## 4 3     c     c   \
    \  13.0\n```\n\nSince the `data/data.csv` file *has* a header, that is interpreted\
    \ as part of the data, and because the header consists of strings, `read_csv`\
    \ infers that all the column types are strings. If we did not have the header,\
    \ for example, if we had the file `data/data-no-header.csv`:\n\n```\n1, a, a,\
    \ 1.2\n2, b, b, 2.1\n3, c, c, 13.0\n```\n\nthen we would get the same data frame\
    \ as before, except that the names would be autogenerated:\n\n```\nread_csv(\n\
    file =\"data/data-no-header.csv\",\ncol_names =FALSE,\nshow_col_types =FALSE\n\
    )\n## # A tibble: 3 × 4\n##      X1 X2    X3        X4\n##      \n## 1     1 a\
    \     a        1.2\n## 2     2 b     b        2.1\n## 3     3 c     c       13\n\
    ```\n\nThe autogenerated column names all start with `X` and are followed by the\
    \ number the columns have from left to right in the file.\n\nIf you have data\
    \ in a file without a header, but you do not want the autogenerated names, you\
    \ can provide column names to the `col_names` option:\n\n```\nread_csv(\nfile\
    \ =\"data/data-no-header.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"W\"),\nshow_col_types\
    \ =FALSE\n)\n## # A tibble: 3 × 4\n##       X Y     Z         W\n##      \n##\
    \ 1     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c\
    \        13\n```\n\nIf there is a header line, but you want to rename the columns,\
    \ you cannot just provide the names to `read_csv` using `col_names`. The first\
    \ row will still be interpreted as data. This gives you data you do not want in\
    \ the first row, and it also affects the inferred types of the columns.\n\nYou\
    \ can, however, skip lines before `read_csv` parse rows as data. Since we have\
    \ a header line in `data/data.csv`, we can skip one line and set the column names.\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"\
    W\"),\nskip =1,\nshow_col_types =FALSE\n)\n## # A tibble: 3 × 4\n##       X Y\
    \     Z         W\n##      \n## 1     1 a     a       1.2\n## 2     2 b     b\
    \       2.1\n## 3     3 c     c      13\n```\n\nYou can also put a limit on how\
    \ many data rows you want to load using the `n_max` option.\n\n```\nread_csv(\n\
    file =\"data/data.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"W\"),\nskip =1,\nn_max\
    \ =2,\nshow_col_types =FALSE\n)\n```\n\nIf your input file has comment lines,\
    \ identifiable by a character where the rest of the line should be considered\
    \ a comment, you can skip them if you provide the `comment` option :\n\n```\n\
    read_csv(\n\"A, B, C,      D   # this is a comment\n1, a, a,   1.2     # another\
    \ comment\n2, b, b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types =FALSE)\n\
    ## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a   \
    \  a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\
    \nYou can leave a whole line as a comment, but then you want the comment character\
    \ to start to the left of that line:\n\n```\nread_csv(\n\"A, B, C,   D   # this\
    \ is a comment\n# whole line comment\n1, a, a,   1.2   # another comment\n2, b,\
    \ b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types =FALSE)\n## # A\
    \ tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a     a  \
    \     1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\nIf\
    \ you have space before the comment, the function can’t tell if there is an error—it\
    \ looks like a line with missing columns rather than a blank line—so you will\
    \ get a warning and a row with `NA` where the comment line was."
  trans: "\n# 2. 数据导入：readr\n\n在分析数据之前，我们需要将其加载到 R 中。Tidyverse 中用于此功能的主要包是 `readr`，当你加载\
    \ `tidyverse` 包时，它也会被加载：\n\n```\nlibrary(tidyverse)\n```\n\n但你也可以通过以下命令显式加载它：\n\
    \n```\nlibrary(readr)\n```\n\n表格数据通常存储在文本文件或压缩文本文件中，其行和列与表格结构相匹配。文件中的每一行都是表格中的一行，列则由已知的分隔符字符隔开。`readr`\
    \ 包正是为此类数据表示而设计的，它包含了用于读取和写入这种格式的各种变体文件的函数。此外，它还提供了确定每一列数据类型的函数，既可以通过自动推断类型，也可以根据用户的指定来进行。\n\
    \n## 读取数据的函数\n\n`readr` 包提供了以下用于读取表格数据的函数：\n\n| 函数 | 文件格式 |\n| --- | --- |\n|\
    \ `read_csv()` | 逗号分隔值 |\n| `read_csv2()` | 分号分隔值 |\n| `read_tsv()` | 制表符分隔值 |\n\
    | `read_delim()` | 通用列分隔符^(²) |\n| `read_table()` | 空格分隔值（等宽列） |\n| `read_table2()`\
    \ | 空格分隔值（可变列宽） |\n\n这些函数的接口差异很小。在以下文本中，我将描述 `read_csv`，但会在其他函数不同时加以强调。`read_csv`\
    \ 函数用于从包含逗号分隔值的文件中读取数据。这样的文件可能如下所示：\n\n```\nA,B,C,D\n1,a,a,1.2\n2,b,b,2.1\n3,c,c,13.0\n\
    ```\n\n与基础 R 的 `read.csv` 函数不同，`read_csv` 还能处理列之间有空格的文件，因此它将把以下数据解释为与上一个文件相同：\n\
    \n```\nA,  B,  C,    D\n1,  a,  a,   1.2\n2,  b,  b,   2.1\n3,  c,  c,  13.0\n\
    ```\n\n如果你改用 R 的 `read.csv` 函数，那么列 B 和 C 前面的空格将被包含在数据中，并且文本列将被解释为因子。\n\n文件中的第一行将被解释为标题行，用于命名各列，其余三行则被解释为数据行。\n\
    \n假设该文件名为 `data/data.csv`，你可以像这样读取其数据：\n\n```\nmy_data<-read_csv(file =\"data/data.csv\"\
    )\n## Rows: 3 Columns: 4\n##---- Column specification --------------------------\n\
    ## Delimiter: \",\"\n## chr (2): B, C\n## dbl (2): A, D\n##\n## i Use 'spec()'\
    \ to retrieve the full column specification for this data.\n## i Specify the column\
    \ types or set 'show_col_types = FALSE' to quiet this message.\n```\n\n从 `read_csv()`\
    \ 得到的消息告诉你，如果你使用 `spec()` 函数，就可以获得关于它为每列推断的类型的信息：\n\n```\nspec(my_data)\n## cols(\n\
    ##   A = col_double(),\n##   B = col_character(),\n##   C = col_character(),\n\
    ##   D = col_double()\n## )\n```\n\n在读取文件时，`read_csv` 会推断列 A 和 D 是数字，而列 `B` 和\
    \ `C` 是字符串。\n\n如果你对此感到满意，并且以后不想再看到这些信息，你可以使用以下选项：\n\n```\nshow_col_types = FALSE:\n\
    my_data<-read_csv(file =\"data/data.csv\",\nshow_col_types =FALSE)\n```\n\n如果文件包含制表符分隔的值：\n\
    \n```\nA  B  C  D\n1  a  a  1.2\n2  b  b  2.1\n3  c  c  13.0\n```\n\n那么你应该改用 `read_tsv()`。\n\
    \n```\nmy_data<-read_tsv(file =\"data/data.tsv\",\nshow_col_types =FALSE)\n```\n\
    \n你用 `read_csv` 读取的文件可以是压缩文件。如果文件名的后缀是 `.gz`、`.bz2`、`.xz` 或 `.zip`，那么在 `read_csv`\
    \ 加载数据之前，它会被解压缩。\n\n```\nmy_data<-read_csv(file =\"data/data.csv.gz\",\nshow_col_types\
    \ =FALSE)\n```\n\n如果文件名是一个 URL（即前缀为 `http://`、`https://`、`ftp://` 或 `ftps://`），那么该文件将被自动下载。\n\
    \n你也可以提供一个字符串作为 `file` 参数：\n\n```\nread_csv(\n\"A, B, C,    D\n1, a, a,  1.2\n\
    2, b, b,  2.1\n3, c, c, 13.0\n\", show_col_types = FALSE)\n## # A tibble: 3 ×\
    \ 4\n##      A B     C         D\n##     \n## 1    1 a     a       1.2\n## 2 \
    \   2 b     b       2.1\n## 3    3 c     c      13\n```\n\n这在数据分析项目中很少有用，但你可以用它来创建示例或进行调试。\n\
    \n## 文件标题行\n\n逗号分隔文件中的第一行并不总是列名；该信息可能来自文件外部的其他来源。如果你不想将第一行解释为列名，可以使用选项 `col_names\
    \ = FALSE`。\n\n```\nread_csv(\nfile =\"data/data.csv\",\ncol_names =FALSE,\nshow_col_types\
    \ =FALSE\n)\n## # A tibble: 4 × 4\n##   X1    X2    X3    X4\n##      \n## 1 A\
    \     B     C     D\n## 2 1     a     a     1.2\n## 3 2     b     b     2.1\n\
    ## 4 3     c     c     13.0\n```\n\n由于 `data/data.csv` 文件*确实有*一个标题行，它被解释为数据的一部分，并且因为标题行由字符串组成，`read_csv`\
    \ 推断所有列的类型都是字符串。如果我们没有标题行，例如，如果我们有这样的文件 `data/data-no-header.csv`：\n\n```\n1,\
    \ a, a, 1.2\n2, b, b, 2.1\n3, c, c, 13.0\n```\n\n那么我们会得到与之前相同的数据框，只是名称是自动生成的：\n\
    \n```\nread_csv(\nfile =\"data/data-no-header.csv\",\ncol_names =FALSE,\nshow_col_types\
    \ =FALSE\n)\n## # A tibble: 3 × 4\n##      X1 X2    X3        X4\n##      \n##\
    \ 1     1 a     a        1.2\n## 2     2 b     b        2.1\n## 3     3 c    \
    \ c       13\n```\n\n自动生成的列名都以 `X` 开头，后面跟着文件中从左到右的列序号。\n\n如果你有一个不带标题行的文件数据，但你不想要自动生成的名称，你可以向\
    \ `col_names` 选项提供列名：\n\n```\nread_csv(\nfile =\"data/data-no-header.csv\",\n\
    col_names =c(\"X\",\"Y\",\"Z\",\"W\"),\nshow_col_types =FALSE\n)\n## # A tibble:\
    \ 3 × 4\n##       X Y     Z         W\n##      \n## 1     1 a     a       1.2\n\
    ## 2     2 b     b       2.1\n## 3     3 c     c        13\n```\n\n如果存在标题行，但你想要重命名列，你不能仅仅通过\
    \ `col_names` 向 `read_csv` 提供名称。第一行仍然会被解释为数据。这会使第一行包含你不想要的数据，并且还会影响列的类型推断。\n\n\
    然而，你可以在 `read_csv` 将行解析为数据之前跳过一些行。由于 `data/data.csv` 中有一个标题行，我们可以跳过一次，并设置列名。\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"\
    W\"),\nskip =1,\nshow_col_types =FALSE\n)\n## # A tibble: 3 × 4\n##       X Y\
    \     Z         W\n##      \n## 1     1 a     a       1.2\n## 2     2 b     b\
    \       2.1\n## 3     3 c     c      13\n```\n\n你也可以使用 `n_max` 选项来限制要加载的数据行数。\n\
    \n```\nread_csv(\nfile =\"data/data.csv\",\ncol_names =c(\"X\",\"Y\",\"Z\",\"\
    W\"),\nskip =1,\nn_max =2,\nshow_col_types =FALSE\n)\n```\n\n如果你的输入文件包含注释行（可通过特定字符识别，该行后面的内容应视为注释），你可以通过提供\
    \ `comment` 选项来跳过它们：\n\n```\nread_csv(\n\"A, B, C,      D   # this is a comment\n\
    1, a, a,   1.2     # another comment\n2, b, b,   2.1\n3, c, c, 13.0\",\ncomment\
    \ =\"#\",\nshow_col_types =FALSE)\n## # A tibble: 3 × 4\n##       A B     C  \
    \       D\n##      \n## 1     1 a     a       1.2\n## 2     2 b     b       2.1\n\
    ## 3     3 c     c      13\n```\n\n你可以将整行都作为注释，但这样你需要让注释字符位于该行的最左侧：\n\n```\nread_csv(\n\
    \"A, B, C,   D   # this is a comment\n# whole line comment\n1, a, a,   1.2   #\
    \ another comment\n2, b, b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types\
    \ =FALSE)\n## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1\
    \     1 a     a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c  \
    \    13\n```\n\n如果在注释之前有空格，该函数无法判断是否存在错误——这看起来像是一行缺少了列，而不是一个空行——因此你会得到一个警告，并且注释行的位置会出现一个包含\
    \ `NA` 的行。\n"
- fmt: "```r\nread_csv(\n\"A, B, C,   D   # this is a comment\n# the indentation is\
    \ a potential problem; missing columns?\n1, a, a,   1.2   # another comment\n\
    2, b, b,   2.1\n3, c, c, 13.0\",\ncomment =\"#\",\nshow_col_types =FALSE\n)\n\
    ## Warning: One or more parsing issues, see\n## 'problems()' for details\n## #\
    \ A tibble: 4 × 4\n##       A B     C         D\n##      \n## 1    NA        NA\n\
    ## 2     1 a     a       1.2\n## 3     2 b     b       2.1\n## 4     3 c     c\
    \      13\n```\n\nFor more options affecting how input files are interpreted,\
    \ read the function documentation: `?read_csv`.\n\n## Column Types\n\nWhen `read_csv`\
    \ parses a file, it infers the type of each column. This inference can be slow,\
    \ or worse the inference can be incorrect. If you know *a priori* what the types\
    \ should be, you can specify this using the `col_types` option. If you do this,\
    \ then `read_csv` will not make a guess at the types. It will, however, replace\
    \ values that it cannot parse as of the right type into `NA`.^([³](#fn3))\n\n\
    ### String-Based Column Type Specification\n\nIn the simplest string specification\
    \ format, you must provide a string with the same length as you have columns and\
    \ where each character in the string specifies the type of one column. The characters\
    \ specifying different types are this:\n\n| Character | Type |\n| --- | --- |\n\
    | `c` | Character |\n| `i` | Integer |\n| `n` | Number |\n| `d` | Double |\n|\
    \ `l` | Logical |\n| `f` | Factor |\n| `D` | Date |\n| `T` | Datetime |\n| `t`\
    \ | Time |\n| `?` | Guess (default) |\n| `_/-` | Skip the column |\n\nBy default,\
    \ `read_csv` guesses, so we could make this explicit using the type specification\
    \ `\"????\"`:\n\n```r\nread_csv(\nfile =\"data/data.csv\",\ncol_types =\"????\"\
    \n)\n## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1      1\
    \ a    a       1.2\n## 2      2 b    b       2.1\n## 3      3 c    c      13\n\
    ```\n\nThe results of the guesses are double for columns `A` and `D` and character\
    \ for columns `B` and `C`. If we wanted to make this explicit, we could use `\"\
    dccd\"`.\n\n```r\nread_csv(\nfile =\"data/data.csv\",\ncol_types =\"dccd\"\n)\n\
    ## # A tibble: 3 × 4\n##       A B     C         D\n##      \n## 1     1 a   \
    \  a       1.2\n## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\
    \nIf you want an integer type for column `A`, you can use `\"iccd\"`:\n\n```r\n\
    read_csv(\nfile =\"data/data.csv\",\ncol_types =\"iccd\"\n)\n## # A tibble: 3\
    \ × 4\n##       A B     C         D\n##      \n## 1     1 a     a       1.2\n\
    ## 2     2 b     b       2.1\n## 3     3 c     c      13\n```\n\nIf you try to\
    \ interpret column `D` as integers as well, you will get a list of warning messages,\
    \ and the values in column D will all be `NA`; the numbers in column `D` cannot\
    \ be interpreted as integers, and `read_csv` will not round them to integers.\n\
    \n```r\nread_csv(\nfile =\"data/data.csv\",\ncol_types =\"icci\"\n)\n## Warning:\
    \ One or more parsing issues, see\n## 'problems()' for details\n## # A tibble:\
    \ 3 × 4\n##       A B     C         D\n##      \n## 1     1 a     a        NA\n\
    ## 2     2 b     b        NA\n## 3     3 c     c        NA\n```\n\nIf you specify\
    \ that a column should have type `d`, the numbers in the column must be integers\
    \ or decimal numbers. If you use the type `n` (the default that `read_csv` will\
    \ guess), you will also get doubles, but the latter type can handle strings that\
    \ can be interpreted as numbers such as dollar amounts, percentages, and group\
    \ separators in numbers. The column type `n` will ignore leading and trailing\
    \ text and handle number separators:\n\nWith this function call\n\n```r\nread_csv(\n\
    'A, B, C,   D,   E\n$1,a,a,1.2%,\"1,100,200\"\n$2,b,b,2.1%,\"140,000\"\n$3,c,c,13.0%,\"\
    2,005,000\"',\ncol_types =\"nccnn\"\n)\n## # A tibble: 3 × 5\n##       A B   \
    \  C         D        E\n##          \n## 1     1 a     a       1.2  1100200\n\
    ## 2     2 b     b       2.1   140000\n## 3     3 c     c      13    2005000\n\
    ```\n\ncolumns `A`, `D`, and `E` will be read as numbers. If you use the type\
    \ specification `d`, they would not, and all the values would be `NA`.\n\nThe\
    \ decimal indicator and group delimiter vary around the world. By default, `read_csv`\
    \ uses the US convention with a dot for decimal notation and comma for grouping\
    \ in numbers. In many European countries, it is the opposite. You can use the\
    \ `locale` option to change these:\n\n```r\nread_csv(\n'A, B, C,   D,   E\n$1,a,a,\"\
    \ 1,2%\",\"1.100.200\"\n$2,b,b,\" 2,1%\",\"   140.000\"\n$3,c,c,\"13,0%\",\"2.005.000\"\
    ',\nlocale=locale(decimal_mark =\",\",grouping_mark =\".\"),\ncol_types =\"nccnn\"\
    )\n## # A tibble: 3 × 5\n##       A B     C         D        E\n##          \n\
    ## 1     1 a     a       1.2  1100200\n## 2     2 b     b       2.1   140000\n\
    ## 3     3 c     c      13    2005000\n```"
