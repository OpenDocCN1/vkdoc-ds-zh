  trans: "\n# 其他管道操作\n\n`magrittr` 包中还有另外三个管道操作符。当你导入 `tidyverse` 包时，这些操作符并不会被自动导入，因此若要使用它们，你需要显式地导入\
    \ `magrittr`。\n\n```\nlibrary(magrittr)\n```\n\n`%<>%` 操作符用于执行一个以变量开头，并以将该变量的处理结果重新赋值给该变量为结尾的管道操作。以下代码：\n\
    \n```\nmydata %<>% pipeline()\n```\n\n等价于：\n\n```\nmydata <- mydata %>% pipeline()\n\
    ```\n\n这个重新赋值操作符的行为与我们在本章开头讨论的逐步赋值管道约定类似，但它明确表示我们正在更新一个已有的变量。这样你就不会意外地将结果赋值给另一个不同的变量。\n\
    \n如果你的右侧是一个花括号包围的表达式，你可以通过点变量（`.`）来引用输入：\n\n```\nmydata %<>% { .$x - .$y }\n##\
    \ [1] 0.3597903 1.8108120 2.3444173 3.1367824\n## [5] 0.2507438\n```\n\n如果像此处这样，输入是一个数据框，并且你想访问其列，你需要使用\
    \ `.$` 符号来访问它们。`%$%` 管道操作符为你打开了数据框，因此你可以直接通过列名来引用它们。\n\n```\nmydata %$% { x -\
    \ y }\n## [1] 0.3597903 1.8108120 2.3444173 3.1367824\n## [5] 0.2507438\n```\n\
    \n*三通*管道操作符 `%T>%` 的行为与常规管道操作符 `%>%` 类似，不同之处在于它返回的是其输入，而不是调用其右侧函数的结果。常规管道操作 `x\
    \ %>% f()` 会返回 `f(x)`，但三通管道操作 `x %T>% f()` 会调用 `f(x)` 但返回 `x`。这对于在管道内部调用具有副作用的函数非常有用，例如将中间结果保存到文件或绘制数据图表。\n\
    \n如果你在常规管道中调用一个函数，你会将该函数调用的结果传递给管道中的下一个函数。例如，如果你想绘制中间数据，但绘图函数可能不会返回该数据，那就不太走运了。`ggplot2`\
    \ 函数就不会（参见第 13 章）。\n\n如果你想绘制中间值，你需要将数据保存到一个变量中，保存它，然后以该数据作为输入开始一个新的管道。\n\n```\n\
    tidy_income %>% \n  pivot_longer(names_to = \"year\", values_to = \"mean_income\"\
    , !country)\n# 在继续处理之前汇总和可视化数据\nsummary(tidy_income)\nggplot(tidy_income, aes(x\
    \ = year, y = mean_income)) + geom_point()\n# 继续处理\ntidy_income |>\n  drop_na()\
    \ |>\n  write_csv(\"data/tidy-income.csv\")\n```\n\n使用三通操作符，你可以在调用绘图函数后继续管道操作。\n\
    \n```\nmydata %>%\n  pivot_longer(names_to = \"year\", values_to = \"mean_income\"\
    , !country) %T>%\n  # 汇总然后继续\n  { print(summary(.)) } %T>%\n  # 绘图然后继续\n  { print(ggplot(.,\
    \ aes(x = year, y = mean_income)) + geom_point()) } %>%\n  drop_na() %>% write_csv(\"\
    data/tidy-income.csv\")\n```\n\n脚注 1\n\n# 7. 函数式编程：purrr\n\n基于管道的数据处理方法需要采用函数式编程方法。毕竟，管道是函数的组合，而循环和变量赋值在管道中并不好用。你并非不能使用命令式编程，但你需要将其封装在函数中。\n\
    \n`purrr` 包使得函数式编程更加容易。与本书中的其他包一样，如果你导入 `tidyverse`，它会被加载，但你也可以显式地加载它：\n\n```\n\
    library(purrr)\n```\n\n我不会描述 `purrr` 包中的所有函数，因为数量很多，而且在我撰写本书到您阅读本书期间可能还会增加更多函数，但我会描述那些你可能经常使用的函数。\n\
    \n本章中的许多示例都非常简单，以至于你不会为此使用 `purrr`。许多都可以简化为向量表达式，而向量表达式既更易于阅读，计算速度也更快。然而，那些不能使用向量表达式的应用则更为复杂，我不希望示例掩盖了语法的本意。\n\
    \n## purrr 函数的一般特性\n\n`purrr` 包中的函数是“高阶”函数，这意味着这些函数要么将其他函数作为输入，要么在调用时返回函数（或两者皆有）。大多数函数将数据作为它们的第一个参数，并返回修改后的数据。因此，它们可以立即用于管道操作。作为额外的参数，它们会接受一个或多个函数，这些函数指定了你希望如何将输入转换为输出。\n\
    \n其他一些函数不转换数据，而是修改函数。使用它们是出于这样的目的：你无需为数据转换函数显式地编写函数；你可以使用一小部分函数，并在需要时对它们进行调整。\n\
    \n## 过滤\n\n最直接的函数式编程模式之一是过滤。在这里，你使用一个高阶过滤器函数。这个函数接受一个谓词函数，即一个返回逻辑值的函数，然后返回所有谓词求值为\
    \ `TRUE` 的元素（`keep()` 函数）或所有谓词求值为 `FALSE` 的元素（`discard()` 函数）。\n\n```\nis_even\
    \ <- function(x) x %% 2 == 0\n1:6 |> keep(is_even)\n## [1] 2 4 6\n1:6 |> discard(is_even)\n\
    ## [1] 1 3 5\n```\n\n当你处理谓词时，`negate()` 函数会派上用场。它会改变你谓词的真值，使得如果你的谓词 `p` 返回 `TRUE`，那么\
    \ `negate(p)` 返回 `FALSE`，反之亦然。\n\n```\n1:6 |> keep(negate(is_even))\n## [1] 1\
    \ 3 5\n1:6 |> discard(negate(is_even))\n## [1] 2 4 6\n```\n\n不过，由于你已经有 `keep()`\
    \ 和 `discard()` 这对互补函数，你通常不会为了过滤而使用 `negate()`。\n\n一个特例函数 `compact()` 用于从列表中移除\
    \ `NULL` 元素。\n\n```\ny <- list(1:3, NULL, 1:3) |> compact()\n## [[1]]\n## [1]\
    \ 1 2 3\n```\n\n如果你访问对象上的属性，而这些属性未被设置，R 会返回 `NULL` 结果，在这种情况下，`compact()` 非常有用。\n\
    \n如果我们定义列表：\n\n```\nx <- y <- 1:3\nnames(y) <- c(\"one\", \"two\", \"three\")\n\
    ```\n\n那么 `y` 的值将具有名称，而 `x` 则没有。如果我们尝试从 `x` 获取名称，我们将得到 `NULL`。\n\n```\nnames(x)\n\
    ## NULL\nnames(y)\n## [1] \"one\"   \"two\"   \"three\"\n```\n\n将 `compact()`\
    \ 与 `names()` 一起使用，我们将丢弃 `x`。\n\n```\nz <- list(x, y) |> compact(names)\n## $y\n\
    ##   one   two   three\n##     1     2       3\n```\n"
- fmt: "## Mapping\n\nMapping a function *f* over sequences *x* = *x* [1], *x* [2],\
    \ …, *x* [*n*] returns a new sequence of the same length as the input but where\
    \ each element is an application of the function: *f*(*x* [1]), *f*(*x* [2]),\
    \ …, *f*(*x* [*n*]).\n\nThe function`map()` does this and returns a`list` as output.\
    \ Lists are the generic sequence data structure in R since they can hold all types\
    \ of R objects.\n\n```\nis_even <- function(x) x %% 2 == 0\nlist(1, 2, 3, 4) |>\
    \ map(is_even)\n## [[1]]\n## [1] FALSE\n##\n## [[2]]\n## [1] TRUE\n##\n## [[3]]\n\
    ## [1] FALSE\n##\n## [[4]]\n## [1] TRUE\n```\n\nOften, we want to work with vectors\
    \ of specific types. For all the atomic types,`purrr` has a specific mapping function.\
    \ The function for logical values is named`map_lgl()`.\n\n```\n1:4 |> map_lgl(is_even)\n\
    ## [1] FALSE TRUE FALSE TRUE\n```\n\nWith something as simple as this example,\
    \ you should not use`purrr`. Vector expressions are faster and easier to use.\n\
    \n```\n1:4 %% 2 == 0\n## [1] FALSE TRUE FALSE TRUE\n```\n\nYou cannot always use\
    \ vector expressions, however. Say you want to sample *n* elements from a normal\
    \ distribution, for a sequence of different *n* values, and then calculate the\
    \ standard error of the mean. The vector expression\n\n```\nsd(rnorm(n = n)) /\
    \ sqrt(n) # not SEM!\n```\n\ndoes not compute this. If you give`rnorm()` a sequence\
    \ for its`n` parameter, it takes the *length* of the input as the number of elements\
    \ to sample.\n\n```\nn <- seq.int(100, 1000, 300) # the different n value we want\n\
    n\n## [1]  100  400  700 1000\n# Are we sampling for each of our n values?\nrnorm(n)\
    \ # no, but length(n) is used for the number of samples in rnorm()\n## [1]  0.6691846\
    \ -0.4554893 -0.8175801  1.7794664\n```\n\nWhen you have a function that is not\
    \ vectorized, you can use a map function to apply it on all elements in a list.\n\
    \n```\nsem <- function(x) sd(x) / sqrt(length(x))\nlist(1:10, 100:110, 20:30,\
    \ 50:70) |> map_dbl(sem)\n## [1] 0.10197308 0.05138140 0.03673840 0.03057261\n\
    ```\n\nHere, I used`map_dbl()` to get doubles (numerics) as output. The functions`map_chr()`\
    \ and`map_int()` will give you strings and integers instead.\n\n```\n1:3 %>% map_dbl(identity)\
    \ %T>% print() %>% class()\n## [1] 1 2 3\n## [1] \"numeric\"\n1:3 %>% map_chr(identity)\
    \ %T>% print() %>% class()\n## [1] \"1\" \"2\" \"3\"\n## [1] \"character\"\n1:3\
    \ %>% map_int(identity) %T>% print() %>% class()\n## [1] 1 2 3\n## [1] \"integer\"\
    \n```\n\nThe different map functions will give you an error if the function you\
    \ apply does not return values of the type the function should. Sometimes, a map\
    \ function will do type conversion, as before, but not always. It will usually\
    \ be happy to convert in a direction that doesn't lose information, for example,\
    \ from logical to integer and integer to double, but not in the other direction.\n\
    \nFor example,`map_lgl()` will not convert from integers to logical if you give\
    \ it the`identity()` function, even though you can convert these types. Similarly,\
    \ you can convert strings to integers using`as.numeric()`, but`map_dbl()` will\
    \ not do so if we give it`identity()`. The mapping functions are more strict than\
    \ the base R conversion functions. So you should use functions that give you the\
    \ right type.\n\nThe`map_dfr()` and`map_dfc()` functions return data frames (tibbles).\
    \ The function you map should return data frames, and these will be combined,\
    \ row-wise with`map_dfr()` and column-wise with`map_dfc()`.\n\n```\nx <- list(a\
    \ = 1:2, b = 3:4)\nx |> map_dfr(identity)\n## # A tibble: 4 × 2\n##       a  \
    \   b\n##    <int> <int>\n## 1     1     3\n## 2     2     4\n## 3     1     3\n\
    ## 4     2     4\nlist(a = x, b = x) |> map_dfc(identity)\n## New names:\n## ·\
    \ `a` -> `a...1`\n## · `b` -> `b...2`\n## · `a` -> `a...3`\n## · `b` -> `b...4`\n\
    ## # A tibble: 2 × 4\n##   a...1  b...2  a...3  b...4\n##   <int> <int>  <int>\
    \  <int>\n## 1     1     3     1     3\n## 2     2     4     2     4\n```\n\n\
    The`map_df()` function does the same as`map_dfr()`:\n\n```\nlist(a = x, b = x)\
    \ |> map_df(identity)\n## # A tibble: 4 × 2\n##       a     b\n##    <int> <int>\n\
    ## 1     1     3\n## 2     2     4\n## 3     1     3\n## 4     2     4\n```\n\n\
    You do not need to give the data frame functions data frames as input, as long\
    \ as the function you apply to the input returns data frames. This goes for all\
    \ the map functions. They will accept any sequence input; they only restrict and\
    \ convert the output.\n\nIf the items you map over are sequences themselves, you\
    \ can extract elements by index; you do not need to provide a function to the\
    \ map function.\n\n```\nx <- list(c(1, 2, 3), c(4, 5, 6))\nx |> map_dbl(1)\n##\
    \ [1] 1 4\nx |> map_dbl(3)\n## [1] 3 6\n```\n\nIf the items have names, you can\
    \ also extract values using these.\n\n```\nx <- list(a = c(a = 42, b = 13), b\
    \ = c(a = 24, b = 31))\nx |> map_dbl(\"a\")\n## [1] 42 24\nx |> map_dbl(\"b\"\
    )\n## [1] 13 31\n```\n\nThis is mostly used when you map over data frames.\n\n\
    ```\na <- data.frame(foo = 1:3, bar = 11:13)\nb <- data.frame(foo = 4:6, bar =\
    \ 14:16)\nab <- list(a = a, b = b)\nab |> map(\"foo\")\n## $a\n## [1] 1 2 3\n\
    ##\n## $b\n## [1] 4 5 6\n```\n\nRelated to extracting elements by name or index,\
    \ you can apply functions to different depths of the input using`map_depth()`.\
    \ Depth zero is the list itself, so mapping over this depth is the same as applying\
    \ the function directly on the input.\n\n```\nab |> map_depth(0, length)\n## [1]\
    \ 2\nab |> length()\n## [1] 2\n```\n\nDepth 1 gives us each element in the sequence,\
    \ so this behaves like a normal map. Depth 2 provides us with a map over the nested\
    \ elements. Consider the list`ab` earlier. The top level, depth 0, is the list.\
    \ Depth 1 is the data frames`a` and`b`. Depth 2 is the columns in these data frames.\
    \ Depth 3 is the individual items in these columns.\n\n```\nab |> map_depth(1,\
    \ sum) |> unlist()\n##  a  b\n## 42 60\nab |> map_depth(2, sum) |> unlist()\n\
    ## a.foo a.bar b.foo b.bar\n##     6    36    15    45\nab |> map_depth(3, sum)\
    \ |> unlist()\n## a.foo1 a.foo2 a.foo3 a.bar1 a.bar2 a.bar3 b.foo1\n##      1\
    \      2      3     11     12     13      4\n## b.foo2 b.foo3 b.bar1 b.bar2 b.bar3\n\
    ##      5      6     14     15     16\n```\n\nIf you only want to apply a function\
    \ to some of the elements, you can use`map_if()`. It takes a predicate and a function\
    \ and applies the function to those elements where the predicate is true. It returns\
    \ a list, but you can convert it if you want another type.\n\n```\nis_even <-\
    \ function(x) x %% 2 == 0\nadd_one <- function(x) x + 1\n1:6 |> map_if(is_even,\
    \ add_one) |> as.numeric()\n## [1] 1 3 3 5 5 7\n```\n\nNotice that this is different\
    \ from combining filtering and mapping; that combination would remove the elements\
    \ that do not satisfy the predicate.\n\n```\n1:6 |> keep(is_even) |> map_dbl(add_one)\n\
    ## [1] 3 5 7\n```\n\nWith`map_if()`, you keep all elements, but the function is\
    \ only applied to some of them.\n\nIf you want to apply one function to the elements\
    \ where the predicate is true and another to the elements where it is false, you\
    \ can provide a function to the`.else` element:\n\n```\nadd_two <- function(x)\
    \ x + 2\n1:6 |>\n  map_if(is_even, add_one, .else = add_two) |>\n  as.numeric()\n\
    ## [1] 3 3 5 5 7 7\n```\n\nIf you know which indices you want to apply the function\
    \ to, instead of a predicate they must satisfy, you can use`map_at()`. This function\
    \ takes a sequence of indices instead of the predicate but otherwise works the\
    \ same as`map_if()`.\n\n```\n1:6 |> map_at(2:5, add_one) |> as.numeric()\n## [1]\
    \ 1 3 4 5 6 6\n```\n\nIf you map over a list,`x`, then your function will be called\
    \ with the elements in the list,`x[[i]]`. If you want to get the elements wrapped\
    \ in a length-one list, that is, use indexing`x[i]`, you can use`lmap()`.\n\n\
    ```\nlist(a = 1:3, b = 4:6) |> map(print) |> invisible()\n## [1] 1 2 3\n## [1]\
    \ 4 5 6\nlist(a = 1:3, b = 4:6) |> lmap(print) |> invisible()\n## $a\n## [1] 1\
    \ 2 3\n##\n## $b\n## [1] 4 5 6\n```\n\nThe function you apply must always return\
    \ a list, and`lmap()` will concatenate them.\n\n```\nf <- function(x) list(\"\
    foo\")\nlist(a = 1:3, b = 4:6) |> lmap(f)\n## [[1]]\n## [1] \"foo\"\n##\n## [[2]]\n\
    ## [1] \"foo\"\nf <- function(x) if (x[[1]] == 1) list(\"foo\") else list(\"bar\"\
    )\nlist(1:3, 4:6) |> lmap(f)\n## [[1]]\n## [1] \"foo\"\n##\n## [[2]]\n## [1] \"\
    bar\"\n##\n## [[3]]\n## [1] \"foo\"\n##\n## [[4]]\n## [1] \"bar\"\n```\n\nFor\
    \ example, while you can get the length of elements in a list using`map()` and`length()`\n\
    \n```\nlist(a = 1:3, b = 4:8) |> map(length) |> unlist()\n## a b\n## 3 5\n```\n\
    \nyou will get an error if you try the same using`lmap()`. This is because`length()`\
    \ returns a numeric and not a list. You need to wrap`length()` with`list()` so\
    \ the result is the length in a (length one) list."
