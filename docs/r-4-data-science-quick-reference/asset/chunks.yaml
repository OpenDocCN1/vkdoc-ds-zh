- fmt: "当你进行汇总时，会移除你创建的最后一个分组——因为该汇总在每个组中本来就只剩下一行数据，所以它不再有用——但其他分组会保留。这在早期版本的`dplyr`中是默认行为，至今仍是，但这也是一个常见的错误来源。一些数据科学家期望这种分组保留行为，另一些则期望所有分组都被移除，如果你的预期未被满足，后续分析很可能出错；如果你认为自己正在对整个数据集进行操作，但所有操作都按一个或多个变量分组，那么你很可能会得到不期望的结果。\n\
    \n因此，`summarise()`现在引入了参数`.groups`，你可以在其中指定所需的行为。目前该参数还不是必须的，因为那会破坏大量现有代码的向后兼容性，但你会在后面看到我们之前提到的关于使用它的提示信息。\n\
    \n```\n# 删除我们创建的最后一个分组\ndf |> group_by(x_category, y_category) |>\nsummarise(mean_x\
    \ = mean(x), mean_y = mean(y), .groups = \"drop_last\") |>\ngroup_vars()\n## [1]\
    \ \"x_category\"\n# 删除所有分组\ndf |> group_by(x_category, y_category) |>\nsummarise(mean_x\
    \ = mean(x), mean_y = mean(y), .groups = \"drop\") |>\ngroup_vars()\n## character(0)\n\
    # 保留所有分组\ndf |> group_by(x_category, y_category) |>\nsummarise(mean_x = mean(x),\
    \ mean_y = mean(y), .groups = \"keep\") |>\ngroup_vars()\n## [1] \"x_category\"\
    \ \"y_category\"\n```\n\n如果你的数据已经分组，或者像之前一样从一个汇总中得到了分组数据，你可以使用`ungroup()`再次移除分组。完成此操作后，就可以重新计算全局汇总了。\n\
    \n```\ndf |> group_by(x_category, y_category) |>\nungroup() |> # 移除分组\ngroup_vars()\n\
    ## character(0)\n```\n\n分组不仅在收集数据汇总时有用。你还可以使用`mutate()`基于分组计算，向数据框中添加列：\n\n```\n\
    df |> group_by(x_category) |>\nmutate(mean_x = mean(x), mean_y = mean(y)) |>\n\
    ungroup() |>\nprint(n = 5)\n## # A tibble: 100 × 6\n##        x         y x_category\
    \ y_category mean_x\n##                       \n## 1 -0.416   -0.374  medium \
    \    medium      0.123\n## 2 -0.845   -1.21   medium     medium      0.123\n##\
    \ 3 -0.0176   0.103  medium     medium      0.123\n## 4 -1.18    -0.0132 medium\
    \     medium      0.123\n## 5  0.508    0.504  medium     medium      0.123\n\
    ## # . . . with 95 more rows, and 1 more variable:\n## #   mean_y \n```\n\n当你先计算汇总再进行`mutate`时，会创建一些列，其中汇总参数基于分组取值，但这些值会与现有数据组合，而不是像`summarise()`那样提取为一个新的数据框。\n\
    \n没有`group_by()`的`mutate()`将为整个数据集提供汇总值。\n\n```\ndf |> mutate(mean_x = mean(x),\
    \ mean_y = mean(y)) |> # 计算整个数据的 x 和 y 均值\ndistinct(mean_x, mean_y)          \
    \            # 获取唯一值以便打印\n## # A tibble: 1 × 2\n##   mean_x mean_y\n##      \n\
    ## 1 0.0895 0.0520\n```\n\n我使用了`distinct()`来获取`mean_x`和`mean_y`组合的唯一值，这能很好地说明结果。这里只有一行值，这是因为我们计算的是整个数据集的均值，而不是针对数据的不同分组。\n\
    \n相反，如果在向数据添加变量之前进行分组，那么汇总就是按组计算的。\n\n```\ndf |> group_by(x_category) |>     \
    \                  # 仅按 x_category 分组\nmutate(mean_x = mean(x), mean_y = mean(y))\
    \ |> # 计算每个 x 组的均值和\ndistinct(mean_x, mean_y)                      # 获取唯一值以便打印\n\
    ## # A tibble: 3 × 3\n## # Groups:   x_category [3]\n##   x_category mean_x  mean_y\n\
    ##             \n## 1 medium      0.123  0.0631\n## 2 large       2.08   1.33\n\
    ## 3 small      -2.55  -1.12\n```\n\n这里，针对不同的`x_category`因子有不同的值，表明我们计算了数据中每个不同`x_category`的均值。\n\
    \n如果你在分组之前计算全局汇总，可以将整个数据范围的汇总与分组汇总结合起来。\n\n```\ndf |> mutate(mean_y = mean(y))\
    \ |> # 获取所有数据点的 y 均值\ngroup_by(x_category)     |> # 然后分组，以便后续操作按组进行\nmutate(mean_x\
    \ = mean(x)) |> # 获取每个组的 x 均值（不是全局的）\ndistinct(mean_x, mean_y)    # 获取唯一值以便打印结果\n\
    ## # A tibble: 3 × 3\n## # Groups:    x_category [3]\n##   x_category mean_y \
    \ mean_x\n##             \n## 1 medium     0.0520   0.123\n## 2 large      0.0520\
    \   2.08\n## 3 small      0.0520  -2.55\n```\n\n注意，输出行中的`mean_y`值是相同的；这是因为我们计算的是全局均值，而不是每个组的均值。\n\
    \n如果你需要根据不同分组计算汇总，例如，分别计算每个`x_category`的`x`均值以及每个`y_category`的`y`均值，那么你可以先调用`group_by(x_category)`来汇总`x`，接着调用`group_by(y_category)`来更改分组以便汇总`y`。\n\
    \n```\ndf |> group_by(x_category) |>\nmutate(mean_x = mean(x)) |>\ngroup_by(y_category)\
    \ |>\nmutate(mean_y = mean(y)) |>\ndistinct(\nx_category, mean_x,\ny_category,\
    \ mean_y\n)\n## # A tibble: 5 × 4\n## # Groups: y_category [3]\n##   x_category\
    \ y_category mean_x mean_y\n##                  \n## 1 medium   medium    0.123\
    \      0.127\n## 2 medium   small     0.123     -2.38\n## 3 large    medium  \
    \  2.08       0.127\n## 4 medium   large     0.123      2.69\n## 5 small    medium\
    \   -2.55       0.127\n```"
  raw: "When you summarize, you remove the last grouping you created—the summary only\
    \ has one row per value in that group anyway, so it isn’t useful any longer—but\
    \ the other groups remain. This was the default behavior in early versions of\
    \ `dplyr`, and still is, but is a common source of errors. Some data scientists\
    \ expect this behavior, others expect that all groups are removed, and if your\
    \ expectations are not met, there is a good chance that the following analysis\
    \ will be wrong; if you think you are working on the data as a whole, but all\
    \ operations are grouped by one or more variables, you are unlikely to get the\
    \ results that you want.\n\nBecause of this, `summarise()` now takes the argument\
    \ `.groups` where you can specify the behavior you want. It is not yet required,\
    \ since that would break backward compatibility to a lot of code, but you get\
    \ the message about using it that we saw a little while up.\n\n```\n# Drop the\
    \ last group we made\ndf |> group_by(x_category, y_category) |>\nsummarise(mean_x\
    \ = mean(x), mean_y = mean(y), .groups = \"drop_last\") |>\ngroup_vars()\n## [1]\
    \ \"x_category\"\n# Drop all groups\ndf |> group_by(x_category, y_category) |>\n\
    summarise(mean_x = mean(x), mean_y = mean(y), .groups = \"drop\") |>\ngroup_vars()\n\
    ## character(0)\n# Keep all groups\ndf |> group_by(x_category, y_category) |>\n\
    summarise(mean_x = mean(x), mean_y = mean(y), .groups = \"keep\") |>\ngroup_vars()\n\
    ## [1] \"x_category\" \"y_category\"\n```\n\nIf you have grouped your data, or\
    \ you get grouped data from one summary as before, you can remove the groups again\
    \ using `ungroup()` . Once you have done this, you can compute global summaries\
    \ again.\n\n```\ndf |> group_by(x_category, y_category) |>\nungroup() |> # Remove\
    \ the grouping again\ngroup_vars()\n## character(0)\n```\n\nGrouping is not only\
    \ useful when collecting summaries of your data. You can also add columns to your\
    \ data frame based on per-group computations using `mutate()` :\n\n```\ndf |>\
    \ group_by(x_category) |>\nmutate(mean_x = mean(x), mean_y = mean(y)) |>\nungroup()\
    \ |>\nprint(n = 5)\n## # A tibble: 100 × 6\n##        x         y x_category y_category\
    \ mean_x\n##                       \n## 1 -0.416   -0.374  medium     medium \
    \     0.123\n## 2 -0.845   -1.21   medium     medium      0.123\n## 3 -0.0176\
    \   0.103  medium     medium      0.123\n## 4 -1.18    -0.0132 medium     medium\
    \      0.123\n## 5  0.508    0.504  medium     medium      0.123\n## # . . . with\
    \ 95 more rows, and 1 more variable:\n## #   mean_y \n```\n\nWhen you calculate\
    \ a summary and then mutate, you create columns where a summary parameter takes\
    \ values based on the groupings, but they are combined with the existing data\
    \ rather than extracted as a new data frame as `summarise()` would do.\n\nA `mutate()`\
    \ without a `group_by()` will give you summaries for the entire data.\n\n```\n\
    df |> mutate(mean_x = mean(x), mean_y = mean(y)) |> # Calculate mean x and y for\
    \ entire data\ndistinct(mean_x, mean_y)                      # Get unique values\
    \ for printing\n## # A tibble: 1 × 2\n##   mean_x mean_y\n##      \n## 1 0.0895\
    \ 0.0520\n```\n\nI have used `distinct()` to get the unique values of `r mean_x`\
    \ and `mean_y` combinations, as this well illustrate the result. Here, we only\
    \ have one row of values, and this is because we have computed the mean values\
    \ for the entire data set and not for different groupings of the data.\n\nIn contrast,\
    \ if you group before adding variables to the data, then the summaries are per\
    \ group.\n\n```\ndf |> group_by(x_category) |>                       # Group by\
    \ x categories only\nmutate(mean_x = mean(x), mean_y = mean(y)) |> # Calculate\
    \ mean x and y for each x group\ndistinct(mean_x, mean_y)                    \
    \  # Get unique values for printing\n## # A tibble: 3 × 3\n## # Groups:   x_category\
    \ [3]\n##   x_category mean_x  mean_y\n##             \n## 1 medium      0.123\
    \  0.0631\n## 2 large       2.08   1.33\n## 3 small      -2.55  -1.12\n```\n\n\
    Here, there are values for different `x_category` factors, showing us that we\
    \ have computed means for each different `x_category` in the data.\n\nYou can\
    \ combine data-wide summaries with grouped summaries if you calculate the global\
    \ summaries before you group.\n\n```\ndf |> mutate(mean_y = mean(y)) |> # Get\
    \ the mean for y over all data points\ngroup_by(x_category)     |> # Then group\
    \ so the following works per group\nmutate(mean_x = mean(x)) |> # Get the mean\
    \ x for each group (not globally)\ndistinct(mean_x, mean_y)    # Get the unique\
    \ values so we can print the result\n## # A tibble: 3 × 3\n## # Groups:    x_category\
    \ [3]\n##   x_category mean_y  mean_x\n##             \n## 1 medium     0.0520\
    \   0.123\n## 2 large      0.0520   2.08\n## 3 small      0.0520  -2.55\n```\n\
    \nNotice that the `mean_y` values are the same in the output rows; this is because\
    \ we have computed the mean globally and not for each group.\n\nIf you need to\
    \ compute summaries with different groups, for example, the mean of `x` for each\
    \ `x_category` as well as the mean of `y` for each `y_category`, then you can\
    \ call `group_by(x_category)` for summarizing `x`, followed by `group_by(` `y_category)`\
    \ for changing the grouping so you can summarize `y`.\n\n```\ndf |> group_by(x_category)\
    \ |>\nmutate(mean_x = mean(x)) |>\ngroup_by(y_category) |>\nmutate(mean_y = mean(y))\
    \ |>\ndistinct(\nx_category, mean_x,\ny_category, mean_y\n)\n## # A tibble: 5\
    \ × 4\n## # Groups: y_category [3]\n##   x_category y_category mean_x mean_y\n\
    ##                  \n## 1 medium   medium    0.123      0.127\n## 2 medium  \
    \ small     0.123     -2.38\n## 3 large    medium    2.08       0.127\n## 4 medium\
    \   large     0.123      2.69\n## 5 small    medium   -2.55       0.127\n```"
