    # 1. Introduction


    R is a functional programming language with a focus on statistical analysis. It
    has built-in support for model specifications that can be manipulated as first-class
    objects, and an extensive collection of functions for dealing with probability
    distributions and model fitting, both built-in and through extension packages.


    The language has a long history. It was created in 1992 and is based on an even
    older language, S, from 1976. Many quirks and inconsistencies have entered the
    language over the years. There are, for example, at least three partly incompatible
    ways of implementing object orientation, and one of these is based on a naming
    convention that clashes with some built-in functions. It can be challenging to
    navigate through the many quirks of R, but this is alleviated by a suite of extensions,
    collectively known as the “Tidyverse.”


    While there are many data science applications that involve more complex data
    structures, such as graphs and trees, most bread-and-butter analyses involve rectangular
    data. That is, the analysis is of data that can be structured as a table of rows
    and columns where, usually, the rows correspond to observations and the columns
    correspond to explanatory variables and observations. The usual data sets are
    also of a size that can be loaded into memory and analyzed on a single desktop
    or laptop. I will assume that both are the case here. If this is not the case,
    then you need different, big data techniques that go beyond the scope of this
    book.


    The Tidyverse is a collection of extensions to R: packages that are primarily
    aimed at analyzing tabular data that fits into your computer''s memory. Some of
    the packages go beyond this, but since data science is predominately manipulation
    of tabular data, this is the focus of this book.


    The Tidyverse packages provide consistent naming conventions, consistent programming
    interfaces, and more importantly a consistent notation that captures how data
    analysis consists of different steps of data manipulation and model fitting.


    The packages do not merely provide collections of functions for manipulating data
    but rather small domain-specific languages for different aspects of your analysis.
    Almost all of these small languages are based on the same overall “pipeline” syntax
    introduced with the `magrittr` package. The package introduces a syntax for sending
    the output of one function call into another function call. It provides various
    operators for this, but the most frequently used is `%>%` that gives you an alternative
    syntax for writing function calls:


    ```

    x %>% f() %>% g()

    ```


    is equivalent to


    ```

    g(f(x))

    ```


    This syntax was deemed so useful that a similar operator was introduced into the
    main R language in version 4.1, `|>`, so you will now also see syntax such as


    ```

    x |> f() |> g()

    ```


    I will, when it is convenient, use the built-in pipe operator `|>` in code examples,
    but I will leave `magrittr` syntax until after Chapter [6](#476587_2_En_6_Chapter.xhtml)
    where I describe the `magrittr` package.


    The two operators are not identical, and I will highlight a few differences in
    Chapter [6](#476587_2_En_6_Chapter.xhtml). They differ in a few ways, but you
    can use either with the Tidyverse packages, and they are usually designed with
    the assumption that you use the packages that way.


    A noticeable exception is the plotting library `ggplot2`. It is slightly older
    than the other extensions in the Tidyverse and because of this has a different
    syntax. The main difference is the operator used for combining different operations.
    The data pipeline notation uses the `%>%` or `|>` operator, while `ggplot2` combines
    plotting instructions using `+`. If you are like me, then you will often try to
    combine `ggplot2` instructions using `%>%`—just out of habit—but once you get
    an error from R, you will recognize your mistake and can quickly fix it.


    This book is a syntax reference for modern data science in R, which means that
    it is a guide for using Tidyverse packages and it is a guide for programmers who
    want to use R’s Tidyverse packages instead of basic R programming. I will assume
    that you are familiar with base R and the functions there, or at least that you
    can read the documentation for these, for example, when you want to know how the
    function `read.table()` behaves, you type `?read.table` into your R console. I
    will mention base R functions in the text when they differ from similar functionality
    in the Tidyverse functions. This will warn you if you are familiar with the base
    R functions and might have code that uses them that you want to port to Tidyverse
    code. If you are not familiar with base R and want a reference for the core R
    language, you might wish to read the book *R Quick Syntax Reference* by Margot
    Tollefson instead.


    This guide does not explain each Tidyverse package exhaustively. The development
    of Tidyverse packages progresses rapidly, and the book would not contain a complete
    guide shortly after it is printed anyway. The structure of the extensions and
    the domain-specific languages they provide are stable, however, and from examples
    with a subset of the functionality in them, you should not have any difficulties
    with reading the package documentation for each of them and find the features
    you need that are not covered in the book.


    To get started with the Tidyverse, install and load it:


    ```

    install.packages("tidyverse")

    library(tidyverse)

    ```


    The Tidyverse consists of many packages that you can install and load independently,
    but loading all through the `tidyverse` package is the easiest, so unless you
    have good reasons to, for example, that you need a package that isn’t automatically
    loaded, just load `tidyverse` when you start an analysis. In this book, I describe
    three packages that are not loaded from `tidyverse` but are generally considered
    part of the Tidyverse.^([¹](#fn1))


