  trans: "如果您想保留中间两行，但不要第一行或最后一行，可以编写一个更复杂的谓词，并使用 `filter_all()`。\n\n```\ndf |> filter_all(all_vars(is.na(.)\
    \ | . > 3))\n## # 一个 tibble：2 × 3\n##       A     B     C\n##     \n## 1     4\
    \     5    NA\n## 2    11    12    13\n```\n\n你需要使用向量“或”运算符 `|`。表达式必须是向量表达式，因此不能使用\
    \ `||`。\n\n许多 `dplyr` 函数都有 `_all`、`_at` 和 `_if` 变体，但此处我仅描述常用的函数。其他函数请参考软件包文档。\n\
    \n## 排序\n\n如果要按选定列的值对行进行排序，所需的函数是 `arrange()`。你可以按一列或多列排序：\n\n```\niris_df |>\n\
    arrange(Petal.Length) |>\nprint(n = 5)\n## # 一个 tibble：150 × 5\n##   Sepal.Length\
    \ Sepal.Width Petal.Length\n##                         \n## 1          4.6   \
    \      3.6          1\n## 2          4.3         3            1.1\n## 3      \
    \    5.8         4            1.2\n## 4          5           3.2            1.2\n\
    ## 5          4.7         3.2          1.3\n## # . . . 还有 145 行，以及 2 个更多变量：\n\
    ## # Petal.Width , Species \niris_df |>\narrange(Sepal.Length, Petal.Length) |>\n\
    print(n = 5)\n## # 一个 tibble：150 × 5\n##   Sepal.Length Sepal.Width Petal.Length\n\
    ##                         \n## 1          4.3         3            1.1\n## 2\
    \          4.4         3            1.3\n## 3          4.4         3.2       \
    \   1.3\n## 4          4.4         2.9          1.4\n## 5          4.5       \
    \  2.3          1.3\n## # . . . 还有 145 行，以及 2 个更多变量：\n## # Petal.Width , Species\
    \ \n```\n\n如果要按降序排序，可以使用函数 `desc()`。\n\n```\niris_df |>\narrange(desc(Petal.Length))\
    \ |>\nprint(n = 5)\n## # 一个 tibble：150 × 5\n##   Sepal.Length Sepal.Width Petal.Length\n\
    ##                         \n## 1          7.7         2.6          6.9\n## 2\
    \          7.7         3.8          6.7\n## 3          7.7         2.8       \
    \   6.7\n## 4          7.6         3            6.6\n## 5          7.9       \
    \  3.8          6.4\n## # . . . 还有 145 行，以及 2 个更多变量：\n## # Petal.Width , Species\
    \ \n```\n\n## 修改数据框\n\n在处理数据框时，我们通常希望根据表中的变量（列）计算值。仅靠筛选行和列是不够的。\n\n`mutate()`\
    \ 函数允许我们根据涉及任何现有列的表达式，向数据框添加新列。考虑一个包含宽度和高度的表格。\n\n```\ndf <- tribble(\n~height,\
    \ ~width,\n10,     12,\n42,     24,\n14,     12\n)\n```\n\n我们可以使用 `mutate()` 和以下表达式添加一个面积列：\n\
    \n```\ndf |> mutate(area = height * width)\n## # 一个 tibble：3 × 3\n##   height\
    \  width  area\n##       \n## 1     10     12   120\n## 2     42     24  1008\n\
    ## 3     14     12   168\n```\n\n如果向数据框添加列，可以引用已经添加的变量。例如，如果高度和宽度数据以英寸为单位，而你想转换为厘米，并且还想要平方厘米的面积，可以这样做：\n\
    \n```\ncm_per_inch <- 2.54\ndf |> mutate(\nheight_cm = cm_per_inch * height,\n\
    width_cm = cm_per_inch * width,\narea_cm = height_cm * width_cm\n)\n## # 一个 tibble：3\
    \ × 5\n##   height width height_cm width_cm area_cm\n##                 \n## 1\
    \     10    12       25.4      30.5  774.\n## 2     42    24      107\\.     \
    \  61.0 6503.\n## 3     14    12       35.6      30.5 1084.\n```\n\n然而，以下表达式将无法工作，因为你无法在\
    \ `mutate()` 调用中引用稍后添加的变量：\n\n```\ndf %>% mutate(\narea_cm = height_cm * width_cm,\n\
    height_cm = cm_per_inch * height,\nwidth_cm = cm_per_inch * width\n)\n## Error\
    \ in `mutate()`:\n## ! 计算 `area_cm = height_cm * width_cm` 时出现问题。\n## 由以下错误引起：\n\
    ## ! 找不到对象 'height_cm'\n```\n\n如果不为新变量命名，即调用 `mutate()` 时不使用命名参数，那么表达式将成为变量名：\n\
    \n```\ndf |> mutate(cm_per_inch * height)\n## # 一个 tibble：3 × 3\n##   height width\
    \ `cm_per_inch * height`\n##                       \n## 1     10    12       \
    \            25.4\n## 2     42    24                  107.\n## 3     14    12\
    \                   35.6\n```\n\n在此示例中，单位（英寸和厘米）未与数据一起编码，在未来的计算中可能会混淆不同的单位。如果使用\
    \ `units` 包（不属于 Tidyverse），可以显式指定单位，在合理的情况下自动进行单位转换，并且还能获得单位类型安全性作为额外好处。\n\n```\n\
    library(units)\ndf |> mutate(\nheight_in = units::as_units(height, \"in\"),\n\
    width_in = units::as_units(width, \"in\"),\narea_in = height_in * width_in,\n\
    height_cm = units::set_units(height_in, \"cm\"),\nwidth_cm = units::set_units(width_in,\
    \ \"cm\"),\narea_cm = units::set_units(area_in, \"cmˆ2\")\n)\n## # 一个 tibble：3\
    \ × 8\n##   height width height_in width_in area_in\n##            [in]     [in]\
    \ [in²]\n## 1     10    12        10        12    120\n## 2     42    24     \
    \   42        24   1008\n## 3     14    12        14        12   168\n## # . .\
    \ . 还有 3 个更多变量：height_cm [cm],\n## # width_cm [cm], area_cm [cm²]\n```\n\n这是可行的，因为\
    \ tibble 可以包含各种类型的类，`units` 包正是利用了这一点。Tibble 使用一个接口，允许你定义自己的类应如何显示，但这超出了本书的范围。\n\
    \n之前，我们为原始数据表创建了携带单位的值，但原始的高度和宽度列仍然存在。我们可以使用 `select()` 来移除它们，但函数 `transmute()`\
    \ 已经为我们完成了这项工作。"
- fmt: "```r\ndf %>% transmute(\n  height_in = units::as_units(height, \"in\"),\n\
    \  width_in = units::as_units(width, \"in\"),\n  area_in = height_in * width_in,\n\
    \  height_cm = units::set_units(height_in, \"cm\"),\n  width_cm = units::set_units(width_in,\
    \ \"cm\"),\n  area_cm = units::set_units(area_in, \"cm^2\")\n)\n## # A tibble:\
    \ 3 × 6\n##   height_in width_in area_in height_cm width_cm\n##         [in] \
    \    [in]  [in^2]      [cm]    [cm]\n## 1        10       12     120       25.4\
    \    30.5\n## 2        42       24    1008      107.     61.0\n## 3        14\
    \       12     168       35.6    30.5\n## # . . . with 1 more variable: area_cm\
    \ [cm^2]\n```\n\nWhen you use `transmute()` instead of `mutate()`, the variables\
    \ that you are not assigning to will be removed.\n\nAs with filtering, the expressions\
    \ you use when mutating a data frame must be vector expressions. Consider this\
    \ example:\n\n```r\ndf %>% mutate(~ if (.x < 0) -.x else .x)\n## Error in `mutate()`:\n\
    ## ! Problem while computing `..1 = ~if (.x < 0) -.x else .x`.\n## x `..1` must\
    \ be a vector, not a `formula` object.\n```\n\nIt fails because the function `my_abs()`\
    \ (my version of the `abs()` function) is not a vector expression. It is not a\
    \ vector expression because of the `x` in the `if` expression.\n\nIf we use the\
    \ built-in `abs()` function , then there is no problem with the expression; it\
    \ handles vectors.\n\n```r\ndf %>% mutate(abs(x))\n## # A tibble: 3 × 2\n##  \
    \     x `abs(x)`\n##    <dbl>    <dbl>\n## 1  11.5    11.5\n## 2  20.9    20.9\n\
    ## 3  17.2    17.2\n```\n\nIf you use the `ifelse()` vector version of `if` expressions,\
    \ you get a vector expression.\n\n```r\ndf %>% mutate(ifelse(x < 0, -x, x))\n\
    ## # A tibble: 3 × 2\n##       x `ifelse(x < 0, -x, x)`\n##    <dbl>         \
    \        <dbl>\n## 1  11.5                  11.5\n## 2  20.9                 \
    \ 20.9\n## 3  17.2                  17.2\n```\n\nOr you can use the `Vectorize()`\
    \ function to make a vector expression out of a function that does not handle\
    \ vectors.\n\n```r\nmy_abs <- Vectorize(function(x) if (x < 0) -x else x)\ndf\
    \ %>% mutate(my_abs(x))\n## # A tibble: 3 × 2\n##      x `my_abs(x)`\n##   <dbl>\
