  trans: "\n## 向绘图对象添加组件\n\n我们能创建的最简单的图形是空图形。你可以通过调用不带任何参数的 `ggplot()` 来创建它。\n\n```\n\
    p <- ggplot()\n```\n\n你可以通过调用 `summary()` 函数来查看它的组成部分，但这里的大部分信息并不相关。我会在后续讲解中，高亮显示与本小节所见组件相关的行。\n\
    \n```\nsummary(p)\n## data: [x]\n## faceting: \n##     compute_layout: function\n\
    ##     draw_back: function\n##     draw_front: function\n##     draw_labels: function\n\
    ##     draw_panels: function\n##     finish_data: function\n##     init_scales:\
    \ function\n##     map_data: function\n##     params: list\n##     setup_data:\
    \ function\n##     setup_params: function\n##     shrink: TRUE\n##     train_scales:\
    \ function\n## vars: function\n## super:  \n```\n\n要创建图形，你需要打印该图形对象。你可以显式地执行此操作：\n\
    \n```\nprint(p)\n```\n\n或者直接将其输入到你的 R 终端中：\n\n```\np\n```\n\n但在本例中，图形是空的——我们在创建\
    \ `p` 时并未向其中添加任何内容——因此我没有展示结果。\n\n由于在 R 脚本中将对象放在最外层会打印该对象，因此 `ggplot` 对象并不总是先赋值给变量再绘制。你完全可以只写\
    \ `ggplot()` 对象。\n\n```\nggplot()\n```\n\n为什么会有人创建空图形对象呢？你无法打印空对象。嗯，你可以打印，但你会得到一个空白的画布，所以这没什么意义。不过，你可以通过向其中添加组件来逐步构建图形。你可以从空图形开始，然后在单独的命令中添加所需的一切。\n\
    \n### 添加数据\n\n你可以将数据作为参数添加到 `ggplot()` 中。如果你想向空图形添加数据，则需要使用几何对象；请参阅下面的示例。如果你在\
    \ `ggplot()` 函数中添加了数据，那么之后添加到图形中的所有组件都能访问这些数据。\n\n使用一些随机测试数据，我们可以创建一个包含关联数据的图形对象。\n\
    \n```\ndat <- tibble(\nfoo = runif(100),\nbar = 20 * foo + 5 + rnorm(100, sd =\
    \ 10),\nbaz = rep(1:2, each = 50)\n)\np <- ggplot(data = dat)\n```\n\n如果你调用 `summary(p)`，你会看到以下行：\n\
    \n```\n## data: foo, bar, baz [100x3]\n```\n\n出现在顶部。它显示了数据中的变量。这些变量尚未映射到任何图形对象；那是美学映射的职责。\n\
    \n### 添加美学映射\n\n我们在图形中看到的是点、线、颜色等。要创建这些图形，`ggplot2` 需要知道数据中的哪些变量应被解释为坐标，哪些决定线条粗细，哪些决定颜色等。美学映射正是为此服务的。\n\
    \n思考一下这个图形对象：\n\n```\np <- ggplot(data = dat, aes(x = foo, y = bar, color = baz))\n\
    ```\n\n在此，我们指定了 `foo` 决定 x 坐标，`bar` 决定 y 坐标，`baz` 决定颜色。如果你查看图形的摘要，你会在 `data` 行下面看到从数据变量到图形对象的映射：\n\
    \n```\n## data: foo, bar, baz [100x3]\n## mapping:  x = ~foo, y = ~bar, colour\
    \ = ~baz\n```\n\n打印（或显示）此图形将得到一个空图形，其 x 轴和 y 轴与数据中 x 和 y（`foo` 和 `bar`）值的范围相匹配。除此之外图形是空的，因为它没有指定几何对象。\n\
    \n### 添加几何对象\n\n几何对象指定了图形的类型。它们使用从数据到图形属性的美学映射，并基于此创建图形。\n\n最直接的图形之一是散点图。我们可以将\
    \ `geom_point()` 几何对象添加到之前创建的图形中，以获得散点图。\n\n```\np <- ggplot(data = dat, aes(x\
    \ = foo, y = bar, color = baz)) +\ngeom_point()\n```\n\n如果你调用 `summary(p)`，你会在输出底部看到以下行：\n\
    \n```\n## geom_point: na.rm = FALSE\n## stat_identity: na.rm = FALSE\n## position_identity\n\
    ```\n\n它们告诉你，你有一个点几何对象，并且将数据映射到摘要的统计量是恒等统计量。当我们将其绘制成点时，我们不对数据进行任何摘要统计。你可以通过打印图形对象来创建图形；你可以在图\
    \ 13-1 中看到结果。\n\n![](img/476587_2_En_13_Fig1_HTML.jpg)\n\n使用 `ggplot2` 创建了一个散点图。带有轻微颜色深浅变化的点散布在整个图上。\n\
    \n**图 13-1**\n\n**点几何图形**\n\n```\nprint(p)\n```\n\n你可以直接将数据和美学映射添加到几何对象中。这在你想将替代数据叠加到图形上时尤其有用，但作为示例，考虑将相同的数据和美学映射移到\
    \ `geom_point()` 调用中。\n\n```\np <- ggplot() +\ngeom_point(data = dat, aes(x =\
    \ foo, y = bar, color = baz))\n```\n\n如果你查看摘要，你会看到美学映射现在已与几何对象分组在一起：\n\n```\n\
    ## mapping: x = ~foo, y = ~bar, colour = ~baz\n## geom_point: na.rm = FALSE\n\
    ## stat_identity: na.rm = FALSE\n## position_identity\n```\n\n但除此之外，变化不大。这可用于向图形添加额外数据。这也表明，有时从一个空图形对象开始，然后在不同的几何对象中添加不同的数据集是有意义的。\n\
    \n由于 `baz` 是数值型的，它被解释为一个连续变量。你可以通过将其转换为因子来获得离散的颜色映射。\n\n```\nggplot(data = dat,\
    \ aes(x = foo, y = bar, color = factor(baz))) +\ngeom_point()\n```\n\n你可以在图 13-2\
    \ 中看到结果。\n\n![](img/476587_2_En_13_Fig2_HTML.jpg)\n\n在 `ggplot2` 中添加了颜色变化美学参数的散点图。两个深浅不同的点，分别标记为因子\
    \ 1 和因子 2，散布在图中。\n\n**图 13-2**\n\n**离散颜色美学**\n\n你可以更改因子中的水平来重新排序图例。有关操作因子的更多信息，请参阅第\
    \ 10 章。\n\n另一个简单的几何对象是线图。\n\n```\nggplot(data = arrange(dat, foo),\naes(x = foo,\
    \ y = bar, color = factor(baz))) +\ngeom_line()\n```\n\n在结果见图 13-3。在绘图之前，我使用 `arrange()`\
    \ 根据 x 轴对数据进行了排序。否则，线条将不会从左到右，而是来回跳跃（如果你想理解我的意思，可以试一下）。\n\n![](img/476587_2_En_13_Fig3_HTML.jpg)\n\
    \n`ggplot2` 中的线图几何对象。深浅不同的线条，标记为因子 1 和因子 2，起伏波动，形成紧密排列的尖锐峰值。\n\n**图 13-3**\n\n\
    **线图**\n\n你可以有多个几何对象；请看下面的例子。\n\n```\np <- ggplot(data = dat,\naes(x = foo, y\
    \ = bar, color = baz)) +\ngeom_point() +\ngeom_smooth(formula = y ~ x, method\
    \ = \"loess\")\n```\n\n如果你调用 `summary(p)`，你会在输出底部看到两个图层。\n\n```\n## geom_point:\
    \ na.rm = FALSE\n## stat_identity: na.rm = FALSE\n## position_identity\n##\n##\
    \ geom_smooth: na.rm = FALSE, orientation = NA, se = TRUE\n## stat_smooth: na.rm\
    \ = FALSE, orientation = NA, se = TRUE, method = loess\n## position_identity\n\
    ```\n\n注意，平滑几何对象没有使用恒等统计量。它显示了数据的摘要，并且从数据到该摘要的映射由 `stat_smooth` 统计量处理。\n\n我们可以打印该图形：\n\
    \n```\nprint(p)\n```\n"
- fmt: "参考以下排版后的内容：\n\n查看图[13-4](#476587_2_En_13_Chapter.xhtml#Fig4)中的结果。\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig4_HTML.jpg)\n\
    \n**图13-4：包含两个几何对象的图**\n\n一个`ggplot2`图，添加了两个几何对象。`bar`相对于`foo`的散点图中包含不同深浅的点，以及一条逐渐倾斜的线。\n\
    \n如果我们使用离散颜色，它也会对数据进行分组。因此，如果我们将`baz`再次设为因子，我们将得到不同颜色的数据点，并得到两条平滑线。\n\n```\nggplot(data\
    \ = dat, aes(x = foo, y = bar, color = factor(baz))) +\ngeom_point() +\ngeom_smooth(formula\
    \ = y ~ x, method = \"loess\")\n```\n\n查看图[13-5](#476587_2_En_13_Chapter.xhtml#Fig5)中的结果。\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig5_HTML.jpg)\n\n**图13-5：包含两个几何对象和离散颜色的图**\n\
    \n一个`ggplot2`图，包含两个几何对象和一个颜色变化的美学参数。它具有带有阴影的散点和两条对应的线。\n\n你可以使用`geom_histogram()`构建直方图（参见图[13-6](#476587_2_En_13_Chapter.xhtml#Fig6)）。\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig6_HTML.jpg)\n\n**图13-6：直方图**\n\
    \n使用`ggplot2`绘制的直方图。该直方图绘制了`count`相对于`foo`的分布，其中最高的柱形在Y轴上超过了9。\n\n```\nggplot(data\
    \ = dat, aes(x = foo)) +\ngeom_histogram(binwidth = 0.05)\n```\n\n注意，此几何对象只需要一个x轴。\n\
    \n通过`summary(p)`，你将看到其统计量是`stat_bin`。\n\n```\n## geom_bar: na.rm = FALSE\n## stat_bin:\
    \ binwidth = NULL, # ...此处有更多内容...\n```\n\n如果你想要密度图，可以使用`geom_density()`。\n\n\
    ```\nggplot(data = dat, aes(x = bar)) +\ngeom_density()\n```\n\n你会看到其统计量是`stat_density`。\n\
    \n```\n## geom_density: na.rm = FALSE\n## stat_density: na.rm = FALSE\n```\n\n\
    我想你已经看明白其中的模式了。\n\n### 分面\n\n添加网格分面的效果是，我们会得到子图，数据根据提供给`facet_grid()`的公式被分割成不同的组；参见图[13-7](#476587_2_En_13_Chapter.xhtml#Fig7)。\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig7_HTML.jpg)\n\n**图13-7：对图进行分面**\n\
    \n一个带有网格分面的散点图，包含2个子图。图1和图2包含散布在绘图区域中的单色点。\n\n```\nggplot(data = dat, aes(x =\
    \ foo, y = bar)) +\ngeom_point() + facet_grid(~ factor(baz))\n```\n\n在前面的图中，当你查看它们的摘要时，你会在`faceting`下看到类为`FacetNull`。\n\
    \n```\n## faceting: \n```\n\n当我们添加网格分面后，现在会看到：\n\n```\n## faceting: \n```\n\n\
    你可以通过在公式两侧都设置变量来绘制二维网格图：\n\n```\ndat2 <- tibble(\nfoo = rep(1:5, each = 20),\n\
    bar = rep(1:2, each = 50),\nx = foo * bar + rnorm(100),\ny = -foo\n)\nggplot(data\
    \ = dat2, aes(x = x, y = y)) +\ngeom_point() + facet_grid(factor(foo) ~ factor(bar))\n\
    ```\n\n结果如图[13-8](#476587_2_En_13_Chapter.xhtml#Fig8)所示。\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig8_HTML.jpg)\n\
    \n**图13-8：两个变量的分面网格**\n\n一个带有网格分面的散点图，包含两侧的变量。十个图排列成2列，其中的点呈直线分布。\n\n你可以使用两个以上的变量，但（自然）只能有两个维度。如果使用超过两个变量，不同的类别将作为标签显示在分面两侧。你将看到公式中出现所有因子组合。例如，考虑以下情况：\n\
    \n```\ndat3 <- tibble(\nfoo = factor(rep(1:5, each = 20)),\nbar = factor(rep(1:2,\
    \ each = 50)),\nbaz = factor(rep(1:5, times = 20)),\nqux = factor(rep(1:2, times\
    \ = 50)),\nx = rnorm(100),\ny = rnorm(100)\n)\nggplot(data = dat3, aes(x = x,\
    \ y = y)) +\ngeom_point() + facet_grid(foo + bar ~ baz + qux)\n```\n\n结果如图[13-9](#476587_2_En_13_Chapter.xhtml#Fig9)所示。\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig9_HTML.jpg)\n\n**图13-9：包含四个变量的分面图**\n\
    \n一个`ggplot2`图，其网格分面中包含4个变量。各图排列成10列6行，变量位于两侧。\n\n### 添加坐标系\n\n前面所有图都是在笛卡尔坐标系（默认坐标系）中绘制的。你可以更改图的坐标系。例如，可以翻转轴，比如图的x轴：\n\
    \n```\nggplot(data = dat, aes(x = foo, y = bar)) +\ngeom_point() + coord_flip()\n\
    ```\n\n或者，你也可以使用极坐标系代替笛卡尔坐标系。\n\n```\nggplot(data = dat, aes(x = foo, y = bar))\
    \ +\ngeom_point() + coord_polar()\n```\n\n参见图[13-10](#476587_2_En_13_Chapter.xhtml#Fig10)和图[13-11](#476587_2_En_13_Chapter.xhtml#Fig11)。\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig11_HTML.jpg)\n\n**图13-11：极坐标图**\n\
    \n使用`ggplot2`在极坐标中绘制点的雷达图。左侧、底部和右侧的径向距离分别测量为0.75、0.50和0.25。\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig10_HTML.jpg)\n\
    \n**图13-10：x坐标翻转的图**\n\n`foo`相对于`bar`的散点图，展示了在`ggplot2`中翻转X轴的功能。\n\n### 修改刻度\n\
    \n`ggplot2`将数据映射到坐标或颜色的方式非常灵活。美学映射将数据映射到`x`或`y`坐标，或颜色和填充（用于填充区域的颜色），但之后你可以修改相应的图属性。用于执行此操作的函数以`scale_`开头，后面跟上要更改的属性，再然后是你要执行的操作。你修改的操作取决于你要更改的内容，例如坐标或颜色等。\n\
    \n例如，如果你想将`y`轴设置为对数刻度，可以使用`scale_y_log10()`；如果你想将连续变量映射到离散颜色，可以使用`scale_color_binned()`：\n\
    \n```\nggplot(data = dat, aes(x = bar, y = foo, color = baz)) +\ngeom_point()\
    \ +\nscale_y_log10() +\nscale_color_binned()\n```\n\n参见图[13-12](#476587_2_En_13_Chapter.xhtml#Fig12)。\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig12_HTML.jpg)\n\n**图13-12：重新调整y坐标和颜色刻度的图**\n\
    \n`foo`相对于`bar`的散点图，展示了在`ggplot2`中修改轴范围和`baz`刻度颜色变化的功能。\n\n所有这些转换函数的列表过于冗长，无法在此章节中列出，因此我建议你参阅包文档以获取更多信息。\n\
    \n受限于篇幅，我只能让你初步了解使用`ggplot2`实现的图形语法能做些什么，但我希望我已经传达出，通过这个包，你能够使用一种强大的语言来构建图形。其功能远不止我展示的这些，我强烈建议你自行更详细地探索这个包。\n\
    \n# 14. 结论\n\nR语言，在`Tidyverse`的扩展下，是数据科学领域的一种强大语言。它为数据分析流程中的每一步都提供了强大的支持。阅读完本书后，你应该对`Tidyverse`包的工作原理及其使用方法有了扎实的理解。本书并未涉及对特定数据使用哪种数据科学和机器学习模型，只说明了它们如何融入流程。涵盖实际的数据分析、要使用的方法以及支持这些方法的包超出了本书的范围。每一种统计或机器学习方法都可能需要一本书来阐述，而R包中有许多这样的模型。本书主要是一本语法指南，它所涵盖的内容可以与你需要应用于数据的任何模型结合使用，因此它是你将数据分析适配到`Tidyverse`框架的优秀基础。"
  raw: "and see the result in Figure [13-4](#476587_2_En_13_Chapter.xhtml#Fig4).\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig4_HTML.jpg)\n\nA g g plot\
    \ 2 with 2 added geometries. The plot of bar versus foo contains dots of different\
    \ shades scattered throughout and a gradually inclined line.\n\nFigure 13-4\n\n\
    Plot with two geometries\n\nIf we use a discrete color, it also groups the data,\
    \ so if we make `baz` a factor again, we will get the data in differently colored\
    \ point and get two smoothed lines.\n\n```\nggplot(data = dat, aes(x = foo, y\
    \ = bar, color = factor(baz))) +\ngeom_point() +\ngeom_smooth(formula = y ~ x,\
    \ method = \"loess\")\n```\n\nSee the result in Figure [13-5](#476587_2_En_13_Chapter.xhtml#Fig5).\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig5_HTML.jpg)\n\nA g g plot\
    \ 2 with 2 geometries and a color change aesthetic parameter. It has shaded scattered\
    \ dots and 2 corresponding lines.\n\nFigure 13-5\n\nPlot with two geometries and\
    \ a discrete color\n\nYou can build a histogram plot with `geom_histogram()` (see\
    \ Figure [13-6](#476587_2_En_13_Chapter.xhtml#Fig6)).\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig6_HTML.jpg)\n\
    \nA histogram plotted using g g plot 2\\. The histogram plots count versus foo\
    \ with the highest bar crossing 9 on the Y axis.\n\nFigure 13-6\n\nHistogram plot\n\
    \n```\nggplot(data = dat, aes(x = foo)) +\ngeom_histogram(binwidth = 0.05)\n```\n\
    \nNotice that you only need an x-axis for this geometry.\n\nWith `summary(p)`,\
    \ you will see that the statistic is `stat_bin`.\n\n```\n## geom_bar: na.rm =\
    \ FALSE\n## stat_bin: binwidth = NULL, # ...there is more here...\n```\n\nIf you\
    \ want a density plot instead, you use `geom_density()`.\n\n```\nggplot(data =\
    \ dat, aes(x = bar)) +\ngeom_density()\n```\n\nThere, you will see that the statistic\
    \ is `stat_density`.\n\n```\n## geom_density: na.rm = FALSE\n## stat_density:\
    \ na.rm = FALSE\n```\n\nI think you see the pattern now.\n\n### Facets\n\nThe\
    \ effect of adding a grid facet is that we get subfigures where the data is split\
    \ into groups determined by the formula we give `facet_grid()`; see Figure [13-7](#476587_2_En_13_Chapter.xhtml#Fig7).\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig7_HTML.jpg)\n\nA scatterplot\
    \ with a grid facet contains 2 subfigures. Plots 1 and 2 contain single-colored\
    \ dots scattered all over the plot.\n\nFigure 13-7\n\nFaceting the plot\n\n```\n\
    ggplot(data = dat, aes(x = foo, y = bar)) +\ngeom_point() + facet_grid(~ factor(baz))\n\
    ```\n\nIn the previous plots, when you looked at their summary, you would see,\
    \ under `faceting`, that the class was `FacetNull`.\n\n```\n## faceting: \n```\n\
    \nWhen we added the grid facet, we now see this:\n\n```\n## faceting: \n```\n\n\
    You can plot in a two-dimensional grid by having variables on both sides of the\
    \ formula:\n\n```\ndat2 <- tibble(\nfoo = rep(1:5, each = 20),\nbar = rep(1:2,\
    \ each = 50),\nx = foo * bar + rnorm(100),\ny = -foo\n)\nggplot(data = dat2, aes(x\
    \ = x, y = y)) +\ngeom_point() + facet_grid(factor(foo) ~ factor(bar))\n```\n\n\
    The result is shown in Figure [13-8](#476587_2_En_13_Chapter.xhtml#Fig8).\n\n\
    ![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig8_HTML.jpg)\n\nA scatterplot\
    \ plot with a grid facet contains variables on two sides. Ten plots are arranged\
    \ in 2 columns with dots in a straight line.\n\nFigure 13-8\n\nFacet grid for\
    \ two variables\n\nYou can use more than two variables but (naturally) only two\
    \ dimensions. If you use more than two variables, then the different categories\
    \ will be shown as labels on the facet sides. You will see all combinations of\
    \ factors that appear in the formula. As an example, consider this:\n\n```\ndat3\
    \ <- tibble(\nfoo = factor(rep(1:5, each = 20)),\nbar = factor(rep(1:2, each =\
    \ 50)),\nbaz = factor(rep(1:5, times = 20)),\nqux = factor(rep(1:2, times = 50)),\n\
    x = rnorm(100),\ny = rnorm(100)\n)\nggplot(data = dat3, aes(x = x, y = y)) +\n\
    geom_point() + facet_grid(foo + bar ~ baz + qux)\n```\n\nThe result is shown in\
    \ Figure [13-9](#476587_2_En_13_Chapter.xhtml#Fig9).\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig9_HTML.jpg)\n\
    \nA g g plot with a grid facet contains 4 variables in g g plot 2\\. The plots\
    \ are arranged in 10 columns and 6 rows with variables on both sides.\n\nFigure\
    \ 13-9\n\nFacet with four variables\n\n### Adding Coordinates\n\nAll the preceding\
    \ plots were plotted in Cartesian coordinates —the default coordinates. You can\
    \ change the coordinates of a plot. For example, you can flip an axis, such as\
    \ the x-axis of a plot:\n\n```\nggplot(data = dat, aes(x = foo, y = bar)) +\n\
    geom_point() + coord_flip()\n```\n\nOr you can plot in polar coordinates instead\
    \ of Cartesian coordinates.\n\n```\nggplot(data = dat, aes(x = foo, y = bar))\
    \ +\ngeom_point() + coord_polar()\n```\n\nSee Figures [13-10](#476587_2_En_13_Chapter.xhtml#Fig10)\
    \ and [13-11](#476587_2_En_13_Chapter.xhtml#Fig11).\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig11_HTML.jpg)\n\
    \nA radar plot with points plotted in polar coordinates using g g plot 2\\. The\
    \ left, bottom, and right radii measure 0.75, 0.50, and 0.25, respectively.\n\n\
    Figure 13-11\n\nPlot in polar coordinates\n\n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig10_HTML.jpg)\n\
    \nA scatter plot of foo versus bar illustrates the feature of flipping the X axis\
    \ in g g plot 2.\n\nFigure 13-10\n\nPlot with the x-coordinate flipped\n\n###\
    \ Modifying Scales\n\nThe way `ggplot2` maps data to coordinates or colors is\
    \ quite flexible. The aesthetics maps data to either `x` or `y` coordinate or\
    \ to colors or fills (colors used to fill areas), but after that you can modify\
    \ the corresponding plot properties. The functions for doing this start with `scale_`,\
    \ then the property you want to change, and then what you want to do. The operations\
    \ you modify depend on what you are changing, for example, a coordinate or a color\
    \ or such.\n\nIf you want to put the `y` axis on a logarithmic scale, for example,\
    \ you can use `scale_y_log10()`, and if you want to map a continuous variable\
    \ to discrete colors, you can use `scale_color_binned()`:\n\n```\nggplot(data\
    \ = dat, aes(x = bar, y = foo, color = baz)) +\ngeom_point() +\nscale_y_log10()\
    \ +\nscale_color_binned()\n```\n\nSee Figure [13-12](#476587_2_En_13_Chapter.xhtml#Fig12).\n\
    \n![](images/476587_2_En_13_Chapter/476587_2_En_13_Fig12_HTML.jpg)\n\nA scatter\
    \ plot of foo versus bar indicates the feature of modifying the range of axes\
    \ and color variation in the baz scale in g g plot 2.\n\nFigure 13-12\n\nPlot\
    \ with rescaled y-coordinate and colors\n\nThe list of all these transformation\
    \ functions is too long to list in this chapter, so I refer you to the package\
    \ documentation for more information.\n\nWith the space available here, I am only\
    \ able to give you an idea of what you can do with the grammar of graphs implementing\
    \ in `ggplot2`, but I hope that I have conveyed that with this package you have\
    \ access to a powerful language for constructing plots. There is much more to\
    \ it than what I have shown, and I urge you to explore the package in more detail\
    \ on your own.\n\n# 14. Conclusions\n\nR, extended with the Tidyverse , is a powerful\
    \ language for data science. There is strong support for each step along a data\
    \ analysis pipeline. After reading this book, you should have a good grasp of\
    \ how the Tidyverse packages work and how you use them. The book did not cover\
    \ which data science and machine learning model to use on particular data, but\
    \ only how they could fit into pipelines. Covering actual data analysis and the\
    \ methods to use—and packages supporting them—is beyond the scope of this book.\
    \ Each statistical or machine learning method could fill a book in itself, and\
    \ there are many such models in R packages. The book is mainly a syntax guide,\
    \ and what it covered can be used with any model you need to apply to your data,\
    \ so it is a good foundation for how to adapt your data analysis into the Tidyverse\
    \ framework."
