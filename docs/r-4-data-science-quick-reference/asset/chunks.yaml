    \n考虑一个表格中某些数值包含缺失数据的情况。如果我们想筛选出所有值都大于三的行，我们可以使用`filter_all()`：\n\n```\ndf  filter_all(all_vars(.\
    \ > 3))\n## # A tibble: 1 × 3\n##       A    B      C\n##     \n## 1    11   \
    \ 12    13\n```\n\n它删除了前两行和最后一行，因为它们都包含小于或等于三的值。它还删除了第三行，因为`NA`不被视为大于三。我们可以将测试限制在不包含缺失值的列上：\n\
    \n```\ndf |> filter_if(~ all(!is.na(.)), all_vars(. > 3))\n## # A tibble: 3 ×\
    \ 3\n##       A     B     C\n##     \n## 1     4     5    NA\n## 2    11    12\
    \    13\n## 3    22    22    1\n```\n\n这会将列`C`排除在测试之外。这意味着即使`C`的值小于三，我们也保留了最后一行。\n"
- fmt: "If you want to keep the two middle row but not the first or last, you can\
    \ write a more complex predicate and use `filter_all()`.\n\n```\ndf |> filter_all(all_vars(is.na(.)\
    \ | . > 3))\n## # A tibble: 2 × 3\n##       A     B     C\n##     \n## 1     4\
    \     5    NA\n## 2    11    12    13\n```\n\nYou need to use the `|` vector-or.\
    \ The expression needs to be a vector expression so you cannot use `||`.\n\nMany\
    \ `dplyr` functions have `_all`, `_at`, and `_if` variants, but I will only describe\
    \ the frequently used functions here. For the others, I refer to the package documentation.\n\
    \n## Sorting\n\nIf you want to sort rows by values in selected columns, the function\
    \ you want is called `arrange()`. You can sort by one or more columns:\n\n```\n\
    iris_df |>\narrange(Petal.Length) |>\nprint(n = 5)\n## # A tibble: 150 × 5\n##\
    \   Sepal.Length Sepal.Width Petal.Length\n##                         \n## 1 \
    \         4.6         3.6          1\n## 2          4.3         3            1.1\n\
    ## 3          5.8         4            1.2\n## 4          5           3.2    \
    \        1.2\n## 5          4.7         3.2          1.3\n## # . . . with 145\
    \ more rows, and 2 more variables:\n## # Petal.Width , Species \niris_df |>\n\
    arrange(Sepal.Length, Petal.Length) |>\nprint(n = 5)\n## # A tibble: 150 × 5\n\
    ##   Sepal.Length Sepal.Width Petal.Length\n##                         \n## 1\
    \          4.3         3            1.1\n## 2          4.4         3         \
    \   1.3\n## 3          4.4         3.2          1.3\n## 4          4.4       \
    \  2.9          1.4\n## 5          4.5         2.3          1.3\n## # . . . with\
    \ 145 more rows, and 2 more variables:\n## # Petal.Width , Species \n```\n\nIf\
    \ you want to sort in descending order, you can use the function `desc()`.\n\n\
    ```\niris_df |>\narrange(desc(Petal.Length)) |>\nprint(n = 5)\n## # A tibble:\
    \ 150 × 5\n##   Sepal.Length Sepal.Width Petal.Length\n##                    \
    \     \n## 1          7.7         2.6          6.9\n## 2          7.7        \
    \ 3.8          6.7\n## 3          7.7         2.8          6.7\n## 4         \
    \ 7.6         3            6.6\n## 5          7.9         3.8          6.4\n##\
    \ # . . . with 145 more rows, and 2 more variables:\n## # Petal.Width , Species\
    \ \n```\n\n## Modifying Data Frames\n\nWhen we work with data frames, we usually\
    \ want to compute values based on the variables (columns) in our tables. Filtering\
    \ rows and columns will only get us so far.\n\nThe `mutate()` function lets us\
    \ add columns to a data frame based on expressions that can involve any of the\
    \ existing columns. Consider a table of widths and heights.\n\n```\ndf <- tribble(\n\
    ~height, ~width,\n10,     12,\n42,     24,\n14,     12\n)\n```\n\nWe can add an\
    \ area column using `mutate()` and this expression:\n\n```\ndf |> mutate(area\
    \ = height * width)\n## # A tibble: 3 × 3\n##   height  width  area\n##      \
    \ \n## 1     10     12   120\n## 2     42     24  1008\n## 3     14     12   168\n\
    ```\n\nIf you add columns to a data frame, you can refer to variables you have\
    \ already added. For example, if your height and width data are in inches and\
    \ you want them in centimeters, and you also want the area in centimeters squared,\
    \ you can do this:\n\n```\ncm_per_inch <- 2.54\ndf |> mutate(\nheight_cm = cm_per_inch\
    \ * height,\nwidth_cm = cm_per_inch * width,\narea_cm = height_cm * width_cm\n\
    )\n## # A tibble: 3 × 5\n##   height width height_cm width_cm area_cm\n##    \
    \             \n## 1     10    12       25.4      30.5  774.\n## 2     42    24\
    \      107\\.       61.0 6503.\n## 3     14    12       35.6      30.5 1084.\n\
    ```\n\nThe following expression, however, will not work since you cannot refer\
    \ to variables you are adding later in the `mutate()` call:\n\n```\ndf %>% mutate(\n\
    area_cm = height_cm * width_cm,\nheight_cm = cm_per_inch * height,\nwidth_cm =\
    \ cm_per_inch * width\n)\n## Error in `mutate()`:\n## ! Problem while computing\
    \ `area_cm = height_cm * width_cm`.\n## Caused by error:\n## ! object 'height_cm'\
    \ not found\n```\n\nIf you do not give the new variable a name, that is, you call\
    \ `mutate()` with named parameters, then the expression will become the variable\
    \ name:\n\n```\ndf |> mutate(cm_per_inch * height)\n## # A tibble: 3 × 3\n## \
    \  height width `cm_per_inch * height`\n##                       \n## 1     10\
    \    12                   25.4\n## 2     42    24                  107.\n## 3\
    \     14    12                   35.6\n```\n\nIn this example, the units (inches\
    \ and centimeters) are not encoded with the data, and in future computations you\
    \ might end up mixing the wrong units. If you use the `units` package —which is\
    \ not part of the Tidyverse—you can make the units explicit, automatically convert\
    \ between units where that makes sense, and you will get unit type-safety as a\
    \ bonus.\n\n```\nlibrary(units)\ndf |> mutate(\nheight_in = units::as_units(height,\
    \ \"in\"),\nwidth_in = units::as_units(width, \"in\"),\narea_in = height_in *\
    \ width_in,\nheight_cm = units::set_units(height_in, \"cm\"),\nwidth_cm = units::set_units(width_in,\
    \ \"cm\"),\narea_cm = units::set_units(area_in, \"cmˆ2\")\n)\n## # A tibble: 3\
    \ × 8\n##   height width height_in width_in area_in\n##            [in]     [in]\
    \ [in^2]\n## 1     10    12        10        12    120\n## 2     42    24    \
    \    42        24   1008\n## 3     14    12        14        12    168\n## # .\
    \ . . with 3 more variables: height_cm [cm],\n## # width_cm [cm], area_cm [cm^2]\n\
    ```\n\nThis is possible because tibbles can contain classes of various types,\
    \ which the `units` package exploits. Tibbles use an interface that lets you define\
    \ how your own classes should be displayed, but this is beyond the scope of this\
    \ book.\n\nEarlier, we created unit-carrying values for the original data table,\
    \ but the original height and weight columns are still around. We could use `select()`\
    \ to remove them, but the function `transmute()` already does this for us."
