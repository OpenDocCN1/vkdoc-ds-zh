  trans: "\n# 数据透视（Pivoting）\n\n`pivot_longer()` 函数可以将多个列合并为两个列：一个**键**列和一个**值**列。键列将是一个离散变量，其值取自原始列名，而值列将包含原始列中的数据。\n\
    \n以平均收入数据框为例。我们希望将实际的年份作为 `year` 变量的不同取值，并将每年的收入设为另一个变量 `income`。我们可以通过调用参数如下的\
    \ `pivot_longer()` 来获得这样一个 tibble：\n\n```\nmean_income |> pivot_longer(\n  names_to\
    \ = \"year\",\n  values_to = \"income\",\n  cols = c(`2001`, `2001`, `2002`,\n\
    \           `2003`, `2004`, `2005`)\n)\n## # A tibble: 25 × 3\n##    country \
    \ year  income\n##    <chr>    <chr>  <dbl>\n##  1 Numenor  2001  123456\n## \
    \ 2 Numenor  2002  132654\n##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n\
    ##  5 Numenor  2005  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002\
    \  432165\n##  8 Westeros 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros\
    \ 2005  561423\n## # . . . with 15 more rows\n```\n\n第一个参数是来自 `mean_income` 的输入数据，我使用\
    \ `|>` 运算符来提供它。这与我直接将 `mean_income` 作为函数调用的第一个参数效果完全相同，但使用该运算符可以向读者表明 `mean_income`\
    \ 是流入函数的数据，并因此与其他参数区分开来。\n\n`names_to` 和 `values_to` 参数是两个新列的名称。在 `names_to` 列中，我们得到从中取值的那一列的列名；在\
    \ `value` 列中，我们得到这些列中对应的值。其余参数指定我们要合并哪些列。\n\n在前面的示例中，我显式列出了所有要包含的列，但 `tidyr` 的函数支持整洁选择（tidy\
    \ select）（参见第 4 章），因此你也可以使用列的范围，如下所示：\n\n```\nmean_income|>pivot_longer(\n  names_to\
    \ =\"year\",\n  values_to =\"income\",\n  cols = '2001':'2005'\n)\n## # A tibble:\
    \ 25 × 3\n##    country  year  income\n##    <chr>    <chr>  <dbl>\n##  1 Numenor\
    \  2001  123456\n##  2 Numenor  2002  132654\n##  3 Numenor  2003  321646\n##\
    \  4 Numenor  2004  324156\n##  5 Numenor  2005  325416\n##  6 Westeros 2001 \
    \ 314256\n##  7 Westeros 2002  432165\n##  8 Westeros 2003  546123\n##  9 Westeros\
    \ 2004  465321\n## 10 Westeros 2005  561423\n## # . . . with 15 more rows\n```\n\
    \n你可以使用多个范围：\n\n```\nmean_income|>pivot_longer(\n  names_to =\"year\",\n  values_to\
    \ =\"income\",\n  cols =c( '2001':'2002', '2004':'2005')\n)\n```\n\n但是范围指定仅在相关列连续时才有效。你还可以使用\
    \ `!` 来指定要合并的列的补集。例如，如果你想合并年份，你可以选择除 `country` 之外的所有列，而不是选择所有年份：\n\n```\nmean_income|>pivot_longer(\n\
    \  names_to =\"year\",\n  values_to =\"income\",\n  cols =!country\n)\n## # A\
    \ tibble: 25 × 3\n##    country  year  income\n##    <chr>    <chr>  <dbl>\n##\
    \  1 Numenor  2001  123456\n##  2 Numenor  2002  132654\n##  3 Numenor  2003 \
    \ 321646\n##  4 Numenor  2004  324156\n##  5 Numenor  2005  325416\n##  6 Westeros\
    \ 2001  314256\n##  7 Westeros 2002  432165\n##  8 Westeros 2003  546123\n## \
    \ 9 Westeros 2004  465321\n## 10 Westeros 2005  561423\n## # . . . with 15 more\
    \ rows\n```\n\n你可以在补集指定多个列，并且可以将补集与范围结合使用。\n\n通常，你可以将 `pivot_longer()` 与所有整洁选择函数结合使用来选择列，例如，你可以使用\
    \ `starts_with()`，或者将 `starts_with()` 与补集 `!` 或整洁选择语言允许的任何其他内容结合使用。\n\n```\nmean_income|>pivot_longer(\n\
    \  names_to =\"year\",\n  values_to =\"income\",\n  starts_with(\"2\")\n)\n##\
    \ # A tibble: 25 × 3\n##    country  year  income\n##    <chr>    <chr>  <dbl>\n\
    ##  1 Numenor  2001  123456\n##  2 Numenor  2002  132654\n##  3 Numenor  2003\
    \  321646\n##  4 Numenor  2004  324156\n##  5 Numenor  2005  325416\n##  6 Westeros\
    \ 2001  314256\n##  7 Westeros 2002  432165\n##  8 Westeros 2003  546123\n## \
    \ 9 Westeros 2004  465321\n## 10 Westeros 2005  561423\n## # . . . with 15 more\
    \ rows\nmean_income|>pivot_longer(\n  names_to =\"year\",\n  values_to =\"income\"\
    ,\n  !starts_with(\"c\")\n)\n## # A tibble: 25 × 3\n##    country  year  income\n\
    ##    <chr>    <chr>  <dbl>\n##  1 Numenor  2001  123456\n##  2 Numenor  2002\
    \  132654\n##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor\
    \  2005  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##\
    \  8 Westeros 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005 \
    \ 561423\n## # . . . with 15 more rows\n```\n\n进入 `names_to` 列的列名将是字符串。如果你需要其他类型，例如逻辑值或数值，可以通过设置\
    \ `names_transform` 参数来实现。如果我们希望所有年份都表示为整数，可以这样做：\n\n```\nmean_income|>pivot_longer(\n\
    \  names_to =\"year\",\n  values_to =\"income\",\n  !country,\n  names_transform\
    \ =as.integer\n)\n## # A tibble: 25 × 3\n##    country  year  income\n##    <chr>\
    \    <int>  <dbl>\n##  1 Numenor  2001  123456\n##  2 Numenor  2002  132654\n\
    ##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor  2005\
    \  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##  8 Westeros\
    \ 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005  561423\n## #\
    \ . . . with 15 more rows\n```\n\n因为所有年份都是整数，所以年份列现在包含整数。如果我们想分析这个数据集，很可能希望将年份解释为整数。\n\
    \n但是，如果我们想要因子类型，也可以这样做：\n\n```\nmean_income|>pivot_longer(\n  names_to =\"year\"\
    ,\n  values_to =\"income\",\n  !country,\n  names_transform =as.factor\n)\n```\n\
    \n如果你需要转换进入 `values_to` 列的值，还有一个类似的 `values_transform` 参数。\n\n如果你使用的函数不期望整洁数据，而是期望在不同列中找到相关数据，则可以使用\
    \ `pivot_wider()` 函数将整洁数据转换为那种格式。它是 `pivot_longer()` 的反操作。^((12))\n\n```\ntidy_incomepivot_longer(\n\
    \  names_to =\"year\",\n  values_to =\"income\",\n  !country\n)\ntidy_income|>pivot_wider(\n\
    \  names_from =\"year\",\n  values_from =\"income\"\n)\n## # A tibble: 5 × 6\n\
    ##   country   `2001` `2002` `2003` `2004` `2005`\n##   <chr>      <dbl>  <dbl>\
    \  <dbl>  <dbl>  <dbl>\n## 1 Numenor   123456 132654 321646 324156 325416\n##\
    \ 2 Westeros  314256 432165 546123 465321 561423\n## 3 Narnia    432156 342165\
    \ 564123 543216 465321\n## 4 Gondor    531426 321465 235461 463521 561423\n##\
    \ 5 Laputa     14235  34125  45123  51234  54321\n```\n\n`names_from` 和 `values_from`\
    \ 参数分别选取用作列名的值和要放入这些列的值。它们与你用于 `pivot_longer()` 的 `names_to` 和 `values_to` 参数的参数相同，用于将结果转换回去。\n"
- fmt: "# Complex Column Encodings\n\nDifferent variables are not always represented\
    \ in separated columns. For example, it is not uncommon to have a column that\
    \ contains a date, but that is really a day and a month and possibly a year. The\
    \ best representation of a date is, of course, a date object, but for the sake\
    \ of the example, let us say that we want to split a date into a day and a month\
    \ column. You can do this using the `separate()` function.\n\n```\ntbl  \n## 1\
    \  11     5\n## 2  4      7\n## 3  21     12\n```\n\nThe first argument is the\
    \ data table, the second the column you want to split, and the `into` argument\
    \ is a list of the columns the original date will be put into.\n\nBy default,\
    \ the original column is removed, but if you want to keep it, you can use the\
    \ `remove` argument.\n\n```\nseparate(tbl, date,into =c(\"day\",\"month\"),remove\
    \ =FALSE)\n## # A tibble: 3 × 3\n##   date  day   month\n##     \n## 1 11/5  11\
    \    5\n## 2 4/7   4     7\n## 3 21/12 21    12\n```\n\nAfter separating the fields\
    \ in the `data` column, which is a column of strings, you get a `day` and a `month`\
    \ column, and these also contain strings. To convert them into numbers, you can\
    \ use the `convert` argument.\n\n```\nseparate(tbl, date,into =c(\"day\",\"month\"\
    ),convert =TRUE)\n## # A tibble: 3 × 2\n##    day   month\n##     \n## 1  11 \
    \       5\n## 2  4         7\n## 3  21       12\n```\n\nA column will be split\
    \ by default on any non-alphanumeric character. This is why the `/` in the data\
    \ is correctly used as the separator between the day and the month.^([^(13)](#fn13))\
    \ If your separator is something else, you can use the `sep` argument. The argument\
    \ takes a regular expression, and the column will be split on this. For example,\
    \ we can split on alphabet characters and spaces like this:\n\n```\ntbl \n## 1\
    \ 11    5\n## 2 4     7\n## 3 21    12\n```\n\nThe regular expression `([[:alpha:]]|[[:space:]]`)+\
    \ specifies any nonzero (specified by `+`) sequence of the character classes in\
    \ (the outermost) square brackets, where we have put alphabet characters `[:alpha:]`\
    \ and spaces `[:space:]`.\n\nThe date format in this example is not something\
    \ you would find in the wild, but if we have the date in this format\n\n```\n\
    tbl<-tribble(\n~date,\n\"11th of May\",\n\"4th of July\",\n\"21st of December\"\
    \n)\n```\n\nwe cannot easily distinguish the separator string from the months.\
    \ If the delimiter you need is not a single regular expression, you might be able\
    \ to use the `extract()` function instead of `separate()`. With `extract()`, you\
    \ can use regular expression groups to identify the fields to extract.\n\nYou\
    \ need an expression with groups—those are subexpressions in parentheses—and what\
    \ those groups match will be the value put in the new columns. For our dates,\
    \ it could look like this:\n\n```\ntbl|>extract(\ncol =date,\ninto =c(\"day\"\
    ,\"month\"),\nregex =paste0(\n\"([[:digit:]]+)\",        # First group, the day\n\
    \"[[:alpha:][:space:]]+\", # Stuff we ignore; will match \"th of\" and such\n\"\
    [[:space:]]\",           # The final space before the month name\n\"([[:alpha:]]+)\"\
    \          # Second group, the month\n)\n)\n## # A tibble: 3 × 1\n##   date\n\
    ##   \n## 1 11th of May\n## 2 4th of July\n## 3 21st of December\n```\n\nFor both\
    \ `separate()` and `extract()`, you can have more than two resulting columns.\
    \ You can provide more than two names to the `into` parameter, and then the expression\
    \ you use for separating and extracting should provide the right number of values,\
    \ of course.\n\n```\ntbl|>extract(\ncol =date,\ninto =c(\"day\",\"fluf\",\"month\"\
    ),\nregex =paste0(\n\"([[:digit:]]+)\",       # First group, the day\n\"([[:alpha:]]+)\"\
    ,       # st, nd, rd, th, that kind of stuff goes in fluf\n\"[[:alpha:][:space:]]+\"\
    ,# stuff between day and month; not a group so we throw it away\n\"([[:alpha:]]+)\"\
    \        # Third group, the month\n)\n)\n## # A tibble: 3 × 1\n##   date\n## \
    \  \n## 1 11th of May\n## 2 4th of July\n## 3 21st of December\n```\n\nThe reverse\
    \ of separating is uniting. For example, let `tbl2` contain a `day` and a `month`\
    \ column. I’m building such a table in the following code:\n\n```\ntblseparate(col\
    \ =date,into =c(\"day\",\"month\"))\n```\n\nHaving created such a tibble in `tbl2`,\
    \ we can use the `unite()` function to undo `separate()` much as we found `pivot_longer/wider()`\
    \ to be able to undo each other (with the caveats that things can get lost of\
    \ course). The `col` argument should be the column we create and the following\
    \ columns those we create it from.\n\n```\ntbl2|>unite(col =\"date\", day, month)\n\
    ## # A tibble: 3 × 1\n##   date\n##   \n## 1 11_5\n## 2 4_7\n## 3 21_12\n```\n\
    \nBy default, the separator in the new column will be `_`. This is not what we\
    \ want for dates, but we can use the `sep` argument to change it.\n\n```\ntbl2|>unite(col\
    \ =\"date\", day, month,sep =\"/\")\n## # A tibble: 3 × 1\n##   date\n##   \n\
    ## 1 11/5\n## 2 4/7\n## 3 21/12\n```\n\nIf we want to keep the original columns\
    \ around, we can set the `remove` argument to `FALSE`.\n\n```\ntbl2|>unite(\n\
    col =\"date\", day, month,\nsep =\"/\",remove =FALSE\n)\n## # A tibble: 3 × 3\n\
    ##   date   day   month\n##      \n## 1 11/5   11    5\n## 2 4/7    4     7\n\
    ## 3 21/12  21    12\n```\n\nColumns that contain more than one value do not always\
    \ contain the same number of values. For example, we could have data such as the\
    \ number of casualties per major group in WW1 and WW2.\n\n```\nmilitary_casualties<-tribble(\n\
    ~war,~groups,~deaths,\n'WW1',\n\"Allied Powers/Central Powers\",\n\"5.7,4.0\"\
    ,\n'WW2',\n\"Germany/Japan/USSR/British Empire/USA\",\n\"5.3,2.1,10.7,0.6,0.4\"\
    \n)\n```\n\nThe groupings were not the same in the two wars, so we cannot split\
    \ the data into different columns. We can, however, divide it into more rows using\
    \ `separate_rows()`.\n\n```\nmilitary_casualties|>separate_rows(\ngroups, deaths,\n\
    sep =\"/|,\"\n)\n## # A tibble: 7 × 3\n##   war   groups          deaths\n## \
    \              \n## 1 WW1   Allied Powers   5.7\n## 2 WW1   Central Powers  4.0\n\
    ## 3 WW2   Germany         5.3\n## 4 WW2   Japan           2.1\n## 5 WW2   USSR\
    \            10.7\n## 6 WW2   British Empire  0.6\n## 7 WW2   USA            \
    \ 0.4\n```\n\nThe expression we use for `sep` says we should split on `/` or `,`\
    \ (where the `|` in the string is regular expression speak for \"or\").\n\nWe\
    \ might not want the deaths here to be strings, but with `convert = TRUE` we can\
    \ turn them into numbers:\n\n```\nmilitary_casualties|>separate_rows(\ngroups,\
    \ deaths,\nsep =\"/|,\",\nconvert =TRUE\n)\n## # A tibble: 7 × 3\n##   war   groups\
    \         deaths\n##              \n## 1 WW1   Allied Powers  5.7\n## 2 WW1  \
    \ Central Powers 4\n## 3 WW2   Germany        5.3\n## 4 WW2   Japan          2.1\n\
    ## 5 WW2   USSR           10.7\n## 6 WW2   British Empire 0.6\n## 7 WW2   USA\
    \            0.4\n```"
