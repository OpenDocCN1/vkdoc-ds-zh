  trans: "\n# 按名称选择列\n\n有多个函数允许你根据列名来选择列。`starts_with()` 函数会选择名称以特定字符串开头的列：\n\n```\n\
    tbl|>select(starts_with(\"min\"))\n## # A tibble: 2 × 2\n##   min_size min_weight\n\
    ##             \n## 1       13        45.2\n## 2       12        83.1\n```\n\n\
    类似地，`ends_with()` 函数允许你选择名称以特定字符串结尾的列：\n\n```\ntbl|>select(ends_with(\"weight\"\
    ))\n## # A tibble: 2 × 2\n##   min_weight max_weight\n##              \n## 1 \
    \      45.2       67.2\n## 2       83.1      102.\n```\n\n如果你想选择名称包含某个字符串的所有列，可以使用\
    \ `contains()` 函数：\n\n```\ntbl|>select(contains(\"_\"))\n## # A tibble: 2 × 4\n\
    ## min_size max_size min_weight max_weight\n##                    \n## 1     13\
    \       16       45.2       67.2\n## 2     12       17       83.1      102.\n\
    ```\n\n对于更复杂的匹配，`matches()` 函数允许你基于正则表达式来选择列。这里，我将再次选择名称中包含下划线的列，因为在这个示例表中实际上没有更复杂的选择需求：\n\
    \n```\ntbl|>select(matches(\".*_.*\"))\n## # A tibble: 2 × 4\n## min_size max_size\
    \ min_weight max_weight\n##                    \n## 1     13       16       45.2\
    \       67.2\n## 2     12       17       83.1      102.\n```\n\n## 选择所有列\n\n选择所有列似乎算不上什么功能，因为它只是返回原始表而已，但确实有一个函数\
    \ `everything()` 就是用来做这件事的。\n\n```\ntbl|>select(everything())\n## # A tibble:\
    \ 2 × 5\n##   sample min_size max_size min_weight max_weight\n##             \
    \           \n## 1 foo          13       16      45.2        67.2\n## 2 bar  \
    \        12       17      83.1       102.\n```\n\n当然，你不会在 `select()` 中使用这个函数，因为它什么也没做。但其他某些函数在对数据进行转换时需要你选择列，这时就可以使用\
    \ `everything()` 来选择数据框中的所有列。\n\n## 从最后一列开始索引\n\n如果你只想选择最后一列，可以使用 `last_col()`\
    \ 函数：\n\n```\ntbl|>select(last_col())\n## # A tibble: 2 × 1\n##   max_weight\n\
    ##        \n## 1       67.2\n## 2      102.\n```\n\n你也可以使用该函数通过从右侧开始索引来选择列。如果给它一个整数参数\
    \ `i`，它会选择从右边数第 `i` 列：\n\n```\ntbl|>select(last_col(0))\n## # A tibble: 2 × 1\n\
    ##   max_weight\n##       \n## 1      67.2\n## 2     102.\ntbl|>select(last_col(1))\n\
    ## # A tibble: 2 × 1\n##   min_weight\n##        \n## 1       45.2\n## 2     \
    \  83.1\ntbl|>select(last_col(2))\n## # A tibble: 2 × 1\n##    max_size\n##  \
    \     \n## 1        16\n## 2        17\ntbl|>select(last_col(3))\n## # A tibble:\
    \ 2 × 1\n##   min_size\n##      \n## 1       13\n## 2       12\n```\n\n当然，你也可以在范围中使用它：\n\
    \n```\ntbl|>select(last_col(3):last_col())\n## # A tibble: 2 × 4\n##   min_size\
    \ max_size min_weight max_weight\n##                     \n## 1       13     \
    \  16       45.2      67.2\n## 2       12       17       83.1     102.\n```\n\n\
    ## 从字符串中选择\n\n如果你有一个包含要选择的列名的字符串向量\n\n```\nvars<-c(\"min_size\",\"min_weight\"\
    )\n```\n\n你可以使用 `all_of()` 或 `any_of()` 函数来选择它们：\n\n```\ntbl|>select(all_of(vars))\n\
    ## # A tibble: 2 × 2\n##   min_size min_weight\n##         \n## 1       13   \
    \ 45.2\n## 2       12    83.1\ntbl|>select(any_of(vars))\n## # A tibble: 2 × 2\n\
    ##   min_size min_weight\n##           \n## 1       13      45.2\n## 2       12\
    \      83.1\n```\n\n这两个函数的区别在于，如果 `vars` 包含表中不存在的名称，`all_of()` 会将其视为错误，而 `any_of()`\
    \ 则不会。\n\n```\nvarsselect(all_of(vars))\n## Error in 'select()':\n## ! Can't subset\
    \ columns past the end.\n## x Column 'foo' doesn't exist.\ntbl|>select(any_of(vars))\n\
    ## # A tibble: 2 × 2\n##   min_size min_weight\n##         \n## 1       13   \
    \ 45.2\n## 2       12    83.1\n```\n\n## 根据内容选择列\n\n也许最强大的选择函数是 `where`。你需要将一个函数作为参数传递给它，该函数会应用于每一列，函数返回\
    \ `TRUE` 的列将被选中。\n\n例如，如果你只想要数值类型的列，可以使用 `where` 结合 `is.numeric`：\n\n```\ntbl|>select(where(is.numeric))\n\
    ## # A tibble: 2 × 4\n## min_size max_size min_weight max_weight\n##         \
    \        \n## 1     13       16     45.2      67.2\n## 2     12       17     83.1\
    \     102.\n```\n\n或者，如果你想要数值类型并且最大值大于 100 的列，你可以使用\n\n```\ntbl|>select(where(\\\
    (x)is.numeric(x)&&max(x)>100.0))\n## # A tibble: 2 × 1\n##   max_weight\n##  \
    \     \n## 1      67.2\n## 2     102.\n```\n\n（语法 `\\(args) body` 是 R 4 引入的，作为\
    \ `function(args)` body 的简短形式，但含义相同）。\n\n## 这是一种不断发展的语言，请留意变化\n\n支持整洁选择的函数所用的语言正在演变和成长，因此当你读到本文时，可能已经可以做更多事情了。请查阅\
    \ `select` 函数的文档\n\n```\n?select\n```\n\n以获取最新的描述。\n\n# 5. 重新格式化表格：tidyr\n\n即使只考虑表格数据，也仍然有许多不同的格式化方式。Tidyverse\
    \ 中的包期望数据以所谓的“整洁数据”（这也是 Tidyverse 名称的由来）形式表示。`tidyr` 包可以帮助你将数据格式化为整洁数据。\n\n你可以将\
    \ `tidyr` 作为 tidyverse 的一部分加载：\n\n```\nlibrary(tidyverse)\n```\n\n或者单独加载：\n\n\
    ```\nlibrary(tidyr)\n```\n\n## 整洁数据\n\n整洁数据的基本特征是每个变量占据一列，每个观测值占据一行。变量和观测值等术语在统计学中应该很熟悉，但整洁数据的特性表明，你不应该将一个变量的值放在不同的列中，也不应该将多个观测值放在同一行中。\n\
    \n考虑像这样的数据：\n\n```\nmean_income<-tribble(\n~country,~  '2001',~ '2002',~ '2003',~\
    \ '2004',~ '2005',\n\"Numenor\",  123456,  132654,  321646,  324156,  325416,\n\
    \"Westeros\", 314256,  432165,  546123,  465321,  561423,\n\"Narnia\",   432156,\
    \  342165,  564123,  543216,  465321,\n\"Gondor\",   531426,  321465,  235461,\
    \  463521,  561423,\n\"Laputa\",   14235,   34125,   45123,   51234,    54321\n\
    )\n```\n\n我们可以想象这个表格包含了 21 世纪头五年五个（虚构）国家的平均收入。假设你感兴趣的是，在考虑不同国家的情况下，收入随时间是否存在某种模式。为此，你可能会考虑一个诸如\
    \ `income ~ country + year` 的公式，但数据的格式并不便于实现这一点。如果年份是可以在模型中使用的变量，那么不同观测值（即实际的年份）被分割到不同列中就成问题了。同样，如果每年的平均收入是一个变量，那么一个国家所有观测值都在同一行中也成问题。你无法使用\
    \ `income ~ country + year`，因为数据不是整洁的。\n"
- fmt: "# Pivoting\n\nThe function `pivot_longer()` can merge several columns into\
    \ two—a key and a value column. The key column will be a discrete variable with\
    \ values taken from the column names, and the value column will contain the data\
    \ from the original columns.\n\nConsider the mean income data frame. We want the\
    \ actual years to be different outcomes of a year variable and have the income\
    \ for each year to be another variable, `income`. We can get such a tibble by\
    \ calling `pivot_longer()` with these parameters:\n\n```\nmean_income |> pivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"income\",\ncols = c(`2001`, `2001`, `2002`,\n\
    `2003`, `2004`, `2005`)\n)\n## # A tibble: 25 × 3\n##    country  year  income\n\
    ##          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002  132654\n##  3\
    \ Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor  2005  325416\n\
    ##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##  8 Westeros 2003\
    \  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005  561423\n## # . .\
    \ . with 15 more rows\n```\n\nThe first argument is the input data from `mean_income`,\
    \ and I provide it using the `|>` operator. This works exactly as if I had given\
    \ `mean_income` as the first argument to the function call, but using the operator\
    \ signals to the reader that `mean_income` is data flowing into the function and\
    \ different from other arguments because of it.\n\nThe `names_to` and `values_to`\
    \ arguments are the names of two new columns. In the `names_to` column, we get\
    \ the names of the columns we get the values from, and in the `value` column,\
    \ we get the matching values from those columns. The remaining parameters specify\
    \ which columns we wish to merge.\n\nIn the preceding example, I explicitly listed\
    \ all the columns to include, but `tidyr`’s functions support tidy select (see\
    \ Chapter [4](#476587_2_En_4_Chapter.xhtml)), so you can also use a range of columns,\
    \ like this:\n\n```\nmean_income|>pivot_longer(\nnames_to =\"year\",\nvalues_to\
    \ =\"income\",\ncols = '2001':'2005'\n)\n## # A tibble: 25 × 3\n##    country\
    \  year  income\n##          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002\
    \  132654\n##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor\
    \  2005  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##\
    \  8 Westeros 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005 \
    \ 561423\n## # . . . with 15 more rows\n```\n\nYou can use more than one range:\n\
    \n```\nmean_income|>pivot_longer(\nnames_to =\"year\",\nvalues_to =\"income\"\
    ,\ncols =c( '2001':'2002', '2004':'2005')\n)\n```\n\nbut the range specification\
    \ is only useful when the relevant columns are contiguous. You can also specify\
    \ the complement of the columns you want to merge using `!`. For example, if you\
    \ want to merge the years, you can pick all columns except for `country` rather\
    \ than pick all the years:\n\n```\nmean_income|>pivot_longer(\nnames_to =\"year\"\
    ,\nvalues_to =\"income\",\ncols =!country\n)\n## # A tibble: 25 × 3\n##    country\
    \  year  income\n##          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002\
    \  132654\n##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor\
    \  2005  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##\
    \  8 Westeros 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005 \
    \ 561423\n## # . . . with 15 more rows\n```\n\nYou can specify more than one column\
    \ in a complement, and you can combine complements with ranges.\n\nGenerally,\
    \ you can combine `pivot_longer()` with all the tidy selection functions to select\
    \ columns, for example, you can use `starts_with()` or combine `starts_with()`\
    \ and complement, `!`, or anything else the tidy selection language allows.\n\n\
    ```\nmean_income|>pivot_longer(\nnames_to =\"year\",\nvalues_to =\"income\",\n\
    starts_with(\"2\")\n)\n## # A tibble: 25 × 3\n##    country  year  income\n##\
    \          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002  132654\n##  3 Numenor\
    \  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor  2005  325416\n##\
    \  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##  8 Westeros 2003 \
    \ 546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005  561423\n## # . . .\
    \ with 15 more rows\nmean_income|>pivot_longer(\nnames_to =\"year\",\nvalues_to\
    \ =\"income\",\n!starts_with(\"c\")\n)\n## # A tibble: 25 × 3\n##    country \
    \ year  income\n##          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002\
    \  132654\n##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor\
    \  2005  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##\
    \  8 Westeros 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005 \
    \ 561423\n## # . . . with 15 more rows\n```\n\nThe column names that go into the\
    \ `names_to` column will be strings. If you need another type, such as logical\
    \ or numeric values, you can achieve that by setting the `names_transform` argument.\
    \ If we want all the years to be represented as integers, we could do this:\n\n\
    ```\nmean_income|>pivot_longer(\nnames_to =\"year\",\nvalues_to =\"income\",\n\
    !country,\nnames_transform =as.integer\n)\n## # A tibble: 25 × 3\n##    country\
    \  year  income\n##          \n##  1 Numenor  2001  123456\n##  2 Numenor  2002\
    \  132654\n##  3 Numenor  2003  321646\n##  4 Numenor  2004  324156\n##  5 Numenor\
    \  2005  325416\n##  6 Westeros 2001  314256\n##  7 Westeros 2002  432165\n##\
    \  8 Westeros 2003  546123\n##  9 Westeros 2004  465321\n## 10 Westeros 2005 \
    \ 561423\n## # . . . with 15 more rows\n```\n\nBecause all the years are integers,\
    \ the year column now contains integers. If we want to analyze this data set,\
    \ we most likely want to interpret the years as integers.\n\nIf we wanted factors\
    \ instead, though, we could also do that:\n\n```\nmean_income|>pivot_longer(\n\
    names_to =\"year\",\nvalues_to =\"income\",\n!country,\nnames_transform =as.factor\n\
    )\n```\n\nThere is a similar `values_transform` argument if you need to transform\
    \ the values that go into the `values_to` column.\n\nIf you work with functions\
    \ that do not expect tidy data and rather expect to find related data in different\
    \ columns, you can translate tidy data into that format using the `pivot_wider()`\
    \ function. It is the reverse of `pivot_longer()`.^([^(12)](#fn12))\n\n```\ntidy_incomepivot_longer(\n\
    names_to =\"year\",\nvalues_to =\"income\",\n!country\n)\ntidy_income|>pivot_wider(\n\
    names_from =\"year\",\nvalues_from =\"income\"\n)\n## # A tibble: 5 × 6\n##  \
    \ country `2001` `2002` `2003` `2004` `2005`\n##               \n## 1 Numenor\
    \  123456 132654 321646 324156 325416\n## 2 Westeros 314256 432165 546123 465321\
    \ 561423\n## 3 Narnia   432156 342165 564123 543216 465321\n## 4 Gondor   531426\
    \ 321465 235461 463521 561423\n## 5 Laputa    14235  34125  45123  51234  54321\n\
    ```\n\nThe `names_from` and `values_from` arguments pick the values to use as\
    \ column names and the values to put in those columns, respectively. They are\
    \ the same arguments that you would use for `pivot_longer()`’s `names_to` and\
    \ `values_to` arguments to translate the result back again."
  raw: "## Pivoting\n\nThe function `pivot_longer()` can merge several columns into\
