  trans: '

    # 9. 字符串处理：`stringr`


    `stringr` 包提供了字符串操作函数。当你加载 `tidyverse` 包时，该包也会被加载：


    ```

    library(tidyverse)

    ```


    你也可以单独加载该包：


    ```

    library(stringr)

    ```


    ## 统计字符串模式


    `str_count()` 函数用于统计字符串中包含的标记（token）数量，其中标记可以是字符或单词等。默认情况下，`str_count()` 会统计字符串中的字符数。


    ```

    strings <- c(

    "给我一个冰淇淋",

    "给你自己买个冰淇淋",

    "我们的冰淇淋都卖完了",

    "我尖叫，你尖叫，人人都爱冰淇淋。",

    "一个冰淇淋,

    两个冰淇淋,

    三个冰淇淋",

    "我想要一个冰淇淋。你想要一个冰淇淋吗？"

    )

    str_count(strings)

    ## [1]  10  11  12  16  14  18

    ```


    对于 `strings` 中的每个字符串，我们得到了字符数。结果与我们使用 `nchar()` 得到的结果相同（但不同于 `length()`，后者会返回包含这些字符串的列表长度，在此例中为
    6）。


    你可以通过为 `str_count()` 指定 `boundary()` 选项来明确要求其统计字符数。该选项决定了标记之间的边界（如字符、单词、行等），也就是计数的单位。


    ```

    str_count(strings,boundary("character"))

    ## [1]  10  11  12  16  14  18

    ```


    如果你想统计单词数量，可以使用 `boundary("word")`：


    ```

    str_count(strings, boundary("word"))

    ## [1]  5  5  7  8  9  11

    ```


    你还可以在 `boundary()` 中使用另外两个选项：`"line_break"` 和 `"sentence"`。它们会根据语言环境（`locale()`）使用启发式规则来判断文本包含多少换行符和句子。


    ```

    str_count(strings, boundary("line_break"))

    ## [1]  5  5  7  8  11  11

    str_count(strings, boundary("sentence"))

    ## [1]  1  1  1  1  3  2

    ```


    请注意，这里的换行符并非文本中的换行符。这些换行符是指在你所使用的 `locale()` 中期望放置换行符的位置。


    最后，`str_count()` 可以让你统计子字符串在字符串中出现的次数：


    ```

    str_count(strings, "冰淇淋")

    ## [1]  1  1  1  1  3 2

    str_count(strings, "冰") # 也统计到了“冰”字

    ## [1]  2  1  4  3  6  4

    ```


    你要求 `str_count()` 统计的模式不仅仅是一个字符串。它实际上是一个正则表达式。某些字符在正则表达式中具有特殊含义。^(¹⁷) 例如，点号（`.`）代表任意单个字符，而不是句号。


    ```

    str_count(strings, ".")

    ## [1]  10  11  12  16  14  18

    ```


    如果你希望将模式作为字面字符串处理，而不是正则表达式，可以将其包裹在 `fixed()` 中：


    ```

    str_count(strings, fixed("。"))

    ## [1]  0  0  0  1  0  1

    ```


    由于该模式是正则表达式，我们可以使用它来统计标点符号：


    ```

    str_count(strings, "[[:punct:]]")

    ## [1]  0  0  0  1  1  2

    ```


    或者统计字符串末尾出现“冰淇淋”的次数：


    ```

    str_count(strings, "冰淇淋$")

    ## [1]  1  1  1  0  1  0

    ```


    这里的 `$` 表示字符串的末尾。更准确地说，除了末尾可能后跟一个标点符号外，它表示在字符串的末尾。


    ```

    str_count(strings, "冰淇淋[[:punct:]]?$")

    ## [1]  1  1  1  1  1  1

    ```


    ## 拆分字符串


    有时，你需要根据某个分隔符来拆分字符串——这与在逗号分隔值（CSV）文件中根据逗号进行拆分类似。`stringr` 包中用于此功能的函数是 `str_split()`。


    例如，我们可以按空格拆分：


    ```

    strings <- c(

    "一",

    "二",

    "一 二",

    "一  二",

    "一。 二。"

    )

    str_split(strings, " ")

    ## [[1]]

    ## [1] "一"

    ##

    ## [[2]]

    ## [1] "二"

    ##

    ## [[3]]

    ## [1] "一" "二"

    ##

    ## [[4]]

    ## [1] "一" ""  ""  "二"

    ##

    ## [[5]]

    ## [1] "一。" "二。"

    ```


    由于我们是按单个空格进行拆分，对于包含三个空格的 `"一  二"`，我们会得到空字符串。如果你希望任意长度的空格序列都作为分隔符，可以这样操作：


    ```

    str_split(strings, "[[:space:]]+")

    ## [[1]]

    ## [1] "一"

    ##

    ## [[2]]

    ## [1] "二"

    ##

    ## [[3]]

    ## [1] "一" "二"

    ##

    ## [[4]]

    ## [1] "一" "二"

    ##

    ## [[5]]

    ## [1] "一。" "二。"

    ```


    你也可以使用 `boundary()` 函数进行拆分。例如，你可以使用 `boundary("word")` 将字符串拆分成单词：


    ```

    str_split(strings, boundary("word"))

    ## [[1]]

    ## [1] "一"

    ##

    ## [[2]]

    ## [1] "二"

    ##

    ## [[3]]

    ## [1] "一" "二"

    ##

    ## [[4]]

    ## [1] "一" "二"

    ##

    ## [[5]]

    ## [1] "一" "二"

    ```


    这样操作时，我们排除了第一次尝试中出现的空字符串，同时去掉了最后一个字符串中的句号。


    ## 字符串大小写转换


    你可以使用 `str_to_lower()` 将字符串转换为全小写。


    ```

    macdonald <- "Old MACDONALD had a farm."

    str_to_lower(macdonald)

    ## [1] "old macdonald had a farm."

    ```


    同样，你可以使用 `str_to_upper()` 将其转换为全大写。


    ```

    str_to_upper(macdonald)

    ## [1] "OLD MACDONALD HAD A FARM."

    ```


    如果使用 `str_to_sentence()`，则首字母大写，其余字母小写。


    ```

    str_to_sentence(macdonald)

    ## [1] "Old macdonald had a farm."

    ```


    `str_to_title()` 函数会将字符串中的所有单词首字母大写。


    ```

    str_to_title(macdonald)

    ## [1] "Old Macdonald Had A Farm."

    ```

    '
- fmt: '# Wrapping, Padding, and Trimming


    If you want to wrap strings, that is, add newlines, so they fit into a certain
    width, you can use `str_wrap()`.


    ```

    strings <- c(

    "Give me an ice cream",

    "Get yourself an ice cream",

    "We are all out of ice creams",

    "I scream, you scream, everybody loves ice cream.",

    "one ice cream,

    two ice creams,

    three ice creams",

    "I want an ice cream. Do you want an ice cream?"

    )

    str_wrap(strings)

    ## [1] "Give me an ice cream"

    ## [2] "Get yourself an ice cream"

    ## [3] "We are all out of ice creams"

    ## [4] "I scream, you scream, everybody loves ice cream."

    ## [5] "one ice cream, two ice creams, three ice creams"

    ## [6] "I want an ice cream. Do you want an ice cream?"

    ```


    The default width is 80 characters, but you can change that using the `width`
    argument.


    ```

    str_wrap(strings, width = 10)

    ## [1] "Give me an\nice cream"

    ## [2] "Get\nyourself\nan ice\ncream"

    ## [3] "We are all\nout of ice\ncreams"

    ## [4] "I scream,\nyou\nscream,\neverybody\nloves ice\ncream."

    ## [5] "one ice\ncream,\ntwo ice\ncreams,\nthree ice\ncreams"

    ## [6] "I want an\nice cream.\nDo you\nwant an\nice cream?"

    ```


    You can indent the first line in the strings while wrapping them using the `indent`
    argument.


    ```

    str_wrap(strings, width = 10, indent = 2)

    ## [1] " Give\nme an ice\ncream"

    ## [2] " Get\nyourself\nan ice\ncream"

    ## [3] " We are\nall out of\nice creams"

    ## [4] " I\nscream,\nyou\nscream,\neverybody\nloves ice\ncream."

    ## [5] " one ice\ncream,\ntwo ice\ncreams,\nthree ice\ncreams"

    ## [6] " I want\nan ice\ncream. Do\nyou want\nan ice\ncream?"

    ```


    If you want your string to be left, right, or center justified, you can use `str_pad()`.


    The default is right-justifying strings.


    ```

    str_pad(strings, width = 50)

    ## [1] "                             Give me an ice cream"

    ## [2] "                        Get yourself an ice cream"

    ## [3] "                     We are all out of ice creams"

    ## [4] " I scream, you scream, everybody loves ice cream."

    ## [5] "one ice cream,\n two ice creams,\n   three ice creams"

    ## [6] "   I want an ice cream. Do you want an ice cream?"

    ```


    If you want to left-justify instead, you can pass `"right"` to the `side` argument.


    ```

    str_pad(strings, width = 50, side = "right")

    ## [1] "Give me an ice cream                             "

    ## [2] "Get yourself an ice cream                        "

    ## [3] "We are all out of ice creams                     "

    ## [4] "I scream, you scream, everybody loves ice cream. "

    ## [5] "one ice cream,\n   two ice creams,\n   three ice creams"

    ## [6] "I want an ice cream. Do you want an ice cream?   "

    ```


    You need to use `"right"` to left-justify because the `side` argument determines
    which side to pad, and for left-justified text, the padding is on the right.


    If you want to center your text, you should use `"both"`; you are padding both
    on the left and on the right.


    ```

    str_pad(strings, width = 50, side = "both")

    ## [1] "           Give me an ice cream                   "

    ## [2] "           Get yourself an ice cream              "

    ## [3] "           We are all out of ice creams           "

    ## [4] " I scream, you scream, everybody loves ice cream. "

    ## [5] "one ice cream,\n   two ice creams,\n   three ice creams"

    ## [6] " I want an ice cream. Do you want an ice cream?   "

    ```


    In these padding examples, we do not keep the lengths of the strings below the
    padding width. If a string is longer than the padding width, it is unchanged.
    You can use the `str_trunc()` function to cut the width down to a certain value.
    For example, we could truncate all the strings to width 25 before we pad them:


    ```

    strings |> str_trunc(25) |> str_pad(width = 25, side = "left")

    ## [1] " Give me an ice cream"

    ## [2] "Get yourself an ice cream"

    ## [3] "We are all out of ice ..."

    ## [4] "I scream, you scream, ..."

    ## [5] " one ice cream,\n  two..."

    ## [6] "I want an ice cream. D..."

    ```


    The `str_trim()` function removes whitespace to the left and right of a string:


    ```

    str_trim(c(

    " one small coke",

    "two large cokes ",

    " three medium cokes "

    ))

    ## [1] "one small coke"   "two large cokes"

    ## [3] "three medium cokes"

    ```


    It keeps whitespace inside the string.


    Since `str_trim()` does not touch whitespace that is not flanking on the left
    or right, we cannot use it to remove extra spaces inside our string. For example,
    if we have two spaces between two words, as follows, `str_trim()` leaves them
    alone:


    ```

    str_trim(c(

    " one small coke",

    "two  large cokes ",

    " three medium cokes "

    ))

    ## [1] "one small coke"  "two  large cokes"

    ## [3] "three medium cokes"

    ```


    If we want the two spaces to be shortened into a single space, we can use `str_squish()`
    instead.


    ```

    str_squish(c(

    " one small coke",

    "two large cokes ",

    " three medium cokes "

    ))

    ## [1] "one small coke"  "two large cokes"

    ## [3] "three medium cokes"

    ```


    ## Detecting Substrings


    To check if a substring is found in another string, you can use `str_detect()`.


    ```

    str_detect(strings,"me")

    ## [1]    TRUE FALSE FALSE FALSE FALSE FALSE

    str_detect(strings,"I")

    ## [1] FALSE FALSE FALSE  TRUE FALSE  TRUE

    str_detect(strings,"cream")

    ## [1] TRUE TRUE TRUE TRUE TRUE TRUE

    ```


    The pattern is a regular expression, so to test for ice cream followed by a full
    stop, you cannot search for “ice cream.”.


    ```

    str_detect(strings, "ice cream.")

    ## [1] FALSE FALSE  TRUE  TRUE  TRUE  TRUE

    ```


    You can, again, use a `fixed()` string.


    ```

    str_detect(strings, fixed("ice cream."))

    ## [1] FALSE FALSE FALSE  TRUE FALSE  TRUE

    ```


    Alternatively, you can escape the dot.


    ```

    str_detect(strings,"ice cream\\.")

    ## [1] FALSE FALSE FALSE  TRUE FALSE  TRUE

    ```


    You can test if a substring is *not* found in a string by setting the `negate`
    argument to `TRUE`.


    ```

    str_detect(strings,fixed("ice cream."),negate =TRUE)

    ## [1]  TRUE  TRUE  TRUE FALSE  TRUE FALSE

    ```


    Two special case functions test for a string at the start or end of a string:


    ```

    str_starts(strings,"I")

    ## [1] FALSE FALSE FALSE  TRUE FALSE  TRUE

    str_ends(strings,fixed("."))

    ## [1] FALSE FALSE FALSE  TRUE FALSE FALSE

    ```


    If you want to know where a substring is found, you can use `str_locate()`. It
    will give you the start and end index where it found a match.


    ```

    str_locate(strings, "ice cream")

    ##     start end

    ## [1,]   12  20

    ## [2,]   17  25

    ## [3,]   19  27

    ## [4,]   39  47

    ## [5,]    5  13

    ## [6,]   11  19

    ```


    Here, you get a start and end index for each string, but string number six has
    more than one occurrence of the pattern.


    ```

    strings[6]

    ## [1] "I want an ice cream. Do you want an ice cream?"

    ```


    You only get the indices for the first occurrence when you use `str_locate()`.


    ```

    str_locate(strings[6], "ice cream")

    ##     start end

    ## [1,]   11  19

    ```


    The function `str_locate_all()` gives you all occurrences.


    ```

    str_locate_all(strings[6],"ice cream")

    ## [[1]]

    ##      start end

    ## [1,]    11  19

    ## [2,]    37  45

    ```


    If you want the start and end points of the strings *between* the occurrences,
    you can use `invert_match()`.


    ```

    ice_cream_locations <- str_locate_all(strings[6], "ice cream")

    ice_cream_locations

    ## [[1]]

    ##      start end

    ## [1,]    11  19

    ## [2,]    37  45

    invert_match(ice_cream_locations[[1]])

    ##     start end

    ## [1,]    0  10

    ## [2,]   20  36

    ## [3,]   46  -1

    ```


    ## Extracting Substrings


    To extract a substring matching a pattern, you can use `str_extract()`. It gives
    you the first substring that matches a regular expression.


    ```

    str_extract(strings, "(s|ice )cream\\w*")

    ## [1] "ice cream" "ice cream" "ice creams"

    ## [4] "scream"    "ice cream" "ice cream"

    ```


    It only gives you the first match, but if you want all substrings that match,
    you can use `str_extract_all()`.


    ```

    strings[4]

    ## [1] "I scream, you scream, everybody loves ice cream."

    str_extract(strings[4], "(s|ice )cream\\w*")

    ## [1] "scream"

    str_extract_all(strings[4], "(s|ice )cream\\w*")

    ## [[1]]

    ## [1] "scream"   "scream"   "ice cream"

    ```'
