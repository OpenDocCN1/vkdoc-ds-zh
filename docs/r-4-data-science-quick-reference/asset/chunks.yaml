- fmt: "# Joining Tables\n\nIt is not uncommon to have your data in more than one\
    \ table. This could be because the tables are created from different calculations,\
    \ for example, different kinds of summaries, or it can be because you got the\
    \ data from different files.\n\nIf you merely need to combine tables by row or\
    \ column, then you can use the `bind_rows()` and `bind_cols()` functions which\
    \ do precisely what you would expect.\n\n```\ndf1  \n## 1 a1    b1\n## 2 a2  \
    \  b2\n## 3 a3    b3\n## 4 a4    b4\nbind_cols(df1, df3)\n## # A tibble: 2 × 4\n\
    ##   A     B     C     D\n##      \n## 1 a1    b1    c1    d1\n## 2 a2    b2 \
    \   c2    d2\n```\n\nWhen you combine rows, the tables must have the same columns,\
    \ and when you combine by column, the tables must have the same number of rows.\n\
    \nIf you have tables that represent different relations between variables—the\
    \ underlying principle of relational databases aimed at avoiding duplicated data—then\
    \ you can combine them using join functions.\n\nSay you have a table that maps\
    \ students to grades for each class you teach. You can join tables from two different\
    \ classes using `inner_join()`. You use a key to join them on, specified by argument\
    \ `by`.\n\n```\ngrades_maths              \n## 1 Marko Polo     D       F\n##\
    \ 2 Isaac Newton   A+      D\n## 3 Charles Darwin B       A+\n```\n\nThis tells\
    \ `inner_join()` that you want to combine all rows in the first table with all\
    \ rows in the second, where the two rows have the same name. You can use more\
    \ than one key in a join if you give `by` a vector of variable names.\n\nEarlier,\
    \ each name appears once per table. If a key appears more than once, then the\
    \ result of an inner join will have a list with all combinations of rows sharing\
    \ a name.\n\n```\ngrades_maths2               \n## 1 Marko Polo      D       F\n\
    ## 2 Isaac Newton    A+      D\n## 3 Isaac Newton    A+      D\n## 4 Charles Darwin\
    \  B       A+\n## 5 Charles Darwin  B       A+\ninner_join(grades_maths2, grades_biology2,\
    \ by = \"grade\")\n## # A tibble: 5 × 3\n##   name.x          grade name.y\n##\
    \               \n## 1 Marko Polo      D     Isaac Newton\n## 2 Isaac Newton \
    \   A+    Charles Darwin\n## 3 Isaac Newton    A+    Charles Darwin\n## 4 Isaac\
    \ Newton    A+    Charles Darwin\n## 5 Isaac Newton    A+    Charles Darwin\n\
    ```\n\nIn the last join, you see that you can get the same line multiple times\
    \ from an inner join. Combine the join with `distinct()` if you want to avoid\
    \ this.\n\n```\ninner_join(grades_maths2, grades_biology2, by = \"grade\") |>\
    \ distinct()\n## # A tibble: 2 × 3\n##   name.x          grade name.y\n##    \
    \           \n## 1 Marko Polo      D     Isaac Newton\n## 2 Isaac Newton    A+\
    \    Charles Darwin\n```\n\nThe tables can have different variables—if they represent\
    \ different relations—or they can share several or all variables. In the grade\
    \ example, each table contains the same name/grade relationships, just for different\
    \ classes. Therefore, they also share variables.\n\nWith shared variables, the\
    \ data from the two tables can be differentiated by a suffix. The default, see\
    \ above, is `.x` and `.y`. You can change that using the `suffix` argument.\n\n\
    ```\ninner_join(\ngrades_maths, grades_biology,\nby = \"name\", suffix = c(\"\
    .maths\", \".biology\")\n)\n## # A tibble: 3 × 3\n##   name            grade.maths\
    \ grade.biology\n##                     \n## 1 Marko Polo      D           F\n\
    ## 2 Isaac Newton    A+          D\n## 3 Charles Darwin  B           A+\n```\n\
    \nStudents might take different classes, and you have several choices on how to\
    \ combine tables with different keys.\n\nAn `inner_join()` will only give you\
    \ the rows where a key is in both tables.\n\n```\ngrades_geography           \
    \           \n## 1 Charles Darwin A               C\n```\n\nThe `full_join()`\
    \ function, in contrast, gives you a table containing all keys. If a key is only\
    \ found in one of the tables, the variables from the other table will be set to\
    \ `NA`.\n\n```\nfull_join(\ngrades_geography, grades_physics,\nby = \"name\",\
    \ suffix = c(\".geography\", \".physics\")\n)\n## # A tibble: 5 × 3\n##   name\
    \            grade.geography grade.physics\n##                         \n## 1\
    \ Marko Polo      A               \n## 2 Charles Darwin  A               C\n##\
    \ 3 Immanuel Kant   A+              \n## 4 Isaac Newton                A+\n##\
    \ 5 Albert Einstein             A+\n```\n\nIf you want all keys from the left\
    \ or right table (but not both left and right)—potentially with `NA` if the other\
    \ table does not have the key—then you need `left_join()` or `right_join()`.\n\
    \n```\nleft_join(\ngrades_geography, grades_physics,\nby = \"name\", suffix =\
    \ c(\".geography\", \".physics\")\n)\n## # A tibble: 3 × 3\n##   name        \
    \    grade.geography grade.physics\n##                         \n## 1 Marko Polo\
    \      A               \n## 2 Charles Darwin  A               C\n## 3 Immanuel\
    \ Kant   A+              \nright_join(\ngrades_maths, grades_physics,\nby = \"\
    name\", suffix = c(\".maths\", \".physics\")\n)\n## # A tibble: 3 × 3\n##   name\
    \            grade.maths grade.physics\n##                     \n## 1 Isaac Newton\
    \    A+          A+\n## 2 Charles Darwin  B           C\n## 3 Albert Einstein\
    \         A+\n```\n\nA `semi_join()` will give you all the rows in the first table\
    \ that contains a key in the second table.\n\n```\nsemi_join(\ngrades_maths2,\
    \ grades_biology2,\nby = \"name\", suffix = c(\".geography\", \".physics\")\n\
    )\n## # A tibble: 4 × 2\n##   name            grade\n##              \n## 1 Marko\
    \ Polo      D\n## 2 Isaac Newton    A+\n## 3 Isaac Newton    A+\n## 4 Charles\
    \ Darwin  B\n```\n\nYou only get one copy per row in the first table when a key\
    \ matches, regardless of how many times the key appears in the second table.\n\
    \nThis is unlike `inner_join()` where you get all combinations of rows from the\
    \ two tables. The `inner_join()` is, therefore, not an analogue to an `inner_join()`\
    \ combined with a `select()`.\n\n```\ninner_join(\ngrades_maths2, grades_biology2,\n\
    by = \"name\", suffix = c(\".geography\", \".physics\")\n) |> select(1:2)\n##\
    \ # A tibble: 5 × 2\n##   name            grade.geography\n##              \n\
    ## 1 Marko Polo      D\n## 2 Isaac Newton    A+\n## 3 Isaac Newton    A+\n## 4\
    \ Charles Darwin  B\n## 5 Charles Darwin  B\n```\n\nYou can still get multiple\
    \ identical rows from a `semi_join()`. If the first table has duplicated rows,\
    \ you will get the same duplication of the rows. If you do not want that, you\
    \ can combine the join with `distinct()`.\n\nAn `anti_join()` gives you all the\
    \ rows in the first table where the key or keys are not found in the second table.\
    \ Think of it as the complement of `semi_join()`.\n\n```\nanti_join(\ngrades_maths2,\
    \ grades_physics,\nby = \"name\", suffix = c(\".geography\", \".physics\")\n)\n\
    ## # A tibble: 1 × 2\n##   name            grade\n##              \n## 1 Marko\
    \ Polo      D\n```\n\nThe join functions only take two tables as input so you\
    \ might wonder how you can combine multiple tables. One solution is to use `purrr`'s\
    \ `reduce()` function.\n\n```\ngrades \nreduce(full_join, by = \"name\") |>\n\
    rename_at(2:5, ~ c(\"maths\", \"biology\", \"geography\", \"physics\"))\n## #\
    \ A tibble: 5 × 5\n##   name            maths biology geography physics\n##  \
    \                     \n## 1 Marko Polo      D     F       A         \n## 2 Isaac\
    \ Newton    A+    D             A+\n## 3 Charles Darwin  B     A+      A     \
    \    C\n## 4 Immanuel Kant         A+        \n## 5 Albert Einstein          \
    \   A+\n```\n\nThe `rename_at()` function works similarly to `select_at()`, and\
    \ here, I use it to rename the last four columns."
  raw: "## Joining Tables\n\nIt is not uncommon to have your data in more than one\
    \ table. This could be because the tables are created from different calculations,\
    \ for example, different kinds of summaries, or it can be because you got the\
    \ data from different files.\n\nIf you merely need to combine tables by row or\
    \ column, then you can use the `bind_rows()` and `bind_columns()` functions which\
    \ do precisely what you would expect.\n\n```\ndf1  \n## 1 a1    b1\n## 2 a2  \
    \  b2\n## 3 a3    b3\n## 4 a4    b4\nbind_cols(df1, df3)\n## # A tibble: 2 × 4\n\
    ##   A     B     C     D\n##      \n## 1 a1    b1    c1    d1\n## 2 a2    b2 \
    \   c2    d2\n```\n\nWhen you combine rows, the tables must have the same columns,\
    \ and when you combine by column, the tables must have the same number of rows.\n\
    \nIf you have tables that represent different relations between variables—the\
    \ underlying principle of relational databases aimed at avoiding duplicated data—then\
    \ you can combine them using join functions.\n\nSay you have a table that maps\
    \ students to grades for each class you teach. You can join tables from two different\
    \ classes using `inner_join()` . You use a key to join them on, specified by argument\
    \ `by`.\n\n```\ngrades_maths              \n## 1 Marko Polo     D       F\n##\
    \ 2 Isaac Newton   A+      D\n## 3 Charles Darwin B       A+\n```\n\nThis tells\
    \ `inner_join()` that you want to combine all rows in the first table with all\
    \ rows in the second, where the two rows have the same name. You can use more\
    \ than one key in a join if you give `by` a vector of variable names.\n\nEarlier,\
    \ each name appears once per table. If a key appears more than once, then the\
    \ result of an inner join will have a list with all combinations of rows sharing\
    \ a name.\n\n```\ngrades_maths2               \n## 1 Marko Polo      D       F\n\
    ## 2 Isaac Newton    A+      D\n## 3 Isaac Newton    A+      D\n## 4 Charles Darwin\
    \  B       A+\n## 5 Charles Darwin  B       A+\ninner_join(grades_maths2, grades_biology2,\
    \ by = \"grade\")\n## # A tibble: 5 × 3\n##   name.x          grade name.y\n##\
    \               \n## 1 Marko Polo      D     Isaac Newton\n## 2 Isaac Newton \
    \   A+    Charles Darwin\n## 3 Isaac Newton    A+    Charles Darwin\n## 4 Isaac\
    \ Newton    A+    Charles Darwin\n## 5 Isaac Newton    A+    Charles Darwin\n\
    ```\n\nIn the last join, you see that you can get the same line multiple times\
    \ from an inner join. Combine the join with `distinct()` if you want to avoid\
    \ this.\n\n```\ninner_join(grades_maths2, grades_biology2, by = \"grade\") |>\
    \ distinct()\n## # A tibble: 2 × 3\n##   name.x          grade name.y\n##    \
    \           \n## 1 Marko Polo      D     Isaac Newton\n## 2 Isaac Newton    A+\
    \    Charles Darwin\n```\n\nThe tables can have different variables—if they represent\
    \ different relations—or they can share several or all variables. In the grade\
    \ example, each table contains the same name/grade relationships, just for different\
    \ classes. Therefore, they also share variables.\n\nWith shared variables, the\
    \ data from the two tables can be differentiated by a suffix. The default, see\
    \ above, is “.x” and “.y”. You can change that using the `suffix` argument .\n\
    \n```\ninner_join(\ngrades_maths, grades_biology,\nby = \"name\", suffix = c(\"\
    .maths\", \".biology\")\n)\n## # A tibble: 3 × 3\n##   name            grade.maths\
    \ grade.biology\n##                     \n## 1 Marko Polo      D           F\n\
    ## 2 Isaac Newton    A+          D\n## 3 Charles Darwin  B           A+\n```\n\
    \nStudents might take different classes, and you have several choices on how to\
    \ combine tables with different keys.\n\nAn `inner_join()` will only give you\
    \ the rows where a key is in both tables.\n\n```\ngrades_geography           \
    \           \n## 1 Charles Darwin A               C\n```\n\nThe `full_join()`\
    \ function , in contrast, gives you a table containing all keys. If a key is only\
    \ found in one of the tables, the variables from the other table will be set to\
    \ `NA`.\n\n```\nfull_join(\ngrades_geography, grades_physics,\nby = \"name\",\
    \ suffix = c(\".geography\", \".physics\")\n)\n## # A tibble: 5 × 3\n##   name\
    \            grade.geography grade.physics\n##                         \n## 1\
    \ Marko Polo      A               \n## 2 Charles Darwin  A               C\n##\
    \ 3 Immanuel Kant   A+              \n## 4 Isaac Newton                A+\n##\
    \ 5 Albert Einstein             A+\n```\n\nIf you want all keys from the left\
    \ or right table (but not both left and right)—potentially with `NA` if the other\
    \ table does not have the key—then you need `left_join()` or `right_join()` .\n\
    \n```\nleft_join(\ngrades_geography, grades_physics,\nby = \"name\", suffix =\
    \ c(\".geography\", \".physics\")\n)\n## # A tibble: 3 × 3\n##   name        \
    \    grade.geography grade.physics\n##                         \n## 1 Marko Polo\
    \      A               \n## 2 Charles Darwin  A               C\n## 3 Immanuel\
    \ Kant   A+              \nright_join(\ngrades_maths, grades_physics,\nby = \"\
    name\", suffix = c(\".maths\", \".physics\")\n)\n## # A tibble: 3 × 3\n##   name\
    \            grade.maths grade.physics\n##                     \n## 1 Isaac Newton\
    \    A+          A+\n## 2 Charles Darwin  B           C\n## 3 Albert Einstein\
    \         A+\n```\n\nA `semi_join()` will give you all the rows in the first table\
    \ that contains a key in the second table.\n\n```\nsemi_join(\ngrades_maths2,\
    \ grades_biology2,\nby = \"name\", suffix = c(\".geography\", \".physics\")\n\
    )\n## # A tibble: 4 × 2\n##   name            grade\n##              \n## 1 Marko\
    \ Polo      D\n## 2 Isaac Newton    A+\n## 3 Isaac Newton    A+\n## 4 Charles\
    \ Darwin  B\n```\n\nYou only get one copy per row in the first table when a key\
    \ matches, regardless of how many times the key appears in the second table.\n\
    \nThis is unlike `inner_join()` where you get all combinations of rows from the\
    \ two tables. The `inner_join()` is, therefore, not an analogue to an `inner_join()`\
    \ combined with a `select()`.\n\n```\ninner_join(\ngrades_maths2, grades_biology2,\n\
    by = \"name\", suffix = c(\".geography\", \".physics\")\n) |> select(1:2)\n##\
    \ # A tibble: 5 × 2\n##   name            grade.geography\n##              \n\
    ## 1 Marko Polo      D\n## 2 Isaac Newton    A+\n## 3 Isaac Newton    A+\n## 4\
    \ Charles Darwin  B\n## 5 Charles Darwin  B\n```\n\nYou can still get multiple\
    \ identical rows from a `semi_join()`. If the first table has duplicated rows,\
    \ you will get the same duplication of the rows. If you do not want that, you\
    \ can combine the join with `distinct()`.\n\nAn `anti_join()` gives you all the\
    \ rows in the first table where the key or keys are not found in the second table.\
    \ Think of it as the complement of `semi_join()`.\n\n```\nanti_join(\ngrades_maths2,\
    \ grades_physics,\nby = \"name\", suffix = c(\".geography\", \".physics\")\n)\n\
    ## # A tibble: 1 × 2\n##   name            grade\n##              \n## 1 Marko\
    \ Polo      D\n```\n\nThe join functions only take two tables as input so you\
    \ might wonder how you can combine multiple tables. One solution is to use `purrr`’s\
    \ `reduce()` function :\n\n```\ngrades \nreduce(full_join, by = \"name\") |>\n\
    rename_at(2:5, ~ c(\"maths\", \"biology\", \"geography\", \"physics\"))\n## #\
    \ A tibble: 5 × 5\n##   name            maths biology geography physics\n##  \
    \                     \n## 1 Marko Polo      D     F       A         \n## 2 Isaac\
    \ Newton    A+    D             A+\n## 3 Charles Darwin  B     A+      A     \
    \    C\n## 4 Immanuel Kant         A+        \n## 5 Albert Einstein          \
    \   A+\n```\n\nThe `rename_at()` function works similarly to `select_at()`, and\
    \ here, I use it to rename the last four columns."
  trans: "\n# 连接表\n\n你的数据分布在多个表中是很常见的情况。这可能是由于表格是根据不同的计算（例如不同类型的汇总）创建的，也可能是因为你从不同文件中获取了数据。\n\
    \n如果你只需要按行或按列合并表格，那么可以使用 `bind_rows()` 和 `bind_cols()` 函数，它们的功能正如你所预期的那样。\n\n\
    ```\ndf1  \n## 1 a1    b1\n## 2 a2    b2\n## 3 a3    b3\n## 4 a4    b4\nbind_cols(df1,\
    \ df3)\n## # A tibble: 2 × 4\n##   A     B     C     D\n##      \n## 1 a1    b1\
    \    c1    d1\n## 2 a2    b2    c2    d2\n```\n\n当你按行合并时，表格必须有相同的列；当你按列合并时，表格必须有相同的行数。\n\
    \n如果你有代表变量之间不同关系的表格（这是关系数据库旨在避免数据重复的基本原则），那么你可以使用连接函数来合并它们。\n\n假设你有一个表格，记录了你所教的每个班级中学生与成绩的对应关系。你可以使用\
    \ `inner_join()` 来连接两个不同班级的表格。你需要用一个键来指定连接依据，该键由参数 `by` 设定。\n\n```\ngrades_maths\
    \              \n## 1 Marko Polo     D       F\n## 2 Isaac Newton   A+      D\n\
    ## 3 Charles Darwin B       A+\n```\n\n这告诉 `inner_join()`，你希望将第一个表中所有行与第二个表中所有行进行合并，合并条件是两行具有相同的姓名。如果你给\
    \ `by` 参数传递一个变量名称的向量，你可以在一次连接中使用多个键。\n\n在前面，每个姓名在每个表中仅出现一次。如果一个键出现多次，那么内连接的结果会生成一个包含该姓名下所有行组合的列表。\n\
    \n```\ngrades_maths2               \n## 1 Marko Polo      D       F\n## 2 Isaac\
    \ Newton    A+      D\n## 3 Isaac Newton    A+      D\n## 4 Charles Darwin  B\
    \       A+\n## 5 Charles Darwin  B       A+\ninner_join(grades_maths2, grades_biology2,\
    \ by = \"grade\")\n## # A tibble: 5 × 3\n##   name.x          grade name.y\n##\
    \               \n## 1 Marko Polo      D     Isaac Newton\n## 2 Isaac Newton \
    \   A+    Charles Darwin\n## 3 Isaac Newton    A+    Charles Darwin\n## 4 Isaac\
    \ Newton    A+    Charles Darwin\n## 5 Isaac Newton    A+    Charles Darwin\n\
    ```\n\n在最后这次连接中，你会看到内连接可能会多次返回相同的行。如果你希望避免这种情况，可以将连接与 `distinct()` 结合使用。\n\n```\n\
    inner_join(grades_maths2, grades_biology2, by = \"grade\") |> distinct()\n## #\
    \ A tibble: 2 × 3\n##   name.x          grade name.y\n##               \n## 1\
    \ Marko Polo      D     Isaac Newton\n## 2 Isaac Newton    A+    Charles Darwin\n\
    ```\n\n这些表格可以拥有不同的变量（如果它们代表不同的关系），也可以共享部分或全部变量。在上述成绩的例子中，每个表格都包含相同的姓名/成绩关系，只是针对不同的班级。因此，它们也共享变量。\n\
    \n当存在共享变量时，可以通过后缀来区分来自两个表格的数据。默认的后缀，如上所示，是 `.x` 和 `.y`。你可以使用 `suffix` 参数来更改它们。\n\
    \n```\ninner_join(\ngrades_maths, grades_biology,\nby = \"name\", suffix = c(\"\
    .maths\", \".biology\")\n)\n## # A tibble: 3 × 3\n##   name            grade.maths\
    \ grade.biology\n##                     \n## 1 Marko Polo      D           F\n\
    ## 2 Isaac Newton    A+          D\n## 3 Charles Darwin  B           A+\n```\n\
    \n学生可能选择不同的课程，因此你有多种选择来合并包含不同键的表格。\n\n`inner_join()` 只返回键同时存在于两个表中的那些行。\n\n```\n\
    grades_geography                      \n## 1 Charles Darwin A               C\n\
    ```\n\n相比之下，`full_join()` 函数会返回一个包含所有键的表格。如果某个键仅在一个表中找到，那么来自另一个表的变量将被设置为 `NA`。\n\
    \n```\nfull_join(\ngrades_geography, grades_physics,\nby = \"name\", suffix =\
    \ c(\".geography\", \".physics\")\n)\n## # A tibble: 5 × 3\n##   name        \
    \    grade.geography grade.physics\n##                         \n## 1 Marko Polo\
    \      A               \n## 2 Charles Darwin  A               C\n## 3 Immanuel\
    \ Kant   A+              \n## 4 Isaac Newton                A+\n## 5 Albert Einstein\
    \             A+\n```\n\n如果你希望保留左表或右表中的所有键（但并非左右表全部保留），当另一个表中缺少该键时可能填充 `NA`，那么你需要使用\
    \ `left_join()` 或 `right_join()`。\n\n```\nleft_join(\ngrades_geography, grades_physics,\n\
    by = \"name\", suffix = c(\".geography\", \".physics\")\n)\n## # A tibble: 3 ×\
    \ 3\n##   name            grade.geography grade.physics\n##                  \
    \       \n## 1 Marko Polo      A               \n## 2 Charles Darwin  A      \
    \         C\n## 3 Immanuel Kant   A+              \nright_join(\ngrades_maths,\
    \ grades_physics,\nby = \"name\", suffix = c(\".maths\", \".physics\")\n)\n##\
    \ # A tibble: 3 × 3\n##   name            grade.maths grade.physics\n##      \
    \               \n## 1 Isaac Newton    A+          A+\n## 2 Charles Darwin  B\
    \           C\n## 3 Albert Einstein         A+\n```\n\n`semi_join()` 会返回第一个表中所有能在第二个表中找到键的行。\n\
    \n```\nsemi_join(\ngrades_maths2, grades_biology2,\nby = \"name\", suffix = c(\"\
    .geography\", \".physics\")\n)\n## # A tibble: 4 × 2\n##   name            grade\n\
    ##              \n## 1 Marko Polo      D\n## 2 Isaac Newton    A+\n## 3 Isaac\
    \ Newton    A+\n## 4 Charles Darwin  B\n```\n\n当键匹配时，你只会从第一个表中获得每一行的单个副本，无论该键在第二个表中出现多少次。\n\
    \n这与 `inner_join()` 不同，后者会返回两个表中所有行的组合。因此，`inner_join()` 并不等同于 `inner_join()`\
    \ 与 `select()` 的组合。\n\n```\ninner_join(\ngrades_maths2, grades_biology2,\nby =\
    \ \"name\", suffix = c(\".geography\", \".physics\")\n) |> select(1:2)\n## # A\
    \ tibble: 5 × 2\n##   name            grade.geography\n##              \n## 1\
    \ Marko Polo      D\n## 2 Isaac Newton    A+\n## 3 Isaac Newton    A+\n## 4 Charles\
    \ Darwin  B\n## 5 Charles Darwin  B\n```\n\n你仍然可能从 `semi_join()` 中得到多个相同的行。如果第一个表本身有重复行，那么这些行也会重复出现在结果中。如果你不希望这样，可以将连接与\
    \ `distinct()` 结合使用。\n\n`anti_join()` 会返回第一个表中所有在第二个表中找不到其键（一个或多个键）的行。可以将其视为 `semi_join()`\
    \ 的补集。\n\n```\nanti_join(\ngrades_maths2, grades_physics,\nby = \"name\", suffix\
    \ = c(\".geography\", \".physics\")\n)\n## # A tibble: 1 × 2\n##   name      \
    \      grade\n##              \n## 1 Marko Polo      D\n```\n\n连接函数只接受两个表作为输入，因此你可能想知道如何合并多个表。一种解决方案是使用\
    \ `purrr` 包中的 `reduce()` 函数。\n\n```\ngrades \nreduce(full_join, by = \"name\"\
    ) |>\nrename_at(2:5, ~ c(\"maths\", \"biology\", \"geography\", \"physics\"))\n\
    ## # A tibble: 5 × 5\n##   name            maths biology geography physics\n##\
    \                       \n## 1 Marko Polo      D     F       A         \n## 2\
    \ Isaac Newton    A+    D             A+\n## 3 Charles Darwin  B     A+      A\
    \         C\n## 4 Immanuel Kant         A+        \n## 5 Albert Einstein     \
    \        A+\n```\n\n`rename_at()` 函数的工作方式与 `select_at()` 类似，这里我用它来重命名最后四列。\n"
- fmt: "# Income in Fictional Countries\n\nWe had an example with income in fictional\
    \ countries in Chapter [5](#476587_2_En_5_Chapter.xhtml). There, we did not have\
    \ the proper tools needed to deal with missing data. We wanted to replace `NA`\
    \ with the mean income for a country in rows with missing data, but the functions\
    \ from `tidyr` didn't suffice. With `dplyr` we have the tools.\n\nRecall the data:\n\
    \n```\nmean_income <- tribble(\n~country, ~`2002`, ~`2003`, ~`2004`, ~`2005`,\n\
    \"Numenor\",  123456,  132654,     NA,  324156,\n\"Westeros\", 314256,  NA,  \
    \       NA,  465321,\n\"Narnia\",   432156,  NA,         NA,      NA,\n\"Gondor\"\
    ,   531426,  321465, 235461,  463521,\n\"Laputa\",    14235,   34125,  45123,\
    \   51234,\n)\n```\n\nThe following pipeline does what we want. I will explain\
    \ it as follows, but you can try to work out the steps:\n\n```\nmean_income  \
    \                                                   |>\npivot_longer(\nnames_to\
    \ = \"year\",\nvalues_to = \"mean_income\",\n!country\n)                     \
    \                                      |>\ngroup_by(\ncountry\n)             \
    \                                              |>\nmutate(\nmean_per_country =\
    \ mean(mean_income, na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\n\
    mean_per_country,\nmean_income\n)\n)                                         \
    \                  |>\npivot_wider(\nnames_from = \"year\",\nvalues_from = \"\
    mean_income\"\n)\n## # A tibble: 5 × 6\n## # Groups: country [5]\n##   country\
    \ mean_per_country `2002`  `2003`  `2004`\n##                         \n## 1 Numenor\
    \          193422  123456 132654  193422\n## 2 Westeros         389788\\. 314256\
    \ 389788\\. 389788.\n## 3 Narnia           432156  432156 432156  432156\n## 4\
    \ Gondor           387968\\. 531426 321465  235461\n## 5 Laputa            36179\\\
    .  14235  34125   45123\n## # . . . with 1 more variable: `2005` \n```\n\nThe\
    \ first step in the pipeline is reformatting the data. We saw how this works in\
    \ Chapter [5](#476587_2_En_5_Chapter.xhtml).\n\n```\nmean_income |>\npivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)\n## # A tibble:\
    \ 20 × 3\n##   country   year   mean_income\n##                \n## 1 Numenor\
    \   2002        123456\n## 2 Numenor   2003        132654\n## 3 Numenor   2004\
    \            NA\n## 4 Numenor   2005        324156\n## 5 Westeros  2002      \
    \  314256\n## 6 Westeros  2003            NA\n## 7 Westeros  2004            NA\n\
    ## 8 Westeros  2005        465321\n## 9 Narnia    2002        432156\n## 10 Narnia\
    \   2003            NA\n## 11 Narnia   2004            NA\n## 12 Narnia   2005\
    \            NA\n## 13 Gondor   2002        531426\n## 14 Gondor   2003      \
    \  321465\n## 15 Gondor   2004        235461\n## 16 Gondor   2005        463521\n\
    ## 17 Laputa   2002         14235\n## 18 Laputa   2003         34125\n## 19 Laputa\
    \   2004         45123\n## 20 Laputa   2005         51234\n```\n\nWe use `pivot_longer()`\
    \ to get all the income data from separate columns into a single `mean_income`\
    \ column, where the `year` column will hold the information about which original\
    \ column the data came from.\n\nIn the next two steps, we group by countries,\
    \ so the means we calculate are per country and not the full data set, and then\
    \ we compute the means and replace `NA` cells with them. To get a glimpse into\
    \ the `mutate()` call, you can replace it with `summarise()` and see the mean\
    \ of each country.\n\n```\nmean_income |>\npivot_longer(\nnames_to = \"year\"\
    ,\nvalues_to = \"mean_income\",\n!country\n)                                 \
    \                        |>\ngroup_by(\ncountry\n)                           \
    \                              |>\nsummarise(\nper_country_mean = mean(mean_income,\
    \ na.rm = TRUE)\n)\n## # A tibble: 5 × 2\n##   country  per_country_mean\n## \
    \                 \n## 1 Gondor            387968.\n## 2 Laputa             36179.\n\
    ## 3 Narnia             432156\n## 4 Numenor            193422\n## 5 Westeros\
    \          389788.\n```\n\nIn the next step, we can replace the missing data with\
    \ their country mean in the `mutate()` call because we can refer to earlier columns\
    \ when we create later columns in `mutate()`.\n\n```\nmean_income            \
    \                                       |>\npivot_longer(\nnames_to = \"year\"\
    ,\nvalues_to = \"mean_income\",\n!country\n)                                 \
    \                         |>\ngroup_by(\ncountry\n)                          \
    \                                |>\nmutate(\nmean_per_country = mean(mean_income,\
    \ na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\nmean_per_country,\n\
    mean_income\n)\n)\n## # A tibble: 20 × 4\n## # Groups:  country [5]\n##   country\
    \  year mean_income mean_per_country\n##                         \n## 1 Numenor\
    \  2002     123456           193422\n## 2 Numenor  2003     132654           193422\n\
    ## 3 Numenor  2004     193422           193422\n## 4 Numenor  2005     324156\
    \           193422\n## 5 Westeros 2002     314256           389788.\n## 6 Westeros\
    \ 2003     389788\\.          389788.\n## 7 Westeros 2004     389788\\.      \
    \    389788.\n## 8 Westeros 2005     465321           389788.\n## 9 Narnia   2002\
    \     432156           432156\n## 10 Narnia  2003     432156           432156\n\
    ## 11 Narnia  2004     432156           432156\n## 12 Narnia  2005     432156\
    \           432156\n## 13 Gondor  2002     531426           387968.\n## 14 Gondor\
    \  2003     321465           387968.\n## 15 Gondor  2004     235461          \
    \ 387968.\n## 16 Gondor  2005     463521           387968.\n## 17 Laputa  2002\
    \      14235            36179.\n## 18 Laputa  2003      34125            36179.\n\
    ## 19 Laputa  2004      45123            36179.\n## 20 Laputa  2005      51234\
    \            36179.\n```\n\nIf you had a pipeline where you had steps between\
    \ the `group_by()` call and the `mutate()` call that sets the `mean_income`, you\
    \ have to be careful. Do *not* put an `ungroup()` in there. The pipeline works\
    \ because the `mean_income` is per country when we call `mutate()`. If we ungrouped,\
    \ we would get the mean over *all* countries.\n\n```\nmean_income |>\npivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)              \
    \                                              |>\ngroup_by(\ncountry\n)     \
    \                                                       |>\n# Imagine we are doing\
    \ something here that removes the group...\nungroup()                        \
    \                            |>\n# The mutate that follows is not grouped so the\
    \ mean is global...\nmutate(\nmean_per_country = mean(mean_income, na.rm = TRUE),\n\
    mean_income = ifelse(\nis.na(mean_income),\nmean_per_country,\nmean_income\n)\n\
    )\n## # A tibble: 20 × 4\n##   country   year   mean_income   mean_per_country\n\
    ##                              \n## 1 Numenor   2002       123456           \
    \  249185.\n## 2 Numenor   2003       132654             249185.\n## 3 Numenor\
    \   2004       249185\\.            249185.\n## 4 Numenor   2005       324156\
    \             249185.\n## 5 Westeros  2002       314256             249185.\n\
    ## 6 Westeros  2003       249185\\.            249185.\n## 7 Westeros  2004  \
    \     249185\\.            249185.\n## 8 Westeros  2005       465321         \
    \    249185.\n## 9 Narnia    2002       432156             249185.\n## 10 Narnia\
    \   2003       249185\\.            249185.\n## 11 Narnia   2004       249185\\\
    .            249185.\n## 12 Narnia   2005       249185\\.            249185.\n\
    ## 13 Gondor   2002       531426             249185.\n## 14 Gondor   2003    \
    \   321465             249185.\n## 15 Gondor   2004       235461             249185.\n\
    ## 16 Gondor   2005       463521             249185.\n## 17 Laputa   2002    \
    \    14235             249185.\n## 18 Laputa   2003        34125             249185.\n\
    ## 19 Laputa   2004        45123             249185.\n## 20 Laputa   2005    \
    \    51234             249185.\n```\n\nIn the last step, we just use `pivot_wider()`\
    \ to transform the long table back to the original format; there is nothing special\
    \ here that you haven't seen in Chapter [5](#476587_2_En_5_Chapter.xhtml).\n\n\
    This is how we replace all missing data with the mean for the corresponding countries.\n\
    \nFootnotes [1](#476587_2_En_8_Chapter.xhtml#Fn1_source)"
  raw: "## Income in Fictional Countries\n\nWe had an example with income in fictional\
    \ countries in Chapter [5](#476587_2_En_5_Chapter.xhtml). There, we did not have\
    \ the proper tools needed to deal with missing data. We wanted to replace `NA`\
    \ with the mean income for a country in rows with missing data, but the functions\
    \ from `tidyr` didn’t suffice. With `dplyr` we have the tools.\n\nRecall the data:\n\
    \n```\nmean_income <- tribble(\n~country, ~`2002`, ~`2003`, ~`2004`, ~`2005`,\n\
    \"Numenor\",  123456,  132654,     NA,  324156,\n\"Westeros\", 314256,  NA,  \
    \       NA,  465321,\n\"Narnia\",   432156,  NA,         NA,      NA,\n\"Gondor\"\
    ,   531426,  321465, 235461,  463521,\n\"Laputa\",    14235,   34125,  45123,\
    \   51234,\n)\n```\n\nThe following pipeline does what we want. I will explain\
    \ it as follows, but you can try to work out the steps:\n\n```\nmean_income  \
    \                                                   |>\npivot_longer(\nnames_to\
    \ = \"year\",\nvalues_to = \"mean_income\",\n!country\n)                     \
    \                                      |>\ngroup_by(\ncountry\n)             \
    \                                              |>\nmutate(\nmean_per_country =\
    \ mean(mean_income, na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\n\
    mean_per_country,\nmean_income\n)\n)                                         \
    \                  |>\npivot_wider(\nnames_from = \"year\",\nvalues_from = \"\
    mean_income\"\n)\n## # A tibble: 5 × 6\n## # Groups: country [5]\n##   country\
    \ mean_per_country `2002`  `2003`  `2004`\n##                         \n## 1 Numenor\
    \          193422  123456 132654  193422\n## 2 Westeros         389788\\. 314256\
    \ 389788\\. 389788.\n## 3 Narnia           432156  432156 432156  432156\n## 4\
    \ Gondor           387968\\. 531426 321465  235461\n## 5 Laputa            36179\\\
    .  14235  34125   45123\n## # . . . with 1 more variable: `2005` \n```\n\nThe\
    \ first step in the pipeline is reformatting the data. We saw how this works in\
    \ Chapter [5](#476587_2_En_5_Chapter.xhtml).\n\n```\nmean_income |>\npivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)\n## # A tibble:\
    \ 20 × 3\n##   country   year   mean_income\n##                \n## 1 Numenor\
    \   2002        123456\n## 2 Numenor   2003        132654\n## 3 Numenor   2004\
    \            NA\n## 4 Numenor   2005        324156\n## 5 Westeros  2002      \
    \  314256\n## 6 Westeros  2003            NA\n## 7 Westeros  2004            NA\n\
    ## 8 Westeros  2005        465321\n## 9 Narnia    2002        432156\n## 10 Narnia\
    \   2003            NA\n## 11 Narnia   2004            NA\n## 12 Narnia   2005\
    \            NA\n## 13 Gondor   2002        531426\n## 14 Gondor   2003      \
    \  321465\n## 15 Gondor   2004        235461\n## 16 Gondor   2005        463521\n\
    ## 17 Laputa   2002         14235\n## 18 Laputa   2003         34125\n## 19 Laputa\
    \   2004         45123\n## 20 Laputa   2005         51234\n```\n\nWe use `pivot_longer()`\
    \ to get all the income data from separate columns into a single `mean_income`\
    \ column, where the `year` column will hold the information about which original\
    \ column the data came from.\n\nIn the next two steps, we group by countries,\
    \ so the means we calculate are per country and not the full data set, and then\
    \ we compute the means and replace `NA` cells with them. To get a glimpse into\
    \ the `mutate()` call, you can replace it with `summarise()` and see the mean\
    \ of each country.\n\n```\nmean_income |>\npivot_longer(\nnames_to = \"year\"\
    ,\nvalues_to = \"mean_income\",\n!country\n)                                 \
    \                        |>\ngroup_by(\ncountry\n)                           \
    \                              |>\nsummarise(\nper_country_mean = mean(mean_income,\
    \ na.rm = TRUE)\n)\n## # A tibble: 5 × 2\n##   country  per_country_mean\n## \
    \                 \n## 1 Gondor            387968.\n## 2 Laputa             36179.\n\
    ## 3 Narnia             432156\n## 4 Numenor            193422\n## 5 Westeros\
    \          389788.\n```\n\nIn the next step, we can replace the missing data with\
    \ their country mean in the `mutate()` call because we can refer to earlier columns\
    \ when we create later columns in `mutate()`.\n\n```\nmean_income            \
    \                                       |>\npivot_longer(\nnames_to = \"year\"\
    ,\nvalues_to = \"mean_income\",\n!country\n)                                 \
    \                         |>\ngroup_by(\ncountry\n)                          \
    \                                |>\nmutate(\nmean_per_country = mean(mean_income,\
    \ na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\nmean_per_country,\n\
    mean_income\n)\n)\n## # A tibble: 20 × 4\n## # Groups:  country [5]\n##   country\
    \  year mean_income mean_per_country\n##                         \n## 1 Numenor\
    \  2002     123456           193422\n## 2 Numenor  2003     132654           193422\n\
    ## 3 Numenor  2004     193422           193422\n## 4 Numenor  2005     324156\
    \           193422\n## 5 Westeros 2002     314256           389788.\n## 6 Westeros\
    \ 2003     389788\\.          389788.\n## 7 Westeros 2004     389788\\.      \
    \    389788.\n## 8 Westeros 2005     465321           389788.\n## 9 Narnia   2002\
    \     432156           432156\n## 10 Narnia  2003     432156           432156\n\
    ## 11 Narnia  2004     432156           432156\n## 12 Narnia  2005     432156\
    \           432156\n## 13 Gondor  2002     531426           387968.\n## 14 Gondor\
    \  2003     321465           387968.\n## 15 Gondor  2004     235461          \
    \ 387968.\n## 16 Gondor  2005     463521           387968.\n## 17 Laputa  2002\
    \      14235            36179.\n## 18 Laputa  2003      34125            36179.\n\
    ## 19 Laputa  2004      45123            36179.\n## 20 Laputa  2005      51234\
    \            36179.\n```\n\nIf you had a pipeline where you had steps between\
    \ the `group_by()` call and the `mutate()` call that sets the `mean_income`, you\
    \ have to be careful. Do *not* put an `ungroup()` in there. The pipeline works\
    \ because the `mean_income` is per country when we call `mutate()` . If we ungrouped,\
    \ we would get the mean over *all* countries.\n\n```\nmean_income |>\npivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)              \
    \                                              |>\ngroup_by(\ncountry\n)     \
    \                                                       |>\n# Imagine we are doing\
    \ something here that removes the group...\nungroup()                        \
    \                            |>\n# The mutate that follows is not grouped so the\
    \ mean is global...\nmutate(\nmean_per_country = mean(mean_income, na.rm = TRUE),\n\
    mean_income = ifelse(\nis.na(mean_income),\nmean_per_country,\nmean_income\n)\n\
    )\n## # A tibble: 20 × 4\n##   country   year   mean_income   mean_per_country\n\
    ##                              \n## 1 Numenor   2002       123456           \
    \  249185.\n## 2 Numenor   2003       132654             249185.\n## 3 Numenor\
    \   2004       249185\\.            249185.\n## 4 Numenor   2005       324156\
    \             249185.\n## 5 Westeros  2002       314256             249185.\n\
    ## 6 Westeros  2003       249185\\.            249185.\n## 7 Westeros  2004  \
    \     249185\\.            249185.\n## 8 Westeros  2005       465321         \
    \    249185.\n## 9 Narnia    2002       432156             249185.\n## 10 Narnia\
    \   2003       249185\\.            249185.\n## 11 Narnia   2004       249185\\\
    .            249185.\n## 12 Narnia   2005       249185\\.            249185.\n\
    ## 13 Gondor   2002       531426             249185.\n## 14 Gondor   2003    \
    \   321465             249185.\n## 15 Gondor   2004       235461             249185.\n\
    ## 16 Gondor   2005       463521             249185.\n## 17 Laputa   2002    \
    \    14235             249185.\n## 18 Laputa   2003        34125             249185.\n\
    ## 19 Laputa   2004        45123             249185.\n## 20 Laputa   2005    \
    \    51234             249185.\n```\n\nIn the last step, we just use `pivot_wider()`\
    \ to transform the long table back to the original format; there is nothing special\
    \ here that you haven’t seen in Chapter [5](#476587_2_En_5_Chapter.xhtml).\n\n\
    This is how we replace all missing data with the mean for the corresponding countries.\n\
    \nFootnotes [1](#476587_2_En_8_Chapter.xhtml#Fn1_source)"
  trans: "\n# 虚构国家的收入数据\n\n在第 5 章中，我们曾以一个关于虚构国家收入的例子进行过探讨。当时，我们尚未掌握处理缺失数据的合适工具。我们曾想用缺失数据所在行的国家平均收入来替换`NA`，但`tidyr`中的函数无法满足这一需求。有了`dplyr`，我们就拥有了相应的工具。\n\
    \n回顾一下数据：\n\n```\nmean_income <- tribble(\n~country, ~`2002`, ~`2003`, ~`2004`,\
    \ ~`2005`,\n\"Numenor\",  123456,  132654,     NA,  324156,\n\"Westeros\", 314256,\
    \  NA,         NA,  465321,\n\"Narnia\",   432156,  NA,         NA,      NA,\n\
    \"Gondor\",   531426,  321465, 235461,  463521,\n\"Laputa\",    14235,   34125,\
    \  45123,   51234,\n)\n```\n\n以下管道操作实现了我们的目标。我会逐步解释，但你也可以尝试自行推演各个步骤：\n\n```\n\
    mean_income                                                     |>\npivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)              \
    \                                             |>\ngroup_by(\ncountry\n)      \
    \                                                     |>\nmutate(\nmean_per_country\
    \ = mean(mean_income, na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\n\
    mean_per_country,\nmean_income\n)\n)                                         \
    \                  |>\npivot_wider(\nnames_from = \"year\",\nvalues_from = \"\
    mean_income\"\n)\n## # A tibble: 5 × 6\n## # Groups: country [5]\n##   country\
    \ mean_per_country `2002`  `2003`  `2004`\n##                         \n## 1 Numenor\
    \          193422  123456 132654  193422\n## 2 Westeros         389788\\. 314256\
    \ 389788\\. 389788.\n## 3 Narnia           432156  432156 432156  432156\n## 4\
    \ Gondor           387968\\. 531426 321465  235461\n## 5 Laputa            36179\\\
    .  14235  34125   45123\n## # . . . with 1 more variable: `2005` \n```\n\n管道操作的第一步是重新格式化数据。我们在第\
    \ 5 章中已经了解过其工作原理。\n\n```\nmean_income |>\npivot_longer(\nnames_to = \"year\",\n\
    values_to = \"mean_income\",\n!country\n)\n## # A tibble: 20 × 3\n##   country\
    \   year   mean_income\n##                \n## 1 Numenor   2002        123456\n\
    ## 2 Numenor   2003        132654\n## 3 Numenor   2004            NA\n## 4 Numenor\
    \   2005        324156\n## 5 Westeros  2002        314256\n## 6 Westeros  2003\
    \            NA\n## 7 Westeros  2004            NA\n## 8 Westeros  2005      \
    \  465321\n## 9 Narnia    2002        432156\n## 10 Narnia   2003            NA\n\
    ## 11 Narnia   2004            NA\n## 12 Narnia   2005            NA\n## 13 Gondor\
    \   2002        531426\n## 14 Gondor   2003        321465\n## 15 Gondor   2004\
    \        235461\n## 16 Gondor   2005        463521\n## 17 Laputa   2002      \
    \   14235\n## 18 Laputa   2003         34125\n## 19 Laputa   2004         45123\n\
    ## 20 Laputa   2005         51234\n```\n\n我们使用`pivot_longer()`来将来自不同列的所有收入数据整合到一个单独的`mean_income`列中，同时`year`列将记录该数据来源的原始列信息。\n\
    \n在接下来的两个步骤中，我们按国家进行分组，这样我们计算的平均值就是每个国家的均值，而非整个数据集的均值。然后，我们计算这些均值并用它们替换`NA`单元格。为了解`mutate()`调用的具体效果，你可以将其替换为`summarise()`来查看每个国家的均值。\n\
    \n```\nmean_income |>\npivot_longer(\nnames_to = \"year\",\nvalues_to = \"mean_income\"\
    ,\n!country\n)                                                         |>\ngroup_by(\n\
    country\n)                                                         |>\nsummarise(\n\
    per_country_mean = mean(mean_income, na.rm = TRUE)\n)\n## # A tibble: 5 × 2\n\
    ##   country  per_country_mean\n##                  \n## 1 Gondor            387968.\n\
    ## 2 Laputa             36179.\n## 3 Narnia             432156\n## 4 Numenor \
    \           193422\n## 5 Westeros          389788.\n```\n\n下一步，我们可以在`mutate()`调用中将缺失数据替换为其国家均值，因为当我们通过`mutate()`创建新列时，可以引用前面已创建的列。\n\
    \n```\nmean_income                                                   |>\npivot_longer(\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)              \
    \                                            |>\ngroup_by(\ncountry\n)       \
    \                                                   |>\nmutate(\nmean_per_country\
    \ = mean(mean_income, na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\n\
    mean_per_country,\nmean_income\n)\n)\n## # A tibble: 20 × 4\n## # Groups:  country\
    \ [5]\n##   country  year mean_income mean_per_country\n##                   \
    \      \n## 1 Numenor  2002     123456           193422\n## 2 Numenor  2003  \
    \   132654           193422\n## 3 Numenor  2004     193422           193422\n\
    ## 4 Numenor  2005     324156           193422\n## 5 Westeros 2002     314256\
    \           389788.\n## 6 Westeros 2003     389788\\.          389788.\n## 7 Westeros\
    \ 2004     389788\\.          389788.\n## 8 Westeros 2005     465321         \
    \  389788.\n## 9 Narnia   2002     432156           432156\n## 10 Narnia  2003\
    \     432156           432156\n## 11 Narnia  2004     432156           432156\n\
    ## 12 Narnia  2005     432156           432156\n## 13 Gondor  2002     531426\
    \           387968.\n## 14 Gondor  2003     321465           387968.\n## 15 Gondor\
    \  2004     235461           387968.\n## 16 Gondor  2005     463521          \
    \ 387968.\n## 17 Laputa  2002      14235            36179.\n## 18 Laputa  2003\
    \      34125            36179.\n## 19 Laputa  2004      45123            36179.\n\
    ## 20 Laputa  2005      51234            36179.\n```\n\n如果你有一个管道，在`group_by()`调用和设置`mean_income`的`mutate()`调用之间还有其他步骤，那么你务必小心。*不要*在中间插入`ungroup()`。该管道之所以有效，是因为我们在调用`mutate()`时，`mean_income`是按国家分组的。如果我们取消分组，得到的将是*所有*国家的均值。\n\
    \n```\nmean_income |>\npivot_longer(\nnames_to = \"year\",\nvalues_to = \"mean_income\"\
    ,\n!country\n)                                                            |>\n\
    group_by(\ncountry\n)                                                        \
    \    |>\n# 假设我们在这里执行了某些操作，这会移除分组...\nungroup()                               \
    \                     |>\n# 接下来的 mutate 因为没有分组，所以计算的是全局均值...\nmutate(\nmean_per_country\
    \ = mean(mean_income, na.rm = TRUE),\nmean_income = ifelse(\nis.na(mean_income),\n\
    mean_per_country,\nmean_income\n)\n)\n## # A tibble: 20 × 4\n##   country   year\
    \   mean_income   mean_per_country\n##                              \n## 1 Numenor\
    \   2002       123456             249185.\n## 2 Numenor   2003       132654  \
    \           249185.\n## 3 Numenor   2004       249185\\.            249185.\n\
    ## 4 Numenor   2005       324156             249185.\n## 5 Westeros  2002    \
    \   314256             249185.\n## 6 Westeros  2003       249185\\.          \
    \  249185.\n## 7 Westeros  2004       249185\\.            249185.\n## 8 Westeros\
    \  2005       465321             249185.\n## 9 Narnia    2002       432156   \
    \          249185.\n## 10 Narnia   2003       249185\\.            249185.\n##\
    \ 11 Narnia   2004       249185\\.            249185.\n## 12 Narnia   2005   \
    \    249185\\.            249185.\n## 13 Gondor   2002       531426          \
    \   249185.\n## 14 Gondor   2003       321465             249185.\n## 15 Gondor\
    \   2004       235461             249185.\n## 16 Gondor   2005       463521  \
    \           249185.\n## 17 Laputa   2002        14235             249185.\n##\
    \ 18 Laputa   2003        34125             249185.\n## 19 Laputa   2004     \
    \   45123             249185.\n## 20 Laputa   2005        51234             249185.\n\
    ```\n\n最后一步，我们只需使用`pivot_wider()`将长格式表格转换回原始格式；这里没有什么你在第 5 章中未见过的特别之处。\n\n这就是我们如何将所有缺失数据替换为相应国家均值的方法。\n\
    \n脚注 1\n"
- fmt: '# 9. Working with Strings: `stringr`


    The `stringr` package gives you functions for string manipulation. The package
    will be loaded when you load the `tidyverse` package:


    ```

    library(tidyverse)

    ```


    You can also load the package alone using:


    ```

    library(stringr)

    ```


    ## Counting String Patterns


    The `str_count()` function counts how many tokens a string contains, where tokens,
    for example, can be characters or words. By default, `str_count()` will count
    the number of characters in a string.


    ```

    strings <- c(

    "Give me an ice cream",

    "Get yourself an ice cream",

    "We are all out of ice creams",

    "I scream, you scream, everybody loves ice cream.",

    "one ice cream,

    two ice creams,

    three ice creams",

    "I want an ice cream. Do you want an ice cream?"

    )

    str_count(strings)

    ## [1]  20  25  28  48  55  46

    ```


    For each of the strings in `strings`, we get the number of characters. The result
    is the same as we would get using `nchar()` (but not `length()` which would give
    us the length of the list containing them, six in this example).


    You can be explicit in specifying that `str_count()` should count characters by
    giving it a `boundary()` option. This determines the boundary between tokens (characters,
    words, lines, etc.), that is, the units to count.


    ```

    str_count(strings,boundary("character"))

    ## [1]  20  25  28  48  55  46

    ```


    If you want to count words instead, you can use `boundary("word")`:


    ```

    str_count(strings, boundary("word"))

    ## [1]  5  5  7  8  9  11

    ```


    You can use two additional options to `boundary()`: `"line_break"` and `"sentence"`.
    They use heuristics for determining how many line breaks and sentences the text
    contains dependent on a `locale()`.


    ```

    str_count(strings, boundary("line_break"))

    ## [1]  5  5  7  8  11  11

    str_count(strings, boundary("sentence"))

    ## [1]  1  1  1  1  3  2

    ```


    Notice that the line breaks are not the newlines in the text. The line breaks
    are where you would be expected to put newlines in your `locale()`.


    Finally, `str_count()` lets you count how often a substring is found in a string:


    ```

    str_count(strings, "ice cream")

    ## [1]  1  1  1  1  3 2

    str_count(strings, "cream") # gets the screams as well

    ## [1]  1  1  1  3  3  2

    ```


    The pattern you ask `str_count()` to count is not just a string. It is a regular
    expression. Some characters take on special meaning in regular expressions.^([^(17)](#fn17))
    For example, a dot (`.`) represents any single character, not a full stop.


    ```

    str_count(strings, ".")

    ## [1]  20  25  28  48  53  46

    ```


    If you want your pattern to be taken as a literal string and not a regular expression,
    you can wrap it in `fixed()`:


    ```

    str_count(strings, fixed("."))

    ## [1]  0  0  0  1  0  1

    ```


    Since the pattern is a regular expression, we can use it to count punctuation
    characters:


    ```

    str_count(strings, "[[:punct:]]")

    ## [1]  0  0  0  3  2  2

    ```


    or the number of times `ice cream(s)` is at the end of the string:


    ```

    str_count(strings, "ice creams?$")

    ## [1]  1  1  1  0  1  0

    ```


    The `s?` means zero or one `s`, and the `$` means the end of the string. Or rather,
    at the end of the string except that it might be followed by a punctuation mark.


    ```

    str_count(strings, "ice creams?[[:punct:]]?$")

    ## [1]  1  1  1  1  1  1

    ```


    ## Splitting Strings


    Sometimes, you want to split a string based on some separator—not unlike how we
    split on commas in comma-separated value files. The `stringr` function for this
    is `str_split()`.


    We can, for example, split on a space:


    ```

    strings <- c(

    "one",

    "two",

    "one two",

    "one two",

    "one. two."

    )

    str_split(strings, " ")

    ## [[1]]

    ## [1] "one"

    ##

    ## [[2]]

    ## [1] "two"

    ##

    ## [[3]]

    ## [1] "one" "two"

    ##

    ## [[4]]

    ## [1] "one" ""  ""  "two"

    ##

    ## [[5]]

    ## [1] "one." "two."

    ```


    Since we are splitting on a single space, we get empty strings for `"one  two"`
    which contains three spaces. If you want any sequence of spaces to work as the
    separator, you could instead do this:


    ```

    str_split(strings, "[[:space:]]+")

    ## [[1]]

    ## [1] "one"

    ##

    ## [[2]]

    ## [1] "two"

    ##

    ## [[3]]

    ## [1] "one" "two"

    ##

    ## [[4]]

    ## [1] "one" "two"

    ##

    ## [[5]]

    ## [1] "one." "two."

    ```


    You can use the `boundary()` function for splitting as well. For example, you
    can split a string into its words using `boundary("word")`:


    ```

    str_split(strings, boundary("word"))

    ## [[1]]

    ## [1] "one"

    ##

    ## [[2]]

    ## [1] "two"

    ##

    ## [[3]]

    ## [1] "one" "two"

    ##

    ## [[4]]

    ## [1] "one" "two"

    ##

    ## [[5]]

    ## [1] "one" "two"

    ```


    When we do this, we get rid of the empty strings from the first attempt, and we
    also get rid of the full stops in the last string.


    ## Capitalizing Strings


    You can use `str_to_lower()` to transform a string into all lowercase.


    ```

    macdonald <- "Old MACDONALD had a farm."

    str_to_lower(macdonald)

    ## [1] "old macdonald had a farm."

    ```


    Similarly, you can use `str_to_upper()` to translate it into all uppercase.


    ```

    str_to_upper(macdonald)

    ## [1] "OLD MACDONALD HAD A FARM."

    ```


    If you use `str_to_sentence()`, the first character is uppercase and the rest
    lowercase.


    ```

    str_to_sentence(macdonald)

    ## [1] "Old macdonald had a farm."

    ```


    The `str_to_title()` function will capitalize all words in your string.


    ```

    str_to_title(macdonald)

    ## [1] "Old Macdonald Had A Farm."

    ```'
