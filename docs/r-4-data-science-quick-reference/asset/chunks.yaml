  trans: "\n# 嵌套数据\n\ntidyr 提供的最后一项功能是嵌套数据。tibble 条目通常包含简单数据，例如数字或字符串，但也可以容纳复杂数据，例如其他表格。\n\
    \n考虑以下表格：\n\n```\ntbl<-tribble(\n~A,~B,~C,\n1,11,21,\n1,11,12,\n2,42,22,\n2,15,22,\n\
    2,15,32,\n4,13,32\n)\n```\n\n从这个表格中，我们可以创建一个新的表格，针对 `A` 列中的每个值，包含一个由该 `A` 值对应的\
    \ `B` 和 `C` 列组成的表格。\n\n```\nnested_tbl <- tbl |> nest(BC = c(B, C))\nnested_tbl\n\
    ## # A tibble: 3 × 2\n##       A BC\n##    \n## 1     1 \n## 2     2 \n## 3  \
    \   4 \nnested_tbl[[1,2]]\n## [[1]]\n## # A tibble: 2 × 2\n##       B     C\n\
    ##    \n## 1     11   21\n## 2     11   12\n```\n\n包含嵌套表格的列被命名为 `BC`，因为我们使用了带有该名称的命名参数\
    \ `BC = c(B, C)`。\n\n反向操作是 `unnest()`：\n\n```\nnested_tbl |> unnest(cols = c(BC))\n\
    ## # A tibble: 6 × 3\n##       A     B     C\n##     \n## 1     1    11    21\n\
    ## 2     1    11    12\n## 3     2    42    22\n## 4     2    15    22\n## 5 \
    \    2    15    32\n## 6     4    13    32\n```\n\n嵌套在数据分析中不是典型操作，但如果你需要它，它就在那里，并且在第\
    \ 12 章的包中，我们会看到一些用法。\n\n脚注 1 2 3\n\n# 6. 管道：magrittr\n\n数据分析由几个步骤组成，在最终进入模型构建之前，你的数据会经历不同阶段的转换和清洗。实际上，这意味着你的\
    \ `R` 代码将包含一系列函数调用，其中一个函数的输出是下一个函数的输入。这种模式很典型，但直接实现它有几个缺点。Tidyverse 多年来一直提供“管道运算符”来缓解这个问题，从\
    \ R 4.1 开始，该语言本身也内置了一个运算符。虽然本章主要介绍 `magrittr` 管道运算符 `%>%`，但我也将介绍原生运算符 `|>`，并指出它们在行为上的一些不同之处。\n\
    \n原生运算符 `|>` 在任何大于 4.1.0 的 R 版本中都可以直接使用。如果你加载 `tidyverse` 包，就可以获得 `magrittr` 包中实现的管道运算符：\n\
    \n```\nlibrary(tidyverse)\n```\n\n或显式加载包：\n\n```\nlibrary(magrittr)\n```\n\n如果你通过\
    \ `tidyverse` 包加载 `magrittr`，你将获得最常见的管道运算符 `%>%`，但不会获得其他替代运算符——请参见下一节。要使用那些替代运算符，你需要加载\
    \ `magrittr`。\n\n## 管道的问题\n\n考虑来自第 5 章的数据。\n\n```\nwrite_csv(\ntribble(\n~country,\
    \  ~`2002`, ~`2003`, ~`2004`, ~`2005`,\n\"Numenor\",  123456,  132654,      NA,\
    \  324156,\n\"Westeros\", 314256,  NA,          NA,  465321,\n\"Narnia\",   432156,\
    \  NA,          NA,      NA,\n\"Gondor\",   531426,  321465,  235461,  463521,\n\
    \"Laputa\",    14235,   34125,   45123,   51234,\n),\n\"data/income.csv\"\n)\n\
    ```\n\n我已将其写入文件 `data/income.csv`，以使以下示例更易于阅读。\n\n在第 5 章中，我们使用 `pivot_longer()`\
    \ 和 `drop_na()` 对这个数据进行了重新格式化并清除了缺失值：\n\n```\nmydata <- read_csv(\"data/income.csv\"\
    ,\ncol_types = \"cdddd\")\nmydata <- pivot_longer(\ndata = mydata,\nnames_to =\
    \ \"year\",\nvalues_to = \"mean_income\",\n!country\n)\nmydata <- drop_na(mydata)\n\
    ```\n\n这是一个典型的管道，尽管很短。它包含三个步骤：(1) 将数据读入 R，(2) 整理数据，(3) 清洗数据。\n\n这种代码本身并没有什么问题。每一步都很容易阅读；它是一个将数据从一种形式转换为另一种形式的函数调用。然而，代码的管道特性并不明确。我们可以阅读代码并看到，一个函数的输出是下一个函数的输入，但如果不是呢？\n\
    \n考虑以下情况：\n\n```\nmydata <- read_csv(\"data/income.csv\",\ncol_types = \"cdddd\"\
    )\ndata <- pivot_longer(...) # 我们赋值给正确的变量名了吗？\nmydata <-drop_na(mydata) # 输入来自\
    \ read_csv() 而不是 pivot_longer()\n```\n\n`pivot_longer()` 的结果被赋值给了变量 `data`，然后\
    \ `drop_na()` 在 `mydata` 上被调用。如果我们的意图是前面的管道，这将是一个错误。但也许我们想要 `pivot_longer()` 的结果作为后续分析所需的单独数据表。\n\
    \n一系列构成管道的转换步骤只能通过遵循编程约定来识别，除非代码有良好的文档且易于理解，否则我们无法从代码中立即看出将结果赋值给 `data` 而不是 `mydata`\
    \ 是否是一个错误。\n\n我们可以使管道更加明确。如果一个函数的输出应该是下一个函数的输入，我们可以嵌套函数调用：\n\n```\nmydata <- drop_na(\n\
    pivot_longer(\ndata = read_csv(\"data/income.csv\",\ncol_types = \"cdddd\"),\n\
    names_to = \"year\",\nvalues_to = \"mean_income\",\n!country\n)\n)\n```\n\n这使得管道的意图变得明确，但代码很难阅读；你必须从最内层的函数调用到最外层的函数调用来理清管道。\n\
    \n`magrittr` 包为我们提供了一种符号，用于明确地描述可读的管道。\n"
- fmt: "# Pipeline Notation\n\nThe pipeline operators, `|>` and `%>%`, introduce syntactic\
    \ sugar for function calls.^([^(14)](#fn14)) The code\n\n```\nx %>% f()\n```\n\
    \nor\n\n```\nx |> f()\n```\n\nis equivalent to\n\n```\nf(x)\n```\n\nand\n\n```\n\
    x %>% f() %>% g() %>% h()\n```\n\nor\n\n```\nx |> f() |> g() |> h()\n```\n\nis\
    \ equivalent to\n\n```\nh(g(f(x)))\n```\n\nSo, by the way, is\n\n```\nx %>% f\
    \ %>% g %>% h\n```\n\nbut not\n\n```\nx |> f |> g |> h\n```\n\nThe native operator\
    \ needs to have a function *call*, `f()`, on the right-hand side of the operator,\
    \ while the `magrittr` will accept either a function *call*, `f()`, or just a\
    \ function *name*, `x %>% f`. You can also give `%>%` an anonymous function:\n\
    \n```\n\"hello, \"%>% (\\(y){ paste(y, \"world!\")})\n## [1] \"hello, world!\"\
    \n```\n\nbut `|>` still needs a function *call*, so if you give it an anonymous\
    \ function, you must call the function as well (add `()` after the function definition).\n\
    \n```\n\"hello,\" |> (\\(y){ paste(y, \"world!\")})()\n## [1] \"hello, world!\"\
    \n```\n\nIn either case, you *must* put the function definition in parentheses.\
    \ This will be an error:\n\n```\nx |> \\(y) { ... }\n```\n\nThis is because both\
    \ operators are syntactic sugar that translates `x %>% f()`, `x %>% f`, or `x\
    \ |> f()` into `f(x)` and the function definition, `function(y) { ... }` or `\\\
    (y) { ... }`, *is* a function call. The left-hand side of the pipeline is put\
    \ into the function definition:\n\n```\nx |> \\(y) { ... }\n```\n\nis translated\
    \ into\n\n```\n\\(x, f) { ... }\n```\n\nfor both operators. Putting the function\
    \ definition in parentheses prevents this; while `function(y) { ... }` is a function\
    \ call (to the function called `function`), `(function(y) { ... })` isn't. That\
    \ is, when the function definition is in parentheses, it is no longer syntactically\
    \ a function call (but an expression in parentheses). If it is not a call, `|>`\
    \ will not accept it as the right-hand side, but `%>%` will. For `%>%`, it still\
    \ isn't a call, just something that evaluates to one, so the function definition\
    \ isn't modified, but the result gets the left-hand side as an argument.\n\nAnyway,\
    \ that got technical, but it is something you need to know if you use anonymous\
    \ functions in pipelines.\n\nWith the `%>%` operator, you do not need the parentheses\
    \ for the function calls, but most prefer them to make it clear that we are dealing\
    \ with functions, and the syntax is then still valid if you change the code to\
    \ the `|>` operator. Also, if your functions take more than one argument, parentheses\
    \ are needed, so if you always include them, it gives you a consistent notation.\n\
    \nThe nested function call pipeline from earlier\n\n```\nmydata <- drop_na(pivot_longer(read_csv(.\
    \ . . )))\n```\n\ncan thus be rewritten in pipe form\n\n```\nmydata %>% pivot_longer(.\
    \ . . ) %>% drop_na()\n```\n\nor, with all the arguments included, as\n\n```\n\
    mydata %>%\n  pivot_longer(names_to = \"year\", values_to = \"mean_income\", !country)\
    \ %>%\n  drop_na()\n```\n\nThe pipeline notation combines the readability of single\
    \ function call steps with explicit notation for data processing pipelines.\n\n\
    ## Pipelines and Function Arguments\n\nThe pipe operator is left-associative,\
    \ that is, it evaluates from left to right, and the expression `lhs %>% rhs` expects\
    \ the left-hand side (`lhs`) to be data and the right-hand side (`rhs`) to be\
    \ a function or a function call (and always a function call for `|>`). The result\
    \ will be `rhs(lhs)`. The output of this function call is the left-hand side of\
    \ the next pipe operator in the pipeline or the result of the entire pipeline.\
    \ If the right-hand side function takes more than one argument, you provide these\
    \ in the `rhs` expression. The expression\n\n```\nlhs %>% rhs(x, y, z)\n```\n\n\
    will be evaluated as the function call\n\n```\nrhs(lhs, x, y, z)\n```\n\nBy default,\
    \ the left-hand side is given as the first argument to the right-hand side function.\
    \ The arguments that you explicitly write on the right-hand side expression are\
    \ the additional function parameters.\n\nWith the `magrittr` operator, `%>%`,\
    \ but not the `|>` operator, you can change the default input position using the\
    \ special variable `.` (dot). If the right-hand side expression has `.` as a parameter,\
    \ then that is where the left-hand side value goes. All the following four pipelines\
    \ are equivalent:\n\n```\nmydata %>%\n  pivot_longer(names_to = \"year\", values_to\
    \ = \"mean_income\", !country) %>%\n  drop_na()\n\nmydata %>%\n  pivot_longer(names_to\
    \ = \"year\", values_to = \"mean_income\", !country) %>%\n  drop_na()\n\nmydata\
    \ %>%\n  pivot_longer(data = ., names_to = \"year\", values_to = \"mean_income\"\
    , !country) %>%\n  drop_na()\n\nmydata %>%\n  pivot_longer(names_to = \"year\"\
    , values_to = \"mean_income\", !country, data = .) %>%\n  drop_na()\n```\n\nYou\
    \ can use a dot more than once on the right-hand side:\n\n```\nrnorm(5) %>% tibble(x\
    \ = ., y = .)\n## # A tibble: 5 × 2\n##         x       y\n##       \n## 1 -0.951\
    \  -0.951\n## 2  0.0206  0.0206\n## 3  1.14    1.14\n## 4 -0.172  -0.172\n## 5\
    \  0.0795  0.0795\n```\n\nYou can also use it in nested function calls.\n\n```\n\
    rnorm(5) %>% tibble(x = ., y = abs(.))\n## # A tibble: 5 × 2\n##          x  \
    \     y\n##        \n## 1  1.61    1.61\n## 2  1.86    1.86\n## 3 -0.211   0.211\n\
    ## 4 -0.00352 0.00352\n## 5 -0.522   0.522\n```\n\nIf the dot is *only* found\
    \ in nested function calls, however, `magrittr` will still add it as the first\
    \ argument to the right-hand side function.\n\n```\nrnorm(5) %>% tibble(x = sin(.),\
    \ y = abs(.))\n## # A tibble: 5 × 3\n##        .      x     y\n##      \n## 1\
    \  1.10   0.893 1.10\n## 2 -0.155 -0.155 0.155\n## 3  0.102  0.102 0.102\n## 4\
    \  0.627  0.587 0.627\n## 5  0.280  0.276 0.280\n```\n\nTo avoid this, you can\
    \ put the right-hand side expression in curly brackets:\n\n```\nrnorm(5) %>% {\
    \ tibble(x = sin(.), y = abs(.)) }\n## # A tibble: 5 × 2\n##         x      y\n\
    ##      \n## 1  0.661  0.723\n## 2  0.0588 0.0588\n## 3  0.960  1.86\n## 4  0.820\
    \  0.961\n## 5 -0.366  0.375\n```\n\nIn general, you can put expressions in curly\
    \ brackets as the right-hand side of a pipe operator and have `magrittr` evaluate\
    \ them. Think of it as a way to write one-parameter anonymous functions. The input\
    \ variable is the dot, and the expression inside the curly brackets is the body\
    \ of the function.\n\n## Function Composition\n\nIt is trivial to write your own\
    \ functions such that they work well with pipelines. All functions map input to\
    \ output (ideally with no side effects) so all functions can be used in a pipeline.\
    \ If the key input is the first argument of a function you write, the default\
    \ placement of the left-hand side value will work—so that is preferable—but otherwise\
    \ you can explicitly use the dot.\n\nWhen writing pipelines, however, often you\
    \ do not need to write a function from scratch. If a function is merely a composition\
    \ of other function calls—it is a pipeline function itself—we can define it as\
    \ such.\n\nIn mathematics, the function composition operator, `°`, defines the\
    \ composition of functions `f` and `g`, `g` `°` `f`, to be the function\n\n(`g`\
    \ `°` `f`)(`x`) = `g`(`f`(`x`))\n\nMany functional programming languages encourage\
    \ you to write functions by combining other functions and have operators for that.\
    \ It is not frequently done in R, and while you can implement function composition,\
    \ there is no built-in operator. The `magrittr` package, however, gives you this\
    \ syntax:\n\n```\nh <- . %>% f() %>% g()\n```\n\nThis defines the function `h`,\
    \ such that `h(x) = g(f(x))`.\n\nIf we take the tidy-then-clean pipeline we saw\
    \ earlier, and imagine that we need to do the same for several input files, we\
    \ can define a pipeline function for this as\n\n```\npipeline <- . %>%\n  pivot_longer(names_to\
    \ = \"year\", values_to = \"mean_income\", !country) %>%\n  drop_na()\n\npipeline\n\
    ## Functional sequence with the following components:\n##\n##  1\\. pivot_longer(.,\
    \ names_to = \"year\", values_to = \"mean_income\", !country)\n##  2\\. drop_na(.)\n\
    ##\n## Use 'functions' to extract the individual functions.\n```"
