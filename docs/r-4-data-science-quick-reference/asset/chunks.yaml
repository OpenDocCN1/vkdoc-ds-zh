    If you do not give the new variable a name, that is, you call `mutate()` with\
    \ named parameters , then the expression will become the variable name:\n\n```\n\
    df |> mutate(cm_per_inch * height)\n## # A tibble: 3 × 3\n##   height width `cm_per_inch\
