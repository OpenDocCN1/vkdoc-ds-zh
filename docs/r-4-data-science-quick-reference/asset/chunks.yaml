    ```\n\n或\n\n```\nx |> f()\n```\n\n等同于\n\n```\nf(x)\n```\n\n以及\n\n```\nx %>% f()\
    \ %>% g() %>% h()\n```\n\n或\n\n```\nx |> f() |> g() |> h()\n```\n\n等同于\n\n```\n\
