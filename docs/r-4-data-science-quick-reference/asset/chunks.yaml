    # 字符串转换


    我们可以将匹配模式的子字符串替换为其他字符串。


    ```

    lego_str <- str_replace(strings, "ice cream[s]?", "LEGO")

    lego_str

    ## [1] "Give me an LEGO"

    ## [2] "Get yourself an LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two ice creams,\n  three ice creams"

    ## [6] "I want an LEGO. Do you want an ice cream?"

    lego_str <- str_replace(lego_str, "an LEGO", "a LEGO")

    lego_str

    ## [1] "Give me a LEGO"

    ## [2] "Get yourself a LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two ice creams,\n  three ice creams"

    ## [6] "I want a LEGO. Do you want an ice cream?"

    ```


    这两个替换操作可以写成管道形式，使代码更具 Tidyverse 风格：


    ```

    strings %>%

    str_replace("ice cream[s]?", "LEGO") %>%

    str_replace("an LEGO", "a LEGO")

    ## [1] "Give me a LEGO"

    ## [2] "Get yourself a LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two ice creams,\n  three ice creams"

    ## [6] "I want a LEGO. Do you want an ice cream?"

    ```


    与之前的大多数函数一样，该函数仅影响第一个匹配项。要替换所有匹配项，需要使用 `str_replace_all()`。


    ```

    strings %>%

    str_replace_all("ice cream[s]?", "LEGO") %>%

    str_replace_all("an LEGO", "a LEGO")

    ## [1] "Give me a LEGO"

    ## [2] "Get yourself a LEGO"

    ## [3] "We are all out of LEGO"

    ## [4] "I scream, you scream, everybody loves LEGO."

    ## [5] "one LEGO,\n  two LEGO,\n  three LEGO"

    ## [6] "I want a LEGO. Do you want a LEGO?"

    ```


    你可以在替换字符串中引用匹配的分组，这是正则表达式中常见的操作。


    ```

    us_dates <- c(

    valentines = "2/14",

    my_birthday = "2/15",

    # 没人知道，但我们就这么定吧

    jesus_birthday = "12/24"

    )

    # 将美国日期格式转换为更合理的格式

    str_replace(us_dates, "(.*)/(.*)", "\\2/\\1")

    ## [1] "14/2" "15/2" "24/12"

    ```


    `str_dup()` 函数用于复制字符串，即重复字符串多次。


    ```

    str_c(

    "NA",

    str_dup("-NA", times = 7),

    " BATMAN!"

    )

    ## [1] "NA-NA-NA-NA-NA-NA-NA-NA BATMAN!"

    ```


    这里我们还使用了 `str_c()` 来连接字符串。此函数与 `c()` 的工作方式不同；后者会创建一个包含多个字符串的向量，而前者会生成一个字符串。


    ```

    # -- 连接 -------------------------------------------

    c("foo", "bar", "baz")

    ## [1] "foo" "bar" "baz"

    str_c("foo", "bar", "baz")

    ## [1] "foobarbaz"

    ```


    提取和修改子字符串的更直接方法是使用 `str_sub()`。它允许你提取由开始和结束索引指定的子字符串，如果对其进行赋值，则会替换该子字符串。`str_sub()`
    函数不如其他函数强大，因为它不适用于正则表达式，但也正因如此，它更容易理解。


    如果你不知道子字符串的位置，则必须先找到它。为此，你可以使用 `str_locate()`。


    ```

    my_string <- "this is my string"

    my_location <- str_locate(my_string, "my")

    my_location

    ##     start end

    ## [1,]    9  10

    s <- my_location[,"start"]

    e <- my_location[,"end"]

    str_sub(my_string, s, e)

    ## [1] "my"

    my_string_location <- str_locate(my_string, "string")

    s <- my_string_location[,"start"]

    e <- my_string_location[,"end"]

    str_sub(my_string, s, e)

    ## [1] "string"

    your_string <- my_string

    s <- my_location[,"start"]

    e <- my_location[,"end"]

    str_sub(your_string, s, e) <- "your"

    your_string

    ## [1] "this is your string"

    your_banana <- your_string

    your_string_location <- str_locate(your_string, "string")

    s <- your_string_location[,"start"]

    e <- your_string_location[,"end"]

    str_sub(your_banana, s, e) <- "banana"

    your_banana

    ## [1] "this is your banana"

    ```


    当你对 `str_sub()` 的调用进行赋值时，看起来像是在修改字符串。这只是一种假象。赋值函数会创建新数据并更改变量引用的数据。因此，如果有多个引用指向同一个字符串，请务必小心。只有一个变量会指向新值；其余的变量仍指向旧字符串。这不仅适用于
    `str_sub()`，而是 R 的普遍情况，它可能是一个潜在的错误来源。


    ```

    my_string

    ## [1] "this is my string"

    your_string

    ## [1] "this is your string"

    your_banana

    ## [1] "this is your banana"

    ```


    如果你经常编写代码生成标准报告，每次文本基本相同，只是修改了几个选定值，那么你会爱上 `str_glue()`。它完全符合你的需求。你向 `str_glue()`
    提供一个模板字符串，一个包含可变部分（用花括号括起来）的字符串。调用 `str_glue()` 的结果是模板文本，但花括号中的值会被替换为它们所包含的 R
    表达式的结果。


    最简单的用法是模板引用变量。


    ```

    macdonald <- "Old MacDonald"

    eieio <- "E-I-E-I-O"

    str_glue("{macdonald} had a farm. {eieio}")

    ## Old MacDonald had a farm. E-I-E-I-O

    ```


    这些变量不必是全局变量。它们也可以作为命名参数传递给 `str_glue()`。


    ```

    str_glue(

    "{macdonald} had a farm. {eieio}",

    macdonald = "Thomas",

    eieio = "He certainly did not!"

    )

    ## Thomas had a farm. He certainly did not!

    ```


    通常，你可以在花括号中放置 R 表达式，表达式的求值结果将插入到模板字符串中。


    ```

    str_glue(

    "{str_dup(\"NA-\", times = 7)}NA BATMAN!"

    )

    ## NA-NA-NA-NA-NA-NA-NA-NA BATMAN!

    x <- seq(1:10)

    str_glue(

    "Holy {mean(x)} BATMAN!"

    )

    ## Holy 5.5 BATMAN!

    ```


    # 处理因子：`forcats`


    如果你处理分类数据，通常可以用字符串来表示类别。然而，字符串也有一些缺点。例如，拼写错误很容易不被发现。如果你希望类别有序，那么字符串的字典顺序并不总是你需要的顺序。作为将类别编码为字符串的替代方案，我们有因子。在本章中，我们将介绍
    `forcats` 包提供的用于创建和操作因子的功能。


    当你导入 `tidyverse` 时，该包会被加载：


    ```

    library(tidyverse)

    ```


    但你也可以显式加载它：


    ```

    library(forcats)

    ```

    '
- fmt: '# Creating Factors


    The built-in `factor()` function is still an excellent choice to build a factor
    from scratch, especially if you want to specify the levels of the factor when
    you create it.


    If you create a factor without explicitly specifying the levels, you get a level
    per unique element in the input.


    ```

    factor(c("A","C","B"))

    ## [1] A C B

    ## Levels: A B C

    ```


    Otherwise, you get the levels you pass to the `levels` argument.


    ```

    factor(c("A","C","B"),levels =c("A","B","C","D"))

    ## [1] A C B

    ## Levels: A B C D

    factor(c("A","C","B"),levels =c("D","C","B","A"))

    ## [1] A C B

    ## Levels: D C B A

    ```


    If you have a value that is not found in the levels, it will be set to `NA`.


    ```

    factor(c("A","C","B"),levels =c("A","B"))

    ## [1] A     B

    ## Levels: A B

    ```


    The `factor()` function is usually the right choice for creating factors. The
    function is not generic, however, so if you want a way to translate a data structure
    you have implemented yourself, one that needs a specific method to do so, then
    you might want to specialize `as_factor()` from `forcats`.


    If you specialize `as_factor()`, you can do anything you want, but on normal vectors,
    `as_factor()` works similarly to `as.factor()` from base R. The two functions
    differ, though, in how they set levels. If you use `as.factor()`, the levels will
    be sorted.


    ```

    f1<-as.factor(c("C","B","B","A","D"))

    f1# levels ordered alphabetically

    ## [1] C B B A D

    ## Levels: A B C D

    ```


    With `as_factor()`, the levels are in the order they appear in the input.


    ```

    f2<-as_factor(c("C","B","B","A","D"))

    f2# levels in the order they appear in the input

    ## [1] C B B A D

    ## Levels: C B A D

    ```


    ## Concatenation


    If you have two factors, then you can concatenate them using `fct_c()`. The levels
    of the resulting factor are the union of the levels of the input factors. The
    order of the levels depends on the order of the input factors. The levels in the
    first factor go first, then the levels in the second. If the factors share levels,
    then the order is determined by the first vector.


    For example, consider again the preceding factors `f1` and `f2`.


    ```

    f1

    ## [1] C B B A D

    ## Levels: A B C D

    f2

    ## [1] C B B A D

    ## Levels: C B A D

    ```


    They have the same levels, but they have them in different orders. If we concatenate
    `f1` with `f2`, we get the levels in the order from `f1`.


    ```

    fct_c(f1, f2)

    ##    [1] C B B A D C B B A D

    ## Levels: A B C D

    ```


    If we concatenate `f2` with `f1`, then the levels are ordered as in `f2`.


    ```

    fct_c(f2, f1)

    ##   [1] C B B A D C B B A D

    ## Levels: C B A D

    ```


    Consider now a factor that has levels not found in `f1`, for example, this:


    ```

    f3<-as_factor(c("X","Y","A"))

    ```


    It shares one level, `A`, with `f1`, but `X` and `Y` are unique to `f3`. If we
    concatenate with `f1` as the first argument, the new levels are included but after
    the factors from `f1` (and the shared factor `A`).


    ```

    fct_c(f1, f3)

    ## [1] C B B A D X Y A

    ## Levels: A B C D X Y

    ```


    If we concatenate with `f3` as the first argument, then `f3`’s levels come first.


    ```

    fct_c(f3, f1)

    ## [1] X Y A C B B A D

    ## Levels: X Y A B C D

    ```


    You can concatenate more than one factor using `fct_c()`. The rules are the same
    as for two factors.


    ```

    fct_c(f1, f2, f3)

    ##   [1] C B B A D C B B A D X Y A

    ## Levels: A B C D X Y

    fct_c(f2, f3, f1)

    ##   [1] C B B A D X Y A C B B A D

    ## Levels: C B A D X Y

    fct_c(f3, f1, f2)

    ##   [1] X Y A C B B A D C B B A D

    ## Levels: X Y A B C D

    ```


    If you have several factors that do not have the same levels, but you want them
    to have (without concatenating them), you can use `fct_unify()`. It takes a list
    of factors and gives you a list of factors where they all have as levels the union
    of the levels of the input.


    ```

    fct_unify(fs =list(f1, f2, f3))

    ## [[1]]

    ## [1] C B B A D

    ## Levels: A B C D X Y

    ##

    ## [[2]]

    ## [1] C B B A D

    ## Levels: A B C D X Y

    ##

    ## [[3]]

    ## [1] X Y A

    ## Levels: A B C D X Y

    ```


    ## Projection


    It happens that your categorical data is too fine-grained and you want to group
    categories into larger classes. If so, the function you want is `fct_collapse()`.
    It lets you map your existing levels to new levels. Its first argument is a factor,
    and after that, you provide named arguments. As parameters to the named arguments,
    you must provide a list of level names. Each name becomes a level, and that level
    will contain the elements in the list you give as the argument.


    ```

    fct_collapse(

    fct_c(f3, f1),

    a =c("A","X"),

    b =c("B","Y"),

    c =c("C","D")

    )

    ## [1] a b a c b b a c

    ## Levels: a b c

    ```


    You do not need to remap all levels. Those you do not map will stay as they were.


    ```

    fct_collapse(

    fct_c(f3, f1),

    a =c("A","X"),

    b =c("B","Y")

    )

    ## [1] a b a C b b a D

    ## Levels: a b C D

    ```


    If you only want to rename and not collapse levels, you can use `fct_recode()`.


    ```

    f1

    ## [1] C B B A D

    ## Levels: A B C D

    fct_recode(f1, a = "A", b = "B")

    ## [1] C b b a D

    ## Levels: a b C D

    fct_recode(f1, X = "A", X = "B", Y = "C", Y = "D")

    ## [1] Y X X X Y

    ## Levels: X Y

    ```


    If you want to reduce the number of levels based on how many elements they have,
    rather than merge levels in an explicitly specified way, then you can use `fct_lump()`.
    You can merge levels such that you keep the *n* levels with the most elements,
    for example, for *n* `= 5` and *n* `= 2`:


    ```

    f  fct_lump(n = 5, other_level = "X") |> table()

    ##

    ## 3  5  6  7  9  10  X

    ## 2  4  2  2  4   5  1

    f |> fct_lump(n = 2, other_level = "X") |> table()

    ##

    ## 5  9  10  X

    ## 4  4   5  7

    ```


    You see more than five and two levels here, even though we called `fct_lump()`
    with *n* `= 5` and *n* `= 2`. If there are several levels with the same number
    of elements, the function doesn’t pick random ones to keep. You get all with the
    highest occurrences.


    If you use a negative number, you get the least common categories.


    ```

    f |> fct_lump(n = -2, other_level = "X") |> table()

    ##

    ## 1  4  8   X

    ## 0  0  0  20

    ```


    Instead of picking the number of categories you want, you can require that they
    contain at least or at most a fraction of the data. For that, you use the `prop`
    parameter. To get the levels that contain at least 10% of the data, you use `prop
    = 0.1`:


    ```

    f |> fct_lump(prop = 0.1, other_level = "X") |> table()

    ##

    ## 5  9  10  X

    ## 4  4   5  7

    ```


    If you want the categories that contain less than 10% of the data, you use `prop`
    as well but with a negative value. To get the categories that contain at most
    10%, you use


    ```

    f |> fct_lump(prop = -0.1, other_level = "X") |> table()

    ##

    ## 1  2  3  4  6  7  8  X

    ## 0  1  2  0  2   2 0 13

    ```


    A more straightforward way to map categories is to map a fixed number to a new
    category. The `fct_other()` lets you pick a list of categories to keep or drop.
    If you keep categories, then all the others are put in the same "other" category.
    If you drop categories, then those you drop are placed in an "other" category.
    You can name the "other" category using the argument `other_level`.


    ```

    f |> fct_other(keep = 1:5, other_level = "X")

    ## [1] 2 X X X 5 X X 3 3 X X 5 X 5 X X X 5 X X

    ## Levels: 1 2 3 4 5 X

    f |> fct_other(drop = 1:5, other_level = "X")

    ## [1] X 9 9 9 X 7 7 X X 6 10 X 10 X 9

    ## [16] 6 10 X 10 10

    ## Levels: 6 7 8 9 10 X

    ```


    Sometimes, what you want is even simpler. You have levels that are not found in
    the actual data. You can get rid of the empty levels using `fct_drop()`.


    ```

    f1

    ## [1] C B B A D

    ## Levels: A B C D

    levels(f1) <- LETTERS[1:10]

    f1

    ## [1] C B B A D

    ## Levels: A B C D E F G H I J

    fct_drop(f1)

    ## [1] C B B A D

    ## Levels: A B C D

    ```'
