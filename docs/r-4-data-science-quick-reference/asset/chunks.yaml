    ```\n\n你可以在右侧多次使用点：\n\n```\nrnorm(5) %>% tibble(x = ., y = .)\n## # A tibble:\
    \ 5 × 2\n##         x       y\n##       \n## 1 -0.951  -0.951\n## 2  0.0206  0.0206\n\
    ## 3  1.14    1.14\n## 4 -0.172  -0.172\n## 5  0.0795  0.0795\n```\n\n你也可以在嵌套函数调用中使用它。\n\
    \n```\nrnorm(5) %>% tibble(x = ., y = abs(.))\n## # A tibble: 5 × 2\n##      \
    \    x       y\n##        \n## 1  1.61    1.61\n## 2  1.86    1.86\n## 3 -0.211\
    \   0.211\n## 4 -0.00352 0.00352\n## 5 -0.522   0.522\n```\n\n但是，如果点*仅*出现在嵌套函数调用中，`magrittr`\
    \ 仍然会将其作为第一个参数添加到右侧函数中。\n\n```\nrnorm(5) %>% tibble(x = sin(.), y = abs(.))\n\
    ## # A tibble: 5 × 3\n##        .      x     y\n##      \n## 1  1.10   0.893 1.10\n\
    ## 2 -0.155 -0.155 0.155\n## 3  0.102  0.102 0.102\n## 4  0.627  0.587 0.627\n\
    ## 5  0.280  0.276 0.280\n```\n\n为避免这种情况，你可以将右侧表达式放在花括号中：\n\n```\nrnorm(5) %>%\
    \ { tibble(x = sin(.), y = abs(.)) }\n## # A tibble: 5 × 2\n##         x     \
    \ y\n##      \n## 1  0.661  0.723\n## 2  0.0588 0.0588\n## 3  0.960  1.86\n##\
    \ 4  0.820  0.961\n## 5 -0.366  0.375\n```\n\n一般来说，你可以将表达式放在花括号中作为管道操作符的右侧，并让\
    \ `magrittr` 对其进行求值。可以将其视为编写单参数匿名函数的一种方式。输入变量是点，花括号内的表达式是函数体。\n\n## 函数组合\n\n编写与你自己的管道配合良好的函数是轻而易举的。所有函数都将输入映射到输出（理想情况下没有副作用），因此所有函数都可以在管道中使用。如果关键输入是你所编写函数的第一个参数，那么左侧内容的默认位置就会起效——因此这是更好的做法——但否则你可以显式地使用点。\n\
    \n然而，在编写管道时，你通常不需要从头编写一个函数。如果一个函数仅仅是由其他函数调用组合而成——它本身就是一个管道函数——我们可以将其定义为这种形式。\n\
    \n在数学中，函数组合操作符 `°` 将函数 `f` 和 `g` 的组合 `g` `°` `f` 定义为函数：\n\n（`g` `°` `f`）（`x`）=\
    \ `g`（`f`（`x`））\n\n许多函数式编程语言鼓励你通过组合其他函数来编写函数，并为此提供操作符。这在 R 中并不常见，虽然你可以实现函数组合，但没有内置的操作符。不过，`magrittr`\
    \ 包为你提供了这种语法：\n\n```\nh <- . %>% f() %>% g()\n```\n\n这定义了函数 `h`，使得 `h(x) = g(f(x))`。\n\
    \n如果我们沿用之前看到的整理再清洗管道，并假设我们需要对多个输入文件执行相同操作，我们可以为此定义一个管道函数：\n\n```\npipeline <-\
    \ . %>%\n  pivot_longer(names_to = \"year\", values_to = \"mean_income\", !country)\
    \ %>%\n  drop_na()\n\npipeline\n## Functional sequence with the following components:\n\
    ##\n##  1\\. pivot_longer(., names_to = \"year\", values_to = \"mean_income\"\
    , !country)\n##  2\\. drop_na(.)\n##\n## Use 'functions' to extract the individual\
    \ functions.\n```\n"
- fmt: "# Other Pipe Operations\n\nThere are three other pipe operators in `magrittr`.\
    \ These are not imported when you import the `tidyverse` package, so to get access\
    \ to them, you have to import `magrittr` explicitly.\n\n```\nlibrary(magrittr)\n\
    ```\n\nThe `%<>%` operator is used to run a pipeline starting with a variable\
    \ and ending by assigning the result of the pipeline back to that variable. The\
    \ code\n\n```\nmydata %<>% pipeline()\n```\n\nis equivalent to\n\n```\nmydata\
    \ <- mydata %>% pipeline()\n```\n\nThis reassignment operator behaves similarly\
    \ to the stepwise pipeline convention we considered at the start of the chapter,\
    \ but it makes explicit that we are updating an existing variable. You cannot\
    \ accidentally assign the result to a different variable.\n\nIf your right-hand\
    \ side is an expression in curly brackets, you can refer to the input through\
    \ the dot variable:\n\n```\nmydata %<>% { .$x - .$y }\n## [1] 0.3597903 1.8108120\
    \ 2.3444173 3.1367824\n## [5] 0.2507438\n```\n\nIf, as here, the input is a data\
    \ frame and you want to access its columns, you need the notation `.$` to access\
    \ them. The `%$%` pipe operator opens the data frame for you so you can refer\
    \ to the columns by name.\n\n```\nmydata %$% { x - y }\n## [1] 0.3597903 1.8108120\
    \ 2.3444173 3.1367824\n## [5] 0.2507438\n```\n\nThe *tee* pipe operator, `%T>%`,\
    \ behaves like the regular pipe operator, `%>%`, except that it returns its input\
    \ rather than the result of calling the function on its right-hand side. The regular\
    \ pipe operation `x %>% f()` will return `f(x)`, but the tee pipe operation `x\
    \ %T>% f()` will call `f(x)` but return `x`. This is useful for calling functions\
    \ with side effects as a step inside a pipeline, such as saving intermediate results\
    \ to files or plotting data.\n\nIf you call a function in a usual pipeline, you\
    \ will pass the result of the function call on to the next function in the pipeline.\
    \ If you, for example, want to plot intermediate data, you might not be so lucky\
    \ that the plotting function will return the data. The `ggplot2` functions will\
    \ not (see Chapter [13](#476587_2_En_13_Chapter.xhtml)).\n\nIf you want to plot\
    \ intermediate values, you need to save the data in a variable, save it, and then\
    \ start a new pipeline with the data as input.\n\n```\ntidy_income %>% \n  pivot_longer(names_to\
    \ = \"year\", values_to = \"mean_income\", !country)\n# Summarize and visualize\
    \ data before we continue\nsummary(tidy_income)\nggplot(tidy_income, aes(x = year,\
    \ y = mean_income)) + geom_point()\n# Continue processing\ntidy_income |>\n  drop_na()\
    \ |>\n  write_csv(\"data/tidy-income.csv\")\n```\n\nWith the tee operator, you\
    \ can call the plotting function and continue the pipeline.\n\n```\nmydata %>%\n\
    \  pivot_longer(names_to = \"year\", values_to = \"mean_income\", !country) %T>%\n\
    \  # Summarize and then continue\n  { print(summary(.)) } %T>%\n  # Plot and then\
    \ continue\n  { print(ggplot(., aes(x = year, y = mean_income)) + geom_point())\
    \ } %>%\n  drop_na() %>% write_csv(\"data/tidy-income.csv\")\n```\n\nFootnotes\
    \ [1](#476587_2_En_6_Chapter.xhtml#Fn1_source)\n\n# 7. Functional Programming:\
    \ purrr\n\nA pipeline-based approach to data processing necessitates a functional\
    \ programming approach. After all, pipelines are compositions of functions, and\
    \ loops and variable assignment do not work well with pipelines. You are not precluded\
    \ from imperative programming, but you need to wrap it in functions.\n\nThe package\
    \ `purrr` makes functional programming easier. As with the other packages in this\
    \ book, it will be loaded if you import `tidyverse`, but you can load it explicitly\
    \ with\n\n```\nlibrary(purrr)\n```\n\nI will not describe all the functions in\
    \ the `purrr` package, there are many and more could be added between the time\
    \ I write this and the time you read it, but I will describe the functions you\
    \ will likely use often.\n\nMany of the examples in this chapter are so trivial\
    \ that you would not use `purrr` for them. Many reduce to vector expressions,\
    \ and vector expressions are both more straightforward to read and faster to evaluate.\
    \ However, applications where you cannot use vector expressions are more involved,\
    \ and I do not want the examples to overshadow the syntax.\n\n## General Features\
    \ of purrr Functions\n\nThe functions in the `purrr` package are \"high-order\"\
    \ functions, which means that the functions either take other functions as input\
    \ or return functions when you call them (or both). Most of the functions take\
    \ data as their first argument and return modified data. Thus, they are immediately\
    \ usable with pipelines. As additional arguments, they will accept one or more\
    \ functions that specify how you want to translate the input into the output.\n\
    \nOther functions do not transform data but instead modify functions. These are\
    \ used, so you do not need to write functions for the data transformation functions\
    \ explicitly; you can use a small set of functions and adapt them where needed.\n\
    \n## Filtering\n\nOne of the most straightforward functional programming patterns\
    \ is filtering. Here, you use a high-order filter function. This function takes\
    \ a predicate function, that is, a function that returns a logical value, and\
    \ then returns all elements where the predicate evaluates to `TRUE` (the function\
    \ `keep()`) or all elements where the predicate evaluates to `FALSE` (the function\
    \ `discard()`).\n\n```\nis_even <- function(x) x %% 2 == 0\n1:6 |> keep(is_even)\n\
    ## [1] 2 4 6\n1:6 |> discard(is_even)\n## [1] 1 3 5\n```\n\nWhen you work with\
    \ predicates, the `negate()` function can come in handy. It changes the truth\
    \ value of your predicate, such that if your predicate, `p`, returns `TRUE`, then\
    \ `negate(p)` returns `FALSE` and vice versa.\n\n```\n1:6 |> keep(negate(is_even))\n\
    ## [1] 1 3 5\n1:6 |> discard(negate(is_even))\n## [1] 2 4 6\n```\n\nSince you\
    \ already have complementary functions in `keep()` and `discard()`, you would\
    \ not use `negate()` for filtering, though.\n\nA special-case function, `compact()`,\
    \ removes `NULL` elements from a list.\n\n```\ny <- list(1:3, NULL, 1:3) |> compact()\n\
    ## [[1]]\n## [1] 1 2 3\n```\n\nIf you access attributes on objects, and those\
    \ are not set, R will give you `NULL` as a result, and for such cases, `compact()`\
    \ can be useful.\n\nIf we define lists:\n\n```\nx <- y <- 1:3\nnames(y) <- c(\"\
    one\", \"two\", \"three\")\n```\n\nthen `y`'s values will be named, while `x`'s\
    \ will not. If we try to get the names from `x`, we will get `NULL`.\n\n```\n\
    names(x)\n## NULL\nnames(y)\n## [1] \"one\"   \"two\"   \"three\"\n```\n\nUsing\
    \ `compact()` with `names()`, we will discard `x`.\n\n```\nz <- list(x, y) |>\
    \ compact(names)\n## $y\n##   one   two   three\n##     1     2       3\n```"
