  trans: "\n# 复杂列编码\n\n不同变量并不总是以独立列的形式呈现。例如，一个包含日期的列中，实际上可能同时包含日、月乃至年份信息。最理想的日期表现形式当然是日期对象，但为了举例说明，我们假设需要将日期拆分为“日”和“月”两列。你可以使用\
    \ `separate()` 函数来实现。\n\n```\ntbl  \n## 1  11     5\n## 2  4      7\n## 3  21\
    \     12\n```\n\n第一个参数是数据表，第二个参数是要拆分的列，`into` 参数则是一个列表，用于指定原始日期将被放入哪些列。\n\n默认情况下，原始列会被移除，但如果你希望保留它，可以使用\
    \ `remove` 参数。\n\n```\nseparate(tbl, date, into = c(\"day\", \"month\"), remove\
    \ = FALSE)\n## # A tibble: 3 × 3\n##   date  day   month\n##     \n## 1 11/5 \
    \ 11    5\n## 2 4/7   4     7\n## 3 21/12 21    12\n```\n\n将字符串列 `data` 中的字段分离后，你会得到\
    \ `day` 和 `month` 两列，这两列仍然包含字符串。要将其转换为数值，可以使用 `convert` 参数。\n\n```\nseparate(tbl,\
    \ date, into = c(\"day\", \"month\"), convert = TRUE)\n## # A tibble: 3 × 2\n\
    ##    day   month\n##     \n## 1  11        5\n## 2  4         7\n## 3  21   \
    \    12\n```\n\n默认情况下，列会以任何非字母数字字符作为分隔符进行拆分。这就是为什么数据中的 `/` 能被正确识别为日和月之间的分隔符。^(¹³)\
    \ 如果你的分隔符是其他字符，可以使用 `sep` 参数。该参数接受一个正则表达式，列将根据此表达式进行拆分。例如，我们可以像这样按字母字符和空格进行拆分：\n\
    \n```\ntbl \n## 1 11    5\n## 2 4     7\n## 3 21    12\n```\n\n正则表达式 `([[:alpha:]]|[[:space:]])+`\
    \ 指定了由（最外层）方括号内的字符类（我们放入了字母字符 `[:alpha:]` 和空格 `[:space:]`）组成的任意非零（由 `+` 指定）长度的序列。\n\
    \n此示例中的日期格式在实际应用中并不常见，但如果我们有以下格式的日期：\n\n```\ntbl <- tribble(\n  ~date,\n  \"11th\
    \ of May\",\n  \"4th of July\",\n  \"21st of December\"\n)\n```\n\n我们很难将分隔符字符串与月份名称区分开来。如果你需要的分隔符不是一个简单的正则表达式，或许可以改用\
    \ `extract()` 函数替代 `separate()`。使用 `extract()`，你可以利用正则表达式分组来识别需要提取的字段。\n\n你需要一个带有分组的表达式——即括号内的子表达式——这些分组匹配到的内容将作为值放入新列中。对于我们的日期，可以这样实现：\n\
    \n```\ntbl |> extract(\n  col = date,\n  into = c(\"day\", \"month\"),\n  regex\
    \ = paste0(\n    \"([[:digit:]]+)\",        # 第一组，表示日\n    \"[[:alpha:][:space:]]+\"\
    , # 需要忽略的内容；会匹配 \"th of\" 等\n    \"[[:space:]]\",           # 月份名称前的最后一个空格\n \
    \   \"([[:alpha:]]+)\"         # 第二组，表示月份\n  )\n)\n## # A tibble: 3 × 1\n##  \
    \ date\n##   \n## 1 11th of May\n## 2 4th of July\n## 3 21st of December\n```\n\
    \n对于 `separate()` 和 `extract()` 函数，你都可以生成两个以上的结果列。你可以为 `into` 参数提供两个以上的名称，当然，用于拆分和提取的表达式也应提供相应数量的值。\n\
    \n```\ntbl |> extract(\n  col = date,\n  into = c(\"day\", \"fluf\", \"month\"\
    ),\n  regex = paste0(\n    \"([[:digit:]]+)\",        # 第一组，表示日\n    \"([[:alpha:]]+)\"\
    ,        # st, nd, rd, th 这类内容放入 fluf 列\n    \"[[:alpha:][:space:]]+\", # 日和月之间的内容；不是分组，因此丢弃\n\
    \    \"([[:alpha:]]+)\"         # 第三组，表示月份\n  )\n)\n## # A tibble: 3 × 1\n## \
    \  date\n##   \n## 1 11th of May\n## 2 4th of July\n## 3 21st of December\n```\n\
    \n拆分操作的反向操作是合并。例如，假设 `tbl2` 包含 `day` 和 `month` 两列。下面的代码构建了这样一个表格：\n\n```\ntbl2\
    \ <- separate(tbl, col = date, into = c(\"day\", \"month\"))\n```\n\n在 `tbl2`\
    \ 中创建这样一个 tibble 后，我们可以使用 `unite()` 函数来撤销 `separate()` 操作，就像我们发现 `pivot_longer/wider()`\
    \ 可以互相撤销一样（当然，需要注意数据可能会丢失）。`col` 参数应为我们新创建的列名，后续参数则是组成新列的原始列。\n\n```\ntbl2 |>\
    \ unite(col = \"date\", day, month)\n## # A tibble: 3 × 1\n##   date\n##   \n\
    ## 1 11_5\n## 2 4_7\n## 3 21_12\n```\n\n默认情况下，新列中的分隔符是 `_`。这对于日期来说并不合适，但我们可以使用\
    \ `sep` 参数来更改它。\n\n```\ntbl2 |> unite(col = \"date\", day, month, sep = \"/\"\
    )\n## # A tibble: 3 × 1\n##   date\n##   \n## 1 11/5\n## 2 4/7\n## 3 21/12\n```\n\
    \n如果我们希望保留原始列，可以将 `remove` 参数设置为 `FALSE`。\n\n```\ntbl2 |> unite(\n  col = \"date\"\
    , day, month,\n  sep = \"/\", remove = FALSE\n)\n## # A tibble: 3 × 3\n##   date\
    \   day   month\n##      \n## 1 11/5   11    5\n## 2 4/7    4     7\n## 3 21/12\
    \  21    12\n```\n\n包含多个值的列，其值的数量不一定总是相同。例如，我们可能有这样的数据：第一次世界大战和第二次世界大战中各主要集团的伤亡人数。\n\
    \n```\nmilitary_casualties <- tribble(\n  ~war, ~groups, ~deaths,\n  'WW1',\n\
    \  \"Allied Powers/Central Powers\",\n  \"5.7,4.0\",\n  'WW2',\n  \"Germany/Japan/USSR/British\
    \ Empire/USA\",\n  \"5.3,2.1,10.7,0.6,0.4\"\n)\n```\n\n两次战争中的分组并不相同，因此我们无法将数据拆分成不同的列。但是，我们可以使用\
    \ `separate_rows()` 将其拆分为更多的行。\n\n```\nmilitary_casualties |> separate_rows(\n\
    \  groups, deaths,\n  sep = \"/|,\"\n)\n## # A tibble: 7 × 3\n##   war   groups\
    \          deaths\n##               \n## 1 WW1   Allied Powers   5.7\n## 2 WW1\
    \   Central Powers  4.0\n## 3 WW2   Germany         5.3\n## 4 WW2   Japan    \
    \       2.1\n## 5 WW2   USSR            10.7\n## 6 WW2   British Empire  0.6\n\
    ## 7 WW2   USA             0.4\n```\n\n我们在 `sep` 中使用的表达式表示按 `/` 或 `,` 进行拆分（字符串中的\
    \ `|` 是正则表达式中表示“或”的含义）。\n\n我们可能不希望这里的 `deaths` 是字符串，但使用 `convert = TRUE` 可以将它们转换为数值：\n\
    \n```\nmilitary_casualties |> separate_rows(\n  groups, deaths,\n  sep = \"/|,\"\
    ,\n  convert = TRUE\n)\n## # A tibble: 7 × 3\n##   war   groups         deaths\n\
    ##              \n## 1 WW1   Allied Powers  5.7\n## 2 WW1   Central Powers 4\n\
    ## 3 WW2   Germany        5.3\n## 4 WW2   Japan          2.1\n## 5 WW2   USSR\
    \           10.7\n## 6 WW2   British Empire 0.6\n## 7 WW2   USA            0.4\n\
    ```\n"
- fmt: "### Expanding, Crossing, and Completing\n\nFor some applications, it is useful\
    \ to create all combinations of values from two or more columns—even those combinations\
    \ that are missing from the data. For this, you can use the function `expand()`:\n\
    \n```\ntbl %>% expand(A, B)\n## # A tibble: 6 × 2\n##       A     B\n##   <int>\
    \ <int>\n## 1     1    11\n## 2     1    13\n## 3     2    11\n## 4     2    13\n\
    ## 5     4    11\n## 6     4    13\n```\n\nHere, we get all combinations of values\
    \ from columns `A` and `B` while column `C` is ignored. If a column contains values\
    \ from a larger set than what is found in the data, you can give `expand()` a\
    \ vector of values:\n\n```\ntbl %>% expand(A = 1:4, B)\n## # A tibble: 8 × 2\n\
    ##       A     B\n##   <int> <int>\n## 1     1    11\n## 2     1    13\n## 3 \
    \    2    11\n## 4     2    13\n## 5     3    11\n## 6     3    13\n## 7     4\
    \    11\n## 8     4    13\n```\n\nIf you have vectors of values you want to combine\
    \ this way, you can also use the `crossing()` function.\n\n```\ncrossing(A = 1:3,\
    \ B = 11:13)\n## # A tibble: 9 × 2\n##       A     B\n##   <int> <int>\n## 1 \
    \    1    11\n## 2     1    12\n## 3     1    13\n## 4     2    11\n## 5     2\
    \    12\n## 6     2    13\n## 7     3    11\n## 8     3    12\n## 9     3    13\n\
    ```\n\nIf you only want the combinations found in the data, you can combine `expand()`\
    \ with the `nesting()` function:\n\n```\ntbl  \n## 1     1    11\n## 2     2 \
    \   11\n## 3     4    13\n```\n\nThis combination gives you all the combinations\
    \ of the specified columns—all other columns are ignored—and only the unique combinations,\
    \ unlike if you extracted the columns by indexing. This is useful if you have\
    \ data with lots of duplications, but you only need to compute some statistics\
    \ for the unique combinations.\n\nIf you need all combinations in a data frame,\
    \ but accept missing values for those that are not present, you can use the `complete()`\
    \ function. It makes sure you have all combinations and put missing values in\
    \ the remaining columns for the combinations that are not in the original data.\n\
    \n```\ncomplete(tbl, A = 1:4)\n## # A tibble: 6 × 3\n##       A     B     C\n\
    ##   <int> <int> <int>\n## 1     1    11    21\n## 2     2    11    22\n## 3 \
    \    2    11    12\n## 4     3    NA    NA\n## 5     4    13    42\n## 6     4\
    \    13    32\ncomplete(tbl, B = 11:13)\n## # A tibble: 6 × 3\n##       B    \
    \ A     C\n##   <int> <int> <int>\n## 1    11     1    21\n## 2    11     2  \
    \  22\n## 3    11     2    12\n## 4    12    NA    NA\n## 5    13     4    42\n\
    ## 6    13     4    32\ncomplete(tbl, A = 1:4, B = 11:13)\n## # A tibble: 14 ×\
    \ 3\n##       A     B     C\n##   <int> <int> <int>\n## 1     1    11    21\n\
    ## 2     1    12    NA\n## 3     1    13    NA\n## 4     2    11    22\n## 5 \
    \    2    11    12\n## 6     2    12    NA\n## 7     2    13    NA\n## 8     3\
    \    11    NA\n## 9     3    12    NA\n## 10    3    13    NA\n## 11    4    11\
    \    NA\n## 12    4    12    NA\n## 13    4    13    42\n## 14    4    13    32\n\
    ```\n\n### Missing Values\n\nWhen data has missing values, it often requires application\
    \ domain knowledge to deal with it correctly. The `tidyr` package has some rudimentary\
    \ support for cleaning data with missing values; you might need more features\
    \ to deal with missing values properly, and you are likely to find those in the\
    \ `dplyr` package (see Chapter [8](#476587_2_En_8_Chapter.xhtml)).\n\nThe simplest\
    \ way to handle missing values is to get rid of it. A crude approach is to remove\
    \ all observations with one or more missing variable values. The `drop_na()` function\
    \ does exactly that.\n\n```\nmean_income           \n## # A tibble: 5 × 5\n##\
    \   country  `2002` `2003` `2004` `2005`\n##   <chr>     <dbl>  <dbl>  <dbl> \
    \ <dbl>\n## 1 Numenor  123456 132654     NA 324156\n## 2 Westeros 314256     NA\
    \     NA 465321\n## 3 Narnia   432156     NA     NA     NA\n## 4 Gondor   531426\
    \ 321465 235461 463521\n## 5 Laputa    14235  34125  45123  51234\n```\n\nIn this\
    \ example, we lose a country entirely if we have missing data for a single year.\
    \ This is unlikely to be acceptable and is another good argument for tidy data.\
    \ If we reformat the table and drop missing values, we will only remove the observations\
    \ where the income is missing for a given year.\n\n```\nmean_income %>% pivot_longer(\n\
    \  names_to = \"year\",\n  values_to = \"mean_income\",\n  -country\n) %>% drop_na()\n\
    ## # A tibble: 14 × 3\n##    country  year  mean_income\n##    <chr>    <chr>\
    \       <dbl>\n## 1  Numenor  2002      123456\n## 2  Numenor  2003      132654\n\
    ## 3  Numenor  2005      324156\n## 4  Westeros 2002      314256\n## 5  Westeros\
    \ 2005      465321\n## 6  Narnia   2002      432156\n## 7  Gondor   2002     \
    \ 531426\n## 8  Gondor   2003      321465\n## 9  Gondor   2004      235461\n##\
    \ 10 Gondor   2005      463521\n## 11 Laputa   2002       14235\n## 12 Laputa\
    \   2003       34125\n## 13 Laputa   2004       45123\n## 14 Laputa   2005   \
    \    51234\n```\n\nSometimes, you can replace missing data with some appropriate\
    \ data. For example, we could replace missing data in the `mean_income` table\
    \ by setting each value to the mean of its column. The `replace_na()` function\
    \ does this. It takes a data frame as its first argument and a list specifying\
    \ replacements as its second argument. This list should have a name for each column\
    \ you want to replace missing values in, and the value assigned to these names\
    \ should be the values with which you wish to replace.\n\n```\nreplace_na(mean_income,\
    \ list(\n  `2003` = mean(mean_income$`2003`, na.rm = TRUE)\n))\n## # A tibble:\
    \ 5 × 5\n##   country  `2002` `2003`  `2004` `2005`\n##   <chr>     <dbl>  <dbl>\
    \   <dbl>  <dbl>\n## 1 Numenor  123456 132654     NA  324156\n## 2 Westeros 314256\
    \ 162748     NA  465321\n## 3 Narnia   432156 162748     NA      NA\n## 4 Gondor\
    \   531426 321465  235461 463521\n## 5 Laputa    14235  34125   45123  51234\n\
    replace_na(mean_income, list(\n  `2003` = mean(mean_income$`2003`, na.rm = TRUE),\n\
    \  `2004` = mean(mean_income$`2004`, na.rm = TRUE),\n  `2005` = mean(mean_income$`2005`,\
    \ na.rm = TRUE)\n))\n## # A tibble: 5 × 5\n##   country  `2002` `2003` `2004`\
    \ `2005`\n##   <chr>     <dbl>  <dbl>  <dbl>  <dbl>\n## 1 Numenor  123456 132654\
    \ 140292 324156\n## 2 Westeros 314256 162748 140292 465321\n## 3 Narnia   432156\
    \ 162748 140292 326058\n## 4 Gondor   531426 321465 235461 463521\n## 5 Laputa\
    \    14235  34125  45123  51234\n```\n\nIn this example, using the mean per year\
    \ is unlikely to be useful; it would make more sense to replace missing data with\
    \ the mean for each country. This is not immediately possible with `tidyr` functions,\
    \ though. With `dplyr`, we have the tools for it, and I return to it in Chapter\
    \ [8](#476587_2_En_8_Chapter.xhtml).\n\nA final function for managing missing\
    \ data is the `fill()` function. It replaces missing values with the value above\
    \ them in their column (or below them if you set the argument `.direction` to\
    \ `\"up\"`). Imagine that we have a table of income per quarter of each year,\
    \ but the year is only mentioned for the first quarter.\n\n```\ntbl <- read_csv(\n\
    \  \"year, quarter, income\n  2011, Q1, 13\n  , Q2, 12\n  , Q3, 14\n  , Q4, 11\n\
    \  2012, Q1, 12\n  , Q2, 14\n  , Q3, 15\n  , Q4, 17\",\n  show_col_types = FALSE\n\
    )\nspec(tbl)\n## cols(\n##   year = col_double(),\n##   quarter = col_character(),\n\
    ##   income = col_double()\n## )\n```\n\nWe can repeat the years downward through\
    \ the quarters with `fill()`:\n\n```\nfill(tbl, year)\n## # A tibble: 8 × 3\n\
    ##    year quarter income\n##   <dbl> <chr>    <dbl>\n## 1  2011 Q1          13\n\
    ## 2  2011 Q2          12\n## 3  2011 Q3          14\n## 4  2011 Q4          11\n\
    ## 5  2012 Q1          12\n## 6  2012 Q2          14\n## 7  2012 Q3          15\n\
    ## 8  2012 Q4          17\n```"
