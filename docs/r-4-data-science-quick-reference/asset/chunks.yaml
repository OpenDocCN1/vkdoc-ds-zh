    you cannot create anonymous functions; you need to name a function to define it.
    In other languages, you have special syntax for lambda expressions. In R, you
    define anonymous functions the same way that you define named functions. You always
    define functions the same way; you only give them a name when you assign a function
    definition to a variable.


    If this sounds too theoretical, consider this example. When we filtered values
    that are even, we defined a function, `is_even()`, to use as a predicate.


    ```

    is_even  keep(is_even)

    ## [1] 2 4 6

    ```


    We defined the function using the expression `function(x) x %% 2 == 0`, and then
    we assigned the function to the name `is_even`. Instead of assigning the function
    to a name, we could use the function definition directly in the call to `keep()`:


    ```

    1:6 |> keep(function(x) x %% 2 == 0)

    ## [1] 2 4 6

    ```


    R 4 introduced new syntax for defining functions, giving us a slightly shorter
    form:


    ```

    1:6 |> keep(\(x) x %% 2 == 0)

    ## [1] 2 4 6

    ```


    that I tend to use in situations such as this, but this is entirely a question
    of taste. There is nothing wrong with the `function(`…`)` … syntax.


    So, R already has lambda expressions, but the syntax can be verbose, especially
    before R 4 and the `\(...) ...` syntax. In `purrr`, you can use a formula as a
    lambda expression instead of a function. You can define an `is_even()` function
    using a formula like this:


    ```

    is_even_lambda  keep(is_even_lambda)

    ## [1] 2 4 6

    ```


    or use the formula directly in your pipeline.


    ```

    1:6 |> keep(~ .x %% 2 == 0)

    ## [1] 2 4 6

    ```


    The variable `.x` in the expression will be interpreted as the first argument
    to the lambda expression.


    Lambda expressions are not an approach you can use to define functions in general.
    They only work because `purrr` functions understand formulae as function specifications.
    You cannot write


    ```

    is_even_lambda <- ~ .x %% 2 == 0

    is_even_lambda(3)

    ```


    This will give you an error. The error message is not telling you that you try
    to use a formula as a function, unfortunately, but just that it cannot find the
    function `is_even_lambda`. This is because R will look for a function when you
    call a variable as a function and ignore other variables with the same name. If
    you reassign to a variable


    ```

    f <- function(x) 2 * x

    f <- 5

    f(2)

    ## Error in f(2): could not find function "f"

    ```


    you are told that it cannot find a function with the name you call—not that the
    variable does not refer to a nonfunction. That is the error you get if you attempt
    to call a lambda expression outside a `purrr` function (or certain other Tidyverse
    functions ).


    R’s rule for looking for functions can be even more confusing if there is a variable
    in an inner scope and a function in an outer scope:


    ```

    f <- function(x) 2 * x

    g <- function() {

    f <- 5 # not a function

    f(2) # will look for a function

    }

    g()

    ## [1] 4

    ```


    Here, the `f()` function in the outer scope is called because it is a function;
    the variable in the inner scope is ignored.


    Getting back to lambda expressions in `purrr` functions, you can use them as more
    readable versions of partial evaluation.


    ```

    1:4 |> map_dbl(~ .x / 2)

    ## [1] 0.5 1.0 1.5 2.0

    1:3 |> map_dbl(~ 2 + .x)

    ## [1] 3 4 5

    1:3 |> map_dbl(~ 4 - .x)

    ## [1] 3 2 1

    1:3 |> map_dbl(~ .x - 4)

    ## [1] -3 -2 -1

    ```


    Or you can use them for more readable versions of function composition.


    ```

    1:3 |> map_dbl(~ 3 * (.x + 2))

    ## [1] 9 12 15

    ```


    If you need a lambda expression with two arguments, you can use `.x` and `.y`
    as the first and second arguments, respectively.


    ```

    map2_dbl(1:3, 1:3, ~ .x + .y)

    ## [1] 2 4 6

    ```


    If you need more than two arguments, you can use .*n* for the *n*th argument:


    ```

    list(1:3, 1:3, 1:3) %>% pmap_dbl(~ .1 + .2 + .3)

    ## [1] 0.6 0.6 0.6

    ```


    Footnotes [1](#476587_2_En_7_Chapter.xhtml#Fn1_source)


    # 8. Manipulating Data Frames: **dplyr**


    The `dplyr` package resembles the functionality in the `purrr` package, but it
    is designed for manipulating data frames. It will be loaded with the `tidyverse`
    package, but you can also load it using


    ```

    library(dplyr)

    ```


    The usual way that you use `dplyr` is similar to how you use `purrr`. You string
    together a sequence of actions in a pipeline, with the actions separated by the
    `%>%` operator. The difference between the two packages is that the `purrr` functions
    work on sequences while the `dplyr` functions work on data frames.


    This package is huge and more functionality is added in each new release, so it
    would be impossible for me to describe everything you can do with `dplyr`. I can
    only give you a flavor of the package functionality and refer you to the documentation
    for more information.'
  trans: '

    ## 部分求值与函数组合


    当你对序列进行筛选、映射或规约时，有时需要修改函数以匹配 `purrr` 函数的接口。如果你有一个函数参数过多（超出了接口要求），但可以通过固定某些参数来得到你想要的应用程序，那么你就可以进行所谓的*部分求值*。这仅仅意味着你创建一个新函数，该函数以固定了某些参数的原始函数来调用。


    例如，当你进行筛选时，你需要一个接收一个输入值并返回一个（布尔）输出值的函数。如果你想筛选出大于或小于（比如说）3 的值，你可以为此创建函数。


    ```

    greater_than_three <- function(x) x > 3

    less_than_three <- function(x) x < 3

    1:6 |> keep(greater_than_three)

    ## [1] 4 5 6

    1:6 |> keep(less_than_three)

    ## [1] 1 2

    ```


    这样做的一个缺点是，你可能需要定义许多这样的函数，即使每个函数在你的管道中只使用一次。


    使用 `partial()` 函数，你可以绑定参数，而无需显式定义新函数。例如，要绑定 `<` 的第一个参数（如 `greater_than_three()`
    函数那样），你可以使用 `partial()`：


    ```

    1:6 |> keep(partial(`<`, 3))

    ## [1] 4 5 6

    ```


    默认情况下，你总是绑定第一个（或前几个）参数。要绑定其他参数，你需要指定要绑定的参数名称。小于运算符有以下参数名称：


    ```

    `<`

    ## function (e1, e2) .Primitive("<")

    ```


    因此，你可以对 `less_than_three()` 使用这种部分求值：


    ```

    1:6 |> keep(partial(`<`, e2 = 3))

    ## [1] 1 2

    ```


    类似地，你可以在映射中使用部分求值：


    ```

    1:6 |> map_dbl(partial(`+`, 2))

    ## [1] 3 4 5 6 7 8

    1:6 |> map_dbl(partial(`-`, 1))

    ## [1] 0 -1 -2 -3 -4 -5

    1:3 |> map_dbl(partial(`-`, e1 = 4))

    ## [1] 3 2 1

    1:3 |> map_dbl(partial(`-`, e2 = 4))

    ## [1] -3 -2 -1

    ```


    如果你需要应用多个函数，例如


    ```

    1:3 |>

    map_dbl(partial(`+`, 2)) |>

    map_dbl(partial(`*`, 3))

    ## [1] 9 12 15

    ```


    你也可以简单地组合这些函数。函数组合 ° 的工作原理是：(*g* ° *f*)(*x*) = *g*(*f*(*x*))。


    因此，上面的管道也可以写成：


    ```

    1:3 |> map_dbl(

    compose(partial(`*`, 3), partial(`+`, 2))

    )

    ## [1] 9 12 15

    ```


    使用 `partial()` 和 `combine()`，你可以修改函数，但使用它们并不一定能让你获得易于阅读的代码。一个更易读的替代方案是使用 *lambda
    表达式*。


    ## Lambda 表达式


    Lambda 表达式是一种定义匿名函数的简洁语法，匿名函数即我们不命名的函数。名称 "lambda 表达式" 源于 "lambda 演算"（形式逻辑中的一门学科），但在计算机科学中，它主要用作匿名函数的同义词。在某些编程语言中，你不能创建匿名函数；你需要命名一个函数来定义它。在其他语言中，你有用于
    lambda 表达式的特殊语法。在 R 中，你定义匿名函数的方式与定义命名函数相同。你总是以相同的方式定义函数；只有在将函数定义赋值给变量时，你才给它一个名字。


    如果这听起来太理论化，请考虑这个例子。当我们筛选偶数值时，我们定义了一个函数 `is_even()` 作为谓词使用。


    ```

    is_even <- function(x) x %% 2 == 0

    1:6 |> keep(is_even)

    ## [1] 2 4 6

    ```


    我们使用表达式 `function(x) x %% 2 == 0` 定义了该函数，然后将该函数赋值给名称 `is_even`。与其将函数赋值给一个名称，我们可以在调用
    `keep()` 时直接使用函数定义：


    ```

    1:6 |> keep(function(x) x %% 2 == 0)

    ## [1] 2 4 6

    ```


    R 4 引入了用于定义函数的新语法，为我们提供了一种稍短的形式：


    ```

    1:6 |> keep(\(x) x %% 2 == 0)

    ## [1] 2 4 6

    ```


    我倾向于在这种情况下使用它，但这完全是个品味问题。`function(`…`)` … 语法本身并没有错。


    所以，R 已经有了 lambda 表达式，但其语法可能有些冗长，尤其是在 R 4 及 `\(...) ...` 语法出现之前。在 `purrr` 中，你可以使用公式作为
    lambda 表达式，而不是函数。你可以像这样使用公式来定义一个 `is_even()` 函数：


    ```

    is_even_lambda <- ~ .x %% 2 == 0

    1:6 |> keep(is_even_lambda)

    ## [1] 2 4 6

    ```


    或者直接在管道中使用该公式。


    ```

    1:6 |> keep(~ .x %% 2 == 0)

    ## [1] 2 4 6

    ```


    表达式中的变量 `.x` 将被解释为 lambda 表达式的第一个参数。


    Lambda 表达式并不是一种可以普遍用于定义函数的方法。它们之所以有效，只是因为 `purrr` 函数将公式理解为函数规范。你不能这样写：


    ```

    is_even_lambda <- ~ .x %% 2 == 0

    is_even_lambda(3)

    ```


    这会导致一个错误。不幸的是，错误信息不是告诉你试图将公式用作函数，而只是说找不到函数 `is_even_lambda`。这是因为当你将变量作为函数调用时，R
    会查找函数，而忽略同名的其他变量。如果你将变量重新赋值


    ```

    f <- function(x) 2 * x

    f <- 5

    f(2)

    ## Error in f(2): could not find function "f"

    ```


    你会被告知找不到你调用的名称对应的函数——而不是该变量不指向一个函数。这就是如果你试图在 `purrr` 函数（或某些其他 Tidyverse 函数）外部调用
    lambda 表达式时遇到的错误。


    如果在内部作用域有一个变量，外部作用域有一个函数，R 查找函数的规则可能会更加令人困惑：


    ```

    f <- function(x) 2 * x

    g <- function() {

    f <- 5 # 不是一个函数

    f(2) # 将查找一个函数

    }

    g()

    ## [1] 4

    ```


    在这里，外部作用域中的 `f()` 函数被调用，因为它是一个函数；内部作用域中的变量被忽略。


    回到 `purrr` 函数中的 lambda 表达式，你可以将它们用作部分求值的更易读版本。


    ```

    1:4 |> map_dbl(~ .x / 2)

    ## [1] 0.5 1.0 1.5 2.0

    1:3 |> map_dbl(~ 2 + .x)

    ## [1] 3 4 5

    1:3 |> map_dbl(~ 4 - .x)

    ## [1] 3 2 1

    1:3 |> map_dbl(~ .x - 4)

    ## [1] -3 -2 -1

    ```


    或者你可以将它们用于更易读的函数组合版本。


    ```

    1:3 |> map_dbl(~ 3 * (.x + 2))

    ## [1] 9 12 15

    ```


    如果你需要一个有两个参数的 lambda 表达式，你可以分别使用 `.x` 和 `.y` 作为第一个和第二个参数。


    ```

    map2_dbl(1:3, 1:3, ~ .x + .y)

    ## [1] 2 4 6

    ```


    如果你需要两个以上的参数，你可以使用 `.*n*` 来表示第 *n* 个参数：


    ```

    list(1:3, 1:3, 1:3) %>% pmap_dbl(~ .1 + .2 + .3)

    ## [1] 0.6 0.6 0.6

    ```


    # 操作数据框：`dplyr`


    `dplyr` 包的功能类似于 `purrr` 包，但其设计用于操作数据框。它会随 `tidyverse` 包一起加载，但你也可以使用以下命令单独加载它：


    ```

    library(dplyr)

    ```


    使用 `dplyr` 的常用方式类似于使用 `purrr`。你将一系列操作串联在一个管道中，操作之间用 `%>%` 运算符分隔。这两个包的区别在于，`purrr`
    函数作用于序列，而 `dplyr` 函数作用于数据框。


    这个包非常庞大，并且每个新版本都会增加更多功能，因此我不可能描述你可以用 `dplyr` 做的所有事情。我只能让你领略一下这个包的功能，并建议你查阅文档以获取更多信息。

    '
- fmt: "# Selecting Columns\n\nOne of the simplest operations you can do on a data\
    \ frame is selecting one or more of its columns. You can do this by indexing with\
    \ `$`:\n\n```\niris_df                \n## 1          5.1         3.5        \
    \  1.4\n## 2          4.9         3            1.4\n## 3          4.7        \
    \ 3.2          1.3\n## # . . . with 147 more rows, and 2 more variables:\n## #\
    \ Petal.Width , Species \nhead(iris_df$Species)\n## [1] setosa setosa setosa setosa\
    \ setosa setosa\n## Levels: setosa versicolor virginica\n```\n\nThis, however,\
    \ does not work well with pipelines where a data frame is flowing through from\
    \ action to action. In `dplyr`, you have the function `select()` for picking out\
    \ columns. We explored it in Chapter [4](#476587_2_En_4_Chapter.xhtml), but let’s\
    \ see a few examples more.\n\nYou can give the function one or more column names,\
    \ and it will give you a data frame containing only those columns.\n\n```\niris_df\
    \ |>\nselect(Sepal.Length, Species) |>\nprint(n = 3)\n## # A tibble: 150 × 2\n\
    ##   Sepal.Length Species\n##           \n## 1          5.1 setosa\n## 2     \
    \     4.9 setosa\n## 3          4.7 setosa\n## # . . . with 147 more rows\n```\n\
    \nYou can also use complements when selecting columns; just put a `!` in front\
    \ of the column names.\n\n```\niris_df |>\nselect(!Species) |>\nprint(n = 3)\n\
    ## # A tibble: 150 × 4\n##   Sepal.Length Sepal.Width Petal.Length\n##       \
    \                  \n## 1          5.1         3.5          1.4\n## 2        \
    \  4.9         3            1.4\n## 3          4.7         3.2          1.3\n\
    ## # . . . with 147 more rows, and 1 more variable:\n## # Petal.Width \niris_df\
    \ |>\nselect(!c(Species, Sepal.Length)) |>\nprint(n = 3)\n## # A tibble: 150 ×\
    \ 3\n##   Sepal.Width Petal.Length Petal.Width\n##                        \n##\
    \ 1         3.5          1.4         0.2\n## 2         3            1.4      \
    \   0.2\n## 3         3.2          1.3         0.2\n## # . . . with 147 more rows\n\
    ```\n\nYou can also use minus to remove columns from a selection:\n\n```\niris_df\
    \ |>\nselect(-Species) |>\nprint(n = 3)\n## # A tibble: 150 × 4\n##   Sepal.Length\
    \ Sepal.Width Petal.Length\n##                         \n## 1          5.1   \
    \      3.5          1.4\n## 2          4.9         3            1.4\n## 3    \
    \      4.7         3.2          1.3\n## # . . . with 147 more rows, and 1 more\
    \ variable:\n## # Petal.Width \niris_df |>\nselect(-c(Species, Sepal.Length))\
    \ |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Width Petal.Length Petal.Width\n\
    ##                        \n## 1         3.5          1.4         0.2\n## 2  \
    \       3            1.4         0.2\n## 3         3.2          1.3         0.2\n\
    ## # . . . with 147 more rows\n```\n\nbut `!` and `-` do not behave exactly the\
    \ same way when you provide more than one argument to `select()`.\n\nWith `!`\
    \ you ask for all columns except those you exclude, so if you write\n\n```\niris_df\
    \ |>\nselect(!Species, !Sepal.Length) |>\nprint(n = 3)\n## # A tibble: 150 × 5\n\
    ##   Sepal.Length Sepal.Width Petal.Length\n##                         \n## 1\
    \          5.1         3.5          1.4\n## 2          4.9         3         \
    \   1.4\n## 3          4.7         3.2          1.3\n## # . . . with 147 more\
    \ rows, and 2 more variables:\n## # Petal.Width , Species \n```\n\nyou first ask\
    \ for all columns except `Species` and then for all columns except `Sepal.Length`,\
    \ and you get the union of the two selections (which includes everything).\n\n\
    With minus, you ask for the columns to be removed instead, so with\n\n```\niris_df\
    \ |>\nselect(-Species, -Sepal.Length) |>\nprint(n = 3)\n## # A tibble: 150 × 3\n\
    ##   Sepal.Width Petal.Length Petal.Width\n##                        \n## 1  \
    \       3.5          1.4         0.2\n## 2         3            1.4         0.2\n\
    ## 3         3.2          1.3         0.2\n## # . . . with 147 more rows\n```\n\
    \nyou first remove `Species` and then `Sepal.Length` so neither are included in\
    \ the final table.\n\nYou do not need to use column names. You can also use indices.\n\
    \n```\niris_df |>\nselect(1) |>\nprint(n = 3)\n## # A tibble: 150 × 1\n##   Sepal.Length\n\
    ##          \n## 1          5.1\n## 2          4.9\n## 3          4.7\n## # .\
    \ . . with 147 more rows\niris_df |>\nselect(1:3) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 3\n##   Sepal.Length Sepal.Width Petal.Length\n##                    \
    \     \n## 1          5.1         3.5          1.4\n## 2          4.9        \
    \ 3            1.4\n## 3          4.7         3.2          1.3\n## # . . . with\
    \ 147 more rows\n```\n\nThis, of course, is less informative about what is being\
    \ selected when you read the code. The second selection earlier shows that you\
    \ can extract ranges using indices the same way as we can using column names.\n\
    \n```\niris_df |>\nselect(Petal.Length:Species) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 3\n##   Petal.Length Petal.Width Species\n##                  \n## 1 \
    \         1.4         0.2 setosa\n## 2          1.4         0.2 setosa\n## 3 \
    \         1.3         0.2 setosa\n## # . . . with 147 more rows\n```\n\nAll the\
    \ other functions described in Chapter [4](#476587_2_En_4_Chapter.xhtml) work\
    \ for `select()`, of course:\n\n```\niris_df |>\nselect(starts_with(\"Petal\"\
    )) |>\nprint(n = 3)\n## # A tibble: 150 × 2\n##   Petal.Length Petal.Width\n##\
    \                 \n## 1          1.4         0.2\n## 2          1.4         0.2\n\
    ## 3          1.3         0.2\n## # . . . with 147 more rows\niris_df |>\nselect(-starts_with(\"\
    Petal\")) |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Length Sepal.Width\
    \ Species\n##                    \n## 1          5.1         3.5 setosa\n## 2\
    \          4.9         3   setosa\n## 3          4.7         3.2 setosa\n## #\
    \ . . . with 147 more rows\niris_df |>\nselect(starts_with(\"Petal\"), Species)\
    \ |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Petal.Length Petal.Width Species\n\
    ##                  \n## 1          1.4         0.2 setosa\n## 2          1.4\
    \         0.2 setosa\n## 3          1.3         0.2 setosa\n## # . . . with 147\
    \ more rows\niris_df |>\nselect(starts_with(\"PETAL\", ignore.case = TRUE)) |>\n\
    print(n = 3)\n## # A tibble: 150 × 2\n##   Petal.Length Petal.Width\n##      \
    \           \n## 1          1.4         0.2\n## 2          1.4         0.2\n##\
    \ 3          1.3         0.2\n## # . . . with 147 more rows\niris_df |>\nselect(starts_with(\"\
    S\")) |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Length Sepal.Width\
    \ Species\n##                  \n## 1          5.1         3.5 setosa\n## 2  \
    \        4.9         3   setosa\n## 3          4.7         3.2 setosa\n## # .\
    \ . . with 147 more rows\niris_df |>\nselect(ends_with(\"Length\")) |>\nprint(n\
    \ = 3)\n## # A tibble: 150 × 2\n##   Sepal.Length Petal.Length\n##           \
    \       \n## 1          5.1          1.4\n## 2          4.9          1.4\n## 3\
    \          4.7          1.3\n## # . . . with 147 more rows\niris_df |>\nselect(contains(\"\
    ng\")) |>\nprint(n = 3)\n## # A tibble: 150 × 2\n##   Sepal.Length Petal.Length\n\
    ##                  \n## 1          5.1          1.4\n## 2          4.9      \
    \    1.4\n## 3          4.7          1.3\n## # . . . with 147 more rows\n```\n\
    \nYou can also use `select()` to rename columns. If you use a named parameter,\
    \ the columns you select will get the names you use for the function parameters.\n\
    \n```\niris_df |>\nselect(sepal_length = Sepal.Length,\nsepal_width = Sepal.Width)\
    \ |>\nprint(n = 3)\n## # A tibble: 150 × 2\n##   sepal_length sepal_width\n##\
    \                 \n## 1          5.1         3.5\n## 2          4.9         3\n\
    ## 3          4.7         3.2\n## # . . . with 147 more rows\n```\n\nSince `select()`\
    \ removes the columns you do *not* select, it might not always be your best choice\
    \ for what you need to do. A similar function to `select()`, where you do not\
    \ lose columns, is `rename()`. With this function, you can rename columns and\
    \ keep the remaining columns as well.\n\n```\niris_df |>\nrename(sepal_length\
    \ = Sepal.Length,\nsepal_width = Sepal.Width) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 5\n##   sepal_length sepal_width Petal.Length\n##                    \
    \     \n## 1          5.1         3.5          1.4\n## 2          4.9        \
    \ 3            1.4\n## 3          4.7         3.2          1.3\n## # . . . with\
    \ 147 more rows, and 2 more variables:\n## # Petal.Width , Species \n```"
  raw: "## Selecting Columns\n\nOne of the simplest operations you can do on a data\
    \ frame is selecting one or more of its columns . You can do this by indexing\
    \ with `$`:\n\n```\niris_df                \n## 1          5.1         3.5   \
    \       1.4\n## 2          4.9         3            1.4\n## 3          4.7   \
    \      3.2          1.3\n## # . . . with 147 more rows, and 2 more variables:\n\
    ## # Petal.Width , Species \nhead(iris_df$Species)\n## [1] setosa setosa setosa\
    \ setosa setosa setosa\n## Levels: setosa versicolor virginica\n```\n\nThis, however,\
    \ does not work well with pipelines where a data frame is flowing through from\
    \ action to action. In `dplyr` , you have the function `select()` for picking\
    \ out columns. We explored it in Chapter [4](#476587_2_En_4_Chapter.xhtml), but\
    \ let’s see a few examples more.\n\nYou can give the function one or more column\
    \ names, and it will give you a data frame containing only those columns.\n\n\
    ```\niris_df |>\nselect(Sepal.Length, Species) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 2\n##   Sepal.Length Species\n##           \n## 1          5.1 setosa\n\
    ## 2          4.9 setosa\n## 3          4.7 setosa\n## # . . . with 147 more rows\n\
    ```\n\nYou can also use complements when selecting columns; just put a `!` in\
    \ front of the column names .\n\n```\niris_df |>\nselect(!Species) |>\nprint(n\
    \ = 3)\n## # A tibble: 150 × 4\n##   Sepal.Length Sepal.Width Petal.Length\n##\
    \                         \n## 1          5.1         3.5          1.4\n## 2 \
    \         4.9         3            1.4\n## 3          4.7         3.2        \
    \  1.3\n## # . . . with 147 more rows, and 1 more variable:\n## # Petal.Width\
    \ \niris_df |>\nselect(!c(Species, Sepal.Length)) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 3\n##   Sepal.Width Petal.Length Petal.Width\n##                     \
    \   \n## 1         3.5          1.4         0.2\n## 2         3            1.4\
    \         0.2\n## 3         3.2          1.3         0.2\n## # . . . with 147\
    \ more rows\n```\n\nYou can also use minus to remove columns from a selection:\n\
    \n```\niris_df |>\nselect(-Species) |>\nprint(n = 3)\n## # A tibble: 150 × 4\n\
    ##   Sepal.Length Sepal.Width Petal.Length\n##                         \n## 1\
    \          5.1         3.5          1.4\n## 2          4.9         3         \
    \   1.4\n## 3          4.7         3.2          1.3\n## # . . . with 147 more\
    \ rows, and 1 more variable:\n## # Petal.Width \niris_df |>\nselect(-c(Species,\
    \ Sepal.Length)) |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Width Petal.Length\
    \ Petal.Width\n##                        \n## 1         3.5          1.4     \
    \    0.2\n## 2         3            1.4         0.2\n## 3         3.2        \
    \  1.3         0.2\n## # . . . with 147 more rows\n```\n\nbut `!` and `-` do not\
    \ behave exactly the same way when you provide more than one argument to `select()`.\n\
    \nWith `!` you ask for all columns except those you exclude, so if you write\n\
    \n```\niris_df |>\nselect(!Species, !Sepal.Length) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 5\n##   Sepal.Length Sepal.Width Petal.Length\n##                    \
    \     \n## 1          5.1         3.5          1.4\n## 2          4.9        \
    \ 3            1.4\n## 3          4.7         3.2          1.3\n## # . . . with\
    \ 147 more rows, and 2 more variables:\n## # Petal.Width , Species \n```\n\nyou\
    \ first ask for all columns except `Species` and then for all columns except `Sepal.Length`\
    \ , and you get the union of the two selections (which includes everything).\n\
    \nWith minus, you ask for the columns to be removed instead, so with\n\n```\n\
    iris_df |>\nselect(-Species, -Sepal.Length) |>\nprint(n = 3)\n## # A tibble: 150\
    \ × 3\n##   Sepal.Width Petal.Length Petal.Width\n##                        \n\
    ## 1         3.5          1.4         0.2\n## 2         3            1.4     \
    \    0.2\n## 3         3.2          1.3         0.2\n## # . . . with 147 more\
    \ rows\n```\n\nyou first remove `Species` and then `Sepal.Length` so neither are\
    \ included in the final table.\n\nYou do not need to use column names. You can\
    \ also use indices.\n\n```\niris_df |>\nselect(1) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 1\n##   Sepal.Length\n##          \n## 1          5.1\n## 2          4.9\n\
    ## 3          4.7\n## # . . . with 147 more rows\niris_df |>\nselect(1:3) |>\n\
    print(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Length Sepal.Width Petal.Length\n\
    ##                         \n## 1          5.1         3.5          1.4\n## 2\
    \          4.9         3            1.4\n## 3          4.7         3.2       \
    \   1.3\n## # . . . with 147 more rows\n```\n\nThis, of course, is less informative\
    \ about what is being selected when you read the code. The second selection earlier\
    \ shows that you can extract ranges using indices the same way as we can using\
    \ column names.\n\n```\niris_df |>\nselect(Petal.Length:Species) |>\nprint(n =\
    \ 3)\n## # A tibble: 150 × 3\n##   Petal.Length Petal.Width Species\n##      \
    \            \n## 1          1.4         0.2 setosa\n## 2          1.4       \
    \  0.2 setosa\n## 3          1.3         0.2 setosa\n## # . . . with 147 more\
    \ rows\n```\n\nAll the other functions described in Chapter [4](#476587_2_En_4_Chapter.xhtml)\
    \ work for `select()` , of course:\n\n```\niris_df |>\nselect(starts_with(\"Petal\"\
    )) |>\nprint(n = 3)\n## # A tibble: 150 × 2\n##   Petal.Length Petal.Width\n##\
    \                 \n## 1          1.4         0.2\n## 2          1.4         0.2\n\
    ## 3          1.3         0.2\n## # . . . with 147 more rows\niris_df |>\nselect(-starts_with(\"\
    Petal\")) |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Length Sepal.Width\
    \ Species\n##                    \n## 1          5.1         3.5 setosa\n## 2\
    \          4.9         3   setosa\n## 3          4.7         3.2 setosa\n## #\
    \ . . . with 147 more rows\niris_df |>\nselect(starts_with(\"Petal\"), Species)\
    \ |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Petal.Length Petal.Width Species\n\
    ##                  \n## 1          1.4         0.2 setosa\n## 2          1.4\
    \         0.2 setosa\n## 3          1.3         0.2 setosa\n## # . . . with 147\
    \ more rows\niris_df |>\nselect(starts_with(\"PETAL\", ignore.case = TRUE)) |>\n\
    print(n = 3)\n## # A tibble: 150 × 2\n##   Petal.Length Petal.Width\n##      \
    \           \n## 1          1.4         0.2\n## 2          1.4         0.2\n##\
    \ 3          1.3         0.2\n## # . . . with 147 more rows\niris_df |>\nselect(starts_with(\"\
    S\")) |>\nprint(n = 3)\n## # A tibble: 150 × 3\n##   Sepal.Length Sepal.Width\
    \ Species\n##                  \n## 1          5.1         3.5 setosa\n## 2  \
    \        4.9         3   setosa\n## 3          4.7         3.2 setosa\n## # .\
    \ . . with 147 more rows\niris_df |>\nselect(ends_with(\"Length\")) |>\nprint(n\
    \ = 3)\n## # A tibble: 150 × 2\n##   Sepal.Length Petal.Length\n##           \
    \       \n## 1          5.1          1.4\n## 2          4.9          1.4\n## 3\
    \          4.7          1.3\n## # . . . with 147 more rows\niris_df |>\nselect(contains(\"\
    ng\")) |>\nprint(n = 3)\n## # A tibble: 150 × 2\n##   Sepal.Length Petal.Length\n\
    ##                  \n## 1          5.1          1.4\n## 2          4.9      \
    \    1.4\n## 3          4.7          1.3\n## # . . . with 147 more rows\n```\n\
    \nYou can also use `select()` to rename columns. If you use a named parameter,\
    \ the columns you select will get the names you use for the function parameters.\n\
    \n```\niris_df |>\nselect(sepal_length = Sepal.Length,\nsepal_width = Sepal.Width)\
    \ |>\nprint(n = 3)\n## # A tibble: 150 × 2\n##   sepal_length sepal_width\n##\
    \                 \n## 1          5.1         3.5\n## 2          4.9         3\n\
    ## 3          4.7         3.2\n## # . . . with 147 more rows\n```\n\nSince `select()`\
    \ removes the columns you do *not* select, it might not always be your best choice\
    \ for what you need to do. A similar function to `select()`, where you do not\
    \ lose columns, is `rename()` . With this function, you can rename columns and\
    \ keep the remaining columns as well.\n\n```\niris_df |>\nrename(sepal_length\
    \ = Sepal.Length,\nsepal_width = Sepal.Width) |>\nprint(n = 3)\n## # A tibble:\
    \ 150 × 5\n##   sepal_length sepal_width Petal.Length\n##                    \
    \     \n## 1          5.1         3.5          1.4\n## 2          4.9        \
    \ 3            1.4\n## 3          4.7         3.2          1.3\n## # . . . with\
    \ 147 more rows, and 2 more variables:\n## # Petal.Width , Species \n```"
  trans: "\n# 选择列\n\n对数据框执行的最简单操作之一就是选择其中的一列或多列。你可以通过使用 `$` 进行索引来实现这一点：\n\n```\niris_df\
    \                \n## 1          5.1         3.5          1.4\n## 2          4.9\
    \         3            1.4\n## 3          4.7         3.2          1.3\n## # .\
    \ . . 还有 147 行，以及另外 2 个变量：\n## # Petal.Width , Species \nhead(iris_df$Species)\n\
    ## [1] setosa setosa setosa setosa setosa setosa\n## Levels: setosa versicolor\
    \ virginica\n```\n\n然而，这种方法在处理数据框在动作之间传递的管道操作时效果不佳。在 `dplyr` 中，你可以使用 `select()`\
    \ 函数来挑选列。我们在第 4 章中探讨过它，但让我们再看几个例子。\n\n你可以向该函数提供一个或多个列名，它将返回一个仅包含这些列的数据框。\n\n```\n\
    iris_df |>\nselect(Sepal.Length, Species) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 2\n##   Sepal.Length Species\n##           \n## 1          5.1 setosa\n##\
    \ 2          4.9 setosa\n## 3          4.7 setosa\n## # . . . 还有 147 行\n```\n\n\
    在选择列时，你也可以使用补集；只需在列名前加上 `!` 即可。\n\n```\niris_df |>\nselect(!Species) |>\nprint(n\
    \ = 3)\n## # 一个 tibble：150 × 4\n##   Sepal.Length Sepal.Width Petal.Length\n##\
    \                         \n## 1          5.1         3.5          1.4\n## 2 \
    \         4.9         3            1.4\n## 3          4.7         3.2        \
    \  1.3\n## # . . . 还有 147 行，以及另外 1 个变量：\n## # Petal.Width \niris_df |>\nselect(!c(Species,\
    \ Sepal.Length)) |>\nprint(n = 3)\n## # 一个 tibble：150 × 3\n##   Sepal.Width Petal.Length\
    \ Petal.Width\n##                        \n## 1         3.5          1.4     \
    \    0.2\n## 2         3            1.4         0.2\n## 3         3.2        \
    \  1.3         0.2\n## # . . . 还有 147 行\n```\n\n你也可以使用减号从选择中移除列：\n\n```\niris_df\
    \ |>\nselect(-Species) |>\nprint(n = 3)\n## # 一个 tibble：150 × 4\n##   Sepal.Length\
    \ Sepal.Width Petal.Length\n##                         \n## 1          5.1   \
    \      3.5          1.4\n## 2          4.9         3            1.4\n## 3    \
    \      4.7         3.2          1.3\n## # . . . 还有 147 行，以及另外 1 个变量：\n## # Petal.Width\
    \ \niris_df |>\nselect(-c(Species, Sepal.Length)) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 3\n##   Sepal.Width Petal.Length Petal.Width\n##                        \n\
    ## 1         3.5          1.4         0.2\n## 2         3            1.4     \
    \    0.2\n## 3         3.2          1.3         0.2\n## # . . . 还有 147 行\n```\n\
    \n但是，当你向 `select()` 提供多个参数时，`!` 和 `-` 的行为并不完全相同。\n\n使用 `!` 时，你请求的是除了你排除的列之外的所有列，所以如果你写\n\
    \n```\niris_df |>\nselect(!Species, !Sepal.Length) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 5\n##   Sepal.Length Sepal.Width Petal.Length\n##                        \
    \ \n## 1          5.1         3.5          1.4\n## 2          4.9         3  \
    \          1.4\n## 3          4.7         3.2          1.3\n## # . . . 还有 147\
    \ 行，以及另外 2 个变量：\n## # Petal.Width , Species \n```\n\n你首先请求除了 `Species` 之外的所有列，然后请求除了\
    \ `Sepal.Length` 之外的所有列，你得到的是这两个选择的并集（其中包括所有内容）。\n\n使用减号时，你请求的是要移除的列，所以使用\n\n\
    ```\niris_df |>\nselect(-Species, -Sepal.Length) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 3\n##   Sepal.Width Petal.Length Petal.Width\n##                        \n\
    ## 1         3.5          1.4         0.2\n## 2         3            1.4     \
    \    0.2\n## 3         3.2          1.3         0.2\n## # . . . 还有 147 行\n```\n\
    \n你首先移除了 `Species`，然后移除了 `Sepal.Length`，因此两者都不包含在最终表格中。\n\n你不需要使用列名。你也可以使用索引。\n\
    \n```\niris_df |>\nselect(1) |>\nprint(n = 3)\n## # 一个 tibble：150 × 1\n##   Sepal.Length\n\
    ##          \n## 1          5.1\n## 2          4.9\n## 3          4.7\n## # .\
    \ . . 还有 147 行\niris_df |>\nselect(1:3) |>\nprint(n = 3)\n## # 一个 tibble：150 ×\
    \ 3\n##   Sepal.Length Sepal.Width Petal.Length\n##                         \n\
    ## 1          5.1         3.5          1.4\n## 2          4.9         3      \
    \      1.4\n## 3          4.7         3.2          1.3\n## # . . . 还有 147 行\n\
    ```\n\n当然，当你阅读代码时，这并不能提供关于选中了什么的信息。前面的第二个选择展示了你可以像使用列名一样，使用索引来提取范围。\n\n```\niris_df\
    \ |>\nselect(Petal.Length:Species) |>\nprint(n = 3)\n## # 一个 tibble：150 × 3\n\
    ##   Petal.Length Petal.Width Species\n##                  \n## 1          1.4\
    \         0.2 setosa\n## 2          1.4         0.2 setosa\n## 3          1.3\
    \         0.2 setosa\n## # . . . 还有 147 行\n```\n\n当然，第 4 章中描述的所有其他函数也都适用于 `select()`：\n\
    \n```\niris_df |>\nselect(starts_with(\"Petal\")) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 2\n##   Petal.Length Petal.Width\n##                 \n## 1          1.4 \
    \        0.2\n## 2          1.4         0.2\n## 3          1.3         0.2\n##\
    \ # . . . 还有 147 行\niris_df |>\nselect(-starts_with(\"Petal\")) |>\nprint(n =\
    \ 3)\n## # 一个 tibble：150 × 3\n##   Sepal.Length Sepal.Width Species\n##      \
    \              \n## 1          5.1         3.5 setosa\n## 2          4.9     \
    \    3   setosa\n## 3          4.7         3.2 setosa\n## # . . . 还有 147 行\niris_df\
    \ |>\nselect(starts_with(\"Petal\"), Species) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 3\n##   Petal.Length Petal.Width Species\n##                  \n## 1     \
    \     1.4         0.2 setosa\n## 2          1.4         0.2 setosa\n## 3     \
    \     1.3         0.2 setosa\n## # . . . 还有 147 行\niris_df |>\nselect(starts_with(\"\
    PETAL\", ignore.case = TRUE)) |>\nprint(n = 3)\n## # 一个 tibble：150 × 2\n##   Petal.Length\
    \ Petal.Width\n##                 \n## 1          1.4         0.2\n## 2      \
    \    1.4         0.2\n## 3          1.3         0.2\n## # . . . 还有 147 行\niris_df\
    \ |>\nselect(starts_with(\"S\")) |>\nprint(n = 3)\n## # 一个 tibble：150 × 3\n##\
    \   Sepal.Length Sepal.Width Species\n##                  \n## 1          5.1\
    \         3.5 setosa\n## 2          4.9         3   setosa\n## 3          4.7\
    \         3.2 setosa\n## # . . . 还有 147 行\niris_df |>\nselect(ends_with(\"Length\"\
    )) |>\nprint(n = 3)\n## # 一个 tibble：150 × 2\n##   Sepal.Length Petal.Length\n\
    ##                  \n## 1          5.1          1.4\n## 2          4.9      \
    \    1.4\n## 3          4.7          1.3\n## # . . . 还有 147 行\niris_df |>\nselect(contains(\"\
    ng\")) |>\nprint(n = 3)\n## # 一个 tibble：150 × 2\n##   Sepal.Length Petal.Length\n\
    ##                  \n## 1          5.1          1.4\n## 2          4.9      \
    \    1.4\n## 3          4.7          1.3\n## # . . . 还有 147 行\n```\n\n你还可以使用 `select()`\
    \ 来重命名列。如果你使用一个命名参数，你选择的列将获得你为函数参数使用的名称。\n\n```\niris_df |>\nselect(sepal_length\
    \ = Sepal.Length,\nsepal_width = Sepal.Width) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 2\n##   sepal_length sepal_width\n##                 \n## 1          5.1 \
    \        3.5\n## 2          4.9         3\n## 3          4.7         3.2\n## #\
    \ . . . 还有 147 行\n```\n\n由于 `select()` 会移除你*没有*选中的列，它可能并不总是满足你需求的最佳选择。一个类似于 `select()`\
    \ 但不会丢失列的函数是 `rename()`。使用这个函数，你可以重命名列，同时保留其余列。\n\n```\niris_df |>\nrename(sepal_length\
    \ = Sepal.Length,\nsepal_width = Sepal.Width) |>\nprint(n = 3)\n## # 一个 tibble：150\
    \ × 5\n##   sepal_length sepal_width Petal.Length\n##                        \
    \ \n## 1          5.1         3.5          1.4\n## 2          4.9         3  \
    \          1.4\n## 3          4.7         3.2          1.3\n## # . . . 还有 147\
    \ 行，以及另外 2 个变量：\n## # Petal.Width , Species \n```\n"
- fmt: "# Filter\n\nWhile `select()` extracts a subset of columns, the `filter()`\
    \ function does the same for rows.\n\nThe `iris_df` contains three different species.\
    \ We can see this using the `distinct()` function. This function is also from\
    \ the `dplyr` package, and it gives you all the unique rows from selected columns.\n\
    \n```\niris_df |> distinct(Species)\n## # A tibble: 3 × 1\n##   Species\n##  \
    \ \n## 1 setosa\n## 2 versicolor\n## 3 virginica\n```\n\nWe can select the rows\
    \ where the species is “setosa” using `filter()`:\n\n```\niris_df |>\nfilter(Species\
    \ == \"setosa\") |>\nprint(n = 3)\n## # A tibble: 50 × 5\n##   Sepal.Length Sepal.Width\
    \ Petal.Length\n##                         \n## 1          5.1         3.5   \
    \       1.4\n## 2          4.9         3            1.4\n## 3          4.7   \
    \      3.2          1.3\n## # . . . with 47 more rows, and 2 more variables:\n\
    ## # Petal.Width , Species \n```\n\nWe can combine `filter()` and `select()` in\
    \ a pipeline to get a subset of the columns as well as a subset of the rows.\n\
    \n```\niris_df |>\nfilter(Species == \"setosa\") |>\nselect(ends_with(\"Length\"\
    ), Species) |>\nprint(n = 3)\n## # A tibble: 50 × 3\n##   Sepal.Length Petal.Length\
    \ Species\n##                   \n## 1          5.1          1.4 setosa\n## 2\
    \          4.9          1.4 setosa\n## 3          4.7          1.3 setosa\n##\
    \ # . . . with 47 more rows\n```\n\nGenerally, we can string together as many\
    \ `dplyr` (or `purrr`) functions as we desire in pipelines.\n\n```\niris_df |>\n\
    filter(Species != \"setosa\") |>\ndistinct(Species) |>\nprint(n = 3)\n## # A tibble:\
    \ 2 × 1\n##   Species\n##   \n## 1 versicolor\n## 2 virginica\n```\n\nWe can use\
    \ more than one column to filter by:\n\n```\niris_df |>\nfilter(Sepal.Length >\
    \ 5, Petal.Width \nprint(n = 3)\n## # A tibble: 15 × 5\n##   Sepal.Length Sepal.Width\
    \ Petal.Length\n##            \n## 1          5.1   3.5   1.4\n## 2          5.4\
    \   3.7   1.5\n## 3          5.8   4     1.2\n## # . . . with 12 more rows, and\
    \ 2 more variables:\n## # Petal.Width , Species \n```\n\nWe can also use functions\
    \ as a predicate, for example, the `between()` function to select numbers in a\
    \ given range.\n\n```\niris_df |>\nfilter(between(Sepal.Width, 2, 2.5)) |>\nprint(n\
    \ = 3)\n## # A tibble: 19 × 5\n##   Sepal.Length Sepal.Width Petal.Length\n##\
    \                         \n## 1          4.5         2.3          1.3\n## 2 \
    \         5.5         2.3          4\n## 3          4.9         2.4          3.3\n\
    ## # . . . with 16 more rows, and 2 more variables:\n## # Petal.Width , Species\
