- fmt: '# Adding Levels


    The opposite of `fct_drop()` is adding extra levels. Assigning to `levels()`,
    as we did earlier, will add levels that are not necessarily in the factor, but
    it might also rename levels at the same time. The levels are renamed, you are
    not just adding to them. This happened to `f1` earlier. Its original levels, 1,
    2, 3, and 4, were replaced with A, B, C, and D when we added the new levels.


    With the `fct_expand()` function, you can add levels that are not in your factor,
    and any levels that are already in the data will be ignored.


    ```

    f1

    ## [1] C B B A D

    ## Levels: A B C D E F G H I J

    f3

    ## [1] X Y A

    ## Levels: X Y A

    fct_expand(f1, levels(f3))

    ## [1] C B B A D

    ## Levels: A B C D E F G H I J X Y

    ```


    Missing data is not considered missing data by R, and often we can simply ignore
    it. Sometimes, however, there is information in missing data that we need to consider.
    Since R doesn’t play well with missing data in many statistical tests, for good
    reasons I might add as there is no consistently right way to do it, it is best
    to translate it into a category that R *will* work with. You can use `fct_explicit_na()`
    to map all missing data into a new category:


    ```

    f2

    ## [1] C B B A D

    ## Levels: C B A D

    fna   A D

    ## Levels: C B A D

    fna <- fct_explicit_na(fna, na_level = "Missing")

    fna

    ## [1] C    Missing Missing A   D

    ## Levels: C B A D Missing

    ```


    ## Reorder Levels


    If you construct a factor with `factor()`, you can control the order of the levels
    using the `levels` argument. If you use `as.factor()`, your levels will get sorted
    by name, and if you use `as_factor()`, they will be sorted in the order that the
    levels appear in the data. You can map between these orders if you want to, though.


    If you have a factor created with `factor()` without specifying the levels, then
    the levels will be all elements seen in the input sorted in their natural order.


    ```

    f <- factor(sample(LETTERS[1:5], 10, replace = TRUE))

    f

    ## [1] C A B D E C B A B B

    ## Levels: A B C D E

    ```


    The function `fct_inorder()` will order your levels to match the order that the
    categories are seen in the data—the order you get from `as_factor()`.


    ```

    fct_inorder(f)

    ## [1] C A B D E C B A B B

    ## Levels: C A B D E

    ```


    The functions for reordering levels can also make the factors ordered.^([^(18)](#fn18))


    ```

    fct_inorder(f, ordered = TRUE)

    ## [1] C A B D E C B A B B

    ## Levels: C < A < B < D < E

    ```


    If you want to sort the levels, you do not need `forcats` functions. The plain
    old `factor()` will do nicely.


    ```

    factor(f, levels = sort(levels(f)))

    ## [1] C A B D E C B A B B

    ## Levels: A B C D E

    factor(f, levels = sort(levels(f)), ordered = TRUE)

    ## [1] C A B D E C B A B B

    ## Levels: A < B < C < D < E

    ```


    You can order levels by their frequency in the factor using `fct_infreq()`:


    ```

    table(f)

    ## f

    ## A B C D E

    ## 2 4 2 1 1

    fct_infreq(f)

    ## [1] C A B D E C B A B B

    ## Levels: B A C D E

    f |> fct_infreq() |> table()

    ##

    ## B A C D E

    ## 4 2 2 1 1

    f |> fct_infreq(ordered = TRUE)

    ## [1] C A B D E C B A B B

    ## Levels: B  fct_infreq() |> fct_rev() |> table()

    ##

    ## E D C A B

    ## 1 1 2 2 4

    ```


    In the last example, I reversed the levels, so the order is smallest to largest
    rather than largest to smallest. The function `fct_rev()` reverses the levels;
    a frequent use for this is when you plot with an axis given by the factor. There,
    the order is given by the levels, and you might want it reversed.


    Footnotes [1](#476587_2_En_10_Chapter.xhtml#Fn1_source)


    # 11. Working with Dates: lubridate


    The `lubridate` package is essential for working with dates and fits well with
    the Tidyverse. It is not, however, loaded when you import the `tidyverse` package,
    so you need to explicitly load it.


    ```

    library(lubridate)

    ```


    ## Time Points


    You can create dates and dates with time-of-day information using variations of
    the `ymd()` function. The letters `y`, `m`, and `d` stand for year, month, and
    day, respectively. With `ymd()`, you should write your data in a format that puts
    the year first, the month second, and the day last. The function is very flexible
    in what it can parse as a date.


    ```

    ymd("1975 Feb 15")

    ## [1] "1975-02-15"

    ymd("19750215")

    ## [1] "1975-02-15"

    ymd("1975/2/15")

    ## [1] "1975-02-15"

    ymd("1975-02-15")

    ## [1] "1975-02-15"

    ```


    You can permute the `y`, `m`, and `d` letters if the order of year, month, and
    day is different. Each permutation gives you a parser that will interpret its
    input in the specified order.


    ```

    dmy("150275")

    ## [1] "1975-02-15"

    mdy("February 15th 1975")

    ## [1] "1975-02-15"

    ```


    If you want to add a time of the day to your date, you can add an hour, an hour
    and a minute, or an hour, a minute, and a second by using `_h()`, `_hm()`, and
    `_hms()` variants of the `ymd()` functions.


    ```

    dmy_h("15/2/1975 2pm")

    ## [1] "1975-02-15 14:00:00 UTC"

    dmy_hm("15/2/1975 14:30")

    ## [1] "1975-02-15 14:30:00 UTC"

    dmy_hms("15/2/1975 14:30:10")

    ## [1] "1975-02-15 14:30:10 UTC"

    ```


    If you have a time object


    ```

    x <- dmy_hms("15/2/1975 14:30:10")

    ```


    then you can extract its components through dedicated functions:


    ```

    c(day(x), month(x), year(x))

    ## [1]   15    2 1975

    c(hour(x), minute(x), second(x))

    ## [1] 14 30 10

    c(week(x), # The week in the year

    wday(x), # The day in the week

    yday(x)) # The day in the year

    ## [1] 7 7 46

    ```


    These functions have corresponding assignment functions that you can use to modify
    the components of the time point.


    ```

    minute(x) <- 15

    wday(x) <- 42

    x

    ## [1] "1975-03-22 14:15:10 UTC"

    ```


    ## Time Zones


    When you add a time of day, a time zone is also necessary. After all, we do not
    know what time a given hour is before we know which time zone we are in. If I
    tell you that I am going to call you at two o’clock, you can’t assume that it
    is two o’clock in your time zone.^([^(19)](#fn19)) Unless you tell the functions
    otherwise, they will assume UTC is the time zone. You can specify another time
    zone via the `tz` argument.


    ```

    dmy_hm(

    "15/2/1975 14:00",

    tz = "Europe/Copenhagen"

    )

    ## [1] "1975-02-15 14:00:00 CET"

    ```


    You can take a time point in one time zone and move it to another in two different
    ways. You set the time zone and pretend that the day and time of day were already
    in this time zone. That is, you can just change the time zone attribute of the
    object and not touch the time information. You can do this using the function
    `force_tz()`.


    ```

    force_tz(

    # This is a date/time in CET

    dmy_hm("15/2/1975 14:00", tz = "Europe/Copenhagen"),

    # It will be moved to GMT

    tz = "Europe/London"

    )

    ## [1] "1975-02-15 14:00:00 GMT"

    ```


    Even though CET and GMT are different time zones, the `force_tz()` function keeps
    the hour at 14:00 and simply updates the time zone.


    A much more likely situation is that you want to know at what a time point in
    one time zone was in another time zone. For example, if I promise to call you
    at two o’clock in Denmark, and you are in the UK, you can translate the time from
    my time zone to yours using `with_tz()`.


    ```

    with_tz(

    # This is a date/time in CET

    dmy_hm("15/2/1975 14:00", tz = "Europe/Copenhagen"),

    # This moves it to the same time but in GMT

    tz = "Europe/London"

    )

    ## [1] "1975-02-15 13:00:00 GMT"

    ```


    Copenhagen is one hour ahead of London, so when we move the time 14:00 from Copenhagen
    to GMT, we get the hour 13:00.'
