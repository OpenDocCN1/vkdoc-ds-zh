  trans: "\n# 筛选\n\n`select()`函数用于提取列的子集，而`filter()`函数则对行进行同样的操作。\n\n`iris_df`数据集包含三个不同的物种。我们可以使用`distinct()`函数来查看这一点。该函数也来自`dplyr`包，它会从选定的列中返回所有唯一的行。\n\
