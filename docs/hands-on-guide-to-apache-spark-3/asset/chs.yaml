  \                 |2    |\n|1    |0.5                 |2    |\n+-----+--------------------+-----+\n\
  \nBatch: 1\n\n+-----+--------------------+-----+\n|label|true prediction rate|count|\n\
  +-----+--------------------+-----+\n|0    |0.6666666666666666  |3    |\n|1    |0.6666666666666666\
  \  |3    |\n+-----+--------------------+-----+\n\nBatch: 2\n\n+-----+--------------------+-----+\n\
  |label|true prediction rate|count|\n+-----+--------------------+-----+\n|0    |0.6666666666666666\
  \  |3    |\n|1    |0.7142857142857143  |7    |\n+-----+--------------------+-----+\n\
  \nBatch: 3\n\n+-----+--------------------+-----+\n|label|true prediction rate|count|\n\
  +-----+--------------------+-----+\n|0    |0.75                |4    |\n|1    |0.75\
  \                |8    |\n+-----+--------------------+-----+\n\nBatch: 4\n\n+-----+--------------------+-----+\n\
