  ```\n\n在本书撰写时，对于 Spark 3.3.2 版本，在流式查询中使用会话窗口存在一些限制：\n\n*   不支持 `\"update\"` 输出模式。\n\
  *   分组子句应至少包含两列：`session_window` 和另一列。\n\n然而，当用于批处理查询时，分组子句只能包含 `session_window`\
  \ 列，如 Apache Spark 官方文档所述^(²⁵)。\n\n## 9.6 Spark Structured Streaming 中的水印\n\n正如我们在本书中多次提到的，流数据远非理想状态。我们已经探讨过掉队者和延迟到达事件的概念。\n\
  \n水印（Watermarking）是在 Apache Spark 2.1 中引入的，用于支持延迟到达的数据。例如，水印用于有状态流式操作，以避免状态中无限累积信息，这很可能会因内存饱和而导致不稳定，从而在流式操作过程中引入计算延迟。\n\
  \n本节将解释水印背后的基本概念，并提供一个将水印与 Spark 有状态流式操作结合使用的实际示例。\n\n\n\n### 什么是水印？\n\n水印可定义为延迟阈值。水印允许\
  \ Spark Structured Streaming 处理事件延迟到达的问题。在分布式架构中，为了数据完整性、准确性和容错性，管理掉队或乱序事件至关重要。处理此类复杂系统时，无法保证数据会按照其发送顺序到达流式平台。这可能是由于网络瓶颈、通信延迟等原因造成的。为了克服这些困难，必须保留聚合操作的状态。\n\
  \nSpark Structured Streaming 使用水印作为截止点，来控制 Spark 流处理引擎等待延迟事件的时间。\n\n因此，当我们声明水印时，需要指定一个时间戳字段和一个水印时间限制。例如，考虑我们的会话窗口代码片段。我们可以如下所示修改它，以引入水印阈值。\n\
  \n```\nval PatientDF = PatientDS\n.withWatermark(\"Fecha\", \"30 seconds\")\n.groupBy(\n\
  session_window(col(\"Fecha\"), \"10 seconds\"), col(\"DID\")\n).count()\n```\n\n\
  在这个例子中：\n\n- `Fecha` 列用于定义一个 30 秒的水印。\n- 对于每个非重叠的十秒窗口内观察到的每个 `DID`，执行 `count` 操作。\n\
  - 每个计数的状态信息会一直保留，直到窗口结束时间比最新观察到的 `Fecha` 值早十秒以上。\n\n包含水印后，随着新数据的到来，Spark 会跟踪指定列中的最新时间戳，并在水印阈值内处理传入的事件。\n\
  \n以下是包含 30 秒水印的完整代码示例。\n\n```\n// Watermarking in Spark Structured Streaming\nimport\
  \ org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\nimport\
  \ org.apache.spark.sql.types._ //{IntegerType, StringType, StructField, StructType,DoubleType,LongType}\n\
  import org.apache.spark.sql.{DataFrame, Dataset, Encoders, SparkSession}\nimport\
  \ java.io.IOException\nimport org.apache.spark.sql.streaming._\nimport org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.DataFrame\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Fecha\"\
  , StringType))\n)\nval spark:SparkSession = SparkSession.builder()\n.master(\"local[10]\"\
  )\n.appName(\"Hand-On-Spark3_Socket_Data_Source\")\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\nimport spark.implicits._\ntry {\nval PatientDS = spark.readStream\n.schema(PatientsSchema)\n\
  .json(\"/tmp/window\")\n.withColumn(\"Fecha\", to_timestamp(col(\"Fecha\"), \"yyyy-MM-dd'T'HH:mm:ss.SSSX\"\
  ))\nPatientDS.printSchema()\nprintf(\"\\n Listening and ready... \\n\")\nval PatientDF\
  \ = PatientDS\n.withWatermark(\"Fecha\", \"30 seconds\")\n.groupBy(\nsession_window(col(\"\
  Fecha\"), \"10 seconds\"), col(\"DID\")\n).count()\nPatientDF.printSchema()\nPatientDF.writeStream\n\
  .outputMode(\"complete\")\n.format(\"console\")\n.option(\"truncate\", false)\n\
  .start()\n.awaitTermination()\n} catch {\ncase e: IOException => println(\"IOException\
  \ occurred\")\ncase t: Throwable => println(\"Error receiving data\", t)\n}finally\
  \ {\nprintln(\"In finally block\")\n}\n```\n\n上述代码片段中还有另一个需要注意的重要部分。\n\n```\nval\
  \ PatientDS = spark.readStream\n.schema(PatientsSchema)\n.json(\"/tmp/window\")\n\
  .withColumn(\"Fecha\", to_timestamp(col(\"Fecha\"), \"yyyy-MM-dd'T'HH:mm:ss.SSSX\"\
  ))\nPatientDS.printSchema()\nroot\n|-- NSS: string (nullable = true)\n|-- Nom: string\
  \ (nullable = true)\n|-- DID: integer (nullable = true)\n|-- DNom: string (nullable\
  \ = true)\n|-- Fecha: timestamp (nullable = true)\n```\n\n水印只能与时间戳或窗口列一起使用。因此，`Fecha`\
  \ 列必须先从字符串类型转换为时间戳类型才能使用；否则，你会收到错误。\n\n再次强调，如果你运行上述程序并将作为示例提供的 JSON 文件复制到数据源目录（`/tmp/window`），你将得到类似于以下的输出。\n\
