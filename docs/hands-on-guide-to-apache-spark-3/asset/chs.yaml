  ```\n\n\n\n### 具有动态间隔的会话窗口\n\n会话窗口类型的另一个有趣特性是它支持所谓的*动态间隔时长*^(²⁴)。我们在前一个示例中实现的会话窗口，虽然其大小会根据新事件是否到达而变化，但它有一个最大尺寸，即窗口长度。而动态间隔时长的特殊之处在于，每个会话的间隔时长可以不同。因此，我们可以使用一个表达式来动态设置窗口大小，使其适应输入数据的特征，而不是使用固定的间隔/超时值。\n\
  \n下面是一个实际示例，展示了如何实现具有动态间隔时长的会话窗口。\n\n```\n// Session Windows II. Session window\
  \ with dynamic gap duration\nimport org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\n\
  import org.apache.spark.sql.types._\nimport org.apache.spark.sql.{DataFrame, Dataset,\
  \ Encoders, SparkSession}\nimport java.io.IOException\nimport org.apache.spark.sql.streaming._\n\
  import org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.DataFrame\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Fecha\"\
  , StringType))\n)\nval spark:SparkSession = SparkSession.builder()\n.master(\"local[10]\"\
  )\n.appName(\"Hand-On-Spark3_Socket_Data_Source\")\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\nimport spark.implicits._\ntry {\nval PatientDS = spark.readStream\n.schema(PatientsSchema)\n\
  .json(\"/tmp/window\")\nPatientDS.printSchema()\nprintf(\"\\n Listening and ready...\
  \ \\n\")\nval PatientDF = PatientDS\n.groupBy(\nsession_window(col(\"Fecha\"),\n\
  when(col(\"NSS\") === \"1009\", \"10 seconds\")\n.when(col(\"NSS\") === \"2001\"\
  , \"30 seconds\")\n.when(col(\"NSS\") === \"5000\", \"50 seconds\")\n.otherwise(\"\
  60 seconds\")),\ncol(\"DID\")\n).count()\nPatientDF.printSchema()\nPatientDF.writeStream\n\
  .outputMode(\"complete\")\n.format(\"console\")\n.option(\"truncate\", false)\n\
  .start()\n.awaitTermination()\n} catch {\ncase e: IOException => println(\"IOException\
  \ occurred\")\ncase t: Throwable => println(\"Error receiving data\", t)\n}finally\
  \ {\nprintln(\"In finally block\")\n}\n```\n\n上述代码的新颖之处在于下面这段代码块，它实现了具有动态超时的会话窗口。\n\
  \n```\nval PatientDF = PatientDS\n.groupBy(\nsession_window(col(\"Fecha\"),\nwhen(col(\"\
  NSS\") === \"1009\", \"10 seconds\")\n.when(col(\"NSS\") === \"2001\", \"30 seconds\"\
  )\n.when(col(\"NSS\") === \"5000\", \"50 seconds\")\n.otherwise(\"60 seconds\")),\n\
  col(\"DID\")\n).count()\n```\n\n现在你可以看到，会话窗口的长度是由 `NSS` 字段的值动态确定的。\n\n再次，在创建源数据目录（`/tmp/window`）、执行代码示例并复制提供的\
  \ JSON 文件后，程序将输出类似于下面的结果。\n\n```\n. . . Removed for brevity . . .\nListening and\
