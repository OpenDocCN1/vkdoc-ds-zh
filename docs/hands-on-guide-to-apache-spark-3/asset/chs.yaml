  \ |\n| `mean()` | `avg()` 的别名，返回某列元素的平均值。 |\n| `skewness()` | 返回某列值的偏度。表示偏离正态分布的程度。\
  \ |\n| `stddev()` | `stddev_samp()` 的别名，返回组内表达式的无偏样本标准差。 |\n| `stddev_pop()` | 返回某列表达式的总体标准差。\
