  \n要双重验证流处理过程的结果，您还可以使用 Kafka 消费者从 Kafka 代理读取事件，该消费者是一个订阅（读取并处理）事件的客户端应用程序。\n\n要了解其工作原理，请打开另一个终端会话，并按照如下所示运行消费者控制台客户端，以读取我们之前创建的\
  \ `patient` 主题：\n\n```\n$ bin/kafka-console-consumer.sh --topic patient --from-beginning\
  \ --bootstrap-server localhost:9092\n```\n\n您将在屏幕上看到类似于以下的输出：\n\n```\n{\"NSS\":\"\
  1234\",\"Nom\":\"María\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"\
  }\n{\"NSS\":\"2345\",\"Nom\":\"Emilio\", \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\"\
  :\"01-09-2022\"}\n{\"NSS\":\"3456\",\"Nom\":\"Marta\", \"DID\":30, \"DNom\":\"Endo\"\
  , \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"\
  DNom\":\"Gastro\", \"Fecha\":\"01-09-2022\"}\n. . .\n. . .\n{\"NSS\":\"4567\",\"\
  Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\", \"Fecha\":\"01-09-2022\"}\n{\"\
  NSS\":\"5678\",\"Nom\":\"Sonia\", \"DID\":50, \"DNom\":\"Gineco\", \"Fecha\":\"\
  01-09-2022\"}\n{\"NSS\":\"6789\",\"Nom\":\"Eduardo\", \"DID\":10, \"DNom\":\"Cardio\"\
  , \"Fecha\":\"01-09-2022\"}\n```\n\n为了能够编译本节中使用的代码示例，您必须使用正确的 Kafka 依赖项和 Scala 编译器版本，这完全取决于您安装的\
  \ Kafka、Spark 和 Scala 版本。\n\n到目前为止，我们已经讨论了 Spark 内置的流数据源，例如 TCP/IP 套接字、文件、Apache\
  \ Kafka 等。其他可以与 Apache Spark 配对以创建流管道的先进流应用程序包括 Kinesis。在下一节中，我们将了解如何使用并非主要用于此目的的工具创建自定义流数据源。具体来说，我们将向您展示如何从\
  \ NoSQL 数据库（例如 MongoDB）流式传输数据。\n\n### 从 MongoDB 读取流数据\n\nSpark Streaming 支持对从 MongoDB\
  \ 读取的数据流进行实时分析。在本节中，我们将使用 Spark Structured Streaming 和新的连续处理触发器在 MongoDB 和 Spark\
  \ 之间传输数据。\n\n为了完成我们的任务，我们还将使用新的 v2 MongoDB Spark 连接器。最新的 10.x 系列连接器提供了 Spark Structured\
  \ Streaming 与 MongoDB 之间的原生集成，并支持新的连续触发器类型流。该连接器还利用了 MongoDB 5.1 及更高版本的一个特性，即“变更流游标”，来订阅数据库中的信息变更。\n\
  \n因此，使用此连接器，我们将从 MongoDB 数据库打开一个输入流连接，同时为指定的数据库和数据集合设置一个 MongoDB 变更流游标。当新文档被插入，或现有文档被修改或删除时，此特性会触发一个变更流事件。这些事件变更会被转发到指定的消费者，在我们的案例中就是\
  \ Spark。\n\n在图 8-5 中，您可以看到一个用例示例，其中 Spark 和 MongoDB 被耦合在一起以构建事件流架构。\n\n![](img/538349_1_En_8_Fig5_HTML.jpg)\n\
  \n示意图如下。来自移动端、微服务和 MongoDB 的数据流入由 Spark 和用于 Spark 的 MongoDB 连接器组成的事件流架构。通过 MongoDB，数据流向\
  \ AI、数据湖、分析和可视化。\n\n**图 8-5** Spark-MongoDB 事件流架构\n\n考虑以下示例，该示例将来自 MongoDB Atlas\
  \ 集群的关于医疗预约的实时信息流式传输到我们在前几章中一直使用的医院排队管理系统应用程序中：\n\n```\n{\"NSS\":\"2345\",\"Nom\"\
  :\"Emilio\", \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\"\
  :\"3456\",\"Nom\":\"Marta\", \"DID\":30, \"DNom\":\"Endo\", \"Fecha\":\"01-09-2022\"\
  }\n```\n\n像这样的信息在 MongoDB 文档中如下所示：\n\n```\n{\n\"_id\": {\n\"$oid\": \"640cba70f9972564d8c4ef2f\"\
  \n},\n\"NSS\": \"2345\",\n\"Nom\": \"Emilio\",\n\"DID\": 20,\n\"DNom\": \"Neuro\"\
  ,\n\"Fecha\": \"01-09-2022\"\n}\n```\n\n在接下来的代码片段中，我们将使用新的 MongoDB Spark 连接器从我们的\
  \ MongoDB 数据集合中读取数据：\n\n```\nimport org.apache.spark.sql.SparkSession\nimport org.apache.spark.{SparkConf,\
  \ SparkContext}\nimport org.apache.spark.sql.streaming.Trigger\nval spark:SparkSession\
  \ = SparkSession\n.builder()\n.config(\"spark.jars.packages\", \"org.mongodb.spark:mongo-spark-connector:10.1.1\"\
  )\n.master(\"local[*]\")\n.appName(\"Hand-On-Spark3_File_Data_Source_MongoDB\")\n\
  .getOrCreate()\nval sc = spark.sparkContext\nsc.setLogLevel(\"ERROR\")\nval mongoDBURI\
  \ = \"mongodb+srv://:@hands-on-spark3.abcdef.mongodb.net/?retryWrites=true&w=majority\"\
  \nval columsOfInterest = List(\"NSS\",\"Nom\",\"DID\",\"DNom\",\"Fecha\",\"_id\"\
  )\n// 定义一个流查询\nval df = spark.readStream\n.format(\"mongodb\")\n.option(\"spark.mongodb.connection.uri\"\
  , mongoDBURI)\n.option(\"spark.mongodb.database\", \"MongoDB_Data_Source\")\n.option(\"\
  spark.mongodb.collection\", \"MongoDB_Data_Source\")\n.option(\"spark.mongodb.change.stream.publish.full.document.only\"\
  , \"true\")\n.option(\"forceDeleteTempCheckpointLocation\", \"true\")\n//.schema(PatientsSchema)\n\
  .load()\ndf.printSchema()\nif (df.isStreaming) printf(\" ----- 流正在运行 -----! \\n\"\
  )\nimport spark.implicits._\nval groupDF = df.select(columsOfInterest.map(col):\
  \ _*) // 在此处您可以进行数据转换\ngroupDF.printSchema()\ngroupDF.writeStream\n.outputMode(\"\
  append\")\n.option(\"forceDeleteTempCheckpointLocation\", \"true\")\n.format(\"\
  console\")\n.option(\"checkpointLocation\", \"/tmp/checkpointDir\")\n//.trigger(Trigger.ProcessingTime(\"\
  10 seconds\"))\n.trigger(Trigger.Continuous(\"30 seconds\"))\n.start()\n.awaitTermination()\n\
  ```\n\n\n\n浏览上述代码，你会注意到，从 MongoDB 数据库读取数据时，我们不一定需要定义信息模式，因为模式是从 MongoDB 集合中推断出来的。\n\
  \n无论如何，如果你更倾向于或需要定义自己的数据模式，可以按照以下方式操作，并调用流式读取过程。\n\n首先，定义你的数据模式：\n\n```\nval PatientsSchema\
  \ = StructType(Array(\nStructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\n\
  StructField(\"DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"\
  Fecha\", StringType),\nStructField(\"_id\", StringType))\n)\n```\n\n之后，像这样将其与你的\
  \ `readStream` 方法结合使用，以定义传入数据的模式：\n\n```\nval df = spark.readStream\n.format(\"\
  mongodb\")\n.option(\"spark.mongodb.connection.uri\", mongoDBURI)\n.option(\"spark.mongodb.database\"\
  , \"MongoDB_Data_Source\")\n.option(\"spark.mongodb.collection\", \"MongoDB_Data_Source\"\
  )\n.option(\"spark.mongodb.change.stream.publish.full.document.only\", \"true\"\
  )\n.option(\"forceDeleteTempCheckpointLocation\", \"true\")\n.schema(PatientsSchema)\n\
  .load()\n```\n\n另一行值得关注的代码如下：\n\n```\nif (df.isStreaming) printf(\" ----- Streaming\
  \ is running -----! \\n\")\n```\n\n我们使用了 `isStreaming` 属性来验证数据集是否正在流式传输。如果 `df`\
  \ 数据集包含一个或多个持续发送数据的数据源，它将返回 `true`。\n\n最后，在将流式数据写入控制台时，我们选择了连续触发器类型，因为最新的 MongoDB\
  \ Spark 连接器支持该类型。\n\n在此例中，为了便于阅读，我们将触发器设置为“30 秒”，因为如果使用“1 秒”触发器，数据会持续不断地拉取到控制台，对于本书而言，收集数据会更加困难：\n\
  \n```\n.trigger(Trigger.Continuous(\"30 seconds\"))\n```\n\n不过，你也可以使用其他支持的触发器类型，例如：\n\
  \n*   *默认触发器*：尽可能快地运行微批次。\n*   *处理时间触发器*：按指定的时间间隔触发微批次。\n*   *一次性触发器*：仅执行一个微批次，处理可用信息，然后停止。\n\
  *   *可用立即触发器*：与一次性触发器类似，区别在于它旨在实现更好的查询可扩展性，尝试根据配置的源选项（例如 `maxFilesPerTrigger`）在多个微批次中处理数据。\n\
  \n在下一个代码示例中，我们将展示如何修改之前的程序，以使用间隔为 10 秒的 `Trigger.ProcessingTime`：\n\n```\ngroupDF.writeStream\n\
  .outputMode(\"append\")\n.option(\"forceDeleteTempCheckpointLocation\", \"true\"\
  )\n.format(\"console\")\n.option(\"checkpointLocation\", \"/tmp/checkpointDir\"\
  )\n.trigger(Trigger.ProcessingTime(\"10 seconds\"))\n.start()\n.awaitTermination()\n\
  ```\n\n好了，现在是时候尝试运行这个程序了。\n\n一旦你执行程序，就在你的数据库中插入一些文档（信息）。如果你使用的是图形界面（如 MongoDB Compass），可以按照图\
  \ 8-6 所示进行操作。\n\n![](img/538349_1_En_8_Fig6_HTML.jpg)\n\n一张 MongoDB Compass 的截图，显示了一个用于插入文档的弹出窗口。\n\
  \n图 8-6\n向 MongoDB 数据库中插入一个新文档\n\n一旦新文档被插入到 MongoDB 数据库中，你可以看到它如图 8-7 所示显示出来。\n\n\
  ![](img/538349_1_En_8_Fig7_HTML.jpg)\n\n一张 MongoDB Compass 的截图，显示了 MongoDB 数据源面板，其中选中的是文档选项卡。\n\
  \n图 8-7\n一个新文档被插入到 MongoDB 数据库和集合中\n\n你应该会看到应用程序输出类似如下的结果：\n\n```\nroot\n|-- _id:\
  \ string (nullable = true)\n|-- NSS: string (nullable = true)\n|-- Nom: string (nullable\
  \ = true)\n|-- DID: integer (nullable = true)\n|-- DNom: string (nullable = true)\n\
  |-- Fecha: string (nullable = true)\n----- Streaming is running -----!\n… 为简洁起见已省略\
  \ …\n\nBatch: 1\n\n+----+------+---+------+----------+--------------------+\n| NSS|\
  \   Nom|DID|  DNom|     Fecha|                 _id|\n+----+------+---+------+----------+--------------------+\n\
  |3456| Marta| 30|  Endo|01-09-2022|640cbaa7f9972564d...|\n|4567|Marcos| 40|Gastro|01-09-2022|640cbab3f9972564d...|\n\
  +----+------+---+------+----------+--------------------+\n\nBatch: 2\n\n+----+-------+---+------+----------+--------------------+\n\
  | NSS|    Nom|DID|  DNom|     Fecha|                 _id|\n+----+-------+---+------+----------+--------------------+\n\
  |4567| Marcos| 40|Gastro|01-09-2022|640cbabdf9972564d...|\n|5678|  Sonia| 50|Gineco|01-09-2022|640cbac8f9972564d...|\n\
  |6789|Eduardo| 10|Cardio|01-09-2022|640cbad3f9972564d...|\n+----+-------+---+------+----------+--------------------+\n\
  \nBatch: 3\n\n+----+-----+---+------+----------+--------------------+\n| NSS|  Nom|DID|\
  \  DNom|     Fecha|                 _id|\n+----+-----+---+------+----------+--------------------+\n\
  |1234|María| 10|Cardio|01-09-2022|640cbadcf9972564d...|\n+----+-----+---+------+----------+--------------------+\n\
  ```\n\n由于我们使用了间隔为 30 秒的连续触发器类型，数据并非在注册时立即流式传输，而是每 30 秒传输一次；否则，你将无法看到不同批次中的聚合数据，除非你的输入速度比服务器处理信息的速度更快。\n\
  \n现在，在了解了多种流式数据源之后，是时候处理数据存储了。在数据流术语中，这些存储被称为数据接收器（data sinks）。\n\n## 8.2 Spark\
  \ Streaming 数据接收器\n\n到目前为止，我们已经看到，Apache Spark Streaming 由三个主要的逻辑组件组成：数据源（输入源）、处理引擎（业务逻辑），以及最终输出目的地（接收器），用于存放所有计算、聚合、转换等操作完成后的结果信息。\n\
  \n因此，在 Spark Streaming 中，输出接收器用于保存应用于外部源的业务逻辑。我们在前面的章节中已经看到，Spark Streaming 使用 `org.apache.spark.sql.streaming.DataStreamWriter`\
  \ 类作为接口，通过 `writeStream` 方法将流式 DataFrame/数据集写入外部存储系统。\n\nSpark 包含一组内置的输出接收器：\n\n\
  *   控制台接收器\n*   文件接收器\n*   Kafka 接收器\n*   ForeachBatch 接收器\n*   Foreach 接收器\n\n\
  所有这些接收器都受到 Spark Structured Streaming 的原生支持。第一个，控制台接收器，主要用于测试和调试，因为它不支持容错。前三个（控制台、文件和\
  \ Kafka 接收器）是已定义的输出格式：控制台，如 `format(\"console\")`；文件，如 `format(\"csv\")`（或 `\"json\"\
  `、`\"orc\"`、`\"parquet\"`）；以及 `\"kafka\"`。但是，如何将流式输出写入任意存储系统，例如像 MongoDB 这样的 NoSQL\
  \ 数据库，或者像 PostgreSQL 这样的关系型数据库呢？这时，Foreach 和 ForeachBatch 接收器就派上用场了。\n\n接下来，我们将详细研究每一种接收器。\n\
  \n### 将流式数据写入控制台接收器\n\n正如你在我们的示例中已经看到的，结果会显示在控制台上。这种数据接收器主要不用于生产系统；它更像是一个有用的开发和调试工具。\n\
  \n\n\n### 将流式数据写入文件接收器\n\n文件接收器将输出数据存储到文件系统目录中。支持多种文件格式，例如 JSON、ORC、CSV 和 Parquet。\n\
  \n以下是一个示例，演示如何将流式输出保存到 CSV 文件。该代码片段是对我们流式医院排队管理系统应用程序的修改，用于将处理后的数据保存到文件系统，而不是输出到控制台：\n\
  \n```\nPatientDF.writeStream\n// 你必须修改这部分代码\n.format(\"csv\")\n.option(\"path\"\
  , \"/tmp/streaming_output/csv\")\n// … 改为这样\n.format(\"parquet\")\n.option(\"path\"\
  , \"/tmp/streaming_output/parquet\")\n// ...\n.trigger(Trigger.ProcessingTime(\"\
  5 seconds\"))\n.option(\"checkpointLocation\", checkpointDir)\n.outputMode(\"append\"\
  )\n.option(\"truncate\",false)\n.option(\"newRows\",30)\n.start()\n.awaitTermination()\n\
  ```\n\n现在，如果你查看指定的输出目录，应该会找到类似于图 8-8 所示的输出。\n\n![](img/538349_1_En_8_Fig8_HTML.jpg)\n\
  \n左侧为 CSV 文件的流式输出列表，右侧为 Parquet 文件的流式输出列表。\n\n**图 8-8** 以 CSV 和 Parquet 格式输出到文件接收器的流式示例\n\
  \n为了简洁和清晰起见，在图 8-8 中，我们将两个输出并排放置。左侧是 CSV 输出格式，右侧是 Parquet 输出格式。\n\n### 将流式数据写入 Kafka\
  \ 接收器\n\nKafka 接收器将输出发布到 Kafka 中的一个或多个主题。\n\n以下是一个示例，演示如何将流式输出保存到一个或多个 Kafka 主题：\n\
  \n```\ncounts.writeStream\n.format(\"kafka\")\n.option(\"kafka.bootstrap.servers\"\
  ,\"host1:port1,host2:port2\")\n// ...\n.option(\"topic\", \"patient\")\n.option(\"\
  checkpointLocation\", \"/tmp/kafka_checkpoint\")\n.start()\n.awaitTermination()\n\
  ```\n\n请注意 `.option(\"kafka.bootstrap.servers\",\"host1:port1,host2:port2\")` 这一行。如你所见，`bootstrap.servers`\
  \ 是一个逗号分隔的套接字连接列表（主机和端口对），对应于“引导”Kafka 集群中 Kafka 代理的 IP 地址。Kafka 客户端（生产者和消费者）使用它们来连接到\
  \ Kafka 集群。\n\n到目前为止，我们使用的接收器其输出格式都是原生（内置）支持的，例如文件、Kafka 或控制台。现在，我们将学习如何在保存之前将我们自己的业务逻辑应用于每个流记录，以及如何使用\
  \ `foreachBatch` 和 `foreach` 数据接收器将信息写入我们自己定义的数据存储。\n\n两者之间的主要区别在于，`foreachBatch`\
  \ 在微批次级别执行自定义逻辑，而 `foreach` 在行级别执行该自定义逻辑。\n\n现在让我们研究这两个接收器。\n\n### 将流式数据写入 ForeachBatch\
  \ 接收器\n\nForeachBatch 接收器接受一个用户定义的函数，该函数在流式查询的每个微批次的输出数据上执行，例如：\n\n```\ndef saveToCSV\
  \ = (df: DataFrame, timeStamp: Long) => {\ndf.withColumn(\"timeStamp\", date_format(current_date(),\"\
  yyyyMMdd\"))\n.write.format(\"csv\")\n.option(\"path\", \"/tmp/streaming_output/foreachBatch\"\
  )\n.mode(\"append\")\n.save()\n}\n// ...\n// ...\nPatientDF.writeStream\n.trigger(Trigger.ProcessingTime(\"\
  5 seconds\"))\n.option(\"checkpointLocation\", checkpointDir)\n.outputMode(\"append\"\
  )\n.foreachBatch(saveToCSV)\n.start()\n.awaitTermination()\n```\n\n如你所见，这段代码是对我们之前示例的一个小修改。首先，我们定义了自己的写入业务逻辑，封装在\
  \ `saveToCSV()` 函数中。该函数为每个处理的微批次添加一个时间戳。\n\n以下是代码示例：\n\n```\n// 文件接收器到 CSV\nimport\
  \ org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\nimport\
  \ org.apache.spark.sql.types.{IntegerType, StringType, StructField, StructType,DoubleType,LongType}\n\
  import org.apache.spark.sql.{DataFrame, Dataset, Encoders, SparkSession}\nimport\
  \ java.io.IOException\nimport org.apache.spark.sql.streaming._\nimport org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.DataFrame\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Fecha\"\
  , StringType))\n)\ncase class Patient(\nNSS: String,\nNom: String,\nDID: Option[Long],\n\
  DNom: String,\nFecha: String\n)\ndef saveToCSV = (df: DataFrame, timeStamp: Long)\
  \ => {\ndf.withColumn(\"timeStamp\", date_format(current_date(),\"yyyyMMdd\"))\n\
  .write.format(\"csv\")\n.option(\"path\", \"/tmp/streaming_output/foreachBatch\"\
  )\n.mode(\"append\")\n.save()\n}\nval spark:SparkSession = SparkSession.builder()\n\
  .master(\"local[*]\")\n.appName(\"Hand-On-Spark3_Socket_Data_Source\")\n.getOrCreate()\n\
  spark.sparkContext.setLogLevel(\"ERROR\")\nimport spark.implicits._\nval host =\
  \ \"localhost\"\nval port = 9999\nval checkpointDir = \"/tmp/streaming_checkpoint\"\
  \ntry {\nval PatientDS = spark.readStream\n.format(\"socket\")\n.option(\"host\"\
  ,host)\n.option(\"port\",port)\n.load()\n.select(from_json(col(\"value\"), PatientsSchema).as(\"\
  patient\"))\n.selectExpr(\"Patient.*\")\n.as[Patient]\nprintf(\"\\n 正在监听，准备就绪...\
  \ \\n\")\nval PatientDF = PatientDS.select(\"*\")\nPatientDF.writeStream\n.trigger(Trigger.ProcessingTime(\"\
  5 seconds\"))\n.option(\"checkpointLocation\", checkpointDir)\n.outputMode(\"append\"\
  )\n.foreachBatch(saveToCSV)\n.start()\n.awaitTermination()\n} catch {\ncase e: java.net.ConnectException\
  \ => println(\"建立连接到 \" + host + \":\" + port + \" 时出错\")\ncase e: IOException =>\
  \ println(\"发生 IOException\")\ncase t: Throwable => println(\"接收数据时出错\", t)\n}finally\
  \ {\nprintln(\"在 finally 块中\")\n}\n```\n\n现在，打开一个终端会话，像往常一样输入：\n\n```\nnc -lk 9999\n\
  ```\n\n然后，运行前面的代码示例，当你在笔记本中看到以下内容时：\n\n```\n正在监听，准备就绪...\n```\n\n回到之前的终端会话，粘贴我们在第\
  \ 6 章中提供的 JSON 示例，例如：\n\n```\n{\"NSS\":\"1234\",\"Nom\":\"María\", \"DID\":10, \"\
  DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n. . .\n{\"NSS\":\"2345\",\"Nom\":\"\
  Emilio\", \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"\
  3456\",\"Nom\":\"Marta\", \"DID\":30, \"DNom\":\"Endo\", \"Fecha\":\"01-09-2022\"\
  }\n```\n\n运行完前面的程序并将数据粘贴到终端控制台后，如果你查看指定的输出目录路径 `/tmp/streaming_output/foreachBatch/`，应该会找到类似于以下的一堆文件：\n\
  \n\n\n```\n/tmp/streaming_output/foreachBatch/\n├── part-00000-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n\
  ├── part-00000-63507ff8-a09a-4c8e-a526-28890c170d96-c000.csv\n├── part-00000-9a2caabe-7d84-4799-b788-a633cfc32042-c000.csv\n\
  ├── part-00000-dabb8320-0c0e-4bb5-ad19-c36a53ac8d1e-c000.csv\n├── part-00000-df0c4ba0-a9f0-40ed-b773-b879488b0a85-c000.csv\n\
  ├── part-00000-f924d5cc-8e4a-4d5f-91b7-965ce2ac8710-c000.csv\n├── part-00000-fd07c2e4-1db1-441c-8199-a69a064efe75-c000.csv\n\
  ├── part-00001-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n├── part-00001-63507ff8-a09a-4c8e-a526-28890c170d96-c000.csv\n\
  ├── part-00001-9a2caabe-7d84-4799-b788-a633cfc32042-c000.csv\n├── part-00001-df0c4ba0-a9f0-40ed-b773-b879488b0a85-c000.csv\n\
  ├── part-00001-fd07c2e4-1db1-441c-8199-a69a064efe75-c000.csv\n├── part-00002-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n\
  ├── part-00002-9a2caabe-7d84-4799-b788-a633cfc32042-c000.csv\n├── part-00002-df0c4ba0-a9f0-40ed-b773-b879488b0a85-c000.csv\n\
  ├── part-00002-fd07c2e4-1db1-441c-8199-a69a064efe75-c000.csv\n├── part-00003-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n\
  ├── part-00003-df0c4ba0-a9f0-40ed-b773-b879488b0a85-c000.csv\n├── part-00003-fd07c2e4-1db1-441c-8199-a69a064efe75-c000.csv\n\
  ├── part-00004-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n├── part-00004-df0c4ba0-a9f0-40ed-b773-b879488b0a85-c000.csv\n\
  ├── part-00005-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n├── part-00005-df0c4ba0-a9f0-40ed-b773-b879488b0a85-c000.csv\n\
  └── _SUCCESS\n```\n\n请记住，Spark 默认以分布式方式写入磁盘；因此，你会看到常规的程序输出是一系列分区的文件。\n\n例如，我们将以下\
  \ JSON 字符串复制并粘贴到了控制台会话中：\n\n```\n{\"NSS\":\"1009\",\"Nom\":\"Julia\", \"DID\":20,\
  \ \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n```\n\n现在，如果我们打开文件 `part-00000-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv`，例如：\n\
  \n```\nvi part-00000-07c12f65-b1d6-4c7b-b50d-2d8b25d724b8-c000.csv\n```\n\n我们会看到以下内容，正如我们所料，记录末尾包含了时间戳：\n\
  \n```\n1009,Julia,20,Neuro,01-09-2022,20230317\n```\n\n打开其他输出文件也能看到完全相同的情况：\n\n\
  ```\n{\"NSS\":\"2345\",\"Nom\":\"Emilio\", \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\"\
  :\"01-09-2022\"}\n2345,Emilio,20,Neuro,01-09-2022,20230317\n{\"NSS\":\"4567\",\"\
  Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\", \"Fecha\":\"01-09-2022\"}\n4567,Marcos,40,Gastro,01-09-2022,20230317\n\
  ```\n\n以此类推。\n\n类似地，你可以编写自己的函数，将 PostgreSQL 用作数据接收器。你的代码可能如下所示：\n\n```\ndef savePostgreSql\
  \ = (df: DataFrame, timeStamp: Long) => {\nval url = \"jdbc:postgresql://:5432/database\"\
  \ndf\n.withColumn(\"timeStamp\", date_format(current_date(),\"yyyyMMdd\"))\n.write.format(\"\
  jdbc\")\n.option(\"driver\": \"org.postgresql.Driver\")\n.option(\"url\", url)\n\
  .option(\"dbtable\", \"\")\n.option(\"user\", \"\")\n.option(\"password\", )\n.mode(\"\
  append\")\n.save()\n}\n```\n\n总而言之，`foreachBatch` 会将每个微批次写入我们指定的存储，并应用我们的自定义逻辑。\n\
  \n### 将流数据写入 Foreach 接收器\n\nForeach 接收器允许在数据写入过程中对每一行应用用户定义的业务逻辑。它可用于将流数据写入任何类型的存储。如果由于某种原因我们无法使用\
  \ `foreachBatch`（例如，不存在特定的批次数据写入器，或者你需要使用连续处理模式），那么 `foreach` 可能是一个解决方案。使用 `foreach`\
  \ 时，我们必须实现三个方法（`open`、`process` 和 `close`）：\n\n*   `open`：负责打开连接的方法\n*   `process`：将数据写入指定连接的方法\n\
  *   `close`：负责关闭连接的方法\n\nSpark Structured Streaming 按以下顺序实现上述方法：对于每个流式批次/周期（`epoch_id`）中的每个分区（`partition_id`），都会调用方法\
  \ `open(partitionId`, `epochId)`。\n\n如果对于每个批次/周期中的分区内的每一行，`open(partitionId`, `epochId)`\
  \ 都返回 true，那么就会执行方法 `process(row)`。\n\n如果在处理数据行时出现任何错误，则会调用方法 `close(error)`。\n\n\
  另一方面，如果任何 `open()` 方法存在并成功返回，且在此期间没有发生系统故障，则会执行 `close()` 方法^(²³)：\n\n```\ncounts.writeStream\n\
  .foreach( \"此处放置一些用户逻辑\")\n// ...\n.start()\n.awaitTermination()\n```\n\n现在，让我们通过一个简单的示例来看看如何实现\
  \ `foreach`。出于本示例的目的，我们对之前用于 `foreachBatch` 接收器的代码片段稍作修改，以适应我们的需求。\n\n\n\n```scala\n\
  // 使用 foreach() 的控制台接收器\nimport org.apache.spark.sql.{Column, Row, SparkSession}\n\
  import org.apache.spark.sql.functions._\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType,DoubleType,LongType}\nimport org.apache.spark.sql.{DataFrame,\
  \ Dataset, Encoders, SparkSession}\nimport java.io.IOException\nimport org.apache.spark.sql.streaming._\n\
  import org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.{DataFrame,ForeachWriter}\n\nval PatientsSchema = StructType(Array(\n\
  \  StructField(\"NSS\", StringType),\n  StructField(\"Nom\", StringType),\n  StructField(\"\
  DID\", IntegerType),\n  StructField(\"DNom\", StringType),\n  StructField(\"Fecha\"\
  , StringType))\n)\n\ncase class Patient(\n  NSS: String,\n  Nom: String,\n  DID:\
  \ Option[Long],\n  DNom: String,\n  Fecha: String\n)\n\nval customWriterToConsole\
  \ = new ForeachWriter[Row] {\n  override def open(partitionId: Long, version: Long)\
  \ = true\n  override def process(record: Row) = {\n    // 你可以将记录转换为序列并循环遍历\n   \
  \ //record.toSeq.foreach{col => println(col) }\n    // ... 或者你可以逐个字段打印记录\n    println(\"\
  NSS: \" + record.getAs(\"NSS\")\n      + \" Nom: \"  + record.getAs(\"Nom\")\n \
  \     + \" DID: \"  + record.getAs(\"DID\")\n      + \" DNom: \"  + record.getAs(\"\
  DNom\")\n      + \" Fecha : \"  + record.getAs(\"Fecha\"))\n  }\n  override def\
  \ close(errorOrNull: Throwable) = {}\n}\n\nval spark:SparkSession = SparkSession.builder()\n\
  \  .master(\"local[*]\")\n  .appName(\"Hand-On-Spark3_Socket_Data_Source\")\n  .getOrCreate()\n\
  \nspark.sparkContext.setLogLevel(\"ERROR\")\nimport spark.implicits._\n\nval host\
  \ = \"localhost\"\nval port = 9999\nval checkpointDir = \"/tmp/streaming_checkpoint\"\
  \n\ntry {\n  val PatientDS = spark.readStream\n    .format(\"socket\")\n    .option(\"\
  host\",host)\n    .option(\"port\",port)\n    .load()\n    .select(from_json(col(\"\
  value\"), PatientsSchema).as(\"patient\"))\n    .selectExpr(\"Patient.*\")\n   \
  \ .as[Patient]\n\n  printf(\"\\n 正在监听，准备就绪... \\n\")\n\n  val PatientDF = PatientDS.select(\"\
  *\")\n\n  PatientDF.writeStream\n    .trigger(Trigger.ProcessingTime(\"5 seconds\"\
  ))\n    .option(\"checkpointLocation\", checkpointDir)\n    .outputMode(\"append\"\
  )\n    .foreach(customWriterToConsole)\n    .start()\n    .awaitTermination()\n\
  } catch {\n  case e: java.net.ConnectException => println(\"建立与 \" + host + \":\"\
  \ + port + \" 的连接时出错\")\n  case e: IOException => println(\"发生 IOException\")\n\
  \  case t: Throwable => println(\"接收数据时出错\", t)\n} finally {\n  println(\"在 finally\
  \ 块中\")\n}\n```\n\n在执行上述代码之前，请打开一个终端会话并按如下方式创建一个套接字会话：\n\n```bash\n$ nc -lk 9999\n\
  ```\n\n套接字会话创建完成后，就可以运行代码了。当你在屏幕上看到 `正在监听，准备就绪...` 这一行时，返回打开套接字会话的终端，并开始输入 JSON\
  \ 行。你可以使用如下所示的行：\n\n```json\n{\"NSS\":\"1234\",\"Nom\":\"María\", \"DID\":10, \"\
  DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"2345\",\"Nom\":\"Emilio\"\
  , \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"3456\",\"\
