  \n\n\n### 将流式数据写入其他数据接收器\n\n在前面的章节中，我们已经了解了如何使用 Spark Structured Streaming 内置的数据接收器。在本节中，我们将学习如何使用\
  \ MongoDB Spark 连接器将实时数据流式传输到 MongoDB。\n\nMongoDB 以类似 JSON 的文档形式存储信息，其结构可变，提供了动态且灵活的架构。MongoDB\
  \ 专为高可用性和可扩展性而设计，并原生集成了内置复制和自动分片功能。\n\nMongoDB 接收器允许您将 Spark 中的事件写入 MongoDB 实例。该接收器连接器会将\
  \ Spark 流式事件数据转换为 MongoDB 文档，并根据您选择的保存模式配置执行 `append`（追加）或 `overwrite`（覆盖）操作。\n\n\
  MongoDB 接收器连接器要求输出数据库预先创建，而目标 MongoDB 集合如果不存在，则可以在运行时创建。\n\n图 8-9 展示了用于 Spark 的\
  \ MongoDB 连接器的图形表示。\n\n![](img/538349_1_En_8_Fig9_HTML.jpg)\n\n一个流程图，从左到右依次包含 Spark、Sink、MongoDB、Source\
  \ 和 Spark。\n\n**图 8-9** 用于 Spark 的 MongoDB 连接器表示\n\n接下来，我们将看到一个实际的代码示例，展示如何将 MongoDB\
  \ 用作 Spark 数据接收器。与之前的其他示例类似，程序会从目录中读取新出现的 JSON 文件，并将数据插入到 MongoDB 集合中。本示例中使用的 JSON\
  \ 文件是我们在之前示例中一直使用的 *patient* 示例，这些示例首次出现在第 6 章中：\n\n```\nimport org.apache.spark.sql.SparkSession\n\
  import org.apache.spark.{SparkConf, SparkContext}\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType}\nval spark:SparkSession = SparkSession\n\
  .builder()\n.config(\"spark.jars.packages\", \"org.mongodb.spark:mongo-spark-connector:10.1.1\"\
  )\n.master(\"local[*]\")\n.appName(\"Hand-On-Spark3_File_Data_Source_MongoDB_Sink\"\
  )\n.getOrCreate()\nval sc = spark.sparkContext\nsc.setLogLevel(\"ERROR\")\nval mongoDBURI\
  \ = \"mongodb+srv://:@hands-on-spark3.akxgvpe.mongodb.net/?retryWrites=true&w=majority\"\
  \nval PatientsSchema = StructType(Array(\nStructField(\"NSS\", StringType),\nStructField(\"\
  Nom\", StringType),\nStructField(\"DID\", IntegerType),\nStructField(\"DNom\", StringType),\n\
  StructField(\"Fecha\", StringType))\n)\nval df = spark.readStream\n.schema(PatientsSchema)\n\
  .option(\"checkpointLocation\", \"/tmp/checkpoint\")\n.json(\"/tmp/stream_mongo\"\
  )\ndf.printSchema()\nval newDF = df.select(\"*\") // 此处可对数据进行转换\nnewDF.printSchema()\n\
  newDF.writeStream\n.format(\"mongodb\")\n.option(\"checkpointLocation\", \"/tmp/checkpoint\"\
  )\n.option(\"forceDeleteTempCheckpointLocation\", \"true\")\n```\n\n要查看代码运行效果，请创建一个流式目录，例如\
  \ `/tmp/stream_mongo`，用于复制您的 JSON 文件。\n\n当您运行上述代码并看到以下输出时：\n\n```\nroot\n|-- NSS:\
  \ string (nullable = true)\n|-- Nom: string (nullable = true)\n|-- DID: integer\
  \ (nullable = true)\n|-- DNom: string (nullable = true)\n|-- Fecha: string (nullable\
  \ = true)\n```\n\n您可以开始将文件复制到指定的流式目录。为了本示例的目的，我们使用第 6 章中使用的 JSON 文件。以下是操作示例：\n\n\
  ```\n$ cp /tmp/json/patient1.json /tmp/stream_mongo\n$ cp /tmp/json/patient2.json\
  \ /tmp/stream_mongo\n$ cp /tmp/json/patient3.json /tmp/stream_mongo\n$ cp /tmp/json/patient4.json\
  \ /tmp/stream_mongo\n$ cp /tmp/json/patient5.json /tmp/stream_mongo\n$ cp /tmp/json/patient6.json\
  \ /tmp/stream_mongo\n```\n\n请记住，这些文件内部的信息如下所示：\n\n```\n{\"NSS\":\"1009\",\"Nom\"\
  :\"Julia\", \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\"\
  :\"1010\",\"Nom\":\"Javier\", \"DID\":30, \"DNom\":\"Endo\", \"Fecha\":\"01-09-2022\"\
  }\n{\"NSS\":\"1011\",\"Nom\":\"Laura\", \"DID\":50, \"DNom\":\"Gineco\", \"Fecha\"\
  :\"01-09-2022\"}\n{\"NSS\":\"1012\",\"Nom\":\"Nuria\", \"DID\":10, \"DNom\":\"Cardio\"\
  , \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"1013\",\"Nom\":\"Helena\", \"DID\":10, \"\
  DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"1014\",\"Nom\":\"Nati\"\
  , \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n```\n\n现在，如果您查看您的\
  \ MongoDB 数据库（在我们的案例中，我们使用了图形界面 MongoDB Compass 进行查看），您将看到从流式处理过程中插入的数据。\n\n图 8-10\
  \ 向您展示了如何使用不同的数据键过滤已记录的数据。在此案例中，我们使用了部门 ID（`DID`）。请记住，MongoDB 以类似 JSON 的格式存储信息，而不是像传统\
  \ OLTP 数据库那样存储在表中。\n\n![](img/538349_1_En_8_Fig10_HTML.jpg)\n\nMongoDB Compass 动手实践\
  \ Spark 3 书籍的截图，显示已选中文档选项卡。\n\n**图 8-10** MongoDB Compass 按部门 ID（`DID`）过滤数据\n\n\
  在图 8-11 中，您可以看到一个类似的过滤查询，但在此案例中，我们按社会保险号（`SSN`）进行了过滤。\n\n![](img/538349_1_En_8_Fig11_HTML.jpg)\n\
  \nMongoDB Compass 动手实践 Spark 3 书籍的截图，显示已选中文档选项卡以添加数据和导出集合。\n\n**图 8-11** MongoDB\
  \ Compass 按社会保险号（`SSN`）过滤数据\n\n总而言之，MongoDB 是一个著名的面向文档的非关系型数据库，旨在用于半结构化数据。它非常灵活，可以处理大量异构信息。MongoDB\
  \ 和 Spark 均在免费开源许可下发布，两者共同构成了任何现代数据架构中值得考虑的坚实支柱。\n\n## 8.3 总结\n\n在本章中，我们介绍了 Spark\
  \ Structured Streaming 模块。具体来说，我们研究了流式数据处理中最常见的数据源和数据接收器。首先，我们研究了 Spark Structured\
  \ Streaming 内置的数据源，特别关注了最典型的几种：文件源、套接字源和 Kafka 源。Kafka 是当今最重要的流式框架之一；因此，我们开发了一个具体的代码示例，展示如何将其用作实时流源。其次，我们展示了如何实现自定义数据源，并实现了另一个实际示例，说明如何使用\
  \ MongoDB 实现。之后，我们继续前进，对数据接收器重复了相同的过程。首先，我们介绍了已定义的数据接收器，即控制台接收器、文件接收器和 Kafka 接收器。随后，我们研究了\
  \ `foreachBatch` 和 `foreach` 接收器，并分析了用户如何使用它们来创建自己的定制数据接收器。最后，我们还提供了一个使用 MongoDB\
  \ 实现的自定义数据接收器的实际示例。在下一章中，我们将继续学习高级流式配置，介绍事件时间窗口操作和水印。\n\n**脚注** 1\n\n\n\n"
- "# 9. 事件时间窗口操作与水位线\n\n在学习了 Apache Spark Streaming 和 Structured Streaming 的见解之后，本章我们将重点讨论基于时间的流处理。\n\
  \n在许多用例中，数据分析正从批处理向流数据处理演进。这种转变的原因之一是，人们越来越普遍地认为流数据更适合模拟我们所经历的生活。当我们思考大多数需要分析和建模的系统时，这一点尤为明显——接收和发送卫星导航坐标的自动驾驶汽车、交换信号的物联网设备、用于交通控制的道路车辆计数传感器、可穿戴设备等——它们都有一个共同点：都以连续的事件流形式及时出现。事实上，流数据源几乎无处不在。\n\
  \n此外，事件是某些活动的结果，在许多场景中，它们需要立即采取行动。例如，考虑欺诈或异常检测、个性化、营销和实时广告等应用，这些都是实时流处理和事件驱动应用最常见的用例。\n\
  \n一致的时间语义在流处理中至关重要，因为事件处理中的许多操作，如时间窗口上的聚合、连接和延迟数据管理，都依赖于时间。\n\n在本章中，我们将探讨用于流处理的时间窗口概念（也称为时间窗口），研究\
  \ Spark 的内置窗口函数，并解释窗口语义。\n\n## 9.1 事件时间处理\n\n如前所述，实时事件流处理中的许多操作都依赖于时间。在处理事件和时间时，我们有几种事件时间标记选项，根据手头的用例，我们必须优先选择其中一种：\n\
  \n*   **事件时间**：指事件被创建的时间，例如由传感器产生的时间。\n*   **摄入时间**：表示事件被事件流平台摄入的时刻。通过在事件进入流平台时为其添加时间戳来实现。\n\
  *   **处理时间**，也称为**挂钟时间**：指事件被实际处理的时刻。\n\n接下来，图 9-1 以图形方式解释了上述事件时间处理概念。\n\n![](img/538349_1_En_9_Fig1_HTML.jpg)\n\
  \n一个流程图解释了从事件时间到流平台，再经过流队列的过程。该平台包含带有摄入时间的数据源、带有处理时间的 Spark，最后是数据接收端。\n\n图 9-1 流事件时间处理模式\n\
  \n## 9.2 Apache Spark 中的流时间窗口\n\n在实时流处理中，对时间窗口内的数据执行操作是最常见的操作之一。\n\n时间窗口将流元素按时间间隔分组。Apache\
  \ Spark Structured Streaming 也支持事件时间，并允许基于事件时间的窗口计算，以及对窗口函数的原生支持。在 Apache 3.2 版本之前，Spark\
  \ 仅支持“滚动窗口”和“滑动窗口”，但从 Spark 3.2 开始，Spark 还包含了“会话窗口”，它同样可用于流式查询和批处理查询，使工程师能够以最少的工作量开发复杂的流处理作业。\n\
  \n使用 Structured Streaming，数据聚合在应用于滑动窗口时与 Spark 的分组聚合非常相似。对于分组聚合，会为分组列的每个不同元素维护聚合计算。而对于基于窗口的聚合，会为事件时间值所属的每个窗口维护聚合计算。\n\
  \n因此，在本书撰写时，Spark 提供了三种时间窗口可供选择：\n\n*   滚动窗口\n*   滑动窗口\n*   会话窗口\n\n上述窗口类型的共同点是，它们都应用于连续的数据流，将其分割成有限的信息集合。当我们想要执行聚合、连接和模式识别等操作时，将时间窗口或有限时间窗口应用于流数据尤其合适。接下来的章节将描述滚动窗口、滑动窗口和会话窗口类型的工作原理以及如何实际实现它们。让我们详细研究每一种。\n\
  \n### 什么是时间窗口，为什么它们在流处理中很重要\n\n考虑我们一直在使用的医院排队管理系统的例子。同时假设我们有一个计数器设备，每 15 秒统计一次进入医院的患者数量。由此产生的事件流可能如图\
  \ 9-2 所示。\n\n![](img/538349_1_En_9_Fig2_HTML.jpg)\n\n一个示意图左侧显示了一个计数器。其上的三个窗格分别显示\
  \ 0、0 和 8/9。水平方向从左到右依次输出数字 9、7、4、5、6、2、1、3、1、8、3、5。\n\n图 9-2 传递事件流的计数设备示例\n\n如果我们想知道进入医院的患者数量，我们可以将计数的患者数相加。然而，流的本质是我们面临一个无界数据的场景。也就是说，计数流是无穷无尽的，因此我们无法得出进入设施的患者总数的最终结果。一种替代方案是计算部分和，即，将接收到的计数相加，并在收集到新值时更新部分和。这样做，我们收集了一系列随着新计数更新的运行总计，如图\
  \ 9-3 所示。\n\n![](img/538349_1_En_9_Fig3_HTML.jpg)\n\n一个示意图左侧显示了一个计数器。其上的三个窗格分别显示\
  \ 0、0 和 8/9。水平方向从左到右依次输出数字 9、7、4、5、6、2、1、3、1、8、3、5。下方的部分和依次为 54、45、38、34、29、23、21、20、17、16、8\
  \ 和 5。\n\n图 9-3 部分和序列\n\n然而，部分和序列是一个实时指标，因为它会不断更新。因此，如果你想分析数据随时间的变化，例如，医院患者流量在早上还是晚上更大？或者如图\
  \ 9-4 所示，每个时间单位有多少患者进入医院？滚动求和策略可能不是最佳选择。\n\n![](img/538349_1_En_9_Fig4_HTML.jpg)\n\
  \n示意图包含一个计数器和三个编号窗格。窗口 1：9、7、4、5，计数时间 25。窗口 2：6、2、1、3，计数时间 12。窗口 3：1、8、3、5，计数时间\
  \ 17。\n\n图 9-4 用于按窗口时间统计事件的时间窗口示例\n\n为了回答类似上述的问题，我们有不同类型的时间窗口操作。接下来我们将研究滚动窗口操作。\n\
  \n\n\n## 9.3 滚动窗口\n\n滚动窗口（或称非重叠窗口）将数据流离散化为不重叠的数据段，并对每个数据段应用函数，如图 9-5 所示。\n\n滚动窗口的主要特征是：窗口之间互不重叠且重复出现，每个事件仅属于一个且唯一一个滚动窗口。\n\
  \n![](img/538349_1_En_9_Fig5_HTML.jpg)\n\n示意图包含一个计数器与三个编号窗格。窗口 1：9 7 4 5，计数时间 25。窗口\
  \ 2：6 2 1 3，计数时间 12。窗口 3：1 8 3 5，计数时间 17。所有窗口均为 10 秒滚动窗口。\n\n**图 9-5** 一个十秒的滚动窗口\n\
  \n为简化说明，前述图示中每个窗口区间内的事件数量相同；但请注意，实际情况并非总是如此，不同时间窗口内可能出现不同数量的事件，如下方图 9-6 所强调。\n\n\
  ![](img/538349_1_En_9_Fig6_HTML.jpg)\n\n示意图包含一个计数器与三个编号窗格。窗口 1：7，计数时间 7。窗口 2：2 1\
  \ 3，计数时间 6。窗口 3：1 8，计数时间 9。窗口 1、2、3 的滚动窗口分别为 0、10、20。\n\n**图 9-6** 一个十秒的滚动窗口，每个窗口内事件数量不同\n\
  \n以下代码片段使用大小为十秒的滚动窗口，对同一窗口时间内进入医院的患者数量进行聚合计数。\n\n```\n// Tumbling windows\nimport\
  \ org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\nimport\
  \ org.apache.spark.sql.types.{IntegerType, StringType, StructField, StructType,DoubleType,LongType}\n\
  import org.apache.spark.sql.{DataFrame, Dataset, Encoders, SparkSession}\nimport\
  \ java.io.IOException\nimport org.apache.spark.sql.streaming._\nimport org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.DataFrame\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Fecha\"\
  , StringType))\n)\nval spark:SparkSession = SparkSession.builder()\n.master(\"local[10]\"\
  )\n.appName(\"Hand-On-Spark3_Socket_Data_Source\")\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\nimport spark.implicits._\ntry {\nval PatientDS = spark.readStream\n.schema(PatientsSchema)\n\
