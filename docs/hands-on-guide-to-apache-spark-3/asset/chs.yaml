  \ |1          |\n+---+-----------+\n\nBatch: 2\n\n+---+-----------+\n|DID|Accumulated|\n\
  +---+-----------+\n|10 |4          |\n|20 |3          |\n|40 |1          |\n|50\
  \ |1          |\n|30 |1          |\n+---+-----------+\n\nBatch: 3\n\n+---+-----------+\n\
  |DID|Accumulated|\n+---+-----------+\n|10 |7          |\n|20 |3          |\n|50\
  \ |2          |\n|30 |2          |\n|40 |1          |\n+---+-----------+\n```\n\n\
  提供的示例生成的是无类型 DataFrame；这意味着提供的模式不会在编译时验证，仅在代码执行时的运行时验证。\n\n到目前为止，我们仅对到达流处理过程的数据应用了转换。例如，在我们上一个程序中，“Accumulated”列累加了输入的“DID”字段。这就是所谓的无状态流处理。现在假设一个场景，您想要找出流式应用接收到的每个值的总出现次数，并更新先前处理信息的状态。这就是我们接下来要讨论的流状态和有状态流处理概念发挥作用的地方。\n\
  \n## 7.5 Spark 结构化流转换\n\n在本节中，我们将向您介绍 Spark 结构化流支持的转换操作。这些数据转换分为*无状态*和*有状态*操作。Spark\
  \ 结构化流仅支持能够增量更新 DataFrame 聚合的操作。有状态操作需要在流处理过程中或在我们定义的时间范围内维护事件状态。\n\n接下来，我们将解释之前提到的结构化流概念：流状态、无状态操作和有状态操作。\n\
  \n### Spark 结构化流中的流状态\n\n状态是任何流式数据管道中最重要的组件之一。根据具体的用例，可能需要在流式应用运行期间维护不同变量（如计数器）的状态。\n\
  \n在处理流式数据的过程中，每个应用都必须使用无状态或有状态的数据管理方法。无状态操作与有状态操作的主要区别在于，执行增量聚合/操作时是否需要跟踪持续的事件状态。\n\
  \n总结来说，在此上下文中，*状态*基本上指的是需要在特定时间段内保留的“临时信息”，以便在后续流处理过程中使用。\n\n### Spark 无状态流处理\n\n\
  无状态意味着处理当前微批次中的数据时，不考虑过去或未来的信息。这种无状态数据处理的一个例子是收集和保存网络事件（点击、页面访问等）。\n\n无状态操作是指可以独立于先前处理的信息来处理当前信息的操作。这些操作的例子包括\
  \ `select()`、`explode()`、`map()`、`flatMap()`、`filter()` 和 `where()` 等。无状态操作仅支持 *append*\
  \ 和 *update* 输出模式，因为这些操作处理的信息无法在下游更新。另一方面，它们不支持 *complete* 输出模式，因为要累积完整的流信息实际上是不可能的。\n\
  \n在下一节中，我们将探讨如何执行有状态操作，以及如何相应地更新流配置和资源。\n\n\n\n### Spark 有状态流处理\n\n有状态流处理是一种维护事件状态的流处理方式。这意味着事件状态会在流处理过程中被维护并在事件之间共享；因此，事件条件可以随时间被维护和/或更新。有状态流用于在流式聚合中持久化实时聚合结果。\n\
  \n在涉及有状态操作时，Spark Structured Streaming 提供了一套简洁的 API 来维护不同批次之间的状态。\n\n当我们需要在流处理过程中持续更新中间状态（正在处理的信息）时，有状态处理是必要的。例如，当我们需要按键或事件时间进行数据聚合时，且无法保证事件按序到达。如图\
  \ 7-3 所示，你可以看到 Spark 如何利用 `StateStore`/`state store` 的概念来维护和共享不同批次之间的事件状态信息。\n\n\
  ![](img/538349_1_En_7_Fig3_HTML.jpg)\n\n示意图左侧从上到下依次展示了三个水平方块，分别标记为批次 0 到 2。右侧是一个圆柱体形状，标记为状态存储，从上到下分别显示批次\
  \ 0 和批次 1 后的流状态。两侧通过箭头连接。\n\n**图 7-3** Spark Structured Streaming 状态维护过程\n\nApache\
  \ Spark 通过将中间状态信息保存在一个名为 `StateStore` 的内存键值存储中来实现有状态操作。`StateStore` 实现了容错机制，将中间状态保存在一个称为检查点目录的文件系统目录中。\n\
  \n因此，通过有状态流处理，每个微批次的中间输出会被临时保存，并通过事件“状态”在执行之间共享。\n\n有状态转换的一个例子是统计（`df.groupBy().count()`）自查询开始以来处理的事件数量。Spark\
  \ 会将已统计的事件数量保存在事件状态中，并将其传递给下一个微批次，该数量会被累加到持续计数中。事件状态保存在 Spark 执行器的内存中，并保存到指定的文件系统目录以实现容错。\n\
  \n根据中间信息的管理和移除方式，有状态操作分为两种类型：\n\n*   **托管有状态操作** 是自动管理过时（“旧”）状态的操作。此类操作包括：\n   \
  \ *   流式聚合\n    *   流-流连接\n    *   流式去重\n    都属于此类别。\n\n*   **非托管有状态操作**，例如：\n \
  \   *   `mapGroupsWithState`\n    *   `flatMapGroupsWithState`\n    允许用户定义自己的有状态操作。\n\
  \n### 有状态流式聚合\n\nSpark 有状态流式聚合可分为：\n\n*   **基于时间的聚合**：每单位时间处理的事件数量\n*   **非基于时间的聚合**：例如按键对事件进行分组\n\
  \n#### 基于时间的聚合\n\n基于时间的聚合将在第 8 章中详细研究。因此，我们暂时搁置。\n\n#### 非基于时间的聚合\n\n非基于时间的聚合包括：\n\
  \n*   **全局聚合**\n\n这些是不区分键的通用聚合。在您目前看到的示例中，可以是医院登记的患者数量：\n\n```python\n# PySpark\n\
  counts = PatientDS.groupBy().count()\n```\n\n```scala\n// Scala\nval counts = PatientDS.groupBy().count()\n\
  ```\n\n*   **分组聚合**\n\n这些是按键或区分键的聚合。在上述医院排队管理系统应用示例的基础上，我们可能只关心医院中特定科室的预约数量。\n\n\
  以下是我们医院排队管理系统应用示例的修改版本，其中包含了按科室 ID 和科室名称进行的有状态分组聚合：\n\n```scala\nimport org.apache.spark.sql.SparkSession\n\
  import org.apache.spark.sql.functions._\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType,DoubleType,LongType}\nimport org.apache.spark.sql.{DataFrame,\
  \ Dataset, Encoders, SparkSession}\nimport java.io.IOException\n\nval PatientsSchema\
  \ = StructType(Array(\n  StructField(\"NSS\", StringType),\n  StructField(\"Nom\"\
  , StringType),\n  StructField(\"DID\", IntegerType),\n  StructField(\"DNom\", StringType),\n\
  \  StructField(\"Fecha\", StringType))\n)\n\ncase class Patient(\n  NSS: String,\n\
  \  Nom: String,\n  DID: Option[Long],\n  DNom: String,\n  Fecha: String\n)\n\nval\
  \ spark:SparkSession = SparkSession.builder()\n  .master(\"local[*]\")\n  .appName(\"\
  Hand-On-Spark3_Socket_Data_Source\")\n  .getOrCreate()\n\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\n\nval host = \"localhost\"\nval port = 9999\n\ntry {\n  val PatientDS\
  \ = spark.readStream\n    .format(\"socket\")\n    .option(\"host\",host)\n    .option(\"\
  port\",port)\n    .load()\n    .select(from_json(col(\"value\"),  PatientsSchema).as(\"\
  patient\"))\n    .selectExpr(\"Patient.*\")\n    .as[Patient]\n\n  printf(\"\\n\
  \ Listening and ready... \\n\")\n\n  val counts = PatientDS\n    .groupBy(col(\"\
  DID\"),col(\"DNom\"))\n    .count()\n\n  counts.writeStream\n    .format(\"update\"\
  )\n    .format(\"console\")\n    .outputMode(\"complete\")\n    .option(\"truncate\"\
  ,false)\n    .option(\"newRows\",30)\n    .start()\n    .awaitTermination()\n} catch\
  \ {\n  case e: java.net.ConnectException => println(\"Error establishing connection\
  \ to \" + host + \":\" + port)\n  case e: IOException => println(\"IOException occurred\"\
  )\n  case t: Throwable => println(\"Error receiving data\", t)\n} finally {\n  println(\"\
  Finally block\")\n}\n```\n\n运行上述代码，您将看到类似如下的输出：\n\n```\n    Listening and ready...\n\
  \    -------------------------------------------\n    Batch: 1\n    -------------------------------------------\n\
  \    +---+------+-----+\n    |DID|DNom  |count|\n    +---+------+-----+\n    |20\
  \ |Neuro |4    |\n    |40 |Gastro|1    |\n    |50 |Gineco|3    |\n    |30 |Endo\
  \  |3    |\n    |10 |Cardio|9    |\n    +---+------+-----+\n    -------------------------------------------\n\
  \    Batch: 2\n    -------------------------------------------\n    +---+------+-----+\n\
  \    |DID|DNom  |count|\n    +---+------+-----+\n    |20 |Neuro |11   |\n    |40\
  \ |Gastro|3    |\n    |50 |Gineco|9    |\n    |30 |Endo  |8    |\n    |10 |Cardio|26\
  \   |\n    +---+------+-----+\n    -------------------------------------------\n\
  \    Batch: 3\n    -------------------------------------------\n    +---+------+-----+\n\
  \    |DID|DNom  |count|\n    +---+------+-----+\n    |20 |Neuro |11   |\n    |40\
  \ |Gastro|3    |\n    |50 |Gineco|9    |\n    |30 |Endo  |8    |\n    |10 |Cardio|27\
  \   |\n    +---+------+-----+\n```\n\n*   **多重聚合**\n\n`groupBy` 子句允许您指定多个聚合函数来转换列信息。因此，可以一次性执行多个聚合。例如，您可以按如下方式修改之前的代码片段。\n\
  \n\n\n```\nval counts = PatientDS\n.groupBy(col(\"DID\"),col(\"DNom\"))\n.agg(count(\"\
  *\").alias(\"countDID\"),\nsum(\"DID\").alias(\"sumDID\"),\nmean(\"DID\").alias(\"\
  meanDID\"),\nstddev(\"DID\").alias(\"stddevDID\"),\napprox_count_distinct(\"DID\"\
  ).alias(\"distinctDID\"),\ncollect_list(\"DID\").alias(\"collect_listDID\"))\n```\n\
  \n用于同时获取多个聚合结果。\n\n当你在终端中运行上述代码并复制（记得先执行 `nc -lk 9999`）以下第一组 JSON 字符串时：\n\n```\n\
  {\"NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\", \"Fecha\"\
  :\"2023-02-23T00:00:03.002Z\"}\n{\"NSS\":\"5678\",\"Nom\":\"Sonia\", \"DID\":50,\
  \ \"DNom\":\"Gineco\", \"Fecha\":\"2023-02-23T00:00:04.002Z\"}\n{\"NSS\":\"6789\"\
  ,\"Nom\":\"Eduardo\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"2023-02-23T00:00:05.002Z\"\
  }\n{\"NSS\":\"1001\",\"Nom\":\"Lorena\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\"\
  :\"2023-02-23T00:00:06.002Z\"}\n{\"NSS\":\"1006\",\"Nom\":\"Sara\", \"DID\":20,\
  \ \"DNom\":\"Neuro\", \"Fecha\":\"2023-02-23T00:00:07.002Z\"}\n{\"NSS\":\"1002\"\
  ,\"Nom\":\"Teresa\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"2023-02-23T00:00:08.002Z\"\
  }\n{\"NSS\":\"1003\",\"Nom\":\"Luis\", \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\"\
  :\"2023-02-23T00:00:09.002Z\"}\n```\n\n紧接着再复制第二组 JSON 字符串：\n\n```\n{\"NSS\":\"1004\"\
  ,\"Nom\":\"Tomás\", \"DID\":30, \"DNom\":\"Endo\", \"Fecha\":\"2023-02-23T00:00:10.002Z\"\
  }\n{\"NSS\":\"1005\",\"Nom\":\"Lorena\", \"DID\":50, \"DNom\":\"Gineco\", \"Fecha\"\
  :\"023-02-23T00:00:11.002Z\"}\n{\"NSS\":\"1006\",\"Nom\":\"Pedro\", \"DID\":10,\
  \ \"DNom\":\"Cardio\", \"Fecha\":\"023-02-23T00:00:12.002Z\"}\n{\"NSS\":\"1007\"\
  ,\"Nom\":\"Ester\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"023-02-23T00:00:13.002Z\"\
  }\n{\"NSS\":\"1008\",\"Nom\":\"Marina\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\"\
