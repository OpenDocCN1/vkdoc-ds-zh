  \ /tmp/patient_streaming\n    cp /PATH/TO/patient4.json /tmp/patient_streaming\n\
  \    cp /PATH/TO/patient5.json /tmp/patient_streaming\n    ```\n\n每隔几秒，您就会在终端会话或笔记本中看到类似如下的输出：\n\
  \n```\nListening and ready...\n\nBatch: 0\n\n+---+-----------+\n|DID|Accumulated|\n\
