  #### 将 RDD 保存为文本文件


  虽然将现有 RDD 保存到文件是一种行动而非转换，但我们在此介绍它，是为了利用 DonQuixote RDD 向你展示如何将内存中的数据保存到容错设备中。


  你可以使用 `saveAsTextFile()` 方法将 RDD 保存为元素的字符串表示形式。`saveAsTextFile()` 会将 RDD 存储为文本文件。


  `saveAsTextFile(path: str, compressionCodecClass: Optional)` 可以接受两个参数。其中一个是必填的，即
  *path*，根据官方文档，它代表“*文本文件的路径*”；但实际上，它是一个文件夹。Spark 将 RDD 分割成不同的文件写入，并附带一个成功文件（`_success`）。这些文件被命名为
  `part-00000`、`part-00001`，依此类推。


  `compressionCodecClass` 允许指定一个压缩编解码器来压缩存储你的数据。


  继续我们的 DonQuixote 示例，让我们将 RDD 写入一个文件：


  ```

  reduceByKeyDonQuixoteRdd.saveAsTextFile("RDDDonQuixote")

  ```


  你也可以创建一个临时目录来存储文件，并且不让操作系统决定该目录的位置，而是由你控制这些参数。以下是一个 PySpark 示例：


  ```

  import tempfile

  from tempfile import NamedTemporaryFile

  tempfile.tempdir = "./"

  RDDDonQuixote = NamedTemporaryFile(delete=True)

  RDDDonQuixote.close()

  DonQuixoteRdd3.saveAsTextFile(RDDDonQuixote.name)

  print(RDDDonQuixote)

  print(RDDDonQuixote.name)

  # 输出


  /Users/aantolinez/tmp906w7eoy

  from fileinput import input

  from glob import glob

  ''''.join(sorted(input(glob(RDDDonQuixote.name + "/part-0000*"))))

  # 输出

  "(''(for'', 1)\n(''An'', 1)\n(''Fridays,'', 1)\n(''He'', 1)\n(''I'', 1)\n(''In'',
  1)\n(''La'', 1)\n(''Mancha,'', 1)\n(''Quesada'', 1)\n(''Quexana.'', 1)\n(''Quixada'',
  1)\n(''Saturdays,'', 1)\n(''Sundays,'', 1)\n(''The'', 1)\n(''The'', 1)\n(''They'',
  1)\n(''This,'', 1)\n(''a'', 1)\n(''a'', 1)\n(''a'', 1)\n(''a'', 1)\n(''a'', 1)\n(''a'',
  1)\n(''a'', 1)\n..."

  ```


  在前面的示例中，我们使用了 `NamedTemporaryFile()` 函数在文件系统中创建一个具有可见名称的文件。`delete` 参数可以接受 `True/False`
  值。将其设置为 `False`，我们可以在不销毁文件的情况下关闭它，从而允许我们稍后重新打开它。




  #### 在每个分区内合并数据


  处理键值对时最常见的问题之一就是根据标准键对值进行分组和聚合。在本节中，我们将使用 `aggregateByKey()` 函数在每个分区内聚合数据。


  与 `reduceByKey()` 类似，`aggregateByKey()` 会在数据被混洗之前，在每个分区内根据公共键合并数据；然而，`reduceByKey()`
  在某种意义上可以看作是 `aggregateByKey()` 的一个特例，因为它在单个分区内合并的结果与所合并的值类型相同。在合并这些单个分区的输出后，最终结果的类型也与单个分区的值的类型相同。


  `aggregateByKey()` 根据键合并数据集的值，并且此合并的输出可以是任何用户定义的对象。使用 `aggregateByKey()`，您可以指定如何在分区级别（在每个工作节点内部）合并值，然后，如何将这些分区的各个输出在集群的节点之间组合起来，以提供最终结果。


  我们将通过一个示例来解释这个概念以及 `reduceByKey()` 和 `aggregateByKey()` 之间的区别。


  假设您有以下数据集：`(("a", 1), ("a", 3), ("b", 2), ("a", 5), ("b", 4), ("a", 7), ("b", 6))`。


  首先，我们将根据上述数据创建一个 RDD：


  ```

  val pairs = sc.parallelize(Array(("a", 1), ("a", 3), ("b", 2), ("a", 5), ("b", 4),
  ("a", 7), ("b", 6)))

  pairs: org.apache.spark.rdd.RDD[(String, Int)] = ParallelCollectionRDD[82] at parallelize
  at :25

  ```


  如果您只想通过求和来按键添加值，那么 `reduceByKey` 和 `aggregateByKey` 都会产生相同的结果。您可以在下面看到一个示例：


  ```

  val outputReduceByKey = pairs.reduceByKey(_ + _)

  outputReduceByKey.collect

  outputReduceByKey: org.apache.spark.rdd.RDD[(String, Int)] = ShuffledRDD[87] at
  reduceByKey at :28

  res49: Array[(String, Int)] = Array((a,16), (b,12))

  val outputAggregateByKey = pairs.aggregateByKey(0)(_+_,_+_)

  //_+_ 操作在分区内执行，_+_ 操作在分区之间执行

  outputAggregateByKey.collect

  outputAggregateByKey: org.apache.spark.rdd.RDD[(String, Int)] = ShuffledRDD[88]
  at aggregateByKey at :27

  res50: Array[(String, Int)] = Array((a,16), (b,12))

  ```


  现在假设您对另一种类型的操作感兴趣，这种操作返回的值与原始值的类型不同。例如，假设您期望的输出是一组值，其数据类型与值本身（整数）不同，并且分区内的操作（整数求和返回另一个整数）也不同。


  接下来，我们通过一个示例来解释这个想法：


  ```

  val outcomeSets = pairs.aggregateByKey(new HashSet[Int])(_+_, _++_)

  // _+_ 将一个值添加到一个集合中

  // _++_ 合并两个集合

  outcomeSets.collect

  res52: Array[(String, scala.collection.mutable.HashSet[Int])] = Array((a,Set(1,
  5, 3, 7)), (b,Set(2, 6, 4)))

  ```


  #### 使用中性零值合并值


  `foldByKey()` 聚合是一种 `reduceByKey()`，它带有一个不应影响最终结果的初始化零值。与 `reduceByKey()` 一样，它使用一个关联函数来合并每个
  RDD 键的值，但此外，它还允许为每个分区提供一个中性的初始化值，例如加法用 0，乘法用 1，或者列表拼接时用空列表，这个值可以任意次数地添加到最终结果中，而不会影响最终结果。零值在每个分区中为每个键初始化一次。


  下面您可以看到一些 `foldByKey()` 的使用示例：


  ```

  val pairs = sc.parallelize(Array(("a", 1), ("a", 3), ("b", 2), ("a", 5), ("b", 4),
  ("a", 7), ("b", 6)))

  pairs: org.apache.spark.rdd.RDD[(String, Int)] = ParallelCollectionRDD[82] at parallelize
  at :25

  pairs.foldByKey(0)(_+_).collect // 使用初始值 0

  res66: Array[(String, Int)] = Array((a,24), (b,18))

  pairs.foldByKey(1)(_+_).collect // 使用初始值 1

  res68: Array[(String, Int)] = Array((a,20), (b,15))

  pairs.foldByKey(2)(_+_).collect // 使用初始值 2

  res66: Array[(String, Int)] = Array((a,24), (b,18))

  ```


  #### 使用自定义聚合函数按键合并元素


  在本节中，我们将解释 Spark 的 `combineByKey()` 通用函数，该函数使用自定义聚合函数按每个键合并配对 RDD 的元素。`combineByKey()`
  是一个宽转换，因为它在最后阶段需要一次混洗。此函数将 `RDD[(K, V)]` 转换为类型为 `RDD[(K, C)]` 的结果，其中 C 是“合并类型”，C
  是对键 K 的所有值进行任何聚合的结果。


  下面您可以看到一个如何使用 `combineByKey()` 的 PySpark 示例：


  ```

  pairs = sc.parallelize([("a", 1), ("a", 3), ("b", 2), ("a", 5), ("b", 4), ("a",
  7), ("b", 6)])

  def to_list(x):

  return [x]

  def append(x, y):

  x.append(y) # append() 方法将 y 元素添加到 x 列表。

  return x

  def extend(x, y):

  x.extend(y) # extend() 方法将列表 y 的元素添加到 x 列表的末尾。

  return x

  sorted(pairs.combineByKey(to_list, append, extend).collect())

  [(''a'', [1, 3, 5, 7]), (''b'', [2, 4, 6])]

  ```


  #### 在配对 RDD 上对数据进行分组


  处理键值对数据集时，一个常见的用例是将所有对应相同键的值分组。`groupByKey()` 方法通过按每个键对值进行分组，返回一个分组的 RDD。`groupByKey()`
  需要一个函数，该函数将应用于 RDD 的每个值。


  在下面的示例中，我们将一个 Scala 集合类型转换为 Spark RDD：


  ```

  // 包含元组键值对的 Scala 集合

  val countriesTuples = Seq(("España",1),("Kazakhstan",1), ("Denmark", 1),("España",1),("España",1),("Kazakhstan",1),("Kazakhstan",1))

  // 将集合转换为 RDD。

  val countriesDs = spark.sparkContext.parallelize(countriesTuples)

  // 输出

  countriesTuples: Seq[(String, Int)] = List((España,1), (Kazakhstan,1), (Denmark,1),
  (España,1), (España,1), (Kazakhstan,1), (Kazakhstan,1))

  countriesDs: org.apache.spark.rdd.RDD[(String, Int)] = ParallelCollectionRDD[32]
  at parallelize at :29

  countriesDs.collect.foreach(println)

  // 输出

  (España,1)

  (Kazakhstan,1)

  (Denmark,1)

  (España,1)

  (España,1)

  (Kazakhstan,1)

  (Kazakhstan,1)

  ```


  现在，我们将使用 `groupByKey()` 方法按键对值进行分组：


  ```

  // 在配对 RDD 上应用转换。

  val groupRDDByKey = countriesDs.groupByKey()

  // 输出

  groupRDDByKey: org.apache.spark.rdd.RDD[(String, Iterable[Int])] = ShuffledRDD[34]
  at groupByKey at :26

  groupRDDByKey.collect.foreach(println)

  // 输出

  (España,CompactBuffer(1, 1, 1))

  (Kazakhstan,CompactBuffer(1, 1, 1))

  (Danish,CompactBuffer(1))

  ```


  正如您在前面的代码中看到的，`groupByKey()` 根据每个键对数据进行分组，并返回一个迭代器。请注意，与 `reduceByKey()` 不同，`groupByKey()`
  函数不对最终输出执行任何操作；它只对数据进行分组，并以迭代器的形式返回。这个迭代器可用于将键值 RDD 转换为任何类型的集合，例如 List 或 Set。


  现在想象一下，您想知道每个国家出现的次数，然后您想将之前的 `CompactBuffer` 格式转换为 List：


  ```

  // 每个国家出现的次数，并将 CompactBuffer 转换为 List。

  val countryCountRDD = groupRDDByKey.map(tuple => (tuple._1, tuple._2.toList.sum))

  countryCountRDD.collect.foreach(println)

  // 输出

  (España,3)

  (Kazakhstan,3)

  (Danish,1)

  ```




  #### `groupByKey` 的性能考量


  在某些情况下，`groupByKey()` 并非解决特定问题的最佳选择。例如，在处理非常大的数据集时，`reduceByKey()` 的性能优于 `groupByKey()`。虽然这两个函数都能给出相同的结果，但对于大型数据集，`reduceByKey()`
  是更优的选择，因为后者在 Spark 于每个分区按键合并值之前，会执行一次常规的 shuffle 操作（如你所知，这涉及数据在网络中的移动），因此在性能方面代价高昂。


  让我们通过一个典型的单词计数示例，更详细地了解这些性能问题。该示例首先在分布式数据集上使用 `reduceByKey()`，然后使用 `groupByKey()`：


  ```

  val countriesList = List("España","Kazakhstan", "Denmark","España","España","Kazakhstan","Kazakhstan")

  val countriesDs = spark.sparkContext.parallelize(countriesList)

  // 输出

  countriesList: List[String] = List(España, Kazakhstan, Denmark, España, España,
  Kazakhstan, Kazakhstan)

  countriesDs: org.apache.spark.rdd.RDD[String] = ParallelCollectionRDD[39] at parallelize
  at :28

  val countryPairsRDD = sc.parallelize(countriesList).map(country => (country, 1))

  val countryCountsWithReduce = countryPairsRDD

  .reduceByKey(_ + _) // reduceByKey()

  .collect()

  val countryCountsWithGroup = countryPairsRDD

  .groupByKey() // groupByKey()

  .map(t => (t._1, t._2.sum))

  .collect()

  // 输出

  countryPairsRDD: org.apache.spark.rdd.RDD[(String, Int)] = MapPartitionsRDD[51]
  at map at :27

  countryCountsWithReduce: Array[(String, Int)] = Array((España,3), (Kazakhstan,3),
  (Denmark,1))

  countryCountsWithGroup: Array[(String, Int)] = Array((España,3), (Kazakhstan,3),
  (Denmark,1))

  ```


  这两个函数都会产生相同的结果；然而，`reduceByKey()` 在大型数据集上表现更好，因为 Spark 可以在数据跨集群节点进行 shuffle 之前，在每个分区上合并具有相同键的输出。`reduceByKey()`
  使用一个 lambda 函数，在数据被 shuffle 之前，在每个节点上按每个键合并值；之后，它在分区级别合并数据。该 lambda 函数再次被用于归约每个分区返回的值，以获得最终结果。这种行为如图
  3-4 所示。


  ![](img/538349_1_En_3_Fig4_HTML.jpg)


  一个图表包含三个块，分别标记为节点 1、2 和 n，其中包含诸如 España、Denmark 和 Kazakhstan 等值。底部的三个块表示 shuffle
  后每个块中的每个值。


  **图 3-4** — `reduceByKey` 内部操作


  另一方面，当你使用 `groupByKey()` 时，每个分区上的键值对会在集群的节点之间进行 shuffle。当处理大型数据集时，这种行为会导致大量数据在网络中不必要的移动，从而造成显著的处理开销。


  在大型数据集中避免使用 `groupByKey()` 的另一个原因是，驱动节点可能出现内存不足（`OutOfMemoryError`）的情况。请记住，当数据量无法容纳在内存中时，Spark
  必须将数据写入磁盘。当单个执行器机器接收的数据量超过其内存容量时，就会发生内存不足的情况，导致内存溢出。Spark 一次将一个键的数据保存到磁盘；因此，将数据刷出到永久存储设备的过程会严重干扰
  Spark 的操作。


  因此，数据集越大，出现内存不足问题的可能性就越大。因此，对于大型数据集，通常 `reduceByKey()`、`combineByKey()`、`foldByKey()`
  或其他函数比 `groupByKey()` 更可取。


  `groupByKey()` 的内部操作模式如图 3-5 所示。


  ![](img/538349_1_En_3_Fig5_HTML.jpg)


  一个图表包含三个块，分别标记为节点 1、2 和 n，每个块中包含诸如 España、Denmark 和 Kazakhstan 等值。底部的三个块表示 shuffle
  后每个块中的每个值。


  **图 3-5** — `groupByKey` 内部操作


  #### 键值对 RDD 上的连接操作


  当你将键值对 RDD 与其他键值对 RDD 组合时，可以充分利用它们的优势。组合不同的数据集可以释放 Apache Spark 真正的分析能力，并让你发现数据中的洞察。连接
  RDD 可能是你在键值对 RDD 上必须执行的最典型操作之一。


  ##### 返回两个 RDD 中都存在的键


  `join()` 在对两个 RDD 应用连接转换后返回一个 RDD。返回的 RDD 仅包含两个键值对 RDD 中都存在的键。`join()` 返回的 RDD 如图
  3-6 所示。


  ![](img/538349_1_En_3_Fig6_HTML.png)


  一个包含集合 A 和 B 的维恩图。中心部分被阴影覆盖。


  **图 3-6** — `join()` 转换的结果集


  ```

  val rdd1 = sc.parallelize(Array(("PySpark",10),("Scala",15),("R",100)))

  val rdd2 = sc.parallelize(Array(("Scala",11),("Scala",20),("PySpark",75), ("PySpark",35)))

  val joinedRDD = rdd1.join(rdd2)

  joinedRDD.foreach(println)

  // 输出

  (Scala,(15,11))

  (Scala,(15,20))

  (PySpark,(10,75))

  (PySpark,(10,35))

  ```


  使用 PySpark 代码也可以获得相同的结果，如下所示：


  ```

  rdd1 = spark.sparkContext.parallelize([("PySpark",10),("Scala",15),("R",100)])

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  joinedRDD = rdd1.join(rdd2)

  print(joinedRDD.collect())

  # 输出

  [(''Scala'', (15, 11)), (''Scala'', (15, 20)), (''PySpark'', (10, 75)), (''PySpark'',
  (10, 35))]

  ```


  ##### 返回源 RDD 中存在的键


  `leftOuterJoin()` 返回一个键值对 RDD，其中包含源（左）RDD 中每个键的条目。返回的 RDD 包含源（左）RDD 中找到的键，以及一个元组，该元组是源
  RDD 中的值与另一个键值对 RDD（右）中该键的某个值的组合。换句话说，`leftOuterJoin()` 返回左（A）RDD 中的所有记录以及右（B）RDD
  中匹配的记录。


  `leftOuterJoin()` 返回的 RDD 如图 3-7 所示。


  ![](img/538349_1_En_3_Fig7_HTML.png)


  一个包含集合 A 和 B 的维恩图。集合 A 被阴影覆盖。它表示左外连接。


  **图 3-7** — `leftOuterJoin()` 转换的结果集


  下面，你可以看到如何在 Scala 中应用 `leftOuterJoin()`：


  ```

  val leftJoinedRDD = rdd1.leftOuterJoin(rdd2)

  leftJoinedRDD.foreach(println)

  // 输出

  (R,(100,None))

  (Scala,(15,Some(11)))

  (Scala,(15,Some(20)))

  (PySpark,(10,Some(75)))

  (PySpark,(10,Some(35)))

  ```


  使用 PySpark 代码将获得相同的结果，如下所示：


  ```

  rdd1 = spark.sparkContext.parallelize([("PySpark",10),("Scala",15),("R",100)])

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  joinedRDD = rdd1.leftOuterJoin(rdd2)

  print(joinedRDD.collect())

  # 输出

  [(''R'', (100, None)), (''Scala'', (15, 11)), (''Scala'', (15, 20)), (''PySpark'',
  (10, 75)), (''PySpark'', (10, 35))]

  ```




  ##### 返回参数 RDD 中存在的键


  `rightOuterJoin()` 与 `leftOuterJoin()` 相同，区别在于它返回一个包含另一个（右侧）RDD 中每个键的条目的键值对 RDD。返回的
  RDD 包含在另一个（右侧）RDD 中找到的键，以及一个元组，该元组是另一个（右侧）RDD 中的值与源（左侧）键值对 RDD 中该键的某个值的组合。换句话说，`rightOuterJoin()`
  返回右侧 RDD (B) 中的所有记录以及左侧 RDD (A) 中匹配的记录。


  `rightOuterJoin()` 返回的 RDD 如图 3-8 所示。


  ![](img/538349_1_En_3_Fig8_HTML.png)


  一个包含集合 A 和 B 的维恩图。集合 B 被着色。它表示右外连接。


  **图 3-8** `rightOuterJoin()` 转换的结果集


  让我们看看如何在 Scala 代码片段中应用 `rightOuterJoin()`：


  ```

  rdd1 = spark.sparkContext.parallelize([("PySpark",10),("Scala",15),("R",100)])

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  joinedRDD = rdd1.rightOuterJoin(rdd2)

  print(joinedRDD.collect())

  # 输出

  [(''Scala'', (15, 11)), (''Scala'', (15, 20)), (''PySpark'', (10, 75)), (''PySpark'',
  (10, 35))]

  ```


  同样，你可以使用 PySpark 代码获得相同的结果，如下所示：


  ```

  rdd1 = spark.sparkContext.parallelize([("PySpark",10),("Scala",15),("R",100)])

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  joinedRDD = rdd1.leftOuterJoin(rdd2)

  print(joinedRDD.collect())

  # 输出

  [(''R'', (100, None)), (''Scala'', (15, 11)), (''Scala'', (15, 20)), (''PySpark'',
  (10, 75)), (''PySpark'', (10, 35))]

  ```


  #### 对键值对 RDD 进行排序


  要按升序或降序对 RDD 的值按键排序，可以使用 Apache Spark 的 `sortByKey()` 转换。


  Spark RDD `sortByKey()` 转换的语法如下：


  `RDD.sortByKey(*ascending*: Optional[bool] = True, *numPartitions*: Optional[int]
  = None, keyfunc: Callable[[Any], Any] = <function RDD.<lambda>>) → *pyspark.rdd.RDD[Tuple[K,
  V]]*`


  Spark RDD `sortByKey()` 转换的 *ascending* 选项指定排序顺序（默认为升序，或设置为 *true* 时）；对于降序，只需将其设置为
  *false*。*numPartitions* 选项指定结果应分成的分区数。`sortByKey()` 转换返回一个数据元组。


  现在，让我们通过一个实际示例来看看 `sortByKey()` 的实际应用：


  ```

  val rdd2 = sc.parallelize(Array(("Scala",11),("Scala",20),("PySpark",75), ("PySpark",35)))

  rdd1.sortByKey(true).foreach(println) // 升序 (true)

  // 输出

  (R,100)

  (PySpark,10)

  (Scala,15)

  rdd1.sortByKey(false).foreach(println) // 降序 (false)

  // 输出

  (PySpark,10)

  (R,100)

  (Scala,15)

  ```


  #### 按给定键函数对 RDD 进行排序


  另一个非常重要的 Apache Spark 转换是 `sortBy()`：


  ```

  RDD.sortBy(keyfunc: Callable[[T], S], ascending: bool = True, numPartitions: Optional[int]
  = None) → RDD[T]

  ```


  `sortBy()` 函数接受三个参数。第一个是提供的键函数 (*keyfunc*)，它根据指定的键对 RDD 进行排序并返回另一个 RDD。


  第二个是一个标志，指定结果应以升序还是降序返回。默认是升序 (true)。


  第三个参数 (*numPartitions*) 指定结果将被划分成的总分区数。*numPartitions* 是一个重要的优化参数，因为 `sortBy()`
  涉及 RDD 元素的混洗，我们已经知道这可能导致不必要的数据移动。


  现在，让我们通过一个示例来看看 `sortBy()` 是如何工作的，该示例利用了之前示例中创建的 RDD1：


  ```

  val rdd1 = sc.parallelize(Array(("PySpark",10),("Scala",15),("R",100)))

  rdd1.sortBy(x => x._1).collect().foreach(println)

  (PySpark,10)

  (R,100)

  (Scala,15)

  // 输出

  (PySpark,10)

  (R,100)

  (Scala,15)

  // 现在使用元组的值对数据进行排序

  rdd1.sortBy(x => x._2).collect().foreach(println)

  // 输出

  (PySpark,10)

  (Scala,15)

  (R,100)

  ```


  ### 对键值对 RDD 的操作


  正如我们在本书前面所解释的，Spark 操作是返回原始值的 RDD 操作。而 RDD 上的转换返回一个新的 RDD 并保留原始 RDD，操作则返回一个值。因此，在
  RDD 上执行的任何返回非新 RDD 的操作都是操作。


  然后，你还必须记住，RDD 操作能够触发在 DAG（有向无环图）中定义的代码片段的有效执行。因此，虽然 Spark 转换被认为是惰性的，意味着它们在定义后不会立即执行，但操作不是。


  让我们看看一些最重要的 Spark 操作。


  #### 按键统计 RDD 实例


  `countByKey()` 统计 RDD 中每个键的元素数量，并返回一个 `DefaultDict[key,int]`。


  `DefaultDict` 是一个类似字典的对象，尝试访问字典中不存在的值将返回 0，而不是抛出错误。


  让我们通过一个 Scala 示例来看看它是如何工作的。考虑之前示例中使用的以下键值对 RDD：


  ```

  val rdd2 = sc.parallelize(Array(("Scala",11),("Scala",20),("PySpark",75), ("PySpark",35)))

  rdd2.countByKey()

  // 输出

  res48: scala.collection.Map[String,Long] = Map(PySpark -> 2, Scala -> 2)

  rdd2.countByKey().foreach(println)

  // 输出

  (PySpark,2)

  (Scala,2)

  ```


  你可以像访问普通字典一样访问 `elementsCount` 字典的元素：


  ```

  val elementsCount = rdd2.countByKey()

  println(elementsCount("Scala"))

  // 输出


  ```


  现在你将看到相同的示例，但这次使用的是 PySpark：


  ```

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  rdd2.collect()

  # 输出

  [(''Scala'', 11), (''Scala'', 20), (''PySpark'', 75), (''PySpark'', 35)]

  # 按键分组，并获取每个组的计数

  rdd2.countByKey()

  # 输出

  defaultdict(int, {''Scala'': 2, ''PySpark'': 2})

  elementsCount = rdd2.countByKey()

  print(elementsCount)

  #输出

  defaultdict(, {''Scala'': 2, ''PySpark'': 2})

  ```


  现在你可以像访问普通字典一样访问 `elementsCount` 字典的元素：


  ```

  elementsCount[''Scala'']

  # 输出


  ```


  尝试访问 `elementsCount` 中不存在的值将返回 0：


  ```

  elementsCount[''SQL'']

  # 输出


  ```


  #### 按值统计 RDD 实例


  Spark 的 `countByValue()` 方法统计 RDD 中每个唯一值，返回一个值-计数对的字典。


  下面，你可以看到 `countByValue()` 如何与 Scala 示例一起工作：


  ```

  println(rdd2.countByValue())

  //输出:

  Map((PySpark,35) -> 1, (Scala,11) -> 1, (Scala,20) -> 1, (PySpark,75) -> 1)

  ```


  继续我们之前的 RDD 示例，现在我们将看到如何使用 PySpark 的 `countByValue()`：


  ```

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  sorted(rdd2.countByValue().items())

  # 输出

  [((''PySpark'', 35), 1),

  ((''PySpark'', 75), 1),

  ((''Scala'', 11), 1),

  ((''Scala'', 20), 1)]

  ```




  #### 将键值对作为字典返回


  RDD 的 `collectAsMap()` 方法会收集驱动节点上配对 RDD 的所有元素，并将 RDD 中的键值对以字典形式返回。


  我们将在以下 Scala 代码片段中看到此方法的用法：


  ```

  val rdd1 = sc.parallelize(Array(("PySpark",10),("Scala",15),("R",100)))

  val rdd1 = sc.parallelize(Array(("PySpark",10),("Scala",15),("R",100)))

  rdd1.collectAsMap()

  // 输出

  res62: scala.collection.Map[String,Int] = Map(R -> 100, Scala -> 15, PySpark ->
  10)

  ```


  但是，如果存在重复的键，则最后一个键值对将覆盖之前的键值对。在下面的示例中，元组 `("Scala",11)` 已被 `("Scala",20)` 覆盖：


  ```

  rdd2.collectAsMap()

  // 输出

  res63: scala.collection.Map[String,Int] = Map(Scala -> 20, PySpark -> 35)

  ```


  以下是相同的示例，但这次使用的是 PySpark：


  ```

  rdd1 = spark.sparkContext.parallelize([("PySpark",10),("Scala",15),("R",100)])

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  rdd1.collectAsMap()

  # 输出

  {''PySpark'': 10, ''Scala'': 15, ''R'': 100}

  ```


  请记住，如果存在重复的键，则最后一个键值对将覆盖之前的键值对。在下面的示例中，元组 `("Scala",11)` 已被 `("Scala",20)` 覆盖：


  ```

  rdd2.collectAsMap()

  # 输出

  {''Scala'': 20, ''PySpark'': 35}

  ```


  #### 收集与某个键关联的所有值


  Apache Spark 的 `lookup(key)` 方法是一个动作，它会返回与给定键关联的所有值，并以列表形式呈现。该方法接受一个键名作为参数：


  ```

  val rdd2 = sc.parallelize(Array(("Scala",11),("Scala",20),("PySpark",75), ("PySpark",35)))

  rdd2.lookup("PySpark")

  // 输出

  res66: Seq[Int] = WrappedArray(75, 35)

  ```


  另一个 PySpark 代码片段展示了相同的结果：


  ```

  rdd2 = spark.sparkContext.parallelize([("Scala",11),("Scala",20),("PySpark",75),
  ("PySpark",35)])

  rdd2.lookup("PySpark")

  # 输出

  [75, 35]

  ```


  ## 3.3 Spark 共享变量：广播变量与累加器


  所谓的共享变量是重要的 Spark 抽象概念。简单来说，共享变量是一种变量，你可以用它来在集群的工作节点之间，或者在驱动节点与工作节点之间交换信息。换句话说，这些变量旨在在整个集群中共享信息。


  大数据问题需要使用分布式系统。Apache Spark 集群就是这种分布式基础设施的一个例子，在该集群中，驱动节点和执行节点通常运行在独立且有时是远程的计算机上。


  在分布式计算中，你经常会面临在集群节点之间共享和同步信息的问题。例如，当你对数据集应用一个函数时，该函数及其变量会被复制到每个执行器。由于执行器中的计算是独立运行的，驱动节点无法获知这些变量中包含的数据的更新情况；因此，驱动节点无法追踪复制到远程节点的变量的变化。


  为了解决这个问题，Spark 提供了广播变量和累加器变量，作为在执行器之间以及执行器与驱动节点之间分发信息的一种方式，从而使驱动节点能够与某些关键变量中包含的值的变化保持同步。累加器用于写入数据，而广播变量用于读取数据。


  ### 广播变量


  广播变量是只读变量，它允许在每个集群节点中维护一个缓存的变量，而不是在每次将任务发送到执行器时都随任务一起传输该变量。因此，每个执行器都会保留广播变量的一个本地副本；这样一来，就不需要网络
  I/O 了。


  广播变量从驱动节点传输到执行器一次，然后由运行在这些执行器上的任务根据需要多次使用，从而最大限度地减少通过网络的数据移动，因为每次向执行器交付新任务时，该信息都不会再传输到执行器。


  在图 3-9 中，我们以图形方式说明了使用广播变量和普通变量与工作节点共享信息的区别。


  ![](img/538349_1_En_3_Fig9_HTML.jpg)


  该图表区分了广播变量和普通变量。左侧的数据链接到执行器的每个块，而右侧的数据则传输到执行器，然后映射任务。


  **图 3-9** 广播变量与普通变量的区别


  如果你查看图 3-9 的左侧，我们使用一个 map 操作将每个 RDD 元素乘以外部乘数变量。以这种方式操作时，乘数变量的一个副本将随每个任务一起分发到集群的每个执行器。


  另一方面，如果你查看图 3-9 的右侧，广播变量的单个副本会被传输到每个节点，并在其上运行的所有任务之间共享，因此有可能节省大量内存并减少网络流量。


  广播变量具有 `value()` 方法，用于存储数据并访问广播的信息。


  #### 何时使用广播变量


  在前面的章节中，我们使用了一个包含整数值变量的简单示例。但是，想象一个场景，其中外部变量包含数百万个元素。再想象一下，在同一执行器上运行的多个任务将使用同一个变量。这种情况意味着需要将变量数据连同要执行的任务一起复制到每个执行器。此操作将消耗相当一部分可用内存，并产生显著的额外网络流量。


  现在，让我们想象一个类似于“在 RDD 中按键添加值”一节中处理 DonQuixote 文本 RDD 的场景。设想一个更夸张的用例，其中我们的 map 函数在每个执行器中启动多个任务，并且所有这些任务都使用外部变量。在这种情况下，同一个变量的多个副本将被发送到每个执行器。


  在这些情况下，DonQuixoteRdd 文本文件必须与关联的任务一起复制到所有集群节点。在该节展示的代码片段中，我们将整个 DonQuixoteRdd 文本文件作为值传递给我们的函数。因此，在
  Spark 集群执行模式下工作时，将整个文本作为参数传递会带来严重的网络过载，因为它必须被复制到每个执行器节点。使用广播变量的优点之一是，Spark 广播的数据会以序列化形式缓存，并在每个执行器中运行任务之前进行反序列化。


  然而，只有当分布在集群节点上的任务需要相同的数据集，或者需要以反序列化格式缓存数据时，使用广播变量才有意义。在如前所述的情况下，广播变量将减少序列化任务的数量以及在集群中运行作业所需的网络流量开销。


  广播变量的一个限制是，当数据被广播到集群节点时，如果我们希望确保每个执行器都拥有完全相同的数据副本，则不应修改该数据。


  #### 如何创建广播变量


  可以使用 `SparkContext` 的 `broadcast` 方法来创建广播变量。让我们通过一个示例来看一下：


  ```

  // 用于广播变量的 Scala 代码

  val bVariable = sc.broadcast(Array(1, 2, 3, 4, 5, 6, 7, 8, 9))

  bVariable: org.apache.spark.broadcast.Broadcast[Array[Int]] = Broadcast(137)

  bVariable.value

  res70: Array[Int] = Array(1, 2, 3, 4, 5, 6, 7, 8, 9)

  ```


  ```

  # 用于广播变量的 Python 代码

  bVariable =  spark.sparkContext.broadcast([1, 2, 3, 4, 5, 6, 7, 8, 9])

  bVariable.value

  # 输出

  [1, 2, 3, 4, 5, 6, 7, 8, 9]

  ```




  ### 累加器


  累加器是用于在集群的执行器之间跟踪和更新信息的变量。累加器可用于实现计数器和求和，并且只能通过**结合律**和**交换律**操作进行“累加”。


  你可以在图 3-10 中看到累加器在执行器层面收集数据并将其传送到驱动节点的过程示意图。


  ![](img/538349_1_En_3_Fig10_HTML.jpg)


  一张包含四个代表执行器的方块的示意图，这些方块与驱动方块相连。驱动方块包含计数 4，而执行器方块包含累加器的一个副本和计数 1。


  图 3-10


  累加器操作


  累加器的一个重要特性是：执行器无法读取累加器的值，只能对其进行更新。累加器的值只能在驱动进程中读取。


  以下是使用 Scala 编写的代码片段：


  ```

  // Accumulator pyspark code snipped

  val rdd = spark.sparkContext.parallelize(Array(1, 2, 3, 4, 5))

  val acc = spark.sparkContext.longAccumulator("AddAccumulator")

  rdd.foreach(x => acc.add(x))

  print("Acc value: ", acc.value) //Value collected at the driver

  // Output

  (Acc value: ,15)

  ```


  以下是相同的代码片段，但这次是用 PySpark 编写的：


  ```

  # Accumulator pyspark code snipped

  acc = spark.sparkContext.accumulator(0)

  rdd = spark.sparkContext.parallelize([1,2,3,4,5])

  rdd.foreach(lambda x:acc.add(x))

  print("Acc value: ", acc.value) # Value collected at the driver

  # Output

  Acc value:  15

  ```


  总结一下，我们可以说，通过累加器变量，Apache Spark 提供了一种在执行器之间协调信息的方法；而通过广播变量，它提供了一种无需数据混洗即可在集群节点间优化共享相同信息的方法。


  ## 3.4 何时使用 RDD


  尽管通常认为，像数据帧（DataFrame）和数据集（Dataset）这样的高级 API 数据结构能让你更高效、更快速地工作，但在某些情况下你仍然需要使用 RDD。此外，正如我们之前所说，高级结构实际上正是构建在这些基础原语之上的。因此，理解它们的工作原理非常重要，因为当你使用数据帧或数据集时，Spark
  会在底层将它们转换为 RDD。因此，随着你的代码变得越来越复杂，了解 Spark RDD 编程的细微差别对于充分发挥其潜力至关重要。


  此外，还有一些场景会用到 RDD：


  *   当你需要对数据分区在集群中的物理分布进行底层控制时

  *   当你需要底层转换和操作时

  *   当你需要进行高级 API 中不可用的自定义操作时

  *   当不再需要通过名称或列来访问数据属性，因此不必严格为数据施加模式时

  *   当你需要维护使用 RDD 编写的遗留代码时


  总而言之，我们可以说 RDD 让你对代码拥有更精细的控制。


  ## 3.5 本章小结


  在本章中，我们简要探讨了 Spark 底层 API 的概念，以及 Spark 弹性分布式数据集（RDD）作为 Spark 构建块的概念，这些构建块用于构建其他具有更高技术隔离级别的
  Spark 数据结构，如 DataFrame 和 Dataset。我们还介绍了使用 RDD 可以执行的最基本操作，最后解释了所谓的 Spark 共享变量：广播变量和累加器。在下一章中，我们将重点介绍
  Spark 高级 API 以及如何在大数据世界中应用它。


  '
- '# 4. Spark 高级 API


  Spark SQL、数据帧和数据集是 Spark 高级 API 的组成部分，旨在处理结构化数据，使 Spark 能够自动提升存储和计算性能。结构化数据是组织成标准化模式结构的信息，这使得它无需进一步处理即可访问和分析。结构化数据的示例包括数据库表、Excel
  表格、关系型数据库管理系统（RDBMS）表、Parquet 文件等。


  Spark 的高级 API 允许优化处理特定类型数据（例如二进制格式文件）的应用程序，其优化程度超出了 Spark RDD 所允许的限制。例如，数据帧和数据集利用
  Spark SQL 的 Catalyst 优化器和 Spark Project Tungsten（本章后面会介绍）来优化其性能。


  数据集 API 与数据帧 API 之间最重要的区别可能在于：数据集在编译时实现了类型安全。数据集在编译时强制执行类型安全，而数据帧则不会。Spark 在运行时验证数据帧的数据类型是否符合其模式中定义的类型，而数据集的数据类型则在编译时进行验证。我们将在本章后面详细讨论编译时类型安全的概念。




  ## 4.1 Spark 数据框


  DataFrame 于 Spark 1.3 中引入，旨在提升 Spark 的性能和可扩展性。DataFrame API 引入了模式（schema）的概念来描述数据结构，使得
  Spark 能够以更高效的方式在节点间移动数据，从而优化洗牌（shuffle）操作。从视觉上看，数据框类似于关系型数据库表或电子表格，如下例所示：


  ```

  +--------+-----------------+-------------------+----+----+

  |  Nombre|  Primer_Apellido|   Segundo_Apellido|Edad|Sexo|

  +--------+-----------------+-------------------+----+----+

  |  Miguel|     de Cervantes|           Saavedra|  50|   M|

  |Fancisco|          Quevedo|Santibáñez Villegas|  55|   M|

  |    Luis|       de Góngora|           y Argote|  65|   M|

  |  Teresa|Sánchez de Cepeda|          y Ahumada|  70|   F|

  +--------+-----------------+-------------------+----+----+

  ```


  然而，从技术角度来看，DataFrame 是一种无类型数据集的视图。换句话说，DataFrame 是一个按列组织并带有列名的数据集。在 Scala 和 Java
  中，DataFrame 可以被视为类型为 `Row`（`Dataset[Row]`）的无类型数据集，其中 `Row` 代表一个无类型的 JVM 对象。它们是按不同数据类型的命名列组织的数据行集合，并形成一个模式，如下所示：


  ```

  root

  |-- Nombre: string (nullable = true)

  |-- Primer_Apellido: string (nullable = true)

  |-- Segundo_Apellido: string (nullable = true)

  |-- Edad: integer (nullable = true)

  |-- Sexo: string (nullable = true)

  ```


  如上述模式所示，每个数据框列都包含一组属性，例如名称、数据类型和一个可为空标志，该标志表示该列是否接受空值。


  DataFrame API 是 Spark SQL 模块的一个组件，可用于所有编程语言，如 Java、Python、SparkR 和 Scala。与 RDD 不同，数据框提供自动优化，但与前者不同，它们不提供编译时类型安全。这意味着，虽然使用
  RDD 和数据集时编译器知道列的数据类型（字符串、整数、`StructType` 等），但当您使用数据框时，操作返回的值是未定义数据类型的行数组。例如，您可以使用
  Scala 的 `asInstanceOf()` 或 PySpark 的 `cast()` 方法将返回的值转换为特定类型。


  让我们通过三个实际示例来分析类型安全的实现如何影响 Spark 应用程序的行为。


  为此，我们将使用一个包含三位有史以来最杰出的西班牙作家的小型数据集。首先，我们将展示类型安全如何影响在过滤或映射函数中使用 lambda 表达式。以下是代码片段。


  首先，我们创建一个样例类 `SpanishWritersDataFrame APISpanishWriters`，包含四个个人作家属性：


  ```

  //spark.sparkContext.implicits._ 授予对 toDF() 方法的访问权限

  import spark.sqlContext.implicits._

  case class SpanishWriters(Nombre: String, Apellido: String, Edad: Int, Sexo:String)

  ```


  对于此示例，我们创建一个西班牙作家的小型数据集：


  ```

  val SpanishWritersData = Seq(SpanishWriters("Miguel", "Cervantes", 50, "M"), SpanishWriters("Fancisco",
  "Quevedo", 55, "M"), SpanishWriters("Luis", "Góngora", 65, "M"))

  ```


  下一步，我们从上述数据集创建一个 RDD：


  ```

  val SpanishWritersRDD = spark.sparkContext.parallelize(SpanishWritersData)

  ```


  现在，我们分别使用 `toDF()` 和 `toDS()` 创建一个数据框和一个数据集：


  ```

  val writersDF = SpanishWritersRDD.toDF()

  val writersDS = SpanishWritersRDD.toDS()

  ```


  现在，我们将看到在使用 lambda 函数过滤数据时，这些数据实体之间的差异：


  ```

  // 数据框

  val writersDFResult = writersDF.filter(writer => writer.Edad > 53)

  // 输出

  error: value Edad is not a member of org.apache.spark.sql.Row val writersDFResult
  = writersDF.filter(writer => writer.Edad > 53)

  ^

  //数据集

  val writersDSResult = writersDS.filter(writer => writer.Edad > 53)

  // 输出

  writersDSResult: org.apache.spark.sql.Dataset[SpanishWriters] = [Nombre: string,
  Apellido: string ... 2 more fields]

  ```


  请注意，在两种数据结构中过滤信息时得到的不同输出。当我们对数据框应用过滤时，实现的 lambda 函数返回的是一个 `Row` 类型的对象，而不是您可能期望的整数值，因此它不能用于与整数（本例中为
  53）进行比较。因此，仅使用列名，我们无法检索编码为 `Row` 对象的值。要获取 `Row` 对象的值，您必须将返回的值类型转换为整数。因此，我们需要将代码修改如下：


  ```

  val writersDFResult = writersDF2.filter(writer => writer.getAsInt > 53)

  writersDFResult.show()

  // 输出

  +--------+--------+----+----+

  |  Nombre|Apellido|Edad|Sexo|

  +--------+--------+----+----+

  |Fancisco| Quevedo|  55|   M|

  |    Luis| Góngora|  65|   M|

  +--------+--------+----+----+

  ```


  前面的示例展示了引入数据集的原因之一。开发人员无需事先知道返回的数据类型。


  编译时类型安全的另一个示例出现在我们查询一个不存在的列时：


  ```

  // 数据框

  val writersDFBirthday = writersDF.select("Birthday")

  // 输出

  rg.apache.spark.sql.AnalysisException: Column ''Birthday'' does not exist. Did you
  mean one of the following? [Edad, Apellido, Nombre, Sexo];

  // 数据集

  val writersDSBirthday = writersDS.map(writer => writer.Birthday)

  // 输出

  error: value Birthday is not a member of SpanishWriters

  val writersDSBirthday = writersDS.map(writer => writer.Birthday)

  ^

  ```


  在前面的示例中，您可以看到执行时（数据框）和编译时（数据集）之间的区别。前者仅在运行时抛出错误，而后者会在编译时给您一个错误消息。


  另一个我们会发现 DataFrames 和数据集行为不同的情况是当我们想将它们恢复为原始的 RDD 时。在这种情况下，数据框恢复到 RDD 不会保留数据模式，而数据集恢复则会。让我们再次通过一个示例来看一下：


  ```

  // 数据框恢复到 RDD

  val rddFromDF = writersDF.rdd

  // 输出

  rddFromDF: org.apache.spark.rdd.RDD[org.apache.spark.sql.Row] = MapPartitionsRDD[249]
  at rdd at :75

  ```


  然而，我们将无法正常使用这个恢复后的 RDD，因为实际上恢复返回的是一个 `Row` 类型的 RDD。让我们使用一个简单的操作来看看结果：


  ```

  rddFromDF.map(writer => writer.Nombre).foreach(println)

  // 输出

  error: value Nombre is not a member of org.apache.spark.sql.Row

  ```


  现在，我们将执行相同的操作，但这次使用我们的数据集：


  ```

  // 数据集恢复到 RDD

  val rddFromDS = writersDS.rdd

  // 输出

  rddFromDS: org.apache.spark.rdd.RDD[SpanishWriters] = MapPartitionsRDD[252] at rdd
  at

  ```


  恢复返回的是一个真正的 RDD，因此我们可以正常使用它：


  ```

  rddFromDS.map(writer => writer.Nombre).foreach(println)

  // 输出

  Luis

  Fancisco

  Miguel

  ```


  这证明了数据集在恢复到 RDD 时会保留数据模式。




  ### Spark DataFrame 的属性


  与其他 Apache Spark 模块一样，`DataFrames` 从诞生之初就是为了尽可能高效地处理大数据项目而创建的。因此，Spark `DataFrames`
  支持分布在集群的各个节点上，充分利用 Spark 的分布式计算架构。发送给 `DataFrames` 的用户 SQL 查询和命令由 `Catalyst Optimizer`
  管理，它负责查找并构建能够更高效地实现请求结果的查询执行计划。


  Spark `DataFrames` 包含许多重要特性。其中之一是能够从外部源创建数据框——这在现实生活中非常有用，因为大多数时候数据会以文件、数据库等形式提供。图
  4-1 展示了 Spark 原生支持加载到 `DataFrames` 中的外部文件格式示例。


  ![](img/538349_1_En_4_Fig1_HTML.jpg)


  一个示意图展示了数据流，涉及 Hive 表、CSV 文件、JSON 文件、XML 文件、Parquet 文件、RDBMS 数据、Cassandra 数据、RDDs
  数据，这些数据连接到 Apache Spark SQL，并指向一个包含从 1 到 N 的列和行的表。


  图 4-1


  一些 Spark 原生支持的用于将数据加载到 `DataFrames` 中的格式


  `DataFrames` 的另一个重要特性是它们能够处理海量数据，从兆字节到拍字节不等。因此，Spark `DataFrames` 允许进行大规模数据管理。


  ### 创建 Spark DataFrame 的方法


  `DataFrames` 可以通过多种不同的方式构建，例如手动创建、从外部关系数据库（MySQL、PostgreSQL、Oracle 等）或结构化数据文件（CSV、Excel
  电子表格、Parquet、JSON 等）创建、从 NoSQL 数据库（Hive 表、Cassandra、HBase 或 MongoDB）创建，或者从已有的 RDDs
  和二进制文件创建。


  Spark 提供了两种手动构建 `DataFrames` 的方法：`toDF()` 和 `createDataFrame()`。利用这些方法，你可以从其他已有的
  `DataFrames`、RDDs、数据集、列表和序列中创建新的 `DataFrames`。


  尽管这两种方法非常相似，但它们之间有一些重要的区别。


  #### 使用 `toDF()` 手动创建 Spark DataFrame


  要使用 `toDF()`，我们首先需要导入 Spark 的 `sqlContext.implicits._` 库，以获得一个隐式方法将 RDD 转换为 DataFrame。让我们看看如何使用
  `toDF()` 将 RDD 转换为 DataFrame：


  ```

  val carsData=Seq(("USA","Chrysler","Chrysler 300",292),("Germany","BMW","BMW 8 Series",617),("Spain",
  "Spania GTA", "GTA Spano",925))

  val carsRdd = spark.sparkContext.parallelize(carsData) // Seq 转 RDD

  val dfCars = carsRdd.toDF() // RDD 转 DF

  dfCars.show()

  // 输出

  +-------+----------+------------+---+

  |     _1|        _2|          _3| _4|

  +-------+----------+------------+---+

  |    USA|  Chrysler|Chrysler 300|292|

  |Germany|       BMW|BMW 8 Series|617|

  |  Spain|Spania GTA|   GTA Spano|925|

  +-------+----------+------------+---+

  ```


  默认情况下，`toDF()` 会将序列 “_1”、“_2”、“_3”、“_4” 等分配为列名，并尝试推断数据类型（字符串和整数），并将除数字列外的所有列标记为可为空。你可以通过打印
  `dfCars` 数据框的模式来看到这种行为：


  ```

  dfCars.printSchema()

  // 输出

  root

  |-- _1: string (nullable = true)

  |-- _2: string (nullable = true)

  |-- _3: string (nullable = true)

  |-- _4: integer (nullable = false)

  ```


  `toDF()` 方法接受不定数量的参数作为列名：`df.toDF(''col1'', ''col2'', ..., ''colN'')`，如下所示：


  ```

  val dfBrandedCars = carsRdd.toDF("Country","Manufacturer","Model","Power" )

  dfBrandedCars.show()

  // 输出

  +-------+------------+------------+-----+

  |Country|Manufacturer|       Model|Power|

  +-------+------------+------------+-----+

  |    USA|    Chrysler|Chrysler 300|  292|

  |Germany|         BMW|BMW 8 Series|  617|

  |  Spain|  Spania GTA|   GTA Spano|  925|

  +-------+------------+------------+-----+

  ```


  从前面的例子中我们得出的结论是，使用 `toDF()` 我们无法控制数据框的模式。这意味着我们无法控制列类型和可为空标志。


  #### 使用 `createDataFrame()` 手动创建 Spark DataFrame


  我们可以利用 `createDataFrame()` 方法以两种形式构建 `DataFrames`。第一种是将其与 `toDF()` 结合使用，同时将 RDD
  作为参数。让我们通过一个例子来展示它是如何工作的：


  ```

  var df2 = spark.createDataFrame(carsData) \

  .toDF("Country","Manufacturer","Model","Power")

  df2.show()

  // 输出

  +-------+------------+------------+-----+

  |Country|Manufacturer|       Model|Power|

  +-------+------------+------------+-----+

  |    USA|    Chrysler|Chrysler 300|  292|

  |Germany|         BMW|BMW 8 Series|  617|

  |  Spain|  Spania GTA|   GTA Spano|  925|

  +-------+------------+------------+-----+

  ```


  第二种方式是我们可以使用 `createDataFrame()` 来创建一个数据框并释放其真正的威力，允许我们完全自定义自己的 DataFrame 模式。通过以下示例中引入模式定义，你可以很好地理解
  `createDataFrame()` 的工作原理：


  ```

  import org.apache.spark.sql.Row

  import org.apache.spark.sql.types.{IntegerType,StringType, StructField, StructType}

  // 首先，我们为 carsData 数据集创建一个模式。

  val carSchema = StructType( Array(

  StructField("Country", StringType,true),

  StructField("Manufacturer", StringType,true),

  StructField("Model", StringType,true),

  StructField("Power", IntegerType,true)

  ))

  // 注意，这里我们使用的是前面示例中展示的 carsRdd RDD

  val carsRowRdd = carsRdd.map(carSpecs => Row(carSpecs._1, carSpecs._2, carSpecs._3,
  carSpecs._4))

  val dfCarsFromRDD = spark.createDataFrame(carsRowRdd,carSchema)

  dfCarsFromRDD.show()

  // 输出

  +-------+------------+------------+-----+

  |Country|Manufacturer|       Model|Power|

  +-------+------------+------------+-----+

  |    USA|    Chrysler|Chrysler 300|  292|

  |Germany|         BMW|BMW 8 Series|  617|

  |  Spain|  Spania GTA|   GTA Spano|  925|

  +-------+------------+------------+-----+

  ```


  总而言之，我们可以说，虽然 `toDF()` 和 `createDataFrame()` 方法都可以用来创建 `DataFrames`，但前者会推断数据模式，而后者则让你能够完全自定义控制
  DataFrame 的模式。




  '
- '# 创建 Spark DataFrame 的数据源


  Spark SQL 通过 DataFrame 接口支持多种数据源。DataFrame 可以通过两种不同的方式操作。第一种是直接使用我们在前几章已经见过的关系型转换。第二种是通过从
  DataFrame 创建临时视图。第二种方法允许你对数据运行 SQL 查询，就像查询传统的关系型数据库管理系统一样。


  `Parquet` 是 Spark 在输入/输出操作中期望使用的默认数据源。这个默认格式可以通过 `spark.sql.sources.default` 属性名称进行设置。


  让我们通过一个例子来看一下。尝试使用 `load()` 方法加载一个 CSV 文件：


  ```

  val personasDF = spark.read.load("/Users/aantolinez/Downloads/personas.csv")

  ```


  你会收到以下错误信息：


  ```

  Caused by: java.lang.RuntimeException: file:/Users/aantolinez/Downloads/personas.csv
  is not a Parquet file. Expected magic number at tail, but found [48, 44, 70, 10]

  ```


  然而，如果你加载一个 Parquet 文件：


  ```

  val personasDF = spark.read.load("/Users/aantolinez/Downloads/personas.parquet")

  ```


  一切顺利：


  ```

  personasDF: org.apache.spark.sql.DataFrame = [Nombre: string, Primer_Apellido: string
  ... 3 more fields]

  ```


  如果你使用 PySpark 代码，情况完全相同：


  ```

  personasDF = spark.read.load("/Users/aantolinez/Downloads/personas.csv")

  // 输出

  Caused by: java.lang.RuntimeException: file:/Users/aantolinez/Downloads/personas.csv
  is not a Parquet file. Expected magic number at tail, but found [48, 44, 70, 10]

  ```


  而使用 Parquet 格式文件时，一切正常：


  ```

  personasDF = spark.read.load("/Users/aantolinez/Downloads/personas.parquet")

  personasDF.show(1)

  # 输出

  +------+---------------+----------------+----+----+

  |Nombre|Primer_Apellido|Segundo_Apellido|Edad|Sexo|

  +------+---------------+----------------+----+----+

  |Miguel|   de Cervantes|        Saavedra|  50|   M|

  +------+---------------+----------------+----+----+

  ```


  ### 使用 SQL 查询文件


  有时直接查询数据文件而不是先将其加载到 DataFrame 中可能会很有用。Spark 允许你通过以下方式实现，在 Scala 和 PySpark 中使用相同的代码并获得相同的结果：


  ```

  spark.sql("SELECT * FROM parquet.`/Users/aantolinez/Downloads/personas.parquet`").show()

  // Scala 和 PySpark 输出

  +--------+-----------------+-------------------+----+----+

  |  Nombre|  Primer_Apellido|   Segundo_Apellido|Edad|Sexo|

  +--------+-----------------+-------------------+----+----+

  |  Miguel|     de Cervantes|           Saavedra|  50|   M|

  |Fancisco|          Quevedo|Santibáñez Villegas|  55|   M|

  |    Luis|       de Góngora|           y Argote|  65|   M|

  |  Teresa|Sánchez de Cepeda|          y Ahumada|  70|   F|

  +--------+-----------------+-------------------+----+----+

  ```


  ### 忽略损坏和缺失的文件


  Spark 提供了 `spark.sql.files.ignoreCorruptFiles` 方法来忽略损坏的文件，以及 `spark.sql.files.ignoreMissingFiles`
  方法来忽略从文件系统读取文件时缺失的文件。对于前者，当设置为 `true` 时，Spark 作业在发现损坏文件时不会崩溃，并且仍会返回已读取的内容。后者意味着当文件缺失时，Spark
  作业不会失败，并且与前面的方法一样，仍会返回已读取的数据。在此上下文中，缺失文件是指在应用 DataFrame 转换后被删除的文件。


  我们将通过一个例子来了解这个 Spark 特性：


  ```

  // 启用忽略损坏文件

  spark.sql("set spark.sql.files.ignoreCorruptFiles=true")

  // personas_corrupt.parquet 不是真正的 parquet 文件

  val corruptFiles = spark.read.parquet(

  "/Users/aantolinez/Downloads/personas.parquet",

  "/Users/aantolinez/Downloads/personas_corrupt.parquet")

  corruptFiles.show()

  ```


  ### 基于时间的路径


  Spark 提供了 `modifiedBefore` 和 `modifiedAfter` 选项，用于在查询时对应加载的文件进行时间控制。


  `modifiedBefore` 接受一个时间戳作为参数，指示 Spark 仅读取修改时间早于给定时间的文件。类似地，`modifiedAfter` 也接受一个时间戳作为参数，但这次是命令
  Spark 仅加载修改时间晚于给定时间的文件。在这两种情况下，时间戳必须采用以下格式：`YYYY-MM-DDTHH:mm:ss`（例如 `2022-10-29T20:30:50`）。


  让我们通过一个 Scala 示例，然后是 PySpark 示例，来看看这个 Spark 行为：


  ```

  val modifiedAfterDF = spark.read.format("csv")

  .option("header", "true")

  .option("modifiedAfter", "2022-10-30T05:30:00")

  .load("/Users/aantolinez/Downloads/Hands-On-Spark3");

  modifiedAfterDF.show();

  ```


  我们可以使用 PySpark 代码获得相同的结果，如下所示：


  ```

  modifiedAfterDF = spark.read.format("csv") \

  .option("header", "true") \

  .option("modifiedAfter", "2022-10-30T05:30:00") \

  .load("/Users/aantolinez/Downloads/Hands-On-Spark3");

  modifiedAfterDF.show();

  ```


  两种情况的输出将相同：


  ```

  +--------+-----------------+-------------------+----+----+

  |  Nombre|  Primer_Apellido|   Segundo_Apellido|Edad|Sexo|

  +--------+-----------------+-------------------+----+----+

  |  Miguel|     de Cervantes|           Saavedra|  50|   M|

  |Fancisco|          Quevedo|Santibáñez Villegas|  55|   M|

  |    Luis|       de Góngora|           y Argote|  65|   M|

  |  Teresa|Sánchez de Cepeda|          y Ahumada|  70|   F|

  +--------+-----------------+-------------------+----+----+

  ```


  这两个选项都支持通过 `spark.sql.session.timeZone` 指定时区；在这种情况下，时间戳将引用给定的时区。




  ### 指定保存选项


  我们之前提到过，Spark 的默认数据源是 Parquet 格式；然而，Spark 也允许与许多其他数据源进行交互，例如 JSON、ORC、CSV 和文本文件，以及
  Hive 表、Cassandra 等，还有 JDBC 数据源。


  这个庞大的数据源生态系统以及 Spark 在不同格式之间转换数据的能力，使得 Spark 能够被用作一个高效的 ETL^(⁶) 工具。Spark 可以从上述数据源加载数据，进行转换，然后以指定的格式和存储库进行保存。有四种保存模式，如表
  4-1 所示。


  **表 4-1** 保存模式


  | 在 Scala 和 Java 中 | 在任何语言中 | 含义 |

  | --- | --- | --- |

  | `SaveMode.ErrorIfExists`（默认） | `"error"` 或 `"errorifexists"`（默认） | 如果保存 DataFrame
  时目标位置已存在数据，则抛出异常。 |

  | `SaveMode.Append` | `"append"` | 数据被追加到目标数据/表中。 |

  | `SaveMode.Overwrite` | `"overwrite"` | 如果目标位置已存在数据/表，则覆盖它。 |

  | `SaveMode.Ignore` | `"ignore"` | 其工作方式类似于 SQL 的 `CREATE TABLE IF NOT EXISTS`。如果目标位置已存在数据，则忽略该操作。
  |


  让我们通过一个示例来看看 Spark 的保存模式是如何工作的：


  ```

  val SpanishDf = spark.read.option("header", "true")

  .option("inferSchema", "true")

  .csv("/Users/aantolinez/Downloads/personas.csv")

  // 写入第一个 DataFrame

  SpanishDf.write.format("csv").mode("overwrite")

  .option("header", true)

  .save("/Users/aantolinez/Downloads/personas2.csv")

  // 添加一些数据以追加到之前保存的 DataFrame

  val SpanishWritersData2 = Seq(("Miguel", "de Unamuno", 70, "M"))

  val SpanishWritersRdd = spark.sparkContext.parallelize(SpanishWritersData2)

  val SpanishWritersAppendDF = SpanishWritersRdd.toDF()

  // 将新数据追加到之前保存的数据中

  SpanishWritersAppendDF.write.format("csv").mode("append").save("/Users/aantolinez/Downloads/personas2.csv")

  ```


  现在，如果你查看图 4-2 中保存的数据，你会看到一些令人惊讶的东西。


  ![](img/538349_1_En_4_Fig2_HTML.png)


  一段代码片段显示了关于文件 `personas2.csv` 的信息。它显示了文件的大小、权限、修改日期，以及同一目录下的其他相关文件及其属性。它突出显示了 `_SUCCESS`
  以及文件名 `.crc` 和 `.csv`。


  **图 4-2** Spark 保存的数据


  原因如下。默认情况下，Spark 会将 DataFrame、数据集或 RDD 保存到一个以指定名称命名的文件夹中，并将内容写入该文件夹内的多个 part 文件（每个分区一个
  part 文件），这些文件具有指定的格式扩展名。正如你在前面的输出中所看到的，Spark 还会为每个分区写入一个 `_SUCCESS` 文件和一个 `.crc`
  文件。


  如果出于某种原因，你需要将数据合并到一个文件中，并去掉文件夹和附带文件，你只能轻松实现你的第一个愿望。


  如前所述，Spark 会为每个分区创建一个文件。因此，获取单个文件的一种方法是使用 `coalesce()` 和/或 `repartition()` 方法将所有经过
  shuffle 的数据合并到一个分区中。


  ### 注意


  在处理大量数据时，请谨慎使用 `coalesce()` 和/或 `repartition()` 方法，因为这可能会使驱动程序内存过载，并导致 OutOfMemory
  问题。


  让我们通过一个适用于 Scala 和 PySpark 的简单示例来看看如何获取单个文件：


  ```

  SpanishWritersAppendDF.coalesce(1)

  .write.csv("/Users/aantolinez/Downloads/personas_coalesce.csv")

  ```


  现在，当你查看上述代码的输出（图 4-3）时，你可以看到一个单一的 CSV 文件；然而，文件夹、`_SUCCESS` 文件和 `.crc` 隐藏文件仍然存在。


  ![](img/538349_1_En_4_Fig3_HTML.jpg)


  一段代码片段显示了关于文件 `personas_coalesce.csv` 的信息。它显示了文件的大小、权限、修改日期，以及同一目录下的其他相关文件及其属性。


  **图 4-3** Spark 保存到单个文件


  要进行进一步优化，例如移除文件夹以及 `_SUCCESS` 和 `.crc` 隐藏文件，你将需要使用 Hadoop 文件系统库来操作最终的输出。


  ### 读取和写入 Apache Parquet 文件


  Apache Parquet 是一种免费、开源、列式且自描述的**文件格式**，专为快速分析查询而设计。Apache Parquet 在现代数据湖中扮演着重要角色，因为它能够跳过不相关的数据，从而实现对大型数据集的高效查询。


  Parquet 列式存储的一些优势如下：


  ![](img/538349_1_En_4_Fig4_HTML.jpg)


  三个表格展示了垂直分区 y, y1, y2, y3, y4，加上水平分区 x, y, z, x2, y2, z2, x3, y3, z3 的数据，相当于扫描 x,
  y 和 z 的最小数据量。Y, y2 和 y3 被着色。


  **图 4-4** Parquet 数据分区


  *   **列式存储**：Parquet 是一种面向列的格式。在 Parquet 文件中，数据按列存储，这意味着每列的值彼此相邻存储，便于访问，从而提升查询性能。


  *   **自描述**：Parquet 文件将数据本身与数据模式和结构结合在一起。这种结合简化了用于读取、存储和写入 Parquet 文件的工具的开发。


  *   **压缩**：在 Parquet 文件中，数据压缩是逐列进行的，并且包含灵活的压缩选项，例如每种数据类型可扩展的编码模式。这意味着我们可以根据数据类型（`long`、`string`、`date`
  等）使用不同的压缩编码，从而优化压缩效果。


  *   **性能**：Parquet 格式专为查询性能而设计。Parquet 的内部格式结构（这超出了本书的范围）由行组、头部和尾部组成，它最大限度地减少了读取的数据量，从而减少了磁盘
  I/O。将 Parquet 与 CSV 文件进行比较，后者必须完整读取并加载到内存中，而前者只允许读取回答我们问题所需的相关列。Parquet 格式允许检索最少的数据，实现了行组和列块（column
  chunks）的垂直和水平分区，如图 4-4 所示。列块也被组织成包含元数据信息的数据页。




  ### 将 DataFrame 保存并压缩为 Parquet 文件格式


  `parquet()` 方法允许将 Spark DataFrame 保存为 Parquet 文件格式。默认情况下，此方法使用 `snappy` 压缩编解码器：


  ```

  import org.apache.spark.sql.types.{StringType, StructType, IntegerType}

  val schemaWriters = new StructType()

  .add("Name",StringType,true)

  .add("Surname",StringType,true)

  .add("Century",StringType,true)

  .add("YearOfBirth",IntegerType,true)

  val SpanishWritersDf = spark.read.option("header", "true")

  .schema(schemaWriters)

  .csv("/Users/aantolinez/Downloads/Spanish_Writers_by_Century.csv")

  // 使用默认压缩编解码器保存数据：snappy

  SpanishWritersDf.write.parquet("/Users/aantolinez/Downloads/Spanish_Writers_by_Century.parquet")

  Spanish_Writers_by_Century.parquet:

  _SUCCESS    part-00000-e4385fd4-fcc0-4a5c-8632-d0080438fa82-c000.gz.parquet

  ```


  压缩编解码器可以设置为 `none`、`uncompressed`、`snappy`、`gzip`、`lzo`、`brotli`、`lz4` 和 `zstd`，这会覆盖
  `spark.sql.parquet.compression.codec` 配置。可以使用 `append` 选项将数据追加到 Parquet 文件中：


  ```

  // 使用 gzip 压缩编解码器选项保存数据

  SpanishWritersDf.write.mode("append").option("compression", "gzip").parquet("/Users/aantolinez/Downloads/Spanish_Writers_by_Century.parquet")

  ```


  如下所示，可以组合使用多种压缩编解码器：


  ```

  Spanish_Writers_by_Century.parquet:

  _SUCCESS    part-00000-e4385fd4-fcc0-4a5c-8632-d0080438fa82-c000.gz.parquet

  part-00000-d070dd4d-86ca-476f-8e67-060365db7ca7-c000.snappy.parquet

  ```


  使用 PySpark 代码也可以获得相同的结果：


  ```

  from pyspark.sql.types import StructField, StringType, StructType, IntegerType

  schemaWriters = StructType([

  StructField("Name",StringType(),True),

  StructField("Surname",StringType(),True),

  StructField("Century",StringType(),True),

