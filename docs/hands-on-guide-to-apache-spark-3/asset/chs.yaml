  ```\n\n正如我们对滚动窗口所做的那样，你可以修改之前的代码片段如下：\n\n```\nval PatientDF = PatientDS\n.groupBy(window(col(\"\
  Fecha\"), \"10 seconds\", \"5 seconds\"))\n.agg(count(\"DID\").alias(\"Suma_x_Dpt\"\
  ))\n.select(\"window.start\", \"window.end\", \"Suma_x_Dpt\")\n```\n\n将窗口时间数据分离到两个不同的列中。\n\
  \n与滚动窗口示例类似，你将得到如下所示的输出：\n\n```\nListening and ready...\n\nBatch: 0\n\n+-------------------+-------------------+----------+\n\
