  \n### 在 Windows 上安装 Apache Spark\n\n在本节中，我将向您展示如何在 Windows 10 上安装 Apache Spark 并测试安装。需要注意的是，执行此安装时，您必须拥有具有管理员权限的用户账户。这是安装软件和修改系统\
  \ `PATH` 所必需的。\n\n#### 步骤 1：安装 Java\n\n与上一节相同，您首先需要确保已安装 Java 并且 Apache Spark 可以访问它。您可以通过点击“开始”，输入\
  \ `cmd`，然后点击“命令提示符”，在命令行中验证 Java 是否已安装。接着，在命令行中输入以下命令：\n\n```\njava -version\n```\n\
  \n如果 Java 已安装，您将看到类似以下的输出：\n\n```\nopenjdk version \"18.0.2.1\" 2022-08-18\nOpenJDK\
  \ Runtime Environment (build 18.0.2.1+1-1)\nOpenJDK 64-Bit Server VM (build 18.0.2.1+1-1,\
  \ mixed mode, sharing)\n```\n\n如果系统提示命令未知，则表示 Java 未安装或不可用。此时您需要按照以下步骤操作。\n\n安装\
  \ Java。本例中我们将使用 [OpenJDK](https://openjdk.org/install/) 作为 Java 虚拟机。您需要下载与您的操作系统版本和硬件相匹配的二进制文件。在本教程中，我们将使用\
  \ OpenJDK JDK 18.0.2.1，因此我下载了 `openjdk-18.0.2.1_windows-x64_bin.zip` 文件。您也可以使用其他\
  \ [Java 发行版](https://www.java.com/en/download/)。\n\n下载文件，保存，并将其解压到您选择的目录中。您可以使用任何解压工具来完成此操作。\n\
  \n#### 步骤 2：下载 Apache Spark\n\n打开网页浏览器，导航至 [Spark 下载页面](https://spark.apache.org/downloads.html)，并按照图\
  \ 2-1 中给出的相同说明操作。\n\n要解压 `spark-3.3.0-bin-hadoop3.tgz` 文件，您需要一个能够提取 `.tgz` 文件的工具。例如，您可以使用\
  \ [7-Zip](https://www.7-zip.org/) 等免费工具。\n\n验证文件完整性。确认下载文件的校验和始终是一个好习惯，以确保您使用的是未经修改、未损坏的软件。在\
  \ Spark 下载页面，打开 [校验和链接](https://downloads.apache.org/spark/spark-3.3.0/spark-3.3.0-bin-hadoop3.tgz.sha512)，并复制或记住（如果您能记住）文件的签名。它应该类似于以下内容（字符串不完整）：\n\
  \n```\n1e8234d0c1d2ab4462 ... a2575c29c    spark-3.3.0-bin-hadoop3.tgz\n```\n\n\
  接下来，打开命令行并输入以下命令：\n\n```\ncertutil -hashfile PATH\\TO\\spark-3.3.0-bin-hadoop3.tgz\
  \ SHA512\n```\n\n您必须看到之前复制的相同签名；如果没有，则说明有问题。请尝试重新下载文件来解决。\n\n#### 步骤 3：安装 Apache\
  \ Spark\n\n安装 Apache Spark 只需将下载的文件解压到您选择的位置，例如 `C:\\spark` 或其他任何位置。\n\n#### 步骤\
  \ 4：下载 Hadoop 的 winutils 文件\n\n创建一个名为 `Hadoop` 的文件夹和一个 `bin` 子文件夹，例如 `C:\\hadoop\\\
  bin`，然后将与您之前下载的 Hadoop 3 版本对应的 `winutils.exe` 文件下载到该目录中。\n\n\n\n### 第 5 步：配置系统与环境变量\n\
  \n在 Windows 中配置环境变量，意味着要将 Spark 和 Hadoop 的位置添加到系统环境及`PATH`中，从而使任何应用程序都能访问它们。\n\n\
  你需要进入控制面板 ➤ 系统和安全 ➤ 系统。然后点击“高级系统设置”，如图 2-4 所示。\n\n![](img/538349_1_En_2_Fig4_HTML.jpg)\n\
  \n系统设置窗口的截图。左侧面板中的“高级系统设置”选项已被选中。右侧部分包括 Windows 版本、系统、计算机名、域和工作组设置，以及 Windows 激活信息。\n\
  \n图 2-4\n\nWindows 高级系统设置\n\n系统会弹出“系统属性”对话框，如图 2-5 左侧所示：\n\n![](img/538349_1_En_2_Fig6_HTML.jpg)\n\
  \n“环境变量”和“编辑环境变量”窗口的两个截图。左侧的路径字段被高亮显示，右侧的“新建”按钮被高亮显示。\n\n图 2-6\n\n将变量添加到`PATH`\n\
  \n![](img/538349_1_En_2_Fig5_HTML.jpg)\n\n系统属性、环境变量和新建用户变量窗口的三个截图。在“系统属性”对话框中，“环境变量”按钮被选中。接着，在“环境变量”对话框中，“新建”按钮被选中。这会打开一个“新建用户变量”对话框。\n\
  \n图 2-5\n\n环境变量\n\n1.  点击“环境变量”按钮。\n2.  出现“环境变量”窗口，如图 2-5 右上角所示：\n    1.  点击“新建”按钮。\n\
  3.  插入以下变量：\n    1.  `JAVA_HOME`：`\\PATH\\TO\\YOUR\\JAVA-DIRECTORY`\n    2.  `SPARK_HOME`：`\\\
  PATH\\TO\\YOUR\\SPARK-DIRECTORY`\n    3.  `HADOOP_HOME`：`\\PATH\\TO\\YOUR\\HADOOP-DIRECTORY`\n\
  \n你需要重复上一步两次，以引入这三个变量。\n\n4.  点击“确定”按钮保存更改。\n5.  然后，点击你的“编辑”按钮，如图 2-6 左侧所示，来编辑你的`PATH`。\n\
  6.  之后，点击“新建”按钮，如图 2-6 右侧所示。\n\n并将这些新变量添加到`PATH`中：\n    1.  `%JAVA_HOME%\\bin`\n\
  \    2.  `%SPARK_HOME%\\bin`\n    3.  `%HADOOP_HOME%\\bin`\n\n**为计算机的所有用户配置系统与环境变量。**\n\
  \n7.  如果你想为计算机的所有用户（而非仅执行此安装的用户）添加这些变量，你应该对系统变量重复上述所有步骤，如图 2-6 左下角所示，点击“新建”按钮添加环境变量，然后点击“编辑”按钮将它们添加到系统`PATH`中，就像你之前做的那样。\n\
  \n**验证 Spark 安装。**\n\n如果你第一次执行`spark-shell`，你会看到大量信息性消息。这可能会分散你的注意力，让你担心出了什么问题。为了避免这些消息并只关注可能的错误消息，你需要配置\
  \ Spark 的日志记录参数。\n\n进入你的`%SPARK_HOME%\\conf`目录，找到一个名为`log4j2.properties.template`的文件，并将其重命名为`log4j2.properties`。用记事本或其他编辑器打开该文件。\n\
  \n找到这一行\n\n```\nrootLogger.level = info\n```\n\n并将其修改如下：\n\n```\nrootLogger.level\
  \ = ERROR\n```\n\n之后，保存并关闭文件。\n\n打开一个`cmd`终端窗口，输入`spark-shell`。如果安装顺利，你会看到类似图 2-7\
  \ 的内容。\n\n![](img/538349_1_En_2_Fig7_HTML.jpg)\n\n命令提示符-spark-shell 窗口的截图。其中包含关于\
  \ Spark 的详细信息。\n\n图 2-7\n\n`spark-shell`窗口\n\n为了对安装进行更完整的测试，让我们尝试以下代码：\n\n```\n\
  val file =sc.textFile(\"C:\\\\PATH\\\\TO\\\\YOUR\\\\spark\\\\README.md\")\n```\n\
  \n这将创建一个 RDD。你可以使用下一条指令查看文件内容：\n\n```\nfile.take(10).foreach(println)\n```\n\n你可以在图\
  \ 2-8 中看到结果。\n\n![](img/538349_1_En_2_Fig8_HTML.jpg)\n\n命令提示符-spark-shell 窗口的截图，其中高亮显示了测试代码。\n\
  \n图 2-8\n\n`spark-shell`测试代码\n\n要退出`spark-shell`，你可以在命令提示符窗口中按 Ctrl-D，或者输入`:q`。\n\
  \n打开一个网页浏览器，输入 URL `http://localhost:4040/`。你也可以使用你的计算机名来代替`localhost`。你应该会看到一个\
  \ Apache Spark Web UI，类似于图 2-9 所示。下面的示例显示的是执行器页面。\n\n![](img/538349_1_En_2_Fig9_HTML.jpg)\n\
  \nApache Web 用户界面的截图。“执行器”选项卡列出了摘要和执行器。摘要部分详细显示了活动、已死亡和总计数量。执行器部分包括驱动器的详细信息。\n\n\
  图 2-9\n\nApache Spark Web UI\n\n如果你已安装 Python，可以使用以下命令运行 PySpark：\n\n```\npyspark\n\
  ```\n\nPySpark 命令提示符窗口可以使用`quit()`关闭。\n\n## 2.2 动手实践 Spark Shell\n\nApache Spark\
  \ 附带了一系列命令行工具，你可以通过这些工具与 Spark 的 API 进行交互。Spark 为多种编程语言提供了 shell 工具，例如用于 Scala 的\
  \ `spark-shell`、用于 Python 的 `pyspark`、用于 SQL 的 `spark-sql` 以及用于 R 语言的 `sparkR`。\n\
  \nSpark 还提供了其他专门的命令行工具，如 `spark-submit`、`run-example` 和 `spark-class`。你可以使用 `spark-submit`\
  \ 来执行使用 Spark API 编写的 Java、Scala、Python 或 R 语言的独立应用程序，并将其提交到不同的 Spark 集群管理器（YARN、Kubernetes、Mesos\
  \ 和 Standalone），同时提供运行时选项和配置。Apache Spark 附带了多个用 Scala、Java、Python 和 R 编写的示例，这些示例位于\
  \ examples 目录中。`spark-example` shell 可用于运行用 Scala 和 Java 编写的示例：\n\n```\n#对于 Scala\
  \ 和 Java 示例：\n$ $SPARK_HOME/bin/run-example SparkPi\n```\n\n对于用 Python 或 R 编写的示例，你可以直接使用\
  \ `spark-submit`：\n\n```\n#对于 Python 示例：\n$ $SPARK_HOME/bin/spark-submit examples/src/main/python/pi.py\n\
  #对于 R 示例：\n$ $SPARK_HOME/bin/spark-submit examples/src/main/r/dataframe.R\n```\n\
  \n### 使用 Spark Shell 命令\n\nSpark shell 是一个交互式命令行环境，用于从命令行与 Spark 进行交互。Spark shell\
  \ 被称为 REPL（读取-求值-打印-循环）shell 接口。REPL 接口读取每一行输入，对其进行求值，并返回结果。它主要用于针对 Spark 集群运行临时查询。Spark\
  \ shell 是一个非常方便的工具，可用于调试软件和探索新功能，同时获得即时反馈。针对不同语言有特定的 shell 脚本，例如用于启动 Spark Scala\
  \ shell 的 `spark-shell`；用于 Spark with Python（也称为 PySpark）的 `pyspark`；以及用于向 Spark\
  \ 提交 R 语言程序的 `sparkr`。\n\n\n\n### Scala Shell 命令行\n\nSpark Shell 的主要特性之一是它会自动为你创建\
  \ `SparkSession` 和 `SparkContext`。你可以通过它们的对象来访问 `SparkSession` 和 `SparkContext`，前者对应\
  \ `spark`，后者对应 `sc`。\n\n请记住，你可以通过执行以下命令来启动 `spark-shell` 脚本：\n\n```\n$SPARK_HOME/bin/spark-shell\n\
  ~ % spark-shell\nSetting default log level to \"WARN\".\nTo adjust logging level\
  \ use sc.setLogLevel(newLevel). For SparkR, use setLogLevel(newLevel).\nSpark context\
  \ Web UI available at http://192.168.0.16:4040\nSpark context available as 'sc'\
  \ (master = local[*], app id = local-1662487353802).\nSpark session available as\
  \ 'spark'.\nWelcome to\n____              __\n/ __/__  ___ _____/ /__\n_\\ \\/ _\
  \ \\/ _ `/ __/  '_/\n/___/ .__/\\_,_/_/ /_/\\_\\   version 3.3.0\n/_/\nUsing Scala\
  \ version 2.12.15 (Java HotSpot(TM) 64-Bit Server VM, Java 18.0.2)\nType in expressions\
  \ to have them evaluated.\nType :help for more information.\nscala>\n```\n\n这会自动将\
  \ `SparkSession` 实例化为 `spark`，将 `SparkContext` 实例化为 `sc`：\n\n```\nscala> :type spark\n\
  org.apache.spark.sql.SparkSession\nscala> :type sc\norg.apache.spark.SparkContext\n\
  ```\n\n你可以使用 `getenv` 方法（即 `System.getenv('ENV_NAME')`）从 shell 中访问环境变量，例如：\n\n```\n\
  scala> System.getenv(\"PWD\")\nres12: String = /Users/aantolinez\n```\n\n`spark-shell`\
  \ 还通过输入以下命令提供在线帮助：\n\n```\nscala> :help\nAll commands can be abbreviated, e.g.,\
  \ :he instead of :help.\n:completions  output completions for the given string\n\
  :edit |     edit history\n:help [command]       print this summary or command-specific\
  \ help\n:history [num]        show the history (optional num is commands to show)\n\
  :h?           search the history\n...\n...\n:save           save replayable session\
  \ to a file\n:settings    update compiler options, if possible; see reset\n:silent\
  \               disable/enable automatic printing of results\n:warnings        \
  \     show the suppressed warnings from the most recent line which had any\nscala>\n\
  ```\n\n请注意，不要将 `:help` 提供的内联帮助与 `spark-shell -h` 选项显示的 `spark-shell` 运行时选项混淆。\n\n\
  `-h` 选项允许向 shell 传递运行时环境选项，从而可以根据集群配置灵活地执行应用程序。让我们看一些示例，这些示例中我们运行 Apache Spark 与\
  \ Apache Hudi；设置集群管理器（YARN）、部署模式以及每个执行器的核心数；并为驱动器和执行器分配可用内存：\n\n```\n$SPARK_HOME/bin/spark-shell\
  \ \\\n--master yarn \\\n--deploy-mode cluster \\\n--driver-memory 16g \\\n--executor-memory\
  \ 32g \\\n--executor-cores 4  \\\n--conf \"spark.sql.shuffle.partitions=1000\" \\\
  \n--conf \"spark.executor.memoryOverhead=4024\" \\\n--conf \"spark.memory.fraction=0.7\"\
  \ \\\n--conf \"spark.memory.storageFraction=0.3\" \\\n--packages org.apache.hudi:hudi-spark3.3-bundle_2.12:0.12.0\
  \ \\\n--conf \"spark.serializer=org.apache.spark.serializer.KryoSerializer\" \\\n\
  --conf \"spark.sql.catalog.spark_catalog=org.apache.spark.sql.hudi.catalog.HoodieCatalog\"\
  \ \\\n--conf \"spark.sql.extensions=org.apache.spark.sql.hudi.HoodieSparkSessionExtension\"\
  \n```\n\n在下一个示例中，我们在运行时定义要使用的数据库驱动程序和版本：\n\n```\n$SPARK_HOME/bin/spark-shell \\\n\
  --master yarn \\\n--deploy-mode cluster \\\n--driver-memory 16g \\\n--executor-memory\
  \ 32g \\\n--executor-cores 4  \\\n--driver-class-path /path/to/postgresql-42.5.0.jar\
  \ \\\n--conf \"spark.sql.shuffle.partitions=1000\" \\\n--conf \"spark.executor.memoryOverhead=4024\"\
  \ \\\n--conf \"spark.memory.fraction=0.7\" \\\n--conf \"spark.memory.storageFraction=0.3\"\
  \ \\\n```\n\n`spark-shell` 的另一个重要特性是，默认情况下，它使用 `local[*]` 作为 master 启动，并分配一个带有 `local-xxx`\
  \ 模式的 `spark.app.id` 和 `spark.app.name=\"Spark shell\"`。可以通过查看 `spark-shell` 启动的\
  \ Web UI（可通过 URL `http://localhost:4040/environment/` 访问）来检查所有默认设置的属性和运行环境中使用的环境变量，如图\
  \ 2-10 所示。\n\n![](img/538349_1_En_2_Fig10_HTML.jpg)\n\nApache Web 用户界面的屏幕截图。“环境”选项卡列出了运行时信息和\
  \ Spark 属性。运行时信息包括 Java 主目录、Java 和 Scala 版本的名称和值。Spark 属性包括名称和值。\n\n**图 2-10** 端口\
  \ 4040 上的 Apache Spark Web UI\n\n如前所述，你可以通过在命令行中输入代码来运行交互式应用程序。例如，让我们从数据序列创建一个数据帧：\n\
  \n```\nscala> import spark.implicits._\nimport spark.implicits._\nscala> val cars=Seq((\"\
  USA\",\"Chrysler\",\"Dodge\",\"Jeep\"),(\"Germany\",\"BMW\",\"VW\",\"Mercedes\"\
  ),(\"Spain\", \"GTA Spano\",\"SEAT\",\"Hispano Suiza\"))\ncars: Seq[(String, String,\
  \ String, String)] = List((USA,Chrysler,Dodge,Jeep), (Germany,BMW,VW,Mercedes),\
  \ (Spain,GTA Spano,SEAT,Hispano Suiza))\nscala> val cars_df = cars.toDF()\ncars_df:\
  \ org.apache.spark.sql.DataFrame = [_1: string, _2: string ... 2 more fields]\n\
  scala> cars_df.show()\n+-------+---------+-----+-------------+\n|     _1|      \
  \ _2|   _3|           _4|\n+-------+---------+-----+-------------+\n|    USA| Chrysler|Dodge|\
  \         Jeep|\n|Germany|      BMW|   VW|     Mercedes|\n|  Spain|GTA Spano| SEAT|Hispano\
  \ Suiza|\n+-------+---------+-----+-------------+\n```\n\n以下是一个实际示例，展示了如何使用 `spark-shell`\
  \ 从生产数据库中检索信息：\n\n```\nscala> val df_postgresql = spark.read.format(\"jdbc\").option(\"\
  url\", \"jdbc:postgresql://ec2-52-77-8-54.us-west-1.compute.amazonaws.com:5432/db\"\
  ).option(\"driver\", \"org.postgresql.Driver\").option(\"dbtable\",\"schema.table\"\
  ).option(\"user\",\"user_password\").option(\"password\", \"your_db_password_here\"\
  ).load()\ndf_postgresql: org.apache.spark.sql.DataFrame = [category_id: smallint,\
  \ category_name: string ... 2 more fields]\nscala> df_postgresql.show()\n+-----------+--------------+--------------------+-------+\n\
  |category_id| category_name|         description|picture|\n+-----------+--------------+--------------------+-------+\n\
  |          1|     Beverages|Soft drinks, coff...|     []|\n|          2|    Condiments|Sweet\
  \ and savory ...|     []|\n|          3|   Confections|Desserts, candies...|   \
  \  []|\n|          4|Dairy Products|             Cheeses|     []|\n|          5|Grains/Cereals|Breads,\
  \ crackers,...|     []|\n|          6|  Meat/Poultry|      Prepared meats|     []|\n\
  |          7|       Produce|Dried fruit and b...|     []|\n|          8|       Seafood|\
  \    Seaweed and fish|     []|\n+-----------+--------------+--------------------+-------+\n\
  ```\n\n最后，要退出 `spark-shell`，你只需输入 `:q`。\n\n\n\n### PySpark Shell 命令行\n\n如果你更喜欢使用\
  \ Python 进行编程，可以调用 `pyspark` shell。与 `spark-shell` 类似，你可以在终端中输入以下命令来运行它：\n\n```\n\
  $SPARK_HOME/bin/pyspark\n~ % pyspark\nPython 3.6.12 (default, May 18 2021, 22:47:55)\n\
  [GCC 4.8.5 20150623 (Red Hat 4.8.5-28)] on linux\nType \"help\", \"copyright\",\
  \ \"credits\" or \"license\" for more information.\nSLF4J: Class path contains multiple\
  \ SLF4J bindings.\nSLF4J: Found binding in [jar:file:/usr/share/aws/glue/etl/jars/glue-assembly.jar!/org/slf4j/impl/StaticLoggerBinder.class]\n\
  ...\n...\n22/09/07 16:30:26 WARN Client: Same path resource file:///usr/share/aws/glue/libs/pyspark.zip\
  \ added multiple times to distributed cache.\nWelcome to\n____               __\n\
  / __/__  ___ _____/ /__\n_\\ \\/ _ \\/ _ `/ __/  '_/\n/__ / .__/\\_,_/_/ /_/\\_\\\
  \   version 3.3.0\n/_/\nUsing Python version 3.6.12 (default, May 18 2021 22:47:55)\n\
  SparkSession available as 'spark'.\n>>>\n```\n\n与 `spark-shell` 一样，`pyspark` shell\
  \ 会自动创建一个可通过 `spark` 访问的 `SparkSession`，以及一个可通过变量 `sc` 访问的 `SparkContext`。它还会设置一个\
  \ shell Web UI 服务器，其 URL 为 `http://localhost:4040/`。默认情况下，它使用端口 4040；但是，如果此端口无法绑定，则会依次尝试端口\
  \ 4041、4042 等，直到找到可以绑定的端口为止。\n\n如前所述，对于 `spark-shell`，你可以通过在命令行中输入代码，在 `spark` 中运行交互式应用程序。在下面的示例中，我们从一个元组列表创建一个\
  \ DataFrame：\n\n```\n>> cars = [(\"USA\",\"Chrysler\",\"Dodge\",\"Jeep\"),(\"Germany\"\
  ,\"BMW\",\"VW\",\"Mercedes\"),(\"Spain\", \"GTA Spano\",\"SEAT\",\"Hispano Suiza\"\
  )]\n>> cars_df = spark.createDataFrame(cars)\n>> cars_df.show()\n+-------+---------+-----+-------------+\n\
  |     _1|       _2|   _3|           _4|\n+-------+---------+-----+-------------+\n\
  |    USA| Chrysler|Dodge|         Jeep|\n|Germany|      BMW|   VW|     Mercedes|\n\
  |  Spain|GTA Spano| SEAT|Hispano Suiza|\n+-------+---------+-----+-------------+\n\
  ```\n\n`pyspark` shell 也支持运行时配置参数。以下是一个使用配置选项执行 `pyspark` 的示例：\n\n```\n$SPARK_HOME/bin/pyspark\
  \ \\\n--master yarn \\\n--deploy-mode client \\\n--executor-memory 16G \\\n--executor-cores\
  \ 8 \\\n--conf spark.sql.parquet.mergeSchema=true \\\n--conf spark.sql.parquet.filterPushdown=true\
  \ \\\n--conf spark.sql.parquet.writeLegacyFormat=false Hands_On_Spark3_Script.py\
  \ > ./Hands_On_Spark3_Script.log 2>&1 &\n```\n\n与 `spark-shell` 不同，要退出 `pyspark`，你可以在终端中输入\
  \ `quit()` 或 `exit()` 命令，或者按 Ctrl-D。\n\n### 使用 `spark-submit` 命令运行自包含应用程序\n\n如果你查看\
  \ `$SPARK_HOME/bin` 目录，会发现几个 `spark-submit` 脚本。Spark 为不同的操作系统和用途提供了不同的脚本。因此，对于 Linux\
  \ 和 Mac，你需要使用 `spark-submit.sh` 脚本文件，而对于 Windows，你必须使用 `spark-submit.cmd` 命令文件。\n\
  \n`spark-submit` 命令的用法如下：\n\n```\n~ % $SPARK_HOME/bin/spark-submit --help\nUsage:\
  \ spark-submit [options]  [app arguments]\nUsage: spark-submit --kill [submission\
  \ ID] --master [spark://...]\nUsage: spark-submit --status [submission ID] --master\
  \ [spark://...]\nUsage: spark-submit run-example [options] example-class [example\
  \ args]\n```\n\n一些最常见的 `spark-submit` 选项如下：\n\n```\n$ $SPARK_HOME/bin/spark-submit\
  \ \\\n--master  \\\n--deploy-mode  \\\n--class  \\\n--conf = \\\n--driver-memory\
  \ g \\\n--executor-memory g \\\n--executor-cores   \\\n--jars  \n... # other options\n\
  \ \\\n[application-arguments]\n```\n\n现在，我们将通过一个实际示例来说明 `spark-submit` 的工作原理：\n\n\
  ```\n$ $SPARK_HOME/bin/spark-submit \\\n--deploy-mode client \\\n--master local\
  \ \\\n--class org.apache.spark.examples.SparkPi \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\n```\n\n如果你按原样运行了这段代码，你肯定会在控制台中看到类似这样的输出：\n\n```\n22/08/30 22:04:30 WARN Utils:\
  \ Your hostname, MacBook-Pro.local resolves to a loopback address: 127.0.0.1; using\
  \ 192.168.0.16 instead (on interface en0)\n22/08/30 22:04:30 WARN Utils: Set SPARK_LOCAL_IP\
  \ if you need to bind to another address\n22/08/30 22:05:00 INFO SparkContext: Running\
  \ Spark version 3.3.0\n. . .\n. . .\n22/08/30 22:05:03 INFO DAGScheduler: Job 0\
  \ finished: reduce at SparkPi.scala:38, took 1.174952 s\nPi is roughly 3.142520392815049\n\
  22/08/30 22:05:03 INFO SparkUI: Stopped Spark web UI at http://192.168.0.16:4043\n\
  22/08/30 22:05:03 INFO MapOutputTrackerMasterEndpoint: MapOutputTrackerMasterEndpoint\
  \ stopped!\n22/08/30 22:05:03 INFO MemoryStore: MemoryStore cleared\n22/08/30 22:05:03\
  \ INFO BlockManager: BlockManager stopped\n22/08/30 22:05:03 INFO BlockManagerMaster:\
  \ BlockManagerMaster stopped\n22/08/30 22:05:03 INFO OutputCommitCoordinator$OutputCommitCoordinatorEndpoint:\
  \ OutputCommitCoordinator stopped!\n22/08/30 22:05:03 INFO SparkContext: Successfully\
  \ stopped SparkContext\n22/08/30 22:05:03 INFO ShutdownHookManager: Shutdown hook\
  \ called\n22/08/30 22:05:03 INFO ShutdownHookManager: Deleting directory /private/var/folders/qd/6ly2_9_54tq434fctwmmsc3m0000gp/T/spark-30934777-e061-403c-821d-0bbaa2e62745\n\
  22/08/30 22:05:03 INFO ShutdownHookManager: Deleting directory /private/var/folders/qd/6ly2_9_54tq434fctwmmsc3m0000gp/T/spark-3e2e234c-7615-4a9c-b34f-878d149517e2\n\
  ```\n\n**“Pi is roughly 3.142520392815049”** 是你真正感兴趣的信息。\n\n正如我们在“步骤 5：配置系统和环境变量”中提到的，为了避免大量信息导致难以找到应用程序的最终结果，你可以稍微调整\
  \ Spark 配置，使其仅显示 ERROR 消息，从而移除 INFO 行。\n\n假设你使用的是 Apache Spark 3.3.0，在终端窗口中执行以下操作：\n\
  \n```\n$ ls $SPARK_HOME/conf\nfairscheduler.xml.template    spark-defaults.conf.template\n\
  log4j2.properties.template    spark-env.sh.template\nmetrics.properties.template\
  \    workers.template\n```\n\n将 `log4j2.properties.template` 文件重命名为 `log4j2.properties`：\n\
  \n```\n$ mv $SPARK_HOME/conf/log4j2.properties.template $SPARK_HOME/conf/log4j2.properties\n\
  ```\n\n编辑 `log4j2.properties` 文件：\n\n```\n$ vi $SPARK_HOME/conf/log4j2.properties\n\
  ```\n\n找到以下行：\n\n```\n# Set everything to be logged to the console\nrootLogger.level\
  \ = info\n```\n\n并将其更改为：\n\n```\n# Set everything to be logged to the console\n\
  rootLogger.level = ERROR\n```\n\n保存文件，然后再次运行 Spark 示例应用程序：\n\n```\n$ $SPARK_HOME/bin/spark-submit\
  \ \\\n--name \"Hands-On Spark 3\" \\\n--master local\\[4] \\\n--deploy-mode client\
  \ \\\n--conf spark.eventLog.enabled=false \\\n--conf \"spark.executor.extraJavaOptions=-XX:+PrintGCDetails\
  \ -XX:+PrintGCTimeStamps\" \\\n--class org.apache.spark.examples.SparkPi \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\nPi is roughly 3.1410188926273617\n$\n```\n\n这次你将看到干净的退出信息。\n\n现在让我们回顾一下最常见选项的含义。\n\
  \n#### Spark Submit 选项\n\n你可以通过运行以下命令获取所有可用的 `spark-submit` 选项：\n\n```\n$ $SPARK_HOME/bin/spark-submit\
  \ --help\n```\n\n让我们解释一下与 Scala 和 Python（PySpark）一起使用的最相关的 `spark-submit` 选项和配置。\n\
  \n#### 部署模式选项\n\n`--deploy-mode` 选项指定驱动程序是在本地启动（“client”）还是在集群中运行（“cluster”）。表 2-1\
  \ 描述了每个选项的含义。\n\n**表 2-1** Apache Spark 部署模式\n\n| 选项 | 描述 |\n| --- | --- |\n| cluster\
  \ | 在集群模式下，驱动程序将在集群内的某个工作节点上运行。集群模式用于运行生产作业。 |\n| client（默认选项） | 在客户端模式下，驱动程序在提交应用程序的本地运行，而执行器在不同的节点上运行。\
  \ |\n\n\n\n#### 集群管理器选项\n\n`--master`选项指定要使用的集群管理器以及运行应用程序的集群主节点 URL。您可以在表 2-2 中查看可用的不同集群管理器及其使用方法。\n\
  \n**表 2-2 Apache Spark 集群管理器**\n\n| 选项 | 模板 | 描述 |\n| --- | --- | --- |\n| Standalone\
  \ | `spark://IP:PORT` | 主节点的 URL、IP 地址和端口，默认端口为 7077。 |\n| Mesos | `mesos://host:port`\
  \ | Mesos 的主节点 URL。 |\n| YARN | `--master yarn` | 由 Hadoop YARN 管理的集群资源。 |\n| Kubernetes\
  \ | `k8s://https://host:port` | Kubernetes 主机和端口：`k8s://https://<k8s-apiserver-host>:<k8s-apiserver-port>`\
  \ |\n| Local | `local` | 在本地运行 Spark，无并行度，仅一个工作线程。 |\n| `local[K]` | 在本地运行 Spark，使用\
  \ K 个核心或工作线程。 |\n| `local[K,F]` | 在本地运行 Spark，使用 K 个工作线程和 F 个`maxFailures`（失败时的重试次数）。\
  \ |\n| `local[*]`（默认：`local[*]`） | 在本地运行 Spark，使用与逻辑核心数量相同的工作线程。 |\n\n以下是这些常见选项的一些示例：\n\
  \n```\n# 在 4 个核心上本地运行应用程序\n(base) aantolinez@MacBook-Pro ~ % $SPARK_HOME/bin/spark-submit\
  \ \\\n--class org.apache.spark.examples.SparkPi \\\n--master local[4] \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\nzsh: no matches found: local[4]\n```\n\n**注意**\n\n如果您使用的是 zsh（Z shell），则必须对`--master\
  \ local[4] \\`中的`[4]`进行转义，使用`\\\"`，例如`--master local\\[4] \\`；否则，您将收到以下错误消息：\n\n\
  `zsh: no matches found: local[4]`\n\n```\n(base) aantolinez@MacBook-Pro ~ % $SPARK_HOME/bin/spark-submit\
  \ \\\n--class org.apache.spark.examples.SparkPi \\\n--master local\\[4] \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\n```\n\n```\n# Spark 独立集群和 Python 应用程序\n$SPARK_HOME/bin/spark-submit \\\n--master\
  \ spark://192.168.1.3:7077 \\\n/$SPARK_HOME/examples/src/main/python/pi.py\n```\n\
  \n```\n# 客户端部署模式下的 Spark 独立集群，使用 100 个核心\n$SPARK_HOME/bin/spark-submit \\\n--class\
  \ org.apache.spark.examples.SparkPi \\\n--master spark://192.168.1.3:7077 \\\n--executor-memory\
  \ 20G \\\n--total-executor-cores 100 \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\n```\n\n```\n# 集群部署模式下带监督选项的 Spark 独立集群。\n# --supervise 在驱动程序以非零退出码失败时自动重启驱动程序。\n\
  $SPARK_HOME/bin/spark-submit \\\n--class org.apache.spark.examples.SparkPi \\\n\
  --master spark://192.168.1.3:7077 \\\n--deploy-mode cluster \\\n--supervise \\\n\
  --executor-memory 20G \\\n--total-executor-cores 100 \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\n```\n\n```\n# 集群部署模式下在 YARN 集群上运行 Spark\nexport HADOOP_CONF_DIR=PATH_TO_HADOOP_CONF_DIR\n\
  $SPARK_HOME/bin/spark-submit \\\n--master yarn \\\n--deploy-mode cluster \\\n--class\
  \ org.apache.spark.examples.SparkPi \\\n--executor-memory 10G \\\n--num-executors\
  \ 20 \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar 80\n```\n\n```\n\
  # 集群部署模式下在 Mesos 集群上运行\n$SPARK_HOME/bin/spark-submit \\\n--class org.apache.spark.examples.SparkPi\
  \ \\\n--master mesos://207.184.161.138:7077 \\\n--deploy-mode cluster \\\n--executor-memory\
  \ 16G \\\n--total-executor-cores 64 \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\n```\n\n```\n# 集群部署模式下在 Kubernetes 集群上运行 Spark\n$SPARK_HOME/bin/spark-submit\
  \ \\\n--class org.apache.spark.examples.SparkPi \\\n--master k8s://xx.yy.zz.ww:443\
  \ \\\n--deploy-mode cluster \\\n--executor-memory 20G \\\n--num-executors 50 \\\n\
  /$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar 80\n```\n\n#### 调整资源分配\n\
  \n向集群提交应用程序时，您可以关注其执行性能，从而使 Spark 程序运行得更快。Apache Spark 关心的两个主要资源是 CPU 和 RAM。为了充分利用\
  \ Spark 集群的能力，您可以控制驱动程序和执行器可以使用的内存和核心数量。\n\n本节列举的选项不仅影响 Spark 性能，还会影响其运行的集群。例如，它们会影响\
  \ Spark 请求的资源如何与集群管理器可用的资源相匹配。\n\n在表 2-3 中，您可以查看需要调整的参数及其技术描述。\n\n**表 2-3 Apache\
  \ Spark 驱动程序和执行器资源管理选项**\n\n| 选项 | 描述 |\n| --- | --- |\n| `--executor-cores` | •\
  \ Spark 驱动程序用于执行器进程的 CPU 核心数量。<br>• `cores`属性控制一个执行器可以运行的并发任务数。<br>• `--executor-cores\
  \ 5`表示每个执行器最多可以同时运行五个任务。 |\n| `--executor-memory` | • 执行器进程使用的 RAM 量。<br>• 此选项影响\
  \ Spark 可以缓存和分配给 shuffle 数据结构的最大数据大小。<br>• 此属性影响聚合、分组和连接等操作的性能。 |\n| `--num-executors`\
  \ (*) | 控制请求的执行器数量。 |\n| `--driver-memory` | Spark 驱动程序使用的内存。 |\n| `--driver-cores`\
  \ | 分配给 Spark 驱动程序的 CPU 核心数量。 |\n| `--total-executor-cores` | 授予执行器的核心总数。 |\n\n\
  (*) **注意** 从 CDH 5.4/Spark 1.3 开始，您可以通过`spark.dynamicAllocation.enabled`属性绕过此参数的设置，启用动态分配。动态分配允许您的应用程序在有待处理任务时请求可用的执行器，并在未使用时释放它们。\n\
  \n\n\n#### 动态加载 Spark Submit 配置\n\n通常，如果你的应用程序可能在不同的集群配置下运行（例如不同的集群管理器、不同的可用内存量等），建议避免在应用程序中使用\
  \ `SparkConf` 硬编码配置，因为一旦 `SparkConf` 对象被传递给 Apache Spark，用户就无法再修改它。\n\n因此，与其像下面代码片段中那样在源代码中建立\
  \ `SparkContext` 配置，不如让该配置在程序被调用时准备好接收动态参数：\n\n```\n// 在 Scala 中硬编码集群配置参数\n// 创建\
  \ Spark 配置\nval conf = new SparkConf()\n.setMaster(\"local[4]\")\n.setAppName(\"\
  Hands-On Spark 3\")\n.set(\"spark.executor.memory\", \"32g\")\n.set(\"spark.driver.memory\"\
  , \"16g\")\n// 创建 Spark 上下文\nval sc = new SparkContext(conf)\n```\n\n```\n# 在 PySpark\
  \ 中硬编码集群配置参数\nconf = SparkConf()\nconf.setMaster(\"spark://localhost:7077\")\nconf.setAppName(\"\
  Hands-On Spark 3\")\nconf.set(\"spark.executor.memory\", \"32g\")\nconf.set(\"spark.driver.memory\"\
  , \"16g\")\nsc = SparkContext(conf=conf)\n```\n\n`SparkContext` 对于一个应用程序只创建一次；因此，另一种更灵活的解决方案是使用空配置来构建它：\n\
  \n```\n// 在 Scala 中使用空配置创建 SparkContext\nval sc = new SparkContext(new SparkConf())\n\
  ```\n\n```\n# 在 PySpark 中使用空配置创建 SparkContext\nconf = SparkConf()\nsc = SparkContext(conf=conf)\n\
  ```\n\n然后，你可以在运行时动态地向集群传递配置参数：\n\n```\n$SPARK_HOME/bin/spark-submit \\\n--name \"\
  Hands-On Spark 3\" \\\n--master local[4] \\\n--deploy-mode client \\\n--conf spark.eventLog.enabled=false\
  \ \\\n--conf \"spark.executor.extraJavaOptions=-XX:+PrintGCDetails -XX:+PrintGCTimeStamps\"\
  \ \\\n--class org.apache.spark.examples.SparkPi \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar\
  \ 80\n```\n\nSpark submit 允许你使用数十个参数微调集群配置，这些参数可以通过 `--config`/`-c` 选项发送给 `SparkContext`，或者通过设置\
  \ `SparkConf` 来创建 `SparkSession`。\n\n这些选项控制应用程序属性（表 2-4）、运行时环境（表 2-5）、shuffle 行为、Spark\
  \ UI、压缩和序列化、内存管理、执行行为、执行器指标、网络、调度、屏障执行模式、动态分配（表 2-6）、线程配置、安全性以及运行时 SQL 配置等（表 2-7）。接下来，我们将探讨一些最常见的配置。\n\
  \n#### 应用程序属性\n\n**表 2-4** Spark 应用程序属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `spark.app.name`（默认值，无）\
  \ | 你的应用程序的名称。 |\n| `spark.driver.cores`（默认值，1） | 在集群模式下，仅用于驱动程序进程的内核数。 |\n| `spark.driver.memory`（默认值，1g）\
  \ | 用于驱动程序进程的内存量。在客户端模式下，应通过 `--driver-memory` 命令行选项或属性文件进行设置。 |\n\n#### 运行时环境\n\
  \n**表 2-5** Spark 运行时环境\n\n| 属性 | 描述 |\n| --- | --- |\n| `spark.driver.extraClassPath`（默认值，无）\
  \ | 要预置到驱动程序类路径的额外类路径条目。在客户端模式下，应通过 `--driver-class-path` 命令行选项或默认属性文件进行设置。该选项允许你加载特定的\
  \ JAR 文件，例如数据库连接器等。 |\n\n#### 动态分配\n\n**表 2-6** Spark 分配资源\n\n| 属性 | 描述 |\n| ---\
  \ | --- |\n| `spark.dynamicAllocation.enabled`（默认值，false） | 是否使用动态资源分配，根据现有工作负载调整处理应用程序的执行器数量。\
  \ |\n| `spark.dynamicAllocation.executorIdleTimeout`（默认值，60 秒） | 如果启用了动态分配，执行器进程在空闲时间过长时将被终止。\
  \ |\n| `spark.dynamicAllocation.cachedExecutorIdleTimeout`（默认值，无限） | 如果启用了动态分配，执行器进程在缓存了数据且空闲时间过长时将被终止。\
  \ |\n\n#### 其他配置\n\n**表 2-7** 控制应用程序属性的其他 Spark 选项\n\n| 属性 | 描述 |\n| --- | --- |\n\
  | `spark.sql.shuffle.partitions`（默认值，200） | 在连接或聚合操作中 shuffle 数据时使用的分区数。 |\n| `spark.rdd.compress`（默认值，false）\
  \ | 是否压缩序列化的 RDD 分区，以节省大量空间为代价，增加额外的 CPU 处理时间。 |\n| `spark.executor.pyspark.memory`（默认值，未设置）\
  \ | 如果设置，则为每个执行器中分配给 PySpark 的内存量。此选项的行为因操作系统而异。 |\n| `spark.executor.memoryOverhead`（`executorMemory`\
  \ * `spark.executor.memoryOverheadFactor`），最小值为 384 | 每个执行器进程分配的额外内存量。每个执行器运行的最大内存由\
  \ `spark.executor.memoryOverhead`、`spark.executor.memory`、`spark.memory.offHeap.size`\
  \ 和 `spark.executor.pyspark.memory` 的总和决定。 |\n\n以下是在命令行中使用其中一些选项的示例：\n\n```\n$SPARK_HOME/bin/spark-submit\
  \ \\\n--master yarn \\\n--deploy-mode cluster \\\n--conf \"spark.sql.shuffle.partitions=10000\"\
  \ \\\n--conf \"spark.executor.memoryOverhead=8192\" \\\n--conf \"spark.memory.fraction=0.7\"\
  \ \\\n--conf \"spark.memory.storageFraction=0.3\" \\\n--conf \"spark.dynamicAllocation.minExecutors=10\"\
  \ \\\n--conf \"spark.dynamicAllocation.maxExecutors=2000\" \\\n--conf \"spark.dynamicAllocation.enabled=true\"\
  \ \\\n--conf \"spark.executor.extraJavaOptions=-XX:+PrintGCDetails -XX:+PrintGCTimeStamps\"\
  \ \\\n--files /path/of/config.conf, /path/to/mypropeties.json \\\n--class org.apache.spark.examples.SparkPi\
  \ \\\n/$SPARK_HOME/examples/jars/spark-examples_2.12-3.3.0.jar 80\n```\n\n配置可以通过三种不同的方式传递给\
  \ Spark。硬编码方式，利用 `SparkConf` 属性，会覆盖其他方式，并遵循第一优先级顺序：\n\n```\nval config = new SparkConf()\n\
  config.set(\"spark.sql.shuffle.partitions\",\"500\")\nval spark=SparkSession.builder().appName(\"\
  Hands-On Spark 3\").config(config)\n```\n\n第二优先级是通过 `spark-submit` 的 `--config`\
  \ 属性传递。最后，第三优先级是通过 `$SPARK_HOME/conf/spark-defaults.conf` 文件。最后一种方式的优势在于，在此文件中建立的配置是全局生效的，即适用于集群中运行的所有\
  \ Spark 应用程序。\n\n接下来，我们将展示一个用户开发的应用程序示例，以及如何将其提交给 Apache Spark。\n\n让我们开发一个名为 `Functions`\
  \ 的小程序，它执行一个简单的操作：两个数相加：\n\n```\nobject Functions {\ndef main(args: Array[String])\
  \ = {\nagregar(1,2)\n}\nval agregar = (x: Int, y: Int) => println(x+y)\n}\n```\n\
  \n将文件保存为 `Functions.scala`，并按如下方式编译。我们假设你的计算机上已安装 Scala：\n\n```\n~ % scalac ./Functions.scala\
  \ -d Functions.jar\n```\n\n然后，将 JAR 文件提交到你的 Spark 安装目录：\n\n```\n~ % spark-submit\
  \ --class Functions ./Functions.jar\n```\n\n你可以在程序输出中看到数字 `3`。\n\n\n\n## 2.3 Spark\
  \ 应用程序概念\n\n到目前为止，您已经下载并配置了 Apache Spark，熟悉了 Spark shell，并执行了一些小示例。现在，让我们回顾一些 Spark\
  \ 应用程序的重要术语，这些术语对于理解代码执行时发生的情况至关重要：\n\n- **Spark 应用程序** 是用户在 Spark 之上开发的程序，它使用 Spark\
  \ 的 API，并由在集群上运行的执行器和一个驱动程序组成。\n- **SparkSession** 是与 Spark 通信的入口点，允许用户通过 Spark\
  \ API 与底层功能进行交互。\n- **任务** 是最小的执行单元，在执行器内部执行。\n- **阶段** 是运行相同代码的任务集合，每个任务处理数据集的不同部分。使用需要\
  \ shuffle 或读取数据集的函数（例如 `reduceByKey()`、`Join()` 等）会触发 Spark 创建一个阶段。\n- **作业** 包含多个阶段，可以定义为允许在\
  \ Spark 集群中执行和监督应用程序的实体。\n\n### Spark 应用程序与 SparkSession\n\n正如我们之前提到的，`SparkSession`\
  \ 是与 Spark 通信的入口点，并通过 Spark Dataset 和 DataFrame API 访问其功能。`SparkSession` 使用 `SparkSession.builder()`\
  \ 构造函数创建，创建 `SparkSession` 是应用程序中的第一条语句。\n\n`SparkSession` 是在 Spark 2.0 中引入的，提供了新的类\
  \ `org.apache.spark.sql.SparkSession` 来替代 2.0 版本之前存在的 `SparkContext`、`SQLContext`、`StreamingContext`\
  \ 和 `HiveContext` 等上下文。\n\n`SparkSession` 的数量几乎是无限的；这意味着您可以根据需要创建任意多个 `SparkSession`。当多个程序员同时在同一个集群上工作，或者您想逻辑上隔离\
  \ Spark 关系实体时，这尤其有用。但是，在单个 JVM 上只能有一个 `SparkContext`。可以使用 `SparkSession.builder()`\
  \ 或 `SparkSession.newSession()` 创建新的 `SparkSession`。\n\n### 访问现有的 SparkSession\n\
  \n在预先创建好的环境中，如有必要，您可以使用 `SparkSession.Builder` 类的 `getOrCreate()` 方法从应用程序中访问现有的\
  \ `SparkSession` 以检索现有会话。以下是 Scala 和 PySpark 中的两个代码片段，向您展示如何操作：\n\n```\n// 了解 Scala\
  \ 中现有的 SparkSession\nimport org.apache.spark.sql.SparkSession\nval currentSparkSession\
  \ = SparkSession.builder().getOrCreate()\nprint(currentSparkSession)\n// SparkSession\
  \ 输出\norg.apache.spark.sql.SparkSession@7dabc2f9\n```\n\n```\n# 了解 PySpark 中现有的\
  \ SparkSession\ncurrentSparkSession = SparkSession.builder.getOrCreate\nprint(currentSparkSession)\n\
  # SparkSession 输出\npyspark.sql.session.SparkSession object at 0x7fea951495e0\n```\n\
  \n您可以使用 `getActiveSession()` 方法获取构建器返回的当前线程的活动 `SparkSession`：\n\n```\n# 当前线程的活动\
  \ SparkSession\ns = SparkSession.getActiveSession()\nprint(s)\n```\n\n您还可以使用 `newSession()`\
  \ 方法创建一个新的/另一个 `SparkSession`。此方法将创建一个具有与活动会话相同应用名称、主节点模式和 `SparkContext` 的新会话。请记住，每个\
  \ Spark 应用程序只能有一个上下文：\n\n```\n// 创建一个新的 SparkSession\nval aNewSession = spark.newSession()\n\
  print(aNewSession)\norg.apache.spark.sql.SparkSession@2dc9b758\nOut[6]: aNewSession:\
  \ org.apache.spark.sql.SparkSession = org.apache.spark.sql.SparkSession@2dc9b758\n\
  ```\n\n### 获取当前 Spark 上下文设置/配置\n\nSpark 有许多您可能希望指定的设置和配置，包括应用程序属性和运行时参数。您可以使用以下\
  \ Scala 或 PySpark 代码收集所有当前配置：\n\n```\n// 获取所有 Spark 配置\nval configMap:Map[String,\
