  \ NULL 值。\n\n逻辑回归的主要缺点之一是它需要大型数据集才能真正洞察数据。\n\n如果你想更深入地了解如何将 Spark ML 与 Spark Structured\
  \ Streaming 结合使用，可以[点击此链接](https://docs.databricks.com/_extras/notebooks/source/using-mllib-with-structured-streaming.html)找到一个完整的流式管道示例。\n\
  \n在下一节中，我们将分析一些已经实现的、预期的未来 Spark Streaming 特性。\n\n## 10.2 Spark 3.3.x\n\n新的 Spark\
  \ 3.3.2 版本于 2023 年 2 月 17 日发布（本书撰写之时）；因此，一些预期的 Spark 未来改进已经实现^(²⁶)。\n\n例如，最近与 Spark\
  \ Streaming 相关的改进之一就是增加了 [RocksDB](https://rocksdb.org/) 状态存储提供程序，作为基于 HDFS 后端状态存储提供程序的默认实现的补充。\n\
  \n虽然 RocksDB 作为状态存储提供程序的引入并不新鲜（它是在 Spark 3.2 中引入的），但 RocksDB 状态存储的 `WriteBatch`\
  \ 在清理本地内存方面的问题最近才得到解决。\n\n在 Spark 3.2 之前，唯一可用的内置流式状态存储实现是 HDFS 后端状态存储提供程序（`HDFSBackedStateStore`）。HDFS\
  \ 状态存储实现分为两个不同阶段。在第一阶段，状态数据存储在内存映射中。第二阶段包括将该信息保存到具有容错能力的 HDFS 兼容文件系统中。\n\n回顾前几章，流处理应用程序通常是有状态的，它们会保留先前事件的信息，用于更新其他未来事件的状态。\n\
  \n当我们执行有状态操作（例如流式聚合、流式 `dropDuplicates`、`流-流连接`、`mapGroupsWithState` 或 `flatMapGroupsWithState`）时，同时希望维护大量键的状态，这可能会因\
  \ Java 虚拟机（JVM）垃圾回收问题而导致处理延迟，从而在微批次处理时间中产生重要延迟。\n\n要理解导致上述状态存储问题的原因，我们必须知道 `HDFSBackedStateStore`\
  \ 的实现会导致状态信息存储在 Spark 执行器的 JVM 内存中。因此，大量状态对象的累积会耗尽内存，引发垃圾回收性能问题。\n\n针对此类情况，Spark\
  \ 最近引入了 RocksDB 作为另一种状态存储提供程序，允许将状态信息存储在 RocksDB 数据库中。\n\n### Spark RocksDB 状态存储数据库\n\
  \n让我们探讨一下 RocksDB 带来的一些新特性，以及如何使用它们来提升 Spark Streaming 的性能。\n\n\n\n#### 什么是 RocksDB？\n\
  \nRocksDB 是一个可嵌入的持久化键值存储引擎，专为快速存储设计，基于三种基本结构：`memtable`、`sstfile` 和 `logfile`。\n\
  \nRocksDB 包含以下主要特性：\n\n- 采用日志结构数据库引擎。\n- 针对存储中小型键值对进行了优化，尽管键和值是任意大小的字节流。\n- 针对快速、低延迟存储（如闪存盘和高速磁盘驱动器）进行了优化，以实现高读写速率性能。\n\
  - 适用于多核处理器。\n\n除了 Spark Streaming，RocksDB 还被其他先进的流处理框架（如 Apache Flink 或 Kafka Streams）用作状态后端，这些框架使用\
  \ RocksDB 在计算节点上维护本地状态。\n\n如果你想将 RocksDB 集成到你的 Spark 集群中，设置\n\n```\nspark.conf.set(\n\
  \"spark.sql.streaming.stateStore.providerClass\",\n\"org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider\"\
  )\n```\n\n可以将 `RocksDBStateStoreProvider` 启用为默认的 Spark `StateStoreProvider`。\n\n\
  除了上述基本配置外，Spark 还提供了多个选项，可用于调整你的 RocksDB 安装。\n\n表 10-2 总结了用于优化 RocksDB 的最常见 `RocksDBConf`\
  \ 配置选项。\n\n**表 10-2** RocksDB 状态存储参数\n\n| 配置名称 | 描述 | 默认值 |\n| --- | --- | --- |\n\
  | `spark.sql.streaming.stateStore.rocksdb.compactOnCommit` | 激活后，RocksDB 状态变更将在提交过程中进行压缩\
  \ | False |\n| `spark.sql.streaming.stateStore.rocksdb.blockSizeKB` | RocksDB 在\
  \ `BlockBasedTableConfig` 上设置的块大小（以 kB 为单位） | 4 |\n| `spark.sql.streaming.stateStore.rocksdb.blockCacheSizeMB`\
  \ | 块缓存的大小（以 MB 为单位） | 8 |\n| `spark.sql.streaming.stateStore.rocksdb.lockAcquireTimeoutMs`\
  \ | 在 RocksDB 实例的加载操作中等待获取锁的毫秒数 | 60000 |\n| `spark.sql.streaming.stateStore.rocksdb.resetStatsOnLoad`\
  \ | 加载时是否重置 RocksDB 的所有计数器和直方图统计信息 | True |\n| `spark.sql.streaming.stateStore.rocksdb.trackTotalNumberOfRows`\
  \ | 是否跟踪总行数。这会在写操作时增加额外的查找，但启用它可能导致 RocksDB 性能下降 | True |\n\n#### BlockBasedTableConfig\n\
  \n`BlockBasedTable` 是 RocksDB 默认的 SST 文件格式。它包含了 `sst` 格式的普通表配置。RocksDB 在创建时会生成一个\
  \ `BlockBasedTableConfig`。\n\n#### RocksDB 可能的性能下降\n\n启用此选项后，会在写操作时增加额外的数据检索尝试，以跟踪总行数的变化，从而在大量写入工作负载下带来开销。当我们希望\
  \ RocksDB 上传一个键值对的版本、更新值、然后删除该键时，会使用此选项。因此，请注意，开启此选项可能会影响系统性能。\n\n总而言之，RocksDB 能够实现非常高的性能。RocksDB\
  \ 包含一个灵活且可调优的架构，具有许多设置，可以根据不同的生产环境和可用硬件进行调整，包括内存存储、闪存、普通硬盘、HDFS 文件系统等。\n\nRocksDB\
  \ 支持高级数据库操作，如合并、压缩过滤器和 SNAPSHOT 隔离级别。另一方面，RocksDB 不支持某些数据库功能，如连接、查询编译或存储过程。\n\n\
  ## 10.3 光速项目\n\n2022 年 6 月 28 日，Databricks 宣布了光速项目。光速项目是下一代 Spark Streaming 引擎。\n\
  \nSpark Structured Streaming 已被业界和社区广泛采用，随着越来越多的现代应用程序需要处理流式数据，对流处理引擎的要求也发生了变化。\n\
  \n光速项目将专注于提供更高的吞吐量和更低的延迟，并降低数据处理成本。光速项目还将支持扩展连接器生态系统，增强新的流处理功能，并简化应用程序的部署、监控和故障排除。\n\
  \n光速项目将逐步推出，支持以下 Spark Structured Streaming 领域的改进：\n\n### 可预测的低延迟\n\n在这一领域，新的 Apache\
  \ Spark Structured Streaming 承诺与当前能力相比，将工作负载性能提升多达两倍。目前在该领域正在进行的一些支持实现此目标的举措如下：\n\
  \n- **偏移量管理**：实践经验表明，偏移量管理操作消耗了总管道处理时间的 30% 到 50%。通过使这些操作异步化并具有可配置的节奏，预计将减少处理延迟。\n\
  - **异步检查点**：通过将两个相邻记录组的执行与检查点写入重叠，预计在此领域可实现高达 25% 的效率提升。目前，检查点仅在处理每组记录后写入。\n- **状态检查点频率**：新的\
  \ Spark Structured Streaming 引擎预计将引入检查点数量的参数化，即仅在处理一定数量的记录组后才写入检查点，以减少延迟。\n\n###\
  \ 增强的数据/事件处理功能\n\n光速项目将在以下领域扩展 Spark Structured Streaming 的功能：\n\n- **多状态运算符**：新的\
  \ Spark Structured Streaming 预计将支持多个状态运算符，以满足多种用例，例如：\n  - 链式时间窗口聚合（例如，不同类型窗口聚合的链）\n\
  \  - 链式流-流外等值连接\n  - 流-流时间间隔连接加上时间窗口聚合\n- **高级窗口**：新的 Spark Structured Streaming\
  \ 引擎预计将提供直观的 API 以支持以下功能：\n  - 任意窗口元素组\n  - 定义何时执行处理逻辑的能力\n  - 在处理逻辑触发之前或之后移除窗口元素的能力\n\
  - **状态管理**：光速项目将引入一个动态状态模式，以适应处理逻辑的变化，并具备外部查询中间信息（“状态”）的能力。\n- **异步 I/O**：光速项目预计还将引入一个新的\
  \ API，用于异步管理到外部数据源或系统的连接。这个新功能对于从异构源收集实时数据和/或写入多个接收器的流式 ETL 作业非常有用。\n- **Python\
  \ API 对等性**：光速项目将提供一个新的 Python API，包含有状态处理能力，并与流行的 Python 包（如 Pandas）内置集成，以方便 Python\
  \ 开发人员使用。\n\n### 新的连接器生态系统\n\n连接器无疑让 Spark 用户的生活更轻松。在这一领域，光速项目预计还将提供以下内容：\n\n- **新连接器**：新的原生连接器将被添加到\
  \ Spark Structured Streaming 中。例如：\n  - Google Pub/Sub，一种异步且可扩展的消息传递服务，充当生成消息的服务和处理这些消息的服务之间的接口\n\
  \  - Amazon DynamoDB，一种 NoSQL 数据库服务\n- **连接器增强**：预计此领域还将增加新功能，例如在 Apache Kafka 连接器中包含\
  \ AWS IAM 身份验证支持，或增强 Amazon Kinesis 连接器。\n\n\n\n### 改进运维与故障排查\n\n处理未绑定数据要求系统能够全天候不间断运行。因此，在控制运营成本的同时，持续监控和管理这类系统对业务至关重要。作为\
  \ Project Lightspeed 的一部分，Spark 预计将引入两组新特性：\n\n- **可观测性**：结构化流处理管道将包含：\n  - 用于排查流处理性能问题的额外指标。\n\
  \  - 统一的指标收集机制。\n  - 增强向不同系统和格式导出指标数据的能力。\n  - 改进的可视化工具。\n- **可调试性**：与上一点类似，结构化流处理管道还将集成以下可视化能力：\n\
  \  - 管道算子如何分组并映射到任务。\n  - 在 Executor 上运行的任务。\n  - Executor 日志与指标的深入分析能力。\n\n## 10.4\
  \ 总结\n\n在本章中，我们讨论了 Spark Structured Streaming 与 Spark ML 结合以执行实时预测的能力。这是 Apache\
  \ Spark 社区预计将改进的最重要特性之一，因为越来越多的业务应用需要利用动态数据分析来触发快速响应。随后，我们讨论了新的 RocksDB 状态存储的优势，并以最受期待的\
  \ Spark Streaming 转折点之一——Project Lightspeed 作为结尾，该项目将推动 Spark Structured Streaming\
  \ 进入实时时代。\n\n\n\n"
