  \n## 9.4 滑动窗口\n\n在某些情况下，我们可能需要不同类型的窗口。例如，如果我们想每隔 30 分钟了解过去一分钟内有多少患者进入医院，就需要重叠窗口。要回答这类问题，我们需要滑动窗口。\n\
  \n滑动窗口与滚动窗口一样是“固定大小”的，但与滚动窗口不同，它们可以重叠。当窗口重叠发生时，一个事件可能属于多个窗口。当滑动的持续时间小于窗口的持续时间时，就会发生重叠。\n\
  \n因此，在 Spark Streaming 中，定义滑动窗口需要两个参数：窗口大小（间隔）和滑动偏移量（重叠维度）。例如，在图 9-7 中，我们创建了一个大小为\
  \ 10 秒、滑动偏移量为 5 秒的滑动窗口。\n\n![](img/538349_1_En_9_Fig7_HTML.jpg)\n\n示意图包含一个计数器、三个编号窗格和三个窗口。计算出的数字分别对应滚动窗口部分和、滑动窗口部分和以及滑动窗口。\n\
  \n**图 9-7** 滑动偏移量为 5 秒的 10 秒滑动窗口\n\n在接下来的代码示例中，我们计算每十秒进入医院的总人数。该示例演示了如何在`Fecha`列上创建一个每十秒滑动一次、滑动偏移量为五秒的滑动窗口。\n\
  \n> **注意**  \n> 请注意，为了演示用法，设定的时间间隔非常短。应用于真实医院的相同代码可能会使用更宽的时间间隔。\n\n```scala\n//\
  \ 滑动窗口\nimport org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\n\
  import org.apache.spark.sql.types.{IntegerType, StringType, StructField, StructType,DoubleType,LongType}\n\
  import org.apache.spark.sql.{DataFrame, Dataset, Encoders, SparkSession}\nimport\
  \ java.io.IOException\nimport org.apache.spark.sql.streaming._\nimport org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.DataFrame\n\nval PatientsSchema = StructType(Array(\n\
  \  StructField(\"NSS\", StringType),\n  StructField(\"Nom\", StringType),\n  StructField(\"\
  DID\", IntegerType),\n  StructField(\"DNom\", StringType),\n  StructField(\"Fecha\"\
  , StringType))\n)\n\nval spark:SparkSession = SparkSession.builder()\n  .master(\"\
  local[10]\")\n  .appName(\"Hand-On-Spark3_Socket_Data_Source\")\n  .getOrCreate()\n\
  \nspark.sparkContext.setLogLevel(\"ERROR\")\nimport spark.implicits._\n\ntry {\n\
  \  val PatientDS = spark.readStream\n    .schema(PatientsSchema)\n    .json(\"/tmp/window\"\
  )\n\n  printf(\"\\n 正在监听，准备就绪... \\n\")\n\n  val PatientDF = PatientDS\n    .groupBy(window(col(\"\
  Fecha\"), \"10 seconds\", \"5 seconds\"))\n    .agg(count(\"DID\").alias(\"Suma_x_Dpt\"\
  ))\n\n  PatientDF.writeStream\n    .outputMode(\"complete\")\n    .format(\"console\"\
  )\n    .option(\"truncate\", false)\n    .start()\n    .awaitTermination()\n} catch\
  \ {\n  case e: IOException => println(\"发生 IOException 异常\")\n  case t: Throwable\
  \ => println(\"接收数据时出错\", t)\n} finally {\n  println(\"在 finally 块中\")\n}\n```\n\
  \n与之前滚动窗口示例中的做法相同，在尝试运行上述代码示例之前，首先需要创建 JSON 文件的数据源（本例中为`/tmp/window`文件夹）。之后，就可以开始向该目录写入\
  \ JSON 文件。例如：\n\n```bash\n$ cp json_file9.json /tmp/window\n$ cp json_file8.json\
  \ /tmp/window\n$ cp json_file7.json /tmp/window\n...\n$ cp json_file1.json /tmp/window\n\
  ```\n\n一旦复制了上述文件，根据你应用的复制速率，程序将创建一个大小为 10 秒、滑动间隔为 5 秒的窗口。每 5 秒就会创建一个新的 10 秒窗口，且该窗口与上一个窗口的起始位置相差\
  \ 5 秒，如下一个程序输出所示。\n\n```\n正在监听，准备就绪...\n\n批次：0\n```\n\n\n\n```text\n+------------------------------------------+----------+\n\
