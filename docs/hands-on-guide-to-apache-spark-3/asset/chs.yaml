  ### Pair RDD 上的转换


  在本节中，我们将回顾一些可以在 Pair RDD 上执行的重要转换。


  我们已经提到 RDD 本质上是不可变的；因此，在 RDD 上执行的转换操作会返回一个或多个新的 RDD，而不会修改原始 RDD，从而创建 RDD 血统，Spark
  利用它来优化代码执行并从故障中恢复。Apache Spark 利用 RDD 血统来重建丢失的 RDD 分区。RDD 血统或 RDD 依赖关系图的图形表示如图 3-3
