  ### 使用 Spark 处理复杂的嵌套 JSON 结构


  在现实生活中，你几乎不会遇到像前面示例中那样简单的 JSON 文件。特别是，如果你必须使用像 Apache Cassandra、MongoDB 等 NoSQL
  数据库，经常会遇到一个问题：需要将嵌套且复杂的 JSON 结构展平，以便作为 ETL^(⁷) 过程的一部分与 RDBMS 数据库交换数据，使其更易于人类阅读或便于数据分析。假设你有一个数据源，其模式如下所示：


  ```

  root

  |-- Book: struct (nullable = true)

  |    |-- Authors: array (nullable = true)

  |    |      |-- element: struct (containsNull = true)

  |    |      |     |-- firstname: string (nullable = true)

  |    |      |     |-- lastname: string (nullable = true)

  |    |-- DOI: string (nullable = true)

  |    |-- Editors: array (nullable = true)

  |    |      |-- element: struct (containsNull = true)

  |    |      |     |-- firstname: string (nullable = true)

  |    |      |     |-- lastname: string (nullable = true)

  |    |-- ISBN: array (nullable = true)

  |    |      |-- element: struct (containsNull = true)

  |    |      |     |-- Hardcover ISBN: string (nullable = true)

  |    |      |     |-- Softcover ISBN: string (nullable = true)

  |    |      |     |-- eBook ISBN: string (nullable = true)

  |    |-- Id: long (nullable = true)

  |    |-- Publisher: string (nullable = true)

  |    |-- Title: struct (nullable = true)

  |    |      |-- Book Subtitle: string (nullable = true)

  |    |      |-- Book Title: string (nullable = true)

  |    |-- Topics: array (nullable = true)

  |    |      |-- element: string (containsNull = true)

  |    |-- eBook Packages: array (nullable = true)

  |    |      |-- element: string (containsNull = true)

  ```


  并且你希望将其转换为如下所示的模式：


  ```

  root

  |-- Afirstname: string (nullable = true)

  |-- Alastname: string (nullable = true)

  |-- DOI: string (nullable = true)

  |-- Efirstname: string (nullable = true)

  |-- Elastname: string (nullable = true)

  |-- Hardcover ISBN: string (nullable = true)

  |-- Softcover ISBN: string (nullable = true)

  |-- eBook ISBN: string (nullable = true)

  |-- Id: long (nullable = true)

  |-- Publisher: string (nullable = true)

  |-- Book Subtitle: string (nullable = true)

  |-- Book Title: string (nullable = true)

  |-- Topics: string (nullable = true)

  |-- eBook Packages: string (nullable = true)

  ```


  因此，展平数据并得到一个最终的 Spark DataFrame，如图 4-6 所示。


  ![](img/538349_1_En_4_Fig6_HTML.jpg)


  一张表格显示了书籍信息，包括作者、ISBN、格式（精装、平装、电子书）、出版商、副标题、标题、主题和电子书包。


  图 4-6


  展平的嵌套 JSON 文件


  为此，Spark 提供了一些特定的函数，例如 `explode()`，用于为给定数组或映射中的每个元素返回一个新行。该函数接受一个包含数组或值映射的列名作为参数。当传入数组时，它会创建一个默认名为
  "`col`" 的新列，包含数组中的每个元素。当此函数接收映射时，它会创建两个默认名为 "`key`" 和 "`value`" 的新列，并为每个键和值创建一个新行。然而，`explode()`
  会忽略 null 或空值；因此，如果你也对这些值感兴趣，应该使用 `explode_outer()`，它在传入的数组或映射为 null 或空时返回 null。


  还有其他你可能感兴趣的补充函数，例如 `posexplode()` 和 `posexplode_outer()`。前者除了为数组或映射的元素创建列之外，还会创建一个名为
  "`pos`" 的额外列，用于保存数组和映射元素的位置。




  让我们通过图 4-6 中的示例来解释其中一些函数的工作原理。你可以随意取消下面代码片段中代码行的注释，并逐行运行代码，以观察模式结构和数据的演变过程：


  ```

  val dfMlBooks = spark.read.option("multiline", "true").json("file:///Users/aantolinez/Books_array.json")

  // dfMlBooks.show(false)

  val df2 =dfMlBooks.select("Book.*")

  // df2.printSchema()

  val df3=df2.select(explode_outer($"Authors"), col("DOI"), $"Editors", $"ISBN", col("Id"),
  col("Publisher"), $"Title", col("Topics"), $"eBook Packages")

  // df3.show(false)

  // df3.printSchema()

  val df4=df3.select(col("col.*"),  col("DOI"), explode_outer($"Editors"), $"ISBN",
  col("Id"), col("Publisher"), $"Title", col("Topics"), $"eBook Packages")

  // df4.show(false)

  // df4.printSchema()

  val df5=df4.select(col("firstname").alias("Afirstname"),col("lastname").alias("Alastname"),col("DOI"),
  col("col.*"),explode_outer($"ISBN"), col("Id"), col("Publisher"), $"Title", col("Topics"),
  $"eBook Packages")

  // df5.show(false)

  // df5.printSchema()

  val df6=df5.select(col("Afirstname"),col("Alastname"),col("DOI"),col("firstname").alias("Efirstname"),col("lastname").alias("Elastname"),col("col.Hardcover
  ISBN").alias("Hardcover ISBN"),col("col.Softcover ISBN").alias("Softcover ISBN"),col("col.eBook
  ISBN").alias("eBook ISBN"), col("Id"), col("Publisher"),col("Title.Book Subtitle").alias("Book
  Subtitle"),col("Title.Book Title").alias("Book Title") ,explode_outer($"Topics").alias("Topics"),
  $"eBook Packages")

  // df6.show(false)

  // df6.printSchema()

  val df7=df6.select(col("Afirstname"),col("Alastname"),col("DOI"),col("Efirstname"),
  col("Elastname"),col("Hardcover ISBN"),col("Softcover ISBN"),col("eBook ISBN"),col("Id"),col("Publisher"),col("Book
  Subtitle"),col("Book Title"),col("Topics"),explode_outer( $"eBook Packages").alias("eBook
  Packages"))

  // df7.show(false)

  // df7.printSchema()

  val df8=df7.select("*")

  df8.show(false)

  ```


  使用类似的 PySpark 代码也可以实现相同的结果。


  ### 使用 Spark 读写 CSV 文件


  Apache Spark SQL 提供了两个特定的函数来读写 CSV 文件。`spark.read().csv()` 方法将单个 CSV 文件或 CSV 文件目录读入
  DataFrame。此外，`dataframe.write().csv()` 方法将 Spark DataFrame 写入 CSV 文件。


  Spark 提供了 `option()` 和 `options()` 函数来自定义 `read()` 和 `write()` 的行为。后者允许一次性指定多个选项。


  我们将在下面的示例中了解如何使用上述这四个函数来加载和写入 CSV 文件。


  `read()` 函数的通用用法如下所示：


  ```

  val PATH ="Downloads/Spanish_Writers_by_Century_II.csv"

  val df0 = spark.read.csv(PATH)

  df0.show(5)

  // 输出

  +--------------------+

  |                 _c0|

  +--------------------+

  |Name;Surname;Cent...|

  |Gonzalo;de Berceo...|

  | Juan ;Ruiz;XIV;1283|

  |Fernando;de Rojas...|

  |Garcilaso;de la V...|

  +--------------------+

  ```


  如果使用 PySpark 代码，将得到完全相同的输出，如下所示：


  ```

  # 用于上传 Spanish_Writers_by_Century_II.csv 的 PySpark 版本

  PATH ="Downloads/Spanish_Writers_by_Century_II.csv"

  df0 = spark.read.csv(PATH)

  df0.show(5)

  ```


  我们可以利用 `option()` 函数来指定字段分隔符。默认的分隔符是“,”：


  ```

  val df1 = spark.read.option("delimiter", ";").csv(PATH)

  df1.show(5)

  // 输出

  +---------+----------+-------+-----------+

  |      _c0|       _c1|    _c2|        _c3|

  +---------+----------+-------+-----------+

  |     Name|   Surname|Century|YearOfBirth|

  |  Gonzalo| de Berceo|   XIII|       1196|

  |    Juan |      Ruiz|    XIV|       1283|

  | Fernando|  de Rojas|     XV|       1465|

  |Garcilaso|de la Vega|    XVI|       1539|

  +---------+----------+-------+-----------+

  ```


  要跳过第一行并将其用作列名，我们可以使用 `.option("header", "true")`：


  ```

  val df2 = spark.read.option("delimiter", ";").option("header", "true").csv(path)

  df2.show(5)

  // 输出

  +---------+------------+-------+-----------+

  |     Name|     Surname|Century|YearOfBirth|

  +---------+------------+-------+-----------+

  |  Gonzalo|   de Berceo|   XIII|       1196|

  |    Juan |        Ruiz|    XIV|       1283|

  | Fernando|    de Rojas|     XV|       1465|

  |Garcilaso|  de la Vega|    XVI|       1539|

  |   Miguel|de Cervantes|    XVI|       1547|

  +---------+------------+-------+-----------+

  ```


  可以使用 `options()` 函数一次性指定多个 CSV 操作选项：


  ```

  val df3 = spark.read.options(Map("inferSchema"->"true","delimiter"->";", "header"->"true")).csv(PATH)

  df3.show(5)

  // 输出

  +---------+------------+-------+-----------+

  |     Name|     Surname|Century|YearOfBirth|

  +---------+------------+-------+-----------+

  |  Gonzalo|   de Berceo|   XIII|       1196|

  |    Juan |        Ruiz|    XIV|       1283|

  | Fernando|    de Rojas|     XV|       1465|

  |Garcilaso|  de la Vega|    XVI|       1539|

  |   Miguel|de Cervantes|    XVI|       1547|

  +---------+------------+-------+-----------+

  ```


  压缩文件也可以使用“compression”选项上传：


  ```

  val GZIP_PATH = "Downloads/Spanish_Writers_by_Century_II.csv.gz"

  val df5 = spark.read.option("delimiter", ";").option("header", "true").option("compression",
  "gzip").csv(GZIP_PATH)

  df5.show(5)

  // 输出

  +---------+------------+-------+-----------+

  |     Name|     Surname|Century|YearOfBirth|

  +---------+------------+-------+-----------+

  |  Gonzalo|   de Berceo|   XIII|       1196|

  |    Juan |        Ruiz|    XIV|       1283|

  | Fernando|    de Rojas|     XV|       1465|

  |Garcilaso|  de la Vega|    XVI|       1539|

  |   Miguel|de Cervantes|    XVI|       1547|

  +---------+------------+-------+-----------+

  ```


  其他重要的选项包括 `nullValue`、`nanValue` 和 `dateFormat`。第一个选项允许设置一个表示空值的字符串。第二个选项允许指定一个字符串作为非数字值（默认为
  NaN）的表示。最后一个选项设置指示日期格式的字符串（默认为“yyyy-MM-dd”）。


  要将 Spark DataFrame 保存为 CSV 格式，我们可以使用 `write()` 函数。`write()` 函数接受一个文件夹作为参数。该目录代表输出路径，CSV
  文件以及一个 `_SUCCESS` 文件将被保存到该路径中：


  ```

  // 将 DataFrame 保存到 CSV 文件

  OUTPUT_PATH="Downloads/"

  df5.write.option("header","true").csv(OUTPUT_PATH)

  ```


  与其他文件格式（如 Parquet）一样，有几种保存选项可用：`Overwrite`、`Append`、`Ignore` 以及默认选项 `ErrorIfExists`。




  #### 读取和写入 Hive 表


  Apache Spark SQL 还提供了读取和写入存储在 Apache Hive 表中数据的能力。在本节中，我们将展示一个典型的 Spark 工作流程：从外部源（CSV
  文件）读取数据到 Spark DataFrame，然后将其保存到 Hive 表中。


  如果你还没有 Hive 数据库和表，第一步和第二步应该是创建它们：


  ```

  -- 创建我们将要使用的 Hive 数据库

  CREATE DATABASE IF NOT EXISTS spaniards;

  -- 创建我们将要使用的 Hive 表

  CREATE TABLE IF NOT EXISTS spaniards.writersByCentury (

  Name string,

  Surname string,

  Century string,

  YearOfBirth int )

  COMMENT ''按世纪划分的西班牙作家''

  ROW FORMAT DELIMITED

  FIELDS TERMINATED BY '','';

  ```


  创建好基本的 Hive 资源后，我们可以编写代码，从文件加载数据并将其保存到 Hive 表中：


  ```

  import java.io.File

  import org.apache.spark.sql.{Row, SaveMode, SparkSession}

  val warehouseLocation = "hdfs://localhost:9745/user/hive/warehouse"

  val spark = SparkSession

  .builder()

  .appName("Hands-On Spark 3")

  .config("spark.sql.warehouse.dir", warehouseLocation)

  .enableHiveSupport()

  .getOrCreate()

  import spark.implicits._

  import spark.sql

  val path = "file:///tmp/Spanish_Writers_by_Century.csv"

  val df = spark.read.option("header", "true").csv(path)

  df.show(5,false)

  // 输出

  +---------+------------+-------+-----------+

  |Name     |Surname     |Century|YearOfBirth|

  +---------+------------+-------+-----------+

  |Gonzalo  |de Berceo   |XIII   |1196       |

  |Juan     |Ruiz        |XIV    |1283       |

  |Fernando |de Rojas    |XV     |1465       |

  |Garcilaso|de la Vega  |XVI    |1539       |

  |Miguel   |de Cervantes|XVI    |1547       |

  +---------+------------+-------+-----------+

  ```


  ```

  // 现在将 DataFrame 保存到 Hive 表

  df.write.mode("overwrite").saveAsTable("spaniards.writersByCentury")

  ```


  保存数据后，我们可以前往 Hive 服务器检查数据是否已存在：


  ```

  hive> select * from spaniards.writersByCentury;

  OK

