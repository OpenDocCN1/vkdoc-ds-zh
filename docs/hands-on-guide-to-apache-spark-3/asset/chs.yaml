  IOException occurred\")\n  case t: Throwable => println(\"Error receiving data\"\
  , t)\n}\n```\n\n### 在本地运行文件系统流式应用\n\n在本例中，我们的程序将监控选定的 `/tmp/patient_streaming` 路径，并在\
  \ Spark 发现文件后立即处理复制到该路径的文件。\n\n与“在本地运行 Socket 结构化流式应用”部分类似，运行此处提供的文件系统数据源示例也取决于您选择的执行方式。您同样可以选择从之前提供的代码片段构建自己的\
  \ JAR 文件，或使用笔记本版本。无论哪种方式，运行该应用都包含两个步骤：\n\n1.  根据您运行应用的方式\n    1.  如果您使用 JAR 文件，请在计算机上打开一个终端，并按如下所示执行您的应用：\n\
