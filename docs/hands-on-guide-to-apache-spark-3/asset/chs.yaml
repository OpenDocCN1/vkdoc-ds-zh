  当我们想要合并 DataFrame 时，另一个非常有用的 Spark 方法是 `unionByName()`。`unionByName()` 允许按列名而非列位置来合并多个
  DataFrame；因此，当 DataFrame 具有相同的列名但位置不同时，它非常适用。


  自 Spark 3 版本起，`unionByName()` 函数引入了 `allowMissingColumns` 参数。当 `allowMissingColumns`
  设置为 `true` 时，它允许在某个 DataFrame 缺少某些列的情况下进行合并。


  在下面的示例中，我们合并了 DataFrame `dfCOP1`：


  ```

  val dfCOP1=spark.read.option("header", "true").csv("file:///Users/aantolinez/Downloads/Crude_Oil_Production_1.csv")

  dfCOP1.show(5)

