- "# 8. 流式数据源与接收端\n\n在上一章中，我们介绍了端到端 Structured Streaming 流程的基础知识。请记住，Apache Spark\
  \ Structured Streaming 的基础是：使用 `SparkSession.readStream()` 方法从数据源摄取数据来创建流式 DataFrame，使用处理引擎对其应用业务逻辑，然后使用\
  \ `DataFrame.writeStream()` 将结果 DataFrame 输出到数据接收端。\n\n在本章中，我们将深入探讨内置数据源和接收端的使用，以及如何使用\
  \ `foreachBatch()` 和 `foreach()` 方法创建您自己的自定义流式数据源和接收端，以实现您自己的功能，并将数据写入 Spark Structured\
  \ Streaming 原生支持之外的存储系统。\n\n## 8.1 Spark 流式数据源\n\n请记住，我们在上一章中看到 Spark 支持多种用于数据摄取的输入源。其中一些是所谓的内置源：\n\
  \n- **文件源**：用于从文件系统流式读取数据。支持的文件格式有 text、CSV、JSON 和 Parquet。\n- **Kafka 源**：用于从 Kafka\
  \ 主题读取数据。需要 Kafka 0.10.0 或更高版本。\n\n此外，还有其他一些主要被视为用于测试的数据源，因为它们不具备容错性：\n\n- **Socket\
  \ 源**：从 TCP/IP socket 连接读取数据。\n- **速率源**：以指定的每秒行数生成随机数据，每行数据有两列：“timestamp”和“value”。\n\
  - **每微批次速率源**：类似于“速率”源，但在此情况下，无论查询执行配置如何，它都会为每个微批次生成一组一致的输入行。例如，批次 0 将生成区间 [0, 999]\
  \ 内的值，批次 1 将生成区间 [1000, 9999] 内的值，依此类推。\n\n### 从文件数据源读取流式数据\n\nApache Spark Structured\
  \ Streaming 原生支持从文件系统进行流式读取，使用的文件格式与批处理中支持的格式相同（text、CSV、JSON、ORC 和 Parquet）。\n\n\
  Spark Structured Streaming 使用 `DataStreamReader` 类从文件系统文件夹流式读取文本文件。当您将目录定义为流式源时，Spark\
  \ 会将该位置出现的文件视为数据流。这意味着 `FileStreamSource` 是一种源，它会在 Spark 发现目录中的文本格式文件时读取它们。以下是如何设置基本文件源流式处理的示例：\n\
  \n```\nval df = spark.readStream\n.format(\"text\")\n.option(\"maxFilesPerTrigger\"\
  , 1)\n.load(\"/tmp/logs\")\n```\n\n您还可以指定数据的模式，例如：\n\n```\nval PatientsSchema =\
  \ StructType(Array(\nStructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\n\
  StructField(\"DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"\
  Fecha\", StringType) )\n)\n```\n\n然后，您可以基于上述模式读取文件：\n\n```\nval df = spark\n.readStream\n\
  .schema(PatientsSchema)\n.json(\"/tmp/patient_streaming\")\n```\n\n在我们前面的示例中，返回的\
  \ `df` 流式 DataFrame 将具有 `PatientsSchema`。当流处理启动时，`/tmp/patient_streaming` 源目录必须存在。\n\
  \n使用文件源时，需要记住一些要点：\n\n**图 8-1** – 文件数据流处理模式\n\n示意图展示了文件的排列方式。已处理的文件位于中心，被忽略的文件位于左侧，沿着流时间线排列。\n\
  \n- 如前所述，流处理启动时源目录必须存在。\n- 流式传输到源目录的所有文件必须具有相同的格式，也就是说，它们必须都是 text、JSON、Parquet\
  \ 等格式，并且如果我们希望保持数据完整性并避免错误，模式也必须相同。\n- 流式作业开始时，指定文件夹中已存在的文件将被忽略。此概念如图 8-1 所示。\n\
  - Spark 使用列出文件的系统工具来识别新文件。因此，出现在流式目录中的文件必须是完整且已关闭的，因为 Spark 一旦发现它们就会立即处理。因此，任何数据添加或文件更新都可能导致数据丢失。\n\
  - 当 Spark 处理一个文件时，它会在内部被标记为已处理。因此，即使文件被更新，也不会被再次处理。\n- 如果需要处理多个文件，但 Spark 在下一个微批次中只能处理其中一部分，那么将优先处理时间戳最早的文件。\n\
  \n创建新的 `FileStreamSource` 实例时，有两个主要选项可用：\n\n- **schema**：正如我们已经提到的，这是数据的模式，在实例化时指定。\n\
  - **maxFilesPerTrigger**：指定每个微批次读取的最大文件数。因此，它用于将流读取速率控制为每个触发器的最大文件数。\n\n下面是一个代码示例，其中我们从文件源流式读取数据。此示例包括用作数据源的文件模式，从目录流式读取数据，并将转换结果输出到控制台：\n\
  \n\n\n```scala\npackage org.apress.handsOnSpark3\nimport org.apache.spark.sql.SparkSession\n\
  import org.apache.spark.sql.functions._\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType}\nimport java.io.IOException\nobject dStreamsFiles\
  \ {\ndef main(args: Array[String]): Unit = {\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Fecha\"\
  , StringType)\n)\n)\ntry {\nval spark: SparkSession = SparkSession\n.builder()\n\
  .master(\"local[3]\")\n.appName(\"Hand-On-Spark3_File_Data_Source\")\n.getOrCreate()\n\
  spark.sparkContext.setLogLevel(\"ERROR\")\nval df = spark\n.readStream\n.schema(PatientsSchema)\n\
  .json(\"/tmp/patient_streaming\")\nval groupDF = df.select(\"DID\")\n.groupBy(\"\
  DID\").agg(count(\"DID\").as(\"Accumulated\"))\n.sort(desc(\"Accumulated\"))\nprintf(\"\
  \\n Listening and ready... \\n\")\ngroupDF.writeStream\n.format(\"console\")\n.outputMode(\"\
  complete\")\n.option(\"truncate\", false)\n.option(\"newRows\", 30)\n.start()\n\
  .awaitTermination()\n} catch {\ncase e: IOException => println(\"IOException occurred\"\
  )\ncase t: Throwable => println(\"Error receiving data\", t)\n} finally {\nprintln(\"\
  Finally block\")\n}\n}\n}\n```\n\n接下来，我们将转向另一个内置数据源，也是目前最常用的数据源之一。首先，我们将介绍 Kafka\
  \ 的基础知识，然后提供一个实践示例。\n\n### 从 Kafka 读取流式数据\n\nApache Kafka 是一个开源、分布式、持久化且高度可扩展的事件流平台，支持开发实时、事件驱动的应用程序等功能。Kafka\
  \ 将事件组织并存储在主题（topic）中，主题是 Kafka 最基本的事件组织单元。主题是一个命名的事件日志，类似于关系数据库中的表。日志中的事件是不可变且持久的，这意味着事件一旦发生，就无法更改或删除——它们保持不变，并可以在主题中保留一段定义的时间，或者最终无限期保留。包含事件的\
  \ Kafka 日志/主题是存储在磁盘上的文件。\n\nKafka 组件在 Kafka 架构中如何交互的示例如图 8-2 所示。\n\n![](img/538349_1_En_8_Fig2_HTML.png)\n\
  \nKafka 架构包括生产者、主题、代理、分区和消费者，用于实现可靠的数据处理和存储。\n\n**图 8-2** Kafka 架构\n\nKafka 有四个主要能力：\n\
  \n*   Kafka 允许应用程序发布或订阅事件流，使其能够实时响应事件。\n*   Kafka 管理记录，并保持其发生的顺序。\n*   Kafka 是一个容错且可扩展的系统，能够实时处理记录。\n\
  *   主题的简单语义使 Kafka 能够提供高水平的持续输入和输出吞吐量，并促进数据复制以增强容错能力。Kafka 主题被分区和复制，有助于为大量消费者维持高性能的同步事件投递服务。\n\
  \n在图 8-3 中，你可以看到 Kafka 概念（主题、数据分区和副本）的图形化表示。\n\n![](img/538349_1_En_8_Fig3_HTML.jpg)\n\
  \nKafka 概念示意图包含 3 个垂直代理和 3 个水平分区（编号 0 到 2）。分区即主题。分区包含主数据和副本数据。\n\n**图 8-3** Kafka\
  \ 的主题、分区和副本概念\n\nKafka 的能力可以通过四个 API 来利用：\n\n*   **生产者 API**：用于将事件或事件流发布到 Kafka\
  \ 主题。\n*   **消费者 API**：应用程序使用它来订阅一个或多个主题，消费存储在主题中的数据流。主题中的信息可以实时消费，也可以从历史记录中读取。\n\
  *   **流处理 API**：此 API 比生产者和消费者 API 更复杂，提供了构建复杂数据和事件流处理的能力。例如，它可用于设置端到端的流作业，接收信息、分析信息，并在需要时进行转换。\n\
  *   **连接器 API**：此 API 旨在开发连接器，以自动化进出 Kafka 集群的数据流。\n\nApache Kafka 和 Spark Streaming\
  \ 经常一起使用来处理实时数据流。将 Kafka 和 Spark 结合可以构建一个可靠、高性能且可扩展的流数据处理管道，能够应对复杂的事件处理。Kafka-Spark\
  \ Streaming 集成架构的示意图如图 8-4 所示。\n\n![](img/538349_1_En_8_Fig4_HTML.jpg)\n\n示意图如下：数据源流向\
  \ Kafka。从 Kafka 进入容错存储。从 HDFS 通过 Spark Streaming 和 Kafka Sink 到达 Kafka。从流处理分支为报告、监控和工作流。\n\
  \n**图 8-4** Kafka-Spark Streaming 集成架构\n\n使用 Kafka-Spark Streaming 实现数据处理管道包括：从\
  \ Kafka 主题摄取数据，使用 Spark Streaming 操作和分析数据，然后将处理后的数据存储到最终的数据接收器，或作为另一管道的一部分将其重新注入另一个\
  \ Kafka 主题。\n\n\n\n在以下代码片段中，你将看到一个示例，展示了 Apache Kafka 和 Apache Spark Structured\
  \ Streaming 如何协同工作，以实现高度可扩展的实时处理架构：\n\n```\npackage org.apress.handsOnSpark3.com\n\
  import org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions.{col,\
  \ from_json}\nimport org.apache.spark.sql.types.{IntegerType, StringType, StructType,\
  \ StructField}\nobject SparkKafka {\ndef main(args: Array[String]): Unit = {\nval\
  \ spark: SparkSession = SparkSession.builder\n.master(\"local[3]\")\n.appName(\"\
  SparkStructuredStreamingHospital\")\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\nimport spark.implicits._\nval df = spark.readStream\n.format(\"kafka\"\
  )\n.option(\"kafka.bootstrap.servers\", \"localhost:9092\")\n.option(\"subscribe\"\
  , \"patient\")\n.option(\"startingOffsets\", \"earliest\")\n.load()\ndf.printSchema()\n\
  val PatientsSchema = StructType(Array(\nStructField(\"NSS\", StringType),\nStructField(\"\
  Nom\", StringType),\nStructField(\"DID\", IntegerType),\nStructField(\"DNom\", StringType),\n\
  StructField(\"Fecha\", StringType))\n)\nval patient = df.selectExpr(\"CAST(value\
  \ AS STRING)\")\n.select(from_json(col(\"value\"), PatientsSchema).as(\"data\"))\n\
  .select(\"data.*\")\npatient.printSchema()\nval query = patient.writeStream\n.format(\"\
  console\")\n.outputMode(\"append\")\n.start()\n.awaitTermination()\n}\n}\n```\n\n\
  代码准备就绪后，就可以开始尝试了。我们要做的第一件事是启动 Kafka 环境。\n\n**注意**\n\n在本书编写时，Kafka 3.4.0 是最新版本，也是我们示例中使用的版本。要执行前面展示的代码，你的本地环境必须安装\
  \ Java 8+。\n\nApache Kafka 可以使用 ZooKeeper 或 KRaft 启动。在本书中，我们只使用前者。\n\n首先，打开一个终端会话，从你的\
  \ `$KAFKA_HOME` 目录执行以下命令，以正确的顺序启动所有服务。运行以下命令，使用默认配置启动 ZooKeeper 服务：\n\n```\n$ bin/zookeeper-server-start.sh\
  \ config/zookeeper.properties\n```\n\n其次，打开另一个终端会话，运行以下命令，同样使用默认配置启动 Kafka 代理服务：\n\
  \n```\n$ bin/kafka-server-start.sh config/server.properties\n```\n\n一旦所有前面的服务成功运行，一个基本的\
  \ Kafka 环境就可以使用了。然而，在我们写入第一个事件之前，必须创建一个主题。\n\n因此，打开另一个终端会话，运行以下代码创建一个 `patient`\
  \ 主题，用于我们的医院队列管理系统数据示例：\n\n```\n$ bin/kafka-topics.sh --create --topic patient --bootstrap-server\
  \ localhost:9092\n```\n\n不带任何参数的 `kafka-topics.sh` 命令也可以用来显示使用信息。例如，它可以用来显示新主题的详细信息，比如\
  \ `patient` 主题的分区数、副本等。你可以执行以下命令和选项来显示这些信息：\n\n```\nbin/kafka-topics.sh --describe\
  \ --topic patient --bootstrap-server localhost:9092\nTopic: patient    TopicId:\
  \ Bhq8M7cgTVqRrV18nT7dzg    PartitionCount: 1    ReplicationFactor: 1    Configs:\n\
  Topic: patient    Partition: 0    Leader: 0    Replicas: 0    Isr: 0\n```\n\n现在是时候向刚刚创建的\
  \ `patient` 主题写入一些事件并查看结果了。为此，我们将使用位于 Kafka 目录中的 `bin/kafka-console-producer.sh`\
  \ 创建一个 Kafka 生产者。\n\nKafka 生产者是一个客户端应用程序，它与 Kafka 代理通信，将事件写入主题。一旦收到信息，代理就会将其保存在容错存储中，只要我们需要，理论上可以永久保存。这就是我们的\
  \ Spark 应用程序能够异步消费示例主题中存储的信息的原因。\n\n要了解其工作原理，请打开一个新的终端会话，并运行生产者控制台客户端，如下所示，向刚刚创建的\
  \ `patient` 主题写入一些事件。在此示例中，我们将使用第 6 章 JSON 文件中的数据。默认情况下，你输入的每一行都将成为写入 `patient`\
  \ 主题的一个新事件：\n\n```\n$ bin/kafka-console-producer.sh --topic patient --bootstrap-server\
  \ localhost:9092\n>{\"NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"\
  Gastro\", \"Fecha\":\"01-09-2022\"}\n>{\"NSS\":\"5678\",\"Nom\":\"Sonia\", \"DID\"\
  :50, \"DNom\":\"Gineco\", \"Fecha\":\"01-09-2022\"}\n>{\"NSS\":\"6789\",\"Nom\"\
  :\"Eduardo\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n>{\"NSS\"\
  :\"1234\",\"Nom\":\"María\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"\
  }\n>{\"NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\", \"Fecha\"\
  :\"01-09-2022\"}\n> . . .\n> . . .\n> . . .\n>{\"NSS\":\"2345\",\"Nom\":\"Emilio\"\
  , \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n>{\"NSS\":\"3456\"\
  ,\"Nom\":\"Marta\", \"DID\":30, \"DNom\":\"Endo\", \"Fecha\":\"01-09-2022\"}\n>{\"\
  NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\", \"Fecha\":\"\
  01-09-2022\"}\n>{\"NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\"\
  , \"Fecha\":\"01-09-2022\"}\n>{\"NSS\":\"5678\",\"Nom\":\"Sonia\", \"DID\":50, \"\
  DNom\":\"Gineco\", \"Fecha\":\"01-09-2022\"}\n>{\"NSS\":\"6789\",\"Nom\":\"Eduardo\"\
  , \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n>{\"NSS\":\"1234\"\
  ,\"Nom\":\"María\", \"DID\":10, \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n\
  ```\n\n将 JSON 文件的内容粘贴到 Kafka 生产者控制台后，按如下方式运行你的示例程序：\n\n```\n$SPARK_HOME/bin/spark-submit\
  \ --class org.apress.handsOnSpark3.com.SparkKafka --master yarn --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.2.0\
  \ /PATH/TO/JAR/FILE/HandsOnSpark3-Structured_Streaming_Hospital-1.0.jar\n```\n\n\
