  , StringType)\n))\n\ntry {\n  val df = spark.readStream.schema(PatientsSchema)\n\
  \    .json(\"/tmp/patient_streaming\")\n\n  val groupDF = df.select(\"DID\")\n \
  \   .groupBy(\"DID\").agg(count(\"DID\").as(\"Accumulated\"))\n    .sort(desc(\"\
  Accumulated\"))\n\n  groupDF.writeStream\n    .format(\"console\")\n    .outputMode(\"\
  complete\")\n    .option(\"truncate\", false)\n    .option(\"newRows\", 30)\n  \
