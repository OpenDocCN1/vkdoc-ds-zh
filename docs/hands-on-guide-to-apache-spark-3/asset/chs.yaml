  \ using approx_count_distinct() instead.\"`\n\n### 内置聚合函数\n\nSpark Streaming 的内置聚合函数简化了数据汇总过程，这是数据分析的重要组成部分。要使用它们，您需要指定一个用于分组的聚合键，以及定义如何在\
  \ DataFrame 列上执行转换的聚合函数。\n\n表 7-3 列出了 DataFrame 最常用的聚合函数。有关列操作的完整聚合函数列表，请参阅官方文档。^(²⁰)\n\
  \n### 用户自定义聚合\n\n最后，Spark Structured Streaming 支持用户自定义聚合函数。请查阅 Spark SQL 指南以获取更多和更新的详细信息。\n\
  \n## 7.6 Spark 检查点流式处理\n\n为了提供容错能力，Spark 使用检查点来确保能从故障中恢复。检查点用于将中间信息状态持久化到文件系统存储中，Spark\
  \ 在发生故障时可以从中读取。在有状态流式处理中，必须应用检查点，以便在发生故障时能够恢复过渡状态。\n\n在“Spark 有状态流式处理”一节中研究并在图 7-3\
  \ 中描绘的 `StateStore` 支持增量检查点，这意味着只保存更新的键值对，而不会修改流式处理过程中存在的其他键值对。\n\n为了在我们的流式医院排队管理系统应用示例中加入检查点支持，我们将按如下方式更新之前的代码片段：\n\
  \n```\nimport org.apache.spark.sql.streaming._\n// ...\nval checkpointDir = \"/tmp/streaming_checkpoint\"\
  \n// ...\ncounts.writeStream\n// ...\n.trigger(Trigger.ProcessingTime(\"5 seconds\"\
  ))\n.option(\"checkpointLocation\", checkpointDir)\n// ...\n.start()\n.awaitTermination()\n\
  ```\n\n如您所见，我们引入了几个新特性，下面将逐一解释：\n\n### Trigger（触发器）\n\n定义流式查询必须多久被触发（运行）一次，以处理新可用的流式数据——换句话说，就是我们的应用程序需要以多高的频率检查数据源以寻找新信息，并可能发出新数据。`Trigger`\
  \ 被引入 Spark 用于设置流批处理周期。\n\n`ProcessingTime` 是一种触发器，它以毫秒为最小时间单位。`ProcessingTime(interval:\
  \ String)` 接受带或不带间隔字符串的 `CalendarInterval` 实例，例如：\n- **带间隔字符串**：`ProcessingTime(\"\
  interval 10 seconds\")`\n- **不带间隔字符串**：`ProcessingTime(\"10 seconds\")`\n\n有四种工厂方法（选项）：\n\
  - **默认**：如果未设置触发器，流式查询会在前一个微批次完成后立即一个接一个地运行微批次。\n- **OneTimeTrigger**：设置此触发器模式后，它执行一次触发器然后停止。流式查询将仅在一个微批次中执行可用的数据。此触发器模式的一个用例是将其用作一种每日批处理，以节省计算资源和资金。示例：`.trigger(Trigger.Once)`。\n\
  - **ProcessingTime**：用户可以定义 `ProcessingTime` 参数，流式查询将按设定的间隔被触发，执行新的微批次并可能发出新数据。\n\
  - **ContinuousTrigger**：在本书编写时，连续处理是 Spark 2.3 中引入的一种实验性流式执行模式。^(²¹) 它旨在实现低延迟（约\
  \ 1 毫秒），并提供至少一次保证。为了提供容错能力，必须提供一个检查点间隔作为参数。示例：`.trigger(Trigger.Continuous(\"1 second\"\
  ))`。1 秒的检查点间隔意味着流引擎将每秒记录查询的中间结果。每个检查点都以与微批次引擎兼容的结构写入；因此，在发生故障后，正在进行的（受支持的）查询可以通过任何其他类型的触发器重新启动。例如，使用微批次模式启动的受支持查询可以在连续模式下重新启动，反之亦然。连续处理模式仅支持无状态查询，例如\
  \ `select`、`map`、`flatMap`、`mapPartitions` 等，以及 `where`、`filter` 等选择操作。连续模式支持所有\
  \ SQL 函数，但聚合函数 `current_timestamp()` 和 `current_date()` 除外。\n\n### checkpointLocation（检查点位置）\n\
  \n此参数指向为状态存储持久化而创建的文件系统目录。为了使存储具有容错能力，必须将选项 `checkpointLocation` 设置为 `writeStream`\
  \ 输出配置的一部分。\n\n状态存储使用检查点文件夹主要存储：\n- 数据检查点\n- 元数据检查点\n\n如果我们使用有状态操作，Spark Streaming\
  \ 检查点文件夹和状态数据表示文件夹的结构将如表 7-4 所示。\n\n**表 7-4** Spark Streaming 检查点与状态数据表示结构\n\n|\
  \ `checkpointLocation` 文件夹结构 | 状态数据表示 |\n| --- | --- |\n| `/tmp/streaming_checkpoint`<br>├──\
  \ **commits**<br>│   ├── `0`<br>│   ├── `1`<br>│   ├── `2`<br>│   └── `3`<br>├──\
  \ `metadata`<br>├── **offsets**<br>│   ├── `0`<br>│   ├── `1`<br>│   ├── `2`<br>│\
  \   └── `3`<br>└── **state**<br>      └── `0` | └── **state**<br>    └── **0**<br>\
  \        ├── **0**<br>        │   ├── `1.delta`<br>        │   ├── `2.delta`<br>\
  \        │   ├── `3.delta`<br>        │   ├── `4.delta`<br>        │   └── `_metadata`<br>\
  \        │   └── `schema`<br>        ├── **1**<br>        │   ├── `1.delta`<br>\
  \        │   ├── `2.delta`<br>        │   ├── `3.delta`<br>        │   └── `4.delta`<br>\
  \        ├── **10**<br>        │   ├── `1.delta`<br>        │   ├── `2.delta`<br>\
  \        │   ├── `3.delta`<br>        │   └── `4.delta` |\n\n\n\n### 通过检查点从故障中恢复\n\
  \n在发生故障或计划内关闭时，可以借助持久化在检查点目录中的中间信息，将查询精确恢复到其停止的位置。此外，恢复后，流式查询中允许进行某些更改，而其他更改则不允许。例如，您可以将查询的接收端从文件改为\
  \ Kafka，但不能反过来。您可以查阅 Structured Streaming 编程指南文档，了解从同一检查点位置重启流式查询时，允许和不允许更改的最新列表。^((22))\n\
  \n## 7.7 总结\n\n在本章中，我们介绍了 Spark Structured Streaming 模块。首先，我们研究了消息传递可靠性机制的一般语义。其次，我们将\
  \ Structured Streaming 与基于 DStream 的 Spark Streaming 进行了比较。之后，我们解释了 Spark Structured\
  \ Streaming 架构背后的技术细节，例如输入表和结果表以及支持的不同输出模式。此外，我们还介绍了用于 DataFrame 和 Dataset 的流式 API，以及\
  \ Structured Streaming 的无状态和有状态转换与聚合，并给出了一些有趣的示例，这些示例将帮助您学习如何实现这些功能。最后，我们研究了流式检查点和恢复的概念，并给出了一些实际示例。在下一章中，我们将继续学习流式数据源和接收端。\n\
