  ### 合并包含重复值的 DataFrame


  与其他 SQL 函数不同，Spark 的 `union()` 在合并 DataFrame 后不会去除重复值。如果你不希望最终 DataFrame 中包含重复值，可以在合并后使用
  `distinct()` 函数将其移除。`distinct()` 函数用于过滤重复值。接下来是一个如何移除重复记录的示例。


  在此示例中，我们希望合并 `dfCOP5` 和 `dfCOP4` 这两个 DataFrame。如下所示，`dfCOP5` 和 `dfCOP4` 都包含了 2015
  年的记录，因此合并后的 DataFrame 中会出现重复的 2015 年行：


