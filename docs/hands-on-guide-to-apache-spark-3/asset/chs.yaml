  '
- "# 7. Spark Structured Streaming\n\n如今，在大数据领域，越来越多的业务流程和日常应用需要大规模地分析实时或近实时信息。实时数据分析通常与需要快速、无延迟做出决策的流程相关联。因此，能够提供即时分析、管理持续流动的数据、具备容错能力并处理掉队者或慢速组件的基础设施是必不可少的。\n\
  \n考虑到定义数据流的主要特征，其中：\n\n- 信息是连续的\n- 信息是无界的\n- 数据产生具有高容量和高速度\n- 信息对时间敏感\n- 数据源具有异构性\n\
  \n我们可以推断，在这种环境中，数据故障和掉队者^(¹⁵) 是必然会发生的情况。\n\n数据故障和掉队者对流数据处理构成了严峻挑战。例如，如果我们不知道事件发生的顺序，又如何能从到达流处理系统的一系列事件中获取洞察呢？\n\
  \n流处理使用时间戳^(¹⁶) 来对事件进行排序，并包含了关于流事件处理的不同时间概念：\n\n- *事件时间*：对应于设备生成事件的时间点。\n- *摄入时间*：事件到达流处理架构的时间。\n\
  - *处理时间*：指计算机开始处理事件的时间。\n\n在第 6 章中，我们看到 Spark 为了跟上信息流的动态特性并应对前述挑战，首次尝试引入了 Apache\
  \ Spark Streaming（`DStream` API）。我们还研究了 `DStreams` 或离散化流是在 Spark 的弹性分布式数据集（`RDD`）数据结构之上实现的。`DStream`\
  \ 通过将连续流动的数据分割成小块，然后作为微批次进行处理，从而处理连续数据流。\n\n使用低级的 `RDD` API 既有优点也有缺点。第一个缺点是，顾名思义，它是一个低级框架；因此，需要更高的技术技能才能充分利用它，并且由于数据序列化和内存管理，会带来性能问题。序列化对于分布式系统性能至关重要，可以最大限度地减少网络间的数据混洗；因此，如果管理不当，可能会导致内存过度使用和网络瓶颈等诸多问题。\n\
  \n## 7.1 消息传递可靠性的通用规则\n\n在此，我们介绍在后续章节中将会遇到的通用消息传递语义，以及每种语义在流数据处理基础设施中的重要性。\n\n执行复杂的实时流分析并非易事。为了说明消息传递可靠性在实时流分析中的重要性，考虑一个流式应用程序，它从分布在多个位置的远程主机或传感器（通常可称为参与者）收集实时事件。同时考虑这些参与者将连接到不同的网络拓扑和不同质量的硬件，这些硬件在消息延迟（消息在网络中从一个点传输到另一个点所需的时间）、带宽（电子通信系统的数据传输能力）和可靠性方面存在明显差异。因此，事件传输涉及的步骤越多，消息序列出现故障的可能性就越大。\n\
  \n当考虑到所有这些因素时，我们得出结论：对于实时数据流处理，我们只能依赖那些始终得到保证的属性，以实现完全的参与者位置透明性和严格的消息传递保证。\n\n关于消息传递可靠性机制的语义，有以下三个基本类别：\n\
  \n- *至多一次（at-most-once delivery）*：此语义意味着消息被传递一次或根本不传递（以即发即忘的方式）。这意味着消息可能会丢失。就最高传递性能和最少实现开销而言，它是最经济的，因为在发送过程或传输过程中都不保留任何状态。由于它消除了等待消息代理确认的开销，因此适用于那些实现高吞吐量至关重要，并且丢失一些消息不会显著影响最终结果的用例，例如，通过监听社交网络上的帖子来分析客户情绪。在数百万条帖子中，丢失几条可能不会对最终结论产生重大影响。\n\
  \n- *至少一次（at-least-once delivery）*：在此语义下，可能会进行多次尝试，以确保至少有一条消息到达目的地。它适用于那些不太关心数据重复，但确保不丢失任何消息至关重要的用例，例如，监控关键组件或人体生命体征（体温、脉搏率、呼吸率、血压等）的传感器。\n\
  \n- *恰好一次（exactly-once delivery）*：此语义意味着消息既不会丢失也不会重复。消息被传递并读取一次。因此，向目的地进行恰好一次的传递。\n\
  \n尽管有大量文献认为实现恰好一次传递是不可能的，因为它意味着保证消息被传递给接收者一次且仅一次，但从理论角度来看，它是存在的，并且我们在本书中会考虑这一点。\n\
  \n\n\n## 7.2 结构化流 vs. Spark Streaming\n\n仅考虑 Spark 的统一版本和模块，`Spark Streaming` 和\
  \ `Spark Structured Streaming` 都使用默认的微批处理模型；然而，`Spark Streaming` 采用 `DStreams`，而\
  \ `Spark Structured Streaming` 则使用数据集/DataFrame。`DStream` 由一系列永久的 `RDDs` 表示，`RDDs`\
  \ 是 Spark 中驻留在内存中的不可变、分布式数据集的概念。`DStream` 依赖 `RDDs` 提供底层转换和处理。另一方面，`Structured Streaming`\
  \ 利用 `DataFrame` 和 `Dataset` API，提供了更高层次的抽象，并允许使用类似 SQL 的操作函数。由于 `RDDs` 属于底层 API，它们只能处理事件摄入时间（也称为处理时间或事件进入引擎的时间），因此无法高效处理乱序事件。相反，`Structured\
  \ Streaming` 可以基于事件时间（事件生成的时间）处理数据，从而提供了一种处理延迟到达和乱序事件的解决方案。Spark `RDDs` 无法优化，因此更容易产生低效的数据转换，优化需要程序员额外的工作。\n\
  \n此外，使用 `DStream` 构建支持精确一次交付策略的流内处理管道并不直接。虽然可以实现，但需要编程变通方法。相比之下，`Structured Streaming`\
  \ 为流内处理引入了新的有价值概念：\n\n*   精确一次保证的消息传递规则默认实现；因此，理论上数据只被处理一次，重复数据会从结果中移除。\n*   基于事件时间的流内处理带来了前述优势。\n\
  \n使用 `DStreams` 和 `Structured Streaming` 的另一个重要区别在于是否需要流式接收器。`DStream` 的流式输出是 `RDDs`，可以进行操作，因此不需要流式接收器作为最终输出；而\
  \ Spark `Structured Streaming` 则需要一个流式接收器。\n\n另一个区别在于对实时流式处理的处理方式。`DStream` 通过将数据堆积成微批次来模拟实时处理，而\
  \ Spark `Structured Streaming` 使用无界表的概念（我们将在本章后面详细解释），以持续将实时事件添加到流中。\n\nSpark `DStreams`\
  \ 和 Spark `Structured Streaming` 之间的另一个显著区别在于端到端流式处理过程的执行方式。一方面，Spark `Structured\
  \ Streaming` 有一个专用线程来检查是否有新数据到达流中，并且当且仅当有新信息需要处理时，才会执行流查询。另一方面，当 Spark Streaming\
  \ 程序运行时，`DStream` 的微批次会根据 `StreamingContext()` 方法的 `batchDuration` 时间间隔参数执行，无论是否有实时信息，`DStream`\
  \ 都会生成一个 `RDD`。\n\n## 7.3 什么是 Apache Spark Structured Streaming？\n\nApache Spark\
  \ Structured Streaming 是在 Spark 2.0 中引入的。Spark Structured Streaming 是一个可扩展的近实时流处理引擎，提供端到端的容错能力，并保证精确一次处理。Spark\
  \ Structured Streaming 构建在 Spark SQL 库之上，因此原生集成了 Spark SQL 的代码和内存优化，并便于使用 SQL。Structured\
  \ Streaming 基于 `Dataframe` 和 `Dataset` API。\n\nSpark Structured Streaming 融合了多个新颖的概念，其中最重要的包括：\n\
  \n*   输入表\n*   结果表\n*   输出模式\n*   数据集和 DataFrame 流式 API\n*   事件时间窗口操作\n*   水印\n\
  *   流式数据去重\n*   状态存储（一个版本化的键值存储）\n*   输出接收器\n\n接下来，我们将解释其中一些概念背后的原理。其他概念将在后续章节中解释。\n\
  \n### Spark Structured Streaming 输入表\n\nSpark Structured Streaming 使用“输入表”的概念来处理每个输入数据，该概念可以类比为图\
  \ 7-1 中描述的“无界输入表”抽象。无界表的概念意味着到达系统的每一条新数据都会作为新行追加到表中。\n\n![](img/538349_1_En_7_Fig1_HTML.jpg)\n\
  \n示意图展示了实时数据流通过持续追加数据流入无界输入表。\n\n图 7-1 Spark Structured Streaming 无界输入表流程图\n\n因此，使用\
  \ Structured Streaming，计算是增量执行的，随着数据的到来持续更新结果，这使得流式数据处理能够以与批处理静态数据相同的方式表示。\n\n###\
  \ Spark Structured Streaming 结果表\n\nSpark Structured Streaming 中的“结果表”也可以类比为一种无界输出表。结果表最终是对输入数据执行每次查询的结果。每当有新信息添加到无界输入表时，都会触发无界输出表的更新，从而根据设定的输出模式将结果写入指定的输出或数据接收器。无界输出表的概念及其如何集成到流式工作流中，如图\
  \ 7-2 所示。\n\n![](img/538349_1_En_7_Fig2_HTML.png)\n\n流程图展示了实时数据流通过持续追加数据输入到时间线，以完整模式呈现结果和输出。\n\
  \n图 7-2 Spark Structured Streaming 无界输出表流程图\n\n接下来，我们将解释 Spark Structured Streaming\
  \ 中可用的三种不同输出模式。\n\n\n\n### Spark Structured Streaming 输出模式\n\n输出模式（别名：`OutputMode`）是\
  \ Structured Streaming 引入的一个新概念，正如我们之前提到的，Spark Structured Streaming 需要一个流式接收器。\n\
  \n对于 Spark Structured Streaming 而言，输出模式指定了哪些数据被写入流式接收器以及写入这些数据的方式。\n\nSpark Structured\
  \ Streaming 支持三种输出模式：\n\n- **追加模式**（别名：`append`）。这是默认行为，只有到达结果表的*新行*会被写入输出接收器。对于流式聚合而言，*新行*是指其中间状态变为最终状态的那些行。此模式保证每一行只会输出一次；当我们只对分析新数据感兴趣时，会使用此模式。追加模式仅适用于那些追加到结果表的行不会被修改的查询，例如，仅使用\
  \ `select`、`where`、`map`、`flatMap`、`filter`、`join` 等操作的查询。\n\n- **完整模式**（别名：`complete`）。此模式仅支持流式聚合，其工作原理是每次处理信息时都写入结果表的所有行。当我们想要执行数据聚合，然后在每次更新后将完整的结果表转储到数据接收器时，会使用此模式。此模式不处理完整表数据的写入方式；因此，管理信息的责任在于所使用的连接器。\n\
  \n- **更新模式**（别名：`update`）。此输出模式是在 Spark 2.1.1 中引入的，它只会将自上次触发以来更新过的行写入接收器。当查询不包含聚合时，它等同于追加模式。\n\
  \n然而，没有一种输出模式适用于所有可能的流式查询。表 7-1 展示了输出模式与流式查询的兼容性矩阵。\n\n**表 7-1** 输出模式与流式查询兼容性矩阵\n\
  \n| 流式查询类型 | 支持的输出模式 |\n| --- | --- |\n| 带聚合的查询 | 基于事件时间且带水印的聚合：Append、Update、Complete\
  \ |\n| | 其他聚合：Complete、Update |\n| 包含 `mapGroupsWithState` 的查询 | Update |\n| 包含\
  \ `flatMapGroupsWithState` 的查询 | Append 操作模式：Append |\n| | Update 操作模式：Update |\n\
  | 包含 `joins` 的查询 | Append |\n| 其他查询 | Append、Update |\n\n输出模式是在流式查询的写入端，通过 `streaming.DataStreamWriter.outputMode`\
  \ 方法指定的，该方法可以使用别名或 `org.apache.spark.sql.streaming.OutputMode` 对象的值：\n\n```scala\n\
  import org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.streaming.OutputMode.Update\n\
  \nval spark: SparkSession = SparkSession.builder()\n  .master(\"local[*]\")\n  .appName(\"\
  Hands-On-Spark3_Structured_Streaming\")\n  .getOrCreate()\n\nval inputStream = spark\n\
  \  .readStream\n  .format(\"socket\")\n  .option(\"host\",\"localhost\")\n  .option(\"\
  port\",\"9999\")\n  .load()\n\ninputStream\n  .select(explode(split(df(\"value\"\
  ),\" \")).alias(\"palabra\"))\n  .groupBy(\"word\")\n  .count()\n  .writeStream\n\
  \  .format(\"console\")\n  .outputMode(\"complete\") // 选择了完整输出模式\n  .start()\n\
  \  .awaitTermination()\n\n// 另一种指定方式\nval inputStream = spark\n  .readStream\n \
  \ .format(\"socket\")\n  .load()\n// .... 你的代码写在这里\n  .writeStream\n  .format(\"\
  console\")\n  .outputMode(Update) // 选择了更新输出模式\n  .start()\n  .awaitTermination()\n\
  ```\n\n请记住，使用 Structured Streaming 时，你始终需要指定一个流式接收器和输出模式。\n\n总之，考虑到前面列举的 Spark Structured\
  \ Streaming 特性，我们可以说 Structured Streaming 提供了结果的一致性，因为它保证结果始终等同于具有相同输入数据的等效批处理所返回的结果。然而，这些模式中的每一种都仅适用于特定类型的查询。\n\
  \n## 数据集和 DataFrame 流式 API\n\n自 Spark 2.0 起，DataFrame 和数据集可用于处理静态数据（有界数据）和流式数据（无界数据）。最新的\
  \ Spark 版本可以使用 DataFrame/数据集，通过通用的 `SparkSession` 入口点处理来自流式数据源的数据，并对它们应用与批处理中完全相同的转换和操作。\n\
  \n流式 DataFrame 可以通过 `DataStreamReader` 接口创建，该接口由 `SparkSession.readStream()` 返回（如果你使用\
  \ Scala、Java 或 Python），或者通过 `read.stream()` 方法返回（如果你使用 R）。与 Spark SQL 的 `read()`\
  \ 方法类似，可以指定源数据格式（CSV、JSON 等）、模式等详细信息，以将不同格式的文件读入 Spark DataFrame。\n\n与 Spark Streaming（DStream）一样，Structured\
  \ Streaming 也内置了一些用于数据摄取的数据源。这些数据源包括：\n\n- **文件源**：使用 `DataStreamReader` 方法，从目录中不同格式的文件（如文本、CSV、JSON、Parquet\
  \ 等）上传流式数据。\n\n- **Kafka 源**：从 Apache Kafka 主题读取流式数据。在本书编写时，仅支持 Kafka 代理版本 0.10.0\
  \ 或更高版本。\n\n- **套接字源**：从套接字连接读取 UTF-8 编码的文本。它不被视为容错的流式数据源，因为它不支持在发生故障后使用检查点偏移量重新提交数据。\n\
  \n- **速率源**：此流式数据源仅用于测试和基准测试。它用于以指定的每秒行数（速率）生成包含两列（\"timestamp\" 和 \"value\"）的随机数据。\"\
  timestamp\" 列包含消息发送的时间，格式为 Timestamp 类型，而 \"value\" 列分配一个 Long 类型的数字，用于计数从 0 开始发送的消息。\n\
  \n- **每微批次速率源**：此流式数据源也仅用于测试和基准测试。与速率源一样，每个输出行包含两列：\"timestamp\" 和 \"value\"。它具有与速率源相同的特性，但与后者不同，前者旨在为每个微批次提供一致数量的行（时间戳和值），也就是说，如果批次\
  \ 0 产生数字 0 到 999 及其关联的时间戳，那么批次 1 将产生 1000 到 1999 及其后续的时间戳，依此类推。\n\n接下来，在表 7-2 中，你可以看到上述数据源及其主要选项的总结。此表同样基于\
  \ Apache Spark 官方文档中关于流式 DataFrame 和数据集输入源的内容。\n\n**表 7-2** Spark Structured Streaming\
  \ 数据源选项\n\n\n\n| 数据源 | 选项 | 容错 |\n| --- | --- | --- |\n| 文件数据源 | • `path`: 输入文件目录的路径。<br>•\
  \ `maxFilesPerTrigger`: 每次触发时考虑的新文件最大数量（默认：无上限）。<br>• `latestFirst`: 是否优先处理最新文件。<br>•\
  \ `fileNameOnly`: 是否仅基于文件名（而非完整路径）检查新文件：<br>  • 默认值：false。<br>  • 将 `fileNameOnly`\
  \ 设为 \"true\" 后，以下文件 `hdfs://<host>:<port>/file.txt`、`file:///file.txt`、`s3://x/file.txt`\
  \ 等将被视为同一文件，因为它们的文件名都是 \"file.txt\"。<br>• `maxFileAge`: 目录中文件被忽略前的最大存在时间：<br>  •\
  \ 对于第一批次，所有文件均视为有效。<br>  • 最大存在时间基于最新文件的时间戳而非当前系统时间戳计算（默认：1 周）。<br>  • 若 `latestFirst`\
  \ 设为 \"true\" 且设置了 `maxFilesPerTrigger`，则此参数将被忽略，因为有效且应被处理的旧文件可能被忽略。<br>• `cleanSource`:\
  \ 处理完成后清理已完成文件。可选值为 \"archive\"、\"delete\" 和 \"off\"（默认：off）：<br>  • 选择 \"archive\"\
  \ 时，必须同时提供 `sourceArchiveDir` 选项。<br>  • 归档（移动文件）和删除已完成文件都会在每个微批次中引入开销（降低处理速度）。<br>更多详情请参阅输入数据源手册。\
  \ | 是 |\n| Socket 数据源 | 连接的主机和端口（`<host>`:`<port>`）。 | 否 |\n| Rate 数据源 | • `rowsPerSecond`:\
  \ 每秒应生成的行数，例如 100（默认：1）。<br>• `rampUpTime`: 生成速度达到 `rowsPerSecond` 前的加速时间。最大粒度为秒，例如\
  \ 5 秒（默认：0 秒）。<br>• `numPartitions`: 生成行的分区数，例如 10（默认：Spark 的默认并行度）。<br>`rowsPerSecond`\
  \ 的数量无法保证，因为查询可能受资源限制；此时可调整 `numPartitions` 以帮助达到期望速率。 | 是 |\n| 每微批次 Rate 数据源 |\
  \ • `rowsPerBatch`: 每个微批次应生成的行数，例如 100<br>• `numPartitions`: 生成行的分区数，例如 10（默认：Spark\
  \ 的默认并行度）<br>• `startTimestamp`: 生成时间的起始值，例如 1000（默认：0）<br>• `advanceMillisPerBatch`:\
  \ 每个微批次生成时间推进的毫秒数，例如 1000（默认：1000） | 是 |\n| Kafka 数据源 | 更多详情请查阅 [`Kafka 集成指南`](https://spark.apache.org/docs/latest/structured-streaming-kafka-integration.html)\
  \ 文档。 | 是 |\n\n现在我们已经学习了 Spark Structured Streaming 的基础知识和主要数据源，接下来通过一些示例了解流式 DataFrame\
  \ 的工作原理。\n\n### Socket Structured Streaming 数据源\n\n为了展示如何通过监听 Socket 连接使用 Spark\
  \ Structured Streaming 摄取数据，我们将继续使用上一章中基本的近实时流式医院排队管理系统，并稍作调整，通过实现 JSON 输入格式使其更贴近实际场景。\n\
  \n我们提供两种运行程序的方式。第一个代码（`readStreamSocket.scala`）如下所示，这是一个 Scala 变体，可使用 `$SPARK_HOME/bin/spark-submit`\
  \ 命令在 Spark 中编译和执行。讨论如何编译和链接 Scala 代码超出了本书范围，但建议使用 `sbt` 配合 `sbt-assembly` 创建包含所有必要库（即*依赖项*）的所谓\
  \ \"fat JAR\" 文件：\n\n```\npackage org.apress.handsOnSpark3\nimport org.apache.spark.sql.SparkSession\n\
  import org.apache.spark.sql.functions._\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType}\nimport java.io.IOException\ncase class Patient(\n\
  NSS: String,\nNom: String,\nDID: Option[Long],\nDNom: String,\nDate: String\n)\n\
  object readStreamSocket {\ndef main(args: Array[String]): Unit = {\nval PatientsSchema\
  \ = StructType(Array(\nStructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\n\
  StructField(\"DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"\
  Date\", StringType))\n)\nval host = \"localhost\"\nval port = 9999\ntry {\nval spark:\
  \ SparkSession = SparkSession.builder()\n.master(\"local[*]\")\n.appName(\"Hand-On-Spark3_Socket_Data_Source\"\
  )\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"ERROR\")\n// 设置 spark.readStream\
  \ …\nimport spark.implicits._\nval PatientDS = spark.readStream\n.format(\"socket\"\
  )\n.option(\"host\", host)\n.option(\"port\", port)\n.load()\n.select(from_json(col(\"\
  value\"),PatientsSchema).as(\"patient\"))\n.selectExpr(\"patient.*\")\n.as[Patient]\n\
  printf(\"\\n 正在监听，准备就绪... \\n\")\nval selectDF = PatientDS.select(\"*\")\nselectDF.writeStream\n\
  .format(\"console\")\n.outputMode(\"append\")\n.option(\"truncate\", false)\n.option(\"\
  newRows\", 30)\n.start()\n.awaitTermination()\n} catch {\ncase e: java.net.ConnectException\
  \ => println(\"建立连接到 \" + host + \":\" + port + \" 时出错\")\ncase e: IOException =>\
  \ println(\"发生 IOException\")\ncase t: Throwable => println(\"接收数据时出错\", t)\n} finally\
  \ {\nprintln(\"Finally 块\")\n}\n}\n}\n```\n\n下一段代码是上述医院排队管理系统应用程序的另一个版本，可使用 Jupyter、Apache\
  \ Zeppelin 等笔记本应用程序在 Spark 中执行，这对于学习目的更为方便，尤其当您不熟悉 Scala 代码编译工具时：\n\n```\nimport\
  \ org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\nimport\
  \ org.apache.spark.sql.types.{IntegerType, StringType, StructField, StructType,DoubleType,LongType}\n\
  import org.apache.spark.sql.{DataFrame, Dataset, Encoders, SparkSession}\nimport\
  \ java.io.IOException\nval PatientsSchema = StructType(Array(\nStructField(\"NSS\"\
  , StringType),\nStructField(\"Nom\", StringType),\nStructField(\"DID\", IntegerType),\n\
  StructField(\"DNom\", StringType),\nStructField(\"Fecha\", StringType))\n)\ncase\
  \ class Patient(\nNSS: String,\nNom: String,\nDID: Option[Long],\nDNom: String,\n\
  Fecha: String\n)\nval spark:SparkSession = SparkSession.builder()\n.master(\"local[*]\"\
  )\n.appName(\"Hand-On-Spark3_Socket_Data_Source\")\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\nval host = \"localhost\"\nval port = 9999\ntry {\nval PatientDS = spark.readStream\n\
  .format(\"socket\")\n.option(\"host\",host)\n.option(\"port\",port)\n.load()\n.select(from_json(col(\"\
  value\"), PatientsSchema).as(\"patient\"))\n.selectExpr(\"Patient.*\")\n.as[Patient]\n\
  printf(\"\\n 正在监听，准备就绪... \\n\")\nval selectDF = PatientDS.select(\"*\")\nselectDF.writeStream\n\
  .format(\"console\")\n.outputMode(\"append\")\n.option(\"truncate\",false)\n.option(\"\
  newRows\",30)\n.start()\n.awaitTermination()\n} catch {\ncase e: java.net.ConnectException\
  \ => println(\"建立连接到 \" + host + \":\" + port + \" 时出错\")\ncase e: IOException =>\
  \ println(\"发生 IOException\")\ncase t: Throwable => println(\"接收数据时出错\", t)\n}finally\
  \ {\nprintln(\"在 Finally 块中\")\n}\n```\n\n请注意我们在摄取数据之前是如何定义 `PatientsSchema` 模式的：\n\
  \n```\nval PatientsSchema = StructType(Array(\nStructField(\"NSS\", StringType),\n\
  StructField(\"Nom\", StringType),\nStructField(\"DID\", IntegerType),\nStructField(\"\
  DNom\", StringType),\nStructField(\"Fecha\", StringType))\n)\n```\n\n使用 Spark Structured\
  \ Streaming 时，必须在使用信息之前定义其模式。\n\n同时请注意 `local[*]` 选项。这里我们使用了 \"*\"，因此程序将使用所有可用的核心。使用多个核心很重要，因为应用程序必须能够并行运行两个任务：监听\
  \ TCP Socket（`localhost:9999`），同时处理数据并在控制台显示。\n\n\n\n### 本地运行 Socket 结构化流应用程序\n\n\
  我们将使用一个名为 Netcat 的特色网络工具来建立一个简单的客户端/服务器流式连接。Netcat（根据系统不同，可能叫 `netcat`、`nc`、`ncat`\
  \ 等）在类 Unix 操作系统中可用，它使用 TCP/IP 协议通过网络读写数据。在本书中，我们使用 Netcat OpenBSD 版本（`nc`）。\n\n\
  `nc` 命令的语法是：\n\n```\nnc [<options>] [<host>] [<port>]\n```\n\nNetcat 有几个 `[<options>]`；然而，我们只使用\
  \ `-l`，它指示 `nc` 监听一个 UDP 或 TCP `<port>`，以及 `-k`，它在监听模式下用于接受多个连接。当省略 `<host>` 时，`nc`\
  \ 会监听绑定到给定 `<port>` 的所有 IP 地址。\n\n为了说明程序如何工作，我们将利用前面介绍的 `nc` 工具，在 `nc` 和我们的 Spark\
  \ 应用程序之间建立一个流式客户端/服务器连接。在我们的场景中，`nc` 将充当服务器（监听一个 `host:port`），而我们的应用程序将充当客户端（连接到\
  \ `nc` 服务器）。\n\n无论你是从之前的代码构建了 JAR 文件，还是使用笔记本版本，运行应用程序都包含两个步骤：\n\n1.  在你的系统中打开一个终端，并通过运行以下代码来设置客户端/服务器流式连接的服务器端：\n\
  \n```\nnc -lk 9999\n```\n\n2.  根据你运行应用程序的方式：\n    - **使用 JAR 文件**：打开第二个终端并按如下所示执行你的应用程序：\n\
  \n```\n$SPARK_HOME/bin/spark-submit --class org.apress.handsOnSpark3.readStreamSocket\
  \ --master \"local[*]\" PATH/TO/YOUR/HandsOnSpark3-readStreamSocket.jar\n```\n\n\
  \    - **使用笔记本**：只需在你的笔记本中执行代码。\n\n一旦你在屏幕上看到消息 `Listening and ready…`，你就可以回到步骤 1\
  \ 并输入一些提供的 JSON 字符串，例如：\n\n```\n{\"NSS\":\"1234\",\"Nom\":\"María\", \"DID\":10,\
  \ \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"2345\",\"Nom\":\"Emilio\"\
  , \"DID\":20, \"DNom\":\"Neuro\", \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"3456\",\"\
  Nom\":\"Marta\", \"DID\":30, \"DNom\":\"Endo\", \"Fecha\":\"01-09-2022\"}\n…\n{\"\
  NSS\":\"4567\",\"Nom\":\"Marcos\", \"DID\":40, \"DNom\":\"Gastro\", \"Fecha\":\"\
  01-09-2022\"}\n{\"NSS\":\"5678\",\"Nom\":\"Sonia\", \"DID\":50, \"DNom\":\"Gineco\"\
  , \"Fecha\":\"01-09-2022\"}\n{\"NSS\":\"6789\",\"Nom\":\"Eduardo\", \"DID\":10,\
  \ \"DNom\":\"Cardio\", \"Fecha\":\"01-09-2022\"}\n```\n\n每隔几秒钟，你将在终端上看到类似如下的输出：\n\
  \n```\nListening and ready...\n-------------------------------------------\nBatch:\
  \ 1\n-------------------------------------------\n+----+------+---+------+----------+\n\
  |NSS |Nom   |DID|DNom  |Fecha     |\n+----+------+---+------+----------+\n|1234|María\
  \ |10 |Cardio|01-09-2022|\n|2345|Emilio|20 |Neuro |01-09-2022|\n|3456|Marta |30\
  \ |Endo  |01-09-2022|\n|4567|Marcos|40 |Gastro|01-09-2022|\n|5678|Sonia |50 |Gineco|01-09-2022|\n\
  +----+------+---+------+----------+\n-------------------------------------------\n\
  Batch: 2\n-------------------------------------------\n+----+-------+---+------+----------+\n\
  |NSS |Nom    |DID|DNom  |Fecha     |\n+----+-------+---+------+----------+\n|6789|Eduardo|10\
  \ |Cardio|01-09-2022|\n+----+-------+---+------+----------+\n-------------------------------------------\n\
  Batch: 3\n-------------------------------------------\n+----+------+---+------+----------+\n\
  |NSS |Nom   |DID|DNom  |Fecha     |\n+----+------+---+------+----------+\n|1009|Julia\
  \ |20 |Neuro |01-09-2022|\n|1010|Javier|30 |Endo  |01-09-2022|\n|1011|Laura |50\
  \ |Gineco|01-09-2022|\n|1012|Nuria |10 |Cardio|01-09-2022|\n|1013|Helena|10 |Cardio|01-09-2022|\n\
  +----+------+---+------+----------+\n```\n\n3.  **应用程序终止**\n\n`awaitTermination()`\
  \ 等待用户的终止信号。因此，转到步骤 1 中启动的终端会话，按下 `Ctrl+C` 或发送 `SIGTERM` 信号，流式上下文将被停止。\n\n这种终止流式应用程序的方式既不优雅也不正确，因为当我们终止它时，正在进行的操作将会丢失。一种更优雅且正确的方法是使用我们在前一章中看到的\
  \ Spark Structured Streaming 优雅关闭。因此，我们鼓励你修改之前的代码，为其添加优雅关闭功能。\n\n### 文件系统结构化流数据源\n\
  \nSpark Streaming 可以使用文件系统作为输入数据库。Spark 可以在任何兼容 HDFS 的文件系统（如 HDFS 本身、AWS S3、NFS\
  \ 等）上挂载文件流处理过程。当设置文件系统流时，Spark 会监控指定的路径，并处理在其中创建的任何文件。\n\nSpark 根据以下模式监控文件系统：\n\n\
  - 对于像 `\"hdfs://hadoop:9000/folder/\"`、`\"s3//…\"`、`\"file//…\"` 等路径，Spark 会在文件出现在路径下时立即处理它们。\n\
  - 也可以使用全局模式来指定目录，例如 `\"hdfs://<hadoop-host>:<hadoop-port>/folder/textfiles/*/*\"\
  `。\n- 路径内的所有文件必须具有相同的格式。\n- 路径下存在的文件数量会影响 Spark 扫描该路径所需的时间，即使没有文件被更新。\n- 同一时间窗口内的文件更新将被忽略。因此，一旦文件被处理，更新它不会导致其被重新处理。\n\
  - Spark 将根据文件的修改时间（而非创建时间）来处理文件。因此，当流处理过程启动时，路径中已存在的文件将不会被处理。\n- 使用 `Hadoop FileSystem.setTimes()`\
  \ 设置文件的访问时间可能会导致文件在当前处理时间窗口之外被处理。\n\n现在我们将看到如何使用 Spark 持续监控文件夹并从文件夹中流式读取文件。在本例中，我们将继续使用基本的近实时流式医院排队管理系统，再次对其进行一些调整，以使其能够从文件系统流式读取文件。\n\
  \n正如我们之前对 Socket 数据源示例所做的那样，这里提供了两个版本的程序。第一个版本可以使用 `sbt` 或其他 Scala 编译器编译：\n\n```scala\n\
  package org.apress.handsOnSpark3\nimport org.apache.spark.sql.SparkSession\nimport\
  \ org.apache.spark.sql.functions._\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType}\nimport java.io.IOException\nobject dStreamsFiles\
  \ {\ndef main(args: Array[String]): Unit = {\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Date\",\
  \ StringType)\n)\n)\ntry {\nval spark: SparkSession = SparkSession\n.builder()\n\
  .master(\"local[3]\")\n.appName(\"Hand-On-Spark3_File_Data_Source\")\n.getOrCreate()\n\
  spark.sparkContext.setLogLevel(\"ERROR\")\nval df = spark.readStream\n.schema(PatientsSchema).json(\"\
  /tmp/patient_streaming\")\nval groupDF = df.select(\"DID\")\n.groupBy(\"DID\").agg(count(\"\
  DID\").as(\"Accumulated\"))\n.sort(desc(\"Accumulated\"))\nprintf(\"\\n Listening\
  \ and ready... \\n\")\ngroupDF.writeStream\n.format(\"console\")\n.outputMode(\"\
  complete\")\n.option(\"truncate\", false)\n.option(\"newRows\", 30)\n.start()\n\
  .awaitTermination()\n} catch {\ncase e: IOException => println(\"IOException occurred\"\
  )\ncase t: Throwable => println(\"Error receiving data\", t)\n} finally {\nprintln(\"\
  Finally block\")\n}\n}\n}\n```\n\n接下来是第二个版本，旨在 Apache Zeppelin、Jupyter Notebook\
  \ 等笔记本中执行。\n\n\n\n```scala\nimport org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.types.{IntegerType,\
  \ StringType, StructField, StructType}\nimport org.apache.spark.sql.functions.desc\n\
  import java.io.IOException\n\nval spark:SparkSession = SparkSession\n  .builder()\n\
