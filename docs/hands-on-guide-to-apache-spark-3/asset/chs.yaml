  |label|true prediction rate|count|\n+-----+--------------------+-----+\n|0    |0.8\
  \                 |5    |\n|1    |0.7333333333333333  |15   |\n+-----+--------------------+-----+\n\
  \nBatch: 7\n\n+-----+--------------------+-----+\n|label|true prediction rate|count|\n\
  +-----+--------------------+-----+\n|0    |0.7142857142857143  |7    |\n|1    |0.75\
