  #### 在 RDD 中按键添加值


  Spark 的 `PairRDDFunction` 中的 `reduceByKey()` 是一种宽转换，它会混洗所有 RDD 分区的数据。它使用关联的归约函数合并
  RDD 中每个键的值。`reduceByKey()` 针对大型数据集进行了优化，因为 Spark 可以在混洗信息之前按键合并输出。


  `reduceByKey()` 的语法如下：


  ```

  sparkContext.textFile("hdfs://")

  .flatMap(line => line.split("ELEMENT_SEPARATOR"))

  .map(element => (element,1))

  .reduceByKey((a,b)=> (a+b))

  ```


