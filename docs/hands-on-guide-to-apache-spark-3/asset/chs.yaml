  \n在下一节中，我们将学习会话窗口，其语义与前两种窗口类型有所不同。\n\n\n\n"
- "# 会话窗口\n\n与会话窗口和滑动窗口相比，会话窗口有一个重要的不同特性。会话窗口具有可变的几何形状。会话窗口的长度是动态变化的，具体取决于传入的事件。\n\
  \n会话窗口会收集在相似时间点到达的事件，并隔离出没有数据活动的时段。一个会话窗口从收集到第一个输入事件开始，只要我们在等于窗口长度的间隔持续时间内不断接收到数据，它就会持续存在。因此，在任何情况下，当达到最大窗口长度时，它就会自行关闭。例如，在我们之前的示例中，窗口大小为十秒，会话窗口将在接收到第一个输入后立即开始。此后，在十秒内获取的所有事件都将与该窗口关联。如果该窗口在十秒内没有收到更多输入，它就会自行关闭。图\
  \ 9-8 展示了会话窗口工作方式的图形化描述。\n\n![](img/538349_1_En_9_Fig8_HTML.png)\n\n一张示意图展示了从左到右编号为\
  \ 4 到 1 的四个窗口。每个窗口中的值是根据不同会话中的不同数字计算得出的。\n\n**图 9-8** 间隔为五秒的十秒会话窗口\n\n当遇到诸如“哪些患者在某个时间点去了医院？”或“在特定时间段内，医院最繁忙的时刻是什么？”这类业务问题时，会话窗口是合适的工具。\n\
  \n像往常一样，我们提供一个使用会话窗口的实际示例。在下面的代码片段中，你可以看到如何将会话窗口描述为创建一个窗口来收集在超时时间内到达的所有后续事件。如你所见，窗口时间范围内收集的所有事件都会被添加到当前会话中。\n\
  \n在下一个示例中，我们实现了 `session_window()` 函数，用于在会话窗口上统计传入事件的数量，该会话窗口基于我们示例事件中 `Fecha` 列的十秒间隔。\n\
  \n```\n// Session Window\nimport org.apache.spark.sql.SparkSession\nimport org.apache.spark.sql.functions._\n\
  import org.apache.spark.sql.types._\nimport org.apache.spark.sql.{DataFrame, Dataset,\
  \ Encoders, SparkSession}\nimport java.io.IOException\nimport org.apache.spark.sql.streaming._\n\
  import org.apache.spark.sql.streaming.{GroupState,GroupStateTimeout,OutputMode}\n\
  import org.apache.spark.sql.DataFrame\nval PatientsSchema = StructType(Array(\n\
  StructField(\"NSS\", StringType),\nStructField(\"Nom\", StringType),\nStructField(\"\
  DID\", IntegerType),\nStructField(\"DNom\", StringType),\nStructField(\"Fecha\"\
  , StringType))\n)\nval spark:SparkSession = SparkSession.builder()\n.master(\"local[10]\"\
  )\n.appName(\"Hand-On-Spark3_Socket_Data_Source\")\n.getOrCreate()\nspark.sparkContext.setLogLevel(\"\
  ERROR\")\nimport spark.implicits._\ntry {\nval PatientDS = spark.readStream\n.schema(PatientsSchema)\n\
  .json(\"/tmp/window\")\nPatientDS.printSchema()\nprintf(\"\\n Listening and ready...\
  \ \\n\")\nval PatientDF = PatientDS\n.groupBy(\nsession_window(col(\"Fecha\"), \"\
  10 seconds\"), col(\"DID\")\n).count()\nPatientDF.printSchema()\nPatientDF.writeStream\n\
  .outputMode(\"complete\")\n.format(\"console\")\n.option(\"truncate\", false)\n\
  .start()\n.awaitTermination()\n} catch {\ncase e: IOException => println(\"IOException\
  \ occurred\")\ncase t: Throwable => println(\"Error receiving data\", t)\n}finally\
  \ {\nprintln(\"In finally block\")\n}\n```\n\n正如你在之前的示例中所做的那样，在运行上述代码之前，你首先需要创建数据源文件夹（在我们的示例中仍然是\
  \ `/tmp/window`）。之后，你可以将作为示例提供的 JSON 文件复制到数据源目录，例如像这样：\n\n```\n$ cp json_file11.json\
