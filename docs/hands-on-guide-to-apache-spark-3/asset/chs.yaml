  在早期的 Spark 版本中，保存模式被标识为 `SaveMode.ErrorIfExists`、`SaveMode.Overwrite`、`SaveMode.Append`
  和 `SaveMode.Ignore`。然而，在最新的 Spark 版本中，`mode("errorifexists")`、`mode("append")` 等格式似乎是主流方式。




