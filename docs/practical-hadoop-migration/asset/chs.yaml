- '# Hadoop、NoSQL 和 HBase


  接下来，让我讨论一下使用 HDFS 进行存储的 Hadoop 和 NoSQL 数据库。HBase 是一个流行的 NoSQL 数据库，因此可以作为一个例子。由于
  HDFS 是一个分布式文件系统，数据将分散在所有数据节点上，这与集中式服务器相反。Kerberos 用于身份验证，但与关系数据库相比，HBase 在细粒度授权方面的能力非常有限。HBase
  提供了索引能力，但其非常有限，无法与 RDBMS（关系数据库管理系统）提供的高级索引技术相媲美。然而，主要的区别在于**缺乏关系**。与 RDBMS 不同，HBase
  中的数据没有关联。HBase 表的数据只是保存在 HDFS 文件中。


  如图 1-2 所示，保单数据不会自动与客户关联。任何必要的关联都必须通过编程方式实现。例如，如果你需要列出客户“艾萨克·牛顿”持有的所有保单，你需要知道保存客户保单的表（此处为
  HBase 表 `Life_policies` 和 `Home_policies`）。然后你需要找到一个公共标识符（社会保险号）来匹配属于该客户的行。对标识符的任何更改都不能自动传播，需要手动实现。


