  ## 拟议环境描述


  本节描述了拟议新系统的三个重要方面：事件流、数据流以及事件用于捕获数据的功能逻辑。我将详细讨论每个方面。让我们从业务活动模型开始，该模型概述了业务流程，并详细说明了构成流程的活动，同时显示了流程/活动之间的相互连接和交互。


  ### 业务活动模型


  业务活动模型侧重于关键业务流程，并对这些流程中的基本活动进行建模。活动可以进一步细分为任务（以便更清晰）。它还展示了触发业务流程的业务事件，以及启动和执行所需活动所涉及的业务规则。


  在图 3-3 中，事件用圆圈表示，活动用矩形表示，业务流程用虚线矩形表示，菱形表示决策点。因此，事件




