  第五章 ■ Hadoop 生态系统


  查询工具


  *查询*工具是一个接口，允许您根据特定标准选择或过滤数据，从而提供数据的子集。在 NoSQL 世界中创建此类特定子集非常重要，因为 NoSQL 数据库系统（和
  Hadoop）处理的是数据集，而非数据库和表。理解数据集的概念以及它们与传统关系数据库中存储的数据有何不同也非常重要。关于查询工具，需要记住的另一件重要事情是：它们没有自己的数据存储。一些查询工具（如
  Hive）将元数据存储在仓库中，但不存储它们正在处理的数据。


  在此之前，此类查询工具（尤其是支持 SQL 接口的）的选择非常有限。而且 MapReduce 性能是一个限制。现在，像`Stinger`、`Impala`、`Presto`和`Shark`（`Spark
  SQL`）这样的下一代产品不使用 MapReduce，并声称延迟低。其中一些工具使用自己的分布式引擎进行查询处理（和执行），而`Spark SQL`使用 Spark
  引擎。内存处理是 Spark 的一个关键优势，但其他内存解决方案也在涌现。




