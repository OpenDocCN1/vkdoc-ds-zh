  `Hadoop` 提供了所有这些能力，此外还支持读取时定义模式（意味着你可以在执行分析时定义元数据），这为执行探索性分析或从数据中生成新的洞察提供了极大的灵活性。


  这就引出了最后一个问题：如何将你现有的基于 `RDBMS` 的应用程序迁移或集成到 `Hadoop`，并同时分析结构化和非结构化数据？嗯，你需要阅读本书的其余部分才能了解！


