- '# 第 11 章 ■ 案例研究：实现 Lambda 架构


  第[9 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)详细讨论了 Spark 与 Hadoop 对接的所有操作细节。在此，我将简要讨论如何使用
  Spark SQL 从 Hive 获取数据（到 DataFrames）以及针对 Spark 中的 Hive 表执行 DML（数据操作语言——更新、插入或删除命令）语句。


  如您所知，Spark 使用 DataFrames 和 RDD（弹性分布式数据集）作为内存结构，您可以利用它们进行查询和性能优化。Spark 还允许您使用 `sqlContext`
  针对 Hive 数据库执行查询。首先，您需要构造一个 `HiveContext`，它继承自 `SQLContext`，并允许您在 Hive MetaStore
  中查找表，还支持使用 HiveQL 执行查询。此处，我使用 Scala，而 `sc` 是一个现有的 `SparkContext`（您可以在 Spark shell
  中使用 Python 或 R）：


  ```scala

  val sqlContext = new org.apache.spark.sql.hive.HiveContext(sc)

  ```


  ```scala

  val sqlContext.sql("Create table MaxTable as select ViewName, max(CreatedAt) from
  BatchProcHist group by ViewName having ViewName = ''ClaimDefView''")

  ```


  ```scala

  val sqlContext.sql("Insert into MaxTable select ViewName, max(CreatedAt) from BatchProcHist
  group by ViewName having ViewName = ''ClaimDefView_S''")

  ```


  您可以类似地执行所有必要的 HiveQL 命令来创建速度层视图 `ClaimDefView_S`。在最后一步（视图创建后），无需创建视图，您可以直接执行 `select`
  语句并将结果读取到 DataFrames 中，如下所示：


  ```scala

  val resultsDF = sqlContext.sql("Select P.PolicyOwnerID, P.PolicyId,

  C.Claimcount from PolicyMaster P, ClaimDeftemp12 C where P.PolicyId =

  C.PolicyId;")

  ```


  您可以将生成的 DataFrames 注册为临时表，然后对其执行任意查询：


  ```scala

  val resultsDF.registerTempTable("ClaimDefView_S")


  val results = sqlContext.sql("SELECT PolicyOwnerId FROM ClaimDefView_S")

  ```


  您需要使用一个能够从 Hive 和 Spark 读取数据的查询工具来合并批处理层和速度层视图的结果。有足够多的选择，当然您也可以将 Spark SQL 本身用作查询工具。


  ## 存储结构（用于主数据和视图）


  第[10 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_10)讨论了如何选择最佳文件格式。在本节中，我将应用第[9
  章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)讨论的概念。因此，让我简要考虑选择正确格式的几个参数：


  * 查询类型（您计划执行的）是首要且最重要的因素。正如您从批处理视图中所见，构建主数据的查询涉及从较大的列集中选择一小部分列，并带有少量过滤条件。此外，构建批处理层视图需要多种聚合操作。

  * 您所需的压缩量。对于一个 30 TB（且每月增长 1%）的数据集，压缩是必要的。

  * 确保您的 NoSQL 解决方案支持您计划使用的存储格式。


  现在，您可能会从第[9 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)回忆起列式格式提供良好的压缩，并且更适合需要聚合操作（如
  `count`、`avg`、`min`、`max`）的数据。此外，对于涉及选择一小部分列以及使用少量列作为过滤条件（在 `where` 子句中）的用例，列式格式提供了良好的性能。


  因此，您将从使用列式格式存储数据中受益。接下来的决定是选择哪种列式格式。流行的格式包括 RCFile、ORCFile 和 Parquet。


  RCFile 格式是第一个引入的列式格式，并且在 Hadoop 生态系统内（几乎所有 Hadoop 工具都支持它）以及 Hadoop 外部的工具中得到最广泛的支持。与
  Parquet 和 ORCFiles 相比，RCFile 缺乏许多高级功能，例如支持存储更复杂的数据类型或提供加密。但是，对于当前示例，不需要支持复杂数据类型，也不需要加密。因此，可以使用
  RCFile 格式。


  如果您发现性能问题，请切换到 Parquet，它提供更好的压缩，并在压缩和速度之间取得平衡。此外，Parquet 在 Hadoop 以及外部（Hadoop 生态系统）工具中都得到了广泛支持。


  您应该使用一个先进的分布式处理框架（如 YARN 或 Spark）来帮助您加速处理这些数据并提供最佳性能（因为数据量相当大）。


  ### 其他性能考虑


  对于此示例，我并未考虑操作系统配置的调优，因为操作系统可用的选项数量很多。由于配置会发生变化（取决于您选择的操作系统或框架），我认为不可能提供更精细的细节。但是，您可以参考第[9
  章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)中的 HDFS 和 YARN 调优指南。



