- "# 排版后的内容\n\nNathan 书中“网络点击”的例子，你可能会开发类似的 Java 代码来实现系统，用于收集和分析社交媒体数据、电子商务系统数据，甚至物联网相关系统的数据。但是，你能使用\
  \ `Lambda` 与关系型系统交互吗？更重要的是，你能为这类接口开发基于事实的模型吗？这个问题没有绝对肯定或否定的答案。这取决于源系统的复杂性以及你的目标——一旦数据进入\
  \ `Hadoop`，你打算用它做什么？\n\n最后，面对诸如 `Spark` 这样的前沿流处理引擎的冲击，`Lambda` 架构能否幸存？ `Spark` 也消除了管理批处理和实时功能所需的两套分布式系统这一主要障碍。我觉得只有时间能给出答案。\n\
  \n## 第 10 章：实现并优化过渡\n\n最近，我看到许多组织在关于使用大数据的问题上改变了初衷。这些组织来自不同行业，因此可能无法承受 `Hadoop`不适合特定行业这种论断的逻辑。在大多数案例中（显然），性能和易用性不足是决定放弃使用大数据技术的主要问题。诚然，开源软件没有广泛且易于理解的文档或故障排除方法，但如今，有足够多的供应商在销售受支持的\
  \ `Hadoop` 发行版和软件，这些软件提供易于使用的浏览器界面，可执行从数据摄取到最终结果（分析）的各种任务。\n\n那么，为什么对投资 `Hadoop`\
  \ 犹豫不决、有所抵触？为什么 `Hadoop` 没有取代大量的数据仓库？为什么 `Hadoop` 仍然不是大公司的主流应用平台？这些问题都没有简单的答案。我想重点谈谈感知上的性能提升不足——这是人们想要选择\
  \ `Hadoop` 取代旧技术的一个主要因素。我将讨论如何通过硬件、操作系统、`Hadoop` 配置和数据各个阶段的性能调优，从你的 `Hadoop` 集群中获取最佳性能。\n\
  \n你可能听说过可以使用商用硬件构建 `Hadoop` 集群，但对于生产环境来说，这并非事实。我将讨论一些适用于生产和开发环境的典型硬件配置。我将介绍为什么需要从操作系统开始进行性能调优。我还将讨论影响性能的主要配置参数，并解释如何以及为何要进行调优。\n\
  \n当操作系统调优完成后，你需要着手处理 `Hadoop` 配置参数，并对其进行修改，以便为你的特定环境获得最佳性能。众所周知，`Hadoop` 将数据存储为文件，因此这些文件的存储格式非常重要。使用特定格式进行存储是有原因的，我将讨论在决定存储格式时需要考虑的因素。同时，考虑到数据量很大，数据压缩是必不可少的。我将讨论压缩编解码器的类型及其优缺点。最后，我将介绍有助于提升性能的特殊索引和缓存技术。\n\
  \n© Bhushan Lakhe 2016  \nB. Lakhe, *实用 Hadoop 迁移*, DOI 10.1007/978-1-4842-1287-5_10\n\
  \n当然，要想从 `Hadoop` 集群中获得最佳性能，第一步是运行基准压力测试，找出问题领域或性能未达预期的领域。我将从生产/开发环境的 `Hadoop` 硬件配置开始讲起。\n\
  \n### 硬件配置\n\n你不能假设 `Hadoop` 集群可以用旧的、废弃的商用硬件构建。你需要使用配备多个 CPU（包含多核）和足够内存的服务器。你的生产集群需要比开发环境拥有更强大的硬件，当然，你的\
  \ `NameNode`（主节点）需要比 `DataNodes`（任一环境的工作节点）更强大。这只是一个简要总结。\n\n### 集群配置\n\n`HDFS`\
  \ 主节点（`NameNode`）需要比工作节点拥有更多内存。此外，主节点的存储应该是 `RAID`，并且由于它是 `SPOF`（单点故障），因此需要为故障转移场景进行复制。`NameNode`\
  \ 的配置需要基于数据量（以及你计划让集群保存的文件数量）。在配置时，你需要考虑增长预测和数据压缩。\n\n以下是计算生产用途集群规模的方法。我先从单个节点的空间和节点总数说起。由于操作系统和节点上的其他关键应用程序需要一些空间（大约总空间的\
  \ 25%），并且数据块会根据副本因子（默认为 3）进行复制：\n\n```\n每个节点的 HDFS 空间 = (每个节点的原始磁盘空间 – 25% 非 DFS\
  \ 本地存储) / (副本因子)\n```\n\n```\n工作节点数 = 总 HDFS 空间 / 每个节点的 HDFS 空间\n```\n\n考虑以下用于启动（独立）工作节点配置的建议：\n\
  - 最新一代处理器，总计 12 到 16 个核心\n- 每个核心 4–8 GB 内存\n- 每个核心 1–3 TB SATA 磁盘\n- 1GbE 网卡\n\n\
  对于 `NameNode`：\n- 总计 4–6 个核心\n- 内存起始配置如下：(3 GB + 每 100 TB 原始磁盘空间或 100 万个文件对象增加 1\
  \ GB)\n- 需要复制（用于故障转移）\n- `RAID-1` 存储\n- `NameNode` 应在 64 位操作系统上运行，以避免 `JVM` 堆大小的\
  \ 3 GB 限制\n\n如果你使用 `YARN`，作为经验法则，可以将 2 GB 内存和 1 个 CPU 核心作为 `YARN` 主节点 `Resource\
  \ Manager` 的起始配置。但你可能需要为一个非常繁忙的 `Resource Manager`（运行大量调度任务）提升硬件配置。当然，你需要进行工作负载分析，并在高峰时段检查资源使用情况。如果某个资源的使用率达到最大值，请相应地调整资源分配。\n\
  \n你的开发环境规模取决于你的应用程序使用情况。如果你使用的是供应商产品，那么你的开发环境可能仅用于版本升级或定制化（针对供应商产品）。在这种情况下，你大概可以将每个节点的硬件资源减半，并且可能还想将开发环境的工作节点数量也减半。\n\
  \n然而，如果你的应用程序是内部开发的（或在你公司内部开发），那么你可能希望为每个工作节点分配（与生产环境相比）70–80% 的硬件资源，并且工作节点数量也使用（与生产环境相比）70–80%\
  \ 的计数，因为你可能需要处理大量的应用程序增强功能，并可能需要为它们测试性能。对于一个真正动态的开发环境，你可能需要匹配（生产环境的）开发资源，并且可能需要更大的空间来容纳多个版本的数据（用于测试）。\n\
  \n请注意，这些只是通用集群的指南。对于你特定的配置需求，应咨询你的供应商（获取 `Hadoop` 发行版）文档或寻求专家建议。\n\n### 操作系统配置\n\
  \n\n\n在开始对 Hadoop 集群进行性能调优之前，务必查阅操作系统文档。请记住，`HDFS` 只是一个运行在操作系统权限范围内的文件系统（尽管它是分布式的、具有容错性且功能强大），它运行在你各个节点（主节点或工作节点）的操作系统之上。一些操作系统的调整是直观的，而另一些则需要对其有深入的理解。由于\
  \ `RHEL`（Red Hat Enterprise Linux）或 `CentOS` 是 Hadoop 集群中常用的 Linux 发行版，我假设你使用的操作系统是其中之一。我将从直观的调整开始：\n\
  \n-   **关闭电源节省选项**：你需要在 `BIOS` 设置中将此选项配置为`PerfOptimized`以优化应用程序的性能（而不是在空闲时关闭）。\n\
  \n-   **关闭磁盘控制器上的缓存**：`Hadoop` 不使用该缓存。\n\n-   **使用 `NOATIME` 选项挂载磁盘卷**：默认情况下，操作系统会记录文件的最后访问（读取或写入）日期。此选项关闭该行为，从而加速访问（因为\
  \ `Hadoop` 不使用它）。\n\n使用 `ext4` 文件系统（而不是 `ext3`）有很多优点，例如多块分配和延迟分配。因此，你应该考虑使用它。现在，介绍一些不那么直观的设置：\n\
  \n-   **禁用透明大页压缩**：启用后，此功能会告诉 Linux 内核尽可能为 Linux 进程分配 2 MB 的页面。但由于压缩部分似乎会导致 Hadoop\
  \ 作业出现问题并导致高 CPU 使用率，因此需要禁用它。对于 `RHEL`，你可以使用以下命令：\n\n    ```\n    echo never > /sys/kernel/mm/redhat_transparent_hugepages/defrag\n\
  \    ```\n\n    为了使更改永久生效，请在`/etc/rc.local`文件中添加以下脚本：\n\n    ```\n    if test -f\
  \ /sys/kernel/mm/redhat_transparent_hugepage/defrag;\n    then echo never > /sys/kernel/mm/redhat_transparent_hugepage/\n\
  \    defrag ;fi\n    ```\n\n-   **减少文件系统保留块空间**：有 5% 的空间是为特殊操作（例如当文件系统已满时由`root`删除文件）保留的，但\
  \ `Hadoop` 不需要此空间，因此可以移除。使用以下命令：\n\n    ```\n    tune2fs -m 0 /dev/sdXY\n    ```\n\
  \n-   **增加打开文件句柄和文件数**：默认情况下，每个用户打开的文件数为 1024，这可能导致类似`java.io.FileNotFoundException:\
  \ (Too many open files)`的错误。因此，需要设置打开文件数的限制。对于 Linux，存在三个限制：软限制（可由用户设置）、硬限制（仅由`root`或超级用户设置）以及系统级限制（由`root`在服务器配置文件中设置）。选择一个高值（如\
  \ 4032）作为软限制（用户可以设置到的上限），一个更高的值（例如 32832）作为硬限制（`root`可以设置到的上限），以及一个非常高的值（例如 6544018）作为系统级文件描述符，因为这是整个系统可能的文件描述符总数。使用以下命令：\n\
  \n    ```\n    ulimit –S 4096\n    ulimit –H 32832\n    sysctl –w fs.file-max=6544018\n\
  \    ```\n\n-   **内存交换**：在 Hadoop 中，交换（将内存中的数据与文件系统交换）会降低作业性能。因此，请将最大数据保留在内存中，并配置你的操作系统仅在发生\
  \ `OOM`（内存不足）时才进行内存交换。为此，将内核参数`vm.swappiness`的值设置为 0。使用以下命令：\n\n    ```\n    sysctl\
  \ -w vm.swappiness=0\n    ```\n\n    请注意，`sysctl`命令将仅为当前会话设置这些值。要使此值持久化，请将以下行添加到配置文件`/etc/sysctl.conf`中：\n\
  \n    ```\n    vm.swappiness=0\n    ```\n\n    为了使上述文件描述符值持久化，请将以下行添加到配置文件`/etc/sysctl.conf`中：\n\
  \n    ```\n    fs.file-max=6544018\n    ```\n\nHadoop 作为一个分布式文件系统，节点间有大量的网络通信。因此，网络性能很重要，网络数据包大小也同样重要。最大传输单元（`MTU`）指示可以使用\
  \ `TCP/IP` 协议发送的数据包大小。`MTU` 的默认大小是 1500；你可以将其增加到 9000。大于其默认值的 `MTU` 值被称为巨型帧。你可以通过在配置文件`/etc/sysconfig/network-scripts/ifcfg-eth0`（或你的\
  \ `eth` 设备名称）中添加以下行来更改 `MTU` 的值：\n\n```\nMTU=9000\n```\n\n你必须重启网络服务才能使此更改生效。此外，在修改此值之前，请确保集群中的所有节点（包括交换机）都支持巨型帧。如果不支持，请不要进行此更改。\n\
  \n下一节将讨论从性能角度需要重点考虑的 Hadoop 配置参数。\n\n### Hadoop 配置\n\nHadoop 配置可以大致分为三类：`HDFS`、`JVM`\
  \ 和 `YARN`（包括作为容器的 `MapReduce`）。我将讨论所有这些类别以及其中可调优的参数。\n\n### HDFS 配置\n\n`HDFS` 保存你的数据，因此是数据访问的关键考虑因素。你必须确保数据写入和读取以最佳性能执行。\n\
  \n我之前分享了一些关于 `NameNode` 和 `DataNode` 的配置细节，但请注意一些你可以使用的快速驱动器的详细信息。\n\n此外，你应该执行一些通用任务，如时间同步、版本控制和集群平衡。同步所有集群节点上的时间非常重要。否则可能会导致错误，甚至可能难以知道这些错误的真实发生时间。同样重要的是对配置进行版本控制。你不希望出现某些节点处于特定版本而其他节点处于不同版本的情况。`HDFS`\
  \ 提供了一个工具（`Balancer`）来以统一的方式在你的 `DataNode` 上重新分发数据。这也有助于均匀地分布处理负载，应在集群扩容后使用。\n\n\
  回到配置，你可以考虑关键参数，如块大小或缓冲区大小。以下是完整列表：\n\n-   **驱动器类型**：尽管 `DataNode` 存储不需要 `RAID` 阵列（因为\
  \ `HDFS` 会根据指定的复制因子复制数据块），但使用快速的 `SATA` 驱动器来保存数据会有所帮助。`SSD`（固态硬盘）存储是理想之选，但由于价格昂贵，你可以使用\
  \ `SSHD`（固态混合硬盘）存储，它提供 7,200 `RPM` 或提供 10,000 `RPM` 的 `SATA III` 驱动器。\n\n-   **`DataNode`\
  \ 和 `NameNode` 的多个磁盘挂载点**：对于 `DataNode`，用逗号分隔的挂载点（或目录）列表会将数据分布到这些挂载点上，从而提供最佳的访问性能。对于\
  \ `NameNode`，多个目录（或挂载点）提供了元数据冗余。`HDFS` 确保你的文件的数据块在 `DataNode` 之间进行复制以实现冗余。相关的属性在`hdfs-site.xml`中：\n\
  \n    ```\n    dfs.datanode.data.dir\n    dfs.namenode.name.dir\n    ```\n\n-  \
  \ **`DFS` 块大小**：这是一个非常重要的考虑因素。请审查你预期的文件大小及其使用情况。例如，如果你的数据文件很大，但大量用户查询检索的是小数据集（500\
  \ MB–5 GB），那么你可能希望从 64 MB 或 128 MB 的块大小开始，因为你是一次写入，多次读取。你可以在写入新文件时覆盖块大小，并根据文件的预期用途为它们设置不同的块大小。相关的属性在`hdfs-site.xml`中：\n\
  \n    ```\n    dfs.block.size\n    ```\n\n-   **本地文件系统缓冲区**：这是 `HDFS` 为其 `I/O` 操作使用的缓冲区大小（由属性`io.file.buffer.size`控制）。为了提高性能，应将其增加到\
  \ 64 KB 或 128 KB。此外，根据可用的 `RAM` 量...\n    \n\n\n```markdown\n# 实现和优化过渡\n\n如果有可用资源，你可以将\
  \ `io.sort.factor`（排序文件时合并的映射数）设置为 20 或 25（默认为 10）。请注意，`io.sort.mb`（映射器用于收集映射输出的内存量）的值应为\
  \ `10 * io.sort.factor`。因此，若有 10 个映射器任务实例且 `io.sort.mb = 200`，则意味着你的排序总 RAM 分配为\
  \ 2 GB。相关的属性在 `core-site.xml` 中：`io.file.buffer.size` 以及在 `mapred-site.xml` 中：`io.sort.factor`、`io.sort.mb`。\n\
  \n- **短路读取**：通常，当客户端从 HDFS 请求（文件的）数据块时，客户端会联系相应的 DataNode，并通过 TCP 连接将数据发送给客户端。如果所请求的数据块位于与客户端相同的节点上，那么（对于客户端而言）绕过网络直接从磁盘读取块数据（称为短路读取）会更高效。可以通过将属性\
  \ `dfs.client.read.shortcircuit` 设置为 `true` 来启用短路读取。相关的属性在 `hdfs-site.xml` 中：`dfs.client.read.shortcircuit`。你还需要为此目的设置其他属性。详情请参见\
  \ [`hadoop.apache.org/docs/r2.4.1/hadoop-project-dist/hadoop-hdfs/ShortCircuitLocalReads.html`](https://hadoop.apache.org/docs/r2.4.1/hadoop-project-dist/hadoop-hdfs/ShortCircuitLocalReads.html)。\n\
  \n- **NameNode/DataNode 并发性**：对于大型集群，必须拥有更多线程以实现最大并发性。参数 `dfs.namenode.handler.count`\
  \ 控制 NameNode 的服务器线程数，应将其从默认值 10 增加到 50 或 100（取决于集群大小和可用内存）。参数 `dfs.datanode.handler.count`\
  \ 同样表示处理 DataNode 块请求的线程数。如果你（为每个 DataNode）有多个物理磁盘，可以通过将此数字从默认值 3 增加到 5 或更多来提高吞吐量。相关的属性在\
  \ `hdfs-site.xml` 中：`dfs.namenode.handler.count`、`dfs.datanode.handler.count`。\n\
  \n- **DataNode 容错卷数**：此属性默认为 0。如果一个数据卷发生故障，DataNode 将关闭。将其设置为更高的值（2 或 3）将防止在单个数据卷发生故障时\
  \ DataNode 关闭。相关的属性在 `hdfs-site.xml` 中：`dfs.datanode.failed.volumes.tolerated`。\n\
  \n以上列表并非详尽无遗。请参阅 Apache 文档，了解 `core-site.xml`、`hdfs-site.xml` 和 `mapred-site.xml`\
  \ 文件中定义的完整参数列表（如果使用 YARN，则为 YARN 配置文件）。\n\n[也请访问 www.odpi.org](http://www.odpi.org/)\
  \ 了解正在为核心 Hadoop 组件的标准化和 Hadoop 发行版的认证而开发的新 ODPi 标准的完整细节。该标准的制定将为核心 Hadoop 组件提供版本控制和协调性，并简化其使用。\n\
  \nODPi 是一个非营利组织，正在开发一个名为 ODPi Core 的通用参考规范。由于 Apache Hadoop 及其组件和发行版发展迅速且多样化，这导致了大数据生态系统的放缓。标准\
  \ ODPi 核心的概念将通过提供通用运行时的规范，并协助创建参考实现和测试套件，从而节省成本、降低复杂性，进而加速大数据解决方案的开发。\n\n### JVM/YARN/MapReduce\
  \ 配置\n\n所有 Hadoop 守护进程都是 JVM，因此了解如何为 JVM 获得最佳性能非常重要。有一些通用指南，以及促进故障排除的方法，因为你的环境中可能存在某些原因或特定问题，这些原因或问题可能会驱动某些配置参数值，而这些值可能不遵循通用指南。\n\
  \n## 通用 JVM 指南\n\n请注意，以下指南是通用的，你的特定环境可能有特定的要求，可能无法从中受益。\n\n- **为所有守护进程使用启用了压缩 OOPS\
  \ 的 64 位 JVM**：在 64 位环境中使用 64 位 JVM 非常重要，因为这使你能够使用最大可能的硬件资源（内存）。使用压缩 OOP（普通对象指针）是一种在\
  \ 64 位环境中减少 Java 对象大小的技术。一个很大的好处是你可以使用相同的内存量容纳更大的 JVM。该技术的一个主要缺点是，在访问由压缩 OOP 引用的内存之前，需要进行地址解压缩。这会影响性能并占用宝贵的\
  \ CPU 资源。从 Java 6 更新 18 开始，Oracle（默认情况下）会根据最大 Java 堆大小在 JVM 中启用选项 `UseCompressedOops`。\n\
  \n- **最佳 Java 堆大小**：当 JVM 开始执行时，它会从操作系统获取一些内存，并将此内存用于其所有需求。这部分内存称为 Java *堆内存*。一个好的做法是将最小（或起始）和最大堆大小设置为相同的值（即设置\
  \ `Xmx == Xms`）。不要对诸如 `NewSize` 或 `MaxNewSize` 之类的参数使用 Java 默认值。对于大于 4 GB 的 JVM，你可以将\
  \ `MaxNewSize` 的比例（新 JVM 与旧 JVM 的大小）设为 1/8 到 1/6。\n\n- **使用低延迟 GC 收集器**：垃圾收集（GC）是对属于已删除对象或已完成进程的堆空间的重用。你应该使用使用选项\
  \ `UseConcMarkSweepGC` 的并发算法或收集器。这是因为对于 Hadoop 守护进程的 JVM，它们的内存使用动态性更强，你需要保持 GC 暂停时间更短（即使这会占用更多的\
  \ CPU 时间用于 GC）。请注意，并发收集器需要为 JVM 分配更多的 RAM（相对于 GC 的串行或并行收集器）。选项 `ParallelGCThreads=<N>`\
