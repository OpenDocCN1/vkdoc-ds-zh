  第 10 章讨论了如何计算（用于生产环境的）集群规模。这里我将从工作节点配置和节点总数开始。节点上的操作系统和其他基本应用程序需要一些空间（本例中约为总空间的
  2%，因为 2 TB 的 2% 是 40 GB——这对于操作系统和软件来说足够了。尽管我提供了为操作系统和软件预留存储空间的一般指南和百分比，您还需要考虑磁盘驱动器的大小以及大致需要多少空间），并且数据块会根据复制因子（默认为
  3）进行复制。


  考虑：


  `每节点 HDFS 空间 = (每节点原始磁盘空间 – 2% 非 DFS 本地存储) / (复制因子)`


  从以下启动（独立）工作节点配置开始：


  - 最新一代处理器，共 12 核

  - 每核心 4 GB 内存

  - 每核心 2 TB SATA 磁盘

  - 1GbE 网卡


  `每节点 HDFS 空间 = (2 TB – 2% 非 DFS 本地存储) / 3`


  `每节点 HDFS 空间` 为 653 GB：


  `工作节点数 = 总 HDFS 空间 / 每节点 HDFS 空间`


  `工作节点数 = 60 TB / 653 GB = 92`。


  对于名称节点：


  - 共 6 核

  - 4 GB 内存（3 GB + 每 100 TB 原始磁盘空间额外 1 GB）

  - 需要复制（用于故障切换）

  - RAID-1 存储

  - 名称节点应在 64 位操作系统上运行，以避免 JVM 堆大小的 3 GB 限制


  对于 YARN，您可以使用 4 GB 内存和 4 核 CPU 作为资源管理器的初始配置。如果资源使用率达到上限，请相应调整资源分配。总结一下，您需要一个包含 92
  个数据节点、一个名称节点（采用故障切换配置的两个节点）以及一个用于 YARN 资源管理器的节点的 95 节点集群。


  您可以根据第 10 章提供的指南计算开发环境的规模。为了获得良好性能，可以在数据节点上使用提供 7,200 RPM 的 SSHD（固态混合硬盘）存储或提供 10,000
  RPM 的 SATA III 驱动器。


  最后，网络邻近性或属于同一子网将有助于减少节点间的网络流量并提供良好性能。


