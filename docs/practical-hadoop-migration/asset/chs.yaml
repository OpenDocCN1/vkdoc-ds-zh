  该过程涉及比较逻辑数据模型（LDM）与数据流模型（DFM），并解决不一致之处。


  为此，需进行以下几项检查：


  1. **将 DFM 流程与 LDM 实体匹配**：需要验证 LDM 中的所有实体在 DFM 中都有对应的流程对其进行修改。以下是此类匹配的示例（我并未展示所有匹配项，但找出遗漏的匹配项会是一份很好的练习）。请注意，像`Policy_type`这样的实体保存的是静态参考数据，可能关联着诸如静态数据维护（未在
  DFM 中显示）之类的流程。


  | **DFM 流程** | **受影响的 LDM 实体** |

  | --- | --- |

  | *未指定* | `Policy`（保单）、`Policy_owner`（保单持有人） |


  第三章 ■ 使用 SSADM 进行关系型设计


  2. 逻辑 DFM 中的数据存储应与 LDM 中的实体保持一对一关系。一个数据存储可能包含多个实体，但一个实体只能存在于一个数据存储中。若存在任何例外情况，应逐一说明其合理性。在本案例中，只有一个数据存储（`Claims`（理赔）），且
  LDM 中的所有实体都包含在其中。


  3. 确保 DFM 中定义的基本流程能够通过导航数据模型获取所需数据。这是对第 1 项的逆向检查，旨在确保 DFM 流程能够访问 LDM 中的实体。对于`Policy`和`Claims`处理系统，DFM
  中的所有流程仅写入`Policy`和`Claim`实体，因此通过了此项检查。


  ## 当前服务与系统范围的逻辑视图


  此步骤的主要目的是通过消除外部物理因素、重复和冗余，将当前物理 DFM 转换为逻辑 DFM，并以 LDM（从定义上看已是逻辑层面）作为验证参考。这意味着什么？


  数据流模型包含逻辑流程与物理流程的组合。此外，有些数据存储仅为当前系统的物理实现服务，对逻辑实现无贡献。例如，可能存在一个专门用于记录执行数据的存储，以及相应填充数据的流程。这类流程和数据存储需要从数据流模型中剔除（以将其转换为逻辑
  DFM）。最后，还需考虑将重复的流程/数据存储进行合并。


  在`Policy`和`Claims`处理系统中，我没有展示任何满足物理实现的流程。同样，如前所述，存在用于维护静态参考数据的流程，但我也没有在 DFM 中呈现这些流程。


  因此，该 DFM 本身已是逻辑 DFM，很容易就能准备出所提供服务的逻辑视图：


  - 添加或修改客户和保单（通过 YourState 网站或免费电话号码）

  - 为客户提交并处理理赔（通过 YourState 网站或免费电话号码）


  如您所见，该系统的范围也通过指定所提供的服务自动记录在案。


  综上所述，创建此服务逻辑视图的目的或好处是什么？逻辑视图有助于阐述系统物理实现背后的思考或策略。因此，当情况发生变化或某项决策受到质疑时，逻辑视图能记录该决策背后的逻辑，便于交叉核对。


