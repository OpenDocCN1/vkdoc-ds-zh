  ### 数据库设计的组成部分


  现在，我们将聚焦于关系型数据库设计中使用的主要结构。你需要在概念设计和逻辑设计阶段使用它们。我相信你之前在某个数据库开发项目中使用过主键、外键或触发器，但了解一下这些组件在关系型设计范畴内的定位仍然很有意义。像超类型或子类型这样的结构并不常用（或者至少不为人所理解），而像基数性（`cardinality`）或自引用关系（`self-referencing
  relationships`）这样的结构则需要被完全理解，才能设计出好的方案。


  最常讨论的关系型概念是*范式*（`normal forms`）。它是关系型设计的一个亮点，但遗憾的是，许多设计人员对此仍不十分清楚。我将通过一个例子来讨论这三个范式。我还会简要介绍博伊斯-科德范式（`BCNF`）供你理解，尽管它更多是理论性的，在实践中很少使用。


  ---


  '
- "# 第二章 ■ 理解 RDBMS 设计原则\n\n最后，你需要理解，将数据保持在第三范式并不总是最佳选择。出于报告或数据仓库的需求，你需要对数据进行反范式化。我也会通过一个例子来讨论这个概念。\n\
  \n#### 范式\n\n规范化是一个通过识别并消除任何数据冗余，同时保持（数据内部的）交叉引用完好的方式来高效组织数据的过程。其目标是完全消除数据冗余，并获得更好的数据组织。规范化是一个多步骤的过程，根据该过程应用于数据的程度，数据被称为处于*第一*、*第二*或*第三*范式。\n\
  \n还有更高形式的规范化，例如 `BCNF`、第四范式和第五范式，尽管它们多是理论性的，在现实世界中很少使用。\n\n##### 第一范式\n\n第一范式的目标是识别并将任何重复的数据组隔离到单独的表中，当然，同时要保持与源数据的交叉引用完好。一行数据可能包含一个或多个重复组，你需要首先将它们识别出来。以下是一个例子。假设有一家销售健康保险的保险公司。拥有有效保单的客户通过公司呼叫中心接听的免费电话提交索赔。根据简短的对话，通常会为一次索赔捕获以下信息：`ClaimId`、`ClaimSubmissionDate`、`CustomerName`、`DateOfBirth`、\n\
  `SocialSecurityNumber`、`CustomerAddress`、`ClaimNotes`、`ClaimType`、\n\n`ClaimShortDesc1`、`PhysicianId1`、`ClaimShortDesc2`、`PhysicianId2`、\n\
  \n`ClaimShortDesc3`、`PhysicianId3`、`NumberOfResubmissions`\n\n`ClaimId` 是一个系统生成的数字，每增加一条新索赔，该数字就会递增。\n\
  \n\n\n`ClaimType` 表示索赔类型（例如牙科、眼科、医疗等），`ClaimShortDesc`（1-3）包含了随着索赔处理进展、病情被转诊给其他医生或专科医生时，对实际主诉的简短描述。`PhysicianId`（1-3）是参与患者治疗的医生的标识符。一项索赔可能关联一个或多个（最多三个）医疗状况及对应的医生。\n\
  \n`NumberOfResubmissions` 记录了此项索赔被重新提交处理的次数。以下是示例数据：\n\n```\n13666969 , 6/1/2015\
  \ 09:30:13, Bobby Simpson, 02/12/1964, 219-44-3211, 1 Oak st. Darien IL 60561, Consulted\
  \ Physician out of network since closest and\nthen a specialist, Medical, Severe\
  \ stomach pain, 43211, Cramp of abdominal muscles, 12456, NULL, NULL, 0\n```\n\n\
  ```\n13666970 , 6/1/2015 10:00:23, Alan Border, 03/22/1961, 239-32-5674, 21\nMaple\
  \ st. Naperville IL 60563, Cause of pain still not determined,\nMedical, Pain in\
  \ left shoulder, 31341, Left shoulder dislocation, 11232, Physiotherapy, 54543,\
  \ 1\n```\n\n第二章 ■ 理解关系数据库设计原则\n\n```\n13666971 , 6/1/2015 10:05:11, Steve Waugh,\
  \ 12/14/1970, 246-56-9867, 32\nMadison ct. Woodridge IL [  60517](https://www.google.com/search?rlz=1C1PRFC_enUS598US598&espv=2&biw=1600&bih=760&q=60517&stick=H4sIAAAAAAAAAGOovnz8BQMDAx8HsxKXfq6-gWG8RVJeRua0GZGaTLPSNAoS1uSYxetcE9jyHAA5duj3KwAAAA)\
  \ , Most probably seasonal allergies, Vision, Dry itchy eyes, 73443, Eye infection,\
  \ 33342, NULL, NULL, 0\n```\n\n```\n13666972 , 6/1/2015 11:29:16, Ricky Ponting,\
  \ 10/03/1965, 223-43-7658, 54\nArgyle st. Westmont IL 60559, Dentist recommended\
  \ removing tooth; but\npatient not agreeing, Dental, Severe pain in maxillary first\
  \ molar, 41414, NULL, NULL, NULL, NULL, 1\n```\n\n```\n13666973 , 6/1/2015 12:09:18,\
  \ Bobby Simpson, 02/12/1964, 219-44-3211, 1 Oak st. Darien IL 60561, Referred to\
  \ Ophthalmologist by regular Optometrist,\nVision, Double vision, 33562, Change\
  \ of prescription, 25251, NULL, NULL, 0\n```\n\n```\n13666974 , 6/1/2015 14:06:41,\
  \ Ricky Ponting, 10/03/1965, 223-43-7658, 54\nArgyle st. Westmont IL 60559, Most\
  \ probably seasonal allergies, Vision,\nDry itchy eyes, 63462, NULL, NULL, NULL,\
  \ NULL, 0\n```\n\n快速浏览这些数据会让你意识到，这些数据存在重复组（以粗体标示），进而导致数据重复。它还包含其他一些问题（稍后我会讨论）。重复的数据块是与索赔相关的医疗状况和医生详细信息。\n\
  \n此外，按照这种表结构设计，最多只能记录三项医疗状况及其关联医生。但如果一项索赔关联了超过三项医疗状况，该怎么办？由于这种情况很少发生，该系统的设计人员要求呼叫中心代表创建一个新的索赔，并在当前索赔的备注部分引用这个新编号！这是一个糟糕的变通方法，这个设计问题需要解决。\n\
  \n为了让这个表满足第一范式，你需要将医疗状况数据移到一个单独的表中。这能解决另一个问题（即一项索赔关联超过三项医疗状况）吗？让我们来看看。\n\n现在，在我们将重复数据移到新表之前，需要确保能够对其进行交叉引用，并且它仍然与正确的索赔相关联。首先，看看你是否能为你的\
  \ `Claims` 表唯一地标识每一行数据。在这个例子中，你可以做到；因为 `ClaimId` 是系统生成的唯一编号，可以用来唯一标识一行。这种标识符被称为*主键*，并且可以将该列指定为主键列。\n\
  \n接下来，你需要为新表唯一地标识每一行。由于一项索赔关联了多个医疗状况，仅凭 `ClaimId` 不足以作为主键。你还需要额外添加一个序列号来确保主键的唯一性。此外，在这种情况下，序列号确实有意义（因为它记录了针对一项索赔诊断出医疗状况的顺序），并且可能对分析有用。\n\
  \n所以，在将数据移到一个新表（称之为 `ClaimMCdata`）之后，新表将如图 2-6 和图 2-7 所示。\n\n第二章 ■ 理解关系数据库设计原则\n\
  \n**Claims**\n\n**索赔 ID** | **提交日期** | **客户姓名** | **出生日期** | **社保号** | **客户地址**\
