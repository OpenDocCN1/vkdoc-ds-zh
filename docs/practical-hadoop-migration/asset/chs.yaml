- '# 在本章中，我试图涵盖基于 Lambda 架构的 Hadoop 实现的所有方面。请注意，这是一个通用实现，旨在让你了解在你的环境中实现 Lambda 所涉及的步骤。


  另外，请注意，我的方法讨论的是来自关系型数据库的数据，而非基于点击流的 Web 应用程序。采用这种方法有几个原因。


  最主要的原因是，大多数生产系统都基于关系型数据。


  基于社交媒体、传感器或移动设备的新数据仍未成为主流。它们主要被用作补充或辅助数据。此外，大多数点击流应用程序包含半结构化（或非结构化）数据，这些数据差异很大，因此单一示例可能并不具有很好的代表性。


  本章（以及本书）更多地是关于将基于关系技术的系统迁移、集成或过渡到 Hadoop。因此，我使用 `RDBMS` 数据作为你将处理的源数据示例。实际上，大多数情况确实如此。那么，你在何处以及如何能够使用
  Hadoop？你可以使用 Hadoop 来移动、转换、聚合数据，并使其为分析做好准备。哪种类型的分析？这完全取决于你的具体用例。


  Hadoop 的应用涵盖范围很广，从发现零售商品购买趋势的历史规律，到根据产前生物学数据准确预测出生状况。澳大利亚的一家医院使用 Hadoop 分析大量的产前数据，以预测婴儿可能患有的疾病，并准备好相应的资源。保险公司和信用卡公司使用
  Hadoop 建立预测模型以防范欺诈。Hadoop 还被用于交通分析和最佳路线预测。其可能性是无穷无尽的。


  但请记住，Hadoop 只是一个强大的工具，其最佳使用效果取决于用户或设计者的技能水平（和创造力）。新的技术、架构和应用程序每天都在涌现。目前它确实是一种新兴技术。希望我已经提供了一些有用的信息和思路方向，帮助你利用这项技术。


  当你在自己的环境中实施迁移或集成时，你将需要使用额外的工具或技术。一些遗留系统不会让你轻易地提取数据。幸运的是，有足够多的论坛和用户群可以提供帮助。你很少会遇到提问却无人回答的情况。协作和知识共享的精神是
  Hadoop 及其周围构建的任何开源解决方案的最大优势之一。我祝你在实现基于 Hadoop 的系统时好运，并希望你能够成功地将现有系统与它们连接起来！


