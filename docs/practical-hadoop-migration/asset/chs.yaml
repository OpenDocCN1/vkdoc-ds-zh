- "# 关系型数据库管理系统设计与实现工具\n\n数据库。本章旨在帮助你有效理解关系型应用程序的设计文档（以及逻辑/物理设计），并最终协助你成功完成迁移。此外，正如我在每个`SSADM`设计阶段所讨论的，`SSADM`设计技术独立于实现目标（`RDBMS`或`NoSQL`），因此对于你计划实现的任何系统的设计都是有用的。\n\
  \n那是在 2001 年，由于互联网泡沫彻底破灭，预算非常紧张。我当时正在为芝加哥市中心的一家大型保险公司重新设计一个理赔报销系统，需要一个优秀的`CASE`工具。我向我的经理提及此事，他一脸茫然的表情促使我解释了该工具的功能。“嗯，难道你不能用`Word`吗？”我解释说无法用文字处理软件完成所需的操作。下一个问题是是否有任何开源或“免费”软件可用。看到一家准备花费数百万美元进行咨询的公司，却不愿为必要的数据库工具花费几千美元，这着实令人惊讶。\n\
  \n我经常看到人们对许多专门的数据库工具普遍存在漠不关心和缺乏了解的情况。此外，随着技术的发展和新技术、新工具每天涌入市场，新的数据库专业人员很难理解或熟练掌握用于设计、监控或绘制图表（流程图）的数据库工具。我认为，了解可用于`RDBMS`实现的工具类型及其特性将大有裨益。\n\
  \n流行的`RDBMS`实现工具涵盖了从设计到管理和监控的各个方面。任何`RDBMS`的实现都始于设计。常用于设计的工具有两种。第一种是`CASE`工具，它辅助完成概念设计和逻辑设计，以及向物理数据库结构的转换。第二种是绘图或流程图工具，它辅助绘制与数据库设计相关的不同类型的模型。我将在本章中讨论这两种工具。\n\
  \n还有一些应用程序有时被开发人员用来将`RDBMS`数据转换为面向对象的模型。这些框架被称为对象关系映射（`ORM`）框架。如果你计划将关系数据库表示为`ODBMS`（面向对象数据库），它们会很有用。`Hibernate`和`Spring`是可用于此目的的流行框架。它们提供了诸如高性能、可扩展性、可靠性、可扩展性和惯用持久性（能够开发遵循面向对象惯用法的持久化类，包括继承、多态、关联和组合）等特性，有助于成功、快速且简便地完成`ORM`转换，从而缩短你的开发时间。\n\
  \n© Bhushan Lakhe 2016  \nB. Lakhe, *Practical Hadoop Migration*, DOI 10.1007/978-1-4842-1287-5_4\n\
  \n回到`RDBMS`，在数据库被设计并实现为物理结构（针对目标`RDBMS`）之后，需要对其进行日常管理和维护。可能需要创建新的数据库，扩展（数据库的）已分配空间，或者添加用户或为新对象提供访问权限。数据库管理工具有助于轻松快速地完成所有这些任务。\n\
  \n最后，需要对数据库（以及数据库服务器）进行性能、未授权访问以及任何可能导致服务中断的故障进行监控。在许多情况下，用于数据库管理的工具也提供监控功能，但某些情况下确实需要使用专门的监控工具，这些工具提供更广泛的功能和灵活性。\n\
  \n### 数据库设计工具\n\n第[3 章讨论了使用`SSADM`作为方法的数据库设计过程](http://dx.doi.org/10.1007/978-1-4842-1287-5_3)。你可能已经注意到，设计过程会产生大量模型和可交付成果。这些模型/可交付成果是相互关联的，因此有必要清晰地展示它们之间的关系。\n\
  \n分别绘制这些模型并展示现有关系既繁琐又耗时。`CASE`工具有助于此过程，它能够辅助构建初始（逻辑/概念）模型，利用该模型生成下一阶段的模型，并持续进行直到达到最后阶段（物理数据结构）。\n\
  \n绘图或流程图工具不提供这种广泛的功能，但拥有庞大的预设计模板库，有助于快速创建流程图或图表。根据个人经验，绘图工具更适用于数据流图或业务活动模型等模型。\n\
  \n#### CASE 工具\n\n`CASE`工具是辅助实施与计算机辅助软件工程（`CASE`）相关过程的工具。它们用于设计和实现软件应用。影响`CASE`工具发展的因素有几个，例如`CAD`（计算机辅助设计）或“活动数据字典”。数据库设计者注意到`CAD`软件包通过其预构建模板、形状库和所需功能为*草图绘制*（手动绘制机器零件设计各种视图并按比例缩放的过程）提供的便捷性。诸如易于修改以及将设计传播到`CNC`机床以进行实际零件制造等更有用的特性也给这些数据库设计者留下了深刻印象。\n\
  \n另一个主要影响是[数据库的数据字典](https://en.wikipedia.org/wiki/Data_dictionary#Data%20dictionary)。设计者通过实验扩展了[字典中保存的元数据范围](https://en.wikipedia.org/wiki/Metadata#Metadata)，使其包含应用程序属性并在运行时进行替换。这种“活动字典”导致了[模型驱动工程](https://en.wikipedia.org/wiki/Model-driven_engineering#Model-driven%20engineering)的出现，但它没有任何元数据的图形表示。一旦（受`CAD`启发）添加了图形表示，就导致了早期`CASE`工具的开发。\n\
  \n那么，`CASE`工具如何帮助数据库设计过程呢？通过帮助设计阶段的图形表示，以及将设计好的模型传播到后续阶段，直到设计过程最终形成物理数据库结构。\n\n\
  由于`CASE`工具辅助完成软件开发生命周期（`SDLC`）中的特定任务，因此它们对于实现数据库设计方法论非常有用。你可能已在[第 3 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_3)中注意到，我使用了`CASE`工具`Erwin`来设计与设计方法`SSADM`相关的各种可交付成果，例如逻辑设计模型（`LDM`）或物理数据模型（`PDM`）。总而言之，`CASE`工具可以通过以下方式辅助设计过程：\n\
  \n- 为你的应用程序设计构建设计层\n- 使用主题领域对你的设计进行分类\n- 控制模型的物理显示级别\n- 根据需要执行正向或逆向工程\n- 帮助为你的设计创建可重用组件\n\
  - 轻松快速地在各设计阶段间传播变更\n\n### 构建和使用设计层\n\n\n\n在应用程序开发过程中，用于特定目的的一组数据模型构成了一个设计层。在这个层次结构中，第一层通常是逻辑数据模型，它概括了（应用程序的）业务需求。第二设计层转换这些业务需求，并为物理数据模型创建相应的数据库实施规则（注意，可以使用通用的`ODBC`作为目标数据库来创建通用的物理模型）。第三层，也是最后一个设计层，针对不同的目标服务器平台，表示同一数据模型的物理实现。\n\
  \n如果来自第一层的逻辑数据模型是一个企业数据模型，那么它可以进一步划分为对应于组织中不同应用程序的逻辑模型。图表 4-1 总结了这些层次。\n\n![Image\
  \ 22](img/index-115_1.jpg)\n\n图 4-1. 关系型 OLTP 应用程序的设计层\n\n关于设计层，最重要的一点是，你必须能够链接不同设计层中的模型，并同步在不同层中所做的更改（即，将更改传播到其他层）。一个成功的层级结构的特点是：使用共同的模型源，在不同设计层之间拥有良好链接的模型，并能够跨设计层应用转换（保持链接的模型同步）。\n\
  \n像`Erwin`、`ER/Studio`或`Enterprise Architect`这样的 CASE 工具提供了所有必要的功能来定义逻辑模型，并应用转换从中派生出通用的或特定的物理模型。这样，链接通过设计层得以维护，任何修改都可以应用到逻辑数据模型，相关的物理模型也能快速重新生成。\n\
  \n### 使用主题域进行分类设计\n\n很多时候，当你开始审查一个大型数据模型时，它会让人望而生畏，且信息性不强或不够直观。原因是它向你展示了大量相关实体，却没有告诉你它们（或其子集）提供什么功能。你只知道该模型属于一个提供某些功能（如会计、人力资源管理、保单与理赔管理等）的系统。\n\
  \n主题域根据实体为信息系统提供的功能子集对它们进行分组。通过这种方式对实体进行分类，主题域提供了对功能的快速子分类，使数据库模型更易于理解和阅读。\n\n考虑前几章中用于保单与理赔处理的逻辑模型。\n\
  \n你已经看到了它在没有主题域时的样子（图[3-7](http://dx.doi.org/10.1007/978-1-4842-1287-5_3#Fig7)）。通过定义主题域，你可以看到图\
  \ 4-2 中的差异。\n\n![Image 23](img/index-117_1.jpg)\n\n图 4-2. 保单与理赔处理应用程序的主题域\n\n正如你所看到的，现在更容易理解实体的来龙去脉，并且你很可能猜出它们的目的。例如，对于“比赛缺失险”主题域，很容易看出`LossOfPlayProspect`实体是该保单处理的核心，而其他实体只是提供关于运动员的信息（其合同是投保人试图投保的）。类似的信息也可以从其他主题域中快速、轻松地推导出来。\n\
  \n当使用 CASE 工具实现主题域时，它们可以单独显示，也可以作为主主题域的一部分显示。即使你没有定义特定的主题域，默认也会定义一个主主题域，并且所有实体都是它的一部分。当你将一个实体添加到某个特定的主题域时，它仍然是主主题域的一部分，并且在一个主题域中对它所做的任何更改都会自动应用到该实体所属的所有其他主题域中。\n\
  \n### 模型的显示级别\n\nCASE 工具为数据模型提供各种显示级别，例如：\n\n*   实体（仅显示实体及其相互关系）\n*   属性（显示实体和属性）\n\
  *   主键（显示所有实体的主键）\n*   键（显示所有实体的主键和外键）\n*   定义（显示实体定义和关系）\n*   图标（显示实体和图标）\n\n这些显示级别有助于根据你的需要控制可视化。例如，如果你只想显示实体关系，那么实体显示级别就足够了；或者如果你想显示主键和外键关系，那么键显示级别将是合适的（图\
  \ 4-2 使用了键显示级别）。通过只显示必要的详细程度，显示级别使得更容易关注相关的细节。\n\n### 正向工程与逆向工程\n\n正向工程涉及在目标`RDBMS`的模式/数据库中创建物理表结构。你可以使用设计层概念，并在必要时创建一个通用物理模型作为中间步骤。许多\
  \ CASE 工具可以读取使用建模工具准备的数据模型，然后也可以对其进行正向工程。\n\nCASE 工具如何实现这个特性？嗯，作为最后一步，CASE 工具使用目标`RDBMS`支持的查询语言提供数据定义语言（`DDL`）脚本。但在此之前，你可以为目标脚本选择多个选项。这些选项涉及：选择要导入的数据库对象和属性；指定是否要从索引推断主键或关系；设置大小写转换选项；生成索引脚本（用于实现主键、外键和备用键关系）；通过触发器实现参照完整性等，并且可以通过点击菜单轻松选择。\n\
  \n![Image 24](img/index-117_2.jpg)\n\n逆向工程，正如你所料，是正向工程的逆过程。它以物理数据库（包含对象）为起点。该过程会读取所有对象的元数据，确定关系，并创建一个物理数据模型。利用现有数据库可以加快新数据模型的设计以及后续新系统的交付。然后（使用物理模型）可以轻松生成逻辑数据模型。如果无法连接到数据库（并读取元数据），也可以使用（需要逆向工程的数据库对象的）`DDL`脚本。图\
  \ 4-3 总结了这一过程。\n\n```\nDatabase connection\nDatabase DB1\n\n**Physical Data Model**\n\
  Reverse engineering function\nwithin a CASE tool\n\nOR\n\nCREATE TABLE Claim (c1\
  \ int,\nINDEX ix_1 NONCLUSTERED (c1))\nCREATE TABLE Policy (c1 int INDEX\nix_1 NONCLUSTERED\
  \ (c1))\nCREATE TABLE LossOfPlayProspect\n(c1 int, c2 int INDEX ix_1\nNONCLUSTERED)\n\
  CREATE TABLE Claim_type (c1 int,\nc2 int, INDEX ix_1 NONCLUSTERED\n(c1,c2))\n\n\
  DDL script\n…………………………………\n```\n\n图 4-3. 逆向工程过程\n\n\n\n"
- '# 排版后的文档


  在尝试逆向工程之前，确保为数据库定义了参照完整性约束（或者在`DDL`脚本中编写了脚本）非常重要。否则，你只会看到实体框。当然，模型中可能仍然缺少某些关系，但你需要手动添加它们（例如，递归关系或超类型/子类型关系）。


  ## 创建可重用组件


  `CASE`工具的强项之一是能够创建一系列易于重用的组件。例如，域。一个*域*是一个模型对象，可用于分配属性或列属性。使用域可以使你的模型保持一致，因为你可以多次重用它们。域还可以让你轻松捕获环境的特定设置，以便在数据模型中快速重用。


  例如，如果你需要使用一个只包含特定值集合的状态属性，你可以创建一个域并按需使用它。


  域还有助于减少开发和维护时间。对域的任何更改都会导致更改所有关联的属性或列。`CASE`工具提供了一个库或字典，用于保存你创建的逻辑和物理域。通常，域的一些属性包括：


  -   域名和列名

  -   列数据类型、默认值和有效值

  -   域注释或说明以及列注释或名称

  -   用户定义的属性


  `CASE`工具使得在不同模型之间重用实体对象甚至主题区域变得容易。因此，你也可以将它们视为可重用组件。许多`CASE`工具使用为模型输入的实体和属性定义生成数据字典。这些定义也可以（与实体一起）在模型之间重用，并将减少多次输入这些定义的繁琐任务。


  ## 轻松快速地传播更改


  `CASE`工具的功能，如前向和反向工程、模型的物理/逻辑视图以及通用物理模型的快速生成，有助于将任何设计修改快速传播到物理数据结构。如果更改是针对被多个实体引用的关键实体，这一点尤其重要。可以想象，手动尝试级联这样的更改会耗时且可能引入错误。


  例如，一家保险公司使用一个上限为 99,999,999 的`ClaimId`。他们推出了一项非常受欢迎的新政策，现在达到了 1 亿以上的门槛。因此，`ClaimId`需要增加大小。`ClaimId`被大量表引用，其大小的更改需要反映在所有那些表中。`CASE`工具可以帮助你快速生成能够轻松且无错误地实现此更改的脚本。


  #### 图表工具


  图表工具的重点是提供大量的形状、图标和模板库，以便快速绘制模型。你可以绘制`SSADM`交付物中包含的任何模型（或流程图）（或其他必要的模型）。`CASE`工具不提供流程图或自由格式的绘图功能。例如，如果你需要绘制数据流图，那么你将需要使用图表工具，而不是`CASE`工具。


  最后，图表工具允许你在模型中插入图片、`CAD`图纸、图表、剪贴画或数据图形。当你的模型引用许多外部来源或子系统时，此功能非常有用。


  图表工具提供的常见模板/形状库如下：


  -   数据流图形状

  -   `EPC`（事件流程）图形状

  -   工作流对象

  -   跨功能流程图图形状

  -   `BPMN`基本形状

  -   `Gane-Sarson`形状

  -   工程（电气/机械/工艺）形状

  -   `ER`图

  -   `UML`图形状


  流行的图表工具包括`Visio`、`Draw.IO`、`Gliffy`、`eDraw`、`Dynamic`。




  '
- '# 绘图工具及其他


  它们提供的模板、形状或功能可能略有不同，但从概念上讲非常相似。


  因此，绘图工具在绘制各种模型方面提供了更高的灵活性和速度，但就数据建模而言，它们无法与 CASE 工具提供的功能相媲美。通常，绘图工具无法做到：


  -   逆向工程

  -   正向工程

  -   链接模型

  -   传播变更（从一个模型到另一个模型）

  -   使用主题域进行分类


  CASE 工具和绘图工具各有优势，您的具体需求将决定哪种工具最适合您的环境。两者都提供了多种您可以利用的建模功能。


  ### 管理与监控应用程序


  这些工具旨在协助管理物理数据库结构。


  管理数据库系统通常涉及以下任务：创建和管理数据库及对象、用户和角色、空间使用情况、备份计划，以及执行数据库维护（例如重建索引、重新创建统计信息以及执行其他任务）。


  监控数据库涉及设置自动化任务，用于监控进程、数据库连接和单个用户的资源使用情况，并在达到特定阈值时设置警报。在某些情况下，监控只是捕获感兴趣的指标并将其存储一段时间（一个月、一年等），以便访问历史使用情况并进行审计。


  ## 第 4 章：关系数据库管理系统设计与实现工具


  #### 数据库管理或管理应用程序


  大多数关系数据库都具有相似的结构（原因显而易见），这使得为它们设计通用图形用户界面变得容易。有几家公司已成功设计出能与所有主流关系数据库管理系统配合使用的界面。


  大多数数据库管理界面都具有以下功能：


  -   修改数据库服务器以及数据库和模式相关的配置

  -   添加/修改/删除数据库对象，如表、视图、触发器和存储过程

  -   添加/修改/删除登录名/用户/角色，并管理用户/角色的权限

  -   管理磁盘空间分配，并收缩数据库以释放已分配但未使用的空间

  -   执行数据库维护（重建索引或创建索引），包括备份

  -   安排和管理数据库相关的任务/作业，并记录其结果/状态

  -   管理数据库服务器的锁定/阻塞/死锁，并记录所有操作（例如，终止或死锁的会话）

  -   配置 SMTP 或任何其他协议，供数据库服务器用于向配置的电子邮件地址或电话号码发送警报

  -   监控复制和镜像环境以确保数据完整性

  -   设置和配置访问、安全和加密功能


  所有主流的关系数据库管理系统都有自己的数据库管理界面，但当您需要使用通用界面管理不同的关系数据库管理系统时，问题就出现了。


  这时，由第三方或中立供应商开发的界面就派上了用场。


  像 Redgate 或 Embarcadero (DBArtisan) 这样的公司已经开发了流行的工具，而像 EMS 这样的公司也开发了免费的多种数据库工具。


  ## 第 4 章：关系数据库管理系统设计与实现工具


  #### 监控应用程序


  监控工具支持广泛的功能，包括监控性能、锁定/阻塞活动、数据库连接和安全漏洞、资源使用情况以及作业输出。当任何（预先设定的）阈值被超过时，它们应生成警报，并在出现任何功能或性能问题时提供故障排除或调试功能。这些工具会建立性能基线、隔离性能问题、识别瓶颈，并提供查询统计信息。以下是详细（但通用）的任务列表：


  -   监控可能导致过度消耗资源（使用更多系统资源）的低效或昂贵的 SQL 查询和存储过程




