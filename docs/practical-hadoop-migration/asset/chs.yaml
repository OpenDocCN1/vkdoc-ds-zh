- '# 关系型设计与 Hadoop 协同：优势与挑战


  前一节讨论了两项技术的差异。那么，为何要将它们结合？需要付出什么努力？是否值得？我将逐一探讨这些问题。


  首先从两者结合的优势谈起。若回顾表 1-1，你会发现这些技术能很好地互补。若通过 RDBMS 收集了大量历史数据，便可用 NoSQL 数据库进行分析。这是因为
  Hadoop 更擅长读取大规模数据集并进行转换——唯一的前提是转换需应用于整个数据集（以保证效率）。那么，如何在你的环境中最好地利用 Hadoop/NoSQL？以下提供几点思路：


  - **将数据转化为（有价值的）信息：** 数据本身只是数字（或文本）。你需要为数据增加视角，使其对业务需求产生价值。Hadoop 可通过生成大量数据分析来协助你。例如，若用
  Hadoop 分析汽车传感器生成的数据，它能整合、汇总、分析数据，并按时间切片（如每小时、每日、每周等）提供报告，给你关键统计信息，如发动机平均温度、曲轴平均转速、每小时警告次数等。


  - **通过将多数据结构映射到单一数据集获得洞察：** 当使用 RDBMS 管理数据时，你清楚需要在数据使用前指定数据结构。参照上一节示例，若用 SQL Server
  存储客户和保单数据，就需定义用户数据库及客户、保单表结构，之后才能存储数据。相比之下，HDFS 中的客户数据仅作为文件保存，可在读取时附加结构。这种称为*读时模式*的概念，在读取数据时提供了极大灵活性。该概念的一个典型应用场景是：存储产品销售额的事实表，既可读取为“年度销售额”，也可读取为“按地区的购买趋势”。


  - **利用历史数据进行预测分析：** 在许多场景下，需要分析大量历史数据并用于预测未来趋势。Hadoop 能够（且正在被）成功用于处理 TB 级数据，整合后应用于预测模型。例如，过去十年春秋季的服装购买趋势可帮助百货商店备货正确类型的服装；客户近五年的消费习惯可助其向客户邮递合适的优惠券。


  - **构建强健的容错系统：** Hadoop 默认提供容错和冗余。每个数据块均




  `replicated thrice`作为默认配置，并且可以根据需要进行调整。RDBMS 可以配置为实时复制，但任何用于实现复制的解决方案都需要大量的设置和监控，并且由于复制开销而影响性能。此外，由于
  Hadoop 实现更新的方式，它也能容忍人为错误，因为更新的数据大多会写入新文件，保留原始数据不变。


  -   **承担广泛的工作负载**：Hadoop 可用于满足广泛的应用需求。例如，一个社交应用可以接受最终一致性，或追求低延迟读取，以及要求高性能的即席查询。凭借提供内存处理或
  ACID 合规性（`Hive 0.14`）的组件（如 `Spark`），Hadoop 现在已成为比任何 RDBMS 都更加通用的平台。

  -   **设计线性可扩展的系统**：扩展基于 RDBMS 的系统的问题在于它只能垂直扩展——而且这也不容易。这涉及停机时间和风险（因为服务器需要补充额外的硬件资源），尽管（RDBMS）的新版本支持分布式计算模型，但必要的配置很困难，需要复杂的设置和监控。相比之下，Hadoop
  可以轻松地进行水平扩展，无需任何停机时间，并且为 Hadoop 集群添加或移除 `DataNode` 既简单又快速。

  -   **设计可扩展的系统**：Hadoop 集群易于扩展（可以在不中断服务的情况下轻松添加功能）。由于使用了灵活且全面的 `Log4j` API 进行广泛的日志记录，故障排除很容易，并且需要最少的维护或手动干预。相比之下，RDBMS
  需要大量的监控和设置才能维持正常运行。


  如果 Hadoop 部署有如此多的优势，为什么不是每个人都在他们的环境中实施它？原因（如前所述）是 Hadoop 并非所有类型数据或业务需求的最佳解决方案。此外，即使匹配，在将
  Hadoop 引入您的组织时也会遇到许多挑战，我将在下一节中讨论这些挑战。


  ## 第一章 RDBMS 遇见 Hadoop：集成、重新架构和过渡


  ##### 数据类型


  以下是根据您处理的数据类型需要考虑的事项：


  -   **工作负载**：Hadoop 最适合读取密集型工作负载。如果您有一个事务性系统（当前使用 RDBMS），那么需要额外的工作来派生一个非规范化的类仓库版本的数据库，并通过适当的
  Hadoop 工具（如 `Sqoop` 或 `Flume`）将其摄取到 `HDFS` 中。对此数据的任何更新都必须作为从源文件读取、应用更新（视情况而定）并写出到临时文件（该文件成为新源）来处理。尽管某些
  NoSQL 数据库的新版本（`Hive 0.14`）支持更新，但以此方式处理更为高效。

  -   **高延迟**：对于大多数 NoSQL 数据库，延迟会随着吞吐量的增加而增加。如果您的应用程序需要低延迟，您将需要对硬件资源进行基准测试和调整。此任务需要对
  Hadoop 监控和各种 Hadoop 守护进程有很好的理解，并且需要具备配置 Hadoop 集群的专业知识。

  -   **数据依赖**：如果您的关联数据是面向列的或嵌套的（具有多层嵌套），那么您还有更多工作要做。由于 NoSQL 中没有`join`，因此在将数据存储到
  NoSQL 数据库（或 `HDFS`）之前，您需要对其进行非规范化处理。此外，对依赖数据的级联更改（类似于 RDBMS 中的外键关系）需要以编程方式处理。NoSQL
  数据库中没有可用的工具来提供此功能。

  -   **模式**：您的模式（对于存储在 RDBMS 中的数据）是静态的，如果您需要使其成为半动态或完全动态，您需要进行适当的更改以适应 NoSQL 的使用。


  #### 数据量




