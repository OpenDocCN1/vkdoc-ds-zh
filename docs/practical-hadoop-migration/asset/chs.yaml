  另一个需要考虑的问题是数据的唯一性。由于数据行的任何更改都可能生成新行，因此唯一标识符（`ID`列，例如我定义的 `CustomerID`、`LocationID`
  等）如果不辅以时间戳，将不会是唯一的。Lambda 建议为每个事实添加一个时间戳列，在我们的示例中，每个数据表标识一个事实。这种方法也能提供完整的变更历史，因为我们假设任何列值发生变化时都会新增一行。


  这种模式的不可变性也使其变得*永恒正确*。实际上，任何数据行都提供了其包含信息在关联时间戳所指示日期/时间点的正确版本。接下来，我将演示如何使用此模型来支持我所举例的销售管理系统中的事实。


  图 9-6 展示了销售管理系统中的事实示例，并演示了事实的两个重要属性：*原子性*和*永恒正确性*。


