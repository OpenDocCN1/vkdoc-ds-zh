  ## 实体生命周期图 (ELHs)


  对于一个实体，`ELH`按顺序展示了各种业务事件所造成的影响。


  `ELHs`使用结构化设计构造（顺序、选择、迭代和并行）来绘制。使用的符号与`ECDs`几乎相同，但增加了层级。第一层是实体本身，第二层是事件类型。第三层包含修改实体（数据）的单个事件。最后一层包含修改实体的处理操作。在某些情况下，第二层和第四层可能不需要，可以省略。


