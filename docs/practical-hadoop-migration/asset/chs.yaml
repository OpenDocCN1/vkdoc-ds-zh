- '# 第四部分：从关系型到 NoSQL 设计模型的过渡


  ### 第九章：用于实时 Hadoop 应用的 Lambda 架构


  不久前，我在 IBM 全球服务部门面试一个数据库管理员职位的候选人。


  我问候选人，他们在客户现场作为数据库管理员应该执行的最重要任务是什么。我期望的答案是生产环境备份，而六名候选人中只有一人回答正确。一个简单的任务，却被大多数人忽视了。奇怪的是，正是缺乏一个明确定义的数据备份流程，最终导致了
  Nathan Marz 提出了大数据领域最受关注的架构之一。根据他自己的承认（在他的著作《大数据：可扩展实时数据系统的原则与最佳实践》（Manning 出版社，2015
  年）中），Nathan 在进行日常维护工作之前忽略了备份数据，并且由于维护涉及删除数据，意外删除了一些重要数据，导致项目进度倒退了数周。这段经历显然塑造了他关于系统应该如何架构的看法。这让他意识到，新的架构不仅应该能够容忍机器故障，还应该能够容忍人为错误。


  Lambda 架构（由 Nathan 设计）专注于不可变数据和批量计算，而非增量计算。Lambda 的基本前提是，增量计算和更新会增加处理的复杂性，从而影响性能。通过避免（或至少减少）增量更新，可以简化架构并使其更高效。数据不可变性通过构建一个批量层（不修改主数据集）来提供，该层满足用户查询和数据需求。还有一个服务层，用于提高数据分发的效率。


  最后一个层（速度层）是唯一执行增量计算的层，用于获取在批量层计算之后数据的最新修改。这样，涉及增量计算的数据量就很小，整体性能影响也最小。查询响应是使用组合数据集（来自批量层和速度层的数据的并集）来计算的。


  © Bhushan Lakhe 2016

  B. Lakhe, 《Practical Hadoop Migration》, DOI 10.1007/978-1-4842-1287-5_9

  第九章：用于实时 Hadoop 应用的 Lambda 架构


  你可以看到，这种架构简化了许多任务。添加新功能很容易，因为它可能只涉及添加处理逻辑（查询）或最多添加新的视图（对批量层的增强）。从人为错误中恢复很容易实现，因为你可以根据需要从批量层或速度层重建视图。性能优化也可以很容易地实现，只需根据需要调整批量层或对视图进行索引。最后，这种架构足够通用，可以应用于任何数据处理环境。




  '
- '# Lambda 架构


  这只是对 Lambda 架构的简要介绍，但你可以看到这种架构对于使用 NoSQL 数据库设计实时或近实时系统是多么有用。将 Hadoop 众所周知的好处（容错性、分布式计算、低成本、高性能、可扩展性）添加到该解决方案中，你就可以使用这种架构来设计一个高效、经济且高性能的实时系统。


  Lambda 架构具有以下目标：


  - 处理过程应保持（基础）数据不变，并构建一个访问层（针对用户查询进行优化），以便于从人为错误中轻松恢复。

  - 处理过程应异步执行，提前于（数据访问）时间，并以批处理模式进行。

  - 增量计算应减少到最低限度（或尽可能消除）。


  现在，让我们详细讨论 Lambda 架构的各个层次，以及如何使用它构建一个良好的实时系统。


  ### 定义和使用 Lambda 层次


  在上一节中，我讨论了 Lambda 架构的起源和理念。我还简要提到了 Lambda 的层次或组件及其用途。在本节中，我将详细讨论这些内容，并解释如何在实际场景中实现它们。


  这些层次是逻辑上的，或者说是在概念层面上的。在实现它们时，你需要使用的 NoSQL 数据库是物理存在的，并且在单独使用时有其自身的缺陷。了解它们的优势（和劣势）对于你的实现是有益的。例如，像
  `Cassandra` 这样的列式数据库可以提供高吞吐量，但其数据模型非常有限（与 RDBMS 相比）。因此，在将你的关系型模式适配到它时需要做一些工作。我将在[第
  8 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_8)中讨论这种转换，正如你所看到的，要成功转换，需要完成几个任务。


  另外需要注意的是，任何 NoSQL 数据库单独使用时，其关联的数据集具有可变性。然而，当这些 NoSQL 数据库作为 Lambda 架构的一部分使用时，整个解决方案很容易克服可变性问题，并且对人为错误具有容错性。让我们来看看这是如何实现的。我将从第一层——批处理层开始。


  ### 批处理层


  在处理海量数据集时，延迟是一个常见的问题。像 `MapReduce` 或 `YARN` 这样的分布式处理机制可能会尝试将其最小化，但考虑到这些海量数据集用于分析以及所涉及的复杂处理，总处理时间在大多数情况下是不可接受的。因此，要么需要将处理划分为更小的单元（这并不总是可能的），要么限制可能的用户查询范围。Lambda
  架构试图通过基于预期的查询对数据（称为*主数据*）进行预计算来改善这种情况。该技术涉及构建视图（并为其建立索引），这些视图可能支持大多数用户查询或对数据的读取访问。由于这些视图是从大型数据集计算得出的，因此构建需要时间，所以此操作是异步执行的，或者以*批处理模式*执行。这些预先计算的视图构成了
  Lambda 架构的*批处理层*或第一层。


  我将讨论如何使用主数据构建这些视图，但首先，我将讨论设计和创建主数据集（你需要用于批处理层的数据集）。


  #### 设计你的主数据


  考虑到所有可能的情况，你可能需要重新架构（或迁移）现有的基于 RDBMS 的应用程序到 NoSQL（如果需要近实时查询），或者你可能正在设计一个全新的基于 NoSQL
  的系统，并需要近实时查询。需要遵循的步骤是相似的，并且从[第 2 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_2)和[第
  3 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_3)中讨论的逻辑模型开始。




  '
- '# 为 NoSQL 构建逻辑数据模型或许看似奇怪


  为 NoSQL 实现构建逻辑数据模型或许看似奇怪，但如[第 3 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_3)所述，有几个令人信服的理由。主要原因之一是缺乏针对
  NoSQL 建模的建模工具和技术。另一个原因是，分析业务流程并建立数据（由该流程生成）捕获模型的过程几乎保持不变。发生变化的是模型的最终表示形式以及存储方式。Nathan
  Marz 提出了一种基于“事实”的模型来保存主数据集。


  #### 基于事实的模型


  首先，让我们将*数据*定义为无法从任何其他信息中推导出的信息。对于基于事实的模型，数据被解构为称为*事实*的基本单位。事实数据是*不可变*的，或者说不可更新。因此，对数据的任何更新都会导致添加新的数据行（或单位），并通过时间戳加以区分。这是为了确保信息（或传统意义上的历史记录）不会丢失。数据不可变性有两个重要优势：


  - **人为容错性**：对于可变数据模型，任何错误或不当的数据修改都可能永久覆盖正确数据且无法恢复。而对于不可变模型，不良数据可以直接删除，不会产生任何负面影响。

  - **简洁性**：可变数据模型需要对数据进行索引以便快速检索和更新。对于不可变数据模型，则不需要索引，因为只需将新数据附加到主数据集即可。这简化了主数据的存储。


  那么，“事实”是如何从数据中生成的？又是如何使其不可变的呢？让我通过一个例子来讨论这个概念。`DataScourerNinjas.com` 拥有一个非常有趣的商业模式。它获取并跟踪数千家公司的信息，并将其出售给开发软件的公司。这些信息对于软件制造商针对其开发的特定软件定位这些公司非常有用。


  图 9-1 展示了 `DataScourerNinjas` 收集的数据类型：


  | 客户 | 业务类别 | 业务详情 | 年收入 | 去年利润 | IT 软件或供应商 | 帮助台软件或供应商 |

  | --- | --- | --- | --- | --- | --- | --- |

  | 丰田汽车 | 汽车 | 轿车、SUV、小型货车 | 700 亿美元 | 30 亿美元 | ADP | Zendesk |

  | 埃森哲 | 咨询 | 管理与技术咨询 | 320 亿美元 | 30 亿美元 | 定制 | Salesforce |

  | 通用电气 | 能源 | 配电、电动机 | 1480 亿美元 | 150 亿美元 | ADP | SAP – CRM |


  ***图 9-1.** 潜在的企业软件销售目标（可变信息）*


  考虑这样一种情况：其中一个条目“去年利润”（针对所有公司）以及另一家公司的所有条目都检测到数据问题。数据不可靠，需要重新收集（部分或全部）。或者，考虑一种场景，需要记录某家公司过去六个月的值（因为那是它“符合条件”供
  `DataScourerNinjas` 跟踪信息的时间）。以下是这些情况下该数据存在的问题：


  - 无法得知数据是在不同时间分批收集的。

  - 无法得知过去的历史值是什么（因为部分数据被覆盖了）。


  这是一个可变模式的例子。当数据发生变化时，它会覆盖现有数据。此外，由于部分数据可能比其他数据更动态（更频繁地变化），理想情况下应该能够分别维护所有部分数据的历史记录。这在可变模式下是不可能的。那么，如何解决上述设计问题呢？


  Lambda 有一个可能的解决方案：基于事实的模式。如何将上述可变模式表示为不可变的基于事实的模式？请看图 9-2。




  '
