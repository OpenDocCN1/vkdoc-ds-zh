  ***图 10-1.** YARN 架构*


  请注意以下几点：


  - Hadoop 集群每个节点的总内存由属性 `yarn.nodemanager.resource.memory-mb` 决定。

  - `ResourceManager` 可以分配给 `ApplicationMaster` 容器的最大内存由属性 `yarn.scheduler.maximum-allocation-mb`
  决定。默认的最小分配为 1 GB，但可以使用属性 `yarn.scheduler.minimum-allocation-mb` 进行更改。

  - `ApplicationMaster` 只能以属性 `yarn.scheduler.minimum-allocation-mb` 值的增量向 `ResourceManager`
  请求资源，且不能超过属性 `yarn.scheduler.maximum-allocation-mb` 的值。

  - 对于 MapReduce（作为应用程序），`ApplicationMaster` 会将 `mapreduce.map.memory.mb` 和 `mapreduce.reduce.memory.mb`
  的值向上舍入为 `yarn.scheduler.minimum-allocation-mb` 值的倍数。


  因此，总结一下，以下是一些您可以调整的 YARN 属性：


  - `yarn.scheduler.minimum-allocation-mb`：YARN 允许运行作业的最小容器大小（默认为 1 GB）。

  - `yarn.scheduler.maximum-allocation-mb`：YARN 允许运行作业的最大容器大小（默认为 8192m）。

  - `yarn.nodemanager.resource.memory-mb`：工作节点上容器的总内存量。该值应为：（总内存）–（操作系统、Hadoop 守护进程和任何其他服务的内存分配）。

  - `yarn.nodemanager.vmem-pmem-ratio`：定义虚拟内存与可用物理内存的比率。默认值 2.1 表示虚拟内存将是物理内存大小的两倍。

  - `yarn.app.mapreduce.am.resource.mb`：分配给 `ApplicationMaster` 的内存。

  - `yarn.app.mapreduce.am.command-opts`：分配给 `ApplicationMaster` 的堆大小（默认为 1 GB）。

  - `yarn.nodemanager.resource.cpu-vcores`：节点管理器可以分配给容器的核心数。该值应为：（节点上的总核心数）–（分配给 Hadoop
  守护进程和任何其他守护进程的核心数）。


  至此，我关于 YARN 相关调优和重要参数的讨论就结束了。接下来，我将探讨如何优化与 NoSQL 解决方案一起使用的数据模型，以及如何为您环境选择合适的 NoSQL
  解决方案。


  ### 选择最佳文件格式


  理解您选择用于存储数据的文件格式会直接影响对该数据的查询性能，这一点非常重要。在选择合适的格式时，需要考虑许多参数。您计划执行的查询类型当然是最重要的。下一个是您需要的压缩量。并且您需要确保计划使用的
  NoSQL 解决方案支持该存储格式。幸运的是，大多数 NoSQL 解决方案都使得在不同格式之间转换数据变得容易。




  文件格式会影响查询性能，因为它决定了系统在响应特定查询时读取数据集的快慢。数据检索速度是查询性能的最大决定因素。目前，数据检索的主要（也是最耗时的）任务是将数据从磁盘移动到内存，反之亦然（除非你使用内存数据库）。例如，如果你的数据集为
  1TB，并且你使用接口为 SATA 6 GB/s 的 7200 RPM 硬盘，由于磁盘读取速率接近 160 MB/s，处理 1TB 数据大约需要两小时。对于更大的数据集，类似的性能将无法接受。


  如何提高读取性能？有三种方法。首先，你可以通过利用分布式存储和计算技术来并行化读写操作。这将帮助你分割数据并将其分布在多个节点上，同时查询也会相应分布。`HDFS`提供分布式存储（具备容错性），而像`MapReduce`、`YARN`（或`Spark`）这样的处理框架则帮助你实现“将处理移至数据”或在各个工作节点本地处理数据。这构成了在集群的所有节点上优化分布处理，从而以最佳性能完成任务（或作业）。


  其次，你可以通过将数据存储在高效使用压缩的文件格式中来减少查询引擎处理的数据总量。文件格式支持不同的压缩算法，并以多种方式将这些算法应用于数据。请注意，压缩算法之间的权衡在于速度与压缩比。更高的压缩比会花费更多时间（同时消耗更多
  CPU 资源）来进行压缩或解压缩。当然，你的文件会更小，从而节省磁盘空间。


  使用各种文件格式的压缩方案能实现多大的压缩比？这取决于文件格式与压缩方案的组合。例如，对于大约 1GB 的文本（`CSV`）文件，`Snappy`或`GZIP`可以将其压缩至约
  500MB（如果存储为`SequenceFile`）或约 300MB（如果使用`ORCFile`或`Parquet`格式）。表 10-1 列出了适用于各种行导向和列导向文件格式的压缩方案。


  ***表 10-1.** 文件格式及其支持的压缩方案*


  | **压缩方案** | **文件格式** | **Snappy** | **GZIP** | **ZLIB** | **BZIP2** | **None**
  |

  |--------------|--------------|------------|----------|----------|-----------|----------|

  |              | `TextFile`   |            |          |          |           | X        |

  |              | `SequenceFile`| X          | X        | X        |           |          |

  |              | `ORCFile`    | X          | X        |          |           |          |

  |              | `RCFile`     |            | X        | X        | X         |          |

  |              | `Parquet`    | X          | X        |          |           |          |


  提高读取性能的第三种方法是使用预存储的聚合统计信息。这仅受`Parquet`和`ORC`等格式支持，它们可以获取基于最小值/最大值和空值计数的聚合统计信息作为预计算数据。此外，`Parquet`和`ORCFile`格式以牺牲写入性能为代价来优化读取性能（这遵循了
  Hadoop“一次写入，多次读取”的理念）。


  最后，数据的组织方式会影响各种类型查询的性能。


  例如，当数据以行导向格式存储时，返回大量列（针对行子集）的查询速度更快。根据经验，返回超过 60%列的查询受益于行导向格式。或者，如果数据以列导向格式存储，则那些跨表（或其子集）的所有行对少数列进行汇总或聚合的查询性能更佳。因此，如果你期望大多数查询的形式为`select
  * from MyTable;`，则应使用行导向格式。


  但如果你的查询形式为`select sum(MyColumn) from MyTable`（即，你只对数据集中的少数列执行聚合或生成汇总统计），那么你应该使用列导向格式。接下来，我将讨论一些行格式和列格式及其属性。


  ## 基于行的格式




  '
- '# Hadoop 中的行式存储格式


  Hadoop 生态系统中最流行的行式存储格式是文本文件、序列文件和 Avro。相信您之前一定使用过文本文件。CSV 文件易于使用，并且受到 Hadoop 生态系统中（以及外部）几乎所有工具的支持。序列文件在
  Hadoop 生态系统内部也得到了广泛应用。


  `Avro`文件占用空间非常小，因此（与序列文件和文本文件相比）能提供更好的性能。但与另外两种行式文件格式相比，支持`Avro`的应用程序并不多。


  ## 文本文件


  最简单、最常用的文件格式是文本文件。大多数数据库系统或应用程序都支持将数据导出为 CSV 或制表符分隔文件等文本格式。通常，这些文本文件包含 ASCII 或 UTF
  字符，各个*字段*（或列值）由称为*分隔符*的特殊字符（如逗号、分号、与号或制表符）分隔，记录之间用换行符分隔。


  使用文本文件的优点如下：

  -   ​它们可读性强且非常易于使用。

  -   ​有大量可用于处理它们的工具。

  -   ​大多数应用程序和数据库系统都可以接收（以及输出）文本文件。


  尽管文本文件易于使用，但它们无法提供最佳性能。文本文件将所有字段值（包括数字或布尔值）存储为字符串。因此，如果您需要存储一个`500`的整数值，文本文件会将该值转换为等价的字符串（三个字符`"500"`），然后再写入文件。


  将所有数据存储为字符串存在几个问题：

  -   ​数字和布尔值如果存储为字符串会占用更多空间（例如，`50,000,000`作为字符串需要`8`个字节，但作为整数只需`4`个字节；布尔值`"False"`存储为字符串需要`5`个字节，但作为布尔值仅需`1`个字节）。这种空间占用增加会累积起来，导致文件体积庞大，需要更长时间才能加载（到内存），并对查询性能产生不利影响。

  -   ​将字符串转换为适当的数据类型会为查询增加额外的工作。这对于 Hadoop 尤其重要，因为 Hadoop 生态系统中的大多数工具都遵循*读时模式*或读取时解析数据类型的理念。因此，每次执行查询时，都必须执行这种数据类型转换（除非您的所有数据真的是字符串或文本），这会减慢查询速度，并消耗额外的系统资源。


  ## 序列文件


  序列文件是在 Hadoop 生态系统中广泛使用的文件格式（仅次于文本文件）。序列文件使用二进制格式，将数据存储为由键值对组成的记录。下面是序列文件的结构：


  ```

  <文件头><键 1,(Doe,John,387-45-9876,1990-02-14,Chicago,IL)><同步标记>

  ```


  因此，序列文件由一个文件头后跟记录（表示为键值对）组成。文件头包含关于文件和数据的元数据。同步标记用作记录终止符。Hive（以及 Impala）使用序列文件的简化版本，该版本忽略记录的键部分，并将每一行编码为字符串，使用特殊字符`''\01''`作为行分隔符。


  例如，如果要对使用 Snappy 压缩方案的序列文件的 Hive 表数据进行压缩，请在 Hive 命令提示符下进行如下设置：

  ```

  > set hive.exec.compress.output=true;

  > set mapred.output.compression.type=BLOCK;

  > set mapred.output.compress.codec=org.apache.hadoop.io.compress.SnappyCodec;

  ```


  使用序列文件的主要优点是 Hadoop 生态系统中的所有组件都支持读写序列文件。不幸的是，Hive 和 Impala 使用序列文件的方式削弱了这种格式的许多优势，导致文件大小与文本文件相似（并因此带有与文本文件相同的问题）。


  Hive 和 Impala（默认情况下）将数据以字符串形式存储在序列文件中。这意味着它们占用的空间与文本文件一样多，数字、布尔值和其他数据类型占用的空间超出了它们实际所需。此外，文件中的同步标记也会增加文件大小。


  ## Avro


  `Avro`是目前可用的最先进的行式格式，与文本或序列文件格式的区别如下：

  -   ​`Avro`在文件中包含或嵌入了数据（对应于表）的模式。这消除了每次在应用程序之间共享`Avro`文件时重新定义模式的需要。

  -   ​`Avro`根据字段的数据类型对字段进行编码（而不是将所有字段存储为文本）。这减少了（未压缩的）文件大小，并使得能够更有效地压缩文件。因此，网络传输时间和文件处理时间（用于数据类型转换）大大减少，为您的查询提供了更好的性能。

  -   ​`Avro`简化了模式变更（从而实现模式演化）。使用`Avro`，可以更轻松地添加列，而无需重写底层数据以匹配新模式。如果您需要向数据中添加新列，可以通过在末尾包含附加字段并为旧记录提供默认值来实现。对于缺少此值的旧记录，Hive
  将简单地使用默认值替换缺失值。


  下面是`Avro`文件的结构：

  ```

  <文件元数据><同步标记><数据块（对象计数，对象大小，数据）><同步标记>

  ```


  该文件由一个文件头（包含序列化为 JSON 字符串的文件模式信息和压缩编解码器信息）后跟一个或多个数据块组成。每个数据块包含若干条记录和元数据（如记录数、记录大小等）以及实际数据，这些数据可以使用任何支持的编解码器进行压缩。以下代码使用`Avro`文件格式创建了一个
  Hive 表（`Employee_avro`）：

  ```

  > CREATE TABLE Employee_avro

  (lastname STRING COMMENT ''员工姓氏'',

  firstname STRING COMMENT ''员工名字'',

  dept_code SMALLINT COMMENT ''部门代码'',

  dob TIMESTAMP COMMENT ''出生日期'',

  zip STRING COMMENT ''邮政编码'',

  employee_since TIMESTAMP COMMENT ''首次入职日期'')

  ROW FORMAT SERDE ''org.apache.hadoop.hive.serde2.avro.AvroSerDe''

  STORED AS INPUTFORMAT ''org.apache.hadoop.hive.ql.io.avro.AvroContainerInputFormat''

  OUTPUTFORMAT

  ''org.apache.hadoop.hive.ql.io.avro.AvroContainerOutputFormat''

  TBLPROPERTIES (''avro.schema.literal''=''{

  "name": "employee_summary",

  "type": "record",

  "fields": [

  {"name":"lastname", "type":"string"},

  {"name":"firstname", "type":"string"},

  {"name":"dept_code", "type":"int"},

  {"name":"dob", "type":"string"},

  {"name": "zip", "type": "string"},

  {"name": "employee_since", "type": "string"}

  ]}'');

  ```


  从`"name": "employee_summary"`开始的部分是 JSON 模式定义，被包含在文件头中（作为文件元数据的一部分）。压缩编解码器的指定方式与为序列文件指定的方式完全相同。


  `Avro`也有一些缺点：

  -   ​使用`Avro`格式可能比使用任何文本格式更复杂，并可能导致更长的开发时间。

  -   ​（Hadoop 生态系统外部的）很少有应用程序支持或能读取这种格式。

  -   ​对于`Avro`，您需要在实际写入文件之前预先定义好模式，这在某些情况下是不可能的。


  总而言之，`Avro`对于使用全部或大部分列的查询来说是一个绝佳选择，因此对于数据仓库非常有用；尤其是那些包含数百列宽事实表的数据仓库。


  ## 列式格式




  '
- '# 列式存储格式


  列式存储格式更适合（且经过优化）用于分析场景，因为你需要聚合或汇总少量列。考虑上一节中的`Employee`表，假设有一个名为`Salary`的额外列用于存储员工薪资。使用列式文件格式时，检索薪资超过平均薪资两倍的员工列表会快得多，因为列式格式按列存储数据，这使得聚合操作变得简单（且快速）。


  Hadoop 生态中最流行的列式（或基于列）格式是`RCFile`、`Parquet`和`ORCFile`。每种格式各有优劣，我将在本节中讨论。需要注意的是，列式存储格式不仅用于
  Hadoop 生态，也被`Greenplum`或`Vertica`等高性能分析数据库所采用。


  总结而言，在以下情况下应使用列式格式：


  -   你经常需要在查询中执行聚合操作（例如`count`、`avg`、`min`、`max`）。

  -   大多数查询只选择少量列，并使用少量列作为过滤条件（在`where`子句中）。


  最后，请确保你的环境满足上述条件（再选择列式格式），因为如果不满足，存储在列式格式中的数据在需要检索整条记录时，将不得不执行*行重建*（即收集属于同一行的所有列并将其重新组合的过程）。这对系统来说涉及大量工作（非连续数据读取），因为每一行并非连续存储，这将对性能产生严重影响。


  ## RCFile


  行列式（`RCFile`）文件格式（于 2011 年引入）是 Hadoop 生态中使用最广泛的列式格式之一。它节省了空间，从而加快了查询速度，因为需要检索的数据量更少。`RCFile`中的数据按如下结构组织：


  ```

  <行组 1(<元数据头><列 1(值)><列 2(值)><列 3(值)><同步标记>)>,<行组 2(...)>,<行组 3(...)>

  ```


  因此，`RCFile`同时将数据进行水平和垂直分区。首先，数据被划分为多个行组，然后在每个行组内，数据按列组织。此外，`RCFile`格式确保某行的所有列都位于同一节点上（它们适合单个
  HDFS 块），以降低行重建的成本（如果需要）。最后，每个行组中的数据按列压缩（压缩编解码器的指定方式与 Sequence 或 Avro 文件完全相同）。


  作为一个主要优势（因为`RCFile`是第一个列式格式），Hadoop 生态中的几乎所有工具都支持`RCFile`。此外，许多 Hadoop 生态之外的工具也支持它，因此如果你计划使用除`Hive`或`Impala`之外的工具对数据运行分析查询，则需要考虑此格式。


  然而，与`Parquet`和`ORCFiles`相比，`RCFile`缺乏许多高级特性。例如，`ORCFiles`和`Parquet`允许存储更复杂的数据类型，提供让`Hive`限制加载到内存中数据量的方法，并且可以将数据加密成更小的文件。


  ## ORCFile


  `ORCFile`格式作为`RCFile`格式的继承者被引入，并为其增加了许多特性。例如，它使用复杂的数据编码方案来进一步减小数据大小。它还存储元数据，以便更容易跳过不符合常见查询标准的行，并存储列的基本统计信息。这带来了显著更快的查询速度和高度压缩的数据。`ORCFiles`中的数据按如下结构组织：


  ```

  <索引数据><行组 1(...)><条带页脚>,<索引数据><行组 2(...)><条带页脚>………<文件页脚><后记>

  ```


  数据行组的结构与`RCFile`相同，但每个行组之前有一个索引数据块，之后跟着一个条带页脚。在数据文件末尾，有一个文件页脚和一个后记标记。这些额外的块为`ORCFile`提供了高级功能。压缩编解码器作为表属性指定。


  `ORCFile`是最先进的列式文件格式之一。它使用复杂功能来减少文件空间，使查询更容易识别文件的关键部分并避免文件扫描。一个主要问题是缺乏对该格式的支持。例如，`Impala`目前不支持`ORCFiles`。因此，使用`ORCFile`格式可能会限制你可以用来处理数据的工具集。


  ## Parquet


  `Parquet`格式由 Cloudera 和 Twitter 的工程师设计。它基于 Dremel 论文中描述的*记录拆分与组装算法*（Dremel 是 Google
  设计的一种用于分析只读嵌套数据的可扩展、交互式临时查询系统）。


  `Parquet`提供了非常高效的压缩和编码方案，并使用三种类型的元数据：文件元数据、列（块）元数据和页面头部元数据。


  在最顶层，文件元数据包含关于模式、行数、行组列表和键/值列表的信息。在下一层，行组元数据包含行组的列块列表、总字节大小和行数。列块元数据包含文件路径（对于该块）、文件偏移量和列元数据（对于该块中的列）。列块可能包含多个页面，页面头部元数据包含详细信息（例如（未）压缩页面大小、数据页面头部、索引页面头部等）。数据和索引页面头部包含值和编码的详细信息。一个包含`M`个行组和`N`个列的`Parquet`结构化文件结构如下所示：


  ```

  <文件元数据><行组 1 元数据(<列 1 元数据(页面元数据)>………<列 N 元数据(页面元数据)>)………<行组 2 元数据(...)>……<行组 M 元数据(...)><文件页脚>

  ```


  总结来说，`Parquet`实现了一个复杂的数据物化引擎，结合了先进的编码技术，在压缩和速度之间取得了平衡。同时，`Parquet`会为你的每个数据列决定正确的编码格式。你可以按如下方式为`Parquet`文件选择压缩方案（以`Hive`为例）：


  ```

  > set parquet.compress=SNAPPY

  ```


  幸运的是，`Parquet`（与`ORCFile`相比）得到了更广泛的支持，因此它无疑是一种值得推荐的列式格式。


  ### 索引性能考量


  索引是查询性能的一个非常重要的考量因素，尽管 Hadoop（与 RDBMS 相比）没有提供高级索引级别，但有一些通用指南可以遵循。首先，索引指南例如索引的最佳使用（索引过多会影响插入性能，或者索引应与常见查询模式匹配等）是有效的。此外，对于`Hive`，索引分区应与表分区匹配（在使用的分区列方面）。你可以参考
  Hive 索引文档 [`cwiki.apache.org/confluence/display/Hive/IndexDev`](https://cwiki.apache.org/confluence/display/Hive/IndexDev)
  获取关于 Hive 索引的全面解释。


  在本节中，我将重点介绍 Hadoop 中常用的两种主要索引类型及其最佳用法：紧凑索引和位图索引。


  ### 紧凑索引




  '
- '# 紧凑索引


  通常，对于包含大量不同或唯一值（例如员工 ID）的列，可以使用*紧凑索引*。对于包含数值类型的列，应当使用紧凑索引。在内部，紧凑索引以排序表的形式存储（例如在
  Hive 中），其中包含所有待索引列的值以及这些值所在的存储块。由于索引本身也是一张表，你需要使用与表格式相匹配的最佳格式（`ORC`、`Parquet`、`Avro`）来存储它，并在必要时进行压缩。如果你的表进行了分区，那么索引也会被分区，不过你可以根据需要更改索引的分区结构。通过设置属性
  `IDXPROPERTIES ''hive.index.compact.binary.search''=''true''`，确保该索引可用于紧凑二分查找。


  创建索引后，如果源表中的数据发生变化，你需要按如下方式刷新或更新索引：


  ```

  ALTER INDEX <索引名> ON <表名> REBUILD;

  ```


  你可以让索引自动更新，但考虑到 Hadoop 处理的数据量巨大，更好的做法是手动计划索引更新，安排在系统空闲时进行。


  '
- '# 位图索引


  *位图索引*适用于仅有少量不同值的列（例如性别、逻辑值（是/否）、类别或类型）。对于这些列，不同值的数量与表中行数的比值很小。这个比值被称为*基数*。


  使用传统索引对一个大表进行完全索引会占用大量磁盘空间，而位图索引仅使用索引数据大小的一小部分。原因是，传统索引为包含给定键值的行提供了一个指针（指向表中的数据行），因此针对每个键值都包含一个行
  ID 列表（对应于具有该值的行）。


  然而，对于位图索引，每个键值使用一个位图来代替行 ID 列表。位图中的每一位对应一个行 ID。如果该位被置位，则表示对应的数据行包含该键值。通过一个映射函数将位的位置转换为实际的行
  ID。此外，位图索引会对位图本身进行压缩。因此，对于少量不同的键值，位图索引能提供更好的压缩比。由于多个位图索引的位图可以轻松组合，你应该使用单列位图索引。与紧凑索引类似，为了使位图索引有效，你需要对要建立索引的列的数据进行排序——否则，将会读取位图索引中包含值的所有块。因此，你应该将属性
  `hive.enforce.sorting` 设置为 `true`，并在 `CREATE TABLE` 语句中指明哪些列应当被排序。


  由于（Hive 中的）位图索引本质上也是另一张表，你需要指定有效的存储格式和压缩方式（如果索引很大）。


  其他索引类型用于 `ORCFile` 和 `Parquet` 格式，例如*存储索引*（一种最小值/最大值索引，如果某个值不包含在数据块中则可以跳过该块，适用于数值类型以及使用
  `<`、`>`、`=` 运算符的查询），以及*聚合索引*（类似于一个预定义了聚合操作的表，例如针对特定列的 `count`、`sum`、`average`，并按该列进行分组）。


  总而言之，你需要了解并评估你的数据以实现有效索引，同时还需要制定根据数据（源表）变化定期更新索引的机制。


  ### 选择 NoSQL 解决方案并优化数据模型


  为你的环境（和数据）选择正确的 NoSQL 解决方案的重要性常常被忽视。例如，如果你的数据主要是非结构化的，并且数据量较小（大约 2-5 TB），那么列式数据库就不是一个合适的解决方案。


  首先，你需要了解 NoSQL 数据库的主要类型、它们的特性、优缺点，以及它们在你需要的处理类型（基于你的业务需求）下的表现。你的选择将对环境的性能和所支持的功能产生巨大影响。


  关于 NoSQL 数据库的类型、特性以及为你的环境（基于你的数据）选择合适 NoSQL 数据库的标准，请参见[第 6 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_6)的“选择合适的
  NoSQL 数据库”部分。


  关于 NoSQL 需要强调的一点是：它确实已经（并将进一步）转变为 LimitedSQL，因为最初的 NoSQL 键值对、基于 MapReduce 的数据库正被下一代数据库所取代，这些数据库提供了（更简单的）基于
  SQL 的接口，对分析很有用。此外，这些具备 LimitedSQL 能力的数据库在性能和功能方面也在不断改进。


  回到 NoSQL，在选择了合适的 NoSQL 解决方案之后，下一步就是准备你的数据以迁移到 NoSQL。大多数情况下，`OLTP` 或 `OLAP` 系统会迁移到
  NoSQL。随后，你需要转换你的数据，使其能在 NoSQL 数据库中优化运行。例如，存储在关系型 `OLTP` 环境中的数据定义了参照完整性，因此你需要执行连接操作来检索所需数据。关系型数据库通常在连接操作上表现良好，并拥有提升性能的特性，如索引、统计信息定义、数据和查询计划缓存等。如果你将关系型数据迁移到
  NoSQL 环境，大部分 `RDBMS` 的特性就不复存在了。而且，NoSQL 数据库在连接操作上表现不佳。


  因此，你需要重新设计数据模型并消除连接。你可能需要为此目的对数据进行反规范化，并且可能需要合并某些数据表以形成更大的表。需要采用不同的技术来将你的关系型（`OLTP`）或星型模式（`OLAP`）设计转换为适用于
  NoSQL 的形式。更多信息请参见[第 6 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_6)。


  ### 总结


  性能调优本身就是一个庞大的主题，考虑到其涉及的各种子主题，其专业程度足以自成书。本章并非旨在涵盖所有方面。其目的在于吸引你关注可以调优 NoSQL 环境的不同方法。例如，MapReduce
  或 HDFS 参数列表并非详尽无遗。请参阅 Apache 文档以获取完整的参数列表，并调优其他与环境更相关的参数。


  或者，如果你考虑索引，请仔细审查你的查询需求，并添加你可能未涉及到的适当类型的索引。


  同时，也要考虑硬件方面。像 Teradata 这样的大型公司主要专注于设计用于管理 PB 级数据的硬件。几年前，英特尔推出了其基于硬件的解决方案，以在不牺牲性能的情况下促进加密和解密。你可能不想（或没有资源）走得那么远。关于硬件优化的部分旨在提供通用指南，并帮助你优化计划用于实现方案的硬件。


  你的环境会有特定的需求，但至少你有了一个良好的起点。当然，不可能考虑到所有类型的优化场景。


  不同的组织在性能调优方面采用不同的方法。




  '
- "# 文档排版\n\n## 性能优化与规划\n\n一些组织从通用指南开始，只有在遇到具体问题时才考虑性能调优。这样，他们可以专注于问题领域并节省宝贵资源（时间和金钱）。这种方法的问题在于，当前问题虽然能快速解决，但能保证该领域或其他领域不会出现额外问题吗？当然不能。这就是为什么需要从良好的规划开始。执行压力测试，考虑数据增长（以及随之而来的使用量增加），同时还要考虑*边界条件*（最小值和最大值）。边界条件可能适用于你的硬件资源、NoSQL\
  \ 解决方案、网络容量，甚至技术支持资源。\n\n充分理解增长以及边界条件，将有助于你有效规划近期可能出现的任何性能问题。如你所知，随着技术的动态变化（尤其是在\
  \ NoSQL 领域），没有哪个系统能保证长久存在，但如果你主动出击并预测问题，而不是等问题出现才应对，至少可以避免近期内的问题。\n\n---\n\n## 第五部分\
  \  \n## 基于 Hadoop 解决方案的设计与实现案例研究\n\n## 第十一章  \n## 案例研究：实现 Lambda 架构\n\nLambda 架构是大数据架构中最早出现的明确理念之一，像任何新架构一样，它既有追随者也有批评者。如何决定站在哪一边？我的答案很简单：这取决于该架构对你环境的适用性。Lambda\
  \ 绝对不适合所有大数据用例。也许像 Kappa 或 Fast Data 这样的更新架构更适合你的环境。也许你甚至不需要基于架构的方法，可以直接从数据湖开始，按需设计分析。每个环境在某些方面都是独特的，需要特殊的设计考量，但诀窍是从通用方法开始，并且选择最合适的那一个。\n\
  \n为什么需要寻找新的数据架构方法？嗯，当前的基于 RDBMS 或 NoSQL 的系统并不具有韧性。由于大多数数据系统支持创建、读取、更新和删除（CRUD）操作，更新和删除操作可能导致数据损坏。例如，当你只想删除一行时，可能会删除大量行。软件错误或硬件故障也可能损坏数据。Lambda\
  \ 架构中主数据的不可变性为此问题提供了有效的解决方案。\n\n此外，对于当前的数据库系统，你总是在设计中需要做出权衡，因为要么优化数据存储（第三范式的规范化设计），要么优化查询处理（反规范化设计——通常是第一或第二范式）。Lambda\
  \ 通过将主数据（使用第三范式存储）与查询层（存储为反规范化视图）分离，解决了这一难题。\n\n那么，不可变数据存储如何捕获数据的变化？通过将数据划分为多个“事实”，并在时间维度上捕获这些事实的变化。因此，对事实的任何更改都会作为新的事实记录存储，并带有时间戳（指示更改发生的时间）。考虑一个员工记录。员工的地址是一个事实。每次员工搬家时，都可以添加一条新的事实记录，并附带一个时间戳，指示搬家时间。这保留了员工的居住历史（类似于数据仓库中的类型\
  \ 2 维度）——但更重要的是，它保留了与员工相关的所有事实（就其地址而言）。当然，你可以根据需要以任何方式使用这些事实。\n\n最后，Lambda 层如何促进近实时数据交付？我将通过一个真实案例研究进行讨论。我将简要讨论针对同一用例的\
  \ Kappa 和 Fast Data 设计变更。我将从描述业务问题开始。\n\n---\n\n© Bhushan Lakhe 2016  \nB. Lakhe,\
  \ *Practical Hadoop Migration*, DOI 10.1007/978-1-4842-1287-5_11\n\n## 第十一章 ■ 案例研究：实现\
  \ Lambda 架构\n\n### 业务问题与解决方案\n\nYourtown Insurance 是一家汽车保险公司，最近不得不处理大量欺诈性索赔。随后，该公司增加了严格的指导方针和大量额外的索赔处理流程。这导致处理时间增加了两倍，拥有真实索赔的客户感到不满，并将业务转移到了其他保险公司。\n\
  \nYourtown Insurance 聘请了业务流程（以及软件性能）专家，他们分析了过去的索赔（使用统计模型），并创建了一个预测模型来判断索赔是否可能具有欺诈性。如果确定索赔可能存在欺诈性，则将其定向到特殊队列，该队列执行额外处理，并在必要时启动调查。其余的索赔（被判定为非欺诈性的）则快速处理，就像在添加额外处理之前一样。\n\
  \n这一策略缩短了（真实）索赔的处理时间，同时仍然能够以约 80% 的准确率识别欺诈性索赔。顾问向 IT 部门保证，随着时间的推移，他们构建的预测模型将变得更加准确并提供更高的准确率。该模型基于许多因素构建，用于判断欺诈性索赔，例如：客户在去年提交的索赔数量、索赔提交时间、索赔提交时的天气状况、客户年龄、客户驾驶记录等。模型评估的结果确定，上述因素的某些值表明存在欺诈（或不存在欺诈）。\n\
  \n因此，需要针对汇总（或计算出的）客户数据实时检查索赔参数。由于索赔数据量非常大（30 TB，每月增长 1%），因此决定使用 Hadoop 进行数据处理，并且由于需要实时处理，因此选择了\
  \ Lambda 架构。根据数据量，同意批处理层应每周末重建一次，速度层应保存过去六天的数据。欺诈判断将基于历史数据（通过批处理层获得）和最新数据（通过速度层获得）进行。\n\
