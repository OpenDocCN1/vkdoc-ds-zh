  **第五章**


  **Hadoop 生态系统**


  几年前的一个晚上，我乘坐火车回家，正在浏览新出的 Hadoop 工具。旁边的一位乘客偷偷瞄着我的笔记本电脑，不一会儿，他的好奇心被彻底勾了起来。“你是做什么工作的？”他问道。我说我是一名架构师，专注于大数据和仓库领域。“大数据！”他惊呼道。“对我来说听起来像黑魔法。”这是几年前常见的看法，并且自那以后也没有太大改变。


  当你开始使用 Hadoop 生态系统时，常常会感到困惑和不知所措，需要花时间了解和认识每一个重要（且流行）的组件。本章旨在通过提供关于重要组件和可供部署选择的供应商应用程序的简洁信息，来加速这一过程。


  Hadoop 生态系统是数据处理技术这一新兴领域的最新成员，并将持续存在。就像 80 年代和 90 年代的 UNIX 一样，它正处于变革之中，新产品几乎每天都在涌现。要跟上新产品的步伐极其困难，但花点时间简要了解一下与
  Hadoop 和 NoSQL 相关的各类新产品可能是值得的。这些产品在不久的将来可能会发生变化，但本章旨在让您对领先者及其提供的特性有良好的理解。


  我所考虑的（Hadoop 产品的）类别是通用的，例如查询工具、分析工具、搜索工具、消息系统、数据库等。然而，所包含的工具则提供特定的功能。我也尽量专注于开源产品（少数有价格的商业产品例外），因为它们易于访问，便于进行实验和创新。如您所知，大数据完全是关于创新的。我还收录了一些处于孵化阶段（在
  Apache）的产品，以及一些不太为人所知但很有用的产品。


  我讨论了查询工具`Shark`（现在是`Spark SQL`）。您可以把`Shark`看作是使用 Spark 引擎（代替 MapReduce）的 Hive。`Kylin`由
  eBay 贡献，是一个出色的分析工具。它可以帮助您为存储在 HDFS 内的数据构建多维数据集。由于没有新的消息工具，我将简要讨论`Kafka`，并出于同样的原因讨论`Solr`/`Elastic`搜索（作为搜索工具）。内存处理仍然主要由
  Spark 主导，但`Apache Flink`是该领域的新玩家。`Flink`是一个大规模数据处理引擎，提供内存数据流，因此对于数据密集型以及迭代型作业，处理速度极快。


