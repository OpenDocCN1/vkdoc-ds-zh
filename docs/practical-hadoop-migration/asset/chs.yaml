  \ I/O 和网络流量，从而提升性能。\n\n- **数据压缩**：你可以使用合适的编解码器来压缩数据，以减少 I/O 和网络流量，从而提升性能。根据数据的格式（本章后续会讨论），你可以使用`LZO`、`Snappy`等多种编解码器进行压缩。\n\
  \n- **分布式缓存**：允许你缓存应用程序频繁使用的文件。一旦你为作业缓存了一个文件，Hadoop 就会将其提供给所有执行`Map`/`Reduce`任务的`DataNode`（位于\
