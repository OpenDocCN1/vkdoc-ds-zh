- '# 优化 YARN 执行


  YARN（另一种资源协调器）是 Apache Hadoop 最新的资源管理框架。这本质上是 MapReduce 版本 2，具有许多新功能，例如（为 Mapper
  和 Reducer）动态内存分配。YARN 的主要组件如下：


  - `ResourceManager`：主守护进程，与客户端（请求方）通信，跟踪集群上的资源可用性，并通过向 NodeManager 分配任务来协调工作。

  - `NodeManager`：这是一个工作守护进程，负责启动和管理在工作节点上执行的进程。

  - `ApplicationMaster`：管理由 `NodeManager` 在 `Container` 内生成的、由 `ResourceManager` 请求的任务（或进程）。

  - `Container`：表示在工作节点上预留资源（CPU/RAM）的请求。例如，MapReduce 是在 YARN 内运行的应用程序，`ApplicationMaster`
  会生成 Mapper 和 Reducer 在 `Container` 内运行（并根据需要向 `ResourceManager` 请求额外的容器）。


  如图 10-1 所示，当客户端进程向 `ResourceManager` 请求资源时，它会定位一个具有可用资源的节点，并向（该节点上的）`NodeManager`
  请求这些资源。`NodeManager` 随后会生成一个 `Container`，并随之调用 `ApplicationMaster`。`ApplicationMaster`
  管理应用程序（客户端进程）的资源，并（如果需要）向 `ResourceManager` 请求额外的资源。


  图 10-1 展示了 YARN 架构的详细信息。


  **工作节点**


