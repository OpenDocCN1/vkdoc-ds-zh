  ;\n\nFROM ClaimsMaster_stg INSERT OVERWRITE TABLE ClaimsMaster PARTITION\n(LastModified)\
  \ SELECT ClaimId, ClaimSeqId, PolicyId,\n```\n\n\n\n`ClaimSubmissionDate`, `ClaimType`,\
