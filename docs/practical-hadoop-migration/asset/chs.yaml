  \ 基于事实的不可变模式*\n\n这个想法其实非常简单。首先，将可以（彼此）独立变化的“事实”分离开来，然后（分别）对其进行追踪。考虑一下刚刚给出的例子。对于一家企业来说，如果出现某个引发大量客户反应的问题，客服支持的力度可能会暂时增强。但这可能并不会影响他们使用的薪资软件或\
  \ IT 人员规模。因此，将这些事实分离并分别维护独立的历史记录非常重要。那么，如何实现不可变性呢？每当数值发生变化时，就会添加一行新记录，同时附上时间戳（对应于数值变化发生时的日期/时间）。这些数值可能在不同时间点发生变化，但总有办法可以知道每次变化的发生时间。\n\
  \n你可能会注意到，`Corporation`（企业）这一列出现在了所有数据集中。原因在于它被用作一个标识符，用以（跨不同事实）唯一地标识数据。在这个案例中，它标识了数据所代表的企业。然而，它并非唯一的标识符，因为新添加的记录只有时间戳不同。因此，唯一的标识符将是`Corporation`（企业）*与*`Timestamp`（时间戳）的组合。让我们看看如何利用这个模型来支持我作为示例的信息追踪系统中的事实，图\
  \ 9-3。\n\n## 第 9 章 - 面向实时 Hadoop 应用的 Lambda 架构\n\n- **埃森哲**使用 **Salesforce** 作为服务台软件\n\
  - **通用电气**拥有 **IT 人员规模** 为 10,000\n  *(截至 2015 年 9 月 2 日 10:00:23)*\n  *(截至 2015\
