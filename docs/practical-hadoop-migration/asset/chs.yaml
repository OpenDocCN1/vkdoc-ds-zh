- '# Hadoop 不适用于低数据量


  `Hadoop` 不适用于低数据量，因为它在读取或写入文件时会带来开销（这些任务会转化为 `MapReduce` 作业，并在执行作业提交或调度时产生大量开销）。关于使用
  `Hadoop` 的“神奇数字”临界数据量存在许多争论，但这个数字因数据类型以及业务需求而异。根据个人经验，仅当数据量超过 5 TB（且增长率较高）时，才应考虑使用
  `Hadoop`。


  #### 业务需求


  如果你迁移到 `Hadoop` 的业务需求与现有数据不匹配，那么就需要进行额外工作——尤其是当数据类型是 `Hadoop`/`NoSQL` 不擅于处理的那种。例如，如果你的业务需求是对频繁更新的规范化关系数据子集进行复杂分析，那么你需要对数据进行反规范化，并建立策略和时间表来应用更新（每天一次、每天两次等）。此外，根据需求，可能还需要额外工作来将事实数据与维度数据分离。然而，如果你想使用
  `Hadoop` 分析数千名潜在客户的浏览习惯，并确定其中转化为实际销售的比例，那么所需的工作可能很少——因为你可能已经在单独的 `NoSQL` 表中获得了所有必要数据——尽管这些数据可能是非结构化或半结构化格式（`NoSQL`
  处理这些格式没有问题）。


  当然，你的环境可能面临更具体的挑战，这里仅讨论了数据迁移中的挑战。修改前端用户界面（以适配 `Hadoop`/`NoSQL`）也可能会带来额外挑战！


  ## 决定集成、重构或过渡


  一旦你决定在环境中引入 `Hadoop`/`NoSQL`，接下来的一些问题就是：如何让 `Hadoop` 与现有应用程序/数据最佳配合？是将部分应用程序过渡到
  `Hadoop`，还是简单地将现有应用程序与 `Hadoop` 集成？更激进的方案是，为 `Hadoop`/`NoSQL` 使用场景完全重新构建应用程序架构。


  不幸的是，这些问题没有简短答案，只有仔细考量一系列相关因素后才能做出决策。下一节将讨论这些因素。


  ##### 数据类型


  你当前（在应用程序中）拥有的数据类型可能以多种方式产生影响：


  - **结构化/非结构化数据**：如果你的大部分应用程序数据是结构化的，并且没有添加任何半结构化或非结构化数据源的可能性，那么最佳方法是集成。最好将现有应用程序与
  `Hadoop`/`NoSQL` 集成。你可以考虑设计并实现一个数据湖，或者如果只需分析一小部分数据，则只需建立一个数据摄取过程，将数据复制到 `HDFS`，并使用
  `Hive` 或 `HBase` 进行处理以进行分析和查询。或者，如果你有半结构化或非结构化数据源，则根据它们（相对于结构化数据）的比例，你可以完全将应用程序过渡到
  `NoSQL`，或者如果你当前（或预期在不久的将来）拥有大量半结构化/非结构化数据，则可以部分（或完全）重新构建应用程序架构以适应 `NoSQL`。


  - **规范化的关系数据**：如果你的大部分数据是高度规范化的关系数据，那么你的应用程序可能很复杂，且涉及高度的数据依赖性。由于 `NoSQL` 数据库无法支持数据依赖性和关系，你实际上无法考虑将应用程序重新构建或过渡到
  `NoSQL`。最佳选择是集成，并且这还需要额外的努力。




  你可以将数据湖视为需要对数据进行反规范化和扁平化（移除层次结构关系）并消除所有数据依赖关系。这个概念类似于构建数据仓库，但不同于维度模型中严格的事实/维度结构，你只需对表进行反规范化，并尝试创建扁平结构，理想情况下不需要连接或只需很少的连接，因为`Hadoop`/`NoSQL`不擅长处理连接操作。


  ##### 应用类型


  正如你之前所见，`NoSQL`仅适用于特定类型的应用程序。以下是它如何影响集成、迁移或重新架构的决策：


  - **数据集市/分析：** `Hadoop` 最适合单次写入/多次读取的场景，这正是数据集市中发生的情况。数据被增量加载，之后被多次读取/处理以进行分析。仓库数据没有更新，只有增量。这与`Hadoop`在大规模读取操作上的高效率（以及更新操作的低效率）特性非常契合。因此，对于数据集市应用，最佳策略是重新架构并迁移到`Hadoop`/`NoSQL`，而非进行集成。同样，虽然可能无法将整个企业数据仓库（`EDW`）迁移到`Hadoop`，但完全有可能重新架构并迁移部分数据集市到`Hadoop`（我在[第
  9 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)和[第 11 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_11)中详细讨论了可以迁移到`Hadoop`的数据集市）。


  - **ETL（批处理）应用：** 可以有效地利用`Hadoop`/`NoSQL`进行`ETL`处理，因为在大多数情况下，它涉及读取源数据、应用转换（到完整数据集），并将转换后的数据写入目标。这再次利用了`Hadoop`高效的串行读/写能力以及无条件、统一地对大数据集应用转换的能力。因此，对于`ETL`应用，最佳策略是重新架构并迁移到`Hadoop`，而非集成。这里需要注意的是，要确保正在转换的数据中几乎没有（或理想情况下完全没有）数据依赖关系。鉴于`NoSQL`缺乏连接能力并且无法处理规范化数据中的关系，要么将数据查找任务保留在`RDBMS`中，要么在不可能的情况下，应避免迁移到`NoSQL`。


  - **社交媒体应用：** 目前，社交媒体的使用与日俱增，企业喜欢将社交媒体应用用于从产品发布到产品失败后的复盘分析等一切事务。大多数社交媒体数据是非结构化或半结构化的。`NoSQL`擅长处理这类数据，对于任何此类应用，你都应该认真考虑重新架构并迁移到`Hadoop`。


  - **用户行为捕获：** 许多电子商务网站喜欢捕获用户的点击行为并分析他们的浏览习惯。由于此类数据量大且具有非结构化特性，`Hadoop`/`NoSQL`非常适合处理它。你当然应该将这些应用重新架构/迁移到`NoSQL`。


  - **日志分析应用：** 任何中大型公司都会使用大量应用，这些应用会生成大量日志文件。在进行故障排除或处理安全问题时，几乎不可能手动分析这些日志文件。其他重要信息也可以从日志文件中获取，比如批处理任务的平均处理时间、失败次数及其详细信息、用户访问和资源详情（用户访问过的资源）等等。`Hadoop`/`NoSQL`非常适合处理这种大量半结构化数据，你应该为此目的设计基于`Hadoop`/`NoSQL`的新应用，或者将任何现有应用重新架构/迁移到`Hadoop`。你一定会看到其带来的益处。


  业务目标




