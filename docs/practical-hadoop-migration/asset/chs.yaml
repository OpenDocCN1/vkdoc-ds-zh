  \ from_unixtime(unix_timestamp()));\n```\n\n第二个批处理视图根据天气条件（如雪、雨、暴风雨、雪崩或龙卷风）过滤索赔记录：\n\
  \n```sql\nCREATE table ClaimWeatherView as \n  Select distinct ClaimId, ClaimWeatherCond\
  \ \n  from ClaimsMaster \n  where ClaimWeatherCond in ('Snow','Rain','Storm','Avalanche','Tornado');\n\
  ```\n\n写入历史记录表：\n\n```sql\nINSERT INTO TABLE BatchProcHist\nVALUES ('ClaimWeatherView',\
  \ from_unixtime(unix_timestamp()));\n```\n\n第三个批处理视图的目标是列出在过去 12 个月内至少有 2 次 1 级严重违规的青少年驾驶员。首先，我填充一个临时表（列出过去\
  \ 12 个月内违规次数为 2 次及以上的驾驶员）：\n\n```sql\nCreate table TeenageVioltemp1 as \n  Select\
  \ PolicyOwnerId, count(ViolationSeverity) as TotalViolations\n  from PO_Drv_Hist\
  \ \n  where (datediff(current_date, add_months(to_date(ViolationDate),12)) <= 0)\
  \ \n    and (ViolationSeverity = 1)\n  group by PolicyOwnerId\n  having count(ViolationSeverity)\
  \ > 2\n```\n\n接下来，使用反规范化保单实体中的出生日期（DOB）对临时表中的条目进行过滤，仅保留 19 岁及以下的驾驶员：\n\n```sql\n\
  Create table TeenageViolView as \n  Select T.PolicyOwnerId, T.TotalViolations\n\
  \  from TeenageVioltemp1 T, PolicyMaster P \n  where T.PolicyOwnerId = P.PolicyOwnerId\n\
  \    and (datediff(current_date, add_months(P.PolicyOwnerDOB,228)) <= 0)\n```\n\n\
  写入历史记录表：\n\n```sql\nINSERT INTO TABLE BatchProcHist\nVALUES ('TeenageViolView',\
  \ from_unixtime(unix_timestamp()));\n```\n\n### 第 11 章 ■ 案例研究：实现 Lambda 架构\n\n我使用了\
  \ `add_months` 函数为驾驶员的出生日期加上 228 个月（即 19 年），并计算差值（以判断驾驶员是否为青少年）。\n\n第四个批处理视图列出违规次数为\
  \ 3 次及以上的成年驾驶员。因此，我将创建一个新的临时表（与第三个批处理视图类似），并过滤掉年龄大于 19 岁的驾驶员：\n\n```sql\nCreate\
  \ table Violtemp1 as \n  Select PolicyOwnerId, count(ViolationSeverity) as TotalViolations\n\
  \  from PO_Drv_Hist \n  where (datediff(current_date, add_months(to_date(ViolationDate),12))\
  \ <= 0) \n    and (ViolationSeverity = 1)\n  group by PolicyOwnerId\n  having count(ViolationSeverity)\
  \ > 3\n```\n\n过滤成年驾驶员：\n\n\n\n```sql\nCREATE TABLE AdultViolView AS\nSELECT T.PolicyOwnerId,\
  \ T.TotalViolations\nFROM Violtemp1 T, PolicyMaster P\nWHERE T.PolicyOwnerId = P.PolicyOwnerId\n\
  \  AND (DATEDIFF(ADD_MONTHS(P.PolicyOwnerDOB, 228), CURRENT_DATE) < 0);\n```\n\n\
  写入历史表：\n\n```sql\nINSERT INTO TABLE BatchProcHist\nVALUES ('AdultViolView', FROM_UNIXTIME(UNIX_TIMESTAMP()));\n\
  ```\n\n**重要提示：** 不要忘记删除您创建的临时表——否则脚本将报错终止。\n\n因此，创建完批次视图后，下一步就是提供或展示它们。\n\n### 实现服务层\n\
  \n我在[第 9 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)讨论了服务层的功能和特点。基本上，它“服务”批次视图，或者以最小延迟提供快速访问。这就是为什么服务层需要是一个专门的分布式数据库，它必须能够：\n\
  \n- 存储批次视图，并支持良好的随机和顺序数据访问性能（仅读取）。\n- 能够快速将批次视图替换为批次层重建的新版本（即支持批量更新）。\n- 容错性（因为视图可以从批次层快速重新部署）。\n\
  - 具备索引能力以实现快速检索。\n\n[第 9 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)中的解决方案是`Splout\
  \ SQL` —— 我将再次使用它。关于`Splout SQL`的架构和操作细节，请参见[第 9 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_9)。`Splout\
  \ SQL`可用于将批次层视图部署为表空间内的表。**表空间**用于对具有相同键列的多个表进行分组。其优势在于，您可以使用相同的分区键对多个表进行分区。对于`Splout\
  \ SQL`来说，分区非常重要，因为它用于在索引和部署之前平衡数据。请注意，当一个表按单列或多列分区时，`Splout`会将这些列的值连接起来形成一个字符串。因此，分区是行的函数，也可以使用任意函数进行分区（例如，一个只使用某列前八个字符的`JavaScript`函数）。\n\
  \n以我的示例为例，请注意批次视图 1、3 和 4 都使用`PolicyOwnerId`作为键列。因此，您可以使用这三个批次视图（或`Hive`表）设计一个表空间。\n\
  \n另一个表空间可以容纳使用`ClaimId`作为键列的第二个批次视图。\n\n因此，作为下一步，您需要生成表空间和表。\n\n要创建或生成表空间，您需要使用`generate`工具。该工具使用一个`JSON`表空间描述符，如下所示。您需要指定输入类型以及`Hive`数据库和表名。表空间描述符文件可以创建在`Splout\
  \ SQL`安装目录中：\n\n```json\n{\n  \"name\": \"PolicyTblspace\",\n  \"nPartitions\":\
  \ 12,\n  \"partitionedTables\": [\n    {\n      \"name\": \"ClaimDefView\",\n  \
  \    \"partitionFields\": \"PolicyOwnerId\",\n      \"tableInputs\": [\n       \
  \ {\n          \"inputType\": \"HIVE\",\n          \"hiveTableName\": \"ClaimDefView\"\
  ,\n          \"hiveDbName\": \"MyHiveDB\"\n        }\n      ]\n    },\n    {\n \
  \     \"name\": \"TeenageViolView\",\n      \"partitionFields\": \"PolicyOwnerId\"\
  ,\n      \"tableInputs\": [\n        {\n          \"inputType\": \"HIVE\",\n   \
  \       \"hiveTableName\": \"TeenageViolView\",\n          \"hiveDbName\": \"MyHiveDB\"\
  \n        }\n      ]\n    },\n    {\n      \"name\": \"AdultViolView\",\n      \"\
  partitionFields\": \"PolicyOwnerId\",\n      \"tableInputs\": [\n        {\n   \
  \       \"inputType\": \"HIVE\",\n          \"hiveTableName\": \"AdultViolView\"\
  ,\n          \"hiveDbName\": \"MyHiveDB\"\n        }\n      ]\n    }\n  ]\n}\n```\n\
  \n让我快速回顾一下这个文件（`PolicyTblspace.json`）中的信息。\n\n表空间将被命名为`PolicyTblspace`，目前定义了三个表（或批次视图）：`ClaimDefView`、`TeenageViolView`和`AdultViolView`，这些是在上一节中创建的。数据库名称是`MyHiveDB`（您需要使用您创建`Hive`表所在的数据库名称），并且我为我的数据创建了\
  \ 12 个分区。我使用`PolicyOwnerId`作为分区列，因为该列将是几乎所有查询的一部分。\n\n要部署此表空间，可以从（Linux）命令行执行以下命令，以生成表空间`PolicyTblspace`（从`Splout\
  \ SQL`安装目录）：\n\n```bash\nhadoop jar splout-*-hadoop.jar generate -tf file:///`pwd`/\
  \ PolicyTblspace.json -o out-MyHiveDB_splout_example\n```\n\n为了提升性能，您可能需要向表空间添加索引，`Splout`允许您轻松添加索引。注意，您必须使用一个名为`simple-generate`的不同生成器，而不是用于生成`PolicyTblspace`表空间的`generate`表空间生成器。使用`simple-generate`生成器的限制是，您的表空间只能包含一个表。由于示例中的另一个表空间只有一个表（或批次视图），我将针对该表空间演示`simple-generate`的用法。以下命令将在生成表空间`ClaimTblspace`时创建一个额外的索引：\n\
  \n```bash\nhadoop jar splout-hadoop-*-hadoop.jar simple-generate –it HIVE –hdb MyHiveDB\
  \ –htn ClaimWeatherView -o out-MyHiveDB_splout_example -pby ClaimId -p 1 -idx \"\
  ClaimWeatherCond\" -t ClaimWeatherView -tb ClaimTblspace\n```\n\n请注意，我没有包含`ClaimId`列，因为它是一个分区列并且已经被索引。`-idx`选项只是向索引中添加更多列（在此例中是`ClaimWeatherCond`）。另请注意，这里没有`JSON`配置文件，因此所有配置（例如`Hive`数据库、表名、分区列等）都通过命令指定。\n\
  \n表空间成功生成后，您需要按如下方式部署它们：\n\n```bash\nhadoop jar splout-hadoop-*-hadoop.jar deploy\
  \ -q http://localhost:4412 -root out-MyHiveDB1_splout_example -ts PolicyTblspace\n\
  \nhadoop jar splout-hadoop-*-hadoop.jar deploy -q http://localhost:4412 -root out-MyHiveDB2_splout_example\
  \ -ts ClaimTblspace\n```\n\n`localhost` 是运行中的`QNode`主机（客户端与之连接），`localhost`将在运行时自动替换为第一个有效的私有\
  \ IP 地址（根据配置文件中的指定）。\n\n一旦表空间被部署，您就可以在任何查询中使用它。例如，如果需要检查某个特定理赔（`ClaimId=14124736`）是否是在恶劣天气条件下提交的，您可以使用`REST\
  \ API`，如下所示：\n\n```\nhttp://localhost:4412/api/query/ClaimTblspace?sql=SELECT *\
  \ FROM ClaimWeatherView;&key=14124736\n```\n\n您可以使用`Splout SQL`（或任何其他您喜欢的数据库解决方案）来部署批次层视图，如本节所示。接下来，我将讨论如何访问批次层尚未处理的数据，并将其包含在查询结果中。\n\
  \n### 实现速度层\n\n回顾一下，速度层的目的是使批次层视图尚未处理的数据能够无延迟地可用。速度层视图与批次层视图的另一个区别是，批次层通过重新计算（或重建）来更新视图，而速度层对视图执行增量处理，只处理自上次增量处理之后发生的增量（或新）事务。因此，如果您的传入数据事务带有时间戳，并且您将其从主数据集中提取出来，那么根据记录是被修改还是被添加，您可以相应地修改您的速度层视图。\n\
  \n\n\n接下来需要考虑的是，是否需要同步更新速度层（将对主数据的任何更新直接应用于速度层视图），还是异步更新（将请求排队，实际更新稍后进行）。在本例中，异步更新将更为有用，因为分析应用更侧重于复杂的计算和聚合，而非交互式用户输入。此外，考虑到数据量庞大，能够对更新有更多控制权会很有益（例如，通过临时分配额外的请求来处理变化的工作负载）。\n\
  \n我将使用 `Spark` 来实现速度层。更具体地说，我将使用 `Spark` 处理引擎和 `Spark SQL`。\n\n由于 Lambda 架构定义速度层由批处理层尚未处理过的记录组成，因此需要确定这些记录是什么。你可能还记得，每次构建批处理视图后，都会在表\
  \ `BatchProcHist` 中插入一条历史记录。因此，批处理视图的最新记录可以告诉我们最近一次构建的日期/时间，从而帮助我们确定哪些是未处理的记录。我将把第一个批处理视图的最新记录写入一个表（因为\
  \ Hive 不支持将查询结果赋值给变量）：\n\n```\nCreate table MaxTable as select ViewName, max(CreatedAt)\
  \ as MaxDate from\nBatchProcHist group by ViewName having ViewName = 'ClaimDefView';\n\
  ```\n\n这样就能得到批处理层视图构建的最新日期/时间。\n\n然而，由于速度层视图的处理频率更高，你还需要确定速度层上次处理记录的日期/时间（因为只需要考虑未处理的记录），以便更新视图（这里是一个注册为表的\
  \ Spark 数据帧）。我将速度层视图命名为 `ClaimDefView_S`。由于速度层视图也会写入审计表 `BatchProcHist`，我将把第一个速度层视图的最新记录写入同一个表（其中已经捕获了第一个批处理视图的最新记录）：\n\
  \n```\nInsert into MaxTable select ViewName, max(CreatedAt) from BatchProcHist\n\
  group by ViewName having ViewName = 'ClaimDefView_S';\n```\n\n现在，我只需要确定这些记录中哪一个是最近的（以防批处理层在上次速度层构建之后又重新构建），并将其作为处理第一个速度层视图记录的基础：\n\
  \n```\nCreate table MaxTbl1 as select max(MaxDate) as MaxDate from MaxTable;\n```\n\
  \n最后，从主数据集中获取未处理的记录，并创建速度层视图。同时，添加时间戳并将一条记录写入审计历史表：\n\n```\nCreate table ClaimDeftemp11\
  \ as Select PolicyId, ClaimId from ClaimsMaster a, MaxTbl1 b where where a.LastModified\
  \ > b.MaxDate;\n\nCreate table ClaimDeftemp12 as Select PolicyId, count(ClaimId)\
  \ as\nClaimcount from ClaimDeftemp11 where datediff(current_date, add_months\n(to_date(ClaimSubmissionDate),12))\
  \ <= 0\ngroup by PolicyId having count(ClaimId) > 5\n```\n\n作为最后一步，我将把这个临时表与反规范化的\
  \ Policy 实体进行连接，以获取构成批处理视图的策略所有者详细信息，并将一条记录写入历史表：\n\n```\nCreate table ClaimDefView_S\
  \ as Select P.PolicyOwnerID, P.PolicyId,\nC.Claimcount from PolicyMaster P, ClaimDeftemp12\
  \ C where P.PolicyId =\nC.PolicyId;\n\nINSERT INTO TABLE BatchProcHist\nVALUES ('ClaimDefView_S',\
  \ from_unixtime(unix_timestamp());\n```\n\n现在删除临时表（因为我们可能会为下一个速度层视图重新创建其中一些表）：\n\
  \n```\nDrop Table MaxTable;\nDrop Table MaxTbl1;\nDrop Table ClaimDeftemp11;\nDrop\
  \ Table ClaimDeftemp12;\n```\n\n其他速度层视图可以类似地创建如下：\n\n```\n--视图 2;\nCreate table\
  \ MaxTable as select ViewName, max(CreatedAt) as MaxDate from\nBatchProcHist group\
  \ by ViewName having ViewName = 'ClaimWeatherView';\n\nInsert into MaxTable select\
  \ ViewName, max(CreatedAt) from BatchProcHist\n```\n\n\n\n"
