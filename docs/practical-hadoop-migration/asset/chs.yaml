  ## 第 1 章


  ## RDBMS 遇到 Hadoop：集成、重新架构与迁移


  最近，我在 Strata + Hadoop World 大会上与一家大型食品企业的高管聊天，该公司使用关系型解决方案存储所有数据。我随口问他是否考虑使用大数据解决方案，他的回答是：“我们已经试过了，太慢了！”我大为惊讶，并再次核实了情况。这家企业甚至聘请了一家主要的
  `Hadoop` 供应商提供咨询服务，却仍然无法利用大数据的力量。


  我思考了这个问题以及可能的原因。首先，`Hadoop` 供应商可以调优其 `Hadoop` 安装，但不能保证通用的调优对特定类型的数据有效。其次，这家食品企业的数据库管理员和架构师可能不知道如何转换其关系型数据以供
  `Hadoop` 使用。这并不是孤立事件，大多数希望将关系型数据迁移到 `Hadoop` 的企业都处于类似境地。结果是 `Hadoop` 集群运行缓慢且效率低下，性能远未达到大数据宣传所引发的预期。


  第三，并非所有 `NoSQL` 数据库都是同等的。`NoSQL` 数据库在处理数据的方式以及内部用于管理数据的模型上差异巨大。它们只对特定类型的数据有效。因此，了解你的数据类型并选择与之匹配的
  `NoSQL` 解决方案至关重要。


  最后，将 `NoSQL` 解决方案应用于关系型数据的成功与否，取决于你确定使用 `Hadoop`/`NoSQL` 的目标以及适应你的数据量。`Hadoop` 并非能神奇地加速所有数据处理的万能药——它仅可用于特定类型的处理（我将在本章中进一步讨论）。而且，`Hadoop`
  在数据量较大时效果最佳，而对于较小的数据量，由于相关的各种开销，效率并不高。


