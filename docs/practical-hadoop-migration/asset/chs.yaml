  \n### 优化 MapReduce 应用程序\n\n`MapReduce`是一种编程模型，用于在 Hadoop 集群上通过并行、分布式算法处理大型数据集。一个`MapReduce`程序包含一个`Map`方法（执行过滤和排序，例如按产品名称对销售额排序）和一个`Reduce`方法（执行汇总或聚合，例如按产品统计销售额）。`MapReduce`框架将处理任务分布在集群的各个节点上，并行运行任务，管理系统各个部分之间的所有通信/数据传输，并提供冗余和容错能力。\n\
  \n以下是关于优化`MapReduce`使用的一些注意事项：\n\n- **推测执行**：集群中的所有节点运行速度可能不同——可能某个节点较慢。为了应对机器性能差异，Hadoop\
  \ 会在多个没有其他任务执行的节点上调度同一任务的冗余副本，这个过程称为*推测执行*。当一个任务完成时，它会通知`JobTracker`，最先完成的副本成为最终副本。其他正在推测执行的副本会被放弃，`Reducer`会从最先成功完成的`Mapper`那里接收输入。\n\
  \    默认情况下，推测执行是启用的。如果你的节点配置相同，可以通过禁用此行为来节省宝贵的资源。你可以通过将`mapreduce.map.tasks.speculative.execution`和`mapreduce.reduce.tasks.speculative.execution`选项设置为`false`来禁用`Mapper`和`Reducer`的推测执行。\n\
