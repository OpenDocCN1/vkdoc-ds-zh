  调度器还负责生成工作线程（根据需要）。这些工作线程访问存储（使用相应的存储驱动）并检索数据。然后，客户端从输出阶段拉取整合并处理后的数据，而输出阶段则从底层中间阶段拉取数据。如前所述，所有这些处理都在内存中进行，因此能够加快整个查询处理的速度。


  ### 分析工具


  分析工具是指那些扫描大部分（或全部）数据并执行处理，从而从中提取信息或知识的工具。广义上，这些工具可分为两类。第一类是执行聚合操作的工具（这些聚合操作与数据仓库查询执行的聚合非常相似）。其中一些工具支持
  SQL，另一些则不支持。我将在此子类别中讨论一个有趣的产品（Apache Kylin）。


  我的第二类包括提供执行自定义算法处理能力的工具，包括预测性和规范性分析。传统上，这些是通过使用 HBase 或 Cassandra 配合 HDFS 存储来完成的。Spark
  是该领域的最新成员，具有更好的性能，但其他有趣的工具也提供此功能。


  一些 NoSQL 数据库不提供聚合支持（例如 Cassandra、HBase）。在数据摄入时预计算聚合结果并将其存储起来（以供后续使用）是一种替代方案。


  最后，还有一些产品不属于任何单一类别。例如，Druid（用于聚合的 NoSQL 分析引擎）可以像 Storm 一样实时摄入数据。Druid 将聚合结果存储在内存中（跨集群）以实现更快的访问。


  #### Apache Kylin


  Apache Kylin 是由 eBay 开发的开源分布式分析工具。Kylin 提供 SQL 接口以及在 Hadoop 上执行多维分析（OLAP）的能力，并支持超大数据集。为了增强这些性能，Kylin
  预先构建了 MOLAP 立方体。此外，它具有分布式架构，可以受益于 MapReduce（或任何其他处理分布式数据的框架），并且还提供了高并发性。除了 SQL 接口，Kylin
  还能很好地与其他 BI 工具（如 Spotfire、Tableau 或 MicroStrategy）配合使用。


  以下是 Kylin 的主要特性：




  '
- "# Apache Kylin 特性概述\n\n- **可扩展且快速的 OLAP 引擎：** `Kylin` 能够降低对超大数据集的查询延迟。这归功于其预构建立方体及计算的架构。\n\
  \n- **支持 ANSI SQL 与交互式查询：** 由于我们长期使用 SQL，`Kylin` 对大多数 ANSI SQL 查询函数的支持是一项实用特性，可加速开发流程。交互式查询通过预构建的立方体提供灵活性与速度。\n\
  \n- **MOLAP 立方体：** 利用文件存储和预构建计算，为 MOLAP（多维立方体）提供了速度。此外，传统 MOLAP 的弱点（立方体内数据包含限制）在\
  \ `Kylin` 中不复存在。例如，用户可轻松在 `Kylin` 中为超过 100 亿条原始数据记录预构建一个立方体。\n\n- **BI 工具集成：** 与\
  \ BI 工具的集成对于执行高级分析和生成报告至关重要。`Kylin` 可与 `Tableau`、`Spotfire`、`Microstrategy` 等商业智能工具及许多第三方应用程序进行交互。\n\
  \n- **开源 ODBC 驱动程序：** `Kylin` 的 `ODBC` 驱动程序专为按需访问数据源而开发，并已与报表编写应用程序 `Tableau` 进行了充分测试。该驱动程序已向\
  \ Apache 社区开源，便于用户根据特定用途进行定制。\n\n- **简单高效的管理：** 以下特性提供了易用性和管理便利性：\n  - 作业管理与监控\n\
  \  - 压缩与编码以减少存储需求\n  - 立方体的增量数据刷新（允许仅处理变更数据，减少处理时间）\n  - 用于管理、构建、监控和查询立方体的 Web 界面\n\
  \n- **性能提升：** 以下特性提供了额外的性能增强：\n  - `Kylin` 利用 `HBase` 协处理器提升查询性能。对于简单的加法或聚合操作（如\
  \ `sum`、`count` 或 `like`），将计算下推到 region 服务器或主服务器（可直接在数据上工作，无网络流量开销），可显著提升性能。\n \
  \ - `Kylin` 使用 `HyperLogLog` 算法来确定查询中的去重计数。该算法近似计算数据集中不同元素的数量，显著减少内存消耗，并允许使用超大数据集。\n\
  \n- **灵活细粒度的安全机制：** `Kylin` 允许在立方体或项目粒度级别设置 ACL（访问控制列表），并支持集成 LDAP。这有助于轻松与企业安全体系集成。\n\
  \n- **容错性：** `Kylin` 在系统层和数据层均支持容错：\n  - **数据容错：** `Kylin` 中的立方体可被划分为多个段，其优势在于可以刷新（或重建）单个段而不影响整个立方体。因此，您可以按需制定每日、每周或每月构建段的策略。检测到的任何数据错误或所需更改均可应用于粒度最小的段，从而实现有效的容错，无需重建整个立方体。无法由最小粒度处理的数据变更，则需要在更高层级重建（例如，一周后发现的数据问题需要重建每周的段）。因此，您需要在数据容错和查询性能之间取得平衡。更高的段粒度能提供更高的数据错误/变更容忍度，但也会导致每次查询扫描更多数据。重要的是，当立方体的某些段正在重建时，该立方体仍可继续使用。\n\
  \  - **系统容错：** `Kylin` 继承了 `HDFS` 和 `HBase` 提供的系统冗余和容错能力。此外，您可以安全地重试任何失败的构建步骤而不会产生任何负面影响。这确保了构建最终版本的完整性和正确性，无论中间发生多少次失败或重试。\n\
  \n## 第 5 章：Hadoop 生态系统\n\n## Kylin 架构\n\n\n\n## 第 5 章：Hadoop 生态系统\n\n我在前几节讨论了 Spark\
  \ SQL 和 Presto。目前已有多种 SQL-on-Hadoop 工具可用。那么为什么要使用 Kylin 呢？因为大多数这些工具需要部分或完全扫描数据集来回答你的查询。不仅如此，查询中的任何连接操作都可能触发跨节点的数据传输，并且根据网络流量延迟，你收到的响应可能并不理想。\n\
  \n相比之下，Kylin 会预先计算所有维度的聚合结果，并将结果值存储在数据立方体中。构建立方体的过程非常全面，考虑了所有可能的维度组合，从而确保对更多查询的覆盖。此外，Kylin\
  \ 会生成预连接的 HiveQL（基于元数据），用于将事实表与维度表连接起来。预连接和预聚合的结果存储在 HBase 中。因此，大多数查询由 MOLAP（多维\
  \ OLAP）立方体提供服务，速度非常快。无法使用立方体的查询会被路由到保存元数据的 Hive 表，从而以 ROLAP（基于星型或雪花型模式的关联 OLAP）的方式执行。本质上，Kylin\
  \ 提供了 HOLAP（混合 OLAP）架构。\n\nKylin 的下一个版本计划用 Spark SQL 取代 Hive（以获得更高的速度和内存处理能力），采用\
  \ Lambda 架构（提供近实时结果）、内存分析（提升性能）和容量管理。此外，还计划使用 Spark 引擎。\n\n图 5-4 中的流程图总结了 Kylin\
  \ 内部的立方体构建过程。\n\n为维度表构建字典\n执行 Hive 查询\n执行 MapReduce 任务以\n将事实表与维度表连接\n并复制到 HDFS\n\
  构建扁平表\n构建 cuboid（作为 HDFS\n序列文件）包含所有\n可能的维度组合的\n聚合结果并关联事实表\n计算 HDFS 序列文件的\n键分布\n\
  将 HDFS 序列文件\n转换为 HBase HFile\n将 HFile 加载到 HBase\n并均匀拆分键\n\n**图 5-4.** *Kylin 立方体构建过程*\n\
  \n最后，让我用一个全面的 Kylin 架构图来总结这一讨论。图 5-5 显示了 Kylin 引擎的主要组件：REST 服务器、查询引擎、元数据管理器和任务引擎。\n\
  \n客户端请求发起\n基于 SQL 的 BI 工具\n客户端应用\n如使用 JDBC/ODBC 的 Tableau\n通过 REST API\n\nKylin\
  \ 核心引擎\n\nRESTful 服务器解析并传递给查询引擎\n\nREST 服务器\n\n查询引擎尝试从立方体获取数据；\n若不成功则获取元数据\n较慢的查询响应\n\
  查询引擎\n（Calcite）\nHive 星型/雪花型模式\n\n较快的\n查询响应\n\n元数据管理器\n\nMOLAP\n立方体\nHive\n\n任务引擎\n\
  \n输入模式\n输出键\n值对\n\n任务引擎负责构建立方体以及调度增量数据更新\n\n**Kylin 扩展**\n**Kylin**\n**Kylin 用户**\n\
  （支持额外功能的插件）\n集成\n（带监控、\n告警等）\n界面\n（提供构建第三方用户界面的功能）\n\n**图 5-5.** *Kylin 架构*\n\n\
  REST 服务器与客户端查询交互，并将查询传递给查询引擎。如果查询结果可以通过立方体数据计算得出，则结果几乎立即返回；但如果无法（从立方体数据中）计算，则会使用较慢的路径，即使用\
  \ Hive 模式。你可以根据需要为 Kylin 核心引擎添加扩展或接口。\n\n### 内存处理工具\n\n在过去几年中，基于内存的处理主要由 Spark 和\
  \ Storm 主导。尽管这两者都是功能极其强大且实用的产品，但 Apache Flink 具备一些功能，使其相对于这些经过验证的成熟产品具有明显优势。\n\n\
  #### Flink\n\nFlink 是一个大规模数据处理引擎，提供内存数据流处理，因此对于数据密集型以及迭代型任务来说，处理速度极快。Flink 与 Spark\
  \ 有何不同？嗯，Spark 主要是一个批处理框架，可以近似模拟流处理。Flink 主要是一个流处理框架，同时也能执行批处理。Spark 并非纯粹的流处理引擎，实际上它是对输入数据的较小部分执行快速批量操作，也就是“微批处理”。\n\
  \n对于大多数应用来说，这可能不是问题，但对于金融或实时系统（需要低延迟的情况），每一毫秒都至关重要，即使微小的性能问题也可能导致严重的经济损失。\n\n你还可以将\
  \ Flink 视为 Hadoop MapReduce 的替代品，它支持批处理和流模式，并使用有向图（而非映射和归约任务），从而利用内存处理获得更好的性能。\n\
  \nFlink 拥有出色的优化引擎。Flink 优化器会分析（提交到集群的）输入代码，并根据其判断，为在特定环境（可能因集群硬件和节点数量而异）下执行该代码决定最佳管道。\n\
  \n在性能方面，迭代处理会在同一节点上执行（而非让集群独立运行每次迭代）。使用优化器提示，还可以仅对数据集中可能已发生变化的部分执行增量迭代。\n\nFlink\
  \ 可以与 YARN 协同工作，并且可以直接在其执行引擎上运行现有的 MapReduce 任务，为已经使用 MapReduce 的组织提供了轻松的升级路径。\n\
  \n最后，Flink 可以与 Apache Tez 配合使用（仅用于批处理），在一定程度上为了可扩展性而牺牲性能。\n\n在内存管理方面，Flink 在 JVM\
  \ 内部（DataFlow 引擎的 JVM 中）实现了自己的内存管理，从而帮助应用轻松扩展，并减少 JVM 垃圾回收开销的影响。这（几乎）也消除了 Spark\
  \ 集群上常见的内存使用异常（或峰值）。你可以通过内置的 HTML 查看器，将 Flink 为你的任务构建的管道导出为 JSON 表示，从而使调试变得容易。\n\
  \n对于流处理应用而言，容错性是一个重要的考量因素，Flink 的容错机制基于 Chandy-Lamport 分布式快照。该算法使得分布式系统中的进程能够确定计算过程中的全局状态，并可用于检查点。该机制仅使用少量系统资源（从而保持高吞吐率），同时提供有保证的一致性水平。\n\
  \n许多（使用 Hadoop 的）组织正在选择实时流处理架构（以取代现有的批处理架构）。静态的 HDFS 文件正在被事件流所补充，批量工作负载正被流处理器取代，以提供更低延迟的应用。这种转变的主要原因是，构成\
  \ Hadoop 集群大部分工作负载的数据集和用例都是基于事件的（例如，事件或审计日志）。另一个原因是，现在的流处理技术已经足够成熟，可以处理更复杂的需求。\n\
  \n最后，还有一些应用（如处理传感器数据）需要连续查询，这只能由流处理架构来支持。\n\n通常，流处理架构由以下模块组成：\n\n- 收集和整合事件流\n- 集中收集、保存流并分发它们\n\
  - 分析流并创建衍生流\n\n第一步通常使用 Flume 或 Sqoop 等应用完成，但很大程度上取决于数据源。输入事件可能包含来自（关系型/NoSQL）数据库的数据、机器生成的日志或传感器数据。这些数据需要被清洗和整合。\n\
  \n\n\n像 `Kafka` 这样的应用可用于执行第二步。`Kafka` 可以收集事件流和日志，并对它们进行缓冲。`Kafka` 在保存和分发流的同时，还提供了容错能力（这在此场景中是必要的）。\n\
  \n最后一步涉及对流进行分析。这可能包括创建计数器、聚合它们、合并流，或创建派生数据流以供进一步使用。`Apache Flink` 可以（并且确实被）用于实施这一步。\n\
  \n## Flink 架构\n\n请记住，`Flink` 只是一个用于分布式数据分析的框架。在核心层面，`Flink` 拥有一个流式迭代数据流引擎。`Flink`\
  \ 在核心引擎之上使用了两个主要的 API（用于处理批处理数据的 `DataSet API` 和用于处理事件流的 `DataStream API`），以提供同样轻松处理不同类型数据的通用功能。`Flink`\
  \ 日益增长的流行度催生了基于这两个主要 API 构建的领域特定库和 API 的开发。\n\n目前，可用的库包括：机器学习库、图分析库 (`Gelly`) 以及一个类似\
  \ SQL 的 API (`Table`)。此外，还有其他在 `Flink` 之上运行的项目，例如 `Google Cloud Dataflow` 和 `Apache\
  \ MRQL`。最后，`Flink` 核心引擎可以与各种数据处理框架（如 `YARN`/`Apache Tez`）协同工作，可以作为独立的 `Flink` 集群运行，也可以嵌入到其他应用中。图\
  \ 5-6 总结了该架构。\n\n![Image 27](img/index-136_1.jpg)\n\n### 第 5 章 ■ HADOOP 生态系统\n\n\
  编程客户端\n访问 `Flink 库`\n上层项目\n库（`Hadoop M/R`，`Gelly`，`Table`，`FlinkML`）\n上层项目（`Google\
  \ Dataflow`，`MRQL`）\n用于批处理\n用于事件流处理\n`Dataset API`\n`DataStream API`\n`Flink 数据流引擎`\n\
  数据处理框架（`YARN`，`Tez`，`Flink 集群`）\n\n**图 5-6.** Flink 架构\n\n## 搜索与消息传递工具\n\n搜索工具提供索引和搜索（主要是）文本数据的能力。因此，它们仅适用于某些类型的数据。出于显而易见的原因，这些（用于\
  \ `Hadoop` 的）搜索工具不如关系数据库的搜索工具那样灵活或广泛，但它们确实占有一席之地。由于许多 `NoSQL` 数据库缺乏必要的二级索引能力，这些产品有时被用来增强它们。用于\
  \ `Hadoop` 的 `Solr` 和 `Elastic Search` 是该类别中的热门产品，两者都使用 `Lucene` 作为底层索引引擎。\n\n消息传递系统以源-目标和发布-订阅模式传递消息。通常，这些系统运行在像\
  \ `Flink` 或 `Spark Streaming` 这样的实时流处理器之上。`Kafka` 是一种流行的消息传递系统（在上一节中简要讨论过），它还允许你对消息进行随机访问。\n\
  \n### 第 5 章 ■ HADOOP 生态系统\n\n### 总结\n\n如果你在过去五年中使用过 `Hadoop`，你可能已经注意到 `Hadoop` 世界处于不断变化的状态，新的应用几乎每天都在增加（或消失）。几乎不可能跟踪所有的新项目，因此，为你的大数据需求选择完美同步的组件是一项艰巨的任务。当你最终确定时，新的组件就会出现，它们可能更适合你的需求！\n\
  \n在本章中，我试图提供一个关于当前可用产品类别和新产品的整体视图，希望这能为你提供一个良好的概述和起点。然而，你在选择必须满足业务需求的组件时，仍然需要进行自己的研究和尽职调查。请记住，如果一个新组件（刚刚进入市场）更适合你的需求，但会使你的项目截止日期推迟一个月，那么如果它能让你在竞争中占据优势或大幅提高流程效率，这应该是可以接受的。\n\
  \n你还需要明白，选择这些组件中的任何一个都涉及复杂的工程权衡，你需要选择涉及最少权衡（且收益最大）的选项。你的首要目标应作为一个良好的起点（用于选择主要组件），并应尝试围绕它构建一个系统。\n\
  \n本章也作为从关系技术向大数据世界过渡的桥梁。后续章节将讨论实施大数据解决方案的设计概念，因此本章讨论的 `Hadoop` 产品类别将有助于理解这些概念。\n\
  \n**第 6 章**\n\n**为 NoSQL 重新设计架构：**\n\n**设计原则、模型**\n\n**与最佳实践**\n\n我最近参加了一个由 Doug\
  \ Laney 主讲的关于*数据货币化*的高德纳研讨会。Doug 谈到了一个有趣的概念，即为你组织历史上收集的数据赋予货币价值。他还谈到了*数据易货*的概念，以及用信息而不是金钱来缴税（显然他向几位\
  \ `IRS` 官员提过这个，并享受了他们的反应）。Doug 恰当地将数据经济学称为*信息经济学*。我认为，创建一个新学科来有效地将数据货币化，凸显了数据（和信息）在当今世界日益增长的重要性。\n\
  \n现在想想信息经济学背后的根本问题——你如何组织、整合、分析和呈现大量数据？由于这个概念涉及利用你组织多年来收集的所有数据，数据量将会很大。同时，像其他需要销售的东西一样，最终产品需要有用且具有可呈现性。大数据解决方案可以成功地用于组织和分析大量数据。当然，你需要为\
  \ `NoSQL` 的使用重新设计你的数据架构，因为关系数据不能直接用于 `NoSQL` 数据库。需要应用某些转换，我将在本章中讨论这些。\n\n关系数据库有很多特性，你会想当然地认为任何数据库系统都具备。例如，定义细粒度的安全（或授权）、参照完整性约束或统计信息。此外，像并发更新或数据类型验证等事情都由\
  \ `RDBMS` 自动处理。\n\n对于 `NoSQL` 数据库，只有部分这些特性可用，但通常需要附加组件（以及大量的额外工作来安装/配置/与其他组件集成）或涉及时间和资金的定制开发。例如，你必须转换数据以保持数据完整性（在没有参照完整性的情况下），或者在缺乏高级索引或统计信息的情况下提供更好的性能。`RDBMS`\
  \ 在一个（相对）易于使用的包中为你提供了所有这些特性。\n\n© Bhushan Lakhe 2016\nB. Lakhe, *实用 Hadoop 迁移*,\
  \ DOI 10.1007/978-1-4842-1287-5_6\n\n### 第 6 章 ■ 为 NoSQL 重新设计架构：设计原则、模型与最佳实践\n\n\
  参照完整性的缺失促使数据反规范化。这让我们想起了数据仓库，尽管转换技术相似，但 `NoSQL` 通过完全消除任何连接操作，将这一点推向了更远。你可能还记得，对于星型模式，事实表需要与适当的维度表连接，以实现有效（且灵活）的数据过滤。而对于\
  \ `NoSQL` 数据库，即使是这些连接也是不可取的。因此，需要完全消除连接。\n\n另一件要记住的重要事情是，许多数据完整性、验证或并发特性对于许多应用来说并非必需，这实际上促进了\
  \ `NoSQL` 数据库的发展——它们用这些特性换取了更好的性能和可扩展性。\n\n还需要考虑一些非数据中心因素，例如安全性（认证/授权）或并发性，因为 `RDBMS`\
  \ 默认提供这些特性，而在 `NoSQL` 解决方案中则不容易获得。\n\n\n\n"
- "# 重新架构关系型应用到 NoSQL 环境的设计原则\n\n作为总结性思考，你必须牢记 RDBMS 数据库设计与 NoSQL 数据库设计在功能上的区别。RDBMS\
  \ 数据库设计是业务功能和流程的反映，而 NoSQL 设计本质上反映了数据访问模式及其性能优化（NoSQL 数据库中的数据被反范式化，以支持快速检索和处理）。\n\
  \n## 重新架构关系型应用到 NoSQL 环境的设计原则\n\nNoSQL 数据库主要关注数据使用模式，并重新组织数据以优化性能。借助 HDFS 存储（在某些情况下），可扩展性和容错性默认可用。由于我在讨论迁移，因此假设存在一个现有的基于\
  \ RDBMS 的系统，该系统提供必要的业务功能。\n\n因此，作为第一步，你需要审查需要迁移到 NoSQL 的现有数据和数据处理。如你所知，有几种类型的 NoSQL\
  \ 数据库（`key-value` 存储、列式数据库、文档数据库和图数据库）。根据你的数据特征和处理需求，你必须决定哪种类型的 NoSQL 数据库最适合你的需求。\n\
  \n作为下一步，所选 NoSQL 数据库中的数据需要被**反范式化**、**聚合**和**呈现**，以支持分析和即席查询。我将详细讨论这些迁移方面的内容。最后，我将讨论\
  \ NoSQL 解决方案中非数据中心特性（如安全性或并发性）的实现。\n\n### 选择合适的 NoSQL 数据库\n\n首先，我假设你已经花了一些时间考虑是否真的需要在你的环境中使用\
  \ NoSQL，并根据第[1 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_1)中讨论的各种因素做出了决定。请注意，Hadoop\
  \ 和 NoSQL 操作的是**数据集**，而不是关系环境中的**数据库**和**表**。因此，你可以将 NoSQL *数据库*视为*数据集的集合*。本节讨论\
  \ NoSQL 数据库的主要类型及其潜在应用。\n\n### Key-Value 存储\n\n这些数据库由全局的键值对集合组成。在这个上下文中，键值对意味着什么？假设一个包含全球销售详情的数据集在营销分析系统中被频繁访问，并且由于热门产品可能有数百万条销售记录，检索需要时间。如果这个数据集被缓存，将会有所帮助。因此，可以定义一个*键*，将数据集作为*值*，然后通过引用该键来确保快速数据检索。\n\
  \n一个常见问题是多个键指向同一个数据集。如果你能确保你的键存储中的所有*值*（数据集）都有唯一的键，那么你可以成功地像使用哈希表一样使用它。`Key-Value`\
  \ 存储主要用作缓存存储或基于键的数据。\n\n请记住，如果你尝试使用多个键查询相同的数据，会遇到问题。\n\n使用 `key-value` 存储进行水平扩展很容易，可以通过对键进行哈希来实现。一些\
  \ `key-value` 存储会自动为你执行此操作。通常，`key-value` 存储非常适合执行大量小规模读写操作或连续流式处理的应用程序，因为内存处理带来了良好的性能提升。一些流行的\
  \ `key-value` 存储包括 `Memcache`、`Redis`、`Aerospike` 和 `Riak`。\n\n你可以将 `key-value`\
  \ 存储用于什么样的应用程序？考虑以下场景。\n\n当你浏览零售网站时，一个随机的 `cookie` 值会与服务器上的一大块序列化数据相关联，通常为每个访问者创建。然后，这些\
  \ `cookie` 会持续数周，占用宝贵的数据库空间。可以使用 `key-value` 存储为访问者创建一个键条目，并设置 24 小时（或根据需要）的过期时间，从而自动释放空间。\n\
  \n另外，考虑一个简单的有上限的日志实现。你可以将项目附加到一个*日志*键（映射到捕获日志记录的文件）上，并仅保留最后几项。你可以使用它来跟踪系统状态，而无需扫描不断增长的日志信息。\n\
  \n总结一下，对于包含以下特征的数据，可以使用 `key-value` 存储：\n- 大量的小规模读写操作\n- 对多种数据结构的操作\n- 数据类型多变，或需要灵活的列数\n\
  \n最后，你如何为你的应用程序使用 `key-value` 存储？以下是一个使用 `key-value` 存储 `Memcached` 的示例。一个典型的 `Memcached`\
  \ 安装包含一个或多个服务器，这些服务器根据任何客户端的请求缓存数据（*值*）以及一个唯一的*键*。然后，可以使用该键在将来快速检索该数据。缓存的数据具有指定的过期时间，一旦达到该时间，就会从缓存中移除。如果有多个服务器可用，则可以缓存更多数据（因为所有服务器的内存都会被添加用于使用）。\n\
  \n由于 `Memcached` 调用和编程语言会根据使用的 API 而变化，我将使用伪代码来演示该概念。在此示例中，假设服务器 IP 是 `63.1.4.52`，使用的端口是\
  \ `2200`。那么，命令序列将类似于以下内容：\n\n```\n# 伪代码：定义新的缓存和服务器\nmemcacheclt = new Memcache\n\
  memcacheclt:add_server('63.1.4.52:2200')\n```\n\n`Memcached` 可用于通过缓存频繁访问的数据来减轻 SQL\
  \ 数据库的负载。当然，它不提供集中式查询缓存（正如 RDBMS 所提供的），也不使用任何中间件来实现缓存，因此在缓存失效时（可能由于数据更改）不会有重大问题。\n\
  \n```\n# 定义数据缓存（值）和 Sales 表中数据的键\nsql = \"SELECT * FROM Sales WHERE Product_id =\
  \ ?\"\nkey = 'SQL:' . Product_id . ':' . md5sum(sql)\n```\n\n如果你不熟悉 `md5sum`，它是一个计算和验证文件及字符串的\
  \ 128 位 [MD5](https://en.wikipedia.org/wiki/MD5#MD5) [哈希](https://en.wikipedia.org/wiki/Cryptographic_hash_function#Cryptographic%20hash%20function)\
  \ 的程序。MD5 哈希（或[校验和](https://en.wikipedia.org/wiki/Checksum#Checksum)）用作字符串或文件的紧凑数字指纹。尽管无限数量的文件（或字符串）可以拥有任何给定的\
  \ MD5 哈希，但任何两个非相同的文件（或字符串）拥有相同 MD5 哈希的可能性极低。这有助于确保键的唯一性。请注意，底层的 MD5 算法[不再被认为是安全的](https://en.wikipedia.org/wiki/MD5#Security#MD5)（尽管它不需要特别安全，尤其是对于\
  \ SQL 字符串），但由于对字符串（或文件）的任何更改都会导致其 MD5 哈希发生变化，因此 `md5sum` 可用于验证文件或字符串的完整性。\n\n```\n\
  # 首先，检查键值对是否已定义\nif (defined result = memcacheclt:get(key)) {\n    return result\n\
  } else {\n    # 执行 sql 以创建键值对\n    handler = run_sql(sql, Product_id)\n    # 由于你返回了一个\
  \ handler 或指针对象（在执行 SQL 之后），\n    # 你需要将其转换为数组以便缓存\n    final_array = handler:convert_to_an_array\n\
  }\n```\n\n\n\n"
- "# 缓存十分钟\n\n`memcacheclt:set(key, final_array, 10 * 60)`\n\n`return final_array`\n\
  \n当您缓存此产品的销售数据行时，最多十分钟内您将看到相同的数据。这意味着您所做的任何数据更改最多需要十分钟才能生效（除非您通过更改数据来主动使缓存失效）。通常，您可以为\
  \ Web 应用程序使用键值数据库，并保存用户配置文件/偏好、会话详细信息和购物车。\n\n## 文档数据库\n\n面向文档的数据库将数据存储为文档并进行管理。一个*文档*可以是一组结构化或半结构化数据。面向文档的数据库可以被视为键值存储的一个子类，因为数据的存储和检索方式相似，但数据的处理方式不同。对于键值存储，数据对数据库来说本质上是不可知的；它只是键对应的值。相比之下，面向文档的系统会读取数据（或文档）的内部结构以提取元数据，并将其用于进一步的处理和优化。\n\
  \n面向文档的数据库从数据本身提取类型信息，并将相关信息分组以便于使用。例如，XML 数据库（一个特定的子类）针对从 XML 文档中提取元数据进行了优化。此外，文档数据库通常也针对复杂的随机文本搜索（例如，`elasticsearch`）进行了优化。\n\
  \n使用面向文档的数据库，您可以灵活地使每个数据实例彼此不同，这为可选值以及更新提供了宝贵的支持。这就是为什么它们在 Web 应用程序中如此受欢迎的原因——这些应用程序经常更改，可能包含半结构化数据，并且还需要快速部署。接下来，让我通过一个示例讨论什么是文档。请看以下文本：\n\
  \n```\n蓝色条纹衬衫\nIL（美国）\n```\n\n尽管您可能清楚此文档包含服装商品的详细信息，但其他各个字段代表什么并不清楚。如果将此信息存储在键值存储中，语义内容（表示\
  \ Web 零售商的此库存商品）可能会丢失，并且数据库将无法有效地优化或索引这些数据。也许可以运用额外的逻辑将字符串分隔成字段并将字段分配给表中的列，但这并非易事。\n\
  \n如果没有元数据，解析像这样的自由格式数据可能会很复杂。现在考虑用伪 XML 标记的同一文档：\n\n```\n<Item>\n  <ItemName>蓝色条纹衬衫</ItemName>\n\
  \  <ItemType>男士衬衫</ItemType>\n  <ItemSize>大号</ItemType>\n  <ItemNumber>226453</ItemNumber>\n\
  \  <Quantity>20</Quantity>\n  <WarehouseNum>12345</WarehouseNum>\n  <State>IL</State>\n\
  \  <Country>US</Country>\n</Item>\n```\n\n所以现在，文档既包含数据也包含元数据，并且元数据解释了每个字段。这样，就可以查询数据，例如“查找位于'IL'州的所有\
  \ `<Item>`”，或者为了性能而在`state`字段上设计索引。您可以像任何其他数据库一样组合搜索条件，但主要区别在于将元数据嵌入文档本身，这消除了预定义数据库字段的需要。它还提供了添加或删除某些字段的灵活性，因此数据库中的每个文档都可以有不同的格式。一个`<Item>`可能包含`<Size>`，而另一个可能只有`<Style>`。这并不会使之前查找伊利诺伊州商品的查询失效。\n\
  \n嵌入的元数据还允许更改文档格式而不影响现有文档。假设向新文档添加了一个新的`<ItemPicture>`字段。这不会影响任何现有文档——它们只是没有关联的图片。此外，通常，任何基于不属于某个文档的字段的查询都不会检索到它们。\n\
  \n文档的流行格式包括 XML、YAML、JSON 和 BSON。一些文档不包含明确定义的元数据（例如，PDF），而管理它们的数据库可能提供使用索引映射数据的方法，或者包含基于\
  \ XML 的预定义格式，如 MathML、JATS 或 DocBook。在某些情况下，使用模式语言如 DTD、XSD 或 Relax NG 将文档映射为更可用的格式。JSON\
  \ 是许多面向文档的数据库最流行的格式（主要用于交互式基于 Web 的应用程序）。\n\n文档可以使用唯一的键进行引用存储，并可以使用该键进行检索。键可以是字符串、URI\
  \ 或路径。在键字段上创建索引有助于加快文档检索。可以创建更多索引以加快频繁搜索。大多数流行的面向文档的数据库都提供工具来提取和索引它们所管理的文档的几乎所有元数据以及数据内容。查询语言的支持进一步支持了查询，使用户更容易使用。\n\
  \n面向文档的数据库可用于包含以下内容的数据：\n\n- 多种数据类型，可能有多种访问模式\n- 需要构建 CRUD（创建、读取、更新、删除）应用程序\n- 类似于\
  \ JSON、HTTP、REST、JavaScript 的数据类型，并与基于 Web 的应用程序一起使用\n- 涉及大量小型（且可能易变的）连续读写操作的处理\n\
  - 不断变化的数据类型或需要灵活的列数（由于可选数据）\n- 大型媒体（BLOB 类型）或半结构化数据\n\n适用于文档数据库的应用程序包括事件日志记录、电子商务应用程序和内容管理应用程序。流行的面向文档的数据库系统有\
  \ MongoDB、CouchDB 和 OrientDB。\n\n## 列式数据库\n\n*列式*数据库按列而不是按行组织其数据。这重新定位了数据的焦点，有助于更有效地从硬盘存储读写数据，从而加快对数据集执行的查询速度。一个*数据列*由名称和值（有时还有时间戳）组成。每一行可以有不同数量的列。行键可用于查询，也可以使用（在列值上创建的）二级索引。\n\
  \n对于列式数据库，列值在物理上被分组在一起，而不是行。由于数据是按记录顺序存储的，因此列 1 的第 5 个条目和列 2 的第 5 个条目是同一记录的一部分。这使得作为一组按列访问单个数据元素（例如以下产品详细信息）成为可能，而不是逐行访问。\n\
  \n以下是产品表示例：\n\n```\nID 产品名称        类别    数量  价格\n1  绿茶包           茶      100  3.99\n\
  2  红茶包           茶      100  2.99\n3  姜茶包           茶      100  4.99\n```\n\n对于面向行的数据库，数据将存储为：`1,绿茶包,茶,100,3.99;2,红茶包,茶,100,2.99;3,姜茶包,茶,100,4.99;`\
  \ 对于面向列的数据库，数据将存储为：`1,2,3; 绿茶包,红茶包,姜茶包;茶,茶,茶;100,100,100;3.99, 2.99,4.99;` 但是为什么要按列组织数据呢？一个原因是它提供的存储压缩。因此，列操作（例如\
  \ `MIN`、`MAX`、`SUM`、`COUNT` 和 `AVG`）可以非常快速地执行。此外，由于列式数据库是自索引的，与关系数据库管理系统相比，它可以更有效地存储数据（就磁盘空间而言）。而且，列式数据库提供的数据压缩是一个很大的优势。这些特性的好处在大数据量下可见，此时数据访问性能至关重要。否则，对于较小的数据量，提供内存分析功能的数据库可以轻松地使面向行与面向列数据库的相对优势变得有些无关紧要，因为它们速度很快——尽管列式数据库提供的数据压缩仍然有用，因为内存很昂贵，而压缩可以帮助您使用更小的\
  \ RAM 容纳数据集。\n\n什么样的应用程序可以使用列式数据库？如前所述，需要大数据量才能看到性能差异。此外，列式数据库非常适合于聚合在少数列中的大量数据。列式数据库不支持\
  \ ACID 事务，在可以容忍“最终一致性”的情况下更有用。\n\n关于列式数据库的另一件要记住的事情是，它们在写入更频繁的应用程序中与在查询中一样表现良好。此外，这些数据库在应用程序需要一次只访问少数列（涉及大量行）时表现良好。列式数据库可以通过帮助您专注于必要的列而无需读取数千行来加快分析查询。\n\
  \n最后，列式数据库还可以用于依赖于时间的列（或具有过期时间的数据），因为可以设置在特定日期后自动使列过期。\n\n虽然列存储的概念之前已作为关系数据库的一部分实现，但\
  \ RDBMS 不提供跨列族行不同的列的灵活性，而 NoSQL 列式数据库允许这样做（每行可以有不同数量的列）。\n\n众所周知，列式数据库源自 Google\
  \ 的 Big Table。流行的分布式横向扩展列式数据库包括 HBase 和 Cassandra。\n\n总结一下，如果您的数据满足以下条件，可以使用分布式横向扩展列式数据库：\n\
  \n- 需要高可用性和冗余\n- 需要跨越不同地理位置的数据中心，并且您需要一个能够处理长延迟的分布式、分区容忍的选项\n- 有不需要任何一致性保证的连续数据流\n\
  - 具有不断变化的数据类型和动态字段\n- 有可能达到真正的大数据量，例如数百 TB，并且需要对少数列进行聚合\n\n通常，以下类型的应用程序可以从这种大数据处理能力中受益：\n\
  \n- 数据分析（用户行为、网络流量、日志文件）\n- 生物信息学（遗传和蛋白质组数据）\n- 股票市场分析（交易数据）\n- 网络规模应用程序（搜索引擎）\n\
  - 社交网络服务\n\n## 图数据库\n\n图数据库起源于瑞士数学家莱昂纳德·保罗·欧拉提出的图论。图数据库的主要组成部分是*节点*和*边*（或*关系*）。节点和关系都可以具有与之关联的属性。此外，节点还可以用零个或多个标签进行标记。节点表示您可能想要监控（或查询）的实体，关系是节点之间存在的关系。属性（或特征）提供关于节点或关系的信息。\n\
  \n例如，如果“Practical Hadoop Security”是一个节点，则可以根据“Practical Hadoop Security”的哪些方面与特定数据库相关，将其与“书籍”、“安全参考资料”或“220\
  \ 页”等属性关联起来。\n\n对于大数据集上的复杂查询，图数据库通常比关系数据库更快，因为它们不需要昂贵的连接操作。由于它们不依赖于静态模式，因此对于频繁变化的数据以及不断演进的模式，它们表现更好。然而，对于具有大量数据元素的静态模式，它们（比关系数据库）表现不佳。当然，图数据库最适合于类似图的查询（例如计算两个节点之间的最短路径或计算图的直径）。\n\
  \n对于涉及各种节点（或实体）之间复杂相互关系（例如，涉及连接城市的多条高速公路、蛋白质与蛋白质之间的相互作用、员工与员工协作的查询）的场景，图数据库效果最好。这就是为什么图数据库非常适合以下类型的问题领域：\n\
  \n- 网络和 IT 基础设施管理\n- 身份和访问管理\n- 业务流程管理\n- 产品和服务推荐\n- 社交网络\n\n关于图数据库需要记住的一件重要事情是，它们不擅长处理大量数据，因此对于涉及大规模图的应用程序（例如社交网络），通常使用列式（或其他合适的）数据库进行存储和检索，而图操作则作为一个增加性能的顶层处理层工作（例如，Titan\
  \ 图数据库）。\n\n我将以 LinkedIn 的架构为例。LinkedIn 混合使用 Oracle、Voldemort、Espresso、Pinot 和 XML\
  \ 进行数据存储。数据库被水平和垂直分区（为了性能）。由于分区，无法实现引用完整性或跨域 JOIN。此外，使用了最终一致性模型，因此不能保证数据一致。Voldemort\
  \ 和 Pinot 是键值存储。Espresso 是 LinkedIn 的在线分布式容错 NoSQL 数据库，被超过 30 个 LinkedIn 应用程序使用，包括会员档案、InMail（会员对会员消息系统）、主页部分内容、移动应用程序等。Oracle\
  \ 因其成本而被谨慎使用。\n\nVoldemort 是一个简单的键查找系统，用于快速查找小块数据（例如用户资料、*您可能感兴趣的工作*、*您可能认识的人*等数据）。Pinot\
  \ 用于更大规模的键值查找，例如历史数据（*给我一月至三月所有的大数据工作*），并且可扩展以存储大量数据。\n\nCloud 是一个服务器，它将整个 LinkedIn\
  \ 网络图缓存在内存中（LinkedIn 为此目的开发了一个专有的图数据库，它几乎位于每个操作的中心）。每个 Cloud 实例支持 2200 万个节点和 1.2\
  \ 亿条边，需要 12 GB RAM。到 2008 年，生产环境中已有 40 个 Cloud 实例（我不确定现在有多少个）。Cloud 实例使用更新后的数据实时更新，并在关闭时持久化到磁盘。将所有内容放在\
  \ RAM 中是一个限制，但由于对图进行分区很困难，没有其他选择。\n\n尽管 Cloud 缓存了整个 LinkedIn 网络，但每个用户只需要查看与他相关的信息，并且由于计算这些单个用户视图代价高昂，LinkedIn\
  \ 仅在用户连接时进行计算并保持缓存。此缓存的网络视图在会话期间不会更新，除非用户自己添加/删除链接（此外，如果用户的任何联系人进行了更改，也不会更新）。\n\n\
  对于搜索，使用了 Lucene 搜索引擎的定制版本，并且由于搜索的是缓存数据，结果返回非常快。Kafka 和 Databus 用于数据复制，而 Zoie（使用\
  \ Lucene 的实时搜索和索引引擎）、Bobo（用于 Lucene 的分面搜索库，*分面*是用户的属性，如行业、前公司、专利等）和 SenseiDB（实时、分面、键值和全文搜索引擎）用于在线搜索。\n\
  \n图 6-1 展示了截至 2012 年的 LinkedIn 架构。此后可能有所更改，但将其视为一个示例，说明如何将图数据库用于分析，同时将其他 NoSQL 数据库用于存储。\n\
  \n```\n只读                                              内存图\n                   \
  \                                 云\n                                          \
  \        数据库\n                                                     |\n         \
  \   副本                       LinkedIn       |\n            ---------           \
  \      更新           |\n            Web 应用程序用于连接           |           |\n      \
  \                                      |           |\n                         \
  \           复制服务器\n                                            |\n            Zoie\
  \ + Bobo + SenseiDB   资料更新\n            (搜索引擎)              更新\n               \
  \                             |\n            Web 应用程序用于           Databus / Kafka\n\
  \            招聘人员                 通信\n                                         \
  \   |\n            读                        数据库\n            |                 \
  \         服务\n            |                           |\n            |         \
  \                  | 写\n            |                           |\n            |\
  \                      资料更新\n            |                           |\n       \
  \     |                           v\n            |                   用户资料数据库（公共）应用\n\
  \            |                           |\n            |                      \
  \     | 只读\n            v                           v\n      读                 \
  \          主数据库\n      ---                          写\n                        \
  \            Oracle / Voldemort / Espresso\n```\n\n***图 6-1.** LinkedIn 架构*\n\n\
  流行的图数据库有 Neo4j、AllegroGraph 和 InfoGrid。我将通过一个使用 Neo4j 数据库的快速示例来演示图数据库的主要概念。\n\n\
  图数据建模是一个用户通过节点和关系的连接图来表示特定领域的过程。然后使用这个图来回答以 Cypher（Neo4j 查询语言）查询形式提出的问题。让我先描述一下我的示例领域。\n\
  \n### 领域描述\n\n考虑以下关于两个人 James 和 Scott 之间联系的描述。他们为同一家公司工作。James 和 Scott 都在 Amazon.com\
  \ 购买了一套烛台。\n\n我们可以使用此语句来识别组件节点、标签和关系，并构建我们的模型。\n\n### 节点\n\n节点是主要组件，可以具有属性、关系（与其他节点）和标签。通常，节点是具有唯一概念身份标识的实体。\n\
  \n在这种情况下，需要定义以下节点：\n\n- James\n- Scott\n- 一套烛台\n\n### 标签\n\n接下来，让我们决定是否需要为您的节点分配任何标签。*标签*用于将节点分组到集合中，并且是可选的。如果定义了标签，数据库查询可以使用标签而不是单个节点，这使得编写紧凑且更高效的查询更容易。\n\
  \n对于此示例，让我们定义两个标签：\n\n- Person（应用于节点 James 和 Scott）\n- Object（应用于节点 烛台套件）\n\n###\
  \ 关系\n\n在这些节点之间可以识别出以下交互：\n\n- James 是 Scott 的同事\n- Scott 是 James 的同事\n- James 买了一套烛台\n\
  - Scott 买了一套烛台\n\n接下来，我将连接这些节点以展示它们的交互并完成图数据模型。标记为 *Person* 的节点可以通过 *同事* 关系连接。标记为\
  \ *Object* 的节点可以使用 *已购买* 关系与标记为 *Person* 的节点连接，如图 6-2 所示。\n\n```\n             \
  \  同事\nScott <------------------------> James\n   |                            \
  \   |\n   |                               |\n   |                              \
  \ |\n   |                               |\n   | 已购买                   已购买 |\n  \
  \ |                               |\n   v                               v\n    \
  \     一套烛台\n```\n\n***图 6-2.** 基于 Neo4j 示例的图数据模型*\n\n### 创建属性\n\n节点本身不提供任何有用信息，也无法回答可能提出的问题。属性取决于节点可能需要的信息。例如：\n\
  \n- James 和 Scott 何时成为同事的？\n- 这套烛台的价格是多少？\n- James 和 Scott 从哪里购买了这套烛台？\n- James\
  \ 多大了？\n\n添加以下属性有助于回答这些问题（请注意，属性以键值对形式添加），如图 6-3 所示。\n\n```\n               同事\n\
  Scott <------------------------> James\n自: 2003-12-25                  自: 2003-12-25\n\
  姓名: Scott                     姓名: James\n年龄: 53                         年龄: 37\n\
  \   |                               |\n   |                               |\n  \
  \ | 购买日期: 2015-02-19         购买日期: 2015-01-31 |\n   |                          \
  \     |\n   v                               v\n         一套烛台\n         对象名称: 一套烛台\n\
  \         价格: $50\n         卖家: Amazon.com\n```\n\n***图 6-3.** 基于 Neo4j 示例的图数据模型（含属性）*\n\
  \n让我们使用 Neo4j 查询语言 Cypher 将属性数据添加到数据库：\n\n```\n// 创建实体或节点\nCREATE (James:Person\
  \ { name: \"James\", age: 37 })\nCREATE (Scott:Person { name: \"Scott\", age: 53\
  \ })\nCREATE (sch:Object { Object_name: \"一套烛台\", price: \"$50\" })\n\n// 创建关系\n\
  CREATE (Scott)-[:COLLEAGUE_OF { since: 1072339200 }]->(James)\nCREATE (James)-[:HAS_BOUGHT\
  \ { on: 1418976000 }]->(sch)\nCREATE (Scott)-[:HAS_BOUGHT { on: 1420272000 }]->(sch)\n\
  ```\n\n请注意，使用的日期（1072339200、1418976000 和 1420272000）是纪元时间（*纪元时间*是自 1970 年 1 月 1\
  \ 日以来经过的秒数，不计算闰秒）。因此，如果将 *2003-12-25 08:00* 转换为纪元时间，您将得到 1072339200。\n\n最后，这是一个示例查询，回答“一套烛台的价格是多少？”：\n\
  \n```\nMATCH (sch:Object { object_name: \"一套烛台\" })\nRETURN sch.price as price\n\
  ```\n\n总结一下，当数据满足以下条件时，可以使用图数据库：\n\n- 具有复杂的关系，如社交网络数据\n- 需要动态构建实体之间的关系，这些实体可能具有动态或变化的属性\n\
  - 所涉及的查询可能需要复杂或嵌套的连接\n- 属于位置服务或推荐引擎\n\n至此，我完成了关于如何根据您的数据处理需求选择合适的 NoSQL 数据库解决方案的讨论。接下来，我将讨论为了使您的应用程序适应\
  \ NoSQL 使用而需要对数据进行的更改。\n\n### NoSQL 的并发性与安全性\n\n对于 NoSQL 环境，并发性和安全性的概念（与 RDBMS 相比）有所不同。大多数\
  \ NoSQL 数据库不存在实现并发的机制（如锁定或事务隔离级别）。安全性需要使用第三方解决方案来实现，并且不与数据库集成。因此，RDBMS 默认可用的这些特性需要针对某些\
  \ NoSQL 环境进行模拟。这是 NoSQL 提供更好性能所付出的权衡之一。我现在将详细讨论这些概念。\n\n### 并发性\n\n当用户在 RDBMS 数据库中更新表中的数据时，其他用户无法修改相同的数据，因为它已被锁定（通过*排他写锁*）。在锁定数据以进行更新之前，RDBMS\
  \ 会等待获得数据集的排他控制权，同时用户使用*共享读锁*读取数据。一旦没有共享锁，数据集将使用*排他写锁*进行锁定。并发性通过数据库锁定得到了有效处理。RDBMS\
  \ 支持 ACID（原子性、一致性、隔离性和持久性）事务，这提供了数据的可靠性。\n\nNoSQL 数据库不支持事务的 ACID 合规性，但有替代策略。*乐观并发控制*就是其中之一。OCC\
  \ 假设多个事务可以在不相互干扰的情况下完成。因此，允许事务使用数据资源而不获取锁。但是，每个事务都会验证其使用（读取或写入）的数据未被任何其他事务修改。如果存在冲突的修改，则提交的事务将回滚。OCC\
  \ 只能用于数据争用较低的环境，否则重启事务的开销将抵消通过避免锁定所获得的性能优势和高吞吐量。\n\n通常情况下，由于大多数 NoSQL 数据库遵循“单次写入，多次读取”的理念（尤其是开源数据库）。它们不期望并发更新，因此未设计为支持它们。默认情况下，大多数分布式数据系统支持*最终一致性*。任何具有处理读取请求的多个节点的系统，在处理读取请求时，如果要提供良好的性能（因为验证会涉及额外时间），则无法联系其他节点（以验证所提供的数据）。因此，提供的数据可能不是最新的；您最多只能期望节点同步并最终达到一致。这个概念也称为\
  \ BASE（基本可用）。\n\n现在，如果您的应用程序需要某种程度的并发控制（也许不像 ACID 合规性那么严格），您该怎么办？以下是在 NoSQL 环境中实现并发性的一些其他方法：\n\
  \n- 您可以使用 ZooKeeper。ZooKeeper 的工作方式是通过使用法定人数实现分布式锁定。\n- 您可以使用经过良好测试的分布式共识算法之一——例如，Paxos\
  \ 结合 MVCC（多版本并发控制）。\n- 如您所见，在符合 ACID 的数据库环境中锁定会导致读取（SELECT）和写入（UPDATE）彼此等待（完成）。这种情况通过使用\
  \ MVCC 来解决。一个*版本*是数据在某个时间点的快照。查询表时，读取者可以访问数据的当前版本，而更新可以同时（并行）发生。因此，稍后时间点的同一查询可能会使用更新的版本并产生不同的结果。\n\
  - 您可以使用 CAP 模型，该模型指出任何网络化共享数据系统只能拥有三个理想属性中的两个：一致性（C），意味着您获得数据的单个最新副本；高可用性（A）的数据（用于更新）；以及对网络分区（P）的容忍度。\n\
  - 尽管在设计者仍然需要在存在分区时在一致性和可用性之间做出选择，但随着当代网络系统的出现，处理分区以及从中恢复有了很大的灵活性。因此，修改后的 CAP 目标可以是最大化特定应用程序所需的一致性和可用性的组合。当然，这需要伴随着分区期间的连续性计划以及后续的恢复计划，从而克服\
  \ CAP 的感知局限性。\n\n### 安全性\n\n安全性是您甚至不会认为它是一个特性的另一个 RDBMS 功能。在开源 NoSQL 世界中，没有广泛集成的安全实现。没有内置的身份验证或授权。也没有内置的加密或掩码。所有这些功能都需要通过单独的应用程序或\
  \ API 实现，并且您需要确保这些应用程序或 API 得到良好集成。一些商业可用的 NoSQL 解决方案（例如，10Gen 的 MongoDB 或 Datastax\
  \ 的 Cassandra）在其产品中包含了身份验证、掩码和加密功能，但它们仍然缺乏有效的授权或细粒度安全性手段。此外，并非所有商业 NoSQL 产品都提供这些功能。\n\
  \n回到开源产品，Kerberos 被广泛用于大量开源 NoSQL 解决方案的身份验证。Kerberos 由麻省理工学院开发，是一个易于获得的开源应用程序，可与多种\
  \ Linux 发行版以及 HDFS 配合使用。它也能很好地与 HBase、Hive、Pig 等 Apache 应用程序配合使用。大多数主要的 Hadoop 供应商发行版都与\
  \ Kerberos 配合使用，这就是为什么现在有些发行版包含了 Kerberos。由于 Kerberos 已经存在很长时间，因此有大量关于安装、配置、可能的问题以及解决方案的文档。\n\
  \n授权可以使用 HDFS ACL 或 Apache Sentry（如果您使用 Hive）来执行。此外，现在有像 Apache Knox 或 Apache Ranger\
  \ 这样的组件可以提供全面的安全解决方案。您可以使用 Ranger（或 Knox）为各种 Apache 组件（如 HDFS、Hive 或 Hbase）创建访问策略（针对用户或组），这些策略提供细粒度（表级别）的权限。Knox\
  \ 还提供 LDAP 集成，使得将 Hadoop 的安全性与您的企业安全性集成变得容易。\n\n最后，大多数 Hadoop 供应商（以及一些 NoSQL 数据库）提供自己的定制授权工具。\n\
  \n数据加密在传输中以及*静态*（数据存储在物理磁盘驱动器上时）都可用，使用 Apache 基金会开发的加密和压缩 API。此外，还有像 eCryptfs 这样的开源加密文件系统，可以成功地与\
  \ Hadoop 和 NoSQL 解决方案一起使用。此外，大多数主要的 Hadoop 供应商都提供与第三方加密工具的接口。\n\n最后，有像 Ganglia 和\
  \ Nagios 这样优秀的开源监控工具可用于监控系统资源和对 NoSQL 数据库的未授权访问。\n\n总之，实施身份验证、授权、加密和监控工具的组合策略为 NoSQL\
  \ 数据库提供了一个强大的安全选项。开源数据库主要使用开源工具，而商业可用的 NoSQL 数据库使用它们自己的定制工具来实现组合安全策略。\n\n### 设计过渡模型\n\
  \n上一节讨论了选择合适的 NoSQL 数据库的标准。下一步，需要将关系数据库中的数据转换为 NoSQL 使用。这涉及反规范化，在某些情况下，在反规范化之前还需要转换为星型模式。无论哪种情况，都需要确保最终结果没有连接、没有关系，并且表数量很少。\n\
  \n另外，请注意，数据迁移的过程将取决于您选择的 NoSQL 技术。例如，将 RDBMS 数据迁移到列式数据库的过程将不同于迁移到键值存储（如 Riak）或文档存储（如\
  \ MongoDB）的过程。我接下来将详细讨论这些过程。\n\n### 关系型（OLTP）数据的反规范化\n\n考虑这样一种场景：需要将 OLTP（在线事务处理）关系数据迁移到\
  \ NoSQL 环境以获得更好的性能。根据数据和应用程序，决定目标 NoSQL 环境为 Cassandra（一个列式数据库）。图 6-4 显示了保存数据的关系数据库的逻辑数据模型。\n\
  \n***图 6-4.** 索赔处理系统的逻辑数据模型（关系设计）*\n\n这与第 3 章详细讨论的索赔处理应用程序相同。图 6-4 再次显示它以方便快速参考。为简洁起见，我将仅对其进行部分转换。\n\
  \n由于 NoSQL 数据库侧重于查询和更常用的数据集，假设 YourState 保险公司（使用此索赔处理系统）遇到一个大问题，即未经授权的人员提交的欺诈性索赔比例增加，并决定实施新的索赔提交程序。该程序涉及一些额外的处理，减缓了索赔提交流程，导致拥有合法索赔请求的真实保单持有人投诉。\n\
  \nYourState 保险公司的 CIO 要求其首席架构师提出解决方案，后者决定利用大数据和 NoSQL 的力量。他分析情况（以及性能缓慢的原因）如下：\n\n\
  - 保单持有人验证涉及连接 `policy_owner`（300 万保单持有人）及其保单（约 400 万行）\n- 检查保单持有人的索赔涉及与 `claim`\
  \ 表的连接（过去 2 年约 2000 万索赔）\n- 获取索赔详细信息涉及与其他索赔相关表的连接，进一步减慢了信息检索速度\n\nCIO 感谢了首席架构师，并请他提出补救计划。以下是首席架构师建议的补救计划：\n\
  \n- 反规范化并将 `Policy_owner`、`Policy_type` 和 `Policy` 表组合到一个临时表\n- 根据需要反规范化并将 `Claim`\
  \ 表与适当的索赔相关表（例如 `Claim_property`、`Claim_type`、`Claim_line_item` 等）组合，以尽可能消除连接，并将结果输出到临时表\n\
  - 将数据从临时表导出到列式数据库和文档数据库，并测试性能\n\n作为第一步，`Policy`、`Policy_type` 和 `Policy_owner` 表被反规范化，如图\
  \ 6-5 所示。\n\n***图 6-5.** 保单数据的反规范化*\n\n这里的目标是减少连接的数量，因为在高数据量下，对保单（和所有者）信息检索的性能有很大影响。此外，像\
  \ `Policy_type` 这样的小表可以很容易地合并以减少影响。\n\n另外，请注意，需要为列 `PolicyOwnerSSNFEIN`、`PolicyOwnerName`\
  \ 和 `PolicyOwnerPhoneNumber` 添加二级索引，因为大多数打电话的客户（用于提交索赔或其他索赔相关服务）将使用这些标识符之一来查找他们的信息。我将在实现最终模型时讨论添加二级索引。\n\
  \n作为下一步，我将反规范化索赔相关数据以消除连接并提供检索速度，如图 6-6 所示。\n\n***图 6-6.** 索赔数据的反规范化*\n\n对于索赔数据，反规范化与保单相比略有不同。此外，正如您所见，我在最终计数中保留了三个表。原因在于预期的处理方式。\n\
  \n对于索赔，客户访问数据的主要目的是获取索赔详细信息、索赔状态或提交新索赔。在大多数这些情况下，不需要索赔财产信息或索赔重新提交信息（除非客户打电话重新提交索赔或需要重新提交状态），因为对于\
  \ YourState 来说，重新提交的索赔百分比仅为 12%，并且客户查询很少需要索赔财产。\n\n因此，我决定将这些实体（`claim_resubmission`\
  \ 和 `claim`）与 `claim_line_item` 实体分开，后者保存索赔的详细信息和最新状态。在这种情况下，合并所有实体只会增加记录长度（从而增加访问时间），并且由于财产或重新提交列不经常访问，因此不会提供很好的价值。\n\
  \n此外，在这种情况下，将需要对列 `PolicyId`、`ClaimSubmissionDate`、`ClaimStatus`（针对表 `Claim` 和 `Claim_line_item`）以及列\
  \ `ClaimResubmissionDate` 和 `ReviewerEmployeeId`（针对表 `ClaimResubmission`）建立二级索引。\n\
  \n请注意，我仅演示了此应用程序的反规范化概念，如果您需要将数据迁移到 NoSQL 环境，总工作量（或所需的反规范化）可能会更大。此外，此应用程序是 OLTP，而基于\
  \ OLAP 的数据（或星型模式）的技术略有不同。\n\n### 关系型（OLAP）数据的反规范化\n\n对于 OLAP 应用程序，由于大部分反规范化工作已经在设计星型模式时完成，您只需将维度数据添加到事实表中，以消除您最感兴趣的查询中的连接。您也可能只想对记录数较多的窄维度执行此操作。原因是如果维度很宽，则会使记录长度变得非常大。此外，您可能希望删除不感兴趣的事实（以减少记录长度）。我将通过一个快速示例来讨论这种方法。\n\
  \n图 6-7 是一个通用销售分析系统的星型模式。`Sales_facts` 是一个事实表，您可以看到诸如 `Customer`、`Location`、`Date`、`Product`\
  \ 和 `Sales_Reps` 之类的维度。\n\n***图 6-7.** 销售分析星型模式示例*\n\n事实表 `Sales_facts` 只有两个事实——总销售额和销售商品数量。这家公司今年销售业绩出色，销售事实表有\
  \ 1 亿条记录。有 50 万客户促成了这些销售，以及 1000 名销售代表、300 个地点和 70 万种产品。这个销售量为侧重于按特定类型客户按地点购买产品的分析带来了问题，因为由此产生的连接（1\
  \ 亿 × 50 万 × 300）非常庞大。每次有涉及这些维度的分析查询时，都需要很长时间才能返回结果。\n\n因此，决定检查 NoSQL 解决方案是否比基于\
  \ RDBMS 的 ROLAP 解决方案表现更好。数据架构师针对所需的具体分析类型对模式进行了反规范化，并设计了模式的非规范化版本，如图 6-8 所示。\n\n\
  ***图 6-8.** 销售分析星型模式——反规范化*\n\n第一步是将维度表的相关部分与事实数据结合起来（以避免连接）。根据性能需求，可以很容易地得出结论，来自维度\
  \ `Customer`、`Location` 和 `Product` 的列需要添加到事实表中。因此，您可以从数据集中移除维度 `Sales_Reps`，因为它与此需求无关。接下来，您可以评估所考虑维度中的列，由于列\
  \ `ProductId`、`ProductSerialNum`、`LocationId`（来自 `Product` 维度）、`CustomerId`、`LocationId`\
  \ 和 `CustomerSince`（来自 `Customer` 维度）与此数据集无关，它们也可以被移除。\n\n`Date` 维度没有合并有两个原因。首先，它很小，只有\
  \ 730 行（两年）。其次，只有少数查询可能会用到它，因为此数据集的分析重点不是时间。\n\n最后，只有两个度量或事实，并且由于两者都与数据集相关，因此不需要移除任何一个。将需要二级索引来提升性能，可以为列\
  \ `CustomerName`、`ProductName`、`IndustryType`、`CustomerType`、`State`、`City` 等创建索引。\n\
  \n总之，最终的反规范化模型（针对 OLTP 和 OLAP）构成了针对 NoSQL 目标重构的过渡模型。我之所以称它们为*过渡*模型，是因为它们将根据计划使用的目标\
  \ NoSQL 解决方案而变化。\n\n下一节将讨论使用列式数据库和文档数据库作为目标来实现这些过渡模型。\n\n### 实现最终模型\n\n我从将关系应用程序重构为\
  \ NoSQL 环境的设计原则开始。首先，我讨论了如何根据您的数据类型和目标应用程序选择 NoSQL 技术。然后，我讨论了 NoSQL 环境中并发性和安全性的实现。之后，我介绍了为关系数据设计过渡模型。作为最后一步，我将讨论实现这些过渡模型以针对您选择的\
  \ NoSQL 数据库。\n\n广义上讲，重构过程涉及四个步骤：\n\n1.  评估并选择最适合您数据/应用程序需求的 NoSQL 技术类型。尝试在一个小项目中使用所选技术，并验证功能/易用性。\n\
  2.  反规范化关系数据，并使用您选择的 NoSQL 技术（按需选用文档、键值、列或图）表示生成的模型。\n3.  设计/开发 ETL（提取、转换、加载）逻辑，使用您选择的工具将数据从关系数据库迁移到\
  \ NoSQL 环境。\n4.  重新设计应用程序查询，以从您的 NoSQL 数据库读取数据。\n\n我将讨论如何使用列式 NoSQL 数据库作为目标以及过渡模型作为基础来实现最终模型。\n\
  \n\n\n"
