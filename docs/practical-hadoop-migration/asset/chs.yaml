  #### Presto


  `Presto` 是由 `Facebook` 开发并开源给 `Apache` 社区使用的分布式 `SQL` 查询引擎。它针对交互式查询（包括复杂的分析查询）进行了优化。您可以使用标准的
  `ANSI SQL` 语法，包括聚合、连接和窗口函数。




  `Presto`不使用 MapReduce 作为底层执行模型。例如，Hive 将查询转换为一系列按预定顺序单独执行的 MapReduce 任务。每个任务从磁盘读取数据，并将中间输出结果写回磁盘。相比之下，`Presto`引擎使用支持
  SQL 语义的自定义查询和执行引擎。由于所有处理都在内存中进行，并且各阶段之间通过网络进行流水线式传输，因此避免了不必要的 I/O（以及相关的延迟）。这种流水线执行模型并行运行各个阶段，并在一阶段数据可用时立即将其传递给下一阶段。这有助于减少多种查询类型的延迟。


  图 5-3 展示了 `Presto` 的系统架构。客户端发起查询并将 SQL 发送至 `Presto 协调器`进程。协调器负责对输入的查询进行解析、分析和规划执行。调度器负责协调执行流水线，根据节点的网络邻近度（优先选用离数据最近的节点）分配工作，并监控进度。


