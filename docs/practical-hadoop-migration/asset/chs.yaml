- '# 理解关系数据库设计原则


  ## 混合设计方法


  回顾一下你最近参与的项目计划（以及设计任务细节），你会发现很难判断出具体采用了哪种设计方法。即使和数据架构师或企业架构师讨论后，你也会清楚地意识到，并没有使用单一的设计方法。相反，采用了一种混合设计方法，很可能是自上而下和自下而上的结合。


  大型软件项目通常从特定的高层业务需求和目标开始，然后按照自上而下的方法进行模块设计。然而，这种策略很快就会瓦解，因为模块负责人希望在规定时间内完成自己的任务，因此倾向于复用现有代码，有时甚至复用现有模块。这就将自下而上的方法混入了其中。在某些情况下，现有操作系统的功能会被扩展，以匹配正在设计的系统的目标。


  ### 自下而上设计方法


  使用自下而上的设计方法，初始重点放在构成更高级别模块基础的、最底层的模块级别或单个实体上。设计完这些实体后，将它们分组以形成下一级别的模块。这个过程一直持续到形成一个完整的、能够交付所需功能的分层或模块化系统。


  这就像大致了解机器应该做什么，然后非常详细地设计各个模块，这些模块提供所需功能的一部分。最后，你希望各个模块提供的组合功能与机器所需的功能相匹配，并且这些模块能够完美地相互对接。


  这种方法的一大优势是可复用性以及它可能节省的时间/金钱。当然，设计者需要具备必要的经验（或直觉）来决定模块的功能。


  ## 第 2 章 ■ 理解关系数据库设计原则


  我们来谈谈如何使用自下而上的方法实现上一节讨论的理赔归档示例。首先，你需要审查理赔处理的概念模型，并确定哪些实体需要归档。


  一旦确定了这一点，就需要设计归档实体。通过为它们添加`arch`前缀（以区别于常规理赔实体），你可以设计诸如`arch_claim_item`、`arch_claim_resubmission`、`arch_claim_settlement`等实体。你可以为所有引用或元数据实体（如`Claim_type`或`Claim_status_type`）设置有效性（开始/结束）。


  接下来是设计填充这些实体以及从关联理赔表`claim_item`、`claim_resubmission`和`claim_settlement`中移除归档记录所需的流程。之后，新的实体可以被添加到逻辑模型中，并最终作为分组`Archival`添加到概念模型中。


  现在，由于任何与理赔相关的查询或报告都需要同时读取常规和归档的理赔数据，因此需要修改报表系统，使其能够根据请求报表的日期从正确的对象中读取数据。这将是这个新系统的下一个模块。


  最后，由于大量数据从现有数据库对象中移除并添加到新对象中，必须执行数据库维护以确保数据库性能不受影响。这将是新系统的最后一个模块。因此，最终，理赔处理系统可以拥有一个名为`Archival`的新顶层模块。


  如果你仔细审视，就会发现我们设计了同一个系统，但执行步骤的顺序相反。这种设计方法类似于一种称为增量的软件过程模型，如图 2-4 所示。


  ```

  实现并

  测试第一个构建

  实现、集成并测试

  后续构建直至产品完成

  运行模式

  退役

  开发

  维护/增强

  ```

  **图 2-4.** *软件过程模型：增量模型*


  正如你从图 2-4 中所见，这个系统是使用连续的构建逐步构建的，直到完成所有开发（以提供必要的功能）。你也可以将这种方法视为一系列敏捷冲刺。


  #### SSADM


  在 20 世纪 70 年代，建立设计方法或框架的初步尝试仅仅是试图将手工系统自动化。它们只是模仿了逻辑业务流程，因此没有增加太多价值。这些半正式的设计方法包含冗余和重复的信息，缺乏方法的清晰性（没有明确定义的步骤），并且存在许多不一致之处。SSADM
  是第一次将设计策略形式化的尝试。它始于 1981 年，当前的 SSADM 版本是 1995 年发布的 V4.2。SSADM 在设计中使用了三种主要技术：


  - **逻辑数据建模：** 在此 LDM 阶段，识别并记录（正在设计的）系统的数据需求。接着，通过将数据分离为实体（业务流程生成并需要记录的特定信息）和关系（实体之间的关联）来设计模型。


  - **数据流建模：** 顾名思义，关注系统内的数据移动。更具体地说，数据流建模（DFM）描述了转换数据的过程或活动，同时考虑了所有的数据存储以及可能作为系统数据源或目标的外部实体。数据移动的方向对于
  DFM 也很重要。DFM 是对 Yourdon 和 DeMarco 先前模型的改编。


  - **实体行为建模：** 将早期的设计阶段联系起来，以交付一个完整的设计。LDM 将数据分离到实体中。DFM 记录了在系统内转换数据的过程。EBM 将单个实体与影响它们（及它们的数据）的事件或过程，以及这些事件或过程发生的顺序联系起来。


  ### 可行性研究


  项目或产品源于业务目标和需求。在对想法或目标进行初步讨论时，很少关注该目标的可行性或现实性。随后，当管理层要求产品团队实施时，他们必须确定该目标是否可实现（特别是对于潜在的大型项目/产品）。做出此判断需要考虑几个方面：


  - *技术* — 该产品或项目在技术上是否可行？

  - *资金* — 组织是否有必要的预算来执行该项目？

  - *兼容性* — 新产品是否能轻松地与组织内的现有系统对接？

  - *完整性* — 新产品是否会以任何方式损害组织的专业（或道德）完整性？


  此阶段的输出是一份可行性研究文档。根据 SSADM 指南，该文档还应包含所有已考虑的可行性研究方案的详细信息（包括被拒绝的方案以及拒绝原因）。


  ## 当前环境调查


  这涉及查阅现有的应用程序文档，探索当前应用程序，并与应用程序用户、开发人员和管理员进行讨论，以充分理解系统。这有助于以下方面：


  - 理解业务术语

  - 理解常用应用程序特性及其使用方法

  - 开发数据模型

  - 定义应用程序的范围


  此阶段的输出是（针对新系统或应用程序的）需求细节、现有服务和用户细节、逻辑和物理数据模型、数据流图以及数据字典（均为针对现有系统的）。


  ## 业务系统方案




  '
- '# 系统分析与设计方法


  在此阶段，分析师将（开发新系统的）需求与目标同现有系统的功能进行比较。可能只需对现有系统稍作修改即可匹配目标，也可能需要开发一个全新的系统来实现目标并满足需求。


  作为此阶段的输出，分析师会制定并提出若干可能的业务系统方案，以实现必要的目标。


  ### 需求规格说明


  这可以说是最重要也是最复杂的步骤。原因之一是分析师需要掌握拟建系统的所有逻辑规格细节。确保这些规格说明无错误、无歧义、一致且简明扼要，这一点当然至关重要。


  此步骤复杂的另一个原因在于，分析师需要构建逻辑数据模型（至少是实体关系图）以及数据流图（`DFD`），以确保逻辑规格的准确性，尽管这些并非此阶段的预期输出。


  本阶段的输出是一份全面的需求规格说明文档。


  ---


  '
- '# 第二章 ■ 理解 RDBMS 设计原则


  ## 技术系统方案


  在较早的阶段，分析师已掌握足够信息来提出可能的业务方案。现在有了现成的技术需求，分析师可以提出若干可用的技术系统方案。这些方案经过评估后，会选定最佳方案，然后进入下一阶段。


  #### 逻辑设计


  此设计阶段规定了与拟建应用相关的过程逻辑图，以及受这些过程影响的实体。同时还包括有关数据及其相互关系的信息。


  本阶段的输出包括：


  -   数据字典

  -   逻辑数据模型

  -   逻辑过程模型


  ### 物理设计


  `SSADM` 的最终阶段利用（上一阶段的）逻辑设计规格，将其转换为物理数据库结构（针对拟定的实施目标，例如 `Oracle` 或 `Microsoft SQL
  Server`）。这涉及：


  -   为列附加特定数据库的数据类型

  -   使用主键、外键或触发器（将在下一节讨论）以及可空性来实现参照完整性约束

  -   定义索引并指定函数细节（结构和实现）

  -   列出硬件和软件需求


  本阶段的输出是一个完整的物理设计，实施团队（包括管理员）可据此构建所需的系统。


  以上就是 `SSADM` 的阶段细节。我将讨论一个使用 `SSADM` 作为设计方法的示例（及完整设计）。与任何其他设计方法一样，使用 `SSADM` 也有其优缺点。


  ---


  '
- "# 第二章 ■ 理解 RDBMS 设计原则\n\n## SSADM 的优缺点\n\n`SSADM` 具有以下优点：\n\n-   系统和物理设计之间实现了极佳的隔离。其好处包括：\n\
  \    -   可以自由地使用你选择的数据库来实现逻辑设计。\n    -   将逻辑设计与物理设计之间的问题隔离开来。事实上，如果在物理实现后发现了逻辑设计的问题，你可以修改物理实现来解决这些问题。\n\
  -   拥有清晰定义且文档齐全的步骤，可引导出完整的设计。\n-   广泛的资源（分析师、业务用户、管理员、应用用户和开发者）参与其中，提供了良好的视角，这反映在设计之中，同时也降低了（理解或实施需求时）出错的可能性。\n\
  \n现在来看缺点：\n\n-   `SSADM` 的实施时间很长，任何变更都需要通过所有阶段进行处理。例如，如果在进行物理设计时需求发生变化，你需要从检查这些需求的可行性开始，检查它们是否已在现有系统中实现，更改需求规格，然后将变更应用到逻辑/物理数据模型。\n\
  -   培训资源使用 `SSADM` 并利用其进行实施需要相当高的成本和时间。\n\n作为结语，我希望你回顾一下瀑布软件过程模型，并思考它和 `SSADM` 之间的相似之处。与\
  \ `SSADM` 类似，瀑布模型也很全面，拥有大量的步骤。正如你在图 2-5 中所见，对需求或规格的变更会涉及对所有后续阶段进行返工，这可能非常耗时（尽管它确实有助于在系统内保持一致性——在任何阶段，需求规格都与现有的物理系统相匹配）。\n\
  \n---\n\n"
