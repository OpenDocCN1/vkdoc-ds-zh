  那么，在定义了问题之后，让我们来思考解决方案。你可能熟悉可用于关系型数据的众多设计方法和框架，但你知道 `Hadoop` 有类似的资源吗？很可能不知道。这有一个很好的理由——目前还没有。`Lambda`
  正在作为一种设计方法论被开发（[第 12 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_12)），但它尚未成熟，并且不太容易实现。


  那么，替代方案是什么？你是需要依赖数据架构师的专业知识来设计这个迁移过程，还是有通用的步骤可以遵循？你如何确保迁移过程高效且功能可靠？我在本书中回答了这些问题，并展示了如何成功地将你的关系型数据迁移到
  `Hadoop`。


  首先，理解 `Hadoop` 和 `NoSQL` 与关系型设计有何不同至关重要。我在本章中简要讨论了这一点，并讨论了使用 `Hadoop` 和 `NoSQL`
  的好处以及挑战。


  同样重要的是决定你的数据（以及你想用它做什么）是否适合使用 `Hadoop`。因此，数据类型、数据量以及你的业务需求等因素是需要考虑的重点。还有一些其他因素需要考虑，本章的后半部分将详细讨论。通常，四个“V”（容量、速度、多样性和真实性）将
  `NoSQL` 数据与关系型数据区分开来，但这个经验法则并非总是适用。


  那么，让我从关系型技术与 `Hadoop` 之间的概念差异开始讨论。这就是下一节的内容。


  ### 关系型数据库与 HDFS NoSQL 数据库之间的概念差异


  自 E.F. Codd 于 1970 年发表关于关系型设计的论文以来，数据库设计进行过几次改进。当今领先的关系型数据库系统（例如 `Oracle` 或 `Microsoft
  SQL Server`）可能并未完全遵循 Codd 的愿景；但无疑在基本没有大修改的情况下使用了其底层概念。存在一个中央数据库服务器，它保存数据并在身份验证后向用户（由数据库管理员定义）提供访问权限。存在数据库对象，例如视图（用于管理细粒度权限）、触发器（用于根据数据“关系”操作数据）或索引（用于在读取或修改数据时提高性能）。




