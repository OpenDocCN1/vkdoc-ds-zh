  \ Scientists / users\n                       users tag and link\n              \
  \         tag and link metadata\n                       data\n```\n\n***Figure 1-4.**\
  \ Data Lake*\n\n## Refactoring with Lambda Architecture\n\nRefactoring applications\
  \ for a `Hadoop`/`NoSQL` environment involves a complete redesign of the data layer\
  \ and query layer for `HDFS`/`NoSQL` storage and processing. Typically, `Hadoop`\
  \ is used for batch processing, meaning that refactoring for `Hadoop` can be problematic\
  \ for interactive applications that require ad-hoc queries. Especially if the functionality\
  \ requires low-latency data retrieval, `Hadoop`/`NoSQL` will not meet the needs.\n\
  \n`Nathan Marz` proposed an architectural solution to this problem, called the *Lambda\
  \ Architecture*. It suggests building a big data system as a series of layers, each\
  \ providing a specific function, with the next layer building upon the functionality\
  \ provided by the previous layer (as shown in Figure 1-5). This architectural solution\
  \ can be used to refactor applications for `Hadoop` or design new applications for\
  \ `Hadoop`/`NoSQL`.\n\n```\nUser queries\n    |\n    v\nSpeed layer (for real time\
  \ querying)\n    |\n    v\nServing layer (serving batch views)\n    |\n    v\nIndexed\
  \ batch views\n    |\n    v\nBatch layer\n    |\n    v\nComplete dataset\n```\n\n\
  ***Figure 1-5.** Layers of the Lambda Architecture*\n\nThe Lambda Architecture has\
  \ three layers. The **Batch Layer** is the first layer, which precomputes views\
  \ for querying. The **Serving Layer** is the second layer, which indexes and serves\
  \ the views created by the first layer. The **Speed Layer** is the third layer,\
  \ which provides real-time query capabilities in the Lambda Architecture.\n\n###\
  \ Batch Layer\n\nExecuting queries on massive datasets (the strength of `Hadoop`-based\
  \ systems) requires significant resources and can be very slow. Sometimes it may\
  \ even abort due to insufficient resources. A clever workaround is to precompute\
  \ the data and make it ready for querying. The precomputed data can be indexed to\
  \ speed up random reads (since `Hadoop` performs poorly in this aspect). This concept\
  \ is not too different from indexed materialized views in `RDBMS`. However, it is\
  \ new to the `Hadoop` world, and these precomputed views, or batch views, form the\
  \ batch layer of the Lambda Architecture.\n\nWhen intending to execute a query,\
  \ functions can be designed and run on this batch view, rather than on the entire\
  \ dataset. An indexed batch view helps quickly retrieve the required values because\
  \ it is an indexed subset of the data. Multiple batch views can be created for the\
  \ dataset as needed, covering different functions and suitable for various analyses.\
  \ Additionally, due to the distributed nature of `Hadoop`, parallelism in data retrieval\
  \ is always guaranteed.\n\nFor example, a clothing online retailer collects data\
  \ through a `Hadoop`-based system that records all user clicks (including sales\
  \ transactions). For them, a batch view that isolates all sales transactions by\
  \ geographic location might be useful for the sales department, while another batch\
  \ view containing user clicks and dates might be useful for data scientists to analyze\
  \ seasonal or annual product interest.\n\nIn some cases, if the dataset is very\
  \ large, even batch views can be large. Consider further decomposing them. For example,\
  \ an online clothing retailer generates billions of user click and sales records\
  \ each month. If batch views are created by quarter, the data volume might still\
  \ be too large to process queries quickly. Consider designing an additional layer\
  \ of monthly batch views. This will reduce processing time (since only the latest\
  \ month's data needs to be processed, not a quarter), but it may complicate the\
  \ retrieval strategy, as it requires determining the correct view to query, and\
  \ if the time span covers multiple months, multiple views may need to be queried.\n\
  \nIndexing views (after creating batch views) is a very important step that must\
  \ be performed by personnel with deep understanding of the data and functional requirements\
  \ (analyses and frequently executed queries). If the index does not match the query,\
  \ performance issues will be encountered.\n\nAn obvious question regarding this\
  \ approach is the time or latency required to create such batch views. Since these\
  \ views are created from the entire dataset, they will obviously consume significant\
  \ system resources. Even if computed nightly, they will not contain all data collected\
  \ by the system. Data may be added during or after the computation of these views,\
  \ and query results may lag by several hours.\n\nThe subsequent layers of the Lambda\
  \ Architecture will address this issue.\n\n### Serving Layer\n\nThe serving layer\
  \ serves the views. The indexed batch views created in the batch layer need to be\
  \ \"hosted\" in a location that can be accessed with low latency.\n\nTherefore,\
  \ the serving layer needs to be a specialized distributed database that can load\
  \ batch views and support good random read and sequential data retrieval performance.\
  \ The serving layer also needs to be able to replace old versions of batch views\
  \ with new versions when the batch layer provides them, so that user queries return\
  \ the latest results (it needs to support batch updates).\n\nHowever, since user\
  \ queries do not update batch views, the serving layer does not need to support\
  \ random writes. Since random writes cause most of the complexity in databases,\
  \ the distributed database of the serving layer can be extremely simple. This simplicity\
  \ gives them robustness, predictability, and ease of configuration (and operability).\
  \ This aligns with the philosophy of the Lambda Architecture, which believes that\
  \ complexity should be shifted from the batch and serving layers to the speed layer,\
  \ which is inherently disposable.\n\nThe last point to remember about the serving\
  \ layer is that there is no single recommended distributed database to use. The\
  \ nature of the data needs to be considered before deciding on the serving layer,\
  \ as each distributed (or `NoSQL`) database has its own strengths, and it is necessary\
  \ to ensure it matches the data.\n\n### Speed Layer\n\n\n\n服务层在批处理层完成批处理视图的计算后进行更新。这意味着在批处理视图更新期间新增的数据是更新后的批处理视图中唯一未包含的数据。速度层的目的是快速（顾名思义）提供这些数据。\n\
  \n速度层的基本功能与批处理层类似，因为它也基于接收到的数据生成视图。区别在于速度层仅处理批处理层尚未处理的新数据或近期数据，而批处理层则使用所有数据来计算视图。另一个区别是批处理层通过重新计算（或重建）来更新视图，而速度层则对视图执行增量处理，仅通过与上次增量处理的时间点进行比较来处理增量（或差异）。\n\
  \n例如，如果速度层中的视图在晚上 10:45 处理，下一次处理在晚上 11:00，那么仅处理在晚上 10:45 到 11:00 之间接收的数据。这些处理差异有助于速度层实现尽可能低的延迟。由于速度层视图几乎是实时的（根据处理延迟，您可能每五分钟处理一次，导致处理或数据延迟为五分钟），您也可以将其称为实时视图。\n\
  \n因此，您可以看到拥有一个近乎实时的系统，能够正确回答任何查询，同时提供基于 Hadoop 系统的所有优势。\n\n图 1-6 展示了如何使用 Lambda\
  \ 架构的工作流程，使查询能以近乎实时的速度返回结果。\n\n```\n新数据收集于\n晚上 10:45\n至 11:00 之间\n数据直到晚上 11:00\n\
  已处理并可用\n批处理层\n速度层\n晚上 10:45 至\n11:00 之间的数据\n正在处理\n完整的“主”\n实时视图 1\n数据集\n实时视图 2\n\
  批处理视图计算至\n晚上 10:45\n实时视图 3\n服务层\n批处理视图 1\n数据提供至\n晚上 10:45\n批处理视图 1\n批处理视图 1\n查询结果包含\n\
  用户查询于\n晚上 11:00 前的数据\n晚上 11:05\n```\n\n***图 1-6. Lambda 架构中的查询处理*** 19\n\n![Image\
  \ 6](img/index-45_1.jpg)\n\n关于 Lambda 架构需要记住的最后一点是：速度层是可丢弃的。任何新数据也会触发批处理层内的处理，并且当实时视图（来自速度层）被使用时，批处理层内会继续进行视图的重新计算。一旦这些批处理视图（来自批处理层）被重新计算并由服务层提供，部分实时视图就不再需要（因为这些数据已通过批处理视图可用）并可以被丢弃。因此，对于前面的例子，如果批处理视图在晚上\
  \ 11:15 完全处理完毕，那么晚上 11:15 之后的任何查询将按照图 1-7 所示的方式处理。\n\n***图 1-7. Lambda 架构中的可丢弃速度层***\
  \ 20\n\nLambda 架构支持一个名为*复杂性隔离*的属性，该属性将处理复杂性推送到结果临时性的层。由于速度层涉及比批处理层或服务层更高的处理复杂性，因此速度层结果临时性这一特性在哲学上与架构相符。\n\
  \n此外，如果出现任何数据或处理问题，速度层的全部内容可以轻松丢弃并快速重建。\n\n我在第[8 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_8)中更详细地讨论了\
  \ Lambda 架构，并在第[15 章](http://dx.doi.org/10.1007/978-1-4842-1287-5_15)中提供了一个案例研究。\n\
  \n过渡到 Hadoop/NoSQL\n\n\n\n*过渡*意味着将现有应用（可能使用`RDBMS`进行数据存储和处理）迁移到基于`Hadoop/NoSQL`的环境中。你可以利用上一节描述的重新架构技术，但还多了一个步骤：数据迁移。此外，你的新系统不一定非要采用\
  \ Lambda 架构。你可以根据功能需求和数据量选择合适的`NoSQL`数据库，并让应用前端直接写入该数据库。当然，你必须确保前端能够以`NoSQL`数据库可接受的格式写入数据，并能从中读取数据。\n\
  \n目前有大量`NoSQL`数据库可供选择（根据`nosql-database.org`列出的约有 150 种），它们在功能和特性上差异很大。本节将讨论一些可用于选择最合适`NoSQL`数据库的评判标准。\n\
  \n##### 数据类型\n\n你需要考虑计划在`NoSQL`数据库中收集和存储的数据类型。与`RDBMS`不同，`NoSQL`数据库没有统一的数据存储方式。实际上，它们甚至不使用相同的数据存储模型。例如，像`MongoDB`这样的`NoSQL`数据库是文档存储或文档数据库。选择与你的数据类型相匹配的`NoSQL`数据库至关重要。\n\
  \n广义上，`NoSQL`数据库有四种类型：\n\n-   **键值存储：** 这类数据库以键值对形式存储数据，并使用哈希表来索引和管理数据。典型的例子包括`Riak`和`Amazon\
  \ DynamoDB`。\n-   **文档存储：** *文档*是一组键值对。这类数据库系统将数据作为文档存储在数据库（文档集合）中。例如：`MongoDB`和`CouchDB`。\n\
  -   **列存储：** 数据在按列（或称为列*族*的列组）组织的存储块中进行保存和处理。例如：`HBase`和`Cassandra`。\n-   **图数据库：**\
  \ 这类数据库允许你存储实体（节点）以及这些实体之间的关系（边）。节点和边具有属性，边还具有方向性意义。图允许数据只存储一次，然后根据节点之间的关系以不同方式进行解释。例如包括`Neo4J`、`OrientDB`和`FlockDB`。\n\
  \n#### 数据量\n\n你需要考虑数据量，因为有些`NoSQL`数据库（例如`MongoDB`）为了速度而采用基于内存的计算（因此无法水平扩展），而其他数据库则不然，因此可以轻松扩展。如果你的数据量很大，那么使用像`Cassandra`这样易于扩展的解决方案可能更合适。\n\
  \n## 数据分布\n\n从性能角度考虑，你需要评估数据在地理上需要分布的范围。有些`NoSQL`数据库使用主/从（或“主/辅助”）架构，这种架构只能扩展读取操作，而对等架构则可以同时扩展读取和写入操作。因此，你可以根据应用行为来决定哪种架构更符合你的需求。\n\
  \n## 迁移数据\n\n在确定合适的`NoSQL`解决方案后，你需要设计`ETL`来将数据从应用迁移到目标数据库。有时，在将数据迁移到最终目的地之前，有必要构建一个过渡模型或临时数据库，先将数据移入其中。采取这种方法可能有多种原因，例如源数据库和目标数据库的数据模型存在差异，需要对数据进行反规范化或转换，或者纯粹出于性能原因——源数据库数据量过大，目标数据库可能无法在单次迭代或单个实体中加载。第\
  \ 7 章将讨论过渡模型的构建。现在，图 1-8 总结了过渡到`Hadoop/NoSQL`的步骤。\n\n```\n基于 RDBMS 的\n应用\n│\n确定\n\
  NoSQL 方案\n│\nETL\n│\n过渡数据\n模型或临时\n数据库\n│\nETL\n│\nNoSQL\n目标\n```\n\n***图 1-8.**\
  \ 过渡到 Hadoop/NoSQL*\n\n### 总结\n\n每个人都希望在自己的环境中利用大数据的强大能力。不幸的是，决策者往往在未考虑所有参数之前就断定大数据适合其组织。有时，技术人员（提供技术评估）缺乏适当经验也是一个问题。\n\
  \n此外，对`NoSQL`数据库及其细微差别缺乏理解是一个主要问题。`Hadoop`实现缺乏正式的框架或设计方法论也无助于事。Lambda 架构虽然刚刚引入，但可能并非在所有可能场景中都适用或有用（除了实现起来并不容易）。\n\
  \n`Hadoop/NoSQL`世界不断演进，充满创新，并由众多聪明才智之士推动。它为各种各样的问题提供了实用的技术和巧妙的解决方案。\n\n你只需要意识到实施过程中的问题，并在引入`NoSQL`之前仔细考虑你的具体环境和需求——仅此而已。\n\
  \n在本章中，我试图总结`Hadoop/NoSQL`实现的优缺点，希望能指导你做出正确的决策。后续章节将详细阐述此处介绍的概念。\n\n---\n\n"
