  \ 1-2.** *NoSQL 数据存储*\n\n\n\n因此，举例来说，如果发现社保号码出现错误，那么所有包含该信息的文件都需要单独（通过编程方式）更新。\n\
  \n与关系型数据库管理系统（RDBMS）不同，`HDFS` 或 `HBase` 不提供任何实用程序来帮你完成此操作。原因在于 `HBase`（或任何其他基于 HDFS\
  \ 的 NoSQL 数据库）不提供任何参照完整性——这仅仅是由其设计目的决定的。`HBase` 并非为对小型数据集进行交互式查询而设计；它最适合于处理包含不可变数据的大型批处理环境（类似于数据仓库环境）。直到最近，对\
  \ `HBase` 的更新还涉及将更改后的行加载到临时表，并与主数据表进行左外连接以覆盖该行（确保临时表和主数据表具有相同的键）。\n\n随着 `HBase`\
  \ 新版本的推出，现在支持更新、删除和插入操作，但对于小数据集，这些操作会非常慢（与 RDBMS 相比），因为它们作为 Hadoop `MapReduce` 作业执行，延迟高，并且在作业提交和调度方面会产生大量开销。\n\
  \n由于 `HDFS` 使用大块大小（默认 64 MB）以及将数据分布在大量 `DataNodes` 上的分布式架构（有助于使用 `MapReduce` 或 `Yarn`\
  \ 进行并行读取），`HBase`（以及其他基于 HDFS 的 NoSQL 数据库）旨在高效处理大型数据集。任何需要应用的转换都涉及读取整个表，而非单行。使用\
  \ `MapReduce`（或在最新版本中使用 `Yarn`）在 `DataNodes` 上进行分布式处理，为此类读取提供了速度和效率。同样，由于分布式架构，将转换后的数据写入新的“文件”（或\
  \ `HBase` 的临时表）要高效得多。出于同样的原因，Hadoop 和 NoSQL 数据库更适合存储（和处理）大型图像或视频文件、大型自然语言文本块、半结构化数据以及传感器数据。\n\
  \n将此与 RDBMS 的小页面大小（例如，Microsoft SQL Server 使用 8 KB 的页面大小）以及缺乏有效机制来分布读取（或更新）操作进行比较，你就会明白为什么在涉及数据仓库和大型数据集的所有场景中，NoSQL\
  \ 数据库总是胜出。然而，RDBMS 的优势在于处理具有复杂关系且需要对其部分进行深入分析的小型数据集。此外，在需要在一个数据集上实现参照完整性的场景中，NoSQL\
  \ 数据库无法与 RDBMS 匹敌。\n\n总而言之，RDBMS 更适合对需要满足 ACID（原子性、一致性、隔离性、持久性）合规性要求的小型数据集执行大量数据操作；而\
  \ NoSQL 数据库更适合对可以接受“最终一致性”模型的大型数据集执行少量数据操作。\n\n表 1-1 提供了两种技术（关系型与 NoSQL）之间的便捷比较。\n\
  \n**表 1-1.** RDBMS 与 NoSQL 的功能特性对比\n\n| 特性 | 基于 HDFS 的 NoSQL | RDBMS |\n| --- |\
  \ --- | --- |\n| 大型数据集 | 高效且快速 | 效率不高 |\n| 小型数据集 | 效率不高 | 高效且快速 |\n| 搜索 | 效率不高 |\
  \ 高效且快速 |\n| 大型读取操作 | 高效且快速 | 效率不高 |\n| 更新 | 效率不高 | 高效且快速 |\n| 数据关系 | 不支持 | 支持 |\n\
  | 身份验证/授权 | Kerberos | 内置 |\n| 数据存储 | 分布在 DataNodes 上 | 中央数据库服务器 |\n| 符合 ACID |\
