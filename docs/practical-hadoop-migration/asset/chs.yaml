  \ | 239-32-5674 | 21 Maple st. Naperville IL 60563 | 疼痛原因尚未确定 | 医疗 | 1\n6/1/2015\
  \ 10:05:11 | 史蒂夫·沃 | 12/14/1970 | 246-56-9867 | 32 Madison ct. Woodridge IL | 很可能是季节性过敏\
