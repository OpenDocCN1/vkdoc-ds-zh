- '# NoSQL 解决方案与 SQL 查询性能


  像 `VoltDB` 和 `SploutSQL` 这样的 `NoSQL` 解决方案可以为您的 `Hadoop` 数据提升性能。像 `Hive` 这样流行的查询工具，正通过
  `Spark` 或 `Apache Tez`（由 `Hortonworks` 开发）等分布式框架进行性能革新，以减少延迟并提升表现。这种方法有哪些好处？它又如何帮助您？我将在稍后详细讨论，并从
  `Spark SQL` 开始。


  #### Spark SQL


  三年前，`Spark SQL` 的前身是加州大学伯克利分校的 `Shark`，它是作为性能中等的 `Hive` 的一种更快的 `SQL` 替代方案而开发的。`Shark`
  有效地质疑了在通用数据处理引擎上进行查询处理低效的说法。


  这是第一次在通用处理引擎（`Spark`）之上构建交互式 `SQL` 工具，并且表现得如此出色。在通用处理引擎之上拥有一个 `SQL` 引擎还带来了额外的好处，例如整合了批处理、流处理和机器学习等多种数据访问方法。


  最近，`Shark` 的开发已经终止，并合并到了 `Spark SQL` 项目中。同时，`Hive on Spark`（[HIVE-7292](https://issues.apache.org/jira/browse/HIVE-7292)）也已被引入。现在，`Spark
  SQL` 将为现有的 `Shark` 用户提供 `Shark` 的所有功能（以及一些额外功能）。因此，`Spark SQL` 不仅提供了从 `Shark 0.9`
  服务器的升级路径，还提供了与 `Spark` 程序集成等新功能。


  尽管 `Spark SQL`（相比 `Hive`）有很多优势，但许多组织目前仍广泛使用 `Hive`。`Hive` 社区提出了一项[新倡议](https://issues.apache.org/jira/browse/HIVE-7292)，该倡议将为
  `Hive` 添加 `Spark` 作为替代执行引擎（代替 `MapReduce`）。这将使他们更容易过渡到 `Spark`。该倡议被称为“Hive on Spark”，即
  `HIVE-7292`。


  图 5-1 总结了 `Hive`、`HIVE-7292` 和 `Spark SQL` 之间的架构差异。


  **Spark SQL** | **HIVE -7292** | **Hive**

  --- | --- | ---

  SQL 接口 | Hive 接口 | Hive 接口

  SPARK 引擎 | SPARK 引擎 | MapReduce 引擎

  | | | 数据存储在 HDFS 中


  ***图 5-1.** Spark SQL、Hive 和 HIVE-7292 之间的架构差异*


  几年前，当 `Shark` 项目启动时，`Hive`（使用 `MapReduce`）是 `Hadoop` 唯一可用的 `SQL` 接口。`Hive` 将 `SQL`
  编译成 `MapReduce` 任务，并支持多种格式。性能问题迫使人们使用需要刚性且冗长的 `ETL` 管道的专有企业数据仓库（`EDW`）来补充 `Hive`。巨大的性能差异质疑了通用数据处理引擎本身的查询处理能力，并引发了猜测：是否需要专门的运行时引擎（如
  `EDW`）来保证性能？


  `Shark` 有效地证明了性能缺陷（导致 `Hive` 变慢）是 `Hive` 架构固有的，可以通过使用 `Spark`（而不是 `MapReduce`）作为处理引擎来克服。此外，这种解决方案的扩展性与
  `MapReduce` 一样好。一个强大的 `SQL` 查询引擎与通用数据处理引擎协同工作，有助于支持各种类型的数据访问，例如批处理、流处理或机器学习，并使高级模型更容易应用于数据。


  开始时，`Shark` 通过使用 `Spark` 作为物理执行引擎（而不是 `MapReduce`）来实现性能提升（超过 `Hive`），同时仍然使用 `Hive`
  代码库。`Shark` 开发团队意识到 `Hive` 代码库是一个巨大的负担，因为它难以维护和优化。此外，使用这个专为 `MapReduce` 设计的代码库几乎不可能实现性能优化和复杂的分析。随后，决定停止
  `Shark` 的开发，并将资源重新用于开发 `Spark` 的新组件——`Spark SQL`。


  当然，开发团队在设计 `Spark SQL` 时，积极运用了通过用户使用 `Shark` 所获得的知识和理解，从而产生了更强大的 `SQL` 接口，同时也保持了与
  `Shark`/`Hive` 的兼容性。此外，`Spark SQL` 支持所有现有的 `Hive` 数据格式、用户自定义函数（`UDF`）以及 `Hive` 元存储。最后，随着
  `Spark`（`1.1.0`）下一版本中将引入的功能，`Spark SQL` 的速度将比 `Shark` 快几乎一个数量级。因此，它将成为处理结构化或半结构化数据的绝佳资源，并支持从各种格式和来源（如
  `JSON`、`Parquet`、`Hive` 或任何其他 `EDW`）摄取数据，以及使用复杂的编程 API 进行高级分析。`Spark SQL` 的长期目标是提供一个同时支持
  `SQL` 和高级分析（机器学习、统计学等）的接口。


  总结一下，以下是 `Spark SQL`（最新版本）的一些关键特性：


  - **内存中数据处理：** `Spark SQL` 提供了明确将数据加载到内存中以加速查询处理的选项。此外，它使用一种高效的、压缩的、面向列的格式在内存中保存数据，有助于容纳更大的数据集。

  - **容错性：** `Spark SQL` 既适用于短查询，也适用于长查询。由于它使用 `Spark` 引擎进行处理，因此可以从查询中途的故障中恢复。

  - **数据源 API：** 提供用于加载和存储数据的单一接口。它提供了 `Apache Spark` 发行版中预打包的数据源，并提供了集成外部（自定义）数据源的接口。内置或预打包数据源的示例包括
  `JSON`、`JDBC`、`Parquet`、`Hive`、`MySQL`、`PostgreSQL`、`HDFS` 和 `AWS S3`。（当前可用的）外部数据源包括
  `CSV`、[Apache Avro](http://spark-packages.org/package/databricks/spark-avro)、`HBase`、`Cassandra`、`Elasticsearch`
  和 `Amazon Redshift`。

  - **Dataframes：** *dataframe* 是一个按命名列组织的分布式数据集。逻辑上，它类似于关系数据库中的表或 `R`/`Python` 中的
  `Dataframe`。Dataframes 可以来自结构化数据文件、`Hive` 表、外部数据库或现有的弹性分布式数据集（`RDD`），后者是一个不可变的、分布式的记录集合，可以存储在内存或磁盘上。

  - **Catalyst（基于规则和成本的优化器）：** Dataframes 向核心 `Spark` 引擎暴露了更多的应用语义，因此 `Spark` 可以使用
  `Catalyst` 来优化查询。

  - **Python API (PySpark)：** `Python` 在大数据领域被广泛使用，但由于语言的动态性更强，`Python` 程序的性能不如 `JVM`。使用新的
  `DataFrame` API，`Python` 程序现在可以达到与 `JVM` 相同的性能，因为 `Catalyst` 优化器会将 `DataFrame` 操作编译成
  `JVM` 字节码。

  - **统计和数学函数：** `Spark SQL` 支持多种函数，例如随机数据生成、摘要和描述性统计、样本协方差和相关性、交叉表（又称列联表），以及像 `cos`、`sin`、`floor`、`ceil`
  这样的数学函数。


