  \n    如果你使用`Hive`，可以使用 Java 开发一个`UDF`（用户自定义函数）并利用此功能。在`Hive`中，命令`ADD FILE <filename>`会添加一个分布式缓存文件，该文件会被分发到每个节点。\n\
