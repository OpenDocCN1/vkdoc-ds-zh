  \n\n\n与关系型数据库不同，在关系型数据库中你需要操心底层关系、数据间的互联互通以及更新性能，而这里你可以持续添加数百万条事实——每条都带有时间戳，便于高效批量处理，无需担心任何更新问题。此外，由于不涉及增量处理，你也不必担心性能问题。下一节中，我将讨论这种基于事实的模型如何用于批量处理。\n\
