- "# 构建批量视图\n\n我将探讨如何为先前设计的基于事实模型的应用程序（信息跟踪系统和销售管理系统）构建批量视图。信息跟踪系统由`DataScourerNinjas`设计，供其潜在客户使用，这些客户是设计和销售具有特定功能（如薪资、客户关系管理等）的软件公司。\n\
  \n根据他们的经验，大多数软件公司寻找在过去五年中保持盈利且拥有大量客户支持团队（至少平均 1000 人）的潜在客户。有些公司则关注过去三年的短期盈利能力，但坚持与\
  \ IT 部门中大学毕业生占比高（至少 60%）的公司合作。此外，由于这些软件产品针对特定行业，聚焦于特定业务类别的公司至关重要。考虑到这些因素，他们设计了以下批量视图：\n\
  \n-   过去五年盈利的公司（包含列：`Corporation`，`Profit_last_year`）\n-   过去五年平均客户支持团队规模达到 1000\
  \ 人（或以上）的公司\n-   过去三年 IT 部门中大学毕业生比例至少达到 60%（平均）的公司\n\n设计批量视图时还需考虑其大小。在某些情况下，如果数据集非常庞大，批量视图也会变得巨大，您可能需要考虑进一步拆分它们。例如，考虑正在讨论的信息跟踪系统。假设出现巨大繁荣，导致数千家新公司成立，并且`DataScourerNinjas`成功获取了这些公司的数据。如果您按月创建批量视图，查询快速处理的数据量可能仍然很大，您可能希望重新设计批量层，改为按周甚至按天创建视图。这将增加（总）处理时间（因为您将按周或按天处理，而不是按月），但有助于提升性能并减少速度层的大小（以及处理量）。\n\
  \n## 实施批量视图\n\n关于上一节设计的批量视图，有几点需要考虑。该视图可以轻松使用`HDFS`进行存储，并配合任何可用的 NoSQL 解决方案（如`HBase`、`Cassandra`或`MongoDB`）来实现。或者，您可以将数据保留在`HDFS`中，并使用`Hive`进行元数据管理，使用`MySQL`来保存元数据。`Nathan`建议您使用`Java`或任何其他您选择的语言来编写自己的函数和抽象层，因为使用现成的\
  \ NoSQL 解决方案会增加复杂性并可能影响性能。\n\n我将使用`Hive`来演示（设计和构建批量视图的）概念，原因有几个。考虑到各种分布式引擎的不断涌现（至少在近期），编写`MapReduce`代码有其自身的局限性。此外，我并不期望所有使用本书的人都精通`Java`或`C#`编程。本章更多是关于理解\
  \ Lambda 架构的概念，而不是编写可直接用于生产环境的代码。\n\n此外，为了追加垂直或基于时间的数据，`Nathan`开发了一个基于`Java`的应用程序，名为`Pail`。您可以将`Pail`视为`HDFS`的一个容器。`Thrift`（`Nathan`用于序列化的接口）模式会创建`Java`对象。这些`Thrift\
  \ Java`对象通过实现`PailStructure`接口来进行序列化和反序列化，并且也有助于实现垂直分区。这些是使用`Java`编程的高级主题——因此，我倾向于采用一种更通用的方法（可能对更广泛的读者来说更容易理解），即使用`Hive`分区（按天、按周或按月，取决于您的应用需求）来追加新数据。我使用`Hive`分区来演示如何管理主数据集的新数据，并在创建的批量视图中进行处理的这一概念。\n\
  \n您可以假设 Web 界面使用基于内存的数据库解决方案（如`VoltDB`、`Apache Geode`或`Ampool`）来保存一天的数据，然后每晚将其传输到`HDFS`。因此，我将创建四个`Hive`表来保存该系统的主数据。这是实施前面讨论的批量视图所需的第一步。我还使用了时间戳来对表进行分区。\n\
  \n如果您需要执行事务或需要 ACID 支持，则需要在创建新表之前对`Hive`进行一些配置更改。您可能知道，从`0.14`版本开始，`Hive`支持 CRUD（创建、读取、更新、删除）操作。要启用对\
  \ CRUD 操作的支持，请确保您的`hive-site.xml`文件配置了以下参数：\n\n-   `hive.support.concurrency` –\
  \ `true`\n-   `hive.enforce.bucketing` – `true`\n-   `hive.exec.dynamic.partition.mode`\
  \ – `nonstrict`\n-   `hive.txn.manager` –`org.apache.hadoop.hive.ql.lockmgr.DbTxnManager`\n\
  -   `hive.compactor.initiator.on` – `true`\n-   `hive.compactor.worker.threads`\
  \ – `1`\n\n实施这些配置更改后，重启`Hive`。此外，在使用`ZooKeeper Hive`锁管理器时，必须运行`ZooKeeper`实例。\n\n\
  有关其他设置细节，请参阅以下链接：\n\n-   `http://zookeeper.apache.org/doc/r3.1.2/recipes.html#sc_recipes_Locks`\n\
  -   `https://cwiki.apache.org/confluence/display/Hive/Hive+Transactions#HiveTransactions-LockManager`\n\
  \n请记住，仅对使用`ORC`文件格式存储的对象支持事务。最后，您需要在创建表时启用对 ACID 属性的支持，并指定分桶列或键列（顺便提一下，这些列不能被更新）。因此，您的`CREATE\
  \ TABLE`语句需要包含以下构造：\n\n```\nclustered by <key column(s)> into <number of buckets>\
  \ stored as orc TBLPROPERTIES ('transactional'='true')\n```\n\n我的示例未使用事务支持，因此以下是创建这些`Hive`表的代码：\n\
  \n```sql\nCREATE TABLE CorpBusDetails(\n    Corporation STRING,\n    BusCategory\
  \ STRING,\n    BusDetails STRING\n)\nPARTITIONED BY (AsOf TIMESTAMP)\nROW FORMAT\
  \ DELIMITED FIELDS TERMINATED BY \"\\;\";\n\nCREATE TABLE CorpCustSupDetails(\n\
  \    Corporation STRING,\n    CustSuppStrength INT,\n    Males INT)\nPARTITIONED\
  \ BY (AsOf TIMESTAMP)\nROW FORMAT DELIMITED FIELDS TERMINATED BY \"\\;\";\n\nCREATE\
  \ TABLE CorpITDetails(\n    Corporation STRING,\n    ITStrength INT,\n    ColGrads\
  \ INT)\nPARTITIONED BY (AsOf TIMESTAMP)\nROW FORMAT DELIMITED FIELDS TERMINATED\
  \ BY \"\\;\";\n\nCREATE TABLE CorpFinDetails(\n    Corporation STRING,\n    YrlyRevenue\
  \ BIGINT,\n    ProfLastYear BIGINT)\nPARTITIONED BY (AsOf TIMESTAMP)\nROW FORMAT\
  \ DELIMITED FIELDS TERMINATED BY \"\\;\";\n```\n\n请注意，这些表以文件形式存储在`HDFS`中，而`Hive`仅保存元数据，以便更有效地管理数据修改（以及通过查询进行的数据操作）。那么，新数据如何每日添加呢？使用动态分区。\n\
  \n\n\n您需要为您的 Hive 安装启用动态分区并调整一些配置参数。详细信息请阅读 [`cwiki.apache.org/confluence/display/Hive/LanguageManual+DML#LanguageManualDML-DynamicPartitionInserts`](https://cwiki.apache.org/confluence/display/Hive/LanguageManual+DML#LanguageManualDML-DynamicPartitionInserts)\
  \ 。\n\n## 第 9 章 ■ 用于实时 Hadoop 应用的 Lambda 架构\n\n任何新数据都可以通过创建一个临时表（指向包含新数据的文件）并向表中添加新分区来追加，如下所示：\n\
  \n```sql\nCREATE EXTERNAL TABLE CorpBusDetails_stg(\nCorporation STRING,\nBusCategory\
  \ STRING,\nBusDetails STRING,\nAsOf TIMESTAMP\n) ROW FORMAT DELIMITED FIELDS TERMINATED\
  \ BY \"\\;\"\nLOCATION \"/TrackingInfo/CorpBusDetails/staging\";\n\nFROM CorpBusDetails_stg\
  \ INSERT OVERWRITE TABLE CorpBusDetails PARTITION\n(AsOf) SELECT Corporation,BusCategory,BusDetails,AsOf;\n\
  ```\n\n您会注意到，临时表多了一个列，并指向一个用于`CorpBusDetails`表的临时目录（存放新数据）。同样的原则可以应用于向`CorpCustSupDetails`和`CorpProfitDetails`表添加新数据。此外，将新数据文件复制到相应的临时目录、创建临时表以及向基表添加新分区的过程可以自动化和安排调度。\n\
  \n下一步是创建批处理视图。我首先会创建一个名为`BatchProcHist`的表，用于记录批处理视图的历史信息：\n\n```sql\nCREATE TABLE\
  \ BatchProcHist(\nViewName STRING,\nCreatedAt timestamp)\nROW FORMAT DELIMITED FIELDS\
  \ TERMINATED BY \"\\;\";\n```\n\n接下来，我将创建第一个视图：*过去 5 年盈利的公司*。最简单的判断方法是将过去五年的利润相加，并确保其和为正整数。以下是如何使用临时表快速计算的方法：\n\
  \n```sql\nCreate table Profitemp1 as Select ProfLastYear, AsOf, Corporation from\n\
  CorpProfitDetails where year(AsOf) <= year(from_unixtime(unix_timestamp())) and\
  \ year(AsOf) >= (year(from_unixtime(unix_timestamp())) – 5)\n\nCreate table ProfLFiveView\
  \ as select Corporation, sum(ProfLastYear) as\nProfLastFive from Profitemp1 group\
  \ by Corporation having sum(ProfLastYear) > 0\n\nINSERT INTO TABLE BatchProcHist\n\
  VALUES ('ProfLFiveView', from_unixtime(unix_timestamp()));\n```\n\n正如您所观察到的，在创建第一个批处理视图后，我还向`BatchProcHist`表写入了一条历史记录。\n\
  \n第二个视图涉及计算平均值（*过去五年平均客户支持人员数量等于或超过 1000 的公司*）。由于您需要在速度层计算最新的平均值，因此还需要存储用于计算该平均值的记录计数：\n\
  \n```sql\nCreate table CustSuptemp1 as Select CustSuppStrength, AsOf, Corporation\
  \ from CorpCustSupDetails where year(AsOf) <= year(from_unixtime(unix_timestamp()))\
  \ and year(AsOf) >= (year(from_unixtime(unix_timestamp())) – 5)\n\nCreate table\
  \ AveCS1000View as select Corporation, sum(CustSuppStrength)\nas TotalCustSup, count(CustSuppStrength)\
  \ as CountCustSup,\n(sum(CustSuppStrength) / count(CustSuppStrength)) as AveLastFive\
  \ from\nCustSuptemp1 group by Corporation having (AveLastFive >= 1000)\n\nINSERT\
  \ INTO TABLE BatchProcHist\nVALUES ('AveCS1000View', from_unixtime(unix_timestamp()));\n\
  ```\n\n此时可以删除临时表（`Profitemp1`、`Profitemp2`和`CustSuptemp1`）。下次重新构建这些批处理视图时，它们会被重新创建。\n\
  \n您可以构建最后一个批处理视图（作为练习），并且可以根据需要支持的功能类似地构建其他视图。最后一步，需要创建二级索引以促进快速检索，但这在服务层完成。举个例子，针对设计的第一个批处理视图，以下二级索引将有助于提升性能：\n\
  \n* `Corporation`\n* `ProfLastFive`, `Corporation`\n\n请记住，创建二级索引会消耗处理时间和磁盘空间。因此，在设计这些索引并优化其使用时需要格外小心。此外，由于对视图进行索引是一个非常关键的步骤（从性能、磁盘空间和处理时间的角度来看），这需要由既熟悉您的数据又了解功能需求（分析和频繁执行的查询）的人员来执行。如果您的索引与查询不匹配，您将遇到性能问题，并且还会浪费宝贵的系统资源（和时间）来构建它们。\n\
  \n关于批处理视图，需要重点注意的一点是数据集的大小和可变性。如果您的数据集非常庞大或高度动态，生成的批处理视图可能会非常巨大，或者可能会丢失大量新数据，您可能需要以更小的批次进行处理。例如，考虑跟踪系统示例。假设市场突然繁荣，每周都有大量新公司加入到`DataScourerNinjas`的数据库中。如果您每月重新构建一次批处理视图，那么在此期间可能会添加大量不属于批处理视图的新数据（虽然可以通过速度层提供查询，但由于记录量更大，可能会降低速度层的效率和速度）。因此，您可能希望每周而不是每月重新构建批处理视图。这也有助于保持速度层的规模较小且易于管理。\n\
  \n对于庞大的数据集，您可能希望按周（而不是按月）拆分批处理视图，因为这将减少每次视图的处理资源和时间（因为您只需要处理一周的数据，而不是一个月），但可能会使您的检索策略复杂化（因为您需要确定要查询的正确视图，如果查询的时间跨度跨越多周，还可能需要查询多个视图）。\n\
  \n最后，您可能会对这种方法的明显疑问是关于创建此类批处理视图所需的时间或延迟。由于这些视图是从整个主数据集创建的，显然它们会消耗大量的系统资源，并且计算可能无法在可用的维护窗口内完成。即使可以完成，它们也可能不包含系统收集的所有数据，因为数据可能在视图计算期间（或之后）被添加，而您的查询结果可能已经过时数小时。Lambda\
  \ 如何提供近实时的结果？答案在于 Lambda 的后续几层以及它们克服数据延迟问题的方式。\n\n### 服务层\n\n服务层“服务”批处理视图，或以最小延迟提供快速访问。因此，服务层需要是一个专门化的分布式数据库，能够托管批处理视图，并支持良好的随机和顺序数据访问性能。服务层还需要能够在批处理层重新构建批处理视图时快速地将旧版本替换为新版本，以便用户查询能够返回最新的结果。因此，它需要支持批量更新。\n\
  \n\n\n"
- "# 实时 Hadoop 应用的 Lambda 架构\n\n### 服务层\n\n这里需要记住的重点是，服务层替换的是由批处理层*重新构建*的新批处理视图，而非增量处理。`Lambda`架构在批处理层或服务层都不执行任何增量处理。增量处理存在若干问题。任何增量处理都涉及更新、插入和删除操作。所有这些操作都涉及随机写入，因为数据库需要管理存储空间。例如，如果某个键列被更新，该记录需要移动到不同的数据页，这将涉及从一个页面删除记录，并在另一个页面上插入记录。第一个操作会在页面上留下未使用的空间，而第二个操作则需要数据库服务器查找未使用的空间。只要有足够的空间可用，记录就会被随机插入（当然，会遵循某种插入算法）。\n\
  \n类似地，当记录被删除时，页面上就会释放出可用空间。\n\n因此，增量处理会产生零散的未使用空间，从而需要进行在线压缩以有效管理空间。这种处理会消耗宝贵的系统资源，而这些资源本可用于其他用途。增量处理增加的另一个复杂性是需要原子化写入，并且还要同步读写操作，以确保永远不会读取到半写入的值。这当然需要通过*隔离级别*和`ACID`事务来实现，并给处理增加了大量复杂性。\n\
  \n因此，如果不需要增量处理，您的数据库服务器就不会承受管理*在线压缩*或满足`ACID`合规性的运维负担。\n\n总结而言，服务层应具备以下特性：\n\n-\
  \   能够托管批处理视图，优化延迟和吞吐量\n-   无需支持随机写入，但需能以批处理更新的方式替换批处理视图\n-   容错性（因为视图可以随时从批处理层快速重新部署）\n\
  -   健壮性、可预测性以及易于配置（和运维）\n-   具备索引能力以支持快速检索\n\n关于服务层，最后一点需要记住的是，并没有唯一的分布式数据库可供推荐或使用。在决定服务层之前，您需要考虑数据本身的特性，因为每种分布式（或`NoSQL`）数据库都有自己的优势，您需要确保它与您的数据匹配。\n\
  \n## ElephantDB\n\nNathan 建议使用`ElephantDB`；这是一个能从`Hadoop`提供或部署键值数据以实现快速高效访问的数据库。`ElephantDB`有两个主要组件：\n\
  \n-   `MapReduce`作业用来创建索引化键值数据集（存储在分布式文件系统上）的库\n-   能够提供已部署数据集的只读、随机访问子集的守护进程或后台进程\n\
  \n用于提供完整数据集的服务集群被称为一个*环*（*ring*）。`ElephantDB`服务器不支持随机写入，并使用`Thrift`接口，这使得大多数编程语言都能轻松地从中读取数据。\n\
  \n`ElephantDB`与`Hive`的集成并不容易，使用它需要高级编程知识。此外，在`ElephantDB`中使用索引也存在限制，并且它不提供用于查询的`SQL`接口。随后，我将使用`SploutSQL`作为服务层，因为`SploutSQL`不需要任何编程即可部署或服务`Hive`对象，并且还提供`SQL`作为查询语言，这简化了查询操作，并省去了学习新查询语言的时间。\n\
  \n## Splout SQL\n\n`Splout SQL`是一个只读数据库，这简化了其架构。以下是其架构的显著特点：\n\n-   `Splout`可以安装在一组普通硬件机器上，形成一个集群。每台机器（或节点）运行一个`DNode`服务，并且可选地运行一个`QNode`服务（一个集群中至少必须有一个`QNode`服务）。\n\
  -   `QNodes`通过`REST API`与用户交互，负责处理用户查询或接收部署请求。\n-   `QNodes`与适当的`DNode(s)`通信以处理查询，而`DNode(s)`则返回所需的数据集。\n\
  -   `Splout`利用`Hadoop`集群对数据进行索引（以及通过预采样进行平衡），作为数据部署请求的一部分，`DNodes`会检索生成的结果文件。您可以在插入前对数据进行排序，以保证连续性并最大程度减少磁盘寻道。\n\
  -   数据根据需求进行分区，并分布到各个节点上。此外，查询仅限于单个分区，因此速度很快。\n-   数据的生成和部署可以同时进行，互不影响。\n-   通过使用`Hadoop`继承了高可用性和可扩展性。\n\
  -   数据被部署为*表空间*（*Tablespace*），这是一个具有共同分区模式的表集合。\n-   为了方便管理，`Tablespaces`带有版本号，并且可以同时部署多个`Tablespaces`。\n\
  -   `Splout`可以直接从`Hive`、Cascading 或`Pig`导入数据。\n-   `QNodes`和`DNodes`以`Java`服务的形式实现。\n\
  -   `Splout`使用`Pangool`进行低级别的`Java Hadoop`开发，并生成供`DNodes`用于服务数据的`SQLite`文件。\n\n\
  图 9-7 总结了`Splout`的处理流程和接口。\n\n客户端连接（查询），  \n客户端连接  \n部署或回滚请求  \n`QNodes`的数量可  \n\
  `QNode`层用于根 根据用户流量  \n据`REST API`与客  进行配置  \n户端交互  \n\n```\nQNODE    QNODE    QNODE\n\
  ```\n\n`DNodes`的数量可  \n根据数据量进行  \n配置  \n\n```\nDNODE    DNODE    DNODE    DNODE\n\
  ```\n\n`DNode`层用于与  \n`Splout Hadoop`集群  \n交互并使用  \n`Pangool Hadoop` API  \n检索数据\
  \  \n\nSplout Hadoop 集群  \n\n来自`Hive`、`Cascading`或`Pig`的源数据  \n\n***图 9-7.** Splout\
  \ SQL 处理流程与接口*\n\n要使用`Splout SQL`，您需要先安装它。请参阅 [`sploutsql.com/gettingstarted.html`](http://sploutsql.com/gettingstarted.html)\
  \ 上的说明。安装后，您需要配置`Splout`，并指定 jar 文件以及`Hadoop`安装的路径。之后，您可以在`Splout`集群节点上启动`QNode`和`DNode`服务。如果您要从`Hive`导入数据（如同我在示例中所做的那样），请将`Hive`的\
  \ conf/ 和 lib/ 文件夹添加到 `HADOOP_CLASSPATH`环境变量中：\n\n```\nexport HADOOP_CLASSPATH=$HADOOP_CLASSPATH:$HIVE_HOME/conf:$HIVE_HOME/lib/*\n\
  ```\n\n接下来，创建表空间和表。在我示例中的信息跟踪系统中，我创建了一个批处理视图（作为一个`Hive`表）。我将讨论使用`Splout SQL`来服务或部署它的步骤。首先，要创建或生成一个表空间，您需要使用\
  \ generate 工具。该工具使用一个`JSON`格式的表空间描述符，如下所示。\n\n您需要指定输入类型以及`Hive`数据库和表名。请注意，您不需要指定输入路径，因为您已经指定了`Hive`的安装目录，因此`Splout`可以定位到相应的`Hive`元存储，并从正确的数据库中检索所需的`Hive`表。表空间描述符文件可以在`Splout\
  \ SQL`的安装目录中创建：\n\n```\n{\n    \"name\": \"AveCS1000Space\",\n    \"nPartitions\"\
  : 1,\n    \"partitionedTables\": [{\n        \"name\": \"AveCS1000View\",\n    \
  \    \"partitionFields\": \"Corporation\",\n        \"tableInputs\": [{\n      \
  \      \"inputType\": \"HIVE\",\n            \"hiveTableName\": \"AveCS1000View\"\
  ,\n            \"hiveDbName\": \"TrackInfo\"\n        }]\n    }]\n}\n```\n\n这些信息存储在文件\
  \ `AveCS1000Space.json` 中。该表空间将被命名为 `AveCS1000Space`，当前只定义了一个表 `AveCS1000View`——这是在上一节中创建的。数据库名为\
  \ `TrackInfo`，我选择为我的数据创建一个分区。我使用 `Corporation` 作为分区列，因为该列将出现在几乎所有的查询中。\n\n\n\n正确分区表空间至关重要，因为它用于在索引和部署数据之前平衡数据。通常，表空间内表的常用键列会用作分区键。表空间内的所有表都需要使用相同类型的列作为分区键。例如，如果表空间\
  \ A 包含表 `Tbl1` 和 `Tbl2`，并且 `Tbl1` 是按一对 (`string`, `int`) 列分区的，那么 `Tbl2` 也应按一对 (`string`,\
  \ `int`) 列分区。\n\n请注意，当表按单个或多个列分区时，`Splout` 会将这些列的值拼接起来形成单个字符串。因此，分区是行的函数，也可以使用任意函数进行分区（例如，一个\
  \ JavaScript 函数，它提取字段的最后五个字符）。\n\n## 回到部署\n\n可以从命令行执行以下命令来生成表空间 `AveCS1000Space`（从\
  \ `Splout SQL` 安装目录执行）：\n\n```\nhadoop jar splout-*-hadoop.jar generate -tf file:///`pwd`/\
  \ AveCS1000Space.json -o out-TrackingInfo_splout_example\n```\n\n为了提升性能，你可能需要为表空间添加索引，`Splout`\
  \ 允许你轻松地添加索引。你只需修改用于生成表空间的命令即可。例如，以下索引有助于提升性能：\n\n`TotalCustSup`, `Corporation`\n\
  \n以下命令将在生成表空间 `AveCS1000Space` 的同时添加第二个索引：\n\n```\nhadoop jar splout-hadoop-*-hadoop.jar\
  \ simple-generate –it HIVE –hdb TrackInfo –htn AveCS1000View -o out-TrackingInfo_splout_example\
  \ -pby Corporation -p 1 -idx \"TotalCustSup\" -t AveCS1000View -tb AveCS1000Space\n\
  ```\n\n我没有包含列 `Corporation`，因为它是一个分区列，并且已经被索引了。`-idx` 选项只是向索引中添加更多列。另外，请注意我正在使用一个不同的生成器（`simple-generate`）而不是之前使用的那个（`generate`），因此命令行选项是不同的。没有\
  \ json 配置文件，因此所有配置（例如 Hive 数据库、表名、分区列等）都必须通过命令指定。\n\n使用 `simple-generate` 而非 `generate`\
  \ 的一个主要缺点是，你的表空间中只能有一个表，但这通常是常见情况。以追踪信息系统为例，如果你需要补充索引的话，则需要为四个批处理视图（或 Hive/Splout\
  \ 表）生成四个独立的表空间。如果不需要，那么你可以简单地创建一个包含所有四个表的单一表空间（使用 `generate` 生成器而不是 `simple-generate`）。\n\
  \n成功生成表空间后，按如下方式部署它：\n\n```\nhadoop jar splout-hadoop-*-hadoop.jar deploy -q http://localhost:4412\
  \ -root out-TrackingInfo_splout_example -ts AveCS1000Space\n```\n\n请注意，`localhost`\
  \ 是 QNode（客户端连接到的节点）运行的主机，`localhost` 将在运行时自动被替换为第一个有效的私有 IP 地址（按配置文件中的指定）。\n\n\
  一旦表空间部署完毕，你就可以在任何查询中使用它。例如，如果你需要使用丰田汽车公司的信息来填充一个网页应用，你可以像下面这样使用 REST API：\n\n```\n\
  http://localhost:4412/api/query/ AveCS1000Space?sql=SELECT * FROM AveCS1000View;&key='Toyota\
  \ Motors'\n```\n\n我已经演示了如何成功地使用 `Splout SQL` 来提供批处理视图，供你的应用程序使用。接下来，我将讨论如何访问尚未被批处理层处理的数据，并将其包含在你的查询结果中。\n\
  \n### 速度层\n\n你已经看到，批处理层的延迟使得访问最新或近乎实时的数据变得困难。速度层的目的是使这些数据能够无延迟地可用。在功能方面，速度层与批处理层非常相似（因为它也基于主数据生成视图）。不同之处在于，速度层只处理新的或最近的数据（尚未被批处理层处理），而批处理层则使用所有数据来计算视图。\n\
  \n另一个区别是，批处理层通过重新计算（或重建）来更新视图，而速度层则对视图执行增量处理，并且只处理自上次增量处理之后发生的增量（或新）事务。因此，如果您的传入数据事务带有时间戳，并且您从主数据集中提取它们，那么根据记录是被修改还是新增，您可以相应地修改速度层视图。\n\
  \n考虑到速度层处理（与批处理层相比）的差异，您会意识到速度层的架构会根据速度层（或近乎实时）视图是同步更新还是异步更新而有所不同。\n\n我所说的同步更新是指将主数据的任何更新直接应用到速度层视图。由于集群总是有固定或预设的容量（用于处理更新或任何其他数据密集型操作），因此在高峰使用期间，它可能会因请求而过载。这可能会影响性能和功能（如果某些请求由于资源不可用而被拒绝）。相比之下，异步更新请求被放入队列中，实际的更新在稍后时间发生。应用异步更新的延迟将取决于许多因素，例如更新量、所需的（和可用的）处理资源、对近乎实时数据的功能需求等，但它确实提供了一种有效的方式来容纳更多数量的请求，并且不受高峰使用峰值的影响。\n\
  \n异步更新提供了许多好处，例如处理来自队列的多个消息、提高吞吐量以及通过缓冲额外请求来处理变化的负载（直到负载减少且处理资源可用）。同步更新没有这些好处，因为没有可用的机制来控制更新量，因此它很容易使数据库系统过载和崩溃，或导致请求被丢弃、超时以及其他可能中断应用程序的错误。\n\
  \n使用同步还是异步更新的决定也可以基于应用程序执行的处理类型。例如，同步更新可用于需要用户交互的事务系统，这需要与用户界面协调，并且需要保证请求的完成。异步更新对于分析型应用或更侧重于复杂计算和聚合而非交互式用户输入的应用更为有用。考虑到异步处理的好处，我建议使用它，除非您有非常特殊的需求需要将实时数据整合到速度层视图中。\n\
  \n### 实现速度层所需特性\n\n总而言之，在实现速度层时，您需要支持以下特性：\n\n-   随机读写\n-   支持广泛的数据类型，包括日期/时间\n\
  -   能够执行计划内或临时的更新\n-   能够以可接受的性能水平支持连接和任何增量更新任务（更新、插入）\n-   支持索引并提供 SQL 查询接口，以实现高性能和易用性\n\
  -   能够轻松地与 Hadoop 生态系统对接\n-   提供可扩展性和容错性\n-   能够提供内存处理以提高性能\n\n\n\n"
- '# 面向实时 Hadoop 应用的 Lambda 架构


  在仔细评估了各种选项后，我筛选出了 `Spark SQL` 和 `VoltDB`。然而，我很快意识到 `VoltDB` 无法从 Hive（或 HDFS）读取数据，因此将其排除。虽然在比较这两个选项时，我发现
  `Spark SQL` 自身也存在一些缺陷，并且，尽管这些缺陷与我举例说明的场景关系不大，但在某些情况下可能至关重要。它们是：


  - `Spark SQL` 不支持事务。

  - `Spark SQL` 的 DataFrame 不支持索引。索引有助于提升随机读/写性能。

  - `Spark SQL` 本身不含存储功能，因此你需要使用外部数据存储。


  我在第 5 章的“[查询工具](http://dx.doi.org/10.1007/978-1-4842-1287-5_5)”一节以及“Spark SQL”小节中详细讨论了
  `Spark SQL`。这有助于你理解 Spark 架构以及 `Spark SQL` 在其中所处的位置。现在，让我演示如何将 `Spark SQL` 用作速度层。我已经演示了如何为跟踪信息系统构建批处理层和服务层。现在我将构建一个速度层。


  Lambda 架构将速度层定义为由批处理层尚未处理的记录组成。因此，第一步需要确定哪些是尚未处理的记录。你或许还记得，在构建批处理视图后，会向 `BatchProcHist`
  表中插入一条历史记录。因此，批处理视图的最新记录可以告诉我们最近一次构建的日期/时间，从而有助于确定哪些是未处理的记录。由于 Hive 不支持将查询结果赋值给变量，我将把第一个批处理视图的最新记录写入一个表：


  ```sql

  Create table MaxTable as select ViewName, max(CreatedAt) as MaxDate from

  BatchProcHist group by ViewName having ViewName = ''ProfLFiveView'';

  ```


  但是，如果在此批处理视图构建之后，速度层已经处理了主数据集中的任何新记录，会发生什么？嗯，你需要检查这一点，并仅考虑未处理的记录来更新视图（此视图现在是注册为表的
  Spark DataFrame）。我将速度层视图称为 `ProfLFiveView_S`。与批处理视图类似，速度层视图也会写入审计表 `BatchProcHist`。因此，我将把第一个速度层视图的最新记录写入同一个表（即我之前捕获第一个批处理视图最新记录的表）：


  ```sql

  Insert into MaxTable select ViewName, max(CreatedAt) from BatchProcHist

  group by ViewName having ViewName = ''ProfLFiveView_S'';

  ```


  现在，我只需要确定这些记录中哪一条是最新的，并以此为基础来处理第一个速度层视图的记录：


  ```sql

  Create table MaxTbl1 as select max(MaxDate) as MaxDate from MaxTable;

  ```


  最后，从主数据集中获取未处理的记录，并创建速度层视图。同时，添加时间戳并向审计历史表中写入一条记录：


  ```sql

  Create table Profitemp1_S as Select a.ProfLastYear, a.AsOf, a.Corporation

  from CorpProfitDetails a, MaxTbl1 b where a.AsOf > b.MaxDate;


  Create table ProfLFiveView_S as select Corporation, sum(ProfLastYear) as

  ProfLastFive from Profitemp1 group by Corporation


  INSERT INTO TABLE BatchProcHist

  VALUES (''ProfLFiveView_S'', from_unixtime(unix_timestamp());

  ```


  此时可以删除临时表 `MaxTable`、`Profitemp1_S` 和 `MaxTbl1`。另请注意，在创建视图 `ProfLFiveView_S` 时，我并没有使用
  `having sum(ProfLastYear) > 0` 这个条件。原因是这个总和仅针对过去五年盈利的公司的那些新记录。要获取最新的总和，需要将其与批处理层的总和相加，更新的利润将自动确定（新记录的总利润或亏损将由正数或负数来体现）。


  假设速度层视图每周构建一次。那么，当你需要更新速度层视图以适应新数据并移除已属于批处理层视图一部分的数据时（如果批处理层视图在此期间被重建），会发生什么？


  有两种可行的方法：


  -   仅考虑未处理的记录来重建速度层视图（就像我们第一次构建的那样）。

  -   在第一轮处理之后不要删除临时表 `Profitemp1_S`，而是从中删除已过期的记录（这些记录已是重建后的批处理视图的一部分）并添加新记录。然后，只需执行聚合操作并重建速度层视图
  `ProfLFiveView_S`。


  请记住，要执行删除操作，你需要更改 Hive 的 CRUD 支持配置，并为表 `Profitemp1_S` 启用事务支持（在批处理层视图部分已讨论过）。


  我会根据速度层视图的大小来决定选择哪种方案。如果视图不算特别大并且可以快速重建，我会选择重建方案。然而，如果视图很大，需要大量的处理和时间来重建，我会启用事务支持，只需向临时表
  `Profitemp1` 中添加新记录并移除已处理（由批处理层处理）的记录。可以使用相同的逻辑（如本节前面所述）来获取批处理和速度层视图的最新处理日期/时间，然后根据需要从主数据集中检索未处理的记录。在调整了
  `Profitemp1` 表中的记录（删除过期记录并添加未处理记录）之后，即可执行聚合操作以构建更新后的视图。


  另一个需要考虑的关键点是速度层处理对批处理层处理的依赖。至少，你需要过期或移除已被批处理层处理的速度层记录。当然，你也可以重建或向速度层视图中添加任何新记录。


  接下来，我将讨论为第二个批处理视图构建速度层视图。你可能还记得，这涉及计算平均值（过去五年平均客户支持人员数量等于或超过 1,000 的公司）。我将讨论如何为对应的速度层视图计算更新后的平均值。


  作为第一步，我们获取视图 `AveCS1000View` 的最远处理时间（批处理层和速度层）：


  ```sql

  Create table MaxTable as select ViewName, max(CreatedAt) from BatchProcHist group
  by ViewName having ViewName = ''AveCS1000View'';


  Insert into MaxTable select ViewName, max(CreatedAt) from BatchProcHist

  group by ViewName having ViewName = ''AveCS1000View _S'';

  ```


  现在，我只需要确定这些记录中哪一条是最新的，并以此为基础来处理第一个速度层视图的记录：


  ```sql

  Create table MaxTbl1 as select max(MaxDate) as MaxDate from MaxTable;

  ```


  最后，从主数据集中获取未处理的记录，并创建速度层视图。同时，添加时间戳并向审计历史表中写入一条记录：


  ```sql

  Create table CustSuptemp1_S as Select a.CustSuppStrength, a.AsOf,

  a.Corporation from CorpCustSupDetails a, MaxTbl1 b where a.AsOf > b.MaxDate;


  Create table CustSuptemp2_S as select Corporation, sum(CustSuppStrength) as TotalCustSup,
  count(CustSuppStrength) as CountCustSup from CustSuptemp1_S

  group by Corporation;


  Create table AveCS1000View_S as select a.Corporation, (a.TotalCustSup +

  b.TotalCustSup) as TotalCustSup, (a.CountCustSup + b.CountCustSup) as

  CountCustSup, ((a.TotalCustSup + b.TotalCustSup) / (a.CountCustSup +

  b.CountCustSup)) as AveLastFive from CustSuptemp2_S a, AveCS1000View b where a.Corporation
  = b.Corporation and (AveLastFive >= 1000)


  INSERT INTO TABLE BatchProcHist

  VALUES (''AveCS1000View_S'', from_unixtime(unix_timestamp());

  ```




  请注意，我不得不使用一个额外的临时表，以便能够为未处理的记录以及来自相应批处理视图的记录添加并计数 `CustSuppStrength` 数值——因为该视图计算的是平均值。


  在讨论了开发速度层的所有这些逻辑之后，让我转向使用 Spark 的接口和速度层的实现。如你所知，Spark 使用数据框和 RDD（弹性分布式数据集）作为内存结构，你可以利用它们进行查询和性能优化。Spark
  还允许你使用 `SQLContext` 对 Hive 数据库执行查询。这两个概念对于速度层的实现都很有用。你可以在 Spark shell 中使用 Scala、Python
  或 R。


  首先，你需要构建一个 `HiveContext`，它继承自 `SQLContext`，使你能够查找 Hive MetaStore 中的表，并支持使用 HiveQL
  进行查询。你不需要现有的 Hive 部署来创建 `HiveContext`。如果没有指定 Hive 配置和目录的 `hive-site.xml`，该上下文会自动在当前目录中创建
  `metastore_db` 和 `warehouse`。这里，我使用 Scala，并且 `sc` 是一个现有的 `SparkContext`：


  ```scala

  val sqlContext = new org.apache.spark.sql.hive.HiveContext(sc)

  ```


  ```sql

  val sqlContext.sql("Create table MaxTable as select ViewName, max(CreatedAt) from
  BatchProcHist group by ViewName having ViewName = ''AveCS1000View''")

  val sqlContext.sql("Insert into MaxTable select ViewName, max(CreatedAt) from BatchProcHist
  group by ViewName having ViewName = ''AveCS1000View _S''")

  ```


  你可以类似地执行所有必要的 HiveQL 命令来创建速度层视图 `AveCS1000View_S`。对于最后一步（当视图创建时），你可以不创建视图，而直接执行
  select 语句并将结果读入数据框，如下所示：


  ```scala

  val resultsDF = sqlContext.sql("select a.Corporation, (a.TotalCustSup + b.TotalCustSup)
  as TotalCustSup, (a.CountCustSup + b.CountCustSup) as CountCustSup, ((a.TotalCustSup
  + b.TotalCustSup) / (a.CountCustSup + b.CountCustSup)) as AveLastFive from CustSuptemp2_S
  a, AveCS1000View b where a.Corporation = b.Corporation and (AveLastFive >= 1000)")

  ```


  你可以将结果数据框注册为临时表，然后对其执行任何查询：


  ```scala

  val resultsDF.registerTempTable("AveCS1000View _S")

  val results = sqlContext.sql("SELECT Corporation FROM AveCS1000View _S")

  ```


  你需要使用一个能够从 Hive 和 Spark 读取数据的查询工具，以结合批处理层和速度层视图的结果。有足够多的选择，当然你也可以使用 Spark SQL 作为查询工具。


  关于 Hive 和 Spark SQL 的集成，有几点需要注意。由于 Hive 依赖项数量庞大，它并未包含在默认的 Spark 程序集中。你可以通过向 Spark
  的构建添加 `-Phive` 和 `-Phive-thriftserver` 标志来启用 Hive 支持。这将构建一个新的包含 Hive 的程序集 jar。确保此
  Hive 程序集 jar 存在于所有数据节点上，因为它们需要访问 Hive 的序列化和反序列化库（SerDes）才能访问存储在 Hive 中的数据。


  此外，通过将你的 `hive-site.xml` 文件复制到 `$HADOOP_HOME/conf` 目录中来提供 Hive 配置。请注意，如果你使用的是 YARN
  集群（`yarn-cluster` 模式），则 datanucleus 的 jar 文件应位于 `lib_managed/jars` 目录中，而 `hive-site.xml`
  应位于 `$HADOOP_HOME/conf` 目录下，以便 YARN 集群启动的驱动程序和所有执行器使用。实现这一点的最简单方法是通过 `spark-submit`
  命令的 `--jars` 选项和 `--file` 选项来添加它们。


  人们常说 Lambda 架构最大的问题在于需要为批处理层和速度层维护两套独立的代码。通过使用 Spark SQL 和 Hive，我认为无需维护两套代码——一套就够了。这无疑简化了实现。




  ### 使用 Lambda 架构的优缺点


  `Lambda` 架构定义了批处理和流处理如何协同工作，以在使用 `NoSQL` 解决方案的同时提供完整的解决方案。`Lambda` 架构使你能够以近乎实时的方式高效地对所有数据运行即席查询。


  其核心理念是将结果预计算为一组视图，并查询这些视图而非主数据集。与传统的 `NoSQL` 架构（或缺乏架构的情况）相比，该架构提供了诸多优势，并重新定义了 `NoSQL`
  和 `Hadoop` 在数据处理中的角色。然而，`Lambda` 架构也存在一些问题。它无法解决你所有的数据处理难题。本节将讨论 `Lambda` 架构的优缺点，首先从优点开始。


  ## Lambda 架构的优点


  最常被讨论的优点之一是数据的不可变性。此外，存储层和查询层可以拥有不同的存储结构。另一个受欢迎的特性是 `Lambda` 架构的重新处理能力。下面简要介绍所有这些特性：


  -   `Lambda` 架构强调数据的不可变性。输入数据被保留且不做任何更改。处理并转换后的数据会单独写出，但始终可以访问其原始形式接收到的输入数据。这也保护了数据免受人为错误或硬件故障的破坏，并增强了架构的弹性。


  -   数据通过一系列模块化阶段进行转换，这有助于调试（每个阶段独立进行），并使工作流程易于管理。


  -   可以轻松地重新处理数据（再次处理输入数据以重新导出输出）。为什么需要这样做？你的应用程序中总有可能存在代码变更（由于功能变更或发现问题/错误）。如果使用修改后的代码从输入流中导出输出数据，你将需要使用新代码重新处理输入。回想一下，每次处理新数据时，批处理层都会被重建。因此，默认情况下就支持和执行数据的重新处理。


  -   `Lambda` 架构使你能够以规范化形式存储主数据集，同时根据需要在反规范化实时视图和批处理视图时提供灵活性。这有助于提升对 `NoSQL` 数据的查询性能，因为
  `NoSQL` 数据库通常不擅长处理连接或子查询。数据分离还允许你根据需要微调每个数据层。


  -   主数据集（作为不可变的数据存储）可以作为可靠的分析来源。由于它包含所有应用程序数据的完整记录或历史，因此可以分析任何数据子集或在其中寻找模式。


  -   `Lambda` 架构便于在你的查询中使用近乎实时的数据。


  ## Lambda 架构的问题


  `Lambda` 架构有很多有用的特性，但它能适用于所有情况和所有类型的数据吗？在使用它时是否存在任何需要解决的固有弱点或缺陷？我将探讨这些问题的答案以及更多内容：


  -   `Lambda` 架构（以及`Nathan`）假设实时处理与批处理相比准确性更低、能力更弱且不必要地更复杂。这并不一定正确。例如，许多领先的流处理系统（`Storm`、`Spark`、`Amazon
  Kinesis`）能够提供与任何批处理系统一样强大的语义保证。


  -   “`Lambda` 架构击败了 CAP 定理”的说法是不正确的。`Lambda` 本质上是一种用于异步处理的架构。因此，计算出的结果与输入数据并不立即保持一致。


  -   `Lambda` 架构的一个大问题是你需要在两个独立的分布式系统（分别用于批处理层和速度层）中维护代码（这些代码需要产生相同的结果）。由于你需要专门为代码所运行的框架进行工程化设计，因此实现
  `Lambda` 架构的系统所产生的操作复杂性是巨大的。


  解决此问题的一种建议方法是使用一种能够抽象化实时框架和批处理框架的语言或框架。这样，你的代码可以根据需要用于流处理或`MapReduce`。`Kappa` 架构和`Butterfly`
  架构（由 `Milind Bhandarkar` 提出）旨在克服这个问题。本章将讨论这两种架构。


  -   管理和调优两个操作系统（分别用于批处理层和速度层）的运营负担非常重。此外，每当你计划添加新功能时，你只能考虑那些两个系统都能支持的功能。这可能会阻止你使用流行的
  `Hadoop` 组件和工具，例如 `Hive`、`Pig`、`Crunch`、`Cascading`、`Oozie` 等。


  `Lambda` 架构有其优缺点，并不适用于所有类型的数据或业务目标。目前已有一种名为 `Kappa` 的替代方案，我将在下一节中介绍。


  ## Kappa 架构


  2014 年夏天，`Jay Kreps` 在 `O’Reilly Radar` 的一篇文章中创造了 `Kappa` 架构这个术语。`Jay` 只是在评论 `Lambda`
  架构及其问题。那么，什么是 `Kappa`？它与 `Lambda` 有何不同？


  概念非常简单。使用一个允许你保留可能需要重新处理的数据的完整日志的流处理引擎（`Spark`、`Kafka` 等）。如果需要重新处理，则启动流处理作业的第二个实例，该实例将从所保留数据的开头开始处理，并将输出写入新的目标位置（如表或文件）。当第二个作业完成处理后，将应用程序切换为从新的输出目标位置读取数据。之后，你可以停止旧版本的作业并删除旧的输出目标位置。图
  9-8 展示了 `Kappa` 架构。


  ```

  客户端


  流处理引擎


  查询

  请求


  当前流

  当前作业的输出

  处理作业


  输入数据

  流


  新流

  新作业的输出

  处理作业


  服务层

  ```


  **图 9-8.** *Kappa 架构*


  设计 `Kappa` 架构的原因之一是为了避免为批处理层和速度层维护两个独立的代码库。此外，如果批处理层和速度层被流处理层（由流处理引擎处理）取代，那么单一流处理引擎需要处理实时数据处理以及持续的数据重新处理（当代码更改时需要重新处理数据）。


  因此，`Kappa` 架构包含两层：流处理层和服务层。流处理层负责执行流处理作业。通常，一个流处理作业负责实时数据处理。如果流处理作业发生代码更改并且需要重新处理数据，则额外执行修改后的流处理作业以完成该任务。服务层用于查询结果。


  各种开源技术，如 `Apache Kafka`、`HBase`、`HDFS`、`Spark`、`Drill`、`Storm` 或 `Samza`，都可以用来实现
  `Kappa` 架构。例如，可以使用像 `Apache Kafka` 这样的*发布-订阅*消息系统来摄取数据。`HDFS` 可用于持久化存储。任何低延迟系统（如
  `Apache Storm`、`Samza` 或 `Spark Streaming`）都可用于实现 `Kappa` 架构中的流处理层。


  现在，可以使用 `Apache Spark` 来开发 `Lambda` 架构中的批处理层和速度层（以实现单一代码库）。服务层可以使用 `Apache Drill`
  通过 `Splout` 查询来实现。如何在两种架构之间进行选择？这取决于需要实现的应用程序的特性。




  例如，当需要应用于实时数据和历史数据的算法完全相同时，采用`Kappa 架构`是一个很好的选择。但如果实时算法和批处理算法的预期输出不同，那么批处理层和实时层就无法合并，此时必须使用`Lambda
  架构`。是否存在这种情况呢？考虑这样一个场景：你的批处理层需要处理十亿条记录，并计算每日和每周平均值。此时，生成批处理模型将耗费大量时间和资源，以至于你需要使用近似模型来计算实时视图。因此，你无法合并批处理层和实时层的处理流程，也就不能使用`Kappa`——`Lambda`将是唯一可能的模型。


  我已经强调了`Kappa 架构`的多个优势，但你需要明白，它并非适用于所有场景。它不能解决你所有的大数据处理问题。当然还有其他替代方案，例如由 Michael
  Hausenblas 提出的`Zeta 架构`或`Iot-a`。目前已有多种架构方案可供选择，你应该评估自身环境，并根据你的数据、处理需求、业务目标和可用硬件资源做出审慎决策。


  '
- '# 第九章 ■ 实时 Hadoop 应用的 Lambda 架构


  ## 未来架构 1


  正如我们目睹当前数据架构的变革，传统 RDBMS 正被大规模非关系型存储（如`HDFS`、`MongoDB`、`Cassandra`和`HBase`）所补充一样，一场更为根本的转变正在到来，它将要求对现代数据架构进行更大规模的改动。虽然当前的转变是由互联世界的业务需求所驱动，但下一波浪潮将由运营成本优化、底层基础设施技术的变革性改进，以及物联网
  (IoT)、深度学习、对话式用户界面 (CUI) 等新型用例所主导。


  为了对数据架构的未来走向做出大胆推测，让我们简要回顾一下我们是如何走到当前数据架构这一步的。


  ### 一点历史


  在关系型数据库普及之前，多种数据模型曾被使用，其中层次型和导航型数据系统在基于大型机的系统中得到了广泛应用。由于这些数据系统的客户端数量有限，它们仍然是单体式的，并且通常由大型机制造商提供，与硬件捆绑销售。


  随着关系模型被提出（超过 40 年前）并被认定适用于大多数数据应用，它在银行、保险和金融服务行业的常见用例中变得非常流行。关系型数据库系统成为各行各业默认的后端数据系统（作为记录存储）。


  客户端-服务器系统（多个客户端访问同一台服务器存储和提供的数据）的出现，使得前期数据建模、`SQL`、正式的数据操作语义（`ACID`）变得重要，这带来了查询并发性的改进、基于规则和基于成本的查询优化、以及标准访问方法（`ODBC`和`JDBC`），并最终产生了大量用于构建数据库支持的应用和数据可视化的可视化工具。


  客户端对这些操作型数据库的访问，混合了针对单条或极少记录的`CRUD`原语操作。为了在多个`CRUD`操作之间提供一致性，引入了事务的概念（即要么所有操作都原子性地执行，要么全部不执行）。因此，这些数据系统被称为`OLTP`（在线事务处理）系统，其性能以每秒事务数来衡量。


  大多数商业智能 (BI) 和报表工作负载使用截然不同的访问模式。这些查询主要是对大量历史数据的只读查询。尽管操作型数据系统最初被用于同时处理事务型和分析型工作负载，但它们无法同时满足低延迟事务和高吞吐量分析的需求。因此，为了服务于这类新型应用，专门用于`OLAP`（在线分析处理）的数据系统被设计出来。


  > 1 本节由 Ampool, Inc. 创始人 Milind Bhandarkar 博士友情贡献。Milind 的简要介绍包含在他所写的序言中。


  '
- '# 第九章 ■ 实时 Hadoop 应用的 Lambda 架构


  由于这些`OLAP`系统必须处理大量历史数据，它们通常被构建为基于无共享分布式架构的`MPP`（大规模并行处理）系统。这在组织内部造成了两种结构化数据的孤岛——一种用于结构化事务，另一种用于结构化分析。尽管这两种系统都是为了应对关系数据模型而设计的，但通常需要跨多个部门集成多个事务型数据存储，才能为分析型数据系统提供完整的历史数据。因此，定期进行`ETL`（提取-转换-加载）的概念应运而生，它会捕获多个事务型数据存储中的数据变更，映射它们之间的关系，并将其按照星型模式或雪花型模式结构化到事实表/维度表中。分析型查询引擎及其存储与事务型对应物截然不同，因为一旦存储，分析型数据几乎永远不需要更改（因为它是对业务交易的历史记录）。


  在结构化的操作型和分析型数据存储世界中，半结构化数据（如服务器日志）和非结构化数据（如客户互动中的自然语言交流）要么被丢弃，要么被保存在归档存储中以备合规要求。集中式文件系统对于半结构化和非结构化的历史数据集成为一种流行的数据存储选择，并配有专门的访问层（如关键字搜索）。


  `Apache Hadoop` 旨在通过在商用硬件上提供`HDFS`，并将其与名为`MapReduce`的批处理导向的灵活分布式数据处理范式相结合，来解决半结构化和非结构化数据分析工作负载的问题。随着`Hadoop`生态系统的扩展，它开始处理越来越多的数据处理工作负载。因此，出现了诸如`Pig`之类的脚本语言、类似
  SQL 的查询语言（如`Hive`），以及一个使用`HDFS`进行持久化存储的 NoSQL 存储`HBase`。


  最终，计算资源管理能力与批处理导向的编程模型分离开来，使得大量数据处理框架能够在`HDFS`中存储的数据之上运行。这些框架包括传统的`MPP`数据仓库（如`Apache
  HAWQ`）、流式分析系统（如`Apache Apex`）和事务型 SQL 引擎（如`Apache Trafodion`）。这催生了数据湖的概念，即所有企业内部和外部数据源的原始数据都会被加载到一个湖中，并可使用同类最佳的数据处理引擎在同一份粒度数据上进行灵活分析。


  尽管`Apache Hadoop`及其相关项目已经迅速发展，试图提供一个统一的分析平台，但`Hadoop`的核心关键组件`HDFS`从未被设计用于处理交互式、流式和事务型工作负载，因此反而成为了实现这一目标的障碍。结果，诸如`Lambda`和`Kappa`架构等多种架构被提出（以统一多种数据处理工作负载）。不幸的是，它们的实现仍然相当困难。



  好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。



  '
- '# Lambda 架构及其挑战


  对于 Lambda 架构而言，速度层、服务层和批处理层需要针对相同功能（取决于所需的速度和规模）使用三种不同的数据处理框架实现，并且实现者负责在这三层之间传输数据——这是一项艰巨的任务。此外，如果不引入另一个分布式事务引擎（在数据应用和
  Lambda 架构之间），就无法保证这三层之间的数据一致性。


  '
- '# Kappa 架构


  Kappa 架构由 Apache Kafka 的创建者提出，它依赖于分布式日志作为数据的主要来源。*分布式日志*实现了数据生产者和数据消费者之间的解耦。它允许不同的批量分析引擎和流式分析引擎从同一个数据总线消费数据，从而解决了
  Lambda 架构中引入的数据一致性问题。但是，在速度层、服务层和批处理层中使用三种不同引擎进行数据处理的困难仍然存在。


  在同一个统一架构中实现速度层、服务层和批处理层的主要困难在于 Hadoop 生态系统中分布式文件系统的缺陷。如果我们能够提供一个 HDFS 的替代品（或者，我们能够用一个存储组件来增强
  HDFS，使其既能服务于速度层和服务层，又能与 HDFS 保持数据一致性以用于批处理），那么我们就可以真正提供一个统一的数据处理平台。这一观察引出了下面将要描述的
  Butterfly 架构。


  '
- '# Butterfly 架构


  Butterfly 架构的主要意图是，在一个单一平台上统一批处理层、服务层和速度层的数据处理任务。要实现 Butterfly 架构，我们需要使用新的、更通用的抽象来处理数据，这些抽象不同于当前的抽象（例如文件、目录或表和索引）。在
  Butterfly 架构中，我们将数据组织为三种抽象的集合：


  -   **数据集（Datasets）**：这是最灵活的抽象，是任意记录的分区集合。记录没有强加任何结构。换句话说，记录中内容的解释留给了处理框架，并借助系统目录来完成。这相当于读取时定义模式（schema-on-read）的数据，这是当前
  Hadoop/NoSQL 数据系统管理的唯一数据类型。系统目录存储了关于每个数据集的信息（以及多个数据集之间的关系）。每个数据集都有一个唯一的标识符，目录是一组逻辑上的
  RDF 三元组，表示为 `(Relation, Object1, Object2)`。例如，为了表示 ID 为 `4596` 的数据集被命名为 `SearchLog`，目录中有一个条目
  `(NameOf, 4596, "SearchLog")`。再举一个例子，为了表示数据集 `4596` 的位置在 HDFS 中，系统目录中存在一个条目 `(Location,
  4596, "hdfs://namenode:port/user/data/something")`。请注意，这是关于数据集系统元数据的逻辑表示，为了效率考虑，可以在物理上表示为一组固定宽度的表。这些数据集可以存储在多个存储系统上，甚至单个数据集的多个分区也可以分布在多个存储后端上。此外，当数据集以字节流形式存储在文件中或通过网络传输时，其序列化和反序列化格式由用户或操作员定义。


  -   **数据框（Dataframes）**：数据框是结构化的数据集。它们使用包含在单个记录中的用户指定的分区键进行分区。数据框可以是可变的或不可变的。*不可变*数据框（一旦创建）不能以任何方式进行修改，而可变数据框的单个记录可以插入、更新或删除。它们通常由多个计算框架通过处理数据集而创建。数据框与关系数据库管理系统（RDBMS）中预定义模式的结构化表非常相似。不可变数据框适用于分析型工作负载，而可变数据框用于事务性的增删改查（CRUD）工作负载。


  -   **事件流（Event streams）**：事件流是无界的数据框。这些记录（事件）中的至少一个字段大多是单调递增的。通常，这个字段是时间戳或序列号。可选地，流可以指定窗口大小，要么是记录数（对于单调递增字段，则是其序列号），要么是时间跨度（对于单调递增字段，则是其时间戳）。在一个窗口内，事件可能出现一些乱序到达。然而，在窗口之间，序列号或时间戳是严格单调递增的。


  Butterfly 架构的主要区别特征在于，在以上每种数据抽象之上，计算范式的灵活性。因此，多种计算引擎，例如 MPP SQL 引擎（`Apache Impala`、`Apache
  Drill` 或 `Apache HAWQ`）、`MapReduce`、`Apache Spark`、`Apache Flink`、`Apache Hive`
  或 `Apache Tez`，都可以处理数据集、数据框和事件流。


  这些计算步骤可以串联起来形成*数据管道（data pipelines）*，并由外部调度器编排。一个资源管理器（与可感知数据的可插拔资源调度器相关联）是实现 Butterfly
  架构的必需品。`Apache YARN` 和 `Apache Mesos`，以及编排框架（例如 `Kubernetes` 或混合资源管理框架，如 `Apache
  Myriad`（孵化中））在过去几年中已经出现，以履行这一角色。Butterfly 架构及其相关的数据流如图 9-9 所示。


  ![Image 48](img/index-260_1.jpg)


  **图 9-9.** Butterfly 架构


  ## Butterfly 架构的存储


  为了高效地实现 Butterfly 架构，需要一个快速的存储引擎，用于跨数据管道的数据交换，以及流式数据摄入和分析。需要为不可变和可变数据框提供优化的实现，以支持快速的批量查询和快速的事务处理，从而允许在单个系统中共存多种工作负载。传统的基于磁盘的存储系统使得这种统一变得极其困难。然而，NVMe
  连接的闪存、NVDIMM（非易失性内存模块）以及新一代持久内存（SCM，即存储级内存）的出现，为高吞吐的扫描导向型工作负载和低延迟的随机访问工作负载提供了可以共存的完美存储介质。表
  9-1 描述了各种存储层的当前和预期性能，以及它们的大致相关成本。


  **表 9-1.** 存储类型及其成本


  | 存储类型 | 每 GB 大致成本 | 每 GB 的 I/O OPS/秒 | 每 GB 的吞吐量 | 十亿 IOPS 成本 | 每秒 GB 级别吞吐量的成本
  |

  |---|---|---|---|---|---|

  | DRAM | $6 | 2000 万 | 50 GB/s | $300 | $0.12 |

  | SCM | $2 (预计) | 1000 万 | 10 GB/s | $200 | $0.20 |

  | NAND Flash | $0.50 | 100 万 | 1 GB/s | $500 | $0.50 |

  | HDD | $0.03 | 100 MB/s | 100 MB/s | $30,000 | $0.30 |




  正如表 9-1 所示，当前一代 DDR4 DRAM 对于吞吐量密集型工作负载最具成本效益，而新兴的存储级内存（SCM）对于随机访问工作负载最具成本效益。当然，成本并非构建系统的唯一考量因素——存储密度和功耗也是另外两个需要考虑的因素。由于新型
  SCM 有望比 DRAM 拥有高得多的密度和低得多的功耗，它们有潜力成为快速统一数据平台的主存储层。


  大多数现有的数据库和数据存储系统都是基于 HDD 的性能特征和存储密度设计的。因此，它们倾向于不惜一切代价避免随机访问，并且为了避免长延迟，它们倾向于通过将数据分布在磁盘阵列中的多个硬盘驱动器上，或者昂贵的服务器端
  DRAM 中预先获取所有数据，同时在存储在硬盘驱动器上的数据上运行顺序访问工作负载，来实现随机访问工作负载的并行化。因而，它们引入了大量复杂性来保证数据在不同工作负载间的一致性及可用性（以防磁盘故障）。此外，硬盘驱动器（含有机械部件）比
  Flash、SCM 和 DRAM 等固态设备更容易发生故障。


  为了完全实现蝴蝶架构，需要经济高效地利用各种类别的固态内存。Ampool 正在构建一种新颖的存储技术来实现蝴蝶架构。


  ## Ampool


  Ampool 的核心产品是一种以内存为中心、分布式、数据感知的对象存储，针对事务和分析工作负载进行了优化。Ampool 产品的这些特性将在下一节中讨论：


  **以内存为中心**：尽管多年来 DRAM 成本迅速下降，但与其他存储介质（如 SSD 和硬盘驱动器）相比仍然非常高昂。幸运的是，在企业中需要分析的数据并非全都需要
  DRAM 所提供的性能。此外，随着数据老化，其被访问的频率会越来越低。因此，冷数据可以存储在硬盘驱动器上，温数据可以存储在 SSD 上，而只有最常访问（且需要最快访问速度）的数据才能存储在
  DRAM 中。手动在这些存储层之间移动数据既繁琐又容易出错。Ampool 实现了智能分层，可以监控数据的使用情况，并在数据被不频繁访问时自动在各层之间移动数据。


  **分布式**：尽管多年来 DRAM 和存储密度大幅增加，但向单个系统添加越来越多的 DRAM 和存储（垂直扩展）并不会使整体系统性能与成本成比例地扩展。因此，即使是内存中心的存储系统也需要进行集群和分布式设计，以实现线性扩展、容错和灾难恢复。Ampool
  存储从一开始就被设计为分布式系统。数据在集群中不同机器的地址空间之间进行复制（以实现高可用性）。此外，数据的变更通过跨广域网的可扩展消息总线进行传播（以实现灾难恢复）。


  **对象存储**：从历史上看，最常见的存储系统类型分为块存储或文件系统。两者各有优势。*块存储*可以跨不同的操作系统共享，并且访问随机数据块的开销要低得多。然而，对于当今大规模数据工作负载而言，为获取单个数据块而进行的网络往返往往是不够的。此外，由于读写的基本单元是
  4 KB 的块，小的更新（以及小的读取）会导致网络或本地磁盘上产生大量不必要的数据流量。文件系统是最常用的存储抽象，并存在于多种操作系统的各种版本中。此外，有多家供应商提供多种可扩展的分布式文件系统。但是，实现文件系统语义（涉及维护和遍历分层命名空间结构）、维护文件系统操作的一致性和原子性、以及在文件中实现原地随机读写，会给文件系统服务器（以及客户端）带来大量开销。通常，文件系统的读/写访问有
  50–100 微秒的延迟。当文件系统构建在缓慢的旋转磁盘（其延迟为 10 毫秒）之上时，与底层存储介质的延迟相比，文件系统的延迟可以忽略不计。然而，对于只有几微秒延迟的新型快速随机访问存储（如
  SSD 和 NVRAM），文件系统抽象的开销变得极其高昂。


  ![图 49](img/index-263_1.jpg)


  在过去十年中，由于公有云及其托管存储解决方案的出现，第三种存储抽象——对象存储——变得流行起来。对象存储具有扁平化的层级结构。要访问一个对象，只需要一个桶 ID
  和一个对象 ID（而非遍历分层命名空间）。此外，对象存储为每个对象和桶关联了丰富的元数据，因此诸如过滤器和内容搜索等操作可以被下推到存储层，从而减少网络带宽需求和
  CPU 负载。对象存储是新型存储介质的理想选择，因为它具有较低的 CPU 开销、更简单的语义和可扩展性——尤其是在大量数据以对象形式存储时。


  **数据感知**：大多数现有的对象存储本身并不解释对象的内容。因此，其效用有限，实际上，对象存储最常见的用途是作为二进制大对象存储，用于存储和检索多媒体（如图像或视频）。如果要对存储在对象存储中的数据执行分析工作负载，则需要将整个对象（大小可能为兆字节或千兆字节）获取到
  CPU，对其施加模式，进行反序列化，然后在其上执行必要的分析计算。Ampool 对象存储存储关于对象的广泛元数据（如模式、版本、分区键以及对象内容的各种统计信息），使得诸如投影、过滤和聚合等常见操作可以被下推到对象存储中。这有助于加速大多数分析计算，并避免其他分布式存储系统中普遍存在的网络瓶颈。当前版本
  Ampool 的框图如图图 9-10 所示。


  ***图 9-10.** Ampool 架构*




  除了核心的以内存为中心的对象存储之外，`Ampool` 还包含了几个优化后的连接器，使得现有计算引擎能够高效地向 `Ampool` 对象存储中存取数据。虽然每个新版本的
  `Ampool` 都快速增加连接器的数量，但当前开箱即用的连接器包括 `Apache Spark`、`Apache Hive`、`Apache Trafodion`（与
  `Esgyn Corporation` 合作）、`Apache Apex`（与 `Datatorrent, Inc.` 合作）以及 `CDAP`（`Cask Data
  Application Platform`，与 `Cask Data, Inc.` 合作）。尽管 `Ampool` 系统本身就是一个完全分布式的存储系统，能够维护大量运行中的持久化数据，但它仍提供了多个持久化存储连接器来加载和存储数据。可用的连接器包括
  `Hadoop Distributed File System`（`HDFS`）、`Apache Hive` 和 `Apache HBase`。`Ampool`
  既可以作为独立系统与 `Hadoop` 组件一起部署，也可以集成到现有的正在运行的 `Hadoop` 集群中（无论是通过 `Apache Ambari` 还是
  `Cloudera Manager`），并且可以通过提供的工具进行监控和管理，或者将 `Ampool` 生成的 `JMX` 指标连接到任何兼容 `JMX` 的监控系统。


  通过为（不可变和可变的）DataFrame、数据集以及事件流扩展提供快速的分析型存储，`Ampool` 弥补了实现蝴蝶架构所缺失的一环，并允许将各种事务型和分析型工作负载统一起来。


  ## 示例用例：广告技术数据管道


  `Acme.io` 是一家非常受欢迎的内容聚合公司，拥有一个基于 Web 的门户网站和一个移动应用，用户数量达数千万，他们每天会多次使用多个设备访问，以获取高度个性化的内容。`Acme`
  有多家广告客户付费在所有设备上展示其广告。`Acme` 是众多“Web 3.0”公司之一，对其用户的精确兴趣以及确切的人口统计数据有着深刻的理解——并基于此来个性化内容。


  它拥有一个不断增长的用户兴趣分类体系，广告商可以按人口统计数据以及用户的精确兴趣来定向投放广告。以下是 `Acme` 的业务数据概览：


  - 1 亿注册用户，其中日活跃用户 5000 万

  - 在 10,000 个广告活动中投放了 100,000 条广告

  - 1000 万个内容条目（新闻、照片、音频、视频）

  - 用户兴趣涉及 50 个主题和 500 个子主题中的 50,000 个关键词


  `Acme` 有数百台机器用于投放广告。通过一种独特的匹配算法来获取用户的兴趣点，它能在几毫秒内找到最佳匹配，并在合适的内容中展示广告。


  `Acme` 拥有众多数据科学家和 `Hadoop` 方面的专家。它运营着一个大型 `Hadoop` 集群，用于向用户提供个性化的内容推荐。然而，`Hadoop`
  的批处理特性至今仍阻碍着该公司利用该 `Hadoop` 基础设施进行实时广告投放、对广告日志进行流式分析，以及向客户提供关于广告活动效果的实时反馈。


  此外，为了满足其业务和营销分析师对广告数据执行即席查询以触达更广泛客户群体的需求，`Acme` 除了实时分析和批处理分析系统之外，还建立了一个独立的数据存储库。结果，其数据基础设施的运营成本增加了两倍多。更糟糕的是，`Acme`
  仅仅为了在这三个平台之间保持数据同步就承担了巨大的开销。


  由于同一份数据存储在多个地方，导致了数据延迟、数据不一致、数据清洗工作重复，以及确保数据质量和维护数据治理方面的难题。这浪费了 `Acme` 数据科学家和大数据基础设施专家超过
  80% 的宝贵时间。




