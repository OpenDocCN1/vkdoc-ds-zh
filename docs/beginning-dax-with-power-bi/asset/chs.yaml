- '# 前言


  Power BI 重新定义了商业智能（BI）工具。它将以往仅为数据科学家所用的工具变得易于使用，并以经济实惠的方式提供给业务分析师，从而催生了整个自助式 BI
  文化。本书在数据访问编程领域也采用了同样的方法。它将复杂的概念分解为简单、易于理解的步骤，并置于业务场景中，让你能轻松上手学习 DAX 语言，并帮助你每天解决现实世界中的商业挑战。


  ——查尔斯·“查克”·斯特林（微软）


