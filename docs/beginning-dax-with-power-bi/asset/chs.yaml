  Power BI Desktop 实例。这对于开发 DAX 查询可能并非特别有用，但这样做可以通过发出 DMV 查询，并利用 Power BI 中出色的可视化图表阵列来绘制结果，从而帮助优化你的数据模型。


  ## 优化


  优化是一个广泛且可能涉及高级知识的主题——事实上，它足以独立成书。在本节中，我将尝试介绍一些可用于提升模型性能的实用技巧。我将建议分为两部分。第一部分是关于优化数据模型，第二部分则重点介绍优化
  DAX 查询，并涵盖如何利用 DAX Studio 和 SSMS 等工具来提升性能。


  ### 优化数据模型


  让我们从移除未使用的数据开始。


  #### 移除未使用的数据


  第一个建议是确保只在模型中包含所需的数据。模型越大，需要执行的计算工作就越多，而多余的数据，即使未用于任何计算，仍可能对模型的压缩和性能产生不利影响。


  尽管在数据探索阶段，从源系统的各个表中导入所有行和列可能最初很有用，但请确保在将报表发布到生产环境之前，留出时间审查并从数据模型中移除未使用的列和行。


  位于未使用列中的高度唯一的数据可能会对 DAX 引擎用于存储数据的压缩产生负面影响。针对此类未使用数据的目标列通常是 IDENTITY 或自动编号列，这些列在
  OLTP 源系统中很有用，但在 OLAP 数据模型中通常价值不大。除非你需要在报表中显示这些列的值，否则移除它们可以显著减小数据模型的大小。


  你可以使用名为 Power BI Helper 的免费工具来帮助识别模型中未被使用的列。你应该从数据模型中移除它标记出的任何列，并且仅在报表需要时才将它们添加回来。你可以从
  [`http://radacad.com/power-bi-helper`](http://radacad.com/power-bi-helper) 下载 Power
  BI Helper。


  如果你熟悉使用 DMV，那么使用 DAX Studio 或 SSMS 对你的数据模型执行以下 DMV 查询（排序后），可以让你深入了解模型中哪些对象（列）占用了最多内存。


  ```

  Select * from $System.discover_object_memory_usage

  ```


  这些列是值得检查是否能移除掉的。


  移除未使用的列是一种技巧，但同时也要考虑导入到模型中的行数。如果数据模型只需要支持特定的时间范围，那么请考虑只导入覆盖所需时段的数据。


  同时，考虑在导入过程中压缩数据。如果来自源系统的数据集每天有很多行，例如在一些物联网传感器数据中可能看到的情况，那么在导入之前或期间对数据进行分组。也许可以通过使用已预汇总至每天一行的数据来满足报表需求，该行同时还包含已压缩行的
  `COUNT`、`MIN`、`MAX` 和 `AVERAGE` 值。


  这些建议有助于减小数据模型的整体大小。如果你使用 Power BI Desktop 模型尝试这些建议，请记下更改前后保存的 PBIX 文件大小。我曾见过实例，文件大小从超过
  800 MB 减少到不到 40 MB，且没有破坏报表中的任何视觉对象。这主要是结合了对数据模型执行建议的 DMV 查询、识别占用内存最多的列对象并将其从模型中移除的结果。在这个案例中，被移除的大部分列是位于拥有数亿行数据的表中的
  IDENTITY 列。


  > **注意**

  > 在模型中隐藏列不会影响性能。请从数据导入逻辑中移除未使用的列。


  #### 创建汇总表


  另一种旨在不增加模型整体大小的方法是，在模型内部创建额外的汇总表。你可以在 DAX 中生成这些表，也可以将其作为查询编辑器中导入过程的一部分。


  如果你有一个包含许多行的大表，并且需要保留其原始形式以满足某些报表需求，请考虑创建可用于无需下钻到原始表最细粒度细节的视觉对象和计算中的汇总表。


  以 WideWorldImportersDW 数据集中的 `''Fact Sale''` 表为例。该表包含 228,265 行数据，记录了每笔销售的详细信息。


  按日历月和客户对此数据集中的该表创建汇总版本，可将行数减少到 5,239 行。这样的汇总表可以支持任何需要此粒度级别的视觉对象或计算，而其大小仅为原始表的 1/50。当你使用拥有数亿行数据的表创建报表时，使用此方法带来的性能提升会更加显著。


  你可以从一个大型表创建数十个汇总表，以实现高度定制化的性能调优。在这种情况下，我建议采用良好的命名约定来帮助跟踪。


  ##### 预计算数据


  对于不需要动态计算的度量值，请考虑使用计算列而不是计算度量值。一个例子可能是根据大型表中的数据确定最佳客户或销售人员的排名度量值。这类计算可以以计算度量值或计算列的形式执行。但是，如果你不需要动态地重新计算该度量值以响应切片器或筛选器选择的变化，那么根据数据大小，使用计算列可能会提升模型的性能。


  ##### 拆分唯一列


  如果数据集中有一列包含高度唯一的值，例如包含从年到毫秒详细信息的 DateTime 列，或者 IDENTITY 或自动编号列，那么请考虑将其拆分为多个列。


  DateTime 的例子很简单，可以将其整齐地拆分为一个承载日期值的列，以及其他承载小时、分钟或秒值的列。如果你不需要报告比“天”更细的粒度级别，那么请将这些信息从数据模型中完全移除。


  寻找其他可以拆分列的机会，特别是当数据可能具有多重含义时。这些可能包括代表汽车品牌和型号的值，或者包含对报表无用的详细级别（例如郊区或街道）的地址数据。


  ##### 简化表结构


  DAX 数据模型可以使用与源系统表结构镜像的表结构来提供精确的计算。这包括跨越表关系集多个层级的计算。但是，如果你扁平化数据表结构以减少每次计算需要使用的表关系数量，模型性能可能会快得多。


  一个好的遵循模式是将数据组织成事实表和维度表。这通常被称为星型模式，并且已被证明在报表和分析工作负载中表现良好。



  '
- '# 事实表


  首先，确定数据中你想要计数、求和以及随时间进行可视化分析的实体。这些实体应构成模型中事实表的基础。事实表中的每一行都应该是该表所代表的实例、活动、事件或事务。如果你有
  100 笔销售，那么理想情况下，一张“销售事实表”就应该包含 100 行数据。


  不要试图将多个事实混合在一张表中。如果你需要报告和分析销售额与付款额，避免受诱惑将这两组数据合并到同一张事实表中。请为销售额单独创建一张事实表，为付款额创建另一张事实表。


  避免在事实表之间创建关系。许多有用的计算可以在共享同一张维度表的不相关事实表之间进行。


  一旦确定了需要的事实表，就要从其他源系统表中引入尽可能多的数据列到事实表中，以满足已知的报告需求，但同时要注意保留“1 行 = 1 个事实”的规则。如果你能让事实表
  100%自给自足，你将获得最佳性能。只有对那些可能用在维度表中、且该维度表与其他事实表相连接的列才做例外处理——例如，与其在每个事实表中都复制一份月份、季度和年份表，不如将这些列移到一张维度表中。


  尽量避免构建涉及跨越三个或更多层级关系进行计算的数据模型。


  '
- '# 维度表


  可以将维度表视为筛选器/切片器表，它们仅用于对事实表进行切片和切块分析。维度表通常不包含你要计数、求和或用于计算的数据。如果它包含了这样的数据，请考虑这些数据是否应该放在事实表中。维度表最有用的地方在于，它为筛选选择提供一个单一位置，以应用于与多个事实表的关系中。


  添加到任何模型中的第一个维度表很可能是一张日期表。如果你有多个事实表，那么这张日期表很可能与每个事实表都建立了一个表示单个日期的值的关系。对该表中任何列进行的任何筛选器/切片器选择，都会向下传播，以筛选任何关联的事实表。


  如果你有一张只与一个表相关的维度表，请考虑将这两个表合并为一个表。


  '
- '# 优化 DAX 查询


  编写查询并得到相同结果的方式有很多种。五个人可能会产生五种不同的方法，每种方法都有独特的性能特征。在本节中，我将介绍一些使 DAX 计算更高效的有用技巧和技术。其中一些足以帮助你解决可能遇到的性能问题。其他解决方案则是对
  DAX 计算的改进和对底层数据结构的增强。


  在本节中，我还将向你展示如何使用诸如 `DAX Studio` 和 `SQL Server Profiler` 等工具来帮助你优化 DAX 查询。


  ## 存储引擎 vs. 公式引擎


  DAX 查询在运行计算时会使用两个引擎：存储引擎（SE）和公式引擎（FE）。


  存储引擎是两者中较快的，其主要目标是从内存数据存储中检索计算查询所需的所有数据。存储引擎是多线程的，因此它可以并行完成多个操作。存储引擎在检索数据时可以执行简单的计算，但这些计算不能依赖于作为同一查询一部分可能并行发生的任何其他存储引擎任务。


  存储引擎活动的结果可以存储在缓存中，以帮助加速后续查询。当同一个视觉对象多次执行度量值以为每个数据点生成一个值时，这种缓存可以在帮助加速视觉对象中使用的所有计算方面发挥作用。


  公式引擎是单线程的，能够处理更复杂的逻辑，包括计算步骤的顺序对结果有影响的计算。公式引擎活动的结果不会被缓存，因此每次都必须重新计算。


  当查询被传递给 DAX 引擎时，存储引擎首先开始检索相关数据，然后公式引擎完成后续工作。


  优化慢速 DAX 查询的一个好方法是尝试了解查询的哪些组件由存储引擎完成，哪些由公式引擎完成；然后看看是否可以将公式引擎处理的某些工作转移到存储引擎。


  快速了解你的查询有多少使用了存储引擎而不是公式引擎的方法是通过使用 `DAX Studio`。功能区上有一个选项（图 8-11）可以启用服务器计时信息以及查询计划。


  ![A456681_1_En_8_Fig11_HTML.jpg](img/A456681_1_En_8_Fig11_HTML.jpg)


  图 8-11  `DAX Studio` 功能区上用于打开额外调试选项的选项


  启用这些选项后，在 `DAX Studio` 中运行的任何单个查询现在都会生成额外的信息，显示引擎完成查询所花费的时间。这也显示了整体时间中有多少是由存储引擎而不是公式引擎使用的细分情况（图
  8-12）。


  ![A456681_1_En_8_Fig12_HTML.jpg](img/A456681_1_En_8_Fig12_HTML.jpg)


  图 8-12 在 `DAX Studio` 中运行的查询的服务器计时输出示例


  图 8-12 显示了一个查询示例，该查询总共耗时 15 毫秒完成。前 3 毫秒由存储引擎花费，它运行了两个并行进程来收集所需的所有数据。当存储引擎完成后，公式引擎接管，并需要
  12 毫秒来完成查询。公式引擎在此查询中活跃了 80%，而存储引擎并未从存储引擎缓存中受益。


  此信息并未解释你的 DAX 查询的哪些部分由存储引擎处理，哪些由公式引擎处理，但它确实为你提供了一个基准，用于了解同一查询的其他版本的行为。


  进行优化时，每次运行查询的更新版本时清除缓存非常重要。如果不这样做，你可能会认为你的新版本更好，因为总时间更快，而实际上它可能是在利用先前查询的缓存数据。在 `DAX
  Studio` 中，可以通过设置 `运行` 按钮上的一个选项来每次清除缓存，从而轻松做到这一点。


  要了解查询的哪些组件由存储引擎或公式引擎处理，你需要深入分析通过对服务器进行跟踪而生成的查询计划。就像你可以在 Microsoft SQL 服务器上运行跟踪来分析
  T-SQL 查询一样，SSAS 引擎也能提供同样的能力来捕获显示各个查询不同子组件的事件。因为 Power BI Desktop 使用 SSAS 引擎，你可以使用诸如
  `SQL Server Profiler` 之类的工具，在运行查询时捕获有趣的事件，以精确显示 DAX 引擎是如何完成该查询任务的。某些事件显示为由存储引擎完成的活动，而其他事件则显示为属于公式引擎的活动。


  这是一个相当高级的话题，因此除了在本章后面向你展示如何在 DAX 查询上运行跟踪，并告诉你正是这些底层的跟踪数据被 `DAX Studio` 用来获取服务器计时信息之外，我不会深入探讨。`DAX
  Studio` 会在一个`查询计划`选项卡中显示查询所使用的物理和逻辑查询计划，以及由底层跟踪生成的伪 T-SQL 代码，以显示每个存储引擎子查询的工作。




  '
- '# 尽早且恰当地应用筛选


  如果你要手写一本词典中所有以字母 X 开头的单词列表，一种方法是先列出词典中从 A 到 Z 的所有单词，然后划掉所有不以 X 开头的单词。或者，你和五个朋友每人拿一本相同的词典，从不同页面开始抄写以字母
  X 开头的单词。第二种方法要快得多，因为所需的工作量更少，而且由大家分担。


  你可以将同样的方法应用于 DAX 计算。在不影响结果的前提下，筛选应用得越早，对计算总耗时的影响就越大。


  清单 8-12 和 8-13 中的两个 DAX 计算很好地证明了这一点。两种计算返回的结果相同。第一个查询显示了一个数量列的总和以及一个年初至今的计算值。数据被筛选为特定的销售区域和一年中的月份。


  ```

  EVALUATE

  FILTER(

  SUMMARIZE(

  ''Fact Sale'',

  ''Dimension Date''[Date],

  ''Dimension Date''[Calendar Month Number],

  ''Dimension City''[Sales Territory],

  "SUM Qty", SUM(''Fact Sale''[Quantity]),

  "YTD Qty", TOTALYTD(SUM(''Fact Sale''[Quantity]),''Dimension Date''[Date])

  )

  ,

  ''Dimension City'' [Sales Territory] = "Southeast"

  && ''Dimension Date''[Calendar Month Number] =11

  )

  ORDER BY

  ''Dimension Date''[Date]

  清单 8-12

  在 SUMMARIZE 之后使用 FILTER 的 DAX 查询

  ```


  此查询生成 77 行，并在 DAX Studio 的“服务器计时”窗口中输出图 8-13 所示的结果。


  ![A456681_1_En_8_Fig13_HTML.jpg](img/A456681_1_En_8_Fig13_HTML.jpg)


  图 8-13


  使用 DAX Studio 对清单 8-12 中代码的服务器计时输出


  该查询总共耗时 301 毫秒，其中相当一部分时间花费在公式引擎上。此查询在冷缓存上执行了多次，此时间具有代表性。


  清单 8-13 展示了另一个生成相同输出的查询。


  ```

  EVALUATE

  VAR PreFilteredTable =

  CALCULATETABLE(

  SUMMARIZE(

  ''Fact Sale'',

  ''Dimension Date''[Date],

  ''Dimension Date''[Calendar Month Number],

  ''Dimension City''[Sales Territory]

  ),

  ''Dimension City''[Sales Territory] = "Southeast",

  ''Dimension Date''[Calendar Month Number] =11

  )

  RETURN

  ADDCOLUMNS(

  PreFilteredTable,

  "SUM Qty", CALCULATE(SUM(''Fact Sale''[Quantity])),

  "YTD Qty", TOTALYTD(SUM(''Fact Sale''[Quantity]),''Dimension Date''[Date])

  )

  ORDER BY

  ''Dimension Date''[Date]

  清单 8-13

  清单 8-12 的替代版本，在逻辑处理中更早应用筛选

  ```


  此版本也生成 77 行，其“服务器计时”窗口的输出如图 8-14 所示。


  ![A456681_1_En_8_Fig14_HTML.jpg](img/A456681_1_En_8_Fig14_HTML.jpg)


  图 8-14


  使用 DAX Studio 对清单 8-13 中更快速代码的服务器计时输出


  更新后的版本总共耗时 44 毫秒。两个版本都使用了五个存储引擎查询来检索数据，但在更新后的查询中，筛选是在结果传递给 `SUM` 和 `TOTALYTD` 函数之前进行的。存储引擎向公式引擎返回了更小的数据块。所有存储引擎查询返回的行数均未超过
  1,464 行，而之前的查询中，存储引擎向公式引擎传递了超过 19,000 行的结果以供额外处理。


  希望这个例子能向你展示如何利用 DAX Studio 中一些非常有用的信息。你无需对每个查询都执行此过程，但将较慢的计算分离出来，在 DAX Studio 中进行调优和优化，是高效利用时间的方法。


  关于 DAX 中筛选器（尤其是筛选函数的使用）的另一个有用提示是，这些函数（例如 `ALL` 函数）通常可以对表或列进行操作。如果你能通过使用特定列而不是整个表来实现相同的结果，你可能会获得一些性能提升。传递整个表可能导致不必要的工作，特别是在仅传递表的一列就能实现相同结果的情况下。


  ## SQL Server Profiler


  要使用 Profiler 运行跟踪，请直接启动 Profiler 或通过 SSMS 启动。使用你的 DAX 引擎正在侦听的服务器名称连接到 Analysis Services
  实例。如果你要连接到 Power BI Desktop 实例，你需要知道该实例正在使用的端口号。这个端口号在你每次停止并启动 Power BI Desktop
  时都会发生变化。DAX Studio 会在状态栏显示正在使用的端口号，否则，你可以使用进程监控工具（如资源监视器或 Windows Sysinternals 版本的
  Process Explorer）获取此信息。


  以下是一些可以为每次跟踪启用的有用事件：


  - `Query Begin`

  - `DAX Query Plan`

  - `Query Subcube`

  - `VertiPaq SE Query End`


  启动跟踪，然后运行你的 DAX 查询，然后在你可以查看结果的位置停止或暂停跟踪。


  图 8-15 中的图表显示了当 Profiler 用于跟踪先前查询的第二个版本时捕获的事件。单击跟踪窗口中的各个行可以获得更多详细信息。


  ![A456681_1_En_8_Fig15_HTML.jpg](img/A456681_1_En_8_Fig15_HTML.jpg)


  图 8-15


  使用 Profiler 对清单 8-12 中代码的输出示例


  也可以在 Power BI Desktop 中通过打开诊断设置下的“启用跟踪”选项来启用跟踪（图 8-16）。这将创建 `*.trc` 文件，你可以使用 Profiler
  打开并分析这些文件。`*.trc` 文件存储在同一设置窗口中显示的文件夹内。


  ![A456681_1_En_8_Fig16_HTML.jpg](img/A456681_1_En_8_Fig16_HTML.jpg)


  图 8-16


  Power BI Desktop 设置中允许生成跟踪文件的选项


  通常有很多选项可以帮助你的查询运行得更快。有些涉及你修改数据模型本身，而其他一些则可以通过更改 DAX 计算来实现。总的来说，如果你记住使用存储引擎进行计算是好的，并且数据模型最好是小型且简单，那么你最终很可能会得到一个经过良好优化的模型（并让最终用户满意）。


  请记住也要有效利用在线资料。DAX 自 2009 年以来就已存在，并且有一个庞大的用户社区，他们分享处理常见问题的有趣方法。


  '
- '# 9. 实用 DAX


  本章重点介绍如何使用 DAX 构建模型，且不使用外部数据源。在本章中，你将构建自己的数据集。所有数据均通过逐步示例生成，这些示例展示了你可能会发现有用的各种技巧和技术。


  最终模型的结构与你可能为小型组织使用的结构类似，包含销售、日期和产品表。由于每个表的行数是自动生成的，你可以使用最终模型来优化大型数据集上的 DAX 计算。通过在这里或那里更改几个数字，你可以生成一个包含
  500 万、5000 万或 5 亿行数据的销售表，用于测试不同的计算优化方法。


  这些逐步练习要求你使用能够创建计算表的 DAX 版本。这包括 Power BI Desktop 和 SSAS 表格模型，但不包括 Excel 2016（或更早版本）的
  PowerPivot。




  '
- '# 创建数字表


  第一步是创建一个数字表，本例中是一个单列表，包含从 0 到 1000 的连续数字序列。你将能够使用此实用表，通过基于范围的条件（例如当此表中的值小于 5 时）连接到其他表。在本练习中，数字表用于将表中的单一行扩展为多行。


  创建数字表有几种方法。在 `GENERATESERIES` 函数可用之前，创建此类表的唯一方法是利用 `CALENDAR` 函数。并非所有版本的 DAX 都有
  `GENERATESERIES` 函数。DAX 中的日期存储为整数值，因此你可以使用 `CALENDAR` 函数生成日期行，然后再将其转换回整数值。在 Power
  BI Desktop 中，1899 年 12 月 30 日存储为 0。值 1 对应 1899 年 12 月 31 日，值 2 对应 1900 年 1 月 1 日。有趣的是，值-1
  对应 1899 年 12 月 29 日，因此如果你需要用 DAX 表示 17 世纪的数据，也可以做到，但需要使用接近-100,000 的数字。


  以下是使用 `CALENDAR` 函数创建数字计算表的方法（见图 9-1）：


  ```

  Numbers =

  SELECTCOLUMNS(

  CALENDAR(0,1000),

  "N", INT ( [Date] )

  )

  ```


  若要使用 `GENERATESERIES` 函数达到相同的结果，创建计算表的代码如下：


  ```

  Numbers =

  SELECTCOLUMNS(

  GENERATESERIES( 0,1000 ),

  "N", [Value]

  )

  ```


  两个示例都生成了一个包含 1001 行、名为 `Numbers` 的表，其中包含一个名为 `N` 的列。两个示例中都使用了 `SELECTCOLUMNS` 函数将列重命名为
  `N`。在使用了 `CALENDAR` 函数的示例中，`INT` 函数用于将日期输出转换为其底层数字。


  ![A456681_1_En_9_Fig1_HTML.jpg](img/A456681_1_En_9_Fig1_HTML.jpg)


  图 9-1


  `Numbers` 表的一个示例


  ## 添加日期表


  下一步是向数据模型中添加一个日期表。你可以使用列表 9-1 中的 DAX 代码来生成此表。


  ```

  Dates =

  VAR BaseTable =

  CALENDAR (  DATE(2016, 1, 1), TODAY () )

  VAR AddYears =

  ADDCOLUMNS (

  BaseTable,

  "Year", YEAR ( [Date] )

  )

  VAR AddMonths =

  ADDCOLUMNS (

  AddYears,

  "Month", DATE(YEAR([Date]),MONTH([Date]),1),

  "Month label", FORMAT ( [Date], "MMM YY" )

  )

  VAR AddDay =

  ADDCOLUMNS (

  AddMonths,

  "Day Label", FORMAT ( [Date], "DDD d MMM YY" )

  )

  RETURN

  AddDay

  列表 9-1

  用于创建简单日期表的计算表

  ```


  此语句以 `CALENDAR` 函数的单列输出开始，并将其分配给 `BaseTable` 变量。虚拟表每天一行，从 2016 年 1 月 1 日开始，一直持续到当前日期。


  你可以使用额外的变量在整个计算过程中逐步添加列。在这段代码中，`AddYears` 变量获取由 `BaseTable` 变量表示的表，并使用 `YEAR` 函数从
  `[Date]` 列中提取值，从而追加一个名为“Year”的列。


  `AddMonths` 变量使用 `ADDCOLUMNS` 追加两个额外的列。这些列允许将行分组到日历月份中。“Month”列使用 `DateTime` 数据类型，并将每个日期值转换回其对应月份的第一天。“Month
  label”列使用 `FORMAT` 函数将日期转换为文本。格式字符串 `MMM YY` 表示诸如 2018 年 7 月 4 日等日期会被转换为“Jul 18”这样的文本值。你需要将“Month
  label”列的 `Sort by Column` 属性设置为使用“Month”列，否则在可视化项中使用时，该列中的值将按字母顺序显示。


  最后的 `AddDay` 变量使用 `ADDCOLUMNS` 函数添加一个名为“Day Label”的列。该列使用 `FORMAT` 函数，通过格式字符串 `"DDD
  d MMM YY"` 将每行中的日期转换为文本值。此格式字符串将 2018 年 7 月 4 日转换为“Wed 4 Jul 18”。此基于文本的列需要将其 `Sort
  by Column` 属性设置为 `"Date"` 列，以确保在可视化项中使用时能进行合理的排序。图 9-2 显示了日期表生成的前几行。


  ![A456681_1_En_9_Fig2_HTML.jpg](img/A456681_1_En_9_Fig2_HTML.jpg)


  图 9-2


  列表 9-1 创建的日期表的示例输出




  '
- "# 创建销售表\n\n接下来需要创建的表是销售表。目标是生成一个展示一段时间内销售情况的表格，可用于构建销售报告。本节将介绍所需的每个步骤，展示 DAX 代码并解释其含义。\n\
  \n首要任务是每天生成随机数量的销售记录。相关 DAX 代码如代码清单 9-2 所示。\n\n```\nSales =\nVAR FirstTable =\n\
  SELECTCOLUMNS(\nFILTER (\nGENERATE (\nDates,\nNumbers\n),\n[N] < RANDBETWEEN ( 2,\
  \ 7 )\n),\n\"Date\",[Date])\n代码清单 9-2\n用于创建销售表的计算表代码片段\n```\n\n此语句的输出是一个包含单列日期的表。每个日期会出现\
  \ 2 到 6 次，这实际上创建了可用于添加其他列的占位行。`CROSSJOIN` 和 `FILTER` 函数用于合并之前创建的日期表和数字表。如果不使用 `FILTER`\
  \ 函数，`CROSSJOIN` 会将日期表中的每一行与数字表中的所有 1001 行进行匹配。真实的销售表不太可能每天恰好有 1001 笔销售，因此 `FILTER`\
  \ 函数使用 `RANDBETWEEN` 函数来生成每天更随机的销售数量。在此例中，每天会有 2 到 7 笔销售交易。\n\n你可以将下限设置为零，这样某些天就没有销售记录；也可以通过增加上限的方式生成更大的销售数据集。\n\
  \n你可以使用 `SELECTCOLUMNS` 函数，确保只从日期表和数字表中提取所需的列传递到输出结果中，该结果在代码清单 9-2 中被赋值为 `FirstTable`\
  \ 这个虚拟表。\n\n下一个任务是添加一个名为“产品”（Product）的列（代码清单 9-3），该列包含表示所售产品对应的值。\n\n```\nVAR AddProduct\
  \ =\nADDCOLUMNS (\nFirstTable,\n\"Product\",\nVAR myMake =\nRANDBETWEEN ( 65, 90\
  \ )\nVAR myModel =\nFORMAT ( RANDBETWEEN ( 1, 5 ), \"-#\" )\nRETURN\nREPT ( UNICHAR\
  \ ( myMake ), 3 ) & myModel\n)\n代码清单 9-3\n为代码清单 9-2 添加产品列\n```\n\n这段代码首先将 `FirstTable`\
  \ 变量作为 `ADDCOLUMNS` 函数的输入。一个名为 `Make` 的嵌套变量开始了一个新的变量作用域级别。这个作用域与 `FirstTable` 和\
  \ `AddProduct` 变量所使用的层级是分开的，`RETURN` 函数用于将一个单一值作为 `ADDCOLUMNS` 函数的第三个参数返回。不使用嵌套变量也能达到相同效果，但可读性会变差。\n\
  \n`myMake` 变量使用 `RANDBETWEEN` 函数生成一个介于 65 到 90 之间的随机数。之所以使用这些数字，是因为它们对应 ASCII 表中大写字母的范围。65\
  \ 代表字母“A”，66 代表“B”，依次类推到 90，代表大写字母“Z”。这个随机数被存储在 `myMake` 变量中。\n\n`myModel` 变量使用\
  \ `RANDBETWEEN` 函数生成一个介于 1 到 5 之间的随机数。然后使用 `FORMAT` 函数并配合格式字符串 `\"-#\"` 将其转换为文本。格式字符串中的连字符被保留，而井号占位符告诉\
  \ `FORMAT` 函数数字应该放在哪里。这样就会生成类似 `\"-1\"` 或 `\"-5\"` 的字符串。\n\n最终的 `RETURN` 语句将 `myMake`\
  \ 和 `myModel` 变量连接起来，生成一个看起来像产品代码的文本值。首先使用 `UNICHAR` 函数将存储在 `myMake` 中的数字转换为介于 `A`\
  \ 和 `Z` 之间的大写字母。然后使用 `REPT` 函数将 `UNICHAR` 函数的输出重复三次。这样就将值 `\"A\"` 变成了 `\"AAA\"`，再与\
  \ `myMake` 变量中的文本结合，就会产生诸如 `\"AAA-4\"` 或 `\"DDD-1\"` 这样的结果。\n\n此时，计算表的输出结果如图 9-3\
  \ 所示。\n\n![A456681_1_En_9_Fig3_HTML.jpg](img/A456681_1_En_9_Fig3_HTML.jpg)\n\n**图\
  \ 9-3**  \n包含代码清单 9-3 的销售表输出示例\n\n`UNICHAR` 是一个很棒的函数，你可以用它向报告中添加 KPI 指示器（例如趋势箭头或表情符号图片）来强调某个要点。\n\
  \n接下来添加的列代表销售数量（代码清单 9-4）。它通过将 `AddProduct` 变量作为 `ADDCOLUMNS` 函数的第一个参数，在现有代码基础上进行扩展。\n\
  \n```\nVAR AddQuantity =\nADDCOLUMNS (\nAddProduct,\n\"Qty\",\nVAR Q = RANDBETWEEN\
  \ ( 1, 1000 )\nRETURN 5 - INT ( LOG ( Q, 4 ) )\n)\n代码清单 9-4\n为销售表添加数量列\n```\n\n\
  `ADDCOLUMNS` 函数附加了一个名为“Qty”的单列。一个嵌套变量作用域从此处第三个参数开始。其目的不仅是生成一个介于 1 到 5 之间的随机数，还要确保随机值的分布不均匀。在真实的销售表中，大多数交易的数量很可能是\
  \ 1。其次是数量为 2 的交易，并且随着数量的增加，购买次数会减少。\n\n这里使用的 `LOG` 函数为 1 到 5 的数量应用了对数分布。当将此代码添加到计算表语句中，并使用\
  \ `Qty` 列中每个值的计数在可视化图表上绘制时（图 9-4），可以看出大多数交易都是单数量交易。数量为 2 的交易数量几乎是数量为 1 的一半，而数量为\
  \ 3 的交易数量则锐减超过一半。\n\n![A456681_1_En_9_Fig4_HTML.jpg](img/A456681_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4**  \n显示数量值分布的图表\n\n这就是计算所期望达到的效果，你可以根据需要进一步调整。\n\n到目前为止，使用上述代码生成的销售计算表输出类似于图\
  \ 9-5。\n\n![A456681_1_En_9_Fig5_HTML.jpg](img/A456681_1_En_9_Fig5_HTML.jpg)\n\n\
  **图 9-5**  \n包含数量列的销售表示例\n\n接下来添加的列是价格列。该列的代码如代码清单 9-5 所示。\n\n```\nVAR AddPrice\
  \ =\nADDCOLUMNS (\nAddQuantity,\n\"Price\", DIVIDE (\nRANDBETWEEN ( 1, 1e5 ),\n\
  100 )\n)\n代码清单 9-5\n为销售表添加价格列\n```\n\n`ADDCOLUMNS` 函数在存储在 `AddQuantity` 变量中的表里附加了一列。新列名为“Price”，该公式使用\
  \ `RANDBETWEEN` 函数生成一个介于 1 到 100,000 之间的数字。`1e5` 这种表示法表明可以使用科学计数法。`1e5` 是 `1 × 10⁵`（即\
  \ `1 × 10` 的 5 次方）的简写，等于 100,000。\n\n生成这个随机数后，使用 `DIVIDE` 函数将其转换为一个小于等于 1000 且保留两位小数的值。`DIVIDE`\
  \ 函数的一个特点是它能比 `/` 运算符更好地处理“除以零”错误；然而，`/` 运算符性能更好，在不存在“除以零”错误风险的情况下应优先使用。示例如下：\n\n\
  ```\nRANDBETWEEN( 1, 1e5) / 100\n```\n\n在代码清单 9-5 中，并没有尝试让不同产品代码的价格保持一致。如果在测试中，产品之间价格一致很重要，你可以将此处生成随机价格的逻辑移到一个产品计算表中，并通过关系将其添加到销售表中。\n\
  \n最后需要添加的列是结合了 `[Price]` 和 `[Qty]` 的 `[Total]` 列。这表明新列可以使用源自同一代码先前部分的值。\n\n代码清单\
  \ 9-6 是创建销售计算表的完整代码。\n\n\n\n```dax\nSales =\nVAR FirstTable =\n    SELECTCOLUMNS(\n\
  \        FILTER (\n            GENERATE (\n                Dates,\n            \
  \    Numbers\n            ),\n            [N] < RANDBETWEEN ( 2, 7 )\n        ),\n\
  \        \"Date\",[Date])\nVAR AddPRoduct =\n    ADDCOLUMNS (\n        FirstTable,\n\
  \        \"Product\",\n        VAR Make =\n            RANDBETWEEN ( 65, 90 )\n\
  \        VAR myModel =\n            FORMAT ( RANDBETWEEN ( 1, 5 ), \"-#\" )\n  \
  \      RETURN\n            REPT ( UNICHAR ( MAke ), 3 ) & myModel\n    )\nVAR AddQuantity\
  \ =\n    ADDCOLUMNS (\n        AddPRoduct,\n        \"Qty\",\n        VAR Q = RANDBETWEEN\
  \ ( 1, 1000 )\n        RETURN 5 - INT ( LOG ( Q, 4 ) )\n    )\nVAR AddPrice =\n\
  \    ADDCOLUMNS (\n        AddQuantity,\n        \"Price\", DIVIDE (\n         \
  \   RANDBETWEEN ( 1, 1e5 ),\n            100 )\n    )\nVAR AddTotal =\n    ADDCOLUMNS\
  \ ( AddPrice, \"Total\", [Price] * [Qty] )\nRETURN\n    AddTotal\n```\n\n**图 9-6**\
  \ 展示了使用此代码生成的表示例。\n\n![A456681_1_En_9_Fig6_HTML.jpg](img/A456681_1_En_9_Fig6_HTML.jpg)\n\
  \n**图 9-6** —— 销售表（包含 `Total` 列）的示例输出\n\n该表现在有五列，并且可能包含数亿行。你可以通过用于生成数字表的计算以及在 `FirstTable`\
  \ 变量中使用的 `FILTER` 条件来控制行数。请记住，你对任意计算表中的任何部分所做的每次更改，都会导致模型中的每个表重新计算数据。这每次都会生成新值，但如果将其配置为生成极其庞大的数据集，则可能需要很长时间来计算。\n\
  \n现在可以使用每张表中的 `[Date]` 列将销售表与日期表关联起来。\n\n## 优化销售表\n\n数据模型现在包含一张详细的销售表，其中的行代表单个交易。该表可能会变得非常庞大。销售表中同一天可能会出现多行包含相同产品的情况。如果生成销售表的代码被特意设置为生成一个非常大的表，这种情况就更有可能发生。当使用数据集中的表来构建报表时，并非所有报表视觉对象都需要使用较大表中最精细的详细信息级别。\n\
  \n例如，如果你的视觉对象只需要按天显示 `Qty` 列的总和，并且从不按产品区分，那么使用销售表可能是一种效率很低的做法。\n\n另一种方法是生成一个按天分组的销售表汇总版本，但无法按产品进行深入分析和细分。\n\
  \n用于生成此类计算表的代码如**清单 9-7** 所示。\n\n```dax\nDaily Summary =\nSUMMARIZECOLUMNS(\n  \
  \  'Sales'[Date],\n    \"Sum of Items Sold\", SUM('Sales'[Qty]),\n    \"Sum of Revenue\"\
  , SUM('Sales'[Total])\n)\n```\n\n这将创建一个三列表，将每个 `'Sales'[Date]` 的多行数据汇总为一行，同时使用 `SUM`\
  \ 函数为每一行生成一个值，以提供 `Qty` 和 `Total` 列的聚合总计。\n\n使用此表的视觉对象将比使用销售表的视觉对象更快，尤其是当销售表最终包含大量行时。\n\
  \n创建此类汇总表的一个缺点是，它们会增加整个数据模型的内存占用，并使数据刷新过程耗时更长。另一个明显的缺点是，任何使用汇总表的视觉对象都只能按该表的粒度进行细分，在本例中，粒度是\
  \ `[Date]` 而非 `[Product]`。\n\n如果你的报表交互响应慢，并且没有使用汇总表，那么此策略非常值得考虑。\n\n## 计算列与计算度量值\n\
  \n刚接触 DAX 数据建模的人（以及一些并非新手的人）经常问的一个问题是：“什么时候该用计算度量值，什么时候该用计算列？” 这是一个合理的问题。由于它们的使用场景可能有重叠，因此可能会造成混淆。在报表中，通过计算列和计算度量值可以显示相同的值。\n\
  \n计算列和计算度量值的主要区别在于计算的执行时间点以及计算结果的存储方式。\n\n### 计算列\n\n对于计算列，计算所用的 DAX 表达式仅在表的数据刷新时执行。该表达式会对表中的每一行计算一次，计算生成的单个值会作为该行在该列中的值存储起来，并且无法更改。这就好像计算列生成的值本来就存在于用于导入数据的源数据中一样。\n\
  \n将计算列视为数据加载过程的一部分。这些计算在数据加载过程的最后步骤之一中执行，并且不涉及任何用户交互。\n\n在大型数据集上使用复杂的计算列会使数据刷新耗时更长。但是，如果数据模型配置为在凌晨每天刷新一次，那么这对报表用户的影响应该很小。\n\
  \n计算列生成的值会物理存储在数据模型中，这意味着向非常大的表中添加列可能会对数据模型的内存大小产生显著影响。\n\n计算列是基于行的，这意味着如果所有所需信息都包含在同一行中，它们可以快速执行计算。尽管如此，计算仍然可以使用当前行之外的其他行中的数据。\n\
  \n\n\n### 计算度量值\n\n使用计算度量值时，每次页面加载或用户更改筛选器或切片器选择时，DAX 表达式都可能被执行。计算度量值中包含的 DAX 表达式会为报告中每个使用它的值执行一次。如果计算度量值用于表或矩阵视觉对象，则它会为网格中所有使用该度量值来显示值的单元格执行相应次数。当度量值用于一个系列中具有\
  \ 100 个点的折线图视觉对象时，它会为每个点执行 100 次，每次执行都有略微不同的筛选上下文。\n\n计算度量值是动态的，并能对用户交互做出响应。它们会频繁且快速地重新计算，但不会在数据模型中存储输出，因此对数据模型的物理大小没有影响。增加数据模型中计算度量值的数量，不会影响模型在静止状态下的速度或大小。\n\
  \n计算度量值能够快速处理跨多行单列的计算，但你也可以通过使用迭代器，以支持基于行数据处理的方式来编写它们。\n\n为了更好地理解计算列和计算度量值之间的区别，我们来看一下如何使用这两种选项来处理一个报告需求。在清单\
  \ 9-8 中，需求是在刚刚创建的、来自清单 9-7 的计算表上，展示`'每日汇总'[收入总和]`列的累计总和。\n\n```\n计算收入列 =\nCALCULATE(\n\
  \    SUM('每日汇总'[收入总和]),\n    FILTER(\n        ALL('每日汇总'),\n        '每日汇总'[日期]<=EARLIER('每日汇总'[日期])\n\
  \    )\n)\n清单 9-8\n将作为计算列的累计总和添加到清单 9-7 的计算表中\n```\n\n该计算会依据`'每日汇总'`表中的行数执行相应次数。`FILTER`函数使得每次执行`SUM`函数时，可以使用不同的值集。针对最早日期（2016\
  \ 年 1 月 1 日）所在行的执行，只会向`SUM`函数提供一个值。针对 2012 年 1 月 2 日所在行的`SUM`表达式的执行，则使用两个值。这两次执行可以按任意顺序进行，并且仍然产生相同的结果。\n\
  \n一旦添加了计算列，数据模型就会变大。在这种情况下，新列中的所有值都是唯一的，因此数据压缩率非常低。\n\n现在考虑相同的计算，但作为计算度量值（清单 9-9）。\n\
  \n```\n计算收入度量值 =\nCALCULATE(\n    SUM('每日汇总'[收入总和]),\n    FILTER(\n        ALLSELECTED('每日汇总'[日期]),\n\
  \        '每日汇总'[日期]<=MAX('每日汇总'[日期])\n    )\n)\n清单 9-9\n将作为计算度量值的累计总和添加到清单 9-7 的计算表中\n\
  ```\n\n在这种情况下，将计算度量值添加到模型并不会执行代码。计算度量值会保持休眠状态，直到它在视觉对象中被使用。一旦计算度量值在视觉对象中被使用，它就会为视觉对象需要生成的每个值执行一次。通常，这对应于轴、行或列标题中的项目数。\n\
  \n计算度量值和计算列的语法非常相似。两者都使用`CALCULATE`函数以及针对`[收入总和]`列的相同核心`SUM`表达式。两者都应用指令来告知 DAX 引擎`SUM`函数可以使用哪些数据。\n\
  \n最后，当两者与`'每日汇总'[日期]`字段一起添加到表视觉对象时，结果如图 9-7 所示。\n\n![A456681_1_En_9_Fig7_HTML.jpg](img/A456681_1_En_9_Fig7_HTML.jpg)\n\
  图 9-7\n\n来自清单 9-8 和 9-9 的代码输出\n\n这两个列为表中的每一行产生了相同的结果。`[计算收入列]`直接从内存中的列检索数据，无需进行\
  \ DAX 计算。而 `[计算收入度量值]` 列的每个单元格都会运行度量值中的代码，每次执行度量值时，查询上下文都略有不同。在这种情况下，查询上下文来自对每个`[日期]`进行筛选的行标题。\n\
  \n如果你使用 DAX Studio 分析这两种方法，就会开始看到它们在整体性能上的差异。\n\n第一个测试使用计算列，以查看模型为生成视觉对象值所需的工作量。每次运行时清除缓存的选项已启用，查看服务器计时和查询计划的选项也已启用（清单\
  \ 9-10）。\n\n```\nEVALUATE\nSELECTCOLUMNS(\n    '每日汇总'\n    , \"日期\", '每日汇总'[日期]\n\
  \    , \"计算收入列\", '每日汇总'[计算收入列]\n) ORDER BY [日期]\n清单 9-10\n使用 DAX Studio 测试清单 9-8\
  \ 性能的 DAX 查询\n```\n\n在冷缓存上运行此计算十次，平均总执行时间约为 12 毫秒。如图 9-8 所示，大部分输出时间（通常为 90%）消耗在公式引擎中，只有极小部分消耗在存储引擎中。\n\
  \n![A456681_1_En_9_Fig8_HTML.jpg](img/A456681_1_En_9_Fig8_HTML.jpg)\n图 9-8\n\n来自清单\
  \ 9-10 的代码的服务器计时输出\n\n清单 9-11 展示了使用计算度量值而非计算列的相同测试。再次使用 DAX Studio 来捕获在冷缓存上执行查询的服务器计时。\n\
  \n```\nEVALUATE\nSELECTCOLUMNS(\n    '每日汇总'\n    , \"日期\", '每日汇总'[日期]\n    , \"\
  计算收入度量值\", [计算收入度量值]\n) ORDER BY [日期]\n清单 9-11\n使用 DAX Studio 测试清单 9-9 性能的 DAX 查询\n\
  \n此代码产生相同的输出，只是使用了计算度量值而非计算列。多次运行此查询后，平均查询时间约为 1.4 秒（1400 毫秒），其中通常有 99% 的时间消耗在公式引擎中（图\
  \ 9-9）。\n\n![A456681_1_En_9_Fig9_HTML.jpg](img/A456681_1_En_9_Fig9_HTML.jpg)\n图\
  \ 9-9\n\n来自清单 9-11 的代码的服务器计时输出\n\n虽然这比较慢，但也在意料之中。计算列的优势在于它是预先计算好的。计算列最初生成列数据所花费的时间，与我们在此处看到的计算度量值所花的时间大致相同。\n\
  \n让我们来看看这两个计算，并从灵活性方面进行比较。在`'日期'`表和`'每日汇总'`表之间添加关系后，在同一个报告页面中添加一个使用`'日期'[年份]`列的切片器。当此切片器设置为\
  \ 2017 年时，可以通过两个视觉对象观察到图 9-10 中的结果。\n\n首先，表视觉对象显示，计算度量值现在显示的值与计算列不同。原因是计算度量值每次新执行所生成的值，其筛选上下文与之前不同。计算度量值内的`SUM`表达式不再考虑属于\
  \ 2016 年和 2018 年的行。这种额外筛选的效果意味着值已被重置，现在仅从 2017 年初开始累计。\n\n![A456681_1_En_9_Fig10_HTML.jpg](img/A456681_1_En_9_Fig10_HTML.jpg)\n\
  图 9-10\n\n表和折线图视觉对象显示了将切片器设置为 2017 年时，来自清单 9-8 和 9-9 的结果\n\n\n\n该列只是输出与之前相同的预计算值。除了切片器阻止可视化图表绘制\
  \ 2017 年以外的日期值外，没有任何变化。\n\n那么，让我们重新审视本节开头提出的问题：“何时应使用计算列与计算度量值？”\n\n如果你希望获得最快的计算结果，并且很少需要以不同方式对数据进行切片和切块，那么计算列是一个不错的选择。如果你希望值能够对用户交互做出响应和反应，那么计算度量值是一个不错的选择。\n\
  \n如果你遇到交互式报告的速度和性能问题，最佳着手点通常是检查计算度量值中使用的代码，而不是计算列中的代码。\n\n### 显示销量前十产品的所有销售额\n\n\
  为了扩展已构建的数据，让我们看几个示例，了解如何使用不同技术构建一些额外的汇总表。第一个示例创建一个包含所有销售记录、但仅显示收入前十产品的表格。第一步是确定哪些产品应被视为前十产品。然后，使用此列表创建一个新表，该表包含针对这些产品筛选的所有销售数据。\n\
  \n计算表的 DAX 代码如列表 9-12 所示。\n\n```\nAll Sales for Top 10 Products =\nVAR InnerGroup\
  \ =\nSUMMARIZECOLUMNS(\n-- 按...分组 --\n'Sales'[Product],\n-- 聚合列 --\n\"Sum of Revenue\"\
  , SUM('Sales'[Total])\n)\nVAR Top10PRoducts =\nTOPN(\n10,\nInnerGroup,\n[Sum of\
  \ Revenue],\nDESC\n)\nRETURN\nNATURALINNERJOIN (\n'Sales',\nTop10PRoducts\n)\n列表\
  \ 9-12\n显示前十产品销售额的计算表\n```\n\n此计算中的第一个变量使用`SUMMARIZECOLUMNS`函数创建一个按`Sales`[Product]\
  \ 列聚合的表表达式。这会生成一个未排序的工作表，每个产品一行。每个产品在 `\"Sum of Revenue\"` 列中都有一个值，显示历史总销售额的聚合值。这可能是一个优化过滤条件的机会，使其仅考虑相对于当前期间而言较近的日期范围——例如，你可以修改它，使其仅考虑过去三个月的销售额。\n\
  \n第二步使用 `TOPN` 函数，当按 `[Sum of Revenue]` 降序排序时，从 `InnerGroup` 表表达式中识别并返回前十行。`TOPN`\
  \ 函数是一个过滤器函数，因此它返回一个表，该表具有与 `InnerGroup` 变量相同数量的列，并赋值给 `Top10Products` 变量，但在此例中仅包含十行。\n\
  \n你可以调整此函数，利用排序后的表来查找顶部或底部的不同数量产品。要查找销量最少的产品，只需将排序参数从 `DESC` 改为 `ASC`。\n\n使用 `TOPN`\
  \ 函数的替代方法是向 `InnerGroup` 变量添加一个排名列，然后利用排名列中的值来过滤该表。你可以使用列表 9-13 中的 DAX 示例作为替代方案。图\
  \ 9-11 显示了此列表的输出。\n\n![A456681_1_En_9_Fig11_HTML.jpg](img/A456681_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11\n\n使用列表 9-13 中添加的排名列，列表 9-12 中代码的示例输出\n\n```\nVAR AddRankColumn =\nADDCOLUMNS(\n\
  InnerGroup,\n\"My Rank\",RANKX( InnerGroup, [Sum of Revenue] )\n)\nVAR Top10PRoducts\
  \ =\nFILTER(\nAddRankColumn,\n[My Rank]<=10\n)\n列表 9-13\n可在列表 9-12 中替换 TOPN 函数的替代\
  \ DAX 代码\n```\n\n添加像图 9-11 中这样的排名列，而非使用 `TOPN` 函数，其优势在于你可以将数据用于其他计算，例如比较不同时期的排名。例如，你可以创建两个工作表，分别显示连续时期内产品的聚合销售额及其排名。然后，你可以生成一个过滤后的表，来显示在两个时期之间排名提升（或下降）的产品。\n\
  \n此变体在`AddRankColumn`表表达式上使用`FILTER`函数。如果要识别排名最低的项目，`RANKX`函数接受一个可选参数来对数据进行降序（`DESC`）或升序（`ASC`）排序。这使得`FILTER`函数能够使用`<=10`谓词来查找销售额最低的产品。\n\
  \n至此，两个版本都生成了一个仅包含十行的表表达式，这些行应代表销量最好的产品。\n\n最后一步是返回原始销售数据的副本，该副本仅针对`Top10Products`变量中包含的产品进行过滤。`NATURALINNERJOIN`函数非常适合于此目的，最终的`RETURN`语句执行了相当于\
  \ T-SQL 中`INNER JOIN`的操作，连接了`'Sales'`表和`Top10Products`变量中包含的表表达式。\n\n`NATURALINNERJOIN`函数会自动使用两个表中存在的、具有相同名称、数据类型和沿袭的列来创建联接条件。联接可以使用多个列，但在此例中，只有`[Product]`列满足所有三个要求。因为`Top10Products`变量中的`[Product]`列可以追溯到其来源（`Sales`表），所以它满足沿袭要求。\n\
  \n`CALCULATETABLE`函数可以替代`NATURALINNERJOIN`使用。这两个函数的参数签名相同。`NATURALINNERJOIN`在公式引擎中执行，而`CALCULATETABLE('Sales',\
  \ Top10Products)`则将过滤操作推送到存储引擎。\n\n联接中使用的两个表中除`[Product]`之外的列都会被保留。可以使用`SELECTCOLUMNS`函数，通过删除或重命名不需要的列来控制返回哪些列。\n\
  \n最终表的示例应类似于图 9-12。\n\n![A456681_1_En_9_Fig12_HTML.jpg](img/A456681_1_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12\n\n列表 9-12 中计算表的示例输出\n\n这些列中的值均基于随机数，因此重要的是表结构应与你的版本匹配，而非具体的数值。\n\n每次刷新数据模型时，都会重建此计算表。构建完成后，它会为你提供一个更小、更快的表，供只需要处理最畅销产品的可视化图表使用。当`Sales`表中的行数变得非常大时，这尤其有用。\n\
  \n\n\n### 双重分组\n\n更复杂的场景可能需要使用多个工作表对数据执行两层或更多层的汇总，以生成新的汇总表。\n\n假设有一个需求，要求显示一个汇总表，该表的每一行对应销售表中的每个产品，并包含每个产品最佳十天的平均值。这里的挑战在于，每个产品的最佳十天所对应的日期是不同的。一旦确定了每个产品的最佳十天，就可以计算出平均值。\n\
  \n以下技术将用于实现这一需求：\n\n-   `SUMMARIZECOLUMNS`\n-   `GENERATE`\n-   `GROUPBY` 和 `CURRENTGROUP`\n\
  -   `MAXX` 迭代函数\n-   一种推导`RANK`的有趣技术\n\n第一步是创建一个工作表（清单 9-14），用作每个产品每日销售的汇总。原始数据可能包含同一产品在同一天的多笔交易。这将是执行的第一层汇总。\n\
  \n```\nVAR InnerGroup =\nSUMMARIZECOLUMNS(\n-- 分组依据 --\n'Sales'[Product],\n'Sales'[Date],\n\
  -- 聚合列 --\n\"Daily Revenue\", SUM('Sales'[Total])\n)\n清单 9-14\n清单 9-6 中销售表的汇总计算表\n\
  ```\n\n`InnerGroup` 变量存储了一个三列表，显示了每个产品在其有销售记录的每一天的日销售额。下一步是识别哪些日期恰好是每个产品的最佳十天。这通常需要为\
  \ `[Daily Revenue]` 列应用一个特定于产品的排名值。`RANKX` 迭代器提供了一种方法，可以在此时向表中添加一列，该列对表中的每一行相对于其他行进行排名。但这里需要的是能够获得一列来对每个产品的每日销售进行排名。\n\
  \n一种方法是对计算应用清单 9-15 中的三个步骤。\n\n```\nVAR CopyOfSummaryTable =\nSELECTCOLUMNS(\nInnerGroup,\n\
  \"ProductA\",[Product],\n\"DateA\",[Date],\n\"Daily RevenueA\",[Daily Revenue],\n\
  \"RowCounter\", 1\n)\nVAR CrossJoinTables =\nFILTER(\nGENERATE( CopyOfSummaryTable,\
  \ InnerGroup ),\n[Product] = [ProductA] &&\n[Daily Revenue]<=[Daily RevenueA]\n\
  )\nVAR ProductByDateRanking =\nGROUPBY(\nCrossJoinTables,\n[Product],\n[Date],\n\
  \"Daily Revenue\", MAXX(\nCURRENTGROUP(),\n[Daily Revenue]\n),\n\"Rank\",      SUMX(\n\
  CURRENTGROUP(),\n[RowCounter]\n)\n)\n清单 9-15\n清单 9-14 中代码的附加 DAX\n```\n\n在这段代码中，`CopyOfSummaryTable`\
  \ 变量用于存储 `InnerGroup` 变量的副本。使用 `SELECTCOLUMNS` 重命名了 `[Product]`、`[Date]` 和 `[Daily\
  \ Revenue]` 列，以避免在下一步将此表版本与 `InnerGroup` 表连接时发生列名冲突。这些列被简单地重命名，并在末尾附加了字符“A”。\n\n\
  在此步骤中还添加了一个名为 `[RowCounter]` 的新列，其硬编码值为 `1`。该列将为排名计算提供基础。对于同一产品具有更高 `[Daily Revenue]`\
  \ 值的每一行，该行都会被复制。复制完成后，对 `[RowCounter]` 执行 `SUM` 操作会生成一个表示排名的值。\n\n下一步是在 `InnerGroup`\
  \ 和 `CrossJoinTables` 表变量之间执行笛卡尔连接。`FILTER` 函数确保只有 `InnerGroup` 中与 `CopyOfSummaryTable`\
  \ 中 `[Product]` 值相同的行才被匹配。`[Daily Revenue] <= [Daily RevenueA]` 逻辑允许匹配 `CopyOfSummaryTable`\
  \ 变量中与 `InnerGroup` 变量中 `[Daily Revenue]` 值相同或更高的行。\n\n对于 `InnerGroup` 表变量中的任何给定产品，恰好具有该产品最高\
  \ `[Daily Revenue]` 值的行在 `CopyOfSummaryTable` 中只能找到一个匹配行（即它自身）。同一产品中具有次高值的 `InnerGroup`\
  \ 行会找到两个匹配行，依此类推，直到来自 `InnerGroup` 的、同一产品中具有最低值的行是唯一不匹配的行。然后，该行会与 `CopyOfSummaryTable`\
  \ 中同一产品的所有其他行匹配，这意味着对 `[RowCounter]` 列执行 `SUM` 会返回一个具有最高数值（最低排名）的结果。\n\n本节的最后一步是将上一步的笛卡尔输出重新分组成每个产品和日期对应一行的形式。`SUMMARIZE`\
  \ 和 `SUMMARIZECOLUMNS` 函数都不能用于存储在变量中的表表达式。这两个函数都只能作用于物理表。幸运的是，可以使用 `GROUPBY` 函数，但聚合表达式必须使用迭代函数。这会根据\
  \ `[Product]` 和 `[Date]` 对 `CrossJoinTables` 变量进行分组，创建一个汇总表。\n\nDAX 中不存在 `COUNTROWSX`\
  \ 迭代函数；如果存在，它可以用来计算每个 `[Product]` 和 `[Date]` 所属的行数，以便在汇总时提供排名值。在这种情况下，第一步引入的 `[RowCounter]`\
  \ 列允许通过对此列中硬编码的值执行 `SUMX` 来采用等效方法。\n\n如果该列中没有 `BLANK` 值，另一种方法是直接使用 `COUNTAX(CURRENTGROUP(),\
  \ [Column])`，从而避免引入每行值都为 `1` 的列。\n\n在 `MAXX` 和 `SUMX` 函数中使用的 `CURRENTGROUP()` 函数是对\
  \ `GROUPBY` 函数中用作第一个参数的表的引用。\n\n这里使用 `MAXX` 函数是为了将每天的日销售总额存储在 `[Daily Revenue]`\
  \ 列中。这有助于将相同值的重复实例缩减为每个产品/日期的一个实例。此值并不反映单笔交易的最大值，而是代表该产品每天的总销售额。这一步不执行聚合；相反，它有助于将日销售数据保留到下一步。\n\
  \n`ProductByDateRanking` 变量的输出类似于图 9-13。\n\n![A456681_1_En_9_Fig13_HTML.gif](img/A456681_1_En_9_Fig13_HTML.gif)\n\
  \n图 9-13\n\n清单 9-14 和 9-15 中代码的样本输出（按排名排序）\n\n按产品和排名排序后，每日收入数据如预期显示。注意每行的日期是跳跃的。每个产品构成不同排名位置的日期都不同。\n\
  \n此表包含产品有销售记录的每一天对应的排名值。下一步是过滤这些数据，只保留每个产品排名前十的行。清单 9-16 展示了 `FILTER` 函数的这种直接用法。\n\
  \n```\nVAR TopTenDaysPerPRoduct =\nFILTER(\nProductByDateRanking,\n[Rank]<=10\n\
  )\n清单 9-16\n清单 9-15 中代码的附加步骤\n```\n\n现在你拥有了一组仅涵盖每个产品最佳十天的数据。满足初始要求的最后一步是计算每个产品 `[Daily\
  \ Sales]` 的平均值。再次提醒，这里不能使用 `SUMMARIZE` 和 `SUMMARIZECOLUMNS`，因为它们不能处理存储在变量中的表表达式。因此，最后一步（清单\
  \ 9-17）使用 `GROUPBY` 函数来计算平均值。\n\n```\nRETURN OuterGroup =\nGROUPBY(\nTopTenDaysPerProduct,\n\
  -- 分组依据 --\n[Product],\n-- 聚合列 --\n\"Average of Top 10 Best Days\",\nAVERAGEX(\n\
  CURRENTGROUP(), [Daily Revenue]\n)\n)\n清单 9-17\n添加到清单 9-16 中代码的最终 RETURN 语句\n```\n\
  \n\n\n现在，该步骤使用 `TopTenDaysPerProduct` 变量将上一步骤中的工作数据聚合为每个产品仅保留一行。所有产品都将在此表中对应一行。接着，`AVERAGEX`\
  \ 迭代函数与 `CURRENTGROUP()` 函数结合使用，对每个产品的 `[Daily Revenue]` 数据求平均值。\n\n最终输出是一个两列的表（图\
  \ 9-14），满足了这一特殊报告需求。我选择这个场景并非因为它是一个你常遇到的常见问题，而是因为它展示了你在 DAX 中可用于处理额外复杂程度场景的各种技巧。\n\
