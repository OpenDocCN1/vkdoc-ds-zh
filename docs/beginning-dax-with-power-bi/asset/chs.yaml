  另一个有助于开发和调试 DAX 计算的工具是 Microsoft SSMS。如果你正在使用 Microsoft SQL 数据库，你可能已经拥有此工具。如果没有，快速搜索互联网会引导你找到
  Microsoft 网站上的正确下载位置。这是一个较大的下载文件，因为它包含了用于处理整个 Microsoft SQL 产品套件（而不仅仅是 DAX 模型）的功能。


