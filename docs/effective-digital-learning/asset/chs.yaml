  和 Google 相册共享。如果你需要更多空间，始终可以升级到付费方案。你的组织可能有提供无限存储空间的方案，因此最好去了解一下。你还可以在 Google 云端硬盘内与他人共享文件和文件夹，这可以节省时间和纸张，并促进协作。


