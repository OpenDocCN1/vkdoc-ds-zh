  如果你有 Microsoft 账户，则可以使用 OneDrive。OneDrive 可在以下设备上运行：


  - 搭载 Windows 10 的 Windows 个人电脑和笔记本电脑

  - Windows Surface 平板电脑

  - Xbox One 主机


  它包含 5GB 的免费文件存储空间。OneDrive 的一个功能是它会自动将你的文件备份到云端。它还会同步这些文件，以便你可以从任何设备访问它们。你也可以从 OneDrive
  共享文件。大多数组织使用 Office 365，因此你已经可以访问 OneDrive。你需要询问你的存储容量。


  ## 实用工具


  除了已经提到的工具之外，一些重要的实用工具可以帮助你创建引人入胜的虚拟学习内容。它们还可以帮助你呈现更专业的形象。


  ### Grammarly


  你收到过多少次不仅难以阅读，而且难以理解的书面沟通内容？可能比你愿意记起的次数还要多。想象一下，当你的在线学习者收到写得糟糕的沟通内容时，他们会是什么感受。写得糟糕的沟通内容会导致学习者失去对教育工作者及其专业知识的信任和信心。没有恰当书写的思想和想法无法轻易传达。


  Grammarly 是一个基于 Web 的应用程序，可以帮助你提高写作的有效性和专业性。它提供免费和付费版本。要使用它，你可以将书写的文本复制并粘贴到 Grammarly
  网站，或者将文件上传到 Grammarly 进行检查。还可以安装一个 Grammarly 插件，并在 Microsoft Word 以及你的浏览器中运行。一旦
  Grammarly 获得你的文本，它就会检查其中的语法错误以及其他方面，以产生清晰简洁的写作。它还可以检查你的电子邮件、社交媒体帖子等。通过使用 Grammarly，你可以确保你的课程内容没有错误，并以最佳方式呈现自己。它还能帮助你的学习者建立对你和你的专业知识的信任和信心。你可以访问
  [`www.grammarly.com`](http://www.grammarly.com) 找到 Grammarly。


  ### 截图工具


  虽然它不是在线资源，但它是一个免费且对教育工作者有价值的资源。对于使用 Windows 7 及更高版本的 PC 用户来说，有一个预装的应用程序叫截图工具。截图工具提供了执行屏幕截图的功能。可以通过在
  Windows 任务栏的搜索框中输入 `Snipping Tool` 来打开它。打开后，你可以按以下形式之一截图或捕获信息：


  - 任意格式截图

  - 矩形截图

  - 窗口截图

  - 全屏截图


  截图完成后，你可以将其保存到个人电脑中，以包含在你的课程材料中，例如讲座、文档、公告、讨论、作业等。


  ## 总结


  正如你所见，免费并不总是意味着差劲或低劣。网上有如此多的可用于虚拟学习的免费资源，我们很难在这本书中一一列举。希望你已经看到，许多这些免费资源与它们的付费版本相比毫不逊色。既然你已经了解了其中一些资源，你就可以开始创造令人兴奋的在线学习体验，让你的学习者永难忘怀。你也不会忘记它，因为在此过程中你省下了钱。


