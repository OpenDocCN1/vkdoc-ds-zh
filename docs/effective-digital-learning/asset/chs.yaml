  ## YouTube


  还有什么地方比 `YouTube` 更适合推广你自己和你的在线课程呢？根据 `hootsuite.com` 的数据，`YouTube` 是 18 至 34 岁人群在电视屏幕上观看视频的第二大首选平台。^(²⁵)
  `Pew Research` 也认为 `YouTube` 是美国最受欢迎的平台。^(²⁶) 为了展示你的专业知识，何不创建一个 `YouTube` 频道，上传教授你课程内容的简短教程视频呢？观众可以一窥你的教学风格，同时更多地了解你和你能提供的内容。在制作视频时，请确保在视频标题和描述中包含关键词，以便学习者在
  `YouTube` 或 `Google` 上搜索时更容易找到。你还应确保在 `YouTube` 视频中包含你的社交媒体账号，以吸引关注者。关键在于让学习者能够轻松地找到并关注你。


  `YouTube` 的另一个优点是，你可以将 `YouTube` 视频嵌入到你的网站/博客中，或者轻松地在多个社交媒体平台上分享视频链接。这是你利用单一的营销资产实现多种营销目的以获得最大影响力的另一种方式。


