  ## 在线表单


  能够在虚拟学习环境中使用在线表单可以节省您的时间，并让您更快地收到回复。有许多选项可以帮助您，但有一个您不应忽视的免费资源：Google Forms。


  ### Google Forms


  Google Forms 允许您为个人或商业用途创建在线表单。要开始使用 Google Forms，您需要一个 Google 帐户，个人创建是免费的。如果您为一个组织工作，您应该核实该组织是否可以使用
  Google Workspace。如果不能，则您的组织需要注册 Google Workspace 以获得增强的安全性和团队协作能力。


  在 Google Forms 中，有许多模板可以帮助您快速入门。如果找不到满足您需求的模板，您可以创建自己的模板。Google Forms 的界面易于使用，并且可以在您的虚拟教室中轻松实施。您需要做的就是在课程材料中包含一个
  URL。您可以创建的一些表单类型包括：


  *   调查问卷

  *   测验

  *   活动注册

  *   课程评估

  *   活动反馈


  您可以创建的表单类型不受限制。只要您能想象到，就能在 Google Forms 中设计出来。表单是获取学习者反馈的好方法，可以帮助您调整教学方法。


  ## 云存储


  在您为课程创建内容时，您希望确保可以从任何设备访问您的材料。您永远不知道意外何时会发生，因此做好备份是个好主意。云存储就是解决方案。使用云存储，您的信息被存储在“云端（网络上的计算机上）”，从而可以从任何联网设备访问。




  ### Google 云端硬盘


