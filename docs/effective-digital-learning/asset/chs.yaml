- '# 2. 在线学习设备


  正如你在前一章所学到的，传统的实体学习环境已被在线学习所改变。传统学习不再是学习者和教育者唯一的选择。多年来，在线学习赋予了学习者灵活性，使他们能够利用当时可用的任何媒介，在方便的时候学习新技能。同时，它也允许教育者按照自己的时间表授课。如今，互联网是主要的在线学习媒介。物理课堂环境不再是唯一的选择，这有助于消除一些教育障碍。你可能渴望成为一名在线学习者或在线教育者，但不确定需要哪些必要的设备。你需要准备些什么才能开始呢？


  ## 技术需求


  无论你想成为在线学习者还是在线教育者，成功都取决于一个关键因素：技术。技术是在线学习的核心。它是学习发生的通道。如果没有合适的技术，你的效率或生产力将大打折扣。同样，你也会浪费宝贵的时间和金钱。结果就是，你无法享受到在线学习所提供的优势。好消息是，在线学习所需的技术门槛其实非常低。




  '
- '# 硬件


  虽然你不需要拥有最新的电脑，但它至少不能超过 2 到 4 年的使用年限。计算机技术日新月异，今天流行的配置大约在 2 到 5 年内就会过时。大多数教育机构会为学习者和教育者提供与自身技术基础设施相匹配的硬件要求。一条值得遵循的好原则是，使用一台使用年限在
  2 到 3 年之间的台式机或笔记本电脑，并满足以下最低配置要求：


  *   `Windows 7` 操作系统或 `Mac 10.2 Sierra` 操作系统或更高版本

  *   `Intel i3` 双核处理器或等效的 `AMD` 处理器或更高版本

  *   `2 GHZ` 或更高主频的处理器

  *   `1GB` 可用磁盘空间

  *   `4GB` 或更高容量的内存

  *   网络摄像头


  你也可以使用更旧的电脑。但这会影响你的在线学习体验。处理器速度和内存越高，能同时打开的应用程序就越多，电脑运行速度也会更快。


  `Chromebook` 是屏幕较小的小型笔记本电脑，运行谷歌的操作系统 `Chrome OS`。通常，它们比台式机和笔记本电脑便宜，并可使用 Google 的云端应用程序，例如
  `Gmail` 和 `Google Drive`。由于其处理器速度慢、内存容量小，它们不应作为涉及编程或其他处理器密集型课程的高等在线学习首选设备。然而，对于中小学生来说，它们是个不错的选择。`Chromebook`
  的另一个限制是，没有网络连接就无法使用。


  随着移动设备尺寸的不断增大，它们将继续为传统和在线学习增添灵活性。许多学习资源都可以通过这些设备上的应用程序获取。像`Remind` 和 `Show My Homework`
  这类的通知应用，可以帮助教育工作者与学生及其家长进行沟通。一些移动设备可能比台式机或笔记本电脑更昂贵。它们也缺少物理键盘，这需要额外购买。最后，它们的处理速度和内存有限。凭借其便携性，它们非常适合用来辅助进行移动学习。


  '
- '# 打印机


  尽管你的大部分在线学习都在网上进行，但有时你还是需要打印文档。拥有一台喷墨或激光打印机，你就可以在需要时进行打印。喷墨打印机的初始购置成本可能低于激光打印机。然而，与喷墨打印机相比，激光打印机使用其碳粉盒可以打印更多页面。如今，许多一体式打印机都带有扫描功能，这可以为你节省金钱和空间。


  '
- '# 扫描仪


  有扫描仪很好，但并非必需。如果还没有扫描仪，也不用担心。许多扫描应用程序可以在移动设备上免费或付费使用。例如，`Notes` 应用在 `iOS` 设备上是免费提供的，并且可以用来扫描文档。


  '
- '# 软件


  你所需的主要软件是一个网络浏览器，例如 `Firefox`、`Safari`、`Edge` 或 `Google Chrome`。学习资料通常通过浏览器来访问。除了浏览器之外，你还需要一些额外的软件。


  ## Microsoft 365


  `Microsoft Office` 是学校和组织机构使用的行业标准应用。它允许你使用其广受欢迎的程序，如 `Word`、`PowerPoint` 和 `Excel`，来创建文档、演示文稿、电子表格等。它还包含用于电子邮件的
  `Microsoft Outlook` 和用于云端存储需求的 `OneNote`。对于中小学、高等院校的学生以及使用以 `.edu` 结尾的电子邮件地址的教育工作者，可以从微软官方网站免费下载
  `Microsoft 365`（图 2-1）。订阅信息可在微软官网上找到。


  ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig1_HTML.jpg](img/501049_1_En_2_Fig1_HTML.jpg)


  图 2-1


  Microsoft 365 的微软官网


  此外，`Microsoft 365` 和 `Google Docs` 的应用在 `Apple App Store` 和 `Google Play Store`
  上也是免费提供的。许多基于云的应用程序使得在电脑和移动设备上使用这些应用变得更加容易。然而，如果没有付费订阅 `Microsoft 365`，其功能是受限的。


  ## 杀毒软件


  由于你将要在网上工作并上传、下载文件，因此最好在你的电脑或移动设备上安装杀毒软件。杀毒软件可以保护你的电脑免受病毒和其他可能感染并损害你电脑或移动设备的威胁。一旦安装杀毒软件，应对其进行设置，使其能自动更新，以保护你的电脑或设备免受每日出现的新型威胁。一些既提供免费选项也提供付费选项的流行杀毒软件包括：


  *   `Avast` – [`www.avast.com`](http://www.avast.com)

  *   `AVG` – [`www.avg.com`](http://www.avg.com)


  其他流行的付费杀毒软件选项包括：


  *   `McAfee` – [`www.mcafee.com`](http://www.mcafee.com)

  *   `Norton` – [`www.norton.com`](http://www.norton.com)


  ## PDF 阅读器


  `PDF` 是网络上使用的标准文档格式。只要安装了诸如 `Adobe Acrobat Reader` 之类的程序，就可以在所有设备上查看 PDF 文件。`Adobe
  Acrobat Reader` 是查看 PDF 文件的行业标准，可从 Adobe 官网免费下载（图 2-2）。


  ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig2_HTML.jpg](img/501049_1_En_2_Fig2_HTML.jpg)


  图 2-2


  `Adobe Acrobat Reader` 可从 Adobe 官网免费下载：[`​get.​adobe.​com/​reader/`](https://get.adobe.com/reader/)


  ## 云端存储


  由于在线学习提供了随时随地工作的灵活性，你需要能够从任何地方、任何设备访问你的文件。云端存储也可用于备份重要文件。一些流行的云端存储选项包括：


  *   `Microsoft OneDrive`（随`Microsoft Office 365`附送）

  *   `Dropbox` – [`www.dropbox.com`](http://www.dropbox.com)

  *   `Google Drive` – [`www.google.com/drive/`](http://www.google.com/drive/)


  ## 图形设计软件


  除了你常用的软件需求外，你可能还需要图形设计软件来为视频、网站、摄影等创建图形。为满足你的图形设计需求，`Adobe Creative Cloud` 包含了如
  `Photoshop` 和 `InDesign` 等业界标准应用，可在 [`www.adobe.com`](http://www.adobe.com) 获取。它提供了满足你创意需求的桌面和移动应用。你可以按月或按年订阅单独的应用或所有
  Adobe 应用。拥有有效资格证明（如学生证或学校邮箱）的教师和学生可在购买时享受折扣。


  尽管 `Adobe Creative Suite` 非常适合图形设计，但它可能价格不菲。一些免费且开源的图形设计软件包括：


  *   `Gimp` – [`www.gimp.org`](http://www.gimp.org)

  *   `Canva` – [`www.canva.com`](http://www.canva.com)




  '
- '# 网络连接


  没有网络连接，在线学习便无从谈起。如今的智能手机和平板电脑（如 iPad）可作为个人热点提供网络接入，但其速度通常无法与家庭、图书馆或餐厅的网络连接速度相提并论。新冠疫情之前，人们可以去当地的图书馆或餐厅免费使用网络。然而，疫情期间出于安全考虑，许多场所都关门了。在许多社区和农村地区，存在“数字鸿沟”，高速网络或宽带网络既不可用也负担不起。结果，许多人仍然无法上网。


  由于如今的在线学习包含多媒体及其他资源，因此需要高速网络连接。根据[`www.reviews.org`](https://www.reviews.org)的定义，高速网络连接是指下载速度至少达到
  25 Mbps 的网络。^(⁶) 拥有高速网络的美国家庭比例已从 2018 年的 65%增长至 2019 年的 73%。^(⁷)


  '
- '# 配件


  既然您已经了解了核心硬件和软件需求，那么还需要购买一些必要的配件。这些配件将为您带来更好的在线学习体验。


  ## 带麦克风的耳机


  根据您的环境，配备带麦克风的耳机总是个好主意。耳机可以让您在不依赖设备扬声器的情况下私密地查看多媒体内容，同时也不会打扰到周围的人。对于需要使用语音的学习活动，投资一款带降噪麦克风的耳机是明智之举。它可以过滤背景噪音，让听众清晰地听到您的声音。大多数电脑和移动设备都内置了麦克风，但它们往往具有方向性，会拾取房间内的所有背景噪音而非过滤或降低噪音。此外，与外部麦克风相比，其语音质量也欠佳。


  一款带降噪麦克风的外部耳机并不昂贵。平均价格约为 40 美元，但根据降噪级别不同会有所上涨。无论选择哪款耳机，请注意其接口类型是 USB、Lightning 端口还是
  3.5 毫米插头，以适配您的设备（图 2-3）。


  ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig3_HTML.jpg](img/501049_1_En_2_Fig3_HTML.jpg)


  图 2-3 可从亚马逊购买的、适用于电脑在线学习的 USB 耳机


  对于 iPhone 用户，苹果公司带 Lightning 接口的 EarPods 是另一选择（图 2-4）。它也支持 3.5 毫米转接器，可用于电脑，以及新款
  iPhone、iPad 和其他移动设备。大多数智能手机都附带带麦克风的耳机，可在您找到替代品前使用。尽管苹果 EarPods 带有麦克风，但并未提供降噪功能。


  ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig4_HTML.jpg](img/501049_1_En_2_Fig4_HTML.jpg)


  图 2-4 适用于在线学习的苹果 EarPod 耳机选项


  ## 网络摄像头


  虽然对于某些在线学习来说，网络摄像头是可选项，但它是一个不错的补充。大多数电脑和移动设备都内置了网络摄像头。对于学习者而言，它能为在线课堂带来传统学习的面对面元素。对于教育者而言，网络摄像头也有很多好处。首先，它允许教育者录制课程内容并在虚拟课堂中分享。这些内容还可以被重新利用，并在各种社交媒体平台上分享。网络摄像头让教育者能与学习者建立个人联系。当学习者能将名字与面孔对应起来时，可以缓解在线学习中的一些孤立感和焦虑感。


  如果您没有网络摄像头，移动设备的摄像头也能派上用场。大多数移动设备摄像头分辨率很高，不仅能拍摄出色的照片，还能录制视频。例如，iPhone 7 之后的新款 iPhone
  拥有卓越的摄像头，不仅可用于拍照，还能制作视频。新款 iPad 也是如此。如果您使用这些设备，还需要购买一个三脚架来稳定设备。


  ## 总结


  正如我们所看到的，在线学习对技术设备的要求其实很低。您可能已经拥有其中的许多物品，这可以节省您的时间和金钱。这也有助于打消您可能听过的关于开始在线学习的某些误解。第一次尝试任何事情都可能看起来令人生畏，但您能做到。有了合适的设备，您的旅程就能从一个积极的开始起步。在下一章中，您将探索如何成功规划您的在线学习之旅。正如那句老话所说：“*如果你不做计划，那你就是在计划失败*。”您将制定一个计划。


  脚注 1 2


  '
- '# 3. 在线学习规划


  在上一章中，我们探讨了学生和教育者所需的在线学习技术设备。如果没有合适的技术，教育者和学生可能会经历本可避免的不必要的挫败感。尽管技术是在线学习体验的核心，但其他关键组成部分也至关重要。规划有助于教育者利用各种在线学习技术组件，为学习者创造最佳学习体验。


  规划需要着眼于全局，确定在线学习环境中哪些独立的组成部分能协同工作以惠及学习者。如果没有一个深思熟虑的计划来统筹所有部分如何协同工作，在线学习可能会变得困难重重，无法为教育者和学生带来预期的成果。正如那句老话所说：“*如果你不做计划，那你就是在计划失败*。”一份详细的计划可能是成功与失败的分水岭。在制定计划之前，您必须先明确目标。


  ## 目标


  清晰的目标能让您专注于自己的目标。在传统学习中，许多教育者利用教案来安排每日工作并保持专注。尽管由于新冠疫情，学习环境有所不同，但方法依然不变。您必须有计划和目标。目标驱动您的动力，并引领您的一天。在典型的学习日里，您会被各种事务分散精力，因此清晰界定的目标能降低您分心的可能性。在线学习对教育者或学生来说都不容易，尤其是在疫情期间。这是一片未知领域，每个人都在学习如何每日探索。清晰的目标提供了一张路线图，您可以据此保持正轨或根据需要调整方向。为了确定目标，您可以问自己一些可能的问题，包括：


  -   您想要达成什么成果？

  -   您为什么进行在线教学？

  -   在线教学对您为什么重要？

  -   您希望通过在线学习实现什么？


  一旦回答了这些问题，您应该将它们记下来，可以写在日志里，也可以写在您最喜欢的笔记类移动应用中，比如 `Evernote` 或 `Microsoft OneNote`，以便定期回顾。它们将成为您日常的动力。既然目标已经明确，还有一些其他因素需要考虑。




  '
- '# 在线学习组织


  组织学习材料是一个重要步骤，但在在线学习中常常被忽视。如果没有直观的组织系统，你可能会浪费宝贵的时间去寻找学习资源。在创建学习资源时，请确保为它们起好描述性名称，并将其保存在计算机上描述性明确的文件夹中。此外，将学习资源备份到云端系统（如`Microsoft
  OneDrive`或`Google Drive`）也是一种良好实践。


  虽然你的学习管理系统已经具备了组织架构，但你仍需确保添加的学习资源能让学习者直观地找到所需材料。没有什么比在在线学习环境中难以轻松找到内容更让学习者沮丧的了。在创建任何学习资源之前，始终要优先考虑你的受众，以保证获得最佳效果。


  '
- '# 心态


  最难改变的事情之一是我们对某些事物的心态。没有人喜欢改变，但改变是不可避免的。本杰明·富兰克林的名言概括了大多数人对生活确定性的感受：*世上唯有死亡和纳税是确定的*。当我们遇到新事物或与常规不同的变化时，我们可能会感到害怕。正如我们在新冠疫情中所见，那些曾被视作我们生活各方面常态的事物已不复存在。一切都已改变，我们必须适应。通常，让我们害怕的更多是对未知的恐惧，而非改变本身。


  在线学习可能让你感觉不太舒适。当你将一个新概念与熟悉的概念进行比较时，忧虑很容易产生。许多教育工作者在没有接受任何培训的情况下就被推入了在线学习的模式，只能边做边摸索。对许多人来说，传统学习模式多年来已深深根植于他们的思想和生活中。这是大多数人熟悉且一直在使用的教学模式。而其他一些教育工作者则已经熟悉在线学习，并正在寻找提升自己技能的方法。


  当在线学习最初作为传统学习的另一种选择出现时，许多教育界人士都持怀疑态度，因为这是对常规的改变，令他们感到陌生。他们无法理解学习如何能够在实体教室之外进行。对一些人来说，克服这些感受可能很困难，这会导致他们错失在线学习的机会。无论使用何种媒介，学习仍然可以发生。以下是一些有助于影响你的心态，同时提升在线教学技能和知识的资源：


  *   Corwin – [`https://us.corwin.com/en-us/nam/online-teaching-toolkit`](https://us.corwin.com/en-us/nam/online-teaching-toolkit)

  *   Future Learn – [`www.futurelearn.com/info/blog/resources-for-online-teaching-during-coronavirus`](http://www.futurelearn.com/info/blog/resources-for-online-teaching-during-coronavirus)

  *   eLearning Industry – [`https://elearningindustry.com/`](https://elearningindustry.com/)

  *   Edutopia – [`www.edutopia.org/`](http://www.edutopia.org/)

  *   Faculty Focus – [`www.facultyfocus.com`](http://www.facultyfocus.com)


  作为教育工作者，能够克服这些感受至关重要。这些感受会间接和直接地影响你对在线学习的态度，并可能在你的在线教学实践中悄然显现，暗中破坏你的努力。在线学习不应被视为传统学习的替代品，而应被视为一种补充。每个人的学习方式不同，并在适合自己的教学模式下表现出色。保持开放和积极的心态，能激励你付出最佳的教学努力，帮助学生有效学习。


  '
- '# 时间管理


  每个人一天都有 24 小时。在这 24 小时内，我们要同时处理那些可能完成也可能无法完成的日常事务。一旦这些时间过去，我们就无法挽回，必须第二天重新开始。与传统学习相比，在线学习没有固定的在校时间，这需要更好的时间管理能力。与许多人的看法相反，在线学习需要大量的准备和努力。很多时候，在努力平衡学习者的需求以及自己的职业和个人需求时，你的工作日似乎永无止境。有时，这可能会让人感到不堪重负。由于没有传统学习提供的预排日程表，在规划教学安排时很容易忘记事情。


  在线学习提供的灵活性有助于平衡工作与生活。然而，许多教育工作者仍然被生活中的各种任务压得喘不过气来。在新冠疫情期间，许多教育工作者既要进行在线教学，又要帮助自己的孩子进行在线学习。有些人可能还需要照顾他人或应对个人健康问题。在传统学习和在线学习模式中，教育工作者都需遵守出勤和参与要求，同时要学会在这种新常态下保障安全并开展教学。兼顾这些并不容易。尽管你可能已经有了日程安排工具，但多一些选择总没坏处。


  `Google Calendar` 是一个免费的在线日历系统，用于安排约会和其他重要事件。你可以把它看作一个具有时间管理功能的在线计划本。这些事件不仅可以在线查看，还可以保存到你的移动设备日历中（图
  3-1）。通过使用像`Google Calendar`这样的日历系统，你可以安排备课时间、作业截止日期、办公时间等，而不会遗漏任何事项。由于它是基于云端并通过`Gmail`账户使用的，可以在任何设备上查看。同样，`Google
  Calendar`应用程序可以下载到`iOS`和`Android`移动设备上。


  ![../images/501049_1_En_3_Chapter/501049_1_En_3_Fig1_HTML.jpg](img/501049_1_En_3_Fig1_HTML.jpg)


  图 3-1


  可用于约会和提醒的`Google Calendar`


  另一种选择是使用你移动设备的日历。由于我们很多人总是随身携带移动设备，我们可以轻松地安排活动并接收通知。你甚至可以提前几天设置提醒，通知你会议、办公时间和评分截止日期。


  `Microsoft To Do` 是另一个可以加入你教学工具箱的工具。它可以作为个人计划本，用于创建待办事项列表和提醒，帮助你在一天中保持专注和条理清晰。它是免费的，可以通过网络使用，也可以在`Windows`、`Android`和`iOS`平台上作为应用程序使用（图
  3-2）。


  ![../images/501049_1_En_3_Chapter/501049_1_En_3_Fig2_HTML.jpg](img/501049_1_En_3_Fig2_HTML.jpg)


  图 3-2


  `Microsoft To Do` 允许你创建待办事项列表，以保持条理清晰和专注


  '
- '# 工作区域


  虽然在线学习允许你在任何地方工作或教学，但一个专门的教学区域可以提高你的效率。一旦进入这个空间，你的身心就会像走进实体教室一样知道教学活动即将开始。教学区域还能减少干扰，让你保持专注。


  每个人都听过这样的说法：杂乱的工作空间代表杂乱的思维。在某种程度上，这是真的。杂乱不仅会影响我们有意识的思维，还会影响我们的潜意识。根据《今日心理学》的说法，杂乱会导致我们的思维不如应有的那般敏锐。⁸
  杂乱还会加剧我们的压力和焦虑水平。拥有一个整洁的教学工作区域，能为你做好准备并激励你走向成功。在视频会议期间，整洁的区域还能展现专业的形象。虽然这些看似小事，但它们积累起来会对你的教学成功产生重大影响。




  '
- '# 社交媒体支持


  有时，在线学习会让人感到孤立无援。但这并非必然。有许多在线群组可以加入，以获得在线教学环境的协助。例如，Facebook 上有许多群组和主页可以加入或关注，以获取关于在线学习的新见解和资源。同样，你也可以与其他在线教育者建立联系。你可能会想关注的一些
  Facebook 主页包括：


  -   Global Online Academy

  -   TED-Ed

  -   Global Educator Collective

  -   edX

  -   Khan Academy


  你可能想加入的 Facebook 群组包括：


  -   Digital Resources for Distance Learning

  -   Distance Learning Educators

  -   Online Teaching Strategies for Educators


  LinkedIn 是另一个不错的社交媒体资源，它提供了可以加入的群组，不仅能建立人脉，还能学习新的在线学习策略。


  '
- '# 自我关怀


  教育工作者往往将学生的需求置于自身需求之上。对于在线学习，你很容易在电脑或移动设备上投入比传统面对面教学更多的时间。有时候，你必须稍微“自私”一点。务必牢记那句老话：“你不能从空杯里倒水出来。”照顾好自己，安排一些时间进行自我关怀，以便充电和重整旗鼓。否则，你很快就会感到精力耗竭。一些简单的自我关怀建议包括：


  -   安排每日锻炼，例如散步或瑜伽

  -   设定固定的工作时间

  -   健康饮食

  -   多喝水

  -   保证充足休息

  -   在一天中适时休息


  ## 总结


  在线学习不仅仅是技术问题。你必须有一个深思熟虑的计划作为你的路线图。然而，你也需要根据需要调整计划。罗伯特·伯恩斯在《致小鼠》中的一句话概括了你应如何看待计划：*老鼠和人的最佳计划往往落空*。


  无论一个项目规划得多么周密，总可能出岔子。要灵活变通。


  '
- '# 4. 内容为王


  在第三章中，你了解了规划的重要性及其在在线学习体验中的作用。规划为教育者和学习者双方取得良好成果奠定了基础。然而，它并不能总是保证积极的教学成果。新冠（Covid-19）等意外情况会发生，因此必须制定应急方案。不过，规划确实有助于以积极的方式开启在线学习之旅。充分理解了规划过程后，你就可以开始构思和规划你的在线学习内容了。


  我们都听过“内容为王”这个说法，而在在线学习领域，这一点尤为确切。由于在线学习不像传统学习那样有实体教师和教室，因此内容必须经过精心规划和设计。根据质量和交付方式，内容可以成就或毁掉一次在线学习体验。它还必须由许多不同的学习组件构成。否则，它可能无法带来预期的益处，从而导致失败。


  ## 内容基础


  内容是在线学习体验的核心。它包含学习者在指定路径上完成的学习目标和成果。在学习主题的过程中，学习者与内容进行交互。在学术界，传统学习和在线学习通常遵循某种教学法。韦氏词典将教学法定义为“教学的艺术、科学或专业”。教学法与内容协同作用，以实现学习目标和目的。


  许多不同的内容元素被用于实现在线学习教学法。以往，将书面讲义插入学习管理系统或发布在指定网站上，再辅以电子书，是传递在线课程内容的主要方法。除了测验和考试，几乎没有方法可以分析学习材料是否有效。随着技术创新和创造性思维的发展，内容创作已经大大演变。书面讲义现在与以下内容相结合：


  -   视频

  -   播客

  -   网络文章

  -   博客文章

  -   幻灯片（PowerPoints）

  -   Prezis


  如今，内容的组织不仅旨在促进批判性和分析性思维，也旨在促进学习者的参与。在接下来的章节中，你将探索特定的应用程序和应用，以帮助你创建各种类型的内容。


  尽管内容可以有多种形式，但其关注点必须始终将学习者及其需求放在首位。学习者是在线学习等式中最重要的利益相关者。在创建任何内容之前，都应始终考虑学习者及其学习风格（图
  4-1）。


  ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig1_HTML.jpg](img/501049_1_En_4_Fig1_HTML.jpg)


  图 4-1. 学习者的四种学习类型


  不幸的是，不存在一种适用于所有学习者的“一刀切”内容。并非所有学习者的学习方式都相同。例如，一些学习者有听力或视力障碍等残疾，需要无障碍便利措施（图 4-2）。无障碍便利措施的一个例子是在视频中包含字幕和文字记录，以方便使用屏幕阅读器的视力障碍学习者。在创建内容时未能考虑这些学习者，可能会将他们排除在你的在线学习体验之外。


  ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig2_HTML.jpg](img/501049_1_En_4_Fig2_HTML.jpg)


  图 4-2. W3C 提供了关于使网站内容可访问的信息


  内容还应该是易于快速浏览的。大多数人不喜欢在任何尺寸的屏幕上阅读长篇大段的文字和长句。这可能会让人望而生畏。使用项目符号是使内容易于浏览的好方法。在段落之间利用空白区域是使内容易于浏览的另一种方法。


  ## 内容的目的


  作为一名教育工作者，你比任何人都更了解你的学科。你是主要的内容创作者和学科专家，知道哪些学习材料有效或无效。新的学习资源层出不穷。根据你的预算和可用资源，你可能忍不住想购买其中一些。尽管它们可能补充你的内容，但你需要做出一些重要决定。例如，这些材料的价格范围从免费到昂贵不等。无论价格如何，学习材料必须服务于一个主要目的：促进学生学习。那些提供最新花哨功能的内容和材料可能看起来很棒，但你必须愿意问自己以下问题：


  -   它是否有助于学生更好地理解材料？

  -   它是否会鼓励学生运用他们的批判性思维技能？

  -   它是否会为内容以及学生增加价值？


  不考虑学习者而考虑内容，就如同在黑暗中作画。你确实会把颜料涂到墙上，但当打开灯时，效果却不会好看。切勿忽视你内容的主要目的。




  '
- '# 内容目标


  确定内容目标至关重要。站在学习者的角度思考是设定目标的有效方法之一。对内容提出问题，是评估其是否能满足学习者需求与期望的好技巧（图 4-3）。同样，这也有助于你判断内容是否能帮助你实现课程成果。这些问题的顺序并不重要，重要的是它们能帮助你集思广益，明确内容目标。


  ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig3_HTML.jpg](img/501049_1_En_4_Fig3_HTML.jpg)


  图 4-3


  准备内容时应思考的问题


  另一个需要牢记的目标是**注意力持续时间**。大多数人的注意力持续时间并不长。此外，所有学习者的注意力持续时间也不尽相同。根据微软的一项研究，平均注意力持续时间已从
  2000 年的 12 秒下降到 2018 年的 8 秒。^(¹⁰) 如果再加上在线学习环境中学习者感到无聊时可以上网冲浪，注意力持续时间可能会进一步缩短。使用视频和
  Prezi 等具有吸引力和互动性的内容，可以在补充内容的同时帮助保持注意力。它还能激励学习者。我们将在本书后面讨论视频及其制作。


  **简洁性**通常是一个被忽视的内容目标。在内容中加入所有最新技术可能很有诱惑力。然而，这对学习者有何益处？这为内容增加了什么价值？如果你无法回答这些问题，那么可能就不需要这项技术。在考虑为内容应用任何技术时，请始终牢记**KISS
  原则**。简洁的内容不会出错，因为它总是可以进一步深化。


  ## 总结


  制作以学习者为中心的内容很重要。这有助于学习者判断内容的价值以及如何将其应用到实际情况中。创建在线学习内容没有神奇的公式。只要内容围绕学习者及其需求展开，就很有可能获得成功的结果。


  脚注 1 2


  '
- '# 5. 学习管理系统


  在第 4 章中，你学习了内容创作的基础知识，以及教育者和学习者如何从中获益。内容是任何学习，尤其是在线学习的核心。它奠定了学习的基调，并帮助学习者达到预期的课程成果。内容应侧重于质量而非数量。当高质量的内容具有吸引力并模拟真实应用场景时，学习者就会受到激励去学习，并渴望学习更多。他们的学习体验会变得更有意义，因为他们看到了内容的价值。他们也能看到自己的投资回报，而无需担心错失恐惧症（FOMO）。


  一旦内容被规划和创建好，就需要一个存储位置。通常情况下，内容会存储在内容创建者的电脑上，或者存储在 Google Drive、OneNote 等云存储中。尽管这些都是不错的短期选择，但还需要一个更具长期性、可扩展的解决方案，以便让目标受众能够访问这些内容。**学习管理系统（LMS）**
  提供了解决方案。


  ## 学习管理系统基础


  学习管理系统（`LMS`）是一种基于 Web 的软件应用程序，用于存储在线学习的学习内容材料和配套资源。这些资源可以包括：


  *   多媒体

  *   PDF 文件

  *   图片

  *   电子书

  *   音频文件

  *   社交媒体动态

  *   视频会议

  *   RSS 订阅源

  *   演示文稿文件


  由于 LMS 基于 Web，因此可以通过大多数联网设备上的 Web 浏览器进行访问。学习者通过 Web 浏览器访问 LMS，即可开始由教育者预先设定的学习路径，从而帮助他们实现预期的学习成果。LMS
  还能促进学习者和教育者之间便捷的沟通和信息共享。


  大多数 LMS 应用程序都提供移动应用，可以从苹果的 App Store 或安卓的 Google Play 商店下载。下载后，教育者和学习者都可以访问课程及其资料。例如，`Canvas`（Instructure
  公司开发）是最流行的 LMS 平台之一，被许多高等教育机构使用，它提供的移动应用可用于随时随地访问在线课堂。LMS 平台及其移动应用为学习者和教育者提供了在线学习所带来的额外灵活性和便利性。一些较大型机构使用的最流行的付费专有
  LMS 包括：


  *   Brightspace

  *   Blackboard Learn


  ### 选择 LMS 的考量因素


  在决定选择哪个 LMS 之前，你必须确定你的预算和需求。你不会在头脑中没有价格范围和需求清单的情况下去买房子。选购 LMS 也是如此。你不想投资一个至少不能满足你
  80% 需求的 LMS。这通常被称为**帕累托法则**，或 80/20 法则，以备受尊敬的经济学家维尔弗雷多·帕累托的名字命名。^(¹¹) 在考虑 LMS 时，你应该提出的一些问题包括：


  *   你的目标是什么？

  *   你需要哪些功能？

  *   LMS 能处理多少用户？

  *   LMS 的可扩展性如何？

  *   LMS 在你的预算范围内吗？

  *   提供什么类型的支持？

  *   LMS 对学习者和教育者来说使用起来有多容易？

  *   提供了哪些分析功能？

  *   LMS 是否提供无障碍访问设置？

  *   LMS 提供什么类型的安全保障？

  *   正常运行时间保证是多少？

  *   是否支持品牌定制？

  *   提供什么类型的培训？

  *   数据中心位于何处？

  *   它提供什么类型的安全保障？

  *   它易于使用吗？

  *   它是否具有响应式设计？


  ### LMS 的类型


  在寻找 LMS 解决方案时，你会遇到很多选择。然而，并非所有解决方案都同等优秀。不幸的是，没有一个万能的 LMS 适用于所有情况。因此，明确自己的需求非常重要。大多数
  LMS 产品属于以下三类之一：


  *   专有（商业）

  *   开源

  *   免费


  让我们探索这些类型，以帮助你根据自己的需求选择合适的 LMS。


  ### 专有 LMS


  专有或商业 LMS 平台由营利性组织创建。这些 LMS 平台按用户收取许可费，可以是按月、按年或基于订阅的方式，以便用户使用其系统。由于其高昂的价格和品牌声誉，它们通常被大型组织和大学使用。专有
  LMS 提供了许多组织现在或将来可能用到的各种花哨功能。同样，它们通常也为 LMS 提供托管服务以及安全保障。它们还通过服务水平协议提供所有维护和软件更新，这有助于可能缺乏技术资源的组织。当新功能可用时，通常会通过网络研讨会或录制视频向客户提供某种形式的培训。此外，还提供电话、电子邮件、在线聊天和在线支持论坛等形式的技术支持，这些通常包含在
  LMS 费用中。学校使用的几个 LMS 平台包括：


  *   Blackboard

  *   Microsoft Teams

  *   Canvas


  尽管专有 LMS 有优势，但也存在一些缺点。例如，客户必须等待 LMS 供应商提供软件修复和更新。同样，价格也可能随时上涨。




  ### 开源学习管理系统


  除了专有学习管理平台之外，还有开源学习管理系统可供选择。根据 Opensource.com 的定义，开源软件是“源代码可供任何人检查、修改和增强的软件”。^((12))
  与专有软件相比，开源软件无需支付许可费。尽管可以免费下载和修改，但与微软等大型专有供应商相比，一些人和组织仍然对其可靠性和安全性持怀疑态度。开源软件可以修改，但专有软件只能由其创建者修改。


  在比较开源学习管理系统和专有学习管理系统时，你必须记住，专有学习管理系统在其定价结构中提供了不同级别的专属支持。这种支持可以通过电话、电子邮件、在线聊天或在线知识库提供。开源学习管理系统通常通过在线论坛和文档提供支持。YouTube
  和谷歌搜索是解决开源学习管理系统问题的其他途径。


  如果你或你的组织缺乏实施开源学习管理解决方案的技术专长，则必须聘请人员或指定组织内的个人，通过在线文档、在线论坛和反复试验来学习并成为所选开源解决方案的专家。由于
  `Apache` 是一个由 Apache 软件基金会维护的流行开源 Web 服务器平台，并被众多 Linux（开源）服务器的主机提供商使用，因此与 Windows
  主机相比，你有可能节省托管费用。^((13)) 如果你更喜欢 Windows 虚拟主机，`Apache` 也可以使用，但你的网站托管费用可能会更高。


  一个开源学习管理系统的例子是 Moodle（图 5-1）。


  ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig1_HTML.jpg](img/501049_1_En_5_Fig1_HTML.jpg)


  **图 5-1** 可从 [`moodle.org`](https://moodle.org) 下载的 Moodle 开源学习管理系统


  `Apache` 虚拟主机提供商免费提供 Moodle，只需从名为 `cPanel` 的网络控制台单击一下即可安装。一些提供 Moodle 的热门网站托管服务商包括：


  - Scala Hosting – [`www.scalahosting.com`](http://www.scalahosting.com)

  - Amazon Web Services – [`http://Aws.amazon.com`](http://aws.amazon.com)

  - MoodleCloud – [`https://moodlecloud.com`](https://moodlecloud.com)

  - Lambda Solutions – [`www.lambdasolutions.net`](http://www.lambdasolutions.net)


  虽然 Moodle 是免费的，但你仍需支付网站托管费用。安装好 Moodle 后，你可以轻松地根据课程规格设置你的学习管理系统。Moodle 网站还提供了一个演示站点，你可以使用它来进一步熟悉其功能^((14))（图
  5-2）。


  ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig2_HTML.jpg](img/501049_1_En_5_Fig2_HTML.jpg)


  **图 5-2** Moodle 提供演示来了解其功能


  Moodle 可以安装为自托管选项。使用自托管选项，你或你的机构将负责设置平台所涉及的一切事务，包括：


  - 网站托管

  - 设置

  - 用于支付的商户账户

  - 维护

  - 升级

  - SSL 证书

  - 网站托管监控

  - 安全

  - 备份

  - 支持

  - 培训

  - 负责维护和软件升级的 Moodle 技术资源


  最初，自托管的学习管理系统解决方案似乎比专有学习管理系统更具成本效益，但必须考虑所有成本才能确定真正的拥有成本。如果你对自托管选项不感兴趣，Moodle 也为中小型企业提供付费的托管选项。使用托管选项，你需要按月或按年付费，这提供了前面提到的自托管选项以及其他功能。网站托管费用通常从每年
  100 美元或更多起，具体取决于用户数量以及选择的是共享主机还是专属主机。但是，你仍然需要一名 Moodle 技术资源来解决任何技术问题，并作为与网站托管服务商的联系点。


  ### 免费学习管理系统选项


  如果开源、自托管的选项不可行，你可以考虑使用 Google Classroom。Google Classroom 是 Google 提供的免费托管学习管理系统，可用于促进小学、中学和高等教育阶段教育者与学习者之间的互动（图
  5-3）。诸如 Google Classroom 之类的免费学习管理解决方案具有专有学习管理系统的许多特性，但无需付费。然而，根据你的预期用途，你可能需要付费才能使用像
  Google Classroom 这样的学习管理系统。


