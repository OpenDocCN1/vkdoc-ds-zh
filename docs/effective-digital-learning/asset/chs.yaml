- '# 参与工具


  在新冠疫情下的虚拟学习中，参与度至关重要。教育者和学习者都在应对关于“学习”样貌的范式转变。每个人都以某种方式感到疲惫，并尽其所能地适应他们所知道的最佳方式。在创意高涨而预算紧张的情况下，作为一名教育者，您有众多免费选项可供使用，但您必须知道去哪里寻找。


  ## 屏幕录制


  在在线学习环境中，视频构成了内容的大部分。与书面文本相比，学习者往往更愿意通过视频参与。视频也有助于视觉型学习者更好地理解内容。正如您在第 4 章所学到的学习风格，为了帮助视觉型学习者，您可以尝试使用免费的屏幕录制工具。尽管有许多屏幕录制工具可用，让我们来看看其中几个流行的。


  ### Screencastify


  `Screencastify` 是一款录制工具，仅作为扩展程序在 Google Chrome 浏览器中使用（图 11-1）。您可以通过 Chrome 网上应用店将其安装到浏览器中。它与大多数设备兼容，包括使用
  Google Chrome 浏览器的 Chromebook，但不包括移动设备。


  ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig1_HTML.jpg](img/501049_1_En_11_Fig1_HTML.jpg)


  图 11-1


  `Screencastify` 可在 [www.screencastify.com](http://www.screencastify.com) 获取


  您可以使用它来录制以下其中一项：


  *   桌面

  *   浏览器标签页

  *   仅网络摄像头


  无论您选择哪种录制类型，您都可以提供软件演示、演示文稿等，以提高学习者的理解能力。同样，您可以使用“仅网络摄像头”选项来录制讲座、提供作业反馈或给予鼓励性话语。选项是有限的。无论您选择哪种录制类型，免费版每次录制都有
  *5 分钟的限制*。您可以随时升级到付费版本，但免费版本应该足以满足您和学习者的需求。


  ### Screencast-O-Matic


  另一个值得考虑的免费屏幕录制应用程序是 `Screencast-O-Matic`（图 11-2）。它允许您在 Mac 或 Windows 电脑、Chromebook
  以及 iOS 和 Android 设备上创建录制。与 `Screencastify` 相比，免费账户的录制时长限制为 *15 分钟*。录制完成后，您可以使用其编辑器进行编辑并分享您的视频。与
  `Screencastify` 不同，它是一款独立应用程序，可以从 [`www.screencast-o-matic.com`](http://www.screencast-o-matic.com)
  安装。


