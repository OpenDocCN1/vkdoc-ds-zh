- '# 12. 测试在线学习


  第 11 章讨论了各种免费在线资源，这些资源不仅能最大化你的教学体验，还能提高学生的参与度。一些教育工作者可能认为免费在线资源不如付费选项，但情况并非总是如此。随着价格上涨以及预算和薪水的缩水，一些基于付费的学习资源过于昂贵。因此，你必须要么研究创造性的变通解决方案，要么寻找免费的替代方案。


  一旦你找到了资源，熟悉了它们，并将它们整合到 LMS 内的课程材料中，你可能会觉得自己已经大功告成。不幸的是，还没有。你还有关键的一步：测试。尽管你尽了最大努力，意想不到的事情还是会发生。正如墨菲定律告诫我们的：“*任何可能出错的事情都会出错。*”
  恰当的测试能降低墨菲定律发生的可能性。


  ## 为什么测试很重要


  在理想世界中，技术会自动按预期工作。不幸的是，尤其是在线学习中，情况并非如此。在新冠疫情期间，随着学校从传统的面对面学习过渡到在线学习，出现了许多技术问题。由于系统需求增加，学生和教育工作者无法访问他们的
  LMS。许多学生缺乏互联网服务或计算机来完成他们的课程作业。你可能有一些个人的经验可以分享。虽然疫情是一种特殊情况，但仍然需要事先进行测试，以便预测和准备这些情况。


  ## 测试的类型


  测试在线学习管理系统至关重要。没有什么比学习者在课程开始或进行中遇到可以预防的错误更糟糕的了。这些可预防的错误会给学习者留下糟糕的第一印象，这不仅会影响他们对在线学习的态度，还会影响他们对你和课程的态度。一个好做法是让多人在不同的计算机和移动设备上执行各种测试功能。但是，如果你没有其他人可以协助测试，你仍然可以进行有效的测试。在我们开始讨论测试之前，你需要了解在虚拟学习环境中将要执行的两种测试类型：可用性测试和性能测试。




  ### 可用性测试


  可用性测试用于评估您、学生以及任何潜在用户如何使用学习管理系统（LMS）或虚拟学习环境并与之互动。您的测试将回答以下问题：

  - 用户能否登录系统？

  - 用户能否通过电脑和移动设备访问 LMS？

  - 用户能否轻松浏览 LMS？

  - 用户能否轻松找到所需内容？

  - 用户能否成功并准确地提交信息？

  - 某些用户角色是否被禁止执行特定任务？

  - 学习者能够上传哪些文件格式？

  - 屏幕阅读器能否读取课程内容？

  - 图片是否有替代文本？

  - 视频中是否提供隐藏字幕？


  要在虚拟学习环境中进行可用性测试，您或 LMS 管理员需要在系统内创建一个具有学生角色的用户。这样，您就能从学生的视角以及性能测试的角度来观察 LMS。许多学习管理系统都提供"学生视图"选项，使这一过程变得简单。进入学生视图后，您就可以浏览
  LMS，执行测试以回答上述问题。


  在课程或学期结束时，请不要忘记调查您的学习者关于他们的学习体验。这些调查能提供宝贵的反馈，并帮助识别需要改进的领域。许多 LMS 都提供创建调查的功能。如果没有，您可以使用以下工具轻松创建免费调查，并将链接包含在公告或电子邮件中发送给学习者：

  - SurveyMonkey – [`www.surveymonkey.com`](http://www.surveymonkey.com)

  - 谷歌表单 – [`www.google.com/forms/about/`](http://www.google.com/forms/about/)


  可用性测试是一个持续的过程。必须定期进行，以确保学习者获得良好的学习体验。提供 LMS 测试信息的其他资源包括：

  - QA Source – [`https://blog.qasource.com/test-a-learning-management-system`](https://blog.qasource.com/test-a-learning-management-system)

  - eLearning Industry – [`https://elearningindustry.com/ways-measure-learning-management-system-lms-reliability-check-fulfills-business-goals`](https://elearningindustry.com/ways-measure-learning-management-system-lms-reliability-check-fulfills-business-goals)


  ### 性能测试


  性能测试涉及测试系统的基础设施，以验证其在特定数量的并发用户访问时不会崩溃。该基础设施包括服务器、网络、互联网连接等。例如，在完全转向在线学习之前，对学校的基础设施和带宽进行性能测试，本可以提前发现并纠正学生和家长遇到的许多问题和困扰。


  除了性能测试，托管 LMS 的学校或组织的隐形基础设施也应定期进行可扩展性测试。可扩展性是指系统在需求变化时，能够在不遇到问题的情况下超越当前规模或状态进行增长或扩展的能力。关于在线学习的一个误解是，它只需要一台电脑和互联网服务。对于教育者和学生来说，这确实如此。然而，要在幕后创造无缝的在线学习体验，所需的技术远不止于此。


  性能测试还能在潜在问题成为真正问题之前将其识别出来。学校和组织采取主动测试而非被动测试始终是一个良好的做法。您作为教育者的成功以及学生的成功都依赖于这一点。对于教师和学生来说，没有什么比在在线学习开始时遇到技术问题更令人沮丧的了。如果这些问题不能迅速纠正，它们可能会像滚雪球一样演变成更大的问题。结果，教育者和学生都可能感到沮丧并失去动力。同样，持续存在的问题不仅会影响您作为教育者的声誉，还会影响您所在学校或组织的声誉。无论是否是您的错，学生通常首先责怪教育者，其次才是学校或组织。


  ## 安全测试


  安全问题已变得司空见惯，尤其是在在线课堂中。我们都听说过或经历过在线课堂中发生的安全漏洞。例如，教育者必须为其 Zoom 会议应用最严格的安全设置，以防止`Zoombombing`（Zoom
  炸弹袭击）。`Zoombombing`发生在 Zoom 网络会议应用程序中，当未经授权的用户进入 Zoom 会议并做出或说出冒犯性行为或言语时。其主要目的是干扰会议。试想一下这会对易受影响的学习者产生何种影响。其影响可能是毁灭性的。通常，威胁来自在线课堂之外，而其他威胁则来自内部。无论如何，这两种无端的威胁都必须预见并迅速处理。在
  LMS 内部，一个良好的做法是授予角色最低级别的安全权限，以防止潜在的安全问题。这通常由您的 LMS 管理员处理。


  ## 内容测试


  由于大多数教育者并非 LMS 管理员，他们只能控制其角色权限范围内的事情。内容就是其中之一。教育者提供了 LMS 中用于在线学习体验的大部分（即使不是全部）内容。因此，您需要确保已核实信息的准确性。测试您的内容需要执行的其他任务包括：

  - 对所有内容进行拼写检查

  - 验证所有超链接有效

  - 验证所有图片显示正确

  - 以 PDF 格式提供可下载材料

  - 按照美国心理学会（APA）格式编排参考文献


  ## 总结


  在线学习环境中的测试不应被视为事后之事。它与所有其他在线学习组成部分一样至关重要。测试不是一次性的任务。必须定期进行，这样不仅能节省时间，还能为管理员、教育者和学生省去许多麻烦。不充分的测试可能会对整体的在线学习体验产生破坏性影响。


  '
- '# 13. 营销在线学习


  在上一章中，您探讨了测试在线学习组件的重要性。虽然测试通常由学习管理系统管理员负责，但作为教育者，您也必须测试自己的学习内容，不仅要确保其准确性，还要确保其可理解性。不测试您的内容可能会暴露潜在的错误，这不仅会对您作为教育者的声誉产生负面影响，还可能损害您所在学校的声誉。核实学生体验的各个方面，使其尽可能无错误，至关重要。同样，您需要确保所有学生都能按照您的预期访问和查看您的内容。


  一旦您已经测试了在线学习材料，就该为您的课程宣传造势了。无论您是在拥有自己营销部门的学校工作，还是独立开展工作，您都需要营销您的专业知识和课程。


  ### 广而告之


  如果拥有专业知识和课程却无人知晓，那又有什么用呢？如果您指望人们偶然发现您，那您就错了。您必须积极主动，帮助人们了解您的专业知识和课程。如今，有许多资源和工具可以帮助您做到这一点。大多数资源都是免费的，只需要您投入时间。让我们来看看其中一些。




  '
- '# 口碑营销


  尽管口碑营销由来已久，但它至今仍是最有效的营销策略之一。当人们获得积极体验时，他们乐于与他人分享。借助社交媒体，口碑营销的传播速度比以往更快，覆盖范围也更广。口碑营销是指来自可信来源的潜在客户对产品或服务进行口头或书面的认可。其价值无法估量，且无需任何成本。`Nielsen.com`
  报告称，92% 的人信任来自朋友和家人的推荐，胜过任何其他类型的广告。^(²⁴) 你还等什么？开始向你的朋友和家人介绍你的专业知识和课程吧。你甚至可以鼓励他们报名参加你教授的课程。无论你需要做什么来打造自己的品牌大使，尽管去做。例如，使用
  `Canva` 创建一些包含你专业知识和课程信息的图片，提供给品牌大使，让他们在社交媒体平台上分享。他们的粉丝越多，你获得的曝光机会就越多。你也可以使用本书中提到的免费资源制作一个视频，并发布到
  `YouTube` 和你的社交网络上。同样，你可以将 `YouTube` 链接分享给品牌大使，让他们与自己的粉丝分享。虽然需要一些时间才能看到成效，但这会带来巨大的回报。关键在于坚持。


  ### 社交媒体


  社交媒体极大地拓展了口碑营销的覆盖面。随着 `Facebook`、`Twitter`、`Instagram`、`LinkedIn` 等社交媒体手机应用触手可及，与他人分享信息比以往任何时候都更容易。如果你还没有任何社交媒体账号，需要立即开始创建一个。想想你的目标受众使用哪些社交媒体平台，并确保你也使用这些平台。一些有助于你了解社交媒体人口统计特征的资源包括：


  -   `HubSpot` – [`https://blog.hubspot.com/marketing/state-of-social-media-demographics`](https://blog.hubspot.com/marketing/state-of-social-media-demographics)

  -   `Marketing Charts` – [`www.marketingcharts.com/digital/social-media-108184`](http://www.marketingcharts.com/digital/social-media-108184)

  -   `Social Media Examiner` – [`www.socialmediaexaminer.com`](http://www.socialmediaexaminer.com)

  -   `Kronos.com` – [`https://khoros.com/resources/social-media-demographics-guide`](https://khoros.com/resources/social-media-demographics-guide)

  -   `Pew Research Center` – [`www.pewresearch.org`](http://www.pewresearch.org)


  在创建社交媒体档案名称时，请确保它们具备以下四个特征：


  -   易于记忆

  -   易于拼写

  -   在所有平台上保持一致

  -   能提供关于你从事领域的某些信息


