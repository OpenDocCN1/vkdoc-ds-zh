- fmt: '### Google Drive


    One cloud storage solution used by many is Google Drive (Figure [11-6](#501049_1_En_11_Chapter.xhtml#Fig6)).
    It is easy to use on any type of device. It also has a mobile app that is available
    on both iOS and Android mobile devices. To use Google Drive, you need a Google
    Account which is free. At the time of this writing, Google Drive provides 15GB
    of free storage that is shared between Google Drive, Gmail, and Google Photos.
    If you need more space, you can always upgrade to a paid plan. Your organization
    might have a plan that offers unlimited storage so it is a good idea to find out.
    You can also share files and folders with others within Google Drive which can
    save time and paper and promote collaboration.


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig6_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig6_HTML.jpg)


    Figure 11-6


    Google Drive ([www.google.com/drive](http://www.google.com/drive)) offers cloud
    storage for your needs


    ### Dropbox


    Another contender for free cloud storage is Dropbox (Figure [11-7](#501049_1_En_11_Chapter.xhtml#Fig7)).
    Dropbox offers a free basic plan with 2GB of cloud storage space for your files.
    Compared to Google Drive, this is small, but it is an option. To get more storage,
    you would have to upgrade to a paid plan.


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig7_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig7_HTML.jpg)


    Figure 11-7


    Dropbox ([www.dropbox.com](http://www.dropbox.com)) is another cloud storage solution
    for your online needs


    ## OneDrive


    If you have a Microsoft account, you can use OneDrive. OneDrive works on the following
    devices:


    - Windows PCs and laptops with Windows 10

    - Windows Surface tablet

    - Xbox One Console


    It includes 5GB of free file storage. One feature of OneDrive is that it automatically
    backs up your files to the cloud. It also syncs them so that they are accessible
    from any device. You can also share files from OneDrive. Most organizations use
    Office 365 so you already have access to OneDrive. You would need to inquire about
    your storage capacity.


    ## Utilities


    Outside of the tools that have already been mentioned, some important utilities
    can help you create engaging virtual learning content. They can also help you
    present a more professional image.


    ### Grammarly


    How many times have you received some type of written communication that was not
    only difficult to read but also understand? Probably more times than you care
    to remember. Imagine how your online learners feel when they receive poorly written
    communication. Poorly written communication causes learners to lose trust and
    confidence in educators as well as their expertise. Thoughts and ideas that are
    not properly written cannot be easily communicated.


    Grammarly is a web-based application that can help you improve the effectiveness
    and professionalism of your writing. It offers a free and paid version. To use
    it, you can either copy your written text and paste it into the Grammarly website
    or upload a file to Grammarly to review. A Grammarly add-on can also be installed
    and run within Microsoft Word as well as your browser. Once Grammarly has your
    text, it will review it for not only grammatical errors but also other areas to
    produce clear and concise writing. It also can review your emails, social media
    posts, and more. By using Grammarly, you can make sure that your course content
    is free from errors and presents you in the best possible way. It also helps your
    learners build trust and confidence in you and your expertise. Grammarly can be
    found at [`www.grammarly.com`](http://www.grammarly.com).


    ### Snipping Tool


    Although it is not an online resource, it is a free and valuable resource for
    educators. For PC users with Windows 7 and later, a preinstalled app is available
    called the Snipping Tool. The Snipping Tool provides the ability to perform screen
    captures. It can be opened by typing `Snipping Tool` in the Search box of the
    Windows taskbar. Once opened, you can snip or capture information in one of the
    following forms:


    - Free-form snip

    - Rectangular snip

    - Window snip

    - Full-screen snip


    After your snip is completed, you can save it to your PC to include in your course
    materials such as lectures, documents, announcements, discussions, assignments,
    and more.


    ## Summary


    As you have seen, free does not always mean bad or inferior. With so many free
    resources available on the Web for virtual learning, it would be difficult to
    list them all in this book. Hopefully, you have seen that many of these free resources
    are comparable to their paid counterparts. Now that you know about some of these
    resources, you can start creating an exciting online learning experience that
    your learners will never forget. You also will not forget it because you will
    have saved money in the process.


    # 12. Testing Online Learning


    Chapter [11](#501049_1_En_11_Chapter.xhtml) discussed various free online resources
    to not only maximize your teaching experience but also boost student engagement.
    Some educators might view free online resources as inferior compared to paid options,
    but that is not always the case. With rising prices along with shrinking budgets
    and paychecks, some fee-based learning resources are too expensive. As a result,
    you must either research creative workaround solutions or find free alternatives.


    Once you have found your resources, familiarized yourself with them, and incorporated
    them into your course materials within your LMS, you might feel that you are finished.
    Unfortunately, you are not. You have another crucial step: testing. Despite your
    best efforts, unexpected things happen. As Murphy’s Law warns us, “*Anything that
    can go wrong will go wrong*.” Proper testing decreases the likelihood of Murphy’s
    Law.


    ## Why Testing Is Important


    In an ideal world, technology would automatically work as intended. Unfortunately,
    this is not the case particularly in online learning. As schools transitioned
    from traditional in-person learning to online learning during the Covid-19 pandemic,
    many technology issues arose. Due to increased system demand, students and educators
    were unable to access their LMSs. Many students lacked Internet service or computers
    to complete their course work. You probably have personal war stories to share
    about your experience. Although a pandemic is an extraordinary circumstance, prior
    testing still needs to be performed to anticipate and prepare for these circumstances.


    ## Types of Testing


    Testing online learning management systems is critical. Nothing is worse than
    learners encountering preventable errors at the onset or during a course. These
    preventable errors can create a bad first impression for learners that can affect
    their attitude not only toward online learning but also about you and the course.
    It is a good practice to have more than one person to perform various testing
    functions on various computers and mobile devices. However, if you do not have
    others available to assist with testing, you can still perform effective testing.
    Before we begin discussing testing, you need to be aware of the two types of testing
    you will perform in your virtual learning environment: usability and performance.'
