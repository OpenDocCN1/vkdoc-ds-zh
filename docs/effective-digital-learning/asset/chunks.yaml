    # 2. Online Learning Equipment


    As you learned in the previous chapter, the traditional brick-and-mortar learning
    environment has been transformed by online learning. Traditional learning is no
    longer the only option available to learners and educators. Over the years, online
    learning has given learners the flexibility to learn new skills at their convenience
    using whatever medium was available at the time. It also allowed educators to
    teach on their schedules. Today, the Internet is the primary online learning medium.
    A physical classroom environment is no longer the only option which helps remove
    some educational barriers. You might be eager to become an online learner or online
    educator but are unsure of the necessary equipment needs. What do you need to
    get started?


    ## Technology Needs


    Whether you want to be an online learner or an online educator, your success depends
    on one critical component: technology. Technology is at the heart of online learning.
    It is the conduit through which learning happens. Without the right technology,
    you will not be as productive or efficient. Likewise, you will also waste valuable
    time and money. As a result, you will not receive the benefits that online learning
    offers. The good news is that the technology that is needed for online learning
    is minimal.'
  trans: '

    # 在线学习的优势


    对于刚开始接触在线学习的人来说，适应过程可能颇具挑战。这是一种与许多人所经历的传统学习截然不同的方式。改变从来都不容易，但有时却必不可少。让我们来看看在线学习的一些优势。


    ## 灵活性


    与在固定日期和时间进行的传统学习不同，大多数在线学习是异步的。`Asynchronous`（异步）意味着教师和学习者无需在特定时间上课。不过，可能仍需要满足一定的出勤和参与天数要求。大多数人都希望在生活中找到工作与生活的平衡，而在线学习凭借其灵活性，让学习者和教师可以自行安排时间表。


    ## 节省时间


    时间是我们最宝贵的资产之一。每个人每天都有 24 小时，并尽量充分利用它们。时间一旦流逝，便一去不复返。在繁忙的日程中，每个人都在寻找节省时间的方法，以便做更多事情。在线学习使学习者和教师能够通过使用互联网（而非在交通拥堵中浪费时间）来节省时间。


    ## 节省开支


    除了节省时间，在线学习还可以为学习者和教师节省开支。对于在线学习者而言，某些在线学习和课程的费用可能低于传统的面对面课程。除了公立中小学教育本身固有的费用外，许多高等教育机构和其他现场培训可能费用高昂。无需前往实体建筑，有助于学习者和教师节省油费、停车费、住宿费、伙食费及其他开支。


    ## 随时随地课堂


    在线学习允许学习者和教师在任何有互联网连接以及电脑或移动设备的时间和地点创建虚拟课堂。传统教育要求学习者围绕就读实体学校来重新安排生活。在线学习则需要并引发思维模式的转变，允许学习者将教育与生活结合起来安排。`Covid-19`（新冠疫情）就是一个绝佳的例子。当学校和其他教育机构因疫情被迫关闭时，学习活动转向了线上。通过将学习迁移到线上，学习者、教师和其他学校管理人员在免受新冠病毒潜在传播风险的同时，依然能够继续学习。


    另一个例子是现役军人。军人经常被部署到世界各地。然而，他们仍通过在线学习来完成教育目标。否则，他们只能等到任务结束后才能继续学业。


    ## 移动学习


    移动设备技术的进步、屏幕尺寸的增大，以及诸如`Chromebooks`（ Chromebook 笔记本电脑）和安卓平板电脑等更便宜的选择，使得在线学习者比以往更容易连接网络。据`Pew
    Internet Research`（皮尤互联网研究）数据，拥有智能手机的人群比例从 2011 年的 35%上升到了 2019 年的 81%。^(⁵) 该研究进一步指出，2019
    年，96%的人拥有智能手机。


    # 在线学习的考量因素


    尽管在线学习有诸多优势，但它似乎并非万能之策。然而，情况并非总是如此。有一些关于在线学习的因素必须加以考虑。


    ## 数字鸿沟


    尽管我们生活在 21 世纪，但并非所有人都能接入高速互联网。例如，一些农村地区仍然难以获得稳定、高速的互联网接入。他们当前的互联网服务要么速度太慢，要么根本不存在。因此，他们很难进一步学习。


    ## 学习质量


    在线学习能与面对面学习相媲美吗？学习者真的学到东西了吗？技术能否作为有效的媒介，在教育模式中复现教学法？随着越来越多的小学、中学、高等院校及学习机构实施在线学习，这些问题以及其他相关问题将会被提出。在线学习或许永远无法完全取代传统学习模式。但随着技术的进步，网络会议和虚拟现实等工具提供了可行的替代方案。


    ## 特殊需求学习者


    一些有特殊需求的学习者无法进行在线学习。根据他们的残疾类型及其严重程度，在线学习可能不如面对面学习有效。例如，作业治疗和言语治疗等远程治疗服务是在线进行的。对于需要更多实践指导的学习者来说，在线学习可能并不合适，但对于那些能够使用它的人来说，它仍然是可及的。


    ## 总结


    在线学习将随着技术继续发展。随着劳动力市场对知识工作者的需求持续增长，学习者将更容易在方便的时候获得所需的技能。同时，其成本也将更加亲民。对于教育者而言，分享和展示其专业知识的机会将是无限的。


    脚注 1   2   3   4   5


    # 2. 在线学习设备


    正如你在前一章所学到的，传统的实体学习环境已被在线学习所改变。传统学习不再是学习者和教育者唯一的选择。多年来，在线学习赋予了学习者灵活性，使他们能够利用当时可用的任何媒介，在方便的时候学习新技能。同时，它也允许教育者按照自己的时间表授课。如今，互联网是主要的在线学习媒介。物理课堂环境不再是唯一的选择，这有助于消除一些教育障碍。你可能渴望成为一名在线学习者或在线教育者，但不确定需要哪些必要的设备。你需要准备些什么才能开始呢？


    ## 技术需求


    无论你想成为在线学习者还是在线教育者，成功都取决于一个关键因素：技术。技术是在线学习的核心。它是学习发生的通道。如果没有合适的技术，你的效率或生产力将大打折扣。同样，你也会浪费宝贵的时间和金钱。结果就是，你无法享受到在线学习所提供的优势。好消息是，在线学习所需的技术门槛其实非常低。

    '
- fmt: '# Hardware


    Although you do not need to have the newest computer, it still needs to be no
    more than 2–4 years old. Computer technology changes rapidly, so what is current
    today will be obsolete in about 2–5 years. Most learning institutions provide
    learners and educators with hardware requirements to work with their technology
    infrastructure. A good rule to follow is to have an operational desktop or laptop
    computer that is 2–3 years old with the following minimum specifications:


    *   `Windows 7` operating system or `Mac 10.2 Sierra` operating system or higher

    *   `Intel i3` dual-core processor or `AMD` equivalent or higher

    *   `2 GHZ` processor or higher

    *   `1GB` of free disk space

    *   `4GB` of memory or higher

    *   Webcam


    You can use an older computer. However, it will affect the performance of your
    online learning experience. The higher your processor speed and memory are, the
    more applications can be opened simultaneously. Your computer will also operate
    faster.


    `Chromebooks` are smaller laptops with smaller screens that operate Google’s operating
    system, `Chrome OS`. Typically, they are less expensive than desktops and laptops
    and utilize Google’s cloud-based applications such as `Gmail` and `Google Drive`.
    Due to their slow processor speed and a small amount of memory, they should not
    be the primary choice for postsecondary online learning involving programming
    or other processor-intensive courses. However, they are a good choice for primary
    and secondary learners. Another `Chromebook` limitation is that they cannot operate
    without Internet access.


    As the size of mobile devices continues to increase, they will continue to add
    to the flexibility of traditional and online learning. Many learning resources
    are available as apps via these devices. Notification apps such as `Remind` and
    `Show My Homework` can help educators communicate not only with students but also
    parents. Some mobile devices can be more expensive than desktops or laptops. They
    also lack a physical keyboard. It must be purchased separately. Lastly, they are
    limited in their processing speed and memory. Due to their portability, they can
    be great to use to supplement learning on the go.


    # Printer


    Although most of your online learning occurs online, you will have times where
    you will want to print documents. Having an inkjet or laser printer allows you
    to print when needed. The initial cost of an inkjet printer can be less than a
    laser printer. However, laser printers can print more pages with their toner compared
    to inkjets. Today, many all-in-one printers are available that include a scanner,
    which can save you money and space.


    # Scanner


    Having a scanner is good to have but not a necessity. If you do not have a scanner,
    do not fret. Many scanning apps are available for free and a fee on mobile devices.
    For instance, the `Notes` app is freely available on `iOS` devices and allows
    you to scan documents.


    # Software


    The main software that you will need is a web browser such as `Firefox`, `Safari`,
    `Edge`, or `Google Chrome`. A web browser is typically how learning materials
    are accessed. In addition to a web browser, you will need some additional software.


    ## Microsoft 365


    `Microsoft Office` is the industry standard application for schools and organizations.
    It allows you to create documents, presentations, spreadsheets, and more using
    its popular programs such as `Word`, `PowerPoint`, and `Excel`. It also contains
    `Microsoft Outlook` for email and `OneNote` for cloud-based storage needs. For
    primary, secondary, and postsecondary students and educators with an email address
    ending in `.edu`, `Microsoft 365` can be downloaded for free from the Microsoft
    website (Figure [2-1](#501049_1_En_2_Chapter.xhtml#Fig1)). Subscription information
    is available on the Microsoft website.


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig1_HTML.jpg](images/501049_1_En_2_Chapter/501049_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Microsoft website for Microsoft 365


    Also, `Microsoft 365` and `Google Docs` apps are freely available to use in the
    `Apple App Store` and `Google Play Store`. Many cloud-based applications make
    it easier to use these applications on computers and mobile devices. However,
    without a paid `Microsoft 365` subscription, the functionality is limited.


    ## Antivirus Software


    Since you will be working on the Web and uploading and downloading files, it is
    a good idea to have antivirus software installed on your computer or mobile device.
    Antivirus software protects your computer from viruses and other threats that
    can infect your computer or mobile device and cause harm. Once antivirus software
    is installed, it should be programmed to automatically update itself to protect
    your computer or device from new threats that arise daily. A few popular free
    antivirus software options that also include paid options include


    *   `Avast` – [`www.avast.com`](http://www.avast.com)

    *   `AVG` – [`www.avg.com`](http://www.avg.com)


    Other popular paid antivirus options include


    *   `McAfee` – [`www.mcafee.com`](http://www.mcafee.com)

    *   `Norton` – [`www.norton.com`](http://www.norton.com)


    ## PDF Reader


    `PDFs` are the standard document type used on the Web. They can be viewed on all
    devices as long as a program such as `Adobe Acrobat Reader` is installed. `Adobe
    Acrobat Reader` is the industry standard for viewing PDFs and is free for download
    from the Adobe website (Figure [2-2](#501049_1_En_2_Chapter.xhtml#Fig2)).


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig2_HTML.jpg](images/501049_1_En_2_Chapter/501049_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    `Adobe Acrobat Reader` available for free download from Adobe website: [https://​get.​adobe.​com/​reader/](https://get.adobe.com/reader/)


    ## Cloud-Based Storage


    Since online learning provides the flexibility to work from anywhere, you need
    access to your files from anywhere and from any device. Cloud-based storage can
    also be used to back up important files. Some popular cloud-based storage options
    include


    *   `Microsoft OneDrive` (comes with `Microsoft Office 365`)

    *   `Dropbox` – [`www.dropbox.com`](http://www.dropbox.com)

    *   `Google Drive` – [`www.google.com/drive/`](http://www.google.com/drive/)


    ## Graphic Design Software


    In addition to your typical software needs, you might require graphic design software
    to create graphics for videos, websites, photography, and more. For your graphic
    design needs, the `Adobe Creative Cloud` consists of industry standard apps such
    as `Photoshop` and `InDesign` and is available at [`www.adobe.com`](http://www.adobe.com).
    It contains desktop and mobile apps for your creative needs. You can purchase
    either individual apps or all Adobe apps for a monthly or yearly subscription
    fee. Teachers and students with valid proof of eligibility (i.e., school ID or
    school email address) receive discounts on the purchase price.


    Although `Adobe Creative Suite` is great for graphic design, it can be expensive.
    Some free and open source graphic design software include the following:


    *   `Gimp` – [`www.gimp.org`](http://www.gimp.org)

    *   `Canva` – [`www.canva.com`](http://www.canva.com)'
