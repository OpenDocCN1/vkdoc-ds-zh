- fmt: '# Word of Mouth Marketing


    Although it has been around for a long time, it is still one of the best marketing
    strategies available. When people have a positive experience, they love to share
    it with others. With social media, word of mouth marketing has gotten faster and
    reaches farther than it previously did. Word of mouth marketing is a verbal or
    written endorsement of a product or service from a trusted source to a potential
    customer. Its value is priceless and costs you nothing. `Nielsen.com` reported
    that 92% of people trust recommendations from friends and family over any other
    type of advertising.^([^(24)](#fn24)) What are you waiting for? Start telling
    your friends and family about your expertise and course offerings. You can even
    encourage them to take a course that you teach. Whatever you need to do to create
    your own brand ambassadors, do it. For instance, use `Canva` to create some images
    that contain information about your expertise and courses that you can provide
    to your brand ambassadors to share on their social media platforms. The more followers
    they have provides more opportunities for exposure for you. You could also create
    a video using one of the free resources mentioned in this book and post it on
    `YouTube` as well as your social media networks. Likewise, you can share the `YouTube`
    link with your brand ambassadors to share with their followers. It will take some
    time for you to see results but it will pay huge dividends. Consistency is key.


    # Social Media


    Social media has propelled the reach of word of mouth marketing. With social media
    mobile apps such as `Facebook`, `Twitter`, `Instagram`, `LinkedIn`, and others
    at the fingertips of consumers, it is easier to share information with others
    than ever before. If you do not have a social media presence, you need to immediately
    begin to create one. Think about which social media platforms your target audience
    uses and make sure you are using those as well. A few resources to help you identify
    social media demographics include:


    - `HubSpot` – [`https://blog.hubspot.com/marketing/state-of-social-media-demographics`](https://blog.hubspot.com/marketing/state-of-social-media-demographics)

    - `Marketing Charts` – [`www.marketingcharts.com/digital/social-media-108184`](http://www.marketingcharts.com/digital/social-media-108184)

    - `Social Media Examiner` – [`www.socialmediaexaminer.com`](http://www.socialmediaexaminer.com)

    - `Kronos.com` – [`https://khoros.com/resources/social-media-demographics-guide`](https://khoros.com/resources/social-media-demographics-guide)

    - `Pew Research Center` – [`www.pewresearch.org`](http://www.pewresearch.org)


    As you are creating your social media profile names, make sure that they possess
    the following four characteristics:


    - Easy to remember

    - Easy to spell

    - All the same across all platforms

    - Provide some insight into what you do


    By incorporating these four characteristics, you save potential learners time
    in locating you and your online learning offerings when they perform searches
    either on `Google` or social media platforms. Your social media profiles also
    need to include keywords that potential learners would search for to find courses
    such as yours. A good free resource to help with this is the `Google Keyword Planner`.
    It is apart of `Google Ads`. `Google Keyword Planner` allows you to search for
    words and phrases that people use to search on `Google`. It displays the search
    volume for those words and phrases and also provides suggestions. By using `Google
    Keyword Planner` as your guide, you will have a road map as to what keywords you
    should target to get results.


    ## Facebook Page


    In addition to your personal social media accounts, a `Facebook Page` is quickly
    becoming a necessity. A `Facebook Page` is used by individuals and businesses
    to promote their products and services rather than using a personal `Facebook`
    account (Figure [13-1](#501049_1_En_13_Chapter.xhtml#Fig1)).


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig1_HTML.jpg](images/501049_1_En_13_Chapter/501049_1_En_13_Fig1_HTML.jpg)


    Figure 13-1


    Using a `Facebook Page` to help promote your online learning


    A `Facebook Page` offers the same features as a personal account along with detailed
    analytics of your page’s performance. When analyzed and applied, this information
    can improve your marketing efforts. With your `Facebook Page`, you can also post
    images, website URLs, videos, and more. You can also conduct `Facebook Live` sessions
    where you teach on a particular topic on a designated day and time. Your `Facebook
    Live` will be available in the public news feed for everyone to see. It is a good
    practice to create an event so that it is added to the `Facebook Event Calendar`
    for everyone to see. Once the `Facebook Live` event is over, the recording is
    saved to your `Facebook Page`. You can also download your `Facebook Live` video
    and post it on other sites such as `YouTube` and social media platforms. Other
    social media platforms such as `LinkedIn`, `Periscope`, `Instagram`, and `TikTok`
    will also allow you to perform a live broadcast.


    ## YouTube


    What better place to market yourself and your online courses than `YouTube`? According
    to `hootsuite.com`, `YouTube` is the second most preferred platform for watching
    video on TV screens among 18- to 34-year-olds.^([^(25)](#fn25)) `Pew Research`
    also identified `YouTube` as the most popular platform in America.^([^(26)](#fn26))
    To showcase your expertise, why not create a `YouTube` channel and upload short
    tutorial videos teaching your course material? Viewers receive a glimpse into
    your teaching style while learning more about you and what you have to offer.
    As you are creating your videos, make sure that you include keywords in your video
    title and description to make it easier for learners to find either when searching
    on `YouTube` or `Google`. You also want to make sure that you include your social
    media handles within your `YouTube` videos to gain followers. It is all about
    making it easy for learners to find and follow you.


    Another great thing about `YouTube` is that you can embed your `YouTube` video
    into your website/blog or easily share your video’s URL across multiple social
    media platforms. This is another way that you can use one marketing asset for
    multiple marketing purposes for maximum impact.


    # Conferences


    Due to `Covid-19`, most in-person conferences have shifted to virtual events such
    as webinars. Regardless of their format, they still provide excellent opportunities
    to not only learn but also network with others. A strong network can help you
    reach audiences that previously were not possible. Not sure where to find conferences?


    When attending online events, do not forget to network. Although networking looks
    different in virtual events compared to in-person events, it is still important.
    As the old adage goes, “It’s not what you know but who you know.” You must be
    creative in your approach. For instance, most virtual event platforms offer attendees
    a chat feature. You can utilize the chat feature to introduce yourself and provide
    a link to your website or `LinkedIn` profile to connect with others. For virtual
    conferences that allow you to create a profile, do not miss this opportunity to
    not only include an informative biography that includes your areas of expertise
    but also links to your social media accounts and online courses website. Never
    miss a chance to promote yourself, your website, and your online courses. You
    might not get a second chance. Some resources to look for virtual conferences
    include:


    - [`www.Edweb.net`](http://www.edweb.net)

    - [`www.linkedin.com`](http://www.linkedin.com)

    - [`www.facebook.com`](http://www.facebook.com)

    - [`www.eventbrite.com`](http://www.eventbrite.com)

    - [`www.meetup.com`](http://www.meetup.com)

    - [`www.google.com`](http://www.google.com)'
