    # 网络研讨会授课策略


    与传统的面对面教学模式类似，网络研讨会平台为师生在网络学习环境中实时互动提供了媒介。这些平台也有助于维持一定形式的社交互动。然而，许多教育工作者在使用网络研讨会及其工具来呈现教学内容并吸引学生参与方面存在困难。网络研讨会的工具能够实现比单纯使用演示文稿向学生讲课更多的互动。为了最大化学生的学习体验，熟悉你所选网络研讨会平台的功能至关重要。例如，YouTube
    是获取有关如何使用特定网络研讨会平台技巧与窍门的一个良好起点。你的学生视你为专家。如果准备不足，你不希望自己表现得像个新手。学生们会很快察觉并失去参与感。为防止这种情况发生，你可以采用一些策略来进行准备。


    ## 风格与基调


    在开展第一次网络研讨会之前，确定你的研讨会风格非常重要。你的研讨会风格将极大地影响学生的参与度。是采用带 PowerPoint 的讲课形式，还是更偏向开放式讨论？你的基调是什么？是权威型、对话型，还是娱乐型？许多教育工作者已开始效仿
    TED 演讲的风格来设计他们的网络研讨会。^(¹⁷) TED 演讲在很大程度上依赖于演讲者的信息传达而非 PowerPoint 幻灯片。演讲者通常使用图片来支撑论点，而不是使用充满文本和要点的幻灯片。演讲者必须运用讲故事、幽默、声音、肢体语言等技巧来保持观众的注意力。观看几个
    TED 演讲是个好主意，看看这种风格是否适合你和你的学生。其他可供借鉴灵感的替代方案包括：


    *   The Moth – themoth.org

    *   Ignite – ignitetalks.io

    *   99U – 99u.adobe.com

    *   Talks at Google – talksat.withgoogle.com

    *   Big Think – bigthink.com


    ## 投票


    人人都爱投票。学生也不例外。像 Zoom 这样的网络研讨会平台提供了创建投票的功能，可以在研讨会期间展示。然而，此功能仅对付费账户开放。投票可以在会议或研讨会期间让学生保持参与。例如，在会议或研讨会开始前，你可以在
    Zoom 门户会议管理中创建简单的投票，让学生就各种课程主题进行投票。一旦所有人投票完毕，你可以公布结果。根据投票结果，你和学生可以参与有趣的讨论。


    ## 白板


    大多数网络研讨会平台都提供白板功能，类似于传统面对面教室中的白板。在在线环境中，白板可用于阐述复杂的概念。例如，你可以使用白板向学生展示如何解决一个数学问题。你也可以绘制一个流程图，使学生更容易理解。白板还可以用于集思广益。就像传统课堂一样，你可以点名让学生到白板上写出答案。所有这些都有助于提高学生的参与度和积极的课程成果。


    ## 分组讨论室


    在传统教学中，教师可以将学生分成小组进行小组作业。小组作业不仅支持学生共同合作，还能让他们开放地接受他人的观点。同样的概念可以应用于网络研讨会。例如，Zoom
    允许你手动或自动将学生分配到称为“分组讨论室”的小组中。Zoom 参与者也可以选择加入一个分组讨论室。这些分组讨论室可以在安排会议时或会议期间创建。在分组讨论室内，学生们可以合作完成作业，同时你可以监控每个分组讨论室的情况。时间到了之后，你可以将所有人员召集回主研讨会进行讨论。分组讨论室可以为许多学生和教师在虚拟环境中提供社交和互动的机会。然而，在
    Zoom 中，分组讨论室仅适用于付费计划。Microsoft Teams 提供了类似的概念。


    ## 问答环节


    学生喜欢提问，为什么不让他们问呢？在你的网络研讨会中，你可以允许学生这样做。许多网络研讨会平台（如 Zoom）都提供“举手”按钮，学生可以点击该按钮来示意他们有问题。一旦你注意到他们，你可以要求他们将问题保留到研讨会结束，或者一次取消一个学生麦克风的静音让其发言。你也可以鼓励学生在聊天框中输入问题。但是，你需要确保正在监控聊天记录，以免错过任何可能出现的问题。


    ## 视频


    在网络研讨会中分享一段与课程内容相关的视频是与学生建立联系并保持其参与度的另一种方式。你可以从自己的电脑或 YouTube 分享视频，帮助学生理解课程材料。注意不要选择太长的视频。记住，学生的注意力持续时间较短，因此视频应控制在
    2 分钟以内。你还需确保视频具有吸引力并提供隐藏式字幕。由于你的网速会影响视频的播放速度，因此在任何在线会议和网络研讨会之前，最好使用 [`www.speedtest.org`](http://www.speedtest.org)
    测试你的网络连接速度。


    ## 游戏化


    无论年龄大小，人人都爱游戏。还记得《愤怒的小鸟》和《糖果粉碎传奇》的热潮吗？游戏很有趣，还能缓解压力。它们也具有教育意义。为什么不将能辅助你课程的游戏融入网络研讨会中，以此来保持学生的参与度呢？你可以利用网络上可用的
    PowerPoint 模板创建诸如“家庭问答”或“危险边缘”之类的游戏。你也可以在网上找到免费的游戏，用于你的网络研讨会环节。选定游戏后，你可以将学生分配到不同的队伍，或者让学生之间进行在线对战。同样，你也可以使用诸如
    [`www.accredible.com`](http://www.accredible.com) 等工具提供数字徽章来庆祝学生的成功。一些优质的在线游戏资源包括：


    *   Quizlet.com

    *   Quizzizz.com

    *   美国自然历史博物馆 – [`www.amnh.org/explore/ology/games`](http://www.amnh.org/explore/ology/games)

