    # 6. 演示工具


    在上一章中，我们探讨了学习管理系统（LMS）及其在帮助机构与教育工作者组织内容方面的作用。LMS 还有助于连接来自任何地点、使用任何设备的学习者和教育工作者。它们还提供了另一种沟通媒介，同时减少了纸张消耗和成本。在选择
    LMS 时，机构与教育工作者必须意识到，没有一种万能的 LMS 解决方案。每个人的需求都不同。对一个组织或教育工作者有效的方法，可能对另一个无效。任何 LMS
    的首要目标都应该是帮助学习者在学习过程中更好地参与课程内容。


    LMS 中存储的内容可以采取多种形式，但主要是数字形式。无论内容以何种形式呈现，它都有其目的。它也有助于提升学习者的学习体验。其中最流行和最常见的内容格式之一就是演示文稿。


    ## 选择您的演示材料


    “*重要的不是你说什么，而是你如何说。*” 你可能已经听过这句话无数次了。然而，在演示方面尤其如此。演示文稿是一种用于组织某个主题信息的内容形式。演讲者和教育工作者通常用它来传达主题内容。演示文稿通常由包含要点的幻灯片组成。这些要点被用作谈话要点。当信息传达给观众时，观众会跟着理解。


    正如你在第 4 章所学到的，每个人都按照自己的学习风格进行学习。大多数学习者都有一种主导或偏好的学习风格。这种学习风格不仅有助于学习者更好地接收信息，也有助于他们更好地理解信息。通过使用演示文稿，教育工作者不仅能够满足视觉学习者的需求，也能满足听觉学习者的需求。演示幻灯片（也称为
    slide decks）可以利用不同的配色方案来引发学习者的特定情绪。类似于营销活动中潜意识使用的色彩心理学，教育工作者也可以应用同样的效果。诸如 Adobe
    Color (`https://color.adobe.com`) 和 `www.presentationteam.com` 这样的网站可以帮助您为演示文稿选择合适的配色方案。在创建演示文稿时，不要忘记品牌标识，并在每张幻灯片的页眉或页脚区域包含您组织的徽标。


    演示文稿可以设计得美观吸引人，以保持学习者的参与度。例如，许多演示软件应用程序提供了可用于创建内容的模板，而不必从头开始。可以在演示文稿中包含的一些吸引学习者的内容包括：


    - 图片

    - 图表

    - 动画

    - 音乐

    - 形状

    - 多媒体

    - 切换效果


    如果没有演示文稿，学习者将只能依赖他们的听觉学习风格，而这可能不是他们偏好的学习风格。我们都记得大学时代，有些教授在没有演示文稿的情况下讲完整堂课。在在线学习环境中，学习者很难观看一个演讲者头像视频来听取演示并保持参与。听到的信息比看到的信息更容易遗漏。


    ## 演示文稿创建策略


    当大多数人听到“在线演示”这个词时，首先想到的是 PowerPoint。接下来想到的术语是“死于 PowerPoint”。“死于 PowerPoint”这个术语归功于
    Angela R. Garber，但在此之前许多人已经经历过这种现象，只是没有命名而已。^(15) 一般而言，它指的是 PowerPoint 演示文稿及其演讲者所产生的枯燥乏味的效果。可以给演示文稿添加许多效果来使其变得有趣。然而，并非所有效果都是必需的。尽管演示工具允许您以任何方式创建演示文稿，但最好遵循一些行业最佳实践以达到最大效果。您的内容及其对学习者的影响应该是主要关注点，而不是您能使用多少演示软件的功能。

    '
- fmt: '### KISS Principle


    With so many features at your disposal, you might want to include all of them
    in your presentation. However, this is not a good idea. You will not only overwhelm
    your students but also lose your message at the same time. Whenever you have to
    design a presentation, you should always keep the KISS principle in mind. The
    KISS principle, short for Keep It Simple Silly, implies that you should keep your
    presentation and its components as simple as possible. For instance, TED Talks
    are simple and straightforward. The focus is on delivering quality content rather
    than fancy presentation slides. Some ways to incorporate the KISS principle in
    your presentation include:


    *   Use two to three fonts for consistency

    *   Include enough white space to improve readability

    *   Apply two to three color schemes consistently throughout slides

    *   Use bullets for better readability


    ### Reducing Clutter


    Some PowerPoint slides contain too much information such as text and images. Learners
    perceive them as being busy, overwhelming, and difficult to read. An unfortunate
    result is that learners zone out and are no longer engaged. Learners have short
    attention spans, and your presentation must grab and keep it until the end. A
    slide is not meant to contain everything about your topic. It should only highlight
    your topic’s key points. This not only applies to text on the slides but also
    images and bullets. Always remember, less is more.


    ### Limit Animations


    Recall the last time you watched a presentation that contained animations. How
    did you feel when you saw the first animation? As the presentation continued,
    more animations were used. How did you feel? Annoyed? How do you think your students
    would feel? When used sparingly, animations can spice up a presentation. However,
    too many animations can become distracting and appear amateurish. Limit your animations
    to no more than one or two in a presentation.


    ### Limit Transitions


    Transitions between slides can be a nice effect. As with animations, too much
    of anything can quickly become a bad thing. With transitions, you want to make
    sure they are consistent and do not distract from your presentation. If you choose
    to use transitions, consider using one or two consistently throughout your presentation.


    ### Use Quality Images


    In addition to selecting a good color scheme and design for your presentation,
    quality images are a necessity. Poor quality images can distract from your presentation’s
    message. Your images need to be able to stand alone to support your topic. They
    also need to be professional and high resolution which can be scaled up or down
    without affecting the image quality. Likewise, make sure you have copyright permission
    to use images outside of PowerPoint or any other presentation tool you use. They
    should also be used sparingly on a slide. One or two images per slide is a good
    practice. Otherwise, your slide can quickly become cluttered. In Chapter [11](#501049_1_En_11_Chapter.xhtml),
    you will learn about some free resources for locating images. Other resources
    for locating paid, high-resolution royalty-free images include:


    *   Getty Images – [`www.gettyimages.com`](http://www.gettyimages.com)

    *   Shutterstock – [`www.shutterstock.com`](http://www.shutterstock.com)

    *   Dreamstime – [`www.dreamstime.com`](http://www.dreamstime.com)


    ### Use Music Sparingly


    Everyone likes music. Music connects and energizes us. Using music in your presentation
    can be good, but you must know where to use it. For instance, it is not a good
    idea to use music throughout your presentation. However, it can be used at the
    beginning of your presentation to set the tone for your presentation. You must
    also select the right type of music for your audience to produce the right effect.
    For example, you would not want to open your presentation with a slow musical
    selection for a young children’s audience. Children are full of energy so a more
    upbeat song would be better. When selecting music to add to your presentation,
    make sure that it is royalty-free to avoid copyright issues. Royalty-free music
    allows you to pay for it once but use it an unlimited number of times. Some common
    sources of royalty-free music include:


    *   Premiumbeat.com

    *   Bensound.com

    *   Youtube.com


    ## Presentation Tool Options


    Still feel uneasy about creating an engaging presentation? No problem. The good
    news is that there are many presentation software applications available to help
    educators create their presentations for maximum engagement and learner impact.
    Before creating your presentation, it is a good idea to brainstorm your presentation
    ideas. Likewise, if you are not experienced with creating presentations, look
    around for inspiration. Some good websites to help you find inspiration include:


    *   Slideshare.net

    *   [`www.free-power-point-templates.com`](http://www.free-power-point-templates.com)

    *   [`https://powerpointify.com`](https://powerpointify.com)

    *   Powerhouse.net


    ### Microsoft PowerPoint


    For years, Microsoft PowerPoint has been the industry standard and leader for
    creating PowerPoint presentations. Currently, it is available with Microsoft 365.
