    \n*本书献给所有孜孜不倦的教育工作者，尤其是在新冠疫情期间，他们为所有学习者创造了一个充满活力和创造性的数字学习环境与体验。尽管没有得到足够的口头或书面表达，但你们和你们的努力值得感激。*\n\
    \n## 引言\n\n多年来，学习方式基本保持不变。尽管新的方法论不断涌现，但人们对学习的普遍态度并未改变。如果你问大多数人最好的学习方式是什么，大部分人可能会说是在实体学校。在过去\
    \ 10 到 20 年间，不仅为学习者，也为教育者提供了更多的学习选择。直到 2020 年 3 月，学习者和教育者仍然可以在传统的面对面学习和在线学习之间进行选择。\n\
    \n2020 年 3 月中旬，学习发生了转变。随着新冠疫情的爆发和病例数的增加，安全问题随之浮现。由于新冠病毒是一种新型病毒，科学家和医生几乎没有相关信息可参考，并且不知道如何有效预防或治疗。为了保障教育者、学习者以及学校工作人员的安全，传统的面对面学习转向了线上。\n\
    \n由于转向数字化或虚拟学习的决定来得非常突然且缺乏充分预警，许多教育者没有足够的时间做好充分准备。许多教育者只有传统面对面教学环境的经验。在线学习是一片未知领域。他们依靠在职培训来摸索如何将传统的面对面教学技能转化为数字化或虚拟环境下的技能。你可能就属于这一群体。经验丰富的在线教育者则希望为自己的工具箱增添新的工具和策略，以吸引学习者。你可能也属于这一群体。同样，许多学习者缺乏诸如电脑和互联网接入等必需的设备来完成在线学习。不用说，每个人都很快变得沮丧起来。\n\
    \n*《有效的数字学习》* 提供了深刻的见解和资源，帮助新手和经验丰富的在线教育者在虚拟学习环境中取得成功。每一章都从一位经验丰富的在线教育者的角度提供实用信息，并附有如何应用的建议。无需在网上搜索这些信息，你将它们集中在一处，这有助于节省时间。你将学习到的一些主题包括：\n\
    \n- 在线学习的兴起\n- 在线学习设备\n- 在线学习规划\n- 内容规划\n- 学习管理系统\n- 演示工具\n- 网络研讨会\n- 免费学习资源\n\
    \n疫情结束后，数字学习仍将持续。本书中的信息将具有适用性，并能促进有效的数字学习。众所周知，学习者是学习过程中最重要的组成部分。他们值得你付出最好的努力。这本书不仅能让你为他们提供最好的东西，也能为你自己提供最好的东西。你和你的学习者都将从本书中受益匪浅。我很乐意收到你的反馈。请随时在社交媒体上关注我，并告诉我你对本书的喜爱程度。\n\
