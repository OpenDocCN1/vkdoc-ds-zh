- fmt: '# Social Media Support


    Sometimes, online learning can feel isolating. However, it does not have to be.
    There are numerous online groups that you can join for assistance with teaching
    in an online learning environment. For instance, Facebook has numerous groups
    and pages that you can join or follow to gain new insights and resources about
    online learning. Likewise, you can also network with other online educators. Some
    Facebook Pages you might want to follow include:


    - Global Online Academy

    - TED-Ed

    - Global Educator Collective

    - edX

    - Khan Academy


    Facebook groups that you might want to join include:


    - Digital Resources for Distance Learning

    - Distance Learning Educators

    - Online Teaching Strategies for Educators


    LinkedIn is another good social media resource that offers groups that you can
    join to not only network but also learn new online learning strategies.


    # Self-Care


    Educators tend to put the needs of their students before their own. With online
    learning, you can easily put in more hours on a computer or mobile device than
    in-person traditional learning. Sometimes, you must be a little selfish. You must
    always remember the saying “You cannot pour from an empty cup.” Take care of yourself
    and schedule some time for some self-care to recharge and regroup. Otherwise,
    you will quickly suffer from burnout. Some simple self-care tips include:


    - Schedule some daily exercise such as a walk or yoga

    - Establish consistent work hours

    - Eat healthy

    - Drink plenty of water

    - Get enough rest

    - Take breaks throughout the day


    # Summary


    Online learning involves more than technology. You must have a well-thought-out
    plan to serve as your road map. However, you will need to adjust your plan as
    needed. A quote from Robert Burns’ “To A Mouse” sums up how you should view plans:
    *The best-laid plans of mice and men often go awry*.


    No matter how carefully a project is planned, something may still go wrong with
    it. Be flexible.


    # 4. Content Is King


    In Chapter 3, you learned about the importance of planning and its role in the
    online learning experience. Planning prepares the foundation for a good outcome
    for both educators and learners. However, it does not always guarantee a positive
    teaching and learning outcome. Unexpected circumstances will occur such as Covid-19,
    and contingencies will have to be made. However, planning does help begin the
    online learning journey on a positive note. With a good understanding of the planning
    process, you can start brainstorming and planning your online learning content.


    We have all heard the expression “content is king,” and in no place is this truer
    than in online learning. Since there is not a physical teacher and classroom in
    online learning as in traditional learning, content must be planned and designed
    carefully. Depending on the quality and delivery, content can make or break an
    online learning experience. It also must be composed of many different learning
    components. Otherwise, it might not provide the intended benefits which can result
    in failure.


    ## Content Basics


    Content is at the core of any online learning experience. It consists of learning
    objectives and outcomes that learners complete along a designated path. While
    studying the subject matter, learners interact with the content. In academia,
    traditional and online learning typically follows some form of pedagogy. Merriam-Webster
    defines pedagogy as “the art, science, or profession of teaching.” Pedagogy works
    together with the content to achieve learning objectives and goals.


    Many different content elements are used to fulfill online learning pedagogy.
    Previously, written lectures inserted into learning management systems or posted
    on a designated website paired with ebooks were the primary methods of delivering
    online course content. Besides quizzes and tests, there was not a way to analyze
    whether the learning materials were effective. With technology innovations and
    creative thinking, content creation has greatly evolved. Written lectures have
    now been paired with the following:


    - Videos

    - Podcasts

    - Internet articles

    - Blog posts

    - PowerPoints

    - Prezis


    Today, content is organized to promote not only critical and analytical thinking
    but also learner engagement. In the upcoming chapters, you will explore specific
    applications and apps to help you create various types of content.


    Although content can have various formats, its focus must keep learners and their
    needs as the top priority. Learners are the most important stakeholders of the
    online learning equation. Before creating any content, learners and their learning
    styles should always be considered (Figure 4-1).


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig1_HTML.jpg](images/501049_1_En_4_Chapter/501049_1_En_4_Fig1_HTML.jpg)


    Figure 4-1. The four learning types of learners


    Unfortunately, there is not a one-size-fits-all content for all learners. All
    learners do not learn the same. For instance, some learners have disabilities
    such as hearing or vision impairments and require accessibility accommodations
    (Figure 4-2). An accessibility accommodation example is including captions and
    transcripts within videos for learners with visual impairments that utilize screen
    readers. Failing to consider these learners when creating your content could potentially
    exclude them from your online learning experience.


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig2_HTML.jpg](images/501049_1_En_4_Chapter/501049_1_En_4_Fig2_HTML.jpg)


    Figure 4-2. The W3C provides information about making website content accessible


    Content should also be scannable. Most people do not like to read long paragraphs
    of text along with long sentences on any sized screen. It can be intimidating.
    Using bullets is a good technique to make content scannable. Utilizing white space
    between paragraphs is another way to make scannable content.


    ## Content Purpose


    As an educator, you know your subject better than anyone. You are the primary
    content creator and subject matter expert and know which learning materials will
    work or not. New learning resources are released all the time. Depending on your
    budget and available resources, you might be tempted to purchase some of these.
    Although they might supplement your content, you have some important decisions
    to make. For instance, many of these materials can range in price from free to
    expensive. Regardless of their price, learning materials must serve a primary
    purpose: facilitate student learning. Content and materials that provide the latest
    bells and whistles might look great, but you must be willing to ask yourself the
    following questions:


    - Will it help students understand the material better?

    - Will it encourage students to use their critical thinking skills?

    - Will it add value to the content as well as students?


    Considering content without considering learners would be like painting in the
    dark. You will get the paint on the walls, but it will not look good when you
    turn on the lights. Never lose sight of the primary purpose of your content.'
