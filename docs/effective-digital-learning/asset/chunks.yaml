- fmt: '# Tools of Engagement


    During Covid-19 virtual learning, engagement is critical. Educators and learners
    are dealing with a paradigm shift in what learning looks like. Everyone is fatigued
    in some way and is doing their best to adapt to the best way they know how. With
    creativity high and budgets low, you as an educator have numerous free options
    at your disposal but you must know where to look.


    ## Screen Recording


    Within the online learning environment, videos compose a majority of the content.
    Learners tend to be more engaged with videos than written text. Videos also help
    visual learners understand the content better. To help visual learners as you
    learned about learning styles in Chapter [4](#501049_1_En_4_Chapter.xhtml), you
    can experiment with free screen recording tools. Although there are many screen
    recording tools available, let’s take a look at a few popular ones.


    ### Screencastify


    `Screencastify` is a recording tool available as an extension only within the
    Google Chrome browser (Figure [11-1](#501049_1_En_11_Chapter.xhtml#Fig1)). It
    can be installed within your browser from the Chrome Web Store. It is compatible
    with most devices including Chromebooks that use the Google Chrome browser except
    for mobile devices.


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig1_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig1_HTML.jpg)


    Figure 11-1


    `Screencastify` is available at [www.screencastify.com](http://www.screencastify.com)


    You can use it to record one of the following:


    * Desktop

    * Browser Tab

    * Webcam only


    Whichever recording type you choose, you can provide software demonstrations,
    presentations, and more to increase learners’ understanding. Likewise, you could
    use the webcam only option to record a lecture, provide assignment feedback, or
    offer motivational words. The options are limited. Regardless of the recording
    type you select, the free version has a 5-minute limit per recording. You can
    always upgrade to the paid version, but the free version should be sufficient
    for you and your learners’ needs.


    ### Screencast-O-Matic


    Another free screen recording application to consider is `Screencast-O-Matic`
    (Figure [11-2](#501049_1_En_11_Chapter.xhtml#Fig2)). It allows you to create recordings
    on a Mac or Windows computer, Chromebook, and iOS and Android devices. Compared
    to `Screencastify`, free account recordings have a 15-minute limit. Once you are
    done recording, it allows you to use its editor to edit it and share your video.
    Unlike `Screencastify`, it is a stand-alone application and can be installed from
    [`www.screencast-o-matic.com`](http://www.screencast-o-matic.com).


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig2_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig2_HTML.jpg)


    Figure 11-2


    `Screencast-O-Matic` allows you to create recordings for free


    ## Images


    Who has not needed to find an image to enhance their content but did not want
    to pay for it? No one. Selecting the right images can mean the difference between
    keeping learners’ attentions and losing them. With all the image repositories
    available on the Web, one should not be forgotten: Google Images.


    ### Google Images


    One repository that you might have unintentionally overlooked is Google Images
    (Figure [11-3](#501049_1_En_11_Chapter.xhtml#Fig3)).


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig3_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig3_HTML.jpg)


    Figure 11-3


    Google Images is an image repository for all types of images


    Keeping with the same simple design as `Google.com`, Google Images is also easy
    to use. Google Images ([`https://images.google.com`](https://images.google.com))
    allows you to apply advanced search criteria to find images with usage rights
    that allow you to freely use, share, or modify for commercial or noncommercial
    use. To apply this, you would select `Settings` ➤ `Advanced Search` (Figure [11-4](#501049_1_En_11_Chapter.xhtml#Fig4)).


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig4_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig4_HTML.jpg)


    Figure 11-4


    Using settings to apply advanced search features in Google


    Think of the time and money you could save by first searching Google Images.


    ### Unsplash


    Another resource for free images is `Unsplash.com` (Figure [11-5](#501049_1_En_11_Chapter.xhtml#Fig5)).
    It is free to join and the images are free to use. Also, the website is easy to
    use and provides many categories to choose from. If you are using Google Slides
    for your presentations, you can use the Google Slides add-on and the Unsplash
    iPad app to locate images.


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig5_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig5_HTML.jpg)


    Figure 11-5


    Unsplash ([https://unsplash.com](https://unsplash.com)) is another free image
    repository


    ### Pexels


    If you need more images to support your virtual learning content, you should visit
    `Pexels.com`. All images on `Pexels.com` are free to use and do not require attribution.
    It also provides videos. Not only can you incorporate these images within your
    course content materials such as announcements and discussions but also on your
    social media platforms and blog posts. The possibilities are endless and are only
    limited by your creativity and imagination.


    ## Online Forms


    Being able to use online forms in your virtual learning environment can save you
    time and allow you to receive responses faster. Many options are available to
    help you, but there is a free resource that you should not overlook: Google Forms.


    ### Google Forms


    Google Forms allow you to create online forms for personal or business use. To
    get started using Google Forms, you need a Google Account which is free to create
    for individuals. If you work for an organization, you should verify whether Google
    Workspace is available. If not, your organization would need to sign up for Google
    Workspace for enhanced security and team collaboration.


    Within Google Forms, many templates are available to help you get started. If
    you do not find a template that meets your needs, you can create your own. The
    Google Forms interface is easy to use and implement within your virtual classrooms.
    All you need to do is include a URL in your course materials. Some of the types
    of forms you can create include:


    * Surveys

    * Quizzes

    * Event registration

    * Course evaluations

    * Event feedback


    You are not limited in what forms you can create. Whatever you can visualize,
    you can design within Google Forms. Forms can be a good way to gain feedback from
    your learners to help you make adjustments in your learning.


    ## Cloud Storage


    As you are creating your content for your courses, you want to make sure you have
    access to your materials from any device. You never know when the unexpected will
    occur, so having a backup in place is a good idea. Cloud storage is the solution.
    With cloud storage, your information is stored “in the cloud (on a computer on
    the Web),” making it accessible from any Internet-connected device.'
  raw: '## Tools of Engagement


    During Covid-19 virtual learning, engagement is critical. Educators and learners
    are dealing with a paradigm shift in what learning looks like. Everyone is fatigued
    in some way and is doing their best to adapt to the best way they know how. With
    creativity high and budgets low, you as an educator have numerous free options
    at your disposal but you must know where to look.


    ## Screen Recording


    Within the online learning environment, videos compose a majority of the content.
    Learners tend to be more engaged with videos than written text. Videos also help
    visual learners understand the content better. To help visual learners as you
    learned about learning styles in Chapter [4](#501049_1_En_4_Chapter.xhtml), you
    can experiment with free screen recording tools. Although there are many screen
    recording tools available, let’s take a look at a few popular ones.


    ### Screencastify


    Screencastify is a recording tool available as an extension only within the Google
    Chrome browser (Figure [11-1](#501049_1_En_11_Chapter.xhtml#Fig1)). It can be
    installed within your browser from the Chrome Web Store. It is compatible with
    most devices including Chromebooks that use the Google Chrome browser except for
    mobile devices.


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig1_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig1_HTML.jpg)


    Figure 11-1


    Screencastify is available at [www.​screencastify.​com](http://www.screencastify.com)


    You can use it to record one of the following:


    *   Desktop


    *   Browser Tab


    *   Webcam only


    Whichever recording type you choose, you can provide software demonstrations,
    presentations, and more to increase learners’ understanding. Likewise, you could
    use the webcam only option to record a lecture, provide assignment feedback, or
    offer motivational words. The options are limited. Regardless of the recording
    type you select, the free version has a 5-minute limit per recording. You can
    always upgrade to the paid version, but the free version should be sufficient
    for you and your learners’ needs.


    ### Screencast-O-Matic


    Another free screen recording application to consider is Screencast-O-Matic (Figure
    [11-2](#501049_1_En_11_Chapter.xhtml#Fig2)). It allows you to create recordings
    on a Mac or Windows computer, Chromebook, and iOS and Android devices. Compared
    to Screencastify, free account recordings have a 15-minute limit. Once you are
    done recording, it allows you to use its editor to edit it and share your video.
    Unlike Screencastify, it is a stand-alone application and can be installed from
    [`www.screencast-o-matic.com`](http://www.screencast-o-matic.com).


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig2_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig2_HTML.jpg)


    Figure 11-2


    Screencast-O-Matic allows you to create recordings for free


    ## Images


    Who has not needed to find an image to enhance their content but did not want
    to pay for it? No one. Selecting the right images can mean the difference between
    keeping learners’ attentions and losing them. With all the image repositories
    available on the Web, one should not be forgotten: Google Images.


    ### Google Images


    One repository that you might have unintentionally overlooked is Google Images
    (Figure [11-3](#501049_1_En_11_Chapter.xhtml#Fig3)).


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig3_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig3_HTML.jpg)


    Figure 11-3


    Google Images is an image repository for all types of images


    Keeping with the same simple design as Google.com, Google Images is also easy
    to use. Google Images ([`https://images.google.com`](https://images.google.com))
    allows you to apply advanced search criteria to find images with usage rights
    that allow you to freely use, share, or modify for commercial or noncommercial
    use. To apply this, you would select Settings ➤ Advanced Search (Figure [11-4](#501049_1_En_11_Chapter.xhtml#Fig4)).


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig4_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig4_HTML.jpg)


    Figure 11-4


    Using settings to apply advanced search features in Google


    Think of the time and money you could save by first searching Google Images.


    ### Unsplash


    Another resource for free images is Unsplash.com (Figure [11-5](#501049_1_En_11_Chapter.xhtml#Fig5)).
    It is free to join and the images are free to use. Also, the website is easy to
    use and provides many categories to choose from. If you are using Google Slides
    for your presentations, you can use the Google Slides add-on and the Unsplash
    iPad app to locate images.


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig5_HTML.jpg](images/501049_1_En_11_Chapter/501049_1_En_11_Fig5_HTML.jpg)


    Figure 11-5


    Unsplash ([https://​unsplash.​com](https://unsplash.com)) is another free image
    repository


    ### Pexels


    If you need more images to support your virtual learning content, you should visit
    Pexels.com. All images on Pexels.com are free to use and do not require attribution.
    It also provides videos. Not only can you incorporate these images within your
    course content materials such as announcements and discussions but also on your
    social media platforms and blog posts. The possibilities are endless and are only
    limited by your creativity and imagination.


    ## Online Forms


    Being able to use online forms in your virtual learning environment can save you
    time and allow you to receive responses faster. Many options are available to
    help you, but there is a free resource that you should not overlook: Google Forms.


    ### Google Forms


    Google Forms allow you to create online forms for personal or business use. To
    get started using Google Forms, you need a Google Account which is free to create
    for individuals. If you work for an organization, you should verify whether Google
    Workspace is available. If not, your organization would need to sign up for Google
    Workspace for enhanced security and team collaboration.


    Within Google Forms, many templates are available to help you get started. If
    you do not find a template that meets your needs, you can create your own. The
    Google Forms interface is easy to use and implement within your virtual classrooms.
    All you need to do is include a URL in your course materials. Some of the types
    of forms you can create include:


    *   Surveys


    *   Quizzes


    *   Event registration


    *   Course evaluations


    *   Event feedback


    You are not limited in what forms you can create. Whatever you can visualize,
    you can design within Google Forms. Forms can be a good way to gain feedback from
    your learners to help you make adjustments in your learning.


    ## Cloud Storage


    As you are creating your content for your courses, you want to make sure you have
    access to your materials from any device. You never know when the unexpected will
    occur, so having a backup in place is a good idea. Cloud storage is the solution.
    With cloud storage, your information is stored “in the cloud (on a computer on
    the Web),” making it accessible from any Internet-connected device.'
  trans: '好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。



    # 参与工具


    在新冠疫情下的虚拟学习中，参与度至关重要。教育者和学习者都在应对关于“学习”样貌的范式转变。每个人都以某种方式感到疲惫，并尽其所能地适应他们所知道的最佳方式。在创意高涨而预算紧张的情况下，作为一名教育者，您有众多免费选项可供使用，但您必须知道去哪里寻找。


    ## 屏幕录制


    在在线学习环境中，视频构成了内容的大部分。与书面文本相比，学习者往往更愿意通过视频参与。视频也有助于视觉型学习者更好地理解内容。正如您在第 4 章所学到的学习风格，为了帮助视觉型学习者，您可以尝试使用免费的屏幕录制工具。尽管有许多屏幕录制工具可用，让我们来看看其中几个流行的。


    ### Screencastify


    `Screencastify` 是一款录制工具，仅作为扩展程序在 Google Chrome 浏览器中使用（图 11-1）。您可以通过 Chrome 网上应用店将其安装到浏览器中。它与大多数设备兼容，包括使用
    Google Chrome 浏览器的 Chromebook，但不包括移动设备。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig1_HTML.jpg](img/501049_1_En_11_Fig1_HTML.jpg)


    图 11-1


    `Screencastify` 可在 [www.screencastify.com](http://www.screencastify.com) 获取


    您可以使用它来录制以下其中一项：


    *   桌面

    *   浏览器标签页

    *   仅网络摄像头


    无论您选择哪种录制类型，您都可以提供软件演示、演示文稿等，以提高学习者的理解能力。同样，您可以使用“仅网络摄像头”选项来录制讲座、提供作业反馈或给予鼓励性话语。选项是有限的。无论您选择哪种录制类型，免费版每次录制都有
    *5 分钟的限制*。您可以随时升级到付费版本，但免费版本应该足以满足您和学习者的需求。


    ### Screencast-O-Matic


    另一个值得考虑的免费屏幕录制应用程序是 `Screencast-O-Matic`（图 11-2）。它允许您在 Mac 或 Windows 电脑、Chromebook
    以及 iOS 和 Android 设备上创建录制。与 `Screencastify` 相比，免费账户的录制时长限制为 *15 分钟*。录制完成后，您可以使用其编辑器进行编辑并分享您的视频。与
    `Screencastify` 不同，它是一款独立应用程序，可以从 [`www.screencast-o-matic.com`](http://www.screencast-o-matic.com)
    安装。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig2_HTML.jpg](img/501049_1_En_11_Fig2_HTML.jpg)


    图 11-2


    `Screencast-O-Matic` 允许您免费创建录制


    ## 图片


    谁没有遇到过需要找一张图片来丰富内容，但又不想付费的情况呢？没有人。选择合适的图片是抓住还是失去学习者注意力的关键。虽然网络上有大量的图片库，但有一个不应被遗忘：谷歌图片。


    ### 谷歌图片


    一个您可能无意中忽略的图片库是谷歌图片（图 11-3）。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig3_HTML.jpg](img/501049_1_En_11_Fig3_HTML.jpg)


    图 11-3


    谷歌图片是一个包含各种类型图片的图库


    与 `Google.com` 保持相同的简洁设计，谷歌图片也非常易于使用。谷歌图片（[`https://images.google.com`](https://images.google.com)）允许您应用高级搜索条件来查找具有使用权限的图片，以便您可以出于商业或非商业目的自由使用、分享或修改。要应用此功能，您需要选择
    `设置` ➤ `高级搜索`（图 11-4）。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig4_HTML.jpg](img/501049_1_En_11_Fig4_HTML.jpg)


    图 11-4


    在谷歌中使用设置来应用高级搜索功能


    想想如果先搜索谷歌图片，您可以节省多少时间和金钱。


    ### Unsplash


    另一个免费图片资源是 `Unsplash.com`（图 11-5）。免费加入，图片免费使用。此外，该网站易于使用，并提供许多类别可供选择。如果您在演示文稿中使用
    Google Slides，您可以使用 Google Slides 插件和 Unsplash iPad 应用来查找图片。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig5_HTML.jpg](img/501049_1_En_11_Fig5_HTML.jpg)


    图 11-5


    Unsplash ([`unsplash.com`](https://unsplash.com)) 是另一个免费的图片库


    ### Pexels


    如果您需要更多图片来支持您的虚拟学习内容，您应该访问 `Pexels.com`。`Pexels.com` 上的所有图片均可免费使用，无需署名。它还提供视频。您不仅可以将这些图片整合到您的课程内容材料（如公告和讨论）中，还可以用于您的社交媒体平台和博客文章。可能性是无限的，唯一的限制是您的创造力和想象力。


    ## 在线表单


    能够在虚拟学习环境中使用在线表单可以节省您的时间，并让您更快地收到回复。有许多选项可以帮助您，但有一个您不应忽视的免费资源：Google Forms。


    ### Google Forms


    Google Forms 允许您为个人或商业用途创建在线表单。要开始使用 Google Forms，您需要一个 Google 帐户，个人创建是免费的。如果您为一个组织工作，您应该核实该组织是否可以使用
    Google Workspace。如果不能，则您的组织需要注册 Google Workspace 以获得增强的安全性和团队协作能力。


    在 Google Forms 中，有许多模板可以帮助您快速入门。如果找不到满足您需求的模板，您可以创建自己的模板。Google Forms 的界面易于使用，并且可以在您的虚拟教室中轻松实施。您需要做的就是在课程材料中包含一个
    URL。您可以创建的一些表单类型包括：


    *   调查问卷

    *   测验

    *   活动注册

    *   课程评估

    *   活动反馈


    您可以创建的表单类型不受限制。只要您能想象到，就能在 Google Forms 中设计出来。表单是获取学习者反馈的好方法，可以帮助您调整教学方法。


    ## 云存储


    在您为课程创建内容时，您希望确保可以从任何设备访问您的材料。您永远不知道意外何时会发生，因此做好备份是个好主意。云存储就是解决方案。使用云存储，您的信息被存储在“云端（网络上的计算机上）”，从而可以从任何联网设备访问。

