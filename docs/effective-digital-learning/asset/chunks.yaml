  trans: '

    # 网络连接


    没有网络连接，在线学习便无从谈起。如今的智能手机和平板电脑（如 iPad）可作为个人热点提供网络接入，但其速度通常无法与家庭、图书馆或餐厅的网络连接速度相提并论。新冠疫情之前，人们可以去当地的图书馆或餐厅免费使用网络。然而，疫情期间出于安全考虑，许多场所都关门了。在许多社区和农村地区，存在“数字鸿沟”，高速网络或宽带网络既不可用也负担不起。结果，许多人仍然无法上网。


    由于如今的在线学习包含多媒体及其他资源，因此需要高速网络连接。根据[`www.reviews.org`](https://www.reviews.org)的定义，高速网络连接是指下载速度至少达到
    25 Mbps 的网络。^(⁶) 拥有高速网络的美国家庭比例已从 2018 年的 65%增长至 2019 年的 73%。^(⁷)


    # 配件


    既然您已经了解了核心硬件和软件需求，那么还需要购买一些必要的配件。这些配件将为您带来更好的在线学习体验。


    ## 带麦克风的耳机


    根据您的环境，配备带麦克风的耳机总是个好主意。耳机可以让您在不依赖设备扬声器的情况下私密地查看多媒体内容，同时也不会打扰到周围的人。对于需要使用语音的学习活动，投资一款带降噪麦克风的耳机是明智之举。它可以过滤背景噪音，让听众清晰地听到您的声音。大多数电脑和移动设备都内置了麦克风，但它们往往具有方向性，会拾取房间内的所有背景噪音而非过滤或降低噪音。此外，与外部麦克风相比，其语音质量也欠佳。


    一款带降噪麦克风的外部耳机并不昂贵。平均价格约为 40 美元，但根据降噪级别不同会有所上涨。无论选择哪款耳机，请注意其接口类型是 USB、Lightning
    端口还是 3.5 毫米插头，以适配您的设备（图 2-3）。


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig3_HTML.jpg](img/501049_1_En_2_Fig3_HTML.jpg)


    图 2-3 可从亚马逊购买的、适用于电脑在线学习的 USB 耳机


    对于 iPhone 用户，苹果公司带 Lightning 接口的 EarPods 是另一选择（图 2-4）。它也支持 3.5 毫米转接器，可用于电脑，以及新款
    iPhone、iPad 和其他移动设备。大多数智能手机都附带带麦克风的耳机，可在您找到替代品前使用。尽管苹果 EarPods 带有麦克风，但并未提供降噪功能。


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig4_HTML.jpg](img/501049_1_En_2_Fig4_HTML.jpg)


    图 2-4 适用于在线学习的苹果 EarPod 耳机选项


    ## 网络摄像头


    虽然对于某些在线学习来说，网络摄像头是可选项，但它是一个不错的补充。大多数电脑和移动设备都内置了网络摄像头。对于学习者而言，它能为在线课堂带来传统学习的面对面元素。对于教育者而言，网络摄像头也有很多好处。首先，它允许教育者录制课程内容并在虚拟课堂中分享。这些内容还可以被重新利用，并在各种社交媒体平台上分享。网络摄像头让教育者能与学习者建立个人联系。当学习者能将名字与面孔对应起来时，可以缓解在线学习中的一些孤立感和焦虑感。


    如果您没有网络摄像头，移动设备的摄像头也能派上用场。大多数移动设备摄像头分辨率很高，不仅能拍摄出色的照片，还能录制视频。例如，iPhone 7 之后的新款
    iPhone 拥有卓越的摄像头，不仅可用于拍照，还能制作视频。新款 iPad 也是如此。如果您使用这些设备，还需要购买一个三脚架来稳定设备。


    # 总结


    正如我们所看到的，在线学习对技术设备的要求其实很低。您可能已经拥有其中的许多物品，这可以节省您的时间和金钱。这也有助于打消您可能听过的关于开始在线学习的某些误解。第一次尝试任何事情都可能看起来令人生畏，但您能做到。有了合适的设备，您的旅程就能从一个积极的开始起步。在下一章中，您将探索如何成功规划您的在线学习之旅。正如那句老话所说：“*如果你不做计划，那你就是在计划失败*。”您将制定一个计划。


    脚注 1 2


    # 3. 在线学习规划


    在上一章中，我们探讨了学生和教育者所需的在线学习技术设备。如果没有合适的技术，教育者和学生可能会经历本可避免的不必要的挫败感。尽管技术是在线学习体验的核心，但其他关键组成部分也至关重要。规划有助于教育者利用各种在线学习技术组件，为学习者创造最佳学习体验。


    规划需要着眼于全局，确定在线学习环境中哪些独立的组成部分能协同工作以惠及学习者。如果没有一个深思熟虑的计划来统筹所有部分如何协同工作，在线学习可能会变得困难重重，无法为教育者和学生带来预期的成果。正如那句老话所说：“*如果你不做计划，那你就是在计划失败*。”一份详细的计划可能是成功与失败的分水岭。在制定计划之前，您必须先明确目标。


    ## 目标


    清晰的目标能让您专注于自己的目标。在传统学习中，许多教育者利用教案来安排每日工作并保持专注。尽管由于新冠疫情，学习环境有所不同，但方法依然不变。您必须有计划和目标。目标驱动您的动力，并引领您的一天。在典型的学习日里，您会被各种事务分散精力，因此清晰界定的目标能降低您分心的可能性。在线学习对教育者或学生来说都不容易，尤其是在疫情期间。这是一片未知领域，每个人都在学习如何每日探索。清晰的目标提供了一张路线图，您可以据此保持正轨或根据需要调整方向。为了确定目标，您可以问自己一些可能的问题，包括：


    -   您想要达成什么成果？

    -   您为什么进行在线教学？

    -   在线教学对您为什么重要？

    -   您希望通过在线学习实现什么？


    一旦回答了这些问题，您应该将它们记下来，可以写在日志里，也可以写在您最喜欢的笔记类移动应用中，比如 `Evernote` 或 `Microsoft OneNote`，以便定期回顾。它们将成为您日常的动力。既然目标已经明确，还有一些其他因素需要考虑。

