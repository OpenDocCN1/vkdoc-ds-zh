- fmt: '# 9. Social Media Tools


    In the previous chapter, you learned about podcasts and their effectiveness as
    an online teaching tool. Since they are on demand, learners can easily fit them
    into their busy schedules and listen at their convenience on their mobile devices.
    Plenty of podcasts are freely available on any subject. If you cannot find a podcast
    to meet your learning needs, you can easily and inexpensively create your own
    with a few simple tools.


    Not only are podcasts mobile device friendly but also easily shareable via social
    media networks. Social media has changed the way people receive and share information
    as well as connect and build relationships. With social distancing due to Covid-19,
    social media is being relied on more than ever. Likewise, it has removed geographical
    boundaries that once prohibited relationship building. Why not take advantage
    of it within the online learning experience?


    ## The Rise of Social Media


    Prior to social media, the primary traditional education communication methods
    used by educators with learners were mail, phone, and email. These methods could
    be considered one-way communication because typically the educators were the ones
    initiating the contact. Once the contact was initiated, its effectiveness depended
    on the learner’s response.


    Although it seems social media exploded on the scene in the mid-2000s, it has
    been around since 1997. `Sixdegrees.com` was the first social media site similar
    to what we have grown accustomed to today. Six degrees of separation has been
    described as “everyone in the world is connected to someone else through a network
    of connections that are no more than five links.” This concept resembles the social
    media network `LinkedIn` which people can connect to others through mutual connections
    or reach out to make new connections. Although `sixdegrees.com` had around a million
    users, it was bought and closed in 2000.


    By nature, people are social creatures. One of the selling points for traditional
    education has been socialization. In an online learning environment, socialization
    between educators and learners utilizes a variation of the traditional socialization
    methods via online tools such as web conferencing and social media. According
    to Pew Internet Research, in 2019, roughly 72% of US adults used at least one
    social media network.^([^(21)](#fn21)) To help learners learn, educators must
    be willing to meet them where they are rather than where they want them to be.
    Some examples of popular social media sites today include:


    - Facebook

    - Instagram

    - LinkedIn

    - Pinterest

    - TikTok

    - Twitter

    - YouTube


    Social media platforms such as `Facebook` can be used on mobile devices and smartphones
    which are typically always with you and your learners. When was the last time
    you left your cell phone home and quickly returned home to retrieve it? Probably
    more times than you care to admit. By having mobile devices always available,
    everyone can connect instantly and learn at his or her convenience.


    ## Social Media Feeds


    Incorporating social media feeds within online learning can help foster collaboration
    and keep learners informed of trending news stories. It is a good way to make
    the connection between the course material and real-world application. For example,
    incorporating a `Twitter` feed about a particular industry or subject can supplement
    the course content (Figure [9-1](#501049_1_En_9_Chapter.xhtml#Fig1)). Feeds from
    social media sites such as `Facebook` and `Instagram` can also be customized to
    enhance learners’ experiences. Once the feeds are incorporated, they are easy
    to maintain and update.


    ![../images/501049_1_En_9_Chapter/501049_1_En_9_Fig1_HTML.jpg](images/501049_1_En_9_Chapter/501049_1_En_9_Fig1_HTML.jpg)


    **Figure 9-1** Twitter feed that can be incorporated into online learning


    ### Facebook Pages


    You and other educators probably already have personal social media accounts.
    However, you probably want to keep these accounts separate to establish boundaries
    between your professional and personal life. With so many instances of companies
    firing employees due to the content of their personal `Facebook Pages`, you might
    want to take this into consideration. One solution is `Facebook Pages`. `Facebook
    Pages` are separate from your personal account and are typically used by the following:


    - Artists

    - Public figures

    - Businesses

    - Brands


    They can be used by anyone who wants more ways to engage with customers and target
    audiences that might not be your `Facebook` friends. Before creating a `Facebook
    Page`, you must have a personal `Facebook` account or profile. If you decide to
    create a `Facebook Page`, you can create a `Facebook Page` for your course that
    is frequently updated with interesting videos and links from other websites to
    supplement the course material and share the page URL with your learners in your
    course’s `LMS` via announcements or email. By providing real-world, practical
    examples, learners gain different perspectives on the subject matter. Learners
    can also connect and engage with you and others by commenting on your posts. They
    can also share your posts with their `Facebook` friends, which can increase your
    exposure and popularity. If learners do not have a `Facebook` account, they can
    still access the `Facebook Page` but will not be able to leave comments. Since
    it is a public page, anyone on `Facebook` can see it via the `News Feed`. You
    can also encourage learners and others to follow your `Facebook Page`.


    ### Twitter Chats


    `Twitter` chats, or `Tweetchats`, are regularly occurring chats hosted on `Twitter`
    utilizing the same `Twitter` account. You can think of them as virtual meetups
    on `Twitter`. They happen at the same time on a weekly or monthly basis. The duration
    can range from 30 minutes to 1 hour. These chats are based on a central theme
    or topic with its own hashtag. For example, if you wanted to have a `Twitter`
    chat about digital learning, you could create a hashtag such as `#digitallearningchat`
    that discusses a specific topic of digital learning on the date of the `Twitter`
    chat. The key is that every tweet must contain the hashtag to be included in the
    `Twitter` chat.


    Once you have decided on your subtopic of the main `Twitter` hashtag, you can
    begin preparing your questions to engage your learners. Questions typically consist
    of five to fifteen and begin with `Q1` which stands for question number one. As
    long as someone knows your `Twitter` chat hashtag, anyone can join, but he or
    she must have a `Twitter` account. `Twitter` chats are a great way for you and
    your learners to connect outside of the online learning classroom and engage in
    meaningful conversations. You can also engage with others to gain a different
    perspective. It is also a good way to display your expertise while increasing
    your `Twitter` followers.


    Not sure how to begin? It is a good idea to attend a `Twitter` chat to get familiar
    with how it works before planning your `Twitter` chat. You can find `Twitter`
    chats by using the search feature in `Twitter` and search for `#Twitterchats`.
    Once you find a `Twitter` chat that interests you, participate and take notes
    of what you liked and did not like so you can structure your `Twitter` chat for
    maximum engagement. You can find more information on starting your `Twitter` chat
    on the following websites:


    - [`https://sproutsocial.com/insights/twitter-chats/`](https://sproutsocial.com/insights/twitter-chats/)

    - [`https://blog.hubspot.com/blog/tabid/6307/bid/28979/8-steps-to-hosting-a-successful-twitter-chat.aspx`](https://blog.hubspot.com/blog/tabid/6307/bid/28979/8-steps-to-hosting-a-successful-twitter-chat.aspx)'
