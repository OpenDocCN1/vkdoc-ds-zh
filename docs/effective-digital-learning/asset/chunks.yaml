- fmt: '# Guest Appearances


    To spread the word about your expertise and online course offerings, look for
    ways to be a guest on various media platforms. For example, you could contact
    some `BlogTalkRadio` hosts or podcasters with shows aligned with your online course
    offerings to be a guest. By doing this, you are not only providing the host with
    content but also expanding your marketing reach to their listeners. Likewise,
    you will gain free publicity because the host will promote you on his or her show’s
    page and social media networks. This promotion can include your image, biography,
    website link, social media links, and more. You will also be able to promote the
    guest appearance on your social media networks and website before and after the
    show.


    Being a guest on a webinar is another way to promote your expertise and online
    courses. Since Covid-19 imposed social distancing, everyone is conducting webinars
    and looking for guests. Why not you? Why not find some companies hosting webinars
    on your subject matter and ask to be a guest? All they can say is no. Once you
    become a webinar guest or panelist and the webinar is over, you have a recording
    to add to your media kit to help you market yourself and your online courses.
    Do not forget that you can create your own webinars using tools such as `Zoom`,
    record yourself teaching a topic, and save the recording to share on any of your
    social media platforms.


    ## Website/Blog


    If you have a website or blog, it is the perfect place to market yourself and
    your expertise. If you do not have a website or blog, Chapter [10](#501049_1_En_10_Chapter.xhtml)
    can help you get started. In any case, it is important that you have one or both.
    Since you own these, you can update them with new content at your convenience.
    For instance, you can create a media area page on your website or blog that links
    to all your previous guest appearances. When you are looking for guest appearances,
    you can use this page as your portfolio to showcase your talent to potential podcast
    and webinar hosts. You can also share this link on your social media networks.
    As mentioned in Chapter [10](#501049_1_En_10_Chapter.xhtml), you can also create
    blog posts based on your expertise that can be easily shared on social media networks.


    Using social media is good but it is a good idea to have your own website or blog.
    Although social media is here to stay, some of the networks have experienced unexpected
    downtime. For many, social media networks are their only promotion and selling
    source. By having your own website, you have complete control and ownership of
    it that can be used to promote yourself and your expertise 24 hours a day, 7 days
    a week. Don’t forget to utilize the `Google Keyword Planner` to research keywords
    that will help the right visitors find you.


    Another website promotion technique that you can use is an email sign-up form.
    You can provide free information applicable to your expertise in the form of a
    newsletter. Visitors can provide their email address in exchange for the newsletter.
    `Mailchimp` ([`www.mailchimp.com`](http://www.mailchimp.com)) is a free resource
    that can help you with this. It is easy to include on your website. Likewise,
    it will provide you with a link that can be shared on your social media networks.
    By having an email sign-up form on your website or shareable link, you are building
    a list of potential customers for your online courses that you can market to on
    a consistent basis.


    Once you have a website or blog running, you must make sure that you are frequently
    reviewing its analytics. Analytics provide insightful information on your website’s
    or blog’s performance. Some of the information consists of the following:


    *   Number of visitors

    *   Geographic location of visitors

    *   Duration of visitor’s visit

    *   Pages visitors visited

    *   Devices used to find your website


    This information is available from your website or blog hosting provider. Another
    good analytics tool to include in your website or blog is `Google Analytics`.
    `Google Analytics` is a free tool that provides valuable insight about your website
    or blog to help improve its performance and marketing reach. It can be accessed
    through your web browser or via the `Google Analytics` app for iOS and Android
    devices. You can sign up for `Google Analytics` with your `Google Account` by
    visiting [`https://analytics.google.com`](https://analytics.google.com). After
    your account has been created, click `Admin` located at the bottom of the page
    to begin setting up your website or blog. Once on the `Admin` tab, click the `Create
    Account` button for new website or blog (Figure [13-2](#501049_1_En_13_Chapter.xhtml#Fig2)).


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig2_HTML.jpg](images/501049_1_En_13_Chapter/501049_1_En_13_Fig2_HTML.jpg)


    **Figure 13-2** Setting up `Google Analytics` for your website or blog


    You will set up an `Account name` and a `Property name` for your website along
    with your business information. Once you have completed the information, you will
    click the `Create` button. You must accept the `Google Analytics Terms of Service
    Agreement` along with the `Additional Terms Applicable to Data Share With Google`
    before continuing. After agreeing to the terms, you will be presented with a screen
    that allows you to select whether you want to track an app or website. You will
    select website (Figure [13-3](#501049_1_En_13_Chapter.xhtml#Fig3)).


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig3_HTML.jpg](images/501049_1_En_13_Chapter/501049_1_En_13_Fig3_HTML.jpg)


    **Figure 13-3** Selecting your data stream in `Google Analytics`


    After selecting the website option, you can provide your website address. Once
    you provide your website, you will receive your code that needs to be copied into
    the `<head>` section of every HTML web page you want to measure (Figure [13-4](#501049_1_En_13_Chapter.xhtml#Fig4)).


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig4_HTML.jpg](images/501049_1_En_13_Chapter/501049_1_En_13_Fig4_HTML.jpg)


    **Figure 13-4** Global Site Tag code to insert into web pages for tracking


    If this seems confusing, do not worry. Within `Google Analytics`, tutorials and
    other help resources are available to get you started. Once set up, you can review
    your website’s `Google Analytics` using either your web browser or the `Google
    Analytics` mobile app. Likewise, you can make changes to your website to improve
    its marketing reach. Lastly, you can always make changes within `Google Analytics`
    to what website information is measured.


    ## Podcasts


    As mentioned in Chapter [8](#501049_1_En_8_Chapter.xhtml), podcasts are not only
    a good online learning tool but also a good marketing tool. Not only can you promote
    your expertise but you can also market yourself. For instance, within your podcast’s
    introduction, you can provide your subscribers with information about any upcoming
    online courses, guest appearances, and other events. You can also remind subscribers
    about the same information in your podcast’s closing. Since you are the creator,
    you control each episode’s content as well as its publishing schedule. Always
    post your podcast episodes on your social media networks and embed your podcast
    player on your website. Not sure how to do this? Your podcast host will provide
    you with this information. As with your website, do not forget to frequently review
    your stats.'
