- fmt: '### Open Source LMS


    In addition to proprietary LMS platforms, open source LMS platforms are available.
    According to Opensource.com, open source software is “software with source code
    that anyone can inspect, modify, and enhance.”^([^(12)](#fn12)) Compared to proprietary
    software, open source software does not have a licensing fee. Although freely
    available to download and modify, some people and organizations are still skeptical
    of its reliability and security compared to larger proprietary vendors such as
    Microsoft. Open source software can be modified, but proprietary software can
    only be modified by its creator.


    When comparing open source LMSs to proprietary LMSs, you must keep in mind that
    proprietary LMSs provide various levels of dedicated support within their pricing
    structures. This support can be provided via phone, email, online chat, or online
    knowledge base. Open source LMSs typically provide support through online forums
    and documentation. YouTube and Google searches are other ways that you can find
    help with your open source LMS issues.


    If you or organizations lack technical expertise to implement an open source LMS
    solution, you must hire personnel or designate individuals within the organization
    to learn and become experts about the selected open source solution through online
    documentation, online forums, and trial and error. Since `Apache` is a popular
    open source web server platform maintained by the Apache Software Foundation and
    is used by numerous web hosts for Linux (open source) servers, you can potentially
    save on hosting costs compared to Windows hosting.^([^(13)](#fn13)) If you prefer
    Windows web hosting, `Apache` will work, but your web hosting costs might be higher.


    One example of an open source LMS is Moodle (Figure [5-1](#501049_1_En_5_Chapter.xhtml#Fig1)).


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig1_HTML.jpg](images/501049_1_En_5_Chapter/501049_1_En_5_Fig1_HTML.jpg)


    **Figure 5-1** Moodle open source LMS available for download from [https://moodle.org](https://moodle.org)


    `Apache` web host providers offer Moodle for free as a single-click installation
    from the web console called the `cPanel`. Some popular web hosting providers that
    offer Moodle include:


    - Scala Hosting – [`www.scalahosting.com`](http://www.scalahosting.com)

    - Amazon Web Services – [`http://Aws.amazon.com`](http://aws.amazon.com)

    - MoodleCloud – [`https://moodlecloud.com`](https://moodlecloud.com)

    - Lambda Solutions – [`www.lambdasolutions.net`](http://www.lambdasolutions.net)


    Although Moodle is free, you must still pay for web hosting. Once Moodle is installed,
    it is easy to set up your LMS according to your course specifications. The Moodle
    website also provides a demo site that you can use to become more acquainted with
    its features^([^(14)](#fn14)) (Figure [5-2](#501049_1_En_5_Chapter.xhtml#Fig2)).


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig2_HTML.jpg](images/501049_1_En_5_Chapter/501049_1_En_5_Fig2_HTML.jpg)


    **Figure 5-2** Moodle offers a demo to learn about its features


    Moodle can be installed as a self-hosted option. With a self-hosted option, you
    or your institution will be responsible for everything involved with setting up
    the platform including:


    - Web hosting

    - Setup

    - Merchant account for payments

    - Maintenance

    - Upgrades

    - SSL certificates

    - Web hosting monitoring

    - Security

    - Backups

    - Support

    - Training

    - Moodle technical resource to perform maintenance and software upgrades


    Initially, a self-hosted LMS solution might seem more cost-effective than a proprietary
    LMS, but all costs must be considered to determine the true cost of ownership.
    If you are not interested in a self-hosted option, Moodle offers a hosted option
    for a fee for small- to medium-sized businesses. With a hosted option, you pay
    a monthly or annual fee that provides the self-hosted options mentioned earlier
    along with other features. Web hosting typically starts at $100 or more per year
    depending on the number of users and whether shared or dedicated hosting is selected.
    However, you will still need a Moodle technical resource to address any technical
    issues and serve as a point of contact with the web host.


    ### Free LMS Option


    If an open source, self-hosted option is not an option, you might consider using
    Google Classroom. Google Classroom is a free hosted LMS provided by Google that
    can be used to facilitate interaction between educators and learners at the primary,
    secondary, and higher education levels (Figure [5-3](#501049_1_En_5_Chapter.xhtml#Fig3)).
    Free LMS solutions such as Google Classroom share many of the qualities of proprietary
    LMSs minus the price. However, depending on your intended use, you might have
    to pay to use an LMS such as Google Classroom.


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig3_HTML.jpg](images/501049_1_En_5_Chapter/501049_1_En_5_Fig3_HTML.jpg)


    **Figure 5-3** Google Classroom available as a part of Google Education Suite


    If you are planning on using Google Classroom at a school with students, `G Suite
    for Education` sign-up must be completed by your school (Figure [5-4](#501049_1_En_5_Chapter.xhtml#Fig4)).
    `G Suite for Education` provides the option to select the security options along
    with the necessary Google products to keep learners and educators information
    secure.


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig4_HTML.jpg](images/501049_1_En_5_Chapter/501049_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4** Creating a new class within Google Classroom


    For users that are not members of the `G Suite for Education`, a Google Account
    is required to create a free Google Classroom. Once a Google Classroom is created,
    course content can be created in the following forms:


    - Assignments

    - Quizzes

    - Video meetings via Google Meet

    - Questions

    - Material posted by educator

    - Reuse a post

    - Topic


    `Google Calendar`, `Google Drive`, and the G Suite of applications such as `Google
    Docs` are also integrated within the Google Classroom to assist with course content
    creation. If a course requires a registration process that requires payment, you
    will want to review the `G Suite for Education`’s terms of use regarding commercial
    purposes.'
