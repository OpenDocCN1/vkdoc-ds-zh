- fmt: '# Livestreaming


    When was the last time you watched a Facebook Live event that was recorded with
    Zoom or another webinar platform? Livestreaming is available on the following
    social media platforms:


    - Facebook

    - LinkedIn

    - Periscope

    - Instagram


    Over the past few years, livestreaming has become increasingly popular. What is
    livestreaming? Livestreaming provides anyone the ability to broadcast their video
    message using the Internet. Social media platforms such as Facebook, LinkedIn,
    Instagram, and others provide a free option. Livestreaming also saves time by
    allowing you to reach a wider audience on social media platforms who might not
    have registered for your webinar.


    Webinars can be simultaneously broadcast to multiple social media platforms with
    the help of livestreaming software. Livestreaming software is available to allow
    you to livestream your webinars to various social media platforms simultaneously.
    Prior to livestreaming, you must have social media accounts on your targeted platforms.
    You also must have your `RTMP URL` and stream key that are available from your
    social media platforms. The stream key is generated by each of your social media
    accounts and is provided to your livestream software for simultaneous broadcasts.
    Some popular livestream programs include:


    - Restream Studio

    - Castr.io

    - OBS Studio

    - StreamYard


    Before using livestreaming software with your webinars, you should decide which
    social media platforms you will target. Next, you also need to have a computer
    with a fast processor (i5 or higher) and ample memory (8GB or more) to handle
    the livestreaming needs. A fast Internet is also a requirement. Likewise, it is
    a good idea to practice your webinar delivery to correct any issues so that it
    appears polished.


    # Webinar Platform Options


    Now that you know how you can make your webinars engaging, it is time to select
    a webinar platform. Many free and paid webinar platforms are available that share
    some of the core functionality along with providing different features. Let’s
    review a few.


    ## Zoom


    Since the Covid-19 pandemic forced closures of schools, businesses, churches,
    and other businesses, Zoom usage has skyrocketed. At the time of this writing,
    Zoom offers a free account that will allow up to 100 participants for either a
    40-minute time period for three or more participants or unlimited one-to-one meetings
    (Figure [7-1](#501049_1_En_7_Chapter.xhtml#Fig1)). It can be used either within
    a web browser or via their Zoom app which is available in the Apple App Store
    or Google Play Store.


    ![../images/501049_1_En_7_Chapter/501049_1_En_7_Fig1_HTML.jpg](images/501049_1_En_7_Chapter/501049_1_En_7_Fig1_HTML.jpg)


    **Figure 7-1** — Zoom platform available from [www.zoom.us](http://www.zoom.us)


    Most educators and learners are already familiar with Zoom. It is easy to use.
    For those unfamiliar with it, it does not have a steep learning curve. However,
    security has been an area of concern. During the Covid-19 pandemic, Zoombombing
    has become a new normal. According to howtogeek.com, Zoombombing is “when an uninvited
    person joins a Zoom meeting in an attempt to gain a few cheap laughs at the expense
    of the participants by providing inappropriate content or comments”.^([^(18)](#fn18))
    As a result of Zoombombing, Zoom has increased its security and suggests that
    meeting hosts perform the following:


    - Provide passwords for meetings

    - Enable the waiting room to verify and approve registered users

    - Lock the meeting once all attendees arrive

    - Mute participants’ microphones upon arrival

    - Lock attendee’s ability to share their screen


    Zoom offers apps that can be installed to make functions such as collaboration,
    analytics, scheduling, and others easier to accomplish within Zoom meetings, webinars,
    and breakout rooms. To install the apps, you would need to sign into your Zoom
    account via `zoom.us`. Some of the Zoom App Marketplace apps include:


    - Analytics

    - CRM

    - Collaboration

    - Customer service

    - Education

    - Event management


    Zoom also provides the ability to have virtual backgrounds. A virtual background
    replaces your background that is visible to learners via your web camera with
    a computer-generated one you select. It gives your meeting or webinar a professional
    look and hides a cluttered background. To enable virtual backgrounds, navigate
    to **Settings ➤ In Meeting (Advanced)** option in your Zoom web portal and enable
    the virtual backgrounds option. To browse available virtual backgrounds in your
    Zoom account, click the **Resources** link and click the virtual background link.
    Virtual backgrounds can be purchased online or created with tools such as Canva.com.


    ## Microsoft Teams


    Another webinar solution is Microsoft Teams. Microsoft Teams, part of Microsoft
    365, offers both free and paid plans (Figure [7-2](#501049_1_En_7_Chapter.xhtml#Fig2)).
    You can use any of the Microsoft Office apps within Microsoft Teams for collaboration
    as well as during meetings. It can also be used within a web browser, desktop
    app, or mobile app from either Apple’s App Store or Google’s Play Store. It supports
    Google Chrome, Firefox, and Microsoft Edge browsers. At the time of this writing
    and in response to Covid-19, there is no limit on meeting time and size.


    ![../images/501049_1_En_7_Chapter/501049_1_En_7_Fig2_HTML.jpg](images/501049_1_En_7_Chapter/501049_1_En_7_Fig2_HTML.jpg)


    **Figure 7-2** — Microsoft Teams for online collaboration and more


    With Microsoft Teams, everything revolves around a team concept. Before you can
    schedule a meeting, you must create a team. Once your team is created, you can
    assign members and invite them to online meetings with audio and video. Microsoft
    Teams also provides real-time captions based on what is being said in a meeting
    which is helpful for learners with accessibility needs. However, those captions
    are not saved once the meeting has ended. Since it is part of Microsoft 365, it
    offers security to protect your meetings and its materials from potential Zoombombing
    as experienced in Zoom.


    ## AnyMeeting


    Another available webinar option is AnyMeeting. It is a videoconferencing software
    that is available via a web browser (`www.anymeeting.com`) or through their app
    in Apple’s App Store or Google Play Store. At the time of this writing, it is
    free until December 31, 2020, with no meeting time limits (Figure [7-3](#501049_1_En_7_Chapter.xhtml#Fig3))
    and allows access to all pro features. Similar to the other webinar software mentioned,
    AnyMeeting offers the same functionality.


    ![../images/501049_1_En_7_Chapter/501049_1_En_7_Fig3_HTML.jpg](images/501049_1_En_7_Chapter/501049_1_En_7_Fig3_HTML.jpg)


    **Figure 7-3** — AnyMeeting videoconferencing software available from [www.anymeeting.com](http://www.anymeeting.com)


    ## Google Meet


    Previously called Google Hangouts, Google Meet is another option. It is operated
    by Google and requires a Google Account. Like the other options, it offers free
    and paid plans (Figure [7-4](#501049_1_En_7_Chapter.xhtml#Fig4)). It also can
    be used within a web browser, through Gmail, or via its app that can be downloaded
    from the Apple Play Store or Google Play Store. At the time of this writing, a
    free account can have a meeting with 100 participants for 60 minutes. Organizations
    and schools have increased participants along with meeting time but must have
    a G Suite account.


    ![../images/501049_1_En_7_Chapter/501049_1_En_7_Fig4_HTML.jpg](images/501049_1_En_7_Chapter/501049_1_En_7_Fig4_HTML.jpg)


    **Figure 7-4** — Google Meet available for use at `apps.google.com/meet`'
