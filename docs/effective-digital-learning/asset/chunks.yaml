- fmt: '# Summary


    Webinars are an effective method of bringing a personal touch to an online learning
    environment. They allow you to connect with learners all over the world using
    the Internet. As you have seen, there are many options to choose from. However,
    there is no right or wrong webinar software solution. It all depends on the number
    of learners, the time limit, budget, and your purpose as to which solution will
    work best for you.


    Footnotes [1](#501049_1_En_7_Chapter.xhtml#Fn1_source) [2](#501049_1_En_7_Chapter.xhtml#Fn2_source)
    [3](#501049_1_En_7_Chapter.xhtml#Fn3_source)


    # 8. Podcasts


    In Chapter [7](#501049_1_En_7_Chapter.xhtml), you learned about webinars and their
    impact in delivering content while fostering engagement within an online learning
    environment. Webinars are an effective tool in online learning to create a personalized
    connection between educators and learners similar to what is available in traditional
    learning. With many free and paid options available for computers and mobile devices,
    webinars are within reach of anyone who desires to use them.


    Learner engagement is a critical component to the online learning experience.
    No two learners learn the same. With many different and affordable content options
    available today than in the past, educators have more tools at their disposal
    to help with engagement. With more learners utilizing mobile and wearable devices
    than ever before, educators need more flexible solutions. One of those solutions
    is podcasts.


    ## Podcast Basics


    Podcasts have been around for a long time. According to `howstuffworks.com`, in
    2004, podcasts were originally created by former MTV video jockey, Adam Curry,
    and software developer, Dave Winer, after Curry wrote a program called `iPodder`
    to download Internet radio broadcasts to his `iPod`.[^(19)](#fn19) Other developers
    enhanced his code and podcasting as we know it skyrocketed. Based on its name,
    many people incorrectly associated podcasts only with Apple’s `iPod` devices.
    However, most people commonly use many different mobile devices to listen to podcasts
    because they are portable and can be listened to on the go. For example, Apple’s
    `Podcasts` app can be used to listen to podcasts on iOS devices (Figure [8-1](#501049_1_En_8_Chapter.xhtml#Fig1)).
    Previously on iOS devices, podcasts were included within the `iTunes` app. On
    Android devices, podcasts are available from the `Google Podcasts` app (Figure
    [8-2](#501049_1_En_8_Chapter.xhtml#Fig2)).


    ![../images/501049_1_En_8_Chapter/501049_1_En_8_Fig2_HTML.jpg](images/501049_1_En_8_Chapter/501049_1_En_8_Fig2_HTML.jpg)


    Figure 8-2


    `Google Podcasts` app available in `Google Play Store` for Android devices to
    locate and listen to podcasts


    ![../images/501049_1_En_8_Chapter/501049_1_En_8_Fig1_HTML.jpg](images/501049_1_En_8_Chapter/501049_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Apple’s `Podcasts` app available on iOS devices


    Other podcast apps available on both iOS and Android devices include:


    * Pandora

    * Spotify

    * Amazon Music

    * Stitcher

    * Deezer

    * TuneIn


    Podcasts are a series of audio files called episodes with content tailored to
    a podcast’s theme. The files are available on demand from podcast directories
    online or from any mobile device. Most podcast episode lengths range from 30 minutes
    to 1 hour. Typically, a podcast format follows that of a radio talk show where
    a host conducts an entire episode or invites guests. Every podcast has a file
    associated with it called really simple syndication (RSS). The RSS feed provides
    podcast information to programs called RSS readers along with podcast directories
    so that potential subscribers can discover and listen to podcasts. `Podcasthosting.org`
    reported that as of July 2020, there are over 1,000,000 podcasts available with
    over 29 million episodes.[^(20)](#fn20) Some popular education podcasts today
    include:


    * The Google Teacher Tribe

    * The Book Love Foundation

    * Flipped Learning Worldwide

    * House of #EdTech

    * The 10 Minute Teacher


    ## Podcast Advantages


    Podcasts are good tools to use in traditional and online learning. For starters,
    podcasts are currently available on any subject. If you visit any podcast directory
    and search on a particular topic, you will find numerous podcasts. With so many
    podcasts already available, you do not have to recreate the wheel which saves
    you time and effort. Next, you always know when new content is available. Once
    you subscribe to a podcast, you receive notifications via your podcast app when
    new episodes are released which saves time from checking the podcast directory
    for new content. Since they are free and easily available in podcast directories
    on the Web, you will never run out of invaluable learning resources.


    To include podcasts within your online learning environment, you would need either
    the podcast’s RSS feed or the podcast episode URL which can be found on the Web.
    Once you have these, you can either send out weekly announcements to learners
    from your learning management system, include in weekly lectures, or send emails
    notifying students of the podcast or podcast episode. Most learning management
    systems allow RSS feeds to be easily inserted within announcements that are sent
    to learners within the LMS or via email.


    You also can start a discussion post in your learning management system and include
    the podcast episode URL to not only supplement your course material but also spark
    discussion. Furthermore, you can create assignments based on a podcast episode
    URL shared with learners that reinforces the lesson. Since learners are always
    on their mobile devices, students can benefit from podcasts flexibility and portability
    of being available via the Web or apps on mobile or wearable devices to enhance
    not only the course content but also their learning experience.


    Although most podcasts are audio, they can also include video which will further
    supplement learners’ understanding of the material. As we discussed in Chapter
    [4](#501049_1_En_4_Chapter.xhtml), video podcasts can be another way to support
    audio and visual learners. Video podcasts are saved in the `.mp4` format as opposed
    to `.mp3` which is strictly audio. During the `Covid-19` pandemic and social distancing,
    video podcasts can easily be recorded remotely with free tools such as:


    * Zoom

    * Microsoft Teams

    * iMovie Maker

    * OBS Studio


    Once your video podcast episode has been recorded in `.mp4` format, it can easily
    be shared on `YouTube`, social media platforms, and blogs for great visibility
    and promotion.


    ## Podcast Planning


    You do not have to depend on others to create podcast episodes for your online
    learning needs. You can inexpensively and easily do so yourself. If you decide
    to create your own podcast, you need to do some initial planning. This planning
    will consist of answering some basic questions about your podcast:


    * What will be the theme or topic of my podcast?

    * Will it be an audio or video podcast or combination?

    * What will be the duration of a podcast episode?

    * How often will podcast episodes be released?

    * How will you promote your podcast?

    * Will you solely conduct the podcast episode or invite guests?

    * Will you have an introduction with or without music?

    * What will your podcast image look like?

    * How will you end your show?

    * How will you structure your podcast episodes?


    ## Podcast Creation Equipment


    For beginners, an audio podcast is the fastest and cheapest way to begin because
    you probably already own the necessary items. For the items that you do not have,
    many are available for free or inexpensively.'
