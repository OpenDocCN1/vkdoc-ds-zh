- fmt: '# Video Blogs (Vlogs)


    Most of the blogs you have learned about are the standard textual blogs, but there
    is another type of blog worth mentioning: video blogs (`vlogs`). `Vlogs`, short
    for video blogs, are blogs that are composed of videos documenting a person’s
    interests or expertise. These videos can be thought of as web episodes. `YouTube`
    is the source for most `vlogs`. All you need to create a `vlog` is a microphone
    and a video camera that can consist of one of the following:


    - `Webcam`

    - `Camcorder`

    - `Digital camera`

    - `Smartphone`

    - `Tablet`


    `Vlogs` are quickly becoming the norm. Since these `vlogs` are visual, they can
    cater to multiple learning styles of students leading to better engagement.


    ## Advantages of Blogs


    Although many people feel that blogs are dead, they are alive and well. Many people
    still use them to stay updated on information. Compared to websites, people can
    subscribe to a blog’s `RSS` feed and receive notifications when new content is
    available. Educators and learners can benefit from blogs.


    ### Updated Frequently


    Blogs are frequently updated with content more so than websites. By being periodically
    updated, `Google` takes notice and will update its search results with the updated
    blog posts based on keywords and phrases. As a result, educators can find timely
    information to supplement course material in their online learning environment.


    ### Encourage Discussion


    Engagement in the online learning environment is always an ongoing concern. Utilizing
    blog posts from outside sources or a blog that you created within your `LMS` can
    provide another engagement tool for learners. No two people will have the same
    perspective on a topic and can benefit from a healthy discussion. Consequently,
    this can lead to exciting discussions among educators and learners.


    ### Created Easily


    If you cannot find a blog that will supplement your course content the way you
    would like, why not create one? With many free blogging platforms available such
    as `WordPress` or `Blogger`, you can easily create a blog with minimum time and
    effort. Once created, you can customize your blog’s content to enrich your course
    content. Since it is your blog, you can update it whenever you want.


    What kinds of blog posts should you write? Since it is your blog, you have total
    creative freedom over the blog’s subject matter. However, always keep your blog’s
    goal in mind. Your blog posts should align with your course’s subject matter as
    well as your learners’ needs. For those course concepts that learners might struggle
    with, consider writing blog posts that further learners’ understanding by answering
    unanswered questions. Oftentimes, students are afraid to reach out and let you
    know that they are having difficulty understanding the course material or assignments.
    Unfortunately, we must anticipate those questions. A blog is a good solution.
    For instance, you could create a blog post that presents an opposing viewpoint
    to a particular discussion question or course topic. Within the `LMS`, you can
    create a discussion question that requires learners to read the blog post and
    have them discuss whether they agree or disagree. In either case, a healthy discussion
    along with different viewpoints can be revealed.


    When creating your blog posts, remember that learners have short attention spans.
    Your posts need to quickly grab and hold their attention. One way to do this is
    by incorporating quality images within your posts that relate to the blog post
    topic and grab attention. Chapter `[11](#501049_1_En_11_Chapter.xhtml)` will provide
    some free image resources to help you find engaging and appealing images to include
    within your blog posts. Next, you want to utilize bullets to make your content
    easier to read as well as scannable. Long lines of text can intimidate learners,
    so using bullets along with short paragraphs can help entice and motivate learners
    to read. Likewise, incorporating videos along with text is another technique to
    motivate learners to read. You can either create your own videos or use the embed
    code available from `YouTube` videos.


    ## Blog Advantages


    Since so many blogs already exist on the Web, why should you spend time, effort,
    and resources creating a new blog? One advantage of having a blog is that you
    and your learners can easily share posts on social media networks. Sharing your
    blog posts on social media platforms allows you to establish yourself as an expert,
    gain followers, and encourage discussions through comments. Compared to other
    blogs that you do not manage but use their content, you are the owner and control
    when the blog content is created and released. Lastly, you can customize your
    blog content to complement your course content. If you decide to use a free blogging
    platform, remember that the features will be limited. Likewise, you will not be
    able to customize the blog’s `URL` with your `URL` without upgrading to a paid
    version.


    ## Disadvantages of Blogs


    Using blogs in online learning benefits learners by helping them further understand
    the course material. They also encourage collaboration and sharing. However, using
    blogs in online learning has some disadvantages.


    ### Non-credible Authors


    When someone with name recognition creates a blog or blog post, he or she has
    instant credibility. You feel confident in the post’s content and accuracy. Since
    anyone can create a blog, you must be cautious. If you do not know the blog creator,
    you are uncertain about his or her expertise. It is a good practice to verify
    any information before posting it in an online learning environment. Otherwise,
    it could damage your reputation and hurt your credibility with your learners.


    ### No Control


    If you did not create a particular blog, you do not have control over its availability.
    A blog created by someone else might be discontinued without any advanced notice.
    It also might experience downtime. When this happens, it will make it unavailable
    for your learners. Likewise, a blog’s `URL` might be renamed, causing the previous
    link you shared in your `LMS` to be invalid.


    ## Summary


    Blogs can be a valuable asset in online learning. They are easy to locate and
    share in any `LMS` by providing a blog’s `RSS` feed and sharing as an announcement
    or discussion posts. They can also be included in lectures and assignments. Your
    course content will determine which blog categories you search to locate blog
    that complement and supplement your course content. Likewise, they are easy to
    create and maintain. Learners benefit from blogs because they have another resource
    to supplement their course material. The blogs also can encourage discussions
    among educators and learners.


    Footnotes `[1](#501049_1_En_10_Chapter.xhtml#Fn1_source)` `[2](#501049_1_En_10_Chapter.xhtml#Fn2_source)`


    # 11. Free Online Resources


    In Chapter `[10](#501049_1_En_10_Chapter.xhtml)`, you learned about blogs and
    how they can be an invaluable tool to boost engagement and discussion within the
    online learning environment. With numerous free blogs available on the Web on
    various topics and constantly growing, you do not need to recreate the wheel unless
    you want to. If you would like more control, many free blogging software platforms
    such as `Blogger` and `WordPress` are available that can be used to create your
    own blog.


    Every educator needs a good set of tools in his or her toolbox. Unfortunately,
    due to rising prices and shrinking budgets, some paid tools are too expensive
    and out of reach. Fortunately, there are many free online resources available
    that can save you money while promoting learning. You only need to know where
    to find them.'
  raw: '## Video Blogs (Vlogs)


    Most of the blogs you have learned about are the standard textual blogs, but there
    is another type of blog worth mentioning: video blogs (vlogs) . Vlogs, short for
    video blogs, are blogs that are composed of videos documenting a person’s interests
    or expertise. These videos can be thought of as web episodes. YouTube is the source
    for most vlogs. All you need to create a vlog is a microphone and a video camera
    that can consist of one of the following:


    *   Webcam


    *   Camcorder


    *   Digital camera


    *   Smartphone


    *   Tablet


    Vlogs are quickly becoming the norm. Since these vlogs are visual, they can cater
    to multiple learning styles of students leading to better engagement.


    ## Advantages of Blogs


    Although many people feel that blogs are dead, they are alive and well. Many people
    still use them to stay updated on information. Compared to websites, people can
    subscribe to a blog’s RSS feed and receive notifications when new content is available.
    Educators and learners can benefit from blogs.


    ### Updated Frequently


    Blogs are frequently updated with content more so than websites. By being periodically
    updated, Google takes notice and will update its search results with the updated
    blog posts based on keywords and phrases. As a result, educators can find timely
    information to supplement course material in their online learning environment.


    ### Encourage Discussion


    Engagement in the online learning environment is always an ongoing concern. Utilizing
    blog posts from outside sources or a blog that you created within your LMS can
    provide another engagement tool for learners. No two people will have the same
    perspective on a topic and can benefit from a healthy discussion. Consequently,
    this can lead to exciting discussions among educators and learners.


    ### Created Easily


    If you cannot find a blog that will supplement your course content the way you
    would like, why not create one? With many free blogging platforms available such
    as WordPress or Blogger, you can easily create a blog with minimum time and effort.
    Once created, you can customize your blog’s content to enrich your course content.
    Since it is your blog, you can update it whenever you want.


    What kinds of blog posts should you write? Since it is your blog, you have total
    creative freedom over the blog’s subject matter. However, always keep your blog’s
    goal in mind. Your blog posts should align with your course’s subject matter as
    well as your learners’ needs. For those course concepts that learners might struggle
    with, consider writing blog posts that further learners’ understanding by answering
    unanswered questions. Oftentimes, students are afraid to reach out and let you
    know that they are having difficulty understanding the course material or assignments.
    Unfortunately, we must anticipate those questions. A blog is a good solution.
    For instance, you could create a blog post that presents an opposing viewpoint
    to a particular discussion question or course topic. Within the LMS, you can create
    a discussion question that requires learners to read the blog post and have them
    discuss whether they agree or disagree. In either case, a healthy discussion along
