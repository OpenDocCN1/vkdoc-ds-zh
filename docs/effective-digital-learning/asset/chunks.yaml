- fmt: '# History of Public Education


    National Geographic reports that on April 23, 1635, the Boston Latin School became
    the first public school formed in Boston, Massachusetts.^([²](#fn2)) It still
    exists today. According to `EducationBug.org`, in 1647, the General Court of Massachusetts
    Bay Colony responded to a decree for the need for elementary and Latin schools
    and created schools that were a mixture of public and private schools that were
    available to everyone but taught Puritan values and Bible reading.^([³](#fn3))
    Although most learning took place at home, only the privileged social economic
    class sent their sons to physical in-person Latin schools.


    Fast forward almost a decade later, Massachusetts created a law requiring townships
    with 50 or more people to hire a teacher to teach the town’s children basic academics.
    Towns with 100 or more people were required to have an elementary school to teach
    reading, writing, and religion. For many years, it was the primary way to learn
    and acquire new knowledge, while others learned skills through apprenticeships.
    In the mid-1800s, people in Massachusetts demanded free, compulsory education
    for all children. It took until 1851 for this to happen.


    Although compulsory education was available in Massachusetts, other educational
    battles were being fought in the South. During the Reconstruction Era, African
    Americans fought for public education. Other states also fought their battles.
    As a result of the US Supreme Court Case *Plessy v. Ferguson* decision, public
    education was required to be legally segregated. According to `EducationBug.org`,
    the US Supreme Court decision in *Brown v. Board of Education of Topeka* in 1954
    ruled that segregated schools were unequal and must be abolished. It took a Federal
    court ruling in 1957 requiring public schools in Little Rock, Arkansas, to be
    integrated.


    # Evolution of Education


    Distance learning first occurred in the 1800s. Initially, distance learning resembled
    correspondence courses where students worked on preassigned lessons that were
    received and returned to professors via US Postal Service mail. With correspondence
    courses, the interaction between students and teachers was limited and feedback
    was delayed. With materials being sent via US Postal Service mail, they could
    have easily been incomplete or lost. Over the years, distance learning has transformed
    into these forms:


    - Telecourses

    - CD-ROM courses

    - Online learning

    - Mobile learning


    As time progressed and technological advances such as computers and the Internet
    became available, another learning option emerged: online learning. Online learning,
    also called eLearning or virtual learning, uses the Internet to create an online
    classroom. The classroom is typically through a cloud-based learning management
    system (`LMS`), where teachers and students engage with the class materials. It
    transitioned the traditional physical classroom to an online environment using
    technology to simulate in-person interaction. Online learning is a type of distance
    learning.


    Today, online learning via computer or mobile device is the most popular form
    of distance learning. Compared to traditional distance learning, online learning
    significantly increased student and teacher interaction. In addition, course materials
    are immediately available to students rather than waiting to receive them via
    US Postal Service mail. Students also receive feedback quicker and in various
    forms such as email, video, audio, or text.


    The first online learning occurred in 1989, when the University of Phoenix used
    `CompuServe`, one of the first consumer online services, to offer its educational
    programs. In 1990, Tim Berners-Lee created the first web browser called `WorldWideWeb`.
    Three years later, the web browser `Mosaic` was created. Until this point, most
    web browsers were text-based. `Mosaic` was the first web browser that allowed
    images to be embedded in HTML pages and displayed to users. As the capabilities
    of web browsers advanced, online learning began to grow. According to `EducationData.org`,
    in 2017, a total of 19.7 million students enrolled in courses at degree-granting
    postsecondary institutions, of which 6.6 million enrolled in some form of distance
    education/online learning courses.^([⁴](#fn4)) As these numbers indicate, online
    learning is not a new trend. It continues to increase as technology advances.


    # Why Should You Care?


    Today, almost any corporation that sells a product or service offers some type
    of online learning training to its employees, customers, or potential customers
    as opposed to only primary, secondary, postsecondary, and training institutions.
    If you conduct a `Google` search on the term "online learning," as in Figure [1-1](#501049_1_En_1_Chapter.xhtml#Fig1),
    you will receive over 2 billion results for all types of online learning organizations.


    ![../images/501049_1_En_1_Chapter/501049_1_En_1_Fig1_HTML.jpg](images/501049_1_En_1_Chapter/501049_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Google search results for the term "online learning"


    Regardless of your age, ability, or skill set, online learning provides many benefits
    to today’s learners and instructors.'
