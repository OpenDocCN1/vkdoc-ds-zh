    *This book is dedicated to all educators who work tirelessly especially during
    the Covid-19 pandemic to create a dynamic and creative digital learning environment
    and experience for all learners. Although it is not said or displayed nearly enough,
    you and your efforts are appreciated.*


    Introduction


    Over the years, learning has remained the same. Although new methodologies have
    evolved, the general attitude toward learning has remained the same. If you ask
    most people what the best way is to learn, most people will probably say at a
    physical school. Over the last 10–20 years, more learning options emerged not
    only for learners but also educators. Learners and educators could choose between
    traditional in-person learning and online learning until March 2020.


    During the middle of March 2020, a shift in learning occurred. As Covid-19 emerged
    and the number of cases started increasing, safety concerns arose. Since Covid-19
    was a new virus, scientists and doctors had little to no information to refer
    to and did not know how to effectively prevent or treat it. To keep educators,
    learners, and school personnel safe, traditional, in-person learning transitioned
    online.


    Since the decision to transition to digital or virtual learning happened so quickly
    and without adequate warning, many educators did not have enough time to properly
    prepare for it. Many educators only had experience teaching in traditional, in-person
    learning environments. Online learning was uncharted water. They utilized on-the-job
    training to figure out how to transform their traditional, in-person teaching
    skills to the digital or virtual environment. You might be in this group. Experienced
    online educators were looking to add new tools and strategies to their toolkits
    to engage learners. You might be in this group. Likewise, many learners did not
    have the necessities such as computers and Internet access to complete online
    learning. Needless to say, everyone became quickly frustrated.


    *Effective Digital Learning* provides insights and resources to help both novice
    and experienced online educators thrive in the virtual learning environment. Each
    chapter offers practical information from an experienced online educator’s perspective
    along with advice on how to apply it. Instead of searching the Web for this information,
    you have it in one place which helps save time. Some of the topics you will learn
    include:


    *   Emergence of online learning


    *   Online learning equipment


    *   Planning for online learning


    *   Planning content


    *   Learning management systems


    *   Presentation tools


    *   Webinars


    *   Free learning resources


    After the pandemic is over, digital learning will still remain. The information
    in this book will be applicable and promote effective digital learning. As we
    all know, learners are the most important component in the learning process. They
    deserve your best. This book will allow you not only to provide the best to them
    but also to yourself. You and your learners will benefit greatly from this book.
    I would love to hear from you. Please feel free to follow me on social media and
    let me know how you enjoyed the book.


    Let’s get started!


    Acknowledgments


    I must first give God all the credit for giving me the idea to make this book
    possible. Writing a book during a pandemic is not an easy task, but God helped
    me to stay focused to meet my goal.


    Special thanks and appreciation to Apress for giving me another opportunity to
    write another Apress book. I appreciate all the dedication and hard work of the
    Apress book team throughout the project. All the feedback was invaluable and contributed
    to bringing this book to fruition. Thank you, Matthew and Nancy, for making it
    a pleasant and memorable experience.


    Most importantly, I want to thank my husband, Timothy Sr., and my two sons, Timothy
    Jr. and William, again for bearing with me as I worked on this project in the
    early morning hours during the Covid-19 pandemic. There is no perfect time to
    write a book, but if you put your mind to it, you can do it regardless of the
    situation.


    Last but not least, thank you for making the investment in acquiring digital learning
    strategies to provide a positive and engaging learning experience for not only
    your learners but also yourself!


    About the Author


    # 1. Emergence of Online Learning


    When most people hear the word “learning” or “education,” their minds immediately
    imagine a school where students are sitting at desks listening intently to a teacher.
    Most people experienced this model throughout their lifetime. Public education
    in the United States, Canada, and Australia has been defined as “federally funded
    school, administered to some extent by the government, and charged with educating
    all citizens.”^([¹](#fn1)) The public education definition included the following
    schools:


    *   Primary and secondary schools


    *   Public universities


    Public education is free. To appreciate how far public education has progressed,
    it is always good to review its history.'
