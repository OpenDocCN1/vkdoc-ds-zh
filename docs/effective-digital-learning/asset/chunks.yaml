  trans: '

    # 内容目标


    确定内容目标至关重要。站在学习者的角度思考是设定目标的有效方法之一。对内容提出问题，是评估其是否能满足学习者需求与期望的好技巧（图 4-3）。同样，这也有助于你判断内容是否能帮助你实现课程成果。这些问题的顺序并不重要，重要的是它们能帮助你集思广益，明确内容目标。


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig3_HTML.jpg](img/501049_1_En_4_Fig3_HTML.jpg)


    图 4-3


    准备内容时应思考的问题


    另一个需要牢记的目标是**注意力持续时间**。大多数人的注意力持续时间并不长。此外，所有学习者的注意力持续时间也不尽相同。根据微软的一项研究，平均注意力持续时间已从
    2000 年的 12 秒下降到 2018 年的 8 秒。^(¹⁰) 如果再加上在线学习环境中学习者感到无聊时可以上网冲浪，注意力持续时间可能会进一步缩短。使用视频和
    Prezi 等具有吸引力和互动性的内容，可以在补充内容的同时帮助保持注意力。它还能激励学习者。我们将在本书后面讨论视频及其制作。


    **简洁性**通常是一个被忽视的内容目标。在内容中加入所有最新技术可能很有诱惑力。然而，这对学习者有何益处？这为内容增加了什么价值？如果你无法回答这些问题，那么可能就不需要这项技术。在考虑为内容应用任何技术时，请始终牢记**KISS
    原则**。简洁的内容不会出错，因为它总是可以进一步深化。


    # 总结


    制作以学习者为中心的内容很重要。这有助于学习者判断内容的价值以及如何将其应用到实际情况中。创建在线学习内容没有神奇的公式。只要内容围绕学习者及其需求展开，就很有可能获得成功的结果。


    脚注 1 2


    # 5. 学习管理系统


    在第 4 章中，你学习了内容创作的基础知识，以及教育者和学习者如何从中获益。内容是任何学习，尤其是在线学习的核心。它奠定了学习的基调，并帮助学习者达到预期的课程成果。内容应侧重于质量而非数量。当高质量的内容具有吸引力并模拟真实应用场景时，学习者就会受到激励去学习，并渴望学习更多。他们的学习体验会变得更有意义，因为他们看到了内容的价值。他们也能看到自己的投资回报，而无需担心错失恐惧症（FOMO）。


    一旦内容被规划和创建好，就需要一个存储位置。通常情况下，内容会存储在内容创建者的电脑上，或者存储在 Google Drive、OneNote 等云存储中。尽管这些都是不错的短期选择，但还需要一个更具长期性、可扩展的解决方案，以便让目标受众能够访问这些内容。**学习管理系统（LMS）**
    提供了解决方案。


    ## 学习管理系统基础


    学习管理系统（`LMS`）是一种基于 Web 的软件应用程序，用于存储在线学习的学习内容材料和配套资源。这些资源可以包括：


    *   多媒体

    *   PDF 文件

    *   图片

    *   电子书

    *   音频文件

    *   社交媒体动态

    *   视频会议

    *   RSS 订阅源

    *   演示文稿文件


    由于 LMS 基于 Web，因此可以通过大多数联网设备上的 Web 浏览器进行访问。学习者通过 Web 浏览器访问 LMS，即可开始由教育者预先设定的学习路径，从而帮助他们实现预期的学习成果。LMS
    还能促进学习者和教育者之间便捷的沟通和信息共享。


    大多数 LMS 应用程序都提供移动应用，可以从苹果的 App Store 或安卓的 Google Play 商店下载。下载后，教育者和学习者都可以访问课程及其资料。例如，`Canvas`（Instructure
    公司开发）是最流行的 LMS 平台之一，被许多高等教育机构使用，它提供的移动应用可用于随时随地访问在线课堂。LMS 平台及其移动应用为学习者和教育者提供了在线学习所带来的额外灵活性和便利性。一些较大型机构使用的最流行的付费专有
    LMS 包括：


    *   Brightspace

    *   Blackboard Learn


    ### 选择 LMS 的考量因素


    在决定选择哪个 LMS 之前，你必须确定你的预算和需求。你不会在头脑中没有价格范围和需求清单的情况下去买房子。选购 LMS 也是如此。你不想投资一个至少不能满足你
    80% 需求的 LMS。这通常被称为**帕累托法则**，或 80/20 法则，以备受尊敬的经济学家维尔弗雷多·帕累托的名字命名。^(¹¹) 在考虑 LMS
    时，你应该提出的一些问题包括：


    *   你的目标是什么？

    *   你需要哪些功能？

    *   LMS 能处理多少用户？

    *   LMS 的可扩展性如何？

    *   LMS 在你的预算范围内吗？

    *   提供什么类型的支持？

    *   LMS 对学习者和教育者来说使用起来有多容易？

    *   提供了哪些分析功能？

    *   LMS 是否提供无障碍访问设置？

    *   LMS 提供什么类型的安全保障？

    *   正常运行时间保证是多少？

    *   是否支持品牌定制？

    *   提供什么类型的培训？

    *   数据中心位于何处？

    *   它提供什么类型的安全保障？

    *   它易于使用吗？

    *   它是否具有响应式设计？


    ### LMS 的类型


    在寻找 LMS 解决方案时，你会遇到很多选择。然而，并非所有解决方案都同等优秀。不幸的是，没有一个万能的 LMS 适用于所有情况。因此，明确自己的需求非常重要。大多数
    LMS 产品属于以下三类之一：


    *   专有（商业）

    *   开源

    *   免费


    让我们探索这些类型，以帮助你根据自己的需求选择合适的 LMS。


    ### 专有 LMS


    专有或商业 LMS 平台由营利性组织创建。这些 LMS 平台按用户收取许可费，可以是按月、按年或基于订阅的方式，以便用户使用其系统。由于其高昂的价格和品牌声誉，它们通常被大型组织和大学使用。专有
    LMS 提供了许多组织现在或将来可能用到的各种花哨功能。同样，它们通常也为 LMS 提供托管服务以及安全保障。它们还通过服务水平协议提供所有维护和软件更新，这有助于可能缺乏技术资源的组织。当新功能可用时，通常会通过网络研讨会或录制视频向客户提供某种形式的培训。此外，还提供电话、电子邮件、在线聊天和在线支持论坛等形式的技术支持，这些通常包含在
    LMS 费用中。学校使用的几个 LMS 平台包括：


    *   Blackboard

    *   Microsoft Teams

    *   Canvas


    尽管专有 LMS 有优势，但也存在一些缺点。例如，客户必须等待 LMS 供应商提供软件修复和更新。同样，价格也可能随时上涨。

