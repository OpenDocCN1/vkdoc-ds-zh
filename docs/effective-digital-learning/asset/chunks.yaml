- fmt: '# Microphones


    At the heart of any good podcast is the sound quality. To have good sound quality,
    you need a quality microphone. A good, quality microphone will improve the quality
    of the recording. To be taken as a professional, you want to provide your potential
    subscribers with not only quality content but also quality sound. An inexpensive
    quality microphone for podcasting can be purchased for around $100. The `Blue
    Yeti` is a good beginning podcasters microphone with good quality sound that is
    used by podcasters (Figure [8-3](#501049_1_En_8_Chapter.xhtml#Fig3)).


    ![../images/501049_1_En_8_Chapter/501049_1_En_8_Fig3_HTML.jpg](images/501049_1_En_8_Chapter/501049_1_En_8_Fig3_HTML.jpg)


    **Figure 8-3** The `Blue Yeti` microphone is a good choice for podcast beginners


    As your podcast needs changes, you can always upgrade to a premium microphone
    such as the `Heil Sound Pro` and other equipment such as sound interfaces which
    are more expensive. However, for beginners, the basic podcast equipment will work
    fine.


    ## Podcast Creation Apps


    Mobile apps can be used to create podcast episodes. Many of these apps can also
    publish the completed episode to your chosen podcast directory. These podcast
    creation apps vary based on mobile devices.


    ### Backpack Studio App


    The `Backpack Studio` app (formerly `Bossjock`) for iOS is an all-in-one podcast
    app. iOS users can record a podcast episode directly from their iOS devices. If
    you have an Apple iPhone or iPad that uses the lightning connector, you will need
    a lightning adapter that fits your microphone’s adapter type. For instance, most
    microphones have either a USB or an XLR port, so you will need an adapter for
    that particular port. `Backpack Studio` will also allow you to do livestreaming
    to any station via `Icecast` or `Shoutcast` for a fee. With `Backpack Studio`,
    you can add in sound effects from cloud storage services such as:


    - `iCloud`

    - `Dropbox`

    - `Google Drive`


    You can also record your own sound effects from your iOS device through `Backpack
    Studio` or add existing ones from your iOS device. You can also add your show
    notes directly within the `Backpack Studio` Notes section to help you stay on
    topic while recording your episode. Once your sound effects and podcast introduction
    have been loaded into the soundboard, you can begin recording your episode within
    the app. Once your episode is finished, you can add your episode title, artist
    name, and description to help others locate your episode. After entering that
    information, you can either export your episode to a designated location or save
    it within the `Backpack Studio` app. You can also create an audiogram for your
    podcast within `Backpack Studio` to share either on YouTube, your classroom, or
    social media platforms.


    ### Online Audio Recording


    Another podcast recording option is `online-voice-recorder.com`. It is free and
    can be used within a web browser to make an audio recording. It only requires
    a microphone and saves the recording as an `mp3` or `mp4` file. With an easy-to-use
    interface, you can quickly create an audio recording file that can be imported
    into another recording application such as `Audacity` for editing if needed.


    ## Recording Software


    Many recording software applications are available to assist you with your podcast.
    Some are free and open source which works well for limited budgets.


    One open source solution is `Audacity` (Figure [8-4](#501049_1_En_8_Chapter.xhtml#Fig4)).
    `Audacity` is a free cross-platform, open source, digital editing and recording
    software application available on the Web. It allows users to not only record
    audio files but also import them. You can also export files into various file
    formats such as `mp3` or `mp4`. It also allows you to enhance your audio recording’s
    sound quality before exporting it.


    ![../images/501049_1_En_8_Chapter/501049_1_En_8_Fig4_HTML.jpg](images/501049_1_En_8_Chapter/501049_1_En_8_Fig4_HTML.jpg)


    **Figure 8-4** `Audacity` recording software available from [www.audacityteam.org/](http://www.audacityteam.org/)


    Another option for Mac and iOS users is `GarageBand`. It is available for free
    in the Apple App Store. `GarageBand` is another all-in-one solution for your podcast
    needs. With `GarageBand`, you can record your audio podcast as well as make music
    for it. `GarageBand` contains music loops that can be included within your podcast.
    If you are a musician, you can connect a musical instrument such as a keyboard
    or guitar to create music to add to your podcast. If your iOS mobile device is
    newer, it will require an Apple adapter to use equipment with USB ports (Figure
    [8-5](#501049_1_En_8_Chapter.xhtml#Fig5)).


    ![../images/501049_1_En_8_Chapter/501049_1_En_8_Fig5_HTML.jpg](images/501049_1_En_8_Chapter/501049_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5** Adapter for iOS mobile devices that need to use a USB microphone


    ## Podcast Hosting


    Podcast directories such as `Buzzsprout.com` provide free and paid podcast hosting
    (Figure [8-6](#501049_1_En_8_Chapter.xhtml#Fig6)). These directories will not
    only store your podcast files but also generate the RSS feed needed to submit
    your podcast to other podcast directories. However, free accounts provide limited
    features. For instance, free plans typically include advertisements that will
    not be removed until a paid plan is purchased. In addition, many free plans will
    not allow you to use your uniform resource locator (URL). Your URL provides more
    branding and marketing opportunities than using a pre-generated URL. Until you
    are ready to start paying for more advanced podcasting features, it might be a
    good idea to stick with free podcast hosting. Other podcast hosting that offer
    free and paid hosting include:


    ![../images/501049_1_En_8_Chapter/501049_1_En_8_Fig6_HTML.jpg](images/501049_1_En_8_Chapter/501049_1_En_8_Fig6_HTML.jpg)


    **Figure 8-6** `Buzzsprout.com` provides podcast hosting for podcasters


    - `Anchor.fm`

    - `Podbean.com`

    - `Spreaker.com`


    Once you select your podcast hosting provider, you will need to give your podcast
    a title, description, artwork, and category. If you are not artistic, `Canva`
    can help you create your artwork. `Canva` provides templates that you can use,
    or you can create your own design. Some of the other podcast settings you will
    need to configure include:


    - Podcast type

    - Website address

    - Episode limit

    - Keywords

    - Artist name

    - Contact email address


    Once you have recorded and uploaded your podcast episodes, you will need to periodically
    log in to your podcast hosting to review your podcast stats. These stats will
    provide valuable insight on your episodes. Some of the insights you will gain
    about your listeners are:


    - Download numbers

    - Geographic location

    - Devices used to listen

    - Apps used to listen


    Once you have your podcast’s RSS feed, do not forget to submit it to numerous
    podcast directories to increase your discoverability.


    ## Summary


    Podcasts are another tool to help boost your online content while keeping learners
    engaged. With many podcasts widely available on the Web for free along with being
    easy to create, they are a perfect fit for any size budget as well as online learning.
    They also allow learners the flexibility to listen and learn at their convenience
    and on their preferred mobile and wearable devices. The most important thing to
    remember is to make incorporating podcasts into your online learning fun and engaging.


    Footnotes [1](#501049_1_En_8_Chapter.xhtml#Fn1_source) [2](#501049_1_En_8_Chapter.xhtml#Fn2_source)'
