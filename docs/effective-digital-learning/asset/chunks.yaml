    ### Google 云端硬盘


    许多人使用的云端存储解决方案之一是 Google 云端硬盘（图 11-6）。它在任何类型的设备上都易于使用，并且还提供适用于 iOS 和 Android 移动设备的移动应用。要使用
    Google 云端硬盘，你需要一个免费的 Google 账户。在撰写本文时，Google 云端硬盘提供 15GB 的免费存储空间，该空间由 Google 云端硬盘、Gmail
    和 Google 相册共享。如果你需要更多空间，始终可以升级到付费方案。你的组织可能有提供无限存储空间的方案，因此最好去了解一下。你还可以在 Google
    云端硬盘内与他人共享文件和文件夹，这可以节省时间和纸张，并促进协作。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig6_HTML.jpg](img/501049_1_En_11_Fig6_HTML.jpg)


    图 11-6


    Google 云端硬盘 ([www.google.com/drive](http://www.google.com/drive)) 提供满足您需求的云端存储


    ### Dropbox


    另一个提供免费云端存储的竞争者是 Dropbox（图 11-7）。Dropbox 提供一个免费的基本方案，为你的文件提供 2GB 的云端存储空间。与 Google
    云端硬盘相比，这个空间很小，但它是一个选择。要获得更多存储空间，你必须升级到付费方案。


    ![../images/501049_1_En_11_Chapter/501049_1_En_11_Fig7_HTML.jpg](img/501049_1_En_11_Fig7_HTML.jpg)


    图 11-7


    Dropbox ([www.dropbox.com](http://www.dropbox.com)) 是满足您在线需求的另一个云端存储解决方案


    ## OneDrive


    如果你有 Microsoft 账户，则可以使用 OneDrive。OneDrive 可在以下设备上运行：


    - 搭载 Windows 10 的 Windows 个人电脑和笔记本电脑

    - Windows Surface 平板电脑

    - Xbox One 主机


    它包含 5GB 的免费文件存储空间。OneDrive 的一个功能是它会自动将你的文件备份到云端。它还会同步这些文件，以便你可以从任何设备访问它们。你也可以从
    OneDrive 共享文件。大多数组织使用 Office 365，因此你已经可以访问 OneDrive。你需要询问你的存储容量。


    ## 实用工具


    除了已经提到的工具之外，一些重要的实用工具可以帮助你创建引人入胜的虚拟学习内容。它们还可以帮助你呈现更专业的形象。


    ### Grammarly


    你收到过多少次不仅难以阅读，而且难以理解的书面沟通内容？可能比你愿意记起的次数还要多。想象一下，当你的在线学习者收到写得糟糕的沟通内容时，他们会是什么感受。写得糟糕的沟通内容会导致学习者失去对教育工作者及其专业知识的信任和信心。没有恰当书写的思想和想法无法轻易传达。


    Grammarly 是一个基于 Web 的应用程序，可以帮助你提高写作的有效性和专业性。它提供免费和付费版本。要使用它，你可以将书写的文本复制并粘贴到 Grammarly
    网站，或者将文件上传到 Grammarly 进行检查。还可以安装一个 Grammarly 插件，并在 Microsoft Word 以及你的浏览器中运行。一旦
    Grammarly 获得你的文本，它就会检查其中的语法错误以及其他方面，以产生清晰简洁的写作。它还可以检查你的电子邮件、社交媒体帖子等。通过使用 Grammarly，你可以确保你的课程内容没有错误，并以最佳方式呈现自己。它还能帮助你的学习者建立对你和你的专业知识的信任和信心。你可以访问
    [`www.grammarly.com`](http://www.grammarly.com) 找到 Grammarly。


    ### 截图工具


    虽然它不是在线资源，但它是一个免费且对教育工作者有价值的资源。对于使用 Windows 7 及更高版本的 PC 用户来说，有一个预装的应用程序叫截图工具。截图工具提供了执行屏幕截图的功能。可以通过在
    Windows 任务栏的搜索框中输入 `Snipping Tool` 来打开它。打开后，你可以按以下形式之一截图或捕获信息：


    - 任意格式截图

    - 矩形截图

    - 窗口截图

    - 全屏截图


    截图完成后，你可以将其保存到个人电脑中，以包含在你的课程材料中，例如讲座、文档、公告、讨论、作业等。


    ## 总结


    正如你所见，免费并不总是意味着差劲或低劣。网上有如此多的可用于虚拟学习的免费资源，我们很难在这本书中一一列举。希望你已经看到，许多这些免费资源与它们的付费版本相比毫不逊色。既然你已经了解了其中一些资源，你就可以开始创造令人兴奋的在线学习体验，让你的学习者永难忘怀。你也不会忘记它，因为在此过程中你省下了钱。


    # 12. 测试在线学习


    第 11 章讨论了各种免费在线资源，这些资源不仅能最大化你的教学体验，还能提高学生的参与度。一些教育工作者可能认为免费在线资源不如付费选项，但情况并非总是如此。随着价格上涨以及预算和薪水的缩水，一些基于付费的学习资源过于昂贵。因此，你必须要么研究创造性的变通解决方案，要么寻找免费的替代方案。


    一旦你找到了资源，熟悉了它们，并将它们整合到 LMS 内的课程材料中，你可能会觉得自己已经大功告成。不幸的是，还没有。你还有关键的一步：测试。尽管你尽了最大努力，意想不到的事情还是会发生。正如墨菲定律告诫我们的：“*任何可能出错的事情都会出错。*”
    恰当的测试能降低墨菲定律发生的可能性。


    ## 为什么测试很重要


    在理想世界中，技术会自动按预期工作。不幸的是，尤其是在线学习中，情况并非如此。在新冠疫情期间，随着学校从传统的面对面学习过渡到在线学习，出现了许多技术问题。由于系统需求增加，学生和教育工作者无法访问他们的
    LMS。许多学生缺乏互联网服务或计算机来完成他们的课程作业。你可能有一些个人的经验可以分享。虽然疫情是一种特殊情况，但仍然需要事先进行测试，以便预测和准备这些情况。


    ## 测试的类型


    测试在线学习管理系统至关重要。没有什么比学习者在课程开始或进行中遇到可以预防的错误更糟糕的了。这些可预防的错误会给学习者留下糟糕的第一印象，这不仅会影响他们对在线学习的态度，还会影响他们对你和课程的态度。一个好做法是让多人在不同的计算机和移动设备上执行各种测试功能。但是，如果你没有其他人可以协助测试，你仍然可以进行有效的测试。在我们开始讨论测试之前，你需要了解在虚拟学习环境中将要执行的两种测试类型：可用性测试和性能测试。

