- fmt: '# LMS Benefits


    One benefit of an LMS is that all learning materials are stored in one central
    location in electronic format on a web server hosted outside of an organization.
    This is referred to as a hosted solution in which a license or subscription is
    purchased to use the software for a designated time. Along with this license comes
    training, technical support, maintenance, and upgrades to new features. The LMS
    is either hosted on a designated web server at a learning institution data center
    or at a third-party data center located in another geographical area of the world.
    Regardless of where the web server is located, the organization’s designated administrator
    will have access via the Web. Although this structure typically has a lower total
    cost of ownership due to reduced hardware, software, infrastructure, and technology
    personnel costs, technical and backup personnel resources must be established.
    Most LMS vendors offer a guaranteed uptime along with security for the platform.


    An LMS also provides analytical data about learners. Educators can review this
    information to track learners’ activity as they progress throughout the course.
    It also allows you and your institution to track how much time learners are spending
    in the course as well as educators. Likewise, they can observe which content forms
    are effective and which ones might need adjustments.


    Learners also benefit from using an LMS. It provides a predetermined learning
    path established by you to accomplish the course objectives and outcomes. The
    content is organized in a sequential manner, so learners acquire knowledge about
    one subject area before moving to the next one. Each lesson builds upon the previous
    one. A typical learning path can be organized either by weeks, modules, or subjects.
    Also, whenever new information is available, they can receive announcements from
    you posted in the LMS or via email. Overall, learners have immediate access to
    information when they need it.


    ## LMS Limitations


    The biggest limitation of many of the proprietary LMS platforms is price. Depending
    on the number of intended users and features, these LMS platforms can be expensive
    and outside of the budgets for some individuals, smaller organizations, and nonprofits.
    Although there are some inexpensive options available, some are not comparable
    to their bigger counterparts in terms of features and performance. Since most
    LMS platforms are software applications managed by third-party providers, they
    are subject to unexpected downtime and technical difficulties. To address these
    concerns, you can always select a larger vendor with a good reputation that provides
    a service level agreement guaranteeing designated uptime.


    ## Summary


    An LMS is a critical component to online learning. Although many LMSs exist, not
    all are created equal. Some of the most popular LMSs with extensive features can
    be expensive. It is imperative that you know your budget, technical resources,
    and requirements so that you can select the best LMS for your current and future
    needs. Likewise, you want to ensure that as your needs change, your LMS can easily
    accommodate those needs without breaking the bank and compromising performance.


    Footnotes [1](#501049_1_En_5_Chapter.xhtml#Fn1_source) [2](#501049_1_En_5_Chapter.xhtml#Fn2_source)
    [3](#501049_1_En_5_Chapter.xhtml#Fn3_source) [4](#501049_1_En_5_Chapter.xhtml#Fn4_source)


    # 6. Presentation Tools


    In the previous chapter, learning management systems (LMSs) were examined along
    with their role in helping institutions and educators organize their content.
    LMSs also help connect learners and educators from anywhere and any device. They
    also provide another communication medium while reducing paper consumption and
    costs. When selecting an LMS, institutions and educators must realize that there
    is not a one-size-fits-all LMS solution. Everyone has different needs. What works
    for one organization and educator might not work for another one. The primary
    goal of any LMS should be to help learners engage with the course content as they
    learn.


    Content stored in LMSs can take on various forms but mostly digital. Whatever
    form the content is in, it serves a purpose. It also provides a benefit to the
    learner’s learning experience. One of the most popular and common content formats
    is the presentation.


    ## Choosing Your Presentation Materials


    “*It’s not what you say but how you say it that is important.*” You have probably
    heard this adage more times than you care to remember. However, it is especially
    true when it comes to presentations. Presentations are a content form used to
    organize information about a topic. Speakers and educators typically use them
    to deliver a topic’s content. Presentations typically consist of slides containing
    bullet points of information. These bullet points are used as talking points.
    As the information is delivered to the audience, the audience follows along.


    As you learned in Chapter [4](#501049_1_En_4_Chapter.xhtml), everyone learns according
    to their learning style. Most learners have a dominant or preferred learning style.
    This learning style helps learners not only receive information better but also
    understand it better. By utilizing presentations, educators are able to address
    not only visual learners but also auditory learners. Presentation slides, also
    called slide decks, can utilize different color schemes to elicit certain emotions
    in learners. Similar to the psychology of color subconsciously used in marketing
    campaigns, educators can apply the same effect. Websites such as Adobe Color (`https://color.adobe.com`)
    and `www.presentationteam.com` can assist you in selecting the right color scheme
    for your presentation. As you are creating your presentation, do not forget about
    branding and include your organization’s logo on each slide in the header or footer
    area.


    Presentations can be designed to be aesthetically appealing to keep learners engaged.
    For instance, many presentation software applications provide templates that can
    be used to create content rather than starting from scratch. Some of the content
    that can be included within presentations to engage learners includes:


    - Images

    - Charts

    - Animations

    - Music

    - Shapes

    - Multimedia

    - Transitions


    Without presentations, learners would rely solely on their auditory learning style
    which might not be their preferred learning style. We all can recall our college
    days when we had a professor who lectured for the entire class period without
    a presentation. In an online learning environment, it can be difficult for learners
    to watch a talking head video delivering a presentation and remain engaged. It
    is easy to miss information that is heard rather than seen.


    ## Presentation Creation Strategies


    When most people hear the words “online presentation,” PowerPoint immediately
    comes to their minds. The next thing that comes to mind is the term “Death By
    PowerPoint.” The term “Death By PowerPoint” has been attributed to Angela R. Garber,
    but many people had already experienced it although did not name it.^([15](#fn15))
    In a general sense, it refers to the boring effect caused by a PowerPoint presentation
    and its presenter. Many effects can be added to presentations to make them interesting.
    However, all of them are not needed. Although presentation tools allow you to
    create presentations any way you want, it is good to follow some industry best
    practices to achieve a maximum impact. Your content and its impact on learners
    should be the primary focus rather than how many of the presentation software’s
    features you can implement.'
