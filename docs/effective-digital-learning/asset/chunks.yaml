  trans: '

    # LMS 的优势


    LMS 的优势之一在于，所有学习材料都集中存储在一个中心位置，并以电子格式存放于组织外部的网络服务器上。这被称为托管解决方案，即通过购买许可证或订阅在指定时间内使用该软件。该许可证还附带培训、技术支持、维护以及新功能升级。LMS
    托管在教育机构数据中心的指定网络服务器上，或位于世界其他地理区域的第三方数据中心。无论网络服务器位于何处，组织的指定管理员都能通过网络进行访问。尽管这种结构通常因减少硬件、软件、基础设施和技术人员成本而具有较低的总体拥有成本，但仍需建立技术和备份人员资源。大多数
    LMS 供应商都提供平台的安全保障以及保证的正常运行时间。


    LMS 还提供有关学习者的分析数据。教育工作者可以查看这些信息，以在学习者完成课程的过程中追踪他们的活动。它还能让您和您的机构追踪学习者和教育工作者在课程上花费的时间。同样，他们可以观察哪些内容形式有效，哪些可能需要调整。


    学习者也能从使用 LMS 中受益。它提供了由您制定的、旨在实现课程目标和成果的预定学习路径。内容按顺序组织，以便学习者在进入下一主题领域之前掌握一个领域的知识。每一课都建立在前一课的基础上。典型的学习路径可以按周、模块或主题来组织。此外，当有新信息可用时，他们可以通过您在
    LMS 中发布的通知或电子邮件收到。总的来说，学习者在需要时可以即时获取信息。


    ## LMS 的局限性


    许多专有 LMS 平台最大的局限性在于价格。根据预期用户和功能的数量，这些 LMS 平台可能价格昂贵，超出个人、小型组织和非营利组织的预算。尽管有一些价格低廉的选择，但在功能和性能方面，有些无法与规模更大的同类产品相比。由于大多数
    LMS 平台是由第三方提供商管理的软件应用程序，因此可能会遇到意外的停机和技术问题。为了解决这些问题，您始终可以选择信誉良好、提供服务水平协议以保证指定正常运行时间的大型供应商。


    ## 总结


    LMS 是在线学习的关键组成部分。尽管存在许多 LMS，但并非所有 LMS 都同样优秀。一些功能广泛、最受欢迎的 LMS 可能价格不菲。了解您的预算、技术资源和需求至关重要，这样您才能选择最适合您当前和未来需求的
    LMS。同样，您需要确保随着需求的变化，您的 LMS 能够轻松适应这些需求，而不会造成财务负担并影响性能。


