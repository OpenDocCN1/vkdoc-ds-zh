  trans: '

    ### KISS 原则


    尽管有众多功能可供使用，您可能会想把所有功能都塞进演示文稿中。然而，这并不是一个好主意。这不仅会让学员不知所措，同时也会让您想要传达的信息丢失。每当设计演示文稿时，都应牢记
    KISS 原则。KISS 原则，是“Keep It Simple Silly”（保持简单，傻瓜）的缩写，意味着您应该尽可能地简化演示文稿及其各个组成部分。例如，TED
    演讲就简单直接。其重点在于传递优质内容，而非华丽的演示幻灯片。在演示中贯彻 KISS 原则的一些方法包括：


    *   使用两到三种字体以保持一致性

    *   留出足够的空白区域以提高可读性

    *   在整组幻灯片中统一使用两到三种配色方案

    *   使用项目符号让内容更易读


    ### 减少杂乱


    有些 PowerPoint 幻灯片包含了过多信息，如文字和图片。学员会认为这些幻灯片杂乱无章、令人眼花缭乱且难以阅读。一个不幸的结果是学员会走神，不再参与其中。学员的注意力持续时间很短，您的演示文稿必须抓住并保持他们的注意力直到结束。一张幻灯片不应包含关于某个主题的所有内容。它只应突出主题的要点。这不仅适用于幻灯片上的文字，也适用于图片和项目符号。永远记住，少即是多。


    ### 限制动画效果


    回想一下你上次观看包含动画效果的演示文稿时的情景。当你看到第一个动画时感觉如何？随着演示的继续，使用了更多的动画。你当时感觉如何？感到厌烦吗？你觉得你的学员会有什么感觉？适量使用时，动画可以增添演示的趣味性。然而，过多的动画会分散注意力，并且显得业余。请将演示文稿中的动画数量限制在不超过一两个。


    ### 限制切换效果


    幻灯片之间的切换效果可以增添美感。与动画效果一样，任何事物过多都会迅速变成坏事。对于切换效果，您需要确保它们风格统一，并且不会干扰您的演示。如果您选择使用切换效果，请考虑在整个演示文稿中一致地使用一两种。


    ### 使用高质量的图片


    除了为演示文稿选择良好的配色方案和设计外，高质量的图片也是必需的。低质量的图片会分散人们对演示文稿内容的注意力。您的图片需要能够独立支撑您的主题。它们还需要是专业、高分辨率的，能够在缩放时不影响画质。同样，请确保您拥有在
    PowerPoint 或您使用的任何其他演示工具之外使用这些图片的版权许可。在一张幻灯片上，图片也应适量使用。每张幻灯片使用一到两张图片是一个好习惯。否则，您的幻灯片很快会变得杂乱。在第
    11 章中，您将了解一些用于查找图片的免费资源。其他用于查找付费高清免版税图片的资源包括：


    *   Getty Images – [`www.gettyimages.com`](http://www.gettyimages.com)

    *   Shutterstock – [`www.shutterstock.com`](http://www.shutterstock.com)

    *   Dreamstime – [`www.dreamstime.com`](http://www.dreamstime.com)


    ### 谨慎使用音乐


    人人都喜欢音乐。音乐能连接我们、让我们充满活力。在演示中使用音乐可以很好，但您必须知道在何处使用。例如，在整场演示中持续播放音乐就不是个好主意。然而，可以在演示开始时使用音乐来定下基调。您还必须为您的听众选择合适的音乐类型，以产生预期的效果。例如，您不会想在面对一群年幼儿童听众时，以一段缓慢的音乐开场。孩子们精力充沛，所以一首更欢快的歌曲会更好。在选择要添加到演示中的音乐时，请确保它是免版税的，以避免版权问题。免版税音乐允许您一次性付费，但可以无限次使用。一些常见的免版税音乐来源包括：


    *   Premiumbeat.com

    *   Bensound.com

    *   Youtube.com


    ## 演示工具选项


    仍然对创建引人入胜的演示感到不安？没问题。好消息是，有许多演示软件应用程序可以帮助教育工作者创建他们的演示，以实现最大程度的学员参与度和影响力。在创建演示之前，集思广益构思演示创意是一个好主意。同样，如果您没有创建演示的经验，可以四处寻找灵感。一些有助于您寻找灵感的网站包括：


    *   Slideshare.net

    *   [`www.free-power-point-templates.com`](http://www.free-power-point-templates.com)

    *   [`https://powerpointify.com`](https://powerpointify.com)

    *   Powerhouse.net


    ### Microsoft PowerPoint


    多年来，Microsoft PowerPoint 一直是创建 PowerPoint 演示文稿的行业标准和领导者。目前，它随 Microsoft 365 提供。它也在苹果
    App Store 和安卓 Google Play Store 中提供免费的应用程序。要查看教育工作者和学员是否有资格免费获取 Microsoft Office
    365，请访问 [`www.microsoft.com/en-us/education/products/office`](http://www.microsoft.com/en-us/education/products/office)（图
    6-1）。如果您不是教育工作者或学生，可以使用免费应用，也可以从微软网站购买 Office 365。


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig1_HTML.jpg](img/501049_1_En_6_Fig1_HTML.jpg)


    图 6-1


    检查您是否有资格免费获取 Office 365


    创建演示可能是一项艰巨的任务，但 PowerPoint 提供了演示文稿模板助您入门（图 6-2）。这些模板可在微软 Office 网站上获取。PowerPoint
    不仅能创建令人印象深刻的演示文稿，还能创建视频。您将在接下来的章节中了解更多相关信息。


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig2_HTML.jpg](img/501049_1_En_6_Fig2_HTML.jpg)


    图 6-2


    用于获取 PowerPoint 模板的微软 Office 网站


    ### Prezi


    Prezi 是一种演示工具，允许您创建交互式演示文稿以及视频（图 6-3）。


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig3_HTML.jpg](img/501049_1_En_6_Fig3_HTML.jpg)


    图 6-3


    在 [`​prezi.​com/`](https://prezi.com/) 注册 Prezi 账户


    Prezi 让您能够与屏幕上的演示内容进行交互。换句话说，它能让您的演示在学员面前变得生动。这是保持学员参与度的绝佳方式。您可以使用三种 Prezi 产品来创建交互式内容：


    *   Prezi Presents 用于创建演示文稿

    *   Prezi Video 用于创建视频

    *   Prezi Design


    Prezi 演示文稿可以在 Google Classroom、Zoom、Microsoft Teams 以及其他网络研讨会平台中使用。同样，PowerPoint
    演示文稿可以导入到 Prezi 中，但将 Prezi 导出为 PowerPoint 则更为困难。

