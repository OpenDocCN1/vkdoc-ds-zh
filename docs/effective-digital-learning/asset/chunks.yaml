- fmt: '# Content Goals


    It is important to determine your content’s goals. Thinking like your learners
    is one way to establish content goals. Asking questions of your content is a good
    technique to evaluate whether it will meet learner’s needs and expectations (Figure
    [4-3](#501049_1_En_4_Chapter.xhtml#Fig3)). Likewise, it will help you determine
    whether it will help you reach your course outcomes. The order of these questions
    is not important. What is important is that they help you brainstorm your content
    goals.


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig3_HTML.jpg](images/501049_1_En_4_Chapter/501049_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Content questions to ask when preparing content


    Another goal to keep in mind is attention span. Most people do not have long attention
    spans. Furthermore, all learners do not have the same attention span. According
    to a Microsoft study, the average attention span has decreased from 12 seconds
    in 2000 to 8 seconds in 2018.^([^(10)](#fn10)) If you combine this with an online
    learning environment where learners can surf the Web when bored, the attention
    span can decrease even lower. Engaging and interactive content such as videos
    and Prezis can help retain attention while supplementing content. It can also
    motivate learners. We will discuss videos and their creation later in the book.


    Simplicity is often an overlooked content goal. It can be tempting to incorporate
    all the latest technology in your content. However, how will this benefit the
    learner? What value does this add to the content? If you cannot answer these questions,
    the technology probably is not needed. When considering any technology for content,
    always keep the KISS Principle in mind. You cannot go wrong with simple content
    because it can always be developed further.


    # Summary


    Producing learner-centered content is important. It helps learners determine the
    content’s value and how it can be applied to real-world situations. There is not
    a magic formula for creating online learning content. As long as the content centers
    around learners and their needs, it has a good chance of having a successful outcome.


    Footnotes [1](#501049_1_En_4_Chapter.xhtml#Fn1_source) [2](#501049_1_En_4_Chapter.xhtml#Fn2_source)


    # 5. Learning Management Systems


    In Chapter [4](#501049_1_En_4_Chapter.xhtml), you learned the basics of content
    creation and how both educators and learners benefit from it. Content is the heart
    of any learning particularly online learning. It sets the learning tone and helps
    learners achieve the desired course outcomes. It should focus on the quality of
    the content rather than the quantity. When quality content is engaging and models
    real-world application, learners are motivated to learn and want to learn more.
    Their learning experience becomes more meaningful because they see the content’s
    value. They also can see their return on investment without the worry about the
    fear of missing out (FOMO).


    Once content has been planned and created, it needs a storage location. Oftentimes,
    it is stored either on the content creator’s computer or on cloud-based storages
    such as Google Drive, OneNote, and others. Although these are good short-term
    options, a more long-term, scalable solution will be needed to make the content
    accessible to its target audience. A learning management system (`LMS`) offers
    the solution.


    ## Learning Management System Basics


    A learning management system (`LMS`) is a web-based software application used
    to store learning content material and supporting assets for online learning.
    These assets can consist of


    *   Multimedia

    *   PDFs

    *   Images

    *   eBooks

    *   Audio files

    *   Social media feeds

    *   Videoconferencing

    *   RSS feeds

    *   Presentation files


    Since LMSs are web-based, they can be accessed via a web browser from most Internet-connected
    devices. By accessing the LMS through a web browser, learners begin a predetermined
    learning path created by educators that helps them achieve the desired learning
    outcomes. The LMS also facilitates easy communication and sharing of information
    between learners and educators.


    Most LMS applications offer a mobile app that can be downloaded from Apple’s App
    Store or Android’s Google Play Store. Once downloaded, educators and learners
    can access the course and its materials. For instance, `Canvas`, one of the most
    popular LMS platforms by Instructure and used by many postsecondary institutions,
    offers a mobile app that can be used to access the online classroom from anywhere.
    LMS platforms and their mobile apps give learners and educators the added flexibility
    and convenience that online learning offers. Some of the most popular paid proprietary
    LMSs used by larger institutions include


    *   Brightspace

    *   Blackboard Learn


    ### LMS Considerations


    Before deciding on an LMS, you must determine your budget as well as your needs.
    You would not go shopping for a house without a price range in mind along with
    a list of requirements. The same applies to shopping for an LMS. You do not want
    to invest in an LMS that does not meet at least 80% of your needs. This is often
    referred to as the Pareto Principle or the 80/20 rule named after the highly regarded
    economist Vilfredo Pareto.^([^(11)](#fn11)) Some of the questions you should ask
    when considering LMSs include:


    *   What are your goals?

    *   What features do you need?

    *   How many users can the LMS handle?

    *   How scalable is the LMS?

    *   Is the LMS within your budget?

    *   What type of support is offered?

    *   How easy is the LMS for the learners and educators to use?

    *   What analytics are available?

    *   Does the LMS provide accessibility accommodations?

    *   What type of security does the LMS provide?

    *   What is the uptime guarantee?

    *   Is branding available?

    *   What type of training is provided?

    *   Where is the data center located?

    *   What type of security does it provide?

    *   Is it easy to use?

    *   Does it have a responsive design?


    ### Types of LMSs


    When looking for an LMS solution, you will encounter many options. However, all
    solutions are not created the same. Unfortunately, there is not a one-size-fits-all
    LMS for every situation. For this reason, it is important to be clear about your
    needs. Most learning LMSs fall into one of three categories:


    *   Proprietary (commercial)

    *   Open source

    *   Free


    Let us explore these types to help you select the right one based on your needs.


    ### Proprietary LMS


    Proprietary or commercial LMS platforms are created by for-profit organizations.
    These LMS platforms charge a licensing fee per user which is either monthly, yearly,
    or subscription-based to use their systems. They are typically used by larger
    organizations and universities due to their expensive price tag and name reputation.
    Proprietary LMSs provide numerous bells and whistles features that many organizations
    can use now or in the future. Likewise, they typically provide hosting for the
    LMS as well as security. They also provide all the maintenance and software updates
    through a service level agreement which helps organizations that might lack technical
    resources. When new features become available, some form of training is typically
    provided to customers via webinars or recorded videos. In addition, support is
    provided in the form of phone, email, online chat, and online support forums which
    is typically included in the LMS cost. Several LMS platforms used by schools include:


    *   Blackboard

    *   Microsoft Teams

    *   Canvas


    Although proprietary LMSs have advantages, there are also some disadvantages.
    For instance, customers must wait for the LMS vendor to provide software fixes
    and updates. Likewise, price increases are likely to occur at any time.'
