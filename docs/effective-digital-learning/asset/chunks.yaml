  trans: '

    ### 开源学习管理系统


    除了专有学习管理平台之外，还有开源学习管理系统可供选择。根据 Opensource.com 的定义，开源软件是“源代码可供任何人检查、修改和增强的软件”。^((12))
    与专有软件相比，开源软件无需支付许可费。尽管可以免费下载和修改，但与微软等大型专有供应商相比，一些人和组织仍然对其可靠性和安全性持怀疑态度。开源软件可以修改，但专有软件只能由其创建者修改。


    在比较开源学习管理系统和专有学习管理系统时，你必须记住，专有学习管理系统在其定价结构中提供了不同级别的专属支持。这种支持可以通过电话、电子邮件、在线聊天或在线知识库提供。开源学习管理系统通常通过在线论坛和文档提供支持。YouTube
    和谷歌搜索是解决开源学习管理系统问题的其他途径。


    如果你或你的组织缺乏实施开源学习管理解决方案的技术专长，则必须聘请人员或指定组织内的个人，通过在线文档、在线论坛和反复试验来学习并成为所选开源解决方案的专家。由于
    `Apache` 是一个由 Apache 软件基金会维护的流行开源 Web 服务器平台，并被众多 Linux（开源）服务器的主机提供商使用，因此与 Windows
    主机相比，你有可能节省托管费用。^((13)) 如果你更喜欢 Windows 虚拟主机，`Apache` 也可以使用，但你的网站托管费用可能会更高。


    一个开源学习管理系统的例子是 Moodle（图 5-1）。


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig1_HTML.jpg](img/501049_1_En_5_Fig1_HTML.jpg)


    **图 5-1** 可从 [`moodle.org`](https://moodle.org) 下载的 Moodle 开源学习管理系统


    `Apache` 虚拟主机提供商免费提供 Moodle，只需从名为 `cPanel` 的网络控制台单击一下即可安装。一些提供 Moodle 的热门网站托管服务商包括：


    - Scala Hosting – [`www.scalahosting.com`](http://www.scalahosting.com)

    - Amazon Web Services – [`http://Aws.amazon.com`](http://aws.amazon.com)

    - MoodleCloud – [`https://moodlecloud.com`](https://moodlecloud.com)

    - Lambda Solutions – [`www.lambdasolutions.net`](http://www.lambdasolutions.net)


    虽然 Moodle 是免费的，但你仍需支付网站托管费用。安装好 Moodle 后，你可以轻松地根据课程规格设置你的学习管理系统。Moodle 网站还提供了一个演示站点，你可以使用它来进一步熟悉其功能^((14))（图
    5-2）。


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig2_HTML.jpg](img/501049_1_En_5_Fig2_HTML.jpg)


    **图 5-2** Moodle 提供演示来了解其功能


    Moodle 可以安装为自托管选项。使用自托管选项，你或你的机构将负责设置平台所涉及的一切事务，包括：


    - 网站托管

    - 设置

    - 用于支付的商户账户

    - 维护

    - 升级

    - SSL 证书

    - 网站托管监控

    - 安全

    - 备份

    - 支持

    - 培训

    - 负责维护和软件升级的 Moodle 技术资源


    最初，自托管的学习管理系统解决方案似乎比专有学习管理系统更具成本效益，但必须考虑所有成本才能确定真正的拥有成本。如果你对自托管选项不感兴趣，Moodle 也为中小型企业提供付费的托管选项。使用托管选项，你需要按月或按年付费，这提供了前面提到的自托管选项以及其他功能。网站托管费用通常从每年
    100 美元或更多起，具体取决于用户数量以及选择的是共享主机还是专属主机。但是，你仍然需要一名 Moodle 技术资源来解决任何技术问题，并作为与网站托管服务商的联系点。


    ### 免费学习管理系统选项


    如果开源、自托管的选项不可行，你可以考虑使用 Google Classroom。Google Classroom 是 Google 提供的免费托管学习管理系统，可用于促进小学、中学和高等教育阶段教育者与学习者之间的互动（图
    5-3）。诸如 Google Classroom 之类的免费学习管理解决方案具有专有学习管理系统的许多特性，但无需付费。然而，根据你的预期用途，你可能需要付费才能使用像
    Google Classroom 这样的学习管理系统。


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig3_HTML.jpg](img/501049_1_En_5_Fig3_HTML.jpg)


    **图 5-3** Google Classroom 作为 Google 教育套件的一部分提供


    如果你计划在学校与学生一起使用 Google Classroom，则必须由你的学校完成 `G Suite for Education` 的注册（图 5-4）。`G
    Suite for Education` 提供了选择安全选项以及必要的 Google 产品以保护学习者和教育者信息安全的选项。


    ![../images/501049_1_En_5_Chapter/501049_1_En_5_Fig4_HTML.jpg](img/501049_1_En_5_Fig4_HTML.jpg)


    **图 5-4** 在 Google Classroom 中创建新课程


    对于不是 `G Suite for Education` 成员的用户，需要一个 Google 帐户才能创建免费的 Google Classroom。创建 Google
    Classroom 后，可以通过以下形式创建课程内容：


    - 作业

    - 测验

    - 通过 Google Meet 进行视频会议

    - 提问

    - 教育者发布的资料

    - 重新使用帖子

    - 主题


    `Google Calendar`、`Google Drive` 以及 `Google Docs` 等 G Suite 应用程序也集成在 Google Classroom
    中，以协助创建课程内容。如果课程需要涉及付费的注册流程，你需要查看 `G Suite for Education` 关于商业用途的使用条款。

