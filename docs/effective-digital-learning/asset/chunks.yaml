  trans: '

    # 硬件


    虽然你不需要拥有最新的电脑，但它至少不能超过 2 到 4 年的使用年限。计算机技术日新月异，今天流行的配置大约在 2 到 5 年内就会过时。大多数教育机构会为学习者和教育者提供与自身技术基础设施相匹配的硬件要求。一条值得遵循的好原则是，使用一台使用年限在
    2 到 3 年之间的台式机或笔记本电脑，并满足以下最低配置要求：


    *   `Windows 7` 操作系统或 `Mac 10.2 Sierra` 操作系统或更高版本

    *   `Intel i3` 双核处理器或等效的 `AMD` 处理器或更高版本

    *   `2 GHZ` 或更高主频的处理器

    *   `1GB` 可用磁盘空间

    *   `4GB` 或更高容量的内存

    *   网络摄像头


    你也可以使用更旧的电脑。但这会影响你的在线学习体验。处理器速度和内存越高，能同时打开的应用程序就越多，电脑运行速度也会更快。


    `Chromebook` 是屏幕较小的小型笔记本电脑，运行谷歌的操作系统 `Chrome OS`。通常，它们比台式机和笔记本电脑便宜，并可使用 Google
    的云端应用程序，例如 `Gmail` 和 `Google Drive`。由于其处理器速度慢、内存容量小，它们不应作为涉及编程或其他处理器密集型课程的高等在线学习首选设备。然而，对于中小学生来说，它们是个不错的选择。`Chromebook`
    的另一个限制是，没有网络连接就无法使用。


    随着移动设备尺寸的不断增大，它们将继续为传统和在线学习增添灵活性。许多学习资源都可以通过这些设备上的应用程序获取。像`Remind` 和 `Show My
    Homework` 这类的通知应用，可以帮助教育工作者与学生及其家长进行沟通。一些移动设备可能比台式机或笔记本电脑更昂贵。它们也缺少物理键盘，这需要额外购买。最后，它们的处理速度和内存有限。凭借其便携性，它们非常适合用来辅助进行移动学习。


    # 打印机


    尽管你的大部分在线学习都在网上进行，但有时你还是需要打印文档。拥有一台喷墨或激光打印机，你就可以在需要时进行打印。喷墨打印机的初始购置成本可能低于激光打印机。然而，与喷墨打印机相比，激光打印机使用其碳粉盒可以打印更多页面。如今，许多一体式打印机都带有扫描功能，这可以为你节省金钱和空间。


    # 扫描仪


    有扫描仪很好，但并非必需。如果还没有扫描仪，也不用担心。许多扫描应用程序可以在移动设备上免费或付费使用。例如，`Notes` 应用在 `iOS` 设备上是免费提供的，并且可以用来扫描文档。


    # 软件


    你所需的主要软件是一个网络浏览器，例如 `Firefox`、`Safari`、`Edge` 或 `Google Chrome`。学习资料通常通过浏览器来访问。除了浏览器之外，你还需要一些额外的软件。


    ## Microsoft 365


    `Microsoft Office` 是学校和组织机构使用的行业标准应用。它允许你使用其广受欢迎的程序，如 `Word`、`PowerPoint` 和 `Excel`，来创建文档、演示文稿、电子表格等。它还包含用于电子邮件的
    `Microsoft Outlook` 和用于云端存储需求的 `OneNote`。对于中小学、高等院校的学生以及使用以 `.edu` 结尾的电子邮件地址的教育工作者，可以从微软官方网站免费下载
    `Microsoft 365`（图 2-1）。订阅信息可在微软官网上找到。


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig1_HTML.jpg](img/501049_1_En_2_Fig1_HTML.jpg)


    图 2-1


    Microsoft 365 的微软官网


    此外，`Microsoft 365` 和 `Google Docs` 的应用在 `Apple App Store` 和 `Google Play Store`
    上也是免费提供的。许多基于云的应用程序使得在电脑和移动设备上使用这些应用变得更加容易。然而，如果没有付费订阅 `Microsoft 365`，其功能是受限的。


    ## 杀毒软件


    由于你将要在网上工作并上传、下载文件，因此最好在你的电脑或移动设备上安装杀毒软件。杀毒软件可以保护你的电脑免受病毒和其他可能感染并损害你电脑或移动设备的威胁。一旦安装杀毒软件，应对其进行设置，使其能自动更新，以保护你的电脑或设备免受每日出现的新型威胁。一些既提供免费选项也提供付费选项的流行杀毒软件包括：


    *   `Avast` – [`www.avast.com`](http://www.avast.com)

    *   `AVG` – [`www.avg.com`](http://www.avg.com)


    其他流行的付费杀毒软件选项包括：


    *   `McAfee` – [`www.mcafee.com`](http://www.mcafee.com)

    *   `Norton` – [`www.norton.com`](http://www.norton.com)


    ## PDF 阅读器


    `PDF` 是网络上使用的标准文档格式。只要安装了诸如 `Adobe Acrobat Reader` 之类的程序，就可以在所有设备上查看 PDF 文件。`Adobe
    Acrobat Reader` 是查看 PDF 文件的行业标准，可从 Adobe 官网免费下载（图 2-2）。


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig2_HTML.jpg](img/501049_1_En_2_Fig2_HTML.jpg)


    图 2-2


    `Adobe Acrobat Reader` 可从 Adobe 官网免费下载：[`​get.​adobe.​com/​reader/`](https://get.adobe.com/reader/)


    ## 云端存储


    由于在线学习提供了随时随地工作的灵活性，你需要能够从任何地方、任何设备访问你的文件。云端存储也可用于备份重要文件。一些流行的云端存储选项包括：


    *   `Microsoft OneDrive`（随`Microsoft Office 365`附送）

    *   `Dropbox` – [`www.dropbox.com`](http://www.dropbox.com)

    *   `Google Drive` – [`www.google.com/drive/`](http://www.google.com/drive/)


    ## 图形设计软件


    除了你常用的软件需求外，你可能还需要图形设计软件来为视频、网站、摄影等创建图形。为满足你的图形设计需求，`Adobe Creative Cloud` 包含了如
    `Photoshop` 和 `InDesign` 等业界标准应用，可在 [`www.adobe.com`](http://www.adobe.com) 获取。它提供了满足你创意需求的桌面和移动应用。你可以按月或按年订阅单独的应用或所有
    Adobe 应用。拥有有效资格证明（如学生证或学校邮箱）的教师和学生可在购买时享受折扣。


    尽管 `Adobe Creative Suite` 非常适合图形设计，但它可能价格不菲。一些免费且开源的图形设计软件包括：


    *   `Gimp` – [`www.gimp.org`](http://www.gimp.org)

    *   `Canva` – [`www.canva.com`](http://www.canva.com)

    '
- fmt: '# Internet Connection


    Without an Internet connection, online learning cannot occur. Today’s smartphones
    and mobile devices such as iPads can serve as personal hotspots for Internet access,
    but the speed is not always comparable to Internet connection speeds in our homes,
    libraries, or restaurants. Before Covid-19, local libraries and restaurants could
    be visited to use the Internet for free. However, many closed their doors for
    safety reasons during the pandemic. In many communities and rural areas, the Digital
    Divide exists where high-speed Internet or broadband Internet is neither available
    nor affordable. As a result, many are left without Internet access.


    Since today’s online learning consists of multimedia and other resources, a high-speed
    Internet connection is required. According to [`www.reviews.org`](https://www.reviews.org),
    a high-speed Internet connection is one in which the download speed is of a minimum
    of 25 Mbps.^([⁶](#fn6)) The number of US households with high-speed Internet has
    increased from 65% in 2018 to 73% in 2019.^([⁷](#fn7))


    # Accessories


    Now that you know your core hardware and software requirements needs, there are
    some necessary accessories you will want to purchase. These accessories will allow
    for a better online learning experience.


    ## Headset with Microphone


    Depending on your environment, it is always a good idea to have a headset with
    a microphone. A headset allows you to review multimedia content privately without
    relying on your device’s speakers. You also will not disturb others around you.
    For learning activities that require you to use your voice, a headset with noise
    cancelling microphone is a good investment. It can filter out background noise
    and allow your audience to hear you loudly and clearly. Most computers and mobile
    devices are equipped with internal microphones. However, they are directional
    and pick up all background noise in a room rather than filtering or reducing it.
    They also do not provide good voice quality compared to external microphones.


    An external headset with noise cancelling microphone is not expensive. It averages
    around $40 but increases in price based on the noise cancelling level. Whatever
    headset you select, pay attention to whether it uses a USB, lightning port, or
    3.5mm plug for your device (Figure [2-3](#501049_1_En_2_Chapter.xhtml#Fig3)).


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig3_HTML.jpg](images/501049_1_En_2_Chapter/501049_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    USB headset for computers for online learning available from Amazon.com


    For iPhone users, Apple’s EarPods with lightning connector is also another option
    (Figure [2-4](#501049_1_En_2_Chapter.xhtml#Fig4)). It also has a 3.5mm adapter
    option which can also be used on computers, and on later model iPhones and iPads
    as well as other mobile devices. Most smartphones come with headphones with a
    microphone that can be used until you find a replacement. Although the Apple EarPods
    have a microphone, they do not provide noise cancelling.


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig4_HTML.jpg](images/501049_1_En_2_Chapter/501049_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Apple’s EarPod headset option for online learning


    ## Webcam


    Although a webcam is optional for some online learning, it is a nice complement.
    Most computers and mobile devices come equipped with a webcam. For learners, it
    brings a face-to-face component of traditional learning to the online classroom.
    For educators, a webcam provides many benefits. First, it allows educators to
    record their course content and share it within the virtual classroom. The content
    can also be repurposed and shared on various social media platforms. A webcam
    lets educators make a personal connection with their learners. When learners can
    put a face with a name, it can relieve some of the isolation and anxiety of online
    learning.


    If you do not have a webcam, your mobile device’s camera will work. Most mobile
    device cameras have a high resolution that can not only take great pictures but
    also record videos. For example, the newer iPhones after iPhone 7 have superior
    cameras that can be used to not only take pictures but also create videos. The
    same goes for the new model iPads. If you use either of these, you will need to
    purchase a tripod to hold the device steady.


    # Summary


    As we have seen, the technology equipment needs for online learning are minimal.
    Many of these items you probably already have, which saves you time and money.
    It also helps to resolve some of the myths you might had heard about getting started
    with online learning. Trying anything for the first time can seem like a daunting
    task, but you can do it. With the right equipment, your journey can begin with
    a positive start. In the next chapter, you will explore how to successfully plan
    for your online learning journey. As the old adage goes, “If you fail to plan,
    you plan to fail.” You will have a plan.


    Footnotes [1](#501049_1_En_2_Chapter.xhtml#Fn1_source) [2](#501049_1_En_2_Chapter.xhtml#Fn2_source)


    # 3. Planning for Online Learning


    In the previous chapter, we explored the online learning technology needs for
    students and educators. Without the proper technology, educators and students
    can experience unnecessary frustrations that could have been prevented. Although
    technology is at the heart of the online learning experience, other critical components
    are involved. Planning helps educators utilize the various online learning technology
    components to create the optimal learning experience for learners.


    Planning involves looking at the bigger picture and determining what individual
    pieces of the online learning environment will work together to benefit learners.
    Without a well-thought-out plan of how all the pieces work together, online learning
    can be difficult and not produce the desired outcomes for educators and students.
    As the old adage goes, “*If you fail to plan, you plan to fail*.” A detailed plan
    can be the difference between success and failure. Before you can devise a plan,
    you must determine your purpose.


    ## Purpose


    Having a clear purpose keeps you focused on your goal. In traditional learning,
    many educators utilize a lesson plan to structure their days and keep them focused.
    Although the learning environment is different due to Covid-19, the method is
    still the same. You must have a plan and a purpose. Purpose fuels your drive and
    drives your day. Throughout a typical learning day, you will be pulled in different
    directions, so having a clearly defined purpose reduces your chances of becoming
    distracted. Online learning is not easy for educators or students particularly
    during a pandemic. It is unchartered territory that everyone is learning to navigate
    daily. Having a clear purpose provides a road map that you can follow to keep
    you on track or adjust as needed. Some possible questions to ask yourself to determine
    your purpose include:


    - What outcomes do you want to accomplish?

    - Why are you teaching online?

    - Why is online teaching important to you?

    - What do you hope to accomplish through online learning?


    Once you answer these questions, you should jot them down either in a journal
    or on your favorite note-taking mobile app such as `Evernote` or `Microsoft OneNote`
    to periodically review. They will serve as your daily motivation. Now that you
    are clear on your purpose, there are some other factors you should consider.'
  raw: '### Internet Connection


    Without an Internet connection, online learning cannot occur. Today’s smartphones
    and mobile devices such as iPads can serve as personal hotspots for Internet access,
    but the speed is not always comparable to Internet connection speeds in our homes,
    libraries, or restaurants. Before Covid-19, local libraries and restaurants could
    be visited to use the Internet for free. However, many closed their doors for
    safety reasons during the pandemic. In many communities and rural areas, the Digital
    Divide exists where high-speed Internet or broadband Internet is neither available
    nor affordable. As a result, many are left without Internet access.


    Since today’s online learning consists of multimedia and other resources, a high-speed
    Internet connection is required. According to [`www.reviews.org`](https://www.reviews.org),
    a high-speed Internet connection is one in which the download speed is of a minimum
    of 25 Mbps.^([⁶](#fn6)) The number of US households with high-speed Internet has
    increased from 65% in 2018 to 73% in 2019.^([⁷](#fn7))


    ### Accessories


    Now that you know your core hardware and software requirements needs, there are
    some necessary accessories you will want to purchase. These accessories will allow
    for a better online learning experience.


    ### Headset with Microphone


    Depending on your environment, it is always a good idea to have a headset with
    a microphone. A headset allows you to review multimedia content privately without
    relying on your device’s speakers. You also will not disturb others around you.
    For learning activities that require you to use your voice, a headset with noise
    cancelling microphone is a good investment. It can filter out background noise
    and allow your audience to hear you loudly and clearly. Most computers and mobile
    devices are equipped with internal microphones. However, they are directional
    and pick up all background noise in a room rather than filtering or reducing it.
    They also do not provide good voice quality compared to external microphones.


    An external headset with noise cancelling microphone is not expensive. It averages
    around $40 but increases in price based on the noise cancelling level. Whatever
    headset you select, pay attention to whether it uses a USB, lightning port, or
    3.5mm plug for your device (Figure [2-3](#501049_1_En_2_Chapter.xhtml#Fig3)).


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig3_HTML.jpg](images/501049_1_En_2_Chapter/501049_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    USB headset for computers for online learning available from Amazon.com


    For iPhone users, Apple’s EarPods with lightning connector is also another option
    (Figure [2-4](#501049_1_En_2_Chapter.xhtml#Fig4)). It also has a 3.5mm adapter
    option which can also be used on computers, and on later model iPhones and iPads
    as well as other mobile devices. Most smartphones come with headphones with a
    microphone that can be used until you find a replacement. Although the Apple EarPods
    have a microphone, they do not provide noise cancelling.


    ![../images/501049_1_En_2_Chapter/501049_1_En_2_Fig4_HTML.jpg](images/501049_1_En_2_Chapter/501049_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Apple’s EarPod headset option for online learning


