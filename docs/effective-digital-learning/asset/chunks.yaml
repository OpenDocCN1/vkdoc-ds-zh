    (Figure [4-2](#501049_1_En_4_Chapter.xhtml#Fig2)). An accessibility accommodation
    example is including captions and transcripts within videos for learners with
    visual impairments that utilize screen readers. Failing to consider these learners
    when creating your content could potentially exclude them from your online learning
    experience.


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig2_HTML.jpg](images/501049_1_En_4_Chapter/501049_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    The W3C provides information about making website content accessible


    Content should also be scannable. Most people do not like to read long paragraphs
    of text along with long sentences on any sized screen. It can be intimidating.
    Using bullets is a good technique to make content scannable. Utilizing white space
    between paragraphs is another way to make scannable content.


    ## Content Purpose


    As an educator, you know your subject better than anyone. You are the primary
    content creator and subject matter expert and know which learning materials will
    work or not. New learning resources are released all the time. Depending on your
    budget and available resources, you might be tempted to purchase some of these.
    Although they might supplement your content, you have some important decisions
    to make. For instance, many of these materials can range in price from free to
    expensive. Regardless of their price, learning materials must serve a primary
    purpose: facilitate student learning. Content and materials that provide the latest
    bells and whistles might look great, but you must be willing to ask yourself the
    following questions:


    *   Will it help students understand the material better?


    *   Will it encourage students to use their critical thinking skills?


    *   Will it add value to the content as well as students?


    Considering content without considering learners would be like painting in the
    dark. You will get the paint on the walls, but it will not look good when you
    turn on the lights. Never lose sight of the primary purpose of your content.'
  trans: '

    # 社交媒体支持


    有时，在线学习会让人感到孤立无援。但这并非必然。有许多在线群组可以加入，以获得在线教学环境的协助。例如，Facebook 上有许多群组和主页可以加入或关注，以获取关于在线学习的新见解和资源。同样，你也可以与其他在线教育者建立联系。你可能会想关注的一些
    Facebook 主页包括：


    -   Global Online Academy

    -   TED-Ed

    -   Global Educator Collective

    -   edX

    -   Khan Academy


    你可能想加入的 Facebook 群组包括：


    -   Digital Resources for Distance Learning

    -   Distance Learning Educators

    -   Online Teaching Strategies for Educators


    LinkedIn 是另一个不错的社交媒体资源，它提供了可以加入的群组，不仅能建立人脉，还能学习新的在线学习策略。


    # 自我关怀


    教育工作者往往将学生的需求置于自身需求之上。对于在线学习，你很容易在电脑或移动设备上投入比传统面对面教学更多的时间。有时候，你必须稍微“自私”一点。务必牢记那句老话：“你不能从空杯里倒水出来。”照顾好自己，安排一些时间进行自我关怀，以便充电和重整旗鼓。否则，你很快就会感到精力耗竭。一些简单的自我关怀建议包括：


    -   安排每日锻炼，例如散步或瑜伽

    -   设定固定的工作时间

    -   健康饮食

    -   多喝水

    -   保证充足休息

    -   在一天中适时休息


    # 总结


    在线学习不仅仅是技术问题。你必须有一个深思熟虑的计划作为你的路线图。然而，你也需要根据需要调整计划。罗伯特·伯恩斯在《致小鼠》中的一句话概括了你应如何看待计划：*老鼠和人的最佳计划往往落空*。


    无论一个项目规划得多么周密，总可能出岔子。要灵活变通。


    # 4. 内容为王


    在第三章中，你了解了规划的重要性及其在在线学习体验中的作用。规划为教育者和学习者双方取得良好成果奠定了基础。然而，它并不能总是保证积极的教学成果。新冠（Covid-19）等意外情况会发生，因此必须制定应急方案。不过，规划确实有助于以积极的方式开启在线学习之旅。充分理解了规划过程后，你就可以开始构思和规划你的在线学习内容了。


    我们都听过“内容为王”这个说法，而在在线学习领域，这一点尤为确切。由于在线学习不像传统学习那样有实体教师和教室，因此内容必须经过精心规划和设计。根据质量和交付方式，内容可以成就或毁掉一次在线学习体验。它还必须由许多不同的学习组件构成。否则，它可能无法带来预期的益处，从而导致失败。


    ## 内容基础


    内容是在线学习体验的核心。它包含学习者在指定路径上完成的学习目标和成果。在学习主题的过程中，学习者与内容进行交互。在学术界，传统学习和在线学习通常遵循某种教学法。韦氏词典将教学法定义为“教学的艺术、科学或专业”。教学法与内容协同作用，以实现学习目标和目的。


    许多不同的内容元素被用于实现在线学习教学法。以往，将书面讲义插入学习管理系统或发布在指定网站上，再辅以电子书，是传递在线课程内容的主要方法。除了测验和考试，几乎没有方法可以分析学习材料是否有效。随着技术创新和创造性思维的发展，内容创作已经大大演变。书面讲义现在与以下内容相结合：


    -   视频

    -   播客

    -   网络文章

    -   博客文章

    -   幻灯片（PowerPoints）

    -   Prezis


    如今，内容的组织不仅旨在促进批判性和分析性思维，也旨在促进学习者的参与。在接下来的章节中，你将探索特定的应用程序和应用，以帮助你创建各种类型的内容。


    尽管内容可以有多种形式，但其关注点必须始终将学习者及其需求放在首位。学习者是在线学习等式中最重要的利益相关者。在创建任何内容之前，都应始终考虑学习者及其学习风格（图
    4-1）。


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig1_HTML.jpg](img/501049_1_En_4_Fig1_HTML.jpg)


    图 4-1. 学习者的四种学习类型


    不幸的是，不存在一种适用于所有学习者的“一刀切”内容。并非所有学习者的学习方式都相同。例如，一些学习者有听力或视力障碍等残疾，需要无障碍便利措施（图 4-2）。无障碍便利措施的一个例子是在视频中包含字幕和文字记录，以方便使用屏幕阅读器的视力障碍学习者。在创建内容时未能考虑这些学习者，可能会将他们排除在你的在线学习体验之外。


    ![../images/501049_1_En_4_Chapter/501049_1_En_4_Fig2_HTML.jpg](img/501049_1_En_4_Fig2_HTML.jpg)


    图 4-2. W3C 提供了关于使网站内容可访问的信息


    内容还应该是易于快速浏览的。大多数人不喜欢在任何尺寸的屏幕上阅读长篇大段的文字和长句。这可能会让人望而生畏。使用项目符号是使内容易于浏览的好方法。在段落之间利用空白区域是使内容易于浏览的另一种方法。


    ## 内容的目的


    作为一名教育工作者，你比任何人都更了解你的学科。你是主要的内容创作者和学科专家，知道哪些学习材料有效或无效。新的学习资源层出不穷。根据你的预算和可用资源，你可能忍不住想购买其中一些。尽管它们可能补充你的内容，但你需要做出一些重要决定。例如，这些材料的价格范围从免费到昂贵不等。无论价格如何，学习材料必须服务于一个主要目的：促进学生学习。那些提供最新花哨功能的内容和材料可能看起来很棒，但你必须愿意问自己以下问题：


    -   它是否有助于学生更好地理解材料？

    -   它是否会鼓励学生运用他们的批判性思维技能？

    -   它是否会为内容以及学生增加价值？


    不考虑学习者而考虑内容，就如同在黑暗中作画。你确实会把颜料涂到墙上，但当打开灯时，效果却不会好看。切勿忽视你内容的主要目的。

