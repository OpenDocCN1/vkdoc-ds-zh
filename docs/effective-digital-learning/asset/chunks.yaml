- fmt: '# Social Media Groups


    Many social media networks such as `Facebook` and `LinkedIn` allow users to create
    groups. These groups can be public or private and be considered similar to an
    online meetup. As long as a group does not violate the social media platform’s
    term of use policy, a group can be created. A group’s permissions and rules are
    established at creation to determine who can join and what he or she is allowed
    to do to remain a group member. Similar to `Facebook Pages`, most social media
    groups require that you already have a personal profile or account. For example,
    by creating a `Facebook Group`, members can participate in the following:


    - Create and respond to posts

    - View pre-recorded and live videos

    - Participate in a `Watch Party`

    - Ask for recommendations

    - Take polls

    - View photos


    Within a `Facebook Group`, you can also conduct events to gain more exposure.
    For instance, you could conduct a `Facebook Live` event on a course topic or have
    guest speakers that are available only to your group members. You could also add
    the event to the `Facebook Event Calendar` for other `Facebook` users to discover.


    `LinkedIn` is another social media platform that also allows its users to create
    groups and invite members to join (Figure [9-2](#501049_1_En_9_Chapter.xhtml#Fig2)).
    Similar to `Facebook Groups`, users can perform some of the same functions. These
    groups are a good way to promote your course material, events, and expertise.


    ![../images/501049_1_En_9_Chapter/501049_1_En_9_Fig2_HTML.jpg](images/501049_1_En_9_Chapter/501049_1_En_9_Fig2_HTML.jpg)


    Figure 9-2: Creating `LinkedIn Groups` is another way to use social media to engage
    learners


    ## Direct Message (DM)


    Many social media networks have built-in messaging communication known as direct
    messaging, or “DM” for short. Similar to a text message, these direct messages
    allow users to send messages to people they know or do not know while on social
    media platforms. This could be another way for learners to connect with educators.
    For example, `Facebook` uses `Facebook Messenger` to allow its users to send other
    `Facebook` users messages. However, each user must use `Facebook Messenger` for
    it to be effective. Likewise, `Twitter`, `LinkedIn`, and `Instagram` also allow
    users to send other users messages. What does this mean for you? Learners can
    reach out to you via direct messages. They can also attach videos, photos, links,
    and other items to their messages to get help. However, you must be cautious of
    what you click on to prevent viruses and malware from infecting your devices.
    Malware can easily be disguised within links, so please be vigilant and attentive
    as you receive links from students. It is a good practice to have antivirus or
    malware software installed and frequently updated. `Staysafeonline.org` provides
    advice on how to stay safe while on social media.


    ## Facebook Rooms


    A new `Facebook` feature that could be helpful in online learning is `Facebook
    Messenger Rooms`. Similar to `Zoom`, `Facebook Messenger Rooms` can be used to
    invite up to 50 `Facebook` users and non-`Facebook` users to a video chat without
    a time limit. `Messenger Rooms` can be created either in `Facebook Messenger`
    or `Facebook`. Once a `Facebook Messenger Room` is created, `Facebook` provides
    a URL for your `Messenger Room` which can be shared on other social media networks.
    With the `Covid-19` pandemic, educators and learners have another way to connect
    while physically apart. However, be aware that the security for `Messenger Rooms`
    is not end-to-end encrypted, so be careful what material you share.


    ## Social Media Live Events


    Social media networks such as `Facebook` and `Instagram` allow users to create
    live events. Live events allow users to broadcast their video immediately or at
    a scheduled time for other users to view. For `Instagram` users, videos and `Instagram
    TV (IGTV)` videos can be scheduled for business accounts through `Facebook’s Creator
    Studio`. `Facebook Live Events` can be downloaded once completed and uploaded
    to `YouTube` for additional exposure. Live events are available to everyone, so
    you want to be mindful of the information you share.


    ## Summary


    With careful planning and research, social media can be incorporated into online
    learning to increase not only learners’ understanding but also engagement. Many
    tools are available that can help educators meet and greet learners where they
    are. However, educators must know which social networks will provide the best
    impact for their learners. Social media has become an essential part of our lives,
    and we must embrace it. Otherwise, we will miss potential opportunities to connect,
    share, and collaborate with others no matter where they are located.


    Footnotes [1](#501049_1_En_9_Chapter.xhtml#Fn1_source)


    # 10. Blogs


    As you learned in Chapter [9](#501049_1_En_9_Chapter.xhtml), social media can
    play a pivotal role in online learning. It provides various channels for educators
    and learners to connect and engage with the course content. Educators can harness
    the power of social media to help learners bridge the gap between theory and real-world
    application.


    As technology continues to advance, more tools will become available for educators
    and learners to use in the online learning environment. These tools will reduce
    some of the isolation that many online learners experience compared to traditional
    learning. Blogs are one of those tools currently available but sometimes forgotten.


    ## Blog Basics


    Before social media existed, there were blogs. What are blogs? `Dictionary.com`
    defines a blog as a “website containing a writer’s or group of writers’ own experiences,
    observations, opinions, etc., and often having images and links to other websites.”
    The first blog was created in 1994 by `Justin Hall`, a `Swarthmore College` student,
    on a blogging platform called `Links.net`.^([^(22)](#fn22)) `Justin`’s blog was
    called `Justin’s Links from the Underground` and provided one of the first guided
    tours of the Web along with details of his personal life. Previously, blogs such
    as `Justin`’s were considered the norm in which they were only electronic personal
    diaries created by one person to share their thoughts and feelings. Over the years,
    they have evolved. Today, there are more than 500 million blogs on the Internet.^([^(23)](#fn23))


    Today, blogs exist on numerous topics for any audience. These blogs can have one
    or multiple content creators called bloggers with blog posts consisting of text
    or multimedia. The blog posts are typically organized in chronological order with
    the most recent post appearing first. Some of the popular platforms used to create
    free and paid blogs include:


    - `WordPress`

    - `Squarespace`

    - `Blogger`

    - `Tumblr`

    - `LiveJournal`


    Blog directories are available to help locate blogs that might interest you and
    your learners. They allow for easy searching and are typically organized by categories.
    One popular blog directory is the `Best of the Web Blogs` ([`https://blogs.botw.org`](https://blogs.botw.org))
    (Figure [10-1](#501049_1_En_10_Chapter.xhtml#Fig1)).


    ![../images/501049_1_En_10_Chapter/501049_1_En_10_Fig1_HTML.jpg](images/501049_1_En_10_Chapter/501049_1_En_10_Fig1_HTML.jpg)


    Figure 10-1: A listing of blogs on the Web available from [`https://​blogs.​botw.​org/​`](https://blogs.botw.org/)


    Another resource for locating blogs is [`www.blogarama.com`](http://www.blogarama.com)
    (Figure [10-2](#501049_1_En_10_Chapter.xhtml#Fig2)). `Blogarama.com` provides
    a listing of over 100,000 blogs on the Web through its easy-to-use search feature.
    Depending on your topic, you can find a blog to share with your learners and encourage
    online discussions. You can also find blogs by searching on `Google.com`.


    ![../images/501049_1_En_10_Chapter/501049_1_En_10_Fig2_HTML.jpg](images/501049_1_En_10_Chapter/501049_1_En_10_Fig2_HTML.jpg)


    Figure 10-2: Search for blogs on `Blogarama.com`'
