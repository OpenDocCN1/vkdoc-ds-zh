    ### Whiteboards


    Most webinar platforms provide a whiteboard feature that resembles those found
    in traditional in-person classrooms. In an online environment, a whiteboard can
    be used to illustrate difficult concepts. For instance, you could use the whiteboard
    to show students how to solve a math problem. You could also diagram a process
    to make it easier for students to understand. It can also be used for brainstorming
    ideas. Like traditional learning, you could call on a student and allow them to
    provide the answer on the whiteboard. All of this helps to increase student engagement
    and positive course outcomes.


    ### Breakout Rooms


    In traditional learning, teachers can divide students into groups for group work.
    Group work supports students not only to work together but also be open to others’
    points of view. The same concept can be applied within a webinar. For instance,
    Zoom allows you to either manually or automatically assign students to groups
    referred to as breakout rooms. Zoom participants can also choose to join a breakout
    room. These breakout rooms can be created when scheduling a meeting or during
    the meeting. While in these breakout rooms, they can collaborate on their assignment
    while you monitor each of the breakout rooms. Once their time is up, you can bring
    everyone back to the main webinar together for discussion. Breakout rooms can
    provide opportunities for socialization and interaction that many students and
    teachers need in a virtual environment. However, in Zoom, breakout rooms are only
    available for paid plans. Microsoft Teams offers a similar concept.


    ### Questions and Answers (Q&A)


    Students like to ask questions, so why not let them? Within your webinar, you
    can allow students to do so. Many webinar platforms such as Zoom provide a raise
    hand button that students can click to let you know that they have a question.
    Once you acknowledge them, you can either ask them to hold the question until
    the end of the webinar or unmute one student’s microphone at a time to speak.
    You can also encourage students to type their questions in the chatroom. However,
    you want to make sure that you are monitoring the chat so you do not miss any
    questions that might arise.


    ### Videos


    Sharing a video about your course material in your webinar is another way to connect
    with students and keep them engaged. You can share a video from your computer
    or YouTube to help students understand the course material. Be careful not to
    select a long video. Remember that your students have short attention spans, so
    keep the video under 2 minutes. You also want to make sure that the video is engaging
    and provides closed captioning. Since your Internet speed affects the video’s
    playback speed, it is a good practice to test your Internet connection speed with
    [`www.speedtest.org`](http://www.speedtest.org) before any online meeting and
    webinar.


    ### Gamification


    Regardless of age, everyone loves games. Remember the Angry Birds and Candy Crush
    craze? Games are fun and relieve stress. They are also educational. Why not keep
    your students engaged by incorporating games that supplement your lesson into
    your webinar? You can create games such as Family Feud or Jeopardy by using PowerPoint
    templates available on the Web. You can also find free games online that can be
    used during your webinar session. Once you select your games, you can assign your
    students to teams or have your students play against other students online. Likewise,
    you can also include digital badges with tools such as [`www.accredible.com`](http://www.accredible.com)
    to celebrate your student’s success. Some good sources for online games include


    *   Quizlet.com


    *   Quizzizz.com


    *   American Museum of Natural History – [`www.amnh.org/explore/ology/games`](http://www.amnh.org/explore/ology/games)'
