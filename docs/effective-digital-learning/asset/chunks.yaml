  trans: '

    # 嘉宾出演


    为了推广您的专业知识和在线课程，请寻找在各种媒体平台担任嘉宾的机会。例如，您可以联系一些与您的在线课程主题相符的`BlogTalkRadio`主持人或播客主，申请成为嘉宾。这样一来，您不仅为主持人提供了内容，还能将营销范围扩展到他们的听众群体。同样，您将获得免费宣传，因为主持人会在其节目页面和社交媒体网络上推广您。这种推广可以包含您的形象照片、个人简介、网站链接、社交媒体链接等。此外，您还可以在节目播出前后，在自己的社交媒体网络和网站上对这次嘉宾出演进行宣传。


    在网络研讨会上担任嘉宾是推广您专业知识和在线课程的另一种方式。由于新冠疫情实施社交隔离后，每个人都在举办网络研讨会并寻找嘉宾。为什么您不试试呢？为什么不去寻找一些正在举办与您专业领域相关主题网络研讨会的公司，并请求成为嘉宾呢？他们最多只会拒绝而已。一旦您成为网络研讨会的嘉宾或小组成员，且研讨会结束后，您就获得了一份录像，可以将其添加到媒体资料库中，帮助您推销自己和在线课程。别忘了，您还可以使用`Zoom`等工具创建自己的网络研讨会，录制自己讲授某个主题的过程，并将录像保存下来，以便在您的任何社交媒体平台上分享。


    ## 网站/博客


    如果您拥有网站或博客，那便是推销自己和专业知识的最佳场所。如果您还没有网站或博客，第 10 章可以帮助您入门。无论如何，拥有其中一个或两者都很重要。由于这些平台归您所有，您可以随时更新新内容。例如，您可以在网站或博客上创建一个媒体专区页面，链接到您过往所有的嘉宾出演记录。当您寻找新的嘉宾出演机会时，可以将此页面作为您的作品集，向潜在播客或网络研讨会主持人展示您的才华。您还可以在社交媒体网络上分享此链接。如第
    10 章所述，您还可以根据您的专业知识撰写博文，这些博文可以轻松地在社交媒体网络上分享。


    使用社交媒体固然很好，但拥有自己的网站或博客也是个好主意。虽然社交媒体会长期存在，但有些网络曾经历过意外的宕机。对许多人来说，社交媒体网络是他们唯一的推广和销售来源。而拥有自己的网站，您就能完全控制和拥有它，可以每周
    7 天、每天 24 小时地推销自己和专业知识。别忘了利用`Google Keyword Planner`来研究关键词，这将有助于合适的访问者找到您。


    另一种网站推广技巧是使用电子邮件注册表单。您可以以新闻通讯的形式提供与您专业相关的免费信息。访问者可以提供他们的电子邮件地址来换取这份新闻通讯。`Mailchimp`（[`www.mailchimp.com`](http://www.mailchimp.com)）是一个可以帮助您实现这一点的免费资源。它很容易添加到您的网站上。同样，它还会为您提供一个可在社交媒体网络上分享的链接。通过在网站上设置电子邮件注册表单或提供可分享的链接，您正在为您的在线课程建立一个潜在客户列表，从而可以进行持续营销。


    一旦您运行了网站或博客，就必须确保经常查看其分析数据。分析数据能提供有关您网站或博客表现的深刻见解。其中包含的信息如下：


    *   访问者数量

    *   访问者的地理位置

    *   访问者停留时长

    *   访问者浏览的页面

    *   用于找到您网站的设备


    这些信息可以从您的网站或博客托管服务商处获取。另一个可以集成到您网站或博客的优秀分析工具是`Google Analytics`。`Google Analytics`是一个免费工具，能为您的网站或博客提供宝贵的见解，帮助提高其性能和营销覆盖范围。您可以通过网页浏览器或`Google
    Analytics`的 iOS 和 Android 应用来访问它。您可以访问[`https://analytics.google.com`](https://analytics.google.com)，使用您的`Google
    帐户`注册`Google Analytics`。创建账户后，点击页面底部的`管理`即可开始设置您的网站或博客。进入`管理`选项卡后，为新的网站或博客点击`创建账号`按钮（图
    13-2）。


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig2_HTML.jpg](img/501049_1_En_13_Fig2_HTML.jpg)


    **图 13-2** 为您的网站或博客设置`Google Analytics`


    您需要为您的网站设置一个`账号名称`和`资源名称`，并填写业务信息。填写完信息后，点击`创建`按钮。在继续之前，您必须接受`Google Analytics（分析）服务条款`以及`适用于与
    Google 共享数据的附加条款`。同意条款后，系统会显示一个屏幕，让您选择是要跟踪应用还是网站。您需要选择网站（图 13-3）。


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig3_HTML.jpg](img/501049_1_En_13_Fig3_HTML.jpg)


    **图 13-3** 在`Google Analytics`中选择您的数据流


    选择网站选项后，您可以提供您的网站地址。提供网站后，您将收到一段代码，需要将其复制到您想要衡量的每个 HTML 网页的`<head>`部分中（图 13-4）。


    ![../images/501049_1_En_13_Chapter/501049_1_En_13_Fig4_HTML.jpg](img/501049_1_En_13_Fig4_HTML.jpg)


    **图 13-4** 用于插入网页进行跟踪的全局网站标签代码


    如果这看起来令人困惑，不必担心。`Google Analytics`中提供了教程和其他帮助资源，可以帮您入门。设置完成后，您可以通过网页浏览器或`Google
    Analytics`移动应用查看您网站的`Google Analytics`数据。同样，您可以对网站进行修改以扩大其营销覆盖范围。最后，您随时可以在`Google
    Analytics`中调整要衡量的网站信息。


    ## 播客


    如第 8 章所述，播客不仅是一种很好的在线学习工具，也是一种很好的营销工具。您不仅可以推广您的专业知识，还可以推销自己。例如，在播客的开场介绍中，您可以向订阅者提供任何即将推出的在线课程、嘉宾出演以及其它活动的信息。您也可以在播客的结尾提醒订阅者相同的信息。由于您是创作者，您控制着每一集的内容及其发布时间表。务必在您的社交媒体网络上发布您的播客剧集，并将播客播放器嵌入到您的网站上。不知道如何操作？您的播客托管服务商会为您提供相关信息。与您的网站一样，不要忘记经常查看您的统计数据。

    '
- fmt: '# Summary


    To be effective at marketing yourself and your online courses, you must clearly
    identify your target audience. Once you have your target audience, you can create
    your marketing strategy or marketing plan to effectively reach them. As you are
    working your marketing plan, remember that marketing must be done often and consistently
    to be effective and see results. Furthermore, you must measure your marketing
    efforts and make any necessary adjustments to improve your marketing reach. Always
    remember that there is no silver bullet to marketing. You must continue to fire
    your bullets in the right places to hit your target.


    Footnotes [1](#501049_1_En_13_Chapter.xhtml#Fn1_source) [2](#501049_1_En_13_Chapter.xhtml#Fn2_source)
    [3](#501049_1_En_13_Chapter.xhtml#Fn3_source)


    # Before You Go


    In Chapter [13](#501049_1_En_13_Chapter.xhtml), you explored the various ways
    to not only market your courses but also market yourself. It is up to you to let
    the world know who you are, along with your expertise. Contrary to what people
    think, nothing happens by chance. Newton’s Third Law of Motion says it this way:
    *For every action, there is an equal and opposite reaction*. You provide the action
    through various methods. Unfortunately, those that discover you might never take
    a course. However, they can still help spread the word about you.


    There is no better time than the present to start prioritizing your marketing
    efforts. You are your biggest marketer. It can make the difference between being
    discovered or not. With social media, it has become easier to spark people’s interests
    and spread the word about yourself. Next, your students are also one of your most
    prominent marketers. They have experienced your courses and your expertise and
    can tell others. Depending on their ages, you might need to empower their parents
    with tools to provide reviews or testimonials about you and your courses. Do not
    be afraid to solicit their help.


    ## Final Thoughts


    Being an online educator is not easy. It also is not for the faint at heart. There
    will be many long hours of prepping, teaching, tutoring, and grading. However,
    it can be rewarding. If you are transitioning to online learning from traditional
    learning due to Covid-19, you will need some time to develop your online teaching
    style and rhythm. It will not happen overnight. Go easy on yourself and give yourself
    a break. As you become more comfortable in the virtual environment, it will get
    easier. Nothing is as accurate as the saying “*Everyone was a novice before becoming
    an expert*.” The same applies to online teaching. Online learning is a marathon
    and not a sprint. However, there are some things that you can do to help yourself
    improve along the way.


    ### Professional Development


    As an educator, you never stop learning. With technology advancing at a rapid
    rate, there is always something new to learn. You must be willing to embrace it
    and incorporate it within your courses. In this information age that we currently
    live in, information is readily available at our fingertips via our mobile devices
    or voice commands with Siri or Alexa. We can easily experience information overload.
    However, it is a good idea to invest in yourself and gain new skills and resources
    to keep you marketable. Many free resources available on the Web include:


    *   `Edutopia.com`

    *   `Edweb.net`

    *   `Edu.google.com`

    *   `Edx.org`

    *   `Microsoft.com/en-us/education/remote-learning`

    *   `Udemy.com`


    Attending webinars and online conferences is another way to increase your professional
    development. During this Covid-19 pandemic, many conferences have shifted online
    and are being offered for free or at a reduced cost. Why not take advantage of
    these? If you register for a webinar or conference and cannot attend at the designated
    time, recordings are typically made available to attendees after the event.


    ### Technology


    Technology continues to evolve every day. What is hot today will be obsolete in
    a year or less. While you are investing in your professional development, it is
    also imperative that you invest in hardware and software. Mobile apps and cloud-based
    applications have quickly become the norm. As an educator, you must know how to
    use them to increase not only your efficiency but also productivity. Likewise,
    it would help if you strived to stay current on online learning technology tools
    and trends. These tools can help you improve in the online learning environment.
    Some useful podcast resources available include:


    *   Faculty Seminars in Online Teaching

    *   Level Up Your Course

    *   Online Learning Podcast

    *   The eLearning Coach

    *   The Good Practice

    *   The Online Course Coach


    ### Social Media


    In the past, you had to purchase tickets for events with some of the famous thought
    leaders to gain information and insight. Social media revolutionized this. Today,
    you have access to these same experts and thought leaders and can learn from them
    as they share their knowledge. The best part is that it is *free*! Not sure whom
    to follow? Here are some eLearning thought leaders to get you started:


    *   Julie Dirksen, author of *Design for How People Learn*

    *   Jane Bozarth, author of *eLearning Solutions on a Shoestring*

    *   David Anderson, Community Manager at Articulate

    *   Christopher Pappas, eLearning expert extraordinaire and founder of `eLearningIndustry.com`

    *   Clark Quinn, learning consultant, co-author of The Serious eLearning Manifesto


    ### Books


    Most of our great leaders are readers. The same should apply to educators. New
    books are published daily that can help you enhance your skills as an online educator.
    Many libraries offer free ebook platforms to read books on mobile devices. Likewise,
    you can create a free account at `pdfdrive.com` and add ebooks to your account
    to read. Amazon Kindle also offers free Kindle ebooks that can be read on a Kindle
    or the Kindle app. The books are out there. You must know where to look.


    ## Summary


    As you have read through the chapters of this book, I hope that you gained more
    insight as you read along than when you first started. There is so much more to
    online learning that all of it would not fit within one single book. However,
    this book is a good introduction that can help you get started. You already have
    a willingness to learn. Otherwise, you would not have purchased this book. Likewise,
    you already have what it takes to be a good teacher. Your objective is to transform
    those characteristics into the online learning environment. During these challenging
    times, it will not be easy, but it is possible. I believe in you, but the most
    critical question is: Do you believe in yourself?


    Feel free to follow and message me on social media to let me know how you enjoyed
    the book and how it helped you.


    As I close, I want to inspire you with this eLearning quote by Christopher Palm:


    > *eLearning shouldn’t be a casual joy ride on a Sunday afternoon with the cruise
    control engaged. The sole purpose of eLearning is to teach*.


    Now get online and teach!'
