    # 7. Webinars


    以有趣的方式向学习者展示主题内容以激发参与，是教学的本质。这在在线学习中尤为重要。如第 [6](#501049_1_En_6_Chapter.xhtml)
    章所述，教育工作者使用演示文稿向学习者解释特定主题，同时保持美观。它们不仅将内容组织成易于理解的部分，还引导学习者沿着预定的学习路径前进。由于有众多免费和付费的演示文稿应用可供选择，教育工作者可以以新颖的方式传递内容。


    在新冠疫情时代，演示文稿通常与网络研讨会结合使用。在在线学习环境中，学习者有时容易感觉自己像是孤岛上的唯一一人。尽管学习者和教育工作者之间可以进行沟通和协作，但他们仍需要感受到与教育工作者的联系，而不仅仅是看到教育者的头像或阅读其个人简介。在某些情况下，教育工作者会预先录制“发言者头部”视频，仅显示上半身在讲解内容。作为教育工作者，你需要另一种媒介来与学习者建立联系。这就是网络研讨会在在线学习环境中发挥作用的地方，它可以帮助弥合这一差距。


    ## The New Meeting Place


    根据`webopedia.com`的定义，网络研讨会是网络研讨会的简称，可定义为“通过网络使用*视频会议软件*进行的演示、讲座、工作坊或研讨会”。^([^(16)](#fn16))
    在新冠疫情大流行期间，网络研讨会迅速成为许多人在保持社交距离的同时安全会面的首选方式。尽管许多组织在大流行之前就已经在使用网络研讨会，但许多犹豫不决的组织也加入了网络研讨会的潮流。结果，网络研讨会的使用量猛增。组织开始使用网络研讨会与远程员工保持联系，教育工作者开始使用网络研讨会与学习者建立联系并传递课程内容。


    ## Webinar Advantages


    网络研讨会不需要人们身处在同一物理房间或地点。只要人们拥有快速的互联网连接，他们就可以在地理上位于世界任何地方参加网络研讨会。在在线学习中，网络研讨会可被视为传统学习中的现代大学演讲厅或礼堂。与传统演讲厅或礼堂相比，座位是虚拟的，出勤有时是可选的。网络研讨会在指定的时间进行。如果学习者错过了现场安排的网络研讨会，通常会提供录制版本，以便在更方便的时间观看。在传统学习中，学习者没有这个选择。除了讲座、工作坊和研讨会之外，你还可以通过提供以下内容来增强学习效果：


    - 办公时间

    - 小组讨论

    - 头脑风暴会议

    - 员工会议

    - 团队项目


    许多网络研讨会平台提供无障碍选项，例如为可能需要的学习者提供隐藏式字幕。网络研讨会是使用定制内容吸引学习者的有效方式。然而，也存在一些限制。例如，许多免费网络研讨会平台限制了会议时长和参会人数。此外，让学习者保持参与度也可能很困难。


    ## Webinar Requirements


    大多数线下活动都可以修改并通过网络研讨会进行。技术的进步使得从任何联网设备进行或参与网络研讨会变得相对容易且成本效益高。大多数笔记本电脑和移动设备已经配备了摄像头和内置麦克风，可用于网络研讨会。为了确保高质量的视频和音频，你可能希望使用高清网络摄像头和领夹式麦克风。然而，网络研讨会的主要要求之一是快速的互联网连接。没有快速的互联网连接，你和学习者可能会遇到视频和音频质量的延迟，这会影响学习体验。由于大多数网络研讨会发生在网络浏览器或网络研讨会平台的移动应用中，教育工作者和学习者可以从任何联网设备和任何地点参与。你所需要做的只是通过电子邮件或网络研讨会平台向学生发送网络研讨会邀请，或在你的学习管理系统中发布包含网络研讨会链接的公告。最后，一个干净且光线充足的背景至关重要。许多网络研讨会平台（如`Zoom`）提供虚拟背景选项，有助于呈现更专业的网络研讨会体验。'
  raw: '### Google Slides


    A free alternative to Microsoft PowerPoint is Google Slides . Google Slides can
    be used for personal and business use (a part of Google Suite for businesses)
    to create presentations. It is available on Windows, Apple computers, and Google
    Chromebooks and tablets and has a mobile app for Apple and Android mobile devices
    (Figure [6-4](#501049_1_En_6_Chapter.xhtml#Fig4)). To begin using Google Slides,
    you must have a Google Account which is free to create.


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig4_HTML.jpg](images/501049_1_En_6_Chapter/501049_1_En_6_Fig4_HTML.jpg)


    Figure 6-4


    Google Slides available from [www.​google.​com/​slides](http://www.google.com/slides)


    If you are familiar with Microsoft PowerPoint, you will have no problem adjusting
    to using Google Slides. The process of creating your presentations is the same
    as creating presentations within PowerPoint.


    ### Apple Keynote


    For Apple Mac and mobile users, the Keynote application is another presentation
    option (Figure [6-5](#501049_1_En_6_Chapter.xhtml#Fig5)). It can be installed
    for free via the App Store.


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig5_HTML.jpg](images/501049_1_En_6_Chapter/501049_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    Apple’s Keynote can be downloaded from [www.​apple.​com/​keynote/​](http://www.apple.com/keynote/)
    or the Apple App Store


    Unfortunately, if you have an older Apple Mac, you might be required to pay a
    one-time fee. Once you complete your presentation, it can be exported in one of
    the following formats:


    *   PDF


    *   PowerPoint


    *   Movie


    *   Animated GIF


    *   Images


    *   Keynote Theme


    Similar to PowerPoint, Keynote offers plenty of templates to get started. It also
    works with Apple Pencil on iPads to allow for drawings and illustrations.


    ### LibreOffice Impress


    Another presentation software application is LibreOffice Impress (Figure [6-6](#501049_1_En_6_Chapter.xhtml#Fig6)).
    LibreOffice Impress is packaged with the free LibreOffice suite. LibreOffice replaced
    OpenOffice.org and has been a solution for millions of users who could not afford
    or did not want to pay for Microsoft Office. Similar to Microsoft Office, LibreOffice
    has an extension library that contains templates to aid in your presentation design.
    Once you complete your presentation, it can be saved in many different formats
    including PowerPoint, PDF, and others.


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig6_HTML.jpg](images/501049_1_En_6_Chapter/501049_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    LibreOffice Impress presentation available for download from [www.​libreoffice.​org](http://www.libreoffice.org)


    ## Summary


    It does not matter what presentation software application you use. You must use
    what works with not only the devices you have available but also allows you to
    present your content in the best way possible to engage learners. Each presentation
    application allows you to be as creative as you like. It is up to you to think
    outside of the box.


    Footnotes [1](#501049_1_En_6_Chapter.xhtml#Fn1_source)


    # 7. Webinars


    Presenting subject matter to learners in an interesting way that ignites engagement
    is the essence of teaching. It is especially important in online learning. As
    discussed in Chapter [6](#501049_1_En_6_Chapter.xhtml), presentations are used
    by educators to explain a particular subject matter topic to learners while being
    aesthetically appealing. They also not only organize content into digestible chunks
    but also guide the learner along a predetermined learning path. With numerous
    presentation application options available for free and a fee, educators can deliver
    their content in new and refreshing ways.


    In the age of Covid-19, presentations are typically paired with webinars. In online
    learning environments, it is easy for learners to sometimes feel like they are
    the only ones on a deserted island. Although there can be communication and collaboration
    between learners and educators, they still need to feel connected to the educator
    beyond seeing the educator’s profile picture or viewing his or her biography.
    In some instances, educators pre-record a “talking head” video that only shows
    them from the waist up delivering content. As an educator, you need another medium
    to connect with learners. This is where webinars come into play in the online
    learning environment and can help bridge the gap.


    ## The New Meeting Place


    According to webopedia.com, a webinar, short for web-based seminar, can be defined
    as “a presentation, lecture, workshop or seminar that is transmitted over the
    web using *video conferencing software* .”^([^(16)](#fn16)) During the Covid-19
    pandemic, webinars have quickly become the preferred way for many to safely meet
    while practicing social distancing. Although many organizations were already using
    webinars prior to the pandemic, many that were hesitant jumped on the webinar
    bandwagon. As a result, webinar usage soared. Organizations began using webinars
    to stay connected with remote employees. Educators began using webinars to connect
    with learners and deliver course content.


    ## Webinar Advantages


    Webinars do not require people to be physically present in the same physical room
    or location. As long as people have a fast Internet connection, they can attend
    webinars while being geographically located anywhere in the world. In online learning,
    webinars can be considered the modern-day college lecture hall or auditorium from
    traditional learning. Compared to traditional lecture halls or auditoriums, seating
    is virtual, and attendance is sometimes optional. Webinars occur at designated
    times. If learners miss a live scheduled webinar, recordings are often made available
    that can be watched at a more convenient time. In traditional learning, learners
    would not have this option. In addition to lectures, workshops, and seminars,
    you can use webinars to enhance learning by providing the following:


    *   Office hours


    *   Group discussions


    *   Brainstorming sessions


    *   Staff meetings


    *   Team projects


    Many webinar platforms provide accessibility options such as closed captions for
    learners that might need it. Webinars are an effective way to engage learners
    with customized content. However, there are some limitations. For instance, many
    free webinar platforms limit the webinar duration along with the number of attendees.
    It can also be difficult to keep learners engaged.


    ## Webinar Requirements


    Most in-person functions can be modified and conducted via a webinar. Technology
    advances have made it relatively easy and cost-effective to conduct or participate
    in webinars from any Internet-connected device. Most laptops and mobile devices
    already come equipped with cameras and built-in microphones that can be used during
    a webinar. To ensure good quality video and audio, you might want to use a high-definition
    (HD) webcam and a lapel microphone. However, one of the main webinar requirements
    is a fast Internet connection. Without a fast Internet connection, you and your
    learners can experience delays in video and audio quality which can interfere
    with the learning experience. Since most webinars occur within a web browser or
    a webinar platform’s mobile app, educators and learners can participate from any
    Internet-connected device and from any location. All you would need to do is invite
    your students to the webinar via email via webinar platform or post an announcement
    in your LMS with the webinar link. Lastly, a clean and well-lighted background
    is essential. Many webinar platforms such as Zoom provide virtual background options
    that can help present a more professional webinar experience.'
  trans: '

    ### Google Slides


    Microsoft PowerPoint 的免费替代方案是`Google Slides`。`Google Slides`可用于个人和商业用途（作为 Google
    商业套件的一部分）来创建演示文稿。它可在 Windows、Apple 电脑、Google Chromebook 和平板电脑上使用，并拥有适用于 Apple
    和 Android 移动设备的移动应用（图 6-4）。要开始使用`Google Slides`，你必须拥有一个`Google`账户，该账户可以免费创建。


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig4_HTML.jpg](img/501049_1_En_6_Fig4_HTML.jpg)


    图 6-4：可从[www.google.com/slides](http://www.google.com/slides)获取`Google Slides`


    如果你熟悉`Microsoft PowerPoint`，你将毫无困难地适应使用`Google Slides`。创建演示文稿的过程与在`PowerPoint`中创建演示文稿相同。


    ### Apple Keynote


    对于 Apple Mac 和移动用户来说，`Keynote`应用程序是另一种演示文稿选择（图 6-5）。它可以通过`App Store`免费安装。


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig5_HTML.jpg](img/501049_1_En_6_Fig5_HTML.jpg)


    图 6-5：可从[www.apple.com/keynote/](http://www.apple.com/keynote/)或 Apple App Store
    下载 Apple 的`Keynote`


    不幸的是，如果你使用的是较旧的 Apple Mac，可能需要支付一次性费用。完成演示文稿后，可以将其导出为以下格式之一：


    - PDF

    - PowerPoint

    - 影片

    - 动画 GIF

    - 图像

    - Keynote 主题


    与`PowerPoint`类似，`Keynote`提供了大量模板供你入门。它还可以与 iPad 上的`Apple Pencil`配合使用，以进行绘图和插图。


    ### LibreOffice Impress


    另一款演示文稿软件是`LibreOffice Impress`（图 6-6）。`LibreOffice Impress`随免费的`LibreOffice`套件一起提供。`LibreOffice`取代了`OpenOffice.org`，并且已经成为数百万无法负担或不想支付`Microsoft
    Office`费用的用户的解决方案。与`Microsoft Office`类似，`LibreOffice`有一个扩展库，其中包含有助于设计演示文稿的模板。完成演示文稿后，可以将其保存为多种不同的格式，包括`PowerPoint`、`PDF`等。


    ![../images/501049_1_En_6_Chapter/501049_1_En_6_Fig6_HTML.jpg](img/501049_1_En_6_Fig6_HTML.jpg)


    图 6-6：可从[www.libreoffice.org](http://www.libreoffice.org)下载`LibreOffice Impress`演示文稿


    ## 总结


    你使用哪个演示文稿软件并不重要。你必须选择不仅适用于你可用设备，还能让你以最佳方式呈现内容以吸引学习者的工具。每个演示文稿应用都允许你尽情发挥创意。你需要跳出固定思维模式。


    脚注 1


    # 7. 网络研讨会


    以有趣的方式向学习者展示主题内容以激发参与，是教学的本质。这在在线学习中尤为重要。如第 6 章所述，教育工作者使用演示文稿向学习者解释特定主题，同时保持美观。它们不仅将内容组织成易于理解的部分，还引导学习者沿着预定的学习路径前进。由于有众多免费和付费的演示文稿应用可供选择，教育工作者可以以新颖的方式传递内容。


    在新冠疫情时代，演示文稿通常与网络研讨会结合使用。在在线学习环境中，学习者有时容易感觉自己像是孤岛上的唯一一人。尽管学习者和教育工作者之间可以进行沟通和协作，但他们仍需要感受到与教育工作者的联系，而不仅仅是看到教育者的头像或阅读其个人简介。在某些情况下，教育工作者会预先录制“发言者头部”视频，仅显示上半身在讲解内容。作为教育工作者，你需要另一种媒介来与学习者建立联系。这就是网络研讨会在在线学习环境中发挥作用的地方，它可以帮助弥合这一差距。


    ## 新的会议场所


    根据`webopedia.com`的定义，网络研讨会是网络研讨会的简称，可定义为“通过网络使用*视频会议软件*进行的演示、讲座、工作坊或研讨会”。^(¹⁶)
    在新冠疫情大流行期间，网络研讨会迅速成为许多人在保持社交距离的同时安全会面的首选方式。尽管许多组织在大流行之前就已经在使用网络研讨会，但许多犹豫不决的组织也加入了网络研讨会的潮流。结果，网络研讨会的使用量猛增。组织开始使用网络研讨会与远程员工保持联系，教育工作者开始使用网络研讨会与学习者建立联系并传递课程内容。


    ## 网络研讨会的优势


    网络研讨会不需要人们身处在同一物理房间或地点。只要人们拥有快速的互联网连接，他们就可以在地理上位于世界任何地方参加网络研讨会。在在线学习中，网络研讨会可被视为传统学习中的现代大学演讲厅或礼堂。与传统演讲厅或礼堂相比，座位是虚拟的，出勤有时是可选的。网络研讨会在指定的时间进行。如果学习者错过了现场安排的网络研讨会，通常会提供录制版本，以便在更方便的时间观看。在传统学习中，学习者没有这个选择。除了讲座、工作坊和研讨会之外，你还可以通过提供以下内容来增强学习效果：


    - 办公时间

    - 小组讨论

    - 头脑风暴会议

    - 员工会议

    - 团队项目


    许多网络研讨会平台提供无障碍选项，例如为可能需要的学习者提供隐藏式字幕。网络研讨会是使用定制内容吸引学习者的有效方式。然而，也存在一些限制。例如，许多免费网络研讨会平台限制了会议时长和参会人数。此外，让学习者保持参与度也可能很困难。


    ## 网络研讨会的要求


    大多数线下活动都可以修改并通过网络研讨会进行。技术的进步使得从任何联网设备进行或参与网络研讨会变得相对容易且成本效益高。大多数笔记本电脑和移动设备已经配备了摄像头和内置麦克风，可用于网络研讨会。为了确保高质量的视频和音频，你可能希望使用高清网络摄像头和领夹式麦克风。然而，网络研讨会的主要要求之一是快速的互联网连接。没有快速的互联网连接，你和学习者可能会遇到视频和音频质量的延迟，这会影响学习体验。由于大多数网络研讨会发生在网络浏览器或网络研讨会平台的移动应用中，教育工作者和学习者可以从任何联网设备和任何地点参与。你所需要做的只是通过电子邮件或网络研讨会平台向学生发送网络研讨会邀请，或在你的学习管理系统中发布包含网络研讨会链接的公告。最后，一个干净且光线充足的背景至关重要。许多网络研讨会平台（如`Zoom`）提供虚拟背景选项，有助于呈现更专业的网络研讨会体验。

