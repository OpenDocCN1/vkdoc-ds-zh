    *   Full-screen snip


    After your snip is completed, you can save it to your PC to include in your course
    materials such as lectures, documents, announcements, discussions, assignments,
    and more.


    ## Summary


    As you have seen, free does not always mean bad or inferior. With so many free
    resources available on the Web for virtual learning, it would be difficult to
    list them all in this book. Hopefully, you have seen that many of these free resources
    are comparable to their paid counterparts. Now that you know about some of these
    resources, you can start creating an exciting online learning experience that
    your learners will never forget. You also will not forget it because you will
    have saved money in the process.


    # 12. Testing Online Learning


    Chapter [11](#501049_1_En_11_Chapter.xhtml) discussed various free online resources
    to not only maximize your teaching experience but also boost student engagement.
    Some educators might view free online resources as inferior compared to paid options,
    but that is not always the case. With rising prices along with shrinking budgets
    and paychecks, some fee-based learning resources are too expensive. As a result,
    you must either research creative workaround solutions or find free alternatives.


    Once you have found your resources, familiarized yourself with them, and incorporated
    them into your course materials within your LMS, you might feel that you are finished.
    Unfortunately, you are not. You have another crucial step: testing. Despite your
    best efforts, unexpected things happen. As Murphy’s Law warns us, “*Anything that
    can go wrong will go wrong*.” Proper testing decreases the likelihood of Murphy’s
    Law.


    ## Why Testing Is Important


    In an ideal world, technology would automatically work as intended. Unfortunately,
    this is not the case particularly in online learning. As schools transitioned
    from traditional in-person learning to online learning during the Covid-19 pandemic,
    many technology issues arose. Due to increased system demand, students and educators
    were unable to access their LMSs. Many students lacked Internet service or computers
    to complete their course work. You probably have personal war stories to share
    about your experience. Although a pandemic is an extraordinary circumstance, prior
    testing still needs to be performed to anticipate and prepare for these circumstances.


    ## Types of Testing


    Testing online learning management systems is critical. Nothing is worse than
    learners encountering preventable errors at the onset or during a course. These
    preventable errors can create a bad first impression for learners that can affect
    their attitude not only toward online learning but also about you and the course.
    It is a good practice to have more than one person to perform various testing
    functions on various computers and mobile devices. However, if you do not have
    others available to assist with testing, you can still perform effective testing.
    Before we begin discussing testing, you need to be aware of the two types of testing
    you will perform in your virtual learning environment: usability and performance.'
