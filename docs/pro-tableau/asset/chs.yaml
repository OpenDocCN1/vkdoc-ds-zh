  ## 9.2 凹凸图


  `Bump charts`（凹凸图）的名称源于`bumps race`，这是一个术语，指一种每艘船试图“碰撞”前面的船并在图表中向上移动的划船比赛。`Bump
  charts`近来变得相当普遍，通常用于表示在固定时间内，给定数量的竞争实体排名的变化。


  ### 9.2.1 何时使用凹凸图？


  当需要使用一个度量值来比较两个维度时，可以使用凹凸图。凹凸图有助于显示值的排名变化，通常维度是时间，也可以是任何与分析相关的其他维度。


  要创建凹凸图，至少需要两个维度，以及零个或多个度量。有关示例凹凸图，请参见图 9-39。


