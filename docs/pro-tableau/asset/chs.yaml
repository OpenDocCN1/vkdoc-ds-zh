  ## 9.3 子弹图


  子弹图由 Stephen Few 于 2005 年发明，作为仪表盘上仪表和径向计的替代品。它们可以在很小的空间内传递大量信息。子弹图包含一个单一的定量性能指标，并与一个目标值进行比较。然而，我们可以设置不同的定性度量范围来衡量
  KPI 绩效，以判断指标是否在正轨上。它们通常将主要的定量度量显示在定性范围（例如 `"非常满意"`、`"满意"`、`"既不满意也不失望"`、`"不满意"` 和
  `"非常不满意"`）的上下文中。


  仪表图或径向计有什么问题？


  *   它们缺乏背景信息

  *   它们浪费空间

  *   它们过于简单（危险地简单！）


  另一方面，子弹图利用了我们感知和认知上的倾向。人类更擅长感知和比较长度或平行位置，而不是角度。


  这里的一个重要问题是，如果需要显示多个度量，是否应该使用多个子弹图。如果所有度量共享相同的定量量表和定性范围，答案是否定的。在这种情况下，一个单一的条形图就足够了。这将有助于将所有度量放在一起，便于比较。


  参见图 9-55 了解一个简单的子弹图。


