  \n图 8-132. 维度“细分”放置在`标记`卡片上的“形状”上\n\n## 8.9 直方图\n\n用于显示连续数据的频率分布。\n\n直方图最早由卡尔·皮尔逊于\
  \ 1891 年提出。\n\n“直方图”一词可拆分为两部分。希腊词 “histos” 意为“任何直立之物”，“gramma” 意为“绘图/书写”。\n\n###\
  \ 8.9.1 绘制直方图需要什么？\n\n第一步是决定将数值范围划分为多少个区间/组。下一步是计算落在每个区间/组内的数值个数。\n\n区间或组距可以相等或不相等。\n\
  \n通常区间是连续的、等宽的且不重叠的。\n\n如果区间大小相等，则在区间上方竖立一个矩形，其高度与频率（即落入每个区间的数值个数）成正比。如果区间大小不等，则在区间上方竖立的矩形面积与频率成正比。\n\
  \n直方图中常用的术语：\n\n- **对称分布**：对称分布是指直方图的两半互为镜像。\n- **非对称分布**：非对称分布中，直方图的两半不互为镜像。\n\
  - **偏态分布**：偏态分布是指分布的一侧尾部比另一侧更长。\n- **右偏分布**：右偏分布是指分布具有右侧尾部。\n- **左偏分布**：左偏分布是指分布具有左侧尾部。\n\
  - **单峰分布**：单峰分布是指只有一个峰的分布。\n- **双峰分布**：双峰分布是指具有两个不同峰的连续概率分布。\n- **多峰分布**：多峰分布是指具有多个峰的连续概率分布。\n\
  \n### 8.9.2 与柱状图的区别\n\n直方图表示连续数据，而柱状图用于分类数据。\n\n### 8.9.3 直方图的优点\n\n- 易于发现异常值\n\
  - 使得分数分布更容易解读\n\n### 8.9.4 绘制直方图（自定义区间大小）\n\n用于绘图的数据集：2014 年奥运会数据。该数据集包含 494 名运动员的以下列信息：\n\
  \n- 国家\n- 运动员\n- 性别\n- 年龄\n- 运动项目\n- 金牌\n- 银牌\n- 铜牌\n- 总计\n\n数据的一个子集如图 8-133 所示。\n\
  \n![A428041_1_En_8_Fig133_HTML.jpg](img/A428041_1_En_8_Fig133_HTML.jpg)\n\n图 8-133.\
  \ “奥林匹克数据集”的子集\n\n我们想要做什么？\n\n我们希望确定以下年龄段的运动员人数：\n\n- 年龄 < 25\n- 年龄 >= 25 且 <= 35\n\
  - 年龄 > 35\n\n需要什么？\n\n创建自定义区间，然后计算频率，即每个类别中的运动员人数计数。\n\n\n#### 8.9.4.1 创建直方图的步骤\n\
