  \n## 引言\n\n### 为何选择本书？\n\n数据可视化正在改变世界审视数据的方式。本书将帮助你快速有效地理解数据，以更具想象力的全新视角看待数据，从最终用户角度进行可视化，并驱使你挖掘更深层的洞见。书中涵盖的主题配合演示与图解，必将促进创造性的数据探索。本书涵盖以下内容：\n\
  \n*   从单一和多个数据源（含同构与异构）向 Tableau 导入数据\n*   Tableau 中的统计分析\n*   Tableau 与 R 语言分析的集成\n\
  *   可视化背后的概念及行业最佳实践\n\n\n\n### 本书面向哪些读者？\n\n本书的受众包括各级 IT 专业人士、负责制定 IT 战略的高管、系统管理员、数据分析师以及负责推动战略计划的决策者等。本书将助力您从新手成长为专业的可视化专家。同时，商业用户、管理学毕业生以及商业分析师也会发现本书内容饶有趣味。\n\
  \n### 本书是如何组织的？\n\n本书共包含 11 个章节。以下是各章内容预览……\n\n- **第 1 章：** 本章阐述了可视化的含义及其在商业智能和数据科学中的作用。涵盖了市场上各种可用的可视化工具。重点介绍了\
  \ Tableau 的产品线，例如 Tableau Desktop、Tableau Server、Tableau Online、Tableau Public 和\
  \ Tableau Reader。还阐释了 Tableau 中的各种文件类型，并说明了将 Tableau 工作簿保存为 `.twb` 或 `.twbx` 等格式，以及将\
  \ Tableau 数据源保存为 `.tds` 或 `.tdsx` 等格式之间的区别。\n\n- **第 2 章：** 本章旨在概述将 Tableau 连接到各种数据源的分步流程，阐明连接与混合的概念，并列举实时连接与使用数据提取之间的差异。\n\
  \n- **第 3 章：** 本章有助于将数据组织成分组和集。进一步深入探讨了分组和集之间的差异。\n\n- **第 4 章：** 本章将加深我们对度量名称和度量值的理解，以及在一个视图中显示多个度量的技术。\n\
  \n- **第 5 章：** 本章清晰地解释了计算（如移动平均值、同比增长、详细级别）的含义和重要性。这些快速表计算已结合案例场景进行讲解。\n\n- **第\
  \ 6 章：** 本章将帮助您使用字符串函数（如连接、查找、左取等）以及数值函数（阐明聚合与非聚合度量的区别）、日期函数（如 `datepart`、`datediff`、`dateadd`、`dateparse`\
  \ 等）来自定义数据。\n\n- **第 7 章：** 本章重点阐述统计学在分析中的重要性。将详细说明参考线、常量线、趋势线、摘要卡等的使用。\n\n- **第\
  \ 8 章：** 本章将使您轻松理解并使用各种图表形式，例如饼图、热图、树图、堆叠条形图、折线图、词云等，包括每种图表背后的概念、优缺点以及特定场景下的最佳图表选择等。\n\
  \n- **第 9 章：** 本章将通过高级图表形式（如瀑布图、凹凸图和子弹图（一种可视化目标阶段性进展的图表））巩固您的可视化知识。\n\n- **第 10\
  \ 章：** 本章旨在帮助学习者通过将各种报表整合到一个交互式仪表板中，编织出一个强大且富有洞察力的故事。\n\n- **第 11 章：** 本章讨论了将 R\
  \ 分析与 Tableau 集成的步骤。介绍了数据挖掘以及在 R 和 Tableau 中实现数据挖掘算法。\n\n源代码（所有演示和作业的 `.twbx` 文件）也已共享。欢迎您从\
  \ Apress 网站（`www.apress.com`）下载它们。\n\n### 如何充分利用本书？\n\n要最大化本书的价值，您可以严格遵守以下建议：\n\n\
  - 通读各章。按照演示中的分步说明动手操作。不要跳过任何演示。如有必要，可以重复操作第二遍，直到牢固掌握概念为止。\n- 加入 Tableau 社区或讨论论坛。\n\
  - 阅读 Tableau 网站（`www.Tableau.com`）上提供的客户案例，了解全球客户如何提升其可视化体验。\n- 阅读数据可视化专家（如 Stephen\
  \ Few、Edward Tufte 和 Hans Rosling 等）的博客。\n\n### 下一步是什么？\n\n我们已尽力释放 Tableau 作为数据可视化工具的强大功能，并向您介绍多种图表形式/可视化类型。我们建议您从头到尾阅读本书，但如果您不是那种喜欢逐章阅读的人，我们也尽量让各章节保持独立，以便您可以直接跳到最感兴趣的专题。无论您选择哪种方式，我们都衷心祝愿您一切顺利！\n\
  \n## 给同行讲师的一句话\n\n我们在章节顺序的安排以及每章内部主题的流程上投入了额外关注。这样做是为了帮助我们同行讲师和学者根据本书的目录来制定教学大纲。完整的目录可以作为一学期的课程大纲；如果学院已有关于商业智能或数据可视化或分析与可视化的教学大纲，也可以将部分章节加入现有大纲，使其更加充实。我们留待您自行决定如何将这些资源用于您的学生。\n\
  \n我们确保书中讨论的每个工具/组件都包含足够的动手实践内容，以便您能更好地教学，并为您的学生提供充足的动手练习机会。\n\n祝学习愉快！！！\n\n**作者：**\n\
