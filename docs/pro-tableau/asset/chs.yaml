- "# 8.7 甘特图\n\n美国工程师兼社会科学家亨利·L·甘特于 1917 年发明了**甘特图**。它在项目管理中被广泛用于项目进度的图形化表示。\n\n甘特图有助于规划、协调和跟踪项目中的具体任务。换句话说，它能帮助你快速可视化以下信息：\n\
  \n-   整个项目的开始和结束日期。\n-   整个项目的持续时间。\n-   作为项目一部分需要执行的各种任务或活动有哪些？\n-   每个任务/活动的开始和结束时间。\n\
  -   每项活动的持续时间。\n-   哪些活动存在重叠以及重叠的程度。\n\n甘特图有一个水平轴，代表项目的整个生命周期。这个时间跨度被细分为较小的增量，如月、周、天等。项目的任务则显示在垂直轴上。每个任务由一个条形表示。条形的**位置**和**长度**表示任务的开始日期、持续时间和结束日期。\n\
  \n## 8.7.1 甘特图的缺点\n\n-   它们不指示任务依赖关系。它们无法告诉我们一个或多个进度落后的任务将如何影响其他任务。\n-   它们可能是在规划阶段早期制定的。随着项目发生变化，需要不断更新甘特图。不应将其视为一成不变。\n\
  -   它们没有考虑成本因素。\n-   对于有多个里程碑且每个里程碑需要完成多个任务的大型项目来说，它们可能会变得非常复杂。\n-   如果图表超过一页，可能会难以查看。\n\
  -   条形的大小并不表示完成任务所需的工作量。\n\n### 8.7.1.1 演示 1\n\n**目标：**\n\n你是一名项目经理，负责管理三个项目（“项目\
