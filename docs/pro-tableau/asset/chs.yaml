  \n图 2-71. 放置在画布上的“Student”表和“Grade”表\n\n\n\n### 2.6.2.2 内连接\n\n`Inner Join`（内连接）基于一个公共字段，从一张表中获取所有在第二张表中存在匹配项的记录。在\
  \ Tableau 中，默认情况下，表之间使用`Inner Join`进行连接（如图 2-72 所示）。\n\n![A428041_1_En_2_Fig72_HTML.jpg](img/A428041_1_En_2_Fig72_HTML.jpg)\n\
  \n图 2-72. “内连接”操作\n\n### 2.6.2.3 左连接\n\n`Left Join`（左连接）从左表中获取在右表中存在匹配的记录。对于右表中没有匹配的记录，将显示`Null`值（如图\
  \ 2-73 所示）。\n\n![A428041_1_En_2_Fig73_HTML.jpg](img/A428041_1_En_2_Fig73_HTML.jpg)\n\
  \n图 2-73. “左连接”操作\n\n### 2.6.2.4 右连接\n\nMySQL 数据源支持`Right Join`（右连接）。请参考连接到服务器部分以连接到\
  \ MySQL 数据源。创建两个表，即“Student”和“Grade”，其结构与`Inner Join`示例中所示相同。\n\n`Right Join`从右表中获取在左表中存在匹配的记录。对于左表中没有匹配的记录，将显示`Null`值（如图\
