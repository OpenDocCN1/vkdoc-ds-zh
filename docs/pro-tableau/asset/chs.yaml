  ### 10.3.6 组织仪表板


  你可以通过多种方式组织仪表板，以便讲述一个故事或突出/强调信息。


  Tableau 提供了两种布局类型：


  *   `平铺`

  *   `浮动`


  #### 10.3.6.1 平铺布局


  默认情况下，仪表板使用 `平铺` 布局。在平铺布局中，所有视图和对象都排列在单个图层上，如图 10-29 所示。


  ![A428041_1_En_10_Fig29_HTML.jpg](img/A428041_1_En_10_Fig29_HTML.jpg)


  **图 10-29.** 平铺布局




  #### 10.3.6.2 浮动布局


  在浮动布局中，视图或对象可以层叠在其他对象之上。要更改默认布局，请点击仪表板窗格中间的“浮动”按钮，如图 10-30 所示。


  ![A428041_1_En_10_Fig30_HTML.jpg](img/A428041_1_En_10_Fig30_HTML.jpg)


  图 10-30. “浮动”布局按钮


  当您将仪表板布局设置为“浮动”时，新的工作表或对象将以浮动方式添加（如图 10-31 所示）。“各州销售额”视图层叠在“按区域和子类别划分的销售额”视图之上。


  ![A428041_1_En_10_Fig31_HTML.jpg](img/A428041_1_En_10_Fig31_HTML.jpg)


  图 10-31. 浮动的“各州销售额”视图


  要在布局之间切换，请选择该视图。选择仪表板窗格底部的“浮动”选项，如图 10-32 所示。


  ![A428041_1_En_10_Fig32_HTML.jpg](img/A428041_1_En_10_Fig32_HTML.jpg)


  图 10-32. 浮动选项


  视图布局将更改为“浮动”布局，如图 10-33 所示。


  ![A428041_1_En_10_Fig33_HTML.jpg](img/A428041_1_En_10_Fig33_HTML.jpg)


  图 10-33. 从平铺布局转换为浮动布局的视图


