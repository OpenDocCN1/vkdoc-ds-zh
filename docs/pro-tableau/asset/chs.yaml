- "# 2. 处理单一与多数据源\n\n> “我们大多数人需要聆听音乐才能理解它有多美。但通常我们在呈现统计数据时，只是展示乐谱，却没有演奏音乐。” — 汉斯·罗斯林，[Gapminder\
  \ 基金会](https://en.wikipedia.org/wiki/Gapminder_Foundation#Gapminder%20Foundation)联合创始人兼主席，该基金会开发了[Trendalyzer](https://en.wikipedia.org/wiki/Trendalyzer#Trendalyzer)软件系统\n\
  \n第 1 章让我们熟悉了可视化的基本概念、可视化的必要性与重要性、Tableau 的功能特性、Tableau 产品线以及 Tableau 中的各种文件格式。本章将帮助我们理解如何在\
  \ Tableau 中处理单一与多数据源。我们将探讨以下内容：\n\n*   桌面架构\n*   Tableau 环境\n*   连接到文件\n*   连接到服务器\n\
  *   元数据网格\n*   联接\n*   自定义 SQL\n*   数据混合\n*   数据提取\n\n让我们从桌面架构开始。\n\n## 2.1 桌面架构\n\
  \nTableau 架构基于 n 层客户端服务器架构（如图 2-1 所示）。Tableau 可充当桌面安装软件、Web 客户端和移动客户端。Tableau Desktop\
  \ 是一个创作和发布工具。它用于在 Tableau Server 上创建共享视图。Tableau 提供可扩展的解决方案，用于创建和交付桌面、Web 和移动分析。Tableau\
  \ Desktop 允许用户探索数据并分享洞察。\n\n![A428041_1_En_2_Fig1_HTML.gif](img/A428041_1_En_2_Fig1_HTML.gif)\n\
  \n图 2-1. Tableau Desktop 架构\n\n让我们简要讨论 Tableau Desktop 架构的各个层次。\n\n### 2.1.1 数据层\n\
  \nTableau 的基石是它的数据层。Tableau 允许您在异构数据环境中工作。您可以处理数据库、服务器、数据仓库、多维数据集以及平面文件（如 Excel、Access\
  \ 等）。在 Tableau 中，除非必要，否则无需将所有数据加载到内存中。Tableau 允许您通过应用数据库功能来回答您的问题，从而利用现有环境。\n\n\
  ### 2.1.2 数据连接器\n\nTableau 提供了多种数据连接器，用于连接数据库，如 Microsoft SQL Server、Oracle、Teradata、Vertica、Cloudera\
  \ Hadoop 等。此外，还有通用 ODBC 连接器，用于连接任何没有原生连接器的系统。在 Tableau 中，有两种与数据交互的模式：(i) 实时连接 (ii)\
  \ 内存模式。Tableau 用户可以轻松地在两者之间切换。\n\n### 2.1.3 实时连接\n\nTableau 的数据连接器允许您利用现有的数据基础设施。这是通过将动态\
  \ SQL 或 MDX 语句直接发送到源数据库，而不是导入所有数据来实现的。这意味着，如果您投资了像 Vertica 这样经过分析优化的快速数据库，您可以通过实时连接到数据而从中受益。这会将详细数据保留在源系统中，并将查询的聚合结果发送到\
  \ Tableau。Tableau 还可以利用无限量的数据。Tableau 是众多世界上最大数据库的前端分析客户端。每个连接器都针对每个数据源的独特性进行了优化。\n\
  \n### 2.1.4 内存模式\n\nTableau 拥有一个用于分析的快速内存数据引擎。Tableau 允许您一键连接数据，提取并将其加载到内存中。Tableau\
  \ 的数据引擎充分利用整个系统，在商用硬件上对数亿行数据实现快速查询响应。由于数据引擎可以访问磁盘存储以及 RAM 和缓存，因此它不受系统内存量的限制。无需将整个数据集加载到内存中即可实现其性能目标。\n\
  \n在以下情况下，内存模式是理想选择：\n\n*   您的数据库对于交互式分析来说速度太慢。\n*   您需要减轻事务数据库的负载。\n*   您需要离线工作，无法实时连接到数据。\n\
  \n但在以下情况下，实时连接可能更可取：\n\n*   您拥有一个快速的数据库，如 Vertica、Teradata 或其他经过分析优化的数据库。\n*   您需要获取最新的数据。\n\
  \n请参阅以下链接，了解内存与实时数据：哪个更好？\n\n[`http://www.tableau.com/learn/whitepapers/memory-or-live-data`](http://www.tableau.com/learn/whitepapers/memory-or-live-data)\n\
  \n## 2.2 Tableau 环境\n\n让我们尝试理解 Tableau 的环境。\n\n### 2.2.1 打开方式\n\n双击桌面上的 Tableau\
  \ 图标（如图 2-2 所示）。\n\n![A428041_1_En_2_Fig2_HTML.jpg](img/A428041_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2. Tableau 快捷方式图标\n\n\n\n### 2.2.2 关闭\n\n点击应用程序右侧的关闭按钮（如图 2-3 所示）。\n\n![A428041_1_En_2_Fig3_HTML.jpg](img/A428041_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3. 关闭按钮\n\n接下来，我们将学习**开始页面**。\n\n### 2.2.3 开始页面\n\n**开始页面**是一个中心位置，用于帮助连接数据源、访问最近的工作簿以及探索\
  \ Tableau 社区提供的教程（如图 2-4 所示）。\n\n![A428041_1_En_2_Fig4_HTML.jpg](img/A428041_1_En_2_Fig4_HTML.jpg)\n\
