  \ `Region`、`State` 和 `City`。\n\n让我们分解输出：\n\n**按区域的销售额：** 如图 5-63 所示。\n\n![A428041_1_En_5_Fig63_HTML.jpg](img/A428041_1_En_5_Fig63_HTML.jpg)\n\
