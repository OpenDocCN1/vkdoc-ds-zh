  \n图 8-147.\n\n将数据桶大小设置为 `“2”` 后的输出结果\n\n## 8.10 词云\n\n“词云”在视觉设计中也被称为“标签云”或“加权列表”，或“文本云”。\n\
  \n### 8.10.1 为什么要使用词云？\n\n*   你希望改善客户体验质量（QCE）。\n*   想象一下……\n\n你接任一家零售公司的负责人。你为自己设定的目标之一是提升客户体验质量。为此，你进行了一项在线调查。为了鼓励越来越多的客户就你的公司提供的服务质量提供反馈，你设计了一份简洁的客户调查问卷。其中一个问题涉及客户遇到的痛点。客户需要从诸如“不友好的员工”、“质量差”、“价格高”等词语中进行选择。你想快速了解客户最大的顾虑是什么。通过词云可以很容易地看到这一点。\n\
  \n*   你希望保留并壮大你的员工队伍。\n\n### 8.10.2 何时应该使用词云？\n\n当需要突出显示重要的文本数据点时。\n\n### 8.10.3\
  \ 词云应该用于什么？\n\n词云是文本数据的可视化展示，是一种简单的文本分析。它通常用于描绘网站上的关键词或元数据。一个词在文本数据源（如底层数据库、演讲或博客文章）中出现得越多（频率越高），它在词云中就显得越大越粗。这是通过字体和颜色的变化来实现的。换句话说，单词的字号大小和/或颜色反映了该目标词在源文本中出现的相对频率。\n\
  \n### 8.10.4 哪些情况下不应该使用词云？\n\n*   如果你的数据没有针对上下文进行优化。不能简单地将任何数据倒入词云生成器。数据应该经过数据分析师仔细筛选和优化。\n\
  *   不应过度使用词云，仅仅因为它易于创建和使用。可能存在其他效果更好的可视化方式。\n\n#### 8.10.4.1 示例\n\n让我们为以下莎士比亚的十四行诗创建一个词云。\n\
  \n“爱情太年轻，不知良心为何物，  \n但谁不知良心由爱情而生？  \n那么，温柔的骗子，别指责我的错，  \n免得你自身因我的过失而有罪：  \n因为，你背叛了我，我也背叛\
  \  \n我高贵的部分，向肉体粗鄙的叛逆屈服；  \n我的灵魂告诉我的身体，他可以在爱情中凯旋；肉体不再需要更多理由，  \n但听到你的名字便起身指向你，  \n\
