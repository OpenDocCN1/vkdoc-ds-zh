  \n### 1.6.3 Tableau 数据源 (.tds) 文件\n\n**它包含什么？**\n\nTableau 数据源文件包含有关数据源的所有连接信息及元数据。TDS\
  \ 文件自动作为 TWB（Tableau 工作簿）文件的一部分包含在内，但如果你想要共享特定数据源的连接信息及元数据，也可以将其保存为单独的文件。它是一个 XML\
