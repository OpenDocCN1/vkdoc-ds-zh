  \n图 5-109. 度量 `CGPA` 放置在视图中\n\n计算中使用的公式：\n\n```\n(小于或等于当前考虑值的数值个数 / 总数值个数) * 100\n\
  ```\n\n示例：让我们考虑学号为 1 的学生的 CGPA 分数。该学生的 CGPA 分数为 4.6。有 8 个 CGPA 分数小于或等于 4.6 的 CGPA\
  \ 分数。\n\n```\n(8 / 10) * 100 = 80%\n```\n\n现在，为了再次确认公式，让我们考虑另一个学生的 CGPA 值。这次我们考虑\
  \ CGPA 值为 3.9。这是学生获得的最低 CGPA 分数。\n\n```\n(1/10)*100 = 10%\n```\n\n**注意：** 在计算百分位时，Tableau\
  \ 会忽略空值。如果存在空值，它们会在交叉表中显示为空白行，并且不计入计算中使用的总项目数 (%)。\n\n## 5.8 同比增长\n\n通俗地说，同比增长意味着公司今年的财务表现与去年相比。同比增长表现用于衡量公司的业绩是在改善还是在削弱。\n\
  \n计算同比增长率的公式：\n- 用今年的数值（销售额或利润）减去去年的数值。这将构成年度的总差额（如果为正数，则表示同比增长，否则意味着亏损）。\n- 用差额除以上一年的数值。结果即为同比增长率。\n\
