  \ 5.3.1.1.1 第 1 步\n\n从 `Sample – Superstore.xls` 读取数据（如图 5-16 所示）。\n\n![A428041_1_En_5_Fig16_HTML.jpg](img/A428041_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16. 从 `Sample - Superstore.xls` 读取数据到 Tableau\n\n##### 5.3.1.1.2 第 2 步\n\n\
  表 5-2. 需要在视图中执行的任务\n\n| 列功能区 | `Order Date`（“离散”，粒度设置为“年份”）`Sales` – 聚合设置为“SUM”向度量\
