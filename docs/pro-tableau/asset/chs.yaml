- "# 1. 可视化与 Tableau 简介\n\n电子补充材料 本章的在线版本（`doi:10.1007/978-1-4842-2352-9_1`）包含补充材料，仅供授权用户使用。\n\
  \n> “卓越的图表能以最少的墨水、最小的空间，在最短的时间内向读者传达最多的信息。” —— 爱德华·R·塔夫特，数据可视化领域的先驱\n\n本章将介绍数据可视化以及做好数据可视化的重要性。我们将熟悉市场领先的数据可视化工具之一——Tableau。我们将学习\
  \ Tableau 产品线，包括 Tableau Desktop、Tableau Server、Tableau Online、Tableau Reader 等。本章还将详细阐述\
  \ Tableau 中的多种文件类型。\n\n想象一下，你需要研究一页又一页的数据，报告你的发现，并得出推论和结论。你为这项看起来乏味、耗时且极其无聊的任务做准备。如果用一些优秀的可视化（数据可视化是数据的图形化或图示化描述）来替代这项任务，让你能够快速高效地发现趋势、揭示之前隐藏的模式，生活会不会轻松得多？\n\
  \n数据可视化就是视觉沟通。它旨在让数据更易于理解、更便于解读和分析。总之，数据可视化有两个重要目的：\n\n-  理解数据（也称为数据分析）\n-  进行视觉沟通（将你的发现传达给他人）\n\
  \n数据可视化工具已经走过了漫长的道路，从 Excel 的标准图表到更时髦、更复杂的图表形式，例如地理地图、**迷你图**、热力图、树图、**热力曲线图**等。\n\
  \n## 1.1 为什么需要数据可视化？\n\n想象一下，你的公司决定首次推出一套精美的珠宝系列。这意味着巨大的投资。你需要非常确定你的目标客户。你发起了一项在线调查来了解你的客户。在各种问题中，包括了关于他们的职业/专业以及他们对珠宝风格偏好的问题。这项调查在多个城市进行，你有大量数据需要分析。虽然可以手动完成，但这意味着花费更多时间。节日季即将来临，你需要快速决定风格，以便有足够的时间准备你的系列产品。你决定将调查结果绘制成图表。图表清晰地显示了趋势：人们同时偏好现代风格和保守风格的珠宝。这意味着你的珠宝产品线应该是现代风格和保守风格的结合或融合，因为大多数潜在客户在企业部门工作。调查结果的图形化描述让你能够快速决定你的店铺应该主营哪种风格的珠宝。\n\
  \n这个场景就是数据可视化重要性的一个例证。使用数据可视化有很多理由：\n\n- 你想了解销售额与利润之间的关联。\n- 你想预测销量。\n- 你想确定业务蓬勃发展的区域和业务萎缩的区域。\n\
  - 你想预测市场会对你新产品的推出作何反应。\n- 你想了解影响客户行为的因素。\n- 你想了解你的学校多年来在阅读、写作和算术这三项关键技能上的表现。\n-\
  \ 你想清晰快速地看到业务的同比增长情况。\n- 你想挖掘更深层次的见解。\n- 你想用你的数据讲述一个故事。\n\n## 1.2 数据可视化能帮助我们什么？\n\
  \n数据可视化将力量交到业务用户手中，并极大地缩短了将数据转化为洞察的时间。它使决策者能够：\n\n- 快速发现趋势、看到模式并理解复杂概念。\n- 看到那些原本会被忽略的事情。\n\
  - 研究因果关系。\n- 提出一个问题，得到答案，然后还能提出后续问题。\n- 对数据提出更好的问题，从而做出更好的数据驱动决策。\n- 实现信息图的应用，即用于传达信息的图形。\n\
  \n## 1.3 可视化简介\n\n花点时间看看下面表 1-1 中给出的数据集。它包含了 2012 年和 2013 年 5 月访问每个城市的游客数量的详细信息。\n\
  \n![A428041_1_En_1_Figa_HTML.jpg](img/A428041_1_En_1_Figa_HTML.jpg)\n\n表 1-1. “示例\
  \ – 访客量”数据集\n\n相同的数据在表 1-2 中用增加的列来表示。负的“变化百分比”以红色显示。\n\n![A428041_1_En_1_Figb_HTML.jpg](img/A428041_1_En_1_Figb_HTML.jpg)\n\
  \n表 1-2. 在“示例 – 访客量”数据集（表 1-1）中新增列“变化百分比”，并对其应用了条件格式\n\n条件格式与颜色相结合，有助于清晰描绘“趋势是什么”，并促进决策。它使读者更容易理解数据，而不是让他们记住好坏参半的数字，并要求他们从一列标准数据中找出重点或问题。\n\
  \n看看图 1-1。它在清晰展示趋势方面做得更好。注解的使用进一步有助于吸引人们对负的百分比变化的注意。\n\n![A428041_1_En_1_Fig1_HTML.jpg](img/A428041_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1. “示例 – 访客量”数据集（如表 1-2 所示）的图形化描述\n\n现在，观看大卫·麦坎德利斯关于数据可视化的 TedEx 视频（17:56\
  \ 分钟）会很有帮助。\n\n```\nat http://www.ted.com/talks/david_mccandless_the_beauty_of_data_visualization\
  \ 可以轻松理解可视化的力量。该视频强调了以下几点：\n```\n\n- 可视化有助于发现模式并看到数据之间的联系。\n- 读者发现理解视觉内容非常容易。读者理解起来所需的精力要少得多。\n\
  - 一图胜千言。该视频展示了可视化如何将大量信息压缩到小空间中。\n- 可视化可以让你更快地找到答案，并轻松提供清晰度。\n\n让我们再看一个例子来认识可视化的力量。\n\
  \n如果我们让你查看大约 10,000 条记录（准确地说是 9,994 条），并告诉我们每个地区哪个类别的销售额最高，你的答案会是什么？更重要的是，你提供答案需要多长时间？\n\
  \n图 1-2 显示了“示例 – 超级商店”数据集的一个子集：\n\n![A428041_1_En_1_Fig2_HTML.jpg](img/A428041_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2. “示例 – 超级商店”数据子集的一个子集\n\n现在，看图 1-3 中的图表，并回答同样的问题。这就是可视化的力量……\n\n![A428041_1_En_1_Fig3_HTML.jpg](img/A428041_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3. 表示每个地区哪个类别创造了最大销售额的可视化图表\n\n### 1.3.1 哪些领域正在利用数据可视化的力量？\n\n数据可视化应用于许多领域：\n\
  \n- 教育\n- 零售\n- 银行与金融\n- 医疗保健\n- 社交媒体\n- 体育\n- 娱乐等\n\n### 1.3.2 谁在使用数据可视化？\n\n许多企业正在使用数据可视化。以下列举几个：\n\
  \n- 谷歌\n- 脸书\n- 雅虎\n- 思科系统公司\n- 德勤\n- 通用电气等\n\n\n\n### 1.3.3 顶级数据可视化工具\n\n看一看市面上几款主流的报表与可视化工具。\n\
  \n- `Tableau`\n- `QlikTech` 公司的 `QlikView`\n- `D3.js`（数据驱动文档）➤ 使用 `HTML`、`CSS` 和\
  \ `SVG`\n- `Chart.js`\n- `Tibco SpotFire`\n- `IBM Cognos Visual Analytics`\n- `Roambi\
  \ Analytics`\n- `Google Charts`\n- `FusionCharts`\n\n### 1.3.4 数据可视化发展史\n\n请参考表\
  \ 1-3 了解“数据可视化发展史”。\n\n**表 1-3.** 数据可视化发展史\n\n| 时间 | 形式 | 用途 |\n| --- | --- | ---\
  \ |\n| 2 世纪 | 表格（文本表示） | 以导航工具的形式表示天文信息 |\n| 17 世纪（勒内·笛卡尔——法国哲学家、数学家） | 图形 | 开发了二维坐标系来显示数值\
  \ |\n| 18 至 19 世纪（威廉·普莱费尔——苏格兰社会科学家） | 条形图、饼图等 | 表示定量信息 |\n| 1977 年，普林斯顿大学的约翰·图基\
  \ | 探索性数据分析 | 探索并理解数据 |\n| 1983 年，爱德华·塔夫特 |  | 定量信息的可视化展示 |\n\n### 1.3.5 数据可视化工具应具备哪些功能？\n\
  \n- 支持目标导向的可视化，即绘制实际值与特定期望结果的对比。\n- 确保报表和仪表盘能够在正确的时间、以正确的格式、在正确的设备上，送达正确的人员。\n-\
  \ 允许对数据进行操作，如切片、切块、筛选、查询、交互等。\n- 能够访问实时或近实时数据源，以便实时或近实时地呈现可行动的信息和洞察。\n\n### 1.3.6\
  \ 我们来看看 Tableau 如何满足这些期望\n\n以下突出特点使 `Tableau` 成为市场领先的可视化工具：\n\n- `Tableau` 提供多种图形和图表形式，清晰且有说服力地展示实际值与特定期望结果的对比。\n\
  - `Tableau` 产品套件中的多种产品，使得使用 `Tableau` 创建的报表和仪表盘能够及时、相对容易地提供给决策者。以下是 `Tableau` 产品线的简要概述：\n\
  \  - `Tableau Desktop`：用于编写/设计报表的工具\n  - `Tableau Server`：可在整个组织内部署和共享报表的平台\n  -\
  \ `Tableau Online`：基于云的安全解决方案，用于共享、分发和协作处理 `Tableau` 视图与仪表盘\n  - `Tableau Reader`：免费产品，任何人都可使用它来查看\
  \ `Tableau Desktop` 授权用户创建的 `Tableau` 工作簿并进行交互\n  - `Tableau Mobile`：支持在移动设备（如 `iOS`\
  \ 设备等）上访问报表的版本\n- `Tableau` 提供多种功能，可用于理解数据、解读数据、运行上下文敏感筛选器、按需排序、进行统计分析等。\n- `Tableau`\
  \ 可连接广泛的数据源，从传统数据源（如 `Excel`、文本文件等）到非传统数据源（如社交媒体数据、`SalesForce`、`Microsoft Azure`\
  \ 等）。\n- `Tableau` 支持您对快速 BI / 敏捷 BI / 自助式 BI 与分析的需求。\n\n### 1.3.7 切换至 Tableau 的理由\n\
  \n您当前的 BI 可视化工具：\n\n- 刷新数据需要几分钟。\n- 内存不足。\n- 添加一行需要几分钟。\n- 迫使您使用较小的数据子集。\n- 无法容纳您的业务本应处理的海量数据。\n\
  - 不支持在地图上查看数据。\n- 要求您预见所有未来需求，对数据探索的支持很少或根本没有。\n\n## 1.4 Tableau 的定位\n\n这是一个自助式分析的时代。对\
  \ IT 部门的依赖正在减少。客户需要的是易于使用、可访问性强且易于与现有系统集成的工具。\n\n根据 Gartner 2016 年“商业智能与分析平台魔力象限”，`Tableau`\
  \ 被置于“领导者”象限。请参考图 1-4。\n\n![A428041_1_En_1_Fig4_HTML.jpg](img/A428041_1_En_1_Fig4_HTML.jpg)\n\
  \n**图 1-4.** Gartner 2016 年商业智能与分析平台魔力象限\n\nGartner 魔力象限的 X 轴为“愿景完整性”，Y 轴为“执行能力”。该象限包含四个部分，即“远见者”、“利基玩家”、“挑战者”和“领导者”。\n\
  \n`Tableau` 在执行能力方面排名最高。2016 年是 `Tableau` 连续第四年位列“领导者”象限。\n\n从魔力象限中可以清楚地看到，领导者需要在其当前的执行中表现出卓越，并具备能力与意愿朝着未来的使命前进。\n\
  \n\n\n## 1.5 Tableau 产品线\n\n让我们将 Tableau 工具大致分为以下几类：\n\n- 开发工具（`Tableau Desktop`\
  \ 和 `Tableau Public`）\n- 共享工具（`Tableau Server`、`Tableau Online`、`Tableau Reader`）\n\
  \n开发工具将帮助你创建可视化图表和/或仪表板。\n\n共享工具则用于促进以下可视化图表和/或仪表板任务：\n\n- 查看\n- 共享\n- 交互\n- 探索\n\
  \n`Tableau Desktop` 有两个版本：\n\n- 专业版\n- 个人版\n\n它们的区别在于可以连接的数据源类型。使用 `Tableau Desktop\
  \ Professional`，用户可以连接到数据连接页面上列出的所有数据源（如图 1-5 所示）。\n\n![A428041_1_En_1_Fig5_HTML.jpg](img/A428041_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5. `Tableau Desktop Professional` 的数据连接页面\n\n使用 `Tableau Desktop Personal`，用户只能连接到\
  \ `OData`、`Microsoft Windows Azure Marketplace DataMarket` 和 `Tableau Data Extract`（`.tde`）文件；不过，它可以将工作簿保存在本地。它缺少发布到\
  \ `Tableau Server`（公共或私有）的功能。\n\n`Tableau Public` 可从 Tableau 网站免费下载。它在其可连接的数据源方面受到限制。仅支持以下数据源：\n\
  \n**连接**\n\n到文件：\n\n- Excel\n- 文本文件\n- Access\n- 统计文件\n\n到服务器：\n\n- OData\n- 更多服务器\n\
  \  - Odata\n  - Web 数据连接器\n\n使用 `Tableau Public`，任何人都可以找到你的可视化图表。它不支持将工作簿保存在本地。`Tableau\
  \ Public` 可以可视化包含多达 100 万行数据的数据集。\n\n`Tableau Server` 部署在组织的内部设施中。它有助于在组织内安全地共享可视化图表。但是，需要共享的工作簿必须使用\
  \ `Tableau Desktop` 发布到 `Tableau Server`。然后，获得许可的用户将能够通过网络浏览器在线访问这些可视化图表。它也可以用于共享数据源。\n\
  \n`Tableau Online` 具有与 `Tableau Server` 相同的功能；但是，它由 Tableau 托管在他们的云端。\n\n`Tableau\
  \ Reader` 可从 Tableau 网站免费下载。它**仅**允许查看或与 Tableau 打包工作簿（`.twbx`）交互。`Tableau Reader`\
  \ 基本上没有安全性。任何拥有 `.twbx` 文件的人都可以使用 `Tableau Reader` 打开它。\n\n请参考图 1-6。\n\n![A428041_1_En_1_Fig6_HTML.jpg](img/A428041_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6. Tableau 产品线\n\nTableau 产品线一览（如表 1-4 所示）：\n\n表 1-4. Tableau 产品线一览\n\n| Tableau\
  \ Desktop | • 可以创建包含工作表、仪表板和故事的工作簿。 • 是一款许可产品。有两个版本：`Desktop Professional` 和 `Desktop\
  \ Personal`。 • 允许将工作簿存储在本地。 • 允许将工作簿、仪表板和故事发布到 `Tableau Server`、`Tableau Online`\
  \ 和 `Tableau Public`。 |\n| Tableau Server | • 通常部署在内部。 • 允许用户直接使用浏览器进行交互。 • 由私人管理。\
  \ |\n| Tableau Online | • 是云端托管的 `Tableau Server` 版本。 • 服务器由 Tableau 维护。 |\n| Tableau\
  \ Reader | • 允许查看/与 `Tableau` 打包工作簿（`.twbx`）交互。 • 不连接到服务器。 • 不允许修改工作簿。 |\n| Tableau\
  \ Public | • 是 Tableau 的免费产品。 • 限制了处理数据的工作量（行数）。 • 只能连接到 `Excel`、`Access` 或文本文件（无数据库连接性），并且你在\
  \ `Tableau Public` 中保存的任何内容都将保存在 `Tableau Public Server` 上，任何人都可以下载（无保密性）。 |\n\n\
  ## 1.6 Tableau 中的文件类型\n\n让我们来看看 Tableau 中的以下文件类型：\n\n- Tableau 工作簿（`twb`）\n- Tableau\
  \ 打包工作簿（`twbx`）\n- Tableau 数据源（`tds`）\n- Tableau 打包数据源（`tdsx`）\n- Tableau 书签\n-\
  \ Tableau 数据提取\n\n### 1.6.1 Tableau 工作簿（`twb`）\n\n当你在 Tableau 中保存工作簿时，默认的文件扩展名是\
