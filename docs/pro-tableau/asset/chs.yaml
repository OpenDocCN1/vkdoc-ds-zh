  \ 放置在画布区域上的 `Orders` 工作表\n\n数据源页面有四个主要区域。它们是：(i) 左侧窗格，(ii) 画布，(iii) 网格，以及 (iv) 元数据网格（如图\
  \ 2-13 所示）。\n\n1.  **左侧窗格：** 显示有关您所连接数据的详细信息。例如，对于基于文件的数据，将显示文件名和工作表。\n2.  **画布：**\
