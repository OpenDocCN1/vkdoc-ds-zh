  > “通过记住三个基本原则：克制、精简、强调，你可以实现有效图表、图形和表格设计的简洁性。” ——加尔·雷诺兹，国际知名沟通顾问、畅销书作者，其获奖作品包括[《演说之禅》](http://www.amazon.com/gp/product/0321811984?ie=UTF8&tag=garrreynoldsc-20&linkCode=xm2&camp=1789&creativeASIN=0321811984)和[《演说之禅设计》](http://www.amazon.com/gp/product/0321668790?ie=UTF8&tag=garrreynoldsc-20&linkCode=xm2&camp=1789&creativeASIN=0321668790)


  第 9 章向我们介绍了高级可视化技术，例如瀑布图、凹凸图和子弹图。本章将帮助我们理解如何创建交互式仪表盘并编织故事。我们将探讨以下内容：


  - 创建和组织仪表盘

  - 仪表盘操作

  - 创建故事




  '
- '# 10.1 为什么使用仪表板？


  仪表板可以帮助用户在单个空间中展示多个工作表。除此之外，还可以提供辅助信息，同时比较和监控多种数据。


  '
- '# 10.2 什么是仪表板？


  仪表板是一种可视化显示，它呈现实现一个或多个目标所需的最重要信息，并能完整地适配在单个计算机屏幕上，以便一目了然地进行查看、监控和管理。


  换句话说，我们可以说仪表板是一种用户界面，它以易于阅读的方式组织和呈现信息。它在一个屏幕上整合并排列数字、指标，有时还包括绩效记分卡。


  您可以在工作簿底部看到类似于工作表标签的仪表板标签。您可以将工作簿中的视图添加到仪表板中。您还可以将网页、图像和文本区域添加到仪表板。仪表板允许您对视图进行格式设置、编辑、下钻和编辑轴。当您将视图添加到仪表板时，它会自动连接到相应的工作表。当您修改工作表时，仪表板会自动更新，反之亦然。


  '
- '# 10.3 创建仪表板


  可以将一个或多个视图/工作表拖入仪表板。您还可以为仪表板添加交互性，并执行更多操作。


  ## 10.3.1 打开仪表板工作表


  您可以像创建新工作表一样创建仪表板。创建新的仪表板工作表后，您可以向仪表板添加一个或多个视图和对象。


  ### 10.3.1.1 创建仪表板的步骤


  让我们探索创建仪表板的步骤。


  #### 10.3.1.1.1 第 1 步


  选择 `仪表板` ➤ `新建仪表板`（如图 10-1 所示）。


  ![A428041_1_En_10_Fig1_HTML.jpg](img/A428041_1_En_10_Fig1_HTML.jpg)


  图 10-1. “新建仪表板”选项


  #### 10.3.1.1.2 第 2 步


  将创建一个新的仪表板工作表（如图 10-2 所示）。


  ![A428041_1_En_10_Fig2_HTML.jpg](img/A428041_1_En_10_Fig2_HTML.jpg)


  图 10-2. 一个仪表板工作表


