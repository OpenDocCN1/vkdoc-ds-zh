  \ - Superstore` 是 Tableau Desktop 版本自带的默认已保存数据源。参见图 2-5。\n\n    ![A428041_1_En_2_Fig5_HTML.jpg](img/A428041_1_En_2_Fig5_HTML.jpg)\n\
  \n    图 2-5. 连接页面\n2.  **打开：** 首次打开 Tableau 时，此窗格为空。当您开始创建工作簿后，您可以在此窗格中看到最近打开的工作簿。您也可以打开示例工作簿来探索\
  \ Tableau 的功能。您还可以通过单击工作簿缩略图左上角出现的图钉图标，将工作簿固定在开始页面上。被固定的工作簿会始终显示在开始页面上，即使它们最近未被打开。要移除最近打开或固定的工作簿，请将鼠标悬停在工作簿缩略图上，然后单击出现的\
