  ## 8.2 树图


  树图用于展示层级数据。层级数据也被称为树状结构数据。它表现为一组嵌套的矩形。矩形的大小和顺序由某个度量决定。最大的矩形位于左上角，最小的矩形位于右下角。如果矩形是嵌套的，则在较大矩形内部，较小的矩形保持相同的排序方式。


  这一概念由[本·施奈德曼教授](https://en.wikipedia.org/wiki/Ben_Shneiderman#Ben%20Shneiderman)于
  20 世纪 90 年代初在[马里兰大学人机交互实验室](https://en.wikipedia.org/wiki/University_of_Maryland_Human_%E2%80%93_Computer_Interaction_Lab#University%20of%20Maryland%20Human%20%E2%80%93%20Computer%20Interaction%20Lab)提出。


  树图的原始动机是显示硬盘的内容。`SequoiaView` 是一款基于树图原理的磁盘浏览工具。面积表示文件大小，文件类型决定颜色。


  `SmartMoney` 是第一个广泛用于非层级数据展示的树图实现。


  ### 8.2.1 优点


  *   树图可以在有意义且组织良好的显示中展示数百到数千个项目。这种显示便于快速发现模式和异常。

  *   从设计上讲，它们有效地利用了空间。

  *   有助于展示“部分与整体”的关系。


  #### 8.2.2.1 演示 1


  设想一下……


  我们是一家零售店，销售多个类别的商品。每个类别又进一步细分为多个子类别。如果我们要一次性呈现所有数据，应该使用树图。每个类别构成树的一个分支。每个类别由一个矩形表示。然后，每个类别矩形内会平铺多个代表子分支的小矩形。子分支则由子类别构成。




  #### 8.2.2.2 示例


  数据集中的数据分为三个类别。


  - 家具

  - 办公用品

  - 技术


  每个类别进一步细分为若干子类别，如图 8-13 所示。


  ![A428041_1_En_8_Fig13_HTML.jpg](img/A428041_1_En_8_Fig13_HTML.jpg)


  图 8-13. 数据的类别和子类别


  上述数据集包含 17 个子类别的数据，这些子类别汇总为三个类别。然而，未来可能还会出现更多子类别的数据。我们需要一种图表形式，能够一次性查看所有数据。树状图正好满足了我们的需求！（参见图
  8-14）。


  ![A428041_1_En_8_Fig14_HTML.jpg](img/A428041_1_En_8_Fig14_HTML.jpg)


  图 8-14. 展示数据类别和子类别的树状图


  如何得到上述可视化效果？


  绘制树状图需要以下内容：


  - 一个或多个维度

  - 一个或两个度量


  通常，使用一个定量度量来提供大小，再用另一个（或同一个）度量来提供颜色。如果使用度量来提供颜色，并且该度量从零开始，则坚持使用单一颜色。然而，如果度量可能取负值，例如度量`Profit`，则可以使用两种颜色，并启用`Stepped
  Color`（分步颜色）选项。


  上述树状图通过一个维度（`Category`）来着色。


  ##### 8.2.2.2.1 创建树状图的步骤


  ##### 8.2.2.2.2 第 1 步


