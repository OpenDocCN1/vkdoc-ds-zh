  \ 所示。\n\n![A428041_1_En_5_Fig57_HTML.jpg](img/A428041_1_En_5_Fig57_HTML.jpg)\n\n\
  图 5-57.\n\n排名 – 演示 1 – 最终输出\n\n## 5.6 LOD（详细级别）\n\n详细级别（LOD）是一个非常重要的概念。理解细节的概念有助于理解详细级别。让我们来看一下可以在视图/工作表中添加细节的区域：\n\
  \n*   列功能区\n*   行功能区\n*   标记卡上的详细信息\n\n细节是由用于细分度量的维度定义的。\n\n**示例：**\n\n将维度 `Region`\
  \ 从数据窗格下的维度区域拖放至行功能区。\n\n将度量 `Sales` 从数据窗格下的度量区域拖放至列功能区（如图 5-58 所示）。\n\n![A428041_1_En_5_Fig58_HTML.jpg](img/A428041_1_En_5_Fig58_HTML.jpg)\n\
  \n图 5-58.\n\n维度 `Region` 和度量 `Sales` 分别放置在行功能区和列功能区上。\n\n度量 `Sales`（默认聚合为 `SUM`）按维度\
  \ `Region` 进行聚合。\n\n让我们将另一个维度 `Category` 添加到行功能区（如图 5-59 所示）。\n\n![A428041_1_En_5_Fig59_HTML.jpg](img/A428041_1_En_5_Fig59_HTML.jpg)\n\
  \n图 5-59.\n\n维度 `Category` 放置在行功能区上。\n\n通过将维度 `Category` 放置在行功能区上，我们增加了视图/工作表的粒度，减少了聚合程度。这意味着我们正在增加详细级别。\n\
  \n另一个可以添加细节的区域是标记卡上的 `Details`。将一个或多个维度添加到 `Detail` 按钮或 `Detail` 功能区时，会根据视图或工作表中的图表类型以不同方式影响可视化效果。\n\
  \n**示例：**\n\n将度量 `Sales` 从数据窗格下的度量区域拖放至列功能区。将度量 `Profit` 从数据窗格下的度量区域拖放至行功能区（如图 5-60\
  \ 所示）。\n\n![A428041_1_En_5_Fig60_HTML.jpg](img/A428041_1_En_5_Fig60_HTML.jpg)\n\n\
  图 5-60.\n\n度量 `Sales` 和 `Profit` 分别放置在列功能区和行功能区上。\n\n输出如图 5-60 所示。输出是一个散点图，视图上只有一个标记。出现单个标记的原因是该度量尚未按任何维度进行细分。将维度\
  \ `Customer Name` 从数据窗格下的维度区域拖放至标记卡上的 `Details`（见图 5-61）。\n\n![A428041_1_En_5_Fig61_HTML.jpg](img/A428041_1_En_5_Fig61_HTML.jpg)\n\
  \n图 5-61.\n\n维度 `Customer Name` 放置在标记卡上的 `Detail` 上。\n\n图 5-61 中的输出显示度量正在按 `Customer\
  \ Name` 进行细分。视图为每位客户显示一个标记。这使得视图粒度更高，聚合程度更低。\n\n另一种向视图添加细节的方法是使用 LOD（详细级别）。LOD 表达式提供了一种优雅且强大的方式，可以在单个可视化中回答涉及多个粒度级别的问题。详细级别表达式提供了一种轻松计算聚合的方法，这些聚合不在可视化的详细级别上。然后，您可以任意方式将这些值集成到可视化中。从\
  \ Tableau v9 开始，引入了一个名为详细级别（LOD）表达式的新概念。LOD 表达式可用于在不同级别以不同方式表示数据。\n\n**什么时候可以使用\
  \ LOD 表达式？**\n\n在以下情况下考虑使用 LOD 表达式：\n\n*   需要在不同于视图中存在的维度/级别的级别上显示数据时。\n*   需要获取不受应用于视图的任何筛选器影响的静态计算值时。延伸阅读请参考：[`www.tableaulearners.com/2016/level-detail-expressions-tableau/`](http://www.tableaulearners.com/2016/level-detail-expressions-tableau/)\n\
  \nLOD 有三个可用选项。它们是：\n\n*   `Include`\n*   `Exclude`\n*   `Fixed`\n\n### 5.6.1 演示\
  \ 1\n\n**目标：** 演示“详细级别 – Exclude”。\n\n**输入：** `\"Sample – Superstore.xls\"`\n\n\
