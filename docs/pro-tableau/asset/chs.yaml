  \ 第 1 步\n将 `Percentile.xlsx` 中的数据读取到 Tableau 中（如图 5-104 所示）。\n\n![A428041_1_En_5_Fig104_HTML.jpg](img/A428041_1_En_5_Fig104_HTML.jpg)\n\
