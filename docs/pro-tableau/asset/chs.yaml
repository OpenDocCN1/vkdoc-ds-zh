  ### 10.3.4 向仪表板添加对象


  仪表板对象是仪表板中的一个区域。它有助于提供视图中未包含的辅助信息。仪表板对象是多功能的，你可以使用它们来反映图形设计的整体主题。


  例如，你可以使用 `“文本”` 区域来添加关于视图的详细信息。你可以在仪表板窗格中看到这些仪表板对象（如图 10-23 所示）。


  ![A428041_1_En_10_Fig23_HTML.jpg](img/A428041_1_En_10_Fig23_HTML.jpg)


  **图 10-23.** 仪表板窗格中的仪表板对象


  下面我们来讨论如何将仪表板对象添加到仪表板工作表中。


  #### 10.3.4.1 添加仪表板对象的步骤


  按照以下步骤将仪表板对象添加到仪表板工作表中。


  ##### 10.3.4.1.1 步骤 1


  将仪表板窗格下的仪表板对象 `“文本”` 拖拽至仪表板工作表上。


  ##### 10.3.4.1.2 步骤 2


  将弹出一个 `“编辑文本”` 对话框。请按图 10-24 所示输入文本。


  ![A428041_1_En_10_Fig24_HTML.jpg](img/A428041_1_En_10_Fig24_HTML.jpg)


  **图 10-24.** `“编辑文本”` 对话框


  ##### 10.3.4.1.3 步骤 3


  可以在仪表板中看到 `“文本”` 对象（如图 10-25 所示）。


  ![A428041_1_En_10_Fig25_HTML.jpg](img/A428041_1_En_10_Fig25_HTML.jpg)


  **图 10-25.** 显示 `“文本”` 对象以为视图提供辅助信息的仪表板


  以下是可添加到视图中的仪表板对象列表。每个对象用于不同的目的。


  *   `图像`：图像对象允许你添加徽标、品牌元素和描述性信息。

  *   `空白`：空白对象允许你在仪表板中添加一个空白区域。这些对象可用于控制空间。空白容器是透明的，因此你使用的背景颜色会透过来。

  *   `网页`：网页对象允许你添加来自互联网的有用超链接和动态内容以支持你的视图。


  在下一节中，我们将解释如何从仪表板中删除一个工作表。


