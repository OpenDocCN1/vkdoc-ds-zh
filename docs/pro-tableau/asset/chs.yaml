- "# 5. 表计算\n\n> 可视化的目的是洞察，而非图画。——本·施耐德曼，[计算机科学家](https://en.wikipedia.org/wiki/Computer_science#Computer%20science)，[计算机科学系](https://en.wikipedia.org/wiki/University_of_Maryland_Department_of_Computer_Science#University%20of%20Maryland%20Department%20of%20Computer%20Science)杰出大学教授，[马里兰大学帕克分校](https://en.wikipedia.org/wiki/University_of_Maryland,_College_Park#University%20of%20Maryland,%20College%20Park)，[马里兰大学人机交互实验室](https://en.wikipedia.org/wiki/University_of_Maryland_Human-Computer_Interaction_Lab#University%20of%20Maryland%20Human-Computer%20Interaction%20Lab)创始主任（1983-2000\
  \ 年）\n\n第 4 章介绍了两个新字段，即“度量名称”和“度量值”。我们学习了如何在单个轴上混合多个度量，以及如何使用双轴来增强数据的呈现方式。我们还学习了一些新的图表形式，例如斜率图、组合图（如视图中的条形图和折线图）、棒棒糖图等。本章将帮助我们了解将对视图中绘制的度量执行的表计算。在本章中，我们将探讨以下表计算：\n\
  \n- 销售额的累计总和\n- 总计百分比\n- 移动平均\n- 排名\n- 详细级别 (LOD)\n- 百分位数\n- 同比增长\n\n## 5.1 什么是表计算？\n\
  \n考虑一个 Tableau 视图（见图 5-1a）。对于每个 Tableau 视图，都有一个由视图中使用的维度决定的虚拟表。这些维度可以位于行功能区、列功能区、页面以及标记卡上（颜色、大小、标签、详细信息和路径），换句话说，就是详细级别内的维度。\n\
  \n![A428041_1_En_5_Fig1a_HTML.jpg](img/A428041_1_En_5_Fig1a_HTML.jpg)\n\n*图 5-1a。维度可以放置在详细级别上*\n\
  \n表计算是应用于视图中单个度量的所有值的计算/运算。表计算是 Tableau 的计算主力。它们计算传统“按 X 维度切片”领域之外的值。表计算允许用户扩展其数据。表计算是应用于整个表中所有值的计算，并且通常依赖于表结构本身。例如：表计算可用于计算每个月对年度利润的贡献。\n\
  \n有两种简单的方法可以处理表计算：\n\n- 使用快速表计算。快速表计算是常用表计算的集合（例如累计总和、差异、百分比差异、排名、百分位数等）。\n- 使用表计算函数从头创建您自己的表计算。\n\
  \n请参考图 5-1b。\n\n![A428041_1_En_5_Fig1b_HTML.jpg](img/A428041_1_En_5_Fig1b_HTML.jpg)\n\
  \n*图 5-1b。应用于度量“销售额”的表计算。注意 SUM(销售额) 旁边的三角形标记*\n\n在图 5-1b 中，维度 `区域` 放置在行功能区上，度量\
  \ `销售额` 放置在标记卡上的 `标签` 上。表计算 `总计百分比` 应用于度量 `销售额`。该表计算是 `总计百分比`；因此，当所有单元格值相加时，其总和为\
  \ 100%。\n\n表计算使用两个字段：分区字段和寻址字段。为了理解表计算，理解这些字段如何工作非常重要。它们本质上定义了表计算“是什么”以及“如何”执行它们。\n\
  \n**分区字段**：此字段用于将数据分区到多个桶中。然后，计算会对这些数据桶进行操作。换句话说，它们定义了计算的范围或分组。范围可以是整个表、窗格、单元格、维度，也可以为更高级的计算进一步自定义。\n\
  \n**寻址字段**：此字段提供了我们希望计算进行的方向。它定义了每个分区的锚点或源点。它定义了计算的根。\n\n示例：计算一段时间内（跨年）按细分市场分区的累计总和。这里\
  \ `细分市场` 是分区字段，`日期` 是寻址字段。\n\n**注意**：Tableau 处理计算字段、筛选器和表计算的顺序：\n\n1. Tableau 生成查询并将其发送到数据库进行处理。\n\
  2. 数据库处理查询。Tableau 会考虑所有计算字段，包括详细级别计算。\n3. 最后，应用表计算。\n\n## 5.2 销售额的累计总和\n\n累计总和是一个数字序列的总和，每次向序列中添加一个数字时都会更新。它也被称为“部分和”。\n\
  \n例如：我们有一个数字序列“5, 2, 4, 7, 8”。要获得累计总和，首先将 5+2 得到 7。然后将 7 加上 4 得到 11，再将 11 加上 7 得到\
  \ 18，最后将 18 加上 8 得到 26。\n\n### 5.2.1 演示 1\n\n**目标**：计算“销售额的累计总和”（使用表向下计算）。\n\n**使用的数据集**：“示例\
  \ – 超级商店.xls”\n\n**预期输出**：如图 5-2 所示。\n\n![A428041_1_En_5_Fig2_HTML.jpg](img/A428041_1_En_5_Fig2_HTML.jpg)\n\
  \n*图 5-2。按区域划分的季度销售额*\n\n#### 5.2.1.1 步骤\n\n请按照提供的步骤操作。\n\n##### 5.2.1.1.1 步骤 1\n\
  \n将 `示例 – 超级商店.xls` 中的数据读入 Tableau（如图 5-3 所示）。\n\n![A428041_1_En_5_Fig3_HTML.jpg](img/A428041_1_En_5_Fig3_HTML.jpg)\n\
  \n*图 5-3。从“示例 - 超级商店.xls”读入 Tableau 的数据*\n\n##### 5.2.1.1.2 步骤 2\n\n*表 5-1。在视图中要执行的任务*\n\
  \n| 列功能区 | `订单日期`：将其设置为 `离散`。粒度应为 `年`。度量名称：`SUM(销售额)` `SUM(销售额)`：添加一个表计算，`累计总和`，并让它计算累计总和，`表向下`。\
