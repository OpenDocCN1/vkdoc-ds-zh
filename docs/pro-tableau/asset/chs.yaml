  \n*图 3-102. 显示分组成员图标的弹出菜单*\n\n##### 步骤 5\n\n对维度成员进行分组的另一种方法是右键单击维度成员并选择 `Group`，如图\
  \ 3-103 所示。\n\n![A428041_1_En_3_Fig103_HTML.jpg](img/A428041_1_En_3_Fig103_HTML.jpg)\n\
  \n*图 3-103. “Group” 选项*\n\n##### 步骤 6\n\n选中的成员被组合在一起，如图 3-104 所示。这样，您就可以纠正数据错误。\n\
  \n![A428041_1_En_3_Fig104_HTML.jpg](img/A428041_1_En_3_Fig104_HTML.jpg)\n\n*图 3-104.\
  \ 分组成员 “CA & California”*\n\n##### 步骤 7\n\n您可以在数据窗格下方的维度区域中看到新创建的组（如图 3-105 所示）。行功能区被替换为新创建的组字段，如图\
  \ 3-106 所示。\n\n![A428041_1_En_3_Fig106_HTML.jpg](img/A428041_1_En_3_Fig106_HTML.jpg)\n\
  \n*图 3-106. 行功能区上的 “State(group)”*\n\n![A428041_1_En_3_Fig105_HTML.jpg](img/A428041_1_En_3_Fig105_HTML.jpg)\n\
  \n*图 3-105. 显示 “State (group)” 的数据窗格*\n\n#### 从数据窗格中的维度创建组\n\n下面我们来讨论如何从数据窗格中的维度创建组。\n\
  \n##### 步骤 1\n\n连接到 Sample - Superstore 数据源并转到一张工作表。\n\n##### 步骤 2\n\n从数据窗格中选择 `Sub-Category`\
