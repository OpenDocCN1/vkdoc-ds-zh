  图 5-27. 带有表计算的度量 `Sales` 被放置在标记卡的 `Label` 上\n亏损以蓝色显示，盈利以橙色显示。\n\n## 5.4 移动平均\n它有多种名称，如滚动平均、运行平均、滚动均值或运行均值。\n\
  \n### 5.4.1 应用场景\n*   在金融数据（如股票价格、收益率等）的技术分析中。\n*   用于判断市场状况。它应用于时间序列数据，以消除短期价格波动或噪音，并突出长期趋势。\n\
  *   用于识别趋势和反转。移动平均是滞后指标。它们从不用于预测新趋势，而是在趋势确立后确认趋势。例如：当股价高于移动平均线且平均线向上倾斜时，该股票被视为处于上升趋势。同样，当股价低于移动平均线且平均线向下倾斜时，该股票被视为处于下降趋势。\n\
  *   用于衡量资产动能的强度。这与计算移动平均所选择的时间段有关。\n    *   短期动能：<=20 天\n    *   中期动能：20 到 100 天\n\
  \    *   长期动能：> 100 天\n*   规划交易策略的宝贵工具。\n*   有助于创建许多其他技术指标，例如移动平均收敛发散 (`MACD`) 或布林带。\n\
  *   有助于进行随机指标测量。\n\n### 5.4.2 移动平均的类型\n**简单移动平均**: 通过对一组给定值取算术平均值来计算。\n**加权移动平均**:\
  \ 用于确保最近的值对平均值的影响最大。它使用线性加权的值。例如：最旧的值权重为 1，次旧的值权重为 2，依此类推……直到最新的值获得最高权重。\n**指数移动平均**:\
  \ 这与简单移动平均类似。不同之处在于，简单移动平均会在新值出现时移除旧值，而指数移动平均则从指定点开始，计算所有历史范围的平均值。\n**注意要点**: 移动平均是滞后指标。它们基于市场已经发生的事件。它们不是预测性指标。\n\
