  \n图 5-14. `累计总和` – 演示 1 – 最终输出\n\n## 5.3 占总计百分比形式的盈利能力\n\n占总计的百分比也称为百分比分布。它的计算公式是将一个数量除以总数。例如：要找出以下数字中每个数字的占总计百分比：100、400\
  \ 和 600，首先将所有数字相加得到总数。总数是 `(100+400+600) = 1100`。然后找出数字 100 占总数 1100 的百分比。可以这样计算：`(100\
  \ / 1100) * 100 = 9.090%`。\n\n### 5.3.1 演示 1\n\n目标：展示多个年份（2011、2012、2013 和 2014）中，每个区域每个细分市场每个产品类别的`占总计百分比形式的盈利能力`。\n\
