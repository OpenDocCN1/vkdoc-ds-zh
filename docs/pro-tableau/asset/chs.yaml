  \n*图 5-7。度量“销售额”放置在标记卡上的“标签”上*\n\n\n\n### 5.2.1.1.6 第 6 步\n\n向度量 `Sum (Sales)` 添加一个快速表计算“**累计总和**”，并将\
  \ `Running Total` 设置为 `Table Down`（如图 5-8 所示）。\n\n![A428041_1_En_5_Fig8_HTML.jpg](img/A428041_1_En_5_Fig8_HTML.jpg)\n\
