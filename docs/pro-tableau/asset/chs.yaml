  \n---\n\n## 排序\n\n借助排序功能，您可以按指定顺序排列维度成员。\n\n### 为何要排序？\n\n为了按字母顺序或数字顺序等顺序显示数据。\n\
  \n#### 设想一下……\n\n您就职于一家名为“XYZ”的零售店。该公司希望根据购买量为排名前 10 的客户提供一定比例的优惠。“XYZ”的副总裁要求您生成一份按“销售额”显示“前\
  \ 10 名客户”的报告。在这种情况下，您可以应用排序来按“销售额”显示前 10 名客户的姓名。\n\n### 什么是排序？\n\n排序允许您按特定顺序排列维度。排序有两种类型：\n\
  \n-   计算排序\n-   手动排序\n\n### 如何应用排序？\n\n您可以通过不同方式应用排序：\n\n-   计算排序\n-   手动排序\n- \
  \  嵌套排序\n\n#### 计算排序\n\n当您应用某些程序化规则进行排序时，称为计算排序。例如：按字母顺序对产品名称进行排序。计算排序包括对轴进行排序和对特定字段进行排序。\n\
  \n#### 在轴上进行排序\n\n使用轴上的排序按钮进行快速的计算排序。\n\n**步骤 1**\n\n连接到 `Sample-Superstore` 数据源。将数据窗格下维度区域的维度\
  \ `Category`（类别）和 `Sub-Category`（子类别）拖动到行功能区。将数据窗格下度量区域的度量 `Sales`（销售额）拖动到列功能区（如图\
  \ 3-54 所示）。\n\n![A428041_1_En_3_Fig54_HTML.jpg](img/A428041_1_En_3_Fig54_HTML.jpg)\n\
  \n图 3-54. 维度 `Category`（类别）和 `Sub-Category`（子类别）放置在行功能区，度量 `Sales`（销售额）放置在列功能区\n\
  \n**步骤 2**\n\n转到视图中的 `Sub-Category`（子类别）字段，将鼠标光标悬停在轴上。将显示一个排序图标，如图 3-55 所示。\n\n\
  ![A428041_1_En_3_Fig55_HTML.jpg](img/A428041_1_En_3_Fig55_HTML.jpg)\n\n图 3-55. `Sub-Category`（子类别）字段的排序轴\n\
  \n**步骤 3**\n\n点击一次可按升序排序；再次点击该轴可按降序对 `Sub-Category`（子类别）字段排序，如图 3-56 所示。\n\n![A428041_1_En_3_Fig56_HTML.jpg](img/A428041_1_En_3_Fig56_HTML.jpg)\n\
  \n图 3-56. `Sub-Category`（子类别）字段已按降序排序\n\n第三次点击 `Sub-Category`（子类别）轴可清除排序。\n\n####\
  \ 对特定字段进行排序\n\n我们来讨论对特定字段进行排序的步骤。\n\n**步骤 1**\n\n连接到 `Sample-Superstore` 数据源。将数据窗格下维度区域的维度\
  \ `Category`（类别）和 `Sub-Category`（子类别）拖动到行功能区。将数据窗格下度量区域的度量 `Sales`（销售额）拖动到列功能区（如图\
  \ 3-57 所示）。\n\n![A428041_1_En_3_Fig57_HTML.jpg](img/A428041_1_En_3_Fig57_HTML.jpg)\n\
  \n图 3-57. 维度 `Category`（类别）和 `Sub-Category`（子类别）放置在行功能区，度量 `Sales`（销售额）放置在列功能区\n\
  \n**步骤 2**\n\n右键单击 `Sub-Category`（子类别）字段，选择“排序”选项，如图 3-58 所示。\n\n![A428041_1_En_3_Fig58_HTML.jpg](img/A428041_1_En_3_Fig58_HTML.jpg)\n\
  \n图 3-58. 带有“排序”选项的 `Sub-Category`（子类别）字段\n\n**步骤 3**\n\n打开排序对话框。将“排序顺序”指定为“降序”，将“排序依据”指定为字段，如图\
  \ 3-59 所示。您可以选择“数据源顺序”，它将根据数据源顺序对数据进行排序。默认的数据源顺序是按字母顺序。“字段”则根据另一个字段的关联值对数据进行排序。\n\
  \n![A428041_1_En_3_Fig59_HTML.jpg](img/A428041_1_En_3_Fig59_HTML.jpg)\n\n图 3-59.\
  \ “排序 [子类别]”对话框，显示“排序顺序”为降序，“排序依据”为字段\n\n**步骤 4**\n\n当您点击“确定”后，`Sub-Category`（子类别）字段将根据其\
  \ `Sales`（销售额）的总和进行排序，如图 3-60 所示。\n\n![A428041_1_En_3_Fig60_HTML.jpg](img/A428041_1_En_3_Fig60_HTML.jpg)\n\
  \n图 3-60. `Sub-Category`（子类别）字段已根据其 `Sales`（销售额）的总和进行排序\n\n#### 手动排序\n\n另一种在表中重新排列维度的方式是临时拖动它们。这被称为手动排序。\n\
  \n有两种执行手动排序的方法：\n\n-   使用工具栏和工具提示进行排序\n-   通过拖放进行排序\n\n#### 使用工具栏排序\n\n**步骤 1**\n\
  \n连接到 `Sample-Superstore` 数据源。将数据窗格下维度区域的维度 `Category`（类别）拖动到行功能区。将数据窗格下度量区域的度量\
  \ `Sales`（销售额）拖动到列功能区（如图 3-61 所示）。\n\n![A428041_1_En_3_Fig61_HTML.jpg](img/A428041_1_En_3_Fig61_HTML.jpg)\n\
  \n图 3-61. 维度 `Category`（类别）放置在行功能区，度量 `Sales`（销售额）放置在列功能区\n\n**步骤 2**\n\n使用工具栏上的排序按钮对字段进行升序或降序排序，如图\
  \ 3-62 所示。\n\n![A428041_1_En_3_Fig62_HTML.jpg](img/A428041_1_En_3_Fig62_HTML.jpg)\n\
  \n图 3-62. 工具栏上的排序按钮\n\n\n\n### 3.2.3.6 拖放排序\n\n下面我们来讨论执行“拖放排序”的步骤。\n\n#### 3.2.3.6.1\
  \ 步骤 1\n\n连接到 `Sample-Superstore` 数据源。将数据窗格下维度区域中的维度 `Category` 拖放到行功能区。将数据窗格下度量区域中的度量\
  \ `Sales` 拖放到列功能区（如图 3-63 所示）。\n\n![A428041_1_En_3_Fig63_HTML.jpg](img/A428041_1_En_3_Fig63_HTML.jpg)\n\
