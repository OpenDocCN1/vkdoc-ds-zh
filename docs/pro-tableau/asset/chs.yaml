  \ 从给定的 R 表达式返回一个整数结果。R 表达式被直接传递到正在运行的 Rserve 实例。在 R 表达式中使用 `.arg#` 来引用参数。\n\n语法：`SCRIPT_INT(string,\
  \ expression, ...)`\n\n**什么是 k-means 聚类？**\n\nk-means 聚类意味着形成 k 个组/簇。维基百科将其解释为：“k-means\
  \ 聚类旨在将 n 个观测值 [划分](https://en.wikipedia.org/wiki/Partition_of_a_set#Partition%20of%20a%20set)\
  \ 为 k 个簇，其中每个观测值属于具有最近 [均值](https://en.wikipedia.org/wiki/Mean#Mean) 的簇，该均值作为该簇的\
  \ [原型](https://en.wikipedia.org/wiki/Prototype#Prototype)”。\n\nK-means 聚类是最简单的无监督学习算法。它之所以是无监督的，是因为只需指定簇的数量。K-means\
  \ 在没有关于观测值属于哪个簇的任何信息的情况下，自行“学习”簇。\n\n从原始数据开始 ➤ 将其传递通过聚类算法 ➤ 获取数据的簇\n\nK-means 聚类的工作原理如下：\n\
  \n1.  选择 K 个质心。簇质心是簇的中心。\n2.  将每个数据点分配给它最近的质心。\n3.  将质心重新计算为簇中所有数据点的平均值（即，质心是 p\
  \ 长度的均值向量，其中 p 是变量的数量）。\n4.  将数据点分配给它最近的质心。\n\nK-means 聚类持续执行步骤 3 和 4，直到无法重新分配观测值或达到最大迭代次数（R\
  \ 默认使用 10 次）。\n\n**目标：** 将 `Cars.xlsx` 中的给定数据分成三个簇。\n\n**输入：** `Cars.xlsx`。数据集如图\
  \ 11-24 所示：\n\n![A428041_1_En_11_Fig24_HTML.jpg](img/A428041_1_En_11_Fig24_HTML.jpg)\n\
  \n图 11-24. 用于 k-means 聚类演示的数据集\n\n**预期输出：** 如图 11-25 所示。\n\n![A428041_1_En_11_Fig25_HTML.jpg](img/A428041_1_En_11_Fig25_HTML.jpg)\n\
  \n图 11-25. `SCRIPT_INT` 函数 - K-means 聚类 - 预期输出\n\n#### 创建簇的步骤\n\n##### 步骤 1\n\n\
  将 `Cars.xlsx` 中的数据读取到 Tableau 中（如图 11-26 所示）。\n\n![A428041_1_En_11_Fig26_HTML.jpg](img/A428041_1_En_11_Fig26_HTML.jpg)\n\
  \n图 11-26. 将来自 `Cars.xlsx` 的数据读取到 Tableau 中\n\n##### 步骤 2\n\n创建一个名为 `Cluster` 的计算字段，如图\
