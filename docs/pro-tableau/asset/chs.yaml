  \n图 2-13. 数据源页面上的四个主要区域\n\nTableau 提供两种类型的连接：\n\n*   **实时：** 这将允许实时提取数据。\n*   **提取：**\
  \ 这是关于以固定频率提取数据。\n\n### 2.2.5 工作区\n\n工作区包含数据窗格、卡和货架，以及一个或多个工作表。这些工作表可以是工作表、故事或仪表板。卡和货架可用于构建视图（如图\
  \ 2-14 所示）。\n\n![A428041_1_En_2_Fig14_HTML.jpg](img/A428041_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14. Tableau 工作区\n\n用于创建故事的工作区与用于创建仪表板的工作区有很大不同。\n\n### 2.2.6 工作簿和工作表\n\nTableau\
  \ 工作簿与 Microsoft Excel 工作簿非常相似。一个工作簿可以包含一个或多个工作表。这些工作表可以是工作表、故事或仪表板。工作簿是所有工作的容器。工作簿将帮助您组织、执行分析以及保存和分享结果。\n\
  \n*   **工作表** 表示一个单独的视图，包含数据窗格、卡、货架和图例。\n*   **仪表板** 表示来自多个工作表的视图集合。\n*   **故事**\
  \ 表示一系列工作表或仪表板的序列，用于传达某些信息。\n\n### 2.2.7 Tableau 中的视觉提示和图标\n\n让我们讨论一下 Tableau 中的一些视觉提示和图标。\n\
