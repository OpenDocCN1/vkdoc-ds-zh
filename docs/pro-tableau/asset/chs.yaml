  \n图 2-91. 按 `Market` 划分的 `Sales` 视图\n\n## 2.9 数据提取\n数据源的已保存子集称为提取。数据提取可用于：\n- 提升性能：当您只希望处理数据子集时，筛选提取有助于限制服务器负载。\n\
  - 使用 Tableau 功能：您可以使用 `Count Distinct` 等 Tableau 功能，这些功能在原始数据源中不可用。\n- 提供数据的离线访问：当您无法访问服务器时，可以将数据提取到本地数据源。\n\
  \n### 2.9.1 演示 1\n让我们学习如何创建提取。\n\n#### 2.9.1.1 创建提取的步骤\n请遵循以下步骤。\n\n##### 2.9.1.1.1\
  \ 步骤 1\n在数据源页面，选择 `提取` 并点击 `编辑` 以打开 `提取数据` 窗口（如图 2-92 所示）。\n\n![A428041_1_En_2_Fig92_HTML.jpg](img/A428041_1_En_2_Fig92_HTML.jpg)\n\
  \n图 2-92. `提取` 选项\n\n##### 2.9.1.1.2 步骤 2\n将显示 `提取数据` 对话框（如图 2-93 所示）。\n\n![A428041_1_En_2_Fig93_HTML.jpg](img/A428041_1_En_2_Fig93_HTML.jpg)\n\
  \n图 2-93. `提取数据` 对话框\n\n##### 2.9.1.1.3 步骤 3\n您可以通过添加筛选器来限制提取的数据。点击 `添加` 按钮以添加筛选器。选择\
  \ `State` 字段（如图 2-94 所示）作为筛选条件，然后点击确定。\n\n![A428041_1_En_2_Fig94_HTML.jpg](img/A428041_1_En_2_Fig94_HTML.jpg)\n\
  \n图 2-94. 已为筛选条件选择 `State` 字段\n\n##### 2.9.1.1.4 步骤 4\n`筛选器 [State]` 对话框出现。从州列表中，仅选择\
  \ `California`（如图 2-95 所示），然后点击确定。\n\n![A428041_1_En_2_Fig95_HTML.jpg](img/A428041_1_En_2_Fig95_HTML.jpg)\n\
  \n图 2-95. `筛选器[State]` 对话框，已勾选 `California`\n\n##### 2.9.1.1.5 步骤 5\n勾选 `聚合可见维度的数据`\
  \ 以按默认聚合方式聚合度量。这有助于最小化提取文件大小并提升性能。同时选择 `向上滚动日期到` 以指定日期级别（如年、月），并选择 `行数` 以显示特定行数（如图\
  \ 2-96 所示）。\n\n![A428041_1_En_2_Fig96_HTML.jpg](img/A428041_1_En_2_Fig96_HTML.jpg)\n\
  \n图 2-96. 显示提取条件的提取数据窗口\n\n##### 2.9.1.1.6 步骤 6\n观察数据网格中关于 `California` 州的详细信息（如图\
  \ 2-97 所示）。\n\n![A428041_1_En_2_Fig97_HTML.jpg](img/A428041_1_En_2_Fig97_HTML.jpg)\n\
  \n图 2-97. 仅显示 `California` 州详细信息的的数据网格\n\n##### 2.9.1.1.7 步骤 7\n当您转到工作表 1 时，将出现\
  \ `将提取另存为` 对话框，用于保存您的提取（如图 2-98 所示）。\n\n![A428041_1_En_2_Fig98_HTML.jpg](img/A428041_1_En_2_Fig98_HTML.jpg)\n\
  \n图 2-98. 用于保存提取的 `将提取另存为` 对话框\n\n## 2.10 要点须知\n- Tableau 拥有一个用于分析的高速内存数据引擎。\n-\
  \ Tableau 为数据库提供各种数据连接器，并为连接任何没有原生连接器的系统提供通用的 ODBC 连接器。\n- 并非所有数据库都支持所有联接。\n- Tableau\
  \ 提取有助于提升性能，并提供对数据的离线访问。\n\n## 2.11 下一步\n在下一章中，我们将重点学习以下内容：\n- 筛选\n- 排序\n- 分组\n\
  - 层次结构\n- 集\n\n"
- "# 3. 简化与排序数据\n第 2 章向我们介绍了 Tableau Desktop 架构、Tableau 环境、连接到不同数据源、联接、自定义 SQL、数据混合和数据提取。本章将帮助我们理解如何通过以下方式简化、排序和切分数据：\n\
  - 筛选\n- 排序\n- 离散日期和连续日期\n- 组\n- 层次结构\n- 集\n- 组和集的区别\n- 创建参数\n\n## 3.1 筛选\n让我们探索如何使用筛选来简化数据。\n\
  \n### 3.1.1 为什么需要筛选？\n筛选允许您显示数据源中满足特定条件的记录。通过应用筛选器，您可以限制视图中的数据，而无需更改底层对象的设计。\n\n\
  #### 3.1.1.1 设想一下…\n您在领先企业 `XYZ Co.` 工作。您负责为所有员工维护一个仪表板。该仪表板向所有员工显示相同的信息，例如部门内的员工人数、本部门所属的项目、其业务部门的运营所在地等。然而，仪表板中有一个报告会显示员工的年度绩效评级。该信息对于每个员工来说是唯一的。由于这是机密信息，您有责任将年度绩效评级的可见性限制为仅属于该员工本人。此场景需要您使用筛选器向每位员工显示相关数据。\n\
  \n\n\n### 3.1.2 什么是筛选？\n\n筛选功能允许包含或排除字段中的特定值。你可以使用筛选条件在窗体、报表、查询或数据表中显示特定记录，或者仅从报表、表或查询中打印特定记录。\n\
  \n### 3.1.3 如何应用\"筛选\"？\n\nTableau 提供了以下筛选选项：\n\n1.  维度筛选\n2.  度量筛选\n3.  快速筛选\n\
  4.  上下文筛选\n5.  级联筛选\n6.  计算筛选\n7.  数据源筛选\n\n#### 3.1.3.1 维度筛选\n\n维度是分类值。对此类字段应用筛选可让你选择要包含或排除的值。维度筛选包括：\n\
  \n*   基本分类筛选\n*   通配符匹配筛选\n*   筛选条件\n*   筛选限制\n\n接下来，我们将通过几个演示提供逐步指导，展示如何对维度进行筛选。\n\
  \n#### 3.1.3.2 基本分类筛选\n\n你可以使用`常规`选项卡来包含或排除某个字段的值。\n\n##### 3.1.3.2.1 步骤 1\n\n连接到`Sample-Superstore`数据源，将数据窗格下方维度区域中的维度`Order\
  \ Date`拖至列功能区。将层级设置为`Quarter`。将数据窗格下方度量区域中的度量`Sales`拖至行功能区。默认聚合方式为`SUM`。请参考图 3-1。\n\
  \n![A428041_1_En_3_Fig1_HTML.jpg](img/A428041_1_En_3_Fig1_HTML.jpg)\n\n图 3-1. 维度`Order\
  \ Date`放置在列功能区，度量`Sales`放置在行功能区\n\n##### 3.1.3.2.2 步骤 2\n\n将数据窗格下方维度区域中的维度`Category`拖至标记卡上的`颜色`（如图\
  \ 3-2 所示）。\n\n![A428041_1_En_3_Fig2_HTML.jpg](img/A428041_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2. 维度`Category`放置在标记卡的`颜色`上\n\n##### 3.1.3.2.3 步骤 3\n\n将数据窗格下方维度区域中的维度`Category`拖至`筛选`功能区。拖放时，系统会弹出筛选窗口。默认情况下，`从列表中选择`处于启用状态，如图\
  \ 3-3 所示。从列表中选择`Furniture`和`Technology`类别，然后单击`确定`以将筛选条件包含在视图中，如图 3-4 所示。\n\n![A428041_1_En_3_Fig4_HTML.jpg](img/A428041_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4. 筛选窗口显示选中的类别`Furniture`和`Technology`\n\n![A428041_1_En_3_Fig3_HTML.jpg](img/A428041_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3. 筛选窗口显示`Category`维度的值\n\n##### 3.1.3.2.4 步骤 4\n\n请注意，`Sales`仅按季度显示`Furniture`和`Technology`类别（如图\
  \ 3-5 所示）。\n\n![A428041_1_En_3_Fig5_HTML.jpg](img/A428041_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5. 视图按`Quarter`显示`Furniture`和`Technology`的`Sales`\n\n##### 3.1.3.2.5 步骤 5\n\
  \n你还可以编辑筛选条件以排除某些值。要编辑筛选条件，右键单击`Category`字段，然后选择`编辑筛选条件...`选项，如图 3-6 所示。\n\n![A428041_1_En_3_Fig6_HTML.jpg](img/A428041_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6. `编辑筛选条件...`选项\n\n#### 3.1.3.3 筛选的通配符匹配\n\n你可以使用`筛选`对话框中的`通配符`选项卡来定义用于筛选的模式。\n\
  \n##### 3.1.3.3.1 步骤 1\n\n将数据窗格下方维度区域中的维度`Sub-Category`拖至行功能区，将订单日期拖至列功能区，并将层级设置为`Quarter`。将数据窗格下方度量区域中的度量`Sales`拖至行功能区（如图\
  \ 3-7 所示）。\n\n![A428041_1_En_3_Fig7_HTML.jpg](img/A428041_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7. 维度`Order Date`放置在列功能区，维度`Sub-Category`和度量`Sales`放置在行功能区\n\n##### 3.1.3.3.2\
  \ 步骤 2\n\n将数据窗格下方维度区域中的维度`Sub-Category`拖至`筛选`功能区。选择`通配符`选项卡，然后选择`开头为`选项。在匹配值对话框中输入`C`，以包含以`C`开头的子类别值（如图\
  \ 3-8 所示）。\n\n![A428041_1_En_3_Fig8_HTML.jpg](img/A428041_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8. 通配符选项卡显示`匹配值`为`开头为 C`\n\n##### 3.1.3.3.3 步骤 3\n\n单击`确定`按钮后，视图将仅显示那些以`C`开头的子类别值。\n\
  \n![A428041_1_En_3_Fig9_HTML.jpg](img/A428041_1_En_3_Fig9_HTML.jpg)\n\n图 3-9. 将通配符选项`开头为\
  \ C`应用于`Sub-Category`字段后的视图\n\n#### 3.1.3.4 筛选条件\n\n你可以使用条件选项卡来指定筛选规则。\n\n#####\
  \ 3.1.3.4.1 在筛选中使用条件的步骤\n\n##### 3.1.3.4.2 步骤 1\n\n参考通配符筛选演示。\n\n在`筛选`功能区中，右键单击`Sub-Category`字段以编辑筛选条件。移除通配符匹配筛选条件中描述的通配符筛选，然后选择条件选项卡来指定条件筛选。例如，你只对显示销售额大于或等于\
  \ 200,000 的子类别感兴趣，如图 3-10 所示。你可以使用`按字段`来使用内置控件，或使用`按公式`来编写自定义公式。\n\n![A428041_1_En_3_Fig10_HTML.jpg](img/A428041_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10. 筛选窗口显示`Sales`字段的条件标准\n\n##### 3.1.3.4.3 步骤 2\n\n单击`确定`后，你会看到更新的视图，如图 3-11\
  \ 所示。\n\n![A428041_1_En_3_Fig11_HTML.jpg](img/A428041_1_En_3_Fig11_HTML.jpg)\n\n\
  图 3-11. 对`Sales`字段应用条件标准后的更新视图\n\n##### 3.1.3.4.4 步骤 3\n\n你还可以使用自定义公式来指定筛选条件。单击`按公式`并输入自定义公式，如图\
  \ 3-12 所示。\n\n![A428041_1_En_3_Fig12_HTML.jpg](img/A428041_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12. 筛选窗口显示`Sales`字段的条件标准\n\n#### 3.1.3.5 筛选限制\n\n你可以使用`顶部`选项卡来定义一个计算公式，对视图中的数据进行计算。\n\
  \n##### 3.1.3.5.1 在筛选中使用限制的步骤\n\n##### 3.1.3.5.2 步骤 1\n\n移除`条件`筛选部分中描述的条件筛选，并在筛选对话框中选择`顶部`选项卡来定义公式，如图\
  \ 3-13 所示。例如，你想按销售额显示前 3 个子类别。\n\n![A428041_1_En_3_Fig13_HTML.jpg](img/A428041_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13. `顶部`选项卡显示按`销售额`显示`前 3 个子类别`的公式\n\n##### 3.1.3.5.3 步骤 2\n\n单击`确定`按钮后，视图将更新为按`销售额`显示前三个`子类别`（如图\
  \ 3-14 所示）。\n\n![A428041_1_En_3_Fig14_HTML.jpg](img/A428041_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14. 视图按`销售额`显示`前 3 个子类别`\n\n\n\n### 3.1.3.6 按度量筛选\n\n度量是定量数据。对此类数据进行筛选时，可以选定一个值的范围，将其包含在视图中。它包含基本的定量筛选器。\n\
  \n我们来看几个演示。这些演示将提供逐步指导，展示如何对度量进行筛选。\n\n#### 3.1.3.6.1 基本定量筛选器\n\n定量筛选器允许你选择要包含的值的范围。\n\
  \n#### 3.1.3.6.2 步骤 1\n\n连接到 `Sample-Superstore` 数据源。将数据窗格下维度区域的维度 `Sub-Category`\
  \ 拖到列 shelf，并将数据窗格下度量区域的度量 `Profit` 拖到行 shelf（如图 3-15 所示）。`Profit` 字段应用的默认聚合是 `SUM`。\n\
  \n![A428041_1_En_3_Fig15_HTML.jpg](img/A428041_1_En_3_Fig15_HTML.jpg)\n\n*图 3-15.*\
  \ 维度 `Sub-Category` 放置在列 shelf 上，度量 `Profit` 放置在行 shelf 上\n\n#### 3.1.3.6.3 步骤 2\n\
  \n将数据窗格下维度区域的维度 `Sub-Category` 拖到标记卡上的 `Color`，如图 3-16 所示。\n\n![A428041_1_En_3_Fig16_HTML.jpg](img/A428041_1_En_3_Fig16_HTML.jpg)\n\
  \n*图 3-16.* 维度 `Sub-Category` 放置在标记卡上的 `Color` 上\n\n#### 3.1.3.6.4 步骤 3\n\n将数据窗格下度量区域的度量\
  \ `Profit` 拖到 `Filters` shelf。此时会打开一个 `Filter field` 对话框；选择筛选条件所需的聚合函数，如图 3-17 所示，然后单击\
  \ `Next` 按钮。\n\n![A428041_1_En_3_Fig17_HTML.jpg](img/A428041_1_En_3_Fig17_HTML.jpg)\n\
  \n*图 3-17.* `Filter Field[Profit]` 对话框，显示聚合函数列表\n\n#### 3.1.3.6.5 步骤 4\n\n例如，你希望仅显示\
  \ `Profit` 值范围在 1,000 到 20,000 之间的 `Sub-Category`。对于此类视图，你可以使用 `Range of values`。使用范围滑块指定值，如图\
  \ 3-18 所示。共有四种类型的定量筛选器。\n\n![A428041_1_En_3_Fig18_HTML.jpg](img/A428041_1_En_3_Fig18_HTML.jpg)\n\
  \n*图 3-18.* `Filter[Profit]` 对话框，显示 `Range of values`\n\n- **Range of values（值的范围）**：包括该范围内最小值和最大值之间的所有值。\n\
  - **At least（至少）**：包括大于或等于指定最小值的所有值。\n- **At most（至多）**：包括小于或等于指定最大值的所有值。\n- **Special（特殊）**：帮助你筛选空值。仅包括空值、非空值或所有值。\n\
  \n#### 3.1.3.6.6 步骤 5\n\n观察更新后的视图，该视图仅显示 `Profit` 范围在 1,000 到 20,000 之间的 `Sub-Category`（如图\
  \ 3-19 所示）。\n\n![A428041_1_En_3_Fig19_HTML.jpg](img/A428041_1_En_3_Fig19_HTML.jpg)\n\
  \n*图 3-19.* 应用范围筛选器后的结果视图（仅显示 `Profit` 范围在 1,000 到 20,000 之间的 `Sub-Category`）\n\n\
  #### 3.1.3.6.7 步骤 6\n\n可以使用左下角的 `Show` 选项在 `Only relevant values` 和 `All values\
  \ in database` 之间切换，如图 3-20 所示。\n\n![A428041_1_En_3_Fig20_HTML.jpg](img/A428041_1_En_3_Fig20_HTML.jpg)\n\
  \n*图 3-20.* `Show` 选项，用于选择 `Only relevant values` 和 `All values in database`\n\n\
  ### 3.1.3.7 快速筛选器\n\n快速筛选器可以帮助你直接在视图中修改筛选选择。\n\n#### 3.1.3.7.1 步骤\n\n#### 3.1.3.7.2\
  \ 步骤 1\n\n连接到 `Sample-Superstore` 数据源。将数据窗格下维度区域的维度 `Category`、`Sub-Category` 拖到行\
  \ shelf。将数据窗格下度量区域的度量 `Sales` 拖到列 shelf（如图 3-21 所示）。\n\n![A428041_1_En_3_Fig21_HTML.jpg](img/A428041_1_En_3_Fig21_HTML.jpg)\n\
  \n*图 3-21.* 维度 `Category`、`Sub-Category` 放置在行 shelf 上，度量 `Sales` 放置在列 shelf 上\n\n\
  #### 3.1.3.7.3 步骤 2\n\n将数据窗格下维度区域的维度 `Sub-Category` 拖到标记卡上的 `Color`（如图 3-22 所示）。\n\
  \n![A428041_1_En_3_Fig22_HTML.jpg](img/A428041_1_En_3_Fig22_HTML.jpg)\n\n*图 3-22.*\
  \ 维度 `Sub-Category` 放置在标记卡上的 `Color` 上\n\n#### 3.1.3.7.4 步骤 3\n\n在视图的任何位置右键单击 `Sub-Category`\
  \ 字段，然后选择 `Show Filter` 选项以显示快速筛选器，如图 3-23 所示。\n\n![A428041_1_En_3_Fig23_HTML.jpg](img/A428041_1_En_3_Fig23_HTML.jpg)\n\
  \n*图 3-23.* `Show Filter` 选项\n\n#### 3.1.3.7.5 步骤 4\n\n观察工作表右侧的 `Sub-Category` 快速筛选器。该筛选器会自动添加到\
  \ Filters shelf，如图 3-24 所示。\n\n![A428041_1_En_3_Fig24_HTML.jpg](img/A428041_1_En_3_Fig24_HTML.jpg)\n\
  \n*图 3-24.* 显示 `Quick Filter` 的视图\n\n#### 3.1.3.7.6 步骤 5\n\n你可以通过选择所需的子类别来修改筛选选择，如图\
  \ 3-25 所示。\n\n![A428041_1_En_3_Fig25_HTML.jpg](img/A428041_1_En_3_Fig25_HTML.jpg)\n\
  \n*图 3-25.* 显示所选 `Sub-Category` 的 `SUM(Sales)` 的更新视图\n\n#### 3.1.3.7.7 步骤 6\n\n\
  你还可以通过单击插入符号来编辑快速筛选器的外观（布局模式）和功能，如图 3-26 所示。\n\n![A428041_1_En_3_Fig26_HTML.jpg](img/A428041_1_En_3_Fig26_HTML.jpg)\n\
  \n*图 3-26.* 编辑 `Quick Filter` 的选项\n\n布局模式包括 `Single Value (List)`、`Single Value\
  \ (Dropdown)` 等。\n\n#### 3.1.3.7.8 步骤 7\n\n你可以通过单击插入符号并选择 `Edit Title` 来编辑 `Sub-Category`\
  \ 快速筛选器的标题，如图 3-27 所示。\n\n![A428041_1_En_3_Fig27_HTML.jpg](img/A428041_1_En_3_Fig27_HTML.jpg)\n\
  \n*图 3-27.* 显示 `Edit Title` 选项的下拉菜单\n\n#### 3.1.3.7.9 步骤 8\n\n输入标题，如图 3-28 所示，然后单击\
