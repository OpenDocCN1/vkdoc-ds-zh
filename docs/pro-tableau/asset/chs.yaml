  \n图 7-38. “分布”类型的选项\n\n## 7.12 趋势线\n\n趋势线允许您逐步构建交互式的行为模型。借助趋势线，您可以回答诸如“利润是否可以通过销售额预测”之类的问题。\n\
  \n### 7.12.1 用趋势线回答问题\n\n让我们从一个问题开始：\n\n**目标**：是什么导致了超市的高折扣率？\n\n#### 7.12.1.1 绘制趋势线以回答问题的步骤\n\
  \n按照以下步骤来回答这个问题。\n\n##### 7.12.1.1.1 步骤 1\n\n构建如下图 7-40 所示的视图。\n\n![A428041_1_En_7_Fig40_HTML.jpg](img/A428041_1_En_7_Fig40_HTML.jpg)\n\
  \n图 7-40. 维度“订单日期”放置在列架上；层次结构设置为“季度”，度量“AVG(折扣)”放置在行架上\n\n##### 7.12.1.1.2 步骤 2\n\
  \n首先，我们将从“装运模式”变量开始测试。假设是少数几种“装运模式”的折扣率可能很高。将维度“装运模式”从数据窗格下的维度区域拖到行架上（如图 7-41 所示）。\n\
  \n![A428041_1_En_7_Fig41_HTML.jpg](img/A428041_1_En_7_Fig41_HTML.jpg)\n\n图 7-41.\
  \ 维度“装运模式”放置在行架上\n\n##### 7.12.1.1.3 步骤 3\n\n转到分析窗格，双击“趋势线”（如图 7-42 所示）以显示趋势线（如图\
  \ 7-43 所示）。\n\n![A428041_1_En_7_Fig43_HTML.jpg](img/A428041_1_En_7_Fig43_HTML.jpg)\n\
  \n图 7-43. 显示“装运模式”趋势线的视图\n\n![A428041_1_En_7_Fig42_HTML.jpg](img/A428041_1_En_7_Fig42_HTML.jpg)\n\
  \n图 7-42. 显示“趋势线”的分析窗格\n\n##### 7.12.1.1.4 步骤 4\n\n右键单击任意趋势线。\n\n##### 7.12.1.1.5\
  \ 步骤 5\n\n选择“描述趋势模型...”（如图 7-44 所示）来描述趋势模型（如图 7-45 所示）。\n\n![A428041_1_En_7_Fig45_HTML.jpg](img/A428041_1_En_7_Fig45_HTML.jpg)\n\
  \n图 7-45. 显示“装运模式”的 p 值的“描述趋势模型”\n\n![A428041_1_En_7_Fig44_HTML.jpg](img/A428041_1_En_7_Fig44_HTML.jpg)\n\
  \n图 7-44. 描述趋势模型\n\n趋势线模型的描述显示，“装运模式”的 p 值为 0.40，不显著。因此，我们不能用“装运模式”来预测折扣率。\n\n#####\
  \ 7.12.1.1.6 步骤 6\n\n接下来，让我们考虑维度“制造商”。有些制造商偶尔会提供大幅折扣。从行架上移除“装运模式”，并将“制造商”拖到行架上（如图\
  \ 7-46 所示）。\n\n![A428041_1_En_7_Fig46_HTML.jpg](img/A428041_1_En_7_Fig46_HTML.jpg)\n\
  \n图 7-46. 维度“制造商”放置在行架上\n\n##### 7.12.1.1.7 步骤 7\n\n打开描述的趋势模型。参见图 7-47。\n\n![A428041_1_En_7_Fig47_HTML.jpg](img/A428041_1_En_7_Fig47_HTML.jpg)\n\
  \n图 7-47. 显示“制造商”的 p 值的“描述趋势模型”\n\n趋势线模型的描述显示，“制造商”的 p 值为 0.0001，是显著的。因此，我们可以用“制造商”来预测折扣率。\n\
  \n在统计学中，p 值表示结果的重要性。\n\n- p 值小（通常 ≤ 0.05）表明模型是显著的。\n- p 值大（> 0.05）表明模型不显著。\n- 非常接近临界值（0.05）的\
  \ p 值被认为是临界的。\n\n## 7.13 预测\n\n预测有助于您根据历史值估算度量的未来值。Tableau 以较浅的颜色阴影显示估算值。\n\n预测中使用的技术是指数平滑法，它着眼于过去的趋势以帮助预测未来的结果。要创建预测，您至少需要一个维度和一个度量。\n\
  \n### 7.13.1 演示 1\n\n**目标**：预测一段时间内的销售额。\n\n\n\n### 7.13.1.1 创建预测的步骤\n\n请遵循以下步骤。\n\
  \n##### 步骤 1\n\n连接到 `Sample-Superstore.xls` 数据源。\n\n##### 步骤 2\n\n将“数据”窗格中“维度”区域下的维度\
  \ `Order Date` 拖至“列”功能区。将“数据”窗格中“度量”区域下的度量 `Sales` 拖至“行”功能区（如图 7-48 所示）。\n\n![A428041_1_En_7_Fig48_HTML.jpg](img/A428041_1_En_7_Fig48_HTML.jpg)\n\
  \n**图 7-48.** 维度 `Order Date` 置于“列”功能区，度量 `Sales` 置于“行”功能区。\n\n##### 步骤 3\n\n将 `Order\
  \ Date` 的层次结构设置为连续月份（如图 7-49 所示）。\n\n![A428041_1_En_7_Fig49_HTML.jpg](img/A428041_1_En_7_Fig49_HTML.jpg)\n\
  \n**图 7-49.** 选择“连续月份”。\n\n##### 步骤 4\n\n转至“分析”菜单，选择 `预测` ➤ `显示预测`（如图 7-50 所示）。\n\
