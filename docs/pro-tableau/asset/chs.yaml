  \n图 8-115. 甘特图 - 演示 2 - 最终输出结果\n\n## 8.8 散点图\n\n### 8.8.1 为什么使用散点图？\n\n为了可视化数值变量之间的关系。\n\
  \n### 8.8.2 什么是散点图？\n\n散点图是在笛卡尔平面上显示许多分散点的图表。\n\n### 8.8.3 相关系数\n\n相关性的强弱由相关系数 (`R`)\
  \ 决定。有时它也被称为“皮尔逊积矩相关系数”。相关性用从 `+1` 到 `-1` 的范围表示。`+1` 表示完全正相关，而 `-1` 表示完全负相关。值为零表示没有相关性。相关性并不意味着因果关系。可能存在一个未知因素同时对两个变量产生相似的影响。\n\
  \n#### 8.8.3.1 正相关\n\n正相关是方向相同的相关性。这意味着如果一个变量的值增加，另一个变量的值也增加。同样，如果一个变量的值减少，另一个变量的值也减少。换句话说，两个变量同向变化（如图\
  \ 8-116 所示）。\n\n![A428041_1_En_8_Fig116_HTML.jpg](img/A428041_1_En_8_Fig116_HTML.jpg)\n\
  \n图 8-116. 正相关\n\n#### 8.8.3.2 示例\n\n-   随着温度升高，铁棒的长度也会增加。\n-   随着燃料价格上涨，机票成本也会增加。\n\
  -   随着学生学习时长的增加，获得的分数也会提高。\n\n#### 8.8.3.3 负相关\n\n负相关是方向相反的相关性。这意味着如果一个变量的值增加，另一个变量的值就会减少，反之亦然（如图\
  \ 8-117 所示）。\n\n![A428041_1_En_8_Fig117_HTML.jpg](img/A428041_1_En_8_Fig117_HTML.jpg)\n\
  \n图 8-117. 负相关\n\n示例：随着产品价格上涨，对该产品的需求下降。\n\n#### 8.8.3.4 无相关或零相关\n\n如果两个变量之间没有关系，即一个变量的值发生变化而另一个变量的值保持不变，则称为无相关或零相关（如图\
  \ 8-118 所示）。\n\n![A428041_1_En_8_Fig118_HTML.jpg](img/A428041_1_En_8_Fig118_HTML.jpg)\n\
  \n图 8-118. 无相关或零相关\n\n### 8.8.4 如何在 Tableau 中绘制散点图？\n\n#### 8.8.4.1 演示 1\n\n目标：使用两个度量（`销售额`和`利润`），分别放置在列功能区和行功能区上，绘制一个简单的散点图。\n\
  \n输入：`Sample – Superstore.xls`\n\n预期输出：（如图 8-119 所示）。\n\n![A428041_1_En_8_Fig119_HTML.jpg](img/A428041_1_En_8_Fig119_HTML.jpg)\n\
