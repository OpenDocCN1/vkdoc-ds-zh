  \ 仪表板及其工作表被复制到新 Tableau 工作簿*\n\n### 1.6.6 Tableau 数据提取\n\n在 Tableau 中，您可以使用实时数据，也可以使用静态数据。换句话说，您可以基于最新数据进行分析和可视化，或者使用一个提取（本质上是根据所选条件对结果快照进行操作）。\n\
  \n#### 1.6.6.1 何时使用实时连接，何时使用提取？\n\n如果您的分析需要显示正在发生的当前状态，则应使用实时数据连接。但是，如果您的结果需要显示去年或上个季度等时间框架内的数据，则应使用提取。从实时模式切换到提取模式意味着您将处理数据的快照。\n\
  \n#### 1.6.6.2 提取选项在哪里？\n\n连接的提取选项位于 Tableau 的数据源页面上。在图 1-27 中，我们决定使用提取；但是，我们没有设置任何筛选器，因此将选择所有记录（9,994\
  \ 条）。然而，当底层数据源中的信息发生变化时，任何数据分析或可视化都不会自动更新。\n\n![A428041_1_En_1_Fig27_HTML.jpg](img/A428041_1_En_1_Fig27_HTML.jpg)\n\
  \n*图 1-27. 数据源页面上的“提取”选项*\n\n现在让我们为提取应用一个筛选器。点击`提取`选项旁边的`编辑`。定义筛选条件，如图 1-28 所示。\n\
  \n![A428041_1_En_1_Fig28_HTML.jpg](img/A428041_1_En_1_Fig28_HTML.jpg)\n\n*图 1-28.\
  \ 为“提取”选项设置“筛选”条件*\n\n定义提取后，当您进入数据表时，系统会要求您保存提取（如图 1-29 所示）。\n\n![A428041_1_En_1_Fig29_HTML.jpg](img/A428041_1_En_1_Fig29_HTML.jpg)\n\
  \n*图 1-29. “将提取另存为”对话框*\n\n保存提取并继续进入数据表。当您处理定义了筛选条件的`区域`维度时，您会注意到只有符合筛选条件的值才会显示（如图\
  \ 1-30 所示）。\n\n![A428041_1_En_1_Fig30_HTML.jpg](img/A428041_1_En_1_Fig30_HTML.jpg)\n\
  \n*图 1-30. 符合筛选条件的值已显示*\n\n如果您希望进一步编辑提取中的筛选条件或添加另一个筛选器，请右键单击工作表/视图中的数据源以调出上下文菜单。选择`提取数据`（如图\
  \ 1-31 所示）。\n\n![A428041_1_En_1_Fig31_HTML.jpg](img/A428041_1_En_1_Fig31_HTML.jpg)\n\
  \n*图 1-31. 编辑提取或为其添加另一个筛选器*\n\n根据需要设置您的筛选条件（如图 1-32 所示）。\n\n![A428041_1_En_1_Fig32_HTML.jpg](img/A428041_1_En_1_Fig32_HTML.jpg)\n\
  \n*图 1-32. 设置新的“筛选”条件*\n\n要验证并继续使用提取，请按如下方式执行快速检查：右键单击工作表/视图中的数据源以调出上下文菜单（如图 1-33\
  \ 所示）。\n\n![A428041_1_En_1_Fig33_HTML.jpg](img/A428041_1_En_1_Fig33_HTML.jpg)\n\n\
  *图 1-33. “使用提取”旁边的复选标记表示正在使用提取*\n\n请注意`使用提取`旁边的复选标记。如果您想停止使用提取并恢复使用实时数据连接，只需点击`使用提取`即可。\n\
  \n要使用`.tde`文件，请遵循以下步骤：\n\n**第 1 步**\n\n在数据源连接页面上，点击`其他文件`（如图 1-34 所示）。\n\n![A428041_1_En_1_Fig34_HTML.jpg](img/A428041_1_En_1_Fig34_HTML.jpg)\n\
  \n*图 1-34. 数据源连接页面上的“其他文件”选项*\n\n**第 2 步**\n\n找到`.tde`文件（如图 1-35 所示）。\n\n![A428041_1_En_1_Fig35_HTML.jpg](img/A428041_1_En_1_Fig35_HTML.jpg)\n\
  \n*图 1-35. “打开”对话框窗口，用于定位并打开`.tde`文件*\n\n选择该文件。点击`打开`。输出结果如图 1-36 所示。\n\n![A428041_1_En_1_Fig36_HTML.jpg](img/A428041_1_En_1_Fig36_HTML.jpg)\n\
  \n*图 1-36. 显示符合“提取”的“筛选”条件的数据*\n\n\n\n#### 1.6.6.3 使用数据提取的优点：\n\n- **便携性**\n\n你的报表和仪表板使用存储在数据库服务器（如\
  \ Oracle 或 MS SQL Server）上的数据。你即将乘坐航班，并希望在飞行途中继续处理这些数据。你明白在这种情况下，无法建立与数据的实时连接。此时，使用数据提取就成了救星。如果你选择使用数据提取，就能省去连接数据服务器的麻烦。\n\
  \n如果你有权访问 Tableau Server，就可以在需要时安排数据提取的刷新。\n\n- **性能**\n\n实时连接在 Tableau 部署中不需要大量存储空间，但你必须确保该数据源的速度不会成为性能瓶颈。\n\
  \n另一方面，根据数据的特定特征，数据提取可能需要大量存储空间。此外，你还需要在 Tableau Server 环境中使用更快的磁盘进行处理。\n\n- **优化数据提取**\n\
  \n创建数据提取后，下一个重点应该是优化数据提取。优化意味着 Tableau 将扫描你的数据中的任何计算字段，然后在数据提取中预先计算这些字段。这一定能提升性能，因为每次访问该字段时，无需在本地重新计算每个计算。\n\
  \n如果你的数据源有计算字段，特别是复杂的计算，那么你应该探究一下，看看优化的数据提取是否能在性能上优于实时连接。\n\n- **处理大型文本文件或 Excel\
  \ 文件时，数据提取尤为适用**\n\n如果你的数据源是一个大型文本文件或 Excel 文件，你会立即从创建数据提取中获益。\n\n文本和 Excel 数据会从源文件中提取出来，并加载到\
  \ Tableau 高性能列式数据引擎中，该引擎专为可视化分析而设计。\n\n- **数据提取中的过滤器有助于创建精简的数据子集**\n\n在 `Data >\
  \ Extract` 下的“提取选项”中，系统会提示你向数据提取添加过滤器（如图 1-37 所示）。\n\n![A428041_1_En_1_Fig37_HTML.jpg](img/A428041_1_En_1_Fig37_HTML.jpg)\n\
  \n图 1-37. 使用 `Extract Data` 对话框指定要提取的数据量\n\n你的数据源可能非常庞大；但是，你可能不需要整个数据集来完成所需的分析。过滤器有助于从庞大的数据源中精确定位到必要的记录，从而创建一个精简的数据子集。\n\
  \n较小的数据提取需要较少的计算能力。\n\n- **增量提取**\n\n有两种刷新提取中数据的方法（如图 1-38 所示）。它们是：\n\n- **完整提取**：完整提取会用数据源中的一个新文件覆盖\
  \ Tableau 数据引擎中现有的数据提取。\n- **增量提取**：增量提取将有助于追加自上次创建提取以来新增的记录。例如，如果你的数据提取必须每天刷新，这将特别有用。你可以通过选中\
  \ `Data Extract` 对话框中的 `Incremental Refresh` 复选框来实现。\n\n![A428041_1_En_1_Fig38_HTML.jpg](img/A428041_1_En_1_Fig38_HTML.jpg)\n\
  \n图 1-38. 使用 `Extract Data` 窗口刷新数据提取\n\n- **创建打包工作簿**\n\n如果你正在处理来自 SQL Server 或\
  \ Oracle 等数据库的数据，并且需要与未安装 Tableau Desktop（专业版或个人版）的人共享工作簿，则需要在共享前打包工作簿。除非创建数据提取，否则无法打包存储在远程服务器上的数据。\n\
  \n- **发布到 Tableau Public**\n\n如果你想将数据发布到网络上，则必须使用数据提取。\n\n- **数据安全性**\n\n想象一下，你在一家大公司的人力资源部门工作。你负责员工数据库。有些关于员工的信息是绝对不能共享的。然而，有一小部分关于员工技能和能力的信息是可以共享的。你决定使用数据提取来创建一个打包工作簿。数据提取为你提供了\
  \ `Hides All Unused Fields`（隐藏所有未使用字段）的功能（如图 1-39 所示）。换句话说，它移除了你在基于该提取的任何可视化中未使用的维度和度量。\n\
  \n![A428041_1_En_1_Fig39_HTML.jpg](img/A428041_1_En_1_Fig39_HTML.jpg)\n\n图 1-39.\
  \ 使用 `Extract Data` 对话框中的 `Hide All Unused Fields` 功能\n\n你创建的数据提取随后可以安全地打包，并且可以放心，你不希望可见的字段甚至不在提取中，因此无法被访问。\n\
  \n使用同一个对话框，你可以通过过滤部分来限制数据集中包含的行（而非列）。\n\n## 1.7 要点记忆\n\n- 数据可视化是数据的图形化或图示化描述。\n\
  - 数据可视化帮助用户提出问题、得到问题的答案，并进一步提出后续问题。\n- 数据可视化有助于快速发现趋势、识别模式并理解复杂概念。\n- Tableau 拥有丰富的产品系列，例如\
  \ Tableau Desktop、Tableau Server、Tableau Online、Tableau Mobile、Tableau Reader 等。\n\
  - Tableau 中有多种文件类型，例如 Tableau 工作簿（`.twb`）、Tableau 打包工作簿（`.twbx`）、Tableau 数据提取（`.tde`）、Tableau\
  \ 数据源（`.tds`）等。\n- Tableau 有助于创建信息图。\n- Tableau Online 是 Tableau Server 在云端的托管版本。\n\
  - Tableau Reader 仅适用于 Tableau 打包工作簿。\n- 如果数据存储在远程服务器（如 Oracle、MS SQL Server）上，则无法创建\
  \ Tableau 打包工作簿。\n- Tableau 仪表板无法添加书签。\n\n\n\n## 1.8 作业\n\n1.  观看汉斯·罗斯林（Hans Rosling）的\
