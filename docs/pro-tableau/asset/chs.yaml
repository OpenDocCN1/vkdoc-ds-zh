  \ 要点提醒\n\n*   即使是不了解情况的受众也能轻松理解饼图。\n*   层次数据也称为树状结构数据。树图可用于表示层次数据。\n*   热图是一种数据的二维表示形式。热图使用颜色来显示数值。\n\
  *   突出显示表本质上是一个大型的文本表格，其中的数据值通过颜色进行编码。\n*   折线图以一系列由直线段连接的数据点的形式显示信息。\n*   散点图用于可视化数值变量之间的关系。\n\
  *   甘特图是项目进度的图形化表示。它有助于规划、协调和跟踪项目中的特定任务。\n*   堆叠条形图用于分解和比较整体的各个部分。\n*   使用标签云来突出显示重要的文本数据点。\n\
  \n## 8.12 后续步骤\n\n下一章将带您深入探索高级可视化。您将了解以下可视化图表：\n\n*   瀑布图\n*   凹凸图\n*   子弹图\n\n"
- '# 9. 高级可视化


  > “在优秀的信息可视化中，没有规则，没有准则，没有模板，没有标准技术，没有风格指南……你只需尽一切可能。” — 爱德华·塔夫特，数据科学家，数据可视化领域的先驱


  在上一章中，我们介绍了一些图表形式，例如条形图、饼图、折线图、散点图、直方图等。在本章中，我们将介绍以下内容：


  *   瀑布图

  *   凹凸图

  *   子弹图


  ## 9.1 瀑布图


  瀑布图是描绘顺序过程如何对整体做出贡献的强大工具。换句话说，它通过分解正向和负向贡献的累积效应，有助于展示如何得出净值。瀑布图的其他名称包括飞行砖图、马里奥图，在金融领域特别称为桥梁图。


  ### 9.1.1 瀑布图可以在哪些场景下使用？


  瀑布图在许多不同的情况下都很有用。


  以下仅举几例：


  *   假设您在一家领先公司的法律部门工作。您负责公司的所有交易和合同。您从上年结转的交易和合同开始本财年。再加上全年赢得的交易和合同。然后，您去掉全年取消的合同。最后，在年底，您将得到最终实现的合同总数。

  *   瀑布图有助于可视化财务报表。

  *   瀑布图用于浏览关于人口、出生和死亡的数据。

  *   假设您是一名参加了 GRE 研究生入学考试的学生。您希望评估自己的表现。您希望看到您在语文和数学部分答对的题目数量，以及您在两个部分（语文+数学）中答错的题目数量。然后，您希望将两个分数相加，最终得出总分。


  现在让我们看一些示例。这些示例将提供创建瀑布图的分步说明。


