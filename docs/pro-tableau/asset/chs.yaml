  ```\nWINDOW_AVG(Sum(Amount))\n```\n\n或者\n\n```\nAVG( {Fixed [Customer Name] : Sum(Amount)})\n\
  ```\n\n`1,050` 这个值与我们为“每位客户的平均销售额”计算的值相匹配。\n\n## 5.7 百分位数\n\n百分位数将数据集分为 100 个相等的部分。百分位数衡量的是从底部开始的位置。它们用于确定个体在群体中的相对位置。换句话说，它们提供了一个个体的排名位置。我们在哪里见过百分位数的应用？它通常用于考试成绩和毕业排名。毕业排名指的是个体在毕业时相对于其他毕业生的位置。\n\
  \n**定义：** 百分位数是一种衡量标准，用于确定低于该衡量标准的总频率百分比。百分位数排名是低于给定分数的分数所占的百分比。\n\n**公式：** 要确定一个分数\
  \ `x` 在总分数 `n` 中的百分位数排名，公式为：\n\n`Percentile Rank = ((Number of scores below x) /\
  \ n) * 100`\n\n**示例：** 在一个 200 名学生的班级中，Mason 排名第 25 位。他在班级中的百分位数排名是：\n\n`(175 /\
  \ 200) * 100 = 87.5%`\n\n在 `87.5%` 这个水平上，他的分数比班级中 `88%` 的学生都要好。\n\n### 5.7.1 演示\
  \ 1\n\n**目标：** 计算八年级学生的百分位数。\n\n**输入：** `Percentile.xlsx`\n\n`Percentile.xlsx` 中提供的样本数据集。\n\
  \n![A428041_1_En_5_Figd_HTML.jpg](img/A428041_1_En_5_Figd_HTML.jpg)\n\n**预期输出：**\
