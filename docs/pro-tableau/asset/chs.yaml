  \n图 11-27. 正在创建的计算字段 `Cluster`\n\n`SCRIPT_INT` 函数调用 R 中的 `kmeans` 函数，并将维度 `Petrol`\
  \ 和 `Kilometers` 作为参数传递给它。R 中的 `kmeans` 函数返回数据簇。\n\nR 中 `kmeans()` 函数的语法：\n\n```\n\
  kmeans(x, centers, iter.max=10)\n```\n\n其中：\n- `x` 是一个数据框或矩阵。所有值必须是数值型。\n- `centers`\
  \ 是 K 均值的 K。例如，`centers = 5` 将创建 5 个簇。\n- `iter.max` 是算法重复簇分配和移动质心的次数。\n\n#####\
