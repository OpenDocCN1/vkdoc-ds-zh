  \ | 在时间、空间或顺序上不间断延伸的特征 |\n| 示例 | 假设你是一家领先零售公司的高管。你的数据集包含四年（2010、2011、2012 和 2013）的销售数据。你想确定无论年份，哪个月份的销售额最高。换句话说，这意味着各年份（2010、2011、2012、2013）的销售数据已按月汇总。请参考图\
  \ 3-79。 | 假设你是一家零售公司的高管。你的数据集包含四年（2010、2011、2012 和 2013）的销售数据。你想确定在四年（2010 – 2014）中哪个月份的销售额最高。请参考图\
  \ 3-80。 |\n| 字段默认类型是什么？ | 当从数据窗格的维度区域将字段拖到行或列功能区时，该字段默认为“离散”。示例：`Customer ID`、`Customer\
  \ Name` | 当从数据窗格的度量区域将字段拖到行或列功能区时，该字段默认为“连续”。示例：`Unit Price`、`Order Quantity` |\n\
  | Tableau 创建 | 轴标题 | 轴 |\n| 视觉提示 | 蓝色药丸 | 绿色药丸 |\n| 历史背景 | 离散变量只能取有限的一组值。示例：如果从\
  \ 0 数到 10，有 11 个不同的值。处理离散值时，不会考虑 2.6 或 9.3 等值。 | 连续变量可以取无限的一组值。示例：如果从 0 数到 10，0\
  \ 到 10 之间有无限多个值。 |\n| 排序次序 | 例如：离散日期可以按销售额升序或降序排序。请参考图 3-81。 | 由于连续日期构成一个连续轴，它们默认按时间顺序排列，最旧的日期在最左端，最新的日期在最右端。不允许更改顺序。\
  \ |\n| 首选图表形式 | 条形图 | 折线图 |\n\n#### 3.2.5.1 如何在 Tableau 中使用离散日期？\n\n我们来讨论创建离散日期的步骤。\n\
