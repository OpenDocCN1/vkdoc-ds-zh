  \n    图 2-7. `Discover` 页面\n\n### 2.2.4 数据源页面\n\n您需要先建立与数据的初始连接，才能进入**数据源页面**。您可以按照以下步骤连接到\
  \ Excel 文件（`Sample – Superstore`）。\n\n请遵循以下步骤：\n\n#### 2.2.4.1 步骤 1\n\n在开始页面上，在\
