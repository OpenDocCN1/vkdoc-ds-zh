  ## 8.6 堆叠条形图


  堆叠条形图或堆叠柱状图用于分解和比较整体的各个部分。每个条形代表整体，条形内的分段代表整体的类别或部分。不同类别或部分使用不同颜色进行区分，便于理解。


  ### 8.6.1 演示 1


  想象一下……公共卫生部门进行了一项调查。调查问卷包含三个问题。共有 100 名受访者参与了调查。回答采用李克特量表，评分等级如下：


  *   非常不同意

  *   不同意

  *   中立

  *   同意

  *   非常同意


  以下是每个评分等级对应的受访者人数。


  ![A428041_1_En_8_Figa_HTML.jpg](img/A428041_1_En_8_Figa_HTML.jpg)


  目标：绘制每个评分等级的受访者百分比，其中`非常同意`和`同意`一起出现在正轴，`非常不同意`和`不同意`构成负轴。`中立`的受访者百分比一半出现在正轴，另一半出现在负轴。


  输入：`StackedBar.xlsx`


  预期输出：如图 8-66 所示。


  ![A428041_1_En_8_Fig66_HTML.jpg](img/A428041_1_En_8_Fig66_HTML.jpg)


  图 8-66. 堆叠条形图 - 演示 1 - 预期输出


