  \n*图 3-99. 自定义日期 “CustomDiscreteDateMonth” 放置在列功能区上*\n\n### 组\n\n组是构成更高级别类别的维度成员的组合。\n\
  \n### 为何使用组？\n\n使用组可以细化视图，并确定您想要引起注意的确切信息。\n\n### 什么是组？\n\n组允许您组合不同维度的成员以构成更高级别的类别。组对于纠正数据错误非常有用。\n\
  \n### 如何创建组？\n\n下面我们来讨论创建组的步骤。\n\n#### 创建组\n\n创建组以纠正数据错误。\n\n##### 步骤 1\n\n连接到 Sample\
  \ - Superstore 数据源。\n\n##### 步骤 2\n\n考虑如图 3-100 所示的视图。\n\n![A428041_1_En_3_Fig100_HTML.jpg](img/A428041_1_En_3_Fig100_HTML.jpg)\n\
  \n*图 3-100. 显示 “Category” 在各州表现情况的视图*\n\n在此视图中，`CA` 表示加利福尼亚州，但它显示为单独的条目。您可以通过将 `CA`\
  \ 和 `California` 分组来纠正此问题。\n\n##### 步骤 3\n\n按住 `CTRL` 键，选择 `CA` 和 `California`，如图\
  \ 3-101 所示。\n\n![A428041_1_En_3_Fig101_HTML.jpg](img/A428041_1_En_3_Fig101_HTML.jpg)\n\
  \n*图 3-101. 选中各州，“CA” 和 “California”*\n\n##### 步骤 4\n\n对维度成员进行分组的一种方法是将鼠标移动到选中区域以获取弹出菜单，然后选择回形针图标以对选中的州进行分组（如图\
