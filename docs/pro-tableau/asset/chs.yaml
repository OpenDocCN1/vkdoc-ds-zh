  \n*图 3-29.* 显示快速筛选器标题为 `Choose Sub-Category` 的视图\n\n### 3.1.3.8 上下文筛选器\n\n添加到可视化中的筛选器都是独立计算的，无论其他筛选器如何操作。你可以通过添加上下文筛选器来为筛选器添加上下文。一旦创建了上下文筛选器，所有其他筛选器都将使用这个新的数据集进行计算。\n\
  \n上下文筛选器是一个独立的筛选器；你设置的所有其他筛选器都被定义为依赖筛选器，因为它们只处理通过上下文筛选器的数据。\n\n上下文被计算一次以生成视图。然后，所有其他筛选器都相对于该上下文进行计算。\n\
  \n上下文筛选器：\n- 出现在 Filters shelf 的顶部。\n- 在 Filters shelf 上以灰色标识。\n- 不能在 shelf 上重新排列。\n\
  \n你可以创建一个上下文筛选器来：\n- **提高性能**：如果设置了很多筛选器或数据源很大，查询可能会很慢。你可以设置一个或多个上下文筛选器来提高性能。\n\
  - **创建依赖的数值或 Top N 筛选器**：你可以设置一个上下文筛选器来仅包含感兴趣的数据，然后设置数值或 Top N 筛选器。\n\n#### 3.1.3.8.1\
