- "# 2. 文本与表格元素\n\n在第一章中，你已经全面了解了 Streamlit 的核心功能，以及它与数据科学和机器学习领域其他竞争者的不同之处。我们还讨论了在不同平台上必要的安装步骤，并创建了属于我们自己的第一个\
  \ Streamlit 应用程序。\n\n在本章中，我们不仅将讨论如何以不同方式格式化文本，例如使用 Markdown、标题、代码块和 LaTeX，还将讨论如何在已创建的应用程序中添加标题、一级标题和二级标题。接下来，我们将研究表格数据元素，以及如何在应用程序中显示它们。\n\
  \n让我们从查看 Streamlit 库中可用的各种文本元素开始。\n\n## 文本元素\n\n我们将文本元素定义为带有描述的对象，这些描述在 Streamlit\
  \ 应用程序中用作标题、一级标题、二级标题、说明文字和纯文本。我们将从标题开始，将其作为我们的第一个文本元素。\n\n### 标题\n\n我们将开始在 Streamlit\
  \ 应用程序中编写一个标题。标题是区分大小写的，并且会显示在每个文档上，但这并非强制要求。换句话说，标题类似于一个章节的标题。清单 2-1 中的代码将生成图 2-1\
  \ 中的输出。\n\n![](img/532543_1_En_2_Fig1_HTML.jpg)\n\n一个深色矩形框，其中包含文本“this is our title”。\n\
  \n图 2-1\n\n显示标题\n\n```\n#### 导入 Streamlit 库\nimport streamlit as st\n#### 编写标题\n\
  st.title(\"This is our Title\")\n清单 2-1\n01_title.py\n```\n\n我们可以看到图 2-1 中显示的文本，即我们在\
  \ `st.title()` 函数中指定的文本。我们还可以在标题中添加锚点，以便导航到另一个链接或页面。（我们将在第 7 章中了解更多相关信息。）由于我们没有在标题示例中添加锚点，因此将使用我们为标题编写的相同文本来生成锚点，即\
  \ *This is our Title.* 我们现在来看看如何为标题添加锚点；请参见清单 2-2。\n\n```\n#### 导入 Streamlit 库\n\
  import streamlit as st\n#### 编写带锚点的标题\nst.title(\"This is our Title\", anchor=\"\
  Apress\")\n清单 2-2\n02_title_anchor.py\n```\n\n在清单 2-2 中，我们使用了 `Apress` 作为锚点。这用于将页面或页面中的某些部分链接到另一个页面或同一页面内的其他部分。锚点功能是可选的，如果不使用，也可以设置为\
  \ `None`。\n\n在接下来的部分中，我们将分别学习如何使用 Streamlit 库定义一级标题和二级标题。\n\n#### 一级标题\n\n我们都知道，一级标题用于表示应用程序中的一组内容。我们现在将定义\
  \ Streamlit 库中可用的内置一级标题函数。请参见清单 2-3。\n\n```\n#### 导入 Streamlit 库\nimport streamlit\
  \ as st\n#### 一级标题\nst.header(\"\"\"This is our Header\"\"\")\n清单 2-3\n03_header.py\n\
  ```\n\n图 2-2 显示了在我们的应用程序中显示的一级标题文本。现在，让我们在下一节中查看二级标题。\n\n![](img/532543_1_En_2_Fig2_HTML.jpg)\n\
  \n一个深色矩形框，其中包含文本“this is our header”。\n\n图 2-2\n\n显示一级标题\n\n#### 二级标题\n\n顾名思义，二级标题是一级标题的子类型。它写在一级标题之后，字体大小比一级标题小。清单\
  \ 2-4 显示了我们的示例，相关的输出在图 2-3 中。\n\n![](img/532543_1_En_2_Fig3_HTML.jpg)\n\n一个深色矩形框，其中包含文本“this\
  \ is our Sub-header”。\n\n图 2-3\n\n显示二级标题\n\n```\n#### 导入 Streamlit 库\nimport streamlit\
  \ as st\n#### 二级标题\nst.subheader(\"\"\"This is our Sub-header\"\"\")\n清单 2-4\n04_sub_header.py\n\
  ```\n\n我们也可以像对 `st.title()` 函数那样应用锚点参数。\n\n注意\n\n我们可以在 `st.title()`、`st.header()`\
  \ 和 `st.subheader()` 中使用锚点参数，但它是可选的。\n\n#### 说明文字\n\n说明文字通常与应用程序中的描述相关联。说明文字的大小很小；请参见清单\
  \ 2-5 和图 2-4。\n\n![](img/532543_1_En_2_Fig4_HTML.jpg)\n\n一个深色矩形框，其中包含文本“this is\
  \ our caption”。\n\n图 2-4\n\n显示说明文字\n\n```\n#### 导入 Streamlit 库\nimport streamlit\
  \ as st\n#### 说明文字\nst.caption(\"\"\"This is our Caption\"\"\")\n清单 2-5\n05_caption.py\n\
  ```\n\n我们知道，说明文字文本是一种解释，用于描述注释、脚注、表格、图像和视频。\n\n现在，让我们一次性比较所有三种类型的文本（标题、一级标题和说明文字），以了解它们的区别，并查看它们在\
  \ Streamlit 应用程序中的呈现方式。请参见清单 2-6 和图 2-5 中的输出。\n\n![](img/532543_1_En_2_Fig5_HTML.jpg)\n\
  \n一个深色矩形框，其中包含不同大小的文本：“this is our title”、“this is our header”、“this is our Sub-header”和“this\
  \ is our caption”。\n\n图 2-5\n\n通过在同一页面中显示标题、一级标题、二级标题和说明文字元素来比较它们\n\n```\n#### 导入\
  \ Streamlit 库\nimport streamlit as st\n### 标题\nst.title(\"\"\"This is our Title\"\
  \"\")\n#### 一级标题\nst.header(\"\"\"This is our Header\"\"\")\n#### 二级标题\nst.subheader(\"\
  \"\"This is our Subheader\"\"\")\n#### 说明文字\nst.caption(\"\"\"This is our Caption\"\
  \"\")\n清单 2-6\n06_comparison.py\n```\n\n既然我们已经了解了这三者之间的区别，我们将继续以纯文本格式编写文本。\n\n###\
  \ 纯文本\n\n让我们在应用程序中显示一些纯文本。其语法如下：\n\n```\nst.text(“your text”)\n```\n\n这个 `st.text()`\
  \ 函数将显示引号内编写的任何文本。该语法遵循 Python 中使用的相同字符串规则。文本可以用单引号、双引号或三引号编写，如清单 2-7 所示。图 2-6 显示了输出。\n\
  \n![](img/532543_1_En_2_Fig6_HTML.jpg)\n\n一张屏幕截图，显示一个矩形深色窗口，其中包含文本“Hi, People exclamations,\
  \ welcome to, Streamlit's world”。\n\n图 2-6\n\n显示纯文本\n\n```\n#### 导入 Streamlit 库\n\
  import streamlit as st\n#### 显示纯文本\nst.text(\"Hi,\\nPeople\\t!!!!!!!!!\")\nst.text('Welcome\
  \ to')\nst.text(\"\"\" Streamlit's World\"\"\")\n清单 2-7\n07_plain_text.py\n```\n\
  \n这就是纯文本在我们创建的应用程序中的显示方式。屏幕处于深色模式，因此我们看到应用程序的背景是黑色的。\n\n注意\n\n每次我们编写 `st.text()`\
  \ 函数时，它都会在应用程序中显示在新的一行上。\n\n在下一节中，我们将讨论如何从纯文本创建 Markdown 文本。\n\n\n\n### Markdown\n\
  \n`Markdown` 是一种用于创建格式化文本的标记语言。现在我们来看看如何在应用程序中使用标记语言显示纯文本。请参见清单 2-8 及图 2-7 中的输出。\n\
  \n![](img/532543_1_En_2_Fig7_HTML.jpg)\n\n截图显示了一个深色矩形窗口，其中包含文本“Hi, People exclamations,\
  \ welcome to, Streamlit's world.”。这是 markdown 格式的文本。\n\n**图 2-7** 显示 Markdown 格式的文本\n\
  \n```\n#Import Streamlit library\nimport streamlit as st\n#Displaying Markdown\n\
  st.markdown(\"# Hi,\\n# ***People*** \\t!!!!!!!!!\")\nst.markdown('## Welcome to')\n\
  st.markdown(\"\"\"### Streamlit's World\"\"\")\nListing 2-8\n08_markdown.py\n```\n\
  \n```\nst.markdown()\n```\n\n`st.markdown()` 函数中编写的文本必须使用标记语言，才能获得如图 2-7 所示的格式化文本。\n\
  \n### LaTeX\n\n`LaTeX` 是一种主要用于技术文档的格式化文本。`Streamlit` 支持以 `LaTeX` 格式编写的文本。请参见清单 2-9\
  \ 及图 2-8 中的输出。\n\n![](img/532543_1_En_2_Fig8_HTML.jpg)\n\n一个深色矩形屏幕，显示方程式 `cos 2\
  \ thetas`、`a + b` 的平方以及 `u` 对 `t` 的偏导数。\n\n**图 2-8** 使用 `LaTeX` 格式显示数学方程式\n\n```\n\
  #Import Streamlit library\nimport streamlit as st\n#Displaying Latex\nst.latex(r'''cos2\\\
  theta = 1 - 2sin²\\theta''')\nst.latex(\"\"\"(a+b)² = a² + b² + 2ab\"\"\")\nst.latex(r'''\\\
  frac{\\partial u}{\\partial t}\n= h² \\left( \\frac{\\partial² u}{\\partial x²}\n\
  + \\frac{\\partial² u}{\\partial y²}\n+ \\frac{\\partial² u}{\\partial z²} \\right)''')\n\
  Listing 2-9\n09_latex.py\n```\n\n### Code\n\n`Streamlit` 库提供了一定的灵活性来显示各种编程语言的代码。文本会像在代码编辑器中一样高亮显示。请参见清单\
  \ 2-10 及图 2-9 中的输出。\n\n```\n#### Import Streamlit library\nimport streamlit as st\n\
  #### Displaying Python Code\nst.subheader(\"\"\"Python Code\"\"\")\ncode = '''def\
  \ hello():\nprint(\"Hello, Streamlit!\")'''\nst.code(code, language='python')\n\
  #### Displaying Java Code\nst.subheader(\"\"\"Java Code\"\"\")\nst.code(\"\"\"public\
  \ class GFG {\npublic static void main(String args[])\n{\nSystem.out.println(\"\
  Hello World\");\n}\n}\"\"\", language='javascript')\nst.subheader(\"\"\"JavaScript\
  \ Code\"\"\")\nst.code(\"\"\" \n\ntry {\nadddlert(\"Welcome guest!\");\n}\ncatch(err)\
  \ {\ndocument.getElementById(\"demo\").innerHTML = err.message;\n}\n \"\"\")\nListing\
  \ 2-10\n10_code.py\n```\n\n如果我们不为指定的代码添加编程语言，那么代码将以无样式格式显示，就像我们使用 `HTML` 语言编写的代码一样。除非使用了多种语言，否则\
  \ `language` 选项不是必需的。我们还可以通过代码框右上角的快捷方式复制应用程序中编写的代码。\n\n![](img/532543_1_En_2_Fig9_HTML.jpg)\n\
  \n一个深色屏幕，显示 Python 代码、Java 代码和 Javascript 代码，并带有相应的代码和高亮显示的文本“hello, streamlit”、“hello\
  \ world”和“welcome guest”。\n\n**图 2-9** 显示代码块\n\n现在，我们将继续学习其他元素，即*数据元素*。这是 `Streamlit`\
  \ 应用程序中帮助定义数据以供探索的最佳功能之一。\n\n## 数据元素\n\n我们已经了解了如何在 `Streamlit` 应用程序中以各种格式表示文本数据。现在，我们将继续学习可在应用程序中显示的各种数据形式。让我们逐一了解这些数据元素。\n\
  \n### 数据框\n\n众所周知，数据框是数据科学和机器学习项目中使用的最重要的数据格式之一。它由二维数据组成，包含行和列，作为带标签的数据。`Streamlit`\
  \ 库以交互式表格格式显示数据框，这意味着表格是可滚动的，并且可以动态更改表格大小。请参见清单 2-11 及图 2-10 中的输出。\n\n![](img/532543_1_En_2_Fig10_HTML.jpg)\n\
  \n一个深色屏幕，显示一个包含 9 列的表格，列标题为数字 0、1、2、3、4、5、6 和 7，以及它们在 9 行中对应的值。\n\n**图 2-10** 显示带有滚动和筛选选项的数据框\n\
  \n```\n#### Import Necessary libraries\nimport streamlit as st\nimport pandas as\
  \ pd\nimport numpy as np\n#### defining random values in a dataframe using pandas\
  \ and numpy\ndf = pd.DataFrame(\nnp.random.randn(30, 10),\ncolumns=('col_no %d'\
  \ % i for i in range(10)))\nst.dataframe(df)\nListing 2-11\n11_dataframe.py\n```\n\
  \n我们可以固定应用程序中显示的数据框的高度和宽度。`Streamlit` 确定的默认大小是静态的，即使我们在应用程序内部更改表格大小，也不会受到影响。\n\n\
  > **注意：** 这也被称为*动态表格*，因为我们可以直接从应用程序更改表格中列的宽度和高度，而无需更改代码。\n\n我们可以使用 `highlight` 函数，通过最小值、最大值和空值来高亮显示数据框对象。请参见清单\
  \ 2-12。\n\n```\nimport streamlit as st\nimport pandas as pd\nimport numpy as np\n\
  #### defining random values in a dataframe using pandas and numpy\ndf = pd.DataFrame(\n\
  np.random.randn(30, 10),\ncolumns=('col_no %d' % i for i in range(10)))\n#### Highlighting\
  \ minimum value objects\nst.dataframe(df.style.highlight_min(axis=0))\nListing 2-12\n\
  12_dataframe_highlight.py\n```\n\n在清单 2-12 中，我们高亮显示了数据框中具有最小值的对象。图 2-11 显示了应用程序中高亮显示数据框最小值的效果。\n\
  \n![](img/532543_1_En_2_Fig11_HTML.jpg)\n\n一个包含 9 列的表格，列标题为数字 0、1、2、3、4、5、6 和 7，以及它们在\
  \ 9 行中对应的值。它在第 0 行和第 9 行高亮显示了值 -2.282765 和 -1.917296。\n\n**图 2-11** 显示数据框中高亮显示的对象\n\
  \n> **注意：** `Streamlit` Cloud 尚不支持将数据复制到剪贴板。\n\n我们将在下一节学习如何显示表格。\n\n### 表格\n\n众所周知，表格和数据框在本质上相似，都有行和列。但是，在\
  \ `Streamlit` 中显示的表格本质上是静态的，并直接显示在应用程序页面上。请参见清单 2-13 及图 2-12 中的输出。\n\n![](img/532543_1_En_2_Fig12_HTML.jpg)\n\
  \n一个深色屏幕，显示一个包含 10 列的表格，列标题为数字 0、1、2、3、4、5、6、7、8 和 9，以及它们在 20 行中对应的值。\n\n**图 2-12**\
  \ 以表格格式显示数据\n\n```\nimport streamlit as st\nimport pandas as pd\nimport numpy as\
  \ np\n#### defining random values in a dataframe using pandas and numpy\ndf = pd.DataFrame(\n\
  np.random.randn(30, 10),\ncolumns=('col_no %d' % i for i in range(10)))\n#### defining\
  \ data in table\nst.table(df)\nListing 2-13\n13_table.py\n```\n\n如图 2-12 所示，应用程序中显示的是完整的表格，而不是使用数据框显示的默认数据。这是表格和数据框之间的主要区别之一。\n\
  \n> **注意：** `Streamlit` 应用程序中定义的表格本质上是静态的，并且没有像我们在数据框中看到的那样，可以在用户界面内滚动和更改表格尺寸的选项。\n\
  \n接下来，我们将了解另一个数据元素，它允许我们以独特的方式显示数据。\n\n\n\n### 指标\n\n在 Streamlit 应用中，我们可以使用`metric()`函数通过指标来显示数据。该指标帮助用户轻松查看数据中的任何变化。我们可以定义数据的变化是正向、负向还是中性。\n\
  \n现在，我们将使用`metric()`函数在应用中显示温度数据。参见清单 2-14 和图 2-13 的输出。\n\n```\nimport streamlit\
  \ as st\n#### Defining Metrics\nst.metric(label=\"Temperature\", value=\"31 °C\"\
  , delta=\"1.2 °C\")\nListing 2-14\n14_metric.py\n```\n\n标签是`Temperature`，值是`31`，差值是`1.2`摄氏度。差值显示与标签关联的变化是正向、负向还是空值。参见图\
  \ 2-13。\n\n![](img/532543_1_En_2_Fig13_HTML.jpg)\n\n一个深色矩形屏幕，显示文本温度、31 摄氏度，以及一个向上的箭头和\
  \ 1.2 摄氏度。\n\n图 2-13\n\n显示温度指标\n\n类似地，我们可以通过为标签分配值和差值来显示任何指标，例如速度、降雨量、能量、卡路里等。参见清单\
  \ 2-15。\n\n```\nimport streamlit as st\n#Defining Columns\nc1, c2, c3 = st.columns(3)\n\
  #### Defining Metrics\nc1.metric(\"Rainfall\", \"100 cm\", \"10 cm\")\nc2.metric(label=\"\
  Population\", value=\"123 Billions\", delta=\"1 Billions\", delta_color=\"inverse\"\
  )\nc3.metric(label=\"Customers\", value=100, delta=10, delta_color=\"off\")\nst.metric(label=\"\
  Speed\", value=None, delta=0)\nst.metric(\"Trees\", \"91456\", \"-1132649\")\nListing\
  \ 2-15\n15_metric_all.py\n```\n\n在清单 2-15 中，我们可以看到 Streamlit 支持的不同指标格式。`delta`是帮助用户了解值是否发生变化的数值。`delta_color`是为正值和负值定义的颜色；这里我们分别使用绿色和蓝色。参见图\
  \ 2-14。\n\n![](img/532543_1_En_2_Fig14_HTML.jpg)\n\n一个深色矩形屏幕，显示文本降雨量、人口、客户、速度和树木，以及它们对应的差值。\n\
  \n图 2-14\n\n以多种形式显示指标\n\n我们还可以通过关闭指标来更改差值指示器为反向或中性。这在以下 JSON 示例中完成。\n\n### JSON\n\
  \n我们知道数据科学中的表格数据有时是 JSON 格式。JSON 格式是一种数据交换方式。它易于用户读写。当一个对象是字符串时，我们假设它将包含序列化的 JSON。清单\
  \ 2-16 展示了如何在 Streamlit 中将字符串或对象显示为 JSON 字符串。\n\n```\nimport streamlit as st\n#Defining\
  \ Nested JSON\nst.json\n(\n{ \"Books\" :\n[{\n\"BookName\" : \"Python Testing with\
  \ Selenium\",\n\"BookID\" : \"1\",\n\"Publisher\" : \"Apress\",\n\"Year\" : \"2021\"\
  ,\n\"Edition\" : \"First\",\n\"Language\" : \"Python\",\n},\n{\n\"BookName\": \"\
  Beginners Guide to Streamlit with Python\",\n\"BookID\" : \"2\",\n\"Publisher\"\
  \ : \"Apress\",\n\"Year\" : \"2022\",\n\"Edition\" : \"First\",\n\"Language\" :\
  \ \"Python\"\n}]\n}\n)\nListing 2-16\n16_json.py\n```\n\n这里我们在代码中使用了嵌套 JSON。图 2-15\
  \ 展示了它在应用中的显示效果。\n\n![](img/532543_1_En_2_Fig15_HTML.jpg)\n\n一个深色屏幕显示了一个 20 行的程序代码，其中包含书籍信息，包括书名、书籍\
  \ ID、出版商、年份、版本和语言。\n\n图 2-15\n\n显示 JSON 数据\n\n到目前为止，我们已经了解了如何在 Streamlit 应用中显示所有类型的数据格式。现在我们将检查另一种也可以在应用中显示数据的方法。\n\
  \n### `write()` 函数作为超级函数\n\n`write()` 函数类似于 Python 中的`print()`函数或 C 和 Java 中的`printf()`语句。`write()`函数是一个输出函数，用于在屏幕上显示内容。基本语法如下：\n\
  \n```\nst.write(input)\n```\n\n`write()` 函数有一个特别之处，它不仅仅显示文本。我们将看到`write()`函数如何以不同方式使用。首先，我们将使用`write()`函数实现一个数据框。参见清单\
  \ 2-17。\n\n```\nimport streamlit as st\nimport pandas as pd\n#### Dataframe in write\
  \ function\nst.write(pd.DataFrame({\n'column one': [5.436, 6.372, 3.645, 4.554,\
  \ 7.263],\n'column two': [99, 55, 75, 41, 37],\n}))\nListing 2-17\n17_write_df.py\n\
  ```\n\n在图 2-16 中，我们在`write()`函数中嵌入了一个数据框。类似地，我们可以在`write()`函数中引入多个参数。\n\n![](img/532543_1_En_2_Fig16_HTML.jpg)\n\
  \n一个屏幕截图显示了一个包含 3 列（标题为 column one 和 column two）以及它们对应 5 行值的表格。\n\n图 2-16\n\n使用`write()`函数显示数据框\n\
  \n现在我们将看到另一个在`write()`函数中嵌入多个参数的示例。参见清单 2-18。\n\n```\nimport streamlit as st\nimport\
  \ pandas as pd\nimport numpy as np\ndf = pd.DataFrame(\nnp.random.randn(30, 10),\n\
  columns=('col_no %d' % i for i in range(10)))\n#### defining multiple arguments\
