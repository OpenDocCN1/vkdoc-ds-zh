  ## 预测


  当点击`Analyze`按钮时，系统会对清洗后的文本进行处理。`TextBlob()`函数会为给定句子中的每个单词赋予一个值，用于预测情感倾向。系统会综合考虑每个单词的值，以判断文本是正面、负面还是中性。当文本值大于零时，表示正面情感；若小于零，则预测为负面情感；若等于零，则对应中性情感。参见代码清单
  9-4。


  ```

  if st.button("Analyze"):

  blob = TextBlob(text)

  result = blob.sentiment.polarity

  if result > 0.0:

  custom_emoji = '':blush:''

  st.success(''Happy : {}''.format(custom_emoji))

  elif result < 0.0:

  custom_emoji = '':disappointed:''

  st.warning(''Sad : {}''.format(custom_emoji))

  else:

  custom_emoji = '':confused:''

  st.info(''Confused : {}''.format(custom_emoji))

  st.success("Polarity Score is: {}".format(result))

  代码清单 9-4

  预测

  ```


