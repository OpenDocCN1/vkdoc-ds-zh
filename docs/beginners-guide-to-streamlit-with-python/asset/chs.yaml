  在本章中，我们讨论了可以在应用程序中使用的各种按钮。我们从默认按钮开始，然后介绍了可以包含多个选项的单选按钮。我们还讨论了复选框，其中可以有多个选项并进行选择。


  我们还看到了下拉菜单，用户只能从给定选项中选择一个。我们还介绍了多选菜单，我们可以从可用选项中选择多个或全部选项。然后，我们讨论了使用下载按钮下载文件。


