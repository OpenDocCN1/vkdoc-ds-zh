  \n一组程序代码的截图。它列出了使用和不使用短代码导入表情符号的步骤，这些表情符号包括雨云、咖啡、爱情酒店、抽象情侣、心形情侣和戒指。\n\n![](img/532543_1_En_4_Fig12_HTML.jpg)\n\
  \n一个深色屏幕描绘了一组表情符号。包括雨云、咖啡杯、建筑、超人和女超人、心形情侣和戒指。\n\n**图 4-12** 显示表情符号\n\n图 4-12 显示了我们使用和不使用短代码显示的表情符号。这里显示了诸如\
  \ `:rain_cloud:`、`:coffee:`、`:love_hotel:` 和 `:couple_with_heart:` 之类的短代码。我们也可以像为男性和女性超级英雄编写的那样，以文本格式编写表情符号。建议使用短代码编写表情符号，因为这样我们知道图片在应用程序中描绘的是什么。\n\
  \n您可以在 [`https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/`](https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/)\
  \ 查看 Streamlit 应用程序可用的所有表情符号短代码。您也可以使用其他表情符号网站显示任何其他不可用的表情符号。\n\n我们可以使用表情符号替换第 2\
  \ 章中涵盖的任何文本。\n\n## 总结\n\n在本章中，我们了解了如何在应用程序中显示各种格式的多媒体数据，例如图像、音频和视频。我们了解了如何从本地存储或\
  \ URL 显示图像。我们还了解了如何调整图像大小、定义多个图像以及将图像显示为背景。\n\n我们还研究了 Streamlit 中作为内置函数可用的气球和雪花动画。\n\
