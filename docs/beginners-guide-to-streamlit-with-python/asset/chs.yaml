- '# 3. 可视化


  在上一章中，你了解了如何在 Streamlit 中使用文本和表格形式的数据。在本章中，我们将学习什么是数据可视化，并探索 Streamlit 用于可视化数据的函数。之后，你将看到
  Streamlit 与各种 Python 库在数据可视化方面的灵活性。


  ## 可视化的重要性


  数据可视化对于帮助企业分析近期数据趋势非常重要。当数据以图表或图形的形式呈现时，更容易解读和解释。在数据科学和机器学习中，原始数据被可视化以建模趋势并得出关于数据的结论。


  此外，可视化数据更有利于各方之间的沟通以及关联数据的相关因素。可视化数据能让企业主、决策者和利益相关者更好地理解他们的数据，并帮助他们发展业务。


  ## Streamlit 中的可视化


  使用 Streamlit，我们可以开发用于可视化数据的自定义仪表板。我们还可以在 Streamlit 中创建任何类型的可视化工具，因为它支持所有 Python
  库。在本章中，我们将介绍几个主要的库，例如 Plotly、Altair、Seaborn 和 Matplotlib。我们还将讨论可以在 Streamlit 应用程序中可视化的各种图形。现在，我们将讨论可视化的目的。


  ## 可视化的目的


  对于数据科学家和业务分析师来说，可视化有助于识别所提供数据中的模式和错误。例如，在最近的疫情期间，科学家们将数据可视化，以向公众通报当前情况。从数据中识别出模式，以确定
  COVID 热点区域。这是通过各种类型的图表和图形完成的，例如条形图、折线图、热力图、饼图、散点图等。


  可视化数据有助于解决业务中的许多问题，并据此开发算法。这反过来又加快了在解决已识别的不准确性时的决策速度。在 Streamlit 中，我们可以用更少的代码创建可视化仪表板或工具。


  ## Streamlit 函数


  我们现在将讨论 Streamlit 中可用的内置可视化函数。


  ### 条形图


  要使用垂直条形图表示数据点，我们可以使用条形图。内置的 `st.bar_chart()` 函数可以在 Streamlit 应用程序中绘制数据点。它类似于 `st.altair_chart()`，后者将在本章后面定义。请参见代码清单
  3-1。


  ```

  import streamlit as st

  import pandas as pd

  import numpy as np

  st.title(''Area'')

  #### Defining dataframe with its values

  df = pd.DataFrame(

  np.random.randn(40, 4),

  columns=["C1", "C2", "C3", "C4"])

  #### Bar Chart

  st.bar_chart(df)

  Listing 3-1

  01_bar_chart.py

  ```


  `st.bar_chart()` 函数通过识别列及其关联值直接绘制图形，使其成为最容易使用的函数。在代码清单 3-1 中，我们没有定义任何与 x 轴和 y 轴相关的值。


  此函数的可定制性较低，我们不需要指定数据框的值。如图 3-1 所示，每列的值以不同颜色的垂直条形图绘制。


  接下来，我们将讨论折线图。


