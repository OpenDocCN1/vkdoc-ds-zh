  通过在 Streamlit 中定义列，图表可以上下堆叠或并排放置。这些列充当放置图表的容器。


  ## 总结


  可视化是数据科学和机器学习中的一个重要方面。可视化技术有助于数据科学家更好地理解数据。在本章中，我们从理解可视化基础开始，然后讨论了如何使用 Streamlit
  的内置函数在我们的应用程序中显示数据点。


  最后，我们讨论并实现了 Python 中可供数据科学和机器学习开发人员使用的不同可视化技术。


  在下一章中，我们将讨论如何在应用程序中实现媒体元素。




