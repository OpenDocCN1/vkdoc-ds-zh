  "选择您的性别",

  (''男性'', ''女性'', ''其他''))

  if gender == ''男性'':

  st.write(''您已选择男性。'')

  elif gender == ''女性'':

  st.write("您已选择女性。")

  else:

  st.write("您已选择其他。")

  清单 5-2

  02_radio_buttons.py

  ```


  默认情况下，第一个单选按钮被选中，但您可以通过索引进行更改。我们可以使用清单 5-3 中的代码来更改索引。图 5-3 显示了输出结果。


