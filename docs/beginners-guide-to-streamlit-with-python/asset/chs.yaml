  最后，我们将了解如何在 Streamlit 应用程序中使用 Plotly 实现子图。


  ### 子图


  子图用于将不同的图表并排加载。在 Plotly 中，我们可以使用 `make_subplots()` 方法创建多个图表，这些图表可以并排放置，也可以一个叠一个地堆叠。要定义子图，我们需要导入
  `plotly.subplots` 模块。参见代码清单 3-20。


  ```

  import streamlit as st

  import pandas as pd

  import plotly.graph_objects as go

  from plotly.subplots import make_subplots

  #### 数据集

  data = pd.read_csv("./files/avocado.csv")

  #### 精简数据集

  albany_df = data[data[''region'']=="Albany"]

  al_df = albany_df[albany_df["year"]==2015]

  fig = make_subplots(rows=3, cols=1)

  #### 第一个子图

  fig.add_trace(go.Scatter(

  x=al_df["Date"],

  y=al_df["Total Bags"],

  ), row=1, col=1)

  #### 第二个子图

  fig.add_trace(go.Scatter(

  x=al_df["Date"],

  y=al_df["Small Bags"],

  ), row=2, col=1)

  #### 第三个子图

  fig.add_trace(go.Scatter(

  x=al_df["Date"],

  y=al_df["Large Bags"],

  ), row=3, col=1)

  st.plotly_chart(fig)

  代码清单 3-20

  20_plotly_subplots.py

  ```


  在代码清单 3-20 中，我们通过定义三行一列来创建上下堆叠的图表。要将图表并排放置，我们可以增加列数。参见图 3-19。


