- '# 5. 按钮和滑块


  在本章中，我们将讨论如何创建不同类型的按钮。这些按钮是用户与应用程序交互的媒介。让我们开始逐一创建这些按钮。




  ## 按钮


  按钮通过以下语法创建：


  ```

  st.button(''button_name'')

  ```


  让我们使用此语法创建一个按钮；参见清单 5-1。


  ```

  import streamlit as st

  st.title(''创建按钮'')

  #### 定义一个按钮

  button = st.button(''点击这里'')

  if button:

  st.write(''您已点击了按钮'')

  else:

  st.write(''您尚未点击按钮'')

  清单 5-1

  01_button.py

  ```


  在清单 5-1 中，我们使用了一个 `if` 条件来判断按钮是否被点击。如果按钮被点击，则执行语句“您已点击了按钮”。如果按钮未被点击，则语句“您尚未点击按钮”生效。图
  5-1 显示了结果。


  ![](img/532543_1_En_5_Fig1_HTML.jpg)


  创建按钮的两个快照：一个显示“点击这里”，另一个显示“您尚未点击按钮”选项。第二个截图中“点击这里”按钮被高亮显示。


  **图 5-1** 按钮输出 a) 点击前 b) 点击后


