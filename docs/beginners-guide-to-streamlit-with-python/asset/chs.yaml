  add_local_backgound_image_('files/animal7.jpg')\n清单 4-4\n04_background_image.py\n\
  ```\n\n首先，我们打开一张图像并将其转换为 base64 编码格式。然后，我们定义一个函数，在该函数中使用 Markdown 将图像作为背景调用。我们可以为背景图像定义任何图像格式。图\
  \ 4-4 展示了结果。\n\n![](img/532543_1_En_4_Fig4_HTML.png)\n\n截图展示了一只乌龟在水中游泳的画面。图中显示“背景图像”字样，并注明图片来源为\
  \ Unplash。\n\n图 4-4\n\n图像作为背景\n\n在下一节中，我们将了解如何调整图像大小以在应用中显示。\n\n#### 调整图像大小\n\n\
  在机器学习中，图像会以统一尺寸进行训练，以便从中提取特征并获得图像模型。当模型部署后，我们想用新图像测试模型时，需要将图像调整到与训练模型相同的尺寸。因此，我们将了解如何调整图像大小。在图像上传时也会应用同样的方法。参见清单\
  \ 4-5 和图 4-5。\n\n![](img/532543_1_En_4_Fig5_HTML.png)\n\n两张截图展示了一群母狮和幼狮坐着的画面。其中包含原始图像和调整大小后的图像。\n\
  \n图 4-5\n\n显示 a) 原始图像和 b) 调整大小后的图像\n\n```\nimport streamlit as st\nfrom PIL import\
  \ Image\noriginal_image = Image.open(\"files/animal9.jpg\")\n#### 显示原始图像\nst.title(\"\
  原始图像\")\nst.image(original_image)\n#### 将图像调整为 600*400\nresized_image = original_image.resize((600,\
  \ 400))\n#### 显示调整大小后的图像\nst.title(\"调整大小后的图像\")\nst.image(resized_image)\n清单 4-5\n\
  05_image_resize.py\n```\n\n注意\n\n调整图像大小是为了与训练好的模型图像尺寸匹配。\n\n为了调整图像大小，我们使用了 PIL Python\
  \ 库。我们可以在应用中使用任何支持图像大小调整的 Python 库。\n\n在下一节中，我们将探讨音频数据。\n\n## 音频\n\n音频是一种多媒体文件类型，我们只能从文件中听到声音。我们可以通过\
  \ `st.audio()` 函数在应用中使用音频文件，如清单 4-6 所示。\n\n我们需要在第一条语句中使用 `rb` 参数以二进制模式打开音频文件，并传入音频文件名。之后，我们使用\
  \ Streamlit 的 `audio()` 函数，将保存音频的变量作为输入，从而在应用中显示音频文件。参见图 4-6。\n\n![](img/532543_1_En_4_Fig6_HTML.jpg)\n\
  \n深色屏幕上显示一个滑块条。左侧有一个播放按钮，接着是 0:20 / 0:29，然后是一个带有扬声器图标的长条，底部显示一个已下载文件的 URL。\n\n图\
  \ 4-6\n\n在应用中显示音频文件\n\n```\nimport streamlit as st\n#### 使用文件路径和文件名打开音频\nsample_audio\
  \ = open(\"files/audio.wav\", \"rb\")\n#### 读取音频文件\naudio_bytes = sample_audio.read()\n\
  #### 使用 st.audio() 函数显示音频，并将开始时间设置为 20\nst.audio(sample_audio, start_time = 20)\n\
  #### 打印音频来源\nst.write(\"音频来源：https://file-examples.com/index.php/sample-audio-files/sample-wav-download/\"\
  )\n清单 4-6\n06_audio.py\n```\n\n控制按钮会与音频文件一起显示在应用中。支持的音频文件类型是 MIME 类型。我们可以设置音频文件的开始播放时间。开始时间始终是一个整数值。\n\
  \n我们也可以使用 URL 来代替存储在本地磁盘上的音频文件。这是最佳特性之一，因为我们可以直接访问存储在云端或在线服务器上的音频文件。\n\n清单 4-7 展示了一个通过\
  \ URL 访问音频文件的示例。参见图 4-7。\n\n![](img/532543_1_En_4_Fig7_HTML.jpg)\n\n深色屏幕上显示一个滑块条。左侧有一个播放按钮，接着是\
  \ 0:00 / 0:00，然后是一个带有扬声器图标的长条，底部显示一个学习容器 URL。\n\n图 4-7\n\n使用 URL 显示音频文件\n\n```\n\
  import streamlit as st\n#### 使用文件路径和文件名打开音频并读取音频文件\nsample_url = st.audio(\"https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3\"\
  )\nst.write(\"音频来源：https://www.learningcontainer.com/sample-audio-file/\")\n清单 4-7\n\
  07_audio_url.py\n```\n\nStreamlit 支持大多数音频格式，如 MP3、WAV、OGG 等。当未指定音频格式时，Streamlit\
  \ 会自动采用 `audio/wav` 格式。在下一节中，我们将探讨如何在 Streamlit 应用中显示视频文件。\n\n\n\n## 视频\n\n我们可以使用\
  \ `st.video()` 函数将任意视频上传到应用程序中。与音频文件类似，我们可以指定上传视频的起始时间，而不是默认从 0 秒开始。这里的整数值以秒为单位指定时间。让我们使用该函数在应用程序中查看视频。请参见代码清单\
  \ 4-8。\n\n```\nimport streamlit as st\n#### 使用包含文件名的文件路径打开视频并读取视频文件\nsample_video\
  \ = open(\"files/ocean.mp4\", \"rb\").read()\n#### 使用 st.video() 函数显示视频\nst.video(sample_video,\
  \ start_time = 10)\nst.write(\"视频来源: https://filesamples.com/formats/mp4\")\n代码清单\
  \ 4-8\n08_video_local.py\n```\n\n在我们的应用程序中，我们将起始时间设置为 10，这意味着视频将从第 10 秒开始播放。除非我们点击播放按钮，否则视频不会开始播放。请参见图\
  \ 4-8。\n\n![](img/532543_1_En_4_Fig8_HTML.jpg)\n\n一个深色屏幕显示了一个视频文件。这是一个 46 秒的视频，并在第\
  \ 10 秒处暂停。下方是一个 mp4 格式文件的 URL。\n\n**图 4-8** 在应用程序中显示视频文件\n\n播放、暂停、全屏和音量等控件会显示出来。`st.video`\
  \ 还提供了播放速度、下载功能和画中画等功能，可以通过点击带有三个垂直点的按钮来探索。\n\n在某些情况下，标准浏览器不支持以 MP4V 格式编码的视频，但可以通过在\
  \ Python 中导入 OpenCV 库将其用作导出选项。我们也可以通过将 MP4V 编码的视频转换为 Streamlit 支持的 H.264 格式来显示它。\n\
  \n我们还可以使用 URL 在应用程序中上传视频。在代码清单 4-9 中，我们将在应用程序中使用一个 YouTube 视频链接。请参见图 4-9。\n\n![](img/532543_1_En_4_Fig9_HTML.jpg)\n\
  \n一个深色屏幕描绘了一个视频文件。它有一张狮子图片，上面覆盖着“国家地理野生”的文字。左上角显示一个标志和“狮子 101”，左下角显示“在 YouTube 上观看”。\n\
  \n**图 4-9** 使用 YouTube URL 显示视频\n\n```\nimport streamlit as st\n#### 使用 YouTube\
  \ URL 显示视频\nst.video(\"https://www.youtube.com/watch?v=OMkEVX23BdM\")\n#### 由 YouTube\
  \ 频道提供\nst.write(\"视频来源: 国家地理频道\")\n代码清单 4-9\n09_video_youtube.py\n```\n\n我们还可以为\
  \ YouTube 视频提供起始时间以及 URL。视频的大小是 Streamlit 设置的默认值，无法更改。要更改视频的高度和宽度，我们需要将视频嵌入到 HTML\
  \ 代码中，然后在 Streamlit 应用程序中运行。\n\n> **注意**  \n> 当我们在应用程序中使用 URL 显示视频时，无需像本地上传那样读取视频文件。\n\
  \n## 气球\n\n代码清单 4-10 在我们的应用程序中创建了一个气球飞行的动画。请参见图 4-10。\n\n![](img/532543_1_En_4_Fig10_HTML.jpg)\n\
  \n一个深色屏幕展示了一组向上飞行的彩色动画气球。左上角有一个停止按钮，并显示“庆祝气球”。\n\n**图 4-10** 显示向上移动的动画气球\n\n```\n\
  import streamlit as st\n### 动画雪花\nst.balloons()\n代码清单 4-10\n10_balloons.py\n```\n\
  \n动画气球从我们应用程序的底部开始，向顶部移动。动画本质上非常快，我们可以添加 `time.sleep()` 函数来延迟动画的开始。我们将在下一节中介绍另一个内置的动画函数。\n\
  \n## 雪花\n\n当 Snowflake 公司收购 Streamlit 时，引入了动画雪花。因此，此动画在 Streamlit 1.17 及以上版本中可用。动画雪花的函数是\
  \ `snow()`。代码清单 4-11 显示了代码，图 4-11 显示了输出。\n\n![](img/532543_1_En_4_Fig11_HTML.png)\n\
  \n一个深色屏幕展示了一组随机飘落的雪花。它显示“庆祝雪花”。\n\n**图 4-11** 显示动画雪花\n\n```\nimport streamlit as\
  \ st\n### 动画雪花\nst.snow()\n代码清单 4-11\n11_snowflake.py\n```\n\n> **注意**  \n> 内置的雪花函数仅在\
  \ Streamlit 1.17 及以上版本中有效。\n\n动画雪花的行为就像从天空飘落一样；也就是说，它们在应用程序中从上到下开始动画。\n\n## 表情符号\n\
  \n表情符号是微型图标或图像，通常用于在数字通信中描述表情、感受或信息，现在也用于 Web 应用程序。这在互联网开始蓬勃发展且 Unicode 变得可接受时成为可能。Streamlit\
  \ 支持这些表情符号，因此可以在我们的应用程序中使用。\n\n添加表情符号有两种方法：一种是使用 ASCII 值添加表情符号，另一种是添加相应表情符号的短代码。您可以根据以下示例决定更喜欢哪一种。请参见代码清单\
