  ![](img/532543_1_En_5_Fig2_HTML.jpg)


  创建单选按钮的快照。显示“选择您的性别”文本，以及三个单选按钮：男性、女性和其他，其中男性单选按钮被选中。输出显示“您已选择男性”，显示在下方。


  **图 5-2** 单选按钮


  ```

  import streamlit as st

  st.title(''创建单选按钮'')

  #### 定义单选按钮

