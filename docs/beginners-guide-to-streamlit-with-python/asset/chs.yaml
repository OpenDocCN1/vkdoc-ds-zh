  ## 旋转加载器


  旋转加载器用于在用户等待应用程序执行某些任务时显示一条消息。具体来说，我们可以在上传数据并由应用程序处理时使用旋转加载器。该消息是临时性的。参见代码清单 5-13。


  ```

  import streamlit as st

  import time

  st.title(''旋转加载器'')

  #### 定义旋转加载器

  with st.spinner(''加载中...''):

  time.sleep(5)

  st.write(''你好，数据科学家们'')

