- fmt: "# Video\n\nWe can upload any video to our application using the `st.video()`\
    \ function. Similar to audio files, we can specify the starting time of the video\
    \ uploaded instead of the default time starting from 0. Here, the integer value\
    \ specifies the time in seconds. Let’s use the function to view video in our application.\
    \ See Listing [4-8](#532543_1_En_4_Chapter.xhtml#PC9).\n\n```\nimport streamlit\
    \ as st\n# Open Video using filepath with filename and read the video file\nsample_video\
    \ = open(\"files/ocean.mp4\", \"rb\").read()\n# Display Video using st.video()\
    \ function\nst.video(sample_video, start_time = 10)\nst.write(\"Video Courtesy:\
    \ https://filesamples.com/formats/mp4\")\nListing 4-8\n08_video_local.py\n```\n\
    \nIn our application, we have provided a start time as 10, which means the video\
    \ will play from the 10th second. The video won’t start unless we click the play\
    \ button. See Figure [4-8](#532543_1_En_4_Chapter.xhtml#Fig8).\n\n![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig8_HTML.jpg)\n\
    \nA dark screen displays a video file. This is 46 seconds video and it is paused\
