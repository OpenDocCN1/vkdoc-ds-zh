    A dark screen with enter any text field with the data hello and the selected submit
    button at the bottom left.


    Figure 6-23


    Displaying a Submit button with input form text


    When we hit the Submit button, the application reruns. It is similar to the `st.button()`
    function but differs in functionality. The Submit button posts the state of the
    widgets in batches stored in a form. The `st.form_submit_button` should be associated
    with a form or Streamlit will enter an error state.'
