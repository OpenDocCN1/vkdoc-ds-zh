    \ the button with three vertical dots.\n\nIn some cases, videos encoded in MP4V\
    \ format are not supported in standard browsers but can be used as an export option\
    \ by importing an OpenCV library in Python. We can also display the MP4V-encoded\
    \ video by converting to H.264 format, which is supported in Streamlit.\n\nWe\
    \ can also upload a video in our application using a URL. In Listing [4-9](#532543_1_En_4_Chapter.xhtml#PC10),\
    \ we will be using a YouTube video link in our application. See Figure [4-9](#532543_1_En_4_Chapter.xhtml#Fig9).\n\
    \n![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig9_HTML.jpg)\n\nA dark screen\
