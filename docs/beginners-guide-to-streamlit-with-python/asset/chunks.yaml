    # 4. 数据与媒体元素


    在本章中，我们将重点介绍我们能看到和听到的数据。这类数据以图像、音频、视频或动画的形式存在，被称为*多媒体数据*。一个应用程序可能包含其中一种或多种类型的数据组合。


    由于机器学习模型可以基于图像、音频或视频来构建，我们将学习如何在应用程序中展示这些多媒体数据，以便在最后的项目构建章节中使用这些技术。现在，让我们从图像开始，大多数机器学习模型都是围绕目标检测、目标识别和图像分割来开发的。


    ## 图像


    在机器学习/数据科学应用中，所需的主要多媒体文件之一就是图像。图像通常用于可视化与机器学习模型相关的结果。在本节中，我们将探索图像，以便将来能够构建高效的图像应用程序。


    在我们的示例中，我们将图像存储在一个名为 `files` 的目录中，并将其导入到应用程序中。这有助于将图像与代码分离。请参见代码清单 4-1。


    ```

    import streamlit as st

    st.write("显示图像")

    # 通过指定路径显示图像

    st.image("files/animal7.jpg")

    # 图片致谢：unplash

    st.write("图片致谢：unplash.com")

    代码清单 4-1

    01_image_local.py

    ```


    图 4-1 显示了这段代码的结果。


    ![](img/532543_1_En_4_Fig1_HTML.jpg)


    一张深色屏幕的截图，展示了一只乌龟在水体中游泳的图片。标题显示为“显示图像”。


    图 4-1


    在应用程序中显示 JPG 图像


    我们也可以使用任何支持打开图像的 Python 库，例如 OpenCV、PIL 等。并非强制使用某个特定的库。之后，我们需要将存储在变量中的同一图像文件传递给
    Streamlit 的 `image()` 函数。


    代码清单 4-2 和图 4-2 展示了如何使用 URL 显示图像。


    ![](img/532543_1_En_4_Fig2_HTML.jpg)


    一张深色屏幕的截图，展示了一只豹子凝视着并攀爬原木的图片。标题显示为“显示图像”。


    图 4-2


    使用 URL 显示图像


    ```

    import streamlit as st

    st.write("显示图像")

    # 显示图像 URL

    st.image("https://tinyurl.com/322vu3ab")

    # 图片致谢

    st.write("致谢：unplash.com")

    代码清单 4-2

    02_image_url.py

    ```


    带有其他参数的 `image()` 函数的语法如下：


    ```

    st.image(image, caption, width, use_column_width, clamp, channels, output_format)

    ```


    在应用程序中显示图像时，会涉及各种参数，如表 4-1 所述。


    表 4-1


    `image()` 函数的参数


    | 参数 | 描述 |

    | --- | --- |

    | `image (numpy.ndarray, [numpy.ndarray], str, [str], 或 BytesIO)` | 指定将在应用程序中显示的图像。图像可以是单色的，形状为
    `(w,h)` 或 `(w,h,1)`；也可以是彩色图像，形状为 `(w,h,3)`；或者是 RGBA 图像，形状为 `(w,h,4)`。图像可以是 URL、本地存储路径、SVG
    XML 字符串或多张图像的列表。（这里 `(w,h)` 表示图像的高度和宽度。） |

    | `caption (str 或字符串列表)` | 提供关于所显示图像的信息。 |

    | `width (int 或 None)` | 用于固定将要显示的图像的宽度。当使用 SVG 图像时，由于 SVG 图像尺寸较大，通常会设置此参数。当使用列宽显示多张图像时，也可以调整宽度。
    |

    | `use_column_width (''auto'' 或 ''always'' 或 ''never'')` | 当设置为 `auto` 时，图像会以其实际尺寸显示，但不会超过列宽。当设置为
    `"always"` 或 `True` 时，图像宽度会被设置为列宽；当设置为 `"never"` 或 `False` 时，图像宽度会设置为其正常尺寸。此参数设置后会覆盖
    `width` 参数。 |

    | `clamp (bool)` | 图像的钳位值范围，每个通道为 0 到 255。当图像为字节数组格式时可以使用此值；当图像通过 URL 定义时则跳过。如果未设置钳位值且图像的值超出范围，则会引发错误。
    |

    | `channels (''RGB'' 或 ''BGR'')` | 通道表示图像的颜色信息，指明当图像为 `nd.array` 时使用的格式。通道默认设置为
    `RGB` 格式。每个通道对应的值如下：`[:,:,0]` -> 红色通道`[:,:,1]` -> 绿色通道`[:,:,2]` -> 蓝色通道当我们从 OpenCV
    等 Python 库读取图像时，需要将通道设置为 `BGR` 而不是 `RGB`。 |

    | `Output_format (''JPEG'', ''PNG'', 或 ''auto'')` | 此参数定义传输图像数据时使用的格式。照片可以使用有损压缩的
    `JPEG` 格式，而图表可以使用无损压缩的 `PNG` 格式。当设置为 `"auto"` 时，压缩类型会根据图像参数的类型和格式自动设置。 |


    另一个重要的特性是，可以使用 Streamlit 支持的各种 Python 库，应用计算机视觉技术进行图像处理。


    接下来，我们将看到如何在应用程序中显示多张图像。


    注意


    当从 URL 或本地存储显示图像时，应用程序中显示的图像将保持其原始尺寸（即高度和宽度）。我们可以在调用 `st.image` 函数之前，使用任何 Python
    库调整图像大小。


    ## 多张图像


    我们可以通过在 `image()` 函数中列出图像，在应用程序中显示多张图像。本节将展示如何显示多张图像。


    在代码清单 4-3 中，我们定义了将分配给应用程序中每张图像的宽度，并以列和网格结构显示。我们可以根据需要调整宽度，并将在第 7 章中学习更多关于 Streamlit
    应用程序的列和网格结构。


    ```

    import streamlit as st

    # 图片致谢

    st.write("显示多张图像")

    # 列出动物图像

    animal_images = [

    ''files/animal1.jpg'',

    ''files/animal2.jpg'',

    ''files/animal3.jpg'',

    ''files/animal4.jpg'',

    ''files/animal5.jpg'',    ''files/animal6.jpg'',

    ''files/animal7.jpg'',

    ''files/animal8.jpg'',

    ''files/animal9.jpg'',

    ''files/animal10.jpg''

    ]

    # 显示多张图像，宽度为 150

    st.image(animal_images, width=150)

    # 图片致谢

    st.write("图片致谢：Unplash")

    代码清单 4-3

    03_multiple_local.py

    ```


    图 4-3 显示了结果。


    ![](img/532543_1_En_4_Fig3_HTML.jpg)


    一张深色屏幕的截图，展示了北极熊、豹子、熊猫、鸟、猫、乌龟、老虎、鹿和长颈鹿的图片。标题显示为“显示多张图像”。


    图 4-3


    显示多张图像


    注意


    图像可以通过 URL 或本地目录调用。


    我们已经了解了如何在应用程序中定义多张图像，并且可以将其用于书籍、电影等推荐系统中。


    在下一节中，我们将展示如何将图像设置为背景。

