    ## Setting Up Files


    We will create a few files that are required by Heroku to run our application.
    The files created are discussed in the following sections.


    ### Requirement Text


    We need to create a `requirement.txt` file (case sensitive). This file will contain
    all the Python libraries used in our application with its different versions.


    There are two ways to create requirement files; one is to list all the libraries
    used manually. The second way is to install the `pipreqs` module that automatically
    creates the `requirement.txt` file.


    We can install `pipreqs` by using `pip` as follows:


    ```

    pip install pipreqs

    ```


    After installation, we need to move to our application directory and enter the
    following command at the command prompt:


    ```

    pipreqs ./

    ```


    Listing [9-6](#532543_1_En_9_Chapter.xhtml#PC8) shows what the `requirement.txt`
    file looks like.


    ```

    nltk==3.7

    streamlit==1.12.2

    textblob==0.17.1

    Listing 9-6

    requirement.txt

    ```


    Note


    Heroku will install all the Python dependencies from `requirement.txt.`


    ### setup.sh


    We need to create a shell file named `setup.sh` (case sensitive) in our application
    directory where we will add the commands; see Listing [9-7](#532543_1_En_9_Chapter.xhtml#PC9).


    ```

    mkdir -p ~/.streamlit/echo "\

    [server]\n\

    headless = true\n\

    port = $PORT\n\

    enableCORS = false\n\

    \n\

    " > ~/.streamlit/config.toml

    Listing 9-7

    setup.sh

    ```


    Add the previous command and save it in a shell extension; otherwise, Heroku will
    give an error message during deployment.


    Note


    Save the file name as stated in the commands.


    ### Procfile


    Finally, we will create a file named `Procfile` . We need the command shown in
    Listing [9-8](#532543_1_En_9_Chapter.xhtml#PC10) in our `Procfile`.


    ```

    web: sh setup.sh && Streamlit run app.py

    Listing 9-8

    Procfile

    ```


    In this command, `web:` specifies that it is a web application. The command is
    specified to run the Heroku application. Finally, `app.py i`s the name of the
    Streamlit application. Check the name before saving it in a shell file as it may
    vary in your case.


    Now review the files and their names so that there will be no errors during deployment
    . Check the `requirement.txt` file if any of the library is added or removed from
    the application.


    ## GitHub Repository Creation


    There are various ways we can create a Git repository . In our case, we will use
    one of the easiest methods to deploy an application on Heroku.


    Note


    Heroku requires Git to run as mentioned in the documentation.


    We will use the following command to initialize the Git repository from our root
    project directory in our command prompt:


    ```

    Git init

    ```


    After Git initialization, we will log in from Heroku, as discussed in the next
    section.


