    \ Python 中导入 OpenCV 库将其用作导出选项。我们也可以通过将 MP4V 编码的视频转换为 Streamlit 支持的 H.264 格式来显示它。\n\
    \n我们还可以使用 URL 在应用程序中上传视频。在代码清单 4-9 中，我们将在应用程序中使用一个 YouTube 视频链接。请参见图 4-9。\n\n\
    ![](img/532543_1_En_4_Fig9_HTML.jpg)\n\n一个深色屏幕描绘了一个视频文件。它有一张狮子图片，上面覆盖着“国家地理野生”的文字。左上角显示一个标志和“狮子\
    \ 101”，左下角显示“在 YouTube 上观看”。\n\n**图 4-9** 使用 YouTube URL 显示视频\n\n```\nimport streamlit\
    \ as st\n# 使用 YouTube URL 显示视频\nst.video(\"https://www.youtube.com/watch?v=OMkEVX23BdM\"\
    )\n# 由 YouTube 频道提供\nst.write(\"视频来源: 国家地理频道\")\n代码清单 4-9\n09_video_youtube.py\n\
    ```\n\n我们还可以为 YouTube 视频提供起始时间以及 URL。视频的大小是 Streamlit 设置的默认值，无法更改。要更改视频的高度和宽度，我们需要将视频嵌入到\
    \ HTML 代码中，然后在 Streamlit 应用程序中运行。\n\n> **注意**  \n> 当我们在应用程序中使用 URL 显示视频时，无需像本地上传那样读取视频文件。\n\
    \n## 气球\n\n代码清单 4-10 在我们的应用程序中创建了一个气球飞行的动画。请参见图 4-10。\n\n![](img/532543_1_En_4_Fig10_HTML.jpg)\n\
    \n一个深色屏幕展示了一组向上飞行的彩色动画气球。左上角有一个停止按钮，并显示“庆祝气球”。\n\n**图 4-10** 显示向上移动的动画气球\n\n```\n\
    import streamlit as st\n# 动画雪花\nst.balloons()\n代码清单 4-10\n10_balloons.py\n```\n\
    \n动画气球从我们应用程序的底部开始，向顶部移动。动画本质上非常快，我们可以添加 `time.sleep()` 函数来延迟动画的开始。我们将在下一节中介绍另一个内置的动画函数。\n\
    \n## 雪花\n\n当 Snowflake 公司收购 Streamlit 时，引入了动画雪花。因此，此动画在 Streamlit 1.17 及以上版本中可用。动画雪花的函数是\
    \ `snow()`。代码清单 4-11 显示了代码，图 4-11 显示了输出。\n\n![](img/532543_1_En_4_Fig11_HTML.png)\n\
    \n一个深色屏幕展示了一组随机飘落的雪花。它显示“庆祝雪花”。\n\n**图 4-11** 显示动画雪花\n\n```\nimport streamlit\
    \ as st\n# 动画雪花\nst.snow()\n代码清单 4-11\n11_snowflake.py\n```\n\n> **注意**  \n> 内置的雪花函数仅在\
    \ Streamlit 1.17 及以上版本中有效。\n\n动画雪花的行为就像从天空飘落一样；也就是说，它们在应用程序中从上到下开始动画。\n\n## 表情符号\n\
    \n表情符号是微型图标或图像，通常用于在数字通信中描述表情、感受或信息，现在也用于 Web 应用程序。这在互联网开始蓬勃发展且 Unicode 变得可接受时成为可能。Streamlit\
    \ 支持这些表情符号，因此可以在我们的应用程序中使用。\n\n添加表情符号有两种方法：一种是使用 ASCII 值添加表情符号，另一种是添加相应表情符号的短代码。您可以根据以下示例决定更喜欢哪一种。请参见代码清单\
    \ 4-12 和图 4-12。\n\n**代码清单 4-12.** `12_emojis.py`\n\n![](img/532543_1_En_4_Figa_HTML.gif)\n\
    \n一组程序代码的截图。它列出了使用和不使用短代码导入表情符号的步骤，这些表情符号包括雨云、咖啡、爱情酒店、抽象情侣、心形情侣和戒指。\n\n![](img/532543_1_En_4_Fig12_HTML.jpg)\n\
    \n一个深色屏幕描绘了一组表情符号。包括雨云、咖啡杯、建筑、超人和女超人、心形情侣和戒指。\n\n**图 4-12** 显示表情符号\n\n图 4-12 显示了我们使用和不使用短代码显示的表情符号。这里显示了诸如\
    \ `:rain_cloud:`、`:coffee:`、`:love_hotel:` 和 `:couple_with_heart:` 之类的短代码。我们也可以像为男性和女性超级英雄编写的那样，以文本格式编写表情符号。建议使用短代码编写表情符号，因为这样我们知道图片在应用程序中描绘的是什么。\n\
    \n您可以在 [`https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/`](https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/)\
    \ 查看 Streamlit 应用程序可用的所有表情符号短代码。您也可以使用其他表情符号网站显示任何其他不可用的表情符号。\n\n我们可以使用表情符号替换第\
    \ 2 章中涵盖的任何文本。\n\n## 总结\n\n在本章中，我们了解了如何在应用程序中显示各种格式的多媒体数据，例如图像、音频和视频。我们了解了如何从本地存储或\
    \ URL 显示图像。我们还了解了如何调整图像大小、定义多个图像以及将图像显示为背景。\n\n我们还研究了 Streamlit 中作为内置函数可用的气球和雪花动画。\n\
    \n最后，我们学习了如何在数据中显示表情符号。\n\n在下一章中，我们将研究按钮和滑块及其相关功能。\n\n# 5. 按钮和滑块\n\n在本章中，我们将讨论如何创建不同类型的按钮。这些按钮是用户与应用程序交互的媒介。让我们开始逐一创建这些按钮。\n"
- fmt: '# Buttons


    A button is created by using the following syntax:


    ```

    st.button(''button_name'')

    ```


    Let’s create a button by using this syntax; see Listing [5-1](#532543_1_En_5_Chapter.xhtml#PC2).


    ```

    import streamlit as st

    st.title(''Creating a Button'')

    # Defining a Button

    button = st.button(''Click Here'')

    if button:

    st.write(''You have clicked the Button'')

    else:

    st.write(''You have not clicked the Button'')

    Listing 5-1

    01_button.py

    ```


    In Listing [5-1](#532543_1_En_5_Chapter.xhtml#PC2), we have used an `if` condition
    to figure out whether the button has been clicked or not. If the button is clicked,
    then the statement “You have clicked the Button” is executed. If the button is
    not clicked, then the statement “You have not clicked the Button” is active. Figure
    [5-1](#532543_1_En_5_Chapter.xhtml#Fig1) shows the results.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig1_HTML.jpg)


    Two snapshots of creating a button has chick here, and you have not clicked the
    button options. Click here button is highlighted in the second screenshot.


    **Figure 5-1** Button output a) before click and b) after click


    # Radio Buttons


    To create radio buttons, we can use the following syntax:


    ```

    st.radio(''button_labels'', radio_button_names, index=index_value)

    ```


    Listing [5-2](#532543_1_En_5_Chapter.xhtml#PC4) creates three radio buttons containing
    different genders, and Figure [5-2](#532543_1_En_5_Chapter.xhtml#Fig2) shows the
    output.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig2_HTML.jpg)


    A snapshot of creating radio buttons. Select your gender text, and three radio
    buttons of male, female, and others are displayed where the male radio button
    is selected. The output reads you have selected male, which is displayed below.


    **Figure 5-2** Radio button


    ```

    import streamlit as st

    st.title(''Creating Radio Buttons'')

    # Defining Radio Button

    gender = st.radio(

    "Select your Gender",

    (''Male'', ''Female'', ''Others''))

    if gender == ''Male'':

    st.write(''You have selected Male.'')

    elif gender == ''Female'':

    st.write("You have selected Female.")

    else:

    st.write("You have selected Others.")

    Listing 5-2

    02_radio_buttons.py

    ```


    By default, the first radio button is selected, but you can change it by using
    indexing. We can use the code in Listing [5-3](#532543_1_En_5_Chapter.xhtml#PC5)
    to change the index. Figure [5-3](#532543_1_En_5_Chapter.xhtml#Fig3) shows the
    output.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig3_HTML.jpg)


    A snapshot titled, creating radio buttons. Select your gender text and follow
    by three radio buttons, male, female, and others, are displayed where the female
    radio button is selected. The output reads you have selected female.


    **Figure 5-3** Radio button with defined index selection


    ```

    import streamlit as st

    st.title(''Creating Radio Buttons'')

    gender = (''Male'', ''Female'', ''Others'')

    # Defining Radio Button with index value

    gender = st.radio(

    "Select your Gender",

    gender,

    index = 1)

    if gender == ''Male'':

    st.write(''You have selected Male.'')

    elif gender == ''Female'':

    st.write("You have selected Female.")

    else:

    st.write("You have selected Others.")

    Listing 5-3

    03_radio_buttons_index.py

    ```


    Here, the index value is changed to 1, and therefore the Female radio button is
    selected. After execution, the output is displayed on the screen.


    # Check Boxes


    To create a check box, we will use the following syntax:


    ```

    st.checkbox(''button_label'', checkbox_names, index=index_value)

    ```


    Listing [5-4](#532543_1_En_5_Chapter.xhtml#PC7) creates three check boxes with
    the hobbies Books, Movies, and Sports.


    ```

    import streamlit as st

    st.title(''Creating Checkboxes'')

    st.write(''Select your Hobies:'')

    # Defining Checkboxes

    check_1 = st.checkbox(''Books'')

    check_2 = st.checkbox(''Movies'')

    check_3 = st.checkbox(''Sports'')

    Listing 5-4

    04_checkbox.py

    ```


    One or more check boxes can be created as there is no limit on them. Figure [5-4](#532543_1_En_5_Chapter.xhtml#Fig4)
    shows the check boxes before and after selection. We can even select all the available
    check boxes.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig4_HTML.jpg)


    Two snapshots of the creation of checkboxes. 1. The text reads, select your hobbies,
    followed by three checkboxes for books, movies, and sports are displayed. 2. The
    text, select your hobbies, followed by three checkboxes for books, movies, and
    sports, is displayed, and select books and sports.


    **Figure 5-4** Check box output a) before click and b) after click


    The check box created can be preselected by using the code in Listing [5-5](#532543_1_En_5_Chapter.xhtml#PC8).
    Figure [5-5](#532543_1_En_5_Chapter.xhtml#Fig5) shows the output.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig5_HTML.jpg)


    A snapshot of the preselected checkbox function. The header reads, preselect.
    The checkbox labeled, accept terms and conditions asterisk is selected.


    **Figure 5-5** Preselecting the checkbox output


    ```

    import streamlit as st

    st.title(''Pre-Select'')

    check = st.checkbox(''Accept all Terms and Conditions***'', value=True)

    Listing 5-5

    05_checkbox_pre_select.py

    ```


    To preselect a checkbox, we need to add the Boolean value `True` for the `value`
    attribute.


    # Drop-Downs


    A drop-down contains options listed within it that are revealed when it is clicked
    by the user. It is easy to create a drop-down in Streamlit by using the following
    syntax:


    ```

    st.selectbox(label, options, index)

    ```


    We will create a simple drop-down with multiple options; see Listing [5-6](#532543_1_En_5_Chapter.xhtml#PC10).


    ```

    import streamlit as st

    st.title(''Creating Dropdown'')

    # Creating Dropdown

    hobby = st.selectbox(''Choose your hobby: '',

    (''Books'', ''Movies'', ''Sports''))

    Listing 5-6

    06_dropdown.py

    ```


    Figure [5-6](#532543_1_En_5_Chapter.xhtml#Fig6) shows the drop-down that will
    be displayed in our application.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig6_HTML.jpg)


    A snapshot of the creation of a dropdown list. The text reads, choose your hobby,
    followed by a dropdown list with the value books.


    **Figure 5-6** Displaying a drop-down


    In Figure [5-6](#532543_1_En_5_Chapter.xhtml#Fig6), there is no user interaction
    with the drop-down, so we are not able to see the list of options that we assigned
    in the code, and by default the first option is selected, similar to the radio
    box. Figure [5-7](#532543_1_En_5_Chapter.xhtml#Fig7) displays all the options
    provided when we click.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig7_HTML.jpg)


    A snapshot of the creation of a dropdown list. The text reads, choose your hobby.
    A dropdown list with three values. 1. Books. 2. Movies. 3. Sports. The first value,
    books, is selected.


    **Figure 5-7** Displaying options in a drop-down


    We can change the default option selected by providing the index value. See Listing
    [5-7](#532543_1_En_5_Chapter.xhtml#PC11) and Figure [5-8](#532543_1_En_5_Chapter.xhtml#Fig8).


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig8_HTML.jpg)


    A snapshot of creating a dropdown list with a predefined index value. The text
    reads, choose your hobby, followed by a dropdown list where the value and movies
    are selected.


    **Figure 5-8** Displaying a drop-down after setting an index value


    ```

    hobby = st.selectbox(''Choose your hobby: '',

    (''Books'', ''Movies'', ''Sports''),

    index=1)

    Listing 5-7

    07_dropdown_index.py

    ```


    Next, we will look into selecting multiple options from the drop-down.'
