    ### 地图


    要在地图上显示数据点，我们将使用 Streamlit 的 `st.map()` 函数。散点图会叠加在由 `mapbox` 提供的地图上。纬度和经度指定了地图的位置以及散点图的绘制位置。参见代码清单
