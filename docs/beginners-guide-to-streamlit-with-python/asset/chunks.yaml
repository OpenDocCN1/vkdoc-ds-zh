    ## Graphviz


    Graphviz is an open-source Python library in which we can create graphical objects
    having nodes and edges. The language of nodes and edges is known as the DOT language.


    In Listing [3-5](#532543_1_En_3_Chapter.xhtml#PC5), we have implemented a machine
    learning workflow to train a model.


    ```

    import streamlit as st

    import graphviz as graphviz

    st.title(''Graphviz'')

    # Creating graph object

    st.graphviz_chart(''''''

    digraph {

    "Training Data" -> "ML Algorithm"

    "ML Algorithm" -> "Model"

    "Model" -> "Result Forecasting"

    "New Data" -> "Model"

    }

    '''''')

    Listing 3-5

    05_graphviz_dot.py

    ```


    The nodes and edges are added in the DOT language, which is easy to understand.
    We have defined four nodes with connecting edges, as shown in Figure [3-5](#532543_1_En_3_Chapter.xhtml#Fig5).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig5_HTML.jpg)


    A Graphviz model. The training data is passed to the ML algorithm. The ML algorithm
    and new data values are passed to the model, and the resulting forecasting is
    derived.


    **Figure 3-5** Displaying a Simple ML Model using Graphviz


    We can define the same edge and nodes as shown in Listing [3-6](#532543_1_En_3_Chapter.xhtml#PC6).


    ```

    import streamlit as st

    import graphviz as graphviz

    st.title(''Graphviz'')

    # Create a graphlib graph object

    graph = graphviz.Digraph()

    graph.edge(''Training Data'', ''ML Algorithm'')

    graph.edge(''ML Algorithm'', ''Model'')

    graph.edge(''Model'', ''Result Forecasting'')

    graph.edge(''New Data'', ''Model'')

    st.graphviz_chart(graph)

    Listing 3-6

    06_graphviz.py

    ```


    We can use this Graphviz code to visualize various ML algorithms or neural networks
    to help us understand the architecture or flows encountered in them while processing
    data.


