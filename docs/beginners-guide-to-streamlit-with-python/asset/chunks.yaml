    \ `:coffee:`, `:love_hotel:`, and `:couple_with_heart:` are displayed. We can\
    \ also write emojis in text format, as we have written for the male and female\
    \ superheroes. It is preferred to write emojis using shortcodes as we know what\
    \ the picture is depicting in an application.\n\nYou can check for all emoji shortcodes\
    \ that are available for Streamlit application at [`https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/`](https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/).\
    \ You can also display any other emoji that is not available using other emoji\
    \ sites.\n\nWe can use emojis in place of any of the text covered in Chapter [2](#532543_1_En_2_Chapter.xhtml).\n\
    \n## Summary\n\nIn this chapter, we saw multimedia data in various formats such\
