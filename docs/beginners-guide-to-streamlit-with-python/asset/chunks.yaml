    directly to x and y parameters as values, as shown in Figure [3-16](#532543_1_En_3_Chapter.xhtml#Fig16).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig16_HTML.jpg)


    A snapshot depicts a bar graph of large bags ranging from 0 to 800 versus the
    dates of January 2015 to November 2015\. September 2015 has the largest bags of
    790.


    Figure 3-16


    Displaying a Plotly bar graph


    We can also change the color by introducing the color parameter in the `bar()`
    function, as shown in Listing [3-18](#532543_1_En_3_Chapter.xhtml#PC22); the results
    are shown in Figure [3-17](#532543_1_En_3_Chapter.xhtml#Fig17).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig17_HTML.jpg)


    A snapshot of a vertical bar graph of large bags versus date. The highest value
    is in September 2015, with 790 large bags.


    Figure 3-17


    Displaying a Plotly bar chart with color intensity


    ```

    #Bar Color

    bar_graph = px.bar(

    x = al_df["Date"],

    y = al_df["Large Bags"],

    title = "Bar Graph",

    color=al_df["Large Bags"]

    )

    Listing 3-18

    18_plotly_bar_color.py

    ```


    The color intensity is associated with the value defined in it. The color intensity
    in the bar graph helps to understand the range of values depicted.


    ### Bar Horizontal


    We can flip the bars in a bar graph to be horizontal. To flip a bar graph to be
    horizontal, we need to specify the `orientation` parameter in the `bar()` function.
    See Listing [3-19](#532543_1_En_3_Chapter.xhtml#PC23) and the output in Figure
    [3-18](#532543_1_En_3_Chapter.xhtml#Fig18).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig18_HTML.jpg)


    A snapshot of a horizontal bar graph of date versus large bags. The highest value
    is in September 2015, with 790 large bags.


    Figure 3-18


    Displaying a Plotly horizontal bar graph


    ```

    import streamlit as st

    import pandas as pd

    import plotly.express as px

    # Data Set

    data = pd.read_csv("./files/avocado.csv")

    # Minimizing Dataset

    albany_df = data[data[''region'']=="Albany"]

    al_df = albany_df[albany_df["year"]==2015]

    # Horizontal Bar Graph

    bar_graph = px.bar(

    al_df,

    x = "Large Bags",

    y = "Date",

    title = "Bar Graph",

    color="Large Bags",

    orientation=''h''

    )

    Listing 3-19

    19_plotly_bar_horizontal.py

    ```


    Finally, we will see how to implement subplots using Plotly in a Streamlit application.


    ### Subplots


    Subplots are used to load different graphs next to each other. In Plotly, we can
    use the `make_subplots()` method to create multiple graphs to be placed next to
    one other or to be stacked one below the other. To define subplots, we need to
    import the `potly.subplots` module . See Listing [3-20](#532543_1_En_3_Chapter.xhtml#PC24).


    ```

    import streamlit as st

    import pandas as pd

    import plotly.graph_objects as go

    from plotly.subplots import make_subplots

    # Data Set

    data = pd.read_csv("./files/avocado.csv")

    # Minimizing Dataset

    albany_df = data[data[''region'']=="Albany"]

    al_df = albany_df[albany_df["year"]==2015]

    fig = make_subplots(rows=3, cols=1)

    # First Subplot

    fig.add_trace(go.Scatter(

    x=al_df["Date"],

    y=al_df["Total Bags"],

    ), row=1, col=1)

    # Second SubPlot

    fig.add_trace(go.Scatter(

    x=al_df["Date"],

    y=al_df["Small Bags"],

    ), row=2, col=1)

    # Third SubPlot

    fig.add_trace(go.Scatter(

    x=al_df["Date"],

    y=al_df["Large Bags"],

    ), row=3, col=1)

    st.plotly_chart(fig)

    Listing 3-20

    20_plotly_subplots.py

    ```


    In Listing [3-20](#532543_1_En_3_Chapter.xhtml#PC24), we create stacked graphs
    one below another by defining three rows and a single column. To place graphs
    next to each other, we can increase the number of columns. See Figure [3-19](#532543_1_En_3_Chapter.xhtml#Fig19).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig19_HTML.jpg)


    A set of three line graphs for march 2015 to November 2015\. Three curves represent
    traces 0, 1, and 2 with downward trends.


    Figure 3-19


    Displaying Plotly subplots


    Subplots can contain any type of graphs . In our example, we have used line graphs
    in all three rows.


    Note


    Graphs can be stacked one below the other or placed next to one another by defining
    the columns in Streamlit. The columns act as container in which graphs are placed.


    ## Summary


    Visualization is an important aspect in data science and machine learning . The
    visualizing techniques help data scientists understand the data better. In this
    chapter, we started by understanding visualization basics, and then we discussed
    how we display data points in our application using Streamlit’s built-in functions.


    Finally, we discussed and implemented different visualizing techniques that are
    available in Python for data science and machine learning developers.


    In the next chapter, we will discuss how to implement media elements in an application.'
