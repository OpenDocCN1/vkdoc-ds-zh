    The additional shading on the line chart distinguishes an area chart.


    Finally, we will discuss visualizing data into a heatmap.


    ## Heatmap


    A heatmap is graphical representation of values in color. The values determine
    the intensity of color corresponding to two dimensions. See Listing [3-12](#532543_1_En_3_Chapter.xhtml#PC14).


    ```

    import altair as alt

    import streamlit as st

    import pandas as pd

    #Read albany Dataset

    df = pd.read_csv("./files/albany.csv")

    heat_map  = alt.Chart(df).mark_rect().encode(

    alt.Y(''AveragePrice:Q''),

    alt.X(''Large Bags:Q''),

    alt.Color(''AveragePrice:Q''),

    tooltip = [''AveragePrice'', ''type'', ''Large Bags'', ''Date'']

    ).interactive()

    st.altair_chart(heat_map)

    Listing 3-12

    12_altair_heatmap.py

    ```


    The `mark_rect()` function from the Altair library is used to create heatmaps.
    We have defined `Large Bags` and `AveragePrice` as parameters for the x-axis and
    y-axis to which the heatmap is produced.


    You can see the color intensity range at the right corner of Figure [3-11](#532543_1_En_3_Chapter.xhtml#Fig11).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig11_HTML.jpg)


    A snapshot of an Altair heatmap of average price versus large bags. The color
    indicator of the average price ranges from 2.0 to 1.0.


    Figure 3-11


    Displaying an Altair heatmap in Streamlit


    We can conclude that an increase in value will increase the color intensity in
    the graph.


    In the next section, we will discuss one of the most widely used interactive Python
    libraries, called Plotly. We will use Plotly to display graphs in our Streamlit
    application.


    **Note**


    The `mark()` method is used to represent the type of graph (like line, area, heatmap,
    etc.) that will be created.


    # Plotly


    Plotly is a Python library that can make high-quality interactive graphs. It supports
    different types of graphs such as bar charts, line charts, boxplots, pie charts,
    scatter plots, histograms, etc. We will see how this Python library can be used
    in our Streamlit application.


    First, we need to install the Plotly library by using the `pip` command.


    ```

    pip install plotly

    ```


    Now we will see various graphs that can be implemented in Streamlit using Plotly.
    We will be using the Avocado dataset for visualizing graphs.


    ## Pie


    For the Avocado dataset, we will be visualizing a percentage of organic and conventional
    avocados.


    In Listing [3-13](#532543_1_En_3_Chapter.xhtml#PC16), the first function, `figure()`,
    is a blank page that is used to plot our pie chart within it. The `Pie()` method
    creates a pie chart with labels and values as input parameters.


    ```

    import streamlit as st

    import plotly.graph_objects as go

    import pandas as pd

    #Read Avocado Dataset

    data = pd.read_csv("./files/avocado.csv")

    st.header("Pie Chart")

    # Implementing Pie Plot

    pie_chart = go.Figure(

    go.Pie(

    labels = data.type,

    values = data.AveragePrice,

    hoverinfo = "label+percent",

    textinfo = "value+percent"

    ))

    st.plotly_chart(pie_chart)

    Listing 3-13

    13_plotly_pie.py

    ```


    There are two more optional parameters named `hoverinfo` and `textinfo` where
    information is displayed when the mouse is hovered on the pie chart. The function
    `plotly_chart` allows us to add a defined pie chart in our application, as shown
    in Figure [3-12](#532543_1_En_3_Chapter.xhtml#Fig12).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig12_HTML.jpg)


    A snapshot of a pie chart with the organic and conventional values. The organic
    indicates 15,089.43, and it is 58.8 %. The conventional indicates 10,568.27, and
    it is 41.2%.


    Figure 3-12


    Displaying a Plotly pie chart in Streamlit


    Our pie chart is divided into two parts: organic and conventional. When the mouse
    is hovered over a part, we can see the name and percentage of that particular
    section of pie chart. The percentage and total number of avocados corresponding
    to organic and conventional are displayed in different color. Next, we will move
    to a donut chart, which is similar to a pie chart.


    ## Donut


    Plotly has created a different submodule to plot donut charts. The name of the
    module is `express()`. We need to import the `express()` module in our code. See
    Listing [3-14](#532543_1_En_3_Chapter.xhtml#PC17).


    ```

    import streamlit as st

    import pandas as pd

    import plotly.express as px

    #Read Avocado Dataset

    data = pd.read_csv("./files/avocado.csv")

    st.header("Donut Chart")

    # Donut Chart

    donut_chart = px.pie(

    names = data.type,

    values = data.AveragePrice,

    hole=0.25,

    )

    st.plotly_chart(donut_chart)

    Listing 3-14

    14_plotly_donut.py

    ```


    We have provided same dataset values that are used for pie charts in our earlier
    example. The `pie()` method in the Express module takes three parameters: `names`,
    `values`, and `hole`. The hole specifies the radius of the hole in a donut. See
    Figure [3-13](#532543_1_En_3_Chapter.xhtml#Fig13).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig13_HTML.jpg)


    A snapshot of a donut chart with organic and conventional values. The organic
    indicates 58.8%. Conventional is labeled, label = conventional value = 10,568.27
    has 41.2%.


    Figure 3-13


    Displaying a Plotly donut chart


    **Note**


    We can convert a donut into a pie chart without specifying a hole parameter.


