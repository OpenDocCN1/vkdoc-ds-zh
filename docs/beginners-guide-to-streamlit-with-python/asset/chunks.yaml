    **图 5-1** 按钮输出 a) 点击前 b) 点击后


    # 单选按钮


    要创建单选按钮，我们可以使用以下语法：


    ```

    st.radio(''button_labels'', radio_button_names, index=index_value)

    ```


    清单 5-2 创建了三个包含不同性别的单选按钮，图 5-2 显示了输出结果。


    ![](img/532543_1_En_5_Fig2_HTML.jpg)


    创建单选按钮的快照。显示“选择您的性别”文本，以及三个单选按钮：男性、女性和其他，其中男性单选按钮被选中。输出显示“您已选择男性”，显示在下方。


    **图 5-2** 单选按钮


    ```

    import streamlit as st

    st.title(''创建单选按钮'')

    # 定义单选按钮

    gender = st.radio(

    "选择您的性别",

    (''男性'', ''女性'', ''其他''))

    if gender == ''男性'':

    st.write(''您已选择男性。'')

    elif gender == ''女性'':

    st.write("您已选择女性。")

    else:

    st.write("您已选择其他。")

    清单 5-2

    02_radio_buttons.py

    ```


    默认情况下，第一个单选按钮被选中，但您可以通过索引进行更改。我们可以使用清单 5-3 中的代码来更改索引。图 5-3 显示了输出结果。


    ![](img/532543_1_En_5_Fig3_HTML.jpg)


    标题为“创建单选按钮”的快照。显示“选择您的性别”文本，后跟三个单选按钮：男性、女性和其他，其中女性单选按钮被选中。输出显示“您已选择女性”。


    **图 5-3** 带定义索引选择的单选按钮


    ```

    import streamlit as st

    st.title(''创建单选按钮'')

    gender = (''男性'', ''女性'', ''其他'')

    # 定义带索引值的单选按钮

    gender = st.radio(

    "选择您的性别",

    gender,

    index = 1)

    if gender == ''男性'':

    st.write(''您已选择男性。'')

    elif gender == ''女性'':

    st.write("您已选择女性。")

    else:

    st.write("您已选择其他。")

    清单 5-3

    03_radio_buttons_index.py

    ```


    这里，索引值被改为 1，因此“女性”单选按钮被选中。执行后，输出显示在屏幕上。


