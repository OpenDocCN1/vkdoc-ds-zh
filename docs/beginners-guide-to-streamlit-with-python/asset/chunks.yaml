- fmt: '# Background Image


    We can set an image as a background image of an application by embedding it in
    Markdown language. Let’s see how an image is displayed; see Listing [4-4](#532543_1_En_4_Chapter.xhtml#PC5).


    ```

    import streamlit as st

    import base64

    # Function to set Image as Background

    def add_local_backgound_image_(image):

    with open(image, "rb") as image:

    encoded_string = base64.b64encode(image.read())

    st.write("Image Courtesy: unplash")

    st.markdown(

    f"""


    .stApp {{

    background-image: url(data:files/{"jpg"};base64,{encoded_string.decode()});

    background-size: cover

    }}


    """,

    unsafe_allow_html=True

    )

    st.write("Background Image")

    # Calling Image in function

    add_local_backgound_image_(''files/animal7.jpg'')

    Listing 4-4

    04_background_image.py

    ```


    First, we open an image and convert it to base64-encoded format. Then, we define
    a function wherein an image is called in the background using Markdown. We can
    define any image format for a background image. Figure [4-4](#532543_1_En_4_Chapter.xhtml#Fig4)
    illustrates the results.


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig4_HTML.png)


    A screenshot portrays a picture of a tortoise swimming in a water body. It reads
    background image, and image courtesy Unplash.


    Figure 4-4


    Image as background


    In the next section, we will see how we can resize our image to be displayed in
    our application.


    # Resizing an Image


    In machine learning, images are trained at a uniform level to extract features
    from them and obtain an image model. When models are deployed and we want to test
    our model with new images, then the images need to be resized to the size of the
    trained model. Hence, we will see how the resizing of an image is done. The same
    will be applied while image uploads are used. See Listing [4-5](#532543_1_En_4_Chapter.xhtml#PC6)
    and Figure [4-5](#532543_1_En_4_Chapter.xhtml#Fig5).


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig5_HTML.png)


    2 screenshots portray a picture of a group of lionesses and cubs sitting. It has
    both the original and the resized images.


    Figure 4-5


    Displaying a) the original image and b) the resized image


    ```

    import streamlit as st

    from PIL import Image

    original_image = Image.open("files/animal9.jpg")

    # Display Original Image

    st.title("Original Image")

    st.image(original_image)

    # Resizing Image to 600*400

    resized_image = original_image.resize((600, 400))

    #Displaying Resized Image

    st.title("Resized Image")

    st.image(resized_image)

    Listing 4-5

    05_image_resize.py

    ```


    Note


    An image is resized to match the trained model images.


    To resize an image, we used the PIL Python library. We can use any Python library
    that supports image resizing in our application.


    In the next section, we will look at audio data.


    # Audio


    Audio is a type of multimedia file where we can hear only the sound from the file.
    We can use an audio file in our application by using the `st.audio()` function,
    as shown in Listing [4-6](#532543_1_En_4_Chapter.xhtml#PC7).


    We need to open our audio file by passing the audio file name in binary mode using
    the `rb` parameter in our first statement. Later, we use the `audio()` function
    from Streamlit to display the audio file in our application by providing the saved
    variables for the audio as input. See Figure [4-6](#532543_1_En_4_Chapter.xhtml#Fig6).


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig6_HTML.jpg)


    A dark screen exhibits a slider bar. It has a play button on the left, followed
    by 0 colon 20 by 0 colon 29, and a long bar with a speaker icon, with a U R L
    of a downloaded file at the bottom.


    Figure 4-6


    Displaying an audio file in an application


    ```

    import streamlit as st

    # Open Audio using filepath with filename

    sample_audio = open("files/audio.wav", "rb")

    #Reading Audio File

    audio_bytes = sample_audio.read()

    # Display Audio using st.audio() function with start time set to 20

    st.audio(sample_audio, start_time = 20)

    # Printing Audio Courtesy

    st.write("Audio Courtesy: https://file-examples.com/index.php/sample-audio-files/sample-wav-download/")

    Listing 4-6

    06_audio.py

    ```


    The control buttons display with the audio files in our application. The type
    of audio file supported is the MIME type. We can set the start time of the audio
    file from which it will start playing. The start time is always an integer value.


    We can also use a URL in place of an audio file that is stored locally on disk.
    This is one of best features as we can directly access the audio file stored in
    the cloud or on an online server.


    Listing [4-7](#532543_1_En_4_Chapter.xhtml#PC8) shows an example of an audio file
    being accessed by using a URL. See Figure [4-7](#532543_1_En_4_Chapter.xhtml#Fig7).


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig7_HTML.jpg)


    A dark screen displays a slider bar. It has a play button on the left, followed
    by 0 colon 00 by 0 colon 00, and a long bar with a speaker icon, a learning container
    U R L at the bottom.


    Figure 4-7


    Displaying an audio file using a URL


    ```

    import streamlit as st

    # Open Audio using filepath with filename and read the audio file

    sample_url = st.audio("https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3")

    st.write("Audio Courtesy: https://www.learningcontainer.com/sample-audio-file/")

    Listing 4-7

    07_audio_url.py

    ```


    Streamlit supports most of the audio formats like MP3, WAV, OGG, etc. When no
    audio format is specified, then Streamlit will automatically take audio in `audio/wav`
    format. In our next section, we will look into displaying video files in our Streamlit
    application.'
