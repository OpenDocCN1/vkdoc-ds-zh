  raw: '# 8. Control Flow and Advanced Features


    In this chapter, we will discuss the different alert boxes available. Then we
    will learn about control flow aspects in Streamlit. We will also discuss how to
    change the default flow of a Streamlit application with the methods provided.
    Finally, we will learn advanced features including changing the default configuration
    of Streamlit and improving performance using caching techniques.


    ## Alert Box


    In this section, we will review some of the alert boxes that are available in
    Streamlit. These boxes are used to give certain information to the user in order
    for them to interact with the application.


    ### st.info( )


    This function helps to provide additional information to the user so they can
    interact with the application.


    ### st.warning( )


    This will pop up a warning message to the user.


    ### st.success( )


    The `st.success()` function displays a success message. For example, we can use
    it when form data is submitted correctly.


    ### st.error( )


    This is used to display an error message on the application. It can be used when
    the file upload does not support certain types of files.


    ### st.exception( )


    When we want to handle any exception in our application, we can use the `st.exception()`
    function and display a notification once the exception is hit, as shown in Listing
    [8-1](#532543_1_En_8_Chapter.xhtml#PC1) and Figure [8-1](#532543_1_En_8_Chapter.xhtml#Fig1).


    ![](images/532543_1_En_8_Chapter/532543_1_En_8_Fig1_HTML.jpg)


    A snapshot of five alert boxes. 1\. Successful. 2\. Warning. 3\. Info. 4\. Error.
    5\. Str: it is an exception. Traceback is defined below.


    Figure 8-1


    Displaying all alert boxes


    ```

    import streamlit as st

    st.success("Successful")

    st.warning("Warning")

    st.info("Info")

    st.error("Error")

    st.exception("It is an exception")

    pass

    Listing 8-1

    1_alert.py

    ```


    We can use one or more alert boxes in our application, and they can appear in
    different colors.


    ## Control Flow


    We know that Streamlit executes the complete script of an application, but this
    can be controlled by allowing certain functions to execute, and therefore the
    default flow of the application can be changed. This can be done by using the
    following methods.


    ### Stop Execution


    We can stop the execution of the script immediately. The command used to stop
    execution is as follows:


    ```

    st.stop()

    ```


    No other script will run when `st.stop()` occurs. See Listing [8-2](#532543_1_En_8_Chapter.xhtml#PC3).


    ```

    import streamlit as st

    name = st.text_input(''Text'')

    if not name:

    st.info(''Enter any Text.'')

    # Stop function

    st.stop()

    st.success(''Text Entered Successfully.'')

    Listing 8-2

    2_stop.py

    ```


    In this case, the script will come out of the `if` condition when any text is
    entered in the textbox, as we have defined the `st.stop()` method , and execute
    the next condition. This changes the default flow of the application.


    ### Rerun the Script


    We can rerun the script at any given points of time. To rerun the script , we
    use the following command:


    ```

    st.experimental_rerun()

    ```


    See Listing [8-3](#532543_1_En_8_Chapter.xhtml#PC5).


    ```

    import streamlit as st

    import time

    st.title(''Hello World'')

    st.info(''Script Runs Everytime rerun hits.'')

    time.sleep(2)

    # rerun statement

    st.experimental_rerun()

    st.success(''Scipt Never Runs.'')

    Listing 8-3

    3_rerun.py

    ```


    When we hit the `rereun()` statement in the script , the script runs again from
    the top, and hence the next script will not be executed.


    ### st.form_submit_button


    This button is used to submit all the data entered in the form in batches. When
    the user clicks the submit button, the script reruns. It is a special type of
    button that should be associated with forms. See Listing [8-4](#532543_1_En_8_Chapter.xhtml#PC6).


    ```

    import streamlit as st

    sub_form = st.form(key=''submit_form'')

    user_name = sub_form.text_input(''Enter your username'')

    # Submit button associated with form

    submit_button = sub_form.form_submit_button(''Submit'')

    st.write(''Press submit see username displayed below'')

    if submit_button:

    st.write(f''Hello!!!! {user_name}'')

    Listing 8-4

    4_submit.py

    ```


    In Listing [8-4](#532543_1_En_8_Chapter.xhtml#PC6), the `sub_form` is associated
    with the submit button; hence, when the button is clicked, it will send the data
    in batches and be displayed on the application. This button can be associated
    to any of the form widgets that we discussed in Chapter [5](#532543_1_En_5_Chapter.xhtml).


