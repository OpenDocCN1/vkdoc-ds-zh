- fmt: '# Containers


    To insert more than one element, we can use a container in Streamlit. A container
    is invisible in nature and can be defined with `st.container()`. See Listing [7-6](#532543_1_En_7_Chapter.xhtml#PC6).


    ```

    import streamlit as st

    import numpy as np

    st.title("Container")

    with st.container():

    st.write("Element Inside Contianer")

    # Defining Chart Element

    st.line_chart(np.random.randn(40, 4))

    st.write("Element Outside Container")

    Listing 7-6

    6_containers.py

    ```


    We have used a `with` statement in the `st.container()` to insert multiple elements
    in the container. See Figure [7-7](#532543_1_En_7_Chapter.xhtml#Fig7).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig7_HTML.jpg)


    A dark screen is titled container. It has a simulated graph of elements inside
    and outside the container. It plots 4 chaotic waves for 0, 1, 2, and 3.


    Figure 7-7


    Container with chart objects


    We can insert elements in the container out of order, which can be done by using
    the `container.write()` function. See Listing [7-7](#532543_1_En_7_Chapter.xhtml#PC7).


    ```

    import streamlit as st

    import numpy as np

    st.title("Out of Order Container")

    # Defining Contianers

    container_one = st.container()

    container_one.write("Element One Inside Contianer")

    st.write("Element Outside Contianer")

    # Now insert few more elements in the container_one

    container_one.write("Element Two Inside Contianer")

    container_one.line_chart(np.random.randn(40, 4))

    Listing 7-7

    7_container_out_of_order.py

    ```


    We have inserted three elements in the container. Two elements are text functions,
    and one is a line chart, as shown in Figure [7-8](#532543_1_En_7_Chapter.xhtml#Fig8).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig8_HTML.jpg)


    A dark screen is titled out of order container. It has a simulated graph of elements
    one and two inside the container and elements outside the container. It plots
    4 chaotic waves for 0, 1, 2, and 3.


    Figure 7-8


    Out-of-order container


    The order of inserting elements varies and hence is called *out of order*. This
    helps in creating more flexible applications.


    ## Empty Containers


    As the name suggests, the container is empty, and we can insert only one element
    into it. To define an empty container, we can use the `st.empty()` syntax. See
    Listing [7-8](#532543_1_En_7_Chapter.xhtml#PC8).


    ```

    import streamlit as st

    import time

    # Empty Container

    with st.empty():

    for seconds in range(5):

    st.write(f"⏳ {seconds} seconds have passed")

    time.sleep(1)

    st.write("✔ Times up!")

    Listing 7-8

    8_empty_container.py

    ```


    This creates the empty container shown in Figure [7-9](#532543_1_En_7_Chapter.xhtml#Fig9).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig9_HTML.jpg)


    2 dark screens read an hourglass icon with 0 seconds have passed, and a tick symbol
    with times up exclamation.


    Figure 7-9


    Displays an empty screen a) before and b) after the time is past


    ## Sidebars


    A sidebar is a pane that is displayed on the side of the application. It allows
    the user to stay focused on the main content. We will use the `st.sidebar()` function
    to define a sidebar in our application. See Listing [7-9](#532543_1_En_7_Chapter.xhtml#PC9).


    ```

    import streamlit as st

    # Sidebar

    st.sidebar.title("Sidebar")

    st.sidebar.radio("Are you a New User", ["Yes", "No"])

    st.sidebar.slider("Select a Number", 0,10)

    Listing 7-9

    9_sidebar.py

    ```


    In Listing [7-9](#532543_1_En_7_Chapter.xhtml#PC9), we will be displaying a slider
    and radio buttons in a sidebar, as shown in Figure [7-10](#532543_1_En_7_Chapter.xhtml#Fig10).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig10_HTML.jpg)


    A dark screen lists the questions under the sidebar. It reads, are you a new user
    with the Yes option selected and has a slider bar to select a number.


    Figure 7-10


    Sidebar


    We can use a sidebar to display a navigation link where one can switch from one
    page to other.


    ## Multipage Navigation


    We can create multiple-page apps by using navigation. In Streamlit, the navigation
    sidebar shows the pages that are created. The pages can be navigated quickly and
    easily as the front end never reloads. The multipage application is divided into
    two parts: the main page and the pages.


    ### Main Page


    First, we will create a Python file in a directory that acts as the main page.
    This is similar to the single-page application we created earlier. We can run
    this file using the following command:


    `streamlit run file_name.py`


    We have named Python file `home.py`. The code for `main_page.py` is given in Listing
    [7-10](#532543_1_En_7_Chapter.xhtml#Par36). Figure [7-11](#532543_1_En_7_Chapter.xhtml#Fig11)
    shows the result.


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig11_HTML.png)


    A dark screen has 2 panels. Panel 1 lists the options, main page, page 2, and
    3, where the main page is selected. Panel 2 displays the main page with the text
    below, This is main page.


    Figure 7-11


    Displaying the home page


    **Listing 7-10.** `home.py`


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Figa_HTML.gif)A screenshot of a
    set of program codes. It imports the sreatmlit as the home page and sets the main
    page''s title as This is main page.


    Figure [7-11](#532543_1_En_7_Chapter.xhtml#Fig11) shows the main page. Now we
    will see how we can add other pages to this `home.py` page.


    ### Pages


    We will add multiple Python pages in the folder named `pages` where we have the
    `main_page.py` file. We will create two files named `page2.py` and `page3.py`
    in the `pages` folder.


    The structure of the folder is as follows:


    ```

    home.py # It is the main file to run with "streamlit run"

    └─── pages/ # Folder

    └─── page2.py # Second Page

    └─── page3.py # Third Page

    ```


    The code for the pages is shown in Listing [7-11](#532543_1_En_7_Chapter.xhtml#Par41)
    and Listing [7-12](#532543_1_En_7_Chapter.xhtml#Par42).


