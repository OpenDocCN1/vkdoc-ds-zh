    \n**Figure 4-11** Displaying animated snowflakes\n\n```\nimport streamlit as st\n\
    # Animated Snowflakes\nst.snow()\nListing 4-11\n11_snowflake.py\n```\n\n> **Note**\
    \  \n> The built-in snowflake function works only in Streamlit version 1.17 and\
    \ above.\n\nThe animated snowflakes behave like they are falling from the sky;\
    \ i.e., they start animating from top to bottom in an application.\n\n## Emojis\n\
    \nEmojis are mini icons or images that are generally used to describe expressions,\
    \ feelings, or messages in digital communication and now in web applications.\
    \ This was possible when the Internet started to flourish and Unicode became acceptable.\
    \ These emojis are supported by Streamlit and hence can be used in our application.\n\
    \nThere are two ways to add an emoji: one is to add an emoji using an ASCII value,\
