    ```

    import streamlit as st

    # 创建数字输入

    st.number_input("请输入您的数字")

    代码清单 6-5

    05_number.py

    ```


    我们可以通过数字框旁边的 - 和 + 来减少或增加数字。数字可以是小数或整数。


    我们还可以通过指定起始和结束数字来限制数字范围。如果用户未指定任何值，我们还可以设置默认值。`number_input()` 函数中还有一个参数叫做 `step_size`。当设置了
    `step_size` 时，在从输入框更改数字时，它将会加到提供的默认值上（即 `number` + `step_size`）。请参见代码清单 6-6 和图
    6-7。


