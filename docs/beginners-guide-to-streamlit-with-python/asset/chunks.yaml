    and averages. See Listing [3-10](#532543_1_En_3_Chapter.xhtml#PC12).


    ```

    import altair as alt

    import streamlit as st

    import pandas as pd

    #Read albany Dataset

    df = pd.read_csv("./files/albany.csv")

    # Box Plot

    box_plot = alt.Chart(df).mark_boxplot().encode(

    x = "Date",

    y = "Large Bags"

    )

    st.altair_chart(box_plot)

    Listing 3-10

    10_altair_boxplot.py

    ```


    In the previous code, we used the `mark_boxplot()` method to display boxplots.
    Later we used the `st.altair_chart()` function to display the graph in our application.
    The boxplot is divided into five different parts, as displayed in Figure [3-9](#532543_1_En_3_Chapter.xhtml#Fig9).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig9_HTML.jpg)


    A snapshot of an Altair box plot chart of date versus large bags. 2015 September
    20 has the highest value of 590.


    Figure 3-9


    Displaying an Altair box plot chart in Streamlit


    The white band in the middle represents the median.


    Next, we will look at how to create and display an area chart in our application.


    ## Area


