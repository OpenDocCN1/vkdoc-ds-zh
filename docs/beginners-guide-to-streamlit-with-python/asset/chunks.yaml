    ### Map


    To display data points on a map, we will be using the `st.map()` function of Streamlit.
    A scatter plot is applied on top of a map provided by `mapbox`. The latitude and
    longitude specify the position of the map and where the scatter plot is plotted.
    See Listing [3-4](#532543_1_En_3_Chapter.xhtml#PC4).


    ```

    import streamlit as st

    import pandas as pd

    import numpy as np

    st.title(''Map'')

    # Defining Latitude and Longitude

    locate_map = pd.DataFrame(

    np.random.randn(50, 2)/[10,10] + [15.4589, 75.0078],

    columns = [''latitude'', ''longitude''])

    # Map Function

    st.map(locate_map)

    Listing 3-4

    04_map.py

    ```


    We have generated a few random points that will be displayed on the map of Dharwad
    City in India as we have defined the latitude and longitude (Figure [3-4](#532543_1_En_3_Chapter.xhtml#Fig4)).


