    st.write("默认值是 5,  \n  步长值是 2")

    st.write("输入数字与步长值相加后的总值为:", num)

    代码清单 6-6

    06_number_range.py

    ```


    在我们之前的示例中，我们将默认数字设置为 5，`step_value` 设置为 2。数字的范围分别从 0 开始，到 10 结束。当我们想要增加或减少默认值
    5 时，数字将根据 `step_value` 的值进行变化。


    注意


    `step_value` 用于通过数字输入框提供的 `-` 和 `+`（减号和加号）按钮来改变数字。


