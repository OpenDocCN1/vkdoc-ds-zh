    ## 数字输入


    在这种输入类型中，用户只能在输入框中输入数字。要将数字定义为输入，我们将使用 Streamlit 的 `number_input()` 函数。请参见代码清单
    6-5 和图 6-6。


    ![](img/532543_1_En_6_Fig6_HTML.jpg)


    一个深色背景的屏幕，带有“请输入您的数字”字段和一个空白框，下方显示“请输入您的数字”并输入了 9.09。


