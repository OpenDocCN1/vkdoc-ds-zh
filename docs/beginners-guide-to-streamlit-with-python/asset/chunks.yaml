- fmt: '# 6. Forms


    In this chapter, we will discuss various form attributes used to elicit input
    from users and provide results accordingly. In ML applications, when we want to
    test our model or provide results to a user, we need to first collect input from
    the user. For example, if we want to apply a brightness or contrast value on an
    image before giving it to a model to predict, user inputs are needed to set these
    values and analyze the results associated with them. Uploading files also requires
    user input, and the user/client will expect a result.


    When creating a data science or machine learning application, we need to focus
    on user interactions by making the application dynamic in nature. User interactions
    are the inputs received from the user and then the results that are displayed.
    The user inputs can be in the form of text, numbers, date/time selections, and
    color picker. This chapter will give us in-depth knowledge of the various ways
    we can get user input.


    To get user input from our application, we will be using a text box, text area,
    date input, number input, time input, and color picker. Let’s get started with
    an input box, which is the first method covered in this chapter.


    ## Text Box


    A text input box allows a user to enter data. It is one of the most important
    elements in a form. In this section let’s see how we can create a text box.


    Listing [6-1](#532543_1_En_6_Chapter.xhtml#PC1) creates a text box that accepts
    a name as textual data from the user.


    ```

    import streamlit as st

    st.title("Text Box")

    # Creating Text box

    name = st.text_input("Enter your Name")

    st.write("Your Name is ", name)

    Listing 6-1

    01_text_box.py

    ```


    In Figure [6-1](#532543_1_En_6_Chapter.xhtml#Fig1) (a), we can see the input box
    defined with a name field, whereas Figure [6-1](#532543_1_En_6_Chapter.xhtml#Fig1)
    (b) shows the input data specified by the user, which is shown as the result.
    To submit the text entered, the user needs to press the Enter key on the keyboard.


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig1_HTML.jpg)


    A dark screen of the text box reads enter your name and your name is, along with
    a text box after entering data your name is Harry Potter.


    Figure 6-1


    a) A text box before entering data and b) the text box after entering data


    We can limit the characters to be entered in a text box by using the `max_chars`
    parameter. In Listing [6-2](#532543_1_En_6_Chapter.xhtml#PC2), we have limited
    the characters to a maximum of 10, which is depicted in Figure [6-2](#532543_1_En_6_Chapter.xhtml#Fig2)
    in the corner of the text box.


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig2_HTML.jpg)


    A dark screen of the text box that includes the dialog box enter your name Harry
    Potter and the text your name is.


    Figure 6-2


    Displaying a text box with character limitations


    ```

    import streamlit as st

    st.title("Text Box")

    # Creating Text box with 10 as character limit

    name = st.text_input("Enter your Name", max_chars=10)

    st.write("Your Name is ", name)

    Listing 6-2

    02_text_box_max_chars.py

    ```


    We can use the same text box as a password box that hides text data because it’s
    a password. To implement a password input box, we will use the code in Listing
    [6-3](#532543_1_En_6_Chapter.xhtml#PC3). Figure [6-3](#532543_1_En_6_Chapter.xhtml#Fig3)
    shows the result.


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig3_HTML.jpg)


    A dark screen of the text box as password that reads enter your password field
    with 5 letter data.


    Figure 6-3


    Displaying a text box as a password field


    ```

    import streamlit as st

    st.title("Text Box as Password")

    password = st.text_input("Enter your password", type=''password'')

    Listing 6-3

    03_input_text_password.py

    ```


    We can also implement a character limit on the password input box. We can see
    the password by clicking the eye icon at the end of the text box, as shown in
    Figure [6-4](#532543_1_En_6_Chapter.xhtml#Fig4).


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig4_HTML.jpg)


    A dark screen of the text box as password that includes enter your password field
    with the text Hello.


    Figure 6-4


    Displaying a text box as a password field with visible characters


    Now, let’s look at a text area where we can get multiline input.


    ## Text Area


    A text area is used when we want to get multiple lines of text from the user.
    This type of format is often used to analyze sentiments that are in the form of
    comments, reviews, feedbacks, or any opinion given on social media or on a website.
    We can see how to define a text area in Listing [6-4](#532543_1_En_6_Chapter.xhtml#PC4).


    ```

    import streamlit as st

    # Creating Text Area

    input_text = st.text_area("Enter your Review")

    # Printing entered text

    st.write("""You entered:  \n""",input_text)

    Listing 6-4

    04_text_area.py

    ```


    As shown in Figure [6-5](#532543_1_En_6_Chapter.xhtml#Fig5), the text area can
    have multiple lines within this same box. There is also a provision to resize
    the text area from the application.


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig5_HTML.jpg)


    A dark screen with Enter your review field with the text if there''s any movie
    that deserves to be seen in the theaters with big screens and booming speakers.
    One of my best experiences in years.


    Figure 6-5


    Displaying a text area


    In the next section, we will learn how we can get a number as input in our application.


    ## Number Input


    In this input type, a user can enter only numbers in the input box. To define
    a number as input, we will use the `number_input()` function from Streamlit. See
    Listing [6-5](#532543_1_En_6_Chapter.xhtml#PC5) and Figure [6-6](#532543_1_En_6_Chapter.xhtml#Fig6).


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig6_HTML.jpg)


    A dark screen with enter your number field and a blank box and below it enter
    your number with input 9.09.


    Figure 6-6


    Displaying a number input a) before entering data and b) after entering data


    ```

    import streamlit as st

    # Create number input

    st.number_input("Enter your Number")

    Listing 6-5

    05_number.py

    ```


    We can subtract or add numbers by using the - and + provided beside the number
    box. The numbers can be decimals or integers.


    We can also limit the number range by specifying the starting and ending number.
    We can also set the default value if the user does not specify any value. There
    is one more parameter in the `number_input()` function known as `step_size`. When
    `step_size` is set, it will add to the default value provided (i.e., `number`
    + `step_size`) while changing the number from the input box. See Listing [6-6](#532543_1_En_6_Chapter.xhtml#PC6)
    and Figure [6-7](#532543_1_En_6_Chapter.xhtml#Fig7).


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig7_HTML.jpg)


    A dark screen with enter your number field and input 7. Below the input minimum,
    maximum, and default values, along with the step size value and total value.


    Figure 6-7


    Displaying the number input with all the parameters


    ```

    import streamlit as st

    # Create number input

    num = st.number_input("Enter your Number", 0, 10, 5, 2)

    st.write("Min. Value is 0,  \n  Max. value is 10")

    st.write("Default Value is 5,  \n  Step Size value is 2")

    st.write("Total value after adding Number entered with step value is:", num)

    Listing 6-6

    06_number_range.py

    ```


    Here in our previous example, we have set the default number as 5 and `step_value`
    as 2. The number starts its range from 0 and ends at 10, respectively. When we
    want to increase or decrease the default value of 5, the number will change by
    what is in `step_value`.


    Note


    The `step_value` is used to alter a number from the `-` and `+` (minus and plus)
    button provided with the number input box.


    In the next section, we will look at how the user can specify the time and date.'
