    chapter, we started by understanding visualization basics, and then we discussed
    how we display data points in our application using Streamlit’s built-in functions.


    Finally, we discussed and implemented different visualizing techniques that are
    available in Python for data science and machine learning developers.


    In the next chapter, we will discuss how to implement media elements in an application.'
