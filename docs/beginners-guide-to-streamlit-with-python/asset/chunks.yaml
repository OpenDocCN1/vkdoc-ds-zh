    Finally, we will see how to implement subplots using Plotly in a Streamlit application.


    ### Subplots


    Subplots are used to load different graphs next to each other. In Plotly, we can
    use the `make_subplots()` method to create multiple graphs to be placed next to
    one other or to be stacked one below the other. To define subplots, we need to
    import the `plotly.subplots` module. See Listing [3-20](#532543_1_En_3_Chapter.xhtml#PC24).


    ```

    import streamlit as st

    import pandas as pd

    import plotly.graph_objects as go

    from plotly.subplots import make_subplots

    # Data Set

    data = pd.read_csv("./files/avocado.csv")

    # Minimizing Dataset

    albany_df = data[data[''region'']=="Albany"]

    al_df = albany_df[albany_df["year"]==2015]

    fig = make_subplots(rows=3, cols=1)

    # First Subplot

    fig.add_trace(go.Scatter(

    x=al_df["Date"],

    y=al_df["Total Bags"],

    ), row=1, col=1)

    # Second SubPlot

    fig.add_trace(go.Scatter(

    x=al_df["Date"],

    y=al_df["Small Bags"],

    ), row=2, col=1)

    # Third SubPlot

    fig.add_trace(go.Scatter(

    x=al_df["Date"],

    y=al_df["Large Bags"],

    ), row=3, col=1)

    st.plotly_chart(fig)

    Listing 3-20

    20_plotly_subplots.py

    ```


    In Listing [3-20](#532543_1_En_3_Chapter.xhtml#PC24), we create stacked graphs
    one below another by defining three rows and a single column. To place graphs
    next to each other, we can increase the number of columns. See Figure [3-19](#532543_1_En_3_Chapter.xhtml#Fig19).


    ![](images/532543_1_En_3_Chapter/532543_1_En_3_Fig19_HTML.jpg)


    A set of three line graphs for March 2015 to November 2015. Three curves represent
    traces 0, 1, and 2 with downward trends.


    Figure 3-19


    Displaying Plotly subplots


    Subplots can contain any type of graphs. In our example, we have used line graphs
    in all three rows.


    **Note**


    Graphs can be stacked one below the other or placed next to one another by defining
    the columns in Streamlit. The columns act as container in which graphs are placed.


