  raw: '## Video


    We can upload any video to our application using the `st.video()` function . Similar
    to audio files, we can specify the starting time of the video uploaded instead
    of the default time starting from 0\. Here, the integer value specifies the time
    in seconds. Let’s use the function to view video in our application. See Listing
    [4-8](#532543_1_En_4_Chapter.xhtml#PC9).


    ```

    import streamlit as st

    # Open Video using filepath with filename and read the video file

    sample_video = open("files/ocean.mp4", "rb").read()

    # Display Video using st.video() function

    st.video(sample_video, start_time = 10)

    st.write("Video Courtesy: https://filesamples.com/formats/mp4")

    Listing 4-8

    08_video_local.py

    ```


    In our application, we have provided a start time as 10, which means the video
    will play from the 10^(th) second . The video won’t start unless we click the
    play button. See Figure [4-8](#532543_1_En_4_Chapter.xhtml#Fig8).


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig8_HTML.jpg)


    A dark screen displays a video file. This is 46 seconds video and it is paused
    at 10 seconds. Below is a U R L of a file in a m p 4 format.


    Figure 4-8


    Displaying a video file in our application


    The controls such as play, pause, full screen , and volume are displayed. The
    `st.video` also provides features such as playback speed, download ability, and
    picture-in-picture that can be explored by clicking the button with three vertical
    dots.


    In some cases, videos encoded in MP4V format are not supported in standard browsers
    but can be used as an export option by importing an OpenCV library in Python.
    We can also display the MP4V-encoded video by converting to H.264 format, which
    is supported in Streamlit.


    We can also upload a video in our application using a URL. In Listing [4-9](#532543_1_En_4_Chapter.xhtml#PC10),
    we will be using a YouTube video link in our application . See Figure [4-9](#532543_1_En_4_Chapter.xhtml#Fig9).


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig9_HTML.jpg)


    A dark screen portrays a video file. It has a picture of a lion overlayed by a
    text nat geo wild. The left top reads a logo and Lions 101 and reads watch on
    youtube on the bottom left.


    Figure 4-9


    Displaying video using a YouTube URL


    ```

    import streamlit as st

    # Displaying Video using youtube URL

    st.video("https://www.youtube.com/watch?v=OMkEVX23BdM")

    # Courtesy by youtube channel

    st.write("Video Courtesy: National Geographic Channel")

    Listing 4-9

    09_video_youtube.py

    ```


    We can also provide a start time to the YouTube video along with the URL. The
    size of the video is the default set by Streamlit and cannot be changed. To change
    the height and width of the video, we need to embed the video in the HTML code
    and then run it in a Streamlit application .


    Note


    When we use a URL to display video in our application, there is no need to read
    the video file as in the case of a local upload.


    ## Balloon


    Listing [4-10](#532543_1_En_4_Chapter.xhtml#PC11) creates an animation of balloons
    flying in our application. See Figure [4-10](#532543_1_En_4_Chapter.xhtml#Fig10).


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig10_HTML.jpg)


    A dark screen exhibits a cluster of animated colored balloons flying upwards.
    It has a stop button on the left top and reads celebratory balloons.


    Figure 4-10


    Displaying animated balloons moving upward


    ```

    import streamlit as st

    # Animated Snowflakes

    st.balloons()

    Listing 4-10

    10_balloons.py

    ```


    The animated balloons start from the bottom of our application and move toward
    the top. The animation is very fast in nature, and we can add the `time.sleep()`
    function to delay the animation’s start. We will look into one more built-in animation
    function available in our next section.


    ## Snowflake


    The animated snowflake was introduced when the Snowflake company was acquired
    Streamlit. Therefore, this animation is available in Streamlit version 1.17 and
    above. The function for the animated snowflake is `snow()`. Listing [4-11](#532543_1_En_4_Chapter.xhtml#PC12)
    shows the code, and Figure [4-11](#532543_1_En_4_Chapter.xhtml#Fig11) shows the
    output.


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig11_HTML.png)


    A dark screen exhibits a cluster of snowflakes flowing randomly. It reads celebratory
    snowflakes.


    Figure 4-11


    Displaying animated snowflakes


    ```

    import streamlit as st

    # Animated Snowflakes

    st.snow()

    Listing 4-11

    11_snowflake.py

    ```


    Note


    The built-in snowflake function works only in Streamlit version 1.17 and above.


    The animated snowflakes behave like they are falling from the sky; i.e., they
    starts animating from top to bottom in an application.


    ## Emojis


    Emojis are mini icons or images that are generally used to describe expressions,
    feelings, or messages in digital communication and now in web applications. This
    was possible when the Internet started to flourish and Unicode became acceptable.
    These emojis are supported by Streamlit and hence can be used in our application.


    There are two ways to add an emoji: one is to add an emoji using an ASCII value,
    and the other is to add the shortcode for the respective emoji. You can decide
    which one you prefer based on the following example. See Listing [4-12](#532543_1_En_4_Chapter.xhtml#Par880)
    and Figure [4-12](#532543_1_En_4_Chapter.xhtml#Par880).


    ***Listing 4-12***. 12_emojis.py![](images/532543_1_En_4_Chapter/532543_1_En_4_Figa_HTML.gif)A
    screenshot of a set of program codes. It lists the steps to import the emojis
    with and without shortcodes for rain cloud, coffee, love hotel, couple abstract,
    couple with heart, and a ring.


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig12_HTML.jpg)


    A dark screen portrays a group of emojis. A rain cloud, coffee cup, building,
    super man and woman, couple with a heart, and ring.


    Figure 4-12


    Displaying emojis


    Figure [4-12](#532543_1_En_4_Chapter.xhtml#Fig12) shows the emojis we have displayed
    with and without shortcodes. Here, shortcodes like `:rain_cloud:`, `:coffee:`,
    `:love_hotel:`, and `:couple_with_heart:` are displayed. We can also write emojis
    in text format, as we have written for the male and female superheroes. It is
    preferred to write emojis using shortcodes as we know what the picture is depicting
    in an application.


    You can check for all emoji shortcodes that are available for Streamlit application
    at [`https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/`](https://streamlit-emoji-shortcodes-streamlit-app-gwckff.streamlitapp.com/)
    . You can also display any other emoji that is not available using other emoji
    sites.


    We can use emojis in place of any of the text covered in Chapter [2](#532543_1_En_2_Chapter.xhtml).


    ## Summary


    In this chapter, we saw multimedia data in various formats such as images, audio,
    and videos to be displayed in our application. We saw how an image can be displayed
    from local storage or a URL. We also saw how to resize images, define multiple
    images, and display an image as a background.


    We also looked at the balloon and snowflake animations that are available in Streamlit
    as built-in functions.


    Finally, we learned how to display emojis in our data.


    In the next chapter, we will look into buttons and sliders and their associated
    features.


    # 5. Buttons and Sliders


    In this chapter, we will discuss how to create different types of buttons. These
    buttons are a medium for interaction between the user and the application. Let’s
    start by creating these buttons one by one.'
