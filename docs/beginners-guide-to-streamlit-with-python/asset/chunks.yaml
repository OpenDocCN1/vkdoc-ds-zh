    We will now look at how to download a file with a download button.


    **Note:** The user may experience higher loading time if multiselection has more
    than 100 attributes in it. Therefore, it is recommended to use fewer attributes.


    ## Download Buttons


    When we allow a user to download results or a file directly from our application,
    Streamlit provides a download button for the user to click. The file format can
    be JPG/PNG, TXT, CSV, etc. See Listing [5-10](#532543_1_En_5_Chapter.xhtml#PC14).


    ```

    import streamlit as st

    st.title("Download Button")

    # Creating Download Button

    down_btn = st.download_button(

    label="Download Image",

    data=open("./files/fam.jpg", "rb"),

    file_name="lions.jpg",

    mime="image/jpg"

    )

    Listing 5-10

    10_download_button.py

    ```


    In the previous code, we have assigned an image to the download button. When a
    user clicks the download image button, a JPG file will be downloaded on the local
    system. See Figure [5-12](#532543_1_En_5_Chapter.xhtml#Fig12).


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig12_HTML.jpg)


    Two snapshots depict the creation of the download button with the download option.
    In the second screenshot, highlight the download image with a rectangle.


    Figure 5-12


    Displaying a download image button a) before clicking and b) after clicking


    Similarly, we can use the download button to download a CSV file. In some cases,
    we can convert the dataframe analyzing the results to CSV by using a download
    button. See Listing [5-11](#532543_1_En_5_Chapter.xhtml#PC15).


    ```

    st.download_button(

    label="Download CSV",

    data=open("./files/avocado.csv", "rb"),

    file_name=''data.csv'',

    mime=''csv'',

    )

    Listing 5-11

    11_download_dataframe.py

    ```


    In our example, we have used a CSV file from our local disk and provided to the
    download button. In the next section, we will see how we can provide a progress
    bar to the user while they are waiting.


    ## Progress Bars


    We have seen progress bars when downloading something from the Web. We can use
    it in the same way to let the user know that something is still downloading. See
    Listing [5-12](#532543_1_En_5_Chapter.xhtml#PC16).


    ```

    import streamlit as st

    import time

    st.title(''Progress Bar'')

    # Defining Progress Bar

    download = st.progress(0)

    for percentage in range(100):

    time.sleep(0.1)

    download.progress(percentage+1)

    st.write(''Download Complete'')

    Listing 5-12

    12_progress_bar.py

    ```


    In Figure [5-13](#532543_1_En_5_Chapter.xhtml#Fig13), we see a progress bar that
    has not started yet, whereas in Figure [5-14](#532543_1_En_5_Chapter.xhtml#Fig14)
    we see a progress bar that has reached 100 percent.


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig14_HTML.jpg)


    A snapshot depicts a progress bar that has reached the level, and the text download
    complete is displayed below.


    Figure 5-14


    Displaying a completed progress bar


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig13_HTML.jpg)


    A snapshot depicts a progress bar that has not yet started.


    Figure 5-13


    Displaying a progress bar


    In the next section, we will discuss spinners and when they can be used in our
    application.


    ## Spinners


    A spinner is used to display a message while the user is waiting for some task
    to execute in our application. Specifically, we can use a spinner while uploading
    data that is being processed by the application. The message is temporary in nature.
    See Listing [5-13](#532543_1_En_5_Chapter.xhtml#PC17).


    ```

    import streamlit as st

    import time

    st.title(''Spinner'')

    # Defining Spinner

    with st.spinner(''Loading...''):

    time.sleep(5)

    st.write(''Hello Data Scientists'')

    Listing 5-13

    13_spinner.py

    ```


    We have given the spinner five seconds of wait time, and it is displayed in Figure
    [5-15](#532543_1_En_5_Chapter.xhtml#Fig15) (a). After the wait time is over, we
    will display the "Hello Data Scientists" text, as shown in Figure [5-15](#532543_1_En_5_Chapter.xhtml#Fig15)
    (b).


    ![](images/532543_1_En_5_Chapter/532543_1_En_5_Fig15_HTML.jpg)


    Two snapshots depict a spinner. 1. The spinner with the loading symbol. 2. After
    the wait time, the spinner displays the text hello, data scientists.


    Figure 5-15


    Displaying a spinner a) buffering and b) after the wait time is over


    A spinner is often used when results are being processed in an application.


    ## Summary


    In this chapter, we discussed various kinds of buttons that can be used in our
    applications. We started with a default button and then moved on to radio buttons
    where we can have multiple options. We also discussed check boxes where we can
    have multiple options and a choice is made.


    We also saw drop-down menus in which a user can choose only one option from the
    given options. We also saw multiselect menus where we can choose more than one
    or all the options from the available choices. Then, we discussed using a download
    button to download files.


    Finally, we learned about progress bars and spinners that can be used while processing
    a task and downloading a file.


    In the next chapter, we will discuss more about getting different types of data
    via a form.'
