    \ 显示带有滚动和筛选选项的数据框\n\n```\n# Import Necessary libraries\nimport streamlit as st\n\
    import pandas as pd\nimport numpy as np\n# defining random values in a dataframe\
    \ using pandas and numpy\ndf = pd.DataFrame(\nnp.random.randn(30, 10),\ncolumns=('col_no\
    \ %d' % i for i in range(10)))\nst.dataframe(df)\nListing 2-11\n11_dataframe.py\n\
    ```\n\n我们可以固定应用程序中显示的数据框的高度和宽度。`Streamlit` 确定的默认大小是静态的，即使我们在应用程序内部更改表格大小，也不会受到影响。\n\
    \n> **注意：** 这也被称为*动态表格*，因为我们可以直接从应用程序更改表格中列的宽度和高度，而无需更改代码。\n\n我们可以使用 `highlight`\
    \ 函数，通过最小值、最大值和空值来高亮显示数据框对象。请参见清单 2-12。\n\n```\nimport streamlit as st\nimport\
    \ pandas as pd\nimport numpy as np\n# defining random values in a dataframe using\
    \ pandas and numpy\ndf = pd.DataFrame(\nnp.random.randn(30, 10),\ncolumns=('col_no\
    \ %d' % i for i in range(10)))\n# Highlighting minimum value objects\nst.dataframe(df.style.highlight_min(axis=0))\n\
    Listing 2-12\n12_dataframe_highlight.py\n```\n\n在清单 2-12 中，我们高亮显示了数据框中具有最小值的对象。图\
    \ 2-11 显示了应用程序中高亮显示数据框最小值的效果。\n\n![](img/532543_1_En_2_Fig11_HTML.jpg)\n\n一个包含\
    \ 9 列的表格，列标题为数字 0、1、2、3、4、5、6 和 7，以及它们在 9 行中对应的值。它在第 0 行和第 9 行高亮显示了值 -2.282765\
    \ 和 -1.917296。\n\n**图 2-11** 显示数据框中高亮显示的对象\n\n> **注意：** `Streamlit` Cloud 尚不支持将数据复制到剪贴板。\n\
    \n我们将在下一节学习如何显示表格。\n\n## 表格\n\n众所周知，表格和数据框在本质上相似，都有行和列。但是，在 `Streamlit` 中显示的表格本质上是静态的，并直接显示在应用程序页面上。请参见清单\
    \ 2-13 及图 2-12 中的输出。\n\n![](img/532543_1_En_2_Fig12_HTML.jpg)\n\n一个深色屏幕，显示一个包含\
    \ 10 列的表格，列标题为数字 0、1、2、3、4、5、6、7、8 和 9，以及它们在 20 行中对应的值。\n\n**图 2-12** 以表格格式显示数据\n\
    \n```\nimport streamlit as st\nimport pandas as pd\nimport numpy as np\n# defining\
    \ random values in a dataframe using pandas and numpy\ndf = pd.DataFrame(\nnp.random.randn(30,\
    \ 10),\ncolumns=('col_no %d' % i for i in range(10)))\n# defining data in table\n\
    st.table(df)\nListing 2-13\n13_table.py\n```\n\n如图 2-12 所示，应用程序中显示的是完整的表格，而不是使用数据框显示的默认数据。这是表格和数据框之间的主要区别之一。\n\
    \n> **注意：** `Streamlit` 应用程序中定义的表格本质上是静态的，并且没有像我们在数据框中看到的那样，可以在用户界面内滚动和更改表格尺寸的选项。\n\
    \n接下来，我们将了解另一个数据元素，它允许我们以独特的方式显示数据。\n"
- fmt: '# Metrics


    在 Streamlit 应用中，我们可以使用`metric()`函数通过指标来显示数据。该指标帮助用户轻松查看数据中的任何变化。我们可以定义数据的变化是正向、负向还是中性。


    现在，我们将使用`metric()`函数在应用中显示温度数据。参见清单 [2-14](#532543_1_En_2_Chapter.xhtml#PC16)
    和图 [2-13](#532543_1_En_2_Chapter.xhtml#Fig13) 的输出。


    ```

    import streamlit as st

    # Defining Metrics

    st.metric(label="Temperature", value="31 °C", delta="1.2 °C")

    Listing 2-14

    14_metric.py

    ```


    标签是`Temperature`，值是`31`，差值是`1.2`摄氏度。差值显示与标签关联的变化是正向、负向还是空值。参见图 [2-13](#532543_1_En_2_Chapter.xhtml#Fig13)。


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig13_HTML.jpg)


    一个深色矩形屏幕，显示文本温度、31 摄氏度，以及一个向上的箭头和 1.2 摄氏度。


    图 2-13


    显示温度指标


    类似地，我们可以通过为标签分配值和差值来显示任何指标，例如速度、降雨量、能量、卡路里等。参见清单 [2-15](#532543_1_En_2_Chapter.xhtml#PC17)。


    ```

    import streamlit as st

    #Defining Columns

    c1, c2, c3 = st.columns(3)

    # Defining Metrics

    c1.metric("Rainfall", "100 cm", "10 cm")

    c2.metric(label="Population", value="123 Billions", delta="1 Billions", delta_color="inverse")

    c3.metric(label="Customers", value=100, delta=10, delta_color="off")

    st.metric(label="Speed", value=None, delta=0)

    st.metric("Trees", "91456", "-1132649")

    Listing 2-15

    15_metric_all.py

    ```


    在清单 [2-15](#532543_1_En_2_Chapter.xhtml#PC17) 中，我们可以看到 Streamlit 支持的不同指标格式。`delta`是帮助用户了解值是否发生变化的数值。`delta_color`是为正值和负值定义的颜色；这里我们分别使用绿色和蓝色。参见图
    [2-14](#532543_1_En_2_Chapter.xhtml#Fig14)。


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig14_HTML.jpg)


    一个深色矩形屏幕，显示文本降雨量、人口、客户、速度和树木，以及它们对应的差值。


    图 2-14


    以多种形式显示指标


    我们还可以通过关闭指标来更改差值指示器为反向或中性。这在以下 JSON 示例中完成。


    ## JSON


    我们知道数据科学中的表格数据有时是 JSON 格式。JSON 格式是一种数据交换方式。它易于用户读写。当一个对象是字符串时，我们假设它将包含序列化的 JSON。清单
    [2-16](#532543_1_En_2_Chapter.xhtml#PC18) 展示了如何在 Streamlit 中将字符串或对象显示为 JSON 字符串。


    ```

    import streamlit as st

    #Defining Nested JSON

    st.json

    (

    { "Books" :

    [{

    "BookName" : "Python Testing with Selenium",

    "BookID" : "1",

    "Publisher" : "Apress",

    "Year" : "2021",

    "Edition" : "First",

    "Language" : "Python",

    },

    {

    "BookName": "Beginners Guide to Streamlit with Python",

    "BookID" : "2",

    "Publisher" : "Apress",

    "Year" : "2022",

    "Edition" : "First",

    "Language" : "Python"

    }]

    }

    )

    Listing 2-16

    16_json.py

    ```


    这里我们在代码中使用了嵌套 JSON。图 [2-15](#532543_1_En_2_Chapter.xhtml#Fig15) 展示了它在应用中的显示效果。


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig15_HTML.jpg)


    一个深色屏幕显示了一个 20 行的程序代码，其中包含书籍信息，包括书名、书籍 ID、出版商、年份、版本和语言。


    图 2-15


    显示 JSON 数据


    到目前为止，我们已经了解了如何在 Streamlit 应用中显示所有类型的数据格式。现在我们将检查另一种也可以在应用中显示数据的方法。


    ## `write()` 函数作为超级函数


    `write()` 函数类似于 Python 中的`print()`函数或 C 和 Java 中的`printf()`语句。`write()`函数是一个输出函数，用于在屏幕上显示内容。基本语法如下：


    ```

    st.write(input)

    ```


    `write()` 函数有一个特别之处，它不仅仅显示文本。我们将看到`write()`函数如何以不同方式使用。首先，我们将使用`write()`函数实现一个数据框。参见清单
    [2-17](#532543_1_En_2_Chapter.xhtml#PC20)。


    ```

    import streamlit as st

    import pandas as pd

    # Dataframe in write function

    st.write(pd.DataFrame({

    ''column one'': [5.436, 6.372, 3.645, 4.554, 7.263],

    ''column two'': [99, 55, 75, 41, 37],

    }))

    Listing 2-17

    17_write_df.py

    ```


    在图 [2-16](#532543_1_En_2_Chapter.xhtml#Fig16) 中，我们在`write()`函数中嵌入了一个数据框。类似地，我们可以在`write()`函数中引入多个参数。


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig16_HTML.jpg)


    一个屏幕截图显示了一个包含 3 列（标题为 column one 和 column two）以及它们对应 5 行值的表格。


    图 2-16


    使用`write()`函数显示数据框


    现在我们将看到另一个在`write()`函数中嵌入多个参数的示例。参见清单 [2-18](#532543_1_En_2_Chapter.xhtml#PC21)。


    ```

    import streamlit as st

    import pandas as pd

    import numpy as np

    df = pd.DataFrame(

    np.random.randn(30, 10),

    columns=(''col_no %d'' % i for i in range(10)))

    # defining multiple arguments in write function

    st.write(''Here is our Data'', df, ''Data is in dataframe format.\n'', "\nWrite
    is Super function")

    Listing 2-18

    18_write_mul_args.py

    ```


    我们没有在`write()`函数中使用默认的数据框定义。这里`write()`函数会自动检查与数据类型对应的值，并在我们的应用中显示它，如图 [2-17](#532543_1_En_2_Chapter.xhtml#Fig17)
    所示。


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig17_HTML.jpg)


    一个深色屏幕显示了一个包含 9 列（标题为列号 0、1、2、3、4、5、6 和 7）以及它们相关 10 行值的表格，以及文本“Data is in dataframe
    format”。


    图 2-17


    显示在`write()`函数中定义的多个对象


    在这个示例中，我们在单个`write()`函数中使用了两种数据类型：一种是文本，另一种是数据框，如图 [2-17](#532543_1_En_2_Chapter.xhtml#Fig17)
    所示。


    最后，我们将看到如何使用`write()`函数在应用中显示一个简单的图表。参见清单 [2-19](#532543_1_En_2_Chapter.xhtml#PC22)
    和图 [2-18](#532543_1_En_2_Chapter.xhtml#Fig18) 的输出。


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig18_HTML.jpg)


    一个深色屏幕显示了一个 col 2 与 col 1 的散点图。它绘制了呈下降趋势的数据。


    图 2-18


    使用`write()`函数显示图表


    ```

    # importing Necessary Libraries

    import pandas as pd

    import numpy as np

    import altair as alt

    import streamlit as st

    # Defining random Values for Chart

    df = pd.DataFrame(

    np.random.randn(10, 2),

    columns=[''a'', ''b''])

    # Defining Chart

    chart = alt.Chart(df).mark_bar().encode(

    x=''a'', y=''b'',  tooltip=[''a'', ''b''])

    # Defining Chart in write() function

    st.write(chart)

    Listing 2-19

    19_write_chart.py

    ```


    最后，我们将了解 Streamlit 中的魔法功能。'
  raw: '## Metrics


    In a Streamlit application , we can display data with indicators using the `metric()`
    function . This indicator helps the user see any changes in the data easily. We
    can define the change in data whether it is positive or negative or neutral.


    We will now display temperature data in our application by using the `metric()`
    function. See Listing [2-14](#532543_1_En_2_Chapter.xhtml#PC16) and the output
    in Figure [2-13](#532543_1_En_2_Chapter.xhtml#Fig13).


    ```

    import streamlit as st

    # Defining Metrics

    st.metric(label="Temperature", value="31 °C", delta="1.2 °C")

    Listing 2-14

    14_metric.py

    ```


    The label is `Temperature`, the value is 31, and the delta is 1.2 degrees Celsius.
    The delta shows the change in variation application whether it is a positive or
    negative or null value associated with the label. See Figure [2-13](#532543_1_En_2_Chapter.xhtml#Fig13).


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig13_HTML.jpg)


    A dark rectangle screen with a text temperature, of 31 degrees Celsius, and an
    upward arrow of 1.2 degrees Celsius.


    Figure 2-13


    Displaying temperature metrics


    Similarly, we can display any metrics such as speed, rainfall, energy, calories,
    etc., in the label by assigning application the value and delta value. See Listing
    [2-15](#532543_1_En_2_Chapter.xhtml#PC17).


    ```

    import streamlit as st

    #Defining Columns

    c1, c2, c3 = st.columns(3)

    # Defining Metrics

    c1.metric("Rainfall", "100 cm", "10 cm")

    c2.metric(label="Population", value="123 Billions", delta="1 Billions", delta_color="inverse")

    c3.metric(label="Customers", value=100, delta=10, delta_color="off")

    st.metric(label="Speed", value=None, delta=0)

    st.metric("Trees", "91456", "-1132649")

    Listing 2-15

    15_metric_all.py

    ```


    In Listing [2-15](#532543_1_En_2_Chapter.xhtml#PC17), we can see how different
    metrics formats application are supported by Streamlit. The delta is the value
    that helps users to know if any changes have been incurred from the value defined.
    The `delta_color` is the color defined for positive and negative values; here
    we use green and blue, respectively. See Figure [2-14](#532543_1_En_2_Chapter.xhtml#Fig14).


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig14_HTML.jpg)


    A dark rectangle screen with the text rainfall, population, customers, speed,
    and trees, along with its corresponding delta values.


    Figure 2-14


    Displaying metrics in various forms


    We can also change the delta indicator application to be inversed or neutral by
    turning it off. This is done in the following JSON example.


    ## JSON


    We know that tabular data application in data science is sometimes in JSON format.
    JSON format is a way to interchange data. It is easy to read and write for users.
    When an object is a string, we will assume that it will contain serialized JSON.
    Listing [2-16](#532543_1_En_2_Chapter.xhtml#PC18) shows how a string or object
    is displayed as a JSON string in Streamlit.


    ```

    import streamlit as st

    #Defining Nested JSON

    st.json

    (

    { "Books" :

    [{

    "BookName" : "Python Testing with Selenium",

    "BookID" : "1",

    "Publisher" : "Apress",

    "Year" : "2021",

    "Edition" : "First",

    "Language" : "Python",

    },

    {

    "BookName": "Beginners Guide to Streamlit with Python",

    "BookID" : "2",

    "Publisher" : "Apress",

    "Year" : "2022",

    "Edition" : "First",

    "Language" : "Python"

    }]

    }

    )

    Listing 2-16

    16_json.py

    ```


    Here we have used nested JSON in the code. Figure [2-15](#532543_1_En_2_Chapter.xhtml#Fig15)
    shows how it is displayed in the application.


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig15_HTML.jpg)


    A dark screen depicts a program code of 20 lines with the books that include the
    book name, book I D, publisher, year, edition, and language.


    Figure 2-15


    Displaying JSON data


    Up to now, we have seen how to display all types of data formats in the Streamlit
    application. Now we will check one more method that will also display data in
    an application.


    ## The write( ) Function as a Superfunction


    The `write()` function is similar to the `print()` function in Python or the `printf()`
    statements in C and Java. The `write()` function is an output function that is
    displayed on the screen. The basic syntax is given here:


    ```

    st.write(input)

    ```


