    ## Introduction


    Streamlit is an application framework for web development based on Python. Streamlit
    was designed to reduce the time needed for developing web-based application prototypes
    for data and machine learning (ML) models. This framework helps to develop data
    enhanced analytics, build dynamic user experience, and showcase data for data
    science/ML models. The book provides insight that will help you to create high-quality
    applications using Python. The book uses a hands-on approach for creating such
    prototypes quickly.


    The book starts by covering the basics of Streamlit by showing how to build a
    basic application and steps up incrementally, covering visualization techniques
    and their corresponding features. The book also covers various web application
    features that can be incorporated into Streamlit applications. You will also learn
    to handle the flow control of applications and status elements. The book also
    deals with performance optimization techniques necessary for data modules in an
    application. Last, you will learn how to deploy Streamlit applications on cloud-based
    platforms. You will also learn about a few prototype apps in the natural language
    processing (NLP) and computer vision fields that can be implemented from scratch
    using Streamlit.


    By the end of this book, you will have a complete understanding of all the concepts,
    functionalities, and performance of Streamlit applications. This will enable you
    to be confident enough to develop your own dynamic Streamlit web applications.


    ### What Is in the Book


    The following is a brief summary of each chapter to help you better understand
    the structure of this book.


    Chapter [1](#532543_1_En_1_Chapter.xhtml) will introduce you to the Streamlit
    library. It will walk you through the process of installing and running your first
    application.


    Chapter [2](#532543_1_En_2_Chapter.xhtml) discusses text and dataframes that are
    represented in various forms in an application.


    Chapter [3](#532543_1_En_3_Chapter.xhtml) covers visualization. Visualization
    is one of the important aspects of data science and machine learning. The visualizing
    techniques help you to understand the data more appropriately. In this chapter,
    we will implement the different visualizing techniques that are available in Streamlit
    as well as in other Python libraries for data science and machine learning developers.


    Chapter [4](#532543_1_En_4_Chapter.xhtml) will discuss different media elements
    such as images, video, audio, etc., that can be implemented in an application.


    Chapter [5](#532543_1_En_5_Chapter.xhtml) will introduce the button feature in
    Streamlit and how these buttons are used to select the required data to process
    or visualize data in applications being developed.


    Chapter [6](#532543_1_En_6_Chapter.xhtml) mainly focuses on data provided by the
    user and how to process that data in an application. We will discuss user data
    in terms of forms.


    Chapter [7](#532543_1_En_7_Chapter.xhtml) discusses column layouts, containers,
    and navigation in applications. It will also focus on how to switch between multiple
    pages in applications using navigation.


    Chapter [8](#532543_1_En_8_Chapter.xhtml) introduces the custom handling of applications
    using control flow. You will also learn about status elements provided by Streamlit.
    Additionally, the chapter discusses how to handle huge data and optimize the performance
    of a Streamlit application.


    Chapter [9](#532543_1_En_9_Chapter.xhtml) will introduce the development and deployment
    of an NLP application on the cloud-based platform Heroku.


    Chapter [10](#532543_1_En_10_Chapter.xhtml) covers the development of a complete
    Streamlit application on a computer vision model from scratch. The features covered
    in the earlier chapters will be used in this application.


    ### Who This Book Is For


    This book is for professionals working in the data science and machine learning
    domains who want to showcase and deploy their work in a web application with no
    prior knowledge of web development. This book will help you learn basic Streamlit
    components in order to deploy your research work or prototypes. The book also
    guides you in developing dynamic data applications.


    ### Source Code


    The source code is available on GitHub at [`https://github.com/apress/beginners-guide-streamlit-python`](https://github.com/apress/beginners-guide-streamlit-python).


    ## Acknowledgments


    I would like to thank my mom, Indumati Raghavendra, and brother, Sumedh Raghavendra,
    for their constant love, support, and encouragement.


    ## About the Author About the Technical Reviewer


    # 1. Introduction to Streamlit


    In this first chapter, we will take a look at Streamlit and its core features.
    We will also discuss why Streamlit is needed and compare it to alternatives. Next,
    we will discuss the installation steps to run Streamlit applications on various
    operating systems. Finally, we will develop and run our first Streamlit application.


    ## What Is Streamlit?


    Streamlit is an open-source Python framework released in October 2019. It acts
    as a medium between data and user interaction within an application. The goal
    of developing the Streamlit library was to enable data scientists and machine
    learning engineers to interpret and deploy data in a user interface (UI) with
    no prior knowledge of web development tools such as `Flask`, `Django`, `Node`,
    etc., using Python. Streamlit is the name of a software company founded by Adrien
    Treuille, Amanda Kelly, and Thiago Teixeira in 2018 in San Francisco, California.


    The Streamlit framework uses the Python language and APIs for deploying built-in
    objects in the application. Thousands of companies, startups, professionals, and
    freelancers use Streamlit to deploy models or present data insights to their clients
    around the globe. We will now look into the reasons for using Streamlit.


    ## Why Streamlit?


    The Streamlit library was developed to focus on prototype applications for data-driven
    and machine learning models. The prototype application is easy to use with no
    prior knowledge of web development. You just need basic knowledge of Python and
    Streamlit to develop such apps. Traditional development of applications is time-consuming
    when compared to Streamlit-based development, and Streamlit apps are interactive
    in nature. An application developed using Streamlit will act as a tailwind for
    many companies by reducing process time and cost.'
