    # 3. Visualization


    In the previous chapter, you saw how data in the form of text and tables can be
    utilized in Streamlit. In this chapter, we will learn what data visualization
    is and explore Streamlit’s functions to visualize data. Later, you’ll see how
    flexible is Streamlit with various Python Libraries to visualize data.


    ## The Importance of Visualization


    The visualization of data is important to assist businesses in analyzing recent
    data trends. When data is represented in the form of charts or graphs, it is easy
    to decipher and interpret. In data science and machine learning, raw data is visualized
    to model trends and to reach conclusions about the data.


    In addition, visualized data is better for communication between parties and to
    interrelate the associated factors of the data. The visualized data gives business
    owners, decision-makers, and stakeholders a better understanding of their data
    and can help them grow their business.


    ## Visualization in Streamlit


    With Streamlit, we can develop customized dashboards for visualizing our data.
    We can also create any kind of visualization tool in Streamlit as it supports
    all the Python libraries. We will look at a few main libraries in this chapter
    such as Plotly, Altair, Seaborn, and Matplotlib. We will also discuss various
    graphs that can be visualized in the Streamlit application. Now we will discuss
    the purpose of visualization.


    ## Purpose of Visualization


    For data scientists and business analysts, visualization helps to identify patterns
    and errors in the data provided. For example, during the recent pandemic, scientists
    visualized data to inform the public about the ongoing situation. Patterns were
    recognized from the data to identify COVID hotspots. This was done on various
    types of charts and graphs such as bar charts, line charts, heatmaps, pie graphs,
    scatter graphs, etc.


    Visualizing data helps to solve many issues in business and to develop algorithms
    accordingly. This in turn speeds up decision-making when solving the inaccuracies
    identified. In Streamlit, we can create visualization dashboards or tool with
    less code.


    ## Streamlit Functions


    We will now discuss the built-in visualization functions available in Streamlit.


    ### Bar


    To represent data points in vertical bars, we can use a bar chart. The built-in
    `st.bar_chart()` function can plot the data points in a Streamlit application.
    It is similar to `st.altair_chart()`, which is defined later in the chapter. See
    Listing [3-1](#532543_1_En_3_Chapter.xhtml#PC1).


    ```

    import streamlit as st

    import pandas as pd

    import numpy as np

    st.title(''Area'')

    # Defining dataframe with its values

    df = pd.DataFrame(

    np.random.randn(40, 4),

    columns=["C1", "C2", "C3", "C4"])

    # Bar Chart

    st.bar_chart(df)

    Listing 3-1

    01_bar_chart.py

    ```


    The `st.bar_chart()` function directly plots a graph by figuring out a column
    and its associated values, making it easiest to use. In Listing [3-1](#532543_1_En_3_Chapter.xhtml#PC1),
    we have not defined any values related to the x- and y-axes.


    This function is less customizable, and we do not need to specify dataframe values.
    As shown in Figure [3-1](#532543_1_En_3_Chapter.xhtml#Fig1), the values of each
    column are plotted in a vertical bar with different colors.


    Next, we will discuss line charts.


