    选择后的多选输出结果


    ![](img/532543_1_En_5_Fig10_HTML.jpg)


    下拉列表中创建多选功能的截图。文本显示“你的爱好是什么”，并显示一个没有预定义值的下拉列表。


    图 5-10


    无预选值的多选输出结果


    ```

    hobbies = st.multiselect(

    ''你的爱好是什么'',

    [''阅读'', ''烹饪'', ''看电影/电视剧'',

    ''玩游戏'', ''绘画'', ''徒步'']

    代码清单 5-9

    09_mutlti_select_no_pre_select.py

    ```


    接下来我们将学习如何使用下载按钮下载文件。


    **注意：** 如果多选选项超过 100 个属性，用户可能会遇到较长的加载时间。因此，建议使用较少的属性。


    ## 下载按钮


    当我们允许用户直接从应用程序下载结果或文件时，Streamlit 提供了一个供用户点击的下载按钮。文件格式可以是 JPG/PNG、TXT、CSV 等。参见代码清单
    5-10。


    ```

    import streamlit as st

    st.title("下载按钮")

    # 创建下载按钮

    down_btn = st.download_button(

    label="下载图片",

    data=open("./files/fam.jpg", "rb"),

    file_name="lions.jpg",

    mime="image/jpg"

    )

    代码清单 5-10

    10_download_button.py

    ```


    在上述代码中，我们为下载按钮分配了一张图片。当用户点击“下载图片”按钮时，一个 JPG 文件将被下载到本地系统。见图 5-12。


    ![](img/532543_1_En_5_Fig12_HTML.jpg)


    两张截图展示了带有下载选项的下载按钮的创建过程。在第二张截图中，用矩形高亮显示了“下载图片”按钮。


    图 5-12


    显示下载图片按钮 a) 点击前 和 b) 点击后


    类似地，我们可以使用下载按钮来下载 CSV 文件。在某些情况下，我们可以通过下载按钮将分析结果的数据框转换为 CSV 格式。参见代码清单 5-11。


    ```

    st.download_button(

    label="下载 CSV",

    data=open("./files/avocado.csv", "rb"),

    file_name=''data.csv'',

    mime=''csv'',

    )

    代码清单 5-11

    11_download_dataframe.py

    ```


    在我们的示例中，我们使用了本地磁盘上的一个 CSV 文件，并将其提供给下载按钮。在下一节中，我们将了解如何在用户等待时提供进度条。


    ## 进度条


    我们在从网络下载东西时都见过进度条。我们可以用同样的方式让用户知道某些内容仍在下载中。参见代码清单 5-12。


    ```

    import streamlit as st

    import time

    st.title(''进度条'')

    # 定义进度条

    download = st.progress(0)

    for percentage in range(100):

    time.sleep(0.1)

    download.progress(percentage+1)

    st.write(''下载完成'')

    代码清单 5-12

    12_progress_bar.py

    ```


    在图 5-13 中，我们看到一个尚未开始的进度条，而在图 5-14 中，我们看到一个已达到 100% 的进度条。


    ![](img/532543_1_En_5_Fig14_HTML.jpg)


    一张截图展示了一个已达到 100% 的进度条，下方显示文本“下载完成”。


    图 5-14


    显示已完成的进度条


    ![](img/532543_1_En_5_Fig13_HTML.jpg)


    一张截图展示了一个尚未开始的进度条。


    图 5-13


    显示进度条


    在下一节中，我们将讨论旋转加载器以及何时可以在应用程序中使用它们。


    ## 旋转加载器


    旋转加载器用于在用户等待应用程序执行某些任务时显示一条消息。具体来说，我们可以在上传数据并由应用程序处理时使用旋转加载器。该消息是临时性的。参见代码清单 5-13。


    ```

    import streamlit as st

    import time

    st.title(''旋转加载器'')

    # 定义旋转加载器

    with st.spinner(''加载中...''):

    time.sleep(5)

    st.write(''你好，数据科学家们'')

    代码清单 5-13

    13_spinner.py

    ```


    我们为旋转加载器设置了 5 秒的等待时间，如图 5-15 (a) 所示。等待时间结束后，我们将显示“你好，数据科学家们”文本，如图 5-15 (b) 所示。


    ![](img/532543_1_En_5_Fig15_HTML.jpg)


    两张截图展示了一个旋转加载器。1. 带有加载符号的旋转加载器。2. 等待时间结束后，旋转加载器显示文本“你好，数据科学家们”。


    图 5-15


    显示旋转加载器 a) 缓冲中 和 b) 等待时间结束后


    旋转加载器通常用于应用程序正在处理结果时。


    ## 总结


    在本章中，我们讨论了可以在应用程序中使用的各种按钮。我们从默认按钮开始，然后介绍了可以包含多个选项的单选按钮。我们还讨论了复选框，其中可以有多个选项并进行选择。


    我们还看到了下拉菜单，用户只能从给定选项中选择一个。我们还介绍了多选菜单，我们可以从可用选项中选择多个或全部选项。然后，我们讨论了使用下载按钮下载文件。


    最后，我们学习了进度条和旋转加载器，它们可以在处理任务和下载文件时使用。


    在下一章中，我们将进一步讨论如何通过表单获取不同类型的数据。

