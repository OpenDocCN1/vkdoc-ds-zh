    # 总结


    本章从表单中的文本框开始讲起。我们还了解了如何使用文本框来输入密码。接着，我们讨论了使用文本区域进行多行文本输入。之后，我们探讨了如何接收数字作为输入。


    当用户想要提交表单时，我们讨论了时间和日期输入。我们还介绍了一种颜色选择方法，用户可以通过该方法向表单输入颜色代码。


    然后，我们讨论了可以接受作为输入数据的不同文件格式，例如 `.txt`、`.docx`、`.csv` 和图片。我们了解了如何上传这些文件并将其保存到目录中。最后，我们学习了如何使用提交按钮来提交表单数据。


    在下一章中，我们将探讨布局和导航。


    # 7. 列与导航


    在本章中，我们将讨论如何设置列、布局和导航，以便在其中插入元素。这些将有助于将我们的应用程序划分为网格。当我们的应用程序需要多个页面时，就会使用这种导航方式。我们还将探索如何使用侧边栏。让我们从列开始。


    ## 列


    我们将在应用程序中插入并排的列。我们将使用 Streamlit 内置的 `st.columns()` 函数来定义列。


    要创建的列数由 `st.columns()` 函数中作为参数给出的整数值指定。参见代码清单 7-1。


    ```python

    import streamlit as st

    # 定义列

    col1, col2 = st.columns(2)

    # 在列 1 中插入元素

    col1.write("第一列")

    col1.image("files/fam.jpg")

    # 在列 2 中插入元素

    col2.write("第二列")

    col2.image("files/fam.jpg")

    ```


    在我们的示例中，我们创建了两列，每列都包含一个图片元素。如图 7-1 所示，这些列被均等划分。


    ![](img/532543_1_En_7_Fig1_HTML.jpg)


    一张截图显示了两张大小相同的图片。图片中有一群母狮和它们的幼崽坐在草坪上，每张图片分别标注为“第一列”和“第二列”。


    图 7-1：两列以相同大小显示其中的元素


    我们在每列中放置了两个元素：一个是文本，另一个是图片。使用相同的图片是为了展示列之间可能存在的差异。创建的列具有响应式特性，这意味着当应用程序在不同设备上查看时，列的大小会相应改变。


    ## 间距列


    我们可以通过指定列的宽度来设置其大小。具有最大宽度的列被称为*间距列*。参见代码清单 7-2。


    ```python

    import streamlit as st

    from PIL import Image

    img = Image.open("files/fam.jpg")

    st.title("间距列")

    # 定义两行

    for _ in range(2):

    # 定义列的数量及大小

    cols = st.columns((3, 1, 2, 1))

    cols[0].image(img)

    cols[1].image(img)

    cols[2].image(img)

    cols[3].image(img)

    ```


    在此代码清单中，我们定义了两行四列，每列都包含图片（图 7-2）。第一列最宽，其次是第三列，另外两列大小相同。第一列和第三列被称为*间距列*，因为它们比第二列和第四列更宽。


    ![](img/532543_1_En_7_Fig2_HTML.jpg)


    一个深色屏幕，显示文本“间距列”。它有 4 列，每列都有一张母狮群的照片。第一列最宽，其次是第三列，第二列和第四列大小相同。


    图 7-2：间距列


    我们可以指定任意数量的间距列。


    > **注意：** 也可以在 `st.columns()` 函数中使用元组来指定每列的宽度。


    ## 带填充的列


    添加填充是为了在两列之间创建额外的空间。这有助于区分两列中的元素。代码清单 7-3 演示了如何实现这一点。


    ```python

    import streamlit as st

    from PIL import Image

    img = Image.open("files/fam.jpg")

    st.title("填充")

    # 定义带填充的列

    col1, padding, col2 = st.columns((10,2,10))

    with col1:

    col1.image(img)

    with col2:

    col2.image(img)

    ```


    我们定义了一个空列作为填充，如图 7-3 所示。


    ![](img/532543_1_En_7_Fig3_HTML.jpg)


    一个深色屏幕，标题为“填充”。它有两列，中间有很宽的空间。每列都有一张母狮群坐在草坪上的照片。


    图 7-3：带填充的列


    > **注意：** 填充是放置在两列之间的一个空列，用于在那里创建空间。


    ## 网格


    可以使用前面所示的 `st.columns()` 函数创建网格。在循环中创建多个列将得到网格。参见代码清单 7-4。


    ```python

    import streamlit as st

    from PIL import Image

    img = Image.open("files/fam.jpg")

    st.title("网格")

    # 定义行数

    for _ in range(4):

    # 定义列的数量及大小

    cols = st.columns((1, 1, 1, 1))

    cols[0].image(img)

    cols[1].image(img)

    cols[2].image(img)

    cols[3].image(img)

    ```


    网格用于通过大小和位置来对齐其中的元素。在我们的示例中，我们定义了大小相同的 (4 * 4) 行和列，如图 7-4 所示。


    ![](img/532543_1_En_7_Fig4_HTML.jpg)


    一个深色屏幕，标题为“网格”。它有 4 列和 4 行，彼此间距相等。每个单元格都有一张母狮群坐在草坪上的照片。


    图 7-4：显示网格


    网格可用于图片库或书籍、音乐、电影等的推荐系统，在这些场景中，我们需要在单个页面上以网格格式指定大量数据。


    ## 扩展器/手风琴


    当我们想对用户隐藏额外信息，或者不希望信息始终显示在应用程序中时，我们可以使用手风琴。这些也称为*扩展器*，因为当用户将扩展器切换到打开状态时，它会展开并显示额外信息。参见代码清单
    7-5。


    ```python

    import streamlit as st

    st.title(''扩展器'')

    # 定义扩展器

    with st.expander("Streamlit with Python"):

    st.write("在几分钟内开发机器学习应用！！！！")

    ```


    我们创建了包含一些文本信息的扩展器。只有当用户点击扩展器时，文本信息才会显示。图 7-5 显示了一个关闭状态的扩展器。


    ![](img/532543_1_En_7_Fig5_HTML.jpg)


    一个深色屏幕显示文本“扩展器”。下方有一个选项，显示“Streamlit with Python”，并带有一个加号按钮。


    图 7-5：显示关闭状态的扩展器


    当你点击一个扩展器时，你将看到其中包含的信息，如图 7-6 所示。


    ![](img/532543_1_En_7_Fig6_HTML.jpg)


    一个深色屏幕显示文本“扩展器”。下方有一个选项，显示“Streamlit with Python”，以及“在几分钟内开发机器学习应用”。


    图 7-6：打开时显示文本信息


    信息可以是文本、图片、图表等。


    > **注意：** 我们可以使用 `write()` 函数在手风琴或扩展器中添加信息。

