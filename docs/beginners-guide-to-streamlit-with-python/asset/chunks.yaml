- fmt: '### Session State


    Session state is a unique feature of the Streamlit library where we can store
    values and share the same values between the application reruns. It holds a key-value
    pair similar to a Python dictionary. We can use the following command to access
    session state:


    ```

    st.session_state

    ```


    We can use the key to access the session state by using the following command:


    ```

    st.session_stat[''key'']

    ```


    **Note:** The session state holds the value of only the current session, and after
    refreshing, a new session state is created.


    Once we refresh the page, a new session is created, and the value stored in the
    session state is erased. The application then stores the value of the new session.
    See Listing [8-8](#532543_1_En_8_Chapter.xhtml#PC12).


    ```

    import streamlit as st

    st.title(''Session State'')

    # Session state initialization

    if ''sum'' not in st.session_state:

    st.session_state.sum = 0

    # Button to add value

    add = st.button(''Add One'')

    if add:

    st.session_state.sum += 1

    st.write(''Total Sum = '', st.session_state.sum)

    Listing 8-8

    8_session_state.py

    ```


    We have a button that adds one value to the total sum when we click it. Every
    time we click the button, the application reruns and stores the incremented value
    in the session state. If the session state is not initialized, then the session
    state value is set to zero.


    ![](images/532543_1_En_8_Chapter/532543_1_En_8_Fig4_HTML.jpg)


    A snapshot of two windows describes the session state. 1. The text of add one
    is displayed and the total sum value is 0 before initializing the session. 2.
    The text of add one is highlighted and the total sum value is 15 after initializing
    the session.


    **Figure 8-4** Displaying the session state sum a) before initialization and b)
    after initialization


    In Listing [8-8](#532543_1_En_8_Chapter.xhtml#PC12), we saw that the values are
    stored between the reruns in the session state.


    ### Performance


    In this section, we will look into some of the techniques that help to increase
    performance by increasing the robustness of computations in an application. We
    will discuss how to increase the performance of the application by using the default
    settings as well as advanced options.


    ### Caching


    When we want to load a large dataset, manipulate data, or perform heavy computational
    work, we need our application to remain stable and perform as expected. The caching
    mechanism is provided by Streamlit to handle such things.


    When we use a cache in our application as a decorator, Streamlit will look at
    the following things:


    - The input parameters of the called function

    - The external variable value used in the function

    - The body of the function

    - Any function body used inside the cached function


    When Streamlit sees these components for the first time in the same order, it
    will store the values when the script is executed.


    Streamlit monitors if there are any changes in the components by using a hashing
    technique. This is similar to a key-value pair in the memory store wherein the
    key is a hash and the value is the object passed by reference.


    This is a basic example of a cache:


    ```

    import streamlit as st

    import time

    # Defining cache

    @st.cache

    def add(x, y):

    # Function takes 5 secs to run

    time.sleep(5)

    return x + y

    x = 10

    y = 60

    res = add(x, y)

    st.write("Result:", res)

    ```


    When the script runs for the first time, we will get five seconds of wait time.
    After the first run, when the script is executed again, the result is directly
    returned with no wait time. This is due to the cache we have defined that takes
    the previous stored data and provides the result. Hence, we can use the cache
    for large datasets.


    ### `st.experimental_memo`


    In the case of high computations, we use `experimental_memo` to store data. It
    holds cache data in key-value format. The command to initialize `experimental_memo`
    is as follows:


    ```

    @st.experimental_memo

    ```


    We can use `@st.experimental_memo` in place of `@cache` to store the results from
    heavy computations. It is derived from the same API as the cache.


    ### `st.experimental_memo.clear()`


    To clear the cache store in `st.experimental_memo`, we will use the following
    command:


    ```

    st.experimental_memo.clear()

    ```


    The memo can be used to store downloaded data or for dataframe computations or
    calculations between *n* digits, respectively.


    ### `st.experimental_singleton`


    All users connected to the app share each singleton object. Since they can be
    accessed by multiple threads at once, singleton objects must be thread-safe. To
    define a singleton, we will use the following statement:


    ```

    @st.experimental_singleton

    ```


    A Streamlit application shares this key-value store with all of its sessions.
    It works well for storing large singleton objects over sessions such as database
    connections or sessions for TensorFlow, Torch, or Keras.


    ### `st.experimental_singleton.clear()`


    When the singleton is holding the data and needs to be cleared, we use the following
    function:


    ```

    st.experimental_singleton.clear()

    ```


    ## Summary


    In this chapter, we discussed various alert boxes that can be used to notify the
    user about certain information. We also discussed how to change the default control
    flow of the application.


    Finally, we discussed in detail the advanced features that are available in the
    Streamlit application and that are used to enhance performance, reliability, and
    stability.


    In the next chapter, we will develop a natural language processing application
    from scratch and deploy it.


    # 9. Natural Language Processing


    In this chapter, we will develop a natural language processing (NLP) application
    from scratch. This application will demonstrate how it works as well as give you
    the complete instructions for developing an application using Streamlit and thereafter
    deploying on the Heroku platform.


    ## NLP App Creation


    In this section, we will create an NLP application that will predict whether sentiments
    are positive, negative, or neutral. In this application, we will take the user
    input and check the sentiment polarity of the sentence.


    First, we need to import the necessary Python packages including Streamlit (Listing
    [9-1](#532543_1_En_9_Chapter.xhtml#PC1)).


    ```

    import streamlit as st

    # NLP Pkgs

    from textblob import TextBlob

    from nltk.stem.wordnet import WordNetLemmatizer

    import re

