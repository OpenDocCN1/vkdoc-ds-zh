    Finally, we will discuss how to submit all the previously mentioned types of form
    data.


    ## Submit Button


    When input form data is changed by the user, the application needs to rerun, causing
    a bad user experience. To solve this issue of the application rerunning every
    time the user makes changes in the data, we can use the `form_submit_button()`
    function, as shown in Listing [6-17](#532543_1_En_6_Chapter.xhtml#PC18).


    ```

    import streamlit as st

    my_form = st.form(key=''form'')

    my_form.text_input(label=''Enter any text'')

    # Defining submit button

    submit_button = my_form.form_submit_button(label=''Submit'')

    Listing 6-17

    17_form_submit.py

    ```


