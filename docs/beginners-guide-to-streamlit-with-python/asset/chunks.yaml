  raw: '## Summary


    We started this chapter with text boxes in a form. We also saw how a text box
    can be used to insert a password. We then discussed multiline text inputs using
    a text area. Later, we discussed taking numbers as input.


    We discussed time and date inputs when user wants to submit a form. We also looked
    at a color selection method where the user can give a color code as input to the
    form.


    Then we discussed different file formats such as `.txt`, `.docx`, `.csv`, and
    images that can be accepted as input data. We saw how these files can be uploaded
    and saved in a directory. Finally, we learned how to submit this form data using
    a submit button.


    In the upcoming chapter, we will look at layouts and navigation.


    # 7. Columns and Navigation


    In this chapter, we will discuss how to set up columns, layouts, and navigation
    into which we can insert elements. These will help to divide our application into
    grids. This type of navigation is used when we need more than one page in our
    application. We will also explore how to use sidebars. Let’s get started with
    columns.


    ## Columns


    We will be inserting side-by-side columns into our application. We will be using
    the `st.columns()` function to define columns , which is built in to Streamlit.


    The number of columns to be created is specified by an integer value given as
    a parameter in the `st.columns()` function . See Listing [7-1](#532543_1_En_7_Chapter.xhtml#PC1).


    ```

    import streamlit as st

    #Defining Columns

    col1, col2 = st.columns(2)

    # Inserting Elements in column 1

    col1.write("First Column")

    col1.image("files/fam.jpg")

    # Inserting Elements in column 2

    col2.write("Second Column")

    col2.image("files/fam.jpg")

    Listing 7-1

    1_columns.py

    ```


    In our example, we have created two columns with an image as element in each one.
    The columns are equally divided, as revealed in Figure [7-1](#532543_1_En_7_Chapter.xhtml#Fig1).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig1_HTML.jpg)


    A screenshot displays 2 pictures of the same size. It has a group of lionesses
    sitting with their cubs on the lawn, each is titled first column and second column.


    Figure 7-1


    Two columns displaying elements in them with the same size


    We have put two elements in each column ; one is text, and the other is an image.
    The same image has been used to show the difference between the columns, if any.
    The columns created are responsive in nature, which means when an application
    is viewed on different devices, the columns change their size accordingly.


    ## Spaced-Out Columns


    We can set a column’s size by specifying its width. The column with the maximum
    width is known as a *spaced-out column* . See Listing [7-2](#532543_1_En_7_Chapter.xhtml#PC2).


    ```

    import streamlit as st

    from PIL import Image

    img = Image.open("files/fam.jpg")

    st.title("Spaced-Out Columns")

    # Defining two Rows

    for _ in range(2):

    # Defining no. of columns with size

    cols = st.columns((3, 1, 2, 1))

    cols[0].image(img)

    cols[1].image(img)

    cols[2].image(img)

    cols[3].image(img)

    Listing 7-2

    2_spaced_out.py

    ```


    In this listing, we have defined four columns with two rows that have images in
    them (Figure [7-2](#532543_1_En_7_Chapter.xhtml#Fig2)). The first column is the
    widest, followed by the third column, and the other two columns have the same
    size. The first and third columns are said to be *spaced-out* as they are wider
    compared to the second and fourth columns.


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig2_HTML.jpg)


    A dark screen with text spaced out columns. It has 4 columns. Each has a photo
    of a lioness group. The first column is the widest, followed by the third, and
    the second and fourth are the same size.


    Figure 7-2


    Spaced-out columns


    We can specify any number of columns with spaced-out columns .


    Note


    A tuple can also be used in the `st.streamlit()` function to specify the width
    of each column.


    ## Columns with Padding


    Padding is added to create extra space between two columns. This helps to differentiate
    the elements present in the two columns. Listing [7-3](#532543_1_En_7_Chapter.xhtml#PC3)
    illustrates how to do this.


    ```

    import streamlit as st

    from PIL import Image

    img = Image.open("files/fam.jpg")

    st.title("Padding")

    # Defining Padding with columns

    col1, padding, col2 = st.columns((10,2,10))

    with col1:

    col1.image(img)

    with col2:

    col2.image(img)

    Listing 7-3

    3_column_padding.py

    ```


    We have defined an empty column as padding, as shown in Figure [7-3](#532543_1_En_7_Chapter.xhtml#Fig3).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig3_HTML.jpg)


    A dark screen is titled padding. It has 2 columns with a wide space. Each has
    a photo of a group of lionesses sitting on the lawn.


    Figure 7-3


    Columns with padding


    Note


    Padding is an empty column placed between two columns to create a space there.


    ## Grids


    Grids can be created using the `st.columns()` function as shown earlier. Creating
    multiple columns in a loop will get us a grid. See Listing [7-4](#532543_1_En_7_Chapter.xhtml#PC4).


    ```

    import streamlit as st

    from PIL import Image

    img = Image.open("files/fam.jpg")

    st.title("Grid")

    # Defining no of Rows

    for _ in range(4):

    # Defining no. of columns with size

    cols = st.columns((1, 1, 1, 1))

    cols[0].image(img)

    cols[1].image(img)

    cols[2].image(img)

    cols[3].image(img)

    Listing 7-4

    4_grid.py

    ```


    Grids are used to align the elements inside them using size and position. In our
    example, we have defined (4 * 4) rows and columns with the same size, as displayed
    in Figure [7-4](#532543_1_En_7_Chapter.xhtml#Fig4).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig4_HTML.jpg)


    A dark screen with a title grid. It has 4 columns and 4 rows with equal spaces
    between them. Each has a photo of a group of lionesses sitting on the lawn.


    Figure 7-4


    Displaying grids


    Grids can be used for an image gallery or a recommendation system for books, music,
    movies, etc., where we need to specify a large amount of data in a grid format
    on a single page.


    ## Expanders/Accordions


    When we want to hide additional information from the user or don’t want information
    to always appear on our application, we can use accordions. These are also known
    as *expanders* as when the user toggles an expander into its open state, it expands
    and displays the extra information. See Listing [7-5](#532543_1_En_7_Chapter.xhtml#PC5).


    ```

    import streamlit as st

    st.title(''Exapanders'')

    # Defining Expanders

    with st.expander("Streamlit with Python"):

    st.write("Develop ML Applications in Minutes!!!!")

    Listing 7-5

    5_expanders.py

    ```


    We have created expanders with some text information in them. The text information
    is shown only when the user clicks the expander. Figure [7-5](#532543_1_En_7_Chapter.xhtml#Fig5)
    shows a closed expander.


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig5_HTML.jpg)


    A dark screen reads a text, Expanders. It has an option below that reads streamlit
    with python with a plus button.


    Figure 7-5


    Displaying closed expanders


    When you click an expander, you will see the information that is available in
    it, as in Figure [7-6](#532543_1_En_7_Chapter.xhtml#Fig6).


    ![](images/532543_1_En_7_Chapter/532543_1_En_7_Fig6_HTML.jpg)


    A dark screen reads a text, Expanders. It has an option below that reads streamlit
    with python, and develop M L application in minutes.


    Figure 7-6


