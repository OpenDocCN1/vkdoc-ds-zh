    ### Cleaning the Text


    Cleaning text is done in different ways. In our case, we will remove any whitespaces,
    web links, punctuations, and digits from the text entered by the user. We will
    also apply lemmatization to the text that will give a single word for the inflected
    forms. See Listing [9-3](#532543_1_En_9_Chapter.xhtml#PC3).


    ```

    #Keeping only Text and digits

    text = re.sub(r"[^A-Za-z0-9]", " ", text)

    #Removes Whitespaces

    text = re.sub(r"\''s", " ", text)

    # Removing Links if any

    text = re.sub(r"http\S+", " link ", text)

    # Removes Punctuations and Numbers

    text = re.sub(r"\b\d+(?:\.\d+)?\s+", "", text)

    # Splitting Text

    text = text.split()

    # Lemmatizer

    lemmatizer = WordNetLemmatizer()

    lemmatized_words =[lemmatizer.lemmatize(word) for word in text]

    text = " ".join(lemmatized_words)

