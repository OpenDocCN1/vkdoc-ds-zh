    # 文本/Docx 文档


    仅包含文本数据的文件被视为文本文档。文本文件可以使用记事本等文本编辑器创建。我们将了解如何将文本文档（特别是 `.docx` 文件）上传到我们的应用程序中。为了查看
    `.docx` 文件的内容，我们将使用 `docx2txt` Python 库。还有其他类似的库可供使用。请参见代码清单 6-11 和图 6-13。


    ![](img/532543_1_En_6_Fig13_HTML.jpg)


    一个深色屏幕，显示文本“Docx”和文本文档，包含上传文档字段，并在左下方有“检查详情”按钮。


