- fmt: '# Why Streamlit for Data Science and ML Engineers?


    We know that data science and machine learning use a technical medium to extract
    data and present this information with its associated insights to clients/stakeholders.
    Most of the time Python scripts or programs are developed as custom tools by data
    scientists and ML engineers. When they want to showcase these insights with their
    clients/stakeholders, it becomes extremely difficult to share the developed scripts/programs.
    It is also difficult to represent the data to nontechnical customers/users.


    Let’s assume that you are a data science or ML employee working in a company.
    With the client’s requirements, you have been asked to develop a customized interactive
    tool so users can explore data along with associated visualization. When the client
    wants to check the application being developed, you can use the Streamlit library
    to develop a customized interactive application and host it on a server to share
    with your client/stakeholder.


    Now you know the perspective of data scientists and ML engineers for developing
    a Streamlit application. We will now look at the major features of Streamlit in
    the next section.


    ## Features of Streamlit


    We will discuss a few important features that make Streamlit unique compared to
    other tools and applications.


    ### Open Source


    Streamlit is open source, and hence it is free to use. A large community of data
    scientists and ML engineers use it for developing their applications.


    ### Platforms


    Streamlit can run on any platform, which means once applications are developed,
    they can be modified or altered on any other system.


    ### Ease of Development


    You can develop dashboards and data- or ML-driven applications with user interaction
    in no time as less code is needed.


    ### Interactive Applications


    The user interacts with the application by modifying or uploading data to visualize
    it or apply the implemented model data. You will see the various user interactions
    that are possible in applications using Streamlit in upcoming chapters.


    ### Reduced Time of Development


    The development time for Streamlit applications is less than with various competitors
    in the domain. The autoreloading feature previews the changes made to the application,
    reducing the time needed.


    ### No Core Web Development Knowledge


    The Streamlit library binds the front end and back end of an application. The
    developer does not need any prior web development knowledge to develop data-driven
    applications as Streamlit takes care of it.


    ### Easy to Learn


    You need some basic knowledge of the Python programming language along with Streamlit’s
    syntaxes that will be discussed in this book to build data-driven applications.


    ### Model Implementation


    You can implement pretrained models in an application and can analyze the model
    results. This type of application may be client-specific or testing-specific.
    The Face-GAN explorer is one such example of a model implementation.


    ### Compatibility


    Streamlit supports various Python-driven libraries for visualization, computer
    vision, machine learning, and data science. Table [1-1](#532543_1_En_1_Chapter.xhtml#Tab1)
    lists some of them.


    **Table 1-1** Python Libraries Supported by Streamlit


    | Frameworks | Python Libraries |

    | --- | --- |

    | Visualization | Matplotlib, Plotly, Seaborn, Bokeh, Altair |

    | Machine learning | PyTorch, TensorFlow, Keras, Sci-kit Learn |

    | Data science | Numpy, Pandas |

    | Computer vision | OpenCV, imgaug, SimpleCV, BoofCV |


    ### Literate Programming Document


    In a Streamlit application, you can parse any language such as Markdown, LaTeX,
    etc., in a `.py` file and render it as HTML, which makes a `.py` file act as a
    literate programming document where the back end is hosted by a Python-based server.
    You can run any programming language by defining the name in a `.py` file; this
    will be discussed in later chapters of this book.


    ### Streamlit Cloud


    The developed applications can be deployed and shared using the Streamlit Cloud
    ([`https://streamlit.io/cloud`](https://streamlit.io/cloud)) by giving access
    to clients or team members remotely. (There are no mandatory restrictions to use
    the Streamlit Cloud for the applications developed.)


    ### Optimize Change


    The changes made in your Python script files are displayed directly in the application,
    making development easier. You will learn more about this when you create your
    first application later in this chapter.


    ### Error Notifications


    If there are any errors that have incurred in our code, they are displayed in
    the application instead of at the command prompt, making error detection easier.
    The errors may be from Streamlit’s built-in functions or any library that has
    been used for developing the application.


    ## Comparing Streamlit to Alternative Frameworks


    Now that you know about the features of Streamlit, we will now compare the Streamlit
    features to its competitors; see Table [1-2](#532543_1_En_1_Chapter.xhtml#Tab2).


    **Table 1-2** Comparing Streamlit to Its Competitors


    | | Streamlit | Panel | Dash | Voila |

    | --- | --- | --- | --- | --- |

    | **Owner** | Streamlit | Anaconda | Plotly | Quantstack |

    | **Release year** | 2019 | 2018 | 2017 | 2019 |

    | **License type** | Apache | BSD | MIT | BSD |

    | **Front end** | React | HTML template, Bokeh, and any JavaScript library | React
    | HTML template or Jupyter |

    | **Back end** | Tornado | Tornado | Tornado | Flask |

    | **Public deployment** | Any cloud environment (also provides the Streamlit Cloud
    for easy connection and deployment) | Any cloud environment | Any cloud environment
    | Any cloud environment |

    | **Complex apps** | Supports multipage | Supports by configuring reactive components
    | Supports but requires manual event handling | Difficult to handle complex apps
    |

    | **Hosting service support** | Streamlit Cloud | Jupyterhub/Binder | Need to
    purchase Enterprise Edition | Jupyterhub/Binder |

    | **Product support** | Open-source community | Open-source community | Open-source
    community/business support | Open-source community |


    You now have a complete overview of Streamlit and understand why it was developed
    and its associated features. Next we will get one step closer to creating our
    first Streamlit application by installing Python on our system.'
  raw: '## Why Streamlit for Data Science and ML Engineers?


    We know that data science and machine learning use a technical medium to extract
    data and present this information with its associated insights to clients/stakeholders.
    Most of the time Python scripts or programs are developed as custom tools by data
    scientists and ML engineers . When they want to showcase these insights with their
    clients/stakeholders, it becomes extremely difficult to share the developed scripts/programs.
    It is also difficult to represent the data to nontechnical customers/users.


    Let’s assume that you are a data science or ML employee working in a company.
    With the client’s requirements, you have been asked to develop a customized interactive
    tool so users can explore data along with associated visualization. When the client
    wants to check the application being developed, you can use the Streamlit library
    to develop a customized interactive application and host it on a server to share
    with your client/stakeholder.


    Now you know the perspective of data scientists and ML engineers for developing
    a Streamlit application. We will now look at the major features of Streamlit in
    the next section.


    ## Features of Streamlit


    We will discuss a few important features that make Streamlit unique compared to
    other tools and applications.


    ### Open Source


    Streamlit is open source, and hence it is free to use. A large community of data
    scientists and ML engineers use it for developing their applications.


    ### Platforms


    Streamlit can run on any platform, which means once applications are developed,
    they can be modified or altered on any other system.


    ### Ease of Development


    You can develop dashboards and data- or ML-driven applications with user interaction
    in no time as less code is needed.


    ### Interactive Applications


    The user interacts with the application by modifying or uploading data to visualize
    it or apply the implemented model data. You will see the various user interactions
    that are possible in applications using Streamlit in upcoming chapters.


    ### Reduced Time of Development


    The development time for Streamlit applications is less than with various competitors
    in the domain. The autoreloading feature previews the changes made to the application,
    reducing the time needed.


    ### No Core Web Development Knowledge


    The Streamlit library binds the front end and back end of an application. The
    developer does not need any prior web development knowledge to develop data-driven
    applications as Streamlit takes care of it.


    ### Easy to Learn


    You need some basic knowledge of the Python programming language along with Streamlit’s
    syntaxes that will be discussed in this book to build data-driven applications.


    ### Model Implementation


    You can implement pretrained models in an application and can analyze the model
    results. This type of application may be client-specific or testing-specific.
    The Face-GAN explorer is one such example of a model implementation.


    ### Compatibility


    Streamlit supports various Python-driven libraries for visualization, computer
    vision, machine learning, and data science. Table [1-1](#532543_1_En_1_Chapter.xhtml#Tab1)
    lists some of them.


    Table 1-1


    Python Libraries Supported by Streamlit


    | Frameworks | Python Libraries |

    | --- | --- |

    | Visualization | Matplotlib, Plotly, Seaborn, Bokeh, Altair |

    | Machine learning | PyTorch, TensorFlow, Keras, Sci-kit Learn |

    | Data science | Numpy, Pandas |

    | Computer vision | OpenCV, imgaug, SimpleCV, BoofCV |


    ### Literate Programming Document


    In a Streamlit application , you can parse any language such as Markdown, LaTeX,
    etc., in a `.py` file and render it as HTML, which makes a `.py` file act as a
    literate programming document where the back end is hosted by a Python-based server.
    You can run any programming language by defining the name in a `.py` file; this
    will be discussed in later chapters of this book.


    ### Streamlit Cloud


    The developed applications can be deployed and shared using the Streamlit Cloud
    ( [`https://streamlit.io/cloud`](https://streamlit.io/cloud) ) by giving access
    to clients or team members remotely. (There are no mandatary restrictions to use
    the Streamlit Cloud for the applications developed.)


    ### Optimize Change


    The changes made in your Python script files are displayed directly in the application,
    making development easier. You will learn more about this when you create your
    first application later in this chapter.


    ### Error Notifications


    If there are any errors that have incurred in our code, they are displayed in
    the application instead of at the command prompt, making error detection easier.
    The errors may be from Streamlit’s built-in functions or any library that has
    been used for developing the application.


    ## Comparing Streamlit to Alternative Frameworks


    Now that you know about the features of Streamlit , we will now compare the Streamlit
    features to its competitors; see Table [1-2](#532543_1_En_1_Chapter.xhtml#Tab2).


    Table 1-2


    Comparing Streamlit to Its Competitors


    |   | Streamlit | Panel | Dash | Voila |

    | --- | --- | --- | --- | --- |

    | **Owner** | Streamlit | Anaconda | Plotly | Quantstack |

    | **Release year** | 2019 | 2018 | 2017 | 2019 |

    | **License type** | Apache | BSD | MIT | BSD |

    | **Front end** | React | HTML template, Bokeh, and any JavaScript library | React
    | HTML template or Jupyter |

    | **Back end** | Tornado | Tornado | Tornado | Flask |

    | **Public deployment** | Any cloud environment (also provides the Streamlit Cloud
    for easy connection and deployment) | Any cloud environment | Any cloud environment
    | Any cloud environment |

    | **Complex apps** | Supports multipage | Supports by configuring reactive components
    | Supports but requires manual event handling | Difficult to handle complex apps
    |

    | **Hosting service support** | Streamlit Cloud | Jupyterhub/Binder | Need to
    purchase Enterprise Edition | Jupyterhub/Binder |

    | **Product support** | Open-source community | Open-source community | Open-source
    community/business support | Open-source community |


    You now have a complete overview of Streamlit and understand why it was developed
    and its associated features. Next we will get one step closer to creating our
    first Streamlit application by installing Python on our system.'
  trans: '

    # 为什么数据科学与机器学习工程师要使用 Streamlit？


    我们知道，数据科学和机器学习利用技术媒介来提取数据，并将其连同相关见解呈现给客户或利益相关者。大多数时候，数据科学家和机器学习工程师会开发 Python 脚本或程序作为定制工具。当他们想向客户或利益相关者展示这些见解时，分享已开发的脚本或程序变得极其困难。同时，向非技术客户或用户呈现数据也很困难。


    假设你是一家公司的数据科学或机器学习员工。根据客户需求，你被要求开发一个定制的交互式工具，以便用户可以探索数据并查看相关可视化效果。当客户想要检查正在开发的应用程序时，你可以使用
    Streamlit 库来开发一个定制的交互式应用程序，并将其托管在服务器上与客户或利益相关者共享。


    现在你已经了解了数据科学家和机器学习工程师开发 Streamlit 应用程序的视角。接下来，我们将在下一节中介绍 Streamlit 的主要特性。


    ## Streamlit 的特性


    我们将讨论几个重要特性，这些特性使 Streamlit 与其他工具和应用程序相比独具特色。


    ### 开源


    Streamlit 是开源的，因此可以免费使用。庞大的数据科学家和机器学习工程师社区都在使用它来开发应用程序。


    ### 跨平台


    Streamlit 可以在任何平台上运行，这意味着一旦应用程序开发完成，它们可以在任何其他系统上进行修改或变更。


    ### 易于开发


    由于所需代码较少，你可以在极短时间内开发出带有用户交互功能的仪表盘以及数据驱动或机器学习驱动的应用程序。


    ### 交互式应用程序


    用户通过修改或上传数据来与应用程序交互，以实现数据可视化或应用已实现的模型数据。在接下来的章节中，你将看到使用 Streamlit 的应用程序中可能实现的多种用户交互方式。


    ### 缩短开发时间


    与领域内的各种竞争对手相比，Streamlit 应用程序的开发时间更短。自动重新加载功能可以预览对应用程序所做的更改，从而减少了所需时间。


    ### 无需核心 Web 开发知识


    Streamlit 库将应用程序的前端和后端绑定在一起。开发人员无需任何 Web 开发知识即可开发数据驱动的应用程序，因为 Streamlit 会处理这些。


    ### 易于学习


    你需要一些 Python 编程语言的基础知识，以及本书中将讨论的 Streamlit 语法，才能构建数据驱动的应用程序。


    ### 模型实现


    你可以在应用程序中实现预训练模型，并分析模型结果。这类应用程序可能是针对特定客户或特定测试的。Face-GAN 探索器就是模型实现的一个例子。


    ### 兼容性


    Streamlit 支持多种用于可视化、计算机视觉、机器学习和数据科学的 Python 驱动库。表 1-1 列出了其中一些。


    **表 1-1** Streamlit 支持的 Python 库


    | 框架 | Python 库 |

    | --- | --- |

    | 可视化 | Matplotlib, Plotly, Seaborn, Bokeh, Altair |

    | 机器学习 | PyTorch, TensorFlow, Keras, Sci-kit Learn |

    | 数据科学 | Numpy, Pandas |

    | 计算机视觉 | OpenCV, imgaug, SimpleCV, BoofCV |


    ### 文学化编程文档


    在 Streamlit 应用程序中，你可以在 `.py` 文件中解析任何语言（如 Markdown、LaTeX 等），并将其渲染为 HTML，这使得 `.py`
    文件充当了文学化编程文档的角色，其后端由基于 Python 的服务器托管。你可以通过在 `.py` 文件中定义名称来运行任何编程语言；这将在本书的后续章节中讨论。


    ### Streamlit Cloud


    开发完成的应用程序可以使用 Streamlit Cloud（[`https://streamlit.io/cloud`](https://streamlit.io/cloud)）进行部署和共享，远程授予客户或团队成员访问权限。（对于开发的应用程序，使用
    Streamlit Cloud 并非强制要求。）


    ### 优化变更


    在 Python 脚本文件中所做的更改会直接显示在应用程序中，使开发更加容易。在本章稍后创建第一个应用程序时，你将了解更多相关信息。


    ### 错误通知


    如果代码中出现了任何错误，它们会显示在应用程序中，而不是命令提示符中，这使得错误检测更加容易。这些错误可能来自 Streamlit 的内置函数，也可能来自用于开发应用程序的任何库。


    ## Streamlit 与替代框架的比较


    现在你已经了解了 Streamlit 的特性，我们将把 Streamlit 的特性与其竞争对手进行比较；参见表 1-2。


    **表 1-2** Streamlit 与其竞争对手的比较


    | | Streamlit | Panel | Dash | Voila |

    | --- | --- | --- | --- | --- |

    | **所属方** | Streamlit | Anaconda | Plotly | Quantstack |

    | **发布年份** | 2019 | 2018 | 2017 | 2019 |

    | **许可证类型** | Apache | BSD | MIT | BSD |

    | **前端** | React | HTML 模板、Bokeh 及任意 JavaScript 库 | React | HTML 模板或 Jupyter |

    | **后端** | Tornado | Tornado | Tornado | Flask |

    | **公共部署** | 任意云环境（同时提供 Streamlit Cloud 以便轻松连接和部署） | 任意云环境 | 任意云环境 | 任意云环境 |

    | **复杂应用** | 支持多页面 | 通过配置响应式组件支持 | 支持，但需要手动处理事件 | 难以处理复杂应用 |

    | **托管服务支持** | Streamlit Cloud | Jupyterhub/Binder | 需购买企业版 | Jupyterhub/Binder
    |

    | **产品支持** | 开源社区 | 开源社区 | 开源社区/商业支持 | 开源社区 |


    现在你已经对 Streamlit 有了全面的了解，明白了它为何被开发以及它的相关特性。接下来，我们将通过在系统上安装 Python，向创建第一个 Streamlit
    应用程序迈进一步。

    '
- fmt: '# Installing Python


    The first step to get started is to install Python. Follow these steps to install
    Python in Windows:


    1. Open any browser and navigate to [`https://python.org/downloads/windows/link`](https://python.org/downloads/windows/link).

    2. Under Python Release for Windows, choose a Python version above 3.7 to download
    as Streamlit supports Python versions 3.7, 3.8, 3.9, and 3.10 (the latest version
    is 3.10.4).

    3. Select your Windows version (there is a Windows executable installer for 32-bit
    or 64-bit).

    4. Finally, run the downloaded installer and follow the installer steps; also
    remember update the `ADD PATH` variable.


    **Note:** Python is built into Mac and Linux OS. Check the version using the command
    `python3 -–version` and upgrade if the Python version is lower than 3.7.


    Now we will see how to install the Streamlit library for various operating systems.


    ## Installing Streamlit on Windows


    Once we have installed Python in our system, we can now utilize the `pip` command
    to download the Streamlit package. Use the following `pip` command to install
    Streamlit:


    ```

    pip install streamlit

    ```


    ## Installing Streamlit on Linux


    Assuming we have already installed a Python version higher than 3.7 on our system,
    we need install `pip` to directly install our Streamlit library. To install it,
    we will use the following command:


    ```

    sudo apt – get install python3 – pip

    ```


    We will now install the Streamlit library:


    ```

    pip install streamlit

    ```


    ## Installing Streamlit on macOS


    To install Streamlit on a Mac system, first we need to install `pip` similar to
    what we have done for Linux. The command to install `pip` is given here:


    ```

    sudo easy_install pip

    ```


    We will now download the Streamlit library on macOS by using the following command:


    ```

    pip install streamlit

    ```


    **Note:** Currently, the Streamlit library supports Python versions ranging from
    3.7 to 3.10 only. We have used Python version 3.8.12 in this book.


    ## Testing the Streamlit Installation


    We will now check whether the Streamlit library has been installed by using the
    Streamlit command. Open the command prompt and type the following command, as
    shown in Figure 1-1:


    ![A screenshot depicts a select command prompt window with the command Hello streamlit,
    along with its local host and network U R L.](images/532543_1_En_1_Chapter/532543_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** Command prompt screen displaying Streamlit application running
    on local server


    ```

    streamlit hello

    ```


    After running the command, we will use Streamlit to run a built-in Welcome application
    in our default web browser at the localhost address, as displayed in Figure 1-2.
    In our case, the localhost address is `http://localhost:8052`.


    ![A screenshot depicts a local host window with the choose a demo option and the
    text welcome to Stremlit and its related information, on the right.](images/532543_1_En_1_Chapter/532543_1_En_1_Fig2_HTML.png)


    **Figure 1-2** Displaying default Streamlit page


    There are a few demo applications that show animation, plotting, mapping, and
    dataframes available in the drop-down menu of the Welcome screen. When we select
    Mapping Demo from the drop-down menu, then the app and code are generated, as
    shown in Figure 1-3.


    ![A screenshot depicts a local host window that lists the options under choose
    a demo field and map layers, along with geospatial data on the right.](images/532543_1_En_1_Chapter/532543_1_En_1_Fig3_HTML.png)


    **Figure 1-3** Displaying a demo application


    Now we will discuss how to create our first application in Streamlit.


    # Creating Our First App


    Assuming that you have already installed the Streamlit Python library as per the
    instructions, you will see step-by-step instructions for how to create your first
    Streamlit application.


    At first, you need to create a new Python file (`.py`) in any of the specified
    directories.


    Next, we will write code to import the Streamlit library. Choose any code editor
    you’d like. I have used Visual Studio for writing the following script:


    ```

    import streamlit as st

    ```


    We will display “Hello” text in our application using the `write` function; this
    is similar to the `print` function in the Python programming language.


    ```

    st.write("Hello")

    ```


    Finally, we will save our file and run the following command in our command prompt
    from the directory where we have saved it:


    ```

    streamlit run filename.py

    ```


    Now, we will see only “Hello” text in our application, as shown in Figure 1-4.


    ![A dark application screen with the text Hello.](images/532543_1_En_1_Chapter/532543_1_En_1_Fig4_HTML.jpg)


    **Figure 1-4** Displaying “Hello” text in the created application


    Here, the filename is the name given to our Python script, and it will display
    our “Hello” text when we open our default browser. We will now write one more
    `write` statement with “World” as the text.


    ```

    st.write(''World!!!!'')

    ```


    When we make any changes to our created Python file, the application running in
    the browser will show the commands in Figure 1-5 in the top-right corner of the
    application.


    ![A dark application screen with the text source file changed, along with the
    rerun and always rerun buttons.](images/532543_1_En_1_Chapter/532543_1_En_1_Fig5_HTML.jpg)


    **Figure 1-5** Displaying buttons in an application when the Python script is
    edited/altered


    “Source file changed” is the message shown when we save any changes made in our
    Python script and do not refresh the page. The Rerun button will run all the code
    blocks from the start and display the changes thereafter.


    When we choose the “Always rerun” button in the application, the application automatically
    optimizes with the changes made and displays the changes.


    Listing 1-1 shows the complete program for creating our first application.


    ```

    #Import Streamlit library

    import streamlit as st

    #Displaying Plain Text

    st.write("Hello")

    st.write(''World!!!!'')

    ```


    **Listing 1-1** `1 _hello_world.py`


    Figure 1-6 shows the screen after refreshing or rerunning the file for the previous
    script.


    ![A dark application screen with the text Hello world exclamations.](images/532543_1_En_1_Chapter/532543_1_En_1_Fig6_HTML.jpg)


    **Figure 1-6** Displaying “Hello World!!!” in an application


    We have developed a basic Streamlit application displaying the “Hello World!!!”
    text in it. This is to give you an idea of creating Python scripts using Streamlit.


    # Summary


    In this chapter, we got a complete overview of the Streamlit application by discussing
    its usage for data scientists and ML engineers. We discussed its core features
    and compared it to other tools available. Then we talked about installing Python
    versions that Streamlit is compatible with and went through the instructions to
    install Python and Streamlit on different platforms. Finally, we created our first
    basic Streamlit application using the `streamlit` command in a Python script.


    In the next chapter, we will discuss various ways in which textual data is represented
    in an application. We will also cover more about the data elements that are necessary
    to develop data-centric applications.'
