    \ creates an animation of balloons flying in our application. See Figure [4-10](#532543_1_En_4_Chapter.xhtml#Fig10).\n\
    \n![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig10_HTML.jpg)\n\nA dark screen\
    \ exhibits a cluster of animated colored balloons flying upwards. It has a stop\
    \ button on the left top and reads celebratory balloons.\n\n**Figure 4-10** Displaying\
    \ animated balloons moving upward\n\n```\nimport streamlit as st\n# Animated Snowflakes\n\
    st.balloons()\nListing 4-10\n10_balloons.py\n```\n\nThe animated balloons start\
    \ from the bottom of our application and move toward the top. The animation is\
    \ very fast in nature, and we can add the `time.sleep()` function to delay the\
    \ animation’s start. We will look into one more built-in animation function available\
    \ in our next section.\n\n## Snowflake\n\nThe animated snowflake was introduced\
    \ when the Snowflake company acquired Streamlit. Therefore, this animation is\
    \ available in Streamlit version 1.17 and above. The function for the animated\
