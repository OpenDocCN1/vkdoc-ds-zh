    最后，我们将讨论如何提交所有前面提到的表单数据类型。


    ## 提交按钮


    当用户更改输入表单数据时，应用程序需要重新运行，这会导致糟糕的用户体验。为了解决每次用户更改数据时应用程序都重新运行的问题，我们可以使用 `form_submit_button()`
    函数，如清单 6-17 所示。


    ```

    import streamlit as st

    my_form = st.form(key=''form'')

    my_form.text_input(label=''Enter any text'')

    # Defining submit button

    submit_button = my_form.form_submit_button(label=''Submit'')

    Listing 6-17

    17_form_submit.py

    ```


    在文本框中输入文本后，我们将点击“提交”按钮，如图 6-23 所示。


    ![](img/532543_1_En_6_Fig23_HTML.jpg)


    一个深色屏幕，包含“输入任意文本”字段，其中数据为“hello”，以及左下角选中的“提交”按钮。


    图 6-23


    显示带有输入表单文本的“提交”按钮


    当我们点击“提交”按钮时，应用程序会重新运行。它类似于 `st.button()` 函数，但功能有所不同。“提交”按钮将小部件的状态以批处理形式发布到表单中。`st.form_submit_button`
    必须与表单关联，否则 Streamlit 将进入错误状态。

