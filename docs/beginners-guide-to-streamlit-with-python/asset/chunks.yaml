  trans: '

    # 容器


    要在 Streamlit 中插入多个元素，可以使用容器。容器本质上是不可见的，可以通过 `st.container()` 来定义。参见代码清单 7-6。


    ```

    import streamlit as st

    import numpy as np

    st.title("容器")

    with st.container():

    st.write("容器内的元素")

    # 定义图表元素

    st.line_chart(np.random.randn(40, 4))

    st.write("容器外的元素")

    代码清单 7-6

    6_containers.py

    ```


    我们在 `st.container()` 中使用了 `with` 语句来在容器中插入多个元素。参见图 7-7。


    ![](img/532543_1_En_7_Fig7_HTML.jpg)


    一个标题为“容器”的深色屏幕。它展示了一个模拟图表，显示了容器内外的元素。图表绘制了 0、1、2 和 3 四条混沌波形。


    图 7-7


    包含图表对象的容器


    我们可以不按顺序向容器中插入元素，这可以通过使用 `container.write()` 函数来实现。参见代码清单 7-7。


    ```

    import streamlit as st

    import numpy as np

    st.title("无序容器")

    # 定义容器

    container_one = st.container()

    container_one.write("容器内的元素一")

    st.write("容器外的元素")

    # 现在向 container_one 中再插入几个元素

    container_one.write("容器内的元素二")

    container_one.line_chart(np.random.randn(40, 4))

    代码清单 7-7

    7_container_out_of_order.py

    ```


    我们在容器中插入了三个元素。其中两个是文本函数，一个是折线图，如图 7-8 所示。


    ![](img/532543_1_En_7_Fig8_HTML.jpg)


    一个标题为“无序容器”的深色屏幕。它展示了一个模拟图表，显示了容器内的元素一和元素二，以及容器外的元素。图表绘制了 0、1、2 和 3 四条混沌波形。


    图 7-8


    无序容器


    插入元素的顺序会变化，因此被称为*无序*。这有助于创建更灵活的应用程序。


    ## 空容器


    顾名思义，空容器是空的，我们只能向其中插入一个元素。要定义一个空容器，可以使用 `st.empty()` 语法。参见代码清单 7-8。


    ```

    import streamlit as st

    import time

    # 空容器

    with st.empty():

    for seconds in range(5):

    st.write(f"⏳ {seconds} 秒已过去")

    time.sleep(1)

    st.write("✔ 时间到！")

    代码清单 7-8

    8_empty_container.py

    ```


    这将创建如图 7-9 所示的空容器。


    ![](img/532543_1_En_7_Fig9_HTML.jpg)


    两个深色屏幕，一个显示沙漏图标和“0 秒已过去”，另一个显示对勾符号和“时间到！”。


    图 7-9


    显示空屏幕 a) 时间过去之前 和 b) 时间过去之后


    ## 侧边栏


    侧边栏是显示在应用程序侧面的窗格。它允许用户专注于主要内容。我们将使用 `st.sidebar()` 函数在我们的应用程序中定义侧边栏。参见代码清单 7-9。


    ```

    import streamlit as st

    # 侧边栏

    st.sidebar.title("侧边栏")

    st.sidebar.radio("你是新用户吗", ["是", "否"])

    st.sidebar.slider("选择一个数字", 0,10)

    代码清单 7-9

    9_sidebar.py

    ```


    在代码清单 7-9 中，我们将在侧边栏中显示一个滑块和单选按钮，如图 7-10 所示。


    ![](img/532543_1_En_7_Fig10_HTML.jpg)


    一个深色屏幕在侧边栏下列出了问题。它显示“你是新用户吗”，并选中了“是”选项，还有一个用于选择数字的滑块条。


    图 7-10


    侧边栏


    我们可以使用侧边栏来显示导航链接，用户可以通过它从一个页面切换到另一个页面。


    ## 多页面导航


    我们可以通过导航创建多页面应用。在 Streamlit 中，导航侧边栏会显示已创建的页面。由于前端从不重新加载，因此可以快速轻松地导航页面。多页面应用分为两部分：主页面和子页面。


    ### 主页面


    首先，我们将在目录中创建一个作为主页面的 Python 文件。这类似于我们之前创建的单一页面应用。我们可以使用以下命令运行此文件：


    `streamlit run file_name.py`


    我们将 Python 文件命名为 `home.py`。`main_page.py` 的代码在代码清单 7-10 中给出。图 7-11 显示了结果。


    ![](img/532543_1_En_7_Fig11_HTML.png)


    一个深色屏幕有 2 个面板。面板 1 列出了选项：主页面、页面 2 和页面 3，其中主页面被选中。面板 2 显示主页面，下方文字为“这是主页面”。


    图 7-11


    显示主页面


    **代码清单 7-10.** `home.py`


    ![](img/532543_1_En_7_Figa_HTML.gif)一组程序代码的截图。它将 sreatmlit 导入为主页面，并将主页面的标题设置为“这是主页面”。


    图 7-11 显示了主页面。现在我们将看到如何向这个 `home.py` 页面添加其他页面。


    ### 子页面


    我们将在包含 `main_page.py` 文件的文件夹中，创建一个名为 `pages` 的子文件夹，并在其中添加多个 Python 页面。我们将在 `pages`
    文件夹中创建两个文件，分别命名为 `page2.py` 和 `page3.py`。


    文件夹结构如下：


    ```

    home.py # 使用 "streamlit run" 运行的主文件

    └─── pages/ # 文件夹

    └─── page2.py # 第二个页面

    └─── page3.py # 第三个页面

    ```


    页面的代码如代码清单 7-11 和代码清单 7-12 所示。


    **代码清单 7-11.** `page2.py`


    ![](img/532543_1_En_7_Figb_HTML.gif)一组程序代码的截图。它将 sreatmlit 导入为第二个页面，将标题设置为“页面
    2”，并写入“您已导航到页面一”。


    **代码清单 7-12.** `page3.py`


    ![](img/532543_1_En_7_Figc_HTML.gif)一组程序代码的截图。它将 sreatmlit 导入为第三个页面，将标题设置为“页面
    3”，并写入“您已导航到页面一”。


    Streamlit 会获取 `pages` 文件夹中所有文件的文件名，并将它们放置在应用程序的侧边栏中，如图 7-12 和图 7-13 所示。


    ![](img/532543_1_En_7_Fig13_HTML.png)


    一个深色屏幕有 2 个面板。面板 1 列出了选项：主页面、页面 2 和页面 3，其中页面 3 被选中。面板 2 显示页面 3，并显示“您已导航到页面一”。


    图 7-13


    显示第三个页面


    ![](img/532543_1_En_7_Fig12_HTML.png)


    一个深色屏幕有 2 个面板。面板 1 列出了选项：主页面、页面 2 和页面 3，其中页面 2 被选中。面板 2 显示页面 2，并显示“您已导航到页面一”。


    图 7-12


    显示第二个页面


    **注意**


    多页面导航仅在 Streamlit 1.10 及以上版本中有效。


    ## 总结


    在本章中，我们学习了如何将对象放置到列和网格中，并进一步了解了如何定义包含对象的容器。我们还讨论了如何使用展开器显示额外信息。


    我们学习了如何将对象放置在侧边栏中，使其与页面导航分离。最后，我们通过演示文件夹结构，讨论了如何在 Streamlit 应用程序中创建多个页面。


    在下一章中，我们将了解 Streamlit 应用程序的控制流和高级特性。

