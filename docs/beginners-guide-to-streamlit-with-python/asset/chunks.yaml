    \n# 数据元素\n\n我们已经了解了如何在 `Streamlit` 应用程序中以各种格式表示文本数据。现在，我们将继续学习可在应用程序中显示的各种数据形式。让我们逐一了解这些数据元素。\n\
    \n## 数据框\n\n众所周知，数据框是数据科学和机器学习项目中使用的最重要的数据格式之一。它由二维数据组成，包含行和列，作为带标签的数据。`Streamlit`\
    \ 库以交互式表格格式显示数据框，这意味着表格是可滚动的，并且可以动态更改表格大小。请参见清单 2-11 及图 2-10 中的输出。\n\n![](img/532543_1_En_2_Fig10_HTML.jpg)\n\
