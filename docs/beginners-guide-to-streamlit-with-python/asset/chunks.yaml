- fmt: '# Image Upload


    In this section, we will discuss how to upload an image in our application. Unlike
    other document files, images can have different file formats like JPG, PNG, etc.,
    which is read after upload. We need to specify the file format that will be accepted
    as input data in our application. Listing [6-14](#532543_1_En_6_Chapter.xhtml#PC15)
    shows how image upload can be done.


    ```

    import streamlit as st

    from PIL import Image

    import io

    st.title("Upload Image")

    image_file = st.file_uploader("Upload Images", type=["png","jpg","jpeg"])

    check_details = st.button("Check Details")

    if check_details:

    if image_file is not None:

    # To See details

    image_details = {"file_name":image_file.name, "file_type":image_file.type,

    "file_size":image_file.size}

    st.write(image_details)

    # To View Uploaded Image

    image_data = image_file.read()

    image = Image.open(io.BytesIO(image_data))

    st.image(image, width=250)

    else:

    st.write("No Image File is Uploaded")

    Listing 6-14

    14_image_upload.py

    ```


    In the example, we have specified image file formats that can be uploaded in the
    `type` parameter of the `st.file_uploader()` function. The `check_details` button
    will provide the metadata of the file along with displaying the uploaded image,
    as shown in Figure [6-19](#532543_1_En_6_Chapter.xhtml#Fig19).


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig19_HTML.jpg)


    A dark screen with the text upload image that includes the upload images field
    with the highlighted drag and drop file here option, along with the image file.


    Figure 6-19


    Displaying a single image file that was uploaded


    ## Uploading Multiple Images


    Earlier we saw how to upload an image as a single file, which is often used in
    ML applications to get results from the model developed. We can also upload multiple
    images at the same time to get results or train a model. First, we will learn
    how we can get multiple image files instead of a single default file. See Listing
    [6-15](#532543_1_En_6_Chapter.xhtml#PC16).


    ```

    import streamlit as st

    import io

    from PIL import Image

    uploaded_files = st.file_uploader("Multiple Image Uploader", type=[''jpg'',''jpeg'',''png''],

    help="Upload Images in jpg, jpeg, png format", accept_multiple_files=True,)

    details = st.button("Check Details")

    for uploaded_file in uploaded_files:

    if details:

    if uploaded_file is not None:

    bytes_data = uploaded_file.read()

    image = Image.open(io.BytesIO(bytes_data))

    st.write("file_name:", uploaded_file.name)

    st.image(image, width=100)

    else:

    st.write("No Image File is Uploaded")

    break

    Listing 6-15

    15_image_multiple.py

    ```


    The parameter `accept_multiple_files` in `st.upload()` is a Boolean value that
    allows our application to accept multiple files to be uploaded when set as `True`.
    When the parameter is not defined, the function will accept only a single file,
    which is the default function. See Figure [6-20](#532543_1_En_6_Chapter.xhtml#Fig20).


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig20_HTML.jpg)


    A dark screen with the text multiple image uploader that includes the upload images
    field with the highlighted drag and drop file here option, along with the image
    files.


    Figure 6-20


    Displaying multiple image files that were uploaded


    To upload multiple files, the same parameter can be used for various file formats
    that we saw in our previous examples.


    ## Saving Uploaded Documents


    In some cases, we need to use the uploaded images for training the model or provide
    the results associated with them. For this, we need the images to be saved in
    a directory that can be later reused by our application. We will first get an
    image using the `file_uploader()` function and then provide a directory/folder
    path for it to be saved in. See Listing [6-16](#532543_1_En_6_Chapter.xhtml#PC17).


    ```

    # Import following libraries

    import streamlit as st

    from PIL import Image

    import os

    import io

    # Defining File Upload Method of Streamlit

    st.title("Saving File to Directory")

    image_file = st.file_uploader("Upload Images",

    type=["png","jpg","jpeg"])

    # Defining path where file to be saved

    file_save_path = "F:/Books/Apress Streamlit/Chapters/02 Codes/chapter 6 forms/files"

    save_file = st.button("Check Details & Save")

    if save_file:

    if image_file is not None:

    # To See details

    image_details = {"file_name":image_file.name, "file_type":image_file.type,

    "file_size":image_file.size}

    st.write(image_details)

    # To View Uploaded Image

    image_data = image_file.read()

    image = Image.open(io.BytesIO(image_data))

    st.image(image, width=250)

    with open(os.path.join(file_save_path,image_file.name),"wb") as f:

    f.write((image_file).getbuffer())

    st.success("Image Saved Successfully")

    else:

    st.write("No Image File is Uploaded")

    Listing 6-16

    16_image_save.py

    ```


    We need to specify file path where the user-uploaded image will be stored. We
    need to use a relative path for the uploaded image to be saved through our application.
    The variable `file_save_path` has been defined in our code. Later the file to
    be uploaded will be saved when we click the Check Details & Save button in our
    application, as shown in Figure [6-21](#532543_1_En_6_Chapter.xhtml#Fig21).


