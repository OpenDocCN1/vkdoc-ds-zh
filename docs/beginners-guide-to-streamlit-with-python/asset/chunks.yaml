- fmt: '# 2. Text and Table Elements


    In the first chapter, you gained a complete overview of Streamlit’s core features
    and how it is different from its competitors in the data science and machine learning
    domain. We also discussed the installation steps that are necessary on various
    platforms and created our very own Streamlit application.


    In this chapter, we will discuss not only on how we can format text in different
    ways, such as using Markdown, captions, blocks of code, and LaTeX, but also how
    to add title, headers, and subheaders in the app we have created. Next, we will
    look at table data elements and how we can display them in our application.


    Let’s start by looking at the various text elements available in the Streamlit
    library.


    ## Text Elements


    We define our text elements as objects with descriptions that are used in Streamlit
    applications as title, headers, subheaders, captions, and plain text. We will
    begin by looking at titles as our first text element.


    ## Titles


    We will begin by writing a title in our Streamlit application. The title is case-sensitive,
    and it will be represented on each document, but this is not enforced. In other
    words, the title is similar to a heading of a section. The code in Listing [2-1](#532543_1_En_2_Chapter.xhtml#PC1)
    will yield the output in Figure [2-1](#532543_1_En_2_Chapter.xhtml#Fig1).


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig1_HTML.jpg)


    A dark rectangle box with the text this is our title.


    Figure 2-1


    Displaying a title


    ```

    # Import Streamlit library

    import streamlit as st

    # Writing Title

    st.title("This is our Title")

    Listing 2-1

    01_title.py

    ```


    We can see the text, shown in Figure [2-1](#532543_1_En_2_Chapter.xhtml#Fig1),
    that we have mentioned in the `st.title()` function. We can also add an anchor
    in our title to navigate to another link or page. (We will learn more about this
    in Chapter [7](#532543_1_En_7_Chapter.xhtml).) As we have not added an anchor
    to our title example, the anchor will be generated using the same text that we
    have written for the title, i.e., *This is our Title.* We will now see how to
    add an anchor to our title; see Listing [2-2](#532543_1_En_2_Chapter.xhtml#PC2).


    ```

    # Import Streamlit library

    import streamlit as st

    # Writing Title with ANCHOR

    st.title("This is our Title", anchor="Apress")

    Listing 2-2

    02_title_anchor.py

    ```


    In Listing [2-2](#532543_1_En_2_Chapter.xhtml#PC2), we have used `Apress` as our
    anchor. This is used to link pages or a few sections in a page to another page
    or sections within the same page. The anchor functionality is optional and can
    also be set to `None` if we are not using it.


    In the next sections, we will study how to define headers and subheaders using
    the Streamlit library, respectively.


    ## Headers


    We all know that a header is used to represent a set of content in an application.
    We will now define the built-in header function available in the Streamlit library.
    See Listing [2-3](#532543_1_En_2_Chapter.xhtml#PC3).


    ```

    # Import Streamlit library

    import streamlit as st

    # Header

    st.header("""This is our Header""")

    Listing 2-3

    03_header.py

    ```


    Figure [2-2](#532543_1_En_2_Chapter.xhtml#Fig2) shows our header text displayed
    in our application. Now, let’s check out subheaders in the next section.


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig2_HTML.jpg)


    A dark rectangle box with the text this is our header.


    Figure 2-2


    Displaying a header


    ## Subheaders


    As the name suggests, a subheader is a subtype of header. It is written after
    the header in a smaller font size than the header. Listing [2-4](#532543_1_En_2_Chapter.xhtml#PC4)
    shows our example, and the associated output is in Figure [2-3](#532543_1_En_2_Chapter.xhtml#Fig3).


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig3_HTML.jpg)


    A dark rectangle box with the text this is our Sub-header.


    Figure 2-3


    Displaying subheader


    ```

    # Import Streamlit library

    import streamlit as st

    # sub-header

    st.subheader("""This is our Sub-header""")

    Listing 2-4

    04_sub_header.py

    ```


    We can also apply an anchor parameter as we have done for the `st.title()` function.


    Note


    We can use an anchor parameter in `st.title()`, `st.header()`, and `st.subheader()`,
    but it is optional.


    ## Captions


    A caption is usually associated with a description in the application. The size
    of a caption is small; see Listing [2-5](#532543_1_En_2_Chapter.xhtml#PC5) and
    Figure [2-4](#532543_1_En_2_Chapter.xhtml#Fig4).


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig4_HTML.jpg)


    A dark rectangle box with the text this is our caption.


    Figure 2-4


    Displaying a caption


    ```

    # Import Streamlit library

    import streamlit as st

    # Caption

    st.caption("""This is our Caption""")

    Listing 2-5

    05_caption.py

    ```


    We know that caption text is an explanation that describes notes, footnotes, tables,
    images, and videos.


    Let us now compare all three types of text (titles, headers, and captions) in
    one go to understand the difference and see how they are depicted in the Streamlit
    application. See Listing [2-6](#532543_1_En_2_Chapter.xhtml#PC6) and the output
    in Figure [2-5](#532543_1_En_2_Chapter.xhtml#Fig5).


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig5_HTML.jpg)


    A dark rectangle box with the text this is our title, this is our header, this
    is our Sub-header, and this is our caption, in different sizes.


    Figure 2-5


    Comparing the title, header, subheader, and caption elements by displaying them
    in one page


    ```

    # Import Streamlit library

    import streamlit as st

    # Title

    st.title("""This is our Title""")

    # Header

    st.header("""This is our Header""")

    # Sub-header

    st.subheader("""This is our Subheader""")

    # Caption

    st.caption("""This is our Caption""")

    Listing 2-6

    06_comparison.py

    ```


    Now that we know the difference between the three, we will move on to write text
    in plain format.


    ## Plain Text


    Let’s display some plain text in our application. The syntax for it is given here:


    ```

    st.text(“your text”)

    ```


    This `st.text()` function will display any text that is written in between the
    quotes. The syntax follows the same string procedures used in Python. The text
    may be written in single or double or triple quotes, as shown in Listing [2-7](#532543_1_En_2_Chapter.xhtml#PC8).
    Figure [2-6](#532543_1_En_2_Chapter.xhtml#Fig6) shows the output.


    ![](images/532543_1_En_2_Chapter/532543_1_En_2_Fig6_HTML.jpg)


    A screenshot depicts a rectangular dark window with the text Hi, People exclamations,
    welcome to, Streamlit''s world.


    Figure 2-6


    Displaying plain text


    ```

    #Import Streamlit library

    import streamlit as st

    #Displaying Plain Text

    st.text("Hi,\nPeople\t!!!!!!!!!")

    st.text(''Welcome to'')

    st.text(""" Streamlit''s World""")

    Listing 2-7

    07_plain_text.py

    ```


    This is how plain text is displayed in the application we have created. The screen
    is in dark mode, so we are seeing our application with a black background.


    Note


    Each time we write the `st.text()` function, it will appear on a new line in an
    application.


    In the next section, we will discuss how to create Markdown text from plain text.'
