  raw: '## Deployment


    In this section, we will learn how to deploy our application . First, we will
    create an instance for our application by using the following command:


    ```

    heroku create nlp-stream

    ```


    `nlp-stream` is the name of our application that will be deployed by Heroku.


    Note


    Duplicate names are not allowed.


    We need to use a few commands to push the code to the created instance.


    ```

    git add .

    git commit -m "some message"

    git push heroku master

    ```


    Once we use the `git push` command, we will notice that it automatically downloads
    all the Python libraries mentioned in `requirements.txt` and the Python app. After
    installation, we will see a URL, as shown in Figure [9-6](#532543_1_En_9_Chapter.xhtml#Fig6),
    which means our application has been successfully deployed.


    ![](images/532543_1_En_9_Chapter/532543_1_En_9_Fig6_HTML.jpg)


    A snapshot of the Heroku deployment window. There are four lines of code starting
    with the control remote. 1\. Launching. 2\. Released v 3\. 3. An U R L. 4\. No
    text.


    Figure 9-6


    Displaying the Heroku deployment


    Copy the URL and paste it in a browser to see our app running on Heroku, as shown
    in Figure [9-7](#532543_1_En_9_Chapter.xhtml#Fig7).


    ![](images/532543_1_En_9_Chapter/532543_1_En_9_Fig7_HTML.jpg)


    A snapshot of the Heroku deployment window. The text reads, welcome to our application.
    An input text box and a button labeled, analyze are given below.


    Figure 9-7


    Displaying the Heroku deployment


    If there are any changes to the files, we can use the same commands that we used
    after the Heroku login method . We will get the same URL after the deployment.


    Note


    The URL we get from Heroku will have the application name to which we have created
    an instance.


    ## Summary


    In this chapter, we developed a Streamlit NLP application with just a few lines
    of code. The application has the components and features that we learned about
    in earlier chapters. In this chapter, we also learned how to deploy the Streamlit
    application to Heroku. Similarly, we can create any application of our choice
    and deploy it on the cloud. In our final chapter of this book, we will create
    a Streamlit application with computer vision aspects.


    # 10. Computer Vision in Streamlit


    In this final chapter of the book, we will see one small example of a computer
    vision application that can predict what animals are in an image. This application
    will deploy our trained model to classify animal images.


    ## Installing Libraries


    In this section, we will install the libraries needed to get started with the
    ML application.


    Install the following libraries using the `pip` command:


    ```

    streamlit

    cv2

    numpy

    tensorflow

    ```


    Now we will import these libraries into our application by employing the code
    shown in Listing [10-1](#532543_1_En_10_Chapter.xhtml#PC2).


    ```

    import streamlit as st

    import cv2

    import numpy as np

    import tensorflow as tf

    from tensorflow.keras.preprocessing import image

    from tensorflow.keras.applications.mobilenet_v2 import MobileNetV2, preprocess_input
    as mobilenet_v2_preprocess_input

    Listing 10-1

    Import Libraries

    ```


    ## Model Deployment


    We need to deploy our trained model in our application. This is done by using
    the TensorFlow function shown in Listing [10-2](#532543_1_En_10_Chapter.xhtml#PC3).


    ```

    # Deploy Model

    with st.spinner(''Loading Model...''):

    model = tf.keras.models.load_model("model/mdl_wts.hdf5")

    Listing 10-2

    Deploy Model

    ```


    The model is in hdf5 format, and it is named `animals` and stored in the `model`
    folder. Once the model is deployed, then we can upload images. We will display
    a spinner to the user while the model is loading. We can deploy any trained ML
    model.


    ## Upload Image


    We will now take input from the user by uploading an image . This image can be
    in JPG or PNG format. See Listing [10-3](#532543_1_En_10_Chapter.xhtml#PC4).


    ```

    # Upload file

    uploaded_file = st.file_uploader("Choose an image file", type=["jpg","png"])

    Listing 10-3

    Upload Image

    ```


    ## Map Image Classes


    We are mapping five different classes of animals in our dictionary. Later the
    animal is predicted based on these five classes defined for the model. See Listing
    [10-4](#532543_1_En_10_Chapter.xhtml#PC5).


    ```

    # map image classes

    animal_dict = {0: ''dog'',

    1: ''horse'',

    2: ''elephant'',

    3: ''butterfly'',

    4: ''chicken'',

    5: ''cat'',

    6: ''cow''}

    Listing 10-4

    Map Image

    ```


    Next, we will apply imaging techniques for the uploaded images.


    ## Apply Imaging Techniques


    First, we will convert our image into a byte array object. The same image is then
    read and converted to RGB format . Later the image is resized to 224 * 244 so
    that it can be given to the model. See Listing [10-5](#532543_1_En_10_Chapter.xhtml#PC6).


    ```

    if uploaded_file is not None:

    # Apply Imaging Techniques for uploaded image

    img_bytes = np.asarray(bytearray(uploaded_file.read()), dtype=np.uint8)

    img = cv2.imdecode(img_bytes, 1)

    img = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)

    img_resize = cv2.resize(img,(224,224))

    Listing 10-5

    Imaging Technique

    ```


    We have also displayed the uploaded image in the application as follows:


    ```

    # Display Image

    st.image(img, channels="RGB")

    ```


    ## Model Preprocessing


    The resized image is given as input to `mobilenet`. The `mobilenet` preprocesses
    the image using its built-in script. See Listing [10-6](#532543_1_En_10_Chapter.xhtml#PC8).


    ```

    img_resize = mobilenet_v2_preprocess_input(img_resize)

    Listing 10-6

    Processing Model

    ```


    We are also adding an axis to the image predictions as the model had trained with
    no dimensions added to it.


    ```

    img_reshape = img_resize[np.newaxis,...]

    ```


    ## Predictions


    We add a button named Predict Animal to predict the animal from the model by mapping
    to the classes defined in the dictionary. See Listing [10-7](#532543_1_En_10_Chapter.xhtml#PC10).


    ```

    # Button for Prediction

    predict = st.button("Predict Animal")

    if predict:

    prediction = model.predict(img_reshape).argmax()

    st.title("Predicted Animal in an image is {}".format(animal_dict [prediction]))

    Listing 10-7

    Predictions

    ```


    ## Complete Code


    Listing [10-8](#532543_1_En_10_Chapter.xhtml#Par17) gives the complete code for
    the image classification.


    *Listing 10-8. cv.py*


    ```

    import streamlit as st

    import cv2

    import numpy as np

    import tensorflow as tf

    from tensorflow.keras.preprocessing import image

    from tensorflow.keras.applications.mobilenet_v2 import MobileNetV2,preprocess_input
    as mobilenet_v2_preprocess_input

    # Deploy Model

    with st.spinner(''Loading Model...''):

    model = tf.keras.models.load_model("model/mdl_wts.hdf5")

    # Upload file

    uploaded_file = st.file_uploader("Choose an image file", type=["jpg","png"])

    # map image classes

    animal_dict = {0: ''dog'',

    1: ''horse'',

    2: ''elephant'',

    3: ''butterfly'',

    4: ''chicken'',

    5: ''cat'',

    6: ''cow''}

    ```


    ```

    if uploaded_file is not None:

    # Apply Imaging Techniques for uploaded image

    img_bytes = np.asarray(bytearray(uploaded_file.read()), dtype=np.uint8)

    img = cv2.imdecode(img_bytes, 1)

    img = cv2.cvtColor(img, cv2.COLOR_BGR2RGB)

    img_resize = cv2.resize(img,(224,224))

    # Display Image

    st.image(img, channels="RGB")

    img_resize = mobilenet_v2_preprocess_input(img_resize)

    img_reshape = img_resize[np.newaxis,...]

    # Button for Prediction

    predict_img = st.button("Predict Animal")

    if predict_img:

    prediction = model.predict(img_reshape).argmax()

    st.title("Predicted Animal in an image is {}".format(animal_dict [prediction]))

    ```


