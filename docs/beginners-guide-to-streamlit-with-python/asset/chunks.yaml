- fmt: '# 4. Data and Media Elements


    In this chapter, we will focus on data that we can see and hear. This type of
    data is in the form of images, audio, videos, or animations. This is known as
    *multimedia data*. An application may contain any one or a combination of these
    types of data.


    As machine learning models can be developed based on images, audio, or video,
    we will see how we can display this multimedia data in our application so that
    we can use these techniques in our final chapters of project building. Now let’s
    get started with images where most of the machine learning models are developed
    around object detection, object recognition, and image segmentation.


    ## Images


    One of the major multimedia files that is needed in an ML/DS application is an
    image. An image is used generally to visualize the results related to the machine
    learning models. In this section we will explore images so we can build efficient
    image applications in the future.


    In our example, we have stored images in a directory named `files` that we will
    be importing to our application. This helps to separate the images from the code.
    See Listing [4-1](#532543_1_En_4_Chapter.xhtml#PC1).


    ```

    import streamlit as st

    st.write("Displaying an Images")

    # Displaying Image by specifying path

    st.image("files/animal7.jpg")

    #Image Courtesy by unplash

    st.write("Image Courtesy: unplash.com")

    Listing 4-1

    01_image_local.py

    ```


    Figure [4-1](#532543_1_En_4_Chapter.xhtml#Fig1) shows the results of this code.


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig1_HTML.jpg)


    A screenshot of a dark screen portrays a picture of a tortoise swimming in a water
    body. The title reads Displaying an images.


    Figure 4-1


    Displaying a JPG image in an application


    We can also use any Python library such as OpenCV, PIL, etc., that supports opening
    an image. It is not compulsory to use any one library. Later, we need to pass
    the same image file stored in a variable in the `image()` function of Streamlit.


    Listing [4-2](#532543_1_En_4_Chapter.xhtml#PC2) and Figure [4-2](#532543_1_En_4_Chapter.xhtml#Fig2)
    show how an image can be displayed using a URL.


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig2_HTML.jpg)


    A screenshot of a dark screen portrays a picture of a Leopard starring, climbing
    a log. The title reads Displaying an images.


    Figure 4-2


    Displaying an image with a URL


    ```

    import streamlit as st

    st.write("Displaying an Images")

    # Displaying Image URL

    st.image("https://tinyurl.com/322vu3ab")

    # Image Courtesy

    st.write("Courtesy: unplash.com")

    Listing 4-2

    02_image_url.py

    ```


    The syntax for the `image()` function with other parameters is as follows:


    ```

    st.image(image, caption, width, use_column_width, clamp, channels, output_format)

    ```


    While displaying an image in an application, there are various parameters associated
    with it, as described in Table [4-1](#532543_1_En_4_Chapter.xhtml#Tab1).


    Table 4-1


    Parameters of the `image()` Function


    | Parameter | Description |

    | --- | --- |

    | `image (numpy.ndarray, [numpy.ndarray], str, [str], or BytesIO)` | This specifies
    the image that will be displayed in the application. An image can be monochrome
    and have a shape `(w,h)` or `(w,h,1)` or a color image with the shape `(w,h,3)`
    or an RGBA image with `(w,h,4)`. An image can be a URL or path from local storage
    or SVG XML string or list of more than one image. (Here, `(w,h)` means the height
    and width of an image.) |

    | `caption (str or string list)` | This provides information about an image that
    is displayed. |

    | `width (int or None)` | This will help to fix the width of an image that will
    be displayed. It is set when SVG images are used as SVG images are huge in size.
    The width can also be adjusted when multiple images are displayed using the column
    width. |

    | `use_column_width (''auto'' or ''always'' or ''never'')` | When we set this
    to `auto`, the exact size of an image is displayed without exceeding the column
    width. When we set the column width as `"always"` or `True`, then the image width
    is set to the column width, and when we set it to `"never"` or `False`, then the
    image width is set to its normal size. This parameter when set overwrites the
    `width` parameter. |

    | `clamp (bool)` | The range of clamp values to be selected for an image is from
    0 to 255 per channel. This value can be used when the image is in byte array format
    and skipped when images are defined using a URL. When the clamp value is not set
    and an image has a value out of range, then an error is raised. |

    | `channels (''RGB'' or ''BGR'')` | The channel represents the color information
    of an image denoting the format used when the image is an `nd.array`. The channel
    is by default set to `RGB` format. The values associated to each channel are as
    follows:`[:,:,0]` -> red channel`[:,:,1]` -> green channel`[:,:,2]` -> blue channelWhen
    we are reading images from Python libraries like OpenCV, we need to set the channel
    to `BGR` instead of `RGB`. |

    | `Output_format (''JPEG'', ''PNG'', or ''auto'')` | This parameter defines the
    format to be used when we are transferring the image data. Photos can use `JPEG`
    format with lossy compression, while diagrams can use `PNG` format for lossless
    compression. When we set the value to `"auto"`, then the compression type is set
    based on the type and format of an image argument. |


    One more important feature is that computer vision techniques can be applied for
    image manipulations using various Python libraries supported by Streamlit.


    Next we will see how we can display multiple images in an application.


    Note


    When we are displaying from a URL or local storage, the image displayed in our
    application will have the same dimensions (i.e., height and width) of that image.
    We can resize an image using any Python library before calling into the `st.image`
    function.


    ## Multiple Images


    We can display more than one image in our application by listing the images in
    the `image()` function. This section shows how we can allow multiple images.


    In Listing [4-3](#532543_1_En_4_Chapter.xhtml#PC4), we are defining the width
    that will be assigned to each image displaying in our application in a column
    and grid structure. We can adjust the width as we see fit and will be learning
    more about columns and the grid structure of the Streamlit application in Chapter
    [7](#532543_1_En_7_Chapter.xhtml).


    ```

    import streamlit as st

    # Image Courtesy

    st.write("Diplaying Multiple Images")

    # Listing out animal images

    animal_images = [

    ''files/animal1.jpg'',

    ''files/animal2.jpg'',

    ''files/animal3.jpg'',

    ''files/animal4.jpg'',

    ''files/animal5.jpg'',    ''files/animal6.jpg'',

    ''files/animal7.jpg'',

    ''files/animal8.jpg'',

    ''files/animal9.jpg'',

    ''files/animal10.jpg''

    ]

    # Displaying Multiple images with width 150

    st.image(animal_images, width=150)

    # Image Courtesy

    st.write("Image Courtesy: Unplash")

    Listing 4-3

    03_multiple_local.py

    ```


    Figure [4-3](#532543_1_En_4_Chapter.xhtml#Fig3) shows the results.


    ![](images/532543_1_En_4_Chapter/532543_1_En_4_Fig3_HTML.jpg)


    A screenshot of a dark screen portrays pictures of a polar bear, leopard, panda,
    bird, cat, tortoise, tiger, deer, and giraffe. The title reads Displaying multiple
    images.


    Figure 4-3


    Displaying multiple images


    Note


    An image can be called using a URL or local directory.


    We have seen how multiple images are defined in our application and can be used
    in recommendation systems for book, movies, etc.


    In the next section, we will display an image as a background.'
