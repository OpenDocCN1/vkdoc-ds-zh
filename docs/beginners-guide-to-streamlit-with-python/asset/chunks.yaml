    # Altair


    Altair 是基于 Vega 的最常用的统计可视化 Python 库之一。一旦我们为 `x` 和 `y` 定义了值，可视化过程就由 Altair 库处理。我们还可以限制在应用程序中显示的图表的大小并设置其颜色。首先，我们需要安装
    Altair 库。要安装它，我们将使用以下命令：


    ```

    pip install altair

    ```


    Altair 支持所有类型的图表，但我们只讨论 Altair 中的几种图表类型。


    ## 箱线图


    我们可以使用箱线图通过显示数据四分位数和平均值来表示数据的偏度。请参见代码清单 3-10。


    ```

    import altair as alt

    import streamlit as st

    import pandas as pd

    #读取 albany 数据集

    df = pd.read_csv("./files/albany.csv")

    # 箱线图

    box_plot = alt.Chart(df).mark_boxplot().encode(

    x = "Date",

    y = "Large Bags"

    )

    st.altair_chart(box_plot)

    代码清单 3-10

    10_altair_boxplot.py

    ```


    在上面的代码中，我们使用了 `mark_boxplot()` 方法来显示箱线图。随后，我们使用 `st.altair_chart()` 函数在应用程序中显示该图表。箱线图分为五个不同的部分，如图
    3-9 所示。


    ![](img/532543_1_En_3_Fig9_HTML.jpg)


    一张日期与大包装袋的 Altair 箱线图快照。2015 年 9 月 20 日达到最高值 590。


    图 3-9


    在 Streamlit 中显示 Altair 箱线图


    中间的白色带代表中位数。


    接下来，我们将了解如何在应用程序中创建和显示面积图。


