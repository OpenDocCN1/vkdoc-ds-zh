- fmt: '# Text/Docx Document


    A file that contains only textual data in it is considered to be a text document.
    A text file can be created using a text editor like Notepad. We will see how a
    text document, specifically a `.docx` file, can be uploaded in our application.
    To view the contents of a `.docx` file, we will be using the `docx2txt` Python
    library. There are other similar libraries that can be used. See Listing [6-11](#532543_1_En_6_Chapter.xhtml#PC12)
    and Figure [6-13](#532543_1_En_6_Chapter.xhtml#Fig13).


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig13_HTML.jpg)


    A dark screen with the text Docx and text documents with the upload document field
    and checks the details button at the left bottom.


    Figure 6-13


    Displaying a document upload section, before upload


    ```

    #Import Necessary Libraries

    import streamlit as st

    import docx2txt

    st.title("DOCX & Text Documents")

    # Defining File Uploader Function in a variable

    text_file = st.file_uploader("Upload Document", type=["docx","txt"])

    # Button to check document details

    details = st.button("Check Details")

    # Condition to get document details

    if details:

    if text_file is not None:

    # Getting Document details like name, type and size

    doc_details = {"file_name":text_file.name, "file_type":text_file.type,

    "file_size":text_file.size}

    st.write(doc_details)

    # Check for text/plain document type

    if text_file.type == "text/plain":

    # Read document as string with utf-8 format

    raw_text = str(text_file.read(),"utf-8")

    st.write(raw_text)

    else:

    # Read docx document type

    docx_text = docx2txt.process(text_file)

    st.write(docx_text)

    Listing 6-11

    11_new_doc.py

    ```


    As shown in Figure [6-14](#532543_1_En_6_Chapter.xhtml#Fig14), there is a browse
    button that enables the user to upload a file from the local storage or simply
    drag and drop the file into the upload area.


    ![](images/532543_1_En_6_Chapter/532543_1_En_6_Fig14_HTML.jpg)


    A dark screen with the text Docx and text documents that include the upload document
    field with the highlighted drag and drop file here option.


    Figure 6-14


    Displaying a document upload section, after upload


    The size limit specified by Streamlit is 200 MB and cannot be uploaded beyond
    it. The document type to be uploaded can also be seen in the application.


