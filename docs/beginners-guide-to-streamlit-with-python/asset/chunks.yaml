    # Plotly


    Plotly 是一个可以制作高质量交互式图表的 Python 库。它支持不同类型的图表，如条形图、折线图、箱线图、饼图、散点图、直方图等。我们将看到如何在我们
    Streamlit 应用程序中使用这个 Python 库。


    首先，我们需要使用 `pip` 命令安装 Plotly 库。


    ```

    pip install plotly

    ```


    现在，我们将看到可以使用 Plotly 在 Streamlit 中实现的各种图表。我们将使用鳄梨数据集来可视化图表。


    ## 饼图


    对于鳄梨数据集，我们将可视化有机鳄梨和传统鳄梨的百分比。


    在代码清单 3-13 中，第一个函数 `figure()` 是一个空白页面，用于在其中绘制我们的饼图。`Pie()` 方法创建一个饼图，将标签和值作为输入参数。


    ```

    import streamlit as st

    import plotly.graph_objects as go

    import pandas as pd

    #读取鳄梨数据集

    data = pd.read_csv("./files/avocado.csv")

    st.header("饼图")

    # 实现饼图

    pie_chart = go.Figure(

    go.Pie(

    labels = data.type,

    values = data.AveragePrice,

    hoverinfo = "label+percent",

    textinfo = "value+percent"

    ))

    st.plotly_chart(pie_chart)

    代码清单 3-13

    13_plotly_pie.py

    ```


    还有两个可选参数，名为 `hoverinfo` 和 `textinfo`，当鼠标悬停在饼图上时会显示信息。函数 `plotly_chart` 允许我们在应用程序中添加定义的饼图，如图
    3-12 所示。


    ![](img/532543_1_En_3_Fig12_HTML.jpg)


    一张显示有机和传统数值的饼图快照。有机数值为 15,089.43，占比 58.8%。传统数值为 10,568.27，占比 41.2%。


    图 3-12


    在 Streamlit 中显示 Plotly 饼图


    我们的饼图分为两部分：有机和传统。当鼠标悬停在一个部分上时，我们可以看到饼图该特定部分的名称和百分比。对应于有机和传统的鳄梨百分比和总数以不同颜色显示。接下来，我们将转向环形图，它与饼图类似。


    ## 环形图


    Plotly 创建了一个不同的子模块来绘制环形图。该模块的名称是 `express()`。我们需要在我们的代码中导入 `express()` 模块。请参见代码清单
