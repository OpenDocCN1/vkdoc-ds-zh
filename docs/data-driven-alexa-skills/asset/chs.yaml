  \n图 15-7\n\n更新后的 Botmock 图表，包含“提供房屋统计信息”意图\n\n现在我们可以为新意图添加代码。由于我们是在一次对话中收集所有统计信息，因此可以在一个意图处理器中处理它们。\n\
  \n```\nclass GiveHomeStatsIntentHandler(AbstractRequestHandler):\n\"\"\"处理提供房屋统计信息意图的处理器。\"\
  \"\"\ndef can_handle(self, handler_input):\nvalidity, _ = read_user_profile(handler_input)\n\
  return (validity == AccessTokenValidity.VALID) and ask_utils.is_request_type(\"\
  GiveHomeStatsIntent\")(handler_input)\ndef handle(self, handler_input):\n_, profile\
  \ = read_user_profile(handler_input)\nproperty_type = handler_input.request_envelope.request.intent.slots[\"\
  property_type\"].value\nsquare_footage = handler_input.request_envelope.request.intent.slots[\"\
  square_footage\"].value\nbedrooms = handler_input.request_envelope.request.intent.slots[\"\
  bedrooms\"].value\nbaths = handler_input.request_envelope.request.intent.slots[\"\
  baths\"].value\nif not profile:\nprofile = {}\nprofile[\"homestats\"] = {\n\"property_type\"\
  : property_type,\n\"square_footage\": square_footage,\n\"bedrooms\": bedrooms,\n\
  \"baths\": baths\n}\nsave_user_profile(handler_input, profile)\nspeak_output = f\"\
  您的房子是{property_type}，面积为{square_footage}平方英尺，有{bedrooms}间卧室和{baths}间浴室。对吗？\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nask = \"对吗？\"\nhandler_input.attributes_manager.session_attributes[\"\
  question\"] = \"ConfirmStats\"\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(ask)\n.response\n)\n```\n\n我们还需要在“是”和“否”意图处理器中添加条件语句。\n\n| 是意图处理器 |\n| ---\
  \ |\n| `elif question == \"ConfirmAddress\":`   `speak_output = \"太好了。请告诉我一些关于您房子的信息。房子是什么类型，有多少平方英尺，几间卧室，几间浴室？\"\
  `   `ask = \"房子是什么类型，有多少平方英尺，几间卧室，几间浴室？\"`   `handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"HomeStats\"``elif question == \"ConfirmStats\":`   `speak_output\
  \ = \"太棒了！现在我们可以继续了解您的投资了。请告诉我您持有多少股以及每项投资的股票代码。或者说“没有更多”来停止添加股票。\"`   `ask = \"\
  告诉我您持有某只股票代码的多少股。\"`   `handler_input.attributes_manager.session_attributes[\"question\"\
  ] = \"AddStock\"` |\n| **否意图处理器** |\n| `elif question == \"ConfirmStats\":`   `speak_output\
  \ = \"哎呀。我们再试一次。房子是什么类型，有多少平方英尺，几间卧室，几间浴室？\"`   `ask = \"房子是什么类型，有多少平方英尺，几间卧室，几间浴室？\"\
  `    `handler_input.attributes_manager.session_attributes[`        `\"question\"\
  ] = \"HomeStats\"` |\n\n并且不要忘记在帮助意图处理器中添加一些帮助信息，并将新的 `GiveHomeStatsIntentHandler`\
  \ 添加到技能构建器中。\n\n```\nsb.add_request_handler(GiveHomeStatsIntentHandler())\n```\n\
  \n现在我们已经能够收集房屋统计信息，可以回到计算您房屋价值的工作上来了。\n\n\n\n### 回到房地产 API\n\n我们已经有了地址和房屋统计数据。现在需要将这些信息传递给\
  \ API，获取房屋估值。我们需要两样东西：(1) 调用 API 的代码，(2) 测试它的方法。至于代码，我们在 Python Requests 的 API 代码片段中已经有了大部分所需内容：\n\
  \n```\nimport requests\nurl = \"https://realty-mole-property-api.p.rapidapi.com/salePrice\"\
  \nquerystring = {\"compCount\":\"5\",\"squareFootage\":\"1600\",\"bathrooms\":\"\
  2\",\"address\":\"5500 Grand Lake Drive, San Antonio, TX\",\"bedrooms\":\"4\",\"\
  propertyType\":\"Single Family\"}\nheaders = {\n'x-rapidapi-key': \"b912ba32xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx899e140d\"\
  ,\n'x-rapidapi-host': \"realty-mole-property-api.p.rapidapi.com\"\n}\nresponse =\
  \ requests.request(\"GET\", url, headers=headers, params=querystring)\nprint(response.text)\n\
  ```\n\n为了测试，我们可以向 Launch 请求处理程序插入一些内容，确保管道畅通。然后，在 Alexa 开发者控制台的测试标签页中创建必要的 JSON，用我们的数据进行测试。接着，将其连接到缺失的`CalculateNetWorth`函数（我们将添加该函数）。听起来是个好计划。\n\
  \n首先，我们将这段代码放入一个新模块，这样就不会把 API 调用埋没在意图处理程序中。在 lambda 函数的`PersonalNetWorthBackend`文件夹中，紧邻`lambda_function.py`和`dynamodb.py`，添加另一个文件：`api_calls.py`。然后粘贴\
  \ API 代码片段中的代码（如上所示）。接着，我们需要做一个关键修改。\n\n这段代码包含了我们的 API 密钥：\n\n```\nheaders = {\n\
  'x-rapidapi-key': \"b912ba32xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx899e140d\",\n```\n\
  \nAPI 密钥就是“通往王国的钥匙”。任何人都可以用你的密钥代表你调用 API，这对你的技能来说没问题，但如果黑客获取了你的密钥并将其放到暗网上，那对你来说就非常不妙了。你**绝对不应该**把密钥留在代码中。这就像把车钥匙留在停车场的车里，然后指望回来时车还在一样。祝你好运。\n\
  \n如果不能把密钥留在代码里，那该放在哪里呢？最好的地方是环境变量。这样既把密钥从代码中移出，又让它们仍然可供使用。在 AWS Lambda 中，配置环境变量相当容易：\n\
  \n![../images/504229_1_En_15_Chapter/504229_1_En_15_Fig8_HTML.jpg](img/504229_1_En_15_Fig8_HTML.jpg)\n\
  \n图 15-8\n\n选择配置标签页\n\n1.  选择代码窗口上方的*配置*标签页（见图 15-8）。\n\n![../images/504229_1_En_15_Chapter/504229_1_En_15_Fig9_HTML.jpg](img/504229_1_En_15_Fig9_HTML.jpg)\n\
  \n图 15-9\n\n在左侧选择环境变量菜单选项\n\n1.  从左侧导航菜单中选择*环境变量*选项（见图 15-9）。\n\n1.  点击屏幕中央的*编辑*按钮。\n\
  \n2.  点击*添加环境变量*按钮。\n\n3.  环境变量是键值对。在我们的例子中，键是我们为 API 密钥指定的名称，值就是密钥本身。\n\n4.  在*键*输入框中，输入`RAPID_API_KEY`。（按照惯例，环境变量全部使用大写字符。）\n\
  \n5.  在*值*输入框中，粘贴代码片段中的 API 密钥：`b912ba32xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx899e140d`\n\
  \n6.  点击右下角的*保存*按钮。\n\n环境变量在静态时使用默认的 Lambda 服务密钥进行加密。这对我们的目的来说已经足够了。但是，如果你想在传输过程中加密密钥，可以选择使用\
  \ AWS 密钥管理服务（KMS）来加密环境变量。如果要启用此选项，则需要在现有代码基础上补充 KMS 示例中提供的代码。\n\n现在我们已经将 API 密钥存储在环境变量中，可以修改代码，从环境变量中获取密钥，而不是硬编码密钥值。将以下代码：\n\
  \n```\nheaders = {\n'x-rapidapi-key': \"b912ba32xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx899e140d\"\
  ,\n```\n\n替换为对环境变量的调用：\n\n```\nheaders = {\n'x-rapidapi-key': os.environ['RAPID_API_KEY'],\n\
  ```\n\n这需要在模块顶部添加一个额外的导入语句：\n\n```\nimport os\n```\n\n最后需要做的是，将 API 调用封装在一个函数定义中，该函数将接收用户配置文件（从计算净资产的意图处理程序传入），并返回房屋价值（来自\
  \ API 调用）。完成这些修改后，`api_calls.py`模块应该如下所示：\n\n```\nimport requests\nimport os\nimport\
  \ logging\nimport json\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n\
  url = \"https://realty-mole-property-api.p.rapidapi.com/salePrice\"\ndef GetHomeValue(profile):\n\
  querystring = {\n\"compCount\": \"10\",\n\"squareFootage\": profile[\"homestats\"\
  ][\"square_footage\"],\n\"bathrooms\": profile[\"homestats\"][\"baths\"],\n\"address\"\
  : f'{profile[\"street_address\"]}, {profile[\"city\"]}, {profile[\"state\"]}',\n\
  \"bedrooms\": profile[\"homestats\"][\"bedrooms\"],\n\"propertyType\": profile[\"\
  homestats\"][\"property_type\"]\n}\nheaders = {\n'x-rapidapi-key': os.environ['RAPID_API_KEY'],\n\
  'x-rapidapi-host': \"realty-mole-property-api.p.rapidapi.com\"\n}\nresponse = requests.request(\n\
  \"GET\", url, headers=headers, params=querystring)\nif response.text:\nlogger.info(f\"\
  {response.text}\")\nresult = json.loads(response.text)\nif result[\"price\"]:\n\
  return result[\"price\"]\nreturn None\n```\n\n定义好环境变量并完成代码后，我们就可以测试 API 调用了。\n\n\
  \n\n#### 测试 API 调用\n\n如何高效地测试 API 调用？我暂时不想与 Alexa 进行完整对话，尽管稍后我们需要这样做。相反，我们可以将 API\
  \ 调用插入到 `LaunchRequest` 处理器中，并直接使用其测试。首先，我们需要为 `LaunchRequest` 处理器编写一个测试。如果你还没有，那么你该为至今未做任何测试而自责了。如果你已经有了，请给自己点个赞。感谢你成为那\
  \ 1% 在将代码投入生产环境前真正进行测试的开发者^(²³)。如果你还没有机会为 `LaunchRequest` 创建测试，别担心，还有机会。你现在就可以创建一个：\n\
  \n1.  点击 *Test* 按钮的下拉菜单，选择 *Configure test event*。\n2.  选中 *Create new test event*\
  \ 单选按钮。\n3.  选择 `alexa-skills-kit-start-session` 事件模板。\n4.  将测试命名为：`LaunchRequestNoLink`。\n\
