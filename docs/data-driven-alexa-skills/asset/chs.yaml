  \ 也是一个不错的选择，但就我们的目的而言，我们只需要看板模板。\n\n8.  对于您的第一个项目名称，输入*Data-Driven Skills*，密钥为*DDS*。\n\
  \n9.  这样就完成了。您已经设置好了一个 Jira 账户、站点和项目，可以随时开始使用。\n\n### 总结\n\n在本章中，我们设置并配置了本书后续章节所需的开发者账户。这些账户用于捕获需求、管理任务、存储源代码、为我们自定义的、数据驱动的\
  \ Alexa 技能配置 VUI，以及构建后端数据库、存储区域和技能逻辑的编码。在下一章中，我们将构建我们的第一个自定义技能：一个身体质量指数（BMI）计算器。\n\
  \n## 4. 为自定义数据驱动技能创建 VUI\n\n现在您已经配置了一个例程并从蓝图中创建了一些技能，并且已经设置好了账户，我们准备构建我们的第一个自定义数据驱动的\
  \ Alexa 技能。在本章中，我们将构建一个身体质量指数（BMI）计算器。前提很简单：BMI 是身高和体重的函数。计算公式为：\n\n![$$ BMI=\\\
  frac{weight\\ in\\ kilograms}{{\\left( height\\ in\\ meters\\right)}²} $$](img/504229_1_En_4_Chapter_TeX_Equa.png)\n\
  \n使这个计算变得复杂的是，如果我询问您的身高，您可能会说：188 厘米、1.88 米、6 英尺 2 英寸或 74 英寸。同样，如果我询问您的体重，您可能会说\
  \ 109 公斤、109 千克、240 磅，甚至 17 英石 2 磅，或者仅仅 17 英石。\n\n那么，让我们开始吧。首先，我们将创建基础技能。然后，我们将在\
  \ Alexa 开发者控制台中为该技能配置 VUI。在下一章中，我们将编写后端代码并测试我们的技能，以确保其按预期工作。最后，我们将经历将技能发布到 Alexa\
  \ 技能商店的流程。\n\n### 步骤 1：创建基础技能\n\n第一步是根据模型、方法和模板创建基础技能。要开始此步骤，我们需要启动 Alexa 开发者控制台。导航至\
  \ [`https://developer.amazon.com/alexa/console/ask`](https://developer.amazon.com/alexa/console/ask)。欢迎来到\
  \ Alexa 技能开发（见图 4-1）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig1_HTML.png](img/504229_1_En_4_Fig1_HTML.png)\n\
  \n图 4-1\n\nAlexa 技能开发控制台\n\n现在，点击*创建技能*并为技能命名，例如 BMI 计算器。然后将第一个选项保留为*自定义*，因为我们正在构建一个自定义技能，而不是其他类型。接着，您可以选择\
  \ Alexa 托管或自行配置。Alexa 托管提供了通往 AWS lambda 函数和其他几个 AWS 服务的管道。自行配置则没有。在本书中，我们稍后需要为一些高级技能自行配置，但现在还不需要。对于第二个选项，选择*Alexa\
  \ 托管（Python）*，如图 4-2 所示。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig2_HTML.png](img/504229_1_En_4_Fig2_HTML.png)\n\
  \n图 4-2\n\n为新技能选择模型和方法\n\n现在点击右上角的*创建技能*。我们将选择*Hello World 技能/从头开始*模板（我知道，我知道，但在提供的选项中，它是最基础的）并点击*继续使用模板*（图\
  \ 4-3）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig3_HTML.jpg](img/504229_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3\n\n为新技能选择模板\n\n呜呼！您的新技能正在创建中（图 4-4）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig4_HTML.jpg](img/504229_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n您的技能正在创建中\n\n一两分钟后，您的新 BMI 计算器技能就可以开始使用了（见图 4-5）。与此同时，让我们参观一下技能界面。\n\n\
  ![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig5_HTML.jpg](img/504229_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n您的新 BMI 计算器技能\n\n\n\n### 技能构建器界面\n\n让我们来熟悉一下 Alexa 开发者控制台。从顶部开始（见图 4-6），有一组用于开发技能主要任务的选项卡。\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig6_HTML.jpg](img/504229_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n开发技能的主要任务\n\n**构建：** 使用此选项卡配置 VUI 选项并为你的技能创建交互模型。\n\n**代码：** 在此处编写你的后端代码。对于\
  \ Alexa 托管的技能，此选项卡是你编写 lambda 函数的地方。你无需为此前往 AWS。\n\n**测试：** 在此选项卡中测试你的交互模型。你可以打开麦克风并与你的技能进行交互，以确保其按预期工作。\n\
  \n**分发：** 在此处，你可以配置技能商店选项以及隐私声明等内容。\n\n**认证：** 这是你可以提交技能进行认证的地方。当你选择此选项卡时，你的技能将自动进行验证，并且可能会建议一些修复方法。一旦通过自动验证，你就可以将技能提交到认证流程。\n\
  \n**分析：** 一旦你的技能在 Alexa 商店中上线，你可以查看分析选项卡，了解其运行情况并学习如何改进它。\n\n在 Alexa 开发者控制台的左侧，是用于选择交互模型不同部分的菜单（见图\
  \ 4-7）。在顶部，你可以选择技能的语言。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig7_HTML.jpg](img/504229_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n用于选择交互模型组件的菜单\n\n在语言选择器下方，有三个部分：自定义、模型和工具。在自定义部分，你将开发你的交互模型。显示的选项会根据你选择的交互模型类型而有所不同，但标准选项如下：\n\
  \n*   **调用：** 这是你为技能分配调用名称的地方。如果你的调用名称是“西蒙的不可思议的技能”，人们需要说“Alexa，启动西蒙的不可思议的技能”才能访问你的技能。\n\
  \n*   **交互模型：** 使用此选项配置用户与 Alexa 之间的对话。此选项是你花费大部分时间编写技能意图和表述的地方——我们将在下一节中详细介绍这些内容。\n\
  \n*   **资产：** 通过选择资产菜单选项，配置槽位值和其他完成交互模型所需的资产。同样，在下一节中，我们将为身高和体重创建槽位，以便在交互模型中使用。\n\
  \n*   **多模态响应：** 包含在技能交互中返回的 Alexa 表示语言 (APL) 和 Alexa 音频表示语言 (APLA) 代码。我们将在后面的章节中学习\
  \ APL 和 APLA。\n\n*   **接口：** 使用此选项打开或关闭技能可用的各种接口。我们将在本技能中使用此选项来打开 Alexa 对话，并在本书的其他项目中使用其他接口。\n\
  \n*   **端点：** 这是你连接前端和后端的地方。由于 BMI 计算器技能是 Alexa 托管的，这部分已经为你完成了。\n\n当你选择模型部分时，有两个选项：自定义和智能家居。如果你正在构建智能家居技能，你需要打开该模型。我们不是，所以我们可以将这些选项保留为默认值。\n\
  \n在工具部分，你将找到技能内产品、账户关联、权限和语言的选项，我们将在后面的章节中介绍所有这些内容。对于 BMI 计算器，我们不需要这些。\n\n在 Alexa\
  \ 开发者控制台的中央面板中，有*如何入门*视频以及可用于入门和进一步学习的资源列表。\n\n最后，在控制台的右侧是技能构建器清单。此部分显示了你需要完成以构建技能的各种任务的状态。使用我们用来创建基础技能的模板，其中大部分已经完成。\n\
  \n回顾完控制台后，我们准备开始为我们的 BMI 计算器技能配置 VUI。\n\n### 步骤 2：配置 VUI\n\n让我们回顾一下本章开头找到的 BMI 技能的问题陈述：根据身高和体重计算\
  \ BMI。计算公式为\n\n![$$ BMI=\\frac{weight\\ in\\ kilograms}{{\\left( height\\ in\\ meters\\\
  right)}²} $$](img/504229_1_En_4_Chapter_TeX_Equb.png)\n\n我们需要一种方法来要求用户提供他们的身高和体重，以便我们能够计算他们的\
  \ BMI。在此之前，用户需要启动（或调用）我们的技能并要求我们计算他们的 BMI。我们将逐步处理这两个步骤。\n\n#### 调用名称\n\n用户要做的第一件事是启动你的技能。他们通过说“Alexa，开始/启动/运行\
  \ *<调用名称>*”来做到这一点。通过选择左侧的调用菜单项来创建**技能调用名称**。调用名称有一些规则：\n\n1.  两个或更多单词。\n\n2.  用小写字母书写，单词之间用空格分隔。\n\
  \n3.  所有格撇号是可以的，例如“simon's”。\n\n4.  缩写和首字母缩略词必须用句点和字母之间的空格拼写出来，因此“b. m. i.”是正确的。\n\
  \n5.  数字必须拼写出来，例如“one hundred”。\n\n6.  调用名称不能包含任何 Alexa 技能启动短语，例如“launch”、“ask”、“tell”、“open”、“load”、“begin”和“enable”。唤醒词包括“Alexa”、“Amazon”、“Echo”、“Computer”或单词“skill”或“app”也是不允许的。\n\
  \n7.  品牌名称必须是你可以使用的。\n\n技能调用名称是人们启动你的技能的方式。与例程一样，技能名称应该是独一无二、易于记忆且易于说出的。如果你查看 Alexa\
  \ 技能商店（[`www.amazon.com/alexa-skills`](https://www.amazon.com/alexa-skills)），你会发现大量的\
  \ BMI 计算器。为了想出一些独特的东西，我添加了我的名字，所以对于我们的 BMI 计算器，我选择了“simon's b. m. i. calculator”作为我的技能调用名称（图\
  \ 4-8）。注意 BMI 缩写是如何拼写出来的。如果我仅仅使用“simon's bmi calculator”，Alexa 会监听单词 bmi，而不是首字母缩略词\
  \ B.M.I.。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig8_HTML.jpg](img/504229_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n为你的新技能输入技能调用名称\n\n请务必在 Alexa 设备上多次测试你的启动短语。这种测试应该能暴露出任何潜在的冲突。例如，许多启动短语中包含我名字的技能与流行的游戏“西蒙说”冲突。我必须小心地提出独特的调用名称。\n\
  \n我们需要回答的下一个问题是我们要使用哪种交互模型。\n\n\n\n#### 交互模型\n\n`Interaction Model`（交互模型）有两种选择。首先，默认的交互模型使用意图（intents）来捕捉用户希望技能执行的操作。一个`intent`（意图）是一条告诉或请求\
  \ Alexa 做某事的语句。例如，“我的 BMI 是多少？”就是一个意图。它请求 Alexa 开始计算我的 BMI 的过程。这个第一个意图之后，Alexa 会询问你的身高和体重，你可以通过说出`ProvideHeightAndWeight`意图来回答，例如说“我身高六英尺二英寸，体重两百四十磅。”这个意图期望你同时提供身高和体重。如果你只说其中一项，它是无法正常工作的。这时就引入了第二种交互模型——`Alexa\
  \ Conversations`。它更具对话性，允许你只回答身高或体重来回应提示。当 Alexa 注意到缺失的值时，她会仅针对那一项再次提示你。\n\n使用意图模型时，你和\
  \ Alexa 之间的对话将如图 4-9 所示。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig9_HTML.jpg](img/504229_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9 BMI 计算器的意图对话\n\n而使用对话模型时，对话可能如图 4-9 所示，也可能如图 4-10 所示。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig10_HTML.jpg](img/504229_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10 BMI 计算器的对话模型对话\n\n这种差异很微妙，但意义重大。对于更复杂的技能，对话模型对用户更加友好，因为它允许用户以自己的方式回答提示，而不是遵循意图模型所要求的严格交互方式。还有一个优势：在意图模型中，作为开发者的你需要负责处理所有可能的交互排列组合。而在对话模型中，你只需向\
  \ Alexa 展示对话的基本流程，剩下的事情由她的人工智能来完成。同样重要的是，这并非一个非此即彼的选择；你可以在两种模型中都有交互，并且，正如我们将看到的，即使是一个基于对话模型构建的技能，你也至少需要一个意图。\n\
  \n现在你已经了解了意图和对话，接下来需要理解槽位（Slots）。\n\n#### 槽位\n\n`Slot`（槽位）是用户为 Alexa 填充的内容。当你定义一个槽位时，需要为其分配一个槽位类型。这些可以是内置的槽位类型，例如`AMAZON.City`和`AMAZON.Artist`，也可以是更通用的槽位类型，例如`AMAZON.NUMBER`和`AMAZON.DATE`，甚至可以是自定义槽位类型，你可以在技能配置过程中提供槽位值。内置槽位类型的酷炫之处在于，它们能处理人们可能用来表达（例如）日期的各种奇怪而奇妙的方式。我可能会说“five\
  \ ten twenty-twenty”，或者“May tenth twenty-twenty”，甚至可能说“oh-five ten twenty-twenty”。`AMAZON.DATE`槽位类型旨在处理所有这些变体，并为我（开发者）捕获实际的日期值\
  \ 5/10/2020。\n\n在我们的 BMI 技能中，身高和体重将是槽位。用户需要提供这些值，就像参数或变量一样，然后 Alexa 会将槽位值传递给 API\
  \ 代码进行评估和处理。不过，我们面临一个难题：如何表示身高和体重槽位的众多可能性？起初，我们可能会将身高和体重视为`AMAZON.NUMBER`类型，在这种情况下，用户可以这样说：\n\
  \n```\n我身高 {Height} 厘米，体重 {Weight} 公斤。\n```\n\n这种方法可能有效，但仅限于公制单位。如果我们允许用户使用英制单位回答，那么我们就需要为身高使用两个槽位来分别表示英尺和英寸，即：\n\
  \n```\n我身高 {Feet} 英尺 {Inches} 英寸，体重 {Weight} 磅。\n```\n\n或者，如果用户的身高是整数英尺：\n\n```\n\
  我身高 {Feet} 英尺，体重 {Weight} 磅。\n```\n\n然后，如果我们允许体重使用英石（stone）单位，我们还需要两个槽位（一个必填，一个可选），这样就会产生四种话语变体：\n\
  \n```\n我身高 {Feet} 英尺 {Inches} 英寸，体重 {Stone} 英石 {Pounds} 磅。\n我身高 {Feet} 英尺，体重 {Stone}\
  \ 英石 {Pounds} 磅。\n我身高 {Feet} 英尺 {Inches} 英寸，体重 {Stone} 英石。\n我身高 {Feet} 英尺，体重 {Stone}\
  \ 英石。\n```\n\n现在我们有了七条包含完全不同槽位的话语，这意味着我们必须编写七个 API 来处理它们，这听起来工作量很大。没有人喜欢做可以避免的大量工作，而在这个例子中，恰恰是可以避免的！\n\
  \n与其为我们的槽位类型使用`AMAZON.NUMBER`，不如为身高和体重创建自定义槽位类型，包含我们想要处理的所有选项。例如，表 4-1 展示了一组示例单位组合。\n\
  \n表 4-1 示例单位组合\n\n| 身高 | 体重 |\n| --- | --- |\n| 188 厘米 | 45 公斤 |\n| 188 c.m. | 45\
  \ k.g. |\n| 1.9 米 | 45 千克 |\n| 6 英尺 | 180 磅 |\n| 6 英尺 2 | 14 英石 |\n| 6 英尺 2 英寸 |\
  \ 14 英石 3 |\n| 等等 | 等等 |\n\n下一个问题是，Alexa 不喜欢你将数值作为数字放入自定义槽位中。相反，我们必须将数字拼写为单词。因此，表\
  \ 4-1 中的示例实际上应该写成表 4-2 所示的样子。\n\n表 4-2 数字转换为单词后的单位组合\n\n| 身高 | 体重 |\n| --- | ---\
  \ |\n| one hundred and eighty eight centimeters | forty five kilograms |\n| one\
  \ hundred eighty eight c.m. | forty five k.g. |\n| one point nine meters | forty\
  \ five kilos |\n| six foot | one hundred eighty pounds |\n| six foot two | fourteen\
  \ stone |\n| six foot two inches | fourteen stone three |\n| 等等 | 等等 |\n\n通过创建包含所有这些不同值的自定义槽位，我们允许用户说出他们喜欢的任何数量和单位，并且我们可以将它们全部转换为可用于\
  \ BMI 计算的值。但这需要很多槽位值，不是吗？是的，这正是为什么这个特定的技能实际上是一个数据驱动的技能！\n\n\n\n#### 创建自定义槽位值\n\n\
  要创建槽位值列表，我本人可没打算手动输入所有可能性。相反，我们来看看自定义槽位的批量编辑功能。此功能允许你在 CSV（逗号分隔值）文件中定义值列表。我知道一个能很好创建\
  \ CSV 文件的工具：Microsoft Excel（或者任何电子表格软件，我想）。我好奇 Excel 能否将数字转换为单词。\n\n不能。它做不到。但等等，快速上网搜索后，我找到了微软支持团队编写的一个函数^(¹⁴)，它恰好能实现这个功能，不过针对的是美元和美分。也就是说，它可以将\
  \ $1,234.56 拼写为 one thousand two hundred thirty-four dollars and fifty-six cents。这或许可行。我们可以修改\
  \ `SpellNumbers` 函数，使其不处理美元和美分，而只显示拼写出来的数字。修改完成后，我们可以将该函数作为代码模块添加到 Excel 中，并在生成槽位时使用它。就像这样：\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig11_HTML.png](img/504229_1_En_4_Fig11_HTML.png)\n\
  \n**图 4-11** Visual Basic for Applications 窗口\n\n1.  打开 Excel。\n2.  打开一个空白工作簿。\n\
  3.  按下 `Alt-F11` 打开 Visual Basic for Applications 窗口（图 4-11）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig12_HTML.jpg](img/504229_1_En_4_Fig12_HTML.jpg)\n\
  \n**图 4-12** 创建新的 VBA 代码模块\n\n1.  右键点击 `VBAProject (Book1)`，然后选择 `Insert | Module`（参见图\
  \ 4-12）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig13_HTML.jpg](img/504229_1_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-13** 编译 VBA 模块\n\n1.  粘贴以下代码，你可以从本书的示例代码下载中获得：\n\n```\nOption Explicit\n\
  'Main Function\nPublic Function SpellNumber(ByVal MyNumber, Optional AddAnds = False)\n\
  Dim Dollars, Cents, Temp\nDim DecimalPlace, Count\nReDim Place(9) As String\nPlace(2)\
  \ = \" Thousand \"\nPlace(3) = \" Million \"\nPlace(4) = \" Billion \"\nPlace(5)\
  \ = \" Trillion \"\n' String representation of amount.\nMyNumber = Trim(Str(MyNumber))\n\
  ' Position of decimal place 0 if none.\nDecimalPlace = InStr(MyNumber, \".\")\n\
  ' Convert cents and set MyNumber to the dollar amount.\nIf DecimalPlace > 0 Then\n\
  Cents = GetTens(Left(Mid(MyNumber, DecimalPlace + 1) & \"00\", 2))\nMyNumber = Trim(Left(MyNumber,\
  \ DecimalPlace - 1))\nEnd If\nCount = 1\nDo While MyNumber  \"\"\nTemp = GetHundreds(Right(MyNumber,\
  \ 3))\nIf Temp  \"\" Then\nDollars = Temp & Place(Count) & Dollars\nEnd If\nIf Len(MyNumber)\
  \ > 3 Then\nMyNumber = Left(MyNumber, Len(MyNumber) - 3)\nElse\nMyNumber = \"\"\n\
  End If\nCount = Count + 1\nLoop\nSelect Case Dollars\nCase \"\"\nDollars = \"Zero\"\
  \nCase \"One\"\nDollars = \"One\"\nCase Else\nDollars = Dollars\nEnd Select\nIf\
  \ AddAnds Then\nDebug.Print (Right(Trim(Dollars), 7) = \"Hundred\")\nIf Right(Trim(Dollars),\
  \ 8)  \"Trillion\" Then\nDollars = Replace(Dollars, \"Trillion \", \"Trillion and\
  \ \")\nEnd If\nIf Right(Trim(Dollars), 7)  \"Billion\" Then\nDollars = Replace(Dollars,\
  \ \"Billion \", \"Billion and \")\nEnd If\nIf Right(Trim(Dollars), 7)  \"Million\"\
  \ Then\nDollars = Replace(Dollars, \"Million \", \"Million and \")\nEnd If\nIf Right(Trim(Dollars),\
  \ 8)  \"Thousand\" Then\nDollars = Replace(Dollars, \"Thousand \", \"Thousand and\
  \ \")\nEnd If\nIf Right(Trim(Dollars), 7)  \"Hundred\" Then\nDollars = Replace(Dollars,\
  \ \"Hundred \", \"Hundred and \")\nEnd If\nEnd If\nSpellNumber = Trim(Dollars)\n\
  End Function\n' Converts a number from 100-999 into text\nFunction GetHundreds(ByVal\
  \ MyNumber)\nDim Result As String\nIf Val(MyNumber) = 0 Then Exit Function\nMyNumber\
  \ = Right(\"000\" & MyNumber, 3)\n' Convert the hundreds place.\nIf Mid(MyNumber,\
  \ 1, 1)  \"0\" Then\nResult = GetDigit(Mid(MyNumber, 1, 1)) & \" Hundred \"\nEnd\
  \ If\n' Convert the tens and ones place.\nIf Mid(MyNumber, 2, 1)  \"0\" Then\nResult\
  \ = Result & GetTens(Mid(MyNumber, 2))\nElse\nResult = Result & GetDigit(Mid(MyNumber,\
  \ 3))\nEnd If\nGetHundreds = Result\nEnd Function\n' Converts a number from 10 to\
  \ 99 into text.\nFunction GetTens(TensText)\nDim Result As String\nResult = \"\"\
  \ ' Null out the temporary function value.\nIf Val(Left(TensText, 1)) = 1 Then '\
  \ If value between 10-19...\nSelect Case Val(TensText)\nCase 10: Result = \"Ten\"\
  \nCase 11: Result = \"Eleven\"\nCase 12: Result = \"Twelve\"\nCase 13: Result =\
  \ \"Thirteen\"\nCase 14: Result = \"Fourteen\"\nCase 15: Result = \"Fifteen\"\n\
  Case 16: Result = \"Sixteen\"\nCase 17: Result = \"Seventeen\"\nCase 18: Result\
  \ = \"Eighteen\"\nCase 19: Result = \"Nineteen\"\nCase Else\nEnd Select\nElse '\
  \ If value between 20-99...\nSelect Case Val(Left(TensText, 1))\nCase 2: Result\
  \ = \"Twenty \"\nCase 3: Result = \"Thirty \"\nCase 4: Result = \"Forty \"\nCase\
  \ 5: Result = \"Fifty \"\nCase 6: Result = \"Sixty \"\nCase 7: Result = \"Seventy\
  \ \"\nCase 8: Result = \"Eighty \"\nCase 9: Result = \"Ninety \"\nCase Else\nEnd\
  \ Select\nResult = Result & GetDigit(Right(TensText, 1)) ' Retrieve ones place.\n\
  End If\nGetTens = Result\nEnd Function\n' Converts a number from 1 to 9 into text.\n\
  Function GetDigit(Digit)\nSelect Case Val(Digit)\nCase 1: GetDigit = \"One\"\nCase\
  \ 2: GetDigit = \"Two\"\nCase 3: GetDigit = \"Three\"\nCase 4: GetDigit = \"Four\"\
  \nCase 5: GetDigit = \"Five\"\nCase 6: GetDigit = \"Six\"\nCase 7: GetDigit = \"\
  Seven\"\nCase 8: GetDigit = \"Eight\"\nCase 9: GetDigit = \"Nine\"\nCase Else: GetDigit\
  \ = \"\"\nEnd Select\nEnd Function\n```\n\n\n2.  选择 `Debug | Compile VBAProject`\
  \ 菜单选项（见图 4-13）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig14_HTML.jpg](img/504229_1_En_4_Fig14_HTML.jpg)\n\
  \n**图 4-14**\n\n确保你保存为 `.xlsm` 文件。\n\n1.  从菜单中选择 `File | Close and return to Microsoft\
  \ Excel`。\n2.  回到电子表格中，选择 `File | Save As`。\n3.  输入文件名，例如 `SlotValues`。\n4.  选择一个方便的文件夹。\n\
  5.  确保文件类型为 `.xlsm`（Excel 启用宏的工作簿）（见图 4-14）。如果不是，请点击对话框底部的 `More options…`，并在 `File\
  \ Type` 下拉菜单中更改。\n6.  点击 `Save`。\n\n现在我们有了一个 `SpellNumber` 函数，可以用来将数值转换为文字。呼，喝口水吧，这是你应得的。\n\
  \n接下来，让我们为电子表格的“高度”选项卡创建选项。我们需要九个列标题，如表 4-3 所示。\n\n**表 4-3** 高度列\n\n| 值 | 术语 | 索引\
  \ | 同义词 1 … | 同义词 6 |\n| :--- | :--- | :--- | :--- | :--- |\n| 12 | 十二英寸 | 12 |\
  \ 一英尺 | 不适用 |\n| 30 | 三十厘米 | 30cm | 三十公分 | 不适用 |\n\n我们将把实际数字放在 `Value` 列中。然后，我们将在\
  \ `Term` 列中用英寸或厘米拼写出该数字。我们将通过直接使用英寸数字，并在公制版本后添加 `\"cm\"` 后缀来索引此列表。然后，我们将输入同义词的公式，如表\
  \ 4-4 所示。\n\n**表 4-4** 高度的同义词公式\n\n| 单位 | 列 | 转换 | 公式 |\n| :--- | :--- | :--- |\
  \ :--- |\n| 英制 | A [值] | 无 | 数字从 12 到 132。 |\n| | B [术语] | 转换为英寸 | `=Concat(SpellNumber($A2),\
  \ \" inches\")` |\n| | C[索引] | 无 | `=$A2` |\n| | D [同义词 1] | 转换为英尺 | `=Concat(SpellNumber(Trunc($A2/12)),\
  \ \" foot \", If(Mod($A2,12)=0, \"\", SpellNumber(Mod($A2,12))))` |\n| | E [同义词\
  \ 2] | 转换为英尺（复数） | `=Concat(SpellNumber(Trunc($A2/12)), \" feet \", If(Mod($A2,12)=0,\
  \ \"\", SpellNumber(Mod($A2,12))))` |\n| | F [同义词 3] | 转换为英尺/英寸 | `=If(Mod($A2,12)=0,\
  \ \"\", Concat(SpellNumber(Trunc($A2/12)), \" foot \", If(Mod($A2,12)=0, \"\", Concat(SpellNumber(Mod($A2,12)),\
  \ If(Mod($A2,12)=1, \" inch\", \" inches\")))))` |\n| | G [同义词 4] | 转换为英尺（复数）/英寸\
  \ | `=If(Mod($A2,12)=0, \"\", Concat(SpellNumber(Trunc($A2/12)), \" feet \", If(Mod($A2,12)=0,\
  \ \"\", Concat(SpellNumber(Mod($A2,12)), If(Mod($A2,12)=1, \" inch\", \" inches\"\
  )))))` |\n| | H [同义词 5] | 转换为空 | `=If(Mod($A2,12)=0, \"\", Concat(SpellNumber(Trunc($A2/12)),\
  \ \" \", SpellNumber(Mod($A2,12))))` |\n| | I [同义词 6] | 转换为带“And”的英寸（百位数） | `=If($A2<=100,\
  \ \"\", Concat(SpellNumber($A2,True), \" inches\"))` |\n| 公制 | A [值] | 无 | 数字从 30\
  \ 到 250。 |\n| | B [术语] | 转换为厘米 | `=Concat(SpellNumber($A123), \" centimeters\")`\
  \ |\n| | C[索引] | 后缀 cm | `=Concat($A123, \"cm\")` |\n| | D [同义词 1] | 转换为公分 | `=Concat(SpellNumber($A123),\
  \ \" c.m.\")` |\n| | E [同义词 2] | 转换为带“And”的厘米 | `=If($A123<=100, \"\", Concat(SpellNumber($A123,\
  \ True), \" centimeters\"))` |\n| | F [同义词 3] | 转换为带“And”的公分 | `=If($A123<=100,\
  \ \"\", Concat(SpellNumber($A123, True), \" c.m.\"))` |\n| | G [同义词 4] | 手动 | `50cm`\
  \ 半米<br>`100cm` 一米<br>`150cm` 一米半<br>`200cm` 两米<br>`250cm` 两米半 |\n| | H [同义词 5]\
  \ | 手动 | `50cm` 零点五米<br>`150cm` 一点五米<br>`250cm` 两点五米 |\n| | I [同义词 6] | 手动 | `50cm`\
  \ 点五米<br>`100cm` 一米<br>`150cm` 一米半<br>`250cm` 两米半 |\n\n然后，在相应的行中向下复制公式。完成后，工作表应如图\
  \ 4-15 所示。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig15_HTML.jpg](img/504229_1_En_4_Fig15_HTML.jpg)\n\
  \n**图 4-15** 完成公式后的高度电子表格\n\n对于重量，我们将做类似的事情。不过我们只需要三个同义词，如表 4-5 所示。\n\n**表 4-5**\
  \ 重量列\n\n| 值 | 术语 | 索引 | 同义词 1 … | 同义词 3 |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 17 | 十七磅 | 17lb | 一英石三磅 | 不适用 |\n| 20 | 二十公斤 | 20kg | 二十千克 | 不适用 |\n\n表 4-6 显示了同义词的公式。\n\
  \n**表 4-6** 重量的同义词公式\n\n| 单位 | 列 | 转换 | 公式 |\n| :--- | :--- | :--- | :--- |\n| 英制\
  \ | A [值] | 无 | 数字从 1 到 600。 |\n| | B [术语] | 转换为磅 | `=Concat(SpellNumber($A2), \"\
  \ pounds\")` |\n| | C[索引] | 后缀 lb | `=Concat($A2, \"lb\")` |\n| | D [同义词 1] | 转换为英石和磅\
  \ | `=If($A2<14, \"\", Concat(SpellNumber(Trunc($A2/14)), \" stone\", If(Mod($A2,14)=0,\
  \ \"\", Concat(\" \", Spellnumber(Mod($A2, 14)), \" pound\", If(Mod($A2,14)=1, \"\
  \", \"s\")))))` |\n| | E [同义词 2] | 转换为英石 | `=If($A2<14, \"\", Concat(SpellNumber(Trunc\
  \ ($A2/14)), \" stone\", IF(Mod($A2,14)=0, \"\", Concat(\" \", SpellNumber(Mod($A2,\
  \ 14))))))` |\n| | F [同义词 3] | 转换为带“And”的磅 | `=If($A2<=100, \"\", Concat(SpellNumber($A2,\
  \ True), \" pound\", If($A2=1,\"\",\"s\")))` |\n| 公制 | A [值] | 无 | 数字从 1 到 275。\
  \ |\n| | B [术语] | 转换为公斤 | `=Concat(SpellNumber($A602), \" kilo\", If($A602=1, \"\
  \", \"s\"))` |\n| | C[索引] | 后缀 kg | `=Concat($A602, \"kg\")` |\n| | D [同义词 1] |\
  \ 转换为千克 | `=Concat(SpellNumber($A602), \" kilogram\", If($A602=1, \"\", \"s\"))`\
  \ |\n| | E [同义词 2] | 转换为带“And”的公斤 | `=If($A602<=100, \"\", Concat(SpellNumber($A602,True),\
  \ \" kilo\", If($A602=1, \"\", \"s\")))` |\n| | F [同义词 3] | 转换为带“And”的千克 | `=If($A602<=100,\
  \ \"\", Concat(SpellNumber($A602,True), \" kilogram\", If($A602=1, \"\", \"s\")))`\
  \ |\n\n完成后的重量电子表格应如图 4-16 所示。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig16_HTML.jpg](img/504229_1_En_4_Fig16_HTML.jpg)\n\
  \n**图 4-16** 完成公式后的重量电子表格\n\n现在我们有了高度和重量槽位的槽值。\n\n此时，请务必保存你的工作，并保存工作簿的第二个副本！\n\n\
  要将槽值导出为 CSV 文件，我们需要将列表（不包括 A 列 [值]）复制到新工作表（或新工作簿），将公式粘贴为值，然后将该工作表导出为 CSV 文件。对高度执行一次，对重量再执行一次。导出过程如下：\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig17_HTML.jpg](img/504229_1_En_4_Fig17_HTML.jpg)\n\
  \n**图 4-17** 在 Excel 中粘贴值\n\n1.  在工作簿底部，点击 `+` 添加一个工作表。将其命名为 `HeightData`。\n2. \
  \ 在高度电子表格中，按 `Ctrl-Home`，然后按 `Ctrl-End`，再按 `Ctrl-Shift-Home`，最后按 `Shift-Right-Arrow`。\n\
  3.  现在，工作表被高亮显示（除 A 列外），我们可以按 `Ctrl-C` 复制所有内容。\n4.  点击切换到 `HeightData` 选项卡。\n5.\
  \  使用“粘贴”按钮菜单选择 `Paste Values`（见图 4-17）。\n6.  从菜单中选择 `File | Export`。\n7.  选择 `Change\
  \ File Type`。\n8.  选择 `CSV (Comma delimited) (*.csv)`。\n9.  点击 `Save As`。\n10. 输入文件名并点击\
  \ `Ok`。\n11. 对重量文件重复这些步骤。\n\n现在，我们准备好在 Alexa 开发者控制台中创建自定义槽位类型了。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig18_HTML.jpg](img/504229_1_En_4_Fig18_HTML.jpg)\n\
  \n**图 4-18** 批量编辑高度槽值\n\n\n1.  使用文本编辑器（如 Notepad++）打开刚创建的 `HeightData.csv` 文件，然后将内容复制到剪贴板。\n\
  2.  在 Alexa 开发者控制台中，点击顶部的 *Build* 选项卡。\n3.  点击左侧的 *Slot Types* 菜单。\n4.  点击 *+ Add\
  \ Slot Type*。\n5.  选择 *Create a Custom slot type with values*。\n6.  输入名称 `Height`，然后点击\
  \ *Next*。\n7.  对于 Slot Values，点击中间的 *Bulk Edit* 链接。\n8.  勾选 *The CSV below contains\
  \ headers*。\n9.  将数据粘贴到提供的框中（参见图 4-18）。\n10. 点击 *Submit*。\n11. 点击顶部的 *Save*。\n\n\
  现在对 `Weight` 数据重复这些步骤。\n\n配置好这些槽位后，我们就可以继续进行对话配置了。\n\n#### 配置对话\n\n在使用意图模型创建 Alexa\
  \ 技能时，接下来需要创建用于获取身高和体重的意图。然而，我更倾向于让 Alexa 自行判断用户已经或尚未告知我们的信息，并自行处理，这正是对话模型发挥作用的地方。在本书中，我们将使用这两种模型，但更倾向于后者。为了深入实践，我们将从将对话设置为\
  \ Alexa 对话开始。为此，我们需要：(1) 开启 Alexa 对话工具，(2) 构建一个示例对话，(3) 将示例的每一步与相关的表述和 API 调用连接起来，(4)\
  \ 创建完成技能的最终意图，以及 (5) 编写 API 的代码。\n\n**开启 Alexa 对话模型**\n\n1.  在 Alexa 开发者控制台中打开你的技能。\n\
  2.  选择顶部的 *Build* 选项卡。\n3.  选择左侧的 *Custom* 菜单选项。\n4.  选择左侧 *Custom* 下的 *Interfaces*\
  \ 菜单。\n5.  向下滚动到 *Alexa Conversations* 并将其切换为开启状态。\n6.  勾选 *Use Alexa Conversations\
  \ as the default dialog manager* 复选框。\n7.  点击顶部的 *Save Interfaces* 按钮。\n\n接下来，我们将识别并定义用于实现对话的\
  \ API。换句话说，Alexa 需要在后端代码中做什么来满足用户的意图。在我们的案例中，API 将接收两个参数：`Height` 和 `Weight`，并返回一个值：`BMI`。我们通过以下步骤在对话模型中定义这一点：\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig19_HTML.jpg](img/504229_1_En_4_Fig19_HTML.jpg)\n\
  \n图 4-19 添加 `CalculateBMI` API 定义\n\n1.  从左侧菜单中选择 *API Definitions* 选项。\n2.  点击顶部的\
  \ *Add API Definition* 按钮。\n3.  在顶部输入 `CalculateBMI` 作为 *APIName*（参见图 4-19）。\n\n\
  ![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig20_HTML.jpg](img/504229_1_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20 添加 `Height` 和 `Weight` 参数\n\n1.  点击 *Add Argument* 按钮。\n2.  输入 `Height`\
  \ 作为 *Name*。\n3.  选择 `Height` 作为 *Slot Type*（参见图 4-20）。\n4.  点击 *Add Argument* 按钮。\n\
  5.  输入 `Weight` 作为 *Name*。\n6.  选择 `Weight` 作为 *Slot Type*（参见图 4-20）。\n7.  我们稍后再处理\
  \ *Responses and Return* 部分。\n\n接下来，我们将输入一个用户与 Alexa 之间的示例对话。请按照以下步骤操作：\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig21_HTML.jpg](img/504229_1_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21 选择左侧的 *Dialogs* 选项卡\n\n1.  在左侧菜单栏中选择 *Alexa Conversations*。\n2.  选择其下的\
  \ *Dialogs*（参见图 4-21）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig22_HTML.jpg](img/504229_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22 输入 `GetHeightAndWeight` 作为对话名称\n\n1.  点击顶部的 *Add Dialog* 按钮。\n2.  在顶部输入\
  \ `GetHeightAndWeight` 作为 *DialogName*（参见图 4-22）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig23_HTML.png](img/504229_1_En_4_Fig23_HTML.png)\n\
  \n图 4-23 用户与 Alexa 之间的示例对话\n\n1.  现在你会看到一个表格，你可以在其中输入用户与 Alexa 之间可能发生的对话，以使你的技能正常工作。在我们的案例中，这将类似于图\
  \ 4-23。\n\n下一步是将示例对话与表述集、API 定义和响应连接起来。表述集是用户可能说的话。API 定义是对话如何告诉 Alexa 找出答案。响应是\
  \ Alexa 对用户说的话。\n\n以下是我们将如何连接 `MainDialog`：\n\n\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig24_HTML.png](img/504229_1_En_4_Fig24_HTML.png)\n\
  \n**图 4-24** 选择对话\n\n1. 选择对话的第一行（见图 4-24）。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig25_HTML.jpg](img/504229_1_En_4_Fig25_HTML.jpg)\n\
  \n**图 4-25** 选择调用 API\n\n1. 在右侧，点击 *Dialog Act* 下拉菜单，然后选择 *Invoke APIs*。（见图 4-25。）\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig26_HTML.jpg](img/504229_1_En_4_Fig26_HTML.jpg)\n\
  \n**图 4-26** 创建新的表述集\n\n1. 点击 *Select an Utterance Set* 下拉菜单，然后选择 *Create New Utterance\
  \ Set*。（见图 4-26。）\n\n1. 此时会显示要选择的表述集。这表示用户可能会说什么来调用 API。例如，他们可能会说“我的 B.M.I. 是多少？”，就像我们在示例中输入的那样，或者他们可能会说“计算我的\
  \ B.M.I.”。这两个选项构成一个表述集，我们需要定义这个集合，以便 Alexa Conversations 在用户说出这些内容时能够理解。为此，我们需要：\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig27_HTML.jpg](img/504229_1_En_4_Fig27_HTML.jpg)\n\
  \n**图 4-27** 命名表述集\n\n1. 输入 *Utterance Set Name*：**InvokeCalculateBMI**。（见图 4-27。）\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig28_HTML.jpg](img/504229_1_En_4_Fig28_HTML.jpg)\n\
  \n**图 4-28** 输入第二条表述并点击保存按钮\n\n1. 跳过 *Dialog Act* 部分，直接进入 *Sample Utterances*。\n\
  \n2. 点击 *Add Utterance* 按钮。\n\n3. 在 *What might the user say?* 框中输入 **Calculate\
  \ my B.M.I.**，然后按回车键。\n\n4. 输入另一条表述：**What’s my B.M.I.**（见图 4-28。）\n\n5. 现在点击 *Save*\
  \ 按钮。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig29_HTML.jpg](img/504229_1_En_4_Fig29_HTML.jpg)\n\
  \n**图 4-29** 选择请求参数\n\n1. 回到对话中，选择对话的第二行，即 Alexa 的回合。\n\n2. 在右侧，点击 *Dialog Act*\
  \ 下拉菜单，然后选择 *Request Args*。（见图 4-29。）当 Alexa 向用户请求参数（槽位值）时，会使用此 Dialog Act。\n\n\
  ![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig30_HTML.jpg](img/504229_1_En_4_Fig30_HTML.jpg)\n\
  \n**图 4-30** 选择 CalculateBMI API\n\n1. 首先，选择我们之前定义的 CalculateBMI API。此 API 是此对话将要调用的\
  \ API。选择 **CalculateBMI** 作为 *API to Request*。（见图 4-30。）\n\n1. 按如下方式完成 Request Args\
  \ Dialog Act 的选项：\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig31_HTML.jpg](img/504229_1_En_4_Fig31_HTML.jpg)\n\
  \n**图 4-31** 配置响应\n\n1. 在 *API Arguments to Request* 下，保留 **Height** 和 **Weight**\
  \ 不变。\n\n2. 在 *Response* 下拉菜单中，选择 *Create New Response*。\n\n3. 这是 Alexa 可能会对我们说的话，以让我们提供身高和体重。在\
  \ *Response Name* 下，输入 **GetHeightAndWeight**。\n\n4. 向下滚动，输入 **PromptForHeightAndWeight**\
  \ 作为 *Audio Response Name*。\n\n5. 我们编写的示例对话已作为音频提示输入，因此我们可以点击底部的 *Save* 按钮。（见图 4-31。）\n\
  \n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig32_HTML.jpg](img/504229_1_En_4_Fig32_HTML.jpg)\n\
  \n**图 4-32** 输入身高提示\n\n1. 然后我们点击主控制台顶部的 *Save* 按钮。\n\n\n\n2.  还需要添加两个额外的响应。这是针对用户只提供了所请求参数之一的情况。Alexa\
  \ 需要提示用户提供缺失的参数。在“额外响应”下，有仅请求身高和仅请求体重的选项。我们需要对每个选项重复之前的步骤 (c) 到 (g)，具体如下：\n\n3.\
  \  在身高参数旁边，选择`创建新响应`。\n\n4.  在`响应名称`中输入`GetHeight`。\n\n5.  在`音频响应名称`中输入`PromptForHeight`。\n\
  \n6.  在`Alexa 提示`下，点击`添加提示`。\n\n7.  在`Alexa 提示`框中输入`你的身高是多少？`。\n\n8.  点击`保存`。（见图\
  \ 4-32。）\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig33_HTML.jpg](img/504229_1_En_4_Fig33_HTML.jpg)\n\
  \n图 4-33\n\n添加两个响应后的额外响应\n\n1.  在体重参数旁边，选择`创建新响应`。\n\n2.  在`响应名称`中输入`GetWeight`。\n\
  \n3.  在`音频响应名称`中输入`PromptForWeight`。\n\n4.  在`Alexa 提示`框中输入`你的体重是多少？`，并点击末尾的 + 号进行添加。\n\
  \n5.  点击`创建提示`。\n\n6.  点击`保存`。\n\n7.  你的`额外响应`现在应该如图 4-33 所示。\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig34_HTML.jpg](img/504229_1_En_4_Fig34_HTML.jpg)\n\
  \n图 4-34\n\n点击顶部的保存\n\n1.  点击控制台顶部的`保存`按钮以保存进度。（见图 4-34。）\n\n![../images/504229_1_En_4_Chapter/504229_1_En_4_Fig35_HTML.jpg](img/504229_1_En_4_Fig35_HTML.jpg)\n\
  \n图 4-35\n\n选择供用户填写的槽位后\n\n1.  选中文字`six foot two`。你可能需要尝试几次，因为槽位提示非常急切。\n\n2.  在弹出的槽位类型提示中，选择`身高`作为`槽位类型`。\n\
