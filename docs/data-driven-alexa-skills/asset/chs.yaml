  python3.8\\site-packages\npip install -–target . datetime\npip install -–target\
  \ . ask_sdk_core\n```\n\n请注意 `pip install` 这两行。这对大多数模块都有效，但有些模块（如 `regex`）是以二进制文件形式分发的，你不能直接使用\
  \ `pip install` 安装它们。相反，你需要遵循以下步骤：\n\n1. 打开浏览器访问 [`https://pypi.org/project/regex`](https://pypi.org/project/regex)。\n\
