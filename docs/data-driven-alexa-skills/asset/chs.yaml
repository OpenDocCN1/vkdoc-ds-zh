  \n当 Git 安装程序询问你以下问题时，以下是建议的答案：\n\n**选择 Git 使用的默认编辑器**：选择 Notepad++。\n\n**调整你的 PATH\
  \ 环境**：仅从 Git Bash 使用 Git。\n\n否则，你可以保留默认选择并安装 Git for Windows。\n\n安装完所有这些工具后，你还需要安装\
  \ Python 模块。\n\n### 安装 Python 模块\n\n在本书中，我们将不断向 Anaconda 环境中添加 Python 模块。现在，我们需要创建该环境并安装几个模块。为此，请按照以下步骤操作：\n\
