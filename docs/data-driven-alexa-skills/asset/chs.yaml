- '# 第二部分：自定义技能开发


  在第一部分创建了您的第一个技能后，我们将深入探讨技能开发过程的许多组成部分。通过构建一个 90 年日历技能，我们将涵盖 Alexa 交互模型，包括意图、槽位和表述。我们将使用
  Alexa 演示语言在带屏幕的设备上绘制 90 年日历。我们将使用帐户链接来安全地收集您生活中的事件。我们将创建一个自定义 lambda 函数——我们技能的大脑。最后，我们使用
  DynamoDb 持久层来存储您的信息，以便 Alexa 记住您。


  ### 第 7 章：自定义 Alexa 技能


  现在您已经在第一部分创建了一个 Alexa 托管的技能，我们准备创建一个完全自定义的技能，并了解如何使用亚马逊云服务（AWS）云的一些更高级功能作为您的 Alexa
  技能后端。您需要一些 AWS 帐户和服务才能开始。


  ### 第 8 章：超越 Hello World


  设置好帐户并定义了基本需求后，我们准备设计语音用户界面。对话设计是出了名的困难，但有一些工具，如 Botmock，可以使其变得容易得多。在本章中，我们为 90
  年日历技能设计对话。


