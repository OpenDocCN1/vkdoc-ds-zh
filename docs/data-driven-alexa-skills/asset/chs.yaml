  \      rate = 60.0 / 5.0\n    if not \"stocks\" in profile:\n        return 0\n\
  \    if len(profile[\"stocks\"]) == 0:\n        return 0\n    totalValue = float(0)\n\
  \    for ticker, quantity in profile[\"stocks\"].items():\n        if quantity !=\
  \ 0:\n            querystring[\"symbol\"] = ticker\n            response = requests.request(\n\
  \                \"GET\", stockurl, headers=headers, params=querystring)\n     \
