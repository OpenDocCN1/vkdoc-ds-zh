  \n### 总结\n\n在前面的章节中，你为 90 年日历技能设计并实现了 VUI。在本章中，你使用 APL、SVG 和 Json 为带屏幕的 Alexa 设备构建了视觉呈现。在下一章中，我们将创建后端\
  \ lambda 函数，为 VUI 提供代码支持，并将 VUI 连接到 APL。\n\n脚注 1\n\n## 11. 编写 Lambda 函数\n\n在第 9\
  \ 章中，我们将 Botmock 图表转换为 Alexa 技能并配置了 VUI。在第 10 章中，我们为 90 年日历的视觉显示添加了 APL 呈现。在本章中，我们将创建后端\
  \ lambda 函数，为 VUI 提供代码支持，并将 VUI 连接到 APL。由于我们没有使用 Alexa 托管的技能，因此在第 7 章中，我们将 lambda\
  \ 函数配置为亚马逊网络服务。\n\n开始之前\n\n1. 首先，以管理员用户身份（而非 root 用户）登录 AWS 开发者控制台。AWS 控制台地址为：[`https://console.aws.amazon.com`](https://console.aws.amazon.com)。\n\
  \n2. 选择服务 | 计算 | Lambda。\n\n3. 选择我们在第 7 章中创建的 `CalendarLambdaBackend`。\n\n你应该会在\
  \ `lambda_function.py` 文件中看到一小段代码：\n\n```\nimport json\ndef lambda_handler(event,\
  \ context): #TODO implement\nreturn {\n'statusCode': 200,\n'body': json.dumps('Hello\
  \ from Lambda!')\n}\n```\n\n此时，我们需要完成以下几件事：\n\n1. 将 VUI 连接到 lambda 函数。\n\n2. 创建所有将处理意图的函数。\n\
  \n3. 进行计算以得出 90 年日历的值。\n\n4. 定义 90 年日历视觉显示要绑定的数据集。\n\n5. 进行计算以将视觉显示缩放到当前设备的屏幕。\n\
  \n6. 将渲染后的 APL 和语音输出作为响应对象返回。\n\n7. 在 lambda 函数底部定义 Skill Builder 对象。\n\n### 将 VUI\
  \ 连接到 Lambda 函数\n\n要将 VUI 连接到 lambda 函数，我们需要将 Alexa 技能中的技能 ID 复制到 lambda 函数，并将 lambda\
  \ 函数中的 ARN（亚马逊资源名称）复制到 Alexa 技能。\n\n![../images/504229_1_En_11_Chapter/504229_1_En_11_Fig1_HTML.jpg](img/504229_1_En_11_Fig1_HTML.jpg)\n\
  \n图 11-1\n\nlambda 函数的 ARN\n\n1. 在 lambda 函数的右上角，你可以看到 ARN。（见图 11-1。）点击图标复制 ARN。\n\
  \n2. 切换到 90 年日历 Alexa 技能。Alexa 开发者控制台地址为：[`https://developer.amazon.com/alexa/console/ask`](https://developer.amazon.com/alexa/console/ask)\n\
  \n3. 从左侧导航栏中选择端点。\n\n4. 将 ARN 粘贴到默认区域框中。\n\n5. 点击顶部的保存端点按钮。你应该会看到一条绿色的成功消息。\n\n\
  6. 切换回 AWS 中的 lambda 函数。\n\n在下一节中，我们将创建意图处理器。\n\n### 创建意图处理器\n\n我们的 Alexa 技能交互模型包含许多意图。每个意图都需要在\
  \ lambda 函数中进行处理。要创建意图处理器，我们需要导入以下 Python 模块：\n\n```\nimport json\nimport logging\n\
  import ask_sdk_core.utils as ask_utils\nfrom ask_sdk_core.skill_builder import SkillBuilder\n\
  from ask_sdk_core.dispatch_components import AbstractRequestHandler\nfrom ask_sdk_core.dispatch_components\
  \ import AbstractExceptionHandler\nfrom ask_sdk_core.handler_input import HandlerInput\n\
  from ask_sdk_model import Response\n```\n\n直接用这些导入语句完全替换已有的代码片段。然后使用以下代码行开启日志记录：\n\
  \n```\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n```\n\
  \n接下来，我们可以查看意图处理器的结构。\n\n\n\n#### 意图处理程序的结构\n\n意图处理程序的结构如下：\n\n```\nclass xxxIntentHandler(AbstractRequestHandler):\n\
  \"\"\"用于 xxx 意图的处理程序。\"\"\"\n# 第 A 部分 – 可处理声明\ndef can_handle(self, handler_input):\n\
  return ask_utils.is_intent_name(\"AMAZON.HelpIntent\")(handler_input)\n# 第 B 部分\
  \ – 处理函数\ndef handle(self, handler_input):\nspeak_output = \"\"\"语音内容。\"\"\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n#第 C 部分 - 返回响应\nreturn (\nhandler_input.response_builder\n\
  .speak(speak_output)\n.ask(speak_output)\n.response\n)\n```\n\n如上所示，共有三个部分，具体描述如下。\n\
  \n#### 第 A 部分 – 可处理声明\n\n每个处理程序声明它要处理哪个意图。例如，内置帮助意图的处理程序如下所示：\n\n```\ndef can_handle(self,\
  \ handler_input):\nreturn ask_utils.is_intent_name(\"AMAZON.HelpIntent\")(handler_input)\n\
  ```\n\n而自定义的“获取完成百分比”意图的处理程序如下所示：\n\n```\ndef can_handle(self, handler_input):\n\
  return ask_utils.is_intent_name(\"GetPercentDone\")(handler_input)\n```\n\nAlexa\
  \ 的 AI 会遍历所有声明的意图处理程序，并调用与用户所说意图匹配的那个。一旦确定了正确的处理程序类，Alexa 将调用该类的处理函数。\n\n#### 第\
  \ B 部分 – 处理函数\n\n每个意图处理程序类都声明一个处理函数，该函数负责确定 Alexa 将说什么来处理用户的意图。例如，90 年日历的内置帮助意图处理程序如下所示：\n\
  \n```\ndef handle(self, handler_input):\nspeak_output = \"\"\"请尝试以月、日、年的格式说出您的生日。例如，一九八零年一月一日。\n\
  告诉我您的生日，我会告诉您一些有趣的事情。\"\"\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n```\n\n在这个处理程序中，有两行代码。第一行定义了 Alexa 在响应用户寻求帮助时将说的语音内容。第二行是一个辅助函数，将此响应作为\
  \ Alexa 最后说的话存储在会话属性中。在某些情况下，我们需要知道 Alexa 最后说了什么。\n\n定义语音内容后，我们将其作为响应对象返回。\n\n####\
  \ 第 C 部分 – 返回响应\n\n一旦我们创建了要输出的语音内容，就需要将其转换为响应对象。这是由响应构建器完成的，如下所示：\n\n```\nreturn\
  \ (\nhandler_input.response_builder\n.speak(speak_output)\n.ask(speak_output)\n\
  .response\n)\n```\n\n第一行调用 `response_builder`。第二行将我们之前创建的语音内容定义为 Alexa 将说的话。第三行将相同的语音内容定义为她向用户提问以继续对话的问题（不过她不会说两次）。第四行是正在返回的已创建的响应对象。\n\
  \n现在我们有了意图处理程序的结构，就可以创建我们将要使用的意图处理程序了。\n\n#### 构建意图处理程序\n\n当我们从 Botmock 导入项目时，最终得到了\
  \ 26 个意图。我们目前不会为所有这些意图创建处理程序。我们将处理那些渲染基本 90 年日历的意图，以及一些内置意图。我们将在接下来的几章中构建其他一些意图。有些将作为练习留给您完成。\n\
  \n我们需要在 `GiveBirthday` 意图处理程序中放入相当多的代码，以便渲染日历。所以我们暂时先不管它，专注于内置意图。我们需要的内置意图有：\n\n\
  *   帮助\n*   回退\n*   取消\n*   停止\n*   重复\n*   重新开始\n\n##### 帮助意图\n\n我们技能的帮助意图处理程序开始时非常简单。随着我们在后续章节中向技能添加日历事件，帮助意图处理程序应该通过以特定上下文的方式响应来变得更有帮助。目前，我们将帮助响应限制在生日提示上。首先，我们应用前面显示的模板。然后我们更改类和意图名称。然后我们定义语音响应。代码如下：\n\
  \n```\nclass HelpIntentHandler(AbstractRequestHandler):\n\"\"\"用于帮助意图的处理程序。\"\"\"\
  \ndef can_handle(self, handler_input):\nreturn ask_utils.is_intent_name(\"AMAZON.HelpIntent\"\
  )(handler_input)\ndef handle(self, handler_input):\nspeak_output = \"\"\"请尝试以月、日、年的格式说出您的生日。例如，一九八零年一月一日。\n\
  告诉我您的生日，我会告诉您一些有趣的事情。\"\"\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(speak_output)\n.response\n)\n```\n\n##### 回退意图\n\n如果用户的话语无法解析到任何其他意图处理程序，那么如果定义了回退意图处理程序，Alexa\
  \ 将调用它。您应该始终定义一个。与之前的帮助意图类似，这个意图处理程序可能有更复杂的版本，但我们在第一次实现中保持简单。代码如下：\n\n```\nclass\
  \ FallbackIntentHandler(AbstractRequestHandler):\n\"\"\"用于回退意图的处理程序。\"\"\"\ndef\
  \ can_handle(self, handler_input):\nreturn ask_utils.is_intent_name(\"AMAZON.FallbackIntent\"\
  )(handler_input)\ndef handle(self, handler_input):\nspeak_output = \"\"\"九十年日历无法处理这个，但我可以帮助您了解一些关于您生活的有趣信息。\n\
  告诉我您的生日，我会告诉您一些有趣的事情。\"\"\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(speak_output)\n.response\n)\n```\n\n##### 取消和停止意图\n\n当我们的技能变得更高级时，取消和停止意图之间可能存在一些差异，但目前，它们服务于相同的目的，即结束技能。在这里，我们通过使用\
  \ `OR` 逻辑组合条件来合并处理程序。代码如下：\n\n```\nclass CancelOrStopIntentHandler(AbstractRequestHandler):\n\
  \"\"\"用于取消和停止意图的单一处理程序。\"\"\"\ndef can_handle(self, handler_input):\nreturn (ask_utils.is_intent_name(\"\
  AMAZON.CancelIntent\")(handler_input) or\nask_utils.is_intent_name(\"AMAZON.StopIntent\"\
  )(handler_input))\ndef handle(self, handler_input):\nspeak_output = \"再见！\"\nreturn\
  \ (\nhandler_input.response_builder\n.speak(speak_output)\n.response\n)\n```\n\n\
  `last_speech` 会话属性在此无关紧要，因为我们要在此结束技能。\n\n##### 重复意图\n\n当用户没有听到或听错 Alexa 的话时，他们可能会要求她重复刚才说的话。这就是为什么我们在其他处理程序中一直在收集\
  \ `last_speech` 会话属性。在这个意图处理程序中，我们将重复我们上次说过的话，或者如果 `last_speech` 尚未设置，则提示用户。代码如下：\n\
  \n```\nclass RepeatIntentHandler(AbstractRequestHandler):\n\"\"\"用于重复意图的处理程序。\"\"\
  \"\ndef can_handle(self, handler_input):\nreturn ask_utils.is_intent_name(\"AMAZON.RepeatIntent\"\
  )(handler_input)\ndef handle(self, handler_input):\nif \"last_speech\" in handler_input.attributes_manager.session_attributes:\n\
  speak_output = handler_input.attributes_manager.session_attributes[\"last_speech\"\
  ]\nelse:\nspeak_output = \"\"\"告诉我您的生日，我会告诉您一些有趣的事情。\"\"\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(speak_output)\n.response\n)\n```\n\n\n\n##### 重新开始意图\n\n```\nclass StartOverIntentHandler\
  \ (AbstractRequestHandler):\n\"\"\"用于处理重新开始意图的处理器。\"\"\"\ndef can_handle(self, handler_input):\n\
  return ask_utils.is_request_type(\"AMAZON.StartOverIntent\")(handler_input)\ndef\
  \ handle(self, handler_input):\nspeak_output = \"欢迎，告诉我你的生日，我会告诉你一些有趣的事情。\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(speak_output)\n.response\n)\n```\n\n很好！我们已经为基础日历定义了必要的意图处理器。除此之外，我们还需要一些系统定义的处理器：\n\
  \n*   启动请求处理器\n*   会话结束请求处理器\n*   用于调试的意图反射器处理器\n*   用于处理任何异常的全捕获异常处理器\n\n#####\
  \ 启动请求处理器\n\n当技能启动时，Alexa 会调用启动请求处理器。这将返回启动我们技能的初始提示。在我们的案例中，我们需要询问用户的生日。代码如下：\n\
  \n```\nclass LaunchRequestHandler(AbstractRequestHandler):\n\"\"\"用于技能启动的处理器。\"\"\
  \"\ndef can_handle(self, handler_input):\nreturn ask_utils.is_request_type(\"LaunchRequest\"\
  )(handler_input)\ndef handle(self, handler_input):\nspeak_output = \"欢迎，告诉我你的生日，我会告诉你一些有趣的事情。\"\
  \nhandler_input.attributes_manager.session_attributes[\"last_speech\"] = speak_output\n\
  return (\nhandler_input.response_builder\n.speak(speak_output)\n.ask(speak_output)\n\
  .response\n)\n```\n\n##### 会话结束请求处理器\n\n当用户停止或取消会话，或者代码退出会话时，会调用会话结束请求处理器。它负责执行任何清理逻辑，例如关闭打开的数据库连接。我们目前还没有任何清理逻辑。我们将暂时存根化会话结束请求处理器。代码如下：\n\
  \n```\nclass SessionEndedRequestHandler(AbstractRequestHandler):\n\"\"\"用于会话结束的处理器。\"\
  \"\"\ndef can_handle(self, handler_input):\nreturn ask_utils.is_request_type(\"\
  SessionEndedRequest\")(handler_input)\ndef handle(self, handler_input):\n# 任何清理逻辑都放在这里。\n\
  return handler_input.response_builder.response\n```\n\n##### 意图反射器处理器\n\n在测试时，你可能想知道哪些意图被触发了。意图反射器处理器就是为此而设计的。只需在\
  \ `can_handle` 逻辑中通过 `OR` 运算加入你想要宣布的意图，就像我们对取消和停止意图所做的那样。代码如下：\n\n```\nclass IntentReflectorHandler(AbstractRequestHandler):\n\
  \"\"\"意图反射器用于交互模型测试和调试。\n它会简单地重复用户说出的意图。你可以通过在上面定义自定义处理器，\n然后将它们添加到下面的请求处理器链中，来为你的意图创建自定义处理器。\n\
  \"\"\"\ndef can_handle(self, handler_input):\nreturn ask_utils.is_request_type(\"\
  IntentRequest\")(handler_input)\ndef handle(self, handler_input):\nintent_name =\
  \ ask_utils.get_intent_name(handler_input)\nspeak_output = \"你刚刚触发了 \" + intent_name\
  \ + \"。\"\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n# .ask(\"\
  如果你想保持会话打开让用户回复，请添加一个重新提示\")\n.response\n)\n```\n\n要反射（宣布）帮助意图，你可以通过 `OR` 运算将其添加到\
  \ `can_handle` 中，如下所示：\n\n```\ndef can_handle(self, handler_input):\nreturn (ask_utils.is_request_type(\"\
  IntentRequest\")(handler_input) or\nask_utils.is_intent_name(\"AMAZON.HelpIntent\"\
  )(handler_input))\n```\n\n要添加另一个意图，请使用 `OR` 将它们链接在一起。\n\n##### 全捕获异常处理器\n\n如果出现任何问题，Alexa\
  \ 只会停止并说：“抱歉，我不知道。”为了避免这种情况并说出更有帮助的内容，我们需要一个全捕获异常处理器。注意添加了 `logger.error()` 来记录异常。根据所处理的异常，你可以让\
  \ Alexa 说出不同的内容。在我们的示例中，我们只是对默认消息进行详细说明。代码如下：\n\n```\nclass CatchAllExceptionHandler(AbstractExceptionHandler):\n\
  \"\"\"通用错误处理，用于捕获任何语法或路由错误。如果你收到错误\n提示未找到请求处理器链，说明你尚未为正在调用的意图实现处理器，\n或者未将其包含在下面的技能构建器中。\n\
  \"\"\"\ndef can_handle(self, handler_input, exception):\nreturn True\ndef handle(self,\
  \ handler_input, exception):\nlogger.error(exception, exc_info=True)\nspeak_output\
  \ = \"抱歉，我在执行你的请求时遇到了问题。请再试一次。\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(speak_output)\n.response\n)\n```\n\n就是这样。这些就是我们需要的内置意图处理器。在接下来的几个部分中，我们将添加\
  \ GiveBirthday 意图处理器并对其进行完善。\n\n##### GiveBirthday 意图处理器\n\n首先，我们将存根化 GiveBirthday\
  \ 意图处理器：\n\n```\nclass GiveBirthdayIntentHandler(AbstractRequestHandler):\n\"\"\"\
  用于处理 GiveBirthday 意图的处理器。\"\"\"\ndef can_handle(self, handler_input):\nreturn ask_utils.is_intent_name(\"\
  GiveBirthday\")(handler_input)\ndef handle(self, handler_input):\nspeak_output =\
  \ \"\"\"语音内容。\"\"\"\nhandler_input.attributes_manager.session_attributes[\"last_speech\"\
  ] = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(speak_output)\n.response\n)\n```\n\n请记住，在启动请求处理器中，我们提示用户：“欢迎，告诉我你的生日，我会告诉你一些有趣的事情”。GiveBirthday\
  \ 意图处理器接受用户的出生日期，并返回“有趣的事情”，即他们 90 年寿命中已流逝的部分。在下一节中，我们将计算这个数值。\n\n\n\n### 计算 90\
  \ 年日历数值\n\n首先，我们将处理日期，因此需要额外导入一些模块。在模块顶部添加以下内容：\n\n```\nfrom datetime import datetime,\
  \ timedelta\nimport calendar\nimport regex as re\n```\n\n然后，在模块底部添加以下实用函数。这些函数在进行日期操作时会派上用场：\n\
  \n```\ndef addYears(d, years):\n    try:\n        # 返回当前年份的同一天\n        return d.replace(year=d.year\
  \ + years)\n    except ValueError:\n        # 如果日期不存在，则返回其他日期，例如 2 月 29 日变为 3 月\
  \ 1 日等。\n        return d + (datetime.date(d.year + years, 1, 1) - datetime.date(d.year,\
  \ 1, 1))\n\ndef days_between(d1, d2):\n    return abs((d2 - d1).days)\n\ndef period_from_amazon_date20(iso):\n\
  \    logger.info(\"正在转换 AMAZON.DATE: {}\".format(iso))\n\ndef no_future(date):\n\
  \    dnow = datetime.now()\n    today = datetime(dnow.year, dnow.month, dnow.day)\n\
  \    if date > today:\n        return datetime(date.year-1, date.month, date.day)\n\
  \    else:\n        return date\n\ndef week_to_start_date(week_wanted):\n    now\
  \ = datetime.now()\n    year, week, day = now.isocalendar()\n    this_week_start\
  \ = datetime(now.year, now.month, now.day) - timedelta(days=day)\n    wanted_week_start\
  \ = this_week_start - timedelta(days=(week - week_wanted) * 7)\n    return wanted_week_start\n\
  \n    period = None\n    start = None\n    end = None\n    wutterance = None\n \
  \   if re.match(\"\\\\d{4}-\\\\d{2}-\\\\d{2}\", iso):\n        # 单日\n        start\
  \ = datetime.fromisoformat(iso)\n        end = datetime(start.year, start.month,\
  \ start.day) + timedelta(days=1)\n        period = \"day\"\n        utterance =\
  \ \"{} of {}\".format(start.day, calendar.month_name[start.month])\n    elif re.match(\"\
  \\\\d{4}-W\\\\d{2}\", iso) or re.match(\"\\\\d{4}-W\\\\d{2}-XX\", iso):\n      \
  \  # 周\n        # start = datetime.fromisocalendar(int(iso[0:4]), int(iso[6:8]),\
  \ 1)\n        # ^python 3.7 没有 fromisocalendar 方法\n        start = week_to_start_date(int(iso[6:8]))\n\
  \        end = datetime(start.year, start.month, start.day) + timedelta(days=7)\n\
  \        period = \"week\"\n        utterance = \"the week number {} of {}\".format(iso[6:8],\
  \ start.year)\n    elif re.match(\"\\\\d{4}-\\\\d{2}\", iso) or re.match(\"\\\\\
  d{4}-\\\\d{2}-XX\", iso):\n        # 月\n        start = datetime(int(iso[0:4]),\
  \ int(iso[5:7]), 1)\n        start = no_future(start)\n        end = datetime(start.year,\
  \ start.month+1, start.day)\n        period = \"month\"\n        utterance = \"\
  {}\".format(calendar.month_name[start.month])\n    elif re.match(\"\\\\d{4}\", iso)\
  \ or re.match(\"\\\\d{4}-XX-XX\", iso) or re.match(\"\\\\d{4}-XX\", iso):\n    \
  \    # 年\n        start = datetime(int(iso[0:4]), 1, 1)\n        start = no_future(start)\n\
  \        end = datetime(start.year+1, start.month, start.day)\n        period =\
  \ \"year\"\n        utterance = \"{}\".format(start.year)\n    if not start:\n \
  \       logger.error(\"获取日期失败。\")\n        return None\n    logger.info(\"{} - {}\
  \ - {} - {}\".format(period, start, end, utterance))\n    now = datetime.now()\n\
  \    if start > now:\n        logger.info(\"未来日期\")\n        return None\n    if\
  \ end > now:\n        end = datetime(now.year, now.month, now.day)\n    return start,\
  \ end, period, utterance\n```\n\n现在，我们准备进行日期操作，以确定 90 年日历的边界。具体来说，我们需要知道以下变量：\n\n\
  | 变量 | 含义 | 计算方式 |\n| --- | --- | --- |\n| `bday` | 生日 | 意图槽位中获取 |\n| `today` |\
  \ 今天 | `datetime.today()` |\n| `dday` | 90 年寿命的终点 | `bday` + 90 年 |\n| `lived` |\
  \ 已活天数 | `days_between(bday, today)` |\n| `weeksLived` | 已活周数 | `lived` / 7 |\n\
  | `life` | 90 年寿命的总天数 | `days_between(bday, dday)` |\n| `weeksLife` | 寿命总周数 | `life`\
  \ / 7 |\n| `remain` | 剩余天数 | `days_between(today, dday)` |\n| `weeksRemain` | 剩余周数\
  \ | `remain` / 7 |\n| `livedPercent` | 已活寿命百分比 | `lived` / `life` |\n| `yearsLived`\
  \ | 已活年数 | `weeksLived` / 52 |\n| `weeksInYear` | 当前年份已过周数 | `weeksLived` 对 52 取模\
  \ |\n\n相关代码放置在 `GiveBirthdayIntentHandler` 的 `handle` 函数中，如下所示：\n\n```\ndef handle(self,\
  \ handler_input):\n    bday_str = handler_input.request_envelope.request.intent.slots[\"\
  birthday\"].value\n    logger.info(f\"生日: {bday_str}\")\n    bday, _, _, _ = period_from_amazon_date(bday_str)\n\
  \    today = datetime.today()\n    dday = addYears(bday, 90)\n    lived = days_between(bday,\
  \ today)\n    weeksLived = round(lived / 7.0, 1)\n    life = days_between(bday,\
  \ dday)\n    weeksLife = round(life / 7.0, 1)\n    remain = days_between(today,\
  \ dday)\n    weeksRemain = round(remain / 7.0, 1)\n    livedPercent = round(lived\
  \ / life * 100.0, 1)\n    yearsLived = int(weeksLived / 52)\n    weeksInYear = int(weeksLived\
  \ % 52)\n```\n\n处理好所有日期后，我们可以生成关于用户 90 年日历的陈述。例如：\n\n```\nspeak_output = f\"\"\"\
  您的生日是：{bday}。\n如果您能活到 90 岁，您已经度过了\n{livedPercent}% 的人生。\n也就是说，在您 90 年寿命的\n{weeksLife}\
  \ 周中，您已经度过了\n{weeksLived} 周，还剩下\n{weeksRemain} 周。\"\"\"\nlogger.info(f\"语音输出: {speak_output}\"\
  )\nhandler_input.attributes_manager.session_attributes[\"last_speech\"] = speak_output\n\
  ```\n\n至此，我们已准备好构建 APL 模板的数据源。\n\n#### 定义 90 年日历的数据集\n\n根据上一节计算出的所有周和年数值，我们可以轻松构建\
  \ 90 年日历的 APL 数据集。基于第 10 章的工作，数据集包含三个区域。区域 1 为每个已活年份设置`@C1`。区域 3 为每个未活年份设置`@C0`。区域\
  \ 2 为今天之前的每周设置`@C1`，为今天之后的每周设置`@C0`。生成这些数据的代码可能如下所示：\n\n```\nzone1 = []\nfor z1\
  \ in range(0, yearsLived):\n    zone1.append(\"@C1\")\nzone2 = []\nfor z2 in range(0,\
  \ 52):\n    if z2 <= weeksInYear:\n        zone2.append(\"@C1\")\n    else:\n  \
  \      zone2.append(\"@C0\")\nzone3 = []\nfor z3 in range(yearsLived + 1, 90):\n\
  \    zone3.append(\"@C0\")\n```\n\n定义好这些区域后，我们可以根据 Alexa 屏幕（如果有）调整区域和方框的尺寸。\n\n\
  #### 根据当前屏幕缩放视觉效果\n\n现在，我们需要确定区域和方框的最终尺寸，使其适应当前 Alexa 设备的屏幕（即视口）。如果 Alexa 设备有屏幕，我们可以获取视口状态，并确定最终的方框高度和宽度。根据这些值，我们可以确定最终的行宽和区域高度。实现此功能的代码将包裹之前的区域代码，因为如果没有屏幕，构建区域就没有意义。构建缩放后数据集的最终代码如下：\n\
  \n```\nif ask_utils.get_supported_interfaces(handler_input) \\\n        .alexa_presentation_apl\
  \ is not None:\n    logger.info(\"APL 已启用\")\n    viewportWidth = 0\n    viewportHeight\
  \ = 0\n    viewport_state = handler_input.request_envelope.context.viewport\n  \
  \  if viewport_state:\n        viewportWidth = int(viewport_state.current_pixel_width)\n\
  \        viewportHeight = int(viewport_state.current_pixel_height)\n    boxHeight\
  \ = int(viewportHeight / 90)\n    boxWidth = int(viewportWidth / 52)\n    zone1\
  \ = []\n    for z1 in range(0, yearsLived):\n        zone1.append(\"@C1\")\n   \
  \ zone2 = []\n    for z2 in range(0, 52):\n        if z2 <= weeksInYear:\n     \
  \       zone2.append(\"@C1\")\n        else:\n            zone2.append(\"@C0\")\n\
  \    zone3 = []\n    for z3 in range(yearsLived + 1, 90):\n        zone3.append(\"\
  @C0\")\n    dataset = {\n        \"data\": {\n            \"type\": \"object\",\n\
  \            \"properties\": {\n                \"zone1\": zone1,\n            \
  \    \"zone2\": zone2,\n                \"zone3\": zone3,\n                \"zone1Height\"\
  : boxHeight * yearsLived,\n                \"zone2Height\": boxHeight,\n       \
  \         \"zone3Height\": boxHeight * (90 - yearsLived - 1),\n                \"\
  totalWidth\": 32 * 52,\n                \"totalHeight\": 32 * 90,\n            \
  \    \"boxHeight\": boxHeight,\n                \"boxWidth\": boxWidth,\n      \
  \          \"rowWidth\": boxWidth * 52\n            }\n        }\n    }\n    logger.info(f\"\
  数据: {dataset}\")\n```\n\n创建好最终数据集后，我们需要将其封装到 Response Builder 中，并返回一个 Response 对象。\n\
  \n\n\n#### 返回渲染后的 APL 和响应\n\n在我们的标准意图处理程序中，`Response` 对象由以下代码行创建：\n\n```\nreturn\
  \ (\nhandler_input.response_builder\n.speak(speak_output)\n.ask(speak_output)\n\
  .response\n)\n```\n\n我们可以将其拆分，并将 `response_builder` 移到单独的一行，如下所示：\n\n```\nrb = handler_input.response_builder\n\
  ...\nreturn (\nrb\n.speak(speak_output)\n.ask(speak_output)\n.response\n)\n```\n\
  \n这样，如果存在屏幕，我们就可以将 `RenderApl` 指令添加到响应构建器中。因此，在 `if ask_utils.get_supported_interfaces(handler_input)`\
  \ 之前，我们需要放置 `rb = handler_input.response_builder`。然后，在 `logger.info(f\"Data: {dataset}\"\
  )` 这一行之后，我们需要添加以下内容：\n\n```\nrb.add_directive(\nRenderApl(\ntoken = CALENDAR_TOKEN,\n\
  document = load_apl_document(calendarPath),\ndatasources = dataset\n)\n)\n```\n\n\
  此指令需要在模块顶部、导入语句之后插入几行代码。\n\n```\ncalendarPath = \"90-year week calendar APL.json\"\
  \nCALENDAR_TOKEN = \"CalendarToken\"\n```\n\n它需要一个新的导入：\n\n```\nfrom ask_sdk_model.interfaces.alexa.presentation.apl\
  \ import RenderDocumentDirective as RenderApl\n```\n\n并且需要这个工具函数：\n\n```\ndef load_apl_document(file_path):\n\
  \"\"\"将指定路径的 apl json 文档加载到字典对象中。\"\"\"\nc = os.getcwd()\nlogger.info(f\"CWD: {c}\"\
  )\nwith open(file_path) as f:\nreturn json.load(f)\n```\n\n最后，我们需要从响应构建器返回响应对象，如下所示：\n\
  \n```\nreturn (\nrb\n.speak(speak_output)\n#.ask(\"您想个性化您的日历吗？\")\n.set_should_end_session(True)\n\
  .response\n)\n```\n\n请注意，目前我们将 `set_should_end_session` 设置为 `True`，而不是询问用户是否想要个性化他们的日历。在后面的章节中，我们将切换这些设置。\n\
  \n完成后的 `GiveBirthdayIntentHandler` 将如下所示：\n\n```\nclass GiveBirthdayIntentHandler(AbstractRequestHandler):\n\
  \"\"\"GiveBirthday 意图的处理程序。\"\"\"\ndef can_handle(self, handler_input):\nreturn\
  \ ask_utils.is_intent_name(\"GiveBirthday\")(handler_input)\ndef handle(self, handler_input):\n\
  bday_str = handler_input.request_envelope.request.intent.slots[\"birthday\"].value\n\
  logger.info(f\"生日: {bday_str}\")\nbday, _, _, _ = period_from_amazon_date(bday_str)\n\
  today = datetime.today()\ndday = addYears(bday, 90)\nlived = days_between(bday,\
  \ today)\nweeksLived = round(lived / 7.0, 1)\nlife = days_between(bday, dday)\n\
  weeksLife = round(life / 7.0, 1)\nremain = days_between(today, dday)\nweeksRemain\
  \ = round(remain / 7.0, 1)\nlivedPercent = round(lived / life * 100.0, 1)\nyearsLived\
  \ = int(weeksLived / 52)\nweeksInYear = int(weeksLived % 52)\nspeak_output = f\"\
  \"\"您的生日是: {bday}。如果您活到 90 岁，\n您已经度过了 {livedPercent}% 的人生。\n也就是说，在您 90 年寿命中的 {weeksLife}\
  \ 周里，您已经度过了 {weeksLived} 周，还剩 {weeksRemain} 周。\"\"\"\nlogger.info(f\"语音: {speak_output}\"\
  )\nhandler_input.attributes_manager.session_attributes[\"last_speech\"] = speak_output\n\
  rb = handler_input.response_builder\nif ask_utils.get_supported_interfaces(handler_input)\
  \ \\\n.alexa_presentation_apl is not None:\nlogger.info(\"APL 已启用\")\nviewportWidth\
  \ = 0\nviewportHeight = 0\nviewport_state = handler_input.request_envelope.context.viewport\n\
  if viewport_state:\nviewportWidth = int(viewport_state.current_pixel_width)\nviewportHeight\
  \ = int(viewport_state.current_pixel_height)\nboxHeight = int(viewportHeight / 90)\n\
  boxWidth = int(viewportWidth / 52)\nzone1 = []\nfor z1 in range(0, yearsLived):\n\
  zone1.append(\"@C1\")\nzone2 = []\nfor z2 in range(0, 52):\nif z2 <= weeksInYear:\n\
  zone2.append(\"@C1\")\nelse:\nzone2.append(\"@C0\")\nzone3 = []\nfor z3 in range(yearsLived\
  \ + 1, 90):\nzone3.append(\"@C0\")\ndataset = {\n\"data\": {\n\"type\": \"object\"\
  ,\n\"properties\": {\n\"zone1\": zone1,\n\"zone2\": zone2,\n\"zone3\": zone3,\n\"\
  zone1Height\": boxHeight * yearsLived,\n\"zone2Height\": boxHeight,\n\"zone3Height\"\
  : boxHeight * (90 - yearsLived - 1),\n\"totalWidth\": 32 * 52,\n\"totalHeight\"\
  : 32 * 90,\n\"boxHeight\": boxHeight,\n\"boxWidth\": boxWidth,\n\"rowWidth\": boxWidth\
  \ * 52\n}\n}\n}\nlogger.info(f\"数据: {dataset}\")\nrb.add_directive(\nRenderApl(\n\
  token = CALENDAR_TOKEN,\ndocument = load_apl_document(calendarPath),\ndatasources\
  \ = dataset\n)\n)\nreturn (\nrb\n.speak(speak_output)\n#.ask(\"您想个性化您的日历吗？\")\n\
  .set_should_end_session(True)\n.response\n)\n```\n\n完成 lambda 函数还需要最后一项活动。我们需要定义\
  \ Skill Builder 对象。\n\n### 定义 Skill Builder\n\n现在我们已经定义了导入、工具函数、常量和意图处理程序类，还需要编写一段必需的代码。我们需要定义\
  \ Skill Builder。Skill Builder 是技能的入口点，负责将意图和请求路由到正确的处理程序。每个意图/请求处理程序都会被添加到 Skill\
  \ Builder 中，最后是意图反射器和捕获所有异常的处理程序。完成后的 Skill Builder 随后会绑定到 AWS Lambda 处理程序。Skill\
  \ Builder 的代码如下所示：\n\n```\n# SkillBuilder 对象充当技能的入口点，将所有请求和响应\n# 负载路由到上面的处理程序。确保您定义的任何新处理程序或拦截器\n\
  # 都包含在下面。顺序很重要——它们会从上到下处理。\nsb = SkillBuilder()\nsb.add_request_handler(LaunchRequestHandler())\n\
  sb.add_request_handler(GiveBirthdayIntentHandler())\nsb.add_request_handler(StartOverIntentHandler())\n\
  sb.add_request_handler(HelpIntentHandler())\nsb.add_request_handler(CancelOrStopIntentHandler())\n\
  sb.add_request_handler(SessionEndedRequestHandler())\nsb.add_request_handler(RepeatIntentHandler())\n\
  sb.add_request_handler(FallbackIntentHandler())\n# 确保 IntentReflectorHandler 和 CatchAllExceptionHandler\n\
  # 放在最后，这样它们就不会覆盖您的自定义意图处理程序\nsb.add_request_handler(IntentReflectorHandler())\n\
  sb.add_exception_handler(CatchAllExceptionHandler())\nlambda_handler = sb.lambda_handler()\n\
  ```\n\n朋友们，这代码量可真不少。关于完整的模块，请参阅本章附带的代码。\n\n### 总结\n\n在本章中，我们编写了代码，将 VUI 意图和 APL\
  \ 视觉效果与我们用来表示 90 年日历中每年周数的数据绑定在一起。我们在 AWS 中定义了 lambda 函数，并添加了意图处理程序和技能构建器，使 Alexa\
  \ 技能能够工作。我们已经准备好进行一些单元测试来验证我们的代码，并确保其正确运行。在下一章中，我们将手动和以编程方式测试我们的 Alexa 技能。\n\n脚注\
  \ 1\n\n## 12. 单元测试 Alexa 技能\n\n在上一章中，我们编写了作为技能后端的 lambda 函数代码。在本章中，我们将学习一些对该代码进行单元测试的方法，以确保其按预期工作。\n\
  \n对于一个小型技能来说，单元测试的主要方法很可能是手动测试。但是，随着技能的增长，您会希望自动化部分测试。手动测试有几个阶段。首先，确保 lambda 函数能够编译并正常工作。其次，确保用户话语能够解析为正确的意图。第三，确保您的技能在与您交互时能正常工作。\n\
  \n### 单元测试 Lambda 函数\n\n在创建 lambda 函数的过程中，我们可能本应一直在进行单元测试。这种技术被称为测试驱动开发（TDD）。TDD\
  \ 是指在创建代码的同时创建单元测试。和太多程序员一样，我们把测试留到了最后。但并非全无希望。对于 lambda 函数，我们仍然可以向代码中添加单元测试。\n\n\
  \n\n#### 对启动意图进行单元测试\n\n首先，你需要在 Lambda 控制台中找到 `Test` 按钮。\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig1_HTML.jpg](img/504229_1_En_12_Fig1_HTML.jpg)\n\
