  \n**图 12-20** Alexa 查看器中渲染的 APL\n\n尝试几个不同的日期，看看语音和视觉内容如何变化。\n\n现在后端 lambda 函数已经正常运行，我们需要确保\
  \ Alexa 能够理解用户所说的话。为此，我们可以使用话语分析器。\n\n\n\n### 使用话语分析器\n\n单元测试的另一个工具是话语分析器。它位于 Alexa\
  \ 开发者控制台的“构建”选项卡中，允许你创建测试，以查看各种话语会匹配到哪个意图。需要理解的是，话语分析器仅测试 Alexa 解释话语、匹配意图并填充槽位值的能力。所有这些操作都不需要调用\
  \ lambda 函数。然而，许多话语结果会促使你重新思考 lambda 函数如何接收输入以及如何处理误解。\n\n在设计技能意图时，在合理范围内，你提供的示例话语越多，Alexa\
  \ 就越能更好地匹配它们并找到正确的意图。例如，在“给出生日”意图中，我们列出了四个示例话语，如图 12-21 所示。\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig21_HTML.jpg](img/504229_1_En_12_Fig21_HTML.jpg)\n\
  \n图 12-21\n\n“给出生日”意图的示例话语\n\n通过点击右上角的*评估模型*按钮，你可以测试话语，看看 Alexa 如何解释用户说的话。例如，如果用户说“I\
  \ was born on 1/1/75”，Alexa 会听到“I was born on 1 1 75”。注意，Alexa 并没有将日期“1/1/75”解释为一个日期，而是将其听成三个数字的序列：一、一和七十五。见图\
  \ 12-22。\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig22_HTML.jpg](img/504229_1_En_12_Fig22_HTML.jpg)\n\
  \n图 12-22\n\n话语分析器及一个示例话语\n\n这些数字都包含在 `{birthday}` 的槽位值中，但它们很可能会破坏我们现有的代码，因为我们要求槽位值是一个日期：\n\
  \n```\nbday_str = handler_input.request_envelope.request.intent.slots [\"birthday\"\
  ].value\nlogger.info(f\"Birthday: {bday_str}\")\nbday, _, _, _ = period_from_amazon_date(bday_str)\n\
  ```\n\n这表明我们应该修改 `period_from_amazon_date` 函数中的代码，使其能够将三个数字的序列理解为一个日期。\n\n在话语分析器中尝试其他一些日期：\n\
  \n| 话语 | 槽位值 |\n| --- | --- |\n| I was born on 1 1 75 | one one seventy-five |\n\
  | I was born on Jan 1 75 | 2022-01-01 |\n| I was born on Jan 1 1975 | 1975-01-01\
  \ |\n| I was born on 1 1 2000 | 2000 |\n| I was born in 1975\\. January the first\
  \ 1975. | 1975-01-01 |\n| I was born in Colorado Springs Colorado on June fifth\
  \ 1962 | 1962-06-05 |\n\n注意，有时 Alexa 能从话语中推断出正确的日期，有时则不能。注意第四条话语，你可能会期望它得到“one one\
  \ two thousand”，但实际上槽位值却是“2000”。因此，我们的意图处理器应该编码为能够处理部分日期，并重新提示用户提供完整日期。假设我们想要重复测试，也许是在修改了\
  \ lambda 函数中的意图处理器之后。在这种情况下，我们应该将使用的话语设置为一个注释集，以便在 NLU（自然语言理解）评估工具中使用。\n\n#### NLU\
  \ 评估\n\n从话语分析器中，选择 *NLU 评估* 选项卡。这将允许你创建一个注释集，该注释集可以作为一组话语通过话语分析器运行，从而显著提高开发者的生产力。例如，我们可以将上一节中的所有话语放入一个注释集中。见图\
  \ 12-23。\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig23_HTML.png](img/504229_1_En_12_Fig23_HTML.png)\n\
  \n图 12-23\n\n添加到注释集中的话语\n\n可选的*参考时间戳*列用于日期槽位。它提供了当话语包含相对日期术语（例如“昨天”、“六个月前”和“二十四年前的今天”）时要使用的日期和时间。\n\
  \n输入注释集后，点击屏幕顶部的*保存注释集*按钮。保存后，点击“评估模型”按钮，然后点击“运行评估”按钮。模型会失败，因为有几个话语没有产生我们想要的槽位值。（见图\
  \ 12-24。）\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig24_HTML.jpg](img/504229_1_En_12_Fig24_HTML.jpg)\n\
  \n图 12-24\n\nNLU 评估显示测试失败\n\n通过点击评估 ID，你可以深入查看测试运行的详细信息以及失败的话语，如图 12-25 所示。\n\n\
  ![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig25_HTML.png](img/504229_1_En_12_Fig25_HTML.png)\n\
  \n图 12-25\n\nNLU 测试详情\n\n注意，在图 12-25 中，测试 #7 失败了，因为期望值是 1975-01-01，而实际值是 [ ]，即空白。空白在\
  \ NLU 注释集中不是有效值，而话语分析器说实际值应该是“one one seventy-five”。这两个值都不起作用。然而，我们希望 Alexa 能将“1\
  \ 1 75”理解为一个日期。为此，我们可能需要创建一个新的意图，该意图接受一个多值槽位，能够听到“1 1 75”并将其解释为三个数字。lambda 函数中会有一个新的意图处理器来处理这个新意图和新的槽位值。\n\
  \n一旦创建了注释集，你就需要开始请朋友们“告诉我你的生日”，并观察他们的回答。看看这些回答如何融入你的话语中。如果你询问时，朋友说“On Jan 1 1975\
  \ I was born”，考虑将其作为一条话语添加到你的 NLU 注释集中，并查看 Alexa 是否能理解它。如果不能，则相应地修改意图话语，或者可能创建一个具有完全不同槽位的新意图。\n\
  \n测试的下一步是向 Alexa 发送语音录音，看看她的表现如何。\n\n\n\n#### ASR 评估\n\n`ASR`（自动语音识别）评估是一个强大的测试工具。它允许你创建一组录音（格式为\
  \ `MP3`、`WAV`、`OGG` 或 `AIFF` 文件），并将其作为`标注集`上传。或者，你也可以直接在测试中录制语音。无论哪种方式，Alexa 都会收听这些录音并进行解读，然后与你预期的转录文本进行匹配。这是测试各种语音（例如男性、女性、来自不同文化背景、带有不同口音等）的绝佳方法，并能查看\
  \ Alexa ASR 评估器如何识别它们。\n\n要创建一个简单的`ASR 标注集`，请选择`ASR 评估`选项卡，为`标注集`命名，然后按住按钮录制一些上述语音。为每条语音分配一个\
  \ 1 到 10 的`权重`。数值越高，表示该语音越重要。（见图 12-26。）别忘了经常保存`标注集`。\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig26_HTML.png](img/504229_1_En_12_Fig26_HTML.png)\n\
  \n图 12-26\n\nASR 测试的录制语音\n\n然后点击`评估模型`按钮，并选择`ASR`选项卡来测试录制的语音。（见图 12-27。）\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig27_HTML.jpg](img/504229_1_En_12_Fig27_HTML.jpg)\n\
  \n图 12-27\n\nASR 评估\n\n接着，点击`评估 ID` 查看详细信息。（见图 12-28。）\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig28_HTML.jpg](img/504229_1_En_12_Fig28_HTML.jpg)\n\
  \n图 12-28\n\n失败的 ASR 测试\n\n看来我们需要稍微调整一下语音语法。让我们将`标注集`文本改为小写，并去掉标点符号等。（见图 12-29。）\n\
  \n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig29_HTML.jpg](img/504229_1_En_12_Fig29_HTML.jpg)\n\
  \n图 12-29\n\n修订后的标注集\n\n太好了！ASR 测试现在通过了。（见图 12-30 和 12-31。）\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig31_HTML.jpg](img/504229_1_En_12_Fig31_HTML.jpg)\n\
  \n图 12-31\n\nASR 测试通过的测试详情\n\n![../images/504229_1_En_12_Chapter/504229_1_En_12_Fig30_HTML.jpg](img/504229_1_En_12_Fig30_HTML.jpg)\n\
  \n图 12-30\n\nASR 测试通过\n\n一旦你录制了 ASR 测试并且评估通过，你就可以将 ASR 文本导出到`NLU 标注集`，并自动在那里测试这些语音。\n\
  \n所以，给你的朋友和亲戚发一个简短的脚本，请他们录制一批语音。编辑并拆分他们发给你的文件，确保每个文件只包含一条语音。将所有文件打包成 zip 并上传到一个`ASR\
  \ 标注集`中。保存并运行测试。调整文本直到你满意为止。然后将这些文本导出到`NLU 标注集`。填写预期的值。保存并运行这些测试。接着，修改并添加 Lambda\
  \ 意图处理器来处理 NLU 标注。\n\n当你的技能上线后，你可以使用意图历史记录（在`构建`选项卡中）中显示的语音作为测试标注的来源。这让你能够测试用户在实际使用中说的语音的准确性。请使用`交互`类型为`MODAL`且`对话行为`列为空的语音。（注意：要让你的技能显示`意图历史记录`，你需要在一天内至少有十个活跃用户。）\n\
  \n至此，我们将暂时放下单元测试，转而学习如何操作事件数据，以追踪我们 90 年日历用户的生活事件。\n\n### 总结\n\n在本章中，我们学习了为 Alexa\
  \ 技能进行单元测试的几种不同方法。首先，我们使用了 Lambda 函数中的内置测试来确保代码能够编译、运行并启动技能。然后，我们使用 Alexa 模拟器进一步测试技能并进入意图处理器。接着，我们结合了这两种方法，从\
  \ Alexa 模拟器中获取 Json 并在 Lambda 函数测试中使用它，以查找并修复出现的错误。最后，我们学习了通过为`NLU`和`ASR`测试评估创建`标注集`来进行语音测试。在下一章中，我们将学习如何创建和存储生活事件，以丰富我们的\
  \ 90 年日历。\n\n## 13. 存储数据\n\n到目前为止，我们已经创建了一个可运行的 Alexa 技能，它可以询问你的出生日期，告诉你一些有趣的信息，并在有屏幕的设备上绘制一个\
  \ 90 年日历。现在，我们将在此基础上，为用户增加在其生活中添加个人事件的能力——例如出生、死亡、结婚、离婚、教育和工作变动。我们已经为生活事件创建了意图和一些示例语音。（见图\
  \ 13-1。）\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig1_HTML.png](img/504229_1_En_13_Fig1_HTML.png)\n\
  \n图 13-1\n\n生活事件的 Botmock 图表和生成的意图\n\n在本章中，我们将编写一些代码来让这些意图生效，但重点将放在将用户的响应存储在数据库中。\n\
  \n### 账户关联与访问令牌\n\n为了存储用户的响应，我们需要知道用户是谁，这就是我们在第 7 章中开启账户关联的原因。此时，我们需要执行以下操作：\n\n\
  1.  检查账户是否已关联。\n2.  如果已关联，询问他们是否要向日历添加事件。\n3.  如果未关联，让他们创建一个标准的 90 年日历。\n\n首先，我们需要将我们的开发账户关联到技能。\n\
  \n#### 关联你的开发账户\n\n为了测试账户关联，你需要多次关联和取消关联你的开发账户。你需要关联的是你登录 Alexa 开发者控制台的账户，而不是你登录\
  \ AWS Lambda 的账户。关联账户的操作是在手机上的 Alexa 应用中完成的，步骤如下：\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig2_HTML.png](img/504229_1_En_13_Fig2_HTML.png)\n\
  \n图 13-2\n\n选择“更多”\n\n1.  打开手机上的 Alexa 应用，选择`更多`选项卡（图 13-2）。\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig3_HTML.png](img/504229_1_En_13_Fig3_HTML.png)\n\
  \n图 13-3\n\n选择“开发技能”\n\n1.  选择`技能与游戏`。\n2.  选择`你的技能`。\n3.  横向滑动找到`开发`技能（图 13-3）。\n\
  \n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig4_HTML.png](img/504229_1_En_13_Fig4_HTML.png)\n\
  \n图 13-4\n\n选择“设置”\n\n1.  选择`90 年日历`技能。\n2.  选择`设置`（图 13-4）。\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig5_HTML.png](img/504229_1_En_13_Fig5_HTML.png)\n\
  \n图 13-5\n\n选择“关联账户”\n\n1.  选择`关联账户`（图 13-5）。\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig6_HTML.png](img/504229_1_En_13_Fig6_HTML.png)\n\
  \n图 13-6\n\n点击“完成”\n\n1.  使用你的 Alexa 开发者控制台账户登录。\n2.  选择`完成`（图 13-6）。\n\n要取消关联账户，请禁用该技能。然后重新启用技能，以便继续测试。\n\
  \n关联账户后，你就可以看到`访问令牌`了。\n\n\n\n#### 检查账户是否已关联\n\n当账户未关联时，Launch 请求的 JSON 中会包含一个 `userId`。如果账户已关联，您将同时获得\
  \ `userId` 和 `accessToken`。您可以通过 Alexa 开发者控制台的“测试”选项卡查看 Launch 请求的 JSON。（见图 13-7）。只需在\
  \ Alexa 模拟器中输入“90 kilo”即可启动技能。\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig7_HTML.png](img/504229_1_En_13_Fig7_HTML.png)\n\
  \n图 13-7\n\n获取 Launch 请求 JSON\n\nLaunch 请求 JSON 中有很多配置选项，但我们真正需要关注的是 `context/System/user/accessToken`：\n\
  \n```\n{\n\"version\": \"1.0\",\n\"session\": { },\n\"context\": {\n\"Viewports\"\
  : [ ],\n\"System\": {\n\"application\": {\n\"applicationId\": \"amzn1.ask.skill.1111111-2222-3333-4444-5555555\"\
  \n},\n\"user\": {\n\"userId\": \"amzn1.ask.account.XXXXXXXXXX\",\n\"accessToken\"\
  : \"Atza|AAAAAABBBBBBCCCCCC\"\n},\n\"device\": { },\n\"apiEndpoint\": \"https://api.amazonalexa.com\"\
  ,\n\"apiAccessToken\": \"zzzzzzzzzz.yyyyyyyyyy.xxxxxxxxxx\"\n}\n},\n\"request\"\
  : { }\n}\n```\n\n**注意：** 在 `session` 标签中也存在一个额外的 `user` 块。但那不是我们需要的。我们要找的是 `System/user/accessToken`，而不是\
  \ `System/apiAccessToken`。\n\n现在，我们可以在 lambda 函数中编写用于获取 Access Token 的函数。\n\n####\
  \ 获取 Access Token\n\n从 handler 输入中提取 Access Token 应该封装成一个函数，这样我们只需在一个地方编写该表达式。（这是一种称为\
  \ DRY——Don’t Repeat Yourself——的编码原则）。为了保持代码整洁，请将 Get Access Token 函数与本章中所有其他持久化代码一起放在一个新模块中。为此，请在\
  \ lambda 函数中创建一个名为 `dynamodb.py` 的新文件。（见图 13-8）。\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig8_HTML.jpg](img/504229_1_En_13_Fig8_HTML.jpg)\n\
  \n图 13-8\n\n将 `dynamodb.py` 文件添加到 lambda 函数项目中\n\n用于检查是否拥有 Access Token 的函数如下：\n\
  \n```\ndef has_access_token(handler_input):\n    reqEnv = handler_input.request_envelope\n\
  \    if reqEnv.context.system.user.access_token:\n        return True\n    else:\n\
  \        return False\n```\n\n有几个地方我们需要检查账户是否已关联，即是否拥有 `accessToken`。第一个地方是在 Launch\
  \ Intent 处理器中。由于我们向所有人提供基础日历，并且只需要关联账户来存储额外的日历事件，因此我们需要为用户提供关联账户的选项。这设置了三种可能的 Launch\
  \ Intent 处理器：\n\n1.  账户未关联（访客用户）。\n2.  账户刚刚关联（新用户）。\n3.  账户已关联，并且我们已存储了用户的个人资料（老用户）。\n\
  \n我们不仅需要知道账户是否已关联（即 `has_access_token()` 是否为 `True`），还需要知道我们是否已经存储了用户个人资料。这需要检查用户是否存在于我们的数据库中。如果不存在，则说明这是一个新用户账户，刚刚完成关联。如果存在，则说明是回访用户。为了测试令牌的有效性，我们需要返回四种状态之一：无令牌、新令牌、有效令牌或错误状态。在\
  \ `dynamodb.py` 文件中，添加以下枚举：\n\n```\nfrom enum import Enum\n\nclass AccessTokenValidity(Enum):\n\
  \    NONE = 1\n    VALID = 2\n    NEW = 3\n    ERROR = 4\n```\n\n添加此代码后，*保存*两个模块并*部署*它们。然后运行我们在第\
  \ 12 章中创建的 Launch 测试。您应该会看到欢迎响应。如果没有，请先修复错误再继续。这是单元测试的好处之一；您可以经常运行它们以确保您的更改没有错误。\n\
  \n在下一节中，我们将使用 Alexa 持久化适配器来访问我们的数据库。\n\n### 从 DynamoDB 获取用户个人资料\n\n在第 7 章中，我们设置了一个\
  \ DynamoDB 表用于存储用户个人资料。在编写访问该数据库的代码之前，我们应该启用日志记录。这可以通过在 `dynamodb.py` 模块中添加以下代码快速完成：\n\
  \n```\nimport logging\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n\
  ```\n\n这将允许我们向数据库函数添加日志记录，以查看其内部运行情况。\n\n接下来，我们需要添加代码来初始化 DynamoDB 持久化适配器，如下所示：\n\
  \n```\nfrom ask_sdk_dynamodb.adapter import DynamoDbAdapter\nadapter = DynamoDbAdapter('CalendarItem',\
  \ partition_key_name=\"PersonId\")\n```\n\n现在，我们可以创建一个从数据库读取用户个人资料的函数：\n\n```\n\
  def read_user_profile(handler_input):\n    validity = AccessTokenValidity.NONE\n\
  \    attr = []\n    hasAccessToken = has_access_token(handler_input)\n    logger.info(f\"\
  AccToken: {hasAccessToken}, Response: {attr}\")\n    if hasAccessToken:\n      \
  \  amgr = handler_input.attributes_manager\n        attr = amgr.persistent_attributes\n\
  \        if attr:\n            logger.info(f\"{attr}\")\n            validity =\
  \ AccessTokenValidity.VALID\n            if type(attr[\"Birthday\"]) == str:\n \
  \               attr[\"Birthday\"] = datetime.fromisoformat(attr[\"Birthday\"])\n\
  \        else:\n            validity = AccessTokenValidity.NEW\n    else:\n    \
  \    validity = AccessTokenValidity.NONE\n    return validity, attr\n```\n\n最后，我们需要处理持久化错误。这可以通过将上述代码包裹在\
  \ `try…except` 块中来实现，如下所示：\n\n```\nfrom ask_sdk_core.exceptions import PersistenceException\n\
  from datetime import datetime\n\ndef read_user_profile(handler_input):\n    validity\
  \ = AccessTokenValidity.NONE\n    attr = []\n    try:\n        hasAccessToken =\
  \ has_access_token(handler_input)\n        logger.info(f\"AccToken: {hasAccessToken}\"\
  )\n        if hasAccessToken:\n            amgr = handler_input.attributes_manager\n\
  \            attr = amgr.persistent_attributes\n            if attr:\n         \
  \       logger.info(f\"{attr}\")\n                validity = AccessTokenValidity.VALID\n\
  \                if type(attr[\"Birthday\"]) == str:\n                    attr[\"\
  Birthday\"] = datetime.fromisoformat(attr[\"Birthday\"])\n            else:\n  \
  \              validity = AccessTokenValidity.NEW\n        else:\n            validity\
  \ = AccessTokenValidity.NONE\n    except PersistenceException as e:\n        logger.error(e)\n\
  \        validity = AccessTokenValidity.ERROR\n        #TODO: 优雅地处理 PersistenceExceptions\n\
  \    except Exception as e:\n        logger.error(e)\n        validity = AccessTokenValidity.ERROR\n\
  \        raise e\n    return validity, attr\n```\n\n添加此代码后，*保存*两个模块并*部署*它们。然后运行我们在第\
  \ 12 章中创建的 Launch 测试。您应该会看到欢迎响应。如果没有，请先修复错误再继续。\n\n现在，我们已经知道令牌是否存在且有效，可以利用这些信息来决定在\
  \ Launch 请求处理器中向用户说什么。\n\n\n\n#### 三个启动请求处理器\n\n现在我们已经能够读取用户资料，就可以在需要时创建额外的启动请求处理器。具体来说，当账户未关联、刚刚关联以及已关联并保存了资料时，我们需要不同的启动请求处理器。\n\
  \n切换到 `lambda_function.py` 模块，添加以下代码行，从 `dynamodb.py` 模块导入所需功能：\n\n```\nfrom dynamodb\
  \ import adapter, read_user_profile, AccessTokenValidity, has_access_token\n```\n\
  \n现在修改原有的 `LaunchRequestHandler()`。将其重命名为 `LaunchRequestHandlerUnlinked()`，并修改 `can_handle()`\
  \ 方法如下：\n\n```\ndef can_handle(self, handler_input):\n    return not has_access_token(handler_input)\
  \ and ask_utils.is_request_type(\"LaunchRequest\")(handler_input)\n```\n\n在 `handle()`\
  \ 方法中，修改 `speak_output` 并添加一个名为 `\"question\"` 的新属性，如下所示：\n\n```\ndef handle(self,\
  \ handler_input):\n    speak_output = \"\"\"欢迎！如果您关联账户，就可以个性化您的日历。\n现在要关联吗？\n如果不关联，只需告诉我您的生日，我会告诉您一些有趣的事情。\"\
  \"\"\n    handler_input.attributes_manager.session_attributes[\"question\"] = \"\
  LinkAccount\"\n    handler_input.attributes_manager.session_attributes[\"last_speech\"\
  ] = speak_output\n```\n\n完成后的 `LaunchRequestHandlerUnlinked()` 将如下所示：\n\n```\nclass\
  \ LaunchRequestHandlerUnlinked(AbstractRequestHandler):\n    \"\"\"账户未关联时的技能启动处理器。\"\
  \"\"\n    def can_handle(self, handler_input):\n        return not has_access_token(handler_input)\
  \ and ask_utils.is_request_type(\"LaunchRequest\")(handler_input)\n\n    def handle(self,\
  \ handler_input):\n        speak_output = \"\"\"欢迎。如果您关联账户，就可以个性化您的日历。\n现在要关联吗？\n\
  如果不关联，只需告诉我您的生日，我会告诉您一些有趣的事情。\"\"\"\n        handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"LinkAccount\"\n        handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n        return (\n            handler_input.response_builder\n\
  \            .speak(speak_output)\n            .ask(speak_output)\n            .response\n\
  \        )\n```\n\n接下来，为账户刚刚关联的情况添加一个启动请求处理器。我们将其命名为 `LaunchRequestHandlerNew()`：\n\
  \n```\nclass LaunchRequestHandlerNew(AbstractRequestHandler):\n    \"\"\"账户刚刚关联时的技能启动处理器。\"\
  \"\"\n    def can_handle(self, handler_input):\n        validity, profile = read_user_profile(handler_input)\n\
  \        return (validity == AccessTokenValidity.NEW) and ask_utils.is_request_type(\"\
  LaunchRequest\")(handler_input)\n\n    def handle(self, handler_input):\n      \
  \  speak_output = \"欢迎新用户！告诉我您的生日，我会告诉您一些有趣的事情。\"\n        handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n        return (\n            handler_input.response_builder\n\
  \            .speak(speak_output)\n            .ask(speak_output)\n            .response\n\
  \        )\n```\n\n现在添加第三个启动请求处理器，用于我们已经拥有有效令牌和用户资料的情况：\n\n```\nclass LaunchRequestHandlerValid(AbstractRequestHandler):\n\
  \    \"\"\"已知道生日时的技能启动处理器。\"\"\"\n    def can_handle(self, handler_input):\n   \
  \     validity, profile = read_user_profile(handler_input)\n        return (validity\
  \ == AccessTokenValidity.VALID) and ask_utils.is_request_type(\"LaunchRequest\"\
  )(handler_input)\n\n    def handle(self, handler_input):\n        speak_output =\
  \ \"欢迎回来！您可以添加事件或查看您的 90 年日历。您想做什么？\"\n        handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n        return (\n            handler_input.response_builder\n\
  \            .speak(speak_output)\n            .ask(speak_output)\n            .response\n\
  \        )\n```\n\n定义了这三个启动请求处理器后，我们需要修改 `lambda_function.py` 模块底部的 `SkillBuilder()`\
  \ 代码。请记住，每当您添加或修改请求处理器时，都必须更新 `SkillBuilder()` 代码。我们将把以下代码：\n\n```\nfrom ask_sdk_core.skill_builder\
  \ import SkillBuilder\n...\nsb = SkillBuilder()\nsb.add_request_handler(LaunchRequestHandler())\n\
  ```\n\n修改为：\n\n```\nfrom ask_sdk_core.skill_builder import CustomSkillBuilder\n\
  ...\nsb = CustomSkillBuilder(persistence_adapter=adapter)\nsb.add_request_handler(LaunchRequestHandlerUnlinked())\n\
  sb.add_request_handler(LaunchRequestHandlerNew())\nsb.add_request_handler(LaunchRequestHandlerValid())\n\
  ```\n\n请注意导入语句和声明的更改，现在使用的是 `CustomSkillBuilder` 而不是 `SkillBuilder`。\n\n#### 添加“是”意图处理器\n\
  \n在 `LaunchRequestHandlerUnlinked()` 中，我们询问用户：“现在要关联吗？”如果他们回答“是”，这将触发“是”意图，因此我们需要添加一个\
  \ `YesIntentHandler()`。它将检查 `\"Question\"` 属性的值，以便了解“是”意图的上下文。\n\n首先定义类以及 `can_handle`\
  \ 和 `handle` 方法：\n\n```\nclass YesIntentHandler(AbstractRequestHandler):\n    \"\
  \"\"“是”意图的处理器。\"\"\"\n    def can_handle(self, handler_input):\n        # type:\
  \ (HandlerInput) -> bool\n        return ask_utils.is_intent_name(\"AMAZON.YesIntent\"\
  )(handler_input)\n\n    def handle(self, handler_input):\n```\n\n然后获取 `\"Question\"\
  ` 属性的值：\n\n```\nquestion = handler_input.attributes_manager.session_attributes[\"\
  question\"]\n```\n\n如果问题值是 `\"LinkAccount\"`，我们需要在 Alexa 应用中打开一张卡片。\n\n##### 在响应中使用卡片\n\
  \nAlexa 应用中有几种不同类型的卡片。它们通常用于汇总一组值。例如，卡片可以显示股票价格。另一种卡片可以显示当天的天气预报。卡片会显示在 Alexa 设备上（如果有屏幕）或用户智能手机上的\
  \ Alexa 应用中。\n\n当您想指示用户设置账户关联时，您将使用一种名为 `LinkAccountCard` 的特殊卡片通知。此卡片会在响应中返回，以便\
  \ Alexa 应用引导用户关联其账户。实现此功能的代码如下：\n\n```\ncard_output = ui.link_account_card.LinkAccountCard()\n\
  ...\nreturn (\n    handler_input.response_builder\n    .set_card(card_output)\n\
  \    ...\n)\n```\n\n我们需要检查 `question` 变量的值是否为 `\"LinkAccount\"`，然后按前面所示使用卡片。以下是\
  \ `handle()` 方法的完整代码：\n\n```\ndef handle(self, handler_input):\n    question = handler_input.attributes_manager.session_attributes[\"\
  question\"]\n    # 初始化响应变量\n    speak_output = \"\"\n    endSession = False\n  \
  \  card_output = None\n\n    if question == \"LinkAccount\":\n        # 处理 LinkAccount\
  \ 响应\n        speak_output = \"好的，我已经向 Alexa 应用发送了一些信息。打开您的 Alexa 应用，点击链接以关联您的账户。\"\
  \n        endSession = True\n        card_output = ui.link_account_card.LinkAccountCard()\n\
  \    else:\n        # 处理未设置问题值时的“是”响应\n        speak_output = \"抱歉，我有点困惑，请告诉我您想做什么或说“帮助”。\"\
  \n        endSession = False\n\n    handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n    # 清除问题属性\n    handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"\"\n\n    return (\n        handler_input.response_builder\n   \
  \     .speak(speak_output)\n        .ask(speak_output)\n        .set_card(card_output)\n\
  \        .set_should_end_session(endSession)\n        .response\n    )\n```\n\n\
  当然，我们还需要在模块底部的 Skill Builder 中添加“是”意图请求处理器：\n\n```\nsb = CustomSkillBuilder(persistence_adapter=adapter)\n\
  ...\nsb.add_request_handler(YesIntentHandler())\n```\n\n本章接下来要做的是，在用户告诉我们生日后保存其资料，这样他们就不必重复告知了。\n\
  \n\n\n#### 保存用户资料\n\n要保存用户资料，我们需要在 `dynamodb.py` 模块中添加一个方法。这可以通过使用 Alexa 持久化管理器来实现，如下所示：\n\
  \n```\ndef save_user_profile(handler_input, profile):\nif has_access_token(handler_input):\n\
  try:\nattr = {}\nattr[\"Birthday\"] = str(profile[\"Birthday\"])\nattr[\"Events\"\
  ] = profile[\"Events\"]\namgr = handler_input.attributes_manager\namgr.persistent_attributes\
  \ = attr\namgr.save_persistent_attributes()\nexcept PersistenceException as e:\n\
  logger.error(e)\n# TODO: 优雅地处理 PersistenceException 异常\nexcept Exception as e:\n\
  logger.error(e)\nraise e\n```\n\n在这个方法中，我们传入了 `handler_input`、用户的 `birthday` 以及一个\
  \ `events` 数组。如果存在有效的访问令牌，我们定义一个属性变量（`attr`）作为键值对字典，其中一对用于生日，另一对用于事件数组。然后我们从 handler\
  \ input 中获取属性管理器，并将其赋值给 `amgr` 变量。接着，我们将 `attr` 字典赋值给 `amgr.persistent_attributes`\
  \ 属性，并使用 `amgr` 来保存持久化属性。这样就完成了。其余代码是错误处理逻辑，在从数据库保存或加载数据时，你应该始终使用这些逻辑，以防数据库或数据库连接出现问题。\n\
  \n现在我们已经定义了 `save_user_profile` 方法，需要切换回 `lambda_function.py` 模块，修改 `import` 语句和\
  \ `GiveBirthdayIntentHandler()`，并添加一个新的 View Calendar 意图处理器。\n\n首先，我们将修改 `dynamodb`\
  \ 的导入语句，以包含新的保存方法。这一行：\n\n```\nfrom dynamodb import adapter, read_user_profile,\
  \ AccessTokenValidity, has_access_token\n```\n\n变为：\n\n```\nfrom dynamodb import\
  \ adapter, read_user_profile, AccessTokenValidity, has_access_token, save_user_profile\n\
  ```\n\n在 `GiveBirthdayIntentHandler()` 中，我们需要做一些重大修改。具体来说，我们需要拆分 Handle 函数，将所有用于计算和显示日历的逻辑放在一个单独的函数中。找到这行代码：\n\
  \n```\ntoday = datetime.today()\n```\n\n在其前面添加声明：\n\n```\ndef ShowCalendar(handler_input,\
  \ bday, events):\n```\n\n在其底部，将返回值改为仅返回 response builder，而不是 response。因此，将这段代码：\n\
  \n```\nhandler_input.attributes_manager.session_attributes[\"last_speech\"] = speak_output\n\
  return (\nrb\n.speak(speak_output)\n.response\n)\n```\n\n改为：\n\n```\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nrb.speak(speak_output)\nreturn rb\n```\n\n现在将 `GiveBirthdayIntentHandler`\
  \ 的 `handle()` 方法改为：\n\n```\ndef handle(self, handler_input):\n# type: (HandlerInput)\
  \ -> Response\nvalidity, profile = read_user_profile(handler_input)\nlogger.info(f\"\
  Validity: {validity}\")\nbday_str = handler_input.request_envelope.request.intent.slots[\"\
  birthday\"].value\nlogger.info(f\"Birthday: {bday_str}\")\nbday, _, _, _ = period_from_amazon_date(bday_str)\n\
  logger.info(f\"bday: {bday}\")\nprofile[\"Birthday\"] = bday\nif validity == AccessTokenValidity.NEW:\n\
  profile[\"Events\"] = []\nsave_user_profile(handler_input, profile)\n#### 处理询问和终止选项\n\
  ask = None\nterminate = True\nif validity == AccessTokenValidity.VALID or validity\
  \ == AccessTokenValidity.NEW:\nask = \"您想向日历中添加一些事件吗？\"\nhandler_input.attributes_manager.session_attributes[\"\
  question\"] = \"AddEvents\"\nterminate = False\nrb = ShowCalendar(handler_input,\
  \ bday, profile[\"Events\"])\nif ask:\nrb.ask(ask)\nif terminate:\nrb.set_should_end_session(True)\n\
  return (rb.response)\n```\n\n在第三个启动请求处理器中，当关联账户有效且不是新账户时，我们为用户提供回答这个问题的机会：“欢迎回来！您可以添加事件或查看您的\
  \ 90 年日历。您想做什么？”我们需要添加一个 View Calendar 意图和意图处理器来覆盖这种情况。\n\n#### 添加 View Calendar\
  \ 意图\n\n在添加 View Calendar 意图处理器之前，我们应该先转到 Alexa 开发者控制台并添加 View Calendar 意图。为此，请按照以下步骤操作：\n\
  \n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig9_HTML.jpg](img/504229_1_En_13_Fig9_HTML.jpg)\n\
  \n图 13-9\n\n添加 ViewCalendar 意图\n\n1. 启动并登录 Alexa 开发者控制台。\n2. 编辑您的 90 年日历技能。\n3.\
  \ 在左侧导航栏中选择 *交互模型*。\n4. 在左侧导航栏中选择 *意图*。\n5. 点击 *+ 添加意图*。（参见图 13-9。）\n6. 输入意图名称：**ViewCalendar**\n\
  7. 点击 *创建自定义意图*。\n8. 添加一些示例语句：\n   * 查看日历\n   * 查看我的日历\n9. 点击顶部的 *保存模型* 按钮。\n10.\
  \ 点击顶部的 *构建模型* 按钮。\n\n现在在 `lambda_function.py` 模块中的 `GiveBirthdayIntentHandler`\
  \ 类之后添加 `ViewCalendarIntentHandler` 类：\n\n```\nclass ViewCalendarIntentHandler(AbstractRequestHandler):\n\
  \"\"\"ViewCalendar 意图的处理器。\"\"\"\ndef can_handle(self, handler_input):\n# type:\
