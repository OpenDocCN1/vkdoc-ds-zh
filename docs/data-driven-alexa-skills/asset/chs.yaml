  ]\n},\n{\n\"name\": \"LaunchRequest\",\n\"samples\": [\n\"Launch Personal Net Worth\"\
  ,\n\"Run Personal Net Worth\"\n],\n\"slots\": []\n},\n{\n\"name\": \"NoMoreIntent\"\
  ,\n\"samples\": [\n\"No More\"\n],\n\"slots\": []\n}\n...\n```\n\n完成这些编辑后，将整个 `Json`\
  \ 文件从 `NotePad++` 复制到 `Alexa Developer Console` 的 `JSON Editor` 窗口中。然后，单击顶部的 `Save\
  \ Model` 按钮，您应该会看到一条绿色消息，显示“Skill Saved Successfully”。如果没有，请仔细检查 `Json` 文件并重试。特别是，在添加和移除前面显示的部分后，确保标点符号（逗号、花括号、方括号等）正确无误。\n\
  \n接下来，我们需要创建 `lambda` 函数。\n\n\n\n#### 创建 Lambda 函数\n\n登录 AWS 并创建一个新的 lambda 函数。从头开始编写。将其命名为\
  \ `PersonalNetWorthBackend`。选择最新版本的 Python 作为运行时。让它创建一个具有基本 Lambda 权限的新执行角色。添加一个触发器。选择\
  \ *Alexa Skills Kit* 触发器。从 Alexa 开发者控制台 | 端点选项卡粘贴技能 ID。然后将 lambda 函数的 ARN 粘贴到 Alexa\
  \ 开发者控制台 | 端点选项卡 | 默认区域字段中。不要忘记点击 Alexa 开发者控制台屏幕顶部的 *保存端点* 按钮。\n\n现在你已经有了一个空的 lambda\
  \ 函数，并且它已连接到你的 Alexa 技能，你可以从 90 年日历技能的 lambda 函数中复制一些代码来开始。具体来说，让我们复制导入、日志记录、启动请求处理程序、是意图处理程序、内置意图处理程序、SkillBuilder\
  \ 和持久化代码。实际上，我们不妨同时复制 `lambda_function.py` 和 `dynamodb.py` 模块以及 `requirements.txt`\
  \ 文件。然后，我们可以在构建个人净资产特定代码时修改日历特定代码。将日历文件复制到净资产 lambda 后，我建议你关闭日历窗口，以免意外修改那里的文件。\n\
  \n现在，在 `dynamodb.py` 文件中，将其复制到 `PersonalNetWorthBackend` lambda 函数后，我们需要进行一些更改，如下所示：\n\
  \n```\nfrom ask_sdk_dynamodb.adapter import DynamoDbAdapter\nfrom ask_sdk_core.exceptions\
  \ import PersistenceException\nimport logging\nfrom enum import Enum\nfrom datetime\
  \ import datetime\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n\
  adapter = DynamoDbAdapter('PersonalNetWorth', partition_key_name=\"PersonId\")\n\
  class AccessTokenValidity(Enum):\nNONE = 1\nVALID = 2\nNEW = 3\nERROR = 4\ndef has_access_token(handler_input):\n\
  reqEnv = handler_input.request_envelope\nif reqEnv.context.system.user.access_token:\n\
  return True\nelse:\nreturn False\ndef read_user_profile(handler_input):\nvalidity\
  \ = AccessTokenValidity.NONE\nattr = []\ntry:\nhasAccessToken = has_access_token(handler_input)\n\
  logger.info(f\"AccToken: {hasAccessToken}\")\nif hasAccessToken:\namgr = handler_input.attributes_manager\n\
  attr = amgr.persistent_attributes\nif attr:\nlogger.info(f\"{attr}\")\nvalidity\
  \ = AccessTokenValidity.VALID\nelse:\nvalidity = AccessTokenValidity.NEW\nelse:\n\
  validity = AccessTokenValidity.NONE\nexcept PersistenceException as e:\nlogger.error(e)\n\
  validity = AccessTokenValidity.ERROR\n# TODO: 优雅地处理 PersistenceExceptions\nexcept\
  \ Exception as e:\nlogger.error(e)\nvalidity = AccessTokenValidity.ERROR\nraise\
  \ e\nreturn validity, attr\ndef save_user_profile(handler_input, profile):\nif has_access_token(handler_input):\n\
  try:\namgr = handler_input.attributes_manager\namgr.persistent_attributes = profile\n\
  amgr.save_persistent_attributes()\nexcept PersistenceException as e:\nlogger.error(e)\n\
  # TODO: 优雅地处理 PersistenceExceptions\nexcept Exception as e:\nlogger.error(e)\nraise\
  \ e\n```\n\n编辑 `lambda_function.py` 稍微复杂一些。我们需要移除以下类和函数：\n\n```\nclass GiveBirthdayIntentHandler(AbstractRequestHandler)\n\
  class ViewCalendarIntentHandler(AbstractRequestHandler)\ndef ShowCalendar(handler_input,\
  \ profile)\ndef load_apl_document(file_path)\ndef addYears(d, years)\ndef days_between(d1,\
  \ d2)\ndef period_from_amazon_date(iso)\n```\n\n然后我们需要从 SkillBuilder 中移除以下行：\n\n\
  ```\nsb.add_request_handler(GiveBirthdayIntentHandler())\nsb.add_request_handler(ViewCalendarIntentHandler())\n\
  ```\n\n接下来，我们需要更改 `speak_output` 行中的所有措辞，以正确反映我们个人净资产技能的意图。在本章中，我们将重点关注你的房屋以及与房屋价值相关的问题、答案和意图。这将更改以下类中的一些代码：\n\
  \n```\nclass LaunchRequestHandlerUnlinked(AbstractRequestHandler)\nspeak_output\
  \ = \"\"\"欢迎，你需要关联账户才能使用个人净资产技能。是否现在关联？\"\"\"\nclass LaunchRequestHandlerNew(AbstractRequestHandler)\n\
  speak_output = \"欢迎！感谢你关联账户。让我们开始吧。你是否拥有自己的房屋？\"\nhandler_input.attributes_manager.session_attributes[\"\
  question\"]  = \"DoYouOwnYourHome\"\nclass LaunchRequestHandlerValid(AbstractRequestHandler)\n\
  speak_output = \"欢迎回来！你想知道你的净资产吗？\"\nhandler_input.attributes_manager.session_attributes[\"\
  question\"] = \"GetNetWorth\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nclass YesIntentHandler(AbstractRequestHandler)\n\
  if question == \"LinkAccount\":\nspeak_output = \"好的，我已向 Alexa 应用发送了一些信息。打开你的 Alexa\
  \ 应用并点击链接以关联你的账户。\"\nendSession = True\ncard_output = ui.link_account_card.LinkAccountCard()\n\
  elif question == \"DoYouOwnYourHome\":\nspeak_output = \"太好了！你主要住所的街道地址是什么？\"\n\
  ask = \"你的街道地址是什么？\"\nhandler_input.attributes_manager.session_attributes[\"question\"\
  ] = \"What's your street address?\"\nelif question == \"GetNetWorth\":\n# TODO:\
  \ 计算净资产\nspeak_output = \"你当前的净资产是：\"\nendSession = True\nelif question == \"ClearAndStartOver\"\
  :\n# TODO: 清除并重新开始\nspeak_output = \"我已清除你的个人数据。首先，你主要住所的街道地址是什么？\"\nask = \"你的街道地址是什么？\"\
  \nhandler_input.attributes_manager.session_attributes[\"question\"] = \"What's your\
  \ street address?\"\nelse:\nspeak_output = \"抱歉，我搞混了，请告诉我你想做什么或说“帮助”。\"\nclass HelpIntentHandler(AbstractRequestHandler)\n\
  if question == \"LinkAccount\":\nspeak_output = \"好的，我已向手机上的 Alexa 应用发送了一些信息。打开你的\
  \ Alexa 应用并点击链接以关联你的账户。\"\nelif question == \"What's your street address?\":\nspeak_output\
  \ = \"试着说出你的门牌号和街道名称。\"\nclass StartOverIntentHandler(AbstractRequestHandler)\n\
  speak_output = \"好的。你确定要清除个人信息并重新开始吗？\"\nhandler_input.attributes_manager.session_attributes[\"\
  question\"] = \"ClearAndStartOver\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nclass FallbackIntentHandler(AbstractRequestHandler)\n\
  speak_output = \"\"\"你的个人净资产技能无法处理这个请求，\n但我可以帮助你确定你的净资产。尝试请求帮助。\"\"\"\nclass RepeatIntentHandler(AbstractRequestHandler)\n\
  else:\nspeak_output = \"\"\"我可以帮你计算你的净资产。尝试请求帮助。\"\"\"\nclass CatchAllExceptionHandler(AbstractExceptionHandler)\n\
  speak_output = \"抱歉，我在执行你的请求时遇到了问题。请重试或尝试请求帮助。\"\n```\n\n完成这些编辑后，`lambda_function.py`\
  \ 模块就可以开始添加新的意图处理程序来捕获和保存你的主要住所地址了。此时，该模块应该看起来像本书代码中名为 `lambda_function.py after\
  \ converting from calendar to net worth.py` 的列表。\n\n接下来，你需要像我们在第 12 章中所做的那样添加资源模块层。选择添加自定义层的选项，并选择最新版本的\
  \ CalendarDependencies，因为目前它包含我们所需的所有资源。（参见图 14-4。）\n\n![../images/504229_1_En_14_Chapter/504229_1_En_14_Fig4_HTML.jpg](img/504229_1_En_14_Fig4_HTML.jpg)\n\
  \n图 14-4\n\n向我们的 lambda 函数添加自定义层\n\n\n\n现在，您需要基于 *Amazon Alexa 启动会话* 事件模板配置一个测试事件，以测试您的\
  \ Lambda 函数，确保没有编译错误，并且未链接的启动请求处理器能正确触发。当您部署代码并运行测试时，应看到来自 `LaunchRequestHandlerUnlinked`\
  \ 类的“欢迎”响应，如图 14-5 所示。如果未看到，请先修复所有错误再继续。\n\n![../images/504229_1_En_14_Chapter/504229_1_En_14_Fig5_HTML.jpg](img/504229_1_En_14_Fig5_HTML.jpg)\n\
  \n图 14-5\n\n“欢迎”响应\n\nLambda 函数进展顺利后，我们就可以添加用于地址收集和估值的处理器和代码了。\n\n#### 提供地址意图\n\n\
  `GiveAddressIntent` 定义了两个示例语句：\n\n```\nI live at {street_address} {city} {state}\
  \ {zip_code}\nMy address is {street_address} {city} {state} {zip_code}\n```\n\n\
  并且槽位定义如下：\n\n| 槽位名称 | 槽位类型 |\n| --- | --- |\n| `{street_address}` | `AMAZON.PostalAddress`\
  \ |\n| `{city}` | `AMAZON.US_CITY` |\n| `{state}` | `AMAZON.US_STATE` |\n| `{zip_code}`\
  \ | `AMAZON.Number` |\n\n我们应该使用语句分析器（在 Alexa 开发者控制台的“构建”选项卡中，点击“评估模型”按钮）进行测试。输入语句：1058\
  \ Crossings Circle, Spring Hill, Tennessee 37174。嗯，它触发了 `AMAZON.FallbackIntent`。这并非我们预期。注意：语句分析器不会触及我们的\
  \ Lambda 函数。所以是其他方面出了问题。我们可能需要将这个意图拆分为四个意图——每个槽位对应一个。\n\n回到 Botmock，将 `GiveAddressIntent`\
  \ 拆分为四个部分：\n\n| **意图** | `GiveCityIntent` |\n| **语句** | My zip code is %zip_code%My\
  \ zip is %zip_code% |\n| **槽位提示** | What’s your zip code? |\n\n| **意图** | `GiveStateIntent`\
  \ |\n| **语句** | In the state of %state% |\n| **槽位提示** | What state do you live in?\
  \ |\n\n| **意图** | `GiveCityIntent` |\n| **语句** | In %city%I live in the city of\
  \ %city%In the city of %city% |\n| **槽位提示** | What city do you live in? |\n\n| **意图**\
  \ | `GiveAddressIntent` |\n| **语句** | My address is %street_address%I live at %street_address%\
  \ |\n| **槽位提示** | What's your street address? |\n\n更新模型，使用全部四个槽位，而不是仅用一个。（见图 14-6。）\n\
  \n![../images/504229_1_En_14_Chapter/504229_1_En_14_Fig6_HTML.jpg](img/504229_1_En_14_Fig6_HTML.jpg)\n\
  \n图 14-6\n\n修改后的 Botmock 模型\n\n模型更新后，再次导出，按之前所示编辑 JSON，并将 JSON 复制到 Alexa 开发者控制台的\
  \ JSON 编辑器中。保存模型并构建。修复所有错误。在语句分析器中再次测试模型。\n\n| 语句 | 选中的意图 |\n| --- | --- |\n| I\
  \ live at 1058 Crossings Circle. | `GiveAddressIntent` |\n| In the city of Spring\
  \ Hill | `GiveCityIntent` |\n| In the state of Tennessee | `GiveStateIntent` |\n\
  | My zip is 37174 | `GiveZipCodeIntent` |\n\n现在它按预期工作了。接下来我们可以编写意图处理器的代码。前三个（地址、城市和州）非常相似。它们都从\
  \ `handler_input` 中提取传入的槽位值，检查配置文件是否已启动，将槽位值添加到配置文件中，保存配置文件，并按顺序询问下一个问题。\n\n| **GiveAddressIntentHandler**\
  \ |\n| --- |\n| `class GiveAddressIntentHandler(AbstractRequestHandler):` |\n| `\"\
  \"\"Handler for Give Address Intent.\"\"\"` |\n| `def can_handle(self, handler_input):`\
  \ |\n| `validity, _ = read_user_profile(handler_input)` |\n| `return (validity ==\
  \ AccessTokenValidity.VALID) and ask_utils.is_request_type(\"GiveAddressIntent\"\
  )(handler_input)` |\n| `def handle(self, handler_input):` |\n| `_, profile = read_user_profile(handler_input)`\
  \ |\n| `street_address = handler_input.request_envelope.request.intent.slots[` |\n\
  | `\"street_address\"].value` |\n| `if not profile:` |\n| `profile = {}` |\n| `profile[\"\
  street_address\"] = street_address` |\n| `save_user_profile(handler_input, profile)`\
  \ |\n| `speak_output = \"Great. What city do you live in?\"` |\n| `handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"City\"` |\n| `handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output` |\n| `return (` |\n| `handler_input.response_builder`\
  \ |\n| `.speak(speak_output)` |\n| `.ask(speak_output)` |\n| `.response` |\n| `)`\
  \ |\n\n| **GiveCityIntentHandler** |\n| --- |\n| `class GiveCityIntentHandler(AbstractRequestHandler):`\
  \ |\n| `\"\"\"Handler for Give City Intent.\"\"\"` |\n| `def can_handle(self, handler_input):`\
  \ |\n| `validity, _ = read_user_profile(handler_input)` |\n| `return (validity ==\
  \ AccessTokenValidity.VALID) and ask_utils.is_request_type(\"GiveCityIntent\")(handler_input)`\
  \ |\n| `def handle(self, handler_input):` |\n| `_, profile = read_user_profile(handler_input)`\
  \ |\n| `city = handler_input.request_envelope.request.intent.slots[` |\n| `\"city\"\
  ].value` |\n| `if not profile:` |\n| `profile = {}` |\n| `profile[\"city\"] = city`\
  \ |\n| `save_user_profile(handler_input, profile)` |\n| `speak_output = \"Cool.\
  \ What state do you live in?\"` |\n| `handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"State\"` |\n| `handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output` |\n| `return (` |\n| `handler_input.response_builder`\
  \ |\n| `.speak(speak_output)` |\n| `.ask(speak_output)` |\n| `.response` |\n| `)`\
  \ |\n\n| **GiveStateIntentHandler** |\n| --- |\n| `class GiveStateIntentHandler(AbstractRequestHandler):`\
  \ |\n| `\"\"\"Handler for Give State Intent.\"\"\"` |\n| `def can_handle(self, handler_input):`\
  \ |\n| `validity, _ = read_user_profile(handler_input)` |\n| `return (validity ==\
  \ AccessTokenValidity.VALID) and ask_utils.is_request_type(\"GiveStateIntent\")(handler_input)`\
  \ |\n| `def handle(self, handler_input):` |\n| `_, profile = read_user_profile(handler_input)`\
  \ |\n| `state = handler_input.request_envelope.request.intent.slots[` |\n| `\"state\"\
  ].value` |\n| `if not profile:` |\n| `profile = {}` |\n| `profile[\"state\"] = state`\
  \ |\n| `save_user_profile(handler_input, profile)` |\n| `speak_output = \"Awesome.\
  \ What is your zip code?\"` |\n| `handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"ZipCode\"` |\n| `handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output` |\n| `return (` |\n| `handler_input.response_builder`\
  \ |\n| `.speak(speak_output)` |\n| `.ask(speak_output)` |\n| `.response` |\n| `)`\
  \ |\n\n邮政编码意图处理器则完全不同。首先，我们需要一个辅助函数来处理以零开头的邮政编码。具体来说，我们需要添加一个 `right()` 函数，该函数可以从“00000”与输入的邮政编码数值拼接后的字符串中提取最右边的五个字符。例如，如果邮政编码槽位中存储的是\
  \ 4829，我们在其前面加上“00000”，得到“000004829”，然后取最右边的五个字符，就得到了邮政编码“04829”，这很可能就是用户最初告诉我们的内容。以下是\
  \ `right()` 函数：\n\n\n```python\ndef right(s, amount):\n    if s == None:\n     \
  \   return None\n    elif amount == None:\n        return None  # 或者抛出缺少参数的错误\n\
  \    s = str(s)\n    if amount > len(s):\n        return s\n    elif amount == 0:\n\
  \        return \"\"\n    else:\n        return s[-amount:]\n```\n\n邮政编码意图处理器的第二个主要区别在于，我们期望它在地址序列中最后出现，但用户可能会通过跳步来迷惑我们。在这种情况下，邮政编码处理器需要检查我们是否拥有完整的地址，并跳回去获取我们缺失的地址部分。例如：\n\
  \n```python\nif not \"street_address\" in profile:\n    speak_output = \"我错过了你的街道地址。请问是什么？\"\
  \n    handler_input.attributes_manager.session_attributes[\"question\"] = \"StreetAddress\"\
  \n```\n\n因此，该处理器将是 **`GiveZipCodeIntentHandler`**：\n\n```python\nclass GiveZipCodeIntentHandler(AbstractRequestHandler):\n\
  \    \"\"\"处理提供邮政编码意图的处理器。\"\"\"\n    def can_handle(self, handler_input):\n   \
  \     validity, _ = read_user_profile(handler_input)\n        return (validity ==\
  \ AccessTokenValidity.VALID) and ask_utils.is_request_type(\"GiveZipCodeIntent\"\
  )(handler_input)\n\n    def handle(self, handler_input):\n        _, profile = read_user_profile(handler_input)\n\
  \        zip_code = handler_input.request_envelope.request.intent.slots[\n     \
  \       \"zip_code\"].value\n        if not profile:\n            profile = {}\n\
  \        profile[\"zip_code\"] = right(\"00000\" + str(zip_code), 5)\n        save_user_profile(handler_input,\
  \ profile)\n        if not \"street_address\" in profile:\n            speak_output\
  \ = \"我错过了你的街道地址。请问是什么？\"\n            handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"StreetAddress\"\n        elif not \"city\" in profile:\n       \
  \     speak_output = \"我缺少你的城市信息。请问是什么？\"\n            handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"City\"\n        elif not \"state\" in profile:\n            speak_output\
  \ = \"我缺少你的州信息。请问是什么？\"\n            handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"State\"\n        elif not \"zip_code\" in profile:\n           \
  \ speak_output = \"我缺少你的邮政编码。请问是什么？\"\n            handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"ZipCode\"\n        else:\n            speak_output = f\"\"\"谢谢。我已将你的地址记录为\n\
  {profile[\"street_address\"]},\n{profile[\"city\"]}, {profile[\"state\"]}, {profile[\"\
  zip_code\"]}.\n是否正确？\"\"\"\n            handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"ConfirmAddress\"\n        handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n        return (\n            handler_input.response_builder\n\
  \            .speak(speak_output)\n            .ask(speak_output)\n            .response\n\
  \        )\n```\n\n接下来，我们将把你的投资组合添加到个人净资产技能中。\n\n#### 提供股票意图\n\n`GiveStock` 意图的语句都包含两个槽位：股票代码和持股数量。在\
  \ `GiveStock` 意图处理器中，我们需要从各自的槽位中获取这两个值，如下所示：\n\n```python\nstock_ticker = handler_input.request_envelope.request.intent.slots[\"\
  stock_ticker\"].value\nshare_count = handler_input.request_envelope.request.intent.slots[\"\
  share_count\"].value\n```\n\n然后我们可以将它们添加到配置文件中的 Python 字典里。我们使用字典而不是列表，因为键值对语法非常适合捕获每项投资的键（股票代码）和值（持股数量）。例如，`profile[\"\
  stocks\"][\"AMZN\"] = 25` 表示你拥有 25 股 `AMZN`。字典允许我们自动处理更新或新增操作，因为如果键已存在，我们只需更新数量；如果不存在，则添加股票代码和数量。例如：\n\
  \n```python\nprofile[\"stocks\"][stock_ticker] = share_count\n```\n\n我们可能应该确认每次添加。在下一章中，我们将使用\
  \ API 从股票代码获取股票名称，以便同时使用股票代码和名称进行确认。目前，我们仅使用股票代码进行确认。例如：\n\n```python\nif stock_ticker\
  \ in profile[\"stocks\"]:\n    speak_output = f'{stock_ticker} 的持股数量正在从 {profile[\"\
  stocks\"][stock_ticker]} 更新为 {share_count}。是否正确？'\nelse:\n    speak_output = f'正在将\
  \ {share_count} 股 {stock_ticker} 添加到你的投资组合中。是否正确？'\n```\n\n假设当我们询问“是否正确？”时，用户回答“否”。我们需要撤销\
  \ `profile[\"stocks\"][stock_ticker] = share_count` 的赋值。在更改数量之前，让我们将先前的数量存储在 `session_attributes`\
  \ 中；如果用户说“否”，我们可以恢复先前的数量。除非先前的数量为零，那么我们可以从字典中删除该股票代码。例如，如果我们将以下代码放入 `GiveStock`\
  \ 意图处理器中：\n\n```python\nif stock_ticker in profile[\"stocks\"]:\n    handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"] = profile[\"stocks\"][stock_ticker]\nelse:\n    handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"] = 0\nhandler_input.attributes_manager.session_attributes[\"\
  previous_stock_ticker\"] = stock_ticker\nprofile[\"stocks\"][stock_ticker] = share_count\n\
  save_user_profile(handler_input, profile)\n```\n\n那么我们可以将以下代码放入 `No` 意图处理器中，以撤销添加/更新操作：\n\
  \n```python\nelif question == \"ConfirmShares\":\n    if handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"] == 0:\n        del profile[\"stocks\"][handler_input.attributes_manager.session_attributes[\"\
  previous_stock_ticker\"]]\n    else:\n        profile[\"stocks\"][handler_input.attributes_manager.session_attributes[\"\
  previous_stock_ticker\"]] = handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"]\n```\n\n因此，完成的 `GiveStockIntentHandler` 将是：\n\n```python\n\
  class GiveStockIntentHandler(AbstractRequestHandler):\n    \"\"\"处理提供股票意图的处理器。\"\
  \"\"\n    def can_handle(self, handler_input):\n        validity, _ = read_user_profile(handler_input)\n\
  \        return (validity == AccessTokenValidity.VALID) and ask_utils.is_request_type(\"\
  GiveStockIntent\")(handler_input)\n\n    def handle(self, handler_input):\n    \
  \    _, profile = read_user_profile(handler_input)\n        stock_ticker = handler_input.request_envelope.request.intent.slots[\n\
  \            \"stock_ticker\"].value\n        share_count = handler_input.request_envelope.request.intent.slots[\n\
  \            \"share_count\"].value\n        if not profile:\n            profile\
  \ = {}\n        profile[\"stocks\"] = {}\n        if stock_ticker in profile[\"\
  stocks\"]:\n            handler_input.attributes_manager.session_attributes[\n \
  \               \"previous_share_count\"] = profile[\"stocks\"][stock_ticker]\n\
  \            speak_output = f'{stock_ticker} 的持股数量正在从 {profile[\"stocks\"][stock_ticker]}\
  \ 更新为 {share_count}。是否正确？'\n        else:\n            handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"] = 0\n            speak_output = f'正在将 {share_count} 股 {stock_ticker}\
  \ 添加到你的投资组合中。是否正确？'\n        handler_input.attributes_manager.session_attributes[\"\
  previous_stock_ticker\"] = stock_ticker\n        profile[\"stocks\"][stock_ticker]\
  \ = share_count\n        save_user_profile(handler_input, profile)\n        handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n        ask = \"是否正确？\"\n        handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"ConfirmShares\"\n        return (\n            handler_input.response_builder\n\
  \            .speak(speak_output)\n            .ask(ask)\n            .response\n\
  \        )\n```\n\n现在我们已经有了 `Give*` 意图处理器，接下来需要查看 `Yes` 和 `No` 意图处理器。\n\n\n####\
  \ 是/否意图\n\n在其他意图中，我们会向用户提出几个是/否问题。具体来说，我们会询问：\n\n```\n您现在要链接[您的账户]吗？\n您是否拥有自己的住房？\n\
  您想知道自己的净资产吗？\n信息正确吗？[地址确认]\n信息正确吗？[更新持股数量]\n信息正确吗？[添加股票代码和数量]\n```\n\n在每种情况下，我们都会将`\"\
  question\"`项添加到会话属性中，以便知道用户是对什么内容说“是”或“否”。因此，是/否意图处理程序的基本结构是一系列`if...elif...else`语句。例如，下面是处理对`LinkAccount`问题回答`Yes`的第一个`if`语句：\n\
  \n```\nif question == \"LinkAccount\":\nspeak_output = \"好的，我已向 Alexa 应用发送了一些信息。请打开您的\
  \ Alexa 应用并点击链接以连接您的账户。\"\nendSession = True\ncard_output = ui.link_account_card.LinkAccountCard()\n\
  ```\n\n以及针对`LinkAccount`问题对应的`No`处理程序：\n\n```\nif question == \"LinkAccount\":\n\
  speak_output = \"好的，您可以稍后回来链接您的账户以开始使用。谢谢。\"\nendSession = True\n```\n\n关于是/否处理程序的一个特殊情况是，如果用户的访问令牌尚未生效，且问题是`\"\
  LinkAccount\"`，我们仍然需要运行处理程序代码。为了实现这一点，我们需要修改`can_handle`逻辑，如下所示：\n\n```\ndef can_handle(self,\
  \ handler_input):\nvalidity, _ = read_user_profile(handler_input)\nquestion = handler_input.attributes_manager.session_attributes[\"\
  question\"]\nreturn (validity == AccessTokenValidity.VALID\nor validity == AccessTokenValidity.NEW\n\
  or question == \"LinkAccount\") \\\nand ask_utils.is_intent_name(\"AMAZON.YesIntent\"\
  )(handler_input)\n```\n\n这将确保无论账户是否已链接，只要问题是`\"LinkAccount\"`，代码都会运行。\n\n综合起来，我们最终得到一个如下所示的“是”意图处理程序：\n\
  \n```\nclass YesIntentHandler(AbstractRequestHandler):\n\"\"\"用于处理“是”意图的处理程序。\"\"\
  \"\ndef can_handle(self, handler_input):\n# type: (HandlerInput) -> bool\nvalidity,\
  \ _ = read_user_profile(handler_input)\nquestion = handler_input.attributes_manager.session_attributes[\"\
  question\"]\nreturn (validity == AccessTokenValidity.VALID\nor validity == AccessTokenValidity.NEW\n\
  or question == \"LinkAccount\") \\\nand ask_utils.is_intent_name(\"AMAZON.YesIntent\"\
  )(handler_input)\ndef handle(self, handler_input):\n_, profile = read_user_profile(handler_input)\n\
  question = handler_input.attributes_manager.session_attributes[\"question\"]\nspeak_output\
  \ = \"\"\nask = None\nendSession = False\ncard_output = None\nif question == \"\
  LinkAccount\":\nspeak_output = \"好的，我已向 Alexa 应用发送了一些信息。请打开您的 Alexa 应用并点击链接以连接您的账户。\"\
  \nendSession = True\ncard_output = ui.link_account_card.LinkAccountCard()\nelif\
  \ question == \"DoYouOwnYourHome\":\nspeak_output = \"太好了！您主要住所的街道地址是什么？\"\nask\
  \ = \"您的街道地址是什么？\"\nhandler_input.attributes_manager.session_attributes[\n\"question\"\
  ] = \"StreetAddress\"\nif not profile:\nprofile = {}\nprofile[\"own_home\"] = True\n\
  save_user_profile(handler_input, profile)\nelif question == \"ConfirmAddress\":\n\
  speak_output = \"太棒了！现在我们可以继续处理您的投资了。请告诉我您持有的每种投资的股票代码和数量。或者说“没有更多”以停止添加股票。\"\n\
  ask = \"请告诉我您持有某个股票代码的股份数量。\"\nhandler_input.attributes_manager.session_attributes[\n\
  \"question\"] = \"AddStock\"\nelif question == \"ConfirmShares\":\nspeak_output\
  \ = \"那么多？哇！请告诉我您另一项投资的股票代码和持股数量。或者说“没有更多”以停止添加股票。\"\nask = \"请告诉我您持有某个股票代码的股份数量。\"\
  \nhandler_input.attributes_manager.session_attributes[\n\"question\"] = \"AddStock\"\
  \nelif question == \"GetNetWorth\":\n# TODO: 计算净资产\nspeak_output = \"您当前的净资产是：\"\
  \nendSession = True\nelif question == \"ClearAndStartOver\":\nprofile = {}\nsave_user_profile(handler_input,\
  \ profile)\nspeak_output = \"我已清除您的个人数据。首先，您是否拥有自己的住房？\"\nask = \"您是否拥有自己的住房？\"\n\
  handler_input.attributes_manager.session_attributes[\n\"question\"] = \"DoYouOwnYourHome\"\
  \nelse:\nspeak_output = \"抱歉，我有点困惑，请告诉我您想做什么，或者说“帮助”。\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nif not ask:\nask = speak_output\nreturn (\nhandler_input.response_builder\n\
  .speak(speak_output)\n.ask(ask)\n.set_card(card_output)\n.set_should_end_session(endSession)\n\
  .response\n)\n```\n\n我们还需要一个对应的“否”意图处理程序，如下所示：\n\n```\nclass NoIntentHandler(AbstractRequestHandler):\n\
  \"\"\"用于处理“否”意图的处理程序。\"\"\"\ndef can_handle(self, handler_input):\n# type: (HandlerInput)\
  \ -> bool\nvalidity, _ = read_user_profile(handler_input)\nquestion = handler_input.attributes_manager.session_attributes[\"\
  question\"]\nreturn (validity == AccessTokenValidity.VALID\nor validity == AccessTokenValidity.NEW\n\
  or question == \"LinkAccount\") \\\nand ask_utils.is_intent_name(\"AMAZON.NoIntent\"\
  )(handler_input)\ndef handle(self, handler_input):\n_, profile = read_user_profile(handler_input)\n\
  question = handler_input.attributes_manager.session_attributes[\"question\"]\nspeak_output\
  \ = \"\"\nask = None\nendSession = False\nif question == \"LinkAccount\":\nspeak_output\
  \ = \"好的，您可以稍后回来链接您的账户以开始使用。谢谢。\"\nendSession = True\nelif question == \"DoYouOwnYourHome\"\
  :\nspeak_output = \"好的。让我们继续处理您的投资。请告诉我您持有的每种投资的股票代码和数量。或者说“没有更多”以停止添加股票。\"\nask\
  \ = \"请告诉我您持有某个股票代码的股份数量。\"\nhandler_input.attributes_manager.session_attributes[\n\
  \"question\"] = \"AddStock\"\nelif question == \"ConfirmAddress\":\nspeak_output\
  \ = \"好的。让我们再试一次。您主要住所的街道地址是什么？\"\nask = \"您的街道地址是什么？\"\nhandler_input.attributes_manager.session_attributes[\"\
  question\"] = \"StreetAddress\"\nprofile = {}\nprofile[\"own_home\"] = True\nsave_user_profile(handler_input,\
  \ profile)\nelif question == \"ConfirmShares\":\nspeak_output = \"哎呀。让我们再试一次。请告诉我您持有的每种投资的股票代码和数量。或者说“没有更多”以停止添加股票。\"\
  \nask = \"请告诉我您持有某个股票代码的股份数量。\"\nif handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"] == 0:\ndel profile[\"stocks\"][handler_input.attributes_manager.session_attributes[\"\
  previous_stock_ticker\"]]\nelse:\nprofile[\"stocks\"][handler_input.attributes_manager.session_attributes[\"\
  previous_stock_ticker\"]\n] = handler_input.attributes_manager.session_attributes[\"\
  previous_share_count\"]\nhandler_input.attributes_manager.session_attributes[\n\"\
  question\"] = \"AddStock\"\nelif question == \"GetNetWorth\":\nspeak_output = \"\
  好的。现在不是好时机。我明白了。欢迎您稍后回来查询您的净资产。只需一分钟。\"\nendSession = True\nelif question == \"\
  ClearAndStartOver\":\n# 被拒绝。不清除并重新开始\nspeak_output = \"呼。我还以为您要删除所有内容。但您没有。太好了。您想知道自己的净资产吗？\"\
  \nask = \"您想知道自己的净资产吗？\"\nhandler_input.attributes_manager.session_attributes[\n\
  \"question\"] = \"GetNetWorth\"\nelse:\nspeak_output = \"抱歉，我有点困惑，请告诉我您想做什么，或者说“帮助”。\"\
  \nhandler_input.attributes_manager.session_attributes[\"last_speech\"] = speak_output\n\
  if not ask:\nask = speak_output\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  .ask(ask)\n.set_should_end_session(endSession)\n.response\n)\n```\n\n本章要介绍的最后一个内容是“没有更多”意图处理程序。\n\
  \n\n\n#### 停止添加意图\n\n当用户想要停止向投资组合中添加股票时，他们需要说“不再添加”。此时，我们需要停止询问股票信息，转而询问是否要获取其净资产。因此，停止添加意图处理器将如下所示：\n\
  \n```\nclass NoMoreIntentHandler(AbstractRequestHandler):\n    \"\"\"停止添加意图的处理器。\"\
  \"\"\n    def can_handle(self, handler_input):\n        validity, _ = read_user_profile(handler_input)\n\
  \        return (validity == AccessTokenValidity.VALID) and ask_utils.is_request_type(\"\
  NoMoreIntent\")(handler_input)\n\n    def handle(self, handler_input):\n       \
  \ speak_output = \"好的。您想知道您的净资产吗？\"\n        handler_input.attributes_manager.session_attributes[\"\
  question\"] = \"GetNetWorth\"\n        handler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\n        return (\n            handler_input.response_builder\n\
  \            .speak(speak_output)\n            .ask(speak_output)\n            .response\n\
  \        )\n```\n\n现在我们需要将新的意图添加到技能构建器中。在模块底部，按如下所示更新技能构建器部分：\n\n```\nsb = CustomSkillBuilder(persistence_adapter=adapter)\n\
  sb.add_request_handler(LaunchRequestHandlerUnlinked())\nsb.add_request_handler(LaunchRequestHandlerNew())\n\
  sb.add_request_handler(LaunchRequestHandlerValid())\nsb.add_request_handler(GiveAddressIntentHandler())\n\
  sb.add_request_handler(GiveCityIntentHandler())\nsb.add_request_handler(GiveStateIntentHandler())\n\
  sb.add_request_handler(GiveZipCodeIntentHandler())\nsb.add_request_handler(GiveStockIntentHandler())\n\
  sb.add_request_handler(NoMoreIntentHandler())\nsb.add_request_handler(YesIntentHandler())\n\
  sb.add_request_handler(NoIntentHandler())\nsb.add_request_handler(HelpIntentHandler())\n\
  sb.add_request_handler(NavigateHomeIntentValidHandler())\nsb.add_request_handler(NavigateHomeIntentInvalidHandler())\n\
  sb.add_request_handler(StartOverIntentHandler())\nsb.add_request_handler(CancelOrStopIntentHandler())\n\
  sb.add_request_handler(SessionEndedRequestHandler())\nsb.add_request_handler(RepeatIntentHandler())\n\
  sb.add_request_handler(FallbackIntentHandler())\n# 确保 IntentReflectorHandler 和 CatchAllExceptionHandler\n\
  # 位于最后，这样它们就不会覆盖您的自定义意图处理器\nsb.add_request_handler(IntentReflectorHandler())\nsb.add_exception_handler(CatchAllExceptionHandler())\n\
  ```\n\n您的任务是更新 `HelpIntentHandler`、`NavigateHomeIntent*Handlers` 以及所有其他内置意图的处理器，使其能够适用于此技能。您还应在\
  \ lambda 环境中创建单元测试来测试您的函数。请记住，这涉及使用 Alexa 开发者控制台获取意图的 Json，然后将其复制到 lambda 函数的测试中。\n\
  \n至此，我们已经为个人净资产技能创建了前端（VUI）和后端（`lambda_function` 和 `dynamodb` 模块）。不过，还有一个明显的遗漏。我们在“是”意图处理器中留下了一个待办事项：\n\
  \n```\n# TODO: CalculateNetWorth\n```\n\n这将是下一章的内容。\n\n### 总结\n\n在本章中，我们创建了个人净资产技能的雏形。首先，我们确定了需求。这使我们能够在\
  \ Botmock 中设计 VUI。然后，我们将该设计导出为 Json 并导入到 Alexa 开发者控制台。接着，我们创建了后端 lambda 函数，并在其中编写了启动意图处理器。我们添加了一个\
  \ `dynamodb` 模块，用于读取和保存用户配置文件。我们添加了提供地址意图处理器和提供股票意图处理器。然后，我们研究了“是”和“否”意图处理器。最后，我们添加了停止添加意图处理器，并更新了\
  \ lambda 函数的技能构建器部分。在下一章中，我们将使用金融 API 来获取本章收集的资产的价值。\n\n## 15. 房地产 API\n\n在本章中，我们将基于上一章构建的个人理财技能，添加第一个资产价值计算功能，该功能将告诉我们房屋和投资的价值。同样，此技能可能会接触到大量个人数据，但所有这些数据都将安全地存储在受保护的数据库中，并经过加密以保护您的安全。在所有情况下，您都可以选择使用测试账户和虚假数据进行开发，因此完全不需要涉及真实数据。\n\
  \n我们将使用两个 API：一个房地产 API 和一个股票市场 API。本章将介绍 API——如何对其进行身份验证以及如何使用它们。然后，我们将在 lambda\
  \ 函数中添加一个模块，该模块调用房地产 API 来计算我们房屋的价值，以便 Alexa 能够告诉我们房屋值多少钱。\n\n首先，介绍 API。\n\n###\
  \ 应用程序编程接口\n\n应用程序编程接口（通常称为 API）是一种让开发者发布功能的方式（在本例中是在网络上），以便其他开发者可以访问这些功能并在其程序中使用。许多\
  \ API 被称为 RESTful 的。^((21)) 这意味着很多内容，但就我们的目的而言，这意味着它们可以通过精心构造的 URL^((22)) 访问，而不是通过更复杂的机制。\n\
  \n例如，Numbers API 是一项免费服务，可为给定数字提供冷知识。这是一个 RESTful API，因此您可以通过标准互联网浏览器访问它。只需导航到 [`http://numbersapi.com/100`](http://numbersapi.com/100)。您可以将\
  \ 100 替换为任何数字。例如，[`http://numbersapi.com/8`](http://numbersapi.com/8) 可能会回复：“8 是一个字节中的比特数。”有些数字并不引人注目。许多数字会提供关于该数字的几条简单冷知识之一。您可以在\
  \ [`http://numbersapi.com/`](http://numbersapi.com/) 查看 Numbers API 的主页和附加功能。\n\n\
  您也可以从 Python 的 `requests` 模块调用 Numbers API 或任何 RESTful API。例如：\n\n```\nimport requests\n\
  response = requests.request(\"GET\", \"http://numbersapi.com/17\")\nprint(response.text)\n\
  输出：\n17 是掷弹兵卫队手榴弹帽徽章上火焰的数量。\n```\n\n了解了如何使用 Python 的 `requests` 模块调用 API 后，我们现在可以寻找一个能够评估我们房产价值的\
  \ API。\n\n\n\n### 房地产估值 API\n\n通过谷歌搜索可以找到各种房产估值 API。起初，这可能会让人不知所措。然而，有一个网站让查找和使用\
  \ API 交互变得简单得多：[`https://rapidapi.com`](https://rapidapi.com)。Rapid API 是一个供 API\
  \ 开发者以某种标准化方式公开其 API 的中心。它让订阅免费增值网站变得容易，并提供了用多种编程语言调用 API 的示例代码。注册成为开发者后，在 Rapid\
