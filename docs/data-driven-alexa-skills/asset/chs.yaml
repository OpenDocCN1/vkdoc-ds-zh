  \ API，并思考下一步要做什么。\n\n### 接下来可以做什么？\n\n我们可以通过以下几种方式提升技能。\n\n首先，我们可以将所有股票的价格作为配置文件的一部分返回。这样我们就可以将价格保存到数据库中，进而能够\
