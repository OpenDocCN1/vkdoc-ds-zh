  \ 3-2）。\n   1. 完善个人资料，并回答关于您感兴趣产品的调查问题。\n   2. 然后点击 *开始探索控制台* 选项。\n\n您已成功创建亚马逊开发者账户，该账户可用于多种亚马逊开发者服务和技术（见图\
  \ 3-3）。\n\n![../images/504229_1_En_3_Chapter/504229_1_En_3_Fig3_HTML.jpg](img/504229_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n您的亚马逊开发者账户解锁的众多服务\n\n### AWS 开发者账户\n\n您接下来需要的账户是亚马逊云服务（AWS）账户。我们将使用此账户来支持数据驱动的\
  \ Alexa 技能所需的后端服务。特别是，自定义技能会使用一个名为 Lambda 的服务。请注意，创建开发者账户需要一张信用卡用于支付验证。注册时不会产生任何费用，因为您注册的是免费套餐账户。开始操作：\n\
