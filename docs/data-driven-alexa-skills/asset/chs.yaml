  return (rb.response)\n```\n\n并将其添加到 `lambda_function.py` 模块底部的 Skill Builder 中：\n\
  \n```\n...\nsb.add_request_handler(GiveBirthdayIntentHandler())\nsb.add_request_handler(ViewCalendarIntentHandler())\n\
  sb.add_request_handler(YesIntentHandler())\n...\n```\n\n并将 `\"AddEvents\"` 代码添加到\
  \ Yes 意图处理器的 if 语句中：\n\n```\ndef handle(self, handler_input):\nquestion = handler_input.attributes_manager.session_attributes[\"\
  question\"]\nspeak_output = \"\"\nask = None\nendSession = False\ncard_output =\
  \ None\nif question == \"LinkAccount\":\nspeak_output = \"好的，我已经向 Alexa 应用发送了一些信息。打开您的\
  \ Alexa 应用，点击链接以关联您的账户。\"\nendSession = True\ncard_output = ui.link_account_card.LinkAccountCard()\n\
  elif question == \"AddEvents\":\nspeak_output = \"要向日历添加事件，我需要知道事件的日期、类型和描述。如果您只知道月份或年份，日期不必精确。事件发生在什么时候？\"\
  \nask = \"事件发生在什么时候？\"\nelse:\nspeak_output = \"抱歉，我有点困惑，请告诉我您想做什么或说“帮助”。\"\nhandler_input.attributes_manager.session_attributes[\"\
  last_speech\"] = speak_output\nhandler_input.attributes_manager.session_attributes[\"\
  question\"] = \"\"\nif not ask:\nask = speak_output\nreturn (\nhandler_input.response_builder\n\
  .speak(speak_output)\n.ask(ask)\n.set_card(card_output)\n.set_should_end_session(endSession)\n\
  .response\n)\n```\n\n保存并部署您的代码。运行您的单元测试。添加代码并通过单元测试后，我们还应该测试新的 View Calendar 意图。\n\
  \n\n\n##### 测试查看日历意图\n\n返回 Alexa 开发者控制台。确保您已登录，并且您的账户当前已与手机 Alexa 应用中的 90 年日历技能关联。\n\
  \n选择“测试”选项卡并启动您的技能（`90 kilo`）。Alexa 应会回应：“欢迎回来！您可以添加事件或查看您的 90 年日历。您想做什么？”\n\n您应回答：“查看日历。”\n\
  \n然后，她应会说出您（从已保存的个人资料中）的趣事，并显示日历。\n\n图 13-10 展示了此对话。\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig10_HTML.jpg](img/504229_1_En_13_Fig10_HTML.jpg)\n\
  \n图 13-10\n\n有效的启动请求处理器和查看日历意图\n\n现在，您拥有了在 Lambda 函数中进行单元测试所需的 Json 代码。（见图 13-11。）\n\
  \n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig11_HTML.jpg](img/504229_1_En_13_Fig11_HTML.jpg)\n\
  \n图 13-11\n\n用于单元测试的 `ViewCalendar` Json\n\n复制该 Json 并将其粘贴到 Lambda 函数编辑器中的新单元测试中。（见图\
  \ 13-12。）\n\n![../images/504229_1_En_13_Chapter/504229_1_En_13_Fig12_HTML.jpg](img/504229_1_En_13_Fig12_HTML.jpg)\n\
  \n图 13-12\n\n配置新的单元测试\n\n通过单击“测试”按钮运行您的新单元测试。您应会看到 `ViewCalendarIntentHandler` 的\
  \ Json 响应。\n\n如果一切顺利，我们就可以继续了。\n\n### 下一步可以做什么\n\n至此，您可以朝多个方向发展。您可以添加“否”意图处理器。与“是”意图处理器类似，您需要知道用户是对哪个问题回答“否”。您可以开始添加“添加事件”意图处理器（日期、类型、描述）。注意：日期处理器有点问题，因为我们已经有生日日期处理器（`GiveBirthdayIntentHandler`）。\n\
  \nAlexa 如何区分用户是针对“提供生日意图”还是“提供事件日期意图”的表述？简而言之，她无法区分，因此您需要确保只有一个意图允许用户仅说出日期。另一个意图需要额外的词语。例如，“提供生日”有一个仅包含\
  \ `{birthday}` 槽位的表述。“提供事件日期”不应有仅包含 `{eventDate}` 槽位的表述。相反，`GiveBirthdayIntentHandler`\
  \ 应能消除歧义，判断日期是来自 `GiveBirthday` 意图还是来自 `GiveEventDate` 意图。您可以通过传递一个会话属性来实现这一点，类似于我们为问题属性所做的那样，以便“是”意图处理器能够判断出被问的是哪个问题。\n\
  \n您还应添加 `GiveEventDescription` 和 `GiveEventType` 意图处理器。然后尝试使用 `AddAnEvent` 意图处理器。在开发更多代码时，请务必经常保存和部署，运行您现有的单元测试，并从\
  \ Alexa 开发者控制台“测试”选项卡中的 Json 创建更多测试。\n\n完成测试后，将您技能的启动短语从“90 kilo”更改为更有用的内容。例如，“90-Year\
  \ Calendar”。\n\n### 总结\n\n为自己迄今为止取得的进展表示祝贺。您已经取得了长足的进步。在本章中，我们学习了如何获取访问令牌以检查账户是否已关联，以及当账户未关联时该怎么做。我们学习了如何使用\
  \ Alexa 持久化适配器对 DynamoDB 表进行读写操作。我们修改了启动请求处理器，使其能在用户未关联、新关联以及已有个人资料的情况下正常工作。最后，我们添加了查看日历意图及其处理器。\n\
