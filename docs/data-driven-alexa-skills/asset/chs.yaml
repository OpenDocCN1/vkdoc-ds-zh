  \ 调用。在结果中，我们看到大量数据。在“`price`”部分下，有一个“`regularMarketPrice`”部分，其中包含 `raw`（数值）和 `fmt`（格式化字符串）格式的价格。这正是我们需要的。股票类别中还有其他几个调用也会返回\
  \ `regularMarketPrice`。然而，Yahoo Finance API 非常“嘈杂”——它返回的数据远多于我们所需。\n\n查看定价也很有必要。（见图\
