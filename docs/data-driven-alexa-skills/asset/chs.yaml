  \n1.  接着，将您的密码更改为一个足够复杂的密码，用于您的 AWS 服务的管理员账户。\n\n欢迎回到 AWS 管理控制台。每当您需要管理 AWS 服务时，请使用此管理员账户，而不是根用户账户。接下来，我们介绍\
  \ GitHub。\n\n### GitHub 访问权限\n\n本书将全程使用 GitHub 作为我们的源代码仓库。您创建的大多数技能至少会包含一些需要安全存储的代码。GitHub\
  \ 私有仓库就是这样一个安全的地方。作为替代方案，您也可以使用微软的 Azure DevOps 仓库、亚马逊的 AWS CodeCommit、Atlassian\
  \ 的 Bitbucket 或其他众多选择。我们将坚持使用 GitHub，因为它在商业领域被广泛用作标准，并且所有主流工具都与其兼容。首先，我们需要创建一个 GitHub\
  \ 账户：\n\n1.  导航至 [`https://github.com`](https://github.com)。\n\n2.  点击*注册 GitHub*。\n\
  \n3.  输入一个用户名（非您的电子邮件地址）。\n\n4.  输入您的电子邮件地址。\n\n5.  输入密码。\n\n6.  完成验证。\n\n7.  点击*创建账户*。\n\
  \n8.  验证您的电子邮件。\n\n9.  完成。您现在拥有了一个 GitHub 账户。\n\n### Jira 账户\n\nAtlassian 的 Jira\
  \ 和微软的 Azure DevOps 是两个最流行的敏捷软件项目管理工具。AWS CodeStar 和 GitHub 也提供一些项目管理功能。这些工具中的任何一个都适用于我们的目的，所以如果您有偏好，请随意选择。然而，Jira\
  \ 在开源社区中普遍使用，并且相比 Azure DevOps，其配置和开销更少，因此本书将使用 Jira 进行需求和任务管理。要创建 Jira 账户：\n\n\
