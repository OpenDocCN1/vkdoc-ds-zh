- "# 5. 编写后端代码\n\n既然我们已经为 BMI 技能创建了 VUI，我们准备在后端编写代码，让技能真正做一些有趣的事情。在我们的例子中，就是计算 BMI。在编写代码时，我们将测试我们的技能以确保其按预期工作。然后，在下一章中，我们将经历技能认证并发布到\
  \ Alexa 技能商店的过程。\n\n不过，在编写代码之前，我们需要安装工具。\n\n\n\n### 安装工具\n\n我们需要下载并安装几个工具，以便高效地处理后端代码。这些工具包括：\n\
