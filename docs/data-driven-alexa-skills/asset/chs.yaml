  \ Address`、`Give Stock`、`No More` 和 `Yes`。参见图 14-3 中的示例。\n\n![../images/504229_1_En_14_Chapter/504229_1_En_14_Fig3_HTML.jpg](img/504229_1_En_14_Fig3_HTML.jpg)\n\
  \n**图 14-3：** 添加用户意图\n\n当您对 `Botmock` 图表满意后，按照第 9 章中的流程，将其迁移到 `Alexa Developer Console`\
  \ 中的新技能。这主要涉及从 `Botmock` 设置菜单中复制用于 API 的 `.env` 文件。使用之前用过的相同令牌更新 `Token`。然后，通过输入\
  \ `npm start` 从命令行运行 `export-master` 项目。\n\n现在我们可以创建技能的骨架了。\n\n### 创建个人净资产技能\n\n\
  导出对话模型后，我们就可以将其加载到技能中。导航到 `Alexa Developer Console`。然后创建一个新的自定义技能。输入 `Personal Net\
  \ Worth` 作为技能名称。选择构建一个 *自定义* 技能，并配备 *自行配置* 的后端。然后选择 *从头开始* 模板。\n\n创建技能后，展开左侧导航栏中的交互模型选项卡。选择\
  \ `JSON Editor` 并注意其中的内容。注意到 `AMAZON.NavigateHomeIntent` 了吗？`Botmock` 不会生成它，但它是必需的，因此编辑您在上一节中生成的\
  \ `Botmock Personal Net Worth.json` 文件（可以使用 `NotePad++` 进行编辑），并添加 `AMAZON.NavigateHomeIntent`，如下所示：\n\
