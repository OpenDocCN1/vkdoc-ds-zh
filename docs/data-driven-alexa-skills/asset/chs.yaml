  \n### 编写代码\n\n前端 VUI 开发有两种模型，后端代码也有两种模型。当 VUI 使用意图模型时，后端需要有请求和意图处理器。当 VUI 使用对话模型时，后端将改为拥有\
  \ API 处理器。在接下来的章节中，当我们为 BMI 计算器技能编写代码时，我们将看到所有这些内容。\n\n#### 模板中的代码\n\n值得庆幸的是，我们用来创建\
  \ BMI 计算器的 Hello World 模板附带了不少样板代码。如果我们查看 Alexa 开发者控制台中的“构建”选项卡，然后选择左侧菜单中的“意图”，我们会看到一个\
  \ `HelloWorldIntent` 和四个内置意图（见图 5-4）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig4_HTML.jpg](img/504229_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\nHello World 技能模板附带的意图\n\n这些意图中的每一个，以及启动技能的启动请求，在 Hello World 技能模板附带的代码中都有一个处理器。现在选择顶部的“代码”选项卡，我们可以在其中看到此技能的\
  \ lambda 函数。\n\n\n\n### Lambda 函数\n\n在“代码”选项卡的 `Skill Code/lambda` 文件夹中，有一个名为 `lambda_function.py`\
  \ 的文件。（见图 5-5。）\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig5_HTML.jpg](img/504229_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n“代码”选项卡中的 `lambda_function.py` 文件\n\n该文件包含了技能 VUI 的后端，我们将在该函数中找到请求、意图和\
  \ API 处理程序代码。在亚马逊云服务（AWS）中，lambda 函数是基于云的**无服务器函数**。它们具有可扩展性，在云端运行，独立于容器或服务器，因此非常适合构建\
  \ Alexa 技能的后端。\n\n请求和意图处理程序是我们创建 Alexa 在用户说出触发意图的内容后，进行回复时所说的话语的方式。在 Python 中，每个请求、意图和\
  \ API 处理程序都实现为一个包含两个方法的 `class`：`can_handle` 和 `handle`。这些处理程序类由 VUI 通过 `SkillBuilder`\
  \ 类调用，并处理 VUI 发出的各种请求、意图和 API 调用。例如，`HelloWorldHandler` 看起来像这样：\n\n```\nclass HelloWorldIntentHandler(AbstractRequestHandler):\n\
  \"\"\"Handler for Hello World Intent.\"\"\"\ndef can_handle(self, handler_input):\n\
  # type: (HandlerInput) -> bool\nreturn ask_utils.is_intent_name(\"HelloWorldIntent\"\
  )(handler_input)\ndef handle(self, handler_input):\n# type: (HandlerInput) -> Response\n\
  speak_output = \"Hello World!\"\nreturn (\nhandler_input.response_builder\n.speak(speak_output)\n\
  # .ask(\"add a reprompt if you want to keep the session open for the user to respond\"\
  )\n.response\n)\n```\n\n请注意，在 `can_handle` 函数中，我们根据该处理程序是否是 VUI 调用的意图的正确处理程序，返回\
  \ `True` 或 `False`。然后，在 `handle` 函数中，我们在 `speak_output = \"Hello World!\"` 这一行创建\
  \ Alexa 要说的话语，并使用 `response_builder` 将其返回给 VUI，以指示 Alexa `.speak(speak_output)`。\n\
  \nlambda 函数中另一个主要关注区域在底部，那里创建了 `SkillBuilder`，并将所有请求和意图处理程序添加到其中，如下所示：\n\n```\n\
  sb = SkillBuilder()\nsb.add_request_handler(LaunchRequestHandler())\nsb.add_request_handler(HelloWorldIntentHandler())\n\
  sb.add_request_handler(HelpIntentHandler())\nsb.add_request_handler(CancelOrStopIntentHandler())\n\
  sb.add_request_handler(SessionEndedRequestHandler())\nsb.add_request_handler(IntentReflectorHandler())\
  \ # make sure IntentReflectorHandler is last so it doesn't override your custom\
  \ intent handlers\nsb.add_exception_handler(CatchAllExceptionHandler())\nlambda_handler\
  \ = sb.lambda_handler()\n```\n\n看到 `HelloWorldIntentHandler()` 是如何作为请求处理程序添加的吗？我们同样需要在这里添加我们的请求处理程序。\n\
  \n在下一节中，我们将概述需要对 lambda 函数进行的更改。如果此时代码看起来令人不知所措，这很正常。在本章的其余部分，我们将更深入地探讨 lambda 函数，你将开始了解\
  \ Alexa 应用的后端是如何形成的。\n\n#### 我们需要进行的更改\n\n我们需要做六件事来修改模板代码，使其成为我们自己的代码，如图 5-6 所示。\n\
  \n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig6_HTML.jpg](img/504229_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n我们将在本章中进行的代码更改\n\n我们需要更改的六件事如下：\n\n1.  修改启动请求处理程序，使与 Alexa 的交互与 BMI 计算器相关。\n\
  \n2.  创建一些将在 API 处理程序中使用的辅助函数。\n\n3.  为我们在 VUI 的 Alexa Conversations 部分定义的 CalculateBMI\
  \ API 创建 API 处理程序。\n\n4.  为我们在 VUI 的意图部分定义的 TellThemTheBMI 意图创建意图处理程序。\n\n5.  创建一个函数来计算\
  \ BMI。\n\n6.  在 lambda 函数底部将我们的新处理程序添加到 `SkillBuilder` 中。\n\n下一节将讨论这些更改中的第一项。后续章节将逐一讨论其余更改。\n\
  \n##### 更改启动请求处理程序\n\n我们需要对模板代码进行的第一个更改是在启动请求处理程序中（见图 5-7）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig7_HTML.jpg](img/504229_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n\n我们进行的第一个更改是针对启动请求处理程序\n\n在 `class LaunchRequestHandler` 的 `handle` 函数中，当前\
  \ Alexa 要说的话语显示为\n\n```\nspeak_output = \"Welcome, you can say Hello or Help. Which\
  \ would you like to try?\"\n```\n\n我们需要将其改为\n\n```\nspeak_output = \"Welcome, you\
  \ can ask me to calculate your b.m.i. What would you like me to do?\"\n```\n\n完成后的类将如图\
  \ 5-8 所示。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig8_HTML.jpg](img/504229_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\n完成后的 `LaunchRequestHandler` 类\n\n第二个更改稍微复杂一些，因为我们要添加一些 API 处理程序所需的辅助函数。\n\
  \n##### 创建辅助函数\n\n作为 API 处理程序的一部分，我们需要添加一些辅助函数（见图 5-9）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig9_HTML.jpg](img/504229_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\n\n第二个更改是添加辅助函数\n\n辅助函数提供了我们在 API 和意图处理程序中需要的支持功能。向下滚动到代码中的 `sb = SkillBuilder()`\
  \ 这一行。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig10_HTML.jpg](img/504229_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n\n辅助函数的位置\n\n在上面的注释上方（见图 5-10），插入以下代码：\n\n```\ndef isApiRequest(handlerInput,\
  \ apiName):\n\"\"\"Helper method to find if a request is for a certain apiName.\n\
  \"\"\"\ntry:\nreturn ask_utils.is_request_type('Dialog.API.Invoked')(handlerInput)\
  \ \\\nand handlerInput.request_envelope.request.api_request.name == apiName\nexcept\
  \ Exception:\nlogging.exception(\"Error\")\nreturn False\ndef getApiArguments(handlerInput):\n\
  \"\"\"Helper method to get API request entity from the request envelope.\n\"\"\"\
  \ntry:\nreturn handlerInput.request_envelope.request.api_request.arguments\nexcept\
  \ Exception:\nlogging.exception(\"Error\")\nreturn False\ndef getApiSlots(handlerInput):\n\
  \"\"\"Helper method to get API resolved entity from the request envelope.\n\"\"\"\
  \ntry:\nreturn handlerInput.request_envelope.request.api_request.slots\nexcept Exception:\n\
  logging.exception(\"Error\")\nreturn False\n```\n\n这三个辅助函数将 `handlerInput` 参数包装在异常处理程序中，以防请求的对象不存在或抛出错误。辅助函数就位后，向上滚动到\
  \ `HelloWorldIntent` 之后的位置，我们将在那里插入 API 处理程序。\n\n\n\n##### 创建计算 BMI 的 API 处理器\n\n\
  在本节中，我们需要为 Alexa 对话 API 创建 API 处理器（见图 5-11）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig11_HTML.jpg](img/504229_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11\n\n第三个改动是添加 API 处理器\n\n回想一下，我们已经配置了对话来调用 `CalculateBMI` API。见图 5-12 和图\
  \ 5-13。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig12_HTML.jpg](img/504229_1_En_5_Fig12_HTML.jpg)\n\
  \n图 5-12\n\nAlexa 对话模型中的 API 定义\n\n在图 5-12 的 API 定义中，我们将 API 命名为 `CalculateBMI`。它有两个参数：`height`\
  \ 和 `weight`。在接下来的对话配置（图 5-13）中，Alexa 从用户那里获取 `height` 和 `weight` 槽位值，并将它们传递给 `CalculateBMI`\
  \ 参数。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig13_HTML.jpg](img/504229_1_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13\n\nAlexa 对话中的 API 请求\n\n在后端，我们需要处理这个 API 调用，并插入 `CalculateBMIApiHandler`\
  \ 类的开头部分：\n\n```\nclass CalculateBMIApiHandler(AbstractRequestHandler):\n\"\"\"\
  Handler for CalculateBMI API.\"\"\"\ndef can_handle(self, handler_input):\n# type:\
  \ (HandlerInput) -> bool\nreturn isApiRequest(handler_input, \"CalculateBMI\")\n\
  def handle(self, handler_input):\n# type: (HandlerInput) -> Response\n# args = getApiArguments(handler_input)\n\
  # print(args)\nresponse = \"\"\nreturn response\n```\n\n现在我们需要从 `handler_input`\
  \ 中提取 `height` 和 `weight` 值并存入变量，以便计算 BMI。这些值存储在槽位中，具体来说是在所选身高和体重的槽位 ID 中。在上述 `class`\
  \ 的 `handle` 函数中，我们需要添加以下代码，该代码调用 `getApiSlots` 辅助函数，以便获取槽位 ID：\n\n```\nslots =\
  \ getApiSlots(handler_input)\nweightId = slots[\"weight\"].resolutions.\nresolutions_per_authority[0].values[0].value.id\n\
  heightId = slots[\"height\"].resolutions.\nresolutions_per_authority[0].values[0].value.id\n\
  ```\n\n然后，我们将这些 ID 值传递给尚未定义的 `CalculateBMI` 函数：\n\n```\nBMI = CalculateBMI(heightId,\
  \ weightId)\n```\n\n请记住，在第 4 章末尾，我们提到过，与其在 API 处理器中直接说出 BMI，不如将该任务委托给一个意图。因为我们的\
  \ API 是“一次性”的，这意味着它只运行一次然后终止，所以我们需要告诉 Alexa 我们已经完成了。在 Alexa 对话中无法做到这一点。你必须将该职责（或委托）移交给一个意图处理器。然后，意图处理器可以结束会话。\n\
  \n以下是将任务从 Alexa 对话委托给我们创建的 `TellThemTheBmi` 意图的代码：\n\n```\nresponseStr = \"\"\"\n\
  {\n\"directives\":\n[\n{\n\"type\": \"Dialog.DelegateRequest\",\n\"target\": \"\
  skill\",\n\"period\": {\n\"until\": \"EXPLICIT_RETURN\"\n},\n\"updatedRequest\"\
  : {\n\"type\": \"IntentRequest\",\n\"intent\": {\n\"name\": \"TellThemTheBmi\",\n\
  \"slots\": {\n\"BMI\": {\n\"name\": \"BMI\",\n\"value\": \"\"\" + str(BMI) + \"\"\
  \"\n}\n}\n}\n}\n}\n]\n}\n\"\"\"\nresponse = json.loads(responseStr)\n```\n\n我们没有在响应中传递语音文本，而是创建了一个\
  \ `type` 为 `Dialog.DelegateRequest` 的 `directive`。在该指令中，我们将 `TellThemTheBmi` 意图命名为目标意图请求，并将\
  \ `BMI value` 作为槽位传递给该意图。该指令本身是一个字符串；我们需要将其转换为 Json^(¹⁶)，以便作为处理函数的响应返回。至此，我们已经完成了\
  \ API 处理器的编写。\n\n#### 完整的 API 处理器\n\n将所有部分组合在一起，`CalculateBMI` API 处理器的定义如下。此代码可从本书在\
  \ [Apress.​com](http://apress.com) 的目录页面下载。\n\n```\nclass CalculateBMIApiHandler(AbstractRequestHandler):\n\
  \"\"\"Handler for CalculateBMI API.\"\"\"\ndef can_handle(self, handler_input):\n\
  # type: (HandlerInput) -> bool\nreturn isApiRequest(handler_input, \"CalculateBMI\"\
  )\ndef handle(self, handler_input):\n# type: (HandlerInput) -> Response\n# args\
  \ = getApiArguments(handler_input)\n# print(args)\nslots = getApiSlots(handler_input)\n\
  weightId = slots[\"weight\"].resolutions.resolutions_per_authority[0].values[0].value.id\n\
  heightId = slots[\"height\"].resolutions.resolutions_per_authority[0].values[0].value.id\n\
  BMI = CalculateBMI(heightId, weightId)\nresponseStr = \"\"\"\n{\n\"directives\"\
  :\n[\n{\n\"type\": \"Dialog.DelegateRequest\",\n\"target\": \"skill\",\n\"period\"\
  : {\n\"until\": \"EXPLICIT_RETURN\"\n},\n\"updatedRequest\": {\n\"type\": \"IntentRequest\"\
  ,\n\"intent\": {\n\"name\": \"TellThemTheBmi\",\n\"slots\": {\n\"BMI\": {\n\"name\"\
  : \"BMI\",\n\"value\": \"\"\" + str(BMI) + \"\"\"\n}\n}\n}\n}\n}\n]\n}\n\"\"\"\n\
  response = json.loads(responseStr)\nreturn response\n```\n\n完成 API 处理器后，在下一节中，我们将为\
  \ `TellThemTheBMI` 意图创建处理器——即 API 处理器所委托的意图。\n\n### 创建意图处理器\n\n我们需要进行的下一个改动是创建意图处理器，该处理器将向用户告知\
  \ BMI（见图 5-14）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig14_HTML.jpg](img/504229_1_En_5_Fig14_HTML.jpg)\n\
  \n图 5-14\n\n第四个改动是创建意图处理器\n\n这是 API 所委托的意图，名为 `TellThemTheBMI`。回想一下，我们在 VUI 中定义它，如图\
  \ 5-15 所示。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig15_HTML.jpg](img/504229_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15\n\n`TellThemTheBmi` 意图的定义\n\n`TellThemTheBMI` 意图处理器与 `HelloWorld` 意图处理器非常相似。意图处理器的主要目的是构建\
  \ Alexa 在响应用户触发该意图时所说的语音。在这种情况下，对话 API 处理器正在委托给该意图以触发它。\n\n在 `can_handle` 函数中，意图处理器类需要识别它处理的意图名称。在我们的例子中，名称是\
  \ `TellThemTheBMI`。代码如下所示：\n\n```\ndef can_handle(self, handler_input):\n# type:\
  \ (HandlerInput) -> bool\nreturn ask_utils.is_intent_name(\"TellThemTheBmi\")(handler_input)\n\
  ```\n\n在 `handle` 函数中，意图处理器类需要创建 Alexa 将说出的语音。在我们的例子中，这是告知用户他们的 BMI。首先，我们从 `Dialog.Delegate`\
  \ 指令放置的槽位中提取 BMI 值。然后，我们创建语音输出。最后，我们使用 `response_builder` 将语音作为 Json 返回，并设置一个标志以结束会话，以便\
  \ Alexa 知道我们的技能已完成。该代码如下所示：\n\n```\ndef handle(self, handler_input):\n# type: (HandlerInput)\
  \ -> Response\nBMI = handler_input.request_envelope.request.intent.slots[\"BMI\"\
  ].value\nspeak_output = f\"Awesome! Your b.m.i. is {BMI}\"\nreturn (\nhandler_input.response_builder\n\
  .speak(speak_output)\n.set_should_end_session(True)\n.response\n)\n```\n\n现在我们已经完成了完整的意图处理器。\n\
  \n\n\n"
- "# 完整的意图处理器\n\n将所有部分整合起来，我们就得到了完整的 `TellThemTheBMI` 意图处理器：\n\n```\nclass TellThemTheBmiIntentHandler(AbstractRequestHandler):\n\
  \"\"\"处理“告诉他们 BMI”意图的处理器。\"\"\"\ndef can_handle(self, handler_input):\n# type: (HandlerInput)\
  \ -> bool\nreturn ask_utils.is_intent_name(\"TellThemTheBmi\")(handler_input)\n\
  def handle(self, handler_input):\n# type: (HandlerInput) -> Response\nBMI = handler_input.request_envelope.request.intent.slots[\"\
  BMI\"].value\nspeak_output = f\"太棒了！你的身体质量指数是 {BMI}\"\nreturn (\nhandler_input.response_builder\n\
  .speak(speak_output)\n.set_should_end_session(True)\n.response\n)\n```\n\n现在我们已经编写好了意图处理器和\
  \ API 处理器，接下来可以专注于数学计算了。\n\n### 计算 BMI 的方法\n\n接下来，我们需要计算 BMI（见图 5-16）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig16_HTML.jpg](img/504229_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16\n\n创建计算 BMI 的方法\n\n我们从用户那里获得了槽位 ID。这些 ID 旨在为我们提供所需的数字。对于体重，ID 是 `nnnkg`\
  \ 或 `nnnlb`。通过去掉最后两个字符，我们就能得到体重值。同样地，对于身高，ID 要么是英寸的整数，要么是 `nnncm`。处理这四种情况的函数可以放在我们之前添加的辅助方法之后，如下所示：\n\
  \n```\ndef CalculateBMI(heightId, weightId):\n# print(heightId, weightId)\nif 'cm'\
  \ in heightId:\n# 厘米\nmeters = float(heightId[0:-2]) / 100.0\nelse:\n# 英寸\nmeters\
  \ = float(heightId) * 0.0254\nif 'kg' in weightId:\n# 千克\nkilos = float(weightId[0:-2])\
  \ * 1.0\nelse:\n# 磅\nkilos = float(weightId[0:-2]) / 2.20462\nbmi = round(kilos\
  \ / meters ** 2, 1)\nreturn bmi\n```\n\n各位先生女士，到此就结束了。几乎结束了。还剩最后一步。\n\n### 将请求处理器添加到技能构建器\n\
  \n在 lambda 函数的底部，我们需要将新的意图处理器和新的 API 处理器添加到 `SkillBuilder` 中（见图 5-17）。\n\n![../images/504229_1_En_5_Chapter/504229_1_En_5_Fig17_HTML.jpg](img/504229_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17\n\n最后一步，将处理器添加到 `SkillBuilder`\n\n滚动到 `lambda_function.py` 文件的末尾，为我们的每个新处理器插入\
  \ `add_request_handler()` 行。这些行应放在列表顶部附近，但在 `LaunchRequestHandler()` 之后，如下所示：\n\n\
  ```\nsb = SkillBuilder()\nsb.add_request_handler(LaunchRequestHandler())\nsb.add_request_handler(TellThemTheBmiIntentHandler())\n\
  sb.add_request_handler(CalculateBMIApiHandler())\nsb.add_request_handler(HelpIntentHandler())\n\
  sb.add_request_handler(CancelOrStopIntentHandler())\nsb.add_request_handler(SessionEndedRequestHandler())\n\
  ```\n\n趁现在，你需要删除添加 `HelloWorldIntentHandler()` 请求处理器的行。既然我们已经删除了 Hello World 意图，就不再需要它的处理器了。\n\
  \n现在，我们完成了！\n\n在右上角，点击保存（这不是你第一次这样做，对吧？），然后点击部署。定义了 VUI 并部署了代码后，我们就可以开始测试了！\n\n\
