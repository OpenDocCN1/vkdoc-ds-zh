  \ = json.loads(response.text)\n                    price = float(0)\n          \
  \          if STOCK_API == 'YAHOO':\n                        try:\n            \
  \                price = float(\n                                result[\"price\"\
  ][\"regularMarketPrice\"][\"raw\"])\n                        except:\n         \
  \                   price = 0\n                    else:\n                     \
  \   try:\n                            price = float(result[\"Global Quote\"][\"\
  05\\. price\"])\n                        except:\n                            price\
  \ = 0\n                    totalValue += price * float(quantity)\n            time.sleep(rate)\n\
  \    return round(totalValue, 2)\n```\n\n现在我们需要用几种不同的方式来测试这个函数。\n\n#### 对 `GetStockValue`\
  \ 函数进行单元测试\n\n我们需要在以下条件下测试 `GetStockValue` 函数：\n\n1.  缺少 `profile[\"stocks\"]` 字典\n\
  2.  空的 `profile[\"stocks\"]` 字典\n3.  一个包含一只股票且数量有效（非零）的配置文件（用于测试 API 请求）\n4.  一个包含无效股票代码和有效数量的配置文件（用于测试错误处理）\n\
  5.  一个包含一只股票且数量为零的配置文件（用于测试跳过逻辑）\n6.  一个包含三只股票，每只数量都有效的配置文件（用于测试循环）\n7.  一个包含三只股票，其中一只数量为零的配置文件（用于测试循环中的跳过逻辑）\n\
  8.  一个包含 20 只股票的配置文件（用于正确测试延迟）\n\n呼！测试真不少。如果我们像处理房屋价值那样，把这些测试直接插入到启动请求处理器中，会使它变得杂乱不堪。那我们该怎么办呢？\n\
  \n创建单元测试的一种常见方法是将它们放在一个并行的模块中，也就是说，在 `api_calls.py` 模块旁边，我们可以添加一个 `api_calls_tests.py`\
  \ 模块。（见图 16-3。）\n\n![../images/504229_1_En_16_Chapter/504229_1_En_16_Fig3_HTML.jpg](img/504229_1_En_16_Fig3_HTML.jpg)\n\
  \n**图 16-3** 添加 `api_calls_tests.py` 模块\n\n在新的测试模块中，添加日志记录和 `api_calls` 的导入（包括新的\
  \ `GetStockValue` 函数）：\n\n```python\nimport logging\nfrom api_calls import GetHomeValue,\
  \ GetStockValue\nlogger = logging.getLogger(__name__)\nlogger.setLevel(logging.INFO)\n\
  ```\n\n然后添加一个名为 `UnitTests()` 的函数：\n\n```python\ndef UnitTests():\n```\n\n现在，将我们之前插入到启动请求处理器中的\
  \ `GetHomeValue` 测试代码全部移入这个新模块的一个测试函数中。之后，该模块应如下所示：\n\n```python\nimport logging\n\
  from api_calls import GetHomeValue, GetStockValue\nlogger = logging.getLogger(__name__)\n\
  logger.setLevel(logging.INFO)\n\ndef UnitTests():\n    TestGetHomeValue()\n\ndef\
  \ TestGetHomeValue():\n    profile = {}\n    profile[\"street_address\"] = \"1234\
  \ Main Street\"\n    profile[\"city\"] = \"Nashville\"\n    profile[\"state\"] =\
  \ \"TN\"\n    profile[\"zip_code\"] = 37206\n    profile[\"homestats\"] = {\n  \
  \      \"property_type\": \"Single Family\",\n        \"square_footage\": 2250,\n\
  \        \"bedrooms\": 4,\n        \"baths\": 3\n    }\n    logger.info(f\"Calling\
  \ GetHomeValue with profile: {profile}\")\n    homeValue = GetHomeValue(profile)\n\
  \    logger.info(\n        f\"Back from calling GetHomeValue, asserting homeValue\
  \ is non-zero. HomeValue is {homeValue}\")\n    assert homeValue != 0, \"Home Value\
  \ is 0, expected a non-zero result.\"\n```\n\n请注意使用日志记录来明确单元测试的进度。同时，注意最后一行中 `assert`\
  \ 语句的使用。这就是 Python 确保我们在使用示例地址调用 `GetHomeValue` 函数时能获得一个值的方式。\n\n要运行测试，请编辑 `lambda_function.py`。修改与之前相同的启动请求处理器。现在它将调用\
  \ `UnitTests` 函数，而不是自己进行测试。首先，编辑导入部分：\n\n```python\nfrom api_calls import GetHomeValue,\
