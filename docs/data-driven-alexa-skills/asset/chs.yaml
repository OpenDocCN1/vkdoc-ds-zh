  6. 确认您的身份。\n7. 选择“基本支持 – 免费计划”（图 3-5）。\n\n欢迎使用 AWS 管理控制台（图 3-6）！\n\n![../images/504229_1_En_3_Chapter/504229_1_En_3_Fig6_HTML.jpg](img/504229_1_En_3_Fig6_HTML.jpg)\n\
