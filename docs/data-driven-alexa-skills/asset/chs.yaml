  \ 技能的测试后，就可以将其发布到 Alexa 技能商店了。\n\n### 总结\n\n在本章中，我们编写并测试了 BMI 计算器技能的后端代码。我们学习了 lambda\
  \ 函数以及请求、意图和 API 处理器。我们在本地机器上设置并使用了调试环境。随着我们深入更复杂的技能，所有这些概念都将在本书中反复出现。在下一章中，我们将把\
  \ BMI 计算器技能发布到 Alexa 技能商店。\n\n脚注 1 2\n\n## 6. 发布 Alexa 技能\n\n现在我们已经有了一个可以正常运行的技能，准备提交审批并发布到\
  \ Alexa 技能商店。认证有几个步骤。本章将探讨这些步骤，并学习如何驾驭这一流程，以便尽可能快速高效地让我们的技能通过认证并发布。首先，我们将了解认证流程。然后，我们将完成分发表格和验证测试。接着，我们将讨论一些发布规则和要求。最后，我们将审视一些你可能遇到的问题以及如何解决它们。\n\
  \n### 流程\n\n认证流程相对直接。你填写分发详细信息，然后将技能提交给自动化验证测试，修复出现的任何错误或警告，直到验证通过。然后，你将技能提交给认证团队。他们将审查和测试你的技能，以确保其符合认证标准，如果不符合，他们会告知你原因。在你解决了他们提出的问题后，技能将通过认证并发布到\
  \ Alexa 技能商店。在下一节中，我们将填写分发表格，让我们的技能通过验证流程。\n\n### 分发与验证\n\n在第 4 章和第 5 章中，我们创建了一个\
  \ BMI 计算器技能，现在我们希望将其发布。不过，首先还需要做一些收尾工作。在 Alexa 开发者控制台中选择“分发”选项卡。然后填写所需信息，如图 6-1\
  \ 所示。\n\n![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig1_HTML.png](img/504229_1_En_6_Fig1_HTML.png)\n\
  \n图 6-1\n\n开发者控制台的“分发”选项卡\n\n\n\n#### 技能预览\n\n在`技能预览`部分，你需要填写在技能商店中创建条目所需的字段。例如技能的名称、描述和图标。下面我们将逐一介绍这些选项。\n\
  \n**公开名称** 输入你希望该技能在公众面前呈现的名称。这通常不是你的调用名称。长度必须少于 50 个字符。对于 BMI 计算器，公开名称可以是“我的 BMI\
  \ 是多少？”\n\n**一句话描述** 一句简短描述该技能的话。Alexa 在向用户介绍你的技能时可能会用到这句话。对于 BMI 计算器，一句话描述可以是“一个简单的身体质量指数（B.M.I.）计算器。”\n\
  \n**详细描述** 技能的完整描述，包括使用说明以及你认为用户在技能商店中查找该技能时需要了解的任何信息。任何硬件要求，例如屏幕、Echo Buttons、Echo\
  \ Auto 或智能家居设备，都应在此处说明。注意：详细描述会显示在 Alexa 应用中你技能的卡片上，因此也请考虑这一点。例如，请参见图 6-2 中的产品卡片。\n\
  \n![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig2_HTML.png](img/504229_1_En_6_Fig2_HTML.png)\n\
  \n图 6-2\n\nAlexa 应用中的产品卡片\n\n对于 BMI 计算器，详细描述可以是“尝试让 Alexa 计算你的 B.M.I.。你可以用英尺、英寸或厘米指定身高。你可以用磅、公斤或英石指定体重。”\n\
  \n**新增功能？** 由于这是技能的第一个版本，我们可以将此字段留空。当你修订技能并添加新功能时，应在`新增功能`框中记录这些变更和修复。\n\n**示例短语**\
  \ 示例短语是认证过程中最繁琐的部分之一。你必须确保每个示例短语与意图或对话中的表述完全匹配。第一个示例必须包含唤醒词 Alexa 和调用名称。由于我们的技能是对话式的，第二和第三个示例不必包含这些内容，而应展示用户如何与\
  \ Alexa 发起对话。对于 BMI 计算器，示例短语可以是：\n\n1.  `Alexa open simon’s b. m. i. calculator`\n\
  \n2.  `What’s my b.m.i.?`\n\n3.  `Calculate my b.m.i.`\n\n请记住，它们必须与表述匹配，因此拼写和标点应与\
  \ Alexa 开发者控制台`构建`选项卡中使用的保持一致。\n\n**小技能图标** 这需要是一个 108 × 108 像素的 PNG 或 JPG 图片，但由于它必须适配圆形，因此需要是一个直径为\
  \ 108 像素的圆形图标。这里有一个指向 Alexa 技能图标生成器的链接，你可以用它创建自己的图标（见图 6-3）。\n\n![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig3_HTML.jpg](img/504229_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\nAlexa 技能图标生成器\n\n在图标编辑器下方，有数百个图形可供选择，用于放入你的徽标中（见图 6-4），或者你也可以将图标下载为模板，在你选择的图形编辑器中编辑。\n\
  \n![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig4_HTML.jpg](img/504229_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\n可添加到图标中的图形\n\n**大技能图标** 你需要为你创建的图标准备两种尺寸：108 × 108 像素和 512 × 512 像素。一个用于小技能图标，一个用于大技能图标。\n\
  \n**类别** 为你的技能选择最合适的类别。这将是你的技能在 Alexa 技能商店中的分类。对于 BMI 计算器，类别可以是*游戏与问答 – 知识与问答*。\n\
  \n**关键词** 输入一个逗号分隔的关键词列表，以帮助用户找到你的技能。对于 BMI 计算器，关键词可以是“Body, Mass, Index, B.M.I.”\n\
  \n**隐私政策 URL** 在美国，联邦贸易委员会建议任何共享或收集（存储）消费者数据的网站都应制定隐私政策。许多州有更严格的要求。加拿大有关于在线隐私的规定。此外还有\
  \ GDPR（欧盟通用数据保护条例），它适用于任何在欧盟处理消费者数据或向欧盟个人提供服务的人。\n\n根据商业改进局的文章《BBB 提示：为你的企业网站撰写有效的隐私政策》（[`www.bbb.org/article/news-releases/21390-bbb-tip-writing-an-effective-privacy-policy-for-your-small-business-website`](http://www.bbb.org/article/news-releases/21390-bbb-tip-writing-an-effective-privacy-policy-for-your-small-business-website)），“无论法律是否要求你的企业这样做，制定并维护一份隐私政策都是一个好主意……请务必做到以下几点：\n\
  \n*   保持可见。\n\n*   保持简洁。\n\n*   保持真实。\n\n*   保持更新。”\n\n网上有多种隐私政策生成器。花费不到 100 美元，它们就能让你明确：\n\
  \n*   你通过技能收集哪些信息\n\n*   你为何收集这些信息\n\n*   你如何收集和存储这些信息\n\n*   你如何保护这些信息\n\n*   用户如何控制或管理他们的数据\n\
  \n*   当政策更新时，你将如何告知技能用户\n\n*   或许最重要的是，谁有权访问你的信息\n\n拥有一份可接受的隐私政策将有助于你赢得并维持技能用户的信任。当你发布技能的新版本时，请务必更新你的隐私政策。\n\
  \n尽管如此，由于我们不会存储任何可识别用户身份的数据，对于 BMI 计算器，我们可以将隐私政策 URL 留空。\n\n**使用条款 URL** 技能的另一个重要组成部分是使用条款，与隐私政策一样，这有助于建立信任。使用条款是你作为技能开发者与想要使用你技能的人之间的法律协议。用户通过使用你的技能，即默示同意遵守使用条款。与隐私政策一样，网上有多种使用条款生成器。使用条款通常涵盖：\n\
  \n*   用户的权利和责任。\n\n*   正确或预期的技能使用方式。用户在其在线行为中应负责什么？\n\n*   什么是滥用或不当行为？后果是什么？\n\n\
  *   任何付款细节，支付内容、方式、订阅费用等。\n\n*   用户如何选择退出并终止其账户。\n\n*   争议解决和管辖权。\n\n*   责任限制，说明你承担和不承担哪些责任，以及如何评估损害赔偿。\n\
  \n*   用户如何知晓条款变更。\n\n请确保在使用条款中明确说明任何个人身份信息，如何处理这些信息，以及如何删除这些信息。如果你在技能中使用账户关联来访问用户的亚马逊账户，这一点尤其重要。对于\
  \ BMI 计算器，我们可以将使用条款 URL 留空。\n\n完成`技能预览`部分后，点击`保存`并继续进入分发问卷的`隐私与合规`部分。\n\n\n\n####\
  \ 隐私与合规\n\n如图 6-5 所示，**隐私与合规**部分包含一组问题，旨在从隐私与合规角度大致界定您的技能功能。\n\n![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig5_HTML.jpg](img/504229_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5  \n隐私与合规部分\n\n前几个问题相当直接，下文将详细说明。测试说明将在下一节中解释。\n\n**此技能是否允许用户进行购买或花费真实货币？**\
  \ 这包括鼓励人们花钱，例如，鼓励用户访问网站进行捐赠或购买。对于 BMI 计算器，我们可以回答“否”。\n\n**此 Alexa 技能是否收集用户的个人信息？**\
  \ 这个问题比较棘手，因为它涵盖了通过您的技能或账户关联收集的个人信息。您还需要考虑这些个人信息是否与个人相关联。以我们的 BMI 计算器为例，我们获取的数据（身高和体重）不与个人关联，仅用于\
  \ BMI 计算。我们也不存储结果，这在考虑问题中“收集”一词时是相关的。此外，您只能收集技能运行所必需的用户数据。对于 BMI 计算器，我们可以回答“否”。\n\
  \n**此技能是否面向或针对 13 岁以下的儿童？** 有许多保护儿童的法律法规，因此这个问题意味着您需要了解这些规则和法规，并确保您的技能遵守它们。对于 BMI\
  \ 计算器，我们可以回答“否”。\n\n**此技能是否包含广告？** 对于 BMI 计算器，我们可以回答“否”。\n\n**出口合规** 此复选框为必填项，因此我不确定如果您的技能未能“……完全遵守所有适用的进出口法律法规”，您会怎么做。我猜想那样的话，您的技能根本无法发布。对于\
  \ BMI 计算器，我们可以勾选此框。\n\n下一节将介绍测试说明框，这对于您的技能通过认证流程至关重要。\n\n#### 测试说明\n\n正如测试说明提示中所说：“请详细说明我们的团队测试您的技能所需的任何特殊说明。包括任何账户或硬件要求。如果您的技能请求权限，请包含测试这些权限请求的方法。”\n\
  \n测试说明不必详尽无遗地涵盖所有可能的测试方式，但应做到全面且精确。请确保包含测试技能“快乐路径”及其任何变体的步骤。技能的“快乐路径”是指用户正确回答每个问题并做出最优选择时所遵循的路径。“非快乐路径”则以已知方式偏离快乐路径。在我们的\
  \ BMI 计算器中，我们只有一条快乐路径（Alexa 询问身高和体重，并获取身高和体重），没有非快乐路径。我们也不处理任何错误路径。例如，如果 Alexa 询问您的身高，而您回答“鱼”，该怎么办？请包含您能想到的任何用于测试技能所处理的非快乐路径场景的说明。在我们的案例中，测试说明相对简单。某些技能可能有特定的硬件要求，例如“此技能在带屏幕的设备上效果最佳”。某些技能需要账户关联和其他权限，这些都需要在此列出并进行测试。这也是您阐述需要账户关联和额外权限的理由的地方——您提供给技能认证团队的信息越多越好。\n\
  \n对于 BMI 计算器，测试说明可能如下所示：“这是一个非常简单的技能，仅用于计算您的 BMI。请使用英尺和英寸、仅英寸或厘米来测试身高，并使用磅、英石或千克来测试体重。”如果\
  \ BMI 计算器技能比现在更复杂，这些说明将不够充分，我们很可能无法凭借如此简短的说明通过认证。\n\n屏幕底部有一个小提示，提醒您确保您的技能符合所有 Alexa\
  \ 政策和认证要求。在整个技能开发过程中考虑这些要求至关重要。对于 BMI 计算器，它符合这些要求，但对于我们将要创建的一些技能，这些要求并非微不足道。在下一节中，我们将详细讨论认证检查清单。\n\
  \n### 认证检查清单\n\n在 Alexa 开发者文档中，有一份认证提交检查清单（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/certification-requirements-for-custom-skills.html`）。您应该为您编写的每个技能考虑这些要求。它们如下：\n\
  \n1.  确保您的技能符合 Alexa 政策指南。\n2.  确保您的技能满足托管技能服务方式的安全要求。\n3.  执行所有必需的功能测试。\n4.  执行所有必需的语音界面和用户体验测试。\n\
  5.  如果您的技能包含基于屏幕的交互，请测试技能的基于屏幕的交互。\n6.  如果您的技能包含提醒，请确保使用测试说明描述您如何在技能中实现提醒功能。\n7.\
  \  如果您的技能符合“与 Alexa 配合使用”计划或“人类认证”计划的资格，请确保您的设备和技能符合“与 Alexa 配合使用”计划指南和“人类认证”计划指南。\n\
  8.  如果您的技能允许用户通过 Alexa 或您的技能引用的任何网站进行购买或花钱，请确保遵循允许购买的技能的要求。\n\n有关完整和最新的要求，您应查阅 Amazon\
  \ Alexa Skills Kit 文档。在接下来的几节中，我们将详细阐述检查清单中的每一项。\n\n\n\n#### Alexa 政策\n\n您的技能必须遵守亚马逊的\
  \ Alexa 政策（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html`）。如果不遵守，您的技能将被拒绝。其中部分政策如下：\n\
  \n1.  **商标、知识产权和品牌。** 您必须拥有在技能中使用的任何此类内容的权利，并且必须在测试说明中提供相关证明文件。例如，如果我们将技能命名为“Nike\
  \ BMI 计算器”，则必须提供我们有权使用 Nike 名称的证据。如果没有充分的证据，我们的技能将无法通过认证。\n\n2.  **面向儿童的 Alexa 技能**（`https://developer.amazon.com/en-US/alexa/alexa-skills-kit/get-deeper/custom-skills/kid-skills`）。您必须是亚马逊批准的开发者，才能为\
  \ 13 岁以下（或美国及印度以外的地区为 16 岁以下）的儿童开发技能。针对儿童技能，存在若干特定的法律和政策考量，例如《儿童在线隐私保护法》（“COPPA”）和亚马逊的家长同意要求。\n\
  \n3.  **健康。** 健康技能分为两类：符合 HIPAA 要求的和不符合的。要具备处理受保护健康信息（PHI）的资格，您的技能必须遵守美国 1996 年《健康保险流通与责任法案》（HIPAA）。您还必须是亚马逊批准的健康技能开发者（`https://developer.amazon.com/en-US/alexa/alexa-skills-kit/get-deeper/custom-skills/healthcare-skills`）。所有其他与健康相关的技能必须在技能描述中包含书面免责声明，说明该技能不能替代专业医疗建议。在某些情况下，Alexa\
  \ 团队还会要求您的技能在技能内提供口头免责声明。\n\n4.  **技能推荐、报酬和购买。** 如果您的技能销售任何物品（数字或实物）（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/requirements-for-skills-that-allow-purchases.html`）或以任何方式（购买、捐赠等）建议用户花钱，您必须使用\
  \ Alexa 批准的渠道进行。例如，数字商品和服务必须通过 Alexa 技能内购买功能（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/requirements-for-skills-that-allow-purchases.html#digital`）进行。实物产品或服务（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/requirements-for-skills-that-allow-purchases.html#non-digital`）或慈善捐赠（`https://pay.amazon.com/secure-checkout/non-profits`）必须正确使用\
  \ Amazon Pay 和账户关联。\n\n5.  **广告。** 技能回复中大多数广告和促销信息是被禁止的（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#5-advertising`）。例外情况包括提供音频广告的流媒体技能、技能内购买促销以及回应客户的特定请求。\n\
  \n6.  **色情与性。** 禁止出现露骨的性内容或图像（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#cert-pornography-and-sex`）。\n\
  \n7.  **暴力。** 禁止出现极端暴力、有组织犯罪、恐怖主义和其他非法活动（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#cert-violence`）。\n\
  \n8.  **宗教、种族和文化。** 此政策主要是关于防止仇恨犯罪（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#cert-religion`）。\n\
  \n9.  **紧急服务（电信）。** 您的技能不能拨打 911 或任何其他紧急响应电话（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#9-emergency-services-telecommunications`）。\n\
  \n10. **内容。** 此政策是禁止不良行为的兜底条款（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#cert-content`）。如果您的技能不宣扬不良行为，那就没问题。如果宣扬，则可能因违反内容政策而被拒绝。\n\
  \n11. **一般性规定。** 此政策（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#11-general`）要求您完成本章其余部分概述的步骤，并倡导友善、礼貌以及良好维护\
  \ Alexa 品牌形象。\n\n12. **网络搜索技能。** 如果您的技能是搜索技能，则必须搜索特定的在线资源，注明该来源，并遵守所有其他政策（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#12-web-search-skills`）。\n\
  \n13. **金融技能。** 如果您提供股票报价，请附上关于其时效性的免责声明。如果您访问个人财务信息，则必须满足所有金融技能指南。仅允许美国金融技能。要在美国创建金融或银行技能，您必须联系亚马逊以获得其批准（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/policy-testing-for-an-alexa-skill.html#13-financial-skills`）。\n\
  \n14. **调用名称要求。** 您的技能的调用名称有一些非常具体的要求（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/choose-the-invocation-name-for-a-custom-skill.html#cert-invocation-name-req`）。注意：这不是技能的名称，而是用户用来调用您的技能时所说的内容。主要要求是您的技能调用名称清晰、准确且易于用户重复。它还应该合理、实用且与您的技能相关。它不能包含您不拥有的品牌/知识产权术语。\n\
  \n\n\n"
- '# 15. 安全策略 – Web 服务

  在建立连接时，您必须使用亚马逊批准的证书颁发机构，并提供有效、可信的证书。


  '
- '# 16. 安全策略 – 账户关联

  有许多特定于账户关联的策略。如果您的技能需要连接到另一个系统，这就属于账户关联。关联账户必须受到保护并进行监控。您必须在“技能预览”部分提供隐私政策和服务条款的
  URL。别忘了在测试说明中包含一组虚拟凭据，以便认证团队能够测试您的技能。如果您的技能是智能家居技能，则还有额外的安全要求，特别是当您的技能允许解锁或解除设备布防时。


  '
- '# 17. 安全策略 – PII 处理

  只有在您的技能需要时，才能收集个人身份信息 (PII)，并且在需要时，必须正确处理这些信息（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/security-testing-for-an-alexa-skill.html#25-privacy-requirements`）。


  '
- '# 18. 安全策略 – 语音验证码

  某些类型的技能，包括金融技能和允许超过 100 美元购买的技能，必须让客户有机会设置语音验证码（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/security-testing-for-an-alexa-skill.html#voice-code-requirements`）。


  即使您的技能满足所有这些策略要求，认证团队仍可能拒绝它。如果发生这种情况，他们会告诉您原因。进行必要的更正并重新提交，或者对他们的决定提出申诉，请求他们重新考虑。大多数技能在成功提交之前至少会被拒绝一次，但这通常不是因为违反策略。更常见的原因是测试失败。


  #### 为认证测试您的自定义技能


  您的技能在获得认证团队批准之前，将经历多轮测试。大多数测试将集中在您在测试说明中输入的数据上。您可以通过执行以下操作来帮助确保您的技能通过这些测试：


  1.  检查并测试您的三个示例语句。在“技能预览”页面，您必须提供三个示例语句，如本章前面所述。确保这些语句有效。

  2.  确保您的技能描述和详细信息页面准确无误。测试人员会将这些内容作为指导，并验证技能描述和详细信息页面中隐含的所有功能。

  3.  确保所有视觉响应（卡片、流式输出或 Alexa 演示语言 (APL) 输出）按预期工作。

  4.  确保您的技能中没有损坏的链接。确保所有外部链接都能正常工作。

  5.  为任何使用账户关联的技能提供链接到您开发者账户的测试凭据。

  6.  确保您的账户关联技能能够正常启用、关联、取消关联和禁用。

  7.  确保音频响应（流式输出或用于音频的 Alexa 演示语言 (APLA) 输出）按预期工作。

  8.  如果您的技能提供可视化界面，请确保它在所有相关设备上正确显示，并且屏幕导航选项按预期工作。

  9.  确保您在技能中集成的任何 API 按预期工作。

  10. 不要在技能描述中声明您的技能是测试版或试用版技能。这样无法通过认证。只有正式版技能才能通过认证。

  11. 检查您的意图、表述和槽位，确保它们正确、完整，并遵循语音设计最佳实践。

  12. 您必须通过语音交互来测试您的技能，而不仅仅是在模拟器中输入。

  13. 测试您的 VUI，确保流程顺畅且会话管理良好。确保意图和槽位协同工作正确、听起来自然，并遵循 Alexa 设计指南的建议（`https://developer.amazon.com/en-US/docs/alexa/alexa-design/get-started.html`）。确保当用户未填写所有槽位时，您的技能能提供支持性提示。

  14. 如果您提供一次性体验，请确保其正常工作并按预期结束会话。

  15. 确保多种表述都能正确触发您的技能。

  16. 确保您能优雅地处理错误。

  17. 您的技能必须提供一个帮助意图。

  18. 当客户要求时，您的技能必须能够停止、取消和结束。


  呼。策略和测试真不少。不过别担心。如果您的技能合理、礼貌、友好且优质，它很可能会通过策略要求；如果它能正常工作，也应该能通过测试要求。在本书后面，我们将深入讨论
  VUI 设计。我们还将学习几种不同的功能测试技术，以确保技能按预期工作。


  现在，我们准备进入“技能预览”页面的下一页：“可用性”。


  ### 可用性


  您的技能一旦进入技能商店，就可以向公众开放。如果您创建的是 Alexa for Business 技能，您可以选择将技能发布到特定的商业组织。


  如果您想对技能进行 Beta 测试，即将其发布到技能商店，但访问权限仅限于通过电子邮件地址指定的特定用户，您可以输入他们的电子邮件地址。（见图 6-6。）Beta
  测试模式的优势在于，即使技能已在技能商店中，您仍可以继续开发它。您最多可以添加 500 名 Beta 测试人员。


  ![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig6_HTML.jpg](img/504229_1_En_6_Fig6_HTML.jpg)


  图 6-6


  为您的技能添加 Beta 测试人员


  如果您希望您的英语（美国）技能在其他英语国家可用，您可以选择自动区域分发。这也适用于其他语言。


  最后，您需要选择您的技能在哪些国家可用——是所有国家，还是仅限特定国家。


  至此，您已完成预提交流程。现在，您可以进入“验证与提交”环节。


  ### 验证


  在“验证”屏幕上，单击 `运行` 按钮，运行一系列自动化测试来验证您的技能。根据技能的复杂程度，这可能需要一些时间。如果一切顺利，您将看到一个绿色的勾选标记，如图
  6-7 所示。


  ![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig7_HTML.jpg](img/504229_1_En_6_Fig7_HTML.jpg)


  图 6-7


  您的技能已通过验证


  趁一切还没变化，赶紧点击左侧的“提交”选项卡。


  ### 提交


  提交过程的最终决定摆在您面前。您是选择认证并发布您的技能到 Alexa 技能商店，还是费了这么大劲只是为了认证技能以便日后发布？您可能需要配合营销活动来安排发布，在这种情况下，您只需认证技能即可。所以，请仔细考虑。做出选择。然后点击那个大大的蓝色
  `提交审核` 按钮（图 6-8）！


  ![../images/504229_1_En_6_Chapter/504229_1_En_6_Fig8_HTML.jpg](img/504229_1_En_6_Fig8_HTML.jpg)


  图 6-8


  来吧，点击它。你知道你想点 ![../images/504229_1_En_6_Chapter/504229_1_En_6_Figa_HTML.gif](img/504229_1_En_6_Figa_HTML.gif)


  既然您已经提交了技能进行审核，您可以放松几天，等待认证团队完成他们的工作。然后，如果您的技能通过了认证，您就需要着手撰写营销活动方案了。否则，您会收到一封电子邮件，说明您的技能未通过的原因。




  ### 被拒？接下来怎么办？


  如果你的技能第一次未能通过认证（这很常见），首先要做的是阅读解释未通过原因的邮件。这看似显而易见，但你会惊讶地发现，有多少开发者会直接开始重写技能。大多数拒绝原因是违反政策，而非编码错误。


  大多数情况下，如果你不理解违规原因，可以通过“联系我们”页面（`https://developer.amazon.com/support/contact-us`）提交工单。收到工单编号后，你可以在“分发”选项卡的“技能预览”页面的“测试说明”框中引用该工单及其中提出的问题。


  Alexa 团队整理了一个网页，详细列出了认证失败的常见原因（`https://developer.amazon.com/en-US/docs/alexa/custom-skills/troubleshooting-common-certification-failures.html`）。你可以浏览此列表，获取常见失败的更多细节和示例。以下列出其中一部分。


  以下是认证失败的一些常见原因。这些原因按常见问题领域分组。


  **技能描述问题**


  -   技能的详细描述应包含使用该技能所需的所有信息。

  -   技能描述中描述的功能应在技能中存在并按描述正常工作。

  -   描述中的任何示例语句应能完全按照书面形式在技能中正常工作。


  **示例语句问题**


  -   确保技能预览中的三个示例语句按预期工作。它们不应抛出错误，应提供相关且正确的响应。

  -   不要在示例语句中使用特殊字符、数字或日期。请拼写出来。例如，如果示例语句使用了日期，请完整写出：January first, nineteen-eighty（一月一日，一九八零年）。

  -   示例语句必须作为语句存在于技能定义中。

  -   示例语句隐含的一次性语句也应能正常工作。例如，示例语句说：“Six foot two and three hundred pounds（六英尺二英寸，三百磅）。”这暗示用户可以这样说：“Alexa，启动我的
  b.m.i. 计算器，告诉它我六英尺二英寸，三百磅。”Alexa 应响应此一次性语句：“您的 b.m.i. 是 38.5。”

  -   如果词语稍有变化，示例语句也应能正常工作。例如，示例“Six foot two and three hundred pounds”应按所示方式工作。但“*I
  am* six foot two and *weigh* three hundred pounds（*我*六英尺二英寸，*重*三百磅）”也应如此。“*I am*
  six foot two *inches tall*, and *I weigh* three hundred pounds（*我*六英尺二*英寸高*，*体重*三百磅）”也应如此。

  -   语句在您的技能中应是唯一的，以防止两个意图冲突。

  -   语句应使用正确的语言。例如，如果您的技能支持美式英语和美式西班牙语，请确保英语语句在英语区域设置中，西班牙语语句在西班牙语区域设置中。


  **技能会话状态问题**


  -   确保在能直观显示麦克风状态的设备上测试您的技能（例如您的智能手机、Amazon Echo 或 Echo Show）。如果蓝灯亮起，表示 Alexa 正在监听。如果
  Alexa 正在监听，她应该刚刚问了一个问题或给出了一个提示，期望用户做出回应。

  -   如果您的技能是一次性技能，请确保在 Alexa 响应后结束会话。例如：


  用户说：“Alexa，我的 b.m.i. 是多少？”


  Alexa 说：“您的身高和体重是多少？” – 蓝灯亮起，Alexa 正在监听。


  用户说：“六英尺二英寸，三百磅。”


  Alexa 说：“您的 b.m.i. 是 38.5。” – 蓝灯应在会话结束时熄灭。如果蓝灯保持亮起，表示 Alexa 正在等待用户响应，您的技能将无法通过认证。请确保正确结束会话。


  一旦解决了导致技能认证失败的问题，请务必更新“分发”选项卡中“技能预览”的文档，尤其注意“测试技能”框。不要犹豫，向测试人员添加注释来解释您技能的行为。您也可以通过“联系我们”页面向他们发送消息，进一步解释您的技能。准备好后，重新提交技能进行认证。重复此过程，直到技能通过。有时，由于错误或拒绝原因可能显得晦涩难懂，这会令人沮丧。我曾见过一个向玩家出售宇宙飞船的游戏技能反复被拒，因为它没有实现应用内购买来支付飞船费用。有时，您需要反复解释自己，直到通过流程。很快，您就能通过流程，您的技能将在
  Alexa 技能商店上线。


  ### 总结


  在本章中，您发布了您的技能！


  哇哦，太棒了！给自己来个全方位的击掌庆祝吧。


  我们填写了分发表格，提供了通过认证所需的信息。我们检查了认证清单。我们甚至回顾了 Alexa 政策以及一些认证测试建议。我们介绍了提交过程中可能遇到的情况以及如何处理拒绝。


  本书第一部分到此结束。我们从零开始创建了一个 Alexa 技能，并经历了从 VUI 开发到发布的整个数据驱动技能构建过程。在第二部分中，我们将更深入地逐步探讨每个步骤。


  '
- "# 第二部分 自定义技能开发\n\n## 7. 自定义 Alexa 技能\n\n既然您已经发布了第一个 Alexa 技能，让我们重新审视各个步骤，并更深入地了解每一个。在第一部分中，您创建了一个\
  \ Alexa 技能，从 VUI 开发到后端代码，再到在 Alexa 技能商店发布。在第二部分中，我们将开发另一个技能，并学习如何使用 Alexa 平台的一些更高级功能。\n\
  \n### Alexa 托管技能与完全自定义技能\n\n在第一部分中，BMI 计算器是一个 Alexa 托管技能。这意味着前端、后端以及两者之间的所有内容都托管在\
  \ Alexa 平台内。特别是，后端代码托管在 Alexa 中，因此我们必须进入 Alexa 界面的“代码”选项卡来输入技能的代码。（见图 7-1。）\n\n\
  ![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig1_HTML.jpg](img/504229_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1 编辑 Alexa 托管技能的代码\n\n在本节中，我们将创建一个完全自定义的技能，其代码和所有使用的资源都托管在亚马逊云服务（AWS）上，而不是在\
  \ Alexa 平台内。Alexa 托管技能更容易构建，但 Alexa 平台会施加一些限制。您可能需要迁移到 AWS 来实现技能所需的功能，对于媒体和数据存储尤其如此。在我们的新技能中，这两者都会用到，因此在这种情况下迁移到\
  \ AWS 是合理的。但我们的新技能是什么呢？\n\n\n\n### 我们的新技能\n\n几个月前，我在车里收听美国国家公共广播电台的 TED 广播时间节目。我不记得当时是谁在发言，但那是一个回顾节目，他们谈论系列节目中的亮点，包括对评论员意义重大的演讲。其中一位评论员提到，一位\
  \ TED 演讲者（我想应该称他为 TED 讲者）在演讲结尾不经意提出的一个想法让他们深受触动。经过一番搜索，我发现那位演讲者是蒂姆·厄本，演讲主题是关于拖延症的^(¹⁷)。他提出的想法是一张\
  \ 90 年日历，蒂姆称之为“人生日历”，用一个小方格代表 90 年寿命中的每一周。起初，你可能会觉得有很多方格。但如果你已经 21 岁，那么你已经划掉了 1092\
  \ 个小方格。原本总共只有 4680 个方格。在 21 岁时，你已经完成了 23%！\n\n蒂姆·厄本的人生日历改变了我的生活。\n\n### 90 年日历\n\
  \n我一回到家，就打开 Excel 制作了自己的 90 年日历。在划掉超过一半的方格后，我震惊于剩下的方格如此之少，并开始思考自己用那些划掉的方格换来了什么。我看到的画面是这样的（见图\
  \ 7-2）。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig2_HTML.jpg](img/504229_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2\n\n一张 90 年人生日历\n\n但这还没完。我为家里的每个人都制作了 90 年人生日历。然后，我用自己人生中的一些重要事件“增强”了我的日历。最终效果类似于图\
  \ 7-3。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig3_HTML.png](img/504229_1_En_7_Fig3_HTML.png)\n\
  \n图 7-3\n\n一张增强版 90 年人生日历\n\n在接下来的几章中，我们将把这个增强版 90 年人生日历构建成一个 Alexa 技能。通过这个练习，我们将更深入地了解\
  \ Alexa 开发流程，并使用许多高级功能，包括：\n\n* 语音用户界面设计\n* Alexa 交互模型——意图、槽位、语句\n* Alexa 对话与委派\n\
  * 使用 Alexa 演示语言在带屏幕的设备上绘制 90 年日历\n* 使用 Alexa 音频演示语言通过音效增强我们的技能\n* 使用 DynamoDb 持久化存储来安全地保存你的人生事件\n\
  * 使用 S3 存储来安全地链接你人生事件的图片\n* 账户关联，以便安全地收集你的人生事件\n* 一个 Lambda 函数——我们技能的大脑\n\n在本章中，我们将创建构成一个完全自定义技能所需的账户和\
  \ AWS 服务。在接下来的章节中，我们将使用这些 AWS 服务来实现我们技能的各项功能。\n\n### VUI 设计\n\n我们将使用的第一个工具是 Botmock，一个\
  \ VUI 设计工具。在设计对话界面时，我们很容易想到使用 Word、Excel 和 PowerPoint，因为这些是我们最熟悉的工具。然而，这些工具都很难很好地呈现\
  \ VUI。即使是 Visio 和 Lucidchart 这样的高级工具，也不适合映射语音体验，而这正是 Botmock 和 Voiceflow 这类工具的用武之地。在本练习中，我们将使用\
  \ Botmock，因此你需要注册他们的免费账户。\n\n1. 首先，访问[`www.botmock.com`](https://www.botmock.com)。\n\
  2. 然后点击*免费试用*。\n3. 输入所需信息并点击*注册*。\n\n登录后，你将处于免费层级，该层级允许你创建最多两个项目。在下一章中，我们将为 90 年日历创建一个项目，并学习如何使用\
  \ Botmock 设计我们的语音体验。接下来，我们将登录 Alexa 控制台并创建一个技能。\n\n### 创建 Alexa 技能\n\n我们需要创建一个自定义\
  \ Alexa 技能并开启若干功能。这就是我们接下来要做的事情。打开 Alexa 开发者控制台（[`https://developer.amazon.com/alexa/console/ask`](https://developer.amazon.com/alexa/console/ask)）。然后按照以下步骤操作：\n\
  \n1. 点击*创建技能*。\n2. 输入技能名称：**90 年日历**。\n3. 在选择模型时，选择自定义技能。\n4. 在选择托管技能后端资源的方法时，选择自行配置。\n\
  5. 然后点击右上角的*创建技能*。\n6. 在选择模板时：选择**从零开始**。\n7. 然后点击右上角的*选择*。\n\n控制台将创建一个带有 Hello\
  \ World 意图的简单技能。接下来，我们将进行一些配置更改，然后在第 9 章中再回到交互模型。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig4_HTML.jpg](img/504229_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\n选择一个简单易用的调用名称\n\n1. 点击左侧导航栏中的*调用*。\n2. 将*技能调用名称*改为易于输入和发音的名称。在调试过程中，你会频繁说出和输入这个名称。在创建过程接近尾声时，你可以将其改为更合适的名称，比如“九十年日历”。现在，先使用像**ninety\
  \ kilo**这样的名称——两个单词，易于输入（90 kilo 这几个键都集中在一起），易于发音，也易于记忆。（见图 7-4。）\n3. 点击顶部的*保存模型*。\n\
  4. 在左侧导航栏中，选择*接口*。\n5. 向下滚动到 Alexa 演示语言，并将其切换为**开启**状态。\n6. 确保所有集线器和电视都被选中。\n7.\
  \ 向下滚动到 Alexa 对话并选择它。\n8. 不要使用 Alexa 对话作为默认对话管理器。\n9. 滚动回顶部并点击*保存接口*。\n\n现在我们已经为技能创建了骨架。\n\
  \n我们需要导航回技能列表（[`https://developer.amazon.com/alexa/console/ask`](https://developer.amazon.com/alexa/console/ask)）。在技能列表中，选择*复制技能\
  \ ID*（见图 7-5）并将其粘贴到 Notepad++中。稍后我们会在安全配置文件中用到它。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig5_HTML.jpg](img/504229_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5\n\n复制技能 ID 以备后用\n\n接下来，我们需要一个数据库来存储 Alexa 将收集的人生事件。\n\n\n\n### DynamoDb\n\
  \n当 Alexa 收集信息时，信息会以 JSON 文档的形式传输。我们需要一个地方来存储这些文档。最可能的选择是 NoSQL 数据库，在 Amazon AWS\
  \ 技术栈中，它被称为 `DynamoDb`。在这种情况下，NoSQL 相比传统关系型数据库有几个优势。第一，我们将拥有一个包含许多相关详细信息的关键记录。第二，我们的数据将全部采用\
  \ JSON 格式。第三，NoSQL 数据库可以非常快速地读写这些 JSON 文档。因此，我们需要创建一个 `DynamoDb` 表。\n\n1. 首先，以管理员用户（而非\
  \ root 用户）身份登录 AWS 开发者控制台。AWS 控制台地址为：[`https://console.aws.amazon.com`](https://console.aws.amazon.com)。\n\
  2. 登录后，在“查找服务”框中搜索 `DynamoDb`。\n3. 选择 `DynamoDb` 后，您将进入 `DynamoDb` 控制台。\n4. 在左侧导航栏中，选择\
  \ `Tables`。\n5. 在右侧，点击 `Create Table` 按钮。\n\nNoSQL 表与 SQL（关系型）表不同，尽管它们使用一些相同的术语。每个\
  \ NoSQL 表必须有一个分区键和一个可选的排序键。主键由这两个属性组成，并且对于每个项目必须是唯一的。`DynamoDb` 对分区键进行哈希处理，以确定将项目存储在数据库的哪个分区中。在小型数据库中可能只有一个分区，但随着数据库的增长，可以有多个分区。有关选择分区键的更多信息，请查看此文档：[`https://aws.amazon.com/blogs/database/choosing-the-right-dynamodb-partition-key/`](https://aws.amazon.com/blogs/database/choosing-the-right-dynamodb-partition-key/)。对于我们的用例——为个人创建一个\
  \ 90 年的日历——使用对每个个体唯一的 `PersonId` 作为分区键似乎是合理的，并且我们不需要排序键。填写表表单时，输入以下内容（参见图 7-6）：\n\
  \n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig6_HTML.jpg](img/504229_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6 为日历项目创建 `DynamoDb` 表\n\n1. 对于表名，输入 `CalendarItem`。\n2. 对于分区键，输入 `PersonId`。\n\
  3. 滚动到底部，点击 `Create`。\n\n`DynamoDb` 将需要大约一分钟来配置表。完成后，将 `DynamoDB` 表的 ARN 复制到 `Notepad++`（参见图\
  \ 7-7）。在创建安全角色时，我们将需要它。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig7_HTML.jpg](img/504229_1_En_7_Fig7_HTML.jpg)\n\
  \n图 7-7 复制 `DynamoDB` 表的 ARN\n\n接下来，我们将创建我们的 `S3` 存储账户。\n\n### S3 存储\n\n虽然 `DynamoDb`\
  \ 是存储您生活事件数据的绝佳场所，但它不是存储与这些事件相关的图片的正确位置。图像是一种二进制大对象，即 Blob 数据。Blob 数据最好保存在文件系统中，这样可以轻松且廉价地存储。后者是\
  \ `S3` 存储桶的主要优势。`S3` 是 Simple Storage Service（简单存储服务）的缩写，是亚马逊用于文件存储的云解决方案。在您的本地机器上，您有磁盘驱动器；在\
  \ `S3` 中，您有存储桶。在本地，您有文件夹来存放文件；在 `S3` 中，您也有文件夹来组织您的对象。为了为我们将为技能存储的图像创建一个 `S3` 存储桶，请导航到任何\
  \ AWS 控制台左上角的“服务”菜单，并按照以下步骤操作：\n\n1. 首先，以管理员用户（而非 root 用户）身份登录 AWS 开发者控制台。AWS 控制台地址为：[`https://console.aws.amazon.com`](https://console.aws.amazon.com)。\n\
  2. 在 `S3` 控制台中，点击右上角的橙色 `Create bucket` 按钮。\n3. 对于存储桶名称：`calendar-pics-12345`。（必须全部小写。名称需要唯一，因此根据需要更改数字。）\n\
  4. 选择正确的区域。\n5. 确保选中“阻止所有公共访问”复选框。\n6. 我们不需要存储桶版本控制（也不需要与之相关的成本）。\n7. 由于我们存储的是私人图片，我们需要服务器端加密，并且我们可以让亚马逊管理密钥——`Amazon\
  \ S3 key (SSE-S3)`。\n8. 现在向下滚动并点击橙色的 `Create bucket` 按钮。\n\n创建存储桶后，我们需要编辑其中一个设置。\n\
  \n1. 在存储桶列表中，选择存储桶名称链接。\n2. 点击 `Permissions` 选项卡。\n3. 滚动到底部。\n4. 在“跨源资源共享 (CORS)”旁边，点击\
  \ `Edit`。\n5. 输入以下 JSON：\n\n```json\n[\n{\n\"AllowedHeaders\": [\n\"*\"\n],\n\"\
  AllowedMethods\": [\n\"PUT\",\n\"GET\",\n\"POST\",\n\"DELETE\",\n\"HEAD\"\n],\n\"\
  AllowedOrigins\": [\n\"https://www.example.com\"\n],\n\"ExposeHeaders\": [\n\"ETag\"\
  \n]\n}\n]\n```\n\n6. 点击 `Save changes`。\n\n目前，我们对 `S3` 存储桶需要做的就这些。将 `S3` 存储桶的 ARN\
  \ 复制到 `Notepad++`。（参见图 7-8。）在创建安全角色时，我们将需要它。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig8_HTML.jpg](img/504229_1_En_7_Fig8_HTML.jpg)\n\
  \n图 7-8 复制 `S3` 存储桶的 ARN\n\n我们还需要能够识别用户并为他们提供对其数据的安全访问。这需要账户关联，我们接下来将配置它。\n\n###\
  \ 账户关联\n\n根据用户是否关联了他们的亚马逊账户，我们将有两种版本的技能行为。如果未关联，用户可以从他们的生日创建日历，并且不存储任何事件。通过关联账户，我们可以安全地为他们存储事件，以便我们可以为日历着色并让他们访问他们的照片。\n\
  \n账户关联^(¹⁸)是一项功能，使您能够将 Alexa 技能链接到用户的亚马逊、微软、谷歌或其他账户。通常，您会希望链接到用户的亚马逊账户，然后使用该身份验证来访问您系统中的数据。\n\
  \n当用户启用您的技能时，Alexa 会为他们创建一个用户 ID。如果您希望持久化会话信息，如果数据不需要安全保护，用户 ID 可能是识别用户并存储其会话信息的合适方式。另一方面，为了保存个人信息，关联账户提供了一个安全的身份验证层。当您关联账户时，Alexa\
  \ 会生成一个安全访问令牌，您可以使用它来识别用户的个人数据。这为您的技能提供了更高的安全性，并允许您安全地连接到外部服务。首先，我们将为我们的技能创建一个应用程序安全配置文件，用于关联账户。\n\
  \n\n\n#### 应用程序安全配置文件\n\n应用程序安全配置文件将我们的 Alexa 技能识别为一个应用程序，并为我们提供将 Alexa 技能链接到用户亚马逊账户所需的凭证。要创建该配置文件：\n\
  \n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig9_HTML.jpg](img/504229_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n选择 `Settings` 菜单选项\n\n1. 在 Alexa 开发者控制台（使用你的亚马逊账户登录）中，从右上角菜单选择你的姓名首字母，然后选择\
  \ `Settings`（参见图 7-9）。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig10_HTML.jpg](img/504229_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10\n\n复制安全配置文件 ID\n\n1. 从菜单栏中选择 `Security Profiles`。\n2. 点击 `Create a New\
  \ Security Profile` 按钮。\n3. 为你的安全配置文件输入 `Name` 和 `Description`。例如，“**90 年日历安全配置文件**”。\n\
  4. 点击 `Save`。\n5. 在安全配置文件屏幕上，将安全配置文件 ID 复制到 Notepad++ 中。（参见图 7-10。）\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig11_HTML.jpg](img/504229_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\n复制客户端密钥\n\n1. 选择 `Web Settings` 选项卡。\n2. 将 `Client ID` 复制到 Notepad++\
  \ 中。\n3. 点击 `Show Secret` 按钮。\n4. 将 `Client Secret` 复制到 Notepad++ 中。（参见图 7-11。）\n\
  \n现在我们已经有了一个安全配置文件，可以设置账户关联了。\n\n#### 配置账户关联\n\n仍在 Alexa 开发者控制台中，切换回技能的 `Build`\
  \ 选项卡，我们将按如下方式填入配置文件凭证：\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig12_HTML.jpg](img/504229_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12\n\n填写完成的账户关联表单\n\n1. 点击 `Build` 选项卡。\n2. 点击左侧导航栏中的 `Tools`。\n3. 点击左侧导航栏中的\
  \ `Account Linking`。\n4. 开启“是否允许用户创建账户或关联到你现有的账户”选项。\n5. 开启“允许用户在不关联账户的情况下启用技能”选项。\n\
  6. 在“安全提供商信息”下，选择 `Auth Code Grant` 选项。\n7. 对于 `Web Authorization URI`，输入 [**https://www.amazon.com/ap/oa**](https://www.amazon.com/ap/oa)。\n\
  8. 对于 `Access Token URI`，输入 [**https://api.amazon.com/auth/o2/token**](https://api.amazon.com/auth/o2/token)。\n\
  9. 对于 `Your Client ID`，粘贴之前保存到 Notepad++ 中的 `Client ID`。\n10. 对于 `Your Secret`，粘贴之前的\
  \ `Client Secret`。\n11. 对于 `Your Authentication Scheme`，选择 **HTTP Basic**。\n12.\
  \ 对于 `Scope`，输入 **profile:user_id**。\n13. 滚动到页面顶部并点击 `Save`。\n14. 填写完成的表单应如图 7-12\
  \ 所示。\n\n现在，我们需要将 Alexa 重定向 URL 复制到我们刚刚创建的安全配置文件中。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig13_HTML.jpg](img/504229_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13\n\nAlexa 重定向 URL\n\n1. 在“关联账户”屏幕底部，`Alexa Redirect URLs` 部分有三个 URL；参见图\
  \ 7-13。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig14_HTML.jpg](img/504229_1_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14\n\n将允许的返回 URL 添加到安全配置文件\n\n1. 将这三个 URL 复制到安全配置文件 Web 设置选项卡的 `Allowed Return\
  \ URLs` 部分；参见图 7-14。\n2. 在屏幕顶部，再次点击 `Save` 按钮。\n\n还有一步。我们需要使用“使用亚马逊登录”功能注册我们的安全配置文件。\n\
  \n1. 在浏览器中，导航至 [`https://developer.amazon.com/loginwithamazon/console/site/lwa/overview.html`](https://developer.amazon.com/loginwithamazon/console/site/lwa/overview.html)。\n\
  2. 在下拉菜单中，选择 **90 年日历安全配置文件**。\n3. 点击 `Confirm`。\n4. 提供你的隐私政策 URL。（如果你没有，可以在 [`https://datadrivenskills.com/privacy-policy`](https://datadrivenskills.com/privacy-policy)\
  \ 查看示例。）\n5. 提供一个图标图形。（任何图形都可以。）\n6. 点击 `Save` 按钮。\n\n就这样。账户关联已设置完成。下一步是为后端创建 lambda\
  \ 函数。\n\n### Lambda 函数\n\n在亚马逊云服务（AWS）中，lambda 函数是一种无服务器计算服务或云函数。它不需要我们预置需要管理的虚拟机或容器。AWS\
  \ 服务完全管理基础设施资源。这使得 lambda 函数成为 Alexa 技能后端的首选解决方案。即使在 Alexa 托管的技能中，`Code` 选项卡也包含一个\
  \ lambda 函数。\n\n创建 AWS lambda 函数有两个步骤。首先，我们需要预置一个安全角色，我们的技能将使用该角色来访问 lambda 函数，然后我们需要创建\
  \ lambda 函数本身。\n\n\n\n#### 创建安全角色\n\n在创建 Lambda 函数之前，我们需要在 IAM（身份与访问管理）控制台中创建一个安全角色。\n\
  \n要创建安全角色，我们需要登录 AWS 账户并进入 IAM 服务：\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig15_HTML.jpg](img/504229_1_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15 选择 Lambda 服务用例\n\n1.  登录 AWS（`https://aws.amazon.com`）。输入账户编号、管理员用户名和密码。请勿使用根用户选项。\n\
  2.  搜索并选择 IAM 服务。\n3.  在左侧，选择*角色*，然后点击*创建角色*。\n4.  在顶部选择*AWS 服务*，并在中间选择*Lambda*作为用例。（参见图\
  \ 7-15。）\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig16_HTML.jpg](img/504229_1_En_7_Fig16_HTML.jpg)\n\
  \n图 7-16 选择 AWSLambdaBasicExecutionRole\n\n1.  点击右下角的*下一步：权限*。\n2.  在*筛选策略*框中，搜索**basic**。\n\
  3.  选中 `AWSLambdaBasicExecutionRole` 旁边的复选框。（参见图 7-16。）\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig17_HTML.jpg](img/504229_1_En_7_Fig17_HTML.jpg)\n\
  \n图 7-17 粘贴表的 ARN\n\n1.  现在点击顶部的*创建策略*按钮。\n2.  对于*选择服务*，选择 **DynamoDB**。\n3.  在*访问级别*下，展开*读取*的选项框。\n\
  4.  选择 `GetItem` 和 `Query`。\n5.  展开*写入*的选项框，并选择 `DeleteItem`、`PutItem` 和 `UpdateItem`。\n\
  6.  现在点击*资源*旁边的橙色文字。\n7.  在*表*旁边，点击*添加 ARN* 链接。\n8.  粘贴表的 *ARN*，或者添加您保存到 Notepad++\
  \ 中的*区域*、*账户*和*表名称*。（参见图 7-17。）\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig18_HTML.jpg](img/504229_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18 选择两个日历策略\n\n1.  点击*添加*按钮。\n2.  点击*下一步：标签*按钮。\n3.  现在点击*下一步：审核*按钮。\n4. \
  \ 为策略命名，例如 `CalendarDynamoDBReadAccess`。\n5.  点击*创建策略*按钮。\n6.  切换回*创建角色*标签页。\n7.\
  \  再次点击顶部的*创建策略*按钮。\n8.  对于*选择服务*，选择 **S3**。\n9.  展开*访问级别列表*的选项框，并选择 `ListBucket`。\n\
  10. 展开*访问级别读取*的选项框，并选择 `GetObject`。\n11. 现在点击*资源*旁边的橙色文字。\n12. 在*存储桶*旁边，点击*添加 ARN*\
  \ 链接。\n13. 粘贴 S3 存储桶的 ARN。\n14. 点击*添加*按钮。\n15. 在*对象*旁边，点击*添加 ARN* 链接。\n16. 在*存储桶名称*框中输入存储桶的名称（`calendar-pics`）。\n\
  17. 勾选*对象名称*旁边的*任意*复选框。\n18. 点击*添加*按钮。\n19. 点击*下一步：标签*按钮。\n20. 点击*下一步：审核*按钮。\n21.\
  \ 为策略命名，例如 `CalendarS3ReadAccess`。\n22. 点击*创建策略*按钮。\n23. 切换回*创建角色*标签页。\n24. 刷新策略列表。\n\
  25. 使用关键词 **calendar** 筛选策略。\n26. 选择我们刚刚创建的两个策略。（参见图 7-18。）\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig19_HTML.jpg](img/504229_1_En_7_Fig19_HTML.jpg)\n\
  \n图 7-19 完成的 Lambda 执行角色\n\n1.  点击*下一步：标签*。\n2.  点击*下一步：审核*。\n3.  为*角色名称*命名，例如 `CalendarLambdaExecutionRole`。\n\
  4.  点击*创建角色*。（参见图 7-19。)\n\n现在我们已经创建了角色，可以开始处理 Lambda 函数了。\n\n#### 创建 Lambda 函数\n\
  \n仍在 AWS 中，我们现在需要开始创建 Lambda 函数本身。创建 Lambda 函数需要执行以下步骤：\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig20_HTML.jpg](img/504229_1_En_7_Fig20_HTML.jpg)\n\
  \n图 7-20 完成的 Lambda 函数创建对话框\n\n1.  选择左上角的*服务*菜单。\n2.  搜索并选择 Lambda。\n3.  在右上角，选择*创建函数*。\n\
  4.  选择*从头开始创作*。\n5.  输入*函数名称*，例如 `CalendarLambdaBackend`。\n6.  对于*运行时*，在列表顶部的*最新支持*部分下选择\
  \ **Python 3.8** 或更高版本。\n7.  在*权限*下，展开*更改默认执行角色*。\n8.  选择*使用现有角色*。\n9.  选择我们之前创建的\
  \ `CalendarLambdaExecutionRole` 角色。（参见图 7-20。)\n\n现在您将能够配置您的 Lambda 函数。\n\n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig21_HTML.jpg](img/504229_1_En_7_Fig21_HTML.jpg)\n\
  \n图 7-21 完成的触发器\n\n1.  在左侧，选择*添加触发器*，然后选择 *Alexa Skills Kit* 触发器。\n2.  在*技能 ID*\
  \ 框中，粘贴您从 Notepad++ 中复制的 90 年日历技能的 *Alexa 技能 ID*。（完成的触发器参见图 7-21。)\n\n现在选择 Lambda\
  \ 函数（图 7-21 中标记为 `CalendarLambdaBackend` 的框）以显示函数代码。您可能需要向下滚动才能看到代码（参见图 7-22）。\n\
  \n![../images/504229_1_En_7_Chapter/504229_1_En_7_Fig22_HTML.jpg](img/504229_1_En_7_Fig22_HTML.jpg)\n\
  \n图 7-22 Lambda 函数代码\n\n至此，您已经准备好编写后端代码，并且我们已经配置了在技能中所需的所有组件。\n\n### 总结\n\n在本章中，我们为新的技能创建了一个骨架。它包含一个\
  \ Alexa 技能、一个用于技能设计的 Botmock 项目、一个用于捕获用户数据的 DynamoDB 数据库表、一个用于检索图片的 S3 存储桶，以及一个带有适当安全策略的\
  \ Lambda 函数，用于后端代码。\n\n在下一章中，我们将为 90 年日历技能设计 VUI。\n\n脚注 1 2\n\n## 8. 超越 Hello World\n\
  \n在上一章中，您设置了构建增强版 90 年日历技能所需的所有账户和服务。本章将介绍 VUI 设计，以及如何为更复杂的技能设计对话流程。\n\n我们的技能将有两种风格。如图\
  \ 8-1 所示，第一种是 90 年日历的简单呈现。这是未认证用户所能使用的全部功能。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig1_HTML.jpg](img/504229_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1 一个 90 年人生日历\n\n一旦用户将我们的 Alexa 技能关联到他们的亚马逊账户，我们就可以询问并存储用户生活中的重要事件。这将使我们能够呈现一个增强版本，最终看起来类似于图\
  \ 8-2。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig2_HTML.png](img/504229_1_En_8_Fig2_HTML.png)\n\
  \n图 8-2 一个增强版 90 年人生日历\n\n在下一节中，我们将探讨一些关于语音优先 VUI 设计的考量。\n\n\n\n### VUI 设计\n\n语音用户界面设计可能是一个复杂的过程，尤其是与传统的图形用户界面设计相比。在为应用构思\
  \ GUI 时，你通常会创建一个菜单结构来访问各种功能。用户随后会点击某个菜单选项，打开某种表单来输入数据或执行操作。表单会布置一系列用于输入或选择选项的控件，并附带几个操作按钮，例如“确定”和“取消”。这些设计都无法很好地迁移到语音优先的用户界面。相反，“菜单”需要是一个宽而扁平的结构，允许用户说出不同的指令来访问应用的所有功能。“表单”则需要让用户能够以几乎任意顺序说出内容。VUI\
  \ 还必须像 GUI 那样容纳各种同义词。\n\n例如，假设你想为你的车查询更换机油的价格。过程可能如下：\n\n1.  你在手机上打开应用。\n2.  你点击应用中的注册链接。\n\
  3.  你输入电子邮件和密码，点击接受条款，然后点击注册按钮。\n4.  接着你输入名字、姓氏和邮政编码，然后点击“完成”。\n5.  然后你点击允许应用在使用时访问你的位置。\n\
  6.  接着你对应用关于通知的询问点击“不允许”。\n7.  然后你可以在地图上点击本地门店、搜索门店、点击按钮打开主菜单，或者点击底部栏查看优惠券。\n8.\
  \  点击菜单按钮会打开一个多级菜单。\n9.  点击地图上的本地门店后，你会看到一个屏幕，让你在以下选项中选择：\n    1.  关闭屏幕。\n    2.\
  \  收藏该位置。\n    3.  查看热门时段图表。\n    4.  获取路线（这会启动你默认的地图/导航应用）。\n    5.  查看可用的优惠券。\n\
  \    6.  查看评价。\n    7.  如果向下滚动，你可以看到可用服务的简要列表。\n10.  经过所有这些操作后，你沮丧地关闭了应用，因为这个应用不提供价格信息，也无法预约服务。\n\
  \n现在，想象一下语音优先的体验。\n\n*   用户：Alexa，我需要换机油。\n*   Alexa：我找到了几个选项。1st Chance Tire，距离\
  \ 1.3 英里。Valvoline Instant Oil Change，距离 2.5 英里。\n*   用户：选择 Valvoline。\n*   Alexa：欢迎来到\
  \ Valvoline。您想预约换机油吗？\n*   用户：是的。\n*   Alexa：为哪辆车？\n*   用户：2019 款福特 C-Max。\n*  \
  \ Alexa：您想什么时候去？\n*   用户：今天下午，下班后。\n*   Alexa：2019 款福特 C-Max 的里程数是多少？\n*   用户：我不知道，大概\
  \ 115,000 英里。\n*   Alexa：好的。我可以为您预约明天下午 5:30 在 Smyrna 的 Valvoline 为 2019 款福特 C-Max\
  \ 进行高里程机油更换。您有一张 7 美元的优惠券，因此根据您选择的机油，费用大约在 33 到 48 美元之间。需要我预约吗？\n*   用户：是的。\n* \
  \  Alexa：好的。我已为您预约了明天下午 5:30。\n\n这两种交互之间最显著的差异是什么？想想 Alexa 是如何直奔主题的，而 GUI 却必须将所有内容都塞进菜单、屏幕和点击操作中。想想\
  \ Alexa 是如何将 115,000 英里转换为“高里程”，以及将“下班后”转换为“下午 5:30”的。Alexa 必须更加灵活，以处理用户可能说出的各种内容。想想每次交互对用户的要求是什么。\n\
  \n语音优先设计是一种策略，它将语音交互置于屏幕和点击操作之上。虽然屏幕可以是 VUI 设计的一个组成部分，但优先考虑的是模拟用户与 Alexa 之间的对话。你要寻找的是用户能够完成流程、达成预期结果的方式。当然，我们会模拟一条“快乐路径”，即用户按正确顺序说出正确内容。但我们也必须处理意外情况。例如，你在预约换机油的过程中，突然决定还需要做轮胎换位。这就是传统建模工具（如\
  \ Excel、Visio 和 Lucidchart）的不足之处。绘制快乐路径很容易。但随着模型的扩展，列出同义词和所有可能的表述会变得越来越棘手。\n\nAdobe\
  \ XD 有一个用于 Alexa 技能的模板；这是一个出色的故事板工具，许多图形设计师都很熟悉。有关 XD 的全面指南，请查看 Alexa 团队提供的 My Cactus\
  \ 示例。（设计资源见此处：[`https://github.com/alexa/skill-sample-nodejs-web-api-my-cactus`](https://github.com/alexa/skill-sample-nodejs-web-api-my-cactus)。Alison\
  \ Atwell 和 Justin Jeffress 在 Twitch 上解释该过程的视频见此处：[`www.twitch.tv/collections/S81yydlkRBY-Pw`](http://www.twitch.tv/collections/S81yydlkRBY-Pw)。)\n\
  \n诸如 Botmock 和 Voiceflow 之类的工具正是为了应对 VUI 设计的挑战而创建的，并且它们的学习曲线不像 Adobe XD 那样陡峭。在下一节中，我们将使用\
  \ Botmock 来设计标准模型的对话。\n\n#### 使用 Botmock 进行 VUI 设计\n\n要开始使用 Botmock，请登录，并为“90 年日历”创建一个新项目。点击“创建新项目”后：\n\
  \n1.  在“项目名称”中输入`90-Year Calendar`。\n2.  选择`Amazon Alexa`作为目标渠道。\n3.  点击“创建项目”。\n\
  \n这将启动对话编辑器，我们可以在其中开始建模我们的对话。\n\n在 BotMock 中，线条和方框代表对话模型。线条是用户的表述；方框是机器人（Alexa）说的话。见图\
  \ 8-3。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig3_HTML.jpg](img/504229_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n在 BotMock 中建模对话\n\n如图 8-3 所示，在用户说出启动短语后，Alexa 说：“欢迎，告诉我你的生日，我会告诉你一些有趣的事情。”\n\
  \n然后用户意图向 Alexa 提供他们的生日，因此他们会说出一些合适的内容，例如“我的生日是 1980 年 1 月 1 日。”定义用户意图的一部分工作还包括描述他们为完成该意图可能说出的所有表述。“提供生日”意图的另一种表述可能是“我出生于\
  \ 1980 年 1 月 1 日。”\n\n然后 Alexa 确认她已将表述解码为正确的日期：“确认一下，你的生日是 `%birthday%`。”注意使用百分号来界定给定生日的变量。\n\
  \n此时，你可以在图中看到用户有两个选项（是或否），并且 Alexa 区分了年龄在 90 岁以上和 90 岁以下。如果用户说“否”，他们将获得另一次提供生日的机会。\n\
  \n如你所见，到目前为止，对话相对简单。不过，在我们详细阐述下一阶段之前，让我们先创建到目前为止的模型。\n\n\n\n#### 启动响应\n\n与 Alexa\
  \ 的对话通常始于用户启动您的技能。他们可能会说：“Alexa，启动我的九十年日历。”Alexa 通常会以愉快且礼貌的欢迎语和开始提示来回应。在我们的案例中，Alexa\
  \ 会说：“欢迎，告诉我你的生日，我会告诉你一些有趣的事情。”但如果这是一位想要在日历中添加更多事件的回头用户呢？那么她应该说：“欢迎回来。您想向日历中添加更多事件吗？”在\
  \ Botmock 中，我们可以通过创建一个连接到绿色起点框的新文本框来表示这一点。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig4_HTML.jpg](img/504229_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n第一个语音框\n\n1.  首先，点击*起点*框。\n2.  会出现四个灰色箭头。点击底部的箭头。\n3.  在*块选择器*中，选择*文本*。\n\
  4.  如果需要，您可以用鼠标抓住新框，并将其与起点框对齐。\n5.  双击文字*机器人说*。\n6.  在此对话框的最顶部，将文字*文本*改为**1.0 欢迎\
  \ – 新用户**。请注意，我们对每个文本框进行编号，以便在构建技能时保持其有序。\n7.  现在，在文本文本框中，输入 Alexa 将要说的话：**欢迎，告诉我你的生日，我会告诉你一些有趣的事情。**\n\
  8.  最后，点击右下角的保存按钮。\n9.  您的对话框现在应该看起来像图 8-4。\n\n现在我们已经有了 Alexa 的欢迎语句，我们可以将启动意图添加到对话框中。\n\
  \n#### 意图\n\n在 BotMock 中，如同在 Alexa 对话中一样，用户是有意图的。意图是用户想要完成的事情。对于启动意图，用户希望我们的技能启动。Botmock\
  \ 将意图表示为线条上的注释。首先，您定义意图，然后在图表中引用它。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig5_HTML.jpg](img/504229_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5\n\n创建启动意图\n\n1.  要定义一个意图，请选择左侧菜单栏上的*意图*图标。\n2.  我们将定义一个启动意图，因此点击*添加新意图*。\n\
  3.  *意图名称*为**启动**。\n4.  点击*训练短语*的*添加*按钮。\n5.  在新的*训练短语*框中，输入**Alexa，启动我的九十年日历**。（见图\
  \ 8-5。）\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig6_HTML.jpg](img/504229_1_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6\n\n连接设置界面。\n\n1.  点击右下角的*保存*按钮。\n2.  然后点击意图列表顶部的箭头将其关闭。\n3.  现在，按住 Shift\
  \ 键并点击我们添加的*起点*框和*1.0 欢迎*框之间的连线。\n4.  在*连接设置*界面中，输入**启动 – 新用户**作为*连接标签*。\n5.  在*检查用户话语是否匹配意图*框中，选择我们刚刚创建的**启动**意图。\n\
  6.  在*检查这些条件*部分的*匹配以下所有规则*框旁边，点击*添加条件*按钮。\n7.  在弹出的*创建新变量*界面中，输入 **isNewUser**。\n\
  8.  将条件从“为空”更改为*等于*。\n9.  在文本框中输入**是**。（见图 8-6。）\n10. 点击右下角的*保存*按钮。\n\n您的图表现在应该显示该意图，如图\
  \ 8-7 所示。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig7_HTML.jpg](img/504229_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7\n\n显示欢迎消息和启动意图的图表\n\n接下来，我们需要添加针对回头用户的替代启动流程。为此，我们将重复之前的步骤，不同之处在于用户的启动意图相同，但\
  \ Alexa 的回应不同，并且过滤条件变为 `isNewUser = 否`。由于我们已经认识该用户，我们应该在欢迎消息中包含他们的名字。为此，我们将为用户的名字添加一个变量。\n\
  \n1.  点击左侧菜单栏上的*变量*。\n2.  点击*创建新变量*。\n3.  输入变量名称：**userName**。\n4.  选择实体类型：**姓名**。\n\
  5.  点击*保存*。\n6.  关闭*管理变量*弹出界面。\n\n然后，我们像这样创建 Alexa 的回应：\n\n1.  选择*起点*框。\n2.  点击右侧箭头并添加一个新的文本框。\n\
  3.  双击该文本框，将*标题*改为“**2.0 欢迎 – 回头用户**”。\n4.  将*文本*从“机器人说”改为“**欢迎 %userName%，您想向日历中添加一个事件吗？**”请注意使用百分号来界定变量\
  \ `userName`。\n5.  点击*保存*。\n6.  按住 Shift 键并点击从*起点*到**2.0 欢迎**的连线。\n7.  输入标签：“**启动\
  \ – 回头用户**”。\n8.  选择启动意图。\n9.  添加一个条件。\n10. 选择 **isNewUser**、**等于**，并输入**否**。\n\
  11. 点击*保存*按钮。\n12. 回到图表上，点击右上角菜单栏上的*保存*按钮。\n\n您的图表现在应该看起来像图 8-8。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig8_HTML.jpg](img/504229_1_En_8_Fig8_HTML.jpg)\n\
  \n图 8-8\n\n启动意图和欢迎消息\n\n现在，我们准备完成新用户的快乐路径。\n\n\n\n#### 快乐路径\n\n当一切按计划进行且所有假设都正确时，会发生什么？此时，你便走在了快乐路径上。在我们的案例中，快乐路径是指\
  \ Alexa 能正确听到并理解你的生日，然后告诉你一些关于生日的趣事。偏离快乐路径的情况属于异常和备选方案。目前，我们暂不考虑这些。我们想要创建的是快乐路径。\n\
  \n为此，需要创建一个新变量（图 8-9）和一个新意图（图 8-10），以便用户向我们提供他们的生日。请注意在训练短语中使用 `%birthday%` 变量，以及在槽位填充部分设置“必需”标志。然后，Alexa\
  \ 会要求确认生日（图 8-11），我们可以将“提供生日”意图添加到连接线上（图 8-12）。接着，用户会说出“是”意图（图 8-13）。最后，Alexa 会告诉他们一些有趣的事情（图\
  \ 8-14），我们可以将“是”意图添加到连接线上（图 8-15）。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig15_HTML.jpg](img/504229_1_En_8_Fig15_HTML.jpg)\n\
  \n图 8-15\n\n将“是”意图添加到连接线\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig14_HTML.jpg](img/504229_1_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14\n\n在文本框中告诉用户一些有趣的事情\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig13_HTML.jpg](img/504229_1_En_8_Fig13_HTML.jpg)\n\
  \n图 8-13\n\n创建“是”意图\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig12_HTML.jpg](img/504229_1_En_8_Fig12_HTML.jpg)\n\
  \n图 8-12\n\n将“提供生日”意图添加到连接线\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig11_HTML.jpg](img/504229_1_En_8_Fig11_HTML.jpg)\n\
  \n图 8-11\n\n在文本框中添加“确认您的生日”Alexa 响应\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig10_HTML.jpg](img/504229_1_En_8_Fig10_HTML.jpg)\n\
  \n图 8-10\n\n创建“提供生日”意图\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig9_HTML.jpg](img/504229_1_En_8_Fig9_HTML.jpg)\n\
  \n图 8-9\n\n创建生日变量\n\n完成以上所有步骤后，快乐路径现在如图 8-16 所示。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig16_HTML.png](img/504229_1_En_8_Fig16_HTML.png)\n\
  \n图 8-16\n\n完成的快乐路径\n\n如果用户已经超过 90 岁了呢？如果我们所有的计算都基于最大年龄 90 岁，那事情就会变得复杂。\n\n####\
  \ 超过 90 岁路径\n\n为了处理超过 90 岁的情况，我们需要将“是”响应拆分为两个。第一个响应位于快乐路径上，标记为“是 – 90 岁以下”。第二个响应则不在此路径上，标记为“是\
  \ – 90 岁以上”。要添加此条件，我们需要为用户年龄添加一个变量（见图 8-17）。然后添加一个文本框，用于 Alexa 在用户超过 90 岁时做出响应（见图\
  \ 8-18）。最后，为“是”路径添加条件：(1) 年龄小于 90 岁，(2) 年龄大于或等于 90 岁（见图 8-19）。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig19_HTML.png](img/504229_1_En_8_Fig19_HTML.png)\n\
  \n图 8-19\n\n将“是”意图和年龄条件添加到超过 90 岁路径\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig18_HTML.png](img/504229_1_En_8_Fig18_HTML.png)\n\
  \n图 8-18\n\n添加“超过 90 岁”文本框\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig17_HTML.jpg](img/504229_1_En_8_Fig17_HTML.jpg)\n\
  \n图 8-17\n\n添加年龄变量\n\n现在，图表将如图 8-20 所示。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig20_HTML.jpg](img/504229_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20\n\n添加了超过 90 岁路径后的完整图表\n\n如果用户未授权，也就是说他们尚未关联账户，那么一旦我们告知他们已活过的百分比，并且如果他们的设备有屏幕，向他们展示了\
  \ 90 年或 110 年的日历后，技能就会结束。与其直接结束，我们可以提示他们是否想向日历添加项目，如果愿意，则指导他们在 Alexa 应用中关联技能。这个提示听起来比直接结束更好。\n\
  \n#### 添加提示\n\n添加一个向日历添加项目的提示，需要编辑图表（图 8-20）中的框 4.0 和框 5.0。在陈述结果之后，我们需要添加一个问题：“您想向日历添加一个事件吗？”如果我们还将框\
  \ 2.0 下移，最终会得到如图 8-21 所示的图表。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig21_HTML.png](img/504229_1_En_8_Fig21_HTML.png)\n\
  \n图 8-21\n\n添加了添加事件提示后的修改图表\n\n正如你在图表中看到的，我们现在有一个快乐路径和两个变体。那异常情况呢？我们如何处理错误？我们也需要将其添加到图表中。例如，如果\
  \ Alexa 没有正确理解日期怎么办？因此，用户在确认日期时会说“不”。\n\n#### 添加“不”意图\n\n如果 Alexa 没有获取到正确的生日，用户在要求确认时会说“不”，Alexa\
  \ 将不得不重新提示用户输入正确的生日，如图 8-22 所示。这个重新提示框意味着需要添加一个“不”意图，因此在编辑从框 3.0 到框 6.0 的连线之前，请先添加该意图。\n\
  \n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig22_HTML.jpg](img/504229_1_En_8_Fig22_HTML.jpg)\n\
  \n图 8-22\n\n将“不”意图添加到确认框\n\n请记得定期保存你的 BotMock 图表。\n\n现在我们已经获取了用户的生日并绘制了空白日历。并且我们已经进行到询问他们是否想向日历添加事件的步骤。如果他们说不呢？\n\
  \n#### 说再见\n\n如果用户不想向新的空白日历添加事件，那么他们使用技能的任务就完成了，我们应该说再见。这需要添加一个新的文本框，让 Alexa 说再见，并在框\
  \ 4.0 和框 5.0 中两次使用“不”意图，如图 8-23 所示。请注意，“再见”文本框是技能的终点，因此在编辑器中向下滚动，并选择“在此模块结束对话”开关。\n\
  \n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig23_HTML.jpg](img/504229_1_En_8_Fig23_HTML.jpg)\n\
  \n图 8-23\n\n添加“再见”文本框\n\n至于框 2.0，如果我们已经认识该用户，并且他们不想向日历添加事件，这可能会很有趣。他们想做什么呢？\n\n\
  #### 你想做什么？\n\n如果用户是回访用户，并且他们不想添加另一个事件，他们想做什么？我们应该让 Alexa 询问他们，并准备好处理许多不同的回答。请参见图\
  \ 8-24 了解额外的文本框以及“不”意图的另一种用法。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig24_HTML.jpg](img/504229_1_En_8_Fig24_HTML.jpg)\n\
  \n图 8-24\n\n询问用户下一步做什么\n\n我们的对话处理了用户告诉我们他们不想添加事件的情况。现在我们已经准备好添加“是”路径了。但是……\n\n\n\
  \n#### 已关联账户与未关联账户\n\n是的，用户想要将事件添加到他们的日历中。但是，如果他们的账户未关联，我们如何知道谁在登录，又如何存储这个特定用户的数据呢？因此，对于尚未关联我们技能的用户，我们需要设置一个分流路径。我们先来添加这个功能。我们需要让\
  \ Alexa 指示用户关联他们的账户。我们需要知道账户是否已关联，因此需要一个变量来记录。然后，我们可以使用 `Yes` 意图，并基于这个新变量设置一个条件，来重新引导用户，让\
  \ Alexa 说出类似这样的话：“您需要关联您的账户才能保存您的生活事件。此项服务不收取任何费用。您的数据经过加密且安全。要关联您的账户，请使用您手机上的 Alexa\
  \ 应用。” 示例如图 8-25 所示。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig25_HTML.png](img/504229_1_En_8_Fig25_HTML.png)\n\
  \n图 8-25\n\n要求用户关联其账户\n\n如果用户返回时账户已关联，我们就可以获取事件信息。\n\n#### 获取事件\n\n现在我们知道用户是谁了，Alexa\
  \ 需要询问他们事件的详细信息。我们可以使用 `Intent` 模型按顺序执行此操作，或者使用对话的 `Conversations` 模型来更灵活地处理。无论哪种方式，我们都需要向用户询问`事件日期`、`事件类型`和简短的事件描述。`事件类型`将是一个可供选择的简短列表，因此当我们创建变量时，需要为`事件类型`变量添加一个`实体`。这三个变量如图\
  \ 8-26 所示。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig26_HTML.png](img/504229_1_En_8_Fig26_HTML.png)\n\
  \n图 8-26\n\n事件变量和 `EventType` 实体\n\n接下来，我们需要添加意图，让用户提供`事件日期`、`类型`和`描述`，如图 8-27 所示。请注意每个意图如何填充一个变量。\n\
  \n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig27_HTML.jpg](img/504229_1_En_8_Fig27_HTML.jpg)\n\
  \n图 8-27\n\n事件意图\n\n现在，我们可以添加事件对话，利用这些意图为我们提供所需的事件数据。一旦用户确认了日期和类型，我们就可以重新绘制日历，并添加新事件。事件对话如图\
  \ 8-28 所示。\n\n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig28_HTML.png](img/504229_1_En_8_Fig28_HTML.png)\n\
  \n图 8-28\n\n用于捕获我们所需事件详情的基本对话\n\n事件确认后，我们应该询问用户是否要添加另一个事件并捕获该事件。这需要添加框 `14.0 事件已确认`。然后，您可以循环回到框\
  \ `10.0` 以获取下一个事件。如果用户说“不”，则跳转到框 `8.0` 并确定用户接下来想做什么。\n\n现在我们已经捕获了技能这一部分的理想路径，那么还有哪些其他可能的情况呢？\n\
  \n#### 接下来会发生什么？\n\n用户还能用我们的技能做什么？您将如何在对话中体现这一点？回到框 `8.0`，并从那里开始填充对话。（见图 8-29。）\n\
  \n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig29_HTML.jpg](img/504229_1_En_8_Fig29_HTML.jpg)\n\
  \n图 8-29\n\n接下来会发生什么？\n\n从框 `8.0` 开始的一些附加功能想法包括：\n\n*   重新绘制日历并添加事件。\n*   打印日历。\n\
  *   通过电子邮件发送 Excel、PDF 或图片格式的日历。\n*   使用 API 帮助用户查找世界事件。\n\nBotmock 的功能远不止于此。我们需要重新审视我们所有的意图，并添加更多的训练短语。例如，`Give\
  \ Birthday` 意图应该被训练以接受：\n\n| `我的生日是 %birthday%。` |\n| `我的生日是 %birthday%。` |\n| `我的出生日期是\
  \ %birthday%。` |\n| `我的出生日期是 %birthday%。` |\n| `我出生于 %birthday%。` |\n| `%birthday%。`\
  \ |\n\n以及您能想到的任何其他变体。\n\n在 Botmock 中，您可以在对话中设置旅程（或路径）。（见图 8-30。）这些路径帮助您可视化用户可以通过对话采取的各种路径。您还可以交互式地运行对话并查看其流程。您可以邀请审阅者检查您的对话并发表评论。您也可以为您的流程设置用户测试。\n\
  \n![../images/504229_1_En_8_Chapter/504229_1_En_8_Fig30_HTML.png](img/504229_1_En_8_Fig30_HTML.png)\n\
  \n图 8-30\n\n我们对话中的理想路径旅程\n\n您可以导出您的对话模型并将其导入另一个名为 Botium ([`https://botium.ai`](https://botium.ai))\
  \ 的工具。Botium 是一个自动化对话测试工具，它会接收您的 Botmock 对话并将其分解为一组测试脚本，这些脚本可以作为自动化构建的一部分运行。\n\n\
  要从 Botmock 导出，请查看 GitHub 上的这个项目：\n\n[`https://github.com/Botmock/botmock-dialogflow-export`](https://github.com/Botmock/botmock-dialogflow-export)\n\
  \n要导入到 Botium，请查看 GitHub 上的这个项目：\n\n[`https://github.com/codeforequity-at/botium-exporter-botmock`](https://github.com/codeforequity-at/botium-exporter-botmock)\n\
  \n最后，您可以使用 GitHub 上的这个项目将您的对话导出为 Alexa Skills Kit 格式：\n\n[`https://github.com/Botmock/botmock-skills-kit-export`](https://github.com/Botmock/botmock-skills-kit-export)\n\
  \n### 总结\n\n本章超越了典型的 Hello World 示例，为一个 90 年日历技能设计了对话。我们学习了意图、变量/槽位以及实体类型/列表。我们学习了如何使用\
  \ Botmock 来导航和记录一个包含多条路径和大量选项的复杂对话模型。\n\n在下一章中，我们将创建我们的新技能并配置 VUI。\n\n## 9. 配置 VUI\n\
  \n在第 8 章中，我们在 Botmock 中为我们的 90 年日历技能创建了一个对话流程图。现在，我们将把这个流程图转换为 Alexa 技能中的语音用户界面。在本章中，我们将根据该图创建意图、槽位和响应。\n\
  \n在本节的第一部分，我们将把 Botmock 图转换为 Alexa 技能。\n\n\n\n### 导出 Botmock 图表\n\n要导出 Botmock 图表，我们需要下载并组装一个工具，该工具使用\
  \ Botmock API 将图表导出为 Alexa Skills Kit (ASK) 可用于构建技能的格式。我们首先从 GitHub 获取代码。\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig1_HTML.jpg](img/504229_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\n从 GitHub 下载 Skills Kit 导出工具\n\n1. 在浏览器中导航至 [`https://github.com/Botmock/botmock-skills-kit-export`](https://github.com/Botmock/botmock-skills-kit-export)。\n\
  2. 点击绿色的 Code 按钮，选择最后一个选项 Download ZIP。（见图 9-1。）\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig2_HTML.jpg](img/504229_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2\n\n解压后的 `botmock-skills-kit-export-master` 文件夹\n\n1. 下载完成后，将文件移动到编码目录中的一个新文件夹中并解压。这将创建一个名为\
  \ `botmock-skills-kit-export-master` 的文件夹。（见图 9-2。）\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig3_HTML.jpg](img/504229_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\n下载 Node.js 安装程序\n\n1. 从该文件夹打开命令行。为此，请按住 Shift 键并右键单击该文件夹，然后选择 a) 在此处打开命令窗口，b)\
  \ 在此处打开 PowerShell 窗口，或 c) 在此处打开 Git Bash。\n2. 在命令行中输入 `npm -v`。这将报告您已安装的 npm 版本。如果收到错误消息，则需要安装\
  \ npm。如果版本低于 6.14.x，则需要安装最新版本的 npm。\n3. npm 随 Node.js 一起安装。要安装 Node.js，请从 [`https://nodejs.org/`](https://nodejs.org/)\
  \ 下载安装程序。您很可能需要安装 LTS（长期支持）版本。示例见图 9-3。\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig4_HTML.jpg](img/504229_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n\n运行 `npm install`\n\n1. 安装 Node.js 后，npm 也会被安装。\n2. 在命令行中运行 `npm install`。（见图\
  \ 9-4。）\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig5_HTML.jpg](img/504229_1_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5\n\n在 Botmock 中访问设置菜单\n\n1. npm 将下载并安装运行导出所需的 npm 包。\n2. 在 `npm install`\
  \ 之后，最好运行 `npm audit fix`。\n3. 仍在命令行中，运行 `mv ./sample.env ./.env`。\n4. 在 Notepad++\
  \ 中编辑 `.env` 文件。\n5. 切换到浏览器，打开您的 Botmock 项目，点击齿轮图标进入设置。（见图 9-5。）\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig6_HTML.jpg](img/504229_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n\n从 Botmock 获取 API 信息\n\n1. 点击 API Info 选项卡，然后点击 *Copy .env file for API\
  \ usage*。（见图 9-6。）\n2. 将其粘贴到 Notepad++ 的 `.env` 文件中，覆盖已有的文本。\n3. 切换回 Botmock，点击\
  \ *generate your API key here* 链接。（同样见图 9-6。）\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig7_HTML.jpg](img/504229_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7\n\n创建 API 令牌\n\n1. 在 *Create API Token* 屏幕上，输入一个 *Token Name*，例如 `Botmock\
  \ Token`。\n2. 勾选 *Access your Teams and Projects* 复选框。\n3. 点击 *Create*。（见图 9-7。）\n\
  4. 现在点击 *Copy to Clipboard* 按钮。\n5. 将整个令牌粘贴到 Notepad++ 中 `.env` 文件的双引号之间。\n6. 此时我本可以向你展示\
  \ `.env` 文件，但那样我就得用特工 K 的闪光装置抹去你对这件事的记忆。\n7. 另外，我还需要提醒你此时保存工作吗？\n\n下载了导出工具、安装了 npm\
  \ 包并配置了 `.env` 文件后，你就可以运行导出了。\n\n1. 在命令行中运行 `npm start`。这将创建一个包含 `90-Year Calendar.json`\
  \ 文件的 `output` 文件夹。\n\n至此，我们已经导出了对话文件。在下一节中，我们将使用该文件来创建技能的基本框架。\n\n### 创建技能\n\n\
  要从导出的 Botmock 文件创建技能，我们需要启动 Alexa 开发者控制台。然后我们可以打开在第 7 章中创建的自定义技能。接着，我们将放入来自 Botmock\
  \ 的 JSON，并花一些时间调整结果。\n\n首先，打开浏览器访问 [`https://developer.amazon.com/alexa/console/ask`](https://developer.amazon.com/alexa/console/ask)。\n\
  \n然后点击我们在第 7 章中创建的 90 年日历技能。\n\n现在我们可以使用 Botmock 文件为我们的技能创建初始模型。尽管之后我们还需要调整和修改模型，但这将为我们节省大量时间。展开左侧导航栏中的交互模型。然后按照以下说明操作：\n\
  \n1. 点击 *JSON Editor*。\n2. 点击 *Drag and drop a .json file*。\n3. 找到并选择来自 Botmock\
  \ 的 `90-Year Calendar.json` 文件。\n4. 点击顶部的 *Save Model* 按钮。\n5. 现在点击顶部的 *Build Model*\
  \ 按钮。\n\n查看所有错误。这些是 Botmock 模型与 Alexa 模型不完全匹配的地方。幸运的是，通过编辑意图并确保槽位正确定义，这些错误相对容易修复。无需编辑\
  \ JSON，我们可以通过 Alexa 开发者控制台修复这些问题，如下一节所述。\n\n\n\n### 清理对话模型\n\n从 Botmock 导入模型后，我们需要做一些修正。在此之前，你需要做出一个选择：是否使用下划线，这是个问题。也就是说，你希望在意图名称中使用下划线，还是移除空格改用驼峰式命名？我个人偏好驼峰式。但`Under_Score`也完全没问题。现在做出选择，但请保持一致性。\n\
  \n首先选择`Give Birthday`意图。\n\n1. 将意图名称从`Give Birthday`重命名为`GiveBirthday`，或者如果你更喜欢，也可以改为`Give_Birthday`。\n\
  2. 然后向下滚动到“意图槽位”，在名称栏中输入`birthday`，并点击`+按钮`添加它。现在选择`AMAZON.Date`作为槽位类型。\n\n选择`Give\
  \ Event Date`意图并进行相同的修正。\n\n3. 重命名该意图。\n4. 添加`eventDate`槽位，并选择`AMAZON.Date`作为槽位类型。\n\
  \n选择`Give Event Description`意图并进行修正。\n\n5. 重命名该意图。\n6. 添加`eventDescription`槽位，并选择`AMAZON.SearchQuery`作为槽位类型。（`AMAZON.SearchQuery`允许用户说出一个简短短语，我们可以将其捕获为事件描述。）\n\
  \n选择`Give Event Type`意图并进行修正。注意：槽位类型无需修正，因为 Botmock 模型已经为`eventType`设置了槽位类型。\n\n\
  7. 重命名该意图。\n\n分别重命名`Email Calendar`、`Add an Event`和`Print Calendar`这三个意图。\n\n现在，我们需要删除`Launch\
  \ Intent`。`Launch Intent`只需被删除，因为它实际上不是一个意图，而是调用短语。点击左侧导航栏中的`Intents`标题。找到`Launch\
  \ Intent`，点击其右侧的`Delete`按钮。确认警告信息。\n\n接下来，我们需要将`Yes`和`No`意图从自定义意图转换为内置意图。我们可以通过将`AMAZON.YesIntent`和`AMAZON.NoIntent`添加到意图列表中，并删除已有的`Yes`和`No`意图来实现。\n\
  \n此外，我们还应该添加一些其他内置意图来更好地控制技能。具体来说，添加`AMAZON.RepeatIntent`、`AMAZON.StartOverIntent`和`AMAZON.StopIntent`。\n\
  \n最后，由于我们将管理一个事件列表，因此需要添加`AMAZON.MoreIntent`、`AMAZON.NextIntent`、`AMAZON.PageDownIntent`、`AMAZON.PageUpIntent`、`AMAZON.PreviousIntent`、四个`AMAZON.Scroll*Intents`以及`AMAZON.SelectIntent`。\n\
  \n当你完成内置意图的添加后，你的意图列表应如图 9-8 所示。\n\n![../images/504229_1_En_9_Chapter/504229_1_En_9_Fig8_HTML.jpg](img/504229_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8** 我们将进行编码的自定义意图和内置意图\n\n现在我们已经设置好了意图，下一章将为带屏幕的 Alexa 设备创建可视化界面。\n\n###\
  \ 本章小结\n\n在本章中，我们将 Botmock 图表转换为 Alexa 技能并配置了 VUI。在下一章中，我们将使用 Alexa 演示语言（APL）为带屏幕的\
  \ Alexa 设备创建可视化演示。\n\n## 10. 使用 APL 在屏幕上进行演示\n\n在第 9 章中，我们将 Botmock 图表转换为 Alexa\
  \ 技能并配置了 VUI。然而，我们 90 年日历技能的主要目的是向你展示你的 90 年日历。为此，我们需要检查设备是否有屏幕，如果有，我们可以使用 Alexa\
  \ 演示语言（APL）创建一个 90 年日历演示。“APL 文档是一个 JSON 结构，它定义了一个在视口上显示的模板。该文档控制视觉响应的整体结构和布局。”^(¹⁹)\
  \ 换句话说，APL 是一个改变设备显示的 JSON 文件。本章将研究该文件及其绑定的数据，以在屏幕上绘制一个简单的 90 年日历，首先从介绍 APL 编辑器开始。\n\
  \n### APL 编辑器\n\n要从 Alexa 开发者控制台进入 APL 编辑器，请确保你位于`Build`选项卡，并且左侧导航栏中的`Assets`已展开。然后选择`Interfaces`。向下滚动到`Alexa\
  \ Presentation Language`，通过切换开关打开该功能，并确保选择所有`Viewport Profiles`。点击`Save Interfaces`按钮。现在，从左侧导航栏中选择`Multimodal\
  \ Responses`。参见图 10-1。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig1_HTML.jpg](img/504229_1_En_10_Fig1_HTML.jpg)\n\
  \n**图 10-1** 用于接口和多模态响应的左侧导航栏\n\n浏览器中将打开一个新标签页。选择`Visual responses`选项。然后点击`Create\
  \ Visual Response`。接下来，选择`Start from scratch`选项。这将打开 APL 编辑器。参见图 10-2。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig2_HTML.png](img/504229_1_En_10_Fig2_HTML.png)\n\
  \n**图 10-2** APL 编辑器\n\n查看 APL 编辑器，我们可以看到：\n\n1. 左侧导航栏，我们将用它来访问 APL 文档的各个部分\n2.\
  \ 文本面板，我们可以在其中看到 APL 文档的组件或 JSON 文本\n3. 所选组件的详细信息\n4. 目标屏幕选项\n5. APL 文档的视觉预览\n6.\
  \ 组件工具栏，用于向 APL 模板添加组件\n7. 在技能模拟器中查看 APL 文档的选项\n8. 主工具栏，我们可以在其中预览、保存和下载 APL\n\n\
  在下一节中，我们将规划 UI 的一些组件。\n\n\n\n### 90 年日历界面\n\n遗憾的是，我们不能直接用`APL`在屏幕上放一个 Excel 电子表格。相反，我们将使用自定义代码来渲染日历界面。具体来说，我们将使用\
  \ SVG（可缩放矢量图形），采用 Alexa 风格。可以说，使用 SVG（文档中有时称为 Alexa 矢量图形，即`AVG`），我们可以在带屏幕的设备上绘制任何我们想要的内容。\n\
  \n我们的 90 年日历将使用 SVG 为 90 年中的每一周绘制一个方框。已经过去的周次，我们将方框填满；尚未到来的周次，则保持方框空白。出于性能考虑，我们需要划分三个区域。中间区域是当前年份，其中部分方框填满，部分留空。顶部区域是过去，所有方框都填满。底部区域的所有方框则全部留空。参见图\
  \ 10-3。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig3_HTML.jpg](img/504229_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3 我们将绘制的三个区域\n\n为了实现这一点，我们需要在`APL` JSON 格式中定义几个项目。首先，我们要定义一些颜色资源。这些资源允许我们在整个`APL`模型中使用颜色代码，而无需指定具体的颜色名称。因此，我们从黑色和白色开始，但如果你愿意，也可以轻松地将其改为红色和黄色或任何其他颜色。点击左侧导航栏上的“资源”按钮，并输入以下\
  \ JSON 代码：\n\n```\n[{\n\"colors\": {\n\"C0\": \"black\",\n\"C1\": \"white\"\n}\n\
  }]\n```\n\n定义好颜色后，我们可以创建一个数据集，并将`APL`绑定到该数据集上，以便动态渲染。该数据集将代表区域 1、2 和 3，如图 10-3 所示。在区域\
  \ 1 和区域 3 中，数据集中的单个条目代表该行的背景颜色。在区域 2 中，单个条目代表该行中每个方块的颜色。在开发阶段，我们只需要少量行。在测试和最终技能中，区域\
  \ 1 和区域 3 总共需要 89 行（每年一行），区域 2 的单行需要 52 列（每周一列）。要输入数据，请选择左侧导航栏中的“数据”图标，并输入以下 JSON\
  \ 代码：\n\n```\n{\n\"data\": {\n\"type\": \"object\",\n\"properties\": {\n\"zone1\"\
  : [\n\"C1\",\n\"C1\",\n\"C1\",\n\"C1\",\n\"C1\",\n\"C1\",\n\"C1\"\n],\n\"zone2\"\
  : [\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"\
  C0\",\n\"C1\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"\
  C0\",\n\"C0\",\n\"C1\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"\
  C0\",\n\"C0\",\n\"C0\",\n\"C1\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"\
  C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C1\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"\
  C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C1\",\n\"C0\",\n\"C0\"\n],\n\"zone3\"\
  : [\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\",\n\"C0\"\n]\n}\n}\n}\n```\n\n对于每个区域，我们还需要知道另一个动态参数——它的高度（以像素为单位）。最终，高度将在我们的技能代码中计算得出，但对于示例数据，我们可以对其进行硬编码。在图\
  \ 10-3 中，每个方框有 2 像素的边框，并且包括边框在内是 32 像素见方。对于区域 1，我们的示例数据有 7 行。区域 2 有 1 行。区域 3 有 5\
  \ 行。因此，各区域的高度为：\n\n- 区域 1：7 × 32 = 224。\n- 区域 2：1 × 32 = 32。\n- 区域 3：5 × 32 = 160。\n\
  - 总宽度：52 × 32 = 1664。\n- 总高度：90 × 32 = 2880。\n\n在数据集的区域 3 数据之后，我们需要添加以下 JSON 代码：\n\
  \n```\n\"zone1Height\": 224,\n\"zone2Height\": 32,\n\"zone3Height\": 160,\n\"totalWidth\"\
  : 1664,\n\"totalHeight\": 2880\n```\n\n添加这些项目后，JSON 代码将如图 10-4 所示。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig4_HTML.jpg](img/504229_1_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4 数据 JSON 条目（区域已折叠）\n\n至此，我们可以配置文档的导入。\n\n### 配置文档的导入\n\n我们需要导入`alexa-styles`模块和`alexa-layouts`模块。点击左侧导航栏上的“文档”图标，并输入以下\
  \ JSON 代码：\n\n```\n{\n\"type\": \"APL\",\n\"version\": \"1.5\",\n\"theme\": \"dark\"\
  ,\n\"import\": [{\n\"name\": \"alexa-styles\",\n\"version\": \"1.1.0\"\n},\n{\n\"\
  name\": \"alexa-layouts\",\n\"version\": \"1.2.0\"\n}\n]\n}\n```\n\n接下来，我们需要为 90\
  \ 年日历定义三个形状——每个区域一个。\n\n\n\n#### 绘制三个区域\n\n区域 2 的形状是一个简单的方框。区域 1 和区域 3 则是复杂的方框行。在\
  \ SVG 中，绘制一个简单的正方形，需要将笔移动到一个顶点，然后向每个顶点画线，形成正方形的边。就像这样：\n\n`M0,0 L0,6 L6,6 L6,0 L0,0`（见图\
  \ 10-5）。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig5_HTML.jpg](img/504229_1_En_10_Fig5_HTML.jpg)\n\
  \n图 10-5\n\n在 SVG 中绘制正方形\n\n在我们的案例中，对于区域 2，我们希望绘制一个 32×32 且带有 2 像素边框的方框。SVG 命令将是：\n\
  \n```\nM0,0 L0,31 L31,31 L31,0 L0,0 M1,1 L1,30 L30,30 L30,1 L1,1\n```\n\n使用此命令，我们可以创建绘制区域\
  \ 2 中方框所需的图形。点击左侧导航栏上的“图形”图标，并输入以下 Json 代码：\n\n```\n{\n\"blackBox\": {\n\"type\"\
  : \"AVG\",\n\"version\": \"1.0\",\n\"height\": 32,\n\"width\": 32,\n\"items\": [{\n\
  \"type\": \"path\",\n\"stroke\": \"@C1\",\n\"pathData\": \"M0,0 L0,31 L31,31 L31,0\
  \ L0,0 M1,1 L1,30 L30,30 L30,1 L1,1\",\n\"fill\": \"@C0\"\n}]\n},\n\"whiteBox\"\
  : {\n\"type\": \"AVG\",\n\"version\": \"1.0\",\n\"height\": 32,\n\"width\": 32,\n\
  \"items\": [{\n\"type\": \"path\",\n\"stroke\": \"@C0\",\n\"pathData\": \"M0,0 L0,31\
  \ L31,31 L31,0 L0,0 M1,1 L1,30 L30,30 L30,1 L1,1\",\n\"fill\": \"@C1\"\n}]\n}\n\
  }\n```\n\n**提示：** 尽早保存，经常保存。请确保经常保存你的工作。（首次保存时，你需要为模板命名。）\n\n有了这些基础构件，我们就可以开始组合\
  \ APL 文档的主模板了。`mainTemplate`部分接受一个名为`payload`的参数，该参数绑定到我们之前在模板中输入的数据。我们的数据对象具有一些属性，我们可以使用\
  \ APL 变量替换来访问它们，例如：`\"${payload.data.properties.propertyname}\"`。\n\n我们有三个区域，我们将为每个区域使用一个\
  \ APL `GridSequence`对象。这些对象都将放在一个 APL `Container`对象中。点击左侧导航栏上的“APL”图标。向下滚动找到以下代码块：\n\
  \n```\n\"mainTemplate\": {\n\"parameters\": [\n\"payload\"\n],\n\"items\": []\n\
  }\n```\n\n然后，通过添加`Container`和三个`GridSequences`来修改该代码，如下所示：\n\n```\n\"mainTemplate\"\
  : {\n\"parameters\": [\n\"payload\"\n],\n\"items\": [{\n\"type\": \"Container\"\
  ,\n\"width\": \"${payload.data.properties.totalWidth}\",\n\"height\": \"${payload.data.properties.totalHeight}\"\
  ,\n\"paddingLeft\": \"10\",\n\"paddingTop\": \"10\",\n\"paddingRight\": \"10\",\n\
  \"paddingBottom\": \"10\",\n\"items\": [{\n\"type\": \"GridSequence\",\n\"width\"\
  : \"${payload.data.properties.totalWidth}\",\n\"height\": \"${payload.data.properties.zone1Height}\"\
  ,\n\"childHeight\": \"32\",\n\"childWidth\": \"32\",\n\"data\": \"${payload.data.properties.zone1}\"\
  ,\n\"items\": [{\n\"type\": \"VectorGraphic\",\n\"source\": \"blackBox\"\n}]\n},\n\
  {\n\"type\": \"GridSequence\",\n\"width\": \"${payload.data.properties.totalWidth}\"\
  ,\n\"height\": \"${payload.data.properties.zone2Height}\",\n\"childHeight\": \"\
  32\",\n\"childWidth\": \"32\",\n\"data\": \"${payload.data.properties.zone2}\",\n\
  \"items\": [{\n\"type\": \"VectorGraphic\",\n\"source\": \"blackBox\"\n}]\n},\n\
  {\n\"type\": \"GridSequence\",\n\"width\": \"${payload.data.properties.totalWidth}\"\
  ,\n\"height\": \"${payload.data.properties.zone3Height}\",\n\"childHeight\": \"\
  32\",\n\"childWidth\": \"32\",\n\"data\": \"${payload.data.properties.zone3}\",\n\
  \"items\": [{\n\"type\": \"VectorGraphic\",\n\"source\": \"whiteBox\"\n}]\n}\n]\n\
  }]\n}\n```\n\n有了这段代码，右侧渲染出的示例应如图 10-6 所示。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig6_HTML.jpg](img/504229_1_En_10_Fig6_HTML.jpg)\n\
  \n图 10-6\n\n在划分出三个区域后渲染出的示例\n\n接下来，我们可以为区域 2 的方框添加一个`when`子句，使它们根据数据值改变颜色。如下所示修改区域\
  \ 2 的代码：\n\n```\n\"data\": \"${payload.data.properties.zone2}\",\n\"items\": [{\n\
  \"when\": \"${data == 'C1'}\",\n\"type\": \"VectorGraphic\",\n\"source\": \"whiteBox\"\
  \n},\n{\n\"when\": \"${data == 'C0'}\",\n\"type\": \"VectorGraphic\",\n\"source\"\
  : \"blackBox\"\n}\n]\n```\n\n请注意，`data`这个术语是在`items`之前声明的，这样我们就可以为`data`数组中的每个元素获取一个`item`。在`items`内部，我们引用的是`data`术语，而不是`properties.zone2`术语。\n\
  \n现在到了棘手的部分。如果我们像绘制区域 2 中的单行那样绘制其他行，整个绘制过程将耗费大量时间。为了提高性能，我们需要一次性绘制整行。这需要大量的数学计算，因此在\
  \ Excel 中组合 SVG 表达式是最简单的方法。首先，我们可以创建一个光标/笔需要移动以绘制线条的路径图，类似于图 10-7。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig7_HTML.jpg](img/504229_1_En_10_Fig7_HTML.jpg)\n\
  \n图 10-7\n\n绘制一行线条时光标移动路径图\n\n因此，完成的 SVG 表达式将如下所示：\n\n```\nM0,0 L1663,0 L1663,1\
  \ L0,1 L0,2 L0,29 L1,29 L1,2 M30,2 L30,29 L31,29 L31,2 L32,2 L32,29 L33,29 L33,2\
  \ M62,2 L62,29 L63,29 L63,2 M1662,2 L1662,29 L1663,29 L1663,2 M1663,30 L0,30 L0,31\
  \ L1663,31\n```\n\n我们需要弄清楚中间部分（前面代码中箭头所指的位置）应该是什么。回到 Excel 中，我们将通过查看垂直线的顶点来输入 SVG\
  \ 表达式的初始值。在图 10-7 中，这些顶点从`L0,2`开始，然后向下到`L0,29`，再向右到`L1,29`，然后到`L1,2`，接着是`M30,2`，依此类推。这种模式在第八个条目之后重复。在一个新的工作表中，在\
  \ A 列中，输入每个顶点的第一个数字：0, 0, 1, 1, 30, 30, 31, 31。在 B 列中，输入每个顶点的第二个数字：2, 29, 29, 2,\
  \ 2, 29, 29, 2。在 C 列中，输入每个顶点对应的笔移动字母：L, L, L, L, M, L, L, L，如图 10-8 所示。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig8_HTML.jpg](img/504229_1_En_10_Fig8_HTML.jpg)\n\
  \n图 10-8\n\nSVG 表达式的初始值\n\n现在，我们可以在第九行输入公式，如下所示：\n\n|   | A | B | C |\n|--- |---\
  \ |--- |--- |\n| **9** | `=A1+32` | `=B1` | `=C1` |\n\n此外，在 E 列和 F 列的第 1 行和第 2 行，输入公式以连接\
  \ A、B、C 列生成的值：\n\n|   | E | F |\n|--- |--- |--- |\n| **1** | `=CONCAT(C1,A1,\",\"\
  ,B1,\" \")` | `=E1` |\n| **2** | `=CONCAT(C2,A2,\",\",B2,\" \")` | `=CONCAT(F1,\
  \ E2)` |\n\n现在将`E2:F2`的公式向下复制到第 3:9 行。然后小心地将`A9:F9`的公式向下复制到第 10:416 行。最终的工作表将如图\
  \ 10-9 所示。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig9_HTML.png](img/504229_1_En_10_Fig9_HTML.png)\n\
  \n图 10-9\n\n包含完整 SVG 表达式的最终工作表\n\n因此，完成的 SVG 表达式将由顶部两行组成：\n\n```\nM0,0 L1663,0 L1663,1\
  \ L0,1\n```\n\n接着是来自 Excel 单元格`F416`的大字符串：\n\n```\nL0,2 L0,29 L1,29 L1,2 M30,2 L30,29\
  \ L31,29 L31,2 L32,2 L32,29 L33,29 L33,2 M62,2 L62,29 L63,29 L63,2 L64,2 L64,29\
  \ L65,29 L65,2 L1601,2 M1630,2 L1630,29 L1631,29 L1631,2 L1632,2 L1632,29 L1633,29\
  \ L1633,2 M1662,2 L1662,29 L1663,29 L1663,2\n```\n\n最后是底部两行：\n\n```\nM1663,30 L0,30\
  \ L0,31 L1663,31\n```\n\n回到 Alexa 开发者控制台，我们将复制并粘贴`blackBox`和`whiteBox`图形代码，以创建`blackRow`和`whiteRow`图形。为此，点击左侧导航栏上的“图形”图标，复制`blackBox`和`whiteBox`代码，并分别重命名为`blackRow`和`whiteRow`。然后将宽度改为\
  \ 1664，并将`pathData`改为前面展示的巨大 SVG 表达式。我们可以移除行的填充，因为我们绘制的不是闭合形状，所以填充无关紧要。但我们需要为区域\
  \ 3 的行添加白色背景，因此我们将添加一个纯色填充矩形来实现这一点。代码如下：\n\n\n\n```json\n{\n\"blackRow\": {\n\"\
  type\": \"AVG\",\n\"version\": \"1.2\",\n\"height\": 32,\n\"width\": 1664,\n\"viewportHeight\"\
  : 32,\n\"viewportWidth\": 1664,\n\"items\": [{\n\"type\": \"path\",\n\"stroke\"\
  : \"@C1\",\n\"pathData\": \"M0,0 L1663,0 L1663,1 L0,1 L0,2 L0,29 L1,29 L1,2 M30,2\
  \ L30,29 L31,29 L31,2 L32,2 L32,29 L33,29 L33,2 M62,2 L1630,29 L1631,29 L1631,2\
  \ L1632,2 L1632,29 L1633,29 L1633,2 M1662,2 L1662,29 L1663,29 L1663,2 M1663,30 L0,30\
  \ L0,31 L1663,31\"\n}]\n},\n\"whiteRow\": {\n\"type\": \"AVG\",\n\"version\": \"\
  1.2\",\n\"height\": 32,\n\"width\": 1664,\n\"viewportHeight\": 32,\n\"viewportWidth\"\
  : 1664,\n\"items\": [{\n\"type\": \"path\",\n\"stroke\": \"@C1\",\n\"pathData\"\
  : \"M0,0 L1663,0 L1663,31 L0,31\",\n\"fill\": \"@C1\"\n},\n{\n\"type\": \"path\"\
  ,\n\"stroke\": \"@C0\",\n\"pathData\": \"M0,0 L1663,0 L1663,1 L0,1 L0,2 L0,29 L1,29\
  \ L1,2 M30,2 L30,29 L31,29 L31,2 L32,2 L32,29 L33,29 L33,2 L1630,29 L1631,29 L1631,2\
  \ L1632,2 L1632,29 L1633,29 L1633,2 M1662,2 L1662,29 L1663,29 L1663,2 M1663,30 L0,30\
  \ L0,31 L1663,31\"\n}\n]\n}\n}\n```\n\n完成后，你应该会看到如图 10-10 所示的代码。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig10_HTML.jpg](img/504229_1_En_10_Fig10_HTML.jpg)\n\
  \n图 10-10\n\n`blackRow` 和 `whiteRow` 的图形定义\n\n请注意新增的 `viewportHeight` 和 `viewportWidth`\
  \ 属性。这些属性表示图形的完整尺寸（32 × 1664）。而 `height` 和 `width` 属性将是缩放后的版本。\n\n现在，我们将对 `height`\
  \ 和 `width` 进行参数化，以便图形能够针对不同的 Echo 设备正确缩放。\n\n#### 参数化高度和宽度\n\n切换回 APL 模板（点击左侧导航栏中的\
  \ APL 图标）。在这里，我们将把区域 1 和区域 3 的 `childHeight` 和 `childWidth` 分别更改为 `${payload.data.properties.boxHeight}`\
  \ 和 `${payload.data.properties.rowWidth}`。同时，我们将把区域 1 和区域 3 的 `blackBox`/`whiteBox`\
  \ 源更改为 `blackRow`/`whiteRow`。最终你将得到如图 10-11 所示的代码。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig11_HTML.jpg](img/504229_1_En_10_Fig11_HTML.jpg)\n\
  \n图 10-11\n\n切换到行图形后区域 1 和区域 3 的代码\n\n最后，我们需要将图 10-10 中的代码属性添加到示例数据中。方法是点击左侧导航栏中的数据图标，并将以下\
  \ JSON 添加到数据底部：\n\n```\n\"zone1Height\": 1600,\n\"zone2Height\": 32,\n\"zone3Height\"\
  : 1248,\n\"totalWidth\": 1664,\n\"totalHeight\": 2880,\n\"boxHeight\": 32,\n\"boxWidth\"\
