  \n图 10-12\n\n切换到行图形后的预览效果\n\n现在我们需要更改数据以处理缩放问题。\n\n#### 缩放方块和行以适配屏幕\n\n首先，我们将添加剩余的示例数据，然后缩放区域高度以适配\
  \ Echo Show 2 的屏幕。\n\n点击左侧导航栏中的数据图标。更新代码，使区域 1 有 50 行，区域 3 有 39 行。加上区域 2 现有的 52\
  \ 列（一行），我们得到 50 + 1 + 39 = 90 年的周数据。因此，完整的数据 JSON 如下：\n\n```\n{\n\"data\": {\n\"\
  type\": \"object\",\n\"properties\": {\n\"zone1\": [\n\"C1\",\n\"C1\",\n\"C1\",\n\
  ...\n\"C1\",\n\"C1\",\n\"C1\"\n],\n\"zone2\": [\n\"C1\",\n\"C1\",\n...\n\"C0\",\n\
  \"C0\"\n],\n\"zone3\": [\n\"C0\",\n\"C0\",\n\"C0\",\n...\n\"C0\",\n\"C0\",\n\"C0\"\
  \n],\n\"zone1Height\": 1600,\n\"zone2Height\": 32,\n\"zone3Height\": 1248,\n\"totalWidth\"\
  : 1664,\n\"totalHeight\": 2880,\n\"boxHeight\": 32,\n\"boxWidth\": 32,\n\"rowWidth\"\
  : 1664\n}\n}\n}\n```\n\n为了将方块缩放以适配分辨率为 1280 x 800 像素的 Echo Show 2，我们需要按如下方式减小方块高度：\n\
  \n*   800 像素除以 90 行 = 800 / 90 = 8.889 ~ 8\n\n并按如下方式减小方块宽度：\n\n*   1280 像素除以 52\
  \ 列 = 1280 / 52 = 24.231 ~ 24\n\n因此，一行的净宽度为：\n\n*   24 × 52 = 1248。\n\n各区域的高度则为：\n\
  \n*   区域 1：8 × 50 = 400\n\n*   区域 2：8\n\n*   区域 3：8 × 39 = 312\n\n将这些值代入数据属性后，数据变为：\n\
  \n```\n\"zone1Height\": 400,\n\"zone2Height\": 8,\n\"zone3Height\": 312,\n\"totalWidth\"\
  : 1664,\n\"totalHeight\": 2880,\n\"boxHeight\": 8,\n\"boxWidth\": 24,\n\"rowWidth\"\
  : 1248\n```\n\n现在我们已经输入了数据并配置了参数，你应该会得到一个如图 10-13 所示的图表。\n\n![../images/504229_1_En_10_Chapter/504229_1_En_10_Fig13_HTML.png](img/504229_1_En_10_Fig13_HTML.png)\n\
  \n图 10-13\n\n完成的 90 年日历\n\n\n\n### 完成的 APL 代码\n\n最终的 APL 模板如下：\n\n```\n{\n\"type\"\
