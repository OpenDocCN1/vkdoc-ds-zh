  \n#### 为 For 循环添加延迟\n\n为了添加延迟，避免在短时间内发出过多请求，我们需要导入 `time.sleep()` 函数。首先导入 `time`\
  \ 模块：\n\n```\nimport time\n```\n\n接下来，我们需要计算延迟的秒数。对于 Yahoo，速率是每秒 5 个请求。因此，速率为 1\
  \ 秒除以 5 个请求，即每个请求 0.2 秒。对于 Alpha Vantage，速率是每分钟 5 个请求。该速率计算为 60 秒除以 5 个请求，即每个请求\
  \ 12 秒。要添加的代码如下所示：\n\n```\nif STOCK_API == 'YAHOO':\nrate = 1.0 / 5.0\nelse:\nrate\
  \ = 60.0 / 5.0\n```\n\n计算出每个请求的速率后，我们可以通过以下代码行将延迟添加到 `for` 循环中：\n\n```\ntime.sleep(rate)\n\
  ```\n\n现在，我们已经完成了该函数，如下一节所示。\n\n\n\n#### 完整的 `GetStockValue` 函数\n\n综合以上所有内容，我们得到以下函数：\n\
