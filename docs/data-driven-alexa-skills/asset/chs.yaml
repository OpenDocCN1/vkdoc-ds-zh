  \n图 5-3\n\n打开 Anaconda Prompt\n\n1. 从开始菜单 | Anaconda | Anaconda Prompt 选项打开 Anaconda\
  \ Prompt。见图 5-3。注意：不要选择 Anaconda PowerShell 提示符。你只需要 Anaconda Prompt，不要带 PowerShell\
  \ 字样。\n\n2. 打开后，你应该会在命令提示符前看到 `(base)` 选项，如下所示：\n\n3. 如果你没有看到 `(base)` 选项，请尝试此命令：`conda\
