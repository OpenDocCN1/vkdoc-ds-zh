  \ AWS 服务的账户。\n\n### IAM 与账户安全\n\n我们需要配置的第一个亚马逊云服务是 IAM（身份与访问管理）。IAM 是您创建用户、组、权限等的地方。以根用户身份登录后，我们将创建一个管理员账户。然后，您将退出根用户账户，并登录到管理员账户，之后您将使用该账户来创建、管理和配置您需要的任何其他\
  \ AWS 服务。要创建管理员账户，请执行以下操作：\n\n![../images/504229_1_En_3_Chapter/504229_1_En_3_Fig7_HTML.jpg](img/504229_1_En_3_Fig7_HTML.jpg)\n\
