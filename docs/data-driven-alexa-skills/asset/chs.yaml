  \ 1 2 3\n\n## 16. 股票市场 API\n\n在本章中，我们将使用前几章构建的个人理财技能，并添加第二个资产价值计算功能，以告知我们投资的价值。同样，这个技能可能会接触到我们大量的个人数据，但所有这些数据都将安全地存放在受保护的数据库中，并经过加密以保护你的安全。在所有情况下，你都可以选择使用测试账户和虚假数据进行开发，因此完全不需要涉及真实数据。\n\
