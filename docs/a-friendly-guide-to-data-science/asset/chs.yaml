  \n当使用真实数据构建决策树时，分裂永远不会是完美的，大多数叶节点都会包含一些具有不同标签的记录。控制树构建的方式有很多种，这也是我们在训练中最终可能出现错误分类记录的主要原因。实际上，我们不希望树变得太深，而如果我们坚持每个叶节点只包含具有相同标签的记录，就会发生这种情况。同时，我们还会得到一些只有一个或极少量记录的叶节点。这些情况基本上就是过拟合（我们将在下面详细讨论）。因此，我们会施加一些限制，例如最大深度、分裂一个节点所需的最小记录数（一旦到达某个节点，对其进行分裂会导致节点规模过小，我们就会将其视为一个叶节点，并赋予最常见的标签）。\n\
  \n回归树的构建方式类似，但由于没有单一的标签，其过程并非那么直接。它会尝试将数值相近的值分组，而不是要求所有值都具有相同的标签。\n\n\n\n# 随机森林\n\
  \n随机森林是一种基于决策树算法构建、通常能创建出性能更优模型的方法。它实际上是一种集成学习方法，归属于装袋方法。从根本上说，随机森林按照上述基本方法创建一组决策树，但其中有一些额外的技巧使其更加有效。由于它基于决策树，因此同样灵活且强大。它能完成分类或回归任务，并且除了数值型数据外，也能处理分类型数据。\n\
  \n与大多数机器学习方法一样，随机森林确实需要大量数据，但只要噪声是随机分布的，这些数据可以有相当的噪声。所创建的众多决策树需要彼此独立且平衡。在标准方法中（我将在下面描述），这两点都能得到保证。\n\
  \n随机森林方法的两个关键组成部分是：装袋——对原始数据进行随机抽样（有放回）；以及对每个样本的特征进行随机子集抽取。然后针对这些组合中的每一个训练单独的决策树，通常有数百棵。装袋部分生成了许多不同的数据子集。由于这些是有放回的随机样本，它们对数据具有很强的代表性，并且方差较低。这是基本的装袋方法，但随机森林还加入了特征子集抽取的技巧——通常包含的特征数量是总特征数的平方根。这个技巧确保了众多树不会过于相似或彼此高度相关。因此，数据的每个子集也只包含部分特征。这之所以强大，是因为它意味着结果不会只受最具影响力特征的主导——相反，不同的特征可以在更多的树中显示出重要性，从而能够捕捉更微妙的趋势。\n\
  \n在所有树都训练完成后，数据会通过所有树进行运行，输出结果要么通过多数投票（分类问题）决定，要么通过取平均值（回归问题）决定。\n\n我之前提到的团队预测日门店销售额的项目，就是实践中决策树与随机森林差异的一个很好的例子。我们拥有超过\
  \ 450 个特征和几千条记录，因此这非常适合使用随机森林。我们的特征包括针对美国七个主要节日的总共 18 个特征。这些特征类似于“圣诞节前 10 天”、“圣诞节前\
  \ 9 天”等等，一直到“圣诞节当天”，然后从“圣诞节后 1 天”一直到“圣诞节后 7 天”。每个节日在产生影响的类型上都有不同的模式——圣诞节前的消费巨大，但之后会逐渐减少。但由于我们分析的是全年数据，一年中只有\
  \ 18 天这些特征可能为真（即圣诞节特征可能为真的 18 天，对比 347 天均为假值，占比不到 5%）。因此，一棵普通的决策树不太可能捕捉到任何圣诞节特征——对于大部分数据而言，其他特征会重要得多——除非这棵树非常非常深。但深度决策树不是一个好主意，所以单纯的决策树方法效果不佳。而随机森林*确实*捕捉到了圣诞节及其他节日特征，并且表现非常出色。在针对同一问题的早期工作中，我们用时间序列方法取得了相当不错的结果，但随机森林优于我们测试过的所有算法。\n\
  \n随机森林的主要缺点是解释性较弱。通常，最好的方法是先解释决策树方法，以便人们能理解。然后你可以解释，数百棵这样的树在略有差异的数据上进行训练，最终的标签由多数投票或取平均值决定。根据我的经验，人们大多对此能够接受。\n\
  \n另一种解释方式是讨论重要的特征。随机森林算法会输出模型中总体最重要的特征，但这并不能告诉我们很多信息，尤其是针对特定预测。我之前提到过模型解释器，我们在日销售额预测中使用了其中一个，并获得了关于每次预测非常有用的信息。正是通过这种方式，我们才得知与节日相关的特征在一年中那些它们可能相关的极少数日子里变得重要。\n\
  \n## 朴素贝叶斯\n\n`朴素贝叶斯` 是一种仅用于分类的方法，在早期的垃圾邮件过滤工作中崭露头角，因为它识别垃圾邮件的效果非常好。它不是某个特定的算法，因为可以使用多种算法，但它们都遵循相同的基本步骤。所有方法都依赖贝叶斯定理及其条件概率公式（其中各项可以互换）。它们还要求所有特征彼此独立，并且每个特征对结果的贡献相等。这些就是它被称为“朴素”的原因。这种方法的一个优点是它不需要大量的数据来进行训练。\n\
  \n这里遵循的基本方法是计算每个特征的后验概率（贝叶斯公式的一部分）。例如，在一个仅通过考虑单个单词或短语是否存在来判断垃圾邮件状态的分类器中，后验概率（例如，给定邮件中包含单词\
  \ *w*，则该邮件是垃圾邮件的概率）是基于任何邮件是垃圾邮件的概率（训练集中垃圾邮件的比例）和先验概率（给定邮件是垃圾邮件，单词 *w* 出现的概率）计算得出的。然后，可以合并该邮件中每个单词的后验概率，以确定其整体标签是否为垃圾邮件（根据定义的阈值）。\n\
  \n与其他方法相比，`朴素贝叶斯` 的一个缺点是我们无法获得关于单个特征的信息（请记住，其假设是所有特征同等重要）。这与回归方法和树方法明显不同。但它很简单，并且在许多领域都能很好地工作。\n\
  \n\n\n### 神经网络\n\n神经网络（有时称为人工神经网络）是另一类主要为监督学习算法（也有一些用于无监督问题的变体）的模型。它们已经存在了很长时间，其流行度也经历了起伏。近十年来，由于许多新型神经网络的开发及其非常成功的应用，它们变得非常重要。当然，生成式人工智能也基于先进的神经网络（通常称为深度学习），因此它们的流行度呈爆炸式增长。你常会听到神经网络是通过模仿神经元和突触的结构与功能而受到人脑启发，这确实是真的，但这并不意味着神经网络就比其他机器学习算法更接近人类智能。许多从业者不喜欢这种比较，因为它有误导性的暗示，但神经网络确实源于此。不过，一种采用现代神经网络风格的简单网络早在\
  \ 18 世纪就被用来预测行星运动（远在我们对动物大脑运作方式有任何了解之前）。\n\n一个*神经网络*具有输入层、隐藏（中间）层和输出层的一般结构。参见图 15-11\
  \ 了解神经网络的一般结构。这里有大量的连接，随着我们添加内部层，连接数量也会暴增。内部层是不透明的，并且由于数量众多，很难解释为什么网络将特定输出分配给某个输入。它们在许多领域都能非常强大，并且仍然被经常使用。注意，具有两个或更多隐藏层的神经网络被称为*深度神经网络*，这也是术语*深度学习*的由来。神经网络的优势之一是从错误中学习，这使得它们具有很强的适应性。\n\
  \n![](img/628533_1_En_15_Fig11_HTML.jpg)\n\n一个三层的神经网络流程图。左侧标有红色“输入”的层包含三个节点。中间标有蓝色“隐藏”的层有四个节点。右侧标有绿色“输出”的层包括两个节点。箭头表示从每个输入节点到所有隐藏节点，以及从每个隐藏节点到所有输出节点的连接，说明了信息在网络中的流动。\n\
  \n图 15-11\n\n神经网络的一般视图。来源：来自“File:Colored neural network.svg”，可在 [`​commons.​wikimedia.​org/​wiki/​File:​Colored_​neural_​network.​svg`](https://commons.wikimedia.org/wiki/File:Colored_neural_network.svg)\
  \ 获取，根据知识共享署名-相同方式共享 3.0 未本地化版本许可协议使用（[`​creativecommons.​org/​licenses/​by-sa/​3.​0/​deed.​en`](https://creativecommons.org/licenses/by-sa/3.0/deed.en)）\n\
  \n如前所述，神经网络有许多类型。我们不打算深入研究任何一个，但会讨论每种类型的基本知识，如果你想了解更多，可以去谷歌搜索。最早的现代神经网络是单层感知器，但它用处不大；接下来出现的是多层感知器，也称为前馈神经网络。前馈意味着数据仅沿一个方向流经网络，从输入层到下一层，再到下一层，最终到达输出层。这意味着数据在每一层只会到达一个节点。每个节点都有一个权重和阈值，用于决定是否将数据继续传递下去，但这些权重和阈值在训练过程中会被调整，它们最初是从随机值开始的。由于节点数量庞大，随机起点是最佳选择，调整会持续进行，直到网络输出的数据与每个标签对应，网络据此知道如何进行调节。一种常见的权重调整技术是*反向传播*，它从输出端开始，针对特定的输入-输出对，向后遍历不同的层，利用关于每个权重如何影响输出的知识来调整损失函数。这个过程使得权重得以改善。\n\
  \n另一个重要的神经网络是*卷积神经网络*（CNN），它是一种通过特定优化方式来确定特征的前馈神经网络。它是帮助改进图像处理和计算机视觉的主要创新，并且至今仍在使用，尽管有一些其他方法正在取代它。它之所以如此有价值，是因为它使用了一些技巧来显著减少网络中节点之间的连接数量，这使得它效率更高，并且不太容易出现过拟合——而这种情况在全连接前馈神经网络中可能发生。但它们仍然会消耗大量的计算资源。\n\
  \n*循环神经网络*（RNN）是一种不同类型的神经网络，适用于序列数据（如基于时间的数据和语言数据），其中每个输入并非相互独立——当前序列中先前的元素会通过一个传递下去的隐藏状态被“记住”，这会影响后续的权重。与我们讨论过的其他类型不同，这里的权重并非在每个节点上都不同。相反，同一层中节点上的权重具有相同的值。标准\
  \ RNN 在处理较长的序列时会出现问题，但在处理诸如句子中的单词或时间序列数据中的数值等较小规模数据时表现良好。一种具有更好且更长期“记忆”能力的 RNN 变体被称为*长短期记忆*（LSTM）神经网络。它们效果很好，但需要大量训练。\n\
  \n还有一种类型的神经网络是*Transformer*，这是一种新型网络，在某种程度上已经取代了 RNN 和 CNN，因为它没有同样的局限性，特别是在资源使用方面。它是生成式人工智能（ChatGPT\
  \ 中的 GPT 代表“生成式预训练 Transformer”）的主要工具。这类模型在处理词语的方式上有一些创新。在输入时，一个句子会被转换为一个嵌入（embedding），它表示每个单词的语义（含义），然后每个单词被分配一个数字，表示其在序列中的位置。会使用一些函数来发现单词之间的关系。网络会对各层进行一些调整，然后像一个前馈神经网络那样工作。Transformer\
  \ 仍然需要大量训练，但它们比 RNN 更高效，并且在处理新数据时运行速度更快。\n\n\n\n### 生成对抗网络（GAN）\n\n我要提及的最后一种神经网络是*生成对抗网络*（GAN），它实际上是由两个以特定方式相互交互以生成输出的神经网络组成。整体结构如图\
  \ 15-12 所示。其中一个网络称为*生成器*，它基于随机数据生成数据。生成器的主要目标是生成合理的输出。这些生成的数据会作为负训练样本输入到第二个网络，即判别器。*判别器*是一个分类器，它也会接收真实数据作为输入，因此其任务是学会区分真实数据与来自生成器的虚假数据。生成器的输出直接馈送到判别器的输入中。\n\
  \n![](img/628533_1_En_15_Fig12_HTML.jpg)\n\n流程图展示了生成对抗网络（GAN）的过程。该图表显示“生成器”接收“随机输入”以生成“虚假数据”。这些数据连同“真实数据”被输入到“判别器”中。判别器输出至“判别器追踪”和“生成器追踪”。一个标记为“反向传播”的反馈回路将判别器连接回生成器。关键术语：生成器、判别器、虚假数据、真实数据、反向传播。\n\
  \n**图 15-12** 生成对抗网络的结构与训练行为\n\n`反向传播` 从判别器的输出一直回溯到生成器，并利用计算结果调整生成器的权重（注意，为了行为的一致性，只有生成器的权重以这种方式被改变）。整个系统的目标被称为*收敛*——当判别器对其输入是真实还是虚假进行猜测（基本上是抛硬币决定）时，就是生成器表现最佳的时刻。这个系统的训练很棘手，因为很难知道收敛的确切点。如果生成器在收敛点之后还继续向判别器发送数据，那么判别器可能会开始表现异常，其（基本上是）随机的通过\
  \ `反向传播` 的反馈会对生成器产生负面影响。\n\n一旦系统训练完成（达到并识别出收敛），生成器就可以用来生成数据。你仍然需要向生成器输入数据，但随机噪声就能生成图像。\n\
  \n### *k* 近邻算法\n\n*k*近邻算法（*k*-NNs）是一种监督式机器学习算法，它在多个维度上观察数据，识别每个点的 *k* 个“最近邻”（*k*\
  \ 可以是任意值，包括 1），并可用于分类和回归。它可以使用多种测量“邻近”距离的方法，而高维数据（即具有大量特征的数据）可能需要特殊方法。*k*-NNs 可以用于非线性数据，以及数值型和类别型数据。使用\
  \ *k*-NNs 时需要注意的一个重要事项是，数据必须进行标准化，使其全部处于同一尺度。\n\n*k*-NNs 的一个有趣之处在于，它实际上并没有像我们之前看到的其他监督算法那样有一个真正的“训练”步骤。你仍然需要一个“训练”数据集，但这基本上只是一个参考集。该算法的工作方式意味着非常大的数据集处理时间可能会长到无法接受。请看图\
  \ 15-13，这是我们之前看过的儿童数据集中的数据。它有 15 个标记的数据点，只有两个特征：身高和年龄，其中蓝色代表男孩，红色代表女孩。\n\n![](img/628533_1_En_15_Fig13_HTML.jpg)\n\
  \n散点图展示了以厘米为单位的身高（x 轴）和以月为单位的年龄（y 轴）之间的关系。图表中包含红色和蓝色的数据点，表示两个不同的类别或分组。身高范围从 100\
  \ 到 130 厘米，年龄范围从 50 到 80 个月。\n\n**图 15-13** 提供给 k-NNs 的儿童身高数据集样本，其中蓝色代表男孩，红色代表女孩\n\
  \n如果我们将这个数据集作为“训练集”提供给 *k*-NNs，它将作为我们的参考集。我们将 *k*（即在分类中要考虑的近邻数量）设置为 3（这是一个常用值）。现在，如果我们有两个如图\
  \ 15-14 所示的新数据点，我们可以看到分类是如何工作的。第一个新数据点是左上角的紫色点，第二个是新数据点是中上方的绿色点。我们可以通过肉眼识别出哪些三个参考点最接近紫色点和绿色点，并用黑线标记。对于紫色点，三个近邻点中有两个是红色，一个是蓝色，因此我们将紫色点分类为红色（女性）。绿色点有四个相当接近的点，虽然最近的那个是红色，但接下来两个都是蓝色，因此这个点会被分类为蓝色（男性）。\n\
  \n![](img/628533_1_En_15_Fig14_HTML.jpg)\n\n散点图展示了由线条连接的不同颜色的节点。红色、蓝色、绿色和紫色的节点分布在图表各处。一些节点由黑色线条连接，形成小的簇。该图没有具体的轴标签或数值数据。主要关注点是节点的排列和连接。\n\
  \n**图 15-14** 基于我们“训练”好的 k-NNs 对两个新数据点进行分类\n\n*k*-NNs 在技术上是一个分类器，但也可以计算某个点最近的 k\
  \ 个近邻的平均值用于回归。对于上面的新数据点，如果标签是数值而不是类别，我们只需取三个最近点的平均值。这也相当直观，且易于实现。通常，找到合适的 *k* 需要一些工作，但它在很多情况下都表现良好，尤其是当特征超过两个时。为了找到最佳的\
  \ *k*，你通常会创建多个具有不同 *k* 值的 *k*-NNs 模型，并在每个模型上运行测试集，以找出哪个 *k* 值效果最好。\n\n*k*-NNs 现在不如以前那么常用了，但当特征数量不多时，它仍然是一种强大且简单的算法。它仍被用于许多领域，包括金融市场预测、某些推荐系统和图像处理。\n\
  \n\n\n# 支持向量机\n\n*支持向量机*（SVM）是另一种主要用于分类的监督式机器学习算法，它可以找到一种将数据分组的方法。该算法能够处理线性和非线性数据，尽管针对这两种用途存在不同的变体。在线性变体中，它能在具有许多特征的问题中找到一个线性超平面。\n\
  \n## 超平面\n\n超平面是穿过空间的一条“线”的通用名称，其维度比所在空间少一维。例如，在二维图表上，你可以在此空间内画一条线，它只是一条直线（直线被认为是一维的）。类似地，二维平面可以放置在三维空间中。在四维空间中，它就会是一个三维物体（一个长方体，像立方体但边长不同）。你可以想象出长方体，但无法想象那个空间。但由此开始就完全是抽象的概念了。只需将超平面想象成一条划分超空间的线，而这个超空间只有二维，从此往后都只是类比了。\n\
  \n超平面的作用在于划分空间以分离不同类别的物体。图 15-15 展示了 SVM 试图通过创建一条作为类别间边界的线来达到的目的。在标准 SVM 中，这条线是线性的，因此必须是一条直线，但存在其他可以生成非线性超平面的\
  \ SVM 变体。请注意，在图 15-15 中，存在一些被错误分类的点：一个蓝色点混入红色点中，两个红色点混入蓝色点中。有时这可以通过非线性超平面来解决，但错误在机器学习中是不可避免的。\n\
  \n![](img/628533_1_En_15_Fig15_HTML.jpg)\n\n散点图显示了两个数据点组，一组为红色，另一组为蓝色，由一条对角线分隔开。红色点主要分布在左侧，而蓝色点分布在右侧，展示了分类边界。\n\
  \n图 15-15\n\nSVM 在具有两个特征的数据中分离类别目标的示例\n\nSVM 非常强大，但与其他算法一样，当特征数量过多时，由于维度灾难（我们将在下面讨论），它们可能会过拟合。它们被用于许多任务，包括文本分类和图像目标检测。同样值得一提的是，存在可以进行回归的\
  \ SVM 变体，尽管这种做法不太常见。\n\n# 无监督技术\n\n在无监督学习中，你只是想看看数据本身能告诉我们什么。你并非提供训练数据让其学习规则以应用于新数据。相反，你提供精心策划和准备的（数据）特征，告诉它放手去做，让它自行其是。它会返回关于它在数据中发现的信息给你。\n\
  \n在数据科学中，有两种主要的无监督学习类型被频繁使用：聚类和关联分析。在聚类中，方法会识别出彼此相似的数据组。而通过关联分析，这些技术会为你提供相互关联的更小的事物组。我将在下面分别讨论这两种类型，并提到它们各自的一些不同算法。\n\
  \n## 聚类\n\n聚类是一种用于识别数据中相似点的流行方法。例如，一家零售店可能希望识别不同类型的顾客，以便对他们进行差异化营销。如果我们已经有一些标有类型的顾客数据，我们可以将这个问题视为一个监督问题进行解决。我们可以先在这些数据上训练一个模型，然后用它处理其余未标记的顾客数据。但这需要满足三个条件：知道有多少个组、这些组是什么、以及拥有标有这些组的数据。如果没有这些信息怎么办？聚类就来救场了，因为它不需要这些条件中的任何一个（从技术上讲，有一种方法确实要求你指定组的数量，但你可以通过实验来找到正确的数量）。\n\
  \n### *k*-均值聚类\n\n`k`-均值是数据科学家通常最先学习和使用的聚类方法。`k`-均值聚类通过将每个数据点分配到与其最近的簇（由该簇的中心定义，即簇内所有点的均值）中，来识别预先指定数量的簇。但是，既然这些簇事先没有标记，它们是如何得到分组的呢？`k`-均值采用自上而下的方法，首先查看所有数据，并将其划分成所谓的泰森多边形（参见图\
  \ 15-16，了解数据被分解成泰森多边形的示例）。\n\n![](img/628533_1_En_15_Fig16_HTML.jpg)\n\n一幅彩色的泰森多边形示意图，展示了各种不同颜色的多边形区域，每个区域中心有一个白色点。这些区域形状不规则，共同铺满整个空间，说明了基于到一组点的距离来划分平面的概念。\n\
  \n图 15-16\n\n针对一个包含 28 个点的随机数据集的泰森多边形\n\n白点代表我们的数据集，多边形就是泰森多边形。请注意，它们并非随意确定的。要生成它们，你需要先在每个点与其直接相邻点之间画一条线，然后在每两个点之间的中点处画一条垂直于该线的线。将这条垂直线延伸直至碰到另一条线，最终你就会得到这些带有尖角的形状。\n\
  \n这是一个概念上的起点。如果你将 `k` 设置为 28，并且每个这些点都是你的簇中心，那么这个空间内的任何新点都将被分配到对应每个泰森多边形的簇中。计算 `k`-均值最常用的算法速度较慢但直观，被称为朴素\
  \ `k`-均值。你首先指定 `k`，然后算法会先分配 `k` 个随机的簇中心。接着，数据集中的每个点都被分配到最近的这 `k` 个簇中心之一。这时泰森多边形就发挥作用了，因为任何泰森多边形内的数据点都被分配给了该随机簇中心。\n\
  \n在此之后，我们开始调整簇。对于每个簇，我们计算该簇内所有点的均值，这个均值就成为该簇调整后的中心。这是一轮迭代。这个两步过程不断重复：先将每个点重新分配到最近的簇，然后重新计算中心。有一个衡量每个簇中心及其点距离的指标，称为*簇内平方和*，每次中心重新计算后都会计算该值。这个过程反复进行，直到簇内平方和停止变化，此时我们称算法已收敛。\n\
  \n关于 `k`-均值的一个有趣之处是它总是会收敛，尽管不能保证一定能找到最优的簇。这是因为起始点是随机选取的。通常的做法是运行几次，看看这些簇是相似的、不同的还是截然不同的。此外，除了上述方法之外，还有其他衡量“邻近度”的方式，但它们不像这种简单方法那样保证能收敛。\n\
  \n请注意，除了完全随机赋值之外，还有一些分配初始簇中心的方法（例如随机分区法和 Forgy 法）。你可以通过谷歌搜索了解这些方法。\n\n我们已经讨论了如何运行\
  \ `k`-均值，但还没有讨论如何知道你的 `k` 到底应该取多少。有时你可能对数据中可能存在什么有所了解，因此你可能会有一些看起来值得尝试的数值。如果你试图识别一家商店的不同类型顾客，将\
  \ `k` 设为 50 可能是不合理的——公司如何为 50 种不同类型的顾客制定差异化的营销或其他服务？此外，你的 `k` 值越高，算法所需的数据就越多。\n\n\
  \n\n幸运的是，你无需事先知道正确的`k`值，因为有一些方法可以帮你系统地挑选出一个合适的值。这类方法有多种，在此我将介绍肘部法和轮廓系数法，更多信息可以自行搜索。\n\
  \n肘部法简单且常用，但由于难以明确界定“肘部”的位置，它被认为并非极其可靠。使用*肘部法*时，你需要确定可能的聚类数量，例如 2 到 10 个。然后对每个候选值运行\
  \ `k` 均值算法，并计算每次运行后最终的聚类内离差平方和，接着以聚类数量为横轴、该值为纵轴绘制图表。我们需要寻找的点是，随着聚类数量增加，聚类内离差平方和从快速下降转为显著减缓或趋于平稳的转折点。图\
  \ 15-17 展示了几种可能的图表示例。\n\n![](img/628533_1_En_15_Fig17_HTML.jpg)\n\n两个用于比较肘部法确定 k\
  \ 均值聚类最佳聚类数量的 X-Y 图表。左侧图表标题为“肘部法：可见肘部”，在 k=3 处有一个明显的弯曲点，表明这是最佳聚类数。右侧图表标题为“肘部法：无肘部”，曲线下降较为平缓，没有明显弯曲点，表明没有清晰的最佳聚类数。两个图表均以聚类数量\
  \ (k) 为横轴、聚类内离差平方和 (WCSS) 为纵轴。\n\n**图 15-17**  \n用于确定最佳 `k` 值的两个肘部图。左侧图表有可检测到的肘部，而右侧图表则没有。\n\
  \n在图 15-17 的图表中，左图在 `k = 3` 时出现了我们寻找的转折点——即聚类内离差平方和下降速度发生改变的节点。但右图中并不存在这样的点。这就是该方法并非总被使用的原因。它被认为是主观的，如果你改变图表的比例或尺寸，肘部看起来可能会或多或少像“肘部”。不过，你总能快速生成这张图表，如果运气好，或许能看到一个明显的肘部。\n\
  \n另一种确定合适 `k` 值的常用方法是轮廓系数法。使用*轮廓系数法*时，通过衡量每个数据点与其所在聚类内其他点的相似程度，以及与相邻聚类内点的差异程度，来评估每个点的聚类效果。这需要计算每个点的得分，再综合整个结果，得分范围在\
  \ -1 到 1 之间，高分表示聚类效果好，低分则反之。该方法在特征数量较少的数据集上表现良好，但当特征数量众多时，维度灾难问题便会再次凸显。\n\n事实上，如同许多机器学习算法一样，这里通常也需要反复试验。由于需要预先指定聚类数量，该方法需要花费一些功夫，但在识别有意义的群体方面，它可能极其强大。\n\
  \n## 层次聚类\n\n还有其他一些聚类方法被称为层次聚类，主要有两种类型：凝聚层次聚类和分裂层次聚类。凝聚法采用自底向上的方式构建聚类，每个数据点初始时各自为一个簇，然后逐步向上合并合理的簇。分裂法则是自顶向下，我们从包含所有数据的一个大簇开始，根据每个簇的特征将其逐步分裂。所有层次聚类方法都会生成一个名为树状图的树形结构，该结构展示了从每个数据点为一个簇到所有数据点合为一个簇（凝聚法）或反之（分裂法）的层次关系。\n\
  \n这两种方法都使用距离度量来指导分裂或合并的决策。距离度量通过比较数据集中的单个数据点，来衡量所谓的相异性。另一种称为簇间链接的度量，则考察不同数据集合之间的差异。\n\
  \n在最常见的凝聚法中，每一步都会将两个簇合并。有趣的是，这个过程会一直持续到所有数据点最终合并成一个簇。待算法运行完毕后，你可以在树状图中选择一个层次进行“剪枝”，并将该层次下的簇作为最终的聚类结果。图\
  \ 15-18 展示了这样一个例子。它演示了在鸢尾花数据集上执行的凝聚层次聚类，该数据集是一个著名的公开数据集，许多人在初学机器学习时都会使用它。该数据集包含了三种鸢尾花的标注数据。\n\
  \n![](img/628533_1_En_15_Fig18_HTML.jpg)\n\n聚类后的鸢尾花数据集树状图，展示了三个物种（维吉尼亚鸢尾、杂色鸢尾和山鸢尾）之间的层次关系。每个物种用不同颜色标记——维吉尼亚鸢尾为粉色、杂色鸢尾为绿色、山鸢尾为蓝色。树状图结构展示了单个样本的聚类过程，标签指示了真实的花卉物种。x\
  \ 轴代表用于聚类的距离度量。\n\n**图 15-18**  \n花卉数据集的凝聚层次聚类树状图。来源：“File:Iris dendrogram.png”，可从\
  \ [`commons.wikimedia.org/wiki/File:Iris_dendrogram.png`](https://commons.wikimedia.org/wiki/File:Iris_dendrogram.png)\
  \ 获取，基于知识共享 署名-相同方式共享 4.0 国际许可协议 ([`creativecommons.org/licenses/by-sa/4.0/deed.en`](https://creativecommons.org/licenses/by-sa/4.0/deed.en))\
  \ 使用。\n\n该算法从右侧开始，每个单独的花朵数据点自成一个簇，其类别用颜色表示。接着，算法开始逐一合并这些簇，每次合并两个，并向上移动以生成树状图的各个层次。你可以看到颜色变化之处，许多*杂色鸢尾*样本开始被聚在一起，最终与*维吉尼亚鸢尾*样本合并为一个簇。但你可以选择在树状图的某个位置进行剪枝，以查看具体的聚类情况。假设我们决定在\
  \ x 轴刻度为 3 的位置剪枝。想象一条从该点向上延伸的垂直线，它会穿过四条水平分支线，每条分支线代表一个不同的簇。此时可以观察花朵样本是如何被分组的。在垂直线右侧、该分支线之下的所有样本都属于同一个簇。因此，你可以看到有两个簇分裂了*维吉尼亚鸢尾*样本，而杂色鸢尾和*山鸢尾*各有一个簇，其中部分样本被分到了错误的簇中。\n\
  \n分裂层次聚类的工作原理与凝聚法基本相反，它从一个包含所有数据的簇开始，最终以每个数据点各自为一个簇结束。从视觉上看，它也会生成类似图 15-18 的树状图，只是构建方式不同。更多详情可自行搜索。\n\
  \n\n\n### 关联规则学习\n\n关联规则学习是另一类无监督机器学习。你可能听说过啤酒与尿布的故事：男士们周五下班后会顺路去商店买尿布，并在去收银台的路上顺手拿一箱啤酒。这听起来像是个传闻，但显然并非虚构——曾有一个团队在药店进行关联规则挖掘，确实发现啤酒与尿布之间存在强关联，此外还有超过\
  \ 20 种产品对。^(⁴¹)\n\n`关联规则学习`（有时也称挖掘）着眼于项集——即成对或更大集合的物品组合——以识别那些会促使购买另一物品的商品。啤酒与尿布的故事之所以相关，是因为零售业是其典型应用场景。它甚至常被称为购物篮分析，因为我们分析的是某人购物车中的商品。规则本身包含方向性，基本可以理解为“如果-那么”的组合理念：如果他们买了一包尿布，那么他们也常会买一箱啤酒。\n\
  \n关联规则学习的主要方法是`Apriori`算法。我们曾在其他语境（包括朴素贝叶斯在内的贝叶斯统计）中听过这个术语，但在这里，它提出了一种利用特定概率进行关联规则学习的具体方法。该算法首先通过观察购物篮（即单次交易中的所有商品）来识别规则，然后创建由至少两个商品组成的项集。对于每个项集，会计算一个名为`支持度`的分数，即该潜在项集在所有交易中出现的百分比，并保留所有超过特定选定阈值的项集。支持度足够高的项集被称为`频繁项集`。然后从精简后的集合中生成所有可能的规则。请注意，如果频繁项集的数量不止几个，那么规则的数量将会极其庞大。规则写作形式如`{牛奶}\
  \ ⇒ {面包}`或`{牛奶, 面包} ⇒ {黄油}`，我们将左侧称为`前件`，右侧称为`后件`。\n\n下一步是计算每个可能规则的`置信度`分数，即同时包含前件和後件的交易百分比。置信度能很好地指示商品配对的显著性。正如我们丢弃支持度低于特定阈值的项集一样，我们也会丢弃置信度低于另一个定义阈值的规则。\n\
  \n这些信息很有用，但有时置信度本身可能具有误导性，因此我们还需要计算另一个分数，称为提升度。`提升度`基于支持度计算，它能告诉我们三种可能关系的存在性（及强度）：（1）第一件商品的出现是否会导致第二件商品的购买，（2）两者之间是否存在关联，或（3）两者是否具有相反效果（第一件商品的出现反而降低了第二件商品出现的可能性，这意味着替代关系）。提升度分数告诉我们第二件商品与第一件商品同时出现的概率提高了多少（提升度为\
  \ 4 意味着比总体概率高四倍）。还有一个能让我们更深入了解关联有效性的分数，`确信度`，它也可以基于支持度和置信度计算得出。\n\n还有其他一些用于计算关联规则的算法，但`Apriori`算法使用广泛且效率相当高。\n\
  \n## 模型解释器\n\n与机器学习相关的一个领域是相对较新、仍在大力发展的模型解释器。`模型解释器`是一种工具，它接收一个已训练的模型以及针对未见数据的预测，并确定在已训练模型中哪些特征对每个单独预测的贡献最大。这在黑箱模型中，或者当模型可解释性较低时，具有无可估量的价值。正如我们讨论过的，决策树在可解释性方面表现出色，但它们存在一些缺点，而当我们改用随机森林时这些缺点可以得到缓解。然而，随机森林在很大程度上是不可解释的。你可以获得整个模型的特征重要性分数，但它无法告诉你关于某个特定预测的任何信息。我的团队曾为一个销售预测模型制作了可视化工具，你可以将鼠标悬停在某一天的预测值上，它会显示对该天预测贡献最大的前十项特征。这对利益相关者来说价值巨大，同时也让我们对自己的模型更有信心，因为模型从我们提供的众多特征中，为每一天捕捉到了有意义的特征。\n\
  \n目前市面上有几种模型解释器，各有优缺点。有些仅适用于线性数据，有些适用于任何模型，还有些仅适用于特定模型（算法）。我使用过且效果不错的一个叫做`LIME`（局部可解释模型无关解释），Python\
  \ 和 R 语言中都有相应的库。你可以谷歌搜索这个主题来探索更多工具，从`SHAP`（沙普利加性解释）开始就是一个不错的选择。\n\n\n\n# 机器学习的实现与编码\n\
  \n我已经介绍了一系列非常重要且实用的机器学习技术，以及它们的训练或运行方式。但当我们实际去实现它们——也就是编写代码时——还有一些其他非常重要的技巧。上面讨论的所有方法在\
  \ R 和 Python 的某些库中都能找到，这很棒。但你不能简单地把数据扔给一个机器学习函数，就期望得到良好的结果。\n\n我在上面谈到了超参数调优的重要性，以及如何通过使用验证集或交叉验证来操作。有一些库可以帮助你完成这项工作。你需要提供数据、所使用的模型，以及你希望为每个参数尝试的所有可能值。网格搜索会尝试所有参数的所有组合，并追踪每次的表现。如果你尝试的参数超过几个，且每个参数的取值也很多，这显然会花费大量时间，因为这些值的组合数量会非常庞大。幸运的是，有一些库允许你从所有可能的参数组合中选择一个子集，只运行这些组合。这些工具会使用每种组合运行算法，存储性能，并报告表现最佳的参数集。\n\
  \n通过验证集上的网格搜索进行超参数调优很棒，但如果你只是在整个训练集和验证集上运行所有内容，最终得到的模型可能并非最适合处理新数据的模型。由于数据科学的很大一部分在于创建一个能够处理前所未见的数据并返回有意义结果的模型，这一点非常重要。一种称为*交叉验证*的技术会自动将你的数据分解成更小的训练子集，并在每个子集上运行所有内容（包括超参数调优）。这使得模型更加健壮，并有助于防止过拟合和偏差（我们将在下文讨论这两点）。R\
  \ 和 Python 中也有用于此目的的库，使其相对容易实现。\n\n与数据科学中的其他所有内容一样，有几种不同的交叉验证技术可供选择。你可以向谷歌询问更多关于这些技术以及它们何时最佳的信息，但一种常见的技术称为*k\
  \ 折交叉验证*，即将训练数据集分成 `k` 个（通常为 10）子集。然后，你总共运行模型 `k` 次，每次使用不同的子集进行测试。这代替了使用特定的验证集。\n\
  \n最后值得一提的是，数据科学中的科学性有时会比其它方面更为突出。这并不意味着我们要严格遵循科学方法，但有些数据科学团队会尽可能系统化。而其他团队则可能会更随意一些。当我们测试不同类型的算法时，通常会说进行实验。当我们在研究一个解决方案，并知道我们将尝试不同的算法时，先运行一个我们预期表现不如其他算法（但仍比随机猜测要好）的算法，也是很常见的。我们称之为基线，在许多回归预测中，这通常是一个时间序列模型。拥有基线为我们尝试的所有其他算法提供了一个参考点。这可能是一种很有收获的工作方式，因为我们可以非常清晰地了解正在发生的事情。\n\
  \n# 建模中的挑战\n\n机器学习有很多活动部件，也充满了出错或运气不佳的可能性。通过了解一些常见的陷阱，以及如何识别、处理甚至完全避免它们，可以减轻这些问题。我将讨论过拟合，即模型与特定训练数据过于紧密，导致泛化能力不佳；欠拟合，即模型遗漏了重要的模式；不平衡数据，即某一标签的数量远多于其他标签；维度灾难，即拥有过多维度导致难以获得良好结果；以及数据泄露，即给了模型一个它无法持续的不公平优势。\n\
  \n## 过拟合与欠拟合\n\n过拟合和欠拟合都是模型表现不佳的情况，只是方式不同。我将讨论它们以及偏差-方差权衡，这是一种平衡模型以避免过拟合和欠拟合的方法。\n\
  \n*过拟合*是指模型学习了训练数据（和测试数据）中非常具体的特征，而这些特征在未来数据中可能不存在，因此模型无法很好地泛化。当数据质量低下且包含大量噪音时，也可能发生过拟合。如果模型“学习了噪音中的模式”，那就是过拟合了（而且也就是错的）。看看图\
  \ 15-19，它与图 15-15 的数据相同。在图 15-15 中，我们有一条简单的直线，将图中的数据分成蓝色和红色标签，有三个数据点（两个红色和一个蓝色）被错误分类。与图\
  \ 15-19 相比，我们有一条弯曲的线，代表模型的训练分隔器，它过于专注于这三个可能的异常值。当我们对未来的数据进行分类时，这会产生负面后果。\n\n![](img/628533_1_En_15_Fig19_HTML.jpg)\n\
  \n散点图显示了分布在 XY 轴上的两组数据点，一组为红色，另一组为蓝色。一条曲线将这两组分开，表示决策边界或分类线。红色点大多在线的一侧，而蓝色点在另一侧。该图说明了分类或聚类分析。\n\
  \n图 15-19\n\n使用过拟合模型的数据\n\n不难看出，这个模型很奇怪，而且很可能是错误的。假设有两个新点需要分类，如图 15-20 所示。图中显示了两个新数据点，其正确类别标记在绿色圆环的中心。但是，由于它们恰好位于迂回决策边界内的错误位置，因此会被错误分类。那个靠近许多其他红点的新红点会被标记为蓝色，而那个紧邻一个正确分类的蓝点的新蓝点会被标记为红色。很明显，这不是我们希望模型做到的事情。\n\
  \n![](img/628533_1_En_15_Fig20_HTML.jpg)\n\n散点图显示了由决策边界分隔的两个数据点聚类，一个为红色，另一个为蓝色。边界由一条曲线表示。两个绿色高亮显示的点位于边界附近，表示潜在的支持向量。该图说明了一个分类场景，可能使用了支持向量机（SVM）模型。\n\
  \n图 15-20\n\n两个需要由这个过拟合分类器分类的新数据点，正确类别在中心标示\n\n过拟合的产生有很多不同的原因，包括维度灾难（下文讨论），其中特征过多会导致过拟合。模型也可能因为算法特定的特征或倾向而过拟合。例如，如果你让决策树变得过深，它可能会严重过拟合，因为它试图解释训练数据的每一个微小特征。随机森林不太容易出现这种情况，因为并非每个数据点都会出现在每棵构建的树中（在成百上千棵树中）。全连接前馈神经网络和\
  \ SVM 都容易随着特征数量的增加而出现过拟合。通常，仅仅训练时间过长（比如深度决策树）也会导致过拟合。基本上，如果你不了解算法是如何合理工作的，那么很容易最终导致过拟合。\n\
  \n\n\n防止过拟合有多种方法。如前所述，不要训练模型太久——**早停法**会很有帮助。如第 14 章中此前讨论过的，特征选择确实有效（既能减少特征数量，又能剔除那些贡献不大、可能混淆算法并导致对其重要性得出错误结论的特征）。**正则化**是另一种有用的技术，同样在第\
  \ 14 章中讨论过。其他集成机器学习方法也很有价值，当不同模型开始陷入特征细节的死胡同时，它们可以相互抵消过拟合的倾向。\n\n过拟合是一个问题，但相反的欠拟合问题也需要避免。*欠拟合*是指模型未能捕捉到数据中的模式。它可能由于模型训练时间不足、数据量不够或数据不具有代表性而导致。第一个问题的解决方案显然是训练更长时间（但不要*过*长）。第二个问题通常可以通过半监督技术来增加数据量，或通过其他方法（如下文\"\
  数据不平衡\"小节所述）创建合成数据来缓解。但如果数据不具有代表性是因为我们没有足够的不同特征的样本，这些技术就帮不上忙了。我们只能寻找更多数据以获得更好的代表性。\n\
  \n可以看到，过拟合和欠拟合处于光谱的两端。我们实际上将管理这个光谱称为*偏差-方差权衡*。欠拟合模型存在*偏差*，因为它们做出了过于简单的假设，导致在训练集和测试集上的表现都很差。过拟合模型在训练集和测试集之间存在*方差*，这意味着它们在训练集上表现良好，在测试集上（或其他未见过的数据上）表现很差，因为它们对训练数据过于敏感。之所以称之为权衡，是因为某些用于减少偏差的方法实际上可能会增加方差，反之亦然。例如，特征选择可以降低方差，因为它使模型更简单，但也可能导致偏差增加。某些线性模型中的正则化会降低方差但增加偏差。在决策树中，树越深，方差越大。虽然有一些计算偏差和方差的方法，但它们相当复杂，对大多数日常工作来说并非必需。\n\
  \n### 数据不平衡\n\n在分类问题中，我们特别容易遇到的另一个问题是数据不平衡，即不同标签的出现次数不均衡。例如，在异常检测中，绝大多数数据（根据定义）是正常的，因此我们只有相对较少的异常标签样本，而更多的非异常标签样本。这在训练模型检测异常时可能会带来问题。\n\
  \n异常标签场景是极端不平衡的一个例子，即一个标签占总数据量的比例不到 1%。但即便不那么严重的不平衡，在二分类问题中也可能产生影响。当标签出现比例仅为 20%时被认为是中度不平衡，比例达到\
  \ 40%时为轻度不平衡。\n\n处理不平衡有几种方法。一种是对多数类（出现频率高的标签）进行**下采样**并**提高权重**。*下采样*是指从多数类中抽取样本，以减少少数类与多数类之间的差距。例如，如果我们有\
  \ 1 个异常样本对 100 个非异常样本，我们可以抽取 5%的多数类，这样最终只有 5 个非异常样本对 1 个异常样本，比例从 0.9%变为 17%。这种方法的下一个步骤是*提高权重*下采样后的多数类，即标记这些样本在训练过程中需要被更重视地对待。\n\
  \n另一种许多人常用的技术叫做*SMOTE*（合成少数类过采样技术），它与上述技术相反——它增加少数类样本的数量。它通过创建新的（合成的）具有异常标签的样本来用于训练，从而使数据集达到更好的平衡。该技术使用*k*-近邻法识别给定真实样本周围的区域，然后选择一个邻居，并在原始样本与邻居之间创建一个新的合成数据点。\n\
  \n\n\n### 维数灾难\n\n我在上文已经提到了这个问题。*维数灾难* 指的是由于特征过多而引发一系列问题的情形。其中最明显的问题是，特征越多，数据就越难以可视化。显然，我们无法真正在三维以上空间中对数据进行可视化，但通常可以通过一些技巧来包含三个以上的特征，例如在散点图中使用颜色和点的大小。此外，有时我们可以通过解析数据，一次只查看少量特征；如果只有\
  \ 10 个或 20 个特征，这还行得通，但特征越多，这种方法就越不实用。\n\n第二个问题是*数据稀疏性*，即数据分布非常分散，数据点之间（有时只是部分数据点之间）存在大量空白区域。从图\
  \ 15-21 和图 15-22 中，我们可以看到增加维度如何导致稀疏性。如果我们从一个虚构的祖孙群体中，以受教育年限数据的一维视图开始，只有一个轴上的一个特征，如图\
  \ 15-21 所示，我们可以看到数据分布在一个小范围内，尽管 20 年那个点是一个异常值。（注意，我添加了抖动，这使得数值有轻微偏移，因此具有相同数值的点不会完全重叠。）\n\
  \n![](img/628533_1_En_15_Fig21_HTML.jpg)\n\n散点图显示了沿 x 轴（标记为“受教育年限”）的数据点，范围从 0 到\
  \ 25。数据点均匀分布在 5 到 20 年之间。\n\n图 15-21\n\n一组人的总受教育年限的一维视图\n\n但是，我们的数据集拥有的特征不止总受教育年限这一个。我们可以将年龄添加到图表中，创建一个标准的二维散点图，如图\
  \ 15-22 所示。一旦我们这样做，就可以看到两个点距离所有其他点以及彼此之间都非常远。\n\n![](img/628533_1_En_15_Fig22_HTML.jpg)\n\
  \n标题为“受教育年限与年龄”的散点图。x 轴表示受教育年限（范围 0 到 25），y 轴表示年龄（范围 0 到 100）。数据点分布散乱，大部分集中在受教育年限\
  \ 10 到 20 年、年龄 10 到 30 岁之间。存在两个异常值：一个位于受教育年限约 10 年、年龄 90 岁处，另一个位于受教育年限 20 年、年龄 90\
  \ 岁处。\n\n图 15-22\n\n将数据维度从一维增加到二维的影响\n\n图 15-22 中的这些点距离如此之远，以至于很难将它们纳入模型而不会引发其他问题，例如过拟合。此外，这些距离较远的点恰好是整个数据集中的最低值和最高值。看起来，如果我们在模型中使用年龄，模型会无所适从——年龄较大与高学历还是低学历相关？那么，在大部分数据点聚集的区域与那两个较远的点之间的所有空间里，又发生了什么？我们完全不知道，因为我们没有足够的数据来支撑这么多的维度。如果仅增加一个维度数据就开始分散，想象一下在\
  \ 10 个维度、50 个维度甚至更多维度下会发生什么。我们拥有的特征越多，就需要越多的数据来表现每个特征及其与其他特征之间关系的真实多样性。\n\n如图所示，过拟合是维数灾难带来的另一个问题，这主要源于数据稀疏性。第四个问题是，特征越多，“距离”的概念就越模糊。因此，当我们处理高维数据时，一些用来衡量距离的典型指标就不再有效了。\n\
  \n另外两个问题与随着特征数量增加而必须进行的计算量有关。它会开始消耗越来越多的计算资源，运行时间也越来越长。根据特征的数量，这可能会达到完全不切实际（或成本过高）而无法运行的地步。\n\
  \n### 数据泄露\n\n`Data leakage` 源于建模中最容易犯的错误之一——意外地将不应包含的数据放入了训练集中。这可能来自测试集中的行（很容易发生），或是任何关于目标变量的信息，而这些信息在进行真实预测时是无法获取的。\n\
  \n另一个容易犯的错误，尤其是在你刚开始时，就是意外地将训练集（和测试集）中存在的、但当你对未见/未来数据运行模型时不会存在的特征包含了进来。例如，假设你要预测一家餐厅未来一周（周一至周日）的每日披萨销量。你创建了一大堆很棒的特征，包括前一天的销量和上一周的销量。这在你的测试集中是可行的，因为你拥有完整的数据，可以计算所有这些特征。但当你要对即将到来的一周进行真正的预测时，你可能直到周日晚间才能获得所有销量数据，然后你会在周一清晨运行下一周的特征更新和预测。这没有问题，因为你已经有了前一天的销量。那周二呢？周一清晨你还没有周一的销量数据，因为餐厅甚至还没开门。如果你试图基于这些数据运行模型，你的特征生成或预测很可能会失败，因为它会缺失这些信息。但更糟糕的情况是，你的模型直接使用了空值（其影响未知，但肯定不好）。\n\
  \n数据科学要求注重细节，并始终思考你正在做什么。如果你得到了非常高的准确率或性能得分，那你很可能遇到了`数据泄露`。任何时候，当你在测试集上取得惊人好的性能时，都要检查这种错误。首先，检查训练集和测试集之间是否有重叠。然后，检查是否存在不合理的特征。此外，如果你在处理基于时间的数据，你几乎总是希望将测试集放在数据的时间序列末尾，而将训练集放在其前面。如果你包含了依赖于先前值的特征（例如上个月的销量），那么这就是一个必要条件。\n\
  \n\n\n# 关键要点与下章预告\n\n本章我们涵盖了大量机器学习主题。首先重点定义了机器学习的三种关键类型：监督学习、无监督学习和强化学习，同时也介绍了半监督学习和集成学习，这两者对机器学习领域贡献颇多。随后我们深入探讨了几种监督学习算法，包括时间序列分析、广义线性模型、决策树、朴素贝叶斯、神经网络、`k`-最近邻和支持向量机。接着讨论了两种关键的无监督学习技术：聚类和关联规则挖掘，并涉及了`k`-均值和层次聚类两种聚类类型。我介绍了能够帮助解释黑箱模型预测结果的模型解释器，以及在代码中实践机器学习时的一些实用要点。最后，我阐述了进行机器学习建模时面临的主要挑战，包括过拟合与欠拟合（即模型泛化能力不足或遗漏重要模式的情况）、不平衡数据（不同标签的样本数量差异巨大）、维数灾难（模型中特征过多引发的问题）以及数据泄露（训练模型中混入了本不该存在的信息）。\n\
  \n下一章我们将探讨如何评估模型训练后的表现。由于分类任务和回归任务的评估方式差异较大，我们将介绍多种可用于衡量这两类模型性能的指标。同时也会探讨一些用于评估聚类算法性能的指标。\n\
