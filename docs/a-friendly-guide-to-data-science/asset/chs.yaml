  \n### 平衡的方法\n\n正如我上面提到的，大多数时候你对你的数据和它所在的领域有所了解，因此你知道哪些转换和交互可能最有意义。做一些研究来找出哪些转换在你拥有的数据类型中很常见，这总是明智的，因为通常存在约定俗成的转换或交互。\n\
  \n有时，只需正确的特征，你就可以学到一些东西或创建一个强大的模型。因此，很容易诱使人尝试每一种可能的转换或交互，并依赖下一步——特征选择——来找到有价值的那些。然而，这是个坏主意。特征选择技术并不完美，而且扔给它的（或者说扔给机器学习算法的）垃圾越多（说真的，这些特征大部分都是垃圾），你就越有可能混淆它。这些方法有时能在干草堆里找到针，但同样经常的是，它们会发现一堆仅仅因为巧合而看起来效果不错的特征。你应该坚持使用有意义的转换和交互。这就是为什么数据科学是科学而不仅仅是变戏法。\n\
  \n#### 特征爆炸与维数灾难\n\n创建过多特征这个问题的名称是*特征爆炸*，即当你拥有太多特征，以至于机器学习模型无法有效估计或优化时。特征选择是用于减少特征数量的最常见任务，但也使用了称为正则化和特征投影的技术。两者都将在下面讨论。\n\
  \n*维数灾难*是一系列在高维数据中发生的现象。它的产生是因为特征数量组合爆炸式增长。挑战在于你需要大量记录才能有意义地表示特征的许多组合。但是高维数据通常是稀疏的，并且样本之间通常相对“遥远”。这意味着特征的组合没有很好的代表性，因此没有足够的信息来训练一个精确的模型。\n\
  \n因此，基于你拥有的样本数量，你应该拥有多少个特征是有上限的。一个经验法则是，你的特征集中每个特征至少要有五个训练样本。虽然这作为一个经验法则有效，但在特征数量和训练样本之间总是存在一个平衡。其他因素也会影响所需样本的数量，包括模型的复杂性以及特征冗余的程度。\n\
  \n但现实是，有时你不得不尝试看看，因为有时你可以拥有相对较高的特征与训练样本的比率，但仍然得到好的结果。我曾参与一个预测商店销售的项目，我们使用五年的训练数据（按天聚合）为每个单独的商店创建了一个模型。所以每个商店只有大约\
  \ `5 * 365`，或者说略高于 `1,800` 个训练样本。我们有大约 `450` 个特征，起初我们认为这太多了。但早期的探索很有希望，所以我们继续部署了一个运行良好的模型。它最终运行了一年多，并且在大多数日子里（在合法的未见过的数据上）持续获得百分之九十出头的准确率。我们还在仪表板中构建了一个模型解释器，它能告诉我们每天预测中最重要的特征。我们看到了一些有意义的、且每天都不同的特征，这是健康模型的标志。数据科学中很少有硬性规则。\n\
  \n\n\n# 优化特征集\n\n识别甚至创造优质特征在数据科学中至关重要，但你仍需判断哪些特征应实际纳入你的*特征集*。`正则化`和特征选择是常用的特征选取方法，下文将对此进行讨论。此外，还有一种名为特征投影（或称降维）的技术，通过合并特征来减少特征总数，同时保留最关键的信息。\n\
  \n数据准备的这一环节尤其有助于应对过拟合与欠拟合问题。*过拟合*指机器学习模型在训练数据上表现极佳，但因其过度特异化于该数据集，无法泛化至新数据。模型在训练中发现的某些模式仅存在于该数据集中。预测模型的核心价值在于对未知的未来数据进行预测，而过拟合的模型在这一环节表现糟糕。这通常被比作死记硬背——就像有人记住了大量事实却未能真正理解，因此无法运用这些“知识”。我们将在下一章深入探讨此问题（包括如何检测它）。\n\
  \n*欠拟合*则相反——模型过于简单，未能捕捉训练数据中的重要模式。这种情况通常因缺乏能刻画数据模式的关键特征而发生。\n\n## 特征选择\n\n尽管套索正则化能有效剔除特征，但还有其他重要的特征选择方法。它们通常分为三类：包装法、过滤法和嵌入法。\n\
  \n### 包装法\n\n包装法特征选择的基本思路是：选取部分特征，基于预测模型（部分数据训练，其余数据测试）评估其表现（根据误差率），再对新的特征集重复此过程。这看似有些本末倒置，因为你本要寻找适合自己模型的特征，而它却自行推进尝试。此类方法通常需要大量计算资源，因为需遍历众多特征子集，但准确率也较高。当特征数量庞大时，高昂的计算成本可能使其不切实际（甚至无法实现）。此外，由此生成的特征集有时仅对与选择过程中所用预测模型相似的机器学习方法有效，但这并非绝对。\n\
  \n有一类流行的技术称为逐步回归，可分为前向、后向或双向选择。*前向选择*从零特征开始，每次添加一个特征，并在每次变更后运行模型评估表现。*后向消除*则相反，从全部特征开始，每次移除一个特征并进行测试。双向选择则同时进行前向与后向操作，直至无更多组合可尝试。这些方法无需穷举所有组合，而是利用统计技术决定每轮应移除哪些特征。\n\
  \n### 过滤法\n\n过滤法对特征进行某种计算，然后选取满足特定计算标准（通常是阈值）的特征。*方差阈值*法适用于数值型特征，通过计算各特征的方差，舍弃低于特定阈值的特征。\n\
  \n皮尔逊相关系数用于另外两种过滤技术。首先，可计算特征间的相关性。当特征彼此相关时，称为*共线性*（有时也称*多重共线性*）。当存在两个或多个高度相关的变量时，不应同时保留多个，因为这会过度强调特定信息，并对结果产生不良影响。如前所述，当从其他特征派生出新特征时，观察所有特征往往会发现共线性。\n\
  \n另一种常见做法是检查特征与目标变量之间的相关性，但这并非绝对可靠，因为特征之间可能存在交互作用共同影响结果，而单独看未必与目标变量强相关。这正是机器学习价值的核心原因——数学能同时处理比人类多得多的大量信息，因此即便关系微妙或仅在特定情况下重要，也能发现这些关联。你可以剔除低于特定相关水平的特征。\n\
  \n虽然相关性和方差是常见的过滤指标，但还有其他过滤方法。例如，使用互信息这一计算指标来比较特征对，帮助排除部分特征（类似于相关性，但适用于非线性关系）。\n\n\
  与许多事物一样，过滤法需要精细处理。想象一个初中生数据集，其中同时包含以年为单位和以月为单位的年龄。这两个特征显然高度相关，尽管月份特征比年份特征包含更多信息。你不需要同时保留两者。对于成年人，选择哪个可能无关紧要；但由于这些是年龄较小的群体，若研究的是成熟度这类指标，月份就会产生差异——146\
  \ 个月和 156 个月的孩子之间的差异，远大于 912 个月和 922 个月之间的差异。正如数据科学中的许多事情，特征选择可能是一门随着职业发展而逐渐领悟的艺术。\n\
  \n### 嵌入法\n\n嵌入法结合了过滤法和包装法的优点。与包装法类似，这些方法通过预测模型（在训练集和测试集上运行）的表现来测试特征。区别在于，嵌入法并非仅通过多轮迭代评估指标，而是在训练过程中直接选择特征。\n\
  \n*正则化*是一组流行的嵌入技术，它通过降低某些特征在机器学习模型中的影响力来防止过拟合并提升模型泛化能力。有时这可能略微降低训练集的表现，但针对与训练数据不同的新数据，模型的稳健性会大幅提升（在测试集上表现更佳）。\n\
  \n主要存在两种正则化方法：岭回归和套索回归，以及结合两者的弹性网络。这些方法均涉及复杂的数学运算，但通过几行代码即可实现。岭回归和套索回归通过计算各特征的权重（惩罚项，即特征值的乘数）来惩罚复杂的特征集。套索允许权重计算为\
  \ 0，这意味着它实际上将该特征从集合中剔除。弹性网络则线性结合了岭回归和套索回归，能更有效地确定惩罚项。\n\n另一类主要的嵌入法是基于树的方法，包括随机森林和梯度提升。算法在训练过程中构建决策树的方式会揭示特征重要性。这些技术会输出特征重要性评分，你可以据此选择排名前\
  \ *n* 的特征。\n\n\n\n### 特征投影与降维\n\n到目前为止，我们讨论的技术都在选择前保持了特征的原始形态。特征可能会被移除，但它们本身是完整的。另一类技术则基于数学方法对特征进行组合，将我们从高维特征空间带入低维空间。使用这些技术时，目标是减少特征数量，但无需以任何方式保留原始特征。当您希望模型具有高精度，且不需要以任何形式解释预测结果时，这些方法就非常有用。正如我提到过的，在利益相关者需要理解预测如何得出时，透明度和模型可解释性在商业中可能非常重要。但如果您的处境并非如此，那么有许多好技术可以让您的特征空间变得更小。请注意，当我们谈论高维空间时，指的是特征数量非常多，因为每个特征都代表了数据的一个维度。\n\
  \n#### 主成分分析\n\n`主成分分析`（PCA）是经典的降维技术，最早于二十世纪初提出，它通过线性映射并在低维空间中最大化方差。这涉及到一些线性代数和统计学知识，特别是协方差矩阵和特征向量，但幸运的是可以通过代码实现。其工作原理是：首先对特征进行标准化，使它们处于同一尺度。然后使用这些新值计算协方差矩阵并进行线性代数变换。这会生成多个单位向量（即“主成分”），随后可以测量每个成分解释特征空间中所有方差的比例。通常，我们执行此操作并选择排名靠前的成分（选择多少个通常取决于您的具体问题）。这些方法功能强大，但原始特征会被完全掩盖。请注意，该方法假设数据具有线性关系，可能不适用于非线性数据。\n\
  \n#### 线性判别分析\n\n`线性判别分析`（LDA）是另一种常用方法，它推广了统计方法中的费舍尔线性判别，用于找到能够区分两个或多个类别的线性特征组合。它实际上类似于方差分析和线性回归，适用于连续数据。与\
  \ PCA 一样，它通过数学方式组合多个原始特征来创建新维度。但与 PCA 不同的是，LDA 使用类别标签，并旨在最大化不同类别之间的分离度。然而，与 PCA\
  \ 类似，它最终也会得到一个低维空间，且原始特征会被掩盖。\n\n#### 其他技术\n\nPCA 和 LDA 都适用于线性数据。它们各自都有变体，使用特定方法来处理非线性数据。自编码器和\
  \ T 分布随机邻域嵌入（t-SNE）是几种用于处理非线性数据的技术。还有一种称为“最大信息维度”的技术，它在保留原始数据中尽可能多的“信息”（该概念在信息论中有特定含义）的同时，仍然能够减少特征空间。\n\
  \n\n\n## 关键要点与下一步\n\n我们介绍了四种主要方法，用于在将数据输入机器学习模型之前（有时是在进行数据分析之前）提升数据质量。我们既考虑了单个特征，也考虑了整体特征集或特征空间。首先讨论了转换或组合单个特征以获得更高质量特征的技术。然后介绍了如何从整体上改进特征集（而非单个特征），具体方法有两种：一是通过选择最佳特征来构建更强的特征集，二是利用数学方法表示特征空间并对其进行转换，从而生成全新的特征——这些新特征代表了原有的特征，但与原特征并非一一对应关系。\n\
  \n接下来是深入探讨机器学习的章节。我们一直在为此做准备，将介绍最常见的两种机器学习类型——监督学习和无监督学习——然后简要介绍其他类型，包括半监督学习、强化学习和集成学习。我们还会讨论不同类型中最流行的算法，以及它们通常适用于哪些类型的问题的一些考量。\n\
