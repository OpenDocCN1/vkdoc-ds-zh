- '# 11. 行业工具：Python 与 R


  ## 引言


  学习一门编程语言是大多数数据科学职位的必备步骤。数据科学家通常不进行所有类型的软件开发——大多数不会从事前端工作（如网页开发）。相反，数据科学家通常最常处理的是单文件脚本或笔记本。如果你必须自己将模型部署到生产环境，你可能还需要偶尔设计多文件软件来执行建模，并可能使用其他工具将你的代码投入生产。`Python`和`R`是数据科学家最常用的两种语言，本章将介绍像它们这样的常见语言的基本编程知识，并探讨一下这两种语言的区别。




  '
- '# 数据科学编程史


  编程语言和其他计算工具在数据科学领域已有悠久历史，但当今主流语言——`Python`和`R`——的主导地位是近期才形成的。我们在第四章讨论了统计工具的发展，以及`R`如何作为专有语言`S`的开源替代品脱颖而出。在此之前，统计工作主要使用专有统计语言`SAS`和传统语言`FORTRAN`（后者以高数值精度支持科学和工程编程，可实现精确的数学与统计计算）。`SAS`在金融和保险业应用较多，而`FORTRAN`则更为广泛。但`FORTRAN`对非技术背景的统计学家来说略显复杂，这促使`S`被专门为其开发。该语言虽一度流行，但因专有属性限制了使用群体。`R`最初于
  20 世纪 90 年代开发用于统计学教学，运行在`S`之上。许多用`R`编写的程序无需修改即可在`S`中运行。它至今仍是学习统计学和编程的绝佳语言，但很快便从教学领域如火如荼地蔓延至整个统计界，至今仍被统计学家和数据科学家广泛使用。


  `Python`进入数据科学领域稍晚，但在数据科学家中的普及度已开始超越`R`。`Python`最初作为通用语言问世，在文本处理和高效语法方面表现突出（能以更少代码行实现更多功能）。它吸引了一批近乎狂热的追随者，社区成员自称“Pythonista”，官方最佳实践指南命名为“Python
  之禅”，并将最初开发者称为“终身的仁慈独裁者”（BDFL）——因其在 2018 年前一直承担主要维护职责。直到 2009 年`Pandas`包（核心语言扩展包）和
  2010 年`scikit-learn`（主流机器学习包）发布后，`Python`才真正用于数据科学。`Pandas`通过引入数据框（`R`的主要数据结构）使`Python`的编程风格更接近`R`。彼时数据科学刚刚兴起，已在使用`Python`的程序员在涉足数据科学时自然转向`Pandas`和`scikit-learn`，由此推动了它的普及。


  尽管`SAS`仍在某些企业中存续，但当前主流已是`R`或`Python`（具体选择取决于个人偏好）。除非工作需要`SAS`，否则初期只需学习`R`或`Python`即可。这两种语言对数据科学的学习和开发都完全适用，只是各有所长——具体选择取决于应用场景。多数数据科学家对偏好哪种语言持有强烈观点，团队也常以其中一种为主。但完全没必要二选一——许多团队同时使用两者。我们将在后续章节详细讨论它们的异同。`R`在统计、可视化和学术领域尤为出色，而`Python`则在机器学习、通用编程（包括构建生产系统）方面表现卓越。


  '
- "# `Python`与`R`在现实数据科学中的应用实例\n\n第一个案例很好地说明：你无需在`R`和`Python`之间做选择，而是可以根据各自优势搭配使用。随后我们将探讨`Python`在金融科技领域的应用。\n\
  \n## 示例 1：兼用两者进行对冲\n\n对冲基金公司 Amadeus Investment Partners 通过采用包含`Python`、`R`、`SQL`及其他工具的技术栈（团队完成工作的技术工具组合）取得了成功。其跨学科团队设有多个角色，每个角色使用特定工具。技术专家使用`R`、`Excel`等工具探索数据；数据工程师则使用`R`、`SQL`和`C++`（注重性能的传统编程语言）；数据科学家用`R`进行探索性数据分析（EDA），用`Python`专门处理机器学习和深度学习；用户界面开发人员也同时使用`R`、`Python`及其他工具。\n\
  \n在大多数数据分析任务（包括数据探索和可视化）中，Amadeus 偏好使用`R`，该语言拥有出色的相关包。但`Python`在机器学习等计算密集型任务中表现更优——尤其当处理公司使用的大规模数据集时。值得注意的是，他们明确规定了各岗位应使用的工具。许多企业允许数据科学家自由选择工具（这种做法虽受欢迎），但会导致代码库分散、难以维护和复用。而通过要求数据科学家用`R`进行\
  \ EDA，后续工作便能更轻松地基于前期成果展开。\n\n该公司的另一独特之处在于：他们不走寻常路，直接招聘商学院顶尖毕业生并培训成数据科学家，而非招录有技术背景的人员。他们发现这些毕业生能较快掌握`Python`和`R`，同时兼具学位赋予的通用软技能和商业知识。这正说明了这两种语言相对易于学习。\n\
  \n## 示例 2：快速灵活的金融科技\n\n金融科技咨询与定制软件开发公司 djangostars 在所有工作中都偏好使用`Python`。他们认为`Python`是金融科技领域的最佳语言（尤其对新兴公司），原因众多：其一，数学家和经济学家已习惯使用该语言，因此从他们那里获得的系统需求在“正式编码”前就已完成了大半准备。虽然金融科技涉及大量数据科学工作，但其内涵远不止于此——`Python`作为多用途语言的优势得以凸显。他们指出，`Python`结合`Django`（成熟的`Python`网络框架）是快速将产品推向市场的绝佳组合。此外，这套工具组合灵活性极强且易于修改——这对金融科技而言至关重要（与传统银行业不同）。他们还发现，由于`Python`相对易学，开发人员和数据科学家能更顺畅地向客户解释技术、促进协作和知识转移。`Python`已非常成熟，几乎任何可想象的功能都有对应的免费包提供支持。\n\
  \n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n## 计算机编程基础\n\n编程语言实际上和人类语言很相似，只是简单得多得多。我有一位教授，他在\
  \ 20 世纪 80 年代获得了计算机科学学位，并说服他的大学将 Pascal（另一种传统编程语言）算作他的外语必修课。这在今天不会发生，但就像人类语言一样，编程语言有语法（特定的单词、运算符以及它们的书写顺序）和语义（遵循语法规则所写的特定文本的含义）。它们还有随着时间的推移而形成的惯用语，即程序员之间约定俗成的完成特定任务的方式，即使这并不是唯一可以编写的方式。少数语言还有相当严格的格式规则来规定风格——Python\
  \ 就是其中之一，Python 爱好者们坚信这是编写美观代码的唯一方式。\n\n计算机代码基本上就是用特定编程语言的语法编写的“菜谱”。几乎所有编程语言都使用英语单词，并且有几个单词和运算符在大多数语言中通用。一些最常见的运算符包括表\
  \ 11-1 中列出的那些。这些大多是我们从基础数学中熟悉的元素。它们在代码中的使用方式也大致相同。下面我也会对这些运算符进行更多阐述。\n\n**表 11-1**\
  \ 多种语言（包括 R 和 Python）中的常见运算符\n\n| 赋值与控制 | 比较运算符 | 数学运算符 |\n| --- | --- | --- |\n\
  | `=``:` | `>``<``>=``<=``==``!=` | `+``-``/``*``^``%` |\n\n一些常见的关键字如图 11-1 所示。*关键字*是指在语言中始终具有特定含义的单词，除了按定义好的方式使用外，不能（或不应该）在代码中的任何其他地方使用。图\
  \ 11-1 中的所有关键字都用于控制程序流程，我们将在下面讨论。\n\n![该图片展示了编程关键字的垂直列表：“for”、“while”、“if”、“else”、“break”、“function”、“def”、“return”和“raise”。这些术语通常用于编程语言中，以控制流程和定义函数。](img/628533_1_En_11_Fig1_HTML.png)\n\
  \n**图 11-1** 多种语言（包括 R 和/或 Python）中的常见关键字\n\n一旦你掌握了语法的基础知识，你就走上了学习如何用代码完成几乎所有事情的道路。编程非常系统性，但一旦你深入其中，你就会发现在寻找解决问题的好方法时，创造力有多么重要。\n\
  \n有几种不同的高水平编程方法，称为范式。我们在此重点关注的是过程式和函数式，但你还会听到另一种常见的范式叫*面向对象编程*，它侧重于某种模块化设计，并且可以在\
  \ Python 和 R 中实现（在 Python 中很容易，但在 R 中稍复杂一些），尽管许多数据科学家可能永远不会使用它。*过程式编程*涉及一个一个按顺序执行的步骤序列。*函数式编程*涉及函数的使用（我们将在下面进一步定义），但基本上包含更小的代码单元，这些代码单元可以被定义，并使用不同或不使用值来重复调用，以实现有效的复用。\n\
  \n请注意，本章讲的是代码，但你不必期望在本章中就学会编写代码。各节中有一些 Python 和 R 代码的示例，但它们仅仅是为了说明概念并展示这两种语言之间的差异。然而，如果你是一个动手型学习者，那么进入\
  \ Python 或 R 解释器并尝试一下也无妨。这是一个很好的学习方式。附录 A 详细说明了如何安装它们并开始使用。\n\n## 传统编程\n\n一个计算机程序就是一系列代码行，利用语法和其他文本来告诉编译和/或运行代码的东西该做什么。有些语言使用编译器进行编译，这意味着它们被处理并转换成可运行的文件，或者由解释器实时运行。R\
  \ 和 Python 都使用解释器。\n\n代码的格式化通过使用换行、空白（包括缩进/制表符）以及控制结构（如花括号 `{` 和 `}`）来实现，使其既能被人阅读，也能被编译器或解释器读取。除此之外，编写代码还有许多要素，我们将在下面的小节中介绍。\n\
  \n我在图 11-2 中包含了一些示例 Python 代码，以防你从未见过代码。这段代码没有做任何特别有趣的事情，但它展示了我们将在下面讨论的一些基础知识。当我们下面讨论到它时，我也会指出这段代码中的相关部分。左侧是行号。请注意，代码是带有颜色编码的——这在大多数代码编辑器中是标准做法。\n\
  \n![Python 代码片段截图，演示了变量声明、数学运算、条件语句、循环和函数。变量 `num1`、`num2` 和 `num3` 被赋值为整数和浮点数。数学运算包括加法、减法、乘法、除法、乘方和取模。一个\
  \ `if-else` 语句比较 `num1` 和 `num2`，根据比较结果将字符串赋给 `new_var`。一个 `for` 循环计算累加和，一个 `while`\
  \ 循环在计数器达到 10 之前打印一条消息。一个名为 `lopsided_square` 的函数计算并返回变量的修正平方值。](img/628533_1_En_11_Fig2_HTML.jpg)\n\
  \n**图 11-2** 一些示例 Python 代码\n\n### 注释\n\n所有编程语言都允许你在代码中包含注释。编写注释的具体语法因语言而异，但 Python\
  \ 和 R 都使用井号 `#`。每当你在某行代码上看到这个字符时，`#` 之后的所有内容都是注释，不会被解释器运行；而 `#` 之前的所有内容都是将要被运行的常规代码。\n\
  \n关于如何以及应该在代码中添加多少注释，有很多不同的看法，但大多数人都认为应该有一些注释。有些人几乎叙述正在发生的每一件事，而另一些人则只包含 TODO 或标记他们认为非常令人困惑的内容。在实践中，你会发现当你稍后回过头来看代码时，你会忘记代码中那些棘手部分的作用，所以强烈建议添加注释。\n\
  \n### 变量\n\n变量是在代码中存储数据和值的方式。你可以将一个值赋给一个*变量*，变量就是一个用于保存该值的名称。变量用于存储数字、文本或其他更复杂的数据类型等值。在包括\
  \ R 和 Python 在内的一些语言中，几乎任何东西都可以存储在变量中，甚至函数也可以。变量是一种占位符，代表其他东西。当你将要重复做某件事，又不想每次都重新输入一个值时，通常会使用变量，尤其是当这个值以后可能改变的时候。\n\
  \n#### Python\n\n和几乎所有语言一样，Python 使用等号来赋值变量。例如，代码 `my_number = 7` 将值 7 存储在变量 `my_number`\
  \ 中，因此每当你在代码中看到 `my_number` 时，都可以在心里用值 7 来代替。如果你看到 `my_number + 5`，结果将是 12。\n\n\
  在 Python 中命名变量时有几条规则。变量名中只能使用字母（大写或小写）、数字和下划线（`_`），并且名称不能以数字开头。你可以用字母或下划线开头来命名变量，但在\
  \ Python 中，以下划线开头的变量用于指示特定场景，因此对于常规变量，你应该以字母开头。\n\n图 11-2 中示例 Python 代码的第 2-8 行是变量赋值，行尾的注释表明了\
  \ Python 当前会分配给该变量的数据类型。\n\n\n\n## R\n\nR 允许在变量名中使用与 Python 略有不同的字符。它允许所有与 Python\
  \ 相同的字符，但也允许使用句点（句点在 Python 中是运算符，因此不能使用）。实际上，在 R 变量名中使用句点相当常见。名称必须以字母开头。\n\nR 在赋值运算符的使用上与其他语言不同，它使用`<-`而不是等号。等号也可以工作，但大多数\
  \ R 程序员更喜欢`<-`。它的写法如下：`my.number <- 7`。这就像 Python 一样，每当在代码中看到该名称，它就代表 7。\n\n###\
  \ 数据类型\n\n*数据类型*就是给定语言中允许的数据类型，即你可以存储并且语言知道如何处理的内容。最常见的基础类型（通常称为*原始数据类型*）包括：*整数*（整数）、*小数*（小数）、*布尔值*（false/true\
  \ 或 0/1）、*复数*（包含复数的值，即–1 的平方根）和*字符串*（包含在标记内，通常是引号内的文本）。不同的语言会对每种类型有不同的尺寸版本。\n\n\
  还有更高级的类型可以原生支持、自定义定义或通过语言的其他包（插件）使用。这些包括*数组*或*列表*（值的序列）、*映射*（一种键指向值的键值对序列）以及*集合*（像没有重复值的数组或列表）。\n\
  \n还有更多存储数据的方法，这些方法更加高级，几乎从不内置于语言中（因此你必须使用外部包）。这些通常被称为*数据结构*，这是一个更抽象的术语，表示基于数据存储方式的部分行为和关系。这些包括*栈*（后进先出，就像餐厅里的一摞盘子）、*队列*（先进先出，就像小吃摊前排的队）和*树*（就像家谱）。有一些处理这些更复杂数据结构的方法，使它们在某些情况下非常方便，尽管这些在数据科学编程中很少出现。\n\
  \n最后，不同语言在处理数据类型和变量方面存在一些重大差异。在静态类型语言（如 Java 和 C++）中，变量的类型必须在创建时定义，并且永远只能保存该类型的数据。Python\
  \ 和 R 都是动态类型语言，这意味着你不需要在创建变量时声明类型，而且一个变量可以在不同时间保存不同类型的数据（它可能先保存字符串，然后保存数字）。动态类型导致更简洁的代码，但意味着你必须小心更改变量。\n\
  \n在强类型语言（大多数流行语言都是）中，不同数据类型之间的混合方式有限制。Python 和 R 都是强类型语言，因为当代码运行时，解释器会跟踪所有数据类型并禁止某些操作。例如，一种流行的弱类型语言允许你“添加”一个字符串值（或变量）和一个数字值（或变量）。在\
  \ JavaScript 中，`\"X\" + 9`会得到`\"X9\"`（一个字符串），但 Python 和 R 都会抛出错误。\n\n注意，Python 和\
  \ R 都根据赋值给变量的值来记录其数据类型。因此，如果你将一个变量赋值为 7，Python 和 R 会将其视为`int`，直到它被重新赋值给其他内容。\n\n\
  #### Python\n\nPython 拥有所有基础数据类型，外加两种类似的列表类型（分别称为`list`和`tuple`），以及映射类型（称为`dict`，字典的缩写）。列表和元组从\
  \ 0 开始索引，因此第一个元素在位置 0，第二个在位置 1，依此类推。在当前流行版本中，Python 只有一个整数数据类型`int`（早期版本有一个更大的整数类型`long`）。它也只有一种小数数据类型`float`（以前有一个更大的小数类型`double`）。当前的`int`和`float`与之前的`long`和`double`一样大，这就是为什么现代代码中不再需要它们。布尔类型称为`bool`，复数类型称为`complex`。字符串存储在`str`数据类型中。你可以通过调用`type()`函数并将变量名放在括号内来查找数据类型。\n\
  \n## R\n\nR 也拥有所有基础数据类型。它有两种类似的列表类型：`vector`和`list`。与 Python 不同，两者都从 1 开始索引。整数数据类型称为`integer`，小数类型称为`numeric`。复数类型简称为`complex`。字符串使用`character`数据类型构建。最后，布尔类型称为`logical`。你可以通过调用`class()`函数并将变量名放在括号内来检查任何值的数据类型。\n\
  \n\n\n### 运算\n\n运算就是编程语言中对所执行动作的指令。例如，若想在代码中进行数学运算，可以使用如表 11-2 所示的运算符。这些运算符在 Python\
  \ 和 R 中的工作原理完全相同，虽然取模运算符在两者间略有差异。图 11-2 中示例 Python 代码的第 11 至第 16 行展示了这六种数学运算符的用法。\n\
