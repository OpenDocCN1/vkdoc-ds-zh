  这种图表仅提供极少的信息，而我们的数据集中包含更多内容，例如每款游戏的开发公司。也许任天堂想知道相比于 EA，自己的表现如何，而所有其他公司则归为第三组。我们可以轻松地对此进行观察。*分组条形图*将多个相关的柱子并排显示。图
  2-11 是一个分组条形图，展示了与图 2-10 相同的数据，但按公司进行了细分。


  ![](img/628533_1_En_2_Fig11_HTML.jpg)


