  了解某事物呈正态分布有助于你理解它。如果是正态分布，我们就知道其均值、中位数和众数都是同一个值，并且数据是对称的——分布在均值两侧互为镜像。此外，我们还知道大约有
  68% 的数据会落在距离均值 1 个标准差的范围内，95% 的数据会落在 2 个标准差内，99% 的数据会落在 3 个标准差内。例如，如果一个数字距离均值超过
