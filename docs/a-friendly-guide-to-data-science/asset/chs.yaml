  ### 示例 2：一个被忽视的绝望警告


  我当时正在上五年级的阅读课，老师离开教室去观看美国航天飞机*挑战者*号发射的一部分。她回来时，脸色惨白，那是我第一次看到一个成年人如此震惊。她告诉我们航天飞机爆炸了，所有宇航员都遇难了，其中包括那位备受宣传的“太空第一教师”。20
  世纪 80 年代，航天计划承载着巨大的欢乐和民族自豪感，这一事件摧毁了国家的信心。


  这场灾难可以避免吗？像许多技术或工业灾难一样，那天的灾难是 100%可以避免的。但这件事之所以突出，是因为虽然大多数灾难是由于疏忽造成的——例如，有人在安全规程上懈怠——但当时有几位工程师知道天气太冷不适合安全发射，他们恳求管理层取消发射。然而管理层置若罔闻，执意进行。发射已经被推迟过一次，有一种感觉是举国上下都在指望美国国家航空航天局（NASA）。


  很多人写过这场灾难，包括常常语带讥讽的诺贝尔物理学奖得主理查德·费曼。归根结底，问题出在两个橡胶 O 型圈上，它们的职责是将每个火箭助推器内炽热的高压气体保持在应有的位置。人们已知
  O 型圈失效可能是灾难性的，但系统实际上有两个，因此被认为有内置的故障安全措施。但尽管有两个，它们是相同的。工程师们知道，如果其中一个因环境因素失效，另一个也可能失效。


  发射那天早晨预计会很冷。在此前几天，有四位工程师对 O 型圈的失效深感忧虑。他们观察到 O 型圈在低温下会失去弹性，甚至在华氏 60 多度（约 15 摄氏度）时也是如此。这可能会让高温气体接触到
  O 型圈并进一步加剧其劣化。发射当天早晨，气温实际上低于冰点，这与他们有数据的任何测试和实际发射的条件都极端不同。工程师们拼命试图说服决策者，但他们未能成功地传达出自己为何如此担忧。


  一份关于这场灾难的政府报告指出了问题所在之处。工程师们向管理层展示了一张显示温度与 O 型圈失效次数的特定图表，但这张图表根本没有传达出最关键的信息。工程师们理解其中的含义，却无法让管理层理解。这基本上是技术人员与非技术人员之间的沟通失败。


  工程师习惯于查看数据并明白，缺乏某事物的证据并不意味着它绝对不存在。图 2-2 就是发射前分享的那张图表。


  ![散点图显示了事件次数与计算的接头温度（华氏度）之间的关系。数据点标有飞行标识符，如 STS 51-C, 41B, 41C, 41D, 61A, 61C 和
  STS-2。x 轴表示温度范围从 50°F 到 80°F，y 轴表示事件次数从 0 到 3。该图展示了 O 型圈热应力事件与温度之间的关系。](img/628533_1_En_2_Fig2_HTML.jpg)


  **图 2-2** 20 世纪 80 年代发生 O 型圈热事件的美国航天飞机飞行任务。来源：“关于挑战者号航天飞机事故的总统委员会报告”，[`https://www.nasa.gov/history/rogersrep/v1p146.htm`](https://www.nasa.gov/history/rogersrep/v1p146.htm)




  每个黑点代表一次实际飞行中经历过热应力的 O 型环的飞行，显示了事故发生的温度（X 轴）以及与之相关的事故数量（Y 轴）。敏锐的观察者会注意到，图表中任何事故的最低温度约为
  53°F。没有任何接近冰点的事故。在那之前，没有低于该温度的发射。这让工程师们感到紧张，但并未引起管理层的担忧。然而，有一点即使是管理层也应该明白——大多数事故发生在较低温度下，这很可能并非巧合。


  但他们并未意识到在未知条件下飞行的严重风险。后来，在关于这场灾难的政府报告中，作者提出了一张图表，这张图表能让任何人（无论是否具备技术背景）都更清楚地理解问题。图
  2-3 展示了相同的图表，并附加了一些信息——所有无事故发射的数据点。


  ![](img/628533_1_En_2_Fig3_HTML.jpg)


  散点图显示了事故数量与以华氏度计算的预计接头温度之间的关系。X 轴表示温度范围（从 50°F 到 80°F），Y 轴表示事故数量（从 0 到 3）。数据点标有飞行编号，例如
  `STS 51-C`、`41B`、`41C`、`61C`、`41D`、`STS-2` 和 `61A`。一个标有“无事故飞行”的框突出显示了较高温度下事故数量为零的数据点。该图说明了温度与
  O 型环热应力事故之间的关系。


  图 2-3


  20 世纪 80 年代美国航天飞机有无 O 型环事件的飞行。来源：“关于挑战者号航天飞机事故的总统委员会报告”，[`https://www.nasa.gov/history/rogersrep/v1p146.htm`](https://www.nasa.gov/history/rogersrep/v1p146.htm)


  这张图表清楚地表明，所有无事故的发射都发生在 66°F 或更高温度下。你无需成为火箭科学家就能得出结论：较低的温度固有地更具风险。尽管通常会将图表的轴限制在数据范围之外，但也许如果他们当时将
  X 轴起始于 30°F，并强调 66°F 与 31°F 之间有多么巨大的差距，他们的警告就会得到重视。然而相反，七名宇航员丧生，无数观看现场直播的民众受到精神创伤，美国太空计划由此陷入低谷。


  ## 描述性统计


  *描述性统计*是理解数据集一般特征并识别其中任何特殊或异常情况的艺术与科学。描述性统计是数据分析与数据科学的核心部分，几乎在开展任何项目时，我们都会首先进行描述性统计（在数据分析与科学中称为
  EDA，即探索性数据分析）。一个简单的事实是：如果你不理解数据，就无法对数据进行有意义的工作。描述性统计能帮助你做到这一点。


  描述性统计主要涉及计算一些基本指标并创建一些图表和其他可视化，这能让你对数据有一个良好的概览。它的优点在于，一旦你学会了如何执行，它就相当直观。在本节中，我们将查看一些不同的数据集，以了解可以进行的指标计算和可视化。我们将使用一个视频游戏评分数据集来查看不同的指标，并使用其他一些数据集进行可视化。


  同样重要的是要意识到，描述性统计中几乎所有的指标和可视化都需要数值型数据——要么是间隔数据，要么是比率数据。虽然也可以对分类数据进行一些描述性统计，但这很少见且信息量较少。


  ### 初始观察与直方图


  通过查看一些图表来初步了解数据是很常见的做法。这可以帮助你理解数据的某些方面，这些方面可能会影响你后续的决策。我们经常谈论数据的分布，这通常指的是单个字段的几个特征。例如，如果我们有一些关于视频游戏的数据，并且好奇所有游戏的评分情况，我们可以制作一个图表来查看评分的分布。第一直觉可能是像图
  2-4 那样，在一个条形图中绘制所有数值，该图显示了每个单独评分对应的柱形，Y 轴为评分值。


  ![](img/628533_1_En_2_Fig4_HTML.jpg)


  标题为“评分”的条形图，显示了 1500 条记录的数据。X 轴标记为“记录编号”，Y 轴标记为“评分”，范围从 0 到 5。图表显示评分分布密集，大部分值介于
  2 和 5 之间，表明各记录的评分存在差异。


  图 2-4


  任意排序的视频游戏评分


  X 轴仅仅是记录编号，因此顺序与实际评分无关。我们稍后会详细讨论条形图，但此图清楚表明的主要问题是，除了评分似乎分布广泛但偏向较高值之外，根本无法了解数据的任何情况。我们澄清问题的第一直觉可能是添加一些顺序。对数据进行排序可以帮助你更好地理解它，如图
  2-5 所示。


  ![](img/628533_1_En_2_Fig5_HTML.jpg)


  标题为“评分”的条形图显示了一系列垂直的蓝色条形，代表评分（范围从 0 到 5）。条形的高度从左到右增加，表明评分呈上升趋势。Y 轴标记为“评分”，X 轴未标记。该图直观地展示了评分的分布和变化。


  图 2-5


  按数值顺序排列的视频游戏评分


  图 2-5 让你可以很快地看到，只有少数评分低于 3，大多数评分在 3 到 4 之间。这很有用，但并非超级有用，因为面对所有这些单独的值，仍然很难真正说出整个数据集的情况。


  幸运的是，有一个简单的解决方案：直方图。我们将在本章后面的章节中介绍如何创建直方图，但作为快速介绍，*直方图*通过显示分箱数据的频数计数来总结数据的形状或分布，在这种情况下，这基本上意味着我们将查看每个平均评分有多少个（评分可以是
  0 到 5 之间的任何值，包括小数）。它揭示了很多有助于我们理解下面将要讨论的统计计算的信息，但图 2-6 展示了评分数据的一个简单直方图。


  ![](img/628533_1_En_2_Fig6_HTML.jpg)


  标题为“评分分布”的条形图，Y 轴显示频数，X 轴显示评分区间（范围从 1 到 5）。图表显示了一个右偏分布，最高频数出现在评分 4 附近，峰值超过 350 个计数。


  图 2-6


  视频游戏评分直方图


  这次，X 轴显示了每个区间内的评分范围（区间通常由我们使用的软件自动确定），Y 轴显示了每个对应区间内的总数量。这清楚地表明大多数评分在 3.5 到 4.5 之间，这一点在图
  2-5 中较难看出。




