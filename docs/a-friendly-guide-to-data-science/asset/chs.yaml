- '# 关键要点与后续章节


  “数据”这个词经常被随口提及，但当我们希望将其视为信息和智慧的来源时，就需要理解它的真正含义以及看待它的各种方式。围绕数据有许多术语，理解其不同的定义至关重要。数据代表着现实世界，可以以多种形式存在，但大多数时候它可以被视为结构化数据，并能很容易地用表格表示，其中列代表对象的某个方面，而行则存储着该对象的每条记录。有四种主要的数据类型，其严谨性和约束性依次递增，包括：定类数据（用于没有数字或排序特征的事物）、定序数据（用于可以排序，但无法进行真正数学运算的事物）、定距数据（数值数据，但尚未达到下一种类型的严谨程度）以及定比数据（遵循特定数学规则的数值数据）。你可以对定比数据进行最多操作，而定类数据在数据科学中往往最难处理。非结构化数据（如文本）是另一种重要类型，它很难用表格形式来表示。数据可以是原始数据（以类似最初收集时的基本形式存在）或衍生数据（经过转换、组合、求和或某种方式的聚合）。数据通常被组织成数据集（通常是一个或多个表示同类事物的表格），我们经常与元数据（关于数据的数据）打交道。数据的收集和存储非常重要，将在第
  12 章详细讨论。组织会以各种方式使用数据，但其总体目的是帮助他们更好地了解业务并做出更好的、基于数据的决策。最后，围绕数据治理和数据质量有一套完整的学科体系，这对于保持数据的良好状态至关重要。


  理解数据的基本性质及其与现实世界的关系至关重要，因为它支撑着数据科学中所有其他内容。下一章是阐述统计学（数据科学的另一个关键部分）的三章中的第一章。本章将介绍统计学的基础知识，并涵盖描述性统计的指标和可视化方法。


