- '# 5. 弄清问题：数据分析


  ## 引言


  在之前的章节中，我们讨论了数据分析和数据科学中最基本的东西——数据本身，以及统计学，它是数据科学中其他一切的基础。没有数据，你显然无法在数据科学中做任何事情。但你也不能只拿一些原始数据就开始从中挖掘出迷人的见解或预测。在数据能够产生有价值的信息之前，需要执行许多步骤。事实上，数据可以通过多种方式进行探索，而数据分析领域致力于理解和处理数据。数据分析主要涉及以明智的方式对数据进行切分和剖析，利用分析工具从中提取意义。这些工具包括编程语言、电子表格以及我们在前三章中介绍的统计学技术，尤其是图表和其他可视化工具。数据分析师通常只使用描述性统计，但有些人会深入研究更高级的统计学。数据分析师已经存在很长时间了，他们观察过去发生了什么，解释其含义，有时利用这些信息帮助我们理解世界并预测未来。


  这听起来很像数据科学能做的事情，这并非巧合。很难说清楚数据分析在哪里结束，数据科学又从哪里开始。我认为两者处于一个连续体上，有大量的重叠。几乎总是如此，一个数据科学项目会涉及数据分析，尤其是在项目初期。大多数数据分析师的工作不会深入到更高级的数据科学领域，但许多数据科学家一直都在做数据分析。事实上，要成为一名优秀的数据科学家，你首先需要成为一名优秀的数据分析师。


  “数据分析”是一个含义丰富的术语，在商业世界中对不同的人意味着许多不同的东西，但最简单的定义是：它是调查和分析数据以便更好地理解数据所代表内容的过程。我们将在第[7]章中详细讨论这一点，但“分析”这个更通用的标签分为四种类型：描述性分析、诊断性分析、预测性分析和规范性分析。正如你所猜测的，描述性分析基本上只描述数据中包含的内容，而诊断性分析则试图通过深入数据来解释事物。这两者是数据分析的基本领域，而数据科学则更侧重于后两种。


  因此，数据分析工作可能涉及极其广泛的技术，如果你查看标题为“数据分析师”的职位列表，你会看到令人惊讶的技能范围要求。在许多情况下，他们实际上是在寻找数据科学家，要求具备高级编程技能、机器学习知识等等。也许他们试图通过使用另一个标签来避免支付数据科学家的薪水，或者（更可能的是）他们不知道自己想要或需要什么。在其他情况下，他们寻找的是具备基本数学技能、懂或能学会使用
  `Excel` 的高中毕业生。大多数情况下，这个头衔意味着介于两者之间的东西。本章将聚焦于这种“恰到好处”的数据分析师——通常被认为拥有大学学位以及若干其他技能，但不像典型的数据科学家那样技术性那么强。


  你可能会想，如果数据分析是一个独立的领域，为什么它会在数据科学的书中占据一章？正如我上面提到的，成为一名优秀的数据科学家需要能够进行良好的数据分析。那些职位头衔是数据分析师的人可能在可视化或其他方面比数据科学家更熟练，但在几乎任何数据科学项目早期进行的良好数据分析，对于项目的成功都至关重要。这是因为数据科学的一个基本事实：如果你不理解数据，就无法做好数据科学。数据分析有一套能够带来这种理解的方法。


  虽然本章是关于数据分析的，并且将从事这项工作的人称为数据分析师，但这只是他们当前角色的名称，同样适用于在执行其整体流程中数据分析部分的数据科学家。此外，数据分析可能涉及许多不同的方法和工具，包括那些属于统计学范畴的内容。本章将重点介绍数据分析的概念、过程和基本技术。它将以该领域的历史以及现实世界中两个数据分析的例子开始。然后，我将介绍成为一名优秀数据分析师所需的四个关键技能领域。最后，我将介绍进行数据分析工作通常遵循的过程，这个过程被称为
  `CRISP-DM`（跨行业数据挖掘标准流程）。


  ## 数据分析的历史


  数据分析已经存在很长时间了，基本上和数据本身一样久。数据的全部意义通常在于更好地理解它所代表的内容，而这正是数据分析帮助你所做的事情。当然，古代苏美尔人和埃及人所做的分析类型与我们现在所做的相比，简直难以置信地简单，但它仍然很重要。图[5-1]展示了一份大约公元前
  2500 年的古代苏美尔泥板上的商品账目。这块泥板记录了小麦、面粉、面包和啤酒的数量。统治者利用这些以及其它泥板上的数据来评估其公民的税收。


  ![](img/628533_1_En_5_Fig1_HTML.jpg)


  图 5-1


  大约公元前 2500 年的古代苏美尔泥板，记录了几种商品（小麦、面粉、面包和啤酒）的数量。来源：`Sumerian economic tablet IAM Š1005.jpg`，[`commons.wikimedia.org/wiki/File:Sumerian_economic_tablet_IAM_%C5%A01005.jpg`](https://commons.wikimedia.org/wiki/File:Sumerian_economic_tablet_IAM_%C5%A01005.jpg)


  虽然对数据进行基本操作已有很长的历史，但数据分析作为一个现代领域，其最初的萌芽实际上是在 17 世纪，直到 20 世纪才真正学会走路。数据分析中的许多重要工作在于以帮助人们更好地理解数据和情况的方式对数据进行可视化。19
  世纪出现了一些非常酷的可视化作品（尤其是地图和图表），我们将在本书后面看到，下面有一个简单的原始可视化示例（图[5-2]）。本书后面有一整章专门介绍可视化。


  我接下来将谈谈计算机以及它如何彻底改变了数据分析，但在我们理解如何进行分析之前，也值得看看数据分析能做什么。我将分享几个现实世界中数据分析工作的例子。其中一个非常近期，但另一个完成于
  150 多年前，至今仍令人印象深刻。




  ### 计算机的出现


  早期，数据分析总是在相当少量的数据上进行。数据量可能多到人们无法完全记在脑中，这也是可视化能派上用场的原因，但数据量仍然足够小，可以手动完成计算。数据量达到多少会变得过于繁重，是有明确界限的。我们在之前关于统计学的章节中看到过这一点，当时样本量为
  30 就足以使用要求更高的 Z 检验而非 t 检验。对现代数据科学家来说，30 个数据点听起来很可笑，但随着计算机的出现，情况发生了改变。


  计算机彻底改变了许多事物，数据处理也不例外。它在数据分析中带来的最大变化是能够处理大量数据。这不一定指的是“大数据”，我们在第 1 章提到过这个术语，稍后也会再次讨论。它仅仅意味着不再需要事事都手动计算，因此我们可以使用更多的数据。早期的数据分析通常涉及收集数据点，并通过简单的统计技术进行处理，也许首先通过将数字在纸上相加（后来借助简单的计算器）来求和。即使只处理几百个数据点，这种方式也会变得难以掌控，随着数据增长，这些计算很快就变得不可行了。


  #### 美国人口普查制表机


  到了 19 世纪最后几十年，美国人口普查变得非常复杂。人工清点人数既过于昂贵又容易出错。有人发明了一种机器，帮助加快了 1870 年美国人口普查的进程，但这在很大程度上仍然是一项人力工作。1880
  年的美国人口普查非常困难且耗时，直到 1887 年才完成。他们需要不同的方法。第一个出现的解决方案被称为制表机，该机器的各种变体一直使用到 1940 年，之后人口普查局终于转向了真正的计算机。


  对普通人来说，这种转变的主要标志是统计学和分析工具的出现，这些工具让人们能够对手动工作难以处理的更大数据集进行自己的分析。最早的工具之一是名为 `SAS` 的产品，一些统计学家（尤其是在保险行业）至今仍在使用它。这是一种具有自定义专有界面的编程语言。它最初开发于
  20 世纪 60 年代下半叶，并且仍在不断演进。另一个早期推出的产品是 `SPSS`，其主要目标用户是从事社会科学研究的人员，因此在学术界被广泛使用。到了 20
  世纪 70 年代，大量统计工作是用当时的主力通用编程语言 `FORTRAN` 完成的，这对于不太懂技术的统计学家来说很困难。`S` 编程语言应运而生，旨在作为直接使用
  `FORTRAN` 的一种替代方案。人们开始使用它，随后在 20 世纪 80 年代末推出了 `S` 的一个版本，称为 `S-PLUS`。总的来说，`S` 已被
  `R` 所取代，后者是一种基于 `S` 的现代开源免费统计语言，最初开发于 20 世纪 90 年代初。如今，`R` 被统计学家、数据科学家和一些数据分析师使用，尽管大多数数据科学家正在转向
  `Python`，这是一种通用编程语言，拥有大量统计库，因其易用性和性能通常被认为优于 `R`。


  #### 开源工具与专有工具


  除了 `R` 和 `Python`，上述产品都是专有的，因此它们非常昂贵，大多数个人无法使用。随着人们转向开源的 `R` 或 `Python`，专有工具正逐渐失宠。但还有几件事让专有产品得以留存：它们包括有保障的安全性和合规性，这在许多行业至关重要；另外，那些有代码用这些语言或工具编写的公司，将不得不把所有内容用他们选择的开源语言重写。这既昂贵又耗时，而且并非没有风险（有人可能会意外引入新的错误），因此这些工具被淘汰还需要一段时间（如果它们真会被淘汰的话）。组织有时坚持使用专有软件的另一个原因是，由于他们为此付费，他们有权获得客户支持，并且还能影响软件的未来开发。任何曾因为代码无法按预期工作而陷入困境的人，都能理解只需拿起电话求助某人，而不是上互联网上最好的免费技术问答网站
  `Stack Overflow` 寻求帮助的价值。然而，值得注意的是，通过一些私营公司（当然，需要付费），开源工具也可以获得客户支持。


  ## 现实世界中的数据分析实例


  数据分析的例子比比皆是，但我挑选了几个有趣且截然不同的例子在此探讨。第一个涉及将棒球带入数据时代，第二个则是公共卫生领域的一次早期胜利。


  ### 示例 1：点球成金（Moneyball）


  几十年来，美国棒球队的人员配置依靠的是那些“直觉敏锐”的球探，他们会前往北美的高中和大学，通过口口相传来寻找年轻球员。球探们有着悠久的传统，即凭直觉并考虑这些年轻人的潜力，同时参考一些传统统计数据，比如击球率、本垒打数或打点（RBIs）。他们会与球队的其他官员合作，为选秀制定优先名单，意图将这些球员招致麾下，并将其培养成出色的球员。球探在这个过程中至关重要。


  20 世纪 90 年代中期，奥克兰运动家队（Oakland A’s）的老板去世了。他一直以慈善心态为昂贵球员提供资金支持，但新老板更为务实，不想在球队身上花费太多。结果，最昂贵——也就是最优秀的——球员都跳槽到了待遇更好的地方。球队开始输球，没人喜欢这样。过了一段时间，球队组织内有人提出了一个不同的想法——如果他们不试图猜测球员的潜力，而是关注他们在当前球队中更详细的数据，会怎么样？一些非常热心的棒球球迷已经收集并分析了二十年的非传统统计数据，但运动家队是第一个认真对待这种方法的官方棒球组织。


  这种新方法在迈克尔·刘易斯（Michael Lewis）撰写相关书籍后被命名为“点球成金”（Moneyball），得到了包括经理比利·比恩（Billy Beane）在内的组织内多位决策者的采纳。他们开始深入挖掘更冷门的统计数据，如上垒率（on-base
  percentage）和长打率（slugging percentage），研究哪些数据能真正转化为比赛中的成果。这使他们能够识别出联盟中那些被低估和未被充分利用的优秀球员，以及更有潜力的选秀人选，并且只需极少的投入就能将他们招入队中。随后，比恩利用进一步的数据分析来指导其他决策，比如击球手出场顺序的最佳安排，最终以慈善时代微不足道的花费，再次打造出一支强大且常胜的球队。举个例子，这支预算有限的球队在
  2002 年连续赢了 20 场比赛，打破了美国联盟（American League）的纪录。


  棒球界的其他球队注意到了这一点，不久之后，其他预算充足的球队也开始打造自己的阵容。人们普遍认为“点球成金”彻底改变了这项运动，并且这仍然是一场军备竞赛，每支球队都在想方设法以新的方式利用数据来获得微小的优势。如今，不以这种方式研究球员数据被认为是一种风险。




  ### 示例 2：1854 年在伦敦阻止霍乱


  我们回到伦敦，来看一个数据分析解决实际问题的著名案例——约翰·斯诺在 1854 年席卷伦敦的霍乱疫情期间所做的工作。当时，人们并不了解疾病是如何传播的，因为细菌的概念尚未出现。相反，人们相信“瘴气”是疾病在人与人之间传播的主要原因。斯诺在很多方面都走在了时代前列，甚至通过推广在外科手术中使用氯仿作为第一种麻醉剂，革新了医学。但他对数据分析的重大贡献在于，他绘制了一张
  1854 年疫情期间的伦敦地图，并在每个家庭住址处添加了一个代表该处霍乱死亡人数的条形。从这张地图上可以清晰地看出病例集中的地点，基于此，他确定了宽街上的一个特定水泵为源头，因为大多数受害者都从这个水泵取水。你可以在图
  5-2 中看到斯诺所用地图的放大视图，聚焦于宽街水泵周围的区域。相当令人惊讶的是，他说服当局立即封锁了该水泵，此后疫情很快便平息了。


