  \ | --- |\n| 1 | 0.00 | 0.00 | 0.50 | 1 | 1 |\n| 2 | 0.50 | 0.06 | 0.00 | 0 | 1\
  \ |\n| 3 | 0.75 | 1.00 | 0.75 | 1 | 1 |\n| 4 | 0.75 | 0.68 | 0.00 | 1 | 1 |\n| 5\
  \ | 0.00 | 0.36 | 1.00 | 1 | 1 |\n| 6 | 1.00 | 0.00 | 0.25 | 0 | 1 |\n| 7 | 0.25\
  \ | 0.48 | 0.50 | 1 | 1 |\n| 8 | 0.50 | 0.03 | 0.25 | 1 | 1 |\n| 9 | 0.25 | 0.86\
  \ | 0.75 | 1 | 1 |\n| 10 | 0.00 | 0.60 | 0.00 | 1 | 0 |\n\n\n\n### 聚合编码\n\n我们还可以使用基于聚合的组统计量。例如，在信用卡欺诈检测中，不同类型的持卡人可能具有不同的“正常”且不易被视为欺诈的行为。我们可以利用组统计来获取强大的特征。假设我们有数千名持卡人个人交易的大表。如果将持卡人按典型月度消费区间分组，最低组为\
  \ 0 到 1,000 美元，较高组为 20,000–30,000 美元，那么一笔 900 美元的交易对低消费群体可能异常，但对高消费群体却微不足道。我们可以通过几个步骤，基于此思路创建新特征。首先计算每组内所有交易的平均值，然后取持卡人所在组的平均值与单笔交易值之间的差值，由此得到的新数值可作为新特征存储。\n\
  \n举例来说，假设我们要标记可能需要进一步欺诈调查的交易。我们只需一个简单的筛选机制来标记部分交易，但不必担心误报，因为这些交易会进入后续的自动调查流程。表 14-9\
  \ 展示了三位会员的部分交易。表 14-10 显示了每位会员至上月底的月均消费额，表 14-11 则列出了每位会员截至给定日期的过去 30 天累计消费额。\n\n\
