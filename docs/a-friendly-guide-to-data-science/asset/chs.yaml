  \n### 背景经历\n\n杰夫 12 岁时便迷上计算机，这份热爱从未消退。高中毕业后他成为程序员并乐在其中，但最终决定攻读学位。起初主修计算机工程，学习微积分后发现自己更热爱数学，于是转专业至应用数学。他痴迷于这种体验：面对棘手问题时，只需应用数学变换，难题便迎刃而解。他通过大学学习和经验丰富的上司接触了机器学习。当时所在公司提供了大量机遇，他开始探索机器学习的实际应用场景。\n\
  \n### 工作实践\n\n他在公司的首个重大项目是与一位研究员合作改进一款产品——该工具通过分析书籍为其分配阅读难度评分，从而帮助孩子匹配适合的读物。为理解儿童阅读学习过程，他意识到自己缺乏相关领域知识，于是开始自学，但进程缓慢。最终他与研究员共同开发出解决该问题的产品。工作中他收获良多，尤其认识到集成学习在机器学习中的宝贵价值——它能从全局视角审视问题。他继续在该公司开发创新产品，但许多工作未被理解，看到成果被闲置令他沮丧，于是决定离职。他与几位伙伴共同创办公司，开发了一款辅助作家撰写小说的工具。这次创业未能成功，令人失望。但这段经历改变了他的观念，使他更重视工作与生活的平衡。如今他找到了热爱却不侵占生活的新工作，过得很愉快。他仍对用\
  \ AI 帮助他人充满兴趣，但觉得自己更像一名 AI 爱好者。\n\n### 精彩语录\n\n**工作最爱部分：** 数据科学是桥梁型角色，极具成就感。杰夫乐于解决他人无法自行解决的问题。他还喜欢将新工具（如机器学习）引入从未涉足该领域的行业，从而提升行业工作效率。\n\
  \n**工作最烦部分：** 人类创造并存于电子表格中的数据——质量通常堪忧。他也不满数据科学工作中 80%的时间仍耗费在数据清洗上——他疑惑为何现状难以改变，但事实如此。此外，当工作受限于特定范式或框架时，也会令人感到挫败。\n\
  \n**最得意项目：** 他开发了一套新的口语朗读评估系统，该项目有趣之处在于需融合多个领域知识：心理测量学教育评估（效度与信度）、读写能力发展（学习阅读）、计算语言学和机器学习。他成功找到了阅读能力与口语朗读之间的有效评估关联——能够基于默读能力高精度预测朗读者的每分钟正确字数。他对这项成果深感自豪，但遗憾的是公司不理解其价值也未能实现商业化。\n\
  \n**常用核心技能：** 深思数据——通过思考解决问题。沟通能力至关重要。可视化技能，包括概念构思和创建具体图表等。一张图能传递大量信息，尤其适合互动交流。他还学会了为重复性工作创建可复用的流水线，避免手动重复劳动。\n\
  \n**当前主要工具：** `Python`、`Jupyter Notebooks`、`LLMs`、`Retool`（拖拽式 UI 构建工具），通常使用大型开源生态系统\n\
  \n**数据科学未来：** AI 新进展正在彻底改变人们实现工作自动化的方式。随着越来越多人掌握自动化能力，这一趋势将持续发展。但 AI 很少达到完美，因为模型总可能遗漏更多信息——时间永远不够用，知识也常有缺失。\n\
  \n**优秀数据科学家特质：** 谦逊，善于倾听并暂缓判断，尤其是在进入陌生领域时。若不能保持开放心态，就无法理解事物并做出错误假设。同时需要具备灵活性。可视化能力，包括技术层面和非技术层面。\n\
  \n**给准数据科学家的建议：** 不要将自己局限于仅限商业使用的工具，因为优秀的开源工具比比皆是。总的来说，除了自身经验，永远要从他人的工作中学习。即使不打算写学术论文，也要学会阅读论文——至少能快速浏览以了解可行方向。有时解决问题只需借鉴他人已有的成果。\n\
  \n*杰夫是一位经验丰富的数据科学家，在读写能力研究和心理测量学领域有深厚积累。*\n\n脚注 1 2 3 4 5\n\n# 16. 做得如何？衡量机器学习技术的性能\n\
  \n\n\n## 引言\n\n进行机器学习、构建模型、获取预测结果以及发现有趣的关联固然令人兴奋，但我们如何判断所做的一切是否真正正确？这时，性能指标便派上用场了。有多种方法可以衡量机器学习模型的特性，这些特性有助于我们理解模型是否按预期运行、其结论是否准确。如果结果实际上没有意义，我们就不应使用它们。有时，人们很容易只看表面结果就认为这些结果是好的。关于这种不良习惯，请参阅侧边栏了解更多。\n\
  \n模型性能的衡量主要通过计算特定的指标分数来完成。针对三类机器学习任务（分类、回归和聚类），存在不同的指标。我将逐一介绍目前各类任务中使用的各种指标。请注意，我们讨论过的另一种无监督方法是关联规则，但并没有用于全面评估生成规则的指标，因为每条规则在创建过程中已由特定指标评判，因此事后无需再衡量。\n\
  \n当我们谈论评估模型性能时，通常是指在监督学习中，模型在训练集上训练完成后，在测试集（以及验证集，如果使用了的话）上计算指标。在无监督学习中，尽管无法用所有指标衡量“正确性”，但仍有一些可计算的指标能让我们了解模型的质量。当我们使用了无监督算法但同时也拥有标签时，还可以使用额外的指标。\n\
  \n我将首先通过几个例子说明指标在现实场景中的重要性。然后，在讨论模型构建后需要关注的分类、回归和聚类指标之前，我会先概述内部模型构建指标。\n\n## 未能评估机器学习结果\n\
  \n大多数专业数据科学家都足够负责，能确保他们的模型表现良好。但经常有刚入门的数据科学从业者可能不知道评估模型的正确方法（这正是本章内容如此重要的原因）。始终理解模型的表现如何至关重要。同样重要的是，通过检查工作来确保没有犯错误。我曾与一位经验不足的数据科学家共事，他在使用的工具中将论证周期设置为数天而非要求的数月，但他并未发现这个错误。一次快速的检查本应能告诉他，他的预测值比预期大了\
  \ 30 倍。\n\n经验不足的数据科学家犯的另一个错误是，他们确实会使用性能指标来评估模型，但却没有意识到其优异结果是源于数据泄露，而非模型本身神奇。任何时候，当你获得非常高的准确率或其他指标值时，都需检查是否存在这个错误。\n\
  \n但更大的问题是，许多公司实际上并不会去评估其结果在长远来看是否良好。他们可能会进行一些聚类以识别客户类型，但两年后却并未真正检查这能否以任何方式帮助到他们（特别是看它是否比旧方法有所改进）。他们可能会利用机器学习来帮助决定新店的选址，但若干年后，却可能不会比较由模型推荐的店铺与其他未被推荐店铺的业绩表现。造成这种情况的部分原因是，很难跟进多年前发生的事情，而且你也无法立即评估重大决策。\n\
  \n此外，源于技术沙文主义（认为机器学习本质上公平、正确，且通常优于人类工作的观念，详见第 9 章）的态度，意味着人们甚至不会质疑结果。数据科学可以非常强大，但结果真的具有价值吗？要确定这一点还需要付出一些努力。\n\
  \n# 现实世界中性能评估的例子\n\n很多时候，数据科学家都有自己偏好的指标，但考虑不同的指标以及它们如何适配当前问题总是有益的。以下两个例子展示了指标的重要性，尤其是选择正确指标的重要性。\n\
  \n## 示例 1：指标驱动开发\n\n客户关系管理（CRM）平台 Salesforce 拥有成千上万的客户。这些客户有不同的需求和用例，其中许多人希望在其 Salesforce\
  \ 数据上进行机器学习。如果能在该平台内直接完成操作，对他们来说是最简单的，但五花八门的用例给 Salesforce 带来了难题。有时公司会为客户提供定制化帮助，但这成本高昂，且能帮助的客户数量有限。因此，Salesforce\
  \ 创建了一个名为 Einstein Builder 的工具，允许客户生成定制的自助预测服务。^(⁴²) 该工具需要支持所有不同的用例，同时又要易于使用，因此\
  \ Einstein Builder 是一个无需编码的 Web 应用，但仍支持可实现自动化的机器学习管道。他们提供了用于回归、二分类和多分类的工具，这涵盖了多种情况。\n\
  \n你可能会想，在没完成我们花了数章学习的那些数据准备工作的情况下，他们如何进行建模？这是一个两难困境——除非用户自己知道如何做数据准备并且你提供了数据准备工具，否则你无法提供进行此类数据准备的自助服务工具。而自助服务工具的全部意义就在于用户不具备这些技能。现在你应该知道，这意味着结果不会太好。由于数据科学的普及，市场上出现了各种自助式机器学习工具，这是一个普遍存在的现实问题。\n\
  \n因此，他们面临一项艰巨的任务：让客户无需进行数据准备就能进行有用的机器学习。他们确实有一个不错的解决方案，该方案依赖于有效利用不同的性能指标。另外，请记住，客户使用的数据是\
  \ Salesforce 自有系统中的数据，因此他们了解这些数据的外观和结构。客户可能还有额外的自定义表，但至少部分数据是已知的实体。\n\n尽管如此，他们解决方案的核心是衡量客户构建的模型的性能，以便根据需要对其进行调整。系统会观察模型的特性，看是否有可能进行改进。例如，在线性回归中，系统可以通过查找接近零的系数或变量过多的案例来检查过拟合。然后，他们可以添加正则化以减少特征空间。他们还能够使用不同的特征和参数（特征选择和超参数调优）进行实验，衡量每个实验模型的性能，并仔细跟踪所有内容。他们能做到的一件事是在实验的不同步骤计算各种指标，这在我们日常的数据科学工作中并不常见。这些实验中观察到的指标和整体结果有助于他们微调模型。\n\
  \nEinstein Builder 通过观察模型试图达成的目标以及所涉及数据的特性，来确定需要监控的正确指标。所有这些都推动了这款自助式机器学习工具的改进。\n\
  \n\n\n### 示例 2：模型测试与质量保证\n\n在大多数公司中，质量保证（QA）通常应用于软件和报告，而很少涉及数据科学代码或模型本身。人们逐渐意识到这或许并不理想，一些公司正试图纠正这一情况。咨询公司\
  \ Scott Logic 已将机器学习模型测试整合到其流程中。^(⁴³) 该公司的一名测试工程师在一篇面向测试工程师的文章中阐述了他们的流程与方法，旨在帮助测试工程师理解如何从软件测试转向模型测试。\n\
  \n她提到模型测试与软件测试的诸多不同之处，包括：机器学习模型的输出无法预先得知，且完全依赖于数据中的具体内容。此外，模型的输出会随每次新数据运行而变化，但其性能通常会随时间推移而下降（由于模型漂移）。最后，传统的通过或失败简单测试的软件测试方法已不再适用，他们需要依赖各种机器学习性能指标，这也是本章对此感兴趣的原因。\n\
  \n对于这类测试，他们必须非常深入地了解所使用的数据。数据需要被分析和验证，尤其要检查是否存在缺失数据、重复数据以及任何偏见。他们进行的是模型测试，而非模型评估。模型评估是数据科学家在构建模型时，通过在测试集上进行测试来筛选最佳模型的过程。但在质量保证中，他们试图观察模型在现实世界中的表现。在测试中，他们会使用交叉验证。如果可能，他们会结合其他已知解决方案进行\
  \ A/B 测试。但最关键的是他们对性能指标的选择，他们会根据问题类型（分类或回归）来选取指标。他们的一贯做法是不依赖单一指标，而是使用多个指标以获得更全面的视图。并非所有指标都适用于所有数据。\n\
  \n## 分类指标\n\n当人们谈论机器学习中的分类时，通常指的是二分类，通常被理解为对或错——是的，患者患有癌症，或者不，他们没有；是的，这是一封垃圾邮件，或者不，它不是——但也存在多标签分类问题。我们将在此讨论两者的衡量指标。\n\
  \n在二分类中，性能衡量的核心是混淆矩阵，这是一种直观展示模型性能的方法。大多数主要指标都以某种方式与混淆矩阵相关，因此我们将首先介绍混淆矩阵，然后介绍基于矩阵的指标。我们将讨论二分类中使用的另外几个指标，然后讨论多分类中使用的指标。\n\
  \n### 二分类指标\n\n大多数分类问题都是二分类，即有两个可能的标签。它们可以是任何内容，但通常我们将一个视为正类，另一个视为负类。我们将讨论可用于二分类的各种指标。下一节将介绍如何处理多分类问题的性能衡量。\n\
  \n#### 混淆矩阵\n\n对于二分类问题，每次预测都会出现四种情况之一，每种情况都有其名称：\n\n-   **真正例（`TP`）**：预测标签为真，且由于实际实例也为真，因此预测正确。\n\
  -   **真负例（`TN`）**：预测标签为假，且由于实际实例也为假，因此预测正确。\n-   **假正例（`FP`）**：预测标签为真，但由于实际实例为假，因此预测错误（统计学中也称为第一类错误）。\n\
  -   **假负例（`FN`）**：预测标签为假，但由于实际实例为真，因此预测错误（统计学中也称为第二类错误）。\n\n通常，我们显然希望`TP`和`TN`的值高，而`FP`和`FN`的值低。但将这些值转化为矩阵视图，可以让我们更容易看清状况。*混淆矩阵*展示了这四个值的计数，以及预测和实际的标签。图\
  \ 16-1 显示了癌症诊断的基本结构，其中“患有癌症”为正类，“未患有癌症”为负类。\n\n![](img/628533_1_En_16_Fig1_HTML.png)\n\
  \n说明癌症预测结果的混淆矩阵表。该表分为实际条件和预测条件。实际条件包括“实际阳性（患有癌症）”和“实际阴性（未患有癌症）”。预测条件包括“预测阳性（患有癌症）”和“预测阴性（未患有癌症）”。交点处显示了真正例的“TP\
  \ 总数”、假负例的“FN 总数”、假正例的“FP 总数”和真负例的“TN 总数”。左上角单元格表示“总人口”。\n\n图 16-1\n\n基本的混淆矩阵结构\n\
  \n通常，在创建矩阵时，我们仅在顶部和侧边标注“真”和“假”，并且我们知道顶部代表预测，侧边代表实际。在这种视图下，我们通常希望看到从左上角到右下角对角线上的数值高，而其他角的数值低。\n\
  \n请注意，在数据集不平衡（正类样本稀少）的情况下（例如欺诈检测或疾病诊断），我们会看到`TP`框中的数值很低，而`TN`框中的数值非常高。我们仍然希望`FP`和`FN`的数值低。\n\
  \n请记住，虽然我们总是希望`FP`和`FN`低，但在某些情况下，我们更希望尽量减少假正例的数量。例如，在欺诈检测这类情况下，高`FN`意味着我们遗漏了一些欺诈案例，那么该笔交易将不会被调查。我们宁愿处理更多的`FP`，也不愿面对高`FN`。在很多领域都存在这种情况，包括疾病检测（`FN`意味着患者不会被送去进一步检查，并且其疾病将得不到治疗）和安全检查（`FN`可能意味着有人将炸弹带入大楼）。另一方面，也存在`FP`代价极高而`FN`影响不大的情况，因此我们宁愿漏掉正类，也不愿错误地将负类标记为正类。例如，在商品推荐中，如果没有向用户推荐他们可能喜欢的商品（`FN`），并不会造成实际损害；但如果推荐了太多他们不喜欢的商品（`FP`），用户就会对推荐失去信任。其他高`FP`危害严重的案例包括死刑判决（错杀无辜远比放过有罪之人糟糕得多）和垃圾邮件检测（收到少量垃圾邮件（`FN`s）比错过一封重要邮件（`FP`）要好）。\n\
  \n混淆矩阵是二分类问题的良好起点，但仅凭它本身并不能给我们提供太多切实的信息。相反，我们会根据矩阵中的数值计算各种衡量指标。\n\n\n\n# 基于混淆矩阵的指标\n\
  \n人们首先想到的指标通常是准确率，这个术语常被泛泛地用于表示“模型表现如何”，但它本身也是一个简单而具体的指标名称。*准确率*就是所有正确标记的数量除以总记录数。然而，这可能会是一个非常偏斜的指标，尤其是在数据集不平衡的情况下，即实际正例的总数与实际负例的总数不同。在极度不平衡的数据集中，即使将所有实际正例都错误分类，我们也可能获得非常高的准确率。例如，如果我们有\
  \ 10,000 个信用卡交易实例，其中只有 50 个是欺诈性的，如果分类器简单地将每一个都分类为负例（非欺诈），那么分类器的准确率将达到 99.5%。这显然荒谬地具有误导性且毫无用处。\n\
  \n*精确率*是另一个重要的衡量指标，它关注分类器对其正例标签的处理效果，或者说，在其标记为正例的预测中，实际为正例的比例。因此，它侧重于假正例（FP）。当假正例代价高昂而假负例（FN）不那么严重时，这是一个重要的指标，例如在推荐系统中。但当假负例具有危险性时，它就不是最佳指标了。\n\
  \n`召回率` 被认为是精确率的反面，因为它强调的是假负例。`召回率` 这个术语衡量的是在整个数据集中被检测出来的总正例的比例。这是在欺诈检测和疾病检测等情况下我们关心的衡量指标。召回率有时也被称为灵敏度或真正例率。具体计算公式见表\
  \ 16-1。\n\n**表 16-1** 二分类中准确率、精确率、召回率和 F1 分数的计算\n\n| 指标 | 基于混淆矩阵的计算公式 |\n| --- |\
  \ --- |\n| 准确率 | `(TP + TN) / (TP + TN + FP + FN)` |\n| 精确率 | `TP / (TP + FP)` |\n\
  | 召回率 | `TP / (TP + FN)` |\n| F1 分数 | `2*TP / (2*TP + FP + FN)` |\n\n精确率和召回率通常呈反比关系，我们常常希望在这两者之间找到平衡。此外，如果我们的模型表现非常糟糕，我们可能会得到误导性的结果。例如，如果一个欺诈检测器将每一笔交易都标记为欺诈，那么我们会得到非常高的召回率，但精确率（和准确率）会非常低。同样，在推荐系统中，如果我们只推荐了极少量的产品，但这些都是好的推荐，那么我们会获得很高的精确率——但与此同时，我们也错过了所有那些未被推荐产品的销售机会。你可以在表\
  \ 16-1 中看到计算方法。\n\n因此，无论在何种场景下两者中哪一个被认为最重要，我们仍然需要了解它们之间的平衡。幸运的是，我们正好有这样一个指标——`F1\
  \ 分数`，它本质上是精确率和召回率的修正平均值（调和平均数）。它的计算比其他指标稍微复杂一些，但你可以在表 16-1 中看到计算方法。所以，当精确率或召回率更为重要时，常见的做法是查看该指标，同时还要查看\
  \ F1 分数，以确保模型没有做无用功。\n\n尽管 F1 分数不错，但它在处理真负例（TN）方面存在局限性，因此有时会使用另外几个衡量指标，即马修斯相关系数或科恩卡帕系数。这两个指标的计算都稍微复杂一些，但都可以通过混淆矩阵的值来计算。你可以通过谷歌搜索找到更多信息。\n\
  \n我已经讨论过最常见的一些基于混淆矩阵的分类指标，但在实践中还有其他一些有用且常用的指标，包括假正例率和特异度（真负例率）。维基百科上关于精确率和召回率的页面有一个出色的扩展混淆矩阵，总结了所有这些指标。\n\
  \n# 其他指标\n\n尽管混淆矩阵及其相关指标是二分类测量的核心，但数据科学家也会使用一些其他衡量指标。最常见的是相关的受试者工作特征曲线（ROC）和曲线下面积（AUC）。\n\
  \n`ROC` 曲线绘制了真正例率（召回率）和假正例率的对比关系，在一个完美的分类器中，绘制的曲线将是一条横跨图表顶部的水平线，就像你在图 16-2 左侧看到的那样。分类器永远不会完美，所以在右侧可以看到一个更真实的图形，它既展示了随机猜测模型的结果，也展示了一个真实模型在儿童身高数据上的表现。\n\
  \n`![](img/628533_1_En_16_Fig2_HTML.jpg)`\n\n**图 16-2** 两个并排的 XY 图表，比较 ROC 曲线。左侧图表显示一个完美模型，橙色线到达左上角，表明\
  \ AUC 为 1。右侧图表显示一个逻辑回归模型，橙色线位于对角线蓝色“无技能”线上方，表明 AUC 为 0.64。两个图表的 Y 轴均为“真正例率”，X 轴均为“假正例率”。图例区分了“无技能”模型和“逻辑回归”或“完美”模型。\n\
  \n`AUC` 字面上就是 ROC 曲线下的面积。它已包含在图 16-2 的图表中。当比较同一数据上模型的不同运行时，AUC 值较高的模型被认为是更好的。\n\n\
  另一个在模型中很有用的指标是当预测给出一个概率时，这个概率表示预测正确的可能性有多大。例如，在逻辑回归中，我们得到一个概率，并通常取一个阈值——通常是 0.5——高于该阈值的标记为\
  \ True，低于该阈值的标记为 False。有一个称为 `对数损失` 的指标，它直接利用这个概率，并根据每个实例的概率和实际值之间的差异来计算分数（实际计算涉及一些对数值，可以在线查找）。使用这个指标时，我们希望它的值较低。\n\
  \n\n\n### 多分类指标\n\n上述所有指标都可以适用于多分类问题。可以创建混淆矩阵，但由于其顶部和侧面包含的标签不止于 `True` 和 `False`，因此该矩阵会有超过四个区域。\n\
  \n`Accuracy`（准确率）的计算方式相同，即所有正确预测结果除以所有预测结果。其他大多数指标则需要进行一些修改，特别是通过计算宏平均、加权平均或微平均版本。使用*宏平均*方法时，您通过每次仅关注单个类别，并计算所有这些指标的平均值。使用*加权平均*方法时，类似地，您会将每个单独的指标乘以具有该标签的样本总数所占的比例。\n\
  \n使用*微平均*方法时，您通过汇总所有单个类别的数值来生成整体的 `TP`（真正例）、`FP`（假正例）等，然后使用这些汇总值代入常规指标计算。但这种方法有一个问题：`accuracy`（准确率）、`precision`（精确率）、`recall`（召回率）和\
  \ `F-score`（F1 分数）都将得到相同的值。这是因为对于任何给定的类别，`TP` 仅是该类别的总数，但任何被正确标记为不属于该类别的样本都是该类别的一个\"\
  `TN`\"（真负例）。因此，最终所有汇总值都相同。\n\n您也可以为多分类问题生成 `ROC`（受试者工作特征曲线）和 `AUC`（曲线下面积），常见的做法是将每个类别作为\
  \ `ROC` 图上的单独曲线进行绘制。然后可以为每个类别计算一个 `AUC`。图 16-3 展示了一个针对鸢尾花数据的此类 `ROC` 图。\n\n![](img/628533_1_En_16_Fig3_HTML.jpg)\n\
  \n一对多（One-vs-Rest）多分类的受试者工作特征（`ROC`）曲线。图表显示了三条曲线：绿色代表山鸢尾，其 `AUC` 为 0.89；橙色代表变色鸢尾，其\
  \ `AUC` 为 0.66；蓝色代表维吉尼亚鸢尾，其 `AUC` 为 0.78。x 轴表示假阳性率，y 轴表示真阳性率。虚线表示随机分类水平，其 `AUC`\
  \ 为 0.5。\n\n**图 16-3** 一个多分类问题的 `ROC` 图\n\n### 回归指标\n\n衡量回归结果的性能是不同的，因为输出是数值型的，并且在大多数模型中可以是任意值。因此，一个给定值不能简单地判断对错——我们想要衡量的是它与正确数值的接近程度。\n\
  \n关于回归指标，首先要了解的是，回归问题不存在所谓的准确率指标，因为 `accuracy`（准确率）是分类问题特有的。虽然我们有时也会谈论回归中的准确率，但此时使用的是该词的一般含义（即“准确性”），而非一个特定的技术术语。\n\
  \n一个在广义线性模型中常见的指标是 `R-squared`（R 方）分数。从技术上讲，这是一个拟合优度指标——`R-squared` 分数表示生成的模型与数据的拟合程度，以及目标变量中的方差有多少是由特征解释的。在线性模型中，它有效地将实际的回归线与均值线进行比较，均值线是穿过图表上数据中所有\
  \ *Y* 值的平均值在 Y 轴上的点的一条水平线，但它也可以用于一些非线性模型中。在线性情况下，一个糟糕的模型会有一条接近均值线的回归线，并且 `R-squared`\
  \ 分数非常低。对于在相同数据上构建的不同模型，`R-squared` 可能是一个良好的指标，因为它被认为是相对的。这意味着它不太适合跨不同数据集进行比较。\n\
  \n`R-squared` 的一个缺点是它假设所有特征对模型都很重要。此外，增加一个特征往往会提高 `R-squared` 值，这可能导致人们增加不必要的特征，最终得到一个过拟合的模型。有一种修改版的\
  \ `R-squared` 分数能更好地处理不同价值的特征。`Adjusted R-squared`（调整后 R 方）分数会评估每个特征带来的附加值，只有当特征对模型的改善程度超过了随机水平时，分数才会增加。由于这种改进，调整后的\
  \ `R-squared` 几乎总是小于 `R-squared`。\n\n还有其他几个指标经常被用来替代 `R-squared` 和调整后的 `R-squared`，因为它们并不总是适合用来确定模型在测试集上的最佳性能。\n\
  \n一个流行的回归指标是*均方误差*（`MSE`），它涉及计算实际值与预测值之差的平方，求和，再除以总预测次数，从而得到一个“平均”值。对差值进行平方处理对于防止负值抵消正值很重要，但它也有一个问题，即由于平方运算，数值很容易变得非常大。一个完美的模型其\
  \ `MSE` 为 0，但也可能变得非常大。此外，该值可能难以解释，因为其单位是目标变量单位的平方。\n\n`MSE` 的一个变体是*均方根误差*（`RMSE`），它仅仅是\
  \ `MSE` 的平方根，这使得指标的度量单位恢复到了与目标变量相同，因此更容易解释。在对差值进行平方运算之后再进行开方，可以避免正负误差相互抵消的问题。与 `MSE`\
  \ 一样，完美的 `RMSE` 值为 0，但它也可能变得很大。\n\n另一个流行的指标是*平均绝对误差*（`MAE`），它类似于 `MSE`，但为了处理正负值抵消效应，它采用差值的绝对值而非平方。与\
  \ `MSE` 一样，将这些值求和后除以总预测次数。但这种方法避免了 `MSE` 通过平方运算而导致的误差膨胀（尤其是较大的误差），因此通常被认为更真实，更受青睐。此外，它像\
  \ `RMSE` 一样，使用目标变量的单位。同时，像 `RMSE` 和 `MSE` 一样，一个完美的模型其 `MAE` 为 0，也可能变得很大。\n\n另一个经常使用的指标是*平均绝对百分比误差*（`MAPE`），它是\
  \ `MAE` 的一个变体，将误差表示为百分比，使其能被广大受众立即理解。`MAPE` 先计算实际值与预测值的差值，除以实际值，然后取绝对值，再进行求和（再除以总预测次数）。百分比非常直观，我们无需考虑目标变量单位的含义。需要注意的一点是，当模型表现很差时，“百分比”也可能爆炸式增长，远高于\
  \ 100%。另一点是，在计算误差百分比时，如果实际值为 0，则无法计算，因为这意味着除以零（尽管存在一些变通方法）。此外，该指标是相对于实际值而言的。如果实际值为\
  \ 125，预测值为 100，我们得到误差 25，这将转化为 25%；但如果实际值为 75，预测值为 100（与前一个示例的误差差值相同），百分比则为 33%。因此，高于实际值的预测比低于实际值的预测会受到更大的惩罚。\n\
  \n### 聚类指标\n\n由于聚类通常是无监督的，因此大多数指标都是内部指标，主要寻找聚类的一般特征，而不是将结果与已知值进行比较。然而，有时聚类是在已知标签的情况下进行的，并且有一些针对这种情况的特定指标（这些被视为外部度量）。我们将在此介绍这两种类型。\n\
  \n\n\n### 内部指标\n\n内部聚类指标是指那些无需知道真实标签的评估方法。由于这些指标仅关注聚类的特征，比如各簇之间分离得如何以及簇内数据有多紧凑，这并不能说明聚类结果是否准确。它们只能告诉我们这些聚类看起来是一个不错的模型。\n\
  \n一种常用于评估聚类结果的指标称为*轮廓系数*，它衡量的是簇之间的分离度和簇内部的凝聚度。这些特性在聚类模型中至关重要，因为我们希望各簇之间能清晰分开（分离度），同时每个簇内的数据点之间差异不大（凝聚度）。其计算涉及每个数据点的两个平均值：该点与同一簇内其他点之间的平均距离，以及该点与不同簇中数据点之间最小的平均距离。该值的范围在\
  \ –1 到 1 之间，数值越大表示聚类效果越好（因为数据点与自身簇匹配良好），数值越小则表示簇之间存在重叠和模糊性。\n\n第二种聚类指标是*戴维森-堡丁指数*，它衡量每个簇与其最相似簇之间的相似程度。该指标基于对所有簇的平均值计算，其中每个簇会与被认为最相似的另一个簇进行不相似性度量。该指标数值越小越好。\n\
  \n另一种名为*卡林斯基-哈拉巴斯指数*的指标则同时考虑了簇内方差和簇间方差。其计算涉及簇间与簇内的平方和、簇的数量以及数据点的总数。该指标数值越大越好。\n\n\
  我要提及的最后一个内部指标是*惯性*，它关注的是簇内平方和。该指标计算每个数据点位置与其所属簇质心之间的平方距离之和。分数越低越好，但如果分数过低，则可能表明过拟合。此外，随着簇的数量增加，惯性往往会减小，这就是为什么选择最佳簇数量非常重要。\n\
  \n### 外部指标\n\n到目前为止我们讨论的所有指标都只是评估聚类结果（如同在无监督学习中那样），但还有一些外部指标，因为它们仅适用于拥有数据标签的情况（如同在监督学习中）。聚类本身仍然是无监督运行的，但名为*兰德指数*及其变体*调整兰德指数*的两个指标能让我们将聚类算法的输出与拥有的标签进行比较。兰德指数的计算涉及标签对的一致总数与总对数，其取值范围为\
  \ 0 到 1，数值越高越好。调整兰德指数则利用计算出的 RI 值，并通过预期 RI 值进行机会校正。其取值范围与 RI 相同。\n\n当标签已知时，另一个可用的指标是互信息（MI）。*互信息*衡量的是数据点的真实标签与预测标签（即所属簇）之间的相似度。其计算涉及真实标签、预测标签以及一些概率值。最低可能得分为\
  \ 0，表示毫无关联；数值越高，则表明预测结果与已知标签越吻合。\n\n\n\n# 要点总结与下章预告\n\n本章我们讨论了分类、回归和聚类模型的性能度量方法。这三类机器学习模型所使用的评估指标截然不同。在分类问题中，大多数度量指标都基于混淆矩阵，它用来表示真正例、假正例、真负例和假负例的数量。在二分类中，“正例”与“负例”表明我们所测试的标签（例如，正例表示可能是欺诈交易，负例则表示可能不是欺诈交易）。“真”和“假”则用来指示预测标签是否与实际标签相符。其中一些指标包括：`accuracy`（预测正确比例）、`precision`（是否过度热衷于做出正例预测）、`recall`（成功识别出真正例的比例）以及\
  \ `F-score`（`precision` 和 `recall` 之间的平衡）。我还介绍了 `ROC` 曲线和 `AUC` 计算，它们关注的是真正例率和假正例率。\n\
  \n接着，我讨论了多种回归指标。`R-squared` 用于线性模型，它指示模型对数据的拟合程度。`MSE` 衡量实际值与预测值之间的误差，并通过平方消除正负号。`RMSE`\
  \ 取该值的平方根，使单位恢复到与目标变量相同。`MAE` 取实际值与预测值之差的绝对值进行计算，其单位也与目标变量相同。`MAPE` 是 `MAE` 的百分比形式，对于非技术人员来说通常更直观。\n\
  \n最后，我们探讨了几种聚类指标，其中一些用于在不知道真实标签的情况下量化聚类模型的总体质量，另一些则可以在已知标签的情况下评估模型。第一组指标包括：`silhouette\
  \ score`（考察簇的凝聚度和分离度）、`Davies–Boulding index`（衡量一个簇与其最相似邻簇的相似程度）、`Calinski–Harabasz\
  \ index`（考察簇间方差与簇内方差）和 `inertia`（另一种对簇内平方和的度量）。后一类型的两个指标，`RI`（正确标记的对数与总对数之比）和 `MI`（衡量实际标签与预测标签之间的相似度），也都有其用武之地。\n\
  \n在下一章中，我们将探讨如何与语言打交道。数据科学家并非总是要涉足自然语言处理或语音处理，但这正变得越来越普遍，尤其是在大语言模型流行之后。我们将首先介绍 NLP\
  \ 的基础知识，包括语言解析、句子分割、将文本转换为称为词元（token）的词片段、词干提取（将单词还原为其常见的基本形式）以及词性标注。接着，我们将涵盖语言理解与生成。最后，我们会花一点时间来探讨语音处理（包括识别与合成）。\n\
  \n# 从业者简介：迭戈·坦加西\n\n**姓名：** 迭戈·坦加西\n\n**现任职务：** 高级分析经理\n\n**现任行业：** 零售业\n\n**经验年限：**\
  \ 8 年数据科学家经验，此前在精算与金融领域工作\n\n**教育背景：**\n\n*   精算科学学士学位\n\n*此处表达的观点仅代表迭戈个人，与其过去或现在的任何雇主无关。*\n\
  \n### 背景\n\n迭戈一直热爱工程、机器人以及各种系统。自从他拥有第一台个人电脑后，他就下载各种东西来捣鼓，开始摆弄软件，甚至越狱了他的 iPhone。他原本计划在大学学习机电一体化，但当他去学校参观时，负责接待他的教授毫无激情，这让他改变了主意，开始寻找其他方向。他发现了另一个让他着迷的领域——精算科学——并在大学里学习了这个专业。第一个学期后他就深爱上了它。在选修了一门由一位经验丰富的迷人教授教授的金融课程后，迭戈确信自己想在金融领域工作。\n\
  \n## 工作\n\n迭戈如愿以偿地在金融领域找到了一份工作，在一个金融风险部门（处理养老金相关事务），但结果发现这份工作很无聊。日复一日，每天只是重复相同的步骤——获取输出，将其输入另一个模型，如此循环。六个月后他就感到极度厌倦。当一家咨询公司找到他，寻找具备统计和数学技能的人时，他果断跳槽。他非常享受这段经历，包括学习了更多关于数据和数据工程的知识，如\
  \ `ETL`、数据库、信息立方体和系统保证。他还更深入地了解了数据科学这个领域以及营收组合模型（一种确定哪些产品应该获得推广的方法）。他当时使用的工具非常基础，比如用\
  \ Microsoft Excel 求解器来优化方程，但利益相关者仍然印象深刻。工作大致分为两个阶段：首先是进行数据科学分析，其次是沟通结果。在咨询公司，他喜欢的一点是能够与零售公司的高层人士合作，这让他变得非常善于沟通。由于这些沟通技巧，他经常被“点名”委以重任。他后来离开了咨询业，但仍留在零售业担任现在的职位，并且仍然热爱这份工作。\n\
  \n## 精彩片段\n\n**工作中最喜欢的部分：** 迭戈热爱数据科学工作中需要不断学习的一切。学习各种知识让他充满活力。他也喜欢与形形色色的人共事。最后，任何编码工作中最令人满足的事情之一，就是当你编写了一些有挑战性的代码，并且它成功运行了。\n\
  \n**工作中最不喜欢的部分：** 官僚主义。有时完成工作会遇到重重障碍，以至于利益相关者都失去了兴趣。有时公司文化也会令人感到棘手。\n\n**最喜欢的项目：**\
  \ 在他做咨询期间，曾有一个政府机构要求建立一个墨西哥毒品缉获案例数据库。他们需要大量细节，包括事发地点、涉案贩毒集团、涉案人数和车辆数、毒品藏匿地点等。他们必须创造性地解决问题，使用了多种数据源，但主要是报纸。他们抓取新闻网站的内容，进行\
  \ NLP 处理以提取所有细节，并将其存储到数据库中。这是一个非常令人满意且成功的项目。\n\n**最常用的技能：** 分析性思维。能够将技术语言转换为商业语言，反之亦然。善于自学。\n\
  \n**当前主要使用的工具：** `R`、`Python`、`SQL`、`Snowflake`、`GitHub`、`Google Suite`（API 等）、`Visual\
  \ Studio`\n\n**数据科学的未来：** 过去，大多数数据科学家需要承担非常广泛的工作，包括数据工程、数据管理等。但现在分工更加明确，数据科学家可以专注于更典型的数据科学工作，而其他任务则由拥有特定职位头衔的人来完成。这种专业化、精细化的趋势将会持续下去。\n\
  \n**优秀数据科学家的特质：** 要明白数据科学确实包含技术内容，但最大的精力需要花在与非技术人员沟通、理解他们的需求以及告知他们可以期待什么结果上。\n\n\
  **他对准数据科学家们的建议：** 尝试为自己的职业生涯制定一个关于你想专注领域的计划，这样你就能了解不同的领域，以及你希望在何处工作。\n\n*迭戈是一位经验丰富的数据科学家，在金融和零售领域拥有深厚的专业知识。*\n\
  \n脚注 1 2 3\n\n# 17. 让计算机具备读写能力：文本与语音处理\n\n\n\n## 引言\n\n近来，每个人都在语言语境下对人工智能有了切实的认知，这主要得益于与\
  \ ChatGPT 等大语言模型（LLM）相关的工作。这便是真正的自然语言处理（NLP），并且它在过去几十年间蓬勃发展。如今，计算机在语言处理方面能做到的事情令人惊叹不已，现在正是投身该领域的激动人心的时刻。\n\
  \n我们中的许多人也知道，在过去几十年里，语音技术取得了进步，尤其是那些曾致电公司寻求帮助的人对此感触颇深。我个人还是想回到按数字键的时代，因为我打电话要咨询的事情似乎总与选项对不上，但这种情况不会再出现了。\n\
  \n多年来，语音处理工作主要由电气工程师承担，因为它被视为一个信号处理问题。因此，在此类工作中融入的语言学知识并不多。相比之下，自然语言处理（NLP）通常与计算语言学（一个类似的学科，但更侧重于语言学理论）一同设立在语言学系，有时也与计算机科学结合，因此文本处理涉及语言学知识的历史要长得多。但语音处理领域已经发生了变化，因为他们最终认识到，语音不仅仅是声音——我们说话和听到词语的方式取决于诸多因素，包括上下文、语气以及其他语言学特征。\n\
  \n围绕自然语言处理和语音处理，尤其是语言学领域，存在大量术语。请参阅侧边栏，了解与之相关的许多语言学领域的解释。下文还会出现更多术语。\n\n**语言学分支**\n\
  \n**语音学**：研究语音，包括其生理机制和声学特性\n\n**音系学**：研究语音，通常比语音学层级更高\n\n**语义学**：研究语言中的意义\n\n**句法学**：研究词语和短语如何排列才能符合语法且有意义\n\
  \n**韵律学**：研究语言中更高层次的语音特性，包括语调、重音和节奏\n\n# 现实世界中自然语言处理（NLP）与语音处理的实例\n\n自然语言处理（NLP）在工业界应用日益广泛，这里我们将看两个例子，一个来自苏格兰的鞋业公司，另一个来自法国医院，该医院使用语音识别来口述病历。\n\
  \n## 示例 1：自然语言处理（NLP）填补大空缺\n\n苏格兰公司 schuh 是一家在英国和爱尔兰广为人知且正在扩张的鞋业公司，它在管理客户互动方面遇到了困难，试图加快并改善这一流程。^(⁴⁵)\
  \ 他们以拥有良好的客户支持而自豪，并特别寻求处理客户投诉的方法，以期让客户满意，并使其仍然是未来的客户。\n\n他们开始使用 Amazon Comprehend\
  \ 的自然语言处理（NLP）和机器学习（ML）工具来识别客户电子邮件中的情感。该系统会判断一封新邮件是否包含正面或负面情感，这有助于将全新的邮件正确地分派给支持团队。不同的客户支持代理擅长不同类型的支持，因此将邮件更快地路由给正确的人可以节省宝贵的时间。这种优先级排序和分派以前是手动完成的，非常耗时。他们还使用这些工具分析外发邮件，以确保代理回复的质量。\n\
  \n他们发现该系统带来了巨大好处，主要体现在节省时间以及改善与客户的互动质量与及时性上，这意味着他们更有可能留住客户。\n\n## 示例 2：口述病人病历\n\n\
  医生是出了名的忙碌，文书工作是他们最不喜欢的任务之一，但及时更新病历至关重要。2016 年，巴黎的圣约瑟夫医院以尽可能实现无纸化而自豪。作为这项努力的一部分，他们开始使用\
  \ Nuance 公司的语音识别系统，这是一家已在语音识别领域深耕近三十年的公司。^(⁴⁶) Nuance 拥有多种针对医疗保健的专业产品，巴黎医院使用了其产品\
  \ Dragon Medical Direct，并将语音识别集成到他们的电子病历系统中。\n\n他们试图通过此解决方案解决的主要问题是完成和交付医院病历的速度。一家医疗监管机构要求他们在病人出院时提供病历，并在出院后一周内将病历送到其全科医生（GP）手中，而这一要求并未始终得到满足。病历的处理流程是医生做笔记，然后交给秘书，秘书必须重新录入所有内容。这需要大量的来回沟通，而且让第二方录入数据充满了出错的风险。阅读别人匆忙记下的笔记总是很困难，医生打的任何错字都极易被另一个人误解（即使医生自己能识别并纠正自己的错误）。但最重要的是，这个过程太慢了。如果他们能在不增加医生额外工作量的情况下，省去秘书重新录入的环节，那对每个人来说都将是一个胜利。\n\
  \n当他们开始测试时，遇到了阻力（任何系统变更都难免如此）。医生们认为它行不通，也不愿意改变他们的流程。然而，早期参与测试的医生对口述软件印象深刻，因为它既准确又快速。很快，该软件部署到了许多科室，其他科室也纷纷要求使用。他们发现，每个医生需要几周时间才能适应系统。例如，大多数医生选择在病人面前口述病历，这有点尴尬。但一旦习惯了，他们就很喜欢能在就诊期间完成这项工作，而不必在数小时或数天后与秘书协作处理，病人也有机会纠正任何错误。\n\
  \n该医院认为该项目取得了巨大成功。在采用该软件之前，有 32% 送到全科医生（GP）的病历错过了两周的截止日期。采用口述系统后，这一比例降至 5%，这是一个巨大的改进。近三分之一的病历在一天内发送。他们收到全科医生（GP）的反馈，称收到的病历清晰准确，部分原因是使用口述系统使医生说话更清晰、更简洁。患者也对这种新的透明度表示赞赏，因为他们清楚自己的病历里写了什么。所有医生都同意这节省了时间。\n\
  \n# 语言数据来源\n\n我最初在第 1 章讨论非结构化数据时谈到了语言数据。来自新闻文章、推文和客户投诉邮件等文本数据都符合这个范畴。但我们不能简单地将这些数据输入到任何机器学习（ML）系统中，就能期望得到有用的输出。我们必须以某种方式准备数据。我们将在下一节中讨论可以采取的各种方法。\n\
  \n\n\n### 文字系统\n\n语言的书写方式极为重要。历史上，自然语言处理领域的大量工作都集中在英语和其他欧洲语言上，但针对汉语及其他语言的研究也日益增多。原因之一在于处理不同类型的文字系统所面临的挑战。\n\
  \n英语并非唯一的游戏规则制定者，即便在自然语言处理领域它目前仍是主流。本节中我将使用一些语言学术语，请参考侧边栏查看相关定义。英语和大多数西欧语言属于所谓的音素文字系统，这意味着它包含代表（通常）特定发音的字母，这些字母组合成单词。严格来说，情况并非如此简单，因为发音和拼写可能取决于上下文和语言起源，但从概念上讲，音素文字系统使用代表发音的字母来构成单词。这类系统包含辅音和元音。类似的一种系统是音节文字，它通常用一个字符代表一个特定的音节，即一个辅音和一个元音的组合。大多数印度语言都采用这种书写方式。现代语言中最后一种文字系统是语素文字，它用一个单独的字符代表一个完整的单词（或短语）。目前仍在使用中的唯一代表是汉字，但它已被东亚地区的多种语言所吸纳。音素文字和音节文字在书写时都包含了发音信息，但语素文字系统则不然。有趣的是，大多数东亚语言也拥有次要的书写系统，该系统确实代表发音，并在与主要系统不同的语境中使用。\n\
  \n不同语言文本的另一个重要元素是字母表系统。英语和大多数欧洲语言使用拉丁字母横向从左到右书写。其他音素文字字母表包括西里尔字母（俄语等）、古希腊字母和阿拉伯字母（阿拉伯语、乌尔都语等）。使用阿拉伯字母的语言是横向从右到左书写的。一些类似音素文字的语言包括仅使用不同字母表的辅音，例如希伯来语，也是横向从右到左书写。大多数印度语言使用音节文字，横向从左到右书写。东亚语言通常竖向书写，从上到下阅读。\n\
  \n语言书写方式的最后一个重要方面是各种辅助要素，如标点符号（逗号、句号等）、变音符号（字母修饰符，如分音符或重音符号）以及空格。我们常常认为这些东西理所当然，但古拉丁文单词之间是没有空格的。当我们尝试进行自然语言处理时，所有这些因素都将发挥作用。\n\
  \n**文字系统的语言学术语**\n\n`文字系统`：用于以书面形式传达特定语言单词的任何系统\n\n`字母表`：语言书面部分的样式（多种语言可以使用同一种字母表）\n\
  \n`字母`：音素文字系统中一个单独的书写符号（`\"alpha\"` 包含五个字母）\n\n`数字`：一个单独的书写数字（`\"973\"` 包含三个数字）\n\
  \n`元音`：可以发出并保持的可发音语言音素，通常张嘴（英语中的元音包括由 `\"a\"`、`\"e\"`、`\"i\"`、`\"o\"` 和 `\"u\"`\
  \ 发出的各种音素）\n\n`辅音`：通常部分或完全闭嘴发出的可发音语言音素（英语中，`\"t\"`、`\"m\"`、`\"f\"`、`\"s\"` 和 `\"\
  k\"` 都是辅音）\n\n`吸气音`：一种特定类型的辅音，由不同的舌头配置产生，通常包含爆破音或吸气音（在一些非洲语言中很常见）\n\n`音节`：单个可发音的语言单位，包含一个元音，可选地包含一个辅音\n\
  \n`单词`：语言中一个独立的意义单位，无论它是由单个字符还是一系列字母或音节表示\n\n`语素文字`：代表一个单词或短语的单个字符、符号或标记（例如汉字、埃及象形文字和英语中的速记符号）\n\
  \n`变音符号`：添加在字母上方或下方的符号，用以指示发音差异（常见的是重音符号和软音符）\n\n`字符`：书面语言中任何单一且独立的单位，如果存在变音符号，通常也包含在内（在西方语言中，每个字母、数字和标点符号都是一个单独的字符；在汉语这样的语素文字语言中，它可以是一个由许多笔画构成的单独单词，或一个代表发音的单词组成部分；在其他语言中，它可以代表一个音节）\n\
  \n### 文本数据\n\n实际的文本数据来源几乎是无穷无尽的。这是我们在第 1 章中讨论的一种非结构化数据。它只是任何经过数字化的、任何形式的文本。我曾在一家公司工作，我们分析书籍文本，因此我们扫描了整本书，每本书都作为一个字段存储在\
  \ SQL Server 数据库的某一行中。它可能是存储在服务器文件夹中作为文件的学生论文全文。它可能是实时涌入的推文。任何人类语言并以文本形式数字化呈现的内容都符合条件。\n\
  \n需要注意的是，无论文本数据是什么，几乎可以肯定在开始任何自然语言处理之前都需要进行一些预处理。这包括处理任何字符编码问题（接下来讨论），以及可能调整换行符和任何残留的杂乱字符（例如，如果从\
  \ Word 文件转换为纯文本，可能会产生奇怪的格式字符或其他残留物）。\n\n文本数据的一个令人头疼的问题是编码（尽管这已经不像以前那么困难了）。有几种不同的文本编码（适用于所有文本文件，不特定于人类语言文本），其中\
  \ `UTF-8` 是最受欢迎的。对于西方语言，你仍然会看到的其他常见编码是 `Windows-1252` 和 `Latin-1`。大多数编程语言现在都能相当优雅地处理这个问题，但是当你查看代码从你提供的文件中读取的内容时，如果发现输出乱码，那几乎肯定是编码问题。你需要去搜索一下相关方案。\n\
  \n### 来自音频的文本数据\n\n语音处理甚至更复杂，因为它实际上在自然语言处理的基础上增加了一层复杂性。通常，语音识别涉及将录制的语音转录成文本，然后可以使用与处理文本相同的自然语言处理技术来处理这些文本。即使系统从语音输入到语音响应从未生成中间文本文件，这在概念上也是成立的。自动转录过程容易出错。\n\
  \n语音合成通常也使用文本来创建音频，因为这是生成的起点。它还使用一些自然语言处理技术来确定发音。我们进行的许多语音数据准备工作将与文本数据类似，我们将在下面讨论这一点。\n\
  \n\n\n# 自然语言处理\n\n自然语言处理本质上是一门（也是艺术）科学，它处理的是带有公认书写系统的文本语言数据，并将其分解成小块，以便作为数据进行处理。我们就拿前面那句话来看看如何将其转化为数据。请参阅侧边栏了解本节将提到的一些定义。\n\
  \n## NLP 术语\n\n**文本**：使用公认书写系统书写的人类语言版本（在计算机世界里，这也指没有 Word 或其他文字处理软件中格式的最简单文本数据，例如在微软的记事本或\
  \ Mac 的 TextEdit 中找到的文本）\n\n**文档**：包含一个连贯文本单元的单个对象，将被作为一个整体处理（在推文分析中，通常每条推文就是一个文档；而在处理学生论文时，每篇完整的论文就是一个文档）\n\
  \n**语料库**：多个文档的集合\n\nNLP 包含许多不同的技术，其中很多可以结合使用。我将会介绍其中的大多数，但你还可以做很多其他事情，这些可以在网上找到。还有一种在处理语言时经常使用的技术，叫做正则表达式。严格来说它不属于\
  \ NLP，但非常有用，你可以在侧边栏中了解它。\n\n## 正则表达式\n\n文本处理的内容远不止 NLP，大部分只是使用不同编程语言的文本处理库。但有一个基本的文本处理工具，它不属于\
  \ NLP，但在合适的场景下却非常有用，并且经常与 NLP 项目一起使用，所以了解它是很有好处的。*正则表达式*（通常缩写为*regex*或简写为*re*）允许你指定要在文本中匹配的字符串模式。常见的用途是创建匹配\
  \ URL 或电子邮件的模式，以便在你处理的文本中查找它们。实际上，它们可能很快变得相当复杂，但你只需知道足够的知识来查找如何编写所需的模式即可，而不必记住所有语法。\n\
  \n举个例子，下面是一个匹配电子邮件标识符的模式可能的样子：\n\n```\n\\b[\\w.\\-]+@\\w[\\w]*\\.[a-zA-Z]+\\b\n\
  ```\n\n这是你在使用它们之后才会学到的东西，所以不必因为它看起来很吓人而担心。我们将逐部分进行分解。理解反斜杠是一个转义字符，它会改变下一个字符的含义，这有助于理解。这里，`\\\
  b`确保开头有一个单词边界。方括号内的值表示括号内列出字符中的任意单个字符。`[\\w.\\-]`匹配三种可能情况中的一种：\n\n- 任意字母或数字（即`\\\
  w`）\n- 句点（`\\.`）\n- 连字符（`\\-`）\n\n`+`表示前面字符出现一次或多次（在这里，指方括号组中指定的任一字符）。`@`仅匹配该字符一次。`\\\
  w`匹配单个字母或数字。然后`[\\w]*`匹配零个或多个字母或数字（与前面的`\\w`以及紧接其后的`\\w`结合，意味着`@`符号后面必须至少有一个字符）。`\\\
  .`匹配单个句点。`[a-zA-Z]+`匹配一个或多个字母。最后的`\\b`再次表示一个单词边界。\n\n我知道这看起来很不美观，但如果你开始使用正则表达式，你会惊讶地发现自己会逐渐记住这一切。即使你记得，你也可能会发现自己总是需要去查找具体细节，这也没关系。\n\
  \n### 解析语言\n\n大多数人都凭直觉知道语言有规则，即使他们无法明确指出这些规则是什么。然而，他们在说话时遵循大部分规则，在写作时也遵循大部分规则，尽管很少有人能始终完全正确。关于语言规则，唯一的通用规则就是总会有例外。例外情况使得学习语言变得困难，而像英语这样的语言尤其困难，因为它借鉴了许多不同的语言，因此“规则的例外”极为常见。此外，在不同语境下也有不同的规则适用，例如当某种方言使用与该语言其他方言不同的词汇和发音时，或者当不同的群体（如青少年与退休人员）以不同方式使用语言时。即使在同一种语言内部，其书写方式在不同语境下也可能大相径庭。想想看，学术期刊上的文章与推文之间的区别。\n\
  \n尽管存在这些重要的差异，但所有形式的语言仍有一些共同的方面。有几种标准的语言分解方法。请参阅侧边栏中我将在此使用的一些更详细的语言学定义。将语言分解成具有语言学意义的部分通常称为解析语言。请参阅侧边栏中我将讨论的一些语言学和\
  \ NLP 术语。\n\n### 更多 NLP 术语\n\n**词元**：正在处理的文本中任何独立的单元，如单词、语素、数字（包括多位数）或标点符号（可以是相对的，像`$25.78`这样的可以算作一个词元）\n\
  \n**词缀**：前缀（加在单词开头的子词部分，如“un-”构成“unreliable”）、后缀（加在单词末尾的子词部分，如“-ness”构成“completeness”）或中缀（插入单词中间的词缀，在英语中不太常见）\n\
  \n**词干**：去掉一些词缀后的单词基本形式（并不总是对应一个实际存在的单词）\n\n**词元**：去掉某些词缀等形态特征后的根词规范形式（总是对应一个实际存在的单词）\n\
  \n**标点符号**：表示语法方面的标记（如逗号、句号、分号和引号）\n\n**词性**：单词在句子中所起的句法功能类型（常见的有名词（命名词）、动词（动作词）和形容词（描述词））\n\
  \n**句子**：作为一个有意义单元的一系列单词，包含一个名词和一个动词以及其他类型的词汇\n\n解析有一个流程，通常大致按相同的顺序进行，但并非总是如此。此外，并非所有分析都需要每一个步骤。我在此概述基本任务，并在下面进行解释。第一个解析任务通常是分词（基本上是将文本分解成更小的部分，通常是“单词”和标点符号）或句子分割（识别一个句子在哪里结束，另一个句子在哪里开始）。接下来是词性标注，我们识别单词在句子中的语法角色（例如，名词与动词）。然后我们进行词干提取或词元化，这基本上涉及在单词可以以不同形式出现时，将其（词元）转换为基本形式。这些步骤的执行顺序并非固定不变，但我将按一种常见顺序介绍它们，并说明何时可能需要采用不同的顺序。\n\
  \n`R`和`Python`都有专门的库来完成这里讨论的大部分任务。根据你的领域和上下文，你很可能可以直接使用它们，或者可能需要进行一些调整。\n\n\n\n\
  ### 分词（Tokenization）\n\n大多数情况下，当数据科学家谈论分词时，他们指的是将文本拆分成我们通常所说的“单词”和标点符号。当我们处理语言并希望理解其含义时，这是有意义的。但有时，出于某些原因，可能需要将其拆分成其他片段。例如，将名词短语（如\
  \ `the green tree`）识别为一个独立的单元是很常见的做法。或者，从事语音研究的人可能希望将单词拆分成音节，或者将前缀和后缀分开。他们也可能想要将一个句子划分为不同的从句。分词的类型完全取决于后续的分析方式。其中大多数情况比数据科学家通常需要处理的情况更复杂，但了解现有各种可能性是好的。\n\
  \n对于单词级别的分词，我们思考时看似显而易见的事情，在实际操作中并不总是那么清晰，就像句子分割一样。最粗糙的分词是依据空白字符进行分割，但这会留下像 `there;`\
  \ 这样的结果——其中的分号不应该和单词连在一起。因此，我们还需要将标点符号分离出来。但是，考虑像 `don't` 这样的单词，我们知道它是 `do not`\
  \ 的缩写形式。它应该被当作一个词元（`don't`），还是两个词元（`do` 和 `n't`，或者 `do` 和 `not`），甚至三个词元（`do`、`'`\
  \ 和 `not`）呢？答案很大程度上取决于你接下来要对这些词元做什么。有时，将“not”单独区分出来非常有价值，因为它会使其所修饰的单词含义相反。举个例子，如果我们试图理解文本的大致内容，某个词是否被否定可能并不那么重要。然而，如果我们试图弄清楚作者想要表达的确切含义（比如在情感分析中，我们想知道它是正面还是负面的），那么否定就至关重要了。\n\
  \n### 句子分割（Sentence Segmentation）\n\n句子分割仅仅是指识别出一个句子的开始和结束。对于大多数有读写能力的人来说，这似乎非常简单。但在处理真实文本时，结果却并非那么显而易见。句号（`.`）是句子断句最常见的标志，但它并非总是如此。以下面这段文字为例：“That\
  \ will be $6.32\\. Cash or credit?” 这里有两个句号，但只有一个表示句子结束。这个特例处理起来并不太难，因为我们可以识别出那些两边（或者可能只是右边）带有数字，且数字与句号之间没有空格的句号。但一旦你开始深入研究，你会发现很多这样的特定情况不断涌现。此外，你如何处理像这样的文本：“I\
  \ went to the bookstore…they didn’t have it… so I left.” 一个有经验的英语使用者会凭直觉认出这实际上是三个不同的句子。但这是某个群体在短信和在线帖子中对省略号的一种特殊用法，而在大多数其他文本中，省略号（`…`）通常不表示句子结束（它通常是同一个句子的延续）。此外，许多社交媒体上的文字是非正式写作的极端体现，其中可能根本没有可以通过可检测方式识别的句子断句标志。\n\
  \n### 停用词移除（Stop Word Removal）\n\n停用词是指在特定上下文中无关紧要的词（词元）。一旦我们完成分词，移除它们是非常常见的做法。几乎总是被视为停用词的词元包括冠词，如\
  \ `the` 和 `an`；连词，如 `and` 和 `or`；介词，如 `of`、`by` 和 `in`；以及各种修饰词，如 `just` 和 `so`。正如上文所暗示的，否定词（`no`、`not`\
  \ 及其缩写形式）可以被视为停用词，也可能至关重要。网上有通用目的的停用词列表。像大多数事情一样，停用词是相对的，但你几乎总是想要至少移除一些词，即使你需要根据你的特定领域自行微调你的停用词列表。\n\
  \n### 处理其他特殊词元（Processing Other Special Tokens）\n\n许多真实文本包含非单词的内容。数字、电子邮件地址、URL、表情符号和颜文字，以及标点符号，都是我们必须处理的一些文本类型。处理它们每一种都需要考虑我们的具体目的，因为每种情况都不只有一种处理方法。例如，看看数字，它们对我们来说可能重要，也可能不重要。如果我们正在分析餐厅菜单以判断这是否是一家“高档”餐厅，那么价格对于识别就很重要。但如果我们正在浏览书评，试图找出被评论书籍的体裁，我们就不关心他们提到了哪些页码。\n\
  \n可能出现的特定类型的非单词词元也取决于我们正在处理的文本类型。例如，在学术写作中我们很少看到表情符号或颜文字（除了讨论它们的文章），但在短小的社交媒体帖子中我们会看到很多。而标点符号则很可能相反。\n\
  \n因此，如何处理这些内容取决于你的上下文和目的。通常存在一些既定的处理方法，稍微谷歌一下就能找到。有时，这需要在比分词器更高的层级上操作，因为分词器可能会将某些文本拆分成多个词元。例如，文本\
  \ `$65.70` 可能被拆分成四个词元：`$`、`65`、`.` 和 `70`，而我们可能希望将其视为一个整体。有时，你甚至需要在分词之前就进行这种处理。\n\
  \n### 词性标注（Part-of-Speech Tagging）\n\n词性标注（POS tagging）是识别文本中每个单词的语法词性的过程。句子中的每个单词都承担着特定的语法功能。因此，词性标注通常需要知道句子的断点在哪里。词性标注会返回传递给它的每个词元的词性。请参见表\
  \ 17-1，了解几个关键词性标注的示例。请注意，同一个单词可以是不同的词性，这取决于它在句子中的位置。\n\n#### 表 17-1 常见的词性标注\n\n\
  | 词性 | 作用 | 示例 |\n| --- | --- | --- |\n| 名词 | 表示名称的词 | apple, book, training, beers,\
  \ David |\n| 代词 | 名词的一般性替代 | I, you, me, it, they, her |\n| 动词 | 表示动作的词 | crash,\
  \ running, races, read |\n| 形容词 | 修饰名词 | green, funny, tiny, expensive |\n| 副词 |\
  \ 修饰动词 | often, happily, very, slowly, never |\n| 介词 | 定义与名词的关系 | by, of, in, across,\
  \ until |\n| 连词 | 连接两个想法或从句 | and, but, or, although, where |\n\n词性标注可能非常有价值，具体取决于你在做什么。例如，如果你正在查看一家视频游戏公司的客户投诉，想知道人们抱怨得最多的东西，你可能只需要关注被标注为名词的词元。但如果你想知道人们对特定游戏的看法，你可能希望看看他们在谈论这些游戏时使用了哪些形容词。\n\
  \n\n\n# 词干提取与词形还原\n\n许多单词本质上都是同一基础词的不同形式。添加前缀、后缀以及一些拼写变化，都属于形态变化，这些变化可以表示动词时态的变化（例如，从`run`变为`ran`以表示从现在时变为过去时，或从`run`变为`running`以表示现在进行时），也可以表示单词的复数形式（如`book`变为`books`，或`goose`变为`geese`）。这些规则中的大多数都是相当可预测的，但并非万无一失。以单词`running`为例，它可以是动词（如“我正从洪水中*奔跑*”），也可以是名词（如“实验的*进行*很顺利”）。这时，通过分析句子来确定词性就显得很有价值了。\n\
  \n将单词分解为基础形式有两种略有不同的方法。*词干提取*主要是通过切除后缀来实现，比如去掉单词末尾的`-ing`和`-ed`，从而得到基础形式。这个基础形式，称为*词干*，是一个共同的概念基础，但其本身不一定是一个有效的单词。例如，我们可以将`bluffing`词干提取为`bluff`。但是，许多词干提取器会将`running`提取为`runn`，这显然不是一个真实存在的单词。此外，最常见的词干提取器也会犯一些严重错误，比如将`nothing`变成`noth`。它们也无法处理像`to\
  \ be`这样的不规则动词，因为词干提取不会将`is`、`was`、`are`和`be`这些形式变成同一个词。\n\n*词形还原*则是将不同形式的单词处理并返回其*原形*（*lemma*）的过程，原形是一个在语言学上有效的单词。它通常被认为更好，因为其基础形式是真实的单词。`Running`、`runs`和`ran`都会返回`run`。\n\
  \n虽然词形还原通常被认为更优，但它实现起来可能更困难，并且通常计算成本较高，而词干提取器则更简单、更快。如同本章其他所有内容一样，选择哪种方法取决于你的具体上下文。无论你选择哪一种，市面上都有多种词干提取器和词形还原器供你选择。以词云（一种最流行的\
  \ NLP 任务）为例。它通过按单词在数据集中出现的频率比例来调整单词大小，从而表示词频。请参考图 17-1，对比进行了一些归一化处理（本例中，是去除了复数单词末尾的`s`）前后的词云效果。\n\
  \n![一个包含两个面板的词云图。左侧面板突出显示了“text”、“language”、“speech”、“words”和“NLP”等单词，它们以不同的大小和颜色呈现，表示频率和重要性。右侧面板显示了类似的单词，包括“word”、“text”、“speech”、“language”和“NLP”，同样以不同的大小和颜色呈现。两个面板都强调了与语言处理和数据相关的主题。](img/628533_1_En_17_Fig1_HTML.jpg)\n\
  \n**图 17-1** 处理复数前后的两个词云对比\n\n左侧的词云包含一些“重复词”，因为它将`word`和`words`视为不同的词。在左侧词云中出现的其他成对词还有`language`和`languages`、`system`和`systems`。在左侧词云中，`words`和`word`都比`text`和`speech`小，但仍然很大。但在右侧词云中，它们被合并统计为`word`，并且成为了该词云中最常见的词。\n\
  \n## 常见的自然语言处理表示与任务\n\n上述所有预处理步骤都有助于将文本转化为可输入机器学习算法以完成各种任务的数据。在本节中，我将介绍人们可以利用自然语言处理完成的许多不同任务。但首先，简单提一下通用工具。大型语言模型已经彻底变革了自然语言处理。在此之前，人们使用多种技术来处理文本数据并完成各种任务。如今，由于种种原因，大型语言模型并非总是被使用，许多从事自然语言处理工作的人仍然会用到大量的“传统”技术，因为它们依然极其有用，有时甚至是特定领域的唯一选择——而且它们所需计算资源远少于大型语言模型。我将在下面专门用一个部分详细讨论大型语言模型，但请记住，**大型语言模型**是在海量数据上训练出来的语言模型。它们可用于多种目的，包括生成新的“原创”语言。\n\
  \n### 量化与表征单词和短语\n\n在自然语言处理中，有很多表示语言的方法，但一些最有用的技术涉及如何有意义地表示单词或短短语。我首先要介绍的是**词嵌入**，这是一类将单词或文档以有意义的方式表示为数字的方法。最基本的方法是**词袋模型**，它会获取文档中的所有单词，并追踪每个独立的单词及其出现的次数（频率），但忽略单词的顺序。这有助于我们理解文档的主题。\n\
  \n**词频-逆文档频率** 是另一种词嵌入方法，它也计算文档内的词频。它将单个文档的词频与所有文档中单词的频率关联起来。它有助于识别那些能将不同文档区分开来的词汇。如果你的数据库是有关电子游戏评论的，像`gameplay`或`world`这样的词可能信息量不大，因为它们会出现在许多文档中；但那些只出现在部分文档中的词，比如特定游戏名称或像`bug`、`glitch`这类词，出现频率较低，在识别特定文档时会很有用。\n\
  \n一种较新的词嵌入方法叫做**Word2Vec**，它会扫描一组文档，并将单词量化为多维空间中的向量（线段）。由此，它可以测量两个向量之间的“角度”，以了解它们的相关程度。这是一种很好的技术，可以用来识别那些含义不同但在意义层面仍然存在关联的词，比如`cat`和`kitten`，或者`bag`和`purse`。词嵌入可以帮助我们理解`king`与`queen`之间的关系，类似于`man`与`woman`之间的关系。\n\
  \n**N 元语法**是指连续出现的*n*个单词（或短语）的组群。最常讨论的是二元组（两个连续词）或三元组（三个连续词）。在查找常被提及的事物时，二元组和三元组可能非常有用。有时，单个单词的信息量并不大，而查看更长的序列则能提供更多信息。像`ceiling\
  \ fan`和`cracker jack`这样的术语，其含义都不同于其组成部分的单个词义。在其他情况下，这种词组可以表示其中某个词的非常特定的类型，比如`popcorn\
  \ ceiling`或`soy milk`。因此，分析 N 元语法可以提供单个词语无法提供的信息。然而，大多数二元组和三元组并不那么有意义，要么是因为它们在语料库中出现得过于频繁，要么是出现得过于稀少，以至于没什么帮助。如果你没有移除停用词，一个非常常见的二元组可能会是`in\
  \ the`或`she said`之类的，这对大多数目的来说都无法提供有用信息。\n\n\n\n# 常见自然语言处理任务\n\n上述讨论的单词和语言的不同表示方法可用于多种任务。通常，仅仅统计词频并没有太大价值。一个例外是*词云*，正如你之前所见，它是文档或语料库中单词及其频率的可视化表示。频率越高的词在显示中越大，因此你可以快速了解数据集中最重要的主题。虽然词云通常基于单个词，但你也可以包含其他内容，如二元词组或命名实体（下文将描述）。\n\
  \n最早且相当基础的自然语言处理任务之一是*命名实体识别*，即识别出被“命名”的单词或短语。这些包括人名、公司名、地名以及其他在英语中通常首字母大写的术语。实体也可以是其他内容，如货币金额或特定领域的项目，例如订单号或账号。实体可以预先定义（这是基于规则的系统在特定术语出现时进行识别的必要条件），但如今命名实体识别通常是一项监督学习任务，模型会根据提供的实体进行训练。模型不仅要学会识别提供的实体，还要识别出使其成为命名实体而非普通单词的模式。命名实体识别通常不是最终目标，而是被广泛应用于其他自然语言处理任务中。\n\
  \n*情感分析*是另一项常见的自然语言处理任务，涉及识别文本中的情感（感受）。这通常被分为正面或负面，但也可以包含中性。一个典型的应用是查看客户反馈，识别哪些是负面（投诉）、正面（赞扬）或中性（可能是在询问或提供信息）。这常用于监控品牌声誉和话题热度等。在这两种情况下，也可能用到命名实体识别。一些情感分析基于规则的系统，仅识别具有已知情感的特定词汇，如“expensive”（昂贵）、“broken”（损坏）或“high-quality”（高质量）。但大多数方法利用监督式机器学习。\n\
  \n共指是指一个词指向另一个词的现象，例如当代词指代之前提到的被命名的人。它也可能指隐喻中一个名词指代某种在缺乏上下文时不明确的具体事物。*共指消解*能识别出某个词指向另一个词的情况，比如`she`指代前一句中的单词`Mary`。*实体链接*则涉及识别后一个单词或短语指代的是哪个先前概念。与几乎所有自然语言处理任务一样，执行共指消解有基于规则和机器学习两种方法。监督学习需要所有共指关系都被标注的数据，但也有不依赖标注数据的聚类技术。此外，还有大语言模型等方法。\n\
  \n*词义消歧*（WSD）是在特定上下文中识别单词具体含义的任务。这对于在主流方言中有多重含义的单词很重要，尤其是在非常非正式的语言中更为关键，例如你在社交媒体上看到的内容。这是因为这类语言往往大量依赖俚语和反讽，它们常常以非标准甚至颠覆性的方式使用单词和短语。词义消歧可以通过基于规则和机器学习的方法实现。理想情况下，有一些标注的训练数据用于监督学习，但也可能使用半监督或无监督技术。\n\
  \n*文本分类*是给一段文本应用标签的任务，例如识别文本的主题。我们可能尝试在高中英语作文数据库中标注每篇作文的类型（如记叙文、说明文、议论文、描述文或辩论文）。这与主题建模有关，主题建模有时被用作分类过程中的一个步骤。*主题建模*会识别出能够表征一个或多个文档中不同主题组的关键词或短语。它们之间的主要区别在于，文本分类通常是作为监督任务执行的，而主题建模是无监督的。\n\
  \n另一项已存在一段时间的常见任务是*文本摘要*，它涉及将一段较长的文本缩短而不丢失核心含义。这一领域已被大型语言模型彻底变革。目前遵循几种不同的范式。抽取式摘要已存在一段时间，它提取文本中最有意义的句子并原样使用。有多种方法可以对句子重要性进行评分，然后根据评分决定保留哪些句子。而生成式摘要则是在大型语言模型出现后产生的。它根据原始文本生成新的文本，从而有效地进行摘要。生成式摘要主要通过三种方式生成新文本：句子压缩（使用基于规则的技术或监督学习来缩短长句）、信息融合（融合多个句子的观点）以及信息排序（将生成的文本按正确顺序排列）。\n\
  \n*机器翻译*，即将文本从一种人类语言自动翻译到另一种语言，同样历史悠久，并且也被大型语言模型彻底变革。最早的努力使用基于规则的系统，效果不佳，但随后的统计方法利用了海量文档取得了一定进展。监督学习技术被用于大量的训练数据。大型语言模型是当前的主流，但要做好这项任务仍然极其困难。\n\
  \n问答系统也已存在一段时间，同样被大语言模型彻底改变。最初，*问答系统*相当简单，目标是用自然语言回答简短的问题，这包括识别问题在问什么、找到答案（通常是一项信息检索任务）以及用答案形成文本回复。在监督学习方法被使用之前，这些最初是通过基于规则的系统实现的。它还需要在包含答案的数据上训练系统，因此使用了维基百科和整个网络等资源。如今，该领域的努力在客户服务和技术支持等领域非常有用。\n\
  \n*聊天机器人*是交互式系统，人类可以与之进行“对话”（更具体地说，是与机器人对话）。它们已经存在了一段时间，从最初基于规则的方法，到后来过渡到统计方法，再到如今的大语言模型。这涉及许多独立的组成部分。这与问答系统类似，都需要理解人类说的一段文本，然后制定出合适的回复。聊天机器人的一个目标是让对话“感觉”像真实的交谈，这通常意味着要识别何时轮到聊天机器人回应，并包含一些礼貌用语，例如“谢谢”。\n\
  \n\n\n### 大型语言模型\n\n许多人并不认为大型语言模型（LLM）属于自然语言处理（NLP）的范畴，而更倾向于将其视为一个姊妹领域。我把 LLM 看作一种专门化的\
  \ NLP，只是比标准 NLP 技术要先进得多。大多数 NLP 使用监督学习（但并非全部），而 LLM 则主要采用半监督学习，因为其所需的数据量极为庞大，不可能拥有足够多的标注数据。\n\
  \n关于 LLM 的讨论热度很高，这也不无道理——它们所产出的结果，其令人印象深刻的程度远超 NLP 领域数十年来取得的任何成就。虽然它们在许多方面都很有用，但并非总能达到我们期望的实质性效果。事实上，*幻觉*——即模型凭空捏造并当作事实呈现的信息——非常普遍，以至于在许多应用场景下几乎无法使用。我认为这不会（也不应该）阻止我们使用它们，但它们并非万能解决方案。\n\
  \n使用其他公司训练好的现有 LLM 还存在一些严重的伦理问题。它们用于训练的大量数据都是未经许可使用的。目前有多起诉讼正在进行以解决这一问题。我认为在美国，这些诉讼可能不会导致任何法律上的改变，但在许多其他国家/地区情况可能并非如此。欧盟非常重视数据隐私和安全，我预计最终会出台与\
  \ LLM 相关的法律。根据你的具体用例，使用商用 LLM 可能存在法律风险。或者你可能只是不想使用来源存疑的模型。\n\n对于拥有大量自有文本的大型公司来说，一个选择是训练自己的\
  \ LLM。还有许多其他数据源可以购买或免费获取，以补充公司的数据。但对于大多数中小型公司来说，这并不可行。训练 LLM 已经变得更容易，因为曾经的语言处理黄金标准——循环神经网络——已被前一章提到的新型神经网络架构——变换器（Transformer）所取代。它显著减少了训练时间。（但对大量训练数据的需求依然存在。）\n\
  \n主要的结论是，LLM 可能非常有用，但你在考虑使用它时，应保持谨慎，并思考其后果。\n\n### 关于人类语言的最后思考\n\n我们都知道人类语言有其规则，但所有语言中的首要规则就是：规则总有例外。某些语言形式比其他的更容易处理。学术写作非常正式，大多数作者都严格遵守语言规则——几乎没有人会以新颖的方式使用语言。但推文或短信呢？那完全是另一回事了。社交媒体和所有非正式交流中都充斥着错误和对语言规则的漠视，俚语随处可见，而且我们有各种各样的表情符号，它们对\
  \ X 世代、千禧一代和 Z 世代意味着不同的东西。歧义无处不在——他们是否在使用你不了解的一种方言特有的短语？当有人说喜欢你的帽子时，是讽刺、是阴阳怪气，还是真心实意？许多人类都分辨不清，对于计算机来说这几乎是个无解的问题。再加上母语者与非母语者之间的相互交流，情况就更加棘手了。微妙的讽刺对非母语者来说更难察觉。有时非母语者会将他们母语中的习语以不符合英语习惯的方式翻译成英语，但所有说那种语言的人都能识别并理解。在人类创造的所有系统中，语言一定是最复杂的——也是最强大的。\n\
  \n## 语音处理\n\n如果说 NLP 是研究文本的学科，那么语音处理就是研究口语——即音频——的学科。语音识别旨在分析口语并试图识别其内容，而语音合成则负责生成语音。我将对它们进行进一步的介绍。\n\
  \n语音识别和语音合成通常都涉及文本，无论是作为输入还是输出。因此，根据所采用的方法，大量针对文本进行的 NLP 工作也会在语音处理中进行。最好将语音处理视为文本处理之上的一层。\n\
  \n### 语音识别\n\n*语音识别*接收音频并试图理解其内容，从历史上看，这通常意味着转录——将语音转化为文本。首先，需要明确的是，语音识别和声纹识别并非同一回事，尽管它们都处理语音音频。语音识别识别的是所说的内容——即词语；而*声纹识别*则将声音识别为个体独有的生物特征标识，从而识别说话者。像\
  \ Alexa 这样的常见语音助手两者都会用到——它们利用声纹识别来区分家庭中的不同说话者，以防他们有不同的需求——但助手的主要功能是识别语音。\n\n语音识别的第一步是以某种方式将音频数字化。这些技术源于信号处理，这是电气工程的一个分支。我不打算讨论这部分过程，因为大多数处理语音数据的人所做的工作是在音频被转换为数字表示形式之后进行的。\n\
  \n早期的一些语音识别工作依赖于语音学知识，语音学是关于语音的科学（基本上，是我们如何使用舌头、嘴唇和声带改变从肺部呼出的空气来发出语音，以及不同组合所能产生的特定音素）。但在隐马尔可夫模型出现之前，进展甚微。隐马尔可夫模型是一种概率模型，允许研究人员将各种语言信息及其他信息纳入其模型中。这些模型被使用了数十年，基本上直到\
  \ 21 世纪初神经网络的出现，我们至今仍在使用神经网络。\n\n如今，大多数语音识别都是通过一种名为*长短期记忆网络*（LSTM）的高级神经网络完成的，这是一种循环神经网络，它允许对许多步骤之前发生的事情具有“记忆”能力。一般而言，语音和语言都需要这种更长期的记忆，因为人类在说过一段时间后再次提及先前提到过的事物是非常自然的。LSTM\
  \ 使得语音识别的性能取得了重大进步，现在人们也开始关注变换器（Transformer），这是一种已成功应用于文本处理的神经网络。\n\n大多数语音识别系统包含多个组件，从数字化语音输入本身开始。特征提取和特征向量创建是接下来的两个步骤。提取的具体特征可能有所不同。一旦特征准备就绪，它们就会被送入解码器，解码器进而生成词语输出（文本）。\n\
  \n语音识别用途广泛，包括语音助手、转录、听写、自动客服以及实时语言翻译。正如上文所述，声纹识别通常被集成到系统中。\n\n\n\n语音识别（`speech recognition`）的性能在过去几十年中取得了巨大进步，但通常仍未达到两人交谈的水平。适用于所有人、谈论任何内容的通用语音识别系统仍遥遥无期。我可能不是唯一一个在语音电话系统中反复重复单词“representative”，直到被转接给真人而感到沮丧的人。许多人在使用标准语音识别系统时会遇到困难，包括：语言的非母语使用者、使用系统未训练过的方言的人、有语言障碍的人，以及语速慢于常人的人。大多数英语系统都是基于白人、中产阶级美国男性的语音进行训练的，因此有时即使是使用相同方言的女性也可能难以被系统理解。此外，大多数人类语音都包含可变因素，这些因素取决于语境、情绪、语气以及许多其他会影响发音的因素，例如为了强调而延长元音、加重音节，或者仅通过升调来表示疑问。我们在自然说话时所做的所有“额外”的声音元素统称为**韵律**（`prosody`），处理它非常困难。\n\
  \n## 语音合成\n\n**语音合成**（`speech synthesis`）实际上是语音识别的反向过程，我们从文本出发，生成音频。文本转语音（`Text-to-speech`）系统最为常见，它处理常规文本。还有其他合成器可以处理特定方式编码的文本，例如音标转录或其他专门指令。生成最终音频文件的步骤属于信号处理领域，此处不再赘述其细节。\n\
  \n由于合成器从文本开始处理，它会进行一些与自然语言处理（`NLP`）类似的预处理，包括分词（`tokenization`）和其他分析。这对于正确发音至关重要，因为同一个单词在不同语境下可能有不同的发音（例如“read”）。如果系统试图正确把握语调和其他韵律，这一点尤其重要。\n\
  \n该过程的下一步是确定如何组合声音单元。有不同的实现方法。最基本的是**拼接合成**（`concatenation synthesis`），它本质上是将预先录制的声音单元一个接一个地串起来。这些单元可以是音素（`phonemes`，如“o”或“ee”这样的元音，或“n”、“s”这样的辅音）、音节（`syllables`，包含一个节拍的多个音素，如“tree”、“cup”或“ah”），甚至可以是整个单词、短语或句子，具体取决于用途。\n\
  \n还有其他几种合成方法。另一种生成语音音频的方法称为**共振峰合成**（`formant synthesis`），它通过遵循声学模型的加法合成来生成语音，产生精确但机械的语音。另一种合成类型称为**调音合成**（`articulatory\
  \ synthesis`），它基于对人类口腔和喉咙发音方式的理解来生成音频，因此是一种基于物理的模型。我要提到的另一种类型是**基于深度学习的合成**（`deep\
  \ learning–based synthesis`），它使用在大量录音语音及相关文本和标签上训练的神经网络。\n\n在自然度方面，拼接合成往往表现最佳，但在处理不常见组合时可能会产生瑕疵。共振峰合成通常会产生机器人般的语音，但通常具有很高的可懂度，所需计算资源较少，且生成速度快。基于最后这些原因，这种合成方式被用于视障人士的屏幕阅读器中。调音合成无疑有生成自然语音的潜力，但模拟人类声道并非易事，仍有很大的进步空间。深度学习合成在听起来自然方面能取得相当不错的效果，但当要求它处理缺乏足够训练样本的情况时，仍然存在问题。\n\
  \n\n\n# 要点回顾与下章预告\n\n本章我们讨论了自然语言处理的多个主要方面，其内涵远不止预构建的 LLM。我们探讨了人类语言及其书面和口头形式，随后深入介绍了通过\
  \ NLP 解析语言的各种方法，包括分词、句子分割、去除停用词、处理特殊标记、词性标注，以及词干提取和词形还原。接着，我们讨论了在语言数据解析完毕并可供使用后可以进行的诸多操作，包括词频统计、多词术语分析、命名实体识别、情感分析、指代消解、词义消歧、文本分类、文本摘要、机器翻译、问答系统和聊天机器人。随后我介绍了\
  \ LLM，它近来已成为 NLP 的重要组成部分，尽管这并非 NLP 的全貌。随着对话系统日益普及，语音识别和语音合成都是重要的研究领域。\n\n在下一章中，我们将探讨可视化和演示。在第二章中我们查看描述性统计时已经见过一些可视化内容，但第十八章将进行更深入的探讨。我们将讨论多种可视化类型，以及在何种情况下各类特性表现优劣。然后，我们将超越可视化本身，更广泛地探讨演示技巧。\n\
  \n## 从业者简介：安德拉·辛佩洛\n\n**姓名：** 安德拉·辛佩洛\n\n**职位：** 软件开发者/语言学专家，现任校对/编辑\n\n**当前行业：**\
  \ 问答软件与写作\n\n**从业年限：** 软件/语言学领域 12 年，编辑领域 4 年\n\n**教育背景：**\n\n*   机器学习证书\n*   语音与语言处理理学硕士\n\
  *   现代语言与语言学文学士\n\n*此处观点仅代表安德拉个人，与其现任及历任雇主无关。*\n\n### 背景\n\n安德拉一直热爱语言并对此颇有天赋。她在高中学习了法语和德语，但大学主修政治学。她发现自己并不喜欢这个专业，因此转修语言学便顺理成章。她获得了现代语言与语言学学位，期间还学习了意大利语。毕业后她未能在该领域找到工作，当听说计算机在语言处理方面取得了开创性进展时，她产生了浓厚兴趣。她开始研究这个方向，与朋友讨论这个迷人的新领域，最终发现了一个相关主题的学位课程。同年晚些时候，她开始攻读语音与语言处理理学硕士。尽管大部分内容对她而言是全新的，但她热爱学位课程中学习的一切，尤其是语音学。她至今仍喜欢观察语音的波形图。她的论文是关于提高说话人识别（生物识别中专注于声纹识别而非语音识别的领域）的计算效率。该学位课程涉及大量编程和语言学内容。\n\
  \n## 工作\n\n获得语音与 NLP 学位后，她搬回家乡，开始寻找与语言相关的工作。起初非常艰难，因为家庭责任使她只能在一个都市圈内求职，但她最终在当地一家问答公司找到了一份软件开发工作，专攻语言学领域，这堪称完美。初期工作涉及大量软件开发，同时也包含众多语言学任务，她负责算法及其他\
  \ NLP 相关工作。但公司被收购后，企业文化变得有害，她的工作只剩下修复漏洞，于是她辞职并专注于家庭。随着孩子们长大，她逐渐重返职场，现在是一名自由职业的校对和编辑——依然从事她热爱的语言工作。\n\
  \n### 金句摘要\n\n**工作中最喜欢的部分：** 处理语言并运用自己的专业知识开发产品和完善写作。她也热爱在问答工作中努力提高答案相关性的过程，因为这充满挑战，但找到改进答案的方法时又极富成就感。\n\
  \n**工作中最不喜欢的部分：** 在公司里，政治斗争和有害的工作环境令人沮丧，因为你无法改变。自由职业在这方面更好，但也压力很大，因为你必须不断寻找工作机会。\n\
  \n**最喜欢的项目：** 其中一个最喜欢的项目是在问答公司时，团队专门致力于提高答案的相关性。基本流程是用户提问，系统基于关键词查询知识库寻找答案。安德拉能够深入分析这一过程，通过研究真实的查询和答案来改进它。她识别出其他可用于改进答案的重要方面，包括为任何系统生成的答案制定评分。在另一个很酷的项目中，经过一个通宵编码时灵光一现，她成功找到了一个绝佳的方法来可视化共现词汇，客户对此非常满意，皆大欢喜。\n\
  \n**最常用技能：** 在问答公司工作时，她主要运用编程技能，NLP/语言学知识用得较少（但在必要时很有帮助）。在目前的工作中，她通用的语言专长非常有价值。软技能在任何地方都很重要，自由职业尤其如此。另一个重要技能是时间管理。\n\
  \n**当前主要使用的工具：** 过去使用 `Java`、`JSP`、`JavaScript`、`NLTK`（自然语言工具包）和 `WordNet`。目前使用\
  \ `WordPress`、`Google Docs` 和 `Microsoft Office`。\n\n**NLP 的未来：** 现在技术发展如光速般迅猛，一天比一天令人印象深刻，但也日益令人担忧。安德拉担心人工智能的快速发展速度，以及这对整个社会意味着什么。如今，我们查看任何东西时都必须谨慎，思考其真伪——但大多数人对此毫不在意。我们经常看到名人出面澄清某些照片是假的，但所有人原本都相信那些图像是真的。这令人担忧。\n\
  \n**优秀 NLP 从业者的特质：** 保持求知欲，这将是贯穿职业生涯的持续需求。事物总是在变化和进步。\n\n**给未来 NLP 从业者的建议：** 找工作时不要过于狭窄地限定在一个领域。任何时候同时开放的这类职位数量都有限，你可能需要保持灵活性，在个人最感兴趣的领域之外寻找机会。在你的整个职业生涯中都需要不断学习，所以请放宽眼界去寻找。\n\
  \n*安德拉是一名自由职业编辑和撰稿人，拥有 NLP 和软件开发背景。*\n\n脚注 1 2\n\n# 18. 一种全新的叙事方式：数据可视化与演示\n\n\n\
  \n## 引言\n\n可视化是数据科学的重要组成部分，尽管许多数据科学家并不需要频繁构建大量图表。这取决于具体岗位职责，但每位数据科学家至少偶尔都需要创建一些可视化。数据分析师则会发现自己需要构建许多图表。有些团队设有专职人员，负责根据数据科学家和数据分析师的工作成果搭建仪表板。无论你是否亲手创建可视化，理解如何制作优秀的可视化都至关重要。\n\
  \n可视化往往威力强大，常常能在瞬间让表格和数字需要大量解释才能说明白的事情变得一目了然。在第 2 章中，我提到挑战者号航天飞机工程师所使用的图表未能说服领导层推迟次日发射，而正确的图表本可以做到。你将在下文第一个例子中看到，可视化在呈现拿破仑远征俄国这场灾难时有多么震撼。知道何时创建可视化、创建哪种可视化才能有效传达观点，是一项无比宝贵的技能。\n\
  \n在本章中，我将探讨优秀可视化与演示的构成要素，并涵盖丰富的图表、表格和地图类型。一条提示是：一切都围绕用数据和发现讲述故事。最后，我将介绍 Tableau\
  \ 和 Power BI，这是当今最流行的两种专业可视化工具。\n\n# 现实世界中的数据可视化示例\n\n在本书前面章节中，我举过几个强有力可视化的例子。第一个在第\
  \ 2 章，我展示了一张简单的图表，它本可以更清楚地向决策者揭示低温下挑战者号发射的风险。然而，担心 O 型环在寒冷天气中性能的工程师们分享的图表只讲述了部分故事，并未说服管理层。第二个例子在第\
  \ 5 章，是约翰·斯诺绘制的 1854 年伦敦霍乱死亡地图，这张图帮助他们识别出疾病源头是宽街水泵。一旦封住水泵，疫情便告终结。\n\n现在，我将再讨论两个例子，一个回顾历史，另一个提醒我们可视化的重要性。两者都很棒，因为它们展示了正确可视化能产生多么巨大的影响。第一个是拿破仑向莫斯科进军的示意图，这是一场代价数十万生命的灾难性战役。第二个是著名的\"\
  安斯库姆四重奏\"图解，它强调了超越基础描述性统计的重要意义。\n\n## 示例 1：战争蠢行的视觉记录\n\n尽管拿破仑·波拿巴被认为是最杰出的军事领袖之一，但他远征莫斯科的企图在他返回巴黎后，连他自己都承认是一场毫无意义且彻头彻尾的灾难。这次进军让拿破仑一无所获，却付出了数十万人的生命代价。关于具体数字很难达成一致，但大多数人认同拿破仑最初率领\
  \ 45 万大军，而最终不到 10 万人返回家园。图 18-1 是 1869 年由法国人查尔斯·约瑟夫·米纳尔制作的一幅著名可视化作品，清晰地揭示了这场灾难的惨烈程度，这是单纯数字无法做到的。上方的米色线条代表从法国（左侧）到莫斯科（右侧）的进军路线，随后返回路线以黑色表示。\n\
  \n![](img/628533_1_En_18_Fig1_HTML.jpg)\n\n查尔斯·米纳尔绘制的拿破仑 1812-1813 年俄国战役流程图。该图展示了拿破仑军队在进军和撤离莫斯科时兵力规模的变化，条带宽度代表部队人数。米色条带表示进军，黑色条带表示撤退。图中标注了科夫诺、斯摩棱斯克和莫斯科等关键地点。下方温度图反映了撤退期间面临的严酷条件。该图表结合了地理与统计数据，以传达惊人的部队损失。\n\
  \n**图 18-1**\n\n查尔斯·米纳尔对拿破仑灾难性莫斯科远征的再现。来源：摘自\"File:Minard.png\"，可在[`https://en.wikipedia.org/wiki/File:Minard.png`](https://en.wikipedia.org/wiki/File:Minard.png)获取，属于公共领域\n\
  \n军队于 1812 年初夏进入俄属立陶宛。俄国当时采取焦土撤退政策，因此军队觅食极为困难，甚至在进军早期就有士兵因疾病死亡。疾病从未消失，但他们仍继续向莫斯科挺进。8\
  \ 月发生了一场战斗，拿破仑获胜，但约 9000 名士兵阵亡。9 月，他们在接近莫斯科时再次交战，35000 名法军阵亡，俄方伤亡更重（这被认为是现代战争史上最惨烈的单场战役之一）。拿破仑与约\
  \ 10 万士兵占领了几乎完全空无一人的莫斯科。当地人在第二天焚烧了城市，约四分之三的区域被毁。拿破仑逗留数周，但食物获取困难，饥饿依然是大问题，疾病也持续困扰着他们。最终军队于\
  \ 10 月底开始返乡。现代数据与图表上的数字在此存在差异，但众所周知，在返乡途中，深冬严寒降临在这支衣衫单薄的疲惫之师上，造成了巨大伤亡。饥饿、疾病和极端天气意味着只有极小部分士兵得以返回家园。\n\
  \n这幅可视化作品或许没有在实质上改变任何政策，但它极其清晰地揭示了那场战役的惨状，令人一目了然，远胜于查看表格和更简单的图表。通常，当你想展示某件事时，总存在一个完美的可视化方式，尽管找到它并不总是那么容易。\n\
  \n\n### 示例 2：统计上相同的数据，不同的面貌\n\n描述性统计功能强大，人们长期以来一直用它来理解和描述数据。但是，正如统计学家弗朗西斯·安斯库姆（Francis\
  \ Anscombe）在 20 世纪 70 年代绘制的四个简单却发人深省的图表所展示的那样，仅依赖单一视角是有风险的。他创建了四个不同的数据集，每个数据集都包含两个变量，且所有这些数据集都具有相同的基本统计特征（两个变量的均值与样本方差、两者之间的相关性、线性回归线以及回归的决定系数）。然后，他为每个数据集绘制了散点图，如图\
  \ 18-2 所示。\n\n![](img/628533_1_En_18_Fig2_HTML.jpg)\n\n四面板 X-Y 图表，展示了具有相似线性回归线的不同数据集。每个面板显示一个散点图，包含橙色数据点和代表线性拟合的蓝色线条。左上角的图表绘制了`y_1`对`x_1`的散点图，显示出适度的正相关性。右上角的图表绘制了`y_2`对`x_2`的散点图，数据点呈曲线分布。左下角的图表绘制了`y_3`对`x_3`的散点图，除一个离群点外，大部分点沿直线聚集。右下角的图表绘制了`y_4`对`x_4`的散点图，数据点呈垂直聚集。每个坐标轴都标有相应的变量名称。\n\
  \n**图 18-2**\n\n安斯库姆四重奏：四个图表展示了具有相同统计特性的不同数据集。来源：改编自“Anscombe’s quartet 3.svg”，可在[`https://en.wikipedia.org/wiki/File:Anscombe%27s_quartet_3.svg`](https://en.wikipedia.org/wiki/File:Anscombe%2527s_quartet_3.svg)获取，采用知识共享署名-相同方式共享\
  \ 3.0 未本地化版本许可协议（[`https://en.wikipedia.org/wiki/en:Creative_Commons`](https://en.wikipedia.org/wiki/en:Creative_Commons)）。\n\
  \n这些图表让人立刻看出，这些数据集实际上并不相似，每个数据集都有其独特的特征。左上角的图表是我们所习惯看到的——数据散布开来，呈现出一种我们似乎能感知到的总体线性趋势。也许线性回归确实能告诉我们一些有用的信息，但我们确实需要更多数据才能确定。右上角的图表则清晰地显示了非线性数据，图上绘制的线性回归线看起来非常荒谬。显然，线性回归并非处理这些数据的正确方法。左下角的图表也很有趣，因为数据看起来极具线性，但一个离群点就完全扰乱了全局。很可能，线性回归是一种适用于这些数据的好技术，但在运行回归之前需要剔除那个离群点。但是，我们不应忘记它——需要记住这个数据集存在极端离群点。右下角的图表同样有趣，一个极端离群点也扰乱了图表，使得运行线性回归成为可能。实际上，变量`X`在任何模型中很可能都没什么用，因为它几乎总是同一个值——8。将其转化为一个“是否为\
  \ 8”与“是否非 8”的二值特征可能更有用。\n\n这些图表提醒我们，可视化既可以揭示问题、至关重要，同时也提醒我们，绝不应该对数据采取短视的看法，在没有先了解数据本质的情况下就随意运行相关性分析、线性回归或其他分析。\n\
  \n## 用数据讲故事\n\n在正式展示你的发现之前，通常需要先制作一些可视化图表。但在制作幻灯片来展示你的发现之前，真正需要做的是决定你要向利益相关者讲述什么故事。你绝不应该只是把一堆图表和表格丢进幻灯片里就完事了。叙事在哪里？\n\
  \n有时人们会有点过度，试图将“用数据讲故事”与虚构故事中的叙事类比起来，我认为这没有必要。但是，拥有一个叙事脉络，意味着从一个想法过渡到另一个想法，并沿途触及关键点。通常，你需要依次回答以下这些问题：\n\
  \n1.  我们提出的问题或需要解决的问题是什么？\n2.  我们拥有哪些信息可以帮助我们回答问题/解决问题？\n3.  我们可以进行哪种模型或分析来回答问题/解决问题？\n\
  4.  答案/解决方案是什么？\n5.  我们对该答案/解决方案有多大的信心？\n6.  下一步的行动是什么？\n7.  该解决方案的商业影响是什么？\n\n\
  这些也是你在汇报项目成果时需要回答的问题。从#1 开始，设定初始状态。我们试图解决的问题是什么？永远、永远、永远要回归到商业案例上。有时需要提醒人们他们为什么要听这个演示，特别是当你并非定期与这些人合作时。\n\
  \n在很多情况下，最好解释一下你用来解决问题的材料，如#2 所述。此处细节的详略程度取决于你的听众，但大多数利益相关者会想知道你使用了哪种类型的数据。他们可能想知道这是一个他们已经熟悉的数据源，还是一个他们自己也能使用的数据源。有时，他们还希望根据自己对数据源的了解来判断你的结果的可靠性或可信度。\n\
  \n通常也需要解释你是如何解决问题的，即#3。这时你会谈论技术细节，但要根据你的听众来定位合适的技术深度。你可能只是提到你对数据做了一些清理和修改，然后将其输入到一个机器学习模型中；或者你可以更具体地告诉他们使用了哪些模型，甚至展示模型结果（如线性回归公式或训练好的决策树）。请记住，我们所做的工作中有很大一部分是“隐性”的，因此这里的要点之一就是传达出我们做了大量工作，即使你并未提供太多细节。这一切都取决于如何迎合你的听众。\n\
  \n接下来，你将实际展示解决方案本身，即#4。解释你发现了什么，为什么它很重要，做出了哪些假设，信心水平如何，以及是否存在需要注意的任何弱点或局限性（这是#5\
  \ 涉及的内容）。如果你要提出建议，也应在此处给出。这通常是演示文稿的主体部分，因为这正是项目的全部目的。此处的具体内容也取决于你正在进行的分析类型。描述性分析主要是图表和摘要，诊断性分析包括你发现的解释，预测性分析包括你的预测，处方性分析包括你的建议。\n\
  \n最后，通常会明确下一步行动，如#6 所述。如果项目仍在进行中，这些将是你下一步计划要做的工作（或供讨论的选项）。如果项目已经结束，这可能只涉及维护，或者可能真的没有更多工作可做。列出一些未来项目中可能做的事情仍然是常规做法。\n\
  \n如果项目完成至今已有足够的时间，那么#7 就是你谈论实际影响的地方。在商业领域，通常最好能以某种方式量化这种影响。\n\n\n\n\n以故事形式讲述的要点之一不仅是条理清晰、逻辑严谨，故事还能在情感上打动人心，而单纯陈述事实通常无法做到这一点。当你向合适的利益相关者讲述你的解决方案时，甚至可以谈谈摸索过程中的挣扎以及最终如何取得胜利。这在向高层领导做简短汇报时可能并不合适，但那些定期与你开会的利益相关者或许会欣赏这种讲述方式。\n\
  \n请注意，可视化内容可能出现在这一过程的任何步骤中，尽管第 4 步应该包含最多。但切记不要用接二连三的可视化内容让听众应接不暇。利益相关者寻求的是帮助，以做出更好的决策。作为数据科学家，我们的职责是找到能够帮助他们的信息。显然，这可以有多种形式。在一个更侧重于理解过去和现在所发生事情的项目中（这将涉及数据分析类工作，可能还需要一些出色的可视化图表），沉浸于`EDA`的数据科学家很容易偏离最终目标。探索性工作固然重要，但我们真正想做的是创建*解释性*可视化图表，这些图表不仅能告诉我们“是什么”，还能揭示带有原因——即可被理解的解释——的联系。我们需要通过`EDA`来理解数据，找出最佳方式，发现那些能够向利益相关者解释有价值信息的有趣内容。\n\
  \n接下来，我将讨论你在叙事过程中可以制作的各种可视化图表，以及如何使它们发挥最大效用。\n\n## 可视化图表的类型及其优秀之处\n\n在第 2 章介绍描述性统计时，我已经讨论了几种基础但可靠的可视化图表。我将重温其中一些图表，并探讨它们在此处为何有效。我们还会研究图表的许多变体以及一些不常见的类型。但首先，我将讨论一些更普遍意义上的、能让图表变好的因素，以及一些需要避免的事项。\n\
  \n### 什么样的可视化是好的？\n\n你需要知道你的可视化图表是为谁而作，以及你的利益相关者为何需要它。这意味着要了解你的受众，并尽可能做到具体。如果你想向你的数据科学家同事和高层领导展示同样的基本信息，很可能应该准备两种不同且独立的可视化图表。他们需要这个可视化图表的原因，显然与你试图向他们展示的内容相关。通常，当你制作可视化图表时，是为了帮助人们更好地理解某事，或帮助他们做出决策。\n\
  \n制作可视化图表时，另一个追求的目标是简洁——任何可视化图表都应在传达所需信息的前提下，尽可能做到简单。举一个大的禁忌为例，人们常常忍不住通过制作 3D 效果来“锦上添花”。往好了说，这是不必要的干扰；往坏了说，它会扭曲你所绘制的实际数值。要看出这一点，请看一下图\
  \ 18-3，该图显示了同一个饼图的 2D 和 3D 版本，它们被平均分成三份（每个扇区包含相同数量的项目）。在左侧的 2D 版本图表中，比例一目了然，很明显它们各占饼图的三分之一。但在右侧的\
  \ 3D 版本图表中，离我们最近的扇区看起来比另外两个更大。我发现，即使知道它们大小相同（而且我自认为数学头脑不错，空间感知能力良好），它*感觉上*还是更大。想象一下，如果这些扇区大小不一——那么大多数人的大脑基本上不可能在不付出巨大努力的情况下做出正确调整来准确解读。如果理解一个图表需要费很大力气，那它就不是一个好的图表。\n\
  \n![两个饼图并排显示，每个都标注为“等比例”。左侧图表是标准的 2D 饼图，分成三个相等的扇区，每个扇区采用不同深浅的蓝色。右侧图表是 3D 饼图，也分成三个相等的扇区，使用相似的蓝色调，呈现出三维立体外观。两个图表在视觉上都表示了扇区之间的等量分布。](img/628533_1_En_18_Fig3_HTML.jpg)\
  \  \n图 18-3  \n一个由三个等尺寸扇区组成的饼图：2D 版本和 3D 版本\n\n\n\n\n### 散点图\n\n图 18-4 展示了一个最基础图表——散点图的示例，我们在第\
  \ 2 章中已经见过。它只是简单地将两个变量相互对应绘制，一个在 X 轴上，另一个在 Y 轴上。这是一种快速查看两个特征如何相互关联的方式——一个变量增大时另一个也增大，还是相反？或者根本不存在关联？散点图在商业中实际应用不多，但在科学领域更为常见，数据科学家在进行探索性数据分析（EDA）时也经常使用。\n\
  \n![](img/628533_1_En_18_Fig4_HTML.jpg)\n\n散点图，展示分布在网格上的一系列数据点。数据点呈现出正相关趋势，顶部标题为“散点图”。该图用于可视化两个变量之间的关系。\n\
  \n图 18-4：一个散点图\n\n在图 18-4 中，似乎呈现出正相关关系，两个变量同步增长。散点图也能很好地展示当变量之间没有明确关联的情况。创建散点图时，注意比例尺很重要——虽然设置任何图表的坐标轴都可能需要一些技巧，但通常最好尽量让两个坐标轴的刻度比例与数据的整体范围相匹配。此外，只展示部分数据可能会产生误导。请查看图\
  \ 18-5 中散点图的示例，当排除部分数据时，其呈现的形态可能会完全不同。\n\n![](img/628533_1_En_18_Fig5_HTML.jpg)\n\
  \n散点图，包含两个子图，标题为“游戏 A 的游玩次数按年龄分布”。左侧子图显示年龄在 10.5 至 13.5 岁之间的数据点，总游玩次数在 150 至 330\
  \ 之间。右侧子图显示年龄在 0 至 50 岁之间的数据，总游玩次数在 0 至 350 之间。两张图都展示了年龄与总游玩次数之间的关系，但数据点分布不同。\n\n\
  图 18-5：两个不同坐标轴的散点图\n\n在左侧图表中，年龄看起来分布相当分散，总游玩次数也高低不一。但是，当我们仅仅加入五个关于年长玩家的数据点后，首先，很明显第一个图表中的玩家年龄相对于人类的年龄范围来说较低。同样地，我们也能看到较年轻玩家的游玩次数远高于年长玩家。\n\
  \n我在第 2 章中讨论过散点图的两种变体，可以结合使用，使得在同一个图表上最多能绘制四个特征。这是通过为数据点添加颜色和/或大小来实现的。对于不同大小的数据点，我们通常称之为气泡图。\n\
  \n颜色既可以用于分类变量，也可以用于数值变量。对于分类变量，该变量的每个取值都对应一个图例中列出的离散颜色。对于连续变量，则使用单色渐变（也可以使用多种颜色渐变，但单色从浅到深更常见）。图\
  \ 18-6 显示了一个气泡图，表示了四个变量：年龄（X 轴）、总游玩次数（Y 轴）、性别（颜色）和评分（气泡大小）。为了清晰起见，气泡采用了半透明效果。\n\n\
  ![](img/628533_1_En_18_Fig6_HTML.jpg)\n\n气泡图，标题为“游戏 A 的总游玩次数与评分按年龄和性别分布”。X 轴代表年龄，范围从\
  \ 0 到 50；Y 轴代表总游玩次数，范围从 0 到 350。气泡按性别着色：深蓝色代表女性，浅蓝色代表男性。大多数气泡集中在 10 至 15 岁年龄段，总游玩次数在\
  \ 200 到 300 之间；少数气泡分散在 45 岁左右，总游玩次数较低。\n\n图 18-6：使用颜色和大小的四特征气泡图\n\n散点图具有一定的灵活性，但请记住，许多商务人士对此并不熟悉，因此请务必留意你的利益相关者是否接受这类图表，以此判断它们是否适合你的受众。\n\
  \n举个例子，我们可以回顾一下第 2 章中的图表，图 2-8，此处作为图 18-7 再次引用。它展示了儿童身高和性别的散点图。这是一个非常简单的图表，仅显示了年龄、身高和性别三个特征。通过观察，我们可以看到身高随着年龄的增长而呈现上升趋势。从现有数据来看，女孩和男孩的身高在\
  \ 14 岁左右之前差异不大，而 14 岁之后女孩的身高趋于平稳，但男孩的身高则继续增长，超过女孩。\n\n![](img/628533_1_En_18_Fig7_HTML.jpg)\n\
  \n散点图，标题为“身高按年龄和性别分布”，展示了男孩和女孩年龄与身高的关系。X 轴代表年龄（以年为单位），范围从 4 到 20；Y 轴代表身高（以英寸为单位），范围从\
  \ 40 到 75。蓝点代表男孩，橙点代表女孩。数据点呈现整体上升趋势，表明无论性别，身高都随年龄增长而增加。右下角的图例标识了男孩和女孩对应的颜色。\n\n\
  图 18-7：儿童身高与性别\n\n虽然这可能是潜在有用的信息，但它并没有解释太多——我们早就知道男孩进入青少年时期后身高会超过女孩。此外，我们还可以发现，这个数据集中\
  \ 11 岁以下的女孩似乎比男孩少。如果我们有更多女孩的数据，是否可能会注意到更年幼孩子之间的身高差异？这很难说。尽管这张图本身没有错误，但也没有什么特别吸引人的地方。除非利益相关者有特别要求，否则这张图可能不应该出现在发给他们的报告中。\n\
  \n\n\n### 柱状图与条形图\n\n另一类主要展示单个变量（在最基础形式下）的重要图表是条形图。条形图是最直观的图表之一，既可以是水平方向，也可以是垂直方向（通常称为柱状图）。你可以在图\
  \ 18-8 中看到这两种不同的版本，它们显示了相同的数据。\n\n![](img/628533_1_En_18_Fig8_HTML.jpg)\n\n两个条形图并排显示。左侧图表是高度变化的垂直柱状图，标注为“柱状图”。右侧图表是长度不同的水平条形图，标注为“水平条形图”。两个图表都使用蓝色条形来代表数据值。\n\
  \n**图 18-8**  \n垂直与水平条形图\n\n你所绘制的数据通常能帮助你决定是采用垂直还是水平方向。通常这无关紧要，但在一种情况下你可能会选择水平方向，那就是当你的标签特别长时。对比图\
  \ 18-9 中的两个图表。通过旋转图表以容纳左侧过长的 X 轴标签，便得到了右侧更易读的图表。\n\n![](img/628533_1_En_18_Fig9_HTML.jpg)\n\
  \n两个标题为“游戏总数”的条形图展示了不同游戏类型的数量。左侧图表是垂直的，显示的类型包括动作冒险、格斗和角色扮演游戏，其中角色扮演游戏数量最高。右侧图表是水平的，列出的类型包括策略、模拟和赛车，其中角色扮演游戏和即时战略游戏数量最高。两个图表都突出了不同类型中游戏数量的分布情况。\n\
  \n**图 18-9**  \n按类型划分的视频游戏总数两种视图\n\n调整这些基础条形图有多种方法，但需要注意一些最佳实践。通常认为，条形图的 Y 轴最好始终从\
  \ 0 开始，否则可能会产生误导，让人难以快速理解条形之间的差异。此外，你可能见过一些图表中条形带有断点（通常是一条锯齿线），表示刻度发生了跳跃——这通常不被推荐，因为它破坏了视觉理解。这通常发生在某个条形远大于其他条形（即异常值）时，但通常更好的做法是保留较长的条形，并为其他条形添加标签，以便看清数值。你也可以另做一个图表，只显示非异常值的条形，这样更容易区分它们。\n\
  \n如果不在条形图中显示 Y 轴标签，而是将数值放在条形顶部，也是可行的。如果条形不多，这种方法尤其有效。例如，参见图 18-10，这是相同数据的两种视图。两者差异不大，但只有三个柱状图时，右侧的图表读起来更快。\n\
  \n![](img/628533_1_En_18_Fig10_HTML.jpg)\n\n两个标题为“平均缺勤天数”的条形图比较了三组（女生、男生和未知）的平均缺勤天数。左侧图表显示女生约\
  \ 12 天，男生约 13 天，未知约 14 天。右侧图表明确指出女生 11 天，男生 13 天，未知 14 天。\n\n**图 18-10**  \n一个小型柱状图的两种视图，展示了某个项目的学生缺勤情况\n\
  \n我们在第 2 章中讨论过其他类型的条形图。我们可以简单地分别显示多个分组，也可以将它们堆叠起来。选择哪种视图更合适取决于所展示的内容。我们将从观察不同分组的多个条形开始。假设我们使用在图\
  \ 18-10 中看到的相同基础数据，即按性别分列的学生缺勤情况。如果我们增加一个按年份的细分，就有几种不同的方式来查看这些数据。请参见图 18-11 了解其中两种最基本的方式。\n\
  \n![](img/628533_1_En_18_Fig11_HTML.jpg)\n\n比较按性别和年份分列的平均缺勤天数的条形图。左侧图表显示了 2020 年至\
  \ 2023 年女生、男生和未知类别的数据。右侧图表显示了相同年份的数据，但按性别类别分组：女生、男生和未知。两个图表都突出了不同年份和性别之间缺勤天数的变化。\n\
  \n**图 18-11**  \n按性别和年份查看多年缺勤数据的两种方式\n\n请注意，我们将分组数据聚类在一起。我们的数据同时按性别和年份进行了细分。在左侧图表中，我们将三种性别并排放置，并分别查看每年的情况。右侧图表的做法相反，将年份并排放置，每种性别分开显示。两个图表都相当容易看出缺勤率总体随时间下降的趋势，但通过右侧图表来理解每种性别自身的变化趋势要容易得多。\n\
  \n另一种常见的视图是堆积条形图，它将多个组包含在同一个条形中，这样我们既能看清各组的数量，又能立即看到总量。参见图 18-12 了解基本堆积柱状图的示例。两个不同的组被加在一起，我们可以看出每个组代表的数量以及总体总数。\n\
  \n![](img/628533_1_En_18_Fig12_HTML.jpg)\n\n堆积柱状图显示多个垂直条形，每个条形被分成两个深浅不同的蓝色段。图表标题为“堆积柱状图”。这些条形代表跨类别的比较数据，其中较浅的蓝色段堆叠在较深的蓝色段之上。\n\
  \n**图 18-12**  \n堆积柱状图\n\n在我们的例子中，我们可以查看图 18-11 中两个图表的堆积版本。请参见图 18-13 了解图 18-11\
  \ 中右侧图表的堆积版本。这清楚地表明男生的缺勤总数最多，但很难对每个单独的年份得出更多结论。折线图通常更自然地适合展示随时间的变化。\n\n![](img/628533_1_En_18_Fig13_HTML.jpg)\n\
  \n标题为“按性别和年份分列的平均缺勤天数”的堆积条形图。它展示了 2020 年至 2023 年女生、男生和未知类别的数据。每个条形被分成代表年份的四段，使用深浅不同的蓝色。Y\
  \ 轴范围从 0 到 70 天。图例指示了每个年份的颜色：2020 年（最深的蓝色）、2021 年、2022 年和 2023 年（最浅的蓝色）。\n\n**图\
  \ 18-13**  \n一个按年份和性别分列的平均缺勤天数堆积条形图\n\n有一种更好的方式来利用这个想法，使得观察内部各组的变化更容易。图 18-14 展示了一种视图，其中每个内部组都有自己的条形，从而更容易观察每个组内的变化。这被称为“小多组图”。\n\
  \n![](img/628533_1_En_18_Fig14_HTML.jpg)\n\n条形图显示了 2020 年至 2023 年的数据以及一个总计列。每年都有三个类别：未知、男生和女生，由深浅不同的蓝色水平条形表示。该图表展示了这些类别在历年中的分布情况，其中总计列汇总了数据。\n\
  \n\n\n### 图 18-14\n\n一组小型多线图，展示了堆叠柱状图的替代方案，便于观察各组间的趋势\n\n当你计划使用堆叠柱状图时，需要谨慎确保数据适合这种视图——要确认将数值相加是有意义的。图\
  \ 18-15 展示了一个不应堆叠的数据示例。图 18-15 左侧的图表显示了我们在图 18-11 右侧图表中看到的数据，但将其修改为展示缺勤天数百分比而非总数。图\
  \ 18-15 右侧的图表是一个无效的堆叠柱状图——以这种方式添加百分比是没有意义的。\n\n![](img/628533_1_En_18_Fig15_HTML.jpg)\n\
  \n柱状图展示了“按性别和年份划分的平均缺勤天数百分比”。左侧图表显示了 2020 年至 2023 年女生、男生和未知类别的数据，百分比范围从 0%到 16%。右侧图表标记为“[无效]”，展示了相同类别和年份的堆叠柱状图，百分比高达\
  \ 60%。每年用不同深浅的蓝色表示。\n\n### 图 18-15\n\n一个多组柱状图和一个无效的堆叠柱状图\n\n另一种值得一提的柱状图是 100%堆叠柱状图。它与堆叠柱状图相同，但每个数值不是以原始数字表示，而是以该点总和的百分比表示。图\
  \ 18-16 展示了几张与图 18-13 相似的图表，我们可以从中看到缺勤的原始计数而非平均值。\n\n![](img/628533_1_En_18_Fig16_HTML.jpg)\n\
  \n柱状图展示了 2020 年至 2023 年按性别和年份划分的总缺勤天数。左侧图表显示绝对数值，右侧图表显示比例。类别包括女生、男生和未知，用不同深浅的蓝色表示。两张图表均显示了逐年趋势，x\
  \ 轴标记年份，y 轴标记天数或百分比。\n\n### 图 18-16\n\n两张图表分别展示了按性别和年份划分的缺勤天数原始总数和比例天数\n\n左侧图表仅是按年份和性别分解的原始数值。该组中有\
  \ 31 名女生、27 名男生和 2 名未知性别者。有趣的是，尽管女生人数更多，但男生的缺勤天数却更多。通过观察平均值可以更清楚地看到这一点。但有时我们只想查看总数。右侧图表显示了相同的数据，但原始值被转换为百分比，因此每列展示的是女生、男生和未知性别学生缺勤天数占所有缺勤天数的比例。\n\
  \n柱状图和条形图还有很多变体，因为它们非常灵活。如果这些都不适用，你可以在线深入探索。你也可以在 `Excel` 或 `Google Sheets` 等快速程序中使用一些数据来尝试所有不同的变体。此外，还可以组合不同的图表，例如在条形图上添加一条代表平均值或目标等重要数值的折线。\n\
  \n## 折线图及相关图表\n\n标准折线图广为人知，但有一些修改方法以及一些相关的图表可能非常有用。本节我将讨论折线图、面积图和斜率图。\n\n# 折线图\n\
  \n折线图是展示随时间变化的非常有效的方式。只要你不试图在一张图表上放置太多线条或进行过于复杂的操作，它们就直观且易于理解。X 轴通常是时间，且需要间距一致（你不能在同一张图表中先按年显示，然后突然切换到按月显示）。线条不必都从同一时间点开始或结束。一个经验法则是，在一张图表上放置超过四到五条需要清晰识别的线条可能会变得难以处理。图\
  \ 18-17 展示了几张典型的折线图，左侧有一条线，右侧有两条线。\n\n![](img/628533_1_En_18_Fig17_HTML.jpg)\n\n\
  两张并排的图表：左侧图表标记为“折线图”，显示了一条呈下降趋势的单一折线。右侧图表标记为“多折线图”，包含两条重叠的折线，一条深蓝色，一条浅蓝色，显示出不同的趋势。两张图表都有水平网格线作为参考。\n\
  \n#### 图 18-17\n\n单一折线图与多折线图\n\n有时，即使柱状图和折线图都可行，折线图也可能比柱状图更直观。回顾图 18-11 中的左侧图表。我在图\
  \ 18-18 中将其重新制作为折线图。\n\n![](img/628533_1_En_18_Fig18_HTML.jpg)\n\n折线图标题为“按性别和年份划分的平均缺勤天数”，展示了\
  \ 2020 年至 2023 年的数据。三条折线代表不同组别：女生、男生和未知。图表显示，所有组别的平均缺勤天数整体呈下降趋势。2020 年，女生和男生均从约\
  \ 16 天开始，男生下降幅度更大，到 2022 年降至约 10 天，之后略有增加。未知组保持相对稳定，随时间略有下降。\n\n#### 图 18-18\n\n\
  按性别和年份查看多年缺勤情况的另一种方式\n\n你常会听说，折线图上的线条不应超过几条。这是因为当线条过多时，尤其是线条相互重叠时，很难追踪每条线。但具体效果取决于你绘制的内容，并且有一些方法可以将多张图表提取出来以达到相同的效果。例如，如果你绘制的线条中有一两条在某种程度上比其他线条更重要，你可以绘制所有线条，但让更重要的线条更加突出。例如，见图\
  \ 18-19，该图显示了夏令营中每个孩子每天获胜的游戏总数，以及他们被分成的两个队伍的平均值。\n\n![](img/628533_1_En_18_Fig19_HTML.jpg)\n\
  \n折线图标题为“营员获胜次数”，展示了营员在 16 天营地活动中的表现。x 轴代表营地天数，y 轴代表营员数量。两条主要线条被突出显示：一条紫色虚线代表 A\
  \ 队平均值，一条深蓝色虚线代表 B 队平均值。背景中的众多浅蓝色线条代表单个营员的表现。A 队和 B 队平均值线条在营地活动期间显示出波动趋势。\n\n####\
  \ 图 18-19\n\n一张包含十二条线条的图表，其中两条更为突出\n\n营员线条颜色较浅且相当细，因此不显眼，但我们仍然可以看到孩子们的不同线条。两条平均值线条更粗、更醒目，并使用深色虚线，因此很容易被看作图表中最重要的线条。\n\
  \n如果我们想查看每个营员的线条，也可以将每条线单独提取出来。有关示例，见图 18-20。\n\n![](img/628533_1_En_18_Fig20_HTML.jpg)\n\
  \n\n\n# 折线图\n\n显示十名露营者（标记为露营者 1 至露营者 10）的数据折线图。每张图展示了在 x 轴标记为 1 至 15 的时期内数值的波动，y\
  \ 轴的数值范围从 0 到 20。这些图说明了每位露营者的不同趋势和模式。\n\n**图 18-20**\n\n每位露营者单独一张折线图，而非全部合并在同一张图上\n\
  \n像这样分解图表时，必须确保所有 y 轴和 x 轴完全相同。这通常需要手动调整您所使用的工具。如果愿意，我们也可以在此处包含平均值，但假设我们关注的是每位露营者个体。\n\
  \n折线图的一个变体是添加置信区间。如果我们使用当前这批露营者来估算所有年份所有露营者的平均获胜次数，我们将生成一个置信区间。其在图表上的呈现方式可参见图 18-21。\n\
  \n![](img/628533_1_En_18_Fig21_HTML.jpg)\n\n标题为“估计平均获胜次数与置信区间”的折线图。x 轴范围从 1 到 16，y\
  \ 轴范围从 0 到 12。图表显示了一条代表估计平均获胜次数的中央深色线条，周围较浅的线条表示置信区间。数据显示了波动，有峰值和低谷，最后急剧上升。\n\n\
  **图 18-21**\n\n显示平均获胜次数置信区间的折线图\n\n这是一个相当直观且易于解释的图表。有时，线条与其上下置信区间之间的区域会被着色，但这并非必需。通常，您需要确保主线条与置信区间线条区分开来。通常，主线条会更粗更醒目，如图\
  \ 18-21 所示。\n\n在第 2 章中，我谈到了具有双 y 轴的折线图。这意味着图表中至少有一条线遵循左侧的 y 轴，而至少另一条线则遵循右侧一个独立且不同的\
  \ y 轴。通常不建议在向利益相关者展示的图表中使用这种设计，尽管它在探索性数据分析（EDA）中可能有用。原因是这种图表可能令人困惑且难以阅读。它们需要观看者停下来思考，而我们真正希望观看者能够快速理解。泰勒·维根（Tyler\
  \ Vigen）那个关于荒谬相关性的搞笑网站^((47))，我之前提到过，它展示了多少明显不相关的事物可以显得“相关”，几乎总是依赖于不同的 y 轴。这远不如单\
  \ y 轴那样直观。\n\n## 面积图\n\n另一种与折线图相似的图表是面积图。面积图就是一条折线图，其线条下方的区域一直着色到 x 轴。主要类型的示例，即简单面积图和堆叠面积图，请参见图\
  \ 18-22。\n\n![](img/628533_1_En_18_Fig22_HTML.jpg)\n\n并排显示了两张面积图。左侧图表标记为“面积图”，显示代表数据随时间趋势的重叠彩色区域。右侧图表标记为“堆叠面积图”，显示带有堆叠彩色区域的累积数据。两张图表均使用蓝色色调区分数据段。\n\
  \n**图 18-22**\n\n*面积图：左侧允许重叠，右侧为堆叠*\n\n左侧图表显示了重叠区域，这是通过对每个系列使用透明度来实现的。重叠区域是一种不同的颜色，因此您仍然可以识别出两个不同的系列。如果图表上有两个以上的系列，这种类型的图表将难以阅读，因此面积图最常见的变体是堆叠面积图，我们可以在图\
  \ 18-22 的右侧看到。这与堆叠柱状图类似，每个点的数值是该点所有系列的总和。\n\n请注意，尽管右侧图表读起来稍容易一些，但我们添加的线条越多，就越难真正理解数值。最容易理解的是最底部的系列，因为它位于\
  \ x 轴上。正因如此，通常将折线图的值总和设为 100%，这样每个值就稍微更容易理解一些。比较图 18-23 中的两张图，左侧是简单的堆叠图，右侧是每天总和为\
  \ 100%的图表。\n\n![](img/628533_1_En_18_Fig23_HTML.jpg)\n\n两张题为“露营者获胜次数”的面积图显示了 16\
  \ 天露营期间的数据。左侧图表显示了每位露营者的获胜次数，y 轴标记为“露营者编号”，范围从 0 到 120。右侧图表以百分比形式呈现相同数据，y 轴标记从 0%到\
  \ 100%。两张图表均使用不同的蓝色色调代表十名露营者，顶部有图例指示每位露营者的颜色。两张图表的 x 轴均标记为“露营天数”。这些图说明了露营者获胜次数随时间的变化。\n\
  \n**图 18-23**\n\n两张堆叠面积图显示每天每位露营者的获胜次数：左侧为堆叠图，右侧为总和 100%的堆叠图\n\n尽管这些图表不是特别容易阅读，但在图\
  \ 18-23 的左侧图表中，很容易看出有些天的总获胜次数异常高，但在右侧版本中，更容易看出哪些露营者导致了这些情况。\n\n面积图与折线图非常相似，但有时它们可能更具戏剧性或影响力。何时选择一种或另一种，是您将随着时间的推移而培养的技能。\n\
  \n## 斜率图\n\n我将提到的最后一种折线图是斜率图。它用于显示两点的变化，基本上是前后对比。通常，斜率图有多条线，但请参见图 18-24 中的示例，该图显示了两支队伍在夏令营第一天和最后一天的平均获胜次数。\n\
  \n![](img/628533_1_En_18_Fig24_HTML.jpg)\n\n标题为“团队获胜次数”的折线图显示了 A 队和 B 队在 16 天内的获胜百分比。A\
  \ 队从第 1 天的 6.2%开始，到第 16 天增加到 9.2%。B 队从 8.4%开始，在同一时期上升到 10.6%。图表突出了两支队伍的上升趋势。\n\n\
  **图 18-24**\n\n显示夏令营开始和结束时团队平均获胜次数的斜率图\n\n可以立即看出，两支队伍的平均获胜次数从第一天到最后一天都有所增加，但 A 队按比例增加得略多一些。\n\
  \n折线图及其相关图表的多种变体为您提供了众多随时间变化的数据图表选项。当数据非基于时间时，通常不适合使用折线图，因为数据点之间的连接表示连续性，而离散事物之间没有自然的顺序或中间状态。例如，将\
  \ x 轴设为“女孩”、“男孩”和“未知”来制作折线图是没有意义的。\n\n\n\n### 饼图\n\n许多数据可视化专家都看不起饼图，这可以理解，因为它们功能非常有限，并且通常无法像其他更好的方式那样揭示数据的许多信息。此外，众所周知，人们不擅长比较不同的扇区，因此饼图不一定能达成目标。但有时利益相关者想要使用饼图，如果你无法说服他们改用其他图表，那就只能让步制作一个。你应当首先尝试说服利益相关者接受条形图，但这场争论你可能会输。掌握一些知识后，你就能针对特定场景制作出尽可能好的（或者说最不糟糕的？）饼图。请参见图\
  \ 18-25 中的饼图示例。\n\n![](img/628533_1_En_18_Fig25_HTML.jpg)\n\n一个被分成三等份的饼图，每个部分使用不同深浅的蓝色。图表顶部标有“饼图”标签。\n\
  \n**图 18-25**  \n饼图\n\n如上所述，第一条规则是永远不要制作饼图的 3D 版本，因为它会完全扭曲各部分的占比，而占比正是饼图的全部意义所在。\n\
  \n使用饼图最困难的事情之一是比较不同饼图，尽管这是饼图的常见用途。想象一下，阿肯色州的一个夏令营试图查看其在两次不同营销活动前后营员的来源地，这两次活动分别于\
  \ 2019 年和 2022 年针对邻近州开展。他们决定查看每次活动后的次年数据，并与 2015 年进行比较。图 18-26 展示了这一系列图表。\n\n![](img/628533_1_En_18_Fig26_HTML.jpg)\n\
  \n三个饼图比较了 2015 年、2020 年和 2023 年数据在四个州（阿肯色州、路易斯安那州、俄克拉荷马州和得克萨斯州）的分布情况。2015 年，得克萨斯州占比最大，为\
  \ 39%，其次是俄克拉荷马州，占 23%，阿肯色州和路易斯安那州分别占 21% 和 17%。2020 年，得克萨斯州仍以 34% 的比例领先，俄克拉荷马州占\
  \ 24%，阿肯色州和路易斯安那州均占 21%。到 2023 年，得克萨斯州降至 30%，俄克拉荷马州降至 23%，而阿肯色州升至 25%，路易斯安那州升至 22%。\n\
  \n**图 18-26**  \n三个饼图展示了三年间营员来源州的比例变化\n\n这一系列饼图确实能让人相当容易地看出变化。我们肯定能看到阿肯色州的比例随时间推移而缩小，而路易斯安那州和俄克拉荷马州的扇区在扩大。得克萨斯州在三年间变化不大。尽管这是基于时间序列的数据，但饼图比显示相同数据的折线图更简单、更易读。在每个扇区内部添加百分比（甚至原始数值）作为文字标注，会使信息更加清晰。\n\
  \n总之，要谨慎使用饼图，并认真考虑它们是否是最佳选择。另请参阅下文，了解一种名为**矩形树图**的饼图替代方案，它可能效果更好。\n\n### 直方图及其变体\n\
  \n我们在第 2 章中介绍过直方图，因为在探索性数据分析（EDA）阶段经常生成它们。直方图在向利益相关者展示时不太常见，因为它们需要稍微多一些的解释，而且很多人对它们不熟悉。但如果你需要表示某个事物的分布情况，它们就是正确的首选图表。还有一些其他表示分布的方法，这些都将在此处讨论。\n\
  \n#### 直方图\n\n图 18-27 展示了一个直方图的示例。每一列称为一个“箱”，它代表落在该箱定义范围内的值的数量。对于定义箱的数量或箱的大小，并没有严格的规则，尽管有一些基于统计特性的经验法则。通常，你用来生成直方图的工具可以自动确定这些参数，但如果效果不佳，你可以自行搜索解决方案。\n\
  \n![](img/628533_1_En_18_Fig27_HTML.jpg)\n\n标题为“直方图”的条形图，展示了不同类别间的频率分布。该图有多个高度不同的垂直条柱，表示每个类别中数据点的频率。最高的条柱位于中心位置，表明该类别频率较高。图表背景有网格线作为参考。\n\
  \n**图 18-27**  \n直方图\n\n直方图有几个值得理解的属性，其中**偏斜**最为重要。图 18-27 中的直方图略微向右偏斜，因为数据更多地集中在左侧。很多事物会因可能值的限制而向一侧或另一侧偏斜。成绩往往向左偏斜，因为更多成绩集中在\
  \ 0-100 分的高分段。房价向右偏斜，因为房价不可能低于 0，但房价可以非常高，尽管价格越高，图表上的“邻居”就越少。在大多数地方，有很多价值 10 万美元的房子，但很少有价值\
  \ 400 万美元的房子。这在与利益相关者沟通时会很有用。\n\n#### 帕累托图\n\n标准直方图有一种变体，称为帕累托图。图 18-28 展示了一个帕累托图，使用了与上面相同的直方图数据，但这次添加了标签。该数据展示了某大学\
  \ 100 名一、二年级学生完成的学分总数。帕累托图在第二 Y 轴（这是少数情况下使用第二轴的好主意）上增加了**累积百分比**。\n\n![](img/628533_1_En_18_Fig28_HTML.jpg)\n\
  \n一个帕累托图，显示了一系列蓝色垂直条柱，代表 x 轴上标记为“箱终点”的数值（范围从 6 到 64）对应的计数。左侧 y 轴标记为“计数”，数值从 0 到\
  \ 25。一条暗蓝色的累积百分比线叠加在条柱之上，对应于右侧标记为“累积 %”的 y 轴，数值从 0 到 100。该图突显了数据在不同箱之间的分布及累积影响。\n\
  \n**图 18-28**  \n包含累积百分比的帕累托图\n\n累积曲线并没有从根本上改变图表的外观，但很容易看出它强调了增长在接近末尾时放缓的事实，因为图表左侧有更多的数值。\n\
  \n\n\n### 箱线图\n\n我们在第 2 章中看到的另一种图表是箱线图，它能显示多个组中每个组的分布情况。箱线图依赖于分布中的某些特定点来展示数据的分散程度。它们比其他一些基于统计的图表更直观，并且可以很快地向之前没见过的人解释清楚。它们还能很好地展示异常值。示例见图\
  \ 18-29。\n\n![](img/628533_1_En_18_Fig29_HTML.jpg)\n\n箱线图显示了两组数据。左侧的箱子较小，中位数较低且四分位距较窄，而右侧的箱子较大，中位数较高且四分位距较宽。右侧箱子上方存在一个异常值。该图突出了数据分布和变异性。\n\
  \n图 18-29：箱线图\n\n图 18-29 展示了一个两组箱线图，其中第二组的值比第一组更高且更分散。在这张图中，彩色区域代表四分位距（`IQR`；介于`Q1`和`Q3`之间），中间的线代表中位数。在此版本中，“`x`”代表平均值，第二组的平均值明显高于中位数，这意味着分布是偏斜的。每组顶部和底部的水平线（“须”）代表最小值和最大值，但异常值除外。最小值和最大值都使用了`1.5`倍的`IQR`，最小值是`Q1`减去该计算值，最大值是`Q3`加上该值。此处的异常值定义为任何大于计算出的最大值或小于计算出的最小值的点。还可以包含极端异常值，它们是指任何小于`Q1`减去`3`倍`IQR`或大于`Q3`加上`3`倍`IQR`的值。\n\
  \n我们可以查看一些学生的学分数据，这次显示的是大一、大二和大三学生。见图 18-30。\n\n![](img/628533_1_En_18_Fig30_HTML.jpg)\n\
  \n箱线图标题为“按年级划分的总学分”，显示了大一、大二和大三学生的总学分。`y`轴代表总学分，范围从`0`到`80`。每个箱线图都显示了中位数、四分位数和异常值。与二、三年级相比，一年级的中位学分较低，其中三年级的中位学分和范围最高。\n\
  \n图 18-30：展示按学年划分的学生已完成总学分的箱线图\n\n该图整体上符合我们的预期，每年级的中位数、最小值和最大值都在增加，而且每个年级的数据也有相当程度的分散。有些学生是兼职，而另一些学生则课程负担过重或通过其他方式获得大学学分，所以并非所有学生的情况都一样。有几位大二的“学霸”学生，但他们是仅有的异常值。大一和大二学生的平均值和中位数很接近，表明偏斜很小，但大三组的平均值低于中位数。\n\
  \n这种图表在探索性数据分析（`EDA`）中出现频率很高，而在给利益相关者的图表中则不那么常见，但如果有合适的数据和利益相关者，它仍然很有价值。\n\n###\
  \ 热力图\n\n*热力图*是对表格的一种增强，其中值的范围由不同的颜色和渐变来表示，通常浅色到深色对应小数字到大数字。由于视觉方面的特性，它对于快速传达信息非常有帮助，但同时仍保留了表格的细节。图\
  \ 18-31 是一个示例，展示了一个热力图，显示了中学生在一系列普通科目中的平均成绩。\n\n![](img/628533_1_En_18_Fig31_HTML.jpg)\n\
  \n热力图显示了`6`至`12`年级不同学科的平均成绩。学科包括数学、英语、科学、社会研究、艺术、音乐、乐队和外语。颜色强度代表成绩值，较深的阴影表示较高的成绩。例如，`6`年级在音乐和乐队方面成绩较高，而`12`年级在外语方面成绩较低。\n\
  \n图 18-31：`6`至`12`年级学生成绩的热力图\n\n这张热力图清楚地表明，随着年级的升高，某些学科的平均成绩会下降，但其他学科则没有相同的趋势。核心科目往往遵循这种趋势，而选修课则不然。如果没有灰度着色，我们根本无法如此快速地看到这一点。\n\
  \n热力图的众多优点之一是，你可以在保持其比其他一些可视化图表更具可读性的同时，展示大量数据。这就是为什么在进行`EDA`时，制作相关矩阵热力图很常见的原因之一，特别是因为你可以使用两种不同的颜色，并以不同的颜色和不同的强度来表示正值和负值。\n\
  \n每当你处理表格数据时，检查热力图是否合适总是值得的。利益相关者通常也喜欢它们。\n\n### 树图\n\n我之前提到过树图，因为它们可以作为饼图的替代方案，当类别过多以至于无法制作清晰的饼图时，树图就很合适，而且它们还允许分组。图\
  \ 18-32 是一个树图示例，显示了按地区分组的美国各州人口。矩形的大小代表了该州的人口。\n\n![](img/628533_1_En_18_Fig32_HTML.jpg)\n\
  \n树图标题为“美国人口树图”，展示了美国各地区和各州的人口分布。区域以不同颜色编码：中西部、山地西部、东北部、太平洋沿岸、南部、南中部和西海岸。每个州由一个矩形表示，其大小与该州的人口成比例。值得注意的州包括加利福尼亚州、德克萨斯州、佛罗里达州和纽约州。该图提供了各州人口在其所在区域内的视觉比较。\n\
  \n图 18-32：按地区分组的美国各州人口树图\n\n分组是一个不错的加分项，但尽管有`51`个数据点，我们仍然可以读取其中的大部分。右下角是夏威夷和阿拉斯加，被归为“太平洋”组。将其与图\
  \ 18-33 中的饼图相比，后者如果没有放大镜和极大的耐心是无法理解的。\n\n![](img/628533_1_En_18_Fig33_HTML.jpg)\n\
  \n饼图标题为“糟糕的美国人口饼图”，显示了各个美国州及其对应的彩色扇区。每个州用一种不同的颜色表示，下面有一个图例列出了各州，如阿拉巴马州、阿拉斯加州、亚利桑那州等。该图表以视觉方式展示了人口分布，但缺乏清晰的数据区分，因此难以解读具体的数值。\n\
  \n图 18-33：显示美国各州人口的糟糕饼图\n\n这个饼图显然很荒谬，但树图实际上可读性很强且直观，并且还有一个额外的好处，即能够有意义地对各州进行分组。当你拥有包含一个或两个分类级别的数值数据时，可以考虑使用树图。利益相关者不常见到树图，但你向他们解释起来不会有任何困难。\n\
  \n\n\n### 分区统计图\n\n每个人都见过分区统计图，但几乎没人知道这个名称。它是一种根据不同数值对区域进行着色的地理地图。新闻媒体在选举期间制作的美国地图，各州用蓝色或红色标注，都属于分区统计图。图\
  \ 18-34 展示了 2008 年美国总统大选的地图，其中显示了县级和州级的投票结果。\n\n![](img/628533_1_En_18_Fig34_HTML.jpg)\n\
  \n2008 年美国总统大选按县统计的结果地图，显示了民主党（奥巴马）和共和党（麦凯恩）的得票比例。各县以不同深浅的蓝色和红色着色，表示获胜党派的得票率。图例解释了颜色编码的含义：颜色越深代表得票率越高。插图中还包括一张较小的选举人票分布图和显示普选票总数的饼图。该地图来自\
  \ `nationalatlas.gov`，并附有关于内布拉斯加州选举人票分配的注释。\n\n**图 18-34**\n\n一幅显示 2008 年美国总统大选结果的分区统计图。来源：[`https://www.usgs.gov/media/images/printable-map-2008-presidential-election-results`](https://www.usgs.gov/media/images/printable-map-2008-presidential-election-results)\n\
  \n在这幅地图中，蓝色表示该州的选举人票投给了民主党候选人，红色表示投给了共和党候选人。根据数值的渐变对地点进行着色也非常常见，就像这里县级地图的做法一样。这可以基于真正的渐变，即最低数值对应最浅的颜色，最高数值对应最深的颜色，所有颜色按比例过渡。另一种做法是，将数值分箱，使用有限数量的颜色或色度。两种方法各有优缺点。图\
  \ 18-35 展示了一幅美国各州人口的渐变着色地图（未分箱）。\n\n![](img/628533_1_En_18_Fig35_HTML.jpg)\n\n一幅使用色彩渐变显示美国各州人口的地图。颜色越深代表人口越多，其中加利福尼亚州和得克萨斯州人口最多。人口范围从\
  \ 576,851 到 39,538,223。地图由 Bing、GeoNames、Microsoft 和 TomTom 提供技术支持。\n\n**图 18-35**\n\
  \n一幅显示美国各州人口的分区统计图\n\n这幅地图虽然可读，但有太多不同的色度需要辨别。这就是分箱方法有用的原因。我们可以使用等距分箱（只需将整个范围等分为若干份）、利用数据分布特征（如四分位数），或者干脆创建任意分箱。鉴于这幅地图中人口最少和最多的州之间差距巨大，自行创建分箱或许是合理的。分箱的一个缺点是，即使两个数值非常接近，也可能落入不同的分箱，从而造成误导。例如，如果我们把最低分箱的上限设为\
  \ 300 万，那么内华达州（总人口 3,105,000）仅超出 105,000 人，而堪萨斯州（总人口 2,938,000）则低于这个上限 62,000 人。尽管两州实际人口非常接近，但它们会被分到不同箱中。堪萨斯州看起来会与几个人口不足\
  \ 50 万的州有更多相似之处，而不是与人口只多出不到 17.5 万的内华达州。正确选择取决于你具体想要达到什么目的。\n\n绘制地图时另一个需要考虑的问题是使用哪种投影，尤其是在绘制全球地图时。我们大多数人最熟悉的是墨卡托投影，它将地球变成一个矩形，使得北部和南部的陆地被显著拉伸。罗宾逊投影则保留了地球的球形感，拉伸程度较小。许多工具内置了墨卡托投影，并且大家都很熟悉，因此对许多用途来说，这是最简单的选择。\n\
  \n## 演示汇报\n\n在大多数公司，你将通过创建和分享报告（例如使用 Microsoft Word 或 Google Docs）或者创建并演示幻灯片（例如使用\
  \ Microsoft PowerPoint 或 Google Slides）来展示你的发现。有时也可能被要求分享幻灯片。我将讨论应根据不同受众以及媒介（文档或幻灯片）来决定在演示中应包含哪些信息。\n\
  \n\n\n### 受众\n\n通常，我们有理由创建多个版本的演示文稿，每个版本根据受众不同而包含不同的信息。为了方便起见，我将在此处为每种通用受众类型命名，以便下文引用。通常，你最先向其演示的将是你的项目所服务的利益相关方（“你的业务利益相关方”）。你可能会被要求向他们的更上级领导（“业务领导层”）或你自己的上级领导（“技术领导层”）进行演示。如果项目进展得特别顺利，可能还有其他团队，比如你最初的利益相关方，他们也会对你做类似的工作感兴趣（“其他业务团队”）。最后，非常常见的情况是，你被要求向你自己的团队或其他数据科学家（“你的同行”）演示你的工作。在所有情况下，你都将遵循本章前面提到的讲故事步骤\
  \ #1–#7。\n\n这些受众中的每一个都需要了解正在解决的问题是什么，以及你的解决方案如何帮助利益相关方完成他们的工作（步骤 #1 和 #4，根据需要略加步骤\
  \ #5）。对于业务和技术领导层，这两点都要简明扼要，但在解决方案如何提供帮助方面，请尽量用节省的时间（减少利益相关方完成原始任务所花费的时间）、销售额的可能增长或成本削减来量化。数字是领导层的语言。这两类群体都希望从步骤\
  \ #2 和 #3 中获得最少量的信息。除非另有说明，否则请将步骤 #2 和 #3 保持在最低限度。但是，不要完全省略它们，因为如果你进行现场演示，其中有些人可能会提出问题。对于文档和幻灯片，将一些更详细的信息放在附录中可能会更好。分享下一步计划也是有益的。\n\
  \n你的业务利益相关方已经了解问题，因此你无需为他们深入赘述问题细节；而根据其他业务团队的不同，你可能需要详细说明，也可能需要快速总结（如果这是他们已有的问题，则不需要太多信息，但如果他们在不同领域工作，则可能需要更多信息）。对于这两类群体，“看情况”是处理步骤\
  \ #2 和 #3 的规则。如上所述，其中一些群体本身也在处理数据，因此他们可能希望更多地了解你是如何使用数据的，以防对他们有所帮助。然而，花一些时间在这上面对你来说可能是有益的，因为这是你最可能已经与你的利益相关方合作过、或者将来需要与未来的利益相关方合作的领域（例如，弄清楚数据的含义）。因此，让他们看到数据准备是一个重要且耗时的步骤对他们是有帮助的。他们都对解决方案、步骤\
  \ #4 和 #5 最感兴趣。应该向这些受众详细解释这一点（对于任何不熟悉你当前利益相关方工作的其他业务团队更是如此）。就像对领导层一样，要确保清楚地表明这在时间和质量上给他们带来了多大的好处。这两类群体也会对听到下一步计划感兴趣，对于一些群体，如果这些计划已被提上日程即将开展，你甚至可能希望深入探讨它们。\n\
  \n最后一种常见的受众是你的同行。对他们来说，你需要把问题讲清楚，但他们通常对细节不太感兴趣。解决方案和下一步计划也是如此。不要忽略提及它们，但他们可能对步骤\
  \ #2 和 #3 更感兴趣。他们会想了解你使用的数据源，以便看看他们是否能将这些数据源用于他们自己的工作。同样，他们会对你的解决方案的技术信息更感兴趣，尤其是如果你向他们自己可能使用的团队代码仓库中添加了任何代码，或者你解决了一个他们也一直面临的技术问题，等等。\n\
  \n### 媒介\n\n如上所述，你的文档和幻灯片的长度将根据你的受众而变化。但讨论这些报告的结构仍然是有帮助的。\n\n在文档式报告中，你基本上总结了你的受众想了解的所有内容。你还应该包括日期、作者以及参与项目的人员。你需要一个目录，并通常应将文档划分为与上述讲述数据故事的步骤大致对应的章节。你需要以适合受众的详细程度，阐述你想表达的所有要点。这确实意味着你可能需要为不同的受众创建多份报告。许多地方都想要的高级版本称为执行摘要，它可能具有内部定义的结构。其他报告则是“一页纸”，这是信息共享的常见方式，显然被总结到一页纸上。文档式报告的一个优点是，你可以链接到包含更多信息或细节的其他文档，这样读者可以自行决定深入阅读的程度。\n\
  \n幻灯片也将传达你想要受众了解的所有内容。你通常以标题页、日期和项目参与人员列表开始制作幻灯片。在此信息之后立即包含一个作为目录的议程幻灯片。如果你正在创建用于会议演示的幻灯片，一份真正优秀的幻灯片会省略很多细节，而这些细节将由你口头说出。这是优秀演示的标志，因为当你展示一张幻灯片时，人们要么阅读幻灯片，要么听你说话，但通常不会同时进行。因此，最好有一些要点——谈话要点——你将在这些要点上展开，这样他们就不会只顾着阅读幻灯片。\n\
  \n然而，问题之一是，会议上的人（非常）经常要求你分享幻灯片，以便他们之后可以查看。如果你像我上面提到的那样创建了幻灯片，那它实际内容会非常少，他们不会真正记得你说了什么。有几种方法可以处理这个问题。一种方法是将你的主要观点（你在演示中口头说出的关键点）包含在每张幻灯片的备注字段中，这在演示模式下浏览幻灯片时是看不到的。另一种选择是，准备一份包含所有解释和细节的独立幻灯片，然后分享那份来代替。\n\
  \n如果你创建了一个工具，比如一个仪表盘，供人们使用，那么通常也会在会议中对该工具进行现场演示。你也可以在文档或幻灯片中包含指向它的链接。确保要么让参加会议的人能够访问该仪表盘，要么明确说明他们如何请求访问权限。\n\
  \n\n\n# 可视化工具\n\n市面上有许多可视化工具。数据科学家经常使用`Excel`和代码，比如 Python 中的 `matplotlib` 或 `seaborn`，或者\
  \ R 语言中的 `ggplot`。我在本章中几乎所有的图表都使用了`Excel`，因为它快速、简单且外观统一。在处理真实数据的探索性数据分析（EDA）时，更常见的是用代码来实现这些功能（因为你通常已经在代码中完成了大量数据操作）。但在向利益相关者展示时，你可以将数据准备为\
  \ CSV 文件，然后在`Excel`中使用，或者将其存放在数据库或电子表格中，以便在其他专业可视化工具（包括`Tableau`和`Power BI`）中使用。\n\
  \n`Tableau`和`Power BI`是目前最流行的两种专业可视化工具。`Power BI`由微软公司所有，通常被那些全面采用微软产品和 Azure 云平台的组织使用。`Tableau`则是一款独立工具，但它与许多其他工具集成了。如果你打算进入数据科学或数据分析领域，熟悉这两款工具都会很有帮助。\n\
  \n`Tableau`和`Power BI`都允许你从多个来源拉取数据，并在内部进行合并（这被称为**数据建模**）。你基本上可以在工具内部创建一个或多个类似电子表格的结构，并以此为基础构建图表和仪表板。它们的优点在于，允许你将数据保持在相当原始的状态，从而可以在工具内部进行聚合操作。这样一来，你无需为了生成多个图表而创建一堆具有不同聚合方式和结构的数据表格或数据库表。\n\
  \n这两款工具都内置支持我上面提到的所有可视化类型，并且在添加筛选器方面具有非常灵活的选项——例如选择年份以仅查看一年的数据、选择单个产品等——这些筛选器可以影响同一仪表板上的多个不同图表和表格。这使得最终用户使用起来极为便捷。不过，这两款工具都有一定的学习曲线，但只要你花点时间使用它们，并掌握它们的基本工作方式，学习它们每个工具的新功能就会变得越来越容易。\n\
  \n你可以通过其官网⁴⁸了解有关`Tableau`及其免费公共版的更多信息。这个网站实际上是一个绝佳的机会，既能学习一些`Tableau`技能，又能为你的作品集创建作品。看看一些真正有技能的人构建了什么也很有趣。`Power\
  \ BI`也有一个可以下载的免费版本（仅限 Windows）⁴⁹。我强烈建议你尝试其中一个工具，这样在求职时，你就可以在简历中列出其中一款工具的基本技能。你无需学习两者，因为一款工具所需的技能可以相当容易地迁移到另一款工具上。\n\
  \n\n\n## 关键要点与下一步\n\n在本章中，我们探索了广阔的可视化世界。首先通过几个有趣的例子展示了可视化令人惊讶且具有冲击力的效果，其中包括一幅著名的拿破仑入侵俄国地图，以及另一幅展示数据集可能拥有相同统计属性，但绘制出来却截然不同的图表。接着，我探讨了可视化与工作成果展示实际上是如何讲述故事的——数据以及你对其所做的工作讲述了怎样的故事？我介绍了多种不同的图表类型和其他可视化形式，包括散点图、柱状图和条形图、折线图、面积图、饼图、直方图、箱线图、热力图、树状图和等值区域图。随后讨论了向利益相关者及其他人员展示成果的方法，最后介绍了当今两种主要的专业可视化工具：`Tableau`\
  \ 和 `Power BI`。\n\n在下一章中，我将介绍机器学习和数据科学在多个领域的现代应用，从保险、医疗保健到教育等等。数据科学得到了广泛应用，且丝毫没有放缓的迹象。\n\
  \n## 从业者简介：梅根·伯杰\n\n**姓名：** 梅根·伯杰\n\n**现任职务：** 零售分析顾问与数据翻译员\n\n**现任行业：** 一家数据与分析公司的咨询部门\n\
  \n**从业年限：** 10 年\n\n**教育背景：**\n\n*   证书：`认证 ScrumMaster (CSM)` 和 `Tableau Desktop\
  \ 专家`\n*   `商业分析硕士`\n*   `商业管理学士`\n\n*此处表达的观点仅代表梅根本人，与其现任或前任雇主无关。*\n\n### 背景\n\n\
  梅根大学毕业后的前十年从事高端零售管理工作。在那里她学到了一些分析知识，并一直热衷于制作图表和计算数据，因为她喜欢这样做，并且这对工作有帮助，尽管她当时对分析并没有系统的了解。她会查看销售和库存数据，试图弄明白为什么某些商品销售不佳，或者是否有机会与其他门店调货。她还制作员工报告。这些都是必须完成的工作，但她乐在其中，因此投入的精力和时间超过了基本要求。她曾尝试结识公司里的一些分析人员并向他们学习，但当时学的内容都很基础，她觉得自己并没有得到满意的答案。最终，她意识到这是自己真正想做的事情，于是重返校园攻读分析学硕士学位。在读期间，她学到了很多知识，包括\
  \ `Python`、`R` 等，但尤其爱上了数据可视化。\n\n## 工作\n\n硕士毕业后，梅根在一家规模较小的数据与分析咨询公司找到了一份工作。她与几位不同的客户合作，开展了多种类型的分析和可视化工作。她发现，自己非常喜欢能够以当年做零售时渴望的方式帮助客户，而那时她还不具备这样的技能或工具。她在零售/消费品领域的可视化和分析中找到了自己的专长。\n\
  \n早期，她专注于使用 `Power BI` 和 `Qlik Sense` 等工具进行可视化开发。但随着职业生涯的发展，她承担了更多职责，包括在多个项目中领导数据可视化团队、产品管理（监督大规模分析项目的规划与执行），以及与整个组织中的业务用户建立关系，既指导他们进行自助式可视化，也为制定有效的分析解决方案提供业务洞察和策略。\n\
  \n### 妙语摘录\n\n**工作中最喜欢的部分：** 每天的工作内容都不相同，所以从不枯燥。有不同的客户和不同的问题需要解决。她目前的处境也很好，因为公司规模很小，所以晋升机会很多。\n\
  \n**工作中最不喜欢的部分：** 有时作为顾问（取决于客户），利益相关者主要将她的团队视为技术分析师，而非业务伙伴。这限制了分享知识和就长期解决方案提供建议的机会。在建立现实的项目开发时间表与满足利益相关者期望之间保持平衡很有挑战性，尤其是在遇到预料之外的技术难题时。\n\
  \n**最喜欢的项目：** 她曾参与一个与零售缺货相关、时间较为紧迫的项目。她为此制作了一个非常有趣的可视化图表，因为它将两个独立的数据源结合到一个图表中，并且图表含义一目了然。在另一个涉及库存的项目中，她做了类似的工作，首次将三个数据源整合在一起，并添加了一些计算，帮助判断哪些产品可能延迟，从而为追踪订单和制定应对方案争取了更多时间。\n\
  \n**最常用的技能：** 她早期的工作偏技术性，主要是进行开发。但因为她现在的重点是可视化和指导，所以软技能更为重要。这些技能包括沟通、管理、领导力，以及规划并引导团队达成目标。\n\
  \n**当前主要使用的工具：** `SQL`、`Snowflake`、`DBT`、`BigQuery`、`Power BI`、`Qlik Sense`、`DOMO`、`Sigma`\n\
  \n**数据科学的未来：** 一个必然的趋势是，人工智能正在通过无代码或低代码选项让普通人更容易自行进行分析。这本身并非坏事，但对所处理的数据（以及如何将其与其他数据关联）的理解仍然至关重要。梅根认为，分析专业人士的角色可能会从开发和解决方案构建，转向对项目的更具战略性的监督。自助服务工具不会消失。这意味着数据文档将变得越来越重要。\n\
  \n**优秀的数据可视化专业人士的特质：** 真正理解最终的业务用途和目标。能够容忍大量的试错，以找到利益相关者能理解的正确的可视化方式，这一点同样重要。\n\n\
  **她对有志于从事数据和可视化工作的人的建议：** 学习永无止境。你必须不断学习该领域的新知识——新工具、新方法。你可能需要根据市场趋势在不同工具之间进行切换。同时，尝试在业务方面寻求合作伙伴，以深入了解你所在的工作领域也很重要。知识交流是建立关系的绝佳方式。\n\
  \n*梅根是一位经验丰富的分析与可视化专业人士，拥有深厚的零售背景。*\n\n脚注 1   2   3\n\n# 19. 这可不是我们的第一次：机器学习应用\n\
  \n\n\n## 引言\n\n数据科学和机器学习总体上已存在数十年之久，并且其受欢迎程度正在稳步提升。随着像`ChatGPT`这样大量公开可用的基于机器学习的工具涌现，许多公司能轻松生成营销文案，程序员也能加速编码。随着分析和机器学习领域的日益普及，我们看到它们在众多领域的应用层出不穷。一些公司使用第三方工具，基于自身数据生成模型，就像我们在第\
  \ 16 章中看到的`Salesforce`的机器学习工具那样，但也有许多公司正着手从零开始构建自己的数据科学解决方案和机器学习工具。\n\n数据科学通过诸如\
  \ A/B 测试这类如今已司空见惯的方法，极大地帮助公司改善了营销工作。它使公司更容易利用聚类技术来迎合特定的客户群体，从而实现超个性化服务。通过精准的产品和服务推荐，它可以提升销售额。许多公司能够自动化执行各种任务，从而节省时间和人力。\n\
  \n`NLP`和语音处理技术使得客户支持的部分自动化变得更加容易，通过易于构建的聊天机器人减少了所需的客服人员数量。\n\n让公司更容易采用机器学习的一个趋势是，企业正将数据存储和工具迁移到云端，而不再将所有内容托管在本地。云服务提供商在吸引公司的核心服务之上提供了多种服务，公司可以轻松加入一些机器学习选项，从而以最小的投入进行尝试。如果他们喜欢结果，就已经踏上了正轨。我们将在下一章讨论云服务。\n\
  \n这里需要提及很重要的一点是，你已经知道机器学习的许多应用——以及广义上的技术——都伴随着道德困境。我将提及的许多应用都存在不容忽视的问题，即使我们选择忽略并继续推进。通常，人们不了解事情是如何运作的，因此不知道其中存在道德问题。这既包括使用机器学习的公司，也包括使用其产品的客户。\n\
  \n尽管机器学习能让我们做许多令人兴奋的事情，但我们不能忘记更宏观的图景。即使其他人不思考，我们始终有责任去思考其中涉及的伦理问题。\n\n下面，我们将探讨几个行业目前是如何使用数据科学和机器学习的。我们将从保险、银行和金融领域开始，然后研究零售业。接着，我们将进入医疗保健和生物信息学领域，之后跳转到游戏行业。最后，我们将审视刑事司法和教育领域。\n\
  \n## 保险业\n\n统计方法几乎从保险业现代诞生的初期就成为其一部分，这可以追溯到 17 世纪富有的英国人承保货物运输和殖民者运往美洲殖民地的业务（*underwriting*\
  \ 承保，指的是为获取费用而承担财务风险，并有可能需要支付巨额赔款）。在帕斯卡和费马解决了“点数问题”之后，承保人采纳了他们计算风险的技术，保险业很快就成了一个完整的行业。\n\
  \n因此，诸如线性回归和广义线性模型之类的统计和统计建模方法长久以来一直是保险业使用的传统技术。这些方法帮助他们在承保过程中（例如确定保费价格）平衡风险与利润，但该行业尚未在其核心业务中真正拥抱现代机器学习。然而，有许多潜在的应用，尤其是在增强现有方法方面。一种可能性是使用机器学习进行特征工程，为该领域的传统模型创建特征。例如，他们可以准备非线性特征，更有效地对现有特征进行分箱，或使用聚类来识别全新的特征。此外，一些机器学习方法（如决策树和正则化）在处理稀疏数据方面优于传统模型，因此一些人开始关注这些方法。以这种方式使用机器学习会带来伦理风险，尤其是在许多西方国家，基于受保护类别的严格法规禁止将这些类别纳入建模中。例如，在决定提供何种服务时不能纳入种族因素，因此数据科学家必须小心，确保没有任何新特征充当“种族”的代理变量，即使种族本身未被包含在内。\n\
  \n保险业的其他领域已经更多地接受了机器学习。例如，机器学习可以通过分析索赔的特征，并根据欺诈风险或其他需要特定专业知识的情况，更有效地将索赔案件分配给分析员，从而加快索赔处理速度。这缩短了处理时间。机器学习还可以用于预测索赔频率和严重程度。借助机器学习，欺诈检测和预防变得更加复杂，依靠异常检测方法，能捕捉到更多真正的欺诈性索赔，同时最大限度地减少被送去进一步分析的非欺诈性索赔数量。在合规监控方面，通过监控交易、索赔或通信来满足监管要求也存在可能性。甚至可以通过图像处理技术部分自动化索赔中的财产损失评估。在很大程度上，这些做法在伦理方面的风险不大，但一如既往，需要谨慎对待客户，尤其是在涉及受保护类别时，要公平对待他们。\n\
  \n通过更好的监控和产品推荐，客户管理和销售也能得到改善。机器学习可以为与现有客户的互动提供信息，并通过将客户分组以便采取不同行动来识别获取新客户的方法。他们开始应用机器学习的另一个领域是客户流失预测（预测离开的客户），并且效果显著。聊天机器人和其他工具可以辅助客户服务。这些在伦理方面风险也相对较低，但聊天机器人可能存在隐私风险，因此需要确保其安全性。\n\
  \n\n\n# 银行与金融\n\n银行与金融领域中的`ML`（机器学习）与保险业有许多共同之处，两者都是得益于统计学和数学的古老领域。与保险业类似，机器学习最具影响力且应用最广泛的领域之一是欺诈检测。同样，它们也开始在核保阶段和信用评分中更多地使用`ML`，尤其是在评估信用风险和确定贷款利率方面。`ML`使得在这些决策中纳入更多信息变得更加容易，从而促成更多低风险的贷款。如同保险业一样，它们也必须谨慎对待关于受保护类别的法规，以确保这些信息不被纳入模型中。\n\
  \n由于可用的数据比以往任何时候都多，人们也在投入精力预测市场趋势，例如利率和股市行为。`NLP`（自然语言处理）使公司更容易利用来自新闻和其他非结构化来源的更多数据进行股市预测，以及其他任何可能用到这些数据的领域。另一个越来越受欢迎的领域是全自动股票交易，即算法交易。这里的道德风险并不显著，尤其当所使用的数据是公开可用的时。然而，如何利用这些预测结果，可能会引发在向客户呈现方式方面的道德问题。\n\
  \n洗钱一直是银行和金融业必须防范的问题，而`ML`通过异常检测使合规监管变得更容易。法规通常格外棘手，因为它们会定期变化，但存在一些方法可以在面对变化时实现合规自动化。\n\
  \n在银行和金融领域，`ML`还被应用于许多与客户相关的领域。它们使用`NLP`和聊天机器人来自动化或半自动化客户服务，尤其是在处理较简单的任务时。客户流失预测在此领域也得以应用，因为当客户打算离开时，尝试说服他们留下非常有用。个性化对于提升客户在网站使用中的体验至关重要，而产品推荐既能提升客户满意度，也能增加销售额。其中一些功能伴随着需要妥善处理的隐私风险。\n\
  \n# 零售\n\n与其他行业一样，零售业通过客户细分、精准营销和个性化产品推荐来运用数据科学提升客户体验和销售额。这在零售业中至关重要，因为重复销售是其核心目标。忠诚客户在零售业中是无价之宝。\n\
  \n零售公司还在许多其他领域使用`ML`。它们通过监控竞争对手价格并频繁调整价格的定价策略来实现利润最大化，尤其是在线店铺。自动定价比人工管理高效得多。为此，定价系统需要能够将公司产品目录中的商品与竞争对手网站上的产品进行匹配，分析价格差异，并设定新价格。访问其他公司的网站和价格可能会引发道德问题。\n\
  \n零售业采用`ML`的另一个重要领域是供应链管理。如今，大多数公司的供应链都极其复杂，涉及多个供应商、不同的生产或仓储地点，以及不同的运输机制。使用计算机系统管理整个供应链很常见，例如通过企业资源规划（`ERP`）系统。这些系统通常内建了`ML`工具，由于系统本身已掌握大部分重要数据，使用起来非常便捷。无论是否在`ERP`系统中使用，`ML`都能通过预测使用量来帮助需求规划，从而确定何时重新订购产品、组件和供应品（补货），以维持库存。其他预测通常对于辅助业务决策也极有价值。总体而言，预测有助于业务的诸多方面，包括人员配置、产品摆放和产品发布。这些工具在道德问题上也相对安全。\n\
  \n与其他行业一样，数据科学在营销中也得到广泛应用。这包括管理促销价格或通用折扣。客户细分在营销中至关重要，而零售业长期以来一直在践行这一点。它有助于针对不同群体提供不同的促销活动。客户终身价值这一概念使公司能够预测特定客户的长期价值，从而帮助确定对不同客户的营销策略或优惠方案。与其他行业一样，客户流失预测在营销中也很有帮助。凡是涉及客户数据的情况，都会面临同样的道德问题。\n\
  \n借助`ML`工具，管理网站（尤其是描述和图片）可以变得更加容易，例如使用`GenAI`（生成式人工智能）来生成产品描述。`AI`也可用于图像润色。网站监控可以帮助公司了解客户行为，例如他们点击的位置和访问最频繁的页面，而`A/B`测试则允许公司尝试不同的方案，观察客户的反应。这些功能在道德问题上风险较低。\n\
  \n对于拥有实体零售店面的商店，甚至有工具可以在店内监控客户行为，例如统计进店人数、他们在店内的行走路线、停留观看的陈列以及拿起的商品。这对于确定店铺布局和货架优化具有极大的帮助。它甚至可以通过使用面部识别来识别已知的扒手以及通过监控行为来协助防盗。显然，一旦开始监控人员，隐私和道德风险的可能性就会随之而来。面部识别，尤其是针对已知罪犯的面部识别，存在一系列道德问题。有些风险可能不值得去冒。\n\
  \n那些生产销售产品（无论用于转售还是直接销售给客户）的公司，也会利用数据科学来确定要开发的新产品，甚至调整食品中的配料成分。配料和零部件可以从多种因素上进行优化，包括成本、口味、健康因素、可持续发展效益等等。根据评估标准的不同，可能会引发道德问题。\n\
  \n\n\n# 医疗保健与制药\n\n数据科学已取得显著进展的另一个领域是医疗保健，其潜力巨大，有望带来更多益处。个性化医疗的承诺尚未完全实现，但我们已经取得了一些进展，并在诊断、风险评估、治疗建议、药物开发/发现、评估药物及其他治疗试验，以及自动化处理大量行政任务方面取得了重大改进。医疗保健是一个充斥着歧视的领域，因此，在问题出现时加以解决至关重要。\n\
  \n最大的改进领域之一是医学影像分析，如核磁共振成像、CT 扫描和 X 光片，这些过去完全由经过专门培训的人员完成。我们在第 15 章中讨论过一种有助于诊断难以发现的乳腺癌的工具——基于机器学习的图像评估系统尤其擅长检测人类通常会漏掉的非常微小的异常。此外，依赖机器学习进行这项分析可以节省医生的时间——他们仍然需要查看图像，特别是那些机器学习未检测到任何异常的图像，但当它检测到问题时，时间就节省下来了。这里主要的伦理风险是过度依赖机器学习。这些工具确实会犯错，人类仍然需要尽职尽责。使用这些工具的一个优点是，它们最大限度地降低了歧视风险。当只观察我们身体内部时，像种族和社会经济地位这样的因素是无形的。\n\
  \n机器学习还有望改进其他诊断方法以及治疗方案。能够建议患者是否应该接受某种特定药物或特定治疗的工具已在一些医院投入使用。这些工具能够发现医生因因素数量庞大而忽略的问题，因此它们可以非常强大。其中一些工具可以更进一步，根据不同的治疗组合实际预测患者的预后，帮助医生选择策略。我们发现的一个问题是，这些工具可能存在偏见，因为人类的偏见被内嵌其中。例如，已知某个系统不太可能为黑人患者推荐止痛药，因为存在着不准确的观念，认为他们对疼痛的耐受力更高、成瘾风险也更高，而这些偏见已被系统所使用的模型捕获。但事实是，如果能够创建公平的机器学习工具，这里也存在着克服医生自身偏见的巨大潜力。\n\
  \n通过患者的医疗记录和监测技术，也能为患者带来益处。我们在本书中讨论过对患者的病历口述进行自动转录，这种方法以及其他自然语言处理方法对于理解和利用患者记录来帮助他们是非常宝贵的。可以挖掘这些记录以发现漏诊，并在慢性病管理中发挥作用。许多患者可以受益于佩戴监测其健康指标的医疗设备，这甚至能让患者更好地管理自身状况。其中一些领域可能触及我们在医疗保健中看到的歧视问题，但还有额外的担忧与医疗设备的安全性需求相关（设备可能被黑客攻击），以及追踪设备产生的数据所有权问题——迄今为止，数据所有权通常归属于制造该产品的公司，而非患者。\n\
  \n还存在更高层面的潜在益处，例如改善医院管理和公共卫生效益。医院可以像零售业一样使用供应链管理工具来规划耗材使用、合理备货并及时订货。需求预测既可以用于物资和流程排程，也可以通过机器学习更轻松地规划人员配备。医疗保健领域还有各种任务可以实现自动化，包括沟通、计费和预约安排。这确实给患者带来了压力，要求他们能够以数字化方式与医疗系统互动，这对于那些无法使用或无法安全使用计算机的人来说可能是一个挑战。\n\
  \n机器学习可以在公共卫生领域有很多应用，包括预测疾病趋势并为此进行规划。我们甚至可以追溯到患者记录，以识别和了解疾病爆发的源头，尽管在处理敏感数据时需要谨慎。\n\
  \n药物发现和开发是另外两个开始运用机器学习且前景广阔的领域。长期以来，药物发现一直是一个昂贵且耗时的过程。研发项目可能需要十多年时间，花费数十亿美元，但绝大部分时候仍以失败告终。^(⁵⁰)\
  \ 决定某种特定化合物是否具有潜在用途的因素众多，人类无法全部考虑周全，因此机器学习是解决这一问题的理想选择。然而，这并不容易，因为它需要处理高维数据，这非常消耗资源，但随着大量化学和生物数据集（公共和私有）的出现，获取有用数据变得越来越可行。机器学习可以在药物发现和开发过程的各个阶段提供帮助，包括识别可能有用的潜在化合物成分（预后生物标志物）、分析临床试验的各个方面以及优化化学性质。\n\
  \n目前，机器学习在药物发现和开发中面临的一个挑战是解释机器学习的结果，以及机器学习结果缺乏可重复性（当使用非确定性方法时）。药物研究人员正在努力的一个方向是更好地理解机器学习的技术层面，从而更擅长选择合适的方法和评估结果。在我看来，机器学习在药物发现和开发中最大的风险之一在于更高层面——企业试图为哪些疾病寻找治疗方法，以及哪些人群受这些特定疾病的影响最大？但它也将加速这一过程并降低失败率。这既为制药公司节省了资金，也帮助了患者，尽管定价常常将许多患者排除在外——但如果公司能秉持道德行事，它们可以压低新药的成本，因为它们的开发成本降低了。\n\
  \n我提到过，机器学习可在药物发现过程中用于评估临床试验，但它也可用于评估其他应用，包括治疗策略。此外，它还可用于帮助设计新的研究并选择要评估的因素。\n\n\n\
  \n# 生物信息学\n\n生物信息学是一个通过生物学、计算机科学（及机器学习）、化学和物理学等多门传统学科来理解生物系统的领域。当数据集规模变得庞大时（生物数据通常如此），它的价值尤为突出。如上文所述，生物信息学在机器学习的应用方面，与医疗健康领域有很多共同点，尤其是在药物发现方面。\n\
  \n在引入机器学习之前，处理庞大的生物数据集十分困难，并且几乎不可能识别出所有重要的特征。自机器学习问世以来，特征工程便成为其在生物信息学中表现出色的领域之一。主成分分析（PCA）这一降维技术，在处理这些数据集通常拥有的极高维度特征时，具有无可估量的价值。\n\
  \n蛋白质组学是对蛋白质的研究，机器学习正在多个领域给予帮助。蛋白质结构预测与药物发现非常相似，类似的方法已被用于识别可能具有研究价值且值得进一步研究的结构。它还被用来预测不同蛋白质的功能以及它们之间潜在的相互作用。此外，还可以使用自然语言处理技术来注释与蛋白质相关的研究材料。\n\
  \n基因组学是机器学习应用日益广泛的另一个重要领域。人类基因组于 2003 年完成测序，这花费了十多年的时间——机器学习使这一过程得以加速，如今可在一天之内完成。此外，还有许多不同动物的基因组可供使用，因此基因组学工作涉及生物学的所有领域。基因组学与蛋白质组学在机器学习辅助的任务类型上也有共通之处，例如预测\
  \ RNA 的结构和基因的功能。机器学习还有助于寻找基因并识别其编码区域。在基因组学中，人们利用机器学习来识别`motifs`（基序），即重复出现的、具有特定结构的\
  \ DNA 子序列。基序被认为具有某种功能，而机器学习可以帮助阐明这一点，以及基序的其他各种特征。基因组学中还有许多与序列相关的工作，包括序列组装，机器学习对此亦有助益。\n\
  \n进化研究与其他生物信息学领域具有跨学科性，但机器学习特别帮助的一个领域是构建`phylogenetic trees`（系统发生树），即代表物种间进化关系的结构。关于鳞翅目（包括蝴蝶和蛾子）的系统发生树示例，请参见图\
  \ 19-1。\n\n![](img/628533_1_En_19_Fig1_HTML.jpg)\n\n树状图描绘了包括毛翅目、颚蛾亚目等在内的各类昆虫群体间的进化关系。顶部区域展示了一个地质时期的时间线，突出显示了中生代和新生代，并细分了三叠纪、侏罗纪和白垩纪等时期。时间线采用不同颜色编码以指示不同的时期和纪元。\n\
  \n图 19-1\n\n鳞翅目系统发生树。来源：来自“File:Phylogenetic chart of Lepidoptera chronogram.svg”，获取地址为\
  \ [`https://en.wikipedia.org/wiki/File:Phylogenetic_chart_of_Lepidoptera_chronogram.svg`](https://en.wikipedia.org/wiki/File:Phylogenetic_chart_of_Lepidoptera_chronogram.svg)，采用知识共享署名-相同方式共享\
  \ 3.0 未本地化版本许可协议（[`https://en.wikipedia.org/wiki/en:Creative_Commons`](https://en.wikipedia.org/wiki/en:Creative_Commons)）\n\
  \n大多数生物信息学工作并不涉及个人数据，因此伦理风险不大，但任何处理个体人类基因组的基因组学工作都需要具备数据隐私意识。个人基因组可能伴随着重大风险。例如，基因组测序公司\
  \ 23andMe 曾向客户承诺绝不会共享他们的基因组，但在 2025 年破产后，其数据被出售给了另一家公司。出售的条件之一是，新公司必须遵守这一承诺，但实际上并没有真正的方法来确保这些数据在将来不会被另作他用。\n\
  \n\n\n# 游戏\n\n机器学习与游戏在公众认知中的紧密关联，很大程度上源于 1996 年和 1997 年 IBM 人工智能代理`深蓝`与当时国际象棋世界冠军加里·卡斯帕罗夫之间的著名对局。他们进行了多场比赛，`深蓝`在\
  \ 1996 年的对局中赢了几局，但卡斯帕罗夫赢得了整个比赛。然而第二年，他们再次交手，`深蓝`获胜。此后，计算机下棋技术不断进步，但最近的重磅新闻是，人工智能代理`阿尔法围棋`在\
  \ 2016 年击败了当时的围棋世界冠军。围棋被认为比国际象棋更具挑战性，因此这算得上是一件大事。然而自那以后，结果喜忧参半，这些工具未能持续击败围棋冠军。这似乎取决于棋风，人工智能并非总能击败某些策略。\n\
  \n但古老的棋盘游戏并非机器学习应用的唯一领域。现代电子游戏行业以多种方式使用它。其一是改进非玩家角色与玩家的互动和行为。非玩家角色是玩家在游戏世界中移动时遇到的、不受其他人类玩家控制的角色。这些角色在任务或挑战中通常很重要，因此玩家需要与他们互动以获取信息。过去，这些互动是按照预设的脚本编写的，所以非玩家角色只能说或做有限的具体事情。作为玩家，你最终常常会碰到非玩家角色重复说过的内容，这时你就知道信息已经问完了。但借助机器学习，可以产生更自然的行为，并对玩家的特定动作做出反应。这让游戏世界显得更加逼真。\n\
  \n自然语言处理通过让对话更自然，从而改善了非玩家角色，但它也允许对游戏玩法进行其他改进，尤其是与语音处理相结合时。玩家可以通过语音向游戏下达指令，并从聊天机器人那里接收指示。\n\
  \n另一个领域是个性化，类似于零售业对顾客的做法。游戏可以监控玩家的行为，并根据他们采取的具体行动提供不同的游戏反馈。这对于在游戏内销售物品的公司尤其有价值，因为它可以通过在恰当时机提供玩家“恰好需要的东西”来鼓励购买。但这也同样有助于提供更好的游戏体验，提供更多玩家喜欢的部分，并减少他们不喜欢的部分。例如，许多游戏都有支线任务，这些任务对游戏整体故事影响不大，但可能很有趣；有些玩家可能喜欢涉及谜题的任务，而不喜欢与较弱的怪物战斗，而另一些玩家的偏好可能正好相反。游戏可以提供他们喜欢的内容。监控玩家行为也是一种了解玩家普遍好恶的方式，这可以影响游戏的改进或增强，甚至可以用来识别漏洞。这种程度的监控还能让游戏开发者最大限度地减少作弊行为。\n\
  \n以往，游戏中的所有内容都是由人类完全编写脚本的，就像非玩家角色的行为一样。但机器学习可以允许一些内容自动生成，这一过程被称为`程序化内容生成`。在开发过程中，这可以涵盖从整个游戏关卡、场景、特定的游戏内任务到许多其他内容。在游戏过程中动态生成内容也是可能的，尽管这并不常见。\n\
  \n对游戏开发的另一个好处是测试和质量保证。与其他方面一样，这过去完全依赖人类，由他们从头到尾玩通游戏，希望能找到任何存在漏洞的特定路径。自动化测试和质量保证通常通过查找游戏数据中的特定模式或异常，来更快速地识别漏洞和性能问题。自动化使得在各种不同硬件配置上进行测试变得更加容易。\n\
  \n我们已经看到人工智能的一些创新涉及图像处理和计算机视觉，因此这也能促进游戏改进就不足为奇了。现代图形和动画质量非常高，尤其是对于我们这些玩着像最初雅达利系统这样\
  \ 8 位游戏长大的人来说。机器学习允许他们不必绘制游戏的每一个部分，而是创建一个角色模板，机器学习工具可以通过不同的动作来操控这个模板。\n\n最后，游戏公司也在销售产品，因此他们像传统零售公司一样拥有客户。他们可以用同样的方式使用机器学习来管理客户互动并加快客户服务的各个环节。他们还可以利用它来辅助商业功能，例如规划新游戏、管理促销活动以及做出其他商业决策。预测与零售业同等重要。\n\
  \n# 刑事司法\n\n我们在第 9 章中看到，一些法院系统正在使用基于机器学习的工具来辅助对被定罪的罪犯判刑。支持者普遍认为这有助于消除偏见，尽管大多数研究这些工具的发现恰恰相反，认为它加剧了偏见。与任何机器学习一样，它存在减少偏见的潜力，但这需要以不学习现实世界中已存在偏见的方式来训练模型。我将概述它目前的使用方式，但请记住，大多数现有用途都存在极其严重的伦理问题，因为没有人真正找到从训练数据中消除偏见的方法。\n\
  \n警察机构以多种方式使用机器学习。其一是分析视频和图像，包括识别人员和物体等相对简单的任务，以及检测闯红灯、车辆事故和犯罪现场（甚至可以通过安装在公共空间的摄像头实时进行）。还可以分析犯罪现场图像来寻找证据。众所周知，他们使用面部识别技术，这是很多人不喜欢的。同样，他们可以通过安装在公共空间的传感器检测枪声，这样在有人报警之前，警方就能得到枪击通知，并能确定枪手的位置。有许多著名的案例，机器学习被用于犯罪预防工具，通过确定增派警力的位置和实施某些政策来发挥作用。最后，法医部门现在使用机器学习进行\
  \ DNA 分析。法医检查员也在某些情况下使用图像处理技术，通过查看放射影像来帮助确定死亡原因和方式。\n\n机器学习也应用于法院系统。正如我们在第 9 章中看到的，被定罪被告再次犯罪的可能性由机器学习工具预测，该数字用于影响量刑决定。这属于风险评估范畴，其他相关决定包括审判前的保释决定、定罪后的量刑决定、监禁期间的释放决定，以及释放后的缓刑和假释决定。\n\
  \n还有一些工具可用于帮助自动化部分行政任务，包括法院系统中的排期、文件管理工作流协调等。这显然可以节省时间并减少人为错误，但同时，它也可能引入其他类型的错误，给人们带来不好的体验。这意味着人类对此进行监控非常重要。\n\
  \n\n\n# 教育\n\n机器学习也被应用于教育领域，这也许并不令人意外。学校使用许多工具来管理所有资源和学生，这些工具中经常包含以某种方式运用机器学习的组件。例如，有些工具会扫描学生的电脑，查看他们的写作、电子邮件和即时消息，以识别出有自杀风险的学生。\n\
  \n分轨制是一种传统的根据对学生能力的感知进行分组，并让他们接受不同课程（“轨道”）的方法，现在可以部分自动化。这决定了他们未来的选择机会。几十年来，高中一直在实行分轨制，但现在通常借助能够筛选大量数据的机器学习工具来辅助实施。分轨制对学生来说一直存在风险，他们可能因为他人做出的决定而几乎被大学录取机会拒之门外，而现在至少部分是由机器学习来处理。\n\
  \n分轨制并非利用海量学生数据能实现的唯一用途。它还能让学校识别出需要额外帮助的学生，如果学校资源充足，就可以提供这种帮助。大学也可以采用这些方法，一些大学发现，找出学习困难的学生并为他们提供支持，已经取得了非常积极的效果。\n\
  \n分轨制和挑选学生给予额外帮助这两者最大的问题在于，这些系统会再次加剧偏见，因为它们是基于已经带有偏见的系统所产生的数据训练出来的。此外，这两种做法都存在隐私风险。\n\
  \n个性化学习是机器学习应用的一个令人兴奋的教育领域。越来越多的教育软件被开发出来，尤其是针对低龄学生，这些软件通常包含机器学习功能，能够根据学生完成一课后的情况来决定接下来该学习什么。还有一些机器学习工具用于识别学习系统中的欺诈行为，这在直接用于评估学生时尤为重要。人工智能导师和聊天机器人也正变得流行起来。所有这些无疑都能带来积极影响，但我们需要注意让学生不要迷失在技术之中。这意味着我们需要将人类纳入这个系统，以确保学生得到公平的对待。\n\
  \n\n\n## 关键要点与下一步\n\n在本章中，我们探讨了机器学习应用的八个不同领域。几乎所有这些领域都以某种形式涉及客户，而大多数公司都在利用分析技术来管理客户和营销。同样，许多公司也将其应用于供应链管理。保险、银行和金融领域面临许多相似的问题和应用场景，包括评估风险承担程度、处理欺诈与合规问题。零售业以多种方式运用机器学习，例如定价策略、网站管理以及产品开发或采购决策。机器学习在医疗保健领域影响深远，相关努力致力于改进诊断、治疗方案和药物发现。生物信息学与医疗保健有许多共通之处，包括类似药物发现中的流程，但机器学习在基因组学和蛋白质组学中也有应用。电子游戏行业以多种方式运用机器学习，主要是为了提升现代电子游戏的玩法和画面。刑事司法系统在执法（监控人员、侦查犯罪）和法庭系统（量刑、保释与释放决策）中都大量使用机器学习。机器学习也被应用于从小学到高等教育的各个阶段。\n\
  \n在下一章中，我们将探讨云与可扩展性。这意味着要比较传统方式（本地数据中心）与新型方式（去中心化云计算，即按需付费使用其他公司托管的资源）。云选项带来了许多优势，包括可扩展性、弹性、资源池化和按需付费模式，我将在下一章详细讨论。我们还将涉及并行计算和分布式计算，它们有助于加速处理大量数据。我们将了解最主流的云平台以及数据科学家最可能使用的部分工具。\n\
  \n## 从业者简介：凯特琳·泰特斯\n\n**姓名：** 凯特琳·泰特斯\n\n**现任职位：** 洞察与分析高级分析师（数据翻译员）\n\n**所属行业：**\
  \ 快速消费品\n\n**从业经验：** 3 年数据分析师\n\n**教育背景：**\n\n-   商业分析硕士\n-   工商管理硕士\n-   声乐教学法硕士\n\
  -   表演艺术学士\n-   声乐表演学士\n\n*此处观点仅代表凯特琳本人，与其现任及历任雇主无关。*\n\n### 背景\n\n与书中的许多从业者一样，凯特琳从小就热爱数字和数学。她一直觉得这能给她带来能量。高中时，她最初期望走上科学、技术、工程和数学（STEM）的道路，但在爱上音乐剧后，她选择了另一条路，进入大学学习声乐表演和表演。她热爱其中的一点是讲故事，并在表演课上深入研究了人类行为。当她意识到自己并不想成为表演者时，她攻读了音乐教学硕士学位。作为学位的一部分，她进行了涉及大量定量分析的初级研究，并发现自己乐在其中。毕业后，她确实成为了一名小学音乐教师，同时经营和管理自己的音乐工作室。但她仍然觉得自己没有完全找到理想的状态，于是又回归定量分析工作，并计划进入商界。她攻读了工商管理硕士（MBA），以获得更广泛的商业视野，对商业分析部分尤其感兴趣，也是从那时起，她开始看到这一切如何融合在一起。她看到了将数据整合成故事在商业环境中所能产生的强大力量与影响。作为双硕士项目的一部分，她又攻读了商业分析理学硕士，从而全身心投入这条道路。\n\
  \n### 工作内容\n\n凯特琳在研究生阶段就开始为初创企业做咨询，这让她得以在商业领域崭露头角。这项工作涉及多种活动，让她学到了各种实用技能。她学会了如何有效设置`Google\
  \ Analytics`并分析网站流量，也做了一些分析工作。她热爱的事情之一是识别业务问题或需求，进行深入探究以理解问题所在，并找到最佳的推荐解决方案。\n\n\
  毕业后，凯特琳开始了现在的工作，在一个洞察团队工作。该团队负责分析工作，并开展大量直接的定性和定量研究，然后分析其结果。他们还在不同的分析中使用第三方数据，这是她当前角色的主要工作重点。目前，她与营销战略和营销创新团队合作，量化新兴品类和子品类，通过整体品类分析战略性地识别增长领域和机会，并利用多种数据源编织成连贯的故事，从而提供可执行的建议。与此同时，凯特琳仍在摸索自己的确切角色，因为她的公司本身也还在探索分析将在业务中扮演什么角色。因此，凯特琳正处于一个既令人兴奋又有些令人望而生畏的位置：她要弄清楚如何最大限度地发挥自己的作用，某种程度上也是在定义自己的角色。\n\
  \n### 语录精华\n\n**工作中最喜欢的部分：** 凯特琳喜欢用数字和数据讲故事，尤其是当这涉及到解决问题，并且需要运用她的逻辑推理能力，利用现有资源创造性地找到解决方案时。她也喜欢与拥有不同背景和优先事项的人合作。\n\
  \n**工作中最不喜欢的部分：** 数据质量，特别是数据的整洁度和可用性，始终是一个挑战。分析前的准备工作耗时且常常令人沮丧。当需要使用不同的数据源来获取所有正确的信息时，这种情况尤其困难。\n\
  \n**最喜欢的项目：** 凯特琳最喜欢的项目之一是在一家初创企业孵化器工作时参与的。她量化了该孵化器运营的经济影响，以展示资金投入的成效，并生成了预测报告。通过展示对本地和区域经济的直接与间接影响，这项分析被直接用于向地方和州政府展示投资回报率（ROI），从而成功争取到了资金。这项工作的具体内容包括量化他们所资助的初创企业活动所创造的就业岗位和工资，并利用预设模型确定总体的间接经济影响。它为“将税收资金投入该组织能产生多少投资回报率？”这个问题赋予了具体的价值。\n\
  \n**最常用的技能：** 她最常使用的两项技能是逻辑推理和灵活叙事，这两项都依赖于沟通能力。推理还需要深刻理解，这来自于积极倾听利益相关者和其他知情人士的意见。积极倾听对于探究表面问题背后的本质、确定分析结果将如何被使用以及了解谁会受到影响至关重要。令她惊讶的一件事是，她每天使用的很多技能都来自于她在完全不同的领域（如表演和教学）的经历。另一个来自商业经验的重要技能，就是领域知识与商业敏锐度的结合，即从全局高度理解所在领域和业务。\n\
  \n**当前主要使用的工具：** 凯特琳大量使用`Excel`和`Google Sheets`，因为她所做的大部分工作相对基础。但她也在用`Python`将一些重复性的分析任务进行自动化处理。她还使用`Domo`和`Looker\
  \ Studio`这两个非常简单的可视化工具。\n\n**数据科学的未来：** `GenAI`（生成式人工智能）显然正在彻底改变游戏规则，并将在未来继续发挥重要作用。人类在很长一段时间内（如果可能的话）不会被排除在流程之外，但`GenAI`将继续产生影响。`GenAI`分析在处理非结构化数据（如业务报告和其他文本文档）时尤其有效，因为它们可以被自动摘要，这会改变分析师的工作流程。此外，计算能力和硬件的发展将确保`GenAI`处理能力不断增强。\n\
  \n**优秀数据分析师和科学家应具备的素质：** 倾听并善于提问的能力，包括明确目标、决策驱动因素以及利益相关者是谁。培养商业敏锐度和领域知识，并理解它们如何与你的具体工作相关联，这一点很重要。最后，解决问题的创造力非常有价值。这可以通过广泛思考分析的不同角度来找到最具影响力的方案。\n\
  \n**给未来数据科学家的建议：** 在你感兴趣的领域建立行业知识。这能让你的任何分析都更具洞察力，并使你更容易进入该行业。\n\n*凯特琳是一位数据专业人士，她拥有帮助多个行业公司更好地理解其数据与影响力的经验。*\n\
  \n脚注 1\n\n\n\n# 20. 规模的重要性：可扩展性与云\n\n## 引言\n\n“云”无疑是当下的热门词汇，但它是如何兴起的呢？从历史上看，企业依靠*本地部署*计算机（on-premise\
  \ computers 的简称）运营——他们在服务器机房（塞满服务器机架的巨大会客）或更大的数据中心内，将许多称为服务器的、薄而宽的计算机塞进机架插槽中。*服务器*在很多方面与普通计算机相似，但体积更大、内存和磁盘容量也更大，不过它通常不连接显示器或键盘，而是通过公司网络进行访问。图\
  \ 20-1 展示了几台服务器的外观。\n\n![](img/628533_1_En_20_Fig1_HTML.jpg)\n\n一个装有多组机架的服务器机房，机架上摆满了黑色服务器单元和不同颜色的线缆。服务器带有指示灯和标签，线缆整齐地连接至各单元。房间光线充足，突出了设备的细节和结构。\n\
  \n**图 20-1**  多组服务器机架的外观。来源：“机柜中的网络服务器”，摄影：Sergei Starostin，可访问 `https://www.pexels.com/photo/network-servers-on-an-enclosure-6466141/`\n\
  \n本地数据中心对于企业的多数运营至关重要。公司的网站和内网都运行在服务器上。所有数据库、电子邮件以及公司为员工搭建的共享工具（用于那些无法直接安装在个人电脑上的功能）也都存放在数据中心的服务器中。数据中心还托管着公司的网络设备。\n\
  \n服务器曾是人们处理大量数据的唯一途径，因此对数据工作者来说也至关重要。当程序员或其他人员的个人电脑无法处理数据时，他们会登录到服务器上（通常运行着某种 Linux\
  \ 操作系统），通过一些命令行操作来运行代码。有些公司偏爱 Windows 服务器，这类服务器可能更易用，因为它们拥有与个人电脑几乎完全相同的图形用户界面。\n\
  \n几十年来，企业一直以这种方式运营，但运行数据中心的成本高昂，原因有很多——硬件（服务器等）价格不菲，设备产生大量热量导致冷却房间既重要又昂贵，需要大量员工进行管理，物理安全也费时费力且可能花费不菲。因此，云计算提供了一种革命性的替代方案。公司虽然无法完全舍弃硬件，但可以大幅缩减其规模。\n\
  \n如今，*云计算*仅指使用可通过互联网访问的计算机，因此这些计算机可以位于几乎任何地方。我们将重点讨论云计算、并行与分布式计算，以及可扩展性在当今的重要性。\n\
  \n## 真实世界中可扩展性与云的例子\n\n云技术开启了许多仅依靠数据中心无法实现或非常难以实现的可能性。这既源于位置因素（你所做的事情需要处于同一个有线网络中），也源于可扩展性——有时在短时间内需要的计算和存储能力超过了长期拥有这些资源的价值，有时又难以跟上需求。这里我们将看两个例子，两者都体现了可扩展性的重要性，其中一个例子还涉及了位置因素。\n\
  \n### 示例 1：数字网球锦标赛\n\n2021 年澳大利亚网球公开赛正值疫情期间，但主办方仍希望举办一场有球迷和赞助商参与的大型活动。他们使用名为 Meridian（由\
  \ Infosys 创建）的云平台创建了一个名为“虚拟中心”的虚拟空间，为球迷和赞助商提供了沉浸式体验。[⁵¹] 事实上，他们在 2019 年澳网就已经开启了数字化转型，但在\
  \ 2021 年将各方面都大幅扩展了。如果没有云技术，这几乎是无法实现的——它让人们能够观看比赛、与他人互动，并在比赛期间和场外获取大量额外信息和体验。他们开设了一家销售服装和其他装备的商店，虚拟模特可以从不同角度展示商品。对于比赛，他们提供了基于\
  \ 3D 驱动的动画，并在每次击球时叠加数据图层，包括速度、旋转和发球落点等实时分析数据。他们利用机器学习技术提取比赛精彩片段，其中包含客观特征（如击球速度等物理方面）和略为主观的特征（如观众反应和球员情绪）。他们还提供了虚拟体验，如幕后参观、音乐会、网球训练营和其他现场活动。他们对结果非常满意，因此在疫情后的未来几届澳网中继续保留了大部分此类功能，并提供了关于击球类型、球员回合分析和比赛节奏的详尽统计数据和可视化图表。\n\
  \n### 示例 2：面向大众的音乐\n\n音乐平台 Spotify 在几年前就转向了云，但其收益是立竿见影且持久的。[⁵²] 这家公司于 2008 年才成立，当时云服务尚未问世，因此他们的一切都内部完成，运营着自己的本地数据中心。他们在\
  \ 2011 年突破了 100 万用户大关，并持续快速增长。到 2015 年，他们的四个数据中心已不堪重负，并考虑建造更多的数据中心来满足日益增长的用户群和工程师的需求。于是，他们开始考虑云解决方案。\n\
  \n即使在那个时候，谷歌、微软和亚马逊都已提供云平台，但功能还相对初级。经过一番考虑，他们选择了谷歌云平台（GCP）。实际上，他们的迁移过程非常顺利，仅由六人管理，但所有工程团队都参与其中，对其大部分基础设施进行了所谓的“直接迁移”，这意味着他们基本上按原样移动了数据和流程，而没有重写任何东西（尽管有一些必要的重写）。这涉及迁移来自\
  \ 100 个不同团队的 1,200 个在线流程，每天执行这些流程超过 20,000 次，因此并非易事。\n\n其影响是深远的，他们得以关闭数据中心——第一个于\
  \ 2017 年关闭，另外三个于 2018 年关闭。最大的两个好处是：当数据存储需求增长时，扩展变得非常容易；以及 GCP 能完全确保客户数据的隐私。他们的客户每天播放音乐达数十亿次。Spotify\
  \ 的工程师可以专注于他们的核心业务——利用 GCP 提供的自动化和其他省时工具来服务这些客户。他们还可以轻松使用 GCP 提供的许多其他服务，包括极具价值的数据分析和机器学习服务。\n\
  \n\n## 本地部署、虚拟机与云端\n\n上文我谈到人们如何登录服务器处理更大规模的数据工作，但严格来说，他们通常并非直接登录服务器。相反，服务器上会创建多个*虚拟机*（`VM`），顾名思义，它们就像是虚拟的“计算机”——你可以登录进去，它看起来、用起来都像一台计算机，但实际上完全存在于某台特定的服务器上，并被分配了该服务器的一部分内存和磁盘空间。它可以配置任意操作系统。用户获得了该`VM`的访问权限后登录进去，感觉就像登录了一台普通计算机。用户可以安装软件、打开程序、正常运行，必要时还可以重启（只不过没有物理电源按钮）。实际上，`VM`中能进行的操作通常有限制（多出于安全原因），而且它们经常运行缓慢、延迟较高，但从概念上讲，它们的功能与普通计算机无异。\n\
  \n由于虚拟机是由软件创建的，因此可以配置成你需要的任何大小（取决于 IT 部门是否愿意给你分配一台足够大的）。尽管并非完美，但这些方案确实提供了一定的*可扩展性*，即代码处理更大规模且通常日益增长的数据量的能力。但这同时也意味着，*代码优化*（让程序运行更高效，从而减少时间和资源消耗的工作）对于大多数从事数据工作的人来说至关重要。另外两种计算方式——并行计算（将代码拆分成可同时运行的部分）和分布式计算（将代码片段发送到不同服务器，以利用更多的内存和磁盘空间）——也常常协同作用。\n\
  \n这几乎是唯一的方式，所以十五年前没人称之为“本地部署”。随着互联网的出现，选择范围得以扩展。如今，虽然本地部署依然存在，但云计算正日益普及。有一点很重要：也可以采用混合模式——一些公司既有数据中心，又使用云服务。有时这是因为监管要求，比如银行面临的那些问题。例如，最敏感的数据或任何与合规性相关的数据可能保留在公司自己的数据中心内，而其他所有数据则放在云端。不过，这并非绝对必要，因为云服务提供商也提供相关的监管服务，可以帮助管理此类事务。\n\
  \n## “大数据”与规模问题\n\n我之前提到过“大数据”这个词，它被以多种方式使用，因为它还不是一个精确的术语，但基本上指代需要大量算力才能处理的海量数据，通常超出了单台计算机的处理能力。不过，它正变得日益规范化，现在大数据有几个“V”，具体取决于你参考的“专家”网站：体量（volume）、速度（velocity）、多样性（variability）和真实性（veracity）。\n\
  \n*大数据体量*指的是日常生活产生的海量数据，并且由于如今存储成本大幅降低，这些数据通常从许多不同来源汇集到更集中的地方。这也与*大数据多样性*相关，因为数据来源众多。*大数据速度*关乎数据生成的速度，来自购物交易、金融交易和社交媒体活动等实时数据采集。*大数据真实性*涉及数据的准确性和可靠性，因为这些特性至关重要。还有另一个\
  \ V 通常不被视为核心支柱，但却是隐含的前提——价值（value）。如果数据本身没有价值，其他 V 都毫无意义。\n\n大数据的出现引发了规模问题。实际上，这个问题由来已久——代码或仪表板通常使用数据的子集编写（这实际上是标准做法，因为速度更快），但连接到真实数据时，性能表现会很差。这就是程序未能良好扩展的实例。通过代码优化来提高代码效率几十年来一直是软件工程的一部分。在过去，这需要深入了解程序将运行的特定硬件（处理器和磁盘），并在编程语言中直接管理和改进内存管理。大多数现代编程语言会自动处理内存管理，因此如今程序员通常无需过多处理这个问题。\n\
  \n当你试图处理大量数据时，无论这些数据是否被视为“大数据”，这个问题都会暴露出来。一些真正的大数据工具能让这变得容易，但了解一些提升代码效率的知识仍然很重要。这通常涉及理解`ML`算法的工作原理，以及其他技术，如交叉验证、网格搜索和其他常见的`ML`技术。同时，了解一些经典的计算机科学数据结构和算法也会有所帮助。\n\
  \n\n\n# 分布式与并行计算\n\n传统上，当你运行一个程序时，它会在计算机的内存和磁盘驱动器中按步骤依次执行。一步接一步地运行称为*顺序计算*，而在本地机器上运行通常被称为本地运行。如今，这种基本方法在云环境中也很常见——你仍然在云中的单台机器上运行顺序程序，而非在个人电脑上。\n\
  \n有一种替代顺序计算的方法称为*并行计算*，它将程序拆分为不同步骤并同时（并行）运行。无论是你的个人电脑还是云计算系统，在多核处理器中，每个核心都能处理一个进程。因此，一个四核处理器可以同时运行四个并行进程。其主要优势显而易见：由于无需等待每个步骤完成后再开始下一步，总耗时将大大缩短。\n\
  \n从概念上看，并行计算非常理想，但这要求代码能够拆分为可独立运行的步骤。因此，你不能简单地将已有的顺序代码直接放入支持并行计算的系统中。代码必须告诉计算机如何进行拆分。虽然有工具可以在某种程度上自动实现这一点，但通常并没有那么简单。\n\
  \n假设你有一个机器学习流水线：清洗和准备游戏数据、训练模型、对数千款游戏运行预测、并将结果上传至数据表——你无法对整个流水线进行并行化。根据具体情况，其中几个步骤或许可以并行处理。数据清洗和准备工作可以部分并行，例如清洗和依赖于外部信息或仅基于行数据的特征生成。此时，我们可以将大型数据集拆分为若干较小的子集并分别执行这些步骤。然而，如果存在需要整列数值的聚合操作，则无法在拆分后的数据集上完成。部分并行训练可能可行也可能不可行（取决于算法），但最终所有结果都必须汇集在一起以完成最后步骤。预测很可能可以并行进行——只要有足够多的处理器，每款游戏都可以与其他游戏同时运行。\n\
  \n并行计算通常与*分布式计算*相伴相生，后者是指将不同的代码步骤分发到不同的计算机上执行。在并行计算的语境中，这意味着将程序拆分为多个部分，分别在不同计算机上运行，然后将结果传回原始计算机，由原始程序将结果拼接完整。但任何在不同计算机上运行并相互通信的系统都可算作分布式计算，例如万维网、分布式数据库、大型多人在线游戏，甚至蜂窝网络。\n\
  \n有时人们会这样区分并行计算和分布式计算：在并行计算中，代码所发送到的所有处理器共享同一块内存（比如利用个人电脑四核处理器但依然使用系统单一内存的程序）；而在分布式计算中，每个处理器都有各自独立的内存（比如一种病毒被发送到网络中的每台个人计算机上运行并传回信息）。\n\
  \n对于大多数数据科学家的日常工作而言，这些区别并不至关重要，但当处理大规模数据需要应用这些技术时，理解并行与分布式的基础知识会非常有用。\n\n# 虚拟机与容器\n\
  \n上文我们讨论了虚拟机的概念，但它们的一个关键用途在于：每台虚拟机都是一个已知实体且被视为隔离环境——操作系统、编程语言、库等版本的更新都必须经过慎重考虑，因为这会影响到该机器上的所有内容。一个重要的问题是：由于我们希望各应用程序在各自的虚拟机中保持隔离，为每个应用程序运行一整个虚拟机的成本很高，因为它会占用大量分配的内存和处理器资源。\n\
  \n针对在单台虚拟机上运行多个应用程序的问题，一种流行的解决方案是容器。*容器*在概念上与虚拟机类似——它们也配置了特定的语言、库等——但不同容器可以共享底层的操作系统，从而显著降低成本，因为它们更高效地利用宿主系统的资源。这也使容器易于扩展。通常，你不会在一个容器中放入多个应用程序。请注意，你可以在任何计算机（包括虚拟机）上运行容器，关键在于每个容器都是隔离的。\n\
  \n如今，虚拟机与容器通常部署在云环境中，我们将在下文讨论这一点。\n\n\n\n## DevOps 与 MLOps  \n\n“DevOps”是你在技术领域经常会听到的另一个流行词。`DevOps`\
  \ 并没有一个严格的定义，但它基本上既是一种源于敏捷思维的哲学，也是一种方法论，它鼓励从开发人员到测试人员，再到代码仓库管理者以及实际部署人员等所有参与软件部署的人员进行协作。它强调自动化、精益原则、衡量、协作和共享文化。数据科学家并不总是需要为此操心，但理解其运作方式会有所帮助，有时你也需要处理相关问题。\
  \  \n\n自动化在 DevOps 中扮演着重要角色。软件测试，以及构建和发布（即软件在准备部署的状态下最终定型并实际部署的过程）通常都是自动化的。其他与开发相关的方面，例如为开发创建环境以及其他任何容易出错且可以自动化的工作，也会被自动化。它通常与另一个缩写词\
  \ `CI/CD`（持续集成/持续部署）联系在一起，这两者都需要上述提到的自动化。`CI` 指的是定期的代码集成和测试，而 `CD` 指的是代码可靠地、通过正确的环境进行部署。\
  \  \n\n所有这些都意味着更快的开发和产品发布速度，以及更迅速的用户反馈。许多大公司都非常看重这种速度，据说亚马逊会让每一位新入职的软件工程师在入职第一天就对代码库做一次真实的修改并将其部署。但这不仅仅是更快，通常也会更好——更可靠、更安全。开发方与运维方之间的沟通与协作对这种方法论至关重要。\
  \  \n\n`MLOps` 相当于机器学习领域的 DevOps。与 DevOps 一样，`MLOps` 关注的是机器学习解决方案的开发、部署以及两者之间的所有环节。这指的是将代码、特征存储（见下文）和模型部署到生产环境中（并非每次都必须全部部署）。在成熟度不高的组织中，数据科学家可能永远不需要完整的\
  \ MLOps，因为他们并不需要将代码部署到任何生产系统，但会遵循其中一部分，比如版本控制和某些自动化。许多建模前的工作，即使不投入生产，也能从 MLOps 实践中受益。\
  \  \n\n与 DevOps 一样，MLOps 也由自动化驱动。我们首先来谈谈机器学习工具的一般流程，通常称为*管道*。我们从数据准备开始，可能还会创建一个*特征存储*（一组经过定义和微调的特征，可以从使用的通用数据中派生出来），以及后续需要的训练和测试数据集。下一步是训练和调优，基本上就是准备模型。我们进行实验来选择算法和参数，然后训练最终模型。最后一步是部署（隐含的第四步是监控，以便检测模型漂移和其他需要重新训练的情况）。在部署中，模型和特征存储，以及任何处理传入数据的代码都会被部署到位。这就是从开发到部署的端到端流程，现在系统已准备好供最终用户使用。\
  \  \n\n## 云服务与云计算  \n\n从根本上说，云计算就是在互联网上进行计算。任何你使用的、通过网站而不是下载软件（无论是否联网都能工作）来操作的服务，都是云计算。那些要求你联网才能使用的软件，即使程序本身安装在你的电脑上，也属于云计算。Gmail\
  \ 和大多数电子邮件服务都是云服务，即使你使用的是电脑上安装的 Outlook。你的电子邮件实际上是一个运行在云端的应用程序，因为它位于某个服务器上，而网站（或\
  \ Outlook）只是让你能够查看它。Slack、Steam 和 Zoom 是基于云的应用的另外一些例子，你虽然安装了软件，但必须联网才能完全使用它。像在线购物、网上银行和社交媒体这类网页应用则完全只在浏览器中运行。那些在线管理许可证，但不需要你使用时一直联网的产品，比如\
  \ Adobe 产品和 Microsoft Office 360，尽管可以离线工作，但同样使用了云服务。  \n\n然而，当我们在数据科学领域谈论云计算时，我们关心的并非便利的基于互联网的应用。相反，我们指的是通过互联网交付和使用计算资源，如磁盘存储、处理能力（通常简称为“算力”）和软件。这使得用户无需使用公司内部的数据中心，甚至无需使用用户电脑上的实际资源（除了网页浏览器和运行它所需的东西）就能访问所有这些资源。这很有价值，因为它意味着我们可以获得可扩展性（使用大量资源）、弹性（根据当前需求自动调整所使用的资源）、资源池化（多种计算资源可供多位用户使用）以及按需付费（只为使用的内容付费）等好处。\
  \  \n\n云计算产品使用起来很方便。但用户通常对数据、自行编写的软件和管道的控制权较少，这些内容可能以专有方式存储，这带来了被供应商锁定的风险。*供应商锁定*指的是你无法轻易从一个程序或平台切换到另一个。例如，如果你在微软的云平台\
  \ Azure 上创建了一个数据管道，可能没有明确的方法将其导出到其他地方运行。当你根本无法将数据移出时，也会发生锁定。在你使用任何平台（例如我们接下来要讨论的主要云平台之一）时，这都是一个需要考虑的问题，在选择开发软件和管道的工具时应该加以考虑。\
  \  \n\n### 主要云平台  \n\n我们在上面看到，云平台基本上取代了数据中心，而数据中心基本上提供计算和内存。但云产品和服务仅仅是任何在互联网上运行的软件，它们数量众多，有些只提供一种或少数几种特定服务，但也有三个大型的、功能全面的平台（在\
  \ Spotify 的例子中提到过）：Microsoft Azure（微软 Azure）、Amazon Web Services（AWS，亚马逊云服务）和 Google\
  \ Cloud Platform（GCP，谷歌云平台）。如今，这三个平台都提供了海量且多样化的产品和服务，从数据存储、定时数据加载等基础服务，到聊天机器人、推荐引擎等高级\
  \ AI 服务，不一而足。由于可用的服务如此之多，很容易找到你需要的那一个并开始使用。  \n\n需要注意的是，本节中我讨论的服务更多是面向企业的。云平台可能非常昂贵，这通常是希望开始使用它们的公司（或者希望给员工足够权限以进行实际工作的公司）面临的一大障碍。\
  \  \n\n云平台对个人而言也可能很昂贵，并且很难弄清楚如何避免产生意外的费用。我下面提到的所有平台都提供免费选项，所以如果你真的想熟悉它们，值得去探索一下。\n\
  \n\n\n# Microsoft Azure\n\nAzure 始于 2008 年，经过多年的发展，现已包含超过 200 种产品和服务。他们在线提供了一个涵盖所有当前可用产品的详尽列表，并按类型进行了分类。这些产品包括存储、数据库、媒体、分析、AI\
  \ + 机器学习等等。其中一些工具的功能可能存在重叠，这通常是因为它们针对略微不同的用途进行了优化。\n\n我将在此处介绍一些最常用的产品。有很多数据存储选项以及迁移工具，可以轻松地将公司的数据迁移到\
  \ Azure。最流行的对象存储产品之一是 Azure Blob Storage，它具有高度的可扩展性和安全性，常用于机器学习应用。Azure Data Lake\
  \ Storage 支持高性能分析。Azure Files 适用于文件存储，并且安全且可扩展。\n\n一些最受欢迎的服务是 Azure 上的 SQL Server（也可以存在于虚拟机中）、Cosmos\
  \ DB 以及 Azure 自家的 SQL Database。SQL Server 是微软的数据库产品，早在云出现之前就已存在。Azure 还支持另外两种流行的\
  \ SQL 数据库：MySQL 和 PostgreSQL。Cosmos DB 旨在用于高性能应用程序中的数据，并提供良好的可扩展性。Azure 还有一个简单的名为\
  \ Table Storage 的 NoSQL 键值数据库。Azure Backup 是一项流行的服务，可用于备份您在 Azure 中的所有数据。\n\n还有许多用于移动和处理数据（提取、转换和加载，简称\
  \ ETL）的工具，但其中最受欢迎的是 Azure Data Factory (ADF)。它是一个工作流风格的工具，这意味着您可以将不同的节点拖到工作区上，并以数据可以从左到右流经它们的方式连接起来。每个节点执行一个特定的任务，比如从数据库提取数据，对其执行操作（通常是转换），以及写入数据库。它在很大程度上无需编码，这使得更多人能够使用它。它提供了许多转换和任务，包括许多分析任务。该工具可以从超过\
  \ 90 个不同的来源提取数据，包括来自其他云提供商的数据。\n\n`ADF` 是一个很好的低代码 ETL 工具。还有其他流行的工具，尤其是一个更高级的工具叫做\
  \ Databricks，它可以轻松地使用 Spark（一个分布式处理系统）进行大规模数据处理和分析，并且还允许轻松管理机器学习模型。Databricks 可用于执行许多其他操作，包括\
  \ ETL。前面提到的 Power BI 是一款流行的可视化工具，它在 Azure 中可用，使得与客户共享仪表板变得容易。Microsoft Fabric 是一个相对较新的综合性平台，内置了\
  \ AI，专为数据科学家和其他数据专业人士设计。\n\nAzure 提供的另一类产品属于“计算”标签。这些基本上是允许您使用计算机（处理器和内存）来运行代码的产品。Azure\
  \ 虚拟机 (VM) 允许您创建和配置一台“计算机”，可以用于特定产品——例如，安装特定的操作系统、安装特定版本的编程语言发行版、安装所有必需的库、代码库驻留并运行在其中，并设置好所有配置文件。您还可以在虚拟机内设置数据库。虚拟机可以是\
  \ Windows 或 Linux 系统。\n\n如上所述，虚拟机可能很昂贵，因此在应用基础架构世界中出现了容器和其他无服务器工具。Azure Kubernetes\
  \ Service 允许您轻松设置包含代码等内容的容器来运行应用程序。另一个流行的服务是 Azure Functions，它允许您在已设置的任何专用服务器（计算机）之外运行代码，这可以在其他现有的\
  \ Azure 对象上完成。Azure Functions 的一大优点是，您可以将它们绑定到这些对象并分配触发器，当另一个 Azure 对象上发生特定定义的事件时，它就会运行。\n\
  \n组织中另一个流行的产品是 Azure DevOps，它主要用于改善协作、规划和管理开发过程。它通过代码仓库、测试工具以及对持续集成和持续交付（CI/CD；一种管理代码部署到生产环境的方法）的支持来支撑软件开发。它还提供了看板和其他敏捷工具（我们将在下一章讨论的软件开发概念）。\n\
  \n这只是对 Azure 部分产品和服务的介绍——基本上只是冰山一角。此外，如上所述，这些产品之间存在大量的重叠和互连——例如，您可能正在 Databricks\
  \ 代码中从 Azure SQL Server 读取数据，或者在虚拟机内设置任意数量的服务。\n\n# Amazon Web Services\n\nAmazon\
  \ 在 2006 年推出了他们的云存储解决方案 Amazon Simple Storage Service (S3)，不久后又推出了其计算产品 Amazon Elastic\
  \ Compute Cloud (EC2)。这些是 AWS 平台中的前两个产品，但现在已有更多产品。他们还提供了一个在线列表，其中包含所有产品的可搜索区域。\n\
  \n与 Azure 一样，他们拥有许多服务，超过 200 种。每个产品类别都有自己的“决策指南”，可以帮助您根据自身情况选择合适的产品。例如，存储类别的指南讨论了不同类型的存储（块存储、文件存储和对象存储）以及针对每种类型的各种产品。Amazon\
  \ S3 是一个对象存储，可以通过 AWS Storage Gateway 与一些本地系统集成，这使得存储文件和迁移数据变得容易。AWS Backup 是另一个有用的产品，可用于备份系统中的不同类型文件。\n\
  \nAWS 也有几个数据库可供选择，用于常规数据库负载，包括两个关系型服务：RDS（支持 PostgreSQL、MySQL 和 SQL Server 等引擎）和\
  \ Aurora（为 PostgreSQL 和 MySQL 工作负载提供高性能和可扩展性），以及几个 NoSQL 数据库。它还提供 Redshift，用于快速处理非常大量的数据。\n\
  \n有几个分析工具可以让人们（即使是非技术人员）相对快速地处理数据并从中提取信息。Amazon Athena 允许用户快速进行实时数据探索、分析和可视化。AWS\
  \ Glue DataBrew 可以快速进行数据准备，Amazon QuickSight 让您可以快速进行可视化。还有更高级的工具供数据科学家使用，其中一些需要编码，例如全面的机器学习服务\
  \ Amazon SageMaker，它支持从数据准备到模型训练和部署的所有环节。它还集成了流行的 PyTorch 和 TensorFlow 框架，用于神经网络工作。其他工具不需要太多编码，例如用于自然语言处理的\
  \ Amazon Comprehend、用于构建聊天机器人的 Amazon Lex 以及用于基于视频任务的 Amazon Rekognition。\n\n在计算领域，Amazon\
  \ EC2 是经典选择，允许您运行虚拟服务器。Amazon Linux 允许您快速启动基于 Linux 的环境。Amazon Lambda 提供由事件触发的无服务器计算。AWS\
  \ Batch 允许您运行大型批处理作业，而无需管理大量基础设施。\n\nAWS 还拥有许多开发人员工具，包括用于内部应用程序的 AWS App Studio、用于编写和测试代码的\
  \ AWS CodeBuild，以及几个与特定语言相关的工具。\n\n\n\n#### Google Cloud\n\nGoogle 于 2008 年推出了 Google\
  \ App Engine 的预览版，允许人们创建易于扩展的 Web 应用。该服务于 2011 年结束预览，并成为主要的云平台提供商之一，如今提供超过 150 种产品和服务，详情可见其产品列表。^(⁵⁶)\n\
  \n`BigQuery` 是一个可用于多种用途（包括分析）的数据仓库。`Cloud Storage` 支持针对非结构化数据（如图片和视频）的对象存储，而 `Filestore`\
  \ 为用于企业应用的网络文件系统提供全托管文件存储。`Cloud SQL` 支持三种关系型数据库，并提供其他适用于 SQL Server 和 PostgreSQL\
  \ 的选项。此外，还有 NoSQL 选项 `Datastore`、`Cloud Spanner` 以及 `Cloud Bigtable`。`Dataform`\
  \ 允许您在 `BigQuery` 中运行 SQL 工作流。\n\nGoogle Cloud 中有多个可用于 ETL 流程的产品，包括 `Cloud Data\
  \ Fusion` 和 `Datastream`。`Cloud Data Fusion` 是一个全托管工具，允许用户通过可视化界面构建、管理和调度 ETL 任务。`Datastream`\
  \ 是一种变更数据捕获和复制服务，支持在数据库和存储服务之间移动数据。\n\n另一个重要工具是 `Dataplex`，它有助于管理即使分散在不同孤岛中的数据。`Spanner`\
  \ 允许将多种数据库（包括关系型数据库和 NoSQL）整合在一起。\n\n在分析领域，`BigLake` 统一了数据湖和数据仓库中的数据进行分分析，`Dataflow`\
  \ 是一个无服务器流式及批处理工具，专注于 ETL 和实时分析。`Document AI` 支持一些 NLP 工作，而 `Recommendations AI`\
  \ 是一个推荐引擎。`Vertex AI` 是一个通用型的分析和 AI 平台，提供多项具体功能，包括智能体构建器。\n\n在计算领域，有多个实用工具。`Dataproc`\
  \ 控制 `Spark` 和 `Hadoop` 集群，可用于处理大数据。`Compute Engine` 允许运行可定制的虚拟机。还有一些针对特定需求的计算工具，包括\
  \ `Cloud GPUs`（用于高负载处理和机器学习训练）和 `Cloud TPUs`（用于加速神经网络计算）。`Cloud Workstations` 是另一个适用于开发环境的选项。`Cloud\
  \ Run` 允许对容器化应用进行无服务器部署，`App Engine` 则提供了一个用于托管 Web 应用的无服务器平台。他们还通过 `Knative` 提供了基于\
  \ Kubernetes 的无服务器功能。\n\n\n\n## 关键要点与下一步\n\n在本章中，我们讨论了云、可扩展性以及与此相关的一切。这包括理解过去本地数据中心与现代云计算之间的差异，以及可扩展性、弹性、资源池化，以及按需付费的理念。我们谈到了大数据和可扩展性的重要性。我们还讨论了分布式计算和并行计算，这两者对于提升大规模作业的计算速度都至关重要。最后，我们了解了三大主流云平台及其部分功能。\n\
  \n在下一章中，我们将深入探讨数据科学项目管理，首先了解传统项目管理与现代软件开发管理。我们将概述如何使用看板方法管理数据科学项目，还会讨论项目完成后的相关步骤。\n\
  \n# 从业者档案：布米卡·沙阿\n\n**姓名：** 布米卡·布里延·沙阿\n\n**现任职位：** 容器技术工程经理\n\n**现任行业：** 零售业\n\n\
  **工作经验：** 科技领域 17 年，其中包含 3 年数据分析师、7 年云 DevOps、4 年平台解决方案经验\n\n**教育背景：**\n\n*   持有\
  \ Kubernetes、Azure 和谷歌云平台认证\n*   计算机科学硕士\n*   计算机科学学士\n\n*以下观点仅代表布米卡个人，与她的任何现任或历任雇主无关。*\n\
  \n### 背景\n\n青少年时期，布米卡就热爱计算机，并在学校里正式学习了计算机科学。顺理成章地，她攻读了计算机科学学士学位。大学期间，她实习并接触了软件工程、测试及其他重要环节，开始真正培养起软件开发者思维。此后，她继续攻读了计算机科学硕士，并持续参加课程以不断成长。\n\
  \n### 工作经历\n\n她的第一份工作是 ETL 开发工程师（提取、转换、加载——基本就是数据搬运），这是她首次在商业领域真正接触\"数据\"。她非常看重转换步骤的价值——将难以使用的数据变得有用。随后她转型为数据分析师，并持续提升数据技能。她享受数据可视化，因为它能展现数据中难以察觉的规律。沿着这条路径，她逐步迈向数据科学领域，学习了数据脱敏，随后对数据安全产生兴趣，这促使她的职业生涯再次小步转型。她调入云\
  \ DevOps 岗位，负责自动化基础设施和解决方案的开发，并热爱编写脚本。在该领域深耕后，她转入容器平台工程领域，如今带领着一个团队。\n\n## 语录精选\n\
  \n**最喜欢的工作部分：** 布米卡热爱所有工作中解决问题的环节，以及持续学习的过程。她还喜欢跨团队协作，让解决方案落地。她尤其享受打造可扩展的解决方案。\n\
  \n**最不喜欢的工作部分：** 平衡相互冲突的优先级有时令人沮丧。作为经理，她需确保团队工作与公司目标愿景一致，同时让利益相关者满意，这有时颇具挑战。更令人沮丧的是，别人对你的工作所需事项擅自决策。\n\
  \n**最喜欢的项目：** 她曾参与一个项目，旨在构建安全且可扩展的 Kubernetes 环境以缩短部署时间。她成功将部署时间缩短了 40%，帮助开发者避免了宕机。这对数据科学家尤其有用，因为他们也开始使用\
  \ Kubernetes。该平台提供了数据工具，包括数据脱敏功能。项目中值得关注的方面包括自动扩缩容、优化、降低运营成本，以及将单体工具迁移至微服务架构。\n\n\
  **最常用技能：** 按重要性排序：解决问题、批判性思维、沟通能力、领导力、技术专长\n\n**当前主要使用工具：** `Kubernetes`、`Terraform`、`Jenkins\
  \ CI/CD`流水线、云服务（`GCP`和`Azure`）、`Golang`、`SQL`\n\n**云的未来：** 所有行业都在向云计算和自动化迈进。这简化了应用部署，意味着\
  \ AI 工具既作为云和自动化工具的一部分，也作为被部署应用的一部分被广泛使用。\n\n**优秀技术人才的必备素质：** 好奇心、创造力与扎实的技术能力相结合。坚实的统计学基础。在恰当的时机进行沟通（不早不晚）。还需懂得如何从\
  \ AI 工具中获益——明确目标而非盲目使用。\n\n**给未来技术从业者的建议：** 参加开放日，结识同行，了解公司及各类岗位角色。然后专注打造你目标领域坚实的技术基础。\n\
  \n*布米卡是一位容器平台工程经理，拥有跨数据及其他技术领域的多元背景。*\n\n脚注 1 2 3 4 5 6\n\n# 21. 融会贯通：数据科学解决方案管理\n\
  \n## 引言\n\n上份工作求职面试时，我必问的问题之一是：\"你们使用什么开发方法论？\"我问这个是因为前公司强迫我们在同一看板上使用 Scrum，与软件开发者、数据开发者和\
  \ BI 开发者共事，结果行不通。\n\n但现实是，目前还没有公认的、成熟的数据科学项目管理方法。人们只是用 Scrum 等方式凑合。我将探讨管理数据科学项目时至关重要的各个方面，然后分享一种可能适合某些数据科学团队的管理方法。\n\
  \n## 项目管理\n\n项目管理是一门历史悠久的完整学科，在软件开发和工程领域已有许多相当标准的方法。所有这些方法都旨在明确需要完成的工作、制定时间表，并在项目过程中监控进度，确保一切落实。传统上只有一种管理方法——我们现在称之为瀑布模型。在瀑布范式下，一切都需要预先精心规划。当变更成本高昂或耗时费力时，这种方法尤为合理，因此大型建筑工程和工程项目确实需要它。\n\
  \n大学时代\"错误已铸成\"的轶事至今仍让我忍俊不禁。有传言说，我就读的工程学院那栋相对较新的建筑，顶层有一个永远空着的喷泉。据说在注水之前，他们核查了设计图，工程师显然忘记了计算水在楼板上的重量，装满水的喷泉会超过承重极限。这不像大多数软件\
  \ bug——你不能随手多扔几根工字钢来修补。这就是规划和管理如此重要的原因。\n\n\n\n### 通用项目管理方法论\n\n`项目管理知识体系`（`PMBOK`）是一套许多项目经理遵循的知识、术语和指南集合。其权威来源是`项目管理协会`出版的一本书，截至撰写本文时最新版本为\
  \ 2021 年发布的第七版。该协会提供两种认证，为进入项目管理领域的人们提供了常见途径。`PMBOK`相对传统且严谨，但在 2017 年的倒数第二个版本中增加了更灵活的做法。另一种项目管理方法是`受控环境下的项目`（`PRINCE2`）。该方法侧重于组织与控制，但也强调持续改进，使其比传统的`PMBOK`更具灵活性。然而，它在结构上仍然严谨，并最终需要大量的文档工作。\n\
  \n这两种方法都将项目划分为若干阶段。它们都定义了五个阶段，以下是`PMBOK`的五个阶段：\n\n1. **项目启动**：定义商业案例和项目目标，并识别利益相关者。\n\
  2. **项目规划**：定义范围，识别任务和子任务，制定时间表，确定资源（完成工作的人员和工具），制定预算，识别第三方供应商或工具需求，识别风险及缓解计划，定义质量和成功衡量标准，并确定与利益相关者的沟通方式。\n\
  3. **项目执行**：开展实际工作。\n4. **项目监控**（与执行并行）：确保基于既定因素和成功衡量标准，目标得以实现，工作按需正常推进。\n5. **项目收尾**：总结经验教训，并报告整个项目情况。\n\
  \n这两种方法都源自瀑布式项目管理方法论，该方法属于前期工作繁重型，需要在工作开始前进行大量规划。在`PMBOK`中，据说任何项目约 50%的时间都花在第二个阶段，即项目规划上。其余大部分时间则花在项目执行上。我们将在下文进一步讨论这些内容。\n\
  \n在传统项目管理中，*项目经理*（`PM`）是监督整个流程的人，对项目的成功至关重要，包括为项目成功获取外部资源，无论是人员、工具还是数据。`PM`是代表项目向公司其他部门展示项目的人，而项目规划步骤正是他们提出申请以获取资金和资源的地方。\n\
  \n## 项目规划\n\n在传统项目规划中，“做什么”和“怎么做”至关重要，“做什么”决定了项目的整体目标，“怎么做”则明确了实现方式。以下是十个基本步骤，将在下文讨论：\n\
  \n1. 定义项目目标和范围。\n2. 描述项目。\n3. 制定详细工作计划。\n4. 定义里程碑和可交付成果。\n5. 确定所需人员。\n6. 定义时间表。\n\
  7. 制定预算。\n8. 定义变更控制流程。\n9. 识别风险。\n10. 定义政策和指导方针。\n\n流程中的第一个实际步骤是定义清晰的项目目标，并界定该目标的边界（即范围）。这包括获取利益相关者的需求。接下来，应对项目进行描述。这需要提出几个问题，包括（但不限于）将要做什么以及何时做？将交付什么？谁负责验收项目完成？开发者和用户的责任是什么？如何衡量进度？至此，我们已定义了客户的需求以及项目范围。接下来，必须制定包含细节的实际工作计划，包括里程碑和可交付成果。\n\
  \n流程中的后续步骤涉及定义项目的不同方面，包括人员需求、时间表、预算、变更控制流程、风险以及政策和指导方针。这通常由项目经理向公司获取信息来完成，许多公司拥有可自动处理部分工作的工具。一旦分配了人员，结合详细的工作计划，就可以帮助制定时间表。进而可以制定出预算。政策和指导方针对于明确项目中人员的角色和职责是必需的。最后，定义变更控制流程。这涉及任何类型的变更，包括人员、角色以及项目产品本身的修改。\n\
  \n在传统方法中，任何正在创建的系统或对象的设计都会在规划阶段完成，因为这是制定时间表、预算、识别资源等工作的前提。\n\n## 项目执行\n\n当所有事项都已规划好，资源也已到位时，项目执行就开始了。这就是实际的工作，无论是设计、编码还是其他活动。人们将致力于达成里程碑、准备可交付成果。此时，`PM`的职责是确保一切按计划进行，如果需要额外支持（例如，更多的人手或工具），他们将为此争取。`PM`还需让利益相关者了解最新情况。在此阶段可能会提出变更请求，`PM`会将其带回团队讨论。\n\
  \n当所有工作都达到既定的完成点（通常由规划阶段确定的一个人员或团队来决定）时，项目执行便终止。\n\n## 软件项目管理\n\n尽管上述两种通用项目管理方法相对严谨，但它们已适应了`敏捷`方法（这是一种全新的、比瀑布式方法适应性更强的管理方式，下文将讨论），因此在软件开发中相当常见。尽管我强烈认为适用于软件开发的项目管理方法不能未经修改就直接用于数据科学，但数据科学团队被迫遵循这些方法的现象却非常普遍。该领域尚未确立管理数据科学项目的良好方法论，这正是它们退而求其次采用其他方法的原因。尽管如此，`敏捷`软件开发方法论仍然为数据科学项目管理提供了良好的参考点。\n\
  \n几十年来，瀑布式方法一直是管理软件项目的方式。但一种名为`敏捷`的、完全不同的方法论范式已基本取代了它。`敏捷`的关键方面是由客户需求驱动的迭代式开发，并伴有来自客户的持续反馈。专注于尽早提供可工作的软件，并通过添加功能来改进它，是该方法的基本组成部分。最小可行产品（或`MVP`）是一个功能性的软件片段，它包含部分所需功能，随着产品开发会添加更多功能。这些方面使得流程异常灵活。它与前期工作极其繁重的瀑布式方法截然相反。只要确定好了基础框架和初始概念，你甚至可以在获取项目所有需求之前就开始`敏捷`项目的开发。两种最常见的特定`敏捷`方法是`Scrum`和`看板`。\n\
  \n\n\n## 项目规划\n\n尽管你可以更快地启动一个敏捷项目，但仍有项目前期工作要做。确定项目目标和范围（这涉及获取关键需求）仍然至关重要。项目需要被描述清楚，包括最终的需求收集，并且需要制定一份工作计划。在敏捷项目中，工作计划将是具体工作项的列表，保存在最常见的敏捷管理类型\
  \ Scrum（我们将在下文讨论）中所谓的“产品待办列表”中。由于项目刻意采用了敏捷性质，这个产品待办列表不一定是所有待办事项的完整记录。执行过程中可能会出现更多需求，这些需求可以添加到产品待办列表中。重要的里程碑和可交付成果会被确定，但这些在执行过程中也可能发生变化。其余文档不会像传统管理项目那样具体，但它们应该以某种形式存在。风险和相关人员需要被识别，并创建进度表和预算。最后，要定义变更控制流程，以及相关的政策和指南。\n\
  \n## 项目执行\n\n在软件项目中，进一步的系统设计可能发生在执行阶段，同样，所有的编码、基础测试、性能测试、质量保证和实施也都在此阶段进行。\n\n对于项目执行，Scrum\
  \ 的特点是称为冲刺（两到四周）的短开发周期、产品待办列表、冲刺各个阶段的一些特定会议，以及一个物理或虚拟的看板，所有进行中的用户故事都在上面跟踪。开发人员在每个冲刺开始时从产品待办列表中挑选用户故事，这些就是他们在该冲刺期间要完成的工作。各种会议被称为“仪式”，包括每日站会（非常简短的工作进展检查会议）、冲刺回顾（检视上一个冲刺的情况）、产品待办列表梳理（随着了解更多信息，向产品待办列表添加用户故事并改进其中的信息）、冲刺评审（演示开发进度）和冲刺计划。Scrum\
  \ 的理念是赋能开发人员和自我组织。\n\n看板则稍微宽松一些，但也有一个用于跟踪工作的可视化看板，任务卡片（虚拟或物理）在开发阶段从左向右移动。它也是迭代式的，旨在鼓励专注于较少量的任务（通常会对同时处理的任务数量进行限制）。它也很灵活，能够赋能开发人员，鼓励协作，并更容易快速发现障碍。\n\
  \n看板和 Scrum 看板都应定期更新，理想情况下是每天更新。许多团队都会有每日会议，他们会在会上通过移动物理或虚拟看板上的任务卡片来共同更新看板，或者只是回顾自上次会议以来所做的更改。\n\
  \n图 21-1 展示了一个典型的看板。状态分区几乎可以是任何内容，具体取决于它所用于的工作类型。这里展示的是用于软件开发的状态分区。在这个看板中，一个任务卡片/任务会从“用户故事”分区（产品待办列表）移动到“待办”，当它即将被开始处理时；然后一旦开始处理，就移动到“进行中”；接着当测试工作开始后，移动到“测试中”；最后当完成时，移动到“已完成”。Scrum\
  \ 看板看起来非常相似。Scrum 中唯一必需的状态是“待办”、“进行中”和“已完成”，但其他常见的状态还有“搁置”、“测试中”和“受阻”。\n\n![](img/628533_1_En_21_Fig1_HTML.jpg)\n\
  \n一个说明项目管理流程的流程图，包含五个列，分别标记为：`用户故事`、`待办`、`进行中`、`测试中`和`已完成`。每列上方都有一个图标：`用户故事`列上方是云朵图标，`待办`列上方是箭头图标，`进行中`列上方是一个人正在工作的图标，`测试中`列上方是一只手按按钮的图标，`已完成`列上方是一个勾选标记图标。该流程图直观地展示了从初始想法到任务完成的各工作流程阶段。\n\
  \n**图 21-1** 一个看板示例。来源：来自 [`https://pixabay.com/illustrations/work-work-process-to-organize-4057334/`](https://pixabay.com/illustrations/work-work-process-to-organize-4057334/)\
  \ 的“工作，工作流程，组织免版税库存插图”\n\n为了理解上述软件开发看板的工作方式，我们来看一个从零开始开发的餐厅销售点系统。销售点系统是餐厅用来接单和收款的系统。首先要做的是收集需求，这涉及到开发人员和/或项目经理与系统所服务的利益相关者进行沟通。这将包括确定诸如能够从菜单中选择食品项目这样的需求，这需要预先输入价格；以及能够创建包含多个项目的订单、计算小计、添加适当的税费、允许自定义小费、获取总金额、为总金额接受现金和/或刷信用卡、处理退货以及打印和/或通过电子邮件发送收据等能力。\n\
  \n一旦开发人员获得了利益相关者的需求，他们就会深入挖掘并提出一个解决方案，详细说明技术需求。由此，他们可以为系统需要完成的特定事项创建一个产品待办列表。这些通常被称为用户故事，并且它们应该尽可能小且边界明确，目标是尽可能少地依赖其他人或其他用户故事。以下是一些可能出现在产品待办列表中的示例：\n\
  \n- **数据库**：创建一个数据库来存储订单等。\n- **数据库**：创建一个表来存储项目。\n- **数据库**：创建一个表来存储项目价格。\n- ……\n\
  - **前端**：创建项目显示界面。\n- **前端**：使显示的项目可点击以弹出更多信息。\n- **前端**：为每个显示的项目添加可点击按钮和数量选择，以将其添加到数据库中的订单。\n\
  - **前端**：添加一个可点击的结账按钮，该按钮会打开一个订单摘要界面。\n- ……\n\n请注意，产品待办列表通常不包含在看板上，因为产品待办列表中的用户故事通常比看板上的空间多得多。上面的列表与需要完成的工作相比显然微不足道，并且也很清楚，某些用户故事依赖于其他用户故事完成后才能开始。这在大多数项目中是不可避免的。总会有许多用户故事彼此不依赖，可以由不同的开发人员同时处理，这就是为什么它在软件开发中运作得如此之好。\n\
  \n一旦有了产品待办列表中的用户故事，开发人员就会选择即将开始处理的用户故事，这些故事会进入上面图表中的“待办”列。这个分区能清晰地展示即将到来的工作。一旦开发人员开始处理某个用户故事，它就会被移到“进行中”列。准备就绪后，它会被移到“测试中”列，当测试完成（以及所有必要的更新）后，进入“已完成”列。当发现错误时，用户故事经常会被从“测试中”移回“进行中”，这个过程可能会重复，直到所有测试都通过。然后它就可以被移到“已完成”列。\n\
  \n值得指出的是，目标始终是让产品待办列表是“完整的”——列出所有需要完成的事项——但即使在软件开发中，这也很难做到，而且流程足够灵活，允许随时向产品待办列表添加用户故事。\n\
  \n由于 Scrum 和看板都非常适合软件开发，人们自然而然地尝试将这些方法应用于数据科学项目，但结果并不总是很好。在下一节中，我们将进一步讨论在数据科学项目中开展工作的方法。\n\
  \n\n\n# 数据科学解决方案开发方法论\n\n数据科学在许多方面看起来类似于软件开发，但大部分工作实际上截然不同。有时数据科学家会创建可部署的软件，这种情况下确实与软件开发相似。然而，大量数据工作、探索性分析、特征工程、不同模型的开发与测试、可视化方案的选择与准备，以及最终成果的整理，这些都无法完全套用软件开发方法。\n\
  \n在工作中，即使并不理想，你可能会被迫遵循 Scrum 或软件开发的看板方法，因此了解这些方法的运作方式会有所帮助。但若是你的团队尚未选定方法论呢？如果你足够幸运，能帮助团队确定运行数据科学项目的最佳方式，请继续往下阅读。\n\
  \n残酷的现实是，没有任何一种方法论能够统治数据科学的所有场景。但这并不意味着没有好的实践方法。\n\n## 项目规划\n\n即使你能更快地启动一个敏捷式项目，仍然需要完成项目的前期准备工作。虽然项目规划在软件项目中已很成熟，但在数据科学项目中却并非如此。不过，许多步骤是相同或相似的。让我们再次参考\
  \ CRISP-DM 框架，其前两个步骤就与项目的规划阶段相关。\n\n![](img/628533_1_En_21_Fig2_HTML.jpg)\n\n流程图展示了数据分析过程：从“业务理解”开始，接着是“数据理解”、“数据准备”、“探索性分析与建模”、“验证与评估”，最后到“可视化与呈现”。箭头指示各阶段之间的流向，并从“可视化与呈现”返回“业务理解”，形成一个迭代循环。\n\
  \n图 21-2 CRISP-DM 数据科学生命周期\n\n业务理解是规划的一部分。数据理解也部分包含在规划中，但它同样可以是执行阶段的内容。规划步骤列举如下：\n\
  \n1.  定义项目目标、范围和高层需求（业务理解）。\n2.  确定候选数据源、获取访问权限的方法以及数据所有者（数据理解）。\n3.  进行预探索性数据分析，以确定数据中的候选字段以及它们是否能提供必要信息（数据理解）（根据需要返回步骤\
  \ 2）。\n4.  创建当前已知任务的待办列表，主要是探索性数据分析任务。\n5.  定义里程碑和可交付成果。\n6.  确定所需人员。\n7.  制定时间表。\n\
  8.  确定预算。\n9.  定义变更控制流程。\n10. 识别风险。\n11. 定义政策和指南。\n\n第一步是定义项目目标、范围和高层需求。如果工作涉及仪表盘，此时还需创建其原型。在数据科学项目中，数据至关重要，因此在规划时必须考虑这一点。需要识别并充分探索可能的数据源，以确保它们能够满足利益相关者的需求。其余任务也应完成，但与软件项目一样，它们不像传统项目规划那样严格或完备。接下来创建待办列表，但由于此时只了解所有任务的一小部分，因此大部分任务会后续添加。可以定义关键的里程碑和可交付成果。此时可以确定人员、制定时间表、确定预算并识别风险，但所有这些都可能需要根据项目执行过程中的实际情况进行修订。变更管理流程以及任何必要的政策和指南也可以在此处创建。\n\
  \n## 项目执行\n\n对于项目执行而言，无论是软件开发中使用的看板还是 Scrum，都不完全适合数据科学，但经过调整的看板方法可行性更高。幸运的是，看板方法本身很灵活。使用看板时，核心思路是存在一个“工作项”，可以将其从左到右在不同状态间移动，直到最终进入“已完成”列。在软件开发中，这个工作项是一个独立的软件组件或任务，可以与其他组件或任务并行处理，但数据科学任务并非如此。数据科学中的大部分工作都依赖于前期探索的发现，无法像软件开发那样预先详细规划。很多时候，我们原本认为某个方向可行，但深入研究后发现并非良策，于是便不再继续。或者我们发现实际工作量远超预期，从而衍生出更多工作。\n\
  \n例如，考虑一个“准备用于模型的数据源”这样的任务。它并不像其他任务那样直接明了。假设这是关于 B 商店所有产品的销售数据，与之相关的基本任务如下（有些任务与其他事项相关，且并非所有任务都必须执行）：\n\
  \n1.  查找所有相关数据源。\n2.  获取 B 商店销售数据的访问权限（数据库访问）。\n3.  对 B 商店销售数据进行探索性数据分析。\n4.  探索识别出的任何异常数据。\n\
  5.  判断 B 商店销售数据是否足以用于建模，或者是否需要补充其他数据。\n6.  清理 B 商店销售数据。\n7.  再次对 B 商店销售数据进行探索性数据分析。\n\
  8.  对 B 商店销售数据进行数据预处理。\n9.  将 B 商店销售数据与其他数据合并。\n10. 对数据进行特征工程。\n\n至此，该数据源才可用于建模。现在，考虑创建一个用于预测的模型的任务。这部分工作甚至要等到特征工程数据准备就绪后才能开始，因此它远在项目启动之后。数据准备工作通常占据项目\
  \ 80%-90% 的时间。此外，即便我们准备好开始构建模型，它本身也并非单一任务。通常会有实验环节——我们会尝试几种不同的算法、不同的数据拆分方式和不同的参数。为每种算法创建一个独立的用户故事可能更合理。每个故事的工作内容包括：为特定算法准备必要的数据变更、编写运行交叉验证和超参数调优的代码、执行代码并收集性能指标。至此，该故事可能就算完成了。后续可能还有一个故事，负责评估所有针对不同算法的故事结果。\n\
  \n另一方面，一个成熟的团队或许可以通过自动化将“构建模型”视为一个单一任务。可以编写代码，让系统自动尝试所有指定的算法，并运行指定的交叉验证和超参数值。实际运行时间可能相对较短——对于较小的数据集甚至只需几分钟。但编写运行这些实验的代码则需要更长的时间。与软件开发一样，这段代码也需要经过测试。而在之前那种为每种算法创建单独故事的方法中，每个故事也都需要编写相应的代码。\n\
  \n显然，建模任务与数据源准备任务截然不同。很难看出它们有哪些共同的具体状态。但它们确实拥有基本状态：待办、进行中和已完成。考虑到这一点，并再次参考 CRISP-DM\
  \ 生命周期，我们便能找到前进的方向。见图 21-2 以再次查看 CRISP-DM 模型。\n\n\n\n### 分步式数据科学看板\n\n我们可以做的是将生命周期中的每个阶段设置为一个*泳道*，即简单看板上的横向分组。你知道，在这个过程中存在大量交互，需要返回前一个阶段重新审视某些内容或处理新事务。大部分交互发生在数据理解、数据准备、探索性分析和建模步骤中。业务理解通常会在项目开始时完成，而可视化、演示、验证和评估可能要到接近尾声时才会进行。即便如此，这也并非定论，而这里提议的看板结构可以适应任何情况。我们将沿用基本的状态，但增加一个`Blocked`（受阻）列，以便在出现挑战时提高可见性。提议的看板样式见图\
  \ 21-3。\n\n![](img/628533_1_En_21_Fig3_HTML.jpg)\n\n看板表格，列标题为`待办`、`进行中`、`受阻`和`完成`。行包括`业务理解`、`数据理解`、`数据准备`、`分析与建模`、`验证与评估`以及`可视化与演示`。该表用于跟踪项目任务和进度。\n\
  \n**图 21-3**  \n分步式数据科学看板\n\n### 看板上的示例项目\n\n为了说明分步式数据科学看板如何运作，以及我们如何运行一个数据科学项目，我将以近期参与的一个真实项目为例进行讲解。在该项目中，我们希望通过一些计算来确定*增量*，即新产品发布所带来的真正新销售额。每当我们发布新产品时，它在潜在客户方面通常与其他一个或多个产品相似。我们知道有些客户会转换——他们会购买新产品，但停止购买旧产品。这种情况被称为旧产品的*蚕食*，即我们因自己的另一款产品而失去销售额。如果只有这些人在购买新产品，那将毫无益处。我们希望看到的是，新旧产品的总销售额高于如果从未发布新产品时的销售额。因此，我们根据旧产品的历史销售数据，预测了新产品发布后的销售额。蚕食和增量是基于预测和实际销售值的快速计算。这个项目的数据科学部分在于对原产品的预测。\n\
  \n我将逐步讲解我们在几个月内所完成的项目工作，并每月展示一次看板的快照。实际上，看板的变动频率会高得多，但通过这种方式，你可以看到事情随着时间的推移是如何进展的。内容非常详细，你可能会发现，仅仅浏览这些月度看板就能让你对项目的流程有一个充分的了解。另一方面，如果你从未在公司做过数据科学工作，这可以帮助你理解实际项目的工作方式。\n\
  \n我们首先与利益相关者召开了启动会议来收集基本需求，因此这部分内容在项目第一周结束时，已位于图 21-4 的`完成`列中。他们的需求相当直接，但数据情况要复杂得多。我总是会先建立一个项目文档，概述总体计划和粗略的时间估算，该文档不仅记录了利益相关者的需求，还作为一个工作文档，我们可以随着项目推进进行修改，保存数据来源等信息。同时，我们还根据他们已知的信息探索了可能的数据来源，并联系了其他人员（这感觉有点像大海捞针，偶尔才能成功）。这两项都处于`进行中`状态。我们有两项已知且即将开展的工作列在`待办`列中：获得项目文档完成草稿的批准，以及确定我们将使用的数据来源的最终列表（我们不会再添加新的）。请注意，所有内容仍位于`业务理解`泳道中，因为我们才刚刚起步。\n\
  \n![](img/628533_1_En_21_Fig4_HTML.jpg)\n\n第 1 周项目管理的看板。列：`待办`、`进行中`、`受阻`和`完成`。行：`业务理解`、`数据理解`、`数据准备`、`分析与建模`、`验证与评估`和`可视化与演示`。任务包括`获取项目计划批准`、`列出数据来源`、`创建项目计划`、`探索可能的数据来源`和`与利益相关者会面（第一次）`。\n\
  \n**图 21-4**  \n增量项目第一周结束时的分步式数据科学看板\n\n\n\n四周后，我们取得了不错的进展，你可以在图 21-5 中看到。这次，我们在“业务理解”和“数据理解”泳道中都有故事。不过，大部分“业务理解”的故事已经完成了——这个项目的数据并不确定，我们不断听到其他可能性。严格来说，我曾说过不会加入任何新的数据源，但利益相关者希望我们尽可能多地使用数据，所以我们一直在密切关注。我们主要在“数据理解”泳道中工作，在与某位了解第一份销售数据源的人开会以更好地理解某些列之后，我们仍在对该数据源进行`EDA`。我们开始对市场份额数据进行`EDA`，但发现缺少`SKU`，因此无法将其与我们现有的`SKU`列表进行关联。我们想出了如何利用另一张表从`UPC`获取`SKU`，却发现在那个数据源中的`UPC`是错误的，末尾数字被截断了。一位数据工程师正在修复这个问题，因此我们不得不暂停该项工作等待他们。我们粗略地看了一眼第二个销售数据源，意识到我们需要更多知识，因此我们正试图与该数据源的一位`SME`安排一次会议。\n\
  \n![](img/628533_1_En_21_Fig5_HTML.jpg)\n\n第 5 周看板，包含列：待办、进行中、受阻、已完成。行包括：业务理解、数据理解、数据准备、分析与建模、验证与评估、可视化与展示。任务包括：探索数据源、对销售数据进行`EDA`、与`SME`会议、创建项目计划。任务按列分布以显示其状态。\n\
  \n**图 21-5** 增量性项目第 5 周末的看板\n\n到第 9 周结束时，我们取得了很大进展，现在正在“数据准备”泳道中工作。见图 21-6。我们仍在假设等待更多数据源的信息，尽管这项工作即将结束，因为项目进行到这一步，我们无法再接受任何新内容。但过去一个月发生的一件事是，我们必须添加一个新的数据源，因此对其进行`EDA`的任务被添加到了“数据理解”的“待办”列中。我们已经完成了三个“数据准备”故事，完成了市场份额数据和第一份销售数据源的查询，并完成了对市场份额数据的预处理，因为它相当简单和干净。我们正在积极处理第一份销售数据源的预处理，并且在“数据准备”的“待办”列中有三个待处理的故事。\n\
  \n![](img/628533_1_En_21_Fig6_HTML.jpg)\n\n第 9 周项目任务流程图，按列组织：“待办”、“进行中”、“受阻”、“已完成”。行代表阶段：业务理解、数据理解、数据准备、分析与建模、验证与评估、可视化与展示。任务包括：探索数据源、对销售数据进行`EDA`、特征工程、与利益相关者会议。“已完成”列包括创建项目计划和预处理数据等任务。\n\
  \n**图 21-6** 增量性项目第 9 周末的分步数据科学看板\n\n到第 13 周结束时，如图 21-7 所示，取得了相当大的进展。我曾说过到那时我们绝对不会再接受新的数据源，因此最后一个“业务理解”故事以及所有“数据理解”故事都移到了“已完成”。我们在“数据准备”泳道开始了特征工程，并为市场份额和分销（我们从第一个销售数据源获得的额外特征）完成了这项工作。我们还完成了第一个销售数据源的预处理，并且我们意识到想要将三个数据源合并在一起，并在这个合并数据集上进行特征工程，因此我们添加了一个故事，并修改了针对第一个销售数据源的特征工程故事。我们在“待办”列中又添加了一个关于重构（重新设计）数据准备代码的故事，以便于在更多产品上使用。（这将在之后完成。）\n\
  \n我们在“分析与建模”泳道开始编写用于运行所有实验（不同算法、交叉验证和超参数调优）的代码。我们还对剩余工作和需要做的额外工作进行了规划。一旦所有特征工程完成，我们就必须修改实验代码，然后才能运行它，因此该故事被添加到了“分析与建模”的“待办”列中。另外两个新故事是为每个`SKU`编写并运行最佳性能模型的代码，以及编写并运行计算增量性和蚕食效应的代码。该泳道中的最后一个新故事是重构进行建模的代码，也将在之后完成。\n\
  \n然后，我们将已知必须完成的事情的故事添加到了“验证与评估”和“可视化与展示”泳道的“待办”列中。\n\n![](img/628533_1_En_21_Fig7_HTML.jpg)\n\
  \n流程图描绘了第 13 周的项目管理过程，分为列：“待办”、“进行中”、“受阻”、“已完成”。行代表阶段：业务理解、数据理解、数据准备、分析与建模、验证与评估、可视化与展示。任务包括：“重构数据准备/特征工程代码”、“对合并销售数据进行特征工程”、“为每个\
  \ SKU 编写并运行最佳模型代码”、“创建可视化”。该图表按状态和阶段组织任务，提供了项目活动的结构化概览。\n\n**图 21-7** 增量性项目第 13\
  \ 周末的分步数据科学看板\n\n在第 13 周之后，一个重大难题出现了，因为我们在第 11 周被要求纳入两个新的市场份额数据源。有时很难拒绝，因此我们必须满足这一要求。请参见图\
  \ 21-8 中的第 17 周看板。我们正在对这两个数据源进行`EDA`，回到了“数据理解”泳道，同时开始对两者进行预处理和特征工程（我们将之前针对市场份额数据的特征工程故事从“已完成”移回“进行中”）在“数据准备”泳道。这通常不是你想要的情况，但我们需要能够尽快包含这些特征，因此我们在已知可能需要根据`EDA`的结果进行一些微调的情况下编写代码。“分析与建模”泳道中的实验代码除了添加市场份额特征外已经完成，因此它卡在“进行中”状态。我们仍然能够开始一些代码的编写工作，并微调我们评估实验结果的流程，因此这些被移到了“进行中”。我们还能够在“验证与评估”泳道开始验证数据准备代码（除与新的数据源相关的部分外）。我们在“可视化与展示”泳道添加了另一个故事，用于创建最终的幻灯片，并开始制作最初仅解释项目和其他预备事项的幻灯片。\n\
  \n\n\n# 排版后内容\n\n![](img/628533_1_En_21_Fig8_HTML.jpg)\n\n流程图展示第 17 周的项目管理时间线，分为\"\
  待办\"、\"进行中\"、\"受阻\"和\"已完成\"四列。行代表各阶段：业务理解、数据理解、数据准备、分析与建模、验证与评估、可视化与呈现。任务包括利益相关者会议、数据探索、市场份额数据探索性数据分析、数据预处理、特征工程、模型代码编写以及可视化创作。该图表追踪了不同项目阶段中任务的进度与状态。\n\
