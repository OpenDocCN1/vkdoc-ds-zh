  \n**给未来数据科学家的建议：** 尽可能多地学习计算机科学知识，甚至选修数据结构、算法、操作系统、面向对象编程等课程。这真的能带来改变。\n\n*泰瑞是一位在电信和医疗健康领域拥有丰富经验和专业知识的数据科学家。*\n\
  \n脚注 1   2\n\n# 15. 并非水晶球：机器学习\n\n\n\n## 引言\n\n尽管生成式人工智能 GenAI（它依赖于特定类型的机器学习算法，即下文将要讨论的神经网络）当下风靡一时，但机器学习作为我们世界的一部分已有多年，并广泛应用于各个领域。它被嵌入银行和信用卡公司的欺诈检测系统中。亚马逊几十年来一直用它来推荐产品。同样长久以来，它一直在帮助我们控制垃圾邮件的泛滥。它决定了我们在社交媒体网站上看到的内容，并且多年来一直应用于医疗保健领域。语音识别让我们远离人工客服代表的时间比我们希望的还要长。当然，企业早已用它来预测销售额以及几乎所有其他能想到的事物。市场营销人员，尤其是网络营销人员，很早就接受了它。地图应用用它来提醒你注意意外的交通拥堵。它在法庭上被用来为对被告的判决提供信息。你懂的。\n\
  \n其中一些应用对人类确实有益，而另一些则非常糟糕，还有很多介于两者之间。在本章中，我将介绍作为数据科学家实践的一门学科——机器学习的重要方面。我们将从几个例子开始，然后讨论机器学习的五种类型。关键的类型是监督学习和无监督学习，但还有其他一些有用的方法（半监督学习、集成学习和强化学习）。接着，我们将深入探讨几种监督学习技术，随后是无监督学习技术，之后再讨论模型解释器以及机器学习的编码和实现。本章最后，我们将探讨数据科学家在执行机器学习时面临的一些挑战，包括维数灾难、数据泄露、过拟合与欠拟合，以及偏差-方差权衡。\n\
  \n# 现实世界中的机器学习示例\n\n我们知道机器学习在现实世界中已经存在了一段时间，但我们的第一个例子——Netflix Prize，比以往任何事物都更能将机器学习带入主流关注，这可能与那悬而未决的\
  \ 100 万美元奖金有关。第二个例子是医学领域的一个应用，其成果已在显著改善患者的生活质量。\n\n## 示例 1：Netflix Prize\n\n2006\
  \ 年，Netflix 设立了一个奖项，面向任何非 Netflix 关联人士（还有其他少数排除条件），只要能以一定幅度击败 Netflix 内部预测用户评分的系统（他们使用了性能指标均方根误差，我们将在下一章讨论）。这将有助于他们改进向用户提供的推荐。如果系统预测某位用户会对一部电影给出高分，那么如果该用户还未观看过此片，推荐给\
  \ ta 就是合理的。同时，他们也会避免推荐预测用户会给出低分的电影。\n\n参赛者获得了超过 1 亿条包含四个字段的训练集记录，分别是`用户 ID`、`电影\
  \ ID`、`评分日期`和`评分`。这并非海量数据，但在比赛启动后的六天内，就有一个团队已经击败了 Netflix 的内部预测器。又过了一周，又有两个团队做到了。这件事在蓬勃发展的数据科学领域引起了轰动，几个领先团队每次提交新结果时，排行榜的排名都会发生变化。在接下来的几年里，向团队颁发了两次进度奖，许多团队进行了合并，最终奖项由三个早期表现优异且后来合并的原始团队共同获得。另有团队的成绩与获胜团队持平，但获胜者比对方早提交了\
  \ 20 分钟，因此这七人小组带走了 100 万美元（这 20 分钟可真昂贵）。\n\n获胜团队被要求公开其方法，实际上该方法通过三篇独立的论文发表。三个原始团队各自发表了一篇关于其解决方案的论文，而最终的解决方案是这三种模型的线性组合。这些论文是：\n\
  \n*   《2008 年 Netflix Prize 的 BigChaos 解决方案》^(³⁷)，作者：Andreas Töscher 和 Michael Jahrer\n\
  *   《2008 年 Netflix Prize 的 BellKor 解决方案》^(³⁸)，作者：Robert M. Bell、Yehuda Koren 和\
  \ Chris Volinsky\n*   《Netflix Grand Prize 的 BigChaos 解决方案》^(³⁹)，作者：Andreas Töscher\
  \ 和 Michael Jahrer\n\n解决这个问题涉及复杂的建模。由于数据非常简单，且没有明显的方法将其与其他数据关联，因此实际上并不需要任何数据预处理。所以团队能够直接进行建模。但是，有超过\
  \ 40,000 个团队参与竞争，显然需要相当高超的技术才能击败所有其他团队。在此过程中尝试了许多方法，但发现有必要结合多种不同模型的结果（机器学习中称为集成学习的技术），并且需要对集成解决方案进行大量调整才能达到最终版本。该奖项被认为推动了机器学习领域的发展，因为如此多的不同技术和方法直接在同一个问题上进行了比较，这是一种真正的苹果对苹果的比较。\n\
  \n关于整个事件，有一件有趣的事：Netflix 原本计划举办第二届比赛，但因为隐私问题被起诉而取消了。尽管诉讼后来被撤销，但这强烈提醒我们，几乎不可能真正匿名化任何与人相关的数据。尽管数据中只有四个字段，且仅包含人员和电影的\
  \ ID，但还是有人通过将 IMDB（互联网电影数据库网站）上的用户和评分进行匹配，从而识别出了数据集中的一些人。\n\n## 示例 2：放射学中的机器学习\n\
  \n分析医学影像（患者身体的扫描图）对人类来说仍然是一项极其容易出错的任务，因为它除了需要专业知识外，还需要极其专注的细节注意力。各种涉及机器学习的解决方案通过帮助人类捕捉图像中指示问题的细微之处，极大地改善了这种情况。\n\
  \n乳腺癌是全球最常见的癌症。它可能影响任何人，但在 40 岁以上的女性中最为常见。医疗保健领域已普遍认为女性一旦达到该年龄就应该开始每年进行乳房 X 光检查，这意味着有很多机会甚至在早期阶段发现癌症。但这仍然依赖于放射科医生来检测。每个人的身体都不同，一些情况如致密乳腺组织使得识别癌症更加困难。\n\
  \nLunit 公司有一款名为`INSIGHT MMG`^(⁴⁰)的工具，该工具基于深度学习（我们将在下文讨论的神经网络），专门用于解读乳房 X 光片。他们声称癌症检测准确率达到\
  \ 96%，这显然很好，但他们提供的另一个好处是加速了从图像中检测癌症的过程。这个工具尤其擅长在致密乳腺组织中检测癌症。通过一些回顾性研究（回顾后来被诊断出癌症的早期乳房扫描图像），他们发现该系统正确检测出了那些早期扫描中\
  \ 40%的案例——而这些案例曾被人类漏诊。\n\n这正是机器学习应该被使用的完美领域，因为它只带来积极影响。它不会取代人类专业知识，但在没有癌症时能显著加快速度，同时也有助于标记出更复杂的病例，让医生可以花更多时间进行研究，从而提高患者的生存率。\n\
  \n\n\n# 机器学习类型\n\n机器学习与传统编程有着根本性的不同，其区别在于已编写程序的输入和输出内容。在大多数传统编程中，我们编写代码时已知输出结果，因为这正是我们编写代码所要实现的目标。我们可以对过程中的每一步进行测试，因为同样清楚中间步骤及其应有的输出。图\
  \ 15-1 展示了传统编程的流程。输入的规则集是我们在代码中编写的预期行为，由计算机执行。许多程序还会依赖输入的数据，这些数据可以是记录，也可以是一些简单的配置细节。可以将图中的“计算机”方框视为我们根据规则编写的软件程序。运行程序会生成输出，即“计算结果”。在有数据输入的情况下，我们仍然知道每个数据输入或数据输入组合所对应的输出应该是什么，而我们对“计算结果”所做的任何测试都将基于已知的输入和输出。这类软件也被称为*确定性*软件，这意味着每次使用特定输入集运行时，输出结果都将完全相同。\n\
  \n![](img/628533_1_En_15_Fig1_HTML.jpg)\n\n流程图展示了传统编程。该图显示了一个过程，其中“规则”和“数据”作为输入进入“计算机”方框，进而产生作为输出的“计算结果”。箭头指示了从输入到输出的流向。\n\
  \n**图 15-1** 传统编程流程。规则是必需的，但是否需要数据则取决于程序的需求。\n\n此类软件的一个例子是计算比萨餐厅总销售额的代码。程序员编写计算数据的规则，输入所有交易数据以及任何其他需要包含的值，然后计算机生成汇总结果。如果每次都以完全相同的输入运行，那么生成的输出汇总结果也将完全相同。另一个例子是，在\
  \ 1999 年夏天人们对千年虫问题感到恐慌时，我编写了一个 Java 小程序——千年倒计时时钟，它运行在公司的内部网上，倒计时显示距离 1999 年 12 月\
  \ 31 日午夜还有多少天、小时、分钟和秒。该程序中使用的唯一数据就是当前的系统时间。\n\n传统编程中已知输出和确定性有一个例外，那就是当我们使用随机性编写任何代码时。编程语言可以生成随机数，这些随机数可用于控制由代码中生成的数字决定的不同行为。想象一下，你想要根据不同的数值随机生成一个《龙与地下城》角色。一个角色由一组特定的基本身份（如种族和职业）以及代表各种事物（如技能和能力）的数字来定义。例如，如果有九个可能的角色种族，你希望程序随机选择一个，并且希望它随机为角色的敏捷属性选择一个介于最小值和最大值之间的数值。每次运行这个程序时，你想要的输出都是不同的且未知的。然而，你了解输出的参数——所有能力和技能分数都将在定义的最小值和最大值之间，并且你知道角色可能拥有哪些种族、职业和背景，因为它们来自一个特定的列表。随机性的另一个常见用途是在模拟中，科学家们可能希望定义一个起点，然后观察事物随时间如何演变，而这至少会部分地由随机事件驱动。混沌理论正是源自以这种方式运行的气象模拟。\n\
  \n请注意，在编程语言中，这种随机性被视为*伪随机*，因为对于一个特定的起点，随机数生成器会以相同的顺序生成相同的数字，因此在这种情况下它实际上是确定性的——每次结果相同——即使程序仍然在使用“随机”值运行。有时这正是期望的行为，例如，当你在运行一个实验并希望它具有可重复性时。这通过在代码中创建随机数生成器时设置一个称为*种子*（即起点）的数字来控制。如果你希望每次运行的结果相同，就将种子设置为相同的数字。相反，如果你想要非确定性的行为，则需要将种子设置在某个变化的量上，例如将当前日期和时间转换为一个数字，并将种子设置为该值。这样每次运行的输出都会不同。\n\
  \n请注意，即使是许多使用了随机性的程序，仍然被视为传统编程。这是因为输入是已知的，输出基于规则和已知的输入，仅此而已。在机器学习领域，情况则有所不同，因为你不会预先提供规则，也永远不知道输出会是什么。机器学习的两种主要类型是监督学习和无监督学习。下面我将用图\
  \ 15-2 和图 15-3 展示这两种类型，并在图 15-4 中展示另一种类型——半监督学习。我们将在下文中一一讨论它们。\n\n但首先，我们需要了解机器学习试图解决的两种问题类型：分类和回归。*分类*的目标是通过预测目标变量值来为数据打标签——例如，确定一款电子游戏的类型，判断某人是否患有疾病，或确定某个数据点属于哪种花。可能的标签数量各不相同——我曾参与过一个项目，其中包含二战期间个人经历的叙述，我们想根据主要话题为它们打标签，这是一个多类问题，因为有七个可能的话题。最终，我们将它们视为标签来处理，这样每段叙述可以包含多个话题，因此我们对每个标签进行独立分析，并为每个标签建立一个二元模型来判断它是否符合该话题。这种方法并不罕见，因为衡量多类模型的性能可能很困难。\n\
  \n*回归*是机器学习用于解决的另一种问题类型，我们称之为对数值数据进行预测。像销售预测——预测比萨餐厅未来七天的销售额——是一个非常常见的回归任务。其他例子可能包括预测电子游戏的下载量或急诊科每天的患者数量。\n\
  \n每种问题都有不同的算法，但有些技术存在变体，允许它们同时处理这两种问题。我将在下文中讨论它们。\n\n## 监督学习\n\n在*监督机器学习*中，我们向计算机提供数据，以便它能够找出数据中的模式和规则（这一步称为训练模型），然后计算机将这些计算出的规则输出到我们所谓的模型中。监督机器学习有一个最低要求——我们必须在输入数据中包含目标值，这使得数据成为*标记数据*。正是因为我们提供了目标变量，所以才称之为“监督”——即我们提供了指导。\n\
  \n监督学习通常用于两种类型的任务，这两种任务都需要已训练好的模型：预测和推断。我们将在下文中详细讨论每一种。监督学习在商业世界中非常重要，也是组织机构中最常见的机器学习类型，其中预测是最常见的任务。\n\
  \n\n\n#### 预测\n\n一旦我们有了训练好的模型，就将它连同第一步中未包含的新数据输入计算机，然后计算机输出与新数据相关的预测结果。请注意，这些新数据必须具有与模型训练时相同的特征。这对新手数据科学家来说可能是一个容易出错的地方。在本节末尾，我将进一步详细讨论预测生成运行过程具体需要包含哪些内容。\n\
  \n在第一步中，我们并非完全没有向计算机提供任何“规则”，这有两个原因。第一个原因是，我们提供的是经过专门准备的数据，这些数据包含我们认为重要的特征。这就是数据准备和特征工程如此关键的原因。第二个原因是，我们提供了目标值。图\
  \ 15-2 展示了预测性监督机器学习的两个步骤。\n\n![](img/628533_1_En_15_Fig2_HTML.jpg)\n\n说明监督机器学习的流程图。该过程分为两个步骤。步骤\
  \ 1：将数据输入计算机，计算机输出计算出的规则。步骤 2：将计算出的规则和新数据输入另一台计算机，该计算机输出预测的答案。箭头表示数据和结果的流向。\n\n\
  图 15-2\n\n预测性监督机器学习流程。第一步训练模型，第二步输出预测结果\n\n图中的步骤 1 包含几个具体部分。总体而言，这是训练模型的过程，但在监督机器学习中，“训练”在最终确定模型之前还包括测试。准备数据后的第一步是将数据拆分为训练集和测试集，有时还会拆分为一个额外的验证集，这被称为训练-测试拆分。有关训练-测试拆分的更多信息，请参见侧边栏。\n\
  \n**训练-测试拆分**\n\n将数据拆分为训练集和测试集（如果需要的话还有验证集）本身是一门艺术。常见的拆分方式是按数据百分比进行，例如 80-20 的训练-测试拆分，或\
  \ 70-20-10 的训练-验证-测试拆分。但如何选择那 80%的数据呢？当你不处理基于时间的数据时，有多种方法可以选择训练集和测试集。通常可以随机选择，使用与第\
  \ 3 章讨论的抽样技术相同的方法。这种方法意味着你会有良好的覆盖率，并且你的测试集将测试模型在训练数据中学习到的尽可能多的模式。\n\n如果你处理的是基于时间的数据，尤其是使用时间序列方法时，你通常会选择后\
  \ 20%的数据作为测试集，并使用前 80%的数据作为训练集。这样做的一个缺点是，你的测试数据可能无法覆盖模型中检测到的所有模式。例如，如果你有两年的数据，你可能只能测试五个月的数据，这刚好超过\
  \ 20%。如果一年中某些部分比其他部分更容易预测呢？如果这些日期恰好落在夏季和初秋，模型可能表现得非常好。但是，当时间推移，你在深秋和冬季运行模型时，它的表现可能就不那么好了，而你最初的测试并没有发现这个问题。反之亦然。\n\
  \n这些训练集、测试集和验证集中的每一个都应该完全独立于其他集合，没有任何数据点出现在多个集合中。此外，所有这些数据必须具有我们关心的特征以及目标值，无论这个目标值是一个标签（例如“患有糖尿病”或“未患糖尿病”）还是一个数字。步骤\
  \ 1 将获取所有这些信息，并找出广义规则，以便从特征的组合得到特定的目标值。这就是模型，也就是图 15-2 中的“计算出的规则”。\n\n高级流程基本上是：基于训练数据集训练模型（步骤\
  \ 1），然后在测试数据集上对其进行测试，以查看其表现如何（步骤 2）。我们将使用各种指标来衡量性能，我将在下一章中介绍这些指标。我们会在训练集上训练许多不同的模型，并在测试集上进行测试，尝试不同的算法或每种算法中的不同设置。请注意，训练最佳模型的一部分工作不仅是尝试不同的算法，还要进行所谓的超参数调优。\n\
  \n在`R`或`Python`中，用于训练算法的多数函数都有超参数，这些参数需要在运行时设置，当你在代码中调用该函数时，它们作为参数传递。这些参数定义了所使用的机器学习算法的各个方面。当我们下面讨论算法时，会涉及其中一些参数，例如对于决策树，它会控制树的深度。这些超参数通常有默认值，但这并不意味着这些默认值对你的特定问题是最优的，因此这是一个必要的步骤。\n\
  \n*超参数调优*是寻找能产生最佳性能模型的最佳超参数组合的过程。有不同的方法可以实现这一点，但目前只需理解，这就是验证集的用途。调优通过选择超参数并在训练集上进行训练，然后用验证集进行测试，并重复此过程直到找到性能最佳的模型来实现。然后，使用这些超参数对训练集进行最后一次训练，并在测试集上进行测试，从而得出模型的最终性能。还有一种方法称为交叉验证，它涉及将训练集分成几个不同的训练集和验证集拆分，而不是使用专门的验证集。当试图避免过拟合（即模型构建得过于针对训练集，无法泛化）时，这种方法特别有价值。我将在下面进一步讨论超参数调优和交叉验证的方法。有一些便捷的工具允许你仅用几行代码就进行多次不同的运行。\n\
  \n在我们多次迭代步骤 1 和步骤 2，识别并测试了性能最佳的模型之后，该模型就可以用于新的、未见过的数据，以获取这些数据的预测结果。这意味着要用新数据重新运行步骤\
  \ 2。监督机器学习的一个典型例子是预测销售量之类的东西。一家披萨店可能想知道在晚班开始前需要准备多少面团，因此他们可以根据历史销售数据以及其他数据（如天气、体育赛事、节假日和其他日期信息（已知数据））创建一个模型。然后，他们可以将未来日期（未见数据）的这些信息提供给模型，并获得预期销售披萨总数的预测。这将帮助他们知道需要准备多少面团。预测是监督机器学习的最终目标。\n\
  \n\n\n### 进行预测所需的条件\n\n有时，新入行的数据科学家会困惑于需要向训练好的模型提供什么才能获得预测结果。正如前文所述，我们需要提供模型训练时所用的所有特征值。假设我们有一个用于预测商店每日销售额的模型。今天是\
  \ 2 月 1 日，我们有一个基于截至 1 月 31 日过去三年数据训练好的模型，并且想要预测未来七天的每日销售额。我们使用了多种特征，包括星期几、月份中的第几周、节假日以及若干历史销售特征。我们必须拥有接下来七天所有这些特征的数据。想象一张包含七行数据的表格，每一列对应上述的一个特征。有些人会惊讶于我们需要“未来的数据”——但模型正是基于每一天的这些特征值运行的，因此它们是必需的。\n\
  \n这意味着我们需要能够获取这些未来的特征值。使用无法体现未来情况的特征是新手的常见错误。例如，如果你有一个特征“`昨天的销售额`”，用这个特征训练模型没有问题。但当你进行预测时，你无法提供这个特征值，因为你根本不知道第七天的“`昨天的销售额`”是多少——我们还没有第六天的销售额数据。一种处理方法是使用第六天的预测值作为第七天预测中的“`昨天的销售额`”，但由于存在不确定性，这并不总是正确的解决方案。\n\
  \n### 推断\n\n监督学习的另一个不那么常见但仍然有价值的用途是推断，即通过生成模型并对其进行检查。其理念是查看模型指定的特征和数值，从而理解模型中哪些因素是重要的。这可能意味着将所有数据直接投入图\
  \ 15-2 中的步骤 1，观察输出的特征和数值；也可能涉及在多个模型上同时运行步骤 1 和步骤 2，选出性能最佳的那个，然后仅检查该模型。为了使这种方法有效，我们需要使用透明的算法或模型解释器，以便理解哪些特征对输出有贡献。在这种情况下，我们可能甚至不需要将数据拆分为训练集和测试集。相反，我们直接训练模型，如果算法能够揭示其所用的特征和数值，我们就检查该模型。像线性回归和决策树这类透明方法非常适合此目的，因为它们能精确告诉我们哪些特征是重要的。但另一种树方法——随机森林——只能输出对整个模型最重要的特征，而不会提供任何数值信息。\n\
  \n另一种选择是使用模型解释器，这种工具能够揭示非透明算法的重要特征（我们将在下文详细讨论）。使用模型解释器时，我们实际上是通过模型运行训练数据来生成“`预测值`”——即模型基于所提供的特征生成的数值。然后，我们可以使用模型解释器获取每个特定预测的最重要特征并进行研究。在这种情况下，我们可能会重点关注那些准确率较高的预测，但那些不准确的预测也可能很有研究价值。\n\
  \n机器学习中一个相对较新且正在发展的领域是因果推断，它专门致力于寻找变量之间的因果关系。例如，如果你想了解改变价格对销售额的影响，你需要将其他变量归一化，然后仅关注这两个变量。\n\
  \n### 无监督学习\n\n无监督学习在某些方面与监督学习相似，但关键区别在于我们不向它提供目标值，这也是其被称为“无监督”的原因。*无监督机器学习*在没有指导的情况下（数据准备阶段完成的特征工程除外）识别数据中的模式，而非像监督学习那样找出如何从特定特征得到特定值。我们并非主动“教”它。\n\
  \n在无监督学习中，不要求进行训练-测试拆分。它可以是一个或两个步骤的过程。第一步基本上是在准备好的数据上运行算法，从而生成两样东西：(1) 你向算法请求的“`答案`”，以及\
  \ (2) 一个训练好的模型，你可以将该模型应用于新数据，并应用算法在运行期间确定的规则。最常见的无监督机器学习是聚类，它简单地将数据分为不同的组，因此输出的是附有组别标签的原始数据。这让你能够看到哪些数据点被分到了一起，从而可以深入挖掘并发现这一组与其他组的不同特征。这可能就是你当前工作的终点，但你同时也获得了一个训练好的模型。通过可选的第二步，你还可以将新的、未见过的数据输入模型，从而为这些数据也生成分组标签。图\
  \ 15-3 展示了这一流程。\n\n![](img/628533_1_En_15_Fig3_HTML.jpg)\n\n流程图展示了无监督机器学习的两个步骤。第一步：数据输入计算机，计算机输出计算得出的规则和推理得出的答案。第二步：将计算得出的规则与新数据输入计算机，产生推理得出的答案。箭头表示数据和结果的流向。\n\
  \n**图 15-3**  \n无监督机器学习流程图。第一步训练模型并输出标签（如分组）。可选第二步允许模型为新数据标注标签。\n\n\n\n### 半监督学习\n\
  \n`半监督机器学习`是监督学习和无监督学习的结合，因为我们同时提供了有标签和无标签数据。有时，有标签数据非常昂贵或难以获得，尤其是在机器学习通常需要大量数据的情况下。如果无监督学习不足以解决当前问题，那么有一种方法可以增强现有数据，以获得更多可用于监督学习模型的“有标签”数据。这种方法可能效果不错，但并不总是奏效。这绝对是一种“因人而异”的方法，取决于你的领域和数据。\n\
  \n使用这种方法存在一些普遍的限制。一个关键的方面是，无标签数据在内容上需要与有标签数据相似。如果我们试图识别歌曲的流派，并且我们有一个包含已标注的摇滚、流行和雷鬼歌曲的数据集，那么在加入除了这三类之外还包含乡村和说唱的无标签歌曲，就不会产生好的结果。这很直观，但有时很难判断无标签数据是否与有标签数据相似。一些探索性数据分析通常可以回答这个问题。\n\
  \n半监督学习有几种不同的技术，但我只打算讨论自训练方法，这是一个三步过程。自训练半监督学习首先从创建一个`基础模型`开始，该模型仅在小量有标签数据上进行训练。然后，我们将无标签数据输入模型以获得预测结果——即无标签数据的标签，通常称为`伪标签`。这第二步的一个要求是，每个预测都要生成一个置信度。然后，你可以取出所有具有高置信度（通常在\
  \ 80%左右）的伪标签数据，将这些数据（也就是无标签数据中具有高置信度伪标签的子集）与原始有标签数据合并，并用这个规模大得多的数据集训练一个新的监督模型。图\
  \ 15-4 展示了整个流程。\n\n![流程图展示了自训练半监督机器学习过程。它包含三个步骤。步骤 1：有标签数据输入计算机，生成基础计算规则。步骤 2：计算规则和无标签数据输入计算机，生成预测的伪标签和标签置信度分数。步骤\
  \ 3：有标签数据和带有伪标签的无标签数据输入计算机，生成计算规则。](img/628533_1_En_15_Fig4_HTML.jpg)\n\n图 15-4：基本的自训练半监督机器学习流程\n\
  \n你可能已经猜到，这通常不是一种非常稳健的技术，并且在很大程度上取决于伪标签的质量。因为我们使用的伪标签数据远多于真实数据，如果生成过程中出现任何问题，整个模型都会出错。如果原始训练集中的某个特征被赋予了比其实际重要性更高的权重，那么该特征在伪标签数据集中就会被过度强调，从而可能导致这种情况发生。这并不意味着你不应该尝试它，但你需要小心谨慎，并用放大镜仔细检查你的结果。请注意，当这种方法效果良好时，通常是因为特征空间中彼此接近的点往往具有相同的标签，因此与其他点接近的伪标签很可能具有正确的值。\n\
  \n### 强化学习\n\n强化学习被认为是继监督学习和无监督学习之后的第三种机器学习范式。它不提供训练数据，但会指定一些行为规则。强化学习通常被描述为一个“智能体”探索陌生环境并朝着目标努力的过程。想象一个机器人在房间里探索，试图找到一个需要关闭柜门的柜子（目标）。仅凭目标它无法成功——它还必须有一个策略来决定如何选择要做的事情，以及在执行期望的动作后获得奖励。这些目标、策略和奖励都是预先指定好的。\n\
  \n强化学习的基本挑战之一是找到探索（如机器人探索所在的房间）和利用（利用它学到的关于房间的知识）之间的平衡。强化学习方法的一个有趣之处在于，它们并不总是选择局部最优选项（即在特定时刻能带来最大奖励的选项），而是可以处理延迟满足，为了更大的回报而做出小的牺牲。强化学习最大的优势是优化——寻找最优路径，无论是物理路径还是虚拟路径。\n\
  \n它在数据科学中的使用不如在其他人工智能领域那么广泛，但在营销领域与推荐系统结合时可能很有用。它还被用于`AlphaGo`，该系统击败了最优秀的围棋选手，如第\
  \ 10 章所述。\n\n### 集成学习\n\n其核心而言，`集成机器学习`与其说是一种机器学习的“类型”，不如说是一种将不同机器学习模型结合起来以获得比任何单个模型都更好性能的方法。有时人们称之为基于委员会的学习，因为它组合结果的方式。这个想法相当直观——例如，众所周知，当人们猜测一个大罐子里的弹珠数量时，许多猜测的平均值会比大多数个人的猜测更接近正确数字。高估和低估往往会相互抵消，互相弥补对方的不准确性。即使是最好的机器学习模型也有一些局限性，比如误差、偏差和方差（我们稍后会讨论这些），但是当我们组合多个模型时，这些问题会被其他模型中的值所弥补。\n\
  \n训练和组合不同模型主要有两种方法：顺序式或并行式。在并行方法中，多个模型在训练数据的不同部分上独立训练，要么所有模型使用相同的算法（同质），要么使用不同的算法（异质）进行训练。在顺序方法中，每个模型被训练，然后其训练结果被输入到下一个模型的训练中。最后，在分类问题中使用多数投票法（选择在多个模型中出现次数最多的预测）以及在回归问题中取所有模型输出的平均值来组合最终的模型输出。\n\
  \n还有另外三种技术可以使用：装袋、堆叠和提升。`装袋`这个词是“自举聚合”的合成词，它涉及通过对训练集进行重采样来创建新的数据集，并在每个新生成的数据集上使用相同的算法训练单独的模型。然后将这些模型的结果进行组合以获得最终预测。\n\
  \n`堆叠`使用异质并行方法，训练多个模型，然后在第一轮模型的输出上训练另一个模型。这种创建最终模型的方法被称为`元学习`，因为它是在其他模型的输出结果上进行训练，而不是在原始数据上。最终的模型生成最终预测。\n\
  \n`提升`是一种顺序集成方法，通过专注于在后续模型中对错误预测进行处理以改进差的预测。首先在一个训练数据集上训练一个模型，但它会将结果分为正确和错误两大类，然后创建一个包含错误预测记录的新数据集，但在此基础上做一些调整（例如在新数据集中为它们赋予权重）。这个过程在多个模型上重复进行，最后通过计算权重将它们组合起来。\n\
  \n\n\n# 监督技术\n\n本节将介绍几种流行的监督技术。实际可用的技术比这里提到的要多，但很多时候，数据科学家的工作都集中在最常用的几种方法上。当你的常规工具箱不够用时，上网搜索一下也是完全正常的做法。\n\
  \n## 时间序列分析\n\n时间序列分析是一种古老的统计方法，由于许多其他机器学习技术表现更优，它已有些失宠，因此我不打算过多介绍。但了解一下仍有好处，因为它在某些情况下确实有效。时间序列分析依赖于基于时间的数据，例如某款特定电子游戏在商店的周下载量。其局限性之一是，经典的时间序列分析无法像其他机器学习算法那样使用特征。我们只有时间单位以及被追踪的数值，比如销售额或下载量。图\
  \ 15-5 展示了一个我们在时间序列分析中常见的典型图表。\n\n![](img/628533_1_En_15_Fig5_HTML.jpg)\n\n折线图标题为\"\
  画框销量\"，展示了从 2020 年 1 月到 2023 年 5 月期间的销售量。X 轴以月为间隔表示日期，Y 轴表示销售量，范围从 0 到 60。数据显示出销量波动，有高峰和低谷，表明该期间画框销量存在变化。\n\
  \n图 15-5\n\n一个适用于时间序列分析的示例图表，展示了一家虚构的小型画框店数年间每月的销售额\n\n图 15-5 清晰地显示了数据的上升趋势。在时间序列分析中，这被称为*趋势*，即长期内持续一致的总体增长或下降。我们还可以看到*季节性*，这是一种有规律重复出现的增长或下降模式，例如图\
  \ 15-5 中每年六月和十二月的销量激增。\n\n这些模式肉眼很容易识别，但也有工具可以自动识别趋势和季节性（或周期性），以及其他一些模式。这些工具允许我们*分解*原始时间序列，以查看显示趋势和季节性等模式的各个子图。这之所以有用，一方面是因为有时图表中这些模式并不像我们希望的那样清晰，另一方面是因为我们可以利用这些特征进行预测。\n\
  \n我们还可以使用工具，根据时间序列中的历史数据生成预测。还有其他基于时间序列的算法能做更多事情。其中一种流行的算法是*自回归积分滑动平均模型*（ARIMA），它从三个不同角度审视时间序列。第一个是*自回归*（AR），关注一个数据点与其先前（或滞后）点之间的关系。第二个是*积分*（I），它使用差分方法有效地去除趋势和季节性。第三个是*滑动平均*（MA），它考虑数据点以及过去几个观测值的滑动平均值。所有这些都是在运行`ARIMA`时可以指定的参数。请注意，使用`ARIMA`需要满足一些假设，最重要的是数据必须是*平稳的*，这意味着均值和方差不会随时间发生剧烈变化。\n\
  \n尽管时间序列方法并不总能产生最佳结果，但尝试一下并观察其表现并不难。然而，由于我们通常只使用一个“特征”——即我们试图预测的同一个变量的历史值——数据的模式必须局限在该变量本身。换句话说，时间序列假设除了月份、星期几等时间特征之外，没有其他外部因素决定未来的数值。请注意，也存在一些允许包含外部值的选项，特别是名为`ARIMAX`的`ARIMA`变体。它允许引入一个额外变量，这个变量可以是单个特征，也可以是多个特征的组合（在技术中表现为一个变量）。\n\
  \n## 广义线性模型\n\n线性回归是一种非常流行的技术，既可用于理解数据，也可用于进行预测。它也是统计学家和数据分析师最早使用的、超出纯统计检验范畴的技术之一。其优点是直观透明，并且易于向利益相关者解释。从概念上讲，*线性回归*特指取一组数据——想象一个散布着许多点的散点图——并在其中画一条线。画这条线有特定的技术，我们将在下面讨论。这条线代表了两个变量之间的关系，也就是该图中预期值的位置——如果我们观察图中已有数值以外的范围，就会看到预期值在该范围之外是怎样的。预测，即观察我们构建模型所用数据范围之外的数值，被称为*外推*。\n\
  \n线性回归是一种广为人知的特定技术，但它实际上归属于统计回归技术家族，属于*广义线性模型*。这个名称可能具有误导性，因为其中的一些技术会产生非线性模型，如多项式回归和泊松回归，但该名称仍然沿用。最常见的两种广义线性模型是线性回归和逻辑回归。线性回归用于回归——生成数值型输出，而逻辑回归通常用于二分类——生成非数值型标签。两者都将在下面进行讨论。\n\
  \n\n\n```markdown\n#### 线性回归\n\n线性回归是回归方法中最直接、最直观且最简单的技术。术语“线性回归”从技术上讲，涉及仅基于一个其他变量（即特征预测变量\
  \ `X`）对一个变量（目标变量，或称 `Y`）进行建模，但这在大多数情况下并不那么有用，因为单个变量能够很好地预测另一个变量的情况非常罕见。\n\n仅用两个变量就能得到一个不算太差的模型，最常见的例子之一是体重与身高的关系，其中身高是\
  \ `X`，体重是 `Y`。图 15-5 显示了一个较大数据集中 75 个身高和体重测量值的样本。\n\n![](img/628533_1_En_15_Fig6_HTML.jpg)\n\
  \n散点图标题为“成年人身高与体重”，显示身高（x 轴，单位厘米）与体重（y 轴，单位公斤）之间呈正相关。数据点分散分布，表明存在变异性，身高范围从 140 厘米到\
  \ 200 厘米，体重范围从 40 公斤到 130 公斤。\n\n图 15-6\n\n成年人的身高与体重\n\n要使线性回归有效，必须满足几个假设。其中最重要的三个是：线性关系、强相关性，以及如果存在多个\
  \ X 值时，`X` 变量的独立性。我们需要确保散点图中的数据点看起来接近一条清晰的直线，并且 `X` 和 `Y` 变量之间存在相当强的相关性（通常大于 0.5\
  \ 或小于 –0.5）。人们常常懒得进行这些检查，但如果不满足这些条件，回归分析就无法提供可靠的结果。进行任何回归分析的另一个重要步骤是理解模型中固有的误差（没有任何模型能够做到完美精确）。\n\
  \n观察图 15-6，我们可以看到数据点有些分散，并没有一条所有测量值都聚集在其周围的直线，但存在明显的上升趋势。从视觉上看，这大致呈线性。我们还可以计算身高与体重之间的相关性。使用\
  \ Python 对这个样本进行计算，得出的皮尔逊相关系数为 0.565，超过了 0.5 的阈值。（需要说明的是：原始的完整数据集的相关性并不高于 0.5，但这个特定的随机样本确实如此，所以我用它来举例说明。）接下来是独立性问题：很明显身高和体重并非相互独立，因为一个身高\
  \ 6 英尺 6 英寸的人不可能仅重 100 磅，除非极不正常。对于身材较矮的人体重较重的情况也是如此。但为了便于理解线性回归，我们可以暂且忽略这一点。老实说，几乎没有哪两个不相互依赖的变量组合能产生好的回归结果，所以我们只能先用这个例子。\n\
  \n线性回归的核心在于它用来确定直线应如何穿过图表上各点的方法。我们将讨论这一点，但图 15-7 展示了上面那个散点图加上回归直线后的效果。凭直觉，这感觉很对。如果你仅根据图\
  \ 15-6 自己画一条线，很可能也会画成这样。但它究竟是如何计算出来的呢？\n\n![](img/628533_1_En_15_Fig7_HTML.jpg)\n\
  \n散点图标题为“成年人身高与体重”，显示身高（x 轴，单位厘米）与体重（y 轴，单位公斤）之间呈正相关。蓝色点代表单个数据点，红色趋势线指示整体趋势。图表表明，随着身高增加，体重也趋于增加。\n\
  \n图 15-7\n\n带有回归直线的成年人身高与体重\n\n线性回归通过最小化每个数据点的所有平方误差之和来计算这条直线。误差是数据点到直线的垂直距离，但在回归中，这通常被称为`残差`。计算总体误差有不同的方法，但传统的线性回归，即`普通最小二乘回归`，使用的是所谓的`误差平方和`（`SSE`），其计算方法是先对每个残差进行平方，然后将所有这些平方值相加。注意，我们对其进行平方是因为我们不希望过高的值与过低的值相互抵消——如果直接求和就会发生这种情况。这种方法几乎不可能手动完成，因为它实际上会尝试大量不同的直线，计算每条直线的误差平方和，然后选出和最小的那条。我们可以通过查看数据集中前\
  \ 15 个数据点的残差来理解其工作原理，如图 15-8 所示。黑线连接了原始数据点与回归直线，残差值就是图表中黑色线段的长度。\n\n![](img/628533_1_En_15_Fig8_HTML.jpg)\n\
  \n散点图标题为“成年人身高与体重”，显示身高（x 轴，单位厘米）与体重（y 轴，单位公斤）之间的关系。蓝色数据点代表各测量值，红色趋势线指示正相关。身高范围从\
  \ 146 厘米到 154 厘米，体重范围从 40 公斤到 80 公斤。\n\n图 15-8\n\n显示残差的身高与体重数据中的前 15 个数据点\n\n这就是那条直线的生成方式，但我们还需要知道实际模型是什么样的。幸运的是，这是一个可以追溯到高中数学的简单方程。它基本上就是我们学过用来绘制直线的\
  \ `y = mx + b` 公式。请记住，`y` 是绘制在 Y 轴上的值；`m` 是`斜率`，或者说量化后的直线角度，乘以 `x`（绘制在 X 轴上的值）；`b`\
  \ 是`截距`，即直线与 Y 轴相交的点。这正是单变量线性回归输出的公式形式，其中各项被赋予了具体的拟合值。在线性回归中，还假设存在误差（每个模型都有误差，因为我们知道，除非变量之间完全相关，否则模型不可能完美），用公式中的\
  \ `e` 表示，并且截距通常被写在前面，作为一种“零”`X` 值。因此，在回归中，我们这样写：`Y = X[0] + mX + e`。如果你好奇，图 15-8\
  \ 中直线的公式是 `Y[体重] = –101 + 1.11 × X[身高] + e`。\n```\n\n\n\n### 多元线性回归\n\n大多数情况下，当数据科学家提到线性回归时，他们实际指的是*多元线性回归*，即用一个变量\
  \ `Y` 与多个 `X` 变量建立线性回归模型。在身高/体重的例子中，我们知道体重的影响因素远不止身高。有很多不同因素可能会影响体重，包括性别、健康水平、年龄等等。仅前三个因素就能使我们的模型比之前大幅改进。\n\
  \n要运行多元线性回归，上述提到的要求对所有纳入的特征都成立，这意味着每个特征都必须与目标变量相关，并且与其他特征相互独立。我们还需要检查每个特征与目标变量之间的线性关系。如果特征数量不多，我们仍然可以通过绘制每个特征与目标变量的散点图来直观地检查线性关系，确保其呈现线性趋势。实际上，检查这些条件有比我们上面提到的方法更系统的方式，但我将留给你自己去探索。\n\
  \n普通最小二乘回归还有一些额外的假设，这些假设可以在模型生成后进行检验。其中之一是残差的均值接近 0。残差还应服从正态分布，并且不存在自相关性，自相关性意味着数据中存在某种模型未能捕捉到的模式。你也可以自行查阅这些内容。\n\
  \n学习多元回归的一个挑战是，由于涉及两个以上的变量，我们无法绘制图表来可视化完整的回归过程（上面提到的三个额外特征将需要五维图表）。但好消息是，理解它并不需要可视化——我们只需查看公式就能了解其原理。多元回归所做的仍然是找到一条使残差（即直线与每个\
  \ `Y` 值之间的差值）最小化的直线。多元线性回归只是增加了更多的 `X` 特征，因此其形式为 `Y = X[0] + m[1]*X[1] + m[2]*X[2]\
  \ + … + m[n]*X[n] + e`。\n\n这个公式就是回归的输出结果，我们可以与利益相关者分享。它很容易解释。在我们的例子中，用身高、健康水平和年龄来预测体重，若要与利益相关者分享该公式，我们会重命名\
  \ `X` 值，最终得到类似这样的公式：`Y[体重] = X[0] + m[身高]*X[身高] + m[健康水平]*X[健康水平] + m[年龄]*X[年龄]\
  \ + e`。不过，在实际展示公式之前，我们可能会让它看起来不那么数学化。特征的值需要确定，但假设身高以英寸为单位，健康水平是 1 到 5 的评分，年龄以年为单位（允许有小数）。这个公式的意思是，我们将每个这样的数值乘以回归计算出的特定乘数，然后将它们全部相加，得到以磅为单位的\
  \ `Y[体重]`。要预测一个新个体的体重，只需将其 `X[身高]`、`X[健康水平]` 和 `X[年龄]` 的值代入公式即可。\n\n普通最小二乘法的原理与单特征回归相同，但它构建的直线位于多维空间中。如果你对此感到难以理解，首先尝试想象它在三维空间中如何运作——距离不再仅仅是“垂直”的，因此残差线不会像单特征回归那样都朝着同一个方向。从二维到三维的跳跃增加了复杂性，因此从三维到四维空间的跳跃则增加了更多我们无法可视化的东西。但它仍然是穿过该空间的一条“直线”。\n\
  \n#### 回归中的权重\n\n在实践中，回归有时过于简单，我们需要进行调整才能使其良好运作。一种常见的技术是对某些项添加数值权重，这样在运行回归之前，加权的\
  \ `X` 值会乘以一个权重值。例如，想象一个模型，其 `X` 值的测量方式可能不同。这意味着，比如所有的 `X[1]` 测量值都比所有的 `X[2]` 测量值的精确度低。也许哈维尔用一把旧尺子测量某物的长度，不得不将测量值四舍五入到四分之一英寸，而莎拉测量高度时有一把更好的尺子，她的记录精确到\
  \ 1/16 英寸。在这种情况下，哈维尔的测量值精确度较低，可以赋予较低的权重，以防止该特征在模型中产生过大的影响。\n\n### 逻辑回归\n\n逻辑回归使用一种称为\
  \ logit 模型的特定统计函数作为回归的基础。你不需要完全理解它就能进行逻辑回归，但其基本工作原理是：如果你取特征的线性组合（基本上是上述回归公式的右侧部分，如\
  \ `X[0] + m[1]*X[1] + m[2]*X[2] + … + m[n]*X[n] + e`），该值将等于一个涉及目标变量的特定分数的自然对数。我不展示具体的数学推导，但这会导致回归生成一条介于两个二值变量之间的曲线。\n\
  \n与其他技术一样，逻辑回归也有一些要求和假设。我们这里讨论的是二元逻辑回归，因此数据必须是二值的。另一个要求是数据集不能太小（这取决于你的数据，但通常几百条记录配上几个特征就足够了）。特征之间需要相互独立。\n\
  \n逻辑回归的运作方式与线性回归有些相似，它通过使用特定技术最小化某个函数，来确定一个目标值与另一个目标值之间的决策边界。它使用额外的数学计算来得出公式中的系数：`logit(Y)\
  \ = X[0] + m[1]*X[1] + m[2]*X[2] + e`。模型会为每条记录分配属于类别 1 和类别 2 的概率（类别 2 的概率等于 1 减去类别\
  \ 1 的概率），然后使用一个阈值（默认为 0.5）来应用适当的标签。概率高于 0.5 的归为类别 1。\n\n如果我们再看一个实际例子，我们有另一个数据集，这次是关于儿童身高的。我们拥有性别、身高和年龄数据，并希望根据其他两项来预测性别。虽然男孩确实比女孩高，但仍有大量重叠，因此仅凭这两个特征，我们的模型不会很理想，但应该比随机猜测要好。我建立了模型，然后绘制了仅身高（在二维图中我只能绘制目标变量和一个特征）的值以及所谓的逻辑曲线，即决策边界。如图\
  \ 15-9 所示，曲线为红色。在数据划分更清晰的数据集中，曲线更呈 S 形，顶部和底部更平坦，中间对角线更陡峭。\n\n![](img/628533_1_En_15_Fig9_HTML.jpg)\n\
  \n标题为“儿童身高与性别”的散点图，x 轴为身高（厘米），y 轴为性别。蓝色点代表男孩和女孩的个体数据点，女孩在上方，男孩在下方。一条红线表示整个数据集的趋势或平均身高。\n\
  \n**图 15-9** – 儿童数据集中身高与性别的逻辑曲线\n\n\n\n#### 非线性回归\n\n非线性回归是一种生成非线性函数的回归方法，该函数以非线性组合的方式结合了模型参数。某些数据可能并不呈直线分布，但仍能拟合出可识别且可量化的模式。非线性回归有多种类型，因为只要拟合函数能适配数据，它几乎可以是任意形式。然而，并非所有包含非线性函数的模型都算作非线性回归；因为如果该函数可以表示为模型参数的线性组合，那么它仍被视为线性回归。\n\
  \n将非线性函数线性化的一种常用方法是：如果至少有一个预测变量是自然常数`e`的幂次方，则对函数两边同时取自然对数。不必完全理解这一点。只要知道存在这种技术，就能在需要时找到它——即便你使用的大多数回归方法很可能是线性回归。\n\
  \n### 树\n\n树是另一类非常流行、通用且实用的监督式机器学习算法。它们不需要数据呈线性，并且可用于分类和回归。更棒的是，它们还能处理类别型特征。树算法的基本原理是反复使用“如果-那么-否则”的场景对数据进行分割：从顶部包含所有数据开始，根据规则将数据分成多个组，然后沿着每个分支继续向下，直到达到某个停止点，并为当前这批数据赋予一个标签（在分类任务中）或一个数值（在回归任务中）。所生成的逻辑在可视化图中极为直观，看起来就像一棵家谱树。\n\
  \n我首先要介绍最简单的树算法，即所谓的决策树。从技术上讲，有几种不同的算法可被视为决策树，因此我只介绍最常见的一种。在讨论完决策树后，我还会介绍随机森林，它通过构建多棵决策树并将所有不同结果进行组合以得出单一结果，从而实现了对决策树的扩展。\n\
  \n#### 决策树\n\n决策树很可能是目前最直观的机器学习方法。线性回归虽然易于解释，但仍需思考数学问题，这可能会让一些利益相关者思维停滞。而决策树可以被绘制出来，并且任何人都能直观理解。它之所以如此实用，还有另外几个原因：它不要求数据呈线性，并且能够处理类别型特征。我将展示一个基本的决策树示例，代表一个简单的垃圾邮件过滤器（严格来说是垃圾邮件标记器），供参考（图\
  \ 15-10）。\n\n![](img/628533_1_En_15_Fig10_HTML.jpg)\n\n流程图描述了一个用于识别垃圾邮件的决策过程。流程图从“发件人未知”开始，分支为“真”和“假”。如果为真，则检查“发件人邮箱域名未知”，接着引导至“包含标记词”，并最终判定为“垃圾邮件”或“非垃圾邮件”。如果为假，则检查“包含标记词”，引导至“垃圾邮件”或“包含大量拼写错误”，并最终判定为“垃圾邮件”或“非垃圾邮件”。\n\
  \n**图 15-10** 一个用于标记邮件是否为垃圾邮件的简单决策树\n\n决策树由节点和叶节点组成。*节点*表示对一组数据应用的分割点：我们有一批数据，要在节点处应用一个“如果-那么-否则”的问题，并根据答案将数据发送到两条（或多条）路径上。节点通常用椭圆表示。在图\
  \ 15-10 中，所有椭圆都是节点，每个节点都包含在该点处用于将数据分割成两个不同组的问题。*叶节点*是任何分支的终点，表示一个被赋予特定标签或数值的组，它们通常用矩形显示。图中所有标注为“垃圾邮件”或“非垃圾邮件”的矩形都是叶节点。从一个节点到另一个节点，或从一个节点到叶节点的路径用单线表示。每个节点问题的答案显示在相应路径线旁边。以图中的树为例，所有问题都是二元的，因此它们都显示为“真”或“假”。还有一个特殊的节点——位于顶部的第一个节点，称为*根节点*（简称根）。图中的根节点是顶部的“发件人未知”。我们把从根节点到任意叶节点的完整路径称为*分支*。请注意，相同的问题可能出现在树的不同分支中，就像图中的“包含标记词”一样。\n\
  \n这是一个直观的展示。理解如何对一条新记录使用已构建好的决策树的方法是：首先根据该记录的值，询问并回答根节点中的问题；如果答案为真，则沿左侧路径向下；如果为假，则沿右侧路径向下。然后询问新节点的问题，并根据答案沿着正确的路径继续。依此类推，直到到达一个叶节点，无法再继续前进。该叶节点就是将被分配给这条记录的标签或数值。\n\
  \n以上就是如何使用已有的决策树，但如何创建它呢？如前所述，实际上有几种不同的算法用于训练决策树。它们有很多共同点，但我将描述其通用方法。基本概念是：对于给定的一批数据，你需要决定哪种分割最为有效。这意味着目标是找到一个能完美分割数据的问题，使得一个叶节点中的所有记录都拥有一个目标标签，而另一个叶节点中的所有记录都拥有与第一个叶节点不同的目标标签。这在理想情况下是叶节点形成时发生的；但在过程中，当找不到那个完美问题时，它必须对数据进行分割。因此，它会查看所有可能被询问的特征，并根据数据将如何被分割来计算一个指标。你不需要真正理解这些指标是什么，但熵（来自信息论）和信息增益是常用的指标。\n\
  \n\n\n我们将通过查看一小部分电子邮件数据集样本，来了解图 15-10 中的树是如何构建的。用于训练该决策树的数据见表 15-1。实际上，训练这个模型需要更多的数据，但我们仍然可以看到如何利用数据和问题来构建一棵树。我将沿着一个分支向下，逐步进行分析。\n\
