- '# 7. 全新视角：新一代数据分析


  ## 引言


  我们之前已经了解到，数据科学与许多其他术语相关——数据分析、人工智能、机器学习等等。这里再介绍一个：分析。


  `数据分析`作为一个概念已经存在了一段时间，但这个术语开始被更多地用作一个统称，用来描述精明的公司正在采用的一种全面的数据驱动方法。一个成功的分析计划涉及许多学科，但最重要的是商业智能、数据分析、数据科学、数据库管理、数据工具管理以及数据工程（其中日益出现一个称为分析工程的专门分支）。所有这些都为一个有助于公司实现其目标的分析计划做出贡献。分析计划中经常包含的其他领域包括机器学习工程和生产化支持。


  我之前在前几章已经讨论过数据分析和数据科学，我将在后面的章节中更多地讨论商业智能和机器学习。现在，我将快速解释我们尚未讨论过的术语。`商业智能`基本上是商业报告——图表和仪表板——帮助人们做出明智的决策。`数据库管理`特指对数据库和其他一些数据存储的管理。`数据工具管理`是管理数据科学家和其他数据工作者使用的各种工具。`数据工程`涉及为`数据工作者`（使用数据的人，包括
  BI、数据分析师和数据科学家）捕获和准备数据，而`分析工程`是数据工程的一个子集，其中的工程师拥有更多的分析专业知识，可以更好地准备数据，以便数据工作者更容易使用。`机器学习工程`涉及实施数据科学家创建的机器学习模型，以使它们更高效并准备好投入生产。`生产`指的是在“现实世界”中运行的软件——该软件依赖于真实数据，由实际客户使用，自动运行以为仪表板等创建新数据。将诸如预测模型之类的东西投入生产通常是开发它的全部意义所在，但数据科学家也会编写大量代码，这些代码仅用于生成要直接与利益相关者分享的结果。数据科学家有时确实需要自己进行生产部署，因此其他`生产或部署支持或工具`会协助完成这些任务。一些数据科学家可能会发现自己要执行许多——甚至全部——这些任务，但在更大、更成熟的组织中，这些任务是被分开的。


  为了说明所有这些角色在一个拥有不同人员担任这些角色的成熟组织中可能如何互动，考虑一家公司，它托管客户图像文件并自动为其添加标签和分类，允许用户相互关注和分享图像，并为新用户提供关注建议。会有数据库存储图像文件、标签、标签、相关元数据和其他数据，这些由数据库管理员管理。数据工程师将负责收集额外的数据，可能涉及客户使用和行为、额外的图像元数据以及系统行为。他们和分析工程师还将负责为
  BI 工程师和数据科学家等数据工作者准备这些数据以供使用。BI 工程师将创建仪表板，供领导层和其他人员用于了解他们感兴趣的网站方面的持续趋势和行为，例如用户数量、存储的图像数量以及分享数量。数据科学家将查看数据并进行调查，以回答业务利益相关者的问题，但他们还要负责确定推荐引擎是否需要修改。他们还可能准备一些用于内部报告的数据。机器学习工程师将负责实施数据科学家中将投入生产的任何流程，例如对推荐引擎的更改或自动化数据科学家用于报告的数据，他们将与数据工程师或分析工程师合作，使这些数据可供
  BI 工程师使用。


  这种成熟度概念——即不同组织处于不同的分析成熟度水平——也将在本章中讨论，同时还有四类分析，它们通常需要不同的成熟度水平才能实现。


  ### 分析术语杂烩


  我们在上一章中已经通过谷歌 Ngram Viewer 查看了数据科学相关许多术语的使用情况，但看看“分析”这个词排在什么位置很有趣。在图 7-1 中，你可以看到它排在“AI”和“机器学习”之后，但早于其他所有术语。请记住，这只是在统计截至
  2022 年的所有著作中这些单独术语出现的次数。


