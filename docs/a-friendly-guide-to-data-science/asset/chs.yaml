  \ Python、PySpark、Databricks、Azure 或 AWS 上的 PyTorch\n\n**数据科学的未来：** 关于生成式 AI 和大语言模型的讨论很多，但他认为这些不会从根本上改变数据科学领域，尽管他自己也会将它们与谷歌搜索结合使用。在他与同事的交流中，似乎教育背景很重要，并且需要掌握超越基础的知识。这不一定是正规教育，但如今要在数据科学领域表现出色，你需要更深入的技术知识，而过去领域知识曾是最重要的。随着神经网络日益流行，这一点尤其如此。\n\
