  \ Plaza, New York, NY 10004, U.S.A.\n\n*献给我的父亲——感谢你在那些安静的周六早晨带我去上班，打开那台额外的电脑，让我能把从《3-2-1\
  \ Contact》杂志上抄下的代码行输入 BASIC 解释器。*\n\n## 引言\n\n数据科学被誉为二十一世纪最性感的工作，因为它潜力巨大，能够帮助组织通过数据洞察更好地了解自身及其运作方式，从而使其各项事务做得更加出色。许多组织领导者一直对此兴奋不已。然而，暂且不提现在就对连四分之一都未走完的整个世纪妄下断言还为时过早，“数据科学”这两个小小的词其实并未传达出获得那些有用洞察所需付出的规划和工作量。\n\
  \n人们（尤其是企业界占多数的非技术领导者）常常听到“数据科学”、“机器学习”和“人工智能”这些流行术语，便认为它们能解决所有问题。这些人通常会组建一个数据科学团队——或者有时只雇佣一名数据科学家——然后期望洞察能喷涌而出。但更常见的情况是，他们雇佣的倒霉数据科学家会发现数据不足以支撑数据科学工作，尤其是高质量的数据科学。即使是最熟练的数据科学家也无法将水变成酒——“垃圾进，垃圾出”这一准则在数据领域是百分之百正确的。这很不幸，通常也意味着工作根本无法完成。但在面对“垃圾进，垃圾出”时，一个更危险的情况是：缺乏经验的数据科学家可能会产出垃圾结果——那些看似有洞察实则完全错误的东西。他们可能将这些伪洞察传递出去，而领导者则可能据此做出完全错误的商业决策。要避免这种噩梦般的场景并获得有意义的洞察，了解数据科学的要求和局限性至关重要。\n\
  \n理解数据科学的要求和局限性同时也提醒我们注意所有技术工作中存在的时间-质量-成本三角。你不可能以低成本快速获得高质量的数据洞察。当优先考虑其他两项时，至少有一项会受损。数据科学项目中总有许多变动因素。\n\
  \n本书旨在通过展示数据科学所涉及的惊人广度来帮助你理解其原因。这些领域包括统计学、数据分析、编程、伦理、数据安全、数据隐私、数据工程、机器学习（ML）、自然语言处理（NLP）、数据可视化、大数据、云计算和项目管理。大多数项目只涉及其中部分领域，但很难提前预知哪些领域会真正相关。因此，真正理解进行数据科学时应考虑到的所有方面，将有助于将你的期望调整到更现实的水平。\n\
  \n本书的最后部分聚焦于成为一名数据科学家所需具备的实践要素。成为一名优秀的数据科学家，并不需要在上述所有领域都成为专家。但了解数据科学触及哪些领域以及它在哪些领域运作仍然很重要，因为有时可能需要其他领域的专家协助，或者你需要自行培养这些技能。数据科学是一个不断变化的领域，从事这项工作意味着你永不停歇地学习。\n\
  \n\n"
- '# 本书的读者对象


  **大学学生**：如果你是在攻读学位课程初期，并计划进入数据科学或众多相关领域的学生，本书将为你打下学位课程中将学到的所有内容的基础知识。有时，在攻读学位的过程中，你可能会对每个主要课题（比如这是关于无监督学习的课程，这是关于数据清理的课程等）持有非常狭隘的看法，而本书将防止你忘记所学内容的更大背景。它就像是你学位课程的一张路线图。


  **职业转型者**：如果你正计划转向数据科学领域，你会想要理解数据世界中各个部分之间的相互关系。如前所述，你不需要让自己成为数据科学所有领域的专家，但阅读这本书可能会帮助你选择一些领域，作为你进入新领域学习之旅的焦点。


  **组织领导者**：如果你正在考虑为你的组织引入数据科学，或者你的组织里已经有数据科学家，那么对整个数据科学学科有一个良好的理解将是无比宝贵的，并能帮助你理解正在做什么，为什么需要一些时间，以及为什么它并不便宜。这本技术书籍比许多为领导者编写的关于数据的书籍更具技术性。你显然可以跳过或略读一些最技术性的部分，但这种更深入的了解将帮助你理解事物为何如此运作。


  **公民数据科学家**：很多人已经摩拳擦掌，通过像 Kaggle 这样的网站开始编写数据科学代码。如果你是他们中的一员，并且只有那种经验，这本书可以让你了解你所涉足的这个领域的全貌。它能帮助你理解培养严谨性的必要性，并确定你想要进一步学习的领域，这一点与职业转型者类似。


  ## 本书涵盖的内容


  本书分为三个部分——第一部分：基础，第二部分：进行数据科学，第三部分：未来。第一部分涵盖了在深入实际数据科学之前需要理解的最重要的概念和实践。顾名思义，第二部分着眼于构成数据科学实践的各个组成部分。最后，第三部分探讨了如何让数据科学成为你未来的一部分。


  ### 第一部分：基础


  第一部分包含九个章节，对于总体上理解数据科学至关重要。第 1 章探讨了数据科学最基本的方面——数据本身。第 2、3 和 4 章介绍了统计学的各个方面，因为统计学在许多数据科学中至关重要。第
  2 章涵盖了描述性统计，这是大多数数据科学项目早期进行的探索性数据分析的核心。第 3 章深入探讨了概率论和推断统计学的基础知识，包括概率分布、抽样以及实验和研究设计。第
  4 章完成了对推断统计学的讨论，并涵盖了统计检验。


  第 5、6 和 7 章都是关于分析学的。第 5 章将数据分析作为一个独立的领域进行介绍，这个领域比数据科学存在的时间更长，并且构成了许多数据科学工作的基础。第
  6 章深入探讨数据科学本身，定义了它并讨论了它如何融入组织。第 7 章讨论了“新数据分析”，这基本上是一个总括性术语，用于描述当今使用数据进行的任何分析，无论它属于数据分析、数据科学还是任何其他领域。


  第 8 和 9 章阐述了一些在进行数据科学时需要考虑的重要因素。第 8 章讨论了数据安全与隐私，第 9 章则着眼于与数据科学相关的伦理问题。


  ### 第二部分：进行数据科学


  第二部分包含了大部分章节，并讨论了数据科学中得以实施的具体领域。第 10 章涉及领域知识，即人们在特定领域（如医学或零售）做好数据科学所必须掌握的对该特定领域的理解。第
  11 章讨论了数据科学的编程方面，特别是 Python 和 R 语言。


  第 12、13 和 14 章都具体讨论数据。第 12 章着眼于数据收集和存储。数据收集可以是手动的或自动化的，并且在此过程中可能会出现许多挑战。如今，数据存储最常见的是在数据库中，但也存在其他可能性。第
  13 章讨论了通过预处理步骤为数据科学准备数据。第 14 章深入探讨了特征工程，这是在能够进行数据科学之前几乎总是需要对数据进行额外部工作。


  第 15、16 和 17 章讨论了机器学习、性能评估以及数据科学中使用的与语言相关的技术。第 15 章是一个很长的章节，涵盖了机器学习的众多领域，包括一些使用的具体通用技术。第
  16 章讨论了衡量机器学习效果好坏的多种方法。第 17 章涉及处理语言（无论是文本还是语音）的工作，涵盖了用于为进一步工作准备数据的许多处理技术。


  第 18 章深入探讨了数据科学中可视化与展示这个极其重要的领域。可视化和演示通常是你的利益相关者所能看到的全部内容，因此做好这一部分至关重要。


  本部分的其余章节阐述了几个不同的具体领域。第 19 章着眼于正在使用以及可能使用机器学习与语言处理的众多领域。可能性非常多。第 20 章讨论了可扩展性和云，这对于当今在众多组织拥有的大型数据集上进行数据科学至关重要。第
  21 章着眼于数据科学项目管理和跟踪，这是该领域出了名困难的部分。数据科学项目常常被塞入为软件开发设计的体系中，但它们通常并不适用。第 22 章阐述了一个既关乎伦理也关乎做好数据科学的重要领域：人类的认知偏见、谬误以及该领域的悖论。它讨论了它们是什么、如何显现以及如何应对。


  '
- '# 第三部分：未来


  第三部分包含三个章节，讨论了进入数据科学领域的各个方面。第 23 章阐述了开始进行实际数据科学工作的重要性，以及利用众多公开可用的数据集（或你自己的数据集）来做这件事是多么容易。第
  24 章讨论了如何进一步学习数据科学知识——即使当你已经是一名数据科学家时，你也总需要不断学习。最后，第 25 章阐述了数据科学及相关职业，以及如何进入这些领域。




  '
- '# 从业者简介


  在每章的末尾，我都会根据对一位数据科学或相关领域从业者的访谈，附上一篇他们的简介。其中少数人从事的并非数据科学领域，而是根据其主题与特定章节搭配。在访谈中，我试图了解每个人的“故事”——他们是如何进入数据科学或当前领域的。这些故事听起来很有趣，因为数据科学以及整个科技行业汇聚了背景各异的人。这部分是因为数据科学的学位项目相对较新，所以许多当前的从业者都来自其他学科（物理学是资深数据科学家最常见的来源之一）。这很好地提醒了我们，知识的广度在数据科学中是多么宝贵。这些简介还包含了从业者对在该领域工作的看法，再次展示了不同的人如何偏爱不同的领域，而个人偏好始终起着作用。这些内容都很有趣，所以千万别错过。


  ## 致谢


  我深深感谢在成长为数据科学家的过程中给予我指导的几位导师和向我传授知识的其他人，尤其是斯科特·塔克和萨斯·内奥吉。我还要感谢“梦之队”的成员大卫·史密斯和劳伦·詹森，他们与萨斯一起，让我见识到了一个优秀的数据科学团队能取得的成就。


