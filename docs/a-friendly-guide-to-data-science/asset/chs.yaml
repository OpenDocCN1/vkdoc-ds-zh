  \ 1994-01-13 |\n| 16 | 豚鼠 | Rufus | 雄性 | 1982-11-01 |  | 黑色 | 白色 | 1984-12-08 |\n\
  | 17 | 仓鼠 | Hammie | 雄性 | 1981-07-18 |  | 棕褐色 |  | 1982-10-02 |\n\n数据框之所以方便，是因为它们允许我们通过单个命令对行、列甚至整个数据框执行操作。添加新列和新行也很容易。分组数据和聚合操作可以在一步内完成。例如，仅用一行代码，即可在\
  \ `Python` 和 `R` 中，根据其他列中的出生和死亡日期添加一个 `Age` 列。在 `Python` 中，它看起来像这样：\n\n```\npets_df[\"\
  Age\"] = pets_df[\"Date_died\"] - pets_df[\"Birth_date\"]\n```\n\n根据数据类型以及你希望 `Age`\
  \ 列所在的单位，可能还需要一些额外操作，但从概念上讲，你只需要这样做。它知道要去获取整个列，将行对齐后的另一列相减，然后将结果作为新列添加到数据框的末尾。这比过去处理表格数据的方式（通常是在循环中逐行处理，每次循环都进行计算，这比使用数据框操作花费的时间多得多）要容易得多。\n\
  \n数据科学家喜欢用数据框处理大量表格数据，但他们如此偏爱 `Python` 和 `R` 的另一个原因是两种语言都提供了统计学、可视化和机器学习相关的包。表 11-12\
  \ 展示了数据科学家在 `Python` 和 `R` 中使用的众多包中的一部分。有些是内置的，但大多数需要安装（幸运的是，这很容易做到）。详细讨论如何使用这些包超出了本书的范围，但我们将在后续章节中讨论机器学习。\n\
