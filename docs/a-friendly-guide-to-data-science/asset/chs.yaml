  \ `^` `**` | `^` `**` | `6 ^ 2` 得到 36。`6 ** 2` 得到 36。 |\n| 计算模（余数）。 | n % m | `%`\
  \ | `%%` | `6 % 2` 得到 0。`7 % 2` 得到 1。 |\n\n数学运算中一个重要的概念是*运算顺序*，它决定了数字和运算符的组合会先执行哪一个。这与常规数学中的规则相同，可以使用括号强制优先计算某些部分。手写数学表达式时，通常会加上括号以确保清晰明了；但在代码中，只有当运算顺序确实需要时，才会使用括号。例如，表\
