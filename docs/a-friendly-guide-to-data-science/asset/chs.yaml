  ## 指标


  我们可以在数据集中衡量多种事物，从描述性统计开始，它又可以细分为位置度量和离散程度度量。描述性统计能让我们了解数据集中某一特定列的情况。在这些计算中，我们绝不会包含多个列。


  ### 位置度量


  *位置度量*也常被称为中心趋势度量，因为它们实际上试图告诉我们数据的“中心”在哪里，这有助于我们理解数据集的典型特征。如果我们有一些美国人的身高数据，而均值大约为
  4 英尺，我们很可能会猜测这些数据记录的是儿童而非成人的身高。


  主要的位置度量包括均值（及其变种切尾均值）、中位数和众数。除了众数，所有这些都要求数据是数值型的。众数可以针对数值型或分类型数据确定，但在数值型数据的情况下，处理起来会更困难，通常需要分桶。我们将在下面看到原因。


  大多数人都知道如何计算*均值*（或*平均数*），它只是所有数据点的总和除以数据点的总数。这确实能让我们对数据的中心位置有所了解，但它可能会被*异常值*（即与其余大部分数据不同的值）扭曲或偏斜。*切尾均值*是一种经过调整的计算方法，它会移除两端一定比例的极端值，旨在防止异常值给出非代表性的均值。例如，5%的切尾均值会切掉所有数据中顶部
  5%和底部 5%的值，这意味着只使用中间 90%的数据。我们也可以在两端切掉特定数量的数据点——例如，在评委的奥运评分中，他们会在计算均值之前去掉最高分和最低分（这有时也称为*修正均值*）。


  **异常值**


  通俗地说，异常值基本上就是与绝大多数其他数据截然不同的数据点。例如，我们都知道，一名 7 英尺 2 英寸高的篮球运动员绝对是人类身高中的异常值。但一个 6 英尺
  4 英寸的人呢？如果你来自一个身高较矮的家庭，这可能算是极端情况，但也有很多高个子家庭，其中有几个成员就长这么高。尽管在统计学上对于如何定义异常值没有普遍共识，但有一些技术可以用来识别它们。不过，有时当数据集很小，或者存在一些与其他值相差极其悬殊的值时，仅仅观察这些值就足以识别出异常值。


  *中位数*是另一个关键的位置度量，因为它有时能比均值更真实地展现数据集的中心，尤其是在数据非常偏斜的情况下（偏斜将在下一节讨论）。中位数简单来说就是将数据按数值排序后位于正中间的那个数。如果数据点数量是奇数，它就是正中间的那个数据点；否则，它就是中间两个数据点的均值。人们认为中位数比均值更能容忍异常值。


  *众数*就是数据集中出现次数最多的那个值。这是一个既适用于数值型数据也适用于名义型数据的度量。它是另一种让我们了解数据典型特征的方式。对于分类数据和有序数据，以及任何等间距的数值型数据（如整数），计算众数都很简单。如果我们处理的数值型数据有很多可能的值且彼此接近，那么在计算众数之前，通常需要对它们进行分桶或截断处理。例如，如果学生成绩可以是任何计算值，那么将
  92.1、92.25、94.0、94.25 和 94.33 这样的值通过截断小数部分归为两个桶可能更有价值，这样你就得到两个 92 分和三个 94 分，其中 94
  就是众数。


  虽然选择使用哪种位置度量并不总是至关重要，但不同度量在不同情况下可能各有所长。均值适用于数据分布相当对称且没有太多异常值的情况。像人类身高这类数据往往具有这种特征。中位数适用于数据向某一方向偏斜的情况。房价可能就是如此，因为大多数房子价格相对较低，但房子贵起来确实没有上限。如果你有以下五个房价：12.5
  万美元、15 万美元、17.5 万美元、20 万美元和 1700 万美元，那么你的数据集就非常偏斜。尽管大多数价格要低得多，但均值却超过 300 万美元。这里的中位数是
  17.5 万美元，这显然更符合实际数值的直观感受。


  **计算位置度量**


  我们将从包含以下十个数据点的考试成绩子集开始：


  *   67, 11, 93, 53, 79, 60, 74, 93, 99, 78


  我们首先要做的是将它们排序：


  *   11, 53, 60, 67, 78, 79, 74, 93, 93, 99


  我们可以看到中间的两个值是 78 和 79，并且有一个直观上明显的低值异常点 11。


  我们可以通过求和所有值并除以数量来计算***均值***，得到`70.7`。


  如果我们想计算***切尾均值***，我们可以通过去掉顶部和底部的值（各占总值的 10%）来得到一个 10%的切尾均值，即`74.6`。


  ***中位数***很容易计算，正如我们上面观察到的，中间的两个值是 78 和 79，因此中位数是这两个值的平均数，即`78.5`。


  ***众数***在这里也很容易计算，因为我们处理的是少量整数。唯一出现多次的数字是 93，所以这就是众数。如果这里没有重复值，那么就没有众数。


  数据分析师和数据科学家很少需要手动计算这些东西，因为我们使用软件或代码，但理解这些标签的真实含义很重要。




  ### 离散程度的度量


  了解数据的中心位置固然有用，但你也需要掌握数据的离散程度。此外，如果数据中存在大量位于标尺两端的数值，那么“均值”就完全不具备典型性。想象一个家庭，其中男性非常高而女性异常矮——如果我们计算他们身高的平均值，会得到中间的一个数值，这完全不能代表任何一位典型的家庭成员。


  关注中心度量之外的信息能帮助我们理解各个数据点之间的差异程度。*离散程度的度量*在这方面很有帮助，它包括了：全距、四分位距（IQR）、方差、标准差、偏度和峰度。


  在处理离散程度时，你通常首先会注意到*最小值*（最低数据点）和*最大值*（最高数据点）。最基本的离散程度度量是*全距*，它就是用最大值减去最小值。


  数据还可以通过排序并以中位数为界分成两半，再分别通过各自的中位数将每一半一分为二，从而划分为四个相等的部分，这就是*四分位数*。值得注意的是，我们以特定方式指代四分位数，即通过每个部分的最高点来指代。因此，第一四分位数位于约
  25% 的数据点处，第二四分位数位于 50%（即中位数），第三四分位数位于 75%，而第四四分位数则是顶部的 100% 处。注意，第二四分位数就是整个数据集的中位数。一个相关的度量称为*四分位距*，它就是第三四分位数减去第一四分位数。如果你见过箱线图，就会对四分位数有一些熟悉感。下文会有更多关于箱线图的信息。


  注意，我们还有一种与四分位数类似的度量，叫做百分位数。这些是介于 0 和 100 之间的整数，表示有多少百分比的数据低于该值。第 90 百分位数表示有 90%
  的数据值都低于该数值。四个四分位数分别对应第 25、50（中位数）、75 和 100 百分位数。


  另外两种离散程度的度量是方差和与之相关的标准差。*方差*是一个单一数值，它反映了数据围绕均值离散的程度。计算它需要先求出每个数据点与均值的差值的平方和，然后将总和除以数据点的个数。平方操作确保了与均值方向相反的差值不会相互抵消。*标准差*就是方差的平方根。它通常更受欢迎，因为它的单位与数据点相同，所以更直观。


  另外两个在实践中不太常用的度量是偏度和峰度。当数据分布不对称时，即均值和中位数相差很大时，数据被认为是**偏斜**的。数据偏斜时，直方图的顶部不会居中。估计*偏度*的一种简单方法是计算均值和中位数之间的差值，将该值除以标准差，最后再乘以
  3。如果中位数大于均值，则数据呈负偏态；如果中位数小于均值，则呈正偏态。只有当均值和中位数相等时，才能说数据是无偏的。


  *峰度*也关注尾部，但它关注的是直方图上尾部（低计数区域）延伸的远近，因此有时被称为“尾重”的度量。计算它需要几个步骤。首先，对每个数据点，求出该点与均值之差的四次方。然后对这些值求平均值，再除以标准差的四次方。有时，当我们希望用正态分布作为背景来看待峰度时，会从这个数值中减去
  3（正态分布的峰度），从而得到*超额峰度*，它表示该分布与正态分布差异的贡献程度。


  ### 计算离散程度的度量


  我们可以从与上文相同的考试成绩数据开始，包含以下十个已排序的数据点：


  - 11, 53, 60, 67, 78, 79, 74, 93, 93, 99


  我们可以清楚地看到***最小值***是 11，***最大值***是 99。


  ***全距***就是最小值与最大值之间的差值，即 88。


  用这个数据集计算***四分位数***并不困难。首先，我们以中位数 78.5（如上文计算）为界将数据分成两半。然后，每一半再根据其中位数分成两半，得到以下四分位数：第一四分位数位于
  60，第二四分位数位于 78.5，第三四分位数位于 93。


  ***四分位距***（IQR）就是第三四分位数减去第一四分位数，即 33。


  ***方差***的计算需要对每个值与均值（上文计算的 70.7）之差的平方求和，然后将该总和除以值的个数 10，得到 583.1。这个数字显然很难直观理解，因此我们取平方根得到***标准差***，即
  24.2。由于单位与考试分数相同，它更容易理解。


  偏度是较不常见的数值之一，但我们仍然可以计算它：取均值与中位数的差值，除以标准差，再乘以 3，得到***偏度***为 –0.97。


  峰度同样不常见且不太直观，但我们仍然可以计算它。我们计算每个点与均值的差值，然后将每个差值四次方，再对这些值求平均值，最后除以标准差的四次方，得到***峰度***为
  4.1。


  所有这些度量都能让我们更好地了解数据的离散情况。


  ## 可视化


  有多种图表和其他可视化形式被视为描述性统计的一部分。其中一些有助于直观理解位置和离散程度的度量，而另一些则可以揭示不同字段之间的关系。




  ### 散点图


  尽管散点图是最基础的图表之一，但它却极为有用。它将一个变量与另一个变量进行对比绘制，其中一个位于 X 轴，另一个位于 Y 轴。这种图表仅适用于两列数值型数据。根据两列中的数值，每一行数据都对应图上的一个点。图表看上去可能像是一堆随意散布的点，但有时也能观察到模式，例如相关性。而寻找相关性或其他模式，正是查看散点图最常见的原因之一。


  理解散点图最简单的方法之一，就是观察一幅具有相关性的图表。我们有一个数据集，包含一组患有哮喘的儿童的身高、体重和性别，以及一些与他们的气道相关的测量数据（气道在不同条件下的工作情况）。这个数据集虽然无法告诉我们这些儿童的身高体重与未患哮喘的儿童相比有何差异，但我们可以探究数据集中各个数值之间的相互关系。


  如果我们根据他们的年龄和身高绘制散点图，可以在图 2-7 中看到一个清晰的模式。


  ![](img/628533_1_En_2_Fig7_HTML.jpg)


  散点图，标题为“按年龄划分的儿童身高”，显示年龄（x 轴，单位：岁）与身高（y 轴，单位：英寸）之间存在正相关关系。数据点分散，表明存在变异性，但总体趋势是从
  4 岁到 20 岁向上递增，身高从 40 英寸增加到 70 多英寸。


  **图 2-7** – 一组儿童身高的散点图


  很容易看出，随着年龄增长，孩子们的身高也在增加。这两个变量之间存在一个非常明显的共同增长趋势，当我们说变量之间存在相关性时，这就是变量之间的一种关系。我们将在本章后面讨论相关性及其测量方法，但这种快速的视觉检查正是我们使用散点图的主要原因之一。


  然而，虽然基本的散点图非常适用于识别相关性和其他模式，但一次只能绘制两个变量这个事实，在我们拥有多个变量时（这很常见），会成为一个显著的局限性。有几种方法可以解决这个问题：我们可以在同一张图表上用不同颜色绘制不同类别，还可以通过改变点的大小来对应第三个变量，从而将第三个变量纳入图表。


  以我们的数据集为例，其中还有性别信息。众所周知，男孩和女孩的身高普遍存在差异。通过根据性别将点设置为不同颜色，就可以轻松创建一张展示这一差异的图表，如图 2-8
  所示。


  ![](img/628533_1_En_2_Fig8_HTML.jpg)


  散点图，标题为“按年龄和性别划分的身高”，显示了男孩和女孩的年龄与身高关系。x 轴代表年龄（岁），范围从 4 到 20；y 轴代表身高（英寸），范围从 40 到
  75。蓝色点代表男孩，橙色点代表女孩。数据点呈现总体上升趋势，表明两个性别的身高都随年龄增长而增加。右下角的图例标识了男孩和女孩的颜色。


  **图 2-8** – 一组儿童身高与性别的散点图


  这个简单的修改揭示了一个现象——女孩似乎比男孩更早达到最大身高并停止增长，而男孩的生长时间则更长。


  另一种添加变量的方法是通过改变点的大小，创建出如今称为气泡图的图表。在气泡图中，通常会让气泡略带透明，因为较大的气泡可能会遮盖住其他气泡。我们的数据集包含一些与哮喘相关的测量值，因此我们加入了其中一个指标，该数值表示每个儿童的气道从工作状态转变为工作不佳时受到的测量共振频率，如图
  2-9 所示。


  ![](img/628533_1_En_2_Fig9_HTML.jpg)


  气泡图，标题为“按年龄和性别划分的身高与气道转折点”。x 轴代表年龄（岁），范围从 4 到 18；y 轴代表身高（英寸），范围从 40 到 75。蓝色气泡代表男孩，橙色气泡代表女孩。图表显示，两个性别的身高都随年龄增长呈总体上升趋势，两组之间存在一些重叠。右下角的图例说明了男孩和女孩的颜色编码。


  **图 2-9** – 一组儿童身高、性别与哮喘指标的气泡图


  尽管在本例中气泡大小差异并不巨大，但仍可明显看出有些气泡比其他的更大。气泡大小的差异取决于该变量的取值范围。气泡图之所以有价值，主要是因为与基本散点图相比，我们可以在图表上呈现更多的数值。结合颜色的使用，我们就能在一张二维图表中展示四个变量。




  #### 条形图


  *条形图*是另一种简单的可视化图表，因其直观性，常被媒体广泛使用。我们在图 2-4、2-5 和 2-6 中见过一种类型，但当时主要关注评分分布的规律，而条形图能展示的内容远不止于此。它最常用于名义数据，通常显示单个变量中各类别的计数。如上文所述，直方图是条形图的一种类型，但它是针对连续数据的，将在下文单独讨论。最简单的条形图可以在
  X 轴上显示某个变量的值，在 Y 轴上显示计数或百分比。条形图的柱子可以垂直或水平放置，但垂直放置最为常见。


  我们再次审视电子游戏数据集，可以看到自 2015 年以来每年的平均评分，如图 2-10 所示。


  ![](img/628533_1_En_2_Fig10_HTML.jpg)


  标题为“各年平均评分”的条形图，展示了 2016 年至 2022 年的平均评分。Y 轴表示平均评分，范围从 0 到 4，X 轴表示发布年份。每个柱子代表一个年份，评分稳定在
  3.5 到 4 之间。


  图 2-10

  展示九年电子游戏平均评分的简单条形图


