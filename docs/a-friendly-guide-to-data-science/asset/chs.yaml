- '# 4. 得出复杂结论：推断性统计与统计检验


  ## 引言


  实验设计、良好抽样和概率的重要性不言而喻，但二十世纪也为统计检验以及我们评估估计质量的能力带来了巨大进步，这两者共同推动了推断性统计学的发展。相关性和协方差是二十世纪发展出的其他重要概念。计算机将我们从小型数据集带入"大数据"时代。人们在"统计学"这一范畴下学到了许多不同的应用方法，数据科学家在日常工作中严重依赖这些新技术，尽管他们也从事许多超出统计学范畴的工作。


  本章将涵盖现代统计学的剩余历史。我们将研究统计学在现实世界中的两个例子，一个来自第二次世界大战，另一个来自 COVID-19 建模。然后，我们将介绍现代统计检验的基础知识，为学习具体检验方法奠定基础。这包括假设检验、`p`
  值、第一类错误和第二类错误、检验功效、误差范围、置信区间以及单尾检验和双尾检验。接着，我们将深入探讨一些最常见的统计检验——`Z` 检验、`t` 检验、`ANOVA`、卡方检验以及一些非参数检验。我们将了解显著性检验的工作原理，然后研究相关性和协方差。


  ## 现代统计学史：第二部分


  统计检验方法在二十世纪蓬勃发展。随着概率分布被发现，许多预测和假设检验方法应运而生。正态分布和学生 `t` 分布（与正态分布相关）在早期都至关重要，许多检验都源于这些分布，包括
  `Z` 检验、`t` 检验的多种变体、`ANOVA` 和卡方检验。但由于这些检验的局限性（我们必须假设数据呈正态分布，而统计学家知道并非在所有情况下都能如此假设），另一种称为非参数检验的方法也被开发出来。


  另外几个重要的技术和概念被定义——第二类错误、置信区间和检验功效，这些都与检验假设相关——我们将在下文讨论它们。随后，极大似然估计 (`MLE`) 和线性判别分析
  (`LDA`) 技术被开发出来。`MLE` 使我们能够根据一些已知数据点来估计一个分布（总体）的参数。`LDA` 使我们能够找到一条分隔两个不同数据组的直线。接着，`t`
  分布得到了更多关注和发展，另一种衡量相关性的方法也被定义出来。我们稍后也会谈到这一点。所有这些对于该领域的发展都至关重要。


  本世纪上半叶的大部分工作都是在相对较小的数据集上完成的。现在学生学习统计学时，他们仍然在处理小数据集上的计算，通常这些数据集小到可以手工完成计算。计算机的出现显然给该领域带来了巨大变革，使得那些手工永远无法完成的、更复杂且耗时的计算成为可能。一些统计软件程序，如
  `SPSS`、`Minitab` 和 `Statistica` 被开发出来并沿用至今，尤其受到社会科学家的青睐，而数据科学家、许多精算师以及大量其他计算科学家则在使用
  `Python`、`R` 或 `SAS`。


  数据分析师和数据科学家的工作并非全部依赖统计学，但其中很大一部分确实如此。该领域仍在不断发展，预示着未来将带来新技术的益处，这些技术可能会使预测等任务更加准确。明智的数据科学家会持续关注统计学领域的最新动态。


  ## 现实世界中的统计学实例


  ### 项目 1：德国坦克问题


  在第二次世界大战期间，盟军需要了解德军拥有多少坦克和其他武器。潜伏在轴心国地区的间谍收集情报以试图估算每月的生产数量，但他们的估算始终过高。因此，盟军的数学家采用统计方法来估算数量并推断德军坦克和武器的其他属性。


  德国坦克和其他武器上印有序列号，盟军能够在损坏或缴获的坦克上看到这些序列号。对序列号做出一些假设是很自然的，包括它们是连续的。换句话说，我们可以假设每个序列号都比前一个序列号大
  1。所有序列号的列表代表了所有坦克（"总体"）上所有序列号的一个样本。


  他们希望基于一个样本来推断总体大小，尽管他们无从得知该样本与总体之间的关系。有几种过于简单的方法（例如，将最大值加倍或将均值或中位数加倍），但这些方法都不太准确。相反，他们使用了一种称为最小方差无偏估计量
  (`MVUE`) 的计算方法，该方法涉及用最大序列号除以坦克总数，然后将最大序列号加到该结果上，最后减去 1。


  尽管直到战争结束后才得以确认，但结果证明统计学家的数字相当准确，尤其是与通过传统情报收集到的数字相比——两者的差异常常接近一个数量级，例如一个月生产 250 辆坦克与
  1，500 辆，而较低的数字非常接近实际数字。盟军得以在规划中使用较低的估计值。了解德军实际拥有的坦克数量使他们在冒险发动入侵时更加自信，尤其是在诺曼底登陆方面，这是战争的一个主要转折点。




  ### 项目 2：COVID-19 建模与预测


  2020 年初，COVID 首次在中国爆发并开始在全球蔓延后不久，各组织就开始收集病例数据，并试图了解传播模式以及预测新发病例。这项工作对于制定封锁、社交距离和口罩令等公共政策至关重要，尤其是在疫苗问世前的几个月。


  但建模面临着诸多挑战，我们中很多人都会记得早期许多预测有多么糟糕。这是第 1 章中讨论的数据质量低下的真实案例。你会在数据科学领域听到“垃圾进，垃圾出”这句箴言，因为它百分之百正确。当时对这种疾病知之甚少，其特性完全未被了解（我们做了大量无效假设），而且检测不一致且有限，导致病例被低估。早期我们甚至不知道它是如何传播的，或者在感染他人之前能存活多久。既然我们连
  COVID 在现实世界中如何运作都不了解，那么我们无法将已掌握的信息转化为可用数据也就不足为奇了。请记住，所有数据都仅仅是对现实世界某些方面的抽象。


  疾病建模长期以来一直是流行病学的一部分，但它依赖于许多已知因素，如传播率、感染者具有传染性的时长以及死亡率。许多在不同地区出现的疾病，如麻疹和鼠疫，根据以往爆发数据都相当为人熟知。因此，对于像
  COVID 这样相对较新的疾病，即使我们开始获得更好的数据，也需要进行大量的推测。科学家们显然会寻找与其他疾病的相似之处（特别是同属冠状病毒家族、包括 MERS
  在内的疾病），来为模型定义起点，但 COVID 的表现有所不同（例如，它对儿童的影响并不比对非老年成年人更大，这很不寻常）。科学家们只是利用有限的信息尽力而为。


  图 4-1 是早期预测瑞典 COVID 情况的较好案例，其中包含 2020 年 4 月至 7 月间做出的五种不同预测。它们都包含了历史数据，即你在左侧看到的峰值。但你可以看到它们在
  4 月之后如何出现差异。一个预测显示病例在 6 月逐渐消失，而另一个预测则显示一年后疫情仍很严重。预测中最大的挑战之一是，你预测的时间越远，对预测结果的信心就越低。而且他们手头只有几个月的数据，却要预测远超这个时间范围的结果，这通常是不应该做的。我们将在第
  15 章中详细讨论这一点。


