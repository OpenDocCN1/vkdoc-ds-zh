  – σ 和 μ + σ 之间。在标准正态分布图中，68% 的数据介于 -1 和 1 之间，而在身高分布图中，这个范围介于 66.4 和 71.6 之间。


  ## 使用正态分布


  在某些情况下，这条曲线和这些数值可能就足够了，但更多时候我们会以某种应用方式来使用正态分布的特性，这通常意味着转换我们的数据，以便能够以标准化的方式讨论它。


  ### Z 分数


  由于大多数正态数据并不完全符合标准正态分布，因此通常会对数据进行标准化，以便能相对于标准正态分布来讨论它。这是通过计算 *Z 分数* 来完成的，Z 分数是指给定值距离均值有多少个标准差。计算方法很简单：用该值与分布均值的差除以分布的标准差，因此结果可以是正数或负数。在标准正态分布中，无需除以标准差，因为其标准差为
  1——而这正是使用标准正态分布的全部意义所在。


  `Z-score` 是一个简单但极好的度量标准，可用于识别异常情况，例如在简单的异常检测任务中，或者定义报告异常值的阈值（如欺诈检测或监控计算机系统的性能问题）。


  ### 正态性检验


  由于许多统计技术都要求我们假设数据呈正态分布，因此检验数据是否真的符合正态分布非常重要。*QQ 图* 允许你通过可视化方式进行检查。QQ 图的 X 轴显示正态分布的分位数（这是正态性的参考点），Y
  轴从低到高按数值顺序显示数据集中所有的 Z 分数（这是你正在检验的值）。如果数据是正态的，你将得到一条从左下角到右上角近乎完美的对角线。你可以在图 3-4 中看到一个示例，图中的点代表检验值，红线代表数据正态时我们期望看到的结果。


  ![](img/628533_1_En_3_Fig4_HTML.jpg)


  比较样本分位数与理论分位数的 Q-Q 图。图中有一条代表等值线的红色对角线，蓝色的数据点紧密地沿这条线分布，表明样本数据近似服从正态分布。x 轴标注为“理论分位数”，y
  轴标注为“样本分位数”。


  图 3-4：使用随机正态数据的 QQ 图示例


  图 3-4 展示的是我们期望数据呈正态分布时的样子，而 QQ 图也能清晰地表明数据何时完全不服从正态分布。图 3-5 展示了来自泊松分布的数据（我们将在下一节讨论），很明显数据并未排列在对角线上。


  ![](img/628533_1_En_3_Fig5_HTML.jpg)


  比较样本分位数与理论分位数的 Q-Q 图。图中有一条代表等值线的红色对角线。蓝色的数据点大部分位于线上方，表明偏离正态分布。x 轴标注为“理论分位数”，y 轴标注为“样本量”。


  图 3-5：使用随机非正态数据（来自泊松分布）的 QQ 图示例


  另一个常见的检验是*科尔莫戈罗夫-斯米尔诺夫检验*，有时简称为 K-S 检验。该检验将数据集中标准化值的实际分布与标准正态分布进行比较。它会生成一个数值，表示正态分布与数据分布之间在相距最远点处的距离。


  我们已经知道，大多数事物并非完全符合正态分布，但通常它们很接近，足以让我们还能使用一些需要正态性假设的技术。这往往是一个依赖经验积累的判断，但进行检验而不是直接假设，这一点仍然很重要。




  ### 泊松分布


  离散泊松分布之所以有趣，是因为它着眼于那些初看起来难以量化的事物。具体来说，泊松分布对反复发生的、不规律的事件或现象进行建模。典型的例子包括在时间上间隔发生的事件，比如顾客进入餐厅、有人在工作岗位请病假，以及分布在空间上的事件，比如一本印刷书页面上的缺陷。任何在餐厅或零售店工作过的人都知道，总是会出现远超正常的“客流高峰”，或是令人惊讶的萧条时段，而这一切都没有明确的解释。事情就是这样发生了。


  泊松分布使用一个速率参数 `λ`（lambda），它代表在特定时间（或特定空间，例如书中的例子）内事件的平均发生次数。因此，我们确实需要了解所要建模的情形。但一家餐厅可以追踪数周内顾客的进店情况，得出这个平均值，以便将来使用该分布。请注意，`λ`
  也是该分布的方差。


  泊松分布的一个局限性在于，它要求 `λ` 随时间保持不变。餐厅员工都知道，午餐时间的顾客比下午 3:30 要多。我们可以通过为午餐时间使用一个 `λ`、为晚餐时间使用一个
  `λ`、为这两个时段之间的时间使用另一个 `λ`、并为晚餐后的时间使用第四个 `λ` 来处理这种情况。但时间段越短，实际操作中就越困难。


  我们可以看看在第 2 章中研究过的披萨餐厅数据，来判断它是否符合泊松分布。图 3-6 显示了一周内（仅工作日）午餐和晚餐时段每小时订单数量的分布，以蓝色条形表示。为了得到用橙色线绘制的泊松分布，我们通过计算前一个月中相同时间段一周内的平均值来计算
  `λ`。


  ![](img/628533_1_En_3_Fig6_HTML.jpg)


  条形图标题为“2021 年 6 月 21 日至 25 日工作日每小时订单数量”，显示了每小时订单数量的分布。x 轴标记为“订单数量”，范围从 0 到 40，y
  轴表示频数。蓝色的直方图显示了订单频数，峰值在 15 个订单左右。一条橙色线叠加在直方图上，表示一条分布曲线。


  **图 3-6** 工作日内每小时订单数量的泊松分布


  这相当吻合，这就是为什么泊松分布可以帮助餐厅进行规划。但正如我们最终会看到的，并非所有情况在现实世界中都能如此完美吻合。


  ### 指数分布与威布尔分布


  指数分布和威布尔分布与泊松分布相关，但它们都是连续分布，因为它们追踪的是时间而不是有限的事件。指数分布考虑的场景与泊松分布相同，也使用 `λ` 参数，但它建模的是从一个事件到下一个事件之间的时间。因此，当一位顾客进来时，指数分布可以告诉我们，下一位顾客大概多久之后会来。


  有时泊松分布似乎是正确的选择，但当某个事件随着时间的推移发生概率变得更大或更小时，威布尔分布则是更好的选择，因为它对特定事件发生前所经过的时间进行建模，同样基于时间或空间（如泊松分布）。一个典型的例子是追踪机械设备的故障。直观上，我们知道设备使用时间越长，由于持续的磨损，它就越有可能发生故障。威布尔分布基本上可以告诉我们，一台设备在指定时间内持续运行的可能性有多大，并且它需要两个参数。第一个参数称为形状参数，用
  `β`（beta）表示，它代表了故障概率随时间变化的快慢。如果它大于 1，则概率随时间增加；如果它为负，则概率随时间减少。第二个参数是设备的预期寿命，用 `η`（eta）表示。威布尔分布的一个局限性在于，`β`
  本身需要随时间保持恒定。


  ## 中心极限定理


  中心极限定理是另一个涉及样本统计量的概念，即计算来自同一总体的许多样本的平均值。中心极限定理指出，如果你在适当条件下，从同一总体中抽取多个样本并计算其均值（或其他统计量），那么随着样本量（所抽取样本均值的数量）变得足够大，这些均值的分布将趋近于正态分布。


  无论所抽取样本的总体分布如何，也无论所测量的统计量是什么，这个结论都成立。想象一下，有一个大垃圾桶，里面装满了各种大小不一的、不规则的弹珠。我们从中抽取一千个样本，每个样本包含一百颗随机选取的弹珠，并计算出所有这些样本的均值。这些样本的质量（即它们代表总体的程度）会有所不同，但许多样本会接近真实情况，只有少数会偏离真实情况。因此，我们会看到测得的均值聚集在一个中心点附近——那些来自能够很好代表真实弹珠的样本——而偏离中心点左右的测量值则越来越少，就像正态曲线一样。曲线的峰值很可能就是垃圾桶中弹珠平均值的准确估计。


  与中心极限定理相关的一个概念是均值回归，它基本上是说，随着时间的推移，数值会变得不那么极端。因此，如果出现一个极端值——比如某个玩家在纸牌游戏中得到了一个非常高的分数——那么下一局游戏的分数很可能会更低（不那么极端）。


  ## 抽样


  抽样是从一个更大的总体中获取数据子集的行为。根据上下文，这个术语可以表示几个相关的事情。在实验设计中，它意味着从那个更大的总体中选取成员以收集数据。在大多数情况下，我们无法获取某个事物整个总体的数据。一家市场调研公司不可能实际上与每一个美国人交谈，甚至不可能与每一位
  25 至 45 岁的美国女性交谈。我们必须想办法与其中更少的人交谈，以便能够有意义地推断到整个总体。然后，我们就可以进行研究，并通过某种方式与他们互动以获取数据。我们进行抽样的事实意味着，我们如何选择总体中的成员进行数据收集，可能会产生巨大的影响。


  第二种情况在数据科学中更为常见，有时我们面临的是相反的问题——数据太多。我们通常不是在进行研究，但我们可能需要从已有的数据中选择一个子集，以减轻计算负担，或为特定目的创建子集。例如，我们可能有数百万行关于服务器性能的数据，数千台服务器中的每一台都有数千行数据。我们可以选择一部分服务器，或者仅仅是选择一部分数据行，或者其他的子集。这也被称为抽样。在这种情况下，选择哪些数据点进入我们的样本，其大部分问题和考虑因素与第一种情况相同。然而，这里我们有一个优势，即可能能够更全面地了解整个总体中包含了什么（有时我们可以对完整数据集进行基本的汇总统计，只是不能进行我们想要的那种更高级的数据科学分析），这可以为我们的抽样选择提供信息。


  本节的其余部分将主要关注第一种类型的抽样，这通常是作为实验或研究的一部分来进行的。




  ### 偏差与代表性


  在推断性统计中，抽样的主要目标之一是以有意义的方式让样本代表总体，而确保代表性的最佳方法是避免抽样中的偏差。在此语境下，*偏差*特指对数据中特定子集的系统性偏好，这意味着样本因所选的抽样方法而歪曲了总体情况。测量过程中也可能出现偏差，这源于以有问题的方式进行测量。


  如果我们想了解 Snapchat 和 Facebook 在美国人中的受欢迎程度，那么只对青少年进行调查，样本就会存在巨大偏差。我们选择的样本完全无法代表“美国人”整体。


  心理学中有一个相当著名的系统性偏差例子。许多心理学实验都是由高校学者在其大学中，针对自愿参与的大学生（或者，如果他们正在上心理学课，是被“强制自愿”参与的）进行的。与冲动控制和决策相关的大脑区域——前额叶皮层，直到大约
  25 岁才完全发育成熟，因此大多数大学生的大脑仍在发育中。在他们大脑仍在发育的阶段，就其大脑运作方式得出科学结论，会导致样本存在偏差。这些研究本身并没有本质上的错误——它们可能对设计一项针对随机选择的成年人的更大规模研究非常有帮助。问题在于，这些结果有时会以一种将其推广到更广泛的“人”群（尤其是由记者们）的方式进行报道。


  为了更好地理解抽样中的偏差，让我们回到装满弹珠的垃圾箱例子。想象我们有一台机器，它会伸进垃圾箱，稍微搅拌一下，然后挤压，直到夹起一颗弹珠并将其取出。假设抓取器发生故障，无法完全闭合，因此它很少能取出较小的弹珠，因为它们会掉出来。被选中的弹珠样本将与整个垃圾箱中的情况不同。如果我们计算样本中弹珠的平均值，它会高于垃圾箱中所有弹珠的实际平均值。


  如果我们把垃圾箱（假设这是个玩具屋大小的）里所有的弹珠都拿出来，放在左上角的桌子上，就能看到弹珠大小的范围。但如果我们的自动抓取器无法完全闭合，它将无法抓住较小的弹珠。当你用视觉观察时，这一点更容易理解。图
  3-7 展示了这些样本可能的样子。上方的图片显示了摆放在桌子上、稍微散开一点的弹珠。如果我们把弹珠放回垃圾箱，让损坏的抓取器取出十颗弹珠，然后再重复几次，左下角的三个样本将是典型的结果。如果我们修好抓取器，重新运行这个过程，得到三个新样本，我们预计会得到类似右下角样本的结果。


  ![](img/628533_1_En_3_Fig7_HTML.jpg)


  气泡图显示了一个由大小不一的黑点组成的大网格。下方分为两类：“损坏抓取器样本”包含三个标记为 1 到 3 的样本，“修复抓取器样本”包含三个标记为 4 到 6
  的样本。每个样本包含一组黑点，展示了分布和大小的差异。该图表说明了两个类别之间气泡排列的变化。


  **图 3-7** 从一桌子弹珠中抽取的六个示例样本，其中三个来自有偏差的抓取器，三个来自公平的抓取器


  损坏的抓取器无法夹住较小的弹珠，因此所有样本都只有中等大小及更大的弹珠。这些样本看起来完全不像桌子上摆放的样子。右边的样本是在抓取器修复后获取的，看起来要均衡得多。


  同样重要的是要记住，在这种场景下，人类可以在一定程度上相当容易地用肉眼判断均衡性，但更有条理地进行选择至关重要，因为人类不具备所需的全局精确性。


  ### 有放回抽样


  我们经常会讨论有放回抽样与无放回抽样。这仅在你从一个更大的、完整的数据集中抽取数据使用时才有意义。*有放回抽样*允许完整数据集中的某些数据点在抽样过程中被选中多次——基本上，就是在“选取”之后将数据点放回数据集中。因此，*无放回抽样*则正好相反，每次选择一个数据点时，它实际上就从完整数据集中被移除了。从弹珠垃圾箱中抽样的最自然方式是一次取出一颗弹珠放在旁边，然后再伸手进去取出另一颗放好，依此类推，这属于无放回抽样。但你也可以在选取后将弹珠扔回去并搅拌一下，这属于有放回抽样。让人填写问卷通常属于无放回抽样（你不会要求同一个人填写两次）。如果你想要一个真正随机的数字样本，即每个数字被选中的概率均等，那么你应当采用有放回抽样（否则，每个数字被选中的概率会改变，就不再是随机的了）。




  '
- '# 样本量


  与许多其他事情一样，我们试图实现的目标应该决定一项研究所需的数据量。大多数人普遍认为，数据越多越好。但情况往往相反。尤其是在大数据时代，我们常常想尽可能多地使用数据——甚至可能是整个总体。诚然，如果我们从总体中抽取一个子集，就更有可能错过特殊情况。但如果我们想了解关于英国所有成年公民的某些信息，那么使用全部总体进行分析是不可行的。令人惊讶的是，在这两种情况下，一个规模较小但精心挑选的样本，实际上往往比一个庞大的数据集更好。总的来说，使用小数据集更容易操作，尤其是在计算资源方面。


  显然，有些情况确实需要大量数据，但这种情况少之又少。几个明显的例子是互联网搜索和大语言模型。在这些方面我们不能吝啬数据，因为它们需要在广度和深度上都做到完备。但如果我们想知道英国人最喜欢的爱好是什么，我们不需要询问每一个人。


  有一些通用规则可以帮助确定良好的样本量。当总体变异性不大（总体中的大多数成员相当相似）时，只要抽样方法严谨，较小的样本就足够好。当总体变异性很大时，情况则相反——在这种情况下，较大的样本更可能具有代表性，因为它能捕捉到更多的差异性。此外，当研究罕见事件（如计算机故障或信用卡欺诈交易）时，首选大样本量。


  图 3-8 展示了三种场景以及抽样可能受到的影响。每种场景都有一个总体，以及从该总体中抽取的一个小样本和一个大样本。左侧是变异性极小的弹珠总体，因此小样本看起来仍然相当有代表性（大样本并没有给我们带来更多信息）。中间是一个变异程度大得多的总体，我们可以看到小样本的代表性不佳，因此我们需要更大的样本。最右侧的总体中有一个非常罕见的事件——大号弹珠。我们需要更大的样本来确保其中能包含一些大号弹珠。另一种可能是，我们的小样本最终可能纯粹因为随机而包含多个大号弹珠，那么该样本的代表性就会极差。


  ![](img/628533_1_En_3_Fig8_HTML.jpg)


  气泡图，展示了三种总体场景：“最小变异性”、“更大变异性”和“含罕见点”。每个场景显示一个由不同大小气泡组成的网格，代表不同的数据点。每个网格下方有两列，分别标有“小样本”和“大样本”，显示气泡的子集。该图突出了不同场景下的变异性差异和罕见大点的存在。


  图 3-8


  针对不同类型总体的不同样本量


  在考虑样本量时，最后一个考量因素是工作可能带来的后果。如果后果可能具有破坏性，通常最好选择更大的样本，以确保更好的代表性。如果研究将用于制定公共卫生政策，或涉及公司做出重大财务决策，这一点可能适用。这涉及到伦理问题，我们将在后面的章节中讨论。


  '
- '# 随机抽样


  我们大多数人本能地知道，随机性通常是避免偏见和不公平的关键。但在实践中，这并不总是那么简单，也并不总能带来预期的结果，尤其是当我们在某种程度上与人打交道时。如果我们设法随机选择一组人进行访谈或收集数据，我们仍然需要依赖这些人实际参与——无论是否愿意报名参加访谈或填写问卷。


  另请注意，要进行任何类型的随机抽样，我们必须有一种真正随机选择的方法，这意味着我们需要某种随机数生成器。这也就意味着要以某种方式使用计算机。


  ## 简单随机抽样


  简单随机抽样名副其实——它是随机的，也是最简单的方法。在简单随机抽样中，总体中的每一个数据点都有同等的被选中机会，并且数据点被逐个选取，直到达到所需的样本量。在现有数据集中，这通常很容易实现，但如果你要选择人员或其他对象作为研究的一部分，则可能会更困难。


  ## 分层随机抽样


  分层随机抽样与简单随机抽样类似，我们根据关心的特征将总体划分为若干组（层），然后对每个组应用简单随机抽样。例如，假设我们要研究电子游戏玩家，并试图了解男性和女性玩家的不同体验。在整个电子游戏玩家群体中，男性玩家多于女性玩家。因此，如果我们只是对整个群体进行随机抽样，我们的样本中男性人数将远超女性。但我们的问题是了解每个群体的体验，因此我们实际上需要一个男女数量大致相等的样本。在组内进行随机抽样可以确保每个层都能代表该群体，这正是我们在此关心的。显然，这种方法的一个局限性是，你必须对更大的总体有所了解，才能知道将哪个数据点归入哪个层。


  ## 整群抽样


  整群抽样将总体划分为称为“群”的组，这与分层随机抽样类似。但不同之处在于，我们通常将总体划分为大量具有等级结构的群。然后，根据数据收集的便利性，我们选择特定的群作为重点。当使用其他随机抽样方法在后勤操作上困难时，通常采用这种抽样方式。最常见的情景是地理上的应用——例如，层级结构可以是国家、州、县、城市和社区。我们会选择数量有限的社区，并随机选择该社区内的居民。这样做的好处是，派一个人去某个特定社区收集许多人的数据，比派许多人去不同的社区收集少量数据要更实际。选择这种方法通常是出于可行性和成本考虑。


  '
- '# 非随机抽样


  随机性通常是在最大程度上避免偏见并确保代表性的最佳方式，但它并非总是可行，尤其是在处理像人这样具体的事物时。有时我们需要简化流程，使用那些以某种方式可以获取的数据点。


  缺乏随机性并不意味着这些方法毫无价值。我们必须记住，使用非随机方法，我们不能像使用随机方法那样自信地将样本的结论推广到总体。但如果我们只是想尝试一下，比如在将调查问卷发送给更大的随机样本之前，先在问卷上测试一些问题以排除故障，那么它仍然可以是有用的。


  有许多不同的非随机抽样方法，但我们这里只讨论其中的几种。




  '
- '# 志愿者抽样与滚雪球抽样


  `志愿者抽样`和`滚雪球抽样`是常用于人员研究的抽样方法，往往会产生极具偏差的样本。`志愿者抽样`是指邀请大量人员参与（如填写问卷），然后仅使用选择参与者的数据——这些人属于自我选择或自愿参与。`滚雪球抽样`相当于统计学中的多级营销——先选取部分个体，再要求他们提供更多参与者人选。大学期间我做过刀具销售工作，需要向熟人做产品演示，并让他们推荐其他潜在联系人。由于我并非社交达人，这份工作毫无进展，仅坚持一个月绝非偶然。`滚雪球抽样`的质量完全取决于样本成员是否愿意分享自身人际网络。由于存在自我选择倾向，`志愿者抽样`和`滚雪球抽样`都容易产生偏差，但若研究对象与研究问题高度相关，这倒是个获取积极参与者的有效方法。


  ## 便利抽样


  顾名思义，`便利抽样`是一种基于操作便利性从总体中选取样本的方法。如果学生要研究大学生群体，可能只会调查自己班级的同学。这种抽样显然会受研究主题、课程级别、上课时段及授课形式（远程或面授）等因素影响而产生偏差。


  只要谨记研究结果不能推广至其他群体（甚至不能代表全体大学生），此类研究本身并无不妥。


  '
- "# 实验与研究设计\n\n多数人都参与过在线快速调查，这类调查虽有趣味性，但因充满偏差且问题设计欠妥，几乎不具备实际意义。事实证明，设计严谨的实验或研究绝非易事，过去两百年间该领域已取得大量改进成果。\n\
  \n即便数据科学家不直接设计或执行实验，了解实验的设计与运作方式对理解数据特征及处理方法也大有裨益。\n\n## 实验\n\n实验是自然科学领域的核心方法，部分社会科学家（特别是心理学家）也热衷于此。这是因为设计良好的实验能产生可靠严谨的数据，为得出真实有效的结论提供依据。\n\
  \n科学意义上的实验必须满足：在控制所有其他变量的前提下测试单一变量。至少需要设置两组——无变化的`对照组`和体现变化的`实验组`。可设置多个实验组，但各组仅能在同一变量上存在差异。研究对象（无论是人类参与者还是其他）必须随机分配至各组。此外必须包含至少一个`响应变量`，即实验试图测量的指标——实验组是否表现出与对照组不同的响应？\n\
  \n还需考虑样本量、响应变量数量、数据分析所用的统计技术类型，以及判定统计显著性的阈值。这些要素相互关联，共同确保显著差异具有真实统计意义。根据数据分析所用的统计方法，可采用不同公式计算最小样本量。例如，若需计算特定指标的置信区间，就需要满足最小样本量要求。另一种常用计算方法是`统计功效`，用于评估给定样本量下发现显著结果的可能性。\n\
  \n举例而言，Meta 公司可能希望了解哪款广告在特定群体（如 25-35 岁男性）的信息流中效果最佳。首先需选定响应变量，可能包括点击次数、首次点击前的展示次数，甚至点击后的关键行为（如购买）。实验分为四组：一个无广告的对照组和三个实验组（各投放一款广告）。符合条件的男性用户被随机分配至各组。Meta\
  \ 向每位参与者展示指定广告（对照组不展示），根据研究目标可能展示一次或多次（每位用户相同次数），然后测量两个响应变量——点击与购买。\n\n### A/B 测试\n\
  \n`A/B 测试`可能是数据科学家最常参与的实验类型，本质上是包含一个对照组和一个实验组的实验。因其易于实施，在数字营销和网页设计中非常流行。企业可能想测试改变简报标题字体能否提高阅读完成率，于是随机向用户展示不同标题。\n\
  \n## 准实验\n\n`准实验`与真实实验有许多共同点，但因至少未满足实验标准中的一项（最常见的是缺少对照组或未随机分配参与者），严谨性有所欠缺。这可能是出于实践或伦理考量，意味着即便符合其他标准，也不能视为真实实验。此类研究仍有价值，但无法像实验那样安全地推广至其他情境。\n\
  \n## 观察性研究\n\n尽管实验和准实验因能减少偏差、提高准确性而被视为研究设计的黄金标准，但有时设计灵活性仍受限。由于伦理或法律约束，我们可能无法随机分配参与者。例如，要研究父母入狱对子女的影响，我们不可能真的将家长投入监狱，只能寻找现有家庭进行研究。`观察性研究`使我们能通过现有数据点，在无法控制所有参数的情况下开展研究。\n\
  \n此类研究中，模拟实验变量控制的一种方法是采用`病例-对照设计`，即通过确保病例组（如上述有父母入狱的家庭）与对照组（无父母入狱的家庭）在其他特征上尽可能相同或相似来实现匹配。我们会确定需要匹配的关键属性，在此案例中可能包括居住社区、子女数量、子女年龄、家庭成员种族及家庭收入等。\n\
  \n\n\n### 调查\n\n对大多数人来说，一提到研究，他们可能首先想到的就是调查。我们经常听到调查，有时甚至还会参与其中。*调查*基本上就是一份供参与者回答的问题列表。它们也被称为民意测验或问卷，但只是同一事物的不同名称（民意测验通常与政治话题相关）。我们经常在新闻、杂志或互联网上看到调查结果。通过调查，很容易获得一些色彩鲜艳、赏心悦目的可视化图表，而且与大多数实验相比，调查既简单又快速。\n\
  \n随意的网络调查根本不科学，但更严谨的调查则可以精心设计，得出有意义的结论。作为起点，调查需要有明确的焦点，我们必须确定一个清晰的人群——该人群还需要是可接触和可抽样的。我们需要决定调查的交付方式，可以是网络、邮件、电话或上门拜访。有时时机也是一个重要的考量因素，尤其是在政治议题周围。\n\
  \n严谨的调查还需要确保在法律和道德准则范围内运作。这通常意味着要说明研究目的，提醒参与者填写是自愿的，并说明结果是匿名还是保密的。研究人员在调查中附上自己的联系方式也是个好习惯。如果调查与某个组织相关，该组织可能还会有额外要求。\n\
  \n为调查撰写问题是一门艺术，通过反复试错，它已变得更加科学化。措辞会极大地影响人们给出的答案，这可能导致偏差和不准确的结果。最大的风险是提出引导性问题——即那些微妙地（有时并不那么微妙）引导受访者给出特定答案的问题。引导性问题的措辞方式有很多种，但一种明显的方式是以“您是否同意……”开头。例如，“您是否同意科技行业有足够的女性？”这个提问者的偏见显而易见，可能会影响参与者的回答。更好的措辞可能是“您认为女性在科技行业是否获得了公平的代表？”确保问题质量的一个强烈推荐方法是进行一次小规模的试点研究，让少数人完成调查，并向受访者征求反馈。这可以帮助你发现令人困惑、具有误导性或存在偏见的问题。\n\
  \n#### 调查的抽样与回复率\n\n一旦我们确定了目标人群，就必须获得一个好的样本，由于调查的回复率通常很低，这一点尤其困难。*回复率*是指收到的回复数量占发出的所有调查数量的百分比。虽然可以随机选择目标参与者，但除非调查是强制性的或有高额激励，否则很多人不会完成。因此，即使你随机选择了发送对象，最终的样本也可能不是随机的。\n\
  \n例如，如果我们想了解人们对那些导致交通堵塞数月之久的延期道路施工的看法，我们可以从地址列表中随机抽取一些人，并给他们邮寄调查问卷。但大多数人不会填写，因此我们最终得到的样本将是那些喜欢填写调查问卷的人群——而这并非所有人。参与始终是一个问题，即使是激励措施也可能导致样本偏差，因为相对于开奔驰的企业律师而言，低收入人群可能更愿意为了\
  \ 25 美元的礼品卡而填写调查问卷。我们再次发现，这些人不一定能代表我们想要了解的人群。\n\n此外，我们必须考虑确保结果可能具有显著意义所需的样本量。我们需要参与者的数量足够大，而不仅仅是我们发送调查的对象，这意味着我们必须预估回复率，以便向足够多的人发送调查。回复率因交付方式、目标人群和内容的不同而存在巨大差异。大多数公司员工调查的参与率远高于\
  \ 50%，而网络调查的回复率可能只有百分之十几甚至更低。一个不幸的事实是，回复率越低，结果越有可能产生偏差。此外，在某些情况下，例如一些科学或医学期刊，会要求较高的回复率。\n\
  \n\n\n## 关键要点与下一步\n\n本章聚焦于推断统计的基础——概率、概率分布、抽样和实验设计。所有这些内容都将在下一章的推断统计中发挥作用。概率分布，尤其是正态分布，是推断统计中许多概念和统计检验的基础。我们讨论了抽样，这极其重要，因为选择样本的方式直接影响我们能从中获取信息的质量。样本必须尽可能无偏差且具有代表性，为此我们介绍了多种不同的抽样技术。本章末尾讨论了实验设计——大多数数据科学家不会经常接触这个主题，但理解不同的设计及其局限性，有助于我们更有效地分析那些并非由我们设计的研究结果。\n\
  \n在第 4 章中，我们将结束对统计学的阐述，首先完成推断统计的历史概述。然后，我们将深入探讨常见统计检验所依据的概念，包括假设检验、`p`值、第一类错误和第二类错误、误差范围、置信区间、单尾检验和双尾检验。接着，我们将介绍主要的统计检验方法，包括那些需要假设数据符合某种分布的方法，如`Z`检验、`t`检验、方差分析（`ANOVA`）和卡方检验，以及那些无需假设分布的方法。\n\
  \n## 从业者简介：丹尼·瓦查莱克\n\n**姓名：** 丹尼·瓦查莱克  \n**职位：** 数据科学家  \n**行业：** 零售业  \n**数据分析和数据科学从业年限：**\
  \ 8 年  \n**教育背景：**  \n- `MS 数据分析与数据科学硕士`  \n- `BS 商业、市场营销与广告学士`  \n\n*此处表述的观点仅代表丹尼个人，与其过往或现任雇主无关。*\n\
  \n### 背景\n\n丹尼·瓦查莱克在大学选择了相当务实的道路，专注于获得商科学位，学习了关于市场营销和广告的方方面面。因此，他毕业后从事广告工作并不令人意外。但他当时并不知道，这第一份工作最终会将他引向截然不同的方向。\n\
  \n## 工作\n\n丹尼的第一份工作大部分内容涉及对各类广告活动进行相对简单的分析，查看成功率和其他绩效指标。他充满好奇心，想要了解更多，而他的利益相关者也总是希望获得超出他能力范围的信息，但他当时可用的工具非常基础，每次只能针对一个活动分析少数几个变量。他知道自己应该能做得更多，于是研究了各种选项，并很快开始攻读数据分析硕士学位。\n\
  \n在攻读学位期间，丹尼发现了一个机会，与人联合创办了一家专注于品牌传播自动化的广告公司。但他很快意识到这是一条死胡同，因为大型语言模型日益成为主流且易于获取（它们很快就会让他的业务过时）。随后，他进入一家广告初创公司工作，在那里他“被扔进深水区”，学会了`SQL`，还结识了一些老派的机器学习专家，他们将他引入了更广阔的数据科学世界。这份工作收获颇丰，因为他学到了很多，也完成了一些有价值的工作，但同时也非常耗时。\n\
  \n在得知妻子怀孕后，丹尼换了工作，成为一名顾问。在多个任务的初期，他常常感到力不从心，并意识到在开始任何新任务前，他还有很多东西要学才能感到自如。具体来说，他需要更好地理解如何管理项目的完整生命周期，从收集需求到全面实施。他还发现，利益相关者每周都会向他提出各种毫无章法的问题，并且再次希望获得超出他主要工具能力范围的信息。每个人都想要数据科学，但所有的临时查询工作让时间总是不够用。尽管如此，他对进行更高级分析的渴望与日俱增。他大部分时间都花在攻读硕士和钻研学术理论上，但他仍然想方设法挤出时间进行更多以商业为导向和应用型的学习。\n\
  \n所有这些学习，加上他在一个咨询项目中因出色表现而获得的赞誉，最终帮助他在现在的公司获得了一份永久职位，他是专门的数据科学团队中的一员。从那以后，他对数据科学和软件设计的理解不断加深，并且热爱他所从事的工作。\n\
  \n### 观点分享\n\n**工作中最喜欢的部分：** 丹尼喜欢与工作中各种各样的人共事并向他们学习，其中许多人有着与他截然不同的背景和视角。他尤其能从工程师那里学到东西，因为他欣赏他们的系统性思维。他也喜欢与具备不同技术专长的利益相关者打交道，并努力寻找清晰易懂的解释方式来简化复杂概念，以便大家能共同找出最佳解决方案。他还喜欢解决问题，并为重要的项目做出贡献。\n\
  \n**工作中最不喜欢的部分：** 媒体和华尔街对数据科学的公众认知严重偏离事实，这导致利益相关者对数据科学家的能力往往抱有非常不切实际的期望。在某些工作中，由于领导者不了解必要的技术需求，连开展日常数据科学工作的基本工具都难以获得。有时，笨拙的变通方法是完成工作的唯一途径。\n\
  \n**最喜欢的项目：** 他在初创公司工作时参与过几个很棒的项目。其中一个项目中，丹尼找出了与最高收入相关的产品功能标志，并发现产生最多收入的用户是那些安装了其软件多个版本的人。这一发现以及后续的分析和测试，使得在相同投入的基础上收入翻了一番。\n\
  \n**教育如何与现实世界接轨：** 他发现，硕士期间的项目和问题在数据质量方面与真实世界完全不同（现实中的数据质量太差），而且项目也不够真实，因为它们不是端到端的。如何将一个项目从概念和规划阶段，推进到执行并最终投入生产，这是课程似乎没有教授的内容，而在现实工作中却至关重要。\n\
  \n**最常使用的技能：** 分析思维和批判性思维都非常重要，但同样重要的是一个不断提出问题的好奇心。丹尼发现，特别重要的是思考那些能帮助他理解利益相关者试图解决的真正问题是什么，然后知道有哪些真正的解决方案可供选择。同样重要的是能够识别出，因数据或基础设施（工具）限制而确实不存在可行解决方案的情况。\n\
  \n**目前主要使用的工具：** `SQL`（含`CTE`）、`Snowflake`、`Python`、`JupyterHub`、`VS Code`、`GitHub`、`DBT`\n\
