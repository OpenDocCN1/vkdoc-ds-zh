  用绿色表示，其他公司用粉色表示。图表显示了各公司评分随时间的变化。


  图 2-11

  按公司划分的九年电子游戏平均评分分组条形图


  图 2-11 让我们看到任天堂和 EA 有着不同的趋势，而“其他”组仍然遵循我们在图 2-10 中观察到的所有公司合并在一起时的趋势。但如果只观察代表任天堂的柱子，我们可以看到
  2015 年是一个异常值，评分略高于 3。第二年平均评分飙升至 4 以上；随后几年评分下降，然后又开始回升。EA 的评分则波动较大，在这段时间内，有两年该公司没有任何有评分的游戏发布。


  还有另一种重要的条形图，称为*堆叠条形图*，它非常适合观察不同值之间的比例关系。这种图将同一年的不同公司对应的柱子堆叠在一起，因此组合后柱子的高度等于该年所有柱子之和。这用于评分数据没有意义，但我们还有每款游戏的总评论数，因此我们制作了图
  2-12，用堆叠条形图展示任天堂和 EA 的数据。


  ![](img/628533_1_En_2_Fig12_HTML.jpg)


  标题为“各公司每年发布数量”的条形图，展示了 2016 年至 2022 年任天堂和 EA 的发布数量。Y 轴表示发布数量，X 轴表示年份。任天堂的发布量用蓝色表示，EA
  的发布量用红色表示。2018 年和 2022 年出现显著峰值，其中任天堂在 2022 年的发布量最高。右侧的图例用颜色标识了各公司。


  图 2-12

  任天堂和 EA 每年电子游戏发布数量的堆叠条形图


  我们可以清楚地看到，任天堂发布的游戏数量远多于 EA，并且任天堂在两者总发布量中通常占据更高的比例。最后一种条形图能让具体比例更加清晰。*分段条形图*显示与堆叠条形图相同的数据，但表示为绝对比例，即所有完整柱子的总和为
  100%。图 2-13 显示了与图 2-12 相同的数据，但已转换为百分比。


  ![](img/628533_1_En_2_Fig13_HTML.jpg)


  标题为“各公司每年发布数量占比”的条形图，展示了 2016 年至 2022 年任天堂和 EA 在总发布量中的百分比。Y 轴表示任天堂和 EA 总发布量的百分比，X
  轴表示发布年份。任天堂用蓝色表示，EA 用红色表示。图表显示，与 EA 相比，任天堂每年的发布数量占比始终更高。


  图 2-13

  任天堂和 EA 每年电子游戏发布数量占比的分段条形图


  如上所示，除 2016 年外，任天堂每年发布的游戏所占比例都远高于 EA。如果我们在数据中查看所有公司，而不仅仅是这两家，这种图表会更有趣，但也会很快变得难以处理。届时会出现许多细线，但产量最高的公司会清晰地凸显出来。




  #### 直方图


  我们之前简单提到了直方图。*直方图*是一种特殊类型的柱状图，用于处理定距或定比数据。它之所以被视为一种独立的图表类型，是因为它能提供数据的特定视图，并且需要一个称为*分箱*的额外步骤，该步骤将数字划分为具有相似值的批次。这也意味着我们不会有太多列，因为每个分箱只有一列。直方图显示的是发生次数，尽管我们通常将其称为频率而非计数。


  我们可以再次查看电子游戏数据，这次重点关注评论数量。游戏评论数在 0 到大约 4000 之间，如果我们再次查看所有数据，如图 2-14 所示，就能发现大量的评论很少见，大多数评论数都在
  1000 以下。


  ![](img/628533_1_En_2_Fig14_HTML.jpg)


  标题为“评论数量”的柱状图，展示了不同记录编号下的评论频率。x 轴代表“记录编号”，范围从 0 到 1500；y 轴代表“评论数量”，数值高达 4000。该图显示了几个峰值，表明在特定记录编号处评论数量较高，整体呈现下降趋势。


  **图 2-14** – 按任意顺序排列的每个游戏及其评论数量的柱状图


  直方图能更清晰地展示最常见的评论数量，因为从图 2-14 中很难真正理解这一点。我们可以创建一个自动设定分箱的直方图，如图 2-15 所示。


  ![](img/628533_1_En_2_Fig15_HTML.jpg)


  标题为“评论数量分布”的柱状图，y 轴显示频率计数，x 轴显示评论数量区间。该图呈现下降趋势，最低评论区间的频率最高，约为 500，随后随着评论数量的增加逐渐降低。


  **图 2-15** – 按评论数量划分的电子游戏直方图


  图 2-15 清晰地表明，拥有超过 1000 条评论是多么罕见。由于如此多的游戏评论数低于 1000，我们认为有必要查看评论数在 1000 条及以下时的分布情况。我们可以在图
  2-16 中看到这一点。


  ![](img/628533_1_En_2_Fig16_HTML.jpg)


  标题为“评论数量分布”的柱状图，y 轴显示频率计数，x 轴显示评论数量区间。该图显示各柱状条高度不一，表明了不同区间内评论数量的分布，最高频率出现在约 160
  条评论处。


  **图 2-16** – 按评论数量划分的电子游戏直方图（显示评论数在 1000 条及以下的游戏）


  图 2-16 的一个优点是分箱很清晰，因为总共有 1000 条评论，分成了 10 个区间，因此每个区间的宽度为 100。这个分布很有趣——它看起来并不像一个正态分布，因为尾部与中间部分的差异并不大。评论数在
  100 到 700 之间的出现次数更多，但除此之外，每个游戏的评论数量似乎没有太大的变化。


  需要记住的是，我们用来创建直方图的大多数软件都可以自动确定分箱宽度，但有时不同的宽度可能会产生外观迥异的直方图。尝试不同数量的分箱，看看是否有有趣的现象出现，这总是一个好主意。这也很好地提醒了我们，在进行探索性数据分析时，尝试不同方法的重要性。有时你制作一个图表可能毫无发现，但对该图表稍作改动就可能揭示出有价值的信息。


  这里我们只看了具有等宽分箱的直方图，这是最常见的类型，但它们也可以有不同的宽度。例如，有一种称为“贝叶斯分块”的方法，可以基于特定标准创建大小最优的分箱。了解这些方法是好的，但我们通常并不需要用到它们。


  ### 箱线图


  你可能以前见过*箱线图*，这是一种带有矩形的图表，矩形中间附近有一条线，并且从矩形两端延伸出线条（“须”）。箱线图由几种不同的散布度和位置度量构建而成，你在进行汇总统计时应该已经计算过这些度量。一个典型箱线图的组成部分包括：


  -   第一四分位数

  -   中位数

  -   第三四分位数

  -   最小值

  -   最大值


  一些箱线图还会考虑异常值，并相应地调整须的长度。如果要显示异常值，传统的方法是将须的长度限制为不超过四分位距（`Q3 – Q1`）的 1.5 倍，然后异常值用圆圈表示，位于须的末端之外。


  作为一个箱线图的示例，我们可以回到上面关于儿童身高和体重的数据，查看图 2-17 中不同年龄段男孩和女孩的身体质量指数。健康的身体质量指数会随着孩子的年龄而变化，因此年龄分组是根据美国疾病控制与预防中心提供的范围确定的。


  ![](img/628533_1_En_2_Fig17_HTML.jpg)


  箱线图展示了患有镰状细胞病的儿童按性别和年龄组划分的身体质量指数分布。类别包括 2-8 岁、8-12 岁、12-15 岁和 15-18 岁的男孩和女孩。该图突出了每组的中位身体质量指数值、四分位距和异常值。标题为“按性别和年龄划分的镰状细胞病儿童身体质量指数”。


  **图 2-17** – 按性别和年龄划分的镰状细胞病儿童身体质量指数箱线图


  在这个箱线图中，每组的箱体以橙色显示中位数，第一四分位数作为主体箱体的下边界，第三四分位数作为箱体的上边界。底部水平线是最小值，顶部水平线是最大值（在`1.5
  * 四分位距`范围内的最大值）。最后，最大值上方的点是异常值。


  这张图表上一个引人注目的点是，女孩的异常值比男孩的极端得多。此外，女孩的身体质量指数在进入青春期典型年龄后似乎迅速增加，而男孩的身体质量指数则倾向于更稳定地增长。另外，女孩和男孩的身体质量指数大多都在健康范围内（根据美国疾病控制与预防中心指南），实际上还处于偏低水平。患有镰状细胞病可能让孩子身体不适，导致他们不像同龄的其他孩子那样生长发育。




