  CRISP-DM 生命周期


  数据分析与数据科学在流程上的一个区别在于探索性分析与建模步骤，因为数据科学家通常在此花费更多时间，因为他们从事的工作更复杂。此外，验证与评估步骤中所做的工作也可能与数据分析项目不同，会更多地强调和投入时间进行代码审查，但并不限于此。同样，可视化与呈现步骤可能涉及不同类型的输出，具体取决于项目。但牢记这一流程将有助于你理解和规划所从事的任何数据科学项目。


  最后，为了更深入地了解数据科学究竟是什么，请参见图 6-3，这是一个基于数据科学家德鲁·康威绘制的维恩图，展示了数据科学三个主要领域如何交汇融合，从而形成真正的数据科学。


  ![](img/628533_1_En_6_Fig3_HTML.jpg)


  一个由三个重叠圆圈组成的维恩图，分别标记为“编程”、“数学与统计”和“领域知识”。其交叠区域标记如下：“机器学习”（编程与数学与统计之间）、“传统研究”（数学与统计与领域知识之间）、“危险区”（编程与领域知识之间），以及三者重叠的中心区域“数据科学”。


  **图 6-3**


  德鲁·康威的数据科学维恩图


  这个图表虽然带点调侃意味，但它确实捕捉到了数据科学的各个组成部分。“编程”涵盖了任何可用于处理数据以及应用基于数学和统计技术的工具。这包括像 Excel 这类非代码工具，因此并不总是涉及字面意义上的编程。“数学与统计”不言自明，但它意味着需要掌握特定类型的数学和统计知识，而非全部。我之前谈到过领域知识的重要性，这基本上意味着对某个业务或其他领域的理解（并不一定需要具备技术知识）。


  如果你观察这些圆圈的交叉区域，会发现一些有趣的现象。首先，数学与统计和领域知识的交集（不含编程技能）是心理学家、社会科学家和其他科学家进行的经典学术研究，通常涉及实验设置和传统的统计检验。这是一个合法的职业，但如果这些研究人员能够开发并运用真正的编程技能，其工作就可能向数据科学领域延伸。具备良好数学与统计知识的程序员可以进行机器学习，但除非他们能在深层次上理解自己的数据，否则这算不上数据科学。常见的情况是，一些人在学习了编程和机器学习方法后，便开始尝试寻找有趣的问题，但由于对所代表的数据缺乏深入了解，其工作的价值十分有限。最后，某个领域的专家在学习编程后，可能认为自己知道如何发现规律，但若缺乏数学和统计学的严谨性，其结果将会杂乱无章、毫无头绪，这也是我们将其标注为“危险区”的原因。


  尽管仍有不少人认为数据科学神奇又简单，但更了解内情的人知道其秘诀：数据科学很难，主要有两个原因——第一，数据是杂乱的；第二，精确定义需要解决的问题十分困难。数据既是数据科学家的“面包和黄油”，也是他们职业生涯中的“眼中钉”。


  ## 数据科学价值观


  数据科学并非一成不变，每个项目都与其他项目略有不同，但仍然存在许多共性，这些共性要求采用特定的工作方式才能达到最高效率。我们看到优秀的数据科学具备六大核心价值：简洁性、可解释性、可复现性、可信赖性、可理解性和可共享性。


  *简洁性*体现在寻找解决方案时——你会从可能奏效的最简单方案入手，只有当更简单的方案行不通时，才选择更复杂的方案。简洁性有时会背负骂名，但实际上它在几乎所有科学和工程领域都备受推崇。如果你记住它是复杂性的对立面，你或许就能看到其优势。复杂机器和系统成本更高且更难维护。任何软件也是如此。同样，任何数据科学解决方案也是如此。目标通常是创建一个尽可能简单而又不牺牲质量的解决方案。


  *可解释性*——你向利益相关者解释解决方案的难易程度——在许多情况下至关重要。在某些情况下，能够向利益相关者解释清楚事情至关重要，特别是当他们刚接触数据科学时。这对于建立信任至关重要。如果利益相关者无法理解你所做的事情，他们可能就不会信任你的结果。简洁性在此也发挥作用，因为通常简单的解决方案比复杂的更容易解释。你经常会听到人们讨论“黑盒”与“白盒”解决方案。*黑盒*解决方案是指其选择在根本上无法解释的方案。其复杂性过高或计算过程被掩盖了。神经网络是黑盒的一个经典例子。我们将在第
  15 章更详细地讨论神经网络，但缺乏可解释性正是它在商业世界中没有得到更广泛应用的原因之一。相反，*白盒*解决方案则很容易解释。线性回归和决策树是白盒解决方案的两个经典例子。我们将在这里看看它们为何具有可解释性，但我们将在第
  15 章进行更深入的讨论。可解释性并非总是最重要的，因此如果黑盒方法能获得更高的准确性（通常如此），那么不可解释的黑盒方法可能是正确的选择。


  普通最小二乘法*线性回归*（我们讨论时通常省略前半部分）是统计学家使用了数十年的经典方法，其基本原理是通过最小化每个数据点与直线之间的误差（差异）之和，在数据中画出一条直线。在线性回归中，模型实际上就是一个公式，你将每个变量乘以一个由线性回归技术优化后的系数，然后将所有项相加。你可以与利益相关者分享这个公式，从而清晰地看出哪些变量影响最大。图
  6-4 展示了一个公式示例，该公式代表一个线性回归模型，该模型根据表格中的其他数值特征来预测视频游戏数据中的评分。


  ![](img/628533_1_En_6_Fig4_HTML.jpg)


  表示评分计算的数学公式。公式如下：


  \[

  \text{评分} = 3.44 + 0.52 \times (\text{''评分数量''}) - 0.32 \times (\text{''游玩数''})
  - 0.18 \times (\text{''正在游玩''}) + 0.36 \times (\text{''待玩清单''}) + 0.86 \times (\text{''心愿单''})

  \]


  该公式包含了系数和变量，例如 `''评分数量''`，`''游玩数''`，`''正在游玩''`，`''待玩清单''`，以及 `''心愿单''`。


