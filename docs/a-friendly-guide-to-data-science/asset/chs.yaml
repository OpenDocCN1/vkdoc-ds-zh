  \n希望这能让你了解看板如何应用于数据科学项目。请注意，在实体看板上，通常会将所有便利贴留在\"已完成\"列，但显然这样会变得拥挤，因此有时也会将其移除。而在虚拟看板上，如果设置为可见状态，它们会一直保留在那里。\n\
  \n## 项目后期工作\n\n各类项目通常都有始有终，数据科学项目也不例外。我们讨论过数据科学项目的生命周期，但并未涉及项目完成后的工作。在软件领域，存在公认的项目后阶段——维护。对软件而言，维护仅意味着确保其持续运行。但在数据科学领域，情况则更为复杂。\n\
  \n就项目后期工作而言，有些数据分析与数据科学项目并无直接基于项目工作的后续任务。例如，当你被要求执行某项分析并提交报告后，可能会被要求重复或更新该分析，但这只需重新运行程序（但愿你的代码能使之如此简便），而非真正调整实际项目中的工作。在其他两种典型情况下，则存在项目后期责任。接下来我们将讨论这些情况。\n\
  \n### 代码维护\n\n一种需要项目后期工作的场景是：项目中创建了需要定期刷新的仪表板，因此无论仪表板是在商业智能工具内还是外部，都需要编写代码来准备数据。第二种场景是：创建了将持续使用的模型（无论通过\
  \ API 查询，还是在你自己编写的定期刷新代码中使用，或其他场景）。\n\n在这两种情况下，任何计划任务或商业智能工具中的代码转换都需按预期运行。代码的优势在于，除非发生某些变化或出现短暂的随机计算机故障，否则它将始终如一地运行。随机计算机故障可能包括：在依赖云端数据的代码运行时网络连接中断，或计算机宕机导致任务无法触发。关键在于，故障并非源于代码本身，而是其依赖的运行机制。通常的解决办法是，在其他系统恢复运行后手动启动该流程一次，之后它应能在下次计划时间恢复正常运行。\n\
  \n\"发生变化\"的场景则更为棘手。这涵盖众多可能性，包括：数据库结构变更（例如某个表中列被删除或新增）、用于连接数据库的账户权限变更、你所用表的刷新时间推迟到允许范围之外等。基本上，导致代码出错的潜在原因数不胜数。这确实令人头疼，因为你现在必须排查问题；若不巧只收到一条毫无帮助的错误信息（不幸的是，这很常见），那就可能意味着任何问题——因此故障排查非常耗时。有时你可能需要询问他人，若对方正忙，你便只能等待回复。若必须让系统恢复运行，你就得持续排查直至找到原因。\n\
  \n### 模型漂移与维护\n\n当模型已部署（无论是训练后静态使用还是定期重新训练），另一个重要概念是模型漂移。*模型漂移*指模型性能随时间发生变化，通常是性能下降。因此，我们需要监控模型随时间的性能变化。例如，假设你有一个已投产的模型，每晚运行并预测所有门店未来七天的销售额。该模型本身不重新训练，因此运行时间越长，数据就越\"\
  过时\"。大部分时间性能指标可能表现良好（例如平均绝对百分比误差低于 10%）。但运行一年后，更多平均绝对百分比误差分数可能升至 10%以上。解决方案是重新训练模型，但这需要评估结果并测试不同算法和参数，因此并非快速修复。\n\
  \n对于销售预测而言，通常更好的选择是定期重新训练模型，若可行甚至可每晚训练。这将降低模型漂移的可能性，但无法完全消除。以我们的例子来说，假设引入了你最初编写代码生成模型时未考虑到的常规促销活动。这些信息很可能极大改善模型，因为促销通常会改变购买模式；但在你修改代码添加该特征之前，这些信息会丢失，模型性能将不佳。\n\
  \n另一种需要调整的情况是：新增了模型此前未考虑但当前必须包含的内容。例如，若你需要按不同方式预测特定产品的销售量，新产品不会立即被纳入模型。你需要进行相应工作将其包含进来。\n\
  \n\n\n### 项目后时间管理\n\n这里需要记住的重点是，如果项目正式结束后出现了需要干预的情况，你未必有“空闲”时间来处理。那时你可能正在处理其他事务。你很可能无法自行决定优先处理有问题的代码或仪表盘而搁置当前工作，但这很可能会占用你当前工作的时间，这对你以及对该项目感兴趣的其他所有人来说都令人沮丧。\n\
  \n## 关键要点与下一步\n\n在本章中，我讨论了管理数据科学项目所面临的挑战。目前没有既定的方法，人们通常只是拼凑出各种项目管理方式。我介绍了传统的项目管理，特别是与项目规划和执行相关的内容，接着讨论了在此基础上衍生的软件项目管理变体。我提出了一种使用渐进式数据科学看板来管理数据科学项目的方法，该方法在典型的看板基础上增加了泳道来定义项目阶段。随后，我谈到了项目结束后必须完成的一些后续工作。\n\
  \n在下一章中，我将讨论可能影响数据科学家和数据科学项目的各种已知偏见与谬误。了解它们将有助于你避免或至少减轻其影响。\n\n### 从业者简介：哈德莉·康布林克\n\
  \n**姓名：** 哈德莉·康布林克\n\n**现任职位：** 技术项目经理\n\n**当前行业：** 零售业，曾涉足医疗保健和 IT 咨询\n\n**从业年限：**\
  \ 6 年数据科学管理经验\n\n**教育背景：**\n\n*   认证 Scrum Master\n*   公共管理硕士\n*   英语与社会学学士学位\n\n\
  *此处观点仅代表哈德莉本人，不代表其过去或现在的任何雇主。*\n\n**背景**\n\n完成本科学业后，哈德莉继续攻读硕士学位，并在之后几年里在该项目中任教。在此期间，她也接触到了分析学并乐在其中。她总体上被\
  \ IT 领域吸引，曾在一家医院与数据库管理员共事，这让她学到了更多。很快，她转到另一个 IT 团队担任新的职务，负责基础设施项目管理，并成为了一名技术项目经理。在这个职位上，她管理着仍可能影响业务的技术推广项目，例如\
  \ SharePoint 和 Internet Explorer。她逐渐感觉自己对各方面都略知一二。在另一份工作中，她担任了类似的职位，之后在医院找到了新的角色，成为一名业务解决方案分析师。\n\
  \n**工作**\n\n在担任业务解决方案分析师期间，哈德莉职责多样，身兼产品负责人、Scrum Master、业务分析师等数职，并管理着多种类型的项目。这份工作也涉及大量与客户的互动，她还在此阶段尝试了一些编码工作。但最有趣的是，团队中有多个职位，包括数据科学家，这也是她开始更深入了解该领域的起点。她很快发现自己专注于管理数据科学项目，并一直从事至今。\n\
  \n**精彩语录**\n\n**管理数据科学项目最喜爱的部分：** 日常工作的多样性，以及与拥有不同背景和专业特长的各类人士共事。她也喜欢在不担任人员管理者的前提下，帮助设定优先级并引导业务价值。\n\
  \n**管理数据科学项目最不喜欢的部分：** 官僚作风，以及当她看不到如何能产生影响时，比如遇到自己无法控制的事情。\n\n**最喜爱的项目：** 她曾在医院参与过一个移动设备管理项目，该项目非常考验人际交往能力。他们需要说服医生使用手机进行工作，但必须让他们相信医院不会窃取他们的照片或侵入手机的其他区域。在那个项目中，她不得不充分运用自己的沟通技巧，最终项目取得了成功。\n\
  \n**管理数据科学项目时最常用的技能：** “牧猫”式的协调能力以及各种组织技巧，比如管理电子邮件、待办事项清单，以及用于管理和组织项目工作的系统（如敏捷管理工具）。\n\
  \n**当前主要使用的工具：** 哈德莉仍然喜欢笔和纸，尤其是在处理待办事项清单时。在项目管理方面，她使用过 Jira、ServiceNow 以及其他敏捷工具。此外，还有\
  \ Google Suite 和 Canva。\n\n**数据科学的未来：** 它仍然是未来方向，同时为所有工作打下坚实的数据基础至关重要。总体而言，数据方面仍有工作要做。但优秀的沟通者仍将非常重要。\n\
  \n**优秀数据科学家和数据科学项目经理的特质：** 数据科学家应该具备强烈的好奇心，愿意与业务方和利益相关者合作，拥有技术技能，并始终考虑不同的方案。数据科学项目经理需要具备灵活性，因为它不同于其他技术项目的管理。\n\
  \n**给潜在数据科学家的建议：** 多问问题，不要自负。建立人脉关系，特别是如果可能的话，找一位导师，因为数据科学圈子很小。\n\n*哈德莉是一位经验丰富的项目经理，在管理数据科学及其他\
  \ IT 项目方面拥有丰富经验。*\n\n# 22. 判断失误：偏见、谬误与悖论\n\n## 引言\n\n我们都知道人们存在认知偏见，记忆和信念也容易出错——或者至少我们知道*别人*会这样。但很难记住我们自己也有这些问题。这实际上有一个专门的名称——*偏见盲点*，即我们假设自己比其他人更少偏见。没有真正的方法能完全消除这种原始大脑的非理性，但我们可以意识到这些不准确的信念，并有意识地纠正或补偿它们。\n\
  \n当然，在一本关于数据科学的书中，我们更关心那些影响我们开展高质量、公平数据科学工作的因素，但其中很多因素会以令人惊讶的方式影响我们的数据科学工作。\n\n\
  在本章中，我将涵盖各种偏见、谬误和悖论，它们如何在数据科学工作中体现，以及我们能做什么。首先，我们将看几个偏见或谬误导致问题的例子。\n\n## 现实世界中的偏见与谬误实例\n\
  \n我们将分析的两个例子包括亚马逊带有性别偏见的简历筛选系统，我们最初在第 9 章中看到过。这个例子展示了本章将要讨论的几种不同的偏见。第二个例子是医疗保健中使用的一个工具，它无意中对黑人群体产生了偏见，因为它使用了一种经济指标，错误地使黑人显得比实际病情更轻。这也揭示了几个问题，尤其是我们下面还将讨论的一个悖论。\n\
  \n\n\n### 示例 1：亚马逊的性别歧视简历自动筛选系统\n\n2014 年，亚马逊开始研发一款工具，旨在通过自动审阅简历来识别优质应聘者。这款工具本应能自动抓取网络上的优秀候选人，并尝试将他们纳入招聘流程。到\
  \ 2015 年，亚马逊发现其筛选系统存在严重性别歧视，明显偏向男性应聘者。这并非初衷，公司随后叫停了这个项目（不过表面上他们又尝试了新的方法）。那么，这个系统是如何变得带有性别歧视的呢？\n\
  \n这个筛选系统原本是一个分类器，用来识别值得进入评估流程的候选人。团队使用了十年的应聘者简历作为训练集，并为每个职位和地点分别建立模型，总共约 500 个。接着，他们利用自然语言处理技术解析简历，识别出数万个潜在特征，基本就是词语和词组组合。模型首先发现大多数特征毫无用处，因此忽略了同一职位下所有简历中普遍存在的某些特征（例如软件开发工程师的编程技能）。到目前为止，一切顺利。\n\
  \n但此时，情况开始急转直下。模型开始识别并偏好“强动词”——比如“执行”和“捕获”这类在男性简历中比女性简历中更常出现的词汇，因为被录用的人中男性数量远超女性。同时，系统还会惩罚那些明显与女性简历相关的词汇，例如“女性”（如“女子橄榄球”）以及某些女子学院的名称。\n\
  \n根本问题在于，团队陷入了技术沙文主义——他们相信只要实现了自动化，就一定会比人工操作更好。他们想从网络上海量挖掘“遗珠”。但他们忘记了一点：他们所做的一切，不过是让系统精确复现了他们一直以来的做法——带着性别偏见进行招聘。\n\
  \n这其中还涉及其他几种偏见，我们将在下文进一步讨论。其一是选择性偏见——他们的训练集仅包含向亚马逊投递简历的人。亚马逊以门槛高著称，因此任何缺乏自信的人都不太可能应聘，而女性的“冒名顶替综合征”远比男性普遍。众所周知，男性即使不完全符合所有技能要求也倾向于申请职位，而女性通常不会。另一种是幸存者偏差，即只考虑那些已经通过某个筛选阶段的人。在这个案例中，十年的训练期内被录用的女性数量极少，以至于关于她们（及其能力）的信息完全不被考虑。系统可以判断算法是否主要放行了那些可能成功的候选人，但他们无法得知是否有其他更优秀的候选人被拒之门外。他们完全不了解那些被筛除者的素质。\n\
  \n当前，各行各业都在全速推进利用人工智能进行招聘，尽管这类案例已表明其难度有多大。此外，这一切似乎都基于一个假设：简历能提供关于候选人的有价值信息。任何参与过招聘的人都知道，候选人的简历与其真实经验和技能之间，可能存在巨大出入。\n\
  \n### 示例 2：带有种族偏见的医疗风险预测\n\n另一个充满歧视的领域是医疗保健，尤其体现在教科书、医疗实践和从业人员对黑人群体的系统性偏见。在疼痛管理方面，黑人的医疗待遇非常糟糕，因为存在错误观念，认为他们的疼痛阈值高于白人，且更倾向于寻求药物，但总的来说，他们的诉求常常被忽视。就连网球巨星塞雷娜·威廉姆斯在产后也险些丧命，因为她对严重病症的报告被忽视（在美国医疗体系中，既是黑人又是女性，处境尤为危险）。\n\
  \n一项在 2010 年代中期广泛使用的工具被发现会导致对黑人的歧视性医疗，因为它依赖于有偏见的数据和特征。该工具旨在帮助医院和保险公司识别哪些慢性病患者应纳入“高风险护理管理”项目。进入这些项目的患者通常会获得更好的治疗，因为他们能得到额外护理和专科护士的照料。其理念是，对病情更重的患者在此进行干预，可以预防更严重的并发症，从而降低医疗成本，让患者更健康、更满意。\n\
  \n这听起来是个好主意，但该工具使用了一个旨在反映患者医疗需求的特征：既往医疗支出。换言之，就是该患者过去在医疗上的花费。显然，这是医疗领域机器学习中一个常用指标，而如果你对美国医疗体系有所了解，就应该立刻警铃大作。这个指标在全民医保的国家可能更公平，但众所周知，美国医疗费用高昂，对许多人来说负担过重。人们因无力承担费用而避免定期就医，导致一些本可相对轻易治愈的小问题久拖不治，最终恶化到需要急诊、住院甚至死亡。一切只因金钱问题。因此，比较不同患者的既往医疗支出，更多反映的是他们的经济阶层，而非实际健康状况。此外，由于遭受歧视的经历，黑人群体普遍对医疗系统信任度更低，这也是他们不常就医的另一个原因。因此，这个特征本身带有偏见，不应被使用。\n\
  \n研究人员在分析这一特定工具时发现，该工具分配给黑人患者的风险等级低于应有水平。平均而言，黑人的收入低于白人，因此他们在医疗上的支出自然更少，因为他们更难负担得起。当研究人员比较支出水平相同的白人和黑人患者时，发现黑人患者的健康状况更差。在风险评分极高的患者群体中，黑人患者的慢性病数量比白人患者高出\
  \ 26.3%。这一切都意味着，本可从额外护理中受益的黑人患者，被该工具推荐的机会却少于需求水平相同的白人患者，因为他们的医疗支出更少。如此一来，歧视性医疗的恶性循环便持续下去。\n\
  \n显然，这里涉及多个问题，包括数据缺失，但其中一个是伯克森悖论，我将在下文详述。当系统或人们因为未考虑某些条件信息而得出错误结论时，就会出现该悖论。在这个案例中，被忽略的信息正是黑人患者的实际需求，而这一需求被“既往医疗支出”这一误导性指标掩盖了。\n\
  \n\n\n# 保持好奇\n\n作为数据科学家或数据分析师，最重要的一点是必须倾听数据的声音——可以说是成为数据的“低语者”。我们需要渴望知道数据将告诉我们什么。这意味着，虽然你可以带着知识、挖掘意义的技巧以及对相似事物的理解进入工作，但一定要避免先入为主的观念和仓促下结论。\n\
  \n有许多认知偏见会削弱这种好奇心。*锚定偏见*是指我们执着于某事物的一个想法或特征，而忽视其他方面，通常是我们最先了解到的事物特征。经典例子是：逛街时看到一件\
  \ 300 美元的衬衫，又看到一件 150 美元的衬衫，你会倾向于认为第二件很划算，因为你最先看到的是 300 美元。如果顺序颠倒，你很可能不会觉得 150 美元划算，反而会觉得\
  \ 300 美元是敲竹杠。在数据科学中，这可能导致过早结束探索性数据分析（EDA），因为你以为自己发现了有趣的东西。想象你有一个来自十所本地高中青少年阅读习惯的数据集。开始\
  \ EDA 后，你很快发现大部分阅读书籍的作者是男性，惊悚和科幻是最流行的两种类型。如果你已经读到这里，就知道不该就此止步并下结论。但如果你真的认为“大多数作者是男性”这个事实意味着现在的孩子仍然主要阅读男性作者的作品——这就会玷污你对其他所有内容的看法。\n\
  \n锚定偏见与*保守偏见*相关，即即使在获得相矛盾的新信息时，我们也不愿改变原有信念。假设你将读者分为女生和男生两组，发现实际上女生更倾向于阅读女性作者的作品。但如果你仍坚持“青少年总体上阅读男性作者更多”的观点，这就是保守偏见。如果你最终发现数据集中包含三所男校，其余为混合学校，这应该破除你的执念，因为数据本身就明显存在偏差，但保守偏见仍可能阻止你改变看法。\n\
  \n如果你查看更多关于青少年读者的数据，并对新数据集（已确认全部来自混合高中）进行探索性工作，却无法摆脱先入为主的念头，你可能会把对男性读者的轻微偏好看得比实际更显著。这就是*确认偏见*，即我们倾向于关注、解读眼前呈现的信息（并记住它们），使其符合我们已有的信念。确认偏见的另一个方面是，人们会主动寻找更多支持自己信念的信息，这可能影响驱动工作的假设。\n\
  \n还有一种可能陷入的偏见叫*信念偏见*，即当结论感觉“可信”时，人们更容易认为其论证逻辑合理。类似的是*虚幻真相效应*，即我们更倾向于相信更容易理解或更熟悉的事物。如果我们已经认为“人们总体上阅读男性作者多于女性”，这个初步发现可能感觉可信、合理且熟悉——从而轻易接受。\n\
  \n所有这些偏见都会损害我们做好数据科学的能力。如果所见的正是我们期望看到的，我们就更容易陷入其中。要应对锚定偏见和保守偏见，强迫自己问：你确定吗？是否还有其他可能？我该如何证明这是真的？应对确认偏见、信念偏见和虚幻真相效应的方法类似。你需要识别其他真正可能的解释，并将其排除。但你必须诚实地去做——不要编造虚假的“替代解释”来测试并排除。始终努力退一步思考，尽可能压制个人情感。\n\
  \n基本要点是：保持好奇心，不要急于下结论或接受简单的答案。\n\n## 数据科学实践\n\n在开展数据科学工作、解读和报告结果时，有许多重要的偏见和谬误需要考虑和处理。我将首先讨论在规划和执行数据科学工作时应重视的偏见，然后转向解读结果时重要的偏见，最后是在向利益相关者及其他人员传达结果时需要留意的偏见。\n\
  \n\n\n### 规划与执行\n\n根据你所从事的数据科学工作，你可能需要设计实验或研究，或者仅仅是处理现有数据。某些偏见和谬误是规划实验时所特有的，而另一些则与我们在规划和执行分析与建模时的其他情境相关。\n\
  \n我们之前曾在实验和研究设计的背景下讨论过*选择性偏差*，这种偏差是指在看似随机的统计抽样中，实际并未做到真正的随机，可能受到实验者认知偏差的影响，或者仅仅是由于抽样过程中的系统性或技术性问题。如果我们遵循标准的选择方法（例如第\
  \ 3 章中概述的方法），这些问题都是可以解决的。\n\n在设计实验和研究时，还有其他一些因素需要考虑。*预期偏差*是一种确认偏差，即实验者只根据其先入为主的观念寻找他们想看到的结果；而*观察者期望效应*则是指实验者为了看到自己期望的结果，通常会通过影响参与者行为的方式，操纵（通常是无意识地）实验或其数据解读。带有诱导性问题的问卷调查就是观察者期望效应的典型例子。在你的设计中寻找这些偏差至关重要。你需要以这样一种方式开展工作，让你的研究宿敌无法在你的实验中找到纰漏。\n\
  \n*观察者悖论*是一种在社会科学（基本上是在人类研究中）中出现的现象，即研究者观察某个行为的举动本身就会改变该行为。它最早出现在社会语言学中，当语言学家试图研究人们的说话方式时，他们作为观察者的存在改变了人们说话的方式。每当涉及人类研究时，都应考虑到这一点。\n\
  \n正如我们在上一节中看到的，保持开放的心态很重要。有一些现象可能会与此相悖。*群体思维*是一种现象，当一群人因认为群体和谐至关重要，而导致群体决策不合逻辑或功能失调时，就会发生这种情况。这对数据科学团队的运作方式可能很重要。如果你知道某事有问题，请努力成为那个勇敢发声的人。\n\
  \n保持开放并不意味着忽略重要信息。一种被称为*领域忽视*的框架偏差会导致我们在跨学科背景下工作时，忽略某个领域的重要知识。你有责任确保自己收集了关于某件事的所有相关信息，尤其是当可能存在你因为来自其他领域或业务部门而不了解的观点时。彻底的研究或与来自其他学科和团队的同事交谈可以解决这个问题。\n\
  \n确保自己走在正确的道路上也很重要。首先，始终要确保你的项目值得去做，并且不会带来意想不到的负面后果。*自动化偏差*是技术沙文主义的另一种说法，指的是我们过于信任自动化系统，而牺牲了人类的决策。仅仅因为项目很酷，并不意味着我们就该去做。项目一旦开始，定期审视进展情况也很重要。*沉没成本谬误*是指人们即使计划看起来有问题，也坚持原计划，而这一切仅仅是因为他们已经投入了成本。如果在项目进行到一半时你意识到它行不通，那么重新开始可能比试图将已经完成的工作改造成可行的东西更好。在工作领域，当你面临截止日期时，这尤其困难。没有人想从头再来。但有时候，这却是最好的方法。\n\
  \n在规划和执行任何数据科学项目时——无论是涉及设计实验或研究、分析数据，还是利用现有数据创建预测模型——始终思考你正在做什么，这一点至关重要。\n\n\n\n\
  ### 解读\n\n在解释和分析数据时，有许多需要考虑的重要偏见和谬误。\n\n前面提到的`领域忽视`，即倾向于不在本专业领域之外寻找思路，在这一阶段同样重要。你可能会在结果中看到一个自己无法解释的效应，但心理学或财务团队的同事或许能解释。虽然在规划阶段就处理好这个问题（并与同事建立关系）会更好，但你可能需要重新联系最初的联络人或进行更多搜索。\n\
  \n一个重要的悖论是`伯克森悖论`，它直接影响数据科学工作，发生在人们因忽略关键的条件信息而得出错误结论时。当样本存在偏差时，就会出现典型情况。例如，想象一位家长得出结论，认为青少年小说比成人小说长得多，因为他们的样本是家里的书，而家里的藏书包括他们自己的温馨悬疑小说和浪漫小说，以及他们孩子的青少年奇幻小说。在青少年类别中，奇幻小说通常比当代或浪漫小说长得多；而在成人类别中，温馨悬疑小说和许多浪漫小说往往篇幅较短。这并非“青少年书籍”和“成人书籍”的代表性样本。\n\
  \n有几种偏见属于`扩展忽视`，即实验者在判断结果时没有考虑样本量。其中最重要的是`基础概率谬误`，当人们只关注与特定案例相关的信息而忽略更重要的总体信息时就会出现。术语“基础概率”基本上指的是总体情况，有时人们会为了更有趣的信息而忽略它。一个与数据科学家特别相关的例子是：我们有一个分类器，用于测试某种相对罕见的事物，且精度较低（假阳性相对于真阳性很多）；我们必须避免陷入相信所有阳性结果的陷阱。这被称为`假阳性悖论`，是基础概率谬误的一种特定类型。\n\
  \n`阿波菲尼亚`（Apophenia）是指我们倾向于在不相关的事物之间看到联系和关系。这就是为什么“相关性不等于因果性”的警告如此重要——识别我们世界中的联系是人类的本能。这意味着我们必须小心。如果你认为看到了某种联系，就需要确认它是否真实。不要仅仅因为感觉有趣就草率下结论。这也是使用统计检验的原因之一。仅仅因为一个数字比另一个高，并不意味着它真实反映了现实，而可能只是随机性的结果。\n\
  \n有一个著名的（但真实性存疑的）故事说明了另一种偏见：`幸存者偏差`。当我们审视某个结果时，只考虑那些通过了某种过滤而幸存下来的东西，而忽略了那些没有幸存下来的。这个例子是关于二战期间从轰炸任务返回的美国轰炸机的损伤情况。军方想要给飞机增加装甲，但不能覆盖所有地方，因此需要保护最重要的区域。军方将飞机的损伤汇总在一张图上，如图\
  \ 22-1 中飞机上的红点所示。\n\n![](img/628533_1_En_22_Fig1_HTML.jpg)\n\n*一张飞机的俯视草图，机翼、机身和机尾上散布着红点。这些点代表损伤点，标示了被敌方火力击中的区域。该草图强调了幸存者偏差的概念，表明未受损区域对于生存至关重要。关键词：飞机，草图，损伤，幸存者偏差，红点。*\n\
  \n**图 22-1** 二战期间飞机损伤汇总图，说明了幸存者偏差。来源：来自维基百科文件“File:Survivorship-bias.svg”，网址：[`https://en.wikipedia.org/wiki/File:Survivorship-bias.svg`](https://en.wikipedia.org/wiki/File:Survivorship-bias.svg)，基于知识共享署名-相同方式共享\
  \ 4.0 国际许可协议使用（[`https://creativecommons.org/licenses/by-sa/4.0/deed.en`](https://creativecommons.org/licenses/by-sa/4.0/deed.en)）\n\
  \n许多人乍看之下会认为，那些聚集了大量红点的区域应该用装甲加固。但实际上，恰恰相反——这些是成功返回（幸存）的飞机。那些在发动机、机头、机翼中央部位或从炮手位置到尾翼前方的机身区域受损的飞机，都没有返回。这是因为飞机在这些部位被击中后会坠毁。这个真实度存疑的故事说，当所有人都落入这个偏见陷阱时，一位名叫亚伯拉罕·沃尔德的统计学家指出了这一点。同样的情况也出现在亚马逊招聘工具的例子中，他们只关注被录用的人，却没有考虑那些未被录用的人中是否有人才。思考问题时，永远要考虑那些你尚未看到的数据。\n\
  \n另一个非常有趣的问题是`辛普森悖论`，当数据的不同子集中显现的趋势在子集合并后变得不同，甚至相反时，就会出现此悖论。这听起来不可能，但在真实数据中经常出现。这也是以不同方式对数据进行切片和切块分析很重要的原因之一。图\
  \ 22-2 展示了它在视觉上可能呈现的样子。\n\n![](img/628533_1_En_22_Fig2_HTML.jpg)\n\n*包含两个面板的散点图。左图显示多个彩色数据簇，呈现正相关关系，由红色趋势线表示。相关性值分别为\
  \ 0.74，0.82，0.75，0.72 和 0.69。右图显示一组黑色的单个数据点，呈现 -0.74 的负相关，也由一条红色趋势线标出。两个面板都有 X 轴和\
  \ Y 轴标签。*\n\n**图 22-2** 辛普森悖论的一个例子，显示了各个分组内的正相关（左图）以及整个数据集上的负相关（右图）。来源：来自维基百科文件“File:Simpsons_paradox—animation.gif”，网址：[`https://en.wikipedia.org/wiki/File:Simpsons_paradox_-_animation.gif`](https://en.wikipedia.org/wiki/File:Simpsons_paradox_-_animation.gif)，基于知识共享署名-相同方式共享\
  \ 4.0 国际许可协议使用（[`https://creativecommons.org/licenses/by-sa/4.0/deed.en`](https://creativecommons.org/licenses/by-sa/4.0/deed.en)）\n\
  \n你可以从图中看到，每个组内的效应看起来有多强，但同样重要的是不能忽视整体趋势。这并不意味着组内趋势不重要，但整体图景是重要的。\n\n最后值得一提的谬误是`麦克纳马拉谬误`，即人们只通过定量指标来衡量成功，而忽略其他重要因素（定性因素）。当数据科学工作通过公共政策、医疗决策等影响人们时，这一点尤其重要。想象一家热门视频游戏公司只看新游戏的销量，却忽略了所有人都讨厌它、评论糟糕、人们说它漏洞百出。如果他们*只*看销量，就错过了极其重要的信息——这些信息表明销量很快就会下滑。最初的销售数字是靠公司的声誉支撑的，而不是游戏本身的受欢迎程度。应对这一问题的唯一方法是强迫自己超越数字本身去思考。\n\
  \n在分析数据科学的结果时，很容易陷入各种陷阱，但只要你留心并了解这些陷阱是什么，就能避开它们。\n\n\n\n### 沟通\n\n上述许多偏见和谬误在沟通中都很重要，部分原因在于你的利益相关者可能也持有同样的偏见，你可能需要指出这些问题，以解释它们何以不准确。不过，还有一些偏见则与沟通本身密切相关。\n\
  \n当专家忘记如何从普通（非专家）人的视角看问题时，就会产生*知识的诅咒*。这是我反复强调的一点——你必须善于以非技术受众能理解的方式，向他们解释技术性内容。忘记考虑他们的背景和知识水平绝不是好事。在与利益相关者沟通前，请尽力了解他们的技术层次以及他们所理解和相信的内容。\n\
  \n还有一种有趣的自我评估现象，称为*邓宁-克鲁格效应*，它表现为专家低估自己的技能水平，而新手或完全无技能的人却认为自己的能力远超实际水平。对你来说似乎不难的事情，你可能会忘记自己的知识有多专业，对他人而言又是多么难以企及。沟通中的另一个挑战可能源自该效应的另一半：当你的非技术利益相关者认为自己比实际懂得更多时，情况就会变得棘手。因为他们可能会说出完全错误的话，而在会议上纠正别人，尤其是当对方比你资历更深时，这很难处理。明智的做法取决于诸多因素。最好的办法是观察其他经验更丰富的同事如何应对。老实说，有时你只能忽略它，继续前进。\n\
  \n最后一种对沟通至关重要的偏见是*创新偏见*，它与技术沙文主义相关，指人们认为创新或新颖的事物对社会的好处可能被夸大，这很大程度上是由于忽视了其负面方面。不要让自己陷入这个陷阱，也不要让你的利益相关者陷入其中。这意味着要思考更广泛的后果，而不是忽略负面因素或风险。\n\
  \n## 职业\n\n作为一名数据科学家，通常意味着要在这个领域或相关领域拥有长期的职业生涯。我们有很多方式会自我破坏，或者至少错失提升和成长的机会。有两个关键领域的偏见会影响我们的职业生涯。大多数与自我认知及其偏差有关。还有几个与规划相关，这会影响你在职业道路上能取得多大的成功。发展你的事业是你自己的责任，了解自己、自己的优势和局限，是知道如何提升的最佳途径。\n\
  \n### 自我认知\n\n最著名的偏见之一是*冒充者综合征*，你会觉得自己是个骗子——你实际上并不称职，而你周围的每个人*都*很称职，并且很快他们就会意识到你一无是处。显然，这种情况理论上是可能发生的，但现实中很少见。大多数人表现得比他们实际感受的更自信，内心充满自我怀疑，所以你并不孤单。应对这个问题的最佳方法是真正反思你的技能，看看你是如何努力培养它们的，从而确信它们的真实性。找出你拥有而同事不具备的技能，即使你的本能是认为它们不重要而忽略它们。如果你擅长人际交往，这是很多人不具备的技能。如果你会说多种语言，并且比一些同事更擅长\
  \ NLP，那也是一种优势。\n\n在任何职业（乃至生活中），自我意识都是宝贵的财富。对自己的优势和劣势有现实的认识，能让你更容易选择正确的道路并实现自我成长。但有一些偏见会影响你准确认识自己的能力，它们都与冒充者综合征相反，属于*自我中心偏见*的范畴，即我们高估自己的观点，认为我们通常比他人眼中的自己更好。我上面提到了盲点偏见，即我们假设自己比他人偏见更少。还有*虚假独特性偏见*，即我们认为自己异常独特、比实际更特别，比如可能因为身边的同事在编写优化代码方面不那么擅长，就认为自己在这方面特别出色。*虚假共识效应*让我们认为他人比实际更同意我们的观点，这可能导致我们认为所有人都同意我们的解决方案，即使有些人心里存疑。人们当时不发言可能有很多原因，并不仅仅是因为他们同意你。最后，*有效性错觉*指人们认为自己的观点和判断比实际更准确。*解释深度错觉*则让我们认为自己对某个事物的理解远超实际水平。这两者都可能让我们对自己的解决方案过于自信。\n\
  \n所有这些都是自然的。我们生活在自己的头脑世界里，当然会觉得自己的视角是最好的。但更好地了解这一点，可以帮助我们避免让这种自我中心阻碍自身的进步。要应对这些问题，你首先必须意识到每个人（包括你）都以各种方式抱有偏见。认识到这一点就是一种力量，如果你倾听他人并观察他们的偏见，这也能像一面镜子反映出你自己的偏见。你不必到处宣扬自己的偏见是什么，但如果你知道自己有这些偏见，就可以在心里进行调整，并选择不同的行动。如果你的某个偏见被公开指出，不要产生防卫心理。相反，要倾听，承认错误，并做得更好。\n\
  \n独特性偏见和虚假共识偏见实际上有些相反，所以我们同时拥有两者，这有点讽刺。这两者以及有效性错觉，在你与他人合作时都特别重要。独特性偏见让我们认为自己总体比他人优秀，有效性错觉则让我们认为自己的想法更出色。当你在一个团队中工作时，这些并非普遍成立。即使你确实拥有独特的经验或知识，你仍然并非全知全能。此外，记住其他人有时拥有你不知道的经验或知识，这点也很重要。当你在团队中试图做决策时，切忌陷入虚假共识效应。通过重申你们刚刚达成的共识来确保意见统一，并邀请大家提出批评意见。\n\
  \n我前面提到了邓宁-克鲁格效应，即专家低估自己的技能，而非专家则假定自己比实际懂行。不要让自己低估你的技能。你付出了努力才培养出这些技能。这显然与冒充者综合征有关，但它的重点不总是让你自我感觉良好，而是你根本没意识到自己的某些技能有多重要。如果有人把你当作导师，你可能觉得自己没什么可教；但他们来找你这一事实本身就说明你是有价值的。\n\
  \n最后一个值得提及的自我认知偏见是*冷热移情鸿沟*，当我们不承认情绪对我们的信念和行为影响有多大时，就会出现这种情况。我们都是人类，没有人能百分之百冷静和理性，无论我们自认为有多理性。作为人类是可以的，但这只意味着你应该尝试识别任何影响你决策的情绪，并评估它们与你正在做出的决策是否相关。\n\
  \n\n\n### 规划\n\n职场中每个人都需要培养的技能之一就是规划能力，包括估算工作量和时间。这众所周知地困难，主要归咎于两个谬误。其一是*难易效应*，即人们会高估自己完成困难任务的能力，却低估自己完成简单任务的能力。这进一步引发了*规划谬误*，即人们相信事情实际耗费的时间会比需要的更少。这两者相辅相成，在技术领域屡见不鲜。提供估算本质上就很困难，而精通此道的唯一方法就是关注自己的估算，并从其偏差中学习。\n\
  \n### 其他偏见与谬误\n\n还有许多其他偏见与谬误影响着我们，即便它们并非总是直接作用于数据科学工作。然而，任何形式的人性弱点都可能影响工作，因此这里再列举一些值得思考的内容。\n\
  \n我们在准确思考未来方面表现极差，尤其是在涉及不确定性时。*赌徒谬误*导致人们认为未来事件的可能性会受到过去事件的影响，即使两者毫无关联。这个名称源于赌博者会根据已发生的情况来预测未来。例如，玩老虎机的人可能会想：“我已经连输\
  \ 20 局了——很快该赢了。”这种思维过程也与*乐观偏差*相关，即人们高估积极结果的可能性，低估消极结果的可能性。*概率忽略*也很常见，即我们在面对不确定情况时干脆无视概率。老虎机玩家忘记了每次拉下杠杆获胜的概率都是相同的。在数据科学中，这些会影响我们规划项目的能力。\n\
  \n我们常常难以理解复杂情况，尤其是（但不仅限于）涉及不确定性时。*零和偏差*指人们认为某种情况是零和博弈而实际上并非如此（*零和博弈*指一人获利必然意味着另一人受损）。认为给别人东西就必须从他人那里拿走什么，这显然不对。我们还常常将模棱两可的情况视作固有威胁或负面，这被称为*解释偏差*。如果更仔细地观察，或许会得出不同的理解。然而，我们常常渴望获得关于情况的更多信息，即使这些信息对理解毫无帮助，这种偏差称为*信息偏差*。\n\
  \n其他与理解情况相关的偏差包括*范围忽略*，即人们在思考解决方案时忽视问题的规模或影响程度；以及*零风险偏差*，即人们倾向于完全消除微小风险，而不是在更大范围内降低风险。范围忽略意味着人们可能不会立刻意识到，向非洲贫困学校运送一万张课桌的成本远高于运送一千张。对于零风险偏差，人们往往不满足于仅仅降低风险（这意味着在广泛条件下仍存在一定风险），而更倾向于在特定条件下完全消除风险。这方面的例子来自针对假设性危险场地清理的问卷调查。^(\
  \ ⁵⁹ ) 假设有两个危险废物场址 A 和 B。A 每年平均导致八例癌症，B 导致四例。有三种清理方案。前两种方案使总病例数降至六例，但两个场址都仍有病例。第三种方案完全消除了\
  \ B 的病例，但 A 仅减少一例，因此总病例数更高，为七例。近半数受访者倾向于第三种方案而非前两种之一，尽管总体减少的病例更少。\n\n我们在回顾过去方面通常表现不佳。认知偏差*近因偏差*导致人们更偏爱最近的记忆。*近因错觉*使人认为刚学到的事物本身是新颖的。我们也强烈希望世界合乎逻辑，*后见之明偏差*导致人们认为过去的事件是可预测的。当回顾往事时，人们容易说：“哦，那当然会发生——从他后来的行为来看显而易见。”但当时我们毫无头绪，也不可能知道，因为这实际上并不可预测。\n\
  \n我们也不擅长等待好事。*现时偏差*指人们高估近期回报而低估远期回报。这就是为何那么多人难以进行投资——他们宁愿现在就拥有那辆悬浮滑板车，也不愿未来能买五辆同等的产品。\n\
  \n另一个困扰我们的领域是容易被事物间的细微差别分散注意力。有几种偏差属于*框架效应*，即想法的呈现方式会影响我们的感知。其中之一是*默认效应*，即当人们面临多个选项时，会倾向选择被设为默认的那一个。*区分偏差*是指同时比较事物时，会比分开看待时觉得它们差异更大。*诱饵效应*是一种营销中利用的现象：当某人正在比较两个事物并偏向其中一个时，引入具有特定特征的第三个选项（诱饵），可能导致此人转而偏好第二个选项。诱饵明显比原有两个选项中的一个更差，但与另一个相比则好坏参半（某些方面更好，某些方面更差）。\n\
  \n均值回归是本书前面讨论过的统计学概念，但值得牢记。它指出，当我们看到一个极端值时，下一个值很可能不那么极端。这与*热手谬误*截然相反，后者认为有成功经历的人会继续成功。这个名称源于体育迷认为某人“手感火热”——比如在比赛中因状态正佳而连续投进异常多的篮球。不过，值得一提的是，由于心理因素，有人相信热手谬误未必总是谬误——处于连胜状态的篮球运动员可能认为自己不会失误而更加自信，这反而促使他们实际表现更好。但这不适用于老虎机上的连胜者，因为获胜完全由概率决定，与个人自信无关。\n\
  \n这些偏见和谬误都会影响我们日常运作和决策的能力，进而可能影响我们在工作和职业生涯中的表现与抉择。\n\n\n\n# 要点总结与下章预告\n\n在本章中，我们讨论了一系列认知偏差、谬误和悖论。我首先举了几个例子说明偏差如何对机器学习系统产生负面影响。接着，我讨论了若干阻碍我们保持开放心态的偏差和谬误，而这种开放心态正是做好数据科学、成为优秀数据科学家所必需的。随后，我谈到了一些直接关系到数据科学工作的规划、执行、解读与沟通的偏差与谬误。再之后，我探讨了可能影响你职业生涯的偏差和谬误，最后介绍了一些更普遍但可能在工作和生活中引发麻烦的其他问题。\n\
  \n在下一章中，我将讨论如何“亲自动手”进行真正的数据科学实践。获得实践经验对于技能成长和建立个人作品集都至关重要。我还会介绍可以用来获取这些经验的各种工具和平台，以及如何寻找可用的数据源。\n\
  \n## 从业者简介：丹尼尔·塔拉松·巴贝拉\n\n**姓名：**丹尼尔·塔拉松·巴贝拉\n\n**现任职位：**高级数据科学家\n\n**现任行业：**通过咨询涉足多个行业，包括零售、银行和天然气\n\
  \n**从业年限：**6 年，另有 2 年数据工程师经验\n\n**教育背景：**\n\n*   物理学学士学位\n\n*此处表达的观点仅代表丹尼尔本人，而非其历任或现任雇主。*\n\
  \n### 背景\n\n丹尼尔热爱物理，因此在大学主修了该专业。但随着学位接近尾声，他不确定毕业后想做什么。他对核物理或医学工作感兴趣，但这些工作机会难得。医学领域的相关岗位每年只有寥寥几个，而参加考试争夺这大约\
  \ 12 个职位的人却成千上万。随着毕业临近，他感到不确定且越来越焦虑，因为他知道那条路希望渺茫。一位家人偶然发现了一门关于大数据的课程并告诉了他，于是他开始研究这个领域。他对此一无所知，也从未听说过数据科学，但当他在研究过程中偶然发现它时，他知道这就是正确的道路。即使在攻读物理学学位期间，他也一直热爱编程和处理数据。他开始了数据科学的硕士学习，并完成了课程作业，只差毕业论文尚未完成——因为他成功找到了一份数据相关的工作。\n\
  \n### 工作经历\n\n在转入数据科学岗位之前，丹尼尔做了两年数据工程师。数据工程工作本身不太有趣，但他确实在工作中学到了很多关于数据处理的知识。他非常喜欢做数据科学家，因为他热爱编程。这个岗位很适合他，因为他注重细节，信奉严谨和把事情做对，包括检查统计显著性。他的数据科学工作一直在一家咨询公司进行，因此他能在不同公司和不同行业从事多种类型的工作，这让他觉得很有趣。\n\
  \n### 妙语精选\n\n**工作中最喜欢的部分：** 他在数据科学中最喜欢的是使用优化技术（如 SIMPLEX 和遗传算法）的模型。他喜欢数据科学的另一点是，它能够对社会诸多方面产生积极影响。\n\
  \n**工作中最不喜欢的部分：** 尤其是在做咨询顾问时，你并不总能掌控为哪些公司工作或从事何种工作，丹尼尔有时会对数据科学领域正在进行的某些工作感到道德冲突。他也不喜欢探索性数据分析及数据科学其他方面存在如此多的不确定性。他经常在事后质疑自己的工作，心想如果换一种方式或者多花些时间探索，结果会不会更好。\n\
  \n**最喜欢的项目：** 丹尼尔有几个自己特别引以为傲的项目。一个是为其所在地区的公共图书馆创建图书推荐系统。他们仅对借阅量最高的前 5000 本书（而非图书馆系统中的数百万本）使用协同过滤进行了试点，但效果确实非常好。由于资金不足，项目未能超越试点阶段，但很明显，如果资金充足，它会是一个优秀的系统。第二个项目是为一家燃气零售商在时间非常紧迫的情况下完成的。他们想要优化燃气配送，这涉及两个方面：一是决定哪个客户由哪个工厂供应，二是优化从工厂到客户的路线。他们在一个月内完成了所有工作，公司采纳了研究结果，因此取得了巨大的成功。\n\
  \n**最常用的技能：** 务实精神，以及对透明度和可解释性的重视。想想奥卡姆剃刀原理——其在数据科学中的要义是，如果两个解决方案都能用，较简单的那个可能最好。更简单的解决方案通常在透明度、对利益相关者的可解释性以及数据科学家本身的易理解性（比如了解模型使用了哪些特征）方面更胜一筹。丹尼尔总记得一句西班牙谚语，翻译过来是“杀鸡焉用牛刀”。例如，你可能不需要用生成式\
  \ AI 来对文本进行分类，因为十年来我们早就知道怎么做了。\n\n**目前主要使用的工具：** Python 或 R（取决于客户）、SQL 和 Excel（有时用\
  \ Excel 快速制作图表比打开 `matplotlib` 或 `ggplot` 更容易）\n\n**数据科学的未来：** 不幸的是，未来属于生成式 AI，尽管他觉得这很大程度上是在解决一个“没人有”的问题。他不信任它，因为它会胡编乱造，同时还“听起来头头是道”。他认为接下来会有几年糟糕的时期，每个人都想用生成式\
  \ AI，但他们会发现它实际上没那么有价值，然后我们就会回归传统的数据科学工作方式。\n\n**优秀数据科学家的特质：** 理解统计学很重要，因为很多人（甚至包括数据科学家）都不懂。坚持自己的原则很重要，否则，如果基于错误或误导性的结果，企业可能会做出糟糕的决策。这种情况经常发生，因为业务人员通常不理解统计显著性这类概念，所以认为它们无关紧要。在质量和严谨性方面设定标准，并在别人希望你妥协时坚持正确的东西（有趣的是，这恰恰是为了他们好）至关重要。另一点是，你不应该寻找特定的结果，因为你总是可以操纵数据，让它“说出”你想听的话——相反，你需要保持开放的心态，让自己去发现数据中真正蕴含的信息。\n\
  \n**他对未来数据科学家的建议：** 好好学统计。大多数人（甚至包括许多数据科学家）对统计学的理解都流于表面。另外，不要过分担心编程等技术技能是否完美。你可以在工作中磨练自己的技术能力。\n\
  \n*丹尼是一位拥有多个行业经验的数据科学家。他还做过一些数据工程工作，目前正在接受培训，希望成为一名教师。*\n\n脚注 1 2 3\n\n# 第三部分：未来\n\
  \n## 23. 亲自动手：如何投身数据科学\n\n\n## 引言\n\n数据科学并不是那种你只需阅读就能掌握并能成功实践的领域，尽管网上有很多骗子会这样告诉你。大多数技术领域都是如此，但要想培养数据科学技能，你必须亲自实践。是的，你可以在工作中发展这些技能——这种情况总会发生——但与过去相比，现在没有任何经验就想进入入门级数据科学岗位要困难得多。好消息是，你的经验不必非得来自公司工作（尽管那通常是最好的方式）——如今几乎所有人，无论有无经验，都需要建立一个可以向潜在雇主展示的作品集。这确实意味着即使你有工作经验，如果这些经验涉及专有内容，你可能无法直接分享，而需要经过修改。你总是可以谈论*你完成的项目，但通常最好有一些有形的东西可以向他人展示。\n\
  \n如何制作作品集呢？你必须做一些项目，无论是个人项目、在学校进一步发展的项目，还是通过像 `Kaggle` 这样的平台参与的竞赛或公开挑战项目。我将在本章中讨论如何着手进行。我将从如何培养你的技能（以及哪些技能需要培养）的基础知识开始，接着介绍可帮助你发展作品集和技能的工具和平台，最后讨论众多可用的数据来源。\n\
  \n# 技能培养\n\n如上所述，真正进行一些实际数据科学工作最具体的目标是创建一个可用于求职的作品集。但真正的目标是发展你的数据科学技能，这样你就能进入你心仪的数据科学家岗位并立即进入工作状态。\n\
  \n## 数据思维\n\n我之前提到过数据思维。它基本上是一种以好奇心和没有预设前提的视角来看待数据和世界的观点，让数据向你展示它所蕴含的内容，而不是将你的信念强加于数据，让它说出你想要的结果。但它也与拥有良好的数据直觉有关，这意味着知道如何审视数据，以及何时和何处需要深入挖掘。好奇心方面极为重要。数据科学确实是一门艺术，因为找到创造性的方法来揭示数据中的秘密，不仅仅需要知道如何编写几个简单的图表代码。想要知道数据真正在说什么，是成为一名优秀数据科学家的关键。\n\
  \n一个好的数据科学箴言是：带着目的去审视，不要预设结论。\n\n## 现实世界中的数据\n\n在我采访的几乎所有从业者中，有一个观点反复出现，那就是人们在分析课程中使用的数据与现实世界中的数据之间存在差异。关键的区别在于数据混乱程度。我通篇都在讨论这一点，而现实世界的数据确实非常、非常混乱。在数据准备和建模上花费的时间比例为\
  \ 80:20，这并非夸大其词。\n\n那么，为什么你在大学课程中没有获得这方面的经验呢？说实话，每个分析学位课程都应该至少有一个学期专门用于学习如何处理混乱的数据，尽管大多数课程并没有这样做。你在其他课程中没有学到这一点的主要原因在于，这些课程旨在教授你某些特定内容，如果因为花费\
  \ 80% 的时间来准备数据，而只花 20% 的时间来学习那个特定内容，这显然不太合理。但这却低估了数据准备的重要性，并让你对数据科学的真实面貌产生了错误的印象。\n\
  \n所以请记住，真实数据会包含缺失数据、异常离谱的离群值，以及由于各种原因而完全错误的值——这些你都不容易识别出来。或者，你有一个想要与另一个包含非常有价值数据的表进行连接的表，结果却发现只有一小部分记录同时存在于两个表中。挑战总是存在的。你已经得到提醒了。\n\
  \n## 问题解决与创造力\n\n有些人天生比其他人更擅长解决问题，但学会如何有效地解决问题也是完全可能的。学习解决问题（或只是想变得更好）的最佳方法之一就是通过实践。找到一些数据分析和数据科学问题（最好是真实的），然后按照下面的步骤来弄清楚它们。每解决一个问题，你获得的只是和经验都将帮助你解决未来的另一个问题。\n\
  \n有很多方法可以找到可以用来练习的项目。通常最好是选择你感兴趣、好奇甚至有所了解（即拥有领域知识）的内容。这会让学习过程更有趣，也更容易让你对如何推进产生真正的见解。你总可以做一些关于自己生活中数据的个人项目。或者，你可以在网上找到一个常见问题，比如\
  \ `Kaggle` 上的 `泰坦尼克号` 问题，或者 `Kaggle` 或其他网站上不那么常见的问题。我建议你在刚开始时不要选择复杂的问题，因为在你应该培养整体技能的时候，你不希望被某个特定问题的细节所困扰。我还强烈建议在进入建模之前，先做一些数据分析项目，以培养你的\
  \ `EDA` 和分析能力。\n\n一旦你选定了一个问题并进行了初步的可行性检查（基本上，确保有可供你处理的数据），就可以开始遵循 `CRISP-DM` 方法。这意味着你应从业务理解开始，即明确你计划进行的分析能为谁带来益处，以及他们想要什么。如果是个人项目，那个人就是你，你应该问问自己的目标是什么。无论你是在练习还是在线找到了一个问题，都要设想这项工作可能产生什么结果，并确定一些需要回答的问题。\n\
  \n从这一点出发，继续遵循 `CRISP-DM` 方法，你将逐步找到解决方案，并将大部分时间花在数据理解、数据准备、探索性分析和建模上。验证和评估是另一个重要步骤，你基本上需要检查你的工作，以确保对自己的结果有信心。最后，你要进行的可视化和展示将取决于你的练习目标。我将在下面讨论这一点。\n\
  \n如果你想变得更好，就做一个项目，然后循环往复。尝试寻找不同类型的问题，或者在同一领域中难度递增的问题，特别是如果你想将这个领域作为你的职业方向。\n\n##\
  \ 展示与可视化技能\n\n我们已经详细讨论过展示和可视化技能的重要性。在这里，我更多地谈论展示你的发现，而不是在作品集或面试展示中，你在进行 `EDA` 时制作的图表和其他可视化内容。你应该让你的结论和发现尽可能清晰和简洁。\n\
  \n你需要确保你所有的可视化作品看起来都很整洁，坐标轴标注清晰，并且有标题和其他适当的标注（如图例等）。确保文本清晰可读（字体足够大且不是花哨的字体），并尽量在整个作品中保持样式和配色方案的一致性。如果你创建了一个包含多个组件的仪表盘，最好在放大状态下截取屏幕截图，以防你无法进行现场演示。确保所有内容都易于阅读。\n\
  \n总的来说，但在你为了创建作品集而练习这些技能时尤其如此，你需要针对不同类型的受众创建不同的作品，从非技术领导者到数据科学同行。这是你可以展示沟通能力的一个方面。\n\
  \n\n# 作品集\n\n对于作品集，你需要整理你的工作成果，以便能够展示它，并制作一些漂亮的图表和一份简洁清晰的演示文稿（格式不限）。你完全可以沿用课堂上完成的项目，但很可能需要对其进行调整和优化，使其看起来更专业。\n\
  \n你的作品集内容应该面面俱到，从探索性数据分析（EDA）到部分代码、一些可视化图表、相应的解释性文字，以及你的结论。一种常见的展示方式是使用 notebook，例如\
  \ JupyterLab notebook，这对技术同行来说非常合适。但你可能还需要准备一套面向非技术人员的幻灯片演示。你可以将任何样式保存为 PDF 文件。不过，分享作品集的最佳方式是将其放在一个公共平台上。这可以是你的个人网站，也可以是众多数据科学和可视化公共分享平台中的任何一个，例如\
  \ Kaggle 或 Tableau（下文将详细介绍）。\n\n# 工具与平台\n\n有各种各样的工具和平台可用于进行和分享数据科学工作。我将首先介绍编码选项，然后介绍可视化、演示和分享。\n\
  \n## 编码\n\n关于编写代码和编译结果，你有三种基本选择。第一种是个人环境，无论是你自己的电脑、公司电脑，还是像你大学网络那样的共享计算空间中的虚拟机。第二种是在像\
  \ Kaggle 这样的公共数据科学平台上。第三种是在通用云平台上，例如 Azure、AWS 或 GCP。对于个人而言，前两种很可能是唯一真正可行的选择，因为它们是免费的，而云平台可能非常昂贵（即使听起来很便宜，也容易意外产生费用）。\n\
  \n### 个人环境\n\n如果你打算在个人电脑或虚拟机上编写代码，除非它已经配置妥当，否则你需要为进行数据科学工作准备环境。这意味着要选择一种语言（R 或 Python）并进行安装，然后安装进行数据科学所需的所有基本库。有关设置个人数据科学环境的详细信息，请参阅附录，但这里我将介绍基础知识。\n\
  \n你可以从 R 语言的项目页面安装 R。^(⁶⁰) 有多种 Python 发行版可供选择。对于 Python，黄金标准一直是 Anaconda，^(⁶¹) 它是一个完整的\
  \ Python 发行版，预装了许多重要的库。它过去在企业中很常见，但出现了一些问题导致公司逐渐弃用，不过对个人用户来说仍然安全。另一种选择是，你可以从 `Python.org`\
  \ 安装基础的 Python 发行版。^(⁶²)\n\n第 11 章列出了一些 R 和 Python 中最常用的库。你可以等到需要时再安装其中的一部分，但大多数人会至少一次性安装所有常用的库。如果你打算在\
  \ Python 中以 notebook 风格工作，你还需要安装 JupyterLab。\n\n如果你使用的是 R，或者希望在 Python 中有更多选择，你还需要安装一个*集成开发环境*（IDE）。IDE\
  \ 是编写代码的文本编辑器，大多数 IDE 在安装插件后几乎可以让你使用任何语言进行编写。IDE 非常棒，因为它们有许多方便实用的功能，例如代码的彩色格式化，这可以清晰地表明特定文本片段是哪种“东西”——比如函数、变量或一些文本。它还会包含行号（对调试非常有帮助）以及其他有用的功能和工具。对于\
  \ R，首选的 IDE 是 RStudio Desktop。^(⁶³) Python 可以在许多 IDE 中使用，目前 Visual Studio Code^(⁶⁴)（VS\
  \ Code）很流行。VS Code 的一个优点是它支持在其中使用 JupyterLab，并且你还可以使用其他语言和格式。此外，你也可以用它来编写 R 语言。安装好\
  \ IDE 后，你可以安装必要的插件（再次提醒，更多细节请参阅附录）。\n\n数据科学家最重要的技能之一是 SQL，而在个人电脑上安装 SQL 比安装 R 或\
  \ Python 要复杂一些。你可以安装一个免费的数据库引擎和与之交互的图形化工具，这允许你创建和查询数据库。这类工具有 MySQL^(⁶⁵) 和 MySQL\
  \ Workbench^(⁶⁶)，或者 PostgreSQL^(⁶⁷) 和 `pgAdmin`。^(⁶⁸) 使用这些工具有一定的学习曲线，但为了获得更多实践，这可能还是值得的。或者，你也可以直接寻找在线\
  \ SQL 课程和练习工具。这些将在下一章讨论。\n\n### 免费平台\n\nKaggle^(⁶⁹) 是另一个优秀的免费选择，特别是如果你想轻松分享你的作品。Kaggle\
  \ 也是一个你可以通过参与竞赛（如泰坦尼克号项目）来检验自己数据科学技能的地方。它提供了海量的数据集供你探索，我们将在下面讨论。\n\n如果你想使用可以编写 R\
  \ 或 Python 代码的 notebook 工具，你需要创建一个账户。我建议你前往“代码”板块，探索那里众多的公共 notebook。你可以搜索自己感兴趣的内容，看看别人都做了些什么。在\
  \ Kaggle 中你可以做的一件好事是*复刻*（fork）一个 notebook，意思是把现有的 notebook 复制到你自己的空间，然后你可以随意修改（而不会影响原始\
  \ notebook）。\n\n如果你感觉自己不知从何入手，Kaggle 在“代码”板块提供了一些免费课程，完成课程后你可以获得证书，甚至可以在平台之外分享。这些课程非常注重实践，能为你的起步提供绝佳起点。\n\
  \n当你感到得心应手后，可以去看看“泰坦尼克号”挑战赛，在“数据集”板块寻找数据，或者甚至看看一些竞赛。创建一个 notebook，然后开始吧。\n\n###\
  \ 云平台\n\n我不打算深入探讨云选项，因为它们很复杂，而且很可能不适合你，主要是因为成本问题。但 Azure、AWS 和 GCP 确实存在，你可以相当容易地注册。它们都会提供免费试用，并且有些方案在达到一定使用量之前确实提供免费服务，但你只需要非常小心，坚持使用免费选项。Azure\
  \ 有一个页面^(⁷⁰) 列出了免费选项，AWS^(⁷¹) 和 GCP^(⁷²) 也是如此。\n\n显然，他们提供这些免费选项是为了说服你开始花钱，所以要谨慎行事。在我曾经的一份工作中，我们举办了一个黑客马拉松来学习\
  \ Azure，我的一个同事创建了一个 SQL Server 实例，之后却从未启动过。他阅读了所有文档以确保不产生任何费用，但当我们第二天上班时，仅仅放置在那里什么都没做，它还是产生了\
  \ 75 美元的费用。另一个例子是，我的团队在 GCP 中创建了一些服务器，我们可以在上面运行虚拟机，但实际上什么都没运行，结果不到一周就产生了 300 美元的费用。与定价相关的文档通常非常复杂复杂难懂。企业里有专人负责管理这些服务，他们了解规则，因此可以避免意外产生巨额费用，但对个人来说这是一种风险。你必须清楚自己在做什么。\n\
  \n## 可视化、演示和分享\n\n前面讨论的所有编码选项都包含了可视化功能，并提供了一些演示选项，但它们可能并非最佳方案。此外，并非所有选项都便于分享。在本节中，我将讨论满足所有这些需求的整体选项。\n\
  \n\n\n### 个人场景\n\n如果你在个人电脑或空间上完成所有工作，分享工作成果（包括可视化和演示）最明显的方式是使用笔记本。你可以在面试中直接分享这些笔记本（通过共享屏幕），或者将其下载为\
  \ PDF 甚至原始笔记本文件（`.ipynb`）格式，与潜在雇主分享。\n\n如果你使用的是自己下载的可视化工具，也会有类似的选项。但可能存在一些公共空间，你可以将在电脑上创建的仪表板上传到其中，以便广泛分享。\n\
  \n即使所有开发工作都在你的电脑或虚拟机上完成，另一个公开分享代码和笔记本的选项是 `GitHub`，我将在下一节中介绍。\n\n分享代码的最后一个选项是你自己的专用网站或博客。这个选项有很多可能性，包括\
  \ `Squarespace` 和 `Wix` 等免费或低成本网站。你不需要做任何特别花哨的事情，但如果你想做任何事，这个选项都能满足。你可能需要为此付费购买域名，特别是如果你认为将来可能会以更大的规模发展这个方向。\n\
  \n### 免费平台\n\n如前所述，`Kaggle` 是一个在公共笔记本中开发代码的明显场所，你可以在其中包含可视化效果并包含格式精美的笔记本以展示你的项目。很多人使用\
  \ `Tableau Public` 来公开分享他们实时、交互式的仪表板。\n\n著名的平台 `GitHub` 本质上是一个存储代码并带有版本控制（即跟踪对代码的更改，以便在引入错误或不希望保留的内容时快速回滚到旧版本）的地方。但它也非常适合分享和协作。其工作方式是：代码必须存放在某台电脑上，并与\
  \ `GitHub` 网站上的一个代码副本（称为仓库）绑定。当你在自己的电脑上更新代码时，可以将其推送到仓库网站。如果其他人有权限，他们也可以从自己的电脑向同一仓库推送代码。你可以在仓库中包含你的笔记本和结果。与\
  \ `Kaggle` 不同，你无法在 `GitHub` 中运行任何东西，但人们可以直接在 `GitHub` 网站上查看你的代码。此外，你可以使用一种名为 `markdown`\
  \ 的简单语言通过文本文件分享你的结果，从而创建格式更精美的结果和 `README` 文件。`GitHub` 还能够创建所谓的分支，这涉及在某个时间点对仓库进行快照，然后仅在该分支内进行编辑。这是当今大多数编码工作的方式，每个人创建自己的分支并在其中工作，当完成一个工作单元后再将分支合并回原始仓库。积累一些\
  \ `GitHub` 经验对你的职业生涯也有好处。\n\n另一个不那么常见的选项（类似于运行你自己的网站或博客）是使用像 `Medium` 或 `Substack`\
  \ 这样的写作平台，进行博客式的写作，并有机会接触到内置的潜在读者。这涉及撰写人们可以订阅的文章。如果你确实通过这种方式生产了足够多的内容，你甚至可以将其变现，并在一些大型数据科学网站（如\
  \ `Towards Data Science`）上发表文章。\n\n### 云平台\n\n云平台总是一个选项，但我仍然不建议个人使用。但如果你选择了这条路，请寻找免费选项中那些用于可视化和分享演示文稿的好工具。\n\
  \n## 数据来源\n\n在你的项目中找到可供使用的数据可能是一个挑战。但同时，如果你知道去哪里找，互联网上几乎有无限多的数据集。你需要自己尽职调查，以确定其质量和潜在的偏见。有些数据集在其托管地或其他地方有良好的文档，而另一些数据集则文档极少，以至于很难证明使用这些数据的合理性（因为你不知道它的真正含义）。\n\
  \n`Kaggle` 是我们已经讨论过的一个明显的来源。那里有成千上万个上传的数据集，其中一些附带有几个笔记本，而另一些则自上传以来从未有人查看过。它们的质量参差不齐，因此你在查看时需要考虑这一点。`GitHub`\
  \ 上也有很多数据集。有时，云平台和学习平台会在其课程中提供数据，你可以在课程教授内容之外使用这些数据。\n\n各级政府和组织通常拥有数据存储库，用于分享可供下载的数据。大量的政府数据是公开的，但也有一些潜在的来源你可以请求访问。在美国，《信息自由法》要求相关机构在请求下提供某些数据，例如可能不在网上但被视为公开的法庭记录。\n\
  \n请参见表格 23-1 获取相当多的数据集来源列表。网站 `KDnuggets` 维护着一个数据来源列表^(⁷³)，你可以通过谷歌搜索找到更多，特别是如果你对某些特定数据有特殊兴趣的话。也有一些数据提供商并非免费，但如果你愿意花钱，他们可能正好有你想要的东西。例如，如果你对体育非常感兴趣，有很多公司拥有用于梦幻体育或真实体育的体育数据。有人会向你出售大量此类数据。\n\
