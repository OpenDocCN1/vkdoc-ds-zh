  \ | 2018-05-16 | 3.45 |\n| 2 | 竞速狂飙 | Wii | 49.99 | 竞速;体育 | 2019-02-01 | 4.01 |\n\
  | 3 | 终审法庭：首案 | Xbox | 39.99 | 角色扮演;回合制策略 | 2020-07-14 | 2.98 |\n| 4 | 松景庄园 | PlayStation\
