  \ 中的比较运算符\n\n| 用途 | 数学符号 | Python | R | Python 示例及结果 |\n| --- | --- | --- | ---\
  \ | --- |\n| 小于 | n < m | `<` | `<` | `6 < 2` 得到 False。 |\n| 小于或等于 | n ≤ m | `<=`\
  \ | `<=` | `6 <= 2` 得到 False。 |\n| 大于 | n > m | `>` | `>` | `6 > 2` 得到 True。 |\n\
  | 大于或等于 | n ≥ m | `>=` | `>=` | `6 >= 2` 得到 True。 |\n| 等于 | n == m | `==` | `==`\
  \ | `6 == 2` 得到 False。 |\n| 不等于 | n ≠ m | `!=` | `!=` | `6 != 2` 得到 True。 |\n\n\
  还有一些与条件判断密切相关的重要运算符：`not`、`and`和`or`。`not`对其前置的值取反：如果值为 True，取反后为 False，反之亦然。`and`和`or`用于将多个条件连接起来，产生一个单一的布尔值：对于`and`，仅当所有部分都为\
  \ True 时，结果才为 True；对于`or`，只要至少有一个部分为 True，结果即为 True。例如，`6 > 2 and 2 > 6` 结果为 False，而\
  \ `6 > 2 or 2 > 6` 结果为 True。\n\n这些是 Python 和 R 中最常用的运算符。还有其他一些不常用的运算符，包括位运算符，但你在数据科学中可能不需要用到它们。\n\
  \n### 程序控制流与迭代\n\n编程的一个重要方面是让代码按正确的顺序执行你的意图，并且经常需要重复执行某些操作。从微观层面看，运算顺序正体现了这一点，但更重要的是控制流功能。有两种常见的控制机制可以让你随心所欲地控制程序流程：if–else\
  \ 条件和循环。\n\n#### If–Else 块\n\nIf–else 结构允许你表达：如果条件成立，则执行一件事；否则，执行另一件事。你还可以嵌套这些结构，例如：如果条件一成立，做一件事；如果条件二成立，做另一件事；如果条件三成立，再做另一件不同的事；否则，做其他事。如果我们将这种逻辑详细描述出来，结果如表\
  \ 11-5 所示。这种书写方式被称为*伪代码*（不过通常你会有像右侧那样的实际值），它是一种类似于代码的写法，不特定于任何编程语言，但能清晰地表达正在发生的事情。\n\
  \n**表 11-5** 包含三个条件的 if–else 块框架\n\n| 流程概念 | 伪代码 |\n| --- | --- |\n| 如果条件 1 <br>那么执行操作\
  \ A <br>否则如果条件 2 <br>那么执行操作 B <br>否则如果条件 3 <br>那么执行操作 C <br>否则执行操作 D | `if var1\
  \ > 0` <br>`then print(\"positive\")` <br>`else if var1 == 0` <br>`then print(\"\
  zero\")` <br>`else if var1 < 0` <br>`then print(\"negative\")` <br>`else print(\"\
  something's wonky\")` |\n\n表 11-5 左侧的代码检查条件 1，如果条件 1 为真，则执行操作 A。否则，继续检查条件 2 是否为真，以此类推。请注意，这些块的工作方式是，一旦满足第一个条件就会“跳出”。如果条件\
  \ 1 满足，该块将执行操作 A，然后跳转到整个块之后的下一段代码，而不会再去检查条件 2。只有当条件 1、2、3 都不为真时，才会执行操作 D。右侧代码展示了当我们想要打印一个名为`var1`的数值变量的方向（正或负）时的流程。\n\
  \nPython 使用三个与 if–else 语句相关的关键字：`if`、`elif` 和 `else`。它使用冒号来引出每个条件。R 只使用 `if` 和 `else`，在必要时使用\
  \ `else if` 组合，并且需要使用花括号来划分不同的代码块。参见表 11-6，其中展示了表 11-5 中的代码在 Python 和 R 中的表现形式。你也可以在图\
  \ 11-2 的第 19 至 24 行看到 if–else 块的示例。\n\n**表 11-6** Python 和 R 中的 if–else 代码示例\n\n\
  | Python | R |\n| --- | --- |\n| ```python\nif var1 > 0:\n    print(\"positive\"\
  )\nelif var1 == 0:\n    print(\"zero\")\nelif var1 < 0:\n    print(\"negative\"\
  )\nelse:\n    print(\"something's wonky\")\n``` | ```r\nif (var1 > 0) {\n    print(\"\
  positive\")\n} else if (var1 == 0) {\n    print(\"zero\")\n} else if (var1 < 0)\
  \ {\n    print(\"negative\")\n} else {\n    print(\"something's wonky\")\n}\n```\
  \ |\n\n\n\n# 循环\n\n在代码中，我们经常需要重复执行某个操作，每次仅使用略有不同的值。这类操作通常不止是基础操作，但概念上相当简单，我们可以通过一个示例来观察：为几个不同的值打印一些数学计算结果。首先，让我们看看如图\
  \ 11-3 所示的伪代码。\n\n![](img/628533_1_En_11_Fig3_HTML.png)\n\n用于计算并打印 0 到 9 数字平方的 Python\
  \ 代码片段。该代码遍历每个数字，计算其平方，并以“The square of [number] is [square]”的格式打印结果。\n\n**图 11-3**\
  \ 一个简单 for 循环的伪代码，用于打印前十个数字的平方\n\n这里展示的循环类型是 *for 循环*，其基本结构是“对于值列表中的某个值”，循环运行的次数与列表中元素的数量相同，每次运行时，该值都取列表中的一个值。我们始终知道这种循环会运行多少次。\n\
  \n另一种循环类型是 *while 循环*，它会反复运行，直到预先定义的条件不再满足为止。其伪代码大致如图 11-4 所示。在这个例子中，我们从名为 `num`\
  \ 的变量开始，每次循环运行时增加其值，直到数字达到 10 才停止。只要 `while` 后面的条件为真，循环就会继续。此外，你也可以使用关键字 `break`\
  \ 在代码中的该点退出 while 循环。\n\n![](img/628533_1_En_11_Fig4_HTML.png)\n\n一段演示循环的伪代码片段。它将变量\
  \ `num` 初始化为 0。在 `num` 小于 10 的条件下循环继续。循环内部，通过将 `num` 乘以自身来计算 `num` 的平方，赋值给 `sq_num`，并打印语句\
  \ “The square of `num` is `sq_num`”。然后变量 `num` 递增 1。\n\n**图 11-4** 一个 while 循环的伪代码，用于打印前十个数字的平方\n\
  \n请注意，大多数程序员更倾向于使用 for 循环而非 while 循环，因为 while 循环很容易出现导致其永远运行的 bug（例如，如果在图 11-4 的例子中忘记将\
  \ `num` 增加 1，它将永远不会退出）。这显然很容易修复，但第一次运行带有这个 bug 的代码时仍然会很麻烦。\n\n## 伪代码与代码逐步执行\n\n\
  伪代码本质上是算法的步骤，是使用人类语言编写的代码。在你刚开始学习编程时，先用这种方式写出来通常非常有益，这样你就能理解其中的逻辑和流程。\n\n同时，记录伪代码每一步使用实际值时发生了什么也非常有用。例如，对图\
  \ 11-4 中的代码进行逐步执行，起始过程如下：\n\n| **num 的值** | **结果** |\n| --- | --- |\n| 0123456789\
  \ | 0 的平方是 0。1 的平方是 1。2 的平方是 4。3 的平方是 9。4 的平方是 16。5 的平方是 25。6 的平方是 36。7 的平方是 49。8\
  \ 的平方是 64。9 的平方是 81。 |\n\n这可以帮助你理解发生了什么，并发现问题，尤其是在处理更复杂的代码时。\n\nPython 有 `for` 循环和\
  \ `while` 循环。`for` 循环使用关键字 `for` 和 `in` 来设置，而 `while` 循环使用 `while`。R 语言有相同的关键字，但还有另一种类似于\
  \ `while` 循环的循环，它使用关键字 `repeat`。这种循环就像一个 `while` 循环，但它没有条件，只有在循环内部使用关键字 `break`\
  \ 时才会停止运行。因此，它总是运行到 `break` 关键字首次出现的位置。而 `while` 循环如果初始条件不满足，可能永远不会运行。参见表 11-7，其中展示了用于实现图\
  \ 11-3 中功能的 for 循环在 R 和 Python 中的代码示例。在 Python 中，获取从 0 到 9 每个数字列表的方法是 `range(10)`（不是\
  \ 1 到 10），所以你会在代码中看到它。在 R 语言中，你可以使用代码 `0:9` 获得相同的结果。\n\n**表 11-7** Python 和 R 中的\
  \ for 循环代码示例\n\n| **Python** | `for num in range(10):`    `sq_num = num * num` \
  \   `print(\"The square of \" + num + \" is \" + sq_num)` |\n| **R** | `for (num\
  \ in 0:9) {`    `sq_num <- num * num`    `print(paste(\"on the \", paste0(counter,`\
  \        `(\"The square of \", num, \" is \", sq_num, sep=\"\"))` `}` |\n\n表 11-8\
  \ 展示了使用 while 循环完成相同功能的代码。注意，在 Python 中，有一种给数字加 1 的简写方式：`num += 1`。\n\n**表 11-8**\
  \ Python 和 R 中的 while 循环代码示例\n\n| **Python** | `num = 0``while num < 10:`    `sq_num\
  \ = num * num`    `print(\"The square of \" + num + \" is \" + sq_num)`    `num\
  \ += 1` |\n| **R** | `num <- 1``while (num < 10) {`    `sq_num <- num * num`   \
  \ `print(paste(\"on the \", paste0(counter,`        `(\"The square of \", num, \"\
  \ is \", sq_num, sep=\"\"))`    `num <- num + 1``}` |\n\n你可以在图 11-2 的第 27–29 行和第\
  \ 32–35 行的 Python 示例代码中看到另一个 `for` 循环和 `while` 循环。\n\n## 函数\n\n到目前为止我们讨论的所有内容都适用于过程式编程，但引入函数将带我们进入函数式编程领域，并且如果我们反复执行相同或相似的任务，函数可以极大地改进代码。*函数*是一段完成特定任务的代码块，它可以接收变量并使用，也可以返回一个值。在不同的语言和上下文中，函数可能有不同的名称，包括方法、过程和子例程（这些术语并非完全同义，但在此节中足够相似）。函数被认为是可调用的，这意味着你定义它一次，然后通过在代码中包含其名称来稍后运行它。\n\
  \n一个函数有两个高级组成部分：函数定义和函数体。这些在不同语言中可能看起来不同，但第一行总是函数定义，并包含函数名称以及输入变量（如果需要的话）。输入变量被称为实参或形参。函数体从下一行缩进开始，或者包含在花括号（或其他符号）内。\n\
  \n函数可以很小——甚至只有一行——也可以长达数百行。通常，更短的函数更受欢迎，因为最佳实践是让一个函数主要做一件事（即使完成这一件事需要许多、许多步骤），而不是做几件不同的事情。当你调用\
  \ Python 或 R 语言原生函数或已安装的某个包中的函数时，你会广泛地使用函数。但你也会经常创建自己的函数，这是非常强大的能力。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n#### Python\n\nIn Python, a function is called a `function`, unless it’s used\
  \ in a specific context of object-oriented programming, but we don’t have to worry\
  \ about that just yet. They are defined using the keyword `def`, followed by the\
  \ function name and opening and closing parentheses, with the variables in the parentheses\
  \ if they are to be included when the function runs. The function in lines 38–40\
  \ of the code in Figure 11-2 is a simple one that returns a modified square of a\
  \ number. Line 38 is the definition, containing the keyword `def`, the function\
  \ name, an opening parenthesis, one parameter, a closing parenthesis, and a colon\
  \ that signals the definition is closed and indicates the function body is next.\
  \ The function body begins on the next line in Python. The first line calculates\
  \ the new value, and the last line returns the value with the keyword `return`.\
  \ We can call the function later with the function name followed by parentheses,\
  \ with the same variable order/sequence as in the function definition. The parentheses\
  \ are required regardless of whether a variable is passed. The call is shown in\
  \ line 42 of the example code in Figure 11-2, with the function name and a parameter\
  \ in parentheses. The parameter can be hard-coded values or variable names.\n\n\
  Python also has a less common type of function. You can use the keyword `lambda`\
  \ to define an anonymous function. This creates a block of code that works like\
  \ a function but is called only once where it is defined because it has no name.\
  \ One of the more common uses is to sort data in some nonstandard way. Suppose you\
  \ have a list of lists with two numbers (row number and height), such as `[[4, 60],\
  \ [8, 69], [3, 62], [1, 67], [2, 65], [9, 72]]`. If you called Python’s `sort()`\
  \ function on the whole list, it would be sorted as you might expect – by the first\
  \ number in each sublist for all two-element lists. But if we wanted it to be sorted\
  \ by the second number, we could create a simple `lambda` function in the call to\
  \ sort to instruct it to sort by the second number.\n\n## R\n\nFunctions in R are\
  \ similar to Python in the way they are defined and used, but they look a little\
  \ different. The `lopsided_square` function from the Python version in Figure 11-2\
  \ above is written in R and shown in Figure 11-5. In the definition, the name is\
  \ placed first, followed by the assignment operator, the keyword `function`, parentheses\
  \ with the parameter name, and finally a left curly brace that indicates the start\
  \ of the function definition. The function definition follows for two lines, and\
  \ it is closed with a right curly brace. R also uses the same keyword `return` as\
  \ Python to return values.\n\n![](img/628533_1_En_11_Fig5_HTML.png)\n\n> Code snippet\
  \ for defining a function in R programming language. The function is named `lopsided_square`\
  \ and accepts a single variable `var` as input. It calculates `var.square` by multiplying\
  \ `var` by itself and adding 1. The function returns `var.square`. Keywords: R,\
  \ function, variable, multiplication, return.\n\n**Figure 11-5**  \n> An example\
  \ function defined in R.\n\nIf we include `lopsided_square(3)` in the code, we will\
  \ get a return of 10.\n\n### Libraries and Packages\n\nAn important part of organizing\
  \ code in nearly all programming languages is through libraries and packages that\
  \ group code by purpose. In Python, the word *library* is sometimes used, but *package*\
  \ is usually preferred. The base installation of the language contains many default\
  \ packages, but you can install more. For example, while basic math is already included\
  \ in Python, there is a special package with more advanced math functions. There\
  \ are also many third-party packages available in data science code. To use these\
  \ types of packages in Python and R, they must first be imported.\n\n#### Python\n\
  \nIn Python, there are a couple of different ways to import packages. It is typical\
  \ to import at the top of the code. Packages contain classes or functions that you\
  \ want to use, and the method of import defines how you refer to those things later.\
  \ Table 11-9 shows different ways you could import a package called `Pandas` and\
  \ how to reference a function from it with that import.\n\n**Table 11-9**  \n> Common\
  \ ways to import packages in Python\n\n| 包导入语句 | 从包中调用函数 |\n| --- | --- |\n| `import\
  \ pandas` | `pandas.to_csv()` |\n| `from pandas import to_csv` | `to_csv()` |\n\
  | `import pandas as pd` | `pd.to_csv()` |\n\nHow you refer to an imported package\
  \ relates to a concept called a namespace, which defines the hierarchy in which\
  \ variables and other names are applied. The first way is the most basic, and the\
  \ third way is the same except you create an alias, `pd`, for the `pandas` package.\
  \ When you want to call functions or reference classes from a package imported in\
  \ one of these two ways, you must preface the function or item with the package\
  \ name (or alias) and a dot. As shown in the second column of the table. So, the\
  \ second method is sometimes convenient because you don’t have to specify the package\
  \ every time you call a function from it, but it has drawbacks. If you use the second\
  \ method and wrote your own function called `to_csv()`, you couldn’t use both functions\
  \ – whichever is defined last is the one that would actually be called. This can\
  \ be confusing. `Pandas` is a critical package in data science, and the regular\
  \ way to import it is the third method, with the alias `pd`.\n\n## R\n\nIn R, there\
  \ are a few key ways to import packages. The first is to use the `library()` function,\
  \ and the second is to use the `import` package. There can be namespace challenges\
  \ in R as well. By default, all functions in a package are available directly by\
  \ their function name, but you can also reference a function from a particular package\
  \ by using the package name followed by two colons. See Table 11-10 for sample imports.\n\
  \n**Table 11-10**  \n> Common ways to import packages in R\n\n| 包导入语句 | 从包中调用函数\
  \ |\n| --- | --- |\n| `library(dplyr)` | `filter()` 或 `dplyr::filter()` |\n| `import::from(dplyr,\
  \ select, filter)` | `filter()` |\n| `import::from(dplyr, select, dplyr_filter =\
  \ filter)` | `dplyr_filter()` |\n\nThe first method is the most common, and you\
  \ can either refer to a function directly by its name, or you can specify the package\
  \ name as shown. The second method is similar, but it imports only the specified\
  \ functions (in this example, `select` and `filter` from the `dplyr` package). The\
  \ third method allows you to rename specific functions, which can be important when\
  \ different packages have the same function names. In the third case, `select` is\
  \ imported normally, but the package function `filter` is given the alias `dplyr_filter`.\
  \ There are more ways to specify which functions are imported; you can look up the\
  \ online R documentation for more details.\n\n\n\n### 组织与格式\n\n代码的组织方式和风格多种多样，观点也层出不穷。有些观点涉及注释。我曾与一位同事共事，他坚持认为，在写得很好的\
  \ Python 代码中不需要注释，因为代码本身已经非常易读。我不同意这种观点，但确实不必为所做的每一件事都加上注释。对于许多程序员（尤其是 Pythonistas）来说，代码的外观很重要。目标是让代码尽可能易读，这通常意味着适当的空白和偶尔的注释。在\
  \ R 语言中，花括号用于定义不同的代码块，通常左花括号位于代码块的第一行，右花括号则单独位于代码块的末尾一行。Python 不使用像花括号这样的代码块封闭符，而是用冒号标记一个块，并依靠缩进来定义代码所属的块。下面我将介绍一些已发布的\
  \ Python 和 R 语言风格指南。\n\n### 错误处理\n\n通用编程的一个重要部分是恰当地处理代码中的错误，尤其是在代码投入生产或需要被其他人运行时。当你编写的代码将在团队内或其他程序员之间共享时，后一点尤其重要。如果你只是编写\
  \ Notebooks 来运行自己的数据科学分析，则无需特别处理代码中的错误，因为你自己会看到错误并立即进行适当的修正。\n\n但设想一下，你创建了一个函数，它位于一个核心代码位置，供人们对某个值进行特定的转换。他们会导入你的函数并运行它，而无需了解其内部代码——但如果你做得对，用户凭借你优秀的文档就会确切知道如何使用该函数。假设该函数需要几个参数，并应返回一个转换后的数字。然而，如果函数内部出现问题并产生错误，用户将无法对函数内部进行故障排查——他们甚至可能看不到函数内部。因此，你需要预见可能出现的错误类型，捕获它们，并向用户返回有意义的错误消息。常见的会引发错误的场景包括除以`0`或提供错误的数据类型。在\
  \ R 和 Python 中都有很好的错误处理方式，如果你开始编写需要此功能的代码，就可以学习这些方法。\n\n### 安全性\n\n程序员并不总是会考虑到安全性。虽然与编写代码直接相关的隐私或伦理问题不多，但编写的代码可能存在安全性不足的问题。对于只处理内部系统的数据科学家来说，这通常不是什么大问题，但如果你通过将系统投入生产或创建\
  \ API（应用程序编程接口，一种在你的网络上运行并允许其他代码查询它的软件，你的代码会生成响应并发送回去）将代码暴露到互联网上，这就很重要了。\n\n程序员应该关注的一些安全领域包括：身份验证、加密、错误处理、输入验证、输出验证以及第三方包的选择。我们已经在第\
  \ 8 章讨论过身份验证和加密，但这里的关键是确保在必要时进行身份验证，并在代码中正确设置，以及在必要时包含加密。输入验证和输出验证对于确保不会引发任何不良行为至关重要。一种常见的网络攻击称为\
  \ SQL 注入，即有人在填写表单时，在文本框中放入 SQL 代码（比如请求用户名的字段，或者任何其他字段）。如果攻击者编写了能删除数据库中所有表的代码，并且文本框没有进行任何输入验证，那么这段\
  \ SQL 代码就可能在该系统的数据库中执行。输入验证可以阻止这种情况。输出验证则确保没有代码或其他问题结果会导致网页浏览器渲染错误或显示冒犯性图像等。我之前提到过错误处理，它可以与输入和输出验证结合使用，以处理检测到的问题。我还提到了包的选择，因为像\
  \ R 和 Python 这样的开源语言的一个美好之处在于，任何人都可以创建并分享一个包。但这并非总是阳光与彩虹，因为可能会发布有不良意图（无论是有意还是无意）的包，不过它们最终会暴露出来。因此，建议坚持使用成熟的包，而不是贸然使用全新的包。\n\
  \n\n\n# 数据科学编程\n\n在大多数数据科学和统计编程中，最具标志性的事物就是数据框，它是分别在 `R` 语言中和 `Python` 语言下使用 `Pandas`\
  \ 来存储表格数据的基本结构。数据框在 `R` 中实际上是一种内置数据类型，但在 `Python` 中，我们必须使用一个名为 `Pandas` 的包，它为我们提供了类似\
  \ `R` 语言的功能。\n\n数据框以便捷且有意义的方式存储表格数据。表 11-11 展示了一个典型的数据框。\n\n**表 11-11 示例数据框**\n\n\
