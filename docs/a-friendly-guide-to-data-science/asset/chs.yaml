  请注意，元数据可以与数据存储在同一张表中——只要在现实意义上合理，数据和元数据可以共存。你在数据库中看到的其他一些常见元数据包括记录创建的时间戳、记录修改的时间戳以及记录的创建者。并非所有时间戳都是元数据。如果我们在收银机上记录一笔销售交易的时间，该时间戳就不是元数据，因为它代表的是现实世界中发生的事情——销售本身。但在该交易行的“最后更新”时间戳（表示该行最近一次以某种方式被修改的时间）则是元数据。例如，假设该行包含一个指向已生成
  PDF 发票的链接，并且每天夜间运行一个进程，将文件大小添加到该行，并用执行操作的时间修改最后更新列。这是关于该表某行数据的数据，与实际交易本身没有直接关系。


