- '# 原始数据与衍生数据


  除期刊文章示例外，我们目前讨论的数据均为*原始*数据——即关于现实世界某事物的直接事实。这些数据可输入计算机并以某种形式存储，但仍然只是直接反映现实世界的数据。我们常说的*衍生*数据，则是指以某种方式源于其他数据的数据。


  在数据科学中，衍生新数据拥有极其强大的能力且至关重要。两种常见的衍生数据方式是*聚合*与*交互*。在结构化数据中，聚合是对某一列跨行执行操作：例如，我们可以计算按性别分组的*平均*身高。表
  1-10 展示了按身高聚合的数据。


  **表 1-10**


  按性别分组的平均身高聚合数据


  | 性别 | 平均身高（英寸） |

  | --- | --- |

  | 女性 | 65 |

  | 男性 | 69 |

  | 非二元性别 | 67 |


  交互则是对一行跨列执行操作：在科学论文数据集中，将空字段填充为 0 后，我们可以创建一个名为 `Intro Conclusion Sum` 的新列，即引言部分长度与结论部分长度的*总和*。表
  1-11 展示了包含交互变量的表格。


  **表 1-11**


  含交互变量的期刊文章章节长度表


  | 论文编号 | 引言 | 方法 | 结论 | 受试者 | 过程 | 摘要 | 引言与结论总和 |

  | --- | --- | --- | --- | --- | --- | --- | --- |

  | 1 | 100 | 250 | 250 | 0 | 0 | 0 | 350 |

  | 2 | 110 | 400 | 150 | 0 | 0 | 0 | 260 |

  | 3 | 75 | 350 | 320 | 0 | 0 | 0 | 395 |

  | 4 | 55 | 90 | 150 | 0 | 0 | 0 | 205 |

  | 5 | 85 | 0 | 125 | 230 | 100 | 0 | 210 |

  | 6 | 170 | 350 | 0 | 0 | 0 | 325 | 170 |


  当我们沿着表 1-11 的每一行移动时，很容易就能将引言列与结论列相加。由于已将空值替换为 0，这变成了一个简单的任务。


  **关于缺失数据的更多说明**


  如果我们保留空单元格而不填入 0，操作起来就不会这么明确。空不等于 0——它通常意味着未知，即实际上可能是一个非 0 的数字，只是未被正确记录。请务必牢记，数据本身并不会告诉你空值意味着什么，尽管人类可能会觉得“显而易见”。在数据库系统中，空值（称为*空值*）可能会严重干扰计算，因为它们缺少人类判断何时应替换为
  0、忽略该数据点或采取其他措施的直觉。在很多情况下，对 100 和 `null` 进行求和会得到 `null`，因为数据库系统无法得知 `null` 代表什么。


  尽管交互常以新列的形式记录在原始数据集中，但聚合则会创建一个全新的数据集。该数据集的列通常与原始表格数据不同，行更是几乎完全不同。例如，在表 1-10 中按性别分组的平均身高聚合值里，仅有的列是性别和身高，而非原始表中的姓名、身高、体重、年龄、性别、T
  恤尺码和是否参加体育运动。这些数据集存储的是两类不同事物——一个是对单个患者的表示，另一个是对患者群体属性的表示。


  '
- '# 元数据


  我之前已经提到过元数据，即描述其他数据的数据。它在数据领域可能非常重要。


  **元数据**


  “元”这个词常被随意使用，通常指对某种体验或事实有更高层次的认知。它在数据领域具有相同的含义——关于数据的数据，或者关于数据所代表信息的数据。


  在很多方面，某样东西是元数据还是普通数据并不重要。两者都可用于数据科学。例如，假设你收集了一部电影上映一周内所有提及它的推文，因为你很想知道人们在说什么。与这些推文相关的数据中，大部分会被视为元数据，比如话题标签、推文时间戳、发布者的用户名和
  IP 地址所在地，还有你通过自动语义分析得出的代表*情感*（帖子的正面或负面程度）的评分。大多数人会认为推文文本是数据，而其他一切都是元数据。但如果你正在研究话题标签及其相关的情感，你可能就会专注于此，甚至都不直接查看推文。


  关于媒体的数据是最常见的元数据之一。表 1-12 展示了不同媒体类型常见的元数据（绝非完整列表）。


  **表 1-12**


  不同媒体类型对应的元数据字段


  | 电影 | 电子游戏 | 歌曲 | 书籍 | 艺术品 |

  | --- | --- | --- | --- | --- |

