  \n**从业年限：** 5 年数据相关岗位经验\n\n**教育背景：**\n\n-   \b学校心理学硕士\n-   \b心理学学士\n-   \b文科副学士\n\
  \n*此处表达的观点仅代表辛迪个人，与她过去或现在的任何雇主无关。*\n\n### 背景\n\n辛迪·查瓦里亚是家庭中的第一代大学生，在她上大学时，她并没有接触到很多职业选择。她第一次为了心理学学位而学习统计课程时，感觉自己完全不知道在学什么，最终不得不重修。第二次修读时，她决心不再挂科，并找了一位导师，然后几乎像魔法一样的事情发生了——这位导师非常出色，辛迪第一次理解了统计学，并发现自己爱上了它。从那时起，她寻求机会，并找到了帮助她发展技能的导师。她曾与一位研究人员合作，甚至在本科期间就发表了自己的第一篇论文。她继续攻读研究生，但发现她的课程并不像她希望的那样以研究为导向，不过她找到了另一份与一位研究人员合作的短期工作，并因此在为该研究人员做统计分析方面获得了更多经验。她开始在课堂上学习`R`语言。完成学位后，她便进入了职场。\n\
  \n## 工作\n\n完成这个学位后，她知道她想从事研究类的工作，并且希望自己能处在一个能够帮助他人的位置上。就业市场很艰难，但她最终在一家非营利组织找到了一份结合数据分析和数据管理的工作。她很喜欢这份工作，但很快便想扩展自己的技术经验，转向商业智能岗位。在那个岗位上，她做的数据分析工作并没有自己希望的那么多，但她获得了使用不同工具的宝贵经验，并对自己真正喜欢做的工作有了更多了解，这将影响她整个职业生涯。\n\
  \n### 精彩语录\n\n**工作中最喜欢的部分：** 辛迪喜欢与公司内的一个团队合作，该团队正试图转向真正基于数据做决策。他们在自己的领域寻求数据并进行数据分析，并且会听取她得出的发现。这让她意识到自己对规范性分析感兴趣。\n\
  \n**工作中最不喜欢的部分：** 会议，太多的会议本可以通过一封邮件解决。这是企业界一个真实存在的问题。\n\n**最喜欢的项目：** 她做了一项相当简单的统计检验，结果表明某个特定项目的结果并不显著，这促使他们深入探究原因。在这个过程中，他们发现该项目中的许多参与者并不愿意参与其中。在调整了项目并专注于那些确实想参与的人之后，他们发现结果变得显著了，这让人非常欣慰。\n\
  \n**教育如何与现实世界联系：** 现实世界中没有什么是像学校里那样整洁有序的。她特别发现，在现实世界中，非参数统计的使用频率要高得多，因为许多漂亮的统计分布在现实世界中并不像在统计教科书中那么常见。\n\
  \n**最常使用的技能：** 总的来说是软技能——她必须易于合作，并为自己及自己的工作赢得人们的信任。\n\n**目前主要使用的工具：** 主要是`SQL`和`Excel`，偶尔使用`Power\
  \ BI`和`R`\n\n**数据分析和数据科学的未来：** 快速变化将持续下去，并且事物正变得越来越专业化。\n\n**优秀数据分析师的特质：** 耐心、良好的社交技巧和好奇心。因为你要与来自不同背景和技能水平的人合作，懂得如何与人交谈会很有帮助。好奇心以及“只管试试”的态度对于学习和解决问题非常重要。你不能让对未知的恐惧阻碍自己。\n\
  \n**她对未来数据分析师和数据科学家的建议：** 这适用于每个人，但特别是女孩和女性，不要让恐惧和竞争阻碍你学习和实现自己的目标。如果有人告诉你学不会某样东西，那就用行动证明他们是错的。\n\
  \n*辛迪是一名数据科学家和商业智能开发者，在包括健康和医疗在内的多个领域拥有经验。*\n\n"
- "# 3. 奠定成功基础：推断性统计框架与实验\n\n## 引言\n\n我们知道统计学是一个多年来发展迅速的领域，但二十世纪是现代统计学取得巨大进展的时期。其中一些最大的发展发生在推断性统计领域，你可以从一个大的总体中选取一个子集（样本），对这个子集进行一些数学运算，然后将结果推广到更大的总体。这对于许多无法测量每一个单一事物的领域来说至关重要。概率、抽样和实验设计对于实现良好的推断都至关重要。19\
  \ 世纪末和 20 世纪初所做的工作为我们在计算机时代处理数据奠定了基础。\n\n本章将首先深入探讨现代统计学的一些历史，并给出一些统计学在现实生活中的有趣例子。我将介绍计数方法（这对理解概率至关重要）以及概率论。然后，我将介绍几种在统计学中广泛使用的重要概率分布。在讨论抽样（即选择数据）之前，我会简要解释中心极限定理，最后介绍实验设计。\n\
  \n\n\n### 现代统计学史：第一部分\n\n二十世纪见证了概率论与统计学的最终融合，科学家们将数学形式化，创立了现代数理统计学。统计学广泛渗透到众多领域：社会科学、经济学、物理学、化学等。遗憾的是，二十世纪早期的统计学工作因许多统计学家与优生学（eugenics）的关联而蒙上污点。优生学是一种已被彻底揭穿的伪科学，它推动了纳粹主义以及本世纪头几十年中大量种族主义、性别歧视和体能歧视政策——其中许多至今仍在延续。优生学家运用统计学和科学的语言，推动并支持了这些政策的制定，以及强制绝育等不人道行为。\n\
  \n将种族主义及其他“主义”包裹在科学的外衣下，意味着一些人至今仍相信优生学的信条。另一些人则疑惑，如果优生学并非真知灼见，像统计学这样美好的事物又何以从中诞生？但你需要记住的是，大量科学和哲学的发展恰恰源于炼金术的徒劳探索以及试图证明上帝存在的尝试。二十世纪早期统计学真正革命性的是方法、技术及其所依托的数学基础。这些方法可应用于任何领域，包括基于恶劣前提的研究以及设计得当的实验。\n\
  \n二十世纪初的统计学家成果丰硕，发展了我们之前讨论过的大量描述性统计，以及重要概念如概率分布——它既可描述数据，也可用于推断。统计学家惊讶地发现，许多可测量的事物都符合正态分布（也称钟形曲线），但绝非所有事物。随着世纪推移，人们又发现了若干其他分布。\n\
  \n现代统计学家开发了审视实验设计的新方法，并改进了部分已有的实验设置方式，这在今天仍然极其重要。实验设计几乎影响着所有科学、医学和社会科学学科。\n\n二十世纪发生的另一变化是看待概率的全新范式。早期，统计学家常像现代贝叶斯学派那样看待概率——他们基本认为，概率量化的是某事物可被相信的程度，这种相信基于基本信念、假设或先前实验的结果。这意味着在最终的概率计算中，会包含一个先验概率。\n\
  \n但当时统计学界的“大人物”们摒弃了这一范式，转而支持后来被称为频率学派（frequentist）的范式。频率学派认为，在计算中包含先验（即初始状态的附加概率）会损害任何概率计算的严谨性。如今仍有贝叶斯统计学家，也有部分基于贝叶斯原理的机器学习技术。一些统计学家还青睐其他范式。基本上，尽管大多数统计学家属于频率学派阵营，但范式的选择仍可能让他们血压升高，有些人认为不同情境需要不同的范式。\n\
  \n### 贝叶斯概率与贝叶斯定理\n\n贝叶斯概率与频率学派的主要区别在于：频率学派认为概率来自对所有可能结果的计数（他们关注事件发生的频率），而贝叶斯学派认为概率是一种“合理预期”——即某人量化了一种信念（例如，某特定视频游戏玩家有\
  \ 80%的几率赢得下一局比赛），或基于频率以外的知识量化了某种事物。本章后面我们会更详细地了解频率学派方法，这里我仅简要谈谈贝叶斯范式。\n\n贝叶斯定理是贝叶斯概率的一部分，是确定条件概率（具体来说，即后验概率）的一种方法。*后验概率*\
  \ 本质上是指在事件 B 已发生的前提下，事件 A 发生的概率。它依赖于三个已计算出的概率：事件 A 发生的概率、事件 B 发生的概率，以及*先验概率*——即已知事件\
  \ A 发生的前提下事件 B 发生的概率。先验概率正是频率学派有所诟病之处，因为它可能基于信念而非严格计算——它与实验运行前发生的事件相关联。然后你可以将这些值代入公式，得到后验概率。它本质上允许你根据新信息更新概率。\n\
  \n请注意，在数据科学中使用贝叶斯定理，你不必是铁杆的贝叶斯学派——我们关心的是使用有效的方法，无论它们是否完美地代表现实世界。\n\n现代统计学的最后一个重要领域是抽样。在一次广为人知的失败案例后，随机抽样的重要性变得清晰：1936\
  \ 年美国大选中，某家主流杂志基于其严重偏向共和党的读者样本，预测了错误的获胜者。在过去一个多世纪里，抽样方法得到了极大改进，如今从事调查和民意测验的正派人士知道如何选取具代表性的样本。\n\
  \n现代统计学关乎严谨与合理规划，但达到今天这样良好的局面，花费了相当长的时间。\n\n### 现实世界中的统计学示例\n\n\n\n### 示例 1：点数问题\n\
  \n我们著名的数学家费马和帕斯卡的“点数问题”是一个特定场景，涉及一场骰子游戏的中断。游戏中，两名玩家将相同金额的钱投入奖池，然后轮流掷骰子，直到其中一人先达到预定的获胜次数（即掷出最大点数）。他们会记录各自获胜的次数，率先达到指定次数者赢得整局游戏。你可以想象这样一局游戏：费马赢了六轮，帕斯卡赢了四轮，目标获胜次数是十次。如果游戏继续下去，一切都会很顺利：帕斯卡后来居上，在费马停留在八次时赢下了第十次。帕斯卡带着笑容，拿走了全部赌注。\n\
  \n但如果游戏被中断了呢？比如蜡烛熄灭了。这时应该怎样合理分配赌注呢？一个显而易见的答案可能是根据各自获胜的比例——在上述情景中，费马应得 60%的赌注，帕斯卡得\
  \ 40%。十七世纪的数学家们相当确定这个答案不正确。在费马与帕斯卡的通信中，费马阐述了公平的解决方案、解释和所有细节。在碰运气的游戏中，重要的不是已经发生了什么，而是未来*可能*发生什么。因此，仅根据先前掷骰的结果来分赌注，并没有考虑到游戏可能结束的所有方式——比如帕斯卡后来居上获胜。但是，该如何模拟这许多种可能的未来呢？\n\
  \n另一位数学家已经指出，需要计算的是每位玩家可能获胜的不同方式的数量。帕斯卡首先尝试解决这个问题，并部分基于他著名的“帕斯卡三角形”得出了一个可能的解法，他将其寄给朋友费马，希望获得数学上的第二意见。但费马天赋异禀，几乎毫不费力就想出了一个更简单的解法。他们通信的大部分内容，都是费马试图让帕斯卡理解这个解法，而帕斯卡理解之后，通过简化某些步骤改进了这个方法。\n\
  \n这个解法有点复杂，但一个关键点是理解，从他们采用的视角来看，一个目标为 10 次、比分 6-4 的游戏，与一个目标为 20 次、比分 16-14 的游戏是等价的。在这两种游戏中，每位玩家获胜的可能方式数量是相同的：玩家\
  \ 1 还需 4 胜，玩家 2 还需 6 胜。这就变成了一个统计所有可能结果的问题，其中违反直觉的一点是，费马的方法需要计入那些因为某位玩家已经达到获胜目标而实际上不会发生的情况。统计从认识这一点开始：游戏会在已知的回合数内结束——即每位玩家所需获胜次数之和减\
  \ 1，在本例中为 6 + 4 – 1 = 9 轮。用 2 的该计算次数次方来计算可能结果的总数。然后，计算每位玩家获胜的可能方式数量，并除以总数，得出的比例就是每位玩家应得的赌注份额。\n\
  \n如果你觉得这很难理解，别担心——历史上最优秀的数学家之一也曾觉得难。本章最后一节将讨论计数问题，因为它对于我们在下一章要学习的概率论和推断统计至关重要。\n\
  \n### 示例 2：职业赌博\n\n扑克牌历史源远流长，但在近几十年，它已成为一项观赏性运动，并成为少数职业赌徒的职业，像“扑克小子”和“扑克顽童”这样绰号的著名玩家经常赢得数十万美元。所有赌博都建立在“战胜赔率”的基础上，大多数赌徒在有获得回报的可能时喜欢承担一些风险。但职业玩家的玩法比这更聪明。\n\
  \n职业赌徒掌握的信息不完整，因此他们处理的是确定概率、期望值和波动性。*期望值*基本上是在一组可能结果中最可能的值，通常类似于均值。它的计算方法是，考虑所有可能结果及其可能性，然后求和。玩家寻找的是期望值大于\
  \ 0 的游戏，这样如果他们多次参与，总体上就能取得领先。但期望值只给出了基于结果基本可能性的结果。在现实世界中，结果波动很大。在抛硬币游戏中，玩家不会恰好有一半的几率获胜。波动性有助于量化这种变异性，因为它就是标准差，所以它能让人了解实际值的分散程度。波动性越高，损失的风险越大，但如果赢了，收益也更大。\n\
  \n但在赌场赌博的陷阱在于，游戏的设置通常至少是（如果不是大幅）对赌场有利的。因此，在纯粹靠运气的游戏中，玩家的期望值将小于 0。这是扑克如此受欢迎的原因之一——运气显然扮演着重要角色，但策略和心理学也至关重要。扑克在一定程度上是一场心理战。对于牌桌上的每位扑克玩家来说，其他所有玩家都在同一条船上，运气决定了他们拿到什么牌，但好的策略、准确的读人能力以及令人信服的诈唬意味着，玩家可以在牌不好时最小化损失，在牌好时最大化收益。\n\
  \n尽管世界扑克系列赛之类的比赛很受欢迎，但只有极少数玩家能通过打扑克赚钱，而这些玩家中又只有一小部分能赚大钱。而且，因为打扑克取胜需要高超的技巧，玩家必须学习和练习才能持续获胜。对大多数人来说，这可能不是最明智的职业选择，但它很适合拍成电视节目。\n\
  \n## 推断统计的术语与符号\n\n在学习推断统计时，可能会让人困惑的一点是符号和术语。在推断统计中，我们通常会考虑两个群体。第一个是*总体*，即我们感兴趣并想了解的“全部对象”，而我们没有（也无法获得）其所有值。第二个是*样本*数据集，它是总体的一部分，我们（至少在理论上）可以获得其值。核心思想是，你可以利用所拥有样本的特征来推断总体，同时认识到你的推断估计中会存在一些误差。\n\
  \n在统计学和数据科学中，我们不断地讨论变量，尽管它们可能有不同的名称。*变量*就是可以用某种方式测量、量化或描述的事物。*因变量*，也称为*结果变量*，是我们关注结果中的对象。如果我们想比较一次在线广告活动的结果，我们可能会测量两个不同广告的总点击量——点击量是因变量，因为它取决于之前发生的所有事情。*自变量*，也称为*预测变量*，是影响结果（即因变量的值）的变量。在这种情况下，广告投放位置和设计属性就是自变量。变量之间的依赖关系在于，因变量取决于自变量的值，而自变量之间应相互独立。\n\
  \n我们还需要习惯这些符号。惯例是使用希腊字母和其他特定字母（有时带变音符号）来表示特定事物，总体趋势是使用拉丁字母表示样本参数，使用希腊字母表示总体参数。表\
  \ 3-1 展示了一些符号的例子。\n\n**表 3-1**  \n推断统计中的符号\n\n| 指标 | 符号 | 读法 |\n| --- | --- | ---\
  \ |\n| 样本均值 | `x̄` | x bar |\n| 总体均值 | `μ` | 缪 |\n| 样本标准差 | `s` | S |\n| 总体标准差 |\
  \ `σ` | 西格玛 |\n\n\n\n"
- '# 基础概率


  大多数人对概率的了解足以明白它处理的是特定事件发生的可能性，并帮助我们理解风险。但其内涵远不止于此，概率的各个方面构成了数据科学家日常使用的统计技术的基础。


  ## 概率论


  概率论中有几个概念依赖于我们将在本文中定义的特定术语。


  在日常用法中，事件就是指发生的事情，但在概率论中，它是相对于试验来定义的。*试验*可以被视为一次单一的尝试、一次游戏或产生某种结果的某一轮操作。例如，在掷骰子游戏中，每一轮游戏都涉及玩家掷骰子以产生一个结果。这个试验就是掷骰子，而结果——骰子数字的组合——被称为*事件*，即所发生的结果或事情。


  我们将所有可能的结果称为*样本空间*。样本空间取决于我们实际追踪的内容。在掷两个骰子以求总和的场景中，总和是我们关心的结果（而不是骰子上的两个具体数字）。因此，所有可能的和构成了样本空间，尽管有多种方式可以得到其中许多和。


  举例来说，想象帕斯卡在试验 1 中掷了两个骰子，得到 3 和 4，总和为 7。费马在试验 2 中掷骰子，得到 1 和 6，总和也是 7。这两个事件是相同的，尽管它们实现的方式不同。这个游戏的样本空间是
  2 到 12 之间（含）的所有数字，但它们的可能性并不相等——得到 7 比得到 2 容易得多。


  另一个需要理解的重要术语是独立性。如果一次试验的结果不会影响另一次试验的结果，我们就称这些试验是*独立的*。这对于我们讨论的骰子游戏是成立的，但通过一个试验不独立的例子可能会更清楚。假设有一个游戏，如果玩家掷出了
  6，那么他们的下一次掷骰结果会翻倍。在这种情况下，第二次掷骰（试验）就不独立于前一次试验。


  与独立性相关的一个概念是独立同分布变量，简称为 `iid` 变量。*iid 变量*是指彼此独立且在概率上完全相同的变量。在一个掷六个骰子并尽可能多得到 6 点的游戏中，每个骰子代表一个单一变量，且每个骰子有六分之一的机会得到
  6 点。所以这些就是 `iid` 变量。


  另一组对概率重要的概念来自*集合论*，也就是维恩图背后的数学。在集合论中，事件的*并集*意味着至少满足一个条件。*交集*意味着所有条件都满足。*补集*则是所需条件的反面。


  假设我们关心一次试验中两个骰子的具体点数。我们关注实际的配置，不同的配置有不同的赔付。假设玩家如果掷出两个偶数（称此为事件 A）就能获得投入金额一半的赔付，而如果掷出两个
  5 或两个 6（称此为事件 B）就能获得一次免费的第二轮掷骰。这些事件的并集就是 A、B 或两者都发生的情况，即所有掷出两个偶数或两个 5 的情况（两个 6 的情况同时属于两个事件）。这些事件的交集就是仅两个
  6 的情况。最后，事件 B 的补集是所有不是两个 5 或两个 6 的掷骰结果，而事件 A 的补集是任何至少包含一个奇数的掷骰结果。


  ## 计数、排列与组合


  正如我们在分点问题中看到的，计数在几个世纪前就被认为是计算概率的基础。我们必须找出所有可能的结果以及特定结果可能发生的不同方式。这是计算事物可能性的基础，但计数并不总是听起来那么简单，尤其是在可能性数量激增的时候。


  通常，直观地列出所有可能的组合是很有帮助的。例如，我们可能掷两个骰子并求和。样本空间是 2 到 12 之间的每个数字，但某些和比其他和更可能出现。表 3-2 展示了列出所有不同骰子投掷结果的一种方式。


  **表 3-2** 双骰子求和游戏结果


  | 和 | 组合方式 | 得到该和的方式数 |

  | --- | --- | --- |

  | 2 | 1+1 | 1 |

  | 3 | 1+2 | 1 |

  | 4 | 1+3, 2+2 | 2 |

  | 5 | 1+4, 2+3 | 2 |

  | 6 | 1+5, 2+4, 3+3 | 3 |

  | 7 | 1+6, 2+5, 3+4 | 3 |

  | 8 | 2+6, 3+5, 4+4 | 3 |

  | 9 | 3+6, 4+5 | 2 |

  | 10 | 4+6, 5+5 | 2 |

  | 11 | 5+6 | 1 |

  | 12 | 6+6 | 1 |


  初看之下，这似乎没问题，但我们遗漏了一项重要事实——除了和是 2 和 12 的情况外，其他所有和都可以通过多种方式得到，因为你有两个不同的骰子。如果你想要得到和为
  3，你可以通过骰子 1 是 1 且骰子 2 是 2，或者反过来（骰子 1 是 2 且骰子 2 是 1）来实现。这实际上是两种不同的结果。事实证明，在双骰子求和游戏中计算不同可能性的数量很简单：骰子
  1 有 6 种可能值，而每种可能值对应骰子 2 的 6 种可能值，所以总共是 36 种（骰子 1 的 6 个值 * 骰子 2 的 6 个值）。


  但我们可以修改游戏规则，使得如果第二个骰子与第一个相同，就自动重掷直到掷出不同的数字（这类似于彩票抽奖）。在这种情况下，第一个骰子仍然可以是任何数字，但骰子 2
  只有 5 种可能值，所以是 6 * 5 = 30。想象再加入第三个掷骰，且同样不能与之前重复。那就是 6 * 5 * 4 = 120。我们在这里计算的也称为*排列*，是一种在有`n`个可能值中选择`k`个事物的方式，其中顺序重要且值不能重复。


  还有一个相关的计算称为*组合*，它与排列类似，但顺序不重要。这通常被表述为“从`n`个中选`k`个”。假设有一个篮子，里面装有五个球，每个颜色不同。组合会告诉你如果伸手一次抓出三个球，有多少种可能的结果。在这种情况下，我们不关心哪个球先被取出，因为这只是一次选择动作（而不是先掷一个骰子再掷另一个）。这里，就是从
  5 个中选 3 个，结果为 10。这远小于排列的数量（5 * 4 * 3 = 60）。


  既然我们已经完成了所有这些计数，你可能会问这到底有什么意义。计数对于计算概率至关重要。在彩色球的例子中，当你一次抓出三个球时，其中一个是蓝球、一个是红球、另一个是黄球的概率是多少？由于每种颜色只有一个，因此只有一种方式实现，所以分子是
  1，分母是我们上面计算出的总组合数 10，因此概率是 0.1。在这个例子中，每一种特定的组合都是唯一的，所以每一组球出现的概率相等。但如果你问的是，你抓出两个原色（红、蓝、黄）和一个间色（这个篮子里只有绿色和紫色）的概率是多少呢？如果我们计算有两个原色的方式数，那是
  3（红+蓝、红+黄或蓝+黄）。对于每一对原色，间色球都有两种可能的值，所以满足我们要求的结果数为简单的 3 * 2 计算，从而概率为 6/10，即 0.6。


  无论你是用组合还是排列来得到可能性总数，概率的计算方法总是：满足条件的选择数除以物品可被选择的总方式数。选择正确计数方法的直觉需要经过练习才能获得。




  ### 附加示例：蒙提霍尔问题


  概率论中最著名的误解之一，出自一档名为《*我们来做个交易*》的电视游戏节目，主持人蒙提·霍尔正是该问题的命名来源。节目中，参赛者会看到三扇门，每扇门后都藏着东西——一扇门后是汽车这样的奖品，另外两扇门后则是没人想要的羊。参赛者选择一扇门后，霍尔会打开另外两扇门中的一扇，露出一只可怜的羊（显然他会选有羊的那扇，如果有汽车则不会开）。在真实游戏中，霍尔不会给参赛者换门的机会，但在重新构思的蒙提霍尔问题中，他给了这个机会。参赛者可以选择坚持最初的选择，或者换到另一扇未打开的门。大多数人的直觉是，从概率上看，换不换门无所谓。


  但在 1990 年，一位统计学家在一本杂志上提出了这个问题，并给出了一个令所有人震惊的答案，包括那些傲慢到拒绝相信的统计学家和数学家。她的答案是：参赛者应该换门，因为换门获胜的概率是三分之二，而不换门只有三分之一。这个故事引起了轰动，一万人（显然包括一千名学者）写信给杂志社说这个答案是错的。


  如果你留心观察，可能会发现一些问题：概率似乎会根据新信息而变化，这看起来是贝叶斯统计的范畴；但事实上，概率并没有变化，这可以用频率学派规则来解释。那么，这究竟是怎么回事呢？


  当三扇门都未打开时，每扇门后有汽车的概率恰好是 1/3。参赛者选了一扇门后，这个概率不会改变。他选的门有三分之一的可能性是奖品。这也意味着汽车有三分之二的可能性在参赛者没有选的门后面。当霍尔打开一扇没被选中的门，露出后面的羊时——这正是大多数人觉得反直觉的地方——汽车在那些没被选中的门中的概率仍然是三分之二（根据频率学派范式，这不会因新信息而改变）。但现在参赛者知道哪扇门后有羊了，这意味着那扇既没被选中也没被打开的门，仍然有（不变的）三分之二的概率是汽车所在的那扇。显然，参赛者换门是明智的，因为三分之二的概率大于三分之一。


  如果你觉得这不可能对，那你不孤单——但你的想法依然错了。如果你想亲自验证，可以打开 Python 解释器尝试模拟一下。模拟证明换门策略更优。但模拟确实去除了人为因素：如果你选了一扇门又换到另一扇，最后很可能因为换了门而比坚持原选择得到羊更自责。


  ### 另一个附加示例：生日问题


  概率论中有一个著名的场景，常常让人震惊，但它能深刻说明理解“某事发生在任何人身上”的风险与“同样的事具体发生在你身上”的风险之间的区别。“小概率事件”在广义上可能通过多种方式发生，因此很可能发生，这违背直觉。你明天死于车祸的概率微乎其微，但明天某个地方有人死于车祸的概率几乎是
  100%。


  这个著名场景被称为生日问题。它指出，只要一个房间里有 23 个人，其中两人生日相同的概率就略高于 50%。这就是视角重要性的体现——*你*与另一个人生日（仅月日）相同的概率仍然很低（如果你好奇的话，是
  5.8%）。但如果你不关心哪两个人同一天生日，那么人越多，出现相同生日的可能性就越大。通常求解这个问题时，我们会简化条件，忽略闰年、可能存在双胞胎以及其他可能使生日集中的趋势。这意味着我们假设有
  365 个可能的生日。


  要理解这一点，一个简单的方法是计算所有人生日都不同的概率，然后用 1 减去这个概率，得到至少两人生日相同的概率。如果把人从 1 编号到 23，只需将每个人生日不同的概率相乘即可。第一个人（总共
  1 人）生日独特的概率是`365/365`，因为可以是 365 天中的任何一天。但当加入第二个人时，因为不能与第一个人同名，所以只有 364 个可能的日子。因此第二个人的概率是`364/365`。以此类推，每个人可选的日子减少一个，第
  23 个人的概率是`343/365`。然后将所有这些值相乘，结果约为`0.4927`。记住，这是没有人生日相同的概率，所以至少两人同一天生日的概率是其补数，即`1
  – 0.4927`，也就是`0.5073`。


  两人同一天生日的可能性会随着人数增加而持续上升。有 40 人时，概率超过 89%；有 70 人时，概率达到 99.9%。但从另一个角度看，在 23 人的房间里，*你*与其他人同一天生日的可能性要低得多。房间内至少需要
  253 人，某个特定个体与另一人同一天生日的概率才能达到 50%——远多于 23 人。


  赌场和彩票运营商正是利用人们对概率的无知来牟利。人们看到别人在老虎机上赢了几万美元，或者在新闻里举着数百万美元的巨额支票拍照，就会想：“嘿，那也可能是我。”如果你把钱投入老虎机并拉下手柄，或者在街角商店买一张彩票，从技术上讲你确实可能赢。但实际你不会赢。如果运气好，你或许能拿回本钱。


  ## 概率分布


  *概率分布* 是一种理论构造，表示某个特定变量的取值范围和形态。它们在推断统计中很重要，因为如果你能识别一组数据的分布，就可以推断出手中数据之外其他合理的数值。最著名的分布大概是正态分布，但它只是众多描述不同事物类型的概率分布之一。


  通过具体分布来理解会更简单，因此我们将介绍数据科学中重要的几种不同分布。在后面的章节中，我们还会介绍更多与统计检验相关的分布。


  请注意，分布有两种基本类型：离散型和连续型。*离散型* 分布涵盖的结果只能取有限数量的值，比如抛硬币——只能是正面或反面。*连续型* 分布的结果可以是连续区间上的任意值，比如人的身高。




  ### 二项分布


  最简单的分布之一是*二项分布*，它是一种离散分布，用来描述一系列`n`次独立二元试验的行为，其中每次试验成功的概率相同（比如多次抛掷一枚硬币看正面朝上）。这里的独立意味着一次试验不会受到之前任何试验的影响，抛硬币的情况正是如此。


  该分布由已知的试验次数（`n`）和已知的概率（`p`）来定义。该分布提供了一个公式，使我们能够根据`n`和`p`来计算获得特定成功次数的概率。我们也可以绘制二项分布图。图
  3-1 展示了针对特定`n`和`p`的两个二项分布图。


  ![](img/628533_1_En_3_Fig1_HTML.jpg)


  两个条形图展示了二项分布。左侧图表显示了在 20 次抛硬币中获得特定正面次数的概率分布，峰值在 10 次正面附近。右侧图表展示了在 20 次掷骰子中获得特定“六点”次数的概率分布，峰值在
  3 到 4 次“六点”附近。两个图表的 x 轴都标注为成功结果的数量，y 轴都标注为获胜次数的概率。


  **图 3-1** 代表抛硬币和掷骰子的两个二项分布


  左侧图表显示了连续抛硬币的分布情况，即在 20 次抛掷中获得获胜（得到某一特定面）0 到 20 次的概率。`n` 为 20，`p` 为 0.5，因为硬币是公平的。毫不意外，获胜
  10 次是最常见的结果，因为这是在`p`为 0.5 的分布中的中点。如果你熟悉正态分布（我们接下来会讲到），你可能会注意到它看起来有点像正态分布。


  但是当`p`不为 0.5 时，分布看起来完全不同，如图 3-1 的右侧图表所示，它显示了在 20 次掷骰子中得到特定点数的概率。在这种情况下，`n = 20`，`p
  = 1/6`（约 0.167），因此图表向右偏斜。但这同样合理，因为最常见的次数是 3 次，概率为 0.15，是最接近`p`值 1/6 的分数。


  #### 现实世界中的二项分布


  尽管这是一个简单的分布，但它对于观察现实世界中的许多事物很有用。例如，如果我们想评估一位特定视频游戏职业玩家的成功率，并且我们根据其评分知道成功的概率，我们就可以计算在一系列比赛中赢得特定场次比赛的概率。如果该玩家玩了
  100 场比赛，成功概率为 0.75，并且赢了 90 场（输了 10 场），直觉会告诉我们这位玩家表现非常好。但我们可以量化这个好程度。如果我们想知道他们恰好赢得
  90 场比赛的可能性有多大，答案是 0.0094%，非常小。一个更有趣的数字可能是他们至少赢得 90 场比赛的可能性有多大。我们必须将赢得 90 到 100 场比赛之间每一种可能性的概率相加，结果大约是
  0.013%，比恰好赢得 90 场要高一些，但仍然非常低。这位玩家的表现异常出色。


  既然他们的获胜概率是 0.75，你可能会好奇他们在 100 场比赛中恰好获胜 75 场的可能性有多大——结果只有 9.18%。但这是因为我们问的是他们是否*恰好*赢了
  75 场，而实际上，赢 74 场和 76 场的概率也差不多，并且都会被认为是典型的成功率。事实上，他们赢得 73 到 77 场比赛的可能性是 43.6%。


  关于二项分布的一个有趣事实是：对于给定的`p`，`n`越大，该分布就越接近满足正态分布的条件，我们将在下一节讨论正态分布。


  #### 伯努利分布


  伯努利分布是二项分布的一种特殊情况，其中只进行一次试验，并有两种可能的结果，通常是成功和失败。


  '
- '# 正态分布


  大多数人都听说过正态分布——一种连续分布，也称为钟形曲线或高斯曲线——并且能够认出它的图形：中间有一个峰值，然后向中心峰值的两侧逐渐下降至零，类似于我们在概率为
  0.5 的二项分布中看到的情况。*正态分布*代表了当我们绘制某个具有自然中间高点的变量所有数值时所期望的理论形态，其数值随着远离中间点而降低。这包括像考试成绩之类的东西，大多数人的成绩处于中等水平，有些人稍差或稍好，而表现极差或极好的人较少。它是*单峰*的，因为它只有一个峰值。许多其他事物也符合正态分布，包括成年男性的身高、ACT
  考试成绩、出生体重以及测量误差。


  你可以在现实生活的许多方面直观地看到正态分布，尤其是在随时间推移而频繁使用的东西的磨损模式中。古老的石头或水泥台阶会逐渐变斜，中间部分磨损得最深，然后又逐渐弯曲回升到原始台阶的高度。门上被推开的区域，油漆会在某一点磨损得最厉害，离那个中心点越远磨损越少。它甚至能揭示出不同的油漆层，中心处直达裸露的木头，离中心点越远，不同的油漆层就越明显。看看健身房健身器械上的杠铃片，你会发现中间重量的杠铃片磨损最严重，而越往外，杠铃片磨损越轻。图
  3-2 展示了我童年家中厨房瓷砖地板的磨损模式。


  ![](img/628533_1_En_3_Fig2_HTML.jpg)


  一个厨房地板，铺有网格状的方形赤陶色瓷砖，显示出磨损和变色的痕迹。瓷砖被深色的勾缝线分隔。顶部附近隐约可见一块灰色地垫，右侧是木质橱柜。场景表明这是一个使用频繁的厨房区域。


  **图 3-2** 厨房瓷砖地板多年人来人往后的磨损模式


  图 3-2 中较亮的外部区域显然很少有人踩踏，而有一条清晰的深红色路径，在深色和浅色之间的中间区域有一些黄色，黄色之外则零星散布着红色和棕褐色。没有人会怀疑在这地板上从右下角到左上角最常走的路线是什么。


  尽管我们在现实世界中看到许多事物，但重要的是要认识到大多数事物并非真正的正态分布。但是因为事物通常足够接近正态分布，所以这个分布在统计学中极其重要。许多使用的检验和技术都要求我们假设正态性。这之所以可行，是因为事物足够接近。下一章将讨论其中几种检验方法。


  正态分布由我们之前学过的两个指标来定义：均值（`μ`）和标准差（`σ`）。我们使用总体符号来表示分布参数，因此`μ`是均值，`σ`是标准差。有了这两个值，我们就可以绘制出曲线。均值位于峰值的最顶端，而标准差则反映了曲线的陡峭程度和分散程度。




