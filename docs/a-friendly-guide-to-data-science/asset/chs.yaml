  \ | 冒险;角色扮演 | 2022-01-08 | 3.99 |\n\n数据仓库设计有不同方法，但数据科学家通常不参与创建过程。数据仓库的表通常是“扁平化”的（规范化程度较低），这就是它们方便商业智能的原因（用户无需为了创建报表而连接多个表）。在数据仓库中，也常见聚合表。它们的目的相对聚焦，但仍可能变得非常庞大。另一方面，*数据市集*则是一个更小、更聚焦的数据仓库，通常局限于特定领域。\n\
  \n*数据湖*是一个集中化且高度可访问的不同类型数据存储库，基本上与数据孤岛截然相反。其内容可以来自其他数据库、数据仓库以及任何其他类型的数据。数据湖旨在让数据易于处理，因此对数据科学家有很多好处。一个需要注意的问题是，数据湖在集中数据时几乎不进行（或很少进行）转换。其理念是数据已被提供，用户可以根据自身特定需求来决定如何进行转换。数据湖需要精细管理（尤其是在数据完整性和安全性方面），否则可能沦为“数据沼泽”。\n\
  \n\n\n## 存储选择的后果\n\n所有不同的存储选择都各有利弊，通常取决于数据的预期用途。例如，高度规范化的数据库从存储角度来看效率很高，但查询它们的成本可能很高，因为需要连接许多表才能获取所有信息。这也是数据仓库被用于商业智能的原因之一——获取一条信息需要连接的表更少。每当有人打开报表时，商业智能报表都会查询数据库，如果用户等待报表完全加载的时间超过几秒钟，这通常被认为是不好的体验。\n\
  \n安全性也因存储选择而变得更容易或更难管理。如果整个公司的数据都进入一个数据库，安全团队将不得不管理那个庞大数据库中的所有对象。这也是为什么更常见的是存在许多数据库，每个数据库都有特定用途的原因之一。可以为团队授予对不同数据库的访问权限，这使得访问管理稍微简单一些。\n\
  \n## 数据所有权与管理\n\n我相当抽象地谈论了管理数据的“其他人”，而非数据科学家本人。不同公司的情况各不相同，但与数据收集和存储相关的常见角色包括数据工程师、分析工程师和数据库管理员。`数据工程师`通常负责在数据存入数据库或其他预定位置之前，进行数据移动、转换、清理等工作。`分析工程师`是专业化的数据工程师，他们对分析需求有更深入的了解，旨在做出良好的转换选择，从而为数据科学家和其他分析用户简化工作。最后，`数据库管理员`负责管理数据库基础设施本身，包括（但不限于）数据库软件、有时是安装该软件的机器、性能与优化，以及安全性与访问权限。\n\
  \n我还提到了数据质量和数据治理的重要性。这是一个重要但常常未被实施或实施不当的领域。虽然数据库管理员管理数据的物理存储位置，数据工程师负责数据的移动，但数据到底归谁所有，谁又为其质量负责？这始终是一个难以回答的问题。数据治理旨在回答这个问题，并控制数据管理的其他方面。\n\
  \n数据治理是一项数据管理职能，旨在确保数据具有高质量、可用性、安全性和高完整性。其中一些是高层面的，涉及数据法规等问题，但我们更关心它与数据科学家工作的关联。通常，数据治理人员会与安全团队和数据库管理员合作，但不与数据科学家合作。他们所做的工作之一是试图确定数据所有者。数据所有者有时可能被期望非常懂技术，但也存在寻求业务数据所有者的案例——即对数据有业务专长的人，也就是领域专家。例如，人力资源部门的人应该拥有人力资源数据。这不应该是数据科学家、数据工程师或数据库管理员。但让业务人员拥有数据很困难，因为人们并不真正想要这个责任，因为这看起来任务繁重。数据所有者的概念也相对较新，人们还不习惯这个想法。业务数据所有者可能不知道所有字段名等等，因此还需要其他更懂技术的人员来弥合业务与数据科学家、商业智能等人员（那些需要实际查询表的人）之间的差距。实际上，有时数据科学家自己必须填补这个角色。\n\
  \n## 数据科学家在数据收集与存储中的角色\n\n在数据的收集和存储方面，数据科学家扮演着不同的角色。大多数人不会经常处理数据收集工作。市场营销和其他领域的数据科学家可能会运行\
  \ A/B 测试或其他实验，这些实验可能涉及数据收集的规划。数据科学家通常也不需要就核心数据做出存储决策。然而，他们会发现自己需要创建自己的数据源，以便与其他数据科学家共享或在项目内重复使用。了解所有选项对此可能很重要。通常，这很简单，只需将表存储在团队数据库中即可，但有时会更复杂。只要记住存储选择总是存在取舍，你就已经领先一步了。\n\
  \n\n\n## 主要收获与下一步\n\n在本章中，我们探讨了数据收集与数据存储。我提到了手动收集与自动收集：手动收集指像填写表单这样需要人工将数据录入计算机的操作；自动收集则指无需人员直接参与即可将数据存入数据库。如今大多数情况介于两者之间，比如填写数字表单——你手动填写，但点击提交后，数据就会自动进入数据库。数据产生错误的途径有很多，包括拼写错误、记录间数据不一致以及数据缺失。\n\
  \n我介绍了当前数据存储的三种主要方式：电子表格、文本文件和各类数据库。我们深入研究了关系型数据库系统，并讨论了规范化这一数据库设计风格。几十年来，关系型数据库一直是数据存储的中流砥柱，但我也谈到了几种不同类型的\
  \ NoSQL 数据库，即关系型数据库的替代方案。\n\n在下一章中，我们将通过探讨数据预处理来开启数据准备的讨论。数据预处理主要侧重于清理数据，确保数据能准确反映其应代表的内容。它涉及处理缺失值、重复行、格式不一致的数据以及异常值等问题。\n\
  \n## 从业者简介：肖里亚·梅塔\n\n**姓名：** 肖里亚·梅塔\n\n**现任职位：** BI 工程师\n\n**当前行业：** 零售\n\n**从业年限：**\
  \ 在数据分析、数据科学和 BI 领域拥有 5 年经验\n\n**教育背景：**\n\n*   分析学专业研究硕士\n*   信息技术学士\n\n*此处表达的观点仅代表肖里亚本人，与他的任何现任或前任雇主无关。*\n\
  \n### **背景**\n\n肖里亚对计算机感兴趣，因此他进入大学攻读信息技术专业。他最初从事软件测试工作，测试软件的功能和性能，其中很多是手动测试，所以他学会了如何处理数据。他尤其喜欢处理大量数据的软件，在进一步研究有哪些类型的工作岗位后，他意识到自己想要从事数据领域的工作。他开始自学，但最终决定攻读该领域的学位。他来到美国攻读硕士学位。\n\
  \n### **工作**\n\n在读研期间，肖里亚在一家大型零售商那里获得了一份数据科学实习机会，他非常喜欢这份工作。他学到了很多东西，毕业后留在了同一家公司。他的技能在多个领域得到了发展。疫情期间，他所在的公司出现了供应链问题，他对供应链管理产生了浓厚兴趣，于是在该领域找到了一份新工作。过了一段时间，他又转入了另一个有趣的领域，对该零售商网站的数据进行数据分析和\
  \ BI 工作。他喜欢这份工作，因为观察数据随时间的变化很有趣，并且能帮助网站团队进行改进。\n\n### **语录集锦**\n\n**工作中最喜欢的部分：**\
  \ 肖里亚觉得挖掘数据很有趣，因为他总能发现有趣的东西，但这同时也意味着要了解数据，这样他以后就能用数据做更多事情。所有这些都提升了他解决利益相关者问题的能力，当他帮助公司节省资金或提高运营效率时，也很有成就感。\n\
  \n**工作中最不喜欢的部分：** 依赖其他团队有时会令人沮丧，因为他们常常没有时间帮助你或完成你需要的事情，他们有自己的优先事项，这可能导致你的工作受阻，进而导致项目延期。\n\
  \n**最喜欢的项目：** 肖里亚有几个他非常喜欢的项目。在一个项目中，交货经常延迟，公司想了解原因。他致力于理解产品从发货到送达的整个生命周期，包括在仓库的时间以及实际发货时间。然后，他通过查看承运商和配送服务本身（如\
  \ UPS、USPS 等）的数据，深入分析了运输步骤。他最终成功找出了延迟的原因，公司据此进行了改进。在另一个项目中，他研究了仓库中的物品处理流程以及参与处理的人数。通过查看数据，他发现当处理的物品数量较多时，实际工作人员反而较少，反之亦然，这让所有人都感到惊讶。这一发现带来了流程变革和巨大的财务节省。\n\
  \n**最常用的技能：** 对数据有敏锐的洞察力，并且有好奇心去了解更多。这可能很耗时，但你需要仔细审阅数据，了解其中包含什么，以及它如何与现实世界关联。另一个重要技能是在处理数据和与人打交道时要有耐心。在数据中发现故事也非常重要。如果你找不到故事，就需要提出不同的问题。\n\
  \n**目前主要使用的工具：** SQL、Databricks、用于 Azure 的 SSMS、Excel/Google Sheets、Power BI\n\n\
  **数据科学的未来：** 人工智能领域还会有更多发展。但我们仍然需要人类，因为只有人类才能真正拥有业务知识。理想的情况是，人们利用 AI 来加速工作。这不是二选一的问题。\n\
  \n**优秀数据科学家的特质：** 最重要的事情是对数据有洞察力。仅仅知道算法是远远不够的——这大概只占你需要理解内容的 10%。你需要独立自主，愿意主动出击并抓住机会。拥有扎实的计算机科学背景也是一个巨大的优势，因为它能帮助你编写更高效的代码。此外，理解你所在公司的业务——当然还有数据——也非常重要，因为只有这样，你才能为你的机器学习模型提出有意义的特征。\n\
  \n**给未来数据科学家的建议：** 在你找工作之前，就要选定一个细分领域并培养你的技能。花时间研究那个领域，尽可能多地学习。但也要有耐心——有时候事情需要时间。始终保持成长型思维，提升编码和分析两方面的技能。\n\
  \n*肖里亚是一位经验丰富的零售数据专业人士，在数据分析、数据科学和商业智能领域拥有丰富经验。*\n\n脚注 1 2\n\n# 13. 给准备者：数据收集与预处理\n\
  \n\n\n## 引言\n\n至此，你可能已经明白为什么我们需要获取正确的数据并进行恰当的预处理——预测或分析的质量完全取决于输入的数据。在数据科学领域，“垃圾进，垃圾出”这一格言真切成立，而原始数据未经处理就能在机器学习模型中表现良好的可能性微乎其微。这并不意味着数据不包含大量有用信息，只是它天生尚未准备好应用于实际场景。西蒙·拜尔斯并非一夜之间就成为举世闻名的体操运动员——她经过了多年的准备、发现并磨练特定优势、并有针对性地弥补不足。\n\
  \n数据收集看似不言自明，但为机器学习或分析选择正确的数据却并非总是易事。正如我们在关于领域知识的第 10 章中看到的，你需要非常了解你所处理的问题、所需的数据类型以及可用的数据。如果你是自己收集数据，则应关注上一章以及第\
  \ 3 章关于实验设计的讨论。更可能的情况是，你将使用已经存在的数据。这意味着你必须找到它，然后对其进行预处理以投入使用。\n\n在现实世界中，“数据预处理”到底意味着什么？它并非一组特定的步骤。你需要进行的预处理取决于你试图实现的目标、你计划进行的分析或机器学习类型，以及你所拥有的数据类型。有时，当数据科学家谈论数据预处理时，他们指的是准备将任何数据输入机器学习模型的所有方面，包括数据预处理和特征工程。在本章中，我将重点讨论第一阶段，即预处理，而将特征工程留到下一章。数据预处理任务与特征工程任务之间并没有严格的规则来区分，但我会专注于基础内容，包括清洗、格式化、合并数据以及处理“坏”值。\n\
  \n# 现实世界中的数据预处理实例\n\n拥有状态正确的正确数据至关重要，足以决定项目的成败。如前所述，特征工程对大多数机器学习来说确实至关重要，但如果数据本身没有准备好，就无法进行良好的特征工程。这正是数据收集和预处理发挥作用的地方。在下面的第一个示例中，一家医院原本有一个旨在预测肺炎患者再入院率的系统，以便更好地决定治疗方案，但他们直到项目深入后才意识到，他们收集的数据遗漏了决策所需信息的一个关键方面，导致预测结果出现偏差。他们没有收集到正确的数据。在下一个示例中，我们将看到，在初涉数据科学的人最常尝试的机器学习问题之一——预测泰坦尼克号上哪些乘客能够幸存——上获得良好结果是如何依赖于良好的数据预处理的。\n\
  \n## 示例 1：缺失的生死攸关信息\n\n这是一个旨在帮助决定肺炎患者是否再入院的项目，以辅助护理决策（并降低成本）。我们知道，不同的肺炎病例严重程度不同，适当的治疗取决于评估的严重程度，特别是患者是需要住院还是可以在家康复。在这家特定的医院，患有哮喘的肺炎患者无论其肺炎严重程度如何，都会被送入医院重症监护室。^(³²)\
  \ 由于对哮喘患者采取了这种保险措施，他们在研究中的最终存活率反而高于普通人群。这实际上导致了数据偏差，因为它使得哮喘看起来根本不是风险因素，从而导致模型在建模时忽略了患者是否患有哮喘这一因素。\n\
  \n之所以出现这种情况，是因为哮喘患者的数据从整体数据集中缺失了，因为他们没有基于病情严重程度进行评估。数据科学家试图自动化的流程从未将这些人完全考虑在内。确保拥有正确的数据用于模型开发始终至关重要。\n\
  \n尽管这是一个无心之失，但如果项目相关人员没有意识到这个问题，并将此系统发布到现实中，试想一下，对于那些无法自动收治哮喘患者、而必须使用此工具作为指南来决定是否收治的医院，它会给哮喘患者带来多大的伤害。这将严重违反医疗伦理。\n\
  \n## 示例 2：人人钟爱的机器学习问题\n\n`Kaggle.com` 是一个热门网站，它托管供数据科学家使用的比赛和数据。这是一个在真实数据科学领域初试锋芒的好地方，你甚至可以使用他们的平台运行代码，而无需在自己的电脑上安装所有东西。人们会创建包含解决方案和分析的笔记本并在网站上分享，这样你可以向他人学习并积累声誉。许多比赛确实有现金奖励，但该网站最受欢迎之处在于它作为一个社区，能培养成长中的数据科学家。那么，这与数据预处理相关的例子是什么呢？该网站上参与人数最多的滚动比赛是预测“`泰坦尼克号`”灾难幸存者的比赛。^(³³)\
  \ 截至撰写本文时，已有近 15,000 名参与者提交了超过一百万份参赛作品。\n\n随着这个问题被反复解决，一个共识浮现出来：良好解决方案中最重要的部分就是恰当的数据准备。当我查看排行榜时，排名前\
  \ 335 的参赛作品在其测试集上获得了满分（100% 完美预测幸存者与非幸存者），而这个测试集是 `Kaggle` 提供的但并未公开。坦白说，这实际上表明了一种过拟合（模型训练中的一个问题，即模型泛化能力差，过于贴合其训练所用的特定数据）现象，我们稍后会讨论。我们知道，对于每个幸存者来说，运气都起了一定作用，因此结果不应该是完全可预测的，但我们也确实知道，有一些特征是预测的非常重要的因素，包括性别和船票等级。\n\
  \n如果你浏览一些贡献者分享的高分笔记本，你会看到他们都进行了扎实的`EDA`，检查每个字段的模式和缺失值。^(³⁴) 他们研究了相关性以识别共线特征（那些看起来提供相同信息的特征，因此我们不应同时包含两者）。他们利用在`EDA`中的发现来选择要关注的特征、清洗数据，特别是填充缺失值。有这么多人解决了这个问题，我们可以毫不怀疑地断定，数据预处理（以及特征工程）至关重要。\n\
  \n\n\n## 数据收集\n\n数据收集与准备的绝对第一步是理解业务问题。你希望通过使用数据达成什么目标？这会影响你将寻找和使用的数据集。\n\n实际收集数据的过程有时可能很艰巨。除非你已有权访问这些数据，否则你需要向不同的人打听才能找到数据，然后可能还要申请访问权限。一旦拿到数据，你必须在上面进行\
  \ `EDA`（探索性数据分析），才能了解你是否真的能使用它、可能用到哪些字段，以及需要做哪些准备。\n\n作为数据收集的一部分，你还希望尽可能了解数据的收集方式，特别是是否存在任何已知的错误可能性（或确定性）。在处理问题时，这种知识可能非常宝贵。\n\
  \n准备的下一步是数据预处理，旨在使数据尽可能可用，并为任何重要的特征工程做好准备。同样非常常见的是，在数据预处理阶段（以及特征工程阶段）你可能会发现没有所需的所有数据，这意味着你需要回到起点，尝试确定你能获取的重要数据来源。这种迭代是完全正常的，可能涉及与利益相关者反复沟通。\n\
  \n## 合并数据源\n\n数据科学家常常需要合并来自不同来源的数据，这也被称为*集成*。大多数情况下，当考虑关系型表格时，这意味着添加列而不是添加行。例如，想象一家披萨外卖店，它在销售数据中有一个表格，每次销售如果使用了优惠券，就会包含一个优惠券\
  \ ID。他们想知道每种优惠券的受欢迎程度，并计算折扣“损失”了多少销售额。他们还有另一个表格，包含优惠券 ID 和其他信息，包括折扣金额。如果他们将这两个表格合并在一起——用关系型数据的术语来说就是*连接*——他们就能在一个表格中更轻松地看到这些模式。设想他们还希望了解不同类型的客户使用哪种优惠券，以便在人们家门口留下更有针对性的优惠券传单。幸运的是，他们还有一个包含基本客户信息的表格。他们还可以将客户数据连接到已经创建的合并表格，因为每笔订单都由一个客户完成，且该客户\
  \ ID 就在销售表格中。一旦所有数据到位，他们可以进行各种操作——聚合和筛选——来了解能发现什么。例如，他们可能会按周聚合销售额，看看发布新优惠券的周是否比其他周更繁忙。\n\
  \n## 数据预处理技术\n\n数据预处理的某些方面可能由数据和分析工程师完成，但数据科学家几乎总是还需要自己做一些准备工作。在讨论数据准备时，我们通常使用相当不精确的语言。你会听到各种术语——清洗、净化、整理、调校——所有这些都可能指向相同的基本概念。数据几乎从不会真正准备好用于分析，因为它总是有*噪声*——从小到大各种错误、不一致性以及其他意外情况，这些都可能对分析和数据科学工作造成严重破坏。`EDA`\
  \ 的一个目标是识别这些值，而预处理的目标是确定如何处理它们并做出适当的更改。\n\n请注意，预处理可以帮助我们处理数据的许多方面，即使从技术上讲数据并非“错误”。例如，我们可能决定更改日期字段的格式，使其按特定顺序存储。\n\
  \n### 重复行\n\n如果你忘记检查，重复行往往就藏在眼皮底下。但它们可能会严重偏倚模型，尤其是如果存在某种特定的重复模式。有时，重复行可能是另一行的字面副本，每一列的值都相同。这些是最容易检测到的。其他时候，可能只有某些行需要重复，记录才被视为重复。如果你有一个人员表格，两行具有相同的社会安全号码、姓名和出生日期，但出生地不同，那肯定有问题，你知道其中一行是错的。如何处理重复行取决于上下文和业务知识。你总是需要考虑记录是如何变成重复的，这会指导你如何修复它。即使两行之间每个值都重复，也可能存在它们并非真正重复条目的情况——两者都可能有效。例如，假设一个表格存储人们的姓名、出生日期和出生州，但没有其他信息。虽然不太可能，但也不排除两个同名同姓的人在同一天甚至同一州出生的可能性。\n\
  \n### 格式化和标准化\n\n当数据被妥善存储时，通常不需要进行大量格式化工作。但我们并非总是这么幸运。我们希望特定列中的所有数据保持一致并以相同格式排列，因此有时需要进行清理才能实现这一点。你可能会遇到一个字段有时以磅（pounds）存储重量，有时以千克（kilograms）存储，由另一个字段指示（这在跨国经营的公司中很常见，本地单位如度量衡和货币会按当地方式存储）。创建一个新版本的表格，其中包含两个新列分别显式存储以磅和千克为单位的重量，这可能是个好主意。这需要根据指示单位的第二个字段来转换原始字段。\n\
  \n在处理文本值（如电子邮件地址、物理地址和电话号码）时，格式化尤其重要，通常需要标准化。通常，这类数据会被拆分成不同列和/或以原始形式存储，以避免在数据库中进行格式化，但如果你处理的数据不是这样构建的，你可能需要进行一些格式化。例如，你更希望电话号码只存储数字而不带标点，就像\
  \ `9435551234` 这样。但如果某些记录只使用短横线，而其他记录使用括号表示区号，那么如果你打算以任何方式使用该号码，就需要处理这个问题。\n\n一种特别常见、因格式化而可能成为噩梦的数据类型是日期。主要的数据库管理系统（DBMS）都拥有可以正确存储日期和时间的日期、时间和日期时间数据类型，但即使在数据库中，它们也经常被存储为文本。如果你处理的是文本文件甚至是原生电子表格，你也会遇到文本格式的日期。虽然人类习惯于使用像\
  \ `1/4/24` 这样的简写形式，但在没有额外信息的情况下，这并非 100% 可解读。是月份在前，采用美式风格，还是月份在后？是 2024 年还是更早的世纪？很多与计算机打交道的人更喜欢\
  \ `2024-01-04` 这种风格，它总是四位数的年份，然后是月份和日期，月份和日期都用前导零补齐。这种格式对于代码处理来说很轻松，即使以文本形式存储也能正确排序。但如果在你之前的人不那么贴心，将文本日期以另一种格式存储——或者更糟的是，以多种不同格式存储——那么标准化工作就将落在你头上。二十世纪末临近时，全球曾对“Y2K”（千年虫）问题产生过轻微恐慌，原因就是年份只被存储为最后两位数字。最终它并没有造成太大问题，因为关键系统在时钟跳转到\
  \ 2000 年之前就被修复了，但当时确实存在很多不确定性。\n\n\n\n### 处理“不良”数值\n\n数据中可能存在大量在某种程度上被视为不良的数值，但最明显的两类是异常值和缺失值。许多数据科学新手会本能地想要直接剔除异常值，并用该列其他数值的平均值来替换缺失值。这两种选择几乎总是错误的——但并非在所有情况下都是如此。\n\
  \n#### 异常值\n\n首先，异常值不一定是糟糕的数据，因为它们实际上可能是正确的。有时候事情确实异于寻常。另一些时候，异常值纯粹是错误的。我一位朋友的母亲有一张驾照，上面错误地将其体重标注为\
  \ 934 磅——对于一位驾驶汽车的人来说，这显然超出了可能的范围。如果你的数据集中包含这个值，你就需要弄清楚该如何处理它。\n\n异常值也可能表明有其他情况在发生。我曾在一家需要会员资格的零售商工作，当时所有订单都关联着一个会员编号。但偶尔会有一些订单，由于某些特殊原因无法获知真实会员编号，而使用一个虚拟值\
  \ 99 来记录。如果我们按会员对销售额进行汇总，那么会员 99 的销售额将远超其他所有个人会员。它实际上并不代表一位真实的会员，所以如果我们研究的是与会员相关的事项，就应该剔除这些记录。但如果我们不关心会员资格，只关心各门店的总销售额，那就不该剔除这些记录。背景和业务知识至关重要。这再次提醒我们要思考数据中数值的实际含义。\n\
  \n在识别“异常值”方面，有一些相当标准的标准，例如低于或高于四分位距 1.5 倍的值。但如何定义它们取决于你的项目和具体背景。\n\n### 插补\n\n缺失值带来了另一个需要决策的难题，同样要基于背景以及你对数据所代表含义的了解。有时，用另一个值填充缺失值是合理的，这个过程称为*插补*。一些常见的插补方法包括用\
  \ 0、整个数值列的平均值或中位数、或者分类列的众数（最常见值）来填充空值。但如果这些空值所代表的意义与你刚刚填入的值完全不同呢？想象一个存储信用卡余额的数值列，系统中存在一个无法处理负值（表示应退还给持卡人的款项）的\
  \ bug，导致在这些情况下该值被留空。如果你用所有信用卡余额的平均值来填充这些空值，结果将会极其不准确。在这种情况下，用 0 进行插补可能是一个不错的解决方案——但如果你不知道数值缺失的原因，你又如何知道对那一列中的每一个缺失值来说，这个方法都是正确的选择呢？\n\
  \n你始终需要考虑数据和背景。想象一列名为 `death_date` 的数据。如果该值为空，可能表示此人尚未去世，也可能表示该日期不详。如果你的数据是关于生活在\
  \ 19 世纪的人，你知道是后一种情况；但如果数据是关于 20 世纪出生的人，则两种可能性都存在。根据你试图用这些数据做什么，你可能不希望用某个任意值来填充它，因为你添加的任何值都只是错误的。或者，你可以填入一个明显不切实际的日期，比如\
  \ `12-31-9999`，你知道这是虚构的，但这样可以对这一字段进行某些计算。\n\n请注意，这个过程可能更适合保留到特征工程步骤中，并结合其他特征来考量。例如，如果你知道某些信用卡余额为空是由于上述问题，你可以稍微探索一下数据，看看过去几个月里该持卡人是否没有被收取利息，那么你可能就愿意推断这些特定持卡人确实有应收款项，并可以安全地为其分配一个\
  \ 0 余额。\n\n处理插补值的一个常用技巧是添加一个新的布尔列，用于指示另一列是否经过了插补。这个新列可以输入到模型中，从而改善模型性能。如果值未经插补，模型可以有效利用该值；如果经过插补，则可以忽略它。\n\
  \n\n\n## 关键要点与下一步\n\n本章探讨了数据准备中的数据预处理部分。我们通过几个示例说明了拥有正确数据的重要性，以及数据准备对后续机器学习模型性能的关键作用。我们讨论了数据收集和整合不同数据源的过程。随后，介绍了一些常见的预处理步骤，包括处理重复行、格式化以及处理“不良”值。所有这些步骤都可以归类为不同的术语，最常见的是数据清洗。\n\
  \n在下一章中，我们将介绍特征工程，从而完成数据准备部分。这将涉及处理单个特征，对现有特征进行转换、组合或拆分，并在此基础上创建新特征。还有一些技术将所有特征视为一个整体集合，并致力于对其进行优化，包括特征选择和特征投影（或降维）。通常来说，特征数量较少是件好事，但这仅仅是因为特征过多可能会带来问题。最重要的不是只拥有少量特征，而是拥有*正确*的特征。\n\
