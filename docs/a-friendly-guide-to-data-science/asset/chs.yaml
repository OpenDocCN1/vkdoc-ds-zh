  \n在数据预处理中，您可能已经进行过一些插补——即替换特征中的缺失值。但创建新特征有时会引入新的缺失值。因此，您应检查新特征中是否存在此类情况，并根据需要进行插补。\n\
  \n\n\n### 重塑数据\n\n你可能会进行的另一种转换类型涉及重塑数据，最常见的方式是通过透视。*透视*是一种转换，它接受许多行，并通过从某些原始列的值中创建新列来减少行数。它还涉及聚合，例如求和或求平均值。例如，以我们在表\
