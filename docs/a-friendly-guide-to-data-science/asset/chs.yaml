  15 到 18 岁，GPA 平均值从 2.76 到 3.96，奖项总数从 0 到 6。


  图 7-4

  按年龄-导师粒度聚合的示例学生数据，包含平均 GPA 和总奖项数


  这个表的行数更多，因为大多数导师都有不同年龄段的学生，只有 Namath 和 Smith 例外。任何时候当你聚合或查看聚合数据时，都必须考虑粒度。


  日期是一种在不同粒度下经常调整的常见数据，因为我们通常希望以周或月粒度查看销售额等数值，而不是查看每日数值。


  数据基础理想情况下应由数据工程师（或在某些地方，由分析工程师）创建，但现实情况是，有时其他人最终不得不构建它。这些人在某种程度上可能包括数据链末端的任何人，比如数据分析师、数据科学家或商业智能工程师。


  ### 商业智能


  *商业智能* (BI) 实际上就是报表——创建各种类型的报告，范围从 Excel 表格到摘要文档，再到包含图表、表格和其他数字的仪表板。BI 报告通常是持续性的，会定期刷新和查看，而不是一次性报告。领导者和员工利用这些报告来了解业务各个方面的状况，这有助于他们做出决策。许多公司长期以来一直在做这项工作，即使它们在分析方面的其他能力可能还不够成熟。通常，商业智能团队也负责准备他们将在报告中使用的数据，无论是在像`Tableau`或`Power
  BI`这样的工具内，还是在数据库中（可以独立完成，也可以与数据工程师和/或数据库管理员合作）。


  `BI`开发人员——即报告创建者——通常不从事任何可被称为“数据分析”的工作。他们所做的“分析”仅仅是为了理解和准备数据，以便制作报告，与决策者分享。尽管如此，他们为了理解数据而进行的许多分析，与数据科学家和数据分析师为了解数据所做的分析是相似的，但他们在理解了数据内容之后就会停下来。而数据科学家和数据分析师则利用这些信息进行更深入的工作。


  `BI`的重点几乎总是放在过去和当前的业务上，而不是未来。如果显示了任何未来的数据，那也只是他人创建的表格中的数字，或者是一个与人共享的简单公式的结果，绝不是
  BI 团队自身通过任何算法生成的内容。


  #### 自助式报表


  公司可能难以满足所有的`BI`需求，因此许多公司会创建自助式分析程序，允许非技术背景的业务人员自行创建报告。人们通常喜欢这种方式，因为他们不必等待别人来构建报告，而且他们还可以通过反复试验自己找出需要什么，而不是等待开发人员提供进行中的仪表板进行检查。这种程序的成功完全取决于用户可获得的数据质量。全自动报告——即设计为按需运行，但其字段和值由`BI`或数据分析师预先编程的公式确定——是安全的，但很多自助式服务涉及非技术人员自行设计报告、选择字段和聚合方式。数据必须既干净又易于使用，才能实现这一点。具体来说，当所有数据尚未合并到一张表中时，用户很难知道如何组合数据——正确地连接多个数据源通常需要技术知识。如果数据没有准备好，他们可能会生成包含不准确信息的图表，这会影响决策，并可能造成对分析团队的信任问题。数据分析师进行分析后，发现结果与由非技术人员生成的自助式报告相矛盾的情况并不少见。他们需要额外的工作来证明数据分析了没有错误，错误出在自助式报告中。总之，成功的自助式程序需要精心设计的数据、防护栏和良好的培训（用户需要理解他们能做什么和不能做什么）。



  '
- '# 数据分析


  我们在第 5 章已全面学习了数据分析的相关知识，但概括来说，数据分析包含以下任一内容：通过探索性数据分析审视数据并发现洞察，用不同方式对数据进行切片和切块以展现数据的各个层面，制作图表和其他摘要来说明数据特征，以及进行统计分析以揭示更多数据信息。最终目标是更好地理解业务，这需要对数据有深入的理解，而商业智能开发人员可能并不需要这种深度。


  根据组织不同，数据分析师的部分工作可能涉及商业智能，但人们期望他们做的不仅仅是生成仪表板。不过，数据分析师构建仪表板来总结他们完成的真实数据分析工作也很常见，因此部分技能经常重叠。经验更丰富的数据分析师也可能涉足数据科学领域，尤其是使用线性回归等较简单的机器学习技术时。


  数据分析师通常也关注过去和现在，但一些更资深的数据分析师还可能参与一些基础的预测工作。


  '
- '# 数据科学与高级分析


  如第 6 章所述，数据科学家比数据分析师更进一步。他们使用的技术通常比数据分析师更复杂，包括机器学习、自然语言处理及其他统计高级技术。然而，在一些公司，数据科学家做大量数据分析甚至商业智能工作的情况非常普遍，尤其是在组织规模较小、成熟度较低且没有强大的分析举措时。数据科学家根据业务需求和问题，处理来自过去、现在或未来任何时间框架的数据。


  此处的“高级分析”仅仅是数据科学的另一个术语。不过，有时采用整体分析方法论的组织更倾向于使用这个术语，因为它能比“数据科学”更好地传达上下文，因为“数据科学”暗示着与其他领域的分离。


  ## 分析成熟度与分析类别


  如果你查阅分析成熟度模型，通常会看到展示四种不同分析类别的图表，它们被呈现为一种成熟度模型。这些类别按复杂度从低到高依次为：描述性分析、诊断性分析、预测性分析和规范性分析，下面将对它们进行描述。这些是值得理解的实用类别，我们将在下文讨论它们，但我认为，根据组织拥有的数据、工具和数据能力来判断其成熟度，比根据它们所做的分析类别来判断更有益。组织做它们需要的分析，没有做最复杂的分析并不意味着它们能力不足。


  ### 成熟度模型


  分析成熟度模型描述了组织在分析方面的五个基本成熟度级别，这取决于组织能够胜任的分析选择。如上所述，一些人认为级别由他们所做的分析类型决定，数据科学是最高级别。但事情并没有那么简单。在最低级别，即成熟度
  0 级，组织根本没有组织化的分析举措。这并不意味着没有人处理数据，只是没有一个能够导向成功的综合项目。


  理想情况下，组织会在层级中逐步提升。在成熟度 1 级，他们至少拥有了数据基础的开端——即商业智能、数据分析师和数据科学家可以在工作中使用的数据——以及供这些数据工作者使用的正确工具。这两点都至关重要，但两者也都可以处于建设中——该成熟度级别的关键要求是，领导层完全理解数据和工具的需求，并已承诺投入资源来创建这个数据基础和配套的数据工具。


  处于成熟度 2 级的组织将拥有扎实的商业智能工作——通常是一个或多个团队，每年为不同的利益相关者生成多份报告，所有这些报告都基于使用数据基础中的数据。如果随后他们扩大分析举措以纳入数据分析，这将使他们进入成熟度
  3 级。将数据科学纳入其技能范围将使他们进入成熟度 4 级。通常，组织最初开展的数据科学相对基础，数据分析和数据科学之间的界限不如高度成熟的组织那么分明。成熟度
  5 级适用于能够从事更高级数据科学项目的组织。因此，一个 5 级组织拥有一个完全实现、成熟的分析项目，该项目涉及所有三个学科中不同复杂程度的项目，以响应业务的不同需求。


  现实情况是，许多组织完全是在草率行事，陷入人工智能和数据科学的热潮中，并在没有任何其他分析或通常只有商业智能的情况下组建数据科学团队。这些组织通常甚至没有准备好可供使用的数据（有时甚至根本没有数据）。在没有数据基础或其他类型分析的情况下尝试做数据科学，往往是徒劳的。优秀的数据科学家善于解决问题并找到应对众多挑战的方案，所以他们或许仍能设法做出一些成绩。但这将花费比必要时间长得多的精力，而且范围依然有限。在这种情况下，组织的成熟度级别仍然是
  0 级，因为他们不知道如何系统地开展工作。


  每个级别中还有一个不那么明显但隐含的要求：不仅该阶段的分析工作正在进行，而且团队拥有足够的工具来完成工作。例如，做商业智能需要 BI 工具，而做数据科学需要大量具有足够计算能力和内存来处理大量数据的工具。组织也常常在这方面遇到困难，导致员工没有足够工具，不得不浪费时间寻找变通方法，或者因为上次运行超时而不得不重新执行。如果一个组织似乎处于
  4 级，即拥有在坚实数据基础上开展商业智能、数据分析和数据科学的团队，但数据科学家除了 Excel 外没有任何工具，那它就不是一个 4 级组织。Excel 不足以满足数据科学的需求。假设商业智能开发人员和数据分析师拥有合适的工具，那么该组织实际上应该是处于
  3 级。




  '
- '# 分析成熟度模型


  成熟度等级范围为 0 到 5，对应他们在分析项目中达到的级别，并且每个后续级别都建立在之前级别的基础上。表 7-1 总结了这些级别，并附带了关于移动的类比。


  **表 7-1** 成熟度模型等级及分析项目的已实施部分


  | 成熟度等级 | 已实施的分析阶段 | 移动方式 |

  | --- | --- | --- |

  | 0 | 无数据基础 | 原地踏步 |

  | 1 | 数据基础 + 工具 | |

  | 2 | 数据基础与商业智能 + 所有工具 | 爬行 |

  | 3 | 数据基础、商业智能和数据分析 + 所有工具 | 行走 |

  | 4 | 数据基础、商业智能、数据分析以及基础数据科学 + 所有工具 | 奔跑 |

  | 5 | 数据基础、商业智能、数据分析、基础与高级数据科学 + 所有工具 | 飞翔 |


  不同公司的成熟度水平差异很大，尽管可以大致概括不同类型公司可能达到的水平（但显然，这些概括存在许多例外）。大多数初创公司和科技公司至少达到第 3 级，许多甚至达到第
  4 级，因为它们从早期就开始利用这些信息来驱动决策。它们从一开始就理解数据的空间和价值。成立时间较长的非科技大型公司通常处于第 2 级或第 3 级，因为它们投入了时间和精力试图了解自己的业务，这意味着通过商业智能甚至数据分析来查看数据。因此，它们的数据基础通常已经到位，尽管可能还不完全适合数据科学工作。较小的组织通常成熟度要低得多，因为它们没有投入时间和精力来构建坚实的数据基础，即使它们试图从现有的杂乱数据源（如孤立存在的电子表格）中提取信息。


  请注意，这并非完全非黑即白的尺度——例如，如果某些数据基础仍在建设中，那么拥有它总比没有好。但是，一个制作了大量仪表板却没有时间做其他事情的数据分析师，不应该被认为真正达到了数据分析级别，因为他们所做的仅仅是商业智能工作，即使他们拥有不同的职位头衔。


  ## 四类分析


  这四类分析呈层级结构，因为每种类型的挑战性都在递增。第一类是描述性分析，其次是诊断性分析、预测性分析和规范性分析。成熟度为 1 级或 2 级的组织能够完成第一类（描述性分析），但可能无法完成第二类。其他类型的分析仅仅需要更高的成熟度才能实现。第二类（诊断性分析）需要数据分析师，而预测性分析和规范性分析通常需要数据科学家。


  ### 描述性分析


  *描述性分析* 是关注过去发生了什么以及现在（或至少是刚刚过去）正在发生什么的数据工作。这是商业智能和数据分析的主要领域。它可以表现为商业智能报告的形式，也可以是数据分析中的探索性和描述性统计。例如，商业智能创建的一份报告，显示一家视频游戏公司截至昨天每款游戏的每日销量，并附有月度汇总，这就是描述性分析的一个例子。数据分析师的工作可能会更深入一些，但仍然是在描述过去，例如分析该公司最新游戏发布的新在线营销活动
  A/B 测试的点击结果。


  ### 诊断性分析


  *诊断性分析* 的工作不仅仅是描述发生的事情，还旨在*解释*这些事情发生的原因。理解发生了什么很重要，因此描述性分析是其中的一部分，但这不是最终目标。这通常是数据分析师，有时也是数据科学家的领域。例如，显示每日游戏销量的仪表板可能允许用户将鼠标悬停在某一天的销量数字上，以查看关于该天的更多信息，包括营销、广告、促销、节假日以及亚马逊
  Prime Day 和选举日等重大国家事件的信息。再次点击，这些信息就会叠加在图表上，从而可以看到整个销量图表的趋势。例如，某款游戏每日销量的多线图可以包含销量数据、投放的广告数量、游戏价格（反映常规价格变动或折扣），以及节假日或重大事件所在日期的竖线。


  ### 预测性分析


  *预测性分析* 顾名思义——重点是预测未来趋势。这主要是数据科学家的领域，因为预测通常需要机器学习方法。最常见的预测性分析任务之一是预测未来短期内的销量。这可能会出现在“诊断性分析”部分描述的同一种图表上——用户可以看到历史数据、叠加的解释性项目，以及未来
  14 天的预测。这种图表非常强大，因为一个地方就汇集了大量信息。


  ### 规范性分析


  最后一类是*规范性分析*，旨在帮助告诉决策者他们可以——甚至应该——做什么。这是相当高级的，属于数据科学家的领域，尽管很多数据科学家可能从未从事过这类工作，因为与其说是为决策者提供信息，不如说是直接告诉他们该做什么。然而，这并不像听起来那么强硬。我们可以有一个系统来研究价格变动和促销对销量的影响，并建议何时进行促销或调整价格。这些信息通常还会包含解释，例如是哪些特征导致了该建议。决策者不必强制执行，但这是一种基于以往信息的建议，这些信息在复杂的分析中被用于考虑比人脑所能处理的更多的因素。


  ## 分析成熟度与类别结合


  一个组织的分析成熟度取决于许多因素，但这些因素决定了它通过分析改进业务所能取得的成功程度。图 7-5 显示了每次前进一个级别时，成熟度、所进行的分析工作类型以及四类分析之间的关系。


  ![](img/628533_1_En_7_Fig5_HTML.jpg)


  **图 7-5** 分析成熟度级别及对应的数据工作和分析类别，展示了一个有组织的分析项目的传统发展轨迹


  说明分析成熟度级别的表格。该表格有三列：“分析成熟度等级”、“数据工作”和“分析类别”。等级范围从 0 到 5。0 级表示“无常规工作，无数据基础或工具”，分析类别为`N/A`。1
  级涉及“数据基础与数据工具基础设施”。2 级是“商业智能”，分析类别为“描述性”。3 级是“数据分析”，分析类别为“诊断性”。4 级是“数据科学（基础）”，分析类别为“预测性”。5
  级是“数据科学（高级）”，分析类别为“规范性”。


  如你所见，第 1 级仅仅是分析开始前的设置和准备，但直到第 2 级，才真正开始进行分析。在第 2 级，商业智能产出描述性分析。诊断性分析在第 3 级成为可能。第
  4 级将预测性分析纳入了组织的技能库中。最后，在第 5 级，规范性分析成为可能。




  '
- "# 构建分析计划\n\n如前所述，有一种方法可以制定分析计划，即依次完成成熟度模型中从 1 到 5 的各个阶段。但这并非单凭一人或一个小团队就能独立完成。关键在于领导层必须理解其必要性、具体内容，并全力支持。显而易见，多数分析计划的目标是获得竞争优势或提升组织绩效。但领导者必须明白，在实现这一价值之前，需要完成大量工作，并耗费大量时间。\n\
  \n我已经强调了数据基础的重要性，这需要有人担任数据所有者并管理数据。如果过早招聘了数据科学家，他们可能既没有数据也没有工具，因此必须说服领导层认识到这些资源的必要性。之后，他们应与构建数据基础的人员合作，帮助设计一个可用的系统。但这一过程还需要其他人的参与。\n\
  \n成熟度第 1 级的另一个要求是，数据工作者必须拥有完成工作的工具，而这需要资金支持。资金可能是个挑战。组织往往不愿为计算资源（物理或云端的处理器和内存）和存储付费，尽管足够强大的计算能力是开展任何工作所必需的。如果只有一台笔记本电脑，你只能对较小的数据集进行基础的数据分析和数据科学工作。\n\
  \n## 告诫\n\n尽管创建扎实的数据分析计划有一条合乎逻辑的路径，但许多公司试图在没有其他条件的情况下推进更高级的任务，这往往会引发问题。一种常见情况是，在数据尚未准备就绪时就开始组建数据科学团队。这种情况颇具挑战性，但并非无法补救。那么如何补救呢？通常，这需要新入职的数据科学家来解决问题。\n\
  \n最重要的是确保数据基础已存在，并且数据科学家拥有可用的工具（第 1 级）。如果足够幸运，这些敢于冒险的数据科学家能向领导层阐明这一点，但领导层未必会听从。有些组织根本不愿承认自己操之过急，也无法理解在没有达到更早的成熟度级别（即便只是拥有可用数据这一最基本要求）时，就无法开展高质量的数据科学工作。有时，你唯一能做的就是继续前行。\n\
  \n然而，一旦数据基础建立起来，数据科学家应努力说服领导层组建商业智能和数据分析团队。但这很可能不会很快实现，因此数据科学家可能不得不自行承担这些角色。这对这些数据科学家来说可能非常令人沮丧，因为这通常意味着他们无法从事自己真正想做的数据科学工作。\n\
  \n\n\n## 关键要点与下一步\n\n构建一个全面的分析计划在商业界相对较新，但这正是成为数字化公司的一部分，而这也是当今大多数公司的目标。能够利用数据做出决策，对于组织保持相关性并取得领先地位至关重要。但许多人并未意识到，要建立一个能让领导者找到洞察并辅助决策的分析项目，需要付出多少努力。在本章中，我们讨论了成功分析计划的不同组成部分，还探讨了组织的分析成熟度等级以及在不同等级下可实施的不同分析类别。\n\
  \n在第八章#中，我将深入探讨数据安全与隐私——这些话题许多数据科学家并不特别感兴趣。但理解一些基础知识非常重要，本章将讨论这些部分及其原因。我会涵盖数据安全的不同领域、作为人权的数据隐私以及个人身份信息（`PII`）。接着，我会介绍当前存在的各种类型的安全入侵及其规避方法。我还会涉及一些数据安全与隐私相关的法律法规。\n\
  \n## 实践者简介：泰勒·哈金\n\n**姓名：** 泰勒·哈金  \n**职位：** 商业智能分析师/数据顾问  \n**行业：** 咨询  \n**经验年限：**\
  \ 1 年数据科学家经验，15 年技术领域经验  \n**教育背景：**  \n* 加尔文数据科学强化训练营  \n* 心理学学士  \n* 心理学副学士  \n\
  \n*此处观点仅代表泰勒本人，与其现任及前任雇主无关。*\n\n### 背景\n\n获得学位后，泰勒曾从事一些毫无发展前景的工作。于是，他研究了各种选择，包括攻读`MBA`、再读一个硕士学位以及参加训练营。在一次工作中，由于小公司的数据库管理员离职，他接手了部分数据库工作，并对此产生了兴趣，但他意识到需要学习编程。这些兴趣在他寻找合适选择时发挥了作用，他最初关注的是数据科学及其他高薪的信息类职位。他对所有选项进行了分析——实际上，他做了一次非正式的`ROI`（投资回报率）研究，认为训练营是最具价值的选择。训练营既紧凑又短期，因此他能比任何研究生学位更快地开始赚钱。训练营强度确实很大，他尝试了好几次才被录取，但一旦入学，他就知道这是个明智之举。他虽然并非顶尖学员，但学到了大量知识并疯狂拓展人脉。他在训练营结业展示后获得了多次面试机会。\n\
  \n### 工作经历\n\n泰勒在一家分析咨询公司找到了工作，并全身心投入其中。他与另一位优秀的数据科学家共事，后者成为了他的良师益友，让他受益匪浅。尽管他享受数据科学工作，但他渴望在技术领域体验更多角色，于是在咨询公司内部转岗，尝试了项目管理和销售等职位。这些工作既有趣又充满挑战，但最终因高压咨询工作而感到疲惫。他在科技销售领域待了一段时间，随后转向产品管理。这些岗位仍然压力较大，于是他转行进入科技教育领域，负责编写文档和学习模型，却不幸遭遇裁员。在求职过程中，他决定专注于那些与他曾经喜欢且工作过的公司处于同一细分领域的公司，并很快找到了现在的理想职位。\n\
  \n### 语录集锦\n\n**工作中最喜欢的部分：** 泰勒热爱编程，尤其喜欢完成复杂任务后，仍能向非技术人员清晰解释的过程。他也享受与更懂行的人合作学习的过程——这是最佳学习方式。此外，他也无法抗拒这份工作带来的“光环”——当你说自己是数据科学家时，人们会对你刮目相看。\n\
  \n**工作中最不喜欢的部分：** 通过咨询公司做数据科学最糟糕的一点是，你通常无法看到项目的长期走向。此外，虽然他很享受向领导者解释复杂事物，但有时他们傲慢且不接受建议——而且往往远没有他们自己认为的那么博学。从那些根本不知道自己想要什么的人那里收集需求，总是令人痛苦。\n\
  \n**最喜欢的项目：** 他在咨询公司最早参与的数据科学项目之一是与一家大型零售商合作。他与公司另一位资深数据科学家共事，在一个涉及预测该零售商特定门店销售额的迷人项目中学到了大量知识。他们创建了一个相当复杂的集成机器学习模型，依赖于最前沿的算法。他喜欢他们通过知识结合试错来构建解决方案的方式。这可不是那种能直接`Google`一下复制粘贴代码就能完成的事。\n\
  \n**教育如何与现实挂钩：** 泰勒认为他的训练营比一些硕士学位更好，因为他接触的是真实数据，并且每天有两次现场编程练习，这让他习惯了在时间压力下处理杂乱数据。许多硕士课程甚至不涉及这些内容——他在与学分析专业的毕业生共事后才了解到这一点。他们往往缺乏紧迫感，也不重视数据准备的重要性。\n\
  \n**最常用的技能：** 沟通、认真做笔记以及多提问。技术技能固然重要，但与软技能相比仍显逊色。\n\n**当前主要使用的工具：** `GitHub`、`Python`、`SQL`（`SQL\
  \ Server`）、`Google`和`ChatGPT`\n\n**数据科学的未来：** 我们正处于一个奇怪的阶段，人们认为生成式`AI`能解决所有数据科学问题。但它太不可靠且容易产生幻觉——泰勒把它比作打字飞快但经验不足的青少年。没错，它们能生成东西——但这是我们需要的吗？我们很可能会回归过去可靠的方法。银行仍在用`FORTRAN`并非偶然——因为它管用。\n\
  \n**优秀数据科学家的特质：** 最重要的三项技能是沟通、同理心和好奇心。同理心实际上是沟通的一部分，因为它能帮助你更好地理解他人；好奇心则驱动着发现。同时，牢记伦理与安全、关注最佳实践也同样至关重要。你必须持续学习，这意味着要敢于犯错，并在经验不足时坦然承认，以便向同事学习。\n\
  \n**给有志于从事数据科学的人的忠告：** 拓展人脉，拓展人脉，再拓展人脉。即使感到不自在，也要观察别人是如何成功做到的，并尝试模仿。如果有人考虑参加训练营，一定要仔细审查——最好是与参加过的人聊聊。有些训练营质量不佳。泰勒推荐他参加过的那个。\n\
  \n*泰勒是一位商业智能与数据专业人士，在技术岗位上拥有丰富的多元化经验。*\n\n脚注 1 2\n\n"
- '# 8. 守护每个人：数据安全与隐私




  ## 引言


  我们或多或少都听说过大型企业发生的骇人听闻的数据泄露、勒索软件或其他涉及数据安全的事件。这些事件的发生往往源于流程中的某个环节出现人为失误，而黑客和诈骗分子的手段也日益高明。坦白说，大多数人在谨慎行事方面做得并不好，而要完成保护数据与信息安全所需的所有操作，其难度也远超预期。我们——所有使用计算机的人——必须做到这一点。但对于数据科学家以及任何与数据打交道的人来说，关注安全与隐私尤为重要。对数据科学家而言，隐私之所以至关重要，是因为他们处理的数据可能具有敏感性，而并非所有组织都具备良好的隐私保护实践，因此数据科学家个人可能需要承担起相应的责任。


  我们大多数人对于"安全"和"隐私"的普遍含义都有良好认知。安全关乎保障，基本意思是让我们远离危险。如果房子有锁，能阻止心怀不轨者进入，那它就是安全的。隐私与之类似，但基本意思是免于被他人观察的状态。显然，安全与隐私都是相对的——普通的家用锁无法阻止所有人，入侵者总可以简单地打碎窗户进来。窗户也会带来隐私风险——如果不加遮挡，别人就能看到屋内。


  数据安全与隐私不过是这些概念在数据领域的应用。它们显然相互关联，这两个词偶尔也被混用，但它们确实有不同的含义。`数据安全` 涉及保护数据免受那些企图利用数据损害公司或个人的恶意行为者侵害，这意味着将数据存储在安全的地方，仅允许合适的人员访问，并采取保护措施阻止所有其他人。从某种角度来说，`数据隐私`
  是数据安全的一个子集，因为它特指保护人们数据的安全，但它也带有一个视角：即人们有权控制自己的数据，并控制谁能看到它，即使没有明确的风险损害。例如，很多人希望自己的购物历史保持私密，即使最明显的风险不过是在浏览器中看到与自己购买物品相关的广告。而另一些人则不在乎，甚至可能喜欢这样，因为如果收到的广告更有针对性，他们更有可能发现自己感兴趣的商品正在促销。


  这不仅仅关乎浏览器广告——在处理安全和隐私时，我们往往会权衡便利性与风险，以确定我们所感知并感到舒适的安全与隐私级别。人们对什么才是合适的级别意见并不统一，而且因人而异。大多数人并不想把窗户封死，即使这样会让家更安全、更私密。我们在数据安全与隐私问题上进行的那种便利性与风险的心理权衡，正是如果我们未能认清自己的选择及其后果时，可能带来极大危险的因素之一。


  人类在大多数领域都不擅长评估风险，而安全与隐私绝对是其中几个典型领域。那些看不见摸不着的东西，人们很难将其纳入风险评估中。有些人收到陌生人邮件里的链接时会本能地产生怀疑，但对另一些人来说，这并不会引起任何警觉。链接常常通往有趣或好玩的东西，所以，如果一个轻信他人的人出于好奇，且没有任何警钟提醒他们：自己对发送链接的实体一无所知，包括发送者是否意在通过某种方式窃取他们的信息，他们就可能点击。


  显然，诈骗分子指望的就是这种场景。他们不需要每个人都点击——只需要让几个"对的人"点击就行。这种人性的弱点——即有人泄露凭证，或点击了一个会安装软件、从而让黑客获得访问权限的链接——几乎是黑客和诈骗分子针对个人和企业时惯用的基本途径。


  在本章中，我们将看几个安全漏洞的例子。我会讨论数据安全和数据隐私的各个要素，以及公司如何管理安全与隐私。我会深入探讨数据和隐私受到侵害的各种类型，并讨论个人在这些努力中应承担的责任。然后，我们将介绍一些与数据安全和隐私相关的法律。


  ## 数据安全与隐私的现实案例


  安全与隐私的本质在于，与之相关的有趣故事往往都是关于失败案例的。如果安全措施做得好，我们永远不会知道黑客险些犯下多么可怕的罪行。本节第一个例子展示了一家不负责任、本应做得更好的公司出现的重大安全失误，而第二个例子则是个人因点击一个恶意链接犯下"小错误"而可能引发后果的案例。




  '
- '# 示例 1：Equifax 大规模安全漏洞事件


  2017 年，史上最大规模的数据泄露事件之一发生，黑客攻破了 Equifax 的系统，并从当年 5 月到 7 月持续访问。Equifax 直到 7 月 28 日才发觉，此时已有近
  1.65 亿美国人、英国人和加拿大的数据遭到泄露。被窃取的数据包括：全名、地址、社会安全号码、出生日期、驾照号码、信用卡号码以及包含更多个人身份信息的争议文件。^(⁴)


  这次漏洞是一个本可轻易避免的典型案例。Equifax 在 2015 年内部审计后就已知道自身存在严重安全漏洞。他们有许多已知的安全漏洞需要修补，但却未能按自身计划完成修补工作。补丁的安装杂乱无章，缺乏监管，也没有考虑每个补丁对具体系统或数据的重要程度。


  最终导致他们失守的特定漏洞存在于一个名为 Apache Struts 的软件中，这是一个用于 Java 编程语言的网络框架。5 月初，Apache 发布了一个补丁，称所有使用该框架的网站必须立即安装。补丁发布仅数天后，安全专家就已发现黑客在试图寻找许多公司未更新的
  Struts 网站。由此可见，这明显是一个重大漏洞，但 Equifax 并未安装该补丁。^(⁵)


  2017 年 5 月 12 日，黑客通过 Equifax 使用了 Struts 且未打补丁的信用争议网站入侵了系统。在入侵初期，他们就获取了内部员工凭证，从而能够搜索更多内部系统，进而访问更多系统，且看起来像是内部用户的合法搜索。Equifax
  直到 7 月下旬才发现这次入侵。


  即便是这次发现也是偶然的，并且是 Equifax 进一步不负责任的结果。他们一个应用程序上的网络安全证书已过期九个月，直到 7 月 29 日才更新。更新后的证书能够检测可疑活动，并发现了黑客的行动，Equifax
  员工这才收到通知。他们第二天就阻止了漏洞，但直到 9 月 7 日才通知公众。


  事后，这次漏洞被调查，发现 Equifax 安全状况中的众多弱点至少应承担部分责任。显然，最重要的问题是没有按指令立即更新 Apache Struts 网站，但对补丁安装的漠不关心态度以及流程不足是主要原因。其他因素还包括：设计糟糕且不安全的内部网络、缺乏良好的漏洞检测系统，以及对个人身份信息的加密不足。


  Equifax 对漏洞的整体处理方式受到广泛批评，他们向消费者提供的服务也不达标。他们创建了两个网站，允许消费者查询自己的信息是否泄露。这两个网站在安全工具的检测中都看起来像钓鱼网站。这两个网站都不在
  Equifax 的域名下，因此消费者无法判断自己访问的是真实网站，还是误入了精心设计的仿冒钓鱼网站。此外，其中一个网站甚至无法正常工作，测试时返回随机结果。


  这些批评严重损害了 Equifax 的声誉，公司股价大幅下跌。首席信息官和首席安全官均被解雇。Equifax 还聘请了一家外部安全公司进行调查。他们不得不与联邦调查局（FBI）和联邦贸易委员会（FTC）合作。各种罚款在美国超过数亿美元，在英国超过
  1100 万英镑。该公司还遭到个人起诉，并有一项集体诉讼被提起。一个外部的全国消费者信用保护组织展开了调查（后终止），但宾夕法尼亚州总检察长领导了由美国 50
  个州总检察长组成的联盟，与 Equifax 达成和解，要求其向个人和各州支付 6 亿美元。^(⁶) 尽管这是一个胜利，但这笔钱对 Equifax 来说似乎并不算多，它仍在继续运营。


  '
- '# 示例 2：勒索软件攻击导致运营中断数周


  勒索软件对我来说一直有点离奇，直到我有个朋友在疫情期间她的公司遭受了攻击，她描述了在业务中挣扎求存的噩梦，更不用说像往常一样运营了。


  我的朋友在一家大型欧洲跨国集团下属公司的会计部门管理一个团队。她在美国太平洋西北地区工作，负责为制造业切割原材料。同一业务在美国和加拿大还有大约十个地点，从西海岸延伸到东海岸。


  一月初的那个早晨，大家在寒假后纷纷回到家庭办公室，朋友发现她无法登录工作笔记本电脑的远程桌面。她无法访问电子邮件或团队使用的任何其他软件。很快，她整个团队的短信乱飞——没人能登录，当他们向团队外求助时，得知并非只有他们有问题。显然出了状况，但几个小时后他们才知道发生了什么。


  大约中午时分，他们终于收到了 IT 部门的通知：公司遭受了勒索软件攻击，所有人原地待命。IT 部门从当天早上就开始忙乱。虽然一些细节后来才公布，但起因是一名员工点击了一个恶意链接，无意中让黑客进入了公司的许多系统。当
  IT 部门开始收到无法登录的报告时，他们进行了调查，并很快意识到问题严重，于是关闭了所有其他系统。由于无法立即访问员工记录，公司电子邮件也无法使用，就连向员工发出中午那条通知都很困难。但唯一的好消息是，由于集团的结构，一些系统未受攻击影响，包括人力资源和薪资系统，这让许多员工松了一口气。


  但在基层，会计部门当天本应是月末流程的开始，所有财务记录都要最终确定以结算 12 月份。他们显然无法做到这一点，也做不了任何其他事情，因为他们无法访问发票系统。他们也无法向供应商付款，并且由于无法访问系统甚至电子邮件，也无法联系他们。第二天，部门让每个人都创建了包含自己姓名和公司名称的`outlook.com`电子邮件地址，这样他们至少可以互相沟通，但显然无法用`jane_acmepress@outlook.com`这样的邮箱给供应商发邮件。


  IT 部门正在努力逐一恢复系统访问权限。但优先处理的实际上是那些应该进行金属切割的分支机构，因为他们完全被阻断了。虽然切割系统本身未被入侵，但他们无法访问任何订单，因此没有切割规格说明。他们积压的时间越长，核心业务受到的影响就越大。




  第三天，我朋友的团队重新获得了对 SAP 的访问权限，这是主要的企业软件，由于托管在另一个国家而未被攻破。他们仍然无法访问网络驱动器上的任何内容，但逐渐找到了一些可以做的事情。他们使用的几个系统是第三方或基于
  Web 的，因此是安全的。他们能够监控公司的银行账户，从而看到资金流入，但无法将之与内部的任何账户或文档关联起来。几天后，我朋友被要求起草一封措辞非常谨慎的实体信件，发送给他们的供应商（至少是那些他们能凑齐邮寄地址的供应商），解释他们遇到了一些“技术问题”，并将尽快支付发票。


  然而，金属切割工作仍处于停滞状态，没有人能做任何事。他们也无法就备份事宜联系客户。直到第二周，这些订单才最终被释放，切割工作才重新启动。同一周，我朋友的团队能够登录他们的远程桌面并访问电子邮件，但除此之外别无他法——而且他们所有的归档电子邮件都无法访问。他们直到四月份才能访问电子邮件档案。到第三周时，会计部门的情况基本恢复正常。他们为十二月的结账创建了一个变通方案，并且幸运地基本能够像往常一样处理一月底的结账，而由于十二月结账异常产生的差异则被上报给总部。


  员工们并未被告知最终损失了多少钱，但损失肯定高达数百万美元。公司避免了支付赎金，这一点很重要，因为尽管他们必须承担损失，但黑客并未从中获利。公司开始强制要求进行更多、更好的安全培训，并制定流程，以避免人们落入像“CEO
  发来的要求立即付款的紧急邮件”这类情感操控骗局。


  ## 数据安全


  数据安全非常重要，几乎所有公司都有一个通常称为“信息安全”的团队来管理它。该团队对公司的数据安全以及所有确保数据安全的政策和技术解决方案负有最终责任。他们职责的另一个重要部分是教导与数据打交道的个人，让他们认识到保护公司数据是每个人的个人责任。


  信息安全部门之所以必须教导人们他们在保护公司数据中的作用，原因之一是大多数人对于外界的危险只有模糊的认识。这属于“眼不见，心不烦”的问题。人们经常听说暗网，但不一定知道它是什么。暗网是万维网的一部分，只能通过能保证用户匿名性和隐私的特殊工具访问，并且与非法活动以及获取被盗数据的场所高度关联。


  通常将那些试图窃取数据或以不良方式利用数据来伤害公司或个人的人称为不良行为者。这些人包括黑客、诈骗者，甚至垃圾邮件发送者。黑客是指未经授权访问系统的人，无论是黑帽（意图造成伤害）还是白帽（受雇于公司以识别弱点并加以修复的人）。诈骗者是指在现实世界和计算机世界中通过欺诈或其他方式骗取他人钱财或信息的人。垃圾邮件发送者是指向人们发送大量电子邮件或其他未经请求消息的人，通常怀有恶意，但总是试图从人们那里获取某些东西。令许多人感到震惊的是，这些不良行为者并非孤独地待在母亲地下室的年轻男子——他们背后有一个完整的犯罪网络，这些人经常在某些国家普通的办公楼里运营，甚至举办公司圣诞派对。


  信息安全部门负责将所有这些通常通过机器人和其他软件运作的人挡在公司的系统之外。他们通过一系列政策和工具，遵循该行业一些最重要的原则来做到这一点。


  数据安全通常被认为包含三个要素：机密性、完整性和可用性。这些要素构成了所谓的 CIA 三元组，如图 8-1 所示。机密性意味着只有正确的人才能访问数据，这包括阻止外部黑客入侵，同时也管理内部访问权限。例如，并非每个人都需要访问人力资源数据或产品成分。完整性意味着数据处于其应有的状态——没有被任何人无意或恶意修改。这涉及到明智地管理访问权限，这也是数据科学家和其他数据用户通常只被授予数据源读取权限的原因之一——数据科学家没有理由更改源表中的数据，而没有写入权限可以防止他们意外修改。最后，可用性意味着在正确的人需要时，数据是可用的。


