  \n脚注 1 2 3\n\n# 14. 准备好迎接重头戏：特征工程、选择与降维\n\n\n\n## 引言\n\n特征处理是运行机器学习模型前整体必要数据准备流程的一部分，对于获得良好结果可能至关重要。在数据分析中，我们通常不会进行太多特征工程。特征工程通常与机器学习相关，因为你所使用的特征可能成就或毁掉一个机器学习模型。\n\
  \n那么特征究竟是什么？我们在本书中一直将这个术语与“变量”交替使用，有时也与“列”混用，这并不算错。*特征*只是数据中代表其表征特性的一个值，它是机器学习中的首选术语，尽管训练中使用的特征也可以称为*自变量*。结果（即我们试图预测的内容）通常被称为*目标变量*，但也可能被称为*因变量*。在本章中，我将主要使用“特征”和“目标变量”这两个术语。\n\
  \n根据上下文和领域的不同，特征可能易于理解且直观，也可能几乎完全晦涩难懂。在关于电子游戏玩家的数据中，特征可能是直观的，比如年龄、性别、拥有的游戏主机、拥有的游戏、游戏评分和评论。而对于不太直观的情况，你可能拥有一组图像数据，每张图像都有一百个特征，其名称类似`SHAPEFEATURE_1`、`SHAPEFEATURE_2`等等。\n\
  \n在本章中，我将讨论*特征工程*，其重点是处理单个特征并根据现有数据的各个方面创建新特征；还将讨论*特征集改进*，这涉及将所有特征视为一个整体，选择正确的特征或将它们组合起来，使整体特征集达到最有效。特征集改进既包括*特征选择*（从现有特征中挑选特定特征），也包括*特征投影*或*降维*（利用数学技术将现有特征组合成新特征，供机器学习模型使用）。当特征数量较多（数百甚至数千）时，特征投影最为常见。\n\
  \n# 现实世界中的特征工程实例\n\n人们普遍认为，特征工程是机器学习前必要的数据准备的一部分，但也有一些研究人员通过比较使用和不使用良好特征工程的机器学习效果，在几个不同领域证明了这一点。两种情况下都明显表明，良好的特征工程改进了模型。\n\
  \n## 实例 1：专家特征工程\n\n一个研究小组在两个医学结果预测应用中，研究了在特征工程过程中引入数据科学家以及领域专家所带来的影响。^(³⁵) 第一个应用预测患者的跌倒和骨折情况。第二个应用预测抗癫痫药物引起的骨缺损副作用。他们建立了预测模型，并比较了仅由领域专家（标准做法）选择的特征集与数据科学家与领域专家合作引入更复杂特征的特征集的性能。他们执行了所有合适的标准机器学习任务，包括数据准备、特征工程、特征选择和数据集平衡。该研究以两种不同的方式（有数据科学家和无数据科学家）进行了特征工程和选择。他们明确发现，虽然仅由领域专家处理时性能尚可，但引入数据科学专家后性能显著提升。我们将在后续章节讨论性能测量，但在第一个项目中，加入数据科学家将准确率从\
  \ 61%提高到了 82%，在第二个项目中，则从 80%提高到了 91%。\n\n## 实例 2：更有效地检测辐射\n\n其他一些研究人员进行了类似的研究，表明在众多可用于获得更准确机器学习结果的技术中，高质量的特征工程可以带来最大的改进。^(³⁶)\
  \ 他们还发现，特征工程还可以提高模型本身的可解释性。他们研究了三种条件下的辐射检测：有遮挡物、有本底辐射、既无遮挡物也无本底辐射。他们的模型预测了辐射源所在方向的角度。他们使用了随机森林模型，并像前一个实例中的研究人员一样，进行了常规的数据准备和机器学习训练。他们最终发现，特征工程在所有三种条件下都大幅改善了结果。\n\
  \n# 特征工程技术\n\n在完成上一章讨论的数据预处理工作后，现在你已经准备好进行更重要的特征微调和改进了。此时你可以应用许多技术，但首要关注领域是处理单个特征，无论是转换现有特征，还是创建交互特征或其他特征。\n\
  \n你通常会发现自己有很多特征本身就很完善，无需太多修改（除了清理和其他预处理之外）。直接使用现有特征没有任何问题，你不必因为觉得自己应该做而过分追求花哨的特征工程。但有时，它确实能带来巨大差异。\n\
  \n在预处理工作中，你已经熟悉了自己的数据。如果特征数量较少（比如 50 个或更少），你可能已经对许多甚至所有特征有了一定了解。你也许已经能感觉到哪些特征强大、哪些需要进一步调查、哪些似乎不必要或冗余、以及哪些可能不应包含。在这种情况下，很容易知道从哪里开始特征工程。但如果你有很多特征，或者这些特征不太直观，你可能就无法很好地了解各个特征的质量。\n\
  \n无论哪种情况，你都可以做更多工作来了解下一步该采取什么行动。下面“特征选择”部分讨论的一些技术有助于开始特征处理。但除了了解你的特定数据集之外，特征工程总是深受领域知识的影响。当你了解领域时，知道应该进行何种转换或如何组合特征就会容易得多。\n\
  \n只需记住，进行特征工程的整个原因是为了找到最有意义的方式来呈现你正在建模或调查的任何内容，无论是披萨店的销售数据还是患者诊断结果，因为这些信息在机器学习模型中价值最大。\n\
  \n请注意，通常当你基于一个（或多个）特征以某种方式创建新特征时，原始特征通常会在后续步骤中被排除（或者你可能只是就地进行了转换）。\n\n\n\n### 转换特征\n\
  \n你可以通过多种不同方式转换现有特征来创建新特征。这些操作通常仅针对单个数值进行，但有些也可能涉及使用整列的信息。许多方法会用到数学运算或统计技术。\n\n\
  一种常见方式是*多项式特征*，即通过将一个特征提升到二次或更高次幂来创建，以便捕捉与目标变量的非线性关系。另一种统计方法可能涉及计算分位数，这需要在为每一行赋值之前查看整个列。\n\
  \n但还有其他许多可能性。在零售业中，按单位跟踪数据很常见。想象一家披萨店想要了解其披萨的整体销量。由于披萨有不同的尺寸，没有明确的方法能在不丢失信息的情况下合并不同尺寸的单位。但他们可以创建一个新变量，表示售出披萨的平方英寸数，这样所有这些数值就可以相加了。具体示例如表\
  \ 14-1 所示。\n\n**表 14-1** 为披萨店创建的新转换特征 `Sq. Inches Sold`\n\n| 订单编号 | 尺寸 | 售出数量 |\
  \ 销售额 | 售出平方英寸数 |\n| --- | --- | --- | --- | --- |\n| 1 | 个人装 | 1 | 12.50 | 45 |\n\
  | 2 | 大装 | 1 | 21.00 | 154 |\n| 3 | 中装 | 2 | 34.00 | 226 |\n| 4 | 大装 | 1 | 25.00\
  \ | 154 |\n| 5 | 个人装 | 3 | 37.50 | 135 |\n| 6 | 大装 | 2 | 47.50 | 308 |\n\n通常，在创建转换特征后，你不会在同一个模型中使用其他特征。这是因为有时会导致信息被重复包含，从而影响结果。（这基本上就是我稍后会提到的共线性问题。）由于新的披萨特征（`Sq.\
  \ Inches Sold`）是通过（一个特定的乘数）结合了 `Quantity Sold` 和 `Size`，我们不应在同一个模型中同时使用这三个特征。我们可以考虑要么包含\
  \ `Quantity Sold` 和 `Size`，要么包含 `Sq. Inches Sold`。\n\n### 交互特征\n\n*交互特征*是基于至少两个其他特征，通过某种数学运算（通常是乘法或加法，但也可以是其他运算）创建的新特征。这些操作通常只在一行内进行。你不会无缘无故地把几个特征相乘——交互特征旨在捕捉不同特征之间的关系，以及这种关系具体如何影响目标变量。如果你有多个相关的特征，取它们之间的\
  \ `min`、`max` 或 `average` 作为交互计算的起点，可能比包含所有特征更有意义。\n\n披萨店可能会根据我们上面添加的新特征（售出平方英寸数）使用的一个交互特征示例，是每平方英寸的总销售额。该计算见表\
  \ 14-2。\n\n**表 14-2** 为披萨店创建的交互特征 `Sales per Sq. In.`\n\n| 订单编号 | 尺寸 | 售出数量 | 销售额\
  \ | 售出平方英寸数 | 每平方英寸销售额 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 个人装 | 1 |\
  \ 12.50 | 79 | 0.158 |\n| 2 | 大装 | 1 | 21.00 | 154 | 0.136 |\n| 3 | 中装 | 2 | 34.00\
  \ | 226 | 0.150 |\n| 4 | 大装 | 1 | 25.00 | 154 | 0.162 |\n| 5 | 个人装 | 3 | 37.50 |\
  \ 236 | 0.159 |\n| 6 | 大装 | 2 | 47.50 | 308 | 0.154 |\n\n通常，在创建交互特征后，你不会在后续工作中再使用它所涉及的原始特征，这与转换特征类似。新的披萨特征涉及用\
  \ `Sales` 除以 `Sq. Inches Sold`，而且我们知道 `Sales` 与 `Size` 和 `Quantity Sold` 都相关，所以情况开始变得复杂。但有时你并不知道原始特征还是新的交互特征在模型中的表现会更好，因此有时你会对所有特征进行测试。这就是特征选择重要的原因。我们将在下面进一步讨论。\n\
  \n### 虚拟变量\n\n我们讨论过的大多数技术都只适用于数值数据。另一种特别适用于分类数据的常用技术是创建虚拟变量。*虚拟变量*是从一个包含多个值的原始特征派生出来的。每个值都被转换成一个单独的列，该列代表该值，并包含一个二进制值指示原始列中是否是该值。对于给定的某一行，除了与原始列值匹配的那一个虚拟变量外，其他虚拟变量均为\
  \ `0`。\n\n表 14-3 是一个涉及所订购披萨类型的示例。这里，每一行代表一份特定披萨的订单，因此我们仅在一个对应类型的单列中用二进制值记录披萨的类型。\n\
  \n**表 14-3** 从 `Type` 字段创建的四个虚拟变量\n\n| 订单编号 | 类型 | 至尊 | 素食 | 肉食爱好者 | 双料 | 三料 | 多料\
  \ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | 至尊 | 1 | 0 | 0 | 0\
  \ | 0 | 0 |\n| 2 | 双料 | 0 | 0 | 0 | 1 | 0 | 0 |\n| 3 | 三料 | 0 | 0 | 0 | 0 | 1 |\
  \ 0 |\n| 4 | 多料 | 0 | 0 | 0 | 0 | 0 | 1 |\n| 5 | 素食 | 0 | 1 | 0 | 0 | 0 | 0 |\n\
  | 6 | 肉食爱好者 | 0 | 0 | 1 | 0 | 0 | 0 |\n\n与其他类型的特征一样，通常在创建虚拟变量后，原始特征会从后续工作中排除。因此，我们将在模型中使用这些虚拟特征，而不再使用\
  \ `Type` 特征。值得一提的是，如果我们有 *n* 种不同的类型，我们实际上只需要 *n* – 1 个虚拟变量。在上面的例子中，最后一个虚拟变量（`Multi-Topping`）取值为\
  \ `1` 时，恰好与其余五个变量均为 `0` 的情况相同。有时出于这个原因，最后一个虚拟变量会被剔除。\n\n### 特征合并与拆分\n\n你可能还想对特征进行字面意义上的合并。想象一下，有数据将年龄存储在两个不同的字段中：`years`\
  \ 和 `days`。一旦你确认了 `days` 列存储的是超出 `years` 列的天数，你就可以简单地将它们合并。你可以将 `years` 字段转换为总天数，然后加上\
  \ `days` 列的值，从而创建一个总天数字段；或者将 `days` 列转换为代表一年已完成比例的小数，然后加到 `years` 列上，从而创建一个新字段。无论哪种方式，你都得到了一个合并了其他两列的新列。\n\
  \n将一列拆分为多列也很常见。这与创建虚拟值不同，因为它会获取单列中的数据，并将其拆分为多列，这些列包含原始列中的特定值，且都位于同一行。在宠物数据中，常见做法是将性别和绝育状态存储在一个单独的列中，但你可能希望将它们放在两个单独的列中，一个只存储性别，另一个只存储动物是否已绝育。作为二进制特征，它们可能比一个具有四个值的单一特征更有价值。\n\
  \n表 14-4 展示了一个在宠物数据中进行拆分和合并的示例。如果我们想要一个同时包含主人姓名和宠物名字的字段，我们可以轻松地将姓氏和宠物名字合并为一个。类似地，我们也可以将合并的性别和绝育状态拆分为新的独立字段。\n\
  \n**表 14-4** 通过合并与拆分创建的新特征，左侧为原始数据，右侧为新数据\n\n| 宠物名 | 主人姓氏 | 宠物性别/绝育状态 |   | 编码后的宠物名\
  \ | 宠物性别 | 是否已绝育 |\n| --- | --- | --- | --- | --- | --- | --- |\n| Michael | Smith\
  \ | 公/未绝育 |   | Smith, Michael | 公 | 否 |\n| Marlowe | Jessup | 公/已绝育 |   | Jessup,\
  \ Marlowe | 公 | 是 |\n| Luna | Vintner | 母/已绝育 |   | Vintner, Luna | 母 | 是 |\n| Bella\
  \ | Rodriguez | 母/已绝育 |   | Rodriguez, Bella | 母 | 是 |\n\n与其他特征调整一样，在未来的建模中，我们通常不会将旧字段（用于拆分或合并的那些字段）与新字段一起使用。\n\
  \n\n\n# 编码、频率与聚合特征\n\n本节目前为止讨论的大多数技术都涉及对单个样本或行进行操作。还有许多有价值的特征可以基于整个列的数据来创建。有多种方法可以推导出高质量的特征，但这里我们将讨论三种主要方法：编码、频率计数和聚合。所有这些方法都可以与本部分的其他技术结合使用，例如用于创建交互特征。\n\
  \n## 目标编码\n\n一种常用技术是*目标编码*，即根据每个类别值在特定目标值中出现的比例对类别特征进行编码。它在异常检测任务（如欺诈检测——当你要寻找的目标非常罕见时）中特别常见，但也可用于其他场景。例如，假设我们拥有包含\
  \ II 型糖尿病诊断结果（患病与否）的患者数据。我们知道某些特征与患糖尿病相关，例如`BMI`、`年龄`和`活动水平`。如果我们将`BMI`和`年龄`进行分箱，并将`活动水平`作为类别特征，我们就可以看到每个分箱中有多少人患有糖尿病。例如，也许\
  \ 60-70 岁年龄段中有 18%的人被诊断为糖尿病，因此我们可以在新的目标编码年龄特征中存储值`0.18`。所有处于 60-70 岁年龄段分箱中的样本都具有相同的目标编码年龄，但这些值在模型中与其他特征结合使用时可能非常有价值。我们可以对`BMI`和`活动水平`做同样的处理。\n\
  \n请参见表 14-5 了解可能的样子示例。在这些数据中，我们对`年龄`、`BMI`和`活动水平`进行了分箱，计算了每个分箱中目标值为正（确诊 II 型糖尿病）的比例，并将该值添加到原始数据中，但表中不保留分箱信息。\n\
  \n**表 14-5** 包含新目标编码特征的医疗数据\n\n| ID | 年龄 | BMI | 活动水平 | 目标编码-年龄 | 目标编码-BMI | 目标编码-活动\
  \ |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | 56 | 29 | 低 | 0.09 | 0.19\
  \ | 0.26 |\n| 2 | 63 | 26 | 中 | 0.18 | 0.19 | 0.15 |\n| 3 | 21 | 20.5 | 高 | 0.01\
  \ | 0.04 | 0.02 |\n| 4 | 37 | 26.5 | 低 | 0.04 | 0.19 | 0.26 |\n\n## 频率编码\n\n另一种编码类型是*频率编码*，它与目标编码类似，不同之处在于你编码的是特定类别特征值的计数。在上述糖尿病数据示例中，我们可以添加一个新特征，用于存储整个数据集中特定年龄分箱的总计数。如果\
  \ 60-70 岁年龄段的分箱中有 3,450 人，那么所有属于该年龄分箱的样本在新特征中的值都是 3,450。表 14-6 显示了表 14-5 中的数据经频率编码后的结果。\n\
  \n**表 14-6** 与表 14-5 相同的医疗数据，但包含频率编码特征\n\n| ID | 年龄 | BMI | 活动水平 | 频率编码-年龄 | 频率编码-BMI\
  \ | 频率编码-活动 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | 56 | 29 | 低 |\
  \ 73 | 131 | 192 |\n| 2 | 63 | 26 | 中 | 121 | 131 | 113 |\n| 3 | 21 | 20.5 | 高 |\
  \ 11 | 26 | 19 |\n| 4 | 37 | 26.5 | 低 | 27 | 131 | 192 |\n\n## 缩放、归一化与二值化\n\n缩放、归一化和二值化都涉及查看所有行中的单个列，并根据每个行的值与该列整体值的关系来转换该行的值。缩放会设定一个具有最小值和最大值的范围，例如所谓的*最小-最大缩放*中的\
  \ 0 和 1，这将导致每个行的值按比例转换以适应该范围。有时我们也希望将几个甚至所有特征缩放到相似的尺度上，这是通过一个称为*归一化*的过程来实现的，该过程将许多特征缩放至相同的定义范围。请注意，有些类型的机器学习算法要求进行归一化，因此理解这一点很重要。你也可以对数据进行*二值化*，根据阈值将所有值转换为\
  \ 0 或 1。表 14-7 显示了一些学生数据在进行缩放、归一化和二值化之前的情况。\n\n**表 14-7** 一些学生数据（转换前）\n\n| 学生编号\
  \ | 年龄 | 奖学金金额 | 社团数量 | 英语成绩 | 数学成绩 |\n| --- | --- | --- | --- | --- | --- |\n|\
  \ 1 | 18 | 0 | 2 | 81 | 89 |\n| 2 | 20 | 1,500 | 0 | 57 | 60 |\n| 3 | 21 | 25,000\
  \ | 3 | 80 | 92 |\n| 4 | 21 | 17,000 | 0 | 93 | 94 |\n| 5 | 18 | 9,000 | 4 | 90\
  \ | 78 |\n| 6 | 22 | 0 | 1 | 49 | 81 |\n| 7 | 19 | 12,000 | 2 | 96 | 91 |\n| 8 |\
  \ 21 | 750 | 1 | 75 | 81 |\n| 9 | 20 | 21,500 | 3 | 86 | 79 |\n| 10 | 18 | 15,000\
  \ | 0 | 62 | 58 |\n\n如果我们对`年龄`、`奖学金金额`和`社团数量`使用最小-最大缩放（范围 0-1），那么我们也对它们进行了归一化，因为我们对这三者使用了相同的尺度。我们还可以根据及格线（60\
  \ 分及以上为及格）对两门成绩进行二值化。表 14-8 展示了此操作后的结果。\n\n**表 14-8** 一些学生数据经过缩放、归一化和二值化后\n\n| 学生编号\
