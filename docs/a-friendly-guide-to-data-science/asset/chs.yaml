  \ 975 小于 1750，因此走左分支，这会到达一个预测评分为 4 的叶节点。\n\n尽管线性回归模型和决策树模型都有点技术性，一些利益相关者可能难以理解，但它们是完全透明的，大多数人都能学会如何解读。此外，你可以用更少技术性的方式展示这棵树，甚至用手在白板上画一个，以降低其令人望而生畏的程度。透明度是可解释性的基石。\n\
  \n数据科学的另一个科学方面是对`可重复性`的需求，这意味着你或其他人应该能够轻松地再次运行你的流程并获得相同的基本结果。因此，以某种方式记录你的流程，并确保任何尝试重复你流程的人都能持续获得相关数据，这一点很重要。这里值得提及的一个概念是确定性——一个`确定性`流程意味着每次运行都会得到完全相同的结果，而一个`非确定性`流程可能产生不同的结果（有时差别很小，有时差别很大）。有些技术是确定性的，有些则不是——我将在第\
  \ 15 章中详细讨论。通常，影响可重复性的一个重要因素是计算机语言中可用的随机值生成器，它们并非真正的随机。我们称之为伪随机。确保结果可重复的一种方法是在运行任何非确定性算法之前，在代码中手动设置随机种子，因为这能保证起始点相同。\n\
  \n与可重复性相关的一个概念更侧重于直接的代码`复用`，可能包括编写其他人可以在其代码中调用的函数，或者直接复制粘贴。这样做的好处是，团队中的每个人都以相同的方式做事，并且当你一年后回看之前的工作时，可能只需稍作调整就能重新运行代码。\n\
  \n`可信度`是封装了伦理、合法性、隐私和安全性（这些方面常常相互影响）的数据科学价值。从根本上说，这是关于确保你所做的工作保持在道德和法律界限内，并且不损害个人或公司的隐私与安全。所有这些都将在本书后面进行更深入的探讨，但需要记住的重要一点是，数据科学家需要有责任心，了解与他们所使用的数据和流程相关的法律以及公司关于隐私和安全的规则，并拥有自己的道德指南针，时刻将伦理记在心中。\n\
  \n`可理解性`和`可共享性`是另外两个相关的数据科学价值，分别指你的结果易于理解和易于分享的程度。这两者既适用于你的利益相关者，也适用于你的同行。与利益相关者的可共享性，基本上指的是我们首次在第\
  \ 5 章中看到的 CRISP-DM 生命周期中的最后一步（参见下方图 6-3 的另一个示意图）。那最后一步，即可视化与展示，完全关乎如何将你的成果分享给利益相关者。分享方式取决于你的公司和利益相关者，可能是幻灯片演示或内网上的一个网页。但是，仅仅让你的结果易于获取还不够——它们还需要易于理解（尤其是我们上面讨论过的可解释性）。我们已经讨论过理解利益相关者出发点和背景的重要性，这样你才能为他们提供不令人生畏且能够理解的信息。\n\
  \n可共享性也可以追溯到复用和可重复性，因为数据科学家之间经常分享结果、流程和代码，可理解性在此也起着作用。大多数数据科学家喜欢了解同行在做什么，但他们也会关注与利益相关者不同的事情。因此，你可能需要分享不同的信息，包括代码。你的同事可能想要复用你写过的某些内容，或者遵循你创建的流程。这样一来，可理解性也意味着让你的代码和流程对同事更加友好——包括清晰的步骤说明、注释完善的代码以及其他能让他人轻松理解（并重复或复用）你工作的内容。\n\
  \n## 组织如何运用数据科学\n\n正如我上面提到的，许多组织谈论数据科学是为了吸引眼球，但实际上由于缺乏数据基础设施和工具，它们并不具备实施数据科学的能力。但有些组织确实成功地运用了数据科学，有时效果显著，有时则不然。组织运用数据科学主要有三种基本方式：理解、规划和自动化。\n\
  \n\n\n### 理解\n\n数据科学最常见的用途之一是更深入地了解组织所服务的人群或对象，以及组织的运营状况。这通常涉及对历史数据的分析。数据科学往往在已有数据分析工作的基础上更进一步，但通常并不会完全取代现有的数据分析流程。\n\
  \n例如，一家披萨餐厅可能想更深入地了解顾客，于是他们可以开展一项顾客画像调查。他们可以利用一种名为聚类（clustering）的机器学习技术，根据顾客的属性（如果足够幸运能拥有顾客数据的话）将不同顾客分群。他们可能会发现存在四种主要顾客类型：工作日的午餐匆忙客、工作日的晚餐食客、深夜的醉酒访客，以及周末的悠闲逛客。这种分类对于针对不同类型的顾客推出不同的特价活动和营销方案非常有帮助。\n\
  \n同一家餐厅可能还想评估一次针对这些顾客类型开展的营销活动。他们可以分析活动前后数周的销售数据，看看是否存在差异。这有助于评估该活动的效果，以及它对四类顾客行为产生的影响。他们可能会发现，深夜的啤酒特价吸引了更多深夜访客，并因啤酒的利润远高于披萨而显著提升了整体利润。\n\
  \n### 规划\n\n数据科学也大量应用于规划目的。这既可以通过分析不同努力的成果来决定继续推进哪些项目，也涉及实际的预测工作——因此它既可以聚焦于历史数据，也可以着眼于预测未来，或两者兼顾。任何预测都依赖于历史数据才能生成。\n\
  \n如果这家披萨餐厅对上次营销活动的成功非常满意，他们可以深入研究，找出活动中最成功的具体环节。这些信息对于规划未来继续推出哪些类型的特价活动、以及如何调整不太成功的方案都极具价值。\n\
  \n他们甚至可以更进一步，创建一个基于四类顾客类型预测未来销售额的模型。这将有助于他们精确掌握需要订购多少食材和烹饪用品。\n\n### 自动化\n\n组织运用数据科学的最后一种方式是实现自动化，这可以通过多种途径达成。通常（但并非总是）这意味着包含预测未来的元素，尽管与任何预测一样，历史数据仍然至关重要。自动化还可能包括：在客户关系管理（CRM）系统中自动将新客户分配给销售代表，在大学咨询系统中自动估算完成学位的可能性，或在约会应用中自动进行用户匹配。许多公司已经在做这些事情，但他们可以通过引入机器学习技术做得更好（或更快）。\n\
  \n对于这家披萨餐厅而言，自动化可能包括：自动为新顾客打上标签，为披萨配送司机规划最优路线，或者每周日晚上自动更新一张包含未来两周预测数据的表格，以便与订购系统对接，自动订购食材和供应品。\n\
  \n## 数据科学家的品质与角色\n\n数据科学家并非只有一种类型。不同的角色有不同的侧重点。有些数据科学家可能接近于数据分析师，因为他们的大部分工作并不涉及其他人可能从事的更严谨的机器学习工作。有些人可能大部分时间埋头于\
  \ `Python` 机器学习代码中，难得抬头。还有一些人则可能发现自己更多地是与利益相关者打交道、进行高层规划，而非使用数据工具。后续章节将更详细地讨论不同类型的数据科学角色，以及如何找到最适合自己的那一类，其中也会包含一些职业建议。\n\
  \n前一章中概述的职能、技术和软技能同样适用于数据科学家，尽管不同类型的角色会对某些技能有所侧重。但对数据科学家来说，最重要的技能包括好奇心、耐心、有条理以及成长型思维。好奇心驱使你发现值得提出的有趣问题，从而带来最有价值的发现。耐心必不可少，原因很多，但最主要的是即使你想立即开始建模，也必须等到数据准备就绪。有条理且注重细节能帮助你避免错误，并建立逻辑清晰、易于重复的流程。最后，在这个以及许多其他技术领域，成长型思维是必需的——总有新的工具和技术不断涌现，你永远不知道哪一项可能正是你的项目所需要的。\n\
  \n\n\n"
- '# 主要收获与接下来内容


  数据科学确实能带来很多价值，但它并非魔法，尽管许多领导层人士相信这一点。数据科学已从数据分析中演变出更为复杂的形式，对于那些理解其能力边界的企业而言，它大有可为。若拥有优质数据，数据科学家能帮助企业理解数据、制定计划和决策，并自动化那些耗时或不准确的流程。数据科学包含若干核心价值，包括简洁性、可解释性、可重复性、可信度、可理解性和可共享性。


  `简洁性`意味着数据科学解决方案应在保持有用性的前提下尽可能简单。`可解释性`要求解决方案产生的结果必须能被解释（倾向于白盒方案而非黑盒方案）。`可重复性`要求数据科学家遵循严谨的代码规范与流程，使得工作能够被复现（从而确保结果的可靠性）。`可信度`关乎让利益相关者及其他人员相信你的解决方案是有效、合乎伦理，且具备适当安全性和隐私保护的。`可理解性`虽与可解释性部分相关，但更侧重于整体工作的可理解性（而不仅仅是结果本身），这一点与可重复性有共同目标。最后，`可共享性`指的是你能多容易地将结果分享给利益相关者、同事（以及领导），这需要关注多个方面，且与可理解性相关联。请注意，这些价值并非总是同等重要——如果可解释性并非必需且更高的准确性更为关键，那么它尤其可以被舍弃。


  在下一章中，我们将探讨现代“数据分析”这一概念——另一个以不同方式被使用的术语。但在这里，它指的是一项涉及与数据打交道以提取洞察的方方面面内容的举措，涵盖了从最初获取数据，到使其可用，再到执行业务智能（主要为基础报告）、数据分析和数据科学的全过程。我将逐一讨论这些领域，以及它们在不同组织中如何（或不如何）协同运作。


  '
- '# 实践者档案：劳伦·詹森


  **姓名：** 劳伦·詹森


  **现任职位：** 数据科学家


  **当前行业：** 零售业


  **从业年限：** 10 年分析经验


  **教育背景：**


  - 高级机器学习学士后证书

  - 基于 R 的统计分析学士后证书

  - 商业与政治学文学士


  *本文所述观点仅代表劳伦个人，与其现任或历任雇主无关。*


  ### 背景


  劳伦·詹森一直对政治充满兴趣，并在很长一段时间内立志成为一名政治演讲稿撰写人。她在大学期间攻读了商业与政治学文学士学位。在校期间，她成功获得了民主党全国委员会（DNC）在巴拉克·奥巴马竞选期间的一个竞争激烈的实习机会。通过那次竞选活动，她接触到了竞选团队如何运用分析学。当她看到分析结果显示他们在战场州——即奥巴马对手的家乡俄亥俄州——处于领先地位时，团队将资源重新分配给了其他战场州，却依然赢得了俄亥俄州。这非常了不起，并且只能通过分析学实现，这让她彻底着了迷。


  ### 工作经历


  大学毕业后，劳伦在一家零售店短暂工作过，随后在一家零售公司的营销分析部门找到了一份工作。当时团队并未进行太多高级分析工作，但他们希望朝这个方向发展。劳伦最终做了一些基础工作，处理一些营销邮件和优惠券手册，这些工作最初并不涉及任何数据科学，但后来出现了做一些更深入分析和更复杂报告的机会，她发现自己热爱这份工作。她希望提升自己的技能以便转入一个涉及更多数据科学工作的岗位，于是她报名参加了基于
  R 的统计分析证书课程，后来又学习了高级机器学习证书课程。她成功在公司内部调动到了一个专注于高级分析的团队，因此她得以在从事对业务有实际影响的趣味工作的同时，持续提升自己的技能。


  在那个岗位上工作几年后，劳伦决定寻求新的挑战，于是转行做了咨询。这份工作让她接触到了自然语言处理和生成式 AI，这两者对她来说既新鲜又迷人。在这个职位上她承担了更多领导责任，她也很享受这一点。后来她重返零售业担任新职位，她丰富的经验对一个仍在与业务部门建立关系的团队来说非常有益，因为分析学对该公司来说还相当新。


  ### 精彩语录


  ### 工作中最喜欢的部分


  劳伦喜欢与不同类型的人共事。她也很享受工作中项目种类繁多、总有新谜题需要解决的感觉——而且通常有不止一种解决方法，因此找出最佳方案本身就是乐趣的一部分。


  ### 工作中最不喜欢的部分


  人们对数据科学能做什么抱有不切实际的期望，并且往往在未与真正了解可能性的人讨论的前提下，就自行决定了想要什么。有时，某件事在理论上可能可行，但在特定时间、特定组织内却不可行，例如受限于数据或基础设施的限制。劳伦在咨询工作中尤其看这种情况：策略人员做出不可能实现的承诺。


  ### 最喜欢的项目


  劳伦在担任咨询顾问时做过一些队列分析。她研究了社交媒体是否能够用来弥补因第三方 Cookie 数据不再可用而产生的数据损失。她发现，是的，如果利用正确的平台并创建有效的广告，它是可以做到的。这个项目最有趣的地方在于，她发现如果方法得当，它甚至可能比第三方
  Cookie 更有价值。


  ### 教育与现实世界的联系


  劳伦教过学生，也在工作中与很多实习生共事过，她发现他们中很多人期望一切都很容易，当现实并非如此时，他们会感到惊讶。教育在培养灵活性和解决问题的能力方面做得还不够。她遇到过一些学生，期望她为每个问题都提供分步计划，但当她解释说这不是千篇一律的——每个问题都略有不同时，他们就会感到沮丧。学生们也没有为处理现实世界中的数据做好准备。例如，用均值填充缺失值并非总是合理的。


  ### 最常用的技能


  劳伦最常用的技能是解决问题。这是各种类型的解决问题能力。最近的例子包括：弄清楚自己不知道但应该知道的事情，如何使用缺乏良好文档的前沿工具，以及项目进展不利时如何补救。这些都需要批判性思维，而当问题不总是可复现时，解决起来有时会格外困难。另一组重要的技能是与人协作的能力。这包括沟通、管理和讲述故事（基本来说，就是带着大家与你一同前行）。


  ### 当前主要使用的工具


  `Python`和`SQL`在她的整个职业生涯中都至关重要，目前她主要使用`JupyterHub`和`Snowflake`进行工作，汇报则依赖`Google Slides`。


  ### 数据科学的未来


  我们正处在十字路口，需要决定下一步走向何方。尽管数据科学和人工智能常常被过度炒作，但依然会有大型赢家——那些尽早且明智地适应和采用新技术的公司和人才——以及那些停滞不前的输家。输家将无法生存。这将意味着失业以及其他问题。同样重要的是要认识到，技术正在超越监管，而我们尚未解决所有由此产生的政治影响——这将是未来必须面对的问题。


  ### 优秀数据科学家的特质


  解决问题和批判性思维至关重要。如果你的角色更偏向数据科学光谱中的技术端，或许可以容忍较弱的社交技能，但大多数数据科学家确实需要具备良好的沟通能力。


  ### 她对未来数据科学家的建议


  熟悉数据清洗工作，因为这将是你花费大部分时间去做的事情。


  *劳伦是一名数据科学家，在营销、零售及其他行业拥有处理数字和领导数据科学团队的丰富经验。*


