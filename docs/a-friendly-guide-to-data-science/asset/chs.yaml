  约翰·斯诺绘制的显示 1854 年霍乱疫情死亡情况的地图。来源：裁剪自文件 `File:Snow-cholera-map-1.jpg`，[`commons.wikimedia.org/wiki/File:Snow-cholera-map-1.jpg`](https://commons.wikimedia.org/wiki/File:Snow-cholera-map-1.jpg)


  在地图上，所有较深的黑色标记都是表示受害者的小条。有些分布较分散，但从这张地图上可以很明显地看出，靠近宽街的某个地方使人们暴露于疾病之中。在宽街上标有 `PUMP`
  的点旁边，有一大堆死亡标记。住在附近的人们从那个水泵取水。这就是我们所说的领域知识，即关于数据来源世界的基本知识，它使得斯诺得以得出结论：起因是水泵，而不是某种原因笼罩在该地区的“瘴气”云团。斯诺是一位医生和科学家，尽管细菌理论还要过几年才能建立，但专家们已经对瘴气理论产生了怀疑。斯诺思考了居住在该地区人们的日常生活，意识到他们都会取水，因此那是一个潜在的源头。当他们关闭宽街水泵时，没有人确信疫情会停止。但疫情确实停止了，而水可能携带疾病这一认识，增加了科学家对疾病及其传播方式的理解。


  ## 数据分析师的基本技能


  我已经谈了一些数据分析涉及的内容。数据分析师必须具备某些技能和特质才能成功。虽然有些人具有数据分析的天赋，但这是一个大多数人如果思想开放、培养数据思维并努力掌握我将在本节中讨论的技能，就能学好的领域。一名优秀的数据分析师需要一系列的技能——功能性技能、技术技能和软技能。此外，领域知识对于做好数据分析至关重要。下面我们将探讨主要技能。


  ### 功能性技能


  *功能性技能*是相当高层次的技能，能帮助你决定如何着手解决问题。它们既涉及天赋，也涉及在科学和数学等课程中学到的高层次概念和技能。最明显的功能性技能是逻辑性和系统性思维。你需要能够按照逻辑步骤进行推理，得出重要结论，并能够为其提供支持。这其中的一部分是意识到自己的偏见，以免影响工作。虽然这在一定程度上是一种软技能（下文讨论），但你需要能够倾听他人意见，并理解他们的观点，即使与自己的不同。与此相关的是组织能力和遵循流程的能力。所有数据分析师都需要具备良好的数学基础，有些职位还需要统计学知识。一名优秀的数据分析师还应具备天生的创造力。你经常会听到关于跳出固有思维模式或求知欲的价值，确实，最激动人心的见解往往来自于以新视角看待事物的人。从事数据分析和数据科学工作的人经常提到的一个特质是*数据思维*——这基本上是指思想开放，不急于下结论，理解数据是某事物的表示，并尊重任何形式的数据。


  ### 技术技能


  虽然主要技术技能取决于具体职位，但所有数据分析师都需要对计算机有基本的熟悉程度，以便能够学习其职位所需的任何特定软件。至少，需要熟悉 Microsoft Excel
  和 Word（或其谷歌等效软件），并且大多数数据分析师应具备相当丰富的 Excel 使用经验，包括许多更高级的功能，如数据透视表和`vlookup`。许多分析师需要了解他们将操作的数据库系统，并且通常需要使用结构化查询语言（SQL）与这些数据库交互。虽然对于数据分析师来说不如数据科学家那么常见，但许多分析师也会进行计算机编程，通常使用
  Python 或 R（这一趋势也在上升）。有时，数据分析师甚至会在 Excel 工作中使用 VBA（Visual Basic for Applications，一种嵌入在
  Microsoft Office 产品中的编程语言）进行编码。




  ### 软技能


  除非你正在开展一个完全独立、不打算与他人共享的项目，否则软技能也同样重要。“软技能”通常指为完成工作而与他人互动所需的一系列不同能力。这些技能中的大部分几乎是任何工作都必需的，但对于数据分析师和数据科学家所从事的技术工作，还有一些特定的技能。


  其中一些技能更多与心态或态度相关，而非具体技能。具备普遍的适应性至关重要，因为在数据分析项目中情况时常变化。拥有成长型思维，即理解自己需要不断发展数据分析技能，这一点很重要。这个领域在不断变化，你必须使自己的知识和技能保持更新。此外，牢记你的工作可能产生的影响，将有助于确保你的行为合乎道德。


  时间管理涵盖了一系列重要技能。你通常需要同时处理多项事务。你必须能够理解哪些任务最重要，对每件事需要多长时间以及真正的截止日期有合理的认识，这样才能知道在任意给定时间应该做什么。在大多数工作中，优先排序的能力是必要的。数据分析工作的一个特点是，有时你无法着手某项工作，要么是因为你在等待他人，要么是你困在了某个步骤，该步骤必须先完成，才能进行后续步骤（例如，你可能正在运行需要一小时才能完成的代码，而没有结果你就无法继续该项目）。因此，你需要具备同时处理多个项目的能力。你需要了解每项任务是如何运作的，这样才能有效地确定优先级，并为每项任务分配适当的时间，以满足截止日期。


  另一类软技能涉及与不同类型人员的沟通。通常，项目的所有预期用户或受益者被称为*利益相关者*。这包括技术人员，比如你技术功底深厚的数据分析师同行，也包括那些你一提到“p
  值”这个词大脑就会宕机的非技术人员，以及介于两者之间的所有人。通常，你所做的工作最终是为非技术人员服务的，因此你需要能够以他们能理解的方式解释你的工作和结论。你经常会发现，除非人们觉得能够理解你的发现，否则他们不会信任你或你的发现。他们通常意识到自己无法理解所有“花哨的数学”正如我们常说的，但他们仍然希望了解你所呈现信息背后的基本概念。这也是数据分析师和数据科学家经常倾向于选择更简单、更易于解释的方案，而非更复杂、更花哨的方案的原因之一。这种策略将在本书后续章节讨论。


  你与他人互动的一种常见方式是通过演示，因此能够创建易于理解的演示文稿非常有价值。沟通技巧也不是单向的——能够倾听和接受反馈同样重要，这些反馈可能来自你的客户或领导。不幸的是，与客户和领导有时会产生冲突，你需要保持冷静，进行协商，或者仅仅是倾听以理解必要信息，即使你不同意对方的观点。有时候，坚持你认为正确的事情很重要，但其他时候，保持沉默（有时是永远沉默）更为明智。在某些环境中，兴风作浪会让你陷入麻烦，甚至遭到报复，因此当你与主流意见相悖时，应始终考虑自己所处的情况。


  公司有时会有特定的文化来定义沟通风格——例如，一些公司可能希望避免冲突，通过避免直接表达来优先考虑人们的感受，而另一些公司则更倾向于保持一切清晰公开，因此直截了当的沟通备受青睐。在第一种情况下，懂得如何在不伤害他人感情的同时传达你的信息很有价值；在第二种情况下，能够直截了当、清晰表达且不刻薄则很有价值。事实上，研究发现，那些推崇直接沟通、不回避冲突，同时仍能尊重他人感受并找到建设性方法解决问题的组织更为成功，但间接的沟通风格更为常见。




  '
- '# 领域知识


  数据分析另一个重要领域称为领域知识，它基本上就是指你所处理数据类型的专业专长。我们将在第 10 章中更深入地讨论，但目前需要知道的是，领域知识被视为数据科学的三大支柱之一，并且在数据分析中也极为重要。它本质上是对特定“领域”（例如金融数据、游戏数据、网站使用数据、医疗数据、零售数据等）的专业知识和实践理解。通常，这还意味着对这些领域中更具体的数据类型有深入的了解。如果你对所处理的数据没有足够的理解，就无法做好数据分析——或者说，无法做好数据科学。


  ## “免费”的领域知识


  大多数人如果拿到一堆关于欧洲风车的数据，可能都不知道从何入手。但很多时候，我们因为曾经涉足某个领域而对其有所了解。例如，大学生都会对关于学生、课程和教师的数据感到熟悉。我们知道，可以有一门课程，比如`ENG
  301 American Literature 1`，它实际上更像一个概念，例如作为大学课程目录中的一门课程描述存在。而更具体的课程则是在特定学期的课程表中实际安排的课程。`American
  Literature 1`的`Section 002`安排在 2022-2023 学年的秋季学期，每周二和周四下午 3:30 上课，由`Alex Thorne`担任讲师，最终还会有一份具体注册学生的名单。通常，学生和教师都会关联多门课程，并且这些课程必须安排在时间表上，以避免时间冲突等等。这些事情对我们大多数人来说似乎显而易见，但这正是领域知识的本质。当你拥有它时，它显得如此自然和明显，以至于你常常甚至没有意识到你所知道的东西是真正的知识。在处理合适类型的数据时，这能让你在通往高质量数据分析的道路上走得很远。


  领域知识必须有来源。在课程的例子里，它显然来源于生活经验。但在很多时候，你并不会事先拥有它，需要去培养。这在商业世界中尤其如此。有时你可以在网上或书籍中找到材料来学习所需知识，但通常学习所需知识的唯一方法是找到已经拥有该知识并能帮助你学习的人。这些人通常被称为*主题专家*，或`SMEs`。诚然，有时你可以纯粹通过研究数据来弄清问题，但你必须非常谨慎，并且必须始终与专家一起验证你的假设。


  与主题专家合作的一个挑战是，他们往往不知道自己知道什么。如果他们要描述一个流程或系统，他们很可能会遗漏一些步骤或假设，因为这些对他们来说是不假思索或本能反应，所以他们觉得不值得提。例如，在上述课程的例子中，想象一下他们忘了提到教师教授多门课程。如果你完全不了解课程安排是如何运作的，你可能会错误地假设每位教师只教一门课，或者一位教师教授某门课程的所有部分。似乎不可能有人会这么想，但一个没有中学或高等教育经验的人可能确实不知道。这类错误的假设在数据分析中可能是毁灭性的，会导致你走上完全错误的方向。


  好的一面是，领域知识通常在一定程度上是可迁移的。如果你在一家公司的零售领域工作，然后转到另一家零售公司，你会发现你并不是从零开始。


