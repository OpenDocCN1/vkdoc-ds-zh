  在最初几个月里，随着不同团队的各种模型涌现，美国疾病控制与预防中心（CDC）开始从众多模型和预测中创建集合预测。*集合机器学习*指的是使用多种算法来得出一个预测或结果。这是一种强大的方法，可以弥补单个模型的弱点，同时仍能从中获益（我们将在第
  15 章中进一步讨论）。预测中使用了多种模型——有些是传统的流行病学模型，其他的则是基于统计的模型。


  流行病学模型有几种不同类型。这类模型往往比纯统计模型需要更多的假设，因为它们使用了关于疾病行为以及其他因素（如医疗资源可用性和人类行为）的信息。因此，在存在诸多未知因素的情况下，这些模型很难做对。许多早期模型都严重错误，通常高估了
  COVID 病例。这些模型也对数据收集问题（如漏报）非常敏感。


  统计建模看起来很有前景，但它需要大量数据，因此在有足够数据之前无法真正展开。这些方法可能更简单，因为它们直接着眼于疾病病例数量，并不需要大量外部信息。一些早期方法包括时间序列方法和指数平滑法。这两种方法都将在本书后续章节中介绍，*时间序列分析*是一种经典的统计学方法，用于追踪变量随时间变化的值（想象一个折线图，X
  轴是日期，一条线横跨图表中心）。*指数平滑法*是另一种预测方法，它依赖于对以往数据进行加权平均（平均值经过其他一些因素修正）。尽管这些技术有着悠久的历史，但早期的
  COVID 模型并不十分准确，不过它们往往仍优于流行病学模型。


  统计建模的一个主要缺点是，外部变化（如封锁和疫苗引入）意味着先前的趋势不再适用，因为情况已完全不同。传统统计学方法在处理随时间变化的事件时的另一个重要缺点是，它们无法可靠地预测太远的未来，通常只有几周（不过有了更多数据后，有时可以预测稍长一些的时间）。


  科学家们最终意识到，混合方法效果更好——统计模型最适合短期预测，而流行病学模型最适合长期预测。科学家们在这种情况下尽了最大努力，尽管我们现在看到大多数模型在早期都高估了疾病数量。但这提醒我们，当数据科学将对人们产生影响时，尽可能严谨是很重要的。


