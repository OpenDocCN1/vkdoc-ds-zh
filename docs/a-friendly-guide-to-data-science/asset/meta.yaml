- - '##'
  - 工程职位
- - '#'
  - '*软件工程师* 是一个经典角色，其本身与数据科学或机器学习并无直接关联。不过，有时这些角色可能存在于数据科学团队中，而其他时候，该角色的职责范围可能超出软件工程，甚至会涵盖数据科学。在数据科学团队中，他们的职责可能既包括数据工程，也包括机器学习工程。他们可能以多种方式为数据科学家提供支持，包括构建将机器学习模型暴露在互联网上的
    API、为数据管道设计基础设施，以及确保所有团队代码遵循 CI/CD 工作流。软件工程师从根本上说就是编写软件，通常是通过在自己的电脑上或特定平台内编写代码来实现。但有些人可能会使用其他工具来开发将在另一个系统内运行的软件，例如通过拖拽界面（尽管使用这些界面通常仍需编写一些代码）。特定软件工程师的日常工作实际情况因公司而异。软件工程师使用像
    `Git` 这样的版本控制系统，并且经常使用集成的测试和部署基础设施。这涉及到为他们编写的软件编写测试并进行各种程度的测试。软件工程角色的一个关键特征是，他们确实将大部分时间花在编写代码上，而所有其他工程师（和数据科学家）角色的任务组合则更为多样，不会花费那么多时间在编码上。'
