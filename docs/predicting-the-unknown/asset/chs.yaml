- "# 统计建模：一个有用的抽象\n\n> “所有模型都是错的，但有些是有用的。”\n> \n> —乔治·博克斯（1919–2013），20 世纪最伟大的统计思想家之一\n\
  \n模型仅仅是世界的一种抽象。仅此而已，不多也不少。所有模型都是错的，但有些是有用的，其意义在于，它们在真实潜在现象、我们的数据和我们的理论之间，捕捉到了恰到好处的抽象程度。\n\
  \n统计建模的原则其实非常简单，即便数学细节有时看起来令人生畏且深奥难懂。我们有两组变量：自变量和因变量。它们也被称为协变量（或预测变量）和响应变量。模型位于中间，连接协变量与响应变量，如图\
  \ 7-4 所示。\n\n![](img/603682_1_En_7_Fig4_HTML.jpg)\n\n**图 7-4** 统计模型的概念概览。在实践中，大多数模型都遵循这一原则。你将输入馈入模型，然后得到一个输出，该输出包含一个或多个响应。\n\
  \n让我们看一个商业例子：你相信用户的**人口统计学变量**和他们的购买行为之间可能存在某种关系。比如说，你是一家销售衣服的在线零售商。你相信性别、年龄和收入可能会影响顾客在衣服上的花费。使用统计模型，你可以做到以下几点：\n\
  \n1.  确定不同类型用户的预期消费。\n2.  了解哪些变量是显著的。\n\n第二点特别有趣。我们可以在统计模型中使用显著性检验来评估单个变量的显著性。这使得统计模型非常强大。事实上，有些统计模型可以被看作是显著性检验的推广。例如，著名的`ANOVA`检验（提醒一下，`ANOVA`代表方差分析）也可以通过线性回归——最基本的统计模型——来实现。\n\
  \n那么，为什么我们不一直使用统计建模呢？有几个原因。首先，简洁往往是关键。有时我们真正感兴趣的是一个可以通过显著性检验来回答的特定问题。假设检验可能比模型更简单易用。统计学被许多科学领域所使用，很多时候，初出茅庐的科学家只接受了其学科中最常用的特定检验和模型的训练。如果某个人只需要一个`t\
  \ 检验`就能证明他们的理论，那么他们就不想再深入了。\n\n其次，统计建模与假设检验的关注点不同。在科学领域，我们通常关心的是证明或推翻一个假设，而我们更喜欢通过实验来做到这一点。费舍尔本人就对实验设计理论做出了许多贡献。一个设计得当的实验很适合进行假设检验，而一旦假设被证明或推翻，统计建模可能就超出了实际需求。\n\
  \n最后，我们并不总是像现在这样拥有丰富的数据和计算能力。如今，拟合一个模型可以简单到只用两行代码。过去当然不是这样。几十年前，我们使用统计表格，这些表格附有与假设检验所需计算相关的预计算值，从而简化了计算。与统计模型相比，大多数检验的计算量较小，相当方便，这可能促使许多科学家倾向于使用假设检验。\n\
  \n图 7-5 展示了一个来自标准正态分布的`z`值表示例。单元格代表位于两个`z`值之间的比例。因此，图中高亮/下划线的单元格是位于`0.0`（均值）和`0.04`之间的样本比例。这些针对各种分布的表格，曾被用于显著性检验的计算中。\n\
  \n![](img/603682_1_En_7_Fig5_HTML.png)\n\n**图 7-5** 来自标准正态分布的`z`值表示例（标准正态分布的均值为\
  \ 0，标准差为 1）。\n\n如今，针对各种各样的问题和挑战，有数不清的模型。统计模型的关键组成部分是它们是随机的。也就是说，它们明确地对不确定性进行建模。它们实现这一点的方式，以及为了实现这一点所做的假设，可能因模型而异，当然，不同种类的方法之间也存在非常大的差异。\n\
  \n迄今为止最流行、最简单、最通用的模型是线性回归。线性回归长期以来一直是科学界的主力。在撰写本文时，在 Google Scholar 上搜索`linear regression`会返回近\
  \ 500 万个结果。\n\n线性回归遵循一个非常简单的思路。假设你有一个数据的散点图，如图 7-6 所示。\n\n![](img/603682_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** 中土世界中矮人身高与矮人财富的关系。\n\n图 7-6 展示了中土世界中矮人的身高与财富之间的关系。在这个虚构的例子中，矮人的身高和财富之间存在很强的联系，个子更高的矮人平均来看似乎更富有。看起来这两个变量之间的关系遵循一条直线。\n\
  \n当然，你可能还能识别出其他类型的关系，但直线在这种情况下似乎完全合理。另外，直线是存在的几何关系中最简单的一种，这赋予了它一定的吸引力。如果你还记得本书前面提到的，我们讨论过奥卡姆剃刀，以及我们对更简单规则的偏好。如果我们能画一条直线来描述这两个变量之间的关系，那么我们就拥有了一种简洁且简单的方法，可以根据身高预测财富。\n\
  \n有多种画直线的方法。看看图 7-7。哪条线最好？看起来中间的线比两边的线更好地捕捉了数据的趋势。但是否有一种方法可以将这种直觉系统化呢？\n\n![](img/603682_1_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7** 以某种方式将身高与体重连接起来的几种不同画直线的方法。\n\n这种直觉通过线性回归得以系统化。线性回归的目标是找到最佳拟合线。也就是那条最紧密跟随数据趋势的线。所以，你找到了最佳拟合线，看起来就像图\
  \ 7-8 中所示的线。\n\n![](img/603682_1_En_7_Fig8_HTML.jpg)\n\n\n\n"
- '# 分析与可视化


  矮人财富（金币）与身高（厘米）的散点图呈现正相关。最高的两个点分别是`(119.5, 1350)`和`(164, 2025)`。一条递增的直线穿过这些散点。数值均为近似值。


  **图 7-8**


  身高与财富问题的最优拟合线


  好奇的读者可能会在此处皱眉。首先，这条线似乎遵循了整体趋势，但身高与财富之间的关系并非完美无缺。事实上，只有一小部分数据点恰好落在直线上。其次，我们根据什么规则来绘制这条线？


  正如你所注意到的，模型会产生一些误差。我们对此能做什么？我们无法预测模型中的每个个别误差。我们接受模型会犯一些误差的事实。这些误差要么源于认知不确定性，要么源于偶然不确定性，但在本例中，我们并不关心其来源。我们关心的是误差的形态。那么，在这种情况下，误差看起来是什么样的？我们可以收集所有误差，并将其绘制成直方图。如图
  7-9 所示。


  ![](img/603682_1_En_7_Fig9_HTML.jpg)


  计数与残差的直方图呈钟形趋势。最高峰位于`(负 20, 81)`。该值为近似值。


  **图 7-9**


  矮人身高-财富模型的误差


  这些误差开始看起来有点像正态分布。如果你从本书中注意到了什么，我们可以使用概率分布来建模不确定性。因此，如果我们的误差看起来像正态分布，我们可以将其作为启发式方法，在寻找最优拟合线时指导我们。


  在线性回归中，我们假设模型会产生误差，并且这些误差服从正态分布。抛开中土世界的矮人不谈，为什么是正态分布？因为正态分布无处不在，而且测量误差通常呈正态分布。


  做出这两个假设（线性关系和正态分布误差）后，我们就得到了线性回归模型。但如果改变这些假设呢？改变这些假设将为我们带来新的模型。约翰·内尔德（1924–2010）和罗伯特·韦德伯恩（1947–1975）是提出广义线性模型概念的统计学家。两人都在伦敦北部的罗瑟姆斯特德实验站工作，罗纳德·费舍尔在那里发展了他的许多实验设计理论。


  数学家们喜欢对现有概念进行泛化。例如，有理数（如`1.23`这样的数字）可以看作整数的扩展，因为实数集也包含整数。实数集可以看作进一步的扩展，因为它既包含有理数，也包含无理数（如`√2`）。数学史上充满了类似的例子。这样做的动机是，更高层次的关系可以帮助我们揭示更多关于数学世界运作方式的见解和规则，而这些见解和规则又可以用于其他模型和理论。


  统计学也不例外。内尔德和韦德伯恩成功地提出了一个理论框架，将一些现有模型（如逻辑回归和泊松回归）合并到线性回归概念的泛化之下。因此，广义线性模型假设预测变量与响应变量之间的关系是线性的。然而，实际的误差可以服从其他分布。著名的泊松模型假设，除其他事项外，响应变量由整数组成。这个模型何时相关？例如，体育领域。体育比赛中的得分由整数组成。因此，如果我们想预测一场足球比赛的进球数，使用泊松回归比使用线性回归预测实数更有意义。


  逻辑回归可用于对二元结果进行建模。某人是否会购买（或不购买）某件商品？某人是否会拖欠贷款？但对于存在多个潜在结果的情况呢？例如，在某些运动中，结果可能是赢/输/平。在这种情况下，我们可以使用多项逻辑回归，它是逻辑回归对多种结果的泛化。贝塔回归可用于对介于
  0 和 1 之间的数字（如比例）进行建模。伽马回归可用于预测正实数。这些只是广义线性模型家族中的一部分模型。


  其他类型的模型包括生存模型。假设你正在研究一台机器的可靠性。如果你现在买了一辆车，它需要第一次维修要多久？或者你可能关心患有危险疾病的患者的生存率。某人在五年内存活的概率是多少？生存分析有助于找到这些问题的答案。


  与生存分析关系最密切的名字是大卫·考克斯（1924–2002）和瓦洛迪·韦布尔（1887–1979）。考克斯为我们提供了该领域最流行的模型之一，称为比例风险模型，而韦布尔研究了同名分布。韦布尔分布是一个很好的例子，展示了统计模型可以表达的灵活性。某些实体存活的越久，其死亡的概率越高。这对于大多数超过一定年龄的生物来说是成立的。


  然而，对于其他实体，情况并非如此。企业存在的越久，其破产的可能性就越小，因为它们正在建立忠实的用户群。因此，有人可能会认为，一个企业存在的越久，它存活更久的可能性就越大。最后，还有一些物体在其整个生命周期中具有恒定的生存概率。例如，放在桌子上的玻璃花瓶，除非有人打碎它，否则它将永远留在那里。花瓶放在那里是
  1 年还是 100 年并不重要。


  图 7-10 显示了韦布尔分布不同参数的失效率。失效率是每单位时间内的失效次数。在本例中，我们以月为单位测量时间。因此，失效率表示每月预计会失效的单元数量。很容易看出，韦布尔分布非常灵活，可以适应这里讨论的所有场景。


  ![](img/603682_1_En_7_Fig10_HTML.jpg)


  失效率与年份的折线图描绘了一条从`(0, 1)`到`(10, 1)`的恒定曲线，一条从`(0, 5)`到`(10, 0.2)`的递减曲线，以及一条从`(0, 0)`到`(10,
  4.75)`的递增曲线。数值均为近似值。


  **图 7-10**


  韦布尔分布不同参数的失效率


  那么非线性关系呢？在大多数情况下，统计模型都是可加且线性的。原因是非线性是一个潘多拉魔盒。一旦开始探索它，你就会面临无数的可能性——随之而来的是无数的问题。




  首先，模型的解释会变得更加困难。例如，让我们重新审视矮人线性回归模型。假设线性回归方程如下：


  `gold coins = 12 * height`


  这个模型很好解释。在其他条件相同的情况下，矮人身高每增加 1 厘米，平均就能多获得 12 枚金币。直观易懂，对吧？然而，假设存在另一种关系能更好地解释数据，如下所示：


  `gold coins = 12 * log(height)`


  这种关系该如何解释？现在有了对数，关系就不像以前那么清晰了。对于受过量化训练的人来说，这并不难理解，但对于普通人来说，可能很难在脑海中想象出身高的对数每增加一个单位是什么样子。


  假设我们想在方程中加入一个新变量——胡须长度。于是我们得到了这个：


  `gold coins = 12 * (log(height) / sqrt(beard))`


  这就更难理解了。但如果方程是下面这样的呢：


  `gold coins = 12 * height + 11.5 * beard`


  这个模型可以这样解释：在胡须长度不变的情况下，身高每增加 1 厘米，矮人平均多获得 12 枚金币；在身高不变的情况下，胡须长度每增加 1 厘米，矮人平均多获得
  11.5 枚金币。这样容易理解多了，对吧？


  其次，人们可以使用的非线性函数种类繁多。你很容易得到两三个不同的模型，它们解释起来很困难，但性能却相差无几。统计学向来非常注重结果的可解释性和透明度，而非线性模型在这方面就有所欠缺。


  话虽如此，实践中确实也会用到一些非线性模型。广义加性模型就是一个例子。然而，非线性领域主要还是由机器学习方法主导，关于这一点，你将在后续内容中了解更多。


  统计模型和检验是非常强大的工具，它们在很长一段时间内都为我们提供了良好的服务——有些甚至已经沿用了几个世纪。然而，正如前面提到的，当你手里只有一把锤子时，看什么都像钉子。统计模型常常被误用，部分原因是许多学科中，初出茅庐的科学家没有足够的时间深入学习统计学。因此，他们常常会忽略模型背后的重要假设，或者对其他方法一无所知。那么，统计建模到底出了什么问题呢？


  多年来，我观察到两种常见的谬误。第一种是高斯谬误。第二种是线性世界谬误。


  高斯谬误指的是过度使用线性回归模型来处理所有事情。线性回归是每个人学习的第一个统计模型，并且所有统计软件包中都包含它。然而，世界并非总是服从高斯分布。还有许多其他模型可以处理非高斯分布的情况，比如泊松回归、逻辑回归、广义加性模型等等，但这些模型往往被忽视了。


  线性谬误则假设世界上的一切都是线性的。无论好坏，事实并非如此。绝大多数采用的统计模型都假设输入和输出之间的关系是线性的。在图 7-11 中，你可以看到一个两个变量之间非线性关系的例子。我们来看看龙的翼展和速度之间的关系。


  一张描绘龙的飞行速度（公里/小时）与翼展（米）关系的曲线图，显示出一条递增的曲线，从点(0.1, 5.95)延伸到点(2.125, 9.35)。数值为近似值。


  图 7-11：一组两点间的非线性关系示例


  假设我们想通过线性回归建立一个模型，根据龙的翼展来预测其速度。这个回归模型解释了约 94%的变异量。这听起来是个不错的模型。那么，让我们绘制出预测值（图 7-12
  中的红线）。


  一张线条图显示龙的飞行速度（公里/小时）与翼展（米）的关系：一条递增的曲线从点(0.1, 5.95)延伸到点(2.125, 9.35)；一条递增的直线从点(0,
  6.2)延伸到点(2.125, 9.5)。数值为近似值。


  图 7-12：对同一组数据应用的回归模型


  这个模型相当糟糕。它确实解释了 94%的变异量，但它试图在关系明显呈曲线的问题中拟合一条直线。我们在这里做的是夸大了一个模型的预期，而它显然是错误的。


  为什么会出现这类问题？统计模型的一个问题在于，违反假设的情况无法在模型内部被检测到。如果程序员在代码中犯了错误，那么软件很可能会无法运行，或者产生一些奇怪的结果。而线性回归则不同，它仍然可以运行，并给出诸如“解释了
  48%的方差”这样的结果。


  这里你看到了一个例子，性能指标实际上相当不错，但模型却百分之百错误。在这种情况下，针对模型假设的诊断检验会表明，误差并非正态分布。因此，线性回归的假设未被满足，我们需要一个不同的模型。但并非所有从业者都可能注意到这一点。


  这个例子可能看起来有些抽象，直到你意识到许多此类问题正被应用于可能影响我们生活的模型之中。药物的批准或否决基于这些模型。计量经济学模型为经济提供预测，以便中央银行调整通胀率。正确应用所有这些模型颇具挑战性。


  如果存在一些方法，它们更易于使用，没有所有这些假设，并且能更轻松地处理非线性问题，那会怎样？这不就使得建模和预测变得更加简单了吗？


  机器学习应运而生。




  '
- '# 8. 机器学习：黑箱之内


  > *“我相信，到本世纪末，词汇的用法和大众教育观念将发生巨大变化，届时人们谈论‘机器思考’时，将不再担心会被反驳。”*

  >

  > ——艾伦·图灵


  艾伦·图灵没有说错。


  仅仅几年后，1959 年，著名美国计算机科学家亚瑟·塞缪尔提出了以下广为接受的定义：“机器学习是关于赋予计算机无需明确编程就能学习的能力。”


  目前，没有哪项技术比机器学习获得更多热捧，而且这也是理所应当的。1991 年，万维网对外公开，将地球上所有人连接起来。亚马逊于 1994 年上线。博客于 1997
  年诞生。谷歌于 1998 年成立。Facebook 于 2004 年创立。亚马逊于 2006 年发布其云计算服务。2007 年，第一代 iPhone 问世。


  自 90 年代以来，我们目睹了互联互通、数据生成和数据存储的持续趋势。我们在网上表达想法、购物、询问任何问题（从路线指引到外出就餐地点），所有这些数据都被不断记录，构建着我们世界的数字表征。在新冠疫情之后，这一点变得更为突出，期间许多专业人士被迫居家办公。


  在这场数据洪流中，有一套特定的工具自 90 年代起开始流行，如今已主导了科技世界：那就是机器学习。机器学习如今无处不在。从智能手机到在线购物，再到公共交通——机器学习算法不断衡量、预测和优化响应。完整列举机器学习的用例不仅超出了本书的范围，其本身可能就需要一本书来论述。


  最初为了重现智能而开始的努力，如今已成为我们对抗各种不确定性所拥有的最强大工具。不谈及机器学习的任何不确定性处理方法都是不完整的。本章旨在揭开机器学习以及“数据科学”等其他术语的神秘面纱。我们将审视其历史，并探讨为什么机器学习似乎效果极佳——但也存在若干缺陷。


  ## 数据科学与机器学习史


  如今，最潮流的词不是“机器学习”或“统计学”，而是*数据科学*。本节在讨论机器学习之前，将先深入探讨这个术语。


  什么是数据科学？数据科学本质上是工业界为融合数据相关各学科而创造的一个花哨新名称：机器学习、统计学、计算智能、数据挖掘、人工智能等等。


  自远古以来——或大致如此——人类就试图在机器中重现智能，以分析数据并控制不确定性（等等）。几十年来，这催生了各种科学领域，每个领域在实现这些目标上都有不同的方法论。其中一些领域提出了截然不同的方法，但许多其他领域则得出了非常相似的手段。


  例如，计算智能在 20 世纪 90 年代非常流行（但现在已不那么盛行），它基于生物学类比。其理论是，如果自然界已经发展出展现智能的机制，那么我们或许可以通过模仿这些机制在机器中复制智能。


  你信服吗？


  这在某种程度上是有道理的。如果蚂蚁能在蚁群中自我组织，也许我们能从它们身上学到些什么。如果我们的大脑由神经元构成，那么我们就可以模仿它们的功能，并用其来重现智能。


  然而，这种方法并未取得太大进展。生物学类比似乎过于松散，尤其对于偏向数学思维的科学家而言。计算智能逐渐失宠，而机器学习开始占据主导。


  经典人工智能与 50 年代发展出的一种方法相关联，该方法侧重于使用逻辑规则和推理来重现智能。这种方法与艾伦·纽厄尔（1927–1992）、赫伯特·西蒙（1916–2001）、约翰·麦卡锡（1956–）、马文·明斯基（1927–2016）以及亚瑟·塞缪尔（1901–2000）等人相关。他们的方法将逻辑视为智能的基本过程，并相信只要我们能创造出一台能用逻辑规则思考的机器，就有可能创造出一台智能机器。这种方法同样不太成功，后来被放弃了。


  *控制论*是另一个更早于 40 年代出现的术语，由罗伯特·维纳用来描述能够响应环境的系统。*数据挖掘*和*模式识别*也是 90 年代被热议的流行词。


  在历史上大部分时间里，这些方法和算法主要在学术界以及像 IBM 这样的一些科技公司中发展。然而，在 21 世纪初数据洪流之后，数据处理算法突然开始变得越来越有价值。这些算法分散在不同学科和思想流派中，并不利于销售产品或服务。因此，“数据科学”这个术语应运而生，用以涵盖任何与数据相关的算法、方法、产品或服务。


  这个词已主导了工业领域的格局，很大程度上是因为说自己是数据科学家比深入解释众多思想流派之间的差异以及自己属于哪一派要容易得多。我也自称数据科学家。科技领域之外的人会问什么是数据科学，以及数据科学家是做什么的？然后他们会遇到各种各样的答案。事实是，所有与数据分析、不确定性和人工智能相关的学科都有着悠久的历史传统。这些传统主要扎根于世界一些顶尖大学，而一些大型科技公司也扮演着角色。如今，这些公司开始超越大学，原因很简单：它们手握巨额资源。




