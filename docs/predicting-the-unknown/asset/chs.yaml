- "# 11. 预测的极限（上篇）：徒劳的追寻？\n\n> *“预测非常困难，尤其是关于未来的预测。”*\n> \n> ——尼尔斯·玻尔，1922 年诺贝尔物理学奖得主\n\
  \n目前为止，我们已经了解了数据科学中的一些主要方法，并讨论了在尝试预测未来或让算法从数据中学习时所面临的诸多挑战。人们自然会问：我们到底*能*预测什么，又不能预测什么？我们如何能相信自己的预测？我们知识的极限在哪里？我们是否总会陷入“不知道自己不知道”的境地，还是说，我们至少能够理解自然在多大程度上允许我们了解未来？\n\
  \n解决这些问题有不同的途径。本章将探讨其中两种：一种是自上而下的抽象方法，另一种是自下而上的还原论方法。\n\n*自上而下的抽象方法*是机器学习中学习理论的框架。学习理论关注的正是一类问题——“一个学习算法能学到多少？它能表现得多好？”但它并非通过实验（这是机器学习的主要方法）来研究，而是通过能提供模型性能保证的定理来研究。\n\
  \n本质上，“学习理论”是对我们为应对不确定性而构建的模型本身的不确定性所进行的研究。\n\n这是一个相当雄心勃勃的目标。你对数据、问题或算法一无所知，但你却知道模型在平均情况下会表现得多好。\n\
  \n另一种方法是完全忽略理论，转而专注于创建我们所研究系统的简化版本（即“还原论”方法）。这是建模和蒙特卡洛模拟的核心原则。这种方法与统计建模和机器学习截然不同，它侧重于模拟现实世界的方方面面，而不是仅仅通过概率分布等构造来抽象大部分内容。本章将讨论物理系统以及通过基于智能体的建模来模拟的社会系统的建模。你将看到建模是如何有效控制偶然不确定性和认知不确定性的，但我也会挑战这种方法的不足之处，以及自然为我们认知能力所设的限制。\n\
  \n## 学习理论：关于未知，我们能知道什么？\n\n学习理论试图以数学方式回答算法能学到多少以及它能表现得多好等问题。即使是经验丰富的数据科学家，有时也会觉得机器学习有点像魔法。你把数据输入一个黑箱，它就会返回预测结果。但哪个算法表现最好以及*为什么*，并不总是那么清晰。学习理论正是试图回答这些问题。\n\
  \n学习理论类似于我们之前看到的一些概率定理，比如切比雪夫不等式。我们能发现在任何情况下都成立的数学普适定律，这证明了人类推理的力量。学习理论本质上就是试图为机器做类似的事情。它关注的问题如下：\n\
  \n1.  对于任何给定问题，哪些算法是最好的？\n2.  我们需要多少数据？\n3.  我们能期望的最佳性能是什么？\n4.  奥卡姆剃刀原理为何有效？\n\n\
  如果你留意，会发现这些问题与预测者在 M 竞赛中试图回答的问题类似。学习理论是竞赛方法在理论上的对应物。\n\n学习理论中有不同的方法，但最流行的是 PAC/VC\
  \ 理论。`PAC` 代表“可能近似正确”，是由莱斯利·瓦利安特^(¹¹¹)在 1984 年提出的理论。还记得归纳问题吗？在目睹了一万只白天鹅却从未见过黑天鹅之后，你形成了一个“所有天鹅都是白色的”假说；但你如何知道自己绝对正确呢？\n\
  \n让我们回到第一章中看到的一个例子。你穿越回过去，试图辨别哪些食物是可食用的。你提出了一个假说：具有某些属性（例如，红色的食物）的食物是可食用的。这个假说可能只有在特定百分比的时间内是正确的（例如，只有\
  \ 90%的红色水果可食用）。这就是“近似”的部分。该理论并非完全正确，但近似正确。\n\n那么，“可能”部分从何而来？除了这个理论，你也许还会提出其他关于可食用食物的理论。你甚至可能提出关于可食用液体（水除外）的理论（例如，橙汁可食用吗？）。如果你提出的大多数理论都近似正确，那么你就是一个“可能近似正确的学习者”。这意味着在大多数情况下，大多数理论都足够好了。\n\
  \n在这个例子中，把你自己替换成 AI 算法，你就会明白这如何直接延伸到机器学习。我们希望我们的机器学习算法尽可能多地正确。我们希望它们在大多数时候是*可能正确*的。这就是“可能近似正确”。\n\
  \n瓦利安特因其对计算机科学的贡献获得了图灵奖^(¹¹²)。以下是他在谈到自己是如何提出这一理论时所说的：^(¹¹³)\n\n* “在我刚开始研究它（20 世纪\
  \ 80 年代）的时候，人们已经在研究机器学习，但对于‘学习’究竟是什么东西，并没有达成共识。……所以我认为学习应该有一定的理论。……学习必定是某种统计性的东西，但它也是某种计算性的东西。我需要某种能将计算和统计学结合起来解释这种现象的理论。”\n\
  \n不过，我提到过，当前的框架被称为 PAC/VC。`VC` 代表 Vapnik-Chervonenkis。弗拉基米尔·瓦普尼克和阿列克谢·切尔沃年基斯提出了\
  \ VC 理论。VC 理论是一种表达机器学习算法能力的方法。给定一个称为 VC 维（具体到每个机器学习算法）的参数，以及模型在某些数据上的性能，我们就能获得模型在现实世界中性能的某些保证。\n\
  \n\n\nVC 框架与 PAC 框架相似，都通过复杂的数学公式来证明其观点。然而，对于希望理解这些理论如何帮助我们应对不确定性（而不深入晦涩的数学公式）的读者而言，主要收获在于：我们拥有一些抽象层面上的数学工具，它们能够告诉我们建模不确定性的能力如何。也就是说，我们可能面对自身不确定性模型中的不确定性，但这种不确定性在某种程度上是可以控制的。\n\
  \n然而，这些理论在实际世界中并未得到广泛应用。尽管 VC 框架催生了一种名为`支持向量机`的热门算法，但在实践中，由于多种原因，这些公式并不易于使用。此外，支持向量机已不再流行，被更复杂的模型（如深度学习）所取代。\n\
  \n当弗拉基米尔·瓦普尼克在 1992 年至 1993 年间提出其理论时^(¹¹⁴)，神经网络仍然流行。然而，它们的主要缺点之一是像黑箱一样运作。没有人确切知道它们*为何*有效。瓦普尼克的支持向量机在理论上基础更扎实，并且在原理和运作方式上非常透明。这引发了对支持向量机及相关算法的一波研究热潮。然而，这些算法存在一些基本问题。\n\
  \n首先，它们运行耗时，计算量大。其次，研究人员需要花费大量时间优化超参数。超参数就像算法的调节旋钮，找到合适的设置可能是一个漫长的过程。这意味着，在实践中，它们并不总是一个好的选择。\n\
  \n颇具讽刺意味的是，深度学习完全相反。它效果很好，但缺乏真正的理论基础。然而，深度学习也有自身的挑战。它是一套非常流行且强大的模型，但没人确切知道它们为何有效。深度学习的成功催生了围绕它的全新研究领域。例如，一些研究人员尝试使用统计力学中的工具来解释深度神经网络为何如此有效。^(¹¹⁵)\
  \ 另一些人，比如深度学习之父之一约书亚·本吉奥，提出这可能与它们的训练方式有关。^(¹¹⁶) 事实是，我们仍然没有确凿的答案。不过，未来几年内我们或许能找到。\n\
  \n无论如何，学习理论为我们提供了许多有用的工具和方法，这有助于改进机器学习算法。或许，完全驯服模型不确定性的追求是徒劳的，但在这一过程中，我们可以学到一两个有用的东西。\n\
  \n## PAC 框架与进化\n\n关于 PAC 框架，值得一提的是，瓦利安特将其扩展到了进化论。根据瓦利安特的观点，生物世界的核心是计算性的。在他 2013\
  \ 年出版的《*大概正确*》一书中^(¹¹⁷)，他将算法的概念扩展为`生态算法`。\n\n`生态算法`本质上是一种算法，因为它从不可预测且复杂的世界（就像我们在现实生活中遇到的那样）接收反馈。因此，生命中的每个物种都需要通过最大化其生存和繁衍的概率来适应环境。这种适应通过进化过程发生，而进化本质上是一个学习过程。进化从环境中接收反馈，然后以适应物种的方式调整物种，从而提高物种的生存概率。根据瓦利安特的观点，进化属于一类名为`统计查询`的算法，并且由于它是一个进化过程，可以通过\
  \ PAC 框架进行分析。\n\n很难说这一理论是否正确，但它展示了不确定性研究如何对我们生活及周围世界的许多其他方面提出有趣的问题。在第一章中，我们讨论了一个人如何在荒野中为了生存而不得不应对极端不确定性，同时试图确定哪些食物可食用、哪些不可食用。这个简单的问题展示了不确定性的影响、围绕研究不确定性问题的深度，以及试图解释不确定性的理论和公式可能变得多么复杂。\n\
  \n确实，当一个有智慧的生物决定做出一个结果不确定的决策时，不确定性便存在了，因此它渗透到智慧生命必须采取的许多行动中。然而，物理系统呢？长期以来，物理系统的研究一直与力学和万有引力方程等概念联系在一起。但不确定性可以无处不在，包括物理世界，这正是下一节的主题。\n\
  \n\n\n"
- '# 蒙特卡洛模拟：赌场与科学有何关系？


  > *“赌场的基本规则是让他们一直玩下去，并让他们不断回来。他们玩得越久，输得就越多，最终我们会把他们的钱全部赢走。”*

  >

  > ——罗伯特·德尼罗在《赌城风云》中的台词


  赌场与数据科学有着悠久的历史渊源。概率论入门教材中的许多例子都以机会游戏的形式呈现。除了机会游戏提供了概率的理想化版本且相对易于理解之外，概率论的早期发展很大程度上正是源于对机会游戏的研究。


  吉罗拉莫·卡尔达诺（1501–1576）运用概率论分析机会游戏。他撰写了《论机会游戏》一书，利用概率论研究机会游戏。这被视为对概率的首次系统性研究。


  皮埃尔·德·费马（1607–1665）与布莱兹·帕斯卡（1623–1662）合作，奠定了现代概率论的基础。这次合作的起因是为了帮助法国贵族安托万·贡博理解：为什么在掷四次骰子中至少出现一次"六点"的赌注，与掷二十四次两枚骰子中至少出现一次"双六"的赌注并不相同。事实上，他在第一种赌注中赢钱，却在第二种中输钱。贡博因财富而生的自负带来了一个令人愉快的副产品，那就是现代微积分的奠基。


  随机游戏在概率论的发展中扮演了重要角色，而蒙特卡洛可被视为这一传统的一部分。"蒙特卡洛"一词自然源自摩纳哥著名的赌场区，自 19 世纪中期以来，那里一直是赌博热点。蒙特卡洛方法是由斯坦尼斯瓦夫·乌拉姆（1909–1984）在洛斯阿拉莫斯从事核武器研究时提出的。当时的物理学家在使用确定性方法解决各种问题时遇到了困难。乌拉姆想到了一个主意：直接运行模拟来寻找解决方案。由于洛斯阿拉莫斯的人员当时正在从事绝密项目，他们为了隐藏方法，便将其命名为"蒙特卡洛方法"。


  20 世纪 40 年代末计算机的诞生，首次开启了通过运行模拟来理解物理过程的可能性。蒙特卡洛模拟在原子弹和氢弹的研制中都发挥了作用。随着计算能力的提升，这种方法在流体模拟等多种数值问题中变得更为普及。自千禧年以来，它还被广泛用于解决我们之前讨论过的贝叶斯推断问题。


  蒙特卡洛模拟的核心概念看似简单。你建立一个世界模型，而模型的某些部分包含随机成分。这些成分代表了我们系统中关于偶然性的不确定性。我们用概率分布来建模这些不确定性。我们希望找到精确的解，但这被证明非常困难。因此，我们不再追求精确解，而是运行大量模拟，看看会得到什么结果。换句话说，你尝试得越多，学到的就越多。


  每一次模拟都是在现实世界中可能发生的一种不同场景。大量模拟能让我们了解：


  1.  平均场景是什么样的。

  2.  不同场景之间的方差有多大。


  这是一个简单但强大的想法。如今，尤其是在我们拥有个人计算机的情况下，这听起来或许很直观，但在它最初被提出的 20 世纪 40 年代，这却是一个革命性的概念。如今，蒙特卡洛模拟被广泛应用于从流体动力学到金融等众多领域。


  值得注意的是，在蒙特卡洛模拟被发现之前的许多年，统计方法在科学中就已经被提出。只是类似的想法并未在所有科学领域广泛普及。统计力学是现代物理学最重要的组成部分之一。统计力学背后的核心概念是：具有许多相互作用部分的系统难以通过精确方程来描述。因此，必须设计统计方法。


  统计力学旨在通过系统微观组成成分的性质来理解系统的宏观行为。一团气体就是一个很好的例子。假设我们对这团气体的宏观性质感兴趣，即我们关心密度或压强这类属性。我们并不关心对每个单个分子进行建模。然而，我们可以利用概率定律来模拟分子的平均行为。


  这是一个很棒的概念，因为它让我们可以忽略物理对象中不必要的细节，而专注于我们所关心的事情。想想对每个单独分子进行建模的计算复杂度——获得分子行为的平均值显然是一种简单得多的方法。概率论是我们量化不确定性最佳方法之一，而统计力学是另一个成功案例。统计力学被应用于从电导率到流体和固体等众多物理现象。


  统计力学的基础由詹姆斯·克拉克·麦克斯韦（1831–1879）和路德维希·E·玻尔兹曼（1844–1906）奠定。麦克斯韦是一位苏格兰科学家，对物理学做出了巨大贡献。他最大的贡献在于电磁学理论。麦克斯韦发现了电场和磁场以光速像波一样运动，这为发现无线电波创造了可能。爱因斯坦将麦克斯韦的工作描述为"自牛顿时代以来物理学所经历的最深刻、最富有成果的变革"。


  鲜为人知的是，麦克斯韦还对控制理论做出了贡献，该理论可被视为人工智能的前身。控制理论处理机械系统的控制问题，麦克斯韦于 1868 年对离心调速器进行了正式分析。这是一种通过控制燃料进入量来调节发动机转速的装置。虽然这远非人工智能，但它是一个根据输入（发动机转速）产生相应输出（燃料量）的系统，因此其整体概念与例如一个粗糙的强化学习算法并非完全不同。


  路德维希·玻尔兹曼（1844–1906）是一位奥地利物理学家和哲学家。玻尔兹曼以其对物理学的多重贡献而闻名，这些贡献也奠定了统计力学的基础。玻尔兹曼最著名的方程是熵公式
  `S = k logW`，这个公式也被刻在他的墓碑上，它描述了理想气体系统的熵 `S`，其中 `W` 是该系统可能的状态总数，`k` 是玻尔兹曼常数（不过我们无需在此过多关注这个）。


  玻尔兹曼在当时是分子由原子构成理论的坚定支持者。然而，这个理论在当时的普遍接受度并不高。最终，他实际上是少数支持该理论的科学家之一。玻尔兹曼是唯一真正了解自然运作方式的人，但他的真相却不被接受。尽管他仍然是一位受欢迎的科学家，但这肯定对他留下了深刻的影响。由于无法证明自己的理论，加之患有躁郁症，他于
  1906 年上吊自杀。可悲的是，仅仅几年后，原子就得到了确凿无疑的证明。




  玻尔兹曼的工作也与著名的**时间热力学不对称性**问题相关——即时间似乎只朝一个方向流动。杯子会破碎，但我们无法逆转时间使其复原。热咖啡的热量会消散，且永远不会自动回到咖啡中，除非我们消耗能量将其重新加热。热力学第二定律规定，孤立系统的熵只能增加而不能减少，这就创造了时间之箭。


  尽管他的工作与机器学习没有直接关系，但玻尔兹曼的名字却被赋予了一种名为“**玻尔兹曼机**”的机器学习模型，该模型的灵感来源于他在热力学方面的研究。


  “**统计力学**”这一术语实际上是由乔赛亚·威拉德·吉布斯（1839–1903）创造的，他是历史上最杰出的物理学家之一。他的名字还与“**吉布斯采样**”相关联，这是最成功的蒙特卡洛方法之一。虽然吉布斯本人并未描述该方法（该方法由数学家兄弟斯图尔特·格曼和唐纳德·格曼于
  1984 年描述），但该方法背后的概念基于吉布斯的研究成果。


  这里有一个有趣的观察点。统计力学之所以成为一门非常成功的理论，具体原因在于物理学家们从建模精确方程转向了使用概率。其次，蒙特卡洛模拟提供了一种将不确定性纳入我们模型的绝佳方式。


  统计力学发展出的方法重塑了科学的面貌，在化学和工程学中有无数应用。统计力学的概念也被机器学习所采用，例如在信息熵和神经网络中。蒙特卡洛模拟也广泛应用于从投资到气象学的许多不同领域，并且是贝叶斯模型的基本推理机制。


  模拟为物理系统之外的各种可能性打开了大门，并提出了一些复杂且涉及伦理分歧的问题。如果我们在这些系统的模拟上取得了如此巨大的成功，为什么不也尝试对社会系统进行模拟呢？社会系统充满了不确定性。人类可能相当难以预测，而社会有时甚至更甚。为什么不利用模拟来研究这种复杂性呢？如果我们这样做，可能会学到什么？又可能会出什么差错呢？


