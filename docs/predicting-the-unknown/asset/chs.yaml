- "# 1. 我们现在在哪里？不确定性简史\n\n> *“知识将是致命的。让人着迷的是不确定性。迷雾使事物变得美妙。”*\n> \n> ——奥斯卡·王尔德，《道林·格雷的画像》\n\
  \n想想生活中你确信的事情。可能是你对自己的了解：你的名字、发色、地址。还有一些你很可能了解的直接物理环境：隔壁大楼的样子，窗外树今天的颜色，或者最近超市的名字。在不陷入关于我们如何界定这些“已知”的认识论泥潭的前提下，它们确实是*已知*的。\n\
  \n你或许也相当确定明天的天气，或者未来三个月的通货膨胀率。但你对这些信念能有多确定呢？如果我问你，你对 12 个月后的通货膨胀率有多确定？或者七年后的温度？你或许能给出一个合理的范围，但你能给出特定地点精确到小数点后第十位的温度吗？\n\
  \n人类长期以来一直在与不确定性作斗争。逻辑、科学和理性的力量使人类能够创造出工具、方法，以及最近的算法，帮助我们预测未来并控制不确定性。当然，希望在于，通过减轻未知，我们可以改善生活。\n\
  \n如果我们回顾几千年——甚至仅仅几百年——前，我们消除不确定性的能力已大幅增长。我们的祖先有预测天气和农业模式的原始方法；他们对更广泛的社会环境知之甚少。他们不知道是否会被某个看不见的邻近部落袭击并杀害，或者某种未知疾病是否会消灭他们。想想电话的出现，然后想象一下告诉\
  \ 1877 年的某个人，有一天这种新奇的通话设备能在他们接听之前就告诉他们谁在打来电话！\n\n技术赋予了我们预测未来和世界当前状态的能力，但它能带我们走多远？它是无限的吗？还是存在某些我们永远无法超越的界限？而且——关键的是——我们是否在此过程中制造了更多的不确定性？\n\
  \n最紧迫的问题之一——也是我旨在通过这些页面探讨的问题——是我们当前的预测方法如何影响社会动态、经济以及我们所面临的广义不确定性。我们可能并不总是能认识到不确定性对我们日常生活的影响。但不应低估它所扮演的角色；对此，我们可以确定。\n\
  \n在过去的几个世纪里，宗教让位给了科学，科学承诺——并且在某种程度上实现了——对物理世界的解释和对先前难以言说之事的解答。直到 19 世纪和 20 世纪，科学方法的成功使人们对科学的潜力产生了乐观情绪，认为通过将每种现象还原为其组成部分，可以解释一切。但在\
  \ 1927 年，量子力学和海森堡的不确定性原理为科学所能告诉我们的东西设定了一些边界——极限确实存在。\n\n统计学学科创立于 19 世纪，旨在处理科学领域面临的一些未知数。罗纳德·费舍尔，尽管是一个有争议的人物和优生学的支持者，却是现代统计学之父之一。他设计出方法来检验从农业实验中获得的见解的有效性。同样的方法随后被应用于其他领域，从物理学、进化论到经济学。\n\
  \n\n\n"
- '# 不确定性：从外部到内部


  但不确定性的影响并不局限于外部世界。它同样是我们内部世界和功能运作的重要组成部分。我们的大脑在某种程度上进化成了应对不确定性的机制。即使是简单的单细胞生物也能学会对一系列刺激做出反应，^(¹)
  实际上是试图预测下一个刺激会是什么样子，以及正确的反应应该是什么。


  这塑造了我们的思想。关于思维运作的当前理论之一（我将在后文更深入地讨论）是卡尔·弗里斯特恩的自由能原理——本质上，大脑的首要目标是减少不确定性。这一原理影响了社会的发展，甚至影响了所有（或几乎所有）的社会结构。法律体系会惩罚犯罪者，同时考虑到他们再次犯罪的概率等因素。这不是我们确切知道的事情，但围绕它的不确定性会影响我们的决定。商人相信，明天的经济会和今天一样好，或者至少不会差太多。商人无法确切知道这一点，但这个风险无法避免。企业家创办新企业时，相信它最终会成功。但旅途中遇到的未知因素将决定企业的成败。


  人类目前正面临一些深远的挑战。我们可以说，超连接全球化世界的出现，部分是为了抵御生活中的不确定性而演化出来的。然而，这个保护了我们如此之久的结构，也以前所未有的规模引发了问题。全球变暖、核威胁、另一场金融危机、世界各地的政治动荡，或者某种超级智能
  AI 接管一切——所有这些都是我们及后代必须应对的不确定性。它们在很大程度上也是人类自找的——人类确实是一团反复无常的混乱和不可预测。谁能保证未来事件将如何展开？谁能保证全球性灾难的存在与否？又是否真的有人知道对这些事件的最佳反应是什么？我们作为一个物种能存活至今，部分归功于我们为防御不确定性而发展出的工具和方法——主要是对抗疾病和自然灾害等敌对环境。我们未来的生存，将取决于我们如何应对主要由我们自己引发的事件的不确定性。


  ## 并非所有不确定性都一样


  讨论不确定性的一个好方法是先区分不同类型的异质性不确定性。我们首先要理解的是，不确定性可以有多种形式和规模。例如：


  1.  我们面临关于未来的不确定性。例如，明天天气如何？两年后经济状况会好吗？


  2.  我们面临关于当下的不确定性。例如，特勤局可能想知道是否有人在此时谋划袭击。


  3.  我们面临关于过去的不确定性。想想所有那些我们不清楚原因或真实发生情况的历史事件。肯尼迪遇刺案呢？或者文字出现之前的历史呢？


  4.  我们面临关于测量和数据收集的不确定性。当我们测量一个特定数量时，我们如何能 100%确定我们的测量是正确的？有时仪器可能有故障。也许血样被污染了。也许我们进行了一次民意调查，但数据收集过程存在偏差。


  5.  我们面临关于因果关系的不确定性。我们如何知道一种药物真的有效？经济中的干预措施如何改变通货膨胀率？我们如何知道一项政策是有效的？


  6.  我们面临关于我们选择的不确定性。面对多重决策，我们如何知道哪个是最好的？想想你一生中做出的每一个决定，从是否上大学，到周六晚上是否出门。这些决定如何影响你的生活？即使是看似微不足道和轻率的决定，也可能产生持久的影响。


  这些只是我们经常面临的不确定性类型中的一部分。让我们仔细看看一种最常见的不确定性分类。我用两个例子来评估这些分类如何与例子相关联：


  *   ***示例 #1：*** 你是一位对冲基金经理，正在考虑投资一家科技公司。你评估了他们的产品和知识产权。经过几天的分析，你判断这是一个不错的交易。你投资了
  100 万美元。投资获得了回报，两年内你获得了 30%的回报率。


  *   ***示例 #2：*** 你是一位对冲基金经理，正在考虑投资一家科技公司。经过数月的分析和尽职调查，你决定投资这家公司。他们有可靠的产品。你投资了 100
  万美元，但第二天，CEO 突发完全意外的致命心脏病。公司倒闭，你损失了投资。


  你可能认为第二个例子很牵强。这种事情*实际*发生的频率有多高？嗯，如果一个 CEO 突然去世，带走了 1.9 亿美元呢？


  大约有 1.9 亿美元的加密货币被锁在了一个在线黑洞中，因为一家货币交易所的创始人去世了，显然他带走了他们访问资金的加密权限。


  加拿大最大的加密货币交易所 QuadrigaCX 的投资者在 2018 年其创始人杰拉尔德·科顿前往印度旅行途中去世后，无法访问他们的资金。他当时 30 岁。


  根据加密货币新闻和活动公司 CoinDesk 首次报道的一份法院文件，被认定为科顿遗孀的珍妮弗·罗伯逊表示，该交易所欠其客户约 2.5 亿加元（1.9 亿美元）的现金和存放在其“冷钱包”中的加密货币。


  这些例子说明了两种不确定性：偶然不确定性和认知不确定性（请耐心听我解释）：


  *   **认知不确定性** 指的是由于缺乏数据或适当方法而存在的不确定性。如果我们有更多数据或更好的数据收集方法，认知不确定性就会消失。


  *   **偶然不确定性** 也被称为“统计不确定性”。它指的是系统固有的不确定性。这是我们无法消除的不确定性，但我们可以使用统计学或机器学习工具来控制它。




  在示例#1 中，对冲基金经理只花了几天时间分析公司，而在第二个案例中，他们花了几个月。理论上，有人可能会认为两个案例中的经理面临的都只是认知不确定性。如果掌握了关于公司、公司
  CEO 以及所有其他可能因素的完整信息，便能预测积极结果——换句话说，30%的回报率。


  但有两个论点将此转化为随机不确定性。首先，考虑到经理所面临的实际限制，了解某人是否患有严重疾病可能是无法实现的。在任何情况下，确实没有途径能掌握这种知识。


  不过，假设实际上这种知识*是*可以获取的。也许雇佣侦探就能办到。然而，即使我们得知此人患病，也只能了解其死亡概率。我们无法 100%确定此人是否会因此病去世，以及何时去世。


  这个例子也说明了随机不确定性与认知不确定性之间的界限很容易变得模糊。


  另一个例子（虽然略显刻板）是经典的掷骰子案例。^(²) 这是随机不确定性的典型例子。当骰子离开你的手时，无法预测它将落在何处。你可以计算出掷出任何一面的实际概率是
  1/6，但一旦骰子离手，就无法预测其落点。


  然而，如果你掌握了关于掷骰方式的完美信息，并拥有一个完美的掷骰物理模型，你或许能预测落点。因此，有人可能认为这是认知不确定性。但另一些人则可能认为，一旦骰子在空中，不确定性就是认知性的（因为我们可以建立一个世界物理模型来观察落点），而骰子还在人手中时，它属于随机不确定性，因为我们无法接入人类的神经系统并精确预测他们掷骰子的方式。如你所见，这个争论很快就变得非常复杂，并反映了塑造不确定性研究的讨论类型。


  尽管有人可能会争辩说所有不确定性来源都是认知性的，因为人类心智有认知一切的能力，但我们知道在实践中这绝对不是*不*成立的。此外，宇宙的本质可能对我们认识施加了一些不可预见的限制——例如海森堡不确定性原理（我将在后文回到这一点）。


  随机不确定性和认知不确定性也可能共存于同一个问题中。例如，想象你在赌场玩轮盘赌。赌场有两个轮盘（这大概是个很小的赌场，但对这里的目的来说足够了）。你得知其中一个轮盘有故障，导致结果分布不均匀。在标准的
  36 数字轮盘中，每个数字的概率是 1/36（约 2.7%），而在故障轮盘中，球落在 0 的概率是 5%。


  你同时面临这两种不确定性。首先，你面临关于哪个轮盘有故障的认知不确定性。但假设赌场与你共享了这个信息，现在你知道哪个轮盘有故障。你仍然面临随机不确定性，因为轮盘遵循概率规则。你无法收集更多数据以
  100%的准确性确定球下一次将落在何处。


  你面临的不确定性的确切类型可能随时间变化，取决于技术进步。但随机不确定性与认知不确定性之间的这种区分至今一直很好地服务于我们。


  而困惑并不止于此。Norvig 和 Russell 在 1994 年的著作*《AI：一种现代方法》*中还提到了*存在不确定性*和*身份不确定性*。^(³) 这是人工智能中遇到的两种不确定性。Norvig
  和 Russell 给出了一个在线书店使用 ISBN（国际标准书号）来命名每本书的例子。然而，一本书可能因版本和出版社的变化而拥有多个 ISBN。在这种情况下，零售商面临存在不确定性，即每个
  ISBN 实际指代的是哪本书。


  身份不确定性则围绕客户的身份。如果任何人都可以注册为顾客并对酒店或餐厅发表评论，那么新客户如何能 100%确定每个注册客户都是不同的实体，并且没有竞争对手连锁店创建
  100 个账号只是为了留下差评呢？


  虽然这些区分可能对 AI 领域的研究人员有用，但就我们的目的而言，这些类型的不确定性可以整齐地归入认知不确定性之下。如果我们对世界有更多了解，那么存在不确定性和身份不确定性都会消失。


  现在让我们继续，探讨不确定性中最基本的问题之一，以及哲学家们——从古代到现代——如何处理这个主题。


