- "# 真理、逻辑与归纳问题\n\n> *“倘若如此，它或许可能；倘若果真如此，它便会如此；但事实并非如此，那它就不是这样。这就是逻辑。”*\n> \n> *——*刘易斯·卡罗尔，《爱丽丝镜中奇遇记》\n\
  \n想象一下远古世界的生活。你是一位狩猎采集者。有时你的食物是你设法捕杀的动物，但其他时候可能是在野外采摘的水果、坚果和蔬菜。每一天都可能出现一种新的植物或新的矿物供你食用。但你如何知道哪些能提供营养，哪些又可能毒死你和你的部落呢？\n\
  \n嗯，你能做的最基本的事情就是通过试错法来找出哪些食物最有效。你只管吃下看起来还不错的食物，如果活下来，就可以假设这种食物大概是安全的。但你能确定这种食物在所有情况下都*永远*安全吗？那些看起来和它相似的食物呢？\n\
  \n你面临着一个需要处理的极端不确定性局面——你的生命真真切切取决于此。尽管你可能没有意识到，你会经历一个两步思考过程。你处理这种情况的方式遵循以下流程：\n\n\
  首先，实验：你尝试一下，看看会发生什么，并希望自己不会死掉。\n\n其次——一切顺利的话——你会根据亲身经历得出一些结论（以及理论）。\n\n在你尝试了某种红色浆果十次并都活下来之后，你断定这种浆果是安全的。然后你可能会提出一个理论：*所有*浆果都是安全的。或者所有红色水果都可以安全食用。\n\
  \n这就是*归纳推理*。归纳是收集数据、得出结论，并提出能概括这些数据的假设和理论的过程。我们具备这种能力，正是人类的特征之一。就其最简单的形式而言（而归纳问题可以变得非常非常复杂——这要归咎于大卫·休谟），归纳推理是从*特殊*到*一般*的推理过程。^(⁴)\
  \ 归纳推理的一个示例如下：\n\n- **我访问了一个新城市，迄今为止见到的所有人都穿黑色衣服。**\n- **因此，这个城市里所有人都必须穿黑色衣服。**\n\
  \n与归纳推理相对的是*演绎推理*——宽泛地说，你从*一般*过渡到*特殊*。以下是一个经典的演绎示例：\n\n- **所有人都会死。**\n- **苏格拉底是人。**\n\
  - **因此，苏格拉底会死。**\n\n正如这些例子希望展示的那样，归纳推理并非总是绝对可靠；几个世纪以来，它一直困扰着哲学家和数学家。你如何能从一个数据集出发，推导出普遍理论，并确信自己是正确的呢？\n\
  \n你试图找到一种方法来应对世界上的不确定性，或者至少找到一个可能有助于你应对不确定性的理论，但你的推理本身也面临着不确定性。\n\n本质上，演绎和归纳的区别在于：给定正确的前提，演绎总能得出正确的结论。但即使给定正确的前提，归纳仍可能得出错误的结论。\n\
  \n亚里士多德是第一个系统研究演绎和归纳的人。他将归纳描述为从“特殊”到“普遍”的论证。不过，他的研究重点是演绎推理和三段论，这也是亚里士多德逻辑学的基础。\n\
  \n弗朗西斯·培根在 1620 年出版的著作《新工具》中首次深入研究了归纳法。培根的方法包括通过观察和实验从自然界收集数据，并迭代地完善假设。\n\n约翰·洛克在归纳法的历史中也发挥了重要作用，同时他也是经验主义的先驱。根据经验主义，所有知识都是通过经验和感官获得的。在《人类理解论》中，洛克提出了“白板”这一术语，其理论是所有人来到世上时都像一块白板，没有任何先验知识。换言之，不存在与生俱来的观念。\n\
  \n在同一部著作中，洛克探讨了归纳问题。他写道：^(⁵)\n\n> *“我不否认，习惯于理性而规律实验的人，会比对此陌生的人更能洞察物体的本质，更准确地猜测其尚未可知的特性；但这……只是判断和意见，而非知识和确定性……我们对任何命题所给予的同意程度，都应取决于其有利的概率基础。”*\n\
  \n这是一段重要的陈述。首先，洛克认识到了归纳中的不确定性问题。虽然我们可以从特殊情况过渡到一般情况，但我们如何能确定自己的理论是正确的呢？接着，他使用了“概率”一词。尽管概率论当时尚未完全发展起来，但洛克在这里使用这个词，清楚地表明了他的观点：任何形式的归纳都是不确定的。\n\
  \n尽管归纳法很有用，但它看起来像是一个逻辑上的跳跃。我们根据例子得出一般规则，但我们如何知道这条规则成立呢？当我们找到一个反例来推翻我们的理论时，会发生什么？这就是洛克所观察到的。归纳似乎并非必然地遵循逻辑。我们永远无法对自己的结论有百分之百的把握。\n\
  \n归纳推理与我们如何提取科学真理直接相关，因此它的易错性具有广泛的影响。想想我们多么依赖科学来预测日常事件——从飞机保持在空中飞行到太阳升起。\n\n那么，我们能做些什么呢？\n\
  \n在探讨这个位于*不确定性*核心的问题之前，我们先来看看一些黑天鹅吧。\n\n\n\n"
- '# 第一只黑天鹅


  > *“专家的问题在于，他们不知道自己不知道什么。”*

  >

  > ——纳西姆·尼古拉斯·塔勒布，《黑天鹅：如何应对不可预知的未来》


  假设动物学领域出现了一种新奇生物，名为“天鹅”。这相当有趣——因为之前从未有人听说过*天鹅*。少数见过天鹅的人都说它们全是白色的。


  你是一位天鹅爱好者，被这些关于美妙生物的传说所吸引，决定更仔细地研究它们。你踏上了一段旅程，尽可能多地拍摄天鹅的照片。经过多年的艰辛努力，你拍摄了 1000 张天鹅照片，全部是白色的。你能断定地球上的所有天鹅都是白色的吗？你的把握有多大？你能用介于
  0 到 1 之间的概率`p[1]`来表达这种确定性吗？


  如果你拍摄了 1 万张或 100 万张照片，你的把握程度会变化多少？你能得出一个新的概率`p[2]`吗？`p[1]`会比`p[2]`小还是大？如果你和大多数人一样，你会——合理地——认为
  1 万张或 100 万张照片比仅仅 1000 张照片提供了更多证据和更大信心。因此，`p[2] > p[1]`。


  假设全世界的天鹅学家在十年间只记录到了白天鹅的照片。于是，共识便是天鹅是白色的。


  但随后有人拿出了一张黑天鹅的照片。^(⁶) 现在呢？*现在*，“所有天鹅都是白色的”这一说法的概率为 0。纯粹是零。对一个事实的否定具有绝对的确定性。


  无论你此前多么坚信“白天鹅”这一说法是正确的，事实都证明你完全错了。至少现在，你对这一说法的反面——“并非所有天鹅都是白色的”——有了完全的确定性。


  这个问题表明，一个通过归纳推理建立起来的论点，只需一个反例就能让它土崩瓦解——无论我们之前有多少数据点来支持它。


  这个问题的类似形式最早由苏格兰哲学家大卫·休谟提出。休谟是系统研究“归纳问题”的哲学家。虽然洛克是第一个概述归纳推理一些问题的人，但休谟深入聚焦了问题本身。


  同样身为经验主义者的休谟提出了以下情境。假设我观察到，所有（外观相似的）面包的特定实例都具有营养。我如何*知道*下一个实例也会具有营养，而不会毒死我呢？


  休谟意识到，仅仅因为我们至今在每个实例中都观察到了因果关系，我们并不能从逻辑上推断这种关系会持续存在并永远成立。这个问题长久以来一直困扰着哲学界。20 世纪著名哲学家伯特兰·罗素写道，如果休谟的问题无法解决，那么“理智与疯狂之间就没有智识上的区别了。”^(⁷)


  罗素的见解不无道理。除非我们有一个可靠的程序，可以从我们当前的数据和逻辑前提推断出更普适的世界理论，否则我们无法对抗不确定性。然而，无论这个问题在逻辑上提出了怎样的挑战，显而易见的是，人类运用归纳推理已很久很久，且非常成功。因此有迹象表明——至少在实践上，而非理论上——这个问题是可以解决的。让我们看看几位关键人物是如何应对的。


  经济学家约翰·梅纳德·凯恩斯在其著作《概率论》（1921）中提出了以下解决方案：


  - “……我们归纳所覆盖领域内的对象，并不拥有无限数量的独立属性；换句话说，它们的特征无论多么繁多，都凝聚成若干组恒定关联，这些组的数量是有限的。”


  这被称为“有限独立多样性原则”。凯恩斯认为，我们观察到的能验证某个给定假设的实例越多，我们就越能确定该假设可能成立。这是一种概率性的解决方法。根据凯恩斯，在看到
  1 万只天鹅后，我们或许可以得出结论：“所有天鹅都是白色的”这一结论的概率接近 99.9%。我们仍有可能观察到非白色的天鹅。


  伯特兰·罗素则采取了一种更务实的方法。在他看来，世界以特定种类的规律性为特征。生物体通过进行推理，基于这些规律性形成习惯，这反过来有助于它们在自然世界中的适应和生存。罗素断言：


  - “形成能导致正确预期的推理习惯，是适应环境的一部分，而生物生存正依赖于这种适应。”


  因此，根据罗素的观点，进化论已在经验上验证了这种方法，这本身就足以解释归纳推理为何有效。这是一个有趣的观点，部分原因在于它与机器学习密切相关，你将在后面的章节中看到。


  卡尔·波普尔是认识论领域最著名的人物之一。波普尔承认归纳推理是有缺陷的——我们永远无法完全确信我们的理论是正确的。然而，我们*可以*确信我们的理论是错误的。要证伪一个理论，我们只需要一个反例；在这种情况下，例外*恰恰证明了*规则的不成立。


  根据波普尔的观点，我们应该做的是暂时接受理论，直到它们被证伪，然后再提出新的理论。科学的进步是通过不断证伪旧理论并创立新理论来实现的。波普尔称此为“检验的演绎法”。


  这种方法看似悲观，但从逻辑角度看是站得住脚的。然而，从经验角度看，并没有多少人认同这种思维方式，并且该理论在实践中也受到了批评。


  波普尔对科学的巨大贡献在于，他为我们提供了一个理论被视为科学的最低要求。根据他的“可证伪性原则”——也称“波普尔证伪原则”——科学理论只有在可被证伪的前提下才能被视为科学。


  举例来说，假设你提出以下理论：


  > 虽然太阳的升落遵循行星运动定律，但太阳的升起和落下也受到一只居住在阿拉斯加的独角兽的影响。这只名叫鲍勃的独角兽需要用他闪闪发光的螺旋角来让太阳升起。鲍勃是隐形的，而且不太喜欢人类。因此，尽管他住在阿拉斯加，你也不太可能找到他。


  这与许多古代人思考太阳为何升起时所提出的理论类似。某种超自然实体控制着天体以及雨、龙卷风等物理现象。


  那么，独角兽鲍勃或者控制天气的神灵有什么问题呢？问题在于，无法证明这些理论是否正确。如果那只独角兽叫桑德拉，而不是鲍勃，会有什么不同吗？你如何检验围绕这个理论的任何假设？你根本做不到。


  类似的理论也曾被构想出来，但经过仔细审查，它们是不可证伪的，必须被归为伪科学。


  其中最著名的遭受此类抨击的理论是弗洛伊德的精神分析学。虽然精神分析实践在全球许多地方仍然流行，但大部分关于心灵的精神分析解释被认为是不科学的。这是由于循环论证以及缺乏明确的途径来设计能证伪这些理论的实验。




  例如，假设你被精神分析师诊断为患有某种神经症。你对此提出异议，精神分析师则回应称，你的反对恰恰是因为你的神经症。这是一个循环论证的例子。如果任何不认同神经症诊断的人都只是因为自身患有神经症，那么我们如何能反驳这个理论？我们无法做到。


  精神分析学的另一个问题是弗洛伊德的梦的解析理论。根据弗洛伊德的观点，梦是压抑冲动的象征，这些冲动如果以真实形式出现在梦中，会吓到做梦者。这些冲动本质上极为原始、暴力且充满性欲。精神分析师必须找到梦中各种象征的解读。然而，过往的研究中，不同的精神分析师对同一个梦得出了截然不同的解读。^(⁸)
  如果不同的专家对同一个梦能得出根本不同的解读，我们又如何能真正证伪这个理论？


  卡尔·波普尔在其著作《猜想与反驳：科学知识的增长》（1962 年）中亲自批判了精神分析学。波普尔对弗洛伊德和阿尔弗雷德·阿德勒都持高度批判态度。阿德勒是弗洛伊德最早的追随者之一，波普尔曾有机会在他的一个诊所中短暂工作。波普尔认为，精神分析学的主要问题在于，它能够容纳并解释所有人类行为，但却无法提供任何证伪的手段。它没有真正的预测，只有事后的解释。


  尽管受到批评，精神分析学显然仍然存在。虽然波普尔的批评在某种程度上是正确的，但它也忽略了一些其他重要方面。弗洛伊德的精神分析理论也凸显了人类心理学的一些重要方面，例如潜意识的存在。其次，弗洛伊德是最早研究儿童发展的人之一。他为儿童以某些方式行事——这些方式在成人眼中可能令人费解——找到了解释。


  波普尔对精神分析学的批判，引出了一个关于不确定性的重要问题。精神分析学试图解释许多事情，比如梦，但这些解释都是在事件发生之后进行的。但我们如何能知道这些解释是正确的呢？这不仅仅是精神分析学的问题；我们在日常生活中也会遇到。我们都有关于他人为何做出某些决定的理论，或者我们的决定如何影响他人。新手父母时常面临这些困境，并不断提出关于如何抚养孩子的、不断演进的理论。


  但在事件**发生之后**，要确知精确的因果关系并不容易。例如，这是研究最佳商业实践时常见的一个谬误。你可能会时不时读到一篇关于最成功企业和企业家的习惯或策略的文章。但这些研究**没有**告诉你的是，有多少企业和企业家遵循了完全相同的原则却彻底失败了。通过只关注事件发生后的正面例子，我们可能会得出各种看似显而易见的解释。然而，在现实中，如果没有反例，我们就不可能证实我们的任何理论。我们需要比较不同的企业家和策略，其中一些失败了，一些成功了，才能找到决定性的因素。没有变量，就没有学习。


  托马斯·库恩，可以说是与卡尔·波普尔齐名的、最具影响力的知识论学家之一，他认为进步是通过范式转换实现的。与当时的主流思想相反，库恩在其 1962 年的著作《科学革命的结构》中，反对进步仅通过积累更多事实和知识来实现的观点。


  根据库恩的理解，范式是我们看待世界和解释知识的一种方式。科学理论并非通过增加更多事实而不断改进。相反，进步是通过用新范式取代旧范式——即范式转换——来实现的。这通常是通过老一辈科学家的消亡和新一代科学家的出现而发生的。


  例如，库恩分析了哥白尼革命。尼古拉·哥白尼是一位数学家和天文学家，他将太阳而非地球置于宇宙的中心。在哥白尼之前，由托勒密设计的托勒密体系被认为是世界的真实版本，地球是宇宙的中心。当然，现在我们知道我们生活在一个远比太阳系大得多的宇宙中，但人类花了
  1300 多年才弄清楚这一点。


  哥白尼革命不仅仅是事实的积累，而是一种看待世界的全新方式。但直到伽利略·伽利莱，这一范式转换才得以完成。哥白尼仍在沿用托勒密的均轮和本轮工具，这导致了一个复杂到无人相信的模型。


  伽利略使这一转变成为可能，而约翰内斯·开普勒随后通过引入日心说体系完成了范式转换。这些理论的细节与我们的讨论关系不大；这里的要点是，改变世界的发现是通过摒弃旧知识而实现的——革故鼎新。而“新”与“确定性”很难共存。


  回到心理学，精神分析学带给了我们所谓的心灵“液压”模型。根据这一模型，潜意识冲动不断积累，然后需要被释放。信息时代随后又带给了我们心灵的计算模型，根据这一模型，我们的心灵就像一台拥有存储器和处理单元的计算机。


  最近的类比则受到数据科学成功的启发。以托马斯·贝叶斯命名的贝叶斯方法认为，大脑在进行某种形式的整合。这启发了一种叫做“理性分析”的方法。根据这一观点，心灵已经进化到适应其所在环境的地步。该理论的提出者约翰·安德森建议，我们应遵循一个六步流程来研究它。^(⁹)
  传统的认知心理学方法假设人类存在偏见；例如，基于过去遇到利物浦人的经历，你可能会假设所有利物浦人（利物浦本地人）都很有趣。理性分析则假设人类实际上是理性的，因为心灵已被优化以适应其环境。


  从液压模型到计算模型，再到理性分析，这代表了一次范式转换。一种观点认为心灵由需要释放的冲动组成；另一种模型则认为心灵像一台有缺陷的计算机。后一种方法表明，心灵实际上是针对其环境进行了优化的，因此我们需要从不同的视角来看待它。


  根据库恩的说法，不同的理论是“不可通约的”。这意味着我们无法从一种理论的角度去理解另一种理论，因为它们没有共同的基础或共享的比较标准。你不能用某一范式的工具去证明或证伪另一个范式。这一观点有趣的推论是，科学进步是缺乏方向性的。


  理论物理学家史蒂文·温伯格捕捉到了这一观点：^(¹⁰)


  *   “库恩承认麦克斯韦和爱因斯坦的理论比之前的理论更好，就像哺乳动物在应对彗星撞击影响方面比恐龙更成功一样，但当新问题出现时，它们将被更能解决这些问题的理论所取代，如此循环，但并没有整体上的改进。”




  关于归纳问题，库恩驳斥了波普尔的方法。他指出：“不存在没有反例的研究……如果每一次不符合理论都成为理论被拒斥的理由，那么所有理论都应该随时被拒斥。”在库恩看来，科学并非追求真理的事业。相反，理论处于某种演化博弈之中，它们相互竞争，最优秀的理论得以存续。


  我们可以将库恩的方法描述为实用主义的，且与其前辈的方法截然不同。他承认科学过程中的人为因素。然而，他的理论也受到了批评，因为并非所有科学进步都通过革命来实现。


  在这种情况下，出现了另一种不确定性。这就是关于科学理论的不确定性。科学在各个时代经历了不同程度的兴衰。从解决人类所有问题的灵丹妙药，到如今我们生活在一个专家信誉扫地、假新闻充斥网络的时代。只要想想有多少人不相信全球变暖就知道了。


  归纳推理的历史表明，在与未知作斗争时，没有简单的解决办法。那些将科学视为万能药的人往往忘记了，它是一个*过程*，自身也充满困难、坎坷和障碍。


  即使我们永远无法从逻辑上断定归纳推理是正确的，但挑战或许在于解释为何它在众多情况下似乎行之有效。


