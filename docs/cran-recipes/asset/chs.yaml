  ### 16.2.18 生存分析


  在医学研究中，一个标准问题是询问患者在针对某种疾病接受特定治疗/不治疗后能存活多久。从历史上看，生存分析一直是保险公司非常感兴趣的领域，因为他们的精算师会根据历史数据调整费率。R
  提供了一些强大的工具来解决这些问题。随着时间的推移，生存分析已不仅仅涵盖医学/保险主题。一个客户流失率高的企业会希望根据客户的预计“生命周期”（即客户停止使用一家公司服务并转而注册另一家公司服务之前的时长），来决定投入多少成本来获取新客户（广告费用等）。图
  16-20 展示了 `survival` 包的一个典型图表。


  网站 `sdhta.com` 列出了生存分析的一些示例应用：^(⁷⁷)


  *   ***癌症研究***，用于患者生存时间分析

  *   ***社会学***，用于“事件史分析”

  *   ***工程学***，用于“失效时间分析”


  在癌症研究中，典型的研究问题如下：


  *   某些临床特征对患者生存期有何影响？

  *   个体存活 3 年的概率是多少？

  *   不同患者群体之间的生存率是否存在差异？


  ```

  if (!require("survival")) install.packages("survival")

  if (!require("survminer")) install.packages("survminer")

  data("lung")

  head(lung)

  ##   inst time status age sex ph.ecog ph.karno pat.karno meal.cal wt.loss

  ## 1    3  306      2  74   1       1       90       100     1175      NA

  ## 2    3  455      2  68   1       0       90        90     1225      15

  ## 3    3 1010      1  56   1       0       90        90       NA      15

  ## 4    5  210      2  57   1       1       90        60     1150      11

  ## 5    1  883      2  60   1       0      100        90       NA       0

  ## 6   12 1022      1  74   1       1       50        80      513       0

  拟合模型 (Kaplan-Meier 生存估计)：

  fit <- survfit(Surv(time, status) ~ sex, data = lung)

  ggsurvplot(fit,

  pval = TRUE, conf.int = TRUE,

  risk.table = TRUE, # Add risk table

  risk.table.col = "strata", # Change risk table color by groups

  linetype = "strata", # Change line type by groups

  surv.median.line = "hv", # Specify median survival

  ggtheme = theme_bw(), # Change ggplot2 theme

  palette = c("#E7B800", "#2E9FDF"))

  ```


