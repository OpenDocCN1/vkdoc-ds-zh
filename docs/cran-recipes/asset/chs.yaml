  创建一个从 2009 年 12 月开始的月度时间序列：


  ```r

  values.as.time.series <- ts(values1, start = c(2009,12),

  frequency = 12)

  model.hw = HoltWinters(values.as.time.series)

  p = predict(model.hw, 15) #look at 15 periods into the future

  p

