  ```\n\n使用 `match` 控制显示内容：\n\n```\nstr_view(c(\"abc\", \"def\", \"fgh\"), \"d|e\"\
  )\n# d     -- start of def\nstr_view(c(\"abc\", \"def\", \"fgh\"), \"d|e\", match\
  \ = TRUE)\n# d\n```\n\n注意，下面代码中没有内容被高亮：\n\n```\nstr_view(c(\"abc\", \"def\", \"\
  fgh\"), \"d|e\", match = FALSE)\n```\n\n现在高亮的字符被显示出来：\n\n```\nstr_view(c(\"hair\"\
  , \"haematic\"), \"ha(i|e)\")\n# hai\n# hae\n```\n\n## 2.5 便捷的自动换行\n\n将字符串包装成格式优美的段落。如果你需要清理从多个来源以不同格式导入或粘贴的文本，这个函数可以节省大量时间。由于篇幅限制，以下一些列表已被截断^(¹⁶)：\n\
