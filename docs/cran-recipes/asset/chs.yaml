- '# 8. 正则表达式的元素


  字面量就是字符本身，例如 `"a"` 或 `"boat"` 或 `"123"`。有些字符被“保留”以具有特殊含义，例如 `"+"`。对于加号而言，其特殊含义是“像加号左侧字符那样的额外字符”。如果你想在正则表达式中将这些保留字符用作字面量，需要使用反斜杠对其进行转义。如果你想匹配
  `1+1=2`，正确的正则表达式是 `1\\+1=2`。否则，加号将具有特殊含义。^(⁵²) 请记住，这里需要两个反斜杠。


  ```

  string1 <- "This is elementary Watson. 1+1=2"

  my.regex <- "1\\+1=2"

  my.regex.replacement.value <- "two plus two equals four "

  sub(pattern = my.regex,replacement =

  my.regex.replacement.value,x = string1)

  ## [1] "This is elementary Watson. two plus two equals four "

  ```


  使用只包含字面量的模式。`sub` 在找到与模式匹配的内容时进行替换。注意，在这个例子中，只有第一个 `"a"` 被替换了：


  ```

  string1  <- "Why do Java Programmers have to wear glasses?

  Because they can''t C."

  my.regex <- "[a]"

  my.regex.replacement.value <- "dog"

  sub(pattern = my.regex,replacement =

  my.regex.replacement.value,x = string1)

  ## [1] "Why do Jdogva Programmers have to wear glasses?  Because they can''t C."

  ```


  ## 8.1 元字符


  表 8-1 列出了元字符及其含义。


  **表 8-1** 元字符及其含义


  | 字符 | 用于指示 |

  | --- | --- |

  | `^` | 字符串的开头。 |

  | `$` | 字符串的结尾。 |

  | `.` | 除换行符外的任何字符。 |

  | `*` | 匹配零次或多次。 |

  | `+` | 匹配一次或多次。 |

  | `?` | 匹配零次或一次，或最短匹配。 |

  | `\|` | 备选项（或）。 |

  | `( )` | 分组，用于“存储”。 |

  | `[ ]` | 字符集合。 |

  | `{ }` | 重复修饰符。 |

  | `\` | 引号或特殊用途。 |


  字符 `$1` 引用第一组括号内的任何内容。


  ## 8.2 范围


  正则表达式的范围有点奇怪。你可能会认为 `[0-256]` 是用来匹配数字 0–256 的正确正则表达式。不幸的是，它没那么简单。有时正则表达式会让你想起一个有口臭的表亲。你容忍他是因为他是家人，但尽量不站得太近。同样，我们必须容忍数字范围的正则表达式语法。


  ### 8.2.1 数字


  要匹配数字，请使用 `[0-9]`。要匹配特定数量的数字（且仅匹配那么多数字），请使用 `^[0-9]{n}$`，其中 `n` 是你需要匹配的数字位数。例如，一个三位数的数字将被
  `^[0-9]{3}$` 匹配。


  使用 `grepl` 进行数字匹配的示例。为了返回 TRUE，字符串必须只包含数字，且位数在一位到三位之间：


  ```

  x <- c("a","99","89x", "2","333","123", "123456","367")

  grepl("^[0-9]{1,3}$",x)

  ## [1] FALSE  TRUE FALSE  TRUE  TRUE  TRUE FALSE  TRUE

  ```


  仅当恰好三个元素匹配时才评估为 TRUE：


  ```

  grepl("^[0-9]{3}$",x)

  ## [1] FALSE FALSE FALSE FALSE  TRUE  TRUE FALSE  TRUE

  ```


  包含至少一个 0–5 数字：


  ```

  grepl("[0-5]",x)

  ## [1] FALSE FALSE FALSE  TRUE  TRUE  TRUE  TRUE  TRUE

  my.regex <- "^([012]?[0-9]?[0-9]|3[0-5][0-9]|36[0-6])$"  #0-366, only digits

  grepl(my.regex,x)

  ## [1] FALSE  TRUE FALSE  TRUE  TRUE  TRUE FALSE FALSE

  ```


  仅对 0–255 的数字评估为 TRUE：


  ```

  my.regex <- "^([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])$"

  grepl(my.regex,x)

  ## [1] FALSE  TRUE FALSE  TRUE FALSE  TRUE FALSE FALSE

  ```


  ### 8.2.2 字母


  正如所料，使用正则表达式的 `grepl` 允许文本查询。


  字符串必须以小写字母开头才能评估为 TRUE：


  ```

  x <- c("a","99","89x", "2","333","qqq123", "123456z","367")

  grepl("^[a-z]",x)

  ## [1]  TRUE FALSE FALSE FALSE FALSE  TRUE FALSE FALSE

  ```


  ## 8.3 大小写敏感性


  大小写敏感的示例：


  ```

  stringa <- "OX"

  stringb <- "Post Box"

  grep(stringa,stringb)

  ## integer(0)

  ```


  现在忽略大小写。`1` 表示 `OX` 与 `stringb` 的第一个（也是唯一一个）元素匹配：


  ```

  grep(stringa, stringb, ignore.case = TRUE)

  ## [1] 1

  ```


  ## 8.4 重复


  这个正则表达式模式匹配任何包含三个或更多 `a` 的内容：


  ```

  x <- c("a", "aa", "aaa", "aaaa", "aaaaa")

  my.regex <- "a{3}"

  grepl(my.regex, x)

  ## [1] FALSE FALSE  TRUE  TRUE  TRUE

  ```


  查找重复的单词。该正则表达式模式同时包含大写和小写字母：


  ```

  x <- c("max", "head head", "HEAD HEAD", "max Max max max")

  my.regex <- "\\b([A-Z,a-z]+)\\s+\\1\\b"

  grepl(my.regex, x, perl = TRUE)

  ## [1] FALSE  TRUE  TRUE  TRUE

  ```


  ## 8.5 否定：NOT 语法


  感叹号表示否定。在下面的示例中，整个 `grepl` 表达式/函数被否定。^(⁵³) 由 @IceCreamToucan^(⁵⁴) 友好提供的另一种引入否定的方法是使用
  `"invert = TRUE"`：


  ```

  string = c("business_metric_one","business_metric_one_dk","business_metric_one_none","business_metric_two","business_metric_two_dk","business_metric_two_none")

  string[!grepl("business_metric_[[:alpha:]]+_(dk|none)", string)]

  ## [1] "business_metric_one" "business_metric_two"

  ```


  下一个任务是找到一个正则表达式，使其只匹配 `"a rheumatic fever"`。`"invert = TRUE"` 是一种巧妙的方式，表示“返回 `grep`
  没有找到的内容”。


  ```

  my_strings <- c("a non-rheumatic fever",

  "a nonrheumatic fever", "a rheumatic fever",

  "a not rheumatic fever")

  grep("no[nt][- ]?rheumatic", my_strings, invert = TRUE,

  value = TRUE)

  ## [1] "a rheumatic fever"

  ```




  ## 8.6 分组


  你可以使用圆括号 `(` `)` 来界定正则表达式的一部分。例如，`(\\d+)` 指定了一个连续的数字组。使用括号可以对整个组应用量词，或将选择操作限制在正则表达式的一部分。


  `Regmatches` 示例：当 `1234` 和 `567` 前面有 `xy` 时，将它们提取出来：


  ```r

  s <- "xy1234wz98xy567"

  r <- "xy(\\d+)"

  gsub(r, "\\1", regmatches(s,gregexpr(r,s))[[1]])

  ## [1] "1234" "567"

  ```


  使用 `Stringr` 从字符串中提取匹配的组：


