  \ dotall = TRUE))\n## [1] FALSE\n```\n\n## 7.2 锚点\n\n锚点，就像船只的锚一样，提供了一个附着点。通过锚点字符，正则表达式可以从字符串的开头或结尾开始匹配。例如，假设你在\
