  元字符是具有特定含义的字符，例如“这是一个数字”或“这意味着字符必须位于字符串的末尾”。它们定义了搜索条件和文本操作。忠实的正则表达式粉丝们喜欢穿着印有“I never
  metacharacter I didn''t like.”字样的 T 恤。


  元字符包括：


  ```

  ( ) [ ] { } ^ $ . \ ? * + | \d

  ```


  如果你想将某个通常作为元字符的字符视为普通字符，那么请在其前面加上一个斜杠（转义字符）。上一节展示了一些示例元字符和记法。表 6-2 和 6-3 分别显示了元字符和重复字符。^(46)


