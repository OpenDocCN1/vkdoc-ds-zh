  \n泊松分布函数的使用示例：如果平均每分钟有 12 辆车通过一座桥，求某分钟内恰好有 17 辆或更多车辆通过该桥的概率。\n\n某分钟内恰好有 16 辆或*更少*车辆通过该桥的概率由函数`ppois`给出。\n\
