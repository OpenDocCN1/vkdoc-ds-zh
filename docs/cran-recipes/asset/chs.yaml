  | `a?` | 零个或一个 a（即 a 是可选的）。 |

  | `a{m}` | 恰好 m 个 a。 |

  | `a {m,}` | 至少 m 个 a。 |

  | `a{m,n}` | 至少 m 个但最多 n 个 a。 |

  | `Repetition?` | 与重复相同，但取**最短**的匹配。 |


