    \    32 16 8\nk =\n    5 16 2187\n```\n\n以上操作都是有效的，因为在所有情况下，变量操作数都具有相同的维度，因此操作可以成功逐元素执行。对于加法和减法，向量和矩阵之间没有区别，因为这两种情况下的操作是相同的。\n\
    \n矩阵变量最重要的运算符指定如下：\n\n| `A + B`, `A - B`, `A * B` | 矩阵的加法、减法和乘法。 |\n| `A\\B` |\
    \ 如果 `A` 是方阵，则 `A\\B = inv(A) * B`。如果 `A` 不是方阵，则 `A\\B` 是系统 `AX = B` 在最小二乘意义上的解。\
    \ |\n| `B/A` | 等同于 `(A' \\ B')'`。 |\n| `A^n` | 等同于 `A * A * A *... *A` n 次（n 为整数）。\
    \ |\n| `p^A` | 仅当 `p` 是标量时才执行幂运算。 |\n\n以下是一些示例：\n\n```\n>> X = [5,4,3]; Y = [1,2,7];\
    \ l = X'* Y, m = X * Y ', n = 2 * X, o = X / Y, p = Y\\X\n\nl =\n     5 10 35\n\
    \     4 8 28\n     3 6 21\nm =\n    34\nn =\n    10 8 6\no =\n    0.6296\np =\n\
    \     0         0         0\n     0         0         0\n     0.7143    0.5714\
    \    0.4286\n```\n\n上述所有矩阵运算都有明确的定义，因为操作数的维度在每种情况下都是兼容的。我们绝不能忘记，向量是矩阵的一种特殊情况，但要以其矩阵形式（而不是逐元素）进行操作，必须遵守矩阵运算的维度规则。例如，向量运算\
    \ `X.' * Y` 和 `X.*Y'` 没有意义，因为它们涉及不同维度的向量。类似地，矩阵运算 `X * Y`、`2/X`、`2\\Y`、`X²`、`2^X`\
    \ 和 `X^Y` 也没有意义，同样是因为数组中的维度冲突。\n\n以下是矩阵运算符的更多示例。\n\n```\n>> M = [1,2,3;1,0,2;7,8,9]\n\
    \nM =\n     1 2 3\n     1 0 2\n     7 8 9\n\n>> B = inv(M), C = M ^ 2, D = M ^(1/2),\
    \ E = 2 ^ M\n\nB =\n   -0.8889    0.3333    0.2222\n    0.2778   -0.6667    0.0556\n\
    \    0.4444    0.3333   -0.1111\nC =\n    24    26    34\n    15    18    21\n\
    \    78    86   118\nD =\n    0.5219 + 0.8432i   0.5793 - 0.0664i   0.7756 - 0.2344i\n\
    \    0.3270 + 0.0207i   0.3630 + 1.0650i   0.4859 - 0.2012i\n    1.7848 - 0.5828i\
    \   1.9811 - 0.7508i   2.6524 + 0.3080i\nE =\n    1.0e+003 *\n    0.8626    0.9568\
    \    1.2811\n    0.5401    0.5999    0.8027\n    2.9482    3.2725    4.3816\n\
    ```\n\n### 关系运算符\n\nMATLAB 还提供了关系运算符。关系运算符对两个矩阵执行逐元素比较，并返回一个大小相同的数组，如果对应关系为真，则其元素为零；如果对应关系为假，则其元素为一。关系运算符也可以将标量与向量或矩阵进行比较，在这种情况下，标量将与数组的所有元素进行比较。以下是这些运算符的表格。\n\
    \n| `<` | 小于（对于复数，这仅适用于实部） |\n| `<=` | 小于或等于（仅适用于复数的实部） |\n| `>` | 大于（仅适用于复数的实部）\
    \ |\n| `>=` | 大于或等于（仅适用于复数的实部） |\n| `x == y` | 等于（也适用于复数） |\n| `x ~= y` | 不等于（也适用于复数）\
    \ |\n\n### 逻辑运算符\n\nMATLAB 提供了表示逻辑运算符的符号。下表中显示的逻辑运算符提供了一种组合或否定关系表达式的方法。\n\n| `~A`\
    \ | 逻辑非（NOT）或 `A` 的补集。 |\n| `A & B` | 逻辑与（AND）或 `A` 与 `B` 的交集。 |\n| `A \\| B`\
    \ | 逻辑或（OR）或 `A` 与 `B` 的并集。 |\n| `XOR(A, B)` | 异或（XOR）或 `A` 与 `B` 的对称差（如果 `A`\
    \ 或 `B` 为 1，但不同时为 1，则取值为 1）。 |\n\n以下是一些示例：\n\n```\n>> A = 2:7; P = (A > 3) & (A\
    \ < 6)\nP =\n     0     0     1     1     0     0\n```\n\n当 `A` 的对应元素大于 3 且小于\
    \ 6 时返回 1，否则返回 0。\n\n```\n>> X = 3 * ones(3,3); X >= [7 8 9; 4 5 6 ; 1 2 3]\n\
    ans =\n     0 0 0\n     0 0 0\n     1 1 1\n```\n\n解数组中对应于 `X` 中大于或等于矩阵 `[7 8 9;\
    \ 4 5 6 ; 1 2 3]` 对应项的元素被赋值为 1。其余元素被赋值为 0。\n"
- fmt: '# Logical Functions


    MATLAB implements logical functions whose output can take the value `true` (1)
    or `false` (0). The following table shows the most important logical functions.


    | `exist(A)` | Checks if the variable or function exists (returns 0 if `A` does
    not exist and a number between 1 and 5, depending on the type, if it does exist).
    |

    | `any(V)` | Returns 0 if all elements of the vector `V` are null and returns
    1 if some element of `V` is non-zero. |

    | `any(A)` | Returns 0 for each column of the matrix `A` with all null elements
    and returns 1 for each column of the matrix `A` which has non-null elements. |

    | `all(V)` | Returns 1 if all the elements of the vector `V` are non-null and
    returns 0 if some element of `V` is null. |

    | `all(A)` | Returns 1 for each column of the matrix `A` with all non-null elements
    and returns 0 for each column of the matrix `A` with at least one null element.
    |

    | `find(V)` | Returns the places (or indices) occupied by the non-null elements
    of the vector `V`. |

    | `isnan(V)` | Returns 1 for the elements of `V` that are indeterminate and returns
    0 for those that are not. |

    | `isinf(V)` | Returns 1 for the elements of `V` that are infinite and returns
    0 for those that are not. |

    | `isfinite(V)` | Returns 1 for the elements of `V` that are finite and returns
    0 for those that are not. |

    | `isempty(A)` | Returns 1 if `A` is an empty array and returns 0 otherwise (an
    empty array is an array such that one of its dimensions is 0). |

    | `issparse(A)` | Returns 1 if `A` is a sparse matrix and returns 0 otherwise.
    |

    | `isreal(V)` | Returns 1 if all the elements of `V` are real and 0 otherwise.
    |

    | `isprime(V)` | Returns 1 for all elements of `V` that are prime and returns
    0 for all elements of `V` that are not prime. |

    | `islogical(V)` | Returns 1 if `V` is a logical vector and 0 otherwise. |

    | `isnumeric(V)` | Returns 1 if `V` is a numeric vector and 0 otherwise. |

    | `ishold` | Returns 1 if the properties of the current graph are retained for
    the next graph and only new elements will be added and 0 otherwise. |

    | `isieee` | Returns 1 if the computer is capable of IEEE standard operations.
    |

    | `isstr(S)` | Returns 1 if `S` is a string and 0 otherwise. |

    | `ischart(S)` | Returns 1 if `S` is a string and 0 otherwise. |

    | `isglobal(A)` | Returns 1 if `A` is a global variable and 0 otherwise. |

    | `isletter(S)` | Returns 1 if `S` is a letter of the alphabet and 0 otherwise.
    |

    | `isequal(A, B)` | Returns 1 if the matrices or vectors `A` and `B` are equal,
    and 0 otherwise. |

    | `ismember(V, W)` | Returns 1 for every element of `V` which is in `W` and 0
    for every element `V` that is not in `W`. |


    Below are some examples using the above defined logical functions.


    ```

    >> V = [1,2,3,4,5,6,7,8,9], isprime(V), isnumeric(V), all(V), any(V)

    V =

    1     2     3     4     5     6     7     8     9

    ans =

    0     1     1     0     1     0     1     0     0

    ans =

    1

    ans =

    1

    ans =

    1

    >> B = [Inf, -Inf, pi, NaN], isinf(B), isfinite(B), isnan(B), isreal(B)

    B =

    Inf - Inf 3.1416 NaN

    ans =

    1 1 0 0

    ans =

    0 0 1 0

    ans =

    0 0 0 1

    ans =

    1

    >> ismember ([1,2,3], [8,12,1,3]), A = [2,0,1];B = [4,0,2]; isequal (2A * B)

    ans =

    1 0 1

    ans =

    1

    ```


    ## Exercise 2-1


    Find the number of ways of choosing 12 elements from 30 without repetition, the
    remainder of the division of 2^134 by 3, the prime decomposition of 18900, the
    factorial of 200 and the smallest number N which when divided by 16,24,30 and
    32 leaves remainder 5.


    ```

    >> factorial (30) / (factorial (12) * factorial(30-12))

    ans =

    8.6493e + 007

    ```


    The command `vpa` is used to present the exact result.


    ```

    >> vpa ''factorial (30) / (factorial (12) * factorial(30-12))'' 15

    ans =

    86493225.

    >> rem(2^134,3)

    ans =

    0

    >> factor (18900)

    ans =

    2     2     3     3     3     5     5     7

    >> factorial (100)

    ans =

    9. 3326e + 157

    ```


    The command `vpa` is used to present the exact result.


    ```

    >> vpa '' factorial (100)'' 160

    ans =

    93326215443944152681699238856266700490715968264381621468592963895217599993229915608941463976156518286253697920827223758251185210916864000000000000000000000000.

    ```


    N-5 is the least common multiple of 16, 24, 30 and 32.


    ```

    >> lcm (lcm (16.24), lcm (30,32))

    ans =

    480

    ```


    Then N = 480 + 5 = 485.


    ## Exercise 2-2


    In base 5 find the result of the operation defined by `a25aaff6`[16] + `6789aba`[12]
    + `35671`[8] + `1100221`[3] - 1250. In base 13 find the result of the operation
    (`666551`[7])*(`aa199800a`[11]) +(`fffaaa125`[16]) / (`33331`[4] + 6). The result
    of the first operation in base 10 is calculated as follows:


    ```

    >> base2dec(''a25aaf6'',16) + base2dec(''6789aba'',12) +...

    base2dec(''35671'',8) + base2dec(''1100221'',3)-1250

    ans =

    190096544

    ```


    We then convert this to base 5:


    ```

    >> dec2base (190096544,5)

    ans =

    342131042134

    ```


    Thus, the final result of the first operation in base 5 is `342131042134`.


    The result of the second operation in base 10 is calculated as follows:


    ```

    >> base2dec(''666551'',7) * base2dec(''aa199800a'',11) +...

    79 * base2dec(''fffaaa125'',16) / (base2dec (''33331'', 4) + 6)

    ans =

    2. 7537e + 014

    ```


    We now transform the result obtained into base 13.


    ```

    >> dec2base (275373340490852,13)

    ans =

    BA867963C1496

    ```


