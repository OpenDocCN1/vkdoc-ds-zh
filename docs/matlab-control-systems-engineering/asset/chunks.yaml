- fmt: "### Commands for Solving Equations\n\n| Command | Description |\n| --- | ---\
    \ |\n| `[X,L,G,rr] = care(A,B,Q)` `[X,L,G,rr] = care(A,B,Q,R,S,E)` `[X,L,G,report]\
    \ = care(A,B,Q,...,'report')` `[X1,X2,L,report] = care(A,B,Q,...,'implicit')`\
    \ | Solves algebraic Riccati equations in continuous time. |\n| `[X,L,G,rr] =\
    \ dare(A,B,Q,R)` `[X,L,G,rr] = dare(A,B,Q,R,S,E)` `[X,L,G,report] = dare(A,B,Q,...,'report')`\
    \ `[X1,X2,L,report] = dare(A,B,Q,...,'implicit')` | Solves algebraic Riccati equations\
    \ in discrete time. |\n| `X = lyap(A,Q)` `X = lyap(A,B,C)` | Solves continuous-time\
    \ Lyapunov equations. |\n| `X = dlyap(A,Q)` | Solves discrete-time Lyapunov equations.\
    \ |\n\nAs an example, we solve the Riccati equation:\n\n![A978-1-4842-0289-0_3_Figap_HTML.jpg](A978-1-4842-0289-0_3_Figap_HTML.jpg)\n\
    \nwhere:\n\n![A978-1-4842-0289-0_3_Figaq_HTML.jpg](A978-1-4842-0289-0_3_Figaq_HTML.jpg)\n\
    \n```\n>> a = [-3 2;1 1]; b = [0 ; 1]; c = [1 -1]; r = 3;\n[x,l,g] = care(a,b,c'*c,r)\n\
    x =\n0.5895 1.8216\n1.8216 8.8188\nl =\n-3.5026\n-1.4370\ng =\n0.6072 2.9396\n\
    ```\n\n### Exercise 3-1\n\nCreate the continuous state-space model and compute\
    \ the realization of the state-space for the transfer function `H(s)` defined\
    \ below. Also find a minimal realization of `H(s)`.\n\n![A978-1-4842-0289-0_3_Figar_HTML.jpg](A978-1-4842-0289-0_3_Figar_HTML.jpg)\n\
    \n```\n>> H = [tf([1 1],[1 3 3 2]) ; tf([1 0 3],[1 1 1])];\n>> sys = ss(H)\n\n\
    a =\n             x1           x2           x3           x4           x5\nx1 \
    \          -3         -1.5           -1            0            0\nx2        \
    \    2            0            0            0            0\nx3            0  \
    \          1            0            0            0\nx4            0         \
    \   0            0           -1         -0.5\nx5            0            0   \
    \         0            2            0\n\nb =\n             U1\nx1            1\n\
    x2            0\nx3            0\nx4            1\nx5            0\n\nc =\n  \
    \           x1           x2           x3           x4           x5\ny1       \
    \     0          0.5          0.5            0            0\ny2            0 \
    \           0            0           -1            1\n\nd =\n             U1\n\
    y1            0\ny2            1\n\nContinuous-time model.\n>> size(sys)\nState-space\
    \ model with 2 outputs, 1 input, and 5 states.\n```\n\nWe have obtained a state-space\
    \ model with 2 outputs, 1 input and 5 states. A minimal realization of `H(s)`\
    \ is found by using the syntax:\n\n```\n>> sys = ss(H,'min')\n\na =\n        \
    \                x1           x2           x3\n           x1      -1.4183    \
    \  -1.5188      0.21961\n           x2     -0.14192      -1.7933     -0.70974\n\
    \           x3     -0.44853       1.7658      0.21165\n\nb =\n               \
    \         u1\n           x1      0.19787\n           x2       1.4001\n       \
    \    x3      0.02171\n\nc =\n                        x1           x2         \
    \  x3\n           y1     -0.15944     0.018224      0.27783\n           y2   \
    \   0.35997     -0.77729      0.78688\n\nd =\n                        u1\n   \
    \        y1            0\n           y2            1\n\nContinuous-time model.\n\
    >> size(sys)\nState-space model with 2 outputs, 1 input, and 3 states.\n```\n\n\
    A minimal realization is given by a state-space model with 2 outputs, 1 input\
    \ and 3 states. This result is in accordance with the following factorization\
    \ of `H(s)` as the composite of a first order system with a second order system:\n\
    \n![A978-1-4842-0289-0_3_Figas_HTML.jpg](A978-1-4842-0289-0_3_Figas_HTML.jpg)\n\
    \n### Exercise 3-2\n\nFind the discrete transfer function of the MIMO system `H(z)`\
    \ defined below where the sample time is 0.2 seconds.\n\n![A978-1-4842-0289-0_3_Figat_HTML.jpg](A978-1-4842-0289-0_3_Figat_HTML.jpg)\n\
    \n```\n>> nums = {1 [1 0];[-1 2] 3}\nTs = 0.2\nH = tf(nums,[1 0.3],Ts)\n\nnums\
    \ =\n    [      1.00]    [1x2 double]\n    [1x2 double]    [      3.00]\n\nTs\
    \ =\n          0.20\n\nTransfer function from input 1 to output...\n         1\n\
    #1:  -------\n      z + 0.3\n      -z + 2\n#2:  -------\n      z + 0.3\n\nTransfer\
    \ function from input 2 to output...\n         z\n#1:  -------\n      z + 0.3\n\
    \         3\n#2:  -------\n      z + 0.3\n\nSampling time: 0.2\n```\n\n### Exercise\
    \ 3-3\n\nGiven the zero-pole-gain model\n\n![A978-1-4842-0289-0_3_Figau_HTML.jpg](A978-1-4842-0289-0_3_Figau_HTML.jpg)\n\
    \nwith sample time 0.01 seconds, perform a resampling to 0.05 seconds. Then undo\
    \ the resampling and verify that you obtain the original model.\n\n```\n>> H =\
    \ zpk(0.7,0.5,1,0.1)\nH2 = d2d(H,0.05)\n\nZero/pole/gain:\n(z-0.7)\n-------\n\
    (z-0.5)\nSampling time: 0.1\n\nZero/pole/gain:\n(z-0.8243)\n----------\n(z-0.7071)\n\
    Sampling time: 0.05\n```\n\nWe reverse the resampling in the following way:\n\n\
    ```\n>> d2d(H2,0.1)\n\nZero/pole/gain:\n(z-0.7)\n-------\n(z-0.5)\nSampling time:\
    \ 0.1\n```\n\nThus the original model is obtained.\n\n### Exercise 3-4\n\nConsider\
    \ the continuous fourth-order model given by the transfer function `h(s)` defined\
    \ below. Reduce the order by eliminating the states corresponding to small values\
    \ of the diagonal balanced grammian vector `g`. Compare the original and reduced\
    \ models.\n\n![A978-1-4842-0289-0_3_Figav_HTML.jpg](A978-1-4842-0289-0_3_Figav_HTML.jpg)\n\
    \nWe start by defining the model and computing a balanced state-space realization\
    \ as follows:\n\n```\n>> h = tf([1 11 36 26],[1 14.6 74.96 153.7 99.65])\n[hb,g]\
    \ = balreal(h)\ng'\n\nTransfer function:\n          s^3 + 11 s^2 + 36s + 26\n\
