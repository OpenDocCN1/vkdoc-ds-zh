  trans: '

    # 逻辑函数


    MATLAB 实现了输出值可为 `true` (1) 或 `false` (0) 的逻辑函数。下表列出了最重要的逻辑函数。


    | `exist(A)` | 检查变量或函数是否存在（如果 `A` 不存在则返回 0，如果存在则根据类型返回 1 到 5 之间的数字）。 |

    | `any(V)` | 如果向量 `V` 的所有元素均为零则返回 0，如果 `V` 的某些元素非零则返回 1。 |

    | `any(A)` | 对矩阵 `A` 中所有元素均为零的每一列返回 0，对存在非零元素的每一列返回 1。 |

    | `all(V)` | 如果向量 `V` 的所有元素均非零则返回 1，如果 `V` 的某些元素为零则返回 0。 |

    | `all(A)` | 对矩阵 `A` 中所有元素均非零的每一列返回 1，对至少有一个零元素的每一列返回 0。 |

    | `find(V)` | 返回向量 `V` 中非零元素所在的位置（或索引）。 |

    | `isnan(V)` | 对 `V` 中为不定值的元素返回 1，对不是不定值的元素返回 0。 |

    | `isinf(V)` | 对 `V` 中为无穷大的元素返回 1，对不是无穷大的元素返回 0。 |

    | `isfinite(V)` | 对 `V` 中为有限值的元素返回 1，对不是有限值的元素返回 0。 |

    | `isempty(A)` | 如果 `A` 是空数组则返回 1，否则返回 0（空数组是指其某一维度为 0 的数组）。 |

    | `issparse(A)` | 如果 `A` 是稀疏矩阵则返回 1，否则返回 0。 |

    | `isreal(V)` | 如果 `V` 的所有元素均为实数则返回 1，否则返回 0。 |

    | `isprime(V)` | 对 `V` 中所有为质数的元素返回 1，对 `V` 中所有不是质数的元素返回 0。 |

    | `islogical(V)` | 如果 `V` 是逻辑向量则返回 1，否则返回 0。 |

    | `isnumeric(V)` | 如果 `V` 是数值向量则返回 1，否则返回 0。 |

    | `ishold` | 如果当前图形的属性保留给下一个图形，且仅添加新元素，则返回 1，否则返回 0。 |

    | `isieee` | 如果计算机能够执行 IEEE 标准运算，则返回 1。 |

    | `isstr(S)` | 如果 `S` 是字符串则返回 1，否则返回 0。 |

    | `ischart(S)` | 如果 `S` 是字符串则返回 1，否则返回 0。 |

    | `isglobal(A)` | 如果 `A` 是全局变量则返回 1，否则返回 0。 |

    | `isletter(S)` | 如果 `S` 是字母表中的字母则返回 1，否则返回 0。 |

    | `isequal(A, B)` | 如果矩阵或向量 `A` 和 `B` 相等则返回 1，否则返回 0。 |

    | `ismember(V, W)` | 对 `V` 中存在于 `W` 的每个元素返回 1，对 `V` 中不存在于 `W` 的每个元素返回 0。 |


    下面是使用上述逻辑函数的一些示例。


    ```

    >> V = [1,2,3,4,5,6,7,8,9], isprime(V), isnumeric(V), all(V), any(V)

    V =

    1     2     3     4     5     6     7     8     9

    ans =

    0     1     1     0     1     0     1     0     0

    ans =

    1

    ans =

    1

    ans =

    1

    >> B = [Inf, -Inf, pi, NaN], isinf(B), isfinite(B), isnan(B), isreal(B)

    B =

    Inf - Inf 3.1416 NaN

    ans =

    1 1 0 0

    ans =

    0 0 1 0

    ans =

    0 0 0 1

    ans =

    1

    >> ismember ([1,2,3], [8,12,1,3]), A = [2,0,1];B = [4,0,2]; isequal (2A * B)

    ans =

    1 0 1

    ans =

    1

    ```


    ## 练习 2-1


    求从 30 个元素中无重复地选择 12 个元素的方法数、2¹³⁴ 除以 3 的余数、18900 的质因数分解、200 的阶乘以及最小的数 N，该数除以 16、24、30
    和 32 均余 5。


    ```

    >> factorial (30) / (factorial (12) * factorial(30-12))

    ans =

    8.6493e + 007

    ```


    命令 `vpa` 用于显示精确结果。


    ```

    >> vpa ''factorial (30) / (factorial (12) * factorial(30-12))'' 15

    ans =

    86493225.

    >> rem(2¹³⁴,3)

    ans =

    0

    >> factor (18900)

    ans =

    2     2     3     3     3     5     5     7

    >> factorial (100)

    ans =

    9. 3326e + 157

    ```


    命令 `vpa` 用于显示精确结果。


    ```

    >> vpa '' factorial (100)'' 160

    ans =

    93326215443944152681699238856266700490715968264381621468592963895217599993229915608941463976156518286253697920827223758251185210916864000000000000000000000000.

    ```


    N-5 是 16、24、30 和 32 的最小公倍数。


    ```

    >> lcm (lcm (16.24), lcm (30,32))

    ans =

    480

    ```


    因此 N = 480 + 5 = 485。


    ## 练习 2-2


    在以 5 为基数的数制中，求运算 `a25aaff6`[16] + `6789aba`[12] + `35671`[8] + `1100221`[3] -
    1250 的结果。在以 13 为基数的数制中，求运算 (`666551`[7])*(`aa199800a`[11]) +(`fffaaa125`[16])
    / (`33331`[4] + 6) 的结果。第一个运算在十进制下的结果计算如下：


    ```

    >> base2dec(''a25aaf6'',16) + base2dec(''6789aba'',12) +...

