    这里 `disp` 命令的参数已被显示在屏幕上。


    ```

    >> c = ''This is a good example'';

    >> strrep(c, ''good'', ''bad'')

    ans =

    This is a bad example

    ```


    字符串 `good` 已被替换为链 `c` 中的 `bad`。以下指令定位了链 `c` 中每次出现 `is` 的起始位置。


    ```

    >> findstr (c, ''is'')

