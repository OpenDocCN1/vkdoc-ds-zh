    MATLAB 可以轻松生成（伪）随机数。函数 `rand` 生成均匀分布的随机数，函数 `randn` 生成正态分布的随机数。下表展示了 MATLAB 随机数生成器最有趣的功能。\n\
    \n| `rand` | 返回一个来自 [0,1] 区间的均匀分布随机小数。 |\n| `rand(n)` | 返回一个大小为 `n×n` 的数组，其元素是来自\
