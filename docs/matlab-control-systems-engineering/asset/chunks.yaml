    ```\n\n### 练习 3-1\n\n创建连续状态空间模型，并为下面定义的传递函数 `H(s)` 计算状态空间实现。同时，找出 `H(s)` 的最小实现。\n\
    \n![A978-1-4842-0289-0_3_Figar_HTML.jpg](img/A978-1-4842-0289-0_3_Figar_HTML.jpg)\n\
