  trans: '### 数据可视化


    `MATLAB` 提供了可视化科学和工程数据所需的所有图形函数。这包括用于创建二维和三维图表的工具、三维体可视化工具、交互式创建图表的功能，以及使用最流行的图形格式导出的能力。可以自定义图表，添加多个坐标轴、更改线条和标记的颜色、添加注释、`LaTeX`
    公式和图例，以及绘制路径。


    可以创建多种矢量数据的二维图形表示形式，包括：


    - 线图、面积图、条形图和扇形图

    - 方向和速度图

    - 直方图

    - 多边形和曲面

    - 散点气泡图

    - 动画


    图 1-6 展示了某台发动机数次排放测试结果的线性图，并附有一条拟合数据曲线。


    ![A978-1-4842-0289-0_1_Fig6_HTML.jpg](img/A978-1-4842-0289-0_1_Fig6_HTML.jpg)


    图 1-6。


    `MATLAB` 还提供了用于显示二维数组、三维标量数据和三维矢量数据的函数。可以使用这些函数来可视化和理解大量复杂的多维数据。也可以定义图表的特性，例如相机的方向、透视、光照、光源和透明度。三维绘图功能包括：


    - 曲面图、等高线图和网格图

    - 空间曲线

    - 锥体图、相位图、流线图和等值面图


    图 1-7 展示了一个等值面的三维图，揭示了富勒烯碳-60 分子的测地结构。


    ![A978-1-4842-0289-0_1_Fig7_HTML.jpg](img/A978-1-4842-0289-0_1_Fig7_HTML.jpg)


    图 1-7。


    `MATLAB` 包含用于图形编辑和设计的交互式工具。在 `MATLAB` 图表中，可以执行以下任何任务：


    - 将新的数据集拖放到图形中

    - 更改图形中任何对象的属性

    - 更改缩放、旋转、视图（例如全景）、相机角度和光照

    - 添加数据标签和注释

    - 绘制形状

    - 生成可重用于不同数据的 `M-file`


    图 1-8 展示了一系列图形，这些图形是通过将数据集拖放到图表窗口、创建新的子图、更改颜色和字体等属性以及添加注释而交互式创建的。


    ![A978-1-4842-0289-0_1_Fig8_HTML.jpg](img/A978-1-4842-0289-0_1_Fig8_HTML.jpg)


    图 1-8。


    `MATLAB` 兼容所有知名的数据文件和图形格式，例如 `GIF`、`JPEG`、`BMP`、`EPS`、`TIFF`、`PNG`、`HDF`、`AVI`
    和 `PCX`。因此，可以将 `MATLAB` 图表导出到其他应用程序，例如 `Microsoft Word` 和 `Microsoft PowerPoint`，或桌面出版软件。导出前，可以创建并应用包含所有设计细节、字体、线宽等满足出版规范的样式模板。


    ### 数值计算


    `MATLAB` 包含数学、统计和工程函数，支持这些领域中的大部分运算。这些函数由数学专家开发，是 `MATLAB` 语言的基础。举几个例子，`MATLAB`
    在以下领域实现数学函数和数据分析：


    - 矩阵运算和线性代数

    - 多项式和插值

    - 傅里叶分析和滤波器

    - 统计与数据分析

    - 优化与数值积分

    - 常微分方程 (`ODEs`)

    - 偏微分方程 (`PDEs`)

    - 稀疏矩阵运算


    ### 结果发布和应用程序分发


    此外，`MATLAB` 包含许多函数，可让您记录和共享工作。您可以将 `MATLAB` 代码与其他语言和应用程序集成，并将您的算法和 `MATLAB` 应用程序作为独立程序或软件模块进行分发。


    `MATLAB` 允许您以图表形式或完整报告的形式导出结果。您可以将图表导出为所有流行的图形格式，然后将其导入到其他软件包中，例如 `Microsoft Word`
    或 `Microsoft PowerPoint`。使用 `MATLAB Editor`，您可以自动以 `HTML` 格式、`Word`、`LaTeX` 等发布您的
    `MATLAB` 代码。例如，图 1-9 显示了一个使用 `MATLAB Editor` 以 `HTML`（右侧）发布的 `M-file`（左侧）。发送到
    `Command Window` 或图表的结果被捕获并包含在文档中，而注释则成为 `HTML` 中的标题和文本。


    ![A978-1-4842-0289-0_1_Fig9_HTML.jpg](img/A978-1-4842-0289-0_1_Fig9_HTML.jpg)


    图 1-9。


    可以使用 `MATLAB Report Generator`（单独提供）创建更复杂的报告，例如模拟执行和各种参数测试。


    `MATLAB` 提供了一些函数，使您能够将 `MATLAB` 应用程序与 `C` 和 `C++` 代码、`FORTRAN` 代码、`COM` 对象以及 `Java`
    代码集成。您可以调用 `DLL`s、`Java` 类和 `ActiveX` 控件。使用 `MATLAB` 引擎库，您还可以从 `C`、`C++` 或 `FORTRAN`
    代码中调用 `MATLAB`。


    您可以在 `MATLAB` 中创建算法并将其分发给其他 `MATLAB` 用户。使用 `MATLAB Compiler`（单独提供），可以将算法作为独立应用程序或包含在项目中的软件模块，分发给没有
    `MATLAB` 的用户。其他附加产品能够将算法转换为可从 `COM` 或 `Microsoft Excel` 调用的软件模块。'
- fmt: '# The MATLAB Working Environment


    Figure [1-10](#A978-1-4842-0289-0_1_Chapter.html#Fig10) shows the primary workspace
    of the MATLAB environment. This is the screen in which you enter your MATLAB programs.


    ![A978-1-4842-0289-0_1_Fig10_HTML.jpg](A978-1-4842-0289-0_1_Fig10_HTML.jpg)


    Figure 1-10.


    The following table summarizes the components of the MATLAB environment.


    ![A978-1-4842-0289-0_1_Fig12_HTML.jpg](A978-1-4842-0289-0_1_Fig12_HTML.jpg)


    Figure 1-12.


    ![A978-1-4842-0289-0_1_Fig11_HTML.jpg](A978-1-4842-0289-0_1_Fig11_HTML.jpg)


    Figure 1-11.


    | Tool | Description |

    | --- | --- |

    | Command History | This allows you to see the commands entered during the session
    in the Command Window, as well as copy them and run them (lower right part of
    Figure [1-11](#A978-1-4842-0289-0_1_Chapter.html#Fig11)) |

    | Command Window | This is where you enter MATLAB commands (central part of Figure
    [1-11](#A978-1-4842-0289-0_1_Chapter.html#Fig11)) |

    | Workspace | This allows you to view the contents of the workspace (variables,
    etc.) (upper right part of Figure [1-11](#A978-1-4842-0289-0_1_Chapter.html#Fig11))
    |

    | Help | This offers help and demos on MATLAB |

    | Start button | This enables you to run tools and provides access to MATLAB documentation
    (Figure [1-12](#A978-1-4842-0289-0_1_Chapter.html#Fig12)) |


    MATLAB commands are written in the Command Window to the right of the user input
    prompt `»` and the response to the command will appear in the lines immediately
    below. After exiting from the response, the user input prompt will re-display,
    allowing you to input more entries (Figure [1-13](#A978-1-4842-0289-0_1_Chapter.html#Fig13)).


    ![A978-1-4842-0289-0_1_Fig13_HTML.jpg](A978-1-4842-0289-0_1_Fig13_HTML.jpg)


    Figure 1-13.


    When an input is given to MATLAB in the Command Window and the result is not assigned
    to a variable, the response returned will begin with the expression `ans =`, as
    shown near the top of Figure [1-13](#A978-1-4842-0289-0_1_Chapter.html#Fig13).
    If the results are assigned to a variable, we can then use that variable as an
    argument for subsequent input. This is the case for the variable `v` in Figure
    [1-13](#A978-1-4842-0289-0_1_Chapter.html#Fig13), which is subsequently used as
    the input for an exponential.


    To run a MATLAB command, simply type the command and press Enter. If at the end
    of the input we put a semicolon, the program runs the calculation and keeps it
    in memory (Workspace), but does not display the result on the screen (see the
    first entry in Figure [1-13](#A978-1-4842-0289-0_1_Chapter.html#Fig13)). The input
    prompt `»` appears to indicate that you can enter a new command.


    Like the C programming language, MATLAB is case sensitive; for example, `Sin(x)`
    is not the same as `sin(x)`. The names of all built-in functions begin with a
    lowercase character. There should be no spaces in the names of commands, variables
    or functions. In other cases, spaces are ignored, and they can be used to make
    the input more readable. Multiple entries can be entered in the same command line
    by separating them with commas, pressing Enter at the end of the last entry (see
    Figure [1-14](#A978-1-4842-0289-0_1_Chapter.html#Fig14)). If you use a semicolon
    at the end of one of the entries in the line, its corresponding output will not
    be displayed.


    ![A978-1-4842-0289-0_1_Fig14_HTML.jpg](A978-1-4842-0289-0_1_Fig14_HTML.jpg)


    Figure 1-14.


    Descriptive comments can be entered in a command input line by starting them with
    the `%` symbol. When you run the input, MATLAB ignores the comment and processes
    the rest of the code (see Figure [1-15](#A978-1-4842-0289-0_1_Chapter.html#Fig15)).


    ![A978-1-4842-0289-0_1_Fig15_HTML.jpg](A978-1-4842-0289-0_1_Fig15_HTML.jpg)


    Figure 1-15.


    To simplify the process of entering script to be evaluated by the MATLAB interpreter
    (via the Command Window prompt), you can use the arrow keys. For example, if you
    press the up arrow key once, you will recover the last entry you submitted. If
    you press the up key twice, you will recover the penultimate entry you submitted,
    and so on.


    If you type a sequence of characters in the input area and then press the up arrow
    key, you will recover the last entry you submitted that begins with the specified
    string.


    Commands entered during a MATLAB session are temporarily stored in the buffer
    (Workspace) until you end the session, at which time they can be stored in a file
    or are permanently lost.


    Below is a summary of the keys that can be used in MATLAB’s input area (command
    line), together with their functions:


    | Up arrow (Ctrl-P) | Retrieves the previous entry. |

    | Down arrow (Ctrl-N) | Retrieves the following entry. |

    | Left arrow (Ctrl-B) | Moves the cursor one character to the left. |

    | Right arrow (Ctrl-F) | Moves the cursor one character to the right. |

    | CTRL-left arrow | Moves the cursor one word to the left. |

    | CTRL-right arrow | Moves the cursor one word to the right. |

    | Home (Ctrl-A) | Moves the cursor to the beginning of the line. |

    | End (Ctrl-E) | Moves the cursor to the end of the current line. |

    | Escape | Clears the command line. |

    | Delete (Ctrl-D) | Deletes the character indicated by the cursor. |

    | Backspace | Deletes the character to the left of the cursor. |

    | CTRL-K | Deletes (kills) the current line. |


    The command `clc` clears the command window, but does not delete the contents
    of the work area (the contents remain in the memory).


