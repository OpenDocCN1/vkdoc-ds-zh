    # 3. 控制系统


    ## 控制系统简介


    `MATLAB` 提供了一个集成环境，您可以在其中设计控制系统。图 3-1 中的图示展示了工程问题如何引导模型的开发与实验数据的分析，进而促成控制系统的设计与仿真。对这些系统的后续分析又会带来设计的进一步修改，这种开发循环最终促成高效系统的快速原型制作与实现。


    ![A978-1-4842-0289-0_3_Fig1_HTML.jpg](img/A978-1-4842-0289-0_3_Fig1_HTML.jpg)


    图 3-1.


    `MATLAB` 为技术模型生成、数据分析和算法开发提供了一个高级平台。`MATLAB` 将全面的工程与数学功能同强大的可视化和动画特性相结合，所有这些都集成在一个高级交互式编程语言中。`MATLAB`
    工具箱扩展了 `MATLAB` 环境，融合了广泛用于控制系统设计的经典与现代技术，提供了由国际公认专家开发的前沿控制算法。


    `MATLAB` 包含超过 600 个数学、统计和工程函数，提供了分析数据、开发算法和优化系统性能所需的数值计算能力。使用 `MATLAB`，您可以快速迭代设计，并比较不同控制策略的性能。此外，`MATLAB`
    是一种高级编程语言，能让您以远少于 `C`、`C++` 或 `FORTRAN` 的时间开发算法。`MATLAB` 是开放且可扩展的，您可以查看源代码、修改算法并整合现有的
    `C`、`C++` 和 `FORTRAN` 程序。


    交互式的 `Control System Toolbox` 工具简化了控制系统的设计与调整。例如，您可以拖拽极点和零点，并立即看到系统如何响应（图 3-2）。此外，`MATLAB`
    提供了强大的交互式二维和三维图形功能，用于展示数据、方程和结果（图 3-3）。您可以在 `MATLAB` 中使用广泛的可视化辅助工具，或者利用 `MATLAB`
    工具箱提供的特定控制功能。


    ![A978-1-4842-0289-0_3_Fig3_HTML.jpg](img/A978-1-4842-0289-0_3_Fig3_HTML.jpg)


    图 3-3.


    ![A978-1-4842-0289-0_3_Fig2a_HTML.jpg](img/A978-1-4842-0289-0_3_Fig2a_HTML.jpg)![A978-1-4842-0289-0_3_Fig2b_HTML.jpg](img/A978-1-4842-0289-0_3_Fig2b_HTML.jpg)


    图 3-2.


    `MATLAB` 工具箱包含了用 `MATLAB` 语言特定功能编写的应用程序。`MATLAB` 与控制相关的工具箱几乎涵盖了控制设计的所有基本技术，从 `LQG`
    和根轨迹到 `H` 与逻辑模糊方法。例如，可以使用 `Fuzzy Logic Toolbox` 的内置算法添加一个模糊逻辑控制系统设计（图 3-4）。


    ![A978-1-4842-0289-0_3_Fig4_HTML.jpg](img/A978-1-4842-0289-0_3_Fig4_HTML.jpg)


    图 3-4.


    对于控制系统而言，最重要的 `MATLAB` 工具箱可分为三大类：建模类（`System Identification Toolbox`）、经典设计与分析产品（`Control
    System Toolbox` 和 `Fuzzy Logic Toolbox`）、设计与高级分析产品（`Robust Control Toolbox`、`Mu-Analysis
    Toolbox`、`LMI Control Toolbox` 和 `Model Predictive Toolbox`）以及优化产品（`Optimization
    Toolbox`）。下图说明了这种分类。


    ## 控制系统设计与分析：Control System Toolbox


    `Control System Toolbox` 是一个算法集合，主要以 `M-files` 形式编写，实现了控制系统设计、分析和建模的常用技术。其广泛的服务包括经典和现代的控制设计方法，例如根轨迹、极点配置和
    `LQG` 调节器设计。特定的图形用户界面简化了控制工程的典型任务。该工具箱建立在 `MATLAB` 的基础之上，以便为工程工具提供专用的控制系统。


    使用 `Control System Toolbox`，您可以创建线性时不变系统（`LTI`）的模型，其格式可以是传递函数、零极点增益或状态空间。您可以操作离散时间和连续时间系统，并在各种表示形式之间进行转换。您可以计算并绘制时间响应、频率响应和根轨迹。其他函数允许您执行极点配置、最优控制和估计。`Control
    System Toolbox` 是开放且可扩展的，允许您创建自定义的 `M-files` 以满足特定应用需求。


    以下是 `Control System Toolbox` 的主要特性：


    - `LTI Viewer`：一个用于分析和比较 `LTI` 系统的交互式 `GUI`。

    - `SISO Design Tool`：一个用于分析和调整单输入/单输出（`SISO`）反馈控制系统的交互式 `GUI`。

    - `GUI Suite`：设置首选项和属性，以完全控制时域和频域图的显示。

    - `LTI` 对象：结构化专用数据，以传递函数、状态空间、零极点增益和频率响应格式简洁地表示模型数据。

    - `MIMO`：支持多输入/多输出（`MIMO`）系统、采样数据系统、连续时间系统和具有时间延迟的系统。

    - 用于连接 `LTI` 模型的函数和运算符：创建复杂的框图（串联、并联和反馈连接）。

    - 支持将离散系统转换为连续系统（以及反向转换）的各种方法。

    - 函数用于以图形方式表示时域和频域系统的解，并通过单个命令比较各种系统。

    - 用于经典和现代控制设计技术的工具，包括根轨迹分析、环路整形、极点配置和 `LQR`/`LQG` 控制。


    ### 模型构建


    `Control System Toolbox` 支持四种线性模型的表示：状态空间模型（`SS`）、传递函数（`TF`）、零极点增益模型（`ZPK`）和频率数据模型（`FRD`）。每种模型类型都提供了
    `LTI` 对象。除了模型数据外，`LTI` 对象还可以存储离散时间系统的采样时间、延迟、输入和输出的名称、模型注释以及许多其他细节。使用 `LTI` 对象，您可以将模型作为独立实体进行操作，并使用矩阵类型的运算将它们组合起来。图
    3-5 展示了一个简单 `LQG` 控制器设计的示例说明。底部的代码片段展示了控制器的设计方式以及闭环系统的创建方式。频率响应图显示了开环系统（红色）和闭环系统（蓝色）之间的比较。


    ![A978-1-4842-0289-0_3_Fig5_HTML.jpg](img/A978-1-4842-0289-0_3_Fig5_HTML.jpg)


    图 3-5.


    `Control System Toolbox` 包含一些命令，用于分析和计算模型特性，例如 `I/O` 维度、极点、零点和 `DC` 增益。这些命令同时适用于连续时间和离散时间模型。


    ### 分析与设计


    某些任务适合图形化操作，而另一些任务则受益于命令行的灵活性。`Control System Toolbox` 旨在兼顾这两种方法，提供一套完整的函数，用于通过命令行或
    `GUI` 进行模型的设计与分析。

