- fmt: "### Commands for Dynamic Models\n\n| Command | Description |\n| --- | ---\
    \ |\n| `[Wn,Z] = damp(sys)` `[Wn,Z,P] = damp(sys)` | Displays a table of the damping\
    \ ratio, natural frequency, and time constant of the poles of the linear model\
    \ `sys`. You can also get the vector `P` of the poles of `sys`. |\n| `k = dcgain(sys)`\
    \ | Calculates the low-frequency (DC) gain of the model `sys`. |\n| `[P,Q] = covar(sys,W)`\
    \ | Calculates the stationary covariance of the output of an LTI model `sys` driven\
    \ by Gaussian white noise inputs `W`. `P` is the steady-state output response\
    \ covariance and `Q` is the steady-state state covariance. |\n| `s = dsort(p)`\
    \ `[s,ndx] = dsort(p)` | Sorts the discrete-time poles contained in the vector\
    \ `p` in descending order by magnitude. |\n| `s = esort(p)` `[s,ndx] = esort(p)`\
    \ | Sorts the continuous-time poles contained in the vector `p` by real part.\
    \ |\n| `norm(sys)` `norm(sys,2)` `norm(sys,inf)` `norm(sys,inf,tol)` `[ninf,fpeak]\
    \ = norm(sys)` | Calculates the H² norm of the model `sys`. Calculates the H²\
    \ norm of the model `sys`. Calculates the H[∞] norm of the model `sys`. Calculates\
    \ the H[∞] norm of the model `sys` with tolerance `tol`. Calculates, in addition\
    \ to the H[∞] norm, the frequency `fpeak` at which the gain reaches its peak value.\
    \ |\n| `p = pole(sys)` `d = eig(A)` `d = eig(A,B)` `[V,D] = eig(A)` `[V,D] = eig(A,'nobalance')`\
    \ `[V,D] = eig(A,B)` `[V,D] = eig(A,B,flag)` | Calculates the poles of the LTI\
    \ model `sys`. Returns the vector of eigenvalues of `A`. Returns the generalized\
    \ eigenvalues of the pair `(A,B)`. Returns the eigenvalues and eigenvectors of\
    \ the matrix `A`. Returns the eigenvalues and eigenvectors of `A` without a preliminary\
    \ balancing step. Returns the eigenvalues and generalized eigenvectors of `(A,B)`.\
    \ The factorization method (`'chol'` or `'qz'`) is specified by `flag`. |\n| `pzmap(sys)`\
    \ `pzmap(sys1,sys2,...,sysN)` `[p,z] = pzmap(sys)` | Creates a pole-zero plot\
    \ of the continuous-time or discrete-time dynamic system `sys` or of several LTI\
    \ systems `sys1`, `sys2`,..., `sysn` at the same time. `[p, z]` gives the poles\
    \ and zeros and not the graph. |\n| `rlocus(sys)` `rlocus(sys,k)` `rlocus(sys1,sys2,...)`\
    \ `[r,k] = rlocus(sys)` `r = rlocus(sys,k)` | Calculates and plots the root locus\
    \ of the open-loop SISO model `sys`. Uses the user-specified vector `k` of gains\
    \ to plot the root locus. Calculates and plots the root locus of several systems\
    \ in a simple graph. Returns the vector `k` of selected gains and the complex\
    \ root locations `r` for these gains. Returns the root locations `r` for a system\
    \ `sys` with selected gains given by the vector `k`. |\n| `r = roots(c)` | Returns\
    \ the roots of the polynomial `c` as a column vector. |\n| `sgrid` `zgrid` | Generates,\
    \ for pole-zero and root locus plots, a grid of constant damping factors from\
    \ zero to one in steps of 0.1 and natural frequencies from zero to 10 rad/sec\
    \ in steps of one rad/sec, and plots the grid over the current axis. Similarly\
    \ generates a grid from zero to π in steps of π/10, and plots the grid over the\
    \ current axis. |\n| `z = zero(sys)` `[z,gain] = zero(sys)` | Calculates the zeros\
    \ of the LTI model `sys`. Returns the zeros and gain of the LTI system `sys`.\
    \ |\n\nAs a first example, we calculate the eigenvalues, natural frequencies and\
    \ damping factors of the continuous transfer function model:\n\n![A978-1-4842-0289-0_3_Figv_HTML.jpg](A978-1-4842-0289-0_3_Figv_HTML.jpg)\n\
    \n```\n>> H = tf([2 5 1],[1 2 3])\nTransfer function:\n2 s^2 + 5 s + 1\n---------------\n\
    s^2 + 2 s + 3\n```\n\n```\n>> damp(H)\nEigenvalue            Damping     Freq.\
    \ (rad/s)\n00e - 1 + 000 + 1. 41e + 000i 5. 77e-001 1. 73e + 000\n00e - 1 + 000\
    \ - 1. 41e + 000i 5. 77e-001 1. 73e + 000\n```\n\nIn the following example we\
    \ calculate the DC gain of the MIMO transfer function model:\n\n![A978-1-4842-0289-0_3_Figw_HTML.jpg](A978-1-4842-0289-0_3_Figw_HTML.jpg)\n\
    \n```\n>> H = [1 tf([1 -1],[1 1 3]) ; tf(1,[1 1]) tf([1 2],[1 -3])]\n>> dcgain(H)\n\
    Transfer function from input 1 to output...\n#1:  1\n1\n#2:  -----\n    s + 1\n\
    Transfer function from input 2 to output...\n    s\n#1:  -----------\n    s^2\
    \ + s + 3\n    s + 2\n#2:  -----\n     3s\nans =\n    1.0000   -0.3333\n    1.0000\
    \   -0.6667\n```\n\nNext we consider the discrete-time transfer function\n\n![A978-1-4842-0289-0_3_Figx_HTML.jpg](A978-1-4842-0289-0_3_Figx_HTML.jpg)\n\
    \nwith 0.1 second sampling time and calculate the 2-norm and the infinite norm\
    \ with its optimum value.\n\n```\n>> H = tf([1 -2.841 2.875 -1.004],[1 -2.417\
    \ 2.003 -0.5488],0.1)\n>> norm(H)\nTransfer function:\nz^3 - 2.841 z^2 + 2.875\
    \ z - 1.004\n----------------------------------\nz^3 - 2.417 z^2 + 2.003 z - 0.5488\n\
    Sampling time: 0.1\nans =\n    1.2438\n>> [ninf,fpeak] = norm(H,inf)\nsurrounded\
    \ =\n    2.5488\nfpeak =\n    3.0844\n```\n\nWe then confirm the previous values\
    \ by generating the Bode plot of `H(z)` (see Figure [3-12](#A978-1-4842-0289-0_3_Chapter.html#Fig12)).\n\
    \n```\n>> bode (H)\n```\n\n![A978-1-4842-0289-0_3_Fig12_HTML.jpg](A978-1-4842-0289-0_3_Fig12_HTML.jpg)\n\
    \nFigure 3-12.\n\nFigure 3-12\n\nNext we calculate and graph the root locus of\
