    \n![A978-1-4842-0289-0_3_Figy_HTML.jpg](A978-1-4842-0289-0_3_Figy_HTML.jpg)\n\n\
    ```\n>> h = tf([2 5 1],[1 2 3]);\n>> rlocus (h)\n```\n\n![A978-1-4842-0289-0_3_Fig13_HTML.jpg](A978-1-4842-0289-0_3_Fig13_HTML.jpg)\n\
    \nFigure 3-13.\n\nFigure 3-13\n\nIn the example below we plot a z-plane grid over\
