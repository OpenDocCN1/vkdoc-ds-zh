    ### Model Feature Commands


    | Command | Description |

    | --- | --- |

    | str = class(object) | Displays a string describing which type of model object
    is (‘tf’, ‘zpk’, ‘ss’, or ‘frd’). |

    | hasdelay(sys) | Returns 1 if the LTI model sys has input, output, input/output
    or internal delays, and returns 0 otherwise. |

    | k= isa(obj,‘class’) | Returns 1 if the object is of the given class. |

    | boo = isct(sys) boo = isdt(sys) | Returns 1 if the LTI model sys is continuous.
    Returns 1 if the LTI model sys is discrete. |

    | boo = isempty(sys) | Returns 1 if the LTI model sys has no input or output.
    |

    | boo = isproper(sys) | Returns 1 if the LTI model sys is proper. |

    | boo = issiso(sys) | Returns 1 if the LTI model sys is SISO. |

    | n = ndims(sys) | Returns the number of dimensions in the LTI model or model
    array sys. |

