    [y, t, x] = lsim(sys,u,t,x0) | Calculates and plots the time response of the state-space
    model sys, or of several models, with initial condition x0\. A user-supplied time
    sample t can be supplied as well as specified graphics styles. The options zoh
    and foh specify how the input values should be interpolated between samples (zero-order
    hold or linear interpolation, respectively). You can also obtain the output response
