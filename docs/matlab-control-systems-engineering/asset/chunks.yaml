    \ 标量的向量次幂 |\n| `a.^b = [a1^b1, a2^b2, ..., an^bn]` | 向量的向量次幂 |\n\n必须牢记，向量必须具有相同的长度，并且在乘法、除法和幂运算中，第一个操作数后面必须跟一个点。\n\
    \n以下示例涉及上述所有运算符。\n\n```\n>> X = [5,4,3]; Y = [1,2,7]; a = X + Y, b = X-Y, c =\
    \ x * Y, d = 2\\. * X,...\ne = 2/X, f = 2\\. \\Y, g = x / Y, h =. \\X, i = x ^\
    \ 2, j = 2\\. ^ X, k = X. ^ Y\n\na =\n     6     6    10\nb =\n     4     2  \
    \  -4\nc =\n     5     8    21\nd =\n    10     8     6\ne =\n    0.4000    0.5000\
