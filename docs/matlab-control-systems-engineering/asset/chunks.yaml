- fmt: "As a first example, we generate a random discrete LTI system with three states,\
    \ two inputs and two outputs.\n\n```\n>> sys = drss(3,2,2)\n\na = \n     x1  \
    \         x2           x3\n x1    -0.048856      0.40398      0.23064\n x2   \
    \  0.068186      0.35404     -0.40811\n x3     -0.46016    -0.089457    -0.036824\n\
    \nb = \n         u1           u2\n x1     -0.43256      0.28768\n x2         \
    \   0      -1.1465\n x3      0.12533       1.1909\n\nc = \n         x1       \
    \    x2           x3\n y1       1.1892      0.32729     -0.18671\n y2    -0.037633\
    \      0.17464      0.72579\n\nd = \n         u1           u2\n y1           \
    \ 0      -0.1364\n y2       2.1832            0\n\nSampling time: unspecified\n\
    Discrete-time model.\n\n>>\n```\n\nIn the following example, we create the model\n\
    \n![A978-1-4842-0289-0_3_Figi_HTML.jpg](A978-1-4842-0289-0_3_Figi_HTML.jpg)\n\n\
    ![A978-1-4842-0289-0_3_Figj_HTML.jpg](A978-1-4842-0289-0_3_Figj_HTML.jpg)\n\n\
    with a gap of 0.1 seconds and tagged as ‘voltage’ entry.\n\n```\n>> sys = dss(1,2,3,4,5,0.1,'inputname','voltage')\n\
    \na = \n       x1\n x1      1\n\nb = \n         voltage\n x1            2\n\n\
    c = \n       x1\n y1      3\n\nd = \n         voltage\n y1            4\n\ne =\
    \ \n       x1\n x1      5\n\nSampling time: 0.1\nDiscrete-time model.\n```\n\n\
    The example below creates the following two-input digital filter:\n\n![A978-1-4842-0289-0_3_Figk_HTML.jpg](A978-1-4842-0289-0_3_Figk_HTML.jpg)\n\
    \nspecifying time displays and channel entries ‘channel1’ and ‘channel2’ :\n\n\
    ```\n>> num = {1 , [1 0.3]}\nden = {[1 1 2] ,[5 2]}\nH = filt(num,den,'inputname',{'channel1'\
    \ 'channel2'})\n\nnum =\n    [1.00]    [double 1 x 2]\n\nden =\n    [double 1\
    \ x 3]    [double 1 x 2]\n\nTransfer function from input \"channel1\" to output:\n\
    \        1\n-----------------\n1 + z^-1 + 2 z^-2\n\nTransfer function from input\
    \ \"channel2\" to output:\n1 + 0.3 z ^ - 1\n--------------\n5 + 2 z ^ - 1\n\n\
    Sampling time: unspecified\n```\n\nNext we create a SISO FRD model.\n\n```\n>>\
    \ freq = logspace(1,2);\nresp = .05*(freq).*exp(i*2*freq);\nsys = frd(resp,freq)\n\
    \nFrom input 1 to:\nFrequency(rad/s)        output 1\n----------------   ------------------\n\
    10.000000       0.204041+0.456473i\n10.481131      -0.270295+0.448972i\n10.985411\
    \      -0.549157+0.011164i\n11.513954      -0.293037-0.495537i\n12.067926    \
    \   0.327595-0.506724i\n12.648552       0.623904+0.103480i\n13.257114       0.124737+0.651013i\n\
    13.894955      -0.614812+0.323543i\n14.563485      -0.479139-0.548328i\n15.264180\
    \       0.481814-0.591898i\n15.998587       0.668563+0.439215i\n16.768329    \
    \  -0.438184+0.714799i\n17.575106      -0.728874-0.490870i\n18.420700       0.602513-0.696623i\n\
    19.306977       0.588781+0.765007i\n.\n.\n.\n86.851137      -2.649156-3.440897i\n\
    91.029818       4.498503-0.692487i\n95.409548      -3.261293+3.481583i\n100.000000\
    \      2.435938-4.366486i\n\nContinuous-time frequency response data model.\n\
    ```\n\nNow we define an FRD model and its data is returned.\n\n```\n>> freq =\
    \ logspace(1,2,2);\nresp = .05*(freq).*exp(i*2*freq);\nsys = frd(resp,freq);\n\
    [resp,freq] = frdata(sys,'v')\n\nresp =\n    0.20\n    2.44\n\nfreq =\n   10.00\n\
    \  100.00\n```\n\nThe following example creates a 2-output/1-input transfer function:\n\
    \n![A978-1-4842-0289-0_3_Figl_HTML.jpg](A978-1-4842-0289-0_3_Figl_HTML.jpg)\n\n\
    ```\n>> num = {[1 1] ; 1}\nden = {[1 2 2] ; [1 0]}\nH = tf(num,den)\n\nnum =\n\
    \    [double 1 x 2]\n    [1.00]\n\nden =\n    [double 1 x 3]\n    [1x2 double]\n\
    \nTransfer function from input to output...\n     s + 1\n#1:  -------------\n\
    \    s ^ 2 + 2 s + 2\n\n     1\n#2:  -\n     s\n```\n\nThe following example computes\
    \ the transfer function for the following state-space model:\n\n![A978-1-4842-0289-0_3_Figm_HTML.jpg](A978-1-4842-0289-0_3_Figm_HTML.jpg)\n\
    \n```\n>> sys = ss([-2 -1;1 -2],[1 1;2 -1],[1 0],[0 1])\ntf(sys)\n\na = \n   \
    \    x1         x2\n x1      -2         -1\n x2       1         -2\n\nb = \n \
    \      u1         u2\n x1      1          1\n x2      2         -1\n\nc = \n \
    \      x1         x2\n y1      1          0\n\nd = \n       u1         u2\n y1\
    \      0          1\n\nContinuous-time model.\n\nTransfer function from input\
    \ 1 to output:\n    s - 2.963e-016\n   --------------\n      s^2 + 4 s + 5\n\n\
    Transfer function from input 2 to output:\n   s ^ 2 + 5 s + 8\n   -------------\n\
    \    s ^ 2 + 4 s + 5\n```\n\nThe following example specifies two discrete-time\
    \ transfer functions:\n\n![A978-1-4842-0289-0_3_Fign_HTML.jpg](A978-1-4842-0289-0_3_Fign_HTML.jpg)\n\
    \n```\n>> g = tf([1 1],[1 2 3],0.1)\n\nTransfer function:\n   z + 1\n-------------\n\
    z^2 + 2 z + 3\n\nSampling time: 0.1\n\n>> h = tf([1 1],[1 2 3],0.1,'variable','z^-1')\n\
    \nTransfer function:\n  1 + z^-1\n-------------------\n1 + 2 z^-1 + 3 z^-2\n\n\
    Sampling time: 0.1\n```\n\nWe now specify the zero-pole-gain model associated\
    \ with the transfer function:\n\n![A978-1-4842-0289-0_3_Figo_HTML.jpg](A978-1-4842-0289-0_3_Figo_HTML.jpg)\n\
    \n```\n>> z = {[] ; -0.5}\np = {0.3 ; [0.1+i 0.1-i]}\nk = [1 ; 2]\nH = zpk(z,p,k,-1)\n\
    \nz =\n       []\n   [-0.5000]\n\np =\n   [    0.3000]\n   [1x2 double]\n\nk =\n\
    \    1\n    2\n\nZero/pole/gain from input to output...\n         1\n#1:  -------\n\
    \     (z-0.3)\n\n     2 (z+0.5)\n#2:  -------------------\n     (z^2 - 0.2z +\
    \ 1.01)\n\nSampling time: unspecified\n```\n\nIn the following example the transfer\
    \ function `tf([-10 20 0],[1 7 20 28 19 5])` is converted into zero-pole-gain\
    \ format.\n\n```\n>> h = tf([-10 20 0],[1 7 20 28 19 5])\n\nTransfer function:\n\
    \   -10 s^2 + 20 s\n----------------------------------------\ns^5 + 7 s^4 + 20\
    \ s^3 + 28 s^2 + 19s + 5\n\n>> zpk(h)\n\nZero/pole/gain:\n   -10 s (s-2)\n----------------------\n\
    (s) ^ 3 (s ^ 2 + 4s + 5)\n```\n\n### Model Feature Commands\n\n| Command | Description\
    \ |\n| --- | --- |\n| `str = class(object)` | Displays a string describing which\
    \ type of model object is (`‘tf’`, `‘zpk’`, `‘ss’`, or `‘frd’`). |\n| `hasdelay(sys)`\
    \ | Returns 1 if the LTI model `sys` has input, output, input/output or internal\
    \ delays, and returns 0 otherwise. |\n| `k= isa(obj,‘class’)` | Returns 1 if the\
    \ object is of the given class. |\n| `boo = isct(sys)` `boo = isdt(sys)` | Returns\
    \ 1 if the LTI model `sys` is continuous. Returns 1 if the LTI model `sys` is\
    \ discrete. |\n| `boo = isempty(sys)` | Returns 1 if the LTI model `sys` has no\
    \ input or output. |\n| `boo = isproper(sys)` | Returns 1 if the LTI model `sys`\
    \ is proper. |\n| `boo = issiso(sys)` | Returns 1 if the LTI model `sys` is SISO.\
    \ |\n| `n = ndims(sys)` | Returns the number of dimensions in the LTI model or\
    \ model array `sys`. |\n| `size(sys)` `d = size(sys)` `Ny = size(sys,1)` `Nu =\
    \ size(sys,2)` `Sk = size(sys,2+k)` `Ns = size(sys,‘order’)` `Nf = size(sys,‘frequency’)`\
    \ | Displays the number of inputs/outputs of `sys`. Assigns the number of inputs/outputs\
    \ of `sys` to `d`. Returns the number of outputs of `sys`. Returns the number\
    \ of inputs of `sys`. Returns the length of the k-th dimension of the array when\
    \ `sys` is an LTI array. Returns the order of the (TS, SS, or ZPK) model `sys`.\
    \ Returns the frequency of the FRD model `sys`. |\n\n### Model Conversion Commands"
