    >> theta = scal(theta,mx,stdx);\n>> nout = 1;\ndelt = 7;\nmodel = imp2step(delt,nout,theta);\n\
    >> plotstep (model)\n```\n\n![A978-1-4842-0289-0_4_Fig2_HTML.jpg](img/A978-1-4842-0289-0_4_Fig2_HTML.jpg)\n\
    \n图 4-2.\n\n## 练习 4-2\n\n将下面定义的连续时间传递函数模型 `G(s)` 转换为相应的 MPC 传递函数模型。假设延迟为 2.5，执行相同任务，并找到等效的离散传递函数。\n\
