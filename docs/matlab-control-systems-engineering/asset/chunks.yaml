    \ (sx, y, n);\n>> ninput = 2;\nplotopt = 2;\n[theta, yres] = mlr (xreg, yreg,\
    \ ninput, plotopt);\n```\n\n![A978-1-4842-0289-0_4_Fig1_HTML.jpg](img/A978-1-4842-0289-0_4_Fig1_HTML.jpg)\n\
