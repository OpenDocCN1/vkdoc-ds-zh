    ### Commands for Reduced Order Models


    | Command | Description |

    | --- | --- |

    | [sysb,g] = balreal(sys) [sysb,g,T,Ti] = balreal(sys) | Computes a balanced realization
    sysb for the stable portion of the LTI model sys. balreal handles both continuous
    and discrete systems. In addition returns the vector g containing the diagonal
    of the balanced gramian, the state similarity transformation x [b] = Tx used to
    convert sys to sysb, and the inverse transformation Ti = T ^(−1) |

    | sysr = minreal(sys) sysr = minreal(sys,tol) [sysr,u] = minreal(sys,tol) | Eliminates
    uncontrollable or unobservable states in state-space models, or cancels pole-zero
    pairs in transfer functions or zero-pole-gain models. Specifies the tolerance
    used for state elimination or pole-zero cancellation. The default value is tol
    = sqrt(eps) and increasing this tolerance forces additional cancellations. In
    addition finds an orthogonal matrix U such that (U*A*U’,U*B,C*U’) is a Kalman
    decomposition of (A,B,C). |

    | rsys = modred(sys,elim) rsys = modred(sys,elim,‘method’) | Reduces the order
    of a continuous or discrete state-space model sys by eliminating the states found
