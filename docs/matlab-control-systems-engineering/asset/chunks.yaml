- fmt: "# Frequency Response Commands\n\n| Command | Description |\n| --- | --- |\n\
    | `S = allmargin(sys)` | Computes the gain margin, phase margin, delay margin\
    \ and the corresponding crossover frequencies of the SISO open-loop model `sys`.\
    \ |\n| `bode(sys)`, `bode(sys,w)`, `bode(sys1,sys2,...,sysN)`, `bode(sys1,sys2,...,sysN,w)`,\
    \ `bode(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’)`, `[mag,phase,w] = bode(sys)`\
    \ | Creates a Bode plot of the frequency response of the model `sys`, or of several\
    \ systems. The frequency range can be specified by `w` as well as various graphics\
    \ options. You can also obtain the magnitude, phase and frequency values of `bode(sys)`.\
    \ |\n| `bodemag(sys)`, `bodemag(sys,{wmin,wmax})`, `bodemag(sys,w)`, `bodemag(sys1,sys2,...,sysN,w)`,\
    \ `bodemag(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’)` | Creates a Bode plot of\
    \ the frequency response of the model `sys`, or of several models, without the\
    \ phase diagram. The frequency range and various graphics options can be user-specified.\
    \ |\n| `frsp = evalfr(sys,f)` | Evaluates the transfer function of the system\
    \ `sys` at the complex frequency `f`. |\n| `H = freqresp(sys,w)` | Returns the\
    \ frequency response of `sys` on the real frequency grid specified by the vector\
    \ `w`. |\n| `isys = interp(sys,freqs)` | Interpolates the frequency response data\
    \ contained in the FRD model `sys` at the frequencies `freqs`. |\n| `y = linspace(a,b)`,\
    \ `y = linspace(a,b,n)` | Creates a vector with 100 or `n` values equally spaced\
    \ between `a` and `b`. |\n| `y = logspace(a,b)`, `y = logspace(a,b,n)`, `y = logspace(a,pi,n)`\
    \ | Creates a vector with uniform logarithmic spacing between `10^a` and `10^b`\
    \ (50 points between `10^a` and `10^b`, `n` points between `10^a` and `10^b` or\
    \ `n` points between `10^a` and `π`). |\n| `[Gm,Pm,Wgm,Wpm] = margin(sys)`, `[Gm,Pm,Wgm,Wpm]\
    \ = margin(mag,phase,w)`, `margin(sys)` | Calculates the minimum gain margin `Gm`,\
    \ phase margin `Pm`, and associated frequencies `Wgm` and `Wpm` of SISO open-loop\
    \ models. Magnitude, phase and frequency vectors can be specified, and the Bode\
    \ plot can be generated. |\n| `ngrid` | Superimposes Nichols chart grid lines\
    \ over the Nichols frequency response of a system. |\n| `nichols(sys)`, `nichols(sys,w)`,\
    \ `nichols(sys1,sys2,...,sysN)`, `nichols(sys1,sys2,...,sysN,w)`, `nichols(sys1,‘PlotStyle1’,...,\
    \ sysN,‘PlotStyleN’)`, `[mag,phase,w] = nichols(sys)`, `[mag,phase] = nichols(sys,w)`\
    \ | Creates a Nichols chart of the frequency response of a model. The arguments\
    \ have the same meanings as for the Bode plot. |\n| `nyquist(sys)`, `nyquist(sys,w)`,\
    \ `nyquist(sys1,sys2,...,sysN)`, `nyquist(sys1,sys2,...,sysN,w)`, `nyquist(sys1,‘PlotStyle1’,...,\
    \ sysN,‘PlotStyleN’)`, `[re,im,w] = nyquist(sys)`, `[re,im] = nyquist(sys,w)`\
    \ | Creates a Nyquist plot of the frequency response of a model. The arguments\
    \ have the same meanings as for the Bode plot. |\n| `sigma(sys)`, `sigma(sys,w)`,\
    \ `sigma(sys,w,type)`, `sigma(sys1,sys2,...,sysN)`, `sigma(sys1,sys2,...,sysN,w)`,\
    \ `sigma(sys1,sys2,...,sysN,w,type)`, `sigma(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’)`,\
    \ `[sv,w] = sigma(sys)`, `sv = sigma(sys,w)` | Calculates the singular values\
    \ of the frequency response of a model. |\n\nAs a first example we generate the\
    \ Bode plot for the following continuous SISO system (see Figure [3-25](#A978-1-4842-0289-0_3_Chapter.html#Fig25)):\n\
    \n![A978-1-4842-0289-0_3_Figak_HTML.jpg](A978-1-4842-0289-0_3_Figak_HTML.jpg)\n\
    \n```\n>> g = tf([1 0.1 7.5],[1 0.12 9 0 0]);\nbode (g)\n```\n\n![A978-1-4842-0289-0_3_Fig25_HTML.jpg](A978-1-4842-0289-0_3_Fig25_HTML.jpg)\n\
    \nFigure 3-25.\n\nNext we evaluate the following discrete-time transfer function\
    \ at `z = 1 + i`:\n\n![A978-1-4842-0289-0_3_Figal_HTML.jpg](A978-1-4842-0289-0_3_Figal_HTML.jpg)\n\
    \n```\n>> H = tf([1 -1],[1 1 1],-1)\nz = 1+j\nevalfr(H,z)\n\nTransfer function:\n\
    z - 1\n-----------\nz^2 + z + 1\n\nSampling time: unspecified\n\nz =\n   1.0000\
    \ + 1.0000i\n\nans =\n   0.2308 + 0.1538i\n```\n\nNext we generate the Nichols\
    \ chart, with grid, for the following system (see Figure [3-26](#A978-1-4842-0289-0_3_Chapter.html#Fig26)):\n\
    \n![A978-1-4842-0289-0_3_Figam_HTML.jpg](A978-1-4842-0289-0_3_Figam_HTML.jpg)\n\
    \n```\n>> H = tf([-4 48 -18 250 600],[1 30 282 525 60])\n\nTransfer function:\n\
    -4 s^4 + 48 s^3 - 18 s^2 + 250s + 600\n--------------------------------------\n\
    s^4 + 30 s^3 + 282 s^2 + 525s + 60\n\n>> nichols(H)\n>> ngrid\n```\n\n![A978-1-4842-0289-0_3_Fig26_HTML.jpg](A978-1-4842-0289-0_3_Fig26_HTML.jpg)\n\
    \nFigure 3-26.\n\n# Pole Location Commands\n\n| Command | Description |\n| ---\
    \ | --- |\n| `k = acker(A,b,p)` | Given the single input system ![A978-1-4842-0289-0_3_Figan_HTML.jpg](A978-1-4842-0289-0_3_Figan_HTML.jpg)\
    \ and a vector `p` of desired closed-loop pole locations, using Ackermann’s method,\
    \ `k` is determined such that the eigenvalues of `A-bk` match the entries of `p`\
    \ (up to ordering). |\n| `K = place(A,B,p)` | Given the single or multi-input\
    \ system ![A978-1-4842-0289-0_3_Figao_HTML.jpg](A978-1-4842-0289-0_3_Figao_HTML.jpg)\
    \ and a vector `p` of desired closed-loop pole locations, `k` is determined such\
    \ that the eigenvalues of `A-bk` match the entries of `p` (up to ordering). |\n\
    | `est = estim(sys,L)`, `est = estim(sys,L,sensors,known)` | Produces a state/output\
    \ estimator `est` given the plant state-space model `sys` and the estimator gain\
    \ `L`. The measured outputs (`sensors`) and the known inputs (`known`) can be\
    \ specified. |\n| `rsys = reg(sys,K,L)`, `rsys = reg(sys,K,L,sensors,known,controls)`\
    \ | Forms a dynamic regulator or compensator `rsys` given a state-space model\
    \ `sys` of the plant, a state-feedback gain matrix `K`, and an estimator gain\
    \ matrix `L`. The measured outputs (`sensors`) and the known inputs (`known`)\
    \ can be specified. |\n\n# LQG Design Commands\n\n| Command | Description |\n\
    | --- | --- |\n| `[K, S, e] = lqr(A,B,Q,R)`, `[K, S, e] = lqr(A,B,Q,R,N)` | Calculates\
    \ the LQ-optimal gain for continuous models. |\n| `[K, S, e] = dlqr(a,b,Q,R)`,\
    \ `[K, S, e] = dlqr(a,b,Q,R,N)` | Calculates the LQ-optimal gain for discrete\
    \ models. |\n| `[K,S,e] = lqry(sys,Q,R)`, `[K,S,e] = lqry(sys,Q,R,N)` | Calculates\
    \ the LQ-optimum gain with weighted output. |\n| `[Kd,S,e] = lqrd(A,B,Q,R,Ts)`,\
    \ `[Kd,S,e] = lqrd(A,B,Q,R,N,Ts)` | Calculates the discrete LQ gain for continuous\
    \ models. |\n| `[kest,L,P] = kalman(sys,Qn,Rn,Nn)`, `[kest,L,P,M,Z] = kalman(sys,Qn,Rn,Nn)`\
    \ | Computes the Kalman estimator for continuous and discrete models. |\n| `[kest,L,P,M,Z]\
    \ = kalmd(sys,Qn,Rn,Ts)` | Computes the discrete Kalman estimator for continuous\
    \ models. |\n| `rlqg = lqgreg(kest,k)`, `rlqg = lqgreg(kest,k,controls)` | Forms\
    \ the linear-quadratic-Gaussian (LQG) regulator by connecting the Kalman estimator\
    \ designed with `kalman` and the optimal state-feedback gain designed with `lqr`,\
    \ `dlqr` or `lqry`. |"
  raw: '### Frequency Response Commands


    | Command | Description |

    | --- | --- |

    | S = allmargin(sys) | Computes the gain margin, phase margin, delay margin and
    the corresponding crossover frequencies of the SISO open-loop model sys. |

    | bode(sys) bode(sys,w) bode(sys1,sys2,...,sysN) bode(sys1,sys2,...,sysN,w) bode(sys1,‘PlotStyle1’,...,
    sysN,‘PlotStyleN’) [mag,phase,w] = bode(sys) | Creates a Bode plot of the frequency
    response of the model sys, or of several systems. The frequency range can be specified
    by w as well as various graphics options. You can also obtain the magnitude, phase
    and frequency values of bode(sys). |

    | bodemag(sys) bodemag(sys,{wmin,wmax}) bodemag(sys,w) bodemag(sys1,sys2,...,sysN,w)
    bodemag(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’) | Creates a Bode plot of the
    frequency response of the model sys, or of several models, without the phase diagram.
    The frequency range and various graphics options can be user-specified. |

    | frsp = evalfr(sys,f) | Evaluates the transfer function of the system sys at
    the complex frequency f. |

    | H = freqresp(sys,w) | Returns the frequency response of sys on the real frequency
    grid specified by the vector w. |

    | isys = interp(sys,freqs) | Interpolates the frequency response data contained
    in the FRD model sys at the frequencies freqs. |

    | y = linspace(a,b) y = linspace(a,b,n) | Creates a vector with 100 or n values
    equally spaced between a and b. |

    | y= logspace(a,b) y = logspace(a,b,n) y = logspace(a,pi,n) | Creates a vector
    with uniform logarithmic spacing between 10 ^a and 10 ^b (50 points between 10
    ^a and 10 ^b , n points between 10 ^a and 10 ^b or n points between 10 ^a and
    π). |

    | [Gm,Pm,Wgm,Wpm] = margin(sys) [Gm,Pm,Wgm,Wpm] = margin(mag,phase,w) margin(sys)
    | Calculates the minimum gain margin, Gm, phase margin, Pm, and associated frequencies
    Wgm and Wpm of SISO open-loop models. Magnitude, phase and frequency vectors can
    be specified, and the Bode plot can be generated. |

    | ngrid | Superimposes Nichols chart grid lines over the Nichols frequency response
    of a system. |

    | nichols(sys) nichols(sys,w) nichols(sys1,sys2,...,sysN) nichols(sys1,sys2,...,sysN,w)
    nichols(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’) [mag,phase,w] = nichols(sys)
    [mag,phase] = nichols(sys,w) | Creates a Nichols chart of the frequency response
    of a model. The arguments have the same meanings as for the Bode plot. |

    | nyquist(sys) nyquist(sys,w) nyquist(sys1,sys2,...,sysN) nyquist(sys1,sys2,...,sysN,w)
    nyquist(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’) [re,im,w] = nyquist(sys) [re,im]
    = nyquist(sys,w) | Creates a Nyquist plot of the frequency response of a model.
    The arguments have the same meanings as for the Bode plot. |

    | sigma(sys) sigma(sys,w) sigma(sys,w,type) sigma(sys1,sys2,...,sysN) sigma(sys1,sys2,...,sysN,w)
    sigma(sys1,sys2,...,sysN,w,type) sigma(sys1,‘PlotStyle1’,..., sysN,‘PlotStyleN’)
    [sv,w] = sigma(sys) sv = sigma(sys,w) | Calculates the singular values of the
    frequency response of a model. |


