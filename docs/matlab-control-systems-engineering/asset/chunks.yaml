    \ the following syntax (see Figure [4-5](#A978-1-4842-0289-0_4_Chapter.html#Fig5)):\n\
    \n```\n>> ulim=[-inf -0.15 inf inf 0.1 100];\n>> ylim=[0 0 inf inf];\n>> [y,u]=cmpc(plant,model,ywt,uwt,M,P,tend,r,ulim,ylim);\n\
    >> plotall(y,u,delt),pause\n```\n\n```\nTime remaining 30/30\nTime remaining 0/30\n\
    Simulation time is 0.03 seconds.\n```\n\n![A978-1-4842-0289-0_4_Fig5_HTML.jpg](A978-1-4842-0289-0_4_Fig5_HTML.jpg)\n\
    \n**Figure 4-5.**\n\n## EXERCISE 4-6\n\nFor the linear system described in the\
    \ previous exercises, design a controller for setting model parameters, calculate\
    \ the closed loop of the system and check the poles for stability. Then create\
    \ a graph of the frequency response of the sensitivity and complementary sensitivity\
    \ and calculate and graph the singular values of the sensitivity.\n\n```\n>> g11=poly2tfd(12.8,[16.7\
    \ 1],0,1);\n>> g21=poly2tfd(6.6,[10.9 1],0,7);\n>> g12=poly2tfd(-18.9,[21.0 1],0,3);\n\
    >> g22=poly2tfd(-19.4,[14.4 1],0,3);\n>> delt=3; ny=2;\n>> imod=tfd2mod(delt,ny,g11,g21,g12,g22);\n\
    >> pmod=imod;\n>> P=6;\n>> M=2;\n>> ywt=[ ];\n>> uwt=[ ];\n>> Ks=smpccon(imod,ywt,uwt,M,P);\n\
    >> clmod=smpccl(pmod,imod,Ks);\n>> maxpole=max(abs(smpcpole(clmod)))\n```\n\n\
    ```\nmaxpole =\n    0.8869\n```\n\nThe graphs of the frequency response of the\
    \ sensitivity (Figure [4-6](#A978-1-4842-0289-0_4_Chapter.html#Fig6)) and complementary\
    \ sensitivity (Figure [4-7](#A978-1-4842-0289-0_4_Chapter.html#Fig7)) are generated\
