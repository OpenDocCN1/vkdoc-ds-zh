    ![A978-1-4842-0289-0_3_Figs_HTML.jpg](A978-1-4842-0289-0_3_Figs_HTML.jpg) |

    | `sys = ss(A,B,C,D,E,ltisys)` | Creates a continuous-time state-space model with
