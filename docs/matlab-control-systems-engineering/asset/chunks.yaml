- fmt: '# 3. Control Systems


    ## Introduction to Control Systems


    `MATLAB` offers an integrated environment in which you can design control systems.
    The diagram in Figure [3-1](#A978-1-4842-0289-0_3_Chapter.html#Fig1) shows how
    an engineering problem leads to the development of models and the analysis of
    experimental data, which in turn lead to the design and simulation of control
    systems. The subsequent analysis of these systems leads to further modifications
    of the design, this development loop resulting in rapid prototyping and implementation
    of effective systems.


    ![A978-1-4842-0289-0_3_Fig1_HTML.jpg](A978-1-4842-0289-0_3_Fig1_HTML.jpg)


    Figure 3-1.


    `MATLAB` provides a high-level platform for technical model generation, data analysis
    and algorithm development. `MATLAB` combines comprehensive engineering and mathematics
    functionality with powerful visualization and animation features, all within a
    high-level interactive programming language. The `MATLAB` toolboxes extend the
    `MATLAB` environment to incorporate a wide range of classical and modern techniques
    for the design of control systems, providing cutting edge control algorithms developed
    by internationally recognized experts.


    `MATLAB` contains more than 600 mathematical, statistical and engineering functions,
    providing the power of numerical calculation you need to analyze data, develop
    algorithms and optimize the performance of a system. With `MATLAB`, you can run
    fast iterations of designs and compare performances of alternative control strategies.
    In addition, `MATLAB` is a high-level programming language that allows you to
    develop algorithms in a fraction of the time spent in `C`, `C++` or `FORTRAN`.
    `MATLAB` is open and extendible, you can see the source code, modify algorithms
    and incorporate existing `C`, `C++` and `FORTRAN` programs.


    The interactive `Control System Toolbox` tools facilitate the design and adjustment
    of control systems. For example, you might drag poles and zeros and see immediately
    how the system reacts (Figure [3-2](#A978-1-4842-0289-0_3_Chapter.html#Fig2)).
    In addition, `MATLAB` provides powerful interactive 2-D and 3-D graphics features
    showing data, equations, and results (Figure [3-3](#A978-1-4842-0289-0_3_Chapter.html#Fig3)).
    It is possible to use a wide range of visualization aids in `MATLAB` or you can
    take advantage of the specific control functions which are provided by the `MATLAB`
    toolboxes.


    ![A978-1-4842-0289-0_3_Fig3_HTML.jpg](A978-1-4842-0289-0_3_Fig3_HTML.jpg)


    Figure 3-3.


    ![A978-1-4842-0289-0_3_Fig2a_HTML.jpg](A978-1-4842-0289-0_3_Fig2a_HTML.jpg)![A978-1-4842-0289-0_3_Fig2b_HTML.jpg](A978-1-4842-0289-0_3_Fig2b_HTML.jpg)


    Figure 3-2.


    The `MATLAB` toolboxes include applications written with `MATLAB` language-specific
    functionality. The `MATLAB` control-related toolboxes encompass virtually all
    of the fundamental techniques of control design, from `LQG` and root-locus to
    `H` and logical diffuse methods. For example, it might add a fuzzy logic control
    system design using the built-in algorithms of the `Fuzzy Logic Toolbox` (Figure
    [3-4](#A978-1-4842-0289-0_3_Chapter.html#Fig4)).


    ![A978-1-4842-0289-0_3_Fig4_HTML.jpg](A978-1-4842-0289-0_3_Fig4_HTML.jpg)


    Figure 3-4.


    The most important `MATLAB` toolboxes for control systems can be classified into
    three families: modeling (`System Identification Toolbox`), classical design and
    analysis products (`Control System Toolbox` and `Fuzzy Logic Toolbox`), design
    and advanced analysis products (`Robust Control Toolbox`, `Mu-Analysis Toolbox`,
    `LMI Control Toolbox` and `Model Predictive Toolbox`) and optimization products
    (`Optimization Toolbox`). The following diagram illustrates this classification.


    ## Control System Design and Analysis: The Control System Toolbox


    The `Control System Toolbox` is a collection of algorithms, mainly written as
    `M-files`, that implement common techniques of design, analysis, and modeling
    of control systems. Its wide range of services includes classical and modern methods
    of control design, including root locus, pole placement and `LQG` regulator design.
    Certain graphical user interfaces simplify the typical tasks of control engineering.
    This toolbox is built on the fundamentals of `MATLAB` to facilitate specialized
    control systems for engineering tools.


    With the `Control System Toolbox` you can create models of linear time-invariant
    systems (`LTI`) in transfer function, zero-pole-gain or state-space formats. You
    can manipulate both discrete-time and continuous-time systems and convert between
    various representations. You can calculate and graph time response, frequency
    response and loci of roots. Other functions allow you to perform placement of
    poles, optimal control and estimates. The `Control System Toolbox` is open and
    extendible, allowing you to create customized `M-files` to suit your specific
    applications.


    The following are the key features of the `Control System Toolbox`:


    - `LTI Viewer`: An interactive `GUI` to analyze and compare `LTI` systems.

    - `SISO Design Tool`: An interactive `GUI` to analyze and adjust single-input/single-output
    (`SISO`) feedback control systems.

    - `GUI Suite`: Sets preferences and properties to give full control over the display
    of time and frequency plots.

    - `LTI` objects: Structures specialized data to concisely represent model data
    in transfer function, state-space, zero-pole-gain and frequency response formats.

    - `MIMO`: Support for multiple-input/multiple-output (`MIMO`) systems, sampled
    data, continuous-time systems and systems with time delay.

    - Functions and operators to connect `LTI` models: Creates complex block diagrams
    (connections in series, parallel and feedback).

    - Support for various methods of converting discrete systems to continuous systems,
    and vice versa.

    - Functions to graphically represent solutions for time and frequency systems
    and compare various systems with a single command.

    - Tools for classical and modern techniques of control design, including root
    locus analysis, loop shaping, pole placement and `LQR`/`LQG` control.


    ### Construction of Models


    The `Control System Toolbox` supports the representation of four linear models:
    state-space models (`SS`), transfer functions (`TF`), zero-pole-gain models (`ZPK`)
    and frequency data models (`FRD`). `LTI` objects are provided for each model type.
    In addition to model data, `LTI` objects can store the sample time of discrete-time
    systems, delays, names of inputs and outputs, notes on the model and many other
    details. Using `LTI` objects, you can manipulate models as unique entities and
    combine them using matrix-type operations. An illustrative example of the design
    of a simple `LQG` controller is shown in Figure [3-5](#A978-1-4842-0289-0_3_Chapter.html#Fig5).
    The code extract at the bottom shows how the controller is designed and how the
    closed-loop system has been created. The plot of the frequency response shows
    a comparison between the open-loop system (red) and closed loop system (blue).


    ![A978-1-4842-0289-0_3_Fig5_HTML.jpg](A978-1-4842-0289-0_3_Fig5_HTML.jpg)


    Figure 3-5.


    The `Control System Toolbox` contains commands which analyze and compute model
    features such as `I/O` dimensions, poles, zeros and `DC` gain. These commands
    apply both to continuous-time and discrete-time models.


    ### Analysis and Design


    Some tasks lend themselves to graphic manipulation, while others benefit from
    the flexibility of the command line. The `Control System Toolbox` is designed
    to accommodate both approaches, providing a complete set of functions for the
    design and analysis of models via the command line or `GUI`.'
