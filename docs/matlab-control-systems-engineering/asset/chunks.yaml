- fmt: "### Arithmetic Operators\n\nThere are two types of arithmetic operators in\
    \ MATLAB: matrix arithmetic operators, which are governed by the rules of linear\
    \ algebra, and arithmetic operators on vectors, which are performed elementwise.\
    \ The operators involved are presented in the following table.\n\n| Operator |\
    \ Role played |\n| --- | --- |\n| `+` | Sum of scalars, vectors, or matrices |\n\
    | `-` | Subtraction of scalars, vectors, or matrices |\n| `*` | Product of scalars\
    \ or arrays |\n| `.*` | Product of scalars or vectors |\n| `\\` | `A\\B = inv(A)\
    \ * B`, where `A` and `B` are matrices |\n| `.\\` | `A.\\B = [B(i,j) / A(i,j)]`,\
    \ where `A` and `B` are vectors (`dim(A) = dim(B)`) |\n| `/` | Quotient, or `B/A\
    \ = B * inv(A)`, where `A` and `B` are matrices |\n| `./` | `A./B = [A(i,j) /\
    \ B(i,j)]`, where `A` and `B` are vectors (`dim(A) = dim(B)`) |\n| `^` | Power\
    \ of a scalar or matrix (`M^p`) |\n| `.^` | Power of vectors (`A.^B = [A(i,j)^(B(i,j))]`,\
    \ for vectors `A` and `B`) |\n\nSimple mathematical operations between scalars\
    \ and vectors apply the scalar to all elements of the vector according to the\
    \ defined operation, and simple operators between vectors are performed element\
    \ by element. Below is the specification of these operators:\n\n| `a = {a1, a2,...,\
    \ an}`, `b = {b1, b2,..., bn}`, `c = scalar` | |\n| --- | --- |\n| `a + c = [a1+c,\
    \ a2+c,..., an+c]` | Sum of a scalar and a vector |\n| `a * c = [a1*c, a2*c ,...,\
    \ an*c]` | Product of a scalar and a vector |\n| `a + b = [a1+b1, a2+b2, ...,\
    \ an+bn]` | Sum of two vectors |\n| `a.*b = [a1*b1, a2*b2, ..., an*bn]` | Product\
    \ of two vectors |\n| `a./b = [a1/b1, a2/b2, ..., an/bn]` | Ratio to the right\
    \ of two vectors |\n| `a.\\b = [a1\\b1, a2\\b2, ..., an\\bn]` | Ratio to the left\
    \ of two vectors |\n| `a.^c = [a1^c, a2^c ,..., an^c]` | Vector to the power of\
    \ a scalar |\n| `c.^a = [c^a1, c^a2, ..., c^an]` | Scalar to the power of a vector\
    \ |\n| `a.^b = [a1^b1, a2^b2, ..., an^bn]` | Vector to the power of a vector |\n\
    \nIt must be borne in mind that the vectors must be of the same length and that\
    \ in the product, quotient and power the first operand must be followed by a point.\n\
    \nThe following example involves all of the above operators.\n\n```\n>> X = [5,4,3];\
    \ Y = [1,2,7]; a = X + Y, b = X-Y, c = x * Y, d = 2\\. * X,...\ne = 2/X, f = 2\\\
    . \\Y, g = x / Y, h =. \\X, i = x ^ 2, j = 2\\. ^ X, k = X. ^ Y\n\na =\n     6\
    \     6    10\nb =\n     4     2    -4\nc =\n     5     8    21\nd =\n    10 \
    \    8     6\ne =\n    0.4000    0.5000    0.6667\nf =\n    0.5000    1.0000 \
    \   3.5000\ng =\n    5.0000    2.0000    0.4286\nh =\n    5.0000    2.0000   \
    \ 0.4286\ni =\n    25    16     9\nj =\n    32 16 8\nk =\n    5 16 2187\n```\n\
    \nThe above operations are all valid since in all cases the variable operands\
    \ are of the same dimension, so the operations are successfully carried out element\
    \ by element. For the sum and the difference there is no distinction between vectors\
    \ and matrices, as the operations are identical in both cases.\n\nThe most important\
    \ operators for matrix variables are specified below:\n\n| `A + B`, `A - B`, `A\
    \ * B` | Addition, subtraction and product of matrices. |\n| `A\\B` | If `A` is\
    \ square, `A\\B = inv(A) * B`. If `A` is not square, `A\\B` is the solution, in\
    \ the sense of least-squares, of the system `AX = B`. |\n| `B/A` | Coincides with\
    \ `(A' \\ B')'`. |\n| `A^n` | Coincides with `A * A * A *... *A` n times (n integer).\
    \ |\n| `p^A` | Performs the power operation only if `p` is a scalar. |\n\nHere\
    \ are some examples:\n\n```\n>> X = [5,4,3]; Y = [1,2,7]; l = X'* Y, m = X * Y\
    \ ', n = 2 * X, o = X / Y, p = Y\\X\n\nl =\n     5 10 35\n     4 8 28\n     3\
    \ 6 21\nm =\n    34\nn =\n    10 8 6\no =\n    0.6296\np =\n     0         0 \
    \        0\n     0         0         0\n     0.7143    0.5714    0.4286\n```\n\
    \nAll of the above matrix operations are well defined since the dimensions of\
    \ the operands are compatible in every case. We must not forget that a vector\
    \ is a particular case of matrix, but to operate with it in matrix form (not element\
    \ by element), it is necessary to respect the rules of dimensionality for matrix\
    \ operations. For example, the vector operations `X.' * Y` and `X.*Y'` make no\
    \ sense, since they involve vectors of different dimensions. Similarly, the matrix\
    \ operations `X * Y`, `2/X`, `2\\Y`, `X^2`, `2^X` and `X^Y` make no sense, again\
    \ because of a conflict of dimensions in the arrays.\n\nHere are some more examples\
    \ of matrix operators.\n\n```\n>> M = [1,2,3;1,0,2;7,8,9]\n\nM =\n     1 2 3\n\
    \     1 0 2\n     7 8 9\n\n>> B = inv(M), C = M ^ 2, D = M ^(1/2), E = 2 ^ M\n\
    \nB =\n   -0.8889    0.3333    0.2222\n    0.2778   -0.6667    0.0556\n    0.4444\
    \    0.3333   -0.1111\nC =\n    24    26    34\n    15    18    21\n    78   \
    \ 86   118\nD =\n    0.5219 + 0.8432i   0.5793 - 0.0664i   0.7756 - 0.2344i\n\
    \    0.3270 + 0.0207i   0.3630 + 1.0650i   0.4859 - 0.2012i\n    1.7848 - 0.5828i\
    \   1.9811 - 0.7508i   2.6524 + 0.3080i\nE =\n    1.0e+003 *\n    0.8626    0.9568\
    \    1.2811\n    0.5401    0.5999    0.8027\n    2.9482    3.2725    4.3816\n\
    ```\n\n### Relational Operators\n\nMATLAB also provides relational operators.\
    \ Relational operators perform element by element comparisons between two matrices\
    \ and return an array of the same size whose elements are zero if the corresponding\
    \ relationship is true, or one if the corresponding relation is false. The relational\
    \ operators can also compare scalars with vectors or matrices, in which case the\
    \ scalar is compared to all the elements of the array. Below is a table of these\
    \ operators.\n\n| `<` | Less than (for complex numbers this applies only to the\
    \ real parts) |\n| `<=` | Less than or equal (only applies to real parts of complex\
    \ numbers) |\n| `>` | Greater than (only applies to real parts of complex numbers)\
    \ |\n| `>=` | Greater than or equal (only applies to real parts of complex numbers)\
    \ |\n| `x == y` | Equality (also applies to complex numbers) |\n| `x ~= y` | Inequality\
    \ (also applies to complex numbers) |\n\n### Logical Operators\n\nMATLAB provides\
    \ symbols to denote logical operators. The logical operators shown in the following\
    \ table offer a way to combine or negate relational expressions.\n\n| `~A` | Logical\
    \ negation (NOT) or the complement of `A`. |\n| `A & B` | Logical conjunction\
    \ (AND) or the intersection of `A` and `B`. |\n| `A \\| B` | Logical disjunction\
    \ (OR) or the union of `A` and `B`. |\n| `XOR(A, B)` | Exclusive OR (XOR) or the\
    \ symmetric difference of `A` and `B` (takes the value 1 if `A` or `B`, but not\
    \ both, are 1). |\n\nHere are some examples:\n\n```\n>> A = 2:7; P = (A > 3) &\
    \ (A < 6)\nP =\n     0     0     1     1     0     0\n```\n\nReturns 1 when the\
    \ corresponding element of `A` is greater than 3 and less than 6, and returns\
    \ 0 otherwise.\n\n```\n>> X = 3 * ones(3,3); X >= [7 8 9; 4 5 6 ; 1 2 3]\nans\
    \ =\n     0 0 0\n     0 0 0\n     1 1 1\n```\n\nThe elements of the solution array\
    \ corresponding to those elements of `X` which are greater than or equal to the\
    \ equivalent entry of the matrix `[7 8 9; 4 5 6 ; 1 2 3]` are assigned the value\
    \ 1. The remaining elements are assigned the value 0."
