  trans: "\n### 动态模型命令\n\n| 命令 | 描述 |\n| --- | --- |\n| `[Wn,Z] = damp(sys)` `[Wn,Z,P]\
    \ = damp(sys)` | 显示线性模型 `sys` 极点的阻尼比、自然频率和时间常数表格。同时也可获取 `sys` 的极点向量 `P`。 |\n|\
    \ `k = dcgain(sys)` | 计算模型 `sys` 的低频（DC）增益。 |\n| `[P,Q] = covar(sys,W)` | 计算由高斯白噪声输入\
    \ `W` 驱动的 LTI 模型 `sys` 输出的稳态协方差。`P` 是稳态输出响应协方差，`Q` 是稳态状态协方差。 |\n| `s = dsort(p)`\
    \ `[s,ndx] = dsort(p)` | 将向量 `p` 中包含的离散时间极点按幅值降序排序。 |\n| `s = esort(p)` `[s,ndx]\
    \ = esort(p)` | 将向量 `p` 中包含的连续时间极点按实部排序。 |\n| `norm(sys)` `norm(sys,2)` `norm(sys,inf)`\
    \ `norm(sys,inf,tol)` `[ninf,fpeak] = norm(sys)` | 计算模型 `sys` 的 H² 范数。计算模型 `sys`\
    \ 的 H² 范数。计算模型 `sys` 的 H[∞] 范数。以容差 `tol` 计算模型 `sys` 的 H[∞] 范数。除计算 H[∞] 范数外，还计算增益达到峰值时的频率\
    \ `fpeak`。 |\n| `p = pole(sys)` `d = eig(A)` `d = eig(A,B)` `[V,D] = eig(A)` `[V,D]\
    \ = eig(A,'nobalance')` `[V,D] = eig(A,B)` `[V,D] = eig(A,B,flag)` | 计算 LTI 模型\
    \ `sys` 的极点。返回 `A` 的特征值向量。返回对 `(A,B)` 的广义特征值。返回矩阵 `A` 的特征值和特征向量。在不进行预平衡步骤的情况下返回\
    \ `A` 的特征值和特征向量。返回 `(A,B)` 的特征值和广义特征向量。分解方法（`'chol'` 或 `'qz'`）由 `flag` 指定。 |\n\
    | `pzmap(sys)` `pzmap(sys1,sys2,...,sysN)` `[p,z] = pzmap(sys)` | 为连续时间或离散时间动态系统\
    \ `sys`，或同时为多个 LTI 系统 `sys1`、`sys2`、...、`sysn` 绘制零极点图。`[p, z]` 返回极点和零点，不生成图形。\
    \ |\n| `rlocus(sys)` `rlocus(sys,k)` `rlocus(sys1,sys2,...)` `[r,k] = rlocus(sys)`\
    \ `r = rlocus(sys,k)` | 计算并绘制开环单输入单输出模型 `sys` 的根轨迹。使用用户指定的增益向量 `k` 绘制根轨迹。在单个图形中计算并绘制多个系统的根轨迹。返回所选增益向量\
    \ `k` 及这些增益对应的复根位置 `r`。返回系统 `sys` 在用户指定增益向量 `k` 下的根位置 `r`。 |\n| `r = roots(c)`\
    \ | 以列向量形式返回多项式 `c` 的根。 |\n| `sgrid` `zgrid` | 为零极点图和根轨迹图生成恒定阻尼比（从 0 到 1，步长为 0.1）和自然频率（从\
    \ 0 到 10 rad/sec，步长为 1 rad/sec）的网格，并在当前坐标轴上绘制网格。类似地，生成从 0 到 π、步长为 π/10 的网格，并在当前坐标轴上绘制网格。\
    \ |\n| `z = zero(sys)` `[z,gain] = zero(sys)` | 计算 LTI 模型 `sys` 的零点。返回 LTI 系统\
    \ `sys` 的零点和增益。 |\n\n作为第一个示例，我们计算连续传递函数模型的特征值、自然频率和阻尼因子：\n\n![A978-1-4842-0289-0_3_Figv_HTML.jpg](img/A978-1-4842-0289-0_3_Figv_HTML.jpg)\n\
    \n```\n>> H = tf([2 5 1],[1 2 3])\n传递函数:\n2 s² + 5 s + 1\n---------------\ns²\
    \ + 2 s + 3\n```\n\n```\n>> damp(H)\n特征值            阻尼比     频率 (rad/s)\n00e -\
    \ 1 + 000 + 1. 41e + 000i 5. 77e-001 1. 73e + 000\n00e - 1 + 000 - 1. 41e + 000i\
    \ 5. 77e-001 1. 73e + 000\n```\n\n在以下示例中，我们计算多输入多输出传递函数模型的 DC 增益：\n\n![A978-1-4842-0289-0_3_Figw_HTML.jpg](img/A978-1-4842-0289-0_3_Figw_HTML.jpg)\n\
    \n```\n>> H = [1 tf([1 -1],[1 1 3]) ; tf(1,[1 1]) tf([1 2],[1 -3])]\n>> dcgain(H)\n\
    从输入 1 到输出的传递函数...\n#1:  1\n1\n#2:  -----\n    s + 1\n从输入 2 到输出的传递函数...\n    s\n\
    #1:  -----------\n    s² + s + 3\n    s + 2\n#2:  -----\n     3s\nans =\n    1.0000\
    \   -0.3333\n    1.0000   -0.6667\n```\n\n接下来我们考虑离散时间传递函数\n\n![A978-1-4842-0289-0_3_Figx_HTML.jpg](img/A978-1-4842-0289-0_3_Figx_HTML.jpg)\n\
    \n采样时间为 0.1 秒，并计算其 2-范数和无穷范数（含最优值）。\n\n```\n>> H = tf([1 -2.841 2.875 -1.004],[1\
    \ -2.417 2.003 -0.5488],0.1)\n>> norm(H)\n传递函数:\nz³ - 2.841 z² + 2.875 z - 1.004\n\
    ----------------------------------\nz³ - 2.417 z² + 2.003 z - 0.5488\n采样时间: 0.1\n\
    ans =\n    1.2438\n>> [ninf,fpeak] = norm(H,inf)\nsurrounded =\n    2.5488\nfpeak\
    \ =\n    3.0844\n```\n\n随后，我们通过生成 `H(z)` 的伯德图来验证上述数值（见图 3-12）。\n\n```\n>> bode\
    \ (H)\n```\n\n![A978-1-4842-0289-0_3_Fig12_HTML.jpg](img/A978-1-4842-0289-0_3_Fig12_HTML.jpg)\n\
    \n图 3-12.\n\n图 3-12\n\n接下来，我们计算并绘制以下系统的根轨迹（见图 3-13）：\n\n![A978-1-4842-0289-0_3_Figy_HTML.jpg](img/A978-1-4842-0289-0_3_Figy_HTML.jpg)\n\
    \n```\n>> h = tf([2 5 1],[1 2 3]);\n>> rlocus (h)\n```\n\n![A978-1-4842-0289-0_3_Fig13_HTML.jpg](img/A978-1-4842-0289-0_3_Fig13_HTML.jpg)\n\
    \n图 3-13.\n\n图 3-13\n\n在下面的示例中，我们在以下系统的根轨迹上绘制 z 平面网格（见图 3-14）：\n\n![A978-1-4842-0289-0_3_Figz_HTML.jpg](img/A978-1-4842-0289-0_3_Figz_HTML.jpg)\n\
    \n```\n>> H = tf([2 -3.4 1.5],[1 -1.6 0.8],-1)\n传递函数:\n2 z² - 3.4 z + 1.5\n-------------------\n\
    z² - 1.6 z + 0.8\n采样时间: 未指定\n>> rlocus(H)\n>> zgrid\n>> axis('square')\n```\n\n\
    ![A978-1-4842-0289-0_3_Fig14_HTML.jpg](img/A978-1-4842-0289-0_3_Fig14_HTML.jpg)\n\
    \n图 3-14.\n\n图 3-14\n"
- fmt: "### Commands for Interconnecting Models\n\n![A978-1-4842-0289-0_3_Fig20_HTML.jpg](A978-1-4842-0289-0_3_Fig20_HTML.jpg)\n\
    \nFigure 3-20.\n\n![A978-1-4842-0289-0_3_Fig19_HTML.jpg](A978-1-4842-0289-0_3_Fig19_HTML.jpg)\n\
    \nFigure 3-19.\n\n![A978-1-4842-0289-0_3_Fig18_HTML.jpg](A978-1-4842-0289-0_3_Fig18_HTML.jpg)\n\
    \nFigure 3-18.\n\n![A978-1-4842-0289-0_3_Fig17_HTML.jpg](A978-1-4842-0289-0_3_Fig17_HTML.jpg)\n\
    \nFigure 3-17.\n\n![A978-1-4842-0289-0_3_Fig16_HTML.jpg](A978-1-4842-0289-0_3_Fig16_HTML.jpg)\n\
    \nFigure 3-16.\n\n![A978-1-4842-0289-0_3_Fig15_HTML.jpg](A978-1-4842-0289-0_3_Fig15_HTML.jpg)\n\
    \nFigure 3-15.\n\n| Command | Description |\n| --- | --- |\n| `sys = append(sys1,sys2,...,sysN)`\
    \ | Combines models in a diagonal configuration block. Groups the models together\
    \ by appending their inputs and outputs (Figure [3-15](#A978-1-4842-0289-0_3_Chapter.html#Fig15)).\
    \ |\n| `asys = augstate(sys)` | Appends the state vector to the output vector.\
    \ |\n| `sysc = connect(sys,Q,inputs,outputs)` | Connects the subsystems in a block\
    \ according to a chosen interconnection scheme (given by the connection matrix\
    \ `Q`). |\n| `sys = feedback(sys1,sys2)` `sys = feedback(sys1,sys2,sign)` `sys\
    \ = feedback(sys1,sys2,feedin,feedout,sign)` | Returns a model `sys` for the negative\
    \ feedback interconnection of models `sys1` and `sys2` (see Figure [3-16](#A978-1-4842-0289-0_3_Chapter.html#Fig16)).\
    \ May include `sign` and closed loop (see Figure [3-17](#A978-1-4842-0289-0_3_Chapter.html#Fig17)).\
    \ |\n| `sys = lft(sys1,sys2)` `sys = lft(sys1,sys2,nu,ny)` | Forms the linear\
    \ fractional transformation (LFT) of two models (see Figure [3-18](#A978-1-4842-0289-0_3_Chapter.html#Fig18)).\
    \ |\n| `[A,B,C,D] = ord2(wn,z)` `[num,den] = ord2(wn,z)` | Generates continuous\
    \ second-order systems (`wn` is the natural frequency and `z` is the damping factor).\
    \ |\n| `sys = parallel(sys1,sys2)` `sys = parallel(sys1,sys2,inp1,inp2,out1,out2)`\
    \ | Connects two systems in parallel (see Figure [3-19](#A978-1-4842-0289-0_3_Chapter.html#Fig19)).\
    \ |\n| `sys = series(sys1,sys2)` `sys = series(sys1,sys2,outputs1,inputs2)` |\
    \ Connects two systems in series (see Figure [3-20](#A978-1-4842-0289-0_3_Chapter.html#Fig20)).\
    \ |\n| `sys = stack(arraydim,sys1,sys2,...)` | Produces an array of dynamic system\
    \ models by stacking the models `sys1,sys2,...` along the array dimension `arraydim`.\
    \ |\n\nAs a first example we will combine the systems `tf(1, [1 0])` and `ss(1,2,3,4)`.\
    \ We should bear in mind that for systems with transfer functions H[1](s), H[2](s),\
    \ ..., H[n](s), the resulting combined system has as transfer function:\n\n![A978-1-4842-0289-0_3_Figaa_HTML.jpg](A978-1-4842-0289-0_3_Figaa_HTML.jpg)\n\
    \nFor two systems `sys1` and `sys2` defined by (A[1], B[1], C[1], D[1]) and (A[2],\
    \ B[2], C[2], D[2]), their combination `append(sys1, sys2)` yields the system:\n\
    \n![A978-1-4842-0289-0_3_Figab_HTML.jpg](A978-1-4842-0289-0_3_Figab_HTML.jpg)\n\
    \n![A978-1-4842-0289-0_3_Figac_HTML.jpg](A978-1-4842-0289-0_3_Figac_HTML.jpg)\n\
    \nFor our example we have:\n\n```\n>> sys1 = tf(1,[1 0])\nsys2 = ss(1,2,3,4)\n\
    sys = append(sys1,10,sys2)\n\nTransfer function:\n1\n-\ns\n\na =\nx1\nx1   1\n\
    \nb =\n    u1\nx1   2\n\nc =\n    x1\ny1   3\n\nd =\n    u1\ny1   4\n\nContinuous-time\
    \ model.\n\na =\n    x1  x2\nx1   0   0\nx2   0   1\n\nb =\n    u1  u2  u3\nx1\
    \   1   0   0\nx2   0   0   2\n\nc =\n    x1  x2\ny1   1   0\ny2   0   0\ny3 \
    \  0   3\n\nd =\n    u1  u2  u3\ny1   0   0   0\ny2   0  10   0\ny3   0   0  \
    \ 4\n\nContinuous-time model.\n```\n\nThe following example, illustrated in Figure\
    \ [3-21](#A978-1-4842-0289-0_3_Chapter.html#Fig21), attaches the plant `G(s)`\
    \ to the driver `H(s)`, defined below, using negative feedback:\n\n![A978-1-4842-0289-0_3_Figad_HTML.jpg](A978-1-4842-0289-0_3_Figad_HTML.jpg)\n\
    \n![A978-1-4842-0289-0_3_Figae_HTML.jpg](A978-1-4842-0289-0_3_Figae_HTML.jpg)\n\
    \n![A978-1-4842-0289-0_3_Fig21_HTML.jpg](A978-1-4842-0289-0_3_Fig21_HTML.jpg)\n\
    \nFigure 3-21.\n\n```\n>> G = tf([2 5 1],[1 2 3],'inputname','torque',...\n  \
    \       'outputname','velocity');\nH = zpk(-2,-10,5)\nCloop = feedback(G,H)\n\n\
    Zero/pole/gain:\n5 (s+2)\n-------\n(s+10)\n\nZero/pole/gain from input \"torque\"\
    \ to output \"velocity\":\n0.18182 (s+10) (s+2.281) (s+0.2192)\n-----------------------------------\n\
    (s+3.419) (s^2 + 1.763s + 1.064)\n```\n\nThe following example builds a second-order\
    \ transfer function with damping factor 0.4 and natural frequency 2.4 rad/sec.\n\
    \n```\n>> [num,den] = ord2(2.4,0.4)\n\nnum =\n     1\n\nden =\n    1.0000    1.9200\
    \    5.7600\n\n>> sys = tf(num,den)\n\nTransfer function:\n       1\n-------------------\n\
    s^2 + 1.92 s + 5.76\n```"
