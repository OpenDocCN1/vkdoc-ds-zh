    | `[r, p, k] = residue(b,a)` `[b,a] = residue(r,p,k)` | Finds the residues, poles,
    and direct term of a partial fraction expansion of the ratio of two polynomials,
    `b(s)` and `a(s)`, where `b` and `a` are the vectors listing the numerator and
    denominator coefficients, respectively. Converts the partial fraction expansion
