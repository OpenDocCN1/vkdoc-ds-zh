    \      uc       u1\n   x1        4        0\n   x2        0   -0.076\n   x3  \
    \      0   -1.501\n   x4        0  -0.5739\n\nc =\n            x1       x2   \
    \    x3       x4\n   y1  -0.2215   -5.682    5.657  -0.1253\n   y2   0.4646  \
    \ -8.483    11.36   0.2628\n\nd =\n            uc       u1\n   y1        0   -0.662\n\
    \   y2        0  -0.4058\n\nContinuous-time model.\n```\n\n### 练习 3-8\n\n绘制下面定义的二阶状态空间模型的单位脉冲响应，并将结果存储在一个包含输出响应和仿真时间的数组中。\n\
    \n![A978-1-4842-0289-0_3_Figaz_HTML.jpg](img/A978-1-4842-0289-0_3_Figaz_HTML.jpg)\n\
    \n模型定义如下：\n\n通过使用以下语法获得所请求的图（见图 3-31）：\n\n```\n>> a = [-0.5572 -0.7814;0.7814\
    \  0];\nb = [1 -1;0 2];\nc = [1.9691  6.4493];\nsys = ss(a,b,c,0);\nimpulse (sys)\n\
    ```\n\n输出响应和仿真时间使用以下语法获得：\n\n```\n>> [y t] = impulse (sys)\ny(:,:,1) =\n1.9691\n\
    2.6831\n3.2617\n3.7059\n4.0197\n4.2096\n      .\n      .\ny(:,:,2) =\n10.9295\n\
    9.4915\n7.9888\n6.4622\n4.9487\n      .\n      .\n```\n\n![A978-1-4842-0289-0_3_Fig31_HTML.jpg](img/A978-1-4842-0289-0_3_Fig31_HTML.jpg)\n\
    \n**图 3-31。**\n\n### 练习 3-9\n\n绘制并仿真下面定义的传递函数 `H(s)` 的系统对周期为 4 秒的方波信号的响应，分别每 0.1\
    \ 秒和每 10 秒采样一次。\n\n![A978-1-4842-0289-0_3_Figaaa_HTML.jpg](img/A978-1-4842-0289-0_3_Figaaa_HTML.jpg)\n\
    \n我们首先使用 `gensig` 生成方波信号，然后使用 `lsim` 执行仿真（见图 3-32），如下所示：\n\n```\n>> [u,t] = gensig('square',4,10,0.1);\n\
    >> H = [tf([2 5 1],[1 2 3]) ; tf([1 -1],[1 1 5])]\nlsim(H,u,t)\n\nTransfer function\
    \ from input to output...\n    2 s ^ 2 + 5 s + 1\n#1:  ---------------\n     s\
    \ ^ 2 + 2 s + 3\n          s 1\n#2:  -----------\n    s ^ 2 + s + 5\n```\n\n![A978-1-4842-0289-0_3_Fig32_HTML.jpg](img/A978-1-4842-0289-0_3_Fig32_HTML.jpg)\n\
    \n**图 3-32。**\n"
- fmt: '# 4. Robust Predictive Control


    ## Predictive Control Strategies: The Model Predictive Control Toolbox


    The Model Predictive Control Toolbox is a complete set of tools which can be used
    to implement model predictive control strategies. Model predictive control strategies
    are often used in chemical engineering and in other industries.


    The most important characteristics of this toolbox are:


    - Modeling, identification and validation.

    - Support for MISO, MIMO, step response and state-space models.

    - Analysis of systems.

    - Conversion between state-space, transfer function and step response models.


    Model predictive control approximates a linear dynamic plant model to predict
    future changes and the effect of manipulating variables. The online optimization
    problem is formulated as a quadratic program which is resolved repeatedly using
    the most recent measurements.


    The Model Predictive Control Toolbox includes more than 50 specialized MATLAB
    functions which help you to design, analze and simulate dynamical systems using
    a model predictive control approach. The toolbox supports finite step (or impulse)
    response, discrete and continuous-time transfer function and state-space formats.
    The toolbox handles non-square systems and supports a wide variety of state estimation
    techniques. Simulation tools test systems response with or without restrictions.
    For the identification of models, the toolbox has an interface that makes it easy
    to use models developed using the system identification toolbox.


    ### ID Commands


    | `[mx, ax, stdx] = autosc (x) sx = scal(x,mx) sx = scal(x,mx,stdx) rx = rescal(x,mx)
    rx = rescal(x,mx,stdx)` | Scales an input matrix or vector `x` by its column means
    (`mx`) and standard deviations (`stdx`) automatically and outputs `mx` and `stdx`
    as options. By using `scal`, the input can also be scaled by some specified means
    and/or standard deviations. `rescal` converts scaled data back to the original
    data. |

    | `plant = imp2step(delt,nout,theta1, theta2,…, theta25)` | Builds a MIMO (multi-input
    multi-output) model in MPC step format. Each `thetai` is an `n×m` matrix corresponding
    to the impulse response coefficients for output `i`. `n` is the number of the
    coefficients and `m` is the number of inputs. `delt` is the sampling interval
    used for obtaining the impulse response coefficients. `nout` is the output stability
    indicator. |

    | `[theta, yres] = mlr (xreg, yreg, ninput) [theta, yres] = mlr (xreg yreg, ninput,
    plotopt, wtheta, wdeltheta)` | Determines impulse response coefficients for a
    multi-input single-output system via Multivariable Least Squares Regression or
    Ridge Regression. `xreg` and `yreg` are the input matrix and output vector produced
    by routines such as `wrtreg`. `ninput` is number of inputs. Least Squares is used
    to determine the impulse response coefficient matrix, `theta`. Columns of `theta`
    correspond to impulse response coefficients from each input. Optional output `yres`
    is the vector of residuals, the difference between the actual outputs and the
    predicted outputs. Optional inputs include `plotopt`, `wtheta`, and `wdeltheta`.
    No plot is produced if `plotopt` is equal to 0 which is the default; a plot of
    the actual output and the predicted output is produced if `plotopt=1`; two plots
    -- plot of actual and predicted output, and plot of residuals -- are produced
    for `plotopt=2`. Penalties on the squares of `theta` and the changes in `theta`
    can be specified through the scalar weights `wtheta` and `wdeltheta`, respectively
    (defaults are 0). |

    | `[theta, yres, w, cw, ssqdif] = plsr(xreg,yreg,ninput,lv) [theta, yres, w, cw,
    ssqdif] = plsr(xreg,yreg,ninput,lv, plotopt)` | Determines the impulse response
    coefficients for a multi-input single-output system via Partial Least Squares
    (PLS). |

    | `yres = validmod (xreg, yreg, theta) yres = validmod (xreg yreg, theta, plotopt)`
    | Validates an impulse response model for a new set of data. |

    | `[xreg, yreg] = wrtreg (x, y, n)` | Writes input and output data matrices for
    a multi-input single-output system so that they can be used in regression routines
    `mlr` and `pls` for determining impulse response coefficients. |


    ### Information Matrix Plotting Commands


    | `mpcinfo(mat)` | Returns information about the type and size of the matrix `mat`.
    |

    | `plotall(y,u) plotall(y,u,t)` | Plots outputs and manipulated variables from
    a simulation. Input variables `y` and `u` are matrices of outputs and manipulated
    variables, respectively. (`t` = period). |

    | `plotfrsp(vmat) plotfrsp(vmat,out,in)` | Plots the frequency response generated
    by `mod2frsp` as a Bode plot. `vmat` is the array containing the data. |

    | `ploteach(y) ploteach(y, u) ploteach([ ], u) ploteach(y, [], t) ploteach([],
    u, t) ploteach(y, u, t)` | Plots outputs and manipulated variables from a simulation
    on separate graphs. Input variables `y` and `u` are matrices of outputs and manipulated
    variables, respectively. (`t` = period). |

    | `plotstep(plant) plotstep(plant,opt)` | Plots multiple step responses. `plant`
    is a step-response matrix in the MPC step format created by `mod2step`, `ss2step`
    or `tfd2step`. `opt` is an optional scalar or row vector that allows you to select
    the outputs to be plotted. |


    ### Model Conversion Commands


    | `c2dmp` | Converts a state-space model from continuous-time to discrete-time.
    (Equivalent to `c2d` in the Control System Toolbox) |

    | `[numd,dend] = cp2dp(num,den,delt) [numd,dend] = cp2dp(num,den,delt,delay)`
    | Converts a single-input-single-output, continuous-time transfer function in
    standard MATLAB polynomial form (including an optional time delay) to a sampled-data
    transfer function. (`delt` is the sampling period and `delay` is the time delay.)
    |

    | `d2cmp` | Converts a state-space model from discrete-time to continuous-time.
    (Equivalent to `d2c` in the Control System Toolbox.) |

    | `newmod = mod2mod (oldmod, delt2)` | Changes the sampling period of a model
    in MPC mod format. `oldmod` is the existing model in MPC mod format. `delt2` is
    the new sampling period for the model. |

    | `[phi,gam,c,d] = mod2ss(mod) [phi,gam,c,d,minfo] = mod2ss(mod)` | Extracts the
    standard discrete-time state-space matrices and other information from a model
    stored in the MPC mod format. |

    | `plant = mod2step(mod,tfinal) [plant,dplant] = mod2step(mod,tfinal,delt2,nout)`
    | Uses a model in the mod format to calculate the step response of a SISO or MIMO
    system in MPC step format. |

    | `g = poly2tfd(num,den) g = poly2tfd(num,den,delt,delay)` | Converts a transfer
    function (continuous or discrete) from the standard MATLAB poly format into the
    MPC tf format. |

    | `pmod = ss2mod(phi,gam,c,d) pmod = ss2mod(phi,gam,c,d,minfo)` | Converts a discrete-time
    state-space system model into the MPC mod format. |

    | `plant = ss2step(phi,gam,c,d,tfinal) plant = ss2step(phi,gam,c,d,tfinal,delt1,delt2,nout)`
    | Uses a model in state-space format to calculate the step response of a SISO
    or MIMO system, in MPC step format. |

    | `ss2tf2` | Converts state-space model to transfer function. (Equivalent to `ss2tf`
    in the Control System Toolbox.) |

    | `tf2ssm` | Converts a transfer function to a state-space model. (Equivalent
    to `tf2ss` in the Control System Toolbox.) |

    | `model = tfd2mod(delt2,ny,g1,g2,g3,…,g25)` | Converts a transfer function (continuous
    or discrete) from the MPC tf format into the MPC mod format, converting to discrete
    time if necessary. |

    | `plant = tfd2step(tfinal,delt2,nout,g1) plant = tfd2step(tfinal,delt2,nout,g1,…,g25)`
    | Calculates the MIMO step response of a model in the MPC tf format. The resulting
    step response is in the MPC step format. |

    | `umod = th2mod(th) [umod,emod] = th2mod(th1,th2,…,thN)` | Converts a SISO or
    MISO model from the theta format (as used in the System Identification Toolbox)
    to one in the MPC mod format. Can also combine such models to form a MIMO system.
    |'
