  trans: "\n### 用于模型互联的命令\n\n![A978-1-4842-0289-0_3_Fig20_HTML.jpg](img/A978-1-4842-0289-0_3_Fig20_HTML.jpg)\n\
    \n图 3-20.\n\n![A978-1-4842-0289-0_3_Fig19_HTML.jpg](img/A978-1-4842-0289-0_3_Fig19_HTML.jpg)\n\
    \n图 3-19.\n\n![A978-1-4842-0289-0_3_Fig18_HTML.jpg](img/A978-1-4842-0289-0_3_Fig18_HTML.jpg)\n\
    \n图 3-18.\n\n![A978-1-4842-0289-0_3_Fig17_HTML.jpg](img/A978-1-4842-0289-0_3_Fig17_HTML.jpg)\n\
    \n图 3-17.\n\n![A978-1-4842-0289-0_3_Fig16_HTML.jpg](img/A978-1-4842-0289-0_3_Fig16_HTML.jpg)\n\
    \n图 3-16.\n\n![A978-1-4842-0289-0_3_Fig15_HTML.jpg](img/A978-1-4842-0289-0_3_Fig15_HTML.jpg)\n\
    \n图 3-15.\n\n| 命令 | 描述 |\n| --- | --- |\n| `sys = append(sys1,sys2,...,sysN)`\
    \ | 以对角配置块的方式组合模型。通过追加各个模型的输入输出来将它们分组（图 3-15）。 |\n| `asys = augstate(sys)` | 将状态向量追加到输出向量。\
    \ |\n| `sysc = connect(sys,Q,inputs,outputs)` | 根据选定的互联方案（由连接矩阵`Q`给出）连接块中的子系统。\
    \ |\n| `sys = feedback(sys1,sys2)` `sys = feedback(sys1,sys2,sign)` `sys = feedback(sys1,sys2,feedin,feedout,sign)`\
    \ | 返回模型`sys`，用于模型`sys1`和`sys2`的负反馈互联（见图 3-16）。可包含`sign`和闭环（见图 3-17）。 |\n| `sys\
    \ = lft(sys1,sys2)` `sys = lft(sys1,sys2,nu,ny)` | 构成两个模型的线性分式变换（LFT）（见图 3-18）。\
    \ |\n| `[A,B,C,D] = ord2(wn,z)` `[num,den] = ord2(wn,z)` | 生成连续二阶系统（`wn`为自然频率，`z`为阻尼因子）。\
    \ |\n| `sys = parallel(sys1,sys2)` `sys = parallel(sys1,sys2,inp1,inp2,out1,out2)`\
    \ | 并联连接两个系统（见图 3-19）。 |\n| `sys = series(sys1,sys2)` `sys = series(sys1,sys2,outputs1,inputs2)`\
    \ | 串联连接两个系统（见图 3-20）。 |\n| `sys = stack(arraydim,sys1,sys2,...)` | 通过沿数组维度`arraydim`堆叠模型`sys1，sys2，...`，生成一个动态系统模型的数组。\
    \ |\n\n作为第一个示例，我们将组合系统`tf(1, [1 0])`和`ss(1,2,3,4)`。需要记住的是，对于传递函数分别为 H1、H2、...、Hn\
    \ 的系统，合成后的系统传递函数为：\n\n![A978-1-4842-0289-0_3_Figaa_HTML.jpg](img/A978-1-4842-0289-0_3_Figaa_HTML.jpg)\n\
    \n对于由 (A[1]， B[1], C[1], D[1]) 和 (A[2]， B[2], C[2], D[2]) 定义的两个系统 `sys1` 和 `sys2`，它们的组合\
    \ `append(sys1, sys2)` 生成如下系统：\n\n![A978-1-4842-0289-0_3_Figab_HTML.jpg](img/A978-1-4842-0289-0_3_Figab_HTML.jpg)\n\
    \n![A978-1-4842-0289-0_3_Figac_HTML.jpg](img/A978-1-4842-0289-0_3_Figac_HTML.jpg)\n\
    \n对于我们的示例：\n\n```\n>> sys1 = tf(1,[1 0])\nsys2 = ss(1,2,3,4)\nsys = append(sys1,10,sys2)\n\
    \n传递函数：\n1\n-\ns\n\na =\nx1\nx1   1\n\nb =\n    u1\nx1   2\n\nc =\n    x1\ny1\
    \   3\n\nd =\n    u1\ny1   4\n\n连续时间模型。\n\na =\n    x1  x2\nx1   0   0\nx2   0\
    \   1\n\nb =\n    u1  u2  u3\nx1   1   0   0\nx2   0   0   2\n\nc =\n    x1  x2\n\
    y1   1   0\ny2   0   0\ny3   0   3\n\nd =\n    u1  u2  u3\ny1   0   0   0\ny2\
    \   0  10   0\ny3   0   0   4\n\n连续时间模型。\n```\n\n下面的示例，如图 3-21 所示，使用负反馈将被控对象 `G(s)`\
    \ 连接到下面定义的驱动器 `H(s)`：\n\n![A978-1-4842-0289-0_3_Figad_HTML.jpg](img/A978-1-4842-0289-0_3_Figad_HTML.jpg)\n\
    \n![A978-1-4842-0289-0_3_Figae_HTML.jpg](img/A978-1-4842-0289-0_3_Figae_HTML.jpg)\n\
    \n![A978-1-4842-0289-0_3_Fig21_HTML.jpg](img/A978-1-4842-0289-0_3_Fig21_HTML.jpg)\n\
    \n图 3-21.\n\n```\n>> G = tf([2 5 1],[1 2 3],'inputname','torque',...\n       \
    \  'outputname','velocity');\nH = zpk(-2,-10,5)\nCloop = feedback(G,H)\n\n零极点/增益：\n\
    5 (s+2)\n-------\n(s+10)\n\n从输入 \"torque\" 到输出 \"velocity\" 的零极点/增益：\n0.18182\
    \ (s+10) (s+2.281) (s+0.2192)\n-----------------------------------\n(s+3.419)\
    \ (s² + 1.763s + 1.064)\n```\n\n下面的示例构建了一个阻尼因子为 0.4、自然频率为 2.4 rad/sec 的二阶传递函数。\n\
    \n```\n>> [num,den] = ord2(2.4,0.4)\n\nnum =\n     1\n\nden =\n    1.0000    1.9200\
    \    5.7600\n\n>> sys = tf(num,den)\n\n传递函数：\n       1\n-------------------\n\
    s² + 1.92 s + 5.76\n```\n"
- fmt: '### Response Time Commands


    | Command | Description |

    | --- | --- |

    | `[u, t] = gensig(type, tau)`<br>`[u, t] = gensig(type, tau, Tf, Ts)` | Generates
    a scalar signal `u` of class `type` and with period `tau` (in seconds). The `type`
    can be `sine`, `square` or `pulse`. Also specifies the time duration `Tf` of the
    signal and the spacing `Ts` between the time samples `t`. |

    | `impulse(sys)`<br>`impulse(sys, t)`<br>`impulse(sys1, sys2, ..., sysN)`<br>`impulse(sys1,
    sys2, ..., sysN, t)`<br>`impulse(sys1, ''PlotStyle1'', ..., sysN, ''PlotStyleN'')`<br>`[y,
    t, x] = impulse(sys)` | Calculates and plots the impulse response of the model
    `sys`. Uses the user-supplied time vector `t` for simulation. Calculates and plots
    the impulse response of several models. Calculates and plots the impulse response
    of several models using the user-supplied time vector `t` for simulation. In addition
    sets graphics styles. Returns the length of `t`, the number of outputs and the
    number of inputs for the impulse response of the model `sys`. |

    | `initial(sys, x0)`<br>`initial(sys, x0, t)`<br>`initial(sys1, sys2, ..., sysN,
    x0)`<br>`initial(sys1, sys2, ..., sysN, x0, t)`<br>`initial(sys1, ''PlotStyle1'',
    ..., sysN, ''PlotStyleN'', x0)`<br>`[y, t, x] = initial(sys, x0)` | Calculates
    and plots the unforced response of the state-space model `sys`, or of several
    models, with initial condition `x0`. A user-supplied time vector `t` can be supplied
    as well as specified graphics styles. You can also obtain the length of `t`, the
    number of outputs and the number of inputs for the unforced response of the model
    `sys`. |

    | `lsim(sys, u, t)`<br>`lsim(sys, u, t, x0)`<br>`lsim(sys, u, t, x0, ''zoh'')`<br>`lsim(sys,
    u, t, x0, ''foh'')`<br>`lsim(sys1, sys2, ..., sysN, u, t)`<br>`lsim(sys1, sys2,
    ..., sysN, u, t, x0)`<br>`lsim(sys1, ''PlotStyle1'', ..., sysN, ''PlotStyleN'',
    u, t)`<br>`[y, t, x] = lsim(sys, u, t, x0)` | Calculates and plots the time response
    of the state-space model `sys`, or of several models, with initial condition `x0`.
    A user-supplied time sample `t` can be supplied as well as specified graphics
    styles. The options `zoh` and `foh` specify how the input values should be interpolated
    between samples (zero-order hold or linear interpolation, respectively). You can
    also obtain the output response `y`, the time vector `t` used for simulation,
    and the state trajectories `x`. |

    | `step(sys)`<br>`step(sys, t)`<br>`step(sys1, sys2, ..., sysN)`<br>`step(sys1,
    sys2, ..., sysN, t)`<br>`step(sys1, ''PlotStyle1'', ..., sysN, ''PlotStyleN'')`<br>`[y,
    t, x] = step(sys)` | Calculates and plots the step response of the LTI model `sys`,
    or several models. A user-supplied time sample `t` can be supplied as well as
    specified graphics styles. You can also obtain the output response `y`, the time
    vector `t` used for simulation, and the state trajectories `x`. |

    | `ltiview`<br>`ltiview(sys1, sys2, ..., sysn)`<br>`ltiview(''plottype'', sys1,
    sys2, ..., sysn)`<br>`ltiview(''plottype'', sys, extras)`<br>`ltiview(''clear'',
    viewers)`<br>`ltiview(''current'', sys1, sys2, ..., sysn, viewers)` | Opens an
    LTI Viewer for LTI system response analysis for one or more systems and with different
    graphics options defined by `plottype` (`''step''`, `''impulse''`, `''initial''`,
    `''lsim''`, `''pzmap''`, `''bode''`, `''nyquist''`, `''nichols''` and `''sigma''`).
    |


    As a first example we generate and plot a square signal with period 5 seconds,
    duration 30 seconds and sampling every 0.1 seconds (see Figure [3-22](#A978-1-4842-0289-0_3_Chapter.html#Fig22)).


    ```

    >> [u,t] = gensig(''square'',5,30,0.1);

    >> plot(t,u)

    axis([0 30-1 2])

    ```


    ![A978-1-4842-0289-0_3_Fig22_HTML.jpg](A978-1-4842-0289-0_3_Fig22_HTML.jpg)


    Figure 3-22.


    In the example below we generate the response plot for the following state-space
    model (see Figure [3-23](#A978-1-4842-0289-0_3_Chapter.html#Fig23)):


    ![A978-1-4842-0289-0_3_Figaf_HTML.jpg](A978-1-4842-0289-0_3_Figaf_HTML.jpg)


    ![A978-1-4842-0289-0_3_Figag_HTML.jpg](A978-1-4842-0289-0_3_Figag_HTML.jpg)


    with initial conditions


    ![A978-1-4842-0289-0_3_Figah_HTML.jpg](A978-1-4842-0289-0_3_Figah_HTML.jpg)


    ```

