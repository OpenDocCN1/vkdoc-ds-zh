    | `sys = tf(num,den,Ts, p1,v1,p2,v2,...)` | 创建离散时间传递函数，具有指定分子和分母，采样时间为 `Ts` 秒，其属性由属性/值对
    (`pi, vi`) 指定。 |

    | `s = tf(''s'')` `z = tf(''z'',Ts)` | 使用拉普拉斯变量 `s` 的有理函数指定一个 TF 模型。使用离散时间变量 `z`
    的有理函数指定一个采样时间为 `Ts` 的 TF 模型。 |

    | `tfsys = tf(sys)` `tfsys = tf(sys,''inv'')` | 将（TF 或 ZPK）模型 `sys` 转换为传递函数。使用反演公式将（TF
    或 ZPK）模型 `sys` 转换为传递函数。 |

    | `[num,den] = tfdata(sys)` `[num,den] = tfdata(sys,''v'')` `[num,den,Ts] = tfdata(sys)`
    | 返回类型为 TF、SS 或 ZPK 的 `sys` 传递函数模型的分子和分母。以行向量的形式返回分子和分母。除上述内容外，还返回采样时间 `Ts`。 |

    | `TD = totaldelay (sys)` | 给出 LTI 模型 `sys` 的输入/输出总滞后时间。 |

    | `sys = zpk (z, p, k)` `sys = zpk (z, p, k, Ts)` `sys = zpk(M)` `sys = zpk(z,p,k,ltisys)`
    | 创建连续时间零极点增益模型，具有零点 `z`、极点 `p` 和增益 `k`。创建离散时间零极点增益模型，具有零点 `z`、极点 `p`、增益 `k` 和采样时间
    `Ts` 秒。指定一个静态增益 `M`。创建连续时间零极点增益模型，具有零点 `z`、极点 `p` 和增益 `k`，其通用属性继承自 LTI 模型 `ltisys`。
    |

    | `sys = zpk(z,p,k,p1,v1,p2,v2,...)` | 创建连续时间零极点增益模型，具有零点 `z`、极点 `p` 和增益 `k`，其属性由属性/值对
    (`pi, vi`) 指定。 |

    | `sys = zpk(z,p,k,Ts,p1,v1,p2,v2,..)` | 创建离散时间零极点增益模型，具有零点 `z`、极点 `p`、增益 `k`
    和采样时间 `Ts`，其属性由属性/值对 (`pi, vi`) 指定。 |

    | `sys = zpk(''s'')` `sys = zpk(''z'',Ts)` | 使用拉普拉斯变量 `s` 的有理函数指定一个连续时间零极点增益模型。使用离散时间变量
    `z` 的有理函数指定一个离散时间零极点增益模型。 |

    | `zsys = zpk(sys)` `zsys = zpk(sys,''inv'')` | 将 LTI 模型 `sys` 转换为零极点增益模型。使用反演公式将
    LTI 模型 `sys` 转换为零极点增益模型。 |

    | `[z,p,k] = zpkdata(sys)` `[z,p,k] = zpkdata(sys,''v'')` `[z,p,k,Ts,Td] = zpkdata(sys)`
    | 返回模型 `sys` 的零点 `z`、极点 `p` 和增益 `k`。以列向量的形式返回模型 `sys` 的零点 `z`、极点 `p` 和增益 `k`。除上述内容外，还返回采样时间
    `Ts` 和输入滞后时间 `Td`。 |

