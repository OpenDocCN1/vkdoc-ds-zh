- fmt: '### Model Building Commands - MPC Mod Format


    | `model = addmd (pmod, dmod)` | Adds one or more measured disturbances to a plant
    model in the MPC mod format. |

    | `pmod = addmod (mod1, mod2)` | Combines two models in the MPC mod format such
    that the output of one combines with the manipulated inputs of the other. |

    | `model = addumd (pmod, dmod)` | Adds one or more unmeasured disturbances to
    a plant model in MPC mod format. |

    | `pmod = appmod (mod1, mod2)` | Appends two models to form a composite model
    that retains the inputs and outputs of the original models. |

    | `pmod = paramod (mod1, mod2)` | Puts two models in parallel by connecting their
    outputs. |

    | `pmod = sermod (mod1, mod2)` | Puts two models in series by connecting the output
    of one to the input of the other. |


    ### Control Design and Simulation Commands - MPC Step Format


    | `yp = cmpc(plant,model,ywt,uwt,M,P,tend,r) [yp,u,ym] = cmpc(plant,model,ywt,uwt,M,P,tend,...)`
    | Simulates closed-loop systems with hard bounds on manipulated variables and/or
    outputs using models in the MPC step format. Solves the MPC optimization problem
    by quadratic programming. |

    | `[clmod] = mpccl(plant,model,Kmpc) [clmod,cmod] = mpccl(plant,model,Kmpc,tfilter,…
    dplant, dmodel)` | Combines a plant model and a controller model in MPC step format,
    yielding a closed-loop system model in the MPC mod format. |

    | `KMPC = mpccon (model) KMPC = mpccon (model, ywt uwt, M, P)` | Calculates MPC
    controller gain using a model in MPC step format. |

    | `yp = mpcsim(plant,model,Kmpc,tend,r) [yp,u,ym] = mpcsim(plant,model,Kmpc,tend,r,usat,…
    tfilter, dplant, dmodel, dstep)` | Simulates closed-loop systems with saturation
    constraints on the manipulated variables using models in the MPC step format.
    |

    | `nlcmpc` | Model predictive controller for simulating closed-loop systems with
    hard bounds on manipulated variables and/or controlled variables using linear
    models in the MPC step format for nonlinear plants represented as Simulink S-functions.
    |

    | `nlmpcsim` | Model predictive controller for simulating closed-loop systems
    with saturation constraints on the manipulated variables using linear models in
    the MPC step format for nonlinear plants represented as Simulink S-functions.
    |


    ### Control Design and Simulation Commands - MPC Mod Format


    | `yp = scmpc(pmod,imod,ywt,uwt,M,P,tend,r) [yp,u,ym] = scmpc(pmod,imod,ywt,uwt,M,P,tend,
    … r,ulim,ylim,Kest,z,d,w,wu)` | Simulates closed-loop systems with hard bounds
    on manipulated variables and/or outputs using models in the MPC mod format. Solves
    the MPC optimization problem by quadratic programming. |

    | `[clmod,cmod] = smpccl(pmod,imod,Ks) [clmod,cmod] = smpccl(pmod,imod,Ks,Kest)`
    | Combines a plant model and a controller model in the MPC mod format, yielding
    a closed-loop system model in the MPC format. |

    | `Ks = smpccon(imod) Ks = smpccon(imod,ywt,uwt,M,P)` | Calculates MPC controller
    gain using a model in MPC mod format. |

    | `[Kest] = smpcest(imod,Q,R)` | Sets up a state-estimator gain matrix for use
    with MPC controller design and simulation routines using models in MPC mod format.
    |

    | `yp = smpcsim(pmod,imod,Ks,tend,r) [yp,u,ym] = smpcsim(pmod,imod,Ks,tend,r,usat,…
    Kest, z, d, w, wu)` | Simulates closed-loop systems with saturation constraints
    on the manipulated variables using models in the MPC mod format. |


    ### Script Analysis Commands


    | `frsp = mod2frsp(mod,freq) [frsp,eyefrsp] = mod2frsp(mod,freq,out,in,balflg)`
    | Calculates the complex frequency response of a system in MPC mod format. |

    | `g = smpcgain(mod) poles = smpcpole(mod)` | Calculates the steady-state gain
    matrix or poles for a system in the MPC mod format. |

    | `[sigma, omega] = svdfrsp (vmat)` | Calculates the singular values of a varying
    matrix, for example, the frequency response generated by `mod2frsp`. |


    ## Robust Control Systems: The Robust Control Toolbox


    The Robust Control Toolbox provides tools for the design and analysis of robust
    multivariate control systems. It includes systems in which it is possible to model
    errors, and dynamic systems with uncertain elements or with parameters that can
    vary during the life of the product. The powerful algorithms included in this
    toolbox allow you to run complex calculations, allowing for a large number of
    variations in the parameters.


    The most important characteristics of this toolbox are:


    *   H² and H∞ control based on LQG (synthesis).

    *   Multivariate frequency response.

    *   Construction of state-space models.

    *   Unique values based on model conversion.

    *   Reduction of high-order models.

    *   Spectral and inner-outer factorization.


    ### Optional Data Structure System Commands


    | `[b1,b2,…,bn] = branch(tr,PATH1,PATH2,…,PATHN)` | Recovers the matrices packed
    in a `mksys` or tree variable selectively. The branches returned are determined
    by the paths `PATH1`, `PATH2`,…, `PATHN`. |

    | `TR = graft(TR1,B) TR = graft(TR1,B,NM)` | Adds root branch `B` onto a tree
    variable `TR1` (previously created by `tree` or `mksys`). If `TR1` has N branches,
    then the numerical index of the new branch is N+1; and the numerical indices of
    other root branches are unchanged. |

    | `[i,TY,N] = issystem(S)` | Returns a value for `i` of either 1 (true) or 0 (false)
    depending on whether or not the variable `S` is a system created by the function
    `mksys`. Also returned is the type of system `TY` and the number `N` of variable
    names associated with a system of type `TY`, except that if `S` is not a system
    then `TY = [ ];` and `N = 0`. |

    | `[i] = istree(T) [i,b] = istree(T,path)` | Checks whether a variable `T` is
    a tree or not. When the second input argument `path` is present, the function
    `istree` checks the existence of the branch specified by `path`. |

    | `S = mksys(a,b,c,d) S = mksys(v1,v2,v3,vn, TY)` | Packs several matrices describing
    a system of type `TY` into a MATLAB variable `S`, under "standard" variable names
    determined by the value of the string `TY`. |

    | `T = tree(nm,b1,b2,bn)` | Creates a tree data structure `T` containing several
    variables and their names. |

    | `[VARS,N] = vrsys(NAM)` | Returns a string `VARS` and an integer `N` where `VARS`
    contains the list (separated by commas) of the N names of the matrices associated
    with a system described by the string name `NAM`. |


    ### Modeling Commands


    | `[a,b1,b2,c1,c2,d11,d12,d21,d22] = … augss(ag,bg,aw1,bw1,aw2,bw2,aw3,bw3) [a,b1,b2,c1,c2,d11,d12,d21,d22]
    = … augss(ag,bg,aw1,bw1,aw2,bw2,aw3,bw3,w3poly) [a,b1,b2,c1,c2,d11,d12,d21,d22]
    = … augtf(ag,bg,cg,dg,w1,w2,w3) [tss] = augss(ssg,ssw1,ssw2,ssw3,w3poly) [tss]
    = augtf(ssg,w1,w2,w3) [tss] = augss(ssg,ssw1,ssw2,ssw3)` | State-space or transfer
    function plant augmentation for use in weighted mixed-sensitivity H² and H∞ design.
    |

    | `[acl,bcl,ccl,dcl] = interc(a,b,c,d,m,n,f) [sscl] = interc(ss,m,n,f)` | Multivariate
    general interconnection of systems. |'
