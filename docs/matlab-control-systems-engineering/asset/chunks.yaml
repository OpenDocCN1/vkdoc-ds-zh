    ## Exercise 2-7


    Generate a square matrix of order 4 whose elements are uniformly distributed random
    numbers from [0,1]. Generate another square matrix of order 4 whose elements are
    normally distributed random numbers from [0,1]. Find the present generating seeds,
    change their value to 1/2 and rebuild the two arrays of random numbers.


    ```

    >> rand (4)

    ans =

