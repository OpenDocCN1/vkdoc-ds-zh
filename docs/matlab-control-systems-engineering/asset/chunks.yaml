    ### Random Numbers


    MATLAB can easily generate (pseudo) random numbers. The function rand generates
    uniformly distributed random numbers and the function randn generates normally
    distributed random numbers. The most interesting features of MATLAB’s random number
    generator are presented in the following table.


    | rand | Returns a uniformly distributed random decimal number from the interval
    [0,1]. |

    | rand (n) | Returns an array of size n×n whose elements are uniformly distributed
    random decimal numbers from the interval [0,1]. |

    | rand (m, n) | Returns an array of dimension m×n whose elements are uniformly
    distributed random decimal numbers from the interval [0,1]. |

    | rand (size (a)) | Returns an array of the same size as the matrix A and whose
    elements are uniformly distributed random decimal numbers from the interval [0,1].
    |

    | rand (‘seed’) | Returns the current value of the uniform random number generator
    seed. |

    | rand(‘seed’,n) | Assigns to n the current value of the uniform random number
    generator seed. |

    | randn | Returns a normally distributed random decimal number (mean 0 and variance
    1). |

    | randn (n) | Returns an array of dimension n×n whose elements are normally distributed
    random decimal numbers (mean 0 and variance 1). |

    | randn (m, n) | Returns an array of dimension m×n whose elements are normally
    distributed random decimal numbers (mean 0 and variance 1). |

    | randn (size (a)) | Returns an array of the same size as the matrix A and whose
