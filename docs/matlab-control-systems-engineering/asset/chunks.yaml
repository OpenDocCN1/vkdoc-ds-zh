    sine, square or pulse. Also specifies the time duration Tf of the signal and the
    spacing Ts between the time samples t. |

    | impulse(sys) impulse(sys,t) impulse(sys1,sys2,...,sysN) impulse(sys1,sys2,...,sysN,t)
    impulse(sys1,‘PlotStyle1’,...,sysN,‘PlotStyleN’) [y, t, x] = impulse(sys) | Calculates
    and plots the impulse response of the model sys. Uses the user-supplied time vector
    t for simulation. Calculates and plots the impulse response of several models.
    Calculates and plots the impulse response of several models using the user-supplied
    time vector t for simulation. In addition sets graphics styles. Returns the length
    of t, the number of outputs and the number of inputs for the impulse response
    of the model sys. |

    | initial(sys,x0) initial(sys,x0,t) initial(sys1,sys2,...,sysN,x0) initial(sys1,sys2,...,sysN,x0,t)
    initial(sys1,‘PlotStyle1’,...,sysN,‘PlotStyleN’,x0) [y, t, x] = initial(sys,x0)
    | Calculates and plots the unforced response of the state-space model sys, or
    of several models, with initial condition x0\. A user-supplied time vector t can
    be supplied as well as specified graphics styles. You can also obtain the length
    of t, the number of outputs and the number of inputs for the unforced response
    of the model sys. |

