    \n![A978-1-4842-0289-0_3_Figz_HTML.jpg](A978-1-4842-0289-0_3_Figz_HTML.jpg)\n\n\
    ```\n>> H = tf([2 -3.4 1.5],[1 -1.6 0.8],-1)\nTransfer function:\n2 z^2 - 3.4\
    \ z + 1.5\n-------------------\nz^2 - 1.6 z + 0.8\nSampling time: unspecified\n\
    >> rlocus(H)\n>> zgrid\n>> axis('square')\n```\n\n![A978-1-4842-0289-0_3_Fig14_HTML.jpg](A978-1-4842-0289-0_3_Fig14_HTML.jpg)\n\
    \nFigure 3-14.\n\nFigure 3-14"
  raw: '### Commands for Dynamic Models


    | Command | Description |

    | --- | --- |

    | [Wn,Z] = damp(sys) [Wn,Z,P] = damp(sys) | Displays a table of the damping ratio,
    natural frequency, and time constant of the poles of the linear model sys. You
    can also get the vector P of the poles of sys. |

    | k = dcgain(sys) | Calculates the low-frequency (DC) gain of the model sys. |

    | [P,Q] = covar(sys,W) | Calculates the stationary covariance of the output of
    an LTI model sys driven by Gaussian white noise inputs W. P is the steady-state
    output response covariance and Q is the steady-state state covariance. |

    | s = dsort(p) [s,ndx] = dsort(p) | Sorts the discrete-time poles contained in
    the vector p in descending order by magnitude. |

    | s = esort(p) [s,ndx] = esort(p) | Sorts the continuous-time poles contained
    in the vector p by real part. |

    | norm(sys) norm(sys,2) norm(sys,inf) norm(sys,inf,tol) [ninf,fpeak] = norm(sys)
    | Calculates the H ² norm of the model sys. Calculates the H ² norm of the model
    sys. Calculates the H [∞] norm of the model sys. Calculates the H [∞] norm of
    the model sys with tolerance tol. Calculates, in addition to the H [∞] norm, the
    frequency fpeak at which the gain reaches its peak value. |

    | p = pole(sys) d = eig(A) d = eig(A,B) [V,D] = eig(A) [V,D] = eig(A,‘nobalance’)
    [V,D] = eig(A,B) [V,D] = eig(A,B,flag) | Calculates the poles of the LTI model
    sys. Returns the vector of eigenvalues of A. Returns the generalized eigenvalues
    of the pair(A,B). Returns the eigenvalues and eigenvectors of the matrix A. Returns
    the eigenvalues and eigenvectors of A without a preliminary balancing step. Returns
    the eigenvalues and generalized eigenvectors of (A,B). Returns the eigenvalues
    and generalized eigenvectors of (A,B). The factorization method (‘chol’ or ‘qz’)
    is specified by flag. |

    | pzmap(sys) pzmap(sys1,sys2,...,sysN) [p,z] = pzmap(sys) | Creates a pole-zero
    plot of the continuous-time or discrete-time dynamic system sys or of several
    LTI systems sys1, sys2,..., sysn at the same time. [p, z] gives the poles and
    zeros and not the graph. |

    | rlocus(sys) rlocus(sys,k) rlocus(sys1,sys2,...) [r,k] = rlocus(sys) r = rlocus(sys,k)
    | Calculates and plots the root locus of the open-loop SISO model sys. Uses the
    user-specified vector k of gains to plot the root locus. Calculates and plots
    the root locus of several systems in a simple graph. Returns the vector k of selected
    gains and the complex root locations r for these gains. Returns the root locations
    r for a system sys with selected gains given by the vector k. |

    | r = roots(c) | Returns the roots of the polynomial c as a column vector. |

    | sgrid zgrid | Generates, for pole-zero and root locus plots, a grid of constant
    damping factors from zero to one in steps of 0.1 and natural frequencies from
    zero to 10 rad/sec in steps of one rad/sec, and plots the grid over the current
    axis. Similarly generates a grid from zero to π in steps of π/10, and plots the
    grid over the current axis. |

    | z = zero(sys) [z,gain] = zero(sys) | Calculates the zeros of the LTI model sys.
    Returns the zeros and gain of the LTI system sys. |


    As a first example, we calculate the eigenvalues, natural frequencies and damping
    factors of the continuous transfer function model:


    ![A978-1-4842-0289-0_3_Figv_HTML.jpg](A978-1-4842-0289-0_3_Figv_HTML.jpg)


    `>> H = tf([2 5 1],[1 2 3])`


    `Transfer function:`


    `2 s^2 + 5 s + 1`


    `---------------`


    `s^2 + 2 s + 3`


    `>> damp(H)`


    `Eigenvalue            Damping     Freq. (rad/s)`


    `00e - 1 + 000 + 1\. 41e + 000i 5\. 77e-001 1\. 73e + 000`


    `00e - 1 + 000 - 1\. 41e + 000i 5\. 77e-001 1\. 73e + 000`


    In the following example we calculate the DC gain of the MIMO transfer function
    model:


    ![A978-1-4842-0289-0_3_Figw_HTML.jpg](A978-1-4842-0289-0_3_Figw_HTML.jpg)


    `>> H = [1 tf([1 -1],[1 1 3]) ; tf(1,[1 1]) tf([1 2],[1 -3])]`


    `dcgain(H)`


    `Transfer function from input 1 to output...`


    `#1:  1`


    `1`


    `#2:  -----`


    `s + 1`


    `Transfer function from input 2 to output...`


    `s`


    `#1:  -----------`


    `s^2 + s + 3`


    `s + 2`


    `#2:  -----`


    `3s`


    `ans =`


    `1.0000 - 0.3333`


    `1.0000 - 0.6667`


    Next we consider the discrete-time transfer function


    ![A978-1-4842-0289-0_3_Figx_HTML.jpg](A978-1-4842-0289-0_3_Figx_HTML.jpg)


    with 0.1 second sampling time and calculate the 2-norm and the infinite norm with
    its optimum value.


    `>> H = tf([1 -2.841 2.875 -1.004],[1 -2.417 2.003 -0.5488],0.1)`


    `norm(H)`


    `Transfer function:`


    `z^3 - 2.841 z^2 + 2.875 z - 1.004`


    `----------------------------------`


    `z^3 - 2.417 z^2 + 2.003 z - 0.5488`


    `Sampling time: 0.1`


    `ans =`


    `1.2438`


    `>> [ninf,fpeak] = norm(H,inf)`


    `surrounded =`


    `2.5488`


    `fpeak =`


    `3.0844`


    We then confirm the previous values by generating the Bode plot of H(z) (see Figure
    [3-12](#A978-1-4842-0289-0_3_Chapter.html#Fig12)).


    `>> bode (H)`


    ![A978-1-4842-0289-0_3_Fig12_HTML.jpg](A978-1-4842-0289-0_3_Fig12_HTML.jpg)


    Figure 3-12.


    Figure 3-12


    Next we calculate and graph the root locus of the following system (see Figure
    [3-13](#A978-1-4842-0289-0_3_Chapter.html#Fig13)):


    ![A978-1-4842-0289-0_3_Figy_HTML.jpg](A978-1-4842-0289-0_3_Figy_HTML.jpg)


    `>> h = tf([2 5 1],[1 2 3]);`


    `rlocus (h)`


    ![A978-1-4842-0289-0_3_Fig13_HTML.jpg](A978-1-4842-0289-0_3_Fig13_HTML.jpg)


    Figure 3-13.


    Figure 3-13


    In the example below we plot a z-plane grid over the root locus of the following
    system (see Figure [3-14](#A978-1-4842-0289-0_3_Chapter.html#Fig14)):


    ![A978-1-4842-0289-0_3_Figz_HTML.jpg](A978-1-4842-0289-0_3_Figz_HTML.jpg)


    `> H = tf([2 -3.4 1.5],[1 -1.6 0.8],-1)`


    `Transfer function:`


    `2 z^2 - 3.4 z + 1.5`


    `-------------------`


    `z^2 - 1.6 z + 0.8`


    `Sampling time: unspecified`


    `>> rlocus(H)`


    `zgrid`


    `axis(''square'')`


    ![A978-1-4842-0289-0_3_Fig14_HTML.jpg](A978-1-4842-0289-0_3_Fig14_HTML.jpg)


    Figure 3-14.


