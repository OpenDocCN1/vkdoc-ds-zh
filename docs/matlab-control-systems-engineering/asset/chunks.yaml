- fmt: '### Graphical Analysis of Models Using the LTI Viewer


    The Control System Toolbox LTI Viewer is a GUI that simplifies the analysis of
    linear time-invariant systems (it is loaded by typing `>>ltiview` in the command
    window). The LTI Viewer is used to simultaneously view and compare the response
    plots of several linear models. It is possible to generate time and frequency
    response plots and to inspect key response parameters such as time of ascent,
    maximum overshooting and stability margins. Using mouse-driven interactions, you
    can select input and output channels for MIMO systems. The LTI Viewer can simultaneously
    display up to six different types of plots including step, impulse, Bode (magnitude
    and phase or magnitude only), Nyquist, Nichols, sigma, and pole/zero. Right-clicking
    will reveal an options menu which gives you access to several controls and LTI
    Viewer Options, including:


    *   Plot Type: Change the type of plot.

    *   Systems: Selects or deselects any of the models loaded in the LTI Viewer.

    *   Characteristics: Displays parameters and key response characteristics.

    *   Zoom: Enlargement and reduction of parts of the plot.

    *   Grid: Add grids to the plots.

    *   Properties: Opens the Property Editor, where you can customize attributes
    of the plot.


    In addition to the right-click menu, all the response plots include data markers.
    These allow you to scan the plot data, identify key data and determine the system
    font for a given plot. Using the LTI Viewer you can easily graphically represent
    solutions for one or several systems using step response plots, zero/pole plots
    and all frequency response plots (Bode, Nyquist, Nichols and singular values plots),
    all in a single window (see Figure [3-6](#A978-1-4842-0289-0_3_Chapter.html#Fig6)).
    The LTI Viewer allows you to display important response characteristics in the
    plots, such as margins of stability, using data markers.


    ![A978-1-4842-0289-0_3_Fig6_HTML.jpg](A978-1-4842-0289-0_3_Fig6_HTML.jpg)


    Figure 3-6.


    ### Analysis of Models Using the Command Line


    The LTI Viewer is suitable for a wide range of applications where you want a GUI-driven
    environment. For situations that require programming, custom plots or data unrelated
    to their LTI models, the Control System Toolbox provides command line functions
    that perform the basic frequency plots and time domain analysis used in control
    systems engineering. These functions apply to any type of linear model (continuous
    or discontinuous, SISO or MIMO) or arrays of models.


    ### Compensator Design Using the SISO Design Tool


    The Control System Toolbox SISO Design Tool is a GUI that allows you to analyze
    and adjust SISO control feedback systems (loaded by typing `>>sisotool` in the
    command window). Using the SISO Design Tool, you can graphically adjust the dynamics
    and the compensator gain using a mixture of root locus and loop shaping techniques.
    For example, you can use the view of the locus of the roots to stabilize a feedback
    loop and force a minimum buffer, and use Bode diagrams to adjust bandwidth, gain
    and phase margins or add a filter notch to reject disturbances. The SISO Design
    GUI can be used for continuous-time and discrete-time time plants. Figure [3-7](#A978-1-4842-0289-0_3_Chapter.html#Fig7)
    shows root locus and Bode diagrams for a discrete-time plant.


    ![A978-1-4842-0289-0_3_Fig7_HTML.jpg](A978-1-4842-0289-0_3_Fig7_HTML.jpg)


    Figure 3-7.


    The SISO Design Tool is designed to work closely with the LTI Viewer, allowing
    you to quickly reiterate a design and immediately see the results in the LTI Viewer.
    When making a change to the compensator, the LTI Viewer associated with the SISO
    Design Tool automatically updates the plots of the solution you have chosen. The
    SISO Design Tool integrates most of the functionality of the Control System Toolbox
    in a single GUI, dynamically linking time, frequency, and pole/zero plots, offering
    views of complementary themes and design goals, providing graphical changes in
    Design view and helping to manage the complexity and iterations of the design.
    The right-click and drop-down menus give you flexibility to design controls with
    a click of the mouse. In particular, it is possible to view Bode and root locus
    diagrams, place poles and zeros, add delay/advance networks and notch filters,
    adjust the compensator parameters graphically with the mouse, inspect closed loop
    responses (using the LTI Viewer), adjust gain and phase margins and convert models
    between discrete and continuous time.


    ### Compensator Design Using the Command Line


    In addition to the SISO Design Tool, the Control System Toolbox provides a number
    of commands that can be used for a wider range of control applications, including
    functions for classical SISO design (data buffer, locus of the roots and gain
    and phase margins) and functions for modern MIMO design (placement of poles, LQR/LQG
    methods and Kalman filtering). Linear-Quadratic-Gaussian (LQG) control is a modern
    state-space technique used for the design of optimal dynamic regulators, allowing
    the balance of benefits of regulation and control costs, taking into account perturbations
    of the process and measuring noise.


    ## The Control System Toolbox Commands


    The Control System Toolbox commands can be classified according to their purpose
    as follows:


    ![A978-1-4842-0289-0_3_Fig8_HTML.jpg](A978-1-4842-0289-0_3_Fig8_HTML.jpg)


    Figure 3-8.'
