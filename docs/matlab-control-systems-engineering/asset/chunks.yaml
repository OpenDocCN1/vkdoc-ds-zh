    \n![A978-1-4842-0289-0_4_Fig3_HTML.jpg](A978-1-4842-0289-0_4_Fig3_HTML.jpg)\n\n\
    **Figure 4-3.**\n\n## EXERCISE 4-5\n\nFor the linear system described in the previous\
    \ problem, measure the effect of setting a limit of 0.1 in the exchange rate and\
    \ a minimum of −0.15 for `u2` and `u1`. Then apply a lower limit of zero for both\
    \ outputs.\n\nWe build the model using the following syntax:\n\n```\n>> g11=poly2tfd(12.8,[16.7\
    \ 1],0,1);\n>> g21=poly2tfd(6.6,[10.9 1],0,7);\n>> g12=poly2tfd(-18.9,[21.0 1],0,3);\n\
    >> g22=poly2tfd(-19.4,[14.4 1],0,3);\n>> delt=3; ny=2; tfinal=90;\n>> model=tfd2step(tfinal,delt,ny,g11,g21,g12,g22);\n\
    >> plant=model;\n>> P=6;  M=2;  ywt=[ ]; uwt=[1 1];\n>> tend=30;  r=[0 1];\n```\n\
    \n```\nPercent error in the last step response coefficient\nof output yi for input\
    \ uj is :\n0.48%  1.6%\n0.049% 0.24%\n```\n\nThe effect of the restrictions can\
    \ be seen using the following syntax (see Figure [4-4](#A978-1-4842-0289-0_4_Chapter.html#Fig4)):\n\
    \n```\n>> ulim=[-inf -0.15 inf inf 0.1 100];\n>> ylim=[ ];\n>> [y,u]=cmpc(plant,model,ywt,uwt,M,P,tend,r,ulim,ylim);\n\
    >> plotall(y,u,delt),pause\n```\n\n```\nTime remaining 30/30\nTime remaining 0/30\n\
    Simulation time is 0.03 seconds.\n```\n\n![A978-1-4842-0289-0_4_Fig4_HTML.jpg](A978-1-4842-0289-0_4_Fig4_HTML.jpg)\n\
