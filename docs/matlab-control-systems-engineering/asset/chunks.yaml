    79 * base2dec(''fffaaa125'',16) / (base2dec (''33331'', 4) + 6)

    ans =

    2. 753733404908515e + 014

    ```


    We now transform the result obtained into base 13.


    ```

    >> dec2base (275373340490852,13)

    ans =

    BA867963C1496

