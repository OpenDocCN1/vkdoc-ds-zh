  trans: '

    # 引言


    MATLAB 是一个用于科学计算和高级编程的平台，它采用交互式环境，让您能够比使用 C、C++ 和 FORTRAN 等传统语言更高效地执行复杂的计算任务。它是目前科学和工程领域最流行的平台之一。


    MATLAB 是一个交互式的高级技术计算环境，专为算法开发、数据可视化、数据分析和数值分析而设计。MATLAB 适用于解决涉及技术计算的问题，它使用经过优化的算法，并以易于使用的命令形式呈现。


    MATLAB 可用于广泛的应用领域，包括微积分、代数、统计学、计量经济学、质量控制、时间序列、信号与图像处理、通信、控制系统设计、测试与测量系统、金融建模、计算生物学等。其补充工具集（称为工具箱，即用于特定目的的
    MATLAB 函数集合，需单独获取）扩展了 MATLAB 环境，让您能够解决不同应用领域的特殊问题。


    此外，MATLAB 还包含许多函数，可让您记录和共享工作成果。您可以将 MATLAB 代码与其他语言和应用程序集成，并分发使用 MATLAB 开发的算法和应用程序。


    以下列出了 MATLAB 最重要的特性：


    *   它是一种用于技术计算的高级语言

    *   它提供了一个用于管理代码、文件和数据的环境

    *   它具备用于探索、设计和迭代求解的交互式工具

    *   它支持用于线性代数、统计学、傅里叶分析、滤波、优化和数值积分的数学函数

    *   它能生成高质量的二维和三维图形，以辅助数据可视化

    *   它包含用于创建自定义图形用户界面的工具

    *   它可以与外部语言集成，例如 C/C++、FORTRAN、Java、COM 以及 Microsoft Excel


    MATLAB 开发环境允许您以交互模式开发算法、分析数据、显示数据文件和管理项目（参见图 1-1）。


    ![A978-1-4842-0289-0_1_Fig1_HTML.jpg](img/A978-1-4842-0289-0_1_Fig1_HTML.jpg)


    图 1-1.


    图 1-1


    ## 开发算法和应用程序


    MATLAB 提供高级编程语言和开发工具，使您能够快速开发和剖析算法及应用程序。


    MATLAB 语言包含矢量和矩阵运算，这是解决科学和工程问题的基础。这简化了开发和执行过程。


    使用 MATLAB 语言，编程和开发算法的速度比使用传统语言更快，因为不再需要执行低层级的管理任务，例如声明变量、指定数据类型和分配内存。在许多情况下，MATLAB
    消除了对 `for` 循环的需求。因此，一行 MATLAB 代码通常可以替换几行 C 或 C++ 代码。


    同时，MATLAB 提供了传统编程语言的所有特性，包括算术运算符、控制流、数据结构、数据类型、面向对象编程（OOP）和调试。


    图 1-2 展示了一个通信调制算法，该算法生成 1024 个随机比特，执行调制，添加复高斯噪声，并以图形方式显示结果，所有这些仅需九行 MATLAB 代码。


    ![A978-1-4842-0289-0_1_Fig2_HTML.jpg](img/A978-1-4842-0289-0_1_Fig2_HTML.jpg)


    图 1-2.


    图 1-2


    MATLAB 允许您一次执行一个命令或一组命令，无需编译或链接，并且可以重复执行以达到最优解。


    为了快速执行复杂的矢量和矩阵计算，MATLAB 使用了针对处理器优化的库。对于一般的标量计算，MATLAB 使用 JIT（即时编译）技术生成机器码指令。得益于这项在大多数平台上都可用的技术，其执行速度比传统编程语言快得多。


    MATLAB 包含有助于高效实现算法的开发工具。其中一些工具如下所列：


    *   MATLAB 编辑器 – 用于编辑函数和进行标准调试，例如设置断点和运行逐步仿真

    *   M-Lint 代码检查器 - 分析代码并建议更改以提高性能和可维护性（参见图 1-3）


    ![A978-1-4842-0289-0_1_Fig3_HTML.jpg](img/A978-1-4842-0289-0_1_Fig3_HTML.jpg)


    图 1-3.


    图 1-3


    *   MATLAB Profiler - 记录执行每行代码所花费的时间

    *   目录报告 - 扫描目录中的所有文件，并生成关于代码效率、文件间差异、文件依赖关系和代码覆盖率的报告


    您还可以使用交互式工具 GUIDE（图形用户界面开发环境）来设计和编辑用户界面。此工具允许您包含选择列表、下拉菜单、按钮、单选按钮和滑块，以及 MATLAB
    图表和 ActiveX 控件。您也可以通过编程方式使用 MATLAB 函数来创建图形用户界面。


    图 1-4 展示了一个已完成的小波分析工具（下方），该工具是使用用户界面 GUIDE（上方）创建的。


    ![A978-1-4842-0289-0_1_Fig4_HTML.jpg](img/A978-1-4842-0289-0_1_Fig4_HTML.jpg)


    图 1-4.


    图 1-4


    ## 数据访问与分析


    MATLAB 支持数据分析的整个过程，从从外部设备和数据库获取数据，到预处理、可视化和数值分析，直至生成可用于演示的结果。


    MATLAB 提供交互式工具和命令行操作来进行数据分析，包括：数据分段、缩放和平均、插值、阈值处理和平滑、相关性分析、傅里叶分析和滤波、一维峰值和零点查找、基本统计和曲线拟合、矩阵分析等。


    图 1-5 中的示意图显示了一条拟合曲线，该曲线拟合了复活节岛与澳大利亚达尔文之间的平均大气压力差。


    ![A978-1-4842-0289-0_1_Fig5_HTML.jpg](img/A978-1-4842-0289-0_1_Fig5_HTML.jpg)


    图 1-5.


    图 1-5


    MATLAB 平台允许高效访问数据文件、其他应用程序、数据库和外部设备。您可以读取大多数已知格式存储的数据，例如 Microsoft Excel、ASCII
    文本文件或二进制图像、声音和视频文件，以及 HDF 和 HDF5 文件等科学档案。用于低级 I/O 函数的二进制文件允许您处理任何格式的数据文件。其他功能允许您查看
    Web 页面和 XML 数据。


    您可以调用其他应用程序和语言，例如 C、C++、COM、DLL、Java、FORTRAN 和 Microsoft Excel 对象，并访问 FTP 站点和
    Web 服务。使用数据库工具箱，您甚至可以访问 ODBC/JDBC 数据库。

    '
- fmt: '### Data Visualization


    All graphics functions necessary to visualize scientific and engineering data
    are available in `MATLAB`. This includes tools for two- and three-dimensional
    diagrams, three-dimensional volume visualization, tools to create diagrams interactively,
    and the ability to export using the most popular graphic formats. It is possible
    to customize diagrams, adding multiple axes, changing the colors of lines and
    markers, adding annotations, `LaTeX` equations and legends, and plotting paths.


    Various two-dimensional graphical representations of vector data can be created,
    including:


    - Line, area, bar and sector diagrams

    - Direction and velocity diagrams

    - Histograms

    - Polygons and surfaces

    - Dispersion bubble diagrams

    - Animations


    Figure [1-6](#A978-1-4842-0289-0_1_Chapter.html#Fig6) shows linear plots of the
    results of several emission tests of a motor, with a curve fitted to the data.


    ![A978-1-4842-0289-0_1_Fig6_HTML.jpg](A978-1-4842-0289-0_1_Fig6_HTML.jpg)


    Figure 1-6.


    `MATLAB` also provides functions for displaying two-dimensional arrays, three-dimensional
    scalar data and three-dimensional vector data. It is possible to use these functions
    to visualize and understand large amounts of complex multi-dimensional data. It
    is also possible to define the characteristics of the diagrams, such as the orientation
    of the camera, perspective, lighting, light source and transparency. Three-dimensional
    diagramming features include:


    - Surface, contour and mesh plots

    - Space curves

    - Cone, phase, flow and isosurface diagrams


    Figure [1-7](#A978-1-4842-0289-0_1_Chapter.html#Fig7) shows a three-dimensional
    diagram of an isosurface that reveals the geodesic structure of a fullerene carbon-60
    molecule.


    ![A978-1-4842-0289-0_1_Fig7_HTML.jpg](A978-1-4842-0289-0_1_Fig7_HTML.jpg)


    Figure 1-7.


    `MATLAB` includes interactive tools for graphic editing and design. From a `MATLAB`
    diagram, you can perform any of the following tasks:


    - Drag and drop new sets of data into the figure

    - Change the properties of any object in the figure

    - Change the zoom, rotation, view (i.e. panoramic), camera angle and lighting

    - Add data labels and annotations

    - Draw shapes

    - Generate an `M-file` for reuse with different data


    Figure [1-8](#A978-1-4842-0289-0_1_Chapter.html#Fig8) shows a collection of graphics
    which have been created interactively by dragging data sets onto the diagram window,
    making new subdiagrams, changing properties such as colors and fonts, and adding
    annotations.


    ![A978-1-4842-0289-0_1_Fig8_HTML.jpg](A978-1-4842-0289-0_1_Fig8_HTML.jpg)


    Figure 1-8.


    `MATLAB` is compatible with all the well-known data file and graphics formats,
    such as `GIF`, `JPEG`, `BMP`, `EPS`, `TIFF`, `PNG`, `HDF`, `AVI`, and `PCX`. As
    a result, it is possible to export `MATLAB` diagrams to other applications, such
    as `Microsoft Word` and `Microsoft PowerPoint`, or desktop publishing software.
    Before exporting, you can create and apply style templates that contain all the
    design details, fonts, line thickness, etc., necessary to comply with the publication
    specifications.


    ### Numerical Calculation


    `MATLAB` contains mathematical, statistical, and engineering functions that support
    most of the operations carried out in those fields. These functions, developed
    by math experts, are the foundation of the `MATLAB` language. To cite some examples,
    `MATLAB` implements mathematical functions and data analysis in the following
    areas:


    - Manipulation of matrices and linear algebra

    - Polynomials and interpolation

    - Fourier analysis and filters

    - Statistics and data analysis

    - Optimization and numerical integration

    - Ordinary differential equations (`ODEs`)

    - Partial differential equations (`PDEs`)

    - Sparse matrix operations


    ### Publication of Results and Distribution of Applications


    In addition, `MATLAB` contains a number of functions which allow you to document
    and share your work. You can integrate your `MATLAB` code with other languages
    and applications, and distribute your algorithms and `MATLAB` applications as
    autonomous programs or software modules.


    `MATLAB` allows you to export the results in the form of a diagram or as a complete
    report. You can export diagrams to all popular graphics formats and then import
    them into other packages such as `Microsoft Word` or `Microsoft PowerPoint`. Using
    the `MATLAB Editor`, you can automatically publish your `MATLAB` code in `HTML`
    format, `Word`, `LaTeX`, etc. For example, Figure [1-9](#A978-1-4842-0289-0_1_Chapter.html#Fig9)
    shows an `M-file` (left) published in `HTML` (right) using the `MATLAB Editor`.
    The results, which are sent to the `Command Window` or to diagrams, are captured
    and included in the document and the comments become titles and text in `HTML`.


    ![A978-1-4842-0289-0_1_Fig9_HTML.jpg](A978-1-4842-0289-0_1_Fig9_HTML.jpg)


    Figure 1-9.


    It is possible to create more complex reports, such as mock executions and various
    parameter tests, using `MATLAB Report Generator` (available separately).


    `MATLAB` provides functions enabling you to integrate your `MATLAB` applications
    with `C` and `C++` code, `FORTRAN` code, `COM` objects, and `Java` code. You can
    call `DLLs` and `Java` classes and `ActiveX` controls. Using the `MATLAB` engine
    library, you can also call `MATLAB` from `C`, `C++`, or `FORTRAN` code.


    You can create algorithms in `MATLAB` and distribute them to other users of `MATLAB`.
    Using the `MATLAB Compiler` (available separately), algorithms can be distributed,
    either as standalone applications or as software modules included in a project,
    to users who do not have `MATLAB`. Additional products are able to turn algorithms
    into a software module that can be called from `COM` or `Microsoft Excel`.'
