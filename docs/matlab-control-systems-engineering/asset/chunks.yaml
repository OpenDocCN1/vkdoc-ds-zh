    ### 字符变量


    字符变量（链）是指用单引号括起来的字符串，MATLAB 会将其视为向量形式。字符变量的一般语法如下：


    `c = ''string''`


    在处理字符变量的 MATLAB 命令中，包含以下这些：


    | `abs(''字符字符串'')` | 返回与字符串中每个字符对应的 ASCII 字符数组。 |

    | `setstr(数值向量)` | 返回与向量元素对应的 ASCII 字符组成的字符串。 |

    | `str2mat(t1,t2,t3,...)` | 返回一个矩阵，其行分别为字符串 `t1`、`t2`、`t3`…… |

    | `str2num(''字符串'')` | 将字符串转换为 MATLAB 使用的精确数值。 |

    | `num2str(数字)` | 以固定精度返回数字对应的字符串形式。 |

    | `int2str(整数)` | 将整数转换为字符串。 |

    | `sprintf(''格式'', a)` | 将数值数组按指定格式转换为字符串。 |

    | `sscanf(''字符串'', ''格式'')` | 将字符串按指定格式转换为数值。 |

    | `dec2hex(整数)` | 将十进制整数转换为十六进制形式的字符串。 |

    | `hex2dec(''十六进制字符串'')` | 将十六进制字符串转换为对应的整数。 |

    | `hex2num(''十六进制字符串'')` | 将十六进制字符串转换为对应的 IEEE 浮点数。 |

    | `lower(''字符串'')` | 将字符串转换为小写。 |

    | `upper(''字符串'')` | 将字符串转换为大写。 |

    | `strcmp(s1, s2)` | 比较字符串 `s1` 和 `s2`，如果相等则返回 1，否则返回 0。 |

    | `strcmp(s1, s2, n)` | 比较字符串 `s1` 和 `s2`，如果前 `n` 个字符相等则返回 1，否则返回 0。 |

    | `strrep(c, ''exp1'', ''exp2'')` | 在链 `c` 中将 `exp1` 替换为 `exp2`。 |

    | `findstr(c, ''exp'')` | 查找 `exp` 在链 `c` 中的位置。 |

    | `isstr(表达式)` | 如果表达式是字符串则返回 1，否则返回 0。 |

    | `ischar(表达式)` | 如果表达式是字符串则返回 1，否则返回 0。 |

    | `strjust(字符串)` | 将字符串右对齐。 |

    | `blanks(n)` | 生成一个包含 `n` 个空格的字符串。 |

    | `deblank(字符串)` | 移除字符串右侧的空格。 |

    | `eval(表达式)` | 执行表达式，即使它是一个字符串。 |

    | `disp(''字符串'')` | 按原样显示字符串（或数组），并继续执行 MATLAB 进程。 |

    | `input(''字符串'')` | 在屏幕上显示字符串，并等待按键继续。 |


    以下是一些示例：


