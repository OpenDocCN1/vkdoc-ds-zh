- fmt: "As a first example, we consider the system:\n\n![A978-1-4842-0289-0_3_Figt_HTML.jpg](A978-1-4842-0289-0_3_Figt_HTML.jpg)\n\
    \nwith input lag `Td = 0.35` seconds. The system is discretized using triangular\
    \ approximation with sampling time `Ts = 0.1` sec.\n\n```\n>> H = tf([1 -1],[1\
    \ 4 5],'inputdelay',0.35)\n```\n\n```\nTransfer function:\n\ns - 1\n\nexp(-0.35*s)\
    \ * -------------\n\ns^2 + 4s + 5\n```\n\n```\n>> Hd = c2d(H,0.1,'foh')\n```\n\
    \n```\nTransfer function:\n\n0.0115 z^3 + 0.0456 z^2 - 0.0562z - 0.009104\n\n\
    z^(-3) * ---------------------------------------------\n\nz^3 - 1.629 z^2 + 0.6703z\n\
    \nSampling time: 0.1\n```\n\nIf we want to compare the step response and its discretization\
    \ (see Figure [3-9](#A978-1-4842-0289-0_3_Chapter.html#Fig9)) we can use the following\
    \ command:\n\n```\n>> step(H,'-',Hd,'--')\n```\n\n![A978-1-4842-0289-0_3_Fig9_HTML.jpg](A978-1-4842-0289-0_3_Fig9_HTML.jpg)\n\
    \nFigure 3-9.\n\nThe next example computes a Padé approximation of third order\
    \ with I/O lag 0.1 seconds and compares the time and frequency response with its\
    \ approximation (Figure [3-10](#A978-1-4842-0289-0_3_Chapter.html#Fig10)).\n\n\
    ```\n>> pade(0.1,3)\n```\n\n```\nStep response of 3rd-order Pade approximation\n\
    ```\n\n![A978-1-4842-0289-0_3_Fig10_HTML.jpg](A978-1-4842-0289-0_3_Fig10_HTML.jpg)\n\
    \nFigure 3-10.\n\n### Commands for Reduced Order Models\n\n| Command | Description\
    \ |\n| --- | --- |\n| `[sysb,g] = balreal(sys)` `[sysb,g,T,Ti] = balreal(sys)`\
    \ | Computes a balanced realization `sysb` for the stable portion of the LTI model\
    \ `sys`. `balreal` handles both continuous and discrete systems. In addition returns\
    \ the vector `g` containing the diagonal of the balanced gramian, the state similarity\
    \ transformation `x_[b] = Tx` used to convert `sys` to `sysb`, and the inverse\
    \ transformation `Ti = T ^(−1)`. |\n| `sysr = minreal(sys)` `sysr = minreal(sys,tol)`\
    \ `[sysr,u] = minreal(sys,tol)` | Eliminates uncontrollable or unobservable states\
    \ in state-space models, or cancels pole-zero pairs in transfer functions or zero-pole-gain\
    \ models. Specifies the tolerance used for state elimination or pole-zero cancellation.\
    \ The default value is `tol = sqrt(eps)` and increasing this tolerance forces\
    \ additional cancellations. In addition finds an orthogonal matrix `U` such that\
    \ `(U*A*U',U*B,C*U')` is a Kalman decomposition of `(A,B,C)`. |\n| `rsys = modred(sys,elim)`\
    \ `rsys = modred(sys,elim,'method')` | Reduces the order of a continuous or discrete\
    \ state-space model `sys` by eliminating the states found in the vector `elim`.\
    \ The full state vector `X` is partitioned as `X = [X1;X2]` where `X1` is the\
    \ reduced state vector and `X2` is discarded. In addition specifies the state\
    \ elimination method, which can be `MatchDC` (enforce matching DC gains) or `Truncate`\
    \ (delete `X2`). |\n| `MSYS = sminreal(sys)` | Eliminates the states of the state-space\
    \ model `sys` that don’t affect the input/output response. |\n\nIn the example\
    \ that follows we consider the zero-pole-gain model defined by `sys = zpk([- 10\
    \ - 20.01], [- 5 - 9.9 -20.1], 1)` and estimate a balanced realization, presenting\
    \ the diagonal of the balanced grammian.\n\n```\n>> sys = zpk([-10 -20.01],[-5\
    \ -9.9 -20.1],1)\n```\n\n```\nZero/pole/gain:\n\n   (s+10) (s+20.01)\n\n----------------------\n\
    \n(s+5) (s+9.9) (s+20.1)\n```\n\n```\n>> [sysb,g] = balreal(sys)\n```\n\n```\n\
    a =\n\n            x1       x2       x3\n\n   x1    -4.97   0.2399   0.2262\n\n\
    \   x2  -0.2399   -4.276   -9.467\n\n   x3   0.2262    9.467   -25.75\n\nb =\n\
    \n             u1\n\n   x1        -1\n\n   x2  -0.02412\n\n   x3   0.02276\n\n\
    c =\n\n            x1       x2       x3\n\n   y1       -1  0.02412  0.02276\n\n\
    d =\n\n       u1\n\n   y1   0\n\nContinuous-time model.\n\ng =\n\n   0.1006\n\n\
    \   0.0001\n\n   0.0000\n```\n\nThe result shows that the last two states are\
    \ weakly coupled to the input and output, so it will be convenient to remove them\
    \ by using the syntax:\n\n```\n>> sysr = modred(sysb,[2 3],'del')\n```\n\n```\n\
    a =\n\n          x1\n\n   x1  -4.97\n\nb =\n\n       u1\n\n   x1  -1\n\nc =\n\n\
    \       x1\n\n   y1  -1\n\nd =\n\n       u1\n\n   y1   0\n\nContinuous-time model.\n\
    ```\n\nNow we can compare the answers of the original and reduced models (Figure\
    \ [3-11](#A978-1-4842-0289-0_3_Chapter.html#Fig11)) by using the following syntax:\n\
    \n```\n>> bode(sys,'-',sysr,'x')\n```\n\n![A978-1-4842-0289-0_3_Fig11_HTML.jpg](A978-1-4842-0289-0_3_Fig11_HTML.jpg)\n\
    \nFigure 3-11.\n\n### Commands Related to State-Spaces\n\n| Command | Description\
    \ |\n| --- | --- |\n| `csys = canon(sys, 'type' )` `[csys,T] = canon(sys, 'type'\
    \ )` | Transforms the linear model `sys` into a canonical state-space model `csys`.\
    \ The argument `'type'` can be either `'modal'` or `'companion.'` In addition\
    \ returns the state-coordinate transformation `T` that relates the states of the\
    \ state-space model `sys` to the states of `csys`. |\n| `Co = ctrb(A,B)` `Co =\
    \ ctrb(sys)` | Returns the controllability matrix for state-space systems. |\n\
    | `[Abar,Bbar,Cbar,T,k] = ctrbf(A,B,C)` `[Abar,Bbar,Cbar,T,k] = ctrbf(A,B,C,tol)`\
    \ | Decomposes the state-space system represented by `A`, `B`, and `C` into the\
    \ controllability staircase form, `Abar`, `Bbar`, and `Cbar`. `T` is the similarity\
    \ transformation matrix and `k` is a vector of length `n`, where `n` is the order\
    \ of the system represented by `A`. The number of non-null values of `k` indicates\
    \ the number of iterations needed to calculate `T`. |\n| `Wc = gram(sys,'c')`\
    \ `Wo = gram(sys,'o')` | Calculates the controllability and observability grammians\
    \ of the state-space model `sys`. |\n| `Ob = obsv(A,B)` `Ob = obsv(sys)` | Calculates\
    \ the observability matrix for state-space models. |\n| `[Abar,Bbar,Cbar,T,k]\
    \ = obsvf(A,B,C)` `[Abar,Bbar,Cbar,T,k] = obsvf(A,B,C,tol)` | Decomposes the state-space\
    \ system with matrices `A`, `B`, and `C` into the observability staircase form\
    \ `Abar`, `Bbar`, and `Cbar`. `T` is the similarity transformation matrix and\
    \ `k` is a vector of length `n`, where `n` is the order of the system represented\
    \ by `A`. The number of non-null values of `k` indicates the number of iterations\
    \ needed to calculate `T`. |\n| `sysT = ss2ss(sys,T)` | Returns the transformed\
    \ state-space model `sysT` given `sys` and the state coordinate transformation\
    \ `T`. |\n| `[sysb,T] = ssbal(sys)` `[sysb,T] = ssbal(sys,condT)` | Balances state-space\
    \ models using a diagonal similarity transformation. |\n\nAs a first example we\
    \ consider the following continuous state-space model:\n\n![A978-1-4842-0289-0_3_Figu_HTML.jpg](A978-1-4842-0289-0_3_Figu_HTML.jpg)\n\
    \nWe calculate the balanced model as follows:\n\n```\n>> a = [1 1e4 1e2; 0 1e2\
    \ 1e5; 10 1 0];\nb = [1; 1; 1];\nc = [0.1 10 1e2];\nsys = ss (a, b, c, 0)\n```\n\
    \n```\na =\n\n           x1      x2      x3\n\n   x1       1  1e+004     100\n\
    \n   x2       0     100  1e+005\n\n   x3      10       1       0\n\nb =\n\n  \
    \     u1\n\n   x1   1\n\n   x2   1\n\n   x3   1\n\nc =\n\n        x1   x2   x3\n\
    \n   y1  0.1   10  100\n\nd =\n\n       u1\n\n   y1   0\n\nContinuous-time model.\n\
    ```\n\nIn the following example we calculate the observability matrix of the ladder\
    \ system `A = [1, 1; 4, − 2]`, `B= [1, − 1, 1, − 1]`, `C= [0, 1; 1, 0]`\n\n```\n\
    >> A = [1, 1; 4, - 2]; B = [1, - 1, 1, - 1]; C = [1,0; 0.1];\n>> [Abar, Bbar,\
    \ Cbar, T, k] = obsvf(A,B,C)\n```\n\n```\nAbar =\n\n    1     1\n\n    4    -2\n\
    \nBbar =\n\n    1    -1\n\n    1    -1\n\nCbar =\n\n    1     0\n\n    0     1\n\
    \nT =\n\n    1     0\n\n    0     1\n\nk =\n\n    2     0\n```\n\nBelow we calculate\
