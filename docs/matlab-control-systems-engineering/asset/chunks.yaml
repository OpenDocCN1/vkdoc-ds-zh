    ### 使用 LTI 查看器对模型进行图形化分析


    控制系统工具箱的 LTI 查看器是一个图形用户界面，可以简化线性时不变系统的分析（通过在命令窗口中输入`>>ltiview`来加载）。LTI 查看器用于同时查看和比较多个线性模型的响应图。它可以生成时域和频域响应图，并检查关键响应参数，例如上升时间、最大超调量和稳定裕度。通过鼠标驱动的交互，您可以为多输入多输出系统选择输入和输出通道。LTI
    查看器可以同时显示多达六种不同类型的图，包括阶跃响应、脉冲响应、波特图（幅值和相位或仅幅值）、奈奎斯特图、尼科尔斯图、西格玛图和零极点图。右键点击将弹出一个选项菜单，允许您访问多种控制和
    LTI 查看器选项，包括：


    *   **绘图类型**：更改绘图类型。

    *   **系统**：在 LTI 查看器中选中或取消选中已加载的任何模型。

    *   **特性**：显示参数和关键响应特性。

    *   **缩放**：放大和缩小图的某些部分。

    *   **网格**：为绘图添加网格。

    *   **属性**：打开属性编辑器，您可以在其中自定义绘图的属性。


    除了右键菜单之外，所有响应图都包含数据标记。这些标记允许您扫描绘图数据，识别关键数据，并确定给定绘图的系统字体。使用 LTI 查看器，您可以方便地在一个窗口中，利用阶跃响应图、零极点图和所有频域响应图（波特图、奈奎斯特图、尼科尔斯图和奇异值图）来图形化表示一个或多个系统的解（见图
    3-6）。LTI 查看器允许您在绘图中显示重要的响应特性，例如使用数据标记显示稳定裕度。


    ![A978-1-4842-0289-0_3_Fig6_HTML.jpg](img/A978-1-4842-0289-0_3_Fig6_HTML.jpg)


    图 3-6.


    ### 使用命令行分析模型


    对于需要图形用户界面驱动环境的广泛应用，LTI 查看器非常适用。对于需要编程、自定义绘图或与 LTI 模型无关的数据的情况，控制系统工具箱提供了命令行函数，用于执行控制系统工程中的基本频域绘图和时域分析。这些函数适用于任何类型的线性模型（连续或离散、单输入单输出或多输入多输出）或模型数组。


    ### 使用 SISO 设计工具进行补偿器设计


    控制系统工具箱的 SISO 设计工具是一个图形用户界面，允许您分析和调整单输入单输出控制反馈系统（通过在命令窗口中输入`>>sisotool`来加载）。使用
    SISO 设计工具，您可以结合根轨迹和环路整形技术，以图形方式调整动态特性和补偿器增益。例如，您可以使用根轨迹视图来稳定反馈环路并强制满足最小裕度，并使用波特图来调整带宽、增益和相位裕度，或添加陷波滤波器以抑制干扰。SISO
    设计图形用户界面可用于连续时间和离散时间被控对象。图 3-7 展示了离散时间被控对象的根轨迹图和波特图。


    ![A978-1-4842-0289-0_3_Fig7_HTML.jpg](img/A978-1-4842-0289-0_3_Fig7_HTML.jpg)


    图 3-7.


    SISO 设计工具旨在与 LTI 查看器紧密配合使用，允许您快速迭代设计，并立即在 LTI 查看器中看到结果。当对补偿器进行更改时，与 SISO 设计工具关联的
    LTI 查看器会自动更新所选解的绘图。SISO 设计工具将控制系统工具箱的大部分功能集成在一个单一的图形用户界面中，动态链接时域图、频域图和零极点图，提供互补主题和设计目标的视图，支持在设计视图中进行图形化更改，并帮助管理设计的复杂性和迭代过程。右键菜单和下拉菜单让您只需点击鼠标即可灵活地设计控制器。特别是，可以查看波特图和根轨迹图，放置零点和极点，添加延迟/超前网络和陷波滤波器，用鼠标图形化调整补偿器参数，检查闭环响应（使用
    LTI 查看器），调整增益和相位裕度，并在离散和连续时间之间转换模型。


    ### 使用命令行进行补偿器设计


    除了 SISO 设计工具之外，控制系统工具箱还提供了许多可用于更广泛控制应用的命令，包括用于经典 SISO 设计的函数（数据缓冲、根轨迹、增益和相位裕度）以及用于现代多输入多输出设计的函数（极点配置、LQR/LQG
    方法和卡尔曼滤波）。线性二次型高斯控制是一种现代的用于设计最优动态调节器的状态空间技术，它允许权衡调节收益和控制成本，同时考虑过程扰动和测量噪声。


