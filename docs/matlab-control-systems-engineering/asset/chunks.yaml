    \    s ^ 2 + 4 s + 5\n```\n\n以下示例指定两个离散时间传递函数：\n\n![A978-1-4842-0289-0_3_Fign_HTML.jpg](img/A978-1-4842-0289-0_3_Fign_HTML.jpg)\n\
    \n```\n>> g = tf([1 1],[1 2 3],0.1)\n\n传递函数：\n   z + 1\n-------------\nz² + 2\
    \ z + 3\n\n采样时间：0.1\n\n>> h = tf([1 1],[1 2 3],0.1,'variable','z^-1')\n\n传递函数：\n\
    \  1 + z^-1\n-------------------\n1 + 2 z^-1 + 3 z^-2\n\n采样时间：0.1\n```\n\n现在我们指定与传递函数相关的零极点增益模型：\n\
    \n![A978-1-4842-0289-0_3_Figo_HTML.jpg](img/A978-1-4842-0289-0_3_Figo_HTML.jpg)\n\
    \n```\n>> z = {[] ; -0.5}\np = {0.3 ; [0.1+i 0.1-i]}\nk = [1 ; 2]\nH = zpk(z,p,k,-1)\n\
    \nz =\n       []\n   [-0.5000]\n\np =\n   [    0.3000]\n   [1x2 double]\n\nk =\n\
    \    1\n    2\n\n从输入到输出的零极点增益...\n         1\n#1:  -------\n     (z-0.3)\n\n \
    \    2 (z+0.5)\n#2:  -------------------\n     (z² - 0.2z + 1.01)\n\n采样时间：未指定\n\
    ```\n\n在以下示例中，传递函数`tf([-10 20 0],[1 7 20 28 19 5])` 被转换为零极点增益格式。\n\n```\n>> h\
    \ = tf([-10 20 0],[1 7 20 28 19 5])\n\n传递函数：\n   -10 s² + 20 s\n----------------------------------------\n\
    s⁵ + 7 s⁴ + 20 s³ + 28 s² + 19s + 5\n\n>> zpk(h)\n\n零极点增益：\n   -10 s (s-2)\n----------------------\n\
    (s) ^ 3 (s ^ 2 + 4s + 5)\n```\n\n### 模型特性命令\n\n| 命令 | 描述 |\n| --- | --- |\n| `str\
