    | 命令窗口 | 在此处输入 MATLAB 命令（见图 1-11 的中央部分） |

    | 工作区 | 允许您查看工作区的内容（变量等）（见图 1-11 的右上方部分） |

    | 帮助 | 提供关于 MATLAB 的帮助和演示 |

