    ### Elementary Functions that Support Complex Vector Arguments


    MATLAB easily handles vector and matrix calculus. Indeed, its name, MAtrix LABoratory,
    already gives an idea of its power in working with vectors and matrices. MATLAB
    allows you to work with functions of a complex variable, but in addition this
    variable can even be a vector or a matrix. Below is a table of functions with
    complex vector arguments.


    | max (V) | The maximum component of V. (max is calculated for complex vectors
    as the complex number with the largest complex modulus (magnitude), computed with
