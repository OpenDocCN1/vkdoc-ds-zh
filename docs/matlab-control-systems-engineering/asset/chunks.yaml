    ### Pole Location Commands


    | Command | Description |

    | --- | --- |

    | k = acker(A,b,p) | Given the single input system ![A978-1-4842-0289-0_3_Figan_HTML.jpg](A978-1-4842-0289-0_3_Figan_HTML.jpg)
    and a vector p of desired closed-loop pole locations, using Ackermann’s method,
    k is determined such that the eigenvalues of A−bk match the entries of p (up to
    ordering). |

    | K = place(A,B,p) | Given the single or multi-input system ![A978-1-4842-0289-0_3_Figao_HTML.jpg](A978-1-4842-0289-0_3_Figao_HTML.jpg)
    and a vector p of desired closed-loop pole locations, k is determined such that
    the eigenvalues of A−bk match the entries of p (up to ordering). |

    | est = estim(sys,L) est = estim(sys,L,sensors,known) | Produces a state/output
    estimator est given the plant state-space model sys and the estimator gain L.
    The measured outputs (sensors) and the known inputs (known) can be specified.
    |

    | rsys = reg(sys,K,L) rsys = reg(sys,K,L,sensors,known,controls) | Forms a dynamic
    regulator or compensator rsys given a state-space model sys of the plant, a state-feedback
    gain matrix K, and an estimator gain matrix L. The measured outputs (sensors)
    and the known inputs (known) can be specified. |


    ### LQG Design Commands


    | Command | Description |

    | --- | --- |

    | [K, S, e] = lqr(A,B,Q,R) [K, S, e] = lqr(A,B,Q,R,N) | Calculates the LQ-optimal
    gain for continuous models. |

    | [K, S, e] = dlqr(a,b,Q,R) [K, S, e] = dlqr(a,b,Q,R,N) | Calculates the LQ-optimal
    gain for discrete models. |

    | [K,S,e] = lqry(sys,Q,R) [K,S,e] = lqry(sys,Q,R,N) | Calculates the LQ-optimum
    gain with weighted output. |

    | [Kd,S,e] = lqrd(A,B,Q,R,Ts) [Kd,S,e] = lqrd(A,B,Q,R,N,Ts) | Calculates the discrete
    LQ gain for continuous models. |

    | [kest,L,P] = kalman(sys,Qn,Rn,Nn) [kest,L,P,M,Z] = kalman(sys,Qn,Rn,Nn) | Computes
    the Kalman estimator for continuous and discrete models. |

    | [kest,L,P,M,Z] = kalmd(sys,Qn,Rn,Ts) | Computes the discrete Kalman estimator
    for continuous models. |

    | rlqg = lqgreg(kest,k) rlqg = lqgreg(kest,k,controls) | Forms the linear-quadratic-Gaussian
    (LQG) regulator by connecting the Kalman estimator designed with kalman and the
    optimal state-feedback gain designed with lqr, dlqr or lqry. |'
  trans: "\n# 频率响应命令\n\n| 命令 | 描述 |\n| --- | --- |\n| `S = allmargin(sys)` | 计算单输入单输出开环模型`sys`的增益裕度、相位裕度、延迟裕度以及相应的穿越频率。\
