    MATLAB 命令是在命令窗口中，用户输入提示符 `»` 的右侧输入的，命令的响应将出现在紧接的下方行中。退出响应后，用户输入提示符会重新显示，允许您输入更多条目（图
    1-13）。


    ![A978-1-4842-0289-0_1_Fig13_HTML.jpg](img/A978-1-4842-0289-0_1_Fig13_HTML.jpg)


    图 1-13.


    当在命令窗口中向 MATLAB 输入内容且结果未赋值给变量时，返回的响应将以表达式 `ans =` 开头，如图 1-13 上方所示。如果结果被赋值给一个变量，那么我们可以将该变量用作后续输入的参数。图
    1-13 中的变量 `v` 就是这种情况，它随后被用作指数运算的输入。


    要运行 MATLAB 命令，只需输入命令并按回车键。如果在输入末尾加上分号，程序会执行计算并将其保存在内存（工作区）中，但不会在屏幕上显示结果（参见图 1-13
    中的第一个条目）。输入提示符 `»` 出现，表示您可以输入新命令。


    与 C 编程语言一样，MATLAB 区分大小写；例如，`Sin(x)` 与 `sin(x)` 是不同的。所有内置函数的名称都以小写字符开头。命令、变量或函数的名称中不应包含空格。在其他情况下，空格会被忽略，并且可以用来使输入更具可读性。可以通过用逗号分隔多个条目来在同一命令行中输入它们，并在最后一个条目末尾按回车键（见图
    1-14）。如果在行中某个条目的末尾使用了分号，则其对应的输出将不会显示。


    ![A978-1-4842-0289-0_1_Fig14_HTML.jpg](img/A978-1-4842-0289-0_1_Fig14_HTML.jpg)


    图 1-14.


    描述性注释可以通过以 `%` 符号开头输入到命令输入行中。当您运行输入时，MATLAB 会忽略注释并处理其余代码（见图 1-15）。


    ![A978-1-4842-0289-0_1_Fig15_HTML.jpg](img/A978-1-4842-0289-0_1_Fig15_HTML.jpg)


    图 1-15.


    为了简化由 MATLAB 解释器（通过命令窗口提示符）评估的脚本的输入过程，您可以使用箭头键。例如，如果您按一次向上箭头键，将恢复您提交的最后一条条目。如果您按两次向上键，将恢复您提交的倒数第二条条目，依此类推。


    如果您在输入区域中键入一串字符，然后按向上箭头键，将恢复您提交的、以指定字符串开头的最后一条条目。


    在 MATLAB 会话期间输入的命令会临时存储在缓冲区（工作区）中，直到您结束会话，届时它们可以保存到文件中或永久丢失。


    以下是可在 MATLAB 输入区域（命令行）中使用的键及其功能的总结：


    | 向上箭头 (Ctrl-P) | 检索上一个条目。 |

    | 向下箭头 (Ctrl-N) | 检索下一个条目。 |

    | 向左箭头 (Ctrl-B) | 将光标向左移动一个字符。 |

    | 向右箭头 (Ctrl-F) | 将光标向右移动一个字符。 |

    | CTRL-向左箭头 | 将光标向左移动一个单词。 |

    | CTRL-向右箭头 | 将光标向右移动一个单词。 |

    | 起始键 (Ctrl-A) | 将光标移动到行首。 |

    | 结束键 (Ctrl-E) | 将光标移动到当前行末尾。 |

    | 退出键 | 清除命令行。 |

    | 删除键 (Ctrl-D) | 删除光标指示的字符。 |

    | 退格键 | 删除光标左侧的字符。 |

    | CTRL-K | 删除（剪切）当前行。 |


    命令 `clc` 可以清除命令窗口，但不会删除工作区的内容（内容仍保留在内存中）。


