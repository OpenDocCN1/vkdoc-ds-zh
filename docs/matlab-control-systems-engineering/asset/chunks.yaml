    \n### 练习 3-2\n\n找出下面定义的 MIMO 系统 `H(z)` 的离散传递函数，其中采样时间为 0.2 秒。\n\n![A978-1-4842-0289-0_3_Figat_HTML.jpg](img/A978-1-4842-0289-0_3_Figat_HTML.jpg)\n\
