  raw: '### Logical Functions


    MATLAB implements logical functions whose output can take the value true (1) or
    false (0). The following table shows the most important logical functions.


    | exist(A) | Checks if the variable or function exists (returns 0 if A does not
    exist and a number between 1 and 5, depending on the type, if it does exist).
    |

    | any(V) | Returns 0 if all elements of the vector V are null and returns 1 if
    some element of V is non-zero. |

    | any(A) | Returns 0 for each column of the matrix A with all null elements and
    returns 1 for each column of the matrix A which has non-null elements. |

    | all(V) | Returns 1 if all the elements of the vector V are non-null and returns
    0 if some element of V is null. |

    | all(A) | Returns 1 for each column of the matrix A with all non-null elements
    and returns 0 for each column of the matrix A with at least one null element.
    |

    | find (V) | Returns the places (or indices) occupied by the non-null elements
    of the vector V. |

    | isnan (V) | Returns 1 for the elements of V that are indeterminate and returns
    0 for those that are not. |

    | isinf (V) | Returns 1 for the elements of V that are infinite and returns 0
    for those that are not. |

    | isfinite (V) | Returns 1 for the elements of V that are finite and returns 0
    for those that are not. |

    | isempty (A) | Returns 1 if A is an empty array and returns 0 otherwise (an empty
    array is an array such that one of its dimensions is 0). |

    | issparse (A) | Returns 1 if A is a sparse matrix and returns 0 otherwise. |

    | isreal (V) | Returns 1 if all the elements of V are real and 0 otherwise. |

    | isprime (V) | Returns 1 for all elements of V that are prime and returns 0 for
    all elements of V that are not prime. |

    | islogical (V) | Returns 1 if V is a logical vector and 0 otherwise. |

    | isnumeric (V) | Returns 1 if V is a numeric vector and 0 otherwise. |

    | ishold | Returns 1 if the properties of the current graph are retained for the
    next graph and only new elements will be added and 0 otherwise. |

    | isieee | Returns 1 if the computer is capable of IEEE standard operations. |

    | isstr (S) | Returns 1 if S is a string and 0 otherwise. |

    | ischart (S) | Returns 1 if S is a string and 0 otherwise. |

    | isglobal (A) | Returns 1 if A is a global variable and 0 otherwise. |

    | isletter (S) | Returns 1 if S is a letter of the alphabet and 0 otherwise. |

    | isequal (A, B) | Returns 1 if the matrices or vectors A and B are equal, and
    0 otherwise. |

    | ismember(V, W) | Returns 1 for every element of V which is in W and 0 for every
    element V that is not in W. |


    Below are some examples using the above defined logical functions.


    `>> V = [1,2,3,4,5,6,7,8,9], isprime(V), isnumeric(V), all(V), any(V)`


    `V =`


    `1     2     3     4     5     6     7     8     9`


    `ans =`


    `0     1     1     0     1     0     1     0     0`


    `ans =`


    `1`


    `ans =`


    `1`


    `ans =`


    `1`


    `>> B = [Inf, -Inf, pi, NaN], isinf(B), isfinite(B), isnan(B), isreal(B)`


    `B =`


    `Inf - Inf 3.1416 NaN`


    `ans =`


    `1 1 0 0`


    `ans =`


    `0 0 1 0`


    `ans =`


    `0 0 0 1`


    `ans =`


    `1`


    `>> ismember ([1,2,3], [8,12,1,3]), A = [2,0,1];B = [4,0,2]; isequal (2A * B)`


    `ans =`


    `1 0 1`


    `ans =`


    `1`


