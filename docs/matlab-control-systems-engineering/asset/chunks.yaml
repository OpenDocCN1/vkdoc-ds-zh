  trans: '

    ### 响应时间命令


    | 命令 | 描述 |

    | --- | --- |

    | `[u, t] = gensig(type, tau)`<br>`[u, t] = gensig(type, tau, Tf, Ts)` | 生成一个标量信号
    `u`，其类型为 `type`，周期为 `tau`（以秒为单位）。`type` 可以是 `sine`、`square` 或 `pulse`。同时指定信号的持续时间
    `Tf` 以及时间样本 `t` 之间的间隔 `Ts`。 |

    | `impulse(sys)`<br>`impulse(sys, t)`<br>`impulse(sys1, sys2, ..., sysN)`<br>`impulse(sys1,
    sys2, ..., sysN, t)`<br>`impulse(sys1, ''PlotStyle1'', ..., sysN, ''PlotStyleN'')`<br>`[y,
    t, x] = impulse(sys)` | 计算并绘制模型 `sys` 的脉冲响应。使用用户提供的时间向量 `t` 进行仿真。计算并绘制多个模型的脉冲响应。使用用户提供的时间向量
    `t` 进行仿真，计算并绘制多个模型的脉冲响应。此外还可以设置图形样式。返回模型 `sys` 脉冲响应的时间 `t` 的长度、输出数量和输入数量。 |

    | `initial(sys, x0)`<br>`initial(sys, x0, t)`<br>`initial(sys1, sys2, ..., sysN,
    x0)`<br>`initial(sys1, sys2, ..., sysN, x0, t)`<br>`initial(sys1, ''PlotStyle1'',
    ..., sysN, ''PlotStyleN'', x0)`<br>`[y, t, x] = initial(sys, x0)` | 计算并绘制状态空间模型
    `sys` 或多个模型在初始条件 `x0` 下的无外力响应。可以提供用户指定的时间向量 `t` 以及特定的图形样式。还可以获取模型 `sys` 无外力响应的时间
    `t` 的长度、输出数量和输入数量。 |

    | `lsim(sys, u, t)`<br>`lsim(sys, u, t, x0)`<br>`lsim(sys, u, t, x0, ''zoh'')`<br>`lsim(sys,
    u, t, x0, ''foh'')`<br>`lsim(sys1, sys2, ..., sysN, u, t)`<br>`lsim(sys1, sys2,
    ..., sysN, u, t, x0)`<br>`lsim(sys1, ''PlotStyle1'', ..., sysN, ''PlotStyleN'',
    u, t)`<br>`[y, t, x] = lsim(sys, u, t, x0)` | 计算并绘制状态空间模型 `sys` 或多个模型在初始条件 `x0`
    下的时间响应。可以提供用户指定的时间样本 `t` 以及特定的图形样式。选项 `zoh` 和 `foh` 指定了输入值在样本之间的插值方式（分别为零阶保持或线性插值）。还可以获得输出响应
    `y`、用于仿真的时间向量 `t` 以及状态轨迹 `x`。 |

    | `step(sys)`<br>`step(sys, t)`<br>`step(sys1, sys2, ..., sysN)`<br>`step(sys1,
    sys2, ..., sysN, t)`<br>`step(sys1, ''PlotStyle1'', ..., sysN, ''PlotStyleN'')`<br>`[y,
    t, x] = step(sys)` | 计算并绘制 LTI 模型 `sys` 或多个模型的阶跃响应。可以提供用户指定的时间样本 `t` 以及特定的图形样式。还可以获得输出响应
    `y`、用于仿真的时间向量 `t` 以及状态轨迹 `x`。 |

    | `ltiview`<br>`ltiview(sys1, sys2, ..., sysn)`<br>`ltiview(''plottype'', sys1,
    sys2, ..., sysn)`<br>`ltiview(''plottype'', sys, extras)`<br>`ltiview(''clear'',
    viewers)`<br>`ltiview(''current'', sys1, sys2, ..., sysn, viewers)` | 打开 LTI 查看器，用于对一个或多个系统进行
    LTI 系统响应分析，并提供由 `plottype`（`''step''`、`''impulse''`、`''initial''`、`''lsim''`、`''pzmap''`、`''bode''`、`''nyquist''`、`''nichols''`
    和 `''sigma''`）定义的不同图形选项。 |


    第一个示例是生成并绘制一个周期为 5 秒、持续时间为 30 秒、采样间隔为 0.1 秒的方波信号（参见图 3-22）。


    ```

    >> [u,t] = gensig(''square'',5,30,0.1);

    >> plot(t,u)

    axis([0 30-1 2])

    ```


    ![A978-1-4842-0289-0_3_Fig22_HTML.jpg](img/A978-1-4842-0289-0_3_Fig22_HTML.jpg)


    图 3-22.


