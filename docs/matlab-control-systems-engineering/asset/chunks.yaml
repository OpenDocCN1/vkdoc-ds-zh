    \ |\n| `.^` | 向量的幂运算（`A.^B = [A(i,j)^(B(i,j))]`，对于向量 `A` 和 `B`） |\n\n标量和向量之间的简单数学运算根据定义的操作将标量应用于向量的所有元素，而向量之间的简单运算符是逐元素执行的。以下是这些运算符的规范：\n\
    \n| `a = {a1, a2,..., an}`, `b = {b1, b2,..., bn}`, `c = 标量` | |\n| --- | ---\
    \ |\n| `a + c = [a1+c, a2+c,..., an+c]` | 标量与向量的加法 |\n| `a * c = [a1*c, a2*c ,...,\
    \ an*c]` | 标量与向量的乘法 |\n| `a + b = [a1+b1, a2+b2, ..., an+bn]` | 两个向量的加法 |\n| `a.*b\
    \ = [a1*b1, a2*b2, ..., an*bn]` | 两个向量的乘法 |\n| `a./b = [a1/b1, a2/b2, ..., an/bn]`\
