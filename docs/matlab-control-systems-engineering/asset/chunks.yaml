    | --- | --- |

    | `sysd = c2d(sys,Ts)` `sysd = c2d(sys,Ts,method)` `[sysd, G] = c2d(sys,Ts,method)`
    | Converts a continuous model `sys` to a discrete model `sysd` using zero-order
    hold on the inputs and a sample time of `Ts` seconds. Converts a continuous model
    `sys` to a discrete model `sysd` using zero-order hold on the inputs and a sample
    time of `Ts` seconds using the specified method of discretization. The method
    can be zero-order hold (`zoh`), triangle approximation (`foh`), impulse invariant
    discretization (`impulse`), Bilinear (Tustin) (`tustin`) or zero-pole matching
    (`matched`). In addition to the above, returns a matrix `G` that maps the continuous
    initial conditions `x0` and `u0` of the state-space model `sys` to the discrete-time
    initial state vector `x[0]`. The possible methods of discretization are described
    above. |

    | `sys = chgFreqUnit(sys,units)` | Changes units of the frequency points in `sys`
    to new units given by `units`. |

    | `sysc = d2c(sysd)` `sysc = d2c(sysd,method)` | Converts a discrete model `sysd`
    to a continuous model `sysc` using zero-order hold on the inputs. Converts a discrete
    model `sysd` to a continuous model `sysc` using the conversion method given by
    `method`. The possible methods of conversion are `zoh`, `foh`, `tustin` and `matched`
    (see above). |

    | `sys1 = d2d(sys,Ts)` | Resamples the discrete-time model `sys` to produce an
    equivalent discrete-time model `sys1` with new sample time `Ts`. |

    | `sys = delay2z(sys)` | Replaces delays of discrete-time TF, SS or ZPK models
    by poles at `z=0`, or replaces delays of FRD models by phase shift. [Note: more
    recent versions of MATLAB have replaced `delay2z` by `absorbDelay`. |

    | `sys = frd(r,f)` `sys = frd(r,f,Ts)` `sys = frd` `sys = frd(r,f,ltisys)` `sysfrd
    = frd(sys,f)` `sysfrd = frd(sys,f,units)` | Creates an FRD model `sys` from the
    frequency response data stored in the array `r`. The vector `f` represents the
    underlying frequencies for the frequency response data. Creates a discrete-time
    FRD model with sample time `Ts` in seconds. Creates an empty FRD model. Creates
    an FRD model which inherits the generic properties of the LTI model `ltisys`.
    Converts a TF, SS or ZPK model to an FRD model with frequencies `f`. Converts
    a TF, SS or ZPK model to an FRD model with frequencies `f` specifying the units
    (`''rad/s''` or `''Hz''`). |

    | `[num, den] = pade(T,N)` `pade(T,N)` `sysx = pade(sys,N)` `sysx = pade(sys,Nu,Ny,NINT)`
    | Returns the Padé approximation of order `N` of the continuous-time I/O delay
    `exp(–sT)` in transfer function form. The row vectors `num` and `den` contain
    the numerator and denominator coefficients in descending powers of `s`. Both are
    `N`th-order polynomials. Plots the step and phase responses of the `N`th-order
    Padé approximation and compares them with the exact responses of the model with
    I/O delay `T`. Produces a delay-free approximation `sysx` of the continuous delay
    system `sys`. All delays are replaced by their `N`th-order Padé approximation.
    Specifies independent approximation orders for each input, output, and I/O or
    internal delay. Here `NU`, `NY` and `NINT` are integer arrays: `NU` is the vector
    of approximation orders for the input channel; `NY` is the vector of approximation
    orders for the output channel; `NINT` is the approximation order for I/O delays
    (TF or ZPK models) or internal delays (state-space models). |

    | `sys = reshape(sys,s1,s2,...,sk)` `sys = reshape(sys,[s1s2... sk])` | Reshapes
