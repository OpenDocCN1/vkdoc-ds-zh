    \ distributed random decimal numbers from the interval [0,1]. |\n| `rand(m, n)`\
    \ | Returns an array of dimension `m×n` whose elements are uniformly distributed\
    \ random decimal numbers from the interval [0,1]. |\n| `rand(size(a))` | Returns\
    \ an array of the same size as the matrix `A` and whose elements are uniformly\
    \ distributed random decimal numbers from the interval [0,1]. |\n| `rand('seed')`\
    \ | Returns the current value of the uniform random number generator seed. |\n\
    | `rand('seed',n)` | Assigns to `n` the current value of the uniform random number\
    \ generator seed. |\n| `randn` | Returns a normally distributed random decimal\
    \ number (mean 0 and variance 1). |\n| `randn(n)` | Returns an array of dimension\
    \ `n×n` whose elements are normally distributed random decimal numbers (mean 0\
    \ and variance 1). |\n| `randn(m, n)` | Returns an array of dimension `m×n` whose\
    \ elements are normally distributed random decimal numbers (mean 0 and variance\
    \ 1). |\n| `randn(size(a))` | Returns an array of the same size as the matrix\
    \ `A` and whose elements are normally distributed random decimal numbers (mean\
    \ 0 and variance 1). |\n| `randn('seed')` | Returns the current value of the normal\
    \ random number generator seed. |\n| `randn('seed',n)` | Assigns to `n` the current\
    \ value of the uniform random number generator seed. |\n\nHere are some examples:\n\
    \n```\n>>  [rand, rand (1), randn, randn (1)]\nans =\n    0.9501    0.2311   -0.4326\
    \   -1.6656\n```\n\n```\n>>  [rand(2), randn(2)]\nans =\n    0.6068    0.8913\
    \             0.1253   -1.1465\n    0.4860    0.7621             0.2877    1.1909\n\
    ```\n\n```\n>>  [rand(2,3), randn(2,3)]\nans =\n    0.3529 0.0099 0.2028   -0.1364\
    \ 1.0668-0.0956\n    0.8132 0.1389 0.1987 0.1139 0.0593 - 0.8323\n```\n\n### Operators\n\
    \nMATLAB features arithmetic, logical, relational, conditional and structural\
    \ operators."
