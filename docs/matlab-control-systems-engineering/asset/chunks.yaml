    ### 其他进制


    MATLAB 允许你使用任意进制处理数字，前提是安装了扩展的符号数学工具箱。它还允许你用不同进制表示各种数字。这是通过以下函数实现的：


    | `dec2base(十进制数, n_base)` | 将指定的十进制数转换为新进制 `n_base`。 |

    | `base2dec(数字, b)` | 将给定进制 `b` 的数字转换为十进制数。 |

    | `dec2bin(十进制数)` | 将指定的十进制数转换为 2 进制（二进制）。 |

    | `dec2hex(十进制数)` | 将指定的十进制数转换为 16 进制（十六进制）。 |

    | `bin2dec(二进制数)` | 将指定的二进制数转换为十进制。 |

    | `hex2dec(十六进制数)` | 将指定的 16 进制数转换为十进制。 |


    下面是一些示例。


    将二进制数 100101 转换为十进制表示。


    ```

    >> base2dec(''100101'',2)

    ans =

    37.00

    ```


    将十六进制数 FFFFAA00 转换为十进制表示。


    ```

    >> base2dec(''FFFFAA0'', 16)

    ans =

    268434080.00

    ```


    将十六进制运算 FFFAA2+FF-1 的结果用十进制表示。


    ```

    >> base2dec(''FFFAA2'',16) + base2dec(''FF'',16)-1

    ans =

    16776096.00

    ```


    ### 实数


    众所周知，实数集是有理数集和无理数集的不交并。有理数是形如 `p/q` 的数，其中 `p` 和 `q` 是整数。换句话说，有理数是可表示为两个整数之商的数。MATLAB
    处理有理数的方式与大多数计算器不同。如果我们让计算器计算 `1/2 + 1/3 + 1/4` 的和，大多数会返回类似 `1.0833` 的结果，这仅仅是结果的一个近似值。


    有理数是整数之比，MATLAB 可以以精确模式处理它们，因此涉及有理数的算术表达式的结果总是以两个整数之比的形式精确给出。要启用此功能，请使用命令 `format
    rat` 激活有理数格式。如果读者希望，MATLAB 也可以通过激活任何其他类型的格式（例如 `format short` 或 `format long`）来返回十进制形式的结果。MATLAB
    在精确模式下计算上述和的方式如下：


    ```

    >> format rat

    >> 1/2 + 1/3 + 1/4

    ans =

    13/12

    ```


    与计算器不同，MATLAB 通过将有理数保持为整数比的形式，确保其与有理数的运算是精确的。这样，分数计算就不会受到舍入误差的影响，正如误差理论所证明的那样，这些误差可能变得非常严重。注意，一旦启用有理数格式，当
    MATLAB 相加两个有理数时，结果会以整数比的形式符号化返回，并且对有理数的运算将继续保持精确，直到调用另一种格式为止。


    如果启用了有理数格式，一个浮点数（即带有小数点的数字）将被解释为精确值。因此，浮点表达式将被解释为精确的有理表达式，而有理表达式中的任何无理数都将由适当的有利近似值来表示。


    ```

    >> format rat

    >> 10/23 + 2.45/44

    ans =

    1183 / 2412

    ```


    实数的另一个基本子集是无理数集，由于其特殊性质，无理数在数值计算中一直带来困难。无法在数值模式（使用十进制计数系统中的十位数字）下精确表示无理数是大多数问题的根源。MATLAB
    以用户可以按需设置的精度来表示结果。根据定义，无理数不能精确表示为两个整数之比。如果命令 MATLAB 计算 17 的平方根，默认情况下它会返回数字 5.1962。


    ```

    >> sqrt(27)

    ans =

    5.1962

    ```


    MATLAB 包含以下常见的无理常数和概念：


    | `pi` | 圆周率 π = 3.1415926... |

    | `exp(1)` | 自然常数 e = 2.7182818... |

    | `Inf` | 无穷大（例如，遇到 `1/0` 时返回）。 |

    | `NaN` | 不确定性（例如，遇到 `0/0` 时返回）。 |

    | `realmin` | 返回 IEEE 双精度下最小的可能标准化浮点数。 |

    | `realmax` | 返回 IEEE 双精度下最大的有限浮点数。 |


    以下示例说明了 MATLAB 如何输出这些数字和概念。


    ```

    >> long format

    >> pi

    ans =

    3.14159265358979


    >> exp(1)

    ans =

    2.71828182845905


    >> 1/0

    Warning: Divide by zero.

    ans =

    Inf


    >> 0/0

    Warning: Divide by zero.

    ans =

    NaN


    >> realmin

    ans =

    2.225073858507201e-308


    >> realmax

    ans =

    1.797693134862316e+308

    ```


    ### 实参数函数


    有理数集和无理数集的不交并就是实数集。反过来，有理数集以整数集为其子集。所有适用于实数参数的函数也同样适用于整数和有理数。MATLAB 提供了全套预定义函数，其中大部分将在本书后续章节中讨论。在
    MATLAB 提供的实参数函数组中，以下是最重要的：


    **三角函数**


    | 函数 | 反函数 |

    | --- | --- |

    | `sin(x)` | `asin(x)` |

    | `cos(x)` | `acos(x)` |

    | `tan(x)` | `atan(x)` 和 `atan2(y,x)` |

    | `csc(x)` | `acsc(x)` |

    | `sec(x)` | `asec(x)` |

    | `cot(x)` | `acot(x)` |


    **双曲函数**


    | 函数 | 反函数 |

    | --- | --- |

    | `sinh(x)` | `asinh(x)` |

    | `cosh(x)` | `acosh(x)` |

    | `tanh(x)` | `atanh(x)` |

    | `csch(x)` | `acsch(x)` |

    | `sech(x)` | `asech(x)` |

    | `coth(x)` | `acoth(x)` |


    **指数和对数函数**


    | 函数 | 含义 |

    | --- | --- |

    | `exp(x)` | 以 e 为底的指数函数（`e^x`）。 |

    | `log(x)` | x 的自然对数（以 e 为底）。 |

    | `log10(x)` | x 的以 10 为底的对数。 |

    | `log2(x)` | x 的以 2 为底的对数。 |

    | `pow2(x)` | 2 的 x 次幂。 |

    | `sqrt(x)` | x 的平方根。 |


    **数值变量特定函数**


    | 函数 | 含义 |

    | --- | --- |

    | `abs(x)` | x 的绝对值。 |

    | `floor(x)` | 小于或等于 x 的最大整数。 |

    | `ceil(x)` | 大于或等于 x 的最小整数。 |

    | `round(x)` | 最接近 x 的整数。 |

    | `fix(x)` | 去掉 x 的小数部分。 |

    | `rem(a,b)` | 返回 a 除以 b 的余数。 |

    | `sign(x)` | 返回 x 的符号（如果 x > 0，则返回 1；如果 x = 0，则返回 0；如果 x < 0，则返回 -1）。 |


    以下是一些示例：


    ```

    >> sin(pi/2)

    ans =

    1


    >> asin(1)

    ans =

    1.57079632679490


    >> log(exp(1)³)

    ans =

    3.00000000000000

    ```


    函数 `round` 在以下两个示例中演示：


    ```

    >> round(2.574)

    ans =

    3


    >> round(2.4)

    ans =

    2

    ```


    函数 `ceil` 在以下两个示例中演示：


    ```

    >> ceil(4.2)

    ans =

    5


    >> ceil(4.8)

    ans =

    5

    ```


    函数 `floor` 在以下两个示例中演示：


    ```

    >> floor(4.2)

    ans =

    4


    >> floor(4.8)

    ans =

    4

    ```


    fix 函数只是去掉实数的分数部分：


    ```

    >> fix(5.789)

    ans =

    5

    ```

