  trans: '

    ### 模型构建命令 - MPC mod 格式


    | `model = addmd (pmod, dmod)` | 向采用 MPC mod 格式的装置模型添加一个或多个可测扰动。 |

    | `pmod = addmod (mod1, mod2)` | 组合两个采用 MPC mod 格式的模型，使得其中一个模型的输出与另一个模型的操作输入相结合。
    |

    | `model = addumd (pmod, dmod)` | 向采用 MPC mod 格式的装置模型添加一个或多个不可测扰动。 |

    | `pmod = appmod (mod1, mod2)` | 附加两个模型以形成一个组合模型，该组合模型保留原始模型的输入和输出。 |

    | `pmod = paramod (mod1, mod2)` | 通过连接两个模型的输出来并联放置它们。 |

    | `pmod = sermod (mod1, mod2)` | 通过将一个模型的输出连接到另一个模型的输出来串联放置两个模型。 |


    ### 控制设计与仿真命令 - MPC step 格式


    | `yp = cmpc(plant,model,ywt,uwt,M,P,tend,r) [yp,u,ym] = cmpc(plant,model,ywt,uwt,M,P,tend,...)`
    | 使用采用 MPC step 格式的模型，模拟对操作变量和/或输出具有硬约束的闭环系统。通过二次规划求解 MPC 优化问题。 |

    | `[clmod] = mpccl(plant,model,Kmpc) [clmod,cmod] = mpccl(plant,model,Kmpc,tfilter,…
    dplant, dmodel)` | 组合采用 MPC step 格式的装置模型和控制器模型，生成一个采用 MPC mod 格式的闭环系统模型。 |

    | `KMPC = mpccon (model) KMPC = mpccon (model, ywt uwt, M, P)` | 使用采用 MPC step
    格式的模型计算 MPC 控制器增益。 |

    | `yp = mpcsim(plant,model,Kmpc,tend,r) [yp,u,ym] = mpcsim(plant,model,Kmpc,tend,r,usat,…
    tfilter, dplant, dmodel, dstep)` | 使用采用 MPC step 格式的模型，模拟对操作变量具有饱和约束的闭环系统。 |

    | `nlcmpc` | 模型预测控制器，用于使用采用 MPC step 格式的线性模型，对表示为 Simulink S-函数的非线性装置，模拟对操作变量和/或控制变量具有硬约束的闭环系统。
    |

    | `nlmpcsim` | 模型预测控制器，用于使用采用 MPC step 格式的线性模型，对表示为 Simulink S-函数的非线性装置，模拟对操作变量具有饱和约束的闭环系统。
    |


    ### 控制设计与仿真命令 - MPC mod 格式


    | `yp = scmpc(pmod,imod,ywt,uwt,M,P,tend,r) [yp,u,ym] = scmpc(pmod,imod,ywt,uwt,M,P,tend,
    … r,ulim,ylim,Kest,z,d,w,wu)` | 使用采用 MPC mod 格式的模型，模拟对操作变量和/或输出具有硬约束的闭环系统。通过二次规划求解
    MPC 优化问题。 |

    | `[clmod,cmod] = smpccl(pmod,imod,Ks) [clmod,cmod] = smpccl(pmod,imod,Ks,Kest)`
    | 组合采用 MPC mod 格式的装置模型和控制器模型，生成一个采用 MPC 格式的闭环系统模型。 |

    | `Ks = smpccon(imod) Ks = smpccon(imod,ywt,uwt,M,P)` | 使用采用 MPC mod 格式的模型计算 MPC
    控制器增益。 |

    | `[Kest] = smpcest(imod,Q,R)` | 设置一个状态估计器增益矩阵，用于使用采用 MPC mod 格式的模型进行 MPC 控制器设计和仿真流程。
    |

    | `yp = smpcsim(pmod,imod,Ks,tend,r) [yp,u,ym] = smpcsim(pmod,imod,Ks,tend,r,usat,…
    Kest, z, d, w, wu)` | 使用采用 MPC mod 格式的模型，模拟对操作变量具有饱和约束的闭环系统。 |


    ### 脚本分析命令


    | `frsp = mod2frsp(mod,freq) [frsp,eyefrsp] = mod2frsp(mod,freq,out,in,balflg)`
    | 计算采用 MPC mod 格式的系统的复数频率响应。 |

    | `g = smpcgain(mod) poles = smpcpole(mod)` | 计算采用 MPC mod 格式的系统的稳态增益矩阵或极点。 |

    | `[sigma, omega] = svdfrsp (vmat)` | 计算变矩阵的奇异值，例如由 `mod2frsp` 生成的频率响应。 |


    ## 鲁棒控制系统：鲁棒控制工具箱


    鲁棒控制工具箱为鲁棒多变量控制系统的设计与分析提供了工具。它涵盖可以对误差进行建模的系统，以及具有不确定元素或其参数在产品生命周期内可能发生变化的动力学系统。该工具箱中包含的强大算法允许您执行复杂计算，可以处理参数的大量变化。


    该工具箱最重要的特性包括：


    *   基于 LQG 的 H² 和 H∞ 控制（综合）。

    *   多变量频率响应。

    *   状态空间模型的构建。

    *   基于模型转换的奇异值。

    *   高阶模型的降阶。

    *   谱分解与内外分解。


    ### 可选数据结构系统命令


    | `[b1,b2,…,bn] = branch(tr,PATH1,PATH2,…,PATHN)` | 选择性恢复打包在 `mksys` 或树变量中的矩阵。返回的分支由路径
    `PATH1`、`PATH2`、…、`PATHN` 确定。 |

    | `TR = graft(TR1,B) TR = graft(TR1,B,NM)` | 将根分支 `B` 添加到先前由 `tree` 或 `mksys`
    创建的树变量 `TR1` 上。如果 `TR1` 有 N 个分支，则新分支的数字索引为 N+1；其他根分支的数字索引不变。 |

    | `[i,TY,N] = issystem(S)` | 根据变量 `S` 是否为函数 `mksys` 创建的系统，为 `i` 返回 1（真）或 0（假）。同时返回系统类型
    `TY` 和与类型为 `TY` 的系统关联的变量名称数量 `N`，但若 `S` 不是系统，则 `TY = [];` 且 `N = 0`。 |

    | `[i] = istree(T) [i,b] = istree(T,path)` | 检查变量 `T` 是否为树结构。当存在第二个输入参数 `path`
    时，`istree` 函数检查由 `path` 指定的分支是否存在。 |

    | `S = mksys(a,b,c,d) S = mksys(v1,v2,v3,vn, TY)` | 将描述类型为 `TY` 的系统的多个矩阵打包到 MATLAB
    变量 `S` 中，变量名由字符串 `TY` 的值确定的“标准”名称。 |

    | `T = tree(nm,b1,b2,bn)` | 创建一个包含多个变量及其名称的树数据结构 `T`。 |

    | `[VARS,N] = vrsys(NAM)` | 返回一个字符串 `VARS` 和一个整数 `N`，其中 `VARS` 包含与字符串名称 `NAM`
    描述的系统相关联的 N 个矩阵名称的列表（用逗号分隔）。 |


    ### 建模命令


    | `[a,b1,b2,c1,c2,d11,d12,d21,d22] = … augss(ag,bg,aw1,bw1,aw2,bw2,aw3,bw3) [a,b1,b2,c1,c2,d11,d12,d21,d22]
    = … augss(ag,bg,aw1,bw1,aw2,bw2,aw3,bw3,w3poly) [a,b1,b2,c1,c2,d11,d12,d21,d22]
    = … augtf(ag,bg,cg,dg,w1,w2,w3) [tss] = augss(ssg,ssw1,ssw2,ssw3,w3poly) [tss]
    = augtf(ssg,w1,w2,w3) [tss] = augss(ssg,ssw1,ssw2,ssw3)` | 用于加权混合灵敏度 H² 和 H∞ 设计的状态空间或传递函数装置增广。
    |

    | `[acl,bcl,ccl,dcl] = interc(a,b,c,d,m,n,f) [sscl] = interc(ss,m,n,f)` | 系统多变量通用互联。
    |

