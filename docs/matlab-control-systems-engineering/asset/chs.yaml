- "# 3. 控制系统\n\n## 控制系统简介\n\n`MATLAB` 提供了一个集成环境，您可以在其中设计控制系统。图 3-1 中的图示展示了工程问题如何引导模型的开发与实验数据的分析，进而促成控制系统的设计与仿真。对这些系统的后续分析又会带来设计的进一步修改，这种开发循环最终促成高效系统的快速原型制作与实现。\n\
  \n![A978-1-4842-0289-0_3_Fig1_HTML.jpg](img/A978-1-4842-0289-0_3_Fig1_HTML.jpg)\n\
  \n图 3-1.\n\n`MATLAB` 为技术模型生成、数据分析和算法开发提供了一个高级平台。`MATLAB` 将全面的工程与数学功能同强大的可视化和动画特性相结合，所有这些都集成在一个高级交互式编程语言中。`MATLAB`\
  \ 工具箱扩展了 `MATLAB` 环境，融合了广泛用于控制系统设计的经典与现代技术，提供了由国际公认专家开发的前沿控制算法。\n\n`MATLAB` 包含超过\
  \ 600 个数学、统计和工程函数，提供了分析数据、开发算法和优化系统性能所需的数值计算能力。使用 `MATLAB`，您可以快速迭代设计，并比较不同控制策略的性能。此外，`MATLAB`\
  \ 是一种高级编程语言，能让您以远少于 `C`、`C++` 或 `FORTRAN` 的时间开发算法。`MATLAB` 是开放且可扩展的，您可以查看源代码、修改算法并整合现有的\
  \ `C`、`C++` 和 `FORTRAN` 程序。\n\n交互式的 `Control System Toolbox` 工具简化了控制系统的设计与调整。例如，您可以拖拽极点和零点，并立即看到系统如何响应（图\
  \ 3-2）。此外，`MATLAB` 提供了强大的交互式二维和三维图形功能，用于展示数据、方程和结果（图 3-3）。您可以在 `MATLAB` 中使用广泛的可视化辅助工具，或者利用\
  \ `MATLAB` 工具箱提供的特定控制功能。\n\n![A978-1-4842-0289-0_3_Fig3_HTML.jpg](img/A978-1-4842-0289-0_3_Fig3_HTML.jpg)\n\
  \n图 3-3.\n\n![A978-1-4842-0289-0_3_Fig2a_HTML.jpg](img/A978-1-4842-0289-0_3_Fig2a_HTML.jpg)![A978-1-4842-0289-0_3_Fig2b_HTML.jpg](img/A978-1-4842-0289-0_3_Fig2b_HTML.jpg)\n\
  \n图 3-2.\n\n`MATLAB` 工具箱包含了用 `MATLAB` 语言特定功能编写的应用程序。`MATLAB` 与控制相关的工具箱几乎涵盖了控制设计的所有基本技术，从\
  \ `LQG` 和根轨迹到 `H` 与逻辑模糊方法。例如，可以使用 `Fuzzy Logic Toolbox` 的内置算法添加一个模糊逻辑控制系统设计（图 3-4）。\n\
  \n![A978-1-4842-0289-0_3_Fig4_HTML.jpg](img/A978-1-4842-0289-0_3_Fig4_HTML.jpg)\n\
  \n图 3-4.\n\n对于控制系统而言，最重要的 `MATLAB` 工具箱可分为三大类：建模类（`System Identification Toolbox`）、经典设计与分析产品（`Control\
  \ System Toolbox` 和 `Fuzzy Logic Toolbox`）、设计与高级分析产品（`Robust Control Toolbox`、`Mu-Analysis\
  \ Toolbox`、`LMI Control Toolbox` 和 `Model Predictive Toolbox`）以及优化产品（`Optimization\
  \ Toolbox`）。下图说明了这种分类。\n\n## 控制系统设计与分析：Control System Toolbox\n\n`Control System\
  \ Toolbox` 是一个算法集合，主要以 `M-files` 形式编写，实现了控制系统设计、分析和建模的常用技术。其广泛的服务包括经典和现代的控制设计方法，例如根轨迹、极点配置和\
  \ `LQG` 调节器设计。特定的图形用户界面简化了控制工程的典型任务。该工具箱建立在 `MATLAB` 的基础之上，以便为工程工具提供专用的控制系统。\n\n\
  使用 `Control System Toolbox`，您可以创建线性时不变系统（`LTI`）的模型，其格式可以是传递函数、零极点增益或状态空间。您可以操作离散时间和连续时间系统，并在各种表示形式之间进行转换。您可以计算并绘制时间响应、频率响应和根轨迹。其他函数允许您执行极点配置、最优控制和估计。`Control\
  \ System Toolbox` 是开放且可扩展的，允许您创建自定义的 `M-files` 以满足特定应用需求。\n\n以下是 `Control System\
  \ Toolbox` 的主要特性：\n\n- `LTI Viewer`：一个用于分析和比较 `LTI` 系统的交互式 `GUI`。\n- `SISO Design\
  \ Tool`：一个用于分析和调整单输入/单输出（`SISO`）反馈控制系统的交互式 `GUI`。\n- `GUI Suite`：设置首选项和属性，以完全控制时域和频域图的显示。\n\
  - `LTI` 对象：结构化专用数据，以传递函数、状态空间、零极点增益和频率响应格式简洁地表示模型数据。\n- `MIMO`：支持多输入/多输出（`MIMO`）系统、采样数据系统、连续时间系统和具有时间延迟的系统。\n\
  - 用于连接 `LTI` 模型的函数和运算符：创建复杂的框图（串联、并联和反馈连接）。\n- 支持将离散系统转换为连续系统（以及反向转换）的各种方法。\n- 函数用于以图形方式表示时域和频域系统的解，并通过单个命令比较各种系统。\n\
  - 用于经典和现代控制设计技术的工具，包括根轨迹分析、环路整形、极点配置和 `LQR`/`LQG` 控制。\n\n### 模型构建\n\n`Control System\
  \ Toolbox` 支持四种线性模型的表示：状态空间模型（`SS`）、传递函数（`TF`）、零极点增益模型（`ZPK`）和频率数据模型（`FRD`）。每种模型类型都提供了\
  \ `LTI` 对象。除了模型数据外，`LTI` 对象还可以存储离散时间系统的采样时间、延迟、输入和输出的名称、模型注释以及许多其他细节。使用 `LTI` 对象，您可以将模型作为独立实体进行操作，并使用矩阵类型的运算将它们组合起来。图\
  \ 3-5 展示了一个简单 `LQG` 控制器设计的示例说明。底部的代码片段展示了控制器的设计方式以及闭环系统的创建方式。频率响应图显示了开环系统（红色）和闭环系统（蓝色）之间的比较。\n\
  \n![A978-1-4842-0289-0_3_Fig5_HTML.jpg](img/A978-1-4842-0289-0_3_Fig5_HTML.jpg)\n\
  \n图 3-5.\n\n`Control System Toolbox` 包含一些命令，用于分析和计算模型特性，例如 `I/O` 维度、极点、零点和 `DC`\
  \ 增益。这些命令同时适用于连续时间和离散时间模型。\n\n### 分析与设计\n\n某些任务适合图形化操作，而另一些任务则受益于命令行的灵活性。`Control\
  \ System Toolbox` 旨在兼顾这两种方法，提供一套完整的函数，用于通过命令行或 `GUI` 进行模型的设计与分析。\n\n\n\n### 使用 LTI\
  \ 查看器对模型进行图形化分析\n\n控制系统工具箱的 LTI 查看器是一个图形用户界面，可以简化线性时不变系统的分析（通过在命令窗口中输入`>>ltiview`来加载）。LTI\
  \ 查看器用于同时查看和比较多个线性模型的响应图。它可以生成时域和频域响应图，并检查关键响应参数，例如上升时间、最大超调量和稳定裕度。通过鼠标驱动的交互，您可以为多输入多输出系统选择输入和输出通道。LTI\
  \ 查看器可以同时显示多达六种不同类型的图，包括阶跃响应、脉冲响应、波特图（幅值和相位或仅幅值）、奈奎斯特图、尼科尔斯图、西格玛图和零极点图。右键点击将弹出一个选项菜单，允许您访问多种控制和\
  \ LTI 查看器选项，包括：\n\n*   **绘图类型**：更改绘图类型。\n*   **系统**：在 LTI 查看器中选中或取消选中已加载的任何模型。\n\
  *   **特性**：显示参数和关键响应特性。\n*   **缩放**：放大和缩小图的某些部分。\n*   **网格**：为绘图添加网格。\n*   **属性**：打开属性编辑器，您可以在其中自定义绘图的属性。\n\
  \n除了右键菜单之外，所有响应图都包含数据标记。这些标记允许您扫描绘图数据，识别关键数据，并确定给定绘图的系统字体。使用 LTI 查看器，您可以方便地在一个窗口中，利用阶跃响应图、零极点图和所有频域响应图（波特图、奈奎斯特图、尼科尔斯图和奇异值图）来图形化表示一个或多个系统的解（见图\
  \ 3-6）。LTI 查看器允许您在绘图中显示重要的响应特性，例如使用数据标记显示稳定裕度。\n\n![A978-1-4842-0289-0_3_Fig6_HTML.jpg](img/A978-1-4842-0289-0_3_Fig6_HTML.jpg)\n\
  \n图 3-6.\n\n### 使用命令行分析模型\n\n对于需要图形用户界面驱动环境的广泛应用，LTI 查看器非常适用。对于需要编程、自定义绘图或与 LTI\
  \ 模型无关的数据的情况，控制系统工具箱提供了命令行函数，用于执行控制系统工程中的基本频域绘图和时域分析。这些函数适用于任何类型的线性模型（连续或离散、单输入单输出或多输入多输出）或模型数组。\n\
  \n### 使用 SISO 设计工具进行补偿器设计\n\n控制系统工具箱的 SISO 设计工具是一个图形用户界面，允许您分析和调整单输入单输出控制反馈系统（通过在命令窗口中输入`>>sisotool`来加载）。使用\
  \ SISO 设计工具，您可以结合根轨迹和环路整形技术，以图形方式调整动态特性和补偿器增益。例如，您可以使用根轨迹视图来稳定反馈环路并强制满足最小裕度，并使用波特图来调整带宽、增益和相位裕度，或添加陷波滤波器以抑制干扰。SISO\
  \ 设计图形用户界面可用于连续时间和离散时间被控对象。图 3-7 展示了离散时间被控对象的根轨迹图和波特图。\n\n![A978-1-4842-0289-0_3_Fig7_HTML.jpg](img/A978-1-4842-0289-0_3_Fig7_HTML.jpg)\n\
  \n图 3-7.\n\nSISO 设计工具旨在与 LTI 查看器紧密配合使用，允许您快速迭代设计，并立即在 LTI 查看器中看到结果。当对补偿器进行更改时，与\
  \ SISO 设计工具关联的 LTI 查看器会自动更新所选解的绘图。SISO 设计工具将控制系统工具箱的大部分功能集成在一个单一的图形用户界面中，动态链接时域图、频域图和零极点图，提供互补主题和设计目标的视图，支持在设计视图中进行图形化更改，并帮助管理设计的复杂性和迭代过程。右键菜单和下拉菜单让您只需点击鼠标即可灵活地设计控制器。特别是，可以查看波特图和根轨迹图，放置零点和极点，添加延迟/超前网络和陷波滤波器，用鼠标图形化调整补偿器参数，检查闭环响应（使用\
  \ LTI 查看器），调整增益和相位裕度，并在离散和连续时间之间转换模型。\n\n### 使用命令行进行补偿器设计\n\n除了 SISO 设计工具之外，控制系统工具箱还提供了许多可用于更广泛控制应用的命令，包括用于经典\
  \ SISO 设计的函数（数据缓冲、根轨迹、增益和相位裕度）以及用于现代多输入多输出设计的函数（极点配置、LQR/LQG 方法和卡尔曼滤波）。线性二次型高斯控制是一种现代的用于设计最优动态调节器的状态空间技术，它允许权衡调节收益和控制成本，同时考虑过程扰动和测量噪声。\n\
  \n## 控制系统工具箱命令\n\n控制系统工具箱的命令可根据其用途分类如下：\n\n![A978-1-4842-0289-0_3_Fig8_HTML.jpg](img/A978-1-4842-0289-0_3_Fig8_HTML.jpg)\n\
  \n图 3-8.\n\n\n\n| 常规 |\n| `Ctrlpref`：打开一个图形用户界面，允许您更改控制系统工具箱的偏好设置（参见图 3-8）。 |\n\
  | 线性模型的创建 |\n| `tf`：创建传递函数模型 `zpk`：创建零极点增益模型 `ss`：创建状态空间模型 `dss`：创建描述符状态空间模型 `frd`：创建频率响应数据模型\
  \ `set`：定位并修改 LTI 模型的属性 |\n| 数据提取 |\n| `tfdata`：访问传递函数数据（特别是提取传递函数的分子和分母） `zpkdata`：访问零极点增益数据\
  \ `ssdata`：访问状态空间模型数据 `get`：访问 LTI 模型的属性 |\n| 转换 |\n| `ss`：转换为状态空间模型 `zpk`：转换为零极点增益模型\
  \ `tf`：转换为传递函数模型 `frd`：转换为频率响应数据模型 `c2d`：将模型从连续时间转换为离散时间 `d2c`：将模型从离散时间转换为连续时间 `d2d`：对离散时间模型进行重新采样\
  \ |\n| 系统互联 |\n| `append`：通过附加输入和输出来组合模型 `parallel`：两个模型的并联连接 `series`：两个模型的串联连接\
  \ `feedback`：两个系统的反馈连接 `lft`：两个模型的广义反馈互联 `connect`：动态系统的框图互联 |\n| 动态模型 |\n| `iopzmap`：绘制模型输入/输出对的零极点图\
  \ `bandwidth`：返回系统的频率响应带宽 `pole`：计算动态系统的极点 `zero`：返回 SISO 动态系统的零点和增益 `pzmap`：返回动态系统的零极点图\
  \ `damp`：返回系统极点的固有频率和阻尼比 `dcgain`：返回 LTI 系统的低频（直流）增益 `norm`：返回线性模型的范数 `covar`：返回由白噪声驱动的系统的协方差\
  \ |\n| 时域分析 |\n| `ltiview`：用于 LTI 系统响应分析的 LTI 查看器 `step`：生成动态系统的阶跃响应图 `impulse`：生成动态系统的脉冲响应图\
  \ `initial`：生成状态空间模型的初始条件响应图 `lsim`：模拟动态系统对任意输入的时间响应 |\n| 频域分析 |\n| `ltiview`：用于\
  \ LTI 系统响应分析的 LTI 查看器 `bode`：生成频率响应的伯德图，包括幅值和相位 `sigma`：生成动态系统的奇异值图 `nyquist`：生成频率响应的奈奎斯特图\
  \ `nichols`：生成频率响应的尼科尔斯图 `margin`：返回增益裕度、相位裕度和穿越频率 `allmargin`：返回增益裕度、相位裕度、延迟裕度和穿越频率\
  \ `freqresp`：返回网格上的频率响应 |\n| 经典设计 |\n| `sisotool`：交互式设计和调整 SISO 反馈回路（技术根轨迹和回路整形）\
  \ `rlocus`：动态系统的根轨迹图 |\n| 极点配置 |\n| `place`：MIMO 极点配置设计 `estim`：根据估计器增益形成状态估计器 `reg`：根据状态反馈和估计器增益形成调节器\
  \ |\n| LQR/LQG 设计 |\n| `lqr`：线性二次型调节器 (LQR) 设计 `dlqr`：离散时间状态空间系统的线性二次型 (LQ) 状态反馈调节器\
  \ `lqry`：带输出加权的线性二次型 (LQ) 状态反馈调节器 `lqrd`：连续被控对象的离散线性二次型 (LQ) 调节器 `Kalman`：卡尔曼估计器\
  \ `kalmd`：连续被控对象的离散卡尔曼估计器 |\n| 状态空间模型 |\n| `rss`：生成随机连续测试模型 `drss`：生成随机离散测试模型 `ss2ss`：状态空间模型的状态坐标变换\
  \ `ctrb`：可控性矩阵 `obsv`：可观测性矩阵 `gram`：可控性和可观测性格拉姆矩阵 `minreal`：最小实现或零极点对消 `ssbal`：使用对角相似变换平衡状态空间模型\
  \ `balreal`：基于格拉姆矩阵的状态空间实现输入/输出平衡 `modred`：模型降阶 |\n| 带时间延迟的模型 |\n| `totaldelay`：LTI\
  \ 模型的总组合输入/输出延迟 `delay2z`：将离散时间 TF、SS 或 ZPK 模型的延迟替换为 z=0 处的极点，或替换 FRD 模型的延迟 [注意：在较新版本的\
  \ MATLAB 中，`delay2z` 已被 `absorbDelay` 取代。] `pade`：带时间延迟模型的帕德近似 |\n| 矩阵方程求解器 |\n\
  | `lyap`：求解连续时间李雅普诺夫方程 `dlyap`：求解离散时间李雅普诺夫方程 `care`：求解连续时间代数黎卡提方程 `dare`：求解离散时间代数黎卡提方程\
