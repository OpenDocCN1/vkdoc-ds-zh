  以下 MATLAB 语法用于生成图 4-1 所示的图形：\n\n```\n>> load mlrdat;\n>> [ax, mx, stdx] = autosc\
  \ (x);\n>> mx = [0,0];\nsx = scal(x,mx,stdx);\n>> n = 35;\n[xreg, yreg] = wrtreg\
  \ (sx, y, n);\n>> ninput = 2;\nplotopt = 2;\n[theta, yres] = mlr (xreg, yreg, ninput,\
