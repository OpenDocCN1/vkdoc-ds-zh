  \ |\n| `nlmpcsim` | 模型预测控制器，用于使用采用 MPC step 格式的线性模型，对表示为 Simulink S-函数的非线性装置，模拟对操作变量具有饱和约束的闭环系统。\
  \ |\n\n### 控制设计与仿真命令 - MPC mod 格式\n\n| `yp = scmpc(pmod,imod,ywt,uwt,M,P,tend,r)\
