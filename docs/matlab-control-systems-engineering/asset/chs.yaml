- "# 4. 鲁棒预测控制\n\n## 预测控制策略：模型预测控制工具箱\n\n模型预测控制工具箱是一套完整的工具，可用于实现模型预测控制策略。模型预测控制策略常用于化学工程及其他工业领域。\n\
  \n该工具箱最重要的特性包括：\n\n- 建模、辨识与验证。\n- 支持 MISO（多输入单输出）、MIMO（多输入多输出）、阶跃响应和状态空间模型。\n- 系统分析。\n\
  - 在状态空间、传递函数和阶跃响应模型之间进行转换。\n\n模型预测控制通过近似线性动态被控对象模型，来预测未来的变化以及操作变量的影响。在线优化问题被表述为一个二次规划问题，并使用最新的测量值反复求解。\n\
  \n模型预测控制工具箱包含超过 50 个专门的 MATLAB 函数，帮助您使用模型预测控制方法设计、分析和模拟动态系统。该工具箱支持有限阶跃（或脉冲）响应、离散和连续时间传递函数以及状态空间格式。该工具箱可处理非方系统，并支持多种状态估计技术。模拟工具可在有约束或无约束的情况下测试系统响应。对于模型辨识，该工具箱提供了一个接口，可方便地使用通过系统辨识工具箱开发的模型。\n\
  \n### 辨识命令\n\n| `[mx, ax, stdx] = autosc (x) sx = scal(x,mx) sx = scal(x,mx,stdx)\
  \ rx = rescal(x,mx) rx = rescal(x,mx,stdx)` | 根据输入矩阵或向量 `x` 的列均值（`mx`）和标准差（`stdx`）自动对其进行缩放，并输出\
  \ `mx` 和 `stdx` 作为选项。通过使用 `scal`，输入也可以按照指定的均值和/或标准差进行缩放。`rescal` 将缩放后的数据转换回原始数据。\
  \ |\n| `plant = imp2step(delt,nout,theta1, theta2,…, theta25)` | 以 MPC 阶跃格式构建一个\
  \ MIMO（多输入多输出）模型。每个 `thetai` 是一个对应于输出 `i` 的脉冲响应系数的 `n×m` 矩阵。`n` 是系数的数量，`m` 是输入的数量。`delt`\
  \ 是用于获取脉冲响应系数的采样间隔。`nout` 是输出稳定性指示符。 |\n| `[theta, yres] = mlr (xreg, yreg, ninput)\
  \ [theta, yres] = mlr (xreg yreg, ninput, plotopt, wtheta, wdeltheta)` | 通过多变量最小二乘回归或岭回归，确定多输入单输出系统的脉冲响应系数。`xreg`\
  \ 和 `yreg` 是由 `wrtreg` 等例程生成的输入矩阵和输出向量。`ninput` 是输入的数量。使用最小二乘法确定脉冲响应系数矩阵 `theta`。`theta`\
  \ 的列对应于来自每个输入的脉冲响应系数。可选输出 `yres` 是残差向量，即实际输出与预测输出之间的差值。可选输入包括 `plotopt`、`wtheta`\
  \ 和 `wdeltheta`。如果 `plotopt` 等于 0（默认值），则不生成图形；如果 `plotopt=1`，则生成实际输出和预测输出的图形；如果\
  \ `plotopt=2`，则生成两个图形——实际输出与预测输出图，以及残差图。可以通过标量权重 `wtheta` 和 `wdeltheta` 分别指定对 `theta`\
  \ 平方和 `theta` 变化的惩罚（默认值为 0）。 |\n| `[theta, yres, w, cw, ssqdif] = plsr(xreg,yreg,ninput,lv)\
  \ [theta, yres, w, cw, ssqdif] = plsr(xreg,yreg,ninput,lv, plotopt)` | 通过偏最小二乘法（PLS）确定多输入单输出系统的脉冲响应系数。\
  \ |\n| `yres = validmod (xreg, yreg, theta) yres = validmod (xreg yreg, theta, plotopt)`\
  \ | 验证新数据集上的脉冲响应模型。 |\n| `[xreg, yreg] = wrtreg (x, y, n)` | 为多输入单输出系统写入输入和输出数据矩阵，以便在回归例程\
  \ `mlr` 和 `pls` 中用于确定脉冲响应系数。 |\n\n### 信息矩阵绘制命令\n\n| `mpcinfo(mat)` | 返回关于矩阵 `mat`\
  \ 的类型和大小的信息。 |\n| `plotall(y,u) plotall(y,u,t)` | 绘制模拟过程中的输出和操作变量。输入变量 `y` 和 `u`\
  \ 分别是输出和操作变量的矩阵。（`t` = 周期）。 |\n| `plotfrsp(vmat) plotfrsp(vmat,out,in)` | 将由 `mod2frsp`\
  \ 生成的频率响应绘制为伯德图。`vmat` 是包含数据的数组。 |\n| `ploteach(y) ploteach(y, u) ploteach([ ],\
  \ u) ploteach(y, [], t) ploteach([], u, t) ploteach(y, u, t)` | 在单独的图形上绘制模拟过程中的输出和操作变量。输入变量\
  \ `y` 和 `u` 分别是输出和操作变量的矩阵。（`t` = 周期）。 |\n| `plotstep(plant) plotstep(plant,opt)`\
  \ | 绘制多个阶跃响应。`plant` 是一个由 `mod2step`、`ss2step` 或 `tfd2step` 创建的 MPC 阶跃格式的阶跃响应矩阵。`opt`\
  \ 是一个可选的标量或行向量，允许您选择要绘制的输出。 |\n\n### 模型转换命令\n\n| `c2dmp` | 将状态空间模型从连续时间转换为离散时间。（相当于控制系统工具箱中的\
  \ `c2d`） |\n| `[numd,dend] = cp2dp(num,den,delt) [numd,dend] = cp2dp(num,den,delt,delay)`\
  \ | 将标准 MATLAB 多项式形式的单输入单输出连续时间传递函数（包括可选的时间延迟）转换为采样数据传递函数。（`delt` 是采样周期，`delay`\
  \ 是时间延迟。） |\n| `d2cmp` | 将状态空间模型从离散时间转换为连续时间。（相当于控制系统工具箱中的 `d2c`。） |\n| `newmod\
  \ = mod2mod (oldmod, delt2)` | 更改 MPC mod 格式模型的采样周期。`oldmod` 是现有的 MPC mod 格式模型。`delt2`\
  \ 是模型的新采样周期。 |\n| `[phi,gam,c,d] = mod2ss(mod) [phi,gam,c,d,minfo] = mod2ss(mod)`\
  \ | 从存储在 MPC mod 格式的模型中提取标准离散时间状态空间矩阵和其他信息。 |\n| `plant = mod2step(mod,tfinal) [plant,dplant]\
  \ = mod2step(mod,tfinal,delt2,nout)` | 使用 mod 格式的模型，以 MPC 阶跃格式计算 SISO 或 MIMO 系统的阶跃响应。\
  \ |\n| `g = poly2tfd(num,den) g = poly2tfd(num,den,delt,delay)` | 将标准 MATLAB poly\
  \ 格式的传递函数（连续或离散）转换为 MPC tf 格式。 |\n| `pmod = ss2mod(phi,gam,c,d) pmod = ss2mod(phi,gam,c,d,minfo)`\
  \ | 将离散时间状态空间系统模型转换为 MPC mod 格式。 |\n| `plant = ss2step(phi,gam,c,d,tfinal) plant\
  \ = ss2step(phi,gam,c,d,tfinal,delt1,delt2,nout)` | 使用状态空间格式的模型，以 MPC 阶跃格式计算 SISO\
  \ 或 MIMO 系统的阶跃响应。 |\n| `ss2tf2` | 将状态空间模型转换为传递函数。（相当于控制系统工具箱中的 `ss2tf`。） |\n| `tf2ssm`\
  \ | 将传递函数转换为状态空间模型。（相当于控制系统工具箱中的 `tf2ss`。） |\n| `model = tfd2mod(delt2,ny,g1,g2,g3,…,g25)`\
  \ | 将 MPC tf 格式的传递函数（连续或离散）转换为 MPC mod 格式，必要时转换为离散时间。 |\n| `plant = tfd2step(tfinal,delt2,nout,g1)\
  \ plant = tfd2step(tfinal,delt2,nout,g1,…,g25)` | 计算 MPC tf 格式模型的 MIMO 阶跃响应。得到的阶跃响应为\
  \ MPC 阶跃格式。 |\n| `umod = th2mod(th) [umod,emod] = th2mod(th1,th2,…,thN)` | 将 theta\
  \ 格式（如系统辨识工具箱中所用）的 SISO 或 MISO 模型转换为 MPC mod 格式。也可以组合此类模型以形成 MIMO 系统。 |\n\n\n\n\
  ### 模型构建命令 - MPC mod 格式\n\n| `model = addmd (pmod, dmod)` | 向采用 MPC mod 格式的装置模型添加一个或多个可测扰动。\
  \ |\n| `pmod = addmod (mod1, mod2)` | 组合两个采用 MPC mod 格式的模型，使得其中一个模型的输出与另一个模型的操作输入相结合。\
  \ |\n| `model = addumd (pmod, dmod)` | 向采用 MPC mod 格式的装置模型添加一个或多个不可测扰动。 |\n| `pmod\
  \ = appmod (mod1, mod2)` | 附加两个模型以形成一个组合模型，该组合模型保留原始模型的输入和输出。 |\n| `pmod = paramod\
