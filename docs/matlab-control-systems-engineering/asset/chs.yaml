  \ `ss = lftf(tss1,ss2)` `ss = lftf(ss1,tss2)` | 双端口或单端口状态空间线性分式变换。 |\n| `[ag,bg1,dg22,at,bt1,dt21,dt22]\
  \ = sectf(af,bf1,df22,secf,secg)` `[ag,bg,cg,dg,at,bt1,dt21,dt22] = sectf(af,bf,cf,df,secf,secg)`\
