  \ |\n| `[a1,b1,c1,d1,a2,b2,c2,d2,m] = stabproj(a,b,c,d)` `[a1,b1,c1,d1,a2,b2,c2,d2]\
  \ = slowfast(a,b,c,d,cut)` `[ss1,ss2,m] = stabproj(ss)` `[ss1,ss2] = slowfast(ss,cut)`\
