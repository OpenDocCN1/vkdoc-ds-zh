  \ `mod2frsp` 生成的频率响应。 |\n\n## 鲁棒控制系统：鲁棒控制工具箱\n\n鲁棒控制工具箱为鲁棒多变量控制系统的设计与分析提供了工具。它涵盖可以对误差进行建模的系统，以及具有不确定元素或其参数在产品生命周期内可能发生变化的动力学系统。该工具箱中包含的强大算法允许您执行复杂计算，可以处理参数的大量变化。\n\
  \n该工具箱最重要的特性包括：\n\n*   基于 LQG 的 H² 和 H∞ 控制（综合）。\n*   多变量频率响应。\n*   状态空间模型的构建。\n\
  *   基于模型转换的奇异值。\n*   高阶模型的降阶。\n*   谱分解与内外分解。\n\n### 可选数据结构系统命令\n\n| `[b1,b2,…,bn]\
  \ = branch(tr,PATH1,PATH2,…,PATHN)` | 选择性恢复打包在 `mksys` 或树变量中的矩阵。返回的分支由路径 `PATH1`、`PATH2`、…、`PATHN`\
  \ 确定。 |\n| `TR = graft(TR1,B) TR = graft(TR1,B,NM)` | 将根分支 `B` 添加到先前由 `tree` 或 `mksys`\
  \ 创建的树变量 `TR1` 上。如果 `TR1` 有 N 个分支，则新分支的数字索引为 N+1；其他根分支的数字索引不变。 |\n| `[i,TY,N] =\
  \ issystem(S)` | 根据变量 `S` 是否为函数 `mksys` 创建的系统，为 `i` 返回 1（真）或 0（假）。同时返回系统类型 `TY`\
  \ 和与类型为 `TY` 的系统关联的变量名称数量 `N`，但若 `S` 不是系统，则 `TY = [];` 且 `N = 0`。 |\n| `[i] = istree(T)\
  \ [i,b] = istree(T,path)` | 检查变量 `T` 是否为树结构。当存在第二个输入参数 `path` 时，`istree` 函数检查由 `path`\
  \ 指定的分支是否存在。 |\n| `S = mksys(a,b,c,d) S = mksys(v1,v2,v3,vn, TY)` | 将描述类型为 `TY`\
  \ 的系统的多个矩阵打包到 MATLAB 变量 `S` 中，变量名由字符串 `TY` 的值确定的“标准”名称。 |\n| `T = tree(nm,b1,b2,bn)`\
  \ | 创建一个包含多个变量及其名称的树数据结构 `T`。 |\n| `[VARS,N] = vrsys(NAM)` | 返回一个字符串 `VARS` 和一个整数\
  \ `N`，其中 `VARS` 包含与字符串名称 `NAM` 描述的系统相关联的 N 个矩阵名称的列表（用逗号分隔）。 |\n\n### 建模命令\n\n| `[a,b1,b2,c1,c2,d11,d12,d21,d22]\
  \ = … augss(ag,bg,aw1,bw1,aw2,bw2,aw3,bw3) [a,b1,b2,c1,c2,d11,d12,d21,d22] = … augss(ag,bg,aw1,bw1,aw2,bw2,aw3,bw3,w3poly)\
  \ [a,b1,b2,c1,c2,d11,d12,d21,d22] = … augtf(ag,bg,cg,dg,w1,w2,w3) [tss] = augss(ssg,ssw1,ssw2,ssw3,w3poly)\
  \ [tss] = augtf(ssg,w1,w2,w3) [tss] = augss(ssg,ssw1,ssw2,ssw3)` | 用于加权混合灵敏度 H²\
  \ 和 H∞ 设计的状态空间或传递函数装置增广。 |\n| `[acl,bcl,ccl,dcl] = interc(a,b,c,d,m,n,f) [sscl]\
  \ = interc(ss,m,n,f)` | 系统多变量通用互联。 |\n\n\n\n### 模型转换命令\n\n| `[ab,bb,cb,db] = bilin(a,b,c,d,ver,type,aug)`\
  \ `[ssb] = bilin(ss,ver,type,aug)` | 计算频率变量替换 ![A978-1-4842-0289-0_4_Figa_HTML.jpg](img/A978-1-4842-0289-0_4_Figa_HTML.jpg)\
  \ 对系统的影响。变量 `ver` 为 `1`（正向变换：`s` 到 `z`）或 `-1`（反向变换：`z` 到 `s`）（S 或 z）。变量 `type` 表示双线性变换的类型，可以为\
  \ `'BwdRec'`（后向矩形）、`'FwdRec'`（前向矩形）、`'S_Tust'`（移位 Tustin）、`'S_ftjw'`（移位 jω 轴，双线性极点移位，连续时间到连续时间）或\
  \ `'G_Bilin'`（通用双线性，连续时间到连续时间）。`aug = [α,β,γ,δ]`。 |\n| `[aa, bb, cc, dd] = des2ss(a,b,c,d,E,k)`\
