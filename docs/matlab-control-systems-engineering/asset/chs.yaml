  \ | 将传递函数矩阵（MIMO）转换为状态空间形式。 |\n\n### 实用命令\n\n| `[p1,p2,lamp,perr,wellposed,p] =\
  \ aresolv(a,q,r)` `[p1,p2,lamp,perr,wellposed,p] = aresolv(a,q,r,Type)` `[p1,p2,lamp,perr,wellposed,p]\
  \ = daresolv(a,b,q,r)` `[p1,p2,lamp,perr,wellposed,p] = daresolv(a,b,q,r,Type)`\
  \ | 求解连续广义黎卡提方程 `A^T P + PA - PRP + Q = 0`，其中 `P = p = p1/p2`。求解离散广义黎卡提方程 `A^T PA\
  \ - P - A^T PB(R + B^T PB)^(-1) B^T PA + Q = 0`，其中 `P = p + p2/p1` 是使 `A - RP` 的特征值位于单位圆内的解。\
  \ |\n| `[tot] = riccond(a,b,qrn,p1,p2)` `[tot] = driccond(a,b,q,r,p1,p2)` | 提供连续黎卡提方程的条件数。提供离散黎卡提方程的条件数。\
