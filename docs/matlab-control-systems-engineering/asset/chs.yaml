  \n图 3-10。\n\n### 降阶模型相关命令\n\n| 命令 | 描述 |\n| --- | --- |\n| `[sysb,g] = balreal(sys)`\
  \ `[sysb,g,T,Ti] = balreal(sys)` | 为 LTI 模型 `sys` 的稳定部分计算平衡实现 `sysb`。`balreal` 可处理连续和离散系统。此外，还返回包含平衡格拉姆矩阵对角线的向量\
  \ `g`、用于将 `sys` 转换为 `sysb` 的状态相似变换 `x_[b] = Tx`，以及逆变换 `Ti = T ^(−1)`。 |\n| `sysr\
  \ = minreal(sys)` `sysr = minreal(sys,tol)` `[sysr,u] = minreal(sys,tol)` | 消除状态空间模型中不可控或不可观测的状态，或取消传递函数或零极点增益模型中的零极点对。指定用于状态消除或零极点对消的容差。默认值为\
  \ `tol = sqrt(eps)`，增大此容差会强制进行更多对消。此外，还找到一个正交矩阵 `U`，使得 `(U*A*U',U*B,C*U')` 成为 `(A,B,C)`\
  \ 的卡尔曼分解。 |\n| `rsys = modred(sys,elim)` `rsys = modred(sys,elim,'method')` | 通过消除向量\
  \ `elim` 中的状态，降低连续或离散状态空间模型 `sys` 的阶次。完整状态向量 `X` 被划分为 `X = [X1;X2]`，其中 `X1` 是降阶后的状态向量，`X2`\
  \ 被丢弃。此外，还指定状态消除方法，可以是 `MatchDC`（强制匹配直流增益）或 `Truncate`（删除 `X2`）。 |\n| `MSYS = sminreal(sys)`\
