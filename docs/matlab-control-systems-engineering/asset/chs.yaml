  \ `[mu,logd] = ssv(ss,)` | 计算结构奇异值（多变量稳定裕度）Bode 图。 |\n\n## 练习 4-1\n\n给定如下定义的双输入单输出模型\
  \ `y(s)`，其输入和输出数据位于 `mlrdat` 文件中，使用 `autoesc` 函数确定输入数据的标准差，并仅按该标准差缩放输入。将输入和输出数据整理成可以计算脉冲响应系数（35\
  \ 个系数）的形式，并使用 `mlr` 计算这些系数。最后，基于输入的标准差缩放 `theta`，将模型转换为 MPC 阶跃格式，并绘制阶跃响应系数。\n\n\
