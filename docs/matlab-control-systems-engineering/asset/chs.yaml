- "# Numbers\n\n在 MATLAB 中，函数的参数可以采用多种不同形式，包括不同类型的数字和数值表达式，例如整数、有理数、实数以及复数。\n\nMATLAB\
  \ 中的算术运算是根据标准数学惯例定义的。MATLAB 是一个交互式程序，允许您执行各种简单的数学运算。MATLAB 假定使用通常的求和、求差、乘积、除法和幂运算，并遵循它们之间通常的优先级：\n\
  \n| `x + y` | 求和 |\n| `x - y` | 求差 |\n| `x * y` 或 `x y` | 乘积 |\n| `x / y` | 除法 |\n\
  | `x ^ y` | 幂 |\n\n要相加两个数字，只需输入第一个数字、一个加号（`+`）和第二个数字。可在符号前后添加空格，以使输入更易于阅读。\n\n```\n\
  >> 2 + 3\n\nans =\n\n5\n```\n\n我们可以直接进行幂运算。\n\n```\n>> 100 ^ 50\n\nans =\n\n1.0000e+100\n\
  ```\n\n与计算器不同，在操作整数时，即使结果的位数超过屏幕通常能容纳的宽度，MATLAB 也会显示完整结果。例如，当使用`vpa`函数（此处使用默认精度\
  \ 32 位有效数字）时，MATLAB 返回`99 ^ 50`的以下值。\n\n```\n>> vpa '99 ^ 50'\n\nans =\n\n.60500606713753665044791996801256e100\n\
  ```\n\n要在同一条指令中组合多个运算，必须考虑它们之间通常的优先级标准，这些标准决定了表达式的求值顺序。例如，考虑：\n\n```\n>> 2 * 3 ^\
  \ 2 + (5-2) * 3\n\nans =\n\n27\n```\n\n考虑到运算符的优先级，首先要计算的表达式是幂`3²`。通常的求值顺序可以通过将表达式分组在括号中来改变。\n\
  \n除了这些算术运算符，MATLAB 还配备了一套基本函数，您也可以定义自己的函数。MATLAB 函数和运算符可以应用于符号常量或数字。\n\nMATLAB 的一个基本应用是像使用传统计算器一样执行算术运算，但有一个重要区别：计算的精度。运算可以按照用户所需的任意精度执行。这种无限制的计算精度是\
  \ MATLAB 区别于其他数值计算程序的一个特性，在其他程序中，精度由软件固有的字长决定，并且无法修改。\n\n可以使用特殊的近似技术来降低 MATLAB 运算输出的精度，这些技术仅在达到特定指定精度时才精确。MATLAB\
  \ 表示结果时具有高精度，但即使内部始终进行精确计算以防止舍入误差的传播，也可以启用不同的近似表示格式，这有时有助于解释结果。允许数值逼近的命令如下：\n\n\
  | `format long` | 以 16 位有效十进制数字提供结果。 |\n| `format short` | 以 4 位小数提供结果。这是 MATLAB\
  \ 的默认格式。 |\n| `format long e` | 以 16 位十进制数字提供结果，并加上所需的 10 的幂。 |\n| `format short\
  \ e` | 以 4 位十进制数字提供结果，并加上所需的 10 的幂。 |\n| `format long g` | 以最佳长格式提供结果。 |\n| `format\
  \ short g` | 以最佳短格式提供结果。 |\n| `bank format` | 以 2 位小数提供结果。 |\n| `format rat` | 以有理数近似值的形式返回结果。\
  \ |\n| `format +` | 返回符号（`+`，`-`），并忽略复数的虚部。 |\n| `format hex` | 以十六进制格式返回结果。 |\n\
  | `vpa 'operations' n` | 将指定运算的结果返回到 `n` 位有效数字。 |\n| `numeric('expr')` | 提供由当前活动格式数值近似的表达式的值。\
  \ |\n| `digits(n)` | 将结果返回到 `n` 位有效数字。 |\n\n使用`format`以`format`命令后指定的方式给出`174/13`的数值近似值：\n\
  \n```\n>> 174/13\n\nans =\n\n13.3846\n\n>> format long; 174/13\n\nans =\n\n13.38461538461539\n\
  \n>> format long e; 174/13\n\nans =\n\n1.338461538461539e+001\n\n>> format short\
  \ e; 174/13\n\nans =\n\n1.3385e+001\n\n>> format long g; 174/13\n\nans =\n\n13.3846153846154\n\
  \n>> format short g; 174/13\n\nans =\n\n13.385\n\n>> format bank; 174/13\n\nans\
  \ =\n\n13.38\n\n>> format hex; 174/13\n\nans =\n\n402ac4ec4ec4ec4f\n```\n\n现在我们将看到如何计算`sqrt(17)`到我们想要的任何精度：\n\
  \n```\n>> vpa ' 174/13 ' 10\n\nans =\n\n13.38461538\n\n>> vpa ' 174/13 ' 15\n\n\
  ans =\n\n13.3846153846154\n\n>> digits (20); vpa ' 174/13 '\n\nans =\n\n13.384615384615384615\n\
  ```\n\n### 整数\n\n在 MATLAB 中，所有涉及整数的常见运算都是精确的，无论输出的大小如何。如果我们希望运算结果以特定位数的有效数字显示在屏幕上，我们使用符号计算命令`vpa`（可变精度算术），其语法我们已经了解。\n\
  \n例如，以下计算`6⁴⁰⁰`到 450 位有效数字：\n\n```\n>>  '6 vpa ^ 400' 450\n\nans =\n\.\n\
  ```\n\n运算结果是精确的，始终在结果末尾显示一个小数点。在这种情况下，答案无论如何都没有 450 位数字，因此解是精确的。如果您需要更少的有效数字，可以指定该数字，结果将相应地进行四舍五入。例如，仅计算上述幂到\
  \ 50 位有效数字，我们有：\n\n```\n>>  '6 vpa ^ 400' 50\n\nans =\n\n.18217977168218728251394687124089371267338971528175e312\n\
  ```\n\n### 整数与整除性函数\n\nMATLAB 中有几个函数使用整数参数，其中大部分与整除性有关。使用整数参数的最典型函数如下：\n\n| `rem(n,\
  \ m)` | 返回 `n` 除以 `m` 的余数（当 `n` 和 `m` 为实数时也有效）。 |\n| `sign(n)` | `n` 的符号（即，如果 `n\
  \ > 0` 则为 1，如果 `n < 0` 则为 -1）。 |\n| `max(n1, n2)` | `n1` 和 `n2` 中的最大值。 |\n| `min(n1,\
  \ n2)` | `n1` 和 `n2` 中的最小值。 |\n| `gcd(n1, n2)` | `n1` 和 `n2` 的最大公约数。 |\n| `lcm(n1,\
  \ n2)` | `n1` 和 `n2` 的最小公倍数。 |\n| `factorial(n)` | `n` 的阶乘（即 `n(n-1)(n-2)...1`）。\
  \ |\n| `factor(n)` | 返回 `n` 的质因数分解。 |\n\n以下是一些示例。\n\n17 除以 3 的余数：\n\n```\n>> rem\
  \ (17,3)\n\nans =\n\n2\n```\n\n4.1 除以 1.2 的余数：\n\n```\n>> rem (4.1,1.2)\n\nans =\n\
  \n0.5000\n```\n\n-4.1 除以 1.2 的余数：\n\n```\n>> rem (-4.1,1.2)\n\nans =\n\n-0.5000\n\
  ```\n\n1000、500 和 625 的最大公约数：\n\n```\n>> gcd (1000, gcd (500,625))\n\nans =\n\n\
  125.00\n```\n\n1000、500 和 625 的最小公倍数：\n\n```\n>> lcm (1000, lcm (500,625))\n\nans\
  \ =\n\n5000.00\n```\n\n\n\n#### 其他进制\n\nMATLAB 允许你使用任意进制处理数字，前提是安装了扩展的符号数学工具箱。它还允许你用不同进制表示各种数字。这是通过以下函数实现的：\n\
  \n| `dec2base(十进制数, n_base)` | 将指定的十进制数转换为新进制 `n_base`。 |\n| `base2dec(数字, b)` |\
  \ 将给定进制 `b` 的数字转换为十进制数。 |\n| `dec2bin(十进制数)` | 将指定的十进制数转换为 2 进制（二进制）。 |\n| `dec2hex(十进制数)`\
  \ | 将指定的十进制数转换为 16 进制（十六进制）。 |\n| `bin2dec(二进制数)` | 将指定的二进制数转换为十进制。 |\n| `hex2dec(十六进制数)`\
  \ | 将指定的 16 进制数转换为十进制。 |\n\n下面是一些示例。\n\n将二进制数 100101 转换为十进制表示。\n\n```\n>> base2dec('100101',2)\n\
  ans =\n37.00\n```\n\n将十六进制数 FFFFAA00 转换为十进制表示。\n\n```\n>> base2dec('FFFFAA0', 16)\n\
  ans =\n268434080.00\n```\n\n将十六进制运算 FFFAA2+FF-1 的结果用十进制表示。\n\n```\n>> base2dec('FFFAA2',16)\
  \ + base2dec('FF',16)-1\nans =\n16776096.00\n```\n\n### 实数\n\n众所周知，实数集是有理数集和无理数集的不交并。有理数是形如\
  \ `p/q` 的数，其中 `p` 和 `q` 是整数。换句话说，有理数是可表示为两个整数之商的数。MATLAB 处理有理数的方式与大多数计算器不同。如果我们让计算器计算\
  \ `1/2 + 1/3 + 1/4` 的和，大多数会返回类似 `1.0833` 的结果，这仅仅是结果的一个近似值。\n\n有理数是整数之比，MATLAB 可以以精确模式处理它们，因此涉及有理数的算术表达式的结果总是以两个整数之比的形式精确给出。要启用此功能，请使用命令\
  \ `format rat` 激活有理数格式。如果读者希望，MATLAB 也可以通过激活任何其他类型的格式（例如 `format short` 或 `format\
  \ long`）来返回十进制形式的结果。MATLAB 在精确模式下计算上述和的方式如下：\n\n```\n>> format rat\n>> 1/2 + 1/3\
  \ + 1/4\nans =\n13/12\n```\n\n与计算器不同，MATLAB 通过将有理数保持为整数比的形式，确保其与有理数的运算是精确的。这样，分数计算就不会受到舍入误差的影响，正如误差理论所证明的那样，这些误差可能变得非常严重。注意，一旦启用有理数格式，当\
  \ MATLAB 相加两个有理数时，结果会以整数比的形式符号化返回，并且对有理数的运算将继续保持精确，直到调用另一种格式为止。\n\n如果启用了有理数格式，一个浮点数（即带有小数点的数字）将被解释为精确值。因此，浮点表达式将被解释为精确的有理表达式，而有理表达式中的任何无理数都将由适当的有利近似值来表示。\n\
  \n```\n>> format rat\n>> 10/23 + 2.45/44\nans =\n1183 / 2412\n```\n\n实数的另一个基本子集是无理数集，由于其特殊性质，无理数在数值计算中一直带来困难。无法在数值模式（使用十进制计数系统中的十位数字）下精确表示无理数是大多数问题的根源。MATLAB\
  \ 以用户可以按需设置的精度来表示结果。根据定义，无理数不能精确表示为两个整数之比。如果命令 MATLAB 计算 17 的平方根，默认情况下它会返回数字 5.1962。\n\
  \n```\n>> sqrt(27)\nans =\n5.1962\n```\n\nMATLAB 包含以下常见的无理常数和概念：\n\n| `pi` | 圆周率\
  \ π = 3.1415926... |\n| `exp(1)` | 自然常数 e = 2.7182818... |\n| `Inf` | 无穷大（例如，遇到\
  \ `1/0` 时返回）。 |\n| `NaN` | 不确定性（例如，遇到 `0/0` 时返回）。 |\n| `realmin` | 返回 IEEE 双精度下最小的可能标准化浮点数。\
  \ |\n| `realmax` | 返回 IEEE 双精度下最大的有限浮点数。 |\n\n以下示例说明了 MATLAB 如何输出这些数字和概念。\n\n```\n\
  >> long format\n>> pi\nans =\n3.14159265358979\n\n>> exp(1)\nans =\n2.71828182845905\n\
  \n>> 1/0\nWarning: Divide by zero.\nans =\nInf\n\n>> 0/0\nWarning: Divide by zero.\n\
  ans =\nNaN\n\n>> realmin\nans =\n2.225073858507201e-308\n\n>> realmax\nans =\n1.797693134862316e+308\n\
  ```\n\n### 实参数函数\n\n有理数集和无理数集的不交并就是实数集。反过来，有理数集以整数集为其子集。所有适用于实数参数的函数也同样适用于整数和有理数。MATLAB\
  \ 提供了全套预定义函数，其中大部分将在本书后续章节中讨论。在 MATLAB 提供的实参数函数组中，以下是最重要的：\n\n**三角函数**\n\n| 函数 |\
  \ 反函数 |\n| --- | --- |\n| `sin(x)` | `asin(x)` |\n| `cos(x)` | `acos(x)` |\n| `tan(x)`\
  \ | `atan(x)` 和 `atan2(y,x)` |\n| `csc(x)` | `acsc(x)` |\n| `sec(x)` | `asec(x)`\
  \ |\n| `cot(x)` | `acot(x)` |\n\n**双曲函数**\n\n| 函数 | 反函数 |\n| --- | --- |\n| `sinh(x)`\
  \ | `asinh(x)` |\n| `cosh(x)` | `acosh(x)` |\n| `tanh(x)` | `atanh(x)` |\n| `csch(x)`\
  \ | `acsch(x)` |\n| `sech(x)` | `asech(x)` |\n| `coth(x)` | `acoth(x)` |\n\n**指数和对数函数**\n\
  \n| 函数 | 含义 |\n| --- | --- |\n| `exp(x)` | 以 e 为底的指数函数（`e^x`）。 |\n| `log(x)` | x\
  \ 的自然对数（以 e 为底）。 |\n| `log10(x)` | x 的以 10 为底的对数。 |\n| `log2(x)` | x 的以 2 为底的对数。\
  \ |\n| `pow2(x)` | 2 的 x 次幂。 |\n| `sqrt(x)` | x 的平方根。 |\n\n**数值变量特定函数**\n\n| 函数\
  \ | 含义 |\n| --- | --- |\n| `abs(x)` | x 的绝对值。 |\n| `floor(x)` | 小于或等于 x 的最大整数。 |\n\
  | `ceil(x)` | 大于或等于 x 的最小整数。 |\n| `round(x)` | 最接近 x 的整数。 |\n| `fix(x)` | 去掉 x 的小数部分。\
  \ |\n| `rem(a,b)` | 返回 a 除以 b 的余数。 |\n| `sign(x)` | 返回 x 的符号（如果 x > 0，则返回 1；如果 x\
  \ = 0，则返回 0；如果 x < 0，则返回 -1）。 |\n\n以下是一些示例：\n\n```\n>> sin(pi/2)\nans =\n1\n\n>>\
  \ asin(1)\nans =\n1.57079632679490\n\n>> log(exp(1)³)\nans =\n3.00000000000000\n\
  ```\n\n函数 `round` 在以下两个示例中演示：\n\n```\n>> round(2.574)\nans =\n3\n\n>> round(2.4)\n\
  ans =\n2\n```\n\n函数 `ceil` 在以下两个示例中演示：\n\n```\n>> ceil(4.2)\nans =\n5\n\n>> ceil(4.8)\n\
  ans =\n5\n```\n\n函数 `floor` 在以下两个示例中演示：\n\n```\n>> floor(4.2)\nans =\n4\n\n>> floor(4.8)\n\
  ans =\n4\n```\n\nfix 函数只是去掉实数的分数部分：\n\n```\n>> fix(5.789)\nans =\n5\n```\n\n\n\n\
  ## 复数\n\nMATLAB 中已经很好地实现了复数的运算。MATLAB 遵循惯例，使用 `i` 或 `j` 来表示复分析中的关键值——虚数 √-1。所有常用的算术运算符都可以应用于复数，此外还有一些特定的函数接受复数参数。复数的实部和虚部都可以是实数或符号常量，除非另有指示或必要，否则将始终以精确模式执行运算，否则会返回结果的近似值。由于虚数单位用符号\
  \ `i` 或 `j` 表示，复数以 `a+bi` 或 `a+bj` 的形式表示。注意，在虚数单位前不需要使用乘号（星号）：\n\n```\n>>  (1-5i)*(1-i)/(-1+2i)\n\
  \nans =\n\n-1.6000 + 2.8000i\n>> format rat\n\n>>  (1-5i) *(1-i) /(-1+2i)\n\nans\
  \ =\n\n-8/5 + 14/5i\n```\n\n### 含复数参数的函数\n\n复数变量的处理在数学分析及其众多工程应用中非常重要。MATLAB 不仅实现了复数的常用算术运算，还实现了各种复数函数。下面列出了最重要的函数。\n\
  \n#### 三角函数\n\n| 函数 | 反函数 |\n| --- | --- |\n| `sin(z)` | `asin(z)` |\n| `cos(z)`\
  \ | `acos(z)` |\n| `tan(z)` | `atan(z)` 和 `atan2(imag(z),real(z))` |\n| `csc(z)`\
  \ | `acsc(z)` |\n| `sec(z)` | `asec(z)` |\n| `cot(z)` | `acot(z)` |\n\n#### 双曲函数\n\
  \n| 函数 | 反函数 |\n| --- | --- |\n| `sinh(z)` | `asinh(z)` |\n| `cosh(z)` | `acosh(z)`\
  \ |\n| `tanh(z)` | `atanh(z)` |\n| `csch(z)` | `acsch(z)` |\n| `sech(z)` | `asech(z)`\
  \ |\n| `coth(z)` | `acoth(z)` |\n\n#### 指数和对数函数\n\n| 函数 | 含义 |\n| --- | --- |\n\
  | `exp(z)` | 以 e 为底的指数函数 (`e^z`) |\n| `log(z)` | `z` 以 e 为底的对数 |\n| `log10(z)` |\
  \ `z` 以 10 为底的对数 |\n| `log2(z)` | `z` 以 2 为底的对数 |\n| `pow2(z)` | 2 的 `z` 次幂 |\n\
  | `sqrt(z)` | `z` 的平方根 |\n\n#### 用于实部和虚部的特定函数\n\n| 函数 | 含义 |\n| --- | --- |\n| `floor(z)`\
  \ | 对 `real(z)` 和 `imag(z)` 应用向下取整函数 |\n| `ceil(z)` | 对 `real(z)` 和 `imag(z)` 应用向上取整函数\
  \ |\n| `round(z)` | 对 `real(z)` 和 `imag(z)` 应用四舍五入函数 |\n| `fix(z)` | 对 `real(z)`\
  \ 和 `imag(z)` 应用向零取整函数 |\n\n#### 复数的特定函数\n\n| 函数 | 含义 |\n| --- | --- |\n| `abs(z)`\
  \ | `z` 的复模 |\n| `angle(z)` | `z` 的辐角 |\n| `conj(z)` | `z` 的共轭复数 |\n| `real(z)`\
  \ | `z` 的实部 |\n| `imag(z)` | `z` 的虚部 |\n\n以下是复数运算的一些示例。\n\n```\n>> round(1.5-3.4i)\n\
  \nans =\n\n2       -    3i\n>> real(i^i)\n\nans =\n\n0.2079\n>>  (2+2i)²/(-3-3*sqrt(3)*i)⁹⁰\n\
  \nans =\n\n0502e-085 - 1 + 7. 4042e-070i\n>> sin (1 + i)\n\nans =\n\n1.2985 + 0.\
  \ 6350i\n```\n\n### 支持复数向量参数的基本函数\n\nMATLAB 可以轻松处理向量和矩阵运算。事实上，其名称 **MA**trix **LAB**oratory（矩阵实验室）已经暗示了它在处理向量和矩阵方面的强大能力。MATLAB\
  \ 允许您使用复变量函数，此外，该变量甚至可以是向量或矩阵。下表列出了具有复数向量参数的函数。\n\n| `max(V)` | `V` 的最大分量。（对于复数向量，`max`\
  \ 的计算方法是：找出具有最大复模（幅值）的复数，通过 `max(abs(V))` 计算。然后，如有必要，通过 `max(angle(x))` 计算最大的相位角。）\
  \ |\n| `min(V)` | `V` 的最小分量。（对于复数向量，`min` 的计算方法是：找出具有最小复模（幅值）的复数，通过 `min(abs(A))`\
  \ 计算。然后，如有必要，通过 `min(angle(x))` 计算最小的相位角。） |\n| `mean(V)` | `V` 各分量的平均值 |\n| `median(V)`\
  \ | `V` 各分量的中位数 |\n| `std(V)` | `V` 各分量的标准差 |\n| `sort(V)` | 按升序对 `V` 的分量进行排序。对于复数项，排序依据是绝对值和辐角。\
  \ |\n| `sum(V)` | 返回 `V` 各分量的和 |\n| `prod(V)` | 返回 `V` 各分量的乘积，例如，`n! = prod(1:n)`\
  \ |\n| `cumsum(V)` | 给出 `V` 各分量的累积和 |\n| `cumprod(V)` | 给出 `V` 各分量的累积乘积 |\n| `diff(V)`\
  \ | 给出 `V` 的一阶差分向量（`V[t] - V[t-1]`） |\n| `gradient(V)` | 给出 `V` 的梯度 |\n| `del2(V)`\
  \ | 给出 `V` 的拉普拉斯算子（5 点离散） |\n| `fft(V)` | 给出 `V` 的离散傅里叶变换 |\n| `fft2(V)` | 给出 `V`\
  \ 的二维离散傅里叶变换 |\n| `ifft(V)` | 给出 `V` 的逆离散傅里叶变换 |\n| `ifft2(V)` | 给出 `V` 的逆二维离散傅里叶变换\
  \ |\n\n这些函数也支持将复矩阵作为参数，在这种情况下，结果是一个列向量组成的向量，其分量是将函数应用于矩阵的每一列所得到的结果。\n\n以下是一些示例：\n\
  \n```\n>> V = 2:7, W = [5 + 3i 2-i 4i]\n\nV =\n\n2     3     4     5     6     7\n\
  \nW =\n\n2.0000 - 1.0000i        0 + 4.0000i   5.0000 + 3.0000i\n>> diff(V), diff(W)\n\
  \nans =\n\n1     1     1     1     1\n\nans =\n\n-2.0000 + 5.0000i   5.0000 - 1.0000i\n\
  >> cumprod(V), cumsum(V)\n\nans =\n\n2     6     24     120     720     5040\n\n\
  ans =\n\n2     5     9    14    20    27\n>> cumsum(W), mean(W), std(W), sort(W),\
  \ sum(W)\n\nans =\n\n2.0000 - 1.0000i   2.0000 + 3.0000i   7.0000 + 6.0000i\n\n\
  ans =\n\n2.3333 + 2.0000i\n\nans =\n\n3.6515\n\nans =\n\n2.0000 - 1.0000i 0 + 4.0000i\
  \   5.0000 + 3.0000i\n\nans =\n\n7.0000 + 6.0000i\n>> mean(V), std(V), sort(V),\
  \ sum(V)\n\nans =\n\n4.5000\n\nans =\n\n1.8708\n\nans =\n\n2     3     4     5 \
  \    6     7\n\nans =\n\n27\n>> fft(W), ifft(W), fft2(W)\n\nans =\n\n7.0000 + 6.0000i\
  \   0.3660 - 0.1699i  -1.3660 - 8.8301i\n\nans =\n\n2.3333 + 2.0000i  -0.4553 -\
  \ 2.9434i   0.1220 - 0.0566i\n\nans =\n\n7.0000 + 6. 0000i 0.3660 - 0. 1699i - 1.3660\
  \ - 8. 8301i\n```\n\n\n\n#### 支持复数矩阵参数的初等函数\n\n| 三角函数 | |\n| --- | --- |\n| `sin(z)`\
  \ | 正弦函数 |\n| `sinh(z)` | 双曲正弦函数 |\n| `asin(z)` | 反正弦函数 |\n| `asinh(z)` | 反双曲正弦函数\
  \ |\n| `cos(z)` | 余弦函数 |\n| `cosh(z)` | 双曲余弦函数 |\n| `acos(z)` | 反余弦函数 |\n| `acosh(z)`\
  \ | 反双曲余弦函数 |\n| `tan(z)` | 正切函数 |\n| `tanh(z)` | 双曲正切函数 |\n| `atan(z)` | 反正切函数\
  \ |\n| `atan2(z)` | 第四象限反正切函数 |\n| `atanh(z)` | 反双曲正切函数 |\n| `sec(z)` | 正割函数 |\n\
  | `sech(z)` | 双曲正割函数 |\n| `asec(z)` | 反正割函数 |\n| `asech(z)` | 反双曲正割函数 |\n| `csc(z)`\
  \ | 余割函数 |\n| `csch(z)` | 双曲余割函数 |\n| `acsc(z)` | 反余割函数 |\n| `acsch(z)` | 反双曲余割函数\
  \ |\n| `cot(z)` | 余切函数 |\n| `coth(z)` | 双曲余切函数 |\n| `acot(z)` | 反余切函数 |\n| `acoth(z)`\
  \ | 反双曲余切函数 |\n| 指数函数 | |\n| `exp(z)` | 以 e 为底的指数函数 |\n| `log(z)` | 自然对数函数（以 e 为底）\
  \ |\n| `log10(z)` | 以 10 为底的对数函数 |\n| `sqrt(z)` | 平方根函数 |\n| 复数函数 | |\n| `abs(z)`\
  \ | 模或绝对值 |\n| `angle(z)` | 辐角 |\n| `conj(z)` | 复共轭 |\n| `imag(z)` | 虚部 |\n| `real(z)`\
  \ | 实部 |\n| 数值函数 | |\n| `fix(z)` | 去除小数部分 |\n| `floor(z)` | 向负无穷大舍入到最近的整数 |\n| `ceil(z)`\
  \ | 向正无穷大舍入到最近的整数 |\n| `round(z)` | 执行常见的四舍五入 |\n| `rem(z1, z2)` | 返回 `z1` 除以 `z2`\
  \ 后的余数 |\n| `sign(z)` | `z` 的符号函数 |\n| 矩阵函数 | |\n| `expm(Z)` | 默认矩阵指数函数 |\n| `expm1(Z)`\
  \ | M 文件中的矩阵指数函数 |\n| `expm2(Z)` | 通过泰勒级数计算的矩阵指数函数 |\n| `expm3(Z)` | 通过特征值计算的矩阵指数函数\
  \ |\n| `logm(Z)` | 矩阵对数函数 |\n| `sqrtm(Z)` | 矩阵平方根函数 |\n| `funm(Z,'function')` |\
  \ 将函数应用于数组 `Z` |\n\n以下是一些示例：\n\n```\n>> A = [7 8 9; 1 2 3; 4 5 6], B = [1+2i 3+i;4+i,i]\n\
  ```\n\n```\nA =\n     7     8     9\n     1     2     3\n     4     5     6\n```\n\
  \n```\nB =\n   1.0000 + 2.0000i   3.0000 + 1.0000i\n   4.0000 + 1.0000i        0\
  \ + 1.0000i\n```\n\n```\n>> sin(A), sin(B), exp(A), exp(B), log(B), sqrt(B)\nans\
  \ =\n    0.6570    0.9894    0.4121\n    0.8415    0.9093    0.1411\n   -0.7568\
  \   -0.9589   -0.2794\nans =\n   3.1658 + 1.9596i   0.2178 - 1.1634i\n  -1.1678\
  \ - 0.7682i        0 + 1.1752i\nans =\n   1.0e+003 *\n    1.0966    2.9810    8.1031\n\
  \    0.0027    0.0074    0.0201\n    0.0546    0.1484    0.4034\nans =\n  -1.1312\
  \ + 2.4717i  10.8523 +16.9014i\n  29.4995 +45.9428i   0.5403 + 0.8415i\nans =\n\
  \   0.8047 + 1.1071i   1.1513 + 0.3218i\n   1.4166 + 0.2450i        0 + 1.5708i\n\
  ans =\n   1.2720 + 0.7862i   1.7553 + 0.2848i\n   2.0153 + 0.2481i   0.7071 + 0.7071i\n\
  ```\n\n上面使用的指数函数、平方根和对数函数是逐元素应用于数组的，与下面使用的矩阵指数和对数函数无关。\n\n```\n>> expm(B), logm(A),\
  \ abs(B), imag(B)\nans =\n  -27.9191 +14.8698i -20.0011 +12.0638i\n  -24.7950 +\
  \ 17.6831i-17.5059 + 14.0445i\nans =\n   11.9650 12.8038 - 19.9093\n  -21.7328-22.1157\
  \ 44.6052\n   11.8921 12.1200 - 21.2040\nans =\n    2.2361    3.1623\n    4.1231\
  \    1.0000\nans =\n     2     1\n     1     1\n```\n\n```\n>> fix(sin(B)), ceil(log(A)),\
  \ sign(B), rem(A,3*ones(3))\nans =\n   3.0000 + 1.0000i        0 - 1.0000i\n  -1.0000\
  \                 0 + 1.0000i\nans =\n     2     3     3\n     0     1     2\n \
  \    2     2     2\nans =\n   0.4472 + 0.8944i   0.9487 + 0.3162i\n   0.9701 + 0.2425i\
  \        0 + 1.0000i\nans =\n     1     2     0\n     1     2     0\n     1    \
  \ 2     0\n```\n\n### 随机数\n\nMATLAB 可以轻松生成（伪）随机数。函数 `rand` 生成均匀分布的随机数，函数 `randn`\
  \ 生成正态分布的随机数。下表展示了 MATLAB 随机数生成器最有趣的功能。\n\n| `rand` | 返回一个来自 [0,1] 区间的均匀分布随机小数。\
  \ |\n| `rand(n)` | 返回一个大小为 `n×n` 的数组，其元素是来自 [0,1] 区间的均匀分布随机小数。 |\n| `rand(m, n)`\
  \ | 返回一个维度为 `m×n` 的数组，其元素是来自 [0,1] 区间的均匀分布随机小数。 |\n| `rand(size(a))` | 返回一个与矩阵 `A`\
  \ 大小相同的数组，其元素是来自 [0,1] 区间的均匀分布随机小数。 |\n| `rand('seed')` | 返回均匀随机数生成器种子的当前值。 |\n\
  | `rand('seed',n)` | 将均匀随机数生成器种子的当前值赋给 `n`。 |\n| `randn` | 返回一个正态分布的随机小数（均值为 0，方差为\
  \ 1）。 |\n| `randn(n)` | 返回一个维度为 `n×n` 的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |\n| `randn(m,\
  \ n)` | 返回一个维度为 `m×n` 的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |\n| `randn(size(a))` | 返回一个与矩阵\
  \ `A` 大小相同的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |\n| `randn('seed')` | 返回正态随机数生成器种子的当前值。\
  \ |\n| `randn('seed',n)` | 将均匀随机数生成器种子的当前值赋给 `n`。 |\n\n以下是一些示例：\n\n```\n>>  [rand,\
  \ rand (1), randn, randn (1)]\nans =\n    0.9501    0.2311   -0.4326   -1.6656\n\
  ```\n\n```\n>>  [rand(2), randn(2)]\nans =\n    0.6068    0.8913             0.1253\
  \   -1.1465\n    0.4860    0.7621             0.2877    1.1909\n```\n\n```\n>> \
  \ [rand(2,3), randn(2,3)]\nans =\n    0.3529 0.0099 0.2028   -0.1364 1.0668-0.0956\n\
  \    0.8132 0.1389 0.1987 0.1139 0.0593 - 0.8323\n```\n\n## 运算符\n\nMATLAB 提供了算术、逻辑、关系、条件和结构运算符。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循注意事项和示例格式，为您翻译以下文本。\n\n\n### 算术运算符\n\nMATLAB 中有两种算术运算符：由线性代数规则支配的矩阵算术运算符，以及按元素执行的向量算术运算符。涉及的运算符如下表所示。\n\
  \n| 运算符 | 作用 |\n| --- | --- |\n| `+` | 标量、向量或矩阵的加法 |\n| `-` | 标量、向量或矩阵的减法 |\n| `*`\
  \ | 标量或数组的乘法 |\n| `.*` | 标量或向量的乘法 |\n| `\\` | `A\\B = inv(A) * B`，其中 `A` 和 `B` 是矩阵\
  \ |\n| `.\\` | `A.\\B = [B(i,j) / A(i,j)]`，其中 `A` 和 `B` 是向量（`dim(A) = dim(B)`） |\n\
  | `/` | 除法，或 `B/A = B * inv(A)`，其中 `A` 和 `B` 是矩阵 |\n| `./` | `A./B = [A(i,j) / B(i,j)]`，其中\
  \ `A` 和 `B` 是向量（`dim(A) = dim(B)`） |\n| `^` | 标量或矩阵的幂运算（`M^p`） |\n| `.^` | 向量的幂运算（`A.^B\
  \ = [A(i,j)^(B(i,j))]`，对于向量 `A` 和 `B`） |\n\n标量和向量之间的简单数学运算根据定义的操作将标量应用于向量的所有元素，而向量之间的简单运算符是逐元素执行的。以下是这些运算符的规范：\n\
  \n| `a = {a1, a2,..., an}`, `b = {b1, b2,..., bn}`, `c = 标量` | |\n| --- | --- |\n\
  | `a + c = [a1+c, a2+c,..., an+c]` | 标量与向量的加法 |\n| `a * c = [a1*c, a2*c ,..., an*c]`\
  \ | 标量与向量的乘法 |\n| `a + b = [a1+b1, a2+b2, ..., an+bn]` | 两个向量的加法 |\n| `a.*b = [a1*b1,\
  \ a2*b2, ..., an*bn]` | 两个向量的乘法 |\n| `a./b = [a1/b1, a2/b2, ..., an/bn]` | 两个向量的右除\
  \ |\n| `a.\\b = [a1\\b1, a2\\b2, ..., an\\bn]` | 两个向量的左除 |\n| `a.^c = [a1^c, a2^c\
  \ ,..., an^c]` | 向量的标量次幂 |\n| `c.^a = [c^a1, c^a2, ..., c^an]` | 标量的向量次幂 |\n| `a.^b\
  \ = [a1^b1, a2^b2, ..., an^bn]` | 向量的向量次幂 |\n\n必须牢记，向量必须具有相同的长度，并且在乘法、除法和幂运算中，第一个操作数后面必须跟一个点。\n\
  \n以下示例涉及上述所有运算符。\n\n```\n>> X = [5,4,3]; Y = [1,2,7]; a = X + Y, b = X-Y, c = x\
  \ * Y, d = 2\\. * X,...\ne = 2/X, f = 2\\. \\Y, g = x / Y, h =. \\X, i = x ^ 2,\
  \ j = 2\\. ^ X, k = X. ^ Y\n\na =\n     6     6    10\nb =\n     4     2    -4\n\
  c =\n     5     8    21\nd =\n    10     8     6\ne =\n    0.4000    0.5000    0.6667\n\
  f =\n    0.5000    1.0000    3.5000\ng =\n    5.0000    2.0000    0.4286\nh =\n\
  \    5.0000    2.0000    0.4286\ni =\n    25    16     9\nj =\n    32 16 8\nk =\n\
  \    5 16 2187\n```\n\n以上操作都是有效的，因为在所有情况下，变量操作数都具有相同的维度，因此操作可以成功逐元素执行。对于加法和减法，向量和矩阵之间没有区别，因为这两种情况下的操作是相同的。\n\
  \n矩阵变量最重要的运算符指定如下：\n\n| `A + B`, `A - B`, `A * B` | 矩阵的加法、减法和乘法。 |\n| `A\\B` | 如果\
  \ `A` 是方阵，则 `A\\B = inv(A) * B`。如果 `A` 不是方阵，则 `A\\B` 是系统 `AX = B` 在最小二乘意义上的解。 |\n\
  | `B/A` | 等同于 `(A' \\ B')'`。 |\n| `A^n` | 等同于 `A * A * A *... *A` n 次（n 为整数）。 |\n\
  | `p^A` | 仅当 `p` 是标量时才执行幂运算。 |\n\n以下是一些示例：\n\n```\n>> X = [5,4,3]; Y = [1,2,7];\
  \ l = X'* Y, m = X * Y ', n = 2 * X, o = X / Y, p = Y\\X\n\nl =\n     5 10 35\n\
  \     4 8 28\n     3 6 21\nm =\n    34\nn =\n    10 8 6\no =\n    0.6296\np =\n\
  \     0         0         0\n     0         0         0\n     0.7143    0.5714 \
  \   0.4286\n```\n\n上述所有矩阵运算都有明确的定义，因为操作数的维度在每种情况下都是兼容的。我们绝不能忘记，向量是矩阵的一种特殊情况，但要以其矩阵形式（而不是逐元素）进行操作，必须遵守矩阵运算的维度规则。例如，向量运算\
  \ `X.' * Y` 和 `X.*Y'` 没有意义，因为它们涉及不同维度的向量。类似地，矩阵运算 `X * Y`、`2/X`、`2\\Y`、`X²`、`2^X`\
  \ 和 `X^Y` 也没有意义，同样是因为数组中的维度冲突。\n\n以下是矩阵运算符的更多示例。\n\n```\n>> M = [1,2,3;1,0,2;7,8,9]\n\
  \nM =\n     1 2 3\n     1 0 2\n     7 8 9\n\n>> B = inv(M), C = M ^ 2, D = M ^(1/2),\
  \ E = 2 ^ M\n\nB =\n   -0.8889    0.3333    0.2222\n    0.2778   -0.6667    0.0556\n\
  \    0.4444    0.3333   -0.1111\nC =\n    24    26    34\n    15    18    21\n \
  \   78    86   118\nD =\n    0.5219 + 0.8432i   0.5793 - 0.0664i   0.7756 - 0.2344i\n\
  \    0.3270 + 0.0207i   0.3630 + 1.0650i   0.4859 - 0.2012i\n    1.7848 - 0.5828i\
  \   1.9811 - 0.7508i   2.6524 + 0.3080i\nE =\n    1.0e+003 *\n    0.8626    0.9568\
  \    1.2811\n    0.5401    0.5999    0.8027\n    2.9482    3.2725    4.3816\n```\n\
  \n### 关系运算符\n\nMATLAB 还提供了关系运算符。关系运算符对两个矩阵执行逐元素比较，并返回一个大小相同的数组，如果对应关系为真，则其元素为零；如果对应关系为假，则其元素为一。关系运算符也可以将标量与向量或矩阵进行比较，在这种情况下，标量将与数组的所有元素进行比较。以下是这些运算符的表格。\n\
  \n| `<` | 小于（对于复数，这仅适用于实部） |\n| `<=` | 小于或等于（仅适用于复数的实部） |\n| `>` | 大于（仅适用于复数的实部）\
  \ |\n| `>=` | 大于或等于（仅适用于复数的实部） |\n| `x == y` | 等于（也适用于复数） |\n| `x ~= y` | 不等于（也适用于复数）\
  \ |\n\n### 逻辑运算符\n\nMATLAB 提供了表示逻辑运算符的符号。下表中显示的逻辑运算符提供了一种组合或否定关系表达式的方法。\n\n| `~A`\
  \ | 逻辑非（NOT）或 `A` 的补集。 |\n| `A & B` | 逻辑与（AND）或 `A` 与 `B` 的交集。 |\n| `A \\| B` |\
  \ 逻辑或（OR）或 `A` 与 `B` 的并集。 |\n| `XOR(A, B)` | 异或（XOR）或 `A` 与 `B` 的对称差（如果 `A` 或 `B`\
  \ 为 1，但不同时为 1，则取值为 1）。 |\n\n以下是一些示例：\n\n```\n>> A = 2:7; P = (A > 3) & (A < 6)\n\
  P =\n     0     0     1     1     0     0\n```\n\n当 `A` 的对应元素大于 3 且小于 6 时返回 1，否则返回\
  \ 0。\n\n```\n>> X = 3 * ones(3,3); X >= [7 8 9; 4 5 6 ; 1 2 3]\nans =\n     0 0\
  \ 0\n     0 0 0\n     1 1 1\n```\n\n解数组中对应于 `X` 中大于或等于矩阵 `[7 8 9; 4 5 6 ; 1 2 3]`\
  \ 对应项的元素被赋值为 1。其余元素被赋值为 0。\n\n\n\n### 逻辑函数\n\nMATLAB 实现了输出值可为 `true` (1) 或 `false`\
  \ (0) 的逻辑函数。下表列出了最重要的逻辑函数。\n\n| `exist(A)` | 检查变量或函数是否存在（如果 `A` 不存在则返回 0，如果存在则根据类型返回\
  \ 1 到 5 之间的数字）。 |\n| `any(V)` | 如果向量 `V` 的所有元素均为零则返回 0，如果 `V` 的某些元素非零则返回 1。 |\n\
  | `any(A)` | 对矩阵 `A` 中所有元素均为零的每一列返回 0，对存在非零元素的每一列返回 1。 |\n| `all(V)` | 如果向量 `V`\
  \ 的所有元素均非零则返回 1，如果 `V` 的某些元素为零则返回 0。 |\n| `all(A)` | 对矩阵 `A` 中所有元素均非零的每一列返回 1，对至少有一个零元素的每一列返回\
  \ 0。 |\n| `find(V)` | 返回向量 `V` 中非零元素所在的位置（或索引）。 |\n| `isnan(V)` | 对 `V` 中为不定值的元素返回\
  \ 1，对不是不定值的元素返回 0。 |\n| `isinf(V)` | 对 `V` 中为无穷大的元素返回 1，对不是无穷大的元素返回 0。 |\n| `isfinite(V)`\
  \ | 对 `V` 中为有限值的元素返回 1，对不是有限值的元素返回 0。 |\n| `isempty(A)` | 如果 `A` 是空数组则返回 1，否则返回\
  \ 0（空数组是指其某一维度为 0 的数组）。 |\n| `issparse(A)` | 如果 `A` 是稀疏矩阵则返回 1，否则返回 0。 |\n| `isreal(V)`\
  \ | 如果 `V` 的所有元素均为实数则返回 1，否则返回 0。 |\n| `isprime(V)` | 对 `V` 中所有为质数的元素返回 1，对 `V`\
  \ 中所有不是质数的元素返回 0。 |\n| `islogical(V)` | 如果 `V` 是逻辑向量则返回 1，否则返回 0。 |\n| `isnumeric(V)`\
  \ | 如果 `V` 是数值向量则返回 1，否则返回 0。 |\n| `ishold` | 如果当前图形的属性保留给下一个图形，且仅添加新元素，则返回 1，否则返回\
  \ 0。 |\n| `isieee` | 如果计算机能够执行 IEEE 标准运算，则返回 1。 |\n| `isstr(S)` | 如果 `S` 是字符串则返回\
  \ 1，否则返回 0。 |\n| `ischart(S)` | 如果 `S` 是字符串则返回 1，否则返回 0。 |\n| `isglobal(A)` | 如果\
  \ `A` 是全局变量则返回 1，否则返回 0。 |\n| `isletter(S)` | 如果 `S` 是字母表中的字母则返回 1，否则返回 0。 |\n|\
  \ `isequal(A, B)` | 如果矩阵或向量 `A` 和 `B` 相等则返回 1，否则返回 0。 |\n| `ismember(V, W)` | 对\
  \ `V` 中存在于 `W` 的每个元素返回 1，对 `V` 中不存在于 `W` 的每个元素返回 0。 |\n\n下面是使用上述逻辑函数的一些示例。\n\n```\n\
  >> V = [1,2,3,4,5,6,7,8,9], isprime(V), isnumeric(V), all(V), any(V)\nV =\n1   \
  \  2     3     4     5     6     7     8     9\nans =\n0     1     1     0     1\
  \     0     1     0     0\nans =\n1\nans =\n1\nans =\n1\n>> B = [Inf, -Inf, pi,\
  \ NaN], isinf(B), isfinite(B), isnan(B), isreal(B)\nB =\nInf - Inf 3.1416 NaN\n\
  ans =\n1 1 0 0\nans =\n0 0 1 0\nans =\n0 0 0 1\nans =\n1\n>> ismember ([1,2,3],\
  \ [8,12,1,3]), A = [2,0,1];B = [4,0,2]; isequal (2A * B)\nans =\n1 0 1\nans =\n\
  1\n```\n\n## 练习 2-1\n\n求从 30 个元素中无重复地选择 12 个元素的方法数、2¹³⁴ 除以 3 的余数、18900 的质因数分解、200\
