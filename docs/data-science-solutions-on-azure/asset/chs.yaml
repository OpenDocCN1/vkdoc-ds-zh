  \n在本练习中，我们使用自定义数据集对基础模型进行了微调。请继续使用数据集中的其他问题进行测试，并运用本章开头学到的提示工程技术调整系统消息。请记住，由于数据集较小且未调整任何参数，你仍可能会遇到不准确的回答，但这就是迭代微调过程发挥作用的地方。该模型现在是一个自定义模型，你需要将其作为\
  \ MLOps 中模型开发生命周期的一部分加以管理。\n\n### 动手练习 6-4：清理不需要的资源\n\n微调会产生 Token 消耗成本，但这是每次微调任务的一次性成本。然而，部署模型端点是一项持续的模型托管成本，除非你自己托管该模型^(⁷⁷)。在本练习中，我们使用了无服务器端点，以便无需管理计算基础设施。因此，如果你不再需要某个模型端点，请务必删除该端点，否则你将产生持续费用。\n\
  \n请注意，删除模型端点*不会*删除微调后的模型，而且在大多数情况下，我们也不希望这样做。因为我们可能还需要此模型进行进一步的微调。***但由于为了测试模型，我们必须将其部署到端点，因此需要记住删除所有未使用的端点。***\n\
  \n![](img/501717_2_En_6_Fig30_HTML.jpg)\n\n**图 6-30** – 删除模型端点\n\n1.  点击模型部署端点。然后选择\
  \ ![](img/501717_2_En_6_Figac_HTML.jpg)。\n2.  确保端点进入“正在删除”状态，如图 6-30 所示，并且最终从部署屏幕中消失。\n\
  \n## 总结\n\n在本章中，我们学习了不同的提示工程技术及最佳实践。提示工程是让 LLM 和 SLM 接地的重要方面，也是你需要做的第一件事。\n\n除了提示工程，我们还可以依赖\
  \ RAG 模型（推荐），并配置语义和向量搜索来提供结果，如前面章节所述。\n\n然而，在某些用例中，你可能需要微调模型，例如需要在边缘设备或断网环境中托管模型时。或者，当\
  \ RAG 架构效率不够高时，你可能希望开发一个领域特定模型。这些是微调的一些良好用例，但建议在微调之前始终先考虑 RAG。请记住，一旦基础模型被微调过，它就变成了自定义模型，你需要管理其生命周期。自定义微调模型不会重新引入到未来版本的基础模型中。\n\
