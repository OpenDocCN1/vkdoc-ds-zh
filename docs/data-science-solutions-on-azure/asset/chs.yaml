  \n7. 点击**下一步**。\n\n8. 在本练习中，我们将跳过标记。点击**下一步**。\n\n9. 在“查看 + 提交”部分，Azure 将验证到目前为止的所有设置，如果验证通过，请点击**创建**。否则，请按照需要修复的错误指示进行操作。\n\
  \n10. 部署你的 Azure OpenAI 服务实例后，转到该服务，在菜单的“资源管理”部分下，选择“密钥和终结点”，如图 3-11 所示。然后复制**密钥\
  \ 1** 和**终结点**，并将其存放在易于访问的位置（例如，Notepad++^(⁵¹)），因为我们稍后将在练习中用到它。\n\n### 部署模型\n\n\
  现在我们已捕获了 Azure OpenAI 服务终结点详细信息，就可以开始将模型部署到此终结点。此时，该终结点没有任何关联的大语言模型 (LLM)。Azure\
  \ OpenAI 终结点充当将托管在其上的所有模型的容器。\n\n\n\n### 动手练习 3-2  \n\n在本练习中，我们将部署 `GPT-4 (16k)\
  \ 0613` 模型。  \n\n![](img/501717_2_En_3_Fig12_HTML.jpg)  \n**图 3-12** – 模型部署  \n\n\
  1. 在 Azure OpenAI 服务实例中，点击菜单中“资源管理”下的“管理部署”，然后选择“管理部署”，如下图所示（图 3-12）。这将启动 Azure\
  \ OpenAI Studio。  \n\n![](img/501717_2_En_3_Fig13_HTML.jpg)  \n**图 3-13** – 在 Azure\
  \ AI Studio 中创建新模型部署  \n\n2. “管理部署”选项会将你引导至 Azure OpenAI Studio（52），我们将在本章稍后详细讨论。现在，当\
  \ Azure AI Studio 启动后，在“管理”部分选择“部署”，然后点击“创建新部署”，如下图所示（图 3-13）。  \n\n![](img/501717_2_En_3_Fig14_HTML.jpg)\
  \  \n**图 3-14** – 模型类型和详细信息  \n\n3. 在“部署模型”界面中，在相应的下拉框中，选择 `gpt-4` 作为模型，`0613 (Default)`\
  \ 作为模型版本，并提供部署名称。我们建议使用与模型版本相同的描述性名称，如下图所示（图 3-14）。  \n\n4. 我们先不展开和配置高级选项，直接点击 `Create`。\
  \  \n\n5. 当你的模型部署完成后，你会在部署页面中看到它，如下图所示（图 3-15）。请注意，我们保留了“部署名称”和“模型名称”一致，因为在所有情况下，当我们调用端点并引用模型时，我们使用部署名称而非模型名称。开发人员通常错误地引用模型名称，如果部署名称不一致，就会引发错误（53）。唯一可能需要使用不同名称的情况是当同一个模型部署了多个实例时，此时需要为每个模型实例指定不同的名称，如下图所示（图\
  \ 3-16）。  \n\n### 测试端点和模型  \n\n请注意，我们已有 Azure OpenAI 端点，并且至少有一个模型已部署到该端点，我们已准备好测试大语言模型。我们将介绍几种与\
  \ LLM 交互的不同方式，在此过程中，我们还将探索其他配置参数。  \n\n### 动手练习 3-3：使用 Postman  \n\nAzure OpenAI\
  \ 只是另一个 REST API（54）端点；我们将使用一种较为流行的 REST 探索工具——Postman（[`https://www.postman.com`](https://www.postman.com)）。\
  \  \n\n> **注意：** 在部署模型（动手练习 3-2）后，请至少等待五分钟再开始此练习，因为模型不会立即可用。五分钟后，在进行动手练习 3-3 时，如果你收到如下图所示的错误（图\
  \ 3-17），并且确定模型已创建且你正在使用当前的部署名称（而非模型名称），那么请稍等片刻再重试。  \n\n![](img/501717_2_En_3_Fig17_HTML.jpg)\
  \  \n**图 3-17** – 未找到模型时的错误  \n\n作为本动手练习的先决条件，如果你尚未安装，请[下载并安装 Postman](https://www.postman.com/downloads/)（55）。我们同时假设你具备\
  \ Postman 的基础操作知识，或者会阅读 Postman 的文档以熟悉该工具。这是一个简单但功能强大的工具，所以你不需要花太长时间就能熟练掌握。  \n\n\
  ![](img/501717_2_En_3_Fig18_HTML.jpg)  \n**图 3-18** – Postman POST 请求 – 完整 URL \
  \ \n\n1. （可选）在 Postman 中创建一个新集合。  \n2. 添加一个新请求。  \n3. 如下图所示（图 3-18），将新请求设置为 POST\
  \ 请求，并在 URL 中拼接你在动手练习 3-1 步骤 10 中复制的 Azure OpenAI 端点以及字符串 `/openai/deployments/gpt-4/chat/completions?api-version=2024-02-15-preview`。请注意，字符串中的\
  \ `gpt-4` 是部署名称（如动手练习 3-2 步骤 3 所述）。另请参见示例：[`https://myOpenAI.openai.azure.com/openai/deployments/gpt-4/chat/completions?api-version=2024-02-15-preview`](https://myopenai.openai.azure.com/openai/deployments/gpt-4/chat/completions?api-version=2024-02-15-preview)。\
  \  \n\n![](img/501717_2_En_3_Fig19_HTML.jpg)  \n**图 3-19** – Postman POST 调用的标头\
  \  \n\n4. 点击 Postman 中的“标头”选项卡，并添加两个键——`Content-Type` 和 `api-key`——如下图所示（图 3-19）。`Content-Type`\
  \ 的值为 `application/json`，`api-key` 的值为你在动手练习 3-1 步骤 10 中复制的 Azure OpenAI 端点密钥。 \
  \ \n\n![](img/501717_2_En_3_Fig20_HTML.jpg)  \n**图 3-20** – 为向 Azure OpenAI 发送 POST\
  \ 调用创建请求体  \n\n5. 点击“请求体”选项卡，选择“原始”作为输入类型，将以下代码粘贴到请求体中，然后点击保存，如下图所示（图 3-20）（56）。\
  \  \n\n```json\n{\n    \"messages\": [\n        {\n            \"role\": \"system\"\
  ,\n            \"content\": \"You are a helpful assistant\"\n        },\n      \
  \  {\n            \"role\": \"user\",\n            \"content\": \"Compose a 3-sentence\
  \ poem\"\n        }\n    ]\n}\n```\n\n![](img/501717_2_En_3_Fig21_HTML.jpg)  \n\
  **图 3-21** – 来自 Azure OpenAI POST 调用的 REST 响应结构  \n\n6. 让我们理解基于此请求体我们向 GPT-4 询问了什么：\
  \  \n\n   - 角色 `system` 表明这是一个系统提示。这是除了任何用户提示之外使用的默认提示，用于补充用户提示。  \n   - 系统提示中的\
  \ `content` 字段提供了一个角色设定，这里仅是对“有帮助的助手”这一角色的描述。  \n   - 角色 `user` 表明这是一个用户提示。  \n\
  \   - 用户提示的 `content` 是对模型的实际请求，此处要求编写一首三句话的诗歌。  \n\n7. 现在点击 `Send`。  \n\n8. 检查你收到的\
  \ REST 响应。它应该与下图（图 3-21）所示类似。JSON 响应中包含大量有用信息，但以下是需要重点突出的关键内容：  \n   - 状态码为 `200`，表示请求已被接受并处理（与此相反的是\
  \ `429` 响应，表示服务不可用）。\n\n\n\n### 2. 消息内容是 GPT-4 模型的实际响应。\n\n### 3. 使用情况显示了提示词和补全的令牌数量，这基于我们在第\
  \ 2 章关于成本的讨论非常有用。\n\n### 1. **可选**：修改`System Prompt`和`User Prompt`，然后重新提交请求，并观察响应和令牌使用情况。\n\
  \n虽然`Postman`是通过 REST API 端点探索 Azure OpenAI 模型的有用工具，但 Azure 本身提供了一个名为`AI Studio`的原生用户界面，可以帮助你的项目。我们将在下一节中探索`AI\
  \ Studio`。\n\n`AI Studio`是一个用于实验和原型设计的优秀工具。它还提供了一种将原型发布为应用程序的方法，因此你无需从头开始启动项目。\n\
  \n在撰写本文时，有两个 UI 环境——`AI Studio`和`Azure OpenAI Studio`。`AI Studio`和`Azure OpenAI\
  \ Studio`之间有很多重叠之处，后者存在时间更长，并且在 2023 年底引入`AI Studio`之前是唯一可用的 UI。通过介绍`AI Studio`，你应该也能够导航和使用`Azure\
  \ OpenAI Studio`。因此，本书将不涉及`Azure OpenAI Studio`。\n\n## Azure AI Studio 与 LLM 参数\n\
  \n`Azure AI Studio`于 2023 年 11 月发布^((57))，可以通过`Azure Portal`或访问[`https://ai.azure.com`](https://ai.azure.com)进入。在接下来的动手练习中，我们将探索`AI\
  \ Studio`并介绍新的 LLM 术语。**在撰写本文时，Azure AI Studio 处于预览阶段，因此 UI 每周都会发生变化。请查看本书的 GitHub\
  \ 仓库以获取动手练习的更新。**\n\n请记住，`Azure AI Studio`*并非*等同于`Azure OpenAI Studio`，相似的名称确实会引起混淆。`Azure\
  \ AI Studio`是一个基于 Web 的工具，用于所有 AI 工作。它提供对数据集、模型和工具（例如，`Prompt Flow`，稍后将介绍）的访问和管理。通过`Azure\
  \ AI Studio`提供的模型包括 OpenAI（`GPT`）以及非 OpenAI 模型，如`Mistral`、`Lama`和`Phi-3`。^((58))\
  \ `Azure OpenAI Studio`是一个基于 Web 的工具，用于管理和测试 Azure 上可用的仅限 OpenAI 的模型。\n\n`Azure\
  \ AI Studio`作为实例部署在特定区域，我们将在练习 3-4 中看到。`Azure AI Studio`实例可用的功能也取决于区域。例如，在撰写本文时，微调`Phi-3`小型^((59))语言模型的功能仅适用于部署在`US\
  \ East 2`区域的`Azure AI Studios`。你可以在一个区域内部署多个`Azure AI Studio`。\n\n将`Azure AI Studio`视为你的生成式\
  \ AI 项目的中心^((60))。可以在`AI Studio`实例内管理多个 AI 项目。\n\n### 动手练习 3-4：Azure AI Studio\n\
  \n![](img/501717_2_En_3_Fig22_HTML.jpg)\n\n图 3-22\nAzure AI Studio 菜单\n\n1.  打开一个新的浏览器，访问[`https://ai.azure.com`](https://ai.azure.com)，点击右上角的`Sign\
  \ in`并进行身份验证。\n2.  如下图所示，点击图 3-22 中的`Build`。\n    ![](img/501717_2_En_3_Fig23_HTML.jpg)\n\
  \n    图 3-23\n    在 Azure AI Studio 中创建 AI Hub 工作区\n\n3.  点击 ![](img/501717_2_En_3_Figa_HTML.jpg)，为项目指定一个名称，并选择我们之前创建的`Azure\
  \ OpenAI`实例，如图 3-23 所示。然后，点击 ![](img/501717_2_En_3_Figb_HTML.jpg)。\n    ![](img/501717_2_En_3_Fig24_HTML.jpg)\n\
  \n    图 3-24\n    项目使用的 Azure AI Studio\n\n4.  创建项目后，点击项目名称将其打开，你将进入该项目`Azure AI\
  \ Studio`的主界面^((61))，如图 3-24 所示。\n    ![](img/501717_2_En_3_Fig25_HTML.jpg)\n\n\
  \    图 3-25\n    在 AI Studio 中切换项目\n\n5.  随着时间的推移，当你承担不同的项目时，你可以通过点击项目名称旁边的 ![](img/501717_2_En_3_Figc_HTML.jpg)\
  \ 图标并选择所需的项目来切换项目，如下图所示，如图 3-25 所示。\n    ![](img/501717_2_En_3_Fig26_HTML.jpg)\n\
  \n    图 3-26\n    在 AI Studio 中更改 LLM 的参数\n\n6.  在`Tools`^((62))菜单下，点击`Playground`。如下方图\
  \ 3-26 所示，`Playground`作为一个用户界面 (UI)，可以快速更改模型参数，例如系统提示词、温度等，然后测试模型的行为。在这里，我们将介绍第\
  \ 2 章中未涵盖的其他新 LLM 术语。\n\n**表 3-1** 生成的令牌及其对应值\n\n| 令牌 | 概率 |\n| --- | --- |\n| sandy\
  \ | 0.4 |\n| sunny | 0.2 |\n| warm | 0.2 |\n| peaceful | 0.15 |\n| tranquil | 0.05\
  \ |\n\n1.  **温度：**^((63)) 此参数是介于 0 和 1 之间的值，控制 LLM 生成响应时的创造力。这种创造力有时被描述为模型的随机性。在构建响应时，它会考虑下一个令牌的概率。作为一个简单的类比，考虑以下句子，并填空：\n\
  \n    *The beach is \\_\\_\\_\\_\\_.*\n\n    将空白视为下一个令牌。首先想到的词可能是`\"sandy\"`、`\"\
  sunny\"`、`\"warm\"`、`\"fun\"`等。这些词具有较高的概率分数。\n\n    不太可能的词，尽管并非不正确，可能是`\"serene\"\
  `、`\"tranquil\"`等。这些词的概率分数较低。\n\n    接近零的温度值会使 LLM 选择更可能的词。接近一的温度值会导致 LLM 探索概率分数较低的词。\n\
  \n2.  **Top-p：**^((64)) `Top-p`参数，有时称为`核采样`，在这种方法中，选择令牌直到它们的累积概率达到或超过由`p`定义的概率值。再次考虑上面的例子，但这次假设\
  \ LLM 只有五个词汇表，并且为完成句子而生成的每个令牌的概率如表 3-1 所示。\n\n    令牌按概率从高到低排序。如果`p=0.5`，则`\"sandy\"\
  `和`\"sunny\"`将被选中，并且由于`\"sunny\"`会使累积概率超出`p`的值，因此其余令牌将被丢弃，如下面的表 3-2 所示。\n\n**表 3-2**\
  \ `p = 0.2`\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，对给定的英文文本进行翻译。\n\n---\n\n\n\
  | Token | Value | Cumulative | Is cumulative > threshold? (Y/N) | Action |\n| ---\
  \ | --- | --- | --- | --- |  \n| `sandy` | 0.4 | 0.4 | N | Accept |\n| `sunny` |\
  \ 0.2 | 0.6 | Y (just surpassed) | Accept |\n| `warm` | 0.2 | 0.8 | NA (not applicable\
  \ because already surpassed by previous token | Discard |\n| `peaceful` | 0.15 |\
  \ 0.95 | NA | Discard |\n| `tranquil` | 0.05 | 1.0 | NA | Discard |\n\n由于有两个可能的\
  \ token，它们的概率将被归一化，然后应用一种称为二项式^(⁶⁵)分布的采样方法，从中选择一个用于响应中。\n\n如果存在两个以上的可能 token，例如，如下表\
  \ 3-3 所示，当 `p=0.8` 且有三个可能 token 时，将使用多项^(⁶⁶)分布来采样 token，以便选择一个。\n\n**表 3-3** `p\
  \ = 0.8`\n\n| Token | Value | Cumulative | Is cumulative > threshold? (Y/N) | Action\
  \ |\n| --- | --- | --- | --- | --- |\n| `sandy` | 0.4 | 0.4 | N | Accept |\n| `sunny`\
  \ | 0.2 | 0.6 | N | Accept |\n| `warm` | 0.2 | 0.8 | N | Accept |\n| `peaceful`\
  \ | 0.15 | 0.95 | Y | Discard |\n| `tranquil` | 0.05 | 1.0 | NA | Discard |\n\n\
  1.  **Top-k:** Top-k 是 Top-p 的一种替代方案，但 OpenAI 未使用；因此，您在 AI Studio 中看不到该参数可以配置。但为了完整性，我们将简要讨论这个概念。Top-k\
  \ 简单地选择概率最高的前 `k` 个 token，例如，如果 `k=3`，则将选择前 3 个 token – `sandy`、`sunny` 和 `warm`。选择之后，将像\
  \ Top-p 中一样应用二项式或多项分布采样。\n\n2.  **频率惩罚 (Frequency Penalty):** 此参数会惩罚已用于生成响应的 token。这降低了文本中单词被重复的可能性。每次使用该单词时，它都会按比例受到惩罚，以最大限度地减少重复使用。此参数的值为\
  \ 0 到 2 之间，数值越大，对每次重复使用单词的惩罚就越重。\n\n3.  **存在惩罚 (Presence Penalty):** 此参数在 token\
  \ 首次用于响应时对其施加一次性惩罚。它是在频率惩罚之上的附加惩罚，其值也在 0 到 2 之间。\n\n在下一个动手练习中，我们将修改这些参数，并观察这对 LLM\
  \ 响应的影响。在此之前，需要了解几点：通常 Temperature 比 Top-p 更常用，并且在大多数情况下，除非需要控制响应中文本的使用频率，否则您可能不需要修改频率惩罚和存在惩罚的值。\n\
  \n对于 Temperature 设置，经验法则是：如果期望的响应不是确定性的（基于事实的），则应使用接近 0 的值。如果期望的响应更具创造性，则应使用接近 1\
  \ 的值。\n\n### 动手练习 3-5：探索 LLM 参数与行为\n\n在此动手练习中，我们将继续上一个练习，通过 AI Studio 与 LLM 进行对话。然后，我们将修改上面讨论过的参数，并观察响应是否有变化。\n\
