  \ Google 领导层的呼声日益高涨之际，Google 首席执行官不得不公开道歉。\n\n另一个持续困扰 Google 云服务的问题是其在隐私方面的立场，这源于其广告业务。当有报道称\
  \ Google 将存储客户对话记录时，这一担忧也延伸到了`Gemini`。查阅`Gemini`的[隐私中心](https://support.google.com/gemini/answer/13594961#privacy_notice)^(²⁵)可以发现，对话记录默认在您的\
