  \n### 规划器与函数调用\n\n一旦您拥有多个插件（这在许多（即便不是全部）实际应用中很可能会出现），就需要 LLM 知晓这些插件，并能够将它们组合使用以完成请求或任务。\n\
  \nSemantic Kernel 引入了规划器的概念，允许 LLM 使用不同的插件。规划器使用提示词请求 AI 选择要调用哪个函数。\n\n然而，更新版本的\
  \ OpenAI 模型（0613 版及以上）具备原生调用函数的能力，这被称为函数调用。因此，Semantic Kernel 正在演进，将函数调用作为规划和执行任务的主要方式。尽管\
  \ Semantic Kernel 仍然支持规划器，但其他 AI 模型（如 Gemini、Claude 和 Mistral）也支持函数调用作为原生能力，这使得\
  \ Semantic Kernel 中的函数调用成为一项可跨多种模型使用的功能。因此，建议将 Semantic Kernel 中的函数调用作为规划和执行任务的主要方法^(⁸⁸)。\n\
  \n鉴于这一发展，我们将不介绍规划器，而是重点关注函数调用。如果您使用的是不支持函数调用的旧模型，可以了解规划器及其向函数调用的演进过程；这里有一个很好的[资源](https://devblogs.microsoft.com/semantic-kernel/migrating-from-the-sequential-and-stepwise-planners-to-the-new-handlebars-and-stepwise-planner/)\
  \ ^(⁸⁹)，来自 Microsoft 开发者博客，涵盖了这一内容。\n\n#### 自动函数调用\n\n函数调用仅仅是 AI 模型原生调用函数的一种方式。函数调用的一个扩展——称为自动函数调用——是指\
  \ LLM 能够理解哪些函数可用于不同任务，并随后将其作为知识的一部分来响应请求。\n\n描述自动函数调用的一个好方法是将其与“后续问题或后续操作”场景联系起来。这些场景涉及的任务请求需要先进行澄清性问题或操作之后才能执行。\n\
  \n**示例 1：后续问题（基于聊天的场景）**\n\n用户：请给我最近客户服务地点的电话号码\n\nLLM：您在哪里？\n\n用户：我在西雅图。\n\nLLM：我在西雅图有几个地点。以下是地址\
  \ – ...\n\n**示例 2：后续操作（自动化场景）**\n\n用户：请打开所有灯\n\nLLM：思考过程 = *找到所有灯，选择当前关闭的灯，识别关闭的灯的名称，打开它们，向用户报告所有灯现在都已打开，并且具体打开的灯是\
  \ x、y 和 z。*\n\n在上述两个示例中，要执行后续问题或后续操作，需要迭代逻辑（例如，循环），直到获取执行任务所需的所有信息。自动函数调用为您处理了这一点。\n\
  \n\n\n### 聊天补全中的自动函数调用\n\n下图 7-22^(⁹⁰) 展示了 Semantic Kernel 如何实现自动函数调用。当通过模板或代码中的函数暴露给内核时，内核会将这些函数序列化，并呈现给大语言模型（LLM）。\n\
  \n![](img/501717_2_En_7_Fig22_HTML.jpg)\n\n**图 7-22** Semantic Kernel 如何实现函数调用\n\
  \n序列化是内核的一项内置功能，序列化后的函数使 LLM 能够理解这些函数及其所需的任何参数。\n\n当用户发出请求时，序列化后的函数、聊天历史记录以及当前请求都会一起发送给\
  \ LLM。有了这些信息，LLM 可以在必要时提出澄清性问题，或者调用函数来执行任务。结果随后会返回给用户。\n\n### 动手实验 7-3：具有自动函数调用功能的\
  \ Semantic Kernel 与聊天补全\n\n在本实验中，我们使用了 `GPT-4o`，但您也可以使用任何 `0125` 或更高版本的 Azure OpenAI\
  \ 模型。\n\n![](img/501717_2_En_7_Fig23_HTML.jpg)\n\n**图 7-23** 添加了 `InventoryPlugins`\
