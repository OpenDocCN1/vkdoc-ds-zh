  }, {\"role\": \"user\", \"content\": \"Can I play PC games on my Xbox?\"}, {\"role\"\
  : \"assistant\", \"content\": \"While Xbox consoles don't natively support PC games,\
  \ they can play an array of Xbox games, many of which are also available on PC.\
  \ Can I assist you with finding games compatible with your Xbox device?\"}]}`\n\
  * `{\"messages\": [{\"role\": \"system\", \"content\": \"You are an Xbox customer\
