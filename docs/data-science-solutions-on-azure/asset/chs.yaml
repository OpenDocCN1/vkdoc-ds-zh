  \n## Plugins 和 Functions\n\n`Plugins`以前被称为`Skills`。如上所述，`Semantic Kernel`中的插件使开发人员能够为`LLM`创建扩展以执行任务。插件可以组合成基于业务的插件集，以形成功能任务。\n\
  \n插件可以执行一个或多个任务。插件的功能被称为`functions`。因此，在高级层面上，插件是一组可以暴露给`LLM`的函数。\n\n### 样式\n\n\
  延续我们的零售场景，我们零售商店的业务功能示例可以包括订单、退货、客户关系、销售人员以及库存。我们可以创建一个基于业务的插件，其中包含如下方图 7-10 所示的功能任务。\n\
