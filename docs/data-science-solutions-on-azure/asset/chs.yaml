  \n1. 按照提示并提供必要信息以部署该服务。其步骤应与你在第 3 章中部署 Azure OpenAI 时几乎完全相同。\n2. 转到 Azure AI 服务实例。这是你可在订阅中部署或管理所有\
  \ Azure AI 服务的地方，如下方图 9-4 所示。\n\n![](img/501717_2_En_9_Fig5_HTML.jpg)\n\n图 9-5：创建自定义视觉实例\n\
