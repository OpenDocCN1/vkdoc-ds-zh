  2.  最后一个代码块通过向代理提供一个自然语言问题来调用它。观察输出中的思维过程、观察结果和最终响应，如下图 8-15 所示。\n\n1.  参考表 8-2\
  \ 修改自然语言问题。然后重新运行代码并观察结果。\n\n## 总结\n\n在本章中，我们学习了使用 LangChain 和 Semantic Kernel 等框架来创建由\
  \ LLM 编排的应用程序。最好熟悉这两个框架，这就是为什么我们在上一章介绍了 Semantic Kernel，并在本章使用 LangChain 进行了专门的练习。\n\
  \n在我们关于 DBCopilot 的动手练习中，我们只使用了一个包含单个表的数据库。然而，LLM 可以处理包含多个表的数据库。扩展`DBCopilot.jpynb`笔记本，让它连接到一个包含多个表的数据库并用自然语言提问，将是一个有趣的练习。您应该能够观察到\
  \ LLM 在表之间创建复杂连接以提供问题答案的能力。\n\n到目前为止，尽管我们主要关注非结构化数据，但数据库从一开始就是计算历史的一部分。现在，DBCopilot\
  \ 代理使数据对于不具备数据库查询专业知识的领域专家来说更易于访问，从而可以解锁大量洞察。\n\n脚注 1   2   3   4   5   6   7  \
