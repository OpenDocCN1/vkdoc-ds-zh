  \ 投资了 Anthropic。Anthropic 的生成式 AI 模型名为`Claude`，AWS 将其称为基础模型（FM）。\n\nAWS 提供了一个名为`AWS\
  \ Bedrock`的全托管前端服务，该服务是连接一系列基础模型的 API 网关。下图 2-2 展示了来自不同 AI 提供商的若干基础模型。\n\n![](img/501717_2_En_2_Fig2_HTML.jpg)\n\
