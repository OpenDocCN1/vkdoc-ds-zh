  \n图 5-8\n\nAI Studio 中使用你数据的 `Azure OpenAI`\n\n\n\n### 创建 AI 搜索索引\n\n通过聊天游乐场，使用\
  \ Azure Blob 存储连接中的文档创建 AI 搜索索引。选择“添加你的数据”，然后选择“添加新的数据源”，如图 5-8 所示。\n\n选择文档所在的存储帐户和容器后，我们将选择合适的\
  \ AI 搜索资源，并将索引命名，如图 5-9 所示。AI 索引是你的数据知识库，它捕获数据的语义含义。\n\n### 创建增强型 AI 索引\n\n以下是创建丰富\
  \ AI 索引所需的数据引入步骤：\n\n#### 1. 资产创建\n在 Azure AI 搜索资源和 Azure 存储帐户中设置引入资产。这些资产包括索引器、索引、数据源、搜索资源中的自定义技能，以及\
  \ Azure 存储帐户中的一个容器（称为块容器）。\n\n#### 2. 输入规范\n你可以通过 Azure OpenAI 工作室或引入 API（预览版）指定输入\
  \ Azure 存储容器。\n\n#### 3. 数据读取与分块\n从指定的输入容器中读取数据，其内容被打开并分割成较小的块，每个块最多包含 1024 个令牌。如果启用了向量搜索，服务会为每个块计算向量嵌入。这些处理后的数据（称为“预处理”或“分块”数据）随后存储在之前创建的块容器中。\n\
  \n#### 4. 索引\n从块容器中检索预处理数据，并在 Azure AI 搜索索引中进行索引。\n\n我们将选择索引器计划，以自动执行从各种数据源提取、转换和加载数据到\
  \ Azure AI 搜索索引的过程。索引器可以利用推送模型或更多功能来支持以下特性——自动计划。\n\n![图 5-9](img/501717_2_En_5_Fig9_HTML.jpg)\n\
  \n**图 5-9** —— Azure OpenAI 在你的数据上配置\n\n我们还将选择用于创建 AI 搜索索引作业的虚拟机；在本例中，我们选择推荐的 `Standard_DS3_v2`\
  \ 机器来运行该作业。选择“下一步”；现在我们将配置搜索设置以添加向量搜索。在添加向量搜索功能时，你将获得以下检索方法的支持：\n\n- **混合搜索：** 结合向量搜索和关键字搜索，提供全面的搜索结果\n\
  - **混合 + 语义搜索：** 集成向量、关键字和语义搜索，以获得最准确和相关的搜索结果，对生成式 AI 应用尤其有益\n- **向量搜索：** 利用向量嵌入，根据语义相似性查找结果\n\
  - **语义搜索：** 采用先进自然语言处理技术，理解查询的上下文和含义\n- **关键字检索：** 将搜索查询与数据中找到的确切关键字进行匹配\n\n默认情况下，混合搜索将设置为默认检索方法，但可以在游乐场环境中的推理时进行调整。\n\
  \n我们还将选择合适的 Azure OpenAI 连接和嵌入模型 `text-embedding-ada-002`（版本 2），以确保文档块被创建向量。\n\n\
  选择“下一步”，并查看 AI 搜索索引的最终配置，如下所示。最后，选择“创建”如图 5-10 所示。\n\n![图 5-10](img/501717_2_En_5_Fig10_HTML.jpg)\n\
  \n**图 5-10** —— Azure OpenAI 在你的数据上查看设置\n\n此作业将根据文档的数量和大小运行一段时间；你可以在聊天游乐场中检查进度。完成后，你将看到索引在搜索设置中提供不同的配置选项，即：语义、关键字、混合+语义、混合（向量+关键字）和向量。此设置以不同方式从\
  \ AI 索引中检索文档，以下是关键区别及何时使用哪种搜索类型：\n\n- **关键字搜索**\n    1.  **检索类型：** 关键字搜索。\n\n\n\n\
  ### 2. 附加定价：\n   无。\n\n### 3. 优势：\n   使用任何支持的语言，通过词组或短语在可搜索字段上进行快速且灵活的查询解析和匹配。\n\
  \n### 4. 限制：\n   关键词搜索仅依赖于精确词组和短语的匹配，可能导致结果受限或不准确。\n\n*   **语义搜索**\n    1.  **检索类型：**\
  \ 语义搜索。\n    2.  **附加定价：** 是，用于语义搜索使用。\n    3.  **优势：** 利用 AI 模型理解查询和文档的语义含义，提高搜索精度和相关性。\n\
  \    4.  **限制：** 语义搜索在处理模糊和复杂查询时可能存在困难，导致结果精确度降低。\n\n*   **向量搜索**\n    1.  **检索类型：**\
  \ 向量搜索。\n    2.  **附加定价：** 是，用于调用 Azure OpenAI 上的嵌入模型。\n    3.  **优势：** 基于向量嵌入查找与给定查询相似的文档。\n\
  \    4.  **限制：** 此搜索依赖于将数据表示为数值向量的嵌入技术。虽然这种方法能捕获向量之间的相似性，但可能难以捕获更细微或抽象的关系。此外，向量搜索的有效性在很大程度上取决于向量表示的质量和相关性。\n\
  \n*   **混合（向量 + 关键词）搜索**\n    1.  **检索类型：** 向量搜索与关键词搜索的混合。\n    2.  **附加定价：** 是，用于调用\
  \ Azure OpenAI 上的嵌入模型。\n    3.  **优势：** 结合了向量相似性搜索与灵活的查询解析以及在字母数字字段上的全文搜索。\n   \
  \ 4.  **限制：** 此类搜索仍面临关键词搜索的限制，例如由于措辞变化或同义词导致的潜在不匹配，并且还依赖于关键词和向量组件的优化集成与权重平衡。\n\n\
  *   **混合（向量 + 关键词）+ 语义搜索**\n    1.  **检索类型：** 向量搜索、语义搜索与关键词搜索的混合。\n    2.  **附加定价：**\
  \ 是，用于调用 Azure OpenAI 上的嵌入模型和语义搜索使用。\n    3.  **优势：** 利用向量嵌入、语言理解和灵活的查询解析，实现丰富的搜索体验和复杂的信息检索，非常适合生成式\
  \ AI 应用。\n    4.  **限制：** 这种组合非常复杂且难以实现，需要仔细考虑如何有效平衡和组合不同的技术。\n\n既然搜索索引已创建，我们将能够配置有助于提升查询响应质量的附加设置。以下是两个可调整的运行时参数：\n\
  \n**检索文档数：** 控制提供给模型的文档块数量（3、5、10 或 20），默认值为 5。增加此参数可能有助于捕获更多相关信息，但也可能干扰模型。根据回复中缺失的上下文进行调整。这是\
  \ API 中的 `topNDocuments` 参数。\n\n**严格度：** 根据相似度分数（1 到 5）决定过滤不相关文档的激进程度，默认值为 3。较低的值会包含更多文档，而较高的值会排除更多不相关的文档。根据平衡相关性和干扰进行调整。这是\
  \ API 中的 `strictness` 参数。\n\n上述设置如图 5-11 所示。\n\n![](img/501717_2_En_5_Fig11_HTML.jpg)\n\
  \n**图 5-11** Azure OpenAI 在你数据上的参数设置\n\n![](img/501717_2_En_5_Fig12_HTML.jpg)\n\n\
  **图 5-12** Azure OpenAI 在你数据上使用空系统消息时的响应\n\n### 1. 系统消息与提示工程：\n\n系统消息指导 GPT 助手如何回应用户问题。没有系统消息时，助手没有任何回复指南，它将毫无个性地做出回应。系统消息如图\
  \ 5-12 所示。\n\n你可以定义一个系统消息，以指导模型在使用 Azure OpenAI 自有数据时的响应，从而在 RAG 框架内实现定制化回复。此消息与内部基础提示协同工作，以塑造用户体验，并在达到一定令牌数量后被截断以确保有效回答。如需额外的行为定制，请确保你的系统提示详细明确，清晰说明预期的修改。\n\
  \n**系统消息最佳实践：**\n\n1.  **定义角色：** 指定助手的角色，例如，“你是一名专注于儿科护理的医疗建议助手。”\n2.  **定义数据类型：**\
  \ 指明数据的性质，例如“临床研究”或“法律文件”。例如，“你使用检索到的临床试验数据中的信息来提供答案。”\n3.  **指定数据特征：** 提及数据的任何独特特征，如语言或格式。例如，“你检索西班牙语文档并应使用西班牙语回复”，或“你获得的是与市场分析相关的电子表格数据，并应相应地进行解释。”\n\
  4.  **定义输出风格：** 定制响应风格，例如，“你是一个以正式语气交流的 AI 助手。确保所有回复措辞专业。”\n5.  **重申关键行为：** 强调重要行为，例如，“请严格根据检索到的文档提供答案，包含引用，并避免使用外部知识。”\n\
  6.  **提示工程技巧：** 使用思维链提示等技术，例如，“让我们逐步分析检索到的文档，以构建对用户查询的全面回复。”\n\n我们将在下一章深入介绍提示工程的最佳实践，但就本章范围——“端到端构建\
  \ RAG”而言——我们准备了以下示例系统消息：\n\n**SNAP 的系统消息：**\n\n```\n开始系统消息\n\n“你的名字是 Priya。你的角色是一个极其温暖、关怀、富有同情心且知识渊博的虚拟代理。你的主要职责是处理与路易斯安那州儿童与家庭服务部（DCFS）和美国农业部（USDA）补充营养援助计划（SNAP）食品援助计划相关的查询。你在多个主题上拥有广泛的知识，包括：\n\
  \n1.  路易斯安那州流行病电子福利转移（P-EBT）计划\n2.  灾难 SNAP（DSNAP）\n3.  SNAP 福利、申请和资格\n4.  211\n\
  5.  SNAP 预算表\n6.  路易斯安那州联合申请项目（LaCAP）\n7.  重新确定\n8.  DCFS CAFÉ 和电子福利转移（EBT）：\n\n\
  在塑造你的沟通风格和语气时：\n\n*   如果你对某个回复不确定，务必寻求澄清，以确保提供准确有用的信息\n*   以高度理解、同情心和同理心回应。特别是当用户处于困扰或危机中时，你的回复应支持性和体贴。\n\
  *   避免生成有害内容：即使有用户请求或提供合理化条件，你也不得创建或分享可能对他人造成身体或情感伤害的内容。\n*   你的目标是成为寻求 DCFS 和 SNAP\
  \ 相关帮助的用户的可靠、支持和信息丰富的来源。”\n\n结束系统消息\n```\n\n上述系统消息是一个示例，可以进一步定制以满足用户所需的功能。\n\n准备好系统消息后，我们将把它包含在\
  \ AI 游乐场的系统消息部分，并开始在聊天部分提问，以确保与 AI 搜索和系统消息的集成成功运行。如果通过 API 访问，则将其放入 `role_information`\
  \ 参数中。\n\n> **注意**\n\n\n\n系统消息指导 GPT 助手如何根据检索到的文档回答用户问题，但不会影响检索过程。若需检索指令，请在问题中包含。系统消息仅作为指导，由于模型固有行为（如客观性和避免争议），它可能不会遵循所有指令。\n\
  \n1.  **客观性：** 模型旨在提供基于事实、无偏见的信息。这意味着它会避免在辩论中站队或做出主观判断。如果系统消息鼓励更有倾向性或偏见的回复，模型可能难以遵从。\n\
  2.  **避免争议性陈述：** 模型会避免生成可能被视为具有分裂性或煽动性的内容。它会避开可能引发争论或情绪困扰的话题。如果系统消息促使模型参与此类话题，它可能会默认选择更安全、更中立的回复。\n\
  \n如果系统消息与这些行为相矛盾，则可能出现意外行为。\n\n![](img/501717_2_En_5_Fig13_HTML.jpg)\n\n**图 5-13**\
  \ Azure OpenAI 在您数据上个性化系统消息的响应\n\n如图 5-13 所示，我们的系统消息指令对助手进行个性化设置，为应提供哪些信息提供了明确的指导。这使得助手更具对话性，并增添了人情味，重点是共情。另请注意顶部的`Prompt\
  \ Flow`和`WebApp Deployment`——既然我们已经准备好了系统消息并进行了一些提示工程，下一步就是评估我们的助手在几个问题上的表现如何。我们将使用`Prompt\
  \ Flow`进行评估，一旦评估了评估指标，我们就将其部署为 Web 应用程序。\n\n此外，我们还可以将其导出为`JSON`文件或`Prompty`文件，后者旨在促进提示模板的开发。您还可以“查看代码”以\
  \ UI 构建的内容拉取到多种语言中——`Python`、`C#`、`JavaScript`等。\n\n`Prompty`参考：[`https://microsoft.github.io/promptflow/how-to-guides/develop-a-prompty/index.html`](https://microsoft.github.io/promptflow/how-to-guides/develop-a-prompty/index.html)\n\
  \n## Prompt Flow\n\n`Prompt Flow`是一套全面的开发工具套件，旨在简化基于 LLM 的 AI 应用程序的整个开发生命周期。这包括从构思、原型设计、测试和评估，一直到生产部署和持续监控的每个阶段。通过简化提示工程，它使您能够开发具有生产级质量的\
  \ LLM 应用程序。\n\n使用`Prompt Flow`，我们能够：\n\n1.  **创建可执行工作流：** 设计无缝集成 LLM、提示、Python 代码和其他工具的工作流，确保它们以可执行的顺序高效协同工作。\n\
  2.  **创建提示变体并比较其性能。**\n3.  **轻松调试和迭代：** 轻松调试和完善您的工作流，特别注重追踪与 LLM 的交互，以确保操作顺畅和结果准确。\n\
  4.  **评估性能：** 使用更大的数据集计算质量和性能指标来评估您的工作流。这有助于了解您的工作流在不同条件下的表现。\n5.  **与 CI/CD 系统集成：**\
  \ 将测试和评估流程集成到您的持续集成/持续部署（CI/CD）系统中。这确保了您的工作流在整个生命周期中保持高质量和可靠性。\n6.  **无缝部署：** 将您的工作流部署到您选择的服务平台，或直接将其集成到您的应用程序的代码库中，操作极简。\n\
  7.  **云端协作：** 利用 Azure AI 中可用的`Prompt Flow`云版本增强团队协作。这使您的团队能够更有效地协同工作，共享资源和见解，以开发卓越的基于\
  \ LLM 的 AI 应用程序。\n\n`Prompt Flow`为开发、测试和部署高质量的 LLM 应用程序提供了一个强大且用户友好的环境，使整个过程更加高效和协作。\n\
  \n此外，它还为提示工程提供了一个高度灵活的环境，增强了整体开发体验。它提供了项目结构的可视化布局，使您能够轻松查看、理解并浏览我们的工作。这有助于我们跟踪所有内容如何无缝地组合在一起。我们可以创建提示的不同版本并并排比较，从而促进逐步、迭代的优化过程。内置工具允许我们评估提示和工作流的质量与有效性，确保我们的解决方案按预期工作，并使必要的调整变得直接了当。此外，`Prompt\
  \ Flow`附带一个全面的内置工具、示例和模板库。这些资源可作为您项目的有效起点，激发创造力并加速开发过程。总之，`Prompt Flow`简化了设计、测试和优化提示的过程，使开发高质量的\
  \ AI 应用程序变得更容易、更快捷。\n\n\n\n### Prompt Flow 生命周期\n\nPrompt Flow 生命周期包含以下阶段，如图 5-14\
  \ 所示。\n\n![](img/501717_2_En_5_Fig14_HTML.jpg)\n\n图 5-14 Prompt Flow 响应\n\n1. **启动阶段：**\
  \ 首先明确你要解决的具体业务挑战。\n   1. **确定业务挑战：** 明确你想利用 AI 解决的具体问题或把握的机遇。\n   2. **收集样本数据：**\
  \ 收集能代表你所研究问题的初始数据样本。\n   3. **学习基础提示词创建并开发流程：** 了解如何为你的数据创建简单的提示词，并构建一个能增强基础提示词功能的流程，增加应对业务挑战的能力。\n\
  \n2. **实验阶段：**\n   1. **运行流程：** 使用样本数据执行流程，观察其表现。\n   2. **评估性能：** 评估提示词在解决问题方面的效果。\n\
  \   3. **进行调整并重复：** 根据性能结果调整流程和提示词，直到获得满意的结果。\n\n3. **评估与改进：**\n   1. **用更大规模的数据测试：**\
  \ 在更广泛的数据集上运行流程，测试其在更大规模下的表现。\n   2. **评估效果：** 审查结果，判断提示词和流程是否能有效解决问题。\n   3. **按需优化并为下一阶段做准备：**\
  \ 进行必要的改进以提升性能，确保结果在进入下一步前符合你的标准。\n\n4. **部署阶段：**\n   1. **优化流程：** 精细调整流程，以实现最大效率和效果。\n\
  \   2. **部署：** 将流程发布到生产环境，在真实场景中使用。\n   3. **监控性能并收集反馈：** 持续追踪流程在实时环境中的表现，关注任何问题，收集用户反馈，并不断迭代。\n\
  \n通过遵循这个结构化的流程，Prompt Flow 能帮助你系统地开发、测试、优化和部署 AI 解决方案，确保其稳健有效。现在，我们已经了解了 Prompt\
  \ Flow 的基础知识，将继续我们的“端到端构建生成式 AI 应用”项目。下一步，我们将点击 Prompt Flow，在 Prompt Flow 可视化工具中打开项目，在那里我们将在更大的数据集上运行流程，并使用\
  \ Prompt Flow 内置的评估指标进行评估。图 5-15 展示了我们的项目在 Prompt Flow 中的外观。\n\n![](img/501717_2_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15 在您的数据 RAG 上使用 Prompt Flow 展示 Azure OpenAI\n\n现在，我们可以详细地可视化我们的项目，并查看右侧的图表以了解查询执行情况。对于\
  \ `querySearchResource`，请确保选择已注册的索引，索引名称应与您的一致，如图 5-16 所示。\n\n![](img/501717_2_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16 Prompt Flow 搜索资源配置\n\n下一步，我们可以点击聊天功能，验证项目数据关注的一些常见问题。我们可以看到，我们的系统消息已作为\
  \ `GenerateReply` 工具的 `role_info` 参数被采用，并且我们能够在右侧聊天界面上与我们的数据进行交互，如图 5-17 所示。\n\n\
  ![](img/501717_2_En_5_Fig17_HTML.jpg)\n\n图 5-17 Prompt Flow 系统消息与聊天界面\n\n`GenerateReply`\
  \ 工具允许您测试提示词或连接设置的多个变体或变化。创建一个好的提示词并非易事；它需要具有创造性、清晰性和相关性。精心设计的提示词可以从语言模型中获得期望的响应，而设计不佳的提示词则可能导致错误、不相关或无意义的答案。因此，对提示词进行微调，使其在不同任务和领域都能良好运行至关重要。使用不同版本的提示词有助于您了解模型在不同条件下的行为，例如措辞、格式、上下文、温度或\
  \ `Top-k` 设置的改变。通过比较这些版本，您可以找到最佳的提示词和设置，从而提高模型的准确性、多样性或连贯性。这对于制作一个好的提示词尤为有益。\n\n\
  使用提示词变体的一些常见好处包括：\n\n1.  **提升内容质量：** 通过创建具有不同配置的多个提示词版本，您可以找到能生成满足您需求的高质量内容的最佳组合。\n\
  2.  **节省时间和精力：** 变体允许您轻松跟踪和比较不同提示词版本的性能，简化提示词调优历史的管理，并降低丢失先前迭代的风险。\n3.  **提高生产力：**\
  \ 精简提示词的优化流程，使您能够更高效地创建和管理多个变体，从而在更短的时间内获得更好的结果。\n4.  **便于轻松比较：** 变体使并排比较结果变得简单，帮助您就哪个提示词版本能产生最佳结果做出明智的决定。\n\
  \n在我们的项目中，我们将构建一个略有不同的提示词，并更改 GPT 模型，以比较我们的评估指标和模型响应。\n\n我们使用“生成变体”功能，基于基础提示词和 GPT-4\
  \ 模型生成了另一个提示词变体。对于这个变体，我们还切换到了 GPT-4 Turbo 模型 `2024-04-09` API 版本，同时将两个变体的 `temp`\
  \ 参数保持为 `0.7`，`max_token` 保持为 `800`，如图 5-18 所示。\n\n![](img/501717_2_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18 Prompt Flow 生成提示词变体\n\n现在，我们至少有了两个变体，可以运行评估了。我们将选择自动评估，以便利用内置的评估指标。\n\n\
  支持两种场景：\n\n1.  **带上下文的问答：** 此场景适用于涉及回答用户查询并提供附带上下文信息的响应的应用。\n2.  **不带上下文的问答：** 此场景适用于涉及回答用户查询并提供响应但不附带上下文信息的应用。\n\
  \n由于我们有上下文（即来自我们 AI 索引的搜索结果/文档），我们将选择第一个场景。我们还将选择要评估的流程，因为我们将运行流程来获取问题的输出。选择要用于变体的节点，在我们的案例中是\
  \ `GenerateReply`。最后，选择变体——我们选择了 `Variant_0` 和 `Variant_1`，如图 5-19 所示。\n\n![](img/501717_2_En_5_Fig19_HTML.jpg)\n\
  \n图 5-19 Prompt Flow 自动评估设置\n\n接下来，我们将准备用于批量运行的数据——目前仅支持 `.csv` 和 `.jsonL` 格式。在评估流程时，请确保您的数据列与批量运行所需的输入相匹配。这将生成用于评估的输出。测试数据集应包含\
  \ `queries`（查询）和 `ground_truth`（标准答案），并可以选择包含 `Answer`（答案）——这将是针对每个问题由助手生成的响应。此外，您还可以包含\
  \ `chat_history`（聊天历史），但如果没有，可以将其留空为列表 `[]`。以下是我们的测试数据样本文件（图 5-20）。\n\n![](img/501717_2_En_5_Fig20_HTML.jpg)\n\
  \n图 5-20\n\n\n\n### 用于评估运行的 Prompt Flow 测试数据\n\n接下来，设置评估输入的数据映射。如图 5-21 所示，选择 `chat_history`\
  \ 和 `query` 字段。\n\n![](img/501717_2_En_5_Fig21_HTML.jpg)\n\n图 5-21\n\nPrompt Flow\
  \ 添加数据集与映射\n\n选择**下一步**以配置评估指标。目前，我们支持两种由 Microsoft 策划的指标类型，用于全面评估应用程序：\n\n1.  **性能与质量指标：**\
  \ 评估生成内容的整体质量和连贯性。这包括 `groundedness`、`relevance`、`coherence`、`fluency`、`GPT similarity`\
  \ 和 `F1 score`。对于这些指标，我们需要指定一个 GPT 模型进行计算；这可以通过选择我们的 Azure OpenAI 连接以及部署了 GPT-3.5\
  \ 或 GPT-4 模型的实例来完成。\n\n2.  **风险与安全指标：** 识别潜在的内容风险，并确保生成内容的安全性。这包括自残相关内容、仇恨与不公平内容、暴力内容以及色情内容。对于这些指标，我们无需设置连接或部署。Azure\
  \ AI Studio 的安全评估使用一个 GPT-4 模型来提供内容风险严重性评分和推理，帮助您评估应用程序中潜在的内容危害。\n\n我们还可以配置一个阈值来计算风险与安全指标的缺陷率。缺陷率表示超过特定严重性级别的实例百分比。严重性级别包括`very\
  \ low`、`low`、`medium`和`high`。当我们设置阈值时，我们确定哪些严重性级别被视为缺陷。默认情况下，阈值设置为`medium`。这意味着任何严重性级别为`medium`或`high`的实例都将计入缺陷率。我们可以根据我们特定的风险承受能力和评估需求灵活调整此阈值。在此项目中，我们将保持默认设置——`medium`。\n\
  \n在我们选择了所有想要的指标后，我们需要为批量运行测试集进行数据映射，如图 5-22 所示。关于数据映射：\n\n![](img/501717_2_En_5_Fig22_HTML.jpg)\n\
  \n图 5-22\n\nPrompt Flow 指标与数据集映射\n\n*   **Context：** 将用于生成`groundedness`分数的文档或搜索结果。\n\
  *   **Answer：** 我们助手生成的回复。\n*   **Question：** 我们用来测试助手的一系列查询。\n*   **Ground Truth：**\
  \ 我们预期的回复——这来自项目数据的领域专家（SMEs）的理解。\n\n风险与安全指标已在上述截图中解释过，我们将在下一章深入讨论。接下来，我们将讨论性能与质量指标及其衡量方式：\n\
  \n1.  **Groundedness：** `groundedness`指标，评分范围为 1 到 5（1 表示无依据，5 表示有依据），衡量模型生成的答案与源数据（例如用于问答或摘要任务的检索文档）的一致性程度。它利用\
  \ Azure AI 内容安全服务中为自然语言推理（NLI）进行微调的自定义语言模型，来评估模型生成的回答是否得到源文档的支持。该指标对于需要事实正确性和上下文准确性的应用至关重要，例如信息检索、问答和内容摘要。要使用此指标，您需要提供`question`、`context`和生成的`answer`，以确保\
  \ AI 回复得到所提供的`context`的充分支持。\n\n2.  **Relevance：** `relevance`指标，评分范围为 1 到 5（1 表示差，5\
  \ 表示好），衡量模型生成的回复与给定问题的相关性和直接关联程度。它评估答案捕捉上下文关键点的能力，高分表示 AI 系统有很强的理解能力，并能生成连贯、上下文适当的输出。低分表示回复可能偏离主题、缺乏上下文或未能充分解决用户的查询。该指标对于评估\
  \ AI 系统理解输入并生成相关回复的性能至关重要。要使用此指标，您需要提供`question`、`context`和生成的`answer`。\n\n3.  **GPT-Similarity：**\
  \ `GPT-similarity`指标，评分范围为 1 到 5（1 表示差，5 表示好），衡量源数据（ground truth）句子与 AI 模型生成回复之间的相似度。它通过为真实数据（ground\
  \ truth）和生成的预测（prediction）创建句子级别的嵌入向量，在高维向量表示中捕捉语义含义和上下文，从而评估相似度。该指标对于在可提供真实回复（ground\
  \ truth）的文本生成任务中客观评估 AI 模型的性能特别有用。它有助于评估生成文本与期望内容的语义对齐程度，从而衡量模型的质量和准确性。要使用此指标，您需要提供`question`、`ground\
  \ truth answer`和生成的`answer`。\n\n4.  **Coherence：** `coherence`指标，评分范围为 1 到 5（1 表示差，5\
  \ 表示好），衡量语言模型生成的输出是否流畅、自然易读且类似人类语言的程度。它评估模型生成连贯、可读文本的能力。该指标在评估现实应用中模型生成回复的可读性和用户友好性时特别有用。要使用此指标，您需要提供`question`和生成的`answer`。\n\
  \n5.  **Fluency：** `fluency`指标，评分范围为 1 到 5（1 表示差，5 表示好），衡量生成式 AI 预测答案的语法熟练程度。它评估生成的文本在多大程度上符合语法规则、句法结构和恰当的词汇使用，确保回复在语言学上是正确的。该指标对于评估\
  \ AI 生成文本的语言正确性特别有用，确保其遵循正确的语法和句法。要使用此指标，您需要提供`question`和生成的`answer`。\n\n6.  **F1\
  \ Score：** `F1 score`，范围在 0 到 1 之间，衡量模型生成的回复与真实值（ground truth）之间的词语重叠比率。它结合了精确率（生成文本中共享词数量/总词数）和召回率（真实文本中共享词数量/总词数）以提供平衡的评估。该指标对于评估模型生成回复的准确性和相关性很有用。所需的输入包括`question`、`ground\
  \ truth answer`和生成的`answer`。\n\n7.  **Retrieval Score：** `retrieval score`，范围为 1\
  \ 到 5（1 表示差，5 表示好），衡量模型检索到的文档与给定问题的相关性。它通过将用户查询分解为具体的意图，并评估这些意图或其答案是否存在于或可以从检索到的文档中推断出来。该分数基于具有相关答案的意图比例来计算，并进行平方处理以惩罚错误。此指标确保了检索内容的质量和适当性，对于保证检索到的文档与用户的问题高度相关非常有用。所需的输入包括`question`、`context`和生成的`answer`。\n\
  \n\n\n### 提示参考\n\n上述指标的提示参考：[`https://learn.microsoft.com/en-us/azure/ai-studio/concepts/evaluation-metrics-built-in?tabs=warning`](https://learn.microsoft.com/en-us/azure/ai-studio/concepts/evaluation-metrics-built-in?tabs=warning)\n\
  \n现在我们已经理解了评估指标，最后将回顾设置并点击提交（如下截图），如图 5-23 所示。\n\n![](img/501717_2_En_5_Fig24_HTML.jpg)\n\
  \n**图 5-24** Prompt Flow 评估完成仪表板\n\n![](img/501717_2_En_5_Fig23_HTML.jpg)\n\n**图\
  \ 5-23** Prompt Flow 提交前的最终审核\n\n成功完成后，它会为我们提供所有性能和质量指标的可视化表示，如图 5-24 所示。相似度得分为`2.14`，基础性得分为`4`，我们可以稳妥地得出结论：需要改进解决方案并着手进行提示工程。提示工程在\
  \ AI 语言模型的开发和优化中至关重要，原因包括：提高准确性、增强性能、实现定制化、提升资源效率等。总之，提示工程之所以至关重要，是因为它有助于微调 AI 模型，使其提供准确、相关且用户友好的响应，同时解决偏见问题并提升整体性能和效率。因此，我们将在下一章深入探讨提示工程。\n\
  \n## 总结\n\n本章讨论了使用 Azure 基础设施和服务实现生成式 AI（GenAI）解决方案，重点借鉴了第 4 章的技术。Azure 提供了一个安全、可扩展的环境，并拥有丰富的\
  \ AI 工具和服务，如`Azure Machine Learning`和`Cognitive Services`。我们讨论了在 AI Studio 中使用`Azure\
  \ OpenAI`构建“端到端 GenAI RAG 应用程序”的步骤，并进一步利用`Prompt Flow`来评估我们的解决方案。我们得出结论，提示工程对于提升\
  \ AI 模型的性能、准确性和相关性至关重要。下一章将深入探讨提示工程技术。\n\n"
- "# 6. 提示工程技术、小型语言模型与微调\n\n## 引言\n\n在本章中，我们将深入探讨不同的提示工程技术。提示工程是任何生成式 AI 项目成功的核心。除了提供准确信息外，提示工程还解决了行业广泛关注的问题，如幻觉。\n\
  \n然后我们将转向小型语言模型（SLM）的主题。SLM 因其进入生成式 AI 领域的较低成本以及较小的资源占用而日益流行，这使得我们能够将生成式 AI 集成到物联网和端点解决方案中，这些方案需要在设备上进行推理，而无需大语言模型所需的\
  \ GPU 和存储资源。\n\n## 提示工程\n\n提示工程是一个新兴领域，专注于创建和优化提示，以有效利用语言模型（LM）解决广泛的应用场景和日常任务。掌握提示工程的艺术对于深入理解大语言模型（LLM）的优势和局限性至关重要。个人可以借助提示工程来增强\
  \ LLM 在各种任务上的性能，从简单的问答到复杂的问题解决。\n\n例如，一个普通用户可能会设计一个提示，帮助 LLM 根据每周的膳食计划创建购物清单，不断调整措辞和格式，直到模型能够始终如一地提供准确且全面的清单。或者，有人可以开发一个提示，引导\
  \ LLM 回答关于他们最喜欢食谱的问题，微调提示以提高理解力和相关性。\n\n对于开发者而言，提示工程涉及构建稳健且有效的提示技术，使 LLM 与其他工具之间能够无缝交互。例如，开发者可能创建一个提示，指示\
  \ LLM 为特定编程任务生成代码片段，或以通俗易懂的术语提供复杂概念的详细解释。然而，提示工程不仅仅是设计和开发提示；它涵盖了一系列与 LLM 交互和开发 LLM\
  \ 所必需的多样化技能和技术。这套技能对于与 LLM 接口、构建应用程序以及理解其能力至关重要。此外，提示工程还可用于提升 LLM 的安全性并引入新功能，例如将领域特定知识和外部工具集成到\
  \ LLM 中。例如，可以设计一个提示，确保 LLM 避免生成有害或有偏见的内容，从而增强模型的安全性。另一个例子是创建提示，使 LLM 能够访问和利用专门的数据库或\
  \ API，从而通过外部信息增强模型的能力。\n\n\n\n### 技巧\n\n我们将从提示工程的基础知识讨论到高级技巧，并通过几个用例来观察一些出色的实际应用。但在深入探讨提示工程之前，让我们先了解一下那些会显著影响\
  \ GPT 响应的关键参数。通过一些实验，大多数用例都能找到合适的设置。在设计并测试提示时，与大型语言模型（LLM）的交互通常是通过 API 进行的，其中有几个可配置的参数能够影响响应结果。以下是调用\
  \ GPT 模型时常用的参数：\n\n在设计并测试提示时，与大型语言模型（LLM）的交互通常通过 API 进行，多个可配置的参数会影响响应结果。调整这些设置对于增强输出的可靠性和期望性至关重要，并且通常需要经过实验才能确定特定用例的最佳配置。以下是你将遇到的一些常见设置及其示例：\n\
  \n1.  **温度：** 控制模型输出的随机性。较低的值通过选择最高概率的下一个标记来使结果更具确定性，适用于基于事实的问答。较高的值会引入随机性，有利于诗歌生成等创意性任务。示例：\n\
  \n    **低温度（0.2）：** 适用于基于事实的问答，你需要简洁准确的答案。提示语：“法国首都是哪里？”\n\n    **回复：** “法国首都是巴黎。”\n\
  \n    **高温度（0.8）：** 适用于创意性任务，鼓励多样化和富有想象力的回复。提示语：“写一首关于大海的诗。”\n\n    **回复：** “大海，一个广阔无垠的梦，那里波浪起舞，海鸥长鸣。”\n\
  \n2.  **Top-p（核采样）：** 控制模型的确定性。较低的 Top-p 值会选择最自信的回复，适用于需要精确答案的情况。较高的 Top-p 值会考虑更多标记，从而产生多样化的输出。通常，只需调整温度或\
  \ Top-p 中的一个，不必两者都调。示例：\n\n    **低 Top-p（0.2）：** 用于精确、事实性的答案。\n\n    **提示语：** “描述光合作用的过程。”\n\
  \n    **回复：** “光合作用是绿色植物利用阳光，以二氧化碳和水为原料合成有机物的过程。”\n\n    **高 Top-p（0.9）：** 用于更多样化的回复。\n\
  \n    **提示语：** “给我讲一个关于英雄的故事。”\n\n    **回复：** “从前，在一个遥远的国度，有一位名叫艾莉亚的英雄，她能跟动物说话，还能操控元素。”\n\
  \n3.  **最大长度：** 限制生成的标记数量，有助于避免生成过长或不相关的回复，并控制成本。示例：\n\n    **短最大长度（50 个标记）：** 用于保持回复简洁。\n\
  \n    **提示语：** “概括《罗密欧与朱丽叶》的情节。”\n\n    **回复：** “《罗密欧与朱丽叶》是一部悲剧，讲述了两个年轻恋人的死亡最终化解了家族世仇的故事。”\n\
  \n    **长最大长度（200 个标记）：** 用于详细的解释。\n\n    **提示语：** “解释相对论。”\n\n    **回复：** “相对论由阿尔伯特·爱因斯坦提出，包含两个相互关联的理论：狭义相对论和广义相对论。狭义相对论适用于没有引力的所有物理现象。广义相对论解释了万有引力定律及其与自然界其他力的关系。它不仅是一个引力理论，也是一个时空理论，将引力描述为质量引起的时空弯曲。”\n\
  \n4.  **停止序列：** 能够中止标记生成的字符串，用于控制回复长度和结构。示例：\n\n    **停止序列（“11”）：** 用于限制列表项。\n\n\
  \    **提示语：** “列出 10 种水果。”\n\n    **回复：** “1. 苹果 2. 香蕉 3. 橙子 4. 葡萄 5. 菠萝 6. 芒果 7.\
  \ 桃子 8. 樱桃 9. 草莓 10. 蓝莓”（生成在“11”处停止）\n\n5.  **频率惩罚：** 通过对重复出现的标记进行惩罚来降低单词重复的可能性。示例：\n\
  \n    **高频惩罚（1.0）：** 用于最小化单词重复。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园里开满了五颜六色的花朵，绿植茂盛，各种鸟儿歌声悦耳。微风吹来，带着盛开的玫瑰和茉莉花的芬芳香气。”\n\
  \n    **低频惩罚（0.0）：** 允许更多重复。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园很美丽，有美丽的花朵和美丽的树木。美丽的鸟儿唱着美丽的歌。”\n\
  \n6.  **存在惩罚：** 对重复出现的标记施加统一惩罚，防止模型过度重复某些短语。较高的值鼓励多样性，较低的值则保持内容聚焦。示例：\n\n    **高存在惩罚（1.0）：**\
  \ 用于鼓励回复的多样性。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园是一个宁静的绿洲，有鲜艳的花朵、高大的树木和各种植物。蝴蝶翩翩起舞，鸟儿在枝头啁啾。一个小池塘倒映着蓝天，清新的花香弥漫在空气中。”\n\
  \n    **低存在惩罚（0.0）：** 允许重复，保持内容聚焦。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园很美丽，有花、树和植物。花儿很美，树很高，植物很茂盛。这是一个非常非常美丽的花园。”\n\
  \n了解了上述参数如何改变 GPT 的响应后，让我们来了解一下提示工程的最佳实践和类型。\n\n\n\n#### 最佳实践\n\n在为 AI 模型编写提示时，考虑几个关键设置以确保模型的行为符合你的期望至关重要。这些设置包括`系统消息`、`用户消息`和`助手消息`。它们在塑造交互过程中各自扮演着独特的角色。\n\
  \n- `系统消息`：为 AI 模型设定舞台并充当序幕。它为对话建立背景并设定所需的语气。\n- `用户消息`：提出问题，代表用户的输入或查询。它明确了用户正在寻求或需要帮助的内容。\n\
  - `助手消息`：提供回应，即 AI 对用户查询的回复。它由系统消息塑造，并应与最初设定的背景和语气保持一致。\n\n我们将运行我们的提示工程笔记本来理解构建有效提示的常见最佳实践，以下是每种实践的详细说明。你可以从本书的\
  \ GitHub 仓库下载该笔记本的副本，地址为[`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/Prompt-Enginnering-Samples/prompt_engineering101.ipynb`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/Prompt-Enginnering-Samples/prompt_engineering101.ipynb)。\n\
  \n![](img/501717_2_En_6_Fig1_HTML.jpg)\n\n图 6-1 – 提示工程代码示例 #1\n\n1.  **将指令放在开头：**\
  \ 通过清晰说明你想要模型做什么来开始你的提示。这有助于设定背景，并从一开始就让模型清楚地理解任务。在开头提供明确的指令可以最大限度地减少歧义，并引导模型生成所需的输出。例如，不要直接进入内容，而是以一个清晰的指令开始，比如“总结以下文本，突出主要观点”。运行笔记本的第一个单元格，如下图\
  \ 6-1 所示：\n\n![](img/501717_2_En_6_Fig2_HTML.jpg)\n\n图 6-2 – 提示工程代码示例 #2\n\n2. \
  \ **明确具体：** 清晰指定你期望模型输出的格式或结果。如下图 6-2 所示，明确的指令有助于模型更好地理解你的要求，并生成更接近你预期的响应。具体说明输出格式可以减少收到模糊或偏离目标响应的可能性。例如，与其仅仅要求一份摘要，你可以明确说明，“用\
  \ 3 句话总结这篇文章，突出关键数字。”运行第二个单元格查看输出。\n\n![](img/501717_2_En_6_Fig3_HTML.jpg)\n\n图\
  \ 6-3 – 提示工程代码示例 #3：正面与负面指令\n\n3.  **避免否定表述：** 如下图 6-3 所示，聚焦于正面指令，而不是告诉模型不要做什么。正面指令更容易让模型解读和遵循。否定表述有时会被模型误解或忽略，导致效果欠佳的响应。例如，与其说“不要啰嗦”，不如说“提供一个简洁的总结”。\n\
  \n![](img/501717_2_En_6_Fig4_HTML.jpg)\n\n图 6-4 – 提示工程代码示例 #4：GPT 响应\n\n从以上示例中，我们可以看到负面和正面指令的结果。负面指令“不要啰嗦，不要生成超过\
  \ 2 个句子”提供了负面焦点，告诉模型要避免什么而不是做什么，因此生成了 3 个句子。这可能存在歧义，因为模型需要从否定句中推断出正面动作。这可能导致模型误解或忽略否定，从而生成的响应可能仍然冗长。然而，正面指令“总结以下文本。提供一个简洁的总结，用\
  \ 2 个非常短的句子”提供了正面焦点，清晰陈述了期望的动作，因此根据提示引导生成了两个句子。这有助于模型准确理解期望。此类指令是清晰的指导，更容易让模型解读和遵循，从而产生更准确和相关的响应。\n\
  \n![](img/501717_2_En_6_Fig5_HTML.jpg)\n\n图 6-5 – 提示工程代码示例：少样本学习\n\n4.  **使用示例 –\
  \ 少样本学习：** 这是通过利用零样本、一样本和少样本学习等技术实现的。提供预期输出的示例非常有帮助。示例为模型提供了具体的参考，精确说明了你想要什么。这可以显著提高模型生成准确和相关信息的能力。下图\
  \ 6-5 展示了一个少样本学习的例子。\n\n在上面的例子中，我们看到少样本示例如何强制执行输出行为，使其具有高度的通用性。少样本学习的工作原理如下：\n \
  \   - **使用示例进行条件设置：** 在提示中向模型提供几个示例（通常称为“样本”）。这些示例展示了给定输入的期望行为或输出。\n    - **上下文学习：**\
  \ 模型使用这些示例作为上下文，来理解如何处理新的、相似的输入。这种条件设置帮助模型从提供的示例泛化到新数据。\n    - **提示设计：** 输入提示的设计同时包含示例和新任务，从而有效引导模型如何生成预期输出。\n\
  \n少样本提示在处理需要复杂推理、多步逻辑或深度理解的任务时可能会遇到困难。模型推断复杂关系或执行高级问题解决的能力通常是有限的。这时，我们想要利用下一种技术“思维链提示”或两者的结合。\n\
  \n![](img/501717_2_En_6_Fig6_HTML.jpg)\n\n图 6-6 – 提示工程代码示例：提示链\n\n5.  **提示链或任务分解：**\
  \ 提示链可应用于涉及多个操作或转换的各种场景。通过将任务分解为更小、更易于管理的步骤，可以提升大型语言模型（LLM）的性能。例如，与其直接生成搜索查询，不如先要求模型提取相关事实，然后创建搜索查询来验证这些事实。下面的图\
  \ 6-6 展示了这样一个提示的例子。\n\n\n\n#### 思维链（CoT）提示\n\n`CoT` 提示是一种鼓励推理和多步骤思考的技术。它涉及提供一些示例问题和答案，然后跟随着实际问题（少样本提示），这有助于模型生成推理以回应提示。这项技术是“分解任务”方法的一种变体。如下图\
  \ 6-7 所示，`CoT` 提示不仅仅是把任务拆分成更小的步骤，它还指示模型逐步进行并展示所有涉及的步骤。这种系统化的方法最大限度地减少了不准确性，并使评估模型的响应变得更加容易。以下是\
  \ `CoT` 的一些优势：\n\n- **增强推理能力：** `CoT` 提示促进了通过问题进行逻辑化和系统化的思考。\n- **减少错误：** 将任务分解成更小、更易于管理的步骤会降低出错的可能性。\n\
  - **清晰透明：** 逐步呈现的方式阐明了推理过程，使得验证结果更加容易。\n- **改善学习：** 这种方法有助于精确找出模型需要改进的特定领域，从而实现有针对性的训练。\n\
  \n![](img/501717_2_En_6_Fig7_HTML.jpg)\n\n**图 6-7** — 提示工程代码示例：思维链提示\n\n通过思维链提示，模型可以增强其推理能力，并产生更准确、更易理解的响应。然而，它也存在以下局限性：\n\
  \n- **复杂性管理：** 虽然 `CoT` 提示有助于处理复杂任务，但处理每一步可能需要更多的计算资源和时间。\n- **额外开销：** 阐明每一步可能很繁琐，尤其是对于那些直接回答就足够的简单任务。\n\
  - **可扩展性：** 对于非常庞大和复杂的问题，逐步方法可能会变得过于详尽，需要在全面性和效率之间取得平衡。\n\n![](img/501717_2_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8** — 提示工程代码示例：自一致性提示\n\n#### 自一致性提示\n\n与 `CoT` 直接生成 token 的简单方法相比，这可能是更高级的提示工程技术之一，它涵盖了生成响应的多种不同路径。如下图\
  \ 6-8 所示，此方法用于提高少样本 `CoT`（常识变换器）模型在需要算术和常识推理任务上的性能。它涉及通过 `CoT` 模型采样多个不同的推理路径，并使用生成的响应来选择最一致的答案。在这种技术中，`CoT`\
  \ 模型被提示执行一个需要算术或常识推理的特定任务或问题。不是依赖单一的推理路径，而是通过扰动输入或使用不同的推理技术，让模型生成多个响应。这些多样化的推理路径允许模型探索不同的可能解决方案或解释。\n\
  \n一旦模型生成了这些多个响应，就会对它们进行一致性评估。彼此一致的响应被认为更可靠，并能指示出正确答案。然后选择最一致的响应作为最终答案。通过使用自一致性提示技术，可以提升\
  \ `CoT` 模型在涉及算术和常识推理任务上的性能。这种方法利用了模型生成多个不同响应的能力，并选择最一致的那个，从而提高了模型预测的整体准确性和可靠性。\n\
  \n![](img/501717_2_En_6_Fig10_HTML.jpg)\n\n**图 6-10** — 提示工程代码示例：思维树\n\n![](img/501717_2_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9** — 思维树提示架构。来源：[*https://arxiv.org/pdf/2305.10601*](https://arxiv.org/pdf/2305.10601)\n\
  \n#### 思维树\n\nYao 等人 (2023) 和 Long (2023) 引入了一个称为思维树 (ToT) 的框架，该框架解决了传统提示技术在处理需要探索或战略性前瞻的复杂任务时的局限性。ToT\
  \ 建立在思维链提示的概念之上，并强调将中间思维作为一种使用语言模型解决问题的手段进行探索。如下面的图 6-9 所示，在 ToT 中，维护了一个树状结构，其中每个节点代表一个连贯的语言序列（思维），作为解决问题的中间步骤。该框架使语言模型\
  \ (LM) 能够通过自我评估推理过程中生成的中间思维来评估其进展。通过将 LM 的思维生成和评估能力与广度优先搜索或深度优先搜索等搜索算法相结合，ToT 促进了通过前瞻和回溯对思维进行系统化探索。\n\
  \n为了更好地理解 ToT，请考虑图 6-10 中显示的示例提示，其中语言模型的任务是解决一个复杂的数学问题：“找出前 10 个质数的和。”在 ToT 框架中，初始提示可以是“生成一个给定范围内的质数列表。”然后模型将生成中间思维，例如“检查一个数是否为质数”或“在找到质数时记录总和。”这些思维代表了解决最终问题的连贯步骤。模型可以评估这些思维的质量和相关性，并探索思维树的不同分支，以找到最有效的解决方案。\n\
  \n![](img/501717_2_En_6_Fig11_HTML.jpg)\n\n**图 6-11** — 提示工程代码示例：在最后重复指令\n\n####\
  \ 在末尾重复指令\n\n近因偏差可能会影响模型，其中提示末尾的信息对输出的影响可能比开头的信息更大。为了减轻这种偏差，探索在提示末尾重复指令的效果并评估其对生成响应的影响是很有价值的。如下图\
  \ 6-11 所示，考虑一个提示，其任务是生成给定文章的摘要：“用 JSON 格式，以 `highlight1`、`highlight2`、`highlight3`\
  \ 为键，用三句话总结以下关于气候变化的文章 {article}。”为了解决近因偏差，可以修改提示，在末尾增加重复：“用 JSON 格式，以 `highlight1`、`highlight2`、`highlight3`\
  \ 为键，用三句话总结以下关于气候变化的文章 {article}，确保提取为 JSON，键为 `highlight1`、`highlight2`、`highlight3`。”\n\
  \n通过在提示末尾重复关于包含文章中特别与气候变化相关的关键点的指令，目的是确保模型对整篇文章的信息给予同等的考虑，而不是过度优先处理结尾部分。然后可以通过比较针对原始提示和修改后提示生成的响应来评估这一修改的影响，以确定重复指令是否有助于减少近因偏差并生成更均衡的摘要。\n\
  \n#### 迭代与实验\n\n最后，创建有效的提示通常需要一个迭代和实验的过程。根据模型的响应来微调你的提示，并观察不同的指令如何影响结果。这个迭代过程可以帮助你优化提示，使其更好地满足你的需求并达到期望的结果。根据反馈和结果调整你的提示，尝试不同的措辞和指令，看看哪些能产生最佳响应。\n\
  \n\n\n到目前为止，我们探索了提示工程的最佳实践。我们了解了提示工程在充分发挥语言模型潜力方面所起的关键作用。它涉及设计能够有效引导模型生成准确且相关响应的提示。本章重点介绍了几种增强提示工程的策略；这些策略包括：融入系统消息、减少偏见、提供相关上下文、提示链、思维链提示、在结尾重复指令，以及通过实验进行迭代。这些实践有助于优化语言模型的性能和可靠性，使其能够生成准确且符合预期的响应。接下来，我们将深入探讨小型语言模型以及如何/何时利用它们。\n\
  \n## 小型语言模型\n\n尽管本书的核心内容和当今的主流认知都集中在大型语言模型（LLM）上，但对于任何关注的人来说，小型语言模型（SLM）的崛起几乎无法忽视，其原因在于物联网和边缘计算等用例。Hugging\
  \ Face 的首席执行官兼联合创始人 Clem Delangue 甚至声称，2024 年将是 SLM 之年。\n\n### 概念\n\nSLM 本质上只是 LLM\
  \ 的缩小版本，其目标同样是理解、生成和解释自然语言。\n\nSLM 旨在平衡以下两个方面：一方面要具备足够的语言处理能力，另一方面要控制存储和处理自然语言请求所需的模型体积。下面的表\
  \ 6-1 比较了训练 SLM 和 LLM 时使用的参数数量范围。\n\n**表 6-1** 训练中使用的参数数量（LLM 与 SLM 对比）\n\n| 模型类型\
  \ | 参数数量 | 模型示例 |\n| --- | --- | --- |\n| 小型语言模型（SLM） | 100 万 – 50 亿 | `Phi-1`,\
  \ `Phi-2`, `Phi-3-mini`, `Phi-3-small`, `Mistral-7B`, `Zephyr-7B` |\n| 大型语言模型（LLM）\
  \ | 100 亿 – > 1 万亿 | `GPT-3.5`, `GPT-4`, `Gemini`, `LLaMA` |\n\n#### 更大并不总是更好\n\n\
  SLM 的理念在于，更大的模型并不总是更好，尽管最初的驱动力可能主要来自于成本。\n\n较低的计算需求使得 SLM 的运营成本更低。其他优势包括推理速度，这带来了更高效的响应时间。综合来看，部署多个面向任务的\
  \ SLM 可能比部署单个 LLM 效率更高。\n\n在某些情况下，SLM 的性能优于 LLM。在此语境下，性能是衡量响应质量而非速度的指标。响应质量受到准确性、幻觉风险和偏见的影响。\n\
  \n由于参数数量较少，SLM 往往比 LLM 的偏见更少。此外，正如我们稍后将看到的，SLM 通常通过微调进行定制，以包含有针对性的、特定领域的训练数据。这种针对领域特定数据集的微调降低了偏见风险。另一方面，LLM\
  \ 是基于从互联网收集的大量数据进行训练的。这就是为什么正确地对 LLM 进行“落地”（`grounding`）非常重要，并且与 SLM 相比，对 LLM 进行此操作的难度更高。SLM\
  \ 训练数据集较小的另一个好处是降低了幻觉风险。图 6-12 展示了 SLM 的优势。了解了这些优势后，让我们来看看 SLM 的用例。\n\n![](img/501717_2_En_6_Fig12_HTML.jpg)\n\
  \n**图 6-12** 小型语言模型（SLM）的优势\n\n### 用例\n\nSLM 可用于与 LLM 相同的用例——客户服务、内容生成、翻译等。然而，如上所述，它们的特点是能够将生成式\
  \ AI 扩展到以下对当前 LLM 而言可能具有挑战性的环境中：\n\n#### 物联网\n\n物联网（IoT）指的是连接到互联网的设备。它们通常被称为“智能设备”，在我们的日常生活中随处可见。智能锁、冰箱、摄像头、暖炉、车库门开启器等都是“智能家居”类别中的物联网设备示例，这是现代家庭的一部分。物联网设备可以从设备端\
  \ AI 能力中获益，以实现更高效的处理。\n\n#### 低带宽和断网设备\n\n许多场景下网络连接受限，例如美国的许多国家公园以及全球许多基础设施不完善的地区。这些无网络连接的区域可以通过配备生成式\
  \ AI 的设备来更好地服务人们。低带宽或无网络连接的用例也可能发生在海上或太空。通常，一项技术的可用性，尤其是诸如生成式 AI 这样的技术，不仅能使这些地区或情境中的人们受益，而且还可能关乎生死。例如，一个用例可能是遏制人口贩卖。\n\
  \n#### 语言翻译与本地化\n\n除了低带宽或无带宽地区之外，配备特定语言 SLM 并针对本地化或情境用例进行微调的设备可用于解决特定问题。例如，为了减少人口贩卖导致的死亡，被困在偏远地区的受害者将能够访问支持\
  \ AI 的设备来寻求帮助。SLM 可以提升移动性，从而使援助人员能够携带支持 AI 的设备前往村庄提供帮助，在这些场景中，翻译服务起着关键作用。除了翻译之外，作为生成式\
  \ AI 模型（尽管训练参数比 LLM 少），SLM 仍然可以具备情感分析能力，并进一步使用领域特定数据进行微调。以援助偏远村庄工作人员为例，一个领域特定的数据集可能涉及卫生以及食用野味⁶⁷的危险（这是\
  \ COVID-19 的一个可能起因）。这将显著提升互动质量，并最终提高通过教育提供援助的有效性。\n\n\n\n### 动手练习 6-1：部署 `Phi-3`\n\
