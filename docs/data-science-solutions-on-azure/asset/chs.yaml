  \ 这样的轻量级文本编辑器中。我们将在下一节的另一个练习中使用此 JSON。\n\n## 组合 AI 服务\n\n在构建 AI 解决方案时，组合 AI 服务的情况并不少见。组合\
  \ AI 服务主要有三种场景：\n\n*   通过“链接”服务\n*   利用 Azure OpenAI 的自然语言和 LLM 能力\n*   使用特定的 AI\
  \ 服务增强和提升 Azure OpenAI LLM\n\n### 链接 AI 服务\n\n顾名思义，链接 AI 服务是指在工作流中使用多个 AI 服务。其概念很简单——一个\
  \ AI 服务的输出成为另一个 AI 服务的输入。\n\n\n\n### 动手练习 9-4：Azure 语音转文本与翻译\n\n在本动手练习中，我们将探索 Azure\
  \ AI 语音服务。\n\n*场景：我们需要接收传入的语音邮件，转录音频内容，如果非英文则进行翻译。*\n\n有多种方法可以更高效地处理此场景，而无需向不同服务发出多个\
  \ API 调用；例如，使用新的 GPT-4 Whisper 模型，只需一次调用即可解决。然而，为了演示如何将多个 Azure AI 服务串联起来，我们将先使用\
  \ AI 语音服务转录文本。然后，我们将调用 AI 翻译服务将文本翻译成英文。最后，我们将使用 GPT-3.5T 创建转录摘要、推荐后续操作项，并评估翻译后语音邮件的情绪倾向。\n\
  \n本练习的设计中，我们将使用 Postman 并设置环境变量，以将一个 AI 服务的输出传递给下一个。如果您不熟悉 Postman 环境，请查阅相关文档。使用\
  \ Postman，我们可以对工作流或 RPA 流程进行建模，如图 9-18 所示。\n\n![](img/501717_2_En_9_Fig18_HTML.jpg)\n\
