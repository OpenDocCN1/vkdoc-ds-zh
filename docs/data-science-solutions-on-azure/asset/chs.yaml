- "# 7. 语义内核、插件与函数调用\n\n在本章中，我们将从关注 LLM 本身，转向设计由 LLM 驱动的解决方案。因此，本章的主题是如何让 LLM 执行通过请求或工作流发来的任务。传统上，任务和工作流由批量作业、Logic\
  \ Apps、Power Automate、UIPath 等自动化工具编排。\n\n我们可以将这些自动化工具视为外部编排器，因为它们主要依赖 API 与不同服务交互，并根据从不同服务收到的响应，这些编排器可以调用其他服务，包括\
  \ LLM。事实上，本书的前几章及前一版本在很大程度上依赖于这种方法。下图 7-1 描述了编排器执行结构化工作流，将不同服务连接成一个工作流或解决方案的方式。\n\
  \n![](img/501717_2_En_7_Fig1_HTML.jpg)\n\n**图 7-1** – 通过传统编排工具实现自动化\n\n另一方面，对于 LLM，存在一种让\
  \ LLM 本身成为编排器的概念。为了实现这一点，我们需要能够扩展 LLM，使其直接启动外部任务。让 LLM 成为编排器是一个非常自然的概念，因为正如我们在第一章中将生成式\
  \ AI 描述为人类大脑的数字表示一样，决策自然应该由 LLM 驱动。下图 7-2 展示了 LLM 作为编排器，并利用专门处理不同任务的主体（Agent）概念。与传统自动化相比，LLM\
  \ 驱动的编排本质上更具动态性，并且可以通过自然语言触发。\n\n![](img/501717_2_En_7_Fig2_HTML.jpg)\n\n**图 7-2**\
  \ – 概念图 – 利用并扩展 LLM 以执行外部任务\n\n将 LLM“绑定”到不同能力以使其能够启动任务的最流行方法，由两个开源框架提供——LangChain\
  \ 和语义内核。根据你使用的框架，图 7-2 中描述的“绑定”要么称为*链*（LangChain），要么称为*插件*（语义内核）。这是两个框架共同的概念表示，尽管它们在实现上有所不同。\n\
  \n在本章中，我们将重点介绍语义内核，并学习主体和插件的概念。在下一章中，我们将比较语义内核和 LangChain，但我们将使用 LangChain 作为开发解决方案（DBCopilot）的方法，这样你就能理解这两个框架。\n\
  \n哪个框架最好？遗憾的是，和大多数答案一样，“视情况而定”。我们将在下一章帮你评估这两个框架，但现在，让我们专注于语义内核。\n\n## 语义内核^(⁷⁸)简介\n\
  \n语义内核是微软提供的一个开源软件开发工具包（SDK）。开发人员使用它为 LLM 构建主体。语义内核不仅适用于 OpenAI 模型和模型，也适用于 Hugging\
  \ Face 等其他模型。语义内核支持 Python、C#和 Java 代码。\n\n### 使用场景\n\n到目前为止，大多数使用场景都是像 ChatGPT\
  \ 那样的聊天界面，或网站上的问答形式，但这并非唯一的用例，在我们看来，也不是最引人注目的用例。\n\n\n\n#### 超越聊天机器人\n\nLLM 可以集成到各类应用程序中，无论是基于云的应用程序（Web\
  \ 应用）还是安装在计算机上的软件。我们认为，参照每个产品对应的微软 Copilot^(⁷⁹)，将此类用例称为*智能副驾*是最简单的表述方式。事实上，这些微软\
  \ Copilot 正是使用`Semantic Kernel`构建的。\n\n尽管“智能副驾”一词已被宽泛地用于指代任何具有 LLM 功能的事物，包括聊天机器人，但我们认为，智能副驾应该仅指代由\
  \ LLM 驱动的应用程序。这意味着智能副驾存在于应用程序内部，并且是解决方案的一部分。你无需离开当前系统就能使用 LLM。在你使用应用程序时，LLM 会积极地提供协助。\n\
  \n例如，使用 GitHub Copilot 时，在你开始编码的同时，它就会开始建议下一行代码。它还能协助调试，并可以解释和/或修复问题。GitHub Copilot\
  \ 是一个安装到 Visual Studio Code 和 Visual Studio 等 IDE 中的扩展，^(⁸⁰)从而扩展了这些 IDE 的功能。同样地，当你在\
  \ Word 中开始新文档时，M365 Copilot 会让你选择为其提供一个提示，以帮助你完成写作任务。\n\n`Semantic Kernel`允许开发者实现不同的插件，包括\
  \ AI 插件，这样新的和现有的代码现在都可以受益于 LLM 的赋能。因此，我们提出了两个不同的用例类别——聊天机器人与智能副驾。\n\n#### 实时数据\n\
  \nLLM 的一个缺点是其受限于模型训练时的时间界限数据。在第 4 章中，我们也了解了通过 RAG 架构将 LLM 与精心整理的数据源相结合。然而，这仍然是基于有时限的数据源。\n\
  \n`Semantic Kernel`的一个引人注目的用例是让 LLM 能够从 Web 服务获取实时数据。例如，使用`Semantic Kernel`，LLM\
  \ 可以查询 Web 服务中的航班状态以了解其航班时刻表。一个投资追踪应用程序，当用自然语言询问当天当前的最大市场异动股是什么时，它可以连接到 Web 服务以获取该信息，并研究可能导致这种波动的相关最新新闻。\n\
  \n#### 执行任务\n\n除了检索信息、创建内容或回答问题之外，使用`Semantic Kernel`的另一个好处是能够执行任务。例如，在查询了航班状态和价格后，`Semantic\
  \ Kernel`可以启动购买机票或预订酒店等操作。\n\n#### 代理与智能副驾\n\n如上所述，代理是 LLM 的一种表现形式，其目的是帮助回答问题并自动化任务。智能副驾是一种特殊类型的代理，它可以帮助回答问题，但不会自动化任务。这就是为什么许多用例目前都是智能副驾，因为它们相对更容易实现，并且由于没有任务被自动化，所以也更安全。智能副驾与人类协同工作，提供建议和回答问题，但人类始终掌握控制权，并负责执行智能副驾建议的任何任务。\n\
  \n一旦智能副驾部署完毕，它随后可以转变为一个功能完备的代理；因此，无需从头重建。\n\n## 动手练习 7-1：开始使用 Semantic Kernel\n\n\
  在第一个动手练习中，我们将使用`Semantic Kernel`与 Azure OpenAI 进行交互。`Semantic Kernel`支持 Python 和\
  \ C#。实际上，与 LangChain^(⁸¹)等其他框架的一个区别是，`Semantic Kernel`原生支持 C#。因此，本动手练习将使用 C#。\n\n\
  在本章中，我们将使用一个零售场景。该场景是利用`Semantic Kernel`和 Azure OpenAI 来协助客户和库存管理。对于第一个用例，我们希望构建一个有助于创建营销信函的代理。\n\
