  \ 并登录。\n2. 如果提示同意服务条款，请勾选复选框并点击 \"我同意\"^(¹¹³)。\n3. 自定义视觉工作室是你自定义视觉项目的用户界面。点击 \"\
  新建项目\"，如图 9-7 所示。\n\n![](img/501717_2_En_9_Fig8_HTML.jpg)\n\n图 9-8：上传训练图像\n\n1.\
