  \ 6-19 所示的响应。\n\n![](img/501717_2_En_6_Fig19_HTML.jpg)\n\n**图 6-19** 由于训练数据不包含当前/实时信息，`Phi-3`\
  \ 模型无法提供回答\n\n接下来，我们将进行微调，看看如何使用这种方法来回答关于 2024 年巴黎奥运会的问题。\n\n## 微调\n\nSLM 与 LLM\
  \ 的关键区别之一在于微调模型所需的时间、精力和成本⁶⁸。与对 LLM 使用 RAG（检索增强生成）相比，微调更可能是定制 SLM 的推荐方法。\n\n###\
  \ 概念\n\n微调是将自定义数据集融入基础模型的过程。这扩展了基础模型，使其能够原生生成依赖于所融入数据集知识的响应。与 RAG 架构（模型依赖搜索服务返回的结果进行接地）不同，这使得模型更高效。\n\
  \n微调最常用于针对特定领域知识定制 LLM 或 SLM。微调过程对 SLM 和 LLM 相同，包括以下步骤：\n\n-   部署基础模型\n-   引入自定义数据集\n\
  -   重新训练基础模型，将自定义数据集整合到微调后的模型中\n-   部署新微调后的模型\n\n一旦创建了微调后的模型，它便被视为自定义模型。基础模型的新版本需要使用自定义数据集进行定制，并应作为\
  \ MLOps 模型生命周期管理的一部分来纳入。\n\n### 动手练习 6-2 和 6-3 的背景\n\n在本文撰写时（2024 年 7 月 30 日），巴黎奥运会刚开幕五天。所有\
  \ LLM 和 SLM 模型此时都不包含任何巴黎奥运会的详细信息。\n\n我们将使用一个包含更近期信息的数据集来微调模型。但请注意，当您进行此练习时，您部署的基础模型可能已经包含了这些信息，因此您可能需要提供一个包含基础模型训练范围之外数据的数据集。\n\
  \n或者，您可以在练习中使用 `GPT-3.5 Turbo 0125` 版本，该版本肯定不包含 2024 年巴黎奥运会的任何信息。\n\n在开始动手练习之前，我们想再次强调，即使在这种特定用例中，使用\
  \ RAG 架构也可能比微调更好。RAG 最重要的方面是易于添加和更新信息。更新嵌入到模型中的信息需要重新训练模型，这是一个耗时的过程。\n\n这个奥运用例仅用于说明目的，因为我们想挑选一些我们知道基础模型不包含的内容。\n\
  \n\n\n\n### 微调的数据准备\n\n或许微调过程中最重要的一环（实际上也是所有数据科学相关工作的核心）就是数据准备。这个过程通常属于被称为数据工程的学科范畴。在本书的第一个版本中，我们对此主题进行了全面阐述。自那时起，数据工程领域出现了新的^(⁶⁹)工具，例如\
  \ `Azure Fabric`。像 `Databricks` 这样的主流第三方工具也取得了显著进展。向读者更新数据工程的知识超出了本书的范围，因为这个主题本身就值得出一本书！\n\
