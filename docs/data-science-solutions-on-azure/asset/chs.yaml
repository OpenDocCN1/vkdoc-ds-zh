  \nHugging Face^(²⁶)还提供用于微调的工具和数据集。微调是一种修改大语言模型的技术，我们将在后续第 6 章中详细介绍。图 2-3 是 Hugging\
  \ Face 上可用模型类别的截图。\n\n![](img/501717_2_En_2_Fig3_HTML.jpg)\n\n图 2-3\nHugging Face\
  \ 上可用的 NLP 和 LLM 模型\n\n## 词元\n\n在消费服务时，总是会涉及到计量单位。例如，用电量以千瓦时（kW/h）计算。互联网使用费是根据速度（以每秒兆比特\
  \ Mbps 表示）按月收取的订阅费用。在云计算中，虚拟机（VM）等资源按小时计费。虚拟机性能越强，其运行时每小时的价格就越高。云存储则基于每月文件（blob）所消耗的平均字节数计费。\n\
  \n对于大语言模型，我们需要引入一种新的度量标准，即**词元**（Token）。每当使用 LLM 模型处理文本时，都会消耗词元，而将文本转换为词元的过程称为**词元化**（tokenization）。\n\
  \n词元化的核心思想是将文本缩小为更小的单元，以便 LLM 能够高效地处理。\n\n\n\n### 计数令牌（Counting Tokens）\n\n在下一节中，我们将更详细地探讨令牌化的工作原理。但就目前而言，从广义上讲，你可以将一个令牌视为：\n\
  \n- 英语中大约四个字符\n- 四分之三个单词\n\n反之，对于生成式 AI 的处理，我们可以使用以下指导原则：\n\n- 一到两句话大约为 30 个令牌。\n\
  - 一个段落大约为 100 个令牌。\n- 一千五百个单词大约为 2048 个令牌。\n- 七十五个单词大约为 100 个令牌。\n\n所需的令牌数量也取决于语言，非英语语言通常比英语需要的令牌更多。因此，处理非英语文本的成本可能会更高。\n\
  \n令牌的挑战在于难以估算所需的令牌数量。幸运的是，有几种工具可供使用。其中之一是由 OpenAI 提供的[令牌化工具（Tokenizer tool）](https://platform.openai.com/tokenizer)^(²⁷)。这是一个简单的工具，允许你将文本复制粘贴到一个文本区域中，它将提供该文本被\
  \ OpenAI 处理所需的令牌数量。下面的图 2-4 展示了 OpenAI 令牌化工具的布局。\n\n![](img/501717_2_En_2_Fig4_HTML.jpg)\n\
  \n**图 2-4** 来自 Azure OpenAI 的令牌化工具，显示一篇文本需要 172 个令牌\n\n这种估算令牌的方法是一种概括，但用于拆分文本的算法并非简单地将字符串从文本开头到结尾按顺序任意分组为四个字符。让我们更仔细地看看令牌化过程中发生了什么。\n\
  \n### 令牌化（Tokenization）\n\n令牌化^(²⁸) 在技术上是一种基于[字节对编码（BPE）逻辑](https://en.wikipedia.org/wiki/Byte_pair_encoding)^(²⁹)的算法。BPE\
  \ 识别文本中的模式，并用唯一代表该模式的令牌替换这些模式。这个过程迭代进行，直到无法识别出更多模式。\n\n例如：\n\n```\n对文本字符串 \"aabccabbbcccaabcc\"\
  \ 进行令牌化\n识别模式及其频率：\n\"aa\"\n\"bcc\"\naa bcc abb bcc c aa bcc\n通过用字符串中不存在的文本替换这些模式来令牌化：\n\
  ZXabbXcZX\nZ=aa\nX=bcc\n迭代：\nYabbXcY\nY=ZX\nZ=aa\nX=bcc\n```\n\n生成的令牌化文本（`YaabbXcY`）比原始文本（`aaccaabbbcccaabcc`）更小。令牌化后的文本是可逆且无损的，这意味着你可以将令牌转换回原始文本。\n\
  \nBPE 算法是 LLM 中令牌化逻辑的基础，不同之处在于，令牌化不仅仅是识别相邻的成对字符，还识别语言中常用的序列，并使用文本的数字表示形式，因为 LLM\
  \ 只理解数字。因此，令牌化也是将文本转换为数字格式的过程，即编码。存在不同的编码方法，例如`cl100k_base`、`p50k_base`和`r50k_base`。每个连续的文本、字母或单词都根据所使用的模型由一个唯一数字表示。Azure\
  \ OpenAI 模型使用不同的编码器，如表 2-1 所示。\n\n**表 2-1** OpenAI 模型使用的编码器\n\n| 编码器（Encoder） |\
  \ Azure OpenAI 模型 |\n| --- | --- |\n| `cl100k_base` | `gpt-4`，`gpt-3.5-turbo`，`text-embedding-ada-002`，`text-embedding-3-small`，`text-embedding-3-large`\
  \ |\n| `p50k_base` | `Codex`，`text-davici-002`，`text-davici-003` |\n| `r50k_base`\
  \ | `gpt-3`，`davinci` |\n\n令牌化器同时使用编码器和模型来决定如何选取连续的文本。这种组合构成了令牌化器用于转换的词汇表。在英语中，令牌通常被组合起来，形成一个字符到一个单词（例如，\"\
  t\" 或 \"meet\"）。空格通常被组合在单词的*开头*（例如，\" an\" 而不是 \"an \"）。\n\n例如：\n\n| `Run` | `n`\
  \ | `ing` | `is` | `an` | `Olymp` | `ic` | `sport` | `ing` | `event` | 36 个字符 |\n\
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| `2256` |\
  \ `25` | `341` | `45` | `85` | `5126` | `18` | `8459` | `341` | `3258` | 10 个令牌\
  \ |\n\n```\n用唯一数字替换不匹配的字符串或字符：\nn=25，Olymp=5126\n\n| Run | n  | ing | is | an |\
  \ Olymp | ic | sport | ing | event | 36 个字符 |\n| 2256 |   | 341 | 45 | 85 |   |\
  \ 18 | 8459 | 341 | 3258 |   |\n\n令牌化器词汇表：\n\"ing\" = 341\n\"is\" = 45\n\"an\" =\
  \ 85\n\"Run\" = 2256\n\"Kick\" = 2215\n\"ic\" = 18\n\"sport\" = 8459\n\"even\" =\
  \ 7485\n\"event\" = 3258\n对 \"Running is an Olympic sporting event\" 进行令牌化\n基于库识别连续文本：\n\
  \"Run\"，\"ing\"，\"ic\"，\"sport\"，\"event\"\n令牌化：\n```\n\n这个例子使用了一个假设的初级词汇表，但对于像\
  \ GPT-4 这样的 LLM，词汇表非常庞大，因此所需的令牌会更少。在这个例子中，我们也使用了假设的数字来表示单词是如何转换为数值的。一旦单词或字母被转换为数值，该值对于该单词或字母的每次出现都保持不变。使用相同的文本内容并将其输入到\
  \ OpenAI 的令牌化器中，我们得到的结果如下图 2-5 所示。\n\n![](img/501717_2_En_2_Fig5_HTML.jpg)\n\n**图\
  \ 2-5** 使用 OpenAI 令牌化器组织文本的方式\n\n你可能想知道为什么假设的例子给出了 10 个令牌，而 Tiktoken 显示了 6 个令牌。答案在于\
  \ OpenAI 所使用的算法。第一个例子仅用于说明令牌是如何从单词中生成的，而 Tiktoken 是一个实际的令牌化工具。简而言之，在选择单词/字符方面，Tiktoken\
  \ 比我们的手动转换更优化！因此其令牌计数更低。\n\n为了查看令牌化器生成的编码（数值），我们在一个笔记工具中使用了 OpenAI 的开源令牌化工具[Tiktoken](https://github.com/openai/openai-cookbook/blob/main/examples/How_to_count_tokens_with_tiktoken.ipynb)^(³⁰)，如下图\
  \ 2-6 所示。\n\n![](img/501717_2_En_2_Fig6_HTML.jpg)\n\n**图 2-6** 在 Jupyter Notebook\
