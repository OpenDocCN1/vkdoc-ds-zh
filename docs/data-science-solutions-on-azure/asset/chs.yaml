  \ Playground UI 与链交互，如下方图 8-8 所示。\n\n\n\n## 与你的数据库对话\n\n“与你的数据库对话”是一个非常吸引人的概念，因为到目前为止，你需要掌握数据库查询语言（例如\
  \ `SQL`）才能从数据库中检索到正确的信息。虽然编写简单的 `SQL` 语句很多人都能做到，但这仍然不像自然语言那样是一项普及的技能。\n\n此外，即便是最优秀的查询编写者，在编写复杂查询（例如，当数据跨越多张表时）时也会感到越来越困难。\n\
  \n在商业场景中，这通常需要两类专业人员——业务分析师和数据分析师。业务分析师了解业务规则和流程，也理解数据，但可能缺乏将这样的知识*翻译*成能提供正确信息的数据库查询所需的技术专长。因此，业务分析师必须将需求传达给数据分析师，再由数据分析师将请求转化为数据库查询，这使得流程效率低下且容易出错。`LLM`\
  \ 的 `NLP` 和 `Codex` 能力可以充当这个翻译层。\n\n### DBCopilot\n\n基于我们通过 `LangChain` 掌握的技能，我们将构建一个数据库\
  \ Copilot（`DBCopilot`），这样你就可以使用自然语言与数据库对话。\n\n#### 架构与流程\n\n我们的 `DBCopilot` 将包含一个\
  \ `LangChain Agent`，其组件如下：\n\n1.  `LLM`（Azure OpenAI）\n2.  `LangChain` SQL 数据库工具包（`SQLDatabaseToolkit`）\n\
