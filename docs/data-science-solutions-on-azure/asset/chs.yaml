- "# 9. Azure AI 服务\n\n在本书的第一版中，我们专注于数据科学中的科学。我们讨论了统计方法、机器学习、数据准备，以及如何通过 MLOps（机器学习运维）创建、更新和维护模型。\n\
  \n在这一版中，我们不仅专注于生成式 AI，还将关注应用型 AI。应用型 AI 是数据科学的消费端，我们*不需要*担心模型的创建和维护，而只需使用那些已针对特定任务优化的模型。这就是为什么应用型\
  \ AI 有时被称为“预封装 AI”或“AI 即服务”。\n\n## Azure AI 服务\n\n微软 Azure 自 2016 年起就拥有了一系列预封装的\
  \ AI 服务，目前这个系列的名称为 Azure AI 服务。您可能还听说过其他名称，如认知服务和应用型 AI。回顾这些服务的历史，将有助于了解这些名称的由来以及这些服务的未来路线图。\n\
  \n### 历史\n\n自推出 AI 服务以来，微软已多次重命名和重新打包这些服务，这导致了不少困惑。\n\n#### Azure 认知服务\n\n微软最初将其预封装的\
  \ AI 服务命名为 Azure 认知服务。之所以选择这个名称，是因为它大致涵盖了人类的认知能力——语音、语言、视觉和决策。微软研究院投入了大量资源来创建能够识别物体、理解语言以及处理面部特征以识别年龄、性别和情绪的模型。\n\
  \n这些能力随后被打包成易于应用程序开发者使用的服务，从而以非常交钥匙的方式提供人工智能。微软称此为人工智能的民主化。\n\n它是如何工作的？开发者不再需要成为数据科学家，也不需要拥有海量数据就能创建能够准确识别人或特定物体的模型。微软也能够获取训练、维护和改进这些预封装模型所需的大量公共数据。\n\
  \n微软通过将这些以开发者为中心的预封装 AI 模型与传统的“数据科学”工作进行区分，将其与 Azure 机器学习（AML）分离开来。\n\n\n#### Azure\
  \ Applied AI\n\n随后，微软开发了一套代表不同用例场景的 AI 能力，例如之前名为 `Forms Recognizer` 的服务。\n\n`Forms\
  \ Recognizer` 源自于 `OCR`（视觉能力），因为人工智能不仅用于从手写文字中准确识别文本，还用于识别键值对。这在表单中很常见。人们之所以知道如何填写表单，是因为表单的布局和字段名称。因此，即使你第一次拿到一张不熟悉的表单，也应该能够弄清楚如何提供所需信息。\n\
  \n因此，Azure Applied AI 是微软用来对这些基于场景的 AI 服务进行分类的名称。\n\n下面的图 9-1 展示了微软 AI 产品组合，当时 Applied\
  \ AI 服务与认知服务（Cognitive Services）是分开列出的，而 Azure OpenAI 则被添加到了认知服务中。它被表示为一个技术栈，因为基于场景的\
  \ AI 服务是构建在更基础的认知服务模型之上的。\n\n反过来，认知服务模型，以及任何自定义模型，都是基于 `Azure Machine Learning`\
  \ 构建的，数据科学家会利用其中的训练数据、计算资源和模型开发生命周期（MLOps）。\n\n最后，AI 栈的最上面两层是平台和应用程序，AI 能力通过这些层被暴露出来。\n\
  \n当以栈的形式呈现时，微软为何这样划分 AI 栈就变得更加合乎逻辑。这类似于开放系统互连（OSI）模型试图做的事情，只不过这里是针对 AI 的。\n\n微软在引入新类别的同时，还对一些服务进行了重命名，这并没有让情况变得更好。再次举例，`Forms\
  \ Recognizer` 被重命名为 `Document Intelligence`，然后从认知服务产品组合中移出，放入了新成立的 Applied AI 服务产品组合。\n\
  \n![](img/501717_2_En_9_Fig1_HTML.jpg)\n\n图 9-1\n\n在所有服务被统称为 Azure AI 服务之前的 Azure\
  \ AI 栈\n\n#### Azure AI Services\n\n在撰写本文时，微软已将其*所有* AI 服务整合到一个产品组合中，并命名为 `Azure\
  \ AI services`。请注意，这仍然与数据科学家使用的自定义工具 `Azure Machine Learning` 分开，但将数据科学家的领域与以开发者为中心的领域分开是有意义的。\n\
  \n`Azure AI services` 现在包含以下内容：\n\n1.  AI 视觉^(¹⁰⁴)\n    1.  **图像分析**^(¹⁰⁵)：使用预构建模型检测和分类图像中的对象，因此无需构建自己的模型。\n\
  \    2.  **自定义视觉：** 通过标记图像来训练自己的模型。自定义模型可用于识别或分类对象和人。AI 自定义视觉拥有其自己的工作室 UI，位于 [`https://customvision.ai`](https://customvision.ai)。\n\
  \    3.  **光学字符识别（OCR**^(¹⁰⁶)**:）** 从图像中提取文本。\n    4.  **空间分析：** 分析视频内容，例如创建摘要、生成关键词、识别和计数对象或人，以及监控视频画面中的区域和距离。\n\
  \    5.  **人脸：** 检测图像中一张或多张人脸的位置，以及姿态、口罩和面部属性。\n\n2.  AI 语言^(¹⁰⁷)\n    1.  自然语言处理\
  \ (NLP)\n    2.  提供翻译服务的多语言模型\n\n3.  AI 语音^(¹⁰⁸)\n    1.  **语音转文本：** 将可听的语音转录为可搜索的文本。\n\
  \    2.  **文本转语音：** 将文本转换为逼真的自然语音。\n    3.  **语音翻译：** 将实时语音翻译成不同语言。\n    4.  **说话人识别：**\
  \ 基于训练音频识别说话人。\n    5.  **语音命令：** 为应用程序和物联网设备创建语音激活或语音命令功能。\n\n4.  AI 翻译器^(¹⁰⁹)\n\
  \    1.  类似于语音翻译，但针对文本。实时或批量地将文本从一种语言翻译成另一种语言。\n\n5.  AI 内容安全\n    1.  预训练 AI 模型，用于识别色情、暴力、仇恨和自残内容\n\
  \    2.  支持多种语言的内容过滤\n    3.  预训练 AI 视觉模型，用于检测描绘色情、暴力、仇恨和自残内容的图像\n\n6.  AI 搜索^(¹¹⁰)\n\
  \    1.  **AI 驱动的搜索：** 回顾第 4 章和第 5 章，我们在那里以 RAG 架构的形式介绍了 AI 搜索。\n\n7.  AI 文档智能^(¹¹¹)\n\
  \    1.  以前称为 `Forms Recognizer`。\n    2.  理解 AI 文档智能的最佳方式是“增强版 OCR”。文档智能使用 AI 来识别键值对，通常用于从表单和文档中提取信息。\n\
  \n8.  Azure OpenAI\n    1.  `Azure OpenAI` 是 `Azure AI services` 产品组合中的最新成员，也是本书的重点。\n\
  \n所有 Azure AI 服务都提供 API 端点，这些端点接收来自你的应用程序或设备的输入，并以 JSON 格式返回相关结果。\n\n## 探索 Azure\
  \ AI Services\n\n部分 Azure AI 服务提供了用户界面，供你探索这些服务的工作原理。类似于 Azure OpenAI 的 AI 工作室，这些也被称为工作室。例如，AI\
  \ 视觉有视觉工作室（Vision Studio），文档智能有文档智能工作室（Document Intelligence Studio）。访问脚注中引用的每个\
  \ AI 服务的网站，即可找到相应服务的工作室。\n\n\n### 动手练习 9-1：部署 Azure AI 服务实例\n\n![](img/501717_2_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2：查找并选择 Azure AI 服务\n\n1.（如果已部署 Azure 自定义视觉则可跳过，直接进入第 5 步）。通过访问 Azure 门户 [`https://portal.azure.com`](https://portal.azure.com)\
  \ 来部署 AI 视觉服务。\n2. 点击 ![](img/501717_2_En_9_Figa_HTML.jpg)，然后在搜索框中输入 \"AI Services\"\
  ，并在结果中选择 Azure AI services，如下方图 9-2 所示。\n\n![](img/501717_2_En_9_Fig3_HTML.jpg)\n\
