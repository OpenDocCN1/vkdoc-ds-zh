  \n*   `请向订购过商品 SKU 123-456 或类似商品并选择接收营销信息的客户发送邮件。`\n\n我们可以从图 7-3 中找到不同插件的组合，并基于`Item`\
  \ + `Orders` + `Customers` + `MarketingList`插件来完成此任务。\n\n### 模板\n\n`Semantic Kernel`中的插件通过使用遵循特定格式的模板来定义。插件模板的格式是一组提示及其相关配置。下方图\
