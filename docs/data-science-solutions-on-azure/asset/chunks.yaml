- fmt: "### Hands-On Exercise 9-4: Azure Speech to Text and Translation\n\nFor this\
    \ hands-on exercise, we will explore Azure AI Speech service.\n\n*Scenario: We\
    \ need to receive incoming voice mails, transcribe the message, and translate\
    \ if it is not in English.*\n\nThere are several ways to address this scenario\
    \ that can be more efficient than making multiple API calls to different services;\
    \ for example, by using the new GPT-4 Whisper model, this can be addressed by\
    \ a single call. However, to demonstrate the chaining of multiple Azure AI services\
    \ together, we will first use the AI Speech service to transcribe the text. We\
    \ will then call AI Translate service to translate the text to English. Lastly,\
    \ we will use GPT-3.5T to create a summary of the transcription, recommend a follow-up\
    \ action item, and assess the sentiment of the translated voicemail transcript.\n\
    \nFor the design in this exercise, we will be using Postman and set environment\
    \ variables to pass the output from one AI service to the next. If you are not\
    \ familiar with Postman environments, please review the documentation on this\
    \ topic. Using Postman, we can model the workflow or RPA process, as shown in\
    \ Figure 9-18 below.\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig18_HTML.jpg)\n\
    \n**Figure 9-18** Chaining multiple Azure AI services into a workflow (modeled\
    \ in Postman)\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig19_HTML.jpg)\n\
    \n**Figure 9-19** Creating Azure AI Speech service\n\n1. Go to the GitHub repo\
    \ ([`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-9/wav_files`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-9/wav_files))\
    \ and download the audio file samples. There are three `wav` files, and they are\
    \ open-source sample `wav` files from [`https://freesound.org`](https://freesound.org).\
    \ One `wav` file is in English, and the other two are in Chinese (Mandarin – simplified).\
    \ We will use one of these files in this exercise.\n2. Launch the Azure portal\
    \ ([`https://portal.azure.com`](https://portal.azure.com)) and go to your AI services.\n\
    3. Select “Speech service” from the menu pane and click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figq_HTML.jpg)\
    \ as shown in Figure 9-19.\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig20_HTML.jpg)\n\
    \n**Figure 9-20** Keys and region for the AI Speech service\n\n4. Follow the prompts\
    \ to create a new Speech service instance. Once it is created, click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figr_HTML.jpg).\n\
    5. (Homework/Optional) On the Overview page of the speech service, feel free to\
    \ explore the Speech Studio by clicking on the link to it. We will *not* be reviewing\
    \ Speech Studio, but it is an intuitive UI that you will not have a problem navigating\
    \ and exploring on your own.\n6. Copy the region and one of the keys for use later\
    \ in the exercise (Postman), as shown in Figure 9-20 below. Paste the information\
    \ into your preferred lightweight text editor like Notepad or Notepad++ for now.\n\
    \n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig21_HTML.jpg)\n\n**Figure 9-21**\
    \ Setting up Postman request to accept a binary file\n\n7. For the body, select\
    \ binary, and then click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figs_HTML.jpg)\
    \ as shown in Figure 9-21 below. Then navigate to the location of the `wav` files\
    \ you downloaded in step 1.\n8. Repeat steps 2 through 6 to create an AI Translator\
    \ service.\n9. Launch Postman and create a new POST request with the following\
    \ parameters:\n\n- Type: POST\n- URL: `https://<REGION>.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=zh-CN`\
    \ (e.g. `https://westus2.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=zh-CN`)\n\
    - Headers:\n  - `Ocp-Apim-Subscription-Key`: Key from step 6\n  - `Content-Type`:\
    \ `audio/wav`\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig22_HTML.jpg)\n\
    \n**Figure 9-22** Adding test script to the Postman POST call to AI Speech service\n\
    \n10. Navigate to the location of the downloaded `wav` files from step 1, and\
    \ select the file named “`612867__petehaase__vm-mandarin.wav`”.\n11. You will\
    \ notice a ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figt_HTML.jpg) next\
    \ to the filename. This indicates the file is selected but not yet uploaded. Click\
    \ ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figu_HTML.jpg) and acknowledge\
    \ that the files will be uploaded and made available to others on your Postman\
    \ team.\n12. Click on Tests and enter the code snippet below, as shown in Figure\
    \ 9-22. Then click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figv_HTML.jpg).\n\
    \n```\nvar jsonData = JSON.parse(responseBody);\npostman.setEnvironmentVariable(\"\
    Transcript\", jsonData.DisplayText);\n```\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig24_HTML.jpg)\n\
    \n**Figure 9-24** Adding test script to the Postman POST call to AI Translate\
    \ service\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig23_HTML.jpg)\n\n\
    **Figure 9-23** Creating a POST request to the AI Translate service\n\n13. Create\
    \ a new POST request with the information below, as shown in Figure 9-23:\n\n\
    - Type: POST\n- URL: [`https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=en-US`](https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=en-US)\n\
    - Headers:\n  - `Ocp-Apim-Subscription-Key`: Key for AI Translate Service\n  -\
    \ `Content-Type`: `application/json`\n  - `Ocp-Apim-Subscription-Region`: Region\
    \ where AI Translate was deployed to\n\n14. Click on Tests and enter the code\
    \ snippet below, as shown in Figure 9-24. Then click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figw_HTML.jpg).\n\
    \n```\nvar jsonData = JSON.parse(responseBody);\npostman.setEnvironmentVariable(\"\
    Translate\", jsonData[0].translations[0].text);\n```\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig25_HTML.jpg)\n\
    \n**Figure 9-25** Adding variables to the Postman environment\n\n15. In Postman,\
    \ click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figx_HTML.jpg), and then\
    \ click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figy_HTML.jpg) to create\
    \ a new environment. Name the new environment “Chapter 9 env”.\n16. Make this\
    \ new environment the active environment by hovering over the environment name\
    \ and clicking ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figz_HTML.jpg) to\
    \ the right of the environment name. The symbol for the environment will change\
    \ to ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figaa_HTML.jpg), indicating\
    \ it is now the active environment.\n17. Add two new variables named “`Transcript`”\
    \ and “`Translate`” by clicking in the Variable box, as shown in Figure 9-25.\
    \ Then click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figab_HTML.jpg).\n\
    \n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig26_HTML.jpg)\n\n**Figure 9-26**\
    \ Transcript of the voicemail (in Chinese)\n\n18. Go to Collections.\n19. Select\
    \ the POST call for AI Speech service and click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figac_HTML.jpg).\n\
    20. Go to Environments and note that the `Transcript` variable now has the transcription\
    \ from the voicemail, as shown in Figure 9-26.\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig27_HTML.jpg)\n\
    \n**Figure 9-27** Translation of the transcript of the voicemail from Chinese\
    \ to English\n\n21. Go to Collections and now select the POST call for AI Translate\
    \ and click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figad_HTML.jpg)."
