    # 2. Understanding Large Language Models


    As mentioned in Chapter [1](#501717_2_En_1_Chapter.xhtml), the most significant
    development in AI is the introduction of generative AI. As promised, we will take
    a comprehensive look at generative AI. As part of this effort, we will learn new
    terminologies and concepts. By the time you have completed this chapter, you should
    be ready to engage in discussions around what generative AI can do to help organizations
    in their transformation journey.


    ## Large Language Models


    In the generative AI space, there are several LLMs to choose from. Here are the
    most popular ones:


    - `OpenAI` GPT models

    - `Microsoft Azure OpenAI` GPT models

    - `Anthropic` and `AWS Claude`

    - `Google Gemini` (formerly `Bard`)

    - `Hugging Face`

    - `Llama 2`


    These LLMs are differentiated by many factors, such as accuracy, groundedness,
    the amount of data they can process, and their ability to understand and generate
    content. These concepts and terms will be covered in this chapter, but since this
    book is focused on `Microsoft Azure`, we will only explore these concepts in the
    `OpenAI` GPT models. However, here is a general overview of the different types
    of LLMs available today.


    ### OpenAI and Microsoft GPT Models


