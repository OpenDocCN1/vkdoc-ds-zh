    \ documents are filtered based on similarity scores (1 to 5), with a default of\
    \ 3\\. Lower values include more documents, while higher values exclude more irrelevant\
    \ ones. Adjust to balance relevance and distraction. This is the strictness parameter\
    \ in the API.\n\nThe above settings are shown in Figure [5-11](#501717_2_En_5_Chapter.xhtml#Fig11).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig11_HTML.jpg)\n\nFigure 5-11\n\
    \nAzure OpenAI on your data parameters setup\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig12_HTML.jpg)\n\
    \nFigure 5-12\n\nAzure OpenAI on your data empty system message response\n\n1.\
    \  **System Message and Prompt Engineering:**\n\nThe system message guides how\
    \ the GPT assistant responds to user questions. Without the system message, the\
    \ assistant doesn’t have any response guidelines, and it will respond without\
    \ any personality to it. The system message is shown in Figure [5-12](#501717_2_En_5_Chapter.xhtml#Fig12).\n\
    \nYou can define a system message to guide the model’s responses with Azure OpenAI\
    \ on your data, allowing for customized replies within the RAG framework. This\
    \ message works with an internal base prompt to shape the user experience and\
    \ is truncated after a certain number of tokens to ensure effective answers. For\
    \ additional behavior customization, ensure your system prompt is detailed and\
    \ clear about the expected modifications.\n\nSystem message best practices:\n\n\
    1.  **Define a Role:** Specify the assistant’s role, e.g., “You are a medical\
    \ advice assistant specializing in pediatric care.”\n\n2.  **Define the Type of\
    \ Data:** Indicate the nature of the data, such as “clinical studies” or “legal\
    \ documents.” For example, “You provide answers using information from retrieved\
    \ clinical trial data.”\n\n3.  **Specify Data Characteristics:** Mention any unique\
    \ features of the data, like language or format. For instance, “You retrieve Spanish\
    \ documents and should respond in Spanish,” or “You are given data in spreadsheets\
    \ related to market analysis and should interpret the data accordingly.”\n\n4.\
    \  **Define Output Style:** Customize the response style, e.g., “You are an AI\
    \ assistant that communicates in a formal tone. Ensure all responses are professionally\
    \ worded.”\n\n5.  **Reaffirm Critical Behavior:** Emphasize important behaviors,\
    \ like “Please provide answers strictly based on retrieved documents, include\
    \ citations, and avoid using external knowledge.”\n\n6.  **Prompt Engineering\
    \ Tricks:** Use techniques like chain-of-thought prompting, e.g., “Let’s analyze\
    \ the retrieved documents step by step to construct a thorough response to the\
    \ user’s query.”\n\nWe will cover prompt engineering best practices in depth in\
    \ next chapter, but for the scope of this chapter – “Building RAG end to end”\
    \ – we have prepared an example system message below:\n\nSystem message for SNAP:\n\
    \n***start system message***\n\n“Your name is Priya. You act as an incredibly\
    \ warm, caring, empathetic, and knowledgeable virtual agent. Your main responsibility\
    \ is to address inquiries related to the State of Louisiana Department of Children\
    \ and Family Services (DCFS) and the U.S. Department of Agriculture (USDA) Supplemental\
    \ Nutrition Assistance Program (SNAP) food assistance programs. You have extensive\
    \ knowledge on various topics, including:\n\n1.  Louisiana’s Pandemic Electronic\
    \ Benefits Transfer (P-EBT) Program\n\n2.  Disaster SNAP (DSNAP)\n\n3.  SNAP Benefits,\
    \ Application, and Eligibility\n\n4.  211\n\n5.  SNAP Budget Sheets\n\n6.  Louisiana\
    \ Combined Application Project (LaCAP)\n\n7.  Redeterminations\n\n8.  DCFS CAFÉ\
    \ and Electronic Benefits Transfer (EBT):\n\nWhen shaping your communication style\
    \ and tone:\n\n*   Always seek clarification if you are uncertain about a response\
    \ to ensure you provide precise and useful information\n\n*   Respond with elevated\
    \ understanding, compassion, and empathy. Especially when users are distressed\
    \ or in crisis, your replies should be supportive and thoughtful.\n\n*   Avoid\
    \ generating harmful content: You must not create or share content that may be\
    \ harmful to someone physically or emotionally, even if a user requests it or\
    \ provides a condition to rationalize it.\n\n*   Your goal is to be a helpful,\
    \ supportive, and reliable source of information for users seeking assistance\
    \ with DCFS and SNAP-related inquiries.”\n\n***end system message***\n\nThe above\
    \ system message is a sample and can be further customized to meet the user desired\
    \ functionalities.\n\nOnce we prepared the system message, we will include in\
    \ the AI playground system message section and start asking questions in the chat\
    \ section to ensure our integration with AI search and system message is working\
    \ successfully. If we are accessing it via the api, this goes in *role_information*\
    \ parameter.\n\nNote"
  trans: "\n### 2. 附加定价：\n   无。\n\n### 3. 优势：\n   使用任何支持的语言，通过词组或短语在可搜索字段上进行快速且灵活的查询解析和匹配。\n\
    \n### 4. 限制：\n   关键词搜索仅依赖于精确词组和短语的匹配，可能导致结果受限或不准确。\n\n*   **语义搜索**\n    1.  **检索类型：**\
    \ 语义搜索。\n    2.  **附加定价：** 是，用于语义搜索使用。\n    3.  **优势：** 利用 AI 模型理解查询和文档的语义含义，提高搜索精度和相关性。\n\
    \    4.  **限制：** 语义搜索在处理模糊和复杂查询时可能存在困难，导致结果精确度降低。\n\n*   **向量搜索**\n    1.  **检索类型：**\
    \ 向量搜索。\n    2.  **附加定价：** 是，用于调用 Azure OpenAI 上的嵌入模型。\n    3.  **优势：** 基于向量嵌入查找与给定查询相似的文档。\n\
    \    4.  **限制：** 此搜索依赖于将数据表示为数值向量的嵌入技术。虽然这种方法能捕获向量之间的相似性，但可能难以捕获更细微或抽象的关系。此外，向量搜索的有效性在很大程度上取决于向量表示的质量和相关性。\n\
    \n*   **混合（向量 + 关键词）搜索**\n    1.  **检索类型：** 向量搜索与关键词搜索的混合。\n    2.  **附加定价：**\
    \ 是，用于调用 Azure OpenAI 上的嵌入模型。\n    3.  **优势：** 结合了向量相似性搜索与灵活的查询解析以及在字母数字字段上的全文搜索。\n\
    \    4.  **限制：** 此类搜索仍面临关键词搜索的限制，例如由于措辞变化或同义词导致的潜在不匹配，并且还依赖于关键词和向量组件的优化集成与权重平衡。\n\
    \n*   **混合（向量 + 关键词）+ 语义搜索**\n    1.  **检索类型：** 向量搜索、语义搜索与关键词搜索的混合。\n    2.  **附加定价：**\
    \ 是，用于调用 Azure OpenAI 上的嵌入模型和语义搜索使用。\n    3.  **优势：** 利用向量嵌入、语言理解和灵活的查询解析，实现丰富的搜索体验和复杂的信息检索，非常适合生成式\
    \ AI 应用。\n    4.  **限制：** 这种组合非常复杂且难以实现，需要仔细考虑如何有效平衡和组合不同的技术。\n\n既然搜索索引已创建，我们将能够配置有助于提升查询响应质量的附加设置。以下是两个可调整的运行时参数：\n\
    \n**检索文档数：** 控制提供给模型的文档块数量（3、5、10 或 20），默认值为 5。增加此参数可能有助于捕获更多相关信息，但也可能干扰模型。根据回复中缺失的上下文进行调整。这是\
    \ API 中的 `topNDocuments` 参数。\n\n**严格度：** 根据相似度分数（1 到 5）决定过滤不相关文档的激进程度，默认值为 3。较低的值会包含更多文档，而较高的值会排除更多不相关的文档。根据平衡相关性和干扰进行调整。这是\
    \ API 中的 `strictness` 参数。\n\n上述设置如图 5-11 所示。\n\n![](img/501717_2_En_5_Fig11_HTML.jpg)\n\
    \n**图 5-11** Azure OpenAI 在你数据上的参数设置\n\n![](img/501717_2_En_5_Fig12_HTML.jpg)\n\
    \n**图 5-12** Azure OpenAI 在你数据上使用空系统消息时的响应\n\n### 1. 系统消息与提示工程：\n\n系统消息指导 GPT\
    \ 助手如何回应用户问题。没有系统消息时，助手没有任何回复指南，它将毫无个性地做出回应。系统消息如图 5-12 所示。\n\n你可以定义一个系统消息，以指导模型在使用\
    \ Azure OpenAI 自有数据时的响应，从而在 RAG 框架内实现定制化回复。此消息与内部基础提示协同工作，以塑造用户体验，并在达到一定令牌数量后被截断以确保有效回答。如需额外的行为定制，请确保你的系统提示详细明确，清晰说明预期的修改。\n\
    \n**系统消息最佳实践：**\n\n1.  **定义角色：** 指定助手的角色，例如，“你是一名专注于儿科护理的医疗建议助手。”\n2.  **定义数据类型：**\
    \ 指明数据的性质，例如“临床研究”或“法律文件”。例如，“你使用检索到的临床试验数据中的信息来提供答案。”\n3.  **指定数据特征：** 提及数据的任何独特特征，如语言或格式。例如，“你检索西班牙语文档并应使用西班牙语回复”，或“你获得的是与市场分析相关的电子表格数据，并应相应地进行解释。”\n\
    4.  **定义输出风格：** 定制响应风格，例如，“你是一个以正式语气交流的 AI 助手。确保所有回复措辞专业。”\n5.  **重申关键行为：** 强调重要行为，例如，“请严格根据检索到的文档提供答案，包含引用，并避免使用外部知识。”\n\
    6.  **提示工程技巧：** 使用思维链提示等技术，例如，“让我们逐步分析检索到的文档，以构建对用户查询的全面回复。”\n\n我们将在下一章深入介绍提示工程的最佳实践，但就本章范围——“端到端构建\
    \ RAG”而言——我们准备了以下示例系统消息：\n\n**SNAP 的系统消息：**\n\n```\n开始系统消息\n\n“你的名字是 Priya。你的角色是一个极其温暖、关怀、富有同情心且知识渊博的虚拟代理。你的主要职责是处理与路易斯安那州儿童与家庭服务部（DCFS）和美国农业部（USDA）补充营养援助计划（SNAP）食品援助计划相关的查询。你在多个主题上拥有广泛的知识，包括：\n\
    \n1.  路易斯安那州流行病电子福利转移（P-EBT）计划\n2.  灾难 SNAP（DSNAP）\n3.  SNAP 福利、申请和资格\n4.  211\n\
    5.  SNAP 预算表\n6.  路易斯安那州联合申请项目（LaCAP）\n7.  重新确定\n8.  DCFS CAFÉ 和电子福利转移（EBT）：\n\
    \n在塑造你的沟通风格和语气时：\n\n*   如果你对某个回复不确定，务必寻求澄清，以确保提供准确有用的信息\n*   以高度理解、同情心和同理心回应。特别是当用户处于困扰或危机中时，你的回复应支持性和体贴。\n\
    *   避免生成有害内容：即使有用户请求或提供合理化条件，你也不得创建或分享可能对他人造成身体或情感伤害的内容。\n*   你的目标是成为寻求 DCFS 和\
    \ SNAP 相关帮助的用户的可靠、支持和信息丰富的来源。”\n\n结束系统消息\n```\n\n上述系统消息是一个示例，可以进一步定制以满足用户所需的功能。\n\
    \n准备好系统消息后，我们将把它包含在 AI 游乐场的系统消息部分，并开始在聊天部分提问，以确保与 AI 搜索和系统消息的集成成功运行。如果通过 API 访问，则将其放入\
    \ `role_information` 参数中。\n\n> **注意**\n"
- fmt: 'The system message guides how the GPT assistant responds to user questions
    based on retrieved documentation, but it doesn’t affect the retrieval process.
    For retrieval instructions, include them in your questions. The system message
    serves as guidance, and the model might not follow every instruction due to its
    primed behaviors like objectivity and avoiding controversy.


    1.  **Objectivity:** The model is designed to provide factual, unbiased information.
    This means it avoids taking sides in debates or making subjective judgments. If
    a system message encourages a more opinionated or biased response, the model may
    struggle to comply.

    2.  **Avoiding Controversial Statements:** The model avoids generating content
    that could be seen as divisive or inflammatory. It steers clear of topics that
    might lead to arguments or emotional distress. If a system message pushes the
    model to engage in such topics, it might default to safer, more neutral responses.


    Unexpected behavior may occur if the system message contradicts these behaviors.


    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig13_HTML.jpg)


    **Figure 5-13** Azure OpenAI on your data personalized system message response


    As shown in Figure [5-13](#501717_2_En_5_Chapter.xhtml#Fig13), our system message
    instructions personalize the assistant, providing clear guidance on the information
    to offer. This makes the assistant more conversational and adds a human touch,
    with a focus on empathy. Also notice `Prompt Flow` and `WebApp Deployment` at
    the top – now that we have prepared our system message and done some prompt engineering,
    our next step is to evaluate how good our assistant performs on several questions.
    We will use `Prompt Flow` for it, and once we have evaluated evaluation metrics,
    we will deploy it as a web application.


    Additionally, we can also export it as a `JSON` file or a `Prompty` File which
    is designed to facilitate the development of prompt templated. You can also “View
    Code” to pull everything built on UI in a number of languages – `Python`, `C#`,
    `JavaScript`, etc.


    `Prompty` Reference: [`https://microsoft.github.io/promptflow/how-to-guides/develop-a-prompty/index.html`](https://microsoft.github.io/promptflow/how-to-guides/develop-a-prompty/index.html)


    ## Prompt Flow


    `Prompt Flow` is a comprehensive suite of development tools designed to streamline
    the entire development lifecycle of LLM-based AI applications. This includes every
    phase from ideation, prototyping, testing, and evaluation, all the way to production
    deployment and ongoing monitoring. By simplifying prompt engineering, it empowers
    you to develop LLM applications with production-level quality.


    With `Prompt Flow`, we gain the ability to:


    1.  **Create Executable Workflows:** Design workflows that seamlessly integrate
    LLMs, prompts, Python code, and other tools, ensuring they work together efficiently
    in an executable sequence.

    2.  **Create prompt variants and compare their performance.**

    3.  **Debug and Iterate with Ease:** Easily debug and refine your workflows, with
    a particular emphasis on tracing interactions with LLMs to ensure smooth operation
    and accurate results.

    4.  **Evaluate Performance:** Assess your workflows by calculating quality and
    performance metrics using larger datasets. This helps in understanding how well
    your workflows perform under various conditions.

    5.  **Integrate with CI/CD Systems:** Incorporate testing and evaluation processes
    into your Continuous Integration/Continuous Deployment (CI/CD) systems. This ensures
    that your workflows maintain high quality and reliability throughout their lifecycle.

    6.  **Deploy Seamlessly:** Deploy your workflows to the serving platform of your
    choice or integrate them directly into your application’s codebase with minimal
    hassle.

    7.  **Collaborate in the Cloud:** Enhance team collaboration by leveraging the
    cloud version of `Prompt Flow` available in Azure AI. This enables your team to
    work together more effectively, sharing resources and insights to develop superior
    LLM-based AI applications.


    `Prompt Flow` offers a robust and user-friendly environment for developing, testing,
    and deploying high-quality LLM applications, making the entire process more efficient
    and collaborative.


    In addition, it provides a highly flexible environment for prompt engineering,
    enhancing the overall development experience. It offers a visual layout of your
    project’s structure, making it easy to see, understand, and navigate through our
    work. This helps us keep track of how everything fits together seamlessly. We
    can create different versions of your prompts and compare them side by side, facilitating
    a step-by-step, iterative refinement process. Built-in tools allow us to assess
    the quality and effectiveness of our prompts and workflows, ensuring that our
    solutions are working as intended and making necessary adjustments straightforward.
    Additionally, `Prompt Flow` comes with a comprehensive library of built-in tools,
    samples, and templates. These resources serve as helpful starting points for your
    projects, sparking creativity and accelerating the development process. Overall,
    `Prompt Flow` simplifies the process of designing, testing, and refining your
    prompts, making it easier and faster to develop high-quality AI applications.'
