  trans: "  \n**示例：** 搜索结果可能将《哈利·波特》这样的电影排在列表顶部，因为描述其情节的向量在向量空间中与关于年轻巫师的查询向量最为接近。\n\
    \n![](img/501717_2_En_4_Fig12_HTML.jpg)\n\n图 4-12\n\n基于向量搜索的信息检索系统\n\n在上述流程图（图\
    \ 4-12）中，我们可以看到用户查询如何从向量数据库中检索信息。基于向量的信息检索系统在自然语言处理领域越来越受欢迎。这些系统使用向量（即从文档生成的数值表示）来查找与用户查询最相关的文档。创建这些向量的方法有多种，包括\
    \ `Word2vec`、`Glove2vec` 和 `Sentence BERT`。为了进一步提升这些系统的性能，会使用 `PCA`（主成分分析）和因子分析等技术。这些方法通过转换词嵌入来优化模型性能。\n\
    \n通常，信息检索系统的流程始于用户输入查询。该查询经过预处理，转换为系统能够理解的格式。然后，系统利用该查询查找并返回最相关的信息。使用 `PCA` 和因子分析等后处理方法已被证明能略微提升结果，使平均精确率提高约\
    \ 2–3%。这意味着系统在根据用户查询检索相关文档时更加准确。\n\n当然，仅依赖向量搜索的方法也存在局限性。向量嵌入能有效判断文档之间的相似性，使向量搜索成为许多查询类型的更优选择（相较于传统关键词搜索）。尽管有诸多优势，但向量搜索并未普遍应用于所有查询，因为在某些情况下，关键词搜索仍能提供更相关的结果。大多数现代搜索技术倾向于采用混合搜索，即结合语义搜索和向量搜索检索技术。\n\
    \n在探索搜索技术时，认识到语义搜索和向量搜索之间的差异非常重要，因为它们在解释数据含义方面各有独特方法。语义搜索旨在通过分析每次搜索背后的意图和上下文含义来理解用户查询。这种方法力求通过把握搜索词的深层含义，提供高度相关且精准满足用户需求的结果。另一方面，向量搜索通过将文本转换为捕获语义含义的向量来工作，从而能够精确筛选海量数据集。这种方法侧重于查找上下文相似的条目，而非仅依赖关键词匹配。\n\
    \n混合搜索是一种融合多种搜索算法以提升搜索结果精确度和相关性的方法。它整合了基于关键词的搜索方法和向量搜索方法的关键特性，在其框架中同时利用稠密向量和稀疏向量。稀疏向量包含大量零值，通常用于关键词搜索，并由\
    \ `BM25` 等传统搜索引擎算法生成。相反，稠密向量包含更多非零值，用于人工智能驱动的搜索算法。通过结合这些不同算法的优势，混合搜索为用户提供了更强大、更有效的搜索体验。\n\
    \n图 4-13 对比了所有三种搜索类型。\n\n![](img/501717_2_En_4_Fig13_HTML.jpg)\n\n图 4-13\n\n关键词搜索、语义搜索和向量搜索的对比\n\
    \n## 本章小结\n\n在本章中，我们学习了设计 `GenAI` 解决方案的几种关键方法。我们研究了现代信息检索系统在组织和访问每日产生的海量数据中如何至关重要。这些系统通过使用文档集合、索引、查询处理器、排序算法和用户界面等组件，促进了跨文本、图形、音频和视频的高效搜索，从而提供精确且相关的信息。\n\
    \n我们还深入探讨了检索增强生成（`RAG`）流程的具体细节，该流程通过结合数据检索与生成式响应能力来增强聊天机器人交互，并讨论了现代信息检索系统的组件及其重要性——这些系统组织并处理海量数据阵列，以促进高效且相关的信息访问。\n\
    \n我们学习了搜索技术的进步，特别强调了语义搜索和向量搜索。语义搜索利用人工智能解释查询背后的上下文和意图，从而提高搜索结果的相关性；而向量搜索则将查询转换为数值向量，以查找上下文相似的条目，从而超越简单的关键词匹配，提升搜索体验。最后，我们提及了混合搜索系统，它整合了语义搜索和向量搜索技术的优势，以优化搜索准确性和相关性。\n\
    \n通过这些讨论，本章全面概述了 `GenAI` 解决方案在当前的能力以及未来在改变我们与技术在各个领域互动及利用方式方面的潜力。\n\n我们将在第 5 章中更深入地探讨如何利用\
    \ `RAG` 和 Azure 工具构建信息检索系统。\n\n# 5. 实现生成式 AI 解决方案\n\n## 引言\n\n在本章中，我们将主要利用第 4\
    \ 章介绍的技术，并借助 Azure 提供的各种工具和服务，探索 `GenAI` 解决方案的实现。在 Azure 上实现 `GenAI` 解决方案为企业带来了诸多好处。Azure\
    \ 是微软的云计算平台，为部署和管理 `GenAI` 解决方案提供了安全且可扩展的环境。通过利用 Azure 的基础设施和服务，企业可以轻松利用人工智能的强大功能来推动创新并获取竞争优势。借助\
    \ Azure 丰富的 AI 工具和服务（如 Azure Machine Learning 和 Cognitive Services），组织可以快速高效地构建和部署\
    \ `GenAI` 模型。此外，Azure 与 Power BI 和 Dynamics 365 等其他微软产品的集成，使企业能够从 AI 生成的数据中获取可操作的见解，从而增强决策过程。同时，Azure\
    \ 的全球分布确保了低延迟和高可用性，使组织能够向全球客户交付 AI 解决方案。\n\nAzure OpenAI 平台为开发者提供了利用 Python 和\
    \ C# SDK 以及 REST API 增强其应用程序人工智能能力的功能。在该平台内，有多种 AI 模型可用（如 GPT-35 和 GPT-4），每种模型都针对特定任务设计，并且可以通过\
    \ Azure OpenAI 服务轻松部署这些模型。在前面的章节中，我们了解了如何在 Azure 中部署 Azure OpenAI 服务。现在，我们将深入了解如何使用\
    \ Azure OpenAI Studio 构建一个名为“与你的数据对话”的应用程序。此外，我们还将探索如何使用 Prompt Flow 方法评估该应用程序。\
    \  \n"
- fmt: "# Azure OpenAI – Chat with Your Data\n\n`Azure OpenAI` empowers developers\
    \ to integrate Retrieval-Augmented Generation (RAG) by connecting AI chat models\
    \ to their own data. `Azure OpenAI` on your data allows you to use powerful AI\
    \ models like `GPT-35 Turbo` and `GPT-4` with your own business data without needing\
    \ to train or fine-tune the models yourself. This enables you to have more accurate\
    \ conversations and analyze your data better. You can access `Azure OpenAI` on\
    \ your data through a REST API, SDK, or the web-based interface in `Azure OpenAI\
    \ Studio`. Additionally, you have the option to create a web app that connects\
    \ to your data for an improved chat solution or directly deploy it as a copilot\
    \ in the `Copilot Studio` (preview).\n\nYou can specify the sources of data to\
    \ support the responses as shown in Figure [5-1](#501717_2_En_5_Chapter.xhtml#Fig1),\
    \ ensuring that you get the most up-to-date information from your designated data\
    \ sources. Currently the following data sources are supported: `Azure AI Search`,\
    \ `Azure Blob Storage`, `Azure CosmosDB for MongoDB vCore`, `Elastic search`,\
    \ and filetypes such as `.txt`, `.md`, `.html`, `.docx`, `.pptx`, `.pdf`.\n\n\
    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig1_HTML.jpg)\n\nFigure 5-1\n\n\
    Supported data sources in `Azure OpenAI Studio`\n\nWhen it comes to specific data\
    \ sources like uploading files from your local machine (preview) or data stored\
    \ in a blob storage account (preview), `Azure AI Search` comes into play. In these\
    \ scenarios, when you opt for these particular data sources, your data undergoes\
    \ ingestion into an `Azure AI Search Index`. This means that the data is organized\
    \ and made searchable within the `Azure AI Search` service, allowing for efficient\
    \ retrieval and analysis. This also allows you to create the search resource and\
    \ index, ensuring that the appropriate chunking occurs during the insertion process.\n\
    \nUploading files is suggested if max size of all files per upload is 16MB (as\
    \ of June 2024) as shown in Figure [5-2](#501717_2_En_5_Chapter.xhtml#Fig2); if\
    \ your files are larger than 16MB, you should first upload to storage account\
    \ and then use `Azure blob storage` as data source in `Azure OpenAI studio`.\n\
    \nAdditionally, if the files contain special formatting like tables, columns,\
    \ bullet points, or other complex structures, it is recommended to prepare the\
    \ data using the data preparation script available on `GitHub`.\n\n- AI Studio:\
    \ [`https://ai.azure.com`](https://ai.azure.com)\n- GitHub Repo: [`https://github.com/microsoft/sample-app-aoai-chatGPT/tree/main/scripts#optional-crack-pdfs-to-text`](https://github.com/microsoft/sample-app-aoai-chatGPT/tree/main/scripts#optional-crack-pdfs-to-text)\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig2_HTML.jpg)\n\nFigure 5-2\n\
    \nUpload files section in `OpenAI Studio`\n\nThis script ensures that the data\
    \ is properly formatted and chunked, leading to more accurate responses from the\
    \ model. For documents or datasets with lengthy text content, it is advisable\
    \ to utilize the data preparation script. This script effectively chunks the data,\
    \ enabling the model to provide more precise and accurate responses. Additionally,\
    \ the data preparation script also supports scanned PDF files and images, ensuring\
    \ compatibility with a variety of data sources.\n\nWe will leverage `Azure OpenAI`\
    \ on your data guide to build GenAI RAG Application End to End.\n\n## Build GenAI\
    \ RAG Application End to End\n\nLet’s develop a GenAI application utilizing `Azure\
    \ AI Studio`, incorporating a public dataset on the Supplemental Nutritional Assistance\
    \ Program (SNAP) in Louisiana. This innovative application will act as a GenAI\
    \ assistant, designed to provide citizens with 24/7 empathetic support. By offering\
    \ timely and compassionate assistance, the GenAI assistant aims to enhance user\
    \ experience and significantly alleviate the workload of call centers.\n\n- SNAP\
    \ dataset: [`https://www.dcfs.louisiana.gov/page/snap`](https://www.dcfs.louisiana.gov/page/snap)\n\
    - Azure OpenAI models region availability: [`https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models`](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models)\n\
    \n**Pre-requisites:**\n\n1.  Azure Subscription\n2.  Azure AI Studio\n3.  Azure\
    \ Open AI GPT-4o in any of the available regions\n4.  Azure Open AI GPT-4o key\n\
    5.  Azure Storage Account\n6.  Azure AI Search\n\n`AI Studio` offers a unified\
    \ platform for AI developers and data scientists to build, evaluate, and deploy\
    \ AI models via a web portal, SDK, or CLI, leveraging Azure services. The primary\
    \ resources in `AI Studio`, namely, the hub and project, are built on `Azure Machine\
    \ Learning`. While the hub and project reference connected resources like `Azure\
    \ OpenAI`, `Azure AI services`, and `Azure AI Search`, these resources manage\
    \ their own lifecycle independently.\n\n**Steps:**\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3\n\n`Azure AI Studio` create hub\n\n1.  **Create AI HUB**\n\n    The\
    \ AI Hub serves as a central repository designed to house AI projects and establish\
    \ connections to various AI resources. These AI resources can include AI Services,\
    \ `Azure OpenAI`, and AI Search, providing a comprehensive framework for managing\
    \ and deploying AI capabilities. AI Hub includes:\n    - Security configurations\
    \ with a managed network for projects and endpoints\n    - Project management\
    \ with the ability to host multiple child projects\n    - Compute resources for\
    \ development, fine-tuning, and model deployments\n    - An Azure storage account\
    \ for data and artifacts\n\n    We will create Azure AI hub as shown in Figure\
    \ [5-3](#501717_2_En_5_Chapter.xhtml#Fig3).\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig4_HTML.jpg)\n\
    \nFigure 5-4\n\n`Azure AI Studio` project look\n\n1.  **Create a Project: A Child\
    \ Resource of Hub**\n\n    Next, we initiate projects to develop our AI solutions\
    \ as shown in Figure [5-4](#501717_2_En_5_Chapter.xhtml#Fig4). The `AI Studio`,\
    \ along with the AI Hub, offers a centralized interface to manage and oversee\
    \ these projects, representing a significant advancement in streamlining AI development\
    \ and project management processes. A project can include:\n    - An isolated\
    \ container for data uploads, using the hub’s storage\n    - Project-specific\
    \ connections for private access to resources\n    - Reusable components such\
    \ as datasets, models, and indexes\n    - Development tools for building and customizing\
    \ AI applications\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig5_HTML.jpg)\n\
    \nFigure 5-5\n\n`Azure AI Studio` connections\n\n1.  In Settings, create connections\
    \ to `Azure blob storage`, `Azure AI search`, and `Azure OpenAI` as shown in Figure\
    \ [5-5](#501717_2_En_5_Chapter.xhtml#Fig5)\n\n    In the Connections pane, select\
    \ the highlighted ones as shown in Figure [5-6](#501717_2_En_5_Chapter.xhtml#Fig6).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig6_HTML.jpg)\n\nFigure 5-6\n\
    \n`Azure AI Studio` available assets to connect\n\nOnce the connections are set\
    \ up, we can see and verify all the connections in our project as shown in Figure\
    \ [5-7](#501717_2_En_5_Chapter.xhtml#Fig7).\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig7_HTML.jpg)\n\
    \nFigure 5-7\n\n`Azure AI Studio` connected resources\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig8_HTML.jpg)\n\
    \nFigure 5-8\n\n`Azure OpenAI` on your data in AI Studio"
