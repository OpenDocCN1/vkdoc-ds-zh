    # 9. Azure AI服务


    在本书的第一版中，我们专注于数据科学中的科学。我们讨论了统计方法、机器学习、数据准备，以及如何通过MLOps（机器学习运维）创建、更新和维护模型。


    在这一版中，我们不仅专注于生成式AI，还将关注应用型AI。应用型AI是数据科学的消费端，我们*不需要*担心模型的创建和维护，而只需使用那些已针对特定任务优化的模型。这就是为什么应用型AI有时被称为“预封装AI”或“AI即服务”。


    ## Azure AI服务


    微软Azure自2016年起就拥有了一系列预封装的AI服务，目前这个系列的名称为Azure AI服务。您可能还听说过其他名称，如认知服务和应用型AI。回顾这些服务的历史，将有助于了解这些名称的由来以及这些服务的未来路线图。


    ### 历史


    自推出AI服务以来，微软已多次重命名和重新打包这些服务，这导致了不少困惑。


    #### Azure认知服务


    微软最初将其预封装的AI服务命名为Azure认知服务。之所以选择这个名称，是因为它大致涵盖了人类的认知能力——语音、语言、视觉和决策。微软研究院投入了大量资源来创建能够识别物体、理解语言以及处理面部特征以识别年龄、性别和情绪的模型。


    这些能力随后被打包成易于应用程序开发者使用的服务，从而以非常交钥匙的方式提供人工智能。微软称此为人工智能的民主化。


    它是如何工作的？开发者不再需要成为数据科学家，也不需要拥有海量数据就能创建能够准确识别人或特定物体的模型。微软也能够获取训练、维护和改进这些预封装模型所需的大量公共数据。


    微软通过将这些以开发者为中心的预封装AI模型与传统的“数据科学”工作进行区分，将其与Azure机器学习（AML）分离开来。'
