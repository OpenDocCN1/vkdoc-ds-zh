  trans: "\n# 超越聊天机器人\n\nLLM 可以集成到各类应用程序中，无论是基于云的应用程序（Web 应用）还是安装在计算机上的软件。我们认为，参照每个产品对应的微软\
    \ Copilot^(⁷⁹)，将此类用例称为*智能副驾*是最简单的表述方式。事实上，这些微软 Copilot 正是使用`Semantic Kernel`构建的。\n\
    \n尽管“智能副驾”一词已被宽泛地用于指代任何具有 LLM 功能的事物，包括聊天机器人，但我们认为，智能副驾应该仅指代由 LLM 驱动的应用程序。这意味着智能副驾存在于应用程序内部，并且是解决方案的一部分。你无需离开当前系统就能使用\
    \ LLM。在你使用应用程序时，LLM 会积极地提供协助。\n\n例如，使用 GitHub Copilot 时，在你开始编码的同时，它就会开始建议下一行代码。它还能协助调试，并可以解释和/或修复问题。GitHub\
    \ Copilot 是一个安装到 Visual Studio Code 和 Visual Studio 等 IDE 中的扩展，^(⁸⁰)从而扩展了这些 IDE\
    \ 的功能。同样地，当你在 Word 中开始新文档时，M365 Copilot 会让你选择为其提供一个提示，以帮助你完成写作任务。\n\n`Semantic\
    \ Kernel`允许开发者实现不同的插件，包括 AI 插件，这样新的和现有的代码现在都可以受益于 LLM 的赋能。因此，我们提出了两个不同的用例类别——聊天机器人与智能副驾。\n\
    \n## 实时数据\n\nLLM 的一个缺点是其受限于模型训练时的时间界限数据。在第 4 章中，我们也了解了通过 RAG 架构将 LLM 与精心整理的数据源相结合。然而，这仍然是基于有时限的数据源。\n\
    \n`Semantic Kernel`的一个引人注目的用例是让 LLM 能够从 Web 服务获取实时数据。例如，使用`Semantic Kernel`，LLM\
    \ 可以查询 Web 服务中的航班状态以了解其航班时刻表。一个投资追踪应用程序，当用自然语言询问当天当前的最大市场异动股是什么时，它可以连接到 Web 服务以获取该信息，并研究可能导致这种波动的相关最新新闻。\n\
    \n## 执行任务\n\n除了检索信息、创建内容或回答问题之外，使用`Semantic Kernel`的另一个好处是能够执行任务。例如，在查询了航班状态和价格后，`Semantic\
    \ Kernel`可以启动购买机票或预订酒店等操作。\n\n## 代理与智能副驾\n\n如上所述，代理是 LLM 的一种表现形式，其目的是帮助回答问题并自动化任务。智能副驾是一种特殊类型的代理，它可以帮助回答问题，但不会自动化任务。这就是为什么许多用例目前都是智能副驾，因为它们相对更容易实现，并且由于没有任务被自动化，所以也更安全。智能副驾与人类协同工作，提供建议和回答问题，但人类始终掌握控制权，并负责执行智能副驾建议的任何任务。\n\
    \n一旦智能副驾部署完毕，它随后可以转变为一个功能完备的代理；因此，无需从头重建。\n\n## 动手练习 7-1：开始使用 Semantic Kernel\n\
