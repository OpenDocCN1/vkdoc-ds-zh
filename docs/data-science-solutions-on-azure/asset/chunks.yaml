    cause of this convergence.


    As a large language model, ChatGPT’s distinctive feature is its user interface
    (UI). This interface is the ability to use natural language to get the model to
    do things. No special syntax, format, programming ability, or even any experience
    in data science needed. For that matter, if you ask ChatGPT using one of the more
    than 40 languages supported, it should know what you are asking it to do.


    We will cover generative AI in detail from Chapter [2](#501717_2_En_2_Chapter.xhtml)
    onwards, but for now, with this understanding that generative AI is able to converse
    in natural language, it is not surprising to see why there is a convergence in
    the leveraging of AI by everyone. When ChatGPT was first introduced, consumers
    flocked to the site to ask it to generate dinner ideas, travel itineraries, poetry,
    letters, emails, party ideas, and almost everything imaginable. Realtors are leveraging
    it to create narratives for listing properties, and government organizations use
    it to quickly understand and apply complex rules and regulations. Commercial organizations
    are using it to create advertising materials and marketing plans and identify
    customer sentiment. Legal professionals and lawmakers use it to quickly understand
    legal documents and also create initial drafts of new legislation. Since the common
    skill needed to make use of this technology, in all these use cases, is the ability
    to communicate in natural language, the personal and professional personas of
    individuals become overlapped.


    On the regulatory compliance front, the gap between the government cloud and the
    commercial cloud is also starting to close. This is mainly due to the maturity
    of cloud computing, better understanding of risks, and improvement in technologies
    and processes that makes it more feasible to provide a common standard across
    all clouds. As such, many of the regulatory compliance for government versus commercial
    use cases have converged. For example, the Federal Risk and Authorization Management
    Program (FedRAMP) in the United States, perhaps the most stringent of regulatory
    compliance requirements, now applies to both Azure Government and Azure Commercial
    clouds.^([¹](#fn1))


    ## Responsible AI


    In the first edition, we introduced the concept of ethics in data science and
    covered trending issues such as the convergence of science fiction and reality.
    This convergence resulted in a vast societal transformation. There have been key
    inflection points when silicon technology has made significant impact to people’s
    professional and personal lives – the era of personal computing, the Internet,
    and AI. How reliant are you on mapping technology, IoT devices that control your
    home, appliances, and your health data, just to name a few? The deep integration
    of AI in our daily lives has only increased exponentially in the last few years.


    We dedicated only a small section to talk about trending topics at that time,
    like fake news and job elimination. Those are still concerns, but in the short
    span of three years, the interest and concern around societal and human impact
    from AI is now a bigger topic than the actual technology itself. Why is this the
    case? Could it be that there are growing signs that AI, in *every* *cognitive
    and intellectual aspect* *combined*, may be approaching human parity. We believe
    this is indeed the case, but what does human parity really mean? Let us explore
    this concept a little further.


    ### Artificial General Intelligence (AGI)


    Artificial general intelligence (AGI) is a theoretical type of AI that many believe
    is the next iteration of AI. AGI is defined as the ability for computers to make
    decisions and perform tasks that normally require human intelligence. Human intelligence
    is in turn defined as the power for reasoning, learning, decision-making, natural
    language understanding, vision, speech, etc. All the cognitive abilities that
    a human possesses would ultimately result in the physical ability to *autonomously
    execute* an action.^([²](#fn2)) All the AI today, including generative AI, are
    not considered AGI. Although they come close, even advanced personal assistants
    like Siri and Alexa are not considered AGI.


    In the area of decision-making, consider AlphaGo, which is a program developed
    by London-based DeepMind Technologies (now a subsidiary of Google). AlphaGo can
    play the board game Go, which is a strategic board game, at a masters level, beating
    out internationally acclaimed players. AlphaGo was later succeeded by an even
    more powerful version known as AlphaGo Zero, but what is more noteworthy is that
    this led to the creation of MuZero. MuZero is an AI program that can master games
    without knowing their rules.


    At first glance, this decision-making capability may be restricted to the context
    of games. However, it is without doubt this capability is advancing at an exponential
    rate. If you study the rules of Go, it covers concepts such as capture and territory
    growth, life and death, mutual life, and suicide. These are foundational decision-making
    attributes. Furthermore, just as children learn from play, this is no different
    for AI. Generative AI is seen as the most significant piece that brings humankind
    closest to AGI. If we were to map AI capabilities to AGI, here is where we stand
    today.


    Table 1-1


    Mapping AGI ability to current AI capabilities


    | AGI ability | AI equivalent |

    | --- | --- |

    | Natural language | Generative AI and large language models |

    | Vision | Computer Vision and DALL-E model |

    | Speech | Azure/OpenAI Whisper model |

    | Learning | *LongMem^([³](#fn3)) (augmenting LLM with long-term memory techniques)
    and algorithms such as those seen in MuZero |

    | Decision-making | *Decision recommendation systems augmented with LLM^([⁴](#fn4))
    and algorithms such as those seen in AlphaGo |

    | Autonomous execution | Azure/OpenAI functions |

    | *Theoretical/in experimentation state |


    As the gap between AGI and current AI capabilities closes, machines become more
    likely to acquire the ability to *autonomously* make decisions and carry out the
    actions *without human intervention*. The key word here is “*autonomous.”* The
    consensus of technologists and leaders in the AI field is that this line, when
    crossed, could pose a *threat* or a *benefit* to humanity. To date, AI is positioned
    as an assistant to a human. The human makes the final decision, after taking the
    recommendation of AI systems into consideration. In fact, Microsoft has named
    all the AI subsystems that augments its technology portfolio – Windows, GitHub,
    Office/Microsoft, and Security `–` as Copilots. The name is used to emphasize
    that it is there to assist, not remove, the human operator.'
  trans: '

    ### 人工智能在商业、政府和消费者领域的应用


    在第一版中，我们着重介绍了商业、政府和消费者实体的人工智能应用案例，并刻意将这三大群体进行了清晰区分。然而，仅在短短的三年内，这三个群体对人工智能的采用已显著趋同。生成式人工智能是这一趋同现象的最大推手。


    作为大型语言模型，`ChatGPT` 的显著特征是其用户界面（UI）。该界面的能力在于能够使用自然语言让模型执行任务，无需特殊的语法、格式、编程能力，甚至无需任何数据科学经验。因此，如果你使用其支持的
    40 多种语言之一向 `ChatGPT` 提问，它理应明白你的意图。


    我们将从第 2 章开始详细探讨生成式人工智能。但基于目前对生成式人工智能能够进行自然语言对话的理解，也就不难发现为何各方在利用人工智能方面会走向趋同。当 `ChatGPT`
    首次推出时，消费者纷纷涌向网站，请它生成晚餐创意、旅行路线、诗歌、信件、电子邮件、派对点子，几乎无所不包。房地产经纪人利用它来撰写房产挂牌描述，政府机构则用它快速理解和应用复杂的规章制度。商业组织用它创作广告材料和营销计划，并识别客户情绪。法律专业人士和立法者用它快速理解法律文件，并起草新法规的初稿。由于在所有应用场景中，利用这项技术所需的共同技能是自然语言沟通能力，个人的生活与职业角色因此产生了重叠。


    在合规监管方面，政府云与商业云之间的差距也开始缩小。这主要归因于云计算的成熟、对风险理解的加深，以及技术和流程的改进，使得在所有云环境中提供统一标准变得更加可行。因此，许多政府与商业应用场景的合规要求已趋于一致。例如，美国联邦风险与授权管理计划（FedRAMP）——或许是最严格的合规要求之一——如今同时适用于
    `Azure Government` 和 `Azure Commercial` 云服务。^(¹)


    ## 负责任的人工智能


    在第一版中，我们介绍了数据科学中的伦理概念，并涵盖了科幻与现实趋同等热门议题。这种趋同引发了巨大的社会变革。在硅技术对人类职业和个人生活产生重大影响的关键拐点，例如个人计算时代、互联网时代和人工智能时代，不胜枚举。你对地图技术、控制家居的电器的物联网设备以及健康数据的依赖程度如何？仅举几例。过去几年里，人工智能与我们日常生活的深度融合更是呈指数级增长。


    当时我们只用了很小篇幅讨论诸如假新闻和岗位消亡等热门话题。这些问题至今仍是隐忧，但在短短三年内，围绕人工智能对社会和人类影响的关注与忧虑，已成为比技术本身更受瞩目的话题。原因何在？是否因为越来越多的迹象表明，人工智能在*所有认知与智能维度之总和*上，正接近与人类匹敌的水平？我们相信事实的确如此，但“与人类匹敌”究竟意味着什么？让我们进一步探讨这一概念。


    ### 通用人工智能（AGI）


    通用人工智能（AGI）是一种理论上的 AI 形态，许多人认为它将是 AI 的下一个迭代。AGI 被定义为计算机做出决策和执行通常需要人类智能的任务的能力。而人类智能又被定义为推理、学习、决策、自然语言理解、视觉、语音等能力。人类所拥有的所有认知能力最终都将转化为*自主执行*行动的身体能力^(²)。当今所有的人工智能，包括生成式
    AI，都尚未被视为 AGI。即便像 `Siri` 和 `Alexa` 这样先进的个人助手，也未被归类为 AGI，尽管它们已非常接近。


    在决策领域，以 `AlphaGo` 为例。这是由总部位于伦敦的 `DeepMind Technologies`（现为 `Google` 子公司）开发的一款程序。`AlphaGo`
    能以大师级水平下围棋（一种策略棋盘游戏），击败了国际知名的选手。`AlphaGo` 后来被更强大的版本 `AlphaGo Zero` 所取代，但更值得注意的是，由此诞生了
    `MuZero`。`MuZero` 是一个无需知晓游戏规则就能掌握游戏玩法的 AI 程序。


    乍看之下，这种决策能力可能仅限于游戏情境。但毋庸置疑，这种能力正在以指数级速度发展。如果你研究过围棋规则，会发现它涵盖了提子、占地、死活、共活、自杀等概念，这些都是基础的决策属性。此外，正如儿童从游戏中学习一样，AI
    也不例外。生成式 AI 被视为使人类最接近 AGI 的最重要一环。若将 AI 能力映射到 AGI，我们当前所处的位置如下。


    **表 1-1**


    将 AGI 能力映射至当前 AI 能力


    | AGI 能力 | 对应的 AI 能力 |

    | --- | --- |

    | 自然语言 | 生成式 AI 与大型语言模型 |

    | 视觉 | 计算机视觉与 DALL-E 模型 |

    | 语音 | Azure/OpenAI Whisper 模型 |

    | 学习 | `LongMem`^(³)（通过长期记忆技术增强 LLM）以及 `MuZero` 等算法 |

    | 决策 | 结合 LLM^(⁴)的决策推荐系统以及 `AlphaGo` 等算法 |

    | 自主执行 | Azure/OpenAI 函数 |

    | *处于理论/实验阶段 |


    随着 AGI 与当前 AI 能力之间差距的缩小，机器更有可能获得*自主*决策并在*无需人工干预*下执行行动的能力。这里的关键词是“*自主*”。AI 领域的技术专家和领导者们的共识是，一旦跨越这条界线，可能对人类社会构成*威胁*或带来*福祉*。迄今为止，AI
    被定位为人类的辅助工具。人类在参考了 AI 系统的建议后，会做出最终决定。事实上，微软已将其技术体系（包括`Windows`、`GitHub`、`Office/Microsoft`和`Security`）中所有增强型的
    AI 子系统命名为 `Copilots`。这一命名旨在强调其作用是辅助而非取代人类操作者。

