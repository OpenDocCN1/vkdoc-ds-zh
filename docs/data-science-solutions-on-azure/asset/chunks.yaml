    ## Summary


    In this chapter, we learned about frameworks such as LangChain and Semantic Kernel
    to create LLM-orchestrated applications. It is best to be familiar with both frameworks,
    which is why we covered Semantic Kernel in the previous chapter and dedicated
    exercises using LangChain in this chapter..


    In our hands-on exercise for DBCopilot, we only used a database with a single
    table. However, LLMs can handle databases with multiple tables. It will be an
    interesting exercise to expand the DBCopilot.jpynb notebook and let it connect
    to a database with multiple tables and ask questions in natural language. You
    should be able to observe the ability of the LLM to create complex joins across
    tables to provide an answer to your question.


    Up until now, although we have primarily focused on unstructured data, databases
    have been part of computing history since the beginning. There is a lot of insights
    that can be unlocked now that DBCopilot Agents make data more accessible to subject
    matter experts who do not have database querying expertise.


