  trans: "\n# 最佳实践\n\n在为 AI 模型编写提示时，考虑几个关键设置以确保模型的行为符合你的期望至关重要。这些设置包括`系统消息`、`用户消息`和`助手消息`。它们在塑造交互过程中各自扮演着独特的角色。\n\
    \n- `系统消息`：为 AI 模型设定舞台并充当序幕。它为对话建立背景并设定所需的语气。\n- `用户消息`：提出问题，代表用户的输入或查询。它明确了用户正在寻求或需要帮助的内容。\n\
    - `助手消息`：提供回应，即 AI 对用户查询的回复。它由系统消息塑造，并应与最初设定的背景和语气保持一致。\n\n我们将运行我们的提示工程笔记本来理解构建有效提示的常见最佳实践，以下是每种实践的详细说明。你可以从本书的\
    \ GitHub 仓库下载该笔记本的副本，地址为[`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/Prompt-Enginnering-Samples/prompt_engineering101.ipynb`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/Prompt-Enginnering-Samples/prompt_engineering101.ipynb)。\n\
    \n![](img/501717_2_En_6_Fig1_HTML.jpg)\n\n图 6-1 – 提示工程代码示例 #1\n\n1.  **将指令放在开头：**\
    \ 通过清晰说明你想要模型做什么来开始你的提示。这有助于设定背景，并从一开始就让模型清楚地理解任务。在开头提供明确的指令可以最大限度地减少歧义，并引导模型生成所需的输出。例如，不要直接进入内容，而是以一个清晰的指令开始，比如“总结以下文本，突出主要观点”。运行笔记本的第一个单元格，如下图\
    \ 6-1 所示：\n\n![](img/501717_2_En_6_Fig2_HTML.jpg)\n\n图 6-2 – 提示工程代码示例 #2\n\n2.\
    \  **明确具体：** 清晰指定你期望模型输出的格式或结果。如下图 6-2 所示，明确的指令有助于模型更好地理解你的要求，并生成更接近你预期的响应。具体说明输出格式可以减少收到模糊或偏离目标响应的可能性。例如，与其仅仅要求一份摘要，你可以明确说明，“用\
    \ 3 句话总结这篇文章，突出关键数字。”运行第二个单元格查看输出。\n\n![](img/501717_2_En_6_Fig3_HTML.jpg)\n\n\
    图 6-3 – 提示工程代码示例 #3：正面与负面指令\n\n3.  **避免否定表述：** 如下图 6-3 所示，聚焦于正面指令，而不是告诉模型不要做什么。正面指令更容易让模型解读和遵循。否定表述有时会被模型误解或忽略，导致效果欠佳的响应。例如，与其说“不要啰嗦”，不如说“提供一个简洁的总结”。\n\
    \n![](img/501717_2_En_6_Fig4_HTML.jpg)\n\n图 6-4 – 提示工程代码示例 #4：GPT 响应\n\n从以上示例中，我们可以看到负面和正面指令的结果。负面指令“不要啰嗦，不要生成超过\
    \ 2 个句子”提供了负面焦点，告诉模型要避免什么而不是做什么，因此生成了 3 个句子。这可能存在歧义，因为模型需要从否定句中推断出正面动作。这可能导致模型误解或忽略否定，从而生成的响应可能仍然冗长。然而，正面指令“总结以下文本。提供一个简洁的总结，用\
    \ 2 个非常短的句子”提供了正面焦点，清晰陈述了期望的动作，因此根据提示引导生成了两个句子。这有助于模型准确理解期望。此类指令是清晰的指导，更容易让模型解读和遵循，从而产生更准确和相关的响应。\n\
    \n![](img/501717_2_En_6_Fig5_HTML.jpg)\n\n图 6-5 – 提示工程代码示例：少样本学习\n\n4.  **使用示例\
    \ – 少样本学习：** 这是通过利用零样本、一样本和少样本学习等技术实现的。提供预期输出的示例非常有帮助。示例为模型提供了具体的参考，精确说明了你想要什么。这可以显著提高模型生成准确和相关信息的能力。下图\
    \ 6-5 展示了一个少样本学习的例子。\n\n在上面的例子中，我们看到少样本示例如何强制执行输出行为，使其具有高度的通用性。少样本学习的工作原理如下：\n\
    \    - **使用示例进行条件设置：** 在提示中向模型提供几个示例（通常称为“样本”）。这些示例展示了给定输入的期望行为或输出。\n    - **上下文学习：**\
    \ 模型使用这些示例作为上下文，来理解如何处理新的、相似的输入。这种条件设置帮助模型从提供的示例泛化到新数据。\n    - **提示设计：** 输入提示的设计同时包含示例和新任务，从而有效引导模型如何生成预期输出。\n\
    \n少样本提示在处理需要复杂推理、多步逻辑或深度理解的任务时可能会遇到困难。模型推断复杂关系或执行高级问题解决的能力通常是有限的。这时，我们想要利用下一种技术“思维链提示”或两者的结合。\n\
    \n![](img/501717_2_En_6_Fig6_HTML.jpg)\n\n图 6-6 – 提示工程代码示例：提示链\n\n5.  **提示链或任务分解：**\
    \ 提示链可应用于涉及多个操作或转换的各种场景。通过将任务分解为更小、更易于管理的步骤，可以提升大型语言模型（LLM）的性能。例如，与其直接生成搜索查询，不如先要求模型提取相关事实，然后创建搜索查询来验证这些事实。下面的图\
    \ 6-6 展示了这样一个提示的例子。\n"
- fmt: '# Chain of Thought (CoT) Prompting


    `CoT` prompting is a technique that encourages reasoning and multi-step thinking.
    It involves providing a few sample questions and answers, followed by the actual
    question (few-shot prompt), which helps the model generate reasoning to respond
    to the prompt. This technique is a variation of the “break the task down” method.
    As shown in Figure 6-7 below, instead of just splitting a task into smaller steps,
    `CoT` prompting instructs the model to proceed step-by-step and present all the
    steps involved. This systematic approach minimizes inaccuracies and makes it easier
    to assess the model’s response. Below are some of the benefits of `CoT`:


    - **Enhanced Reasoning:** `CoT` prompting promotes logical and systematic thinking
    through problems.

    - **Reduced Errors:** Breaking tasks into smaller, manageable steps decreases
    the likelihood of mistakes.

    - **Clarity and Transparency:** A step-by-step presentation clarifies the reasoning
    process, making it easier to verify the results.

    - **Improved Learning:** This approach helps pinpoint specific areas where the
    model needs improvement, enabling targeted training.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig7_HTML.jpg)


    **Figure 6-7** — Prompt engineering code example: Chain of thought prompt


    With chain of thought prompting, models can enhance their reasoning abilities
    and produce more accurate and understandable responses. However, it does have
    following limitations:


    - **Complexity Management:** While `CoT` prompting helps with complex tasks, it
    may require more computational resources and time to process each step.

    - **Overhead:** Articulating each step can be cumbersome, especially for simpler
    tasks where a direct answer might suffice.

    - **Scalability:** For very large and intricate problems, a step-by-step approach
    might become too detailed, necessitating a balance between thoroughness and efficiency.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig8_HTML.jpg)


    **Figure 6-8** — Prompt engineering code example: Self-consistency prompt


    # Self-Consistency Prompting


    This is perhaps the more advanced prompt engineering techniques which covers diverse
    paths to generate a response compared to `CoT`’s straightforward approach of generating
    tokens. As shown in Figure 6-8 below, this method is used to improve the performance
    of few-shot `CoT` (Commonsense Transformer) models on tasks that require arithmetic
    and commonsense reasoning. It involves sampling multiple diverse reasoning paths
    through the `CoT` model and using the generated responses to select the most consistent
    answer. In this technique, the `CoT` model is prompted with a specific task or
    question that requires arithmetic or commonsense reasoning. Instead of relying
    on a single reasoning path, the model is made to generate multiple responses by
    perturbing the input or using different inference techniques. These diverse reasoning
    paths allow the model to explore different possible solutions or interpretations.


    Once the model generates these multiple responses, they are evaluated for consistency.
    The responses that are consistent with each other are considered more reliable
    and indicative of the correct answer. The most consistent response is then selected
    as the final answer. By using the self-consistency prompt technique, the performance
    of `CoT` models can be boosted on tasks involving arithmetic and commonsense reasoning.
    This approach leverages the ability of the model to generate multiple diverse
    responses and selects the most consistent one, enhancing the overall accuracy
    and reliability of the model’s predictions.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig10_HTML.jpg)


    **Figure 6-10** — Prompt engineering code example: Tree of thought


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig9_HTML.jpg)


    **Figure 6-9** — Tree of thought prompting architecture. Source: [*https://arxiv.org/pdf/2305.10601*](https://arxiv.org/pdf/2305.10601)


    # Tree of Thoughts


    Yao et al. (2023) and Long (2023) have introduced a framework called tree of thoughts
    (ToT) that addresses the limitations of traditional prompting techniques when
    dealing with complex tasks that require exploration or strategic lookahead. ToT
    builds upon the concept of chain of thought prompting and emphasizes the exploration
    of intermediate thoughts as a means of solving problems using language models.
    As shown in Figure 6-9 below, in ToT, a tree structure is maintained, where each
    node represents a coherent sequence of language (thought) that serves as an intermediate
    step toward problem-solving. This framework enables the language model (LM) to
    evaluate its progress by self-assessing the intermediate thoughts generated during
    the reasoning process. By combining the LM’s thought generation and evaluation
    capabilities with search algorithms like breadth-first search or depth-first search,
    ToT facilitates systematic exploration of thoughts with lookahead and backtracking.


    To better understand ToT, consider the example prompt shown in Figure 6-10, where
    a language model is tasked with solving a complex math problem: “Find the sum
    of the first 10 prime numbers.” In the ToT framework, the initial prompt could
    be “Generate a list of prime numbers up to a given limit.” The model would then
    generate intermediate thoughts, such as “Check if a number is prime” or “Keep
    track of the sum as prime numbers are found.” These thoughts represent coherent
    steps toward solving the ultimate problem. The model can evaluate the quality
    and relevance of these thoughts and explore different branches of the thought
    tree to find the most effective solution.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig11_HTML.jpg)


    **Figure 6-11** — Prompt engineering code example: Repeat the instruction in the
    end


    # Repeat the Instructions at the End


    Recency bias can affect models, wherein information toward the end of the prompt
    may have a stronger impact on the output compared to information at the beginning.
    To mitigate this bias, it is valuable to explore the effect of repeating instructions
    at the end of the prompt and assess its influence on the generated response. As
    shown in Figure 6-11 below, consider a prompt where the task is to generate a
    summary of a given article “Summarize the following article about climate change
    in 3 sentences in JSON format with keys- `highlight1`, `highlight2`, `highlight3`
    {article}.” To address recency bias, the prompt can be modified to include repetition
    at the end: “Summarize the following article about climate change in 3 sentences
    in JSON format with keys- `highlight1`, `highlight2`, `highlight3` {article} make
    sure to extract in JSON with keys `highlight1`, `highlight2`, `highlight3`.”


    By repeating the instruction about including key points from the article specifically
    related to climate change at the end of the prompt, the intention is to ensure
    that the model gives equal consideration to information throughout the article
    and doesn’t overly prioritize the ending. The impact of this modification can
    then be evaluated by comparing the generated response to the original prompt,
    determining if the repetition helps in reducing recency bias and generating more
    balanced summaries.


    # Iterate and Experiment


    Finally, creating effective prompts often requires a process of iteration and
    experimentation. Fine-tune your prompts based on the model’s responses and observe
    how different instructions impact the results. This iterative process helps you
    refine the prompts to better suit your needs and achieve the desired outcomes.
    Adjust your prompts based on feedback and results, experimenting with different
    wordings and instructions to see which produces the best responses.'
