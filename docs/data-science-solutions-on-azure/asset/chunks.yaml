  trans: "\n# 2023 年 11 月 17 日——疯狂的 72 小时\n\n2023 年 11 月 17 日，一个周五下午，OpenAI 董事会通过视频会议罢免了\
    \ CEO `Sam Altman⁵`，而董事会主席`Greg Brockman`并未参与此事，亦对此毫不知情。罢免消息公布后不久，`Brockman 先生`也被邀请参加视频会议，并被告知其被从董事会除名，但可继续留在公司。`Brockman\
    \ 先生`在公告发布数小时后宣布辞职以示抗议。⁶ OpenAI 这场剧变的原因被归结为董事会已对`Altman 先生`的领导能力失去信心，因为他“……在与董事会的沟通中未能始终坦诚，阻碍了董事会履行职责的能力。”\n\
    \n同一天周五下午，微软 CEO`Satya Nadella`仅在`Altman 先生`被罢免前几分钟才得到通知。尽管微软已向 OpenAI 投资 130\
    \ 亿美元，并持有其商业部门 49%的股份，是其最大投资者。其他投资者同样被蒙在鼓里，OpenAI 的员工也不例外。OpenAI 董事会进行这次“交接”的方式，引发了关于公司治理的衍生话题，成为董事会“反面教材”的典型案例，但这已超出本书的讨论范围。尽管如此，这一事件仍是\
    \ AI 历史上的关键转折点。\n\n在 24 小时内，微软、其他投资者及员工纷纷要求`Altman 先生`重返领导岗位。在历时 60 小时的`Altman\
    \ 先生`重返 OpenAI 的谈判失败后，微软随即聘用了`Altman 先生`和`Brockman 先生`。⁷ 包括管理层在内的几乎所有 OpenAI 员工都威胁要辞职，跟随`Altman\
    \ 先生`和`Brockman 先生`加入微软。最终，在 72 小时结束前，`Altman 先生`和`Brockman 先生`重返 OpenAI，除一人外，所有董事会成员均引咎辞职。\n\
    \nOpenAI 的这场闹剧凸显了拥抱 AI 的人与坚信 AI 将毁灭人类的人之间巨大的意识形态鸿沟。\n\n## 加速主义者与末日论者\n\n主张更快采纳和发展\
    \ AI 的人群被称为加速主义者。而在光谱的另一端，末日论者坚信 AI 将毁灭人类，因此主张放缓发展步伐，并加强监管、审查，划定更明确的界限来限制 AI 的侵蚀等。诚然，大多数人往往介于两者之间，但在撰写本文时，根据我们与私营机构、公共实体及民选官员的接触，我们观察到人们更倾向于末日论者的观点。在\
    \ AI 之旅中，你站在哪一边？\n\n普遍认为，微软这样的资本家与商业实体是极端加速主义者。而像直言不讳的特斯拉和 SpaceX 的`Elon Musk\
    \ 先生`这样的杰出技术领袖则是末日论者。`Sam Altman 先生`本人也曾公开宣称 AI 可能毁灭人类，并敦促政府对其进行监督和立法。他共同创立了 OpenAI，并参与设计了董事会结构——成员不从\
    \ OpenAI 获取经济利益，以确保在监管公司开发的技术时不存在利益冲突。讽刺的是，正是这个董事会罢免了他。这些行为并非加速主义者所为。\n\n然而，`Altman\
    \ 先生`也正是后来为了筹集资金推进生成式 AI 发展而创立 OpenAI 商业部门的人。OpenAI 的这一部分受益于微软及其他风险投资家的投资。该商业部门也由负责\
    \ OpenAI 非营利部分的同一个董事会管理，这一治理结构目前正受到审查，并很可能不复存在。\n\n`Altman 先生`直到被罢免前，仍在积极推广 AI\
    \ 的进步，例如提出创建支持 AI 的硬件、为开发者提供定制自己 GPT 模型的工具等。这些都不是末日论者的行为。`Altman 先生`将自己定位为 AI\
    \ 的平衡倡导者——既保持谨慎，又拥抱他眼中这项技术不可避免的演进。这或许正是他被视为我们这个时代最具影响力的技术专家以及 AI 事实上的旗手的原因。无论`Altman\
    \ 先生`是在国会作证，⁸还是与技术专家畅谈，⁹亦或是向世界及商业领袖发表演讲，¹⁰他始终是活动的焦点。\n\nOpenAI 事件之后，末日论者是否失势，而加速主义者占据了上风？其结果对我们而言是利是弊？唯一明确的答案是，这确实是一个重大的转折点，因此，对于这项技术，我们需要*强力监管，但不可避免要采纳*。\n\
    \n> *没有 AI，我们正走在自我毁灭的道路上。*\n> \n> *——萨姆·奥尔特曼*\n\n> *将降低 AI 带来的灭绝风险作为全球优先事项，与应对大流行病和核战争等其他社会层面的风险同等重要。*\n\
    > \n> *——由萨姆·奥尔特曼及顶尖 AI 科学家签署的公开信*\n"
- fmt: '### Microsoft’s Principles of Responsible AI


    Remember that we mentioned many would consider Microsoft to be an accelerationist?
    As a for profit company, it is in a race to bring AI to market, and this is being
    done by making AI the core component of the product portfolio. Through the `Copilot`
    branding, Microsoft is infusing AI in every product and service it offers. Google,
    AWS, and other technology heavyweights are pouring billions of dollars in advancing
    AI and to stay in the race. It is not one company going off and doing its own
    thing, it is the entire software industry! We will be focusing on the OpenAI GPT
    LLM models in this book, but stop and take a look at Google Bard and AWS Anthropic.
    In this three-party race alone, the amount of R&D dollars is just mind boggling.


    AI is not new to Microsoft, though. In the first edition, we covered data science,
    machine learning, and applied AI (Cognitive Services). In fact, Microsoft has
    been in the AI space since at least 2016.


    In 2016, Microsoft CEO, Satya Nadella, laid down the ten laws of AI.^([^(11)](#fn11))
    A year is an extremely long time by technical standards. However, after seven
    years, these laws have stood the test of time, demonstrating their continued *and
    growing* relevance. These laws have been, and continue to be, the foundation for
    Microsoft’s principles of responsible AI.


    Since 2016, roles, committees, and processes that ensure the responsible use of
    AI at Microsoft has been formalized and put in place. For example, the AI and
    Ethics in Engineering and Research (Aether) Committee was established and comprised
    every product group, engineering, and leadership. It is an advisory board at Microsoft
    that deliberates about questions, issues, and challenges arising with developing
    and fielding applications of AI. The Committee reports to Microsoft’s senior leadership
    team.


    In fact, prior to generative AI, there are equivalent sensitive AI technologies
    that Microsoft had to address, like facial recognition^([^(12)](#fn12)) in 2018.
    Microsoft took the initiative to urge regulators to regulate the technology and
    restrict the adoption of the technology by vetting use cases. Figure [1-1](#501717_2_En_1_Chapter.xhtml#Fig1)
    shows the roadmap of responsible adoption at Microsoft since 2016. So, although
    Microsoft is a leaning accelerationist, it is without wild abandon, and history
    is on its side to support that claim.


    ![](images/501717_2_En_1_Chapter/501717_2_En_1_Fig1_HTML.jpg)


    **Figure 1-1** Microsoft’s responsible AI journey


    Microsoft has a site dedicated to the company’s AI principles at [`https://www.microsoft.com/en-us/ai/responsible-ai`](https://www.microsoft.com/en-us/ai/responsible-ai).
    In 2020, we wrote that Microsoft is a leader in charge to ensure ethics are deeply
    engrained in the development of AI technologies. The most important aspect of
    Microsoft’s AI principles is that it applies to AI at scale since the technology
    is built into every service and shared across its entire portfolio.


    ## Current and Ongoing Societal Issues


    Generative AI’s debut date is less than a year, at the time of writing. But societal
    issues borne from AI has been around since 2016. Most of these issues are not
    going away, and some have become elevated because of generative AI.


    Remember that generative AI’s strength is in natural language. Prior to generative
    AI, natural language processing is the sole domain of a human. Now with generative
    AI, the issues that become most prominent are the ones that impact people’s livelihoods.


    ### Job Elimination


    It is an accepted fact that the ability to be fluent is a key to success in the
    workplace, regardless of profession. However, there may be jobs that are more
    dependent on this ability than others, for example, authors, writers, and reporters.
    Some of these roles do generate original content, whereas there are many that
    just modify existing content. For example, administrative assistants may summarize
    meeting notes or create an executive summary from longer source content. Research
    assistants may search for multiple sources of content, select the ones that are
    relevant, and then compile those into a report.


    Original content creators perceive generative AI as competition. They are also
    concerned that because generative AI models may be trained with existing literary
    content, there is an inherent violation of intellectual property.


    Furthermore, content is not just merely written works. With generative AI models
    such as `DALL-E` that can process and create images, the impact is now expanded
    to images. Therefore, the threat to jobs extends to artists, photographers, designers,
    and any job that relies heavily on visual content creation.


    This has led to strikes and lawsuits. The Hollywood writers’ strike led to studios
    agreeing to put in place guardrails^([^(13)](#fn13)) against AI-generated content.


    ### Intellectual Property (IP)


    This is uncharted territory for the legal system as well. Because generative AI
    models are trained on literary works, does any content derived from the models
    infringe on intellectual property? There is already legal precedent when the US
    Copyright Office ruled that images created by AI will not be protected by copyright
    laws because copyright laws apply only to content that has been created by humans.^([^(14)](#fn14))
    Whatever source content that may be used in the creation of the content is unclear.
    Even though this may be unclear, it should not be mistaken for the lack of transparency
    of which sources are part of the model being used to generate the content. Part
    of Microsoft’s principles for responsible AI is the transparency note for Azure
    OpenAI.^([^(15)](#fn15)) This note provides insight into the data sources and
    training methods for the AI models.


    Consider this analogy – a person’s educational journey involves studying materials
    that already exist in topics like literature, science, programming languages,
    algorithms, and art, etc. Everything that is part of a well-rounded education.
    Any original content that this person creates is based on her/his education. If
    it is not outright plagiarism, it will be like trying to determine whether the
    original works that one creates infringes on IP because of his or her education.


    It is interesting to note the determination of the US Copyright Office in the
    case mentioned above that the decision was revisited and subsequently revised
    to include protection for “*the text and author’s instructions to AI, but not
    the artwork the AI had produced.*”


    The instructions to AI are known as prompt engineering, which we will discuss
    in detail in later chapters. What the US Copyright Office has determined is that
    prompts are subject to copyright protection.


    In September 2023, Microsoft became the first company to provide customers protection
    against legal action stemming from the use of its AI technology when generating
    content. This is known as the Copilot Copyright Commitment^([^(16)](#fn16)) for
    customers. The commitment states that if a “*third party sues a commercial customer
    for copyright infringement for using Microsoft’s Copilots or the output they generate,
    we will defend the customer and pay the amount of any adverse judgments or settlements
    that result from the lawsuit, as long as the customer used the guardrails and
    content filters we have built into our products.*”'
