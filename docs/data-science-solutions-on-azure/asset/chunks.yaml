- fmt: '### Techniques


    We will discuss from basics of prompt engineering to advanced techniques and see
    some great examples applied on few use cases. But before we dive into prompt engineering,
    let’s understand some of the key parameters that effect the GPT response significantly,
    and with some experimentation, most use cases can figure out proper settings.
    When designing and testing prompts, interactions with an LLM typically occur via
    an API, where several configurable parameters can influence the responses. Here
    are the common parameters used in API call to GPT model:


    When designing and testing prompts, interactions with a large language model (LLM)
    typically occur via an API, where several configurable parameters can influence
    the responses. Adjusting these settings is essential for enhancing the reliability
    and desirability of outputs, and it often requires experimentation to determine
    the best configuration for specific use cases. Here are the common settings you’ll
    encounter, along with examples:


    1. **Temperature:** Controls the randomness of the model’s output. Lower values
    make results more deterministic by selecting the highest probable next token,
    suitable for fact-based QA. Higher values introduce randomness, beneficial for
    creative tasks like poem generation. Example:


    **Low Temperature (0.2):** For fact-based QA, where you want concise and accurate
    answers. Prompt: “What is the capital of France?”


    **Response:** “The capital of France is Paris.”


    **High Temperature (0.8):** For creative tasks, encouraging diverse and imaginative
    responses. Prompt: “Write a poem about the sea.”


    **Response:** “The sea, a vast and endless dream, where waves dance and seagulls
    scream.”


    2. **Top-p (Nucleus Sampling):** Controls the determinism of the model. A low
    Top-p value selects the most confident responses, ideal for exact answers. A high
    Top-p value considers more tokens, leading to diverse outputs. Typically, adjust
    either temperature or Top-p, not both. Example:


    **Low Top-p (0.2):** For exact and factual answers.


    **Prompt:** “Describe the process of photosynthesis.”


    **Response:** “Photosynthesis is the process by which green plants use sunlight
    to synthesize foods with carbon dioxide and water.”


    **High Top-p (0.9):** For more diverse responses.


    **Prompt:** “Tell me a story about a hero.”


    **Response:** “Once upon a time, in a land far away, there was a hero named Aria
    who could talk to animals and control the elements.”


    3. **Max Length:** Limits the number of tokens generated, helping to prevent overly
    long or irrelevant responses and control costs. Example:


    **Short Max Length (50 Tokens):** To keep responses brief.


    **Prompt:** “Summarize the plot of ‘Romeo and Juliet’.”


    **Response:** “Romeo and Juliet is a tragedy about two young lovers whose deaths
    ultimately reconcile their feuding families.”


    **Long Max Length (200 Tokens):** For detailed explanations.


    **Prompt:** “Explain the theory of relativity.”


    **Response:** “The theory of relativity, developed by Albert Einstein, encompasses
    two interrelated theories: special relativity and general relativity. Special
    relativity applies to all physical phenomena in the absence of gravity. General
    relativity explains the law of gravitation and its relation to other forces of
    nature. It is a theory of gravitation that is also a theory of spacetime, describing
    the gravitational force as the curvature of spacetime caused by the presence of
    mass.”


    4. **Stop Sequences:** Strings that halt token generation, useful for controlling
    response length and structure. Example:


    **Stop Sequence (“11”):** To limit list items.


    **Prompt:** “List 10 fruits.”


    **Response:** “1. Apple 2. Banana 3. Orange 4. Grape 5. Pineapple 6. Mango 7.
    Peach 8. Cherry 9. Strawberry 10. Blueberry” (generation stops before “11”)


    5. **Frequency Penalty:** Reduces the likelihood of repeated words by penalizing
    tokens based on their frequency. Example:


    **High Frequency Penalty (1.0):** To minimize word repetition.


    **Prompt:** “Describe a beautiful garden.”


    **Response:** “The garden is filled with colorful flowers, lush green plants,
    and the melodious songs of various birds. A gentle breeze carries the sweet fragrance
    of blooming roses and jasmine.”


    **Low Frequency Penalty (0.0):** Allows for more repetition.


    **Prompt:** “Describe a beautiful garden.”


    **Response:** “The garden is beautiful with beautiful flowers and beautiful trees.
    The beautiful birds sing beautiful songs.”


    6. **Presence Penalty:** Applies a uniform penalty to repeated tokens, preventing
    the model from overusing phrases. Higher values encourage diversity, while lower
    values maintain focus. Example:


    **High Presence Penalty (1.0):** To encourage diversity in the response.


    **Prompt:** “Describe a beautiful garden.”


    **Response:** “The garden is a serene oasis with vibrant flowers, tall trees,
    and a variety of plants. Butterflies flutter around, and birds chirp from the
    branches. A small pond reflects the blue sky, and the scent of fresh blooms fills
    the air.”


    **Low Presence Penalty (0.0):** Allows for repetition, maintaining focus.


    **Prompt:** “Describe a beautiful garden.”


    **Response:** “The garden is beautiful with flowers, trees, and plants. The flowers
    are beautiful, the trees are tall, and the plants are lush. It’s a beautiful,
    beautiful garden.”


    Now that we understand how tweaking above parameters can change GPT response,
    let’s understand the best practices and types of prompt Engineering.'
