    # 2. 理解大语言模型


    如第 1 章所述，AI 最重大的发展是生成式 AI 的引入。正如之前承诺的，我们将全面审视生成式 AI。在此过程中，我们将学习新的术语和概念。完成本章后，你应该能够参与关于生成式
    AI 如何帮助组织实现转型的讨论。


    ## 大语言模型


    在生成式 AI 领域，有多种可选的 LLM。以下是最受欢迎的几种：


    - `OpenAI` GPT 模型

    - `Microsoft Azure OpenAI` GPT 模型

    - `Anthropic` 和 `AWS Claude`

    - `Google Gemini`（原名 `Bard`）

    - `Hugging Face`

    - `Llama 2`


    这些 LLM 在许多方面存在差异，例如准确性、接地性、可处理数据量以及理解和生成内容的能力。这些概念和术语将在本章中介绍，但由于本书侧重于 `Microsoft
    Azure`，我们仅会在 `OpenAI` GPT 模型中探讨这些概念。不过，以下是当前可用不同类型 LLM 的总体概述。


    ### OpenAI 和微软 GPT 模型


    来自 `OpenAI` 和 `Microsoft Azure` 的 GPT 模型是*完全相同的*。两家公司的合作方式如下：微软向 `OpenAI` 提供财务和计算基础设施，作为回报，微软有权在其产品（例如
    `Microsoft 365 Copilot`）中使用 GPT 模型，并在 `Azure` 中提供这些模型，供开发人员和科学家用于他们的自定义项目。最广为人知的
    `OpenAI` 模型（21）如下：


    - `GPT-3.5 Turbo`

    - `GPT-4`

    - `GPT-4 Turbo with Vision`

    - `GPT-4 Whisper`

    - `DALL-E`


    `OpenAI` 模型按类型、上下文窗口和版本进行组织，如下图所示 2-1。上表是模型类型。当我们将上下文窗口和版本也包含进来时，列表将如下所示：


    ![](img/501717_2_En_2_Fig1_HTML.jpg)


    **图 2-1** 模型、上下文窗口和版本


    - `GPT-3.5 Turbo (4k) 0613`

    - `GPT-3.5 Turbo (4k) 1106`

    - `GPT-3.5 Turbo (4k) 0125`

    - `GPT-4 (8k) 0613`

