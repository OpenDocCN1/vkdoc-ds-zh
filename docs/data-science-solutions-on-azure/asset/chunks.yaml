    2.  Click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figk_HTML.jpg), select
    “Quick Training” and click “Train”.


    3.  Training may take a few minutes, but once it is done, click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figl_HTML.jpg).


    4.  Click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figm_HTML.jpg) and select
    an image from the hardhat-test-dataset folder and click “Open”.


    5.  The model is now being used to analyze the image that you have selected, and
    the results are shown as regions in the image as well as the probability of each
    tagged region, as shown in Figure [9-14](#501717_2_En_9_Chapter.xhtml#Fig14).


    1.  Repeat step 22 for other test images to see the results.


    Now that you have tested the model, it is time to publish and use the model.


    ### Hands-On Exercise 9-3: Publishing the Model


    ![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig15_HTML.jpg)


    Figure 9-15


    Publishing a model to an endpoint


    1.  As shown in Figure [9-15](#501717_2_En_9_Chapter.xhtml#Fig15), click on “Performance”,
    then click “Publish”, and give the model a name. Select the Azure Custom Vision
    instance that was created in Exercise 9-1, step 7, and then click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Fign_HTML.jpg).


    ![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig16_HTML.jpg)


    Figure 9-16


    URL, header, and body for the model endpoint


    1.  The ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figo_HTML.jpg) option will
    become available after the model is published. Click on it.


    2.  Take note of the instructions on how to make the call to the endpoint and
    pass it a URL to an image to be analyzed or the actual image as the payload, as
    shown in Figure [9-16](#501717_2_En_9_Chapter.xhtml#Fig16) below.


    ![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig17_HTML.jpg)


    Figure 9-17


    Using Postman to test the model endpoint


    1.  Next, we need to find a URL to an image. Search the Internet for an image
    of people and hard hats. When you have found an image you would like to pass to
    the model for evaluation, copy that URL. For example, we found this image: [`https://media.sciencephoto.com/image/f0187039/800wm/F0187039-Construction_workers_eating_lunch.jpg`](https://media.sciencephoto.com/image/f0187039/800wm/F0187039-Construction_workers_eating_lunch.jpg),
    and you can use this URL if the link is still valid. Otherwise, search for your
    own sample image.


    2.  Construct a POST request in Postman as shown in Figure [9-17](#501717_2_En_9_Chapter.xhtml#Fig17),
    and then click ![](images/501717_2_En_9_Chapter/501717_2_En_9_Figp_HTML.jpg).
    Use the URL from step 4 above.


    1.  Analyze the results from the POST response.


    2.  For now, copy the entire JSON output from the response and paste it into a
    lightweight text editor like Notepad or Notepad++. We will use this JSON in another
    exercise in the next section.


    ## Combining AI Services


    When building AI solutions, it is not uncommon to combine AI services. There are
    three main scenarios that AI services are combined:


    *   By “chaining” services together


    *   Leveraging Azure OpenAI’s natural language and LLM capabilities


    *   Augmenting and enhancing Azure OpenAI LLMs with specific AI services


    ### Chaining AI Services


    As its name implies, the chaining of AI services is to use multiple AI services
    in a workstream. The concept is simple – one AI service’s output becomes the input
    of another AI.'
