    In this exercise, we fine-tuned a base model with a custom dataset. Continue testing
    it with additional questions from the dataset, and tweak the system message with
    prompt engineering techniques you learned at the beginning of this chapter. Remember
    that because this is a small dataset and we did not adjust any parameters, you
    may still encounter inaccurate responses, but that is where the iterative fine-tuning
    process comes in. The model is now a custom model that you need to incorporate
    as part of your model development lifecycle in MLOps.


    ### Hands-On Exercise 6-4: Cleanup Unneeded Resources


    Fine-tuning will incur costs in terms of tokens consumed, but that is a one-time
    cost for each fine-tuning job. However, deployment of a model endpoint is an ongoing
    cost in terms of hosting the model, unless you are hosting the model on your own
    compute^([^(77)](#fn77)). In this exercise, we used a serverless endpoint for
    ease of not having to manage a compute infrastructure. Therefore, if you no longer
    need a model endpoint, make sure to delete the endpoint or you will incur ongoing
    costs.


    Do note that by deleting the model endpoint, it *does not* delete the fine-tuned
    model, and in most cases, we do not want to do so anyway. That is because we may
    need the model for additional fine-tuning. ***But since we had to deploy a model
    to an endpoint in order to test it, we need to remember to delete all unused endpoints.***


