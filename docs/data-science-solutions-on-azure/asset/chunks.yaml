  trans: "\n### 技巧\n\n我们将从提示工程的基础知识讨论到高级技巧，并通过几个用例来观察一些出色的实际应用。但在深入探讨提示工程之前，让我们先了解一下那些会显著影响\
    \ GPT 响应的关键参数。通过一些实验，大多数用例都能找到合适的设置。在设计并测试提示时，与大型语言模型（LLM）的交互通常是通过 API 进行的，其中有几个可配置的参数能够影响响应结果。以下是调用\
    \ GPT 模型时常用的参数：\n\n在设计并测试提示时，与大型语言模型（LLM）的交互通常通过 API 进行，多个可配置的参数会影响响应结果。调整这些设置对于增强输出的可靠性和期望性至关重要，并且通常需要经过实验才能确定特定用例的最佳配置。以下是你将遇到的一些常见设置及其示例：\n\
    \n1.  **温度：** 控制模型输出的随机性。较低的值通过选择最高概率的下一个标记来使结果更具确定性，适用于基于事实的问答。较高的值会引入随机性，有利于诗歌生成等创意性任务。示例：\n\
    \n    **低温度（0.2）：** 适用于基于事实的问答，你需要简洁准确的答案。提示语：“法国首都是哪里？”\n\n    **回复：** “法国首都是巴黎。”\n\
    \n    **高温度（0.8）：** 适用于创意性任务，鼓励多样化和富有想象力的回复。提示语：“写一首关于大海的诗。”\n\n    **回复：** “大海，一个广阔无垠的梦，那里波浪起舞，海鸥长鸣。”\n\
    \n2.  **Top-p（核采样）：** 控制模型的确定性。较低的 Top-p 值会选择最自信的回复，适用于需要精确答案的情况。较高的 Top-p 值会考虑更多标记，从而产生多样化的输出。通常，只需调整温度或\
    \ Top-p 中的一个，不必两者都调。示例：\n\n    **低 Top-p（0.2）：** 用于精确、事实性的答案。\n\n    **提示语：**\
    \ “描述光合作用的过程。”\n\n    **回复：** “光合作用是绿色植物利用阳光，以二氧化碳和水为原料合成有机物的过程。”\n\n    **高 Top-p（0.9）：**\
    \ 用于更多样化的回复。\n\n    **提示语：** “给我讲一个关于英雄的故事。”\n\n    **回复：** “从前，在一个遥远的国度，有一位名叫艾莉亚的英雄，她能跟动物说话，还能操控元素。”\n\
    \n3.  **最大长度：** 限制生成的标记数量，有助于避免生成过长或不相关的回复，并控制成本。示例：\n\n    **短最大长度（50 个标记）：**\
    \ 用于保持回复简洁。\n\n    **提示语：** “概括《罗密欧与朱丽叶》的情节。”\n\n    **回复：** “《罗密欧与朱丽叶》是一部悲剧，讲述了两个年轻恋人的死亡最终化解了家族世仇的故事。”\n\
    \n    **长最大长度（200 个标记）：** 用于详细的解释。\n\n    **提示语：** “解释相对论。”\n\n    **回复：** “相对论由阿尔伯特·爱因斯坦提出，包含两个相互关联的理论：狭义相对论和广义相对论。狭义相对论适用于没有引力的所有物理现象。广义相对论解释了万有引力定律及其与自然界其他力的关系。它不仅是一个引力理论，也是一个时空理论，将引力描述为质量引起的时空弯曲。”\n\
    \n4.  **停止序列：** 能够中止标记生成的字符串，用于控制回复长度和结构。示例：\n\n    **停止序列（“11”）：** 用于限制列表项。\n\
    \n    **提示语：** “列出 10 种水果。”\n\n    **回复：** “1. 苹果 2. 香蕉 3. 橙子 4. 葡萄 5. 菠萝 6. 芒果\
    \ 7. 桃子 8. 樱桃 9. 草莓 10. 蓝莓”（生成在“11”处停止）\n\n5.  **频率惩罚：** 通过对重复出现的标记进行惩罚来降低单词重复的可能性。示例：\n\
    \n    **高频惩罚（1.0）：** 用于最小化单词重复。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园里开满了五颜六色的花朵，绿植茂盛，各种鸟儿歌声悦耳。微风吹来，带着盛开的玫瑰和茉莉花的芬芳香气。”\n\
    \n    **低频惩罚（0.0）：** 允许更多重复。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园很美丽，有美丽的花朵和美丽的树木。美丽的鸟儿唱着美丽的歌。”\n\
    \n6.  **存在惩罚：** 对重复出现的标记施加统一惩罚，防止模型过度重复某些短语。较高的值鼓励多样性，较低的值则保持内容聚焦。示例：\n\n    **高存在惩罚（1.0）：**\
    \ 用于鼓励回复的多样性。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：** “花园是一个宁静的绿洲，有鲜艳的花朵、高大的树木和各种植物。蝴蝶翩翩起舞，鸟儿在枝头啁啾。一个小池塘倒映着蓝天，清新的花香弥漫在空气中。”\n\
    \n    **低存在惩罚（0.0）：** 允许重复，保持内容聚焦。\n\n    **提示语：** “描述一个美丽的花园。”\n\n    **回复：**\
    \ “花园很美丽，有花、树和植物。花儿很美，树很高，植物很茂盛。这是一个非常非常美丽的花园。”\n\n了解了上述参数如何改变 GPT 的响应后，让我们来了解一下提示工程的最佳实践和类型。\n"
- fmt: "# Best Practices\n\nWhen crafting prompts for AI models, it’s essential to\
    \ consider several key settings to ensure the model’s behavior aligns with your\
    \ expectations. These settings include the `System Message`, `User Message`, and\
    \ `Assistant Message`. Each serves a distinct role in shaping the interaction.\n\
    \n- `System Message`: Setting the stage and acts as the prologue for the AI model.\
    \ It establishes context and sets the desired tone for the conversation.\n- `User\
    \ Message`: Asking the question and represents the input or query from the user.\
    \ It specifies what the user is seeking or needs help with.\n- `Assistant Message`:\
    \ Providing the response and AI’s reply to the user’s query. It is shaped by the\
    \ system message and should align with the context and tone set initially.\n\n\
    We will run our prompt engineering notebook to understand common best practices\
    \ for constructing an effective prompt, and below is detailed explanation of each\
    \ practice. You can download a copy of this notebook at the book’s GitHub repository\
    \ located at [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/Prompt-Enginnering-Samples/prompt_engineering101.ipynb`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/Prompt-Enginnering-Samples/prompt_engineering101.ipynb).\n\
    \n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig1_HTML.jpg)\n\nFigure 6-1\
    \ – Prompt engineering code example #1\n\n1.  **Put Instructions at the Beginning:**\
    \ Start your prompt by clearly stating what you want the model to do. This helps\
    \ set the context and provides the model with a clear understanding of the task\
    \ right from the beginning. Providing explicit instructions at the start minimizes\
    \ ambiguity and guides the model toward producing the desired output. For example,\
    \ instead of diving straight into the content, begin with a clear directive like\
    \ “Summarize the following text, highlighting the main point.” Run the first cell\
    \ of notebook as shown in Figure 6-1 below:\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig2_HTML.jpg)\n\
    \nFigure 6-2 – Prompt engineering code example #2\n\n2.  **Be Explicit:** Clearly\
    \ specify the desired format or output you expect from the model. As shown in\
    \ Figure 6-2 below, explicit instructions help the model understand your requirements\
    \ better and produce responses that are closer to what you envision. Being specific\
    \ about the output format reduces the chances of receiving a vague or off-target\
    \ response. For example, rather than just asking for a summary, you could specify,\
    \ “Summarize the article in 3 sentences, highlighting the key figures.” Run the\
    \ second cell to see the output.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3 – Prompt engineering code example #3: Positive and negative instructions\n\
    \n3.  **Avoid Negations:** As shown in Figure 6-3 below, focus on positive instructions\
    \ instead of telling the model what not to do. Positive instructions are easier\
    \ for the model to interpret and follow. Negations can sometimes be misunderstood\
    \ or ignored by the model, leading to less effective responses. For example, instead\
    \ of saying, “Don’t be verbose,” you could say, “Provide a concise summary.”\n\
    \n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig4_HTML.jpg)\n\nFigure 6-4\
    \ – Prompt engineering code example #4: GPT response\n\nFrom the above examples,\
    \ we can see the results of negative and positive instructions. Negative instruction\
    \ “Don’t be verbose and Don’t generate more than 2 sentences” provides a negative\
    \ focus and tells the model what to avoid rather than what to do, hence generates\
    \ 3 sentences. This can be ambiguous as the model needs to infer the positive\
    \ action from the negation. This leads to potential misinterpretation or ignore\
    \ the negation, which leads to the response that may still be verbose. However,\
    \ a positive instruction “Summarize the following text. Provide a concise summary\
    \ with 2 very short sentences” provides positive focus and clearly states the\
    \ desired action and hence generates two sentences as guided in prompt. This helps\
    \ the model understand exactly what is expected. Such instructions are clear guidance\
    \ and are easier for the model to interpret and follow, leading to more accurate\
    \ and relevant responses.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig5_HTML.jpg)\n\
    \nFigure 6-5 – Prompt engineering code example: Few-shot learning\n\n4.  **Use\
    \ Examples – Few-Shot Learning:** This is done leveraging techniques like zero\
    \ shot, one shot, and few-shot learning. Providing examples of the expected output\
    \ can be very helpful. Examples act as concrete references for the model, illustrating\
    \ exactly what you are looking for. This can significantly improve the model’s\
    \ ability to generate accurate and relevant response. Figure 6-5 below shows an\
    \ example of few-shot learning.\n\nIn the above example, we see how few shots\
    \ examples enforced the output behavior making it highly versatile. How few-shot\
    \ learning works:\n    - **Conditioning with Examples:** The model is provided\
    \ with a few examples (often called “shots”) within the prompt. These examples\
    \ demonstrate the desired behavior or output for given inputs.\n    - **In-Context\
    \ Learning:** The model uses these examples as context to understand how to handle\
    \ new, similar inputs. This conditioning helps the model generalize from the provided\
    \ examples to new data.\n    - **Prompting:** The input prompt is designed to\
    \ include both the examples and the new task, effectively guiding the model on\
    \ how to generate the expected output.\n\nFew-shot prompting may struggle with\
    \ tasks that require sophisticated reasoning, multi-step logic, or deep comprehension.\
    \ The model’s ability to deduce intricate relationships or perform advanced problem-solving\
    \ is often limited. That’s when we want to leverage next technique “chain of thought\
    \ prompting” or combination of both.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig6_HTML.jpg)\n\
    \nFigure 6-6 – Prompt engineering code example: Prompt chaining\n\n5.  **Prompt\
    \ Chaining or Breaking the Tasks:** Prompt chaining can be applied in various\
    \ scenarios that involve multiple operations or transformations. The performance\
    \ of large language models (LLMs) is improved by breaking down tasks into smaller,\
    \ more manageable steps. For example, instead of directly generating search queries,\
    \ the model can first be asked to extract relevant facts and then create search\
    \ queries to verify those facts. Figure 6-6 below shows an example of such a prompt."
