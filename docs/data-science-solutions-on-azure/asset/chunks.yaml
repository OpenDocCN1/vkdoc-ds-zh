  trans: "\n# 语义搜索引擎的工作原理\n\n语义搜索引擎利用一系列统称为自然语言处理（`NLP`）和机器学习（`ML`）的先进技术。\n\n## 1.\
    \ 向量搜索\n\n语义搜索的核心是向量搜索，它将文本转换为数值向量。通过使用`K-近邻（KNN）`算法，它能够匹配代表与查询内容相似的向量。这种方法能根据上下文和意图，提升相关内容的排序与呈现效果。\n\
    \n## 2. 实体识别\n\n实体识别是指识别并分类查询中的关键组成部分，例如人物、地点、组织、产品和日期。这有助于语义搜索引擎理解查询的具体主题，从而得出更精确的结果。例如，它能够区分公司`苹果`和水果苹果。\n\
    \n## 3. 上下文理解\n\n上下文理解涉及通过分析所使用的词语、搜索历史和趋势，来解读查询背后的含义和意图。这有助于语义搜索引擎消除歧义，提高搜索结果的准确性。\n\
    \n### 自然语言处理（`NLP`）\n\n语义搜索引擎利用`NLP`来理解人类撰写查询的自然方式，这些查询可能是对话式的或复杂的。`NLP`能够分解句子、解读语言并生成相关的响应。\n\
    \n## 4. 知识图谱\n\n知识图谱是一种数据库，它利用相互连接的实体及其关系网络来理解和组织信息。通过以图谱形式呈现现实世界的实体及其联系，这些图谱帮助语义搜索引擎理解查询中提及的实体之间的关系。这能产生更细致的搜索结果，反映现实世界中的概念关联。例如，通过检查实体连接，知识图谱可以帮助搜索引擎理解“巴拉克·奥巴马”与“美国总统”及“米歇尔·奥巴马”有关联。\n\
    \n在下方的知识图谱中，您可以检查节点与实体的关系，并回答如下问题（下文图 4-8 展示了该知识图谱）。\n\n![](img/501717_2_En_4_Fig8_HTML.jpg)\n\
    \n**图 4-8** – 《哈利·波特》书籍转化为的知识图谱。来源：[*https://neo4j.com/developer-blog/turn-a-harry-potter-book-into-a-knowledge-graph/*](https://neo4j.com/developer-blog/turn-a-harry-potter-book-into-a-knowledge-graph/)\n\
    \n> **问：** 哈利·波特在霍格沃茨的朋友有哪些？\n> \n> **答：** 赫敏·格兰杰和罗恩·韦斯莱。两人都是哈利·波特的朋友，并就读于霍格沃茨魔法学校。\n\
    \n## 5. 机器学习\n\n机器学习是人工智能的一个子集，它允许系统从数据中学习、识别模式并在最少人类干预下做出决策。在语义搜索的语境中，机器学习算法通过分析用户的搜索、交互和反馈，不仅能确定用户想要什么，还能持续提升搜索结果的相关性。通过从过去的用户搜索中学习，语义搜索引擎能更好地预测用户意图，即使查询含糊或不完整。\n\
    \n语义搜索在生成式 AI 中至关重要，因为它超越了单纯的信息检索，能够生成与用户意图和上下文相符的内容。例如，如果用户想根据特定主题创作一个故事，AI 必须在语义上理解该主题，才能生成相关且连贯的叙述。语义搜索真正引领着我们与信息交互方式的范式转变，从基于关键词的检索，转向与数据之间更细致、以意图为导向的对话。生成式\
    \ AI 模型（如 OpenAI 的`GPT`系列）的进步，显著增强了语义理解能力，使用户与 AI 之间的交互更加自然且具有上下文相关性。\n\n图 4-9\
    \ 是对集成了`LLM`的语义搜索过程的分步解释。\n\n![](img/501717_2_En_4_Fig9_HTML.jpg)\n\n**图 4-9**\
    \ – 带有`LLM`的语义搜索检索系统\n\n## 分步过程\n\n### 1. 用户提交查询\n\n流程始于用户在系统中输入搜索查询。  \n**示例：**\
    \ 用户在搜索栏中输入“纽约最好的意大利餐厅”。  \n**目标：** 捕捉用户的信息需求并启动搜索过程。\n\n### 2. 分析意图与上下文\n\n大语言模型（`LLM`）分析查询，以理解用户的意图以及查询背后的上下文。\
    \  \n**示例：** `LLM`识别出用户正在寻找位于纽约的意大利餐厅推荐。  \n**目标：** 解读词语背后的含义，考虑用户历史、位置和查询结构等因素。\n\
    \n### 3. 提取意图与关系\n\n语义搜索系统处理查询，以确定各个词语之间的关系以及整体含义。  \n**示例：** 系统识别出“意大利餐厅”是一种餐饮场所，“纽约”是一个地点。\
    \  \n**目标：** 识别查询中的关键实体及其关系，确保更深入地理解用户请求。\n\n### 4. 返回意图与关系\n\n提取出的意图和关系被发送回`LLM`。\
    \  \n**示例：** 系统发送数据，表明用户对特定地理区域（纽约）的餐饮场所（意大利餐厅）感兴趣。  \n**目标：** 为`LLM`提供反映用户真实意图的结构化信息。\n\
    \n### 5. 检索相关数据\n\n`LLM`利用已理解的意图来检索与查询相关的数据。  \n**示例：** `LLM`查询数据库或外部来源，以获取纽约意大利餐厅的信息。\
    \  \n**目标：** 收集一组与用户搜索意图相符的潜在匹配项。\n\n### 6. 基于相关性排序数据\n\n排序算法评估从向量数据库中检索到的数据，并根据其与查询的相关性进行排序。\
    \  \n**示例：** 算法根据用户评论、评分、距离和人气等因素对餐厅进行排序。  \n**目标：** 优先展示最相关、质量最高的结果，使其最佳匹配用户查询。\n\
    \n### 7. 返回排序结果\n\n排序后的结果随后被发送回`LLM`。  \n**示例：** 系统编译一份按相关性排序的纽约顶级意大利餐厅列表。  \n\
    **目标：** 准备最终的搜索结果集，以便呈现给用户。\n\n### 8. 呈现生成的内容/输出\n\n最后，`LLM`将生成的内容或搜索结果呈现给用户，完成语义搜索过程。\
    \  \n**示例：** 用户看到一份推荐的纽约意大利餐厅列表，包含评论、评分和其他相关详细信息。  \n**目标：** 提供一组用户友好、信息丰富的搜索结果，满足用户需求。\n\
    \n---\n\n## 挑战与最佳实践\n\n尽管语义搜索在信息检索领域取得了显著进展，但它并非没有挑战。其结果质量取决于查询的清晰度。用户在搜索请求中提供的细节越多，获得准确结果的可能性就越高。例如，如果用户仅搜索“纽约”，很难确定其具体意图。他们是计划旅行、寻找附近的餐厅，还是想看一场音乐剧？然而，通过输入更具体的查询，如“纽约音乐剧门票”，搜索引擎就能提供更具相关性和针对性的信息。\n"
- fmt: "# 排版后的内容\n\nEssentially, complex or ambiguous queries can sometimes lead to\
    \ misinterpretations or incomplete results. Overcoming these obstacles requires\
    \ continuous refinement of algorithms to ensure optimal performance. Overall,\
    \ semantic search offers users a more intuitive and personalized search experience\
    \ by combining linguistic understanding with real-world knowledge. This fusion,\
    \ aided by machine learning advancements in vector search, allows search engines\
    \ to anticipate our needs before we even express them, paving the way for a more\
    \ efficient and proactive Search Engine.\n\n## Exploring Vector Search\n\nExploring\
    \ the realm of vector search reveals an intriguing landscape dominated by the\
    \ principles of machine learning. At its heart, vector search utilizes advanced\
    \ algorithms to convert raw data into meaningful representations called vectors.\
    \ These vectors act as multidimensional coordinates, capturing the essence of\
    \ information and facilitating a greater comprehension of context and relationships\
    \ within datasets. At its core, machine learning plays a crucial role, powering\
    \ the intelligent retrieval of information. By training models on extensive datasets,\
    \ machines learn to encode complex concepts into compact vector formats. These\
    \ vectors capture semantic meanings and relationships, enabling algorithms to\
    \ efficiently and precisely navigate through vast amounts of information. Figure\
    \ [4-10](#501717_2_En_4_Chapter.xhtml#Fig10) below is an example of word embeddings.\n\
    \n![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig10_HTML.jpg)\n\nFigure 4-10\n\
    \nWord embeddings\n\nVector search represents a significant advancement over traditional\
    \ search engines, which primarily relied on matching keywords within the text.\
    \ Traditional search engines would preprocess text through various steps like\
    \ normalizing terms, expanding queries, and using lists of synonyms to better\
    \ match the search intent with the content. These techniques were developed to\
    \ tackle the problem of semantic similarity, where different words or phrases\
    \ might express similar ideas. For example, in traditional search engines, if\
    \ a user searched for the term “fried fish,” the system might struggle to associate\
    \ it directly with related terms like “ocean” or “fishing rod” unless explicitly\
    \ programmed with synonyms or through advanced natural language processing techniques.\n\
    \nVector search, on the other hand, utilizes concepts from machine learning, particularly\
    \ embeddings, to transform text into vectors (numerical representations in a high-dimensional\
    \ space). Each vector captures the semantic meaning of the text, rather than just\
    \ the presence of specific words. This approach allows the search engine to understand\
    \ and relate concepts at a deeper level. Thus, when a vector search engine processes\
    \ a query, it converts the query text into a vector and compares it to the vectors\
    \ of other texts in its database. This comparison is typically based on the cosine\
    \ similarity between vectors. So, even if the words are different but the underlying\
    \ ideas are similar — as with “fried fish” and “fishing rod” — the vector search\
    \ can effectively match these texts. This results in a more intuitive, context-aware\
    \ search experience that better aligns with user intent.\n\nVector search significantly\
    \ improves several crucial capabilities. Let’s understand what those are:\n\n\
    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig11_HTML.jpg)\n\nFigure 4-11\n\
    \nWords representation in vector space\n\n1.  **Similarity Search**:\n\n    Traditional\
    \ search engines often struggle to find documents that are contextually related\
    \ because they mainly rely on keyword matching. For instance, if you search for\
    \ articles on “climate change effects,” a traditional search might return documents\
    \ that mention these exact words. However, with vector search, the system understands\
    \ the semantic meaning and can retrieve documents that discuss related topics\
    \ like “global warming impacts” or “rising sea levels,” even if the exact search\
    \ terms aren’t used. This method provides more accurate and relevant results by\
    \ analyzing the context rather than just the words.\n\n2.  **Question Answering**:\n\
    \n    Consider a scenario where someone asks, “What causes heart attacks?” Without\
    \ medical training, they might not use professional jargon such as “myocardial\
    \ infarction.” In a vector-based system, the phrases “heart attacks” and “myocardial\
    \ infarction” would be represented by similar vectors because they share a contextual\
    \ relationship. Hence, the system could accurately answer the question using more\
    \ accessible language, bridging the gap between expert terminology and everyday\
    \ language. This approach is more effective than traditional keyword searches\
    \ that might miss the connection between differently phrased but related concepts.\n\
    \n3.  **Multilingual Search**:\n\n    Traditional methods often require separate\
    \ text analysis systems for each language, which is both costly and labor-intensive.\
    \ With a multilingual vector-based model, a query in one language can retrieve\
    \ relevant documents in another without direct translation. For example, a search\
    \ in Spanish for “energía renovable” (renewable energy) could successfully pull\
    \ up relevant documents written in English about solar panels or wind turbines,\
    \ thanks to a shared underlying representation of semantic content across languages.\n\
    \n4.  **Multimodality**:\n    1.  In a multimodal search scenario, different types\
    \ of data, such as text and images, can be queried simultaneously. For example,\
    \ using a vector-based approach, a query like “show me pictures of tropical beaches”\
    \ could analyze both the text and the visual content of images to find matches.\
    \ This is achieved by converting features of images into vectors that can be compared\
    \ directly with text vectors, allowing for a more integrated and efficient search\
    \ across media types that wasn’t possible before with traditional search technologies.\
    \ Figure [4-11](#501717_2_En_4_Chapter.xhtml#Fig11) is a word representation in\
    \ vector space.\n\nHere’s how vector search databases generally operate:\n\n1.\
    \  **Vector Embeddings Generation:** Initially, data items are transformed into\
    \ vector representations through embedding techniques. For instance, images might\
    \ be converted into vectors using techniques like convolutional neural networks\
    \ (CNNs), while text documents might be represented through word or sentence embeddings.\
    \ These embeddings essentially capture the essential features of the data in a\
    \ numerical form that can be processed computationally.\n\n    **Example:** Consider\
    \ a database of movie descriptions. Each movie description is converted into a\
    \ vector using a sentence embedding method. This vector captures the thematic\
    \ and narrative nuances of the description, rather than just isolated keywords.\n\
    \n2.  **Indexing and Querying:**\n    *   **Indexing:** After generation, these\
    \ vectors are organized into a searchable index using various techniques designed\
    \ for efficient retrieval, like k-d trees, ball trees, or approximate nearest\
    \ neighbor (ANN) algorithms. These structures help in optimizing the search by\
    \ narrowing down the candidate list for potential matches based on the vector\
    \ properties.\n\n    *   **Querying:** When a user performs a search, the query\
    \ (e.g., a text snippet about a movie plot) is also converted into a vector using\
    \ the same embedding technique. The search engine then looks through the indexed\
    \ vectors to find those that are most similar to the query vector.\n\n    **Example:**\
    \ A user queries “a young wizard battles dark forces,” which is also converted\
    \ into a vector. The search database then compares this vector to the indexed\
    \ vectors of movie descriptions using a distance metric (like cosine similarity),\
    \ identifying which movies have descriptions most similar to the query.\n\n3.\
    \  **Retrieving and Ranking:** The movies whose description vectors are closest\
    \ to the query vector are deemed most relevant. These vectors are ranked based\
    \ on their similarity scores, and the top results are returned to the user."
