- fmt: "# How a Semantic Search Engine Works\n\nA semantic search engine leverages\
    \ a suite of advanced techniques grouped as natural language processing (`NLP`)\
    \ and machine learning (`ML`).\n\n## 1. Vector Search\n\nThe core of semantic\
    \ search is vector search, which converts text into numerical vectors. Using the\
    \ `K-Nearest Neighbor (KNN)` algorithm, it matches vectors representing content\
    \ similar to the query. This method enhances the ranking and delivery of relevant\
    \ content based on context and intent.\n\n## 2. Entity Recognition\n\nEntity recognition\
    \ identifies and categorizes key components of a query, such as people, places,\
    \ organizations, products, and dates. This helps semantic search engines understand\
    \ the specific subject of a query, leading to more accurate results. For instance,\
    \ it can distinguish between the company `Apple` and the fruit apple.\n\n## 3.\
    \ Contextual Understanding\n\nContextual understanding involves interpreting the\
    \ meaning and intent behind a query by considering the words used, the search\
    \ history, and trends. This helps semantic search engines resolve ambiguities\
    \ and improve the accuracy of search results.\n\n### Natural Language Processing\
    \ (`NLP`)\n\nSemantic search engines leverage `NLP` to comprehend how humans naturally\
    \ write queries, which may be conversational or complex. `NLP` breaks down sentences,\
    \ interprets language, and generates relevant responses.\n\n## 4. Knowledge Graphs\n\
    \nKnowledge graphs are databases that use a network of interconnected entities\
    \ and their relationships to understand and organize information. Representing\
    \ real-world entities and their connections in a graph format, these graphs help\
    \ semantic search engines comprehend the relationships between entities mentioned\
    \ in a query. This results in more nuanced search outcomes that reflect real-world\
    \ concept relationships. For instance, by examining entity connections, a knowledge\
    \ graph can help a search engine understand that “Barack Obama” is related to\
    \ “The President of the United States” and “Michelle Obama.”\n\nIn the below knowledge\
    \ graph, you can examine the node and entities relationship and answer questions\
    \ like (Figure 4-8 below shows the knowledge graph)\n\n![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig8_HTML.jpg)\n\
    \n**Figure 4-8** – Harry Potter book turned into knowledge graph. Source: [*https://neo4j.com/developer-blog/turn-a-harry-potter-book-into-a-knowledge-graph/*](https://neo4j.com/developer-blog/turn-a-harry-potter-book-into-a-knowledge-graph/)\n\
    \n> **Ques:** Who are the friends of Harry Potter who attend Hogwarts?\n> \n>\
    \ **Answer:** Hermione Granger and Ron Weasley. Both are friends with Harry Potter\
    \ and attend Hogwarts School of Witchcraft and Wizardry.\n\n## 5. Machine Learning\n\
    \nMachine learning, a subset of AI, allows systems to learn from data, recognize\
    \ patterns, and make decisions with minimal human intervention. In the context\
    \ of semantic search, machine-learning algorithms analyze user searches, interactions,\
    \ and feedback to not only determine what is desired but also to continuously\
    \ enhance the relevance of search results. By learning from past user searches,\
    \ a semantic search engine can better predict user intent, even when queries are\
    \ vague or incomplete.\n\nSemantic search is crucial in generative AI, as it goes\
    \ beyond merely retrieving information to generating content that aligns with\
    \ the user’s intent and context. For instance, if a user wants to create a story\
    \ based on a particular theme, the AI must semantically understand that theme\
    \ to produce a relevant and coherent narrative. Semantic search is truly leading\
    \ a paradigm shift in how we interact with information, moving from keyword-based\
    \ retrieval to a more nuanced, intent-driven dialogue with data. The advancement\
    \ of generative AI models, such as OpenAI’s `GPT` series, has significantly enhanced\
    \ semantic understanding, enabling more natural and contextually relevant interactions\
    \ between users and AI.\n\nFigure 4-9 is a step-by-step explanation of the semantic\
    \ search process integrated with `LLM`.\n\n![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig9_HTML.jpg)\n\
    \n**Figure 4-9** – Semantic search retrieval system with `LLM`\n\n## Step-by-Step\
    \ Process\n\n### 1. User Submits Query\n\nThe process begins when the user enters\
    \ a search query into the system.  \n**Example:** A user types “Best Italian restaurants\
    \ in New York” into the search bar.  \n**Objective:** To capture the user’s information\
    \ need and initiate the search process.\n\n### 2. Analyze Intent and Context\n\
    \nThe large language model (`LLM`) analyzes the query to understand the user’s\
    \ intent and the context behind the query.  \n**Example:** The `LLM` identifies\
    \ that the user is looking for recommendations for Italian restaurants located\
    \ in New York.  \n**Objective:** To interpret the meaning behind the words, considering\
    \ factors like user history, location, and query structure.\n\n### 3. Extract\
    \ Intent and Relationships\n\nThe semantic search system processes the query to\
    \ determine the relationships between the terms and the overall meaning.  \n**Example:**\
    \ The system recognizes “Italian restaurants” as a type of dining establishment\
    \ and “New York” as a location.  \n**Objective:** To identify key entities and\
    \ their relationships within the query, ensuring a deeper understanding of the\
    \ user’s request.\n\n### 4. Return Intent and Relationships\n\nThe extracted intent\
    \ and relationships are sent back to the `LLM`.  \n**Example:** The system sends\
    \ data indicating that the user is interested in dining establishments (Italian\
    \ restaurants) in a specific geographic area (New York).  \n**Objective:** To\
    \ provide the `LLM` with structured information that reflects the user’s true\
    \ intent.\n\n### 5. Retrieve Relevant Data\n\nThe `LLM` uses the understood intent\
    \ to retrieve data that is relevant to the query.  \n**Example:** The `LLM` queries\
    \ a database or external sources for information on Italian restaurants in New\
    \ York.  \n**Objective:** To gather a list of potential matches that align with\
    \ the user’s search intent.\n\n### 6. Rank Data Based on Relevance\n\nA ranking\
    \ algorithm evaluates the retrieved data from a vector database, ranking it according\
    \ to its relevance to the query.  \n**Example:** The algorithm ranks the restaurants\
    \ based on factors like user reviews, ratings, proximity, and popularity.  \n\
    **Objective:** To prioritize the most relevant and high-quality results that best\
    \ match the user’s query.\n\n### 7. Return Ranked Results\n\nThe ranked results\
    \ are then sent back to the `LLM`.  \n**Example:** The system compiles a list\
    \ of top Italian restaurants in New York, ordered by relevance.  \n**Objective:**\
    \ To prepare the final set of results for presentation to the user.\n\n### 8.\
    \ Present Generated Content/Output\n\nFinally, the `LLM` presents the generated\
    \ content or search results to the user, completing the semantic search process.\
    \  \n**Example:** The user sees a list of recommended Italian restaurants in New\
    \ York, complete with reviews, ratings, and other relevant details.  \n**Objective:**\
    \ To deliver a user-friendly and informative set of search results that meets\
    \ the user’s needs.\n\n---\n\n## Challenges and Best Practices\n\nWhile semantic\
    \ search has made significant advancements in information retrieval, it is not\
    \ without its challenges. The quality of its results depends on the clarity of\
    \ the query. The more details users provide in their search requests, the higher\
    \ the likelihood of receiving accurate results. For instance, if a user simply\
    \ searches for “New York,” it is difficult to determine their specific intent.\
    \ Are they planning a trip, looking for nearby restaurants, or interested in attending\
    \ a musical play? However, by entering a more specific query like “New York tickets\
    \ musical plays,” the search engine can provide more relevant and targeted information."
