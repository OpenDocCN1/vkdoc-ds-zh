    .NET。此时，笔记本中的代码将正确格式化并着色，因为 IntelliSense 已处于正确的上下文中。

    2. 在第一个代码块中，输入您的 Azure OpenAI 端点、部署名称和 API 密钥，如您在之前的练习中所做的那样，如下方图 7-21 所示。

    3. 现在依次运行笔记本中的每个代码块。笔记本中有足够的注释，您可以跟随操作。请注意插件是如何被导入并随后用于生成所需的营销信函和收件人信息的。


    ### 规划器与函数调用


    一旦您拥有多个插件（这在许多（即便不是全部）实际应用中很可能会出现），就需要 LLM 知晓这些插件，并能够将它们组合使用以完成请求或任务。


    Semantic Kernel 引入了规划器的概念，允许 LLM 使用不同的插件。规划器使用提示词请求 AI 选择要调用哪个函数。


    然而，更新版本的 OpenAI 模型（0613 版及以上）具备原生调用函数的能力，这被称为函数调用。因此，Semantic Kernel 正在演进，将函数调用作为规划和执行任务的主要方式。尽管
    Semantic Kernel 仍然支持规划器，但其他 AI 模型（如 Gemini、Claude 和 Mistral）也支持函数调用作为原生能力，这使得
    Semantic Kernel 中的函数调用成为一项可跨多种模型使用的功能。因此，建议将 Semantic Kernel 中的函数调用作为规划和执行任务的主要方法^(⁸⁸)。


    鉴于这一发展，我们将不介绍规划器，而是重点关注函数调用。如果您使用的是不支持函数调用的旧模型，可以了解规划器及其向函数调用的演进过程；这里有一个很好的[资源](https://devblogs.microsoft.com/semantic-kernel/migrating-from-the-sequential-and-stepwise-planners-to-the-new-handlebars-and-stepwise-planner/)
    ^(⁸⁹)，来自 Microsoft 开发者博客，涵盖了这一内容。


    #### 自动函数调用


    函数调用仅仅是 AI 模型原生调用函数的一种方式。函数调用的一个扩展——称为自动函数调用——是指 LLM 能够理解哪些函数可用于不同任务，并随后将其作为知识的一部分来响应请求。


    描述自动函数调用的一个好方法是将其与“后续问题或后续操作”场景联系起来。这些场景涉及的任务请求需要先进行澄清性问题或操作之后才能执行。


    **示例 1：后续问题（基于聊天的场景）**


    用户：请给我最近客户服务地点的电话号码


    LLM：您在哪里？


    用户：我在西雅图。


    LLM：我在西雅图有几个地点。以下是地址 – ...


    **示例 2：后续操作（自动化场景）**


    用户：请打开所有灯


    LLM：思考过程 = *找到所有灯，选择当前关闭的灯，识别关闭的灯的名称，打开它们，向用户报告所有灯现在都已打开，并且具体打开的灯是 x、y 和 z。*


    在上述两个示例中，要执行后续问题或后续操作，需要迭代逻辑（例如，循环），直到获取执行任务所需的所有信息。自动函数调用为您处理了这一点。

