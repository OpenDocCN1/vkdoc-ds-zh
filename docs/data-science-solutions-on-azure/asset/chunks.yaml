    #### 版本


    模型的版本号即其发布日期的标注。例如，`0613`代表 6 月 13 日，`1106`代表 11 月 6 日，`0125`代表 1 月 25 日。除`0125`外，其他日期/版本均属于
    2023 年。以`0125`为例，它对应的是 2024 年。如果 2024 年 6 月再发布一个新版本（假设为 6 月 5 日），则版本号`0605`可能看起来比`0613`更旧，但实际上两者相隔一年，因此`0605`本应是最新版本。此外，不熟悉这些模型的人无法仅从编号判断`0125`是新是旧，因为从数字上看它似乎早于`0613`。这种编号方式仅对持续关注模型发布顺序的人有意义。


    #### 上下文窗口大小


    模型的上下文窗口决定了单次请求中它能处理的最大提示内容。提示（prompt）是向大语言模型（LLM）提出的自然语言问题，其长度通过**词元**（token）数量来衡量，我们将在本章后续详细讨论。目前只需知道，模型的词元数量越多，它能处理的文本量就越大。上下文窗口可以小至`GPT-3
    Turbo`模型的`4k`（4000 个词元），也可以大到`GPT-4 Turbo`模型的`128k`（128,000 个词元）。


    #### OpenAI 还是微软


    当选择使用 GPT 模型时，由于在微软或 OpenAI 平台上使用并无差异，因此选择哪个平台通常取决于您是否已在 Azure 中使用其他微软服务。


    企业机构通常更青睐微软，因为其拥有强大且广泛的企业级产品组合。例如，`Azure OpenAI`的应用程序编程接口（API）端点可通过`专用终结点`和`API
    管理（APIM）`等原生 Azure 服务进行保护。作为 Azure 服务，`Azure OpenAI`还可以通过`Log Analytics`进行日志记录和监控。将整个应用程序或解决方案部署在
    Azure 云中，更便于管理和监控。


    微软独有的另一项优势是在主权云中提供 Azure 服务。主权云是为特定主权国家构建的 Azure 实例，用于隔离此类服务，这可能是满足监管合规的要求。例如，美国就设有主权云^(²²)。位于美国
    Azure 政府云中的`Azure OpenAI`服务符合 FedRAMP 标准，可用于联邦政府常要求的敏感工作负载。


    ### Anthropic 与 AWS Claude


    Anthropic 是一家成立于 2021 年的 AI 公司，创始团队来自 OpenAI 的前高级成员。2023 年 9 月，AWS 投资了 Anthropic。Anthropic
    的生成式 AI 模型名为`Claude`，AWS 将其称为基础模型（FM）。


    AWS 提供了一个名为`AWS Bedrock`的全托管前端服务，该服务是连接一系列基础模型的 API 网关。下图 2-2 展示了来自不同 AI 提供商的若干基础模型。


    ![](img/501717_2_En_2_Fig2_HTML.jpg)


    图 2-2

    通过 Amazon Bedrock 服务可选择的基础模型（FM）


    ### Google Gemini


    Google 的生成式 AI 服务名为`Gemini`，是一套内部开发的大语言模型套件。尽管 Google 也投资了 Anthropic，但它并未像 AWS
    那样提供`Claude`服务。Google 对 Anthropic 的投资似乎是其通过资助微软和 OpenAI 的竞争对手来平衡竞争格局战略的一部分。


    `Gemini`曾多次登上新闻头条。2024 年 2 月，Google[宣布`Gemini 1.5`](https://developers.googleblog.com/2024/02/gemini-15-available-for-private-preview-in-google-ai-studio.html)^(²³)将拥有
    100 万个词元的上下文窗口。但紧接着，由于该模型的图像生成能力产生了历史上不准确甚至不恰当的图片，Google 不得不[将`Gemini`下线](https://www.cnbc.com/2024/02/26/googles-gemini-ai-picture-generator-to-relaunch-in-a-few-weeks.html)^(²⁴)。这场争议极为激烈，以至于在要求更换
    Google 领导层的呼声日益高涨之际，Google 首席执行官不得不公开道歉。


    另一个持续困扰 Google 云服务的问题是其在隐私方面的立场，这源于其广告业务。当有报道称 Google 将存储客户对话记录时，这一担忧也延伸到了`Gemini`。查阅`Gemini`的[隐私中心](https://support.google.com/gemini/answer/13594961#privacy_notice)^(²⁵)可以发现，对话记录默认在您的
    Google 帐户中存储 18 个月，但您可以将其修改为 3 到 36 个月，或直接关闭。如果您不关闭此功能，Google 可能会审查这些对话记录。被审查的对话记录会在您的
    Google 帐户之外单独保存长达三年，正因如此，这些对话无法被删除。


    ### Hugging Face


    Hugging Face 成立于 2016 年，是一家致力于服务 AI 社区的法国家 AI/ML 公司。该公司提供了一个由工具、数据集、模型和代码组成的平台，帮助数据科学家、开发者和爱好者将其应用于项目，并推动
    AI 和 ML 领域的发展。


