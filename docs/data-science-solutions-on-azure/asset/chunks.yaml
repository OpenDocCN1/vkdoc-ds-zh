- fmt: "### Automatic Function Calling in Chat Completion\n\nFigure [7-22](#501717_2_En_7_Chapter.xhtml#Fig22)^([^(90)](#fn90))\
    \ below illustrates how Semantic Kernel facilitates Automatic Function Calling.\
    \ When functions via templates or in the code are exposed to the kernel, it serializes\
    \ the functions and presents them to the LLM.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig22_HTML.jpg)\n\
    \n**Figure 7-22** How Semantic Kernel facilitates function calling\n\nSerialization\
    \ is a built-in capability of the kernel, and the serialized functions enable\
    \ the LLM to understand the functions and any parameters required by the functions.\n\
    \nWhen a user makes a request, the serialized functions, together with the chat\
    \ history, and the current request are all sent to the LLM. With all this information,\
    \ the LLM can follow-up with clarifying questions, if needed, or invoke functions\
    \ to carry out the task. The result is then returned to the user.\n\n### Hands-On\
    \ Exercise 7-3: Semantic Kernel with Automatic Function Calling and Chat Completion\n\
    \nFor this exercise, we used `GPT-4o`, although you can use any Azure OpenAI model\
    \ that is version `0125` or later.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig23_HTML.jpg)\n\
    \n**Figure 7-23** Added the `InventoryPlugins` and `SalesPlugins`\n\n1.  Deploy\
    \ the `GPT-4o` or any model that is version `0125` or later if you do not already\
    \ have one deployed.\n2.  Create a new folder for this project.\n3.  Copy the\
    \ [folder named `prompt_template_samples`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-7/exercise-7-3/prompt_template_samples)^([^(91)](#fn91))\
    \ from the cloned copy of the [repo](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-1/Program.cs).^([^(92)](#fn92))\n\
    4.  Launch VS Code and in the IDE’s explorer tab, and click ![](images/501717_2_En_7_Chapter/501717_2_En_7_Figc_HTML.jpg).\n\
    5.  Navigate to the folder you created in step 2 above and select it by clicking\
    \ on ![](images/501717_2_En_7_Chapter/501717_2_En_7_Figd_HTML.jpg).\n6.  Click\
    \ on **View** in the menu bar and select **Terminal** so the terminal window is\
    \ exposed in the IDE.\n7.  Create a new .NET console application (see Figure [7-4](#501717_2_En_7_Chapter.xhtml#Fig4)\
    \ in Hands-On Exercise 7-1).\n8.  Install the `Microsoft.SemanticKernel` NuGet\
    \ package (see Figure [7-6](#501717_2_En_7_Chapter.xhtml#Fig6) in Hands-On Exercise\
    \ 7-1).\n9.  Open `Program.cs`, and replace the \"Hello World\" code with the\
    \ code from `Program.cs` located in the [repo for Chapter 7 Hands-On Exercise\
    \ 7-3](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-3/Program.cs).^([^(93)](#fn93))\n\
    10.  Replace the variables for `azureEndpoint`, `model`, and `apiKey` with values\
    \ from your Azure OpenAI deployment.\n11.  Save all the files.\n12.  Let us explore\
    \ the prompt template samples. In the `prompt_template_samples` folder, we see\
    \ the same email plugin (`EmailPlugin`) from Exercise 7-2. There are two more\
    \ plugins for inventory (`InventoryPlugins`) and sales (`SalesPlugins`) that we\
    \ have added, as shown in Figure [7-23](#501717_2_En_7_Chapter.xhtml#Fig23) below.\n\
    \n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig24_HTML.jpg)\n\n**Figure 7-24**\
    \ Build and run the code for exercise-7-3\n\n1.  Examine the `skprompt.txt` and\
    \ `config.json` files in these plugins to understand the respective prompts for\
    \ the functions in these plugins.\n    - The `skprompt.txt` for the `get_inventory`\
    \ function includes a hardcoded list of inventory items. This is to simplify the\
    \ exercise, so we can focus on the concepts of Automatic Function Calling. In\
    \ the real world, this function will be replaced with values from a database (see\
    \ Chapter [8](#501717_2_En_8_Chapter.xhtml) and DBCopilot).\n2.  In the **Terminal**\
    \ window, build and run the solution by using the `dotnet build` and `dotnet run`\
    \ commands as shown in Figure [7-24](#501717_2_En_7_Chapter.xhtml#Fig24) below.\n\
    \n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig25_HTML.jpg)\n\n**Figure 7-25**\
    \ Sample conversation with the LLM leveraging Semantic Kernel and Automatic Function\
    \ Calling\n\n1.  Have a conversation^([^(94)](#fn94)) with the agent. A sample\
    \ conversation is shown in Figure [7-25](#501717_2_En_7_Chapter.xhtml#Fig25).\
    \ Remember that because we are dealing with an LLM and possibly different models,\
    \ the responses you get may be different. But what's most important is that you\
    \ experience the \"follow-up questions\" type of interaction.\n\nUsing the conversation\
    \ above as an example, here are the key features that we explored in this exercise:\n\
    \n- When the request is ambiguous, the LLM will request for more information.\n\
    \    - For example, when clarifying what types of merchandise the user is requesting\
    \ for, the specific cookware, etc.\n- Automatic Function Calling in the LLM allows\
    \ Semantic Kernel to invoke the correct functions without the need to develop\
    \ complex logic.\n    - Notice how Semantic Kernel was able to grab only items\
    \ camping from `get_inventory` in `InventoryPlugins` and add that to an order\
    \ via the `AddToCart` function in `SalesPlugins`?\n\n### Best Practices When Creating\
    \ Functions\n\nSince serialization of functions is being sent to the LLM during\
    \ chat completions, there are best practices that can improve the performance\
    \ and the quality of the completions.\n\n#### Verbosity of Function Schema\n\n\
    Serialization takes up tokens. Therefore, more verbose schema requires more tokens,\
    \ which would slow down the response time. Keep functions as simple as possible\
    \ and use function names that are self-explanatory because that can help eliminate\
    \ the need to provide a description for the function.\n\n#### Parameters\n\nSpecify\
    \ parameters that are needed in the function. Likewise, hide unneeded parameters\
    \ if they are not needed by the model.\n\nAlso specify the parameter types, which\
    \ can help the model be more accurate in its response. Where possible, avoid using\
    \ `string` as a parameter type because the model cannot infer parameters of type\
    \ `string`. Use `int`, `float`, or complex types where possible.\n\n#### Function\
    \ Description\n\nProviding a description for the function is optional, but by\
    \ doing so, it may help improve the LLM's ability to understand the capability\
    \ of the function. However, as mentioned above, this can also be accomplished\
    \ by using self-explanatory function names, which is recommended. If the function\
    \ name is self-explanatory, you can omit providing a function description.\n\n\
    #### Plugin Name\n\nAs mentioned, plugins are a collection of functions. However,\
    \ the plugin and its name are used as a namespace property for the functions.\
    \ Therefore, multiple functions of the same name can exist in different plugins,\
    \ and each of those functions, despite having the same name, can have different\
    \ capabilities. For example, a function named `search` can exist in multiple plugins,\
    \ each responsible for executing search in different context or location.\n\n\
    In the exercises and examples, we use \"plugins\" as part of the name. This is\
    \ done intentionally to reinforce the concept. However, in practice, remove these\
    \ superfluous words because this will help reduce the verbosity of the schema.\n\
    \n### Loading Plugins in Code\n\nWe have been using `skprompt.txt` prompt templates\
    \ and the corresponding `config.json` files to define plugins and functions. These\
    \ can also be defined inline together with the code."
  raw: "### Automatic Function Calling in Chat Completion\n\nFigure [7-22](#501717_2_En_7_Chapter.xhtml#Fig22)^([^(90)](#fn90))\
    \ below illustrates how Semantic Kernel facilitates Automatic Function Calling.\
    \ When functions via templates or in the code are exposed to the kernel, it serializes\
    \ the functions and presents them to the LLM.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig22_HTML.jpg)\n\
    \nFigure 7-22\n\nHow Semantic Kernel facilitates function calling\n\nSerialization\
    \ is a built-in capability of the kernel, and the serialized functions enable\
    \ the LLM to understand the functions and any parameters required by the functions.\n\
    \nWhen a user makes a request, the serialized functions, together with the chat\
    \ history, and the current request are all sent to the LLM. With all this information,\
    \ the LLM can follow-up with clarifying questions, if needed, or invoke functions\
    \ to carry out the task. The result is then returned to the user.\n\n#### Hands-On\
    \ Exercise 7-3: Semantic Kernel with Automatic Function Calling and Chat Completion\n\
    \nFor this exercise, we used GPT-4o, although you can use any Azure OpenAI model\
    \ that is version 0125 or later.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig23_HTML.jpg)\n\
    \nFigure 7-23\n\nAdded the InventoryPlugins and SalesPlugins\n\n1.  Deploy the\
    \ GPT-4o or any model that is version 0125 or later if you do not already have\
    \ one deployed.\n\n2.  Create a new folder for this project.\n\n3.  Copy the [folder\
    \ named “prompt_​template_​samples”](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-7/exercise-7-3/prompt_template_samples)^([^(91)](#fn91))\
    \ from the cloned copy of the [repo](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-1/Program.cs).^([^(92)](#fn92))\n\
    \n4.  Launch VS Code and in the IDE’s explorer tab, and click ![](images/501717_2_En_7_Chapter/501717_2_En_7_Figc_HTML.jpg).\n\
    \n5.  Navigate to the folder you created in step 2 above and select it by clicking\
    \ on ![](images/501717_2_En_7_Chapter/501717_2_En_7_Figd_HTML.jpg).\n\n6.  Click\
    \ on View in the menu bar and select Terminal so the terminal window is exposed\
    \ in the IDE.\n\n7.  Create a new .Net console application (see Figure [7-4](#501717_2_En_7_Chapter.xhtml#Fig4)\
    \ in Hands-On Exercise 7-1).\n\n8.  Install the Microsoft.SemanticKernel nuGet\
    \ package (see Figure [7-6](#501717_2_En_7_Chapter.xhtml#Fig6) in Hands-On Exercise\
    \ 7-1).\n\n9.  Open Program.cs, and replace the “Hello World” code with the code\
    \ from Program.cs located in the [repo for Chapter 7 Hands-On Exercise 7-3](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-3/Program.cs).^([^(93)](#fn93))\n\
    \n10.  Replace the variables for azureEndpoint, model, and apiKey with values\
    \ from your Azure OpenAI deployment.\n\n11.  Save all the files.\n\n12.  Let us\
    \ explore the prompt template samples. In the prompt_template_samples folder,\
    \ we see the same email plugin (EmailPlugin) from Exercise 7-2\\. There are two\
    \ more plugins for inventory (InventoryPlugins) and sales (SalesPlugins) that\
    \ we have added, as shown in Figure [7-23](#501717_2_En_7_Chapter.xhtml#Fig23)\
    \ below.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig24_HTML.jpg)\n\n\
    Figure 7-24\n\nBuild and run the code for exercise-7-3\n\n1.  Examine the skprompt.txt\
    \ and config.json files in these plugins to understand the respective prompts\
    \ for the functions in these plugins.\n    1.  The skprompt.txt for the get_inventory\
    \ function includes a hardcoded list of inventory items. This is to simplify the\
    \ exercise, so we can focus on the concepts of Automatic Function Calling. In\
    \ the real world, this function will be replaced with values from a database (see\
    \ Chapter [8](#501717_2_En_8_Chapter.xhtml) and DBCopilot).\n\n2.  In the Terminal\
    \ window, build and run the solution by using the “dotnet build” and “dotnet run”\
    \ commands as shown in Figure [7-24](#501717_2_En_7_Chapter.xhtml#Fig24) below.\n\
    \n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig25_HTML.jpg)\n\nFigure 7-25\n\
    \nSample conversation with the LLM leveraging Semantic Kernel and Automatic Function\
    \ Calling\n\n1.  Have a conversation^([^(94)](#fn94)) with the agent. A sample\
    \ conversation is shown in Figure [7-25](#501717_2_En_7_Chapter.xhtml#Fig25).\
    \ Remember that because we are dealing with an LLM and possibly different models,\
    \ the responses you get may be different. But what’s most important is that you\
    \ experience the “follow-up questions” type of interaction.\n\nUsing the conversation\
    \ above as an example, here are the key features that we explored in this exercise:\n\
    \n*   When the request is ambiguous, the LLM will request for more information.\n\
    \    *   For example, when clarifying what types of merchandise the user is requesting\
    \ for, the specific cookware, etc.\n\n*   Automatic Function Calling in the LLM\
    \ allows Semantic Kernel to invoke the correct functions without the need to develop\
    \ complex logic.\n    *   Notice how Semantic Kernel was able to grab only items\
    \ camping from get_inventory in InventoryPlugins and add that to an order via\
    \ the AddToCart function in SalesPlugins?\n\n### Best Practices When Creating\
    \ Functions\n\nSince serialization of functions is being sent to the LLM during\
    \ chat completions, there are best practices that can improve the performance\
    \ and the quality of the completions.\n\n#### Verbosity of Function Schema\n\n\
    Serialization takes up tokens. Therefore, more verbose schema requires more tokens,\
    \ which would slow down the response time. Keep functions as simple as possible\
    \ and use function names that are self-explanatory because that can help eliminate\
    \ the need to provide a description for the function.\n\n#### Parameters\n\nSpecify\
    \ parameters that are needed in the function. Likewise, hide unneeded parameters\
    \ if they are not needed by the model.\n\nAlso specify the parameter types, which\
    \ can help the model be more accurate in its response. Where possible, avoid using\
    \ string as a parameter type because the model cannot infer parameters of type\
    \ string. Use int, float, or complex types where possible.\n\n#### Function Description\n\
    \nProviding a description for the function is optional, but by doing so, it may\
    \ help improve the LLM’s ability to understand the capability of the function.\
    \ However, as mentioned above, this can also be accomplished by using self-explanatory\
    \ function names, which is recommended. If the function name is self-explanatory,\
    \ you can omit providing a function description.\n\n#### Plugin Name\n\nAs mentioned,\
    \ plugins are a collection of functions. However, the plugin and its name are\
    \ used as a namespace property for the functions. Therefore, multiple functions\
    \ of the same name can exist in different plugins, and each of those functions,\
    \ despite having the same name, can have different capabilities. For example,\
    \ a function named search can exist in multiple plugins, each responsible for\
    \ executing search in different context or location.\n\nIn the exercises and examples,\
    \ we use “plugins” as part of the name. This is done intentionally to reinforce\
    \ the concept. However, in practice, remove these superfluous words because this\
    \ will help reduce the verbosity of the schema.\n\n## Loading Plugins in Code\n\
    \nWe have been using skprompt.txt prompt templates and the corresponding config.json\
    \ files to define plugins and functions. These can also be defined inline together\
    \ with the code."
  trans: "\n### 聊天补全中的自动函数调用\n\n下图 7-22^(⁹⁰) 展示了 Semantic Kernel 如何实现自动函数调用。当通过模板或代码中的函数暴露给内核时，内核会将这些函数序列化，并呈现给大语言模型（LLM）。\n\
    \n![](img/501717_2_En_7_Fig22_HTML.jpg)\n\n**图 7-22** Semantic Kernel 如何实现函数调用\n\
    \n序列化是内核的一项内置功能，序列化后的函数使 LLM 能够理解这些函数及其所需的任何参数。\n\n当用户发出请求时，序列化后的函数、聊天历史记录以及当前请求都会一起发送给\
    \ LLM。有了这些信息，LLM 可以在必要时提出澄清性问题，或者调用函数来执行任务。结果随后会返回给用户。\n\n### 动手实验 7-3：具有自动函数调用功能的\
    \ Semantic Kernel 与聊天补全\n\n在本实验中，我们使用了 `GPT-4o`，但您也可以使用任何 `0125` 或更高版本的 Azure\
    \ OpenAI 模型。\n\n![](img/501717_2_En_7_Fig23_HTML.jpg)\n\n**图 7-23** 添加了 `InventoryPlugins`\
    \ 和 `SalesPlugins`\n\n1.  如果尚未部署 `GPT-4o` 或任何 `0125` 或更高版本的模型，请先进行部署。\n2.  为此项目创建一个新文件夹。\n\
    3.  将名为 [`prompt_template_samples` 的文件夹](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-7/exercise-7-3/prompt_template_samples)^(⁹¹)\
    \ 从克隆后的[仓库](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-1/Program.cs)^(⁹²)副本中复制过来。\n\
    4.  启动 VS Code，在 IDE 的资源管理器选项卡中，点击 ![](img/501717_2_En_7_Figc_HTML.jpg)。\n5. \
    \ 导航至上面步骤 2 中创建的文件夹，并点击 ![](img/501717_2_En_7_Figd_HTML.jpg) 选中它。\n6.  点击菜单栏中的**视图**，然后选择**终端**，以便在\
    \ IDE 中显示终端窗口。\n7.  创建一个新的 .NET 控制台应用程序（请参见动手实验 7-1 中的图 7-4）。\n8.  安装 `Microsoft.SemanticKernel`\
    \ NuGet 包（请参见动手实验 7-1 中的图 7-6）。\n9.  打开 `Program.cs`，将“Hello World”代码替换为[第 7 章动手实验\
    \ 7-3 的仓库](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-3/Program.cs)^(⁹³)中\
    \ `Program.cs` 的代码。\n10. 将 `azureEndpoint`、`model` 和 `apiKey` 变量替换为 Azure OpenAI\
    \ 部署中的对应值。\n11. 保存所有文件。\n12. 让我们来探索一下提示模板示例。在 `prompt_template_samples` 文件夹中，我们看到了与实验\
    \ 7-2 相同的电子邮件插件（`EmailPlugin`）。我们还增加了两个插件，分别用于库存（`InventoryPlugins`）和销售（`SalesPlugins`），如下图\
    \ 7-23 所示。\n\n![](img/501717_2_En_7_Fig24_HTML.jpg)\n\n**图 7-24** 构建并运行 exercise-7-3\
    \ 的代码\n\n1.  检查这些插件中的 `skprompt.txt` 和 `config.json` 文件，以了解插件中各个函数对应的提示词。\n  \
    \  - `get_inventory` 函数的 `skprompt.txt` 包含一个硬编码的库存项目列表。这是为了简化实验，以便我们专注于自动函数调用的概念。在现实世界中，该函数将替换为来自数据库的值（请参见第\
    \ 8 章和 DBCopilot）。\n2.  在**终端**窗口中，使用 `dotnet build` 和 `dotnet run` 命令构建并运行解决方案，如下面的图\
    \ 7-24 所示。\n\n![](img/501717_2_En_7_Fig25_HTML.jpg)\n\n**图 7-25** 利用 Semantic\
    \ Kernel 和自动函数调用与 LLM 进行的示例对话\n\n1.  与代理进行对话^(⁹⁴)。图 7-25 显示了一个示例对话。请记住，因为我们是在与\
    \ LLM 以及可能不同的模型打交道，所以您得到的响应可能会有所不同。但最重要的是，您能体验到“追问”类型的交互。\n\n以上述对话为例，以下是我们在本实验中探索的关键特性：\n\
    \n- 当请求模糊不清时，LLM 会请求更多信息。\n    - 例如，当需要澄清用户请求的是哪种类型的商品、具体是哪类炊具等时。\n- LLM 中的自动函数调用允许\
    \ Semantic Kernel 调用正确的函数，而无需开发复杂的逻辑。\n    - 请注意 Semantic Kernel 是如何仅从 `InventoryPlugins`\
    \ 的 `get_inventory` 中获取露营物品，并通过 `SalesPlugins` 中的 `AddToCart` 函数将其添加到订单中的。\n\n\
    ### 创建函数的最佳实践\n\n由于在聊天补全过程中，函数的序列化信息会被发送给 LLM，因此存在一些最佳实践可以改善补全的性能和质量。\n\n####\
    \ 函数模式的详细程度\n\n序列化会占用令牌。因此，更冗长的模式需要更多的令牌，这会减慢响应时间。尽量保持函数简洁，并使用具有自解释性的函数名，因为这有助于避免为函数提供描述。\n\
    \n#### 参数\n\n指定函数所需的参数。同样，如果模型不需要某些参数，则应将其隐藏。\n\n同时指定参数类型，这有助于模型在响应中提高准确性。在可能的情况下，避免使用\
    \ `string` 作为参数类型，因为模型无法推断 `string` 类型的参数。尽可能使用 `int`、`float` 或复杂类型。\n\n#### 函数描述\n\
    \n为函数提供描述是可选的，但这样做可能有助于提高 LLM 理解函数功能的能力。然而，如上所述，使用自解释的函数名也能达到同样的目的，这是推荐的做法。如果函数名具有自解释性，则可以省略提供函数描述。\n\
    \n#### 插件名称\n\n如前所述，插件是函数的集合。然而，插件及其名称被用作函数的命名空间属性。因此，同名函数可以存在于不同的插件中，并且每个同名函数可以具有不同的功能。例如，一个名为\
    \ `search` 的函数可以存在于多个插件中，每个插件负责在不同的上下文或位置执行搜索。\n\n在实验和示例中，我们在名称中使用了“plugins”。这是有意为之，以强化概念。然而，在实践中，应去除这些多余的词语，因为这将有助于减少模式的冗长性。\n\
    \n### 在代码中加载插件\n\n我们一直使用 `skprompt.txt` 提示模板和对应的 `config.json` 文件来定义插件和函数。这些也可以与代码一起内联定义。\n"
- fmt: "# Hands-On Exercise 7-4: Inline Plugins and Functions\n\nSince we have done\
    \ this several times, we will be abbreviating the details for the steps in this\
    \ exercise.\n\n1. Just like all the previous exercises, create a new folder, and\
    \ in that folder, create a new .Net console application.\n2. Install the `Microsoft.SemanticKernel`\
    \ NuGet package.\n3. Replace the code in `Program.cs` with the one in the [`Program.cs`\
    \ from exercise 7-4](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-4/Program.cs).\n\
    4. Provide `azureEndpoint`, `model`, and `apiKey` values in the code.\n5. Build\
    \ and run the application.\n\nInteract with the agent. A sample conversation is\
    \ shown in Figure 7-26 below. One plugin with two functions defined inline.\n\n\
    ![Sample conversation with the Information Agent that uses inline plugins](images/501717_2_En_7_Chapter/501717_2_En_7_Fig26_HTML.jpg)\n\
    \n**Figure 7-26** Sample conversation with the Information Agent that uses inline\
    \ plugins\n\n## Summary\n\nLLMs like OpenAI can call functions to carry out tasks.\
    \ This takes LLM beyond chat, summarization of text, analyzing or creating images,\
    \ etc. Semantic Kernel is a Microsoft open-source solution that describes functions\
    \ and their parameters to the LLMs. Functions can be grouped into plugins, as\
    \ we saw in the examples and exercises in this chapter.\n\nWith Automatic Function\
    \ Calling built into more recent versions of LLMs, Semantic Kernel is transitioning\
    \ from using the concept of a planner to leveraging this capability to easily\
    \ create business and process logic. Follow the recommended best practice when\
    \ defining functions.\n\nIn the next chapter, we will look at LangChain, which\
    \ is an alternative to Semantic Kernel. We will also use LangChain to introduce\
    \ the concept of a DBCopilot. But even though we are using LangChain to introduce\
    \ DBCopilot, it is important to note that you can also implement DBCopilot with\
    \ Semantic Kernel.\n\nFootnotes\n\n# 8. Structured Data, Codex, Agents, and DBCopilot\n\
    \nUp until this point, we have been discussing generative AI within the context\
    \ of unstructured data. We have seen how we can ground the LLM with unstructured\
    \ data and interact with the data through natural language processing.\n\nOpenAI\
    \ combined natural language with training data from billions of lines of open-source\
    \ code from GitHub repositories and other public sources. The result is a model\
    \ that understands dozens of programming languages and computing concepts like\
    \ database relationships and schemas. Combined with the NLP training data, users\
    \ and applications can converse in natural language on technical topics. This\
    \ model is known as Codex and is the core capability for the use cases in this\
    \ chapter.\n\n## Codex\n\nCodex started out as a standalone model. It is the product\
    \ of a partnership between Microsoft GitHub and OpenAI in 2021, and it is the\
    \ model that powers GitHub Copilot. It was briefly discontinued because it became\
    \ a capability of the GPT-3.5 Turbo and GPT-4 models, but the decision was reversed\
    \ due to popular demand. Although it varies by use case, it may still be more\
    \ cost effective and efficient to make a single API call to GPT-3.5T or GPT-4\
    \ Turbo as a multimodal model approach.\n\n### Hands-On Exercise 8-1: Codex in\
    \ GPT\n\nFor this exercise, we will be using GPT-4 Turbo + Vision. You can choose\
    \ to use Postman for your testing, like in Exercise 3-3 in Chapter 3, but we will\
    \ be using the Azure AI Studio in this exercise.\n\n![Uploading an image in the\
    \ Playground for the GPT-4 Turbo + Vision model](images/501717_2_En_8_Chapter/501717_2_En_8_Fig1_HTML.jpg)\n\
    \n**Figure 8-1** Uploading an image in the Playground for the GPT-4 Turbo + Vision\
    \ model\n\n1. Deploy the GPT-4 Turbo + Vision model if you do not already have\
    \ one.\n2. If you have cloned the book's GitHub repository, the files you will\
    \ need are in the `Chapter-8\\exercise-8-1` folder. Otherwise, download the three\
    \ JPEG files from the repo - `https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-1`.\n\
    3. Go to AI Studio at `https://ai.azure.com`.\n4. Select the Playground, then\
    \ select GPT-4 Vision as the model, and click on the icon and select \"Upload\
    \ image\", as shown in Figure 8-1 below.\n\n![Analyzing the image with GPT-4 Turbo](images/501717_2_En_8_Chapter/501717_2_En_8_Fig2_HTML.jpg)\n\
    \n**Figure 8-2** Analyzing the image with GPT-4 Turbo\n\n1. Select any JPEG file\
    \ from step 2. For example, we will select `mockPayStub.jpg`.\n2. Provide this\
    \ prompt \"Describe this image\", as shown in Figure 8-2.\n\n![Codex capability\
    \ of GPT-4 Turbo created a json structure of the information from the W2 image](images/501717_2_En_8_Chapter/501717_2_En_8_Fig3_HTML.jpg)\n\
    \n**Figure 8-3** Codex capability of GPT-4 Turbo created a json structure of the\
    \ information from the W2 image\n\n1. Note the response from the LLM. It is written\
    \ as a summary of the paystub, highlighting details such as the year-to-date earnings,\
    \ net pay, deductions, etc.\n2. To demonstrate the Codex capabilities of GPT-4\
    \ Turbo, type this prompt – \"Extract details into json\".\n3. Now observe the\
    \ response. The LLM should have created a well-formed json of the information\
    \ from the W2 image, as shown in Figure 8-3 below.\n4. Try these other prompts,\
    \ or come up with your own, and observe each output:\n   1. Create a SQL statement\
    \ to save this information into a SQL database.\n   2. Write C# code to insert\
    \ information into a SQL database.\n   3. Write Python code to save information\
    \ into a PostgreSQL table.\n   4. Save information into a Cosmos DB using Go\n\
    \nThe SQL statement that was created (step 10.a above) is most relevant for this\
    \ chapter because we are going to focus on using LLMs to produce responses grounded\
    \ on data from a database. Therefore, the ability to select the correct rows by\
    \ first creating a correct SQL statement and then executing it is the implementation\
    \ pattern.\n\n## Structured Data\n\nStructured data is any data presented in tabular\
    \ form (rows and columns). This is the formal description of a database, where\
    \ the main difference is that databases extend structured data by including concepts\
    \ such as relationships and providing tools to manage, organize, and filter the\
    \ structured data.\n\nWhen used in the context of an LLM, structured data would\
    \ be agnostic to the type of database engine although we will be using Microsoft\
    \ SQL database and the SQL language in our examples and hands-on exercises."
  raw: "### Hands-On Exercise 7-4: Inline Plugins and Functions\n\nSince we have done\
    \ this several times, we will be abbreviating the details for the steps in this\
    \ exercise.\n\n1.  Just like all the previous exercises, create a new folder,\
    \ and in that folder, create a new .Net console application.\n\n2.  Install the\
    \ Microsoft.SemanticKernel NuGet package.\n\n3.  Replace the code in Program.cs\
    \ with the one in the [Program.​cs from exercise 7-4](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-4/Program.cs).^([^(95)](#fn95))\n\
    \n4.  Provide azureEndpoint, model, and apiKey values in the code.\n\n5.  Build\
    \ and run the application.\n\nInteract with the agent. A sample conversation is\
    \ shown in Figure [7-26](#501717_2_En_7_Chapter.xhtml#Fig26) below. One plugin\
    \ with two functions defined inline.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig26_HTML.jpg)\n\
    \nFigure 7-26\n\nSample conversation with the Information Agent that uses inline\
    \ plugins\n\n## Summary\n\nLLMs like OpenAI can call functions to carry out tasks.\
    \ This takes LLM beyond chat, summarization of text, analyzing or creating images,\
    \ etc. Semantic Kernel is a Microsoft open-source solution that describes functions\
    \ and their parameters to the LLMs. Functions can be grouped into plugins, as\
    \ we saw in the examples and exercises in this chapter.\n\nWith Automatic Function\
    \ Calling built into more recent versions of LLMs, Semantic Kernel is transitioning\
    \ from using the concept of a planner to leveraging this capability to easily\
    \ create business and process logic. Follow the recommended best practice when\
    \ defining functions.\n\nIn the next chapter, we will look at LangChain, which\
    \ is an alternative to Semantic Kernel. We will also use LangChain to introduce\
    \ the concept of a DBCopilot. But even though we are using LangChain to introduce\
    \ DBCopilot, it is important to note that you can also implement DBCopilot with\
    \ Semantic Kernel.\n\nFootnotes [1](#501717_2_En_7_Chapter.xhtml#Fn1_source)  \
    \ [2](#501717_2_En_7_Chapter.xhtml#Fn2_source)   [3](#501717_2_En_7_Chapter.xhtml#Fn3_source)\
    \   [4](#501717_2_En_7_Chapter.xhtml#Fn4_source)   [5](#501717_2_En_7_Chapter.xhtml#Fn5_source)\
    \   [6](#501717_2_En_7_Chapter.xhtml#Fn6_source)   [7](#501717_2_En_7_Chapter.xhtml#Fn7_source)\
    \   [8](#501717_2_En_7_Chapter.xhtml#Fn8_source)   [9](#501717_2_En_7_Chapter.xhtml#Fn9_source)\
    \   [10](#501717_2_En_7_Chapter.xhtml#Fn10_source)   [11](#501717_2_En_7_Chapter.xhtml#Fn11_source)\
    \   [12](#501717_2_En_7_Chapter.xhtml#Fn12_source)   [13](#501717_2_En_7_Chapter.xhtml#Fn13_source)\
    \   [14](#501717_2_En_7_Chapter.xhtml#Fn14_source)   [15](#501717_2_En_7_Chapter.xhtml#Fn15_source)\
    \   [16](#501717_2_En_7_Chapter.xhtml#Fn16_source)   [17](#501717_2_En_7_Chapter.xhtml#Fn17_source)\
    \   [18](#501717_2_En_7_Chapter.xhtml#Fn18_source)\n\n# 8. Structured Data, Codex,\
    \ Agents, and DBCopilot\n\nUp until this point, we have been discussing generative\
    \ AI within the context of unstructured data. We have seen how we can ground the\
    \ LLM with unstructured data and interact with the data through natural language\
    \ processing.\n\nOpenAI combined natural language with training data from billions\
    \ of lines of open-source code from GitHub repositories and other public sources.\
    \ The result is a model that understands dozens of programming languages and computing\
    \ concepts like database relationships and schemas. Combined with the NLP training\
    \ data, users and applications can converse in natural language on technical topics.\
    \ This model is known as Codex and is the core capability for the use cases in\
    \ this chapter.\n\n## Codex\n\nCodex started out as a standalone model. It is\
    \ the product of a partnership^([^(96)](#fn96)) between Microsoft GitHub and OpenAI\
    \ in 2021, and it is the model that powers GitHub Copilot. It was briefly discontinued\
    \ because it became a capability of the GPT-3.5 Turbo and GPT-4 models, but the\
    \ decision was reversed due to popular demand. Although it varies by use case,\
    \ it may still be more cost effective and efficient to make a single API call\
    \ to GPT-3.5T or GPT-4 Turbo as a multimodal model approach.\n\n### Hands-On Exercise\
    \ 8-1: Codex in GPT\n\nFor this exercise, we will be using GPT-4 Turbo + Vision.\
    \ You can choose to use Postman for your testing, like in Exercise 3-3 in Chapter\
    \ [3](#501717_2_En_3_Chapter.xhtml), but we will be using the Azure AI Studio\
    \ in this exercise.\n\n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig1_HTML.jpg)\n\
    \nFigure 8-1\n\nUploading an image in the Playground for the GPT-4 Turbo + Vision\
    \ model\n\n1.  Deploy^([^(97)](#fn97)) the GPT-4 Turbo + Vision model if you do\
    \ not already have one.\n\n2.  If you have cloned the book’s GitHub repository,^([^(98)](#fn98))\
    \ the files you will need are in the “Chapter-8\\exercise-8-1” folder. Otherwise,\
    \ download the three JPEG files from the repo - [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-1`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-1).\n\
    \n3.  Go to AI Studio at [`https://ai.azure.com`](https://ai.azure.com).\n\n4.\
    \  Select the Playground, then select GPT-4 Vision as the model, and click on\
    \ ![](images/501717_2_En_8_Chapter/501717_2_En_8_Figa_HTML.jpg) and select “Upload\
    \ image”, as shown in Figure [8-1](#501717_2_En_8_Chapter.xhtml#Fig1) below.\n\
    \n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig2_HTML.jpg)\n\nFigure 8-2\n\
    \nAnalyzing the image with GPT-4 Turbo\n\n1.  Select any JPEG file from step 2\\\
    . For example, we will select “mockPayStub.jpg”.\n\n2.  Provide this prompt “Describe\
    \ this image”, as shown in Figure [8-2](#501717_2_En_8_Chapter.xhtml#Fig2).\n\n\
    ![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig3_HTML.jpg)\n\nFigure 8-3\n\n\
    Codex capability of GPT-4 Turbo created a json structure of the information from\
    \ the W2 image\n\n1.  Note the response from the LLM. It is written as a summary\
    \ of the paystub, highlighting details such as the year-to-date earnings, net\
    \ pay, deductions, etc.\n\n2.  To demonstrate the Codex capabilities of GPT-4\
    \ Turbo, type this prompt – “Extract details into json”.\n\n3.  Now observe the\
    \ response. The LLM should have created a well-formed json of the information\
    \ from the W2 image, as shown in Figure [8-3](#501717_2_En_8_Chapter.xhtml#Fig3)\
    \ below.\n\n1.  Try these other prompts, or come up with your own, and observe\
    \ each output:\n    1.  Create a SQL statement to save this information into a\
    \ SQL database.\n\n    2.  Write C# code to insert information into a SQL database.\n\
    \n    3.  Write Python code to save information into a PostgreSQL table.\n\n \
    \   4.  Save information into a Cosmos DB using Go\n\nThe SQL statement that was\
    \ created (step 10.a above) is most relevant for this chapter because we are going\
    \ to focus on using LLMs to produce responses grounded on data from a database.\
    \ Therefore, the ability to select the correct rows by first creating a correct\
    \ SQL statement and then executing it is the implementation pattern.\n\n## Structured\
    \ Data\n\nStructured data is any data presented in tabular form (rows and columns).\
    \ This is the formal description of a database, where the main difference is that\
    \ databases extend structured data by including concepts such as relationships\
    \ and providing tools to manage, organize, and filter the structured data.\n\n\
    When used in the context of an LLM, structured data would be agnostic to the type\
    \ of database engine although we will be using Microsoft SQL database and the\
    \ SQL language in our examples and hands-on exercises."
  trans: "\n# 动手练习 7-4：内联插件与函数\n\n由于我们已经多次进行过类似操作，本练习将省略步骤的详细说明。\n\n1.  与之前的所有练习一样，创建一个新文件夹，并在该文件夹中新建一个\
    \ .Net 控制台应用程序。\n2.  安装 `Microsoft.SemanticKernel` NuGet 包。\n3.  用[练习 7-4 中的 `Program.cs`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-4/Program.cs)\
    \ 文件内容替换 `Program.cs` 中的代码。\n4.  在代码中提供 `azureEndpoint`、`model` 和 `apiKey` 的值。\n\
    5.  生成并运行应用程序。\n\n与智能体进行交互。示例对话如下图所示（图 7-26）。一个插件包含两个内联定义的函数。\n\n![与使用内联插件的信息智能体进行示例对话](img/501717_2_En_7_Fig26_HTML.jpg)\n\
    \n**图 7-26** 与使用内联插件的信息智能体进行示例对话\n\n## 总结\n\n像 OpenAI 这样的大语言模型可以调用函数来执行任务。这使大语言模型超越了聊天、文本摘要、图像分析或创建等范畴。Semantic\
    \ Kernel 是微软的一个开源解决方案，用于向大语言模型描述函数及其参数。正如我们在本章的示例和练习中所见，函数可以分组到插件中。\n\n借助较新版本大语言模型内置的自动函数调用功能，Semantic\
    \ Kernel 正从使用规划器概念转向利用此能力轻松创建业务逻辑和流程逻辑。在定义函数时，请遵循推荐的最佳实践。\n\n在下一章中，我们将介绍 LangChain，它是\
    \ Semantic Kernel 的替代方案。我们还将使用 LangChain 引入 DBCopilot 的概念。但需要注意的是，尽管我们使用 LangChain\
    \ 来介绍 DBCopilot，您也可以使用 Semantic Kernel 来实现 DBCopilot。\n\n脚注\n\n# 8. 结构化数据、Codex、智能体与\
    \ DBCopilot\n\n到目前为止，我们一直在非结构化数据的背景下讨论生成式 AI。我们已经了解了如何将大语言模型与非结构化数据结合，并通过自然语言处理与数据进行交互。\n\
    \nOpenAI 将自然语言与来自 GitHub 仓库和其他公共来源的数十亿行开源代码的训练数据相结合。其结果是一个能够理解数十种编程语言以及数据库关系和模式等计算概念的模型。结合\
    \ NLP 训练数据，用户和应用程序可以用自然语言讨论技术主题。该模型被称为 Codex，是实现本章用例的核心能力。\n\n## Codex\n\nCodex\
    \ 最初是一个独立的模型。它是微软 GitHub 与 OpenAI 在 2021 年合作的产物，也是为 GitHub Copilot 提供支持的模型。它曾一度停产，因为它成为了\
    \ GPT-3.5 Turbo 和 GPT-4 模型的一项能力，但后来由于大众需求而撤销了该决定。尽管因用例而异，但作为多模态模型方法，对 GPT-3.5T\
    \ 或 GPT-4 Turbo 进行单次 API 调用可能仍然更具成本效益和效率。\n\n### 动手练习 8-1：GPT 中的 Codex\n\n在本练习中，我们将使用\
    \ GPT-4 Turbo + Vision。您可以选择像第 3 章中的练习 3-3 那样使用 Postman 进行测试，但本练习我们将使用 Azure AI\
    \ Studio。\n\n![在 GPT-4 Turbo + Vision 模型的 Playground 中上传图像](img/501717_2_En_8_Fig1_HTML.jpg)\n\
    \n**图 8-1** 在 GPT-4 Turbo + Vision 模型的 Playground 中上传图像\n\n1.  如果尚未部署 GPT-4 Turbo\
    \ + Vision 模型，请先进行部署。\n2.  如果您已克隆本书的 GitHub 仓库，所需文件位于 `Chapter-8\\exercise-8-1`\
    \ 文件夹中。否则，请从仓库下载三个 JPEG 文件：`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-1`。\n\
    3.  访问 AI Studio 网站 `https://ai.azure.com`。\n4.  选择 Playground，然后选择 GPT-4 Vision\
    \ 作为模型，点击图标并选择“上传图像”，如下方图 8-1 所示。\n\n![使用 GPT-4 Turbo 分析图像](img/501717_2_En_8_Fig2_HTML.jpg)\n\
    \n**图 8-2** 使用 GPT-4 Turbo 分析图像\n\n1.  从步骤 2 中选择任意一个 JPEG 文件。例如，我们选择 `mockPayStub.jpg`。\n\
    2.  提供提示词“描述此图像”，如图 8-2 所示。\n\n![GPT-4 Turbo 的 Codex 能力：从 W2 图像中创建信息的 json 结构](img/501717_2_En_8_Fig3_HTML.jpg)\n\
    \n**图 8-3** GPT-4 Turbo 的 Codex 能力：从 W2 图像中创建信息的 json 结构\n\n1.  注意大语言模型的响应。它是对工资单的摘要描述，突出了年初至今的收入、净工资、扣除额等细节。\n\
    2.  为了演示 GPT-4 Turbo 的 Codex 能力，输入提示词：“将详细信息提取为 json”。\n3.  现在观察响应。大语言模型应该已经根据\
    \ W2 图像中的信息创建了一个格式良好的 json，如下方图 8-3 所示。\n4.  尝试以下其他提示词，或自行编写提示词，并观察每个输出：\n   \
    \ 1.  创建一条 SQL 语句，将此信息保存到 SQL 数据库中。\n    2.  编写 C# 代码，将信息插入到 SQL 数据库中。\n    3.\
    \  编写 Python 代码，将信息保存到 PostgreSQL 表中。\n    4.  使用 Go 语言将信息保存到 Cosmos DB 中。\n\n\
    上面创建的 SQL 语句（步骤 10.a）与本章节最为相关，因为我们接下来将重点讨论如何使用大语言模型生成基于数据库数据的响应。因此，通过首先创建正确的 SQL\
    \ 语句然后执行它来选择正确的行，是实现模式。\n\n## 结构化数据\n\n结构化数据是指以表格形式（行和列）呈现的任何数据。这是对数据库的形式化描述，其主要区别在于数据库通过包含关系等概念并提供管理、组织和过滤结构化数据的工具来扩展结构化数据。\n\
    \n当在大语言模型上下文中使用时，结构化数据与数据库引擎的类型无关，尽管在我们的示例和动手练习中，我们将使用 Microsoft SQL 数据库和 SQL\
    \ 语言。\n"
- fmt: "# Agents\n\n`Agents` are extensions for LLMs so that LLMs can execute external\
    \ actions. For example, if the request of an LLM is to send an email, the LLM\
    \ can initialize an agent that is capable of calling connecting to an SMTP server\
    \ to send out an email. In this chapter, the LLM-enabled agent we would be building\
    \ is going to be one that can connect to a database and execute a query that was\
    \ generated by the LLM’s `Codex` capability, thus enabling NLP to SQL translation,\
    \ followed by execution. `Agents` are usually built using frameworks such as `LangChain^([^(99)](#fn99))`\
    \ and `Semantic Kernel.^([^(100)](#fn100))`\n\n## LangChain\n\n`LangChain` is\
    \ an open-source Python-based framework that comes bundled with toolkits (sometimes\
    \ referred to as packages) that integrate with different services and applications.\
    \ Creating an LLM-powered application takes the form of connecting actions, like\
    \ building blocks, into an orchestrated workflow, hence the term “chains” in `LangChain`,\
    \ where chains refer to the orchestration of actions into a workflow. As such,\
    \ its name was derived from “Lang”, to represent the language models the framework\
    \ supports, and “Chain” representing its core functionality of linking services.\
    \ `LangChain` supports models from OpenAI, Cohere, Hugging Face, Anthropic, and\
    \ more.\n\n## Semantic Kernel\n\n`Semantic Kernel` is an alternative framework\
    \ to `LangChain` from Microsoft and is also open-source. It is available as an\
    \ SDK in Python, C#, and Java.\n\nInstead of chains, `Semantic Kernel` revolves\
    \ around a kernel that invokes events using plugins and functions to complete\
    \ a task. It includes a planner that can automatically decide which plugins and\
    \ functions to use given a prompt. We covered `Semantic Kernel` in the previous\
    \ chapter, but with the introduction of Automatic Function Calling in newer models\
    \ of generative AI models, we are moving away from the planner in lieu of Automatic\
    \ Function Calling.\n\n## Which Framework to Use?\n\nSelecting which framework\
    \ depends on your project. `LangChain` predates `Semantic Kernel` and has a broader\
    \ community support. It currently has more packages than `Semantic Kernel`. `LangChain`\
    \ is most suited for Python, although it does support other languages like JavaScript/TypeScript.\
    \ On the other hand, because `Semantic Kernel` is from Microsoft, it has tighter\
    \ integration with the .Net and with the Microsoft ecosystem including Azure.\
    \ Changes and updates to `Semantic Kernel` are less frequent and more controlled\
    \ than `LangChain`, and this is sometimes viewed positively for production-level\
    \ workloads. `Semantic Kernel` supports Python, C#, and Java.\n\nTherefore, choosing\
    \ between the two frameworks depends on the features required by the project,\
    \ preferred programming language, and the level of integration with the Microsoft\
    \ ecosystem.\n\nTable [8-1](#501717_2_En_8_Chapter.xhtml#Tab1) below is a high-level\
    \ summary comparing `LangChain` and `Semantic Kernel`. Ideally, you should familiarize\
    \ yourself with both frameworks.\n\n**Table 8-1**\n\nComparing `LangChain` and\
    \ `Semantic Kernel`\n\n| Characteristic | LangChain | Semantic Kernel |\n| ---\
    \ | --- | --- |\n| Community support and popularity | Extremely strong community\
    \ support and very popular because of its ease of use | Less popular than `LangChain`\
    \ and has frequent changes, making it more stable and has the qualities for production/enterprise-grade\
    \ solutions |\n| Integration | Extensive number of packages and toolkits which\
    \ makes it more functional than `Semantic Kernel` | Not as extensive in terms\
    \ of integration as compared to `LangChain` but still substantial and likely to\
    \ support many use cases. Has deeper integration with Microsoft products, tools,\
    \ .Net, and Azure |\n| Programming languages | Python, JavaScript/TypeScript |\
    \ Python, C#, Java |\n| Pricing | $0 (open-source) | $0 (open-source under MIT\
    \ license) |\n\n## Hands-On Exercise 8-2: Exploring LangChain\n\nTo understand\
    \ `LangChain`, we will go through this simple exercise of creating an application\
    \ with `LangChain`. This exercise will serve as a prerequisite for building an\
    \ application to chat with your database.\n\n**Figure 8-4** – Provide values for\
    \ your Azure OpenAI model, endpoint, and API key in the environment variables\n\
    \n1. If you have cloned this book’s GitHub repo, launch Visual Studio Code and\
    \ open the “Chapter-8\\exercise-8-2”. Otherwise, you can download the files from\
    \ [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-2`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-2).\n\
    \n2. Open `langchain.jpynb`, and provide the following values^([^(101)](#fn101))\
    \ with your Azure OpenAI endpoint and model deployment from the Azure Portal,\
    \ as shown in Figure [8-4](#501717_2_En_8_Chapter.xhtml#Fig4) below.\n   - `<Azure\
    \ OpenAI API Key>`\n   - `<Azure OpenAI Endpoint>`\n   - `<Azure OpenAI Deployment\
    \ Name>`\n\n**Figure 8-5** – Replace environment variables with the same ones\
    \ from `langchain.jpynb`\n\n3. Save the file.\n\n4. Now go through the notebook\
    \ running each cell and read the markdowns in the notebook that explains what\
    \ each code cell does. Stop when you get to the last section, titled “Serving\
    \ with LangServe”.\n\n5. At this point, having gone through the notebook, you\
    \ now understand the basics of `LangChain`, the concepts of chains, and how to\
    \ interact with Azure OpenAI. But we want to use the chains in applications. So\
    \ the way to do that is to expose chains as APIs that applications can call.\n\
    \n6. Open `serve.py`.\n\n7. Copy the environment variables from `langchain.jpynb`\
    \ (which you provided in step 2 above) and replace the environment variables in\
    \ `serve.py`, as shown in Figure [8-5](#501717_2_En_8_Chapter.xhtml#Fig5) below.\n\
    \n**Figure 8-6** – Launch a new WSL Terminal session in VSC\n\n8. Save the file.\n\
    \n9. Launch the integrated terminal in Visual Studio and initiate a WSL session,\
    \ as shown in Figure [8-6](#501717_2_En_8_Chapter.xhtml#Fig6) below.\n\n10. Create\
    \ a new conda environment. You can name your environment accordingly, but in the\
    \ example below, we are using “ex8-2” as the environment name.\n\n11. Activate\
    \ the conda environment.\n\n```\nconda create -n ex8-2 python=3.9\n```\n\n```\n\
    conda activate ex8-2\n```\n\n**Figure 8-7** – LangServe launched as listening\
    \ on localhost\n\n12. Execute `serve.py`.\n\n```\npython serve.py\n```\n\n`LangServ`\
    \ will launch and start listening on `http://localhost:8000`, as shown in Figure\
    \ [8-7](#501717_2_En_8_Chapter.xhtml#Fig7) below.\n\n**Figure 8-8** – Interacting\
    \ with the chain through the Playground UI\n\n13. Open a browser and go to `http://localhost:8000/chain/playground`.\
    \ You can now interact with the chain through the playground UI as shown in Figure\
    \ [8-8](#501717_2_En_8_Chapter.xhtml#Fig8) below."
  raw: "## Agents\n\nAgents are extensions for LLMs so that LLMs can execute external\
    \ actions. For example, if the request of an LLM is to send an email, the LLM\
    \ can initialize an agent that is capable of calling connecting to an SMTP server\
    \ to send out an email. In this chapter, the LLM-enabled agent we would be building\
    \ is going to be one that can connect to a database and execute a query that was\
    \ generated by the LLM’s Codex capability, thus enabling NLP to SQL translation,\
    \ followed by execution. Agents are usually built using frameworks such as LangChain^([^(99)](#fn99))\
    \ and Semantic Kernel.^([^(100)](#fn100))\n\n### LangChain\n\nLangChain is an\
    \ open-source Python-based framework that comes bundled with toolkits (sometimes\
    \ referred to as packages) that integrate with different services and applications.\
    \ Creating an LLM-powered application takes the form of connecting actions, like\
    \ building blocks, into an orchestrated workflow, hence the term “chains” in LangChain,\
    \ where chains refer to the orchestration of actions into a workflow. As such,\
    \ its name was derived from “Lang”, to represent the language models the framework\
    \ supports, and “Chain” representing its core functionality of linking services.\
    \ LangChain supports models from OpenAI, Cohere, Hugging Face, Anthropic, and\
    \ more.\n\n### Semantic Kernel\n\nSemantic Kernel is an alternative framework\
    \ to LangChain from Microsoft and is also open-source. It is available as an SDK\
    \ in Python, C#, and Java.\n\nInstead of chains, Semantic Kernel revolves around\
    \ a kernel that invokes events using plugins and functions to complete a task.\
    \ It includes a planner that can automatically decide which plugins and functions\
    \ to use given a prompt. We covered Semantic Kernel in the previous chapter, but\
    \ with the introduction of Automatic Function Calling in newer models of generative\
    \ AI models, we are moving away from the planner in lieu of Automatic Function\
    \ Calling.\n\n### Which Framework to Use?\n\nSelecting which framework depends\
    \ on your project. LangChain predates Semantic Kernel and has a broader community\
    \ support. It currently has more packages than Semantic Kernel. LangChain is most\
    \ suited for Python, although it does support other languages like JavaScript/TypeScript.\
    \ On the other hand, because Semantic Kernel is from Microsoft, it has tighter\
    \ integration with the .Net and with the Microsoft ecosystem including Azure.\
    \ Changes and updates to Semantic Kernel are less frequent and more controlled\
    \ than LangChain, and this is sometimes viewed positively for production-level\
    \ workloads. Semantic Kernel supports Python, C#, and Java.\n\nTherefore, choosing\
    \ between the two frameworks depends on the features required by the project,\
    \ preferred programming language, and the level of integration with the Microsoft\
    \ ecosystem.\n\nTable [8-1](#501717_2_En_8_Chapter.xhtml#Tab1) below is a high-level\
    \ summary comparing LangChain and Semantic Kernel. Ideally, you should familiarize\
    \ yourself with both frameworks.\n\nTable 8-1\n\nComparing LangChain and Semantic\
    \ Kernel\n\n| Characteristic | LangChain | Semantic Kernel |\n| --- | --- | ---\
    \ |\n| Community support and popularity | Extremely strong community support and\
    \ very popular because of its ease of use | Less popular than LangChain and has\
    \ frequent changes, making it more stable and has the qualities for production/enterprise-grade\
    \ solutions |\n| Integration | Extensive number of packages and toolkits which\
    \ makes it more functional than Semantic Kernel | Not as extensive in terms of\
    \ integration as compared to LangChain but still substantial and likely to support\
    \ many use cases. Has deeper integration with Microsoft products, tools, .Net,\
    \ and Azure |\n| Programming languages | Python, JavaScript/TypeScript | Python,\
    \ C#, Java |\n| Pricing | $0 (open-source) | $0 (open-source under MIT license)\
    \ |\n\n### Hands-On Exercise 8-2: Exploring LangChain\n\nTo understand LangChain,\
    \ we will go through this simple exercise of creating an application with LangChain.\
    \ This exercise will serve as a prerequisite for building an application to chat\
    \ with your database.\n\n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig4_HTML.jpg)\n\
    \nFigure 8-4\n\nProvide values for your Azure OpenAI model, endpoint, and API\
    \ key in the environment variables\n\n1.  If you have cloned this book’s GitHub\
    \ repo, launch Visual Studio Code and open the “Chapter-8\\exercise-8-2”. Otherwise,\
    \ you can download the files from [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-2`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-2).\n\
    \n2.  Open langchain.jpynb, and provide the following values^([^(101)](#fn101))\
    \ with your Azure OpenAI endpoint and model deployment from the Azure Portal,\
    \ as shown in Figure [8-4](#501717_2_En_8_Chapter.xhtml#Fig4) below.\n    1. \
    \ <Azure OpenAI API Key>\n\n    2.  <Azure OpenAI Endpoint>\n\n    3.  <Azure\
    \ OpenAI Deployment Name>\n\n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig5_HTML.jpg)\n\
    \nFigure 8-5\n\nReplace environment variables with the same ones from langchain.jpynb\n\
    \n1.  Save the file.\n\n2.  Now go through the notebook running each cell and\
    \ read the markdowns in the notebook that explains what each code cell does. Stop\
    \ when you get to the last section, titled “Serving with LangServe”.\n\n3.  At\
    \ this point, having gone through the notebook, you now understand the basics\
    \ of LangChain, the concepts of chains, and how to interact with Azure OpenAI.\
    \ But we want to use the chains in applications. So the way to do that is to expose\
    \ chains as APIs that applications can call.\n\n4.  Open serve.py.\n\n5.  Copy\
    \ the environment variables from langchain.jpynb (which you provided in step 2\
    \ above) and replace the environment variables in serve.py, as shown in Figure\
    \ [8-5](#501717_2_En_8_Chapter.xhtml#Fig5) below.\n\n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig6_HTML.jpg)\n\
    \nFigure 8-6\n\nLaunch a new WSL Terminal session in VSC\n\n1.  Save the file.\n\
    \n2.  Launch the integrated terminal in Visual Studio and initiate a WSL session,\
    \ as shown in Figure [8-6](#501717_2_En_8_Chapter.xhtml#Fig6) below.\n\n1.  Create\
    \ a new conda environment. You can name your environment accordingly, but in the\
    \ example below, we are using “ex8-2” as the environment name.\n\n1.  Activate\
    \ the conda environment.\n\n```\nconda create -n ex8-2 python=3.9\n```\n\n1. \
    \ Execute serve.py.\n\n```\nconda activate ex8-2\n```\n\n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig7_HTML.jpg)\n\
    \nFigure 8-7\n\nLangServe launched as listening on localhost\n\n1.  LangServ will\
    \ launch and start listening on `http://localhost:8000`, as shown in Figure [8-7](#501717_2_En_8_Chapter.xhtml#Fig7)\
    \ below.\n\n```\npython serve.py\n```\n\n![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig8_HTML.jpg)\n\
    \nFigure 8-8\n\nInteracting with the chain through the Playground UI\n\n1.  Open\
    \ a browser and go to `http://localhost:8000/chain/playground`. You can now interact\
    \ with the chain through the playground UI as shown in Figure [8-8](#501717_2_En_8_Chapter.xhtml#Fig8)\
    \ below."
  trans: "\n# 代理\n\n`代理`是 LLM（大型语言模型）的扩展，使其能够执行外部操作。例如，如果某个 LLM 的请求是发送一封电子邮件，该 LLM\
    \ 可以初始化一个能够调用并连接 SMTP 服务器来发送邮件的代理。在本章中，我们将构建的基于 LLM 的代理，将能够连接数据库并执行由 LLM 的`Codex`能力生成的查询，从而实现自然语言处理（NLP）到\
    \ SQL 的转换，并随后执行查询。`代理`通常使用诸如`LangChain^(⁹⁹)`和`Semantic Kernel^(¹⁰⁰)`等框架构建。\n\n\
    ## LangChain\n\n`LangChain`是一个基于 Python 的开源框架，它集成了多种工具包（有时称为软件包），可与不同的服务和应用程序集成。创建一个由\
    \ LLM 驱动的应用程序，需要将操作（如同积木块）连接成一个编排好的工作流程，这也是`LangChain`中“链”（Chains）这一术语的来源，这里的“链”指将操作编排成工作流程。因此，其名称来源于“Lang”（代表该框架支持的语言模型）和“Chain”（代表其连接服务的核心功能）。`LangChain`支持来自\
    \ OpenAI、Cohere、Hugging Face、Anthropic 等公司的模型。\n\n## Semantic Kernel\n\n`Semantic\
    \ Kernel`是微软开发的`LangChain`替代框架，同样也是开源的。它以 Python、C#和 Java 的 SDK 形式提供。\n\n与“链”不同，`Semantic\
    \ Kernel`围绕着一个内核运行，该内核通过插件和函数调用事件来完成一项任务。它包含一个规划器，可以根据给定的提示自动决定使用哪些插件和函数。我们在前一章介绍了`Semantic\
    \ Kernel`，但随着生成式 AI 模型新版本中自动函数调用功能的引入，我们正逐渐从规划器转向自动函数调用。\n\n## 使用哪个框架？\n\n选择哪个框架取决于你的项目需求。`LangChain`比`Semantic\
    \ Kernel`出现得更早，拥有更广泛的社区支持，目前拥有的软件包也比`Semantic Kernel`更多。`LangChain`最适合在 Python\
    \ 中使用，但它也支持 JavaScript/TypeScript 等其他语言。另一方面，由于`Semantic Kernel`来自微软，它与.NET 以及包括\
    \ Azure 在内的微软生态系统集成更紧密。相比`LangChain`，`Semantic Kernel`的变更和更新不频繁且更受控制，这在生产级工作负载方面有时被视为一个优点。`Semantic\
    \ Kernel`支持 Python、C#和 Java。\n\n因此，在这两个框架之间进行选择取决于项目所需的功能、偏好的编程语言以及与微软生态系统的集成程度。\n\
    \n下表 8-1 是对`LangChain`和`Semantic Kernel`的高级总结对比。理想情况下，你应该熟悉这两个框架。\n\n**表 8-1**\n\
    \n比较 `LangChain` 和 `Semantic Kernel`\n\n| 特性 | LangChain | Semantic Kernel |\n\
    | --- | --- | --- |\n| 社区支持与流行度 | 社区支持极其强大，因其易用性而非常流行 | 不如`LangChain`流行，变更频繁，因此更稳定，具备生产级/企业级解决方案的特性\
    \ |\n| 集成能力 | 拥有大量的软件包和工具包，使其功能比`Semantic Kernel`更丰富 | 在集成方面不如`LangChain`广泛，但仍然强大，可能支持多种用例。与微软产品、工具、.NET\
    \ 和 Azure 的集成更深入 |\n| 编程语言 | Python, JavaScript/TypeScript | Python, C#, Java\
    \ |\n| 定价 | 免费（开源） | 免费（遵循 MIT 许可开源） |\n\n## 动手练习 8-2：探索 LangChain\n\n为了理解`LangChain`，我们将通过一个简单的练习来创建一个使用`LangChain`的应用程序。这个练习将为构建一个与数据库对话的应用程序奠定基础。\n\
    \n**图 8-4** – 在环境变量中为 Azure OpenAI 模型、终结点和 API 密钥提供值\n\n1. 如果你已克隆本书的 GitHub 仓库，请启动\
    \ Visual Studio Code 并打开“Chapter-8\\exercise-8-2”文件夹。否则，你可以从[`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-2`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-2)下载文件。\n\
    \n2. 打开`langchain.jpynb`，并使用来自 Azure 门户的 Azure OpenAI 终结点和模型部署，提供以下值^(¹⁰¹)，如下方图\
    \ 8-4 所示。\n   - `<Azure OpenAI API Key>`\n   - `<Azure OpenAI Endpoint>`\n   -\
    \ `<Azure OpenAI Deployment Name>`\n\n**图 8-5** – 用与`langchain.jpynb`中相同的环境变量替换`serve.py`中的环境变量\n\
    \n3. 保存文件。\n\n4. 现在运行笔记本中的每个单元格，并阅读其中解释每个代码单元格作用的 Markdown 文本。请在到达标题为“Serving\
    \ with LangServe”的最后一部分时停止。\n\n5. 至此，通过运行笔记本，你已经了解了`LangChain`的基础知识、链的概念，以及如何与\
    \ Azure OpenAI 交互。但我们希望能在应用程序中使用这些链。因此，实现这一目标的方法是将链暴露为应用程序可以调用的 API。\n\n6. 打开`serve.py`。\n\
    \n7. 从`langchain.jpynb`（你在上面第 2 步中提供的）复制环境变量，并替换`serve.py`中的环境变量，如下方图 8-5 所示。\n\
    \n**图 8-6** – 在 VSC 中启动新的 WSL 终端会话\n\n8. 保存文件。\n\n9. 在 Visual Studio 中启动集成终端，并启动一个\
    \ WSL 会话，如下方图 8-6 所示。\n\n10. 创建一个新的 conda 环境。你可以根据需要命名环境，但在下面的示例中，我们使用“ex8-2”作为环境名称。\n\
    \n11. 激活 conda 环境。\n\n```\nconda create -n ex8-2 python=3.9\n```\n\n```\nconda\
    \ activate ex8-2\n```\n\n**图 8-7** – LangServe 启动，监听本地主机\n\n12. 执行`serve.py`。\n\
    \n```\npython serve.py\n```\n\n`LangServe`将启动并开始监听`http://localhost:8000`，如下方图\
    \ 8-7 所示。\n\n**图 8-8** – 通过 Playground UI 与链交互\n\n13. 打开浏览器，访问`http://localhost:8000/chain/playground`。现在你可以通过\
    \ Playground UI 与链交互，如下方图 8-8 所示。\n"
- fmt: '# Chatting with Your Database


    "Chatting with your database" is a very compelling concept because up until now,
    you would need to know a database querying language (e.g., `SQL`) to retrieve
    the correct information stored in a database. While it is within the capabilities
    of many people to write simple `SQL` statements, it is still not a ubiquitous
    skill like natural language.


    Furthermore, even the best query writers will find it increasingly challenging
    to write complex queries, for example, if the data spans across multiple tables.


    In a business setting, this usually requires two types of professionals – a business
    analyst and a data analyst. The business analyst possesses knowledge of the business
    rules and processes and understands the data but might lack the technical expertise
    to *translate* that knowledge into required database queries that will provide
    the correct information. Therefore, the business analyst must communicate requirements
    to a data analyst to translate their request into a database query, making the
    process highly inefficient and prone to errors. The `NLP` and `Codex` capability
    of an `LLM` can serve as this translation layer.


    ## DBCopilot


    Building on the skills we have acquired with `LangChain`, we will build a Database
    Copilot (`DBCopilot`) so you can use natural language to chat with a database.


    ### Architecture and Process


    Our `DBCopilot` will consist of a `LangChain Agent` with the following components:


    1. `LLM` (Azure OpenAI)

    2. `LangChain` toolkit for SQL databases (`SQLDatabaseToolkit`)


    The `LangChain Agent` will use the `LLM` to interact with the database via `SQLDatabaseToolkit`
    as shown in Figure 8-9 below.


    ![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig9_HTML.jpg)


    Figure 8-9 Architecture and process flow of the `LangChain DBCopilot Agent`


    ### Hands-On Exercise 8-3: Building a `LangChain DBCopilot`


    ![](images/501717_2_En_8_Chapter/501717_2_En_8_Fig10_HTML.jpg)


    Figure 8-10 Changing the Kernel


    Table 8-2 Description of columns in dataset


    | Column Name | Role | Type | Demographic | Description |

    | --- | --- | --- | --- | --- |

    | `age` | Feature | Integer | Age | |

    | `job` | Feature | Categorical | Occupation | type of job (categorical: ''admin.'',
    ''blue-collar'', ''entrepreneur'', ''housemaid'', ''management'', ''retired'',
    ''self-employed'', ''services'', ''student'', ''technician'', ''unemployed'',
    ''unknown'') |

    | `marital` | Feature | Categorical | Marital status | marital status (categorical:
    ''divorced'', ''married'', ''single'', ''unknown''; note: ''divorced'' means divorced
    or widowed) |

    | `education` | Feature | Categorical | Education level | (categorical: ''basic.4y'',
    ''basic.6y'', ''basic.9y'', ''high.school'', ''illiterate'', ''professional.course'',
    ''university.degree'', ''unknown'') |

    | `creditdefault`¹ | Feature | Binary | | has credit in default? |

    | `balance` | Feature | Integer | | average yearly balance |

    | `housing` | Feature | Binary | | has housing loan? |

    | `loan` | Feature | Binary | | has personal loan? |

    | `contact` | Feature | Categorical | | contact communication type (categorical:
    ''cellular'', ''telephone'') |

    | `day` | Feature | Date | | last contact day of the week |

    | `month` | Feature | Date | | last contact month of year (categorical: ''jan'',
    ''feb'', ''mar'', ..., ''nov'', ''dec'') |

    | `duration` | Feature | Integer | | last contact duration, in seconds (numeric).
    Important note: this attribute highly affects the output target (e.g., if `duration
    = 0` then `y = ''no''`). Yet, the duration is not known before a call is performed.
    Also, after the end of the call `y` is obviously known. Thus, this input should
    only be included for benchmark purposes and should be discarded if the intention
    is to have a realistic predictive model. |

    | `campaign` | Feature | Integer | | number of contacts performed during this
    campaign and for this client (numeric, includes last contact) |

    | `pdays` | Feature | Integer | | number of days that passed by after the client
    was last contacted from a previous campaign (numeric; -1 means client was not
    previously contacted) |

    | `previous` | Feature | Integer | | number of contacts performed before this
    campaign and for this client |

    | `poutcome` | Feature | Categorical | | outcome of the previous marketing campaign
    (categorical: ''failure'', ''nonexistent'', ''success'') |

    | `deposit` | Feature | Binary | | has the client subscribed a term deposit? |


    1. For this exercise, we will be using an Azure SQL Database instance. If you
    do not already have a SQL database in Azure, deploy one by following this article:
    [`https://learn.microsoft.com/en-us/azure/azure-sql/database/single-database-create-quickstart?view=azuresql&tabs=azure-portal`](https://learn.microsoft.com/en-us/azure/azure-sql/database/single-database-create-quickstart?view=azuresql&tabs=azure-portal).


    2. Also download and install SQL Server ODBC drivers. Version 18 is located at
    [`https://learn.microsoft.com/en-us/sql/connect/odbc/download-odbc-driver-for-sql-server?view=sql-server-ver16`](https://learn.microsoft.com/en-us/sql/connect/odbc/download-odbc-driver-for-sql-server?view=sql-server-ver16).


    3. If you have cloned this book''s GitHub repo, launch Visual Studio Code and
    open the "Chapter-8\exercise-8-3" folder. Otherwise, you can download the files
    from [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-3`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-8/exercise-8-3).'
