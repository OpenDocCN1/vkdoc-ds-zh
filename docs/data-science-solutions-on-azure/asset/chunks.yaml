  trans: '

    # 用于评估运行的 Prompt Flow 测试数据


    接下来，设置评估输入的数据映射。如图 5-21 所示，选择 `chat_history` 和 `query` 字段。


    ![](img/501717_2_En_5_Fig21_HTML.jpg)


    图 5-21


    Prompt Flow 添加数据集与映射


    选择**下一步**以配置评估指标。目前，我们支持两种由 Microsoft 策划的指标类型，用于全面评估应用程序：


    1.  **性能与质量指标：** 评估生成内容的整体质量和连贯性。这包括 `groundedness`、`relevance`、`coherence`、`fluency`、`GPT
    similarity` 和 `F1 score`。对于这些指标，我们需要指定一个 GPT 模型进行计算；这可以通过选择我们的 Azure OpenAI 连接以及部署了
    GPT-3.5 或 GPT-4 模型的实例来完成。


    2.  **风险与安全指标：** 识别潜在的内容风险，并确保生成内容的安全性。这包括自残相关内容、仇恨与不公平内容、暴力内容以及色情内容。对于这些指标，我们无需设置连接或部署。Azure
    AI Studio 的安全评估使用一个 GPT-4 模型来提供内容风险严重性评分和推理，帮助您评估应用程序中潜在的内容危害。


    我们还可以配置一个阈值来计算风险与安全指标的缺陷率。缺陷率表示超过特定严重性级别的实例百分比。严重性级别包括`very low`、`low`、`medium`和`high`。当我们设置阈值时，我们确定哪些严重性级别被视为缺陷。默认情况下，阈值设置为`medium`。这意味着任何严重性级别为`medium`或`high`的实例都将计入缺陷率。我们可以根据我们特定的风险承受能力和评估需求灵活调整此阈值。在此项目中，我们将保持默认设置——`medium`。


    在我们选择了所有想要的指标后，我们需要为批量运行测试集进行数据映射，如图 5-22 所示。关于数据映射：


    ![](img/501717_2_En_5_Fig22_HTML.jpg)


    图 5-22


    Prompt Flow 指标与数据集映射


    *   **Context：** 将用于生成`groundedness`分数的文档或搜索结果。

    *   **Answer：** 我们助手生成的回复。

    *   **Question：** 我们用来测试助手的一系列查询。

    *   **Ground Truth：** 我们预期的回复——这来自项目数据的领域专家（SMEs）的理解。


    风险与安全指标已在上述截图中解释过，我们将在下一章深入讨论。接下来，我们将讨论性能与质量指标及其衡量方式：


    1.  **Groundedness：** `groundedness`指标，评分范围为 1 到 5（1 表示无依据，5 表示有依据），衡量模型生成的答案与源数据（例如用于问答或摘要任务的检索文档）的一致性程度。它利用
    Azure AI 内容安全服务中为自然语言推理（NLI）进行微调的自定义语言模型，来评估模型生成的回答是否得到源文档的支持。该指标对于需要事实正确性和上下文准确性的应用至关重要，例如信息检索、问答和内容摘要。要使用此指标，您需要提供`question`、`context`和生成的`answer`，以确保
    AI 回复得到所提供的`context`的充分支持。


    2.  **Relevance：** `relevance`指标，评分范围为 1 到 5（1 表示差，5 表示好），衡量模型生成的回复与给定问题的相关性和直接关联程度。它评估答案捕捉上下文关键点的能力，高分表示
    AI 系统有很强的理解能力，并能生成连贯、上下文适当的输出。低分表示回复可能偏离主题、缺乏上下文或未能充分解决用户的查询。该指标对于评估 AI 系统理解输入并生成相关回复的性能至关重要。要使用此指标，您需要提供`question`、`context`和生成的`answer`。


    3.  **GPT-Similarity：** `GPT-similarity`指标，评分范围为 1 到 5（1 表示差，5 表示好），衡量源数据（ground
    truth）句子与 AI 模型生成回复之间的相似度。它通过为真实数据（ground truth）和生成的预测（prediction）创建句子级别的嵌入向量，在高维向量表示中捕捉语义含义和上下文，从而评估相似度。该指标对于在可提供真实回复（ground
    truth）的文本生成任务中客观评估 AI 模型的性能特别有用。它有助于评估生成文本与期望内容的语义对齐程度，从而衡量模型的质量和准确性。要使用此指标，您需要提供`question`、`ground
    truth answer`和生成的`answer`。


    4.  **Coherence：** `coherence`指标，评分范围为 1 到 5（1 表示差，5 表示好），衡量语言模型生成的输出是否流畅、自然易读且类似人类语言的程度。它评估模型生成连贯、可读文本的能力。该指标在评估现实应用中模型生成回复的可读性和用户友好性时特别有用。要使用此指标，您需要提供`question`和生成的`answer`。


    5.  **Fluency：** `fluency`指标，评分范围为 1 到 5（1 表示差，5 表示好），衡量生成式 AI 预测答案的语法熟练程度。它评估生成的文本在多大程度上符合语法规则、句法结构和恰当的词汇使用，确保回复在语言学上是正确的。该指标对于评估
    AI 生成文本的语言正确性特别有用，确保其遵循正确的语法和句法。要使用此指标，您需要提供`question`和生成的`answer`。


    6.  **F1 Score：** `F1 score`，范围在 0 到 1 之间，衡量模型生成的回复与真实值（ground truth）之间的词语重叠比率。它结合了精确率（生成文本中共享词数量/总词数）和召回率（真实文本中共享词数量/总词数）以提供平衡的评估。该指标对于评估模型生成回复的准确性和相关性很有用。所需的输入包括`question`、`ground
    truth answer`和生成的`answer`。


    7.  **Retrieval Score：** `retrieval score`，范围为 1 到 5（1 表示差，5 表示好），衡量模型检索到的文档与给定问题的相关性。它通过将用户查询分解为具体的意图，并评估这些意图或其答案是否存在于或可以从检索到的文档中推断出来。该分数基于具有相关答案的意图比例来计算，并进行平方处理以惩罚错误。此指标确保了检索内容的质量和适当性，对于保证检索到的文档与用户的问题高度相关非常有用。所需的输入包括`question`、`context`和生成的`answer`。

    '
- fmt: '# Prompt Reference


    上述指标的提示参考：[`https://learn.microsoft.com/en-us/azure/ai-studio/concepts/evaluation-metrics-built-in?tabs=warning`](https://learn.microsoft.com/en-us/azure/ai-studio/concepts/evaluation-metrics-built-in?tabs=warning)


    现在我们已经理解了评估指标，最后将回顾设置并点击提交（如下截图），如图[5-23](#501717_2_En_5_Chapter.xhtml#Fig23)所示。


    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig24_HTML.jpg)


    **图 5-24** Prompt Flow 评估完成仪表板


    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig23_HTML.jpg)


    **图 5-23** Prompt Flow 提交前的最终审核


    成功完成后，它会为我们提供所有性能和质量指标的可视化表示，如图[5-24](#501717_2_En_5_Chapter.xhtml#Fig24)所示。相似度得分为`2.14`，基础性得分为`4`，我们可以稳妥地得出结论：需要改进解决方案并着手进行提示工程。提示工程在AI语言模型的开发和优化中至关重要，原因包括：提高准确性、增强性能、实现定制化、提升资源效率等。总之，提示工程之所以至关重要，是因为它有助于微调AI模型，使其提供准确、相关且用户友好的响应，同时解决偏见问题并提升整体性能和效率。因此，我们将在下一章深入探讨提示工程。


    ## 总结


    本章讨论了使用Azure基础设施和服务实现生成式AI（GenAI）解决方案，重点借鉴了第[4](#501717_2_En_4_Chapter.xhtml)章的技术。Azure提供了一个安全、可扩展的环境，并拥有丰富的AI工具和服务，如`Azure
    Machine Learning`和`Cognitive Services`。我们讨论了在AI Studio中使用`Azure OpenAI`构建“端到端GenAI
    RAG应用程序”的步骤，并进一步利用`Prompt Flow`来评估我们的解决方案。我们得出结论，提示工程对于提升AI模型的性能、准确性和相关性至关重要。下一章将深入探讨提示工程技术。


    # 6. 提示工程技术、小型语言模型与微调


    ## 引言


    在本章中，我们将深入探讨不同的提示工程技术。提示工程是任何生成式AI项目成功的核心。除了提供准确信息外，提示工程还解决了行业广泛关注的问题，如幻觉。


    然后我们将转向小型语言模型（SLM）的主题。SLM因其进入生成式AI领域的较低成本以及较小的资源占用而日益流行，这使得我们能够将生成式AI集成到物联网和端点解决方案中，这些方案需要在设备上进行推理，而无需大语言模型所需的GPU和存储资源。


    ## 提示工程


    提示工程是一个新兴领域，专注于创建和优化提示，以有效利用语言模型（LM）解决广泛的应用场景和日常任务。掌握提示工程的艺术对于深入理解大语言模型（LLM）的优势和局限性至关重要。个人可以借助提示工程来增强LLM在各种任务上的性能，从简单的问答到复杂的问题解决。


    例如，一个普通用户可能会设计一个提示，帮助LLM根据每周的膳食计划创建购物清单，不断调整措辞和格式，直到模型能够始终如一地提供准确且全面的清单。或者，有人可以开发一个提示，引导LLM回答关于他们最喜欢食谱的问题，微调提示以提高理解力和相关性。


    对于开发者而言，提示工程涉及构建稳健且有效的提示技术，使LLM与其他工具之间能够无缝交互。例如，开发者可能创建一个提示，指示LLM为特定编程任务生成代码片段，或以通俗易懂的术语提供复杂概念的详细解释。然而，提示工程不仅仅是设计和开发提示；它涵盖了一系列与LLM交互和开发LLM所必需的多样化技能和技术。这套技能对于与LLM接口、构建应用程序以及理解其能力至关重要。此外，提示工程还可用于提升LLM的安全性并引入新功能，例如将领域特定知识和外部工具集成到LLM中。例如，可以设计一个提示，确保LLM避免生成有害或有偏见的内容，从而增强模型的安全性。另一个例子是创建提示，使LLM能够访问和利用专门的数据库或API，从而通过外部信息增强模型的能力。'
