  trans: "\n# Azure OpenAI – 与你的数据对话\n\n`Azure OpenAI` 使开发者能够通过将 AI 聊天模型连接到自己的数据，来集成检索增强生成（RAG）。使用你自己的数据的\
    \ `Azure OpenAI` 允许你利用 `GPT-35 Turbo` 和 `GPT-4` 等强大的 AI 模型来处理你自己的业务数据，而无需自行训练或微调模型。这使你能够进行更准确的对话并更好地分析数据。你可以通过\
    \ REST API、SDK 或 `Azure OpenAI Studio` 中的基于 Web 的界面来访问使用自己数据的 `Azure OpenAI`。此外，你还可以选择创建一个连接到数据的\
    \ Web 应用以改进聊天解决方案，或直接在 `Copilot Studio`（预览版）中将其部署为智能副驾。\n\n你可以指定支持响应的数据源，如图 5-1\
    \ 所示，确保从你指定的数据源获取最新信息。目前支持以下数据源：`Azure AI Search`、`Azure Blob Storage`、`Azure\
    \ CosmosDB for MongoDB vCore`、`Elastic search`，以及 `.txt`、`.md`、`.html`、`.docx`、`.pptx`、`.pdf`\
    \ 等文件类型。\n\n![](img/501717_2_En_5_Fig1_HTML.jpg)\n\n图 5-1\n\n`Azure OpenAI Studio`\
    \ 中支持的数据源\n\n当涉及到特定的数据源，比如从本地计算机上传文件（预览版）或存储在 Blob 存储帐户中的数据（预览版）时，`Azure AI Search`\
    \ 就发挥作用了。在这些场景中，当你选择这些特定数据源时，你的数据会被提取到 `Azure AI Search 索引` 中。这意味着数据在 `Azure AI\
    \ Search` 服务中被组织起来并可搜索，便于高效检索和分析。这也允许你创建搜索资源和索引，确保在插入过程中进行适当的分块。\n\n如果每次上传的所有文件最大总大小为\
    \ 16MB（截至 2024 年 6 月），建议上传文件，如图 5-2 所示；如果你的文件大于 16MB，则应先上传到存储帐户，然后在 `Azure OpenAI\
    \ studio` 中使用 `Azure blob storage` 作为数据源。\n\n此外，如果文件包含特殊格式，如表格、列、项目符号或其他复杂结构，建议使用\
    \ `GitHub` 上提供的数据准备脚本来准备数据。\n\n- AI Studio：[`https://ai.azure.com`](https://ai.azure.com)\n\
    - GitHub 仓库：[`https://github.com/microsoft/sample-app-aoai-chatGPT/tree/main/scripts#optional-crack-pdfs-to-text`](https://github.com/microsoft/sample-app-aoai-chatGPT/tree/main/scripts#optional-crack-pdfs-to-text)\n\
    \n![](img/501717_2_En_5_Fig2_HTML.jpg)\n\n图 5-2\n\n`OpenAI Studio` 中的上传文件部分\n\n\
    此脚本确保数据格式正确且分块合理，从而使模型能够给出更准确的响应。对于包含较长文本内容的文档或数据集，建议使用数据准备脚本。该脚本能有效地将数据分块，使模型能够提供更精确、准确的响应。此外，数据准备脚本还支持扫描的\
    \ PDF 文件和图像，确保与多种数据源兼容。\n\n我们将利用使用你数据的 `Azure OpenAI` 指南来端到端地构建 GenAI RAG 应用程序。\n\
    \n## 端到端构建 GenAI RAG 应用程序\n\n让我们利用 `Azure AI Studio` 开发一个 GenAI 应用程序，并集成路易斯安那州补充营养援助计划（SNAP）的公共数据集。这个创新的应用程序将作为\
    \ GenAI 助手，旨在为公民提供全天候的共情支持。通过提供及时且富有同情心的帮助，该 GenAI 助手旨在提升用户体验并显著减轻呼叫中心的工作量。\n\n\
    - SNAP 数据集：[`https://www.dcfs.louisiana.gov/page/snap`](https://www.dcfs.louisiana.gov/page/snap)\n\
    - Azure OpenAI 模型区域可用性：[`https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models`](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models)\n\
    \n**前提条件：**\n\n1.  Azure 订阅\n2.  Azure AI Studio\n3.  在任何可用区域中的 Azure Open AI\
    \ GPT-4o\n4.  Azure Open AI GPT-4o 密钥\n5.  Azure 存储帐户\n6.  Azure AI Search\n\n\
    `AI Studio` 为 AI 开发者和数据科学家提供了一个统一平台，可通过 Web 门户、SDK 或 CLI，利用 Azure 服务来构建、评估和部署\
    \ AI 模型。`AI Studio` 中的主要资源，即中心（hub）和项目（project），构建于 `Azure Machine Learning` 之上。虽然中心和项目引用了诸如\
    \ `Azure OpenAI`、`Azure AI services` 和 `Azure AI Search` 等已连接资源，但这些资源管理着自己的生命周期，彼此独立。\n\
    \n**步骤：**\n\n![](img/501717_2_En_5_Fig3_HTML.jpg)\n\n图 5-3\n\n`Azure AI Studio`\
    \ 创建中心\n\n1.  **创建 AI 中心**\n\n    AI 中心作为一个中央仓库，旨在容纳 AI 项目并建立与各种 AI 资源的连接。这些 AI\
    \ 资源可以包括 AI 服务、`Azure OpenAI` 和 AI 搜索，为管理和部署 AI 能力提供了一个全面的框架。AI 中心包括：\n    - 为项目和端点提供托管网络安全配置\n\
    \    - 项目管理能力，可托管多个子项目\n    - 用于开发、微调和模型部署的计算资源\n    - 用于数据和工件（artifacts）的 Azure\
    \ 存储帐户\n\n    我们将按照图 5-3 所示创建 Azure AI 中心。\n\n![](img/501717_2_En_5_Fig4_HTML.jpg)\n\
    \n图 5-4\n\n`Azure AI Studio` 项目视图\n\n1.  **创建项目：中心的子资源**\n\n    接下来，我们启动项目以开发我们的\
    \ AI 解决方案，如图 5-4 所示。`AI Studio` 与 AI 中心一起，提供了一个集中式界面来管理和监督这些项目，这在简化 AI 开发和项目管理流程方面代表了一项重大进步。一个项目可以包括：\n\
    \    - 用于数据上传的隔离容器，使用中心的存储\n    - 用于私有访问资源的项目特定连接\n    - 可复用组件，如数据集、模型和索引\n  \
    \  - 用于构建和定制 AI 应用程序的开发工具\n\n![](img/501717_2_En_5_Fig5_HTML.jpg)\n\n图 5-5\n\n\
    `Azure AI Studio` 连接\n\n1.  在设置中，创建到 `Azure blob storage`、`Azure AI search` 和\
    \ `Azure OpenAI` 的连接，如图 5-5 所示\n\n    在“连接”窗格中，选择高亮显示的连接，如图 5-6 所示。\n\n![](img/501717_2_En_5_Fig6_HTML.jpg)\n\
    \n图 5-6\n\n`Azure AI Studio` 可连接的可用资产\n\n建立连接后，我们可以在项目中查看并验证所有连接，如图 5-7 所示。\n\n\
    ![](img/501717_2_En_5_Fig7_HTML.jpg)\n\n图 5-7\n\n`Azure AI Studio` 已连接的资源\n\n\
    ![](img/501717_2_En_5_Fig8_HTML.jpg)\n\n图 5-8\n\nAI Studio 中使用你数据的 `Azure OpenAI`\n"
- fmt: "# 创建 AI 搜索索引\n\n通过聊天游乐场，使用 Azure Blob 存储连接中的文档创建 AI 搜索索引。选择“添加你的数据”，然后选择“添加新的数据源”，如图\
    \ 5-8 所示。\n\n选择文档所在的存储帐户和容器后，我们将选择合适的 AI 搜索资源，并将索引命名，如图 5-9 所示。AI 索引是你的数据知识库，它捕获数据的语义含义。\n\
    \n## 创建增强型 AI 索引\n\n以下是创建丰富 AI 索引所需的数据引入步骤：\n\n### 1. 资产创建\n在 Azure AI 搜索资源和 Azure\
    \ 存储帐户中设置引入资产。这些资产包括索引器、索引、数据源、搜索资源中的自定义技能，以及 Azure 存储帐户中的一个容器（称为块容器）。\n\n###\
    \ 2. 输入规范\n你可以通过 Azure OpenAI 工作室或引入 API（预览版）指定输入 Azure 存储容器。\n\n### 3. 数据读取与分块\n\
    从指定的输入容器中读取数据，其内容被打开并分割成较小的块，每个块最多包含 1024 个令牌。如果启用了向量搜索，服务会为每个块计算向量嵌入。这些处理后的数据（称为“预处理”或“分块”数据）随后存储在之前创建的块容器中。\n\
    \n### 4. 索引\n从块容器中检索预处理数据，并在 Azure AI 搜索索引中进行索引。\n\n我们将选择索引器计划，以自动执行从各种数据源提取、转换和加载数据到\
    \ Azure AI 搜索索引的过程。索引器可以利用推送模型或更多功能来支持以下特性——自动计划。\n\n![图 5-9](images/501717_2_En_5_Chapter/501717_2_En_5_Fig9_HTML.jpg)\n\
    \n**图 5-9** —— Azure OpenAI 在你的数据上配置\n\n我们还将选择用于创建 AI 搜索索引作业的虚拟机；在本例中，我们选择推荐的\
    \ `Standard_DS3_v2` 机器来运行该作业。选择“下一步”；现在我们将配置搜索设置以添加向量搜索。在添加向量搜索功能时，你将获得以下检索方法的支持：\n\
    \n- **混合搜索：** 结合向量搜索和关键字搜索，提供全面的搜索结果\n- **混合 + 语义搜索：** 集成向量、关键字和语义搜索，以获得最准确和相关的搜索结果，对生成式\
    \ AI 应用尤其有益\n- **向量搜索：** 利用向量嵌入，根据语义相似性查找结果\n- **语义搜索：** 采用先进自然语言处理技术，理解查询的上下文和含义\n\
    - **关键字检索：** 将搜索查询与数据中找到的确切关键字进行匹配\n\n默认情况下，混合搜索将设置为默认检索方法，但可以在游乐场环境中的推理时进行调整。\n\
    \n我们还将选择合适的 Azure OpenAI 连接和嵌入模型 `text-embedding-ada-002`（版本 2），以确保文档块被创建向量。\n\
    \n选择“下一步”，并查看 AI 搜索索引的最终配置，如下所示。最后，选择“创建”如图 5-10 所示。\n\n![图 5-10](images/501717_2_En_5_Chapter/501717_2_En_5_Fig10_HTML.jpg)\n\
    \n**图 5-10** —— Azure OpenAI 在你的数据上查看设置\n\n此作业将根据文档的数量和大小运行一段时间；你可以在聊天游乐场中检查进度。完成后，你将看到索引在搜索设置中提供不同的配置选项，即：语义、关键字、混合+语义、混合（向量+关键字）和向量。此设置以不同方式从\
    \ AI 索引中检索文档，以下是关键区别及何时使用哪种搜索类型：\n\n- **关键字搜索**\n    1.  **检索类型：** 关键字搜索。"
  raw: "1.  **Create AI Search Index:** Create AI Search Index using documents from\
    \ Azure blob storage connections by going to Chat playground. Select “Add you\
    \ data” and then select “Add a new data source” as shown in Figure [5-8](#501717_2_En_5_Chapter.xhtml#Fig8).\n\
    \nAfter selecting the storage account and container of documents location, we\
    \ will select the right AI search and name the index as shown in Figure [5-9](#501717_2_En_5_Chapter.xhtml#Fig9).\
    \ AI index is the knowledge base of your data that captures semantic meaning of\
    \ data.\n\nTo create an enriched AI index, below data ingestion steps are followed:\n\
    \n1.  **Asset** **Creation****:** Ingestion assets are set up within the Azure\
    \ AI Search resource and Azure storage account. These assets include indexers,\
    \ indexes, data sources, a custom skill within the search resource, and a container\
    \ (referred to as the chunks container) in the Azure storage account.\n\n2.  **Input\
    \ Specification:** You can specify the input Azure storage container either through\
    \ the Azure OpenAI studio or the ingestion API (preview).\n\n3.  **Data Reading\
    \ and Chunking:** Data is read from the specified input container, where its contents\
    \ are opened and divided into smaller chunks, each containing a maximum of 1,024\
    \ tokens. If vector search is enabled, the service calculates the vector embeddings\
    \ for each chunk. This processed data, known as “preprocessed” or “chunked” data,\
    \ is then stored in the chunk container created earlier.\n\n4.  **Indexing:**\
    \ The preprocessed data is retrieved from the chunks container and indexed within\
    \ the Azure AI Search Index.\n\nWe will select the indexer schedule to automate\
    \ the process of extracting, transforming, and loading data from various data\
    \ sources into an Azure AI Search Index. An indexer can leverage push model or\
    \ more to support below features – automated schedule.\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig9_HTML.jpg)\n\
    \nFigure 5-9\n\nAzure OpenAI on your data configuration\n\nWe will also select\
    \ the virtual machine to use for creation of AI Search Index job; in this case,\
    \ we are picking the recommended option Standard_DS3_v2 machine to run the job.\
    \ Select Next; now we will configure search settings to add vector search. When\
    \ adding vector search capabilities, you gain support for the following retrieval\
    \ methods:\n\n*   **Hybrid Search****:** Combines both vector search and keyword\
    \ search to deliver comprehensive search results\n\n*   **Hybrid + Semantic Search:**\
    \ Integrates vector, keyword, and semantic search for the most accurate and relevant\
    \ search results, particularly beneficial for generative AI applications\n\n*\
    \   **Vector Search****:** Utilizes vector embeddings to find results based on\
    \ semantic similarity\n\n*   **Semantic Search****:** Employs advanced natural\
    \ language processing techniques to understand the context and meaning of queries\n\
    \n*   **Keyword Retrieval****:** Matches search queries with exact keywords found\
    \ in the data\n\nBy default, hybrid search will be set as the default retrieval\
    \ method, but it can be adjusted at inference time within the playground environment.\n\
    \nWe will also select the right Azure OpenAI Connection and embedding model text-embedding-ada-002\
    \ (Version 2) to ensure vectors are created of document chunks\n\nSelect Next\
    \ and review the final configuration like below for AI Search Index. Lastly, select\
    \ Create as shown in Figure [5-10](#501717_2_En_5_Chapter.xhtml#Fig10).\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig10_HTML.jpg)\n\
    \nFigure 5-10\n\nAzure OpenAI on your data review settings\n\nThis job will run\
    \ for some time depending on number and size of documents; you can check the progress\
    \ in Chat playground. Once finished, you will see the index with different configurations\
    \ available to pick in search settings, namely, semantic, keyword, hybrid + semantic,\
    \ hybrid (vector + keyword), and vector. This setting retrieves documents from\
    \ AI index differently, and below are the key differences and when to use which\
    \ search type:\n\n*   Keyword search\n    1.  **Retrieval Type:** Keyword search."
