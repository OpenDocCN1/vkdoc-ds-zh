- fmt: '### Hands-On Exercise 6-1: Deploying `Phi-3`


    Although there are several SLMs available, we are going to use `Phi-3` for our
    hands-on exercise. `Phi-3` is the latest SLM released by Microsoft, and it is
    available on Azure as well as Hugging Face.


    As mentioned above, SLMs like `Phi-3` can be loaded and fine-tuned locally. Most
    of the time though, you would need a machine with an Nvidia GPU to fine-tune an
    SLM. If you do not have a local machine with an Nvidia GPU, you can use an Azure
    VM that is GPU-enabled, Azure Machine Learning Studio with GPU-enabled compute,
    or through the Azure AI Studio.


    The easiest option is to use Azure AI Studio because you do not need to manage
    compute infrastructure.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig13_HTML.jpg)


    Figure 6-13 Deploy a new Azure AI Studio resource


    1.  Login into your Azure Portal (`https://portal.azure.com`).

    2.  Create a new Azure resource and locate Azure AI Studio, as shown in Figure
    6-13 below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig14_HTML.jpg)


    Figure 6-14 Launch Azure AI Studio


    3.  At the time of writing, `Phi-3` models and the ability to fine tune them are
    available in the East US 2 region. Therefore, deploy this new AI Studio resource
    in the East US 2 region.

    4.  Accept all defaults and continue to create the AI Studio resource.

    5.  When deployment is complete, launch AI Studio, as shown in Figure 6-14 below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig15_HTML.jpg)


    Figure 6-15 Project view in Azure AI Studio


    6.  Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figa_HTML.jpg) in the
    navigation pane and then click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figb_HTML.jpg)
    to create a new project.

    7.  Provide a project name. In this exercise, we have named our project `exploring-Base-Phi3`.
    Then click the "Create a project" button.

    8.  After the project has been created, you will be returned to the main AI Studio
    interface with the current project selected. If you have multiple projects, you
    can switch between projects by clicking ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figc_HTML.jpg)
    next to the project name as shown in Figure 6-15 below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig16_HTML.jpg)


    Figure 6-16 Deploying the `Phi-3` model from the Model Catalog in Azure AI Studio


    9.  The first thing we need to do in this project is to deploy a model. Click
    `Model Catalog` to show all available models that we can deploy to this project.

    10. Select `Phi-3-mini-rk-instruct` as shown in Figure 6-16 below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig17_HTML.jpg)


    Figure 6-17 Trying out a model (`Phi-3`) prior to deployment


    11. Prior to deploying the model, you can test try it out in using the chat interface
    as shown in Figure 6-17 below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig18_HTML.jpg)


    Figure 6-18 Deploying the `Phi-3` model and endpoint


    12. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figd_HTML.jpg) to deploy
    this model to the project.

    13. Select the "Serverless API with Azure AI Content Safety" option. This option
    will not require us to deploy and manage compute resources to use the model.

    14. When prompted, give the Deployment name a name or select the default generated
    name. Since this is a hands-on exercise, disable the content filter by moving
    the slider to ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fige_HTML.jpg).

    15. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figf_HTML.jpg).

    16. It will take some time to deploy the model, and you can monitor the `Provisioning`
    state for both the model and the endpoint, as shown in Figure 6-18 below.

    17. You can click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figg_HTML.jpg)
    to get the latest `Provisioning` state or wait for it to change from "Creating"
    to "Succeeded".

    18. Under the `Project playground` section of the side menu, click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figh_HTML.jpg).

    19. Use the `Chat playground` to interact with the newly deployed SLM.


    In this hands-on exercise, use Azure AI Studio to deploy and interact with the
    SLM. This is no different from using the AI Studio with an LLM. In fact, all the
    tools in AI Studio such as `Prompt flow`, `Tracing`, and `Evaluation` are available
    to us.


    One last task before leaving this exercise. In the chat playground, type the following
    question:


    > *"Did Ariarne Titmus win a medal at the 2024 Paris Olympics?"*


    We know that she did win the gold medal in the women''s 400m freestyle event,
    but the base model does not know that. So you should receive a response similar
    to what is shown in Figure 6-19 below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig19_HTML.jpg)


    Figure 6-19 `Phi-3` model not being able to provide a response because training
    data does not contain current/real-time information


    With that, we will proceed to fine-tuning and see how we can use this approach
    to answer questions about the Paris 2024 Paris Olympics.


    ## Fine-Tuning


    One of the key differentiators between an SLM and an LLM is the time, effort,
    and cost^(68) in fine-tuning the models. It is more likely that fine-tuning is
    the recommended approach for customizing SLMs compared to the using RAG for LLMs.


    ### Concept


    Fine-tuning is the process of incorporating custom datasets into a base model.
    This extends the base model so that it can natively generate responses that rely
    on knowledge from the incorporated datasets. This makes the model more efficient,
    unlike the RAG architecture, where the model relies on results returned by a search
    service for grounding.


    Fine-tuning is most often used to custom an LLM or SLM for domain-specific knowledge.
    The process of fine-tuning is identical for SLMs and LLMs and involve the following
    steps:


    - Deploying a base model

    - Including custom datasets

    - Retraining the base model to include custom datasets into a fine-tuned model

    - Deploying the newly fine-tuned model


    Once a fine-tuned model has been created, it is now considered a custom model.
    New versions of the base models will need to be customized with custom datasets
    and should be incorporated as part of an MLOps model lifecycle management.


    ### Background for Hands-On Exercises 6-2 and 6-3


    At the time of writing (July 30, 2024), the Olympics in Paris just started five
    days ago. All the LLM and SLM models will not contain any of the Paris Olympics
    details at this point of time.


    We will use a dataset with more recent information to fine-tune a model, but bear
    in mind that by the time you undertake this exercise, the base model you deployed
    may already contain this information, so you may need to provide a dataset that
    contains data outside the scope of the base model''s training.


    Alternatively, you can use the `GPT-3.5 Turbo 0125` version in the exercise, which
    is sure to not include information from the 2024 Paris Olympics.


    Before we start the hands-on exercise, we want to stress again that even in this
    particular use case, it is likely better to use the RAG architecture than fine-tuning.
    The most important aspect of RAG is the ease of adding and updating information.
    Updating information that is embedded into a model requires retraining the model,
    a process which is time consuming.


    This Olympics use case is for illustration purposes because we wanted to pick
    something that we know will not be part of a base model.'
  raw: '### Hands-On Exercise 6-1: Deploying Phi-3


    Although there are several SLMs available, we are going to use Phi-3 for our hands-on
    exercise. Phi-3 is the latest SLM released by Microsoft, and it is available on
    Azure as well as Hugging Face.


    As mentioned above, SLMs like Phi-3 can be loaded and fine-tuned locally. Most
    of the time though, you would need a machine with an Nvidia GPU to fine-tune an
    SLM. If you do not have a local machine with an Nvidia GPU, you can use an Azure
    VM that is GPU-enabled, Azure Machine Learning Studio with GPU-enabled compute,
    or through the Azure AI Studio.


    The easiest option is to use Azure AI Studio because you do not need to manage
    compute infrastructure.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig13_HTML.jpg)


    Figure 6-13


    Deploy a new Azure AI Studio resource


    1.  Login into your Azure Portal ([`https://portal.azure.com`](https://portal.azure.com)).


    2.  Create a new Azure resource and locate Azure AI Studio, as shown in Figure
    [6-13](#501717_2_En_6_Chapter.xhtml#Fig13) below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig14_HTML.jpg)


    Figure 6-14


    Launch Azure AI Studio


    1.  At the time of writing, Phi-3 models and the ability to fine tune them are
    available in the East US 2 region. Therefore, deploy this new AI Studio resource
    in the East US 2 region.


    2.  Accept all defaults and continue to create the AI Studio resource.


    3.  When deployment is complete, launch AI Studio, as shown in Figure [6-14](#501717_2_En_6_Chapter.xhtml#Fig14)
    below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig15_HTML.jpg)


    Figure 6-15


    Project view in Azure AI Studio


    1.  Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figa_HTML.jpg) in the
    navigation pane and then click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figb_HTML.jpg)
    to create a new project.


    2.  Provide a project name. In this exercise, we have named our project “exploring-Base-Phi3.”
    Then click the “Create a project” button.


    3.  After the project has been created, you will be returned to the main AI Studio
    interface with the current project selected. If you have multiple projects, you
    can switch between projects by clicking ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figc_HTML.jpg)
    next to the project name as shown in Figure [6-15](#501717_2_En_6_Chapter.xhtml#Fig15)
    below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig16_HTML.jpg)


    Figure 6-16


    Deploying the Phi-3 model from the Model Catalog in Azure AI Studio


    1.  The first thing we need to do in this project is to deploy a model. Click
    Model Catalog to show all available models that we can deploy to this project.


    2.  Select Phi-3-mini-rk-instruct as shown in Figure [6-16](#501717_2_En_6_Chapter.xhtml#Fig16)
    below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig17_HTML.jpg)


    Figure 6-17


    Trying out a model (Phi-3) prior to deployment


    1.  Prior to deploying the model, you can test try it out in using the chat interface
    as shown in Figure [6-17](#501717_2_En_6_Chapter.xhtml#Fig17) below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig18_HTML.jpg)


    Figure 6-18


    Deploying the Phi-3 model and endpoint


    1.  Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figd_HTML.jpg) to deploy
    this model to the project.


    2.  Select the “Serverless API with Azure AI Content Safety” option. This option
    will not require us to deploy and manage compute resources to use the model.


    3.  When prompted, give the Deployment name a name or select the default generated
    name. Since this is a hands-on exercise, disable the content filter by moving
    the slider to ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fige_HTML.jpg).


    4.  Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figf_HTML.jpg).


    5.  It will take some time to deploy the model, and you can monitor the Provisioning
    state for both the model and the endpoint, as shown in Figure [6-18](#501717_2_En_6_Chapter.xhtml#Fig18)
    below.


    1.  You can click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figg_HTML.jpg)
    to get the latest Provisioning state or wait for it to change from “Creating”
    to “Succeeded.”


    2.  Under the Project playground section of the side menu, click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figh_HTML.jpg).


    3.  Use the Chat playground to interact with the newly deployed SLM.


    In this hands-on exercise, use Azure AI Studio to deploy and interact with the
    SLM. This is no different from using the AI Studio with an LLM. In fact, all the
    tools in AI Studio such as Prompt flow, Tracing, and Evaluation are available
    to us.


    One last task before leaving this exercise. In the chat playground, type the following
    question:


    > *“Did Ariarne Titmus win a medal at the 2024 Paris Olympics?”*


    We know that she did win the gold medal in the women’s 400m freestyle event, but
    the base model does not know that. So you should receive a response similar to
    what is shown in Figure [6-19](#501717_2_En_6_Chapter.xhtml#Fig19) below.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig19_HTML.jpg)


    Figure 6-19


    Phi-3 model not being able to provide a response because training data does not
    contain current/real-time information


    With that, we will proceed to fine-tuning and see how we can use this approach
    to answer questions about the Paris 2024 Paris Olympics.


    ## Fine-Tuning


    One of the key differentiators between an SLM and an LLM is the time, effort,
    and cost^([^(68)](#fn68)) in fine-tuning the models. It is more likely that fine-tuning
    is the recommended approach for customizing SLMs compared to the using RAG for
    LLMs.


    ### Concept


    Fine-tuning is the process of incorporating custom datasets into a base model.
    This extends the base model so that it can natively generate responses that rely
    on knowledge from the incorporated datasets. This makes the model more efficient,
    unlike the RAG architecture, where the model relies on results returned by a search
    service for grounding.


    Fine-tuning is most often used to custom an LLM or SLM for domain-specific knowledge.
    The process of fine-tuning is identical for SLMs and LLMs and involve the following
    steps:


    *   Deploying a base model


    *   Including custom datasets


    *   Retraining the base model to include custom datasets into a fine-tuned model


    *   Deploying the newly fine-tuned model


    Once a fine-tuned model has been created, it is now considered a custom model.
    New versions of the base models will need to be customized with custom datasets
    and should be incorporated as part of an MLOps model lifecycle management.


    ### Background for Hands-On Exercises 6-2 and 6-3


    At the time of writing (July 30, 2024), the Olympics in Paris just started five
    days ago. All the LLM and SLM models will not contain any of the Paris Olympics
    details at this point of time.


    We will use a dataset with more recent information to fine-tune a model, but bear
    in mind that by the time you undertake this exercise, the base model you deployed
    may already contain this information, so you may need to provide a dataset that
    contains data outside the scope of the base model’s training.


    Alternatively, you can use the GPT-3.5 Turbo 0125 version in the exercise, which
    is sure to not include information from the 2024 Paris Olympics.


    Before we start the hands-on exercise, we want to stress again that even in this
    particular use case, it is likely better to use the RAG architecture than fine-tuning.
    The most important aspect of RAG is the ease of adding and updating information.
    Updating information that is embedded into a model requires retraining the model,
    a process which is time consuming.


    This Olympics use case is for illustration purposes because we wanted to pick
    something that we know will not be part of a base model.'
  trans: '

    ### 动手练习 6-1：部署 `Phi-3`


    尽管市面上有若干种小型语言模型（SLM）可供选择，本动手练习将使用微软最新发布的 `Phi-3`。该模型可在 Azure 及 Hugging Face 上获取。


    如前所述，像 `Phi-3` 这类 SLM 可以在本地加载和微调。不过，大多数情况下，微调 SLM 需要一台配备 Nvidia GPU 的机器。如果本地没有这样的机器，可以使用启用
    GPU 的 Azure 虚拟机、配备 GPU 计算资源的 Azure 机器学习工作室，或者通过 Azure AI 工作室。


    最简单的选择是使用 Azure AI 工作室，因为无需管理计算基础设施。


    ![](img/501717_2_En_6_Fig13_HTML.jpg)


    **图 6-13** 部署新的 Azure AI 工作室资源


    1.  登录 Azure 门户（`https://portal.azure.com`）。

    2.  创建新的 Azure 资源，并找到 Azure AI 工作室，如下图 6-13 所示。


    ![](img/501717_2_En_6_Fig14_HTML.jpg)


    **图 6-14** 启动 Azure AI 工作室


    3.  在本文撰写时，`Phi-3` 模型及其微调功能在美国东部 2 区域可用。因此，请将此新的 AI 工作室资源部署在美国东部 2 区域。

    4.  接受所有默认设置，继续创建 AI 工作室资源。

    5.  部署完成后，启动 AI 工作室，如下图 6-14 所示。


    ![](img/501717_2_En_6_Fig15_HTML.jpg)


    **图 6-15** Azure AI 工作室中的项目视图


    6.  单击导航窗格中的 ![](img/501717_2_En_6_Figa_HTML.jpg)，然后单击 ![](img/501717_2_En_6_Figb_HTML.jpg)
    创建一个新项目。

    7.  提供项目名称。在本练习中，我们将项目命名为 `exploring-Base-Phi3`。然后点击“创建项目”按钮。

    8.  项目创建完成后，您将返回主 AI 工作室界面，并自动选中当前项目。如果您有多个项目，可以通过单击项目名称旁边的 ![](img/501717_2_En_6_Figc_HTML.jpg)
    在不同项目之间切换，如下图 6-15 所示。


    ![](img/501717_2_En_6_Fig16_HTML.jpg)


    **图 6-16** 从 Azure AI 工作室的模型目录部署 `Phi-3` 模型


    9.  在此项目中，首先需要部署一个模型。单击 `Model Catalog` 以显示所有可部署到此项目的模型。

    10. 选择 `Phi-3-mini-rk-instruct`，如下图 6-16 所示。


    ![](img/501717_2_En_6_Fig17_HTML.jpg)


    **图 6-17** 在部署前试用模型（`Phi-3`）


    11. 在部署模型前，您可以使用聊天界面进行试用，如下图 6-17 所示。


    ![](img/501717_2_En_6_Fig18_HTML.jpg)


    **图 6-18** 部署 `Phi-3` 模型及端点


    12. 单击 ![](img/501717_2_En_6_Figd_HTML.jpg) 将此模型部署到项目中。

    13. 选择“使用 Azure AI 内容安全的无服务器 API”选项。此选项无需我们部署和管理计算资源即可使用模型。

    14. 根据提示，为部署命名或选择默认生成的名称。由于这是动手练习，通过将滑块滑动至 ![](img/501717_2_En_6_Fige_HTML.jpg)
    来禁用内容过滤器。

    15. 单击 ![](img/501717_2_En_6_Figf_HTML.jpg)。

    16. 部署模型需要一些时间。您可以监控模型和端点的 `Provisioning` 状态，如下图 6-18 所示。

    17. 您可以单击 ![](img/501717_2_En_6_Figg_HTML.jpg) 获取最新的 `Provisioning` 状态，或等待其从“Creating”变为“Succeeded”。

    18. 在侧边菜单的 `Project playground` 部分，单击 ![](img/501717_2_En_6_Figh_HTML.jpg)。

    19. 使用 `Chat playground` 与刚刚部署的 SLM 进行交互。


    在此动手练习中，使用 Azure AI 工作室部署 SLM 并与其交互。这与使用 LLM 操作 AI 工作室并无区别。事实上，AI 工作室中的所有工具，如
    `Prompt flow`、`Tracing` 和 `Evaluation`，均可使用。


    在结束本练习前，还有最后一个任务。在聊天试验场中，输入以下问题：


    > *“阿里亚妮·蒂特马斯在 2024 年巴黎奥运会上获得奖牌了吗？”*


    我们知道她确实赢得了女子 400 米自由泳金牌，但基础模型并不知道这一点。因此，您应该会收到类似下图 6-19 所示的响应。


    ![](img/501717_2_En_6_Fig19_HTML.jpg)


    **图 6-19** 由于训练数据不包含当前/实时信息，`Phi-3` 模型无法提供回答


    接下来，我们将进行微调，看看如何使用这种方法来回答关于 2024 年巴黎奥运会的问题。


    ## 微调


    SLM 与 LLM 的关键区别之一在于微调模型所需的时间、精力和成本⁶⁸。与对 LLM 使用 RAG（检索增强生成）相比，微调更可能是定制 SLM 的推荐方法。


    ### 概念


    微调是将自定义数据集融入基础模型的过程。这扩展了基础模型，使其能够原生生成依赖于所融入数据集知识的响应。与 RAG 架构（模型依赖搜索服务返回的结果进行接地）不同，这使得模型更高效。


    微调最常用于针对特定领域知识定制 LLM 或 SLM。微调过程对 SLM 和 LLM 相同，包括以下步骤：


    -   部署基础模型

    -   引入自定义数据集

    -   重新训练基础模型，将自定义数据集整合到微调后的模型中

    -   部署新微调后的模型


    一旦创建了微调后的模型，它便被视为自定义模型。基础模型的新版本需要使用自定义数据集进行定制，并应作为 MLOps 模型生命周期管理的一部分来纳入。


    ### 动手练习 6-2 和 6-3 的背景


    在本文撰写时（2024 年 7 月 30 日），巴黎奥运会刚开幕五天。所有 LLM 和 SLM 模型此时都不包含任何巴黎奥运会的详细信息。


    我们将使用一个包含更近期信息的数据集来微调模型。但请注意，当您进行此练习时，您部署的基础模型可能已经包含了这些信息，因此您可能需要提供一个包含基础模型训练范围之外数据的数据集。


    或者，您可以在练习中使用 `GPT-3.5 Turbo 0125` 版本，该版本肯定不包含 2024 年巴黎奥运会的任何信息。


    在开始动手练习之前，我们想再次强调，即使在这种特定用例中，使用 RAG 架构也可能比微调更好。RAG 最重要的方面是易于添加和更新信息。更新嵌入到模型中的信息需要重新训练模型，这是一个耗时的过程。


    这个奥运用例仅用于说明目的，因为我们想挑选一些我们知道基础模型不包含的内容。


