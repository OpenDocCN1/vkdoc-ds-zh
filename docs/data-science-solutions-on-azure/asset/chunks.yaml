  trans: '

    系统消息指导 GPT 助手如何根据检索到的文档回答用户问题，但不会影响检索过程。若需检索指令，请在问题中包含。系统消息仅作为指导，由于模型固有行为（如客观性和避免争议），它可能不会遵循所有指令。


    1.  **客观性：** 模型旨在提供基于事实、无偏见的信息。这意味着它会避免在辩论中站队或做出主观判断。如果系统消息鼓励更有倾向性或偏见的回复，模型可能难以遵从。

    2.  **避免争议性陈述：** 模型会避免生成可能被视为具有分裂性或煽动性的内容。它会避开可能引发争论或情绪困扰的话题。如果系统消息促使模型参与此类话题，它可能会默认选择更安全、更中立的回复。


    如果系统消息与这些行为相矛盾，则可能出现意外行为。


    ![](img/501717_2_En_5_Fig13_HTML.jpg)


    **图 5-13** Azure OpenAI 在您数据上个性化系统消息的响应


    如图 5-13 所示，我们的系统消息指令对助手进行个性化设置，为应提供哪些信息提供了明确的指导。这使得助手更具对话性，并增添了人情味，重点是共情。另请注意顶部的`Prompt
    Flow`和`WebApp Deployment`——既然我们已经准备好了系统消息并进行了一些提示工程，下一步就是评估我们的助手在几个问题上的表现如何。我们将使用`Prompt
    Flow`进行评估，一旦评估了评估指标，我们就将其部署为 Web 应用程序。


    此外，我们还可以将其导出为`JSON`文件或`Prompty`文件，后者旨在促进提示模板的开发。您还可以“查看代码”以 UI 构建的内容拉取到多种语言中——`Python`、`C#`、`JavaScript`等。


    `Prompty`参考：[`https://microsoft.github.io/promptflow/how-to-guides/develop-a-prompty/index.html`](https://microsoft.github.io/promptflow/how-to-guides/develop-a-prompty/index.html)


    ## Prompt Flow


    `Prompt Flow`是一套全面的开发工具套件，旨在简化基于 LLM 的 AI 应用程序的整个开发生命周期。这包括从构思、原型设计、测试和评估，一直到生产部署和持续监控的每个阶段。通过简化提示工程，它使您能够开发具有生产级质量的
    LLM 应用程序。


    使用`Prompt Flow`，我们能够：


    1.  **创建可执行工作流：** 设计无缝集成 LLM、提示、Python 代码和其他工具的工作流，确保它们以可执行的顺序高效协同工作。

    2.  **创建提示变体并比较其性能。**

    3.  **轻松调试和迭代：** 轻松调试和完善您的工作流，特别注重追踪与 LLM 的交互，以确保操作顺畅和结果准确。

    4.  **评估性能：** 使用更大的数据集计算质量和性能指标来评估您的工作流。这有助于了解您的工作流在不同条件下的表现。

    5.  **与 CI/CD 系统集成：** 将测试和评估流程集成到您的持续集成/持续部署（CI/CD）系统中。这确保了您的工作流在整个生命周期中保持高质量和可靠性。

    6.  **无缝部署：** 将您的工作流部署到您选择的服务平台，或直接将其集成到您的应用程序的代码库中，操作极简。

    7.  **云端协作：** 利用 Azure AI 中可用的`Prompt Flow`云版本增强团队协作。这使您的团队能够更有效地协同工作，共享资源和见解，以开发卓越的基于
    LLM 的 AI 应用程序。


    `Prompt Flow`为开发、测试和部署高质量的 LLM 应用程序提供了一个强大且用户友好的环境，使整个过程更加高效和协作。


    此外，它还为提示工程提供了一个高度灵活的环境，增强了整体开发体验。它提供了项目结构的可视化布局，使您能够轻松查看、理解并浏览我们的工作。这有助于我们跟踪所有内容如何无缝地组合在一起。我们可以创建提示的不同版本并并排比较，从而促进逐步、迭代的优化过程。内置工具允许我们评估提示和工作流的质量与有效性，确保我们的解决方案按预期工作，并使必要的调整变得直接了当。此外，`Prompt
    Flow`附带一个全面的内置工具、示例和模板库。这些资源可作为您项目的有效起点，激发创造力并加速开发过程。总之，`Prompt Flow`简化了设计、测试和优化提示的过程，使开发高质量的
    AI 应用程序变得更容易、更快捷。

