    # 预置吞吐量单位（PTU）


    `预置吞吐量单位（PTU）`是微软 Azure 中用于描述运行 LLM 的专用计算资源的术语。可以将一个`PTU`视为 LLM 所需的计算（GPU）、内存和存储的复合单元。分配给
    LLM 的`PTU`越多，其每分钟能处理的 token 数量就越多。同时，支持一个模型也需要最低数量的`PTU`。下图 2-11 描述了 LLM 与`PTU`之间的关系。下表
    2-3 显示了不同模型所需的最低`PTU`数量。


    **表 2-3** 不同模型所需的最低`PTU`数量


    | 模型 | 最低`PTU`数量 |

    | --- | --- |

    | `gpt-3.5-turbo (16k)` | 50 |

    | `gpt-4 (8k)` | 100 |

    | `gpt-4 (32k)` | 200 |

    | `gpt-4-turbo with Vision` | 100 |


    ![](img/501717_2_En_2_Fig11_HTML.jpg)


    **图 2-11** 由 LLM 使用的`预置吞吐量单位（PTU）`


    `PTU`模型并非按消耗的提示和补全 token 数量付费，而是按月固定成本提供“无限”数量的 token。然而，尽管是“无限”的，实际可消耗的最大 token
    数量仍受底层物理基础设施（计算、内存、存储等）的约束。


    估算不同`PTU`级别能够提供的最大 token 数量，对于能够控制每分钟请求数的批量处理场景非常有用。然而，在事务型场景（例如聊天）中，了解每分钟的峰值请求数可能更为重要，这样你就能知道在任何给定时间，服务是否能处理预期的用户数量。我们将在本章后面的“PTU
    模型中的峰值用户和 TPM”部分详细讨论这一点。


    ## 性能与服务限制


    现在我们已经了解了两种成本模型——即用即付（PayGo）和`PTU`；在确定 LLM 规模之前，我们还需要讨论另一个概念，即每分钟 token 数（TPM）。


    ### 每分钟 Token 数（TPM）


    每分钟 token 数（TPM）是衡量每分钟处理 token 数量的吞吐量指标。`TPM`是决定在任何给定分钟内能够处理多少请求或用户的主要指标。


    上图 2-12 将容量描绘为一条管道，以 token 形式服务用户请求。在该图中，对于特定的一分钟窗口，共有四个用户，他们的提示和补全 token 各不相同，因为他们向
    LLM 发出的请求用于不同目的（例如，聊天、摘要）。因此，每个用户消耗的 token 数量不同。假设它们在同一分钟时间窗口内发出请求，那么这四个请求的总 token
    数为 9500。因此，`TPM`为 9500。


    ![](img/501717_2_En_2_Fig12_HTML.jpg)


    **图 2-12** 将`TPM`概念化为 LLM 容量的示意图


    ### 配额与服务限制


    现在我们理解了`TPM`的概念，请访问 [Azure OpenAI 服务配额和限制页面](https://learn.microsoft.com/en-us/azure/ai-services/openai/quotas-limits)。^(³²)


    Azure OpenAI 服务限制主要取决于模型、模型版本、部署类型（即用即付或`PTU`）以及区域。配额和限制页面列出了即用即付部署模型的限制。我们将在下一节讨论`PTU`限制。


    首先，我们将查看该页面的 [区域配额限制](https://learn.microsoft.com/en-us/azure/ai-services/openai/quotas-limits#regional-quota-limits)^(³³)
    部分。此部分的表格显示了不同区域中每个模型的`TPM`，如图 2-13 所示。例如，`GPT-3.5 Turbo 16K`的`TPM`在`eastus`等某些区域为
    240k，但在`japaneast`等其他区域为 300k。


    ![](img/501717_2_En_2_Fig13_HTML.jpg)


    **图 2-13** 区域配额限制（TPM）


    接下来，查看 [配额和限制参考](https://learn.microsoft.com/en-us/azure/ai-services/openai/quotas-limits#quotas-and-limits-reference)^(³⁴)，找到名为“每次请求的最大提示
    token 数”的限制，如下图所示 2-14。


    ![](img/501717_2_En_2_Fig14_HTML.jpg)


    **图 2-14** 配额和限制参考


    这是模型每次请求能够接收的最大提示 token 数，我们在本章前面将其称为上下文窗口大小。点击“限制值”列中的 [Azure OpenAI 服务模型链接](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models)^(³⁵)。


    找到描述你将使用的模型可用性和区域的部分。例如，我们访问了 [GPT-3.5 Turbo 模型可用性部分](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models#gpt-35-turbo-model-availability)^(³⁶)，并注意到我们感兴趣部署的模型——`GPT-3.5
    Turbo 16K 0613`——在美国东部区域可用，其最大 token 请求数为 16,384，如下图所示 2-15。


    ![](img/501717_2_En_2_Fig15_HTML.jpg)


    **图 2-15** 按模型和区域划分的每次请求最大 token 大小


    总结整个示例，如果我们打算在美国东部区域部署一个`GPT-3.5 Turbo` LLM 解决方案，根据上述三个图表^(³⁷)中的表格，我们可以了解到在即用即付模型中，我们的服务限制如下：


    *   来自*所有*请求的提示 token 总和不得超过 240k 个 token。

    *   任何单个请求^(³⁸)的提示 token 不得超过 16,384 个 token。

    *   该模型在美国东部区域可用。


    要了解上述配额和限制是如何执行的，请以图 2-13 为例。考虑在一分钟时间范围内传入的请求 token：20k、15k、200k^(³⁹) 和 6k。最后一个请求（6k
    token）将使`TPM`达到 241k，从而超过`GPT-3.5 Turbo`模型的 240,000 `TPM`限制（图 2-13：区域配额限制（TPM））。


    接下来，每个模型还对单个请求的最大 token 数有服务限制。再次参考图 2-13，尽管 200k token 的请求在请求时未超过`TPM`限制而被允许通过，但
    LLM 将无法处理它，因为该请求本身超过了 16,384 个 token 的配额（图 2-15：按模型和区域划分的每次请求最大 token 大小）。


    ![](img/501717_2_En_2_Fig16_HTML.jpg)


    **图 2-16** 按`TPM`和配额划分的服务限制

    '
- fmt: '### Peak Users and TPM in PayGo Model


    To put it in context, let us refer again to our use cases referenced in Table
    [2-2](#501717_2_En_2_Chapter.xhtml#Tab2). For the “Chat with your own data” scenario,
    the number of prompt tokens is 2850. Therefore, if we are going to deploy a solution
    based on this use case in the East US region, the maximum number of users the
    service can support under the PayGo model is approximately 84 users per minute
    (240,000 / 2850).


    This concludes our discussion for how quota and service limits are enforced under
    the PayGo deployment scenario. One thing to note is that the limits may sometimes
    be lower depending on other factors in the region. The TPM may seem lower if the
    region is heavily used because there may not be enough compute resources available
    to support the demand from all the PayGo customers at that time. The best way
    to look at it is to use internet broadband service as an analogy. Even though
    your subscribed service can potentially provide you with up to 1 Gbps of bandwidth,
    that may be significantly less when more people are online in your neighborhood
    at the same time as you, and everyone is streaming or gaming. Because of that,
    the PayGo model may be unpredictable in performance.


    ### PTU Capacity Calculator


    If you need a more consistent and predictable performance, then the PTU model
    may be a better approach to deploying LLM workloads. Remember, the PTU model is
    based on provisioned compute. Therefore, you are always guaranteed capacity.


    There is a PTU capacity calculator in the Azure OpenAI Studio, and if you have
    already been exploring Azure OpenAI in the PayGo model, you can access the calculator
    as shown in Figure [2-17](#501717_2_En_2_Chapter.xhtml#Fig17) below. But do not
    worry if you have not started experimenting with Azure OpenAI yet because we will
    revisit this again in detail in Chapter [3](#501717_2_En_3_Chapter.xhtml).


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig17_HTML.jpg)


    Figure 2-17


    The PTU capacity calculator in Azure OpenAI Studio


    ### Peak Users and TPM in PTU Model


    Without having access to the Azure PTU calculator yet at this point, we can refer
    to Table [2-4](#501717_2_En_2_Chapter.xhtml#Tab4). Table [2-4](#501717_2_En_2_Chapter.xhtml#Tab4)
    uses the “Chat with your own data” use case in Table [2-2](#501717_2_En_2_Chapter.xhtml#Tab2)
    above (prompt=2850 tokens, completion=100 tokens); we can estimate the peak number
    of users per minute that can be serviced.


    Table 2-4


    Estimated peak requests for each model at minimum PTUs if prompt=2850 tokens and
    completion=100 tokens


    | Model | Minimum PTUs | TPM | Peak requests/users per minute |

    | --- | --- | --- | --- |

    | `gpt-3.5-turbo` (16k) 1106 | 50 | Prompt = 2850Completion = 100 | 171 |

    | `gpt-3.5-turbo` (16k) 0125 | 50 | Prompt = 2850Completion = 100 | 240 |

    | `gpt-4` (8k) 0613 | 100 | Prompt = 2850Completion = 100 | 17 |

    | `gpt-4` (8k) 0125 | 100 | Prompt = 2850Completion = 100 | 25 |

    | `gpt-4` (32k) 0613 | 200 | Prompt = 2850Completion = 100 | 25 |


    A few things to note from Table [2-4](#501717_2_En_2_Chapter.xhtml#Tab4):


    *   You might sometimes see TPM referred to as a single dimension and not broken
    into prompt versus completion tokens, but for a more accurate estimate of peak
    users, we should always define the number of tokens of each type. Remember that
    prompt tokens are less expensive than completion tokens, but the number of tokens
    needed for prompting is usually higher than for completion.


    *   The observed numbers for prompt and completion tokens by use cases (Table
    [2-2](#501717_2_En_2_Chapter.xhtml#Tab2)) are provided as a guidance. It is best
    that you use actual observed prompt and completion tokens in your environment.


    *   Use the capacity calculator to determine the number of PTUs required for your
    use case, which we will discuss in detail in Chapter [3](#501717_2_En_3_Chapter.xhtml).


    Figure [2-18](#501717_2_En_2_Chapter.xhtml#Fig18) below summarizes the comparison
    of TPM between PayGo and PTU for the different models.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig18_HTML.jpg)


    Figure 2-18


    TPM for the different models in PayGo versus PTU


    When you surpass the TPM limit, Azure OpenAI will return a 429 error, as shown
    in Figure [2-19](#501717_2_En_2_Chapter.xhtml#Fig19) below. We will look at ways
    to handle this error in later chapters.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig19_HTML.jpg)


    Figure 2-19


    429 error when TPM limit is exceeded


    ## Working with Large Language Models


    Unlike traditional AI and ML models, you do not need to train the LLM before using
    it. Earlier in the chapter, we learned how tokenization converts language into
    numbers. The LLM is trained such that it can use the tokenized content to calculate
    the variance between words and sentences. The degree of variance between words
    and sentences depends on how similar or different they are. The more similar the
    words and sentences are, the smaller the variance. This is the simplest way of
    understanding what an LLM does, which is why it is sometimes referred to as a
    “language calculator.”


    At no point in time would you need to include your content in the LLM and train
    it. Nor does the LLM learn or identify patterns based on your content over time.
    Therefore, the LLM is an AI model that only understands language but not knowledge.^([^(40)](#fn40))


    OpenAI, the company, remains the owner of the various GPT models. They will be
    responsible for retraining the LLM with new parameters and releasing new models
    and versions (e.g., GPT-3.5 to GPT-4, GPT-4 0613 to GPT-4 0125).


    However, if you want to include parameters to make your LLM unique to your needs,
    that is the only time where you will be infusing your proprietary content to the
    base LLM. This is known as fine-tuning. Otherwise, you will be interacting with
    the LLM through a process known as prompt engineering.'
