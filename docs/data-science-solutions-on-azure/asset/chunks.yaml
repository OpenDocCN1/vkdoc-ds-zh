- fmt: "# Beyond Chatbots\n\nLLMs can be integrated inside of applications, regardless\
    \ of whether they are cloud-based applications (Web Apps) or software installed\
    \ on a computer. We think the easiest way to refer to this use case as *copilots*\
    \ just like the Microsoft Copilots^([^(79)](#fn79)) associated with each product.\
    \ In fact, these Microsoft Copilots were built using `Semantic Kernel`.\n\nAlthough\
    \ the term “copilot” has been loosely used to refer to anything that is LLM-enabled,\
    \ including chatbots, we feel that copilots should only refer to LLM-enabled applications.\
    \ This means that the copilot resides within the application and is part of the\
    \ solution. You do not have to leave the system to use the LLM. As you use the\
    \ application, the LLM is actively assisting you.\n\nFor example, with GitHub\
    \ copilot, as you start coding, the copilot starts suggesting the next lines of\
    \ code. It also helps with debugging and can offer to explain and/or fix problems.\
    \ GitHub Copilot is an extension that is installed into IDEs such as Visual Studio\
    \ Code and Visual Studio,^([^(80)](#fn80)) thereby extending the IDEs. Likewise,\
    \ when you start a new document in Word, the M365 Copilot gives you the option\
    \ to provide a prompt for the copilot to help you with your writing task.\n\n\
    `Semantic Kernel` allows developers to implement different plugins, including\
    \ AI plugins, so new and existing code can now benefit from being LLM-enabled.\
    \ Therefore, we are proposing two differentiated categories of use cases – Chatbots\
    \ versus Copilots.\n\n## Real-Time Data\n\nOne of the shortcomings of LLMs is\
    \ the timebound data that is restricted to when the model was trained. In Chapter\
    \ [4](#501717_2_En_4_Chapter.xhtml), we also looked at the RAG architecture that\
    \ grounds the LLM with curated data sources. However, this is still based on time-bound\
    \ data sources.\n\nA compelling use case for `Semantic Kernel` is the ability\
    \ for the LLM to get real-time data from web services. For example, with `Semantic\
    \ Kernel`, the LLM can query a flight’s status from web services to find out its\
    \ flight schedule. An investment tracker application, when asked in natural language\
    \ what the current top market movers for the day is, can connect to web services\
    \ to get that information and research on latest news that may have caused such\
    \ a movement.\n\n## Perform Tasks\n\nAside from the tasks of retrieving information,\
    \ creating content, or answering questions, the other benefit of using `Semantic\
    \ Kernel` is to carry out tasks. For example, after looking up flight status and\
    \ price, `Semantic Kernel` can initiate purchasing of an airline ticket, or book\
    \ hotels, etc.\n\n## Agents and Copilots\n\nAs mentioned above, an agent is a\
    \ representation of an LLM, and its purpose is to help answer questions and automate\
    \ tasks. A copilot is a special type of agent that can help answer questions but\
    \ does not automate tasks. That is why many use cases, for now, are copilots because\
    \ they are relatively easier to implement and also safer since no tasks are being\
    \ automated. Copilots work alongside humans to make suggestions and answer questions,\
    \ but the human is always in control and responsible for executing any task recommended\
    \ by the copilot.\n\nOnce a copilot has been deployed, it can later be turned\
    \ into a full-fledged agent; therefore, there is no need to rebuild from scratch.\n\
    \n## Hands-On Exercise 7-1: Getting Started with Semantic Kernel\n\nIn this first\
    \ hands-on exercise, we will use `Semantic Kernel` to interact with Azure OpenAI.\
    \ `Semantic Kernel` supports Python and C#. In fact, a differentiator from other\
    \ frameworks, like LangChain,^([^(81)](#fn81)) is `Semantic Kernel`’s native support\
    \ for C#. As such, we will use C# for this hands-on exercise.\n\nWe will use a\
    \ retail scenario in this chapter. The scenario is to use `Semantic Kernel` and\
    \ Azure OpenAI to help with customer and inventory management. For this first\
    \ use case, we would like to build an agent that helps with creating marketing\
    \ correspondence.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig3_HTML.jpg)\n\
    \nFigure 7-3\n\nShowing the terminal window in VS Code\n\n1.  From the Azure Portal,\
    \ retrieve your following information from your Azure OpenAI endpoint. You can\
    \ also use the same model, and therefore values, from previous hands-on exercises:\n\
    \    1.  Deployment name\n    2.  Azure OpenAI endpoint (URL)\n    3.  Azure OpenAI\
    \ key\n\n2.  In your development environment, create a new folder for this exercise\
    \ (e.g., if you have cloned the repo for this chapter, you can create a new folder\
    \ in the local repo).\n\n3.  Launch a new Visual Studio Code window, and select\
    \ Open Folder from VS Code’s Explorer view.\n\n4.  Navigate to, and select, the\
    \ folder that you created in step 2.\n\n5.  From the View menu, select Terminal,\
    \ as shown in Figure [7-3](#501717_2_En_7_Chapter.xhtml#Fig3) below.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig4_HTML.jpg)\n\
    \nFigure 7-4\n\nCreating a new C# .Net console application\n\n6.  As shown in\
    \ Figure [7-4](#501717_2_En_7_Chapter.xhtml#Fig4), in the in-editor Terminal window,\
    \ type the following command to create a new .Net console application:\n\n```csharp\n\
    dotnet new console\n```\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig5_HTML.jpg)\n\
    \nFigure 7-5\n\nInstalling a NuGet extension in VS Code\n\n7.  Also as shown in\
    \ Figure [7-4](#501717_2_En_7_Chapter.xhtml#Fig4), take note that the Console\
    \ app was created successfully and new files and folders have been created in\
    \ the project folder (`obj`, `csproj` file, and `program.cs`).\n\n8.  Next, we\
    \ will need to install the `Semantic Kernel` module from Nuget. We can do this\
    \ via the terminal as well, but a more friendly GUI approach is to install a Nuget\
    \ extension to VS Code (if you do not already have it installed). You can do so\
    \ by selecting the Extensions option in VS Code and typing Nuget in the search\
    \ box. We used NuGet Gallery for this exercise, as shown in Figure [7-5](#501717_2_En_7_Chapter.xhtml#Fig5).\n\
    \n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig6_HTML.jpg)\n\nFigure 7-6\n\
    \nUsing NuGet Gallery extension to install the Semantic Kernel NuGet package\n\
    \n9.  Referring to Figure [7-6](#501717_2_En_7_Chapter.xhtml#Fig6), once the NuGet\
    \ Gallery extension is installed, you should have a new NUGET menu option in the\
    \ terminal window. If you do not see this option, save your project, restart VS\
    \ Code, and reopen the project. Click NuGet, type `semantic-kernel` in the search\
    \ box, and select `Microsoft.SemanticKernel @Microsoft` in the results.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig7_HTML.jpg)\n\
    \nFigure 7-7\n\nAdding NuGet package to project\n\n10. Click ![](images/501717_2_En_7_Chapter/501717_2_En_7_Figa_HTML.jpg)\
    \ next to the `csproj` file as shown in Figure [7-7](#501717_2_En_7_Chapter.xhtml#Fig7)\
    \ below.\n\n![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig8_HTML.jpg)\n\n\
    Figure 7-8\n\nSemantic Kernel C# Program.cs file\n\n11. Open `Program.cs`.\n\n\
    12. Comment out line #2 and copy the code from [`Program.cs` file in the exercise-7-1\
    \ folder](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-7/exercise-7-1/Program.cs)^([^(82)](#fn82))\
    \ to your `Program.cs` file. Your `Program.cs` file should look like what is seen\
    \ in Figure [7-8](#501717_2_En_7_Chapter.xhtml#Fig8) below. Replace the variables^([^(83)](#fn83))\
    \ for `azureEndpoint`, `model`, and `apikey` with values from your Azure OpenAI\
    \ deployment.\n\n13. Save everything by selecting File ➤ Save All."
