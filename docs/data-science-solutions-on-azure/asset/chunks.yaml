  trans: "\n### 动手练习 9-4：Azure 语音转文本与翻译\n\n在本动手练习中，我们将探索 Azure AI 语音服务。\n\n*场景：我们需要接收传入的语音邮件，转录音频内容，如果非英文则进行翻译。*\n\
    \n有多种方法可以更高效地处理此场景，而无需向不同服务发出多个 API 调用；例如，使用新的 GPT-4 Whisper 模型，只需一次调用即可解决。然而，为了演示如何将多个\
    \ Azure AI 服务串联起来，我们将先使用 AI 语音服务转录文本。然后，我们将调用 AI 翻译服务将文本翻译成英文。最后，我们将使用 GPT-3.5T\
    \ 创建转录摘要、推荐后续操作项，并评估翻译后语音邮件的情绪倾向。\n\n本练习的设计中，我们将使用 Postman 并设置环境变量，以将一个 AI 服务的输出传递给下一个。如果您不熟悉\
    \ Postman 环境，请查阅相关文档。使用 Postman，我们可以对工作流或 RPA 流程进行建模，如图 9-18 所示。\n\n![](img/501717_2_En_9_Fig18_HTML.jpg)\n\
    \n**图 9-18** 将多个 Azure AI 服务串联成工作流（在 Postman 中建模）\n\n![](img/501717_2_En_9_Fig19_HTML.jpg)\n\
    \n**图 9-19** 创建 Azure AI 语音服务\n\n1. 访问 GitHub 仓库 ([`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-9/wav_files`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/tree/main/Chapter-9/wav_files))\
    \ 并下载音频文件样本。其中有三个`wav`文件，它们是来自 [`https://freesound.org`](https://freesound.org)\
    \ 的开源示例`wav`文件。一个`wav`文件是英文的，另外两个是中文（简体普通话）的。我们将在本练习中使用其中一个文件。\n2. 启动 Azure 门户\
    \ ([`https://portal.azure.com`](https://portal.azure.com)) 并转到你的 AI 服务。\n3. 从菜单窗格中选择“语音服务”，然后点击\
    \ ![](img/501717_2_En_9_Figq_HTML.jpg)，如图 9-19 所示。\n\n![](img/501717_2_En_9_Fig20_HTML.jpg)\n\
    \n**图 9-20** AI 语音服务的密钥和区域\n\n4. 按照提示创建一个新的语音服务实例。创建完成后，点击 ![](img/501717_2_En_9_Figr_HTML.jpg)。\n\
    5. （家庭作业/可选）在语音服务的概览页面上，可以通过点击链接自由探索 Speech Studio。我们*不会*审查 Speech Studio，但这是一个直观的\
    \ UI，您可以自行导航和探索，不会遇到问题。\n6. 复制区域和一个密钥，以便稍后在此练习（Postman）中使用，如下方图 9-20 所示。将信息暂时粘贴到你喜欢的轻量级文本编辑器中，比如记事本或\
    \ Notepad++。\n\n![](img/501717_2_En_9_Fig21_HTML.jpg)\n\n**图 9-21** 设置 Postman\
    \ 请求以接受二进制文件\n\n7. 对于请求体，选择 binary，然后点击 ![](img/501717_2_En_9_Figs_HTML.jpg)，如下方图\
    \ 9-21 所示。然后导航到你从步骤 1 下载的`wav`文件所在位置。\n8. 重复步骤 2 到 6 来创建一个 AI 翻译器服务。\n9. 启动 Postman\
    \ 并创建一个新的 POST 请求，参数如下：\n\n- 类型：POST\n- URL：`https://<REGION>.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=zh-CN`（例如\
    \ `https://westus2.stt.speech.microsoft.com/speech/recognition/conversation/cognitiveservices/v1?language=zh-CN`）\n\
    - 请求头：\n  - `Ocp-Apim-Subscription-Key`：来自步骤 6 的密钥\n  - `Content-Type`：`audio/wav`\n\
    \n![](img/501717_2_En_9_Fig22_HTML.jpg)\n\n**图 9-22** 向 AI 语音服务的 Postman POST\
    \ 调用添加测试脚本\n\n10. 导航到步骤 1 中下载的`wav`文件所在位置，并选择名为“`612867__petehaase__vm-mandarin.wav`”的文件。\n\
    11. 你会注意到文件名旁边有一个 ![](img/501717_2_En_9_Figt_HTML.jpg)。这表示文件已选中但尚未上传。点击 ![](img/501717_2_En_9_Figu_HTML.jpg)\
    \ 并确认文件将被上传并可供 Postman 团队中的其他人使用。\n12. 点击 Tests 并输入下面的代码片段，如图 9-22 所示。然后点击 ![](img/501717_2_En_9_Figv_HTML.jpg)。\n\
    \n```\nvar jsonData = JSON.parse(responseBody);\npostman.setEnvironmentVariable(\"\
    Transcript\", jsonData.DisplayText);\n```\n\n![](img/501717_2_En_9_Fig24_HTML.jpg)\n\
    \n**图 9-24** 向 AI 翻译服务的 Postman POST 调用添加测试脚本\n\n![](img/501717_2_En_9_Fig23_HTML.jpg)\n\
    \n**图 9-23** 创建对 AI 翻译服务的 POST 请求\n\n13. 使用以下信息创建一个新的 POST 请求，如图 9-23 所示：\n\n\
    - 类型：POST\n- URL：[`https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=en-US`](https://api.cognitive.microsofttranslator.com/translate?api-version=3.0&to=en-US)\n\
    - 请求头：\n  - `Ocp-Apim-Subscription-Key`：AI 翻译服务的密钥\n  - `Content-Type`：`application/json`\n\
    \  - `Ocp-Apim-Subscription-Region`：AI 翻译服务所部署到的区域\n\n14. 点击 Tests 并输入下面的代码片段，如图\
    \ 9-24 所示。然后点击 ![](img/501717_2_En_9_Figw_HTML.jpg)。\n\n```\nvar jsonData = JSON.parse(responseBody);\n\
    postman.setEnvironmentVariable(\"Translate\", jsonData[0].translations[0].text);\n\
    ```\n\n![](img/501717_2_En_9_Fig25_HTML.jpg)\n\n**图 9-25** 向 Postman 环境添加变量\n\n\
    15. 在 Postman 中，点击 ![](img/501717_2_En_9_Figx_HTML.jpg)，然后点击 ![](img/501717_2_En_9_Figy_HTML.jpg)\
    \ 创建一个新环境。将新环境命名为“Chapter 9 env”。\n16. 使这个新环境成为活动环境，方法是将鼠标悬停在环境名称上，然后点击环境名称右侧的\
    \ ![](img/501717_2_En_9_Figz_HTML.jpg)。环境的符号将变为 ![](img/501717_2_En_9_Figaa_HTML.jpg)，表示它现在是活动环境。\n\
    17. 点击变量框添加两个名为“`Transcript`”和“`Translate`”的新变量，如图 9-25 所示。然后点击 ![](img/501717_2_En_9_Figab_HTML.jpg)。\n\
    \n![](img/501717_2_En_9_Fig26_HTML.jpg)\n\n**图 9-26** 语音邮件的转录文本（中文）\n\n18. 转到“集合”。\n\
    19. 选择针对 AI 语音服务的 POST 调用，然后点击 ![](img/501717_2_En_9_Figac_HTML.jpg)。\n20. 转到“环境”并注意，`Transcript`\
    \ 变量现在包含了语音邮件的转录文本，如图 9-26 所示。\n\n![](img/501717_2_En_9_Fig27_HTML.jpg)\n\n**图\
    \ 9-27** 语音邮件转录文本从中文到英文的翻译\n\n21. 转到“集合”，现在选择针对 AI 翻译服务的 POST 调用，然后点击 ![](img/501717_2_En_9_Figad_HTML.jpg)。\n"
