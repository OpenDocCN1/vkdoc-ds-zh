    ## Plugins and Functions


    Plugins^([^(87)](#fn87)) were previously called Skills. As mentioned above, plugins
    in Semantic Kernel enable developers to create extensions for the LLM to carry
    out tasks. Plugins can be combined to form business-based plugin sets to form
    functional tasks.


    Plugins can do one or more tasks. The capabilities of plugins are called functions.
    Therefore, at a high level, a plugin is a group of functions that can be exposed
    to LLMs.


    ### Style


    Continuing with our retail scenario, an example of business functions for our
    retail store can include orders, returns, customer relations, sales staff, and
    inventory. We can create a business-based plugin with functional tasks as shown
    in Figure [7-10](#501717_2_En_7_Chapter.xhtml#Fig10) below.


    ![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig10_HTML.jpg)


    Figure 7-10


    Plugin structure for a retail store


    Now, if we want to send an email to customers who have ordered a particular item
    in the past that there is a sales event of the same or related items, we can issue
    the following instructions to the LLM:


    *   `Please send an email to customers who have ordered ItemSKU 123-456 or similar
    and opted in to receiving marketing information.`


    We can find a combination of different plugins from Figure [7-3](#501717_2_En_7_Chapter.xhtml#Fig3)
    and complete the task based on the plugins Item + Orders + Customers + MarketingList.


    ### Templates


    Plugins in Semantic Kernel are defined by using templates that follow a specific
    format. The plugin template’s format is a collection of prompts and the associated
    configuration. Figure [7-11](#501717_2_En_7_Chapter.xhtml#Fig11) below depicts
    the format of a Semantic Kernel plugin template.


    ![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig11_HTML.jpg)


    Figure 7-11


    Format of a Semantic Kernel plugin template


    Using the example from Figure [7-10](#501717_2_En_7_Chapter.xhtml#Fig10), the
    Semantic Kernel template for our retail store (with two of the plugins) would
    look like the one in Figure [7-12](#501717_2_En_7_Chapter.xhtml#Fig12) below.


    ![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig12_HTML.jpg)


    Figure 7-12


    Semantic Kernel template sample


    The **skprompt.txt** file holds the functional prompt for the task and supports
    parameterization. Parameters are declared using the format {{$paramters name}}.
    For example, the skprompt.txt for MarketList can be as follows:


    ```

    Email customers in the list {{$input$}} using {{$language}} with {{$content}}

    ```


    The job of this function is to email customers in their language of preference.
    These customers are identified in language-specific mailing lists. Therefore,
    we are passing three parameters – the mailing list name, the language to use in
    the email, and the content of the email.


    **config.json** contains configuration-specific details specific to the LLM, such
    as maximum number of tokens, temperature, etc. An example of how the Semantic
    Kernel template for the email function described above would look like is shown
    in Figure [7-13](#501717_2_En_7_Chapter.xhtml#Fig13) below.


    ![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig13_HTML.jpg)


    Figure 7-13


    Example of a Semantic Kernel template for the mail function in our example


    Through plugins, we can organize work based on business scenarios in such a way
    that the LLMs can be instructed on how to execute the different business functions.


