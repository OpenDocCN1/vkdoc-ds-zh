    ## Summary


    In this chapter, we have highlighted all the changes and advancement in AI in
    the last three years, with the biggest one being generative AI. As such, where
    we spent the first edition providing a balanced exposure to traditional data science
    using Azure Machine Learning and Applied Science using Azure Cognitive Services,
    in this second edition, we will focus more on generative AI. We feel that it is
    a fitting evolution of AI and fits nicely with the real-life transformation that
    organizations, as society in general, are undergoing.


    Since we, as authors, work primarily in building Microsoft-based solutions, we
    will use Azure OpenAI as the de facto generative AI technology. However, bear
    in mind that as far as generative AI and large language models go, there are other
    open-source LLM models as well as technology offered by Microsoft competitors,
    such as Google and AWS. Google Bard, PaLM2, Codey, and Imagen are alternatives
    and competitors to the Azure OpenAI stack, as is AWS’s $4 billion investment in
    Anthropic AI.^([^(20)](#fn20)) Regardless of the technology stack, the current
    state of generative AI is such that all the core concepts that we cover in this
    book remain relevant, the technical reference architectures such as RAG are also
    relevant, techniques for testing and prompt engineering are also platform agnostic,
    and so are the organizational and societal impacts. At the time of this writing,
    Azure OpenAI and the GPT models are clearly the most popular and best performing
    LLMs available. The benefit of being first to market is that there are more real-world
    based projects associated with Azure OpenAI, which is what the use cases and scenarios
    in this book are derived from.


