- fmt: '# Search Engines: From Keyword to Semantic Search


    Let’s take a step back and understand the most basic type of search – **keyword
    search.**


    `Keyword`-based search utilizes `Apache Lucene` for indexing and querying and
    employs the `BM25` ranking algorithm to score results. It involves entering words
    or phrases into a search engine, which then searches the Internet for pages containing
    those specific keywords. Essentially, it operates by matching the keywords present
    in your query with those in the database and delivering the corresponding results.
    This can further be categorized in “Keyword” and “Search Query” – in casual conversations,
    these words have been used interchangeably, but there is actually a notable difference
    that plays an important role in latest search techniques.


    A keyword can be thought of as the conceptual essence of a search query, representing
    an abstract version derived from various search inputs.


    On the other hand, a search query or search term is the specific word or sequence
    of words that an individual inputs into a search engine’s search field. It serves
    as the practical embodiment of a keyword, though it may include misspellings,
    additional or jumbled words, or it might exactly match the keyword itself as shown
    in Figure [4-5](#501717_2_En_4_Chapter.xhtml#Fig5).


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig5_HTML.jpg)


    Figure 4-5


    Keyword-based search


    ## Limitations of keyword search


    1. **Limited Match Scope:** Such a search is inherently limited by its reliance
    on exact match queries. Its primary function is to identify if a query matches
    specific text within a large dataset. More sophisticated search engines attempt
    to overcome this limitation by employing techniques such as lemmatization and
    stemming, which allow for the recognition of variations of a word, like “send,”
    “sent,” and “sending,” as equivalent. However, when a query uses different terminology
    to describe a concept not directly mirrored in the corpus (the collection of documents
    being searched), the search can fail, leading to user dissatisfaction. In essence,
    such search engines lack a true understanding of the content within the corpus.


    2. **Inefficient with Conversational Queries:** As voice search and natural language
    processing become more prevalent, users increasingly use conversational language
    for their search queries. Traditional search technologies often fail to accurately
    understand these types of queries, which can lead to user frustration and disengagement.


    3. **Lack of Personalization:** This is a significant drawback of traditional
    keyword-based search systems as this generic approach overlooks the distinct preferences
    and habits of each user. Such systems offer little to no personalization because
    they cannot adapt based on user interactions.


    An example of a query using the default `BM25` ranking relies on term frequency
    and proximity. For the query “what hotel has a good restaurant on site,” the `BM25`
    algorithm returns matches in the sequence displayed in below screenshot (Figure
    [4-6](#501717_2_En_4_Chapter.xhtml#Fig6)).


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig6_HTML.jpg)


    Figure 4-6


    Keyword search `BM25` hotel example


    However, a more sophisticated alternative known as “semantic search” addresses
    these limitations by leveraging artificial intelligence. This type of search engine
    goes beyond merely processing the exact words you type. Instead, it comprehends
    the intent and significance of your query, capturing concepts and placing your
    search within context. This approach yields results that are significantly more
    pertinent than those provided by traditional keyword-based searches.


    # Semantic Search


    Semantic search employs artificial intelligence (AI) and natural language processing
    (NLP) to interpret and answer search queries in a way that’s more aligned with
    natural, contextual human communication. AI powers the system’s capacity to learn
    and evolve, whereas NLP facilitates the understanding and generation of human-like
    language. Rather than merely matching keywords, AI search aims to comprehend the
    significance and context of your query to more accurately determine your intent.


    For instance, when you look up “Apple stock price,” an AI search engine is likely
    to interpret that you want the stock price of the tech company Apple, rather than
    the cost of the fruit. This interpretation is possible because the AI analyzes
    vast datasets to grasp the semantic connections between words and phrases. To
    grasp how semantic search functions, it’s useful to explore the broader field
    of semantics, which is the study of meaning in language. Semantics considers various
    factors, including


    1. **Word Meaning:** This involves understanding the definitions of individual
    words. For example, the word “bank” can refer to the side of a river or a financial
    institution. The meaning is determined by the context in which it is used.


    2. **Sentence Meaning and Structure:** This focuses on how words combine to form
    sentences and convey specific meanings. Sentence structure, or syntax, plays a
    critical role in this. For instance, “The cat chased the mouse” has a different
    meaning from “The mouse chased the cat,” despite containing the same words.


    3. **Context:** Context involves the surrounding text or situation in which a
    word or sentence is used. It helps determine the intended meaning. For example,
    the word “bark” can mean the sound a dog makes or the outer layer of a tree, depending
    on the context.


    4. **Relationships Between Words:** This examines how words are related to one
    another, such as through associations, hierarchies, or dependencies. For example,
    in the sentence “The boy kicked the ball,” “boy” is the subject, and “ball” is
    the object, with “kicked” describing the action.


    5. **Synonyms:** These are different words that have similar or identical meanings.
    Recognizing synonyms helps in understanding that “happy” and “joyful” can often
    be used interchangeably, enriching comprehension and search capabilities.


    6. **Cultural Idioms:** Idioms are phrases that have meanings not deducible from
    the individual words. For example, “kick the bucket” means “to die,” and understanding
    such idioms requires cultural knowledge beyond literal word meanings.


    By considering all these aspects, semantic search engines can provide more accurate
    and relevant results based on the user’s intent and the nuances of language.


    Same query example of semantic ranking (“what hotel has a good restaurant on site”),
    the results are reordered based on their semantic relevance. This time, the top
    result is a hotel with a restaurant, better aligning with user expectations. Figure
    [4-7](#501717_2_En_4_Chapter.xhtml#Fig7) is the screenshot for the semantic search
    response.


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig7_HTML.jpg)


    Figure 4-7


    Semantic search hotel example'
