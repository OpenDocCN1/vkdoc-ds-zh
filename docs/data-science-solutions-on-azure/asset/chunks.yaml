    \ 3-2** `p = 0.2`\n"
- fmt: "| Token | Value | Cumulative | Is cumulative > threshold? (Y/N) | Action |\n\
    | --- | --- | --- | --- | --- |\n| `sandy` | 0.4 | 0.4 | N | Accept |\n| `sunny`\
    \ | 0.2 | 0.6 | Y (just surpassed) | Accept |\n| `warm` | 0.2 | 0.8 | NA (not\
    \ applicable because already surpassed by previous token | Discard |\n| `peaceful`\
    \ | 0.15 | 0.95 | NA | Discard |\n| `tranquil` | 0.05 | 1.0 | NA | Discard |\n\
    \nSince there are two possible tokens, their probabilities will be normalized,\
    \ and then a sampling method known as Binomial^([^(65)](#fn65)) distribution can\
    \ be applied to select one of them to use in the response.\n\nIf there are more\
    \ than two possible tokens, for example, if we had `p=0.8`, as shown in Table\
    \ [3-3](#501717_2_En_3_Chapter.xhtml#Tab3) below where there are three possible\
    \ tokens, then Multinomial^([^(66)](#fn66)) distribution will be used to sample\
    \ the tokens in order to select one.\n\n**Table 3-3** `p = 0.8`\n\n| Token | Value\
    \ | Cumulative | Is cumulative > threshold? (Y/N) | Action |\n| --- | --- | ---\
    \ | --- | --- |\n| `sandy` | 0.4 | 0.4 | N | Accept |\n| `sunny` | 0.2 | 0.6 |\
    \ N | Accept |\n| `warm` | 0.2 | 0.8 | N | Accept |\n| `peaceful` | 0.15 | 0.95\
    \ | Y | Discard |\n| `tranquil` | 0.05 | 1.0 | NA | Discard |\n\n1. **Top-k:**\
    \ Top-k is an alternative to Top-p but is not used by OpenAI; hence, you do not\
    \ see that as a parameter that can be configured in AI Studio. However, for completeness,\
    \ we will briefly discuss this concept. Top-k simply selects the top `k` number\
    \ of tokens, e.g., if `k=3`, then the top 3 tokens will be selected – `sandy`,\
    \ `sunny`, and `warm`. After selection, the Binomial or Multinomial distribution\
    \ sampling will be applied, just like in Top-p.\n\n2. **Frequency Penalty:** This\
    \ parameter penalizes tokens that have been used in generating the response. This\
    \ reduces the likelihood of words being repeated in the text. Each time the word\
    \ is used, it is proportionately penalized to minimize further reuse. This parameter\
    \ is a value between 0 and 2, and the larger the number, the heavier the penalty\
    \ for each reuse of a word.\n\n3. **Presence Penalty:** This parameter applies\
    \ a one-time penalty to a token when it is first used in the response. It is an\
    \ additive penalty on top of the Frequency penalty and is also a value between\
    \ 0 and 2.\n\nIn the next hands-on exercise, we will modify the parameters and\
    \ observe how this affects the LLM’s responses. Before we do so, a few things\
    \ to know is that Temperature is often the parameter that is more used than Top-p,\
    \ and in most cases, you may not need to modify the Frequency penalty and Presence\
    \ penalty values unless there is a need to control the frequency of text being\
    \ used in the response.\n\nFor the Temperature setting, the rule of thumb is if\
    \ the desired response is not deterministic (factual based), then a value closer\
    \ to 0 should be used. If the desired response is more creative, then use a value\
    \ closer to 1.\n\n### Hands-On Exercise 3-5: Explore LLM Parameters and Behavior\n\
    \nIn this hands-on exercise, we will continue from the previous exercise by chatting\
    \ with the LLM via AI Studio. We will then make changes to the parameters we discussed\
    \ above and see if we notice changes in the response.\n\n![Figure 3-27](images/501717_2_En_3_Chapter/501717_2_En_3_Fig27_HTML.jpg)\n\
    \n**Figure 3-27** Chatting with the LLM through the AI Studio\n\n1. In AI Studio,\
    \ do not change any of the parameters for now, and just start chatting with the\
    \ LLM as shown in Figure [3-27](#501717_2_En_3_Chapter.xhtml#Fig27) below. Feel\
    \ free to use your own question or topic for this chat.\n\n2. Take note of the\
    \ default values for all the parameters because we will be making a change to\
    \ each one of them. But at the time of writing, because there is no option to\
    \ reset the parameters to their default value, we will need to manually change\
    \ the parameter values back to default when we are done with testing it and are\
    \ ready to move to the next parameter.\n\n3. Make a change to *Temperature*, and\
    \ then click ![icon](images/501717_2_En_3_Chapter/501717_2_En_3_Figd_HTML.jpg)\
    \ at the top of the middle pane each time you make a change to the Temperature.\n\
    \   1. Change the value of Temperature (or the current parameter being tested)\
    \ back to default and repeat Step 3 for:\n      1. Top-p\n      2. Frequency penalty\n\
    \      3. Presence penalty\n\n4. What did you observe for each parameter?\n\n\
    There are other features of the AI Studio which we will cover in later chapters.\n\
    \n## Summary\n\nThis chapter, we learned how to deploy Azure OpenAI and how to\
    \ interact with the LLM model via Postman. We also looked at the AI Studio, which\
    \ is the native UI that we can use to interact, experiment, and prototype our\
    \ LLM solution. In the process of exploring AI Studio, we introduced parameters\
    \ that we can use to configure the behavior of the LLM.\n\nIn the next chapter,\
    \ we will continue to explore OpenAI LLMs and start prototyping a solution by\
    \ grounding the LLM with data and introducing the Retrieval Augmented Generation\
    \ architecture, which is an approach designed to handle large data sources and\
    \ making it manageable for the LLM to consume.\n\nFootnotes [1](#501717_2_En_3_Chapter.xhtml#Fn1_source)\
