  trans: "\n# Prompt Flow 生命周期\n\nPrompt Flow 生命周期包含以下阶段，如图 5-14 所示。\n\n![](img/501717_2_En_5_Fig14_HTML.jpg)\n\
    \n图 5-14 Prompt Flow 响应\n\n1. **启动阶段：** 首先明确你要解决的具体业务挑战。\n   1. **确定业务挑战：** 明确你想利用\
    \ AI 解决的具体问题或把握的机遇。\n   2. **收集样本数据：** 收集能代表你所研究问题的初始数据样本。\n   3. **学习基础提示词创建并开发流程：**\
    \ 了解如何为你的数据创建简单的提示词，并构建一个能增强基础提示词功能的流程，增加应对业务挑战的能力。\n\n2. **实验阶段：**\n   1. **运行流程：**\
    \ 使用样本数据执行流程，观察其表现。\n   2. **评估性能：** 评估提示词在解决问题方面的效果。\n   3. **进行调整并重复：** 根据性能结果调整流程和提示词，直到获得满意的结果。\n\
    \n3. **评估与改进：**\n   1. **用更大规模的数据测试：** 在更广泛的数据集上运行流程，测试其在更大规模下的表现。\n   2. **评估效果：**\
    \ 审查结果，判断提示词和流程是否能有效解决问题。\n   3. **按需优化并为下一阶段做准备：** 进行必要的改进以提升性能，确保结果在进入下一步前符合你的标准。\n\
    \n4. **部署阶段：**\n   1. **优化流程：** 精细调整流程，以实现最大效率和效果。\n   2. **部署：** 将流程发布到生产环境，在真实场景中使用。\n\
    \   3. **监控性能并收集反馈：** 持续追踪流程在实时环境中的表现，关注任何问题，收集用户反馈，并不断迭代。\n\n通过遵循这个结构化的流程，Prompt\
    \ Flow 能帮助你系统地开发、测试、优化和部署 AI 解决方案，确保其稳健有效。现在，我们已经了解了 Prompt Flow 的基础知识，将继续我们的“端到端构建生成式\
    \ AI 应用”项目。下一步，我们将点击 Prompt Flow，在 Prompt Flow 可视化工具中打开项目，在那里我们将在更大的数据集上运行流程，并使用\
    \ Prompt Flow 内置的评估指标进行评估。图 5-15 展示了我们的项目在 Prompt Flow 中的外观。\n\n![](img/501717_2_En_5_Fig15_HTML.jpg)\n\
    \n图 5-15 在您的数据 RAG 上使用 Prompt Flow 展示 Azure OpenAI\n\n现在，我们可以详细地可视化我们的项目，并查看右侧的图表以了解查询执行情况。对于\
    \ `querySearchResource`，请确保选择已注册的索引，索引名称应与您的一致，如图 5-16 所示。\n\n![](img/501717_2_En_5_Fig16_HTML.jpg)\n\
    \n图 5-16 Prompt Flow 搜索资源配置\n\n下一步，我们可以点击聊天功能，验证项目数据关注的一些常见问题。我们可以看到，我们的系统消息已作为\
    \ `GenerateReply` 工具的 `role_info` 参数被采用，并且我们能够在右侧聊天界面上与我们的数据进行交互，如图 5-17 所示。\n\
    \n![](img/501717_2_En_5_Fig17_HTML.jpg)\n\n图 5-17 Prompt Flow 系统消息与聊天界面\n\n`GenerateReply`\
    \ 工具允许您测试提示词或连接设置的多个变体或变化。创建一个好的提示词并非易事；它需要具有创造性、清晰性和相关性。精心设计的提示词可以从语言模型中获得期望的响应，而设计不佳的提示词则可能导致错误、不相关或无意义的答案。因此，对提示词进行微调，使其在不同任务和领域都能良好运行至关重要。使用不同版本的提示词有助于您了解模型在不同条件下的行为，例如措辞、格式、上下文、温度或\
    \ `Top-k` 设置的改变。通过比较这些版本，您可以找到最佳的提示词和设置，从而提高模型的准确性、多样性或连贯性。这对于制作一个好的提示词尤为有益。\n\
    \n使用提示词变体的一些常见好处包括：\n\n1.  **提升内容质量：** 通过创建具有不同配置的多个提示词版本，您可以找到能生成满足您需求的高质量内容的最佳组合。\n\
    2.  **节省时间和精力：** 变体允许您轻松跟踪和比较不同提示词版本的性能，简化提示词调优历史的管理，并降低丢失先前迭代的风险。\n3.  **提高生产力：**\
    \ 精简提示词的优化流程，使您能够更高效地创建和管理多个变体，从而在更短的时间内获得更好的结果。\n4.  **便于轻松比较：** 变体使并排比较结果变得简单，帮助您就哪个提示词版本能产生最佳结果做出明智的决定。\n\
    \n在我们的项目中，我们将构建一个略有不同的提示词，并更改 GPT 模型，以比较我们的评估指标和模型响应。\n\n我们使用“生成变体”功能，基于基础提示词和\
    \ GPT-4 模型生成了另一个提示词变体。对于这个变体，我们还切换到了 GPT-4 Turbo 模型 `2024-04-09` API 版本，同时将两个变体的\
    \ `temp` 参数保持为 `0.7`，`max_token` 保持为 `800`，如图 5-18 所示。\n\n![](img/501717_2_En_5_Fig18_HTML.jpg)\n\
    \n图 5-18 Prompt Flow 生成提示词变体\n\n现在，我们至少有了两个变体，可以运行评估了。我们将选择自动评估，以便利用内置的评估指标。\n\
    \n支持两种场景：\n\n1.  **带上下文的问答：** 此场景适用于涉及回答用户查询并提供附带上下文信息的响应的应用。\n2.  **不带上下文的问答：**\
    \ 此场景适用于涉及回答用户查询并提供响应但不附带上下文信息的应用。\n\n由于我们有上下文（即来自我们 AI 索引的搜索结果/文档），我们将选择第一个场景。我们还将选择要评估的流程，因为我们将运行流程来获取问题的输出。选择要用于变体的节点，在我们的案例中是\
    \ `GenerateReply`。最后，选择变体——我们选择了 `Variant_0` 和 `Variant_1`，如图 5-19 所示。\n\n![](img/501717_2_En_5_Fig19_HTML.jpg)\n\
    \n图 5-19 Prompt Flow 自动评估设置\n\n接下来，我们将准备用于批量运行的数据——目前仅支持 `.csv` 和 `.jsonL` 格式。在评估流程时，请确保您的数据列与批量运行所需的输入相匹配。这将生成用于评估的输出。测试数据集应包含\
    \ `queries`（查询）和 `ground_truth`（标准答案），并可以选择包含 `Answer`（答案）——这将是针对每个问题由助手生成的响应。此外，您还可以包含\
    \ `chat_history`（聊天历史），但如果没有，可以将其留空为列表 `[]`。以下是我们的测试数据样本文件（图 5-20）。\n\n![](img/501717_2_En_5_Fig20_HTML.jpg)\n\
    \n图 5-20\n"
- fmt: '# Prompt Flow test data for evaluation run


    Next, set up data mapping for evaluation inputs. Select `chat_history` and `query`
    fields as shown in Figure [5-21](#501717_2_En_5_Chapter.xhtml#Fig21).


    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig21_HTML.jpg)


    Figure 5-21


    Prompt Flow adding dataset and mapping


    Select **Next** to configure evaluation metrics. Currently, we support two Microsoft-curated
    metric types for comprehensive application evaluation:


    1. **Performance and Quality Metrics:** Assess the overall quality and coherence
    of generated content. This includes `groundedness`, `relevance`, `coherence`,
    `fluency`, `GPT similarity`, and `F1 score`. For these metrics, we need to specify
    a GPT model for calculation; this can be done by choosing our Azure OpenAI connection
    and a deployment with either GPT-3.5 or GPT-4 models.


    2. **Risk and Safety Metrics:** Identify potential content risks and ensure the
    safety of the generated content. This includes self-harm-related content, hateful
    and unfair content, violent content, and sexual content. For these metrics, we
    don’t need to set up a connection or deployment. The Azure AI Studio safety evaluations
    use a GPT-4 model to provide content risk severity scores and reasoning, helping
    you assess potential content harms in your application.


    We can also configure a threshold to calculate the defect rate for risk and safety
    metrics. The defect rate represents the percentage of instances that exceed a
    certain severity level. Severity levels include `very low`, `low`, `medium`, and
    `high`. When we set a threshold, we determine which severity levels are considered
    defects. By default, the threshold is set to `medium`. This means that any instance
    with a severity level of `medium` or `high` will be counted toward the defect
    rate. We have the flexibility to adjust this threshold according to our specific
    risk tolerance and evaluation needs. We will keep it default – `medium` for this
    project.


    After we have selected all the metrics we want, we would need to data mapping
    for batch run testset as shown in Figure [5-22](#501717_2_En_5_Chapter.xhtml#Fig22).
    For data mapping:


    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig22_HTML.jpg)


    Figure 5-22


    Prompt Flow metrics and dataset mapping


    * **Context:** Documents or search results which will be used to generate `groundedness`
    score.

    * **Answer:** Our assistant-generated response.

    * **Question:** The set of queries we are testing our assistant against.

    * **Ground Truth:** Our expected response – this comes from the domain understanding
    of SMEs of the project data.


    Risk and safety metrics have been explained in the screenshot above, and we will
    talk in depth in next chapter. Next, we will discuss performance and quality metrics
    and how they are measured:


    1. **Groundedness:** The `groundedness` metric, scored on a range from 1 to 5
    (where 1 is ungrounded and 5 is grounded), measures how well the model’s generated
    answers align with source data, such as retrieved documents for question and answering
    or summarization tasks. It works by leveraging an Azure AI Content Safety Service
    custom language model fine-tuned for natural language inference (NLI) to evaluate
    whether claims are supported by the source document. This metric is crucial for
    applications requiring factual correctness and contextual accuracy, like information
    retrieval, question-answering, and content summarization. To use this metric,
    you need to provide a `question`, the `context`, and the generated `answer`, ensuring
    that AI responses are well supported by the provided `context`.


    2. **Relevance:** The `relevance` metric, scored on a scale from 1 to 5 (where
    1 is bad and 5 is good), measures how well the model’s generated responses are
    pertinent and directly related to the given questions. It evaluates the ability
    of answers to capture the key points of the context, with high scores indicating
    the AI system’s strong understanding and capability to produce coherent, contextually
    appropriate outputs. Low scores suggest that the responses may be off-topic, lack
    context, or fail to address the user’s queries adequately. This metric is essential
    for assessing the AI system’s performance in understanding input and generating
    relevant responses. To use this metric, you need to provide a `question`, the
    `context`, and the generated `answer`.


    3. **GPT-Similarity:** The `GPT-similarity` metric, scored on a scale from 1 to
    5 (where 1 is bad and 5 is good), measures the similarity between a source data
    (ground truth) sentence and the AI model’s generated response. It evaluates the
    likeness by creating sentence-level embeddings for both the ground truth and the
    generated prediction, capturing the semantic meaning and context in high-dimensional
    vector representations. This metric is particularly useful for objectively evaluating
    an AI model’s performance in text generation tasks where ground truth responses
    are available. It helps assess the semantic alignment of the generated text with
    the desired content, thereby gauging the model’s quality and accuracy. To use
    this metric, you need to provide the `question`, `ground truth answer`, and generated
    `answer`.


    4. **Coherence:** The `coherence` metric, scored on a scale from 1 to 5 (where
    1 is bad and 5 is good), measures how well a language model produces output that
    flows smoothly, reads naturally, and resembles human-like language. It assesses
    the model’s ability to generate coherent and readable text. This metric is particularly
    useful when evaluating the readability and user-friendliness of the model’s generated
    responses in real-world applications. To use this metric, you need to provide
    the `question` and the generated `answer`.


    5. **Fluency:** The `fluency` metric, scored on a scale from 1 to 5 (where 1 is
    bad and 5 is good), measures the grammatical proficiency of a generative AI’s
    predicted answer. It assesses how well the generated text conforms to grammatical
    rules, syntactic structures, and appropriate vocabulary usage, ensuring linguistically
    correct responses. This metric is particularly useful for evaluating the linguistic
    correctness of AI-generated text, making sure it adheres to proper grammar and
    syntax. To use this metric, you need to provide the `question` and the generated
    `answer`.


    6. **F1 Score:** The `F1 score`, ranging from 0 to 1, measures the ratio of shared
    words between the model’s generated response and the ground truth. It combines
    precision (shared words over total words in the generation) and recall (shared
    words over total words in the ground truth) to provide a balanced evaluation.
    This metric is useful for assessing the model’s accuracy and relevance in generating
    responses. Inputs required are the `question`, `ground truth answer`, and generated
    `answer`.


    7. **Retrieval Score:** The `retrieval score`, ranging from 1 to 5 (where 1 is
    bad and 5 is good), measures the relevance of the model’s retrieved documents
    to the given questions. It works by breaking down the user query into specific
    intents and evaluating if these intents or their answers are present or can be
    inferred from the retrieved documents. The score is calculated based on the fraction
    of intents that have relevant answers and is squared to penalize mistakes. This
    metric ensures the quality and appropriateness of the retrieved content, making
    it useful for guaranteeing that the documents retrieved are highly relevant to
    users’ questions. Required inputs include the `question`, `context`, and generated
    `answer`.'
