- fmt: "# November 17, 2023 – The Wild 72 Hours\n\nOn a Friday afternoon, November\
    \ 17, 2023, OpenAI’s board ousted CEO `Sam Altman^(5)` via a video conference\
    \ call without the involvement or knowledge of the chairman of the board, `Greg\
    \ Brockman`. Immediately after the ousting, `Mr. Brockman` was also invited to\
    \ a video conference and told he was removed from the board but will remain with\
    \ the company. `Mr. Brockman` quit in protest hours after the announcement.^(6)\
    \ The reason behind the upheaval at OpenAI was given as the board having lost\
    \ its confidence in `Mr. Altman`’s ability to lead the organization because he\
    \ “…was not consistently candid in his communications with the board, hindering\
    \ its ability to exercise its responsibilities.”\n\nOn the same Friday afternoon,\
    \ Microsoft CEO, `Satya Nadella`, was given the heads-up to `Mr. Altman`’s ousting\
    \ only minutes before it took place. This was despite Microsoft having invested\
    \ US$13 billion in OpenAI and owns 49% of the commercial arm of OpenAI, making\
    \ it OpenAI’s largest investor. Other investors were equally kept in the dark,\
    \ as were employees of OpenAI. The way OpenAI’s board conducted this “transition”\
    \ has spawned a tangential topic around corporate governance and a textbook example\
    \ of how a board should not be run, but that is out of the scope of this book.\
    \ Nevertheless, this event is a key defining moment in AI history.\n\nWithin 24\
    \ hours, Microsoft, other investors, and staff demanded a return of `Mr. Altman`\
    \ to the helm. Within 60 hours, after failed negotiations for `Mr. Altman` to\
    \ return to OpenAI, Microsoft hired `Mr. Altman` and `Mr. Brockman`.^(7) Almost\
    \ all OpenAI employees, including management, threatened to quit OpenAI and join\
    \ `Mr. Altman` and `Mr. Brockman` at Microsoft. Finally, before 72 hours is up,\
    \ `Mr. Altman` and `Mr. Brockman` are back at OpenAI, and all but one of the board\
    \ members stepped down.\n\nThe drama at OpenAI highlights the huge gap in ideology\
    \ between those that embrace AI and those who are convinced AI will destroy humanity.\n\
    \n## Accelerationists and Doomers\n\nThe group of people that advocate faster\
    \ adoption and development of AI is known as accelerationists. On the other end\
    \ of the spectrum, doomers is the group convinced AI will destroy humankind and\
    \ therefore are advocating slowing down development and increasing oversight,\
    \ scrutiny, and defining more definite boundaries that restrict AI’s encroachment,\
    \ etc. Granted that the majority of people tend to fall somewhere in between,\
    \ but at the time of writing and from our engagements with private organizations,\
    \ public entities, and elected officials, we have observed a higher tendency to\
    \ lean more toward the viewpoint of the doomers. Where do you stand in your AI\
    \ journey?\n\nIt is widely believed that capitalists and commercial entities like\
    \ Microsoft are extreme accelerationists. Prominent technology leaders like the\
    \ vocal `Mr. Elon Musk` of Tesla and SpaceX is a doomer. `Mr. Sam Altman` himself\
    \ has famously claimed AI can destroy humanity and urged governments to monitor\
    \ and legislate AI. He co-founded OpenAI and was one of the designers of the board’s\
    \ structure, where members are not financially benefiting from OpenAI so that\
    \ there is no conflict of interest when governing the technology developed by\
    \ the company. Ironically, the very board that ousted him. These are not what\
    \ you would expect from an accelerationist.\n\nHowever, `Mr. Altman` was also\
    \ the one who later created the commercial arm of OpenAI in order to raise funding\
    \ for the advancement of generative AI. This part of OpenAI benefitted from the\
    \ investments from Microsoft and other venture capitalists. The commercial arm\
    \ was also governed by the same board responsible for the nonprofit part of OpenAI,\
    \ a governance structure currently under scrutiny and will likely cease to exist.\n\
    \n`Mr. Altman` continues to pitch AI advancements right up until his ousting,\
    \ such as proposals to create an AI-enabled hardware, providing tools for developers\
    \ to customize their own GPT models. These are not actions a doomer pursues. `Mr.\
    \ Altman` markets himself as a balanced champion of AI – both cautious but embracing\
    \ what he sees as the inevitable evolution of the technology. It is probably why\
    \ he is viewed as the most influential technologist of our time and the de facto\
    \ champion for AI. Whether `Mr. Altman` is testifying in front of the Congress,^(8)\
    \ or geeking out with technologists,^(9) or speaking to world and business leaders,^(10)\
    \ he is always the highlight of the event.\n\nIn the aftermath of the OpenAI saga,\
    \ did the doomers lose ground and the accelerationists come out on top? Are we\
    \ better or worse off as a result? The only clear answer is that this is truly\
    \ a significant inflection point, and therefore warrants *strong oversight, but\
    \ unavoidable adoption* of the technology.\n\n> *We’re on the path to self destruction\
    \ without AI.*\n> \n> *—Sam Altman*\n\n> *Mitigating the risk of extinction from\
    \ AI should be a global priority alongside other societal-scale risks such as\
    \ pandemics and nuclear war.*\n> \n> *—Open letter signed by Sam Altman and top\
    \ AI scientists*"
