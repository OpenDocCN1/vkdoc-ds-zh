    2.  启动 AI Studio (`https://ai.azure.com`)，并使用你的 LLM 和自然语言来帮助解析 JSON。你将收到来自 Azure
    OpenAI 的响应，如下面的图 9-28 所示。


    利用 Azure OpenAI 的 Codex 功能，解析 JSON 的任务变得简单得多。也不再需要考虑 JSON 模式可能发生变化的情况，因为 Azure
    OpenAI 能够动态地解释任何 JSON 结构。


    ## 使用 AI 服务增强 LLM


    `GPT-4 Turbo with Vision` 是一个多模态 LLM 模型，这意味着它不仅限于基于文本的查询。该模型可以基于图像或视频源进行 grounding。


    此外，你可以通过 Azure AI 服务^(¹²⁰)（特别是 Azure AI 视觉）来增强和提升该 LLM 的视觉能力。通过这样做，AI 视觉可以帮助在视觉上区分并突出显示图像的重要方面。


    在 AI Studio 中，有一个滑块允许你使用 AI 视觉服务来增强 `GPT-4 Vision` 模型，如图 9-29 所示。


    ![](img/501717_2_En_9_Fig29_HTML.jpg)


    图 9-29

    `GPT-4 Turbo with Vision`（使用和不使用 AI 视觉增强）


    左侧图像没有使用 AI 视觉，`GPT-4 Turbo with Vision` 模型可以基于图像回答问题。然而，右侧图像显示，一旦 AI 视觉服务与 LLM
    一起使用，响应将包含可点击的链接，这些链接会高亮显示（边界框）图像。

    '
- fmt: '# Summary


    Although we focused on just one Azure AI service in this chapter, AI Custom Vision,
    the concepts are the same across all the AI services in the portfolio. These are
    pre-packaged AI capabilities where all you need is to make a REST API call and
    then parse the JSON response from the service.


    The general headers are also generally the same, with an authentication key and
    a content type. The JSON response would also include a confidence level for the
    predictions (probability). As a rule of thumb, we usually interpret a probability
    of >75% as true positives and <50% as true negatives.


    We also saw how these AI services can be connected to each other, including leveraging
    Azure OpenAI for natural language interpretation of the prediction results. Azure
    AI services are generally used as building blocks to quickly enable AI in new
    or existing applications and in Robotic Process Automation (RPA) workflow scenarios.


    The use cases for generative AI together with applied AI are limitless.'
  raw: '## Summary


    Although we focused on just one Azure AI service in this chapter, AI Custom Vision,
    the concepts are the same across all the AI services in the portfolio. These are
    pre-packaged AI capabilities where all you need is to make a REST API call and
    then parse the JSON response from the service.


    The general headers are also generally the same, with an authentication key and
    a content type. The JSON response would also include a confidence level for the
    predictions (probability). As a rule of thumb, we usually interpret a probability
    of >75% as true positives and <50% as true negatives.


    We also saw how these AI services can be connected to each other, including leveraging
    Azure OpenAI for natural language interpretation of the prediction results. Azure
    AI services are generally used as building blocks to quickly enable AI in new
    or existing applications and in Robotic Process Automation (RPA) workflow scenarios.


    The use cases for generative AI together with applied AI are limitless.'
  trans: '

    # 总结


    本章虽然只重点介绍了 Azure AI 服务中的自定义视觉服务，但该系列所有 AI 服务的概念都是相通的。这些服务是预先打包好的 AI 功能，你只需发出 REST
    API 调用，然后解析服务返回的 JSON 响应即可。


    请求头通常也是类似的，包含身份验证密钥和内容类型。JSON 响应中还会包含预测结果的置信水平（概率）。根据经验法则，我们通常将概率大于 75% 的结果解读为真正例，将概率低于
    50% 的结果解读为真负例。


    我们还看到了这些 AI 服务如何相互连接，包括利用 Azure OpenAI 对预测结果进行自然语言解读。Azure AI 服务通常被用作构建块，可快速在新应用或现有应用以及机器人流程自动化（RPA）工作流场景中启用
    AI 功能。


    生成式 AI 与应用型 AI 的结合，其应用场景是无限的。

    '
