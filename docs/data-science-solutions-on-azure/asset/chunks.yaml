- fmt: "#### Azure Applied AI\n\nMicrosoft then developed a set of AI capabilities\
    \ that represent use case scenarios, e.g., a service previously known as `Forms\
    \ Recognizer`.\n\n`Forms Recognizer` was derived from `OCR` (Vision) because AI\
    \ is not only used to accurately recognize text from handwriting but also used\
    \ to identify key–value pairs. This is typically seen in forms. A person will\
    \ know how to fill out a form because of its layout and the name of the fields.\
    \ So, even when you are not familiar with a form, when presented with one for\
    \ the first time, you should not have any problems trying to figure out how to\
    \ provide the requested information.\n\nThus, Azure Applied AI is the name used\
    \ by Microsoft to categorize these scenario-based AI services.\n\nFigure [9-1](#501717_2_En_9_Chapter.xhtml#Fig1)\
    \ below shows the Microsoft AI portfolio when it had the Applied AI services separately\
    \ identified from Cognitive Services, of which Azure OpenAI was added to. It is\
    \ represented as a technology stack because scenario-based AI services are built\
    \ upon the more foundational Cognitive Services models.\n\nIn turn, Cognitive\
    \ Service models, and for that matter, any custom models, are built from `Azure\
    \ Machine Learning`, where training data, compute, and model development life\
    \ cycle (MLOps) are being used by data scientists.\n\nLastly, the top two layers\
    \ of the AI stack are the platforms and applications where the AI capabilities\
    \ are being exposed.\n\nWhen it is laid out as a stack, it becomes more logical\
    \ as to why Microsoft separated the AI stack accordingly. It is akin to what the\
    \ Open Systems Interconnection (OSI) model attempted to do, but in this case,\
    \ for AI.\n\nIt did not help matters when Microsoft renamed some of the services\
    \ in addition to the introduction of the new categories. Again, e.g., `Forms Recognizer`\
    \ was renamed as `Document Intelligence`, then taken out of the Cognitive Services\
    \ portfolio and put into the newly formed applied AI services portfolio.\n\n![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig1_HTML.jpg)\n\
    \nFigure 9-1\n\nAzure AI stack before everything was named Azure AI services\n\
    \n#### Azure AI Services\n\nAt the time of writing, Microsoft has combined *all*\
    \ its AI services into a single portfolio and named it `Azure AI services`. Note\
    \ that this is still separate from the custom tooling for data scientists - `Azure\
    \ Machine Learning`, but it makes sense to separate the data scientists’ domain\
    \ from the developer-centric one.\n\n`Azure AI services` is now comprised of the\
    \ following:\n\n1.  AI Vision^([^(104)](#fn104))\n    1.  **Image Analysis:**^([^(105)](#fn105))\
    \ The ability to detect and classify objects in images using pre-built models\
    \ so you do not need to build your own models.\n    2.  **Custom Vision:** Train\
    \ your own models by labeling images. The custom model can be used to identify\
    \ or classify objects and people. AI Custom Vision has its own Studio UI located\
    \ at [`https://customvision.ai`](https://customvision.ai).\n    3.  **Optical\
    \ Character Recognition (OCR**^([^(106)](#fn106))**:)** Extracting text from images.\n\
    \    4.  **Spatial Analysis:** Analyze video content such as creating summaries,\
    \ generating keyword, identifying and counting objects or people, and monitoring\
    \ zones and distances in the video footage.\n    5.  **Face:** Detect location\
    \ of one or more human faces in images along with pose, face mask, and facial\
    \ attributes.\n\n2.  AI language^([^(107)](#fn107))\n    1.  Natural language\
    \ processing (NLP)\n    2.  Multilingual models to provide translation services\n\
    \n3.  AI speech^([^(108)](#fn108))\n    1.  **Speech to Text:** Transcribe audible\
    \ speech into searchable text.\n    2.  **Text to Speech:** Convert text into\
    \ lifelike and natural speech.\n    3.  **Speech Translation:** Translate real-time\
    \ speech into different languages.\n    4.  **Speaker Recognition:** Identify\
    \ speakers based on trained audio.\n    5.  **Voice Commands:** Creating voice\
    \ activation or voice command capabilities for applications and IOT devices.\n\
    \n4.  AI translator^([^(109)](#fn109))\n    1.  Like speech translation but for\
    \ text. Translate text from one language to another in real time or in batches.\n\
    \n5.  AI content safety\n    1.  Pre-trained AI models to identify sexual, violent,\
    \ hate, and self-harm content\n    2.  Supports content filtering in multiple\
    \ languages\n    3.  Pre-trained AI Vision models to detect images that depict\
    \ sexual, violent, hate, and self-harm content\n\n6.  AI search^([^(110)](#fn110))\n\
    \    1.  **AI-Powered Search:** Review Chapters [4](#501717_2_En_4_Chapter.xhtml)\
    \ and [5](#501717_2_En_5_Chapter.xhtml) where we covered AI search in the form\
    \ of the RAG architecture.\n\n7.  AI Document Intelligence^([^(111)](#fn111))\n\
    \    1.  Previously known as `Forms Recognizer`.\n    2.  Best way to think of\
    \ AI Document Intelligence is \"OCR on steroids\". Document Intelligence uses\
    \ AI to identify key–value pairs and is often used to extract information from\
    \ forms and documents.\n\n8.  Azure OpenAI\n    1.  `Azure OpenAI` is the latest\
    \ addition to the `Azure AI services` portfolio and has been our focus in this\
    \ book.\n\nAll Azure AI services feature API endpoints that receive input from\
    \ your application or device and return the relevant results in JSON format.\n\
    \n## Exploring Azure AI Services\n\nSome of the Azure AI services provides a UI\
    \ for you to explore how the services work. Like the AI Studio for Azure OpenAI,\
    \ these are also called Studios. For example, there is the Vision Studio for AI\
    \ Vision and the Document Intelligence Studio. Visit each of the AI services’\
    \ sites referenced in the footnote to find the respective service’s studio."
