- fmt: '### Counting Tokens


    In the next section, we will go into more detail on how tokenization works. But
    for now, in general sense, you can view one token as follows:


    - Approximately four characters in English

    - Three-forth of a word


    Conversely, we can use the following guidance. For generative AI to process:


    - One to two sentences are approximately 30 tokens.

    - One paragraph is approximately 100 tokens.

    - One thousand five hundred words are approximately 2048 tokens.

    - Seventy-five words are approximately 100 tokens.


    The number of tokens needed is also dependent on the language, which is generally
    higher than English. Therefore, it may be more expensive to process non-English
    text.


    The challenge with tokens is that it is cumbersome to come up with an estimate
    on how many tokens. Fortunately, there are several tools available. One such tool
    a [Tokenizer tool](https://platform.openai.com/tokenizer)^([^(27)](#fn27)) provided
    by OpenAI. It is a simple tool that allows you to copy and paste text into a text
    area, which will provide the number of tokens needed for the text to be processed
    by OpenAI. Figure [2-4](#501717_2_En_2_Chapter.xhtml#Fig4) below shows the layout
    of the Tokenizer tool from OpenAI.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig4_HTML.jpg)


    **Figure 2-4** Tokenizer tool from Azure OpenAI showing 172 tokens needed for
    a body of text


    This method of estimating tokens is a generalization, but the algorithm used in
    breaking up the text is not to just arbitrarily group strings into four characters
    from the beginning of the text to the end in a sequential way. Let us take a closer
    look at what happens during tokenization.


    ### Tokenization


    Tokenization^([^(28)](#fn28)) is technically an algorithm based on [Byte-Pair
    Encoding (BPE) logic](https://en.wikipedia.org/wiki/Byte_pair_encoding)^([^(29)](#fn29)).
    BPE identifies patterns in text and replaces the patterns with a token that uniquely
    represents the patterns. This happens iteratively until no more patterns can be
    identified.


    For example:


    ```

    Tokenize the text string "aabccabbbcccaabcc"

    Identify pattern and frequency:

    "aa"

    "bcc"

    aa bcc abb bcc c aa bcc

    Tokenizing the pattern by replacing them with text that does not exist in the
    string:

    ZXabbXcZX

    Z=aa

    X=bcc

    Iterating:

    YabbXcY

    Y=ZX

    Z=aa

    X=bcc

    ```


    The resulting tokenized text (`YaabbXcY`) is smaller than the original (`aaccaabbbcccaabcc`).
    The tokenized text is reversible and lossless, which means you can convert the
    tokens back into the original text.


    The BPE algorithm is the basis of the tokenization logic in LLMs, except that
    instead of just contiguous pairs, tokenization identifies commonly used sequences
    in the language and uses a numeric representation of the text because the LLM
    only understands numbers. Hence, tokenization is also the process of converting
    text to numeric format, known as encoding. There are different encoding methods,
    such as `cl100k_base`, `p50k_base`, and `r50k_base`. Each contiguous body of text,
    letter, or word is represented by a unique number based on the model that is being
    used. Azure OpenAI models use different encoders, as seen in Table [2-1](#501717_2_En_2_Chapter.xhtml#Tab1).


    **Table 2-1** Encoders used by OpenAI models


    | Encoder | Azure OpenAI models |

    | --- | --- |

    | `cl100k_base` | `gpt-4`, `gpt-3.5-turbo`, `text-embedding-ada-002`, `text-embedding-3-small`,
    `text-embedding-3-large` |

    | `p50k_base` | `Codex`, `text-davici-002`, `text-davici-003` |

    | `r50k_base` | `gpt-3`, `davinci` |


    The tokenizer uses both the encoder and the model to determine how contiguous
    text is selected. This combination is the vocabulary that the tokenizer uses for
    conversion purposes. In English, tokens are commonly grouped to form one character
    to one word (e.g., "t" or "meet"). Spaces are usually grouped at the *start* of
    a word (e.g., "an" instead of "an").


    For example:


    | `Run` | `n` | `ing` | `is` | `an` | `Olymp` | `ic` | `sport` | `ing` | `event`
    | 36 characters |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | `2256` | `25` | `341` | `45` | `85` | `5126` | `18` | `8459` | `341` | `3258`
    | 10 tokens |


    ```

    Replacing non-matched strings or characters with unique numbers:

    n=25, Olymp=5126


    | Run | n  | ing | is | an | Olymp | ic | sport | ing | event | 36 characters
    |

    | 2256 |   | 341 | 45 | 85 |   | 18 | 8459 | 341 | 3258 |   |


    Tokenizer vocabulary:

    "ing" = 341

    "is" = 45

    "an" = 85

    "Run" = 2256

    "Kick" = 2215

    "ic" = 18

    "sport" = 8459

    "even" = 7485

    "event" = 3258

    Tokenize "Running is an Olympic sporting event"

    Identify contiguous text based on the library:

    "Run", "ing", "ic", "sport", "event"

    Tokenizing:

    ```


    This example uses a hypothetical rudimentary vocabulary, but with an LLM-like
    GPT-4, the vocabulary is extensive so much fewer tokens would be needed. We are
    also using a hypothetical number in this example to represent how words are being
    converted into numeric values. Once a word or letter is converted to a numeric
    value, the value remains the same for every instance of the word or letter. Using
    the same body of text and plugging it into OpenAI''s tokenizer, we get the results
    shown in Figure [2-5](#501717_2_En_2_Chapter.xhtml#Fig5) below.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig5_HTML.jpg)


    **Figure 2-5** How text is organized using OpenAI''s tokenizer


    You might be wondering why the hypothetical example provided 10 tokens, whereas
    Tiktoken showed six tokens. The answer is the algorithm that is being used by
    OpenAI. The first example was for illustration purposes to show how tokens are
    generated from words, whereas Tiktoken is an actual tokenizer tool. Simply put,
    Tiktoken is a more optimized tokenizer when it comes to selecting words/characters
    than our manual conversion! Hence a lower token count.


    To see the encoding (numeric values) generated by the tokenizer, we used the [Tiktoken](https://github.com/openai/openai-cookbook/blob/main/examples/How_to_count_tokens_with_tiktoken.ipynb)^([^(30)](#fn30))
    open-source tokenizer by OpenAI in a notebook, as shown in Figure [2-6](#501717_2_En_2_Chapter.xhtml#Fig6)
    below.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig6_HTML.jpg)


    **Figure 2-6** Code block in Jupyter Notebook using `Tiktoken` to retrieve encodings'
