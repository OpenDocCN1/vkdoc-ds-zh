    2.  Launch AI Studio (`https://ai.azure.com`) and use your LLM and natural language
    to help with parsing the JSON. You will receive a response from Azure OpenAI as
    shown in Figure [9-28](#501717_2_En_9_Chapter.xhtml#Fig28) below.


    Using the Codex capability of Azure OpenAI, the task of parsing JSON is made much
    simpler. There is also no longer the need to take into consideration the possibility
    to changes in the schema of the JSON because Azure OpenAI will be able to dynamically
    interpret any JSON structure.


    ## Augmenting LLM with AI Services


    `GPT-4 Turbo with Vision` is an LLM model that is multimodal, meaning it is not
    restricted to text-based querying. This model can be grounded with image or video
    sources.


    Furthermore, you can augment and enhance the vision capability of this LLM with
    Azure AI services,^([^(120)](#fn120)) specifically Azure AI Vision. By doing so,
    AI Vision can help visually distinguish and highlight important aspects of the
    images.


    In AI Studio, there is a slider that allows you to use an AI Vision service to
    enhance the `GPT-4 Vision` model, as shown in Figure [9-29](#501717_2_En_9_Chapter.xhtml#Fig29).


    ![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig29_HTML.jpg)


    Figure 9-29

    `GPT-4 Turbo with Vision` (with and without enhancement from AI Vision)


    The image on the left, with AI Vision not being used, the `GPT-4 Turbo with Vision`
    model can answer questions grounded on the image. However, the image on the right
    shows that once AI Vision service is used together with the LLM, the response
    will include clickable links that highlights (bounding boxes) the image.'
