    \ 的文件夹中打开 Jupyter Notebook `tokenizer.ipynb`\n\n1.  在 Visual Studio Code 中选择文件\
    \ ➤ 打开文件夹，并导航到您在步骤 1 中克隆的仓库的本地根目录。\n2.  导航到名为 `Chapter-2` 的文件夹，并打开 `tokenizer.ipynb`，如下面的图\
    \ 2-8 所示。\n3.  阅读每个代码块中的注释，然后按顺序运行它们。更改代码块 3 中变量 `text` 的值，以查看分词器的表现。\n\n总而言之，使用\
    \ `cl100k_base` 编码和 `gpt-3.5-turbo` 模型，对我们的示例进行分词得到如下结果。\n\n| `Running` | `_is`\
    \ | `_an` | `_Olympic` | `_sporting` | `_event` | `36 characters` |\n|-----------|-------|-------|------------|-------------|----------|-----------------|\n\
    | `19527`   | `374` | `459` | `25944`    | `36027`     | `1567`   | `6 tokens`\
    \      |\n\n如前所述，请注意空格被分组在选定文本的*开头*而不是结尾。GPT 模型更为庞大，意味着其词汇量更大，因此能够使用比我们假设模型更少的\
    \ token（六个 token 对比十个）。\n\n进一步深入探讨 `Tiktoken` 和编码的细节超出了本书的范围，但本次动手练习应该能让您对分词有更好的理解。值得花些时间学习一下笔记本中关于如何使用\
    \ `Tiktoken` 计算 token 数量的内容，该笔记本位于脚注中列出的 GitHub 仓库中。\n\n### 提示 token 与补全 token\n\
    \nToken 分为两类：\n\n-   **提示 token**\n-   **补全 token**\n\n提示 token 是基于用户输入创建的 token。例如，如果您提问\
    \ `“Tell me more about this book,”`，所产生的六个 token 就称为提示 token。\n\n如果 LLM 对此问题的回复是\
    \ `“This book teaches us how to use Microsoft Azure for Data Science projects\
    \ with a heavy emphasis on generative AI and Large Language Models,”`，这相当于 26\
    \ 个 token，这些 token 被称为补全 token。\n\n总之，提示 token 是与问题（提示）相关的 token，而补全 token 是与\
    \ LLM 生成的回复相关的 token。此外，在与 LLM 的大多数交互中，消耗的提示 token 数量通常高于补全 token。原因是设置提示不仅需要问题本身，还需要问题的上下文以及所有相关来源（例如，知识库文章）。\n\
    \n在对话场景中，为了向 LLM 提供之前所有对话轮次的上下文，每个后续提示都需要包含之前提出的问题。因此，随着对话的进行，每个后续提示消耗的 token\
    \ 会比前一个更多。\n\n出于估算目的，下面的表 2-2 列出了常见用例以及每个用例观察到的平均 token 数量。\n\n**表 2-2** 用例及其对应的\
    \ token 使用量细分\n\n| 用例                                        | 提示 token | 补全 token\
    \ | 总 token |\n|-----------------------------------------------|---------------|--------------------|--------------|\n\
    | 通用聊天问答                                   | 600           | 50              \
    \   | 650          |\n| 基于自有数据的聊天：检索增强生成 (RAG) 架构 | 2850          | 100      \
    \          | 2950         |\n| 新闻文章（摘要）                              | 6500  \
    \        | 250                | 6750         |\n| 电子邮件（摘要）                   \
    \            | 800           | 50                 | 850          |\n| 聊天记录（摘要）\
    \                              | 900           | 200                | 1100   \
    \      |\n| 会议记录（摘要）                              | 1200          | 100      \
    \          | 1300         |\n| 代码补全/生成                                 | 1150\
    \          | 50                 | 1200         |\n| 代码解释（摘要）                 \
    \             | 950           | 250                | 1200         |\n\n## Token\
    \ 的相关性\n\n既然我们知道了什么是 token，就可以将它们应用于其使用的两个重要方面：\n\n-   **成本**\n-   **性能**\n\n\
    ### 成本\n\n由于 token 是 LLM 的计量单位，它自然成为消耗 LLM 时用于计算成本的指标。让 LLM 处理数据的成本基于该过程所需的 token\
    \ 数量。来自 Microsoft、OpenAI、Google 和 AWS 的生成式 AI 服务都基于价格/token。由于这是一本专注于 Microsoft\
    \ Azure 平台的书，我们将以 Microsoft Azure OpenAI 为基础来了解使用 Microsoft 平台时可用的成本模型。\n\nAzure\
    \ OpenAI 有两种成本模型：\n\n-   **消耗或即用即付 (`PayGo`) 模型**\n-   **预配置吞吐量单位 (`PTUs`)**\n\
    \n#### 即用即付 (`PayGo`)\n\n顾名思义，`PayGo` 模型很简单直接——您需要为每消耗 1000 个 token 付费。与所有 Azure\
    \ 服务一样，[定价计算器](https://azure.microsoft.com/pricing/calculator) 是估算使用 Azure OpenAI\
    \ 服务成本的工具。\n\n##### 动手练习：探索成本\n\n1.  如下面的图 2-9 所示，访问 [`https://azure.microsoft.com/pricing/calculator`](https://azure.microsoft.com/pricing/calculator)\
    \ 上的计算器，在左侧菜单中选择 **AI + 机器学习**，然后选择 **Azure OpenAI 服务**。您会在屏幕的右角看到一个弹出窗口，显示 **已添加\
    \ Azure OpenAI 服务**。点击 **查看** 链接。\n\n![图 2-9](img/501717_2_En_2_Fig9_HTML.jpg)\n\
    \n**图 2-9** Azure 在线计算器并选择 Azure OpenAI 服务\n\n![图 2-10](img/501717_2_En_2_Fig10_HTML.jpg)\n\
    \n**图 2-10** 在 Azure 计算器中基于 GPT-4 32k 的 token 数量和类型估算成本\n\n1.  还记得本章前面我们区分了提示\
    \ token 和补全 token 吗？这就是它重要的地方，因为在 `PayGo` 模型中，不同类型的 token 有不同的定价。参考上面的表 2-2，选择一个用例。然后在计算器中提供该用例的提示\
    \ token 和补全 token 的数量。例如，我们将选择“基于自有数据的聊天”用例。因此，我们将在提示 token 处输入 `2.85`（2.85 ×\
    \ 1000 = 2850），在补全 token 处输入 `0.1`（0.1 × 1000 = 100）。参见下面的图 2-10。\n\n2.  请注意计算器中的以下几点：\n\
    \    1.  我们选择的是 **美国东部** 区域，但 Azure OpenAI 并非在所有区域都可用。因此，如果您选择其他区域，该服务可能不可用。\n\
    \    2.  即使某个区域提供 Azure OpenAI 服务，也并非所有模型在该区域都可用。\n    3.  根据所选模型的不同，每个 `Prompt`\
    \ 和 `Completion` token 的价格也不同。\n    4.  有关各区域 Azure OpenAI 及模型可用性的列表，请参考 [`https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models#public-cloud-regions`](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models#public-cloud-regions)。\n"
- fmt: '# Provisioned Throughput Units (PTUs)


    `Provisioned Throughput Unit (PTU)` is a Microsoft Azure term for dedicated compute
    that runs the LLM. Think of a single `PTU` as a composite unit of compute (GPU),
    memory, and storage needed by the LLM. The more `PTUs` dedicated to an LLM, the
    more tokens it can process per minute. There is also a minimum number of `PTUs`
    needed to support a model. Figure [2-11](#501717_2_En_2_Chapter.xhtml#Fig11) below
    depicts the relationship between the LLM and `PTUs`. Table [2-3](#501717_2_En_2_Chapter.xhtml#Tab3)
    below shows the minimum number of `PTUs` required by the different models.


    **Table 2-3** Minimum number of `PTUs` required for the different models


    | Model | Minimum number of `PTUs` |

    | --- | --- |

    | `gpt-3.5-turbo (16k)` | 50 |

    | `gpt-4 (8k)` | 100 |

    | `gpt-4 (32k)` | 200 |

    | `gpt-4-turbo with Vision` | 100 |


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig11_HTML.jpg)


    **Figure 2-11** `Provisioned Throughput Units (PTUs)` being used by an LLM


    Instead of paying for the number of prompt and completion tokens being consumed,
    the `PTU` model is a monthly fixed cost for "unlimited" number of tokens. However,
    although it is unlimited, the maximum number of tokens that can be consumed is
    still constrained by the underlying physical infrastructure – compute, memory,
    storage, etc.


    Estimating the maximum number of tokens that different `PTU` levels can deliver
    is useful in batch type processing where you have the ability to control the number
    of requests per minute. However, in transactional-type scenarios (e.g., chat),
    knowing the peak requests per minute may be more important so you know whether
    you can handle the expected number of users to the service at any given time.
    We will discuss this in detail under the section "Peak Users and TPM in PTU Model"
    later in this chapter.


    ## Performance and Service Limits


    Now that we know the two cost models – PayGo and `PTUs`; we need to discuss one
    more concept before we can size our LLM, and that is tokens per minute (TPM).


    ### Tokens per Minute (TPM)


    Tokens per minute (TPM) is the throughput measure of how many tokens are being
    transacted each minute. `TPM` is the primary metric that determines how many requests
    or users in any given minute.


    Figure [2-12](#501717_2_En_2_Chapter.xhtml#Fig12) above depicts the capacity as
    a pipe that services user requests in the form of tokens. In the figure, for a
    particular one-minute window, there are four users, and their prompt and completion
    tokens are different because their requests from the LLM are for different things
    (e.g., chat, summarization). As such, each user is consuming different number
    of tokens. Assume that if they are making a request during the same one-minute
    time window, the total number of tokens for the four requests is 9500. Therefore,
    the `TPM` is 9500.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig12_HTML.jpg)


    **Figure 2-12** Graphic depicting `TPM` as a concept of LLM capacity


    ### Quotas and Service Limits


    Now that we understand the concept of `TPM`, visit the [Azure OpenAI Service quotas
    and limits page](https://learn.microsoft.com/en-us/azure/ai-services/openai/quotas-limits).^([^(32)](#fn32))


    Azure OpenAI service limits are primarily by model, model version, deployment
    type (PayGo or `PTU`), and region. The quota and limits page lists the limits
    for the PayGo deployment model. We will discuss `PTU` limits in the next section.


    First, we will look at the [regional quota limits](https://learn.microsoft.com/en-us/azure/ai-services/openai/quotas-limits#regional-quota-limits)^([^(33)](#fn33))
    section of the page. The table in this section shows the `TPM` for each model
    in the different regions, as shown in Figure [2-13](#501717_2_En_2_Chapter.xhtml#Fig13).
    For example, the `TPM` for `GPT-3.5 Turbo 16K` is 240k in some regions like the
    `eastus`, but is 300k in others like `japaneast`.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig13_HTML.jpg)


    **Figure 2-13** Regional quota limits (TPM)


    Next, look at the [quotas and limits reference](https://learn.microsoft.com/en-us/azure/ai-services/openai/quotas-limits#quotas-and-limits-reference)^([^(34)](#fn34))
    and find the limit named "Maximum prompt tokens per request" as shown in Figure
    [2-14](#501717_2_En_2_Chapter.xhtml#Fig14) below.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig14_HTML.jpg)


    **Figure 2-14** Quotas and limits reference


    This is the maximum number of prompt tokens that the model can receive per request,
    and we referred to it as the context window size earlier in this chapter. Click
    on the [Azure OpenAI Service models link](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models)^([^(35)](#fn35))
    in the Limit Value column.


    Find the section that describes the model availability and region that you will
    be using. For example, we went to the [GPT-3.5 Turbo model availability section](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models#gpt-35-turbo-model-availability)^([^(36)](#fn36))
    and noted that the model we are interested in deploying – `GPT-3.5 Turbo 16K 0613`
    – is available in the East US region that has a maximum token request of 16,384
    as shown in Figure [2-15](#501717_2_En_2_Chapter.xhtml#Fig15) below.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig15_HTML.jpg)


    **Figure 2-15** Maximum token size per request by model and region


    To summarize the entire example, if we were going to deploy a `GPT-3.5 Turbo`
    LLM solution in the East US region, from the tables in the three figures^([^(37)](#fn37))
    above, we know that in the PayGo model, our service limits are as follows:


    *   The prompt tokens from *all* request must not add up to more than 240k tokens.

    *   Prompt tokens from any single request^([^(38)](#fn38)) must not exceed 16,384
    tokens.

    *   The model is available in the East US region.


    To see how the above quota and limits are enforced, refer to Figure [2-13](#501717_2_En_2_Chapter.xhtml#Fig13)
    as an example. Consider the tokens coming in from requests – 20k, 15k, 200k,^([^(39)](#fn39))
    and 6k within a one-minute timeframe. The last request (6k tokens) will push the
    `TPM` to 241k, therefore surpassing the `TPM` limit for the `GPT-3.5 Turbo` model
    of 240,000 `TPM` (Figure [2-13](#501717_2_En_2_Chapter.xhtml#Fig13): Regional
    quota limits (TPM)).


    Next, each model also has a service limit of a maximum number of tokens for a
    single request. Referring to Figure [2-13](#501717_2_En_2_Chapter.xhtml#Fig13)
    again, even though the 200k-token request went through because it was under the
    `TPM` limit at the time of the request, the LLM would not be able to process it
    because the request itself is more than the quota of 16,384 tokens (Figure [2-15](#501717_2_En_2_Chapter.xhtml#Fig15):
    Maximum token size per request by model and region).


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig16_HTML.jpg)


    **Figure 2-16** Service limits by `TPM` and by quota'
