- fmt: "# Prompt Flow Lifecycle\n\nThe Prompt Flow lifecycle consists of the below\
    \ stages and is shown in Figure [5-14](#501717_2_En_5_Chapter.xhtml#Fig14).\n\n\
    ![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig14_HTML.jpg)\n\nFigure 5-14\
    \ Prompt Flow response\n\n1. **Initiation:** Begin by pinpointing the specific\
    \ business challenge you aim to address.\n   1. **Identify the Business Challenge:**\
    \ Determine the specific problem or opportunity you want to address using AI.\n\
    2. **Collect Sample Data:** Gather initial data samples that are representative\
    \ of the problem you’re working on.\n3. **Learn Basic Prompt Creation and Develop\
    \ a Flow:** Understand how to create a simple prompt for your data and build a\
    \ flow that enhances the basic prompt, adding capabilities to better address the\
    \ business challenge.\n\n2. **Experimentation:**\n   1. **Run the Flow:** Execute\
    \ the flow using your sample data to see how it performs.\n   2. **Evaluate Performance:**\
    \ Assess how well the prompt works in solving the problem.\n   3. **Make Adjustments\
    \ and Repeat:** Tweak the flow and prompt based on the performance results until\
    \ you get satisfactory results.\n\n3. **Assessment and Improvement:**\n   1. **Test\
    \ with Larger Data:** Run the flow on a more extensive dataset to see how it performs\
    \ on a bigger scale.\n   2. **Evaluate Effectiveness:** Review the results to\
    \ determine if the prompt and flow are effective in solving the problem.\n   3.\
    \ **Refine as Needed and Prepare for Next Stage:** Make any necessary improvements\
    \ to enhance performance, ensure the results meet your criteria before moving\
    \ on.\n\n4. **Deployment:**\n   1. **Optimize the Flow:** Fine-tune the flow for\
    \ maximum efficiency and effectiveness.\n   2. **Deploy:** Launch the flow in\
    \ a production environment where it will be used in real-world scenarios.\n  \
    \ 3. **Monitor Performance and Gather Feedback:** Keep track of how the flow performs\
    \ in the live environment, watching for any issues, gather user feedback, and\
    \ iterate.\n\nBy following this structured process, Prompt Flow helps you systematically\
    \ develop, test, refine, and deploy AI solutions with confidence, ensuring they\
    \ are robust and effective. Now that we understand the basics of Prompt Flow,\
    \ we will continue our \"Building Gen AI Applications end to end\" project, and\
    \ as the next step, we will click on Prompt Flow to take our project in Prompt\
    \ Flow visual tools where we will run the flow on larger dataset and evaluate\
    \ using built-in evaluation metrics of Prompt Flow. Shown in Figure [5-15](#501717_2_En_5_Chapter.xhtml#Fig15)\
    \ is how our project will look like in Prompt Flow.\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig15_HTML.jpg)\n\
    \nFigure 5-15 Prompt Flow representation of Azure OpenAI on your data RAG\n\n\
    Now we can visualize our project in detail and see the graph on the right hand\
    \ side to see query execution. For the `querySearchResource`, make sure to select\
    \ the registered index with the name of your index as shown in Figure [5-16](#501717_2_En_5_Chapter.xhtml#Fig16).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig16_HTML.jpg)\n\nFigure 5-16\
    \ Prompt Flow search resource setup\n\nAs the next step, we can click on Chat\
    \ and verify some common questions that our project data focuses on. We can see\
    \ our system message was taken in parameter `role_info` of `GenerateReply` tool,\
    \ and we are able to interact with our data on the right-side chat interface as\
    \ shown in Figure [5-17](#501717_2_En_5_Chapter.xhtml#Fig17).\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig17_HTML.jpg)\n\
    \nFigure 5-17 Prompt Flow system message and chat interface\n\n`GenerateReply`\
    \ tool lets you test multiple variants or variations of your prompt or connection\
    \ settings. Creating a good prompt is not easy; it needs to be creative, clear,\
    \ and relevant. A well-crafted prompt can get the desired response from a language\
    \ model, while a poorly made one can result in wrong, irrelevant, or nonsensical\
    \ answers. Therefore, it's important to fine-tune prompts to make them work well\
    \ across different tasks and fields. Using different versions of prompts can help\
    \ you understand how the model behaves under various conditions, like changes\
    \ in wording, formatting, context, temperature, or `Top-k` settings. By comparing\
    \ these versions, you can find the best prompt and setup that improves the model's\
    \ accuracy, diversity, or coherence. This is especially beneficial for crafting\
    \ a good prompt.\n\nSome of the common benefits of using prompt variants are:\n\
    \n1. **Improve Content Quality:** By creating multiple versions of a prompt with\
    \ different configurations, you can find the best combination that produces high-quality\
    \ content tailored to your needs.\n2. **Save Time and Effort:** Variants allow\
    \ you to easily track and compare the performance of different prompt versions,\
    \ simplifying the management of prompt tuning history and reducing the risk of\
    \ losing previous iterations.\n3. **Increase Productivity:** Streamlining the\
    \ optimization process for prompts enables you to create and manage multiple variations\
    \ more efficiently, leading to better results in less time.\n4. **Facilitate Easy\
    \ Comparison:** Variants make it simple to compare outcomes side by side, helping\
    \ you make informed decisions about which prompt version delivers the best results.\n\
    \nIn our project, we will construct a slightly different prompt and change the\
    \ GPT model as well to compare our Evaluation metrics and model response.\n\n\
    We used \"Generate Variants\" feature to generate another variant of the prompt\
    \ by leveraging base prompt and GPT-4 model. For this variant, we have also switched\
    \ to GPT-4 Turbo model `2024-04-09` api version while keeping `temp` as `0.7`\
    \ and `max_token` `800` for both variants as shown in Figure [5-18](#501717_2_En_5_Chapter.xhtml#Fig18).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig18_HTML.jpg)\n\nFigure 5-18\
    \ Prompt Flow generating variants of prompt\n\nNow that we have at least two variants,\
    \ we are ready to run our evaluation. We will select automated evaluation in order\
    \ to leverage built-in evaluation metrics.\n\nThere are two scenarios that are\
    \ supported:\n\n1. **Question and Answer with Context:** This scenario is designed\
    \ for applications that involve answering user queries and providing responses\
    \ with context information.\n2. **Question and Answer Without Context:** This\
    \ scenario is designed for applications that involve answering user queries and\
    \ providing responses without context.\n\nWe will select the first one since we\
    \ have context, i.e., search results/documents from our AI Index. We will also\
    \ select our flow to evaluate since we will run the flow to obtain the output\
    \ of questions. Select the node to be leveraged for variants, in our case it's\
    \ `GenerateReply`. Finally, select the variants – we have selected `Variant_0`\
    \ and `Variant_1` as shown in Figure [5-19](#501717_2_En_5_Chapter.xhtml#Fig19).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig19_HTML.jpg)\n\nFigure 5-19\
    \ Prompt Flow automated evaluation setup\n\nNext, we will prepare the data for\
    \ batch run – currently, only `.csv` and `.jsonL` are supported. When evaluating\
    \ a flow, make sure your data columns match the required inputs for a batch run.\
    \ This will generate output for assessment. The test dataset should include the\
    \ `queries` and `ground_truth` and optionally can have `Answer` – which will be\
    \ an assistant-generated response for each question. Additionally, you can include\
    \ `chat_history`, but if you don't have one, you can leave it empty list `[]`.\
    \ Below is our test data sample file (Figure [5-20](#501717_2_En_5_Chapter.xhtml#Fig20)).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig20_HTML.jpg)\n\nFigure 5-20"
