- fmt: '#### Version


    The version number of the models is the date the model was released. For example,
    `0613` is June 13, `1106` is November 6, and `0125` is January 25. With the exception
    of `0125`, the other dates/versions are in 2023. For example, `0125` is in 2024.
    It would be confusing if another version is released in June 2024 (hypothetically,
    let’s use June 5); then a version number of `0605` may seem to be an older version
    than `0613` when in reality, they are one year apart, and therefore, `0605` should
    be the latest version. Furthermore, someone new to the models would not know whether
    `0125` is the newer model or older version since it technically seems to predate
    `0613`. This only makes sense for someone already following the chronological
    release of the models.


    #### Context Window Size


    The context window of a model determines the maximum size of the prompt the model
    can process in a single request. A prompt is the natural language question asked
    of the LLM, and it is measured by the number of tokens, which we will discuss
    in detail later in this chapter. For now, just know that the more tokens a model
    has, the more text it can process. Context windows can be as small as `4k` (4000
    tokens) like in the `GPT-3 Turbo` model, to as large as the `128k` (128,000 tokens)
    in the `GPT-4 Turbo` model.


    #### OpenAI or Microsoft


    When choosing to use GPT models, since there is no difference whether you use
    them in Microsoft or OpenAI, the decision whether to use one platform over the
    other generally boils down to whether you are already using other Microsoft services
    in Azure.


    Microsoft is generally preferred by corporate entities because of its robust and
    extensive enterprise portfolio. For example, the application programming interface
    (API) endpoint for `Azure OpenAI` can be secured by native Azure services like
    `Private Endpoints` and `API Management (APIM)`. As an Azure service, `Azure OpenAI`
    can also be logged and monitored with `Log Analytics`. Having the entire application
    or solution in the Azure cloud makes it easier to manage and monitor.


    Another benefit that is unique to Microsoft is the availability of Azure services
    in sovereign clouds. Sovereign clouds are instances of Azure that been built for
    sovereign nations in order to ringfence such services, which may be a requirement
    for regulatory compliance. For example, there is a sovereign cloud^([^(22)](#fn22))
    for the United States. The `Azure OpenAI` service in the US Azure Government cloud
    meets FedRAMP standards and can be used for sensitive workloads often required
    by the Federal government.


    ### Anthropic and AWS Claude


    Anthropic is an AI company founded in 2021 by former senior members from OpenAI.
    In September 2023, AWS invested in Anthropic. Anthropic’s generative AI model
    is named `Claude`, which AWS refers to as a foundational model (FM).


    AWS provides a fully managed front-end service called `AWS Bedrock`, which is
    an API gateway to a series of FMs. Figure [2-2](#501717_2_En_2_Chapter.xhtml#Fig2)
    below shows some of the foundational models from different AI providers.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig2_HTML.jpg)


    Figure 2-2

    Choice of foundational models (FMs) through Amazon’s Bedrock service


    ### Google Gemini


    Google’s generative AI service is called `Gemini`, and it is an in-house developed
    suite of LLMs. Even though Google also invested in Anthropic, it is not offering
    `Claude` the way AWS is. Google’s investment in Anthropic seems to be part of
    its strategy to level the playing field by funding Microsoft and OpenAI’s competition.


    `Gemini` has made several headlines. In February 2024, Google [announced `Gemini
    1.5`](https://developers.googleblog.com/2024/02/gemini-15-available-for-private-preview-in-google-ai-studio.html)^([^(23)](#fn23))
    will have a context window of 1 million tokens. This was quickly followed by Google
    having to [take `Gemini` offline](https://www.cnbc.com/2024/02/26/googles-gemini-ai-picture-generator-to-relaunch-in-a-few-weeks.html)^([^(24)](#fn24))
    when the image generation capabilities of the model created historically inaccurate
    and sometimes inappropriate images. The controversy was so intense that Google’s
    CEO had to make a public apology amidst growing calls for a change in leadership
    at Google.


    The other concern that continues to plague Google Cloud services is their stance
    on privacy because of their advertising business. This concern extends to `Gemini`
    when it was reported that Google will store customers’ conversations. Reviewing
    `Gemini`’s [privacy hub](https://support.google.com/gemini/answer/13594961#privacy_notice)^([^(25)](#fn25))
    would indicate that conversations are stored in your Google account for 18 months
    by default, but you can modify it from three to 36 months or turn it off. If you
    do not turn it off, the conversations could be reviewed by Google. Reviewed conversations
    will then be stored for up to three years separate from your Google account, and
    because of that, those conversations cannot be deleted.


    ### Hugging Face


    Founded in 2016, Hugging Face is a French AI/ML company that is geared toward
    serving the AI community. The company provides a platform comprised of tools,
    datasets, models, and code to help data scientists, developers, and enthusiasts
    leverage in projects and to further the field of AI and ML.


    Hugging Face has a very open-source feel because it provides access to models
    from other companies and a range of open-source models and tools. It hosts forums
    and classrooms to encourage collaboration within the community.


    Hugging Face^([^(26)](#fn26)) also provides tools and datasets for fine-tuning.
    Fine-tuning is a technique to modify LLMs, and we will cover this technique later
    in Chapter [6](#501717_2_En_6_Chapter.xhtml). Figure [2-3](#501717_2_En_2_Chapter.xhtml#Fig3)
    is a screenshot of the categories of models available at Hugging Face.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig3_HTML.jpg)


    Figure 2-3

    NLP and LLM models available from Hugging Face


    ## Tokens


    When consuming services, there is always a unit of measure involved. For example,
    electricity use is calculated on kilowatts per hour (kW/h). Internet use is a
    monthly subscription cost based on the speed, which is represented by megabits
    per second (Mbps). In cloud computing, a resource such as virtual machines (VMs)
    is based on the number of hours. The more powerful the VM, the more expensive
    it is per hour that the VM is running. Cloud storage is based on the month’s average
    number of bytes consumed by files (blobs).


    With regard to LLMs, we need to introduce a new metric known as the `Token`. Tokens
    are being consumed whenever LLM models are used to process text, and the process
    of converting the text into tokens is called `tokenization`.


    The whole idea of tokenization is to reduce the size of the text into smaller
    units so the LLM can efficiently process it.'
