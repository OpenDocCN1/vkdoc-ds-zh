  trans: '

    ### 即用即付模型中的峰值用户数和每分钟令牌数


    结合上下文，我们再次参考表 2-2 中提到的用例。对于“与自有数据对话”场景，提示令牌数为 2850。因此，如果我们要在美国东部区域部署基于该用例的解决方案，那么在即用即付模型下，该服务每分钟最多可支持约
    84 个用户（240,000 / 2850）。


    至此，我们关于即用即付部署场景下配额和服务限制如何执行的讨论就结束了。需要注意的一点是，由于区域内的其他因素，这些限制有时可能会更低。如果某个区域使用量很大，那么每分钟令牌数可能会显得更低，因为此时可能没有足够的计算资源来支持所有即用即付客户的需求。最好的理解方式是将它类比为互联网宽带服务。即使你订阅的服务理论上可提供高达
    1 Gbps 的带宽，但当你的邻居和你同时在线，并且每个人都在看视频或玩游戏时，实际带宽可能会显著降低。因此，即用即付模型在性能上可能难以预测。


    ### PTU 容量计算器


    如果你需要更稳定和可预测的性能，那么预置吞吐量单元（PTU）模型可能是部署大语言模型（LLM）工作负载的更好方法。请记住，PTU 模型基于预置的计算资源，因此你始终能获得有保障的容量。


    Azure OpenAI Studio 中提供了一个 PTU 容量计算器。如果你已经在即用即付模型下探索过 Azure OpenAI，你可以通过下图 2-17
    所示的方式访问该计算器。但如果您还没有开始体验 Azure OpenAI，也无需担心，我们将在第 3 章中再次详细讨论。


    ![](img/501717_2_En_2_Fig17_HTML.jpg)


    图 2-17


    Azure OpenAI Studio 中的 PTU 容量计算器


    ### PTU 模型中的峰值用户数和每分钟令牌数


    目前我们尚无法使用 Azure PTU 计算器，因此可以参考表 2-4。表 2-4 使用了上文表 2-2 中的“与自有数据对话”用例（提示=2850 个令牌，完成=100
    个令牌）；我们可以据此估算出每分钟可服务的峰值用户数。


    表 2-4


    当 prompt=2850 tokens 且 completion=100 tokens 时，各模型在最小 PTU 下的预估峰值请求数


    | 模型 | 最小 PTU | 每分钟令牌数 | 每分钟峰值请求/用户数 |

    | --- | --- | --- | --- |

    | `gpt-3.5-turbo` (16k) 1106 | 50 | 提示 = 2850<br>完成 = 100 | 171 |

    | `gpt-3.5-turbo` (16k) 0125 | 50 | 提示 = 2850<br>完成 = 100 | 240 |

    | `gpt-4` (8k) 0613 | 100 | 提示 = 2850<br>完成 = 100 | 17 |

    | `gpt-4` (8k) 0125 | 100 | 提示 = 2850<br>完成 = 100 | 25 |

    | `gpt-4` (32k) 0613 | 200 | 提示 = 2850<br>完成 = 100 | 25 |


    从表 2-4 中需要注意几点：


    *   有时你可能会看到每分钟令牌数作为一个单一维度被提及，而没有分解为提示令牌和完成令牌，但为了更准确地估算峰值用户数，我们应始终定义每种类型的令牌数量。请记住，提示令牌比完成令牌成本更低，但提示所需的令牌数通常高于完成所需的。


    *   各用例（表 2-2）中观察到的提示令牌和完成令牌数量仅供参考。最好使用你环境中实际观察到的提示令牌和完成令牌数据。


    *   使用容量计算器来确定你的用例所需的 PTU 数量，我们将在第 3 章中详细讨论这一点。


    下图 2-18 总结了不同模型在即用即付与 PTU 模型下每分钟令牌数的对比。


    ![](img/501717_2_En_2_Fig18_HTML.jpg)


    图 2-18


    不同模型在即用即付与 PTU 模式下的每分钟令牌数对比


    当超出每分钟令牌数限制时，Azure OpenAI 将返回一个 429 错误，如下图 2-19 所示。我们将在后面的章节中探讨处理此错误的方法。


    ![](img/501717_2_En_2_Fig19_HTML.jpg)


    图 2-19


    超出每分钟令牌数限制时的 429 错误


    ## 使用大语言模型


    与传统的人工智能和机器学习模型不同，你无需在使用前训练大语言模型。在本章前面部分，我们了解了分词如何将语言转换为数字。大语言模型经过训练，可以使用分词后的内容来计算单词和句子之间的方差。单词和句子之间的方差程度取决于它们的相似或差异程度。单词和句子越相似，方差就越小。这是理解大语言模型工作原理的最简单方式，正因如此，它有时被称为“语言计算器”。


    在任何时候，你都不需要将自己的内容加入大语言模型并对其进行训练。大语言模型也不会随着时间的推移根据你的内容学习或识别模式。因此，大语言模型是一个只理解语言而非知识的人工智能模型。^(⁴⁰)


    OpenAI 这家公司仍然是各种 GPT 模型的所有者。他们将负责用新参数重新训练大语言模型，并发布新的模型和版本（例如，从 GPT-3.5 到 GPT-4，从
    GPT-4 0613 到 GPT-4 0125）。


    但是，如果你想添加参数使你的大语言模型满足独特需求，那么只有在这种情况下，你才需要将自己的专有内容注入基础大语言模型。这被称为微调。否则，你将通过一个称为提示工程的过程与大语言模型进行交互。

