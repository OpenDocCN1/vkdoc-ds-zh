- fmt: '### Structured Data, Codex, Agents, and DBCopilot (Chapter [8](#501717_2_En_8_Chapter.xhtml))


    `LangChain` is an alternative and (currently) more extensible framework for extending
    generative AI. In Chapter [8](#501717_2_En_8_Chapter.xhtml), we will introduce
    `LangChain` as an alternative to `Semantic Kernel` by introducing additional use
    cases.


    These use cases include the use of structured data instead of unstructured data.
    This leverages the `codex` capability of LLMs to understand database schemas,
    generate and execute queries, and represent the results from the queries.


    `DBCopilot` is a Microsoft-coined term, but it is now commonly used in the industry
    to refer to generative AI solutions that interact with databases.


    In Chapter [7](#501717_2_En_7_Chapter.xhtml), we will start exploring the multimodal
    capabilities of `Azure OpenAI` and specific use cases based on projects that we
    have undertaken. The use cases we will go into detail are the following:


    ## Azure AI Services (Chapter [9](#501717_2_En_9_Chapter.xhtml))


    `Azure OpenAI` joins the `Microsoft Cognitive Services` portfolio of services.
    `Azure Cognitive Services` can be best described as AI-as-a-Service (`AIaaS`).
    The different `AIaaS` offering in the `Microsoft Cognitive Services` portfolio
    is depicted in Figure [1-2](#501717_2_En_1_Chapter.xhtml#Fig2). There are other
    purpose-built AI models that predate `Azure OpenAI`, like `Computer Vision`, `Speech-to-Text/Text-to-Speech`,
    `Translator`, etc. Some of these may seem to overlap with `Azure OpenAI`, for
    example, `Azure Translator` and `Azure OpenAI`’s multilingual capabilities for
    more than 40 languages. We will discuss which service to use and the why and when
    scenarios. We will also discuss projects where other `Cognitive Services` capabilities
    are incorporated as part of an `Azure OpenAI` project in order to complement the
    LLM.


    ![](images/501717_2_En_1_Chapter/501717_2_En_1_Fig2_HTML.jpg)


    **Figure 1-2**


    - `Microsoft Azure AI` portfolio - see `Cognitive Services` family of `AIaaS`
    highlighted in yellow


    ## Resources and Code Samples


    Resources and code samples from this book will be shared through `GitHub`. The
    public `GitHub` site for this book will be located at [https://github.com/juliansoh/DataScienceSolutionsOnAzure-2ndEdition](https://github.com/juliansoh/DataScienceSolutionsOnAzure-2ndEdition).


    ## Summary


    In this chapter, we have highlighted all the changes and advancement in AI in
    the last three years, with the biggest one being generative AI. As such, where
    we spent the first edition providing a balanced exposure to traditional data science
    using `Azure Machine Learning` and Applied Science using `Azure Cognitive Services`,
    in this second edition, we will focus more on generative AI. We feel that it is
    a fitting evolution of AI and fits nicely with the real-life transformation that
    organizations, as society in general, are undergoing.


    Since we, as authors, work primarily in building Microsoft-based solutions, we
    will use `Azure OpenAI` as the de facto generative AI technology. However, bear
    in mind that as far as generative AI and large language models go, there are other
    open-source LLM models as well as technology offered by Microsoft competitors,
    such as `Google` and `AWS`. `Google Bard`, `PaLM2`, `Codey`, and `Imagen` are
    alternatives and competitors to the `Azure OpenAI` stack, as is `AWS`’s $4 billion
    investment in `Anthropic AI`([20](#fn20)). Regardless of the technology stack,
    the current state of generative AI is such that all the core concepts that we
    cover in this book remain relevant, the technical reference architectures such
    as `RAG` are also relevant, techniques for testing and prompt engineering are
    also platform agnostic, and so are the organizational and societal impacts. At
    the time of this writing, `Azure OpenAI` and the GPT models are clearly the most
    popular and best performing LLMs available. The benefit of being first to market
