    sufficiently so you can follow along. Take note on how the plugins are being imported
    and subsequently used to generate the desired marketing correspondence and the
    recipient.


    ### Planner Versus Function Calling


    Once you have multiple plugins, as will likely be the case for many, if not all,
    real-world applications, there will be a need for the LLM to be aware of the plugins
    and be able to use them together to complete a request or task.


    Semantic Kernel introduced the concept of the planner that allows the LLM to use
    the different plugins. The planners use prompts to request the AI to select which
    function to invoke.


    However, newer versions of OpenAI models (version 0613 and above) have the capability
    to natively invoke functions, and this is known as function calling. As such,
    Semantic Kernel is evolving to use function calling as the primary way to plan
    and execute tasks. Even though planners are still supported in Semantic Kernel,
    the ability for other AI models such as Gemini, Claude, and Mistral that also
    support function calling as a native capability makes function calling in Semantic
    Kernel a feature that can be used across many models. As such, it is recommended
    that function calling in Semantic Kernel be the primary method ^([^(88)](#fn88))
    used to plan and execute tasks.


    Because of this development, we will not be covering planners but will focus on
    function calling. If you are using an older model that does not support function
    calling, you can learn about planners and the evolution towards function calling;
    here is a good [resource](https://devblogs.microsoft.com/semantic-kernel/migrating-from-the-sequential-and-stepwise-planners-to-the-new-handlebars-and-stepwise-planner/)
    ^([^(89)](#fn89)) at the Microsoft developer blogs that covers this.


    #### Automatic Function Calling


    Function calling is merely a way for an AI model to natively invoke a function.
    An extension of function calling, known as Automatic Function Calling, is the
    ability of the LLM to understand what functions are available for different tasks
    and subsequently use that as part of its knowledge to respond to requests.


    A good way to describe Automatic Function Calling is to associate it to “follow-up
    question or action” scenarios. These scenarios involve requests for tasks that
    can be executed only after clarifying questions or actions need to occur first.


    **Example 1: Follow-up question (a chat-based scenario)**


    User: Please give me the phone number of the nearest customer service location


    LLM: What is your location?


    User: I am located in Seattle.


    LLM: I have several locations for Seattle. Here are the addresses – ...


    **Example 2: Follow-up action (an automation scenario)**


    User: Please turn on all lights


    LLM: Thought process = *find all lights, select only lights that are currently
    off, identify the names of the lights that are off, turn them on, report to user
    that all lights are now on and the specific ones that were turned on were x, y,
    and z.*


    In the above two examples, to carry out follow-up questions or actions requires
    iterative logic (e.g., a loop) until all the information required to execute a
    task can be achieved. Automatic Function Calling handles this for you.'
