    # 7. Semantic Kernel, Plugins, and Function Calling


    In this chapter, we will be transitioning from focusing on the LLM, to designing
    LLM-driven solutions. Therefore, the topic is how we get LLMs to carry out tasks
    that come through requests or via workflows. Historically, tasks and workflows
    are orchestrated by automation tools such as batch jobs, Logic Apps, Power Automate,
    UIPath, etc.


    We can view these automation tools as external orchestrators because they primarily
    rely on APIs to interact with different services, and depending on the response
    received from the different services, these orchestrators can invoke other services,
    including the LLM. In fact, earlier chapters and the previous edition of this
    book relied heavily on this approach. Figure [7-1](#501717_2_En_7_Chapter.xhtml#Fig1)
    below depicts the way an orchestrator conducts a structured workflow to connect
    different services into a workflow or solution.


    ![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig1_HTML.jpg)


    **Figure 7-1** – Automation via tradition orchestration tools


    On the other hand, with LLMs, there is the concept of making the LLM the orchestrator.
    To accomplish this, we need to be able to extend the LLM to directly initiate
    external tasks. Making the LLM the orchestrator is a very natural concept because,
    as we describe generative AI in the first chapter, it is a digital representation
    of a human brain. Therefore, decision-making should naturally be driven by the
    LLM. Figure [7-2](#501717_2_En_7_Chapter.xhtml#Fig2) below shows the LLM as the
    orchestrator, using the concept of agents specializing in the different tasks.
    Compared to traditional automation, an LLM-driven orchestration is more dynamic
    in nature and can be triggered via natural language.


    ![](images/501717_2_En_7_Chapter/501717_2_En_7_Fig2_HTML.jpg)


    **Figure 7-2** – Conceptual – leveraging and extending the LLM to conduct external
    tasks


    The most popular methods of “binding” LLMs to different capabilities that enable
    them to initiate tasks are provided by two open-source frameworks – LangChain
    and Semantic Kernel. Depending on which framework you use, the “binding” as depicted
    in Figure [7-2](#501717_2_En_7_Chapter.xhtml#Fig2) is either known as *chains*
    (LangChain) or *plugins* (Semantic Kernel). This is the common conceptual representation
    of both frameworks, although they differ in implementation.


    In this chapter, we will focus on Semantic Kernel and learn the concepts of agents
    and plugins. In the next chapter, we will compare Semantic Kernel to LangChain,
    but we will use LangChain as the approach to develop a solution (DBCopilot), so
    you will understand both frameworks.


    Which framework is best? Unfortunately, like most answers, it depends. We will
    help evaluate both frameworks in the next chapter, but for now, let us focus on
    Semantic Kernel.


    ## Introduction^([^(78)](#fn78)) to Semantic Kernel


    Semantic Kernel is an open-source software development kit (SDK) provided by Microsoft.
    It is used by developers to build agents for LLMs. Semantic Kernel works with
    OpenAI models as well as models but also with other models like Hugging Face and
    more. Semantic Kernel supports Python, C#, and Java code.


    ### Use Cases


    To date, most use cases take the form of a Chat UI or via questions and answers
    on a site, just like ChatGPT, but that is not the only use case nor, in our opinion,
    the most compelling use case.'
