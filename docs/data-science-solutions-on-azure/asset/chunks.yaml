    [6-30](#501717_2_En_6_Chapter.xhtml#Fig30) and that it eventually disappears from
    the deployments screen.


    ## Summary


    In this chapter, we learned about the different prompt engineering techniques
    and best practices. Prompt engineering is an important aspect of grounding an
    LLM and SLM, and it is the first thing you need to do.


    Beyond prompt engineering, we can rely on the RAG model (recommended) and configure
    semantic and vector search to provide results, as covered in the previous chapters.


    However, there are use cases where you may need to fine-tune a model, such as
    when you need to host it on edge devices or in disconnected environments. You
    may also want to develop a domain-specific model where the RAG architecture may
    not be efficient enough. These are some of the good use cases for fine-tuning,
    but the recommendation is to always look at RAG before fine-tuning. Remember that
    once a base model has been fine-tuned, it becomes a custom model, and you have
    to manage its lifecycle. Custom fine-tuned models are not reintroduced into future
    versions of base models.


