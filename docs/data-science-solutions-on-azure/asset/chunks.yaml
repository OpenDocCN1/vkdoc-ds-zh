    # Hands-On Exercise 9-2: Custom Vision


    We will not be able to explore *every* AI service given the page constraint of
    this book, but by understanding how one Azure AI service works, the principle
    is the same and can be applied to all the other AI services.


    In this hands-on exercise, we will explore AI Custom Vision by creating a model
    that can detect objects.


    *Scenario:* You are asked to use AI to ensure workplace safety. Images extracted
    from videos are available, and these are artifacts available to you. The AI needs
    to ensure workers are wearing hard hats as protective gear.


    ![](images/501717_2_En_9_Chapter/501717_2_En_9_Fig7_HTML.jpg)


    Figure 9-7: Properties for the custom vision project of type "Object Detection"


