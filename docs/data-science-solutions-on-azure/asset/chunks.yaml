    # 9. Azure AI Services


    In the first edition of this book, we focused on the science in data science.
    We discussed statistical methods, machine learning, data preparation, and how
    models are created, updated, and maintained through MLOps (machine learning operations).


    In this edition, not only have we been focusing on generative AI, but we are also
    now going to look at applied AI as well. Applied AI is the consumption end of
    data science, where we are *not* going to worry about model creation and maintenance,
    but just consuming models that have been optimized for specific tasks. That is
    why applied AI is sometimes referred to as “pre-packaged AI” or “AI-as-a-Service.”


    ## Azure AI Services


    Microsoft Azure has had a portfolio of pre-packaged AI services since at least
    2016, and the current name of this portfolio is called Azure AI services. You
    may have heard other names such as Cognitive Services and applied AI. A look at
    the history of these services will shed some light on how these names came about
    and the future roadmap for these services.


    ### History


    Since the launch of its AI services, Microsoft has renamed and repackaged these
    services several times and that has led to no small amount of confusion.


    #### Azure Cognitive Services


    Microsoft initially named its pre-packaged AI services as Azure Cognitive Services.
    The name was selected because it generally covered the human cognitive capabilities
    – speech, language, vision, and decision-making. Microsoft Research has invested
    significant resources in creating models that can recognize objects, understand
    language, and process facial characteristics to recognize age, gender, and emotion.


    These capabilities are then packaged into services that can easily be used by
    application developers, thereby making artificial intelligence available in a
    very turnkey way. Microsoft calls this the democratization of artificial intelligence.


    How does it work? Developers no longer need to be data scientists and have access
    to huge amounts of data to create models that can accurately identify people or
    certain objects. Microsoft is also in the position to access a lot of public data
    that is needed to train, maintain, and improve the pre-packaged models.


    Microsoft differentiated these developer-centric pre-packaged AI models from traditional
    data science work by separating it from Azure Machine Learning (AML).'
