    # 思维链（CoT）提示


    `CoT` 提示是一种鼓励推理和多步骤思考的技术。它涉及提供一些示例问题和答案，然后跟随着实际问题（少样本提示），这有助于模型生成推理以回应提示。这项技术是“分解任务”方法的一种变体。如下图
    6-7 所示，`CoT` 提示不仅仅是把任务拆分成更小的步骤，它还指示模型逐步进行并展示所有涉及的步骤。这种系统化的方法最大限度地减少了不准确性，并使评估模型的响应变得更加容易。以下是
    `CoT` 的一些优势：


    - **增强推理能力：** `CoT` 提示促进了通过问题进行逻辑化和系统化的思考。

    - **减少错误：** 将任务分解成更小、更易于管理的步骤会降低出错的可能性。

    - **清晰透明：** 逐步呈现的方式阐明了推理过程，使得验证结果更加容易。

    - **改善学习：** 这种方法有助于精确找出模型需要改进的特定领域，从而实现有针对性的训练。


    ![](img/501717_2_En_6_Fig7_HTML.jpg)


    **图 6-7** — 提示工程代码示例：思维链提示


    通过思维链提示，模型可以增强其推理能力，并产生更准确、更易理解的响应。然而，它也存在以下局限性：


    - **复杂性管理：** 虽然 `CoT` 提示有助于处理复杂任务，但处理每一步可能需要更多的计算资源和时间。

    - **额外开销：** 阐明每一步可能很繁琐，尤其是对于那些直接回答就足够的简单任务。

    - **可扩展性：** 对于非常庞大和复杂的问题，逐步方法可能会变得过于详尽，需要在全面性和效率之间取得平衡。


    ![](img/501717_2_En_6_Fig8_HTML.jpg)


    **图 6-8** — 提示工程代码示例：自一致性提示


    # 自一致性提示


    与 `CoT` 直接生成 token 的简单方法相比，这可能是更高级的提示工程技术之一，它涵盖了生成响应的多种不同路径。如下图 6-8 所示，此方法用于提高少样本
    `CoT`（常识变换器）模型在需要算术和常识推理任务上的性能。它涉及通过 `CoT` 模型采样多个不同的推理路径，并使用生成的响应来选择最一致的答案。在这种技术中，`CoT`
    模型被提示执行一个需要算术或常识推理的特定任务或问题。不是依赖单一的推理路径，而是通过扰动输入或使用不同的推理技术，让模型生成多个响应。这些多样化的推理路径允许模型探索不同的可能解决方案或解释。


    一旦模型生成了这些多个响应，就会对它们进行一致性评估。彼此一致的响应被认为更可靠，并能指示出正确答案。然后选择最一致的响应作为最终答案。通过使用自一致性提示技术，可以提升
    `CoT` 模型在涉及算术和常识推理任务上的性能。这种方法利用了模型生成多个不同响应的能力，并选择最一致的那个，从而提高了模型预测的整体准确性和可靠性。


    ![](img/501717_2_En_6_Fig10_HTML.jpg)


    **图 6-10** — 提示工程代码示例：思维树


    ![](img/501717_2_En_6_Fig9_HTML.jpg)


    **图 6-9** — 思维树提示架构。来源：[*https://arxiv.org/pdf/2305.10601*](https://arxiv.org/pdf/2305.10601)


    # 思维树


    Yao 等人 (2023) 和 Long (2023) 引入了一个称为思维树 (ToT) 的框架，该框架解决了传统提示技术在处理需要探索或战略性前瞻的复杂任务时的局限性。ToT
    建立在思维链提示的概念之上，并强调将中间思维作为一种使用语言模型解决问题的手段进行探索。如下面的图 6-9 所示，在 ToT 中，维护了一个树状结构，其中每个节点代表一个连贯的语言序列（思维），作为解决问题的中间步骤。该框架使语言模型
    (LM) 能够通过自我评估推理过程中生成的中间思维来评估其进展。通过将 LM 的思维生成和评估能力与广度优先搜索或深度优先搜索等搜索算法相结合，ToT 促进了通过前瞻和回溯对思维进行系统化探索。


    为了更好地理解 ToT，请考虑图 6-10 中显示的示例提示，其中语言模型的任务是解决一个复杂的数学问题：“找出前 10 个质数的和。”在 ToT 框架中，初始提示可以是“生成一个给定范围内的质数列表。”然后模型将生成中间思维，例如“检查一个数是否为质数”或“在找到质数时记录总和。”这些思维代表了解决最终问题的连贯步骤。模型可以评估这些思维的质量和相关性，并探索思维树的不同分支，以找到最有效的解决方案。


    ![](img/501717_2_En_6_Fig11_HTML.jpg)


    **图 6-11** — 提示工程代码示例：在最后重复指令


    # 在末尾重复指令


    近因偏差可能会影响模型，其中提示末尾的信息对输出的影响可能比开头的信息更大。为了减轻这种偏差，探索在提示末尾重复指令的效果并评估其对生成响应的影响是很有价值的。如下图
    6-11 所示，考虑一个提示，其任务是生成给定文章的摘要：“用 JSON 格式，以 `highlight1`、`highlight2`、`highlight3`
    为键，用三句话总结以下关于气候变化的文章 {article}。”为了解决近因偏差，可以修改提示，在末尾增加重复：“用 JSON 格式，以 `highlight1`、`highlight2`、`highlight3`
    为键，用三句话总结以下关于气候变化的文章 {article}，确保提取为 JSON，键为 `highlight1`、`highlight2`、`highlight3`。”


    通过在提示末尾重复关于包含文章中特别与气候变化相关的关键点的指令，目的是确保模型对整篇文章的信息给予同等的考虑，而不是过度优先处理结尾部分。然后可以通过比较针对原始提示和修改后提示生成的响应来评估这一修改的影响，以确定重复指令是否有助于减少近因偏差并生成更均衡的摘要。


    # 迭代与实验


    最后，创建有效的提示通常需要一个迭代和实验的过程。根据模型的响应来微调你的提示，并观察不同的指令如何影响结果。这个迭代过程可以帮助你优化提示，使其更好地满足你的需求并达到期望的结果。根据反馈和结果调整你的提示，尝试不同的措辞和指令，看看哪些能产生最佳响应。

    '
- fmt: '到目前为止，我们探索了提示工程的最佳实践。我们了解了提示工程在充分发挥语言模型潜力方面所起的关键作用。它涉及设计能够有效引导模型生成准确且相关响应的提示。本章重点介绍了几种增强提示工程的策略；这些策略包括：融入系统消息、减少偏见、提供相关上下文、提示链、思维链提示、在结尾重复指令，以及通过实验进行迭代。这些实践有助于优化语言模型的性能和可靠性，使其能够生成准确且符合预期的响应。接下来，我们将深入探讨小型语言模型以及如何/何时利用它们。


    ## 小型语言模型


    尽管本书的核心内容和当今的主流认知都集中在大型语言模型（LLM）上，但对于任何关注的人来说，小型语言模型（SLM）的崛起几乎无法忽视，其原因在于物联网和边缘计算等用例。Hugging
    Face 的首席执行官兼联合创始人 Clem Delangue 甚至声称，2024 年将是SLM之年。


    ### 概念


    SLM 本质上只是 LLM 的缩小版本，其目标同样是理解、生成和解释自然语言。


    SLM 旨在平衡以下两个方面：一方面要具备足够的语言处理能力，另一方面要控制存储和处理自然语言请求所需的模型体积。下面的表 [6-1](#501717_2_En_6_Chapter.xhtml#Tab1)
    比较了训练 SLM 和 LLM 时使用的参数数量范围。


    **表 6-1** 训练中使用的参数数量（LLM 与 SLM 对比）


    | 模型类型 | 参数数量 | 模型示例 |

    | --- | --- | --- |

    | 小型语言模型（SLM） | 100 万 – 50 亿 | `Phi-1`, `Phi-2`, `Phi-3-mini`, `Phi-3-small`,
    `Mistral-7B`, `Zephyr-7B` |

    | 大型语言模型（LLM） | 100 亿 – > 1 万亿 | `GPT-3.5`, `GPT-4`, `Gemini`, `LLaMA` |


    #### 更大并不总是更好


    SLM 的理念在于，更大的模型并不总是更好，尽管最初的驱动力可能主要来自于成本。


    较低的计算需求使得 SLM 的运营成本更低。其他优势包括推理速度，这带来了更高效的响应时间。综合来看，部署多个面向任务的 SLM 可能比部署单个 LLM 效率更高。


    在某些情况下，SLM 的性能优于 LLM。在此语境下，性能是衡量响应质量而非速度的指标。响应质量受到准确性、幻觉风险和偏见的影响。


    由于参数数量较少，SLM 往往比 LLM 的偏见更少。此外，正如我们稍后将看到的，SLM 通常通过微调进行定制，以包含有针对性的、特定领域的训练数据。这种针对领域特定数据集的微调降低了偏见风险。另一方面，LLM
    是基于从互联网收集的大量数据进行训练的。这就是为什么正确地对 LLM 进行“落地”（`grounding`）非常重要，并且与 SLM 相比，对 LLM 进行此操作的难度更高。SLM
    训练数据集较小的另一个好处是降低了幻觉风险。图 [6-12](#501717_2_En_6_Chapter.xhtml#Fig12) 展示了 SLM 的优势。了解了这些优势后，让我们来看看
    SLM 的用例。


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig12_HTML.jpg)


    **图 6-12** 小型语言模型（SLM）的优势


    ### 用例


    SLM 可用于与 LLM 相同的用例——客户服务、内容生成、翻译等。然而，如上所述，它们的特点是能够将生成式 AI 扩展到以下对当前 LLM 而言可能具有挑战性的环境中：


    #### 物联网


    物联网（IoT）指的是连接到互联网的设备。它们通常被称为“智能设备”，在我们的日常生活中随处可见。智能锁、冰箱、摄像头、暖炉、车库门开启器等都是“智能家居”类别中的物联网设备示例，这是现代家庭的一部分。物联网设备可以从设备端
    AI 能力中获益，以实现更高效的处理。


    #### 低带宽和断网设备


    许多场景下网络连接受限，例如美国的许多国家公园以及全球许多基础设施不完善的地区。这些无网络连接的区域可以通过配备生成式 AI 的设备来更好地服务人们。低带宽或无网络连接的用例也可能发生在海上或太空。通常，一项技术的可用性，尤其是诸如生成式
    AI 这样的技术，不仅能使这些地区或情境中的人们受益，而且还可能关乎生死。例如，一个用例可能是遏制人口贩卖。


    #### 语言翻译与本地化


    除了低带宽或无带宽地区之外，配备特定语言 SLM 并针对本地化或情境用例进行微调的设备可用于解决特定问题。例如，为了减少人口贩卖导致的死亡，被困在偏远地区的受害者将能够访问支持
    AI 的设备来寻求帮助。SLM 可以提升移动性，从而使援助人员能够携带支持 AI 的设备前往村庄提供帮助，在这些场景中，翻译服务起着关键作用。除了翻译之外，作为生成式
    AI 模型（尽管训练参数比 LLM 少），SLM 仍然可以具备情感分析能力，并进一步使用领域特定数据进行微调。以援助偏远村庄工作人员为例，一个领域特定的数据集可能涉及卫生以及食用野味^(67)的危险（这是
    COVID-19 的一个可能起因）。这将显著提升互动质量，并最终提高通过教育提供援助的有效性。'
  raw: 'So far, we explored prompt engineering best practices. We covered how prompt
    engineering plays a vital role in harnessing the full potential of language models.
    It involves designing prompts that effectively guide the model toward generating
    accurate and relevant responses. Several key strategies are highlighted in this
    chapter to enhance prompt engineering; these include incorporating system messages,
    mitigating biases, providing relevant context, prompt chaining, chain of thought
    prompting, repeating instruction in the end, and iterating through experimentation.
    These practices help optimize the performance and reliability of language models
    in generating accurate and desired responses. Next, we will dive into small language
    models and how/when to leverage them.


    ## Small Language Models


    Although the core of this book and the perception of the day are centrally focused
    on LLMs, for anyone paying attention, the rise of small language models (SLMs)
    can hardly go unnoticed, and the reason for this is because of use cases such
    as IoT and endpoint computing. Hugging Face CEO and co-founder Clem Delangue even
    made a claim that 2024 will be the year of SLMs.


    ### Concept


    SLMs are basically just scaled-down version of LLMs with the same goal of understanding,
    generating, and interpreting natural language.


    SLMs aim to strike the balance between being able to provide sufficient proficiency
    in the latter, versus the footprint size to store and process requests in natural
    language. Table [6-1](#501717_2_En_6_Chapter.xhtml#Tab1) below compares the range
    in the number of parameters used when training SLMs versus LLMs.


    Table 6-1


    Number of parameters used in training (LLMs versus SLMs)


    | Model type | Number of parameters | Models |

    | --- | --- | --- |

    | Small language models (SLMs) | 1 million–5 billion | Phi-1, Phi-2, Phi-3-mini,
    Phi-3-small, Mistral-7B, Zephyr-7B |

    | Large language models (LLMs) | 10 billion to >1 trillion | GPT-3.5, GPT-4, Gemini,
    LLaMA |


    #### Bigger Is Not Always Better


    The promise of SLMs is that a bigger model is not always better, even though the
    initial primary motivation may be driven by cost.


    The lower compute requirements make SLMs less costly to operate. Additional benefits
    include inference speed, which leads to efficiency in response times. Taken together,
    it may be more efficient to deploy multiple task-oriented SLMs versus a single
    LLM.


    There are instances where the performance of SLMs fare better than LLMs. In this
    context, performance is used as a measurement of the quality of responses rather
    than speed. Quality of response is affected by accuracy, risk of hallucinations,
    and biasness.


    SLMs tend to be less bias than LLMs because of the smaller number of parameters.
    Furthermore, as we will see later, SLMs are usually customized via fine-tuning
    to include targeted, domain-specific training data. This fine-tuning on domain-specific
    datasets lowers the risk of biasness. LLMs on the other hand are trained on lots
    of data that have gleaned from the Internet. That is why it is important to properly
    ground LLMs, and the effort to do so is higher for LLMs versus SLMs. Another benefit
    of a smaller training dataset in SLMs is also the reduced risk of hallucinations.
    Figure [6-12](#501717_2_En_6_Chapter.xhtml#Fig12) represents the benefits of SLMs.
    With these benefits in mind, let us examine the use cases for SLMs.


    ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig12_HTML.jpg)


    Figure 6-12


    Benefits of small language models (SLMs)


    ### Use Cases


    SLMs can be used in the same use cases as LLMs – customer service, content generation,
    translation, etc. However, as mentioned above, their niche is the ability to extend
    generative AI into the following environments that may be challenging for LLMs
    today:


    #### Internet of Things


    Internet of Things (IoT) refer to devices that are connected to the Internet.
    Commonly known as “smart devices,” we see them in our everyday lives. Smart locks,
    refrigerators, cameras, furnaces, garage door openers, etc., are examples of IoT
    devices in the “Smart Home” category of what constitutes a modern home. IoT devices
    can benefit from on-device AI capabilities for more efficient processing.


    #### Low Bandwidth and Disconnected Devices


    There are many scenarios where network connectivity is limited, such as many national
    parks in the United States and many parts of the world where infrastructure is
    not in place. These disconnected areas can be better served with devices that
    possess generative AI to assist people. Low or no connectivity use cases also
    occur at sea or in space. Oftentimes, the availability of technology, especially
    one such as generative AI, not only benefits people in these areas or situations,
    but it may also make a difference between life and death. For example, one use
    case may be to curb human trafficking.


    #### Language Translation and Localization


    In addition to low or no bandwidth areas, devices equipped with language-specific
    SLMs that are also fine-tuned for localization or situational use cases can be
    used to target-specific issues. For example, to reduce fatalities resulting from
    human trafficking, victims stranded in remote areas will be able to access AI-enabled
    devices to seek assistance. SLMs can promote mobility so AI-enabled devices can
    be used by aid workers going to villages to help, where translation services play
    a crucial role. On top of translation, SLMs, being a generative AI model, albeit
    trained with fewer parameters than LLMs, can still possess sentiment and further
    fine-tuned with domain-specific data. Using the example for aid workers in remote
    villages, a domain-specific dataset may be on hygiene and the dangers of consuming
    wildmeat^([^(67)](#fn67)) (a likely cause of COVID-19). This significantly improves
    the quality of interaction and ultimately the effectiveness in providing aid through
    education.'
