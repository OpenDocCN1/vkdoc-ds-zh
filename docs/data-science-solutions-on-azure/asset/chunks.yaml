    About the Authors About the Technical Reviewer


    # 1. Data Science in the Modern Enterprise – An Update


    In the first edition of this book, we set out to introduce data science in a traditional
    fashion – an algorithmic and statistical approach to analyzing data and using
    the data to create models that primarily serve to predict or categorize future
    data. Data science was still a fairly new concept for the enterprise even though
    data science has been around for several decades.


    We highlighted emerging concepts like digital transformation and leveraging data
    to drive business decisions. The role of the data scientist was immediately escalated
    but is still not a mainstream role that organizations are recruiting for.


    For the last three and a half years since the release of the first edition, we
    followed the digital transformation journey of many organizations. Coupled with
    advances in technology, AI and machine learning have been exponentially dominating
    IT strategies and portfolios. Leading publications such as Forbes, Fortune, and
    Businessweek have said AI and ML have grown on average 17% year over year between
    2021 and 2023 and projected to grow 43% year over year between 2023 and 2026.
    McKinsey & Company, an organization that helps their C-suite clients make informed
    long-term decisions and improve organizational performance, saw AI adoption by
    organizations increase from 50% in 2020 to 63% in 2021.


    This phenomenal growth *excludes* any growth attributed to generative AI because
    ChatGPT was only revealed to the world in November 2022. Seemingly overnight,
    ChatGPT essentially jettisoned AI from a niche technology belonging to the domain
    of organization into mainstream everyday life.


    ## The Modern Enterprise (2020–Today)


    These are the significant observations by enterprises when adopting AI in their
    portfolios:


    *   Data scientists are expensive resources, and even with data scientists, many
    organizations do not know how to leverage these resources.


    *   Data science projects may take many iterations and therefore a long time before
    yielding any results. In our work with customer organizations, we have heard data
    science initiatives being labeled “*science projects”* because many are not in
    production.


    *   There may not be sufficient data to create an effective model.


    *   Data quality significantly impacts the effectiveness and accuracy of a model.


    *   Graphical processing units (GPUs), which are the computing horsepower to train
    and create models, are very expensive, and there is a worldwide shortage, which
    in turn continues to drive the prices up.


    Essentially, most organizations realize they do not have the ability to *execute
    at scale* in all the above areas to make effective use of AI.


    In the first edition, we introduced AI-as-a-Service (AIaaS), also known as Cognitive
    Services in the Microsoft Azure portfolio. AIaaS is designed to solve many of
    the issues faced by organizations trying to build their AI practice. Instead of
    creating, optimizing, and maintaining their own models, why not use pre-trained
    purposeful models? Azure Cognitive Services identifies capabilities that can be
    trained into a reusable generic model by any organization. The organization will
    then customize such models with their data so the model is now relevant to the
    business. Using this approach, significantly less data is required to create a
    usable model.


    An example of an Azure Cognitive Services is Computer Vision. Using deep neural
    network (DNN) technologies and vast amounts of training data, Microsoft was able
    to create a model that does an excellent job at analyzing images, but it does
    not know what it is seeing in an image. Then by introducing and tagging sample
    images for training, the model can very quickly be customized to effectively identify
    or classify things it sees in images. We will cover Azure Cognitive Services in
    detail in Chapter [9](#501717_2_En_9_Chapter.xhtml).


    AIaaS is the foundation and precursor to generative AI. Having a large language
    model (LLM) like generative AI which is then extended to ingest and understand
    content fed to it is the same approach as AIaaS. As such, it is only natural that
    Azure OpenAI is part of the Azure Cognitive Services portfolio of services.


    You may also hear AIaaS often referred to as applied AI. Used synonymously, these
    just describe the consumption of AI models without the extensive involvement of
    data scientists. We will cover Azure OpenAI in detail in Chapter [3](#501717_2_En_3_Chapter.xhtml).
    In fact, because generative AI is such a hot topic today, this edition will prominently
    feature this technology.'
