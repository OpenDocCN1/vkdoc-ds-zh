    关于作者 关于技术审校


    # 1. 现代企业中的数据科学——更新版


    在本书的第一版中，我们以传统方式介绍数据科学——一种用于分析数据并利用数据创建模型的算法与统计方法，这些模型主要用于预测或分类未来数据。尽管数据科学已经存在了几十年，但对企业而言，它仍然是一个相当新的概念。


    我们强调了数字化转型等新兴概念，以及利用数据驱动业务决策的重要性。数据科学家的角色随即被提升，但至今仍不是各组织正在招聘的主流职位。


    自第一版发布以来的三年半里，我们见证了许多组织的数字化转型历程。伴随着技术的进步，人工智能和机器学习已呈指数级增长，主导着 IT 战略和产品组合。《福布斯》、《财富》和《商业周刊》等权威出版物指出，AI
    和 ML 在 2021 年至 2023 年间年均增长 17%，并预计在 2023 年至 2026 年间年均增长 43%。麦肯锡公司帮助其高管客户做出明智的长期决策并提升组织绩效，据其观察，组织对
    AI 的采用率从 2020 年的 50%增长到了 2021 年的 63%。


    这一显著增长*不包括*生成式 AI 带来的任何增长，因为 ChatGPT 直到 2022 年 11 月才向世界公开。几乎在一夜之间，ChatGPT 将 AI
    从一种属于组织领域的利基技术，推向了主流的日常生活。


    ## 现代企业（2020 年至今）


    以下是企业在将 AI 纳入其产品组合时的重要观察：


    *   数据科学家是昂贵的资源，即使拥有数据科学家，许多组织也不知道如何利用这些资源。

    *   数据科学项目可能需要多次迭代，因此在产生任何结果之前可能需要很长时间。在与客户组织的合作中，我们曾听到数据科学计划被贴上“*科学项目*”的标签，因为许多项目并未投入生产。

    *   可能没有足够的数据来创建有效的模型。

    *   数据质量显著影响模型的有效性和准确性。

    *   图形处理单元是训练和创建模型的计算动力，但非常昂贵，并且全球范围内存在短缺，这反过来又持续推高价格。


    基本上，大多数组织意识到他们在上述所有领域都缺乏*大规模执行*的能力，无法有效利用 AI。


    在第一版中，我们介绍了人工智能即服务（AIaaS），在 Microsoft Azure 产品组合中也称为认知服务。AIaaS 旨在解决试图建立其 AI 实践的组织所面临的许多问题。与其创建、优化和维护自己的模型，为什么不使用预训练的、有针对性的模型呢？Azure
    认知服务识别出可由任何组织训练成可重用通用模型的能力。然后，组织将使用自己的数据定制此类模型，使模型与业务相关。采用这种方法，创建可用模型所需的数据量显著减少。


    Azure 认知服务的一个例子是计算机视觉。利用深度神经网络技术和大量训练数据，微软能够创建一个在分析图像方面表现出色的模型，但该模型不知道它在图像中看到了什么。然后，通过引入和标记用于训练的样本图像，该模型可以非常快速地定制，从而有效地识别或分类其在图像中看到的内容。我们将在第
    9 章详细讨论 Azure 认知服务。


    AIaaS 是生成式 AI 的基础和前身。拥有像生成式 AI 这样的大型语言模型，然后扩展其能力以摄取和理解输入内容，这与 AIaaS 的方法相同。因此，Azure
    OpenAI 自然成为 Azure 认知服务产品组合的一部分。


    你可能也经常听到 AIaaS 被称为应用型 AI。两者可互换使用，它们描述的是无需数据科学家广泛参与即可消费 AI 模型的方式。我们将在第 3 章详细讨论
    Azure OpenAI。事实上，由于生成式 AI 是当今的热门话题，本版将重点介绍这一技术。

