- fmt: '# Prompt Engineering


    `Prompt engineering` is the act of using Natural Language to provide instructions
    to an LLM on how to consume content and, or, create responses.


    Here is an example of what a prompt looks like:


    > *You are an assistant providing information on Microsoft products, specifically
    around AI, CoPilot, and OpenAI. Sources are FAQ in nature.*

    > *Always mention any legal or compliance issues. Always provide citations. Be
    brief in your answers. Answer ONLY with the facts listed in the list of sources
    below. If there isn’t enough information below, say you don’t know. Do not generate
    answers that don’t use the sources below. If asking a clarifying question to the
    user would help, ask the question.*

    > *For tabular information return it as an html table. Do not return markdown
    format.*

    > *Each source has a name followed by colon and the actual information, always
    include the source name for each fact you use in the response. Use square brackets
    to reference the source, e.g. [info1.txt]. Don’t combine sources, list each source
    separately, e.g. [info1.txt][info2.pdf].*


    As you can see, the syntax reads like a normal set of instructions in English.
    The sources that are mentioned in the prompt refer to documents (e.g., PDFs) that
    contain the information to help answer questions. The key takeaway here is that,
    through `prompt engineering`, the source content is abstracted from the LLM. It
    would need to look at the source documents every time it answers a question, even
    if it is the same question being asked back-to-back. This shows that the source
    documents are never incorporated into the LLM.


    Even though prompting is based on natural language, it still means that being
    able to concisely provide the prompt is a necessity. OpenAI has published a guide
    on `prompt engineering`^([^(41)](#fn41)) that you should read. The key point in
    the guide is that instructions in prompts need to be clear and simple. To assist
    with making good prompts, there are several techniques we can employ. Here are
    the more popular ones:


    *   Chain-of-thought prompting

    *   Few-shot prompting

    *   Zero-shot prompting

    *   Self-consistency

    *   Generated knowledge prompting


    We will explore and experiment with the different techniques of `prompt engineering`
    in Chapter [3](#501717_2_En_3_Chapter.xhtml).


    # Fine-Tuning


    LLMs are pre-trained language models. `Fine-tuning` LLMs is the process of optimizing
    this pre-trained language model for specific domains. `Fine-tuning` involves adjusting
    the model’s parameter so it can better understand and generate a response that
    is relevant to the subject domain without the need to specify it in the prompt.


    For example, you are tasked with creating a chat solution for a cycling club.
    The solution should be able to help members who are new to cycling ask questions,
    including cycling slang.


    One of the slangs in cycling is the term “lead out.” However, when this was asked
    of the LLM, it provided an answer that has nothing to do with cycling at all (but
    probably correct nonetheless), as shown in Figure [2-20](#501717_2_En_2_Chapter.xhtml#Fig20)
    below.


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig20_HTML.jpg)


    **Figure 2-20** — LLM that has not been fine-tuned to the subject domain


    If we fine tune the LLM so that we are narrowing the subject domain and incorporating
    parameters that are only specific to cycling, then the same prompt will produce
    the desired response, as shown in Figure [2-21](#501717_2_En_2_Chapter.xhtml#Fig21).


    ![](images/501717_2_En_2_Chapter/501717_2_En_2_Fig21_HTML.jpg)


    **Figure 2-21** — Fine-tuned LLM responding within the context of the subject
    domain


    Notice that we did not change the prompt to specify that the response should be
    specific to the cycling domain. Although we can accomplish almost everything via
    `prompt engineering`, using `fine-tuning` would make the model perform faster
    and the prompts would also be shorter. However, the disadvantage is that the LLM
    is now a custom model, and you will be responsible for managing the future iterations
    of the model. When new pre-trained models or versions are released, `fine-tuning`
    would need to be redone. We will cover `fine-tuning` in greater detail in Chapter
    [6](#501717_2_En_6_Chapter.xhtml).


    # Grounding


    `Grounding`^([^(42)](#fn42)) an LLM is the process of using the LLM with information
    that is very use-case specific and generally not part of the LLM’s knowledge.
    When an LLM is grounded, it will provide answers that are relevant and accurate.
    Almost all generative AI projects would involve grounding the LLM.


    `Grounding` is accomplished through `prompt engineering`, `fine-tuning`, and by
    restricting it to source content provided by architectures like Retrieval Augmented
    Generation (RAG). We will be covering RAG in greater detail in later chapters.


    ## Summary


    This chapter covered a lot of terms and concepts that are specific to LLMs. If
    you are new to this topic, it was a lot to digest. In the following chapters,
    we will be putting these terms and concepts into use, and that should give you
    a working understanding of LLMs.


