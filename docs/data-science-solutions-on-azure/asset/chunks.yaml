    Although Postman is a useful tool for exploring the Azure OpenAI models through
    a REST API endpoint, Azure itself provides a native user interface called the
    AI Studio that can help with your project. We will explore the AI Studio in the
    next section.


    The AI Studio is an excellent tool for experimentation and prototyping. It also
    provides a way to publish your prototype as an application, so you do not need
    to start a project from scratch.


    At the time of writing, there are two UI environments – AI Studio and Azure OpenAI
    Studio. There is a lot of overlap between AI Studio and Azure OpenAI Studio, with
    the latter being around longer and was the only UI available before AI Studio
    was introduced in late 2023\. By covering AI Studio, you should be able to navigate
    and use Azure OpenAI Studio as well. Therefore, we will not be covering Azure
    OpenAI Studio in this book.


    ## Azure AI Studio and LLM Parameters


    Azure AI Studio was released^([^(57)](#fn57)) in November 2023, and it can be
    accessed via the Azure Portal or by going to [`https://ai.azure.com`](https://ai.azure.com).
    In the following hands-on exercise, we will explore AI Studio and introduce new
    LLM terms. ***Azure AI Studio is in Preview at the time of writing, so UI changes
    happen on a weekly basis. Please check out this book GitHub repo for updates to
    hands-on exercises.***


    Remember that Azure AI Studio is *not* the same as Azure OpenAI Studio and the
    similar names does cause confusion. Azure AI Studio is a web-based tool for all
    AI work. It provides access and management of datasets, models, and tools (e.g.,
    Prompt Flow, which will be covered later). The models made available through Azure
    AI Studio include OpenAI (GPT) and non-OpenAI models like Mistral, Lama, and Phi-3.^([^(58)](#fn58))
    Azure OpenAI Studio is a web-based tool for managing and testing OpenAI-only models
    that are available on Azure.


    Azure AI Studio is deployed as an instance in specific regions, as we will see
    in Exercise 3-4\. The capabilities available to an Azure AI Studio instance are
    also dependent on the region. For example, at the time of writing, the capability
    to fine-tune a Phi-3 small^([^(59)](#fn59)) language model is only available to
    Azure AI Studios deployed in the US East 2 region. You can deploy multiple Azure
    AI Studios in a region.


    View the Azure AI Studio as a hub^([^(60)](#fn60)) for your generative AI projects.
    Multiple AI projects can be managed within the AI Studio instance.


