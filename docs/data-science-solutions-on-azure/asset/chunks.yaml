- fmt: "### Hands-On Exercise: Exploring Tokenization\n\nFor this hands-on exercise,\
    \ and all the other exercises in this book, you will need to have a working understanding\
    \ of `Git`, `Python`, and `Linux`. We will assume you have this level of skill\
    \ and will not go into extensive details on configuration and tooling.\n\nRecommended\
    \ prerequisites:\n\n- `Visual Studio Code` (recommended) or your preferred IDE\
    \ installed\n- `Git` or `GitHub Desktop` installed\n- `Windows Subsystem for Linux\
    \ (WSL)` installed (if you are developing under the Windows OS)\n- Install `Python\
    \ 3.8` or above\n\nStart of the hands-on exercise:\n\n![Figure 2-7](images/501717_2_En_2_Chapter/501717_2_En_2_Fig7_HTML.jpg)\n\
    \n**Figure 2-7** Install the Jupyter support extension in Visual Studio Code\n\
    \n1.  Clone this book’s GitHub repo located at [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition).\n\
    2.  Launch `Visual Studio Code`.\n3.  Install the `Jupyter Notebook` support extension\
    \ from the `Extensions` marketplace, as shown in Figure 2-7 below.\n\n![Figure\
    \ 2-8](images/501717_2_En_2_Chapter/501717_2_En_2_Fig8_HTML.jpg)\n\n**Figure 2-8**\
    \ Open Jupyter Notebook `tokenizer.ipynb` in the folder named `Chapter-2`\n\n\
    1.  Select File ➤ Open Folder in Visual Studio Code and navigate to the local\
    \ root directory of the repo you cloned in step 1.\n2.  Navigate to the folder\
    \ named `Chapter-2` and open `tokenizer.ipynb`, as shown in Figure 2-8 below.\n\
    3.  Read the comments in each code block and then run them in sequence. Change\
    \ the value of the variable `text` in code block 3 to see how the tokenizer performs.\n\
    \nIn summary, using the `cl100k_base` encoding and the `gpt-3.5-turbo` model,\
    \ the tokenizing of our example yields the results below.\n\n| `Running` | `_is`\
    \ | `_an` | `_Olympic` | `_sporting` | `_event` | `36 characters` |\n|-----------|-------|-------|------------|-------------|----------|-----------------|\n\
    | `19527`   | `374` | `459` | `25944`    | `36027`     | `1567`   | `6 tokens`\
    \      |\n\nAs mentioned earlier, notice that spaces are grouped *at the beginning*\
    \ rather than at the end of the selected text. The GPT model is more extensive,\
    \ which equates to a larger vocabulary, and therefore the ability to use fewer\
    \ tokens than our hypothetical model (six tokens versus ten).\n\nGoing further\
    \ into detail with `Tiktoken` and encoding is beyond the scope of this book, but\
    \ the hands-on exercise should have given you a better understanding of tokenization.\
    \ It is worth spending some time going through the notebook on how to count tokens\
    \ with `Tiktoken` located at the GitHub repository listed in the footnote.\n\n\
    ### Prompt Versus Completion Tokens\n\nTokens are classified into two categories:\n\
    \n- **Prompt tokens**\n- **Completion tokens**\n\nPrompt tokens are the tokens\
    \ created based on the user input. For example, if you ask the question `“Tell\
    \ me more about this book,”` the six tokens that are generated are called prompt\
    \ tokens.\n\nIf the LLM generates the response to this question as `“This book\
    \ teaches us how to use Microsoft Azure for Data Science projects with a heavy\
    \ emphasis on generative AI and Large Language Models,”` this equates to 26 tokens,\
    \ and these tokens are called completion tokens.\n\nIn summary, prompt tokens\
    \ are tokens associated to questions (prompts), and completion tokens are tokens\
    \ associated to the LLM’s generated response. Furthermore, in most interactions\
    \ with LLMs, the number of prompt tokens consumed are usually higher than the\
    \ completions tokens. The reason is because setting up the prompts require not\
    \ only the question, but also the context of the question and all the relevant\
    \ sources (e.g., knowledge base articles).\n\nIn a conversational setting, in\
    \ order to provide the LLM with the context of all the previous conversation turns,\
    \ each subsequent prompt would need to include the questions previously asked.\
    \ Therefore, each subsequent prompt would consume more tokens than the previous\
    \ as the conversation goes on.\n\nFor estimation purposes, Table 2-2 below lists\
    \ common use cases and the observed average number of tokens for each use case.\n\
    \n**Table 2-2** Use cases and their corresponding token utilization breakdown\n\
    \n| Use case                                              | Prompt tokens | Completions\
    \ tokens | Total tokens |\n|-------------------------------------------------------|---------------|--------------------|--------------|\n\
    | Generic chat q&a                                      | 600           | 50 \
    \                | 650          |\n| Chat with your own data: Retrieval Augmented\
    \ Generation (RAG) architecture | 2850          | 100                | 2950  \
    \       |\n| News article (Summarization)                          | 6500    \
    \      | 250                | 6750         |\n| Email (Summarization)        \
    \                         | 800           | 50                 | 850         \
    \ |\n| Chat (Summarization)                                  | 900           |\
    \ 200                | 1100         |\n| Meeting (Summarization)             \
    \                  | 1200          | 100                | 1300         |\n| Code\
    \ completion/generation                            | 1150          | 50      \
    \           | 1200         |\n| Code explanation (Summarization)             \
    \         | 950           | 250                | 1200         |\n\n## Relevance\
    \ of Tokens\n\nNow that we know what tokens are, we can apply them to the two\
    \ important aspects of their use:\n\n- **Cost**\n- **Performance**\n\n### Cost\n\
    \nSince tokens are the unit measure for LLMs, it is naturally the metric used\
    \ to calculate cost when consuming the LLM. The cost to have an LLM process data\
    \ is based on the number of tokens the process requires. Generative AI services\
    \ from Microsoft, OpenAI, Google, and AWS are all based on price/tokens. Since\
    \ this is a book focused on Microsoft Azure as the platform, we will use the Microsoft\
    \ Azure OpenAI as a basis to understand the cost models available when using Microsoft\
    \ as the platform.\n\nAzure OpenAI has two cost models:\n\n- **Consumption or\
    \ Pay-as-you-go (`PayGo`) model**\n- **Provisioned Throughput Units (`PTUs`)**\n\
    \n#### Pay-As-You-Go (`PayGo`)\n\nAs the name implies, the `PayGo` model is straightforward\
    \ – you are charged a price for blocks of 1000 tokens being consumed. As with\
    \ all Azure services, the [pricing calculator](https://azure.microsoft.com/pricing/calculator)\
    \ is the tool to use to estimate the cost of using the Azure OpenAI service.\n\
    \n##### Hands-On Exercise: Exploring Cost\n\n1.  As shown in Figure 2-9 below,\
    \ access the calculator at [`https://azure.microsoft.com/pricing/calculator`](https://azure.microsoft.com/pricing/calculator),\
    \ select **AI + machine learning** in the left menu, and then select the **Azure\
    \ OpenAI Service**. You will see a popup appear in the right corner of the screen\
    \ that says **Azure OpenAI Service added**. Click on the **View** link.\n\n![Figure\
    \ 2-9](images/501717_2_En_2_Chapter/501717_2_En_2_Fig9_HTML.jpg)\n\n**Figure 2-9**\
    \ Azure online calculator and selecting the Azure OpenAI Service\n\n![Figure 2-10](images/501717_2_En_2_Chapter/501717_2_En_2_Fig10_HTML.jpg)\n\
    \n**Figure 2-10** Estimating cost based on number AND types of tokens in the Azure\
    \ calculator for GPT-4 32k\n\n1.  Remember from earlier in this chapter where\
    \ we differentiated tokens into prompt tokens versus completions token? Here is\
    \ where it matters because there is different pricing for the types of tokens\
    \ in the `PayGo` model. Refer to Table 2-2 above and select a use case. Then provide\
    \ the number of prompt and completion tokens for that use case in the calculator.\
    \ For example, we will select the “chat with your own data” use case. So, we will\
    \ type in `2.85` for the prompt tokens (2.85 × 1000 = 2850) and `0.1` for the\
    \ completion tokens (0.1 × 1000 – 100). See Figure 2-10 below.\n\n2.  Note the\
    \ following aspects from the calculator:\n    1.  We selected the **East US**\
    \ region, but Azure OpenAI is not available in every region. So, if you select\
    \ a different region, the service may not be available.\n    2.  Even if Azure\
    \ OpenAI is available in a region, not all the models are available in that region.\n\
    \    3.  Depending on the model selected, the price per `Prompt` and `Completion`\
    \ token is different.\n    4.  For a list of Azure OpenAI and model availability\
    \ by region, please refer to [`https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models#public-cloud-regions`](https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/models#public-cloud-regions)."
