    ## Leveraging Azure OpenAI''s NLP and LLM Capabilities


    Every Azure AI service responds in a JSON format, as seen in Exercise 9-3 above.
    Therefore, a key requirement to consuming an AI service is the ability to parse
    and interpret JSON. This is not a difficult task, but it does still require a
    working knowledge of JSON. If the JSON is highly nested and long, it can become
    a time consuming and potentially labor-intensive task.


    ### Hands-On Exercise 9-5: Azure OpenAI Codex


