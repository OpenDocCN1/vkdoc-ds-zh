- fmt: "### 2. Additional Pricing:\n   None.\n\n### 3. Advantages:\n   Fast and flexible\
    \ query parsing and matching over searchable fields using terms or phrases in\
    \ any supported language.\n\n### 4. Limitation:\n   Keyword search relies solely\
    \ on matching exact words and phrases, which can lead to limited or inaccurate\
    \ results.\n\n*   **Semantic search**\n    1.  **Retrieval Type:** Semantic search.\n\
    \    2.  **Additional Pricing:** Yes, for semantic search usage.\n    3.  **Advantages:**\
    \ Improves search precision and relevance using AI models to understand the semantic\
    \ meaning of queries and documents.\n    4.  **Limitation:** Semantic search can\
    \ struggle with understanding ambiguous and complex queries, resulting in less\
    \ precise results.\n\n*   **Vector search**\n    1.  **Retrieval Type:** Vector\
    \ search.\n    2.  **Additional Pricing:** Yes, for calling the embedding model\
    \ on Azure OpenAI.\n    3.  **Advantages:** Finds documents similar to a given\
    \ query based on vector embeddings.\n    4.  **Limitation:** This search relies\
    \ on embedding techniques that represent data as numerical vectors. While this\
    \ approach captures similarities between vectors, it may struggle with capturing\
    \ more nuanced or abstract relationships. Additionally, the effectiveness of vector\
    \ search heavily depends on the quality and relevance of the vector representations.\n\
    \n*   **Hybrid (vector + keyword) search**\n    1.  **Retrieval Type:** Hybrid\
    \ of vector search and keyword search.\n    2.  **Additional Pricing:** Yes, for\
    \ calling the embedding model on Azure OpenAI.\n    3.  **Advantages:** Combines\
    \ vector similarity search with flexible query parsing and full-text search over\
    \ alphanumeric fields.\n    4.  **Limitation:** This type of search still faces\
    \ the limitation of keyword search, such as potential mismatches due to variations\
    \ in phrasing or synonyms, and is also dependent on optimal integration and weighing\
    \ of keyword- and vector-based components.\n\n*   **Hybrid (vector + keyword)\
    \ + semantic search**\n    1.  **Retrieval Type:** Hybrid of vector, semantic,\
    \ and keyword search.\n    2.  **Additional Pricing:** Yes, for calling the embedding\
    \ model on Azure OpenAI and semantic search usage.\n    3.  **Advantages:** Uses\
    \ vector embeddings, language understanding, and flexible query parsing for rich\
    \ search experiences and complex information retrieval, ideal for generative AI\
    \ applications.\n    4.  **Limitation:** This combination is very complex and\
    \ challenging to implement and requires careful consideration of how to balance\
    \ and combine the different techniques effectively.\n\nNow that search index is\
    \ created, we will be able to configure additional settings that contribute to\
    \ quality of response to a query. Below are the two tweakable runtime parameters:\n\
    \n**Retrieved Documents:** Controls the number of document chunks (3, 5, 10, or\
    \ 20) provided to the model, with a default of 5. Increasing this parameter may\
    \ help capture more relevant information but could also distract the model. Adjust\
    \ based on missing context in responses. This is the `topNDocuments` parameter\
    \ in the API.\n\n**Strictness:** Determines how aggressively irrelevant documents\
    \ are filtered based on similarity scores (1 to 5), with a default of 3. Lower\
    \ values include more documents, while higher values exclude more irrelevant ones.\
    \ Adjust to balance relevance and distraction. This is the `strictness` parameter\
    \ in the API.\n\nThe above settings are shown in Figure [5-11](#501717_2_En_5_Chapter.xhtml#Fig11).\n\
    \n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig11_HTML.jpg)\n\n**Figure 5-11**\
    \ Azure OpenAI on your data parameters setup\n\n![](images/501717_2_En_5_Chapter/501717_2_En_5_Fig12_HTML.jpg)\n\
    \n**Figure 5-12** Azure OpenAI on your data empty system message response\n\n\
    ### 1. System Message and Prompt Engineering:\n\nThe system message guides how\
    \ the GPT assistant responds to user questions. Without the system message, the\
    \ assistant doesn’t have any response guidelines, and it will respond without\
    \ any personality to it. The system message is shown in Figure [5-12](#501717_2_En_5_Chapter.xhtml#Fig12).\n\
    \nYou can define a system message to guide the model’s responses with Azure OpenAI\
    \ on your data, allowing for customized replies within the RAG framework. This\
    \ message works with an internal base prompt to shape the user experience and\
    \ is truncated after a certain number of tokens to ensure effective answers. For\
    \ additional behavior customization, ensure your system prompt is detailed and\
    \ clear about the expected modifications.\n\n**System message best practices:**\n\
    \n1.  **Define a Role:** Specify the assistant’s role, e.g., “You are a medical\
    \ advice assistant specializing in pediatric care.”\n2.  **Define the Type of\
    \ Data:** Indicate the nature of the data, such as “clinical studies” or “legal\
    \ documents.” For example, “You provide answers using information from retrieved\
    \ clinical trial data.”\n3.  **Specify Data Characteristics:** Mention any unique\
    \ features of the data, like language or format. For instance, “You retrieve Spanish\
    \ documents and should respond in Spanish,” or “You are given data in spreadsheets\
    \ related to market analysis and should interpret the data accordingly.”\n4. \
    \ **Define Output Style:** Customize the response style, e.g., “You are an AI\
    \ assistant that communicates in a formal tone. Ensure all responses are professionally\
    \ worded.”\n5.  **Reaffirm Critical Behavior:** Emphasize important behaviors,\
    \ like “Please provide answers strictly based on retrieved documents, include\
    \ citations, and avoid using external knowledge.”\n6.  **Prompt Engineering Tricks:**\
    \ Use techniques like chain-of-thought prompting, e.g., “Let’s analyze the retrieved\
    \ documents step by step to construct a thorough response to the user’s query.”\n\
    \nWe will cover prompt engineering best practices in depth in next chapter, but\
    \ for the scope of this chapter – “Building RAG end to end” – we have prepared\
    \ an example system message below:\n\n**System message for SNAP:**\n\n```\nstart\
    \ system message\n\n“Your name is Priya. You act as an incredibly warm, caring,\
    \ empathetic, and knowledgeable virtual agent. Your main responsibility is to\
    \ address inquiries related to the State of Louisiana Department of Children and\
    \ Family Services (DCFS) and the U.S. Department of Agriculture (USDA) Supplemental\
    \ Nutrition Assistance Program (SNAP) food assistance programs. You have extensive\
    \ knowledge on various topics, including:\n\n1.  Louisiana’s Pandemic Electronic\
    \ Benefits Transfer (P-EBT) Program\n2.  Disaster SNAP (DSNAP)\n3.  SNAP Benefits,\
    \ Application, and Eligibility\n4.  211\n5.  SNAP Budget Sheets\n6.  Louisiana\
    \ Combined Application Project (LaCAP)\n7.  Redeterminations\n8.  DCFS CAFÉ and\
    \ Electronic Benefits Transfer (EBT):\n\nWhen shaping your communication style\
    \ and tone:\n\n*   Always seek clarification if you are uncertain about a response\
    \ to ensure you provide precise and useful information\n*   Respond with elevated\
    \ understanding, compassion, and empathy. Especially when users are distressed\
    \ or in crisis, your replies should be supportive and thoughtful.\n*   Avoid generating\
    \ harmful content: You must not create or share content that may be harmful to\
    \ someone physically or emotionally, even if a user requests it or provides a\
    \ condition to rationalize it.\n*   Your goal is to be a helpful, supportive,\
    \ and reliable source of information for users seeking assistance with DCFS and\
    \ SNAP-related inquiries.”\n\nend system message\n```\n\nThe above system message\
    \ is a sample and can be further customized to meet the user desired functionalities.\n\
    \nOnce we prepared the system message, we will include in the AI playground system\
    \ message section and start asking questions in the chat section to ensure our\
    \ integration with AI search and system message is working successfully. If we\
    \ are accessing it via the API, this goes in `role_information` parameter.\n\n\
    > **Note**"
