    **图 7-16** 预期样式与实际部署之间的实际映射


    1. 将内容与图 7-12 中的结构进行比较，您会看到两者之间的映射关系，如图 7-16 所示。虽然我们对名称做了一些细微更改（例如，使用 `MarketingMail`
    代替 `MarketingList`），但结构是相同的：有一个包含所有插件的顶级目录（`prompt_template_samples` 文件夹），每个插件有一个子目录（在我们仓库中，只有一个插件，即
    `EmailPlugin`），以及一个用于存放函数定义和配置的子目录（`MarketingMail`）。


    ![](img/501717_2_En_7_Fig17_HTML.jpg)


    **图 7-17** 包含两个参数的 `MarketingMail` 函数的 `skprompt.txt` 文件


    1. 启动 VS Code 并打开 `exercise-7-2` 文件夹。

    2. 打开 `exercise-7-2.jpynb`、`config.json` 和 `skprompt.txt` 文件。

    3. 让我们首先研究一下 `skprompt.txt`，如下方图 7-17 所示。请注意，它是一个简单的文本文件，包含的提示词与我们在练习 7-1 中使用的类似。唯一的区别在于，我们现在定义了两个参数：收件人的名称
    `{{$recipient}}` 和正在促销的商品类型 `{{$input}}`。这将使我们能够重用此插件来为不同类型的商品生成促销信函。


