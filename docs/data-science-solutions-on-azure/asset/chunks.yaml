    \ 在 Visual Studio Code 中安装 Jupyter 支持扩展\n\n1.  克隆本书的 GitHub 仓库，地址为 [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition)。\n\
