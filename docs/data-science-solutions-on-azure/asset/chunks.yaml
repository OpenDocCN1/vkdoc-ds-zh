  trans: "\n# 排版后的内容\n\n本质上，复杂或模糊的查询有时会导致误解或不完整的结果。克服这些障碍需要不断优化算法以确保最佳性能。总体而言，语义搜索通过将语言理解与现实世界知识相结合，为用户提供了更直观、更个性化的搜索体验。这种融合，借助向量搜索中机器学习的进步，使得搜索引擎甚至在我们表达需求之前就能预测我们的意图，为构建更高效、更具主动性的搜索引擎铺平了道路。\n\
    \n## 探索向量搜索\n\n探索向量搜索领域，会发现一幅以机器学习原理为主导的迷人图景。其核心在于，向量搜索利用先进的算法将原始数据转换为称为向量的有意义的表示形式。这些向量充当多维坐标，捕捉信息的本质，并促进对数据集中上下文和关系的更深入理解。机器学习在其中扮演着至关重要的角色，为信息的智能检索提供动力。通过在大规模数据集上训练模型，机器学会了将复杂概念编码成紧凑的向量格式。这些向量捕捉了语义含义和关系，使算法能够高效且精确地穿梭于海量信息之中。下图\
    \ 4-10 是词嵌入的一个示例。\n\n![](img/501717_2_En_4_Fig10_HTML.jpg)\n\n图 4-10\n\n词嵌入\n\n\
    向量搜索代表了相对于传统搜索引擎的一次重大进步，后者主要依赖于文本中的关键词匹配。传统的搜索引擎会通过各种步骤对文本进行预处理，例如规范化术语、扩展查询以及使用同义词列表，以更好地将搜索意图与内容匹配起来。这些技术的发展是为了解决语义相似性问题，即不同的词语或短语可能表达相似的概念。例如，在传统搜索引擎中，如果用户搜索“炸鱼”一词，系统可能难以将其与“海洋”或“钓鱼竿”等相关术语直接关联起来，除非通过同义词或者先进的自然语言处理技术进行明确编程。\n\
    \n另一方面，向量搜索利用机器学习的概念，特别是嵌入技术，将文本转换为向量（高维空间中的数值表示）。每个向量捕捉的是文本的语义含义，而不仅仅是特定词汇的出现。这种方法允许搜索引擎在更深的层面上理解和关联概念。因此，当向量搜索引擎处理一个查询时，它会将查询文本转换为一个向量，并将其与数据库中其他文本的向量进行比较。这种比较通常基于向量之间的余弦相似度。所以，即使词语不同但背后的想法相似——比如“炸鱼”和“钓鱼竿”——向量搜索也能有效地匹配这些文本。这带来了一种更直观、更具上下文感知能力的搜索体验，能更好地与用户意图保持一致。\n\
    \n向量搜索显著提升了几个关键能力。让我们来了解这些能力是什么：\n\n![](img/501717_2_En_4_Fig11_HTML.jpg)\n\n\
    图 4-11\n\n向量空间中的词表示\n\n1.  **相似性搜索**：\n\n    传统搜索引擎常常难以找到上下文相关的文档，因为它们主要依赖关键词匹配。例如，如果你搜索关于“气候变化影响”的文章，传统搜索可能会返回那些恰好包含这些确切词语的文档。然而，通过向量搜索，系统能够理解语义含义，并能检索到讨论相关主题（如“全球变暖影响”或“海平面上升”）的文档，即使没有使用确切的搜索词。这种方法通过分析上下文而不仅仅是词汇本身，提供了更准确、更相关的结果。\n\
    \n2.  **问答系统**：\n\n    设想一个场景，有人问：“什么导致心脏病发作？”如果没有受过医学训练，他们可能不会使用“心肌梗死”这样的专业术语。在基于向量的系统中，“心脏病发作”和“心肌梗死”这两个短语将由相似的向量表示，因为它们存在上下文关联。因此，系统可以使用更易理解的语言准确回答问题，从而弥合专家术语和日常用语之间的差距。这种方法比传统的关键词搜索更有效，因为后者可能会遗漏表述不同但概念相关的信息之间的联系。\n\
    \n3.  **多语言搜索**：\n\n    传统方法通常需要为每种语言建立独立的文本分析系统，这既成本高昂又耗费人力。借助多语言的基于向量的模型，用一种语言进行的查询无需直接翻译就能检索到用另一种语言撰写的相关文档。例如，用西班牙语搜索“energía\
    \ renovable”（可再生能源），可以成功检索到关于太阳能电池板或风力涡轮机的英文相关文档，这得益于跨语言共享的语义内容的底层表示。\n\n4.  **多模态**：\n\
    \    1.  在多模态搜索场景中，可以同时查询不同类型的数据，例如文本和图像。例如，使用基于向量的方法，像“给我看热带海滩的图片”这样的查询可以同时分析文本和图像的视觉内容以找到匹配项。这是通过将图像的特征转换为向量，然后直接与文本向量进行比较来实现的，从而允许跨媒体类型进行更集成、更高效的搜索，这是传统搜索技术之前无法实现的。图\
    \ 4-11 是向量空间中的词表示。\n\n以下是向量搜索数据库通常的运行方式：\n\n1.  **向量嵌入生成：** 最初，数据项通过嵌入技术被转换为向量表示。例如，图像可能通过卷积神经网络（CNN）等技术转换为向量，而文本文档则可以通过词嵌入或句子嵌入来表示。这些嵌入本质上以可以计算处理的数字形式捕捉了数据的基本特征。\n\
    \n    **示例：** 考虑一个电影描述数据库。使用句子嵌入方法将每部电影描述转换为一个向量。该向量捕捉的是描述的主题和叙事细微差别，而不仅仅是孤立的词汇。\n\
    \n2.  **索引与查询：**\n    *   **索引：** 生成向量后，使用专为高效检索设计的技术（如 k-d 树、球树或近似最近邻（ANN）算法）将这些向量组织成一个可搜索的索引。这些结构有助于通过基于向量属性缩小潜在匹配的候选列表来优化搜索。\n\
    \n    *   **查询：** 当用户执行搜索时，查询（例如，关于电影情节的一段文字）也会使用相同的嵌入技术转换为向量。然后，搜索引擎会遍历索引化的向量，以找到与查询向量最相似的向量。\n\
    \n    **示例：** 用户查询“一个年轻的巫师对抗黑暗力量”，该查询同样被转换为一个向量。然后，搜索数据库使用距离度量（如余弦相似度）将该向量与索引化的电影描述向量进行比较，从而识别出哪些电影的描述与查询最相似。\n\
    \n3.  **检索与排序：** 其描述向量与查询向量最接近的电影被认为最相关。这些向量根据其相似度得分进行排序，并将排名靠前的结果返回给用户。\n"
- fmt: '**Example:** The search might return movies like “Harry Potter” at the top
    of the list because the vector representing its description is closest in the
    vector space to the query vector about a young wizard.


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig12_HTML.jpg)


    Figure 4-12


    Information retrieval system with vector search


    In the above flow diagram (Figure [4-12](#501717_2_En_4_Chapter.xhtml#Fig12)),
    we can see how a user query retrieves information from vector database. Vector-based
    information retrieval systems are becoming increasingly popular in the field of
    natural language processing. These systems use vectors, or numerical representations
    generated from documents, to find the most relevant documents in response to a
    user’s query. There are several methods to create these vectors, including `Word2vec`,
    `Glove2vec`, and `Sentence BERT`. To further enhance the performance of these
    systems, techniques like `PCA` (principal component analysis) and factor analysis
    are used. These methods transform the word embeddings to refine the model’s performance.


    Typically, the process in an information retrieval system starts when a user inputs
    a query. This query is preprocessed to convert it into a format that the system
    can understand. The system then uses the query to find and return the most relevant
    information. The use of post-processing methods like `PCA` and factor analysis
    has shown to improve results slightly, increasing the mean average precision by
    about 2–3%. This means that the system is more accurate in retrieving relevant
    documents based on the user’s query.


    Certainly, there are limitations in leveraging vector search only approach. Vector
    embeddings are effective in determining the similarity between documents, making
    vector search a superior option for many query types compared to traditional keyword
    search. Despite their advantages, vector search is not universally used for all
    queries because, in some cases, keyword search still delivers more relevant results.
    Most modern search techniques tend to leverage hybrid search, i.e., combining
    semantic search and vector search retrieval techniques.


    When exploring search technologies, it’s important to recognize the differences
    between semantic search and vector search, as they each have unique methods for
    interpreting meaning within data. Semantic search aims to understand user queries
    by analyzing the intent and contextual meaning behind each search. This approach
    seeks to provide results that are highly relevant and specifically tailored to
    user requirements by grasping the deeper significance of the search terms. On
    the other hand, vector search works by transforming text into vectors that capture
    semantic meanings, allowing it to accurately sift through large datasets. This
    method focuses on finding items that are contextually similar, rather than relying
    solely on keyword matches.


    Hybrid search is a method that merges various search algorithms to enhance the
    precision and relevance of search outcomes. It integrates the key attributes of
    both keyword-based search methods and vector search approaches, utilizing a mix
    of both dense and sparse vectors in its framework. Sparse vectors, which have
    many zero values, are typically employed in keyword searches and are generated
    using traditional search engine algorithms like `BM25`. Conversely, dense vectors,
    which contain more non-zero values, are used in AI-driven search algorithms. By
    combining the strengths of these diverse algorithms, hybrid search offers a more
    robust and effective search experience for users.


    Figure [4-13](#501717_2_En_4_Chapter.xhtml#Fig13) is the comparison of all the
    three types of searches.


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig13_HTML.jpg)


    Figure 4-13


    Comparison between keyword, semantic, and vector searches


    ## Summary


    In this chapter, we learned several key approaches of designing `GenAI` solutions.
    We studied how modern information retrieval systems are vital in organizing and
    accessing the vast data generated daily. They facilitate efficient searches across
    text, graphics, audio, and video, using components like document collections,
    indexing, query processors, ranking algorithms, and user interfaces to deliver
    precise and relevant information.


    We also delved into the specifics of the Retrieval-Augmented Generation (`RAG`)
    process, which enhances chatbot interactions by combining data retrieval with
    generative response capabilities, and discussed the components and significance
    of modern information retrieval systems which organize and process vast data arrays
    to facilitate efficient and relevant information access.


    We learned the advancements in search technologies, particularly emphasizing semantic
    and vector search. Semantic search uses AI to interpret the context and intent
    behind queries, improving the relevance of search results, while vector search
    translates queries into numerical vectors to find contextually similar items,
    enhancing the search experience beyond simple keyword matching. Finally, we touched
    upon hybrid search systems, which integrate the strengths of both semantic and
    vector search technologies to optimize search accuracy and relevance.


    Through these discussions, the chapter provided a comprehensive overview of the
    current capabilities and future potential of `GenAI` solutions in transforming
    how we interact with and leverage technology in various fields.


    We will dive deeper into building information retrieval system leveraging `RAG`
    and Azure tools in Chapter [5](#501717_2_En_5_Chapter.xhtml).


    # 5. Implementing a Generative AI Solution


    ## Introduction


    In this chapter, we will explore the implementation of `GenAI` solutions primarily
    by utilizing the techniques covered in Chapter [4](#501717_2_En_4_Chapter.xhtml)
    and leveraging the various tools and services offered by Azure. Implementing `GenAI`
    solutions on Azure offers numerous benefits for businesses. Azure, Microsoft’s
    cloud computing platform, provides a secure and scalable environment for deploying
    and managing `GenAI` solutions. By leveraging Azure’s infrastructure and services,
    businesses can easily harness the power of artificial intelligence to drive innovation
    and gain a competitive edge. With Azure’s extensive range of AI tools and services,
    such as Azure Machine Learning and Cognitive Services, organizations can build
    and deploy `GenAI` models quickly and efficiently. Moreover, Azure’s integration
    with other Microsoft products like Power BI and Dynamics 365 allows businesses
    to derive actionable insights from AI-generated data, thereby enhancing decision-making
    processes. Additionally, Azure’s global presence ensures low latency and high
    availability, enabling organizations to deliver AI solutions to customers worldwide.


    The Azure OpenAI platform offers developers the ability to enhance their applications
    with artificial intelligence capabilities using Python and C# SDKs, as well as
    REST APIs. Within this platform, there is a wide range of AI models available
    such as GPT-35 and GPT-4, each designed for specific tasks, and these models can
    be easily deployed through the Azure OpenAI Service. In previous chapters, we
    gained knowledge on deploying the Azure OpenAI service in Azure. Now, we will
    delve into constructing an application called "Chat with your data" using Azure
    OpenAI Studio. Additionally, we will explore evaluating the application using
    the Prompt Flow methodology.'
