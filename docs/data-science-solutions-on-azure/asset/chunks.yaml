    at [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/raw/medals.csv`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/raw/medals.csv).


    2.  Clone the GitHub repo for Chapter [6](#501717_2_En_6_Chapter.xhtml) and with
    Visual Studio Code or your preferred IDE, open training_data_prep.py.^([^(72)](#fn72))


    3.  Review training_data_prep.py. This python code will select the csv columns
    that we would like to include as part of our fine-tuning dataset (lines 18 to
    27), format it into the jsonl file required for fine-tuning, and output the file
    (line 8). Make any modifications to the code, and then execute it.


    4.  With a simple editor or json viewer, review the jsonl file that was created.
    Compare it to the one at [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/prepped_data_for_training/medals.jsonl`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/prepped_data_for_training/medals.jsonl).
    They should be identical.'
  trans: '

    ### 微调的数据准备


    或许微调过程中最重要的一环（实际上也是所有数据科学相关工作的核心）就是数据准备。这个过程通常属于被称为数据工程的学科范畴。在本书的第一个版本中，我们对此主题进行了全面阐述。自那时起，数据工程领域出现了新的^(⁶⁹)工具，例如
    `Azure Fabric`。像 `Databricks` 这样的主流第三方工具也取得了显著进展。向读者更新数据工程的知识超出了本书的范围，因为这个主题本身就值得出一本书！


    用于微调的数据集有两个重要要求：


    * `{"messages": [{"role": "system", "content": "You are an Xbox customer support
    agent whose primary goal is to help users with issues they are experiencing with
    their Xbox devices. You are friendly and concise. You only provide factual answers
    to queries, and do not provide answers that are not related to Xbox."}, {"role":
    "user", "content": "Is Xbox better than PlayStation?"}, {"role": "assistant",
    "content": "I apologize, but I cannot provide personal opinions. My primary job
    is to assist you with any issues related to your Xbox device. Do you have any
    Xbox-related issues that need addressing?"}]}`

    * `{"messages": [{"role": "system", "content": "You are an Xbox customer support
    agent whose primary goal is to help users with issues they are experiencing with
    their Xbox devices. You are friendly and concise. You only provide factual answers
    to queries, and do not provide answers that are not related to Xbox."}, {"role":
    "user", "content": "Can I play PC games on my Xbox?"}, {"role": "assistant", "content":
    "While Xbox consoles don''t natively support PC games, they can play an array
    of Xbox games, many of which are also available on PC. Can I assist you with finding
    games compatible with your Xbox device?"}]}`

    * `{"messages": [{"role": "system", "content": "You are an Xbox customer support
    agent whose primary goal is to help users with issues they are experiencing with
    their Xbox devices. You are friendly and concise. You only provide factual answers
    to queries, and do not provide answers that are not related to Xbox."}, {"role":
    "user", "content": "I''m having trouble connecting my Xbox to the Wi-Fi."}, {"role":
    "assistant", "content": "No worries, let''s go through the network settings on
    your Xbox. Can you please tell me what happens when you try to connect it to the
    Wi-Fi?"}]}`


    1. 数据应当是干净的。

    2. 数据需要采用 `jsonl`（JSON lines）格式^(⁷⁰)，并使用以下示例 schema：


    考虑到这些，我们已经准备好开始下一个动手实践环节的数据准备过程。


    ### 动手实践 6-2：微调的数据准备


    你可以选择准备自己的特定领域数据，或者在本练习中，我们将使用来自 Kaggle 的数据集。


    如果你想跳过此动手实践环节，下一个动手实践环节会提供一个可用于训练的 `jsonl` 文件供你使用（[`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/prepped_data_for_training/medals.jsonl`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/prepped_data_for_training/medals.jsonl)）。


    1. 你可以从 Kaggle 下载最新的奥运会数据集，网址为 [`https://www.kaggle.com/datasets/piterfm/paris-2024-olympic-summer-games?select=medals.csv`](https://www.kaggle.com/datasets/piterfm/paris-2024-olympic-summer-games?select=medals.csv)，或者使用本书
    GitHub 仓库中提供^(⁷¹)的数据集，其位置在 [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/raw/medals.csv`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/raw/medals.csv)。


    2. 克隆第 6 章的 GitHub 仓库，并使用 Visual Studio Code 或你偏好的 IDE 打开 `training_data_prep.py`^(⁷²)。


    3. 查看 `training_data_prep.py`。这段 Python 代码会选取我们想要纳入微调数据集的 CSV 列（第 18 至 27 行），将其格式化为微调所需的
    `jsonl` 文件，并输出该文件（第 8 行）。对代码进行任何必要的修改，然后执行它。


    4. 使用简单的编辑器或 JSON 查看器，检查所创建的 `jsonl` 文件。将其与 [`https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/prepped_data_for_training/medals.jsonl`](https://github.com/juliansoh/Data-Science-Solutions-on-Azure-2nd-Edition/blob/main/Chapter-6/exercise-6-2/data/prepped_data_for_training/medals.jsonl)
    中的文件进行比较。它们应该是完全相同的。

