    2.  转到 `Environments`，注意 `Transcript` 变量现在包含来自语音邮件的转录文本，如图 9-27 所示。


    我们将留一个作业给您，即创建一个对 Azure OpenAI 的第三个 `POST` 调用（提示：回顾第 3 章中的练习 3-3）。让 Azure OpenAI
    获取翻译后的语音邮件转录文本（`Translate` 变量中的值），并生成摘要、建议的后续步骤以及情感分析。


    ## 利用 Azure OpenAI 的 NLP 和 LLM 功能


    每个 Azure AI 服务的响应均为 JSON 格式，如上面的练习 9-3 所示。因此，使用 AI 服务的一个关键要求是能够解析和解释 JSON。这并非难事，但仍需具备
    JSON 的实用知识。如果 JSON 嵌套层级深且内容冗长，可能会成为一项耗时且潜在劳动密集型的任务。


    ### 动手练习 9-5：Azure OpenAI Codex


