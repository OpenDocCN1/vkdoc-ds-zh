- fmt: '**Example:** 假设系统找到了 100 本提及“量子力学”的电子书。排序算法随后评估每本电子书与量子力学原理的相关程度。它会考虑“量子力学”和“原理”在每本电子书中出现的频率，以及它们出现的上下文环境。一本专门论述该主题的电子书，其排名可能高于一本仅用简短章节介绍量子力学的普通理科教材。`BM25`算法会根据这些因素调整分数，以避免仅仅因为文档多次提及“量子力学”就给予其过高的权重。


    - **用户界面（`UI`）：** 这是用户与系统交互的部分。通过用户界面，用户可以输入搜索内容并查看结果。用户界面还允许根据结果对用户需求的有效性进行调整。有时，可能会提供一项功能，让用户反馈他们发现信息的有用程度，这有助于改进系统以供未来搜索使用。


    **Example:** 数字图书馆有一个搜索页面，用户可以在其中输入查询。在搜索“量子力学原理”后，页面会显示按相关性排序的电子书列表。列表中的每个条目都包含电子书的标题、带有高亮搜索词的简短摘录，以及打开或下载电子书的链接。此外，可能还有按日期、作者或学科领域优化搜索的选项。在查看结果后，用户可能有机会指出哪些电子书最有帮助，从而提供有价值的反馈以改进未来的搜索结果。


    现在我们已经详细了解了信息检索系统，学习生成式 AI 如何丰富这些系统至关重要。先进的机器学习方法正在显著改善我们查找信息的方式，其通过从用户与系统的交互中学习，并适应上下文、位置和个人偏好的变化。在理解自然语言和分析文本含义方面的增强能力，使得系统对用户提出的问题以及文档内容都有了更深刻的理解。此外，这些系统在管理不断产生的大量多媒体内容方面也变得更加出色。


    将生成式 AI 引入信息检索从根本上改变了游戏规则。我们不再需要像过去那样面对一个排序后的结果列表（这通常要求用户自己翻阅链接和文档来寻找所需答案），现在可以直接获得对查询的解答。这些系统能够在对多个复杂问题的对话中保持上下文连贯，使交互更加自然流畅。这意味着解释人类语言和理解意图的挑战将大大减少。搜索引擎已经发展到可以为我们整理信息，生成符合我们确切需求的、量身定制的特定内容，从而消除无关信息的干扰。


    生成式 AI 的引入以及大型语言模型（`LLMs`）的快速扩张，为向量数据库技术的成长和发展提供了理想环境。向量数据库通过向量嵌入来管理和操作数据。这些嵌入将文本、文档、图像、音频等多种数据类型转换为数值形式或向量表示，从而封装了数据实体之间的本质和相互联系。向量表示使机器能够以促进分析和决策的方式理解和处理数据。这种方法对于机器学习应用非常有利，因为数据库会根据每个数据项与其他数据项的相关性来组织数据。这种空间存储方式有助于检索语义上相关的数据，并且对像
    `OpenAI` 的 `GPT-4` 这样的大型语言模型（`LLMs`）特别有利，它使得 AI 聊天机器人能够通过审视过往的相似对话，更有效地把握对话的上下文。


    带有向量表示的信息检索系统流程如图[4-4](#501717_2_En_4_Chapter.xhtml#Fig4)所示。


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig4_HTML.jpg)


    **图 4-4**


    带有向量表示的信息检索系统。来源：[*https://medium.com/@ma-korotkov/a-gentle-introduction-to-vector-search-dc6e54e34907*](https://medium.com/@ma-korotkov/a-gentle-introduction-to-vector-search-dc6e54e34907)'
  raw: '**Example:** Suppose the system finds 100 ebooks mentioning “quantum mechanics.”
    The ranking algorithm then evaluates how relevant each ebook is to the principles
    of quantum mechanics. It considers factors like how often “quantum mechanics”
    and “principles” appear in each ebook, as well as the context in which they’re
    used. An ebook specifically on the subject might rank higher than a general science
    textbook that only has a brief section on quantum mechanics. The BM25 algorithm
    would adjust scores based on these factors to avoid giving too much weight to
    documents simply because they mention “quantum mechanics” a lot.


    *   **User Interface (UI):** This is the part of the system that users interact
    with. Through the UI, users can enter their searches and see the results. The
    UI also allows for adjustments based on the effectiveness of the results for the
    user’s needs. Sometimes, there might be a feature for users to give feedback on
    how useful they found the information, which can help improve the system for future
    searches.


    **Example:** The digital library has a search page where users type their queries.
    After a search on “quantum mechanics principles,” the page shows a list of ebooks
    ranked by relevance. Each entry in the list includes the ebook’s title, a short
    excerpt with the search terms highlighted, and links to open or download the ebook.
    Additionally, there might be options to refine the search by date, author, or
    subject area. After reviewing the results, users might have the option to indicate
    which ebooks were most helpful, providing valuable feedback to improve future
    search results.


    Now that we understand information retrieval systems in detail, it’s crucial to
    learn how generative AI has enriched these systems. Advanced machine learning
    methods are significantly improving how we find information by learning from how
    users interact with systems and adjusting to changes in context, location, and
    personal preferences. Enhanced capabilities in understanding natural language
    and analyzing the meaning of texts are leading to a deeper grasp of both the questions
    users ask and the content of documents. Moreover, these systems are getting better
    at managing the vast amounts of multimedia content that are constantly being produced.


    The introduction of generative AI into information retrieval has changed the game
    entirely. Instead of the traditional list of ranked results, which often requires
    users to sift through links and documents to find the answers they need, we can
    now get direct answers to our queries. These systems would be able to maintain
    the context of a conversation across multiple complex questions, making interactions
    more natural and fluid. This means the challenges of interpreting human language
    and understanding intent would be greatly reduced. Search engines have evolved
    to compile information for us, generating specific, tailored content that meets
    our exact needs, eliminating the clutter of irrelevant information.


    The introduction of generative AI and rapid expansion of large language models
    (LLMs) have provided an ideal environment for the growth and development of vector
    database technologies. Vector databases manage and manipulate data through vector
    embeddings. These embeddings transform various data types such as text, documents,
    images, audios, and more into numerical forms or vector representation that encapsulate
    the essence and interconnections among data entities. Vector representation enables
    machines to understand and process data in a way that facilitates analysis and
    decision-making. This approach is highly beneficial for machine learning applications,
    as the database organizes data based on the relevance of each item to others.
    This spatial storage facilitates the retrieval of data that is semantically related
    and is especially advantageous for large language models (LLMs) like OpenAI’s
    GPT-4, enabling the AI chatbot to grasp the context of a conversation more effectively
    by examining past conversations that are similar.


    The information retrieval system flow with vector representation is shown in Figure
    [4-4](#501717_2_En_4_Chapter.xhtml#Fig4).


    ![](images/501717_2_En_4_Chapter/501717_2_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Information retrieval system with vector representation. Source: [*https://medium.com/@ma-korotkov/a-gentle-introduction-to-vector-search-dc6e54e34907*](https://medium.com/@ma-korotkov/a-gentle-introduction-to-vector-search-dc6e54e34907)'
