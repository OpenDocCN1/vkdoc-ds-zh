- fmt: "### Hands-On Exercise 6-3: Fine-Tuning\n\nThere are different ways to carry\
    \ out a fine-tuning task:\n\n- Locally on GPU-enabled computers\n- Using GPU-enabled\
    \ VMs in the Cloud (e.g., Azure Data Science VMs)\n- Azure Machine Learning Studio\n\
    - Azure AI Studio\n- Non-Microsoft tools and VMs on Google, AWS, etc.\n\nYou can\
    \ also use notebooks and optimization packages such as `LoRA`, `ONNX`, and `Olive`.\
    \ You can also use Visual Studio Code to set the parameters for fine-tuning. A\
    \ comprehensive resource is the Phi-3 cookbook located at [`https://github.com/microsoft/Phi-3CookBook`](https://github.com/microsoft/Phi-3CookBook).\n\
    \nOne of the newer method is to use the no-code version in Azure AI Studio. At\
    \ the time of writing, this is a new feature that is still in Public Preview.\n\
    \n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig20_HTML.jpg)\n\n**Figure 6-20**\
    \ Models that are available for fine-tuning\n\n1. Picking up where we left off\
    \ from hands-on exercise 6-2, in AI Studio, click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figi_HTML.jpg).\n\
    \n2. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figj_HTML.jpg).\n\n\
    3. You should see `gpt-35-turbo`, as shown in Figure [6-20](#501717_2_En_6_Chapter.xhtml#Fig20)\
    \ below. In the screenshot, we are showing other models as well (e.g., `gpt-35-xxxxxxxx`).\
    \ These are models that we have fine-tuned before and are available for further^([^(73)](#fn73))\
    \ fine-tuning or retraining. Select `gpt-35-turbo` and click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figk_HTML.jpg).\n\
    \n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig21_HTML.jpg)\n\n**Figure 6-21**\
    \ Status of fine-tuning jobs\n\n1. Select the model version to fine-tune (0125\
    \ for GPT-3.5 Turbo), add a suffix to the model, and provide a description for\
    \ this fine-tuned model. For this exercise, we added `medal-winners` as the suffix\
    \ and the following description:\n\n   *“Fine-tuned model with Paris 2024 Olympics\
    \ medalists data as of 07/27/2024.”*\n\n2. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figp_HTML.jpg).\n\
    \n3. In step 2, Training data, select ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figq_HTML.jpg)\
    \ from the dropdown menu for Training data.\n\n4. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figr_HTML.jpg)\
    \ and navigate to where you stored the `medals.jsonl` file we prepared in the\
    \ previous exercise.\n\n5. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figs_HTML.jpg).\n\
    \n6. In the Validation data option, select `None`, unless you have a validation\
    \ dataset (which we do not have for this exercise).\n\n7. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figt_HTML.jpg).\n\
    \n8. Accept the defaults for batch size, learning rate multiplier, number of epochs,\
    \ and seed. Then click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figu_HTML.jpg).\n\
    \n9. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figv_HTML.jpg).\n\n\
    10. Your training job will be queued and eventually starts running. You may have\
    \ to click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figw_HTML.jpg) to get\
    \ the latest status. The statuses of the completed and cancelled jobs are shown\
    \ in Figure [6-21](#501717_2_En_6_Chapter.xhtml#Fig21) below. Yours will initially\
    \ show up as Queued, then Running.\n\n1. Alternatively, you can fine-tune the\
    \ Phi-3^([^(74)](#fn74)) base model by selecting ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figl_HTML.jpg)\
    \ from the side menu and then pick the ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figm_HTML.jpg)\
    \ model.\n   1. In the overview pane for the model, along the top, click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Fign_HTML.jpg).\n\
    \n2. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figo_HTML.jpg) on the\
    \ next page.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig23_HTML.jpg)\n\
    \n**Figure 6-23** Cancel requested for a job\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig22_HTML.jpg)\n\
    \n**Figure 6-22** Details of a running job\n\n1. Clicking on a running job will\
    \ provide you with the details and parameters of the run, the training file, and\
    \ the status, as shown in Figure [6-22](#501717_2_En_6_Chapter.xhtml#Fig22) below.\
    \ If you look along the top of the job, you have the option to cancel the job.\
    \ If you choose to cancel a running job, it may take a few minutes for the job\
    \ to get cancelled, and the status will change to `Cancel Requested` as shown\
    \ in Figure [6-23](#501717_2_En_6_Chapter.xhtml#Fig23) below.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig24_HTML.jpg)\n\
    \n**Figure 6-24** Failed job and the JobID\n\n1. A fine-tuning job, if not cancelled\
    \ by you, will either complete or fail. If a job fails, its status will show up\
    \ as `Failed`, as shown in Figure [6-24](#501717_2_En_6_Chapter.xhtml#Fig24) below.\
    \ If a job fails, you will need to review the logs^([^(75)](#fn75)) to determine\
    \ why it failed. You will need the `jobID` for the logs or when you are working\
    \ with support personnel, and the `jobID` is the name of the job.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig25_HTML.jpg)\n\
    \n**Figure 6-25** Statistical details of the job and the option to deploy it\n\
    \n1. As shown in Figure [6-25](#501717_2_En_6_Chapter.xhtml#Fig25), after a job\
    \ is completed successfully, clicking on the job will provide you with key metrics,\
    \ such as the number of epochs and the number of tokens consumed during the tokenization\
    \ step of the fine-tuning process, and it provides you with the option to deploy\
    \ the model, which we need to do before being able to consume it in the playground\
    \ or through our application.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig26_HTML.jpg)\n\
    \n**Figure 6-26** Deploying a fine-tuned model\n\n1. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figx_HTML.jpg).\n\
    \n2. Provide a deployment name for this model, select `Standard` as the deployment\
    \ type, configure the tokens per minute (TPM) setting, and select whether you\
    \ would like to enable dynamic quota to adjust your TPM automatically when there\
    \ is higher demand, if capacity is available. Figure [6-26](#501717_2_En_6_Chapter.xhtml#Fig26)\
    \ below shows the deployment settings for our exercise. Deploying a model is a\
    \ necessary step before you can consume the model because this creates an endpoint\
    \ for the model.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig27_HTML.jpg)\n\
    \n**Figure 6-27** Creating a model endpoint during deployment stage\n\n1. Click\
    \ ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figy_HTML.jpg).\n\n2. During\
    \ the deployment stage, your model endpoint will have the status of `Creating`\
    \ as shown in Figure [6-27](#501717_2_En_6_Chapter.xhtml#Fig27) below. Upon successful\
    \ creation, the status of this endpoint will show the status of `Succeeded`.\n\
    \n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig28_HTML.jpg)\n\n**Figure 6-28**\
    \ Successful deployment of model endpoint\n\n1. All successful model endpoint\
    \ deployments are listed in the deployments screen. Click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figz_HTML.jpg)\
    \ from located in the side menu.\n\n2. Once you see the model endpoint deployment\
    \ status is `Succeeded` as shown in Figure [6-28](#501717_2_En_6_Chapter.xhtml#Fig28),\
    \ click on the endpoint.\n\n![](images/501717_2_En_6_Chapter/501717_2_En_6_Fig29_HTML.jpg)\n\
    \n**Figure 6-29** Testing the model using the Chat playground\n\n1. Then click^([^(76)](#fn76))\
    \ ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figaa_HTML.jpg).\n\n2. The playground\
    \ provides a chat interface for you to easily check this fine-tuned model. Update\
    \ the System message with the text below and remember to click ![](images/501717_2_En_6_Chapter/501717_2_En_6_Figab_HTML.jpg)\
    \ when done.\n\n   *“You are an assistant that can answer factual questions about\
    \ medal winners at the 2024 Olympics in Paris as of July 27th 2024. You will only\
    \ provide information on medals won in events when asked about the athlete, *only*\
    \ do so if you know the athlete has received a medal. If you do not have that\
    \ information, say you don't know.”*\n\n3. Type the question we asked earlier\
    \ into the chat:"
