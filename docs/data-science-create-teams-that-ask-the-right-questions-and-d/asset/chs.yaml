- "# 第一部分  \n## 定义数据科学\n\n在本部分中，我们将为“数据科学”这个术语划定边界。你很容易找到认同数据科学重要性的人，但很难找到超过几个人能对它有一个共同的定义。我们将从介绍数据库以及数据科学如何使用不同的数据类型开始。然后，你将看到如何对这些不同类型的数据应用统计分析。\n\
  \n### 1. 理解数据科学\n\n在本章中，我首先定义什么是数据科学家以及他/她的工作内容。然后，我会介绍用于收集、清洗和分析数据的不同类型的软件和工具。一旦你了解了数据科学中使用的不同软件和工具，我将简要说明关注组织知识的重要性。\n\
  \n\n\n#### 定义一门具有多重含义的跨学科实践\n\n那么，什么是数据科学家？数据科学家比其他类型的科学家更难定义。如果你是一名政治学家或气候科学家，你拥有来自成熟学科的学位。“数据科学家”这个词在“数据科学”成为一门定义明确的学科之前就已经被广泛使用了。即便现在，自称为数据科学家的人也来自各种不同的领域。作为一门学科，“数据科学”仍在自我厘清的过程中。这有点像早期的考古学。任何人只要拿起铲子开始挖掘文物，都可以自称为考古学家。如今，你必须经过大学的系统学习并花上数年时间进行研究才能成为一名考古学家。像早期的考古学一样，数据科学仍然更像是一种实践，而非一门学科。\n\
  \n如果你以科学的方式处理你的数据，你就是一名数据科学家。你是否选择自称为数据科学家，很大程度上仍然取决于你自己。当然，有些人比其他人更适合“数据科学家”这个头衔。如果你是一名统计学家或数据分析师，或者你在生物科学领域工作，你或许可以辩称自己一直都是一名数据科学家。最早自称数据科学家的一批人实际上是数学家；另一些人来自系统与信息工程领域，甚至还有人来自商业和金融领域。只要你与数字打交道，并且对数据略知一二，你就可以轻松地自称为数据科学家。\n\
  \n如今，随着对数据科学家需求的增长，将会有更多行动来创建标准化的技能集。你已经可以在伯克利、雪城大学和哥伦比亚大学的新设项目中看到这种趋势。新的学位项目将使公司在招聘时能够依赖一套通用的技能集。但目前情况并非如此。事实上，仍存在一种风险，即任何处理数据并更新了其领英个人资料的人都可能被视作数据科学家。\n\
  \n思考数据科学的最佳方式是关注“科学”而非“数据”。在此语境下，科学运用的是科学方法。你应该进行实验，并采用经验主义的方法观察结果。经验主义是科学家通过实验和问题对数据做出反应，从而获得见解和知识的途径之一。数据科学家每天都应运用这一技能。经验主义方法是知识与实践的结合。你可能在使用经验主义方法，自己却并未意识到。\n\
  \n作为一名教练和培训师，我经常需要出差。这通常意味着我得住进不同的酒店。我总是惊叹于世界上竟有如此多种多样的水龙头和装置。我最常纠结的事情之一就是如何应对酒店淋浴设备的复杂性。过了一段时间，我意识到处理这个问题的最佳方法就是采用经验主义。首先，我必须猜测如何打开淋浴。我先是提出一个经验性问题：如何打开淋浴？然后我进行实验。当我按下某个按钮时，浴缸开始注水。如果我按下另一个按钮，淋浴喷头就出水了。等水出来后，我不得不扭动不同的旋钮，看看能否调节水温。如果我拧动一个旋钮，水变得太烫。如果我拧动另一个，水又变得太冷。于是我不断地提问和重新评估，直到把水温调到舒适为止。我可不想用理论方法。我可能会从理论上推导如何让水温舒适，然后转动一个拨盘就跳进淋浴。问题是，我很有可能会被冻着或烫伤。\n\
  \n数据科学家一直都在使用这种相同的经验主义方法。他们向数据提问，并做出细微调整，看看能否获得洞见。他们转动“旋钮”，提出更有趣的问题。\n\n在本书中，我所关注的数据科学家是指那些运用经验主义方法从数据中获取洞见，并专注于科学方法的人。我们强调的是“数据科学”中的“科学”，而非“数据”。\n\
  \n#### 使用统计学与软件\n\n由于数据科学仍由实践来定义，因此使用通用工具和软件就显得尤为重要。请记住，数据科学家就像早期的考古学家。所以，把软件想象成你用来进行发现所需的刷子和镐。然而，尽量不要过分专注于学习所有工具，因为它们并非你需要了解的全部。使人成为数据科学家的是科学方法，而非工具。数据科学家所需的工具大致分为三类：\n\
  \n*   **存储数据的软件**：这些是电子表格、数据库和键值存储。一些流行的软件包括 `Hadoop`、`Cassandra` 和 `PostgreSQL`。\n\
  *   **用于清洗数据的工具**：数据清洗，也称为数据清理，通过修改或修正数据，或删除重复、格式错误、错误或不完整的数据，使数据更易于处理。用于清洗数据的典型工具有文本编辑器、脚本工具以及诸如\
  \ `Python` 和 `Scala` 之类的编程语言。\n*   **帮助分析数据的统计软件包**：最流行的是开源软件环境 `R`、`IBM SPSS` 预测分析软件以及\
  \ `Python` 编程语言。这些软件大多包含数据可视化功能。你需要用它来制作漂亮的图表和图形。\n\n##### 存储数据\n\n首先，我们来看看存储数据所需的工具。你会经常听到一个术语：大数据。大数据听起来像一部\
  \ 20 世纪 60 年代恐怖片的片名。你仿佛看到一个戴着猫眼镜框的尖叫女人被一团渗出的大数据山吞没。大数据是指那些巨大到无法放入大多数数据管理系统的数据集。有些人将数据科学和大数据混为一谈，因为它们在同一个时期被大肆宣传，并且常常被捆绑在一起。然而，请记住，数据科学是将科学方法应用于数据。这并不假定你的数据必须是“大”的。事实上，有一本好书叫*《数据智慧：用数据科学将信息转化为洞察力》*，作者是约翰·W·福尔曼¹，这本书仅使用电子表格就介绍了数据科学统计学。\n\
  \n尽管如此，数据科学中最活跃的领域之一仍然是围绕大数据的，并且有专门设计用于处理大数据的软件。开源软件包 `Hadoop` 当前最为流行。`Hadoop` 使用分布式文件系统将数据存储在一组服务器上，这组服务器通常被称为\
  \ `Hadoop` 集群。该集群还会在服务器上分配任务，以便你也能在服务器上运行应用程序。这意味着你可以在数百甚至数千台服务器上存储 PB 级的数据，并在集群中对数据运行处理进程。在\
  \ `Hadoop` 集群上运行的两个最常见的进程是 `MapReduce` 和 `Apache Spark`。`MapReduce` 以批处理方式处理数据，而\
  \ `Spark` 可以实时处理数据。\n\n\n\n##### 数据清洗\n\n收集到数据后，你很可能需要使用一些工具来清洗数据，使其更可用。通过修改、补充数据，或删除重复、格式错误、不正确或不完整的数据，数据清洗能让后续工作更轻松。想象一下，你正在收集数百万条客户的推文，其中可能包含文本、图片甚至视频。在收集这些数据时，你可以编写一个脚本，将所有传入的推文按类型（文本、图片、视频等）进行分类。这样一来，你就可以分别对每组数据进行分析，并使用不同的参数。如果这种分析工作很频繁，那么最好创建一个小型\
  \ Python 应用程序在集群上执行操作，而不是等到推文进来时再用脚本处理。\n\n数据科学家可能花费多达 90% 的时间来调整和清洗数据，使其更可用，因此自动化这一过程对这一步骤至关重要。\n\
  \n##### 数据分析\n\n最后一类工具是用于分析数据的工具。其中最流行的两个是 `R` 和 `Python`。\n\n`R` 是一种统计编程语言和软件环境，它能让你在数据中建立联系和相关性，然后利用\
  \ `R` 内置的数据可视化功能呈现出来。这样你就可以为报告提供漂亮的图表。例如，假设你的公司想要一份报告，了解正面反馈与反馈发生在白天还是夜晚之间是否存在关联。获取这类信息的方法之一是：在\
  \ Hadoop 集群中捕获 Twitter 数据，然后使用数据清洗技术将推文分类为正面或负面。接着，你可以使用像 `R` 这样的统计软件包来创建正面/负面推文与其发布时间之间的相关性，并打印一份报告，用漂亮的图表展示结果。\n\
  \n请记住，这些都是最流行的工具。如果你是数据科学团队的一员，几乎可以肯定会在讨论中听到至少其中一种工具被提及。还有更多的工具可以自动完成数据收集、清洗和分析工作。\n\
  \n许多组织正在投入大量资金，试图在这个领域抢占一席之地。请记住，要专注于分析本身。数据和工具只是获得更深入见解的载体。在这个不断发展的领域，投资需谨慎。\n\n\
  #### 发现洞见，创造知识\n\n在过去 20 年中，大多数组织通过简化业务流程，专注于提高运营效率，以求更精益、更灵活。他们提出运营类问题，例如：“我们如何能更好地协同工作？”\n\
  \n数据科学则不同；它不是目标驱动的。它具备探索性，并运用科学方法。它关注的不是组织运营得有多好，而是如何获得有用的商业知识。借助数据科学，你会提出不同类型的问题，例如：\n\
  \n*   我们对客户了解多少？\n*   我们如何能交付更好的产品？\n*   我们为什么比竞争对手更优秀？\n\n这些问题都需要更高层次的组织思维，而大多数组织尚未准备好提出这类问题。他们习惯于设定里程碑和制定预算。他们并没有因保持怀疑或好奇心而获得回报。\n\
  \n想象一下，你在一次商务会议上，有人问了这些问题：我们为什么要这样做？是什么让你认为这会奏效？为什么这是个好主意？很可能，提出这些问题的人会被视为令人厌烦。通常，会有人这样回答：“你没看备忘录吗？”然而，这些正是建立组织知识所需的技能。这些正是你希望从数据科学团队那里得到的问题。但很多组织中的大多数人仍专注于完成任务。像上面提到的那些问题被视为前进的障碍。然而，作为一个组织，正是通过提出有趣的问题才能获得知识。\n\
  \n我曾为一家连接潜在购车者与经销商的网站工作。该网站上有数百个信息标签，用于显示客户是悬停还是点击了链接。所有这些数据都流入一个 Hadoop 集群，每周都有数\
  \ TB 的数据。公司还有长达数年的历史数据。他们投入巨资，甚至设立部门专门负责收集和维护这些数据。收集数据很容易。他们使用的软件简单且易于创建。困难的部分在于弄清楚如何处理这些数据。\n\
  \n对于许多刚刚涉足数据科学的组织来说，这似乎是一个共同的挑战。这些组织主要将其视为一个运营挑战。他们关注的是数据的技术层面。收集数据相对便宜且易于理解，因此大家关注收集。它在会议上很容易被接受，每个人都能支持这项工作。他们甚至会创建多个集群或数据湖，将来自整个组织的数据汇集起来。这是容易的部分。组织真正挣扎的是“科学”部分。他们不习惯提出和回答有趣的问题。\n\
  \n想想看，如果你是这家汽车网站的数据科学家，你可以设计哪些实验、提出哪些问题？你可以运行像图 1-1 那样的实验，更改图片的颜色，看看客户是否更有可能点击红色、蓝色或黄色的图片。如果报告显示，如果汽车是红色的，客户点击的可能性提高\
  \ 2%，组织就可以与汽车经销商分享这一发现以创造新的收入。你可以运行一个实验，通过减少每页显示的汽车数量，来测试网站是否因为页面汽车过多而影响点击。然后，你可以生成一份报告，看看是否在减少显示车辆后，客户点击链接的可能性增加了。\n\
  \n![A427825_1_En_1_Fig1_HTML.gif](img/A427825_1_En_1_Fig1_HTML.gif)\n\n图 1-1. 改变汽车的颜色\n\
  \n注意\n\n了解如何创建这些图表，请访问 [`​ds.​tips/​4H5Ud`](http://ds.tips/4H5Ud)。\n\n这就是数据科学家应该思考的那种实证研究。他们应该调整数据的各种参数，提出有趣的问题，运行快速实验，并制作设计精良的报告。\n\
  \n#### 总结\n\n在本章中，你了解了什么是数据科学家以及他们的工作内容。你还了解了用于收集、清洗和分析数据的不同类型的软件和工具，以及如何发现洞见并创造知识。关键在于提出有趣的问题。在第\
  \ 2 章中，你将学习一些数据库基础知识。\n\n脚注 1\n\nForeman, John W. Data Smart: Using Data Science\
  \ to Transform Information into Insight. John Wiley & Sons, 2013.\n\n### 2. 数据库基础概述\n\
  \n正如你所见，数据科学的核心在于更好地理解你的数据。因此，你需要使用数据库来访问所需数据，以便提出有趣的问题。数据库有许多不同的类型。此外，还有许多专门用于数据库的术语。你需要熟悉数据库世界中使用的的基本概念和术语，以及不同数据库的组织方式。\n\
  \n\n\n#### 与关系型数据库建立连接\n\n数据科学家会与多种不同形式的数据打交道，包括传统数据库或旧版电子表格。他们也可能处理图片和视频。作为一名数据科学家，你应该熟悉组织存储数据的常见方式。大多数组织都有各种各样的数据库，其中一些非常现代，而另一些则不那么现代。\n\
  \n理解这些不同技术的最佳方式是从源头开始。即使是最现代的数据库，也常常建立在超过 50 年历史的技术之上。现代数据库真正起步于 20 世纪 60 年代末的阿波罗太空任务。登月火箭需要数百万个零件，美国宇航局（NASA）与\
  \ IBM 合作创建了一个信息管理系统，即`IMS`，来组织这些数据。这家太空机构拥有早期的清单，这些清单看起来非常像现代的电子表格，它们是包含一系列列和长长行列表的计算机文件。\n\
  \n可以想象，在一个小型黑白终端上管理一个包含数百万行的表格可能会变得很困难。大约在同一时期，NASA 开始使用第一批关系型数据库。这些数据库将数据分割成多个表组。每个表看起来仍然像电子表格，但只代表数据中更小的一块。\n\
  \n然后，他们在这些表之间建立了关系。与其拥有一个包含百万个零件的长列表，他们可以创建 50 个表，每个表包含 2 万个零件。这就是为什么它们被称为关系型数据库：这种数据库基于彼此之间存在关系的表组。即使是早期的数据库工程师，也努力寻找将数据库表进行分组的高效方法。他们创建了图表来展示表之间的关系，这些图表被称为模式（schema）。模式决定了你的关系型数据库是易于使用，还是管理起来像一场噩梦。\n\
  \n即便是在这些早期数据库中，你也能看到工程师们在创建模式时可能遇到的困境。他们应该围绕最大的零件来创建表吗？也许只为推进器创建一个表，再为燃料箱创建另一个表？这里的问题是，如果你改变了火箭的设计，那么你也必须改变数据库的设计。\n\
  \n也许你可以根据零件的制造商来创建表。这样做的麻烦在于，可能有一家制造商生产数千个零件，而另一家制造商只生产几十个。这至今仍然是一个挑战。关系型数据库需要大量前期设计工作。在开始收集数据之前，你必须对自己的数据形态有相当多的了解。如果判断有误，重新设计数据库将耗费大量精力。\n\
  \nIBM 后来将他们为 NASA 创建的`IMS`商业化。在 20 世纪 70 年代中期，他们开发了结构化查询语言（`SQL`），以帮助客户从系统中提取数据。这种语言至今仍非常流行。`SQL`是一种优雅的语言，可以从多个不同的关系表中提取数据。它重新连接所有这些不同的表，并将数据呈现为仿佛全部存储在一个大型工作表中一样。这种虚拟表通常被称为“视图”（view）。\n\
  \n多年来，关系型数据库增加了许多功能，并催生了关系型数据库管理系统（`RDBMS`）。IBM、微软和甲骨文等公司至今仍在支持并开发关系型数据库管理系统。\n\n\
  > **注**  \n> 你可能听到的另一个关系型数据库术语是`CRUD`，它代表创建（create）、读取（read）、更新（update）和删除（delete）。它描述了`RDBMS`的所有功能。有时人们会在前面加上一个`S`表示“搜索”（search），从而使用缩写`SCRUD`。\n\
  \n#### 使用 ETL 将数据加载到数据仓库\n\n本节讨论的术语和概念被数据科学团队广泛使用。尽量不要被这些语言吓到。如果你理解了这些术语和挑战，你就更有可能快速获取所需的数据。\n\
  \n许多数据科学概念都建立在之前关于关系型数据库的工作之上。几十年来，公司一直在捕获并试图分析数据。即使在今天，`RDBMS`仍然是企业数据库的基石，你需要理解`RDBMS`术语才能做好数据科学项目。你很可能遇到`RDBMS`术语的一个场景是处理企业数据仓库（`EDW`）。`EDW`是一种特殊类型的关系型数据库，专注于数据分析。传统数据库针对在线事务处理（`OLTP`）进行了优化，而`EDW`则用于在线分析处理（`OLAP`）。\n\
  \n可以这样理解：典型数据库专注于实时处理数据，而`EDW`则专注于分析已经发生的事情。\n\n假设你有一个销售跑鞋的网站。你聘请了一名工程师来创建数据库。她创建了几十个不同的表和关系，包括客户地址表、鞋子表、运输选项表等等。网络服务器使用`SQL`语句来收集数据。当客户购买一双鞋时，他们的地址数据与鞋子关联，网络服务器向客户提供其运输选项，然后鞋子被发出。你希望这个数据库快速高效，并专注于快速响应。这个数据库记录的是客户正在进行的实时操作。这就是一个`OLTP`数据库。\n\
  \n你还要求你的数据库工程师创建一个脚本，每天将数据上传到你的仓库。你的数据仓库针对分析处理进行了优化。这就是一个专注于生成报告的`OLAP`数据库。\n\n\
  你让一位数据分析师创建一份报告，看看客户的地址与鞋子类型之间是否存在任何关联，如图 2-1 所示。你发现，居住在较温暖地区的人更有可能购买颜色鲜艳的鞋子。你利用这一信息修改了网站，使来自温暖气候地区的客户在页面顶端看到颜色更浅的鞋子。\n\
  \n![A427825_1_En_2_Fig1_HTML.jpg](img/A427825_1_En_2_Fig1_HTML.jpg)\n\n图 2-1. 按州划分的平均颜色亮度\n\
  \n> **注**  \n> 了解如何创建此图表，请访问 [`http://ds.tips/trAp8`](http://ds.tips/trAp8)。\n\n\
  现在假设你的网站大获成功，并被一家销售各类运动服装的公司收购。那家公司为其所有网站建立了一个统一的仓库，他们想要将你网站的数据与他们所有其他网站的数据合并。这时，该公司会执行一个称为`ETL`的操作，它代表提取（extract）、转换（transform）和加载（load）。他们从你的网站提取数据，然后将数据加载到他们的`EDW`中。\n\
  \n当他们提取你的数据时，会尝试采用某种标准格式，以便他们能够将数据转换成适合其数据仓库的形式。他们仓库中的表可能具有不同的模式。例如，数据仓库可能将运输信息放在客户表中，而你的数据库则有独立的运输信息表。数据必须经过转换才能被加载到`EDW`中。数据分析师很可能将大部分时间花在清洗和连接数据上，使其符合要求，最后将转换后的数据加载到仓库中。\n\
  \n上述场景并非唯一需要执行`ETL`的情况。有些公司可能有一个独立于 Hadoop 集群的数据仓库，在这种情况下，他们需要对仓库数据运行`ETL`，以将其移动到\
  \ Hadoop 集群中。这时，数据分析师需要转换数据，以便集群能够使用。\n\n许多组织常常将 Hadoop 视为昂贵数据仓库的替代品。他们希望通过将数据存储在廉价的硬件上，而不是昂贵的仓库设备上来节省成本。在这种情况下，公司可能会重写他们的`ETL`流程，以便将数据加载到\
  \ Hadoop 集群中，然后逐步淘汰或关闭数据仓库。\n\n\n\n#### 用 NoSQL 放下过去\n\n通常，数据科学团队需要一种更灵活的方式来存储数据。请记住，关系型数据库依赖模式（schema）。在将数据放入数据库之前，你需要对数据有充分的了解，这意味着你必须提前规划。你必须知道数据库字段中出现的数据类型（文本、视频、音频或其他），将这些字段组织成表，然后创建表之间的关系。数据库需要一套固定的结构，这样才能创建、读取、更新和删除记录。对于某些极其庞大的数据库，这种开销可能会拖垮你的服务器。\n\
  \n让我们回到你的跑鞋网站。一位顾客找到一双鞋，然后进入结账页面。此时，网站将正在购买的这双鞋与顾客的地址关联起来。这个结账页面需要访问四个不同的数据库表：\n\
  \n*   鞋子表\n*   顾客表\n*   地址表\n*   物流表\n\n这对数据库来说是一大堆工作。数据库工作越吃力，你的网站速度就越慢。\n\n如何加快速度呢？你需要购买更大的服务器、将表拆分到多个服务器上，还是让多个服务器通过网络同步？对于真正的大型网站来说，这些选项可能显得不自然。\n\
  \n现在，想象一个数据库，它将结账页面中的所有内容作为一个事务（transaction）来存储。一个数据库事务是一项要么全做、要么全不做的工作单元，必须完成。它为鞋子、你的顾客、他们的地址和物流一次性创建一个记录。现在，如果数据没有被拆分成表，也不需要查询任何关系，那会怎样？信息直接存入，你就大功告成了。\n\
  \n这就是 NoSQL 背后的理念。NoSQL 最初是作为 Twitter 上的一个话题标签（hashtag）使用的，供那些想要超越关系型数据库的开发者使用。它实际上并不是对\
  \ SQL 的攻击。事实上，NoSQL 与 SQL 并没有太大关系。它更多是关于关系型数据库的局限性。通常，一个 NoSQL 数据库应该是非关系型、无模式（schema-less）、对集群友好，并且最好是开源的。\n\
  \n所有这些特性都应该能吸引数据科学团队。非关系型数据库通常更容易更改，使用起来也更简单。你的 Web 应用程序的外观与数据存储方式之间不必存在脱节。你也无需经历创建和拆分现有表这种繁琐的过程，这通常被称为数据库规范化（normalizing\
  \ your database）。没有模式，你就不用担心事先要了解一切。\n\n回到跑鞋网站。它被一家更大的公司收购了。这家公司想把你的客户加入他们的常客计划。对于关系型数据库来说，这是一个严峻的架构挑战。你应该在客户表中加入常客编号吗？是否需要创建一个全新的表来专门存储常客编号？一个客户可以有多个买家编号吗？两个客户可以共享同一个编号吗？在将客户加入常客计划之前，所有这些都需要理清。你必须重新设计数据库，并弄清楚如何修正缺失的数据。\n\
  \n没有模式，新字段就变得几乎微不足道。你只需将其作为一个事务存储。如果客户有常客编号，它就会出现在事务中。如果客户没有，那么这个字段就不存在。\n\n最后，NoSQL\
  \ 数据库应该对集群友好。你应该能够将数据存储在几百甚至几千个数据库服务器上。在 NoSQL 中，保存在事务中的记录被称为聚合（aggregate）。这些聚合包含了所有数据：鞋子、顾客、地址和物流信息。这些聚合更容易在多个数据库服务器之间同步。大多数服务器采用集群方式工作。这使得它们可以相互同步，然后向其他集群发送更新。\n\
  \n> **注意**\n> “集群”这个词听起来应该很熟悉。这与 Hadoop 处理其数据集的方式相同。事实上，Hadoop 的很多部分都是建立在 HBase\
  \ 之上的，而 HBase 是一个开源的 NoSQL 数据库。\n\n当你在数据科学团队工作时，几乎肯定会遇到 NoSQL。对于许多组织来说，这是处理大型数据集的首选方式。由于其更简单的设计，开发人员创建能够快速成长为企业级规模的\
  \ Web 应用程序也变得更加容易。\n\n#### 大数据问题\n\n如前所述，大数据和数据科学紧密相连，以至于许多组织将它们视为同一回事。请记住，数据科学是运用科学方法提出有趣的问题。这并不意味着你需要大量数据才能提出这些问题。大数据提供了一个丰富的新数据源，让你能够提出那些使用较小数据集无法回答的问题。\n\
  \n大数据实际上并不是一个名词。在最初的 NASA 论文中，它被描述为一个“大数据问题”。你可以用两种方式来理解：是“大数据”问题，还是大“数据问题”。如果你通读整篇论文，似乎他们强调的是问题。重点不在于“大数据”，而在于如何处理所有这些新数据的问题。十年后，麦肯锡的报告中也提到了这一点。在这份报告中，作者将大数据定义为超出常用硬件和软件能力范围的数据。\n\
  \n那么，为什么将大数据视为一个“问题”而非一个名词如此重要呢？这是因为许多启动大数据项目的公司实际上并没有真正的大数据。可能看起来数据量很大，所以显得很大。同时，因为存储和收集起来确实很有挑战，所以看起来像个问题。但这不是一个“大数据问题”。\n\
  \n判断你是否遇到大数据问题的一种方法是，查看你的数据是否属于四类。你可以将这四类记住为四个 V。问问自己这些问题：\n\n*   我的数据量（Volume）大吗？\n\
  *   我的数据类型（Variety）广泛吗？\n*   数据是以高速度（Velocity）传入的吗？\n*   我收集的数据具有真实性（Veracity）吗？\n\
  \n要成为大数据，它必须具备所有这四个属性。\n\n数据量的问题通常很容易回答。如果你每天收集 PB 级别的数据，那么你的数据量可能足够大。当然，这并不总是一个问题。在不久的将来，或许\
  \ EB 级别才会被认为是构成问题的足够大的数据量。\n\n数据应该有广泛的信息类型。可以是文本、视频、声音和图片。\n\n关于速度，想想纽约证券交易所。他们每天处理数十亿笔交易。他们以高速度接收着大量数据。股票价格涌入并以毫秒为单位波动。然而，所有数据都是同一类型。通常只是股票代码和价格——大部分是文本。他们收集交易数据，而不是图片、声音或新闻故事。所以他们并没有大数据问题。他们当然收集了很多数据，但他们现有的技术应该完全有能力应对这个挑战。\n\
  \n最后，考虑一下数据的真实性。想象一下，你创建了一个数据库，收集了所有关于你网站的推文和 Facebook 帖子。你收集视频、图片和文本。每天有数 PB 的数据流涌入你的集群。你运行报告，想看看客户对你的产品是持积极态度还是消极态度。仔细查看数据后，你意识到其中并没有一个问题可以判断客户的情绪。所有收集无用数据的努力都白费了，因为那些数据并没有提供任何你需要的信息。\n\
  \n\n\n#### 大数据与数据类型\n\n为了提供一个有趣的大数据问题示例，不妨想一想自动驾驶汽车所面临的挑战。你需要收集哪些类型的数据？你需要收集海量的视频、声音、交通报告和\
  \ GPS 位置信息——所有这些数据都实时、高速地流入数据库。然后，汽车必须判断哪些数据具有最高的真实性。那个人在路边尖叫是因为一场体育比赛，还是因为有人站在路上？人类驾驶员只有几秒钟的时间来弄清楚这一点。一辆使用大数据的汽车必须即时处理视频、音频和交通坐标，然后决定是停下来还是忽略这个声音。这是一个真正的大数据问题。\n\
  \n> **提示**\n> \n> 请记住大数据与数据科学之间的区别。大数据能让你提出更有趣的问题。但这并不意味着所有有趣的问题都需要大数据。专注于科学本身。这样，无论你拥有什么数据，你总能提出最好的问题。\n\
  \n---\n\n#### 本章小结\n\n在本章中，你了解到，由于数据科学围绕有趣的数据展开，你通常需要处理多种类型的数据库。你学习了一些专门用于数据库的术语，以及围绕该技术的一些基本概念和术语。你还了解了数据库的组织方式。在第\
  \ 3 章中，你将学习如何识别不同的数据类型。\n\n**参考文献**\n\n1.  Cox, Michael, and David Ellsworth. “Application-controlled\
  \ demand paging for out-of-core visualization.” In *Proceedings of the 8th conference\
  \ on Visualization’97*, pp. 235-ff. IEEE Computer Society Press, 1997.\n2.  Manyika,\
  \ James, Michael Chui, Brad Brown, Jacques Bughin, Richard Dobbs, Charles Roxburgh,\
  \ and Angela H. Byers. “Big data: The next frontier for innovation, competition,\
  \ and productivity.” (2011).\n\n---\n\n### 3. 识别不同的数据类型\n\n当你身处数据科学团队时，你经常会处理许多不同类型的数据。这些不同的类型将成为决定你如何存储数据的关键因素。像`NoSQL`这样的技术为你提供了极大的灵活性来存储不同的数据类型。关系数据库的灵活性较低，但有时更容易使用，并且通常在关系数据库中生成报告也更容易。\n\
  \n当你考虑如何存储数据时，你需要了解不同的数据类型。对于任何存储方式来说都是如此。某些数据库针对特定类型的数据进行了优化。就像你不会想把三明治存放在水罐里一样，你也不应该建立一个关系数据库来存放错误类型的数据。\n\
  \n你的团队应考虑以下三种数据类型：\n\n*   **结构化数据**：遵循特定顺序和特定格式的数据。\n*   **半结构化数据**：具有一定结构，但同时具有额外灵活性，可以更改字段名称和创建值的数据。\n\
  *   **非结构化数据**：不遵循模式且没有数据模型的数据。\n\n我们将在以下章节中更详细地探讨这些数据类型，然后介绍什么是“大数据垃圾”，并为你提供一些从中筛选的技巧。\n\
  \n#### 保持简单：结构化数据\n\n第一种数据类型在很多方面都是最简单的。它通常被称为结构化数据。结构化数据是遵循特定顺序和特定格式的数据。它就像数据库世界中的砖块和砂浆——廉价、不灵活，并且需要大量前期设计。\n\
  \n结构化数据的一个好例子是典型的办公电子表格。当你用数据填充行时，你必须遵循相当严格的格式和结构。例如，你可能有一个名为`Purchase Date`的列。每个字段都必须遵循严格的指导原则。你不能在一行中填入`Tuesday`，然后在下一行填入`March`。你必须遵循指定的格式；例如，数字月份后跟斜杠、日期和年份（类似于`MM/DD/YYYY`格式）。\n\
  \n这种格式和结构被称为数据模型。结构化数据依赖于这个数据模型。数据模型类似于数据模式，只是模式用于定义整个数据库结构。数据模型定义了单个字段的结构。它定义了你如何确定每个数据字段中的内容。你决定该字段是包含文本、数字、日期还是其他任何内容。\n\
  \n思考一下电子表格的例子，以及如果你忽略数据模型可能会发生什么。如果你在一行的`Purchase Date`字段中输入`Tuesday`，在另一行中输入`March`，当你想要创建一个显示三月份所有购买的报表时会发生什么？你会怎么做？你会使用数字三吗？你会使用单词`March`吗？你肯定不能使用单词`Tuesday`。\n\
  \n如果你进行了这种类型的数据输入，你的电子表格将充满数据垃圾。每当你尝试对数据进行排序或创建报表时，都会出现一堆包含无效数据的行。然后你将不得不返回去清理它们，或者直接从报表中删除它们。这就是为什么许多电子表格应用程序都有格式规则，强制你在输入数据时遵循特定模型。\n\
  \n数据库也是如此。许多数据库会拒绝不遵循模型的数据。通常，用于收集数据的网站（或中间件）会为各个字段设置特定的类型和格式。\n\n关系数据库擅长收集结构化数据，这意味着存在大量的结构化数据。你在网站或通过移动应用访问的许多数据都来自结构化数据。你的银行对账单、航班信息、公交时刻表，甚至你的通讯录都是结构化数据的形式。\n\
  \n但这并不意味着大多数数据都是结构化的。实际上，大多数数据并不遵循特定的格式和结构。事实上，一些更有趣的数据根本不遵循任何结构。像视频、音频和网页这样的数据没有定义好的结构。\n\
  \n作为数据科学团队的一员，你需要将数据类型与收集方法结合起来。如果你使用关系数据库，你主要局限于结构化数据。对于结构化数据，生成报告通常非常直接。你可以使用结构化查询语言（`SQL`）从数据库中提取数据并以标准格式显示。如果你使用`NoSQL`集群，你可以处理所有数据类型，但生成报告会更加困难。这些都是你的团队需要考虑的决策。\n\
  \n\n\n#### 共享半结构化数据\n\n当关系数据库中存储着结构化数据时，世界万物似乎都显得条理清晰、井然有序。这就好比把所有香料都装进香料罐里——你清楚每样东西在哪里，也知道确切该去哪里找。然而，很少有应用能始终保持如此简单。\n\
  \n半结构化数据比结构化数据更难定义，因此我们以跑步鞋网站为例进行说明。假设你为这个网站使用了关系数据库，其中包含四张表：鞋子、客户、客户地址以及配送选项。所有结构化数据都符合某个数据模型，日期格式是标准的，邮政编码也是标准的。一切运行顺畅，世界似乎尽在掌控。\n\
  \n接着，你收到了配送承运商的一封邮件。承运商表示，只要直接将信息添加到他们的数据库，就能大幅降低成本。你只需查询他们的数据库，下载某个区域配送代码，然后将其添加到订单中并创建一条新记录。这应该很简单，因为他们的数据库和你的差不多——都是关系数据库中的结构化数据。\n\
  \n问题在于，他们的模式与你的模式不同。你称邮政编码数据为`ZIP Code`，而他们则称之为`postal code`。你并不关心鞋子是寄往公司还是住宅，但他们关心。你也没有指定是房子还是公寓，而他们对不同情况有不同的费率。现在，你需要一种方法，将你的结构化数据与他们的结构化数据进行交换，尽管双方的模式各不相同。\n\
  \n为了解决这个问题，你需要下载承运商的数据及其相关模式。当客户订购一双鞋时，你的数据库会将邮编发送给承运商的数据库，并返回一堆数据，其中包含他们版本的地址，带有他们的字段名和数据模型。记住，他们用`postal\
  \ code`来表示邮政编码，这也会包含在新数据中。\n\n他们的数据具有结构化数据的一些特征：组织良好、格式标准。文本字段是文本，日期字段是日期。但是，这些数据包含了他们自己的模式。承运商可以使用任何他们想要的字段名。这就是为什么这类数据被称为半结构化数据。\n\
  \n半结构化数据甚至比结构化数据更为常见。它有结构，但这个结构取决于数据来源。你会一直与半结构化数据打交道。电子邮件就是半结构化数据，它具有相当一致的结构（总是有发件人和收件人），但邮件内容可能千变万化，可能只是纯文本，也可能包含图片或附件。\n\
  \n数据科学团队通常处理的半结构化数据比结构化数据更多。大量的电子邮件、网络日志和社交网站内容都可以进行分析。\n\n在谈论处理和交换半结构化数据时，有几个术语非常常见。其中之一是**可扩展标记语言**（`XML`）数据类型，这是一种较旧的、用于信息交换的半结构化数据类型。还有**JavaScript\
  \ 对象表示法**（`JSON`），这是一种更新式的半结构化数据交换方式，通常是网络服务的首选数据类型。\n\n纳入半结构化数据是提出更有趣问题的好方法。回到跑步鞋的例子，假设你想获取客户对跑步鞋订单的反馈。你可以从一些大型社交媒体网站下载半结构化数据，然后将其与你已有的客户结构化数据相结合。如果客户对他们的鞋子不满意，你可以发送一张道歉优惠券。\n\
  \n这些都是你可以利用结构化和半结构化数据发现的问题。你的团队可以开始调查客户对其购买的满意度。\n\n#### 收集非结构化数据\n\n最主流的数据类型是既非结构化也非半结构化的所有数据：非结构化数据。一些分析师估计，80%\
  \ 的数据都是非结构化的。仔细想想，这很有道理。思考一下你每天产生的数据：每次你留下语音邮件、上传到 Facebook 的每张照片、你在工作中创建的 OneNote\
  \ 备忘录或 PowerPoint 演示文稿，甚至你在网上搜索时产生的数据——所有这些都是非结构化的。\n\n那么，所有这些数据有什么共同点呢？这是最大的挑战。答案是：共同点不多。它没有模式（schema-less）。记住，模式是显示数据字段、表和关系的地图。对于非结构化数据，你没有这张地图。此外，非结构化数据的格式取决于文件本身。Microsoft\
  \ Word 文档可能有一个固定格式，但这个格式只被该应用程序使用，并非所有文本的通用格式。这就是为什么你通常无法在另一个程序中编辑 Microsoft Word\
  \ 文档。\n\n这也意味着没有固定的数据模型，没有一致的地方可以查找字段名和数据。如果你有十几个文档，你如何找出它们的标题和内容？如果其中一些是 PDF，一些是\
  \ Microsoft Word 文档，还有一些是 PowerPoint 演示文稿，该怎么办？每种都有其专有格式，根本找不到一个标有`document title`的字段来查询。\n\
  \n这是像谷歌这样的搜索引擎公司多年来一直致力于解决的挑战。你如何处理没有固定格式、也没有一致数据模型的数据？每次你使用这些搜索引擎时，都能看到他们努力的成果。如果你搜索`cat`这样的词，你会看到文本、视频、图片，甚至音频文件。\n\
  \n处理非结构化数据是数据科学中最有趣的领域之一。像 NoSQL 这样的新型数据库允许你捕获和存储大型文件。将所有数据存储在一个地方要容易得多。所有的音频、视频、图片或文本文件都可以存入一个\
  \ NoSQL 集群。\n\n如果你想捕获所有数据，也有一些新工具可用。你可以使用像 Hadoop 这样的大数据技术来进行批处理或实时处理数据。\n\n那么，让我们回到你的跑步鞋网站。业务有了一些增长，现在你加入了新的数据科学团队。你与市场和管理部门合作，提出了第一个有趣的问题：谁是最好的跑步鞋客户？你收集了一些基本的人口统计信息，这些信息在客户数据库中很容易找到。你有他们的电子邮件地址以及他们所在的城市和州。你利用这些信息，开始爬取客户的社交网络帖子。你开始收集所有的非结构化数据。也许你的客户发布了一段完成马拉松的视频，你可以发送一条祝贺推文。\n\
  \n你或许还会决定开始爬取客户好友的帖子。也许你的客户发布了一张他们与一群人一起跑步的图片。你可以利用非结构化数据来识别那些人，并向他们发送特别促销信息。\n\n\
  这类数据项目通常被称为客户的 360° 视图。你试图找出所有能了解他们动机的信息。然后，你可以利用这些信息找到最佳客户并发送促销信息。你也可能会发现，有几位客户推荐了很多朋友，你可以为他们提供特别的激励和折扣。\n\
  \n随着时间的推移，你可以捕获越来越多的客户非结构化数据，这将使你能够提出关于客户更复杂的问题。例如：他们更有可能旅行吗？他们更有竞争意识吗？他们多久去一次餐厅？每一个问题都可以帮助你与客户建立联系并销售更多产品。在收集这些数据时，你可能希望像图\
  \ 3-1 所示那样，以图表形式展示出来。\n\n\n\n![A427825_1_En_3_Fig1_HTML.gif](img/A427825_1_En_3_Fig1_HTML.gif)\n\
  \n**图 3-1.** 品牌关注者关键词提及量\n\n**注意：** 了解如何创建此图表，请访问 [`http://ds.tips/Muj7f`](http://ds.tips/Muj7f)。\n\
  \n非结构化数据是一种与日俱增的资源。想想你今天做了哪些可能让一家公司感兴趣的事情。你是否发推文吐槽通勤路途漫长？也许你需要一双更好的鞋子。你是否抱怨过雨天？你应该买把伞。非结构化数据使公司能够提供这种层次的互动。\n\
  \n#### 筛检大数据垃圾\n\n非结构化数据带来了一系列新的挑战。你遇到的第一个问题就是是否要删除数据。请记住，数据科学团队会对其数据应用科学方法。你希望能够提出有趣的问题。你需要决定是否要对想提出的问题设置任何限制。\n\
  \n保留数据和丢弃数据都有充分的理由。一些数据分析师认为，你永远无法预知自己可能会提出哪些问题，那么为什么要丢弃数据呢？此外，存储海量数据相对便宜——通常每千兆字节只需几美分。与其决定丢弃哪些数据，不如全部保留。有时候，购买新硬盘比花时间参加数据保留会议更划算。\n\
  \n另一些分析师则认为应该丢弃数据。那些大数据集群中可能包含大量垃圾。垃圾越多，就越难找到有趣的结果，因为信息中包含了太多噪音（无意义的数据）。决定保留还是删除数据，是许多数据科学团队仍在探索的难题。\n\
  \n我曾在一家应对这一挑战的公司工作。他们运营着一个连接潜在购车者与汽车经销商的网站。他们创建了一个标签系统，记录客户在其网站上的所有浏览行为。每当客户将鼠标悬停在一张图片上，数据库就会新增一条记录；他们点击的所有链接也都会被收集。这个系统发展出了数千个标签。每个标签都对应着数百万笔交易。公司内部只有少数人理解每个标签捕获的内容，这使得他们很难生成有趣的报告。\n\
  \n他们对非结构化数据也使用了同样的标签系统。他们开始收集广告和 Flash 视频的信息。他们希望将标签、图片和交易关联起来，这样就能看到客户点击的图片以及指示其在页面上位置的标签。所有这些信息都存储在日益增长的\
  \ Hadoop 集群中。\n\n团队中有人认为大量数据已经过时了。只有少数人了解这套标签系统，而且广告在不断变化。此外，了解标签系统的人开始重命名标签，导致大量数据变得陈旧。\n\
  \n团队中的其他人则认为，与 Hadoop 集群的存储容量相比，这只是一小部分数据。谁会在乎几 GB 的过时数据呢？不值得为此费心清理。\n\n你也可能会遇到这类挑战。处理时，请记住以下几点：\n\
  \n- 实际上并没有标准答案。你的数据科学团队只需找出最适合他们的方法。\n- 如果你决定保留所有数据，那么在生成有趣报告时可能需要付出更多努力。你需要进行更多的过滤，数据中也会存在更多噪音。\n\
  - 如果你决定丢弃数据，集群会更干净。但是，你有可能无意中丢弃一些未来会后悔的数据。就像清理你的衣柜一样，你永远不知道那件麂皮领夹克什么时候会重新流行起来。但如果你保留太多夹克，可能会忘记自己有什么。\n\
  \n最重要的是确保你的团队做出决定。你不希望数据政策每几个月就变一次。要么在一开始就决定计划保留所有数据，要么确定要丢弃一些数据。与团队合作，确保每个人都同意这项政策以及哪些数据可以丢弃。如果没有既定政策，你可能会破坏所有数据。如果你不知道丢弃了什么、保留了什么，就很难理解报告的含义。尽早尝试找出最适合团队的办法。\n\
  \n#### 总结\n\n在本章中，你了解到结构化数据是按照特定顺序遵循特定格式的数据。你还了解到半结构化数据是具有一定结构，但字段名称可以灵活更改的数据。最后，还有非结构化数据，即其他所有数据。它是不遵循模式、也没有数据模型的数据。你还了解了大数据垃圾，并掌握了一些筛检技巧。在第\
  \ 4 章中，你将学习如何将统计分析应用于你的数据。\n\n### 4. 应用统计分析\n\n数据科学团队大部分时间都用于收集和存储数据，然后利用这些数据来提出问题。他们利用统计学和数学创建报告，看能否找到答案。统计学是一个非常有趣的领域。要加入数据科学团队，你需要对该领域的语言有基本的了解。在探索统计分析时，有几个术语你需要熟悉，它们是：\n\
  \n- **描述性统计**：以有意义的方式分析、描述或总结数据，以发现数据中模式的过程。\n- **概率**：某件事发生的可能性。\n- **相关性**：衡量两个事物之间关联程度的一系列统计关系。通常用\
  \ 1 到 0 之间的数字来衡量。\n- **因果关系**：当一个事件是另一个事件发生的结果时。\n- **预测性分析**：将统计分析应用于历史数据，以预测未来。\n\
  \n我们将在以下各节中更详细地介绍每一项。阅读这些章节时，请务必留意更多的统计分析术语。\n\n\n\n#### 初识描述性统计\n\n统计是讲述故事的工具，但它们本身并非故事的终点。判断你从故事中获取了多少信息的最佳方法，就是在感觉不对劲时提出质疑。\n\
  \n我儿子曾给我讲过一个与此相关的绝妙笑话，展示了团队如何利用统计来讲述故事。他问：“为什么你从来没见过大象藏在树上？”我耸了耸肩，他回答说：“因为它们太擅长藏身了。”在看报告时，请试着回想这个笑话。人们通常将统计视为具体的数学。谁会质疑二加二等于四呢？事实上，统计更像是讲故事。和任何故事一样，它可以充满事实、虚构和幻想。如果你不知道该往哪里看，一些相当庞然大物（大象）就能被隐藏起来。\n\
  \n你会在政治领域看到这种情况。一位议员可能说：“过去四年里，选民的平均工资上涨了 5000 美元。”人们会鼓掌。挑战者可能说他们不应该鼓掌，并指出“典型的中产阶级家庭现在的收入比四年前少了\
  \ 10000 美元。”谁说真话了？答案是两人都说了真话。他们只是用统计来讲述不同的故事。一个故事谈论繁荣，另一个则谈论失败。两者都是真实的，然而都没有说出全部真相。你必须找到每个故事中隐藏的“大象”。\n\
  \n在这个案例中，议员们使用的是描述性统计。他们试图在不与每个家庭交谈的情况下，描述所有选民的整体状况。他们正在构建一个关于典型家庭的故事。\n\n一位议员使用了一种叫做**均值**的方法。这是最有用、最流行的描述性统计量之一。你会在平均绩点、体育比分、通勤时间和投资中看到它的应用。在这个例子中，议员将所有家庭的收入相加，然后除以家庭总数。果然，每个家庭大约多赚了\
  \ 5000 美元。\n\n但是且慢。均值并非描述典型家庭的唯一方式。竞争对手议员有另一种方法。她使用**中位数**家庭收入。中位数描述了处于中间位置的家庭的收入水平。要找到这个数字，你需要将所有家庭从低到高排序，然后从上到下编号。通过将排名一分为二，找到中间的那个数字。处于中间位置的家庭的收入就是中位数收入。\n\
  \n竞争对手议员发现中位数收入减少了 10000 美元。这表明平均家庭收入增加了 5000 美元，但中位数家庭收入却减少了 10000 美元。这是对同一批家庭的两种描述，却讲述了不同的故事，如图\
  \ 4-1 所示。\n\n![A427825_1_En_4_Fig1_HTML.gif](img/A427825_1_En_4_Fig1_HTML.gif)\n\
  \n图 4-1. 同一批家庭的不同故事\n\n注：查看如何创建这些图表，请访问 [`http://ds.tips/c6Aha`](http://ds.tips/c6Aha)。\n\
  \n当你看到这种情况时，记得要寻找那只“大象”。当中位数和均值之间存在巨大差异时，通常意味着你的数据存在偏斜。在这个案例中，想象一下有几个家庭极其富有。在过去的几年里，他们的收入大幅增长。这贡献了数百万美元的增量。这些家庭会使数据发生偏斜，因为顶端有一大笔钱。这会抬高均值，但不会真正影响中位数。在计算均值时，他们的收入会像其他人一样被加总。在计算中位数时，他们很可能只是排在顶端。处于中间位置的家庭根本不会改变。\n\
  \n你还会在其他方面看到中位数和均值带来的这种挑战。如果房间里站着两个人，他们的平均身高可能略低于六英尺。如果一个篮球运动员走进房间，他们的平均身高可能会增加一英尺。而身高的中位数则会大致保持不变。\n\
  \n在你的数据科学团队中，当你看到用统计讲述的故事时，不要害怕提问。同时，请确保你的报告使用不同的方式来描述数据。描述性统计可以讲述许多不同的故事。\n\n####\
  \ 理解概率\n\n概率是统计中另一个让你能够讲述有趣故事的领域。概率是指某件事情发生的可能性。它是对可能结果的度量。如果你抛一枚硬币，概率给出了硬币落在某一面或另一面的可能性。统计方面的概率研究侧重于**概率分布**。如果你掷一个六面骰子，那就意味着有六种可能的结果，任何一个数字出现的可能性都是六分之一。这意味着每次掷骰子，你击中特定数字的概率大约是\
  \ 17%。概率也可以展示一系列事件。如果你想展示连续两次掷出同一个数字的可能性呢？那就是 17%的 17%，大约为 3%。如果你在玩一个骰子游戏，这是一个相当低的概率。你的数据科学团队肯定会用到概率。它是预测分析的关键部分。它能帮助你判断客户更有可能做出某一种行为而非另一种行为的可能性。\n\
  \n我曾与一家生物技术公司合作，该公司试图利用数据科学来预测某人参与临床试验的可能性。让人们参与临床试验是一件棘手的事情。有一定数量的诊所，公司需要维持诊所的运营——即使它们是空的。如果诊所病人不满，公司就会亏损收入。\n\
  \n他们问了一个有趣的问题：“有哪些因素会阻碍人们参与临床试验？”事实证明，有许多因素可能会降低某人参与的概率。如果人们需要在前一天晚上禁食，他们参与的可能性可能会降低\
  \ 30%。此外，如果涉及抽血和针头，他们参与的可能性可能会降低 20%。图 4-2 是一个流程图，展示了既往参与经历、检验项目和恐血之间三方面的关系。\n\n\
  ![A427825_1_En_4_Fig2_HTML.gif](img/A427825_1_En_4_Fig2_HTML.gif)\n\n图 4-2. 既往参与经历、检验项目和恐血三者之间的关系\n\
  \n注：查看如何创建此图表，请访问 [`http://ds.tips/V2tup`](http://ds.tips/V2tup)。\n\n公司必须在人们参与的概率与结果的准确性之间取得平衡。例如，有一个药物试验，公司可以通过唾液测试或血液测试来检查药物的有效性。血液测试的准确率高出\
  \ 10%。这很简单；他们应该直接使用血液测试。但是且慢。如果他们用血液测试进行试验，由于害怕针头而决定不参与研究的人，会导致参与者减少 20%。如果他们想要\
  \ 1000 名参与者，那意味着少了大约 200 人。\n\n这又引出了另一个有趣的问题。如果测试少了 200 人，这是否意味着药物试验的准确性会降低？数据科学团队创建了另一个概率分布。如果药物引起某种反应的概率是\
  \ 1/500 呢？用 1000 个人进行研究会比只用 800 个人好得多。\n\n\n\n数据科学团队必须考虑到这一点。是让更多人参与无需扎针的研究（即使唾液测试准确度较低）更好吗？这引出了更多问题。团队是否应该让参与者多次进行唾液测试，以增加获得准确结果的概率？最终，这便是数据科学团队帮助公司做出的决策。或许，让尽可能多的人参与试验以增加发现药物反应的概率才是最佳方案。然后，他们可以更频繁地进行准确度较低的测试，以提高获得准确结果的概率。这样既能实现参与人数最大化，又能同时提升研究准确度——这一切都归功于概率的力量。\n\
  \n在数据科学团队中运用概率时，有几点需要牢记。首先，概率可能会带你走向意想不到的地方。谁能想到，采用准确度较低的测试方法，反而可能让医疗实践获得更好的结果呢？其次，概率也是提出有趣问题的绝佳载体。如果你的问题只是引出更多问题，请不要气馁。\n\
  \n请记住，数据科学涉及将科学方法应用于你的数据。有时，道路会带你走向未曾预料之处。关键在于，当路径出现急转弯时（这在处理概率时很容易发生），不要半途而废。这些急转弯往往正是通往你最深刻洞见的途径。\n\
  \n#### 寻找相关性\n\n相关性是数据科学中另一个非常有趣的领域。许多公司用它来猜测你会购买哪些产品。它也用于将你与朋友和熟人联系起来。如果你使用像 Netflix\
  \ 这样的服务，你可能会惊讶于网站能如此准确地猜出你会喜欢什么电影。亚马逊多年来一直利用相关性来推荐书籍。\n\n相关性是一系列统计关系，用于衡量两个事物之间的关联程度。它通常以\
  \ 1 或 0 来衡量。如果两个事物密切相关，则相关性为 1。如果两个事物毫无关联，则相关性为 0。1 可以表示为正数或负数。-1 通常表示反比关系或反相关性。\n\
  \n正相关的一个例子可能是身高和体重。一个人个子越高，体重可能越重。身高增加，体重也随之增加。还有更直接的例子，比如室外温度越高，买冰淇淋的人就越多。随着温度升高，冰淇淋销量也随之上升。负相关的一个例子可能是汽车和汽油。汽车越重，燃油效率就越低。随着汽车重量增加，油耗里程数下降。它们之间是反比关系。\n\
  \n如果你是一名跑步者，你可能会注意到上坡时跑得更慢。这也是一种负相关。坡度越陡，跑得越慢。随着坡度增加，你的速度下降。\n\n正相关和负相关都是观察两个事物之间关系的绝佳方式。负相关并非坏事，它只是另一种关系类型。\n\
  \n数据科学团队会在数据中寻找相关性。他们会试图微调人与事物之间的任何关系。幸运的是，软件工具可以处理计算相关性背后的大量数学运算。一个常用的公式是相关系数，即\
  \ 1、0 和 -1，用于指示人与事物之间是否存在统计关系。\n\n在计算相关系数时，你通常不会得到一个完美整齐的整数。相反，你可能会发现相关性是 `.5` 或\
  \ `-.75`。这表示相关性的强弱——数值越接近 1 或 -1，关系越强。\n\n一个有趣的数据科学挑战是领英的“可能认识的人”功能。领英希望找到一种方法来判断专业人士之间是否相识。有数据科学团队专门分析领英数据，寻找人脉之间的相关性，然后试图找出他们产生联系的原因。这些联系可能源于他们曾就读的学校、共同从事过的工作，或者共享的群组和兴趣。\n\
  \n这个数据科学团队会寻找正相关和负相关。他们可能在网站上发现你在某家公司工作，并且对某个职位感兴趣。然后他们找到另一位也对同一职位感兴趣且在同一家公司工作过的人。这就足以在你和这个人之间建立相关性；因此，网站可能会建议你与这个人建立联系。\n\
  \n数据科学团队还可以在你的人脉和他人的人脉之间建立相关性。如果你与某人有联系，而那人又与另一个与你技能相似的人有联系，那么你们可能会建立不错的联系。仔细想想，这很有道理。你更有可能认识在同一个办公楼里工作的人。你也更有可能与兴趣和技能相似的人建立联系。随着相似技能数量的增加，你认识那个人的可能性也随之增加。\n\
  \n相关性也能帮助你的团队质疑其假设。你可能会假设，在网站上花钱最多的人也会是你最满意的客户。但事实可能并非如此。事实上，两者之间可能存在负相关。也许花钱最多的人恰恰拥有最不切实际的期望。他们更容易失望，也更可能留下负面反馈，如图\
  \ 4-3 所示。\n\n![A427825_1_En_4_Fig3_HTML.gif](img/A427825_1_En_4_Fig3_HTML.gif)\n\
  \n图 4-3. 随时间变化的情绪评分\n\n注意：访客在网站上停留的时间越长，情绪评分越低。请访问 [`http://ds.tips/pawR7`](http://ds.tips/pawR7)\
  \ 查看如何创建此图表。\n\n作为数据科学团队，你将利用相关性来检验你的假设。你可能会寻找策略，让你最满意的客户花更多钱。你也可能寻找方法来管理高消费客户的期望。如果你留心寻找这些相关性，你将发现许多原本可能错过的信息。\n\
  \n\n\n##### 理解相关性并不等于因果性\n\n相关性是一个极好的工具——它能帮助你发现那些可能被忽略的关系。但凡事都有另一面。你必须判断这种相关性是否导致了某件事的发生。它是否是引发变化的那个因素？一般来说，相关性并不意味着因果性。一个尚未被考虑的第三方因素可能实际上影响着两个事物之间的关系。对于数据科学团队而言，弄清楚因果关系是一项巨大的挑战。你不想建立那些本不存在的关联。\n\
  \n试想一下。我在美国一个较寒冷的地区长大。当我的父母年事渐高后，他们搬到了南佛罗里达。现在，他们幸福地生活在一个阳光明媚的退休社区。每隔几个月，我的家人就会去佛罗里达探望他们。从统计数据上看，他们的社区是地球上最危险的地方之一。每次我们去探望时，总有人住院，甚至遭遇更糟的情况。他们的社区与死亡或重伤之间存在着很强的相关性。你可能会觉得，正因如此，我绝不会去探望父母。这听起来就像每一款第一人称射击游戏的开场场景。\n\
  \n然而，我们能看透这种相关性背后的本质。我们经常去探望他们，而且感觉非常安全。这是因为相关性并不意味着因果性。真正的原因是这里的居民平均年龄要高得多。在退休社区里，老年人受伤或死亡的概率更高。如果只看这种相关性，你会以为他们生活在战区。你绝想不到他们正平静地在泳池边打着麻将。\n\
  \n想想你的数据科学团队将如何应用这些概念。让我们回到跑鞋网站的例子。假设团队发现一月份的销售额出现了大幅增长。一月和购买新鞋的人数之间存在着很强的相关性。\n\
  \n团队聚在一起试图理解原因。他们提出了一些有趣的问题：人们在一月份会更有钱吗？在最寒冷的几个月里跑步的人更多吗？这些人是初次跑步者吗？他们是新客户吗？他们购买的是哪种类型的鞋子？\n\
  \n团队讨论了这些问题，并决定创建一些报告。报告显示，这些客户中大部分是购买昂贵鞋子的新客户。基于这些报告，团队初步认为，新销售额的原因是新客户在一月份更有钱。也许他们收到了礼品卡。\n\
  \n第二年，团队决定利用这一“因果关系”。他们在十二月推出打折礼品卡，同时向去年的新客户发送促销信息。几个月后，团队查看了数据。他们发现促销活动和折扣并未产生任何影响。购买鞋子的总人数和总数大致相同。更糟糕的是，去年的新客户似乎对新跑鞋毫无兴趣。因此，拥有更多钱并非这种相关性的原因。数据科学团队重新审视了他们最初的问题，并运行了更多报告。他们发现，这两年的所有新增销售额都来自新客户和初次跑步者。为什么在最冷的月份会有大量新客户购买昂贵的跑鞋呢？\n\
  \n团队思考了一下，认为原因可能在于行为模式。他们提出了一个新问题：所有新客户是否都是因为新年决心而试图健身的人？他们回头又创建了报告，如图 4-4 所示。报告显示，这些人都是新客户，他们购买了一双鞋后，在年中就停止访问网站了。这表明他们买了昂贵的鞋子，然后就放弃了。团队猜测，昂贵的鞋子或许曾是他们坚持跑步的动机。第二年，他们决定围绕新年决心开展一项新的促销活动。他们寄出了一封邮件，写道：“你想坚持自己的新年决心吗？”并提供了免费的跑步指南和健身追踪器，作为保持用户兴趣的方式。\n\
  \n![A427825_1_En_4_Fig4_HTML.gif](img/A427825_1_En_4_Fig4_HTML.gif)\n\n**图 4-4.**\
  \ 2015 年及 2016 年 1 月报告\n\n注意\n\n2015 年和 2016 年的一月，分别创下了销售额（数量和总收入）的最高和第二高纪录。在这两年的一月，每双鞋的平均价格均达到全年最高。公司在\
  \ 2016 年提供了更多礼品卡折扣，但这并未提振销售额。2015 年回头客和 2016 年新客户的数量是所有年份中最低的。在 2015 年和 2016 年 1\
  \ 月的买家中，约有 15%到 20%是初次跑步者。他们平均购买了 1 到 1.5 双鞋。当你深入分析初次跑步者的客户行为时，会发现总销售额在 1 月达到峰值。他们中的一些人会在第四季度再次购买，但大约一半的人再也没有回来。请访问[`http://ds.tips/fe2Ax`](http://ds.tips/fe2Ax)了解如何创建此图表。\n\
  \n相关性和因果性是大多数数据科学团队面临的关键挑战。建立虚假关联是一种真正的危险。在统计学中，这被称为伪因果。正如你所见，找到真正的原因能为你带来更大的价值。避免伪因果的最佳方法是遵循科学方法。记住要提出好问题，并对结果保持清醒的头脑。\n\
  \n\n\n#### 预测分析中的数据整合技巧\n\n到目前为止，你所接触到的内容都聚焦于过去。你已经了解了如何收集不同类型的数据并进行统计分析。这些统计方法是获得更深层见解的起点。你的数据科学团队将开始建立关联性，并预测特定事件发生的概率。现在，让我们将这些理念加以转化，用来预测未来——这通常被称为预测分析。这个术语与数据科学紧密相关，甚至有时会被混用，但二者并非同一概念。预测分析是数据科学的一个分支。数据科学是将科学方法应用于数据，而预测分析则是将分析结果转化为可执行的行动。\n\
  \n可以这样理解：气象学是一门科学。气象学家研究物理学、风速和大气层。如果你和气象学家一起在户外，他/她会向你解释云层为何呈现特定形态，以及气压如何决定云的移动。这是气象学中的科学层面——关乎对天气的理解和历史趋势的观察。但人们更常接触的气象学并非围绕科学本身，而是天气预报。\n\
  \n天气预报是气象学家团队运用预测分析的典型场景。他们利用历史数据计算概率，并借助概率与相关性来预测天气模式。例如，低压系统与强风暴之间存在相关性：当气压降低时，风暴强度会随之增加。这就是气压与风暴间的正相关关系。\n\
  \n所有这些分析最终汇聚成一个简单问题：明天的天气会怎样？曾经用于理解过去的方法，如今变成了对未来的预测。\n\n当前，人们对预测分析的兴趣与日俱增，因为新工具和新技术能带来更具启发的洞察。以天气预报为例：目前气象服务受限于来自几千个气象站的历史数据。想象一下，如果气象部门发放数百万个低成本信标，人们将其安装在住宅中并连接至无线网络，这些设备会记录气压、温度、视频和音频信息，然后上传至国家级的\
  \ Hadoop 集群——这将为科学家提供前所未有的海量信息。\n\n这正是预测分析与数据科学紧密关联的原因。更庞大的数据量让团队能提出更有价值的问题，并开展复杂分析。在上述场景中，团队可以逐栋房屋、逐个街区地观察天气模式，并基于数百万个家庭数据构建复杂的预测模型。\n\
  \n这一原理同样适用于你的团队。以跑鞋网站为例：假设团队收集了数百万条关于跑步的推文，并识别出推特上几位有影响力的跑者。你可以向他们免费寄送跑鞋或提供促销，希望他们能对贵公司发表正面评价；同时也能利用这些数据识别关键跑步赛事。\n\
  \n这些新工具使数据科学团队能够以更宏观的视角审视数据，并实时观测信息浪潮。气象学家可以分析 PB 级数据，跑鞋网站团队也能分析数百万条推文。\n\n许多组织对预测分析的前景兴奋不已，以至于常常没有投入足够时间发展数据科学团队。他们想跳过现有数据的理解阶段，直接进行预测。当你在数据科学团队工作时，务必传达一个理念：预测质量取决于团队对数据的分析深度。\n\
  \n你的团队必须理解过去，才能预测未来。不要轻视分析工作。要对数据提出优质问题，并运用统计工具生成有价值的报告。唯有如此，对未来的预测才更有可能准确。\n\n\
  #### 总结\n\n本章你学习了描述性统计、概率、相关性、因果关系以及预测分析。你还了解了如何在数据科学故事中运用统计方法。在第`5`章，你将学习如何规避数据科学起步阶段的常见陷阱。\n\
  \n### 5. 规避数据科学定义中的陷阱\n\n在本书中，我将在每部分末尾设置\"规避陷阱\"这一章节，帮助你将这些理念应用到组织中。新理念在多数组织落地时，往往会出现一些波折。你可能不会遇到这些问题，但它们在各组织中都颇为常见。\n\
  \n\n#### 聚焦能力\n\n数据科学领域的一个关键挑战，我称之为“梦想集群”。这个说法源自电影《梦幻之地》，由凯文·科斯特纳主演，他饰演一个倾尽毕生积蓄在玉米田里建起一座棒球场的人。已故球员的幽灵前来拜访他，敦促他完成球场。“如果你建好了，他们就会来。”幽灵们如是说。\n\
  \n许多组织也陷入了同样的陷阱。它们将精力集中于构建硬件和收集海量数据，投入巨资购买软件以运行在大型数据集群上。它们的梦想是：只要拥有足够的硬件和软件，就能获得宝贵的洞见。（建好了，它们自然就会来。）\n\
  \n细想之下，这似乎很有道理。许多组织在成功交付硬件项目方面经验丰富，这是它们擅长且做了几十年的老本行。硬件是实实在在的——你能看到你得到了什么。而探索则难以量化，其投资回报率很难完美契合项目流程。你只有做完之后才知道是否值得。数据科学是新生事物，在很多组织里，花钱去探索和提问并不容易。\n\
  \n美国国会图书馆曾启动一个著名的项目，要收集 1700 亿条推文。他们想证明自己能驾驭数据科学。他们购买了存储这些推文的硬件，却没有计划用这些数据做什么，也无法授权任何人访问这些数据。他们以为只要建好了，自然就会有人来。不幸的是，这些数据闲置在数百台服务器上，成为了数据收集的一座“纪念碑”。\n\
  \n这或许看起来是个极端的例子，但实则非常普遍。组织往往专注于构建能力。它们设定目标，要在其 `Hadoop` 集群中部署一定数量的节点，并使用一套可视化工具。预算都投入了硬件和软件，留给数据科学团队的资金所剩无几。\n\
  \n我曾在一家试图用大数据集群取代其数据仓库的组织工作。他们习惯于在硬件和软件上花费数百万美元，然后聘请数据仓库专家来维护这笔投资。当他们转向 `Hadoop`\
  \ 时，也抱有同样的心态。他们启动了一个价值数百万美元的项目，来创建三个独立的集群。全部预算都投入了服务器和软件。\n\n两年后，他们有了三个集群，但只有少数几个人知道如何访问数据。更糟糕的是，这几个人分散在不同的职能部门。他们投资了数百万美元的硬件和软件，却没有数据科学团队来分析数据、获取洞见。项目开始几年后，集群里只有几太字节的数据——大概相当于花几百美元就能买到的硬盘容量。只有几个人访问这些数据，为一两个部门制作了几个简单的报告。\n\
  \n为了避免陷入这个陷阱，需要记住几点。首先，数据科学团队是探索性的。他们审视数据以寻找洞见。数据本身不是产品，从数据中得出的洞见才是。拥有最大的集群并不能获奖。\n\
  \n即使数据科学团队可能大部分时间都在收集数据，但这并不意味着你的全部价值都来自于收集。就像拥有一把主厨刀并不会让你成为主厨一样。拥有大量数据收集能力并不会让你成为一个数据科学团队。关键在于你提出的问题和创造的组织知识。\n\
  \n大多数数据科学团队会使用多种不同的软件工具。（有时他们想用 `R` 而不是 `Python`；将一小部分数据放在像 `MySQL` 这样的关系数据库中可能更容易；他们也可能使用不同的可视化工具。）给你的团队留出灵活探索的空间。通常，数据科学团队使用几种免费工具能取得的成果，远多于一项重大投资。\n\
  \n科学团队应该按需构建工具。一个优秀的数据科学团队可能会有些“杂乱”：他们会使用各种不同的工具和技术来处理和清洗数据。\n\n与其投资硬件和软件，不如投资于培训和专业技能。你数据科学团队最宝贵的部分，是那些提出有趣问题并带来新知识的人。\n\
  \n#### 总结\n\n在本章中，你了解到组织聚焦于能力建设可能是一个错误。公司应更注重员工的培训和专业技能，而非收集数据所需的硬件和软件。在第二部分，你将学习如何组建你的数据科学团队，首先从第\
  \ 6 章的“完善你的人才”开始。\n\n"
- "# 第二部分  \n组建你的数据科学团队\n\n组建你的数据科学团队\n\n是时候组建你的数据科学团队了。在组建之前，你需要了解需要哪些类型的团队成员，如何组建团队，团队成员将从事何种工作，以及如何协同工作。然后，一如既往地，你应该了解如何避免可能遇到的任何陷阱。\n\
  \n"
- "# 6. 完善你的人才\n\n我们在第 2 章中定义了数据科学，并阐述了“数据科学家”的含义。在本章中，你将看到如何将这个角色分解为几个团队角色。然后，你将看到这个团队如何协同工作，以建立更强大的数据科学思维。\n\
  \n\n\n#### 正确看待数据科学家\n\n正如你在第 2 章所学到的，关于数据科学家的角色存在一些混淆。2001 年，威廉·S·克利夫兰发表了《数据科学：拓展统计学技术领域的行动计划》¹。这篇论文首次将统计学和计算机科学领域合并，创造了一个名为“数据科学”的全新创新领域。与此同时，莱奥·布雷曼发表了《统计建模：两种文化》²，描述了统计学家应如何转变思维模式，拥抱更多样化的工具。这两篇论文为数据科学奠定了基础，但它是在统计学领域之上构建的。\n\
  \n2008 年，来自 Facebook 和 LinkedIn 的一些顶级数据专家聚在一起讨论他们日常面临的挑战。他们意识到自己正在做类似的事情。他们将自己的角色视为多种不同学科的交汇点。他们决定将这一角色称为“数据科学家”。\n\
  \n当时的数据科学家只是一系列素质的集合。例如：\n\n* 理解数据\n* 掌握统计与数学\n* 应用机器学习\n* 懂得编程\n* 保持好奇心\n* 成为出色的沟通者和极客\n\
  \n他们是涉猎多个领域的文艺复兴式热衷者。\n\n问题在于，这组技能很难在一个人身上全部找到。我们每个人基于天赋都倾向于特定领域。我们通常会被自己的天赋所吸引，然后努力精进技艺。统计学家往往会努力成为更优秀的统计学家。业务分析师则会磨练自己的沟通技巧。同时，组织也施加了很大的压力要求专业化。大多数大型组织都划分为不同的职能领域。虽然需要一定的共识，但并非总是需要共同的专业知识。\n\
  \n此外，人们自我评估的能力出了名地差。著名的杜宁-克鲁格研究³发现，那些自认为技能很高的人往往严重高估了自己的专业水平。一位天赋异禀的统计学家可能认为自己也是出色的沟通者，但成为伟大的统计学家并不需要擅长沟通。一位伟大的统计学家即使在做演示时结结巴巴，也完全可以拥有漫长的职业生涯。\n\
  \n这就是为什么大多数组织会将工作划分给团队。团队中的个体各有专长。一个跨职能团队并不会假设每个人都是专家。相反，它鼓励个体相互学习彼此的长处，并弥补彼此的短板。而一个由数据科学家组成的团队可能无法识别这些短板。如果没有人指出盲点，团队就会盲目地摸索前行。\n\
  \n我曾在一家组织工作过，该组织有一个由数据科学家组成的团队正在构建一个集群。业务部门对此有些担忧，因为高层根本不知道这个团队在构建什么——他们很沮丧，因为他们在为自己不理解的东西付费。我参加了几次会议。数据科学家团队演示了一个简单的`mapReduce`任务。业务经理们茫然地盯着屏幕，偶尔瞥一眼他们的智能手机。在外人看来，从哈欠和揉眼睛动作中明显可以看出，这个团队的沟通工作做得很不到位。\n\
  \n会议结束后，我在白板上画了一个矩阵。我列出了以下六项技能：\n\n* 数据\n* 开发\n* 机器学习\n* 统计学\n* 数学\n* 沟通\n\n我让数据科学家们针对每一项技能，给自己打分（1\
  \ 到 10 分，1 分最差，10 分最佳），以便我们找出需要改进的地方。我拿着同一张技能列表给一位业务分析师看。我请他对该团队进行评分。\n\n结果如表 6-1\
  \ 所示。\n\n**表 6-1.** 数据科学家与业务分析师的评分\n\n| 技能领域 | 数据科学家的评分 | 业务分析师的评分 |\n| --- | ---\
  \ | --- |\n| 数据 | 8 | 10 |\n| 开发 | 7 | 9 |\n| 机器学习 | 6 | 8 |\n| 统计学 | 8 | 9 |\n\
  | 数学 | 8 | 10 |\n| 沟通 | 9 | 6 |\n\n这是一个经典的杜宁-克鲁格效应结果。数据科学家们在自认为水平很高的领域，严重高估了自己的专业能力。这些数据科学家都来自数量领域，他们是统计学家、数学家和数据分析师。他们无法识别自身的盲点。需要一个来自完全不同领域的人来揭示他们面临的挑战。\n\
  \n如果你是一个试图从数据科学中获得价值的大型组织的一员，那么依赖少数几位“超级英雄”数据科学家将是错误的。背景相似的个体往往会拥有相同的盲点。学术研究表明，通常你能从一个背景多样的跨职能团队中获得更出色的见解⁴。\n\
  \n我们多元化的组织结构中蕴含着智慧。拥有营销、商业和管理背景的人值得在数据科学的讨论中占有一席之地。认为具有数量背景的关键人物会提出所有相同的问题和见解是不切实际的。让你的团队保持多样性，你就更有可能取得出色成果。\n\
  \n\n\n#### 发现不同技能的价值\n\n对数据科学团队的一个风险是过度重视数据科学家。请记住，数据科学家是多学科的。他们应该了解统计学、数学、开发和机器学习——同时还要理解客户并提出有趣的问题。大多数数据科学家来自工程、数学和统计学背景。这意味着他们很可能采用类似的提问方式，并从相似的视角看待数据。\n\
  \n一个毕生致力于数学和统计学的人，不太可能像一位毕生从事市场营销的人那样对客户有深刻洞察。在一个领域是专家，并不意味着在另一个领域也是专家。\n\n许多自称多学科的人通常拥有几项非常扎实的技能，并了解一些其他领域。如果你对很多领域都非常自信，那么你很可能存在巨大的技能缺口。这也意味着，一个只有数据科学家的团队可能会有相似的盲点，并且容易陷入群体思维。\n\
  \n防止这种情况发生的一种方法是让具有其他背景的人加入你的数据科学团队。请记住，优秀的数据科学依赖于有趣的问题。没有理由认为这些有趣的问题只能由分析数据的人提出。\n\
  \n想想你的跑鞋网站。数据分析师应该不难找出哪些网站向商店引荐了客户。假设大多数客户来自 Twitter、Google 和 Facebook。还有相当一部分客户来自其他跑鞋网站。一名优秀的数据分析师可以轻松创建一份报告，列出客户在购买前访问的排名前\
  \ 50 的网站。弄清楚客户从哪里来是一个很好的分析问题。这涉及收集数据、统计，并以一份漂亮的报告呈现出来，如图 6-1 所示。\n\n![A427825_1_En_6_Fig1_HTML.gif](img/A427825_1_En_6_Fig1_HTML.gif)\n\
  \n图 6-1.\n\n引荐网站总访问次数及引荐类型说明\n\nFacebook、Twitter 和 Instagram 在付费流量和自然流量方面似乎都带来了巨大的流量。Pinterest\
  \ 带来的流量与其他网站相当，但大约一半的流量来自付费广告。请访问 [`​ds.​tips/​fRa4a`](http://ds.tips/fRa4a) 查看如何创建这些图表。\n\
  \n数据科学团队会进行更深入的研究。团队可能会问，为什么来自 Twitter 的人比来自 Google 的多？人们是否在推特上发布鞋子的照片？如果我们在 Twitter\
  \ 上投放广告，会有多少额外的人访问网站？对于发布新产品，哪个网站更优？人们看到鞋子图片后是否更有可能访问网站？这些问题与数据本身是分离的。业务分析师、营销专家或项目经理完全有能力提出这些问题。\n\
  \n一项对经济系的研究表明，当来自不同学科的人进行合作时，他们更可能产出更高质量的出版物。意见的多样性有利于提升他们工作的数量和质量。此外，不同背景的人更可能产生分歧。分歧会促使每个人都更加努力。最终，这会使每个人的论证更加有力。如果你团队中的每个人都能随意地就最佳问题达成一致，那么你很可能没有提出足够有趣的问题。\n\
  \n当你创建数据科学团队时，试着吸纳组织中来自不同部门的许多人。你希望组织中的每个人都能思考如何以数据驱动的方式工作。如果你只为团队招聘数据科学家，你很可能让数据科学看起来像一门玄学——一种只有少数高技能人才才能尝试的东西。这会使你的数据科学缺乏创造力，并与组织的其他部分脱节。\n\
  \n在你的数据科学团队中，区分分析与洞察至关重要。数据分析师负责捕获、统计和呈现数据。而获得洞察则困难得多。你需要遵循科学方法，提出有趣的问题并寻找结果。不要让你的团队只产出数据分析。你要让他们更加努力。来自业务方的人很可能会推动团队提出更多有趣的问题。同样，来自营销团队的人也很可能会对你的客户提出有趣的问题。\n\
  \n一些组织已经开始朝这个方向转变。像 LinkedIn 这样的公司创建了数据墙，展示来自数据分析师的不同报告和图表。这些信息墙让组织中各部门的人都能看到数据中是否有有趣的东西。市场营销助理可能会发现一个有趣的故事，或者人力资源部门的实习生可能会想到一个有趣的问题。这是从组织其他部门获取反馈的好方法。\n\
  \n一些组织则更进一步，确保每个数据科学团队都有一名来自市场营销部门和项目管理部门的代表。这确保了你的数据科学团队中既有专门思考客户的人，也有理解如何向组织其他部门交付价值的人。\n\
  \n\n\n#### 建立数据科学思维\n\n在数据科学团队中，你常会听到一个术语——“数据驱动”。这个词有点微妙。我们都喜欢用数据来驱动决策。如果你决定不吃加油站卖的寿司，这基于真实数据。你利用过往经验，或许再加上一些观察，来做出明智的决定。你的直觉往往是对的——至少对了一半。尽量不要将数据驱动决策视为自身直觉的简单替代品。数据驱动文化是利用数据来增强团队的直觉，而非取而代之。\n\
  \n你的数据科学团队将成为建立更广泛数据科学思维的起点，这种思维与数据有着更紧密的关系。试着将数据驱动型企业视为拥有众多数据科学团队的公司，它们共同强化数据科学思维。这些团队营造了充满疑问和洞见的文化。他们应帮助组织不仅收集数据，更要让数据变得可操作。\n\
  \n一个数据科学团队有三个主要职责领域。这三个领域为你的数据科学团队奠定了基础，有助于组织其他成员接纳这种新思维。它们是：\n\n*   **收集、访问和报告数据（基础工作）：**\
  \ 这涉及将原始数据处理成其他人都能理解的形式。\n*   **提出好问题：** 这驱动有趣的数据实验，可能源自不一定有技术背景的团队成员。他们可能来自业务、市场或管理部门。他们提出有趣的业务问题，并推动所有人质疑自身的假设。\n\
  *   **让数据可操作：** 这将是主要负责了解团队学到了什么以及这些数据如何应用于组织的团队成员的责任。\n\n我曾在一家销售家用五金和建筑材料的零售组织工作。该公司设有多个呼叫中心，因为许多客户倾向于通过电话下单，而非使用移动应用。\n\
  \n这家公司刚开始涉足数据科学，希望数据科学团队能理解这些客户为何偏好电话下单，因为维持呼叫中心成本高昂。此外，通过电话接单出错的可能性也大得多。数据科学团队有三个人：一位懂数据的人、一位业务分析师和一位项目经理。他们三人聚在一起，试图理解这些客户为何偏好电话下单。\n\
  \n业务分析师最先开始提问：这些客户是否有通过手机下单的账户？他们是专业客户还是住宅客户？他们消费金额是多少？\n\n随后，团队创建了数据报告，如图 6-2 所示。数据显示，大多数人都是专业客户，他们经常通过移动设备下单。他们通过呼叫中心下的订单金额远小于通过移动应用下的订单。大约\
  \ 80% 的交易金额低于 20 美元。业务分析师跟进提问：“为什么我们一些最忠诚的专业客户会打电话订购不到 20 美元的商品？”\n\n![A427825_1_En_6_Fig2_HTML.gif](img/A427825_1_En_6_Fig2_HTML.gif)\n\
  \n**图 6-2.** 销售渠道数据报告\n\n注意：大部分订单由组织客户下单；然而，通过电话下单的大部分订单是由个人客户完成的。个人客户通过电话下单的平均总价值在所有类别中最低。请参阅\
  \ [`http://ds.tips/3uprU`](http://ds.tips/3uprU) 了解如何创建这些图表。\n\n在查看数据并与几位客服代表交谈后，他们发现这些客户打电话是因为需要一个小零件来解决一个大问题。当这些专业人士在工地时，客服代表就在查找那个零件。通话的大部分时间都花在描述、识别和加急处理他们所需的关键零件上。\n\
  \n团队尝试了一个实验。他们联系了一些高交易量的专业客户，请他们在需要紧急零件时发送一张图片。他们将其称为“拍照即寄”计划。他们希望这能提高客户满意度，并减少在电话中描述零件所花费的时间。\n\
  \n这个数据科学团队规模虽小，但仍然覆盖了所有三个职责领域。他们收集数据，制作了有趣的报告。业务分析师提出了有趣的问题，并对客户有了深入了解。最后，项目经理组织了一个实验，启动了一个小型试点项目。他们收集了新数据，提出了有趣的问题，并将洞察变成了可操作的行动。\n\
  \n在数据科学团队进行这些实验之前，该组织一直认为这些人是小额消费的住宅客户，他们更习惯打电话而非使用移动应用。他们的直觉只对了一部分。实际上，大多数打电话的人是他们一些最有价值的客户。一个拥有多元化团队的数据科学思维带来了更深刻的洞见。\n\
  \n#### 总结\n\n在本章中，你探讨了数据科学团队中的角色。你了解了需要具备哪些技能。你也看到了如何建立数据科学思维。在第 7 章中，你将了解如何组建你的团队。\n\
  \n**脚注**\n\n1 Cleveland, William S. “Data science: an action plan for expanding\
  \ the technical areas of the field of statistics.” *International statistical review*\
  \ 69, no. 1 (2001): 21-26.\n\n2 Breiman, Leo. “Statistical modeling: The two cultures\
  \ (with comments and a rejoinder by the author).” *Statistical Science* 16, no.\
  \ 3 (2001): 199-231.\n\n3 Kruger, Justin, and David Dunning. “Unskilled and unaware\
  \ of it: how difficulties in recognizing one’s own incompetence lead to inflated\
  \ self-assessments.” *Journal of personality and social psychology* 77.6 (1999):\
  \ 1121.\n\n4 Bosquet, Clément, and Pierre-Philippe Combes. “Do large departments\
  \ make academics more productive? Agglomeration and peer effects in research.” *Spatial\
  \ Economics Research Centre Discussion Paper*, no. 133 (2013).\n\n### 7. 组建团队\n\n\
  拥有数据科学思维既是组织挑战，也是文化挑战。这并非雇佣几个数据分析师那么简单。你希望整个组织都能以创造性和有趣的方式思考你的数据。数据分析师会帮助你分析数据，但他们可能并非新洞察的最佳来源。正如第\
  \ 6 章所述，你应该将数据科学视为一项团队努力——由背景不同的小组成员通过数据实验来创造知识。这就是数据科学中的科学方法。这是一个实证探索过程。你会提出好问题，收集证据，并尝试得出结论。\n\
  \n与其寻找几个什么都能做的人，不如与现有能做大多数事情的人合作。我认为一种行之有效的模式是将数据科学团队分解为三个角色：\n\n*   研究负责人\n*  \
  \ 数据分析师\n*   项目经理\n\n我在不同的组织中都见过这三个角色。它们的名称可能不同，但目标一致：提出好问题，收集证据，并努力获取洞见。在接下来的几节中，我们将更详细地介绍每个角色，然后讨论他们如何在团队中协作。\n\
  \n\n\n#### 跟随研究负责人提出好问题\n\n据说阿尔伯特·爱因斯坦曾说过，如果他有 1 小时来解决问题，他会花前 55 分钟寻找正确的问题。问题是发现的关键。这正是它们对数据科学团队至关重要的原因。问题是你获得新见解的最重要驱动力。数据科学中“科学”的关键部分，就是找到正确的问题。\n\
  \n你已经拥有数据。你的组织可能正在收集比你需要的更多的数据。从很多方面来看，你已经收集到了答案。现在你必须提出正确的问题。对大多数组织来说，这并非易事。我们仍在为那些渴望答案的公司工作，因为答案能结束讨论。你开完会就可以开始付诸实践。这就是组织倾向于喜欢专家型人才的原因。他们提供答案。答案是最终的、封闭的；问题则是开放的。此外，一个好问题可能会引出更多问题。\n\
  \n这就是为什么数据科学团队应该依赖一个专注于提问的人。这个人应该了解业务，但他或她也需要跳出业务本身。我听过对这个角色的最佳称谓之一是“研究负责人”。它准确地概括了这个人的主要职责：主导提问并推动研究。\n\
  \n研究负责人应该来自业务方，他/她推动团队提出有趣的问题。他/她应该从与团队合作开始，共同提出问题或识别关键难点。他/她可以把问题放在问题墙上，或者整理到便利贴上。\n\
  \n研究负责人有三个职责领域：\n\n*   识别假设\n*   驱动问题\n*   了解业务\n\n这三个领域密切相关。作为研究负责人，有时你必须跳出自身经验，像第一次见到一样去审视业务。这需要付出一些努力，你必须致力于保持全新的视角。\n\
  \n一个好的研究负责人能凭直觉敏锐地察觉到何时存在有趣的问题。杰森·斯蒂芬博士¹的经历就是如此。他是一位天体物理学家，也是一位频繁出差的旅行者。有一次，他排着长队等待登机。大多数人认为这是旅行的常态。斯蒂芬博士对飞行业务足够了解，意识到让乘客排长队既低效又成本高昂。他问了一个简单的问题：“有没有更好的登机方式？”他的科学背景帮助他想出了一个解决方案。他设想让乘客并行登机，每隔一排错开入座。这比当前让人们一个接一个排队的登机方法高效得多。（不幸的是，由于种种原因，这种做法尚未实施。）\n\
  \n斯蒂芬博士践行了一名优秀研究负责人的三个行动。他对业务有一定了解：他了解飞行。他能够质疑自己的假设：在他之前，数百万人在登机流程前都未曾多加思考。最后，他提出了一个简单的问题：还有更好的方法吗？\n\
  \n你不必成为科学家就能提出有趣的问题。研究负责人应该对业务有一些概念，但这个人不需要是专家。例如，爱德华·兰德发明宝丽来即时相机，正是源于他三岁女儿的一个问题。²当他们在新墨西哥州度假时，他用传统相机拍了张照片。他的女儿简单地问了一句：“我们为什么必须等照片出来？”他的女儿质疑了一个简单的假设。\n\
  \n这两个问题都开启了有趣的探索之路。斯蒂芬博士找到了一种让乘客登机效率提高多达 30%的方法，而爱德华·兰德创造了即时相机，这是 20 世纪最具创新性和美感的科技产品之一。\n\
  \n研究负责人这个角色最有用的一个方面，是将提问与数据分离。提出好问题本身并没有技术性。记住，爱德华·兰德的女儿只有三岁。\n\n将驱动问题的人与寻找可能答案的人分开，也大有裨益。这解决了固有的利益冲突。如果你只有一小数据集，你可能会将自己局限于简单的问题——那些你已经能用数据回答的问题。一个好的研究负责人可能会促使你重新思考收集数据的类型。最终，这会更有价值。\n\
  \n#### 与数据分析师一起呈现数据\n\n你的团队需要优秀的数据分析师。数据分析师负责理解数据、获取和清洗数据，然后以简单报告的形式呈现数据。他们应与研究负责人协作，查看报告中是否有值得注意的信息。他们还应该推荐统计方法或创建数据可视化。研究负责人和数据分析师将携手合作，构建洞察力。研究负责人专注于提出最佳问题，而数据分析师则致力于提供最佳报告。\n\
  \n围绕不同的数据职位名称存在很多混淆。有统计学家、统计分析员、数据分析师、数据科学家、数据工程师，甚至还有数学家。你甚至可以在这些头衔前任意加上“首席”或“高级”。首席统计师可能比高级数据科学家资历深得多。造成所有这些混淆的原因是这些职位的人做的事情非常相似。他们在某种程度上都在实践从数据中学习的科学；只是他们以非常不同的方式进入这个角色。\n\
  \n统计学已经存在了几百年。这门学科的发展是因为政府需要了解自己的人口和经济数据。它有着悠久而丰富的历史。美国统计协会（ASA）是美国最古老的专业学会之一。\n\
  \n另一方面，数据分析师来自计算机科学领域。他们学习如何从关系型数据库和 NoSQL 数据库中提取意义。他们专注于呈现和发现有趣的数据片段，以支持决策。\n\n\
  数据科学家被视为多学科人才。他们是数据分析师，但同时也会创建软件、处理数学问题、了解业务并提出有趣的问题。作为 Bitly 的前首席科学家，希拉里·梅森提出了一个广为人知的定义。她认为数据科学家是那些还懂数学、软件开发、工程和黑客技术的数据分析师。他们能更进一步。除了制作报告，他们还能开始探索洞察力。\n\
  \n一个数据科学团队会分解通常由一名数据科学家承担的职责。通常，要求一个人同时理解数据、业务并提出有趣的问题，这个要求太高了。一个优秀的数据科学团队需要一名也懂一点软件开发的数据分析师，而大多数数据分析师已经觉得了解软件开发是必要的。许多出色的可视化工具都需要一些软件编码。`Python`\
  \ 和 `R` 是用于探索和展示数据的两种最流行的语言。（你在第 1 章中已经了解了一些关于这些语言的知识。）\n\n在数据科学团队中，数据分析师有三个主要职责领域：准备数据、选择工具，然后呈现结果。\n\
  \n\n\n##### 准备数据与选择工具\n\n准备数据与选择工具是相辅相成的。你必须先选择工具才能准备数据。因此，作为数据分析师，大部分时间都花在数据准备上。你需要找出获取数据的最佳方式——无论是通过网络\
  \ API、从网页抓取，还是从组织不同部门收集数据——然后对数据进行清洗。清洗数据通过修正各种字段或补充缺失数据（例如，展开缩写或纠正拼写错误）来使其更具实用性。\n\
  \n##### 呈现结果\n\n数据分析师的主要挑战之一，是与研究主管协作，共同探索数据，判断是否有异常情况，并创建洞察力分析与报告。有时，丰富的数据反而会导致洞察力的贫乏。如果数据分析师向团队传递了过量的信息，实际上可能会限制每个人对信息的解读能力。\n\
  \n为避免这种情况，数据分析师需要与研究主管紧密合作，在报告中阐释各项权衡。在统计分析中，往往是你*看不到*的那些信息才对理解至关重要。有时这是有意为之；有时则并非如此。\n\
  \n假设研究主管想要查看在跑鞋网站购物的所有男性和女性的汇总数据，并按年龄段细分展示。作为数据分析师，你可能会询问年龄段的分组方式。是按每五年一组还是每十年一组？如果按每五年一组，你将得到\
  \ 18 或 19 个分组，但这些分组在中间年龄段会出现偏差，因为 18 岁以下或 90 岁以上的跑步者可能较少。\n\n报告也可能因此难以阅读。对于 20 到\
  \ 40 岁之间的人群，你无法获得所需的粒度。35 岁和 40 岁的人群之间可能存在巨大差异。如果把这个年龄段细分出来，你可能会曲解数据，使得 30 到 40\
  \ 岁之间的人数看起来更少。这就是为什么数据分析师在呈现数据时保持透明至关重要。某些决策会影响数据故事的呈现。整个团队应努力坦诚地讨论这些决策，并传达一个准确的故事，如图\
  \ 7-1 所示。\n\n![A427825_1_En_7_Fig1_HTML.gif](img/A427825_1_En_7_Fig1_HTML.gif)\n\
  \n**图 7-1. 热力图注释**\n\n观察最细粒度层级（每个年龄段作为一个单元格）的热力图以及不同年龄段分组的热力图：左侧图显示，轻量训练鞋在 18-21\
  \ 岁人群中最为流行；而动态控制、竞赛、稳定和越野鞋则在 21-65 岁人群中更受欢迎。然而，由于右侧图所示的年龄段划分不同，这些数据可能传递出截然不同的信息。在右上图中，轻量训练鞋似乎在三个年龄段分组（0-18、19-65、66-90）中同样受欢迎，但如果你观察右下图和原始热力图，会发现它显然只在\
  \ 18-21 岁人群中更受欢迎。这是因为右上图中第一个分组恰好在最受欢迎的年龄段中间进行了划分。更多关于如何创建这些图表的信息，请访问[`http://ds.tips/m2zAm`](http://ds.tips/m2zAm)。\n\
  \n所有这些决策通常由数据分析师自行裁量。然而，与研究主管共同做出这些决策，有助于整个团队更好地理解数据。\n\n#### 与项目经理保持项目正轨\n\n在数据科学团队工作中，最困难的部分之一是将洞察转化为可执行的行动。工作应当像一场持续的科学实验：你获得一点数据，研究主管提出有趣的问题，这些问题催生出更多报告，而报告通常又会引出更多问题。\n\
  \n在这种探索的旋涡中，团队需要专注于收集数据的初衷。同时，还需要有一种机制，向组织其他成员解释这些洞察。不幸的是，这意味着要开很多会，这可能会严重消耗时间。当工作性质是创造性的时候尤其如此。\n\
  \n我曾在一家拥有极具创意的数据科学团队的组织工作过。他们不断提出利用公司海量信用卡数据的新颖有趣方法。最初几个月，数据科学团队基本可以自由探索数据。最终，团队产出了一些非常有趣的洞察。随着他们的洞察越来越引人注目，组织其他部门也愈发好奇。各部门开始邀请团队成员做演示汇报。这些会议让其他团队更加感兴趣，进而导致了更多会议。几个月后，数据科学团队中有些人每周参加会议的时间高达\
  \ 20 小时。他们从数据科学实践者变成了汇报者。\n\n这些关键人物缺席数据科学团队，拖慢了其他成员的工作进度，以至于他们产出的洞察越来越少。他们花在分析数据上的时间大幅减少。而当初要求开会的那些部门又开始质问，为什么数据科学团队找不到那么多洞察了。\n\
  \n这在许多组织中是一个悖论：你的工作对组织其他人越有趣，你就花越多时间在会议上谈论你的工作，这意味着真正工作的时间就越少。\n\n打破这个循环的最佳方法是拥有一位高效的项目经理。项目经理非常擅长保护数据科学团队，避免其偏离正轨。他们可以通过代表团队参加会议来实现这一点。\n\
  \n数据科学团队中的项目经理主要负责三个领域：数据民主化（使其广泛可用）、分享成果，以及推动组织学习。项目经理扮演着双重角色：既是盾牌，也是推土机。盾牌的作用是保护团队免受过多会议的干扰，从而保持团队的工作效率；推土机的作用则是打破壁垒，获取那些被隐藏的数据。\n\
  \n##### 数据民主化\n\n当你在大型组织工作时，获取所有数据变得越来越困难。项目经理可以帮助打破这些数据孤岛，让整个组织都能受益。例如，假设你的数据科学团队想要访问存储在数据中心某个角落积灰服务器上的数据。当团队尝试访问时，发现这些数据是受限的，仅供特定部门使用。你的项目经理就负责说服该部门，让数据科学团队能够访问这些数据。\n\
  \n##### 分享成果\n\n项目经理同样负责信息的分发。他们是亲自去参加会议并展示团队成果的人。如果其他部门有人想访问团队的数据，项目经理会负责为他们提供访问权限。\n\
  \n数据民主化和成果分发是紧密相关的，这是一条双向通道：一个方向是获取组织数据，另一个方向则是向组织其他成员分享团队的洞察。每一个方向都伴随着一系列会议和挑战。\n\
  \n##### 推动组织学习\n\n项目经理的最后一项职责是推动学习——将洞察转化为可执行的行动。归根结底，团队的绩效仍然取决于组织从中学到了什么。需要有人跟进，将洞察转化为产品或变革。\n\
  \n想象一下，如果那个拥有信用卡数据的组织发现了一些有趣的现象，比如午餐时间交易数据略有增加。项目经理就会将这个洞察转化为可执行的行动。他或她可能会与基础设施部门合作，在这些时段扩容技术，或者与营销部门合作，推出午餐时间促销活动。推动这种学习需要大量时间和会议。一位优秀的项目经理通过承担这一责任，确保团队始终走在正确的轨道上。\n\
  \n\n\n#### 团队协作\n\n当团队组建完成后，全体成员将共同协作，尝试创建一个能够展示数据趋势的有趣数据模型。你们可能会发现几个不同项目之间存在强相关性，然后一起猜测导致这种相关性的原因。\n\
  \n假设你们的团队供职于一家在线杂志。每篇报道的顶部都有一个链接，方便读者将文章分享到他们的社交网络。团队中的数据分析师根据读者分享最多的文章进行排名，并准备一份报告（如图\
  \ 7-2 所示）供团队讨论研究结果。研究负责人可能会问：“是什么让这些文章如此受欢迎？它们是被阅读得最广泛还是被分享得最广泛？是否存在某些特定主题让文章更容易被分享？有没有关键短语？”\n\
  \n![A427825_1_En_7_Fig2_HTML.gif](img/A427825_1_En_7_Fig2_HTML.gif)\n\n图 7-2. 按渠道和标题统计的数量及总计\n\
  \n注意\n\n此数据由随机生成的文章标题及各渠道的分享数量构成。从图表中可以看出，尽管这些文章在分享数量上都是热门，但不同渠道的表现可能大相径庭。了解如何创建这些图表，请访问\
  \ `http://ds.tips/spu3E`。\n\n团队共同创建一个模型，以展示特定主题与该主题被分享可能性之间的相关性。团队甚至可能自行定义主题分类。研究负责人在这里至关重要，因为她最了解业务。她可能对读者有足够了解，能推测出某些主题类别。她可能是提出关键词的最佳人选，例如“抢先看”、“模糊照片”、“古怪幽默”或“谣言”等暗示科技传闻的词汇。（具有出版背景的人会提出很多有用的建议。）\n\
  \n团队甚至可以创建程序的第一版，尝试根据关键词将文章分类。数据分析师负责生成报告并开发能够识别文章主题的应用。然后，他创建一个数据模型，准确地对分享最多的文章进行分类。（这个人可能对出版不太了解，但他知道如何处理数据。）最后，团队利用预测分析，将该模型应用于未来。现在，你们拥有一个能够准确预测新文章何时会被众多读者分享的应用。\n\
  \n这时，项目经理介入，将这一新洞察转化为可执行的行动。她向其他团队传达结果，并与管理层合作改进组织。她甚至可能与市场部门合作，在那些更可能被读者高度分享的文章上投放利润最高的广告。\n\
  \n数据科学思维模式的一部分，是要认识到为了鼓励创新，你需要研究负责人和数据分析师共同合作，推动新想法。研究负责人必须提出有趣的问题，同时还要促进观点多样性。他们可能希望从组织的其他部门引入人员。\n\
  \n如果你的团队完全由数据科学家组成，很可能会缺乏重要的观点多样性。他们所受的训练和背景过于相似，更容易迅速达成共识，就像单调的齐声合唱。\n\n我曾与一所研究生院合作，他们希望通过分析过往数据来提高毕业率。结果发现，最好的点子来自一位同时也是狂热潜水爱好者的项目经理。他查看了人口统计数据，并建议采用“伙伴系统”来提高完成整个课程的学生人数。这在潜水训练中是普遍做法。没人能预先规划出他的洞察，这完全源于他的生活经验。图\
  \ 7-3 展示了一个你可以收集的关于伙伴系统的数据示例。\n\n![A427825_1_En_7_Fig3_HTML.gif](img/A427825_1_En_7_Fig3_HTML.gif)\n\
  \n图 7-3. 伙伴系统数据\n\n注意\n\n从左侧图表可以看出，如果学生参加伙伴计划，平均而言，他们在课程中坚持的时间会比没有伙伴的学生长三周。与没有伙伴的学生相比，有伙伴的学生在八周后更有可能继续坚持。了解如何创建此图表，请访问\
  \ `http://ds.tips/naF7u`。\n\n这种形式的创造性发现比大多数组织意识到的要普遍得多。事实上，专利局的一份报告显示，近一半的发现都源于简单的偶然性。团队原本在解决一个问题，而某人的洞察或经验却将他们引向了一个全新的方向。\n\
  \n注意\n\n我们将在第 8 章更详细地讨论这种工作关系。\n\n#### 本章小结\n\n在本章中，你了解到数据科学中最有效的团队模式之一包含以下角色：研究负责人、数据分析师和项目经理。研究负责人有三个职责领域：发现假设、提出问题和了解业务。数据分析师负责准备数据、选择工具并展示结果。最后，项目经理从各部门收集所需数据，然后分享团队成果并推动组织学习。在第\
  \ 8 章中，你将了解这个团队将如何开始协作。\n\n**脚注**\n\n1. Steffen, Jason H. “Optimal boarding method\
  \ for airline passengers.” *Journal of Air Transport Management* 14, no. 3 (2008):\
  \ 146-150.\n\n2. Mintzberg, Henry. “The fall and rise of strategic planning.” *Harvard\
  \ Business Review* 72, no. 1 (1994): 107-114.\n\n### 8. 启动工作\n\n现在你已经组建好团队，需要了解如何开始工作。首先，你需要明确每个团队成员的职责领域，并指出这些职责领域在哪里存在重叠。接下来需要考虑的是如何展示你的数据。数据可视化是一个能写成整本书的专题。我在此仅简要提及，并涵盖你的数据科学团队主要关注的两种报告类型：内部报告和外部报告。\n\
  \n在了解如何呈现报告之后，我将转向解释数据孤岛以及它们如何影响团队收集数据的能力。接着，我会给你一些关于如何实现数据民主化的建议。最后，我将阐述向数据科学团队提供洞察以及获得高管支持的重要性。\n\
  \n\n\n#### 定义责任领域\n\n数据科学思维模式与大多数组织的运作方式截然不同。即使是那些自称数据驱动的组织，也往往不会利用数据来创造新的洞见。相反，他们使用数据的方式就像醉汉使用路灯杆一样。¹\
  \ 他们将其视为支撑，而非照明。\n\n这对你的数据科学团队来说是一个真正的挑战。你的组织可能认为自己是以数据驱动的，但实际上他们只是在用数据来强化已知的信息。任何与这些知识相悖的内容都会被视作不良数据。\n\
  \n你的数据科学团队需要确保利用数据进行探索，这样才能避免团队陷入仅用数据来支撑已知信息的陷阱。事实上，数据科学的一大优势就在于质疑已有知识。这就像马克·吐温那句老话所说：“让我们陷入困境的不是无知，而是那些我们深信不疑却并不正确的东西。”\n\
  \n如果你的组织依赖的是那些没有数据支持的知识，你很可能会遇到麻烦。通常，这些共享的知识是正确的，但一旦出错，就会产生持久的后果。如果你的数据科学团队坚持履行其三个责任领域，就能为组织带来真正的益处。这三个领域分别是：研究、质疑和落实，下面将逐一讨论。\n\
  \n到目前为止，你已经了解了数据科学团队中的三种常见角色：提出有趣问题的研究主管、与研究主管合作产出有趣报告和洞见的数据分析师，以及使这些洞见可操作并可供组织内其他部门使用的项目经理。\n\
  \n现在，是时候将这些角色放到更大的责任领域中去审视，这样你就能了解团队是如何协作的。可以把你的团队想象成拥有不同且相互重叠的责任领域，如图 8-1 所示。\n\
  \n![A427825_1_En_8_Fig1_HTML.jpg](img/A427825_1_En_8_Fig1_HTML.jpg)\n\n图 8-1.\n\n\
  不同角色之间的重叠\n\n##### 研究\n\n让我们从数据分析师开始探讨维恩图。数据分析师的主要责任领域是研究，这是科学和数据科学的关键部分。数据分析师与研究主管合作，提出有趣的问题，研究这些问题，并通过创造性的报告或图表呈现结果。\n\
  \n数据分析师是团队的基础。他与项目经理和研究主管都紧密合作，只是合作方式不同。可以把他视为与两者都保持着独立的双向关系。他从研究主管那里获得有趣的问题作为输入，然后将结果和洞见输出给项目经理，以便她能够推动学习。\n\
  \n##### 质疑\n\n现在，让我们看看图 8-1 中的下一个圆圈。在右侧，是代表研究主管的圆圈。他们的责任领域是质疑。如果用科学方法的角度来思考，这个人就是提出有趣假设的人。\n\
  \n研究主管在自己和数据分析师之间建立了一个循环。她提出问题并获取反馈。这并非简单地给数据分析师发一封邮件问“你怎么看？”那么简单，而是一个协作过程。研究主管提出问题，数据分析师根据可用数据对这些提问提供反馈。这两个圆圈是重叠的。这是问题与研究之间的直接关系。\n\
  \n##### 落实\n\n图 8-1 中的最后一个圆圈代表项目经理。他的责任领域是落实。他需要确保团队利用数据并使之产生可操作的成果。他要确保团队将他们的洞见传达给组织内的其他部门。\n\
  \n将一个探索性的过程应用于组织知识绝非易事。在数据科学团队中，你往往不清楚哪些最可行的洞见会通向何方。团队可能会在找到一条有趣路径之前，经历 50 次死胡同。\n\
  \n尽管如此，思考这些洞见最终落实后会是什么样子，仍然很重要。\n\n这三个责任领域中的每一个，都是团队需要完成的任务蓝图的一部分。这有助于强化一个理念：你的数据科学团队致力于探索和发现。团队需要遵循数据的指引，即使它与现有知识相悖。\n\
  \n\n\n#### 呈现报告\n\n数据可视化是数据科学中最有趣的领域之一。它关乎你如何运用图形和图像来展示数据。简单的图形是传达复杂思想的最佳方式之一。在复杂思想与简洁设计之间寻求平衡，确实是一项真正的挑战。\n\
  \n大多数报告都容易走向某个极端。要么有许多漂亮图表却信息量不足，要么信息丰富的图表却丑陋难懂。优秀的可视化是数据分析师的核心职责。话虽如此，分析师应与数据科学团队紧密合作。如果你需要向研究主管解释图表，那么它对其他人来说可能就太复杂了。团队是帮助你让图表更美观、更易读的绝佳试验场。\n\
  \n关于数据可视化有很多优质资源。其中历史最悠久、最受尊敬的著作之一是爱德华·R·塔夫特所著的*《量化信息的视觉呈现》*（第二版）。在这本书中，塔夫特教授提出了“数据-墨水比率”的概念。他指出，你应该推动你的可视化，用最少的墨水传达最多的数据。他将那些无用的视觉效果，例如\
  \ 3D 阴影或渐变效果，称为“图表垃圾”。\n\n塔夫特教授帮助确立并引领了数据可视化领域的方向。他帮助建立了一种现代的数据呈现方法。\n\n另一种方法是参考科尔·努斯鲍默·克纳夫利克所著的*《用数据讲故事：面向商业专业人士的数据可视化指南》*。在她的书中，她阐述了六条关键经验。她首先指出，数据分析师应该理解自己的受众和背景；选择恰当的展示方式；消除杂乱，集中注意力；并且像设计师一样思考，以讲述引人入胜的故事。这两本书将让你很好地理解创作优质数据可视化的内涵。\n\
  \n**注**\n\n通常，数据分析师的培训中没有任何内容能帮助他们学会创建优秀的可视化。大多数研究生课程仍深深植根于数学和统计学。优秀的数据可视化依赖于美学和设计。这是一项需要后天习得的技能，可能并不容易掌握。\n\
  \n请记住，你的团队是共同探索数据的，这意味着你设计的第一轮报告大部分是为团队成员准备的。研究主管提出有趣的问题，数据分析师创建一份快速粗略的报告来探索可能的答案，然后团队可能会提出一系列全新的问题。这意味着你最初的数据可视化大多是快速的交流——更像是视觉上的闲聊，而非完整的数据报告。\n\
  \n另一方面，还有最终的数据可视化需要传达给组织的其他成员。这些可视化将经过打磨，更简洁，更容易理解。\n\n将你的第一轮可视化看作数据白板，就像大多数组织墙上的白板。它们主要用于快速的可视化，以辅助小型会议和讨论。你的第一份报告应具备那样的可读性。它可能是一个快速简单的聚类图，也可能仅仅是一个简单的线性回归图。\n\
  \n没有人会去拍下白板上的涂鸦并放入高管报告中。它只供团队内部使用。要将数据呈现从白板提升到高管报告，你必须增加清晰度和打磨细节。\n\n如果你是一名数据分析师，请记住要充分利用从团队其他成员那里获得的反馈。数据可视化就像任何设计一样。你不需要是专家也能有自己的看法。你的团队将是判断你图表是否可读和可理解的最佳途径。同时也要记住，你最好的图表将是涌现式设计的产物。从简单的报告开始，并随着时间的推移不断改进，使其更简洁、更易读。每个新版本都应澄清你所掌握的信息。你还可以通过在不增加复杂性的情况下添加信息来改进报告。\n\
  \n如果你经历几次改进的修订，你最终会得到更漂亮的报告。团队其他成员将是你达成这一目标的最佳资源。\n\n#### 理解数据孤岛与释放数据\n\n数据科学团队面临的最大挑战之一，是获取组织中的所有数据。这是项目经理的核心职责之一。她会努力获取你组织内部各个角落那些尘封已久的旧数据库服务器的访问权限。\n\
  \n在大型组织中，每个部门都有各自的数据库，并且不共享信息，这种情况并不少见。每个部门都有自己数据分析师、经理和数据库工程师。该部门的人了解自己部门的数据挑战，但对组织的其他部分知之甚少。这通常被称为数据孤岛。“孤岛”这个术语借用于农业。农民通常在又高又空的筒仓建筑中储存季节性谷物。如果你见过筒仓，你就知道它是一种独立的高大建筑。每个筒仓储存自己的谷物，而且通常与其他筒仓没有连接。组织数据也是如此。每个部门都存储着零散的数据，并且不与其他孤岛的数据混合。\n\
  \n数据孤岛的存在有其合理原因。每个部门可能有各自的监管要求或安全措施。一个数据库可能存有密码，另一个可能只是简单的产品列表。很可能密码数据库是加密且安全的，而产品数据库是开放可用的。\n\
  \n孤岛的问题是它们使得组织很难对数据有一个全局视图。我曾为一家试图将其所有数据集中到一个集群中的组织工作过。他们认为自己未能从数据中获得足够的洞察。该组织刚刚经历了一次数据治理转型，想要管控数据的控制方式。\n\
  \n当他们最终接触到这些数据时，他们才意识到有多少数据被锁在无人知晓的孤岛中。多年来，每个部门都创建了自己的流程、模式和安全规程。该组织想从这些数据中获取价值，但它们分布在公司各地不同的服务器上。要求每个人都分享他们的数据，有点像要求他们分享牙刷。项目经理参加了许多会议，进行了非常激烈的讨论。\n\
  \n不幸的是，要成为一个更加数据驱动的组织，打破这些孤岛是必要的。你会希望多个数据科学团队在一个集中的数据集群上工作。你也会希望数据科学团队之外的人能够创建基础报告和图表。\n\
  \n请记住，数据是寻找洞察和创造新组织知识的关键材料。要做到数据驱动，你需要能够自由访问数据。\n\n既然你已经了解了数据孤岛，那么该如何实现数据民主化，让尽可能多的人能够访问数据呢？你需要确保数据不再是高管和分析师之间传递的受保护资源。相反，它需要成为一种全公司范围的资源，可以被每个人操作和理解。\n\
  \n如果你是一名数据科学团队的项目经理，请记住以下几点：\n\n\n\n*   不要低估获取数据孤岛访问权限的难度。这需要很长时间，你需要在团队真正需要他们的数据之前就开始着手。\n\
  *   创建一个集中的数据集群需要组织变革。如果你没有高层的支持，你可能无法取得太大进展。你可能需要向每个部门推销集中数据集群的想法。大多数部门不会认同你的观点。他们认为如果东西没坏，为什么要花时间修理它？你可能需要引诱他们，向他们解释这样将能创建更复杂的报表或使用更新的可视化工具。\n\
  *   你需要提供对你团队报告的访问权限。如果你能展示全公司范围报告和洞察的价值，打破数据孤岛可能会更容易。一段时间后，你将更容易论证共享数据就像任何其他共享资源一样。整体将大于部分之和。\n\
  \n尽最大努力保护数据科学团队免受数据孤岛会议的影响。你希望他们专注于探索和发现。而你则致力于提升他们的使用率和访问权限。\n\n#### 在数据科学团队中创建洞察循环\n\
  \n许多组织专注于监控每个团队的里程碑。管理者关注团队的合规性，他们的大部分精力都投入到计划中。他们制定季度预算并密切监控。他们寻找成本或进度偏差。如果发现变化，他们会迅速追查，然后向高管报告。这类组织是为监控和合规而构建的。如果你身处这类组织，请思考一下你的会议。很可能，你正在做的事情是制定计划或演示计划、与其他团队协调、请求增加预算，或者因为进度落后而请求延期。\n\
  \n这种方式并不适合数据科学团队。请记住，你的团队的工作是探索性的。团队成员提出问题、创建理论，然后进行实验。\n\n当然，有些公司习惯于与科学家合作，例如制药或高科技公司。这类公司已经进行实验多年。但对于大多数公司来说，探索性工作是一个新概念。拥有一个创造新知识的数据科学团队似乎并不自然。在这些公司中，你必须特别小心团队的运作方式。存在将业务与技术分离的制度压力，以及确保由合规经理（通常是项目经理或总监）来管理团队的强大推动力。实施这些结构可能会减缓发现的步伐。\n\
  \n我曾为一家组织工作，该组织不允许研究负责人与数据团队紧密合作。他们认为，数据分析师的工作是提出最佳见解，然后业务经理只需在月度演示中查看这些想法即可。\n\n\
  业务经理有自己的预算，与数据团队分开。业务经理对发现洞察不感兴趣。她只确保她的团队不超支。在她的预算中，并没有雇佣一个全职研究负责人的位置。数据科学团队还没来得及开始探索就停止了。\n\
  \n我看到另一家公司试图用项目经理来监控数据科学团队的里程碑。他试图创建不同的方法来衡量团队的进展。他创建了用于提出问题的任务，然后衡量团队完成这些任务的情况。这效果不佳，因为大多数问题只会引出更多问题。当团队的里程碑不断延期时，项目经理并不高兴。他的动力是尽快“完成”这些问题，而这与数据科学团队的需求背道而驰。\n\
  \n当你在数据科学团队中时，请尝试注意这些制度压力。大多数组织都很难接受一个不容易被衡量或控制的数据科学团队。设定目标或创造投资回报率是很困难的。\n\n努力确保你的团队不会被拉入这些合规结构中。相反，要确保团队创建一个反馈循环。每个人都应该一起工作，去质疑、研究和学习。\n\
  \n数据科学团队中的每个人都有自己的关注领域，但他们仍然在紧密的反馈循环中共同工作。例如，当研究负责人和数据分析师探索数据时，项目经理会参与其中，而数据分析师可能会给项目经理一些关于获取另一个团队数据访问权限的好建议。当每个人都参与时，团队总会做得更好。当你探索时，对一个问题投入的关注越多，就越有可能获得伟大的洞察。\n\
  \n另外，请确保你的数据科学团队获得高管级别的支持。没有这一点，你几乎肯定会被拉回常见的控制策略中。这并不容易，但如果你有高管支持，并能在团队内创建紧密的反馈循环，你将更容易取得发现。如果这些组织变革需要很长时间，不要灰心。第一步是理解数据科学的目的，以及它如何适应这些长期存在的组织结构之外。\n\
  \n#### 总结\n\n在本章中，你探讨了每个团队成员的责任领域。然后，你看到了这些责任领域在哪些地方重叠。你还学到了一些关于如何呈现数据（数据可视化）的知识，以及内部报告和外部报告之间的区别。接着，你了解了数据孤岛以及它们如何影响你的团队收集数据的能力。然后，你获得了一些关于如何使数据民主化的建议。最后，你学习了为数据科学团队提供透明度的重要性，以及这如何有助于获得高管支持。在第\
  \ 9 章中，你将了解如何让你的团队像数据科学团队一样思考。\n\n脚注 1\n\n这句话常被认为出自苏格兰小说家兼民俗学家安德鲁·朗（Andrew Lang）。\n\
  \n2\n\nTufte, Edward R., and P. R. Graves-Morris. The visual display of quantitative\
  \ information. Vol. 2, no. 9\\. Cheshire, CT: Graphics press, 1983.\n\n3\n\nKnaflic,\
  \ Cole Nussbaumer. Storytelling with Data: A Data Visualization Guide for Business\
  \ Professionals. John Wiley & Sons, 2015.\n\n### 9. 像数据科学团队一样思考\n\n既然你已经知道如何构建你的团队并划分了责任领域，你如何确保你的数据科学团队像一个团队一样思考？在本章中，我将通过审视一些常见的方法来帮助你让团队保持正轨。首先，我将介绍如何通过提出有趣的问题来避免只报告而不推理。接下来，我将探讨如何为你的整个团队找到正确的心态。最后，你将了解如何理解数据，并获得一些关于如何摆脱团队僵局的技巧。\n\
  \n\n\n#### 避免无据报告\n\n如果你不熟悉统计学，芝加哥大学前公共政策教授查尔斯·惠伦（Charles Wheelan）所著的*《妙趣横生统计学：剥去数据恐惧的外衣》*¹是一本绝佳的入门读物。这本书读来妙趣横生，是对统计分析的上佳介绍。书中，他详细讲述了利用报告草率得出结论的危险。\n\
  \n只要你知道该留意什么，就能发现草率结论无处不在。网络新闻网站就是其中之一。惠伦教授设想了一个网站，上面有一则引人注目的标题：“工作中频繁短休者罹患癌症风险显著更高”。听起来相当吓人。根据这项涵盖\
  \ 36,000 名工人的研究，那些自称每天多次休息十分钟的工人，在未来五年内患癌的可能性高出 41%。而从不短休的工人则健康得多，如图 9-1 所示。\n\n\
  ![A427825_1_En_9_Fig1_HTML.gif](img/A427825_1_En_9_Fig1_HTML.gif)\n\n*图 9-1. 频繁短休者更易患癌*\n\
  \n如果只看那些每天休息三次及以上的人，他们患癌概率的确高出约 43%。然而，95.1%的人每天只休息两次。具体图表生成方法可参见[`http://ds.tips/Sp4ye`](http://ds.tips/Sp4ye)。\n\
  \n一个草率的数据科学团队可能会将此报告给整个组织，公司甚至可能采取极端措施，比如锁上大门以确保“所有人安全”。这看似极端，但实际情况远比想象中普遍。\n\n\
  一个负责任的数据科学团队绝不会从这种报告中得出结论。相反，研究主管会用它来驱动有趣的提问：为什么离开办公桌会如此致命？那些每天休息十分钟的人是谁？从不短休的人为什么健康得多？\n\
  \n研究主管可能需要通过与熟悉这些工人的人交谈来探究这些问题。也许有人能识别出这种行为模式。\n\n如果你曾在办公室工作过，你可能会意识到，那些一天站起来多次、每次十分钟的人，很可能是去外面吸烟。请记住，相关性并不等同于因果性。在这个案例中，问题的根源在于这些工人是频繁吸烟者。他们每十分钟站起来一次只是附带现象，真正危险的是吸烟。\n\
  \n在你的数据科学团队工作中，请记住，防范草率报告的最佳方法是与研究主管合作，提出有趣的问题。要明白，得出结论很容易，而探索和推理才困难——它们将是你获得最深刻见解的源泉。\n\
  \n研究主管和数据分析师之间应保持一种良性的紧张关系。数据分析师寻找数据以得出结论，而研究主管则不断提出更深层的问题。数据分析师提交报告，研究主管则检验报告中的薄弱环节。最终，这将有助于产生更有力的分析。\n\
  \n草率推理的问题远比表面看起来严重。前面的例子只是虚构的网络标题，但现实有时会更危险。20 世纪 90 年代，医生发现服用雌激素补充剂的女性患心脏病的风险降低了三分之一。一项涉及\
  \ 12.2 万名女性的大规模研究表明，雌激素补充剂与心脏病发作之间存在负相关。许多医生由此得出结论：雌激素具有保护作用，可能有益于女性健康。²\n\n到 2001\
  \ 年，已有 1500 万女性服用雌激素补充剂（即俗称的激素替代疗法）。此时，奇怪的事情发生了。医生开始注意到，接受激素替代疗法的女性中风、心脏病和乳腺癌的风险显著更高。\n\
  \n多年后，医生们开始仔细审视最初的研究发现。许多人得出结论：在最初的研究中，那些看似更健康的女性有外部因素的加持——她们更富有、更注重健康、也更可能获得优质医疗。雌激素并非她们健康状况良好的可能原因。这一数据至今仍存在争议。但公认的一点是，这种草率的分析导致了成千上万女性的死亡。\n\
  \n防范草率推理的最佳方法，便是维持研究主管与数据分析师之间那种创造性的紧张关系。如果你不问对问题，就更容易得出错误结论。\n\n#### 树立正确思维\n\n\
  你已经见识了草率报告的危险。现在，让我们思考如何树立正确的思维。许多组织认为数据科学只是一项分析技能，认为只需一群分析师在房间里报告数字即可。这些数字被视为真理，因为数字不会说谎——但数字确实会说谎。在第\
  \ 4 章中，你看到了统计数字讲述错误故事的例子：两位政客基于相同数字得出截然不同的结论。研究可能得出虚假结论，人们可能误读数据，其叙事也可能不完整。\n\n\
  你已经知道，提问是防范草率结论的最佳方法。那么，如何提出更好的问题呢？要做到这一点，你需要树立正确的思维。好消息是，过去几年里，这一领域已有大量研究成果。多个学科相互融合，以更好地理解人类的思维模式。计算机工程师将这些知识应用于机器学习和人工智能。\n\
  \n研究发现，分析性思维未必能很好地服务于数据科学。报告和数据只是第一步，下一步是概念性思维——审视数据并将其与自身直觉相结合的能力。概念性思维能帮助团队确定问题的聚焦方向。\n\
  \n有一本关于此主题的趣味书籍叫*《全新思维：右脑思维者将统治未来》*，作者是丹尼尔·平克。³ 书中，他认为我们正处在信息时代的末期，仅仅专注于数字和报告已无太大价值。真正的价值将来自我们创造的知识。他称之为“概念时代”。\n\
  \n数据科学正处在这个概念时代的最前沿。总有一天，分析工具会变得足够简单，让更多人能够接触数据。很快，用户就能使用像`WordPress`或微软`LinkedIn`那样易于上手的数据科学工具。这将使更多人获取到有趣的信息。\n\
  \n目前，数据科学团队既要负责数据本身，也要负责其底层概念——这在很多方面要困难得多。团队必须以分析技能为起点，再运用一整套全新的概念技能。在丹尼尔·平克的书中，他详细阐述了其中几种技能，并将其称为“概念时代的感官”。我将这些感官提炼为三个团队价值观。这些价值观应能帮助你的团队在概念层面思考数据。\n\
  \n##### 讲述故事，而非罗列报告\n\n第一个价值观是：讲述故事，而非罗列报告。你的数据科学团队应致力于讲述数据背后的有趣故事。你应该呈现一个引人入胜的叙事。通常情况下，你的数据会被解读，这意味着可能存在不止一个故事。如果你能构思一个有趣的故事，那么提出问题的难度就会降低。\n\
  \n将数据视为剧本中的角色。思考他们为何选择做这件事而非那件事，然后针对他们的行为提出疑问。\n\n\n\n##### 交响胜过细节\n\n第二项价值观是交响胜过细节。参与信息时代的最佳方式之一曾是专业化。这在企业的招聘方式中可见一斑——例如，数据库工程师通常只专精于少数几个平台。而在你的数据科学团队中，需要摆脱这种专业化。你希望团队通过整合多个不同的故事，描绘出更宏大的图景，从而创造出交响乐般的效果。\n\
  \n你在之前的几个例子中已经看到过这一点：从吸烟员工离开工位的行为洞察全局，以及理解客户为何在年初购买跑鞋。这些故事要求你引入多种不同类型的数据，以获得更深刻的理解。\n\
  \n##### 共情胜过确定性\n\n最后一项价值观是共情胜过确定性。了解人们的动机是提出数据相关问题的绝佳方式之一。你的数据科学团队需要理解客户在想什么，以及什么对他们而言是重要的。请记住，数据科学可以分析数百万人的行为。如果你的团队能够理解他们的动机，就能提出更有趣的问题。\n\
  \n请务必牢记，你的数据科学团队必须运用一套全新的技能才能取得成功。要提出好问题，你必须进行概念性思考。尝试将这些团队价值观作为一种提醒，让你铭记数据科学并非简单的报告。你的团队需要使用概念性技能来提出好问题，并创造组织知识。\n\
  \n#### 深入理解“意义建构”\n\n正如你所见，团队拥有正确的心态至关重要。你的团队应该对数据进行概念性思考。这并非易事。请记住，大多数数据分析师出身于数学或统计学领域，而这些领域往往依赖于结构化的指标。\n\
  \n概念性思考通常需要一种叙事风格，这更具创造性和艺术性。许多数据分析师需要依赖自身的能力，而非仅凭所受的训练。一旦每个人都具备了正确的心态，他们就可以开始专注于意义建构。意义建构是数据科学的关键组成部分。\n\
  \n我们都在以某种方式进行意义建构。当你度假归来，面对收件箱里堆积如山的邮件时，你可能会不知所措。你可能会决定创建标有“重要”、“旧邮件”或“通知”的子文件夹，或者你可能会决定按发件人对所有邮件进行排序。\n\
  \n每个人处理数据的方式可能不同。对于团队而言，对数据形成共识就更加困难。每个人都有自己的意义建构技巧。这些看法可能并不重叠。对一个人有意义的事情，在另一个人看来可能像是浪费时间。\n\
  \n意义建构对数据科学团队来说可能是一个巨大的挑战。这些团队试图理解非常庞大的数据集，而信息量可能令人望而生畏。这可能导致团队冻结，即团队因为数据太多而不知从何下手。如果你不在团队中，可能很难察觉到团队何时陷入冻结。\n\
  \n我曾在一家试图理解一个庞大新数据集的公司工作过。该公司原本收集了适度的数据，随后从一家外部公司购买了大型数据集。他们希望将现有数据与这些更大的数据集关联起来，从而更好地了解客户。在另一家公司的帮助下，他们迅速将这些新数据集导入到自己的集群中。问题在于，数据科学团队不知从何开始。他们在意义建构上陷入了困境。他们冻结了，只是制作一些报告来展示他们拥有多少数据。\n\
  \n他们冻结了好几个月。每次开业务会议时，团队只是展示更精美的数据报告——关于数据本身的数据。他们购买了昂贵的可视化工具，并制作了出色的图表。但最终，他们没有提出任何有趣的问题。\n\
  \n如果你身处数据科学团队，请留意你可能正在与意义建构作斗争的迹象。如果每个人都专注于工具，这可能表明你的团队被数据压垮了。警惕那些取代了数据科学的空洞展示。\n\
  \n渡过数据冻结的一种方法是，用数据寻找更多乐趣。你可以提出一些看似没有价值的荒谬问题。尝试提出一些问题，看看某人是个“狗派”还是“猫派”。也许可以试着仅凭某人的购买记录来猜测他的身高。请记住，问题往往会引出更多问题。亲自动手处理数据并与之互动，通常足以让你起步。你们团队的许多发现将来自意外之喜，这意味着你与数据互动得越多，就越有可能发现有趣的东西。\n\
  \n不要害怕摆弄数据（但在团队之外不要这么说）。在团队内部，可以随意抛出问题，直到某个问题引起共鸣。实验和玩耍之间往往只有一线之隔。你越是深入数据，就越能感受到一些有趣问题的存在。\n\
  \n试着理解团队中的每个成员可能以不同的方式处理数据。这是意义建构的关键部分。你应该明确指出这一挑战，并寻找让团队对数据形成共识的方法。识别团队何时陷入冻结也同样重要。许多数据科学团队在创建报告时，会陷入对工具的过度关注而停滞不前。最后，记得要享受乐趣。通过摆弄数据，你可能会获得一些最佳的洞察。\n\
  \n#### 本章小结\n\n在本章中，你学到了一些让团队保持正轨的常用方法。这些方法包括如何通过确保团队提出有趣的问题，来防止他们陷入无推理的报告。你还了解了如何培养正确的数据科学心态。团队需要通过概念性思考和学习讲故事来理解数据的意义。在第十章中，你将了解如何在构建数据科学团队时避免陷阱。\n\
