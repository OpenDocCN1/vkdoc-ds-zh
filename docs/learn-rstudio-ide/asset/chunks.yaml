- fmt: "### User Interface\n\nThe user interface is contained in the `ui` object coded\
    \ in the `\"app.R\"` file that was created for us. The code that creates the `ui`\
    \ object is located toward the top of the `app.R` file:\n\n```\nui <- fluidPage(\n\
    \  # Application title\n  titlePanel(\"Old Faithful Geyser Data\"),\n  \n  # Sidebar\
    \ with a slider input for number of bins\n  sidebarLayout(\n    sidebarPanel(\n\
    \      sliderInput(\"bins\",\n                  \"Number of bins:\",\n       \
    \           min = 1,\n                  max = 50,\n                  value = 30)\n\
    \    ),\n    \n    # Show a plot of the generated distribution\n    mainPanel(\n\
    \      plotOutput(\"distPlot\")\n    )\n  )\n)\n```\n\nThis entire block of code\
    \ is only one function `fluidPage` that is called with a comma-separated list\
    \ of two parameters `titlePanel` and `sidebarLayout`. The results of this function\
    \ are assigned to the `ui` object. This `ui` object will be used toward the end\
    \ of this file as a parameter to the function that starts the Shiny app.\n\nTake\
    \ a moment to slow down and really look at the code above. This is probably not\
    \ how you are used to writing code. The words used for the function names suggest\
    \ what is happening. If you think about it, you might expect that we will be looking\
    \ at a page that contains a title followed by something more complicated (ignore\
    \ that for now). You can clearly see where we are getting the title \"Old Faithful\
    \ Geyser Data\" that we first saw in Figure [9-3](#478254_1_En_9_Chapter.xhtml#Fig3).\n\
    \nThe essential process to building the Shiny front end is here. If you wanted\
    \ to add something to the app, you would include a new function call in the comma-separated\
    \ list. For instance, if I wanted to add a HTML paragraph to explain what Old\
    \ Faithful was, I could add the `p` function to the space right after the `titlePanel`.\n\
    \n```\n# Define UI for application that draws a histogram\nui <- fluidPage(\n\
    \  # Application title\n  titlePanel(\"Old Faithful Geyser Data\"),\n  p(\"Old\
    \ Faithful is a cone geyser located in Yellowstone National Park in Wyoming, United\
    \ States. It was named in 1870 during the Washburn-Langford-Doane Expedition.\
    \ Wikipedia 2019.\"),\n```\n\nThe result would be the web app that you can see\
    \ in Figure [9-4](#478254_1_En_9_Chapter.xhtml#Fig4). It is essentially the same\
    \ app, but now it includes some text context.\n\n![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig4_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig4_HTML.jpg)\n\
    \n*Figure 9-4: Adding a paragraph to a Shiny app*\n\nAs you build out your app,\
    \ you will continue to add pieces into the page. Some functions are simple HTML\
    \ components like the `p` function, and some are specific to Shiny. Often, you\
    \ will find objects nested within other objects in order to define a layout for\
    \ the app.\n\nYou can see this in `sidebarLayout`, an object in the overall `fluidPage`\
    \ that is in turn composed of two other objects that appear as parameters in a\
    \ comma-separated list.\n\n```\n# Sidebar with a slider input for number of bins\n\
    sidebarLayout(\n  sidebarPanel(\n    sliderInput(\"bins\",\n                \"\
    Number of bins:\",\n                min = 1,\n                max = 50,\n    \
    \            value = 30)\n  ),\n  \n  # Show a plot of the generated distribution\n\
    \  mainPanel(\n    plotOutput(\"distPlot\")\n  )\n)\n```\n\nThe two components\
    \ above are `sidebarPanel` and `mainPanel`. `sidebarPanel` contains yet another\
    \ nested object, `sliderInput`, that defines the slider that the user will use\
    \ to control the visualization. The very first parameter value `bins` is called\
    \ an `inputID` and is used to identify the component on the `server` backend of\
    \ the web app.\n\n`mainPanel` contains `plotOutput` which is the object that is\
    \ presenting the graphic. In `plotOutput` the parameter is highlighted because\
    \ this is going to be used as the `inputID` so that the `server` component can\
    \ identify this object.\n\nTo conclude, the `ui` object now contains objects that\
    \ display a title, a paragraph, a slider control, a plot, and other objects to\
    \ enforce a layout. Two of the objects, the slider and the plot, also have `inputID`\
    \ parameters so that the server will be able to retrieve values from the slider\
    \ and know where to present the graphic.\n\n### Server\n\nThe server component\
    \ takes care of the heavy lifting on the backend. In this example, server will\
    \ gather the parameters that the user defined on the user interface to run R code\
    \ that will do the analysis and create the plot. `inputID` is used to identify\
    \ both the input and the output components. Here is the server code with the input\
    \ and outputs highlighted.\n\n```\n# Define server logic required to draw a histogram\n\
    server <- function(input, output) {\n  output$distPlot <- renderPlot({\n    #\
    \ generate bins based on input$bins from ui.R\n    x    <- faithful[, 2]\n   \
    \ bins <- seq(min(x), max(x),\n                length.out = input$bins + 1)\n\
    \    \n    # draw the histogram with the specified\n    # number of bins\n   \
    \ hist(x, breaks = bins,\n         col = 'darkgray',\n         border = 'white')\n\
    \  })\n}\n```\n\nIn the code above, we are assigning an anonymous function to\
    \ the server object. These functions are a little bit different than what we did\
    \ in the user interface above. In the user interface, we simply assigned the results\
    \ of a function call to the `ui` object while here we are assigning a set of instructions\
    \ in the form of an anonymous function to the `server` object. These instructions\
    \ will be used to respond to the activity in the user interface.\n\nThe code in\
    \ bold are the hooks where the server connects to the user interface. Everything\
    \ is referenced in the anonymous function's `input` and `output` parameters. `input`\
    \ contains references to every input component in the user interface, while `output`\
    \ contains references to every output component in the user interface.\n\nYou\
    \ reference an `input` component using the `input` object followed by a dollar\
    \ sign and the `inputID` of the `input` object `input$bins`. If you remember,\
    \ \"bins\" was the identifier given to the slider object. `input$bins` will return\
    \ the current value that the user has chosen.\n\nThe output object here is getting\
    \ all the code that is generated by the `renderPlot` function above. You can see\
    \ that we reference this output component in a similar way using the function's\
    \ parameters `output$distPlot`. You can see the mechanics of how the user input\
    \ is gathered and the plot displayed in the lines of code contained in the `renderPlot`\
    \ function.\n\n### App\n\nThere is one more thing that has to happen before Shiny\
    \ can create the web app. We need to associate the `ui` and `server` components\
    \ and then launch them with this code `shinyApp(ui = ui, server = server)`.\n\n\
    This is included as boilerplate code and you may not have to touch this code at\
    \ all unless you change the name of the user interface and server objects. But,\
    \ it's worth knowing where this code is located and that this code launches the\
    \ app instance."
  raw: '### User Interface


    The user interface is contained in the `ui` object coded in the “app.R” file that
    was created for us. The code that creates the `ui` object is located toward the
    top of the app.R file:


    ```

    ui <- fluidPage(

    # Application title

    titlePanel("Old Faithful Geyser Data"),

    # Sidebar with a slider input for number of bins

    sidebarLayout(

    sidebarPanel(

    sliderInput("bins",

    "Number of bins:",

    min = 1,

    max = 50,

    value = 30)

    ),

    # Show a plot of the generated distribution

    mainPanel(

    plotOutput("distPlot")

    )

    )

    )

    ```


    This entire block of code is only one function `fluidPage` that is called with
    a comma-separated list of two parameters `titlePanel` and `sidebarLayout`. The
    results of this function are assigned to the `ui` object. This `ui` object will
    be used toward the end of this file as a parameter to the function that starts
    the Shiny app.


    Take a moment to slow down and really look at the code above. This is probably
    not how you are used to writing code. The words used for the function names suggest
    what is happening. If you think about it, you might expect that we will be looking
    at a page that contains a title followed by something more complicated (ignore
    that for now). You can clearly see where we are getting the title “Old Faithful
    Geyser Data” that we first saw in Figure [9-3](#478254_1_En_9_Chapter.xhtml#Fig3).


    The essential process to building the Shiny front end is here. If you wanted to
    add something to the app, you would include a new function call in the comma-separated
    list. For instance, if I wanted to add a HTML paragraph to explain what Old Faithful
    was, I could add the `p` function to the space right after the `titlePanel`.


    ```

    # Define UI for application that draws a histogram

    ui <- fluidPage(

    # Application title

    titlePanel("Old Faithful Geyser Data"),

    p("Old Faithful is a cone geyser located in Yellowstone National Park in Wyoming,
    United States. It was named in 1870 during the Washburn-Langford-Doane Expedition.
    Wikipedia 2019."),

    ```


    The result would be the web app that you can see in Figure [9-4](#478254_1_En_9_Chapter.xhtml#Fig4).
    It is essentially the same app, but now it includes some text context.


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig4_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Adding a paragraph to a Shiny app


    As you build out your app, you will continue to add pieces into the page. Some
    functions are simple HTML components like the `p` function, and some are specific
    to Shiny. Often, you will find objects nested within other objects in order to
    define a layout for the app.


    You can see this in `sidebarLayout`, an object in the overall `fluidPage` that
    is in turn composed of two other objects that appear as parameters in a comma-separated
    list.


    ```

    # Sidebar with a slider input for number of bins

    sidebarLayout(

    sidebarPanel(

    sliderInput("bins",

    "Number of bins:",

    min = 1,

    max = 50,

    value = 30)

    ),

    # Show a plot of the generated distribution

    mainPanel(

    plotOutput("distPlot")

    )

    )

    ```


    The two components above are `sidebarPanel` and `mainPanel`. `sidebarPanel` contains
    yet another nested object, `sliderInput`, that defines the slider that the user
    will use to control the visualization. The very first parameter value `bins` is
    called an `inputID` and is used to identify the component on the `server` backend
    of the web app.


    `mainPanel` contains `plotOutput` which is the object that is presenting the graphic.
    In `plotOutput` the parameter is highlighted because this is going to be used
    as the `inputID` so that the `server` component can identify this object.


    To conclude, the `ui` object now contains objects that display a title, a paragraph,
    a slider control, a plot, and other objects to enforce a layout. Two of the objects,
    the slider and the plot, also have `inputID` parameters so that the server will
    be able to retrieve values from the slider and know where to present the graphic.


    ### Server


    The server component takes care of the heavy lifting on the backend. In this example,
    server will gather the parameters that the user defined on the user interface
    to run R code that will do the analysis and create the plot. `inputID` is used
    to identify both the input and the output components. Here is the server code
    with the input and outputs highlighted.


    ```

    # Define server logic required to draw a histogram

    server <- function(input, output) {

    output$distPlot <- renderPlot({

    # generate bins based on input$bins from ui.R

    x    <- faithful[, 2]

    bins <- seq(min(x), max(x),

    length.out = input$bins + 1)

    # draw the histogram with the specified

    # number of bins

    hist(x, breaks = bins,

    col = ''darkgray'',

    border = ''white'')

    })

    }

    ```


    In the code above, we are assigning an anonymous function to the server object.
    These functions are a little bit different than what we did in the user interface
    above. In the user interface, we simply assigned the results of a function call
    to the `ui` object while here we are assigning a set of instructions in the form
    of an anonymous function to the `server` object. These instructions will be used
    to respond to the activity in the user interface.


    The code in bold are the hooks where the server connects to the user interface.
    Everything is referenced in the anonymous function’s `input` and `output` parameters.
    `input` contains references to every input component in the user interface, while
    `output` contains references to every output component in the user interface.


    You reference an `input` component using the `input` object followed by a dollar
    sign and the `inputID` of the `input` object `input$bins`. If you remember, “bins”
    was the identifier given to the slider object. `input$bins` will return the current
    value that the user has chosen.


    The output object here is getting all the code that is generated by the `renderPlot`
    function above. You can see that we reference this output component in a similar
    way using the function’s parameters `output$distPlot`. You can see the mechanics
    of how the user input is gathered and the plot displayed in the lines of code
    contained in the `renderPlot` function .


    ### App


    There is one more thing that has to happen before Shiny can create the web app.
    We need to associate the `ui` and `server` components and then launch them with
    this code `shinyApp(ui = ui, server = server)`.


    This is included as boilerplate code and you may not have to touch this code at
    all unless you change the name of the user interface and server objects. But,
    it’s worth knowing where this code is located and that this code launches the
    app instance.'
  trans: "\n### 用户界面\n\n用户界面包含在为我们创建的`\"app.R\"`文件中编码的`ui`对象中。创建`ui`对象的代码位于`app.R`文件的顶部：\n\
    \n```\nui <- fluidPage(\n  # 应用标题\n  titlePanel(\"老忠实泉数据\"),\n  \n  # 用于设置分组数滑块输入的侧边栏\n\
    \  sidebarLayout(\n    sidebarPanel(\n      sliderInput(\"bins\",\n          \
    \        \"分组数：\",\n                  min = 1,\n                  max = 50,\n\
    \                  value = 30)\n    ),\n    \n    # 显示生成的分布图\n    mainPanel(\n\
    \      plotOutput(\"distPlot\")\n    )\n  )\n)\n```\n\n这整段代码只是一个名为`fluidPage`的函数，它以逗号分隔的列表形式调用了两个参数`titlePanel`和`sidebarLayout`。该函数的结果被赋值给`ui`对象。这个`ui`对象将在文件末尾作为启动\
    \ Shiny 应用的函数的参数使用。\n\n花点时间放慢节奏，仔细观察上面的代码。这可能不是你习惯的编码方式。函数名称所用的词汇暗示了正在发生的事情。如果仔细想想，你可能会预期我们会看到这样一个页面：它包含一个标题，后面跟着更复杂的内容（暂时忽略这一点）。你可以清楚地看到我们是从哪里获取首次在图\
    \ 9-3 中看到的标题“老忠实泉数据”。\n\n构建 Shiny 前端的核心过程就在于此。如果你想向应用添加内容，只需在逗号分隔的列表中包含一个新的函数调用即可。例如，如果想添加一个\
    \ HTML 段落来解释老忠实泉是什么，我可以在`titlePanel`之后的位置添加`p`函数。\n\n```\n# 定义用于绘制直方图的应用 UI\n\
    ui <- fluidPage(\n  # 应用标题\n  titlePanel(\"老忠实泉数据\"),\n  p(\"老忠实泉是一座锥形间歇泉，位于美国怀俄明州的黄石国家公园。它于\
    \ 1870 年在沃什伯恩-朗福德-多恩探险队期间被命名。维基百科 2019。\"),\n```\n\n结果就是你在图 9-4 中看到的网页应用。它本质上与之前的应用相同，但现在包含了一些文本上下文信息。\n\
    \n![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig4_HTML.jpg](img/478254_1_En_9_Fig4_HTML.jpg)\n\
    \n*图 9-4：向 Shiny 应用添加一个段落*\n\n在构建应用的过程中，你会不断向页面添加内容。有些函数是简单的 HTML 组件，比如`p`函数，有些则是\
    \ Shiny 特有的。你经常会发现对象嵌套在其他对象中，以便为应用定义布局。\n\n这一点你可以在`sidebarLayout`中看到，它是整个`fluidPage`中的一个对象，而该对象本身又由另外两个对象组成，这两个对象以逗号分隔列表的形式作为参数出现。\n\
    \n```\n# 用于设置分组数滑块输入的侧边栏\nsidebarLayout(\n  sidebarPanel(\n    sliderInput(\"\
    bins\",\n                \"分组数：\",\n                min = 1,\n               \
    \ max = 50,\n                value = 30)\n  ),\n  \n  # 显示生成的分布图\n  mainPanel(\n\
    \    plotOutput(\"distPlot\")\n  )\n)\n```\n\n上述两个组件是`sidebarPanel`和`mainPanel`。`sidebarPanel`包含了另一个嵌套对象`sliderInput`，该对象定义了用户将用来控制可视化的滑块。第一个参数值`bins`被称为`inputID`，用于在网页应用的`server`后端标识该组件。\n\
    \n`mainPanel`包含`plotOutput`，这是呈现图形的对象。在`plotOutput`中，该参数被突出显示，因为它将被用作`inputID`，以便`server`组件能够识别此对象。\n\
    \n总之，`ui`对象现在包含了显示标题、段落、滑块控件、图形以及用于实现布局的其他对象的组件。其中两个对象，即滑块和图形，还带有`inputID`参数，这样服务器就能从滑块获取值，并知道在哪里呈现图形。\n\
    \n### 服务器\n\n服务器组件负责后端繁重的工作。在这个例子中，服务器将收集用户在用户界面上定义的参数，以运行 R 代码进行分析并创建图形。`inputID`用于标识输入和输出组件。以下是服务器代码，其中输入和输出部分已突出显示。\n\
    \n```\n# 定义绘制直方图所需的服务器逻辑\nserver <- function(input, output) {\n  output$distPlot\
    \ <- renderPlot({\n    # 根据 ui.R 中的 input$bins 生成分组\n    x    <- faithful[, 2]\n\
    \    bins <- seq(min(x), max(x),\n                length.out = input$bins + 1)\n\
    \    \n    # 使用指定的分组数绘制直方图\n    hist(x, breaks = bins,\n         col = 'darkgray',\n\
    \         border = 'white')\n  })\n}\n```\n\n在上面的代码中，我们正在为`server`对象赋值一个匿名函数。这些函数与我们在用户界面中所做的稍有不同。在用户界面中，我们简单地将函数调用的结果赋值给`ui`对象，而在这里，我们是将一组以匿名函数形式存在的指令赋值给`server`对象。这些指令将用于响应用户界面中的活动。\n\
    \n代码中突出的部分就是服务器连接到用户界面的连接点。所有内容都通过匿名函数的`input`和`output`参数来引用。`input`包含对用户界面中每个输入组件的引用，而`output`包含对用户界面中每个输出组件的引用。\n\
    \n你可以使用`input`对象后跟美元符号和`input`对象的`inputID`来引用一个`input`组件，例如`input$bins`。如果你还记得，\"\
    bins\"是赋予滑块对象的标识符。`input$bins`将返回用户当前选择的值。\n\n这里的输出对象正在获取上面`renderPlot`函数生成的所有代码。你可以看到，我们使用类似的方式，通过函数的参数`output$distPlot`来引用这个输出组件。你可以从`renderPlot`函数中包含的代码行中了解用户输入是如何被收集以及图形是如何显示的机制。\n\
    \n### 应用\n\n在 Shiny 可以创建网页应用之前，还有一件事需要完成。我们需要将`ui`和`server`组件关联起来，然后使用以下代码启动它们：`shinyApp(ui\
    \ = ui, server = server)`。\n\n这部分代码作为样板代码包含在内，除非你更改了用户界面和服务器对象的名称，否则你可能根本不需要修改这段代码。但是，了解这段代码的位置以及它负责启动应用实例是值得的。\n"
- fmt: "### Customizing Shiny Apps\n\nLet’s change this boilerplate code into something\
    \ that works for our analysis. For now, let’s just make some minor adjustments\
    \ to the user interface and let’s display our data instead of the built it `faithful`\
    \ dataset.\n\nThe first thing we need to do is copy our dataset into the Shiny\
    \ folder so we can deploy this with all the assets in one place in the future.\
    \ Save the dataset as an `rdata` file in the Shiny app folder using this code\
    \ on the R command line:\n\n```\nsave(expectancy, file = \"life_expectancy_web_app/expectancy.rdata\"\
    )\n```\n\nNow we can load this into our Shiny session when the app launches. Put\
    \ code at the top of the Shiny `app.R` file to load the dataset.\n\n```\nload(\"\
    expectancy.rdata\")\nexpectancy % filter(!is.na(life_expectancy))\n```\n\nThis\
    \ loads the dataset and then removes any missing values that will interfere with\
    \ the histogram. Now, we can look at our dataset instead of `faithful` but changing\
    \ one line of code in the `server` component.\n\n```\nserver <- function(input,\
    \ output) {\n  output$distPlot <- renderPlot({\n    # generate bins based on input$bins\
    \ from ui.R\n    x  <- expectancy$life_expectancy\n    bins <- seq(min(x), max(x),\
    \ length.out = input$bins + 1)\n    # draw the histogram with the specified number\
    \ of bins\n    hist(x, breaks = bins, col = 'darkgray', border = 'white')\n  })\n\
    }\n```\n\nBefore we test this out, let’s make changes to the title description\
    \ and add our own colors into the plot. You can probably guess where we will make\
    \ these changes. In the code below all the changes are highlighted in bold.\n\n\
    ```\nlibrary(shiny)\nlibrary(tidyverse)\nload(\"expectancy.rdata\")\nexpectancy\
    \ % filter(!is.na(life_expectancy))\n\n# Define UI for application that draws\
    \ a histogram\nui <- fluidPage(\n  # Application title\n  titlePanel(\"Life Expectancy\
    \ Data\"),\n  p(\"Life expectancy data was downloaded from data.gov. This dataset\
    \ contains death rates and life-expectancy statistics from 1900 to 2015. Exploratory\
    \ analysis was conducted on this dataset. In the visualization below, you can\
    \ see all life expectancy rates in the dataset and adjust the number of bins used\
    \ to present the frequency.\"),\n  # Sidebar with a slider input for number of\
    \ bins\n  sidebarLayout(\n    sidebarPanel(\n      sliderInput(\"bins\", \"Number\
    \ of bins:\", min = 1, max = 50, value = 30)\n    ),\n    # Show a plot of the\
    \ generated distribution\n    mainPanel(\n      plotOutput(\"distPlot\")\n   \
    \ )\n  )\n)\n\n# Define server logic required to draw a histogram\nserver <- function(input,\
    \ output) {\n  output$distPlot <- renderPlot({\n    # generate bins based on input$bins\
    \ from ui.R\n    life_expectancy  <- expectancy$life_expectancy\n    bins <- seq(min(life_expectancy),\
    \ max(life_expectancy), length.out = input$bins + 1)\n    # draw the histogram\
    \ with the specified number of bins\n    hist(life_expectancy, breaks = bins,\
    \ col = 'lightblue', border = 'white')\n  })\n}\n\n# Run the application\nshinyApp(ui\
    \ = ui, server = server)\n```\n\nNow when you run this code, your app will resemble\
    \ the one that appears in Figure 9-5.\n\n![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig5_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig5_HTML.jpg)\n\
    \n**Figure 9-5.** Life Expectancy Shiny App\n\nThe context now is relevant, and\
    \ we also adjusted the color of the bars in the histogram. You can see a published\
    \ version of this on the author’s shiny.io page by navigating to this URL: [https://mattjcamp.shinyapps.io/life_expectancy_web_app](https://mattjcamp.shinyapps.io/life_expectancy_web_app).\n\
    \n## Conclusion\n\nIn this chapter, we introduced Shiny and really just scratched\
    \ the surface of what we can accomplish with this tool. Shiny creates a pathway\
    \ to deploy data-rich apps directly to the web all without requiring a specific\
    \ background in web development.\n\nThat being said, Shiny is a very rich package\
    \ and even without dipping into JavaScript you can find yourself spending a good\
    \ deal of time working on data web apps. Take some time to learn the basics and\
    \ then follow the pattern in this chapter with example code from [https://shiny.rstudio.com](https://shiny.rstudio.com).\
    \ Look for examples that you find interesting that would work with data that you\
    \ are familiar with and adjust the code to make your own visualizations. As you\
    \ do this and learn the patterns, deploying Shiny apps will become second nature\
    \ to you as statistical programming and data analysis is to you now.\n\n# Custom\
    \ R Packages\n\nR owes its popularity in the data field largely due to its extensive\
    \ library of third-party packages that add significant functionality to the core\
    \ R language. We have already seen how using the `tidyverse` package can transform\
    \ the experience of using R. Many data problems have already been solved and R\
    \ programmers make these solutions available for anyone to use. In fact, many\
    \ data projects are started with a search for R packages that already exist that\
    \ solve the problem at hand.\n\nIn this chapter, we are going to talk about how\
    \ we can create our own R packages either for own teams or for distribution to\
    \ the wide world.\n\n## Custom R Packages Use Cases\n\nWhy should we create our\
    \ own packages? The obvious reason to create a package is to share our work with\
    \ the world. Problems that have been solved in R and can be coded in a way that\
    \ is generally useful are good candidates for packages.\n\nYou may also want to\
    \ create packages that only really apply to your own team or you own projects.\
    \ The reason is that coding in a package format encourages code reuse and process\
    \ efficiency. You may also use packages to bundle data and code together for your\
    \ colleagues, especially if you are seeing similar situations cropping up. Finally,\
    \ R packages come with built-in documentation tools that provide a way to communicate\
    \ complex material in your work.\n\nNot all code belongs in a package, so you\
    \ will have to apply some judgement when it comes to turning an ad-hoc analysis\
    \ into a package. Generally, it is more difficult to iterate and test code when\
    \ an R package format, so it is usually best to wait until you are in maintenance\
    \ mode to package up a set of functions into a package.\n\nIn this chapter, we\
    \ will create a package based on the work we have been doing in the previous few\
    \ chapters. For this work, we will use RStudio to create a completely new project\
    \ and then selectively bring in the features for the package.\n\n## Create New\
    \ Custom R Package\n\nRStudio has built in support for creating packages. Go to\
    \ the RStudio menu bar and then choose \"File\", \"New Package\", \"New Directory\"\
    , and then \"R Package\". A dialog box like Figure 10-1 will appear.\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig1_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig1_HTML.jpg)\n\
    \n**Figure 10-1.** R Package creation dialog box\n\nYou can add a name for your\
    \ package and specify a directory to create the package in. Click the \"Create\
    \ Project\" button to create the R package project.\n\nYou will get a set of template\
    \ files in your folder that you can follow as a guide. The key files are `hello.R`\
    \ in the `R` folder, `DESCRIPTION` and `hello.Rd` in the `man` folder. Let’s talk\
    \ about each of these below."
  raw: '### Customizing Shiny Apps


    Let’s change this boilerplate code into something that works for our analysis.
    For now, let’s just make some minor adjustments to the user interface and let’s
    display our data instead of the built it `faithful` dataset.


    The first thing we need to do is copy our dataset into the Shiny folder so we
    can deploy this with all the assets in one place in the future. Save the dataset
    as an rdata file in the Shiny app folder using this code on the R command line:


    ```

    save(expectancy, file = "life_expectancy_web_app/expectancy.rdata")

    ```


    Now we can load this into our Shiny session when the app launches. Put code at
    the top of the Shiny app.R file to load the dataset.


    ```

    load("expectancy.rdata")

    expectancy %

    filter(!is.na(life_expectancy))

    ```


    This loads the dataset and then removes any missing values that will interfere
    with the histogram. Now, we can look at our dataset instead of faithful but changing
    one line of code in the `server` component.


    ```

    server <- function(input, output) {

    output$distPlot <- renderPlot({

    # generate bins based on

    # input$bins from ui.R

    x  <- expectancy$life_expectancy

    bins <- seq(min(x), max(x),

    length.out = input$bins + 1)

    # draw the histogram with the

    # specified number of bins

    hist(x, breaks = bins,

    col = ''darkgray'',

    border = ''white'')

    })

    }

    ```


    Before we test this out, let’s make changes to the title description and add our
    own colors into the plot. You can probably guess where we will make these changes.
    In the code below all the changes are highlighted in bold.


    ```

    library(shiny)

    library(tidyverse)

    load("expectancy.rdata")

    expectancy %

    filter(!is.na(life_expectancy))

    # Define UI for application that draws a histogram

    ui <- fluidPage(

    # Application title

    titlePanel("Life Expectancy Data"),

    p("Life expectancy data was downloaded from

    data.gov. This dataset contains death rates

    and life-expectancy statistics

    from 1900 to 2015\. Exploratory analysis was

    conducted on this dataset. In the

    visualization below, you can see all life

    expectancy  rates in the dataset and adjust

    the number of bins used to present the

    frequency."),

    # Sidebar with a slider input for number of bins

    sidebarLayout(

    sidebarPanel(

    sliderInput("bins",

    "Number of bins:",

    min = 1,

    max = 50,

    value = 30)

    ),

    # Show a plot of the generated distribution

    mainPanel(

    plotOutput("distPlot")

    )

    )

    )

    # Define server logic required to draw

    # a histogram

    server <- function(input, output) {

    output$distPlot <- renderPlot({

    # generate bins based on

    # input$bins from ui.R

    life_expectancy  <- expectancy$life_expectancy

    bins <- seq(min(life_expectancy),

    max(life_expectancy),

    length.out = input$bins + 1)

    # draw the histogram with the

    # specified number of bins

    hist(life_expectancy,

    breaks = bins,

    col = ''lightblue'',

    border = ''white'')

    })

    }

    # Run the application

    shinyApp(ui = ui, server = server)

    ```


    Now when you run this code, your app will resemble the one that appears in Figure
    [9-5](#478254_1_En_9_Chapter.xhtml#Fig5).


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig5_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig5_HTML.jpg)


    Figure 9-5


    Life Expectancy Shiny App


    The context now is relevant, and we also adjusted the color of the bars in the
    histogram. You can see a published version of this on the author’s shiny.io page
    by navigating to this URL: [`https://mattjcamp.shinyapps.io/life_expectancy_web_app`](https://mattjcamp.shinyapps.io/life_expectancy_web_app)
    .


    ## Conclusion


    In this chapter, we introduced Shiny and really just scratched the surface of
    what we can accomplish with this tool. Shiny creates a pathway to deploy data-rich
    apps directly to the web all without requiring a specific background in web development.


    That being said, Shiny is a very rich package and even without dipping into JavaScript
    you can find yourself spending a good deal of time working on data web apps. Take
    some time to learn the basics and then follow the pattern in this chapter with
    example code from [`https://shiny.rstudio.com`](https://shiny.rstudio.com) . Look
    for examples that you find interesting that would work with data that you are
    familiar with and adjust the code to make your own visualizations. As you do this
    and learn the patterns, deploying Shiny apps will become second nature to you
    as statistical programming and data analysis is to you now.


    # 10. Custom R Packages


    R owes its popularity in the data field largely due to its extensive library of
    third-party packages that add significant functionality to the core R language.
    We have already seen how using the `tidyverse` package can transform the experience
    of using R. Many data problems have already been solved and R programmers make
    these solutions available for anyone to use. In fact, many data projects are started
    with a search for R packages that already exist that solve the problem at hand.


    In this chapter, we are going to talk about how we can create our own R packages
    either for own teams or for distribution to the wide world.


    ## Custom R Packages Use Cases


    Why should we create our own packages? The obvious reason to create a package
    is to share our work with the world. Problems that have been solved in R and can
    be coded in a way that is generally useful are good candidates for packages.


    You may also want to create packages that only really apply to your own team or
    you own projects. The reason is that coding in a package format encourages code
    reuse and process efficiency. You may also use packages to bundle data and code
    together for your colleagues, especially if you are seeing similar situations
    cropping up. Finally, R packages come with built-in documentation tools that provide
    a way to communicate complex material in your work.


    Not all code belongs in a package, so you will have to apply some judgement when
    it comes to turning an ad-hoc analysis into a package. Generally, it is more difficult
    to iterate and test code when an R package format, so it is usually best to wait
    until you are in maintenance mode to package up a set of functions into a package.


    In this chapter, we will create a package based on the work we have been doing
    in the previous few chapters. For this work, we will use RStudio to create a completely
    new project and then selectively bring in the features for the package.


    ## Create New Custom R Package


    RStudio has built in support for creating packages. Go to the RStudio menu bar
    and then choose “File”, “New Package”, “New Directory”, and then “R Package”.
    A dialog box like Figure [10-1](#478254_1_En_10_Chapter.xhtml#Fig1) will appear.


    ![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig1_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig1_HTML.jpg)


    Figure 10-1


    R Package creation dialog box


    You can add a name for your package and specify a directory to create the package
    in. Click the “Create Project” button to create the R package project.


    You will get a set of template files in your folder that you can follow as a guide.
    The key files are “hello.R” in the “R” folder, “DESCRIPTION” and “hello.Rd” in
    the “man” folder. Let’s talk about each of these below.'
  trans: "\n### 自定义 Shiny 应用\n\n让我们将这个样板代码修改成适合我们分析的代码。目前，我们只需对用户界面进行一些小的调整，并显示我们自己的数据集，而不是内置的\
    \ `faithful` 数据集。\n\n我们需要做的第一件事是将数据集复制到 Shiny 文件夹中，以便将来可以将所有资源部署在一个地方。使用 R 命令行上的以下代码，将数据集以\
    \ `rdata` 文件格式保存到 Shiny 应用文件夹中：\n\n```\nsave(expectancy, file = \"life_expectancy_web_app/expectancy.rdata\"\
    )\n```\n\n现在，当应用启动时，我们可以在 Shiny 会话中加载这个数据集。将以下代码放在 Shiny 的 `app.R` 文件顶部，以加载数据集。\n\
    \n```\nload(\"expectancy.rdata\")\nexpectancy % filter(!is.na(life_expectancy))\n\
    ```\n\n这行代码会加载数据集，然后移除任何会干扰直方图的缺失值。现在，我们可以通过修改 `server` 组件中的一行代码，来查看我们自己的数据集，而不是\
    \ `faithful` 数据集。\n\n```\nserver <- function(input, output) {\n  output$distPlot\
    \ <- renderPlot({\n    # generate bins based on input$bins from ui.R\n    x  <-\
    \ expectancy$life_expectancy\n    bins <- seq(min(x), max(x), length.out = input$bins\
    \ + 1)\n    # draw the histogram with the specified number of bins\n    hist(x,\
    \ breaks = bins, col = 'darkgray', border = 'white')\n  })\n}\n```\n\n在我们测试之前，让我们修改标题描述，并在图表中添加我们自己的颜色。你大概能猜到我们会在哪里进行这些修改。在下面的代码中，所有修改都已用粗体标出。\n\
    \n```\nlibrary(shiny)\nlibrary(tidyverse)\nload(\"expectancy.rdata\")\nexpectancy\
    \ % filter(!is.na(life_expectancy))\n\n# Define UI for application that draws\
    \ a histogram\nui <- fluidPage(\n  # Application title\n  titlePanel(\"Life Expectancy\
    \ Data\"),\n  p(\"Life expectancy data was downloaded from data.gov. This dataset\
    \ contains death rates and life-expectancy statistics from 1900 to 2015. Exploratory\
    \ analysis was conducted on this dataset. In the visualization below, you can\
    \ see all life expectancy rates in the dataset and adjust the number of bins used\
    \ to present the frequency.\"),\n  # Sidebar with a slider input for number of\
    \ bins\n  sidebarLayout(\n    sidebarPanel(\n      sliderInput(\"bins\", \"Number\
    \ of bins:\", min = 1, max = 50, value = 30)\n    ),\n    # Show a plot of the\
    \ generated distribution\n    mainPanel(\n      plotOutput(\"distPlot\")\n   \
    \ )\n  )\n)\n\n# Define server logic required to draw a histogram\nserver <- function(input,\
    \ output) {\n  output$distPlot <- renderPlot({\n    # generate bins based on input$bins\
    \ from ui.R\n    life_expectancy  <- expectancy$life_expectancy\n    bins <- seq(min(life_expectancy),\
    \ max(life_expectancy), length.out = input$bins + 1)\n    # draw the histogram\
    \ with the specified number of bins\n    hist(life_expectancy, breaks = bins,\
    \ col = 'lightblue', border = 'white')\n  })\n}\n\n# Run the application\nshinyApp(ui\
    \ = ui, server = server)\n```\n\n现在，当你运行这段代码时，你的应用将类似于图 9-5 中所示。\n\n![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig5_HTML.jpg](img/478254_1_En_9_Fig5_HTML.jpg)\n\
    \n**图 9-5.** 预期寿命 Shiny 应用\n\n现在的上下文是相关的，我们也调整了直方图中条形的颜色。你可以通过访问此 URL：[`mattjcamp.shinyapps.io/life_expectancy_web_app`](https://mattjcamp.shinyapps.io/life_expectancy_web_app)，在作者的\
    \ shiny.io 页面上看到这个应用的已发布版本。\n\n## 结论\n\n在本章中，我们介绍了 Shiny，并且只是浅尝辄止地了解了这个工具所能实现的功能。Shiny\
    \ 创建了一条途径，可以直接将数据丰富的应用部署到网络上，而无需具备特定的网络开发背景。\n\n话虽如此，Shiny 是一个非常丰富的包，即使不涉及 JavaScript，你也会发现自己需要花费大量时间在数据处理网络应用上。花一些时间学习基础知识，然后按照本章的模式，参考\
    \ [`shiny.rstudio.com`](https://shiny.rstudio.com) 上的示例代码。寻找你感兴趣且能与你所熟悉的数据配合使用的示例，并调整代码来制作你自己的可视化效果。当你这样做并掌握了这些模式后，部署\
    \ Shiny 应用将变得像现在的统计编程和数据分析一样得心应手。\n\n# 自定义 R 包\n\nR 在数据领域的流行，很大程度上归功于其庞大的第三方包库，这些包为核心\
    \ R 语言增加了重要的功能。我们已经看到，使用 `tidyverse` 包如何能改变使用 R 的体验。许多数据问题已经得到解决，R 程序员将这些解决方案提供给任何人使用。事实上，许多数据项目都是从搜索已经存在的、能够解决当前问题的\
    \ R 包开始的。\n\n在本章中，我们将讨论如何创建我们自己的 R 包，无论是用于我们自己的团队，还是分发给全世界。\n\n## 自定义 R 包的使用场景\n\
    \n我们为什么要创建自己的包？创建包的一个显而易见的原因是与世界分享我们的工作。那些在 R 中已经解决，并且可以以普遍有用的方式编码的问题，是打包成包的理想选择。\n\
    \n你可能也想创建一些只适用于你自己团队或你自己项目的包。原因是，以包的形式进行编码可以促进代码复用和流程效率。你也可以使用包将数据和代码打包在一起提供给同事，特别是当你看到类似情况反复出现时。最后，R\
    \ 包带有内置的文档工具，为你在工作中传达复杂材料提供了一种方式。\n\n并非所有代码都适合放在包中，因此在将临时分析转化为包时，你需要运用一些判断力。通常，在\
    \ R 包格式下迭代和测试代码更加困难，因此通常最好等到你处于维护模式时，再将一组函数打包成一个包。\n\n在本章中，我们将基于前几章所做的工作创建一个包。为此，我们将使用\
    \ RStudio 创建一个全新的项目，然后有选择地将功能引入包中。\n\n## 创建新的自定义 R 包\n\nRStudio 内置了创建包的支持。转到 RStudio\
    \ 菜单栏，然后选择“文件”、“新建项目”、“新目录”，然后选择“R 包”。将出现一个类似图 10-1 的对话框。\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig1_HTML.jpg](img/478254_1_En_10_Fig1_HTML.jpg)\n\
    \n**图 10-1.** R 包创建对话框\n\n你可以为你的包添加一个名称，并指定一个目录来创建该包。点击“创建项目”按钮来创建 R 包项目。\n\n\
    你的文件夹中将获得一组模板文件，你可以将其作为指南。关键文件是 `R` 文件夹中的 `hello.R` 文件、`DESCRIPTION` 文件以及 `man`\
    \ 文件夹中的 `hello.Rd` 文件。下面我们来逐一介绍这些文件。\n"
- fmt: "### `hello.R`\n\nAll of the code that you want to publish should be located\
    \ in the `R` folder just as `hello.R`. This file will be opened when you create\
    \ the R package project and you can see these contents.\n\n```\n# Hello, world!\n\
    #\n# This is an example function named 'hello'\n# which prints 'Hello, world!'.\n\
    #\n# You can learn more about package authoring with\n# RStudio at:\n#\n#   http://r-pkgs.had.co.nz/\n\
    #\n# Some useful keyboard shortcuts for package\n# authoring:\n#\n#   Install\
    \ Package:           'Cmd + Shift + B'\n#   Check Package:             'Cmd +\
    \ Shift + E'\n#   Test Package:              'Cmd + Shift + T'\nhello <- function()\
    \ {\nprint(\"Hello, world!\")\n}\n```\n\nThis is very simple, but good enough\
    \ to demonstrate how the R package build process works. You can put the functions\
    \ you want to publish here to make them available. It is a good practice to include\
    \ one file per function in the `R` folder.\n\n### `DESCRIPTION`\n\nThe `DESCRIPTION`\
    \ file provides the meta-data for the package. This is where you document the\
    \ title, description, version, and your contact information. Simply open the file\
    \ by clicking on it and replace any fields with information about your R package.\n\
    \n```\nPackage: life\nType: Package\nTitle: Shows Life Expectancy Trends Since\
    \ 1900\nVersion: 0.1.0\nAuthor: Matt\nMaintainer: Matt \nDescription: Includes\
    \ datasets and helper functions to help present information on life expectancy\
    \ rates.\nLicense: None\nEncoding: UTF-8\nLazyData: true\nRoxygenNote: 6.1.1\n\
    ```\n\nYou don’t need to change this to follow along with the demo, but when you\
    \ are ready to publish you want to make sure that these fields contain relevant\
    \ information.\n\n### `hello.Rd`\n\n`hello.Rd` is the R documentation file. This\
    \ file is automatically generated for you based on documentation that you include\
    \ with your function. We will talk more about documenting code below.\n\nThe information\
    \ here will appear in the package documentation that you read in the `Help` pane.\
    \ The title will also appear as part of the code completion in RStudio so that\
    \ when you are typing out a line of code your content will appear right in the\
    \ editor screen. This is a really handy way of providing context to other analysts\
    \ on your team right when they may need it. Let’s build the R package so we can\
    \ see how this all works.\n\n### Build R Package\n\nWhen you are working with\
    \ an R package project, you will have an additional tab in your top right view\
    \ called `Build`. This tab gives you some options around building R packages.\
    \ Go to this tab and then click `More` and then `Clean and Rebuild` as pictured\
    \ in Figure 10-2.\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig2_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig2_HTML.jpg)\n\
    \n**Figure 10-2** Build view\n\nThis will build and package up your code. If there\
    \ are any required libraries that are needed but are not installed, RStudio will\
    \ prompt you to install them now. Follow the dialog wizard to install any required\
    \ packages.\n\nNow that you have built and installed your package, you may use\
    \ the function like this:\n\n```\nlibrary(life)\nhello()\n```\n\nThis simple code\
    \ will print `Hello, world!` to your Console. If you wanted to change the behavior\
    \ of this function, you can simply change the code in the `hello.R` file and then\
    \ rebuild the package. Go ahead and try to change this function and see the results.\n\
    \nYou may also use these functions in the same way from your other RStudio projects.\
    \ This is how R packages encourage code reuse. Let’s go ahead and add some features\
    \ from our life expectancy analysis to show off R packages a bit more.\n\n###\
    \ R Package Documentation\n\nYou can include comments in your R package by using\
    \ the `roxygen2` package. First, you must install the package with the command\
    \ `install.packages(\"roxygen2\")`. This will install the `roxygen2` library along\
    \ with any supporting packages required.\n\nThe next step is to configure the\
    \ build tools. Go to the build view and then choose `More` and then `Configure\
    \ Build Tools...`. You will see a dialog box like the one pictured in Figure 10-3\
    \ appear.\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig3_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig3_HTML.jpg)\n\
    \n**Figure 10-3** Configuring build tools\n\nClick the `Generate documentation\
    \ with Roxygen` checkbox. Then click the `Configure...` button to get the dialog\
    \ box that appears in Figure 10-4.\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig4_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig4_HTML.jpg)\n\
    \n**Figure 10-4** Roxygen build options\n\nMake sure to check the `Install and\
    \ Restart` checkbox. Now when you build your R package, the documentation will\
    \ get automatically generated based on fields that you supply. You include documentation\
    \ with special comments that include a backtick `#'`. Each field name begins with\
    \ an `@`. Some common field types include `@name`, `@title`, and `@description`.\
    \ For example, here is what you might include in the `hello` function documentation:\n\
    \n```\n# Hello, world!\n#\n# This is an example function named 'hello'\n# which\
    \ prints Hey there!.\n#\n#' @name hello\n#' @aliases hello\n#' @title Hello World\n\
    #' @usage hello()\n#' @description  Prints 'Hey there!'\n#' @examples hello()\n\
    hello <- function() {\nprint(\"Hey there!\")\n}\n```\n\nNow when you build your\
    \ R package, your help documentation will reflect the content that you included\
    \ above as pictured in Figure 10-5.\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig5_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig5_HTML.jpg)\n\
    \n**Figure 10-5** Custom help documentation\n\nIn the help file, we changed the\
    \ description field to reflect that the `Hello, world!` message was changed in\
    \ the function.\n\n### Adding Datasets to R Packages\n\nYou can include datasets\
    \ as well as functions in your packages. All you need to do is add a `data` folder\
    \ to your R package and then put your datasets into that folder. These datasets\
    \ can be R dataframes or raw datafiles of any type. For the life expectancy project,\
    \ we simply copied the data folder that includes the csv file that was downloaded\
    \ from the `data.gov` website. Then this code was used to save this dataset as\
    \ an R dataframe.\n\n```\nlibrary(readr)\nlife_expectancy <- read_csv(\"data/NCHS_-_Death_rates_and_life_expectancy_at_birth.csv\"\
    )\n# Clean up dataframe\n# Use shorter column names\nnames(life_expectancy)[1]\
    \ <- \"year\"\nnames(life_expectancy)[2] <- \"race\"\nnames(life_expectancy)[3]\
    \ <- \"sex\"\nnames(life_expectancy)[4] <- \"life_expectancy\"\nnames(life_expectancy)[5]\
    \ <- \"death_rate\"\nsave(life_expectancy,\nfile =\"data/life_expectancy.rdata\"\
    )\n```\n\nNext, click `Clean and Rebuild` in the `Build` view to rebuild the `life`\
    \ package. Once this process is complete, you can access the dataset using this\
    \ code from any RStudio project:\n\n```\nlibrary(life)\nhead(life_expectancy)\n\
    ```\n\nThis will show you the beginning of this dataset and more importantly,\
    \ we can use this code from any analysis without re-running our life expectancy\
    \ analysis.\n\n### Code Completion\n\nAs you type in code into RStudio, you may\
    \ see that code suggestions will pop up as you type. Code from your RStudio packages\
    \ will follow this pattern as well. Also, you can quickly see what data and functions\
    \ are available by typing in the name of the package followed by two semi-colons\
    \ as pictured in Figure 10-6.\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig6_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig6_HTML.jpg)\n\
    \n**Figure 10-6** R Package code completion\n\nIn the code above, we typed `life::`\
    \ which is a way of filtering all the content that belongs to the `life` package.\
    \ You can do this for any R package to see what functions are included with what\
    \ packages. Your description field from your help documentation will also show\
    \ up as you type as a tooltip."
