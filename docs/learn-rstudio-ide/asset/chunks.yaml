    ## 结论


    R Markdown 提供了一个强大的报告生成系统。本章仅触及了作为报告编写者可用功能的一小部分。当您开发可能在整个组织内共享的分析时，这将是您的报告主力工具。


    # 9. Shiny R 仪表板


    R Markdown 和 `htmlwidgets` 能让您创建丰富甚至带有弹出框的交互式体验。然而，某些用例需要的不仅仅是这类静态工具所能提供的功能。例如，您可能需要用户提供分析中使用的参数、连接到后端数据库，或在用户探索您的分析时执行新的
    R 脚本。


    您可以在 RStudio 中使用 Shiny 来创建这类数据仪表板，它们具有与您的 R 系统完全集成的丰富功能。Shiny 是一个用于在 R 中创建交互式
    Web 应用程序的包。这些应用程序可以在 RStudio 项目中使用、添加到 R Markdown 报告中，或作为 Web 应用在线发布。Shiny 提供了一个易于使用的框架来开发这些应用程序，并且您可以通过自己的
    CSS 和 JavaScript 代码进一步扩展 Shiny。


    ## 新建 Shiny 应用


    向您的 RStudio 项目添加一个 Shiny 应用非常简单。只需转到 RStudio 菜单栏，然后选择 `"File"`、`"New File"`，最后选择
    `"Shiny Web App..."`。将会出现一个类似图 9-1 所示的对话框。


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig1_HTML.jpg](img/478254_1_En_9_Fig1_HTML.jpg)


    图 9-1


    新建 Shiny 应用


    您可以为应用命名，并选择代码是放在一个文件还是两个文件中。点击 `"Create"` 按钮来构建这个 Web 应用。


    RStudio 将在您的项目中创建一个以您在对话框中提供的名称命名的新文件夹。如果您选择 `"Single File"`，则会出现一个名为 `"app.R"`
    的新文件，并自动在编辑器视图中打开，如图 9-2 所示。


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig2_HTML.jpg](img/478254_1_En_9_Fig2_HTML.jpg)


    图 9-2


    `app.R` 的内容


    显示的代码是 RStudio 为您创建的模板，作为起点。这是一个可工作的 Shiny 应用，使用内置的 R 数据集作为示例。点击图 9-2 中所示的 `"Run
    App"` 按钮来运行这个 Web 应用。该应用将在由 R 管理的本地 Web 服务器上开始运行，如图 9-3 所示。


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig3_HTML.jpg](img/478254_1_En_9_Fig3_HTML.jpg)


    图 9-3


    本地运行的 Shiny 应用


    这个直方图具有很高的交互性，当您调整左侧的滑块控件时，会执行 R 代码以重新创建右侧的直方图。这比仅仅包含预置在静态报告中的弹出框更进一步。


    在图 9-3 的顶部，您会看到一个 HTTP 地址和一个 `"Open in Browser"` 按钮。这个应用正在一个 Web 服务器上运行，因此您可以通过点击
    `"Open in Browser"` 按钮或在浏览器的地址栏中输入 HTTP 地址，使用常规浏览器来查看该应用。


    您可能还会注意到右侧有一个 `"Publish"` 按钮。Shiny 应用被发布到网站，以便任何人都可以使用。这些应用可以是公开的，既可以使用 RStudio
    提供的服务，也可以从您的企业管理私有服务器。要获取免费账户来发布您的应用，请前往 [`https://www.shinyapps.io`](https://www.shinyapps.io)
    注册。


    ## 理解 Shiny


    Shiny 可用于创建使用 R 脚本且可以在 Web 上相对轻松访问的仪表板。然而，与大多数 R 包一样，您可以更深入地研究该系统，以构建真正定制化的体验。我们将在此讨论基础知识，为您提供一个良好的
    Shiny 起点，但要真正掌握这个包，请前往 [`https://shiny.rstudio.com/`](https://shiny.rstudio.com/)
    查看教程和文档，了解 Shiny 可以实现的功能。


    Shiny 代码被分为两个职责明确的区域：用户界面和服务器。这也被称为“前端”和“后端”。其理念是，像滑块和按钮这样的可视化用户界面元素属于应用的前端部分，而数值计算和数据分析则属于应用的后端部分。


    在我们生成的代码中，只有一个文件同时包含了用户界面和服务器。根据您选择的选项或最初编写应用的人的不同，您也可能会看到这两个组件被分离到各自的文件中。

