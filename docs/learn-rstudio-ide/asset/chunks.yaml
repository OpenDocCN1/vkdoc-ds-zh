  trans: "\n### 矩阵\n\n矩阵是一个具有两个维度（本质上是行和列）的向量。与向量类似，矩阵中的每个对象必须是相同类型。你可以通过像这样设置向量的\
    \ `dim`（维度）属性来创建一个矩阵：\n\n```\nm <- c(1,2,3,4,5,6,7,8,9)\ndim(m) <- c(3,3)\nm\n\
    ```\n\n当你检查 `m` 时，你会看到这个矩阵：\n\n```\n     [,1] [,2] [,3]\n[1,]    1    4    7\n\
    [2,]    2    5    8\n[3,]    3    6    9\n```\n\n要引用矩阵中的单个单元格，你需要提供行和列的索引。例如，要查看第\
    \ 2 行第 1 列的内容，你可以这样操作：`m[2,1]` 将得到值 2。\n\n### 列表\n\n我们之前讨论的向量被称为原子向量，因为它们必须包含所有相同类型的元素。而包含混合类型对象的向量则被称为列表。当你想要管理相关对象的集合时，列表非常方便。\n\
    \n要创建一个新列表，你可以像这样使用 `list` 函数：\n\n```\nl <- list()\nl$name <- \"Cards\"\nl$cards\
    \ <- c(\"10\",\"Jack\",\"Queen\",\"King\",\"Ace\")\nl$bets <- c(1,5,10)\n```\n\
    \n第一行创建了一个空列表，然后使用 `$` 来创建名称并分配对象。第一个是一个描述列表的字符对象，第二个是一个字符向量，最后一个是一个数值向量。之后要访问这些值，你必须使用列表名称后跟美元符号\
    \ `$` 和对象名称。例如，要查看卡牌列表，你可以输入 `l$cards`，要获取列表中的第二张牌，则输入 `l$cards[2]`。\n\n### 因子\n\
    \n因子是一种只能包含特定值的向量类型。例如，你可能有一个用来表示性别的值列表，每个值必须是 “male”、“female” 或 “unknown”。当我们对对象类别进行分析时，这种结构非常方便。\n\
    \n你可以使用 `factor` 函数并提供值列表来创建一个因子。\n\n```\nsex <- factor(c(\"male\",\"female\"\
    ,\"unknown\",\"male\"))\nsex\n```\n\n这段代码会输出以下信息：\n\n```\n[1] male    female \
    \ unknown male\nLevels: female male unknown\n```\n\n我们得到了一个类似向量中的值列表，但还附带了额外的“水平”信息。\n\
    \n### 数据框\n\n数据框是一种特殊的列表，其各个组件的长度必须相等。实际上，这提供了一种类似电子表格的二维数据结构，由行和列组成。你可以像使用列表一样，通过\
    \ `$` 运算符来操作数据框的组件，或者像使用矩阵一样，通过行和列索引来操作。\n\n你可以使用 `data.frame` 函数创建一个数据框：\n\n\
    ```\ndf <- data.frame(numbers = c(1,2,3),\nletters = c(\"A\",\"B\",\"C\"))\ndf$more\
    \ <- c(\"1st\",\"2nd\",\"3rd\")\n```\n\n在用 `data.frame` 函数创建数据框时，你可以提供长度相等的向量。一旦你有了一个数据框，就可以像上面那样使用\
    \ `$` 运算符创建额外的列。\n\n通常，你会从一个函数的输出中得到一个为你创建好的数据框。数据框是 R 语言中一个基础对象，而数据框的 “tibble”\
    \ 变体类型在“必备 R 包”一章中有非常详细的介绍。\n\n## 流程控制\n\n到目前为止，我们主要是在创建对象、设置属性并检查结果。R 编程还包含使用条件分支和循环来重复执行代码的方法。\n\
    \n### If-Then 语句\n\nif-then 语句指示我们的程序根据某些对象的状态采取不同的操作。下面是一个 if-then 语句的例子：\n\n\
    ```\nstate <- \"startup\"\nif(state == \"startup\") {\nprint(\"We are about to\
    \ start the program\")\nstate = \"running program\"\n} else {\nprint(\"Program\
    \ running\")\n}\n```\n\n我们有一个名为 `state` 的对象，其值为 “startup”。下一行代码会评估 `state` 对象，如果该对象等于\
    \ “startup”，那么 `if` 语句后面花括号内的代码将被执行。程序会打印一条状态信息，并且 `state` 对象的值会发生改变。\n\n如果 `state`\
    \ 对象的值不是 “startup”，那么 `else` 关键字后面的代码将被执行。在这里，程序会简单地打印出 “Program running” 这条消息。\n\
    \n在上面的例子中，我们使用了 `==` 运算符来测试两个值是否相等。你还可以测试不相等（`!=`）、大于（`>`）、小于（`<`）、大于等于（`>=`）和小于等于（`<=`）。\n\
    \n你还可以在一行代码中使用 if-else，这在代码简洁时效果很好。例如，如果我们只是想测试 `state` 对象是否处于启动模式，我们可以简单地这样做：\n\
    \n```\nifelse(state == \"startup\", TRUE, FALSE)\n```\n\n如果 `state` 是 “startup”，我们将得到布尔值\
    \ `TRUE`。否则，我们得到布尔值 `FALSE`。布尔值是一种特殊的对象类型，其值只能为真或假，常用于测试此类条件。\n\n### 循环\n\n循环为我们提供了一种重复执行相同代码的方法。在\
    \ R 中我们可以使用两种类型的循环：`for` 循环和 `while` 循环。我们还可以使用提供类似循环行为的 apply 函数族。让我们看看循环是如何工作的。\n\
    \n#### For 循环\n\nFor 循环会执行指定的次数。例如，如果你想循环执行代码五次，你可以这样做：\n\n```\nfor (i in 1:5){\n\
    print(i)\n}\n```\n\n这将打印出数字 1 到 5。这段代码由 `for` 关键字和括号中的对象 `i` 组成，对象 `i` 用于记录我们在循环中的位置。`1:5`\
    \ 是 R 中表示 1 到 5 所有数字的简写。这个循环将运行 5 次，花括号之间的代码每次运行都会产生以下输出：\n\n```\n[1] 1\n[1] 2\n\
    [1] 3\n[1] 4\n[1] 5\n```\n\n#### While 循环\n\nWhile 循环也会重复执行代码。但是，这些循环不会执行固定的次数，而是会一直运行直到满足某个条件。下面是我们如何使用\
    \ while 循环从 1 数到 5 的方法：\n\n```\ni <- 0\nwhile (i <= 5) {\nprint(i)\ni <- i + 1\n\
    }\n```\n\nWhile 循环检查 `i` 对象的状态，并在条件 `i <= 5` 为假之前，一直将值打印到控制台。每次循环迭代，`i` 的值都会增加\
    \ 1。\n\n#### Apply 函数\n\nApply 函数族也提供循环模式，但形式更为紧凑。你会在各种 R 包以及基础 R 中看到这类函数的使用。一般模式是，你通过传递一个对象（如向量、数据框或列表）来使用\
    \ apply 函数，然后 apply 函数会遍历该对象中的每个元素。你将要对每个元素执行的代码提供给 apply 函数，然后该函数会返回一个新的对象。\n\
    \n要复现我们目前使用循环所做的工作，我们可以这样做：\n\n```\nsapply(1:5, function(x){print(x)})\n```\n\n\
    这要简洁得多，我们实际上只需要向量 `1:5` 和要执行的代码。请注意，这段代码是一个“匿名函数”，接下来会更详细地讨论函数。基本上，我们定义了一个带有一个参数\
    \ `x` 的函数，`x` 是向量中当前值的占位符，并且花括号之间是我们将对向量中每个元素执行的代码。\n\n我们在这里使用了 `sapply` 函数，此版本的\
    \ apply 函数会返回一个简化后的对象（在此例中是一个向量）。在上述情况下，我们只是取回了同一个向量。然而，我们本可以做一些类似这样的事情：\n\n```\n\
    sapply(1:5, function(x){\nx * 2\n})\n```\n\n我们把匿名函数拆分开来是为了让代码更清晰一些。这段代码会生成一个新的向量，并在控制台打印出以下内容：\n\
    \n```\n[1]  2  4  6  8 10\n```\n\n这个 apply 函数是一个通用的包装函数，它会返回最简单的对象。我们还有 `lapply`，它用于列表和数据框，工作方式相同，但返回列表对象。\n"
- fmt: "### Functions\n\nFunctions are a type of object that contain a block of code\
    \ that can be executed with inputs that you provide to the function. These objects\
    \ are a great way to follow the best practice of writing code once. Generally,\
    \ any block of code that you feel can be used throughout your project can be wrapped\
    \ up as a function to be used later on. Here is how you create a function object:\n\
    \n```\nmy_fun <- function(x, y) {\nr = x * 2 + y\nr\n}\n```\n\nThe code in between\
    \ the curly brackets `{` and `}` is what makes up the function. Inside these curly\
    \ brackets, you can create new objects and reference objects that are declared\
    \ as parameters in the function. Parameters are declared in the comma-separated\
    \ list that appears in parenthesis after the `function` keyword. Functions can\
    \ also use objects that have been declared outside of the function as long as\
    \ they have been declared before the function itself.\n\nThe function including\
    \ the parameters list and code block is assigned to the `my_fun` object. We can\
    \ inspect the function by typing the object name into the Console to get a printout\
    \ of the code in the function.\n\nIn order to use the function, we must type out\
    \ the function name followed by the comma-separated list of parameters like this:\n\
    \n```\nmy_fun(3, 189)\n```\n\nThis will return the numeric object `195`. What\
    \ happens in the function is that each line of code is executed, and the last\
    \ line of code is returned to the caller. The last line of code in `my_fun` is\
    \ the result of the calculation.\n\nFunctions that are not assigned to object\
    \ names are called anonymous functions and are often used as parameters to functions\
    \ like `lapply` or `sapply`. These functions work in the same way but are not\
    \ necessarily reused in the same way as a standard function would be.\n\n### Importing\
    \ JSON Data\n\nJSON, JavaScript Object Notation, is a data format that some programmers\
    \ may not be as familiar with as compared to csv or other two-dimensional data\
    \ formats. The JSON data format is designed to be something that can be sent easily\
    \ in a text format while maintaining a structured format.\n\nHere is an example\
    \ of JSON data:\n\n```\n[{\"year\":2015,\"race\":\"All Races\",\"sex\":\"Both\
    \ Sexes\",\"death\":733.1},{\"year\":2014,\"race\":\"All Races\",\"sex\":\"Both\
    \ Sexes\",\"life\":78.9,\"death\":724.6},{\"year\":2013,\"race\":\"All Races\"\
    ,\"sex\":\"Both Sexes\",\"life\":78.8,\"death\":731.9},{\"year\":2012,\"race\"\
    :\"All Races\",\"sex\":\"Both Sexes\",\"life\":78.8,\"death\":732.8},{\"year\"\
    :2011,\"race\":\"All Races\",\"sex\":\"Both Sexes\",\"life\":78.7,\"death\":741.3},{\"\
    year\":2010,\"race\":\"All Races\",\"sex\":\"Both Sexes\",\"life\":78.7,\"death\"\
    :747}]\n```\n\nThis is a portion of the life expectancy data that we worked with\
    \ throughout the book. You can probably make some sense of this data, but it’s\
    \ far from a friendly format.\n\nTo work with data like this you can use the `jsonlite`\
    \ package. Install this package with this code:\n\n```\ninstall.packages(\"jsonlite\"\
    )\n```\n\nNow, assuming we have the JSON data above stored in an object called\
    \ named `life_json` we can convert the data into a tidy format that we can use\
    \ with this simple line of code:\n\n```\nlibrary(tidyverse)\nlibrary(jsonlite)\n\
    life <- fromJSON(life_json)\n```\n\nWe included the library references above.\
    \ You can inspect the result by typing the object name `life` into the command\
    \ line to get this data frame:\n\n```\nyear      race        sex death life\n\
    1 2015 All Races Both Sexes 733.1   NA\n2 2014 All Races Both Sexes 724.6 78.9\n\
    3 2013 All Races Both Sexes 731.9 78.8\n4 2012 All Races Both Sexes 732.8 78.8\n\
    5 2011 All Races Both Sexes 741.3 78.7\n6 2010 All Races Both Sexes 747.0 78.7\n\
    ```\n\nThe `jsonlite` package `fromJSON` function automatically transformed the\
    \ file into a data frame. This function will return the most high-level object\
    \ that it can automatically. Since our data fit neatly into a data frame that\
    \ is what we received. However, if the underlying data frame does not fit into\
    \ this structure you may end up with a list object that reflects the structure\
    \ of the JSON file.\n\n## Conclusion\n\nIn this chapter, we have presented enough\
    \ information about R programming to get you started and to make sure that you\
    \ can follow along with this book. You should now understand objects, control\
    \ flow, and functions in R. Additionally, the chapter on essential R packages\
    \ and the section on JSON will give you a solid start if you have produced data\
    \ analysis in the past.\n\nFor readers new to data analysis and/or programming,\
    \ you may find that you need more help. Programming is something that takes a\
    \ lot of practice and some understanding in the beginning. You may benefit by\
    \ reviewing other programmers’ data analysis work. Many examples are available\
    \ online on websites like Github.\n\nReaders who are completely new to programming\
    \ may want to take some time to learn essential programming. If this book is the\
    \ first time that you have encountered ideas such as loops, functions, and objects\
    \ then you should consider taking a local or online course on R programming.\n\
    \nFor everyone, we hope that the material in this book and this chapter will help\
    \ you understand what tools are available to you so that you can really start\
    \ to provide the insight into your work that you are looking for. Good luck and\
    \ I hope that you enjoy the journey into the technology of data science!\n\n###\
    \ Index\n\n#### A, B, C\n\nClass types: `character`, `numeric`, `data frame`,\
    \ `factor`, `list`, `matrix`, `vector`  \nCode refactoring  \nComprehensive R\
    \ Network (CRAN)  \nCustom R packages: build tab, code completion, datasets adding,\
    \ description, documentation with `Roxygen2`, `hello.R`, `hellor.Rd`, RStudio\
