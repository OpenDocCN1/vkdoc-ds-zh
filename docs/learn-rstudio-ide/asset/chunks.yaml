  trans: "\n### 函数\n\n函数是一种对象，其中包含一段代码块，该代码块可通过你提供的输入来执行。这些对象是遵循“一次编写代码”最佳实践的好方法。通常，任何你觉得可以在整个项目中重复使用的代码块，都可以封装成一个函数以备后用。以下是创建函数对象的方法：\n\
    \n```\nmy_fun <- function(x, y) {\nr = x * 2 + y\nr\n}\n```\n\n花括号`{`和`}`之间的代码构成了函数的主体。在这些花括号内部，你可以创建新对象，并引用那些在函数中声明为参数的对象。参数是在`function`关键字后的括号内，以逗号分隔的列表形式声明的。函数也可以使用在函数外部声明的对象，只要这些对象在函数之前已被声明即可。\n\
    \n包含参数列表和代码块的函数被赋值给`my_fun`对象。我们可以通过在控制台中输入对象名来检查该函数，从而获得函数代码的打印输出。\n\n要使用该函数，我们必须输入函数名，后跟以逗号分隔的参数列表，示例如下：\n\
    \n```\nmy_fun(3, 189)\n```\n\n这会返回数值对象`195`。在函数内部，每一行代码都会被执行，并且最后一行代码的结果会被返回给调用者。`my_fun`中的最后一行代码是计算结果。\n\
    \n未赋值给对象名的函数称为匿名函数，通常用作诸如`lapply`或`sapply`等函数的参数。这些函数的运行方式相同，但不像标准函数那样需要重复使用。\n\
    \n### 导入 JSON 数据\n\nJSON（JavaScript Object Notation）是一种数据格式，与 csv 或其他二维数据格式相比，一些程序员可能不太熟悉。JSON\
    \ 数据格式的设计目标是能够以文本格式轻松发送，同时保持结构化格式。\n\n以下是一个 JSON 数据示例：\n\n```\n[{\"year\":2015,\"\
    race\":\"All Races\",\"sex\":\"Both Sexes\",\"death\":733.1},{\"year\":2014,\"\
    race\":\"All Races\",\"sex\":\"Both Sexes\",\"life\":78.9,\"death\":724.6},{\"\
    year\":2013,\"race\":\"All Races\",\"sex\":\"Both Sexes\",\"life\":78.8,\"death\"\
    :731.9},{\"year\":2012,\"race\":\"All Races\",\"sex\":\"Both Sexes\",\"life\"\
    :78.8,\"death\":732.8},{\"year\":2011,\"race\":\"All Races\",\"sex\":\"Both Sexes\"\
    ,\"life\":78.7,\"death\":741.3},{\"year\":2010,\"race\":\"All Races\",\"sex\"\
    :\"Both Sexes\",\"life\":78.7,\"death\":747}]\n```\n\n这是我们在本书中使用的预期寿命数据的一部分。你可能能大致理解这些数据，但它远非一种友好的格式。\n\
    \n要处理此类数据，你可以使用`jsonlite`包。使用以下代码安装这个包：\n\n```\ninstall.packages(\"jsonlite\"\
    )\n```\n\n现在，假设我们将上面的 JSON 数据存储在一个名为`life_json`的对象中，我们可以通过下面这行简单的代码将数据转换为整洁的格式，以便使用：\n\
    \n```\nlibrary(tidyverse)\nlibrary(jsonlite)\nlife <- fromJSON(life_json)\n```\n\
    \n我们在上面包含了库引用。你可以通过在命令行中输入对象名`life`来检查结果，从而得到这个数据框：\n\n```\nyear      race   \
    \     sex death life\n1 2015 All Races Both Sexes 733.1   NA\n2 2014 All Races\
    \ Both Sexes 724.6 78.9\n3 2013 All Races Both Sexes 731.9 78.8\n4 2012 All Races\
    \ Both Sexes 732.8 78.8\n5 2011 All Races Both Sexes 741.3 78.7\n6 2010 All Races\
    \ Both Sexes 747.0 78.7\n```\n\n`jsonlite`包中的`fromJSON`函数自动将文件转换为数据框。此函数会自动返回它能提取的最顶层的对象。由于我们的数据恰好适合放入一个数据框，所以我们就得到了数据框。然而，如果底层数据框不符合这种结构，你可能最终会得到一个反映\
    \ JSON 文件结构的列表对象。\n\n## 结论\n\n在本章中，我们提供了关于 R 编程的足够信息，以帮助你入门，并确保你能跟上本书的进度。你现在应该理解了\
    \ R 中的对象、流程控制和函数。此外，关于必备 R 包的章节和关于 JSON 的部分，如果你过去曾进行过数据分析，将为你的学习奠定坚实的基础。\n\n对于刚接触数据分析和/或编程的读者，你可能会发现自己需要更多帮助。编程需要大量的练习，并且一开始需要一些理解。通过查看其他程序员的数据分析工作，你可能会有所收获。在\
    \ Github 等网站上有许多可用的示例。\n\n完全初学编程的读者可能需要花些时间学习基本的编程知识。如果这本书是你第一次接触循环、函数和对象等概念，那么你应该考虑参加本地或在线\
    \ R 编程课程。\n\n对于所有人，我们希望本书及本章的内容能帮助你了解可用的工具，从而真正开始为你所从事的工作提供你想要的洞察。祝你好运，希望你能享受进入数据科学技术领域的旅程！\n\
    \n### 索引\n\n#### A, B, C\n\n类类型：`character`, `numeric`, `data frame`, `factor`,\
    \ `list`, `matrix`, `vector`  \n代码重构  \n综合 R 网络（CRAN）  \n自定义 R 包：构建选项卡、代码补全、添加数据集、描述、使用`Roxygen2`编写文档、`hello.R`、`hellor.Rd`、RStudio\
    \ 菜单、用例  \n\n#### D, E\n\n数据探索：过滤后的`data frame`、按年份的预期寿命、基础 R 的`plot`函数、R 的`unique`函数、`summary`函数\
    \  \n数据可视化：D3、`ggplot2`（参见`ggplot2`）、`htmlwidgets`、`r2d3`  \n调试器  \n`dplyr`包 \
    \ \n\n#### F\n\n文件查看器  \n流程控制：`for`循环、函数、`apply`、`if-then`语句、循环、`sapply`函数、`while`循环\
    \  \n函数  \n\n#### G, H\n\n`ggplot2`：空白画布、`geom_line`动词、`geom_point`动词、`library`函数、折线图\
    \  \ngit：分支、提交更改、Diff 查看器、集成、查看器、仓库设置、版本控制、源码控制查看器  \n\n#### I\n\n`inner_join`\
    \ dplyr 动词  \n安装 R：CRAN、git、Linux、Mac、Windows  \nLinux、Mac、RStudio、Windows  \n\
    集成开发环境（IDE）  \n交互式 R 控制台：连接选项卡、数据集、环境选项卡、Hello World、历史选项卡、导入数据、R 的`head`函数、终端选项卡、向量\
    \  \n\n#### J, K, L\n\nJSON 数据，导入  \n\n#### M\n\n`magrittr`包  \n\n#### N\n\n国家卫生统计中心\
    \  \n\n#### O\n\n组织数据集：数据框下载、预期寿命数据导入、数据集  \n\n#### P, Q\n\nPDF/HTML 报告  \n\n\
    #### R\n\nR 代码文件：检索代码、R 脚本编辑器  \nR Markdown：文档格式类型、转义 HTML、报告、嵌入图形、编织为 HTML、渲染、可重现性、RStudio、YAML\
    \  \nR 包  \nRStudio 项目：代码编辑选项、创建、`devtools`、目录、预期寿命、选项、Rcpp、快捷键、Spark、类型  \nRStudio\
    \ 视图：数据整理、文件选项卡、帮助选项卡、包选项卡、在 R 中绘图、图表视图、`View`函数、查看器选项卡  \n\n#### S\n\n`select`\
    \ dplyr 动词  \nShiny R 仪表板：应用定制、服务器、用户界面  \n类似 SQL 的连接  \n`stringr`包  \n\n####\
    \ T, U, V, W, X\n\n`tibble`包  \n`Tidyverse`包  \n\n#### Y, Z\n\nYAML（另一种标记语言）\n"
