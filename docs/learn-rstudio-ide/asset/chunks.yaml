    \n```\n# Hello, world!\n#\n# This is an example function named 'hello'\n# which\
    \ prints Hey there!.\n#\n#' @name hello\n#' @aliases hello\n#' @title Hello World\n\
    #' @usage hello()\n#' @description  Prints 'Hey there!'\n#' @examples hello()\n\
    hello <- function() {\nprint(\"Hey there!\")\n}\n```\n\nNow when you build your\
    \ R package your help documentation will reflect the content that you included\
    \ above as pictured in Figure [10-5](#478254_1_En_10_Chapter.xhtml#Fig5).\n\n\
    ![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig5_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig5_HTML.jpg)\n\
    \nFigure 10-5\n\nCustom help documentation\n\nIn the help file, we changed the\
    \ description field to reflect that the hello world message was changed in the\
    \ function.\n\n### Adding Datasets to R Packages\n\nYou can include datasets as\
    \ well as functions in your packages. All you need to do is add a “data” folder\
    \ to your R package and then put your datasets into that folder. These datasets\
    \ can be R dataframes or raw datafiles of any type. For the life expectancy project,\
    \ we simply copied the data folder that includes the csv file that was downloaded\
    \ from the [data.​gov](http://data.gov) website. Then this code was used to save\
    \ this dataset as an R dataframe.\n\n```\nlibrary(readr)\nlife_expectancy <- read_csv(\"\
    data/NCHS_-_Death_rates_and_life_expectancy_at_birth.csv\")\n# Clean up dataframe\n\
    # Use shorter column names\nnames(life_expectancy)[1] <- \"year\"\nnames(life_expectancy)[2]\
    \ <- \"race\"\nnames(life_expectancy)[3] <- \"sex\"\nnames(life_expectancy)[4]\
    \ <- \"life_expectancy\"\nnames(life_expectancy)[5] <- \"death_rate\"\nsave(life_expectancy,\n\
    file =\"data/life_expectancy.rdata\")\n```\n\nNext, click “Clean and Rebuild”\
    \ in the Build view to rebuild the life package. Once this process is complete,\
    \ you can access the dataset using this code from any RStudio project:\n\n```\n\
    library(life)\nhead(life_expectancy)\n```\n\nThis will show you the beginning\
    \ of this dataset and more importantly, we can use this code from any analysis\
    \ without re-running our life expectancy analysis.\n\n### Code Completion\n\n\
    As you type in code into RStudio, you may see that code suggestions will pop up\
    \ with as you type. Code from your RStudio packages will follow this pattern as\
    \ well. Also, you can quickly see what data and functions are available by typing\
    \ in the name of the package followed by two semi-colons as pictured in Figure\
    \ [10-6](#478254_1_En_10_Chapter.xhtml#Fig6).\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig6_HTML.jpg](images/478254_1_En_10_Chapter/478254_1_En_10_Fig6_HTML.jpg)\n\
    \nFigure 10-6\n\nR Package code completion\n\nIn the code above, we typed `life::`\
    \ which is a way of filtering all the content that belongs to the life package.\
    \ You can do this for any R package to see what functions are included with what\
    \ packages. Your description field from your help documentation will also show\
    \ up as you type as a tooltip."
  trans: "\n### `hello.R`\n\n所有你想要发布的代码都应放置在 `R` 文件夹中，就像 `hello.R` 一样。当你创建 R 包项目时，这个文件会被打开，你可以看到以下内容。\n\
    \n```\n# Hello, world!\n#\n# This is an example function named 'hello'\n# which\
    \ prints 'Hello, world!'.\n#\n# You can learn more about package authoring with\n\
    # RStudio at:\n#\n#   http://r-pkgs.had.co.nz/\n#\n# Some useful keyboard shortcuts\
    \ for package\n# authoring:\n#\n#   Install Package:           'Cmd + Shift +\
    \ B'\n#   Check Package:             'Cmd + Shift + E'\n#   Test Package:    \
    \          'Cmd + Shift + T'\nhello <- function() {\nprint(\"Hello, world!\")\n\
    }\n```\n\n这非常简单，但足以演示 R 包的构建过程是如何工作的。你可以将想要发布的函数放在这里，使其可用。一个良好的实践是在 `R` 文件夹中每个函数对应一个文件。\n\
    \n### `DESCRIPTION`\n\n`DESCRIPTION` 文件提供了包的元数据。你可以在这里记录标题、描述、版本以及你的联系方式。只需点击文件将其打开，并用你\
    \ R 包的相关信息替换相应字段即可。\n\n```\nPackage: life\nType: Package\nTitle: Shows Life Expectancy\
    \ Trends Since 1900\nVersion: 0.1.0\nAuthor: Matt\nMaintainer: Matt \nDescription:\
    \ Includes datasets and helper functions to help present information on life expectancy\
    \ rates.\nLicense: None\nEncoding: UTF-8\nLazyData: true\nRoxygenNote: 6.1.1\n\
    ```\n\n为了跟随演示，你不需要修改此文件，但当你准备发布时，请确保这些字段包含相关信息。\n\n### `hello.Rd`\n\n`hello.Rd`\
    \ 是 R 的帮助文档文件。此文件会根据你包含在函数中的文档自动生成。我们稍后会详谈如何编写代码文档。\n\n此处信息会出现在你在 **`帮助`** 窗格中阅读的包文档中。标题也会作为\
    \ RStudio 中代码补全的一部分出现，这样当你在编写一行代码时，你的内容就会直接显示在编辑器屏幕上。这是一种非常方便的方式，能在团队成员可能需要的时候，立刻为他们提供上下文。让我们来构建这个\
    \ R 包，以便了解这一切是如何运作的。\n\n### 构建 R 包\n\n当你使用 R 包项目时，右上角视图会多出一个名为 **`构建`** 的选项卡。此选项卡为你提供了一些构建\
    \ R 包的选项。转到此选项卡，点击 **`更多`**，然后选择 **`清理并重新构建`**，如图 10-2 所示。\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig2_HTML.jpg](img/478254_1_En_10_Fig2_HTML.jpg)\n\
    \n**图 10-2** 构建视图\n\n这将构建并打包你的代码。如果某些必需的库尚未安装，RStudio 会提示你进行安装。按照对话框向导安装所有必需的包。\n\
    \n现在你已经构建并安装了你的包，你可以像这样使用该函数：\n\n```\nlibrary(life)\nhello()\n```\n\n这段简单的代码会在你的控制台中打印\
    \ `Hello, world!`。如果你想改变这个函数的行为，只需修改 `hello.R` 文件中的代码，然后重新构建该包即可。请尝试修改这个函数并查看结果。\n\
    \n你也可以在其它 RStudio 项目中使用相同的方式使用这些函数。这就是 R 包促进代码复用的方式。让我们继续为我们的预期寿命分析添加一些特性，以便更好地展示\
    \ R 包的功能。\n\n### R 包文档\n\n你可以通过使用 `roxygen2` 包来为你的 R 包添加注释。首先，你需要使用命令 `install.packages(\"\
    roxygen2\")` 来安装该包。这将安装 `roxygen2` 库及其任何必需的辅助包。\n\n下一步是配置构建工具。转到构建视图，然后选择 **`更多`**，再选择\
    \ **`配置构建工具...`**。你会看到一个类似图 10-3 所示的对话框。\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig3_HTML.jpg](img/478254_1_En_10_Fig3_HTML.jpg)\n\
    \n**图 10-3** 配置构建工具\n\n勾选 **`使用 Roxygen 生成文档`** 复选框。然后点击 **`配置...`** 按钮，弹出图 10-4\
    \ 所示的对话框。\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig4_HTML.jpg](img/478254_1_En_10_Fig4_HTML.jpg)\n\
    \n**图 10-4** Roxygen 构建选项\n\n确保勾选 **`安装并重启`** 复选框。现在，当你构建 R 包时，文档将根据你提供的字段自动生成。你使用包含反引号\
    \ `#'` 的特殊注释来包含文档。每个字段名都以 `@` 开头。一些常见的字段类型包括 `@name`、`@title` 和 `@description`。例如，以下是你可能包含在\
    \ `hello` 函数文档中的内容：\n\n```\n# Hello, world!\n#\n# This is an example function\
    \ named 'hello'\n# which prints Hey there!.\n#\n#' @name hello\n#' @aliases hello\n\
    #' @title Hello World\n#' @usage hello()\n#' @description  Prints 'Hey there!'\n\
    #' @examples hello()\nhello <- function() {\nprint(\"Hey there!\")\n}\n```\n\n\
    现在，当你构建 R 包时，你的帮助文档将反映你上面包含的内容，如图 10-5 所示。\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig5_HTML.jpg](img/478254_1_En_10_Fig5_HTML.jpg)\n\
    \n**图 10-5** 自定义的帮助文档\n\n在帮助文件中，我们修改了描述字段，以反映函数中 `Hello, world!` 消息已被更改。\n\n###\
    \ 向 R 包添加数据集\n\n你可以在包中包含数据集和函数。你只需要在你的 R 包中添加一个 `data` 文件夹，然后将你的数据集放入该文件夹即可。这些数据集可以是\
    \ R 数据框，也可以是任何类型的原始数据文件。对于预期寿命项目，我们只是复制了包含从 `data.gov` 网站下载的 csv 文件的数据文件夹。然后使用以下代码将此数据集保存为\
    \ R 数据框。\n\n```\nlibrary(readr)\nlife_expectancy <- read_csv(\"data/NCHS_-_Death_rates_and_life_expectancy_at_birth.csv\"\
    )\n# Clean up dataframe\n# Use shorter column names\nnames(life_expectancy)[1]\
    \ <- \"year\"\nnames(life_expectancy)[2] <- \"race\"\nnames(life_expectancy)[3]\
    \ <- \"sex\"\nnames(life_expectancy)[4] <- \"life_expectancy\"\nnames(life_expectancy)[5]\
    \ <- \"death_rate\"\nsave(life_expectancy,\nfile =\"data/life_expectancy.rdata\"\
    )\n```\n\n接下来，在 **`构建`** 视图中点击 **`清理并重新构建`** 来重新构建 `life` 包。一旦此过程完成，你可以使用以下代码从任何\
    \ RStudio 项目访问该数据集：\n\n```\nlibrary(life)\nhead(life_expectancy)\n```\n\n这将显示该数据集的前几行，更重要的是，我们可以在任何分析中使用此代码，而无需重新运行我们的预期寿命分析。\n\
    \n### 代码补全\n\n当你在 RStudio 中输入代码时，你可能会看到代码建议随着你的输入弹出。你的 R 包中的代码也会遵循这种模式。此外，你也可以像图\
    \ 10-6 所示那样，通过输入包名后跟两个分号来快速查看可用的数据和函数。\n\n![../images/478254_1_En_10_Chapter/478254_1_En_10_Fig6_HTML.jpg](img/478254_1_En_10_Fig6_HTML.jpg)\n\
    \n**图 10-6** R 包代码补全\n\n在上面的代码中，我们键入了 `life::`，这是一种过滤属于 `life` 包的所有内容的方法。你可以对任何\
    \ R 包执行此操作，以查看哪些函数包含在哪些包中。当你输入时，你帮助文档中的描述字段也会作为工具提示显示出来。\n"
- fmt: '# Conclusion


    In this chapter, we discussed how to create custom `R` packages to share our work
    with our team and beyond. `R` packages are a great way to encourage code reuse
    and provide a vehicle to document and package our work so that we can extend the
    life of our code beyond our own projects.


    # 11. Code Tools


    `RStudio` includes tools that help you write, debug, and keep track of your code.
    We have already seen code tools that are built right into the `RStudio` editor
    such as code complete, syntax highlighting, and tooltips. We can also include
    `git` support to help keep track of versions of our code files, refactoring support
    to help edit our code, and debugging tools which help us step through and inspect
    code.


    ## Source Control Integration


    Source control is a system that you can use to keep track of changes that you
    make to your code files. `RStudio` supports integration with two source control
    providers: Subversion and Git. Both provide the essential feature of keeping track
    of changes you make through versions of your code.


    If you already use source control, then you will appreciate the integration `RStudio`
    offers. However, if source control has never been a part of your workflow then
    the value of source control may not be immediately obvious. While it’s a best
    practice to use source control, it is not a required feature of all projects.
    Still, it is a good idea to try to add this into your workflow.


    ### Setup Git


    In this chapter, we will assume that you are using `git` and have this system
    installed on your computer. If not, please refer to Chapter 1 to install `git`.
    There are a few steps required to make sure `RStudio` knows how to use source
    control for you.


    We need to indicate that we are using `git` in `RStudio`’s preferences area. Go
    to the `RStudio` menu bar and choose “RStudio” and “Preferences” to get the dialog
    box that appears in Figure 11-1.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig1_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig1_HTML.jpg)


    Figure 11-1


    Setup Version Control


    Check the box titled “Enable version control interface for RStudio projects” and
    make sure to provide the path to your installation of `git`. This path depends
    on your computer and where you choose to install `git`; the path shown is the
    default folder for Mac installs.


    #### Add Project to Git Repository


    To add `git` to a project, you will need to use your Terminal by clicking the
    Terminal tab in `RStudio`. Then type in the command `git init` and press return.
    This creates a new `git` repository in the folder where our project is located.
    We can simply use `git` from the Terminal like this or with the integrated `RStudio`
    tools. While we are here let’s add the files in this folder into our new `git`
    repository and then commit them:


    ```

    git add .

    git commit -m "initial commit"

    ```


    These two commands add all our files into the repository and then commit them
    with the message “initial commit”.


    #### Git Viewer


    Now, we will need to restart `RStudio` so we can see the `git` integration viewer
    appear as pictured in Figure 11-2.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig2_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig2_HTML.jpg)


    Figure 11-2


    Version control viewer


    When you make changes to a code file, the file will appear in this window. For
    instance, if I decided to make some changes to my “process_data.R” file you would
    see the source control viewer update to reflect this as seen in Figure 11-3.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig3_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig3_HTML.jpg)


    Figure 11-3


    Modified Files in Repository


    Now we can see that two files appear in the `git` viewer. We expected “process_data.R”
    to appear, but not the second file with the long file path name. The blue “M”
    icon next to these two files means that these files were modified. Let’s take
    a look at the changes in the first file.


    #### Git Diff Viewer


    Click the checkbox next to each of these files and then click the “Diff” button
    in the top left area of the viewer. A new screen like the one pictured in Figure
    11-4 will appear.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig4_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig4_HTML.jpg)


    Figure 11-4


    Diff Screen


    On this screen, you will be presented with the differences in the files. The white
    space shows the content that are in both files. The red space shows the content
    in the previous version of the file (that is about to be deleted) and the green
    content shows the new additions to the file.


    Use the list in the upper left-hand area to navigate between the two files that
    are changed. If you looked at the other file, you would see that the changes have
    to do with the state of our code editor which is not that important and can be
    ignored (we will see how to ignore files in a moment).


    If you click the “History” button at the top, you will see the history of all
    changes made to this file since we started working on it. From this point in the
    workflow, we can either get rid of these changes or we can commit the changes
    to our repository.


    #### Committing Changes


    To commit the changes, we can type in a “commit message” in the upper right-hand
    area of the screen and then click the “Commit” button as pictured in Figure 11-5.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig5_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig5_HTML.jpg)


    Figure 11-5


    Commit changes to the repository


    We could have removed the changes by clicking the “Revert” button instead of the
    “Commit” button.


    #### Git Branches


    `Git` has support for branches. You can create a branch when you want to make
    changes to a copy of your project so that you can test new features without affecting
    your original code. If you work on a branch and then later decide that you would
    like to keep the new feature, you have the ability to “merge” the branch into
    your original project.


    You can name new branches anything that you want, often you might use the name
    of the feature or bug you are working on. Your original source branch is named
    “master”. The `git` workflow that you generally follow is to create a new branch
    from the `master` branch, work on the new branch and if the new branch meets your
    requirements you will merge it back into the `master`.


    `RStudio` includes support for creating new branches and switching between branches.
    Use the buttons highlighted in Figure 11-6 to add new branches and to switch branches.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig6_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig6_HTML.jpg)


    Figure 11-6


    Managing git branches


    The first button is used to create branches and the second is used to switch branches.
    When you switch branches all the code in your project will be replaced with the
    code from the branch.


    You can get a picture of all the branches in your repository by clicking the “Diff”
    button, then the “History” button, and then choosing “(all branches)” in the space
    right next to the “History” button. In Figure 11-7, an example of a project with
    a `master` branch and a “new_feature” branch is shown.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig7_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig7_HTML.jpg)


    Figure 11-7


    Git branches


    You can use this tool to navigate through and visualize the differences in your
    branches and to see the history of changes in the project. `RStudio` does not
    have support for all `git` features. If you want to delete branches or merge branches
    you will need to use the Terminal tab and look up the appropriate commands.'
