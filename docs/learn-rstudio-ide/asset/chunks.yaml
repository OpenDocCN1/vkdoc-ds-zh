    \n在我们继续之前，让我们重点介绍 DT 包的数据表格组件。数据表格是一个非常有用的交互式 html 小组件，它将为您的数据集创建一个可搜索的 HTML 展示。例如，如果我们想直接向用户提供一个可搜索版本的数据集，我们可以简单地这样做：\n\
    \n```\nlibrary(DT)\ndatatable(expectancy,\n          options = list(pageLength\
