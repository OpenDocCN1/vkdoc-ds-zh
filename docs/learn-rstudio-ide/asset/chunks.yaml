- fmt: '### R Markdown Reproducibility


    When we say our analysis is reproducible, we mean that we should be able to rerun
    a report and get exactly the same result as we had in the past. Our analysis should
    not depend on any ad-hoc commands we typed into the command line. In order to
    make sure our analysis is reproducible, lets run the `source` command and load
    the file we used to import our `expectancy` dataset. Replace the R code block
    with this and include a summary of our dataset.


    ```r

    ```{r get_data}

    source("process_data.R")

    summary(expectancy)

    ```

    ```


    We did a few things in the code block above. We changed the label to `"get_data"`,
    we used `source()` to execute all the code saved in `"process_data.R"` and we
    are showing a summary of the `expectancy` dataset. When we knit the Markdown file,
    the summary of the `expectancy` dataset will appear instead of the `cars` dataset.


    More importantly, the other code in the R Markdown document will be able to reference
    in the `expectancy` dataset in the same way we did earlier. All the data processing
    rules we followed before will be executed each time we knit a new output document.


    You might want to offer your users a glimpse into the dataset like we did in the
    Data Visualization chapter. You can simply copy your code from the last chapter
    and wrap it in a code block like this:


    ```

    ## Expectancy Dataset Sample

    Below you will find a widget that you may use to few the contents of the data
    `expectancy` dataset. This is the dataset that will be explored later on in this
    analysis.

    ```{r}

    library(DT)

    datatable(expectancy,

    options = list(pageLength = 5))

    ```

    ```


    Here we mix Markdown commentary along with a block of R code to produce the display
    that we can see in Figure [8-6](#478254_1_En_8_Chapter.xhtml#Fig6).


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig6_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    HTML data table widget in R Markdown document


    Finally, let’s add the plot of life expectancy rates over years. This time, we
    may want to hide the R code block from our users so we will include these two
    directives `echo=FALSE` and `message=FALSE`.


    ```

    ## Life Expectancy Plot

    The plot below shows life expectancy by year for all sexes.

    ```{r echo=FALSE, message=FALSE}

    library(plotly)

    i_plot %

    filter(race == "All Races") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line(aes(color = sex))

    ggplotly(i_plot)

    ```

    ```


    As you can see, life expectancy rises for everyone from 1900 to 2015. Women have
    a higher life expectancy than men and both groups follow the same upward trend
    while maintaining a difference between the two groups.


    The first directive prevents the code from displaying while the second prevents
    any messages that might appear because we are loading a library in the document.
    The result is pictured in Figure [8-7](#478254_1_En_8_Chapter.xhtml#Fig7).


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig7_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Plotly widget in R Markdown document


    ## Conclusion


    R Markdown provides a powerful report generation system. This chapter has only
    scratched the surface to what is available to you as a report writer. This will
    be your reporting workhorse as you develop analytics that may be shared throughout
    your organization.


    # 9. Shiny R Dashboards


    R Markdown and `htmlwidgets` will give you the ability to create rich and even
    interactive experiences with popovers. However, some use cases require more than
    what these types of static tools can provide. For instance, you may need to ask
    users to supply parameters that will be used in an analysis, connect to a backend
    database, or execute new R scripts as the user explores your analysis.


    You can use Shiny in RStudio to create these types of data dashboards that have
    a rich functionality that is completely integrated with your R system. Shiny is
    a package used to create interactive web apps in R. These apps can be used in
    an RStudio project, added to an R Markdown report, or published online as a web
    app. Shiny provides an easy to use framework to develop these apps, and you can
    extend Shiny even further with your own CSS and JavaScript code.


    ## New Shiny Apps


    It is very easy to add a Shiny app to your RStudio project. Simply go to the RStudio
    menu bar and then choose `"File"`, `"New File"`, and then `"Shiny Web App..."`.
    A dialog box like the one pictured in Figure [9-1](#478254_1_En_9_Chapter.xhtml#Fig1)
    will appear.


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig1_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    New Shiny app


    You can name your app and choose if you want the code in one or two files. Click
    the `"Create"` button to build the web app.


    RStudio will create a new folder in your project with the name that you provided
    in the dialog. If you choose `"Single File"`, a new file named `"app.R"` will
    appear and automatically open in your editor view as pictured in Figure [9-2](#478254_1_En_9_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig2_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    `app.R` contents


    The code that appears is a template that RStudio creates for you as a starting
    point. This is a working Shiny App that uses the built-in R datasets just as an
    example. Click the `"Run App"` button shown in Figure [9-2](#478254_1_En_9_Chapter.xhtml#Fig2)
    to run the web app. The app will start to run in a local web server that is managed
    by R as you can see pictured in Figure [9-3](#478254_1_En_9_Chapter.xhtml#Fig3).


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig3_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig3_HTML.jpg)


    Figure 9-3


    Shiny App running locally


    This histogram is very interactive, when you adjust the slider control on the
    left R code is executed to recreate the histogram on the right. This is a step
    beyond simply including popovers that are pre-baked into a static report.


    Along the top of Figure [9-3](#478254_1_En_9_Chapter.xhtml#Fig3), you will see
    an HTTP address and an `"Open in Browser"` button. This app is running in a web
    server, so you can view the app using your regular browser by either clicking
    the `"Open in Browser"` button or typing in the HTTP address into your browser’s
    address bar.


    You may also notice that there is a `"Publish"` button at the right. Shiny apps
    are published to a web site so that they can be made available for anyone to use.
    These apps can be public either with the service that RStudio provides or you
    can manage a private server from your business. To get a free account to publish
    your apps, head to [`https://www.shinyapps.io`](https://www.shinyapps.io) to sign
    up.


    ## Understanding Shiny


    Shiny can be used to create dashboards that use R scripts and are accessible on
    the web fairly easily. However, like most R packages you can go much deeper into
    the system to build truly custom experiences. We will discuss the basics here
    to give you a good starting point with Shiny, but to really master this package
    head over to [`https://shiny.rstudio.com/`](https://shiny.rstudio.com/) to see
    tutorials and documentation that shows what is possible with Shiny.


    Shiny code is separated into two areas of distinct responsibility: the user interface
    and the server. This is also called the `"front end"` and the `"back end"`. The
    idea is that the visual user interface elements like sliders and buttons belong
    to front end part of the app, while the number crunching and data analysis belong
    to the back end part of the app.


    In the code we generated, there is only one file that contains both the user interface
    and the server. You will also see these two components separated out in their
    own file depending on what options you choose or who originally coded the app.'
  raw: '### R Markdown Reproducibility


    When we say our analysis is reproducible, we mean that we should be able to rerun
    a report and get exactly the same result as we had in the past. Our analysis should
    not depend on any ad-hoc commands we typed into the command line. In order to
    make sure our analysis is reproducible, lets run the `source` command and load
    the file we used to import our `expectancy` dataset. Replace the r code block
    with this and include a summary of our dataset.


    ```

    ```{r get_data}

    source("process_data.R")

    summary(expectancy)

    ```

    ```


    We did a few things in the code block above. We changed the label to “get_data”,
    we used source to execute all the code saved in “process_data.R” and we are showing
    a summary of the `expectancy` dataset . When we knit the Markdown file, the summary
    of the expectancy dataset will appear instead of the `cars` dataset.


    More importantly, the other code in the R Markdown document will be able to reference
    in the `expectancy` dataset in the same way we did earlier. All the data processing
    rules we followed before will be executed each time we knit a new output document.


    You might want to offer your users a glimpse into the dataset like we did in the
    Data Visualization chapter. You can simply copy your code from the last chapter
    and wrap it in a code block like this:


    ```

    ## Expectancy Dataset Sample

    Below you will find a widget that you may use to few the contents of the data
    expectancy dataset. This is the dataset that will be explored later on in this
    analysis.

    ```{r}

    library(DT)

    datatable(expectancy,

    options = list(pageLength = 5))

    ```

    ```


    Here we mix Markdown commentary along with a block of r code to produce the display
    that we can see in Figure [8-6](#478254_1_En_8_Chapter.xhtml#Fig6).


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig6_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    HTML data table widget in R Markdown document


    Finally, let’s add the plot of life expectancy rates over years. This time, we
    may want to hide the r code block from our users so we will include these two
    directives `echo=FALSE` and `message=FALSE`.


    ```

    ## Life Expectancy Plot

    The plot below shows life expectancy by year for all sexes.

    ```{r echo=FALSE, message=FALSE}

    library(plotly)

    i_plot %

    filter(race == "All Races") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line(aes(color = sex))

    ggplotly(i_plot)

    ```

    ```


    As you can see, life expectancy rises for everyone from 1900 to 2015. Women have
    a higher life expectancy than men and both groups follow the same upward trend
    while maintaining a difference between the two groups.


    The first directive prevents the code from displaying while the second prevents
    any messages that might appear because we are loading a library in the document.
    The result is pictured in Figure [8-7](#478254_1_En_8_Chapter.xhtml#Fig7).


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig7_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Plotly widget in R Markdown document


    ## Conclusion


    R Markdown provides a powerful report generation system. This chapter has only
    scratched the surface to what is available to you as a report writer. This will
    be your reporting workhorse as you develop analytics that may be shared throughout
    your organization.


    # 9. Shiny R Dashboards


    R Markdown and `htmlwidgets` will give you the ability to create rich and even
    interactive experiences with popovers. However, some use cases require more than
    what these types of static tools can provide. For instance, you may need to ask
    users to supply parameters that will be used in an analysis, connect to a backend
    database, or execute new R scripts as the user explores your analysis.


    You can use Shiny in RStudio to create these types of data dashboards that have
    a rich functionality that is completely integrated with your R system. Shiny is
    a package used to create interactive web apps in R. These apps can be used in
    an RStudio project, added to an R Markdown report, or published online as a web
    app. Shiny provides an easy to use framework to develop these apps, and you can
    extend Shiny even further with your own CSS and JavaScript code.


    ## New Shiny Apps


    It is very easy to add a Shiny app to your RStudio project. Simply go to the RStudio
    menu bar and then choose “File”, “New File”, and then “Shiny Web App…”. A dialog
    box like the one pictured in Figure [9-1](#478254_1_En_9_Chapter.xhtml#Fig1) will
    appear.


