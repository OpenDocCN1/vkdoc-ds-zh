    \ package  \n\n#### N\n\nNational Center for Health Statistics  \n\n#### O\n\n\
    Organizing datasets: data frame download, life expectancy data import, dataset\
    \  \n\n#### P, Q\n\nPDF/HTML reports  \n\n#### R\n\nR code files: retrieve code,\
    \ R script editor  \nR markdown: document format types, escape HTML, report, imbed\
