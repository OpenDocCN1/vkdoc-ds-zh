    //\nvar barHeight = Math.ceil(height / data.length);\nsvg.selectAll('rect')\n\
    \  .data(data)\n  .enter().append('rect')\n  .attr('width', function(d) { return\
    \ d * width; })\n  .attr('height', barHeight)\n  .attr('y', function(d, i) { return\
    \ i * barHeight; })\n  .attr('fill', 'steelblue');\n```\n\n此文件中的代码是 Javascript，您可以通过修改此代码来调整可视化效果。保存此文件并点击“Preview”按钮来查看\
    \ D3 可视化的效果。与我们前面强调的预打包解决方案相比，它看起来并不起眼，但这没关系，因为 D3 实际上更像是提供了一块供您绘制的画布，而不是一组绘图小组件。\n\
    \n预览功能仅使用了文件注释中的代码，但如果您更希望从 R 脚本文件中提供自己的数据，则可以使用 `r2d3` 库。\n\n```\nlibrary(r2d3)\n\
    r2d3(data = c(.1,.2,.3,.4,.3,.2,.1),\n     script = \"d3_plot.js\")\n```\n\n这段代码将生成图\
    \ 7-7 中的图形。\n\n![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig7_HTML.jpg](img/478254_1_En_7_Fig7_HTML.jpg)\n\
    \n**图 7-7** 基本的 D3 图形\n\n显然，这是一个非常基础的可视化入门。请查看 `r2d3` 网站，了解您可以用 D3 完成的一整套令人惊叹的可视化效果\
    \ [`https://rstudio.github.io/r2d3/articles/gallery.html`](https://rstudio.github.io/r2d3/articles/gallery.html)。这些示例还包含了重现它们所需的代码，以便您可以将其作为自己定制\
    \ D3 可视化的起点。\n\n## 结论\n\n除了基础的 R 语言 `plot` 函数之外，您在 R 中进行数据可视化还有许多选择。`ggplot2`\
    \ 提供了一种非常强大且风格化的方式来满足大多数分析师大部分时间内的需求。像 `r2d3` 和 `htmlwidgets` 这样的软件包则为更专业化的用例提供支持。还有更多专门的可视化选项可用，所有这些功能都可以在我们将在后续章节讨论的仪表板和报告选项中加以利用。\n\
    \n# 8. R Markdown\n\n您使用 R Markdown 来创建整合了前几章所述功能的报告。R Markdown 利用 HTML、CSS 和\
    \ Markdown 等免费可用的开源技术，以多种格式创建丰富的报告。\n\nR Markdown 基于 Markdown，这是一种以人类可读的方式定义文档的简化方法。其理念是，您可以结构化的方式快速记笔记。这些笔记本身可读，但也可以翻译成精美的演示格式，如网页、演示文稿和\
    \ PDF 文件。\n\nRStudio 通过将 R 语言中的代码和图形添加到 Markdown 文档中，扩展了 Markdown。这种类型的 Markdown\
    \ 被称为“R Markdown”。让我们使用我们的预期寿命分析，通过 R Markdown 创建一个可分享的报告。\n"
- fmt: '# R Markdown Documents


    R Markdown is completely supported in RStudio. Not only can you write your notes
    in Markdown, but code that you include can be executed in blocks and displayed
    right on your R Markdown document in real time. To create a new R Markdown document,
    go to the RStudio menu bar and click "File", "New File", and "R Markdown" as shown
    in Figure 8-1.


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig1_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig1_HTML.jpg)


    **Figure 8-1** Adding a new R Markdown document


    In the dialog box that appears as pictured in Figure 8-2, you will be presented
    with options that will determine the type of document that gets generated.


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig2_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig2_HTML.jpg)


    **Figure 8-2** R Markdown options


    Here is where you specify whether you want an HTML or PDF document. There are
    some other less used format types as well that you can experiment with, but generally
    people use PDF or HTML reports.


    RStudio will automatically generate a R Markdown document with template text that
    resembles Figure 8-3.


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig3_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig3_HTML.jpg)


    **Figure 8-3** R Markdown document


    There are four distinct sections in the R Markdown document above. The first six
    lines are called YAML (aka Yet Another Markup Language).


    ```

    ---

    title: "Life Expectancy"

    author: "Matthew Campbell"

    date: "1/22/2019"

    output: html_document

    ---

    ```


    This YAML markup specifies things like the type of output format and author name,
    essentially what you filled out in the dialog box. The next three lines highlighted
    in gray are used to set options required for `knitr`, a package used to render
    R Markdown output.


    ```{r setup, include=FALSE}

    knitr::opts_chunk$set(echo = TRUE)

    ```


    The first line here with the three backticks and curly brackets deserves some
    attention. This is the notation that you use to escape the Markdown code so that
    you can include R code in your document. The format is roughly three backticks,
    an opening curly bracket, the letter `r` followed by a few options and an ending
    curly bracket. In the code above, `setup` is simply a label while `include=FALSE`
    means that the code will be executed but not displayed in the R Markdown output.


    The next few lines of code are basic Markdown.


    ```

    ## R Markdown

    This is an R Markdown document. Markdown is a simple formatting syntax for authoring
    HTML, PDF, and MS Word documents. For more details on using R Markdown see .

    ```


    This is where you write up your findings, procedures, and descriptions of your
    data analysis. The two number signs at the beginning mean "Heading 2" and formatting
    will reflect this in the output document. You can use all the normal Markdown
    features. The creator of Markdown has documented the formatting features available
    to you here: [`https://daringfireball.net/projects/markdown`](https://daringfireball.net/projects/markdown).


    The remaining code is another R chunk; this time the code creates a plot and is
    embedded in the R Markdown output.


    ```{r cars}

    summary(cars)

    ```


    This will output a summary of the built-in `cars` dataset. We will see an example
    of what this looks like in the example covered next.


    ## R Markdown Example


    Let''s illustrate R Markdown by adding some of the work we have done throughout
    this book into a report. Along the way, we will source R script files and imbed
    graphics into the report. Start by saving the new R Markdown document that we
    created with the name `life_expectancy.Rmd`.


    We can start by replacing the boilerplate introduction provided in the template
    with something that describes our work.


    ```

    ## Introduction

    [Life expectancy data](https://catalog.data.gov/dataset/age-adjusted-death-rates-and-life-expectancy-at-birth-all-races-both-sexes-united-sta-1900)
    was downloaded from data.gov. This dataset contains death rates and life-expectancy
    statistics from 1900 to 2015. Exploratory analysis was conducted on this dataset.

    ```


    Now let''s see what the R Markdown output file looks like. Select the menu bar
    at the top of the R Markdown document and then click the "Knit" dropdown and then
    select "Knit for HTML" as pictured in Figure 8-4.


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig4_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig4_HTML.jpg)


    **Figure 8-4** Create HTML output file


    This will take your R and Markdown code and use the R package `knitr` to create
    an HTML report as shown in Figure 8-5.


    ![../images/478254_1_En_8_Chapter/478254_1_En_8_Fig5_HTML.jpg](images/478254_1_En_8_Chapter/478254_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5** R Markdown HTML output


    We now have the beginnings of a nicely formatted report. Of course, we still have
    the `cars` dataset filler showing, but we will address that in the next step.'
