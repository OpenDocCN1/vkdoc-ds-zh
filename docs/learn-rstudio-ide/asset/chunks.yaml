    60 and then multiplied the vector by 4 we would end up with a new vector 80, 120,
    160, 200, and 240.


    ```

    n <- c(20,30,40,50,60)

    n

    [1] 20 30 40 50 60

    n * 4

    [1]  80 120 160 200 240

    ```'
  trans: '

    ## 调试器


    调试是指识别并修复代码中缺陷的过程。最简单的调试方法可能就是将对象值直接打印到控制台屏幕上。然而，当你的分析状态随着每一行代码的执行而发生变化时，这可能会变得令人沮丧。


    为了解决这个问题，RStudio 自带了一个内置工具，允许你设置断点，这些断点会阻止代码继续执行，并让你有机会检查对象的值。


    通过设置断点来使用调试器。只需打开一个代码文件，然后在你希望 R 停止执行的代码行左侧区域点击即可。这个区域被称为“装订区”，如图 11-8 所示。


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig8_HTML.jpg](img/478254_1_En_11_Fig8_HTML.jpg)


    图 11-8


    设置断点


    位于 `i = 2` 代码行旁边的红点就是断点。当我们执行这段代码时，RStudio 将停在这一行，并显示代码调试器，如图 11-9 所示。


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig9_HTML.jpg](img/478254_1_En_11_Fig9_HTML.jpg)


    图 11-9


    关键的调试器功能


    在图 11-9 中，你可以看到所有调试器功能。在左中区域，我们有一组控件，可以用来控制代码的执行。既然我们停在了断点处，我们就可以前进到下一行，继续执行所有代码直到下一个断点，或者停止代码执行。


    在屏幕底部，我们可以使用控制台编写代码来检查项目的当前状态。当你在测试有关代码缺陷的想法时，这是一个很好的功能。你还可以在顶部看到环境窗口，在那里你可以看到环境中所有对象的值。


    通过进入 RStudio 的调试菜单，你还可以获得更多调试选项。特别是前两个选项非常有用，它们允许你切换和清除断点。


    ## 更多代码工具


    RStudio 还附带了一些工具，使你的代码编辑和重构变得稍微容易一些。代码重构是指当你有一个运行中的项目，但你希望稍微整理一下代码时所做的事情。你可能想要更改函数名称、缩进代码或将代码区域提取为可重用的函数。


    前往 RStudio 的标题栏，选择“代码”菜单项，即可查看所有帮助你重构代码的选项。其中一个关键功能是“在作用域内重命名”，使用时，你需要先高亮一个对象，然后选择该菜单。此时，你对对象所做的任何编辑都将反映在该对象在代码文件中的所有出现位置。


    你还可以发现“重新缩进行”和“重新格式化代码”这些选项有助于让你的代码看起来更整洁。当你调用一个函数却不太记得它是在哪里定义的时候，使用“转到函数定义”功能导航代码会容易得多。


    ## 结论


    在本章中，我们重点介绍了 RStudio 自带的一些内置工具，这些工具将帮助你组织和管理代码。Git 用于组织代码并查看代码版本之间的差异。你使用调试器来观察程序在执行代码过程中的状态，以便修复错误。最后，代码菜单为你提供了一系列实用工具，你可以使用它们快速重新格式化代码。


    # 12. R 编程


    在最后一章中，我们将回顾进行 R 编程所需了解的基本概念。本教程绝非全面，也不旨在成为你的首次编程体验。然而，如果你以前有过编程经验，它应该能为你提供足够的知识，让你在
    R 语言中起步。对于完全没有编程经验的读者，可能需要考虑通过诸如 Data Camp 或 Coursera 等平台参加关于此主题的强化课程。


    ## 对象


    在 R 语言中，一切都是对象。一个对象可以是一个数字列表、一个函数、一个图形或一个分析结果。存在不同类型的对象，例如列表、数据框和字符。


    你可以使用赋值运算符 `<-` 创建对象。左边是你选择的一个名称，接着是赋值运算符 `<-`，然后是定义对象的代码。你可以像这样创建一个数值对象：


    ```

    a <- 9

    ```


    第一部分 `a` 是我们为对象选择的名称，后面跟着赋值运算符 `<-`，然后是一个值 `9`。现在，我们在代码中通过直接使用字母 `a` 来引用这个对象。例如，如果我们想知道如何将
    `a` 的值翻倍，我们可以这样做：


    ```

    a * 2

    ```


    这将在控制台打印出 `18`。在 R 语言中，对象可以是不同的类型。上面的对象 `a` 是 `numeric` 类型。这些类型在 R 语言中被称为“类”。你可以使用
    `class` 函数来查找对象的类。


    ```

    class(a)

    ```


    这将在你的控制台返回值 `numeric`。你可以像这样使用赋值运算符来改变对象的类：


    ```

    class(a) <- "custom_numeric"

    ```


    通常，你不会改变已经存在的对象（如数值或字符）的类。然而，如果你正在创建自己的自定义类，并希望将你的对象与环境中的其他对象区分开来，你可能会这样做。


    ### 基本类类型


    在编写代码时，我们可以定义和使用多种类型的对象，但其中有几种是 R 编程的基础，因此下面将专门介绍它们。


    #### 字符和数值


    我们在第一节中介绍了数值对象，字符对象的工作方式类似。真正的区别在于，字符对象存储的是字符而非数字。字符对象需要用单引号或双引号括起来，像这样：


    ```

    b <- "nine"

    ```


    当我们在代码中引用 `b` 时，我们将得到字符串 “nine”。与我们之前看到的数值对象不同，我们不能将 `b` 乘以 2。如果我们尝试这样做，会得到错误“二元运算符的非数值参数”。


    虽然我们不能对字符对象进行数学运算，但我们可以使用 `stringr` 库来操作这些对象。例如，如果我们想将两个字符对象合并在一起，我们可以像这样使用 `stringr`
    库中的 `str_glue` 函数：


    ```

    library(stringr)

    str_glue(b, " times 2")

    ```


    这将返回字符串 “nine times 2”。`library` 关键字用于让我们访问一个函数库。上面的第一行代码意味着我们需要访问 `stringr` 库。


    #### 向量


    向量是同一类型对象的列表。你可能有一个字符、数值或其他类型对象的列表。你使用从 1 开始的数值来跟踪列表中的对象。要创建一个向量，你需要使用名为 `c` 的函数，该函数接受一个逗号分隔的值列表来创建该列表。下面是你如何创建一个包含字母表中前五个字母的向量：


    ```

    alpha <- c("A", "B", "C", "D", "E")

    ```


    你可以通过输入名称 `alpha` 将整个列表打印到控制台，或者通过使用对象名称后跟方括号以及对应向量中感兴趣元素的索引来引用单个元素。


    例如，`alpha[1]` 将打印出 “A”，而 `alpha[5]` 将打印出 “E”。


    当你对向量应用像乘法这样的运算或函数时，该运算将应用于向量中的每个对象。结果将是一个新的向量。例如，如果我们有一个包含数字 20、30、40、50 和 60
    的向量，然后将该向量乘以 4，我们最终将得到一个新的向量 80、120、160、200 和 240。


    ```

    n <- c(20,30,40,50,60)

    n

    [1] 20 30 40 50 60

    n * 4

    [1]  80 120 160 200 240

    ```

