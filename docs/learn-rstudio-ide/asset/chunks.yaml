- fmt: '## Debugger


    Debugging is the process of identifying and fixing defects in your code. The simplest
    way to debug may be to simply print out object values to the Console screen. However,
    this can become frustrating when the state of your analysis changes as each line
    of code executes.


    To help with that problem, RStudio comes with a built-in tool that lets you set
    breakpoints which will stop your code from executing and give you a chance to
    inspect object values.


    Use the debugger by setting breakpoints. Simply open a code file and click in
    the area to the left of the line of code that you would like R to stop at. This
    area is called the gutter and you see this pictured in Figure [11-8](#478254_1_En_11_Chapter.xhtml#Fig8).


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig8_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig8_HTML.jpg)


    Figure 11-8


    Setting a breakpoint


    The red dot next to the `i = 2` line of code is the breakpoint. When we execute
    this code, RStudio will stop at this line of code and present the code debugger
    as pictured in Figure [11-9](#478254_1_En_11_Chapter.xhtml#Fig9).


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig9_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig9_HTML.jpg)


    Figure 11-9


    Key debugger features


    In Figure [11-9](#478254_1_En_11_Chapter.xhtml#Fig9) you can see all the debugger
    features. In the middle-left area, we have a set of controls that we can use to
    control the code execution. Now that we are stopped at the breakpoint, we can
    advance to the next line, continue all code until the next breakpoint, or stop
    code execution.


    Toward the bottom of the screen, we can use the Console to write code to inspect
    the current state of the project. This is a nice feature when you are working
    on testing ideas about code defects. You also have the environment screen at the
    top where you can see the values of all the objects in the environment.


    You get a few more options for debugging by going to the RStudio debug menu. The
    first two options in particular are helpful and let you toggle and clear your
    breakpoints.


    ## More Code Tools


    RStudio also comes with a few more tools to make your code editing and refactoring
    a little bit easier. Code refactoring is something you do once you have a working
    project, but you want to clean up your code a bit. You may want to change function
    names, indent your code or extract regions of code into re-suable functions.


    Go to the RStudio header and choose the “Code” menu item to see all the options
    you have to help refactor your code. One key item is the ability to “rename in
    scope”, which you use by highlighting an object and then selecting the menu. At
    this point any edit you make to the object will be reflected in all appearances
    of this object in the code file.


    You may also find the option to re-indent lines and reformat code helpful to give
    your code an organized look. Navigating code is much easier when you use the “Go
    To Function Definition” when you have a called function but you can’t quite remember
    where it was defined.


    ## Conclusion


    In this chapter, we highlighted some built-in tools that RStudio comes with that
    will help you organize and maintain your code. Git is used to organize and see
    differences in versions of your code. You use the debugger to observe the state
    of your program as it steps through code so you can fix bugs. Finally, the code
    menu gives you a list of utilities that you can use to reformat your code quickly.


    # 12. R Programming


    In this last chapter, we are going to go over the basic concepts that you need
    to know to do R programming. This tutorial is in no way comprehensive or meant
    to be your first experience with programming. However, if you have programmed
    before, this should provide you with enough to get started in R. Readers that
    are completely new to programming may want to consider taking an intensive course
    on this subject perhaps with Data Camp or Coursera.


    ## Objects


    Everything in R is an object. An object can be a list of numbers, a function,
    a plot, or the result of an analysis. There are different types of objects such
    as lists, data frames, and characters.


    You create an object with the assignment operator `<-`. On the left is a name
    that you choose, followed by the assignment operator `<-`, and then code that
    defines the object. You create a numeric object like this:


    ```

    a <- 9

    ```


    The first part `a` is the name we choose for the object, followed by the assignment
    operator `<-`, and then a value `9`. We will refer to this object in code now
    by just using the letter a. For instance, if we wanted to know how to double the
    value of `a` we could do this:


    ```

    a * 2

    ```


    This would print `18` to the Console. Objects can be different types in R. The
    object `a` above is `numeric`. These types are called classes in R. You can find
    out what the class of an object is by using the `class` function.


    ```

    class(a)

    ```


    This will return the value `numeric` to your Console. You can change the class
    of an object with the assignment operator like this:


    ```

    class(a) <- "custom_numeric"

    ```


    Generally, you will not change the class of objects that already exist like numeric
    or character. However, you may if you are creating your own custom class and want
    to distinguish your objects from others present in the environment.


    ### Essential Class Types


    We can define and use multiple types of objects while writing code, but there
    are a few which are foundational to R programming, so these will be covered specifically
    below.


    #### Character and Numeric


    We covered numeric objects in the first section and character objects work in
    the same way. The real difference is that character objects store characters and
    not numbers. Character objects need to be wrapped in single or double quotes like
    this:


    ```

    b <- "nine"

    ```


    When we reference `b` in code, we will get the string “nine” returned. Unlike
    the numeric object we looked at before, we cannot multiple `b` by 2. If we attempted
    this, we would get the error “non-numeric argument to binary operator”.


    While we cannot do math on character objects, we can use the `stringr` library
    to manipulate these objects. For instance, if we wanted to combine two character
    objects together we could use the `str_glue` function from the `stringr` library
    like this:


    ```

    library(stringr)

    str_glue(b, " times 2")

    ```


    This would return the string “nine times 2”. The `library` keyword is used to
    give us access to a library of functions. The first line of code above means that
    we need access to the `stringr` library .


    #### Vector


    A vector is a list of objects of the same type. You may have a list of character,
    numeric, or other type of objects. You keep track of objects in the list using
    a numeric value starting with 1. To create a vector, you use function named `c`
    that takes a comma-separated list of values to create the list. Here is how you
    create a vector containing the letters that make up the first five letters of
    the alphabet:


    ```

    alpha <- c("A", "B", "C", "D", "E")

    ```


    You could simply print the entire list out to the Console by typing in the name
    `alpha` or you could reference individual elements by using the object name followed
    up square brackets with an index that corresponds to the element in the vector
    that you are interested in.


    For instance, if you `alpha[1]` will print “A” while `alpha[5]` will print “E”.


    When you apply an operation like multiplication or a function to a vector the
    operation will get applied to each object in the vector. The result will be a
    new vector. For instance, if we had a vector of the numbers 20, 30, 40, 50, and
    60 and then multiplied the vector by 4 we would end up with a new vector 80, 120,
    160, 200, and 240.


    ```

    n <- c(20,30,40,50,60)

    n

    [1] 20 30 40 50 60

    n * 4

    [1]  80 120 160 200 240

    ```'
