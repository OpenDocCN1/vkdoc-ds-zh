    \ Markup Language (YAML)"
  raw: '### Functions


    Functions are a type of object that contain a block of code that can be executed
    with inputs that you provide to the function. These objects are a great way to
    follow the best practice of writing code once. Generally, any block of code that
    you feel can be used throughout your project can be wrapped up as a function to
    be used later on. Here is how you create a function object:


    ```

    my_fun <- function(x, y) {

    r = x * 2 + y

    r

    }

    ```


    The code in between the curly brackets `{` and `}` is what makes up the function.
    Inside these curly brackets, you can create new objects and reference objects
    that are declared as parameters in the function. Parameters are declared in the
    comma-separated list that appears in parenthesis after the function keyword. Functions
    can also use objects that have been declared outside of the function as long as
    they have been declared before the function itself.


    The function including the parameters list and code block is assigned to the `my_fun`
    object. We can inspect the function by typing the object name into the Console
    to get a printout of the code in the function.


    In order to use the function, we must type out the function name followed by the
    comma-separated list of parameters like this:


    ```

    my_fun(3, 189)

    ```


    This will return the numeric object `195`. What happens in the function is that
    each line of code is executed, and the last line of code is returned to the caller.
    The last line of code in `my_fun` is the result of the calculation.


    Functions that are not assigned to object names are called anonymous functions
    and are often used as parameters to functions like `lapply` or `sapply`. These
    functions work in the same way but are not necessarily reused in the same way
    as a standard function would be.


    ### Importing JSON Data


    JSON, JavaScript Object Notation, is a data format that some programmers may not
    be as familiar with as compared to csv or other two-dimensional data formats.
    The JSON data format is designed to be something that can be sent easily in a
    text format while maintaining a structured format.


    Here is an example of JSON data:


    ```

    [{"year":2015,"race":"All Races","sex":"Both Sexes","death":733.1},{"year":2014,"race":"All
    Races","sex":"Both Sexes","life":78.9,"death":724.6},{"year":2013,"race":"All
    Races","sex":"Both Sexes","life":78.8,"death":731.9},{"year":2012,"race":"All
    Races","sex":"Both Sexes","life":78.8,"death":732.8},{"year":2011,"race":"All
    Races","sex":"Both Sexes","life":78.7,"death":741.3},{"year":2010,"race":"All
    Races","sex":"Both Sexes","life":78.7,"death":747}]

    ```


    This is a portion of the life expectancy data that we worked with throughout the
    book. You can probably make some sense of this data, but it’s far from a friendly
    format.


    To work with data like this you can use the `jsonlite` package. Install this package
    with this code:


    ```

    install.packages("jsonlite")

    ```


    Now, assuming we have the JSON data above stored in an object called named `life_json`
    we can convert the data into a tidy format that we can use with this simple line
    of code:


    ```

    library(tidyverse)

    library(jsonlite)

    life <- fromJSON(life_json)

    ```


    We included the library references above. You can inspect the result by typing
    the object name life into the command line to get this data frame:


    ```

    year      race        sex death life

    1 2015 All Races Both Sexes 733.1   NA

    2 2014 All Races Both Sexes 724.6 78.9

    3 2013 All Races Both Sexes 731.9 78.8

    4 2012 All Races Both Sexes 732.8 78.8

    5 2011 All Races Both Sexes 741.3 78.7

    6 2010 All Races Both Sexes 747.0 78.7

    ```


    The `jsonlite` package `fromJSON` function automatically transformed the file
    into a data frame. This function will return the most high-level object that it
    can automatically. Since our data fit neatly into a data frame that is what we
    received. However, if the underlying data frame does not fit into this structure
    you may end up with a list object that reflects the structure of the JSON file.


    ## Conclusion


    In this chapter, we have presented enough information about R programming to get
    you started and to make sure that you can follow along with this book. You should
    now understand objects, control flow, and functions in R. Additionally, the chapter
    on essential R packages and the section on JSON will give you a solid start if
    you have produced data analysis in the past.


    For readers new to data analysis and/or programming, you may find that you need
    more help. Programming is something that takes a lot of practice and some understanding
    in the beginning. You may benefit by reviewing other programmers’ data analysis
    work. Many examples are available online on websites like Github.


    Readers who are completely new to programming may want to take some time to learn
    essential programming. If this book is the first time that you have encountered
    ideas such as loops, functions, and objects then you should consider taking a
    local or online course on R programming.


    For everyone, we hope that the material in this book and this chapter will help
    you understand what tools are available to you so that you can really start to
    provide the insight into your work that you are looking for. Good luck and I hope
    that you enjoy the journey into the technology of data science!


