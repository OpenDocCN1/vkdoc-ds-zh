    in the dialog. If you choose “Single File”, a new file named “app.R” will appear
    and automatically open in your editor view as pictured in Figure [9-2](#478254_1_En_9_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig2_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig2_HTML.jpg)


    Figure 9-2


    app.R contents


    The code that appears is a template that RStudio creates for you as a starting
    point. This is a working Shiny App that uses the built-in R datasets just as an
    example. Click the “Run App” button shown in Figure [9-2](#478254_1_En_9_Chapter.xhtml#Fig2)
    to run the web app. The app will start to run in a local web server that is managed
    by R as you can see pictured in Figure [9-3](#478254_1_En_9_Chapter.xhtml#Fig3).


    ![../images/478254_1_En_9_Chapter/478254_1_En_9_Fig3_HTML.jpg](images/478254_1_En_9_Chapter/478254_1_En_9_Fig3_HTML.jpg)


