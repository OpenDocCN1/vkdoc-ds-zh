    导入数据预览


    点击“Import”，导入数据集窗口将消失，你将返回到主 RStudio IDE 屏幕。然而，很多内容已经发生了变化，如图 2-11 所示。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig11_HTML.jpg](img/478254_1_En_2_Fig11_HTML.jpg)


    图 2-11


    数据集在 R 中打开


    你可以看到数据已经显示在屏幕上。我们可以使用这个新屏幕上的控件来筛选数据和搜索数据集。该数据集也出现在全局环境中，并被自动命名为 `Food_Display_Table`。这是在
    R 代码中引用此数据集的名称。例如，我们可以在控制台中使用 R 的 `head` 函数来查看数据的前几行。


    图 2-12 中显示的输出为我们提供了关于此数据集的更多信息。当我们更多地了解数据和 R 之后，我们就可以使用数据集的名称作为分析中的输入数据。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig12_HTML.jpg](img/478254_1_En_2_Fig12_HTML.jpg)


