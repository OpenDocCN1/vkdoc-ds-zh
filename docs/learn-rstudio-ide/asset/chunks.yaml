    ### R Markdown 可重复性


    当我们说分析具有可重复性时，意味着我们能够重新运行一份报告，并得到与过去完全相同的结果。我们的分析不应依赖于我们在命令行中手动输入的任何临时命令。为了确保分析可重复，让我们运行`source`命令并加载用于导入`expectancy`数据集的文件。将
    R 代码块替换为以下内容，并包含数据集的摘要。


    ```r

    ```{r get_data}

    source("process_data.R")

    summary(expectancy)

    ```

    ```


    在上面的代码块中，我们做了几件事。我们将标签更改为`"get_data"`，使用`source()`执行保存在`"process_data.R"`中的所有代码，并展示了`expectancy`数据集的摘要。当我们编织
    Markdown 文件时，`expectancy`数据集的摘要将取代`cars`数据集出现。


    更重要的是，R Markdown 文档中的其他代码将能够像我们之前那样引用`expectancy`数据集。我们之前遵循的所有数据处理规则将在每次编织新输出文档时执行。


    您可能希望像我们在数据可视化章节中所做的那样，让用户一窥数据集的全貌。您可以简单地从上一章复制代码，并将其包裹在如下代码块中：


    ```

    ## 预期寿命数据集示例

