- fmt: '### Summarizing Dataframes


    Let’s create a new R script file by going to the RStudio menu bar and choosing
    “File” ➤ “New File” ➤ “R Script”. Just as before, a new file will appear. Click
    the floppy disk icon to save this file with the filename `data_exploration.R`.


    Now we want to see a summary of the `expectancy` dataframe, so we can use the
    `summary` function with the dataframe as an argument.


    ```

    summary(expectancy)

    ```


    Type this function right into your R script file and then click the “Run” button
    to code this code. You will see output that describes each variable (or column
    of the dataframe) as pictured in Figure [5-9](#478254_1_En_5_Chapter.xhtml#Fig9).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig9_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig9_HTML.jpg)


    Figure 5-9


    Dataframe summary


    The information in Figure [5-9](#478254_1_En_5_Chapter.xhtml#Fig9) shows us a
    lot about this dataset. We can see that what type of data each column contains
    and we have some information about the numeric data. For instance, we know that
    the dataset covers the years 1900 to 2015 and that some years have a life expectancy
    of 29.10 while others had 81.4. We can also see that we have two character types
    `race` and `sex`, but we have little information about these. These are categories
    and will reveal how this dataset is organized.


    To look at the `race` and `sex` categories we can use the R `unique` function
    and pass the column of data as an argument like this:


    ```

    unique(expectancy$race)

    ```


    If you hit the “Run” button, you will see this output:


    ```

    [1] "All Races" "Black"     "White"

    ```


    When you do the same for the `sex` category, you can see that we also have three
    categories available: “Both Sexes” , “Female” , and “Male” .


    We can tell from all this that our data will be organized by three categories:
    year, race, and sex. Also, most likely each year will have rows for all available
    combinations of race and sex. You can use the dataframe view to verify this.


    Navigate to the first tab in your project to view the `expectancy` dataframe again.
    Click the filter button to see a subset of the data. Use the slider in the year
    column to only view rows that are identified by the year 1900 as pictured in Figure
    [5-10](#478254_1_En_5_Chapter.xhtml#Fig10).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig10_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    Filtered dataframe


    We will want to be careful in how we handle this dataframe now that we know how
    things are organized. For example, we will not want to simply aggregate datapoints
    by year since it contains overlapping categories and we will want to filter on
    these categories as we develop research questions.


    You may also want to do some preliminary visualizations to start to get some insight
    into the numeric variables we are looking at. For instance, you may guess that
    life expectancy would have increased since 1900. To test that theory, you can
    look at only the rows in the dataframe with the `race` and `sex` category values
    of “All Races” and “Both Sexes”.


    ```

    trend <- expectancy

    trend <- trend[trend$race == "All Races", ]

    trend <- trend[trend$sex == "Both Sexes", ]

    ```


    First we assign the `expectancy` dataframe to a new dataframe named `trend`. Then
    we take two subsets of the data. The second line will return all rows where `race`
    is equal to “All Races” while the third line will return all rows where `sex`
    is equal to “Both Sexes”. Next, we can remove all the variables expect the ones
    that we will be looking at specifically.


    ```

    trend$race <- NULL

    trend$sex <- NULL

    trend$death_rate <- NULL

    ```


    Setting objects to `NULL` in R will remove them from your environment. Now we
    can plot the life expectancy by year using the base R `plot` function .


    ```

    plot(trend)

    ```


    This will automatically plot the two variables and your plot viewer will have
    the plot displayed for you as pictured in Figure [5-11](#478254_1_En_5_Chapter.xhtml#Fig11).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig11_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    Life expectancy by year


    As you can see, this plot supports our initial guess that life expectancy would
    increase over the years. The plot also shows that the observations in earlier
    years are not as consistent as observations in later years.


    ## Conclusion


    This chapter presents an example of how you might use RStudio projects to organize
    and make your work reproducible. RStudio projects make it easy to retrace your
    steps and build on your earlier work as you flesh out your analysis. In addition,
    RStudio projects make it much easier to share work with colleagues.


    When you close RStudio after working on a project like this make sure to click
    “Save” when the IDE prompts you as you exit. This will save your work and history
    and make it easier to pick up where you left off in your project.


    # 6. Essential R Packages: Tidyverse


    Now that you have the essential RStudio workflow, we are ready to start highlighting
    some of the tools that will really supercharge your data analysis. Not all of
    these tools are exclusive to RStudio and you may see them in other R environments,
    but they do fit in very nicely with the RStudio IDE.


    The first order of business here is to introduce you to the must-have packages
    what will provide the cornerstone of your R toolkit. Many of these packages will
    simplify functions that already exist in R, while others will add functionality
    to the base system. RStudio along with these packages are what transforms R into
    a professional tool for data practitioners.


    ## R Packages


    An R Package is something that you can plug into RStudio to extend the basic functionality
    that is built in with R. One of the reasons that R has become so popular is because
    it has this rich ecosystem of packages that really make R a comprehensive platform
    for data science.


    You can use RStudio to load, browse, install and remove packages or you can manage
    R packages using R code. RStudio’s package support is discussed in detail in Chapter
    [3](#478254_1_En_3_Chapter.xhtml).


    ## Tidyverse


    The packages that we will discuss are actually a collection of packages called
    “`tidyverse`”. `Tidyverse` is mainly developed by Hadley Wickham who also works
    on RStudio. The `tidyverse` website, [`https://www.tidyverse.org`](https://www.tidyverse.org)
    , describes this set of packages best, *“The tidyverse is an opinionated collection
    of R packages designed for data science. All packages share an underlying design
    philosophy, grammar, and data structures.”*


    Note that the authors describe `tidyverse` as “opinionated.” This means that `tidyverse`
    is more than a set of functions; it is also a prescribed way of doing data science.
    There is a `tidyverse` way of doing things. This is what they mean when they say
    `tidyverse` is “opinionated.”


    One of the things that `tidyverse` does well is smooth over base R’s rough edges.
    `tidyverse` provides consistent wrappers over functions that already exist in
    base R that are easier to use and easier to remember. These packages also add
    more functionality to what is included in base R. For instance, `ggplot2` (a `tidyverse`
    package) extends what you can do with base R’s `plot` function but adds more plot
    types. Let’s get into the core `tidyverse` packages.


    To follow along with the examples below, you must install `tidyverse` and then
    import the library into your project. You may use the instructions on packages
    in chapter three to do this or you can type in this code to your R Console.


    ```

    install.packages("tidyverse")

    library(tidyverse)

    ```'
