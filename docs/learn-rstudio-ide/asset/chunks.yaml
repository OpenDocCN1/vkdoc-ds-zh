- fmt: '### Hello World


    Now let’s see another type of vector in our Console by going through with the
    traditional Hello World example. Type in the following set of characters into
    your Console screen exactly as shown:


    ```

    "Hello World"

    ```


    Don’t forget to include the quotation marks! Now press Enter and you will see
    another vector appear but this time it reads `[1] "Hello World"`. Like before,
    this vector has one item in the first position, but the object this time is a
    string of characters showing the famous statement.


    Let’s try our Hello World a different way with the help of a function that we
    can use to create vectors with lengths of more than just one item. We can use
    the letter `c` and include a comma-separated list of objects to create a vector.
    All the objects in our vector must be of the same type (no mixing numbers and
    characters). If our objects are different types, R will simply convert them to
    the most general type that will accommodate the data that you supply. Type `c("Hello",
    "World")` into your Console window and then press Enter. This time you will see
    `[1] "Hello" "World"` print out to your Console.


    While this appears very similar to what we saw before, it’s a little bit different.
    This vector has two items, although the Console is only showing the `[1]` on the
    line. However, you can see that there are two objects above since each has its
    own set of quotes. R is simply saving space on the output screen by only showing
    item numbers of each row of output. Let’s take a look at bigger vector to see
    how this works.


    Type in `1:100` into your Console and press Enter. You should see something like
    the image displayed in Figure [2-2](#478254_1_En_2_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig2_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    100 Item vector printout


    The `:` is a shortcut that you can use to define a range. Typing in `1:100` will
    give you every number between 1 and 100. The result is a vector and you can clearly
    see how each row will report back the item position of the data value in the first
    column.


    Let’s get back to our tour of RStudio IDE. We will get more about R programming
    and vectors as we get deeper into learning how to use the tools.


    ### Terminal


    The Console screen that we just introduced is what you would have available if
    you simply downloaded R and started coding. While this is great for interactively
    working with R, RStudio offers more features than a simple Console. Let’s go through
    some of the RStudio features that make RStudio an integrated development environment.


    Right next to the Console tab at the top of the Console screen is a tab that reads
    “Terminal”. If you click that you will get another screen that looks similar to
    the Console but is a command line for your operating system. This is handy for
    situations that will come up when you need to work in this way.


    This is a feature that will be welcome to command line ninjas and good to remember
    for the rest of us who at times need to jump down into the OS. Click the Terminal
    tab and type in a command that you might use. For example, you might want to see
    a list of files and folders so you could type `ls` on the your command line as
    we did in Figure [2-3](#478254_1_En_2_Chapter.xhtml#Fig3).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig3_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Terminal command line


    The actual commands that you can use depends on your operating system. You can
    also access a list of helper actions if you use the dropdown menu that is right
    under the Terminal tab in Figure [2-4](#478254_1_En_2_Chapter.xhtml#Fig4).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig4_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Command shortcuts


    ### Environment


    The RStudio environment tab is a handy feature located toward the right of the
    Console screen. There are three tabs: Environment, History, and Connections. The
    environment tab is pictured in Figure [2-5](#478254_1_En_2_Chapter.xhtml#Fig5).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig5_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig5_HTML.jpg)


    Figure 2-5


    Environment tab


    In R, an environment is a workspace. You can store objects and data in your environment.
    We will simply use the Global Environment in our examples, but you should be aware
    that environments in R can be a rich topic and are used in advanced R programming
    techniques. For instance, each R function (a unit of reusable code) will get its
    own environment and programmers can allocate their own environments for a variety
    of purposes. But most people don’t need to worry much about the subtleties of
    environments in this way.


    Right now, your environment should be completely empty because we have not yet
    created any objects or loaded any data. Let’s change that by creating some variables.
    Click into your Console and create an object by assigning the “Hello World” string
    to an object named `greeting`.


    ```

    greeting <- "Hello World"

    ```


    Before we look at what happened in the environment window, we should talk about
    this new syntax I tried to sneak past you. Let’s decompose the statement above
    starting the very right.


    `"Hello World"` is the same string we type in at the beginning. A string is a
    set of characters enclosed in quotes. Like numbers, strings are a kind of data.
    The odd set of symbols to the left of the string `<-` is called the assignment
    operator. The assignment operator’s job is to assign a data value to an object.


    The object here is to the left of the assignment operator and it’s labeled `greeting`.
    By typing in the code above and pressing Enter you assigned the value of `"Hello
    World"` to the object `greeting` and put that into the Global Environment. Now
    you can view the contents of the Global Environment in the right-hand area of
    the screen as pictured in Figure [2-6](#478254_1_En_2_Chapter.xhtml#Fig6).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig6_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig6_HTML.jpg)


    Figure 2-6


    Viewing objects in Environment tab


    This is really nice, as you are conducting a data analysis you will have visibility
    into the current state of your work. You can see the results at a glance and you
    can verify that the variables you expect are the right ones. This feature alone
    makes RStudio a must-have tool in your data programming kit. But there is more
    still.


    The environment widget also has the ability to save your work and open up other
    environments. So, if you’ve been hacking on a data problem all day and want to
    save all our data and variables you can do that by using the floppy disk icon.
    To open an environment, simply use the folder icon and then navigate to an environment
    file that you have saved.


    ### Importing Data


    Another game changing feature which will help many people is the ability to import
    data from other data analysis tools like SAS and Excel. Click the Import Dataset
    button and you will see the options you have in import data in your analysis as
    pictured in Figure [2-7](#478254_1_En_2_Chapter.xhtml#Fig7).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig7_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    Importing datasets


    Clicking through to these options will start up an import wizard that you can
    use to easily import data into RStudio from any of these sources. Finally, on
    this screen you also have a friendly broom icon that you can use to erase everything
    from your environment.'
