- fmt: '### Datasets


    To illustrate the import feature, we downloaded a dataset from a dataset used
    for the Food Pyramid from [data.gov](http://data.gov) [`https://catalog.data.gov/dataset/mypyramid-food-raw-data-f9ed6`](https://catalog.data.gov/dataset/mypyramid-food-raw-data-f9ed6).
    The Food Pyramid web site is shown in Figure [2-8](#478254_1_En_2_Chapter.xhtml#Fig8).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig8_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    Food pyramid data download site


    This data is stored in Excel and we can simply use the Import Dataset Tool to
    import the dataset into R and inspect it. If you would like to follow along with
    this example, visit the URL above and download the zip file from the webpage.


    Open up the zip file and locate the file named `Food_Display_Table.xlsx`. This
    is the dataset in Excel format that we will be looking at. Now in RStudio, click
    the button "Import Dataset" and choose "From Excel...". Click the "Browse" button.
    See Figure [2-9](#478254_1_En_2_Chapter.xhtml#Fig9) for an example of this screen.


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig9_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig9_HTML.jpg)


    Figure 2-9


    Importing Excel data


    Next, navigate to the location where you located the Excel file named `Food_Display_Table.xlsx`.
    The screen will fill up with the first few rows of the data and also some code
    that can be copied that we can use later to re-import this dataset without using
    the interface as shown in Figure [2-10](#478254_1_En_2_Chapter.xhtml#Fig10).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig10_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig10_HTML.jpg)


    Figure 2-10


    Import data preview


    Click "Import" and the Import Dataset will disappear and you will be brought back
    to the main RStudio IDE screen. However, a lot will have changed as you can see
    in Figure [2-11](#478254_1_En_2_Chapter.xhtml#Fig11).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig11_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig11_HTML.jpg)


    Figure 2-11


    Dataset opened in R


    You can see that the data has appeared on our screen. We can use the controls
    on this new screen to filter the data and to search the dataset. The dataset has
    also appeared in our Global Environment and has been automatically named `Food_Display_Table`.
    This is the name we would use to reference this dataset in R code. For instance,
    we can use the R `head` function in our Console to see the first few rows of data.


    The output displayed in Figure [2-12](#478254_1_En_2_Chapter.xhtml#Fig12) gives
    us even more information about this dataset. Once we learn more about data and
    R, we can use the name of the dataset as an input into our analysis.


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig12_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig12_HTML.jpg)


    Figure 2-12


    R `head` function


    ### History


    Click over to the next tab to see a log of all the commands that you entered into
    this R session so far. This is a big help when you have found result, but you
    can''t quite remember how you got to a certain point. You can simply look at your
    log to see the list of steps you took.


    The History tab shown in Figure [2-13](#478254_1_En_2_Chapter.xhtml#Fig13) also
    has convenient functions that you can use to put a line of code that appears in
    your history back into the R Console. You can also search for a specific line
    of code using the text area with the search icon. This can be handy when you know
    that you have made a change to an object, but you are having trouble locating
    precisely where in the potentially long list of commands the changes were made.


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig13_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig13_HTML.jpg)


    Figure 2-13


    History tab


    ### Connections


    Finally, the Connections tab gives you a way to connect to data sources such as
    local databases or a Spark cluster. These types of data storage solutions are
    used when datasets are too big to simply be stored locally on your computer. If
    you click into the Connections tab you will see an empty list, but there are options
    to connect to ODBC (databases) or Spark.


    If you have connection information for a database that you need for your project,
    you can use this interface to connect. RStudio will guide you through the connection
    process and install any packages that you need to work with the data source. This
    window will also show any data source connections that you have created yourself
    with R code.


    ## Conclusion


    In this chapter, we introduced R vector, which is an essential R data structure.
    In addition, we have already been exposed to a good deal of the basic functionality
    of the RStudio IDE. Finally, we have a brief introduction to datasets in R. As
    we move on through our tour of the RStudio IDE, we will encounter these objects
    again and go into more detail, so you can start to see how this will help you
    with your data analysis.


    # 3. RStudio Views


    Let''s continue our tour of RStudio IDE. RStudio has a four-pane window layout
    and we have looked closely at two of the panes already in the last chapter. We
    have seen the Console screen, where you can write interactive R code, and we saw
    the Environment and History screens, where you can see the state of your R environment.
    Our data frame also opened up in a third pane, but we can do more with this part
    of the RStudio interface. Let''s take a look at the remaining screens that we
    will be using now.


    ## Files, Plots, Packages, Help, and Viewer Pane


    By default, the pane on your lower right-hand side will contain tabs labeled Files,
    Plots, Packages, Help, and Viewer. The Files tab will show you the files in the
    current working folder. The working folder is the folder that R will save your
    work to. This pane essentially is your Windows Explorer or Mac Finder app integrated
    into RStudio.


    ### Files


    The Files tab includes convenient functions that you can use to open and generally
    work with files without needing to leave RStudio. This includes tasks like deleting
    and renaming files. You can also set the R working folder as you can see in Figure
    [3-1](#478254_1_En_3_Chapter.xhtml#Fig1).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig1_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Files tab


    ### Plots


    You use the Plots tab to view the plots that you create during your R analysis.
    If you click over to this tab, you will see an empty screen with a few function
    buttons, which is pictured in Figure [3-2](#478254_1_En_3_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig2_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Plot view functions


    You can view plots, export plots to files, and also navigate sets of plots that
    you created. This widget helps you stay organized as you go through and investigate
    your data. To demonstrate this feature more, we will need to hop over to the Console
    screen, do some data munging, and create a plot.


    #### Introduction to Data Munging


    We can use the data that we imported in the previous chapter. If you have been
    following along, that data is named `Food_Display_Table`. Before we use this data
    to make a plot, we are going to have to do some "data munging". Data munging is
    the process of restructuring the data to make it work for your analysis.'
