- fmt: '# RStudio Projects


    We have learned a great deal of integration to R programming so far, but we are
    missing a way to bring all of that together in a format that we can reuse. This
    is where RStudio projects come into play.


    RStudio projects are used to organize all the code, reports, and any other assets
    used in an analysis. When we create a project, RStudio will provide the needed
    files and everything else needed for your type of project.


    ## Create a New RStudio Project


    Create a new RStudio project by selecting “File” and then “New Project…” from
    the menu bar at the top of your RStudio screen as pictured in Figure 4-1.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig1_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig1_HTML.jpg)


    *Figure 4-1: Creating a new RStudio project*


    Now a dialog box as pictured in Figure 4-2 will appear that presents a few options
    to create your new RStudio project.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig2_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig2_HTML.jpg)


    *Figure 4-2: RStudio project options*


    Usually, you will simply choose the first option, “New Directory”, which will
    create a new folder that you can name. All your configuration files will appear
    in this new folder. However, if you already have some code files that you want
    to start with, you may choose the second option, “Existing Directory”. Finally,
    if you already have a version control system like `git` set up for a project that
    already exists, then you can choose the third option, “Version Control”.


    ### Project Types


    For this example, we clicked on “New Directory” to create a fresh new project.
    The screen that appears will show you a list of RStudio project types as pictured
    in Figure 4-3.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig3_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig3_HTML.jpg)


    *Figure 4-3: RStudio project types*


    The first three project types are the ones that you will use most often. The projects
    after the first three all include specialized code used for special use cases.
    Projects in `Rcpp` in the description all are used to integrate with C++ code
    libraries. The projects with `devtools` are used to create R packages with the
    `devtools` library and the `sparklyr` project will create a package that will
    work with `Spark`.


    “Package” projects are set up to create a set of reusable R objects. This is a
    bit more advanced than what we are doing in this chapter and we will come back
    to this later. Just be aware that you can create RStudio project packages when
    you have code that you believe can be used across your projects.


    For this example, choose “New Project” as pictured in Figure 4-4 to create project
    that will work best for an analysis.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig4_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig4_HTML.jpg)


    *Figure 4-4: Life expectancy RStudio project*


    We named the project “life_expectancy” because we are going to do some data exploration
    from the [data.gov](http://data.gov) site that shows life expectancy rates. For
    now, choose the directory (known as folder on Mac) where you want the project
    to be saved and then click the “Create Project” button to create this RStudio
    project.


    ### RStudio Project Tour


    Now we have a new space for our project. This new RStudio project will be stored
    in the folder that you typed into the dialog box pictured in Figure 4-4. RStudio
    projects get their own environments so if you are switching projects, your work
    will be saved and organized. This is true for code files and anything else that
    you may need for an analysis. Let’s take a look at what was set up for us.


    In Figure 4-5, you can see that the RStudio project looks close to what we already
    saw in previous chapters.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig5_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig5_HTML.jpg)


    *Figure 4-5: New project screen*


    However, in Figure 4-5, you can see two changes from the normal starting screen.
    A new file appears in the bottom right screen with your project name and the `Rproj`
    file extension. This file contains all the settings for your project. If you look
    closely in your file explorer, you can see that this file sits in the directory
    that you choose under sub-directory with the same name as your project.


    If you click on your project name in the upper right area of your screen, you
    will find a list of helpful shortcuts as pictured in Figure 4-6.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig6_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig6_HTML.jpg)


    *Figure 4-6: Project shortcuts*


    You can open and close projects, quickly navigate to projects that have been opened
    recently, and set RStudio options specifically for this project.


    Project options are saved in the file with the extension `Rproj` in the folder
    that was created for your project. You can either click the file to open your
    project options or choose the option in the shortcut list pictured in Figure 4-6.
    When you do this, you will see a screen like Figure 4-7 that lists the options
    that you can set for this project.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig7_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig7_HTML.jpg)


    *Figure 4-7: Project options*


    These project options are inherited from the global options that are set for RStudio
    and for the most part you can simply leave these alone. The first two screens
    are the ones that are most immediately useful. The “General” tab gives you options
    when it comes to saving the state of your analysis. The default is to save both
    your data environment and R history. Sometimes if your project needs to load massive
    datasets, you might want to turn these options down because it would make your
    project take longer to open. Generally, it’s best to keep the defaults in place.


    The next tab is “Code Editing” and as you can see in Figure 4-8; this lets you
    control how your code editor works.


    ![../images/478254_1_En_4_Chapter/478254_1_En_4_Fig8_HTML.jpg](images/478254_1_En_4_Chapter/478254_1_En_4_Fig8_HTML.jpg)


    *Figure 4-8: Code editing options*


    You will want to keep these default settings generally. Make sure that the first
    option “Index source files” remains checked because that will ensure that some
    of the code tools we will talk about later will work correctly.


    The remaining four options tabs contain settings for features that we will revisit
    later on in this book. These options generally are used for reporting, building
    packages, and other specialized features that we are not quite ready to integrate
    into our workflow.


    ## Conclusion


    In this chapter, we learned how to set up RStudio projects. This will help us
    stay organized and efficient as we start to work on multiple analyses. Each RStudio
    project gets its own folder, set of files, datasets, and environment. In the next
    chapter, we will go through an example so we can see how organizing code in RStudio
    projects will help you set up an efficient workflow.


    # Repeatable Analysis


    Let’s take a look at how to create a repeatable analysis using an RStudio project.
    For this example, we will be working with the project we created in the previous
    chapter labeled “life_expectancy”. The dataset will be from the National Center
    for Health Statistics and will describe life expectancy since 1900 in the United
    States.


    If you have been following along, you will already have this project set up in
    RStudio. If not, follow the steps in the previous chapter to create a new RStudio
    project labeled “life_expectancy”.'
