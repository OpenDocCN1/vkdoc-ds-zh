- fmt: "# htmlwidgets\n\nWhile `ggplot2` provides most of what you will need with\
    \ essential plotting, there are times when you may want to add interactivity or\
    \ very specialized graphics to your analysis. `htmlwidgets` are a collection of\
    \ packages that you can use to add this next level of visualization to your R\
    \ analysis.\n\n`htmlwidgets` gives you the ability to incorporate open source\
    \ Javascript widgets that were originally developed for websites. Go to the [`http://htmlwidgets.org`](http://htmlwidgets.org)\
    \ website to get a complete list of the widgets available to you. Note that many\
    \ of these widgets are very specific to the type of problem that you are trying\
    \ to visualize. You will find widgets for maps, time-series, network graphs and\
    \ some D3 graphics.\n\nWe can use one `htmlwidget`, `plotly`, to turn the plot\
    \ we created in the last section into a web ready interactive widget. `Plotly`\
    \ is interesting because it works together with `ggplot2` and really takes `ggplot2`\
    \ to the next level. Here is all you need to do to add interactivity to a `ggplot2`\
    \ plot with `plotly`.\n\n```\nlibrary(plotly)\ni_plot <- expectancy %>%\n  filter(race\
    \ == \"All Races\") %>%\n  ggplot(aes(year, life_expectancy)) +\n  geom_line(aes(color\
    \ = sex))\nggplotly(i_plot)\n```\n\nThis code is very similar to what we did with\
    \ `ggplot2`. However, this time we are assigning the results to an object and\
    \ using that object as a parameter to `ggplotly` to create the interactive plot\
    \ you see in Figure 7-5.\n\n![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig5_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig5_HTML.jpg)\n\
    \n**Figure 7-5** Plotly HTML widget with popup\n\nThis plot now includes detail\
    \ popups and a toolbar with navigation figures at the top. In a later chapter,\
    \ when we learn how to create cohesive reports and dashboards, we will be able\
    \ to include widgets like this to create a rich interactive experience for our\
    \ users.\n\nBefore we move on, let’s highlight the DT package Datatables component.\
    \ Datatables is a remarkably useful interactive html widget that will create a\
    \ searchable HTML presentation of your datasets. For instance, if we wanted to\
    \ provide a searchable version of our dataset directly to our users we could simply\
    \ do this:\n\n```\nlibrary(DT)\ndatatable(expectancy,\n          options = list(pageLength\
    \ = 10))\n```\n\nThis will create the widget shown in Figure 7-6, which is a searchable\
    \ interactive table filled with our data.\n\n![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig6_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig6_HTML.jpg)\n\
    \n**Figure 7-6** Data table widget\n\n## r2d3\n\nThe packages discussed in the\
    \ first two sections of this chapter all provide rich objects to visualize most\
    \ types of data. However, at the end of the day our graphics will look like the\
    \ graphics that were designed by others and are available to all R developers.\n\
    \nThere are some use cases where we want to have absolute control over every aspect\
    \ of a visualization. Either a widget doesn’t exist that would help us or we need\
    \ to do something which is highly customized. This is where D3 can help us and\
    \ `r2d3` is a package that we can use to incorporate D3 into our RStudio project.\n\
    \nLike `htmlwidgets`, D3 is a web based Javascript solution. However, using D3\
    \ is more involved than what we would do with `htmlwidgets`. D3 is essentially\
    \ a programming language.\n\nThe core idea in D3 is that you can bind datasets\
    \ with graphic primitives (things like lines and circles). These graphics will\
    \ grow or shrink based on the values in your dataset. D3 graphics can become very\
    \ involved because you have a lot of control on how they look.\n\nWhile it goes\
    \ way beyond the scope of this book to teach D3, we can show you a quick hack\
    \ to get started.\n\n### Note\n\nThe features discussed here require RStudio 1.2\
    \ which should be available in the current version of RStudio that you have downloaded.\
    \ However, the version used in this chapter was from a Preview version of RStudio\
    \ so the screenshots may look somewhat different.\n\nTo use D3, simply go to the\
    \ RStudio menu and then choose \"File\", \"New File\", and then \"D3 Script\"\
    . A file will appear with D3 code.\n\n```\n// !preview r2d3 data=c(0.3, 0.6, 0.8,\
    \ 0.95, 0.40)\n//\n// r2d3: https://rstudio.github.io/r2d3\n//\nvar barHeight\
    \ = Math.ceil(height / data.length);\nsvg.selectAll('rect')\n  .data(data)\n \
    \ .enter().append('rect')\n  .attr('width', function(d) { return d * width; })\n\
    \  .attr('height', barHeight)\n  .attr('y', function(d, i) { return i * barHeight;\
    \ })\n  .attr('fill', 'steelblue');\n```\n\nThe code in this file is Javascript\
    \ and you can adjust the visualization by modifying this code. Save this file\
    \ and click the \"Preview\" button to see what the D3 visualization looks like.\
    \ It doesn't look like much compared to the pre-packaged solutions that we highlighted\
    \ earlier, but that is ok since D3 really offers more of a canvas for you to draw\
    \ on and not a set of plot widgets.\n\nThe preview simply uses the code found\
    \ in the comments in the file, but if you rather provide your own data from an\
    \ R script file you can do this using the `r2d3` library.\n\n```\nlibrary(r2d3)\n\
    r2d3(data = c(.1,.2,.3,.4,.3,.2,.1),\n     script = \"d3_plot.js\")\n```\n\nThis\
    \ code will produce the plot in Figure 7-7.\n\n![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig7_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig7_HTML.jpg)\n\
    \n**Figure 7-7** Basic D3 plot\n\nClearly, this is a very basic beginning visualization.\
    \ Check out the `r2d3` website for a whole set of stunning visualizations that\
    \ you can do with D3 [`https://rstudio.github.io/r2d3/articles/gallery.html`](https://rstudio.github.io/r2d3/articles/gallery.html).\
    \ These examples also contain the code that you need to recreate them so that\
    \ you can use this as a starting point for your own D3 custom visualizations.\n\
    \n## Conclusion\n\nIn addition to the base R `plot` function, you have many options\
    \ for data visualization in R. `ggplot2` provides a very robust and opinionated\
    \ way of doing what most analysts need most of the time. Packages like `r2d3`\
    \ and `htmlwidgets` provide support for more specialized use cases. There are\
    \ even more specialized visualization options available and all of these features\
    \ may be used in the dashboards and reporting options that we will discuss in\
    \ later chapters.\n\n# 8. R Markdown\n\nYou use R Markdown to create reports that\
    \ incorporate the features discussed in the previous chapters. R Markdown leverages\
    \ freely available open source technology like HTML, CSS, and Markdown to create\
    \ rich reports in a variety of formats.\n\nR Markdown is based on Markdown, which\
    \ is a short-hand method of defining a document in a human readable way. The idea\
    \ is that you can take quick notes in a structured way. These notes are readable\
    \ on their own, but they can also be translated into polished presentation formats\
    \ such as web pages, presentations, and PDF files.\n\nRStudio extends Markdown\
    \ by adding in code and graphics from the R language into Markdown documents.\
    \ This type of Markdown is referred to as \"R Markdown\". Let's use our life expectancy\
    \ analysis to create a shareable report using R Markdown."
  raw: '## htmlwidgets


    While ggplot2 provides most of what you will need with essential plotting, there
    are times when you may want to add interactivity or very specialized graphics
    to your analysis. `htmlwidgets` are a collection of packages that you can use
    to add this next level of visualization to your R analysis.


    `htmlwidgets` gives you the ability to incorporate open source Javascript widgets
    that were originally developed for websites. Go to the [`http://htmlwidgets.org`](http://htmlwidgets.org)
    website to get a complete list of the widgets available to you. Note that many
    of these widgets are very specific to the type of problem that you are trying
    to visualize. You will find widgets for maps, time-series, network graphs and
    some D3 graphics.


    We can use one `htmlwidget`, `plotly`, to turn the plot we created in the last
    section into a web ready interactive widget. Plotly is interesting because it
    works together with `gglot2` and really takes `ggplo2t` to the next level. Here
    is all you need to do to add interactivity to a `ggplot2` plot with `plotly` .


    ```

    library(plotly)

    i_plot %

    filter(race == "All Races") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line(aes(color = sex))

    ggplotly(i_plot)

    ```


    This code is very similar to what we did with `ggplot2`. However, this time we
    are assigning the results to an object and using that object as a parameter to
    `ggplotly` to create the interactive plot you see in Figure [7-5](#478254_1_En_7_Chapter.xhtml#Fig5).


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig5_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Plotly HTML widget with popup


    This plot now includes detail popups and a toolbar with navigation figures at
    the top. In a later chapter, when we learn how to create cohesive reports and
    dashboards, we will be able to include widgets like this to create a rich interactive
    experience for our users.


    Before we move on, let’s highlight the DT package Datatables component. Datatables
    is a remarkably useful interactive html widget that will create a searchable HTML
    presentation of your datasets. For instance, if we wanted to provide a searchable
    version of our dataset directly to our users we could simply do this:


    ```

    library(DT)

    datatable(expectancy,

    options = list(pageLength = 10))

    ```


    This will create the widget shown in Figure [7-6](#478254_1_En_7_Chapter.xhtml#Fig6),
    which is a searchable interactive table filled with our data.


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig6_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig6_HTML.jpg)


    Figure 7-6


    Data table widget


    ## r2d3


    The packages discussed in the first two sections of this chapter all provide rich
    objects to visualize most types of data. However, at the end of the day our graphics
    will look like the graphics that were designed by others and are available to
    all R developers.


    There are some use cases where we want to have absolute control over every aspect
    of a visualization. Either a widget doesn’t exist that would help us or we need
    to something which is highly customized. This is where D3 can help us and `r2d3`
    is a package that we can use to incorporate D3 into our RStudio project.


    Like `htmlwidgets`, D3 is a web based Javascript solution. However, using D3 is
    more involved that what we would do with `htmlwidgets`. D3 is essentially a programming
    language.


    The core idea in D3 is that you can bind datasets with graphic primitives (things
    like lines and circles). These graphics will grow or shrink based on the values
    in your dataset. D3 graphics can become very involved because you have a lot of
    control on how they look.


    While it goes way beyond the scope of this book to teach D3, we can show you a
    quick hack to get started.


    ### Note


    The features discussed here require RStudio 1.2 which should be available in the
    current version of RStudio that you have downloaded. However, the version used
    in this chapter was from a Preview version of RStudio so the screenshots may look
    somewhat different.


    To use D3, simply go to the RStudio menu and then choose “File”, “New File”, and
    then “D3 Script”. A file will appear with D3 code.


    ```

    // !preview r2d3 data=c(0.3, 0.6, 0.8, 0.95, 0.40)

    //

    // r2d3: https://rstudio.github.io/r2d3

    //

    var barHeight = Math.ceil(height / data.length);

    svg.selectAll(''rect'')

    .data(data)

    .enter().append(''rect'')

    .attr(''width'', function(d) { return d * width; })

    .attr(''height'', barHeight)

    .attr(''y'', function(d, i) { return i * barHeight; })

    .attr(''fill'', ''steelblue'');

    ```


    The code in this file is Javascript and you can adjust the visualization by modifying
    this code. Save this file and click the “Preview” button to see what the D3 visualization
    looks like. It doesn’t look like much compared to the pre-packaged solutions that
    we highlighted earlier, but that is ok since D3 really offers more of a canvas
    for you to draw on and not a set of plot widgets.


    The preview simply uses the code found in the comments in the file, but if you
    rather provide your own data from a R script file you can do this using the r2d3
    library.


    ```

    library(r2d3)

    r2d3(data = c(.1,.2,.3,.4,.3,.2,.1),

    script = "d3_plot.js")

    ```


    This code will produce the plot in Figure [7-7](#478254_1_En_7_Chapter.xhtml#Fig7).


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig7_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig7_HTML.jpg)


    Figure 7-7


    Basic D3 plot


    Clearly, this is a very basic beginning visualization. Check out the r2d3 website
    for a whole set of stunning visualizations that you can do with D3 [`https://rstudio.github.io/r2d3/articles/gallery.html`](https://rstudio.github.io/r2d3/articles/gallery.html)
    . These examples also contain the code that you need to recreate them so that
    you can use this as a starting point for your own D3 custom visualizations.


    ## Conclusion


    In addition to the base R `plot` function, you have many options for data visualization
    in R. ggplot provides a very robust and opinionated way of doing what most analysts
    need most of the time. Packages like `r2d3` and `htmlwidgets` provide support
    for more specialized use cases. There are even more specialized visualization
    options available and all of these features may be used in the dashboards and
    reporting options that we will discuss in later chapters.


    # 8. R Markdown


    You use R Markdown to create reports that incorporate the features discussed in
    the previous chapters. R Markdown leverages freely available open source technology
    like HTML, CSS, and Markdown to create rich reports in a variety of formats.


    R Markdown is based on Markdown, which is a short-hand method of defining a document
    in a human readable way. The idea is that you can take quick notes in a structured
    way. These notes are readable on their own, but they can also be translated into
    polished presentation formats such as web pages, presentations, and PDF files.


    RStudio extends Markdown by adding in code and graphics from the R language into
    Markdown documents. This type of Markdown is referred to as “R Markdown”. Let’s
    use our life expectancy analysis to create a shareable report using R Markdown.'
