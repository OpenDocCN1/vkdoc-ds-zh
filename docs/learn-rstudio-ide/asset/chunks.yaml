- fmt: '# Organizing Datasets


    One thing that we will want to do is read the data into the project. To stay organized,
    it helps to create a folder to store your data. Use the file viewer to create
    a new folder as shown in Figure [5-1](#478254_1_En_5_Chapter.xhtml#Fig1).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig1_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Create a new folder


    Go to `Files` and then “New Folder” type in the word “data” and then click “Ok”.
    You will now have a new folder that is associated with this project.


    ## Download Life Expectancy Data


    Next, follow this link to go to the page where the dataset is located:


    ```

    https://catalog.data.gov/dataset/age-adjusted-death-rates-and-life-expectancy-at-birth-all-races-both-sexes-united-sta-1900

    ```


    This page will include a detailed description of the data. We want to download
    the csv file into the “data” folder that we just created. Scroll down to the area
    of the page pictured in Figure [5-2](#478254_1_En_5_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig2_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Life expectancy CSV download link


    Click the “Download” button. The csv file will appear in your downloads folder.
    Move the csv file from your downloads folder to the data folder that you created
    in your project. Note that you will have to use your computer’s Finder or Explorer
    app to move this file.


    ## Add Dataset to R Project


    While we have the raw csv file saved in the `data` folder, we need our data to
    be in the dataframe format in order to be used in our analysis. The easiest way
    to read in the data in this format is to use the “Import Dataset” feature located
    in the environment view as pictured in Figure [5-3](#478254_1_En_5_Chapter.xhtml#Fig3).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig3_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Import dataset


    Go to the “Environment” view, click on “Import Dataset” and then choose “From
    Text (readr)…”. A screen similar to Figure [5-4](#478254_1_En_5_Chapter.xhtml#Fig4)
    will appear.


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig4_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Data import widget


    Use the “Browse” button to navigate to the csv file. This is highlighted in Figure
    [5-4](#478254_1_En_5_Chapter.xhtml#Fig4) at the upper right-hand area of the screen.
    The default name of the dataframe will be the same as the file, but since this
    would have been very long you can change it right from this widget screen as shown
    in the highlighted area next to “Name” in the lower left-hand area of the widget.
    We simply named the dataframe `expectancy`.


    Once you have completed this process, the dataframe will appear in your R Studio
    project as pictured in Figure [5-5](#478254_1_En_5_Chapter.xhtml#Fig5).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig5_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Dataframe in R Studio project


    In Figure [5-5](#478254_1_En_5_Chapter.xhtml#Fig5), you can see a sample of the
    dataframe at the top left. The code that was used to read in the data will appear
    in the Console at the bottom left and this code will also be retained in the history
    view. Finally, you will see an object with the name `expectancy` located in the
    “Environment” window at the top right. You can click this object to make the data
    appear again if you close the window at some point.


    This is the first step of setting up your project. Make sure to save your project’s
    state if you close RStudio. Otherwise you will need to repeat this process again
    if you want to work with your dataframe.


    ## R Code Files


    While it can be easy at first to use the provided widgets and interactive Console
    screen, if we want to redo our analysis or ask a colleague to run our analysis
    it would be difficult to retrace our steps. Our analysis is not really reproducible.


    To make our work reproducible, we can add R script files to our project. What
    we are going to do now is add an R script file and then add the code that was
    automatically generated to this file so that we can reuse this in the figure.


    Go to the RStudio menu bar and choose “File” ➤ “New File” ➤ “R Script”. A new
    tab as pictured in Figure [5-6](#478254_1_En_5_Chapter.xhtml#Fig6) will appear
    next to your dataframe labeled “Untitled1”.


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig6_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    R Script editor


    This script editor comes with very useful built in features along with a bar of
    visual shortcuts at the top. First, we will click the floppy disk icon to save
    this file into our project with a memorable name. Click the floppy disk icon and
    in the dialog box that appears enter in the filename `process_data.R`. The file
    will now appear in your file explorer and you can open the file up at any time
    by clicking on its name.


    We will look at the other features here when we talk about code tools but for
    now be aware that we can save our work here and also run code using the “Run”
    and “Source” buttons above. For now, we want to retrieve the code that was automatically
    generated that read in the csv file and then do a little housekeeping on this
    dataframe.


    Open up the “History” tab at the right and you should see the lines of code that
    were used to read in the csv file as pictured in Figure [5-7](#478254_1_En_5_Chapter.xhtml#Fig7).
    Command-click to highlight the first two lines of code.


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig7_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Retrieve code from History tab


    Click the “To Source” button to move this code into your R script file. Then click
    the floppy disk icon to save the file as pictured in Figure [5-8](#478254_1_En_5_Chapter.xhtml#Fig8).


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig8_HTML.jpg](images/478254_1_En_5_Chapter/478254_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    R Script file with retrieved code


    We can now rerun this step whenever we need to by clicking the “Source” button
    at the top. Also, we could send this project to a colleague and she could recreate
    our work in the same way so our analysis is on track to staying reproducible.


    Before we move on we should add some comments to our code and clean up the dataframe
    so that it is easier to work with later on. The code below is one example of how
    this can be done:


    ```

    # Import NCHS Dataset

    # File download from:

    #   https://catalog.data.gov

    # Contains life expectancy data from 1900 in the US

    library(readr)

    expectancy <- read_csv("data/NCHS_-_Death_rates_and_life_expectancy_at_birth.csv")

    # Clean up dataframe

    # Use shorter column names

    names(expectancy)[1] <- "year"

    names(expectancy)[2] <- "race"

    names(expectancy)[3] <- "sex"

    names(expectancy)[4] <- "life_expectancy"

    names(expectancy)[5] <- "death_rate"

    ```


    The next after the `#` are comments and the last five lines of R code replace
    the column names with shorter names that will be easier to work with. Don’t forget
    to click the floppy disk icon to save the code in this file.


    ## Data Exploration


    One of the things you may want to do when you are starting a new project is to
    do some exploratory data analysis. We can inspect the dataset visually already,
    but it would be nice to have a more complete picture. We also may want to start
    to visualize the more important data points.'
