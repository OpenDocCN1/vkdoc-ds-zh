    \n**图 7-6** 数据表格小组件\n\n## r2d3\n\n本章前两个部分讨论的软件包都提供了丰富的对象来可视化大多数类型的数据。然而，最终我们的图形看起来会像其他人设计的、所有\
    \ R 开发者都能使用的图形。\n\n在某些用例中，我们希望绝对控制可视化的每一个方面。要么是因为没有现成的小组件能帮到我们，要么是我们需要做一些高度定制化的工作。这就是\
