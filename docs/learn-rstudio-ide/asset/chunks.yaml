    to our repository.


    #### Committing Changes


    To commit the changes, we can type in a “commit message” to in the upper right-hand
    area of the screen and then click the “Commit” button as pictured in Figure [11-5](#478254_1_En_11_Chapter.xhtml#Fig5).


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig5_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig5_HTML.jpg)


    Figure 11-5


    Commit changes to the repository


    We could have removed the changes by clicking the “Revert” button instead of the
    “Commit” button.


    #### Git Branches


    Git has support for branches. You can create a branch when you want to make changes
    to a copy of your project so that you can test new features without affecting
    your original code. If you work on a branch and then later decide that you would
    like to keep the new feature, you have the ability to “merge” the branch into
    your original project.


    You can name new branches anything that you want, often you might use the name
    of the feature or bug you are working on. Your original source branch is named
    “master”. The git workflow that you generally follow is to create a new branch
    from the master branch, work on the new branch and if the new branch meets your
    requirements you will merge it back into the master.


    RStudio includes support for creating new branches and switching between branches.
    Use the buttons highlighted in Figure [11-6](#478254_1_En_11_Chapter.xhtml#Fig6)
    to add new branches and to switch branches.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig6_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig6_HTML.jpg)


    Figure 11-6


    Managing git branches


    The first button is used to create branches and the second is used to switch branches.
    When you switch branches all the code in your project will be replaced with the
    code from the branch.


    You can get a picture of all the branches in your repository by clicking the “Diff”
    button, then the “History” button, and then choosing “(all branches)” in the space
    right next to the “History” button. In Figure [11-7](#478254_1_En_11_Chapter.xhtml#Fig7),
    an example of a project with a master branch and a “new_feature” branch is shown.


    ![../images/478254_1_En_11_Chapter/478254_1_En_11_Fig7_HTML.jpg](images/478254_1_En_11_Chapter/478254_1_En_11_Fig7_HTML.jpg)


    Figure 11-7


    Git branches


    You can use this tool to navigate through and visualize the differences in your
    branches and to see the history of changes in the project. RStudio does not have
    support for all git features. If you want to delete branches or merge branches
    you will need to use the Terminal tab and look up the appropriate commands.'
