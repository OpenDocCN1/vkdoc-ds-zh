    ### 汇总数据框


    现在，让我们创建一个新的 R 脚本文件：在 RStudio 菜单栏中选择“文件” ➤ “新建文件” ➤ “R 脚本”。和之前一样，会打开一个新文件。点击软盘图标，将此文件保存为`data_exploration.R`。


    接下来，我们想要查看`expectancy`数据框的汇总信息，因此可以使用`summary`函数，并将数据框作为参数传入。


    ```

    summary(expectancy)

    ```


    将这段代码输入到你的 R 脚本文件中，然后点击“运行”按钮执行这段代码。你将看到输出结果描述了每个变量（即数据框的每一列），如图 5-9 所示。


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig9_HTML.jpg](img/478254_1_En_5_Fig9_HTML.jpg)


    图 5-9


    数据框汇总


    图 5-9 中的信息向我们展示了该数据集的许多信息。我们可以看到每一列包含的数据类型，以及一些关于数值数据的信息。例如，我们知道数据集涵盖了 1900 年到
    2015 年，并且某些年份的预期寿命为 29.10，而其他年份则为 81.4。我们还可以看到有两个字符类型`race`和`sex`，但关于它们的信息很少。这些是分类变量，将揭示该数据集的组织方式。


    要查看`race`和`sex`分类，我们可以使用 R 的`unique`函数，并将数据列作为参数传入，如下所示：


    ```

    unique(expectancy$race)

    ```


    如果点击“运行”按钮，你将看到以下输出：


    ```

    [1] "All Races" "Black"     "White"

    ```


    当你对`sex`分类进行同样的操作时，可以看到也有三个分类：“Both Sexes”、“Female”和“Male”。


    从所有这些信息中我们可以推断，我们的数据将按三个类别组织：年份、种族和性别。而且，很可能每一年都会有所有种族和性别组合的行。你可以使用数据框视图来验证这一点。


    导航到项目中的第一个标签页，再次查看`expectancy`数据框。点击筛选按钮查看数据的子集。使用年份列中的滑块，仅查看标识为 1900 年的行，如图 5-10
    所示。


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig10_HTML.jpg](img/478254_1_En_5_Fig10_HTML.jpg)


    图 5-10


    筛选后的数据框


    既然我们知道了数据是如何组织的，我们就需要小心处理这个数据框。例如，我们不应简单地按年份聚合数据点，因为它包含重叠的类别；在提出研究问题时，我们需要根据这些类别进行筛选。


    你可能还想做一些初步的可视化，以便开始了解我们正在查看的数值变量。例如，你可能猜测自 1900 年以来预期寿命有所增加。为了检验这个理论，你可以只查看数据框中`race`和`sex`类别值分别为“All
    Races”和“Both Sexes”的行。


    ```

    trend <- expectancy

    trend <- trend[trend$race == "All Races", ]

    trend <- trend[trend$sex == "Both Sexes", ]

    ```


    首先，我们将`expectancy`数据框赋值给一个名为`trend`的新数据框。然后，我们对数据取两个子集。第二行将返回所有`race`等于“All Races”的行，而第三行将返回所有`sex`等于“Both
    Sexes”的行。接下来，我们可以删除除我们特别关注的那些变量之外的所有变量。


    ```

    trend$race <- NULL

    trend$sex <- NULL

    trend$death_rate <- NULL

    ```


    在 R 中将对象设置为`NULL`会将其从环境中移除。现在，我们可以使用基础 R 的`plot`函数来绘制每年预期寿命的图表。


    ```

    plot(trend)

    ```


    这将自动绘制这两个变量，你的绘图查看器中会显示如图 5-11 所示的图形。


    ![../images/478254_1_En_5_Chapter/478254_1_En_5_Fig11_HTML.jpg](img/478254_1_En_5_Fig11_HTML.jpg)


    图 5-11


    按年份统计的预期寿命


    如你所见，这个图表支持了我们最初的猜测，即预期寿命会随着时间的推移而增加。图表还显示，早年间的观测值不如晚年间的一致。


    ## 结论


    本章提供了一个示例，说明如何使用 RStudio 项目来组织您的工作并使其可复现。RStudio 项目使您能够轻松地追溯步骤，并在完善分析时基于早期工作继续构建。此外，RStudio
    项目使与同事共享工作变得更加容易。


    在完成此类项目后关闭 RStudio 时，请确保在 IDE 提示您时点击“保存”。这将保存您的工作和历史记录，并在后续项目中更容易地从中断处继续。


    # 6. 必备 R 包：Tidyverse


    既然你已经掌握了基本的 RStudio 工作流程，我们准备开始重点介绍一些能够真正加速数据分析的工具。并非所有这些工具都是 RStudio 独有的，你也可能在其它
    R 环境中见到它们，但它们与 RStudio IDE 的契合度非常出色。


    这里的首要任务是向你介绍那些必须拥有的、将成为你 R 工具箱基石的包。这些包中的许多会简化 R 中已有的函数，而另一些则会为基础系统增加功能。RStudio
    与这些包共同将 R 转变为数据从业者的专业工具。


    ## R 包


    R 包是一种可以安装到 RStudio 中，以扩展 R 内置基本功能的东西。R 变得如此流行的原因之一，就是它拥有这个丰富的包生态系统，它真正使 R 成为一个全面的数据科学平台。


    你可以使用 RStudio 来加载、浏览、安装和移除包，或者使用 R 代码来管理 R 包。RStudio 的包支持功能在第 3 章中有详细讨论。


    ## Tidyverse


    我们将要讨论的包实际上是一个名为“`tidyverse`”的包集合。`Tidyverse`主要由哈德利·威克姆开发，他也在 RStudio 工作。`tidyverse`网站[`https://www.tidyverse.org`](https://www.tidyverse.org)对这套包的描述最为贴切：*“tidyverse
    是一个为数据科学设计的、有鲜明观点的 R 包集合。所有包共享底层设计理念、语法和数据结构。”*


    注意，作者将`tidyverse`描述为“有鲜明观点的”。这意味着`tidyverse`不仅仅是一组函数；它也是一种规定好的进行数据科学的方式。有一套`tidyverse`式的做事方法。这就是他们所说`tidyverse`是“有鲜明观点的”含义。


    `tidyverse`擅长做的事情之一，是平滑基础 R 中的粗糙边缘。`tidyverse`为基础 R 中已经存在的函数提供了一致的包装器，使其更易于使用和记忆。这些包还为基础
    R 增加了更多功能。例如，`ggplot2`（一个`tidyverse`包）扩展了基础 R 的`plot`函数的功能，并增加了更多的图表类型。让我们进入核心的`tidyverse`包。


    要跟随下面的示例操作，你必须先安装`tidyverse`，然后将该库导入到你的项目中。你可以使用第三章中关于包的说明来操作，或者在你的 R 控制台中输入以下代码。


    ```

    install.packages("tidyverse")

    library(tidyverse)

    ```

    '
- fmt: '# magrittr


    `magrittr`包通过引入管道操作符`%>%`改变了R编码的流程。`%>%`操作符将左侧的值管道传输到右侧的表达式。这使我们能够创建“管道”，从而可以立即且清晰地看到代码块的功能。


    在像R这样高度依赖函数的编程语言中，你最终会写出难以阅读的代码，例如：


    ```

    round(mean(subset(expectancy, race == "All Races")$death_rate), 1)

    ```


    这一行代码将返回我们在上一章中处理过的`expectancy`数据框中的平均死亡率。但是，它执行了三个任务：过滤数据集、计算平均分数，然后对结果进行四舍五入。像这样的代码很难阅读，而且随着问题变得复杂，这种代码会变得越来越难以理解。


    `magrittr`包的管道操作符`%>%`将通过消除嵌套函数调用的需求来帮助我们整理代码。以下是编写此代码的另一种方式：


    ```

    expectancy %>%

    subset(race == "All Races") %>%

    .$death_rate %>%

    mean() %>%

    round(1)

    ```


    这段代码稍长一些，但清晰得多。你可以从上到下阅读，每个`%>%`都将其上方的对象作为第一个参数传递到下一个函数。在最上方，我们使用`%>%`将`expectancy`数据框作为其右侧参数传递给`subset`。


    现在我们可以清楚地说明，我们从数据框开始，获取了一个行子集，选择了`death_rate`，使用`mean`得到平均值，然后对值进行了四舍五入。


    ### 注意


    上面第三行代码中使用的点`·`用于引用由`magrittr`管道传输的对象，因此在上面的例子中，它指的是`subset`函数输出的数据框。


    `magrittr`包是一个核心包，用于所有`tidyverse`包，并帮助塑造`tidyverse`中使用的风格化分析方式。


    # tibble


    `tibble`包是另一个`tidyverse`基础包。`tibble`是基础R数据框的tidyverse版本。你不一定会直接使用这个包，但`tidyverse`函数会返回`tibble`而不是数据框。


    在实践中，这不会对你产生太大影响，你可以将`tibble`视为数据框。然而，`tibble`的行为方式会有所不同。例如，如果我们在R控制台中输入单词`iris`，我们只会得到`iris`数据框中所有内容的列表。但是，如果你将`iris`数据框转换为`tibble`并检查输出，如下所示：


    ```

    iris %>% as_tibble()

    ```


    你将得到整洁的数据打印输出，如图[6-1](#478254_1_En_6_Chapter.xhtml#Fig1)所示。


    ![../images/478254_1_En_6_Chapter/478254_1_En_6_Fig1_HTML.jpg](images/478254_1_En_6_Chapter/478254_1_En_6_Fig1_HTML.jpg)


    图6-1


    `tibble`整洁输出


    这仅显示一个屏幕的数据，但提供了更有用的信息。我们可以看到数据本身的样本，并获得每列的数据类型和数据集的维度。


    # dplyr


    `dplyr`是一个用于数据操作的`tidyverse`包。这个包使得过滤行、选择变量和修改内容变得更加容易。`dplyr`与`magrittr`紧密合作，提供了一套用于数据操作的“语法”。


    在`dplyr`和整个`tidyverse`中，“语法”一词指的是在R中工作的风格化方式。在`tidyverse`语法中，函数被称为动词。动词的编写方式使其非常具有描述性，这样当你使用`tidyverse`语法时，你编写的代码就能非常清晰地讲述你的分析故事。


    例如，你可以使用`dplyr`和`magrittr`像这样编写上一个查找平均死亡率的例子：


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    summarize(avg = mean(death_rate)) %>%

    mutate(avg = round(avg, 1))

    ```


    在上面的代码中，我们将`expectancy`数据框通过管道传递给一组描述我们正在做什么的动词。我们在进行过滤、汇总和修改。这描述了我们的操作。它还使得对此管道进行更改变得容易，因为我们可以简单地更改或在此管道中的任何位置添加新的动词。


    上面的代码将输出一个作为`tibble`返回的值。


    ```

    # A tibble: 1 x 1

    avg


    1 1489.

    ```


    如果我们想要进行相同的分析，但还想按性别查看平均死亡率，我们可以简单地向管道添加一个`group_by`动词。


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    group_by(sex) %>%

    summarize(avg = mean(death_rate)) %>%

    mutate(avg = round(avg, 1))

    ```


    这次我们将得到三个值：一个针对双性，一个针对男性，一个针对女性。


    ```

    # A tibble: 3 x 2

    sex          avg


    1 Both Sexes 1478.

    2 Female     1305.

    3 Male       1683.

    ```


    ## 类似SQL的连接


    使用`inner_join`、`left_join`和`right_join`动词来组合两个相关数据集。这些`dplyr`动词大致相当于名称相似的SQL语句INNER
    JOIN、LEFT JOIN和RIGHT JOIN。


    为了说明`dplyr`连接，假设我们想要在我们的数据框（抱歉，`tibble`！）中使用新标签，并且我们还有一个包含更好标签的`tibble`。你可以像这样创建一个标签`tibble`来进行跟进：


    ```

    labels <- tribble(

    ~key, ~new_label,

    "Both Sexes",   "All Genders",

    "Female",   "Identifies Female",

    "Male",   "Identifies Male"

    )

    ```


    如果你运行这段代码，一个名为“labels”的新`tibble`将出现在环境窗口的“Data”下。你可以像之前查看数据框一样查看它，只需在视图中单击对象名称即可。


    我们现在可以使用`dplyr`动词`inner_join`轻松地将这些标签添加到我们的管道中。


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    group_by(sex) %>%

    summarize(avg = mean(death_rate)) %>%

    inner_join(labels, by = c("sex" = "key")) %>%

    mutate(avg = round(avg, 1)) %>%

    select(gender = new_label,

    avg_death_rate = avg)

    ```


    在上面的代码中，你还可以看到我们使用了`dplyr`动词`select`来以更令人愉悦的方式排列和重命名标签。你可以在图[6-2](#478254_1_En_6_Chapter.xhtml#Fig2)中看到结果。


    ![../images/478254_1_En_6_Chapter/478254_1_En_6_Fig2_HTML.jpg](images/478254_1_En_6_Chapter/478254_1_En_6_Fig2_HTML.jpg)


    图6-2


    应用于`tibble`的性别标签


    当你运行上面的代码时，你会看到结果以`tibble`的形式返回。你可以使用赋值操作符`<-`存储结果，以便稍后使用，而不是在控制台中显示结果。


    ```

    avg_death_rates_by_gender <

    filter(race == "All Races") %>%

    group_by(sex) %>%

    summarize(avg = mean(death_rate)) %>%

    inner_join(labels, by = c("sex" = "key")) %>%

    mutate(avg = round(avg, 1)) %>%

    select(gender = new_label,

    avg_death_rate = avg)

    ```


    # stringr


    我们将详细研究的最后一个`tidyverse`包将帮助你处理字符串。处理字符串很棘手，因为这种数据类型可能比简单的数字更复杂。`stringr`包含用于检测模式、分割字符串和连接字符串的函数。


    你可以单独使用`stringr`函数，也可以与`dplyr`动词（如`filter`和`mutate`）一起使用。例如，要过滤在`race`列中包含字符模式“All”的记录，你可以在`filter`动词中使用`str_detect`，如下所示：


    ```

    expectancy %>%

    filter(str_detect(race, "All"))

    ```


    我们可以使用`str_replace`将一个字符模式替换为另一个。要将`race`列中的条目“All Races”更改为“Most Races”，你可以这样做：


    ```

    expectancy %

    mutate(race = str_replace(race, "All", "Most"))

    ```


    有许多`stringr`函数可以帮助你处理字符串。其中许多只是与基础R函数一起工作的包装器。`stringr`的价值主要在于它提供了一致的接口。每个函数都会将输入字符串作为第一个参数，这样它们就可以与`magrittr`管道操作符一起工作。'
  raw: '## magrittr


    The `magrittr` package changes the flow of R coding by introducing the pipe operator
    `%<%`. The `%<%` operator pipes left-hand values into right-hand expressions.
    This allows us to create “pipelines” where we can immediately and clearly see
    what a block of code is doing.


    In a programming language like R that depends so much on functions you will start
    to end up with code that is difficult to read like this:


    ```

    round(mean(subset(expectancy, race == "All Races")$death_rate), 1)

    ```


    This one line of code will return the average death rate in our expectancy dataframe
    we worked with in the last chapter. However, it is performing three tasks: filtering
    the dataset, calculating the average score, and then rounding the result. It is
    very hard to read code like this and as problems become more complex, code like
    this gets harder to read.


    The `magrittr` package pipe operator `%>%` will help us tidy our code by removing
    the need to nest function calls. Here is an alternative way to write this code:


    ```

    expectancy %>%

    subset(race == "All Races") %>%

    .$death_rate %>%

    mean() %>%

    round(1)

    ```


    This code is a little bit longer, but it is also much clearer. You read it top
    to bottom and each `%>%` takes the object above it and sends it to the next function
    as the first argument. At the top we use `%>%` to send the expectancy dataframe
    to subset as its right argument.


    Now we can clearly say that we started with the dataframe, took a subset of rows,
    selected the `death_rate`, used mean to get an average, and then rounded the value.


    ### Note


    the period `.` used above in the third line of code is used to reference the object
    being piped by magrittr and so above it refers to the dataframe that the subset
    function outputs.


    The `magrittr` package is a core package that is used in all the `tidyverse` packages
    and helps inform the opinionated style of analysis used in the `tidyverse`.


    ## tibble


    The `tibble` package is another `tidyverse` foundational package. A `tibble` is
    the tidyverse version of the base R dataframe. You will not necessarily use this
    package directly, but the `tidyverse` functions will return `tibbles` instead
    of dataframes.


    In practice, this will not affect you much and you can treat a `tibble` as a dataframe.
    However, `tibble` will behave in different ways. For example, if we typed in the
    word iris in the R Console we would simply get a listing of all the contents in
    the iris dataframe. However, if you convert the iris dataframe to a `tibble` and
    examine the output like this:


    ```

    iris %>% as_tibble()

    ```


    You will get tidy printout of data that looks like what is pictured in Figure
    [6-1](#478254_1_En_6_Chapter.xhtml#Fig1).


    ![../images/478254_1_En_6_Chapter/478254_1_En_6_Fig1_HTML.jpg](images/478254_1_En_6_Chapter/478254_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    Tibble tidy output


    This shows only one screen of data, but more useful information is presented.
    We can see a sample of the data itself and we get the data types for each column
    and the dimensions of the dataset.


    ## dplyr


    `dplyr` is a `tidyverse` package that you use to do data manipulation. This package
    makes it much easier to filter rows, select variables, and mutate content. `dplyr`
    works hand in hand with `magrittr` to provide a “grammar” for data manipulation.


    In `dplyr` and `tidyverse` in general, the word grammar refers to the opinionated
    way of working in R. In the `tidyverse` grammar, functions are called verbs. Verbs
    are written in a way to make them very descriptive so that when you use `tidyverse`
    grammars the code that you are writing tells the story of your analysis in a very
    clear way.


    For example, you can code the last example where we found the average death rate
    using `dplyr` and `magrittr` like this:


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    summarize(avg = mean(death_rate)) %>%

    mutate(avg = round(avg, 1))

    ```


    In the code above, we pipe the expectancy dataframe to a set of verbs that describe
    what we are doing. We are filtering, summarizing, and mutating. This describes
    what we are doing. It also makes it easy to make changes to this pipeline, since
    we can simply change or add new verbs anywhere in the pipeline.


    The code above will output one value that gets returned as a tibble.


    ```

    # A tibble: 1 x 1

    avg


    1 1489.

    ```


    If we want to do the same analysis, but also see what the average death rate is
    by sex we can simply add a `group_by` verb to the pipeline.


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    group_by(sex) %>%

    summarize(avg = mean(death_rate)) %>%

    mutate(avg = round(avg, 1))

    ```


    This time we will get three values: one for both sexes, one for males, and one
    for females.


    ```

    # A tibble: 3 x 2

    sex          avg


    1 Both Sexes 1478.

    2 Female     1305.

    3 Male       1683.

    ```


    ### SQL Like Joins


    Use the `inner_join`, `left_join` and `right_join` verbs to combine two related
    datasets together. These `dplyr` verbs are roughly the equivalent of the similarly
    named SQL statements INNER JOIN, LEFT JOIN, and RIGHT JOIN.


    To illustrate a `dplyr` join let’s imagine that we wanted new labels in our dataframe
    (excuse me, `tibble`!) and we also had a `tibble` that included our better labels.
    You can create a label `tibble` like this to follow along:


    ```

    labels <- tribble(

    ~key, ~new_label,

    "Both Sexes",   "All Genders",

    "Female",   "Identifies Female",

    "Male",   "Identifies Male"

    )

    ```


    If you run this code, a new tibble named “labels” will appear under “Data” in
    your environment window. You can view this in the same way as you viewed dataframes
    before by simply clicking on the object name in the view.


    We can now easily add these labels into our pipeline using the `inner_join` dplyr
    verb.


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    group_by(sex) %>%

    summarize(avg = mean(death_rate)) %>%

    inner_join(labels, by = c("sex" = "key")) %>%

    mutate(avg = round(avg, 1)) %>%

    select(gender = new_label,

    avg_death_rate = avg)

    ```


    In the code above, you can also see that we used a `select dplyr` verb to arrange
    and rename the labels in a more pleasing way. You can see the results in Figure
    [6-2](#478254_1_En_6_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_6_Chapter/478254_1_En_6_Fig2_HTML.jpg](images/478254_1_En_6_Chapter/478254_1_En_6_Fig2_HTML.jpg)


    Figure 6-2


    Gender labels applied to tibble


    When you run the code above, you will see that the results are returned as a `tibble`
    . Instead of displaying the results in the Console you could also use the assignment
    operator `<-` to store the results so that you can use them later on.


    ```

    avg_death_rates_by_gender %

    filter(race == "All Races") %>%

    group_by(sex) %>%

    summarize(avg = mean(death_rate)) %>%

    inner_join(labels, by = c("sex" = "key")) %>%

    mutate(avg = round(avg, 1)) %>%

    select(gender = new_label,

    avg_death_rate = avg)

    ```


    ## stringr


    The last `tidyverse` package that we will look at in detail will help you work
    with strings. Working with strings is tricky because this data type can be more
    complicated that a simple number. `stringr` includes functions to help detect
    patterns, split strings and join strings.


    You can use stringr functions on their own, but also with `dplyr` verbs like `filter`
    and `mutate`. For instance, to filter records that include the pattern of characters
    “All” in the race column you use `str_detect` in the filter verb like this:


    ```

    expectancy %>%

    filter(str_detect(race, "All"))

    ```


    We could use `str_replace` to replace one pattern of characters with another.
    To change the race column “All Races” entry to “Most Races” you could do this:


    ```

    expectancy %

    mutate(race = str_replace(race, "All", "Most"))

    ```


    There are many `stringr` functions that will help you work with strings. Many
    are simply wrappers that work with base R functions. The value of `stringr` is
    mainly in that it provides a consistent interface. Each function will have the
    input string as the first argument so these can work with the `magrittr` pipe
    operator.'
  trans: "\n# magrittr\n\n`magrittr`包通过引入管道操作符`%>%`改变了 R 编码的流程。`%>%`操作符将左侧的值管道传输到右侧的表达式。这使我们能够创建“管道”，从而可以立即且清晰地看到代码块的功能。\n\
    \n在像 R 这样高度依赖函数的编程语言中，你最终会写出难以阅读的代码，例如：\n\n```\nround(mean(subset(expectancy,\
    \ race == \"All Races\")$death_rate), 1)\n```\n\n这一行代码将返回我们在上一章中处理过的`expectancy`数据框中的平均死亡率。但是，它执行了三个任务：过滤数据集、计算平均分数，然后对结果进行四舍五入。像这样的代码很难阅读，而且随着问题变得复杂，这种代码会变得越来越难以理解。\n\
    \n`magrittr`包的管道操作符`%>%`将通过消除嵌套函数调用的需求来帮助我们整理代码。以下是编写此代码的另一种方式：\n\n```\nexpectancy\
    \ %>%\nsubset(race == \"All Races\") %>%\n.$death_rate %>%\nmean() %>%\nround(1)\n\
    ```\n\n这段代码稍长一些，但清晰得多。你可以从上到下阅读，每个`%>%`都将其上方的对象作为第一个参数传递到下一个函数。在最上方，我们使用`%>%`将`expectancy`数据框作为其右侧参数传递给`subset`。\n\
    \n现在我们可以清楚地说明，我们从数据框开始，获取了一个行子集，选择了`death_rate`，使用`mean`得到平均值，然后对值进行了四舍五入。\n\n\
    ### 注意\n\n上面第三行代码中使用的点`·`用于引用由`magrittr`管道传输的对象，因此在上面的例子中，它指的是`subset`函数输出的数据框。\n\
    \n`magrittr`包是一个核心包，用于所有`tidyverse`包，并帮助塑造`tidyverse`中使用的风格化分析方式。\n\n# tibble\n\
    \n`tibble`包是另一个`tidyverse`基础包。`tibble`是基础 R 数据框的 tidyverse 版本。你不一定会直接使用这个包，但`tidyverse`函数会返回`tibble`而不是数据框。\n\
    \n在实践中，这不会对你产生太大影响，你可以将`tibble`视为数据框。然而，`tibble`的行为方式会有所不同。例如，如果我们在 R 控制台中输入单词`iris`，我们只会得到`iris`数据框中所有内容的列表。但是，如果你将`iris`数据框转换为`tibble`并检查输出，如下所示：\n\
    \n```\niris %>% as_tibble()\n```\n\n你将得到整洁的数据打印输出，如图 6-1 所示。\n\n![../images/478254_1_En_6_Chapter/478254_1_En_6_Fig1_HTML.jpg](img/478254_1_En_6_Fig1_HTML.jpg)\n\
    \n图 6-1\n\n`tibble`整洁输出\n\n这仅显示一个屏幕的数据，但提供了更有用的信息。我们可以看到数据本身的样本，并获得每列的数据类型和数据集的维度。\n\
    \n# dplyr\n\n`dplyr`是一个用于数据操作的`tidyverse`包。这个包使得过滤行、选择变量和修改内容变得更加容易。`dplyr`与`magrittr`紧密合作，提供了一套用于数据操作的“语法”。\n\
    \n在`dplyr`和整个`tidyverse`中，“语法”一词指的是在 R 中工作的风格化方式。在`tidyverse`语法中，函数被称为动词。动词的编写方式使其非常具有描述性，这样当你使用`tidyverse`语法时，你编写的代码就能非常清晰地讲述你的分析故事。\n\
    \n例如，你可以使用`dplyr`和`magrittr`像这样编写上一个查找平均死亡率的例子：\n\n```\nexpectancy %>%\nfilter(race\
    \ == \"All Races\") %>%\nsummarize(avg = mean(death_rate)) %>%\nmutate(avg = round(avg,\
    \ 1))\n```\n\n在上面的代码中，我们将`expectancy`数据框通过管道传递给一组描述我们正在做什么的动词。我们在进行过滤、汇总和修改。这描述了我们的操作。它还使得对此管道进行更改变得容易，因为我们可以简单地更改或在此管道中的任何位置添加新的动词。\n\
    \n上面的代码将输出一个作为`tibble`返回的值。\n\n```\n# A tibble: 1 x 1\navg\n\n1 1489.\n```\n\n\
    如果我们想要进行相同的分析，但还想按性别查看平均死亡率，我们可以简单地向管道添加一个`group_by`动词。\n\n```\nexpectancy %>%\n\
    filter(race == \"All Races\") %>%\ngroup_by(sex) %>%\nsummarize(avg = mean(death_rate))\
    \ %>%\nmutate(avg = round(avg, 1))\n```\n\n这次我们将得到三个值：一个针对双性，一个针对男性，一个针对女性。\n\n\
    ```\n# A tibble: 3 x 2\nsex          avg\n\n1 Both Sexes 1478.\n2 Female     1305.\n\
    3 Male       1683.\n```\n\n## 类似 SQL 的连接\n\n使用`inner_join`、`left_join`和`right_join`动词来组合两个相关数据集。这些`dplyr`动词大致相当于名称相似的\
    \ SQL 语句 INNER JOIN、LEFT JOIN 和 RIGHT JOIN。\n\n为了说明`dplyr`连接，假设我们想要在我们的数据框（抱歉，`tibble`！）中使用新标签，并且我们还有一个包含更好标签的`tibble`。你可以像这样创建一个标签`tibble`来进行跟进：\n\
    \n```\nlabels <- tribble(\n~key, ~new_label,\n\"Both Sexes\",   \"All Genders\"\
    ,\n\"Female\",   \"Identifies Female\",\n\"Male\",   \"Identifies Male\"\n)\n\
    ```\n\n如果你运行这段代码，一个名为“labels”的新`tibble`将出现在环境窗口的“Data”下。你可以像之前查看数据框一样查看它，只需在视图中单击对象名称即可。\n\
    \n我们现在可以使用`dplyr`动词`inner_join`轻松地将这些标签添加到我们的管道中。\n\n```\nexpectancy %>%\nfilter(race\
    \ == \"All Races\") %>%\ngroup_by(sex) %>%\nsummarize(avg = mean(death_rate))\
    \ %>%\ninner_join(labels, by = c(\"sex\" = \"key\")) %>%\nmutate(avg = round(avg,\
    \ 1)) %>%\nselect(gender = new_label,\navg_death_rate = avg)\n```\n\n在上面的代码中，你还可以看到我们使用了`dplyr`动词`select`来以更令人愉悦的方式排列和重命名标签。你可以在图\
    \ 6-2 中看到结果。\n\n![../images/478254_1_En_6_Chapter/478254_1_En_6_Fig2_HTML.jpg](img/478254_1_En_6_Fig2_HTML.jpg)\n\
    \n图 6-2\n\n应用于`tibble`的性别标签\n\n当你运行上面的代码时，你会看到结果以`tibble`的形式返回。你可以使用赋值操作符`<-`存储结果，以便稍后使用，而不是在控制台中显示结果。\n\
    \n```\navg_death_rates_by_gender <-\n  expectancy %>%\n  filter(race == \"All\
    \ Races\") %>%\n  group_by(sex) %>%\n  summarize(avg = mean(death_rate)) %>%\n\
    \  inner_join(labels, by = c(\"sex\" = \"key\")) %>%\n  mutate(avg = round(avg,\
    \ 1)) %>%\n  select(gender = new_label,\n         avg_death_rate = avg)\n```\n\
    \n# stringr\n\n我们将详细研究的最后一个`tidyverse`包将帮助你处理字符串。处理字符串很棘手，因为这种数据类型可能比简单的数字更复杂。`stringr`包含用于检测模式、分割字符串和连接字符串的函数。\n\
    \n你可以单独使用`stringr`函数，也可以与`dplyr`动词（如`filter`和`mutate`）一起使用。例如，要过滤在`race`列中包含字符模式“All”的记录，你可以在`filter`动词中使用`str_detect`，如下所示：\n\
    \n```\nexpectancy %>%\nfilter(str_detect(race, \"All\"))\n```\n\n我们可以使用`str_replace`将一个字符模式替换为另一个。要将`race`列中的条目“All\
    \ Races”更改为“Most Races”，你可以这样做：\n\n```\nexpectancy %>%\n  mutate(race = str_replace(race,\
    \ \"All\", \"Most\"))\n```\n\n有许多`stringr`函数可以帮助你处理字符串。其中许多只是与基础 R 函数一起工作的包装器。`stringr`的价值主要在于它提供了一致的接口。每个函数都会将输入字符串作为第一个参数，这样它们就可以与`magrittr`管道操作符一起工作。\n"
- fmt: '```markdown

    ## Conclusion


    There are many more packages in the `tidyverse` collection, but the ones covered
    above will give you the knowledge to be able to work with any `tidyverse` package.
    These are also the packages that you are most likely to use on a daily basis and
    require concepts that extend base R enough that we felt that they deserved a more
    detailed treatment. But, let’s also take a moment to mention some other packages
    just so you are aware of what else is available to you.


    `ggplot2` is a `tidyverse` package that really sets the standard for data visualization
    in R. This package will get detailed treatment in the chapter on data visualization.
    `tidyr` helps transform data into tidy `tibble` datasets that are easy to add
    to your analysis pipeline. `readr`, `readxl`, and `haven` helps you import text
    data, Excel data and SAS/Stata/SPSS data. `lubridate` helps you work with tricky
    dates and date-times.


    # 7. Data Visualization


    One of the most appealing elements for RStudio users is the rich library of data
    visualization tools that are available. In this chapter, we are going to highlight
    major graphic tools that will inform most of your daily work. Of course, in the
    R ecosystem we have hundreds of additional libraries and specialized packages
    that may be used for visualization.


    For now, we will focus on the tools that will have the most impact on you immediately
    starting with `ggplot2` (a `tidyverse` package). From there, we will move on to
    packages that give you more control of your visualizations at the cost of requiring
    more work from you to use.


    ## `ggplot2`


    `ggplot2` is the `tidyverse` way of doing essential plotting. This replaces and
    enhances the base R methods of plotting data that we have already seen in earlier
    chapters. As you may expect from our discussion of `dplyr` in the last chapter,
    `ggplot2` offers a very opinionated way of doing data visualization. You will
    use `ggplot2` for your daily data exploration and also for inclusion in reports
    where static graphics are acceptable.


    Let’s take a look at how to use `ggplot2`. Firstly, as with the other `tidyverse`
    packages we need to use the library function to load the `tidyverse` packages
    `library(tidyverse)`.


    ```

    library(tidyverse)

    source("process_data.R")

    ```


    After we loaded `tidyverse`, in the second line of code, we used the `source`
    command to rerun all the code that we saved in the “process_data.R” file. This
    ensures that we are both on the same page when it comes to the structure of the
    expectancy dataset.


    To use `ggplot2`, we can pipe a dataset to the `ggplot` function. This function
    requires us to specify the variables that we want to plot.


    ```

    expectancy %>%

    filter(race == "All Races",

    sex == "Both Sexes") %>%

    ggplot(aes(year, life_expectancy))

    ```


    When you run this code, you will see a blank canvas appear with the X and Y axis
    already defined as pictured in Figure [7-1](#478254_1_En_7_Chapter.xhtml#Fig1).


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig1_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Blank `ggplot` canvas


    Figure [7-1](#478254_1_En_7_Chapter.xhtml#Fig1) shows a canvas with the year on
    the X axis and the death rate on Y axis. Now that we have defined the scope of
    the plot, we can start to add visual elements to show the data. You do that by
    piping the `ggplot` function to a set of “verbs” that describe the data story.


    ```

    expectancy %>%

    filter(race == "All Races",

    sex == "Both Sexes") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line()

    ```


    We used the `geom_line` verb to state that we would like to use a line to represent
    the data. Instead of using the `magrittr` pipe operator `%>%` that you would expect,
    `ggplot2` uses a plus symbol `+` to pipe. See Figure [7-2](#478254_1_En_7_Chapter.xhtml#Fig2)
    for an example of this line plot.


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig2_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Death rate by year line plot


    The plot in Figure [7-2](#478254_1_En_7_Chapter.xhtml#Fig2) shows an interesting
    trend as well as a possible outlier that may need to be explained later on. You
    can continue to layer on visualizations by piping them using the pipe operator
    `+`. If you wanted to add points to the line you would use the `geom_point` verb.


    ```

    expectancy %>%

    filter(race == "All Races",

    sex == "Both Sexes") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line() +

    geom_point()

    ```


    This would produce the plot shown in Figure [7-3](#478254_1_En_7_Chapter.xhtml#Fig3).


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig3_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Adding point markers to line plot


    What if we wanted to see this trend broken down by sex? To look at subgroups like
    that in `ggplot` line plot you simply add a new aesthetic parameter to the `geom_line`
    verb that you want to categorize.


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line(aes(color = sex))

    ```


    Note that we are no longer filtering on “Both Sexes” in the first part of this
    visualization since we want to look at all three groups. This code will produce
    the plot shown in Figure [7-4](#478254_1_En_7_Chapter.xhtml#Fig4).


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig4_HTML.jpg](images/478254_1_En_7_Chapter/478254_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Plotting subgroups in `ggplot`


    This plot shows us the relationship between the two sexes that we have data on.
    The lines appear in color because we specified the color aesthetic in our `geom_line`.


    There is much more to `ggplot` that we have space to cover in this chapter. You
    get plenty of options to display different types of data along with label and
    title options. This package is essentially the visualization workhorse for RStudio.
    Take a look at the official website `ggplot2` to get more information on how to
    use this package: [`https://ggplot2.tidyverse.org`](https://ggplot2.tidyverse.org).

    ```'
