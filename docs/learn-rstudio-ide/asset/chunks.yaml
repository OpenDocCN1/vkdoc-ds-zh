    ## 结论


    `tidyverse` 集合中还有许多其他包，但上面介绍的这些包将为您提供使用任何`tidyverse`包所需的知识。这些也是您最有可能日常使用的包，并且它们所涉及的概念对基础
    R 的扩展程度足以让我们认为它们值得更详细的介绍。不过，让我们也花点时间提一下其他一些包，以便您了解还有哪些其他工具可用。


    `ggplot2` 是一个`tidyverse`包，它真正为 R 语言中的数据可视化设定了标准。这个包将在数据可视化章节中得到详细讲解。`tidyr` 帮助将数据转换为整洁的`tibble`数据集，便于添加到您的分析流程中。`readr`、`readxl`
    和 `haven` 帮助您导入文本数据、Excel 数据以及 SAS/Stata/SPSS 数据。`lubridate` 帮助您处理棘手的日期和日期时间。


    # 7. 数据可视化


    对 RStudio 用户来说，最有吸引力的元素之一是可用的丰富数据可视化工具库。在本章中，我们将重点介绍最常使用的图形工具，这些工具将满足您大部分日常工作。当然，在
    R 生态系统中，我们还有数以百计的其他库和专用包可用于可视化。


    现在，我们将首先关注那些能立即对您产生最大影响的工具，从 `ggplot2`（一个`tidyverse`包）开始。然后，我们将继续介绍其他一些包，这些包能让您对可视化有更多控制，但代价是需要您投入更多精力来使用。


    ## `ggplot2`


    `ggplot2` 是`tidyverse`中进行基本绘图的方式。它替换并增强了我们在前面章节中已经看到的基础 R 的数据绘图方法。正如您从上一章我们对 `dplyr`
    的讨论中所期望的那样，`ggplot2` 提供了一种非常独特的数据可视化方式。您将使用 `ggplot2` 进行日常数据探索，也用于在可接受静态图形的报告中进行数据展示。


    让我们看看如何使用 `ggplot2`。首先，与其他`tidyverse`包一样，我们需要使用 library 函数来加载`tidyverse`包 `library(tidyverse)`。


    ```

    library(tidyverse)

    source("process_data.R")

    ```


    在加载了 `tidyverse` 之后，在第二行代码中，我们使用 `source` 命令重新运行保存在 "process_data.R" 文件中的所有代码。这确保了我们就预期寿命数据集的结构达成了共识。


    要使用 `ggplot2`，我们可以通过管道将一个数据集传递给 `ggplot` 函数。这个函数需要我们指定要绘制的变量。


    ```

    expectancy %>%

    filter(race == "All Races",

    sex == "Both Sexes") %>%

    ggplot(aes(year, life_expectancy))

    ```


    当你运行这段代码时，你会看到一个空白画布，X 轴和 Y 轴已定义好，如图 7-1 所示。


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig1_HTML.jpg](img/478254_1_En_7_Fig1_HTML.jpg)


    图 7-1


    空白 `ggplot` 画布


    图 7-1 显示了一个画布，X 轴为年份，Y 轴为死亡率。现在我们已经定义了绘图的范畴，可以开始添加视觉元素来展示数据了。通过将 `ggplot` 函数通过管道传递给一组描述数据故事的“动词”来实现。


    ```

    expectancy %>%

    filter(race == "All Races",

    sex == "Both Sexes") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line()

    ```


    我们使用了 `geom_line` 动词来声明我们想用一条线来表示数据。与您可能期望的使用 `magrittr` 管道操作符 `%>%` 不同，`ggplot2`
    使用加号 `+` 来进行管道操作。请参见图 7-2 查看此折线图的示例。


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig2_HTML.jpg](img/478254_1_En_7_Fig2_HTML.jpg)


    图 7-2


    按年份的死亡率折线图


    图 7-2 中的图显示了一个有趣的趋势以及一个可能的异常值，这个异常值可能需要在以后进行解释。您可以通过管道操作符 `+` 继续添加可视化图层。如果您想在线条上添加点，可以使用
    `geom_point` 动词。


    ```

    expectancy %>%

    filter(race == "All Races",

    sex == "Both Sexes") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line() +

    geom_point()

    ```


    这将生成图 7-3 所示的图形。


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig3_HTML.jpg](img/478254_1_En_7_Fig3_HTML.jpg)


    图 7-3


    向折线图添加点标记


    如果我们想按性别细分查看这一趋势呢？要在 `ggplot` 折线图中查看这样的子组，您只需向您想要分类的 `geom_line` 动词添加一个新的美学参数。


    ```

    expectancy %>%

    filter(race == "All Races") %>%

    ggplot(aes(year, life_expectancy)) +

    geom_line(aes(color = sex))

    ```


    请注意，我们在该可视化的第一部分不再过滤“Both Sexes”，因为我们希望查看所有三个组。此代码将生成图 7-4 所示的图形。


    ![../images/478254_1_En_7_Chapter/478254_1_En_7_Fig4_HTML.jpg](img/478254_1_En_7_Fig4_HTML.jpg)


    图 7-4


    在 `ggplot` 中绘制子组


    此图向我们展示了有所数据的两个性别之间的关系。线条显示为彩色，因为我们在 `geom_line` 中指定了颜色美学参数。


    关于 `ggplot` 的内容远不止本章所能涵盖的。您有大量选项来显示不同类型的数据，以及标签和标题选项。这个包基本上是 RStudio 进行可视化的主力工具。请访问
    `ggplot2` 的官方网站以获取更多关于如何使用此包的信息：[`https://ggplot2.tidyverse.org`](https://ggplot2.tidyverse.org)。

    ```

