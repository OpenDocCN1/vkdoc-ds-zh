    ### 数据集


    为了演示导入功能，我们从 [data.gov](http://data.gov) 网站用于食物金字塔的一个数据集中下载了一个数据集 [`https://catalog.data.gov/dataset/mypyramid-food-raw-data-f9ed6`](https://catalog.data.gov/dataset/mypyramid-food-raw-data-f9ed6)。食物金字塔网站如图
    2-8 所示。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig8_HTML.jpg](img/478254_1_En_2_Fig8_HTML.jpg)


    图 2-8


    食物金字塔数据下载页面


