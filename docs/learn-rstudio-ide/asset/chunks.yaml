  trans: '

    # 1. 安装 RStudio


    RStudio 是一个集成开发环境（IDE），它为 R 语言添加了语法高亮和代码重构等现代功能。RStudio 的优势在于，它将你所需的所有功能集中在一个地方。在安装
    RStudio 之前，我们需要先为操作系统安装最新版本的 R 语言，以及另一个名为 `git` 的程序。这两个软件包都会集成到 RStudio 中，但它们并不随
    RStudio IDE 一起提供。


    R 是一种统计编程语言，我们需要通过它来使用 RStudio。Git 是一个流行的版本控制系统，它将被集成到 RStudio 中。像 `git` 这样的版本控制系统用于管理你正在处理的代码副本。Git
    能帮助你查看文件不同版本之间的差异，从而深入了解为什么某个版本的代码行为与其他版本不同。Git 也是使用 Github 所必需的，Github 是一个程序员分享代码和项目的在线社区。


    ## 安装 R


    R 是一款用于统计编程和图形的免费开源软件。你可以从 CRAN（综合 R 档案网络）获取最新版本的 R。这是一个镜像服务器网络，上面存有 R 及其扩展包的副本。R
    扩展包是对核心 R 编程语言的扩展，由社区中的 R 用户贡献。


    要安装 R，请访问此网址：[`https://cran.r-project.org/mirrors.html`](https://cran.r-project.org/mirrors.html)，你将看到一个如图
    1-1 所示的列表。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig1_HTML.jpg](img/478254_1_En_1_Fig1_HTML.jpg)


    **图 1-1** CRAN 镜像


    向下滚动服务器列表，找到离你地理位置最近的一个，然后点击链接。不必过于纠结要选绝对最近的服务器，从你所在国家任意选一个通常都可以。如果发现链接失效，只需返回并尝试其他服务器。你将进入一个新页面，上面列出了适用于
    Windows 和 Mac 的 R 版本，如图 1-2 所示。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig2_HTML.jpg](img/478254_1_En_1_Fig2_HTML.jpg)


    **图 1-2** 在 CRAN 安装 R


    点击适用于你操作系统的链接。每个操作系统都有不同的 R 安装说明。


    ### 在 Mac 上安装 R


    如果你在 Mac 上安装 R，你会看到许多关于不同 R 版本的详细信息。大多数人只需直接前往页面中间“最新发布”标题下的区域，如图 1-3 所示，然后点击以
    `.pkg` 文件扩展名结尾的文件。该文件的确切名称会因安装程序的最新版本而有所不同。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig3_HTML.jpg](img/478254_1_En_1_Fig3_HTML.jpg)


    **图 1-3** Mac R 安装程序


    点击 `pkg` 链接安装最新版本的 R。请注意，如果你有特殊需求需要安装旧版 R，可以向下滚动查看安装先前版本的选项。`pkg` 文件将出现在你的“下载”文件夹中。进入“下载”文件夹，点击
    `pkg` 文件安装 R。将出现如图 1-4 所示的界面。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig4_HTML.jpg](img/478254_1_En_1_Fig4_HTML.jpg)


    **图 1-4** 在 Mac 上安装 R


    你会看到一系列类似图 1-4 的界面。每个界面都点击“继续”。在此过程中，会弹出一个模态对话框要求你同意软件许可协议。点击“同意”继续。接下来，你会看到选择特定磁盘进行安装的选项，如图
    1-5 所示。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig5_HTML.jpg](img/478254_1_En_1_Fig5_HTML.jpg)


    **图 1-5** 选择 R 安装位置


    大多数人只需选择“为所有用户安装”选项。选择第一个选项，然后点击“继续”按钮。在下一个界面，点击“安装”按钮。系统会提示你输入 Mac 密码，因为 R 安装程序会修改你的
    Mac 系统。输入密码继续。R 将开始安装，当所有操作完成后，你应该会看到如图 1-6 所示的界面。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig6_HTML.jpg](img/478254_1_En_1_Fig6_HTML.jpg)


    **图 1-6** R 安装成功


    点击“关闭”按钮，R 即安装到你的 Mac 上。你会在“应用程序”文件夹中找到 R。双击“应用程序”文件夹中的 `R.app` 程序，以验证 R 已安装并可正常运行。将出现原生的
    R 控制台界面。如果你已经了解一些 R 知识，可以在这里进行尝试，或者直接退出程序。待 RStudio 安装完成后，我们将重新使用 R。


    ### 在 Windows 上安装 R


    点击“R for Windows”链接后，你会看到一个说明页面。点击“首次安装 R”，如图 1-7 所示。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig7_HTML.jpg](img/478254_1_En_1_Fig7_HTML.jpg)


    **图 1-7** 在 Windows 上安装 R


    在下一页，会有一个下载 R 安装程序的链接。点击该链接以获取 Windows 安装程序。它将被命名为“Download R for Windows”。点击它以下载
    R 安装程序。稍后，你会在“下载”文件夹中找到 R 安装可执行文件。


    双击该安装程序文件，然后按照提示点击下一步。选择默认设置，让安装程序完成即可。

