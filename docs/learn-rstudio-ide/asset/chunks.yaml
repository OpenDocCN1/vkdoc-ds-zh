- fmt: '### Installing R on Linux


    Each version of Linux has different set up instructions to follow to install R.
    Generally, you will use a package manager to install R from a command line. You
    can do something like this:


    ```

    sudo apt-get update

    sudo apt-get install r-base r-base-dev

    ```


    However, each version of Linux might be a little bit different here, and you should
    double check the CRAN website to see any more detail on what you may need to do
    for your version of Linux. Click “Download R for Linux” link on [`https://cran.r-project.org`](https://cran.r-project.org)
    and then choose your version of Linux to get extra guidance.


    ### Install Git


    Git is a popular version control system that is used to manage different versions
    of your code files. RStudio will integrate git into your workflow and help you
    visualize your work.


    #### Install Git on Mac


    To install git on Mac, go to this URL: [`https://git-scm.com/download/mac`](https://git-scm.com/download/mac)
    and if your download does not start immediately, click the text “click here to
    download manually” to download the git installer. Double click the file that appears
    in your Downloads folder. In the folder that appears, click the `pkg` file to
    begin the installation process. You may get a security notification that looks
    like the dialog box pictured in Figure [1-8](#478254_1_En_1_Chapter.xhtml#Fig8).


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig8_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Security warning on Mac


    You can override this security feature by going to your Mac’s Security and Privacy
    setting’s general tab and then selecting “Open Anyway” next to the file that you
    downloaded. See Figure [1-9](#478254_1_En_1_Chapter.xhtml#Fig9) for an example.


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig9_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    Override Security settings to install git on Mac


    Now simply click through the installation screens until you get the notification
    that the installation is complete. You can use your Mac’s Terminal app to verify
    that git is installed by typing `git --version` into the Terminal window.


    #### Install Git on Windows


    To install git on Windows, go to this URL: [`https://git-scm.com/download/win`](https://git-scm.com/download/win)
    and if your download does not start immediately, click the text “click here to
    download manually” to download the git installer.


    Double click the file that appears in your Downloads directory. Click Next for
    each screen that appears and simply choose the default settings. Once the installer
    has completed click Finish.


    Verify that git was installed by going to the Windows Command Prompt and typing
    in `git –version`. You should see a response that shows you the latest version
    of git.


    #### Install Git on Linux


    If you use Linux and you don’t already have git installed, you can use your package
    manager to install git from the command line:


    ```

    sudo apt install git-all

    ```


    Here we used `apt` but note that you will have to use the package manager for
    your distribution.


    ### Install RStudio


    Now that we have git and R installed, we are ready to install RStudio itself.


    Go to the RStudio downloads page: [www.rstudio.com/products/rstudio/download/](http://www.rstudio.com/products/rstudio/download/).
    You will be presented with a screen that shows all the available RStudio options.
    There are open source and commercial licenses available for both the desktop and
    the server versions of RStudio. We are interested in the open source (free) desktop
    version of RStudio. The other versions are geared toward businesses that need
    a commercial license and a high level of technical support. As shown in Figure
    [1-10](#478254_1_En_1_Chapter.xhtml#Fig10).


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig10_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    RStudio download page


    Click the green pill that says Download and the screen will scroll down to a list
    of installers for Windows and Mac. Click the installer for your operating system
    and wait for the download to complete. Head over to your Downloads folder to find
    the installer; it will be named something like `RStudio-1.1.463` with a `dmg`
    file extension for Mac and an `exe` file extension for Windows.


    Double click the installer and follow the prompts. On Mac, a screen will pop up
    with an RStudio icon and a shortcut to your Applications directory. Simply drag
    the RStudio icon to the Applications folder shortcut.


    On Windows, you can simply follow the prompts and choose the default locations.
    When the installation is complete, simply click the Finish button.


    #### Verify RStudio


    Before we move on, let’s make sure that RStudio is installed and working. Search
    for the RStudio app icon on your system and double click to open up the app. If
    you are having trouble finding the icon, go to the search icon in the upper right-hand
    area on your Mac screen or the lower left area on your Windows screen. Type in
    “RStudio” and you should see a shortcut to the RStudio app appear. Double click
    this icon.


    If you are using Mac, a security popup will appear as shown in Figure [1-11](#478254_1_En_1_Chapter.xhtml#Fig11).


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig11_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    RStudio security popup


    Click Open to head to RStudio. You should now see the RStudio app appear on your
    desktop. It will look something like this.


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig12_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    RStudio IDE Initial Screen


    Congratulations, you now have RStudio IDE installed and ready to go!


    # 2. Hello World


    Now that we all have RStudio setup, let’s start using this program to help us
    become better R coders. The first thing we want to do is open up RStudio and start
    to work directly with R in the Console. This is our Hello World moment.


    ## Interactive R Console


    The first time you open RStudio you should see a window that takes up the entire
    left side of your screen. This is your Console screen and yours should look similar
    to what is featured in Figure [2-1](#478254_1_En_2_Chapter.xhtml#Fig1).


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig1_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Console screen


    You should see information about the version of R that you are using. At the very
    bottom is a curser `>`. The space to the right of the curser is where you can
    type R commands directly into the Console.


    Try typing in `1 + 1` and then hitting Enter. You should see `[1] 2` appear on
    the line below. 2 is the answer to the question `1 + 1` and the 1 in parenthesis
    `[1]` is the position in the vector that corresponds to the answer 2.


    ### Vectors


    A central concept in R is the vector data structure. Vectors are lists of objects
    of the same data type. Many operations in R will return answers as a vector even
    if the question you ask, like `1 + 1`, which returns only one value. `[1] 2` is
    a vector of one numeric data type which has a value of 2 in the first position.'
  raw: '### Installing R on Linux


    Each version of Linux has different set up instructions to follow to install R.
    Generally, you will use a package manager to install R from a command line. You
    can do something like this:


    ```

    sudo apt-get update

    sudo apt-get install r-base r-base-dev

    ```


    However, each version of Linux might be a little bit different here, and you should
    double check the CRAN website to see any more detail on what you may need to do
    for your version of Linux. Click “Download R for Linux” link on [`https://cran.r-project.org`](https://cran.r-project.org)
    and then choose your version of Linux to get extra guidance.


    ### Install Git


    Git is a popular version control system that is used to manage different versions
    of your code files. RStudio will integrate git into your workflow and help you
    visualize your work.


    #### Install Git on Mac


    To install git on Mac, go to this URL: [`https://git-scm.com/download/mac`](https://git-scm.com/download/mac)
    and if your download does not start immediately, click the text “click here to
    download manually” to download the git installer. Double click the file that appears
    in your Downloads folder. In the folder that appears, click the pkg file to begin
    the installation process. You may get a security notification that looks like
    the dialog box pictured in Figure [1-8](#478254_1_En_1_Chapter.xhtml#Fig8).


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig8_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Security warning on Mac


    You can override this security feature by going to your Mac’s Security and Privacy
    setting’s general tab and then selecting “Open Anyway” next to the file that you
    downloaded. See Figure [1-9](#478254_1_En_1_Chapter.xhtml#Fig9) for an example.


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig9_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    Override Security settings to install git on Mac


    Now simply click through the installation screens until you get the notification
    that the installation is complete. You can use your Mac’s Terminal app to verify
    that git is installed by typing git --version into the Terminal window.


    #### Install Git on Windows


    To install git on Windows, go to this URL: [`https://git-scm.com/download/win`](https://git-scm.com/download/win)
    and if your download does not start immediately, click the text “click here to
    download manually” to download the git installer.


    Double click the file that appears in your Downloads directory. Click Next for
    each screen that appears and simply choose the default settings. Once the installer
    has completed click Finish.


    Verify that git was installed by going to the Windows Command Prompt and typing
    in “git –version”. You should see a response that shows you the latest version
    of git.


    #### Install Git on Linux


    If you use Linux and you don’t already have git installed, you can use your package
    manager to install git from the command line:


    ```

    sudo apt install git-all

    ```


    Here we used apt but note that you will have to use the package manager for your
    distribution.


    ### Install RStudio


    Now that we have git and R installed, we are ready to install RStudio itself.


    Go to the RStudio downloads page: [www.rstudio.com/products/rstudio/download/](http://www.rstudio.com/products/rstudio/download/)
    . You will be presented with a screen that shows all the available RStudio options.
    There are open source and commercial licenses available for both the desktop and
    the server versions of RStudio. We are interested in the open source (free) desktop
    version of RStudio. The other versions are geared toward businesses that need
    a commercial license and a high level of technical support. As shown in Figure
    [1-10](#478254_1_En_1_Chapter.xhtml#Fig10).


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig10_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    RStudio download page


    Click the green pill that says Download and the screen will scroll down to a list
    of installers for Windows and Mac. Click the installer for your operating system
    and wait for the download to complete. Head over to your Downloads folder to find
    the installer; it will be named something like RStudio-1.1.463 with a dmg file
    extension for Mac and an exe file extension for Windows.


    Double click the installer and follow the prompts. On Mac, a screen will pop up
    with an RStudio icon and a shortcut to your Applications directory. Simply drag
    the RStudio icon to the Applications folder shortcut.


    On Windows, you can simply follow the prompts and choose the default locations.
    When the installation is complete, simply click the Finish button.


    #### Verify RStudio


    Before we move on, let’s make sure that RStudio is installed and working. Search
    for the RStudio app icon on your system and double click to open up the app. If
    you are having trouble finding the icon, go to the search icon in the upper right-hand
    area on your Mac screen or the lower left area on your Windows screen. Type in
    “RStudio” and you should see a shortcut to the RStudio app appear. Double click
    this icon.


    If you are using Mac, a security popup will appear as shown in Figure [1-11](#478254_1_En_1_Chapter.xhtml#Fig11).


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig11_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    RStudio security popup


    Click Open to head to RStudio. You should now see the RStudio app appear on your
    desktop. It will look something like this.


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig12_HTML.jpg](images/478254_1_En_1_Chapter/478254_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    RStudio IDE Initial Screen


    Congratulations, you now have RStudio IDE installed and ready to go!


