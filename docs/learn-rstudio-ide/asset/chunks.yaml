- fmt: '### Matrix


    A matrix is a vector that has two dimensions (essentially rows and columns). Like
    a vector, each object in a matrix must be the same type. You can create a matrix
    by setting the `dim` (for dimension) property of a vector like this:


    ```

    m <- c(1,2,3,4,5,6,7,8,9)

    dim(m) <- c(3,3)

    m

    ```


    When you inspect `m` you will see the matrix:


    ```

    [,1] [,2] [,3]

    [1,]    1    4    7

    [2,]    2    5    8

    [3,]    3    6    9

    ```


    To reference individual cells in the matrix, you supply the row and column index.
    For instance, to see what is in row 2 and column 1 you would do this to `m[2,1]`
    to get the value 2.


    ### List


    The vectors we discussed before are called atomic vectors because they must contain
    all the same elements. Vectors that contain mixed objects are simply called lists.
    Lists are handy when you want to manage collections of related objects.


    To create a new list you can just the `list` function like this:


    ```

    l <- list()

    l$name <- "Cards"

    l$cards <- c("10","Jack","Queen","King","Ace")

    l$bets <- c(1,5,10)

    ```


    The first line creates an empty list and then uses the `$` to create names to
    assign objects to. The first is a character object that describes the list, the
    second is a vector of characters, and the last is a vector of numeric objects.
    To access these values later on you must use the list name followed by the dollar
    sign `$` and the name of the object. For instance, to see the list of cards you
    would type `l$cards` and to get the second card in the list you would type `l$cards[2]`.


    ### Factor


    Factors are type of vector that can only include specified values. For instance,
    you may have a list of values to indicate sex and each value must be either “male,”
    “female,” or “unknown.” This structure is handy in those situations when we are
    doing analysis on categories of objects.


    You create a factor using the `factor` function and supplying the list of values.


    ```

    sex <- factor(c("male","female","unknown","male"))

    sex

    ```


    This code outputs this information:


    ```

    [1] male    female  unknown male

    Levels: female male unknown

    ```


    We have a list of values like we would in a vector, but we also have additional
    levels information.


    ### Data Frame


    A data frame is a special kind of list that must have components of equal length.
    In effect, this provides a sort of spreadsheet like two-dimensional data structure
    comprised of rows and columns. You can treat data frame components like a list
    with the `$` operator or like a matrix using row and column indexes.


    You can create a data frame using the `data.frame` function:


    ```

    df <- data.frame(numbers = c(1,2,3),

    letters = c("A","B","C"))

    df$more <- c("1st","2nd","3rd")

    ```


    You can supply vectors all of equal length to the data frame when you create it
    with the `data.frame` function. Once you have a data frame you can create additional
    columns using the `$` operator as you can see above.


    Oftentimes, you will have a data frame created for you as output from a function.
    Data frames are an essential R object and the “tibble” version type of data frames
    are covered in great detail in the “essential R packages” chapter.


    ## Flow Control


    Up to this point, we have essentially created objects, set properties, and inspected
    the results. R programming also includes methods to branch code and to repeat
    code using loops.


    ### If-Then Statements


    An if-then statement instructs our program to take different actions depending
    on the state of certain objects. Here is an example of an if-then statement:


    ```

    state <- "startup"

    if(state == "startup") {

    print("We are about to start the program")

    state = "running program"

    } else {

    print("Program running")

    }

    ```


    We have an object named `state` with the value of “startup”. The next line of
    code evaluates the `state` object and if the object is equal to “startup” then
    the code right after the `if` statement in the curly brackets will execute. A
    status message will print and the value of the `state` object will change.


    If the `state` object is anything other than “startup” the code after the `else`
    keyword will execute. Here the program would simply print out the message “Program
    running”.


    In the example above, we used the `==` operator to test whether the two values
    are equal. You can also test for inequality (`!=`), greater than (`>`), less than
    (`<`), greater than or equal to (`>=`) and less than or equal to (`<=`).


    You can also use if-else on a single line of code and this works well if you have
    concise code. For instance, if we just wanted to test the `state` object to see
    if it was in startup mode we could simply do this:


    ```

    ifelse(state == "startup", TRUE, FALSE)

    ```


    If `state` is “startup” then we will get the Boolean value `TRUE`. Otherwise we
    get the Boolean value `FALSE`. Booleans are a special type of object that can
    only be true or false and are used to test conditions like this.


    ### Loops


    Loops give us a way to repeat the same code over again. There are two types of
    loops that we can use in R: the `for` loop and the `while` loop. We also use the
    apply family of functions that provide loop-like behavior. Let’s see how loops
    work.


    #### For Loop


    For loops will execute a specified number of times. For instance, if you want
    to loop through code five times you can do this:


    ```

    for (i in 1:5){

    print(i)

    }

    ```


    This will print out the numbers 1 through 5\. This code is made up of the `for`
    keyword and in parenthesis we have an object `i` that keeps track of where we
    are in the loop. `1:5` is R shorthand for every number 1 through 5\. This loop
    will run 5 times and the code between the curly brackets will run each time producing
    this output:


    ```

    [1] 1

    [1] 2

    [1] 3

    [1] 4

    [1] 5

    ```


    #### While Loop


    While loops also execute code repeatedly. But, instead of executing a fixed number
    of times these loops run until a condition is met. This is how we would count
    from 1 to 5 with a while loop:


    ```

    i <- 0

    while (i <= 5) {

    print(i)

    i <- i + 1

    }

    ```


    The while loop checks the state of the `i` object and it prints out the value
    to the Console until the condition `i <= 5` is false. Each time the loop iterates
    the value of `i` increases by 1.


    #### Apply Functions


    The apply family of functions will also provide the looping pattern but in a more
    compact form. You will find this type of function used in various R packages and
    also in base R. The general pattern is that you use the apply function by passing
    an object such as a vector, data frame, or list and the apply function will iterate
    through each element in that object. You provide the apply function with code
    to execute against each element and the function returns a new object.


    To replicate what we have been doing so far with loops, we could do this:


    ```

    sapply(1:5, function(x){print(x)})

    ```


    This is much cleaner, and we only really have the vector `1:5` and the code to
    execute. Note that the code is an “anonymous function” and functions will be discussed
    in more detail next. Basically, we have a function defined that has one parameter
    `x` which is a placeholder for the current value in the vector, and in between
    the curly brackets we have the code that will execute for each element in the
    vector.


    We used the `sapply` function here and this version of the apply function returns
    a simplified object (in this case a vector). In the case above, we just get the
    same vector back. However, we could have done something more like this:


    ```

    sapply(1:5, function(x){

    x * 2

    })

    ```


    We broke out the anonymous function here to make the code a little bit more clear.
    This code will produce a new vector that will print this to the Console:


    ```

    [1]  2  4  6  8 10

    ```


    This apply function is a general wrapper function that returns the simplest object.
    We also have `lapply` which is used for lists and data frames that work the same
    way but return list objects.'
