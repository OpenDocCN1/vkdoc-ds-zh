    文件。


    打开 zip 文件，找到名为 `Food_Display_Table.xlsx` 的文件。这就是我们将要查看的 Excel 格式数据集。现在，在 RStudio
    中，点击“Import Dataset”按钮，并选择“From Excel...”。然后点击“Browse”按钮。此界面的示例见图 2-9。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig9_HTML.jpg](img/478254_1_En_2_Fig9_HTML.jpg)


    图 2-9


    导入 Excel 数据


    接下来，导航到存放名为 `Food_Display_Table.xlsx` 的 Excel 文件的位置。屏幕将显示数据的前几行，以及一些可复制的代码，这些代码可用于后续在不使用界面的情况下重新导入此数据集，如图
    2-10 所示。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig10_HTML.jpg](img/478254_1_En_2_Fig10_HTML.jpg)


