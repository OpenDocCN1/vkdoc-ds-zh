    Shiny App running locally


    This histogram is very interactive, when you adjust the slider control on the
    left R code is executed to recreate the histogram on the right. This is a step
    beyond simply including popovers that are pre-baked into a static report.


    Along the top of Figure [9-3](#478254_1_En_9_Chapter.xhtml#Fig3), you will see
    an http address and an “Open in Browser” button. This app is running in a web
    server, so you can view the app using your regular browser by either clicking
    the “Open in Browser” button or typing in the http address into your browser’s
    address bar.


    You may also notice that there is a “Publish” button at the right. Shiny apps
    are published to a web site so that they can be made available for anyone to use.
    These apps can be public either with the service that RStudio provides or you
    can manage a private server from your business. To get a free account to publish
