    ### 在 Linux 上安装 R


    每种 Linux 版本都有不同的安装说明来安装 R。通常，你会使用包管理器通过命令行来安装 R。可以执行如下操作：


    ```

    sudo apt-get update

    sudo apt-get install r-base r-base-dev

    ```


    不过，这里每种 Linux 版本可能会略有不同，你应该再次查看 CRAN 网站，了解针对你的 Linux 版本可能需要执行哪些操作。点击 [`https://cran.r-project.org`](https://cran.r-project.org)
    页面上的“Download R for Linux”链接，然后选择你的 Linux 版本，以获取更多指导。


    ### 安装 Git


    Git 是一种流行的版本控制系统，用于管理代码文件的不同版本。RStudio 会将 Git 集成到你的工作流程中，并帮助你可视化你的工作。


    #### 在 Mac 上安装 Git


    要在 Mac 上安装 Git，请访问此 URL：[`https://git-scm.com/download/mac`](https://git-scm.com/download/mac)；如果你的下载没有立即开始，请点击“click
    here to download manually”文本，下载 Git 安装程序。双击出现在“下载”文件夹中的文件。在出现的文件夹中，点击 `pkg` 文件，开始安装过程。你可能会看到类似图
    1-8 所示的安全通知对话框。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig8_HTML.jpg](img/478254_1_En_1_Fig8_HTML.jpg)


    图 1-8


    Mac 上的安全警告


    你可以通过进入 Mac 的“安全性与隐私”设置的“通用”标签页，然后在你下载的文件旁边选择“仍要打开”来覆盖此安全功能。示例如图 1-9 所示。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig9_HTML.jpg](img/478254_1_En_1_Fig9_HTML.jpg)


    图 1-9


    在 Mac 上覆盖安全设置以安装 Git


    现在只需点击安装界面，直到收到安装完成的通知。你可以使用 Mac 的“终端”应用程序，在终端窗口中输入 `git --version` 来验证 Git 是否安装成功。


    #### 在 Windows 上安装 Git


    要在 Windows 上安装 Git，请访问此 URL：[`https://git-scm.com/download/win`](https://git-scm.com/download/win)；如果你的下载没有立即开始，请点击“click
    here to download manually”文本，下载 Git 安装程序。


    双击出现在“下载”目录中的文件。对于随后出现的每个界面点击“下一步”，并选择默认设置。安装程序完成后，点击“完成”。


    通过进入 Windows 命令提示符并输入 `git --version`，验证 Git 是否安装成功。你应会看到一条响应信息，显示 Git 的最新版本。


    #### 在 Linux 上安装 Git


    如果你使用 Linux 且尚未安装 Git，可以使用包管理器通过命令行安装 Git：


    ```

    sudo apt install git-all

    ```


    这里我们使用了 `apt`，但请注意，你需要根据你的发行版使用相应的包管理器。


    ### 安装 RStudio


    现在我们已经安装了 Git 和 R，可以开始安装 RStudio 本身了。


    访问 RStudio 下载页面：[www.rstudio.com/products/rstudio/download/](http://www.rstudio.com/products/rstudio/download/)。你将看到一个显示所有可用
    RStudio 选项的界面。RStudio 的桌面版和服务器版均提供开源许可证和商业许可证。我们感兴趣的是开源（免费）桌面版 RStudio。其他版本面向需要商业许可证和高级技术支持的企业。如图
    1-10 所示。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig10_HTML.jpg](img/478254_1_En_1_Fig10_HTML.jpg)


    图 1-10


    RStudio 下载页面


    点击绿色的“Download”按钮，页面将向下滚动，显示 Windows 和 Mac 的安装程序列表。点击适用于你操作系统的安装程序，等待下载完成。转到“下载”文件夹，找到安装程序；它的名称会类似
    `RStudio-1.1.463`，Mac 版本的文件扩展名为 `dmg`，Windows 版本的文件扩展名为 `exe`。


    双击安装程序并按照提示操作。在 Mac 上，会弹出一个界面，其中包含 RStudio 图标和“应用程序”目录的快捷方式。只需将 RStudio 图标拖到“应用程序”文件夹快捷方式上即可。


    在 Windows 上，你可以按照提示选择默认位置。安装完成后，点击“完成”按钮。


    #### 验证 RStudio


    在继续之前，让我们确保 RStudio 已安装并可正常工作。在你的系统上搜索 RStudio 应用图标，然后双击打开应用。如果找不到该图标，请转到 Mac
    屏幕右上角或 Windows 屏幕左下角的搜索图标。输入“RStudio”，应该可以看到 RStudio 应用的快捷方式出现。双击此图标。


    如果你使用的是 Mac，会出现一个安全弹出窗口，如图 1-11 所示。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig11_HTML.jpg](img/478254_1_En_1_Fig11_HTML.jpg)


    图 1-11


    RStudio 安全弹出窗口


    点击“打开”进入 RStudio。现在你应该会看到 RStudio 应用出现在桌面上。它看起来类似这样。


    ![../images/478254_1_En_1_Chapter/478254_1_En_1_Fig12_HTML.jpg](img/478254_1_En_1_Fig12_HTML.jpg)


    图 1-12


    RStudio IDE 初始界面


    恭喜，你现在已经安装好 RStudio IDE，可以开始使用了！


    # 2. Hello World


    既然大家已经配置好了 RStudio，让我们开始使用这个程序来帮助我们成为更好的 R 语言程序员。我们首先要做的是打开 RStudio，直接在控制台中与 R
    进行交互。这就是我们的 Hello World 时刻。


    ## 交互式 R 控制台


    第一次打开 RStudio 时，你应该会看到一个占据整个屏幕左侧的窗口。这就是你的控制台屏幕，应该类似于图 2-1 所示。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig1_HTML.jpg](img/478254_1_En_2_Fig1_HTML.jpg)


    图 2-1


    控制台界面


    你应该会看到关于你正在使用的 R 版本的信息。最底部有一个光标 `>`。光标右侧的区域就是你可以直接在控制台中输入 R 命令的地方。


    尝试输入 `1 + 1`，然后按回车键。你应该会看到下一行出现 `[1] 2`。2 是 `1 + 1` 的答案，而括号中的 1 `[1]` 是向量中对应答案
    2 的位置。


    ### 向量


    R 中的一个核心概念是向量数据结构。向量是相同数据类型对象的列表。R 中的许多操作即使对于像 `1 + 1` 这样只返回一个值的问题，也会以向量的形式返回答案。`[1]
    2` 是一个包含一个数值型数据类型的向量，该数据类型在第一个位置上的值为 2。

