    that you have made a change to an object, but you are having trouble locating
    precisely where in the potentially long list of commands the changes were made.


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig13_HTML.jpg](images/478254_1_En_2_Chapter/478254_1_En_2_Fig13_HTML.jpg)


    Figure 2-13


    History tab


    ### Connections


    Finally, the Connections tab gives you a way to connect to data sources such as
    local databases or a Spark cluster. These types of data storage solutions are
    used when datasets are too big to simply be stored locally on your computer. If
    you click into the Connections tab you will see an empty list, but there are options
    to connect to ODBC (databases) or Spark.


    If you have connection information for a database that you need for your project,
    you can use this interface to connect. RStudio will guide you through the connection
    process and install any packages that you need to work with the data source. This
    window will also show any data source connections that you have created yourself
    with R code.


    ## Conclusion


    In this chapter, we introduced R vector, which is an essential R data structure.
    In addition, we have already been exposed to a good deal of the basic functionality
    of the RStudio IDE. Finally, we have a brief introduction to datasets in R. As
    we move on through our tour of the RStudio IDE, we will encounter these objects
    again and go into more detail, so you can start to see how this will help you
    with your data analysis.


    # 3. RStudio Views


    Let’s continue our tour of RStudio IDE. RStudio has a four-pane window layout
    and we have looked closely at two of the panes already in the last chapter. We
    have seen the Console screen, where you can write interactive R code, and we saw
    the Environment and History screens, where you can see the state of your R environment.
    Our data frame also opened up in a third pane, but we can do more with this part
    of the RStudio interface. Let’s take a look at the remaining screens that we will
    be using now.


    ## Files, Plots, Packages, Help, and Viewer Pane


    By default, the pane on your lower right-hand side will contain tabs labeled Files,
    Plots, Packages, Help, and Viewer. The Files tab will show you the files in the
    current working folder. The working folder is the folder that R will save your
    work to. This pane essentially is your Windows Explorer or Mac Finder app integrated
    into RStudio.


    ### Files


    The Files tab includes convenient functions that you can use to open and generally
    work with files without needing to leave RStudio. This includes tasks like deleting
    and renaming files. You can also set the R working folder as you can see in Figure
    [3-1](#478254_1_En_3_Chapter.xhtml#Fig1).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig1_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Files tab


    ### Plots


    You use the Plots tab to view the plots that you create during your R analysis.
    If you click over to this tab, you will see an empty screen with a few function
    buttons, which is pictured in Figure [3-2](#478254_1_En_3_Chapter.xhtml#Fig2).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig2_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Plot view functions


    You can view plots, export plots to files, and also navigate sets of plots that
    you created. This widget helps you stay organized as you go through and investigate
    your data. To demonstrate this feature more, we will need to hop over to the Console
    screen, do some data munging, and create a plot.


    #### Introduction to Data Munging


    We can use the data that we imported in the previous chapter. If you have been
    following along, that data is named `Food_Display_Table`. Before we use this data
    to make a plot, we are going to have to do some “data munging”. Data munging is
    the process of restructuring the data to make it work for your analysis.'
