    \ expectancy by year, base R `plot` function, R `unique` function, `summary` function\
    \  \nData visualization: D3, `ggplot2` (see `ggplot2`), `htmlwidgets`, `r2d3`\
    \  \nDebugger  \n`dplyr` package  \n\n#### F\n\nFile viewer  \nFlow control: `for`\
