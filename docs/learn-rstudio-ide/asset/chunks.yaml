    up.


    ## Understanding Shiny


    Shiny can be used to create dashboards that use R scripts and are accessible on
    the web fairly easily. However, like most R packages you can go much deeper into
    the system to build truly custom experiences. We will discuss the basics here
    to give you a good starting point with Shiny, but to really master this package
