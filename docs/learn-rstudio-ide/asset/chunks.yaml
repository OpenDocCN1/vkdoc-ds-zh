    ### 历史记录


    切换到下一个标签页，可以查看你在此次 R 会话中输入的所有命令的日志。当你已经找到结果，但记不清是如何达到某个特定点时，这会有很大帮助。你只需查看日志，就能看到你执行的步骤列表。


    图 2-13 所示的历史记录标签页还提供了一些便捷功能，你可以用它们将历史记录中的某行代码重新放入 R 控制台。你也可以使用带有搜索图标的文本区域搜索特定的代码行。当你知道已经对某个对象进行了更改，但又难以在可能很长的命令列表中准确定位到更改位置时，这个功能会非常方便。


    ![../images/478254_1_En_2_Chapter/478254_1_En_2_Fig13_HTML.jpg](img/478254_1_En_2_Fig13_HTML.jpg)


    图 2-13


    历史记录标签页


    ### 连接


    最后，“连接”标签页提供了一种连接到数据源（如本地数据库或 Spark 集群）的方式。当数据集太大，无法简单地存储在本地计算机上时，就会使用这类数据存储解决方案。如果你点击进入“连接”标签页，你会看到一个空列表，但那里有连接到
    ODBC（数据库）或 Spark 的选项。


    如果你有项目所需数据库的连接信息，可以使用此界面进行连接。RStudio 会引导你完成连接过程，并安装处理该数据源所需的任何包。此窗口还会显示你使用 R 代码自己创建的任何数据源连接。


    ## 总结


    在本章中，我们介绍了 R 向量，这是一种重要的 R 数据结构。此外，我们已经接触了 RStudio IDE 的许多基本功能。最后，我们简要介绍了 R 中的数据集。在我们继续探索
    RStudio IDE 的旅程中，我们会再次遇到这些对象，并进行更详细的讨论，这样你就能开始了解这将如何帮助你进行数据分析。


    # 3. RStudio 视图


    让我们继续探索 RStudio IDE。RStudio 有一个四窗格窗口布局，上一章我们已经仔细研究了其中的两个窗格。我们看到了控制台屏幕，您可以在其中编写交互式
    R 代码；我们还看到了环境和历史记录屏幕，您可以在其中查看 R 环境的状态。我们的数据框也在第三个窗格中打开了，但我们还可以对 RStudio 界面的这部分做更多操作。现在让我们来看看我们将要使用的剩余屏幕。


    ## 文件、绘图、包、帮助和查看器窗格


    默认情况下，右下角的窗格将包含标记为“文件”、“绘图”、“包”、“帮助”和“查看器”的标签页。“文件”标签页将显示当前工作文件夹中的文件。工作文件夹是 R
    将保存您工作的文件夹。此窗格本质上是集成到 RStudio 中的 Windows 资源管理器或 Mac 访达应用程序。


    ### 文件


    “文件”标签页包含一些便捷功能，您可以使用这些功能打开和处理文件，而无需离开 RStudio。这包括删除和重命名文件等任务。您还可以设置 R 的工作文件夹，如图
    3-1 所示。


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig1_HTML.jpg](img/478254_1_En_3_Fig1_HTML.jpg)


    图 3-1


    文件标签页


    ### 绘图


    您可以使用“绘图”标签页来查看在 R 分析过程中创建的图形。如果切换到该标签页，您将看到一个空屏幕，上面有几个功能按钮，如图 3-2 所示。


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig2_HTML.jpg](img/478254_1_En_3_Fig2_HTML.jpg)


    图 3-2


    图形视图功能


    您可以查看图形、将图形导出到文件，也可以在您创建的多组图形之间导航。这个小工具可以帮助您在研究和探索数据时保持井井有条。为了更详细地演示此功能，我们需要切换到控制台屏幕，进行一些数据整理，并创建一个图形。


    #### 数据整理简介


    我们可以使用上一章导入的数据。如果您一直按步骤操作，该数据被命名为 `Food_Display_Table`。在使用这些数据创建图形之前，我们需要进行一些“数据整理”。数据整理是重组数据以使其适用于分析的过程。

    '
- fmt: '### Note


    We are using the terms “dataset” and “data frame” interchangeably above; however,
    the technical name for the object that we are working with in R is “data frame”.
    The term “dataset” is a generic term that applies to any set of data in any analysis
    environment.


    For this plot, we want to look at two columns in the `Food_Display_Table` data
    frame: `Calories` and `Portion_Amount`. It seems like these two items may have
    a relationship, so it makes sense to see if using a plot will help us see any
    patterns that might act as a clue to help us understand what this data is telling
    us.


    The first thing I want to do is check data type of the columns that I am interested
    in. You can use the R `class` function to do this:


    ```r

    class(Food_Display_Table$Calories)

    ```


    You have the name of the function, `class`, and in the parenthesis, you include
    the object that you want to inspect. We already saw the data frame name (`Food_Display_Table`)
    but now we also have a dollar sign `$` and the name of the variable `Calories`.
    The dollar sign in R is used in data frames to reference a column. Each column
    in the data frame `Food_Display_Table` can be referenced in this way. Above we
    used the `class` function to inspect the datatype of the `Calories` column. It
    returned “character”.


    For our plot, we need the data to be numeric. Luckily, it’s super easy to change;
    make a column of data numeric by using the `as.numeric` function and then assigning
    the results back to the data frame:


    ```r

    Food_Display_Table$Calories <- as.numeric(Food_Display_Table$Calories)

    ```


    This code replaces the character version of the `Calories` data with a numeric
    version of the same data. You can double check the data type by using the same
    `class` function like this:


    ```r

    class(Food_Display_Table$Calories)

    ```


    This time the Console should return “numeric”. Before moving on to the plot, we
    still need to do this for the `Portion_Amount` column. Follow the same process
    above as we used for `Calories`. You should see something like Figure [3-3](#478254_1_En_3_Chapter.xhtml#Fig3)
    in your Console screen once everything is complete.


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig3_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Changing data types


    #### Plot


    Now we are ready to make a plot. Type this code into your Console window:


    ```r

    plot(Food_Display_Table$Calories, Food_Display_Table$Portion_Amount)

    ```


    Now a plot in your Plots tab will appear that looks like Figure [3-4](#478254_1_En_3_Chapter.xhtml#Fig4).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig4_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Plot in R


    Figure [3-4](#478254_1_En_3_Chapter.xhtml#Fig4) shows Calories on the Y axis and
    `Portion_Amount` on the X axis of the plot. This is a pretty basic plot, but it’s
    good enough to hint at a relationship between these data points. At some point,
    you will learn about packages that extend base R and make better visualizations,
    but they all essentially will work the same way in the Plots tab.


    ### Packages


    The next tab labeled “Packages” will show you a list of R packages that you have
    available. See Figure [3-5](#478254_1_En_3_Chapter.xhtml#Fig5) to see what the
    Packages list looks like.


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig5_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Package viewer


    An R package is an extension to the base R system you get when you installed R
    in Chapter [1](#478254_1_En_1_Chapter.xhtml). R packages are written by community
    contributors and they are available for anyone to use. Packages are also managed
    by the CRAN network and you can manage all of this from your Packages tab.


    What you see in the screenshot in Figure [3-5](#478254_1_En_3_Chapter.xhtml#Fig5)
    is a list of all the packages that are installed on your computer. The checkmarks
    indicate that the package is loaded into your R environment and is ready to use.
    If you check a package, code will appear in your Console screen that loads the
    package.


    For example, to use the `broom` package we would simply click the checkbox and
    in the Console screen this would appear:


    ```r

    library("broom", lib.loc="/Library/Frameworks/R.framework/Versions/3.5/Resources/library")

    ```


    The exact location would depend on the version of R and the operating system that
    you are using. Once a package is loaded in this way, all the datasets and functions
    of that package would be available to you in the same way as the base R functions
    that we used earlier.


    ### Note


    The `broom` package is part of the `tidyverse` family of R packages. `broom` is
    used to transform the complex output of analysis functions like linear regression
    into a simple data frame that is easily used as an input to other functions. We
    will talk more about must-have packages like this later on in this book.


    You can also use this interface in the Packages tab to install packages. If you
    know of the name of a package that you want simply click the “Install” button
    to get the dialog box that appears in Figure [3-6](#478254_1_En_3_Chapter.xhtml#Fig6).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig6_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    R Packages Tab


    Then type in the name of the package that you want and click the “Install” button.
    Leave the defaults in place since this gives you all the packages that are available
    on the CRAN network.


    Finally, each package name that appears is a hyperlink that you can use to get
    to the documentation for the package. This documentation gets installed when you
    install the package. Simply click the package name to learn about how to use the
    package. This will automatically take you to the Help widget that appears to the
    right of your Packages tab.


    ### Help


    The Help tab is set up like a web browser and includes elements to help you search
    for topics. You can navigate through the content that appears as if it was a web
    page as pictured in Figure [3-7](#478254_1_En_3_Chapter.xhtml#Fig7).


    ![../images/478254_1_En_3_Chapter/478254_1_En_3_Fig7_HTML.jpg](images/478254_1_En_3_Chapter/478254_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Help tab


    In the screen pictured in Figure [3-7](#478254_1_En_3_Chapter.xhtml#Fig7), you
    can see the documentation for the `tidyverse` package called `ggplot2`. This package
    will help you create richer data visualizations than you could just by using the
    base `plot` function. You would use the Help screen to learn more about packages
    like this or to get help with specific functions by using the search feature.


    ### Viewer


    The final tab in the lower right-hand year is the Viewer tab. This is an area
    where output will appear from some of the more advanced features of RStudio reporting
    such as R markdown documents. R markdown documents are used to present code and
    results together in a reproducible way that is used to share results. We will
    address R markdown later on in this book.


    ## Conclusion


    By this point, you have a pretty solid foundation for the basics of working with
    RStudio IDE. You should understand how to navigate through all the panes and interfaces
    you need to conduct a quick analysis using all the features in the four panels
    that are available in the default state in RStudio.


    Along the way, we also went into how to do some data munging, data exploration,
    and data visualization with base R.


    Next, we will continue to explore how RStudio can help us keep organized and build
    analysis that is clear, insightful, and reproducible.'
