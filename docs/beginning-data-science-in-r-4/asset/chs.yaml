- "# 15. 版本控制\n\n版本控制，在其最简单的形式中，用于跟踪软件的变化。它也是软件开发中一种高效的协作方式，因为它通常允许多个开发人员对软件进行更改，并将这些更改与其他开发人员的更改合并。RStudio\
  \ 支持两种版本控制系统：Subversion 和 git。其中，git 使用最广泛，尽管这些事情当然是主观的，但我认为它也是更好的系统。当然，它是我们将在这里使用的系统。\n\
  \n\n\n## 版本控制与代码仓库\n\n在软件开发过程中使用版本控制系统主要有两个目的。其一是追踪变更，以便日后查看源代码中哪些修改是在何时做出的，一旦发现错误，可以回退到早期版本尝试不同的方法。它为软件开发提供了一个日志，让你能够回到过去，在发现当前进展走向错误方向时重新尝试。\n\
  \n版本控制系统通常执行的另一项任务是简化团队协作。其核心理念是共享包含所有代码及代码变更的全局仓库（即版本控制系统记录的变更日志），每位开发者修改代码时都在自己的副本上工作，完成修改后将代码提交到仓库。早期的版本控制系统要求在修改文件时锁定文件，以防止其他开发者同时编辑相同文件产生冲突。如今的版本控制系统在并发编辑同一文件方面更为宽松，只要修改不在重叠行上（此时需手动解决冲突），通常会自动合并变更。\n\
  \n通过这种版本控制方式，不同开发者可以同时在代码的不同部分工作，无需担心冲突。即便发生冲突，在尝试向全局仓库推送变更时系统也会识别出来，并提示你解决冲突。\n\
  \n版本控制系统 `git` 甚至允许比这更高程度的并发和独立开发——理论上它并不强制要求存在单一的全局仓库。实践中，为项目的正式版本设置全局仓库是个好主意，人们也确实会这样做。该系统只是不强制要求单一的全局仓库，而是围绕多个可相互同步变更的仓库构建。\n\
  \n使用 `git` 时，你的源代码旁会有一个本地仓库。你可以将这个仓库用作前面提到的日志系统，或者为不同特性或版本创建分支（我们后续会讲到）。你可以像平常一样修改源代码，然后提交到本地仓库，而不会与其他人的变更产生冲突。但既然你们在不同的本地仓库上工作，你就看不到他们的变更，他们也看不到你的。要向另一个仓库提交变更，必须将变更推送过去；要从另一个仓库获取变更，则需要从那里拉取。\n\
  \n这时通常就需要全局仓库了。你在开发某个功能时，先在本地仓库进行修改，完成后将变更推送到全局仓库。如果你没有修改全局仓库的权限（例如你克隆了别人的代码并做了修改），可以请求有权限的人将你的变更拉取到仓库中，这被称为\"\
  拉取请求\"。\n\n## 在 RStudio 中使用 Git\n\n以上全是理论，如果我觉得写起来困难，你大概理解起来也不容易。不如我们实际看看 `git`\
  \ 是如何工作的。\n\n`RStudio` 提供了一些基本的与 `git` 交互的工具：你可以创建仓库、提交变更、向其他仓库推送变更。它并不支持 `git`\
  \ 的全部功能——若需完整功能，你需要使用其他工具或 `git` 的命令行版本——但日常的版本控制任务，它已足够胜任。\n\n### 安装 Git\n\n如果你的计算机上尚未安装\
  \ `git`，可以从 [`http://git-scm.com`](http://git-scm.com/) 下载。应该提供 Windows、OS X 和 Linux\
  \ 版本，不过你的平台可能提供更便捷的安装方式。\n\n例如，在 Debian/Ubuntu 系统上，可以使用：\n\n```\nsudo apt-get install\
  \ git-core\n```\n\n而在 Red Hat/Fedora 系统上，可以使用：\n\n```\nsudo yum install git-core\n\
  ```\n\n在其他系统上如何最好地安装 `git`，需要你自行搜索确认。\n\n安装完成后，你需要告诉 `git` 你是谁。它需要此信息来用你的名字标记代码变更。如果只有你一个人开发代码，这一点并不特别重要；但如果有更多人协作开发，就必须识别谁做了哪些修改。在终端中运行以下命令来告诉\
  \ `git` 你的身份：\n\n```\ngit config --global user.name \"你的姓名\"\ngit config --global\
  \ user.email \"你的邮箱地址\"\n```\n\n你可能还需要告诉 `RStudio` 已安装的 `git` 命令所在位置。操作方法是：进入 `Tools`\
  \ 菜单，选择 `Global Options...`。在弹出的窗口中，左侧图标区域找到 `Git/SVN` 面板，在其中设置 `git` 命令的路径。\n\n\
  你安装的 `git` 是一个命令行工具。`RStudio` 提供了一些与 `git` 交互的图形界面，但并非所有操作都能通过图形界面完成。还有一些图形界面工具能比\
  \ `RStudio` 实现更多 `git` 功能，我建议你选用其中一款——我本人常常觉得用它们比用命令行更方便，毕竟我年纪大了，记不住具体命令。\n\n以下是几个不错的选择：\n\
  \n*   Sourcetree（[`www.sourcetreeapp.com`](http://www.sourcetreeapp.com)）：适用于 Windows\
  \ 和 OS X\n\n*   GitHub Desktop（[`https://desktop.github.com`](https://desktop.github.com)）：适用于\
  \ Linux、Windows 和 OS X（用于操作 GitHub 仓库）\n\n*   GitG（[`https://wiki.gnome.org/Apps/Gitg`](https://wiki.gnome.org/Apps/Gitg)）：适用于\
  \ Linux\n\n不过，有些情况下你确实需要使用命令行版本。这里有一个非常棒的交互式网页教程，专门针对命令行 `git` 程序：[`https://try.github.io/levels/1/challenges/1`](https://try.github.io/levels/1/challenges/1)。\n\
  \n\n\n### 对文件进行修改、暂存和提交更改\n\n如果你在创建包时勾选了使用 git 进行项目管理，那么 RStudio 右上角应该会有一个 Git 标签页，位于\
  \ Build 标签页旁边。点击它。\n\n该面板的主要区域会显示一个文件列表。列表包含三列：暂存状态、状态和路径。其中路径列显示的是被修改文件（或目录）的名称，如图\
  \ 15-1 所示。\n\n如果你是第一次进入这个面板，那么自创建对象以来（包括 RStudio 在创建包时生成的文件），你修改过的所有文件的状态列都会显示一个黄色的问号。这个状态表示\
  \ git 尚未识别这些文件。它能看到这些文件存在，但你从未告诉它如何处理它们。现在我们就来解决这个问题。\n\n![](img/439481_2_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1. 显示已修改文件的 Git 面板\n\n暂存列中每个文件都有一个勾选框。勾选一个文件后，其状态会变为绿色的“A”。这表示你已经将该文件暂存，准备添加到\
  \ git 仓库中。对所有文件都执行此操作。当你勾选一个目录时，该目录下的所有文件也会被一并暂存。这也是我们目前想要的效果。\n\n向 git 提交更改的过程是：在实际提交之前，先将更改暂存。我们刚才所做的就是告诉\
  \ git，下次提交更改时，我们希望添加这些文件。通常，提交只会影响我们已暂存的更改。这让你可以只提交对源代码所做的部分更改，在某些情况下会很有帮助。你可能对许多文件做了多处更改，但在某个时刻，你只想提交一个特定的\
  \ bug 修复，而不想提交尚未完成的新功能相关更改。只暂存你想要提交的更改就能实现这一点。\n\n总之，我们现在已经暂存了所有内容。要提交更改，你需要点击工具栏中的“Commit”按钮。这会打开一个新窗口，显示你即将提交的更改，并允许你（在窗口右上方）编写提交信息。这条信息将写入变更日志。在这里对你的更改进行简短且有意义的描述。如果你以后需要在日志中查找这些更改，就会用到它。然后点击“Commit”并关闭窗口。此时\
  \ Git 面板应该不再显示任何文件。这是因为自上次提交以来没有新的更改，而该面板只显示当前软件版本与已提交到 git 的版本之间存在差异的文件。\n\n如果我们想在终端中执行刚才的操作，则需要使用`git\
  \ add`命令暂存文件：\n\n```\ngit add 文件名\n```\n\n并使用`git commit`命令提交暂存的更改：\n\n```\ngit\
  \ commit -m \"提交信息\"\n```\n\n现在尝试修改一个文件。修改完成后，你应该会看到该文件再次出现在 Git 面板中，如图 15-2 所示，不过这次状态列显示的是蓝色的“M”。毫无疑问，这表示已修改（Modified）。\n\
  \n如果你在这里暂存一个文件准备提交，状态仍然是“M”，但 RStudio 会通过将“M”标记稍微左移来指示它已被暂存，如图 15-3 所示。当然，你并非必须依赖这个视觉反馈，因为从已勾选的暂存按钮也能看出文件已被暂存。\n\
  \n提交已修改文件的操作与提交新添加文件完全一样。\n\n在终端中，暂存已修改文件同样使用`git add`命令。暂存新文件和暂存已修改文件并没有不同的命令，两者都使用`git\
  \ add`。\n\n### 为现有项目添加 Git\n\n如果你在创建项目时没有同时创建 git 仓库（而且你刚刚才了解 git，除非你每次创建项目都勾选了“git”按钮，否则你可能有很多项目没有关联\
  \ git 仓库），你仍然可以为现有目录设置 git。只需在命令行中操作即可。\n\n![](img/439481_2_En_15_Fig3_HTML.jpg)\n\
  \n图 15-3. 已修改文件，其中一个文件已暂存待提交\n\n![](img/439481_2_En_15_Fig2_HTML.jpg)\n\n图 15-2.\
  \ Git 面板中显示的已修改文件\n\n进入项目所在的目录并运行以下命令：\n\n```\ngit init\n```\n\n这将创建一个空的仓库。该目录中已有的文件随后就可以像我们之前看到的那样添加进去。\n\
  \n### 裸仓库与克隆仓库\n\n如果你使用像 GitHub 这样的仓库服务器，本节中的大部分内容你永远无需操心。在那里，创建仓库和与其交互都是通过 Web\
  \ 界面完成的，除了“克隆”仓库之外，你无需担心细节。我们将在此处手动创建一个所谓的“裸”仓库，并了解如何通过它来在不同的本地仓库之间传递更改。\n\n我们创建\
  \ R 项目时创建的仓库，或者在目录中使用`git init`创建的仓库，都是用于对项目目录中的源代码进行版本控制的本地仓库。它们并非为开发者之间的协作而设计。尽管在技术上可以将一个此类仓库的更改合并到另一个仓库中，但这过程有些繁琐，不宜日常处理。\n\
  \n为了在不同仓库之间同步更改，我们需要一个裸仓库。裸仓库是一个不包含本地源代码的仓库；它并没有什么特别之处，但它能防止你在本地对其进行直接修改，你只能通过其他仓库的更改来更新它。\n\
  \n要创建裸仓库，我们需要使用 git 的命令行版本。在你想要放置仓库的位置创建一个目录，进入该目录，然后输入：\n\n```\ngit --bare init\n\
  ```\n\n现在，这个仓库包含了 git 运行所需的各种文件——你的本地仓库也包含这些文件；当你同时拥有本地源代码时，它们只是隐藏在一个名为`.git/`的子目录中。\n\
  \n我们不会直接对这个仓库进行任何操作。我们只需要它来演示如何与其他连接到此仓库的仓库进行协作。\n\n前往一个你想放置仓库工作版本（含源代码）的目录，通过输入以下命令来克隆一份裸仓库的副本：\n\
  \n```\ngit clone /path/to/bare/repository\n```\n\n你会收到一条警告，提示你克隆了一个空仓库。我们已知这一点，所以不必担心。我们很快会向其中添加内容。\n\
  \n为了演示仓库之间的通信方式，你需要再创建一个工作副本。你可以去另一个目录重复执行克隆命令，或者通过以下命令克隆仓库并为其指定一个新名称：\n\n```\n\
  git clone /path/to/bare/repository 名称\n\n现在，我们有了裸仓库的两个克隆副本，可以看看如何将更改从一个克隆推送到被克隆的仓库，以及如何将被克隆仓库中的更新拉取到克隆副本中。\n\
  \n正如我之前所写，通过裸仓库传递更改并非将更改从一个仓库移动到另一个仓库的唯一方式，但它是使用 git 最简单的方式，也是你在使用 GitHub 这类服务器时会采用的方式。如果你这样做（我们稍后会介绍具体操作方法），GitHub\
  \ 会为你创建好裸仓库，你只需将其克隆到你计算机上的某个位置即可开始工作。\n\n\n\n### 推送本地更改并获取与拉取远程更改  \n\n进入你刚刚创建的某个克隆仓库。它看起来像是一个空目录，因为我们还没有对它进行任何修改。实际上，它包含一个隐藏目录\
  \ `.git/`，Git 的神奇之处就在这里，但我们无需了解这些。  \n\n尝试创建一些文件，将它们添加到 Git，并提交更改：  \n\n```\ntouch\
  \ foo bar\ngit add foo bar\ngit commit -m \"新增了 foo 和 bar\"\n```\n\n如果现在查看日志  \n\
  \n```\ngit log\n```  \n\n你会看到已经进行了更改。然而，如果你查看另一个裸仓库的克隆，你会发现这些更改尚未可见。  \n\n造成这种情况的原因有两个：(1)\
  \ 我们只对克隆仓库做了更改，但从未将这些更改推送到两个克隆仓库所连接的裸仓库；(2) 即使我们推送了，也还没有将更改拉取到另一个克隆仓库中。  \n\n第一个操作通过\
  \ `git push` 完成。它会将你在本地仓库中所做的更改推送到你克隆来源的仓库：  \n\n```\ngit push\n```\n\n你不需要在每次提交后都将更改推送到全局（裸）仓库；事实上，可能也不应该这样做。这种工作流程的理念是：你频繁地向本地代码提交，以实现细粒度的版本控制，但只有当你完成一个功能——或者至少让代码达到一个对他人有意义的可工作阶段时，才将这些更改推送上去。提交一段不完全能工作的代码到本地仓库通常不是大问题——尽管通常应避免——但如果将无法工作的代码推送给他人，就不会受欢迎了。\
  \  \n\n在第一个克隆仓库中推送更改后，这些更改在第二个仓库中仍然不可见。你需要将它们拉取下来。  \n\n有一个命令  \n\n```\ngit fetch\n\
  ```  \n\n可以获取全局仓库中的更改，并让你在将这些更改与自己的代码合并之前，先检出查看。这很有用，因为你可以先检出并确保这些更改不会破坏你的代码，然后再进行合并。运行\
  \ `fetch` 命令后，你可以从全局仓库检出分支，在那里进行修改，并使用下文描述的分支机制将它们合并到你的代码中。然而，在大多数情况下，我们只想将全局仓库中的更改合并到当前代码中，并且并不想在合并之前修改它。在这种情况下，命令\
  \  \n\n```\ngit pull\n```  \n\n可以一步完成获取最新更改并将其合并到本地仓库的操作。这是将他人所做的更改（已推送到全局仓库）与你的更改合并时最常用的操作。\
  \  \n\n转到没有更改的那个克隆仓库，并运行该命令。检查一下，现在你那里是否已经有了这些更改。  \n\n与他人协作项目的一般工作流程是：进行更改并将其提交到自己的仓库。你使用这个仓库来存放那些还不准备分享的更改，只有你能看到它们。然后，当准备与协作者分享时，你可以将更改推送到共享仓库；而当你需要他人所做的更改时，你可以将它们拉取下来。\
  \  \n\n如果你尝试推送到全局仓库，但别人已经推送了你尚未拉取的更改，你将会收到一个错误。不必担心。只需先拉取更改，之后就可以推送你的更改了。  \n\n\
  如果你将更改拉取到你的仓库，而此时你仓库中已有尚未推送的已提交更改，该操作就会变成一次合并操作，这需要一条提交信息。对此有一条默认信息，你可以直接使用。  \n\
  \n你有两个仓库可以进行实验，所以可以尝试在不同情况下向已有已提交更改的仓库推送和拉取更改。在你亲自进行一些实验之后，前面的解释应该会变得更加清晰。  \n\n\
  RStudio 对推送和拉取提供了一些基本支持。如果你创建一个新的 RStudio 项目，并选择将其放在一个现有目录中，可以尝试将其放在你的克隆仓库中。你会发现，Git\
  \ 面板现在多了两个新按钮：推送（push）和拉取（pull）。  \n\n### 处理冲突  \n\n如果恰好有人向全局仓库推送了与你在本地仓库中编辑的行重叠的更改，那么当你拉取更改时，就会遇到所谓的冲突。\
  \  \n\n无论是从 RStudio 拉取还是使用命令行，Git 都会通知你冲突。它会告诉你涉及哪些文件。如果你打开一个存在冲突的文件，你会看到 Git 已经用如下所示的文本标记了冲突：\
  \  \n\n```\n>>>>>> 9a0e21ccd38f7598c05fe1e21e2b32091bb0839b\n```  \n\n它会显示你所作的更改版本以及全局仓库中的更改版本。由于两处都有更改，Git\
  \ 在拉取命令中不知道如何将远程仓库合并到你的仓库中。  \n\n你必须进入文件并进行编辑，使其包含你想要的版本（这可能是两个版本的合并）。完成更改后，去掉 `<<<<`/`====`/`>>>>`\
  \ 这些标记行。  \n\n编辑完存在冲突的文件后，你需要将其暂存——在命令行运行 `git add 文件名`，或者在 RStudio 的 Git 面板中勾选暂存列中的文件——然后提交。这会告诉\
  \ Git 你已经处理了冲突，如果需要，之后就可以推送你自己的更改了。  \n\n\n\n### 使用分支\n\n分支是大多数版本控制系统的一项功能，它允许你同时处理代码的不同版本。一个典型的例子是，用一个分支来开发新功能，用另一个分支来维护软件的稳定版本。当你正在实现新功能时，代码处于不断变化的状态，新功能的实现可能存在缺陷，功能的接口也可能在不同设计方案间变动。你不希望用户使用你软件的这种版本——至少应该让他们知道，他们使用的包是不稳定的，并且他们正在使用的接口随时可能发生变化。因此，你需要将开发代码与发布代码分离开来。\n\
  \n如果你只是在特定时间发布版本，然后在发布版本之间实现新功能，那问题不大。用户应该使用你已经发布的版本，而不是发布版本之间的中间提交。但如果你发布了一个存在错误的版本——坦白说，这并非不可能——并且你想在发现错误时修复它，情况就没那么简单了。你可能不希望等到完成所有正在开发的新功能后再去修复这个错误。因此，你需要对发布版本的代码进行修改。如果发现更多错误，你会在发布代码上提交更多修复。而在此期间，你仍在修改你的开发代码。当然，你对发布代码所做的那些修复，也希望能合并到开发代码中。毕竟，你不希望下一个版本再次引入你已经修复过的错误。\n\
  \n这就是分支发挥作用的地方。RStudio 对分支的支持非常有限，它无法帮助你创建分支。为此，我们需要使用命令行。\n\n![图 15-4](img/439481_2_En_15_Fig4_HTML.jpg)\n\
  \n**图 15-4** 当代码位于 `master` 分支时的 Git 面板\n\n要创建一个分支，你可以使用命令 `git branch 分支名`，因此，要创建一个开发分支——为了简便起见，命名为\
  \ `develop`——我们使用：\n\n```\ngit branch develop\n```\n\n这仅仅是创建了分支。我们并不会被神奇地切换到该分支或其他什么操作。它只是告诉\
  \ git 我们有了一个新分支（并且它从我们在仓库提交历史中的当前位置分叉出来）。\n\n在 RStudio 中，我们可以在 Git 面板中看到当前所在的分支，见图\
  \ 15-4。在你目前实验过的项目中——以及任何你通过 `git init` 创建，或在创建项目时勾选了对话框中的 git 选项而创建了 git 仓库的项目中——你都会处于\
  \ `master` 分支。这是默认分支，也是通常用于发布版本的分支。\n\n如果你点击 Git 面板中的分支下拉菜单，会得到仓库中所有分支的列表，见图 15-5。你会看到一个名为\
  \ `origin/master` 的分支。这是中央仓库上的 master 分支，是在拉取数据时合并的那个分支。忽略它即可，它对我们不重要。如果你运行了 `git\
  \ branch develop` 命令，那么应该还会有一个 `develop` 分支。如果选择它，你就会切换到那个分支，见图 15-6。\n\n![图 15-6](img/439481_2_En_15_Fig6_HTML.jpg)\n\
  \n**图 15-6** 切换到 `develop` 分支之后\n\n![图 15-5](img/439481_2_En_15_Fig5_HTML.jpg)\n\
  \n**图 15-5** 选择要切换的分支\n\n你也可以在命令行中获取分支列表，使用命令：\n\n```\ngit branch\n```\n\n你可以使用以下命令来切换分支：\n\
  \n```\ngit checkout 分支名\n```\n\n如果你切换到 `develop` 分支，你会看到“拉取”和“推送”按钮变成了灰色。你可以在某个分支上修改代码并提交，但（目前）还不能进行推送和拉取操作。我们稍后会介绍这部分内容。\n\
  \n如果你在 `develop` 分支上对代码做了一些修改并提交，然后切换到 `master` 分支，你会发现那些修改并不存在。你可以通过查看文件以及查看 git\
  \ 历史记录（使用 `git log` 或点击 Git 面板中的“历史记录”按钮）来确认这一点。同样，在 `master` 分支上所做的修改也不会出现在 `develop`\
  \ 分支上。这正是我们想要的。这两个分支是互相独立的，我们可以通过切换分支来在开发分支和软件的发布版本之间进行工作。\n\n当你对一个分支进行了修改，并且希望这些修改也应用到另一个分支时，就需要合并分支。实际上，你是需要将一个分支合并到另一个分支中；这不是一个对称的操作。为此，请先检出你想要修改的目标分支，然后运行命令：\n\
  \n```\ngit merge 其他分支名\n```\n\n将 `其他分支` 中的修改合并到当前分支。例如，如果你对 `master` 分支进行了错误修复，并希望将其合并到\
  \ `develop` 分支，你应该这样做：\n\n```\ngit checkout develop\ngit merge master\n```\n\n如果合并导致冲突，解决冲突的方式与拉取操作导致冲突时的解决方式相同，这并不奇怪，因为\
  \ `pull` 命令实际上只是获取和合并的快捷方式。\n\n#### 典型工作流涉及大量分支\n\nGit 针对使用大量分支进行了优化（这与某些版本控制系统不同，在这些系统中创建和合并分支可能相当缓慢）。这一点体现在许多人在使用\
  \ Git 时对分支的应用方式上：你会创建许多分支，在一个由不同代码版本构成的图谱上工作，并在需要时将它们合并在一起。\n\n拥有一个开发分支和一个主分支是仓库结构的典型核心，但为每个你要实现的新功能创建一个分支也是非常普遍的做法。通常，在开始处理某个功能时，你会从\
  \ `develop` 分支分出该功能分支，并在完成功能后将其合并回 `develop` 分支。为每个错误修复设立一个单独的分支也很常见——通常在你开始实施修复时从\
  \ `master` 分支分出，然后在修复完成后将其合并回 `master` 分支以及 `develop` 分支。请参阅 Atlassian 的 Git 教程（`www.atlassian.com/git/tutorials/comparing-workflows`）了解利用各种分支的不同工作流。\n\
  \n如果你为每个功能或错误修复创建了许多分支，那么在完成相关工作后，你可能不想保留它们——不像你希望永久保留的 `develop` 和 `master` 分支那样。要删除一个分支，使用以下命令：\n\
  \n```\ngit branch -d 分支名\n```\n\n\n\n### 将分支推送至全局仓库\n\n你可以在本地仓库中随心所欲地创建任意数量的分支，但它们并不会自动出现在全局仓库中。我们之前创建的\
  \ `develop` 分支仅存在于本地仓库，并且我们无法将其更改推送到全局仓库——在 RStudio 中可以看到，因为推送（和拉取）按钮是灰色的。\n\n如果你希望某个分支也存在于全局仓库中——以便能够推送更改，并且让协作者能够检出一需要在该仓库中创建一个分支，并建立本地仓库与全局仓库之间的链接。\n\
  \n你可以通过检出 `develop` 分支并运行以下命令来实现：\n\n```\ngit push --set-upstream origin develop\n\
  ```\n\n该命令会推送更改，并且还会记住将来该分支已与 `origin` 中的 `develop` 分支关联。名称 `origin` 指的是你创建此仓库时所克隆的仓库。\n\
  \n是否希望正在处理的分支也出现在全局仓库中，这取决于个人偏好。如果你正在开发一个希望在完成后才分享、而不提前公开的功能，你可能不希望将该分支推送到全局仓库。不过，对于\
  \ `develop` 和 `master` 分支，你肯定希望它们存在于全局仓库中。\n\n## GitHub\n\nGitHub（`https://github.com`）是一个用于托管\
  \ Git 仓库的服务器。你可以将其视为存放裸仓库/全局仓库的地方，并附带一些额外功能。例如，有自动安装托管在 GitHub 上软件包的方法、用于追踪错误和功能请求的\
  \ Web 支持，以及通过 Web 界面在托管项目中共享修复和功能的支持。\n\n要使用它，你首先需要访问其主页并注册。注册是免费的，你只需选择一个用户名和密码即可。\n\
  \n在 GitHub 上创建账户后，你可以通过点击主页右上角的大加号来创建新仓库，见图 15-7。\n\n点击后，你将进入一个页面，可以在其中选择仓库名称、添加简短描述、选择许可证，并决定是否要添加\
  \ `README.md` 文件。我建议你始终保留一个 `README.md` 文件——因为它会显示在 GitHub 仓库的主页上，可作为软件包的文档。不过，正如我们在第\
  \ 13 章中看到的，你可能希望设置一个 `README.Rmd` 文件来生成它。但现在，你可以选择直接生成一个。\n\n仓库生成后，你将进入一个页面，其中显示仓库中的代码概览，见图\
  \ 15-8。\n\n![图 15-8](img/439481_2_En_15_Fig8_HTML.jpg)\n仅包含一个 `README.md` 文件的新 GitHub\
  \ 仓库\n\n![图 15-7](img/439481_2_En_15_Fig7_HTML.jpg)\nGitHub 主页上用于创建新仓库的按钮。位于主页右上角\n\
  \n你可以稍后探索该网页及其实现的功能——了解它支持哪些操作是个好主意——但现在，我们只需将此仓库用作远程全局仓库即可。要克隆它，你需要获取 SSH 按钮旁边字段中的地址。在我的测试仓库中，地址是\
  \ `git@github.com:mailund/test.git`。你可以使用此地址通过“ssh”协议克隆仓库：\n\n```\ngit clone git@github.com:mailund/test.git\n\
  ```\n\n这是一种你可以在许多机器上访问的协议，但它需要你处理公钥/私钥协议。请查看 GitHub 上关于设置 SSH 密钥的文档以了解更多信息（`https://help.github.com/articles/generating-ssh-keys/`）。目前该过程大多已自动化，通常只需推送一次并回答弹出的问题即可完成设置。\n\
  \n然而，如果你使用的是支持 HTTPS（Web 浏览器用于安全通信的协议）的机器，SSH 协议可能不是最便捷的方式。你自己的机器几乎肯定支持 HTTPS，但根据防火墙的设置方式，你可能在计算机集群等环境中无法使用\
  \ HTTPS，这时就需要使用 SSH 协议。要改用 HTTPS 而非 SSH，只需点击 SSH 按钮的下拉菜单并选择 HTTPS 即可。这会提供一个略有不同的地址——在我的仓库中，地址是\
  \ `https://github.com/mailund/test.git`——你可以用它来克隆：\n\n```\ngit clone https://github.com/mailund/test.git\n\
  ```\n\n如果一切顺利，你应该能够像使用之前我们自己创建的裸仓库/全局仓库一样，使用这个克隆的仓库。\n\n你也可以在 RStudio 的文件菜单中选择“新建项目…”，然后在弹出的对话框中选择“版本控制”（第三个选项），同时检出仓库并创建一个\
  \ RStudio 项目。在下一个窗口中，选择 Git，然后使用 HTTPS 地址作为仓库 URL。\n\n### 将现有仓库迁移至 GitHub\n\n如果你已经在项目中本地使用了\
  \ Git，并且想将其迁移到 GitHub，那么你需要做更多的工作——至少如果你想迁移包含所有历史记录的仓库，而不仅仅是当前版本的源代码的话。\n\n首先，你需要创建仓库的一个裸版本。正如我们之前所见，这只是不带源代码的仓库版本。\n\
  \n如果你的仓库名为 `repo`，我们可以通过克隆创建一个名为 `repo.git` 的裸版本：\n\n```\ngit clone --bare repo\
  \ repo.git\n```\n\n要将其迁移到 GitHub，在那里创建一个空仓库并获取其 HTTPS 地址。然后进入我们刚刚创建的裸仓库并运行以下命令：\n\
  \n```\ncd repo.git\ngit push --mirror\n```\n\n现在，删除用于将代码迁移到 GitHub 的裸仓库，并从 GitHub\
  \ 克隆该版本。这样你就有了一个可以处理的版本：\n\n```\nrm -rf repo.git\ngit clone\n```\n\n### 从 GitHub\
  \ 安装软件包\n\n将 R 包托管在 GitHub 上的一个非常好的额外好处（除了拥有版本控制之外）是，其他人可以直接从那里安装你的包。CRAN 对上传包的要求比\
  \ GitHub 严格得多，而且你无法频繁地向 CRAN 上传新版本，因此对于 R 包的开发版本来说，GitHub 是一个极好的选择。\n\n要从 GitHub\
  \ 安装包，你需要先安装 `devtools` 包：\n\n```\ninstall.packages(\"devtools\")\n```\n\n之后，你可以使用以下命令安装\
  \ GitHub 用户“username”编写的名为“packagename”的包：\n\n```\ndevtools::install_github(\"username/packagename\"\
  )\n```\n\n\n\n## 在 GitHub 上进行协作\n\n你在 GitHub 上创建的仓库默认只有你自己可以编辑。任何人都可以克隆它们来获取源代码，但只有你能向仓库推送更改。这当然有助于防止无关人员随意修改你的代码，但也阻碍了协作。\n\
  \n与他人协作的一种方式是授予他们对仓库的写入权限。在仓库主页上，你必须在工具栏中选择 `Settings` 条目，然后在左侧菜单中选择 `Collaborators`。之后，你会进入一个页面，可以在其中添加由\
  \ GitHub 用户账号标识的协作者。协作者可以像你一样向仓库推送更改。为了避免在多位协作者更新代码时造成混乱，在如何将更改合并到 `master`（和/或\
  \ `develop`）分支方面遵循一定的规范会很有帮助。GitHub 推荐并支持的一种方法是：在独立的分支上进行更改，然后使用所谓的拉取请求（pull request）在更改被合并到主分支之前进行讨论。\n\
  \n### 拉取请求\n\n进行拉取请求的工作流程是：在独立于 `develop` 或 `master` 的分支上实现新功能、修复 Bug 或进行其他任何开发，然后不是直接合并它们，而是创建一个所谓的拉取请求。你可以通过切换到仓库主页上的分支并选择大大的绿色\
  \ `New pull request` 按钮来发起拉取请求，或者如果你刚刚做了更改，你应该还会看到一个写着 `Compare & pull request`\
  \ 的绿色按钮，点击它即可开始发起拉取请求。\n\n点击该按钮会带你进入一个页面，你可以在其中为拉取请求命名，并编写描述，说明你所做的代码更改的作用。你还需要决定要将拉取请求合并到哪个分支；在你为拉取请求命名的标题上方，你可以选择两个分支：你想要合并到的分支（`base`）以及包含你新更改的分支（`compare`）。你应该在此处选择你创建新分支时从中分支出去的源分支。之后，你就可以创建拉取请求了。\n\
  \n这实际上所做的唯一事情就是创建一个用于讨论你所做更改的 Web 界面。你可以在网页上查看这些更改、进行评论，或者对分支进行总体评论。同时，任何人都可以检出该分支并对其进行自己的修改。只要拉取请求保持打开状态，讨论就会持续进行，人们也可以对该分支进行改进。\n\
  \n当你完成操作后，你可以合并该拉取请求（使用在包含拉取请求讨论的网页上找到的大大的绿色 `Merge pull request` 按钮）。\n\n### 复刻仓库而非克隆\n\
  \n在独立的分支上进行更改，然后通过拉取请求合并这些更改，仍然需要仓库的写入权限。这对于与几位朋友协作来说非常棒，但对于从陌生用户那里获取修复代码来说并不理想——也不适合为你编写的其他软件包的修复做出贡献，这些软件包的作者不一定会愿意授予你对他们的软件完全写入权限。\n\
  \n不必担心，即使没有对方仓库的写入权限，仍然可以在 GitHub 上与他人协作。从拉取请求的工作方式来看，实际上并不需要被合并的分支属于同一个基础仓库。如果你愿意，可以从任何地方合并分支。\n\
  \n如果你想对一个没有写入权限的仓库进行更改，你可以克隆它并在克隆后得到的仓库上进行更改，但你无法将这些更改推回你从中克隆的原始仓库。而且，GitHub 上的其他用户看不到你在本地所做的更改（它们在你自己的个人电脑上，而不是在\
  \ GitHub 服务器上）。你需要的是一个位于 GitHub 上、是你想要修改的仓库的克隆版本、并且是裸仓库的仓库，这样你才能将更改推送进去。然后，你再将该仓库克隆到自己的电脑上。你对本地电脑所做的更改可以推送到你在\
  \ GitHub 上的那个裸仓库中——因为它是一个裸仓库，并且你拥有它的写入权限——并且 GitHub 上的其他用户可以看到你托管的那个仓库。\n\n在 GitHub\
  \ 上创建这样的仓库被称为“复刻（fork）”该仓库。从技术上讲，这与你克隆仓库并无不同——只不过你创建的是一个裸仓库——这个术语来源于开源软件，在开源软件中，复刻一个项目意味着创建你自己的版本并独立于之前的版本进行开发。\n\
  \n总之，每当你进入 GitHub 上的一个仓库主页时，你应该会在右上角（在你正在查看的仓库名称和分支的右侧）看到一个写着 `Fork` 的按钮。点击它会创建一个你拥有写入权限的仓库副本。你不能复刻自己的仓库——我不确定为什么不允许这样做，但在大多数情况下，你本来也不想这样做，所以这不是什么大问题——但你可以复刻其他用户账号下的任何仓库。\n\
  \n一旦你创建了副本，你可以像处理任何其他仓库一样，将其克隆到你的电脑上并进行更改。这个仓库与你自行创建的仓库唯一的区别在于，当你创建拉取请求时，GitHub\
  \ 知道它是从另一个仓库复刻而来的。因此，当你创建拉取请求时，你不仅可以选择 `base` 和 `compare` 分支，还可以选择 `base fork`（基础复刻）和\
  \ `head fork`（头复刻）——前者是你想要合并更改的目标仓库，后者是你进行更改的仓库。如果有人复刻了你的项目，并且你在原始仓库中创建拉取请求，默认情况下你不会看到\
  \ `base fork` 和 `head fork` 的选项，但在创建拉取请求时点击 `compare across forks`（跨复刻比较）链接也会启用这些选项。\n\
  \n如果你通过拉取请求将你的更改提交到别人的仓库，其过程与在你自己的项目上发起拉取请求完全相同，只不过在关于更改的讨论结束后，你无法合并该拉取请求。只有拥有该仓库写入权限的人才能执行合并操作。\n\
  \n同样，如果其他人想要对你的代码进行更改，他们也可以发起一个包含他们更改的拉取请求提交到你的代码中，但只有你才能在经过拉取讨论后决定是否将这些更改合并到你的仓库中。\n\
  \n这是一种非常灵活的协作方式——即使是与陌生人协作——用于源代码开发，这也是 git 和 GitHub 的优势之一。\n\n### 练习\n\n从你之前编写的任意软件包中挑选一个，在\
  \ GitHub 上创建一个仓库来托管它。将你的代码推送上去。\n\n脚注 1   2   3   4   5\n\n\n\n# 16. 性能剖析与优化\n\n\
  在本第二章中，我们将简要探讨当发现代码运行速度过慢时该怎么做，特别是如何找出运行缓慢的原因。\n\n不过，在你开始担心代码性能之前，重要的是先考虑一下是否值得加速。提升性能需要花费你的时间，只有将额外的编程时间考虑在内后，改进后的性能仍能为你节省时间，这才值得去做。对于一个一天之内就能运行完成的分析来说，花一整天去让它变得更快毫无意义，即使它确实会快很多，因为你最终仍然需要花费相同甚至更多的时间才能完成分析。\n\
  \n任何你在一项分析中只需要运行几次的代码，通常都不值得优化。我们很少只运行一次分析——乐观地说，我们可能希望如此，但实际上，当数据或想法发生变化时，我们通常需要反复运行——但我们预计不会运行成百上千次。因此，即使重新运行一项分析需要几个小时，你的时间可能最好花在运行期间做其他事情上。花费大量时间让它变得更快通常并不值得。与你的时间相比，CPU\
  \ 的时间是廉价的。\n\n不过，如果你正在开发一个软件包，你通常确实需要在某种程度上考虑性能。一个值得开发的软件包通常会有更多用户，运行你的代码所花费的总时间使得在某种程度上加快代码速度是值得的。\n\
  \n## 性能剖析\n\n在让代码跑得更快之前，首先需要找出它为什么慢。你可能对代码的瓶颈在哪里有一些想法，但实际上，猜测这一点出奇地困难。我经常发现，大部分时间实际消耗的地方与我预想的相差甚远。我曾有两次非常努力地尝试加快某个算法的速度，结果却后来发现程序运行缓慢的原因是用于读取程序输入的代码。解析器很慢，而相比之下算法快如闪电。那是在\
  \ `C` 语言中，其抽象层次相当低，通常很容易从代码中看出运行需要多少时间。但在 `R` 语言中，其抽象层次非常高，要猜测一行代码需要运行多长时间是极其困难的。\n\
  \n关键是，如果你发现代码运行缓慢，你不应该去猜测哪里慢。你应该测量运行时间，从而确切地了解。你需要对你的代码进行性能剖析，才能知道哪些部分占用了大部分运行时间。否则，你最终可能会优化那些只占总运行时间百分之几的代码，而忽略了真正的耗时大户。\n\
  \n在典型的代码中，只有少数几个真正的瓶颈。如果你能找出这些瓶颈并改进它们的性能，你的工作就完成了。其余部分会运行得足够快。找出这些瓶颈所在就需要性能剖析。\n\
  \n我们将使用 `profvis` 包进行性能剖析。`RStudio` 对此包有内置支持，你的菜单栏中应该有一个 `Profile` 项。这是该包的一个便捷界面，但如果你希望在\
  \ `RStudio` 之外使用它，我将在此直接使用该包。\n\n### 一个图流算法\n\n作为一个我们希望进行性能剖析的代码示例，可以考虑一个小型图算法。这是一个用于平滑图中节点权重的算法。它是用于在图节点间传播证据权重的算法的一部分，我们曾用它来通过基因-基因相互作用网络增强疾病-基因关联的搜索。思路是，如果在一个相互作用网络中一个基因是另一个基因的邻居，那么它更可能与后者具有相似的疾病关联。因此，已知关联的基因被赋予初始权重，而其他基因如果与这些基因相连，则会获得更高的权重。\n\
  \n然而，该算法用于做什么的细节并不那么重要。它所做的只是在节点间平滑权重。最初，所有节点 *n* 被赋予一个权重 *w*(*n*)。然后，在一次平滑迭代中，这个权重被更新为\
  \ `w'(n) = α * w(n) + (1 - α) * (1 / |N(n)|) * Σ_{v∈N(n)} w(v)`，其中 *α* 是介于 0 和 1\
  \ 之间的数字，*N*(*n*) 表示节点 *n* 的邻居。如果迭代次数足够多，图中所有连通节点的权重将变得相等，但如果提前停止，则只是一次轻微的平滑，具体取决于\
  \ *α* 的值。\n\n为了实现这一点，我们既需要图的表示形式，也需要平滑算法。我们从表示图开始。有很多方法可以做到这一点，但一种简单的格式是所谓的关联矩阵。这是一个矩阵，如果节点\
  \ `i` 和 `j` 没有直接相连，则其条目为 `M[i,j] = 0`；如果相连，则为 `M[i,j] = 1`。由于我们希望在这个算法中处理无向图，我们将有\
  \ `M[i,j] = M[j,i]`。\n\n我们可以使用一个如下所示的构造函数来实现这种表示形式：\n\n```\ngraph = 1) {\nfor (i\
  \ in seq(1, no_edges, by = 2)) {\nm[edges[i], edges[i+1]] <- m[edges[i+1], edges[i]]\
  \ <- 1\n}\n}\nstructure(m, class = \"graph\")\n}\n```\n\n这里，我要求将节点数量作为参数 `n` 给出，并将边指定为一个向量，其中每对元素对应一条边。如果图需要手动编码，这并不是表示边的理想方式，但由于这个算法预期用于非常大的图，我假设我们可以在其他地方编写代码来读取图表示形式并创建这样的边向量。\n\
  \n这个函数本身没什么大不了的。它只是创建了关联矩阵，然后遍历边来设置它。有一个特殊情况需要处理：如果边向量为空。这时 `seq()` 调用会返回一个从 1 到\
  \ 0 的列表，所以我们要避免这种情况。我们可能还想检查边向量的长度是否是 2 的倍数，但我没这么做。我假设生成该向量的代码会处理好这一点。\n\n尽管图表示形式只是一个矩阵，但我为它指定了一个类，以便将来我想为它编写泛型函数。\n\
  \n有了这个图表示形式，平滑函数可以如下所示：\n\n```\nsmooth_weights  0) {\nnew_weights[i] <-\nalpha *\
  \ node_weights[i] +\n(1 - alpha) * neighbour_weights / n\n} else {\nnew_weights[i]\
  \ <- node_weights[i]\n}\n}\nnew_weights\n}\n```\n\n它创建了我们要返回的新权重向量，然后通过嵌套循环遍历矩阵。如果关联矩阵表明\
  \ `i` 和 `j` 之间存在连接，并且 `i ≠ j`——我们不想在存在自环的情况下添加节点自身的权重——我们就用它来计算均值。如果存在需要更新的内容——当节点\
  \ `i` 有邻居时就会这样——我们就执行更新。\n\n这段代码并不特别优雅，但它是该思路的直接实现。\n\n\n\n为了分析这段代码，我们使用`profvis`包中的`profvis()`函数。它接受一个表达式作为其唯一参数，因此若要分析多个函数调用，我们需向其提供一个代码块，将语句序列转换为表达式。\n\
  \n此处生成一个包含 1000 个节点、300 条边和随机权重的随机图。我们并非测试代码，仅对其性能进行分析。然而，若这是真实代码而非示例，我们当然应编写单元测试——若您开始重写代码以进行优化，这一点尤为重要。否则，您最终可能得到运行更快但结果错误的代码。\n\
  \n```\nprofvis::profvis({\nn <- 1000\nnodes <- 1:n\nedges <- sample(nodes, 600,\
  \ replace = TRUE)\nweights <- rnorm(n)\ng <- graph(n, edges)\nsmooth_weights(g,\
  \ weights, 0.8)\n})\n```\n\n![](img/439481_2_En_16_Fig1_HTML.jpg)\n\n**图 16-1**\n\
  \n展示分析结果的窗口\n\n（若您使用`RStudio`，可通过选中`n <- 1000`至`smooth_weights(...)`的代码行，然后在`Profile`菜单中选择`Profile\
  \ Selected Line(s)`达到同样效果。）\n\n运行此代码将打开一个新标签页并显示结果，参见**图 16-1**。标签页上半部分显示您的代码，并以水平条形图方式注释内存使用情况（先显示）和时间使用情况（后显示）。窗口下半部分则显示时间使用情况及调用堆栈。\n\
  \n我们可以看到总执行时间约为 1800 毫秒。该图的阅读方式为：从左到右，您可以看到运行过程中各时间点执行了哪些内容，底部是我们在`profvis()`代码块中直接调用的函数，其上方是这些函数直接调用的代码，更上层的函数调用则堆叠得更高。\n\
  \n![](img/439481_2_En_16_Fig2_HTML.jpg)\n\n**图 16-2**\n\n从分析窗口中高亮显示正在执行的代码\n\n我们还可以看出大部分时间都花费在`smooth_weights()`函数上，因为它几乎从图形最左侧一直延伸至最右侧。当然，这是符合预期的，但正如我之前提到的，有时分析结果会令您感到惊讶。\n\
  \n如果将鼠标指针移入窗口（无论是代码区域还是底部图形区域），它会高亮显示您所指的内容，参见**图 16-2**。您可利用此功能找出时间消耗在何处。\n\n在此特定案例中，大部分时间似乎花费在内层循环检查边是否存在上。由于这是双重循环的内层部分，这一点或许并不令人意外。并非内层循环全部主体都耗时，而主要是`if`语句，原因可能是我们在每次迭代中都会检查`if`表达式，但仅在其为真时才执行其主体。而面对\
  \ 1000 个节点和 300 条边，其为真的概率约为 300/(1000*1000) = 3 × 10^-4（实际可能更小，因为某些边可能相同或为自环）。\n\
  \n若此代码存在性能问题，此处应是我们集中优化努力的方向。对于 1000 个节点，我们实际上并没有问题，1800 毫秒毕竟不算长。但我设想中的应用场景约有 30000\
  \ 个节点，因此进行一些优化或许是值得的。\n\n如果需要优化某些内容，您首先应考虑的是：是否存在更好的算法或数据结构？与仅仅修改实现细节相比，算法层面的改进更有可能带来显著的性能提升。\n\
  \n在此例中，如果我们处理的图是稀疏的（即实际边数远少于所有可能的边数），那么关联矩阵并非理想的表示方式。我们可以通过使用向量表达式替换内层循环或类似技巧来加速代码，但更好的做法是考虑另一种图表示方式。\n\
  \n当然，我们首先应弄清楚所使用的模拟数据是否代表了需要分析的实际数据。如果实际数据是稠密图，而我们却基于稀疏图进行性能分析，则无法准确了解时间消耗在哪里，也无法确定可以合理优化的方向。但我固执地认为，我所设想中的应用场景使用的是稀疏图。\n\
  \n对于稀疏图，我们应采用不同的格式表示边。我们将使用列表而非矩阵来表示边：对于每个节点，都维护一个包含其所有邻居节点的向量。\n\n我们可以如下实现该表示：\n\
  \n```\ngraph <- function(n, edges) {\n  neighbours <- vector(\"list\", n)\n  if\
  \ (length(edges) > 0) {\n    for (i in seq(1, length(edges), by = 2)) {\n      n1\
  \ <- edges[i]\n      n2 <- edges[i + 1]\n      neighbours[[n1]] <- c(n2, neighbours[[n1]])\n\
  \      neighbours[[n2]] <- c(n1, neighbours[[n2]])\n    }\n  }\n  for (i in seq_along(neighbours))\
  \ {\n    neighbours[[i]] <- unique(neighbours[[i]])\n  }\n  structure(neighbours,\
  \ class = \"graph\")\n}\n```\n\n我们首先生成边向量的列表，然后将其全部初始化为空整数向量。接着遍历输入的边并更新边向量。这种更新方式在计算上可能较慢，因为每次更新都会强制复制之前的向量，但我们事先不知道这些向量的长度，因此这是最简单的解决方案。如果后续的性能分析表明这是一个问题，我们再处理它。\n\
  \n如果输入的边中包含重复的节点对，我们将得到重复的边。这意味着在计算邻居权重的平均值时，同一邻居节点会被使用两次。如果应用允许此类多重边，那没问题，但我们的场景不允许，因此我们在最后对所有向量调用`unique()`函数，以确保同一邻居只被表示一次。\n\
  \n采用这种图表示后，我们可以将平滑函数更新如下：\n\n```\nsmooth_weights <- function(graph, node_weights,\
  \ alpha) {\n  new_weights <- node_weights\n  for (i in seq_along(graph)) {\n   \
  \ neighbours <- graph[[i]]\n    n <- length(neighbours)\n    if (n > 0) {\n    \
  \  neighbour_weights <- sum(node_weights[neighbours])\n      new_weights[i] <- \n\
  \        alpha * node_weights[i] + \n        (1 - alpha) * neighbour_weights / n\n\
  \    } else {\n      new_weights[i] <- node_weights[i]\n    }\n  }\n  new_weights\n\
  }\n```\n\n代码改动很小。我们只需确保`j`仅遍历已知的节点`i`的邻居节点。\n\n性能分析代码与之前相同，运行后将得到如**图 16-3**所示的结果。\n\
  \n我们看到性能得到了显著提升。执行时间从 1800 毫秒降至 20 毫秒。我们还可以看到，一半时间用于构建图，仅另一半用于执行平滑操作。在构建图的过程中，几乎所有时间都花费在`unique()`上；而在平滑函数中，时间则用于实际计算邻居权重的平均值。\n\
  \n![](img/439481_2_En_16_Fig3_HTML.jpg)\n\n**图 16-3**\n\n第一次更改后的性能分析结果\n\n需要指出的是，分析器通过在特定时间点对正在执行的代码进行采样来工作。它不具备无限分辨率；如左下角所示，它每\
  \ 10 毫秒采样一次。因此，在此次运行中它实际上仅采样了两次。我们看到的这个结果，仅仅是因为样本恰好分别落在了图构建和平滑的那两个代码位置上。我们实际上并未观察到精细的细节。\n\
  \n为了获得更多细节，并更接近实际预期输入的数据规模，我们可以尝试将图的规模增加到 10000 个节点和 600 条边：\n\n```\nprofvis::profvis({\n\
  \  n <- 10000\n  nodes <- 1:n\n  edges <- sample(nodes, 1200, replace = TRUE)\n\
  \  weights <- rnorm(n)\n  g <- graph(n, edges)\n  smooth_weights(g, weights, 0.8)\n\
  })\n```\n\n![](img/439481_2_En_16_Fig4_HTML.jpg)\n\n**图 16-4**\n\n使用更大规模图后的性能分析结果\n\
  \n\n\n令人惊讶的是，我们发现在处理较大图时，构建图的实际耗时竟然超过了平滑图的时间。我们还发现，这部分时间主要花在调用`unique()`函数上。\n\n\
  虽然这些调用对于避免重复边是必要的，但并非每次调用都能发挥作用——至少在随机图中，重复边出现的可能性较低——因此，大多数调用实际上并未执行有效操作。\n\n如果我们能通过一次`unique()`调用就去除所有重复边，那么就可以节省一些时间。我们可以做到这一点，但这需要在构建函数中做更多工作。\n\
  \n我们需要确保边的唯一性，这存在两个问题。其一，我们并未将边表示为可调用`unique()`的成对形式，且对`edges`向量直接调用`unique()`显然不是解决方案；其二，同一条边可能以`(i,\
  \ j)`和`(j, i)`两种截然不同的方式表示。\n\n针对第一个问题，我们可以通过将向量转换为矩阵来解决。对矩阵调用`unique()`会返回唯一的行，因此用这种方式表示边对即可。针对第二个问题，我们可以通过确保边以规范形式表示来解决，例如要求边`(i,\
  \ j)`中`i < j`。\n\n```\ngraph <- function(n, edges) {\n  neighbours <- vector(\"\
  list\", n)\n  edge_matrix <- matrix(edges, ncol = 2, byrow = TRUE)\n  for (i in\
  \ seq(1, nrow(edge_matrix))) {\n    if (edge_matrix[i, 1] > edge_matrix[i, 2]) {\n\
  \      edge_matrix[i, ] <- c(edge_matrix[i, 2], edge_matrix[i, 1])\n    }\n  }\n\
  \  edge_matrix <- unique(edge_matrix)\n  for (i in seq(1, nrow(edge_matrix))) {\n\
  \    n1 <- edge_matrix[i, 1]\n    n2 <- edge_matrix[i, 2]\n    neighbours[[n1]]\
  \ <- c(n2, neighbours[[n1]])\n    neighbours[[n2]] <- c(n1, neighbours[[n2]])\n\
  \  }\n  structure(neighbours, class = \"graph\")\n}\n```\n\n尝试对这段代码进行性能分析，看看你会得到什么结果。\n\
  \n在我进行性能分析时，发现运行时间缩短了一半，并且相比于之前，构建图所花费的相对时间也更少。由于代码执行时间同样变得非常短，我们无法仅凭性能分析样本就断定更多细节。\n\
  \n这个图的大小并未达到我编写这段代码时所预期应用场景的规格。我们可以将其扩展至完全规模，即大约 20,000 个节点和 50,000 条边^(³⁶)，并对该规模进行性能分析。结果如图\
  \ 16-5 所示。\n\n在完整规模的图上，我们的大部分时间仍然花费在构建图上，而不是平滑图上——其中大约一半的构建时间都消耗在`unique()`函数中——但这会有些误导性。我们预计在实际应用中不会只对图调用一次平滑函数。每次调用平滑函数都会进一步平滑权重，我们可能需要对图运行大约十次迭代。\n\
  \n我们可以将函数重命名为`flow_weights_iteration()`，然后编写一个`smooth_weights()`函数，使其能够执行指定次数的迭代。\n\
  \n![](img/439481_2_En_16_Fig5_HTML.jpg)\n\n图 16-5\n\n完整规模图上的性能分析结果\n\n```\nflow_weights_iteration\
  \ <- function(graph, node_weights, alpha) {\n  new_weights <- node_weights\n  for\
  \ (i in seq_along(graph)) {\n    neighbours <- graph[[i]]\n    n <- length(neighbours)\n\
  \    neighbour_weights <- sum(node_weights[neighbours])\n    if (n > 0) {\n    \
  \  new_weights[i] <-\n        alpha * node_weights[i] + (1 - alpha) * neighbour_weights\
  \ / n\n    } else {\n      new_weights[i] <- node_weights[i]\n    }\n  }\n  new_weights\n\
  }\nsmooth_weights <- function(graph, node_weights, alpha, no_iterations) {\n  new_weights\
  \ <- node_weights\n  replicate(no_iterations, {\n    new_weights <- flow_weights_iteration(graph,\
  \ new_weights, alpha)\n  })\n  new_weights\n}\n```\n\n然后，我们可以对其进行十次迭代的性能分析：\n\n\
  ```\nprofvis::profvis({\n  n <- 20000\n  nodes <- 1:n\n  edges <- sample(nodes,\
  \ 100000, replace = TRUE)\n  weights <- rnorm(n)\n  g <- graph(n, edges)\n  flow_weights(g,\
  \ weights, 0.8, 10)\n})\n```\n\n结果如图 16-6 所示。显然，如果我们增加平滑函数的运行次数，平滑过程将占据更多的总运行时间，因此这里没有真正的意外发现。已经没有明显的热点区域需要深入探究了。我之前使用`replicate()`函数进行迭代，但它确实有一些开销，因为它不仅仅是循环——还会创建一个结果向量——通过将其替换为显式循环，我可以再节省几毫秒：\n\
  \n```\nsmooth_weights <- function(graph, node_weights,\n                       \
  \    alpha, no_iterations) {\n  new_weights <- node_weights\n  for (i in 1:no_iterations)\
  \ {\n    new_weights <-\n      smooth_weights_iteration(graph, new_weights, alpha)\n\
  \  }\n  new_weights\n}\n```\n\n我没有展示这个结果，所以你需要在这方面相信我。然而，目前已经没有任何主要的可优化点了。\n\n如果你的代码已经到了没有明显方法可以加速的地步，你就需要考虑是否真的需要进一步优化了。从这点出发，除非你能想出一个更好的算法（这可能很难），否则进一步的优化将会非常困难，并且很可能得不偿失。在计算运行期间，你最好将时间花在其他事情上，而不是浪费数天时间试图从中榨取更多的性能。\n\
  \n当然，在某些情况下，你确实需要进一步提升性能才能在合理时间内完成分析。你可以采取一些最后的补救措施，例如并行化代码或将时间关键部分迁移到 C++。但就目前而言，我们可以在不到两秒的时间内分析完整规模的图，因此我们绝对不应该再花更多时间来优化这段特定代码了。\n\
  \n\n\n## 加速代码运行\n\n如果你确实遇到了性能问题，该如何处理？我假设你所处理的问题并非他人已解决过的——如果已有现成的包可用，你当然应该直接使用，而非自行编写代码。不过，也可能存在类似的问题可供你借鉴调整。因此，在采取任何行动之前，不妨先做些调研，看看是否有人解决过类似问题，以及他们是如何解决的。生活中真正独一无二的问题少之又少，不借鉴他人的经验是愚蠢的。\n\
  \n![](img/439481_2_En_16_Fig6_HTML.jpg)\n\n图 16-6\n\n多次平滑迭代的性能分析结果\n\n确定搜索关键词可能需要一点时间，因为类似的问题可能出现在截然不同的领域中。也许存在一个解决方案，但你不知如何搜索，因为它所用的描述术语与你所在领域完全不同。在邮件列表或\
  \ Stack Overflow 上求助或许有所帮助，但别把精力浪费在那些稍加努力自己就能解决的小事上。\n\n如果你真的找不到可以借鉴的现有解决方案，下一步就是开始考虑算法和数据结构。改进这些方面对性能的影响，通常远大于微观优化所能达到的效果。进行任何优化时，首先要思考的是能否使用更好的数据结构或更优的算法。\n\
  \n当然，重新实现复杂的数据结构或算法是一项更艰巨的任务——如果能找到已实现的解决方案，你就不应该自己动手——但这通常也是提升性能最多的地方。当然，在花费时间重新实现算法与所能获得的性能提升之间，总是存在权衡。不过随着经验积累，你会更善于判断这一点。嗯，只能说稍微更善于一点。如果心存疑虑，与其花大量时间尝试改进，不如接受代码运行缓慢的现状。\n\
  \n在采取任何行动之前，请确保你拥有单元测试，用以验证新实现不会破坏旧功能！你的新代码就算快如闪电，但如果结果不正确，那也是毫无价值的。\n\n如果你已经探索过现有包、新的算法和数据结构，却仍然存在性能问题，那么你就进入了微观优化层面。在这个层面上，你通过使用略有不同的函数和表达式来尝试提升性能，但这种层面的改动不太可能带来巨大的性能提升。不过，如果你的代码会被执行数千次或数百万次，那么这些微小的改进加在一起，效果也会很可观。因此，如果性能分析凸显出几个性能热点，你可以尝试重写那里的代码。\n\
  \n在这个优化层面上，采样分析器的作用并不太大。它的采样精度在毫秒级别，这通常比你所需的粒度要粗得多。相反，你可以使用 `microbenchmark` 包来评估和比较表达式。`microbenchmark()`\
  \ 函数会多次运行一系列表达式，并以纳秒为单位计算执行时间的统计量。如果你想通过微观优化来提升一些性能，就可以用它来评估计算过程中的不同备选方案。\n\n例如，我们可以用它来比较一个自行实现的\
  \ `sum()` 与 R 内置的 `sum()` 函数：\n\n```\nlibrary(microbenchmark)\nmysum <- function(sequence)\
  \ {\ns <- 0\nfor (x in sequence) s <- s + x\ns\n}\nmicrobenchmark(\nsum(1:10),\n\
  mysum(1:10)\n)\n## Unit: nanoseconds\n##         expr min    lq     mean median\
  \  uq\n##    sum(1:10) 264 273.0   374.74  278.5 288\n##  mysum(1:10) 755 768.5\
  \ 26743.61  784.5 881\n##      max neval cld\n##     6409   100   a\n##  2590600\
  \   100   a\n```\n\n输出的第一列是被评估的表达式，接着是评估时的最小值、下四分位数、均值、中位数、上四分位数和最大值，然后是评估次数。最后一列对性能进行了排名，此处显示\
  \ `sum()` 为 `a`，`mysum()` 为 `b`，因此前者更快。这种排名考虑了评估时间的变化，并非仅按均值排序。\n\n关于通过微观优化来加速代码，有一些经验法则，但你应该始终进行实际度量。直觉往往远不如度量可靠。\n\
  \n一条经验法则是，尽可能使用内置函数。像 `sum()` 这样的函数实际上是用 C 语言实现的，并且经过了高度优化，因此我们自己实现的版本很难与之竞争，正如我们之前所见。\n\
  \n另一条经验法则是，使用能完成工作的最简单函数。更通用的函数会引入各种开销，而简单函数则可以避免这些开销。\n\n你可以使用 `Reduce()` 来将序列中的所有数字相加，但与专用函数相比，使用这种通用函数会相对较慢：\n\
  \n```\nmicrobenchmark(\nsum(1:10),\nmysum(1:10),\nReduce(`+`, 1:10, 0)\n)\n## Unit:\
  \ nanoseconds\n##                  expr  min     lq    mean median\n##         \
  \    sum(1:10)  262  280.0  369.34  302.5\n##           mysum(1:10)  767  792.5\
  \  987.13  830.0\n##  Reduce(`+`, 1:10, 0) 5211 5373.5 5946.64 5504.0\n##      uq\
  \   max neval cld\n##   333.0  3661   100 a\n##   891.0  5945   100  b\n##  5649.5\
  \ 19411   100   c\n```\n\n我们使用这类通用函数是为了编程方便。它们为我们提供了抽象的构建块。我们很少能从它们那里获得性能提升，有时它们甚至可能显著拖慢速度。\n\
  \n第三，尽可能少做工作。R 中的许多函数具有超出我们通常所想的更多功能。例如 `read.table()` 函数，它不仅读取数据，还会自动判断每列的数据类型。如果你使用\
  \ `colClasses` 参数告诉它每列的类型，它就能更快地运行，因为不必自行推断。对于 `factor()` 函数，你可以使用 `levels` 参数指定允许的类别，这样它就不必自行处理：\n\
  \n```\nx <- sample(LETTERS, 1000, replace = TRUE)\nmicrobenchmark(\nfactor(x, levels\
  \ = LETTERS),\nfactor(x)\n)\n## Unit: microseconds\n##                         expr\
  \    min      lq\n##  factor(x, levels = LETTERS) 13.915 15.5025\n##           \
  \         factor(x) 52.322 59.4495\n##      mean  median     uq     max neval cld\n\
  ##  18.83221 16.1160 18.743  44.608   100  a\n##  73.80394 66.4465 82.080 188.268\
  \   100   b\n```\n\n这不仅体现在提供输入时，以帮助函数避免花时间推断某些信息上。函数通常也会返回超过你实际需求的内容。例如，`unlist()`\
  \ 这样的函数会保留列表的名称到结果向量中。除非你真的需要这些名称，否则你应该丢弃它们，因为携带名称成本高昂。如果你只关心数值向量，应该使用 `use.names\
  \ = FALSE`：\n\n```\nx <- rnorm(1000)\nnames(x) <- paste(\"n\", 1:1000)\nmicrobenchmark(\n\
  unlist(Map(function(x) x**2, x), use.names = FALSE),\nunlist(Map(function(x) x**2,\
  \ x))\n)\n## Unit: microseconds\n##                                            \
  \    expr\n##  unlist(Map(function(x) x², x), use.names = FALSE)\n##           \
  \          unlist(Map(function(x) x², x))\n##      min       lq     mean   median\
  \       uq\n##  497.608 539.9505 624.1242 577.4815 659.0905\n##  533.906 572.9820\
  \ 653.8293 600.9775 666.7030\n##       max neval cld\n##  1812.271   100   a\n##\
  \  2059.874   100   a\n```\n\n第四，在可能的情况下，使用向量表达式而非循环，这不仅因为这样代码更易读，更因为向量表达式中的隐式循环由\
  \ R 的运行时系统处理，其速度远快于你编写的显式循环。\n\n\n\n最重要的一点是，在尝试提升性能时，始终要进行测量，并且只有当性能提升显著且值得时，才用更复杂的代码替换简单代码。\n\
  \n## 并行执行\n\n有时，提升速度的方法不是让操作更快，而是同时执行多个操作。如今大多数计算机拥有多个核心，这意味着你应该能够并行运行更多计算。\n\n\
  这些通常基于 `lapply()` 或 `Map()` 等函数的变体；例如，可以查看 `parallel` 包，也可以查阅 `foreach` 包，它提供了一种更高级别的循环构造，同样可用于并行运行代码。\n\
  \n如果考虑我们之前的图形平滑处理，由于每个节点都是独立的计算，我们可以通过并行运行这些计算来加速函数。如果将内部循环移入一个局部函数，我们就可以用对 `Map()`\
  \ 的调用替换外部循环：\n\n```\nsmooth_weights_iteration_map <- function(node_weights, neighbour_weights)\
  \ {\n  handle_i <- function(i) {\n    n <- neighbour_weights[[i]] |> length()\n\
  \    if (n > 0) {\n      alpha * node_weights[i] + (1 - alpha) * neighbour_weights\
  \ / n\n    } else {\n      node_weights[i]\n    }\n  }\n  unlist(Map(handle_i, 1:length(node_weights)))\n\
  }\n```\n\n这不太可能加速任何过程——高级 `Map()` 函数带来的额外开销反而会起到反作用——但它让我们可以将 `Map()` 替换为 `parallel`\
  \ 包中的函数，例如 `clusterMap()`：\n\n```\nunlist(clusterMap(cl, inner_loop, 1:length(node_weights)))\n\
  ```\n\n在这里，`cl` 是“集群”，仅由我旧笔记本电脑上的两个核心组成：\n\n```\ncl <- makeCluster(2, type = \"\
  FORK\")\nmicrobenchmark(\n  original_smooth(),\n  using_map(),\n  using_cluster_map(),\n\
  \  times = 5\n)\n```\n\n这些改动给了我以下结果。在我的双核笔记本上，我们可以预期并行版本的运行速度最高提升两倍。实际上，它却慢了几个数量级：\n\
  \n```\nUnit: milliseconds\nexpr        min          lq\noriginal_smooth()   33.58665\
  \    33.73139\nusing_map()            33.12904    34.84107\nusing_cluster_map()\
  \ 14261.97728 14442.85032\nmean      median          uq         max\n35.88307  \
  \  34.25118    36.62977    41.21634\n38.31528    40.50315    41.28726    41.81587\n\
  15198.55138 14556.09176 14913.24566 17818.59187\nneval cld\n5   a\n5   a\n5    b\n\
  ```\n\n我不完全确定这里的问题是什么，但很可能是每个独立任务非常短，而线程（此处实际上是进程）之间的通信开销最终占用了比实际计算多得多的时间。至少我的性能分析似乎表明了这一点。对于轻量级线程，可以避免一些通信，但我们这里的情况并非如此。\n\
  \n当每个任务运行时间较长，线程不必频繁通信时，并行化的效果会更好。\n\n举一个并行化效果更好的例子：考虑在训练数据上拟合模型并在测试数据上测试其准确性。我们可以使用之前看过的\
  \ `cars` 数据以及第 6 章的 `partition()` 函数。\n\n我们编写一个评估单个训练/测试分区的函数，然后顺序或并行地调用它 `n` 次：\n\
  \n```\ntest_rmse <- function(partitions) {\n  model <- partitions$training %>% lm(dist\
  \ ~ speed, data = .)\n  predictions <- partitions$test %>% predict(model, data =\
  \ .)\n  rmse(partitions$test$dist, predictions)\n}\nsample_rmse <- function(n) {\n\
  \  random_cars <- mtcars %>%\n    partition(n, c(training = 0.5, test = 0.5))\n\
  \  unlist(Map(test_rmse, random_cars))\n}\nsample_rmse_parallel <- function(n) {\n\
  \  random_cars <- mtcars %>%\n    partition(n, c(training = 0.5, test = 0.5))\n\
  \  unlist(clusterMap(cl, test_rmse, random_cars))\n}\n```\n\n当我为十个训练/测试分区执行此操作时，这两个函数花费的时间大致相同。也许并行版本稍慢一些，但这次开销并不大：\n\
  \n```\nmicrobenchmark(\n  sample_rmse(10),\n  sample_rmse_parallel(10),\n  times\
  \ = 5\n)\nUnit: milliseconds\nexpr      min       lq\nsample_rmse(10) 28.72092 29.62857\n\
  sample_rmse_parallel(10) 26.08682 27.15047\nmean   median       uq      max neval\
  \ cld\n31.57316 33.05759 33.21979 33.23894     5   a\n34.75991 28.17528 29.37144\
  \ 63.01556     5   a\n```\n\n然而，如果我创建 1000 个训练/测试分区，并行版本的运行速度就会开始超过顺序版本：\n\n```\n\
  microbenchmark(\n  sample_rmse(1000),\n  sample_rmse_parallel(1000),\n  times =\
  \ 5\n)\nUnit: seconds\nexpr      min       lq\nsample_rmse(1000) 3.229113 3.277292\n\
  sample_rmse_parallel(1000) 2.570328 2.595402\nmean   median       uq      max neval\
  \ cld\n3.459333 3.508533 3.536792 3.744934     5   b\n2.921574 2.721095 3.185070\
  \ 3.535977     5  a\n```\n\n由于我的笔记本电脑只有两个核心，它永远无法实现超过两倍的加速，而要实现并行化可能达到的最优速度提升通常也是不可能的。线程间的通信开销增加了并行版本所花费的时间，并且某些代码部分（例如准备所有线程要处理的数据）必须顺序执行。\n\
  \n然而，如果你有一台多核机器，并且能够将分析拆分成足够大的独立块，那么往往能从中获益。\n\n\n\n## 转向 C++\n\n这是一个重大的步骤，但通过转向\
  \ C 或 C++ 这类语言，你能对计算机进行更精细的控制，因为这使得你能在低得多的层面上编程，并且无需承受 R 语言运行时系统带来的额外开销。当然，这也意味着你不具备\
  \ R 语言的许多特性，因此你并不想在 C++ 中编写整个分析过程，但你可能希望将时间关键的代码转换为 C++。\n\n幸运的是，`Rcpp` 包让集成 R 和\
  \ C++ 变得相当简单——当然，前提是你同时掌握这两种语言。真正需要注意的唯一一点是，C++ 的索引从 0 开始，而 R 从 1 开始。`Rcpp` 会自动处理这种转换，因此在\
  \ R 中索引从 1 开始的向量在 C++ 中可以按索引从 0 开始访问，但在翻译代码时，你必须牢记这一点。\n\n要完整描述这套用于 C++ 和 R 之间通信的框架，远远超出了本书的范围。关于这一点，我将推荐\
  \ Dirk Eddelbuettel 的佳作 *通过 Rcpp 无缝集成 R 与 C++*。在此，我只是让你初步了解如何使用 `Rcpp` 来加速某个函数。\n\
  \n我们将再次聚焦于平滑函数。它是一个相对简单的函数，没有使用 R 的任何高级特性，因此是转换为 C++ 的理想对象。我们几乎可以逐字逐句地进行转换，只需记住索引应从\
  \ 0 而不是 1 开始：\n\n```\nNumericVector\nsmooth_weights_iteration_cpp(List g,\nNumericVector\
  \ node_weights,\ndouble alpha)\n{\nNumericVector new_weights(g.length());\nfor (int\
  \ i = 0; i < g.length(); ++i) {\nIntegerVector neighbours = g[i];\nint n = neighbours.size();\n\
  double neighbour_sum = 0.0;\nfor (int j = 0; j < n; ++j) {\nneighbour_sum += node_weights[neighbours[j]];\n\
  }\nif (n > 0) {\nnew_weights[i] = alpha * node_weights[i] +\n(1-alpha) * (neighbour_sum\
  \ / n);\n} else {\nnew_weights[i] = node_weights[i];\n}\n}\nreturn new_weights;\n\
  }\n```\n\n类型 `List`、`NumericVector` 和 `IntegerVector` 分别对应 R 中的类型。除了我们创建 `new_weights`\
  \ 向量的方式之外，这段代码与 R 代码非常接近。\n\n有几种方法可以编译此函数并将其封装到 R 函数中，但最简单的方法就是将其放在一个字符串中，然后交给函数\
  \ `cppFunction()`：\n\n```\ncppFunction(\"\nNumericVector\nsmooth_weights_iteration_cpp(List\
  \ g,\nNumericVector node_weights,\ndouble alpha)\n{\nNumericVector new_weights(g.length());\n\
  for (int i = 0; i < g.length(); ++i) {\n// 此处函数体即上面展示的 C++ 代码...\n}\nreturn new_weights;\n\
  }\n\")\n```\n\n这会创建一个与 C++ 函数同名的函数，可以直接从 R 中调用。`Rcpp` 会负责在需要时进行类型转换：\n\n```\nsmooth_weights_cpp\
  \ <- function(graph, node_weights,\nalpha, no_iterations) {\nnew_weights <- node_weights\n\
  for (i in 1:no_iterations) {\nnew_weights <-\nsmooth_weights_iteration_cpp(graph,\
  \ new_weights, alpha)\n}\nnew_weights\n}\n```\n\n如果我们比较 R 和 C++ 函数，会发现性能有了显著提升：\n\
  \n```\nmicrobenchmark(\nsmooth_weights(g, weights, 0.8, 10),\nsmooth_weights_cpp(g,\
  \ weights, 0.8, 10),\ntimes = 5\n)\nUnit: milliseconds\nexpr\nsmooth_weights(g,\
  \ weights, 0.8, 10)\nsmooth_weights_cpp(g, weights, 0.8, 10)\nmin         lq   \
  \    mean    median\n1561.78635 1570.23346 1629.12784 1572.3979\n32.77344   33.38822\
  \   35.57017   36.5103\nuq        max neval cld\n1694.31571 1746.90573     5   b\n\
  37.29083   37.88803     5  a\n```\n\n将函数转换为 C++ 并不一定意味着你不能使用 R 的高级特性。你可以像从 R 调用\
  \ C++ 函数一样轻松地从 C++ 调用 R 函数。在许多情况下，转换为 C++ 的 R 类型也可以像在 R 中一样用于向量表达式。但请注意，在 C++ 中使用高级特性时，其运行时开销与在\
  \ R 中相同。翻译这类函数可能不会带来显著的性能提升。然而，像循环这样的底层代码的翻译通常能带来可观的性能提升。如果你的代码中有几个性能热点，它们相对简单，但因为工作量大而非常耗时，那么考虑将它们翻译成\
  \ C++ 是值得的，而 `Rcpp` 使这件事变得简单。\n\n不过，不要做得过火。用 C++ 编写的代码更难分析和调试，如果代码混合了 C++ 和 R，重构也会更加困难。请使用它，但只在真正需要时才使用。\n\
  \n### 练习\n\n找一些你写过的代码并尝试对其进行分析。如果能够识别出性能热点，则尝试优化它们。首先考虑算法层面的改动，然后考虑 R 表达式层面的改动——使用\
  \ `microbenchmark()` 进行检查——如果所有方法都失败了，则尝试并行化或在 C++ 中实现。\n\n脚注 1 2\n\n# 项目 2：贝叶斯线性回归\n\
  \n本章的项目是构建一个用于贝叶斯线性回归的 R 包。我们将要使用的模型，对于我们可以想象构建的 R 包来说，有点像是一个玩具示例。我们的目标并不是开发贝叶斯线性回归的所有高级功能。我们只是要构建足够的内容，以了解构建一个真正\
  \ R 包所涉及的各个方面。\n\n\n\n## 贝叶斯线性回归\n\n在线性回归中，我们假设存在预测变量 `x` 和目标变量 `y`，其中 `y = w[0]\
  \ + w[1]*x + ϵ`，且 `ϵ ~ N(0, σ²)`。也就是说，我们有一条截距为 `w[0]`、斜率为 `w[1]` 的直线，目标变量围绕该直线上的点呈正态分布。我们有时将\
  \ `σ²` 记为 `1/β`，并称 `β` 为**精度**。本文将沿用这种记法，并假设 `β` 是已知量；我们将采用贝叶斯方法估计权重 `wᵀ = (w[0],\
  \ w[1])`。\n\n由于我们假设已知精度参数 `β`，那么如果我们知道模型的真实权重，每当获得一个 `x` 值时，就能知道 `y` 值的分布：`y ~ N(w[0]\
  \ + w[1]*x, 1/β)`。\n\n为了符号表示方便，我将定义一个将 `x` 映射为向量的函数：`φ : x ↦ (1, x)ᵀ`。于是有 `wᵀφ(x)\
  \ = w[0] + w[1]*x` 和 `y ~ N(wᵀφ(x), 1/β)`。\n\n当然，我们并不知道权重的真实值，而必须对其进行估计。在贝叶斯方法中，我们不把权重视为固定但未知的值，而是将其视为来自某个我们部分了解的分布的随机变量。学习权重意味着在观察到\
  \ `x` 和 `y` 值的条件下，估计向量 `w` 的后验分布。\n\n我们将假设 `w` 的某个先验分布 `p(w)`。如果观察到一系列匹配的 `x` 和\
  \ `y` 值 `xᵀ = (x[1], x[2], ..., x[n])` 和 `yᵀ = (y[1], y[2], ..., y[n])`，我们希望将这个关于权重\
  \ `w` 的先验分布更新为后验分布 `p(w | x, y)`。\n\n我们将假设 `w` 的先验分布是一个均值为零、对角协方差矩阵具有某个（已知超参数）精度\
  \ `α` 的正态分布，即：\n\n![p(w|α) = N(0, α⁻¹I)](img/439481_2_En_17_Chapter_TeX_Equa.png)\n\
  \n由于本文篇幅所限，我无法在此详细解释原因，但这是线性模型先验的一个良好选择，因为它意味着后验也将是正态分布。同时还意味着，给定 `x` 和 `y`，我们可以通过简单的矩阵运算计算出后验的均值和协方差矩阵。\n\
  \n但首先，我们需要定义模型矩阵。该矩阵用于捕捉我们试图拟合的线性模型是一条直线这一事实，即 `y = w[0] + w[1]*x`。我们为观测向量 `x` 定义模型矩阵如下：\n\
  \n![X = [[1, x1], [1, x2], [1, x3], ..., [1, xn]]](images/439481_2_En_17_Chapter/439481_2_En_17_Chapter_TeX_Equb.png)\n\
  \n通常，每行对应一个观测，包含我们希望纳入模型的各种观测特征；但对于简单的直线，其特征就是斜率和截距，因此对于观测 `i`，其值为 1 和 `x[i]`。\n\
  \n权重 `w` 的后验分布 `p(w | x, y, α, β)` 由下式给出：\n\n![p(w|x, y, α, β) = N(m_xy, S_xy)](img/439481_2_En_17_Chapter_TeX_Equc.png)\n\
  \n其中\n\n![m_xy = β S_xy Xᵀy](img/439481_2_En_17_Chapter_TeX_Equd.png)\n\n且\n\n![S_xy⁻¹\
  \ = αI + β XᵀX](img/439481_2_En_17_Chapter_TeX_Eque.png)\n\n### 练习：先验与后验\n\n####\
  \ 从多元正态分布中抽样\n\n若想从多元正态分布中抽样，可使用 `MASS` 包中的 `mvrnorm` 函数：\n\n```\nlibrary(MASS)\n\
  mvrnorm(n = 5, mu = c(0,0), Sigma = diag(1, nrow = 2))\n##            [,1]     \
  \  [,2]\n## [1,] -0.1664955 -0.4859753\n## [2,] -1.4915224 -1.0527432\n## [3,] -0.2284911\
  \  0.4313458\n## [4,]  0.4177218 -1.1576628\n## [5,] -1.3341254 -0.2136770\n```\n\
  \n你需要为其提供均值向量 `mu` 和协方差矩阵 `Sigma`。\n\n我们权重向量的先验分布是 `N(0, S₀)`，其中\n\n![0 = (0, 0)ᵀ](img/439481_2_En_17_Chapter_TeX_Equf.png)\n\
  \n且\n\n![S₀ = (1/α)I = [[1/α, 0], [0, 1/α]]](images/439481_2_En_17_Chapter/439481_2_En_17_Chapter_TeX_Equg.png)\n\
  \n你可以使用 `diag` 函数来创建对角协方差矩阵。\n\n请编写一个函数 `make_prior(alpha)` 来构造该先验分布，以及另一个函数 `sample_from_prior(n,\
  \ alpha)`，用于从中抽取 `n` 个权重向量 `w_i`。我的实现将样本返回为一个数据框，其中包含一列 `w[1]` 样本和另一列对应的 `w[0]`\
  \ 样本。你可以按任何方便的形式返回样本。\n\n如果你能从前验分布中抽样，就可以绘制结果图，既可以在 `w` 空间中作为点显示，也可以在 `(x, y)` 空间中作为直线显示（点\
  \ `(w[0], w[1])` 描述了直线 `y = w[0] + w[1]*x`）。从先验中抽取的样本及两种不同的可视化方式，请参见图 17-1 和图 17-2。\n\
  \n\n\n#### 计算后验分布\n\n如果我们固定模型参数 **β** 和 `w = (w[0], w[1])^T`，就可以模拟 `(x, y)` 的值。我们可以先选取一些随机的\
  \ `x` 值，然后模拟出相应的 `y` 值；参见图 17-3，其中红线是已知的直线（由 `(w[0], w[1])` 给出），黑点是给定模型后随机采样的点。\n\
  \n```\nw0 <- 0.3 ; w1 <- 1.1 ; beta <- 1.3\nx <- rnorm(50)\ny <- rnorm(50, w1 *\
  \ x + w0, 1/beta)\n```\n\n当然，在这种情境下我们并不知道真实的直线。我们拥有的是权重的先验分布 `(w[0], w[1])` 以及观测到的\
  \ `(x, y)` 值。将这种情况想象为图 17-3 但去掉红线。不过，如果有了这些点以及先验信息，我们就掌握了关于潜在直线可能形态的信息，这些信息以权重的后验分布形式呈现——即给定观测点后权重所服从的分布。当我们的先验和模型都假设数据点服从正态分布时，后验分布会变得特别简单，正如我们之前所见。我们可以通过之前见过的公式来得到后验分布。\n\
  \n编写一个函数 `make_posterior(x, y, alpha, beta)`，用于计算权重的后验分布（均值和协方差矩阵），以及一个函数 `sample_from_posterior`，用于从后验分布中进行采样。\n\
  \n![](img/439481_2_En_17_Fig3_HTML.png)\n\n图 17-3：随机采样的 `(x, y)` 值。真实的线性模型以红色显示。\n\
  \n![](img/439481_2_En_17_Fig2_HTML.png)\n\n图 17-2：从先验分布中采样的权重向量，以直线的形式表示。\n\n![](img/439481_2_En_17_Fig1_HTML.png)\n\
  \n图 17-1：从先验分布中采样的权重向量。\n\n如果我们再次假设能够从 `(x, y)` 点的真实分布中采样，那么每次获得一批点时，我们都可以更新后验知识。当然，在现实世界中，我们并没有真实的分布来进行这种采样，但已有的观测数据代表了这些数据点，因此我们仍然可以在每次获得新信息时更新后验分布。\n\
  \n假设我们已经观测到 `n` 个点，即 `(x[1], y[1]), (x[2], y[2]), ..., (x[n], y[n])`，那么我们可以问自己：现在的后验分布与真实直线有多接近？当然，我们的后验分布并不是一条直线（也不是权重空间中的一个点），而是一个分布。因此，一种方法是：从后验分布中采样，观察这些样本聚集的紧密程度——这告诉我们对于真实值的确定程度——以及它们围绕真实点（如果已知的话）聚集的紧密程度。\n\
  \n在图 17-4 中，你可以看到一个示例。真实直线，即采样数据点所依据的 `(w[0], w[1])`，以红色显示。黑点是用于更新后验分布的 `(x, y)`\
  \ 点，灰色线条则是从更新后的后验分布中采样的样本。如你所见，用于推断后验分布的 `(x, y)` 点越多，分布就越倾向于聚集在真实点周围。\n\n### 对新预测值的目标变量进行预测\n\
  \n给定一个新的 `x` 值，我们希望预测对应的 `y` 值。对于固定的 `w`，同样有 `p(y | x, w, β) = N(w^T ϕ(x), 1/β)`，但由于我们不知道\
  \ `w`，因此必须对所有 `w` 进行积分。训练数据改善预测的方式在于，我们不是基于先验分布对 `w` 进行加权积分，而是基于 `w` 的后验分布进行加权积分：\n\
  \n![$$ p\\left(y|x,\\mathrm{x},y,\\alpha, \\beta \\right)=\\int p\\left(y|x,\\mathrm{w},\\\
  beta \\right)p\\left(\\mathrm{w}|\\mathrm{x},\\mathrm{y},\\alpha, \\beta \\right)\
  \ dw. $$](img/439481_2_En_17_Chapter_TeX_Equh.png)\n\n这种对两个正态分布乘积的积分会得到另一个正态分布，并且可以证明它等于：\n\
  \n![$$ p\\left(y|x,\\mathrm{x},\\mathrm{y},\\alpha, \\beta \\right)=\\mathrm{N}\\\
  left({\\mathrm{m}}_{\\mathrm{x},\\mathrm{y}}^T\\phi (x),{\\sigma}_{\\mathrm{x},\\\
  mathrm{y}}²(x)\\right) $$](img/439481_2_En_17_Chapter_TeX_Equi.png)\n\n其中 `m[x,\
  \ y]` 是 `w` 的后验分布的均值，并且：\n\n![$$ {\\sigma}_{\\mathrm{x},\\mathrm{y}}²(x)=\\frac{1}{\\\
  beta }+\\phi {(x)}^T{\\mathrm{S}}_{\\mathrm{x},\\mathrm{y}}\\phi (x) $$](img/439481_2_En_17_Chapter_TeX_Equj.png)\n\
  \n![](img/439481_2_En_17_Fig4_HTML.png)\n\n图 17-4：从后验分布中抽取的直线。真实直线以红色显示。\n\n其中 `S[x,\
  \ y]` 是 `w` 的后验分布的协方差矩阵。\n\n有了目标值 `y` 在给定预测值 `x` 条件下的完整分布，我们当然可以进行预测。`y` 的点预测值自然是这个正态分布的均值，即\
  \ `m[x, y]^T ϕ(x)`。但我们能做的不仅仅是预测最可能的值；由于知道分布，我们当然还可以得到置信区间的值。\n\n编写一个函数，用于预测给定 `x`\
  \ 值下最可能的 `y` 值。使用该函数将推断出的模型绘制在 `(x, y)` 点上。示例见图 17-5。\n\n利用你也拥有 `y` 的预测分布这一事实，编写一个函数，用于给出该分布的分位数，并利用它绘制预测值周围\
  \ 95% 的置信区间；参见图 17-6。\n\n\n\n## 公式与模型矩阵\n\n我们将继续使用贝叶斯线性回归，并推广可拟合的公式类型。\n\n回顾第 6\
  \ 章内容，在将模型拟合到数据时，我们通过所谓的模型矩阵（或设计矩阵）来实现，其形式如下：\n\n![$$ \\mathrm{x}=\\left[\\begin{array}{l}\\\
  begin{array}{cc}1&amp; {x}_1\\\\ {}1&amp; {x}_2\\end{array}\\\\ {}1\\kern0.5em {x}_3\\\
  \\ {}\\begin{array}{cc}\\vdots &amp; \\vdots \\end{array}\\\\ {}\\begin{array}{cc}1&amp;\
  \ {x}_n\\end{array}\\end{array}\\right]. $$](images/439481_2_En_17_Chapter/439481_2_En_17_Chapter_TeX_Equk.png)\n\
  \n该矩阵的第 *i* 行包含向量 `(1, x[i]) = φ(x[i])^T`，用于捕获第 *i* 个观测值 `xi` 的预测变量。实际上它包含两个预测变量：其中一个为常量\
  \ 1。该向量捕获的是我们在线性模型中用于预测目标的输入变量。一个变量是 `x` 值，另一个是编码 y 轴截距的方式。\n\n![](img/439481_2_En_17_Fig6_HTML.png)\n\
  \n图 17-6 — 含 95% 支持区间的预测结果\n\n![](img/439481_2_En_17_Fig5_HTML.png)\n\n图 17-5 —\
  \ 红色为真实线性模型，蓝色为预测值\n\n为了预测目标，我们使用该行与拟合模型权重的内积：\n\n![$$ {y}_i={\\mathrm{w}}^T\\phi\
  \ \\left({x}_i\\right)+\\epsilon ={w}_0\\cdot 1+{w}_1\\cdot {x}_i+\\epsilon . $$](img/439481_2_En_17_Chapter_TeX_Equl.png)\n\
  \n我们将 `φ(x)` 称为点 `x` 的特征向量，模型矩阵的每一行对应一个要拟合或预测的数据点，因此第 *i* 行即为 `φ(x[i])^T`。采用我们此处使用的特征向量形式\
  \ `φ(x)^T = (1, x)` 时，拟合的是一条直线，但特征向量并非必须保持这种形式。我们可以构造更复杂的特征向量。\n\n如果我们改用特征向量 `φ(x)^T\
  \ = (1, x, x²)`，并在 `w` 中添加一个权重使其变为三维 `(w[0], w[1], w[2])`，则仍可通过相同方式预测目标 `y = w^T\
  \ φ(x[i]) + ε`。只不过此时 `w^T φ(x[i]) = w[0] + w[1]*x + w[2]*x²`，因此拟合的将是一个二次多项式。\n\n\
  如果你现在想“嘿，这不再是线性模型了！”，那你就错了。模型的线性实际上与 `x` 的线性无关。是 `w` 的线性使得模型成为线性模型，只要我们通过权重向量与某个特征向量的内积来获得预测值，那么所处理的就仍然是线性模型。你可以随心所欲地设计特征向量\
  \ `φ(x)`。\n\n若以相同方式构建模型矩阵\n\n![$$ \\mathrm{x}=\\left[\\begin{array}{c}\\phi {\\\
  left({x}_1\\right)}^T\\\\ {}\\phi {\\left({x}_2\\right)}^T\\\\ {}\\phi {\\left({x}_3\\\
  right)}^T\\\\ {}\\begin{array}{c}\\vdots \\\\ {}\\phi {\\left({x}_n\\right)}^T\\\
  end{array}\\end{array}\\right] $$](images/439481_2_En_17_Chapter/439481_2_En_17_Chapter_TeX_Equm.png)\n\
  \n那么用于拟合权重和预测新目标值的数学方法相同，只不过权重向量 `w` 的维度需与特征向量的维度保持一致。\n\n此外，特征向量也不必是单一变量 `x` 的函数。如果你想拟合包含两个变量的线性模型，即一个平面，只需让特征向量依赖于两个变量：`φ(x,\
  \ z)^T = (1, x, z)`。与权重向量的线性组合即为 `w^T φ(x, z) = w[0] + w[1]*x + w[2]*z`，这恰恰是一个包含两个变量的线性模型。\n\
  \n\n\n### 在 R 中使用模型矩阵\n\n在 R 中，指定特征向量和模型矩阵的方式是使用公式。公式是一个包含波浪符号`~`的表达式，目标变量应放在左侧，解释变量放在右侧。\n\
  \nR 用于指定公式的语法相当丰富，如果你感兴趣，可以在 R 终端中输入以下命令来阅读文档：\n\n```\n?formula\n```\n\n对于线性模型，我们会写成`y\
  \ ~ x`。截距项是隐式存在的；你不需要告诉 R 你想要特征向量包含截距，相反，如果你不想要截距，需要显式地将其移除。你也可以指定多项式特征向量，但 R 会将乘法`*`解释为变量间的交互作用。要指定`x`的二次多项式，你需要写成`y\
  \ ~ I(x²) + x`。函数`I`是恒等函数，在这里使用它可以让 R 将`x²`解释为对数值`x`进行平方运算，而不是试图将其解释为公式规范的一部分。如果你只想拟合`x`的平方项，可以写成`y\
  \ ~ I(x²)`。对于一般的 *n* 次多项式，你可以使用`y ~ poly(x,n, raw=TRUE)`。\n\n为了拟合我们的线性模型，我们需要两类数据。在我们已经实现的模型中，我们使用了向量`x`和`y`，但在一般情况下，预测变量`x`应被替换为模型矩阵。根据这个矩阵和`y`，我们就可以拟合模型。\n\
  \nR 提供了从公式和数据中获取这两类数据的函数。不过，由于作用域规则，这并非完全直接。如果你在代码的某处编写了一个公式，你希望公式中的变量引用的是当前作用域中的变量，而不是其他地方可能查看该公式的变量。因此，公式需要捕获当前作用域——类似于闭包捕获其周围作用域的方式。另一方面，你也希望能够通过数据框直接将数据提供给模型。通常，你想要拟合的数据是作为数据框中的列存在的，而不是作为作用域中的独立变量。有时，甚至是两者的混合。\n\
  \n函数`model.frame`可以让你捕获所需内容，以收集与公式相关的数据。它会知道公式的作用域，但你也可以通过数据框添加数据。可以把它看作一个`data.frame`，只是它包含了更多通过分析公式而获得的关于数据的信息。\n\
  \n我们可以在下面这个小例子中看到这一切是如何运作的：\n\n```\npredictors <- data.frame(x = rnorm(5), z = rnorm(5))\n\
  y <- with(predictors, rnorm(5, mean = 3*x + 5*z + 2))\nmodel <- y ~ x + z\nmodel.frame(model,\
  \ data = predictors)\n##            y          x           z\n## 1  5.7166648  1.2943469\
  \  0.07347801\n## 2 -7.3801586  0.7210624 -2.12012399\n## 3  0.4894598 -0.6444302\
  \  0.15265587\n## 4  5.5552442  1.6107988  0.01996477\n## 5  7.8151347  0.2048122\
  \  0.98655386\n```\n\n这里，我们在一个数据框中有两个预测变量`x`和`z`，并在全局作用域中模拟了响应变量`y`。我们使用公式`y ~ x\
  \ + z`（这意味着 *ϕ*(`x`, `z`)^(T) = (1, `x`, `z`)）创建模型，并据此构建一个模型框架，其中包含公式中所有使用的变量的数据。\n\
  \n模型框架的创建方式是：R 首先在它接收到的数据框中查找变量，如果找到，则使用该数据；如果未找到，则使用它在公式作用域中找到的数据。如果完全找不到，当然会报告错误。\n\
  \n数据框还用于从变量构造表达式。在作用域中，你可能拥有变量`x`，但没有构建模型矩阵所需的`x`²。`model.frame`函数会为你构造它：\n\n```\n\
  x <- runif(10)\nmodel.frame(~ x + I(x²))\n##            x       I(x²)\n## 1  0.9257926\
  \ 0.857091....\n## 2  0.2048174 0.041950....\n## 3  0.3320932 0.110285....\n## 4\
  \  0.5124721 0.262627....\n## 5  0.4848565 0.235085....\n## 6  0.1284884 0.016509....\n\
  ## 7  0.9344755 0.873244....\n## 8  0.8077187 0.652409....\n## 9  0.7667746 0.587943....\n\
  ## 10 0.9961101 0.992235....\n```\n\n在这个例子中，我们的公式没有响应变量；你并不一定需要它。当然，为了能够提取向量`y`，我们需要它来进行线性模型拟合，但\
  \ R 并不一定需要它。\n\n一旦你有了模型框架，就可以使用函数`model.matrix`获取模型矩阵。它需要知道公式和模型框架（前者是为了知道特征函数 *ϕ*，后者是为了知道我们正在拟合的数据）。\n\
  \n接下来，我们构建两个模型，一个拟合经过 *y* = 0 的直线，另一个允许直线与 *y* 轴相交于任意点。\n\n注意两个模型的数据框是相同的——两个模型中使用的变量相同——但模型矩阵不同：\n\
  \n```\nx <- runif(10)\ny <- rnorm(10, mean=x)\nmodel.no.intercept <- y ~ x + 0\n\
  (frame.no.intercept <- model.frame (model.no.intercept))\n##              y    \
  \     x\n## 1   0.05218288 0.7020026\n## 2   0.78985212 0.2376200\n## 3  -0.81501744\
  \ 0.4099537\n## 4  -0.71807916 0.5834204\n## 5   0.40083214 0.5577035\n## 6  -0.82443129\
  \ 0.2163221\n## 7  -0.98024996 0.1702824\n## 8  -0.47115407 0.3512283\n## 9   0.35959763\
  \ 0.2272345\n## 10 -0.47588279 0.9553629\nmodel.matrix(model.no.intercept, frame.no.intercept)\n\
  ##            x\n## 1  0.7020026\n## 2  0.2376200\n## 3  0.4099537\n## 4  0.5834204\n\
  ## 5  0.5577035\n## 6  0.2163221\n## 7  0.1702824\n## 8  0.3512283\n## 9  0.2272345\n\
  ## 10 0.9553629\n## attr(,\"assign\")\n## [1] 1\nmodel.with.intercept <- y ~ x\n\
  (frame.with.intercept <- model.frame (model.with.intercept))\n##              y\
  \         x\n## 1   0.05218288 0.7020026\n## 2   0.78985212 0.2376200\n## 3  -0.81501744\
  \ 0.4099537\n## 4  -0.71807916 0.5834204\n## 5   0.40083214 0.5577035\n## 6  -0.82443129\
  \ 0.2163221\n## 7  -0.98024996 0.1702824\n## 8  -0.47115407 0.3512283\n## 9   0.35959763\
  \ 0.2272345\n## 10 -0.47588279 0.9553629\nmodel.matrix(model.with.intercept, frame.with.intercept)\n\
  ##    (Intercept)         x\n## 1            1 0.7020026\n## 2            1 0.2376200\n\
  ## 3            1 0.4099537\n## 4            1 0.5834204\n## 5            1 0.5577035\n\
  ## 6            1 0.2163221\n## 7            1 0.1702824\n## 8            1 0.3512283\n\
  ## 9            1 0.2272345\n## 10           1 0.9553629\n## attr(,\"assign\")\n\
  ## [1] 0 1\n```\n\n目标向量，即响应变量`y`，也可以从数据框中提取。这次不需要公式，因为数据框记住了哪个变量是响应变量。你可以使用函数`model.response`从模型框架中获取它：\n\
  \n```\nmodel.response(frame.with.intercept)\n##          1           2         \
  \  3           4\n## 0.05218288  0.78985212 -0.81501744 -0.71807916\n##        \
  \  5           6           7           8\n## 0.40083214 -0.82443129 -0.98024996\
  \ -0.47115407\n##          9          10\n## 0.35959763 -0.47588279\n```\n\n###\
  \ 练习\n\n#### 构建模型矩阵\n\n构建一个函数，该函数以公式为输入，并通过`...`变量可选地接收一个数据框，然后根据公式和可选数据构建模型矩阵。\n\
  \n#### 拟合通用模型\n\n扩展你之前编写的用于拟合直线的函数，使其成为可以拟合任何公式的函数。\n\n\n\n### 不含响应变量的模型矩阵\n\n当您拥有模型框架所需的所有变量时，以这种方式构建模型矩阵是很好的，但如果您没有目标值呢？当然，您需要目标值来拟合模型的参数，但稍后，您想要为那些不知道目标值的新数据点预测目标值，那么此时如何构建模型矩阵呢？\n\
  \n使用一些明显是伪造的数据，这种情况可能如下所示：\n\n```\ntraining.data <- data.frame(x = runif(5), y =\
  \ runif(5))\nframe <- model.frame(y ~ x, training.data)\nmodel.matrix(y ~ x, frame)\n\
  ##   (Intercept)         x\n## 1           1 0.1935202\n## 2           1 0.4235126\n\
  ## 3           1 0.8715640\n## 4           1 0.0687407\n## 5           1 0.7034587\n\
  ## attr(,\"assign\")\n## [1] 0 1\npredict.data <- data.frame(x = runif(5))\n```\n\
  \n但现在，如果我们想为预测数据构建一个框架：\n\n```\nframe <- model.frame(y ~ x, predict.data)\n```\n\
  \n我们会得到一个错误。公式告诉 `model.frame` 它需要变量 `y`，但 `predict.data` 没有这个变量；它只有 `x`。因此，去掉公式中的响应部分：\n\
  \n```\nframe <- model.frame(~ x, predict.data)\nmodel.matrix(~ x, frame)\n##   (Intercept)\
  \         x\n## 1           1 0.5181431\n## 2           1 0.6967051\n## 3      \
  \     1 0.4965555\n## 4           1 0.0729577\n## 5           1 0.7235315\n## attr(,\"\
  assign\")\n## [1] 0 1\n```\n\n如果你不知道公式，当它作为你模型的输入时，这就不那么容易了。你不能简单地将一个未知的公式替换为另一个可能与原公式无关的公式。不过，你可以使用\
  \ `delete.response` 函数从任何公式中移除响应变量。\n\n你不能直接在公式上调用 `delete.response`；那不是它处理的对象类型。但你可以将其与\
  \ `terms` 函数结合使用，以获取一个不含响应变量的公式，然后你就能用它为那些不知道目标值的数据构建模型矩阵：\n\n```\n"
- '# 假设这是一个你不知道的参数

  unknown <- y ~ x

  '
- '# 获取不含响应变量的公式

  responseless_formula <- delete.response(terms(unknown))

  '
- '# 然后你可以将其与 model.frame 一起使用

  frame <- model.frame(responseless_formula, predict.data) model.matrix(responseless_formula,
  frame)

  ##   (Intercept)         x

  ## 1           1 0.5181431

  ## 2           1 0.6967051

  ## 3           1 0.4965555

  ## 4           1 0.0729577

  ## 5           1 0.7235315

  ## attr(,"assign")

  ## [1] 0 1

  ```


  ### 练习


  #### 为新数据构建模型矩阵


  编写一个函数，该函数接收一个公式和一个不含响应变量的数据框作为输入，并为其构建模型矩阵。


  #### 预测新目标值


  更新你之前编写的用于预测新变量值的函数，使其能够处理基于通用公式拟合的模型。如果该函数尚不支持，你还应将其扩展，以便能够处理多个这样的数据点。将新数据点的输入格式设为数据框。


  ## `blm` 类的接口


  到目前为止，我们已经实现了贝叶斯线性回归，但未必是以一种易于复用的形式。将拟合模型相关的数据封装到一个类中，并提供各种访问方法，这才是使模型/类易于复用的关键。


  通常，你应该尽可能通过函数来访问对象。如果你知道该类有哪些 `$fields`，编写直接访问这些字段的代码很容易，但这会使以后更改类的实现变得困难。许多基于对象外观假设编写的代码将会崩溃。同样，在后续分析中更改模型/类也会变得困难，因为不同类的内部结构通常不相同。


  为了让他人——以及未来的你——更容易使用贝叶斯线性回归模型，我们将为其创建一个类，并提供用于处理它的函数。


  这涉及编写特定于你自己类的函数，以及编写人们通常期望一个拟合模型能够实现的多态函数。正是后者使得用你的 `blm` 类替换其他拟合模型成为可能。


  如何设计你的类并实现函数——以及通常选择实现哪些函数——取决于你自己，当然，当你为已有的多态函数实现 `blm` 特定版本时，你需要遵守已有的接口。


  如何选择表示类的对象以及为其实现哪些函数，通常由你决定。不过，R 中有一个通用约定，即通过调用与类同名的函数来创建给定类的对象。因此，我建议你编写一个名为 `blm`
  的构造函数。


  目前没有什么明显的类可以继承，所以 `blm` 对象的类应该只是 `"blm"`，而不是一个类向量。如果你想在实现中创建类层次结构，或者实现多个类来处理模型接口的不同方面，你可以尽情发挥。


  ### 构造函数


  我们将创建某个类对象的函数称为构造函数。在某些编程语言中，创建对象和初始化对象是有区别的。这主要在你需要担心内存管理等问题时才有意义，并且可能变得相当复杂，但我们不为此在
  R 中操心。然而，这就是为什么在 Python 中构造函数被称为 `init`——它实际上处理的是初始化。Java 也是如此——它强制执行构造函数必须与类同名的规则，而在
  R 中这只是约定。在 Java 中，你有创建新对象的特殊语法：`new ClassName()`。在 Python 中，你必须使用类的名称来创建对象——`ClassName()`——但语法看起来就像函数调用。在
  R 中，这只是一个约定，即类名和构造函数应该相同。创建对象的语法看起来像函数调用，因为它就是一个函数调用，并且在该函数内部除了返回一个我们设置了类属性的对象外，没有发生任何特殊的事情。


  因此，你应该编写一个名为 `blm` 的函数，该函数返回一个你已将其类属性设置为 `"blm"` 的对象。你可以使用 `` `class<-` `` 替换函数或
  `structure` 函数在创建对象时进行设置。该对象是一个列表——毕竟，这是你存储复杂数据的唯一方式——列表里放什么取决于你为类的接口所实现的函数需要什么。在开发函数接口的过程中，你可能需要不时地回头更改对象中存储的数据。这没问题。不过，请尽量使用函数来访问对象的内部结构，因为这样做往往能最大限度地减少你在更改对象中存储的数据时需要重写的代码量。




  ### 更新分布：一个示例接口


  我们来探讨一个案例，它可能成为贝叶斯线性模型的接口。这不是你必须要实现的内容，但作为练习值得一试。


  在贝叶斯统计中，当我们拟合模型时，所做的是获取模型参数的先验分布 *P*(*θ*)，并在观测到数据 *D* 后，将其更新为后验分布 *P*(*θ* | *D*)。可以这样理解：先验分布是我们对参数的已知信息。通常我们只是基于数学上的便利性来设定先验分布，但你应该将其理解为，根据我们对宇宙运行方式的理解以及以往经验所积累的知识，所持有的参数分布信息。随后，当你观测到更多信息时，你为世界增添了新的信息，这改变了根据已获得的观测值来看待参数的条件概率。


  我们这里所说的先验和后验其实并没有什么神奇之处。两者都只是我们模型参数的分布。如果先验是基于以往经验的，那么它实际上就是那些经验的后验分布。只是我们没有以这种方式进行建模而已。


  假设我们观测到了数据 *D*[1] 并得到了后验分布 *P*(*θ* | *D*[1])。如果之后我们又观测到了更多数据 *D*[2]，我们就获得了关于参数的更多信息，并可以将参数的分布更新为
  *P*(*θ* | *D*[1], *D*[2])。


  当然，我们总是可以通过将所有旧数据和新数据放入拟合代码中来计算这个分布。但是，如果我们针对模型似然函数仔细选择了先验分布——并且我说“仔细”是指我们使用了所谓的共轭先验——那么我们就可以仅通过使用不同的先验（即旧的后验分布）来拟合新数据。


  共轭先验是这样一种先验分布：它被选择为保证先验和后验属于同一类分布（仅参数不同）。在我们贝叶斯线性模型中，先验和后验都是正态分布，所以我们就有了共轭先验。这意味着，原则上，我们只需要使用相同的拟合代码，但采用不同的先验，就可以用更多的观测值来更新我们拟合好的模型。


  在之前的练习中我曾暗示过这一点，但现在你可以更正式地处理它了。你需要一种表示多元正态分布的方法——但无论如何，你在表示 `blm` 对象时都需要它——以及一种在
  `blm` 对象内部获取已拟合结果以提取后验分布的方法。


  实现此功能的方法有很多种，你可以有试验的余地。您可以编写一个 `update` 函数，它以先验分布和新观测值作为参数，并输出（更新后的）后验分布。在这里，你需要以某种方式同时包含公式以构建模型矩阵。或者，你也可以让
  `update` 函数接受一个已拟合的对象和新的数据，并从该已拟合对象中获取公式和先验分布。当然，如果你这样做，你需要将没有任何观测值的先验分布作为特殊情况处理——并且那个先验分布将不知道任何关于公式或模型矩阵的信息。


  我们可以尝试类似这样的接口：


  ```

  update <- function(model, data, prior) { ... }

  ```


  其中 `model` 是公式，`data` 是新的数据集，`prior` 是用于拟合的先验分布。这大致就是构造函数的接口，区别仅在于构造函数中不一定有显式的 `data`
  参数（毕竟，你希望能够在没有数据框的情况下拟合模型），而且它根本没有 `prior` 这个参数。


  稍作思考后，意识到我们在此处放入的任何模型拟合代码都将与 `blm` 中的完全相同，因此我们可以修改接口以去掉显式的 `data` 参数。如果我们让该参数通过
  `...` 传递，我们就可以使用与 `blm` 中完全相同的代码（并随后通过在该处调用 `update` 来移除 `blm` 中的重复代码）：


  ```

  update <- function(model, prior, ...) { ... }

  blm <- function(model, ...) {

  '
- '# 一些代码...

  prior <- make_a_prior_distribution_somehow()

  posterior <- update(model, prior, ...)

  '
- '# 一些用于返回对象的代码...

  }

  ```


  为了让这个版本的 `blm` 正常工作，你需要将先验分布转换成可以传递给 `update` 的形式，但如果你完成了之前的练习，你应该已经有一个能完成此任务的函数了（尽管你可能希望为这些分布创建一个类，并以此形式返回它们，以便通过接口进行操作，如果你想更进一步的话）。


  当然，除了去掉 `blm` 主体中的模型拟合代码外，你也可以去掉 `update` 函数，将其功能放入 `blm` 中，只需让 `blm` 函数接受一个先验参数。但如果这样做，你需要为其提供一个默认值，以便在未指定先验时使用原来的那个：


  ```

  blm <- function(model, prior = NULL, ...) {

  '
- '# 一些代码...

  if (is.null(prior)) {

  prior <- make_a_prior_distribution_somehow()

  }

  posterior <- update(model, prior, ...)

  '
- '# 一些用于返回对象的代码...

  }

  ```


  不过，我们还是暂时保留 `update` 函数。那么，我们该如何将 `update` 与一个已经拟合好的模型一起使用呢？


  ```

  fit1 <- blm(y ~ x)

  fit2 <- update(y ~ x, new_data, fit1)

  ```


  这样是行不通的，因为 `fit1` 是一个 `blm` 对象，而不是一个正态分布。你需要从已拟合模型中提取出这个分布。


  如果你在对象中存储了这个分布——并且你应该这样做，因为否则你就无法使用该对象做任何事，因为拟合结果就是后验分布——那么你应该能够获取到它。然而，你不应该像 `fit1$posterior`
  那样直接从对象内部访问后验分布。这样做虽然可行，但访问对象内部结构会使后续更改表示方式变得更加困难。我知道我在这里重复了，但值得再强调一遍。你应该尽量避免访问对象的内部结构，除非必要，因为这会使更改表示方式变得更加困难。


  相反，编写一个 `posterior` 函数来提供后验分布：


  ```

  posterior <- function(fit) fit$posterior

  ```


  这个函数最终必须访问内部结构——毕竟，你终究需要获取信息——但如果只有这一个函数这样做，并且所有其他函数都使用这个函数，那么当你改变对象的表示方式时，只需要修改这一个函数。


  有了这个函数，你就可以这样做：


  ```

  fit2 <- update(y ~ x, new_data, posterior(fit1))

  ```


  你也可以编写 `update` 函数，使其既能接受已拟合模型，也能接受分布作为输入。这样你就只需要一种方法来获取先验对象（可能是分布，也可能是已拟合模型的后验分布），并且该方法需要能同时处理这两种情况。


  一种方法是直接测试先验参数的类：


  ```

  update <- function(model, prior, ...) {

  if (class(prior) == "blm") {

  prior <- posterior(prior)

  }

  '
- '# 拟合代码在这里

  }

  ```


  然而，由于种种原因，这是一个糟糕的解决方案。首先，它只在你得到的要么是先验分布，要么是类为 `"blm"` 的对象时才能工作。如果以后有人编写了一个继承 `blm`
  的类呢？他们的 `class` 属性可能是 `c("myblm","blm")`，这与 `"blm"` 不同，因此这个测试会失败——并且后续代码也会失败，因为后续代码假设你拥有一个分布，但你实际拥有的是一个完全不同类的对象。


  为了解决这个问题，你可以使用 `inherits` 函数。它会测试给定的类名是否存在于 class 属性中，因此如果有人给你的 `update` 函数传递了一个继承你
  `blm` 类的类，它就能正常工作：


  ```

  update <- function(model, prior, ...) {

  if (inherits(prior, "blm")) {

  prior <- posterior(prior)

  }

  '
- "# 拟合代码在这里\n}\n```\n\n\n\n这是一个不错的解决方案——在面向对象代码中你会经常看到它——但它仍然有一些缺点。它假设唯一能提供可用作先验分布的对象要么是你默认实现先验的方式（并且你之前没有测试过），要么是`\"\
  blm\"`类的对象（或其特化）。\n\n当然，你可以测试先验（如果不是拟合对象）是否属于你为分布定义的类，这样可以解决第一个问题，但如何处理其他可能也能提供先验/后验分布的对象呢？\n\
  \n每当你编写这样一个可以提供分布的新类时，你都可以更新你的`update`函数，但其他人无法通过这种方式为你提供分布（除非他们修改你的代码）。以这种方式显式测试对象类型并不是良好的代码设计。解决这个问题的方法与访问对象内部成员相同：通过函数来访问。\n\
  \n如果我们要求任何作为`prior`参数传递给`update`的对象，在需要时都能提供分布，我们可以将代码更新为：\n\n```\nupdate <- function(model,\
  \ prior, ...) {\n  prior <- posterior(prior)\n  # fitting code here\n}\n```\n\n\
  这要求我们为`posterior`创建一个多态函数，并且可能需要为分布对象也编写一个版本。这里我走个捷径，将默认实现设为恒等函数：\n\n```\nposterior\
  \ <- function(x) UseMethod(\"posterior\")\nposterior.default <- function(x) x\n\
  posterior.blm <- function(x) x$posterior\n```\n\n唯一的烦恼是现在函数名为`posterior`。当对象是拟合结果时，它是后验分布；但在其他情况下并非如此。让我们把它改为`distribution`：\n\
  \n```\ndistribution <- function(x) UseMethod(\"distribution\")\ndistribution.default\
  \ <- function(x) x\ndistribution.blm <- function(x) x$posterior\n```\n\n然后相应地更新`update`：\n\
  \n```\nupdate <- function(model, prior, ...) {\n  prior <- distribution(prior)\n\
  \  # fitting code here\n}\n```\n\n这样，在`update`函数中看起来也更优雅了。\n\n### 设计你的`blm`类\n\n\
  当你着手实现`blm`类时，请思考你正在创建的接口，各个函数如何相互配合，以及你认为其他人将如何复用你的模型。请记住，“未来的你”也是“其他人”，所以这样做也是在帮助你自己。\n\
  \n我们之前开发的`update`函数是类设计中功能示例的一部分，它展示我们如何使其可复用。你应该考虑其他用于访问对象的函数，并设计它们。\n\n例如，提取给定输入点的分布。你已经实现了从预测变量预测响应变量的函数，稍后你还会在`predict`函数中再次实现它。但如果你想充分利用给定输入下响应变量分布的优势，你需要拥有这个分布。你将如何向用户提供这一功能？你又如何在自有函数中使用这一功能？\n\
  \n在开发你的类时，多尝试。每当你修改某些东西时，思考这是否能让其他函数更简单，或者能否将功能泛化，从而使代码更具复用性。\n\n### 模型方法\n\n有一些多态函数通常由代表拟合模型的类提供。并非所有模型都实现了全部函数，但你实现得越多，现有代码就越能操作你的新类——这再次说明了仅通过函数提供对象接口的重要性。\n\
  \n下面是我认为你的`blm`类应当实现的一系列函数。这些函数按字母顺序排列，但其中许多可以通过使用一个或多个其他函数来更简单地实现。因此，在开始编程之前，请通读整个列表。如果你认为某个函数可以通过调用其他函数更简单地实现，那么就按这种方式实现。\n\
  \n在所有情况下，请先阅读泛型函数的 R 文档。你无论如何都需要文档来正确实现每个函数的接口，所以至少通读一遍。本文中的描述只是这些函数功能的概述。\n\n####\
  \ `coefficients`\n\n该函数应返回模型的拟合参数。对于我们的贝叶斯模型（其中拟合模型是一个分布，而非单个点参数）来说，解释这一函数的含义并不完全直接。我们可以让它返回拟合分布，但按照该函数的典型用法，这样做会使它对现有代码毫无用处。现有代码期望通过此函数获取拟合模型的参数，因此更好的做法是返回参数的点估计值，即计算后验分布时的均值。\n\
  \n返回一个数值向量，参数带有名称，这与`lm`返回的结果一致。\n\n#### `confint`\n\n`confint`函数给出拟合参数的置信区间。这里我们遇到与`coefficients`相同的问题：我们推断的是整个分布，而非单个参数（而且，我们的参数没有置信区间，它们有一个联合分布）。尽管如此，我们可以从推断出的分布中计算对应的置信区间。\n\
  \n如果我们的后验分布是`w ~ N(m, S)`，那么权重向量中的第`i`个分量的分布为`w[i] ~ N(m[i], S[i,i])`。由此，结合你期望的密度比例，你可以提取出与所需分位数匹配的阈值。\n\
  \n你接受函数的`level`参数，并通过利用正态分布的对称性获取阈值分位数。因此，你需要的分位数为`c(level/2, 1 - level/2)`。据此，你可以使用`qnorm`函数获得阈值。\n\
  \n#### `deviance`\n\n该函数计算预测响应变量与观测值之间的平方距离之和。如果你能获得平方距离，或者即使你只有距离值而需要自行平方，计算起来应该很容易。也许已经有现成的函数可以提供这些值？\n\
  \n#### `fitted`\n\n该函数应返回拟合的响应变量。这并非你拟合模型时所用数据中的响应变量，而是模型做出的预测值。\n\n#### `plot`\n\
  \n该函数用于绘制模型图。你可以自由决定如何绘制，但我认为一个有用的方式是展示带有拟合线的 x-y 散点图。不过，如果存在多个预测变量，我不确定什么是可视化拟合模型的好方法。除了“绘制某些图形”之外，对于`plot`函数的功能没有明确规则，因此你可以发挥想象力。\n\
  \n#### `predict`\n\n该函数应基于拟合的模型进行预测。其接口为：\n\n```\npredict(object, ...)\n```\n\n\
  但惯例是你在`newdata`变量中提供新数据。如果你不提供新数据，它将返回用于拟合模型的数据上的预测值。\n\n\n\n#### `print`\n\n当你显式打印一个对象，或者仅仅是在\
  \ R 终端中写入一个计算结果为类的对象的表达式时，就会调用此函数。通常，它会打印该对象的简短描述。\n\n对于拟合后的对象，它习惯性地打印拟合函数是如何被调用的，或许还会打印拟合后的系数或拟合效果如何。你可以查看`lm`对象是如何打印的来了解一个示例。\n\
  \n如果你想打印拟合函数是如何被调用的，你需要从你在`blm`构造函数中拟合对象时获取该信息。毕竟，人们感兴趣的是构造函数是如何被调用的。在这个函数内部，你可以通过使用`sys.call`函数来获取它的调用方式。\n\
  \n#### `residuals`\n\n此函数返回拟合的残差。也就是预测值与响应变量的观测值之间的差值。\n\n#### `summary`\n\n此函数通常用作`print`的更长版本。它提供关于拟合模型的更多信息。\n\
  \n然而，它的作用不止于此。它返回一个包含摘要信息的对象。这实际上意味着什么取决于模型的实现，所以你可以自由发挥。\n\n## 为`blm`构建一个 R 包\n\
  \n我们现在已经为我们的贝叶斯线性回归软件拼凑了大部分组件，是时候将它们收集到一个 R 包中了。这是我们项目的下一步。\n\n你已经有了一个贝叶斯线性回归的实现，包含一个类`blm`，以及多个用于访问此类对象的函数。现在是时候将这些函数收集到一个包中了。\n\
  \n### 确定包接口\n\n当你设计类的功能和接口时，你必须决定类的对象应该具备哪些功能，以及所有函数如何配合使用，以使代码易于扩展和使用。制作包也涉及类似的设计过程。\n\
  \n你为设计类所做的一切，当然，对于包来说也是一样的，但是对于包，你必须决定哪些函数应该被导出，哪些应该保持内部使用。\n\n只有导出的函数才能被加载你包的其他人使用，所以你可能倾向于导出所有可以导出的内容。然而，这是一个糟糕的选择。你的包的接口就是导出的函数，如果你导出太多，你就有了一个需要维护的庞大接口。如果你对包的接口进行更改，那么使用你包的每个人都必须更新他们的代码以适应不断变化的接口。你应该尽量减少对包接口的更改。\n\
  \n你需要弄清楚哪些功能是你认为包功能的核心部分，哪些是内部辅助函数，并只导出那些属于包接口的函数。\n\n### 源文件组织\n\nR 并不真正关心你使用多少个文件来存放源代码，也不关心源代码是如何组织的，但你可能会在意。在未来的某个时候，你将需要能够找到相关的函数来修复错误或扩展包的功能。\n\
  \n决定好你希望如何组织你的源代码。你是希望每个文件只包含一个函数？还是有一些逻辑上的方式，可以根据功能类别将代码拆分，以便每个类别对应一个文件？\n\n###\
  \ 充分记录你的包接口\n\n至少，你从包中导出的函数应该有文档说明。没有文档，用户（将来也可能包括你自己）将不知道一个函数应该如何使用。\n\n这种文档主要用于在线帮助——即使用`?`获得的帮助——所以它不应太长，但应让读者清楚地了解一个函数应该如何使用。\n\
  \n要给出整个包的总体描述，以及各个函数如何配合使用，以及它们应该如何被使用，你可以为整个包编写文档。\n\n和包数据一样，实际上没有专门的地方来做这件事，但你可以使用与数据相同的技巧。将文档放在`R/`目录下的一个源代码文件中。\n\
  \n以下是我为`admixturegraph`包编写的文档：\n\n```\n#' admixturegraph: Visualising and analysing\
  \ admixture graphs.\n#'\n#' The package provides functionality to analyse and test\n\
  #' admixture graphs against the \\eqn{f} statistics described\n#' in the paper\n\
  #' \\href{http://tinyurl.com/o5a4kr4}{Ancient Admixture in Human History},\n#' Patternson\
  \ \\emph{et al.}, Genetics, Vol. 192, 1065--1093, 2012.\n#'\n#' The \\eqn{f} statistics,\
  \ \\eqn{f_2}, \\eqn{f_3}, and \\eqn{f_4},\n#' extract information about correlations\
  \ between gene frequencies\n#' in different populations (or single diploid genome\
  \ samples),\n#' which can be informative about patterns of gene flow between\n#'\n\
  #' @docType package\n#' @name admixturegraph\nNULL\n```\n\n正是`@docType`和`@name`标签告诉\
  \ Roxygen 我正在为整个包编写文档。\n\n### 向你的包添加 README 和 NEWS 文件\n\n按照惯例，你还需要在包中包含一个 README\
  \ 和一个 NEWS 文件。README 文件描述你的包是做什么的以及如何做，可以被看作是包的一个简短广告，而 NEWS 文件则描述你随时间对包所做的更改。\n\
  \n许多开发者偏好使用“markdown”作为这些文件的格式——在这种情况下，它们通常被命名为`README.md`和`NEWS.md`——尤其是如果你将包放在\
  \ GitHub 上，拥有一个`README.md`文件是一个好主意，因为当人们访问 GitHub 上的包主页时，它会显眼地显示出来。\n\n#### README\n\
  \n你在 README 文件中写什么取决于你，但按照惯例，它应该简要描述包的功能，或许可以给出一两个关于如何使用它的例子。\n\n如果你用 markdown 编写——在一个名为`README.md`的文件中——如果你将包放在\
  \ GitHub 上，它将是主页。\n\n你或许想用 R Markdown 编写，以便获得`knitr`的所有好处。在这种情况下，你应该将文件命名为`README.Rmd`，并在文件头部加上：\n\
  \n```\noutput:\n  md_document:\n    variant: markdown_github\n```\n\n这告诉`knitr`它应该输出一个\
  \ markdown 文件——它将被称为`README.md`。\n\n#### NEWS\n\n此文件应简单地包含你随时间对包所做的更改列表。为了让人们更容易看到哪些更改属于包的哪个版本，你可以将其分成多个部分，每个部分对应一个版本。\n\
