  \n当我们在另一个函数内部创建一个函数并将其返回时，我们就创建了闭包。因为内部函数可以引用外部函数的参数和局部变量，即使我们已经从外部函数返回了，我们也可以利用这种内部函数来特化通用函数。它可以作为一种模板机制来描述一系列函数。\n\
