  \n## 高阶函数\n\n在函数式编程常用的术语中，高阶函数指的是那些将其他函数作为参数、返回函数，或两者兼有的函数。我们多次使用的 `apply` 函数就是一个高阶函数，因为它将函数作为其输入之一。\n\
  \n### 将函数作为参数的函数\n\n我们通常使用函数参数来影响函数的执行方式。如果参数不影响函数的行为，我们就不需要它们了。有时，参数很简单，比如一个决定函数部分行为的布尔标志，或者函数计算中用到的一个数字。但有时，这种静态数据不够用，或者至少会使我们所需功能的实现变得更加困难。有时，我们需要一个具有某种动态行为的参数，例如，一个能够为多个数据指针中的每一个决定是跳过该数据还是执行某些计算的参数。这种动态行为非常适合用函数来表示，在这种情况下，函数参数就是你所需要的。\n\
