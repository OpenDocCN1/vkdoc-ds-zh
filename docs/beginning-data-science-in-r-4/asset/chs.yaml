- '# 9. 深入 R 编程


  在本章中，我们将离开数据分析，回到编程和软件开发的主题，这也是本书剩余章节的重点。在第一章中，你通过教程初步了解了 R 编程，但我们省略了很多细节。本章将涵盖其中的许多细节，而接下来的两章将介绍
  R 编程的更高级方面：函数式编程和面向对象编程。


  ## 表达式


  我们开始本章，首先回到表达式。我们在 R 中做的每一件事都涉及表达式的求值。我们求值的大多数表达式是为了进行计算并获得结果，但有些表达式具有副作用——比如赋值——而我们通常正是因为这些副作用才对它们进行求值。




  ### 算术表达式


  我们之前已经介绍过算术表达式，因此这里仅作简要回顾。算术表达式是涉及数字的运算符，包含一元运算符 `+` 和 `-`：


  ```

  + x

  - x

  ```


  其中 `+` 实际上不执行任何操作，而 `-` 则改变其操作数的符号。此外，还有用于加法、减法、乘法和除法的中缀运算符：


  ```

  x + y

  x - y

  x * y

  x / y

  ```


  即使两个操作数都是整数，除法也会返回一个浮点数，因此如果你想要进行整数除法，需要使用专门的运算符：


  ```

  x %/% y

  ```


  如果你想要整数除法的余数，则需要改用这个中缀运算符：


  ```

  x %% y

  ```


  最后，还有用于幂运算的运算符。要计算 *x^* (*y*)，你可以使用以下两个运算符中的任意一个：


  ```

  x ^ y

  x ** y

  ```


  在所有这些示例中，`x` 和 `y` 可以是数字或指向数字的变量（实际上是数字向量，因为 R 总是在向量上操作），也可以是其他能计算得出数字的表达式。如果你用中缀运算符组合表达式，就会遵循你所熟悉的算术运算优先级规则。例如，幂运算优先于乘法，乘法优先于加法。这意味着，如果你需要以不同顺序求值，就必须使用括号。


  由于这些规则是你所熟悉的，因此不太可能给你带来麻烦，除非你将这些表达式与运算符 `:` 结合使用。`:` 实际上并非算术运算符，而是一个用于生成序列的中缀运算符，其优先级高于乘法，但低于幂运算。这意味着
  `1:2**2` 会先计算 `2**2` 表达式得到 `1:4`，然后再构建序列：


  ```

  1:2**2

  ## [1] 1 2 3 4

  ```


  而表达式 `1:2*2` 会先计算 `:` 表达式，创建一个包含 `1` 和 `2` 的向量，然后将该向量与 `2` 相乘：


  ```

  1:2*2

  ## [1] 2 4

  ```


  由于一元运算符 `-` 的优先级高于 `:`，这也意味着 `-1:2` 将生成从 `-1` 到 `2` 的序列，而不是包含 `-1` 和 `-2` 的序列。要实现后者，你需要使用括号：


  ```

  -1:2

  ## [1] -1 0 1 2

  -(1:2)

  ## [1] -1 -2

  ```


  函数会在运算符之前求值：


  ```

  1:sqrt(4)

  ## [1] 1 2

  ```


  ### 布尔表达式


  对于布尔值（即 `TRUE` 或 `FALSE`），也有相应的逻辑运算符。运算符 `!` 用于取反一个值：


  ```

  !TRUE

  ## [1] FALSE

  !FALSE

  ## [1] TRUE

  ```


  而 `|` 和 `||` 是逻辑“或”运算符，`&` 和 `&&` 是逻辑“与”运算符。`|` 与 `||` 或 `&` 与 `&&` 的区别在于它们处理向量的方式。单字符版本会按元素应用运算符并创建一个向量，而双字符版本只查看向量中的第一个值：


  ```

  TRUE | FALSE

  ## [1] TRUE

  FALSE | FALSE

  ## [1] FALSE

  TRUE || FALSE

  ## [1] TRUE

  FALSE || FALSE

  ## [1] FALSE

  x <- c(TRUE, FALSE, TRUE, FALSE)

  y <- c(TRUE, TRUE, FALSE, FALSE)

  x | y

  ## [1] TRUE TRUE TRUE FALSE

  x || y

  ## [1] TRUE

  x & y

  ## [1] TRUE FALSE FALSE FALSE

  x && y

  ## [1] TRUE

  ```


  我们通常在诸如 `if` 这样的控制结构中使用双字符版本——因为这类结构无论如何都不会对向量进行操作——而当我们需要进行布尔算术运算，并希望表达式作为向量化表达式工作时，我们会使用单字符版本。


  顺便提一下，所有算术运算符在处理多个值时，其工作方式与 `|` 和 `&` 运算符类似，即它们对向量进行按元素操作。我们在关于向量表达式的第 1 章中已经看到了这一点。


  ## 基本数据类型


  R 中有几种基本类型：数值型、整型、复数型、逻辑型和字符型。


  ### 数值型


  每当你在 R 中写入一个数字时，得到的就是数值型。你可以使用函数 `is.numeric()` 或通过获取对象的 `class` 来测试一个对象是否为数值型：


  ```

  is.numeric(2)

  ## [1] TRUE

  class(2)

  ## [1] "numeric"

  ```


  ### 整型


  整型顾名思义用于表示整数。令人惊讶的是，之前的 `2` 在 R 中并不是整型。它是一种数值类型，是一种更大的类型，包含所有浮点数以及整数。要得到一个整数，你必须显式地将值设为整数，可以通过函数
  `as.integer()` 或在字面量后加上 `L`^(¹⁸) 来实现：


  ```

  is.integer(2)

  ## [1] FALSE

  is.integer(2L)

  ## [1] TRUE

  x <- as.integer(2)

  is.integer(x)

  ## [1] TRUE

  class(x)

  ## [1] "integer"

  ```


  如果你将一个非整数转换为整数，只会得到整数部分：


  ```

  as.integer(3.2)

  ## [1] 3

  as.integer(9.9)

  ## [1] 9

  ```


  ### 复数型


  如果你需要处理复数，R 也提供了支持。你可以通过将一个虚数（一个数字后跟 `i`）加到任意数字上来构造复数，或者显式使用函数 `as.complex()`。虚数可以是零，`0i`，这会创建一个虚部为零的复数：


  ```

  1 + 0i

  ## [1] 1+0i

  is.complex(1 + 0i)

  ## [1] TRUE

  class(1 + 0i)

  ## [1] "complex"

  sqrt(as.complex(-1))

  ## [1] 0+1i

  ```


  ### 逻辑型


  如果你显式输入 `TRUE` 或 `FALSE`，得到的就是逻辑值；但进行诸如比较操作时，得到的也是逻辑值：


  ```

  x <- 4

  x > 4

  x

  ## [1] TRUE

  class(x)

  ## [1] "logical"

  is.logical(x)

  ## [1] TRUE

  ```


  ### 字符型


  最后，当你输入一个字符串例如 `"hello, world"` 时，得到的是字符型：


  ```

  x <- "hello, world"

  class(x)

  ## [1] "character"

  is.character(x)

  ## [1] TRUE

  ```


  与某些语言不同，这里的字符型并不仅指单个字符，而是指任意文本。因此它不像 C 或 Java 那样区分单字符类型 `''c''` 和多字符字符串 `"string"`；在
  R 中，它们都是字符型。


  与其他类型类似，你可以使用 `as.character()` 将一个值显式转换为字符型（字符串）：


  ```

  as.character(3.14)

  ## [1] "3.14"

  ```


  我在此不会深入探讨 R 中的字符串处理。当然，有很多用于操作字符串的函数——尽管有所有这些函数，我仍然觉得在 R 中操作字符串比在 Python 等脚本语言中困难得多——但这超出了本书的范围。


  ## 数据结构


  从基本类型出发，你可以通过将更简单的类型连接成更复杂的类型来构造其他数据结构。这里的基本构建块是向量（所有值类型相同的序列）和列表（值可以具有不同类型的序列）。




  ### 向量


  在本书中我们已经多次见到向量，因此大家应该对它们很熟悉了。当我们看到涉及单个数字的表达式时，实际上看到的是包含单个值的向量，所以我们之前从未见过不是向量的东西。但现在我们来探讨向量更多的技术层面。


  到目前为止我所说的向量，在技术术语上被称为“原子序列”。它们是由前面描述的基本类型组成的序列。通过使用 `c` 函数连接基本值来创建它们：


  ```

  v <- c(1, 2, 3)

  v

  ## [1] 1 2 3

  ```


  或者通过其他运算符或函数，例如 `:` 运算符或 `rep` 函数：


  ```

  1:3

  ## [1] 1 2 3

  rep("foo", 3)

  ## [1] "foo" "foo" "foo"

  ```


  我们可以使用 `is.atomic` 函数来测试某个对象是否属于这类向量：


  ```

  v <- 1:3

  is.atomic(v)

  ## [1] TRUE

  ```


  我之所以提到“原子序列”是我们迄今称为向量的东西在技术上的正确术语，是因为在 R 语言中还有一种东西被明确地称为向量。在实践中这并不会造成混淆，因为我称为向量的所有原子序列也都是向量。


  ```

  v <- 1:3

  is.vector(v)

  ## [1] TRUE

  ```


  只是 R 语言只有在这种序列没有任何属性（除了允许拥有的 `names` 属性外）时，才将其视为向量——即 `is.vector` 返回 `TRUE` 的情况。


  属性是与对象关联的元信息，我们在这里不会过多涉及，但你只需要知道如果一个完全正常的向量获得了某个属性，那么 `is.vector` 将返回 `FALSE`：


  ```

  v <- 1:3

  is.vector(v)

  ## [1] TRUE

  attr(v, "foo") <- "bar"

  v

  ## [1] 1 2 3

  ## attr(,"foo")

  ## [1] "bar"

  is.vector(v)

  ## [1] FALSE

  ```


  因此，如果你想测试某个对象是否是我这里所说的那种向量，请改用 `is.atomic`。


  当你连接（原子）向量时，你总是会得到另一个向量。因此，当你像这样组合多个 `c()` 调用时，不会得到任何树状结构：


  ```

  c(1, 2, c(3, 4), c(5, 6, 7))

  ## [1] 1 2 3 4 5 6 7

  ```


  类型可能会改变；如果你尝试连接不同类型的向量，R 语言会尝试将类型转换为这些向量中最通用的类型：


  ```

  c(1, 2, 3, "foo")

  ## [1] "1" "2" "3" "foo"

  ```


  ### 矩阵


  如果你想要一个矩阵而非向量，其实你真正想要的是一个二维向量。你可以使用 `dim` 函数设置向量的维度——它会设置我们之前讨论过的属性之一——在其中指定你想要矩阵的行数和列数：


  ```

  v <- 1:6

  attributes(v)

  ## NULL

  dim(v) <- c(2, 3)

  attributes(v)

  ## $dim

  ## [1] 2 3

  dim(v)

  ## [1] 2 3

  v

  ##      [,1] [,2] [,3]

  ## [1,]    1    3    5

  ## [2,]    2    4    6

  ```


  当你这样做时，向量中的值会按列填充到矩阵中，也就是说，向量中的值会先向下填充第一列，然后继续填充下一列，依此类推。


  你可以使用便捷函数 `matrix` 来创建矩阵，并且可以通过 `byrow` 参数指定是按列还是按行填充值：


  ```

  v <- 1:6

  matrix(data = v, nrow = 2, ncol = 3, byrow = FALSE)

  ##      [,1] [,2] [,3]

  ## [1,]    1    3    5

  ## [2,]    2    4    6

  matrix(data = v, nrow = 2, ncol = 3, byrow = TRUE)

  ##      [,1] [,2] [,3]

  ## [1,]    1    2    3

  ## [2,]    4    5    6

  ```


  一旦你有了矩阵，R 语言中有大量支持线性代数的功能，但有几件事你需要了解。首先，`*` 运算符不会执行矩阵乘法。如果你想要进行逐元素乘法，请使用 `*`；对于矩阵乘法，你需要使用运算符
  `%*%`：


  ```

  (A <- matrix(1:4, nrow = 2))

  ##      [,1] [,2]

  ## [1,]    1    3

  ## [2,]    2    4

  (B <- matrix(5:8, nrow = 2))

  ##      [,1] [,2]

  ## [1,]    5    7

  ## [2,]    6    8

  A * B

  ##      [,1] [,2]

  ## [1,]    5   21

  ## [2,]   12   32

  A %*% B

  ##      [,1] [,2]

  ## [1,]   23   31

  ## [2,]   34   46

  ```


  如果你想转置矩阵，请使用函数 `t`；如果你想求逆矩阵，请使用函数 `solve`：


  ```

  t(A)

  ##      [,1] [,2]

  ## [1,]    1    2

  ## [2,]    3    4

  solve(A)

  ##      [,1] [,2]

  ## [1,]   -2  1.5

  ## [2,]    1 -0.5

  solve(A) %*% A

  ##      [,1] [,2]

  ## [1,]    1    0

  ## [2,]    0    1

  ```


  `solve` 函数实际上是为了求解一组线性方程而设计的，如果它也接收一个向量参数，它就能做到这一点，但你可以查阅该函数的文档来了解具体操作。


  你也可以通过将维度属性设置为多于两个维度的参数来获得更高维度的向量，称为数组，或者你可以使用 `array` 函数。


  ### 列表


  列表和向量一样，都是序列，但与向量不同的是，列表的元素可以是任何类型的对象，而且它们不必是相同类型的对象。这意味着你可以利用列表构建更复杂的数据结构。


  例如，我们可以创建一个包含两个向量的列表：


  ```

  list(1:3, 5:8)

  ## [[1]]

  ## [1] 1 2 3

  ##

  ## [[2]]

  ## [1] 5 6 7 8

  ```


  请注意，这些向量并不会像我们用 `c()` 组合它们时那样被连接起来。前面命令的结果是一个包含两个元素的列表，恰巧这两个元素都是向量。


  它们的类型也不必相同；我们可以像这样创建一个列表，它也包含两个向量，但类型不同：


  ```

  list(1:3, c(TRUE, FALSE))

  ## [[1]]

  ## [1] 1 2 3

  ##

  ## [[2]]

  ## [1] TRUE FALSE

  ```


  由于列表可以包含其他列表，你可以很自然地构建树状数据结构：


  ```

  list(list(), list(list(), list()))

  ## [[1]]

  ## list()

  ##

  ## [[2]]

  ## [[2]][[1]]

  ## list()

  ##

  ## [[2]][[2]]

  ## list()

  ```


  你可以使用函数 `unlist()` 将列表展平为向量。当然，这会强制将列表中的元素转换为相同类型，因为这是向量的要求：


  ```

  l <- list(1:4, 5:7)

  l

  ## [[1]]

  ## [1] 1 2 3 4

  ##

  ## [[2]]

  ## [1] 5 6 7

  unlist(l)

  ## [1] 1 2 3 4 5 6 7

  ```



  好的，作为一名高级文档工程师和翻译员，我将遵循您的注意事项和示例，将给定的英文文本翻译成中文。



  '
- "# 索引\n\n我们在第一章中已经了解了基本索引，但 R 中的索引远不止于此。在 R 提示符下输入`?`[[`”`并做好准备，你会感到惊讶。\n\n我们已经了解了基本的索引。如果你想获取向量`v`的第\
  \ *n* 个元素，你可以使用`v[n]`：\n\n```\nv <- c(\"foo\", \"bar\", \"baz\", \"qux\", \"qax\"\
  )\nv[2]\n## [1] \"bar\"\n```\n\n但这你已经知道了。你也知道，你可以使用索引范围从向量中获取一个子序列：\n\n```\nv[2:3]\n\
  ## [1] \"bar\" \"baz\"\n```\n\n这实际上只是使用索引向量的一个特例：\n\n```\nv[c(1,1,4,3,2)]\n## [1]\
  \ \"foo\" \"foo\" \"qux\" \"baz\" \"bar\"\n```\n\n在这里，我们用正数进行索引，因为向量中的元素具有正索引，这是合理的。但在\
  \ R 中，也可以使用负数进行索引。如果你这样做，它被解释为指定你想要的那些值的补集。因此，如果你想要除第一个元素之外的所有元素，你可以使用\n\n```\n\
  v[-1]\n## [1] \"bar\" \"baz\" \"qux\" \"qax\"\n```\n\n你也可以使用多个负索引来移除某些值：\n\n```\n\
  v[-(1:2)]\n## [1] \"baz\" \"qux\" \"qax\"\n```\n\n你不能将正索引和负索引组合使用。我甚至不知道这有什么意义，但无论如何，你就是不能。\n\
  \n另一种索引方式是使用布尔向量。这个向量的长度应该与你索引的向量相同，它将选出布尔向量为`TRUE`的那些元素：\n\n```\nw <- 1:length(v)\n\
  w\n## [1] 1 2 3 4 5\nw %% 2 == 0\n## [1] FALSE TRUE FALSE TRUE FALSE\nv[w %% 2 ==\
  \ 0]\n## [1] \"bar\" \"qux\"\n```\n\n如果你想对一个向量进行赋值，你只需对你索引到的元素进行赋值；只要赋值运算符右侧的向量与索引取出的元素长度相同，你就可以赋值给该向量：\n\
  \n```\nv[w %% 2 == 0] <- \"flob\"\nv\n## [1] \"foo\" \"flob\" \"baz\" \"flob\" \"\
  qax\"\n```\n\n如果向量有多个维度——请记住，矩阵和数组实际上只是具有更多维度的向量——那么你可以通过对每个维度进行子集操作来选取子集。如果你省略一个维度，你将获得该维度中的一整段值，这是获取矩阵的行和列的一种简单方法：\n\
  \n```\nm <- matrix(1:6, nrow = 2, byrow = TRUE)\nm\n##      [,1] [,2] [,3]\n## [1,]\
  \    1    2    3\n## [2,]    4    5    6\nm[1,]\n## [1] 1 2 3\nm[,1]\n## [1] 1 4\n\
  ```\n\n你也可以通过在一个或多个维度中提供范围，来索引出子矩阵：\n\n```\nm[1:2,1:2]\n##      [,1] [,2]\n## [1,]\
  \    1    2\n## [2,]    4    5\n```\n\n当你取出一个一维子矩阵时——就像我们之前用`m[1,]`所做的那样——结果是一个向量，而不是一个矩阵。有时，这正是你想要的；有时，你并不关心得到的是矩阵还是向量，但有时你想进行线性代数运算，那么你肯定希望你取出的子矩阵是一个矩阵。你可以通过给索引提供一个选项`drop=FALSE`来告诉\
  \ R 它不应该将一维矩阵缩减为一个向量：\n\n```\nm[1,,drop=FALSE]\n##      [,1] [,2] [,3]\n## [1,]\
  \    1    2    3\nm[,1,drop=FALSE]\n##      [,1]\n## [1,]    1\n## [2,]    4\n```\n\
  \n如果这让你觉得奇怪（给索引提供一个选项），那么你需要知道的是，R 中的一切都会涉及函数调用。对矩阵进行索引只是另一个函数调用，而函数可以接受具名参数。这里所发生的一切就是这样。\n\
  \n当你使用`[]`选取列表的子集时，结果总是另一个列表。如果这让你感到惊讶，只需记住，当你选取向量的子集时，你得到的也总是一个向量。你只是没有过多地考虑这个问题，因为我们看待单个值的方式总是一些长度为\
  \ 1 的向量，所以我们对此更为习惯。\n\n无论如何，你使用`[]`选取列表的子集时，总是会得到一个列表。即使你在选取单个元素，你得到的也不是那个元素本身；你得到的是一个包含该元素的列表：\n\
  \n```\nL <- list(1,2,3)\nL[1]\n## [[1]]\n## [1] 1\nL[2:3]\n## [[1]]\n## [1] 2\n\
  ##\n## [[2]]\n## [1] 3\n```\n\n如果你想访问里面的实际元素，你需要使用`[[]]`运算符：\n\n```\nL <- list(1,2,3)\n\
  L[[1]]\n## [1] 1\n```\n\n### 具名值\n\n向量或列表中的元素可以有名称。这些名称是不影响元素值的属性，但可以用来引用它们。\n\n\
  你可以在创建向量或列表时设置这些名称：\n\n```\nv <- c(a = 1, b = 2, c = 3, d = 4)\nv\n## a b c d\n\
  ## 1 2 3 4\nL <- list(a = 1:5, b = c(TRUE, FALSE))\nL\n## $a\n## [1] 1 2 3 4 5\n\
  ##\n## $b\n## [1] TRUE FALSE\n```\n\n或者你可以使用`names<-`函数来设置名称。顺便说一下，这个奇怪的名字意味着你正在处理`names()`函数与赋值的组合。我们稍后会看到它是如何工作的。\n\
  \n```\nnames(v) <- LETTERS[1:4]\nv\n## A B C D\n## 1 2 3 4\n```\n\n你可以使用名称来索引向量和列表（其中，和`[[]]``[]`的作用与之前一样，分别返回一个列表或列表中的元素）：\n\
  \n```\nv[\"A\"]\n## A\n## 1\nL[\"a\"]\n## $a\n## [1] 1 2 3 4 5\nL[[\"a\"]]\n## [1]\
  \ 1 2 3 4 5\n```\n\n当你拥有具名值时，你还可以使用第三种索引运算符，即`$`运算符。它的工作方式基本上类似于`[[]]`，只是你不需要将名称放在引号中：\n\
  \n```\nL$a\n## [1] 1 2 3 4 5\n```\n\n从来没有什么好的时机来介绍向量的`[[]]`运算符，但这里还是要提一下：如果你对一个向量使用`[[]]`运算符，它只允许你提取单个元素，并且如果向量有名称，它会移除该名称。\n\
  \n### 因子\n\n我们在第一章中看到的因子类型，在技术上也是一种向量类型，但它与之前的类型不同，不是一种原始类型。它被存储为一个整数向量——即因子中的水平——并且具有相关的属性，例如水平。它是使用我们将在两章后讨论的类系统实现的，这里不再进一步讨论。\n\
  \n### 公式\n\n另一种数据类型是公式。我们在第 6 章中看到过这些，我们可以使用`~`运算符来创建它们。像因子一样，结果是一个使用类定义的对象。我们将在本书的最后一章中看到如何通过模型矩阵使用公式来实现我们自己的统计模型。\n\
  \n## 控制结构\n\n控制结构决定了程序的执行流程。仅仅通过一个接一个的语句或表达式，你也能走得很远，但最终你将需要根据计算结果来执行一件事而不是另一件事，这就是控制结构发挥作用的地方。\n\
  \n像许多其他编程语言一样，R 中有两种控制结构：选择（`if`语句）和循环（`for`、`while`或`repeat`语句）。\n\n### 选择语句\n\n\
  `If`语句看起来像这样：\n\n```\nif (boolean) {\n# 执行某些操作\n}\n```\n\n或者像这样：\n\n```\nif (boolean)\
  \ {\n# 执行一个操作\n} else {\n# 执行另一个操作\n}\n```\n\n你可以将它们串联起来，像这样：\n\n```\nif (x < 0)\
  \ {\n# 处理负数 x\n} else if (x > 0) {\n# 处理正数 x\n} else {\n# 处理 x 为零的情况\n}\n```\n\n\
  在所有这些示例中，我将条件为真或假时要执行的语句放在了花括号中。严格来说，如果我们只讨论单个语句，这不是必需的。下面这样是可以的：\n\n```\nif (x\
  \ > 0) \"positive\" else if (x < 0) \"negative\" else \"zero\"\n```\n\n但是，如果你在语句之间插入换行符，它就会失败；R\
  \ 解析器会对此感到困惑，这时你就需要花括号了。下面这样会是一个语法错误：\n\n```\nif (x > 0)\nprint(\"positive\")\n\
  else if (x < 0)\nprint(\"negative\")\nelse\nprint(\"zero\")\n```\n\n而下面这样是可以的：\n\
  \n```\nif (x > 0) {\nprint(\"positive\")\n} else if (x < 0) {\nprint(\"negative\"\
  )\n} else {\nprint(\"zero\")\n}\n```\n\n我建议在你对 R 更熟悉之前，始终使用花括号，因为即使你只有一个语句，花括号也能正常工作，在这种情况下你并没有做错什么，而且当你有多于一个语句或者在`if`语句中有换行符时，花括号是唯一可行的方式。\n\
  \n\n\n### 循环\n\n最常用的循环结构可能是`for`循环。使用`for`循环遍历序列中的元素，其构造如下：\n\n```r\nfor (i in 1:4)\
  \ {\nprint(i)\n}\n## [1] 1\n## [1] 2\n## [1] 3\n## [1] 4\n```\n\n但请记住，你遍历的是序列中的元素，因此赋给迭代变量的值是序列中的元素，而不是索引：\n\
  \n```r\nfor (i in c(\"foo\", \"bar\", \"baz\")) {\nprint(i) # i 的值是\"foo\"、\"bar\"\
  、\"baz\"，而不是索引 1、2、3\n}\n## [1] \"foo\"\n## [1] \"bar\"\n## [1] \"baz\"\n```\n\n\
  如果你想遍历序列的索引，可以使用`seq_along`函数：\n\n```r\nx <- c(\"foo\", \"bar\", \"baz\")\nfor (i\
  \ in seq_along(x)) {\nprint(i)\nprint(x[i])\n}\n## [1] 1\n## [1] \"foo\"\n## [1]\
  \ 2\n## [1] \"bar\"\n## [1] 3\n## [1] \"baz\"\n```\n\n你有时会看到类似这样的代码：\n\n```r\nfor\
  \ (i in 1:length(x)) {\n# 执行操作\n}\n```\n\n不要这样做。如果序列`x`为空，它就会失效：\n\n```r\nx <- c()\n\
  1:length(x)\n## [1] 1 0\n```\n\n如果你想跳到循环的下一次迭代，可以使用`next`关键字。例如，以下代码只打印`x`中每隔一个的元素：\n\
  \n```r\nfor (i in seq_along(x)) {\nif (i %% 2 == 0) {\nnext\n}\nprint(x[i])\n}\n\
  ```\n\n如果你想完全终止循环，可以使用`break`：\n\n```r\nfor (i in 1:100) {\nif (i %% 2 == 0) {\n\
  next\n}\nif (i > 5) {\nbreak\n}\nprint(i)\n}\n## [1] 1\n## [1] 3\n## [1] 5\n```\n\
  \n另外两种不太常用的循环结构是`while`和`repeat`循环。\n\n`while`循环在布尔表达式为真时持续迭代，写法如下：\n\n```r\ni <-\
  \ 1\nwhile (i < 5) {\nprint(i)\ni <- i + 1\n}\n## [1] 1\n## [1] 2\n## [1] 3\n##\
  \ [1] 4\n```\n\n`repeat`循环会一直运行，直到你用`break`跳出循环：\n\n```r\ni <- 1\nrepeat {\nprint(i)\n\
  i <- i + 1\nif (i > 5) break\n}\n## [1] 1\n## [1] 2\n## [1] 3\n## [1] 4\n## [1]\
  \ 5\n```\n\n### 关于循环的一个警告…\n\n如果你继续阅读关于 R 的资料，很快就会看到“循环在 R 中很慢”的说法。实际情况并没有一些人说得那么糟，但这种说法有一定道理。因为\
  \ R 是一种极其动态的语言——在程序执行过程中，函数和变量随时可以更改（如果你希望的话）——解释器很难在运行前优化代码，这点与其他一些语言不同（但与 Python\
  \ 等其他动态语言差别不大）。不过，针对循环的优化尝试也不多，因为在 R 中通常有比使用显式循环语句更好的解决方案。\n\nR 是一种所谓的函数式语言（兼有其他特性），在函数式语言中，通常不使用循环。循环的工作方式需要在执行代码时改变循环变量或布尔表达式的值，而改变变量在函数式语言中被视为“不纯”的行为（显然，R\
  \ 允许这样做，所以它并非纯粹的函数式语言）。相反，递归函数被用于实现循环。大多数函数式语言甚至没有循环结构——纯粹的函数式语言当然没有。R 在这方面更为务实，但使用替代方案通常比使用循环更好。\n\
  \n我们将在下一章进一步讨论这一点。\n\n## 函数\n\n定义函数的方式如下：\n\n```r\nname <- function(arguments) expression\n\
  ```\n\n其中`name`可以是任何变量名，`arguments`是函数的形参列表，`expression`是调用函数时的执行内容。之所以用`expression`，是因为你可以将函数体视为一个表达式，但通常它是由花括号括起来的一系列语句：\n\
  \n```r\nname <- function(arguments) { statements }\n```\n\n只是这样一系列语句本身也是一个表达式；执行一系列语句的结果就是最后一条语句的值。\n\
  \n以下函数会打印一条语句并返回 5，因为函数体中的语句首先是`print`语句，然后才是值 5，该值将成为函数的返回值：\n\n```r\nf <- function()\
  \ {\nprint(\"hello, world\")\n5\n}\nf()\n## [1] \"hello, world\"\n## [1] 5\n```\n\
  \n我们通常不会编写无参数的函数——就像我前面做的那样——而是会有一个或多个形参。最简单的形式下，参数就是变量名。调用函数时，这些参数被赋值，然后在函数体内使用：^(¹⁹)\n\
  \n```r\nplus <- function(x, y) {\nprint(paste(x, \"+\", y, \"is\", x + y))\nx +\
  \ y\n}\ndiv <- function(x, y) {\nprint(paste(x, \"/\", y, \"is\", x / y))\nx / y\n\
  }\nplus(2, 2)\n## [1] \"2 + 2 is 4\"\n## [1] 4\ndiv(6, 2)\n## [1] \"6 / 2 is 3\"\
  \n## [1] 3\n```\n\n### 命名参数\n\n调用函数时，参数的顺序很重要，因为它决定了哪个参数被赋予哪个值：\n\n```r\ndiv(6,\
  \ 2)\n## [1] \"6 / 2 is 3\"\n## [1] 3\ndiv(2, 6)\n## [1] \"2 / 6 is 0.333333333333333\"\
  \n## [1] 0.3333333\n```\n\n但是，如果一个函数有很多参数，要记住它们出现的顺序可能比较困难，因此还有一种替代方法可以指定哪个变量被赋予哪个值：命名参数。这意味着调用函数时，你可以明确指定每个参数对应哪个形参：\n\
  \n```r\ndiv(x = 6, y = 2)\n## [1] \"6 / 2 is 3\"\n## [1] 3\ndiv(y = 2, x = 6)\n\
  ## [1] \"6 / 2 is 3\"\n## [1] 3\n```\n\n这样就明确了哪个形参被赋给哪个值，你可以把它看作赋值运算符。但你不应该这样想，因为虽然可以使用`=`作为赋值运算符，但你不能使用`<-`来指定命名变量。看起来好像可以，但它并不能实现你想要的效果（除非你想要一些非常奇怪的结果）：\n\
  \n```r\ndiv(x <- 6, y <- 2)\n## [1] \"6 / 2 is 3\"\n## [1] 3\ndiv(y <- 2, x <- 6)\n\
  ## [1] \"2 / 6 is 0.333333333333333\"\n## [1] 0.3333333\n```\n\n赋值运算符`<-`会返回一个值，这个值作为位置参数传递给函数。因此，在上面的第二个函数调用中，你在函数外部将`2`赋给了`y`，将`6`赋给了`x`，但传递给函数的值是按位置传递的，所以在函数内部，`x`得到的是`2`，`y`得到的是`6`。\n\
  \n不要混淆这两个赋值运算符：代码很可能能运行，但不太可能达到你想要的效果！\n\n### 默认参数\n\n定义函数时，你可以为参数提供默认值，如下所示：\n\n\
  ```r\npow <- function(x, y = 2) x^y\npow(2)\n## [1] 4\npow(3)\n## [1] 9\npow(2,\
  \ 3)\n## [1] 8\npow(3, 3)\n## [1] 27\n```\n\n当你在函数调用中未提供该参数时，就会使用默认参数值。\n\n### 返回值\n\
  \n函数的返回值是函数体执行过程中最后一条表达式的值。如果函数是一系列语句，那就是序列中的最后一条语句，但通过使用控制结构，你可以让不同的语句成为最后一条语句：\n\
  \n```r\nsafer_div <- function(x, y) {\nif (y == 0) {\nNA\n} else {\nx / y\n}\n}\n\
  safer_div(4, 2)\n## [1] 2\nsafer_div(4, 0)\n## [1] NA\n```\n\n也可以使用`return()`语句从函数中显式返回——类似于从循环中跳出：\n\
  \n```r\nsafer_div <- function(x, y) {\nif (y == 0) {\nreturn(NA)\n}\nx / y\n}\n\
  safer_div(4, 2)\n## [1] 2\nsafer_div(4, 0)\n## [1] NA\n```\n\n请注意，`return()`语句将返回值放在括号中。许多编程语言允许你写成\n\
  \n```r\nsafer_div <- function(x, y) {\nif (y == 0) {\nreturn NA\n}\nx / y\n}\n```\n\
  \n但这在 R 中会是一个错误。\n\n\n\n### 惰性求值\n\n我在前文多处提到，当我们调用函数时，需要向函数参数提供值。在许多编程语言中，函数调用的工作方式正是如此——为每个参数提供的表达式会被求值，然后将结果赋值给函数参数，以便函数体能够使用它们——但在\
  \ R 语言中，实际被赋值给函数参数的是**表达式**本身。这些表达式直到真正需要时才会被求值，这种机制被称为**惰性求值**。\n\n这种处理函数参数的方式既有其优势，也会带来一些奇特的结果。\n\
  \n首先，它使得默认参数的设置更加灵活。我们可以编写像下面这样的函数：\n\n```\nf <- function(x, y = x²) y + x\n```\n\
  \n其中 `y` 的默认值依赖于另一个参数 `x`。在函数声明时，`x` 的值是未知的，但由于 `y` 并非在此处求值，因此这不会造成问题。每当我们调用该函数时，`x`\
  \ 在函数体内部是已知的，而正是在这里我们才需要 `y` 的值，所以表达式也就在此处进行求值：\n\n```\nf(2)\n## [1] 6\n```\n\n\
  正因为 `y` 在**被使用前**不会求值，这也意味着：如果你在使用 `y` 之前给 `x` 赋了一个新值，那么 `y` 求值的结果将依赖于 `x` 的**新值**，而不是调用函数时\
  \ `x` 的初始值！\n\n```\ng <- function(x, y = x²) { x <- 0; y + x }\ng(2)\n## [1] 0\n\
  ```\n\n另一方面，如果 `y` 在我们给 `x` 赋值之前就被求值了，那么它将基于求值时的 `x` 值来计算结果，并且这个结果会保持不变。`y` 在第一次被需要时进行求值，之后的任何引用都会记住这个求值结果：\n\
  \n```\nh <- function(x, y = x²) { y; x <- 0; y + x }\nh(2)\n## [1] 4\n```\n\n因此，惰性求值允许你指定依赖于其他参数的默认参数，即使在这些参数尚属未知的上下文中。但代价是，参数的值将取决于它被首次求值时的上下文。\n\
  \n如果只是为了能够以这种方式指定变量，我们当然可以找到一种不涉及这种怪异特性的解决方案。毕竟，大多数编程语言都是这么做的。但惰性求值还有另一个好处：**你只在真正需要的时候才对表达式进行求值**。\n\
  \n### 作用域\n\nR 语言的作用域是**词法作用域**。这意味着，如果一个变量在函数中被使用，但既没有在函数内部定义，也不是函数参数的一部分，那么 R\
  \ 会从该函数被**创建的位置**开始，向外层代码进行搜索。这实质上意味着从代码中定义函数的那一点开始，向上、向外搜索，因为函数是在执行到定义它的代码时被创建的。\n\
  \n考虑以下代码：\n\n```\nx <- \"x\"\nf <- function(y) {\ng <- function() c(x, y)\ng()\n\
  }\nf(\"y\")\n## [1] \"x\" \"y\"\n```\n\n这里，我们有一个全局变量 `x` 和一个接受参数 `y` 的函数 `f`。在 `f`\
  \ 内部，我们定义了函数 `g`，它既没有定义变量 `x` 和 `y`，也没有将它们列为形式参数，但确实返回了它们。我们在 `f` 的最后一句话中求值 `g`，因此最后一行调用\
  \ `f` 的结果就是 `g` 的返回值。\n\n在 `g` 内部，我们没有定义 `x` 或 `y`，因此为了找到它们的值，R 会从 `g` 被创建的位置向外搜索。它会找到作为函数\
  \ `f` 参数的 `y`并从中获取其值，然后继续向外搜索，在全局层面找到 `x`。\n\n`g` 所引用的变量是变量本身，而不是 `g` 创建时的值。因此，如果在创建\
  \ `g` 之后更新了变量，`g` 的返回值也会随之改变：\n\n```\nx <- \"x\"\nf <- function(y) {\ng <- function()\
  \ c(x, y)\ny <- \"z\"\ng()\n}\nf(\"y\")\n## [1] \"x\" \"z\"\n```\n\n这不仅仅是惰性求值的疯狂之处——并不是因为\
  \ `g` 还没有对 `y` 求值，所以 `y` 可以被改变。实际上，`g` 是在需要用到 `y` 的时候才去查找它的值：\n\n```\nx <- \"x\"\
  \nf <- function(y) {\ng <- function() c(x, y)\ng()\ny <- \"z\"\ng()\n}\nf(\"y\"\
  )\n## [1] \"x\" \"z\"\n```\n\n如果我们将函数 `g` 本身从 `f` 返回，而不是返回对它求值的结果，我们就能看到 R 作用域的另一个特性——称为**闭包**。R\
  \ 会记住已经返回的、并且不再处于活跃计算过程中的函数内部的变量值。在下面的例子中，我们返回了函数 `g`，此时 `f` 函数已经不再活跃，因此也就不再存在一个活跃的\
  \ `y` 参数实例。然而 `g` 仍然引用着一个 `y`，所以传递给 `f` 的参数实际上被记住了：\n\n```\nx <- \"x\"\nf <- function(y)\
  \ {\ng <- function() c(x, y)\ng\n}\ng<- f(\"y\")\ng()\n## [1] \"x\" \"y\"\n```\n\
  \n如果我们用不同的 `y` 参数值两次调用 `f`，就能看到这个机制是如何工作的：\n\n```\nx <- \"x\"\nf <- function(y)\
  \ {\ng <- function() c(x, y)\ng\n}\ng<- f(\"y\")\nh <- f(\"z\")\ng()\n## [1] \"\
  x\" \"y\"\nh()\n## [1] \"x\" \"z\"\n```\n\n这创建了两个不同的函数。在 `f` 内部，它们都被命名为 `g`，但它们是两个不同的函数，因为它们是在对\
  \ `f` 的两次不同调用中创建的，并且它们分别记住了不同的 `y` 参数，因为 `f` 的两个实例被调用时，`y` 的值不同。\n\n当从函数定义处向外查找时，它查找的是函数**被调用时**变量的值，而不是函数**创建时**变量的值。变量不一定需要在函数创建时就定义；它们只需要在函数最终被调用时被定义即可。\n\
  \n考虑下面这段代码：\n\n```\nf <- function() {\ng <- function() c(y, z)\ny <- \"y\"\ng\n\
  }\nh <- f()\nh()\n## Error in h(): object 'z' not found\nz <- \"z\"\nh()\n## [1]\
  \ \"y\" \"z\"\n```\n\n\n\n`g`定义在函数`f`内部——在那里它引用了尚未定义的变量`y`和`z`。这没关系，因为我们只是创建了函数`g`，并没有调用它。之后我们在调用`f`的上下文内部设置了变量`y`，然后返回了`g`。在函数调用之外，我们将`f()`的返回值命名为`h`。如果此时调用`h`，它会记住`y`是在`f`内部定义的——并且记住从`f`返回时`y`的值。但此时`z`仍然没有被赋值，因此调用`h`会导致错误。由于内部函数引用`z`的封闭作用域中并未定义它，它必须在最外层的全局作用域中定义，但事实并非如此。如果我们在那里设置了`z`，错误就会消失，因为现在\
  \ R 可以从函数创建的位置向外搜索找到该变量。\n\n我本不该告诉你这个，因为我即将介绍的特性很危险。我将向你展示一种让函数产生比平常更多副作用的方法，而函数实际上根本不应该有副作用。无论如何，这是该语言的一个特性，如果你非常谨慎地使用它，当你确实觉得需要让函数产生副作用时，它会非常有用。\n\
  \n问题如下：如果你想在函数外部的某个作用域中给变量赋值，该怎么办？你不能直接给变量赋值，因为如果你给当前作用域中未找到的变量赋值，那么你会在当前作用域中创建该变量：\n\
  \n```\nf <- function() {\nx <- NULL\nset <- function(val) { x <- val }\nget <- function()\
  \ x\nlist(set = set, get = get)\n}\nx <- f()\nx$get() # 获取 x——我们尚未设置它，所以为 NULL\n\
  ## NULL\nx$set(5) # 将 x 设置为 5\nx$get()  # 现在获取新值——但还不行\n## NULL\n```\n\n在这段代码中——我强烈建议你仔细阅读，因为其中包含一些巧妙的想法——我们创建了一个\
  \ getter 和 setter 函数。getter 告诉我们变量`x`的值，而 setter 应该更新它。然而，这目前还不太奏效。当在`set`函数体内设置`x`时，我们会在该函数内部创建一个局部变量——它并没有给上一层的`x`赋值。\n\
  \n有一个单独的赋值运算符`<<-`，你可以用它来实现这一点。它不会创建新的局部变量，而是向外搜索以找到一个现有变量并进行赋值。不过，如果它一直搜索到最外层的全局作用域，并且该变量不存在，它会在那里创建该变量。\n\
  \n如果我们在前面的示例中使用这个赋值运算符，就能得到我们想要的行为：\n\n```\nf <- function() {\nx <- NULL\nset <-\
  \ function(val) { x <<- val }\nget <- function() x\nlist(set = set, get = get)\n\
  }\nx <- f()\nx$get() # 获取 x，此时仍为 NULL\n## NULL\nx$set(5) # 设置 x，这次成功了\nx$get() \
  \ # 正如你在这里看到的\n## [1] 5\n```\n\n如果你想知道，在这个示例中，如果我们没有在`f`函数体内设置变量`x`，那么 getter 和\
  \ setter 都会引用一个全局变量。第一次调用`get`时，如果没有全局变量，会导致错误。虽然这个示例向你展示了必须创建一个对象，其中函数具有副作用，但这比使用全局变量要好得多，因为它让函数修改隐藏在闭包中的变量。\n\
  \n### 函数名与变量名不同\n\n关于作用域的最后一个说明——我不确定这应该被视为特性还是漏洞——如果 R 看到看起来像函数调用的东西，它会去搜索函数，即使从函数创建的位置向外搜索会先遇到非函数对象：\n\
  \n```\nn <- function(x) x\nf <- function(n) n(n)\nf(5)\n## [1] 5\n```\n\n根据声明应该向外搜索的作用域规则，`f`函数内部的`n`应该引用`f`的参数。但很明显，第一个`n`是一个函数调用，第二个是它的参数，所以当我们调用`f`时，它发现参数不是函数，于是会进一步向外搜索并找到函数`n`。它用其参数调用该函数。因此，`f`内部的两个`n`实际上引用了不同的东西。\n\
  \n当然，如果我们用实际上是一个函数的东西来调用`f`，那么它会识别出`n`是一个函数，并用自身作为参数调用该函数：\n\n```\nf(function(x)\
  \ 15)\n## [1] 15\n```\n\n很有趣，对吧？\n\n\n\n## 递归函数\n\n本章要介绍的最后一个主题是递归函数。有些人觉得这个话题很难，但在函数式编程语言中，它是最基本的构建模块之一。因此，即使你在\
  \ R 语言中需要用到递归的概率远低于在大多数纯函数式语言中，也值得花些心思去理解它。\n\n不过，从最基础的层面来说，递归就是我们可以通过调用自身函数来定义函数的计算过程——我们允许一个函数用新的参数来调用它自己。\n\
  \n以阶乘运算符 *n*! = *n ×* (*n −* 1) *× · · · ×* 3 *×* 2 *×* 1 为例。我们可以将 *n* 的阶乘表示为 *n*\
  \ 与另一个更小的阶乘（即 *n −* 1 的阶乘）的乘积，得到 *n*! = *n ×* (*n −* 1)!。这是一个经典的递归适用场景：我们通过较小值的计算结果来定义某个\
  \ *n* 的值。写成函数的形式，即 `factorial(n)` 等于 `n * factorial(n-1)`。\n\n然而，递归函数包含两个方面。解决大小为\
  \ *n* 的问题需要将其分解为两个部分：一部分是当前可以直接处理的操作，另一部分是调用解决更小规模（此处为 *n −* 1）问题的函数。这部分我们称之为递归的“步骤”。我们不能无休止地将问题分解成越来越小的部分——那将导致无限递归，其危害与无限循环一样，让我们永远无法得到结果——在某个时刻，我们需要将问题缩小到足够小的规模，从而能够直接处理它。这被称为递归的“基础”。\n\
  \n对于阶乘来说，1 是一个自然的基础，因为 1! = 1。因此，我们可以像这样编写阶乘函数的递归实现：\n\n```\nfactorial <- function(n)\
  \ {\n  if (n == 1) {\n    1\n  } else {\n    n * factorial(n - 1)\n  }\n}\n```\n\
  \n这实际上是一种通用的算法策略，称为“分治法”。其核心思想是将问题分解为可以递归处理的子问题，然后以某种方式组合这些子问题的结果。\n\n考虑对一个数字序列进行排序。我们可以使用这种策略来排序一个序列：首先，我们有一个简单的基础——排序空序列或只有一个元素的序列很容易，因为我们不需要做任何操作。对于步骤，我们可以将序列分成两个大小相等的部分，并对它们递归地进行排序。现在我们有了两个已排序的序列，如果将这两个序列合并，我们就将它们组合成了一个有序的序列。\n\
  \n让我们开始吧。\n\n我们需要能够合并两个序列，因此我们先来解决这个问题。这应该可以用递归函数来实现，因为如果任一序列为空，我们就遇到了一个基本情况，可以直接返回另一个序列。如果两个序列中都存在元素，我们可以选择第一个元素较小的那个序列，将该元素提取出来作为最终结果中的第一个元素，然后将其与剩余数字合并的结果拼接起来：\n\
  \n```\nmerge <- function(x, y) {\n  if (length(x) == 0) return(y)\n  if (length(y)\
  \ == 0) return(x)\n  if (x[1] < y[1]) {\n    c(x[1], merge(x[-1], y))\n  } else\
  \ {\n    c(y[1], merge(x, y[-1]))\n  }\n}\n```\n\n这里需要快速说明一下：通常情况下，这个算法应该在线性时间内运行。但由于我们的递归调用方式，每次移除第一个元素时实际上都在复制向量，导致其成为二次时间复杂度的算法。实现一个线性时间复杂度的合并函数留作练习。\n\
  \n使用这个函数，我们可以实现一个排序函数。这个算法被称为归并排序，因此我们这样命名函数：\n\n```\nmerge_sort <- function(x)\
  \ {\n  if (length(x) < 2) return(x)\n  n <- length(x)\n  m <- n %/% 2\n  merge(merge_sort(x[1:m]),\
  \ merge_sort(x[(m+1):n]))\n}\n```\n\n如此，通过两个简单的递归函数，我们用几行代码解决了一个实际的算法问题。这通常是像 R\
  \ 这样的函数式编程语言中常用的方式。当然，如果使用循环更简单，你也不必执着于纯函数式递归。在任何情况下，使用最简单的方法，除非你觉得速度太慢。只有到那时，你才需要开始变通。\n\
  \n### 练习\n\n### 斐波那契数\n\n斐波那契数的定义如下：前两个斐波那契数为 1，即 *F*[1] = *F*[2] = 1。对于更大的斐波那契数，其定义为\
  \ *F*[*i*] = *F*[*i−*1] + *F*[*i−*2]。\n\n实现一个能够计算第 *n* 个斐波那契数的递归函数。\n\n通常，计算斐波那契数的递归函数效率很低，因为在递归调用中会多次重复计算相同的数值。因此，请实现另一个版本，以迭代方式（即从底部开始，逐步计算到第\
  \ *n* 个数，并且不进行递归调用）计算第 *n* 个斐波那契数。\n\n### 外积\n\n两个向量 v 和 w 的外积是一个矩阵，定义如下：\n\n![$$\
  \ v\\otimes w={vw}^T=\\left[\\begin{array}{c}{v}_1\\\\ {}{v}_2\\\\ {}{v}_3\\end{array}\\\
  right]\\left[{w}_1\\kern1em {w}_2\\kern1em {w}_3\\kern1em {w}_4\\right]=\\left[\\\
  begin{array}{cccc}{v}_1{w}_1&amp; {v}_1{w}_2&amp; {v}_1{w}_3&amp; {v}_1{w}_4\\\\\
  \ {}{v}_2{w}_1&amp; {v}_2{w}_2&amp; {v}_2{w}_3&amp; {v}_2{w}_4\\\\ {}{v}_3{w}_1&amp;\
  \ {v}_3{w}_2&amp; {v}_3{w}_3&amp; {v}_3{w}_4\\end{array}\\right] $$](images/439481_2_En_9_Chapter/439481_2_En_9_Chapter_TeX_Equa.png)\n\
  \n编写一个函数，计算两个向量的外积。\n\nR 语言中实际上有一个内置函数 `outer`，你现在正在覆盖它。即使覆盖之后，你仍然可以使用名称 `base::outer`\
  \ 来调用它。你可以用它来验证自己编写的函数是否正确。\n\n### 线性时间合并\n\n我们之前使用的 `merge` 函数在其递归调用中复制了向量。这使得它的速度慢于应有的水平。请实现一个线性时间复杂度的\
  \ `merge` 函数。\n\n不过在开始之前，你需要注意一点。如果你打算通过编写类似这样的代码来向向量追加元素：\n\n```\nv <- c(v, element)\n\
  ```\n\n那么你最终又会得到一个二次时间复杂度的算法。这是因为当你这样做时，实际上是在创建一个新的向量：首先将旧向量 `v` 中的所有元素复制到新向量的前几个位置，然后在末尾添加\
  \ `element`。如果你重复此操作 *n* 次，那么每次操作平均花费的时间复杂度就是 *n*²。正是由于人们在循环中执行类似操作（而非 R 解释器本身的问题），导致了\
  \ R 语言“循环很慢”的名声。除非万不得已，否则永远不要向向量追加元素。\n\n就 `merge` 函数而言，我们事先已经知道结果的长度，因此可以预先分配一个结果向量，并将单个元素复制进去。你可以像这样创建一个长度为\
  \ *n* 的向量：\n\n```\nn <- 5\nv <- vector(length = n)\n```\n\n如果将来有需要，你可以像这样创建一个长度为\
  \ *n* 的列表：\n\n```\nvector(\"list\", length = n)\n```\n\n\n\n### 二分查找\n\n二分查找是一种经典的算法，用于判断一个元素是否存在于有序序列中。它是一个简单的递归函数。基本情况处理只有一个元素的序列。此时，你可以直接将待查找元素与序列中的元素进行比较，以判断它们是否相同。如果序列中有多个元素，则选取中间元素。若该元素正是你要查找的，则查找结束，返回该元素包含在序列中的结果。若该元素小于待查找元素，则可知如果目标元素在列表中，它必定位于序列的后半部分，于是你可以在那半部分继续查找。若该元素大于待查找元素，则可知如果目标元素在序列中，它必定位于序列的前半部分，于是你递归地在此前半部分进行查找。\n\
  \n如果你完全按照上述描述实现，就需要递归调用子序列。这涉及为函数调用复制子序列，从而使实现的效率远低于应有的水平。请尝试实现无需复制序列的二分查找。\n\n\
  ### 更多排序算法\n\n在我们之前实现的归并排序中，我们通过将序列一分为二、对每个子序列排序、再合并它们来解决排序问题。若实现正确，此算法的时间复杂度为`O(n\
  \ log n)`，这是在我们假设对排序元素唯一能做的操作是比较它们时，排序算法所能达到的最优复杂度。\n\n如果我们的元素都是介于 1 到`n`之间的整数，并且共有`m`个元素，则可以使用桶排序在`O(n\
  \ + m)`时间内完成排序。该算法首先为 1 到`n`之间的每个数字创建一个计数向量，这需要`O(n)`时间。然后遍历序列中的`m`个元素，每当遇到数字`i`时就更新其计数器，此步骤耗时`O(m)`。最后，遍历从\
  \ 1 到`n`的这些数字，根据计数器的指示输出每个数字对应的次数，耗时`O(n + m)`。\n\n请实现桶排序。\n\n另一种基于递归的算法是快速排序，其期望时间复杂度为`O(n\
  \ log n)`。它的最坏情况复杂度实际上是`O(n²)`，但平均情况下运行时间为`O(n log n)`，且开销比归并排序小（如果实现正确的话）。\n\n\
  其工作原理如下：基本情况（单个元素）与归并排序相同。当有多个元素时，随机选择序列中的一个元素作为基准（pivot）。然后将序列拆分为小于基准的元素、等于基准的元素和大于基准的元素。递归地对较小元素和较大元素的序列进行排序。最后依次输出所有已排序的较小元素、等于基准的元素以及已排序的较大元素。\n\
  \n请实现快速排序。\n\n### 选取第 k 小的元素\n\n如果你有`n`个元素，并想要其中最小的`k`个，一个简单的解决方案是对元素排序，然后选取第`k`个。这种方法通常效果不错且在多数情况下足够快，但实际上可以更快地完成。因为，我们并不需要完全排序所有元素，只需将第`k`小的元素移动到序列中的第`k`个位置即可。\n\
  \n上一练习中的快速排序算法可以修改来解决此问题。每当我们根据基准将序列拆分为较小、等于和较大三部分时，我们递归地对较小和较大的元素进行排序。如果我们只关心最终会排在第`k`个位置的元素，那么我们就不需要对不包含此索引的序列进行排序。假设有`m\
  \ < k`个元素小于基准，我们可以将它们直接置于序列前端而无需排序。我们需要它们在那里，以确保第`k`小的元素能出现在正确的位置，但不需要它们有序。类似地，如果`k\
  \ < m`，我们则无需排序较大的元素。因为即使排序它们，它们最终也会位于大于`k`的索引位置，而我们并不关心这些。当然，如果有`m`个元素小于基准，`l`个元素等于基准，且满足`m\
  \ + l ≥ k`，那么第`k`小的元素就等于基准，我们可以直接返回它。\n\n请实现此算法。\n\n脚注 1   2\n\n"
- '# 10. 使用向量和列表


  在本章中，我们将进一步探讨向量和列表的使用。我们并不会涉及比上一章概念上更复杂的内容，只是深入一些更多的技术细节。




  ## 向量与向量化函数的使用


  我们从表达式开始回顾。在上一章中，我们看到了针对单个（标量）值的表达式，但同时也注意到 R 语言实际上并没有真正的标量值；我们所拥有的所有原始数据本质上都是数据向量。这意味着我们在
  R 中使用的表达式实际上是对向量进行操作，而非单个值。


  当你编写以下代码时：


  ```

  (x <- 2 / 3)

  ## [1] 0.6666667

  (y <- x ** 2)

  ## [1] 0.4444444

  ```


  你所写的表达式当然是在处理单个值——向量 `x` 和 `y` 的长度为 1——但这实际上只是向量操作的一个特例：


  ```

  (x <- 1:4 / 3)

  ## [1] 0.3333333 0.6666667 1.0000000 1.3333333

  (y <- x ** 2)

  ## [1] 0.1111111 0.4444444 1.0000000 1.7777778

  ```


  R 语言通过两条规则来处理向量：运算按元素逐个执行，并且向量会根据需要进行循环复用。


  当你编写诸如 `x + y` 这样的表达式时，实际上是在说你想创建一个新向量，该向量由向量 `x` 和 `y` 中对应元素逐个相加得到。因此，对于如下 `x`
  和 `y`：


  ```

  x <- 1:5

  y <- 6:10

  ```


  编写：


  ```

  (z <- x + y)

  ## [1]  7  9 11 13 15

  ```


  等同于编写：


  ```

  z <- vector(length = length(x))

  for (i in seq_along(x)) {

  z[i] <- x[i] + y[i]

  }

  z

  ## [1]  7  9 11 13 15

  ```


  所有算术表达式或涉及 `|` 或 `&` 的逻辑表达式（但不包括 `||` 或 `&&`；后者不按元素对向量进行操作）都是如此。对于大多数可以调用的函数，例如
  `sqrt` 或 `sin`，也是如此：


  ```

  sqrt((1:5)**2)

  ## [1] 1 2 3 4 5

  sin(sqrt((1:5)**2))

  ## [1]  0.8414710  0.9092974  0.1411200 -0.7568025

  ## [5] -0.9589243

  ```


  当你有一个涉及不同长度向量的表达式时，无法直接按元素求值。在这种情况下，R 会尝试重复较短的向量以创建相同长度的向量。为此，较短的向量的长度应能被最长向量的长度整除，也就是说，你应该能够将较短的向量重复整数次以得到最长向量的长度。如果可行，R
  会根据需要重复向量，使所有向量与最长向量等长，然后按元素进行操作：


  ```

  x <- 1:12

  y <- 1:2

  x + y

  ##  [1]  2  4  4  6  6  8  8 10 10 12 12 14

  z <- 1:3

  x + z

  ##  [1]  2  4  6  5  7  9  8 10 12 11 13 15

  ```


  如果较短的向量无法重复整数次以匹配长度，R 仍会根据需要重复多次以匹配最长的向量，但你会收到一个警告，因为大多数情况下此类问题是由错误代码引起的：


  ```

  z <- 1:5

  x + z

  ## Warning in x + z: longer object length is not a

  ## multiple of shorter object length

  ##  [1]  2  4  6  8 10  7  9 11 13 15 12 14

  ```


  在我们之前看到的表达式中：


  ```

  (x <- 1:4 / 3)

  ## [1] 0.3333333 0.6666667 1.0000000 1.3333333

  (y <- x ** 2)

  ## [1] 0.1111111 0.4444444 1.0000000 1.7777778

  ```


  不同的向量被重复使用。当我们将 `1:4` 除以 `3` 时，我们需要将（长度为 1）的向量 `3` 重复四次，才能将 `1:4` 向量与 `3` 向量相除。当我们计算
  `x ** 2` 时，也必须将 `2` 重复四次。


  无论何时你考虑对向量编写循环来对每个元素进行计算，都应优先考虑使用此类向量化表达式。这通常更不容易出错，而且由于它涉及由 R 运行时系统处理的隐式循环，几乎肯定比显式循环更快。


  ### `ifelse`


  控制结构不是向量化的。例如，`if` 语句就不是。如果想要根据向量 `x` 计算向量 `y`，使得当 `x[i]` 为偶数时 `y[i] == 5`，当 `x[i]`
  为奇数时 `y[i] == 15`，你无法将其写成一个向量表达式：


  ```

  x <- 1:10

  if (x %% 2 == 0) 5 else 15

  ## Warning in if (x%%2 == 0) 5 else 15:

  ## the condition has length > 1 and only the first element will be

  ## used

  ## [1] 15

  ```


  相反，你可以使用 `ifelse` 函数，它的工作方式类似于向量化选择；如果其第一个参数中的条件为真，则返回第二个参数的值，否则返回第三个参数的值，并且这是以向量操作的方式进行的：


  ```

  x <- 1:10

  ifelse(x %% 2 == 0, 5, 15)

  ##  [1] 15  5 15  5 15  5 15  5 15  5

  ```




  ### 向量化函数


  当你编写自己的函数时，可以使其能够处理向量，也就是说，你可以编写出能够将向量作为输入并返回向量作为输出的函数。如果以这种方式编写，它们就可以像 `sqrt` 和
  `sin` 等内置函数一样，在向量化表达式中使用。


  让函数适用于向量的最简单方法是，在函数体中使用能够处理向量的表达式：


  ```

  f <- function(x, y) sqrt(x ** y)

  f(1:6, 2)

  ## [1] 1 2 3 4 5 6

  f(1:6, 1:2)

  ## [1] 1.000000 2.000000 1.732051 4.000000 2.236068

  ## [6] 6.000000

  ```


  如果你编写的函数无法通过上述方式编写函数体，但又希望它能在向量表达式中使用，通常可以使用 `Vectorize` 函数来实现。


  举个例子，假设我们有一个将键映射到某些值的表格。设想一下，我们可能想将班级中的姓名映射到班级参与者的角色。在 R 语言中，我们通常使用列表来实现这类表格，并且可以轻松地编写一个函数来根据此表格将姓名映射到角色：


  ```

  role_table <- list("Thomas" = "Instructor",

  "Henrik" = "Student",

  "Kristian" = "Student",

  "Randi" = "Student",

  "Heidi" = "Student",

  "Manfred" = "Student")

  map_to_role <- function(name) role_table[[name]]

  ```


  当我们用单个姓名调用它时，该函数能按预期工作：


  ```

  map_to_role("Thomas")

  ## [1] "Instructor"

  map_to_role("Henrik")

  ## [1] "Student"

  ```


  但是，当我们用一个向量调用该函数时，它会失败，因为我们无法用向量以这种方式索引列表：


  ```

  x <- c("Thomas", "Henrik", "Randi")

  map_to_role(x)

  ## Error in role_table[[name]]: recursive indexing failed at level 2

  ```


  因此，我们有一个将单个值映射到单个值的函数，但它不适用于向量。让此类函数适用于向量的简单方法是使用 `Vectorize` 函数。该函数会封装你的函数，使其能够处理向量，并且它对向量所做的操作正如你所期望的那样：它会计算向量中每个元素对应的值，结果将是所有结果组成的向量：


  ```

  map_to_role <- Vectorize(map_to_role)

  map_to_role(x)

  ##        Thomas     Henrik      Randi

  ##  "Instructor"  "Student"  "Student"

  ```


  在这个特定表格示例中，失败的原因是我们使用了 `[[` 索引运算符。如果我们使用 `[` 运算符，就不会出问题（只不过结果是一个列表而不是向量）：


  ```

  role_table[c("Thomas", "Henrik", "Randi")]

  ## $Thomas

  ## [1] "Instructor"

  ##

  ## $Henrik

  ## [1] "Student"

  ##

  ## $Randi

  ## [1] "Student"

  ```


  因此，我们也可以通过不同的索引方式然后展平列表来直接处理向量输入：


  ```

  map_to_role_2 <- function(names) unlist(role_table[names])

  x <- c("Thomas", "Henrik", "Randi")

  map_to_role_2(x)

  ##       Thomas       Henrik        Randi

  ## "Instructor"    "Student"    "Student"

  ```


  不过，并非总能轻易地重写函数以使其适用于向量输入，当我们无法轻易做到这一点时，`Vectorize` 函数就会非常有用。


  补充一点，对值向量使用 `[[` 的问题不仅仅在于它不起作用。实际上它也能工作，但会执行与我们这里尝试不同的操作。如果你给 `[[` 一个索引向量，它将用于执行所谓的**递归索引**。这是一种快捷方式，它首先使用第一个变量在列表中查找，并提取出找到的向量或列表。然后，它再使用下一个索引对该序列进行查找，依此类推。以下面的代码为例：


  ```

  x <- list("first" = list("second" = "foo"), "third" = "bar")

  x[[c("first", "second")]]

  ## [1] "foo"

  ```


  这里，我们有一个包含两个元素的列表，其中第一个元素是一个包含单个元素的列表。我们可以通过索引 `"first"` 在第一个列表中查找，并得到存储在该索引处的列表。然后，我们可以使用索引
  `"second"` 对这个列表进行索引，从而得到 `"foo"`。


  其结果与下面代码类似：


  ```

  x[["first"]][["second"]]

  ## [1] "foo"

  ```


  这可能是一个有用的特性——尽管老实说，在我自己的编程中很少发现它的用处——但这并不是我们在角色映射示例中所期望的效果。


  ### `apply` 家族


  对函数进行向量化，使我们能够隐式地将其应用于向量。我们只需将向量作为输入传递给它，就能得到向量作为输出。但请注意，**仅因为函数接受向量作为输入，并不意味着它就是一个向量化函数**——许多函数将向量作为输入，但返回单个值作为输出，例如
  `sum` 和 `mean`——但我们使用这些函数的方式与使用向量化函数不同。如果你需要这类函数，你**必须**显式地处理它如何处理序列输入。


  向量化函数可以像处理单个值一样，使用完全相同的语法处理数据向量。这是一种隐式的向量操作方式。但是，当我们对向量中的所有元素调用函数时，我们也可以使其更加明确，从而让我们对函数的具体调用方式有更多控制。这反过来又让我们能够使用那些不仅实现向量到向量映射，也包括向量到单值映射的函数。


  实现这一点有很多方法——因为这在 R 语言中很常见——稍后我们将看到一些通用的函数，用于处理序列并以各种方式对其调用函数。不过，在你阅读的大部分代码中，执行此操作的函数名称通常包含
  `apply` 字样，我们接下来要研究的就是这些函数。


  我们从 `apply` 开始。这是一个用于操作向量、矩阵（二维向量）或数组（更高维度的向量）的函数。




  ### `apply`


  `apply` 函数在矩阵上最容易解释，因此我们先创建一个矩阵：


  ```

  m <- matrix(1:6, nrow = 2, byrow = TRUE)

  m

  ##      [,1] [,2] [,3]

  ## [1,]    1    2    3

  ## [2,]    4    5    6

  ```


  `apply` 函数接受（至少）三个参数。第一个是向量/矩阵/数组，第二个是我们应该沿着哪些维度进行边际化，第三个是我们应该应用的函数。


  这里的边际化是指，在维度的某个子集中固定一个索引，并提取出该索引对应的所有值。如果我们按行进行边际化，我们将提取所有行，因此对于每一行，我们将得到一个向量，其元素对应每一列，这就是我们将传递给函数的对象。


  我们可以使用 `paste` 函数来演示，该函数通过连接输入创建一个字符串。


  如果我们按行边际化，它将在每两行上各调用一次，并生成两个字符串：


  ```

  apply(m, 1, \(x) paste(x, collapse = ":"))

  ## [1] "1:2:3" "4:5:6"

  ```


  如果我们按列边际化，它将在每三列上各调用一次，并生成三个字符串：


  ```

  apply(m, 2, \(x) paste(x, collapse = ":"))

  ## [1] "1:4" "2:5" "3:6"

  ```


  如果我们同时按行和列边际化，它将在每个单独元素上调用：


  ```

  apply(m, c(1, 2), \(x) paste(x, collapse = ":"))

  ##      [,1] [,2] [,3]

  ## [1,] "1"  "2"  "3"

  ## [2,] "4"  "5"  "6"

  ```


  这里的输出是二维的。这是因为我们正在对两个维度进行边际化，因此我们得到了一个与这些边际相对应的输出。


  我们也可以通过其他方式获得更高维度的输出。如果我们应用的函数生成向量（或更高维度的向量）作为输出，那么 `apply` 的输出也将是更高维度的。考虑一个函数，它接收一个向量作为输入，并通过将其与自身连接来复制它。如果我们将其应用于行或列，我们将为每行/每列得到一个向量，因此输出必须是二维的：


  ```

  apply(m, 1, \(x) c(x,x))

  ##      [,1] [,2]

  ## [1,]    1    4

  ## [2,]    2    5

  ## [3,]    3    6

  ## [4,]    1    4

  ## [5,]    2    5

  ## [6,]    3    6

  apply(m, 2, \(x) c(x,x))

  ##      [,1] [,2] [,3]

  ## [1,]    1    2    3

  ## [2,]    4    5    6

  ## [3,]    1    2    3

  ## [4,]    4    5    6

  ```


  `apply` 在这里所做的是创建一个矩阵作为其结果，其中应用函数的结果按列从左到右收集。对两行调用函数的结果是一个具有两列的矩阵，第一列包含将函数应用于第一行的结果，第二列包含将其应用于第二行的结果。同样地，对于列，结果是一个具有三列的向量，输入矩阵中的每一列对应一列。


  如果我们对超过一个维度进行边际化——并通过这种方式获得多维输出——同时生成多个值，那么两种效果会结合起来，我们将得到更高维度的输出：


  ```

  apply(m, c(1,2), \(x) c(x,x))

  ## , , 1

  ##

  ##      [,1] [,2]

  ## [1,]    1    4

  ## [2,]    1    4

  ##

  ## , , 2

  ##

  ##      [,1] [,2]

  ## [1,]    2    5

  ## [2,]    2    5

  ##

  ## , , 3

  ##

  ##      [,1] [,2]

  ## [1,]    3    6

  ## [2,]    3    6

  ```


  这个输出看起来相当令人困惑。然而，发生的情况与我们之前看到按行或列边际化时相同。我们对调用函数的每个边际都会得到一个输出——在本例中，是输入中的六个单元格中的每一个——并且输出被“按列”收集，只是在更高维度上，它会在最高维度上被收集（对于二维矩阵，最高维度就是列）。因此，为了得到调用函数的六个值的结果，我们需要以它们在输入矩阵中被索引的相同方式索引这些结果——这就是边际所代表的——但我们必须在最高维度中这样做。因此，我们可以通过以下方式获得六个输入值的连接结果：


  ```

  x <- apply(m, c(1,2), \(x) c(x,x))

  k <- dim(x)[3]

  n <- dim(x)[2]

  for (i in 1:n) {

  for (j in 1:k) {

  print(x[,i,j])

  }

  }

  ## [1] 1 1

  ## [1] 2 2

  ## [1] 3 3

  ## [1] 4 4

  ## [1] 5 5

  ## [1] 6 6

  ```


  那么，如果要应用的函数除了从矩阵中获取的参数之外还需要其他参数，会发生什么情况呢？


  ```

  sumpow <- \(x, n) sum(x) ** n

  apply(m, 1, sumpow)

  ## Error in FUN(newX[, i], ...): argument "n" is missing, with no default

  ```


  ### 看起来并不顺利


  `apply` 函数期望传递给它的值，但它事先不知道如何提供额外的参数。如果你希望 `apply` 将这些额外参数传递给函数，则必须向 `apply` 提供它们。你可以将这些参数作为
  `apply` 的附加参数传入；它们将按照你提供给 `apply` 的顺序传递给函数：


  ```

  apply(m, 1, sumpow, 2)

  ## [1]  36 225

  ```


  不过，明确命名这些参数会大大提高可读性：


  ```

  apply(m, 1, sumpow, n = 2)

  ## [1]  36 225

  ```


  ### `lapply`


  `lapply` 函数用于在列表上进行映射。给定一个列表作为输入，它将函数应用于列表中的每个元素，并输出一个与输入长度相同的列表，其中包含应用函数的结果：


  ```

  (l <- list(1, 2, 3))

  ## [[1]]

  ## [1] 1

  ##

  ## [[2]]

  ## [1] 2

  ##

  ## [[3]]

  ## [1] 3

  lapply(l, \(x) x**2)

  ## [[1]]

  ## [1] 1

  ##

  ## [[2]]

  ## [1] 4

  ##

  ## [[3]]

  ## [1] 9

  ```


  如果输入列表中的元素有名称，则这些名称会在输出向量中保留：


  ```

  l <- list(a=1, b=2, c=3)

  lapply(l, \(x) x**2)

  ## $a

  ## [1] 1

  ##

  ## $b

  ## [1] 4

  ##

  ## $c

  ## [1] 9

  ```


  如果你提供的输入是向量而不是列表，它会将其转换为列表，并且你总是会得到一个列表作为输出：


  ```

  lapply(1:3, \(x) x**2)

  ## [[1]]

  ## [1] 1

  ##

  ## [[2]]

  ## [1] 4

  ##

  ## [[3]]

  ## [1] 9

  ```


  如果列表的元素比单个数字更复杂，你仍然只是将函数应用于这些元素：


  ```

  lapply(list(a=1:3, b=4:6), \(x) x**2)

  ## $a

  ## [1] 1 4 9

  ##

  ## $b

  ## [1] 16 25 36

  ```


  ### `sapply` 和 `vapply`


  `sapply` 函数的功能与 `lapply` 相同，但会尝试简化输出。本质上，它尝试将从 `lapply` 返回的列表转换为某种向量。它使用一些启发式规则来猜测你想要的输出类型，在可以简化时进行简化，但在无法确定时返回一个列表：


  ```

  sapply(1:3, \(x) x**2)

  ## [1] 1 4 9

  ```


  这种猜测在交互式工作中很出色，但在编写程序时可能不安全。当你能够看到它创建了什么时，它猜测并产生不同类型的输出不是问题，但在程序内部深处是不安全的。


  `vapply` 函数的功能与 `sapply` 基本相同，但没有猜测。你必须告诉它你想要的输出类型，如果它无法生成该输出，它将返回一个错误，而不是生成一个你的程序可能知道也可能不知道如何处理的结果。


  这两个函数接口的区别在于，`vapply` 期望第三个参数，该参数应该是输出类型的值：


  ```

  vapply(1:3, \(x) x**2, 1)

  ## [1] 1 4 9

  ```


  ## 高级函数


  现在我们来看一些函数的特例。本节虽然名为“高级函数”，但这些函数并非真正高级；它们只是比我们已经见过的那些基本函数稍微复杂一点而已。




  ### 特殊名称


  但首先，需要先谈谈名称问题。函数可以拥有与变量同类的名称——毕竟，当我们命名一个函数时，实际上只是在命名一个恰好保存了函数的变量——但我们不能把所有类型的名称都放在赋值运算符的右侧。例如，`if`
  在 R 中是一个函数，但你无法将 `if` 写在赋值的左侧。


  具有特殊名称的函数，即通常不能放在赋值前的名称，可以通过将它们放在反引号中来引用，因此函数 `if` 可以被称为 `` `if` ``。


  任何函数都可以通过其放在反引号中的名称来引用，此外，你还可以在通常无法使用其名称的上下文中使用反引号来引用函数。这适用于调用函数，例如，你可以将中缀运算符当作普通函数调用来使用：


  ```

  2 + 2

  ## [1] 4

  `+`(2, 2)

  ## [1] 4

  ```


  或者当为函数分配变量名称时：


  ```

  `%or die%` <- function(test, msg) if (!test) stop(msg)

  x <- 5

  (x != 0) %or die% "x 不应为零"

  x <- 0

  (x != 0) %or die% "x 不应为零"

  ## Error in (x != 0) %or die% "x 不应为零": x 不应为零

  ```


  ### 中缀运算符


  如果最后一个例子让你觉得奇怪，那可能只是因为你还不了解 R 的中缀运算符。在 R 中，任何以 `%` 开头和结尾的变量都被视为中缀运算符，因此调用 `x %foo%
  y` 等同于调用 `` `%foo%`(x, y) ``。几个内置的中缀运算符不具有这种名称，`+` 和 `*` 就是两个例子，但这种命名约定使得创建你自己的中缀运算符成为可能。我们在
  `dplyr` 包的 `%>%` 管道运算符中看到了它的良好应用。


  ### 替换函数


  替换函数是那些假装在修改变量的函数。我们之前见过一个例子，即给向量分配名称：


  ```

  v <- 1:4

  names(v) <- c("a", "b", "c", "d")

  v

  ## a b c d

  ## 1 2 3 4

  ```


  这里发生的事情是，R 识别出你正在向一个函数调用赋值，然后去寻找一个名为 `` `names<-` `` 的函数。它用向量 `v` 和名称向量调用这个函数，并且函数调用的结果被重新赋值给变量
  `v`。


  所以我刚才写的内容意味着


  ```

  names(v) <- c("a", "b", "c", "d")

  ```


  是以下内容的简写


  ```

  v <- `names<-`(v, c("a", "b", "c", "d"))

  ```


  替换函数通常用于修改对象的各种属性，你可以通过使用其名称必须以 `` `<-` `` 结尾的约定来编写你自己的替换函数：


  ```

  `foo<-` <- function(x, value) {

  x$foo <- value

  x

  }

  `bar<-` <- function(x, value) {

  x$bar <- value

  x

  }

  x <- list(foo = 1, bar = 2)

  x$foo

  ## [1] 1

  foo(x) <- 3

  x$foo

  ## [1] 3

  x$bar

  ## [1] 2

  bar(x) <- 3

  x$bar

  ## [1] 3

  ```


  请记住，这只是调用函数然后将结果重新赋值给一个变量的语法糖。它实际上并没有修改任何数据。这意味着如果你有两个变量指向同一个对象，只有你调用替换函数的那个变量会受到影响。替换函数会返回一个副本，该副本被赋值给第一个变量，而另一个变量仍然指向旧对象：


  ```

  y <- x

  foo(x) <- 5

  x

  ## $foo

  ## [1] 5

  ##

  ## $bar

  ## [1] 3

  y

  ## $foo

  ## [1] 3

  ##

  ## $bar

  ## [1] 3

  ```


  因为替换函数只是函数调用和随后重新赋值的语法糖，所以你不能将某个无法被赋值的表达式作为替换函数的第一个参数。


  关于替换函数还有一些其他规则。首先，你正在赋值的值的参数必须命名为 `value`。你不能给它起其他名字：


  ```

  `foo<-` <- function(x, val) {

  x$foo <- val

  x

  }

  x <- list(foo = 1, bar = 2)

  foo(x) <- 3

  ## Error in `foo<-`(`*tmp*`, value = 3): unused argument (value = 3)

  ```


  R 重写表达式的方式假定你将值参数命名为 `value`，所以请这样做。


  不过，你不需要将第一个参数命名为 `x`：


  ```

  `foo<-` <- function(y, value) {

  y$foo <- value

  y

  }

  x <- list(foo = 1, bar = 2)

  foo(x) <- 3

  x$foo

  ## [1] 3

  ```


  如果你有超过两个参数，还应该将 `value` 参数作为最后一个参数。只要你要修改的对象是第一个参数，并且 `value` 参数是最后一个参数，这是允许的：


  ```

  `modify<-` <- function(x, variable, value) {

  x[variable] <- value

  x

  }

  x <- list(foo = 1, bar = 2)

  modify(x, "foo") <- 3

  modify(x, "bar") <- 4

  x$foo

  ## [1] 3

  x$bar

  ## [1] 4

  ```


  ## 数据到底有多可变？


  我们刚刚看到，替换函数会创建一个新副本，所以如果我们用它来修改一个对象，实际上根本没有改变它。引用同一对象的其他变量将看到旧值，而不是更新后的值。所以我们可以合理地提问：到底怎样才能实际修改一个对象？


  简短且几乎总是正确的答案是，你永远无法修改对象。^(²¹) 每当你“修改”一个对象时，你都是在创建一个新副本，然后将这个新副本重新赋值给你用来引用旧值的那个变量。


  对于向向量或列表中的索引赋值，情况也是如此。你会创建一个副本，虽然看起来像是在修改它，但如果你通过另一个引用查看旧对象，你会发现它并没有改变：


  ```

  x <- 1:4

  f <- function(x) {

  x[2] <- 5

  x

  }

  x

  ## [1] 1 2 3 4

  f(x)

  ## [1] 1 5 3 4

  x

  ## [1] 1 2 3 4

  ```


  除非你更改了 `` `` `` 函数（我强烈建议你不要这么做），否则它是一个所谓的原始函数。这意味着它是用 C 语言编写的，并且在 C 语言中，你实际上可以修改一个对象。这对效率来说很重要。如果向量只有一个引用，那么向其赋值将不会创建新副本，并且你将在原地修改该向量，这是一种常数时间操作。如果有两个引用指向该向量，那么当你第一次向其赋值时，会创建一个副本，然后你可以就地修改该副本。这种保持对象不可变但仍能保证一定效率的方法称为写时复制。


  为了编写正确的程序，请始终记住，你并不是在修改对象，而是在创建副本——你所“修改”的值的其他引用仍然会看到旧值。为了编写高效的程序，也请记住，对于原始函数，只要对象只有一个引用，你就可以进行高效的更新（常数时间的更新，而不是与你所修改对象的大小成比例的时间）。


