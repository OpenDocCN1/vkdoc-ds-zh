  \n\n\n### 使用“跨工作表填充”将数据复制到其他工作表\n\n您可以使用“`跨工作表填充`”复制命令，将一张工作表上的全部或部分数据复制到其他工作表。执行“`跨工作表填充`”复制命令的步骤如下：\n\
  \n1.  选择要复制到其他工作表的单元格。您只能选择整个工作表或单个区域。如果要复制多个区域，则需要重复这些步骤。\n2.  选择要复制数据的目标工作表标签。\n\
  3.  在功能区上，单击“`开始`”选项卡，在“`编辑`”组中，单击“`填充`”按钮。选择“`跨工作表`”。“`跨工作表填充`”对话框将打开。您可以在此处选择要复制全部、仅数据或仅格式。\n\
  \n**练习 11-3：使用“跨工作表填充”复制命令**\n\n在本练习中，您将把数据从一个工作表复制到其他工作表。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig15_HTML.jpg](img/385660_2_En_11_Fig15_HTML.jpg)\n\
