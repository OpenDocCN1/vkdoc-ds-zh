  \ 13-79 显示了选中的“北部”组。\n\n1.  在功能区“插入”选项卡上，单击“图表”组的对话框启动器（查看所有图表）。\n2.  单击“所有图表”选项卡。在左侧窗格中选择`旭日图`。单击“确定”按钮。\n\
