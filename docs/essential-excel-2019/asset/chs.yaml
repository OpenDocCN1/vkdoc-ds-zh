  \n**图 14-47** 表已加载到工作表中\n\n这些表是查询。网站上的原始数据并未更改。\n\n## 总结\n\n数据可以从许多不同的数据源导入 Excel。你可以使用单个数据源或多个数据源。数据导入后，就可以利用\
  \ Excel 强大的分析功能。\n\nPower Query 允许你从许多不同的源中提取、传输、操作、链接和加载数据到 Excel。\n\n有许多不同的文件类型，例如文本文件、Access\
  \ 文件、Microsoft 查询文件等。不同的文件类型可以使用不同的 Excel 选项。\n\n文本文件是不包含格式的文件，这使得它们易于导入。它们可以是分隔符分隔的或固定宽度的。在文本分隔文件中，字段由逗号或分号等字符分隔。在固定宽度的文本文件中，所有字段具有相同的长度。空格被添加到字段中，以使其长度相同。\n\
  \n下一章将介绍数据透视表和数据透视图。数据透视表比普通 Excel 表具有更强大的功能。如果希望数据成为行，可以将其拖到一个区域；如果希望成为列，则拖到另一个区域；如果希望汇总，则拖到另一个区域。数据透视图比普通\
  \ Excel 图表更具优势，因为它们可以被筛选。用户可以选择要在数据透视图中显示哪些项目。\n\n"
- "# 15. 使用数据透视表和数据透视图\n\n很少有人使用数据透视表，但他们可能错过了 Excel 中最强大的组件。学习它需要一点时间，但一旦你掌握了它，你将成为一个\
  \ Excel 高级用户，能够以你能想到的几乎任何形式对数据进行分组和汇总。你的老板会对你能够做到的事情感到惊讶。如果你是老板，你将会更加惊讶于自己的能力。数据透视表可以创建管理者希望看到的报告类型——这些报告不包含每一个细节，而是只包含他们在想查看时想看到的数据。\n\
  \n阅读并完成本章后，你应该能够：\n\n*   创建数据透视表\n*   从数据源创建数据透视图\n*   从数据透视表创建数据透视图\n*   重新排列和筛选数据透视表\n\
  *   从数据源创建多个数据透视表\n*   清除、移动和删除数据透视表\n*   使用切片器工具\n*   使用时间间隔工具\n*   筛选数据\n*   创建关系数据库\n\
  \n\n\n## 使用数据透视表\n\n它被称为数据透视表，是因为你可以**透视**数据，在行与列之间切换。你可以将现有数据动态重新排列成几乎无穷无尽的不同视图。通过将字段拖放到不同位置，你可以快速创建这些视图。随后，Excel\
  \ 会自动重新计算结果，以匹配你所创建的视图。\n\n你可以从已命名的表格或尚未声明为表格的数据区域创建数据透视表。从已命名的表格创建数据透视表的好处在于，你可以利用表格功能，例如在添加数据行时自动扩展表格。\n\
  \nExcel 会分析你的数据，然后显示“推荐的数据透视表”，供你选择符合需求的数据透视表。我们稍后会探讨此功能，但在第一次练习中，我们将从一个手动创建数据透视表的简单示例开始。\n\
  \nWork & Leisure 公司是一家连锁企业，在全国不同地区设有四家分店。该公司销售体育用品、户外家具和工具。图 15-1 中的电子表格显示了该公司在这些类别下销售的产品，以及上个月该产品的销售数量。\n\
  \n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig1_HTML.jpg](img/385660_2_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1\n\n用于数据透视表的数据\n\n## 练习 15-1：手动创建数据透视表\n\n在本练习中，你将创建一个数据透视表。你将练习重新排序列和行数据、添加和删除字段、更改数据顺序、查看不同的数据汇总方式、筛选数据以及更改数据源位置。\n\
  \n1. 在“数据透视表字段”列表中，选中“类别”旁边的复选框。\n\n默认情况下，“类别”会进入“行”区域，因为它包含文本。这些类别会以其在各自门店下的形式作为行显示在数据透视表中。即使这些类别在你使用的表格中未按顺序排列，它们在数据透视表中也会被放置到正确的顺序。此时，数据透视表会显示每家门店的总销售额、每个类别的销售额以及总计。\n\
  \n2. 选中“门店”字段的复选框。参见图 15-3。“门店”字段包含文本数据。包含文本的列默认会放入“行”区域。\n\n3. 选中“销售数量”的复选框。“销售数量”字段包含数值数据。包含数值数据的列默认会放入“值”区域。\n\
  \n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig3_HTML.jpg](img/385660_2_En_15_Fig3_HTML.jpg)\n\
  \n图 15-3\n\n选择要在数据透视表中使用的字段\n\n现在，数据透视表将每家门店显示在各自的行中，并汇总了每家门店的所有销售额。它还显示了一个总计，包含所有门店的销售总额。\n\
  \n**注意** 在执行此练习时，你可能需要使用状态栏上的缩放工具来同时查看整个电子表格和数据透视表。\n\n4. “数据透视表字段”列表由五个独立区域组成。\n\
  \   * “字段”区域：列出表格中所有列的名称，每个列名旁边都有一个复选框。\n   * “筛选器”区域\n   * “列”区域\n   * “行”区域\n\
  \   * “值”区域\n\n5. 打开工作簿 `Chapter15_PivotTables`。\n\n6. 选择名为 `PivotTable1` 的工作表。\n\
  \n7. 单击数据区域内的任意位置。单击功能区的“插入”选项卡。在“表格”组中，单击“数据透视表”按钮。\n\n8. “创建数据透视表”对话框会显示，并已选中一个区域。该区域应包含单元格\
  \ `$A$2:$D$18`。参见图 15-2。如果文本框中显示的区域不是这个，请进行修改。\n\n9. 将数据透视表报表的位置更改为“现有工作表”。\n\n\
  10. 在“位置”文本框中输入 `F2`。\n\n11. 单击“确定”按钮。\n\n\n\n![images/385660_2_En_15_Chapter/385660_2_En_15_Fig2_HTML.jpg](img/385660_2_En_15_Fig2_HTML.jpg)\n\
  \n图 15-2\n\n选择现有工作表\n\n## 隐藏和显示数据透视表字段列表\n\n只有当你选中数据透视表中的一个单元格时，数据透视表字段列表才会显示。选中数据透视表外任意位置的单元格，该窗格就会消失。\n\
  \n1. 单击单元格 `A2`。窗格消失。\n2. 单击单元格 `F2`。窗格重新出现。\n\n## 折叠和展开分组\n\n请注意，每个店铺左侧都有减号。这些减号允许你折叠店铺下方显示的内容。\n\
  \n1. 单击加号以展开店铺 2 的详细信息。\n2. 单击店铺 2 左侧的减号。\n\n减号会变为加号。参见图 15-4。\n\n![images/385660_2_En_15_Chapter/385660_2_En_15_Fig4_HTML.jpg](img/385660_2_En_15_Fig4_HTML.jpg)\n\
  \n图 15-4\n\n加号和减号可用于折叠和展开类别\n\n## 查看字段值\n\n你可以通过将鼠标移到数据透视表字段列表中的某个字段上，然后单击向下箭头，来查看该字段（列）中的所有不同值。\n\
  \n1. 单击“取消”按钮。\n2. 将鼠标移到数据透视表字段列表中的“店铺”字段上。单击“店铺”右侧的向下箭头。参见图 15-5。这将显示“店铺”字段中的所有不同值。参见图\
  \ 15-6。\n\n![images/385660_2_En_15_Chapter/385660_2_En_15_Fig6_HTML.jpg](img/385660_2_En_15_Fig6_HTML.jpg)\n\
  \n图 15-6\n\n显示“店铺”字段中的所有不同值\n\n![images/385660_2_En_15_Chapter/385660_2_En_15_Fig5_HTML.jpg](img/385660_2_En_15_Fig5_HTML.jpg)\n\
  \n图 15-5\n\n单击“店铺”右侧的向下箭头\n\n## 筛选数据\n\n![images/385660_2_En_15_Chapter/385660_2_En_15_Fig11_HTML.jpg](img/385660_2_En_15_Fig11_HTML.jpg)\n\
  \n图 15-11\n\n删除数据透视表字段列表和拖放区域之间的空间\n\n1. 由于你当前选中了一个产品，因此会列出所有可用产品。单击“取消”按钮。\n2.\
  \ 在数据透视表中，单击店铺 1 下的“户外家具”。\n3. 单击列标题“行标签”右侧的向下箭头。由于你选中了一个类别，因此会列出所有可用类别。单击“取消”按钮。\n\
  4. 单击店铺 1。单击列标题“行标签”右侧的向下箭头。由于你选中了一个店铺，因此会列出所有可用店铺。我们只想显示店铺 2 的销售额。单击除店铺 2 之外所有店铺旁边的复选框以取消选中它们。单击“确定”按钮。“行标签”右侧的向下箭头会变为筛选图标。\n\
  5. 通过单击“行标签”旁边的筛选图标，然后单击“全选”复选框，恢复显示所有店铺。（你也可以通过单击“从‘店铺’中清除筛选”来实现相同效果。）单击“确定”按钮。\n\
  6. 数据透视表字段列表中的字段与拖放区域之间可能会有一个较大的空白区域。这个区域可能会阻止你看到拖放区域中的所有字段。将光标移动到文本“在以下区域间拖动字段：”上方的虚线上。当光标变为双向箭头时，向上移动鼠标光标以删除部分空间。参见图\
  \ 15-11。\n7. 单击“从‘产品’中清除筛选”。这会将“蝙蝠”和“自行车”的值添加到数据透视表中。\n8. 在数据透视表中，单击“户外家具”下的“躺椅”。\n\
  9. 单击“行标签”列标题右侧的向下箭头。参见图 15-10。\n\n![images/385660_2_En_15_Chapter/385660_2_En_15_Fig10_HTML.jpg](img/385660_2_En_15_Fig10_HTML.jpg)\n\
  \n图 15-10\n\n单击“行标签”列标题右侧的向下箭头\n\n\n\n1.  点击`筛选`按钮。\n\n2.  点击`选择`字段的下拉箭头，然后选择`产品`。参见图\
  \ 15-9。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig9_HTML.jpg](img/385660_2_En_15_Fig9_HTML.jpg)\n\
  \n图 15-9\n\n选择产品\n\n1.  在`数据透视表字段`列表中，点击`产品`旁边的复选框。`产品`将按各自的类别显示在`数据透视表`中。如有需要，可加宽列宽。请注意，其中没有棒球棍和自行车。\n\
  \n`数据透视表`中的`行标签`标题旁边会出现一个`筛选`按钮。参见图 15-8。\n\n2.  将鼠标移至`筛选`按钮上。系统会显示一条消息，告知您已基于`产品`字段手动对`数据透视表`应用了筛选。\n\
  \n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig8_HTML.jpg](img/385660_2_En_15_Fig8_HTML.jpg)\n\
  \n图 15-8\n\n行标签标题旁边出现一个筛选按钮\n\n1.  将鼠标光标移至`字段列表`中的“`产品`”一词上。点击`产品`右侧的下拉箭头。将显示表中所有产品的列表。\n\
  \n2.  点击棒球棍和自行车旁边的复选框，取消勾选。\n\n3.  点击`确定`按钮。\n\n该行上会出现一个筛选图标（图 15-7），提示您如果使用此字段，将不会显示所有项目。\n\
  \n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig7_HTML.jpg](img/385660_2_En_15_Fig7_HTML.jpg)\n\
  \n图 15-7\n\n字段右侧的筛选图标告知您该字段已被筛选，因此该字段的部分项目将不会显示\n\n由于`产品`字段尚未放入`数据透视表`中，执行筛选操作对`数据透视表`中当前显示的内容没有影响。\n\
  \n## 更改字段顺序\n\n字段在`数据透视表字段`列表的`行`放置区中的放置顺序，会影响它们在`数据透视表`中的显示顺序。因此，您需要注意将项目拖放到放置区时的顺序。\n\
  \n1.  在此处，您可以筛选要显示的列。点击`工具`旁边的复选框将其取消勾选。点击`确定`按钮。`列标签`右侧的下拉箭头会变为筛选图标。\n\n1.  查看`数据透视表`。现在，体育用品归于棒球棍之下，户外家具归于休闲椅之下。这是不正确的。\n\
  \n2.  将`类别`从`行`区域拖至`列`区域。现在，类别在`数据透视表`中作为列而非行显示。请注意`数据透视表`如何自动调整了总计。\n\n3.  点击`数据透视表`中`列标签`右侧的下拉箭头。参见图\
  \ 15-13。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig13_HTML.jpg](img/385660_2_En_15_Fig13_HTML.jpg)\n\
  \n图 15-13\n\n点击列标签右侧的下拉箭头\n\n1.  在`行`区域中，将`产品`拖至`类别`上方。参见图 15-12。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig12_HTML.jpg](img/385660_2_En_15_Fig12_HTML.jpg)\n\
  \n图 15-12\n\n将产品拖至类别上方\n\n## 从数据透视表中删除字段\n\n从`数据透视表字段`列表的任一个放置区中删除字段，会将该字段从`数据透视表`中移除。\n\
  \n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig14_HTML.jpg](img/385660_2_En_15_Fig14_HTML.jpg)\n\
  \n图 15-14\n\n将字段拖过电子表格时，字段名称下方会显示一个 X\n\n1.  将`类别`字段从`列`放置区拖到电子表格中。\n\n2.  将字段拖过电子表格时，字段名称下方会显示一个\
  \ X。参见图 15-14。此时停止拖动。\n\n`类别`字段的信息将从`数据透视表`中移除。\n\n## 汇总值\n\n\n\n“值”区域中的字段使用`Sum`函数进行汇总。图\
  \ 15-15 显示“单位销售额”已被求和。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig15_HTML.jpg](img/385660_2_En_15_Fig15_HTML.jpg)\n\
  \n图 15-15\n\n商店 1 中的值已求和。总和为 543。\n\n可以通过右键单击数据透视表上的`Sum of Unit Sales`，然后选择`Summarize\
  \ Values By`来更改计算类型。请参见图 15-16。\n\n在这里，除了`Sum`函数之外，您还可以选择使用`Count`、`Average`、`Max`、`Min`或`Product`函数。\n\
  \n您很少会用到`Product`函数。它会将某个分组下的所有值相乘。例如，在图 15-15 中，它将通过计算 300 * 125 * 118 来确定商店 1\
  \ 的乘积。您可以通过单击`More Options…`来查看其他可用函数，例如方差和标准差。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig16_HTML.jpg](img/385660_2_En_15_Fig16_HTML.jpg)\n\
  \n图 15-16\n\n可以通过右键单击`Sum of Unit Sales`，然后选择`Summarize Values By`来更改计算类型。\n\n1.\
  \  在数据透视表中右键单击`Sum of Unit Sales`，然后选择`Summarize Values By`。\n2.  单击`Average`。现在每个“单位销售额”都变成了平均值，并且列标题也变为了`Average\
  \ of Unit Sales`。\n3.  尝试其他选项。\n\n### 更改数据源位置\n\n1.  单击`OK`按钮。您的数据透视表现在应包含您添加的记录。\n\
  2.  重新选择您的数据范围，使其包含您添加的两条记录（在选择时不要忘记包含列标题）。请参见图 15-19。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig19_HTML.jpg](img/385660_2_En_15_Fig19_HTML.jpg)\n\
  \n图 15-19\n\n重新选择您的数据范围，使其包含您添加的两条记录。\n\n3.  单击数据透视表中的任意位置。单击功能区上的`Analyze`选项卡，在`Data`组中，单击`Change\
  \ Data Source`按钮的上半部分。请参见图 15-18。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig18_HTML.jpg](img/385660_2_En_15_Fig18_HTML.jpg)\n\
  \n图 15-18\n\n选择`Change Data Source`按钮的上半部分。\n\n4.  将图 15-17 中的记录添加到工作表中。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig17_HTML.jpg](img/385660_2_En_15_Fig17_HTML.jpg)\n\
  \n图 15-17\n\n添加这两条记录。\n\n您添加的记录并未添加到数据透视表中。因为我们为数据源选择了数据区域而不是表格，所以我们必须更改数据源的位置以包含这些新记录。\n\
  \n### 练习 15-2：使用推荐的数据透视表\n\n在本练习中，您将根据所选表格数据查看 Excel 的推荐数据透视表格式。\n\n1.  单击`Cancel`按钮。\n\
  2.  单击功能区上的`Insert`选项卡。在`Tables`组中，单击`Recommended PivotTables`按钮。这将打开与您在`Quick Analysis`中单击`More`选项时看到的相同的`Recommended\
  \ PivotTables`对话框。\n3.  在左侧窗格中选择最后一个数据透视表。单击`OK`按钮。\n4.  新的数据透视表将在新工作表中创建。\n5. \
  \ 如果尚未打开，请打开工作簿`Chapter15_PivotTables`。\n6.  选择名为`Recommended`的工作表。\n7.  选择区域`A2:D20`。单击所选区域右下角的`Quick\
  \ Analysis`按钮![../images/385660_2_En_15_Chapter/385660_2_En_15_Figa_HTML.jpg](img/385660_2_En_15_Figa_HTML.jpg)。\n\
  8.  从顶部选项卡中选择`Tables`。将光标移到四个推荐的数据透视表上。如果其中任何一个符合您的需求，您可以单击它，Excel 将在单独的工作表中创建该数据透视表。\n\
  \n\n4.  点击 `更多` 按钮。\n\n左侧窗格包含六个推荐的数据透视表。在左侧窗格中点击任一数据透视表视图，右侧窗格会显示该数据透视表的放大视图。参见图\
  \ 15-20。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig20_HTML.jpg](img/385660_2_En_15_Fig20_HTML.jpg)\n\
  \n**图 15-20** 在左侧窗格中点击一个推荐的数据透视表，即可在右侧窗格中查看其放大视图\n\n## 练习 15-3：在数据透视表中处理日期和时间\n\n\
