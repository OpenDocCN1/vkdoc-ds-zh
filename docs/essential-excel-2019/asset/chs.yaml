  \n图 1-40  \n联系支持人员\n\n#### 帮助\n\n在“帮助”选项卡上单击 `帮助` 按钮，提供了选择帮助主题或输入搜索主题的另一种方式。见图 1-41。\n\
  \n![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig41_HTML.jpg](img/385660_2_En_1_Fig41_HTML.jpg)\n\
  \n图 1-41  \n帮助\n\n## 总结\n\n你已经学会了如何创建、保存和打开工作表，以及如何使用功能区。你还练习了自定义功能区以及创建快速访问工具栏以满足特定需求。这些是开始使用\
  \ Excel 强大功能所需的基本技能。Excel 拥有丰富的帮助功能。它提供了多种途径来获取同一个帮助主题。你可以就任何主题向 Excel 寻求帮助。屏幕提示和“告诉我你想要做什么”功能是\
  \ Excel 中最方便的两种帮助功能。你可以在处理工作表时，获得关于格式化和输入数据等问题的直观帮助。智能查找让你无需离开工作表即可使用互联网资源。你可以使用“帮助”选项卡上的任何附加功能来获取更多帮助或\
  \ Microsoft 支持。在第 2 章中，你将练习在工作表中移动。你将学习有用的快捷键，帮助你高效、轻松地在工作表中移动，减少在重复性任务上花费的时间。\n\
  \n"
- "# 2. 导航与使用工作表\n\n在本章中，你将学习如何使用鼠标和键盘命令在工作表中导航。你还会熟悉一些快捷键，这些快捷键有助于你在单元格之间快速移动，并开始练习在同一个工作簿内使用多个工作表。\n\
  \n阅读并完成本章学习后，你将能够：\n\n- 在工作表中轻松移动\n- 使用快捷键跳转到不同单元格\n- 引用单个单元格、列、行或单元格区域\n- 使用鼠标选择单元格\n\
  - 使用键盘选择单元格\n- 使用名称框选择单元格\n- 重命名工作表\n- 添加和删除工作表\n- 更改工作表的选项卡颜色\n- 选择多个工作表\n- 隐藏和取消隐藏工作表\n\
  - 对工作表进行重新排序和复制\n- 在工作表之间移动\n\nExcel 旨在让初学者能够快速学习和使用。这些练习将指导你探索如何创建、输入和操作数据。随着你熟悉\
  \ Excel 的功能，很容易进行各种调整。\n\n\n\n## 使用键盘在单元格间移动\n\n由于工作表中包含大量单元格，因此需要一种快速导航的方式。掌握移动快捷键能以最短时间定位到目标单元格，从而节省时间。单击单元格使其成为活动单元格，或使用表\
  \ 2-1 中的组合键直接跳转到指定单元格。\n\n表 2-1\n\n跳转至单元格的快捷键\n\n| 更改活动单元格的目标 | 按键 |\n| --- | ---\
  \ |\n| 向下移动到下一个单元格 | `Enter` |\n| 向上移动到上一个单元格 | `Shift + Enter` |\n| 移动到下一个单元格 |\
  \ `Tab` |\n| 移动到上一个单元格 | `Shift + Tab` |\n| 移动到行首单元格 | `Home` |\n| 沿箭头方向移动到下一个单元格\
  \ | `上箭头`、`下箭头`、`左箭头`或`右箭头`键 |\n| 移动到工作表中包含数据的最后一个单元格 | `Ctrl + End` |\n| 移动到工作表首个单元格\
  \ | `Ctrl + Home` |\n| 移动到下一屏的单元格 | `Page Down` |\n| 移动到上一屏的单元格 | `Page Up` |\n\
  | 沿箭头方向移动到该方向最后一个单元格（前提是中间无空白单元格） | `Ctrl + 箭头键` |\n\n**练习 2-1：在工作表中移动**\n\n本练习将介绍使用键盘移动的基本技巧。\n\
  \n**注意** 在执行此练习时，如果所用计算机的箭头键同时具有其他功能，您可能需要根据需求单击 `Num Lock` 键来开启或关闭数字锁定功能。\n\n1.\
  \ 在 `另存为` 窗口的 `文件名` 文本框中输入 *第* *2* *章*，然后单击 `保存` 按钮。\n\n2. 单击 `快速访问工具栏` 上的 `保存`\
  \ 按钮 ![../images/385660_2_En_2_Chapter/385660_2_En_2_Figa_HTML.jpg](img/385660_2_En_2_Figa_HTML.jpg)。由于您之前未保存此文件，系统会显示\
  \ `另存为` 窗口。\n\n您可以将文件保存在 `OneDrive` 中，这是微软在网络上提供的免费存储空间。将工作簿保存到 `OneDrive` 的好处是，只要您能访问互联网，就可以在世界任何地方访问该工作簿。另一个好处是，您可以允许其他人访问它，而无需通过电子邮件发送。如果您授予他人权限，他们可以对工作簿进行更改或添加批注。\n\
  \n3. 单击左侧窗格的 `另存为`。（1）单击 `这台电脑`。Excel 会在顶部显示 `文档` 文件夹，下方显示驱动器中的文件夹。（2）输入 `Chapter2`\
