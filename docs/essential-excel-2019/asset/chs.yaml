  \n\n### 复制公式\n\n之前，您使用填充柄来自动填充一系列值。填充柄也可用于跨行或跨列复制公式，同时它会自动调整公式以适用于正确的列和行。\n\n如果向下复制公式（同一列），公式中的行号将自动调整为当前复制到的行。如果横向复制公式（同一行），公式中的列字母将自动调整为当前复制到的列。这种对行和列地址的自动调整称为`相对单元格引用`，因为单元格地址会根据公式所在位置的变化而变化。\n\
