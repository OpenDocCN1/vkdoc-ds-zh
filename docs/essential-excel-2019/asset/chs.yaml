  \ `B3:B8`。名称框现在应显示名称 `Rate`。\n\n**更改名称框的大小**\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig55_HTML.jpg](img/385660_2_En_7_Fig55_HTML.jpg)\n\
