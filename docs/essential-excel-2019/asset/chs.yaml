  最近使用过的工作簿及其存储位置


  如果您需要打开的工作簿不在 `最近使用` 列表中，可以使用其他选项，例如从 `OneDrive` 或 `PC` 上的其他位置访问工作簿。


  #### 将工作簿保留在最近使用列表中


  当您将鼠标光标悬停在 Backstage 中 `最近使用` 列表的工作簿名称上时，您会在工作簿名称右侧看到一个图钉。见图 6-25。


