  \n图 7-18\n\n复制后的公式\n\n您已经学会了如何输入公式。接下来，您将使用 Excel 的自动计算工具。这些工具允许您选择一个数据范围，然后单击您需要的计算工具。公式会自动应用于该数据，而无需您手动输入。\n\
  \n## 自动计算工具\n\n自动计算工具功能包括用于求和、求平均值、计数包含数值数据的单元格数量以及在单元格范围内查找最大值或最小值的工具。\n\n\n\n\
  ### 自动求和\n\n`AutoSum`（自动求和）功能提供了一种对数字区域进行快速求和的途径。该区域可以包含单个单元格，也可以包含成千上万个单元格。`AutoSum`功能会自动添加连续区域中的数值。所谓连续区域，是指其中没有空单元格的区域。\n\
  \n`AutoSum`功能位于功能区上`开始`选项卡的`编辑`组中。该功能的图标是希腊大写字母 Sigma ![](img/385660_2_En_7_Figb_HTML.gif)。在数学和科学领域中，常用\
  \ ![](img/385660_2_En_7_Figc_HTML.gif) 作为求和运算符。详情请见图 7-19。\n\n![](img/385660_2_En_7_Fig19_HTML.jpg)\n\
  \n**图 7-19** AutoSum（自动求和）功能\n\n当您单击`AutoSum`按钮时，Excel 首先会检查当前单元格上方是否存在数值。如果存在，Excel\
  \ 将对上方的数值进行求和；否则，它会检查左侧是否存在数值，如果存在，则对左侧的数值进行求和。\n\n在图 7-20 中，按下`AutoSum`按钮时选定的是单元格`F2`。Excel\
  \ 高亮了其左侧的数值。如果在单击`AutoSum`按钮时只选中了一个单元格，那么`SUM`（求和）公式将显示正在被求和的数值区域。如果这不是您想要求和的区域，则可以更改起始或结束单元格的地址。\n\
  \n![](img/385660_2_En_7_Fig20_HTML.jpg)\n\n**图 7-20** 使用 AutoSum 时，Excel 会选择左侧的数值，并显示将要使用的区域\n\
  \n再次单击`AutoSum`按钮或按`Enter`键，将显示结果，如图 7-21 所示。编辑栏中显示的是由`AutoSum`创建的公式。\n\n![](img/385660_2_En_7_Fig21_HTML.jpg)\n\
  \n**图 7-21** 再次单击 AutoSum 按钮，将结果值输入到单元格中\n\n图 7-22 展示了使用`自动填充句柄`将公式向下复制到单元格`F5`的结果。\n\
  \n![](img/385660_2_En_7_Fig22_HTML.jpg)\n\n**图 7-22** 复制公式的结果\n\n由于我们是对行进行求和，Excel\
  \ 会自动调整每个被复制单元格的行地址：\n\n-   单元格`F3`包含公式`=SUM(B3:E3)`。\n-   单元格`F4`包含公式`=SUM(B4:E4)`。\n\
  -   单元格`F5`包含公式`=SUM(B5:E5)`。\n\n接下来，我们将探讨如何同时对列和行进行求和。但在那之前，我们先来看一下如何清除 F 列中的汇总结果。\n\
  \n可以通过首先选中要清除的单元格，然后执行以下任一操作来清除单元格内容：\n\n-   单击`编辑`组中的`清除`按钮 ![](img/385660_2_En_7_Figd_HTML.jpg)，然后选择`清除内容`\n\
  -   右键单击选中的区域，然后从上下文菜单中选择`清除内容`\n\n要同时对列和行进行汇总，首先选中将要放置汇总结果的行和列单元格。在图 7-23 所示的电子表格中，您需要先选中单元格`F2:F5`，然后按住`Ctrl`键并选中单元格`B6:F6`。\n\
  \n![](img/385660_2_En_7_Fig23_HTML.jpg)\n\n**图 7-23** 按住 Ctrl 键可以选中多个单元格区域\n\n现在单击`AutoSum`按钮，将对行和列同时进行求和。请参见图\
  \ 7-24。\n\n![](img/385660_2_En_7_Fig24_HTML.jpg)\n\n**图 7-24** 对行和列求和的结果\n\n对某个数值区域的行和列进行求和的更快方法是，先选中数值本身以及右侧的一列和下方的一行，如图\
  \ 7-25 所示。\n\n![](img/385660_2_En_7_Fig25_HTML.jpg)\n\n**图 7-25** 在单击 AutoSum 之前，先选中数据以及右侧一列和下面一行\n\
  \n然后按下`AutoSum`按钮。结果将与图 7-24 相同。\n\n### 处理区域中的空单元格\n\n`AutoSum`在遇到空单元格后，不会将其之后的任何单元格纳入求和区域。请参见图\
  \ 7-26。如果您希望将单元格`A2`包含在总计中，则需要将公式中的`A4`更改为单元格`A2`。\n\n![](img/385660_2_En_7_Fig26_HTML.jpg)\n\
  \n**图 7-26** 将 SUM 函数中的 A4 更改为 A2\n\n更改区域的另一种方法是，拖动选中区域的某个句柄，使其包含所有您想要的单元格，如图 7-27\
  \ 所示。\n\n![](img/385660_2_En_7_Fig27_HTML.jpg)\n\n**图 7-27** 拖动选择句柄以包含您想要包含的单元格\n\
  \n\n\n### 平均值、计数、最大值、最小值\n\n如果单击 `AutoSum`（自动求和）按钮（图 7-28）旁边的向下箭头，你会看到 Excel 包含多个其他“自动”函数。这些函数包括\
  \ `Average`（平均值）、`Count Numbers`（计数）、`Max`（最大值）、`Min`（最小值）以及`More Functions`（其他函数）。这些“自动”函数的使用方式与\
  \ `AutoSum` 相同。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig28_HTML.jpg](img/385660_2_En_7_Fig28_HTML.jpg)\n\
  \n图 7-28\n\n自动函数\n\n**练习 7-4：自动计算工具**\n\n在本练习中，你将应用自动计算工具 `AutoSum`、`Average`、`Max`\
  \ 和 `Min` 对行和列进行计算。\n\n1.  创建一个名为“AutoCalculate”的新工作表。\n2.  选择单元格 `B1:I1`，这些将是包含列标题的单元格。在“`开始`”选项卡的“`对齐方式`”组中，单击“`自动换行`”按钮。见图\
  \ 7-29。现在你的列标题将自动换行，而不会被部分隐藏。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig29_HTML.jpg](img/385660_2_En_7_Fig29_HTML.jpg)\n\
  \n图 7-29\n\n选择“自动换行”\n\n3.  如图 7-30 所示输入工作簿的数据。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig30_HTML.jpg](img/385660_2_En_7_Fig30_HTML.jpg)\n\
  \n图 7-30\n\n输入此数据\n\n4.  选择单元格区域 `B6:E6`。单击 `AutoSum` 按钮。\n5.  选择单元格区域 `B2:E5`。单击\
  \ `AutoSum` 按钮旁边的向下箭头。选择 `Average`。\n\n**注意** 当使用“自动”函数时，如果所选范围在一列中（或者如我们当前情况同时包含行和列），Excel\
  \ 会将结果放置在所选范围下方的第一个空白行。如果范围仅在一行中，Excel 会将结果放置在该范围的右侧。\n\n1.  当前选中了单元格区域 `B2:E6`。将选择区域重新改为\
  \ `B2:E5`。单击 `AutoSum` 按钮旁边的向下箭头。选择 `Max`。`Max` 函数返回所选行或列中的最大值。店铺 2 在每个季度的销量都是最高的。\n\
  2.  再次选择单元格区域 `B2:E5`。单击 `AutoSum` 按钮旁边的向下箭头。选择 `Min`。见图 7-31。`Min` 函数返回所选行或列中的最小值。店铺\
  \ 1 在第 1 季度和第 4 季度销量最低。店铺 4 在第 2 季度和第 3 季度销量最低。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig31_HTML.jpg](img/385660_2_En_7_Fig31_HTML.jpg)\n\
  \n图 7-31\n\n使用自动函数的结果\n\n3.  选择单元格 `F2:F5`。单击 `AutoSum` 按钮。\n4.  选择单元格 `B2:E2`。单击\
  \ `AutoSum` 按钮的向下箭头。选择 `Average`。单击单元格 `G2`。使用“`自动填充句柄`”将公式向下拖动到单元格 `G5`。\n5.  选择单元格\
  \ `B2:E2`。单击 `AutoSum` 按钮的向下箭头。选择 `Max`。单击单元格 `H2`。使用“`自动填充句柄`”将公式向下拖动到单元格 `H5`。\n\
  \n让我们看看另一种操作方法。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig37_HTML.jpg](img/385660_2_En_7_Fig37_HTML.jpg)\n\
  \n图 7-37\n\n粗的外边框\n\n1.  单击单元格 `I2`。单击 `AutoSum` 按钮的向下箭头。选择 `Min`。见图 7-32。函数显示出来，并且单元格\
  \ `B2:H2` 周围出现一个选框。这不是我们想要的区域。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig32_HTML.jpg](img/385660_2_En_7_Fig32_HTML.jpg)\n\
  \n图 7-32\n\n选错了区域\n\n2.  选择单元格 `B2:E2`。公式将相应调整。见图 7-33。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig33_HTML.jpg](img/385660_2_En_7_Fig33_HTML.jpg)\n\
  \n图 7-33\n\n为 MIN 函数使用区域 `B2:E2`\n\n3.  按 `Ctrl + Enter`。使用“`自动填充句柄`”将公式向下复制到单元格\
  \ `I5`。见图 7-34。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig34_HTML.jpg](img/385660_2_En_7_Fig34_HTML.jpg)\n\
  \n图 7-34\n\n使用自动填充句柄将公式从 `I2` 复制到 `I5`\n\n4.  让我们改进一下电子表格的外观。我们添加逗号以便于阅读，并添加颜色来区分原始数据和计算数据。\n\
  5.  在“`名称框`”中输入 `A1:I9`，然后按 `Enter`。\n6.  在“`开始`”选项卡的“`样式`”组中，单击“`单元格样式`”的“`其他`”按钮。见图\
  \ 7-35。图 7-36 显示了单击“`单元格样式 其他`”按钮后出现的内容。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig36_HTML.jpg](img/385660_2_En_7_Fig36_HTML.jpg)\n\
  \n图 7-36\n\n所有单元格样式\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig35_HTML.jpg](img/385660_2_En_7_Fig35_HTML.jpg)\n\
  \n图 7-35\n\n单击“其他”按钮以查看更多样式\n\n7.  在“`数字格式`”区域，将鼠标悬停在 `Comma[0]` 上。你可以看到选择此选项后，数据将变为带逗号且不含小数位的形式，从而影响工作表。单击\
  \ `Comma[0]`。\n8.  在“`名称框`”中输入 `A1:E5`，然后按 `Enter`。\n9.  在“`开始`”选项卡的“`样式`”组中，单击“`单元格样式`”的“`其他`”按钮。\n\
  10. 在“`数据和模型`”区域中，单击“`输入`”。\n11. 使用“`字体`”组中的边框按钮，为同一组单元格创建粗的外边框。见图 7-37。\n\n你已经学习了如何手动输入公式，以及如何使用\
  \ Excel 的自动计算工具。在查看工作表时，你会看到公式的结果，而看不到公式本身。要查看公式，你需要单击包含公式的单元格，然后在编辑栏中查看。\n\n###\
  \ 查看公式\n\n单击包含公式的单元格将在编辑栏中显示该公式，但如果能一次性看到所有公式岂不是更好？你可以通过按住 `Ctrl` 键并按波浪线键（`~`）来实现这一点。\n\
  \n你可以在所有公式都可见的情况下打印电子表格。这为你提供了公式的记录，并为你提供了一种方便的方式来全面检查工作，确保所有公式都已正确输入。图 7-38 显示了使用\
  \ `Ctrl + ~` 后的结果。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig38_HTML.jpg](img/385660_2_En_7_Fig38_HTML.jpg)\n\
  \n图 7-38\n\n公式视图\n\n你可以通过再次单击 `Ctrl + ~` 返回普通视图。\n\n### 创建命名区域和命名常量\n\n到目前为止，我们在公式中一直使用单元格地址，但在进行运算思考时，我们通常不会考虑单元格地址；我们通常使用描述性词语。例如，在计算公司工资时，我会想到`小时\
  \ * 费率`，而不是 `B2 * C2`。我们还可以为已知不会更改的值指定名称。例如，我可以将 `PI` 赋值为 `3.14`，然后在公式中使用 `PI` 这个名称，而不是使用值\
  \ `3.14`。\n\n\n\n## 命名区域\n\n我们可以为单元格区域指定一个描述性名称，然后在公式中使用该名称。通过选择单元格区域，然后在“`名称`框”中输入该区域的名称，即可将名称分配给该区域。见图\
  \ 7-39。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig39_HTML.jpg](img/385660_2_En_7_Fig39_HTML.jpg)\n\
  \n图 7-39\n\n在“`名称`框”中输入区域名称\n\n名称不能超过 255 个字符，并且必须以字母、下划线或反斜杠开头。名称不区分大小写。单击“`名称`框”旁边的向下箭头，会显示工作簿中所有已命名区域的列表。单击其中一项，将突出显示该名称区域所包含的单元格。\n\
  \n注意：人们常犯的一个错误是，在“`名称`框”中输入名称后，没有按 `Enter` 键。如果不按 `Enter` 键，该名称将不会被保存。\n\n另一种创建命名区域的方法是使用“`定义的名称`”组中的选项，该组位于功能区上的“`公式`”选项卡中。见图\
  \ 7-40。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig40_HTML.jpg](img/385660_2_En_7_Fig40_HTML.jpg)\n\
  \n图 7-40\n\n“`定义的名称`”组\n\n单击“`定义名称`”按钮会弹出“`新建名称`”对话框。见图 7-41。你可以在打开“`新建名称`”对话框之前，先选中要创建命名区域的单元格，也可以等到对话框打开后再选择区域。你也可以通过右键单击工作表，然后从上下文菜单中选择“`定义名称`”来调出“`新建名称`”对话框。使用“`新建名称`”对话框创建命名区域，会提供一些仅通过在“`名称`框”中输入名称所不具备的选项。\n\
  \n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig41_HTML.jpg](img/385660_2_En_7_Fig41_HTML.jpg)\n\
  \n图 7-41\n\n“`新建名称`”对话框\n\n“`新建名称`”对话框中的“`名称`”文本框，对于你打开该对话框之前选中的单元格，会默认使用列标题或行标题。你可以根据需要更改名称。\n\
  \n“`范围`”下拉框的目的是让你选择，是让该命名区域可用于整个工作簿的公式，还是仅用于某个特定工作表。\n\n你可以输入“`备注`”。该备注不会显示在工作表上，它只会出现在我们稍后会看到的“`名称管理器`”中。你也可以在“`名称管理器`”中命名区域。\n\
  \n“`引用位置`”文本框显示所选单元格的区域地址。如果你在调出“`新建名称`”对话框之前尚未选择要命名的单元格，可以在此刻进行选择。\n\n### 命名非连续区域\n\
  \n要为不连续的单元格组创建命名区域，请在按住 `Ctrl` 键的同时选择单元格，然后输入该组的名称。在图 7-42 中，你可以为所有第一季度值指定一个适当的名称，例如\
  \ `QTR1`。你可以通过在单元格中输入 `=SUM(QTR1)` 来累加所有第一季度值，或者输入 `=AVERAGE(QTR1)` 来计算平均值。\n\n\
  ![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig42_HTML.jpg](img/385660_2_En_7_Fig42_HTML.jpg)\n\
  \n图 7-42\n\n为不连续单元格创建命名区域\n\n### 命名常量\n\n你也可以使用“`新建名称`”对话框为常量指定名称。常量是一个不变的值。例如，你可以为利率或税率指定名称。在“`名称`”文本框中输入要分配给常量的名称。接着，将“`引用位置`”文本框中的当前单元格地址替换为常量值。如果你输入的常量是百分比，可以用百分号输入，例如\
  \ `4.5%`，或者输入其十进制等效值 `.045`。见图 7-43。为常量指定名称可以降低出错几率。如果我在十个单元格中使用了 `4.5%` 的税率，而现在税率变成了\
  \ `4.7%`，我需要更改多少个单元格？没错，我必须找到这十个单元格，然后逐一更改它们。但是，如果我使用了常量，我只需要将常量的值一次性改为 `4.7%` 即可。\n\
  \n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig43_HTML.jpg](img/385660_2_En_7_Fig43_HTML.jpg)\n\
  \n图 7-43\n\n为常量指定名称\n\n### 名称管理器\n\n单击“`定义的名称`”组中的“`名称管理器`”按钮，将显示“`名称管理器`”，其中列出了命名区域和常量。“`名称管理器`”具有用于添加、编辑和删除命名区域的按钮。它还有一个“`筛选`”选项，用于限制要显示的命名区域。\n\
  \n你可以在图 7-44 中看到，命名区域 `Rate` 在创建时其区域内包含值。而 `Gross Pay` 和 `Hours` 区域则是在其单元格中尚未输入任何值时创建的。\n\
  \n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig44_HTML.jpg](img/385660_2_En_7_Fig44_HTML.jpg)\n\
  \n图 7-44\n\n区域名称 `Rate` 包含值，因为这些值在选择该区域时已经存在\n\n#### 编辑命名区域和常量\n\n在“`名称管理器`”窗口中单击“`新建`”按钮，会弹出与我们单击“`定义的名称`”组中的“`定义名称`”按钮时看到的相同的“`新建名称`”对话框。要编辑一个命名区域，请从列表中选择要编辑的区域，然后单击“`编辑`”按钮。“`编辑名称`”对话框（图\
  \ 7-45）与“`新建名称`”对话框类似。在此处，你可以更改`名称`、`备注`、区域的位置，或更改常量值。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig45_HTML.jpg](img/385660_2_En_7_Fig45_HTML.jpg)\n\
  \n图 7-45\n\n“`编辑名称`”对话框\n\n#### 删除命名区域和常量\n\n删除命名区域的唯一方法是使用“`名称管理器`”。首先，选择要删除的区域，然后按下“`删除`”按钮。这会弹出一个警告对话框，要求你确认删除操作（图\
  \ 7-46）。删除命名区域只会移除与单元格区域关联的名称，并不会移除单元格或其中的数据。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig46_HTML.jpg](img/385660_2_En_7_Fig46_HTML.jpg)\n\
  \n图 7-46\n\n确认要删除命名区域的消息\n\n\n\n### 使用列标题或行标题作为区域名称\n\n如果你打算为多行或多列创建命名区域，可能会发现让\
  \ Excel 使用你的行标题或列标题作为这些区域名称会更加便捷。操作方法是，首先选中你的命名区域要包含的所有单元格以及对应的列标题或行标题。参见图 7-47。\n\
  \n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig47_HTML.jpg](img/385660_2_En_7_Fig47_HTML.jpg)\n\
  \n图 7-47：为多行或多列创建区域名称时，选中标题及数据\n\n接着，点击“定义名称”组中的“根据所选内容创建”按钮。参见图 7-48。这将弹出“以选定区域创建名称”对话框（图\
  \ 7-49）。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig49_HTML.jpg](img/385660_2_En_7_Fig49_HTML.jpg)\n\
  \n图 7-49：以选定区域创建名称对话框\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig48_HTML.jpg](img/385660_2_En_7_Fig48_HTML.jpg)\n\
  \n图 7-48：根据所选内容创建按钮\n\n你需要勾选“首行”选项来获取列标题。Excel 将按以下方式分配命名区域：\n\n- `Rate` 对应单元格 B3:B8\n\
  - `Hours` 对应单元格 C3:C8\n- `Gross_Pay` 对应单元格 D3:D8\n- `Fed_Tax` 对应单元格 E3:E8\n- `State_Tax`\
  \ 对应单元格 F3:F8\n\n**注意**：命名区域不能包含空格。当 Excel 使用行标题或列标题时，会用下划线代替空格。\n\n### 在公式中选择命名区域而非手动输入\n\
  \n你可以直接将命名区域键入公式，例如 `=Rate*Hours`。如果你不记得分配给某个区域的名称，或者想确保拼写正确，可以使用“定义名称”组中的“用于公式”按钮。参见图\
  \ 7-50。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig50_HTML.jpg](img/385660_2_En_7_Fig50_HTML.jpg)\n\
  \n图 7-50：用于公式按钮\n\n如果你刚开始编写公式，点击某个命名区域会将等号连同该命名区域一同放入公式。例如，以我们的人员工资计算为例，我们想通过将“费率”乘以“工时”来计算单元格\
  \ D3 的总工资。你可以点击单元格 D3，然后在“用于公式”列表框中点击 `Rate`。这会创建 `=Rate`。接着键入乘号 `*`。最后，点击 `Hours`\
  \ 完成公式，然后按 Enter 键。\n\n更快捷地选择命名区域或常量是按 F3 键。按 F3 会弹出所有可用的名称供你选择。\n\n### 练习 7-6：命名区域与常量\n\
  \n在本练习中，你将使用不同方法创建区域名称。你还会创建用于存放税率值的常量。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig52_HTML.jpg](img/385660_2_En_7_Fig52_HTML.jpg)\n\
  \n图 7-52：格式化后的工作表\n\n1.  按照图 7-51 所示，将数据输入到新的工作表中。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig51_HTML.jpg](img/385660_2_En_7_Fig51_HTML.jpg)\n\
