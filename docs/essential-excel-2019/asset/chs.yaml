  \ Content`（启用内容）按钮。\n\n图 14-10 显示单元格`A2`中的 EmployeeID 已更改为您在`Employee.txt`文件中更新的相同值。单元格`F8`中的值保持不变。出现这种情况是因为在第一个连接中，我们选择了`Refresh\
