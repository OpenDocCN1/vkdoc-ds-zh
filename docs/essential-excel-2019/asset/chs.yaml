  图钉


  单击图钉将使与该图钉关联的工作簿保留在 `最近使用` 列表中，无论您打开和关闭多少个文件。固定的项目将显示在 `最近使用` 列表的顶部。见图 6-26。您可以再次单击图钉来取消固定该工作簿。


