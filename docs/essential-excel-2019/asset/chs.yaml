  \    3.  将文本加粗。\n    4.  在“开始”选项卡的“字体”组中，点击两次“增大字号”按钮。\n\n3.  将列标题居中并加粗。你的电子表格现在应如图\
  \ 7-52 所示。\n\n**使用名称框创建命名区域**\n\n1.  选中单元格 B3:B8。在名称框中输入 `Rate`。按 Enter 键。\n2. \
  \ 选中单元格 C3:C8。在名称框中输入 `Hours`。按 Enter 键。\n3.  选中单元格 D3:D8。在名称框中输入 `GrossPay`。按 Enter\
