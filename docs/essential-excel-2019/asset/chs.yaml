  \n图 4-52\n\n使用自动填充的结果\n\n您一直在使用功能区中的命令。通过迷你工具栏或上下文菜单可以更快地访问这些命令中的大部分，上下文菜单会显示与您当前操作相关的命令。\n\
  \n## 使用迷你工具栏和上下文菜单\n\n您已经了解了 Excel 用于设置数字和文本数据格式的工具。毫无疑问，您会经常使用这些工具。Microsoft 通过迷你工具栏提供了对这些工具的快速访问。有两种不同大小的迷你工具栏。\n\
  \n如果您选择了单元格中的任何文本，您将看到两个迷你工具栏中较小的那个，如图 4-56 所示。将鼠标指针移离迷你工具栏，它会逐渐消失。当您将光标移回迷你工具栏时，它会重新出现。您可以通过以下任一方式移除迷你工具栏：\n\
  \n-   将光标移动到功能区区域。\n-   单击另一个单元格。\n-   将光标移动到距离工具栏足够远的位置，直到它不可见。\n\n如果您想再次显示迷你工具栏，则需要重新选择单元格中的文本。这个较小的迷你工具栏仅包含“字体”组中的工具。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig56_HTML.jpg](img/385660_2_En_4_Fig56_HTML.jpg)\n\
  \n图 4-56\n\n较小的迷你工具栏\n\n图 4-57 中所示的较大迷你工具栏包含来自“字体”、“对齐”和“数字”组的按钮，以及来自“剪贴板”组的“格式刷”。通过右键单击任何单元格（即使单元格为空）即可访问此迷你工具栏。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig57_HTML.jpg](img/385660_2_En_4_Fig57_HTML.jpg)\n\
  \n图 4-57\n\n上下文菜单和较大的迷你工具栏\n\n当您右键单击某个单元格或对象时，还会显示一个上下文菜单（也称为快捷菜单）。上下文菜单中显示哪些项目取决于您单击的对象以及您当时正在处理的内容。您可以从迷你工具栏或快捷菜单中进行选择。如果您决定两者都不使用，只需单击另一个单元格，两者都会消失。\n\
  \n请注意，上下文菜单中有些选项后面带有三个点。参见图 4-58。这三个点称为**省略号**。省略号表示选择此选项时将打开另一个对话框。例如，单击上下文菜单中的“插入…”选项将打开“插入”窗口。上下文菜单中的某些选项带有一个箭头。将鼠标指针移到箭头上会弹出包含更多选项的子菜单。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig58_HTML.jpg](img/385660_2_En_4_Fig58_HTML.jpg)\n\
  \n图 4-58\n\n上下文菜单\n\n\n\n## 行与列的插入、删除、隐藏和取消隐藏\n\n你可以在已有电子表格的行之间添加新的空白行。你也可以删除行来移除数据或删除空白行。\n\
  \n你可以对用户隐藏单行或多行数据。已隐藏的行可以取消隐藏。你不必取消隐藏所有行，只需取消隐藏你选择的行即可。\n\n### 隐藏与取消隐藏列和行\n\n列和行可以被隐藏和取消隐藏，以便用户只需关注必要且与其相关的数据。\n\
  \n#### 隐藏列和行\n\n在电子表格中隐藏列或行的原因有很多：\n\n-   屏幕上显示的数据太多，因此可以隐藏那些你确实不需要查看的数据。\n-   你想要隐藏部分数据，使其不被打印出来。\n\
  -   这些数据与用户无关。\n-   你想要隐藏公式。\n-   你不希望用户看到某些数据。\n\n隐藏某一列或某一行不会影响该列或行中的数据，也不会阻止它被引用。\n\
  \n可以隐藏单列或单行数据，也可以隐藏多列或多行数据。如果要隐藏多列或多行，它们不必是相邻的。\n\n**如何隐藏单列或单行**\n\n1.  右键单击列标或行号。\n\
  2.  从上下文菜单中选择`隐藏`。\n\n**如何隐藏相邻的列或行**\n\n1.  拖拽选中你想要隐藏的列标或行号。\n2.  右键单击选中的标头。\n3.\
  \  从上下文菜单中选择`隐藏`。\n\n**如何隐藏不相邻的列**\n\n1.  单击一个列标。\n2.  按住`Ctrl`键，同时单击其他列标。\n3. \
  \ 右键单击其中一个选中的列标。\n4.  从上下文菜单中选择`隐藏`。\n\n**如何隐藏不相邻的行**\n\n1.  使用与隐藏不相邻列相同的步骤来隐藏不相邻的行。\n\
  \n> **注意：** 你不能在同一操作中同时选中列和行。你必须先隐藏列或行，然后再执行另一个操作。\n\n#### 取消隐藏列和行\n\n你隐藏的列和行将保持隐藏状态，直到你运行`取消隐藏`命令。\n\
  \n**取消隐藏所有列和行**\n\n你可以通过首先单击位于行号 A 左侧的`全选`按钮，然后右键单击任一标头并从上下文菜单中选择`取消隐藏`，来取消隐藏所有列和行。如果你想取消隐藏多个工作表中的列和行，则应先选择这些工作表标签，再执行这些步骤。\n\
  \n**取消隐藏相邻的列或行**\n\n在图 4-59 所示的工作表示例中，列 B 和列 C 是隐藏的。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig59_HTML.jpg](img/385660_2_En_4_Fig59_HTML.jpg)\n\
  \n*图 4-59 — 列 B 和列 C 已隐藏*\n\n可以通过拖拽选中列标 A 和 D，右键单击，然后选择`取消隐藏`来取消隐藏列 B 和列 C。\n\n\
  取消隐藏行的步骤相同，当然，你需要使用行号而不是列标。\n\n**取消隐藏不相邻的列或行**\n\n在图 4-60 所示的工作表示例中，列 B 和列 C 已隐藏，列\
  \ F、G 和 H 也已隐藏。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig60_HTML.jpg](img/385660_2_En_4_Fig60_HTML.jpg)\n\
  \n*图 4-60 — 列 B、C、F、G 和 H 已隐藏*\n\n可以通过拖拽选中列标 A 和 D，然后按住`Ctrl`键同时拖拽选中列标 E 和 I，右键单击，再选择`取消隐藏`来取消隐藏列\
  \ B 和 C 以及列 F、G 和 H。\n\n另一种实现方法是同时取消隐藏所有五列。你可以拖拽选中列标 A 到 I，右键单击其中一个选中的列标，然后选择`取消隐藏`。\n\
  \n#### 取消隐藏列 A 或行 1\n\n取消隐藏列 A 或行 1 是一种特殊情况。之所以特殊，是因为列 A 之前没有列标可供拖拽选中，行 1 之前也没有行号可供拖拽选中。\n\
  \n**取消隐藏列 A**\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig61_HTML.png](img/385660_2_En_4_Fig61_HTML.png)\n\
  \n*图 4-61 — 隐藏和取消隐藏选项*\n\n1.  在名称框中输入`A1`，然后按`Enter`键。\n2.  单击功能区上的`开始`选项卡。\n3.\
  \  在`单元格`组中，单击`格式`按钮。\n4.  从菜单中选择`隐藏与取消隐藏`，然后选择`取消隐藏列`。参见图 4-61。\n\n**取消隐藏行 1**\n\
  \n1.  在名称框中输入`A1`，然后按`Enter`键。\n2.  单击功能区上的`开始`选项卡。\n3.  在`单元格`组中，单击`格式`按钮。\n4.\
  \  从菜单中选择`隐藏与取消隐藏`，然后选择`取消隐藏行`。\n\n### 练习 4-7：隐藏和取消隐藏行与列\n\n本练习将引导你完成隐藏和取消隐藏行与列的操作，以及处理取消隐藏列\
  \ A 和行 1 这个特殊情况。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig63_HTML.jpg](img/385660_2_En_4_Fig63_HTML.jpg)\n\
  \n*图 4-63 — 使用自动填充句柄复制的列 A 数据*\n\n1.  将自动填充句柄向右拖拽至列 M。参见图 4-63。\n\n2.  创建一个新工作表。将其命名为`Rows_Columns`。\n\
  \n3.  在单元格`A1`中输入`1`，在单元格`A2`中输入`2`。\n\n4.  拖拽选中单元格`A1`和`A2`。\n\n5.  将自动填充句柄向下拖拽至第\
  \ 12 行。释放鼠标按钮。参见图 4-62。\n\n   ![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig62_HTML.png](img/385660_2_En_4_Fig62_HTML.png)\n\
  \n   *图 4-62 — 单元格 A1 和 A2 的图案向下复制到单元格 A12*\n\n**隐藏列**\n\n1.  拖拽选中列标 B 至 D。\n2.\
  \  按住`Ctrl`键，同时单击列标 G 并拖拽选中列标 J 和 K。\n3.  右键单击其中一个选中的列标，然后选择`隐藏`。\n\n**隐藏行**\n\n\
  1.  拖拽选中行号 2 和 3。\n2.  按住`Ctrl`键，同时拖拽选中行号 6 和 7，并单击行号 10。\n3.  右键单击其中一个选中的行号，然后选择`隐藏`。\n\
  \n**取消隐藏列**\n\n1.  拖拽选中列标 A 和 E。右键单击选中区域，然后选择`取消隐藏`。\n2.  拖拽选中列标 F 至 L。右键单击选中区域，然后选择`取消隐藏`。\n\
  \n**取消隐藏行**\n\n1.  拖拽选中行号 1 至 12。\n2.  右键单击选中区域，然后选择`取消隐藏`。\n\n**隐藏列 A**\n\n1. \
  \ 右键单击列标 A。\n2.  选择`隐藏`。\n\n**取消隐藏列 A**\n\n1.  在名称框中输入`A1`，然后按`Enter`键。\n2.  单击功能区上的`开始`选项卡。在`单元格`组中，单击`格式`按钮。\n\
  3.  从菜单中选择`隐藏与取消隐藏`，然后选择`取消隐藏列`。\n\n**隐藏行 1**\n\n1.  右键单击行号 1。\n2.  选择`隐藏`。\n\n\
  **取消隐藏行 1**\n\n1.  在名称框中输入`A1`，然后按`Enter`键。\n2.  单击功能区上的`开始`选项卡。在`单元格`组中，单击`格式`按钮。\n\
  3.  从菜单中选择`隐藏与取消隐藏`，然后选择`取消隐藏行`。\n\n\n\n## 插入列和行\n\n在向工作簿中输入数据后，您可能会发现在其他列之间需要添加一列数据，或者想添加一个空白列以使工作表更易于阅读。行的情况也是如此；您可能发现自己忘记添加数据行，或者只是想添加额外的空白行来改善工作表的外观。\n\
  \n您可以在工作表中的任意位置添加新列或新行。\n\n**如何插入列**\n\n1.  在要插入列的位置选择列标题。\n2.  右键单击工作表，然后选择 `Insert`。您选择的列将向右移动，您创建的列将取代其位置。新列的宽度将与左侧列的宽度相同。\n\
  \n您可以通过选择要插入新列的位置来插入多列。如果您选择了四列，那么当您右键单击工作表并选择 `Insert` 时，将插入四个新列。\n\n**如何插入行**\n\
  \n1.  在要插入行的位置选择行标题。\n2.  右键单击工作表，然后选择 `Insert`。您选择的行将向下移动，您创建的行将取代其位置。新行的高度将与上方行的高度相同。\n\
  \n您可以通过选择要插入新行的位置来插入多行。如果您选择了四行，那么当您右键单击工作表并选择 `Insert` 时，将插入四个新行。\n\n## 删除列和行\n\
  \n您可以像添加列或行一样轻松地删除它们。删除列的一些原因包括：\n\n-   您在列中输入了错误的数据。\n-   您确定不再需要某列中的数据。\n-   您想删除空列以改善电子表格的外观或使用。\n\
  \n如果您在列中输入了无效数据，仅清除该列中的数据而非删除整列可能更简单。这可以通过选择包含无效数据的所有单元格，然后选择 `Home` 选项卡 ➤ `Editing`\
  \ 组 ➤ `Clear` 按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figbh_HTML.jpg](img/385660_2_En_4_Figbh_HTML.jpg)，再选择其中一个清除选项来完成。\n\
  \n**如何删除列**\n\n您可以一次删除一列或多列。\n\n1.  选择要删除的列的列标题。\n2.  右键单击工作表，然后选择 `Delete`。被删除列右侧的列将向左移动以填补您删除的那些列的位置（填补空出的空间）。\n\
  \n**如何删除行**\n\n您可以一次删除一行或多行。\n\n1.  选择要删除的行的行标题。\n2.  右键单击工作表，然后选择 `Delete`。被删除行下方的行将向上移动以填补您删除的那些行的位置。\n\
  \n## 插入和删除单元格\n\n您可以在活动单元格的上方或左侧插入空白单元格。您可以通过右键单击任意单元格，然后从上下文菜单中选择 `Insert` 来调出\
  \ `Insert` 对话框（图 4-64）执行此操作。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig64_HTML.jpg](img/385660_2_En_4_Fig64_HTML.jpg)\n\
  \n图 4-64：插入窗口\n\n插入空白单元格时，您可以选择将同一列中的其他单元格下移（`Shift cells down`）或将同一行中的其他单元格右移（`Shift\
  \ cells right`）以容纳新单元格。请注意，`Insert` 对话框也提供了插入整行和整列的选项。\n\n您可以通过选择要删除的单元格，然后右键单击并从上下文菜单中选择\
  \ `Delete` 来删除单元格。这将调出 `Delete` 对话框（图 4-65），其中提供了删除单元格、整行或整列的选项。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig65_HTML.jpg](img/385660_2_En_4_Fig65_HTML.jpg)\n\
  \n图 4-65：删除窗口\n\n您可以选择让被删除的单元格由右侧的单元格替代（`Shift cells left`），或者选择由下方的单元格替代（`Shift\
  \ cells up`）。\n\n### 练习 4-8：插入和删除单元格、行和列\n\n本练习将带您完成插入和删除单元格，然后决定如何移动其他单元格。\n\n\
  ![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig66_HTML.jpg](img/385660_2_En_4_Fig66_HTML.jpg)\n\
  \n图 4-66：输入此工作表中的数据\n\n1.  右键单击仍处于选中状态的三个单元格，然后选择 `Delete`。选择 `Shift cells left`。单击\
  \ `OK` 按钮。\n2.  右键单击单元格 `B4`，然后选择 `Insert`。选择 `Entire row`。单击 `OK` 按钮。在所选单元格上方插入了一行。\n\
  3.  右键单击单元格 `C4`，然后选择 `Insert`。选择 `Entire column`。单击 `OK` 按钮。在所选单元格左侧插入了一列。\n4.\
  \  右键单击单元格 `C4`，然后选择 `Delete`。选择 `Entire column`。单击 `OK` 按钮。\n5.  单击行标题 6。按住 `Ctrl`\
  \ 键并单击行标题 7、8 和 9。右键单击任意选中的行标题，然后选择 `Insert`。\n6.  您现在每两行之间应该有一个空白行。\n1.  右键单击列标题\
  \ A，然后从上下文菜单中选择 `Insert`。\n2.  右键单击行标题 1，然后从上下文菜单中选择 `Insert`。\n3.  右键单击单元格 `B5`，然后选择\
  \ `Insert`。选择 `Shift cells down`。单击 `OK` 按钮。\n4.  右键单击单元格 `B5`，然后选择 `Delete`。选择\
  \ `Shift cells up`。单击 `OK` 按钮。\n5.  您可以在选择下移或右移单元格之前选择多个单元格。移动的单元格数量将与您选择的单元格数量相同：\n\
  \    1.  选择单元格 `B5:D5`。右键单击所选区域中的一个单元格，然后选择 `Insert`。\n6.  选择 `Shift cells right`。单击\
  \ `OK` 按钮。\n1.  创建一个新工作表。将工作表命名为“Stocks”。\n2.  在单元格 `A1` 中输入 `Stocks Purchased 06-15-2016`。选择单元格\
  \ `A1` 到 `D1`。右键单击所选单元格。较大的迷你工具栏应出现在所选文本上方。单击 `Merge & Center` 按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figbi_HTML.gif](img/385660_2_En_4_Figbi_HTML.gif)。\n\
  3.  在单元格 `A2` 中输入 `Stock`。\n4.  在单元格 `B2` 中输入 `Closing`。按 `Alt + Enter`。按 `Alt +\
  \ Enter` 会在单元格中创建额外的一行并启用文本换行。输入 `Price`。\n5.  选择单元格 `C2` 和 `D2`。在所选区域右键单击。选择 `Format\
  \ Cells`。从 `Alignment` 选项卡中选择 `Wrap text`。单击 `OK` 按钮。\n6.  将图 4-66 中的数据输入到单元格 `C2`\
  \ 和 `D2` 中。您可能需要加宽列才能看到 Purchased 这个词的全部内容。然后输入图 4-66 中的其余数据。\n\n**注意：** 进行选择时，您选择的行、列或单元格不必是相邻的。\n\
  \n您已经学习了如何插入和删除行和列，以及如何隐藏和取消隐藏它们。您应该只允许需要查看数据的用户访问这些数据；您应该隐藏他们不需要的任何内容。您还学习了插入和删除单个单元格。您经常会发现自己忘记输入某项内容。Excel\
  \ 允许您在有需要的地方插入新单元格，然后将其下方的数据下移一行，或将其右侧的数据右移一列，从而轻松纠正这一疏忽。\n\n\n\n## 摘要\n\n格式化工作表可以使其更具视觉吸引力且更易于理解。它还可用于更改数字和日期数据的显示方式。格式化可用于实现自动换行、旋转文本和缩小文本。格式化也用于对齐数据。你可以使用\
  \ Excel 的格式刷将一个单元格的所有格式复制到其他单元格。你已经练习了如何有效使用颜色，并学会了如何为工作表创建统一的图形样式。这是使演示文稿外观专业、并为你的项目提供标志性风格的重要方面。Excel\
  \ 通过将最常用的工具放置在两个微型工具栏上，使你能够快速访问它们，从而简化了格式化操作。你已经了解了如何隐藏和取消隐藏行和列，以及如何插入和删除单元格、行和列。你还了解了如何应用边框以及如何绘制边框。\n\
  \n在第 5 章中，你将通过使用页眉和页脚、设置分页符、将工作表拆分为多个窗格以及学习更多函数，继续优化工作簿的设置。你还将学习自定义视图以及如何打印工作表的选定部分以用于特定数据报告。\n\
  \n"
- "# 5. 查看和打印工作簿的不同方式\n\nExcel 允许你向一个工作表中输入种类繁多、数量庞大的数据，然后仅提取你需要与客户或员工分享的数据。有时你不需要打印整个工作簿或整个工作表。在本章中，你将学习如何仅查看和打印与你的任务相关的数据。你可能正在处理一个地理区域或某个特定销售人员，并且只想显示与每个人相关的内容。打印布局视图让你可以看到工作表在打印时的外观，这一点非常重要，因为屏幕截图可能与最终打印出来的产品有很大差异。\n\
  \n阅读并完成本章学习后，你应该能够：\n\n- 插入、删除、重置和更改分页符的位置\n- 在所有页面上重复行标题和列标题\n- 使用预设的页眉\n- 创建你自己的页眉和页脚\n\
  - 创建打印区域、向其中添加内容以及移除打印区域\n- 打印工作表的一部分\n- 使用“选择性粘贴”来组合一个可打印的工作表\n- 创建你自己的自定义视图\n\
  - 使用“同步滚动”功能\n- 将工作表拆分为多个窗格\n- 冻结行和列\n\n## 视图\n\n到目前为止，我们一直在“`普通视图`”中查看工作表，但这并非唯一可用的视图。除了“`普通视图`”，还有“`分页预览`”和“`页面布局视图`”。可以从功能区上的“`视图`”选项卡访问不同的视图。“`分页预览`”用于调整分页符。此视图允许你插入、更改、删除和重置分页符。“`页面布局视图`”提供了一种添加、编辑和删除页眉和页脚的快速方法。它还让你能够直观地看到工作簿打印时的样子。你还可以创建自己的“`自定义视图`”。\n\
  \n工作簿视图位于功能区的“`视图`”选项卡上。请参见图 5-1。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig1_HTML.jpg](img/385660_2_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\n工作簿视图按钮\n\n“`普通视图`”、“`分页预览`”和“`页面布局视图`”按钮也出现在 Excel 任务栏的右侧。这三个按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figa_HTML.jpg](img/385660_2_En_5_Figa_HTML.jpg)\
  \ 执行的功能与“工作簿视图”组中的功能相同。如果你在任务栏上看不到它们，请右键单击任务栏并选择“`视图快捷方式`”。\n\n注意\n\n“`普通视图`”和“`分页预览`”不显示页眉和页脚，但“`页面布局视图`”会显示。\n\
  \n还有一个“`打印预览`”，你将在本章中使用到。“`打印预览`”不是工作簿视图的一部分。“`打印预览`”仅用于确切查看你的工作表将如何被打印。\n\n\n\n\
  ### 分页预览\n\n分页符有两种类型：一种是由 Excel 自动创建的，另一种是手动创建的。自动分页符会在您调整行高或列宽、删除或添加列/行、更改页面大小、更改页面方向、更改页边距等操作时自动调整。\n\
  \n在普通视图中，分页符显示为虚线。在普通视图中，您可以插入、删除和重置分页符。但是，您无法像在分页预览中那样将分页符拖动到新位置。在分页预览中，分页线也更易于查看。在普通视图和分页预览中，插入、删除和重置分页符的操作方式是相同的。因此，我们仅介绍在分页预览模式下执行这些步骤的方法。\n\
  \n打印包含大量列的工作表可能颇具挑战性。Excel 可能无法按您期望的方式拆分报告（即打印的工作表）。您可以将方向从`纵向`切换为`横向`，以增加纸张的宽度，但某些列仍可能会打印在单独的页面上。`分页预览`用于调整分页符。此视图允许您插入、更改、删除和重置分页符。\n\
  \n分页预览会显示数据的缩小视图。数据由代表分页符的蓝色水平虚线和垂直虚线分隔。您可以通过拖动蓝色线到所需分页位置来更改分页符的位置。如果更改了分页符的位置，该线将从虚线变为实线。如果您插入新的分页符，它也将显示为实线。这有助于轻松识别您所做的更改与\
  \ Excel 最初创建的分页符。\n\n### 练习 5-1：使用分页符和预览\n\n在本练习中，您将练习创建垂直和水平分页符。您还将练习移动和删除分页符。\n\
  \n**注意** 您可以从 Apress 网站的源代码/下载区域（[`www.apress.com/source-code`](http://www.apress.com/source-code)）下载本书附带的示例文件。\n\
  \n1.  单击功能区上的“视图”选项卡。在“工作簿视图”组中，单击“分页预览”按钮。本练习的其余部分仅涉及分页预览。查看窗口右下角的“缩放”工具。缩放比例会自动设置为低于\
  \ 100%，以便您更轻松地查看分页符。\n\n该工作表显示两条垂直虚线和一条水平虚线，将工作表分成六页。请参见图 5-4。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig4_HTML.jpg](img/385660_2_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n分页预览\n\n1.  打开工作簿 第 5 章。单击“月份”工作表。\n\n2.  单击“文件”选项卡。\n\n3.  在左侧窗格中选择“选项”。\n\
  \n4.  在左侧窗格中选择“高级”。\n\n5.  找到`此工作表的显示选项`组。如果“显示分页符”未选中，请将其选中。\n\n6.  单击“确定”按钮。这仅影响普通视图。您无法在分页预览中关闭分页线。\n\
  \n现在已选择“显示分页符”，您应该会看到用虚线表示的分页符。在 E 列和 F 列之间有一个垂直分页符，在 J 列和 K 列之间还有另一个垂直分页符（图 5-2）。在第\
  \ 47 行和第 48 行之间有一个水平分页符（图 5-3）。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig3_HTML.jpg](img/385660_2_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n水平分页线\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig2_HTML.jpg](img/385660_2_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n垂直分页线\n\n#### 在打印预览中查看报表\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，对给定的英文文本进行精准翻译。\n\
  \n\n1.  单击 `File` 选项卡。在左侧窗格中选择 `Print`。右侧的 `Print Preview`（打印预览）窗格会显示工作表打印时的样子。您可以单击预览区域底部的\
  \ `Forward`（前进）和 `Back`（后退）按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figb_HTML.jpg](img/385660_2_En_5_Figb_HTML.jpg)\
  \ 来浏览不同页面。\n\n2.  单击 `Return`（返回）按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figc_HTML.jpg](img/385660_2_En_5_Figc_HTML.jpg)\
  \ 退出 `Print Preview`（打印预览）。\n\n### 在分页预览中插入分页符\n\n1.  单击列标题 `H` 以选中该列。当您插入垂直`Page\
  \ Break`（分页符）时，分页符会出现在选中列的左侧。\n\n2.  在功能区上，单击 `Page Layout`（页面布局）选项卡。在 `Page Setup`（页面设置）组中，单击\
  \ `Breaks`（分隔符）按钮。单击 `Insert Page Break`（插入分页符）。单击任意单元格以查看`Page Break`（分页符）。它是一条实线而非虚线。实线是您自己创建的分页符，而虚线是\
  \ Excel 自动创建的。\n\n### 在分页预览中删除分页符\n\n1.  右键单击列标题 `H`。选择 `Remove Page Break`（删除分页符）。\n\
  \n2.  您也可以通过将分页符线拖出工作表来将其删除。将列 `J` 和 `K` 之间的垂直分页符拖出工作表。\n\n### 在分页预览中重置分页符\n\n1.\
  \  右键单击工作表，然后选择 `Reset All Page Breaks`（重置所有分页符）。这会将分页符恢复为 Excel 最初设置的状态。\n\n###\
  \ 在分页预览中更改分页符的位置\n\n1.  拖动水平分页符线，使其位于第 `36` 行和第 `37` 行之间。此线变为实线。这有助于轻松区分 Excel 设置的分页符（虚线）和您自己设置的分页符（实线）。\n\
  \n2.  将列 `E` 和 `F` 之间的虚线分页符线拖动到列 `G` 和 `H` 之间。该线变为实线。\n\n### 在打印预览中查看电子表格\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig5_HTML.jpg](img/385660_2_En_5_Fig5_HTML.jpg)\n\
  \n**图 5-5**\n\n报告的第 4 页没有行或列标题\n\n1.  右键单击工作表，然后选择 `Page Setup`（页面设置）。在 `Page Setup`（页面设置）对话框中，单击\
  \ `Print Preview`（打印预览）按钮。\n\n2.  窗口的右侧是 `Print Preview`（打印预览）区域。这里会精确显示打印输出的效果。在窗口底部，您会看到一个页面选择器\
  \ ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figd_HTML.jpg](img/385660_2_En_5_Figd_HTML.jpg)。单击右箭头转到下一页。请注意，在第\
  \ 2 页上，没有列标题。单击页面选择器的右箭头转到第 3 页。请注意，没有行标题。转到第 4 页。此页既没有行标题也没有列标题。参见图 5-5。除非您将页面粘在一起，否则任何人都很难阅读这份报告。\n\
  \n**注意** 当您在 `Page Break Preview`（分页预览）中查看电子表格时，它会显示网格，但在 `Print Preview`（打印预览）中，没有网格。打印时不会有任何网格线。\n\
  \n1.  单击 `Return`（返回）按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Fige_HTML.jpg](img/385660_2_En_5_Fige_HTML.jpg)，然后单击功能区的\
  \ `Home`（开始）选项卡。\n\n### 在所有页面上重复行和列标题\n\n1.  单击页面选择器的左箭头，直到您位于第 1 页，共 4 页 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figf_HTML.jpg](img/385660_2_En_5_Figf_HTML.jpg)。第\
  \ 1 页显示了 1 月至 6 月的数据。单击页面选择器的右箭头转到第 2 页。第 2 页显示了 1 月至 6 月的其余记录。第 2 页现在有列标题。\n\n\
  2.  浏览其他页面；它们都有列标题和行标题。\n\n3.  单击 `Return`（返回）按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figg_HTML.jpg](img/385660_2_En_5_Figg_HTML.jpg)。\n\
  \n1.  单击 `Print Preview`（打印预览）按钮。页面现在显示网格线。\n\n2.  单击位于 `Print Preview`（打印预览）区域右下角的\
  \ `Zoom to Page`（缩放到页面）按钮。参见图 5-7。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig7_HTML.jpg](img/385660_2_En_5_Fig7_HTML.jpg)\n\
  \n**图 5-7**\n\n单击 `Zoom to Page`（缩放到页面）按钮\n\n1.  右键单击工作表，然后选择 `Page Setup`（页面设置）。在\
  \ `Page Setup`（页面设置）对话框中，单击 `Sheet`（工作表）选项卡。\n\n2.  如果我们希望行标题出现在每个打印页面上，我们需要在 `Rows\
  \ to repeat at top`（顶端标题行）文本框中标识标题行。单击文本框内部。您可以键入 `$1:$1`，或者单击单元格 `A1`，它会自动将地址放入文本框中。此地址告诉\
  \ Excel 使用第 1 行中的标题作为所有打印页面的列标题。\n\n3.  按 Tab 键切换到 `Columns to repeat at left`（左端标题列）文本框。您可以键入\
  \ `$A:$A`，或者单击单元格 `A1`，它会自动将地址放入文本框中。此地址告诉 Excel 使用 A 列中的行标题作为所有打印页面的行标题。\n\n4.\
  \  选中 `Gridlines`（网格线）复选框。这会将所有数据打印在网格线内。参见图 5-6。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig6_HTML.jpg](img/385660_2_En_5_Fig6_HTML.jpg)\n\
  \n**图 5-6**\n\n选中 `Gridlines`（网格线）以在网格线内打印数据\n\n您已经学习了如何插入、删除和重新排列分页符，以便控制分页符出现的位置。您还学习了如何让行标题和列标题出现在报告的每一页上。接下来，您将看到如何在\
  \ `Page Layout`（页面布局）视图中向工作表添加页眉和页脚。\n\n\n\n### 页面布局视图\n\n`页面布局`视图提供了一种快速添加、编辑和删除页眉与页脚的方法。它会显示打印输出相对于水平和垂直标尺以及分页符的外观。您可以轻松更改边距并立即看到结果。`页面布局`视图的工作方式与`普通`视图类似；您仍然可以添加和编辑数据并应用格式。\n\
  \n`页面布局`视图会显示一个水平标尺和一个垂直标尺，当您移动到另一页时，它们会随之移动到该页。您可以通过将标尺拖到所需位置来调整边框。拖动鼠标指针时，会有一条线同时移动，向您显示边距的位置。如果您希望将边距设置到某个特定的英寸位置，则不宜在此处操作，因为在拖动时不会显示以英寸为单位的变动。\n\
  \n`页面布局`视图显示三个页眉部分和三个页脚部分。如果您单击其中一个页眉或页脚部分，功能区会新增一个名为`页眉和页脚工具`的上下文选项卡。请参见图 5-8。页眉打印在每页的顶部。页脚打印在每页的底部。\n\
  \n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig8_HTML.jpg](img/385660_2_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n\n用于页眉和页脚的上下文选项卡\n\n### 练习 5-2：使用页面布局视图\n\n在此练习中，您将使用`页面布局`视图来添加和更改页眉与页脚，以及删除页面之间的空白区域。\n\
  \n1.  使用第 5 章的工作簿。单击 `Months` 工作表。\n2.  单击工作簿状态栏上的`页面布局`视图按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figh_HTML.jpg](img/385660_2_En_5_Figh_HTML.jpg)。\n\
  3.  您应该在状态栏上看到我们当前查看的是第 1 页，共 4 页。\n4.  更改`缩放`工具，以便您可以同时看到所有页面。\n5.  按 `Ctrl + Home`\
  \ 转到单元格 `A1`。\n\n### 更改页眉和页脚\n\n**注意** 页眉和页脚区域在空置或首次使用时通常不会显示。您可能需要将光标移动到它们应该存在的区域才能看到它们。\n\
  \n1.  单击包含用户名、页码和当前日期的预设页眉。\n2.  在第一个页眉区域内部单击，将名称更改为您的全名。使用工作表的垂直和水平滚动条查看页眉是否出现在每页的顶部。\n\
  3.  滚动到第 1 页的底部。您应该会看到文本 `添加页脚`。\n4.  单击“添加页脚”字样，以便看到三个页脚区域。\n5.  单击`设计`选项卡。在`页眉和页脚`组中，单击`页脚`按钮。\n\
  \nExcel 会显示一个预设页脚列表。与页眉一样，逗号用于标识文本将放置在哪个区域。\n\n6.  单击预设页脚 `第 1 页，共 ? 页`。此预设页脚不包含逗号；因此，它显示在中间区域。\n\
  7.  在中间区域内部单击。用于创建页脚的代码 `第 &[页码] 页，共 &[总页数] 页` 会显示出来。我们希望文本出现在右侧区域。按 `Ctrl + X`\
  \ 剪切文本。在右侧区域内部单击。按 `Ctrl + V` 粘贴。在中间区域内部单击。您应该会看到文本现在显示在右侧区域。\n8.  单击功能区的`设计`选项卡，在`导航`组中，然后单击`转至页眉`按钮。\n\
  9.  将鼠标指针移动到该区域的左侧，左侧区域将被选中。在左侧区域内部单击。每当页眉或页脚区域处于活动状态时，功能区都会在`页眉和页脚工具`标题下显示一个`设计`选项卡。\n\
  10. 单击`设计`选项卡。在`页眉和页脚`组中，单击`页眉`按钮。Excel 会显示一个预设页眉列表。请参见图 5-10。\n\n将打印在页眉每个部分的数据由逗号分隔：\n\
  - 不包含逗号的预设页眉将显示在中间页眉区域。\n- 对于包含一个逗号的预设页眉，逗号左侧的文本将出现在中间页眉区域。逗号右侧的文本将出现在右侧区域。\n- 对于包含两个逗号的预设页眉，第一个逗号左侧的文本将出现在最左侧页眉区域。第一个逗号右侧至第二个逗号之间的文本将出现在中间区域。第二个逗号右侧的文本将出现在最右侧区域。\n\
