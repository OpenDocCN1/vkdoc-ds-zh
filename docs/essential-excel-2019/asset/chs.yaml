  \n### 练习 19-8：将宏分配到按钮\n\n我们将把同一个宏分配到一个按钮上。\n\n1.  选择第一个表单控件，即按钮。将光标向下移动到电子表格区域。光标将变为十字准线。\n\
  2.  从单元格 `C2` 开始，向右下方拖拽，直到你创建一个足够大的按钮区域。\n3.  出现**指定宏**对话框。点击 `PERSONAL.XLSB!RelativeReferencing`。点击**确定**按钮。\n\
  4.  右键点击该按钮并选择**编辑文字**。将按钮上的文字从 `Button 1` 改为 `Practice`（练习）。\n5.  点击任意空单元格以取消选择该按钮。点击你刚刚创建的按钮。\n\
  6.  创建一个新工作表。\n7.  在功能区上，点击**开发工具**选项卡。在**控件**组中，点击**插入**按钮。\n\nExcel 有两种类型的控件：表单控件和\
  \ ActiveX 控件。这两种类型都包含一些相同的控件。你可以将宏分配给表单控件，但不能分配给 ActiveX 控件。参见图 19-15。\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig15_HTML.jpg](img/385660_2_En_19_Fig15_HTML.jpg)\n\
  \n图 19-15 表单控件\n\n## 与他人共享个人工作簿\n\n你可以在其他计算机上使用个人工作簿（`Personal.xlsb`），或通过电子邮件发送该文件或将其复制到外部驱动器与他人共享，然后他们可以将该文件复制到自己计算机上的\
  \ `XLSTART` 文件夹中。\n\n\n\n## 查看 VBA 代码\n\n录制宏时，您实际上是在创建 VBA 代码。VBA 是一种编程语言，全称为 **Visual\
  \ Basic for Applications**。研究录制宏时生成的代码结果是学习 VBA 的好方法。\n\n您创建的每个宏的代码都存储在各自独立的代码块中，这些代码块称为过程。一个过程以关键字\
  \ `Sub` 开头，以关键字 `End Sub` 结尾。`Sub` 是 **Subroutine（子程序）** 的缩写。过程通常也被称为**子程序**。\n\n\
  ### 练习 19-9：编辑宏生成的代码\n\n在本练习中，我们将修改您在练习 19-3 中创建的 `AbsoluteReference` 宏所生成的代码。我们将更改代码，使宏在您启动宏所在的行重复相同的文本模式。\n\
  \n**注意**：为了让练习 19-3 生效，本可以使用**相对引用**而非绝对引用，但我希望您了解宏是如何由 VBA 代码驱动的，以及如何对其进行修改。如果您想成为\
  \ VBA 专家，市面上有专门讲解此主题的书籍。\n\n1.  将语句 `Range(\"B4\").Select` 更改为 `ActiveCell.Select`。\n\
  \n2.  将语句 `Range(\"C4\").Select` 更改为 `ActiveCell.Offset(0, 1).Select`。\n\n范围 `C4`\
  \ 相对于单元格 `B4` 向右偏移一列；因此，我们需要代码反映从活动单元格向右移动一列的操作。我们可以使用 `Offset` 方法来实现。`Offset` 方法使用两个参数：第一个参数是行，第二个参数是列。我们希望所有数据都显示在同一行，因此不想改变活动单元格的行。所以，我们将行参数设为\
  \ `0` 以保持当前位置，并将列参数设为 `1` 以向右移动一列。\n\n3.  将语句 `Range(\"E4\").Select` 更改为 `ActiveCell.Offset(0,\
  \ 2).Select`。\n\n范围 `E4` 相对于单元格 `C4` 向右偏移两列。我们也希望代码从活动单元格向右移动两列。因此，我们将 `Offset`\
  \ 方法的列参数设为 `2`。\n\n4.  将语句 `Range(\"G4\").Select` 更改为 `ActiveCell.Offset(0, 2).Select`。\n\
  \n范围 `G4` 相对于单元格 `E4` 向右偏移两列。我们也希望代码从活动单元格向右移动两列。因此，我们将 `Offset` 方法的列参数设为 `2`。您的代码应如下所示：\n\
  \n```\n    ActiveCell.Select\n    ActiveCell.FormulaR1C1 = \"Excel\"\n    ActiveCell.Offset(0,\
  \ 1).Select\n    ActiveCell.FormulaR1C1 = \"2019\"\n    ActiveCell.Offset(0, 2).Select\n\
  \    ActiveCell.FormulaR1C1 = \"Macro\"\n    ActiveCell.Offset(0, 2).Select\n  \
  \  Selection.FormulaR1C1 = \"Tutorial\"\n```\n\n完成编辑代码后，您可以返回工作表进行测试。您可以通过单击工具栏上的\
  \ Excel ![../images/385660_2_En_19_Chapter/385660_2_En_19_Figj_HTML.jpg](img/385660_2_En_19_Figj_HTML.jpg)\
  \ 按钮返回工作表，或者按 `Alt + F11`。按 `Alt + F11` 可以在 VBA 编辑器和工作表之间来回切换。\n\n5.  按 `Alt + F11`。\n\
  \n6.  单击单元格 `C6` 内部。按下您创建的快捷键：`Ctrl + Shift + A`。\n\n尝试在不同的行和不同的起始列运行宏。模式应保持不变。\n\
  \n本练习解决了您在练习 19-2 中遇到的问题。当然，您本可以通过创建**相对单元格引用**宏而非**绝对单元格引用**宏来避免该问题。\n\n1.  打开您在练习\
  \ 19-3 中保存的 `Macro_Practice` 工作簿。您可能需要单击“启用内容”。在功能区上，单击“视图”选项卡。在“宏”组中，单击“宏”按钮的上半部分。\n\
  \n2.  在“宏”对话框中，选择 `AbsoluteReference`。\n\n3.  单击“编辑”按钮。您现在位于 VBA 编辑器中。在此处，您将找到 Excel\
  \ 为您创建的 `FormatEntry` 和 `AbsoluteReference` 宏生成 VBA 代码。图 19-16 中的代码会出现在您的 VBA 编辑器窗口中，对应\
  \ `AbsoluteReference` 宏。\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig16_HTML.jpg](img/385660_2_En_19_Fig16_HTML.jpg)\n\
  \n**图 19-16** `AbsoluteReference` 宏的代码\n\n您可以修改代码以改变宏的工作方式。请注意，代码位于 `Sub` 和 `End\
  \ Sub` 语句之间。`Sub` 语句使用的名称是您分配给宏的名称。`Sub` 语句之后是几行以单引号开头的行。这些行显示为绿色。它们是注释行。运行宏时会忽略这些行，它们仅作为辅助，帮助您记住关于宏的重要信息。\n\
  \n接下来是执行宏步骤的代码语句。请注意，单元格地址位于 `Range` 语句中。这些语句会选择这些确切的单元格。这就是为什么运行宏时，数据会输入到与最初完全相同的单元格中。\n\
  \n我们将修改代码，使得第一个使用的单元格不再是单元格 `B4`，而是您启动宏时所在的任意单元格。\n\n\n\n## 从代码创建宏\n\n宏并非必须录制后再播放。你可以在\
  \ Visual Basic 编辑器的代码窗口中手动将宏编写为过程。你仍然可以为手动编写的宏分配快捷键和说明，也可以将它们分配给按钮、剪贴画、图像、形状等对象。\n\
  \n过程存储在模块中。一个模块可以包含多个过程。宏会自动存储在编号的模块中。你创建的第一个宏将存储在 `Module1` 中。之后创建的每个宏也会存储在此处，直到你关闭工作簿。当你重新打开工作簿并创建一个新宏时，它将被存储在\
  \ `Module2` 中。每当你关闭并重新打开工作簿时，你创建的任何新宏都将存储在一个新模块中，该模块的名称将按顺序分配下一个编号。\n\n### 练习 19-10：从代码创建宏\n\
  \n有时，仅仅一个简单的宏就能显著提升工作表的功能。在本练习中，我们将创建图 19-17 中的时间线。以倾斜角度输入文本可以节省空间且看起来不错，但你必须歪着头才能查看。如果能在不改变当前数据布局的情况下，以水平格式查看大单元格中的垂直文本，那该多好啊？这正是我们将要添加到时间线中的功能。本练习程序将允许用户单击一个包含倾斜显示文本的单元格，然后使用快捷键或单击按钮，将数据复制到以水平格式显示数据的单元格中。\n\
  \n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig17_HTML.jpg](img/385660_2_En_19_Fig17_HTML.jpg)\n\
  \n**图 19-17** 你将创建此时间线\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig18_HTML.jpg](img/385660_2_En_19_Fig18_HTML.jpg)\n\
  \n**图 19-18** 在“指定宏”窗口中单击“新建”按钮\n\n1.  打开工作簿“第 19 章”。\n2.  单击功能区中的“开发工具”选项卡。在“控件”组中，单击“插入”按钮。\n\
  3.  在“表单控件”区域中单击“按钮”控件。将光标移动到时间线下方，拖出一个按钮，使其位置和大小与图 19-17 中所示一致。\n4.  弹出“指定宏”按钮对话框。按照图\
  \ 19-18 填写字段：\n    1.  将**宏名**更改为 `ConvertToHorizontal`。\n    2.  将**宏位置**更改为“当前工作簿”。\n\
  \    3.  单击“新建”按钮。\n\n你现在处于 VBA 编码区域。模块代码窗口中显示以下代码：\n\n```\nSub ConvertToHorizontal()\n\
  End Sub\n```\n\n5.  单击宏窗口的“取消”按钮。\n6.  单击范围 `C7:G7` 中的一个单元格。按 `Ctrl + Shift + T`。`ConvertToHorizontal`\
  \ 宏运行，并生成如图 19-17 之前所示格式的时间线。\n7.  完成图 19-20 所示的“宏选项”对话框：\n    1.  对于快捷键，按住 Shift\
  \ 键并按 T。\n    2.  对于说明，输入“以水平格式显示文本”。\n    3.  单击“确定”按钮。\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig20_HTML.jpg](img/385660_2_En_19_Fig20_HTML.jpg)\n\
  \n**图 19-20** 为快捷键输入 T\n\n8.  将以下代码放在两行 `Sub` 之间：\n\n```\n    '将单元格范围 C7:G7 的背景颜色设为白色\n\
  \    Range(\"C7:G7\").Interior.Color = RGB(255, 255, 255)\n    '将所选单元格的背景颜色设为绿色\n\
  \    ActiveCell.Interior.Color = RGB(110, 255, 170)\n    '从当前单元格获取数据并显示在单元格 C1 中\n\
  \    Range(\"C1\") = ActiveCell\n```\n\n9.  按 `Alt + F11` 返回工作表。\n10. 单击按钮文本前面。拖动选中文本，然后输入**水平显示文本**。单击一个空白单元格以取消选中该按钮。\n\
  11. 单击单元格 `G7`。单击你创建的按钮。\n\n单元格 `G7` 中的文本应以水平格式出现在单元格 `C1` 中。\n\n12. 单击单元格 `C7`。单击你创建的按钮。\n\
  \n单元格 `C7` 中的文本应以水平格式出现在单元格 `C1` 中。\n\n13. 在“开发工具”选项卡的“代码”组中，单击“宏”按钮。单击“宏”对话框上的“选项”按钮。见图\
  \ 19-19。\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig19_HTML.jpg](img/385660_2_En_19_Fig19_HTML.jpg)\n\
  \n**图 19-19** 从“宏”对话框中选择“选项”\n\n## 总结\n\n如果你发现自己需要反复执行相同的步骤，那么创建一个宏可以为你节省一些时间。宏可以通过快捷键来播放。宏也可以通过单击你为其指定的按钮或其他对象来播放。\n\
  \n你希望在所有工作簿中可用或与他人共享的宏，应存储在 `Personal.xlsb` 工作簿中。该工作簿保持隐藏状态，直到你单击“取消隐藏”按钮。\n\n创建宏时可以使用相对寻址或绝对单元格引用。当创建的宏仅影响单个单元格时，绝对单元格引用效果不错，但如果宏影响多个单元格，你很可能需要使用相对单元格寻址。\n\
  \nExcel 会将你创建的宏转换为 Visual Basic for Applications 代码。此代码是可编辑的。你无需创建宏即可生成 VBA 代码。你可以从头开始创建自己的\
  \ VBA 代码。当你掌握了 VBA 之后，你会发现你更经常自己编写代码，而不是让 Excel 为你生成。\n\n\n\n"
