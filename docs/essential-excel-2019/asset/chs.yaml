  \n## 使用主题\n\nExcel 中的主题由颜色、标题和正文字体以及应用于工作表的图形效果组成。主题位于“页面布局”选项卡的“主题”组中。参见图 12-24。你也可以创建自己的主题。你可以使用主题来美化电子表格的外观，并使其具有统一的外观。例如，你可以为不同的项目应用不同的主题，或者你的公司可能决定始终使用同一个主题。Microsoft\
  \ Word 和 PowerPoint 具有与 Excel 中相同的可用主题。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig24_HTML.jpg](img/385660_2_En_12_Fig24_HTML.jpg)\n\
  \n*图 12-24 主题库*\n\n`Office` 是默认主题。\n\n如果你点击“开始”选项卡“字体”组中 `Font`（字体）的下拉箭头，你会看到两个主题字体位于所有其他字体之上。参见图\
  \ 12-25。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig25_HTML.jpg](img/385660_2_En_12_Fig25_HTML.jpg)\n\
