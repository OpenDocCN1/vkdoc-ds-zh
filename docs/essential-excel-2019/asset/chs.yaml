  \ 28.95 美元的燃料**。按 `Enter` 键。光标应位于单元格 `D3`。\n2. 单击功能区上的“开始”选项卡。在“编辑”组中，单击 `Fill`\
  \ 按钮，然后选择 `Flash Fill`。见图 10-17。\n\n`Flash Fill` 使用了三列数据以及您输入的附加文本。它甚至在每个金额前面都加上了美元符号。见图\
  \ 10-18。\n\n1. 如果尚未打开，请打开工作簿第 10 章。\n2. 单击工作表 `FlashFill A`。\n3. 图 10-16 显示了工作表中的数据。\n\
  \n**练习 10-7：使用更多快速填充功能**  \n本练习将展示不同的功能，并说明使用 `Flash Fill` 时可能出现的潜在问题。\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig22_HTML.jpg](img/385660_2_En_10_Fig22_HTML.jpg)\
  \  \n图 10-22  \n将单元格 `D2` 更改为 John Studebaker 的结果\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig21_HTML.jpg](img/385660_2_En_10_Fig21_HTML.jpg)\
  \  \n图 10-21  \nD 列中所有的姓氏都变为了 Sludebaker\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig20_HTML.jpg](img/385660_2_En_10_Fig20_HTML.jpg)\
  \  \n图 10-20  \n使用 `Flash Fill` 的结果\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig19_HTML.jpg](img/385660_2_En_10_Fig19_HTML.jpg)\
  \  \n图 10-19  \n名为 `3 Names` 的工作表上的数据\n\n1. 清除 D 列中的内容。\n2. 在单元格 `D2` 中，输入 **John\
  \ Studebaker’s**，然后按 `Enter` 键。\n3. 按 `Ctrl + e`。图 10-22 显示了结果。\n\n**注意** 如果我们没有对\
  \ A、B、C 列中的列标题进行加粗或居中处理，Excel 将无法识别它们是列标题。这会在我们应用 `Flash Fill` 时造成问题。Excel 会将单元格\
  \ `A1` 和单元格 `C1` 中的文本合并，并放入单元格 `D1` 中。通过在单元格 `D1` 中添加一个列标题也可以避免此问题。\n\n1. 选择 D 列中的数据。右键单击所选数据，然后选择\
