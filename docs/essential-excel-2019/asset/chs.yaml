  \ 13`。单击“`游戏销售`”选项卡。图 13-5 显示了数据。\n\n您的图表位于一个可移动的框架中。将光标移到图表框架上。光标应显示为四个箭头 ![../images/385660_2_En_13_Chapter/385660_2_En_13_Figa_HTML.jpg](img/385660_2_En_13_Figa_HTML.jpg)。\n\
  \n3.  将图表拖放到您想要的任意位置。\n4.  增大图表尺寸：将光标置于图表框架的右下角，然后按住 `Shift` 键，同时将光标向右下角拖动。按住 `Shift`\
  \ 键可以使图表保持相同的宽长比。\n\n选定图表后，Excel 会在功能区上显示两个新选项卡：“`设计`”和“`格式`”。这两个选项卡位于“`图表工具`”分组下。\n\
  \n**注意** 图表由许多不同的单独元素组成。具体包含哪些元素取决于图表类型和正在绘制的数据。\n\n在功能区上，单击“`格式`”选项卡。在“`当前所选内容`”组中，“`图表元素`”下拉框会显示图表中当前选定的项目。\n\
