  \n## 使用转换功能导入数据\n\nExcel 的 Power `Query` 功能可以从许多源导入数据，并且能够对数据进行大量修改。可以从中导入数据的源包括网页和数据库。Excel\
  \ 默认支持从多种数据库类型导入数据。您可以使用 `Get & Transform Data` 组中提供的任何数据源。\n\n> **注意：** 您也可以从其他来源导入数据，例如通过\
  \ `ODBC` 标准从各种数据库管理系统（DBMS）导入。您可以从第三方获取 `ODBC` 和其他数据源驱动程序。\n\n在本节中，您将使用 `Get & Transform\
  \ Data` 组中的查询从网页导入数据，然后将该数据转换为您想要的格式。\n\n### 练习 14-5：使用 Power Query 转换数据\n\n在本练习中，我们将使用与前一个示例相同的数据。这次，我们将使用\
