  \ 剪贴板\n\n每执行一次复制操作，所复制的项目就会被放入 Office 剪贴板。Office 剪贴板是一个临时存储区域，最多可以复制 24 个项目。这些项目可以是文本，也可以是图表、图片、剪贴画、形状等图形。该剪贴板与其它\
  \ Microsoft Office 产品共享。这意味着您可以在 Excel、Access、PowerPoint、Word 等应用程序之间复制和粘贴项目。剪贴板使您可以快速轻松地重新排列文档中的数据，或者将来自其他\
  \ Office 产品的元素合并到文档中。剪贴板上的项目可以单独粘贴，也可以一次全部粘贴。\n\n项目会保留在剪贴板上，直到您将其从剪贴板中删除，或者直到关闭所有\
  \ Microsoft Office 应用程序为止。即使关闭了所有 Microsoft Office 应用程序，您添加到剪贴板中的最后一个项目仍会被保留。最后一个复制的项目会被添加到剪贴板的顶部。如果您尝试向剪贴板添加超过\
  \ 24 个项目，则最早添加的项目将被删除。重新启动计算机时，所有项目都将被清除。\n\n可以通过单击剪贴板组中的对话框启动器来打开剪贴板。这将打开“剪贴板”任务窗格。\n\
  \n**练习 11-10: 使用剪贴板**\n\n本练习涵盖使用剪贴板复制文本、形状、图片和图表。\n\n1.  打开工作簿 `Clipboard.xlsx`。\n\
  2.  单击**剪贴板**工作表标签。\n3.  单击剪贴板组右下角的“对话框启动器” ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figao_HTML.jpg](img/385660_2_En_11_Figao_HTML.jpg)\
  \ 以打开剪贴板窗格。\n4.  单击**全部清空**按钮。\n5.  进行以下选择：\n    1.  选中单元格 `B3:C3`。按 `Ctrl + C`。\n\
  \    2.  选中单元格 `B4:C4`。按 `Ctrl + C`。\n    3.  选中单元格 `B5:C5`。按 `Ctrl + C`。\n    4.\
  \  选中单元格 `B6:C6`。按 `Ctrl + C`。\n\n请注意，**全部粘贴**按钮是灰色的。**全部粘贴**按钮不适用于图表和图片。\n\n6.\
  \  选择**剪贴板**工作表标签并完成以下步骤：\n    1.  单击形状的边缘。按 `Ctrl + C`。\n    2.  单击图表的外框。按 `Ctrl\
  \ + C`。\n7.  单击**图片**工作表标签。单击汽车图片。按 `Ctrl + C`。\n\n    图片、形状和图表应作为三个单独的项目出现在您的剪贴板中。\n\
  \n8.  单击**空白**工作表标签并完成以下步骤：\n    1.  单击单元格 `A2`。在剪贴板窗格中单击 `Wolves 7`。\n    2.  单击单元格\
  \ `A3`。单击 `Elephants 5`。\n    3.  单击单元格 `A7`。单击**全部粘贴**按钮。\n    4.  单击**全部清空**按钮。\n\
  9.  单击**空白**标签。将形状、图表和图片复制到**空白**工作表上的不同区域。\n10. 单击**全部清空**按钮。\n11. 关闭“剪贴板”窗格。\n\
  12. 关闭工作簿。\n\n您已经学习了多种复制和粘贴数据的方法。您已经了解了如何在其他数据之间插入复制的数据。接下来，您将学习如何通过在多个工作表中同时输入相同的数据来节省数据输入时间。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵守您的要求，对给定文本进行翻译。\n\n\n## 同时向多个工作表输入数据\n\n当您选中多个工作表时，在其中一个工作表中输入的任何内容都将同时输入到其他工作表中。您应用的任何格式也将应用于所有工作表。\n\
