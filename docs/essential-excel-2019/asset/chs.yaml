  \n图 7-57\n\n分配给常量 32% 的名称 `FederalTaxRate`\n\n5.  单击 **确定** 按钮。\n\n假设州税率为 8%。\n\n\
  1.  单击 **定义名称** 按钮。\n2.  在 **名称** 文本框中键入 `StateTaxRate`。\n3.  在 **备注** 框中键入 `用于练习示例的虚构州税率`。\n\
