  \    粘贴数据的列宽与复制数据的列宽不匹配。\n4.  单击粘贴数据右下角出现的“`粘贴选项`”按钮 ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figan_HTML.jpg](img/385660_2_En_11_Figan_HTML.jpg)，或按\
  \ `Ctrl` 键调出粘贴选项。参见图 11-18。\n\n1.  使用您在上一练习中创建的工作簿 `Chapter 11B`。\n2.  按 `Ctrl +\
  \ N`。这是创建新工作簿的快捷键。\n3.  单击功能区的“`视图`”选项卡。在“`窗口`”组中，单击“`全部重排`”按钮。将显示“`重排窗口`”对话框。参见图\
  \ 11-17。\n\n### 选择性粘贴\n\n“`选择性粘贴`”命令为您提供了对粘贴操作更强的控制。只要您想要执行以下任何操作，就应使用它：\n\n-  \
  \ 粘贴来自复制或剪切单元格操作的某些属性。\n-   使用复制或剪切单元格的内容与粘贴单元格的内容执行数学运算。\n-   忽略空单元格。\n-   将行数据转置为列数据，或将列数据转置为行数据。\n\
  -   将粘贴的单元格链接到复制的单元格。\n\n“`选择性粘贴`”命令位于“`粘贴`”库的底部。参见图 11-19。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig19_HTML.jpg](img/385660_2_En_11_Fig19_HTML.jpg)\n\
  \n图 11-19：选择“选择性粘贴”\n\n\n\n#### 使用“选择性粘贴”\n\n选择`Paste Special`（选择性粘贴）会弹出`Paste Special`（选择性粘贴）对话框。见图\
  \ 11-20。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig20_HTML.jpg](img/385660_2_En_11_Fig20_HTML.jpg)\n\
  \n图 11-20  \n“选择性粘贴”对话框\n\n注意  \n窗口底部的`Paste Link`（粘贴链接）按钮仅在选择了`All`（全部）或`All Except\
  \ Borders`（除边框外全部）时可用。选择其他选项时，该按钮会变灰。\n\n表 11-4 描述了粘贴选项。表 11-5 描述了运算选项。\n\n表 11-5\
  \  \n运算选项\n\n| 运算选项 | 描述 |\n| --- | --- |\n| `None`（无） | 不对粘贴的单元格执行任何数学运算。 |\n|\
  \ `Add`（加） | 将复制单元格中的值与被粘贴单元格中的值相加。 |\n| `Subtract`（减） | 从被粘贴单元格中的值中减去复制单元格中的值。\
  \ |\n| `Multiply`（乘） | 将复制单元格中的值与被粘贴单元格中的值相乘。 |\n| `Divide`（除） | 将被粘贴单元格中的值除以复制单元格中的值。\
  \ |\n\n表 11-4  \n“选择性粘贴”选项\n\n| 选择性粘贴选项 | 描述 |\n| --- | --- |\n| `All`（全部） | 执行与按下`Ctrl\
  \ + V`相同的操作。粘贴所有单元格内容和格式。不调整列宽。 |\n| `Formulas`（公式） | 粘贴复制单元格中使用的公式。 |\n| `Values`（数值）\
  \ | 仅粘贴公式的结果，而不是公式本身。 |\n| `Formats`（格式） | 仅粘贴格式，不粘贴数据。 |\n| `Comments`（批注） | 仅粘贴附加到单元格的批注。\
  \ |\n| `Validation`（验证） | 粘贴复制单元格的数据验证规则。 |\n| `All Using Source Theme`（使用源主题的全部内容）\
  \ | 使用应用于复制单元格的主题粘贴所有单元格内容和格式。 |\n| `All Except Borders`（除边框外全部） | 粘贴除应用于复制单元格的边框之外的所有内容。\
  \ |\n| `Column Widths`（列宽） | 粘贴列宽，使其与复制单元格的列宽匹配。 |\n| `Formulas and Number Formats`（公式和数字格式）\
  \ | 粘贴公式和单元格内容。粘贴任何数字格式，例如`$`和逗号等，但不粘贴文本格式。 |\n| `Values and Number Formats`（数值和数字格式）\
  \ | 仅粘贴公式的结果，而不是公式本身。粘贴任何数字格式，例如`$`和逗号等，但不粘贴文本格式。 |\n\n注意  \n根据您复制的内容和选择的粘贴选项，某些选项可能不可用。\n\
  \n注意  \n数学运算只能应用于数值。如果您要执行数学运算之一（`Add`（加）、`Subtract`（减）、`Multiply`（乘）或`Divide`（除）），则必须从粘贴选项中选择`All`（全部）、`All\
  \ except borders`（除边框外全部）或`Values and number formats`（数值和数字格式）。\n\n#### 使用“选择性粘贴”\n\
  \n1.  选择包含要复制的数据或属性的单元格。\n2.  按`Ctrl + C`。\n3.  选择粘贴区域左上角的单元格。如果您要执行数学运算，则需要选择粘贴区域中的所有单元格。\n\
  4.  在`Home`（开始）选项卡上的`Clipboard`（剪贴板）组中，单击`Paste`（粘贴）按钮的下半部分。选择`Paste Special`（选择性粘贴）。\n\
  5.  选择您想要执行的粘贴选项。\n6.  选择您想要执行的运算选项。如果您不执行数学运算，请选择`None`（无）。\n7.  如果要粘贴静态数据（非链接），请点击您要使用的粘贴选项，然后点击`OK`（确定）按钮。\n\
  \n或者\n\n*   如果要粘贴链接数据，必须从粘贴选项中选择`All`（全部）或`All except borders`（除边框外全部），然后单击`Paste\
  \ Link`（粘贴链接）按钮。\n*   选择`Skip blanks`（跳过空单元格）以避免将空白单元格复制到粘贴区域。\n*   选择`Transpose`（转置）将行数据更改为列数据，反之亦然。\n\
  \n实用提示  \n如果您经常使用`Paste Special`（选择性粘贴），可以将其添加到快速访问工具栏。\n\n### 使用“选择性粘贴”转置行和列\n\n\
  `Paste Special`（选择性粘贴）命令有一个`Transpose`（转置）选项，用于将行数据转换为列数据，反之亦然。您可能会使用`Transpose`（转置）功能的一个常见场景是：您已经设置好了行标题和列标题，然后决定您实际上希望将行标题作为列标题，而将列标题作为行标题。您无需手动重新输入标题，而是可以通过使用`Paste\
  \ Special`（选择性粘贴）的`Transpose`（转置）选项来交换它们。\n\n#### 练习 11-5：使用“选择性粘贴”的“转置”选项\n\n在本练习中，您将转置原始复制数据的行和列。\n\
  \n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig22_HTML.jpg](img/385660_2_En_11_Fig22_HTML.jpg)\n\
  \n图 11-22  \n在`Paste Special`（选择性粘贴）对话框中选择`Values`（数值）和`Transpose`（转置）\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig21_HTML.jpg](img/385660_2_En_11_Fig21_HTML.jpg)\n\
  \n图 11-21  \n输入此数据\n\n1.  选择`Transpose`（转置）。\n2.  点击`OK`（确定）按钮。\n3.  将列标题加粗并居中。\n\
  4.  选择单元格 A1:E7。\n5.  右键单击所选数据并选择`Copy`（复制）。\n6.  右键单击单元格 A10 内部。从上下文菜单中选择`Paste\
  \ Special`（选择性粘贴）。\n7.  在“粘贴”区域中，选择`Values`（数值）（图 11-22）。如果选择`All`（全部），会使现在将成为行标题的内容保持加粗。\n\
  8.  创建一个名为`Chapter 11C`的新工作簿。将工作表命名为“Transpose”（转置）。\n9.  输入图 11-21 中的数据。将列标题加粗。\n\
