  ## 如何更改行高\n\n更改行高的操作与更改列宽类似。默认情况下，行高为 `15.00`。\n\n更改行高需先选中要调整高度的行。选择行的方法与选择列相同：单击特定行的行号，拖动鼠标选中相邻行，或按住\
  \ `Ctrl` 键的同时单击行号以选择不相邻的行（见图 3-19）。选中行后，将光标置于某选中行的行标题与另一行标题之间，向下拖动可增加行高，向上拖动则可减小行高。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig19_HTML.jpg](img/385660_2_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n选择行后，向上或向下拖动以更改所选行的高度\n\n双击选中行的行号之间的分隔线，可自动调整行高以适应该行中最高的文本或对象。\n\n另一种更改行高的方法如下：\n\
  \n1. 选择要更改的行。\n2. 在 `开始` 选项卡的 `单元格` 组中，单击 `格式`。\n3. 在菜单中选择 `行高` 或 `自动调整行高`。\n\n\
  通过单击 `全选` 按钮，可以选中电子表格中的所有行。然后，通过在任何行标题之间上下拖动，即可调整所有行的高度。`全选` 按钮位于 `A 列` 标题的左侧和 `行\
  \ 1` 标题的上方。参见图 3-20。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig20_HTML.jpg](img/385660_2_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20\n\n`全选` 按钮\n\n### 练习 3-4：更改行高\n\n本练习使用您之前练习调整列宽时创建的同一电子表格。如果您已关闭上一练习中的第\
