  \n图 1-34  \n对单词 Mammoth 使用智能查找的结果\n\n### “帮助”选项卡\n\nExcel 的最新更新包含一个专门用于帮助和支持的选项卡。你还可以向\
  \ Microsoft 提供反馈，告诉他们你喜欢什么、不喜欢什么以及对改进 Excel 的建议。“帮助”选项卡只包含一个组。如图 1-36 所示。\n\n![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig36_HTML.jpg](img/385660_2_En_1_Fig36_HTML.jpg)\n\
  \n图 1-36  \n“帮助”选项卡\n\n#### 新增功能\n\n单击 `新增功能` 按钮会向 Office 365 用户展示 Excel 中新增的最新功能。见图\
  \ 1-37。\n\n![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig37_HTML.jpg](img/385660_2_En_1_Fig37_HTML.jpg)\n\
  \n图 1-37  \n新增功能\n\n#### 显示培训\n\n`显示培训` 选项会显示一系列培训类别。见图 1-38。\n\n![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig38_HTML.jpg](img/385660_2_En_1_Fig38_HTML.jpg)\n\
  \n图 1-38  \n培训选项\n\n当你单击某个类别时，会看到该类别下帮助主题的列表。单击 `快速入门` 类别会显示如图 1-39 所示的主题。单击其中任何一个主题，即可获得该主题的帮助。\n\
  \n![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig39_HTML.jpg](img/385660_2_En_1_Fig39_HTML.jpg)\n\
  \n图 1-39  \n快速入门主题\n\n#### 联系支持人员\n\n`联系支持人员` 选项会弹出一个文本框，你可以在其中输入遇到的问题。输入问题后单击 `获取帮助`\
  \ 按钮，会显示一些自助解决方案供你尝试。如果这仍然没有解决你的问题，你可以单击窗口底部的 `实时聊天` 获取 Microsoft 支持人员的帮助。见图 1-40。\n\
