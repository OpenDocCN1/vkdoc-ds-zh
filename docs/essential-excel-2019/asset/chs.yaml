  ## 帐户组


  您的 `Account` 窗格中的更改将影响您的所有 Microsoft Office 产品。在此处，您可以管理您的 Microsoft Office 帐户、检查
  Microsoft 更新以及更改 Office 主题。您还可以添加显示在标题栏上的 Office 背景图案。


  ## 总结


  在本章中，您学习了如何使用 Backstage 选项来管理、编辑、保存和打印工作簿。您还了解了如何保护工作簿、恢复工作簿以及共享工作簿。


  下一章将向您展示如何手动或使用向导创建公式。Excel 函数是内置公式。函数是将 Excel 转变为一个计算能力强大的工具，而不仅仅是允许您输入数据并对其进行精美格式化和打印的工具。


  '
- "# 7. 创建和使用公式\n\n创建公式是为了从诸如计算我们在商店购买的物品总额、计算我们的税款、计算汽车的每加仑英里数等事务中获得结果。Excel 中的公式是一个经过计算的表达式，其结果将放置在包含该公式的单元格中。您可以输入自己的公式，也可以使用\
  \ Excel 众多的内置公式之一。Excel 的内置公式被称为 `functions`。\n\n阅读并完成本章后，您应该能够：\n\n- 在单元格或编辑栏中输入公式\n\
  - 按照正确的运算顺序输入公式\n- 复制公式\n- 使用自动函数\n- 查看工作表上的所有公式\n- 选择在公式中使用的已命名区域\n- 使用绝对引用和混合单元格引用\n\
  - 创建和编辑已命名区域和常量\n\n### 公式\n\n如果没有输入公式的能力，Excel 将仅仅作为一个数据输入表，您可以对齐和格式化数据以及创建图表。Excel\
  \ 有用于合计行和列的公式，但它允许您做的远不止这些。您可以使用 Excel 的内置公式，也可以输入您能想到的几乎任何公式。您可以使用非常基础的公式，也可以使用极其复杂的公式。如果您想计算三角形的面积，可以输入该公式。需要使用二次方程求解问题？您也可以输入相应的公式。\n\
  \n\n\n### 公式介绍\n\n公式的一个示例是 `= 5 * 6`，该表达式返回数值 30。公式始终以等号 (`=`) 开头。表 7-1 列出了 Excel\
  \ 使用的数学符号及其含义。\n\n**表 7-1** Excel 使用的数学符号\n\n| 符号 | 含义 |\n| --- | --- |\n| `+` |\
  \ 加法 |\n| `–` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 百分比（将整数转换为百分比） |\n| `^`\
  \ | 乘方 例如 (`3²`) |\n| `=` | 等于 |\n| `<` | 小于 |\n| `<=` | 小于或等于 |\n| `>` | 大于 |\n\
  | `>=` | 大于或等于 |\n| `<>` | 不等于 |\n\n公式可以包含特定数值和单元格地址。当公式中包含单元格地址时，公式中实际使用的是该单元格中的值，而非地址本身。表达式的结果会放入包含该公式的单元格中。\n\
  \n如果我想将单元格 `A3` 和 `B3` 中的值相加，并将结果放入单元格 `C3` 中，则应按图 7-1 所示输入公式。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig1_HTML.jpg](img/385660_2_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1** 单元格 `C3` 包含将单元格 `A3` 和 `B3` 中的值相加的公式\n\n图 7-2 显示了输入图 7-1 中公式后的结果。\n\n\
  ![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig2_HTML.jpg](img/385660_2_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2** 单元格 `C3` 包含单元格 `A3` 和 `B3` 相加的结果\n\n如果当前单元格中有公式，单元格将显示公式的结果，但公式会显示在编辑栏中。参见图\
  \ 7-3。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig3_HTML.jpg](img/385660_2_En_7_Fig3_HTML.jpg)\n\
  \n**图 7-3** 单元格 `C3` 的公式显示在编辑栏中\n\n表 7-2 显示了公式的示例，以及假设单元格 `A3` 包含值 30 且单元格 `B3`\
  \ 包含值 20 时，这些公式将产生的结果。\n\n**表 7-2** Excel 公式及其结果（结果将放入包含该公式的单元格中）\n\n| 公式 | 结果 |\n\
  | --- | --- |\n| `= A3 + 25` | 55 |\n| `= A3 – B3` | 10 |\n| `= B3 – A3` | –10 |\n\
  | `= A3 * 10` | 300 |\n| `= A3 / B3` | 1.5 |\n| `= A3 * 10%` | 3 |\n| `= B3 ^ 3`\
  \ | 8000 |\n\n在单元格中输入 `=` 号作为第一个字符，即告知 Excel 其后内容为一个公式。\n\n### 输入公式\n\n输入公式有以下三种方式：\n\
  \n- 直接在单元格中键入公式\n- 单击要在公式中引用的单元格，并用数学符号分隔\n- 使用箭头键选择要在公式中引用的单元格，并用数学符号分隔\n\n####\
  \ 在单元格中键入公式\n\n键入完整公式时，首先输入一个等号，然后输入任何数值或单元格引用，并用数学符号分隔。如果在公式中输入了任何单元格引用，Excel 将高亮显示公式中的单元格地址，并在被引用的单元格周围添加边框。两者会以相同的颜色高亮显示。\n\
