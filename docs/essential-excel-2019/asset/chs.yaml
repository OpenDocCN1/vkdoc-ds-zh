  \ 的背景色和文本 `A1` 将颜色相同。单元格 `B2` 的单元格背景及文本 `B1` 将使用另一种匹配的颜色。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig4_HTML.jpg](img/385660_2_En_7_Fig4_HTML.jpg)\n\
