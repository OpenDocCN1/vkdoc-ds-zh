  \n图 13-63：从“图表选项”中选择“数据标签”\n\n7.  尝试更改单个矩形的颜色或纹理。\n\n如果并非所有数据值都显示，您可能需要扩大图表的大小。\n\
  \n8.  双击其中一个密歇根州矩形，以重新选中所有密歇根州矩形。在“设置数据点格式”窗格中，单击“填充与线条”按钮（油漆桶图标）。\n9.  展开“填充”组。\n\
  10. 选择**图片或纹理填充**。\n11. 单击图 13-69 中显示的“纹理”下拉框。选择您想使用的任何纹理。\n\n12. 单击一个密歇根州矩形，然后再次单击它。单击密歇根州组中的甜甜圈矩形。所有矩形都应变暗，除了密歇根州的甜甜圈矩形。单击一个空白单元格以取消矩形的变暗状态。\n\
  \n当选中一组矩形或单个矩形时，您可以将其背景更改为不同的颜色、渐变、图片或纹理。图 13-68 显示为密歇根州的一组矩形选择了纹理。您还可以通过单击功能区的“格式”选项卡，然后从“形状样式”组中选择一个选项来应用各种效果并更改其边框。\n\
  \n13. 在标签仍处于选中状态时，按 `Ctrl + B` 将文本加粗。\n14. 单击“图表标题”。拖动鼠标选中它。输入**按州销售额**。\n\n如果您单击一个州的某个矩形，然后再次单击同一个矩形，则所有与该州无关的矩形都会变暗。在图\
  \ 13-67 中，图例项“密歇根州”被单击了两次。一旦选中了一个组，您可以单击单个矩形来选中它，或者通过单击另一个组的标题来选中它。如果您单击矩形内的某个标签，所有内容将再次被选中。\n\
  \n15. 白色文本可能难以辨认：\n    1.  单击功能区的“开始”选项卡。\n16. 单击“字体颜色”的下拉箭头，然后选择黑色。\n\n17. 选择**值**。从“分隔符”下拉框中选择**新行**。选择“新行”会将标签和数值分别放在两行上，如图\
  \ 13-66 所示。\n\n18. 单击“标签选项”按钮。展开“标签选项”，以便您能看到如图 13-65 所示的选项。\n\n19. 单击图表框架。单击功能区的“格式”选项卡。在“当前所选内容”组中，单击“设置所选内容格式”。在“设置图表区格式”窗格中，单击“图表选项”的下拉箭头，然后选择“数据标签”。参见图\
  \ 13-63。\n\n这将添加另一个选项按钮，即“标签选项”。参见图 13-64。\n\n\n\n### 旭日图\n\n与矩形式树状结构图类似，旭日图也是一种层级结构图。它并非使用矩形大小来表示数值，而是采用饼图扇区的大小。\n\
  \n旭日图相比矩形式树状结构图的一个优势在于，它可以展示更多列标签。在矩形式树状结构图的示例中，第一列（`状态`）用作标题，下一列（`产品`）用于表示各个矩形。如果我们想按照`状态`、`县`，再在县内按`产品`进行更细的划分，那么`县`这一层级在矩形式树状结构图中不会显示，但在旭日图中却可以显示。\n\
  \n使用与矩形式树状结构图相同的数据并选择相同的选项，让我们看看图 13-70 中旭日图的结果。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig70_HTML.jpg](img/385660_2_En_13_Fig70_HTML.jpg)\n\
  \n图 13-70\n\n旭日图\n\n旭日图清晰地显示印第安纳州是我们利润最高的州。从图中很容易看出，甜甜圈是我们在印第安纳州销售利润最高的商品。该图由内向外展开。最大的分组位于图的中心。细节部分距离中心最远。\n\
  \n密歇根州松饼的饼图扇区不够大，无法显示标签和数值。如果我们移除数值，松饼的标签就会变得可见。参见图 13-71。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig71_HTML.jpg](img/385660_2_En_13_Fig71_HTML.jpg)\n\
  \n图 13-71\n\n移除数值为标签显示提供了更多空间\n\n现在，密歇根州松饼利润的标签可见了。如果您想查看每个扇区对应的数值，只需将光标悬停在某个项目上即可。参见图\
  \ 13-72。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig72_HTML.jpg](img/385660_2_En_13_Fig72_HTML.jpg)\n\
  \n图 13-72\n\n将光标悬停在扇区上以查看对应的数值\n\n### 练习 13-6：创建旭日图\n\n本练习涵盖选择要在旭日图中表示的数据，以及选择图表部分并应用样式。\n\
