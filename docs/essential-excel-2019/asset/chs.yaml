  \n图 13-76\n\n您的电子表格现在应如下所示\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig75_HTML.jpg](img/385660_2_En_13_Fig75_HTML.jpg)\n\
  \n图 13-75\n\n从“样式”组中选择`强调色 5`\n\n1.  单击功能区的“设计”选项卡。在“图表布局”组中，单击“快速布局”按钮。选择“布局 5”。这会将`毛额`值添加到图表中。\n\
  2.  在“图表样式”组中，单击“更改颜色”按钮。选择“彩色调色板 3”。\n3.  在 Excel 2016 中，选择“图表样式”组中的最后一个图表可使图表具有\
  \ 3D 外观。此功能在较新版本中已不再可用，但我们将通过格式化使其具有某种 3D 外观。选择图表，然后在功能区的“设计”选项卡上，从“图表样式”组中选择最后一个图表选项。右键单击图表。选择“设置数据系列格式”。单击“效果”按钮。展开“阴影”。输入角度为\
