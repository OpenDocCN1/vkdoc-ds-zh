  \ 迷你图\n\n迷你图是显示在单个单元格中的小型图表，用于突显单行或单列中的趋势。迷你图分为三种类型：折线图、柱形图和盈亏图。创建迷你图时，需先选中要放置迷你图的单元格，然后选择要创建的迷你图类型。`迷你图`组位于`插入`选项卡上，该组包含三个按钮：`折线图`、`柱形图`和`盈亏图`。见图\
