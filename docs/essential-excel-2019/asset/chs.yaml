  \ 1 章中使用过，该选项应会显示）。Excel 将打开 `另存为` 对话框。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig2_HTML.jpg](img/385660_2_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n`文件` 选项卡（也称为 Backstage 视图）\n\n4. 启动 Excel 程序。\n\n5. 选择 `文件` ➤ `新建`，然后选择\
