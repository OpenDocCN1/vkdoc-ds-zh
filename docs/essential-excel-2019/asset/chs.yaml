  \n**图 5-13** “视图”选项卡上的“显示”组\n\n你已经使用了分页预览和页面布局视图。现在，你将返回普通视图，以查看选择要打印内容的不同方式。\n\n\
  ## 打印\n\n电子表格可能非常庞大。在大型电子表格中对齐页面并按照所需方式调整页边距可能很困难。但很可能你并不想打印大型电子表格中的所有信息。如果你只想打印工作表的一部分，可以通过以下几种方式实现：\n\
  \n*   隐藏不想打印的行或列。\n*   如果要打印的单元格不相邻，你可以先选定一个区域中要打印的单元格，然后按住 `Ctrl` 键，再选择其他要打印的区域。\n\
  *   将要打印的不同区域按照你希望打印的顺序复制到另一个工作表。您可以使用粘贴链接，以便数据动态更新。然后打印只包含所需数据并按你希望顺序排列的工作表。\n\
  *   设置打印区域。打印区域可以按需扩展或清除。除非你选择“忽略打印区域”选项，否则只会打印打印区域内的内容。\n\n以下部分将指导您使用打印区域，并按照所需顺序组装一份打印报告。\n\
  \n### 创建打印区域\n\n你可以通过选择要打印的一个或多个区域，然后将这些区域设为**打印区域**，仅打印电子表格中所需的部分。如果你要经常打印工作表的这些区域，请设置一个打印区域。\n\
  \n可以通过先选择要打印的单元格，然后单击“页面布局”选项卡上“页面设置”组中的“打印区域”按钮来设置打印区域。见图 5-14。选择**设置打印区域**即可创建打印区域。**添加到打印区域**选项仅在已设置打印区域后出现。\n\
  \n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig14_HTML.jpg](img/385660_2_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14** “打印区域”按钮\n\nExcel 会将选定的单元格保存为一个命名区域，并自动将其命名为 `Print Area`。你只能有一个打印区域，但该打印区域可以包含多个范围。\n\
  \n### 向打印区域添加其他单元格\n\n创建打印区域后，可以通过选择其他单元格，然后单击“打印区域”按钮并选择**添加到打印区域**，将这些单元格添加到打印区域。\n\
  \n**注意**\n\n使用多个范围作为打印区域时有一个烦人的问题，那就是 Excel 会在这些范围之间插入分页符。这意味着每次添加到打印区域的内容都会显示在单独的页面上。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n### 移除打印区域\n\n只需单击 `打印区域`\
  \ 按钮，然后选择 `清除打印区域`，即可移除打印区域。\n\n只有在需要多次使用打印区域时，您才会用到它；否则，您可以选择要打印的区域，然后单击功能区上的 `文件`\
  \ 选项卡，从左窗格中选择 `打印`，单击 `打印活动工作表` 的下拉箭头，然后选择 `打印选定区域`。见图 5-15。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig15_HTML.jpg](img/385660_2_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15\n\n仅打印工作表的选定区域\n\n### 练习 5-3：打印工作表的一部分\n\n此示例的工作表包含一家大型公司的数据，该公司正在追踪其在\
  \ 17 家门店销售的 39 种产品的销售情况。\n\n1.  单击 `返回` 按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figl_HTML.jpg](img/385660_2_En_5_Figl_HTML.jpg)。\n\
  2.  在功能区的 `页面布局` 选项卡上的 `页面设置` 组中，单击 `打印区域` 按钮，然后选择 `清除打印区域`。\n3.  取消隐藏被隐藏的列。\n \
  \   1.  选中单元格 `A1` 到 `H9` (`A1:H9`)。\n    2.  在功能区的 `页面布局` 选项卡上的 `页面设置` 组中，单击 `打印区域`\
  \ 按钮，然后选择 `设置打印区域`。名称 `Print_Area` 应出现在 `名称` 框中。\n    3.  选中单元格 `U3` 到 `V6` (`U3:V6`)。您应该会看到单元格\
  \ `A1:H9` 周围有一条细线，表示您已选择这些单元格作为打印区域。\n    4.  在 `页面设置` 组中，单击 `打印区域` 按钮，然后选择 `添加到打印区域`。\n\
  \    5.  单击功能区的 `文件` 选项卡。从左窗格中选择 `打印`。\n    6.  打印预览区域应显示您正在查看第 1 页，共 2 页。当您单击 `添加到打印区域`\
  \ 时选择的单元格位于第二页。每次使用 `添加到打印区域` 添加另一个选择时，它都会打印在不同的页面上。如果您希望每个部分都打印在单独的页面上，这非常有效；但是，如果您不想这样，可以使用下一节讨论的\
  \ `选择性粘贴`。\n\n    **注意** 如果将 `设置` 更改为 `打印整个工作簿`，则将忽略打印区域并打印整个工作簿。如果选择 `忽略打印区域`，则任何\
  \ `打印` 选项都不会识别打印区域。见图 5-17。\n\n    ![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig17_HTML.jpg](img/385660_2_En_5_Fig17_HTML.jpg)\n\
  \n    图 5-17\n\n    选择 `忽略打印区域`，以防止任何打印选项使用打印区域\n\n1.  如果尚未打开，请打开您一直在本章中使用的工作簿第\
  \ 5 章。单击 `门店` 工作表。\n2.  拖选列标题 `D` 到 `G`。右键单击其中一个选中的列标题。选择 `隐藏`。\n3.  拖选列标题 `L` 到\
  \ `R`。右键单击其中一个选中的列标题。选择 `隐藏`。\n4.  单击功能区的 `文件` 选项卡。从左窗格中选择 `打印`。\n5.  注意，隐藏的列不会出现在打印预览中。\n\
  6.  单击 `返回` 按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figk_HTML.jpg](img/385660_2_En_5_Figk_HTML.jpg)。\n\
  7.  将从单元格 `U3` 开始，如图 5-16 所示的数据添加到工作表中。\n\n    ![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig16_HTML.jpg](img/385660_2_En_5_Fig16_HTML.jpg)\n\
  \n    图 5-16\n\n    将这些数据添加到工作表\n\n您已经学会了如何仅打印您想要打印的单元格区域。接下来，您将看到使用 `选择性粘贴` 如何让您对打印有更多控制，并有助于解决\
  \ Excel 在区域之间放置分页符的问题。\n\n### 使用选择性粘贴进行打印\n\n如果您希望更灵活地控制报表不同部分的打印位置，可以复制报表中您想看到的各个部分，然后使用\
  \ `选择性粘贴` 将它们放置到独立工作表中您希望打印的位置。此方法的另一个好处是，您可以复制来自不同工作表的数据。\n\n### 练习 5-4：使用选择性粘贴组合一个可打印的工作表\n\
  \n在本练习中，您将提取工作表的不同部分，并将它们组合到另一张工作表中，该工作表可以打印为单页。\n\n1.  单击 `门店` 工作表。选择范围 `U3:V6`。按\
  \ `Ctrl + C` 复制数据。\n2.  单击您命名为 `已粘贴` 的工作表。单击单元格 `G2`。在功能区的 `开始` 选项卡上的 `剪贴板` 组中，单击\
  \ `粘贴` 按钮的下拉箭头。选择 `选择性粘贴`。\n3.  将显示 `选择性粘贴` 窗口。单击 `粘贴链接`。加宽 `G` 列以查看所有数据。\n4.  单击\
  \ `门店` 工作表。选择范围 `A17:D21`。按 `Ctrl + C` 复制数据。\n5.  单击您命名为 `已粘贴` 的工作表。单击单元格 `A11`\
  \ 内部。在功能区的 `开始` 选项卡上的 `剪贴板` 组中，单击 `粘贴` 按钮的下拉箭头。选择 `选择性粘贴`。\n6.  将显示 `选择性粘贴` 窗口。单击\
  \ `粘贴链接`。\n7.  单击功能区的 `文件` 选项卡。从左窗格中选择 `打印`。打印预览显示您已成功地将所需数据放在了所需位置，并且仍将其保留在同一页面上。\n\
  8.  单击 `返回` 按钮 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Figm_HTML.jpg](img/385660_2_En_5_Figm_HTML.jpg)。\n\
  9.  单击 `门店` 工作表。将单元格 `B2` 中的值从 900 更改为 820。\n10. 单击 `已粘贴` 工作表。因为您创建了链接，所以单元格 `B2`\
  \ 会更新为您在 `门店` 工作表中输入的值。\n\n1.  使用第 5 章的工作簿。创建一个新工作表。将该工作表命名为 `已粘贴`。\n2.  单击 `门店`\
  \ 工作表。选择单元格区域 `A1:E9`。按 `Ctrl + C` 复制数据。\n3.  单击您命名为 `已粘贴` 的工作表。单击单元格 `A1` 内部。\n\
  4.  单击功能区的 `开始` 选项卡，然后在 `剪贴板` 组中，单击 `粘贴` 按钮的下拉箭头。选择最后一个选项 `选择性粘贴`。\n5.  将显示 `选择性粘贴`\
  \ 对话框。单击 `粘贴链接`。见图 5-18。这将在 `门店` 工作表和 `已粘贴` 工作表上的数据之间创建一个链接。\n\n    ![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig18_HTML.jpg](img/385660_2_En_5_Fig18_HTML.jpg)\n\
  \n    图 5-18\n\n    `粘贴链接` 在复制的数据和粘贴的数据之间创建链接\n\n您已经学会了使用 `选择性粘贴` 比使用打印区域能对打印进行更多的控制。`选择性粘贴`\
  \ 允许您从多个区域获取数据，并按您想要打印的顺序排列它们。接下来，您将学习如何同时查看工作表的多个副本。\n\n\n\n## 将 Excel 窗口拆分为多个窗格\n\
  \n大型工作表可能难以分析。你无法同时看到列标题和列合计；因此，每当你查看某个合计时，都必须向上滚动到工作表顶部，才能看到其列标题，从而了解该合计代表什么。行合计与行标题也存在同样的问题。另一个潜在问题是，你想比较\
  \ B 列与 V 列中的值，但无法同时看到两者，因此必须左右来回水平滚动才能进行比较。这些类型的问题可以通过将 Excel 屏幕拆分为多个独立的窗格来解决。你所创建的每个窗格中都会自动放置一份工作表的副本。这让你能够同时查看工作表的不同区域。\n\
  \n屏幕可以拆分为两个垂直窗格、两个水平窗格，或者两者的组合（将产生四个窗格）。\n\n以下是创建两个垂直窗格的方法：\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig19_HTML.jpg](img/385660_2_En_5_Fig19_HTML.jpg)\n\
  \n图 5-19\n\n`拆分窗口` 按钮已高亮显示\n\n1. 单击某一列标题。\n2. 单击功能区的“视图”选项卡。在“窗口”组中，单击 `拆分` 按钮。请参见图\
  \ 5-19。窗格将在所选列的左侧拆分。\n\n以下是创建两个水平窗格的方法：\n\n1. 单击某一行标题。\n2. 单击功能区的“视图”选项卡。在“窗口”组中，单击\
  \ `拆分` 按钮。窗格将在所选行的上方拆分。\n\n以下是创建四个窗格的方法：\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig20_HTML.jpg](img/385660_2_En_5_Fig20_HTML.jpg)\n\
  \n图 5-20\n\n窗口拆分为 4 个窗格。拆分线位于选定单元格的上方和左侧\n\n1. 单击某一个单元格。\n2. 单击功能区的“视图”选项卡。在“窗口”组中，单击\
  \ `拆分` 按钮。拆分条出现在选定单元格的上方和左侧。请参见图 5-20。\n\n可以通过将拆分条拖拽到所需位置来调整窗格的大小。\n\n如果当前没有显示任何拆分条，则单击\
  \ `拆分` 按钮会在窗口（而非工作表）的中心显示一条水平和一条垂直拆分条。请参见图 5-21。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig21_HTML.jpg](img/385660_2_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21\n\n拆分条出现在窗口的中心\n\n在工作表上放置水平拆分条会添加一个额外的垂直滚动条。在工作表上放置垂直拆分条会添加一个额外的水平滚动条。在工作表上同时放置水平和垂直拆分条会添加额外的水平和垂直滚动条。这提供了单独滚动每个窗格的能力。请参见图\
  \ 5-22。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig22_HTML.jpg](img/385660_2_En_5_Fig22_HTML.jpg)\n\
  \n图 5-22\n\n用于分别滚动四个窗格的水平与垂直滚动条\n\n可以通过双击拆分条将其从工作表中移除。双击两条拆分条的交汇处可以同时移除两者。功能区上的\
  \ `拆分` 按钮就像是一个切换开关。单击它可添加拆分条。再次单击则可移除拆分条。\n\n## 冻结行与列\n\n冻结行与列是另一种解决无法同时查看行标题和行合计，或列标题和列合计问题的方法。\n\
  \n在冻结工作表时，你可以选择以下三个选项之一：\n\n* **冻结窗格**——你可以同时冻结当前单元格之前的所有列和行。如果当前单元格是 C4，这意味着 A\
  \ 列和 B 列被冻结，同时第 1、2 和 3 行也被冻结。其余列和行则可滚动。\n* **冻结首行**——你可以冻结工作表的第一行，以便在滚动浏览工作表的其余部分时，该行始终保持可见。\n\
  * **冻结首列**——你可以冻结第一列，以便在滚动浏览工作表的其余部分时，该列始终保持可见。\n\n你可以通过单击 `视图` 选项卡，然后单击位于 `窗口`\
  \ 组中的 `冻结窗格` 按钮来选择这三个选项之一。请参见图 5-23。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig23_HTML.jpg](img/385660_2_En_5_Fig23_HTML.jpg)\n\
  \n图 5-23\n\n`冻结窗格` 选项\n\n一旦你使用三个选项之一冻结了工作表，第一个选项将从 `冻结窗格` 变为 `取消冻结窗格`。单击 `取消冻结窗格`\
  \ 将使你恢复正常查看状态。\n\n\n\n## 同步滚动\n\n您可以使用`窗口`组中的`新建窗口`、`并排查看`和`同步滚动`选项，打开工作簿的第二份副本，并排查看工作簿，使包含相同工作表的副本能够同步滚动。\n\
  \n### 练习 5-5：同步滚动、将窗口拆分为多个窗格以及冻结窗口\n\n在此练习中，您将把一个工作表拆分为多个工作表。看起来好像有多个工作表副本，但它们只是同一工作表的单独视图，您可以同时滚动它们。您还将练习冻结行和列。\n\
  \n1. 单击功能区的`视图`选项卡。在`窗口`组中，单击`全部重排`。选择`垂直`和`当前活动工作簿的窗口`。\n\n工作簿顶部的名称显示为`Chapter\
  \ 5:2`。原始工作簿的标题栏显示`Chapter 5:1`。\n\n2. `同步滚动`现在在`并排查看`按钮下高亮显示。使用其中一个工作簿的垂直和水平滚动条。请注意，当您拖动一个工作簿上的滚动条时，另一个工作簿也会随之滚动。\n\
  \n3. 通过单击工作簿右上角的`X`来关闭其中一个工作簿。工作簿标题恢复为其原始名称`Chapter 5`。\n\n4. 单击功能区的`视图`选项卡。在`窗口`组中，单击`并排查看`。\n\
  \n**注意**：如果除了`Chapter 5`工作簿之外，您还打开了其他工作簿，则会弹出一个`并排比较`窗口，您可以在其中选择要与`Chapter 5`并排查看的工作簿。您需要选择`Chapter\
  \ 5:1`。\n\n5. 如果`Chapter 5`工作簿尚未打开，请将其打开。单击`Stores`工作表。\n\n6. 单击功能区的`视图`选项卡。在`窗口`组中，单击`新建窗口`。将打开第二个窗口，其中`Stores`工作表处于活动状态。您可能看不到原始窗口，因为它可能隐藏在新建窗口后面。\n\
  \n7. 单击功能区的`视图`选项卡。在`窗口`组中，单击`全部重排`。选择`垂直`和`当前活动工作簿的窗口`。见图 5-24。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig24_HTML.jpg](img/385660_2_En_5_Fig24_HTML.jpg)\n\
  \n*图 5-24：选择当前活动工作簿的窗口*\n\n### 创建拆分条\n\n1. 双击两条拆分条相交的位置以同时移除它们。\n\n2. 将鼠标指针移动到两条拆分条的相交处。鼠标指针应变为双箭头。见图\
  \ 5-27。按住鼠标按钮并朝任意方向拖动；两条拆分条将随鼠标一起移动。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig27_HTML.jpg](img/385660_2_En_5_Fig27_HTML.jpg)\n\
  \n*图 5-27：鼠标指针放置在拆分条连接处时显示为双箭头*\n\n3. 使用顶部窗格中的滚动条滚动浏览顶部窗格中的数据。\n\n4. 使用底部窗格中的滚动条滚动浏览底部窗格中的数据。如您所见，您拥有工作表的两份完整副本。调整您的工作表，以便在两个工作表中都能看到单元格`B2`。\n\
  \n5. 单击上方窗格中的单元格`B2`内部。当您在一个窗格中选择一个单元格时，它也会在另一个窗格中被选中。\n\n6. 在单元格中输入`500`。按`Enter`键。此时，在两个工作表中，单元格`B2`的值都应显示为`500`。\n\
  \n7. 双击拆分条以将其移除。\n\n8. 单击单元格`G8`。在功能区的`视图`选项卡上的`窗口`组中，单击`拆分`按钮。这将在该单元格的上方和左侧创建相交的拆分条。见图\
  \ 5-26。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig26_HTML.jpg](img/385660_2_En_5_Fig26_HTML.jpg)\n\
  \n*图 5-26：窗口拆分为四个窗格，带有两个垂直和两个水平滚动条*\n\n练习移动水平滚动条和垂直滚动条，然后调整四个工作表，以便在所有四个窗格中都能看到同一个单元格。单击其中一个单元格。请注意，它会在所有四个窗格中高亮显示同一个单元格。如果您更改其中一个单元格，会影响所有四个窗格中的工作表。\n\
  \n9. 单击单元格`A3`内部。在功能区的`视图`选项卡上的`窗口`组中，单击`拆分`按钮。在当前选定的单元格上方会出现一条拆分条。您可以将拆分条拖动到其他位置。将水平拆分条向下拖动，使其位于第\
  \ 7 行和第 8 行之间。请注意，您会看到两个垂直滚动条。见图 5-25。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig25_HTML.jpg](img/385660_2_En_5_Fig25_HTML.jpg)\n\
  \n*图 5-25：窗口分为两个窗格，带有两个独立的滚动条*\n\n### 冻结窗格\n\n1. 尝试使用不同的活动单元格，然后冻结窗格。这对活动单元格上方的行和左侧的列有何影响？\n\
  \n2. 单击单元格`B2`并完成以下步骤：\n   1. 单击`冻结窗格`按钮。\n   2. 单击`冻结窗格`。\n   3. 垂直和水平滚动到数据的末尾。您的列标题和行标题都保持不动。\n\
  \   4. 取消冻结窗格。\n\n3. 在`窗口`组中，单击`冻结窗格`按钮。将显示三个冻结选项：\n   1. 单击冻结首行的选项。向下滚动数据。列标题将保持在其固定位置，这样无论您位于哪一行，都可以始终看到列标题。\n\
  \n4. 在`窗口`组中，单击`冻结窗格`按钮。第一个选项已更改为`取消冻结窗格`。单击此选项可取消冻结首行。\n\n5. 单击`冻结窗格`按钮。单击冻结首列的选项。向右滚动到数据的末尾。行标题将保持在其固定位置，这样无论您位于哪一列，都可以始终看到行标题。\n\
  \n6. 单击`冻结窗格`按钮。单击`取消冻结窗格`。\n\n您已经学会了如何冻结行标题和列标题，使它们在滚动时保持不动。您还学会了如何同时查看工作表的多个副本，同时保持它们的滚动同步。接下来，您将了解如何指定查看工作表的不同方式，然后将这些视图保存为自定义视图。\n\
  \n\n\n## 自定义视图：如何创建、显示和删除\n\n如果您或其他用户以不同方式查看您的工作簿，例如使用不同的页眉或页脚、不同的打印区域或页边距、显示不同的列或行、或者对数据应用了筛选等，您可以将不同的视图保存为自定义视图。每个自定义视图都有其自己的名称。当打开一个自定义视图时，它将使用所有已存储的设置打开。\n\
  \n在创建自定义视图之前，您需要将工作簿设置为您希望其显示和打印的精确外观。当您准备好保存当前视图时，请单击`视图`选项卡。在`工作簿视图`组中，单击`自定义视图`按钮。见图\
  \ 5-28。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig28_HTML.jpg](img/385660_2_En_5_Fig28_HTML.jpg)\n\
  \n图 5-28 — 自定义视图按钮\n\n单击`自定义视图`按钮会弹出如图 5-29 所示的`自定义视图`对话框，您可以在其中单击`添加`按钮。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig29_HTML.jpg](img/385660_2_En_5_Fig29_HTML.jpg)\n\
  \n图 5-29 — 自定义视图对话框\n\n单击`添加`按钮会弹出如图 5-30 所示的`添加视图`对话框，您可以在此处输入要分配给该视图的名称。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig30_HTML.jpg](img/385660_2_En_5_Fig30_HTML.jpg)\n\
  \n图 5-30 — 添加视图对话框\n\n创建视图后，您可以通过从`自定义视图`对话框中选择另一个视图，然后单击`显示`按钮来切换至该视图。\n\n注意：您不能创建包含表格的自定义视图。\n\
  \n### 练习 5-6：创建、显示和删除自定义视图\n\n在本练习中，您将创建三个视图，显示这些视图，然后将其删除。\n\n#### 创建视图\n\n1. \
  \ 单击功能区上的`视图`选项卡。在`工作簿视图`组中，单击`自定义视图`按钮。\n\n2.  在`自定义视图`窗口中，单击`添加`按钮。在`添加视图`窗口中，为名称输入`打印变更`。单击`确定`按钮。\n\
  \n3.  跨列标题 D、E、F 和 G 拖动以将其选中。右键单击选定的文本，然后选择`隐藏`。\n\n4.  单击功能区上的`视图`选项卡。在`工作簿视图`组中，单击`自定义视图`按钮。\n\
  \n5.  在`自定义视图`窗口中单击`添加`按钮。如图 5-31 所示，为自定义视图的名称输入`隐藏列`。单击`确定`按钮。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig31_HTML.jpg](img/385660_2_En_5_Fig31_HTML.jpg)\n\
  \n图 5-31 — 添加视图窗口\n\n6.  跨列标题 C 和 H 拖动以将其选中。右键单击选定的文本，然后选择`取消隐藏`。\n\n7.  跨行标题 15\
  \ 至 20 拖动以将其选中。右键单击选定的文本，然后选择`隐藏`。\n\n8.  单击功能区上的`视图`选项卡。在`工作簿视图`组中，单击`自定义视图`按钮。\n\
  \n9.  在`自定义视图`窗口中，单击`添加`按钮。\n\n10.  为自定义视图的名称输入`隐藏行`。单击`确定`按钮。\n\n11.  跨行标题 14 和\
  \ 21 拖动。右键单击选定的文本，然后选择`取消隐藏`。\n\n12.  单击功能区上的`页面布局`选项卡。在`页面设置`组中，单击`纸张方向`按钮，然后选择`横向`。\n\
  \n13.  单击`页面设置`组的对话框启动器 ![../images/385660_2_En_5_Chapter/385660_2_En_5_Fign_HTML.jpg](img/385660_2_En_5_Fign_HTML.jpg)：\n\
  \    - 单击`工作表`选项卡。\n    - 在`打印区域`文本框中输入`A1:K6`。\n    - 选择`网格线`。\n    - 单击`确定`按钮。\n\
  \n14.  如果尚未打开，请打开工作簿第 5 章。单击`自定义`选项卡。\n\n15.  单击功能区上的`视图`选项卡。在`工作簿视图`组中，单击`自定义视图`按钮。\n\
  \n16.  在`自定义视图`窗口中单击`添加`按钮。如图 5-31 所示，为自定义视图的名称输入`原始视图`。单击`确定`按钮。\n\n#### 显示视图\n\
  \n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig32_HTML.jpg](img/385660_2_En_5_Fig32_HTML.jpg)\n\
  \n图 5-32 — 自定义视图窗口\n\n1.  单击`自定义视图`按钮。单击`隐藏行`，然后单击`显示`按钮。第 15 行至第 20 行被隐藏。\n\n2.\
  \  单击`自定义视图`按钮。单击`打印变更`，然后单击`显示`按钮。单击功能区上的`文件`选项卡。在左侧窗格中单击`打印`。您可以看到，只有您为打印区域选择的内容才会被打印，并且是横向模式。单击`返回`按钮。\n\
  \n3.  单击`自定义视图`按钮。单击`原始视图`，然后单击`显示`按钮。\n\n4.  单击`自定义视图`按钮。单击`隐藏列`，然后单击`显示`按钮。见图\
  \ 5-32（D 列至 G 列被隐藏）。\n\n#### 删除视图\n\n1.  在`工作簿视图`组中，单击`自定义视图`按钮。\n\n2.  选择一个视图，然后单击`删除`按钮。系统将要求您确认删除。单击`是`。\n\
  \n3.  对其余三个视图重复步骤 1 和 2。\n\n本节向您展示了如何创建自己的自定义视图，以便以不同方式查看同一个工作表。每个自定义视图都分配有自己独有的名称。工作簿的所有自定义视图都存储在该工作簿中。如果您不使用自定义视图，则必须保存工作簿的不同版本来获得相同的结果。\n\
  \n## 总结\n\nExcel 可以在三种不同视图之一中显示电子表格。`普通`视图是您大多数时候会使用的视图。`分页预览`对于调整分页符很有用。`页面布局`视图提供了一种添加、编辑和删除页眉和页脚的快捷方式。\n\
  \n自定义视图允许您或其他用户在同一电子表格的不同视图之间来回切换。例如，您可以创建一个视图来显示所有数据，创建第二个视图来显示某些列，创建第三个视图来打印工作表的一部分。\n\
  \n您可以将工作表拆分为多个窗格，然后逐个滚动浏览各个窗格。您已经练习了如何让工作表呈现出您想要的样子，并使用了打开 Excel 时可以看到的许多按钮。接下来，您将学习“后台视图”，其中包括以不同格式保存工作簿的更多选项，以及如何跟踪有关工作簿创建时间和原因的信息。您还将练习如何通过电子邮件共享工作簿。接下来讨论的其他功能包括如何跟踪您最近的工作以及如何使用导航窗格。\n\
  \n"
- '# 6. 了解后台视图


  `文件`选项卡与其他选项卡不同，它不会显示一系列带有按钮的组；相反，它会显示所谓的后台视图。这个区域被称为后台视图，因为后台视图上的选项是在工作簿幕后处理的，例如处理文件、打印、共享和导出工作簿、帐户信息，以及选择更改
  Excel 工作方式的选项。它还显示有关工作簿的信息。


  阅读并完成本章的学习后，您应该能够：


  - 以不同格式保存工作簿


  - 添加和编辑有关文件及其属性的信息


  - 使用各种选项以您希望的方式打印工作簿


  - 将工作簿作为电子邮件附件发送


  - 搜索满足您需求的模板


  - 通过浏览或使用`最近使用`列表打开工作簿


  - 指定`最近使用`列表中显示的工作簿数量


  - 将工作簿保留在`最近使用`列表中


  - 将最近打开的工作簿放置在`导航`窗格中


  - 设置 Excel 选项




  ## Backstage 概览


  图 6-1 展示了 Backstage。在导航窗格中点击某个分组项（例如 `Info`、`New`、`Open` 等），右侧区域会显示该分组的信息和选项。我们将介绍导航窗格中的大部分分组。


  以下列表展示了您可以在 Backstage 中执行的一些操作：


  *   以多种不同格式保存文件。

  *   更改打印机设置。

  *   保护工作簿。

  *   将工作簿保存到 OneDrive。

  *   授予他人对工作簿的权限。

  *   以各种格式通过电子邮件发送工作簿。

  *   在工作簿中添加和删除个人信息。

  *   检查工作簿对残障人士的辅助功能。

  *   检查与早期 Excel 版本的兼容性。

  *   更新 Excel。

  *   更改您的 Microsoft 帐户信息。

  *   指定“最近使用的文件”列表中显示的工作簿数量。

  *   将工作簿固定到 Backstage 窗格。

  *   恢复未保存的工作簿。


  表 6-1 列出了导航窗格中的一些分组并进行了说明。


  **表 6-1**


  **Backstage 导航分组及其说明**


  | 分组 | 说明 |

  | --- | --- |

  | **Info** | 显示当前打开的工作簿的信息。 |

  | **New** | 创建新的空白工作簿或根据模板创建工作簿。 |

  | **Open** | 打开现有的 Excel 工作簿。 |

  | **Save** | 保存对当前打开的工作簿的更新。不更改现有工作簿的名称。 |

  | **Save As** | 保存之前未保存过的工作簿。也可用于创建当前打开工作簿的第二份副本并为其指定不同的名称。 |

  | **Print** | 打印工作簿的选项。 |

  | **Share** | 提供与他人共享工作簿的选项。 |

  | **Close** | 关闭工作簿。 |

  | **Account** | 提供您的 Microsoft Office 帐户信息。 |

  | **Options** | 显示可用于更改 Excel 工作方式的选项。 |


  ## Info 分组——查看、添加和编辑工作簿信息


  当您单击 `File` 选项卡时，`Info` 分组默认显示在 Backstage 中。见图 6-1。


  `Info` 分组显示当前打开工作簿的信息并处理与其相关的信息。我们将首先查看“属性”窗格选项卡；然后查看中间窗格中用于保护和工作簿检查的选项。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig1_HTML.jpg](img/385660_2_En_6_Fig1_HTML.jpg)


  **图 6-1**


  从包含数据的工作簿访问时的 Backstage


  ### 属性窗格


  当您在 Windows 资源管理器中查看文件时，可以看到文件的名称、日期和大小，但这通常不够。可以在“属性”窗格中输入或查看文件的附加信息。在“属性”窗格底部，如果当前未显示所有属性，可以点击**显示所有属性**。如果当前显示了所有属性，可以点击**显示更少属性**。


  您可以在此窗口中直接输入或编辑属性。您可以输入标题、标记、类别、公司和经理等内容。


  在“属性”窗格中点击 **Properties** 旁边的向下箭头，会调出图 6-2 所示的**高级属性**按钮。点击**高级属性**按钮会显示图 6-3 所示的**属性**对话框。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig3_HTML.jpg](img/385660_2_En_6_Fig3_HTML.jpg)


  **图 6-3**


  工作簿属性对话框


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig2_HTML.jpg](img/385660_2_En_6_Fig2_HTML.jpg)


  **图 6-2**


  高级属性按钮


  您在**属性**对话框中输入的部分信息可以在“属性”窗格中查看。当您点击**浏览**按钮时，这些信息也会显示在 **Save As** 窗口的底部，如图 6-4
  所示。您在此处输入的信息可作为文档使用，并有助于您搜索工作簿。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig4_HTML.jpg](img/385660_2_En_6_Fig4_HTML.jpg)


  **图 6-4**


  在属性对话框中输入的部分信息会显示在您通过 Backstage 的导航窗格使用“另存为”保存文件时


  在 Windows 资源管理器中右键单击 Excel 文件，然后选择**属性**，会显示“属性”窗口。选择**详细信息**选项卡以查看您输入的信息。见图 6-5。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig5_HTML.jpg](img/385660_2_En_6_Fig5_HTML.jpg)


  **图 6-5**


  名为 `Oct_Week1_Income` 的工作簿的工作簿信息


  ### 保护工作簿选项


  在“信息”窗格中，点击**保护工作簿**按钮会弹出一个菜单，其中包含用于保护工作簿的不同方式的选项。见图 6-6。我们将介绍**标记为最终状态**、**用密码进行加密**和**保护工作簿结构**。这些并非保护工作簿的唯一选项。我们将在本章后面介绍保护工作簿的其他方法。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig6_HTML.jpg](img/385660_2_En_6_Fig6_HTML.jpg)


  **图 6-6**


  保护工作簿的选项


  #### 标记为最终状态


  选择**标记为最终状态**会将您的工作簿设为只读。您将无法对任何工作表进行任何更改，也无法创建任何新工作表。点击**标记为最终状态**按钮会弹出图 6-7 所示的消息框。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig7_HTML.jpg](img/385660_2_En_6_Fig7_HTML.jpg)


  **图 6-7**


  Excel 询问是否要将工作簿标记为最终状态


  点击**确定**按钮会弹出图 6-8 所示的消息窗口。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig8_HTML.jpg](img/385660_2_En_6_Fig8_HTML.jpg)


  **图 6-8**


  告知编辑已完成且这是最终版本的消息


  工作簿打开时，状态栏上会显示一个**标记为最终状态**图标，工作表上方会显示一条消息，表明作者已将工作簿标记为最终状态，以阻止编辑。见图 6-9。如果您或您将工作簿分享给的任何其他人认为需要进行更改，可以通过点击**仍然编辑**按钮来完成。点击此按钮允许您对工作簿中的任何工作表进行任何更改或添加。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig9_HTML.jpg](img/385660_2_En_6_Fig9_HTML.jpg)


  **图 6-9**


  已被标记为最终状态的工作簿


  #### 用密码进行加密


  选择此选项需要您输入密码并进行验证。它使用 128 位高级加密技术来提高文件的安全性。下次打开此文件时需要输入此密码。


  **注意**


  Microsoft 不提供恢复在 Microsoft Office 中创建的密码的方法。




  #### 保护工作簿结构


  此选项可防止用户添加或删除工作表；隐藏和取消隐藏工作表；以及移动、复制或重命名工作表。如果需要，您可以为该选项添加密码。参见图 6-10。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig10_HTML.jpg](img/385660_2_En_6_Fig10_HTML.jpg)


  图 6-10 – 选择结构保护以防止用户进行更改


  如果已为工作簿应用了密码保护，并且已应用了工作簿结构保护，则`保护工作簿`区域会通知您这一点。参见图 6-11。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig11_HTML.jpg](img/385660_2_En_6_Fig11_HTML.jpg)


  图 6-11 – 通知用户结构已锁定且需要密码才能打开工作簿的消息


  如果您已保护工作簿并单击功能区的`审阅`选项卡，您会注意到在`保护`组中，`保护工作簿`按钮处于高亮状态。如果您想取消保护，需要单击此按钮。如果您在保护时输入了密码，则需要输入相同的密码才能取消保护。密码区分大小写。


  ### 检查问题


  `检查问题`按钮的右侧是`检查工作簿`区域。`检查工作簿`会显示尚未解决的项目。参见图 6-12。这些问题不会影响工作簿的运行。


