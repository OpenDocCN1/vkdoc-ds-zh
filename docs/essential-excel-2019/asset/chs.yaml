  \n**图 14-4** 已导入数据加载到工作表表格中\n\n### 创建到外部数据的连接\n\n1.  选择 `打开文件时刷新数据`。单击 **确定** 按钮。\n\
  \n2.  单击单元格 `F7`。\n\n3.  单击功能区上的 **数据** 选项卡；在 **获取和转换数据** 组中，单击 **现有连接**。\n\n4.\
  \  单击窗口底部的省略号按钮 (`…`)，然后选择 **属性**。这将调出如图 14-6 所示的 **查询属性** 对话框。\n\n\n\n在此窗口中，您可以进行的一项更改是控制文件更新频率或更新时机。例如，您可以将`Refresh`（刷新）控件设置为每十分钟刷新一次。然后，您可以修改`Employee.txt`文件中的数据，等待十分钟，即可在工作表中看到更改后的结果显示。或者，您也可以将其设置为在重新打开工作簿时进行刷新。\n\
