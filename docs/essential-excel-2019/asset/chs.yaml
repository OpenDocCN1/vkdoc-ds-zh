  \n图 19-11 选择流程图：纸带图标\n\n`Macros`（宏）按钮位于功能区的**视图**选项卡上。这意味着当你想查看宏或需要指定相对引用时，必须点击**视图**选项卡。为了使这些功能在任何活动的功能区选项卡下都可用，我们将在下一个练习中将\
  \ `Macro`（宏）按钮添加到快速访问工具栏。\n\n### 练习 19-7：将宏按钮分配到快速访问工具栏\n\n我们将把 `Macros`（宏）按钮放在工具栏上，这样你就不必每次想运行或编辑宏时都去点击**视图**选项卡了。\n\
  \n1.  点击功能区上的**文件**选项卡。点击**选项**。\n2.  从左侧窗格中，选择**快速访问工具栏**。\n3.  在**从下列位置选择命令**下拉菜单中，选择**常用命令**。\n\
  4.  滚动到列表底部，找到 `View Macros`（查看宏）。选择 **View Macros**（查看宏）。点击**添加**按钮。\n5.  点击**确定**按钮。\n\
  6.  点击快速访问工具栏上的 `View Macros`（查看宏）按钮。点击**取消**按钮。\n\n### 将开发工具选项卡添加到功能区\n\n如果你正在编写\
  \ VBA 代码或为按钮指定宏，你需要在 Visual Basic 环境中进行，该环境只能通过功能区的**开发工具**选项卡访问。如果你的功能区上没有看到**开发工具**选项卡，则需要按照以下步骤添加它：\n\
