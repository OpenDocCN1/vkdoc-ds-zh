  \n## 饼图\n\n饼图用于显示百分比。整个圆代表 100%。数据系列中的每个项由饼图的一个扇区表示。每个扇区的大小显示了它占 100%的哪一部分。有时您可能会发现某个扇区中的信息需要进一步拆分为百分比。在这种情况下，您可以使用“复合饼图”子类型。在本节中，我们将首先介绍标准饼图，然后介绍复合饼图子类型。\n\
  \n### 标准饼图\n\n在图 13-31 中，我们有十个水果。整个饼图代表我们水果的 100%。有五个香蕉，因此它们代表 5/10 即 50%的水果。因此，香蕉占饼图的一半。苹果的扇区占饼图大小的\
  \ 30%。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig31_HTML.jpg](img/385660_2_En_13_Fig31_HTML.jpg)\n\
  \n图 13-31\n\n带标签的饼图\n\n练习 13-2：创建饼图\n\n在本练习中，您将根据 Dave’s Lunch Wagon 的数据创建一个饼图。饼图非常适合这些数据，因为只有一列标签数据和一列数值数据。\n\
  \n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig36_HTML.jpg](img/385660_2_En_13_Fig36_HTML.jpg)\n\
