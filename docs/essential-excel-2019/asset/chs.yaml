  \n6.  打开工作簿第 13 章。选择名为“Treemap”的工作表。\n\n我们公司向五个州的加油站销售零食。图 13-58 显示了我们上周的利润。\n\n\
  树状图可以让我们快速了解这五个州不同产品的利润分布情况。\n\n**注意：** 创建图表时无需选中标题。\n\n您可能希望同时查看数值和标签。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig69_HTML.jpg](img/385660_2_En_13_Fig69_HTML.jpg)\n\
