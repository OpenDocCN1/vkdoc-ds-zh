  ## 另存为与保存组——使用 `Save` 或 `Save As` 保存工作簿


  在 Excel 中工作时，你所创建和导入的所有内容（如数据、图表、图形等）都存储在计算机的随机存取存储器（`RAM`）中。`RAM` 只是临时存储空间。当你关闭计算机时，`RAM`
  中的所有内容都会被清除。因此，如果计算机发生意外或断电，自上回保存以来所做的所有增改内容都将丢失。在执行`保存`操作之前，增改内容不会保存到硬盘或其他类型的永久存储设备中。当你保存工作簿时，信息会从
  `RAM` 中取出，并作为一个文件存储到你的永久存储设备上。


  如果出现意外情况（例如断电），而你又很久没有保存工作，请不要惊慌，因为 Excel 可能已使用`自动恢复`功能将你的工作保存到了永久存储设备上，我们将在本章稍后部分介绍该功能。


  Backstage 视图中有两个专门用于保存工作簿的组：`保存`组和`另存为`组。实际上，`保存`组算不上一个组，因为它不包含任何选项。`另存为`组与你在本章前面已经见过的`打开`组几乎相同。如果单击`保存`组，且工作簿之前已保存过，那么
  Excel 会用你最近的更改来更新工作簿。如果你选择了`保存`，并且这是你首次保存工作簿，Excel 会打开`另存为`窗口（其操作方式与点击`另存为`完全一致）。


  在`另存为`窗口中，你必须先选择一个用于保存工作簿的文件夹。接下来，你需要为工作簿文件输入文件名。Excel 默认使用文件名 `Book1`。你应该将名称更改为与工作簿包含的数据类型相匹配的名称；例如，如果工作簿包含截至
  2020 年 6 月 30 日的库存数据，则将其命名为"Inventory_063020"之类的名称。在图 6-31 中，你可以看到当前文件夹是 `Documents`。如果你单击文件夹图标左侧的向上箭头，将会向上移动到
  `Documents` 之上的文件夹层级。图中右下角显示的文件夹是 `Documents` 文件夹内的子文件夹。如果你要保存到的目标文件夹没有显示出来，则需要单击`浏览`或点击`更多选项...`。点击其中任何一个选项都会弹出`另存为`对话框窗口，如图
  6-32 所示。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig32_HTML.jpg](img/385660_2_En_6_Fig32_HTML.jpg)


  图 6-32


  `另存为`对话框


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig31_HTML.jpg](img/385660_2_En_6_Fig31_HTML.jpg)


  图 6-31


  `另存为`——选择文件夹并输入文件名


  接下来，你需要为正在保存的文件选择`保存类型`。工作簿的默认文件类型是`Excel 工作簿`。这可能是你最常使用的格式。如果你想要使用其他格式，可以点击`保存类型`的下拉箭头。如图
  6-33 所示，工作簿可以保存为多种不同的格式。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig33_HTML.jpg](img/385660_2_En_6_Fig33_HTML.jpg)


  图 6-33


  你可以将文件保存为多种不同文件类型中的一种


  Excel 会根据你选择的文件类型自动为你的文件添加扩展名。


  如果你为文件名输入了 `Inventory_063020`，那么你的完整文件名将是 `Inventory_063020.xlsx`。Windows 资源管理器使用这些扩展名来确定在文件名旁边显示什么图标。


  文件名连同路径最多可以有 255 个字符。路径是指访问文件所需经过的驱动器和文件夹。例如：`C:\users\Annette\My Documents\Inventory_063020.xlsx`。文件名中可以使用空格，但最好使用下划线来分隔单词。文件名不能包含以下字符：`<
  >`（尖括号）、`|`（管道符号）、`\`（反斜杠）、`?`（问号）、`:`（冒号）、`*`（星号）和 `""`（引号）。


  除了将工作簿保存到本地计算机，另一种选择是使用 `OneDrive` 将工作簿存储到在线。`OneDrive` 是微软免费提供的在线存储空间。点击 `OneDrive`
  会弹出一个 `另存为` 窗口，就像你将文件保存到个人电脑或网络驱动器时一样。你可以像在硬盘上一样在 `OneDrive` 中创建文件夹。


  ### 文档恢复


  你应该经常保存工作簿，但如果你在尚未保存的情况下系统崩溃或突然断电，请不要惊慌。Excel 有一个名为`自动恢复`的功能，它会按你指定的时间间隔自动保存文件。时间间隔可以设置为
  1 到 120 分钟之间。默认时间间隔是 10 分钟。我个人喜欢将其设置为 5 分钟或更短，因为在这段时间内我可能会做很多不想丢失的更改。但是，缩短时间间隔可能会降低计算机速度，具体取决于文件大小和所做更改的数量。


  在 Backstage 视图的导航窗格中点击`选项`，会弹出`Excel 选项`窗口。见图 6-34。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig34_HTML.jpg](img/385660_2_En_6_Fig34_HTML.jpg)


  图 6-34


  `Excel 选项`窗口，左窗格中选中了`保存`


  在`Excel 选项`窗口的左窗格中点击`保存`，会显示用于保存工作簿和使用`自动恢复`的选项。在这里，你可以设置保存的时间间隔、`自动恢复`文件的存储路径、是否在关闭而未保存时保留最后自动保存的版本、是否要对当前工作簿禁用`自动恢复`等。


  以默认的 10 分钟间隔为例，如果你保存了 Excel 工作簿，29 分钟后断电，你只会丢失最后 9 分钟内所做的更改，因为 Excel 会在第 10 分钟和第
  20 分钟备份你的文件。当你之后重新打开该文件时，Excel 会显示文档恢复窗格，其中包含文件的自动保存版本和原始版本。




  #### 从系统崩溃中恢复


  如果在处理工作簿时系统崩溃，当您再次打开 Excel 时，将在左侧窗格中看到“文档恢复”文件。将鼠标悬停在这些文件上时，会显示哪个是原始文件，哪个是恢复的版本。请参见图
  6-35。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig35_HTML.jpg](img/385660_2_En_6_Fig35_HTML.jpg)


  **图 6-35** 可以保存的已恢复文件


  点击图 6-36 中的任意一个已恢复文件，会显示一个下拉箭头。点击该下拉箭头会显示一个右键菜单，您可以选择`打开`、`另存为`、`删除`或`显示修复`。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig36_HTML.jpg](img/385660_2_En_6_Fig36_HTML.jpg)


  **图 6-36** 已恢复文件的选项


  选择`显示修复`会使用崩溃前所做的更改来恢复工作簿。如果文件包含任何错误，或文件已进行过任何修复，则会显示一条消息。


  您可以点击`另存为`为恢复的工作簿指定一个新名称。


  如果在“文档恢复”窗格底部仍有可恢复文件显示时点击`关闭`按钮，Excel 会询问您是希望稍后查看这些文件还是将其删除。请参见图 6-37。如果选择“是，我希望稍后查看这些文件”，Excel
  将保留这些文件，并在您下次启动 Excel 时将其显示在“文档恢复”窗格中。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig37_HTML.jpg](img/385660_2_En_6_Fig37_HTML.jpg)


  **图 6-37** 询问您希望稍后查看还是删除已恢复文件的消息


  #### 未保存即关闭工作簿


  ##### 关闭从未保存过的工作簿


  如果您在未保存的情况下关闭工作簿，但后来决定确实需要保存它，您仍然可以找回部分或全部更改，这取决于您设置的自动恢复时间间隔以及自上次保存以来经过的时间。


  如果您正在处理一个从未保存过的新工作簿，并在未保存的情况下将其关闭，您将看到如图 6-38 所示的消息。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig38_HTML.jpg](img/385660_2_En_6_Fig38_HTML.jpg)


  **图 6-38** 未保存文件即关闭


  现在重新启动 Excel。点击左侧窗格中的`打开`。在右侧窗格的底部，您会看到一个`恢复未保存的工作簿`按钮。


  点击`恢复未保存的工作簿`。打开的对话框中会显示所有未保存的文件。文件名会显示工作簿名称后跟一长串数字。请参见图 6-39。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig39_HTML.jpg](img/385660_2_En_6_Fig39_HTML.jpg)


  **图 6-39** 未保存文件的名称后附加了一长串数字


  双击该未保存文件会在 Excel 中打开它。您将看到如图 6-40 所示的消息。点击`另存为`并为工作簿指定一个新名称。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig40_HTML.jpg](img/385660_2_En_6_Fig40_HTML.jpg)


  **图 6-40** “已恢复未保存文件”消息


  您还可以通过点击功能区的`文件`选项卡，然后点击左侧窗格中的`信息`来检查是否有未保存的工作簿。点击`管理工作簿`按钮，查看是否有其他可恢复的未保存工作簿。请参见图
  6-41。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig41_HTML.jpg](img/385660_2_En_6_Fig41_HTML.jpg)


  **图 6-41** 点击“管理工作簿”按钮以查看是否存在未保存的工作簿


  ##### 关闭已保存但未保存更改的工作簿


  如果您的工 _ 作簿已经保存过至少一次，请使用本节中的信息。


  如果您在未保存更改的情况下关闭 Excel 工作簿，并且这些更改是在自动恢复时间间隔内进行的，Excel 将显示如图 6-42 所示的消息。如果您点击`不保存`，您将无法恢复，更改将丢失。例如，如果时间间隔为
  5 分钟，您在过去的 5 分钟内输入了一些数据并在未保存的情况下关闭了它，数据将丢失。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig42_HTML.jpg](img/385660_2_En_6_Fig42_HTML.jpg)


  **图 6-42** 警告：正在保存前关闭工作簿


  如果您对工作簿进行了更改但尚未保存，然后在您为自动恢复设置的时间间隔之后关闭工作簿，Excel 将显示如图 6-43 所示的消息。如果您看到此消息，您将能够恢复至少部分数据。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig43_HTML.jpg](img/385660_2_En_6_Fig43_HTML.jpg)


  **图 6-43** 消息：如果选择不保存文件，临时文件将仍然可用


  您应该点击`保存`按钮，但如果您点击`不保存`，您仍然可以恢复您所做更改的至少一部分。重新启动 Excel。“管理工作簿”按钮的右侧会出现一条消息。请参见图 6-44。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig44_HTML.jpg](img/385660_2_En_6_Fig44_HTML.jpg)


  **图 6-44** 打开未保存即关闭的工作簿时显示的消息


  点击该消息。工作簿将打开，工作表上方会出现如图 6-45 所示的消息。点击`恢复`按钮以恢复您的工作簿。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig45_HTML.jpg](img/385660_2_En_6_Fig45_HTML.jpg)


  **图 6-45** 通过点击“恢复”按钮恢复未保存的文件




  ### 保存带保护的工作簿：备份与限制更改


  你可以在文件级别设置密码，防止未经授权的用户打开工作簿。你也可以允许用户打开工作簿，但禁止其保存任何更改（除非另存为新文件）。在本节中，我们将学习如何为工作簿设置定期备份、使用“只读”保护原始文件，以及为工作簿添加密码保护。


  打开需要保护的工作簿后，单击功能区中的`文件`选项卡。在导航窗格中单击`另存为`。单击`浏览`。在`另存为`对话框中，单击`工具`下拉菜单并选择`常规选项`。见图
  6-46。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig46_HTML.jpg](img/385660_2_En_6_Fig46_HTML.jpg)


  **图 6-46** `另存为`对话框中的“工具”选项


  此时会打开`常规选项`对话框。勾选`生成备份`复选框。这将在保存文件的同一位置创建一个备份文件。该备份文件的名称格式为`Backup of`后面加上你为工作簿指定的名称，扩展名为`.xlk`。例如，如果你将文件命名为`Invoices.xlsx`，则备份文件将被命名为`Backup
  of Invoices.xlk`。见图 6-47。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig47_HTML.jpg](img/385660_2_En_6_Fig47_HTML.jpg)


  **图 6-47** 选中`生成备份`后的“常规选项”


  在你选中`生成备份`后首次保存文件时，只会保存原始文件，不会生成备份。假设你仅在单元格`A1`中输入了一个值，并将文件保存为`Invoices.xlsx`。接着，你在单元格`B1`中输入了一个值并再次保存工作簿。此时`Invoices.xlsx`文件包含单元格`A1`和`B1`中的值；同时会创建一个名为`Backup
  of Invoices.xlk`的备份，该备份仅包含单元格`A1`中的值。我们再试一次。


  你在`Invoices.xlsx`工作簿的单元格`C3`中添加一个值并再次保存文件。此时`Invoices.xlsx`文件包含单元格`A1`、`B1`和`C1`中的值，但备份文件`Backup
  of Invoices.xlk`仅包含单元格`A1`和`B1`中的值。备份文件始终比原始文件落后一个版本（即一个副本）。


  如果你希望允许用户查看工作簿但不能进行任何更改，请勾选`建议只读`复选框。


  你可以要求用户同时输入`打开权限密码`和`修改权限密码`，也可以只要求输入其中之一，或完全不设置密码。请记住，如果你忘记了密码，将无法找回。


  如果你希望要求用户在打开工作簿之前输入密码，请在`打开权限密码`文本框中输入密码。用户可以查看或更改工作簿。


  如果你希望要求用户在修改工作簿时输入密码，请在`修改权限密码`文本框中输入另一个密码。如果用户不输入该密码，则只能以只读方式查看工作簿。


  如果你希望要求用户输入密码才能打开工作簿，然后要求他们输入另一个密码才能修改工作簿，则应同时输入两个密码。这两个密码不应相同。


  如果你为`打开权限密码`输入了密码，则需要确认该密码。见图 6-48。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig48_HTML.jpg](img/385660_2_En_6_Fig48_HTML.jpg)


  **图 6-48** 若为`打开权限密码`输入了密码，需确认密码


  如果你为`修改权限密码`输入了密码，则需要确认该密码。见图 6-49。如果你同时输入了两个密码，则需要同时确认它们。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig49_HTML.jpg](img/385660_2_En_6_Fig49_HTML.jpg)


  **图 6-49** 若为`修改权限密码`输入了密码，需确认密码


  单击`保存`按钮即可使用你在`常规选项`中设置的选项保存工作簿。见图 6-50。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig50_HTML.jpg](img/385660_2_En_6_Fig50_HTML.jpg)


  **图 6-50** 使用你所做的选择保存文件


  如果你设置了密码，在关闭并重新打开工作簿后，系统将要求你输入密码。


  - 如果你设置了打开工作簿的密码，则在打开工作簿时会看到图 6-51 所示的窗口。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig51_HTML.jpg](img/385660_2_En_6_Fig51_HTML.jpg)


  **图 6-51** 打开工作簿需要密码


  - 如果你设置了修改工作簿的密码，则会弹出另一个“密码”窗口。用户必须输入密码才能修改工作簿。用户也可以通过单击`只读`按钮，在不输入密码的情况下以只读方式打开工作簿。见图
  6-52。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig52_HTML.jpg](img/385660_2_En_6_Fig52_HTML.jpg)


  **图 6-52** 输入密码以修改工作簿，或单击`只读`按钮


  如果用户单击`只读`按钮，他们可以对工作簿进行更改，但无法保存，从而防止任何更改被保留。用户将看到图 6-53 中的消息。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig53_HTML.jpg](img/385660_2_En_6_Fig53_HTML.jpg)


  **图 6-53** 提示文件为只读的消息。若要保存更改，需要将文件另存为新名称


  如果打开工作簿需要密码，并且用户选择使用“只读”而不输入修改密码，则 Backstage 视图将如图 6-54 所示。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig54_HTML.jpg](img/385660_2_En_6_Fig54_HTML.jpg)


  **图 6-54** Backstage 视图中的消息


  ## 打印组 — 打印工作簿


  打印组的左窗格（图 6-55）包含用于控制工作表或工作簿打印方式的“设置”。其中许多选项与功能区“页面布局”选项卡中的选项相同。打印组的右窗格根据左窗格中使用的打印选项，显示当前文档打印时的外观。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig55_HTML.jpg](img/385660_2_En_6_Fig55_HTML.jpg)


  **图 6-55** 打印选项


  你应首先对`打印机`和`设置`属性进行任何必要的更改，然后单击`打印`按钮执行打印。


  ### 选择打印机


  你需要做出的决定之一是将报告打印到哪里。你不一定非要打印到打印机。你可以打印到程序、其他设备（如传真机）或文件。单击`打印机`的下拉箭头会列出所有当前可用的选项。见图
  6-56。此处显示的内容取决于你安装的程序以及连接到计算机的设备。如果你想要使用的打印机不在列表中，但已连接到你的计算机或网络，请单击`添加打印机`选项。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig56_HTML.jpg](img/385660_2_En_6_Fig56_HTML.jpg)


  **图 6-56** 可发送打印数据的目标位置




  #### 打印机设置


  打印机属性选项完全取决于你为打印机选择了什么。如果你选择了一台实体打印机，你可能会看到横跨三个或更多选项卡的大量选项。打印机厂商不同，提供的选项也不同；你可能会看到预设、打印质量、纸张类型、方向、文档尺寸、双面打印、无边距、维护等选项。如果你选择传真，你只会看到少量选项。


  #### 选择打印活动工作表、整个工作簿或选定部分


  “设置”区域中的第一个选项用于选择是仅打印当前工作表、整个工作簿，还是仅打印你选定的区域。请参阅图 6-57。你在此处的选择会反映在右窗格中。`打印活动工作表`仅打印你当前选定的工作表。`打印选定区域`则打印你当前选定的单元格。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig57_HTML.jpg](img/385660_2_En_6_Fig57_HTML.jpg)


  图 6-57


  打印选项


  #### 选择要打印的页面


  下一个“设置”选项允许你选择要打印的页面。图 6-58 中的输入将仅打印第 2、3 和 4 页。即使你选择了`打印整个工作簿`，情况也是如此。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig58_HTML.jpg](img/385660_2_En_6_Fig58_HTML.jpg)


  图 6-58


  输入要打印的页面范围


  #### 逐份打印


  在 Excel 中，逐份打印的工作方式与复印机上的逐份打印相同。如果你要打印一个五页的工作表，并选择打印四份，那么选择`逐份打印`将为你提供四套第 1 页到第
  5 页。选择`不逐份打印`将打印四份第 1 页，然后四份第 2 页，然后四份第 3 页，依此类推。请参阅图 6-59。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig59_HTML.jpg](img/385660_2_En_6_Fig59_HTML.jpg)


  图 6-59


  逐份打印选项


  #### 方向


  你可以按纵向（垂直格式）或横向（水平格式）打印。选择横向是在一页上打印更多列的一种方法。


  #### 选择纸张尺寸


  你很可能会使用信纸尺寸（8.5" x 11"）的纸张，但如果不是这样，你也可以选择其他纸张尺寸。请参阅图 6-60。如果你的电子表格有很多列，你可以尝试使用法律纸尺寸。Excel
  将自动调整你的电子表格以反映所选的纸张尺寸。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig60_HTML.jpg](img/385660_2_En_6_Fig60_HTML.jpg)


  图 6-60


  选择输出尺寸


  #### 设置页边距


  你可以使用 Excel 预设的“普通”、“宽”或“窄”页边距之一，也可以通过选择`自定义页边距`来自定义页边距。请参阅图 6-61。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig61_HTML.jpg](img/385660_2_En_6_Fig61_HTML.jpg)


  图 6-61


  选择页边距


  单击`自定义页边距`将打开“页面设置”窗口，并选中“页边距”选项卡。请参阅图 6-62。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig62_HTML.jpg](img/385660_2_En_6_Fig62_HTML.jpg)


  图 6-62


  输入页边距以及数据在页面上的居中方式


  “页边距”选项卡提供了设置页面顶部、左侧、右侧和底部页边距的选项，以及设置页眉和页脚页边距的选项。你可以使用复选框来指定数据在页面上的居中方式。当你选中 ![../images/385660_2_En_6_Chapter/385660_2_En_6_Figa_HTML.jpg](img/385660_2_En_6_Figa_HTML.jpg)
  `水平`、![../images/385660_2_En_6_Chapter/385660_2_En_6_Figb_HTML.jpg](img/385660_2_En_6_Figb_HTML.jpg)
  `垂直`或两者时，选项卡中间图像将反映你的选择，显示数据在报告中的显示方式。


  #### 选择缩放选项


  你可以按实际尺寸打印报告，也可以选择 Excel 的预设缩放选项之一来缩小报告中的文本和对象。请参阅图 6-63。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig63_HTML.jpg](img/385660_2_En_6_Fig63_HTML.jpg)


  图 6-63


  选择一个缩放选项


  打印报告时，你可能不希望因为多出的几列或几行而多打一页。这会使阅读数据变得非常困难。如前所述，如果列数太多无法在一页中容纳，你可以尝试切换到横向模式。缩小工作表中的文本和对象使其适合一页纸通常会更简单。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig64_HTML.jpg](img/385660_2_En_6_Fig64_HTML.jpg)


  图 6-64


  自定义缩放选项


  *   选择`将工作表调整为一页`将打印一个工作表中的所有内容，使其适合一页。

  *   选择`将所有列调整为一页`会缩小打印输出，使其宽度为一页，但报告可能在垂直方向上超过一页。

  *   选择`将所有行调整为一页`会缩小打印输出，使其高度为一页，但报告可能在水平方向上超过一页。

  *   如果这些选项都不能满足你的需求，你可以选择`自定义缩放选项`。选择`自定义缩放选项`将打开“页面设置”对话框，并选中“页面”选项卡。请参阅图 6-64。


  此处的缩放选项允许你设置报告相对于实际大小的百分比。你输入的值必须在 10 到 400（含）之间。


  你还可以指定希望报告的页宽和页高。


  **注意**


  `页面设置`选项位于 Backstage 视图“设置”区域的底部。单击`页面设置`将打开“页面设置”对话框。这与单击`自定义页边距`或`自定义缩放选项`时看到的“页面设置”窗口相同。“页面设置”窗口包含“打印”面板其他区域中可用的一些相同选项，以及一些附加选项。也可以从功能区上的“页面布局”选项卡访问“页面设置”窗口。


  ## 共享组——共享工作簿


  “共享”组使你能够与他人共享工作簿。你有多种选项，包括共享已保存到 OneDrive 的文件以及通过电子邮件发送文件。




  ### 使用 OneDrive 在线共享


  将工作簿保存到 OneDrive 后，点击 Backstage 左侧面板中的 `Share`。这将调出图 6-65 中的 `Share` 面板。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig65_HTML.jpg](img/385660_2_En_6_Fig65_HTML.jpg)


  图 6-65


  共享选项


  现在，您已将自己的工作簿保存到 OneDrive，您可以邀请其他人仅在 OneDrive 上查看您的工作簿，或者允许他们对其进行修改。右键单击图 6-65 右侧窗格中的
  `Share with People` 按钮。这将调出图 6-66 所示的 `Share` 窗口。输入您想要邀请使用您工作簿的人员的电子邮件地址。您可以选择 `Can
  Edit` 或 `Can View`。您可以添加一条消息。点击 `Share` 按钮发送电子邮件。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig66_HTML.jpg](img/385660_2_En_6_Fig66_HTML.jpg)


  图 6-66


  邀请他人共享您的工作簿


  您还可以通过提供您工作簿的链接来共享它。在 `Share` 窗口的底部，您将看到两个选项：`Send as attachment` 和 `Get a sharing
  link`。请参见图 6-67。点击 `Get a sharing link`。


  ![../images/385660_2_En_6_Chapter/385660_2_En_6_Fig67_HTML.jpg](img/385660_2_En_6_Fig67_HTML.jpg)


  图 6-67


  点击文本 `Get a sharing link`


