  \n\n\n## 创建数据透视图\n\n数据透视图可以直接从数据源创建，也可以从数据透视表创建。数据透视图与其他图表的区别在于，数据透视图带有与之关联的筛选按钮，用户可以使用这些按钮仅在图表上查看其想要的内容。\n\
  \n### 练习 15-4：创建数据透视图\n\n在本练习中，我们首先将从数据源创建一个数据透视图。然后，我们将从数据透视表创建一个。\n\n1.  打开 `Chapter15_PivotTables`\
  \ 工作簿。\n2.  选择名为 `PivotChart` 的工作表。\n\n#### 基于源数据创建数据透视图\n\n1.  单击加号按钮。这将恢复显示所有产品。\n\
  2.  按 `Delete` 键删除数据透视图。\n3.  单击数据透视表中的任意位置。单击功能区的 `Analyze` 选项卡。在 `Actions` 组中，单击\
  \ `Select` 按钮。\n4.  选择 **Entire PivotTable**。按 `Delete` 键。\n5.  单击 `State` 筛选按钮。选择\
  \ **Clear Filter from “State.”**\n6.  单击 `Category` 筛选按钮。选择 **Clear Filter from\
  \ “Category.”**\n7.  单击 `Product` 筛选按钮。选择 **Clear Filter from “Product.”**\n\n在右侧图表下方，有一个加号和减号按钮。加号按钮是\
  \ **Expand Entire Field** 按钮。减号按钮是 **Collapse Entire Field** 按钮。\n\n8.  单击减号按钮。这将折叠所有产品数据。参见图\
  \ 15-47。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig47_HTML.jpg](img/385660_2_En_15_Fig47_HTML.jpg)\n\
  \n图 15-47：产品数据已被删除\n\n9.  单击 `State` 筛选按钮。取消选中 Illinois 前面的复选框。单击 `OK` 按钮。现在，只显示\
  \ Indiana 和 Kentucky 的数据。\n10. 单击 `Category` 筛选按钮。取消选中 `Books_Mag` 前面的复选框。单击 `OK`\
