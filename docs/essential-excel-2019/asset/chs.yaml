  \ 工作表标签重命名为 `行高`。\n\n您已学会通过更改行高和列宽来调整单元格大小。接下来，您将学习如何纠正数据输入错误。\n\n## 纠正输入错误\n\n\
  在向工作表中输入数据时，有时会出错。如果出错，可以轻松清除或纠正已输入的内容。有几种方法可以清除或纠正单元格中的部分或全部数据。我们来了解如何删除或更改单元格中的特定字符，如何在接受数据输入之前清除数据（并将单元格恢复到之前的状态），以及如何清除已接受输入的单元格。\n\
  \n### 更改特定字符\n\n如果需要纠正单元格中的特定字符，您有几种选择，具体取决于这些字符是什么以及是否已接受数据输入。首先，删除要更改的字符，然后在必要时键入正确的字符。以下是删除单元格中特定字符的几种方法：\n\
  \n- 在仍在单元格中输入数据时，您可以按 `Backspace` 键删除最后输入的字符。\n\n- 如果需要纠正不是最后输入的字符，请单击该字符右侧，然后按\
  \ `Backspace` 键。\n\n- 如果已接受单元格中的数据，请双击该单元格进入 `编辑` 模式，然后单击要更改的字符右侧，或使用左右箭头键将光标移动到要删除的字符处。\n\
  \n您可以通过执行以下任一操作来纠正输入错误：\n\n- 按 `Backspace` 键移除最近输入的字符。\n\n- 按 `Esc` 键清除尚未接受的输入。\n\
  \n- 单击编辑栏上的 `取消` 按钮清除尚未接受的输入。\n\n- 右键单击已接受输入的单元格，选择 `清除内容`。\n\n如果只需要移除最近输入的字符，可以使用\
  \ `Backspace` 键。\n\n### 将单元格恢复为其原始值\n\n如果尚未接受数据输入，或者已接受但未执行任何其他操作，则可以将单元格恢复到其原始值。\n\
  \n当仍在单元格中键入数据时，可以清除已输入的内容，并将单元格恢复到之前的状态。如果它是一个空单元格，只需清除所有数据。另一方面，如果您更改了单元格中的值，请清除新输入内容并恢复单元格的原始值。使用以下任一技术，在新值被接受前将其恢复到以前的值：\n\
  \n- 按 `Esc` 键。\n\n- 单击编辑栏上的 `取消` 按钮 ![../images/385660_2_En_3_Chapter/385660_2_En_3_Figd_HTML.jpg](img/385660_2_En_3_Figd_HTML.jpg)。\n\
  \n如果在工作簿中已接受新数据输入但尚未执行任何其他操作，可以选择 `快速访问工具栏` 上的 `撤消` 按钮（见图 3-21），或按 `Ctrl + Z`，这样会将单元格恢复到之前的状态：空单元格或包含之前的值。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig21_HTML.jpg](img/385660_2_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21\n\n`撤消` 按钮\n\n\n\n### 清除已确认单元格中的内容\n\n你可以通过右键单击单元格，然后选择`清除内容`来清除单元格中的内容。也可以单击功能区的`开始`选项卡，然后在`编辑`组中选择`清除`\
  \ ➤ `清除内容`。\n\n### 练习 3-5：输入和编辑数据\n\n在此练习中，你将在一个新工作表中输入数据，然后对其进行编辑。如果你已关闭了上次练习中的第\
