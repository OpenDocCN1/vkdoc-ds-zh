- '# 引言


  这是一本实用的实践操作书籍。书中包含大量截图示例，为示例和练习提供广泛的视觉强化。本书面向那些希望以 Excel 技能给主管和他人留下深刻印象的人。它专为那些希望自己的演示脱颖而出，并希望创建能向目标受众清晰传达数据的令人印象深刻的电子表格和图表的用户而设计。它也适用于那些愿意付出额外努力解决问题的用户。这是一本可以放在办公桌上的参考书。当你需要在
  Excel 中解决问题或学习新功能时，可以直接转到解决该问题的章节。本书无需从头到尾通读。各章节是层层递进的；不过，你可以直接转到任何章节寻求帮助。读者应具备计算机和
  Excel 的基本知识。


  第 1 章涵盖基础知识，例如保存和打开工作簿、使用功能区（Ribbon）和快速访问工具栏（Quick Access Toolbar），以及如何使用 Excel
  的帮助功能。


  第 2 章涵盖选择单元格和在单元格之间移动的各种方法。它展示了如何使用工作表，例如添加和删除工作表、隐藏和取消隐藏工作表、复制工作表以及更改它们的顺序。


  第 3 章和第 4 章涵盖 Excel 改善和加速数据录入的技术、通过备注和批注记录数据，以及如何格式化和对齐不同类型的数据。


  第 5 章涵盖如何仅打印工作簿中所需的内容，以及查看数据的各种方法，包括如何创建自定义视图。


  第 6 章涵盖 Excel 所称的后台（Backstage）。后台包含有关工作簿的信息，以及控制工作簿幕后操作（包括处理文件、打印、共享和导出工作簿、帐户信息以及
  Excel 的工作方式）的选项。


  第 7 章和第 8 章涵盖 Excel 的内置函数以及使用不同类型单元格引用和名称管理器创建的公式。


  第 9 章涵盖数据的验证、审核和保护。


  第 10 章涵盖链接到网页、文件、电子邮件、当前工作簿中的不同位置，甚至可以创建并打开新工作簿的链接。本章还展示了如何自动化拼接文本以及如何使用状态栏上的功能。


  第 11 章涵盖同时将数据移动和复制到一个或多个工作表的多种方法。


  第 12 章涵盖表格，这些网格允许你格式化、排序和筛选数据，以及应用条件格式。本章还展示了如何使用切片器（Slicers）提供一种快速直观的方法来组织和筛选数据。


  第 13 章展示了如何创建、格式化和修改许多不同的图表类型。它还涵盖了在地图上显示地理数据以及创建迷你图（Sparklines，即包含在单元格内的图表）。


  第 14 章涵盖如何从不同位置获取所需数据到工作簿中，以及如何在数据源和工作簿之间创建连接。


  第 15 章展示了如何使用数据透视表（Pivot Tables）对数据进行分组、重新排列和汇总。它还涵盖了使用切片器（Slicer）和时间线（Time Interval）工具。你将学习如何创建关系数据库。


  第 16 章涵盖 Excel 2019 中新增的地理（Geography）和股票（Stock）数据类型。地理数据类型用于收集有关国家、省份、地区、州、县、市和城镇的数据。股票数据类型可让你获取最新的股票市场数据，你可以在图表中显示这些数据或在公式中使用它们。


  第 17 章介绍如何向工作簿中添加图片、图标、形状、艺术字（WordArt）、SmartArt 图形、音频和视频。


  第 18 章涵盖将图像拆分为可单独处理的部分、使用 3D 对象、更改对象的顺序和可见性，以及对对象进行组合和取消组合。


  第 19 章涵盖通过使用宏（Macros，通过记录执行任务时的步骤或编写代码创建的可重复步骤）来自动化 Excel 任务。


