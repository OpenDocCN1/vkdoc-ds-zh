  \n**在公式中使用命名区域**\n\n1.  在单元格 `D3` 中，输入 `=R`。Excel 会弹出一个列表，其中包含所有以 `R` 开头的内置函数以及所有以\
  \ `R` 开头的命名区域。参见图 7-59。\n\n\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig59_HTML.jpg](img/385660_2_En_7_Fig59_HTML.jpg)\n\
