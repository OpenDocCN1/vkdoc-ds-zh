  \n**图 15-69** 您的数据透视表应如下所示\n\n## 总结\n\n数据透视表在显示哪些数据、如何排列数据以及汇总哪些值方面为您提供了极大的灵活性。之所以称为数据透视表，是因为您可以透视数据，在行和列之间切换。\n\
  \n数据透视图相对于其他图表的一个优势在于它可被筛选。\n\n可以直接在 Excel 中创建小型关系数据库。\n\n下一章将介绍在工作簿中使用多媒体。多媒体是使用不同形式的交流方式。您将使用不同形式的文本、图表、图片、屏幕截图、音频和视频在工作簿中进行交流。\n\
  \n\n\n## 地理与股票数据类型\n\nExcel 新增了两种数据类型，`Geography`（地理）和 `Stocks`（股票）。它们的工作方式类似。这两种数据类型位于功能区“数据”选项卡的“`Data\
  \ Type`（数据类型）”组中，参见图 16-1。微软计划在未来增加更多的数据类型。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig1_HTML.jpg](img/385660_2_En_16_Fig1_HTML.jpg)\n\
  \n图 16-1：股票和地理数据类型\n\n### 地理数据类型\n\n我们先来看看 `Geography`（地理）。使用 `Geography` 数据类型，您可以收集有关国家、省份、地区、州、县、城市和城镇的数据。这些信息来源于维基百科和其他在线来源。您可以提取的数据取决于您所选的地理位置类型。您可以收集单个地理位置的信息，也可以同时收集大量地理位置列表的信息。\n\
  \n图 16-2 在单元格 A1 中显示了印第安纳州一个名为赫布伦的小镇名称。当我们选中该单元格并点击 `Geography` 按钮时，名称左侧会出现一个问号。Excel\
  \ 显示这个问号是因为有许多名为赫布伦的城镇，它不知道您想使用哪一个。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig2_HTML.jpg](img/385660_2_En_16_Fig2_HTML.jpg)\n\
  \n图 16-2：问号表示确切位置未知\n\nExcel 在单元格中放置问号的同时，会在工作表右侧显示一个`Data Selector`（数据选择器），参见图\
  \ 16-3。`Data Selector`在名称左侧显示单元格地址，方便您识别 Excel 正在询问的是哪个单元格。您可以点击这些城镇中的任何一个来了解更多信息。名为赫布伦的城镇比此处显示的更多。要查看更多名为赫布伦的城镇，您可以点击放大镜图标，或点击窗口底部的“显示更多结果”。这些结果的显示顺序可能因时而异。\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig3_HTML.jpg](img/385660_2_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3：数据选择器\n\n如果您点击某个城镇下方的“选择”，Excel 就会将该城镇确定为要收集信息的对象。我将选择印第安纳州波特县的赫布伦。如果您在未选择位置的情况下关闭了`Data\
  \ Selector`，您可以随时点击单元格中的问号重新打开它。\n\n当您做出选择后，Excel 会在单元格中放置地理数据类型图标![../images/385660_2_En_16_Chapter/385660_2_En_16_Figa_HTML.jpg](img/385660_2_En_16_Figa_HTML.jpg)。当单元格处于活动状态时，数据右侧会显示一个图标。将光标移到该图标上，您会看到工具提示“插入数据\
  \ 将数据提取到单元格”，参见图 16-4。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig4_HTML.jpg](img/385660_2_En_16_Fig4_HTML.jpg)\n\
  \n图 16-4：数据类型工具提示\n\n点击该图标将显示与您输入的位置类型相关的可用选项，参见图 16-5。第一个选项是`Admin Division 1`（一级行政区）。您可能会对列表顶部的\
  \ `Field`（字段）一词感到困惑。这是微软将其作为标题置于列表顶部，并非一个选项。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig5_HTML.jpg](img/385660_2_En_16_Fig5_HTML.jpg)\n\
  \n图 16-5：地理位置选项\n\n选择“population”（人口）会将城镇的人口数量放入右侧单元格中。选择 `Admin Division 2`（二级行政区）会将县名放入右侧第一个空白单元格中，参见图\
  \ 16-6。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig6_HTML.jpg](img/385660_2_En_16_Fig6_HTML.jpg)\n\
  \n图 16-6：已应用人口和二级行政区选项\n\n`Geography` 数据类型图标显示的信息比单元格右侧出现的`Insert Data`（插入数据）图标更多。将光标移到\
  \ `Geography` 数据类型图标上会显示一个工具提示，提示内容为“显示卡片”。点击该图标会显示可滚动的`Card`（卡片），其中包含该位置的一张或多张图片及其相关信息。与`Insert\
  \ Data`图标不同，`Card`会显示它正在检索的实际数据。例如，`Card`不仅仅显示 `Admin Division 1`，而是显示实际结果——Indiana（印第安纳州）。如果您滚动到`Card`的底部，您还会看到该位置的描述。`Card`还包含指向维基百科上该位置的可点击链接以及更多图片，参见图\
  \ 16-7。当您将光标移到 `Card` 的字段上时，该字段的右侧会显示一个图标。点击该图标会将信息放入右侧第一个空白单元格中。例如，在图 16-7 中，点击`Admin\
  \ Division`右侧的图标，我会将 Indiana 这个词放入赫布伦右侧的第一个空白单元格中。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig7_HTML.jpg](img/385660_2_En_16_Fig7_HTML.jpg)\n\
  \n图 16-7：卡片包含位置数据和链接\n\n您可以通过输入城市名称，后跟逗号，再后跟州、省或地区来区分城市的位置。例如，在单元格中键入`Hebron, Indiana`可以明确您所指的城市。当您点击\
  \ `Geography` 按钮时，不会出现问号，因为 Excel 将确切知道您指的是哪个赫布伦。Excel 会删除逗号和 Indiana 字样，仅保留单元格中的`Hebron`。\n\
  \n在单元格中输入此内容 ![../images/385660_2_En_16_Chapter/385660_2_En_16_Figb_HTML.gif](img/385660_2_En_16_Figb_HTML.gif)\
  \ 并点击 `Geography` 按钮会得到此结果 ![../images/385660_2_En_16_Chapter/385660_2_En_16_Figc_HTML.gif](img/385660_2_En_16_Figc_HTML.gif)。\n\
  \n如果您选择了如图 16-8 所示的一系列印第安纳州城市和城镇，然后点击 `Geography` 按钮，Excel 将自动假定您想要的城市和城镇是印第安纳州境内的，并会在单元格中输入地理数据类型图标，而不是问号，参见图\
  \ 16-9。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig9_HTML.jpg](img/385660_2_En_16_Fig9_HTML.jpg)\n\
  \n图 16-9：Excel 假定这些是印第安纳州的城市/城镇\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig8_HTML.jpg](img/385660_2_En_16_Fig8_HTML.jpg)\n\
  \n图 16-8：印第安纳州城市/城镇列表\n\n\n\n#### 在表格中使用地理数据类型\n\n让我们将图 16-10 中的各州放入一个表格中：选中这些单元格，点击快速分析按钮，然后选择“表格”。\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig10_HTML.jpg](img/385660_2_En_16_Fig10_HTML.jpg)\n\
  \n**图 16-10** 要转换为表格的数据\n\n使用表格的优点包括：\n\n-   可以一次性添加一列新数据。\n-   列标题会自动创建。\n-   由于数据在表格中，你可以轻松筛选数据，只看你想看的内容，例如只想查看收入中位数大于\
  \ 50,000 的州。\n-   当你添加其他位置时，它们会自动成为表格的一部分。\n\n要将表格中的州转换为地理数据类型，首先选中包含州的单元格，然后在功能区“数据”选项卡的“数据类型”组中点击“地理”按钮。随后，每个单元格的州名左侧都会出现地理数据类型图标。只要光标位于某个表格单元格内，表格的右上方就会出现一个图标。该图标的工具提示显示为`添加列`。（当你点击一个不属于表格的数据类型单元格时，该图标的工具提示显示为`插入数据`。）点击`添加列`按钮会显示该位置的可用选项。请注意，在图\
  \ 16-11 中，州的可用选项与市/镇的可用选项不同。每种地理位置类型都有其专属的选项。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig11_HTML.jpg](img/385660_2_En_16_Fig11_HTML.jpg)\n\
  \n**图 16-11** 州位置的可用选项\n\n我将选择`人口`。`人口`标题以及每个州的人口数据会出现在右侧的列中。见图 16-12。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig12_HTML.jpg](img/385660_2_En_16_Fig12_HTML.jpg)\n\
  \n**图 16-12** 每个州的人口\n\n点击肯塔基州的地理数据类型图标，然后从信息卡中选择`首府`。见图 16-13。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig13_HTML.jpg](img/385660_2_En_16_Fig13_HTML.jpg)\n\
  \n**图 16-13** 肯塔基州的信息卡\n\n尽管我只从肯塔基州的信息卡中选择了`首府`，但 Excel 却输出了每个州的首府。见图 16-14。\n\n\
  ![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig14_HTML.jpg](img/385660_2_En_16_Fig14_HTML.jpg)\n\
  \n**图 16-14** 每个州的首府\n\n如果添加另一个州，它会自动采用地理数据类型。当在第 7 行输入田纳西州时，它会被自动分配地理数据类型，并且任何列的数据都会被自动填充。见图\
  \ 16-15。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig15_HTML.jpg](img/385660_2_En_16_Fig15_HTML.jpg)\n\
  \n**图 16-15** 田纳西州的数据被自动添加\n\n如果将单元格`A7`中的文本从田纳西州改为密苏里州，所有数据列都会自动更改，以反映密苏里州的数据。\n\
  \n假设你想获取一些城市、州和国家的面积和人口数据，如图 16-16 所示。由于你同时使用了城市、州和国家，当你点击`添加列`按钮时，所有这三种类型的字段选项都会显示出来。城市、州和国家都有面积和人口字段，这使得这可能成为现实。\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig16_HTML.jpg](img/385660_2_En_16_Fig16_HTML.jpg)\n\
  \n**图 16-16** 城市、州和国家的面积与人口\n\n现在你想了解一些额外的数据，比如`最大城市`和农业用地百分比。当添加这些字段时，某些单元格会出现`#FIELD!`错误。见图\
  \ 16-17。城市不提供`最大城市`字段，而城市和州不提供`农业用地百分比`字段。如果你使用的地理位置中某个特定字段没有可用数据，也会发生这种情况。这不一定意味着存在错误，只是没有可用的数据而已。\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig17_HTML.jpg](img/385660_2_En_16_Fig17_HTML.jpg)\n\
  \n**图 16-17** `#FIELD!` 意味着没有可用数据\n\n当我点击伦敦左侧的地理数据类型图标时，信息卡会显示出来，我可以看到 Excel 假定我想要的是英国伦敦。如果这不是我想要的伦敦呢？右键单击该单元格，然后选择`数据类型`，再点击`更改`。见图\
  \ 16-18。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig18_HTML.jpg](img/385660_2_En_16_Fig18_HTML.jpg)\n\
  \n**图 16-18** 更改位置\n\n选择`更改`会调出数据选择器，然后就可以选择另一个伦敦了。\n\n\n\n#### 在公式中使用地理位置数据\n\n\
  假设我们有以下三列数据，想要知道每个地理位置每平方公里居住的人口数量。在单元格 `D2` 中，我输入了一个等号，然后点击了单元格 `C2`。Excel 会自动填入\
  \ `[@Population]` 来代表该列。接着，我输入了除号，并点击了单元格 `B2`。请参见图 16-19。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig19_HTML.jpg](img/385660_2_En_16_Fig19_HTML.jpg)\n\
  \n图 16-19\n\n使用数据类型数据创建公式\n\n现在，当我按下 `Enter` 键时，Excel 会为所有位置填充数据。我输入了这一列的标题。请参见图\
  \ 16-20。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig20_HTML.jpg](img/385660_2_En_16_Fig20_HTML.jpg)\n\
  \n图 16-20\n\n在公式中使用数据类型数据的结果\n\n### 练习 16-1：使用地理数据类型\n\n#### 使用单个数据类型位置\n\n1.  在功能区上的\
  \ `数据` 选项卡中，位于 `数据类型` 组内，点击 `地理`。由于两个都是州名，数据选择器不会显示；Excel 假定您指的是州。\n2.  在单元格 `A4`\
  \ 中输入 `肯塔基`。\n3.  点击单元格 `A2` 中的 `地理数据类型` 图标。印第安纳州的州旗会显示在卡片的顶部。点击 `维基百科` 字样。您将被带到印第安纳州的维基百科网站。关闭浏览器。再次点击单元格\
  \ `A2` 中的地理图标。点击 `更多图片` 图标 ![../images/385660_2_En_16_Chapter/385660_2_En_16_Fige_HTML.jpg](img/385660_2_En_16_Fige_HTML.jpg)。浏览器会打开，显示印第安纳州的图片。关闭浏览器。\n\
  4.  点击三个州中任意一个州的 `地理数据类型` 图标。选择哪一个州并不重要。点击 `人口`。然后点击右侧的 `提取` 图标。三个州的人口数据连同标题会被添加进来。调整列宽，以便您能看到所有数据。\n\
  5.  点击表格中的任一单元格。点击 `人口` 标题右侧的 `添加列` 图标。点击 `家庭收入中位数`。\n6.  点击 `添加列` 图标。点击 `租金中位数`。\n\
  7.  点击 `添加列` 图标。点击 `人口：65 岁以上 (%)`。\n8.  选中单元格 `D2`。右键单击选中的单元格，然后选择 `清除内容`。\n\n\
  #### 在表格中使用数据类型位置\n\n在单元格 `A1` 中输入 `州`。在单元格 `A2` 中输入 `印第安纳州`。在单元格 `A3` 中输入 `伊利诺伊州`，然后按下\
  \ `Ctrl + Enter`。光标仍停留在单元格 `A3` 中时，点击功能区的 `开始` 选项卡。在 `样式` 组中，点击 `套用表格格式` 命令。在 `中等深浅`\
  \ 组的第一行，点击第二个表格样式。确保勾选 `表包含标题` 复选框，然后点击 `确定` 按钮。请参见图 16-23。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig23_HTML.jpg](img/385660_2_En_16_Fig23_HTML.jpg)\n\
  \n图 16-23\n\n带标题的“套用表格格式”\n\n1.  点击印第安纳县内的印第安纳镇（注意不是它下方的 `选择`）。您会看到与该镇相关的数据。向下滚动到底部。您应该会看到对该镇的描述。这可以帮助您确认正在查看的内容。点击返回箭头返回\
  \ ![../images/385660_2_En_16_Chapter/385660_2_En_16_Figd_HTML.gif](img/385660_2_En_16_Figd_HTML.gif)。现在，点击印第安纳县内印第安纳镇下方的\
  \ `选择`。`地理数据类型` 图标会出现在单元格中。点击该图标。向下滚动直到看到 `人口`。将光标移至 `人口` 上。点击右侧的图标。人口数据会显示在单元格\
  \ `E2` 中。\n2.  假设您原本并不想获取镇的数据，而是想要获取县的数据。右键单击单元格 `D2`，选择 `数据类型`，然后点击 `更改`。现在，点击该县下方的\
  \ `选择`。注意观察，人口数字发生了变化，显示的是该县的人口数据。\n3.  选中单元格 `D2` 和 `E2`。右键单击选中的单元格，然后选择 `清除内容`。\n\
  \n\n\n在单元格`D3`中输入`Indiana`。在功能区“数据”选项卡的“数据类型”组中，点击“地理”。在数据选择器中，输入`Indiana State`。通过添加`State`一词，消除了歧义，数据选择器将仅显示一个结果。参见图\
  \ 16-22。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig22_HTML.jpg](img/385660_2_En_16_Fig22_HTML.jpg)\n\
  \n图 16-22：筛选数据选择器结果\n\n只有一个`Indiana State`，也只有一个`Indiana County`，因此如果您输入`Indiana\
  \ County`，它也只会显示一个结果。\n\n1. 创建一个新工作簿。在单元格`D2`中输入`Indiana`，然后按`Ctrl + Enter`。在功能区“数据”选项卡的“数据类型”组中，点击“地理”。点击单元格`D2`中的“地理数据类型”图标。数据选择器将出现在电子表格右侧。在宾夕法尼亚州，有一个名为`Indiana`的城镇、县和镇区。参见图\
  \ 16-21。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig21_HTML.jpg](img/385660_2_En_16_Fig21_HTML.jpg)\n\
  \n图 16-21：`Indiana`的数据选择器\n\n**添加和更改数据类型**\n\n1. 在单元格`A5`中输入`Michigan`。在单元格`A6`中输入`Ohio`。您为其他州选择的状态数据会自动填充到`Michigan`和`Ohio`中。\n\
  2. 将单元格`A5`中的`Michigan`更改为`Iowa`。数据会自动更新以反映状态更改。\n3. 在单元格`F1`中输入`65 and Over`。选择单元格区域`C1:F1`。在功能区“开始”选项卡的“对齐”组中，点击“自动换行”。加宽各列，以确保您能看到所有数据。\n\
  \n**在公式中使用数据类型数据**\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig27_HTML.jpg](img/385660_2_En_16_Fig27_HTML.jpg)\n\
  \n图 16-27：计算租金占收入百分比的结果公式\n\n1. 按`Ctrl + Enter`。\n2. 在功能区“开始”选项卡的“数字”组中，点击`%`。将自动填充柄向下拖动到`B15`。参见图\
  \ 16-27。\n1. 双击`Median gross rent`以选中它。\n2. 输入`* 12`（这是月租金，因此需要将其乘以 12 以获得年租金）。\n\
  3. 输入除号。\n4. 输入`A2`以调出字段选项。\n5. 双击`Median household income`。完整的公式如图 16-26 所示。\n\n\
  ![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig26_HTML.jpg](img/385660_2_En_16_Fig26_HTML.jpg)\n\
  \n图 16-26：计算租金占收入百分比的公式\n\n1. 在单元格`A14`中输入`Indiana`，在单元格`A15`中输入`Illinois`。在单元格`B13`中输入`%\
  \ of Income Spent on Rent`。对单元格`B13`应用“自动换行”。\n2. 在单元格`B14`中输入一个`=`号。您可以点击单元格`A2`或其输入其单元格地址。当您这样做时，您将获得该州的所有字段选项。参见图\
  \ 16-25。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig25_HTML.jpg](img/385660_2_En_16_Fig25_HTML.jpg)\n\
  \n图 16-25：在公式中使用可用的数据类型字段\n\n1. 您已经有了 65 岁以上人口的百分比，但没有 65 岁以上人口的具体数量。您可以自行计算。在单元格`F2`中，输入`=`号以开始公式。点击单元格`B2`。输入`*`号进行乘法运算。点击单元格`E2`。按`Enter`键。\n\
  2. 选择单元格区域`F2:F6`。在功能区“开始”选项卡的“数字”组中，点击逗号样式。参见图 16-24。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig24_HTML.jpg](img/385660_2_En_16_Fig24_HTML.jpg)\n\
  \n图 16-24：使用逗号格式计算的“65 岁及以上”字段\n\n假设您想了解在`Indiana`和`Illinois`州，家庭收入中用于租金的中位数百分比。您无需创建新的“地理”数据类型，因为您可以使用已创建的数据类型。\n\
  \n**格式化数据类型数据**\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig28_HTML.jpg](img/385660_2_En_16_Fig28_HTML.jpg)\n\
  \n图 16-28：为“人口”创建数据条\n\n1. 选择单元格区域`B1:B6`。点击快速分析图标。\n2. 点击“数据条”。参见图 16-28。\n\n**在地图中使用数据类型数据**\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig29_HTML.jpg](img/385660_2_En_16_Fig29_HTML.jpg)\n\
  \n图 16-29：各州人口地图\n\n1. 选择单元格区域`A1:B6`。\n2. 在功能区“插入”选项卡的“图表”组中，点击“地图”。\n3. 点击“填充地图”。\n\
  4. 点击“图表标题”。输入`Population`。\n5. 图表有两个上下文菜单：“设计”和“格式”，位于“图表工具”下。点击“设计”选项卡。在“图表样式”组中，点击“更改颜色”。选择您想要的颜色。进行任何其他您想要的更改。参见图\
  \ 16-29。\n\nExcel 的“地理”数据类型可用于通过选择包含国家、省份、地区、州、县、城市和城镇相关数据的字段，将数据输入到单元格中。既然您已熟悉“地理”数据类型，您可以将同样的技能应用于“股票”数据类型。\n\
  \n\n\n### 股票\n\nExcel 的股票数据类型与地理数据类型的工作方式相同。为了从股票数据类型中获取信息，您需要输入股票的代码、公司名称或基金名称。\n\
  \n股票的选项与基金的选项有所不同。我们先来看看输入公司名称的结果。如果您在单元格中输入 `Adobe`，公司名称左侧会出现一个问号，并且电子表格右侧会出现`数据选择器`，因为有许多不同的\
  \ `Adobe` 选项。第一个 `Adobe` 选项显示，该股票在纳斯达克证券交易所上市，其股票代码为 `ADBE`。请参见图 16‑30。与地理数据类型一样，您可以点击信息以查看数据卡，或点击`选择`来接受。\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig30_HTML.jpg](img/385660_2_En_16_Fig30_HTML.jpg)\n\
  \n图 16‑30 使用 Adobe 进行数据选择\n\n当您点击`选择`时，公司名称左侧会出现股票数据类型图标，而公司名称右侧会显示交易所的缩写和股票代码。请参见图\
  \ 16‑31。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig31_HTML.jpg](img/385660_2_En_16_Fig31_HTML.jpg)\n\
  \n图 16‑31 添加到单元格中的股票数据类型图标和股票代码\n\n如果您知道股票代码，则应该输入它而不是公司名称。这可能会缩小`数据选择器`中显示的选项数量。它甚至可能将数量限制为一个，在这种情况下，Excel\
  \ 将确切知道您指的是哪只股票或基金；因此，它不会在单元格中输入问号，也不会显示`数据选择器`。有三个股票代码为 `ADBE` 的股票，因为它们位于三个不同的证券交易所：一个在纳斯达克交易所，一个在瑞士交易所，另一个在奥地利维也纳的维也纳证券交易所。请参见图\
  \ 16‑32。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig32_HTML.jpg](img/385660_2_En_16_Fig32_HTML.jpg)\n\
  \n图 16‑32 三只具有相同股票代码的股票\n\nAdobe 的数据卡会显示其公司徽标，但其他公司的数据卡可能不会。大多数公司数据卡会显示“维基百科”字样，并且在其公司徽标上带有一个图像图标。请参见图\
  \ 16‑33。点击“维基百科”字样会显示该公司在维基百科中的信息。点击图像图标则会显示该公司的图像。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig33_HTML.jpg](img/385660_2_En_16_Fig33_HTML.jpg)\n\
  \n图 16‑33 指向公司信息和图像的链接\n\n如果您将共同基金设为股票数据类型，您看到的字段将与股票的字段不同。共同基金有评级选项以及过去一周、一个月、三个月、一年、三年、五年和年初至今的回报率选项。请参见图\
  \ 16‑34。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig34_HTML.jpg](img/385660_2_En_16_Fig34_HTML.jpg)\n\
  \n图 16‑34 共同基金字段\n\n我们先从一个表格中的一些公司名称开始。请参见图 16‑35。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig35_HTML.jpg](img/385660_2_En_16_Fig35_HTML.jpg)\n\
  \n图 16‑35 表格中的公司名称\n\n我首先要选中这些公司名称，然后在功能区“数据”选项卡的“数据类型”组中点击`股票`。这样做会将缩写的公司名称更改为其全称，并添加股票代码。请参见图\
  \ 16‑36。Excel 无法确定 Ford 应使用什么，因此在其名称左侧放置了一个问号。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig36_HTML.jpg](img/385660_2_En_16_Fig36_HTML.jpg)\n\
  \n图 16‑36 带有股票代码的全称\n\n点击问号会显示`数据选择器`。我将从纽约证券交易所 `F` 中选择 Ford。现在，我们可以通过点击`添加列`按钮开始选择我们的数据类型字段选项。请参见图\
  \ 16‑37。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig37_HTML.jpg](img/385660_2_En_16_Fig37_HTML.jpg)\n\
  \n图 16‑37 点击`添加列`按钮添加字段\n\n图 16‑38 显示了对价格、前收盘价、52 周最高价、52 周最低价、涨跌额和涨跌幅所做的字段选择。“涨跌额”和“涨跌幅”列中的某些值位于括号内。括号内的值是负值。\n\
  \n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig38_HTML.jpg](img/385660_2_En_16_Fig38_HTML.jpg)\n\
  \n图 16‑38 点击`添加列`按钮后所做的字段选择\n\n现在，我们可以进行一些计算，以计算每只股票的当前价值、我们股票的总现值、每只股票的盈亏额以及当日总盈亏。我们可以将这些计算放在表格的末尾，但让我们将它们放在从单元格\
  \ A11 开始的单独区域中。在前两列中，我们有公司名称以及我们在这些公司中拥有的股票数量。请参见图 16‑39。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig39_HTML.jpg](img/385660_2_En_16_Fig39_HTML.jpg)\n\
  \n图 16‑39 进行股票计算的相关设置\n\n我们的第一个计算将是确定每只股票在前收盘价时的价值。我们将以等号开始单元格 C12 中的公式，然后点击单元格\
  \ C2。我们将添加乘号，然后点击单元格 B12。请参见图 16‑40。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig40_HTML.jpg](img/385660_2_En_16_Fig40_HTML.jpg)\n\
  \n图 16‑40 用于计算前收盘价时股票价值的公式\n\n我们将向下拖动自动填充柄，以计算其他公司的前收盘价。请参见图 16‑41。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig41_HTML.jpg](img/385660_2_En_16_Fig41_HTML.jpg)\n\
  \n图 16‑41 向下拖动自动填充柄将公式复制到其他股票\n\n当前价值是价格乘以股票数量，因此我们将在单元格 D12 中输入公式 `=B2*B12`。然后我们将自动填充柄向下拖动到单元格\
  \ D16。\n\n盈亏额是涨跌额乘以股票数量，因此我们将在单元格 E12 中输入公式 `=F2*B12`。然后我们将自动填充柄向下拖动到单元格 E16。结果显示在图\
  \ 16‑42 中。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig42_HTML.jpg](img/385660_2_En_16_Fig42_HTML.jpg)\n\
  \n图 16‑42 前收盘价、当前价值和盈亏额的结果\n\n现在可以通过选择区域 `B17:E17`，然后在“开始”选项卡上点击`自动求和`来添加总计。对总计应用格式后，结果如图\
  \ 16‑43 所示。我们可以看到当日收益为 992 美元。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig43_HTML.jpg](img/385660_2_En_16_Fig43_HTML.jpg)\n\
  \n图 16‑43\n\n\n\n`AutoSum`用于计算第 17 行中的合计\n\n股票期权表中的值并非静态。如果股市开盘，部分值（如价格、美元变动额和百分比变动额）会在一天中发生变化。如果股市开盘，可以刷新数据以获取当前值（存在\
  \ 15 分钟延迟）。要更新数据，请单击功能区中的“数据”选项卡，然后在“查询和连接”组中单击`Refresh All`（全部刷新）。当表中的值更新后，任何使用该数据的计算结果也会随之更新。\n\
  \n图 16-44 显示了在输入表格后的第二天单击`Refresh All`（全部刷新）的结果。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig44_HTML.jpg](img/385660_2_En_16_Fig44_HTML.jpg)\n\
  \n图 16-44\n单击`Refresh All`（全部刷新）后自动更新的股票值\n\n### 练习 16-2：使用股票数据类型\n\n#### 创建共同基金表\n\
  \n在此练习中，你将使用“股票”数据类型创建一个共同基金数据表。\n\n1.  单击功能区中的“数据类型”选项卡，然后在“数据类型”组中单击`Stocks`（股票）。股票代码将转换为共同基金名称，并且股票数据类型符号会出现在基金名称的左侧。\n\
  2.  单击表格右上角出现的“添加列”按钮。选择`Return (1y)`（1 年回报率）。再次单击“添加列”按钮并选择`Return (3y)`（3 年回报率）。再单击一次“添加列”按钮并选择`Return\
  \ (5y)`（5 年回报率）。\n3.  你需要应用“自动换行”以使列标题可读。选中单元格区域`A1:E1`（你稍后将向 E 列添加数据）。右键单击选中的其中一个单元格，选择“设置单元格格式”。在“设置单元格格式”窗口中，单击“对齐”选项卡并选择“自动换行”。单击“确定”按钮。见图\
  \ 16-47。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig47_HTML.jpg](img/385660_2_En_16_Fig47_HTML.jpg)\n\
  \n图 16-47\n转换为股票数据类型、添加字段并设置标题文本自动换行\n\n4.  选择单元格区域`A1:A6`，然后单击“快速分析”按钮。选择“表格”选项卡，然后单击“表格”图标。见图\
  \ 16-46。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig46_HTML.jpg](img/385660_2_En_16_Fig46_HTML.jpg)\n\
  \n图 16-46\n将数据转换为表格\n\n5.  创建一个新工作表。\n6.  输入包含共同基金名称或其股票代码的以下数据。将标题行中的“公司”加粗。见图\
  \ 16-45。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig45_HTML.jpg](img/385660_2_En_16_Fig45_HTML.jpg)\n\
  \n图 16-45\n在工作表中输入此数据\n\n#### 创建计算\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig49_HTML.jpg](img/385660_2_En_16_Fig49_HTML.jpg)\n\
  \n图 16-49\nE 列包含向下复制的公式并添加了标题\n\n7.  按`Enter`键，其他共同基金的数据将自动填充。你可以看到本月表现良好。如果该基金能在全年保持此收益率，那么\
  \ T Rowe Price Blue Chip 基金全年将实现 62.75%的增长。将 E 列的列标题更改为“调整后月度收益年化”。见图 16-49。\n8.\
  \  有一个 1 个月期的回报选项。假设你想知道如果全年都保持相同的回报率，年化收益是多少。在单元格`E2`中输入等号（`=`）。单击单元格`A2`中的股票数据类型符号。双击`Return\
  \ (1m)`（1 个月回报率）。输入星号（`*`）进行乘法运算，然后输入`12`。你的公式应如图 16-48 所示。\n\n![../images/385660_2_En_16_Chapter/385660_2_En_16_Fig48_HTML.jpg](img/385660_2_En_16_Fig48_HTML.jpg)\n\
  \n图 16-48\n基于当前 1 个月回报率的年化回报率计算公式\n\n> **注意：**\n> 你可以通过右键单击单元格，然后选择“数据类型” > “转换为文本”来将数据类型更改回文本。仅当你希望拥有静态数据时才执行此操作。如果执行此操作，你将移除与数据的在线连接。你将无法刷新数据，并且包含使用该数据公式的单元格将显示`#FIELD!`错误。\n\
  \n## 总结\n\n微软创建了两种新的数据类型：“地理”和“股票”，未来可能还会有更多数据类型。“地理”数据类型包含有关国家、省、地区、州、县、市和城镇的字段数据。“股票”数据类型包含有关股票、债券和共同基金的字段数据。这两种数据类型的工作方式相同。你可以从选项列表中仅显示所需数据，或者将数据用于公式。如果\
  \ Excel 无法识别你输入的地理位置或股票，单元格中会出现一个问号，并且“数据选择器”将显示一条消息，提示未找到该位置的结果。如果存在多个同名的位置或股票，单元格中也会出现一个问号。此时，你必须选择你所指的地理位置或股票。在“数据选择器”中单击某个位置，或单击单元格中的数据类型图标，将显示一个数据卡片，其中不仅包含可用数据的类型，还包括数据本身。“添加列”功能显示可用数据的类型，但不显示数据本身。你可以通过单击包含数据类型的单元格并选择要使用的字段选项，来创建使用数据类型的公式。\n\
  \n"
- "# 第 17 章 使用多媒体增强工作簿\n\n多媒体包括所有不同类型的媒体。你一直在使用文本媒体，但现在你可以向电子表格中添加图像、形状、剪贴画、视频和音频。多媒体可以通过增加电子表格的吸引力来帮助你吸引观众的注意力。SmartArt\
  \ 提供了多种组织图和其他图表，你可以根据需要进行修改。你可以从网站或 Excel 示例中截取屏幕截图，然后将该截图放入当前工作表中。\n\n阅读并完成本章学习后，你应该能够：\n\
  \n*   添加并编辑图像\n*   使用 WordArt\n*   添加并更改形状\n*   截取整个窗口或其中的一部分并使其成为图像\n*   使用 SmartArt\n\
  *   添加视频\n*   使用音频\n\n\n\n## 为工作表添加图片\n\n你可以从计算机或互联网向工作表添加图片。在`插入`选项卡的`插图`组中有两个用于获取图片的按钮。`图片`按钮用于从计算机获取图片，而`联机图片`按钮则用于从互联网获取图片。见图\
  \ 17-1。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig1_HTML.jpg](img/385660_2_En_17_Fig1_HTML.jpg)\n\
  \n**图 17-1** 功能区中的`插图`组\n\n如果单击`图片`按钮，Excel 会显示`插入图片`对话框，你可以通过它浏览并找到直接连接计算机或通过网络连接的任意驱动器上的图像。\n\
  \n如果单击`联机图片`按钮，你将看到一个显示图像类别的窗口。见图 17-2。你可以单击其中一个类别，然后从该类别中选择图像，或者在`搜索 Bing`文本框中输入搜索词。`Bing`是微软的搜索引擎。如果你想从`OneDrive`访问图像，可以单击`OneDrive`按钮。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig2_HTML.jpg](img/385660_2_En_17_Fig2_HTML.jpg)\n\
  \n**图 17-2** `插入图片`窗口\n\n在图 17-3 中，已输入搜索词`Dog`。如果你要使用基于知识共享许可协议的图像，请确保选中复选框。如果取消选中，你会看到更多图像，但使用其中部分图像需要付费。单击一个图像，再单击`插入`按钮，即可将其粘贴到工作表中。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig3_HTML.jpg](img/385660_2_En_17_Fig3_HTML.jpg)\n\
  \n**图 17-3** 已输入搜索词`dog`\n\n你可以通过单击筛选按钮 ![../images/385660_2_En_17_Chapter/385660_2_En_17_Figa_HTML.jpg](img/385660_2_En_17_Figa_HTML.jpg)\
  \ 来筛选显示的图像。图 17-4 显示了可用的筛选条件。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig4_HTML.jpg](img/385660_2_En_17_Fig4_HTML.jpg)\n\
  \n**图 17-4** 可用的筛选条件\n\n筛选按钮并非对你当前看到的图片进行筛选；而是对互联网上可用的图片进行筛选。如果你应用了诸如“红色”的筛选条件，你将看到红色的狗图片，比如克利福德。你可以组合使用筛选条件。如果你想查看中等尺寸的黑白照片，你可以选中这三个筛选条件。\n\
  \n### 练习 17-1：从计算机添加图像\n\n在本练习中，你将探索修改图像、为图像添加边框以及应用图片样式的各种方法。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig12_HTML.jpg](img/385660_2_En_17_Fig12_HTML.jpg)\n\
  \n**图 17-12** 发光效果\n\n1. 单击`图片效果`。这里有七组不同的效果。将光标移到各个`图片效果`上，同时观察它们对工作表中选定图像的影响。图\
  \ 17-12 中的图片应用了发光效果。\n\n1. 在`图片样式`组中，单击`图片边框`按钮中的下拉箭头。选择红色，并将边框粗细更改为`3 pt`。见图 17-11。按`Ctrl\
  \ + Z`移除边框。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig11_HTML.jpg](img/385660_2_En_17_Fig11_HTML.jpg)\n\
  \n**图 17-11** 粗细为`3 pt`的红色边框\n\n1. 将光标移到各个样式上，同时观察它们对工作表中选定图像的影响。\n\n图 17-10 展示了`图片样式`可以显示图像的一些不同方式。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig10_HTML.jpg](img/385660_2_En_17_Fig10_HTML.jpg)\n\
  \n**图 17-10** `图片样式`可以显示图像的不同方式\n\n1. 在不改变图片外观的情况下创造戏剧性效果的最佳方法是使用`图片样式库`中的一种样式。见图\
  \ 17-9。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig9_HTML.jpg](img/385660_2_En_17_Fig9_HTML.jpg)\n\
  \n**图 17-9** `图片样式库`\n\n1. 在`调整`组中，单击`艺术效果`按钮。将光标移到缩略图上，同时观察它们对工作表中选定图像的影响。图 17-8\
  \ 展示了应用于图像的“铅笔素描”和“影印”特殊效果。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig8_HTML.jpg](img/385660_2_En_17_Fig8_HTML.jpg)\n\
  \n**图 17-8** 特殊效果：铅笔素描和影印\n\n1. 在`调整`组中，单击`颜色`按钮。见图 17-7。此处的调整会影响图像的饱和度、色调和整体颜色。将光标移到缩略图上，同时观察它们对工作表中选定图像的影响。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig7_HTML.jpg](img/385660_2_En_17_Fig7_HTML.jpg)\n\
  \n**图 17-7** 调整图像的整体颜色、饱和度和色调\n\n1. 当你在工作表上选中一个图像时，功能区将显示一个`格式`选项卡。`格式`选项卡包含用于修改、调整大小、着色、旋转、裁剪、应用效果、添加边框等的所有选项。单击图像。单击功能区的`格式`选项卡。\n\
  \n2. 在`调整`组中，单击`更正`。更正库会显示你的图像缩略图，并带有不同程度的锐度、亮度和对比度。见图 17-6。`锐化/柔化`组中间和`亮度/对比度`组中间的图像带有一个边框。带有边框的图像代表你图像当前的显示效果。将光标移到缩略图上，同时观察它们对工作表中选定图像的影响。在`亮度/对比度`组中，向右移动，亮度增加。在该组中向下移动，对比度增加。如果要为选定的图像应用某种效果，请单击该缩略图。如果决定不喜欢该效果，可以按`Ctrl\
  \ + Z`撤消操作。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig6_HTML.jpg](img/385660_2_En_17_Fig6_HTML.jpg)\n\
  \n**图 17-6** `更正`库，你可以在其中改变锐度、亮度和对比度的级别\n\n在`调整`组中，有一个`重设图片`按钮，它可以让你仅重设图片，或者同时将图片及其大小重设回插入时的原始状态。\n\
  \n1. 打开工作簿第 17 章。创建一个新的工作表。\n\n2. 单击功能区的`插入`选项卡。在`插图`组中，单击`图片`。\n\n3. 浏览到第 17 章的文件夹。找到`Pilot`图片。选择它，然后单击`插入`按钮。图\
  \ 17-5 显示了该图片。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig5_HTML.jpg](img/385660_2_En_17_Fig5_HTML.jpg)\n\
  \n**图 17-5** `Pilot`图片\n\n你已经学会了如何从计算机中保存的图像文件向工作表添加图像。如果你想要添加在网站上看到的图像，或者想要编写培训文档并需要来自\
  \ Excel、Word 或其他应用程序的图像，该怎么办？Excel 有一个名为`屏幕截图`的功能，可以让你捕获这些图像。\n\n\n\n## 使用屏幕截图\n\
  \n使用`Screenshot`功能可以抓取整个窗口或窗口的一部分，并将其转换为图像。`Screenshot`按钮位于`插入`选项卡的`插图`组中。点击`Screenshot`按钮会打开所有可用窗口的缩略图视图。详见图\
  \ 17-13。单击其中任意缩略图，即可捕获该窗口的全尺寸图像。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig13_HTML.jpg](img/385660_2_En_17_Fig13_HTML.jpg)\n\
  \n图 17-13\n\n`Screenshot`可以捕获计算机上打开的其中一个窗口\n\n如果只想抓取窗口的一部分，则需要先打开该窗口，然后再点击`屏幕剪辑`。点击`屏幕剪辑`后，`Excel`程序会最小化，正在捕获的窗口会变暗，光标变为十字准线。拖动鼠标时，图像中包含的区域会变亮。完成区域选择后，图像便会出现在工作表中。\n\
  \n练习 17-2：使用屏幕截图抓取图像\n\n在本练习中，您将抓取网页的一部分，并将其存储到工作表中。然后，对捕获的图像应用图片样式。\n\n1.  最大化`Excel`窗口。将捕获的图像移动到工作表窗口的中心。\n\
  \n2.  单击功能区的`格式`选项卡。在`图片样式`组中，从`样式`库中选择`投影矩形`。这将在图像的底部和右侧添加阴影。\n\n1.  如果网页已最大化，请缩小窗口大小，以便您能同时看到网页浏览器中的`利润表`和`Excel`中的`插入`选项卡。\n\
  \n2.  单击功能区的`插入`选项卡。在`插图`组中，点击`Screenshot`按钮。\n\n3.  点击窗口底部的`屏幕剪辑`。在进行屏幕剪辑时，`Excel`程序会隐藏。\n\
  \n4.  使用十字准线，在利润表上拖动。当您在利润表上拖动时，将被捕获图像包含的区域会高亮显示。详见图 17-15。释放鼠标后，高亮区域即成为一张图像，并存储在工作表中。\n\
  \n    ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig15_HTML.jpg](img/385660_2_En_17_Fig15_HTML.jpg)\n\
  \n    图 17-15\n\n    当您在利润表上拖动时，捕获图像中包含的区域会高亮显示\n\n    屏幕剪辑是一张图像，因此所有可应用于图像的功能同样适用于屏幕剪辑。\n\
  \n1.  点击`Screenshot`工作表。\n\n2.  关闭或最小化除`Excel`之外的所有打开窗口。\n\n3.  点击单元格`A1`中的超链接。\n\
  \n4.  向下滚动网页，直到图 17-14 中显示的整个`利润表`可见。\n\n    ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig14_HTML.jpg](img/385660_2_En_17_Fig14_HTML.jpg)\n\
  \n    图 17-14\n\n    将使用`Screenshot`捕获的窗口\n\n## 使用艺术字\n\n`WordArt`是一种装饰性文本，您对其的控制程度远超普通文本。您可以扭曲`WordArt`文本、使其沿路径排列、更改其形状、添加\
  \ 3D 效果、更改字体及背景等。\n\n练习 17-3：使用艺术字\n\n在本练习中，您将探索创建和更改`WordArt`的各种方法。创建一个新工作表。\n\n\
  ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig18_HTML.jpg](img/385660_2_En_17_Fig18_HTML.jpg)\n\
  \n图 17-18\n\n使用了`宽松透视`效果的文本\n\n1.  将光标移至不同颜色上，观察其对`WordArt`的效果。\n\n2.  点击`纹理`。将光标移至每个`纹理`上，观察其对`WordArt`的效果。\n\
  \n3.  请注意，您甚至可以用`图片`填充文本。\n\n4.  `渐变`效果取决于您当前使用的颜色。\n\n我们不进行任何更改。\n\n5.  在`艺术字样式`组中，点击`文本轮廓`的下拉箭头。您可以为轮廓选择一种颜色，然后通过更改粗细来调整轮廓尺寸。选择绿色作为轮廓颜色。再次点击`文本轮廓`的下拉箭头，选择粗细为\
  \ 1 磅。\n\n6.  在`艺术字样式`组中，点击`文本效果`。浏览`阴影`、`映像`和`发光`选项，观察它们对`WordArt`的影响。\n\n7.  再次点击`文本效果`。点击`三维旋转`。将光标移至效果上时，可能无法看到预览效果。这似乎有些奇怪，但您必须先应用一个\
  \ 3D 效果，之后才能通过移动光标查看不同的 3D 效果：\n    1.  点击其中一个 3D 效果。\n\n2.  再次点击功能区上的`文本效果`，然后重新选择`三维旋转`。现在，当您将光标移至每个效果上时，应该能看到效果了。\n\
  \n3.  选择`宽松透视`效果。详见图 17-18。\n\n1.  选择第一行中的第一个`A`。\n\n2.  输入`快乐音符音乐`。选中该文本。\n\n`WordArt`使用`开始`选项卡上`字体`组中选定的字体类型。\n\
  \n3.  单击功能区的`开始`选项卡。在`字体`组中，点击`字体类型`的下拉箭头。将光标移至不同字体类型上，观察其对`WordArt`的影响。\n\n4. \
  \ 单击功能区的`格式`选项卡。在`艺术字样式`组中，点击`文本填充`的下拉箭头。详见图 17-17。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig17_HTML.jpg](img/385660_2_En_17_Fig17_HTML.jpg)\n\
  \n图 17-17\n\n`文本填充`选项\n\n1.  创建一个新工作表。\n\n2.  单击功能区的`插入`选项卡。在`文本`组中，点击`WordArt`按钮。详见图\
  \ 17-16。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig16_HTML.jpg](img/385660_2_En_17_Fig16_HTML.jpg)\n\
  \n图 17-16\n\n`WordArt`\n\n我们更改了文本，但也可以更改文本背后的背景。我们已经了解了`文本填充`、`文本轮廓`和`文本效果`。这些相同的选项也适用于背景。这些选项位于`形状样式`组中，分别称为`形状填充`、`形状轮廓`和`形状效果`。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig21_HTML.png](img/385660_2_En_17_Fig21_HTML.png)\n\
  \n图 17-21\n\n文本效果\n\n1.  点击`文本效果`按钮。这里还有针对`材质`和`照明`的附加效果。详见图 17-21。浏览这些效果的每个选项。您需要逐个点击它们。这些选项在移动鼠标时不会显示变化。\n\
  \n\n\n1.  右键单击艺术字，选择 **设置文本效果格式**。这将打开“设置形状格式”窗格，且窗格顶部已选中“文本选项”。此处的许多选项与您已使用过的相同，但有些选项提供了对应用效果的更精细控制。您可以通过单击“文本填充与轮廓”按钮，然后展开“文本填充”来查看。请参见图\
  \ 17-20。单击此窗格中的选项按钮，您将看到每个效果的更多控制选项。\n\n  ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig20_HTML.jpg](img/385660_2_En_17_Fig20_HTML.jpg)\n\
  \n  **图 17-20** 文本选项对话框\n\n2.  逐一浏览每个形状选项。您可能会创建出类似于图 17-19 的效果。\n\n  ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig19_HTML.jpg](img/385660_2_En_17_Fig19_HTML.jpg)\n\
  \n  **图 17-19** 看看您是否能创建出类似的效果\n\n艺术字可以变形以遵循路径，或扭曲成真正吸引眼球的效果。\n\n**练习 17-4：让艺术字跟随路径**\n\
  \n在本练习中，您将使文本围绕一个圆跟随路径。\n\n1.  单击功能区上的“视图”选项卡。在“显示”组中，取消勾选“网格线”。\n\n2.  在功能区的“艺术字样式”组中，单击“文本效果”。单击“转换”。在“跟随路径”下，单击第一个形状（上弯弧形）。\n\
  \n3.  单击功能区上的“插入”选项卡。在“文本”组中，单击“艺术字”。在库中选择第一个字母 **A**。\n\n4.  将文本更改为 **Computer\
  \ Tutorials**。\n\n5.  在功能区的“大小”组中，将高度和宽度都更改为 3.94。\n\n6.  在功能区的“艺术字样式”组中，单击“文本效果”。单击“转换”。在“跟随路径”下，单击第二个形状（下弯弧形）。\n\
  \n7.  拖动边框向上，使文本对齐在 **Professor Office** 文本下方，如图 17-23 所示。\n\n8.  单击功能区上的“插入”选项卡。在“插图”组中，单击“形状”并选择椭圆。\n\
  \n9.  按住 `Shift` 键，同时单击鼠标左键并拖动，使其在文本内形成一个完美的圆形，如图 17-23 所示。\n\n这可以用于制作徽标。您可以在圆内添加更多文本。您还可以通过应用\
  \ 3D 或其他效果来美化这个圆形。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig23_HTML.jpg](img/385660_2_En_17_Fig23_HTML.jpg)\n\
  \n**图 17-23** 在文本内制作一个圆形\n\n1.  创建一个新工作表。\n\n2.  单击功能区上的“插入”选项卡。在“文本”组中，单击“艺术字”。在库中选择第一个字母\
  \ **A**。\n\n3.  将文本更改为 **Professor Office**。\n\n4.  在功能区的“大小”组中，将高度和宽度都更改为 3.94。\n\
  \n5.  拖动边框向上，使其靠近窗口顶部。请参见图 17-22。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig22_HTML.jpg](img/385660_2_En_17_Fig22_HTML.jpg)\n\
  \n**图 17-22** 如图所示将边框向上拖动\n\n## 添加和修改形状\n\nExcel 提供了一个包含八个形状组的大型库。请参见图 17-24。还有一个组包含您最近使用过的形状。形状位于功能区“插入”选项卡的“插图”组中。要使用形状，请单击您希望放置的位置，然后拖动到所需大小。拖动时按住\
  \ `Shift` 键可以限制某些形状的移动；例如，线条将保持笔直，矩形将变成完美的正方形，椭圆将变成一个完美的圆形。您可以添加、修改和删除形状。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig24_HTML.jpg](img/385660_2_En_17_Fig24_HTML.jpg)\n\
  \n**图 17-24** 八个形状组的库\n\n**练习 17-5：使用形状**\n\n在本次练习中，我们将使用形状来创建流程图的一部分。请参见图 17-25。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig25_HTML.jpg](img/385660_2_En_17_Fig25_HTML.jpg)\n\
  \n**图 17-25** 这将是本次练习的最终结果\n\n1.  接下来，我们将在决策符号左侧添加文本 **No**，并在其右侧添加文本 **Yes**：\n\
  \    1.  单击功能区上的“插入”选项卡。在“文本”组中，单击“文本框”。光标将变为一个向下箭头。\n\n    2.  在决策符号左侧拖出一个矩形。在文本框中输入\
  \ **No**。\n\n    3.  右键单击文本框，然后选择“设置形状格式”。在“线条”下，选择 **无线条** 选项。这将移除文本框边框。将文本的字体大小增加到\
  \ 16。\n\n    4.  单击文本框的外边框。按 `Ctrl + C` 复制它。按 `Ctrl + V` 粘贴它。将粘贴的文本框移动到决策符号的右侧。\n\
  \n    5.  将文本更改为 **Yes**。\n\n    6.  进行任何必要的调整。\n\n2.  现在您可以添加文本了：\n    1.  单击左上角的矩形。\n\
  \n    2.  输入文本 **Regular Pay = Hours Worked * Hourly Rate**。\n\n    3.  单击功能区上的“开始”选项卡。在“对齐方式”组中，单击“中部对齐”按钮。\n\
  \n    4.  以相同方式为其他形状输入并对齐文本。按如下方式输入文本：\n        *   左侧第二个矩形：**Gross Pay = Regular\
  \ Pay**\n\n        *   决策形状：**Hours Worked > 40?**\n\n        *   右侧第一个矩形：**Regular\
  \ Pay = 40 * Hourly Rate**\n\n        *   右侧第二个矩形：**OverTime Pay = (HoursWorked\
  \ – 40) * 1.5**\n\n        *   右侧第三个矩形：**Gross Pay = Regular Pay + OverTime Pay**\n\
  \n        *   文档形状：**Print Report**\n\n    5.  增加文档形状中的字体大小。您的流程图应看起来像图 17-34 中所示。\n\
  \n  ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig34_HTML.jpg](img/385660_2_En_17_Fig34_HTML.jpg)\n\
  \n  **图 17-34** 您的流程图现在应类似于这样\n\n3.  按 `Ctrl + C` 复制线条。按 `Ctrl + V` 粘贴它。拖动粘贴的线条，使其连接右下角的矩形与连接到文档图标的线条。更改大小以使其合适。进行任何其他必要的调整。您的流程图现在应看起来像图\
  \ 17-33 中所示。\n\n  ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig33_HTML.jpg](img/385660_2_En_17_Fig33_HTML.jpg)\n\
