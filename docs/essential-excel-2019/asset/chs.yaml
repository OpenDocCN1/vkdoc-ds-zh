  \ 通过在第 11 行和第 12 行行标之间点击并向下拖动，将第 11 行的高度增加到大约 22.5。\n\n您已经学会了如何使用功能区`对齐方式`组中的命令，在单元格内水平和垂直对齐数据，以及旋转单元格数据。您练习了合并单元格，以便数据可以占用多个单元格。`自动换行`和`缩小字体填充`功能允许您在单元格中放置更多文本。接下来，您将了解如何将应用于一个单元格的所有格式复制到其他单元格。\n\
  \n\n\n## 使用格式刷复制格式\n\n格式刷可用于将一个单元格中的所有格式复制到其他单元格。格式刷按钮的图标是一把刷子。它位于“开始”选项卡的“剪贴板”组中。参见图\
  \ 4-51。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig51_HTML.jpg](img/385660_2_En_4_Fig51_HTML.jpg)\n\
  \n图 4-51\n\n“剪贴板”组\n\n格式刷不仅加快了将相同格式应用于其他单元格的过程，还使您的工作簿外观保持一致变得轻松。\n\n单击格式刷按钮可将选定单元格的格式复制到单个单元格区域，然后自动关闭。双击格式刷按钮可使其保持开启状态，这样您就可以继续将格式应用于任意多个单元格区域，直到再次单击该按钮将其关闭。\n\
  \n### 练习 4-6：使用格式刷复制格式\n\n本练习将指导您完成将应用于一个单元格的格式复制到其他单元格的过程。\n\n1.  单击快速访问工具栏上的“保存”按钮\
