  \ 键并按 `End` 键，跳转到单元格 `F9`。\n\n**Ctrl+Home 键**\n\n按住 `Ctrl` 键的同时按 `Home` 键，始终会将光标移动到单元格\
  \ `A1`。\n\n1. 按住 `Ctrl` 键并按 `Home` 键，跳转到单元格 `A1`。\n\n**Page Down 键**\n\n按 `Page\
  \ Down` 键可将光标向下移动一屏。\n\n1. 按 `Page Down` 键两次，向下移动两屏。\n\n**Page Up 键**\n\n按 `Page\
  \ Up` 键可将光标向上移动一屏。\n\n1. 按 `Page Up` 键两次，向上移动两屏。\n\n2. 单击 `快速访问工具栏` 上的 `保存` 按钮 ![../images/385660_2_En_2_Chapter/385660_2_En_2_Figb_HTML.jpg](img/385660_2_En_2_Figb_HTML.jpg)。\n\
  \n在本节中，您学会了在输入数据时使用键盘在单元格之间移动。接下来，您将学习如何选择单元格，首先使用鼠标，然后使用键盘。\n\n## 选择单元格\n\n有多种方法可以选择单个单元格、一个单元格区域、单个单元格和单元格区域的组合，甚至是不相邻的单元格。选择多个单元格对于同时应用格式、创建公式、删除或插入整行或整列非常有用。\n\
  \n当您拖过相邻单元格块时（见图 2-3），Excel 会在 `名称框` 中显示该块的行数和列数。图 2-3 中的 `名称框` 显示该单元格块跨越三行两列。\n\
  \n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig3_HTML.jpg](img/385660_2_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n三行两列\n\n### 使用鼠标选择单元格\n\n表 2-2 说明了如何使用鼠标选择不同的工作表区域。\n\n表 2-2\n\n如何使用鼠标选择不同的工作表区域\n\
  \n| 选择目标 | 操作方法 |\n| --- | --- |\n| 整列 | 将单元格指针定位在列标（字母）上，然后单击鼠标左键。 |\n| 整行 | 将单元格指针定位在行号（数字）上，然后单击鼠标左键。\
  \ |\n| 相邻单元格 | 用鼠标拖动以选择范围内的单元格——或单击范围内的第一个单元格，按住 `Shift` 键，再单击范围内的最后一个单元格。 |\n|\
  \ 不相邻单元格 | 按住 `Ctrl` 键，同时单击列标、行号或特定单元格。 |\n| 工作表中所有单元格 | 单击 `全选` 按钮 ![../images/385660_2_En_2_Chapter/385660_2_En_2_Figc_HTML.jpg](img/385660_2_En_2_Figc_HTML.jpg)。\
  \ |\n\n\n\n### 使用鼠标取消选择单元格\n\n出于某种原因，在笔记本电脑上使用鼠标取消选择单元格的功能可能无法使用。如果您使用的是台式机，请尝试以下方法：如果您已有选定的单元格区域，希望从中取消选择部分单元格，可以按住\
  \ `Ctrl` 键，同时拖过要从选定区域中移除的单元格。如果您需要重新选中已取消选择的单元格，或想要添加更多单元格，请继续按住 `Ctrl` 键并选择这些单元格。\n\
  \n**练习 2-2：使用鼠标选择单元格**\n\n在本练习中，您将选择不同的单元格区域。虽然我们稍后会详细讲解格式设置，但通过这个简单练习，您可以初步了解如何使用它们。\n\
  \n#### 选择整行或整列\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig4_HTML.jpg](img/385660_2_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n选择列标时，Excel 会显示已选择的行数和列数\n\n1. 打开您在上一练习中创建的工作簿 **Chapter** 2。\n2. 将光标置于列标\
  \ B 上。您会看到一个向下箭头；按住鼠标左键，拖动鼠标穿过列标 C，即可同时选中 B 列和 C 列。拖动时，您会看到一个框，其中显示当前选择的行数和列数。请参见图\
  \ 2-4。\n\n单击工作表中的空白区域以清除选择。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig5_HTML.jpg](img/385660_2_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n选择行标时，Excel 会显示已选择的行数和列数\n\n1. 将单元格指针置于行标 4 上。光标会变为一个向右箭头，按住鼠标左键并向下拖动，即可选中行标\
  \ 4、5、6 和 7。拖动时，您会看到一个框，其中显示当前选择的行数和列数。请参见图 2-5。\n\n#### 选择相邻单元格\n\n1. 单击单元格 `B4`，按住\
  \ `Shift` 键，再单击单元格 `F9`。\n2. 在功能区 **开始** 选项卡的 **数字** 组中，点击 `$`（这将为选定单元格添加货币符号、逗号和小数点）。\n\
  3. 单击单元格 `A3`，然后向右拖动至单元格 `F3`。\n4. 在功能区 **开始** 选项卡的 **字体** 组中，点击 `B`（这将使选定单元格加粗）。\n\
  \n**注意：** 您也可以通过点击希望作为区域左上角的单元格，然后按住 `Shift` 键并点击希望作为区域右下角的单元格来选择相邻单元格。\n\n####\
  \ 选择不相邻的单元格\n\n1. 为选择区域选择一个格式，例如更改字体颜色或字体大小。\n2. 单击一个不属于当前选择区域的单元格，以清除之前的选择。\n3.\
  \ 单击列标 C。按住 `Ctrl` 键进行以下选择：\n   - 拖动鼠标穿过行标 3 和 4。\n4. 单击单元格 `E6`。\n5. 单击单元格 `F9`。\n\
  6. 单击单元格 `A1`。\n\n#### 选择工作表中的所有单元格\n\n1. 单击工作表左上角的 **全选** 按钮 ![../images/385660_2_En_2_Chapter/385660_2_En_2_Figd_HTML.jpg](img/385660_2_En_2_Figd_HTML.jpg)。它位于行标上方，列标的左侧。\n\
  \n#### 取消选择和重新选择工作表中的部分单元格\n\n1. 仅当您使用台式电脑时执行以下操作：按住 `Ctrl` 键。拖过单元格区域 `C4:E7` 以取消选择这些单元格。保持按住\
  \ `Ctrl` 键，同时拖过单元格 `D5` 和 `D6` 以重新选择它们。\n2. 单击 **快速访问工具栏** 上的 **保存** 按钮。\n\n现在您已经学习了如何使用鼠标选择单元格，下一步是学习如何使用键盘组合键来选择单元格。下一部分有一个表格详细说明了操作方法。\n\
  \n---\n\n### 使用键盘选择单元格\n\n表 2-3 说明了如何使用键盘选择不同的工作表区域。\n\n**表 2-3** 如何使用键盘选择工作表区域\n\
  \n| 选择目标         | 按键                                         |\n| :---------------\
  \ | :------------------------------------------- |\n| 整列             | `Ctrl + 空格键`\
  \                              |\n| 多列             | `Shift + 左/右箭头键`，然后按 `Ctrl\
