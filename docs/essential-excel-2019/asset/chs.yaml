  \ 即可显示前 25%。\n\n前 25% 的单元格将使用你所选择的格式进行高亮显示。当前显示的是 `浅红色填充 深红色文本`。\n\n单击下拉箭头，然后依次单击每个选项，观察其对所选区域的影响。重复此操作，直到你了解了每个选项的效果。最后，单击\
