  \n图 5-10\n\n从这些预设页眉中选择一个页眉\n\n11. 更改`缩放`工具，以便您能清晰地看到工作表上方的文本 `添加页眉`。将鼠标指针移动到“添加页眉”文本上。该区域应被选中。请参见图\
  \ 5-9。\n\n![../images/385660_2_En_5_Chapter/385660_2_En_5_Fig9_HTML.jpg](img/385660_2_En_5_Fig9_HTML.jpg)\n\
