  \n### 使用名称框跳转到单元格\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fige_HTML.jpg](img/385660_2_En_2_Fige_HTML.jpg)\n\
  \n1.  在`名称`框中键入 `F15` 并按 `Enter`。\n\n接下来，你将学习如何处理工作表。你将学习如何选择、重新排列它们以及更改它们的标签颜色——以及添加、删除和隐藏工作表。\n\
  \n## 工作表\n\nExcel 中的电子表格被称为*工作表*。各个工作表一起存储在*工作簿*中。在 Excel 中保存工作时，你保存的不是单个工作表，而是工作簿。在一个工作表中输入的数据可以同时输入到其他工作表中。数据可以在工作表之间传递。数据也可以从其他工作簿或其他来源导入到工作表中。\n\
  \n一个工作簿可以包含一个或多个工作表。这些工作表的标签显示在屏幕的左下角。单击某个工作表标签会使该工作表成为当前工作表。当前标签很容易识别，因为其标签文本为粗体，并且文本下方有粗线。\n\
  \n除了添加和格式化数据之外，以下是处理工作表的一些方法：\n\n-   重命名它们。\n-   添加或删除它们。\n-   隐藏和取消隐藏它们。\n-   重新排序它们。\n\
  -   将它们复制到同一个工作簿。\n-   将它们复制或移动到另一个工作簿。\n\n### 命名工作表\n\n如果添加第二个工作表，它将默认命名为 `Sheet2`。如果添加第三个工作表，它将默认命名为\
  \ `Sheet3`，依此类推。如果你创建三个工作表，删除 `Sheet3`，然后创建一个新工作表，它会将其命名为 `Sheet4`，而不会创建第二个 `Sheet3`。它会记住已使用过的名称。这些名称没有帮助，因为它们不提供任何关于工作表内容的信息，但幸运的是，你可以将它们重命名为更有意义的名称。\n\
  \n有两种方法可以重命名工作表：\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig14_HTML.jpg](img/385660_2_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14\n\na) 标签名称处于编辑模式，b) 标签已被重命名\n\n-   右键单击工作表标签并选择`重命名`。这将高亮显示你右键单击的标签（见图\
  \ 2-14a）并将标签文本置于编辑模式，你可以在其中覆盖输入当前文本（见图 2-14b）。\n-   双击工作表标签也会将标签文本置于编辑模式。\n\n###\
  \ 添加和删除工作表\n\n你可以向工作簿添加新工作表或删除它们。\n\n可以通过执行以下任一操作来添加工作表：\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig15_HTML.jpg](img/385660_2_En_2_Fig15_HTML.jpg)\n\
  \n图 2-15\n\n从`插入`对话框中选择`工作表`以添加空白工作表\n\n-   单击`新建工作表`按钮 ![../images/385660_2_En_2_Chapter/385660_2_En_2_Figf_HTML.jpg](img/385660_2_En_2_Figf_HTML.jpg)。单击`新建工作表`按钮会在当前选定工作表之后添加新工作表。\n\
  -   右键单击工作表标签并选择`插入`，这将显示`插入`对话框（见图 2-15）。选择`工作表`并单击`确定`以添加空白工作表。\n\n你还可以添加称为模板的预建工作表。单击`电子表格解决方案`选项卡以查看可用的模板（见图\
  \ 2-16）。`电子表格解决方案`选项卡上有一些非常精美的模板。有`血压追踪器`、`个人月度预算`模板、`贷款摊销`模板等等。单击一个模板可在预览区域中查看它。双击其中一个模板会将其作为工作表添加到你的工作簿中。\n\
  \n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig16_HTML.jpg](img/385660_2_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16\n\n可用的模板\n\n可以通过右键单击其标签并选择`删除`来删除工作表。\n\n\n\n### 更改工作表标签颜色\n\n你可以通过为不同标签设置不同颜色来轻松区分它们。右键单击标签，选择`标签颜色`，然后选择一种颜色，即可更改每个标签的背景颜色。见图\
  \ 2-17。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig17_HTML.jpg](img/385660_2_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17 — 选择工作表`标签颜色`\n\n### 选择多个工作表\n\n你可以通过按住`Ctrl`键同时单击工作表标签来选择多个工作表。你也可以通过先单击要选的第一个工作表标签，然后按住`Shift`键并单击要选的最后一个工作表标签，来选择多个相邻的工作表。\n\
  \n### 隐藏和取消隐藏工作表\n\n你可以通过右键单击工作表标签，然后从菜单中选择`隐藏`来隐藏工作表。隐藏不会删除工作表或以任何方式更改它。你可以通过右键单击任意工作表标签并选择`取消隐藏…`来恢复已隐藏的工作表。`取消隐藏`对话框会显示所有已隐藏的工作表。要取消隐藏工作表，只需选择要重新显示的工作表，然后单击`确定`按钮。见图\
  \ 2-18。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig18_HTML.jpg](img/385660_2_En_2_Fig18_HTML.jpg)\n\
  \n图 2-18 — 选择要取消隐藏的工作表\n\n### 重新排序和复制工作表\n\n你可以通过拖放工作表标签来更改工作表的顺序。拖动工作表标签时，光标会显示为一个文档图标。一个向下箭头![../images/385660_2_En_2_Chapter/385660_2_En_2_Figg_HTML.jpg](img/385660_2_En_2_Figg_HTML.jpg)会随拖动而移动，指示松开鼠标按钮时工作表将放置的位置。见图\
  \ 2-19。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig19_HTML.jpg](img/385660_2_En_2_Fig19_HTML.jpg)\n\
  \n图 2-19 — 将工作表拖到新位置\n\n更改工作表顺序的另一种方法是右键单击要移动的工作表标签，然后从上下文菜单中选择`移动或复制`。`移动或复制`对话框会显示工作簿中的所有工作表。你可以选择将其放在哪个工作表之前，或者选择`(移至最后)`使其成为工作簿中的最后一个工作表。见图\
  \ 2-20。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig20_HTML.jpg](img/385660_2_En_2_Fig20_HTML.jpg)\n\
  \n图 2-20 — 将当前工作表移至末尾或另一个工作表之前\n\n`移动或复制`对话框有一个用于创建工作表副本的复选框选项。选择此选项将复制你所右键单击的工作表，并将新副本放置在对话框的`下列工作表之前：`区域中指定的位置。Excel\
  \ 会将新副本命名为原工作表的名称，并在括号中添加副本的编号。图 2-21 显示`Sheet1`的副本被移到了末尾，并命名为`Sheet1 (2)`。如果再复制一份`Sheet1`，它将被命名为`Sheet1\
  \ (3)`。你也可以将复制的工作表重命名为更有意义的名称。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig21_HTML.jpg](img/385660_2_En_2_Fig21_HTML.jpg)\n\
  \n图 2-21 — Excel 在复制的工作表名称末尾添加了一个编号\n\n**注意：** 你也可以将工作表移动或复制到其他工作簿。\n\n### 使用标签按钮在工作表间移动\n\
  \n如果工作表标签左侧有圆点，则表示当前显示的标签左侧还有更多工作表。这些圆点被称为省略号。如果工作表标签右侧有省略号，则表示当前显示的标签右侧还有更多工作表。见图\
  \ 2-22。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig22_HTML.jpg](img/385660_2_En_2_Fig22_HTML.jpg)\n\
  \n图 2-22 — 处理不可见的工作表\n\n单击`下一张工作表`按钮会显示下一个工作表的标签（但不会更改当前选中的标签），结果如图 2-23 所示。\n\n\
  ![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig23_HTML.jpg](img/385660_2_En_2_Fig23_HTML.jpg)\n\
  \n图 2-23 — 单击`下一张工作表`按钮后，显示`Sheet6`\n\n此时单击`上一张工作表`按钮两次，会向后移动两个工作表标签。由于这是第一个工作表，`上一张工作表`按钮会变灰，并且左侧的省略号不再显示。见图\
  \ 2-24。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig24_HTML.jpg](img/385660_2_En_2_Fig24_HTML.jpg)\n\
  \n图 2-24 — `上一张工作表`按钮变灰，左侧省略号按钮消失\n\n如果你想要更多空间来显示工作表标签，可以将分隔条向右拖动。\n\n如果将鼠标指针悬停在`上一张`或`下一张工作表`按钮上，会显示一个工具提示，列出可用选项。见图\
  \ 2-25。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig25_HTML.jpg](img/385660_2_En_2_Fig25_HTML.jpg)\n\
  \n图 2-25 — 将鼠标指针放在`上一张`或`下一张工作表`按钮上时显示工具提示\n\n按住`Ctrl`键的同时单击`上一张工作表`按钮，会滚动到第一个工作表。按住`Ctrl`键的同时单击`下一张工作表`按钮，会滚动到最后一个工作表。\n\
  \n如果你右键单击`上一张`或`下一张工作表`按钮，会显示一个对话框，其中列出所有工作表，你可以从中激活你想要的工作表。见图 2-26。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig26_HTML.jpg](img/385660_2_En_2_Fig26_HTML.jpg)\n\
