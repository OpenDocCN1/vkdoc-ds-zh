  \n\n\n## 将宏添加到快速访问工具栏及其他对象\n\n到目前为止，我们已经了解了可以通过键入快捷键来运行宏，以及如何通过 `Macros`（宏）按钮运行宏。为了便于快速访问，你可以将宏添加到快速访问工具栏，或者将其附加到按钮或其他对象上。\n\
  \n### 练习 19-5：将单个宏分配到快速访问工具栏\n\n我们将把你刚刚创建的 `RelativeReferencing` 宏分配到快速访问工具栏。\n\n\
