  \ 20 行。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig19_HTML.jpg](img/385660_2_En_9_Fig19_HTML.jpg)\n\
  \n**图 9-19** 从“选择性粘贴”窗口中选择“验证”\n\n1.  选择单元格区域 `A13` 到 `F20`。\n2.  单击 `开始` 选项卡。在\
  \ `剪贴板` 组中，单击 `粘贴` 按钮上的向下箭头。选择 `选择性粘贴`。选择 `验证`。参见图 9-19。单击 `确定` 按钮。\n3.  单击单元格 `D12`\
  \ 内部。其右侧有一个向下箭头。\n4.  单击单元格 `D13` 内部。其右侧没有向下箭头。\n    如果以后我们需要在第 12 行之后添加数据怎么办？我们可以通过使用“选择性粘贴”来扩展验证区域。\n\
  5.  选择单元格区域 `A2:F2`。按 `Ctrl + C` 复制这些单元格。\n\n**说明** 执行复制操作时，您实际上可以使用包含要使用验证的任何单元格。\n\
  \n验证区域现在已扩展到第 20 行。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig20_HTML.jpg](img/385660_2_En_9_Fig20_HTML.jpg)\n\
  \n**图 9-20** 在第 13 行输入此数据\n\n1.  在第 13 行输入以下数据。参见图 9-20。\n    您已经学习了如何使用数据验证来防止用户输入您不希望他们输入的数据。接下来，您将看到当\
  \ Excel 遇到无法理解的输入时，它会显示一个错误代码。\n\n\n\n## 公式求值\n\nExcel 通常能识别函数中的问题，例如在存在循环引用时发出警告。表\
  \ 9-6 展示了 Excel 在发现其认为的错误时所显示的部分错误信息。\n\n**表 9-6** 错误值消息\n\n| 错误值 | 含义 | 原因 |\n\
  | --- | --- | --- |\n| `#DIV/0` | 除数为零。 | 当尝试将一个数值除以零，或者尝试将一个数值除以一个空单元格时，会发生此错误。\
  \ |\n| `#N/A` | 无可用值。 | 这不一定是错误。它表示你在查找表中查找的内容不存在。例如，如果你使用 `VLOOKUP` 且未找到与 `lookup_value`\
  \ 参数匹配的值。 |\n| `#NAME?` | 公式包含无法识别的文本。 | 当使用不存在的区域名称或工作表名称、函数名称拼写错误，或者忘记在公式中的文本字符串两侧添加引号时，会发生此错误。\
  \ |\n| `#NULL!` | 单元格引用未正确分隔。 | 如果使用空格而非逗号来分隔单元格引用或区域，会发生此错误。如果忘记在单元格引用之间放置运算符，例如在公式\
  \ `= B3 + C3 D3` 中忘记放置一个加号，也可能发生此错误。 |\n| `#NUM!` | 公式使用了无效数字。 | 公式使用了无效数字，例如输入了无效的序列日期数字。\
  \ |\n| `#REF!` | 无效的单元格引用。 | 当公式使用的单元格引用由于某种原因不再存在时（例如，你删除了公式所引用的某个值），会发生此错误。 |\n\
  | `#VALUE!` | 公式为参数使用了错误的数据类型。 | 为用于数学运算的参数使用了文本。 |\n\n### 使用 IFERROR\n\n`IFERROR`\
  \ 函数检查一个公式（或表达式），如果无错误则返回结果；否则，它返回你指定的值。\n\n`IFERROR` 函数的语法如下：\n\n```\n=IFERROR(value,\
  \ value_if_error)\n```\n\n参数：\n\n- `value` 是被测试的表达式。\n- `value_if_error` 是当表达式存在错误时将返回的文本。\n\
  \n`IFERROR` 无法区分错误的类型。错误可能是 `#DIV/0`、`#NAME?`、`#N/A`、`#REF!` 等等。无论错误类型是什么，`value_if_error`\
  \ 参数中使用的值都将被显示出来。\n\n公式 `=IF(Sales > 25000,B3 + B2, B4 + B2)` 如果 `Sales` 区域不存在，则会返回\
  \ `#NAME?` 错误。如果你想测试这种情况，可以使用以下公式：\n\n```\n=IFERROR(IF(Sales > 25000,B3 + B2, B4\
  \ + B2),\"区域名称不存在\")\n```\n\n如果 `Sales` 区域不存在，Excel 会在你输入公式的单元格中显示**区域名称不存在**。如果该区域存在，则\
  \ `IF` 函数将正常执行。\n\n在图 9-21 中，单元格 C1 包含公式 `=a1/b1`，单元格 C2 包含公式 `=a2/b2`。单元格 C1 出现了除零错误。单元格\
  \ C2 出现了 `#VALUE!` 错误，因为它试图用一个字母字符做除数。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig21_HTML.jpg](img/385660_2_En_9_Fig21_HTML.jpg)\n\
  \n**图 9-21** 公式的无效值\n\n你可以通过使用 `IFERROR` 函数使这些消息更有意义。在单元格 C1 中输入公式 `=IFERROR(A1/B1,\"\
  除以零\")`，在单元格 C2 中输入公式 `=IFERROR(A2/B2,\"除以文本\")`，将产生如图 9-22 所示的结果。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig22_HTML.jpg](img/385660_2_En_9_Fig22_HTML.jpg)\n\
  \n**图 9-22** 由 `IFERROR` 函数创建的更清晰的消息\n\n> **注意：** 使用 `IFERROR` 函数时要格外小心。如果我们同时在单元格\
  \ C1 和 C2 中使用公式 `=IFERROR(A1/B1,\"除以零\")`，结果将是相同的：两者都会显示“除以零”。\n\n## 公式审核\n\nExcel\
  \ 的“公式审核”组包含用于追踪单元格及其所使用的公式之间关系的工具。“公式审核”组位于功能区上的“公式”选项卡中。参见图 9-29。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig29_HTML.jpg](img/385660_2_En_9_Fig29_HTML.jpg)\n\
  \n**图 9-29** 公式审核工具\n\n\n\n### 追踪引用单元格与从属单元格\n\n`引用单元格` 是公式中使用的其他单元格的值。`从属单元格` 是受公式影响的值。追踪引用单元格和从属单元格可以直观地查看单元格值与公式之间的关系。一个单元格值既可以作为引用单元格，也可以作为从属单元格。选中包含要检查公式的单元格，然后点击`追踪引用单元格`按钮。点击一个公式，再点击引用单元格按钮，将显示公式中使用的所有单元格的值。\n\
  \n图 9-30 展示了单元格 `A5` 和 `C5` 的引用单元格。由于单元格 `A5` 的公式中使用了单个单元格，因此每个引用单元格都会显示一个点。而 `C5`\
  \ 的公式中使用了单元格区域，因此第一个引用单元格显示一个点，其余引用单元格则用一条线表示。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig30_HTML.jpg](img/385660_2_En_9_Fig30_HTML.jpg)\n\
  \n**图 9-30**  \n单元格 `A5` 和 `C5` 的引用单元格\n\n### 练习 9-2：追踪引用单元格与从属单元格\n\n本练习将引导您追踪所选单元格被用于哪些公式（从属单元格），以及找出哪些单元格为其提供值（引用单元格）。您还将移除引用单元格和从属单元格的箭头。\n\
  \n1. 打开工作簿第 9 章。\n2. 单击 `引用单元格` 工作表标签。\n\n图 9-31 显示了该工作表中使用的公式。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig31_HTML.jpg](img/385660_2_En_9_Fig31_HTML.jpg)\n\
  \n**图 9-31**  \n工作表中使用的公式\n\n#### 创建从属追踪线\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig32_HTML.jpg](img/385660_2_En_9_Fig32_HTML.jpg)\n\
  \n**图 9-32**  \n从属追踪线\n\n1. 单击单元格 `B2`。点击**追踪从属单元格**。追踪线显示单元格 `B2` 被用于单元格 `D2` 和\
  \ `E2` 的公式中。\n2. 单击单元格 `C3`。点击**追踪从属单元格**。追踪线显示单元格 `C3` 被用于单元格 `D3` 和 `E3` 的公式中。\n\
  3. 单击单元格 `D4` 内部。点击**追踪从属单元格**。追踪线显示单元格 `D4` 被用于单元格 `D9` 和 `F4` 的公式中。\n4. 单击单元格\
  \ `E5` 内部。点击**追踪从属单元格**。追踪线显示单元格 `E5` 被用于单元格 `E9` 和 `F5` 的公式中。\n5. 单击单元格 `F6` 内部。点击**追踪从属单元格**。追踪线显示单元格\
  \ `F6` 被用于单元格 `F9` 的公式中。图 9-32 展示了您创建的所有从属追踪线。\n\n#### 移除从属追踪线\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig33_HTML.jpg](img/385660_2_En_9_Fig33_HTML.jpg)\n\
  \n**图 9-33**  \n选择移除从属箭头\n\n1. 点击**移去箭头**下拉箭头。点击**移去从属箭头**。参见图 9-33。  \n   这将移除所选单元格的从属追踪线。\n\
  2. 点击**移去箭头**下拉箭头。点击**移去箭头**。这将移除所有追踪线。\n\n#### 创建引用追踪线\n\n1. 单击单元格 `D2`。点击**追踪引用单元格**。引用线显示为单元格\
  \ `D2` 中公式提供值的单元格。\n2. 单击单元格 `D9`。点击**追踪引用单元格**。引用线显示为单元格 `D9` 中公式提供值的单元格。\n3. 单击单元格\
  \ `F9`。点击**追踪引用单元格**。引用线显示为单元格 `F9` 中公式提供值的单元格。\n4. 点击**移去箭头**下拉箭头。点击**移去箭头**。现在所有箭头都应被移除。\n\
  \n您已经学会了如何创建追踪线，以显示公式中使用的值来自哪些单元格，以及哪些单元格正在使用这些公式的结果。接下来，您将学习如何将您想要密切关注的单元格地址添加到监视窗口中。监视窗口将反映这些单元格值的任何变化。\n\
  \n## 使用监视窗口\n\n当您想查看您输入的数值如何影响无法直接看到的公式结果时，`监视窗口`非常有用。公式可能因为位于另一个工作表而不可见，也可能位于同一工作表，但处于需要反复来回滚动的位置。`监视窗口`按钮位于`公式`选项卡的`公式审核`组中。参见图\
  \ 9-34。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig34_HTML.jpg](img/385660_2_En_9_Fig34_HTML.jpg)\n\
  \n**图 9-34**  \n功能区中的`公式审核`组\n\n通过点击`监视窗口`按钮、选择要添加的单元格，然后点击`添加监视`按钮，可以将单元格添加到`监视窗口`。通过选择要移除的项目，然后点击`删除监视`按钮，可以从`监视窗口`中移除单元格。\n\
  \n### 练习 9-3：使用监视窗口\n\n在本练习中，您将把单元格添加到`监视窗口`，然后再将它们移除。\n\n1. 打开工作簿第 9 章。该工作簿包含一月、二月和三月销售的工作表，以及一个汇总这些销售额的工作表，同时还提供了销售员\
  \ 127 和 235 的一月销售总额。\n2. 单击 `销售总额` 工作表标签。\n\n#### 向监视窗口添加单元格\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig36_HTML.jpg](img/385660_2_En_9_Fig36_HTML.jpg)\n\
  \n**图 9-36**  \n将单元格 `C3` 中的值更改为 600.00\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig35_HTML.jpg](img/385660_2_En_9_Fig35_HTML.jpg)\n\
  \n**图 9-35**  \n点击`添加监视`窗口\n\n1. 单击 `一月销售` 工作表标签。参见图 9-36。将单元格 `C3` 中的值更改为 600.00。\n\
  2. 单击功能区中的`公式`选项卡。在`公式审核`组中，点击`监视窗口`按钮。\n3. 按住 `Ctrl` 键，同时选中单元格 `B1`、`B4`、`B6` 和\
  \ `B8`。\n4. 点击`添加监视`按钮。参见图 9-35。  \n   `监视窗口`会显示您所选单元格的值及其公式。在`添加监视`对话框中点击`添加`按钮。\n\
  \n您可以在`监视窗口`中看到，将单元格 `C3` 的值更改为 600 后，单元格 `B1`、`B4` 和 `B6` 的值发生了变化。参见图 9-37。这些单元格包含了一月总销售额、季度总销售额和销售员\
  \ 127 的公式。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig37_HTML.jpg](img/385660_2_En_9_Fig37_HTML.jpg)\n\
  \n**图 9-37**  \n监视窗口\n\n1. 将单元格 `C4` 中的值更改为 700。这将更改一月总销售额、季度总销售额以及销售员 235 的总销售额的值。\n\
  \n#### 从监视窗口中移除单元格\n\n通过点击项目，然后点击`删除监视`按钮，将单元格从`监视窗口`中移除。\n\n您已经学会了如何通过向`监视窗口`添加或移除单元格地址来控制哪些单元格被监视。接下来，您将学习如何逐步计算嵌套函数。嵌套函数可能非常复杂，难以确定其不同部分。`公式求值`功能会一步步检查嵌套函数的各个部分，并显示中间结果。\n\
  \n\n\n### 使用公式求值功能逐步计算嵌套函数\n\n`公式求值`功能可以帮助你逐步了解嵌套函数的工作原理。\n\n**练习 9-4：求值嵌套公式**\n\
  \n在本练习中，你将求值一个嵌套公式。\n\n1.  打开工作簿第 9 章。\n2.  点击`求值`工作表标签。\n\n单元格`B2`有一个区域名称`性别`。单元格`C2`有一个区域名称`年龄`。单元格`D2`中的公式会判断`性别`的值是否为`F`，或者`年龄`的值是否大于等于\
  \ 21。如果任一条件为`真`，则显示`B`；否则显示空白。见图 9-38。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig38_HTML.jpg](img/385660_2_En_9_Fig38_HTML.jpg)\n\
  \n*图 9-38：嵌套公式*\n\n1.  `OR`函数的求值已完成，现在将求值`IF`函数。点击`求值`按钮。公式结果为`TRUE`，因此显示真值，此处为`B`。关闭对话框。\n\
  \n1.  点击`求值`按钮。如果任一条件为真，`OR`函数返回`TRUE`。第二个条件为`True`，因此函数返回`TRUE`。见图 9-46。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig46_HTML.jpg](img/385660_2_En_9_Fig46_HTML.jpg)\n\
  \n*图 9-46：OR 函数的结果为 TRUE*\n\n1.  点击`求值`按钮。条件`21>=21`结果为`TRUE`。见图 9-45。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig45_HTML.jpg](img/385660_2_En_9_Fig45_HTML.jpg)\n\
  \n*图 9-45：第二个条件 21>=21 结果为 True*\n\n1.  点击`单步退出`。`公式求值`窗口显示单元格`C2`中的值为 21。它检查该值是否大于等于\
  \ 21。见图 9-44。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig44_HTML.jpg](img/385660_2_En_9_Fig44_HTML.jpg)\n\
  \n*图 9-44：年龄区域值为 21*\n\n1.  `年龄`带有下划线，因此接下来将被求值。点击`单步进入`按钮。你可以在图 9-43 中看到单元格`C2`的区域名称是`年龄`。\n\
  \n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig43_HTML.jpg](img/385660_2_En_9_Fig43_HTML.jpg)\n\
  \n*图 9-43：单元格 C2 的区域名称为 Age*\n\n1.  点击`求值`按钮。`M`不等于`F`，因此表达式显示为`FALSE`，如图 9-42 所示。\n\
  \n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig42_HTML.jpg](img/385660_2_En_9_Fig42_HTML.jpg)\n\
  \n*图 9-42：M = F 的求值结果为 FALSE*\n\n1.  点击`单步退出`按钮。`公式求值`对话框显示单元格`B2`中有一个`M`。它检查该值是否等于`F`。见图\
  \ 9-41。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig41_HTML.jpg](img/385660_2_En_9_Fig41_HTML.jpg)\n\
  \n*图 9-41：使用单步退出*\n\n1.  如果你想知道带下划线的值来自哪里，可以点击`单步进入`按钮。点击`单步进入`按钮。`单步进入`按钮显示单元格`B2`与区域名称`性别`关联。见图\
  \ 9-40。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig40_HTML.jpg](img/385660_2_En_9_Fig40_HTML.jpg)\n\
  \n*图 9-40：使用单步进入*\n\n1.  点击单元格`D2`内部。\n\n2.  点击功能区中的`公式`选项卡。在`公式审核`组中，点击`公式求值`以打开`公式求值`对话框，如图\
  \ 9-39 所示。内部函数`OR`将首先被求值，然后是外部函数`IF`。`性别`带有下划线。带下划线的部分即是要求值的部分。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig39_HTML.jpg](img/385660_2_En_9_Fig39_HTML.jpg)\n\
  \n*图 9-39：公式求值窗口*\n\n### 校对单元格值——让 Excel 朗读你的输入内容\n\nExcel 可以通过朗读单元格中输入的值来帮助你校对电子表格。你可以一边听着\
  \ Excel 朗读，一边对照原始数据源，从而验证输入是否正确。\n\n此选项不在功能区中，需要将其添加到功能区或`快速访问工具栏`。\n\n**练习 9-5：校对单元格值**\n\
  \n我们不将`校对`选项添加到功能区，而是将其添加到`快速访问工具栏`。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig49_HTML.jpg](img/385660_2_En_9_Fig49_HTML.jpg)\n\
  \n*图 9-49：输入这些数据*\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig48_HTML.jpg](img/385660_2_En_9_Fig48_HTML.jpg)\n\
  \n*图 9-48：添加到快速访问工具栏的“朗读”命令*\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig47_HTML.jpg](img/385660_2_En_9_Fig47_HTML.jpg)\n\
  \n*图 9-47：将“朗读”命令添加到快速访问工具栏*\n\n1.  再次点击`按回车键朗读单元格`。这将关闭`随输入朗读`选项。\n\n2.  选中单元格`A1:C4`。点击快速访问工具栏上的`按行朗读单元格`按钮。点击快速访问工具栏上的`朗读单元格`按钮。Excel\
  \ 按行顺序朗读数据。\n\n3.  点击`按列朗读单元格`按钮。点击`朗读单元格`按钮。Excel 按列顺序朗读数据。在 Excel 读完所有数据之前，点击`朗读单元格\
  \ - 停止朗读单元格`按钮。Excel 允许在任何时候停止朗读，然后从中断处继续。现在，如果你点击`朗读单元格`，Excel 将从你点击`朗读单元格 - 停止朗读单元格`按钮的位置开始朗读。\n\
  \n1.  点击快速访问工具栏上的`按回车键朗读单元格`按钮。你会听到一个语音确认，告诉你输入到单元格中的任何内容都将被朗读出来。\n\n2.  在新工作表中输入图\
  \ 9-49 中的数据。当你输入数据时，信息会被朗读出来。\n\n1.  点击`确定`按钮。现在你的`快速访问工具栏`上应该有五个新按钮。见图 9-48。\n\n\
  1.  右键点击`快速访问工具栏`并选择`在功能区下方显示快速访问工具栏`。\n\n2.  右键点击`快速访问工具栏`并选择`自定义快速访问工具栏`。\n\n\
  3.  在`从下列位置选择命令`下拉框中，选择`不在功能区中的命令`。\n\n4.  使用滚动条向下滚动，直到找到`朗读单元格`。点击`朗读单元格`，然后点击`添加`按钮。对余下四个选项执行相同操作。见图\
  \ 9-47。\n\n\n\n## 拼写检查\n\n`拼写检查`和`同义词库`按钮位于`审阅`选项卡的`校对`组中。参见图 9-50。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig50_HTML.jpg](img/385660_2_En_9_Fig50_HTML.jpg)\n\
  \n图 9-50：`校对`组\n\n为了避免因工作簿中的拼写错误而难堪，你应始终使用 Excel 的`拼写检查`功能进行检查。你可以检查某个单元格区域，也可以检查整个工作表。如果在点击`拼写检查`之前选中了一个单元格区域，则仅检查该区域。如果你只选中了一个单元格，或者点击了\
  \ A 列左侧的`全选`按钮，则会检查整个工作表。\n\n如果 Excel 在其词典中找不到某个单词，它会将该单词显示在`不在词典中`文本框内。它会在`建议：`列表框中提供一个或多个它认为正确的拼写建议。参见图\
  \ 9-51。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig51_HTML.jpg](img/385660_2_En_9_Fig51_HTML.jpg)\n\
  \n图 9-51：`拼写检查`\n\n各个按钮的用途如下：\n\n- **忽略一次** — 告知 Excel 你不想更改当前单元格的拼写，但仍希望在其他位置检查该单词。\n\
  - **全部忽略** — 告知 Excel 你不想更改`不在词典中`文本框内的单词在当前工作表任何位置的拼写。\n- **添加到词典** — 将该单词添加到 Excel\
  \ 的词典中。此后 Excel 将不再提示该单词拼写错误。\n- **更改** — 将工作表中单元格里的单词替换为你在`建议：`列表框中选中的单词。\n- **全部更改**\
  \ — 将工作表中所有出现的`不在词典中`文本框内的单词，替换为你在`建议：`列表框中选中的单词。\n- **自动更正** — 将`建议：`列表框中选中的单词添加为\
  \ Excel `自动更正`功能中`不在词典中`文本框内单词的替换项。\n- **词典语言** — 允许你从多种不同的词典中选择一种。\n\n---\n\n##\
  \ 同义词库\n\n如果你想在电子表格中查找与某个单词含义相近的另一个单词，可以使用 Excel 的`同义词库`。只需选中该单词，然后点击`同义词库`按钮即可。图\
  \ 9-52 显示了在点击`同义词库`按钮时，单词 **Synchronizing** 已被选中。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig52_HTML.jpg](img/385660_2_En_9_Fig52_HTML.jpg)\n\
  \n图 9-52：`同义词库`\n\n**Harmonizing** 旁边的 `(v.)` 表示它是一个动词。点击列表中的某个单词，它会显示该单词的近义词。\n\
  \n图 9-53 显示从图 9-52 的列表中选中了 **Harmonizing**，现在显示了与 **Harmonizing** 含义相近的单词。`(adj.)`\
  \ 表示该单词是形容词。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig53_HTML.jpg](img/385660_2_En_9_Fig53_HTML.jpg)\n\
  \n图 9-53：与 **Harmonizing** 含义相近的单词\n\n要返回单词列表的上一步，请点击 ![../images/385660_2_En_9_Chapter/385660_2_En_9_Figa_HTML.jpg](img/385660_2_En_9_Figa_HTML.jpg)\
  \ 按钮。\n\n要将单元格中的单词替换为`同义词库`列表中的单词，请右键点击`同义词库`列表中的单词，然后选择`插入`。参见图 9-54。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig54_HTML.jpg](img/385660_2_En_9_Fig54_HTML.jpg)\n\
  \n图 9-54：将电子表格中的单词替换为`同义词库`列表中的单词\n\n---\n\n## 保护工作表与单元格免受意外或蓄意更改\n\n你可以通过防止用户意外或蓄意更改、添加或删除数据来保护工作簿数据。\n\
  \n你可以在工作簿级别、工作表级别或单元格级别保护数据。在第 6 章中，你已经了解了如何在工作簿级别保护数据。现在，你将学习如何使用工作表和单元格级别的保护。\n\
  \n### 在工作表级别保护数据\n\n工作表级别和单元格级别保护所需的命令位于`审阅`选项卡的`保护`组中。参见图 9-55。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig55_HTML.jpg](img/385660_2_En_9_Fig55_HTML.jpg)\n\
  \n图 9-55：功能区的`更改`组\n\n默认情况下，工作簿中的所有单元格都是锁定的。**锁定单元格**在你点击`保护工作表`按钮之前不提供任何保护。右键点击单元格，然后选择`设置单元格格式`，即可打开`设置单元格格式`窗口。如果你点击`保护`选项卡，你会看到“锁定”复选框已被勾选。参见图\
  \ 9-56。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig56_HTML.jpg](img/385660_2_En_9_Fig56_HTML.jpg)\n\
  \n图 9-56：单元格默认处于锁定状态\n\n**练习 9-6：保护工作表**\n\n在本练习中，你将使用密码保护一个工作表。\n\n1. 打开工作簿第 9\
  \ 章。点击`保护工作表`标签页。\n\n2. 点击功能区的`审阅`选项卡。在`更改`组中，点击`保护工作表`按钮。将显示`保护工作表`对话框。参见图 9-57。\n\
  \n   `保护工作表`对话框允许你通过勾选你想要赋予用户的选项（例如，格式化单元格或插入行列的能力）来为其分配权限。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig57_HTML.jpg](img/385660_2_En_9_Fig57_HTML.jpg)\n\
  \n图 9-57：`保护工作表`对话框\n\n3. 保持勾选**选定锁定单元格**和**选定未锁定单元格**。\n\n4. 输入一个密码。\n\n   **警告** 务必记住该密码。你应该将其保存在安全的地方。如果忘记密码，你将无法再次打开该工作表。\n\
  \n5. 点击`确定`按钮。\n\n6. 重新输入你的密码，以确认在`保护工作表`窗口中输入的密码。参见图 9-58。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig58_HTML.jpg](img/385660_2_En_9_Fig58_HTML.jpg)\n\
  \n图 9-58：确认密码对话框\n\n7. 尝试更改一个值。你将收到图 9-59 中的消息。点击`确定`按钮。\n\n8. 右键点击一个行号。注意，`插入`和`删除`选项是灰色的。\n\
  \n   这些选项以及你在`保护工作表`窗口中没有选择的其他选项均不可用。\n\n9. 右键点击一个单元格。注意，`设置单元格格式`选项是灰色的。\n\n10.\
  \ 点击`确定`按钮。\n\n11. 在`P`组中，点击`撤销工作表保护`。\n\n12. 在`撤销工作表保护`对话框中输入你之前输入的相同密码。参见图 9-60。点击`确定`按钮。\n\
  \n13. 尝试在空白单元格中输入一个值。你将收到与图 9-59 相同的消息。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig59_HTML.jpg](img/385660_2_En_9_Fig59_HTML.jpg)\n\
  \n图 9-59：提示你尝试更改的内容受保护的消息\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig60_HTML.jpg](img/385660_2_En_9_Fig60_HTML.jpg)\n\
  \n图 9-60：输入密码以撤销工作表保护\n\n现在工作表已取消保护。你可以对数据进行任何添加或更改。\n\n\n\n### 在单元格级别保护数据\n\n前面你已经看到，默认情况下所有单元格都处于锁定状态。当你单击“更改”组中的“保护工作簿”按钮时，所有被锁定的单元格都会受到保护，你将无法输入任何数据。因此，当允许用户修改单元格数据时，你不需要保护这些单元格（因为它们已经被保护了）。相反，你需要先解除那些你希望允许用户更改的单元格的锁定。在单击“保护工作簿”按钮之前，你必须指定要解除锁定的单元格。\n\
  \n**练习 9-7：保护单元格**\n\n在本练习中，你将阻止用户取消隐藏 F 列，并防止对公式或标题进行任何更改。\n\n1.  打开工作簿`Chapter\
  \ 9`。单击`Protection`工作表标签。\n\n2.  右键单击列标头 F，然后选择`Hide`。\n\n3.  选择单元格区域`A2:C8`。右键单击选中的单元格，然后选择`Format\
  \ Cells`。\n\n4.  单击`Protection`选项卡，并执行以下操作：\n    - 取消勾选`Locked`。这将解除单元格区域`A2:C8`的锁定。\n\
  \    - 勾选`Hidden`。这将阻止用户取消隐藏 F 列。\n    - 单击`OK`按钮。\n\n在功能区的“审阅”选项卡上的“保护”组中，单击`Protect\
  \ Sheet`按钮。输入密码。重新输入密码以确认密码。\n\n![图 9-61](img/385660_2_En_9_Fig61_HTML.jpg)\n\n\
  **图 9-61** 提示你所尝试更改的内容受保护的消息\n\n1.  拖动选择列标头 E 和 G。右键单击所选区域，你会看到`unhide`（取消隐藏）选项是灰色的。\n\
  \n2.  在“保护”组中，单击`Unprotect Sheet`按钮。\n\n3.  输入你的密码。单击`OK`按钮。\n\n    现在你可以对所有单元格进行更改了。\n\
  \n4.  拖动选择列标头 E 和 G。右键单击所选区域，然后选择`unhide`（取消隐藏）。\n\n1.  尝试更改单元格区域`A2:C8`中的某个值。你可以成功更改。\n\
  \n2.  尝试更改 D 列或 E 列中的某个公式。你将看到图 9-61 中显示的消息。\n\n现在 F 列应该是可见的。\n\n### 小结\n\nExcel\
  \ 拥有许多有用的功能，可以确保数据条目输入正确，并在输入错误时立即通知你，以便你更正错误。你已经了解了 Excel 如何纠正拼写错误，以及如何通过其同义词库建议其他词语。你还了解了如何通过视觉提示来追踪公式的进入和移出。Excel\
  \ 还会显示追踪箭头，以指示哪些单元格涉及循环引用。\n\n下一章将介绍如何创建、编辑和删除超链接。超链接通常简称为链接。你可能在互联网上经常使用它们，从网站的一个位置链接到另一个位置，或链接到一个完全不同的网站。超链接是可以点击的文本或对象，用于跳转到当前应用程序或其他应用程序（如另一个工作簿、网站、电子邮件应用程序等）中的某个位置。我们还将探讨如何将多个列中的文本与你希望添加的任何其他文本合并。\n\
  \n"
- "# 10. 使用超链接、合并文本以及使用状态栏\n\n超链接可以是一段文本或一个对象（如图片或图表元素），点击后可以跳转到另一个位置（例如，文档中的特定位置）或从其他文件或网页调出信息。你可能已经在互联网上使用过超链接。点击网页中的超链接可以跳转到该页面的不同位置，或跳转到一个完全不同的网页。\n\
  \n`Concatenation`（合并）和`Flash Fill`（快速填充）功能允许你将多个单元格中的文本合并，并添加额外的文本。\n\n在本章中，你还将学习如何在状态栏上显示与电子表格相关的信息。\n\
  \n阅读并完成本章内容后，你将能够：\n\n- 超链接到网页\n- 超链接到文件\n- 超链接到电子邮件\n- 超链接到当前工作簿中的某个位置\n- 创建用于创建并打开新工作簿的超链接\n\
  - 删除超链接\n- 创建合并文本\n- 使用快速填充\n\n\n\n## 使用超链接\n\n超链接通常以不同的颜色（通常是蓝色）显示，并且常常带有下划线，以便于识别。为了进一步方便识别，当鼠标移动到超链接上时，鼠标光标会变成手形指示符。你可以在\
  \ Excel 中使用超链接来链接到以下内容：\n\n- 网页或文件（文件可以是另一个电子表格文件，也可以是其他类型的文件，例如 Word 文档）\n- 当前工作簿中的特定单元格\n\
  - 新文档\n- 电子邮件地址\n\n链接到其他文件时，Excel 会在与该文件类型关联的程序中打开该文件。例如，如果你创建了一个指向扩展名为 `.docx`\
  \ 的文件的超链接，点击该超链接时，Excel 将在 Word 中打开该文件。如果你创建了一个指向扩展名为 `.psd` 的文件的超链接，Excel 将在 Photoshop\
  \ 中打开该文件。\n\n要打开 `插入超链接` 窗口，请执行以下步骤：\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig1_HTML.jpg](img/385660_2_En_10_Fig1_HTML.jpg)\n\
  \n**图 10-1** – 插入超链接对话框\n\n1. 单击你希望放置超链接的单元格。\n2. 在功能区上，单击 `插入` 选项卡。在 `链接` 组中，单击\
  \ `链接` 按钮的上半部分。\n3. 在 `插入超链接` 对话框中，执行以下操作：\n   1. 从 `链接到` 窗格中选择你想要创建的链接类型。\n   2.\
  \ 在 `要显示的文字` 文本框中输入超链接应显示的文本。\n   3. 选择或输入你想要链接到的地址，并输入你想要显示的任何屏幕提示。参见图 10-1。\n\n\
  创建超链接时，你需要做的第一件事是决定要创建的链接类型。通过单击窗口左侧 `链接到` 窗格中的相应按钮，可以选择要创建的链接类型。参见图 10-1。`链接到`\
  \ 窗格右侧显示的选项会根据你在 `链接到` 窗格中选择的按钮而变化。例如，单击 `现有文件或网页` 按钮，右侧显示的选项与单击 `本文档中的位置` 按钮时不同。\n\
  \n如果插入超链接时电子表格单元格中已有文本，该文本会显示在 `要显示的文字` 文本框中。你在此文本框中输入的任何内容都将显示在单元格中；它会覆盖单元格中现有的任何文本。文本框右侧有一个\
  \ `屏幕提示...` 按钮。单击 `屏幕提示` 按钮会弹出一个窗口，你可以在其中输入超链接的描述。当用户将鼠标移动到超链接上时，此描述会短暂显示。你将要链接到的位置地址输入在\
  \ `地址` 框中。\n\n可以通过右键单击超链接所在的单元格，然后从上下文菜单中选择 `取消超链接` 来移除超链接。\n\n接下来的四个练习将提供关于超链接到网页、文件、当前工作簿中的位置以及新建\
  \ Excel 工作簿的实践。\n\n### 练习 10-1：链接到网页\n\n在本练习中，你将练习超链接到网页。你将使用自动超链接，并了解如何撤销自动超链接。你还会使用词语（而非\
  \ URL 地址）来访问网页。\n\n1. 此时，单元格 `A7` 中应有一个超链接 `教授的办公室网站`。将鼠标光标移动到该超链接上。将会显示屏幕提示 `Microsoft\
  \ Office 及其他培训`。点击该超链接。然后关闭网页。\n2. 右键单击单元格 `A7`。选择 `取消超链接`。\n3. 在 `链接到` 窗格中，选择 `现有文件或网页`。\n\
  4. 在 `要显示的文字` 文本框中输入 `教授的办公室网站`。\n5. 在 `地址:` 框中输入 `www.professoroffice.com`。Excel\
