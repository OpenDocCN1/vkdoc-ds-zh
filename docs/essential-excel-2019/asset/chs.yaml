  \ `Numerical Count`（数值计数）之间的区别在于，`Numerical Count`（数值计数）仅统计包含数值数据的单元格；因此，它排除了包含文本\
  \ `abc` 的单元格的计数。\n\n#### 选择模式\n\n1.  单击单元格 `A2`。按下 `F8` 键。这将使单元格 `A2` 成为起始单元格或锚点单元格。状态栏显示\
  \ `Extend Selection`（扩展选定区域）。\n2.  单击单元格 `B9`。这将高亮显示锚点单元格与所选单元格之间的所有单元格。\n3.  按两次右箭头键。这将使所选区域向右扩展两列。\n\
  4.  按两次下箭头键。这将使所选区域向下扩展两行。\n5.  单击单元格 `F15`。这将使选定区域从锚点扩展到单元格 `F15`。\n6.  使用箭头键将选定区域移回，使得选中区域\
  \ `A2:B9`。\n7.  可以使用 `Shift + F8` 键将其他区域或单个单元格添加到当前选定区域中。按下 `Shift + F8`。状态栏上的文字从\
  \ `Extend Selection`（扩展选定区域）变为 `Add or Remove Selection`（添加或删除选定区域）。\n8.  拖动选择单元格\
  \ `E2:G9`。\n9.  拖动选择单元格 `B13:B16`。\n10. 随机单击单个单元格。它们都将成为选定区域的一部分。\n11. 按下 `Shift\
  \ + F8` 返回正常模式。\n\n#### 单元格模式\n\n1.  单击单元格 `A17`。如果已选择单元格模式，你应该会在状态栏的最左侧看到 `Ready`（就绪）字样。如果没有，请右键单击状态栏并选择\
  \ `Cell Mode`（单元格模式）。\n2.  开始在单元格中键入。文字应从 `Ready`（就绪）变为 `Enter`（输入）。在单元格中输入内容后，按\
  \ `Enter` 键。\n3.  双击单元格 `A17` 进入编辑模式。状态栏上的文字现在应变为 `Edit`（编辑）。你现在可以对单元格 `A17` 中的文本进行任何需要的更改。\n\
  \n#### 大写锁定、数字锁定、滚动锁定\n\n1.  右键单击状态栏，如果 `Caps Lock`（大写锁定）、`Num Lock`（数字锁定）和 `Scroll\
  \ Lock`（滚动锁定）尚未选中，请选中它们。单击一个单元格关闭状态栏菜单。\n\n当这些键开启时，状态栏会显示相应状态。当它们未开启时，不会显示任何内容。这些键通常在键盘上有对应的指示灯，为你提供视觉提示，表明它们是否开启。选择这些选项将为你提供另一个视觉提示。\n\
  \n2.  分别单击这些键，查看它们在状态栏上的显示方式，然后再次单击这些键将其关闭。\n\n#### 改写模式\n\n1.  右键单击状态栏，如果 `Overtype\
  \ Mode`（改写模式）尚未选中，则选择它。\n2.  在单元格 `A10` 和单元格 `A11` 中，将单词 `Excel` 拼写错误，漏掉字母 c（写成\
  \ Exel）。如果你在状态栏上看到 `Overtype`（改写）字样，请单击 `Insert` 键将其关闭。\n3.  双击单元格 `A10` 进入编辑模式。将光标放在字母\
  \ x 和 e 之间。现在键入字母 c。字母 c 应插入，字母 e 和 l 向右移动。按 `Enter` 键。\n4.  双击单元格 `A11` 进入编辑模式。将光标放在字母\
  \ x 和 e 之间。按下 `Insert` 键。你现在应该在状态栏上看到 `Overtype`（改写）。现在键入字母 c。它会改写字母 e。字母 l 不会移动。改写模式会阻止字符的插入。按下\
  \ `Insert` 键。你应该不再看到状态栏上的 `Overtype`（改写）字样。\n5.  键入字母 e 并按 `Enter` 键。\n\n#### 缩放、缩放滑块\n\
  \n1.  将缩放滑块栏向右拖动，以增大工作表中项目的大小。\n2.  将缩放滑块栏向左拖动，以减小工作表中项目的大小。\n3.  多次单击加号。注意每次单击它，尺寸都会增大\
  \ 10%。\n4.  多次单击减号。每次单击它，尺寸都会减小 10%。\n5.  单击功能区的 `View`（视图）选项卡。在 `Zoom`（缩放）组中，单击\
  \ `Zoom`（缩放）按钮。选择 `Custom`（自定义）。在百分比中输入 `147`。单击 `OK`（确定）按钮。\n6.  在 `Zoom`（缩放）组中，单击\
  \ `100%` 按钮。\n7.  选择单元格 `A2:B8`。单击功能区的 `View`（视图）。\n8.  在 `Zoom`（缩放）组中，单击 `Zoom\
  \ to Selection`（缩放到选定区域）按钮。使用 `Zoom to Selection`（缩放到选定区域）可以使所选内容占据窗口的垂直或水平方向的大小，以先达到其极限的方向为准。\n\
  9.  单击缩放滑块的中央，返回到 100% 视图。\n\n\n\n## 摘要\n\n超链接可用于创建指向文件、网页、特定单元格、新文档或电子邮件地址的快速链接。\n\
  \n你可以通过使用连接或快速填充来合并数据。`&`（与号）用于在使用连接时连接不同的数据字符串。快速填充可以自动连接数据，而无需手动输入公式。\n\n用户通常忘记状态栏。这可能是因为除非右键单击，否则这些选项不可见。状态栏是同时查看应用于多个范围的多个函数结果的最快方式。状态栏上显示的结果是临时的；它们不会存储在单元格中。\n\
  \n在下一章中，你将学习复制和粘贴数据的不同方法。你还将了解如何切换行和列标题。你将学习如何使用 Microsoft Office 剪贴板以及如何同时在多个工作表中输入数据。\n\
  \n"
- "# 11. 将数据传输和复制到其他位置\n\n有时你会将数据放入单元格，然后决定将该数据显示在其他位置，或者希望将该数据复制到其他地方。Excel 提供了多种方法来实现此目的，并允许你选择新传输或复制数据的格式。此传输或复制的数据可以复制到其他数据、其他工作表和其他工作簿中的位置。\n\
  \n阅读并完成本章后，你应该能够：\n\n*   使用拖放方法移动和复制单元格\n*   手动复制和粘贴\n*   使用键盘复制和粘贴\n*   将数据复制到其他工作表\n\
  *   将数据从一个工作簿复制到另一个工作簿\n*   使用“选择性粘贴”转置行和列\n*   使用“粘贴”按钮库\n*   使用“选择性粘贴”的“加”和“乘”选项\n\
  *   使用“选择性粘贴”的“跳过空单元格”选项\n*   使用 Microsoft Office 剪贴板\n*   插入已复制或已移动的单元格\n\n## 移动和复制数据\n\
  \n你可以使用 Excel 的“移动”功能（也称为“剪切”功能）来移动数据。**移动**单元格会将一个单元格中的值移动到另一个单元格。移动后，原始单元格位置将为空。接收位置中的任何现有值都将被移动的数据覆盖。\n\
  \n你可能希望相同的数据出现在多个位置。与其重复输入相同的数据，不如使用 Excel 的“复制”功能。**复制**单元格涉及将一个单元格中的值复制到另一个单元格。复制后，该值将同时存在于原始位置和复制到的位置。每当你剪切或复制数据时，该数据的副本都会放置在\
  \ Microsoft Office 剪贴板中。剪贴板与其他 Microsoft Office 产品共享。如果你复制单元格，然后启动 Word 并打开其剪贴板，你将看到你在\
  \ Excel 中复制的单元格。然后，你可以将该单元格数据粘贴到 Word 文档中。\n\n移动单元格可以通过使用拖放或“剪切-粘贴”方法来完成。复制可以通过在按住\
  \ `Ctrl` 键的同时使用拖放或使用“复制-粘贴”方法来完成。\n\n### 使用拖放方法移动和复制单元格\n\n使用拖放方法移动数据时，请按照以下步骤操作：\n\
  \n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig3_HTML.jpg](img/385660_2_En_11_Fig3_HTML.jpg)\n\
  \n图 11-3 移动数据的结果\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig2_HTML.jpg](img/385660_2_En_11_Fig2_HTML.jpg)\n\
  \n图 11-2 拖动数据时，一个与选定区域大小相同的框会随光标移动\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig1_HTML.jpg](img/385660_2_En_11_Fig1_HTML.jpg)\n\
  \n图 11-1 选择要移动的区域\n\n1.  选择要移动的区域。\n2.  将鼠标光标移动到所选区域的某一边上。光标应变为移动箭头，如图 11-1 所示。\n\
  3.  将数据拖到其新位置。拖动数据时，一个与选定区域大小相同的框会随光标移动，以便你随时了解数据将被移动到的位置。见图 11-2。\n4.  释放鼠标按钮。数据被移动到其新位置。应用于单元格的任何格式都会随值一起移动。见图\
  \ 11-3。\n\n使用拖放方法复制数据时，请按照以下步骤操作：\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig6_HTML.jpg](img/385660_2_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6 复制数据的结果\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig5_HTML.jpg](img/385660_2_En_11_Fig5_HTML.jpg)\n\
  \n图 11-5 拖动数据时，一个与选定区域大小相同的框会随光标移动\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig4_HTML.jpg](img/385660_2_En_11_Fig4_HTML.jpg)\n\
  \n图 11-4 选择要复制的区域\n\n1.  选择要复制的区域。\n2.  按住 `Ctrl` 键，并将鼠标光标移动到所选区域的某一边上。光标应变为带有加号的箭头。加号表示你正在复制所选数据。见图\
  \ 11-4。\n3.  保持按住 `Ctrl` 键，并将数据拖到其新位置。拖动数据时，一个与选定区域大小相同的框会随光标移动，以便你随时了解数据将被复制到的位置。见图\
  \ 11-5。\n4.  当框到达目标位置时，释放鼠标按钮。数据被复制到其新位置。应用于单元格的任何格式都会随值一起复制。见图 11-6。\n\n    **注意** 复制单元格时，单元格引用会自动调整，但移动时则不会。你需要手动调整已移动单元格以及指向它们的任何单元格的单元格引用。\n\
  \n### 使用“剪切”和“复制”按钮移动和复制单元格\n\n用于复制和粘贴的按钮位于“开始”选项卡上的“剪贴板”组中。见图 11-7。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig7_HTML.jpg](img/385660_2_En_11_Fig7_HTML.jpg)\n\
  \n图 11-7 功能区的“剪贴板”组\n\n**移动单元格值**\n\n1.  选择要移动的单元格。\n2.  单击“剪切”按钮 ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figa_HTML.jpg](img/385660_2_En_11_Figa_HTML.jpg)。\n\
  3.  选择要移动内容的左上角单元格。单击“粘贴”按钮。\n\n**复制单元格值**\n\n1.  选择要复制的单元格。\n2.  单击“复制”按钮 ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figb_HTML.jpg](img/385660_2_En_11_Figb_HTML.jpg)。\n\
  3.  选择要复制内容的左上角单元格。单击“粘贴”按钮。\n\n除了使用功能区上的“剪切”、“复制”和“粘贴”按钮外，你还可以通过右键单击所选单元格，从上下文菜单中选择它们。\n\
  \n**注意**\n\nExcel 会在已剪切或复制的单元格周围显示一个动画选取框。完成将内容粘贴到新位置后，按 `Esc` 键取消动画选取框。\n\n\n\n\
  ### 使用键盘移动和复制单元格\n\n记住所有键盘快捷键是不可能的，但你应该记住复制、剪切和粘贴的快捷键，因为你会一直用到它们。请参考表 11-1。\n\n\
  **表 11-1** 键盘快捷键\n\n| 功能 | 快捷键 |\n| --- | --- |\n| 剪切 | `Ctrl + X` |\n| 复制 | `Ctrl\
  \ + C` |\n| 粘贴 | `Ctrl + V` |\n\n这些快捷键在大多数其他程序中也同样适用。\n\n**练习 11-1：复制、粘贴和移动内容**\n\
  \n在本练习中，你将通过复制和粘贴来复制单元格内容，然后使用剪切和粘贴移动内容。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig8_HTML.jpg](img/385660_2_En_11_Fig8_HTML.jpg)\n\
  \n**图 11-8** 输入这些数据\n\n1.  新建一个工作簿，命名为 Chapter 11。将工作表命名为“CopyPaste”。\n2.  将图 11-8\
  \ 中的数据输入工作表中。\n\n**复制单元格内容**\n\n1.  选择单元格 `A1:A6`。\n2.  在 **开始** 选项卡上的 **剪贴板** 组中，单击\
  \ **复制** 按钮 ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figc_HTML.jpg](img/385660_2_En_11_Figc_HTML.jpg)，复制单元格\
  \ `A1:A6` 的内容。按 `Ctrl + C` 是 **复制** 命令的快捷键。\n3.  单元格 `A1:A6` 周围会出现一个动态的虚线边框，表示这些单元格正在被复制。\n\
  4.  单击单元格 `C3`。这是内容将要复制到的目标区域的左上角单元格。\n5.  在 **开始** 选项卡上的 **剪贴板** 组中，单击 **粘贴** 按钮的上半部分\
  \ ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figd_HTML.jpg](img/385660_2_En_11_Figd_HTML.jpg)。现在，单元格\
  \ `A1:A6` 中的内容的副本存在于单元格 `C3:C8` 中。\n6.  只要被复制的单元格周围出现动态虚线边框，你就可以继续将它们粘贴到其他位置。单击单元格\
  \ `C5`。这次使用粘贴快捷键 `Ctrl + V`，而不是使用 **粘贴** 按钮。当将内容粘贴到已有内容的单元格时，原始内容会被覆盖。\n7.  按 `Esc`\
  \ 键。动态虚线边框将消失。\n\n**移动单元格内容**\n\n1.  选择单元格 `A1:A6`。\n2.  在 **开始** 选项卡上的 **剪贴板**\
  \ 组中，单击 **剪切** 按钮 ![../images/385660_2_En_11_Chapter/385660_2_En_11_Fige_HTML.jpg](img/385660_2_En_11_Fige_HTML.jpg)\
  \ 以剪切单元格。按 `Ctrl + X` 是 **剪切** 命令的快捷键。\n3.  单击单元格 `E1`。这是内容将要移动到的目标区域的左上角单元格。\n\
  4.  按 `Ctrl + V` 将内容粘贴到新位置。单元格内容已移动到单元格 `E1:E6`。动态虚线边框已消失。\n\n你已经学会了如何使用拖放方法、键盘快捷键以及单击\
  \ **剪切** 和 **复制** 命令按钮来移动和复制单元格数据。这些方法没有提供任何用于指定要粘贴的内容及其格式的选项。如果你希望可以选择粘贴后数据的显示方式，则需要在\
  \ **粘贴** 按钮库中进行选择。点击 **粘贴** 按钮的下半部分即可访问 **粘贴** 按钮库。\n\n### “粘贴”按钮库\n\n**粘贴** 按钮实际上是两个独立的按钮。如果将光标悬停在\
  \ **粘贴** 按钮的上半部分，你将看到如图 11-9 左侧所示的工具提示。如果将光标悬停在 **粘贴** 按钮的下半部分（带有向下箭头的部分），你将看到如图\
  \ 11-9 右侧所示的工具提示。单击 **粘贴** 按钮的下半部分会高亮显示整个按钮，并显示一个粘贴选项库。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig9_HTML.jpg](img/385660_2_En_11_Fig9_HTML.jpg)\n\
  \n**图 11-9** 单击按钮上半部分进行粘贴，或单击按钮下半部分打开 **粘贴** 库\n\n库中的粘贴选项可以执行诸如仅粘贴格式而非数据，或者仅粘贴公式的结果而非公式本身等功能。图\
  \ 11-10 显示了 **粘贴** 库选项。并非所有选项每次都会出现；这取决于你复制的内容。表 11-2 列出了每个粘贴选项及其说明。\n\n**表 11-2**\
  \ **粘贴** 库选项及其说明\n\n\n\n| 按钮 | 名称（含快捷键） | 说明 |\n| --- | --- | --- |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figf_HTML.jpg](img/385660_2_En_11_Figf_HTML.jpg)\
  \ | 粘贴 (P) | 完全按原样粘贴所有内容。保留所有格式、公式等。不调整列宽。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figg_HTML.jpg](img/385660_2_En_11_Figg_HTML.jpg)\
  \ | 公式 (F) | 粘贴除格式之外的所有内容。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figh_HTML.jpg](img/385660_2_En_11_Figh_HTML.jpg)\
  \ | 公式和数字格式 (O) | 粘贴公式和数字格式（如美元符号、逗号、括号内的负数等），但不复制文本格式。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figi_HTML.jpg](img/385660_2_En_11_Figi_HTML.jpg)\
  \ | 保留源格式 (K) | 粘贴所有数据以及*所有*格式。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figj_HTML.jpg](img/385660_2_En_11_Figj_HTML.jpg)\
  \ | 无边框 (B) | 粘贴除应用于所复制单元格的边框之外的所有内容。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figk_HTML.jpg](img/385660_2_En_11_Figk_HTML.jpg)\
  \ | 保留源列宽 (W) | 粘贴所有内容并调整列宽以匹配复制的列宽。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figl_HTML.jpg](img/385660_2_En_11_Figl_HTML.jpg)\
  \ | 转置 | 更改所复制单元格的方向。例如，如果复制的单元格是垂直格式，则会变为水平格式。 |\n| **粘贴数值** |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figm_HTML.jpg](img/385660_2_En_11_Figm_HTML.jpg)\
  \ | 数值 (V) | 仅粘贴数值，不粘贴公式。不粘贴任何格式。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Fign_HTML.jpg](img/385660_2_En_11_Fign_HTML.jpg)\
  \ | 值和数字格式 (A) | 仅粘贴公式的结果，不粘贴公式本身。粘贴任何数字格式，如 `$` 和逗号等，但不粘贴任何文本格式。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figo_HTML.jpg](img/385660_2_En_11_Figo_HTML.jpg)\
  \ | 值和源格式 (E) | 仅粘贴公式的结果，不粘贴公式本身。粘贴应用于原始复制单元格的所有格式。 |\n| **其他粘贴选项** |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figp_HTML.jpg](img/385660_2_En_11_Figp_HTML.jpg)\
  \ | 格式 (R) | 仅粘贴应用于单元格的格式，不粘贴数据本身。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figq_HTML.jpg](img/385660_2_En_11_Figq_HTML.jpg)\
  \ | 粘贴链接 (N) | 创建指向所复制项目的链接。粘贴链接意味着当您更改原始单元格时，粘贴的单元格将始终更新。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figr_HTML.jpg](img/385660_2_En_11_Figr_HTML.jpg)\
  \ | 图片 (U) | 将数据作为图片粘贴，而不是粘贴为单独的数据单元格。粘贴的数据不可编辑。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figs_HTML.jpg](img/385660_2_En_11_Figs_HTML.jpg)\
  \ | 链接的图片 (I) | 粘贴所有内容。您对原始数据或其格式所做的任何更改都会自动更新到粘贴的数据中。 |\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig10_HTML.jpg](img/385660_2_En_11_Fig10_HTML.jpg)\n\
  \n**图 11-10** 粘贴选项\n\n### 练习 11-2：使用粘贴库\n\n在本练习中，您将应用各种粘贴选项来查看它们如何影响数据。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig12_HTML.jpg](img/385660_2_En_11_Fig12_HTML.jpg)\n\
  \n**图 11-12** 自动调整列宽\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig11_HTML.jpg](img/385660_2_En_11_Fig11_HTML.jpg)\n\
  \n**图 11-11** 输入其余数据\n\n1.  选择单元格 `K1` 和 `K2`。对这些单元格应用加粗、倾斜和下划线。\n2.  对单元格 `A5:E5`\
  \ 应用 `自动求和`。\n3.  选择单元格 `A2:E4`。在 `开始` 选项卡的 `数字` 组中，单击 `千位分隔样式` 按钮。\n4.  选择单元格 `A5:E5`。在\
  \ `开始` 选项卡的 `数字` 组中，单击 ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figt_HTML.jpg](img/385660_2_En_11_Figt_HTML.jpg)\
  \ 按钮。\n5.  在 `开始` 选项卡的 `字体` 组中，单击边框的下拉箭头。选择 **上框线和下双框线** 边框。\n6.  选择 A 到 E 列的列标题。双击\
  \ E 列和 F 列标题之间，以自动调整列宽，如图 11-12 所示。\n7.  使用您创建的第 11 章工作簿。创建一个名为“Pasting”的新工作表。\n\
  8.  在单元格 `A1` 中输入 `Jan`。按 `Ctrl + Enter`。\n9.  将 `自动填充句柄` 向右拖动，直到获得 `Jan` 到 `May`\
  \ 的月份。\n10. 选择单元格 `A1:E1`。在 `开始` 选项卡的 `字体` 组中，单击 **增大字号** 按钮三次。将字体颜色更改为红色。将填充颜色更改为（绿色,\
  \ 强调文字颜色 6, 浅色 80%）。将标题加粗并居中。\n11. 输入图 11-11 中的其余数据。\n\n### 查看粘贴选项如何影响复制的数据\n\n\
  ![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig13_HTML.jpg](img/385660_2_En_11_Fig13_HTML.jpg)\n\
  \n**图 11-13** 粘贴了格式但未粘贴单元格内容\n\n**表 11-3** 带示例的粘贴库选项\n\n\n\n| 粘贴选项 | 示例 |\n| ---\
  \ | --- |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figu_HTML.jpg](img/385660_2_En_11_Figu_HTML.jpg)\
  \ 粘贴 | 粘贴所有数据和格式，但不会根据被复制区域调整列宽。这与按下 `Ctrl + V` 效果相同。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figw_HTML.jpg](img/385660_2_En_11_Figw_HTML.jpg)\
  \ 公式 | 粘贴数据和公式。不粘贴任何格式。粘贴区域中原有的格式会影响被复制的单元格（注意单元格 `K1` 和 `K2` 的格式）。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figy_HTML.jpg](img/385660_2_En_11_Figy_HTML.jpg)\
  \ 公式和数字格式 | 仅粘贴公式和数字格式，不粘贴其他格式。粘贴区域中原有的格式会影响被复制的单元格。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figaa_HTML.jpg](img/385660_2_En_11_Figaa_HTML.jpg)\
  \ 保留源格式 | 保留原始数据的外观，但不会调整列宽。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figac_HTML.jpg](img/385660_2_En_11_Figac_HTML.jpg)\
  \ 无边框 | 注意顶部和双底边框未被粘贴。 |\n| ![../images/385660_2_En_11_Chapter/385660_2_En_11_Figae_HTML.jpg](img/385660_2_En_11_Figae_HTML.jpg)\
