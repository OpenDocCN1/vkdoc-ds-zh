  \ 获取帮助\n\nExcel 在程序中为用户提供帮助。屏幕提示和**告诉我你想要做什么**功能可以在您处理工作表时解答有关格式设置和数据输入的问题。**智能查找**允许您搜索单元格内容。Excel\
  \ 功能区上的选项卡之一是**帮助**选项卡，其中包含其他帮助功能。\n\n### 屏幕提示\n\n屏幕提示是快速获取关于功能区命令和屏幕上某些其他对象信息片段的一种方式。只需将光标移到对象上即可查看屏幕提示。屏幕提示会显示对象的名称及其功能。某些屏幕提示还提供图形说明来阐释命令的功能。图\
  \ 1-29 显示了位于**开始**选项卡下的**对齐方式**组中的**合并后居中**按钮的屏幕提示。如果您想要更多信息，可以单击**告诉我更多**链接。\n\n\
  ![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig29_HTML.jpg](img/385660_2_En_1_Fig29_HTML.jpg)\n\
  \n图 1-29\n\n**合并后居中**按钮的屏幕提示\n\n\n\n### Excel 的“告诉我你想要做什么”功能\n\n此功能是 Office 2016\
  \ 新增的。在 Word 和 PowerPoint 中也能找到它。它位于功能区选项卡区域。单击该文本框时，会显示你最近的操作请求。你可以选择其中一个请求，也可以开始在文本框中输入。Excel\
  \ 会根据你已输入的字符显示可用的功能。\n\n假设我需要帮助创建图表。我首先在文本框中输入一个 `C`。你可能在想，为什么图 1-30 中的列表显示的项目并不都是以\
  \ `C` 开头的？原因是 `数学与三角函数`、`其他` 和 `财务` 是公式组，其中有些公式以 `C` 开头。`从模板新建` 出现是因为某些模板以 `C` 开头。我可以输入更多文本来精炼列表中显示的内容。\n\
