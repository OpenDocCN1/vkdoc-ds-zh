  \n### 固定宽度文本文件\n\n在固定宽度文本文件中，每个字段占据相同的空间。通常不会使用表头，因为表头很难与数据列对齐。\n\n```\nA3251 05\
  \ Carson         Annette F\nA3291 04 Sterk          Carrie  M\nA1450 04 Uhrhammer\
  \      Dorothy L\nA1425 05 Carson         Dick    J\n```\n\n练习 14-2：导入固定宽度文本文件\n\
