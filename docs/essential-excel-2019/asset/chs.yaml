  \n你刚刚使用了 Excel 的自动更正功能来纠正拼写错误的单词，并为输入单词或短语创建了快速快捷方式。接下来，你将使用自动完成功能来复制列中已存在的数据。\n\
  \n### 使用自动完成输入数据\n\n自动完成功能是自动设置的；没有需要点击的按钮或需要输入的命令。自动完成功能会把你正在输入的条目与同一列中已有的条目进行比较。当你输入时，Excel\
  \ 会查找与你正在输入的单词以相同字母开头的单词。如果它在列中找到一个已有的单词，其开头字母与你已输入的字母相同，它就会将该单词放入活动单元格中。见图 3-27。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig27_HTML.jpg](img/385660_2_En_3_Fig27_HTML.jpg)\n\
  \n图 3-27\n\n在你输入字母`sma`后，自动完成自动添加了字母`rt`\n\n前两个字母对于列中的所有单词都是相同的。当你在单词`smart`的第二个条目中输入字母`a`时，Excel\
  \ 发现只有一个单词以`sma`开头，因此它将单词`smart`放入单元格中。你可以按`Enter`键、`Tab`键或向下箭头键接受该单词，或者按`Esc`键清除该单元格。\n\
  \n只有在图 3-28 中的单词`savant`中键入第二个`a`之后，才有一个单词与迄今为止输入的所有字母匹配。你可以按`Enter`键、`Tab`键或向下箭头键接受该单词，或者按`Esc`键清除该单元格。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig28_HTML.jpg](img/385660_2_En_3_Fig28_HTML.jpg)\n\
  \n图 3-28\n\n在你输入`sava`后，自动完成自动添加了字母`nt`\n\n注意\n\n如果当前单元格上方有一个空单元格，自动完成功能将不起作用。\n\
  \n### 从下拉列表中选择\n\n**从下拉列表中选择**功能与自动完成功能类似。从下拉列表中选择功能与自动完成功能一样，允许你使用列中已有的条目。从下拉列表中选择功能允许你从自动排序的现有条目列表中进行选择。可以通过右键单击单元格并选择**从下拉列表中选择**或按`Alt\
  \ + Down Arrow`来访问该列表。见图 3-29。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig29_HTML.jpg](img/385660_2_En_3_Fig29_HTML.jpg)\n\
  \n图 3-29\n\n从下拉列表中选择\n\n注意\n\n如果当前单元格上方有一个空单元格，从下拉列表中选择功能将不起作用。\n\n练习 3-7：自动完成与从下拉列表中选择\n\
  \n让我们使用自动完成和从下拉列表中选择功能来添加文本。\n\n**自动完成**\n\n让我们在本练习中看看自动完成的实际效果。如果你已关闭上一次练习中的第 3\
  \ 章工作簿，请重新打开它。\n\n1.  在单元格`A6`中输入字母`C`。单元格中出现名称`Carl`，因为没有其他以`C`开头的名称。\n2.  在单元格`A7`中输入`Da`。由于该列中有两个以`D`开头的名称，此时\
  \ Excel 无法找到唯一的那个。在`Da`之后输入`v`。只有`Dav`开头的名称是唯一的，因此 Excel 会在单元格中输入`David`。按`Enter`键。\n\
  3.  在单元格`A8`中输入`Mar`。由于该列中有两个以`Mar`开头的名称，此时 Excel 无法找到唯一的那个。在`Mar`之后输入`t`。只有`Mart`开头的名称是唯一的，因此\
  \ Excel 会在单元格中输入`Marten`。\n\n1.  添加另一个工作表，并将其命名为`AutoComplete`。\n2.  如图 3-30 所示，在列`A`中输入名称。\n\
  \n    ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig30_HTML.jpg](img/385660_2_En_3_Fig30_HTML.jpg)\n\
  \n    图 3-30\n\n    在工作表中输入名称\n\n**从下拉列表中选择**\n\n在本练习中，你将使用从下拉列表中选择功能。\n\n1.  点击`David`。按`Enter`键。\n\
  2.  按`Alt + Down Arrow`。选择`Marten`。按`Enter`键。\n3.  点击快速访问工具栏上的`Save`按钮 ![../images/385660_2_En_3_Chapter/385660_2_En_3_Figi_HTML.jpg](img/385660_2_En_3_Figi_HTML.jpg)。\n\
  \n1.  右键单击单元格`A9`，然后从菜单中选择**从下拉列表中选择**。\n   请注意，你的条目会按字母顺序显示，并且不会显示重复项。见图 3-31。\n\
  \n    ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig31_HTML.jpg](img/385660_2_En_3_Fig31_HTML.jpg)\n\
  \n    图 3-31\n\n    条目按字母顺序排列，没有重复的名称\n\n自动完成功能和从下拉列表中选择功能都提供了一种在列中快速创建重复数据的方法。自动完成功能在你输入时会自动提供建议供你选择。从下拉列表中选择功能会显示当前列中迄今为止输入的所有条目，然后让你从中选择一个进行复制。接下来，你将了解自动填充功能如何不仅允许你复制数据，还能创建重复的数据模式。\n\
  \n### 自动填充\n\n自动填充功能允许你自动填充遵循某种模式或基于其他单元格中数据的单元格。它也可以用于创建重复的单元格、输入一系列值以及创建自定义列表。\n\
  \n\n\n### 使用自动填充创建重复单元格\n\n您可以通过向所需方向拖拽`自动填充柄`，将一个单元格中的值复制到其他单元格。`自动填充柄`是活动单元格右下角的一个黑色小方块（图\
  \ 3-32）。将光标移到`自动填充柄`上时，光标会变为加号形状（图 3-33）。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig33_HTML.jpg](img/385660_2_En_3_Fig33_HTML.jpg)\n\
  \n图 3-33\n\n光标移动到`自动填充柄`上时变为加号\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig32_HTML.jpg](img/385660_2_En_3_Fig32_HTML.jpg)\n\
  \n图 3-32\n\n`自动填充柄`\n\n当您将`自动填充柄`拖过其他单元格时，会显示一个`工具提示`，指明松开鼠标按钮后将在该单元格中填入的值（图 3-34）。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig34_HTML.jpg](img/385660_2_En_3_Fig34_HTML.jpg)\n\
  \n图 3-34\n\n`工具提示`\n\n图 3-35 显示了将`自动填充柄`从 `A1` 拖拽到 `D1` 的结果。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig35_HTML.jpg](img/385660_2_En_3_Fig35_HTML.jpg)\n\
  \n图 3-35\n\n拖拽`自动填充柄`的结果\n\n您可以随心所欲地将`自动填充柄`拖过任意数量的单元格，也可以朝任意方向拖拽。图 3-36 显示了向上拖拽`自动填充柄`的结果。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig36_HTML.jpg](img/385660_2_En_3_Fig36_HTML.jpg)\n\
  \n图 3-36\n\n向上拖拽`自动填充柄`的结果\n\n### 使用自动填充输入序列值\n\n`自动填充`除了能够复制单元格值，还可以用来创建重复的数据列表序列。Excel\
  \ 内置了与星期、月份、年份、数字等相关的数据序列。例如，您可以在一个单元格中输入`星期一`，然后使用`自动填充柄`在相邻单元格中自动输入一周中的其他日期。在拖拽`自动填充柄`时，Excel\
  \ 会显示拖拽完成后将在该单元格中填入的内容（见图 3-37）。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig37_HTML.jpg](img/385660_2_En_3_Fig37_HTML.jpg)\n\
  \n图 3-37\n\n当您使用`自动填充柄`拖过单元格时，Excel 会显示它将在此单元格中填入的内容\n\n您从星期几开始输入都没有关系。如果您拖过的单元格超过七个，日期将开始重复。您也可以使用三个字符的星期缩写。\n\
  \n如图 3-38 所示拖过单元格，将得到图 3-39 所示的序列。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig39_HTML.jpg](img/385660_2_En_3_Fig39_HTML.jpg)\n\
  \n图 3-39\n\n以`星期五`开头拖拽`自动填充柄`的结果\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig38_HTML.jpg](img/385660_2_En_3_Fig38_HTML.jpg)\n\
  \n图 3-38\n\n在星期几上使用`自动填充柄`，它将每七个单元格重复一次该日期\n\nExcel 知道一年有四个季度。如果您输入`第一季度`，然后使用`自动填充柄`创建序列，Excel\
  \ 会从`第一季度`到`第四季度`，然后以`第一季度`开始重复该模式。见图 3-40。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig40_HTML.jpg](img/385660_2_En_3_Fig40_HTML.jpg)\n\
  \n图 3-40\n\n以`第一季度`开头的序列\n\n您也可以使用`Qtr`作为`Quarter`的缩写。\n\n如果单元格中包含一个单词后跟一个数字，Excel\
  \ 会在序列中的每个单元格将该数字递增 1。见图 3-41。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig41_HTML.jpg](img/385660_2_En_3_Fig41_HTML.jpg)\n\
  \n图 3-41\n\n以`第 2 节`开头的序列\n\n### 教 Excel 创建自动填充模式\n\n您可以教 Excel 一个模式。如果您想显示每隔三个的数字，可以在一个单元格中输入值\
  \ `1`，在下一个单元格中输入 `4`。然后选中这两个单元格，使用`自动填充柄`拖过您希望包含在该模式中的尽可能多的单元格。这将产生一个 `1`、`4`、`7`、`10`\
  \ 等模式。\n\n如果您想显示一个以 15 分钟为间隔的相邻单元格序列，请选择前两个单元格来教给它这个模式（图 3-42），然后拖拽`自动填充柄`到您希望包含在模式中的单元格数量。拖拽完成后，结果将如图\
  \ 3-43 所示。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig43_HTML.jpg](img/385660_2_En_3_Fig43_HTML.jpg)\n\
  \n图 3-43\n\n使用两个相邻时间拖拽`自动填充柄`的结果\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig42_HTML.jpg](img/385660_2_En_3_Fig42_HTML.jpg)\n\
  \n图 3-42\n\n选择两个相邻单元格来教 Excel 一个`自动填充`模式\n\n#### 使用自动填充选项按钮\n\n当您使用完`自动填充柄`来复制单元格或创建序列后，一个`自动填充选项`按钮会出现在最后选中单元格的右下方。\n\
  \n如果您使用`自动填充柄`复制了包含字母数据的单元格，单击`自动填充选项`按钮会弹出三个或更多选项。\n\n以水平格式复制字母数据时，单击`自动填充选项`按钮会弹出三个选项。默认选项是`复制单元格`。见图\
  \ 3-44。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig44_HTML.jpg](img/385660_2_En_3_Fig44_HTML.jpg)\n\
  \n图 3-44\n\n`自动填充选项`按钮提供的可用选项\n\n以垂直格式复制字母数据时，单击`自动填充选项`按钮会弹出四个选项。默认选项是`复制单元格`。见图\
  \ 3-45。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig45_HTML.jpg](img/385660_2_En_3_Fig45_HTML.jpg)\n\
  \n图 3-45\n\n垂直复制数据时的`自动填充`选项\n\n如果您使用`自动填充柄`复制了数字数据，单击`自动填充选项`按钮会弹出四个或更多选项。见图 3-46。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig46_HTML.jpg](img/385660_2_En_3_Fig46_HTML.jpg)\n\
  \n图 3-46\n\n复制数字数据时的`自动填充`选项\n\n如果您使用`自动填充柄`复制了`日期`数据，单击`自动填充选项`按钮会弹出许多选项。见图 3-47。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig47_HTML.jpg](img/385660_2_En_3_Fig47_HTML.jpg)\n\
  \n图 3-47\n\n复制日期数据时的`自动填充`选项\n\n选择`复制单元格`选项会将您刚刚创建的序列恢复为用于创建序列的原始单元格的副本。十个单元格都将包含\
  \ `2012/10/28`。\n\n`仅填充格式`选项仅会将您应用于原始单元格的任何格式复制到您使用`自动填充柄`拖过的单元格中。它不会向单元格中放置任何数据。\n\
  \n`不带格式填充`选项会从原始单元格复制数据或创建序列，但不会将原始单元格中的任何格式应用于您使用`自动填充柄`创建的数据。\n\n下一个练习，练习 3-8，将说明`自动填充选项`。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，对给定的英文文本进行翻译。\n\n\n### 创建自动填充自定义列表\n\n\
  除了使用 Excel 的内置数据序列，你还可以创建自己的序列。如果你发现自己经常输入相同的值序列，那么你应该创建自己的数据序列来加快输入速度。可以在`自定义列表`对话框创建数据序列，通过单击功能区上的`文件`选项卡、在左窗格中选择`选项`、在左窗格中选择`高级`、向右滚动右窗格直到看到`常规`部分，然后单击`编辑自定义列表`按钮即可访问该对话框。请参见图\
  \ 3-48。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig48_HTML.jpg](img/385660_2_En_3_Fig48_HTML.jpg)\n\
  \n**图 3-48** 在`自定义列表`对话框中创建你自己的自定义列表\n\n在`列表条目`框中输入新的数据序列。然后单击`添加`将数据序列添加到`自定义列表`框中。你也可以通过在工作表上选择单元格并单击`自定义列表`对话框中的`导入`来创建新的自定义列表。\n\
  \n### 练习 3-8：练习使用自动填充柄和自动填充选项按钮\n\n在本练习中，你将练习使用自动填充技术。如果上次练习后你关闭了第 3 章的工作簿，请重新打开它。\n\
