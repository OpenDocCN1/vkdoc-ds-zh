  \ `I5` 中输入公式 `=Min(E4:E9)`。\n\n10.  选中单元格区域 `B12:D12`。按住 `Ctrl` 键并选中单元格 `I3`。在功能区“开始”选项卡的“数字”组中，单击“数字格式”的下拉箭头，然后选择“数字”。我们选择“数字”格式是为了让平均值显示两位小数。\n\
  \n您的电子表格现在应如图 11-47 所示。\n\n1.  选中单元格区域 `B3:E3`。将文本加粗。在“对齐方式”组中选择“居中”按钮。\n\n2.  选中单元格区域\
  \ `B10:D10`。按住 `Ctrl` 键，同时拖动鼠标选中单元格 `E4` 到 `E9`。应用最浅的绿色背景色。\n\n3.  为单元格 `E10` 应用粗的外边框。应用第二浅的绿色背景色。\n\
