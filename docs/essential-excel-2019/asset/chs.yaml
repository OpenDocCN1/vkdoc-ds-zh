  \ 13-55。\n\n您已学习了如何在单个组合图中组合两种图表类型。接下来，您将学习如何创建两种新的层次结构图表：树状图（Treemap）和旭日图（Sunburst）。\n\
  \n## 层次结构图\n\n有时您会希望展示数据之间的层次结构关系。在本节中，我们将介绍两种常见的层次结构图类型：树状图（Treemap）和旭日图（Sunburst）。\n\
  \n\n\n### 树状图\n\n树状图用于表示分层数据。该图表由矩形组成，矩形的大小表示与标签关联的值。图 13-59 展示了一个树状图示例。\n\n**练习\
  \ 13-5：创建树状图**\n\n在本练习中，您将使用图 13-58 中的数据创建一个树状图。由于电子表格中的最大值为 1000，该数据项将由最大的矩形表示。代表产品的矩形将按州进行组织。\n\
