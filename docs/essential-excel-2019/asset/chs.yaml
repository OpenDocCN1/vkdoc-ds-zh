  \n图 13-37\n\n您的饼图现在应如下所示\n\n\n\n### 饼图中的复合饼图子类型\n\n`饼图中的复合饼图`会取饼图中的一个扇区，然后将该扇区分解为另一个饼图。这样做的一个原因是，你的饼图包含太多项目，其中一些扇区太小，难以辨认。另一个原因可能是，某个扇区代表一个你想进一步细分的类别。\n\
  \n安妮特经营一家汤品与三明治店。她希望查看饮料类别的细分情况，了解顾客本月购买了哪些类型的饮料。这可以通过将饮料类别的扇区从饼图中分离出来实现，这种操作称为**分离饼图**。你可以分离整个饼图，也可以分离单个扇区。\n\
  \n**练习 13-3：创建饼图子类型**\n\n在此练习中，你将为一家三明治店创建饼图，以展示三明治、汤品、冰淇淋和饮料各自所占的销售百分比。该店还希望查看饮料销售的细分情况，了解百事可乐、可口可乐、七喜和雪碧各自的销售百分比。你将创建一个`饼图中的复合饼图`来显示不同类型饮料的数据，然后用`饼图中的复合条形图`来呈现相同的饮料数据。\n\
