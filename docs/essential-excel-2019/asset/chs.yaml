  \  单击“数据范围”文本框右侧的“折叠对话框”按钮。参见图 13-109。\n\n## 章节总结\n\n图表提供了一种快速查看大量数据的方式。它们使您能够轻松检查是否实现了目标并发现问题。使用哪种图表取决于您要表示的数据。您已经看到，柱形图和条形图可用于许多行的数值数据，而饼图仅表示一行数值数据。树状图和旭日图非常适合表示分层数据。迷你图存储在单个单元格中，并表示一行数据。如果使用迷你图，则需要使单元格足够大，以便可以轻松查看图表显示的内容。\n\
  \n饼图以饼图切片表示数据。饼图切片代表整个饼图的百分比。树状图使用矩形表示值，而旭日图使用饼图块表示值。迷你图可以使用三种图表类型之一：折线图、柱形图或盈亏图。饼图切片可以细分为另一个饼图或条形图，以便您可以查看用于创建它的所有项目。\n\
  \n组合图将两个图表合并为一个。它通常由一个系列的条形图和另一个系列的折线图组成。\n\n必应地图和地图图表允许您绘制与地理区域相关的数据图表。\n\n创建二维簇状条形图最快的方法是使用以下快捷键：\n\
  \n*   如果要让图表显示在与数据相同的工作表上，请按`Alt + F1`键。\n*   如果希望图表出现在单独的工作表上，请按`F11`键。\n\n下一章将详细介绍如何从各种源导入数据。\n\
  \n"
- "# 14. 导入数据\n\nExcel 是首屈一指的分析工具。这就是将数据从其他源导入 Excel 的原因。对于 Excel 2019，Microsoft 增加了更多导入数据的源和方式。\n\
  \n阅读并完成本章后，您应该能够：\n\n*   导入分隔文本文件和固定宽度文本文件\n*   从 Access 数据库导入数据\n*   从网页按原样导入数据，并在导入前对其进行修改和转换\n\
  *   在工作簿和数据源之间创建连接\n\n## 将数据导入 Excel\n\n用于导入和转换数据的按钮位于功能区的“数据”选项卡上。Excel 2016 有一个用于获取外部数据的组和另一个用于转换数据的组。Excel\
  \ 2019 已将这些组合成一个名为“获取和转换数据”的组。参见图 14-1。Excel 增加了更多您可以访问数据的数据库类型。他们还扩展了您可以下载的数据源和文件类型的数量。\n\
  \n![../images/385660_2_En_14_Chapter/385660_2_En_14_Fig1_HTML.jpg](img/385660_2_En_14_Fig1_HTML.jpg)\n\
  \n图 14-1：“获取和转换数据”组\n\nExcel 可以从各种源导入数据。“获取和转换数据”组中的按钮允许您从文本文件、Access 数据库、Web、XML\
  \ 文件、SQL 服务器等导入数据。它甚至可以使用`ODBC`（开放式数据库连接）驱动程序或`OLEDB`（对象链接嵌入）驱动程序连接到其他程序。不同的文件类型在\
  \ Excel 中的功能并不相同。某些选项适用于某些数据类型，但不适用于其他类型。\n\n## 导入文本文件\n\n文本文件不包含任何格式。这使得不同程序可以轻松交换文本文件数据。文本文件有两种类型：分隔文本文件和固定宽度文本文件。文件中的数据通常被划分成字段。分隔文件具有可变长度的字段。固定宽度字段中的所有值都具有相同的长度。使用空格使文本字段的长度相同；数值字段可以用零填充以使它们长度相同。\n\
  \n\n\n### 分隔符文本文件\n\n文本文件中的字段通常用逗号分隔，但也可以用制表符、空格或任何其他字符分隔。用于分隔字段的字符称为分隔符。字段由逗号分隔的文本文件称为逗号分隔文本文件。大多数文本文件的扩展名为\
  \ `.txt`。Excel 电子表格可以保存为扩展名为 `.csv` 的文本文件。该扩展名代表“逗号分隔值”。\n\n以下是一个逗号分隔文件的内容。该文件的第一行包含标题。并非所有文本文件都包含标题行。\n\
  \n```\nEmployeeID,DeptID,LastName,FirstName,MidInitial\nA3251,05,Carson,Annette,F\n\
  A3291,04,Sterk,Carrie,M\nA1450,04,Uhrhammer,Dorothy,L\nA1425,05,Carson,Dick,J\n\
  ```\n\n### 练习 14-1：导入逗号分隔的文本文件\n\n在本练习中，您将把数据从分隔符文本文件导入到工作表中。您将创建两个到该文本文件的连接。一个连接会在文件打开时，自动用文本文件中的任何更新数据刷新工作表，而另一个连接则不会。您还将学习仅导入您希望导入的数据。\n\
  \n1.  现在，您可以通过单击 **加载** 按钮将数据直接加载到新工作表中，或者可以单击 **加载** 按钮的下拉箭头，然后选择 `加载到`，这将调出如图\
  \ 14-3 所示的 **导入数据** 对话框。单击 **加载** 按钮的下拉箭头，然后选择 `加载到`。\n\n    ![../images/385660_2_En_14_Chapter/385660_2_En_14_Fig3_HTML.jpg](img/385660_2_En_14_Fig3_HTML.jpg)\n\
  \n    **图 14-3** 导入数据对话框\n\n2.  创建一个新的空白工作簿。单击功能区上的 **文件** 选项卡。单击 **另存为**。将工作簿命名为\
  \ `ImportingData`。返回工作表。\n\n3.  单击功能区上的 **数据** 选项卡。在 **获取和转换数据** 组中，单击 `自文本/CSV`。\n\
  \n4.  这将调出 **导入数据** 窗口，您可以在其中浏览直到找到所需文件。找到并选择 `Employee.txt` 文件。单击 **导入** 按钮。\n\n\
  5.  这将调出如图 14-2 所示的对话框。您可以通过单击 **分隔符** 文本框并选择一种分隔符来选取分隔符，也可以选择 **自定义** 或 **固定宽度**。为分隔符选择\
  \ **逗号**。\n\n    **注意** 有一个用于固定宽度的分隔符选项。但目前这对固定宽度文本文件无效。如果您尝试加载固定宽度文本文件，则不会显示分隔符文本框。您将在下一个练习中学习如何导入固定宽度文本文件。\n\
  \n    ![../images/385660_2_En_14_Chapter/385660_2_En_14_Fig2_HTML.jpg](img/385660_2_En_14_Fig2_HTML.jpg)\n\
  \n    **图 14-2** 导入数据对话框\n\n**导入数据** 对话框提供了一些选项，允许您将文本加载到您选择的工作表或新工作表中。与 Excel 2016\
  \ 不同的是，您还可以将文本文件加载到数据透视表或数据透视图中。我们将在下一章讨论数据透视表和数据透视图。您可以将文件添加到数据模型。数据模型用于集成来自多个表的数据。\n\
  \n单击 `现有工作表` 的 **选项** 按钮。单击单元格 `A1`。单击 **确定** 按钮。文本文件中的数据将加载到当前工作表的一个表格中。参见图 14-4。\n\
