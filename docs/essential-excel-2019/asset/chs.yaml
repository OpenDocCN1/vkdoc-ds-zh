  \n\n\n## 使用状态栏\n\nExcel 窗口底部的状态栏可用于显示大量有用的信息。您无需输入任何公式，即可查看不同区域的计算结果。状态栏上显示的内容由您决定。右键单击状态栏会显示所有可用的选项，如图\
  \ 10-29 所示。您只需选择想要看到的选项，并取消选择不想看到的选项。选中的项目左侧会显示复选标记。单击带有复选标记的行上的任意位置将移除该复选标记。单击没有复选标记的行上的任意位置则会添加上复选标记。\n\
  \n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig29_HTML.jpg](img/385660_2_En_10_Fig29_HTML.jpg)\n\
  \n图 10-29\n\n状态栏上的可用选项\n\n在本节中，我们将介绍大部分选项。我们将省略**签名**、**信息管理策略**和**权限**，因为这些选项仅在处理\
  \ SharePoint 时使用。\n\n#### 单元格模式\n\n单元格模式显示在状态栏的最左侧位置。它会显示以下三个词之一：`Ready`、`Enter`\
  \ 或 `Edit`。`Ready` 表示单元格已准备好供您输入数据。如果您正在向单元格中输入数据，则会显示 `Enter` 一词。如果您双击某个单元格使其进入编辑模式，则会显示\
  \ `Edit` 一词。\n\n### 快速填充空白单元格和快速填充更改的单元格\n\n如果开启了这些选项，每当您执行快速填充时，状态栏将显示空白单元格的数量以及快速填充更改的单元格数量。\n\
  \n使用图 10-30 中的数据，如果您在单元格 `D1` 中键入 `Rhianna Slager` 以向 Excel 展示模式，然后选中单元格区域 `D1:D4`，并按\
  \ `Ctrl + e` 启动快速填充，将出现一个空白单元格，并且两个单元格的内容会被更改，这将在状态栏上显示为 ![../images/385660_2_En_10_Chapter/385660_2_En_10_Figa_HTML.jpg](img/385660_2_En_10_Figa_HTML.jpg)\n\
  \n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig30_HTML.jpg](img/385660_2_En_10_Fig30_HTML.jpg)\n\
  \n图 10-30\n\n输入的原始数据\n\n生成的电子表格将如图 10-31 所示。\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig31_HTML.jpg](img/385660_2_En_10_Fig31_HTML.jpg)\n\
  \n图 10-31\n\n使用快速填充的结果\n\n### 大写锁定、数字锁定\n\n如果开启了**大写锁定**或**数字锁定**，则会显示对应的文字 `Caps\
  \ Lock` 或 `Num Lock`。\n\n### 滚动锁定\n\n如果开启了滚动锁定，则会显示 `Scroll Lock` 文字。当您想要滚动工作表但又想跟踪当前位置时，滚动锁定非常有用。当滚动锁定开启时，使用箭头键会按箭头方向移动工作表，但活动单元格不会改变。\n\
  \n### 固定小数位\n\n这表示固定小数位模式是否开启。可以通过依次点击“文件” ➤ “选项” ➤ “高级”，然后在 `自动插入小数点` 前面勾选，来开启固定小数位模式。您可以设置小数位数。固定小数位模式会自动为您输入小数。如果您将小数位数设置为\
  \ 2 并键入 `2375`，Excel 会将其更改为 `23.75`。如果您键入 `3`，它将被更改为 `0.03`。\n\n#### 改写模式\n\n按下\
  \ Insert 键会开启改写模式。如果开启了改写模式并且您正在编辑单元格中的数据，您键入的字符将替换现有字符；否则，当您插入新字符时，现有字符会移动。再次按\
  \ Insert 键可关闭改写模式。\n\n### 结束模式\n\n当已按下 End 键时，会显示此模式。End 键用作与某个箭头键组合使用的双键组合的一部分。\n\
  \n### 宏录制\n\n当正在录制宏时，宏录制功能会在状态栏上显示按钮 ![../images/385660_2_En_10_Chapter/385660_2_En_10_Figb_HTML.jpg](img/385660_2_En_10_Figb_HTML.jpg)。单击该按钮将停止录制。宏在第\
  \ 19 章中解释。\n\n### 辅助功能检查器\n\n辅助功能检查器会在您创建文档时检查文档，并提供如何使文档更易于视障人士访问的信息。\n\n#### 选择模式\n\
  \n选择模式用于使用箭头键选择单元格，而不是用鼠标拖拽选择。\n\n### 页码\n\n页码显示当前页码和总页数。页码仅在页面布局视图中显示。\n\n### 平均值、计数、数值计数、最小值、最大值、求和\n\
  \n这些选项会立即显示对您所选单元格执行计算的结果。所选单元格不必相邻。这些数学函数被称为聚合函数。聚合函数对一组值执行计算并返回单个值。\n\n### 视图快捷方式\n\
  \n这三个按钮 ![../images/385660_2_En_10_Chapter/385660_2_En_10_Figc_HTML.jpg](img/385660_2_En_10_Figc_HTML.jpg)\
  \ 出现在任务栏的右侧。它们控制工作表的查看方式。按顺序分别是：普通视图、页面布局视图和分页预览。\n\n\n\n#### 缩放与缩放滑块\n\n`Zoom`\
  \ 选项显示当前的缩放百分比。`Zoom Slider`（缩放滑块）则控制缩放的量。\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Figd_HTML.jpg](img/385660_2_En_10_Figd_HTML.jpg)\n\
  \n缩放工具位于 Excel 窗口右下角的状态栏上。你可以将缩放工具的滑块向右拖动以放大对象（使其变大），或者向左拖动以缩小对象（使其变小）。缩放范围从 10%\
  \ 到 400%。这不仅是开发工作表时的绝佳工具，也是一个出色的演示工具。\n\n除了拖动滑块来改变缩放比例，你还可以执行以下操作：\n\n*   点击滑轨上的任意位置，滑块就会移动到该位置。\n\
  *   每次单击“缩小”按钮 ![../images/385660_2_En_10_Chapter/385660_2_En_10_Fige_HTML.jpg](img/385660_2_En_10_Fige_HTML.jpg)，对象尺寸将减小\
  \ 10%。\n*   每次单击“放大”按钮 ![../images/385660_2_En_10_Chapter/385660_2_En_10_Figf_HTML.jpg](img/385660_2_En_10_Figf_HTML.jpg)，对象尺寸将增大\
  \ 10%。\n\n**注意**\n\n更改缩放比例只会影响你的工作表，不会改变功能区的大小。\n\n### 练习 10-8：使用状态栏\n\n本练习涵盖了状态栏的各项选项。\n\
