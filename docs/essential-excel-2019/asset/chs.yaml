  \n图 14-21\n已导入的数据\n\n你已经学会了如何导入文本文件。接下来，你将学习如何从 Access 数据库中导入数据。\n\n## 从 Access\
  \ 数据库导入数据\n\nMicrosoft Access 是 Microsoft Office 套件的一部分。一个 Access 数据库可以包含多个相互关联的表和查询。一个查询包含你从表中请求的特定字段，并且其包含的记录受限于你设置的所有筛选条件。你可以导入在\
  \ Access 中创建的表格和查询中的数据。\n\n练习 14-3：从 Access 数据库导入数据\n\n在本练习中，你将从一个名为 `Customers`\
  \ 的 Access 数据库中，导入名为 `tblCustomer` 的表中的数据。\n\n![../images/385660_2_En_14_Chapter/385660_2_En_14_Fig25_HTML.jpg](img/385660_2_En_14_Fig25_HTML.jpg)\n\
  \n图 14-25\n数据已导入到表中\n\n1. 在“导入数据”对话框中，你需要指定数据的查看方式以及在工作簿中的放置位置。点击“现有工作表”单选按钮，并点击单元格\
  \ `A2`，如图 14-24 所示。然后点击“确定”按钮。\n\n   ![../images/385660_2_En_14_Chapter/385660_2_En_14_Fig24_HTML.jpg](img/385660_2_En_14_Fig24_HTML.jpg)\n\
  \n   图 14-24\n   选择数据查看方式及放置位置\n\n   你选择的数据将被放置在工作簿的一个表格中，如图 14-25 所示。如果你在 Access\
  \ 中更改了数据后想要更新 Excel 工作簿中已导入的数据，可以在表格中任意位置右键单击，然后选择“刷新”。\n\n2. `Customers` Access\
  \ 数据库包含两个表：`tblCustomer` 和 `tblOrderinfo`。它还包含一个名为 `qryCustomerbyState` 的查询，如图 14-23\
  \ 所示。在“导航器”对话框中点击名为 `tblCustomer` 的表。该表会显示在右侧窗格中。如果要导入多个表或查询，你需要勾选“选择多项”。\n\n  \
