  \ 工作簿中的不同位置等。如果你希望用户从其他位置获取信息，请使用超链接。这可以节省用户大量查找信息的时间。接下来，你将了解如何合并不同单元格中的数据（例如，将名字、中间名和姓氏合并到一列中）。\n\
  \n\n\n## 连接与快速填充\n\n将多个单元格的数据或单元格数据与附加文本合并到单个文本项中，称为*连接*。用于执行连接操作的符号是 `&`（与符号）。必须在每个单元格地址以及要添加的每个额外文本字符串之间放置一个与符号。\n\
  \n例如，如果你想要合并单元格 `A1` 和 `B1` 的内容，并将结果放入单元格 `C1`，则需要在单元格 `C1` 中输入以下公式：`=A1&B1`。如果你想要在单元格\
  \ `A1` 和 `B1` 的数据之间添加一个空格，则需要将公式改为 `=A1&\" \"&B1`。两个引号之间的空格即创建一个空白空间。如果你想要在两个数据之间添加两个空格，则需在两个引号之间放置两个空格。\n\
  \n图 10-13 显示了一个从单元格 `A8` 开始的连接示例，它包含了来自列 `A`、`B` 和 `C` 的内容以及附加文本。在单元格 `A8` 中输入的公式为：\n\
  \n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig13_HTML.jpg](img/385660_2_En_10_Fig13_HTML.jpg)\n\
  \n**图 10-13** – 合并来自列 `A`、`B` 和 `C` 的数据\n\n```\n= A2 & \" \" & B2 & \" used \" &\
  \ \"$\" & C2 & \" of fuel this week\"\n```\n\n该公式通过自动填充柄向下复制到单元格 `A12`。\n\n### 练习\
  \ 10-5：使用连接\n\n在本练习中，你将使用 `&` 字符来合并列数据以及其他字符。\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig14_HTML.jpg](img/385660_2_En_10_Fig14_HTML.jpg)\n\
  \n**图 10-14** – 连接工作表中的数据\n\n1.  在本练习中，你将把城市、州和邮政编码合并到一个单元格中。在单元格 `D2` 中，输入以下公式，然后按\
  \ `Ctrl + Enter`：\n    - 打开工作簿 Chapter 10。\n    - 单击工作表“连接”。\n    - 图 10-14 显示了工作表中的数据。\n\
  \n    ```\n    =A2 & \", \" & B2 & \" \" & C2\n    ```\n\n    此公式在城市后显示一个逗号，后跟一个空格，并在州和邮政编码之间提供两个空格。\n\
  \n    ![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig15_HTML.jpg](img/385660_2_En_10_Fig15_HTML.jpg)\n\
  \n    **图 10-15** – 使用自动填充柄的结果\n\n2.  加宽 `D` 列，使城市、州和邮政编码都能完整显示在该列内。\n\n3.  双击自动填充柄，将公式向下复制到单元格\
  \ `D5`。结果应如图 10-15 所示。\n\n现在你已经练习了如何使用连接。接下来，我们来看一个名为**快速填充**的功能，它无需使用 `&` 符号即可完成连接。当你希望连接同一行中的值时，快速填充可以加快连接速度。你只需输入一个希望数据如何呈现的示例。Excel\
  \ 会检查其他行中是否存在该模式，并使用快速填充将该模式沿列向下复制。\n\n但在以下情况，你仍然需要知道如何使用 `&` 符号进行连接：\n\n1.  连接结果存入单个单元格时。\n\
  2.  在公式中使用连接时。\n3.  所连接的内容不在同一行时。\n4.  在编程代码中使用连接时。\n\n我们来看一下之前用于连接功能的同一个示例。快速填充的功能远不止连接。它可用于查找列中的模式，然后在另一列中重复这些模式。例如，你可以创建一个列，该列使用包含中间名的列的第一个字母，或者创建一个列，该列使用日期列中的“日”部分。\n\
  \n在此示例中，我们将连接结果放在与其所组合数据相同的行上。\n\n### 练习 10-6：使用快速填充\n\n在本例中，你将使用快速填充来合并多列数据以及附加文本。\n\
  \n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig18_HTML.jpg](img/385660_2_En_10_Fig18_HTML.jpg)\n\
