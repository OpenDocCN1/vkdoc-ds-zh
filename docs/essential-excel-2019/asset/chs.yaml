  \n\n\n## 使用切片器筛选数据\n\n除了使用列标题旁的筛选按钮来筛选表格，你还可以创建切片器。切片器虽然无法提供表格筛选按钮的所有选项，但能让你更直观地查看已选中的内容。\n\
  \n**练习 12-2：使用切片器筛选数据**\n\n在本练习中，你将创建两个切片器来筛选表格。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig23_HTML.jpg](img/385660_2_En_12_Fig23_HTML.jpg)\n\
