  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig52_HTML.jpg](img/385660_2_En_3_Fig52_HTML.jpg)\n\
  \n**图 3-52** 自动填充选项 `以月填充` 自动调整月份和年份，但保持日期不变\n\n1.  按`Ctrl + Z`撤消更改。\n2.  选择单元格`A16`和`B16`。按住`Ctrl`键的同时将`自动填充柄`拖过单元格`F16`。\n\
  3.  按`Ctrl + Z`撤消更改。\n4.  选择单元格`A16`和`B16`。选中这两个单元格后，将`自动填充柄`拖过单元格`F16`。\n5.  单击`自动填充选项`按钮。单击`不带格式填充`。使用`自动填充柄`填充的单元格会丢失其格式。请参见图\
  \ 3-51。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig51_HTML.jpg](img/385660_2_En_3_Fig51_HTML.jpg)\n\
  \n**图 3-51** 单元格中的值被复制，但不复制任何格式\n\n至此，你已经掌握了 Excel 中所有用于输入数据的快捷方式。在本节中，你学习了如何复制数据和重复模式。你甚至学习了如何创建自己的模式。在下一节中，你将学习如何为单元格中的数据添加批注。批注可以作为你自己或他人记住数据来源或其所代表内容的辅助手段。\n\
  \n\n\n## 创建、查看、编辑、删除和格式化单元格批注\n\nExcel 推出了一种新型批注，让您可以更轻松地与其他用户协作。在之前的版本中，您可以在单元格中创建一条批注。如果其他用户想要回复该批注，就需要再创建一条新的批注。如果您或其他用户想要继续回复这条新批注，又需要创建更多批注。新版批注就是为了解决这个问题而诞生的。现在，您可以在一个单元格中创建一条批注，所有用户都可以通过将他们的回复内容放入回复框来进行回应。\n\
  \n对于以前使用过 Excel 批注的用户来说，您需要了解术语上的变化。在 Excel 2016 及更早版本中被称为**批注（Comments）** 的功能，现在被称为**备注（Notes）**。功能区的“审阅”选项卡仍然包含“批注”组，与\
  \ Excel 2016 一致，但这些批注命令现在指的是新的协作式批注类型。以前被称为批注的功能，现在位于一个名为“备注”的新组中，该组出现在“批注”组的右侧。参见图\
  \ 3-56。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig56_HTML.jpg](img/385660_2_En_3_Fig56_HTML.jpg)\n\
  \n**图 3-56** 新的“批注”组\n\n“备注”组仅包含一个下拉命令。参见图 3-57。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig57_HTML.jpg](img/385660_2_En_3_Fig57_HTML.jpg)\n\
  \n**图 3-57** “备注”组\n\n我们首先来看看以前被称为批注而现在被称为备注的功能，然后再来看新的协作式批注。\n\n您可以将备注附加到任何工作表单元格中。备注可以是您想与他人分享的信息，或者仅仅是为了帮助自己记忆——例如，公式是如何或为何输入的、数据来源何处、还有哪些数据需要输入，等等。您可以把备注想象成一张便签纸。在工作表中任何您想贴张便签以帮助记忆的地方，都可以创建一条备注。备注实际上比便签纸更好，因为它们不会从纸张上脱落，而且易于编辑。包含备注的单元格很容易通过其右上角的红色小三角来识别。将鼠标指针悬停在红色小三角上即可查看备注。参见图\
  \ 3-58。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig58_HTML.jpg](img/385660_2_En_3_Fig58_HTML.jpg)\n\
  \n**图 3-58** 带有备注的单元格在右上角有一个红色小三角\n\n### 如何添加备注\n\n很少有人会花时间在 Excel 工作表中输入备注。但花时间添加备注是非常值得的。我认为让初学者一开始就养成良好的习惯非常重要，因此我在此数据输入章节中介绍备注，因为它应成为您常规数据输入流程的一部分。\n\
  \n1. 点击您要附加备注的单元格。\n2. 右键点击该单元格，然后选择`插入备注`。\n3. 在备注框中输入您的备注内容。\n4. 点击备注框外部区域。\n\n\
  ### 如何查看备注\n\n请按照以下步骤查看备注：\n\n1. 将鼠标指针悬停在一个红色小三角上。\n2. 如果工作簿包含多条备注，您可以点击`上一条`或`下一条`按钮来逐条查看。\n\
  3. 默认情况下，备注会保持隐藏状态，直到您将鼠标指针悬停在红色小三角上。如果您希望备注即使鼠标指针移开红色小三角后仍保持可见，请点击`显示/隐藏备注`按钮。该按钮可从功能区获取，或者通过右键点击单元格并从快捷菜单中选择。\n\
  \n### 如何同时查看所有备注\n\n您也可以通过以下操作来查看所有备注：\n\n1. 点击`审阅`选项卡。\n2. 在`备注`组中，点击`显示所有备注`。\n\
  \n### 如何更改备注的默认名称\n\n默认情况下，Excel 会将您的用户名放在备注中。您可以通过以下操作删除或更改该名称：\n\n1. 要删除备注中的用户名，请选中该名称并按`Delete`键。\n\
  2. 要更改所有备注的默认名称，请点击`文件`选项卡，然后在左侧窗格中点击`选项`。\n3. 在左侧窗格中选择`常规`。\n4. 在`个性化设置 Microsoft\
  \ Office 副本`组中，在`用户名`文本框中输入您希望使用的名称。\n5. 点击`确定`按钮。\n\n**注意：** 您可能会在数月后不再使用某个工作表，而届时您原以为会记住的事情却早已忘记。如果您像我一样习惯把笔记写在纸上，很可能会弄丢，然后花几个小时去寻找。所以，请善待自己，经常在\
  \ Excel 中使用备注功能吧。\n\n### 编辑和删除备注\n\n如果您右键点击一个包含备注的单元格，快捷菜单中不再有`插入备注`选项，而是包含`编辑备注`和`删除备注`选项。点击`编辑备注`可将备注调出以供编辑。进行所需的更改，然后点击备注外部区域以更新备注。点击`删除备注`会直接删除该备注，不会要求任何确认。\n\
  \n\n\n#### 打印批注\n\n默认情况下，批注不会打印。打印批注的选项位于“`页面设置`”对话框中。可以通过单击功能区上的“`页面布局`”选项卡，然后单击“`页面设置`”组的对话框启动器来访问“`页面设置`”对话框。还可以通过单击“`文件`”选项卡，选择“`打印`”，然后点击“`页面设置`”链接来访问。进入“`页面设置`”对话框后，选择“`工作表`”选项卡。在批注下拉框中，你可以选择将批注打印在工作表数据的末尾，或者按它们在工作表中的显示方式打印。\n\
  \n#### 练习 3-9：处理批注\n\n在本练习中，你将添加、编辑、删除和打印批注。\n\n1.  新建一个名为“`批注`”的工作表。\n2.  右键单击任意单元格。选择“`插入批注`”。键入你希望作为批注的任何内容。\n\
  3.  对另外三个单元格执行相同操作。现在你应该有四个带有红色三角形的单元格。\n\n#### 查看批注\n\n1.  将鼠标光标移到每个批注上以查看它。单击其中一个包含批注的单元格。\n\
  2.  在功能区的“`审阅`”选项卡上，单击“`批注`”按钮并选择“`显示/隐藏批注`”。该批注将显示出来。\n3.  再次选择“`显示/隐藏批注`”。该批注现在被隐藏。\n\
  4.  单击“`批注`”按钮并选择“`下一条批注`”。重复此操作三次。单击“`批注`”按钮并选择“`上一条批注`”。重复此操作两次。\n5.  单击“`批注`”按钮并选择“`显示所有批注`”按钮。所有四个批注都显示出来。再次单击“`显示所有批注`”按钮。四个批注现在被隐藏。\n\
  \n#### 编辑批注\n\n1.  右键单击第一个批注所在的单元格。单击“`编辑批注`”。\n2.  在批注中键入更多文本。单击批注外部的某个位置。\n\n\
  #### 删除批注\n\n1.  右键单击其中一个包含批注的单元格。\n2.  单击“`删除批注`”。该批注被移除。该单元格不再包含红色三角形。\n\n####\
  \ 打印批注\n\n只有当前在工作表上显示的批注才会被打印。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig59_HTML.jpg](img/385660_2_En_3_Fig59_HTML.jpg)\n\
  \n*图 3-59* — 选择批注的打印位置\n\n1.  单击“`批注`”按钮并选择“`显示所有批注`”以一次显示所有批注。\n2.  单击功能区上的“`文件`”选项卡。从左侧窗格中选择“`打印`”。\n\
  3.  点击位于“`设置`”选项底部的“`页面设置`”。这将打开“`页面设置`”对话框。\n4.  单击“`页面设置`”对话框中的“`工作表`”选项卡。\n5.\
  \  单击“`批注`”下拉框的向下箭头。这将显示三个选项。请参见图 3-59。\n\n**注意** — 微软在“`页面设置`”对话框中并未将“`批注`”更改为“`批注`”。如果选择“`在工作表末尾`”，Excel\
  \ 将同时打印批注和批注。如果选择“`如同在工作表中显示`”，Excel 将仅打印批注，而不打印批注。\n\n选择“`无`”将不在打印输出中显示任何批注或批注。\n\
  \n选择“`在工作表末尾`”将在电子表格打印后打印批注和批注。打印输出会显示批注以及每个批注的单元格地址。请参见图 3-60。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig60_HTML.jpg](img/385660_2_En_3_Fig60_HTML.jpg)\n\
  \n*图 3-60* — 选择“`在工作表末尾`”的结果\n\n选择“`如同在工作表中显示`”会按照批注在电子表格中的确切显示方式，在数据中打印它们。请参见图\
  \ 3-61。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig61_HTML.jpg](img/385660_2_En_3_Fig61_HTML.jpg)\n\
  \n*图 3-61* — 选择“`如同在工作表中显示`”的结果\n\n#### 更改批注的背景颜色或边框颜色\n\n1.  右键单击批注的边框。选择“`设置批注格式`”。选择“`颜色与线条`”选项卡。你可以从“`填充`”区域选择颜色以更改背景。你可以从“`线条`”区域选择颜色以更改批注边框颜色。点击“`确定`”按钮。\n\
  \n### 新的协作批注\n\n批注和新批注之间的区别在于，新批注功能包含一个回复框。使用旧的批注方法，每个想要回复你某条批注的人都必须创建一条新批注，但使用新批注，每当用户想要回复时，都会在批注中添加一个新的回复框。这使得在电子表格上的协作变得更加容易。这些新批注有时被称为线程批注，因为每个用户都在创建新线程。\n\
  \n新的批注功能在 Word、Access 和 PowerPoint 中也可用。图 3-62 显示了一个新的线程批注。包含批注的单元格右上角会出现一个图标。将鼠标光标移到该图标上以显示关联的批注。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig62_HTML.jpg](img/385660_2_En_3_Fig62_HTML.jpg)\n\
  \n*图 3-62* — 输入批注\n\n批注会显示用户的姓名缩写和姓名以及单元格地址。在框中输入你的批注，然后点击下面的“`发布`”按钮。点击“`发布`”按钮会显示该批注及其发布的时间和日期。请参见图\
  \ 3-63。如果你需要修改批注，请点击“`编辑`”。一个新的“`回复`”框出现，供其他用户添加对批注的回复。与批注不同，你不能更改批注的大小或背景颜色。\n\n\
  ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig63_HTML.jpg](img/385660_2_En_3_Fig63_HTML.jpg)\n\
  \n*图 3-63* — 已发布的批注\n\n发布批注后，你期望得到回复。要获得回复，你可以通过电子邮件将电子表格发送给某人、在 OneDrive 上共享或通过网络驱动器共享。如果你正在与使用同一台本地计算机的人共享文档，你将需要更改用户信息。这可以通过单击功能区上的“`文件`”，然后在左侧窗格中选择“`帐户`”来完成。在右侧窗格的顶部，你将看到当前用户信息。点击“`切换帐户`”以切换到其他用户。请参见图\
  \ 3-64。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig64_HTML.jpg](img/385660_2_En_3_Fig64_HTML.jpg)\n\
  \n*图 3-64* — 切换用户\n\n点击“`切换帐户`”会在 Excel 窗口的右上方弹出一个对话框。请参见图 3-65。你可能看到其他可用的用户，你可以从中选择你想要的用户。如果没有其他用户可供选择，则点击“`使用其他帐户登录`”。然后你需要输入\
  \ Microsoft 帐户的用户名和密码，或创建一个新帐户。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig65_HTML.jpg](img/385660_2_En_3_Fig65_HTML.jpg)\n\
  \n*图 3-65* — 以其他用户身份登录\n\n然后，第二个用户可以将鼠标光标移到批注图标上，然后在“`回复`”框中输入他的回复。请参见图 3-66。\n\n\
  ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig66_HTML.jpg](img/385660_2_En_3_Fig66_HTML.jpg)\n\
  \n*图 3-66* — 以其他用户身份登录\n\n图 3-67 显示了第二个用户点击“`发布`”按钮后批注的样子。现在另一个用户或同一个用户可以发布另一条批注。这个过程可以持续进行。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig67_HTML.jpg](img/385660_2_En_3_Fig67_HTML.jpg)\n\
  \n*图 3-67* — 以其他用户身份登录\n\n用于批注的按钮位于功能区的“`审阅`”选项卡上。请参见图 3-68。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig68_HTML.jpg](img/385660_2_En_3_Fig68_HTML.jpg)\n\
  \n*图 3-68* — 批注按钮\n\n\n\n当你在电子表格中显示所有笔记时，它们会出现在引用它们的单元格旁边，但点击“显示批注”（`Show Comments`）并不会产生相同效果；实际上，它会在表格右侧的窗格中显示所有批注。参见图\
  \ 3-69。你可以直接在窗格中输入对批注的回复，而无需将光标移到批注图标上再输入回复。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig69_HTML.jpg](img/385660_2_En_3_Fig69_HTML.jpg)\n\
  \n图 3-69  \n所有批注可在窗格中显示\n\n你可以使用“下一条批注”（`Next Comment`）和“上一条批注”（`Previous Comment`）按钮跳转到其他批注。要删除批注，请选中包含批注的单元格，然后点击“删除”（`Delete`）按钮。\n\
  \n如需打印批注，请点击功能区中的“文件”（`File`）选项卡，然后点击“打印”（`Print`）。接着点击“页面设置”（`Page Setup`），再点击“工作表”（`Sheet`）选项卡。点击“批注”旁的下拉箭头，选择“工作表末尾”（`At\
  \ end of sheet`）。注意，“如同工作表中的显示”（`As displayed on sheet`）（旧版）选项将无法用于打印批注。\n\n## 本章小结\n\
  \n本章涵盖了各种数据类型，以及这些类型如何影响数据在单元格中的显示和调整方式。同时，还介绍了输入和编辑数据的多种方法。\n\n本章重点介绍了如何调整工作表中列和行的大小与外观，以及如何使用特殊字符和\
  \ Excel 的“自动更正”（`AutoCorrect`）功能。你可以创建、编辑、删除和打印添加到单元格中的笔记和批注。\n\nExcel 的“自动更正”（`AutoCorrect`）功能非常实用，可用于纠正常见拼写错误、纠正大小写误用、输入无法直接从键盘输入的特殊符号，以及创建用于输入常用词或短语的快捷方式。\n\
  \n“自动完成”（`AutoComplete`）和“从下拉列表中选择”（`Pick from Drop-down List`）功能可让你轻松复制现有的列值。\n\
  \n在第 4 章中，你将学习如何使用更复杂的数据和单元格格式化功能。此外，还有多种用于呈现和格式化数值数据（包括会计用途的数据）的选项。你还将开始使用迷你工具栏和上下文菜单，这些工具提供了针对当前操作的更多快捷选项。\n\
  \n"
- "# 4. 格式化与对齐数据\n\n接下来，你将学习如何优化工作表在屏幕和打印时的呈现效果。Excel 提供了许多优秀的选项，帮助你在工作表和整个工作簿中建立独特且一致的样式。\n\
  \n阅读并学习完本章后，你将能够：\n\n- 格式化数据和单元格背景\n- 创建单元格边框\n- 检查当前单元格已应用了哪些格式\n- 对齐数据\n- 将一个单元格的格式复制到其他单元格\n\
  - 格式化数值数据\n- 使用“上下文工具栏”（`Context Toolbars`）菜单\n\n格式化数据的原因包括：强调特定条目（例如总计），以及使工作表在视觉上更具吸引力并更易于理解（例如，通过使用颜色对行和列进行视觉分区）。这有助于为创建工作表的人员以及使用它进行分析和报告的其他人员保持信息的条理性。格式化还可用于更改数值数据的显示方式（如添加美元符号、逗号、小数、百分号等）。格式化同样用于对齐数据。你可以使用\
  \ Excel 的“格式刷”（`Format Painter`）将一个单元格的所有格式复制到其他单元格。你还可以创建单元格边框，以分隔不同区域或突出显示工作表中的特定区域。\n\
  \n## 使用“字体”组格式化文本\n\n位于“开始”选项卡上的“字体”（`Font`）组提供了更改字体、字号、颜色等选项。图 4-1 显示了“字体”组中的格式化命令按钮。下文将逐一介绍这些按钮。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig1_HTML.jpg](img/385660_2_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1  \n字体格式化命令按钮\n\n### 使用加粗、斜体、下划线和双下划线\n\n你可以对文本使用加粗、斜体或下划线的任意组合。选择这些选项中的一个或多个会影响活动单元格。这些选项类似于开关：点击即可启用，再次点击则关闭。你可以通过点击下划线按钮旁的下拉箭头，然后选择所需选项，在下划线和双下划线之间切换。参见图\
  \ 4-2。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig2_HTML.jpg](img/385660_2_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2  \n选择下划线或双下划线\n\n### 更改字体及其大小\n\n选择合适的字体和字号至关重要，这不仅能让电子表格数据脱颖而出，还能确保数据易于阅读。\n\
  \n#### 字体\n\n可以通过点击字体下拉箭头，然后从列表中选择所需字体系列来更改字体。参见图 4-3。字体列表会显示不同字体的外观。当鼠标指针悬停在列表中的不同字体上时，Excel\
  \ 会使用鼠标指针指向的字体在活动单元格中显示文本。更改字体会影响工作表中所有当前选定单元格的文本。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig3_HTML.jpg](img/385660_2_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3  \n可用字体\n\n列表中有很多字体。如果你想快速跳转到特定字体，可以在“字体名称框”（`Font Name Box`）中键入字体名称的前几个字母。例如，如果你想使用字体\
  \ `Bell MT`，可以键入前三个字母 `Bel`（因为只有一个以 `Bel` 开头的字体），然后按 `Enter` 键。\n\n\n\n#### 字号\n\
  \n单击字号的下拉箭头会显示当前所选字体的所有可用字号。图 4-4 展示了 Calibri 字体可用的部分字号（上半部分）。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig4_HTML.jpg](img/385660_2_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4\n\n选择字号\n\n单击增大字号按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figa_HTML.jpg](img/385660_2_En_4_Figa_HTML.jpg)\
  \ 会将字体大小增大到下一个可用的字号。参考图 4-4，如果当前字号是 11，单击增大字号按钮会将字号增大到下一个可用大小，即 12。如果当前字号是 18，单击增大字号按钮会将字号增大到下一个可用大小，即\
  \ 20。\n\n单击减小字号按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figb_HTML.jpg](img/385660_2_En_4_Figb_HTML.jpg)\
  \ 则执行相反操作：将字号减小到比当前大小小一级。参考图 4-4，你可以看到，如果当前字号是 18，单击减小字号按钮会将字号减小到 16 磅。字号以磅为单位计量。每磅大约等于\
  \ 1/72 英寸。\n\n### 练习 4-1：更改字体和字号\n\n本练习涵盖了选择字体和更改字号的多种方法。\n\n1.  新建一个工作簿。\n2.  保存工作簿，并将其命名为\
  \ **Chapter 4**。将工作表名称从 `Sheet1` 改为 `Font`。\n3.  在单元格 `H5` 中输入你的姓名，然后按 `Ctrl + Enter`\
  \ 确认输入。\n4.  在功能区的“开始”选项卡的“字体”组中，单击“字体”的下拉箭头。\n5.  将鼠标指针悬停在不同字体上，观察你的姓名如何变化。如果有\
  \ `Arial Narrow` 字体，请选择它；否则，选择另一种字体。\n6.  单击“字号”的下拉箭头。\n7.  将鼠标指针悬停在不同字号上，观察你姓名的大小变化。选择字号\
  \ 26。\n8.  现在，尝试使用增大和减小按钮：\n9.  单击增大字号按钮。字号变为 28。\n10. 再次单击增大字号按钮。字号变为 36。\n11.\
  \ 单击减小字号按钮。字号变为 28。\n12. 再次单击减小字号按钮。字号变为 26。\n13. 双击单元格 `H5` 进入编辑模式。拖动选中你姓名的前三个字母。\n\
  14. 单击“字体”的下拉箭头。将鼠标指针悬停在不同字体上，观察只有前三个字母如何变化。\n15. 在**字体名称框**中键入 `Ti`，跳转到 Times New\
  \ Roman 字体。按 `Enter` 键。\n\n现在，你应该熟悉菜单上“字体”组提供的所有工具了。接下来，你将了解如何通过“字体”组的对话框启动器来访问这些相同的工具。\n\
  \n### 使用“字体”组的对话框启动器\n\n单击“字体”组的对话框启动器，会弹出“设置单元格格式”对话框，并自动激活“字体”选项卡。如图 4-5 所示。在此对话框中，你可以指定大多数在“字体”组中也可用的选项，此外，还可以在一个方便的位置添加效果。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig5_HTML.jpg](img/385660_2_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5\n\n字体选项\n\n### 使用颜色进行格式化\n\n通过添加颜色，你可以将工作表从单调乏味变得引人注目。添加颜色不仅可以让你的工作表更富视觉冲击力，还可以：\n\
  \n*   突出显示你认为重要的单元格。\n*   分隔工作表中的不同区域。\n*   使你的工作表更易于阅读。\n\n使用颜色时要小心。使用过多颜色或以错误的方式使用颜色（例如在深色背景上使用深色文本）会使你的工作表令人费解且难以阅读。\n\
  \n#### 更改字体颜色\n\n单击字体颜色按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figc_HTML.jpg](img/385660_2_En_4_Figc_HTML.jpg)\
  \ 会将图标上当前显示的颜色应用到活动单元格的文本上。你可以通过单击其下拉箭头来选择其他颜色。\n\n你可以从“主题颜色”集合或“标准色”集合中选择任何颜色，如图\
  \ 4-6 所示。如果你想要更多颜色可供选择，请单击“其他颜色”选项。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig6_HTML.jpg](img/385660_2_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n主题颜色和标准色\n\n单击“其他颜色”选项会弹出“颜色”对话框，其中包含“标准”和“自定义”选项卡。“标准”选项卡允许你从蜂窝状网格中选择颜色。右下角的“当前”区域显示当前单元格的字体颜色。当你从网格中选择一种颜色时，它会显示在窗口右下角的“新增”区域中。如图\
  \ 4-7 所示。这就是单击“确定”按钮后字体将被更改成的颜色。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig7_HTML.jpg](img/385660_2_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n从颜色蜂窝中选择新颜色\n\n“自定义”选项卡以垂直条显示颜色。如图 4-8 所示。每个垂直条的边缘与相邻颜色融合在一起。你可以在调色板中单击与你需要的颜色匹配的任意位置。然后，该颜色将显示在调色板右侧的垂直条中。向上或向下拖动箭头可更改颜色的强度。如图\
  \ 4-8 所示。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig8_HTML.jpg](img/385660_2_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\n创建自定义颜色\n\n#### 更改单元格背景颜色\n\n单击填充颜色按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figd_HTML.jpg](img/385660_2_En_4_Figd_HTML.jpg)\
  \ 会将图标上当前显示的颜色应用到活动单元格的背景上。你可以通过单击其下拉箭头来选择其他颜色。这将弹出与字体颜色相同的可用选项。\n\n单击“字体”组的对话框启动器会弹出“设置单元格格式”对话框。“设置单元格格式”对话框中的“填充”选项卡提供了用于创建填充效果或图案背景的选项。如图\
  \ 4-9 所示。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig9_HTML.jpg](img/385660_2_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n选择填充颜色、图案颜色或图案样式\n\n\n\n### 检查当前单元格已应用了哪些格式\n\n只需单击某个单元格，然后观察功能区“字体”组中显示的内容，即可判断该单元格已应用的某些格式。查看图\
  \ 4-10，可以看到单元格 `C1` 中的文本已设置为**加粗**和*斜体*。它使用了 `Arial Black` 字体，字号为 `16`。\n\n> **注意**：如果单元格中的所有文本并非采用相同格式，则需要选择那些你想显示其格式的字符。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig10_HTML.jpg](img/385660_2_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10** – 所选文本已加粗并设为斜体\n\n`边框`、`填充颜色`和`字体颜色`选项并不会反映当前单元格的状态。它们反映的是上次使用这些选项时所做出的选择。\n\
  \n---\n\n### 练习 4-2：更改字体与背景颜色\n\n本练习涵盖更改字体颜色以及更改单元格背景颜色。单元格背景可以是纯色、渐变或图案。\n\n1.\
  \  单击`字体颜色`按钮的下拉箭头。选择`黑色`。在单元格 `B4` 中输入**总计值**。按 `Ctrl + Enter`。将字体更改为 `Cambria`。将字号改为\
  \ `14`。单击加粗和斜体按钮。加宽列以容纳更改后的内容。\n\n2.  再次单击单元格 `B3`。你可以看到已应用到该单元格的格式。`加粗`按钮已高亮显示。字体显示为\
  \ `Calibri`。字号反映了你已单击过`增大字号`按钮。单击`填充颜色`按钮的下拉箭头。选择框位于黑色周围。单击`字体颜色`按钮的下拉箭头。选择框位于白色周围。单击单元格\
  \ `B4`。看看你是否能检测到已对其应用了哪些格式。\n\n3.  单击单元格 `B4`。单击`填充颜色`按钮的下拉箭头。选择颜色“绿色，主题色 6，淡色 80%”。见图\
  \ 4-11。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig11_HTML.jpg](img/385660_2_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** – 选择绿色，主题色 6，淡色 80%\n\n4.  创建一个名为“Colors”的新工作表。\n\n5.  单击单元格 `B3`。单击功能区的`开始`选项卡，然后在`字体`组中，单击`填充颜色`按钮的下拉箭头\
  \ ![../images/385660_2_En_4_Chapter/385660_2_En_4_Fige_HTML.jpg](img/385660_2_En_4_Fige_HTML.jpg)。选择`黑色`。\n\
  \n6.  现在，输入并设置一些文本的格式：\n    - 单击`字体颜色`按钮的下拉箭头 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figf_HTML.jpg](img/385660_2_En_4_Figf_HTML.jpg)，然后选择`白色`。\n\
  \    - 输入**总计值**。按 `Ctrl + Enter`。\n    - 如果字体类型还不是 `Calibri`，请将其更改为 `Calibri`。\n\
  \    - 单击`增大字号`按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figg_HTML.jpg](img/385660_2_En_4_Figg_HTML.jpg)\
  \ 一次。\n    - 按 `Ctrl + B` 将文本加粗。\n    - 通过在列标题 `B` 和 `C` 之间双击来加宽列，以便所有文本都能容纳在单元格中。\n\
  \n---\n\n#### 将背景更改为渐变\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig12_HTML.jpg](img/385660_2_En_4_Fig12_HTML.jpg)\n\
  \n**图 4-12** – 将单元格背景颜色更改为渐变\n\n1.  选中单元格 `B5:D5`。单击`字体`组的对话框启动器 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figh_HTML.jpg](img/385660_2_En_4_Figh_HTML.jpg)。\n\
  2.  单击`填充`选项卡。\n3.  单击`填充效果`按钮。`渐变`选项卡用于将背景更改为渐变颜色。见图 4-12。\n4.  为**颜色 1** 选择任意颜色，然后为**颜色\
  \ 2** 选择另一种颜色。\n5.  单击每种底纹样式，观察渐变图案的变化。\n6.  当你选择了想要使用的颜色和样式后，单击包含你想要使用的图案的`变体`框。`示例`区域会显示背景在你所选选项下的效果。\n\
  7.  单击`填充效果`对话框中的`确定`按钮。单击`设置单元格格式`对话框中的`确定`按钮。\n\n---\n\n#### 将背景更改为图案样式\n\n1.\
  \  选中单元格 `B7:D8`。单击`字体`组的对话框启动器。单击`填充`选项卡。选择一种你喜欢的图案颜色。从`图案样式`下拉框中选择一种你喜欢的图案。单击`确定`按钮。\n\
  \n2.  单击`快速访问工具栏`上的`保存`按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figi_HTML.jpg](img/385660_2_En_4_Figi_HTML.jpg)。\n\
  \n你已经学会了如何更改文本的外观和大小以及如何强调文本。你可以运用这些知识将用户的视线吸引到你想要的文本上。你的公司可能有关于工作表应使用何种字体类型和颜色的标准。接下来，你将看到如何将边框放置在单元格周围，这同样可用于强调某些单元格，或作为显示工作表中不同区域分隔的一种方式。\n\
  \n---\n\n### 单元格边框\n\n所有单元格都有用于分隔它们的网格线。这可以将一个单元格与另一个单元格区分开来。可以通过单击功能区的`视图`选项卡，然后取消选中`网格线`来移除网格线。见图\
  \ 4-13。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig13_HTML.jpg](img/385660_2_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-13** – 取消选中网格线以从工作表中移除所有网格线\n\n图 4-14 显示了移除网格线后的结果。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig14_HTML.jpg](img/385660_2_En_4_Fig14_HTML.jpg)\n\
  \n**图 4-14** – 无网格线\n\n然而，有时候你需要区分特定的单元格、行、列或一组单元格。你可以通过使用边框来实现这一点。边框可以只是单元格或单元格区域左侧、顶部、右侧或底部的一条线。它也可以是几条线的组合，或者是一个环绕单元格或单元格区域的完整框线。图\
  \ 4-15 展示了几种不同的边框类型。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig15_HTML.png](img/385660_2_En_4_Fig15_HTML.png)\n\
  \n**图 4-15** – 不同的边框类型\n\n单击`边框`按钮会将当前按钮上显示的边框应用于你的活动单元格。如果你想要不同的边框样式，可以单击边框旁边的下拉箭头，然后选择其中一个选项以应用于你选定的单元格。见图\
  \ 4-16。\n\n> **注意**：标准的会计惯例是在总计行的上方使用单线，下方使用双线。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig16_HTML.jpg](img/385660_2_En_4_Fig16_HTML.jpg)\n\
  \n**图 4-16** – 边框选项与工具\n\n> **注意**：你可以使用`擦除边框`工具擦除一部分边框。使用`擦除边框`工具时，鼠标指针将显示为橡皮擦形状。\n\
  \n\n\n#### 绘制边框\n\n你甚至可以使用 `绘制边框` 或 `绘制边框网格` 工具来绘制边框。使用绘制边框工具时，鼠标指针会显示为铅笔形状。边框将以当前线条样式绘制。\n\
  \n`绘制边框` 工具会在你拖拽经过的单元格周围绘制完整的外边框。见图 4-17。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig17_HTML.jpg](img/385660_2_En_4_Fig17_HTML.jpg)\n\
  \n**图 4-17** 绘制边框工具\n\n`绘制边框网格` 工具会在每个单元格周围放置完整的边框。见图 4-18。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig18_HTML.jpg](img/385660_2_En_4_Fig18_HTML.jpg)\n\
  \n**图 4-18** 绘制边框网格工具\n\n### 练习 4-3：创建单元格边框\n\n在本练习中，你将使用多种方法来创建边框，并更改边框的宽度、样式和颜色。\n\
  \n#### 使用边框按钮添加边框\n\n1.  新建一个名为“Borders”的工作表。\n2.  选中单元格 `B2:C2`。\n3.  在功能区`开始`选项卡的`字体`组中，点击`边框`按钮的下拉箭头。\n\
  4.  点击`上框线和双下框线`。点击另一个单元格以便查看结果。\n\n#### 绘制边框\n\n1.  按 `Esc` 键关闭`绘制边框`模式。\n2.  如果在选择`线条颜色`或`线条样式`时，`绘制边框`工具和`绘制边框网格`工具均未激活，Excel\
  \ 会自动启用`绘制边框`工具。\n3.  在单元格 `B15:C19` 周围绘制边框。见图 4-21。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig21_HTML.jpg](img/385660_2_En_4_Fig21_HTML.jpg)\n\
  \n**图 4-21** 在单元格区域 `B15:C19` 周围绘制边框\n\n1.  在单元格 `B10:C13` 周围绘制边框。边框应显示为绿色。\n2.\
  \  点击`边框`按钮的下拉箭头。点击`绘制边框`按钮以取消选择。\n3.  点击`边框`按钮的下拉箭头。点击`线条样式`。选择双线。见图 4-20。\n\n\
  ![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig20_HTML.jpg](img/385660_2_En_4_Fig20_HTML.jpg)\n\
  \n**图 4-20** 更改边框的线条样式\n\n1.  在`字体`组中点击`边框`按钮的下拉箭头。\n2.  点击`绘制边框`。鼠标指针应变为铅笔形状。\n\
  3.  在单元格 `B4` 到 `B8` 周围绘制边框。注意`边框`按钮的图标已变为铅笔形状以反映你的选择。\n4.  点击`边框`按钮的下拉箭头。\n5. \
  \ 注意，`绘制边框`按钮周围现在有阴影，表示该工具当前处于激活状态。另外，注意`线条颜色`按钮上有一条彩色线条。这表示当前正在使用的颜色。\n6.  当你更改`线条颜色`或`线条样式`时，你正在更改当前激活的工具（即`绘制边框`工具）的设置。\n\
  7.  点击`线条颜色`。从`标准色`中选择绿色。见图 4-19。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig19_HTML.jpg](img/385660_2_En_4_Fig19_HTML.jpg)\n\
  \n**图 4-19** 更改边框的线条颜色\n\n#### 绘制边框网格\n\n1.  点击`边框`按钮的下拉箭头。注意，`绘制边框网格`工具当前处于激活状态。选择`线条颜色`。从`标准色`中选择`红色`。\n\
  2.  在单元格 `E10:F12` 周围绘制边框，然后按 `Esc` 键。\n3.  选中单元格 `I2:J6`。\n4.  点击`边框`按钮的下拉箭头。选择`上框线和粗下框线`。点击另一个单元格查看结果。（注意，线条现在显示为红色，因为这是你上次使用的线条颜色。）\n\
  5.  点击`边框`按钮的下拉箭头。注意，`绘制边框`工具不再处于激活状态。按 `Esc` 键使其失效。\n6.  点击`绘制边框网格`。\n7.  在单元格\
  \ `E3:F7` 周围绘制边框。边框应显示为绿色双线，因为这些是你上次选择的选项。\n8.  `边框`按钮的图标已更改，以反映`绘制边框网格`工具当前处于激活状态。见图\
  \ 4-22。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig22_HTML.jpg](img/385660_2_En_4_Fig22_HTML.jpg)\n\
  \n**图 4-22** 边框按钮反映`绘制边框网格`工具处于激活状态\n\n#### 使用设置单元格格式对话框创建边框\n\n1.  点击`确定`按钮。\n\
  2.  选中单元格 `E15:F20`。\n3.  点击`边框`按钮的下拉箭头。选择`其他边框`。由于选中了多个单元格，`预置`区域中的`内部`按钮以及`边框`区域中的所有边框按钮都可用。\n\
  4.  点击`竖内部`按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figj_HTML.jpg](img/385660_2_En_4_Figj_HTML.jpg)。\n\
  5.  点击`预置`区域中的`无`按钮以清除`预览`区域。\n6.  在`样式`组的第二列中选择第一条实线。\n7.  选择`红色`作为颜色。\n8.  点击`预置`区域中的`外边框`按钮。这将激活`上`、`下`、`左`和`右`的`边框`按钮。\n\
  9.  选择`绿色`作为颜色。\n10. 点击`横内部`按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figk_HTML.jpg](img/385660_2_En_4_Figk_HTML.jpg)。见图\
  \ 4-26。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig26_HTML.jpg](img/385660_2_En_4_Fig26_HTML.jpg)\n\
  \n**图 4-26** `横内部`按钮创建水平内部边框\n\n1.  点击`确定`按钮。点击另一个单元格以便查看结果。现在，单元格 `I8` 应有左边框和右边框。\n\
  2.  边框按钮的工作原理类似于切换开关。点击某个`边框`按钮会将相应的边框添加到单元格中。再次点击该`边框`按钮则会移除该边框。点击`上边框`按钮移除单元格的上边框。\n\
  3.  点击`左边框`按钮，然后点击`右边框`按钮。见图 4-25。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig25_HTML.jpg](img/385660_2_En_4_Fig25_HTML.jpg)\n\
  \n**图 4-25** `左边框`和`右边框`按钮创建左边框和右边框\n\n1.  `预置`区域中的`内部`选项呈灰色不可用状态，因为只有一个活动单元格，即单元格\
  \ `I8`。点击`预置`区域中的`无`。这将移除`预览`框中的所有边框。\n2.  点击`边框`区域中的`上边框`按钮。在`文本`框中会显示上边框。见图 4-24。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig24_HTML.jpg](img/385660_2_En_4_Fig24_HTML.jpg)\n\
  \n**图 4-24** `上边框`按钮创建上边框\n\n1.  点击单元格 `I8`。\n2.  点击`边框`按钮的下拉箭头。选择`其他边框`。\n3.  创建一个边框：\n\
  \    1.  在`样式`组的第二列中选择第一条实线。\n    2.  选择`自动`作为颜色。\n    3.  点击`预置`区域中的`外边框`。`边框`区域中的`预览`框会显示单元格的外观。见图\
  \ 4-23。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig23_HTML.jpg](img/385660_2_En_4_Fig23_HTML.jpg)\n\
  \n**图 4-23** `边框`区域中的预览框显示边框的外观\n\n#### 擦除边框\n\n1.  按 `Esc` 键。这将关闭`擦除`工具。\n2.  点击`快速访问工具栏`上的`保存`按钮\
  \ ![../images/385660_2_En_4_Chapter/385660_2_En_4_Fign_HTML.jpg](img/385660_2_En_4_Fign_HTML.jpg)。\n\
  3.  点击`边框`按钮的下拉箭头。\n\n\n\n2. 选择**擦除边框**。鼠标指针变为橡皮擦图标 (![../images/385660_2_En_4_Chapter/385660_2_En_4_Figl_HTML.jpg](img/385660_2_En_4_Figl_HTML.jpg))。用橡皮擦尖端点击边框线即可删除该边框线。\n\
  \n3. 擦除第一、第三和第五根水平绿色线条。由于这些水平线跨越两个单元格，你需要点击每个单元格的水平线。更简便的方法是按住鼠标左键并拖过水平线，如图 4-27\
  \ 所示。如果擦除过多，只需点击撤销按钮 (![../images/385660_2_En_4_Chapter/385660_2_En_4_Figm_HTML.jpg](img/385660_2_En_4_Figm_HTML.jpg))\
  \ 或按`Ctrl + Z`并重试。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig27_HTML.jpg](img/385660_2_En_4_Fig27_HTML.jpg)\n\
  \n**图 4-27**\n\n已擦除第一、第三和第五根内部水平边框线\n\n## 使用“数字”组格式化数值数据\n\n你已经看到 Excel 如何根据输入的数据对单元格中的格式和对齐方式做出假设（例如数值数据右对齐）。如果要更改该格式，你需要使用\
  \ Excel 的众多格式化功能之一，这些功能位于“开始”选项卡的“数字”组中。参见图 4-28。表 4-1 提供了“数字”组中每个选项的说明。\n\n**表\
  \ 4-1**\n\n“数字”组中各选项的说明\n\n| “数字”组按钮 | 说明 |\n| --- | --- |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figo_HTML.jpg](img/385660_2_En_4_Figo_HTML.jpg)\
  \ | “数字格式”下拉列表提供了数值、日期和时间值的多种默认格式。参见图 4-26。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figp_HTML.jpg](img/385660_2_En_4_Figp_HTML.jpg)\
  \ | 点击该按钮的美元符号部分，将以会计专用格式（美元符号、逗号和两位小数）格式化当前单元格。如果要使用其他货币（如英镑或欧元），可以点击`![../images/385660_2_En_4_Chapter/385660_2_En_4_Figq_HTML.jpg](img/385660_2_En_4_Figq_HTML.jpg)`按钮右侧的下拉箭头。\
  \ |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figr_HTML.jpg](img/385660_2_En_4_Figr_HTML.jpg)\
  \ | 将单元格中的值乘以 100，并在值末尾添加`%`符号。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figs_HTML.jpg](img/385660_2_En_4_Figs_HTML.jpg)\
  \ | 为数值添加逗号。如果数值不包含小数，则会添加`.00`。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figt_HTML.jpg](img/385660_2_En_4_Figt_HTML.jpg)\
  \ | 第一个按钮（增加小数位数）每点击一次，单元格中的小数位数增加一位。第二个按钮（减少小数位数）每点击一次，单元格中的小数位数减少一位。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figu_HTML.jpg](img/385660_2_En_4_Figu_HTML.jpg)\
  \ | 对话框启动器会打开“设置单元格格式”对话框，并自动选中“数字”选项卡。 |\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig28_HTML.jpg](img/385660_2_En_4_Fig28_HTML.jpg)\n\
  \n**图 4-28**\n\n“开始”选项卡上的功能区“数字”组\n\n### 使用默认格式\n\n假设活动单元格当前值为`3859.27`。\n\n点击“数字格式”下拉列表的下拉箭头，会显示默认格式列表（参见图\
  \ 4-29）。点击此列表中的选项，即可按每个格式标签下方显示的样式格式化当前值。所见即所得，无需选择其他选项。\n\n例如，如果你点击“分数”选项，当前单元格的格式将更改为`3859\
  \ 1/4`。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig29_HTML.jpg](img/385660_2_En_4_Fig29_HTML.jpg)\n\
  \n**图 4-29**\n\n不同数据类型的默认格式\n\n#### 会计专用与货币格式\n\n会计专用格式是一种特殊的货币格式，以美元符号、逗号和两位小数显示数值。会计专用格式使列中的美元符号和小数点对齐。参见图\
  \ 4-30。美元符号始终位于单元格的最左侧。根据单元格宽度和其中的数值，美元符号与数值之间可能存在多个空格。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig30_HTML.jpg](img/385660_2_En_4_Fig30_HTML.jpg)\n\
  \n**图 4-30**\n\n会计专用格式与货币格式的区别\n\n货币格式与会计专用格式类似。它也为数值添加美元符号、逗号和两位小数。区别在于货币格式使用浮动美元符号，而会计专用格式使用固定美元符号。浮动美元符号不对齐，而是紧贴数值左侧放置。\n\
  \n### 格式化货币值\n\n“数字”组中的`![../images/385660_2_En_4_Chapter/385660_2_En_4_Figv_HTML.jpg](img/385660_2_En_4_Figv_HTML.jpg)`按钮执行与从“数字格式”下拉列表中选择“会计专用”完全相同的格式化操作。如果你希望以不同格式显示数值，或使用其他货币（如英镑或欧元），可以点击`![../images/385660_2_En_4_Chapter/385660_2_En_4_Figw_HTML.jpg](img/385660_2_En_4_Figw_HTML.jpg)`按钮右侧的下拉箭头。参见图\
  \ 4-31。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig31_HTML.jpg](img/385660_2_En_4_Fig31_HTML.jpg)\n\
  \n**图 4-31**\n\n格式化后的货币值\n\n如果你希望使用非两位小数，或使用下拉框中未显示的货币，可以选择最后一个选项**更多会计专用格式**。选择此选项是打开“设置单元格格式”对话框的多种方式之一。\n\
  \n在此对话框中，你可以从“符号”下拉列表中选择多种不同的货币选项。参见图 4-32。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig32_HTML.jpg](img/385660_2_En_4_Fig32_HTML.jpg)\n\
  \n**图 4-32**\n\n小数位数和货币符号的会计专用选项\n\n### 转换为百分比样式\n\n百分比样式`![../images/385660_2_En_4_Chapter/385660_2_En_4_Figx_HTML.jpg](img/385660_2_En_4_Figx_HTML.jpg)`按钮会将选定单元格中的值乘以\
  \ 100，并在数字后放置`%`符号。例如，值`.25`将被格式化为`25%`。`%`按钮会四舍五入数值并移除所有小数位，如图 4-33 所示。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig33_HTML.jpg](img/385660_2_En_4_Fig33_HTML.jpg)\n\
  \n**图 4-33**\n\n使用百分比样式格式化\n\n如果你希望使用显示两位小数的百分比格式，请点击“数字格式”下拉列表的下拉箭头，并选择**% (百分比)**。图\
  \ 4-34 显示了应用此格式后的结果。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig34_HTML.jpg](img/385660_2_En_4_Fig34_HTML.jpg)\n\
  \n**图 4-34**\n\n使用%选项格式化\n\n\n\n### 将数值转换为千位分隔样式\n\n点击“千位分隔样式”按钮 `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figy_HTML.jpg](img/385660_2_En_4_Figy_HTML.jpg)`\
  \ 可以为选中的单元格数值添加逗号分隔符。例如，数值 `3857495.25` 将格式化为 `3,857,495.25`。\n\n### 更改小数位数\n\n\
  `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figz_HTML.jpg](img/385660_2_En_4_Figz_HTML.jpg)`\
  \ “增加小数位数”按钮每点击一次，数值的小数位数就增加一位。图标显示从一位小数变为两位小数。\n\n`![../images/385660_2_En_4_Chapter/385660_2_En_4_Figaa_HTML.jpg](img/385660_2_En_4_Figaa_HTML.jpg)`\
  \ “减少小数位数”按钮每点击一次，数值的小数位数就减少一位。图标显示从两位小数变为一位小数。\n\n### 访问“设置单元格格式”对话框\n\n如果你希望使用更多选项来格式化数字，那么使用“设置单元格格式”对话框中的“数字”选项卡是最佳途径。通过该选项卡，你可以对分数、日期、时间等进行格式化，而这些格式化操作在其他区域是无法完成的。窗口右侧显示哪些选项取决于所选的类别。参见图\
  \ 4-35。\n\n可以通过以下任一方法从“数字”组访问“设置单元格格式”对话框：\n\n-   单击对话框启动器。\n-   单击“数字格式”下拉框中的下拉箭头，然后选择**其他数字格式**。\n\
  -   单击 `$` 按钮右侧的下拉箭头，然后选择**其他会计格式**。\n\n`![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig35_HTML.png](img/385660_2_En_4_Fig35_HTML.png)`\n\
  图 4-35\n选中“数字”格式的“设置单元格格式”对话框\n\n**练习 4-4：格式化数字**\n\n在此练习中，你将使用各种数字数据格式。如果你在上次练习后关闭了工作簿，可以重新打开第\
  \ 4 章的工作簿。\n\n1.  由于 Excel 将该值识别为日期，因此它会打开“设置单元格格式”对话框，并自动选中“日期”类别。选择类别后，你需要在“类型”区域中选择数据的显示方式。窗口的“示例”区域会显示，使用你在“类型”区域中选择的选项后，当前单元格中的数据将如何显示。如果你在工作表中选中了一个单元格区域，它将显示该区域中第一个单元格的显示效果。\n\
  \n2.  在“类别”区域中单击“数值”。“数值”类别提供了设置小数位数、使用千位分隔符以及选择负数显示方式的选项。\n\n3.  依次单击其他各个类别，熟悉格式化数据的不同选项。\n\
  \n4.  再次单击“日期”类别。\n\n5.  在“类型”区域中，选择 `Wednesday, March 14, 2012`。“示例”区域会显示此更改如何影响当前单元格的显示。\n\
  \n6.  单击“确定”按钮。\n\n7.  单元格 C3 可能会显示为一串 `#` 符号。这是什么意思？没错，是列宽不够。加宽列宽以查看结果。\n\n8. \
  \ 单击快速访问工具栏上的“保存”按钮 `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figah_HTML.jpg](img/385660_2_En_4_Figah_HTML.jpg)`。\n\
  \n9.  单击“会计专用”以更改单元格 C1 中的格式。\n\n10. 在单元格 C2 中输入 `3.25`。按 `Ctrl + Enter`。单击“数字格式”下拉框的下拉箭头。单击**分数**。分数格式将数字的小数部分转换为分数。小数部分\
  \ `.25` 被更改为 `1/4`。\n\n11. 在单元格 C3 中输入 `5/15/2012`。按 `Ctrl + Enter`。单击“数字”组中的对话框启动器（如图\
  \ 4-36 所示）以打开“设置单元格格式”对话框。参见图 4-37。\n\n`![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig37_HTML.jpg](img/385660_2_En_4_Fig37_HTML.jpg)`\n\
  图 4-37\n选中“数字”选项卡的“设置单元格格式”对话框\n\n`![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig36_HTML.jpg](img/385660_2_En_4_Fig36_HTML.jpg)`\n\
  图 4-36\n“数字”组\n\n12. 单击“货币”格式。\n\n13. 将 A 列的宽度更改为大约 13.43。\n\n14. 在单元格 A2 中键入 `3427.35`，但不要按\
  \ Enter 键。单击编辑栏中的“输入”按钮。\n\n15. 单击“数字”组中的“会计数字格式”按钮 `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figad_HTML.jpg](img/385660_2_En_4_Figad_HTML.jpg)`。注意单元格\
  \ A1 的“货币”格式与单元格 A2 的“会计专用”格式之间的区别。使用“会计专用”格式时，`$` 符号显示在单元格的最左侧位置。“会计专用”格式还在最后一位数字的右侧留出一个空格。\n\
  \n16. 在单元格 A3 中键入 `.85`。按 `Ctrl + Enter`。单击“数字”组中的 `%` 按钮。该值应显示为 `85%`。\n\n17. 在单元格\
  \ A4 中输入 `1385197`。按 `Ctrl + Enter`。单击“数字”组中的 **“千位分隔样式”** 按钮 `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figae_HTML.jpg](img/385660_2_En_4_Figae_HTML.jpg)`。该值显示为\
  \ `1,385,197.00`。\n\n18. 单击“减少小数位数”按钮 `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figaf_HTML.gif](img/385660_2_En_4_Figaf_HTML.gif)`。小数位数减少一位。再单击一次“减少小数位数”按钮。第二位小数被删除。单击两次“增加小数位数”按钮\
  \ `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figag_HTML.jpg](img/385660_2_En_4_Figag_HTML.jpg)`，将数值恢复为两位小数。\n\
  \n19. 在单元格 C1 中输入 `–385`。按 `Ctrl + Enter`。单击“数字格式”下拉框的下拉箭头。注意，“货币”格式将该值显示为 `−$385.00`，而“会计专用”格式则显示为\
  \ `($385.00)`。在会计专用格式中，负数显示在括号内。\n\n**注意：** 注意“科学记数”格式将该值显示为 `–3.85+E02`。处理整数时，“科学记数”格式将小数点放在最左边数字之后，将数字四舍五入到两位小数，并将其余部分显示为指数。\n\
  \n20. 创建一个名为 `NumberGroup` 的新工作表。\n\n21. 在单元格 A1 中键入 `1275.85`，但不要按 Enter 键。单击编辑栏中的“输入”按钮\
  \ `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figab_HTML.jpg](img/385660_2_En_4_Figab_HTML.jpg)`。单击“输入”按钮会确认你输入的值，并使当前单元格保持为活动状态。一旦值被确认，编辑栏上的“输入”和“取消”按钮会变灰。\n\
  \n22. 在“开始”选项卡的“数字”组中，单击“数字格式”下拉框的下拉箭头 `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figac_HTML.jpg](img/385660_2_En_4_Figac_HTML.jpg)`。注意，下拉框中的每个选项都显示了如果你单击该特定格式，单元格\
  \ A1 中的值将如何显示。\n\n**注意：** Excel 的日历从 1900 年 1 月 1 日开始。注意，“短日期”和“长日期”格式将日期显示为 1903\
  \ 年 6 月 28 日。之所以显示这个日期，是因为你在单元格 A1 中输入值的整数部分是 1275，而日期 **1903 年 6 月 23 日** 是自 1900\
  \ 年 1 月 1 日之后的第 1,275 天。\n\n你已经学习了如何使用功能区“数字”组中的工具来格式化数字数据。格式化数据是必要的，这样用户才能按预期解读数据，例如确保用户知道一个数字是百分比而不仅仅是数值。接下来，你将学习如何对齐单元格内的数据。\n\
  \n\n\n## 使用“对齐方式”组对齐数据\n\n“对齐方式”组位于“开始”选项卡中。见图 4-38。它包含用于垂直和水平对齐文本、旋转文本、增加和减少缩进、自动换行以及合并单元格的选项。表\
  \ 4-2 描述了“对齐方式”组中的每个选项。\n\n**表 4-2** 对齐按钮说明\n\n| 按钮 | 说明 |\n| --- | --- |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figai_HTML.jpg](img/385660_2_En_4_Figai_HTML.jpg)\
  \ | **垂直对齐** — “顶端对齐”、“垂直居中”和“底端对齐”按钮分别用于将文本对齐到单元格的顶部、中部和底部。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figaj_HTML.jpg](img/385660_2_En_4_Figaj_HTML.jpg)\
  \ | **方向** — 单击此按钮可调出用于选择单元格内文本角度和方向的选项。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figak_HTML.jpg](img/385660_2_En_4_Figak_HTML.jpg)\
  \ | **自动换行** — 用于将数据在单元格内分成多行显示。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figal_HTML.jpg](img/385660_2_En_4_Figal_HTML.jpg)\
  \ | **水平对齐** — “左对齐”、“居中”和“右对齐”按钮分别用于将文本对齐到单元格的左侧、中部和右侧。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figam_HTML.jpg](img/385660_2_En_4_Figam_HTML.jpg)\
  \ | **缩进** — “减少缩进量”按钮（左侧）用于减少单元格的缩进量。“增加缩进量”按钮（右侧）用于增加单元格的缩进量。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figan_HTML.jpg](img/385660_2_En_4_Figan_HTML.jpg)\
  \ | **合并后居中** — 此按钮提供合并单元格、合并后居中以及取消合并单元格的选项。 |\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig38_HTML.jpg](img/385660_2_En_4_Fig38_HTML.jpg)\n\
  \n**图 4-38** “开始”选项卡上的“对齐方式”组\n\n### 在单元格中容纳更多文本\n\nExcel 提供了三个选项来在单元格中容纳更多数据：\n\
  \n- **自动换行** — 文本自动换行到下一行。\n- **缩小字体填充** — 缩小单元格内容的尺寸，使其适应单元格。\n- **合并单元格** — 将多个单元格合并为一个单元格。\n\
  \n#### 自动换行\n\n如果文本在单元格中放不下，你可能希望将文本分成多行。Excel 有一个名为“自动换行”的功能，它可以格式化单元格，使文本自动换行。你可以通过选择想要自动换行的单元格，然后单击功能区中的“开始”选项卡来启用自动换行功能。在“对齐方式”组中，单击“自动换行”按钮。你也可以通过按\
  \ `Alt + Enter` 在任意位置强制换行。\n\n**注意：** 启用自动换行后，单元格中的数据会换行以适应列宽。当你更改列宽时，数据换行会自动调整。\n\
  \n图 4-39 展示了使用“自动换行”前后的示例。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig39_HTML.jpg](img/385660_2_En_4_Fig39_HTML.jpg)\n\
  \n**图 4-39** 图片的上半部分显示了使用“自动换行”前的文本，下半部分显示了应用“自动换行”后的文本。\n\n#### 缩小字体填充\n\n启用“缩小字体填充”选项会缩小单元格的内容，使其适应单元格的大小。图\
  \ 4-40 展示了使用前后的示例。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig40_HTML.jpg](img/385660_2_En_4_Fig40_HTML.jpg)\n\
  \n**图 4-40** 左侧的图片显示了使用“缩小字体填充”前的文本，右侧的图片显示了应用“缩小字体填充”后的文本。\n\n如果你输入了大量文本，除非你加宽列宽，否则文本可能会变得太小而无法看清。“缩小字体填充”选项位于“设置单元格格式”对话框的“对齐”选项卡上。见图\
  \ 4-41。有几种方法可以打开此选项卡。一种方法是单击“对齐方式”组的对话框启动器，然后选择“对齐”选项卡。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig41_HTML.jpg](img/385660_2_En_4_Fig41_HTML.jpg)\n\
  \n**图 4-41** 选中“对齐”选项卡的“设置单元格格式”对话框\n\n通过选中或清除 `缩小字体填充` 复选框，可以启用或禁用该选项。请注意，此处也有用于启用“自动换行”和“合并单元格”的选项。\n\
  \n#### 合并及取消合并单元格\n\n你可以使用三种不同的合并单元格选项之一来将多个单元格合并成一个更大的单元格：\n\n- 合并后居中\n- 跨越合并\n\
  - 合并单元格\n\n**合并后居中**选项会合并所选单元格，然后将数据在新扩展的单元格中水平居中显示。“合并后居中”按钮位于“开始”选项卡 -> “对齐方式”组中。\n\
  \n你可以通过让标题在工作表宽度范围内居中显示来改善电子表格的外观。在图 4-42 中，标题已输入到单元格 `A1` 中。如果标题能够在 A 列到 F 列之间居中显示，效果会更好。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig42_HTML.jpg](img/385660_2_En_4_Fig42_HTML.jpg)\n\
  \n**图 4-42** 居中前的标题\n\n要使标题在单元格中居中显示，你需要选择这些单元格，然后选择“合并后居中”选项。当你合并单元格 `A1`、`B1`、`C1`、`D1`、`E1`\
  \ 和 `F1` 后，最终得到一个占据这六个单元格空间的单元格。见图 4-43。这个单独的单元格的地址将是 `A1`。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig43_HTML.jpg](img/385660_2_En_4_Fig43_HTML.jpg)\n\
  \n**图 4-43** 单元格已合并且标题已居中\n\n“合并后居中”命令不仅可以合并水平相邻的单元格，还可以合并垂直相邻的单元格。尽管你可以合并垂直相邻的单元格，但“合并后居中”命令通常用于创建横跨多列的标签，或使标题跨报表显示。\n\
  \n单击“合并后居中”按钮右侧的下拉箭头可以访问所有合并选项。见图 4-44。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig44_HTML.jpg](img/385660_2_En_4_Fig44_HTML.jpg)\n\
  \n**图 4-44** 合并选项\n\n其他三个选项的功能如下：\n\n- **跨越合并**选项只能合并水平相邻的单元格。它不会使文本居中。\n- **合并单元格**选项可以合并水平或垂直相邻的单元格。与“跨越合并”选项类似，它不会使文本居中。\n\
  - 你可以通过选择要取消合并的单元格，然后单击**取消合并单元格**选项来取消合并单元格。\n\n\n\n### 对齐和缩进单元格中的文本\n\nExcel 提供了设置单元格中数据对齐方式（见表\
  \ 4-3）以及增加或减少单元格缩进（见表 4-4）的选项。\n\n表 4-4  \n增加和减少单元格中文本的缩进\n\n| 按钮 | 说明 |\n| ---\
  \ | --- |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figaq_HTML.jpg](img/385660_2_En_4_Figaq_HTML.jpg)\
  \ | **减少缩进**——用于减少单元格中的缩进量。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figar_HTML.jpg](img/385660_2_En_4_Figar_HTML.jpg)\
  \ | **增加缩进**——用于增加单元格中的缩进量。 |\n\n表 4-3  \n垂直和水平对齐\n\n| 按钮 | 说明 |\n| --- | --- |\n\
  | ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figao_HTML.jpg](img/385660_2_En_4_Figao_HTML.jpg)\
  \ | **垂直对齐**——这些按钮依次用于将文本对齐到单元格的顶部、中部和底部。默认情况下，Excel 将数据对齐到底部。 |\n| ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figap_HTML.jpg](img/385660_2_En_4_Figap_HTML.jpg)\
  \ | **水平对齐**——这些按钮依次用于将文本对齐到单元格的左侧、中部和右侧。 |\n\n#### 垂直和水平对齐文本\n\n在“设置单元格格式”对话框的“对齐”选项卡上，还有用于水平和垂直对齐的其他选项。见图\
  \ 4-45。其中一些选项与“开始”选项卡上“对齐”组中显示的选项相同，但这里还有更多选项，例如可以通过使用“缩进”数值文本框来设置左对齐、右对齐和分散对齐的缩进量。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig45_HTML.jpg](img/385660_2_En_4_Fig45_HTML.jpg)\
  \  \n图 4-45  \n对齐选项\n\n分散水平对齐方式在单元格文本的两侧使用相等的缩进量。因此，如果你在“缩进”中输入 3，那么单元格中输入的文本左侧和右侧将各有三个空格。\n\
  \n两端对齐水平对齐选项仅在单元格中输入多行文本时有用。Excel 会*两端对齐*除最后一行以外的每一行，通过调整字间距，使文本完全填满单元格的左右边界。见图\
  \ 4-46。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig46_HTML.jpg](img/385660_2_En_4_Fig46_HTML.jpg)\
  \  \n图 4-46  \n两端对齐方式\n\n#### 旋转文本\n\n单击“方向”按钮（图 4-47）会显示用于旋转文本的选项列表。前五个默认选项不言自明。如果要指定其他特定的方向，请选择最后一个选项**设置单元格对齐方式**。此选项会显示“设置单元格格式”对话框中的“对齐”选项卡。\n\
  \n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig47_HTML.jpg](img/385660_2_En_4_Fig47_HTML.jpg)\
  \  \n图 4-47  \n方向选项\n\n“设置单元格格式”对话框的“对齐”选项卡上的“方向”区域用于设置文本的角度。见图 4-48。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig48_HTML.jpg](img/385660_2_En_4_Fig48_HTML.jpg)\
  \  \n图 4-48  \n设置文本角度的选项\n\n你可以通过向上或向下拖动线条，或者通过设置度数来设定文本的显示角度。如果输入度数，Excel 会自动调整线条，反之亦然。将线条从\
  \ 0 度向上移动会使文本从下到上显示。将线条从 0 度向下移动会使文本从上到下显示。如果你在输入度数时希望文本从上到下显示，则需要输入负值。单击“方向”框左侧的“文本”按钮会将文本设置为完全垂直的格式。\n\
  \n**注意**  \n旋转文本时，单元格的大小会自动调整以适合旋转后的文本。\n\n### 练习 4-5：使用“对齐”组\n\n在本练习中，我们将创建如图 4-49\
  \ 所示的工作表。该工作表显示了在仙境大学参加 Office 集成和财务管理课程的学生信息。\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Fig49_HTML.jpg](img/385660_2_En_4_Fig49_HTML.jpg)\
  \  \n图 4-49  \n你将创建的工作表\n\n![../images/385660_2_En_4_Chapter/385660_2_En_4_Figas_HTML.jpg](img/385660_2_En_4_Figas_HTML.jpg)\n\
  \n1.  如果在上一次练习后关闭了工作簿，则可以打开第 4 章的工作簿，然后创建一个名为 `\"Align\"` 的新工作表。\n\n2.  在单元格 `A1`\
  \ 中输入 `Wonderland University`。单击公式栏上的“输入”按钮。\n\n3.  选中单元格 `A1:E1`。单击“合并后居中”按钮。\n\
  \n4.  选择 Lucida Calligraphy 字体。将字号更改为 18。\n\n5.  在单元格 `B2` 中输入列标题 `Student ID`，然后按\
  \ Tab 键。\n\n6.  在第 2 行中输入其余的列标题。\n\n7.  我们希望将列标题设置为 45 度角。在此之前，我们需要加宽列。\n\n**注意** 如果不加宽列，则会导致多个列标题位于同一列中，如下所示。\n\
  \n1.  在单元格 `B22` 中输入你的全名，然后按 Ctrl + Enter。右键单击单元格 `B22`。选择“设置单元格格式”。在“对齐”选项卡上，勾选**缩小字体填充**。单击“确定”按钮。你的姓名应完全适合在该单元格内。\n\
  \n2.  右键单击单元格 `B22`。选择“设置单元格格式”。在“对齐”选项卡上，勾选**自动换行**。单击“确定”按钮。\n\n3.  在单元格 `C23`\
  \ 中输入你的姓氏，然后按 Ctrl + Enter。右键单击单元格 `C23`。选择“设置单元格格式”。单击“方向”框左侧的垂直排列的**文本**一词。单击“确定”按钮。\n\
  \n4.  在仍选中单元格 `C23` 的情况下，单击“对齐”组中的以下按钮：单击“左对齐”按钮，然后单击“右对齐”按钮，最后单击“居中”按钮。\n\n5. \
  \ 单击快速访问工具栏上的“保存”按钮 ![../images/385660_2_En_4_Chapter/385660_2_En_4_Figbc_HTML.jpg](img/385660_2_En_4_Figbc_HTML.jpg)。\n\
  \n\n\n1.  我们可以通过让数据稍微靠左单元格边框右侧显示来改善电子表格的外观：\n    1.  选择单元格 `B3:E10`。点击`对齐方式`组中的`增加缩进量`按钮\
  \ `![../images/385660_2_En_4_Chapter/385660_2_En_4_Figba_HTML.jpg](img/385660_2_En_4_Figba_HTML.jpg)`。\n\
