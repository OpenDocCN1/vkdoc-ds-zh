  你已经学会了如何处理自己造成的任何输入错误。现在，你将了解一些 Excel 功能，它们不仅能防止你犯数据输入错误，同时还能提高数据输入速度。\n\n## 输入和更正数据的快捷方法\n\
  \nExcel 提供了`自动完成`、`从下拉列表中选择数据`、`自动填充`和`自动更正`等方法，以加快数据输入速度并确保数据输入无误。\n\n### 使用自动更正功能\n\
  \nExcel 的`自动更正`功能可以通过自动调整条目或在输入时修复常见的打字错误，来加快数据输入速度并防止工作表中出现错误。Excel 的`自动更正`功能在以下四种情况下非常有用：\n\
  \n*   *更正常见拼写错误的单词。* 如果你把“achieved”拼成“acheived”，Excel 会自动更正它。\n\n*   *输入无法直接从键盘输入的特殊符号。*\
  \ 如果你输入`(tm)`，Excel 会自动将其转换为商标符号 ™。\n\n*   *为经常输入的单词或短语创建快捷方式。* 你可以输入自己的姓名缩写，Excel\
  \ 会将其转换为你的全名。\n\n*   *更正大写字母的误用。* 如果你输入`monday`，Excel 会将其更正为`Monday`。\n\n> **注意**\
  \  \n> Microsoft Office 应用程序与 Excel 共享相同的`自动更正选项`；你对 Excel 中`自动更正`选项所做的任何更改、添加或删除，都会影响其他\
  \ Microsoft Office 应用程序中的这些选项，反之亦然。\n\n### 练习 3-6：使用自动更正\n\n在此练习中，你将体验 Excel 默认的`自动更正`功能，然后了解如何根据自己的偏好进行修改。如果你已关闭了上次练习中的第\
  \ 3 章工作簿，请重新打开它。\n\n1.  添加一个新的工作表并将其命名为`自动更正`。\n\n2.  在单元格`A1`中，输入`abbout`，然后按`Tab`键。Excel\
  \ 将其更正为`about`。\n\n3.  在单元格`B1`中，输入`(c)`，然后按`Tab`键。Excel 将`(c)`转换为版权符号。\n\n4.  在单元格`C1`中，输入`(r)`，然后按`Tab`键。Excel\
  \ 将`(r)`转换为注册商标符号。\n\n5.  在单元格`D1`中，输入你的名字，但将前两个字母大写，例如`DAvid`，然后按`Tab`键。\n\n你的结果应类似于图\
  \ 3-23 所示。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig23_HTML.jpg](img/385660_2_En_3_Fig23_HTML.jpg)\n\
