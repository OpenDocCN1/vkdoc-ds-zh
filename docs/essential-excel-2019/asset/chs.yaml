  \n\n\n## 组合图\n\n组合图是在单个图表中组合多种图表类型而成的图表。最常见的组合图由一个系列柱形图和另一个系列折线图组成。图 13-52 展示了一个组合图示例，其中销售数据和预测销售数据显示在同一图表中。销售数据以柱形图形式展示，预测销售数据以折线图形式展示。这样便于直观地看出哪些预测销售额高于实际销售额，哪些低于实际销售额。创建组合图的另一个原因是当不同系列中的数值存在巨大差异时。\n\
  \n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig52_HTML.jpg](img/385660_2_En_13_Fig52_HTML.jpg)\n\
  \n**图 13-52** 由柱形图和折线图构成的组合图\n\n### 练习 13-4：创建组合图\n\n在此示例中，您将创建一个由柱形图和折线图构成的组合图。观察图\
  \ 13-53，您会发现这两列数据之间的数值存在巨大差异。正如您将要看到的，这种差异会阻碍我们创建准确的柱形图。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig53_HTML.jpg](img/385660_2_En_13_Fig53_HTML.jpg)\n\
  \n**图 13-53** 名为“Combination”的工作表中的数据\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig54_HTML.jpg](img/385660_2_En_13_Fig54_HTML.jpg)\n\
