  \ 不会尝试重新创建它，而是会将你带到`Hyperlink_Practice`工作簿。在打开`Hyperlink_Practice`工作簿之前，Excel 可能会显示一个安全通知窗口。既然是你自己创建的超链接，可以确定它是安全的，所以点击`是`按钮。\n\
