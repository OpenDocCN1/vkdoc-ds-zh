  \ 右键单击其中一个工作表标签。选择“`取消组合工作表`”。\n3.  单击“`Sheet2`”标签。您会注意到，列宽没有自动调整为复制的数据。\n4.  调整\
  \ `Sheet2` 和 `Sheet3` 上的列宽。\n\n### 将数据从一个工作簿复制到另一个工作簿\n\n您可以通过从一个工作簿复制数据，然后使用某种粘贴方法将其粘贴到另一个工作簿中，来将数据从一个工作簿复制到另一个工作簿。\n\
  \n**练习 11-4：将数据从一个工作簿复制到另一个工作簿**\n\n本练习涵盖了在复制数据时使用各种粘贴选项。\n\n![../images/385660_2_En_11_Chapter/385660_2_En_11_Fig18_HTML.jpg](img/385660_2_En_11_Fig18_HTML.jpg)\n\
