  \ 1-25。\n\n### 识别当前单元格\n\n列由字母表示。行由数字表示。列字母与行号的组合为每个单元格提供了唯一的地址。工作表中的第一个单元格地址为`A1`。位于`G`列和第`5`行交叉处的单元格地址为`G5`。单元格地址也称为单元格引用。各个单元格包含文本、数字或公式。公式的结果会显示在插入该公式的同一个单元格中。\n\
  \n图 1-26 中的当前（活动）单元格是`B6`。可以通过以下方式识别当前单元格：\n\n![../images/385660_2_En_1_Chapter/385660_2_En_1_Fig26_HTML.jpg](img/385660_2_En_1_Fig26_HTML.jpg)\n\
  \n**图 1-26** – 识别当前单元格的不同方式\n\n-   其边框加粗。\n-   其列标和行标被高亮显示。\n-   其地址显示在名称框中。\n-\
  \   单元格的值或公式显示在编辑栏中。\n\n一旦识别出当前单元格，你就可以开始输入数据了！\n\n\n\n## 在工作表中输入数据\n\n只有在执行以下任一操作后，您在单元格中输入的数据才会被接受：\n\
  \n- 按下 `Tab` 键——光标移至下一个单元格。\n- 按下 `Enter` 键——光标移至下一个单元格。\n- 按下任意方向键——光标沿箭头方向移至下一个单元格。\n\
  - 单击编辑栏上的对勾图标——光标停留在当前单元格。\n- 按下 `Ctrl + Enter`——光标停留在当前单元格。\n\n**注意** 在数据被接受之前，无法对单元格中的数据进行格式设置。\n\
  \n如果要覆盖单元格中的所有数据，可以单击该单元格并键入新数据。如果只想更改单元格中的部分数据，则需要进入**编辑**模式。双击单元格可进入**编辑**模式；按下\
  \ `F2` 键也可达到相同效果。在单元格中输入数据时，数据会同时显示在活动单元格和编辑栏中。由于数据同时出现在单元格和编辑栏中，因此在任一位置进行修改都会更新单元格数据。\n\
