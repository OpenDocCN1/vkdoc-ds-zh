  \ 10-11。点击`确定`按钮。\n\n---\n\n**练习 10-4：创建指向新创建的 Excel 工作簿的超链接**\n\n你可以创建一个超链接，当首次点击它时，会创建一个新的\
  \ Excel 工作簿，然后打开该工作簿。此后每次点击它，都会打开该工作簿。这个 Excel 工作簿将被赋予你在超链接选项中指定的名称。\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig12_HTML.jpg](img/385660_2_En_10_Fig12_HTML.jpg)\n\
