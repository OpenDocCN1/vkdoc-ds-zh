  \n图 4-54\n\n应用格式刷的结果\n\n9.  在 C8 中键入单词 **Data**。使用自动填充柄拖动到 E9。在 C12 中键入 **Data**，并使用自动填充柄拖动到\
  \ C13。\n10. 通过从“字体”组中选择以下选项来设置单元格 A1 的格式：加粗、倾斜和下划线；将文本颜色更改为红色。\n11. 单击“对齐”选项卡上的“居中”按钮。\n\
