  \ 在单元格 `A1` 中输入“风城漫画”，并按如下格式设置：\n    1.  合并并居中单元格区域 `A1:E1`。\n    2.  将字体更改为 Harlow\
  \ Solid Italic，并将字号更改为 14。\n    3.  使用“填充颜色”应用浅金色背景色。\n    4.  应用粗框线边框。\n\n## 总结\n\
  \n移动和复制的区别在于，执行复制操作后，数据将同时存在于其原始位置和粘贴位置；而移动操作则会清除原始位置的数据，并将其存储到粘贴位置。`选择性粘贴` 命令的功能远不止将数据粘贴到单元格中。在粘贴的同时，它还可以执行计算。它提供了仅复制单元格值（不复制格式）或仅复制格式（不复制单元格值）的选项。`选择性粘贴`\
  \ 的 `转置` 选项可将行数据转换为列数据，或将列数据转换为行数据。`填充成组工作表` 选项可将数据从一个工作表复制到多个工作表中。\n\n每当您执行复制操作时，复制的数据都会临时存储在\
  \ Office 剪贴板中。Office 剪贴板一次最多可以存储 24 个项目。此剪贴板与其他 Office 产品共享，因此您可以轻松地在它们之间复制和粘贴。\n\
  \n在下一章中，您将了解如何将数据转换为表格。您可以对表格应用多种排序和复杂筛选，以便仅按您想要的顺序查看所需的数据。\n\n"
- "# 12. 使用表格\n\n表格是由标题行和多行数据行组成的数据集合。它用于包含单一类型的数据，例如订单、销售额、库存等。表格使筛选、排序、分析、汇总和格式化数据变得更加容易。\n\
  \n阅读并完成本章学习后，您应该能够：\n\n*   创建和格式化表格\n*   对表格进行排序和筛选\n*   向表格添加数据\n*   调整表格大小\n*\
  \   向表格添加计算字段\n*   创建切片器\n*   应用主题\n*   应用样式\n*   创建条件格式\n\n您可以从多个表格中提取数据来创建另一个表格。表格中的数据可以与工作表中的其他数据分开保存。您可以将现有的单元格区域格式化为表格。如果您不再希望数据以表格格式存在，也可以将其转换回普通区域。\n\
  \n本章最后一部分介绍条件格式。条件格式允许您根据单元格值应用格式或显示图标，从而提高数据的可读性。例如，如果单元格值小于 0，则列中的数据可以显示为粗体红色；如果值在\
  \ 0 到 1000 之间，则显示为蓝色；如果值大于 1000，则显示为绿色。您可以决定数据的格式化方式，并为这些格式创建规则。\n\n\n\n## 创建和格式化表格\n\
  \n创建和格式化表格的过程非常简单。选中你想要制成表格的数据，然后挑选一种你喜欢的格式即可。仅此而已。\n\n在工作表上，你通过点击`套用表格格式`按钮，就能将选中的数据格式化为表格。`套用表格格式`按钮位于`开始`选项卡下的`样式`组中。点击该按钮会弹出一个样式库供你选择，如图\
  \ 12-1 所示。这个样式库分为“浅色”、“中等深浅”和“深色”三类。有些样式带有彩色列标题；有些有单元格边框，有些没有；有些每隔一行使用不同颜色，有些则没有。如果你不喜欢\
  \ Excel 提供的任何一种样式，你还可以创建自己的样式。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig1_HTML.jpg](img/385660_2_En_12_Fig1_HTML.jpg)\n\
  \n图 12-1\n\n样式库。选择你想要用于格式化表格的样式\n\n当你选择一种样式后，Excel 会弹出`套用表格格式`对话框。如果你之前还没有选中要作为表格的单元格，此时可以选中。如果你选中的数据包含标题，请确保选中`表包含标题`复选框。见图\
  \ 12-2。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig2_HTML.jpg](img/385660_2_En_12_Fig2_HTML.jpg)\n\
  \n图 12-2\n\n选择你想要变成表格的单元格。如果包含标题，请确保选中`表包含标题`\n\n## 对表格进行排序和筛选\n\n表格在每个列标题的右侧会显示一个下拉箭头。点击其中一个下拉箭头会弹出该列的排序和筛选选项，如图\
  \ 12-3 所示。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig3_HTML.jpg](img/385660_2_En_12_Fig3_HTML.jpg)\n\
  \n图 12-3\n\n选择标题右侧的下拉箭头以选择筛选器\n\n列中出现的每个唯一值都会显示出来。如果一列中有重复值，它们不会在列表中重复出现。\n\n移除某个值前面的复选框勾选标记，将会阻止包含该值的行显示。如果你移除了多个勾选标记，可以通过选择`(全选)`快速重新选中所有值。如果你只想选择少量项目进行筛选，可以取消勾选`(全选)`，然后仅点击你想包含在表格中的项目。\n\
  \n筛选操作不会重新排列或更改你的数据；它只是临时隐藏那些不符合你指定条件的行。移除筛选后，表格将恢复到应用筛选之前的状态。\n\n已应用筛选的列很容易识别，因为其下拉箭头按钮会变为筛选按钮![../images/385660_2_En_12_Chapter/385660_2_En_12_Figa_HTML.jpg](img/385660_2_En_12_Figa_HTML.jpg)。当你将光标悬停在筛选按钮上时，Excel\
  \ 会显示一个工具提示，说明当前筛选的内容。\n\n## 向 Excel 表格添加数据\n\n你可以通过在表格最后一条记录的下方行中直接输入，向表格添加额外记录。当你按下`Enter`键完成记录输入后，它就会自动成为表格的一部分。你也可以通过在最右侧列的右侧输入新列，以类似方式添加新列。另外，你还可以拖动位于表格右下角的表格扩展柄![../images/385660_2_En_12_Chapter/385660_2_En_12_Figb_HTML.jpg](img/385660_2_En_12_Figb_HTML.jpg)来扩展表格，使其包含更多行或列。然后你就可以在扩展区域中输入额外数据。你也可以在表格中的任意位置插入行或列。如果插入新列，该列的标题将被命名为`列`。双击列标题，可以将其更改为你想要的名称。\n\
  \n通过执行以下步骤，可以停止表格的自动扩展：\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig4_HTML.jpg](img/385660_2_En_12_Fig4_HTML.jpg)\n\
  \n图 12-4\n\n取消勾选`在表格中包括新行和列`\n\n1.  点击`文件` ➤ `选项`。\n2.  在左侧窗格中点击`校对`。\n3.  在右侧窗格中点击`自动更正选项`按钮。\n\
  4.  点击`键入时自动套用格式`选项卡。\n5.  取消勾选`工作中自动将新行和列包含在表格中`。见图 12-4。\n6.  点击`确定`。\n7.  点击`确定`。\n\
