  **删除数据透视图**\n\n1.  单击数据透视图。\n2.  按 `Delete` 键。\n\n您已经学习了如何从源数据以及从数据透视表创建数据透视图。您还学习了如何从同一数据源创建不同的数据透视表，以及如何使用数据透视表和数据透视图向导。\n\
  \n接下来，您将学习如何从不同来源获取数据，并通过关键字段将它们链接起来。\n\n## 在关系数据库上创建数据透视表\n\n当您能将数据透视表应用于相互链接的多个文件时，它的功能会变得更加强大。您可以通过关系数据库来实现这一点。\n\
  \n当我们想到数据库时，通常会想到 Access、SQL Server、Oracle 等程序。我们可以将这些程序中的数据导入 Excel。然而，我们也可以直接在\
  \ Excel 中创建小型的关系数据库。关系数据库是通过一个公共字段链接多个表来创建的。这些表可以链接在一起，以创建一个数据透视表。\n\n关系数据库由主表和明细表组成。如果您之前使用过\
  \ Access，可能对这个概念很熟悉。主表和明细文件中必须有一个公共字段，表通过该字段链接在一起。一个主记录对应一个或多个明细记录。\n\n图 15-58 显示了一个“客户”表，图\
  \ 15-59 显示了一个“订单”表。这两个表可以通过公共字段 `CustomerID` 进行链接。“客户”表中的每个客户都被分配了一个唯一的 `CustomerID`。每个客户可以下多个订单；因此，“订单”表中的\
  \ `CustomerID` 字段不是唯一的。我们将这两个表之间的这种关系称为一对多关系。用于链接表的字段称为键。唯一的公共字段称为主键。多端的公共字段称为外键。查看这两个表，您会发现\
  \ `CustomerID` 必须先存在于“客户”表中，然后才能在“订单”表中使用。\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig59_HTML.jpg](img/385660_2_En_15_Fig59_HTML.jpg)\n\
  \n**图 15-59**\n\n“订单”表\n\n![../images/385660_2_En_15_Chapter/385660_2_En_15_Fig58_HTML.jpg](img/385660_2_En_15_Fig58_HTML.jpg)\n\
  \n**图 15-58**\n\n“客户”表\n\n练习 15-5：在关系数据库上创建数据透视表\n\n在本练习中，您将首先创建主表，然后创建明细表。接着，您将把两个表链接起来。最后，您将创建一个使用这两个链接表的数据透视表。\n\
