  \n图 9-8\n告知需要在单元格中输入何种内容的消息\n\n1.  单击“错误警告”选项卡。\n\n2.  为样式选择“停止”。“停止”样式会阻止接受无效输入。\n\
  \n3.  输入标题“订单 ID 错误”。\n\n4.  输入错误消息“订单 ID 只能以字母 SR 或 GR 开头”。见图 9-7。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig7_HTML.jpg](img/385660_2_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7\n创建进行无效输入时的错误消息\n\n5.  单击“确定”按钮。\n\n1.  单击“输入信息”选项卡。如果您查看“订单 ID”下方的 H 列，您会看到在“输入信息”选项卡上，您需要输入标题“订单\
  \ ID 限制”和输入消息“订单 ID 必须以字母 SR 或 GR 开头”。现在进行这些输入。您的“输入信息”选项卡应如图 9-6 所示。\n\n![../images/385660_2_En_9_Chapter/385660_2_En_9_Fig6_HTML.jpg](img/385660_2_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6\n选择订单 ID 单元格时出现的消息\n\n“输入信息”选项卡上的输入消息告知用户任何输入限制，但如果用户违反了在“设置”选项卡上输入的规则，我们希望显示一条错误消息。\n\
