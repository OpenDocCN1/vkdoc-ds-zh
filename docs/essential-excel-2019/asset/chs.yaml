  \ `Macro Stop Recording`（宏停止录制）按钮。\n\n10. 在功能区上的 `Home`（开始）选项卡的 `Font`（字体）组中，点击\
  \ `Bold`（加粗）和 `Italics`（斜体）按钮。将字体大小更改为 16。将 `Fill Color`（填充颜色）更改为橙色，着色 2，浅色 80%。参见图\
  \ 19-2。\n\n11. 创建一个新工作簿：\n    1.  点击 `File`（文件）选项卡，然后选择 `Save As`（另存为）。\n    2.\
