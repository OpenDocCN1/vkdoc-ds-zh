  6. 单击文本窗格中的第二个文本块。在`创建图形`组中，单击`添加形状`的下拉箭头按钮。选择**在下方添加形状**。\n\n现在，文本块的顺序已经符合我们要求，我们可以输入各职位的职务了。\n\
  \n7. 在图表或文本窗格中输入每个职位的职务。在其中任一位置输入职务都会自动同步到另一个位置。请参见图 17-46。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig46_HTML.jpg](img/385660_2_En_17_Fig46_HTML.jpg)\n\
  \n图 17-46\n\n在窗格中输入文本，文本将出现在图表中，反之亦然\n\n1. 单击文本窗格中的第三行文本。请参见图 17-45。单击功能区中的`设计`选项卡。在`创建图形`组中，单击`升级`按钮。\n\
  \n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig45_HTML.jpg](img/385660_2_En_17_Fig45_HTML.jpg)\n\
  \n图 17-45\n\n底行的文本块被移动到第二行\n\n1. 创建一个新工作表。\n2. 单击功能区中的`插入`选项卡。在`插图`组中，单击`SmartArt`。\n\
  3. 单击左侧窗格中的每个类别以查看不同的图表。`全部`组显示所有可用的图表。\n4. 单击左侧窗格中的`层次结构`。单击右侧窗格中的`表格层次结构`。它是第二行中的最后一个图表。然后单击`确定`。\n\
  \n图表左侧会出现一个箭头按钮。请参见图 17-44。单击此按钮可以打开或关闭文本窗格。我们首先需要调整文本窗格，使其与我们想要的组织结构图外观相匹配。\n\n\
  ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig44_HTML.jpg](img/385660_2_En_17_Fig44_HTML.jpg)\n\
  \n图 17-44\n\n箭头按钮用于打开或关闭文本窗格\n\n所有的网格线可能会分散注意力。您可以通过两种方法移除它们：一种是关闭网格线，另一种是使用填充。\n\
  \n### 通过关闭网格线移除网格线\n\n1. 单击功能区中的`视图`选项卡。\n2. 在`显示`组中，取消勾选“网格线”。\n\n这将移除整个工作表的网格线。如果您不打算在工作表单元格中输入其他数据，这是最佳方法。\n\
  \n3. 在`显示`组中，勾选“网格线”以恢复网格线，供下一练习使用。\n\n### 通过使用填充移除网格线\n\n1. 单击总裁形状左侧或右侧的空白区域以选中整个组织结构图。单击功能区中的`设计`选项卡。\n\
  2. 单击布局的`其他`按钮。选择**水平标签层次结构**图表。\n3. 单击功能区中的`设计`选项卡。在`SmartArt 样式`组中，单击`更改颜色`按钮。将光标悬停在库中的对象上，查看它们对图表的影响。\n\
  4. 选择“主题颜色(主要)”下的第一个对象。\n5. 右键单击图表中的“总裁”形状。选择“更改形状”。\n6. 在“星与旗帜”组中，选择“横卷形”。\n7.\
  \ 单击功能区中的`格式`选项卡。在`形状样式`组中，单击`形状填充`。选择您喜欢的颜色。请参见图 17-50。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig50_HTML.jpg](img/385660_2_En_17_Fig50_HTML.jpg)\n\
  \n图 17-50\n\n为形状填充选择一种颜色\n\n1. 单击组织结构图的任意位置。\n2. 单击功能区中的`设计`选项卡。在`布局`组中，单击第一行中的第二个图表。这是“图片组织结构图”。\n\
  3. 单击“总裁”的图片图标 ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fige_HTML.jpg](img/385660_2_En_17_Fige_HTML.jpg)。\n\
  \n这将弹出“插入图片”窗口，您可以在其中从计算机或 Internet 中选择图片。\n\n4. 单击**来自文件**。浏览到“President”图片。单击`插入`按钮。\n\
  5. 对“销售副总裁”执行相同操作。使用图片 VPofSales。请参见图 17-49。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig49_HTML.jpg](img/385660_2_En_17_Fig49_HTML.jpg)\n\
  \n图 17-49\n\n使用图片 VPofSales\n\n1. 选中图表周围的所有单元格。\n2. 单击功能区中的`开始`选项卡。\n3. 在`字体`组中，单击`填充颜色`按钮，然后选择“白色”。\n\
  4. 单击边框的向下箭头，然后选择**粗框线**。请参见图 17-48。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig48_HTML.jpg](img/385660_2_En_17_Fig48_HTML.jpg)\n\
  \n图 17-48\n\n带有粗外框线的姓名和职务组织结构图\n\n现在，组织结构图已符合我们的要求，我们可以从多种不同的布局选项中进行选择。\n\n您已经学习了如何使用图像、形状和布局创建令人印象深刻的工作表。接下来，您将学习如何向工作表添加您自己或他人创建的音频和视频。\n\
  \n\n\n## 在工作表中插入声音\n\n制作自己的音频是一个非常简单的过程。你可以购买一个物美价廉的麦克风，而如果你有笔记本电脑，它可能内置了麦克风。你可以向工作簿中添加音频，以提供操作指导、有关工作簿中数据的信息，或解释某些操作的原因。\n\
  \n你可以将音频文件嵌入到工作簿中，也可以创建指向该音频文件的链接。视频文件也同样如此。如果创建指向音频文件的链接，该文件并不作为工作簿的一部分存在。当播放音频文件时，Excel\
  \ 会搜索你指定的位置（路径）中的文件。如果你将文件从该位置移走，Excel 将无法找到它。\n\n通过以下步骤为工作表添加声音：\n\n1.  选择要插入声音附近的单元格。\n\
  2.  确保显示功能区的`插入`选项卡。\n3.  单击`文本`组中的`对象`工具。Excel 会显示`对象`对话框。\n4.  单击`由文件创建`选项卡。\n\
  5.  使用对话框中的控件来定位你想要包含到文档中的声音文件。\n6.  单击`确定`。文档中会插入一个看起来像扬声器的图标。\n\n之后，你只需双击该扬声器图标即可收听声音文件。你也可以将图标移动到工作表上的其他位置。\n\
  \n### 练习 17-9：向工作表添加音频\n\n在本练习中，你将把一个音频文件嵌入到工作表中。\n\n1.  单击`打开`按钮。音频应开始播放。\n2. \
  \ 单击`浏览`按钮，然后找到文件 `ExcelAudioFile`。单击`插入`按钮。\n3.  单击`确定`按钮。由于你没有选择`链接到文件`，因此该文件将被嵌入到你的工作簿中。\n\
  4.  双击`音频`图标。参见图 17-52。\n\n   ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig52_HTML.jpg](img/385660_2_En_17_Fig52_HTML.jpg)\n\
  \n   **图 17-52**  \n   如果要播放音频文件，请双击此图标\n\n   此时会打开`打开包内容`对话框。参见图 17-53。\n\n   ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig53_HTML.jpg](img/385660_2_En_17_Fig53_HTML.jpg)\n\
  \n   **图 17-53**  \n   `打开包内容`对话框\n\n5.  向工作簿添加一个新工作表。\n6.  单击功能区的`插入`选项卡。在`文本`组中，单击`对象`按钮。此时显示`对象`对话框。\n\
  7.  单击`由文件创建`选项卡。参见图 17-51。\n\n   ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig51_HTML.jpg](img/385660_2_En_17_Fig51_HTML.jpg)\n\
  \n   **图 17-51**  \n   `对象`对话框中的`由文件创建`选项卡\n\n## 在工作表中插入视频\n\n为了在 Excel 中播放视频文件，你需要有一个可以播放视频的软件程序，例如\
  \ Windows Media Player。\n\n与音频文件一样，视频文件可以嵌入到工作表中，也可以链接到工作表中。如前所述，链接文件的问题在于，如果在创建链接后移动了该文件，或者将其分发给他人，Excel\
  \ 将无法找到它。如果你选择不链接文件，该文件将成为工作簿的一部分。如果视频文件很大，你的工作簿自然会占用更多空间。\n\n视频和音频文件添加到工作表中的方法相同。\n\
  \n### 练习 17-10：向工作表添加视频\n\n在本练习中，你将把一个视频文件嵌入到工作表中。\n\n1.  `打开包内容`对话框打开。单击`打开`按钮。视频文件将在计算机的默认视频播放器中开始播放。\n\
  2.  将光标放置在你希望显示视频文件图标的位置。\n3.  单击功能区的`插入`选项卡。在`文本`组中，单击`对象`按钮。此时显示`对象`对话框。\n4. \
  \ 单击`由文件创建`选项卡。\n5.  单击`浏览`按钮，然后找到文件 `Transpose`。单击`确定`按钮。\n6.  双击`视频`图标。参见图 17-54。\n\
  \n   ![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig54_HTML.jpg](img/385660_2_En_17_Fig54_HTML.jpg)\n\
  \n   **图 17-54**  \n   双击`视频`图标以开始播放视频\n\n## 总结\n\n你已经了解了多媒体如何带来视觉冲击，以及如何提高用户掌握你想要传达的信息的速度。多媒体使你的工作表看起来更精美、更专业，同时也赋予你更强大的能力来传达你的信息。\n\
  \n你可以从计算机或互联网向工作表中添加图片。你已经了解了如何通过让文本沿路径排列，使用艺术字创建徽标。\n\n截图可用于捕获整个屏幕或来自网站或其他应用程序的选定部分，然后将该捕获内容放置在当前工作表中。捕获的内容会以图像形式添加到工作表中。你可以像修改其他任何图像一样修改它。\n\
  \n你已经学会了如何使用形状和 SmartArt 创建流程图、组织结构图和其他类型的布局。你可以添加、修改和删除多种形状。\n\n添加音频和视频非常简单。你可以将文件嵌入到工作簿中，也可以链接到它们。你可以购买一个物美价廉的麦克风来录制你的音频笔记。为了在\
  \ Excel 中播放视频文件，你需要有一个可以播放视频的软件程序，例如 Windows Media Player。\n\n在下一章中，你将看到操作图标的各种方法。你将学习如何使用新的\
  \ 3D 图像以及如何使用能够让你对不同的对象组合进行组合和取消组合的对象组。\n\n\n\n"
- "# 图标、3D 图像与对象组合\n\nExcel 提供了数百个图标供你使用。图标和 SVG 文件可以转换为形状。然后，图标或 SVG 文件中的每个独立形状都可以单独或一起移动、旋转、设置格式、复制或删除。Excel\
  \ 2019 还引入了可 360 度旋转的 3D 图像。\n\n阅读并学习完本章后，你将能够：\n\n- 将图标和 SVG 文件转换为形状\n- 处理图标或 SVG\
  \ 文件中的各个组成部分\n- 使用 3D 对象\n- 更改对象的可见性\n- 更改对象的顺序\n- 对对象进行组合、取消组合和重新组合\n\nExcel 的图标位于功能区“插入”选项卡的“插图”组中。见图\
  \ 18-1。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig1_HTML.jpg](img/385660_2_En_18_Fig1_HTML.jpg)\n\
  \n**图 18-1** 图标\n\n要查找你需要的图标，请点击不同的类别。你也可以通过滚动浏览图标来找到所需图标。另一种查找图标的方法是输入搜索关键词。我将输入关键词\
  \ *phone*。见图 18-2。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig2_HTML.jpg](img/385660_2_En_18_Fig2_HTML.jpg)\n\
  \n**图 18-2** 搜索“电话”\n\n当你选择一个图标时，其右上角会出现一个复选标记。“插入”按钮会显示你将插入的图标数量。点击“插入”按钮会将选中的图标放置到你的工作表中。见图\
  \ 18-3。你可以通过向外拖动右下角的手柄来放大电话，同时保持图像比例不变。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig3_HTML.jpg](img/385660_2_En_18_Fig3_HTML.jpg)\n\
  \n**图 18-3** 更改图标大小\n\n我们希望创建一个如图 18-4 所示的图像。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig4_HTML.jpg](img/385660_2_En_18_Fig4_HTML.jpg)\n\
  \n**图 18-4** 待复制的图像\n\n我们需要将电话内部变为灰色。为此，我们需要添加一个矩形形状来填充电话内部，然后将其填充为灰色。我们可以点击功能区的“插入”选项卡，点击“形状”，然后选择矩形形状。拖动该形状使其填充电话内部。然后，我们转到“开始”选项卡，使用“填充颜色”将矩形填充为灰色。接下来，我们将点击功能区的“插入”选项卡，点击“图片”，然后选择一张图像。然后可以调整图像大小以适合电话。名称“Rhianna”是使用艺术字创建的。艺术字位于功能区“插入”选项卡的“文本”组中。我们只需选择想要的样式，输入名称，将其拖到所需位置，选择文本，并更改字体大小使其合适。见图\
  \ 18-5。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig5_HTML.jpg](img/385660_2_En_18_Fig5_HTML.jpg)\n\
  \n**图 18-5** 更改艺术字的字体大小\n\n现在，我们可以在底部添加太阳。太阳是另一个图标。可以使用与电话相同的流程来创建它。点击功能区的“图标”按钮，然后在搜索框中输入单词\
  \ *sun*，点击我们想要使用的太阳图标，然后点击“插入”按钮。可以调整图标大小并将其拖动到任何你想要的位置。太阳的颜色可以更改为金色；为此，我们可以右键点击太阳，点击“填充颜色”图标，然后选择一种金色。\n\
  \n## 组合与取消组合图标、图像、形状和艺术字\n\n图像现在已完成，但如果你移动我们创建的任何对象，它们将与其他对象分开移动。我们希望所有对象被当作一个整体电话来对待。要组合所有对象，请点击其中一个对象，然后按住\
  \ `Ctrl` 键同时点击其他对象。右键点击并选择“组合”，然后再次选择“组合”。见图 18-6。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig6_HTML.jpg](img/385660_2_En_18_Fig6_HTML.jpg)\n\
  \n**图 18-6** 组合对象\n\n现在，当你移动或旋转电话时，所有对象将一起移动。见图 18-7。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig7_HTML.jpg](img/385660_2_En_18_Fig7_HTML.jpg)\n\
  \n**图 18-7** 组合后的对象一起移动\n\n各个对象仍然可以单独选中，并且可以单独或一起设置格式。如果我选中电话图标和矩形形状，功能区将在“绘图工具”上下文选项卡下显示一个“格式”选项卡。然后，你可以应用任何形状样式或形状效果。图\
  \ 18-8 显示了对电话和矩形形状应用了蓝色填充颜色。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig8_HTML.jpg](img/385660_2_En_18_Fig8_HTML.jpg)\n\
  \n**图 18-8** 对电话和矩形形状应用蓝色填充颜色\n\n你可以对整个电话应用图片样式，或者点击图像并仅对其应用图片样式。你可以通过选中要取消组合的对象，然后右键点击“组合”并选择“取消组合”，来取消组合部分或所有对象。\n\
  \n### 练习 18-1：将图标转换为形状\n\n在本练习中，你将创建一个如图 18-9 所示的农夫图标。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig9_HTML.jpg](img/385660_2_En_18_Fig9_HTML.jpg)\n\
  \n**图 18-9** 本练习中要创建的图像\n\n开始一个新工作表。点击功能区的“插入”选项卡。在“插图”组中，点击“图标”。花些时间滚动浏览图标。点击左上角的“搜索图标”。输入单词\
  \ *farmer*。Excel 会显示三个与农夫相关的图标。见图 18-10。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig10_HTML.jpg](img/385660_2_En_18_Fig10_HTML.jpg)\n\
  \n**图 18-10** 输入 farmer 进行搜索时可用的图标\n\n点击农夫图标。点击“插入图标”窗口右下角的“插入”按钮，将图标放置到你的工作表上。你可以将图标拖动到任何位置，并使用调整大小手柄来调整其大小。你可以应用任何图形样式。你可以应用任何所需的颜色。你可以应用任何图形效果。\n\
  \n#### 将图标转换为形状\n\n1. 为了将图标分离成独立的形状，你必须选中图标，然后点击功能区的“格式”选项卡，并在“更改”组中选择“转换为形状”。Excel\
  \ 会要求你确认是否要将图标转换为绘图对象。点击“是”按钮。\n\n2. 农夫现在变成了六个独立的形状。点击他的帽子以将其选中。每当你点击一个形状时，会显示一个旋转按钮。你可以使用此按钮向任一方向旋转形状。使用此按钮倾斜农夫的帽子。在帽子仍处于选中状态时，点击“填充颜色”的下拉箭头，然后选择一种蓝色。\n\
  \n3. 选中干草叉。在功能区上，点击“绘图工具”下的“格式”选项卡。在“形状样式”中，选择一种金色渐变填充。转到“形状效果”，然后选择一种 3-D 旋转效果。\n\
  \n4. 通过点击构成农夫身体的形状，然后在“开始”选项卡中选择白色字体颜色，来向农夫添加文本。键入 `Farmer`。\n\n5. 干草叉不需要了。点击干草叉，然后按键盘上的\
  \ `Delete` 键。\n\n#### 添加其他形状\n\n\n\n## 在 Excel 中对对象进行组合、取消组合和重新组合\n\n### 为农夫添加眼睛\n\
  \n1. 这位农夫真的需要一些眼睛。在功能区 `插入` 选项卡的 `插图` 组中，单击 `形状`。选择椭圆形。在农夫的脸上拖出一个圆形作为左眼。按住 `Ctrl`\
  \ 键（光标应显示加号）并将左眼向右拖动，创建右眼。\n\n### 组合对象\n\n1. 将农夫稍微拖动一下。注意他的眼睛并没有随之移动。将眼睛与农夫组合可以解决这个问题。选中农夫后，按住\
  \ `Ctrl` 键并单击每一只眼睛。然后，右键单击并选择 `组合`，接着再选择 `组合`。这样就将这些形状组合在一起了。现在移动农夫，他的眼睛应该会随之移动。\n\
  \n### 在其他位置使用形状\n\n1. 假设您只想在另一个区域使用帽子。双击帽子以将其选中。右键单击帽子并选择 `复制`。转到电子表格上的另一个位置，右键单击并选择一个粘贴选项。\n\
  \n---\n\n### 练习 18-2: 组合、取消组合和重新组合\n\n在本课中，我们将学习如何组合、取消组合和重新组合多个图标。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig12_HTML.jpg](img/385660_2_En_18_Fig12_HTML.jpg)\n\
  \n**图 18-12** – 通过创建彩色背景来突出显示图像\n\n1. 在已经选中农夫的情况下，按住 `Ctrl` 键并单击谷仓。现在两个图标都已选中，通过单击功能区\
  \ `图形工具` 标题下的 `格式` 选项卡，然后在 `更改` 组中单击 `转换为形状` 按钮，将图标更改为形状。Excel 会要求确认将这些图标转换为绘图对象。单击\
  \ `是` 按钮。\n\n2. 您需要将这两个图标视为一个整体。为此，需要将它们组合在一起。单击功能区的 `格式` 选项卡，在 `排列` 组中单击 `组合` 按钮，然后选择\
  \ `组合`；或者您也可以右键单击，然后选择 `组合`。\n\n3. 由于它们现在被视为一个整体，可以一起移动。如果您更改其中一个的大小，另一个的大小也会随之更改。移动农夫或谷仓，两者应该一起移动。任何应用的格式都会同时应用于两者。单击功能区的\
  \ `格式` 选项卡。单击 `形状样式` 的下拉箭头。将光标拖过它们，注意它对农夫和谷仓产生的效果。尝试对 `形状效果` 执行相同操作。\n\n4. 单击 `组合`\
  \ 按钮并选择 `取消组合`。它们仍然组合在一起；您必须单击其他区域才能取消选择它们。\n\n5. 接下来，您将更改谷仓及其屋顶的颜色。双击谷仓，然后按住 `Ctrl`\
  \ 键并单击屋顶。要更改颜色，请单击 `形状填充颜色` 下拉箭头![../images/385660_2_En_18_Chapter/385660_2_En_18_Figa_HTML.jpg](img/385660_2_En_18_Figa_HTML.jpg)并选择红色。\n\
  \n6. 接下来，您将把太阳及其光线更改为黄色。单击其中一条光线，然后按住 `Ctrl` 键并单击太阳和其他光线。将 `形状填充颜色` 更改为黄色。如果您漏选了任何光线，请选中它们，然后选择\
  \ `形状填充颜色`。\n\n7. 为了突出显示图像，您可以给背景上色。单击太阳上方和左侧的一个单元格，然后拖过其他单元格，使其形成一个覆盖两个图像的矩形。单击\
  \ `开始` 选项卡上 `填充颜色` 的下拉箭头，选择金色。见图 18-12。\n\n1. 使用一个新工作表。在功能区 `插入` 选项卡的 `插图` 组中，单击\
  \ `图标` 按钮。在搜索区域输入 `farmer`。\n\n符合搜索条件的图标会显示出来。单击谷仓和农夫。\n\nExcel 会在这些图标旁边分别打上对勾，以便您轻松识别已选中的图标。右下角的\
  \ `插入` 按钮括号内有一个 `2`，表明您将向电子表格中插入两个图标。单击 `插入` 按钮。图标会相互重叠。单击其他区域取消选中它们。将它们拖到电子表格的中央，但彼此保持一定距离。\n\
  \n2. 单击谷仓并调整其大小。单击农夫并调整其大小。图标的大小和位置应如图 18-11 所示。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig11_HTML.jpg](img/385660_2_En_18_Fig11_HTML.jpg)\n\
  \n**图 18-11** – 图标的大小和位置\n\n现在，您已经练习了将图标转换为形状，以及操作和着色这些形状。您可以对 SVG 文件执行完全相同的操作。SVG\
  \ 文件是可缩放矢量图形文件。SVG 文件的优点之一是它们可以放大到任意大小而不会损失任何质量。文件名的扩展名为 `.svg`。您可以从互联网上找到大量免费可下载的\
  \ SVG 文件。只需搜索 `SVG files` 即可。\n\n\n\n## 3D\n\nExcel 已增加了显示可旋转 3D 模型的功能。3D 模型可在 Word、Excel\
  \ 或 PowerPoint 中使用。这些 3D 模型位于功能区（Ribbon）的“插入”选项卡的“插图”组中。\n\n你可以从计算机或 OneDrive 上的文件中选择一个\
  \ 3D 模型，也可以从在线源获取模型。如果单击“从在线源”，你将看到分类的 3D 模型组。参见图 18-13。前三个组是动画组。（你的显示可能与示例不同。你可能没有动画组。这是本书出版时\
  \ Office 365 的外观。）\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig13_HTML.jpg](img/385660_2_En_18_Fig13_HTML.jpg)\n\
  \n图 18-13\n3D 图像类别\n\n如果你想要一个在这些组中不可用的模型，你可以在文本框中输入你想要的内容，然后按 Enter 键。输入你想要的单数形式。例如，输入\
  \ `house`，而不是 `houses`，否则你可能得不到任何结果。有时你可能需要输入复数形式，例如如果你想要 `legs` 而不是一条 `leg`。有许多可用的程序允许你创建\
  \ 3D 图像或将图像转换为 3D 图像，例如 Microsoft 的 Paint 3D。\n\n图 18-14 显示了从“医疗”组中选择的大脑和心脏。\n\n\
  ![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig14_HTML.jpg](img/385660_2_En_18_Fig14_HTML.jpg)\n\
  \n图 18-14\n选中后堆叠的 3D 图像\n\n当你引入多个 3D 对象时，它们会被放置在一起。你需要取消选中它们，以便可以单独移动它们。单击电子表格中的另一个位置将取消选中它们。然后你可以将对象拖动到你想要的位置。\n\
  \n当选中一个 3D 模型时，你会在模型中心看到一个旋转图标。参见图 18-15。你可以单击此旋转图标，向任何方向（上、下、左、右）旋转心脏。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig15_HTML.jpg](img/385660_2_En_18_Fig15_HTML.jpg)\n\
  \n图 18-15\n心脏中心的旋转图标\n\n当你选中一个 3D 模型时，你会在功能区上方看到标签“3D 模型工具”。在该标签下方是名为“格式”的上下文相关选项卡。除了旋转\
  \ 3D 模型之外，你可能在功能区的 3D 模型视图中发现模型已经处于你想要的位置。参见图 18-16。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig16_HTML.jpg](img/385660_2_En_18_Fig16_HTML.jpg)\n\
  \n图 18-16\n可选择的已旋转 3D 模型视图\n\n你可以通过单击其中一个 3D 模型，然后按住 `Ctrl` 键并单击另一个来对它们进行分组。当两个模型都被选中时，你可以右键单击，然后选择“组合”，再选择“组合”。当对象被分组后，两个模型周围会出现一个边框。参见图\
  \ 18-17。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig17_HTML.jpg](img/385660_2_En_18_Fig17_HTML.jpg)\n\
  \n图 18-17\n分组对象周围出现边框\n\n如果你想要同时移动两个对象，请拖动外部边框。如果你想要同时旋转两个对象，请使用外部边框上的旋转器。3D 模型中心旋转器一次只能用于一个模型。\n\
  \n你可以将任何类型的图像对象组合在一起。你可以组合图片、图标、形状、3D 图像、SmartArt、图表、地图和艺术字。你也可以将这些对象中的任何一个相互叠放。那么，如何控制哪个对象显示在另一个对象的顶部呢？你可以使用“排列”组中的“上移一层”和“下移一层”按钮，但如果你处理的对象很多，你会发现使用“选择窗格”按钮更容易，它不仅可以控制对象的显示顺序，还可以查看它们是如何分组的，甚至可以控制它们是否可见。\n\
  \n### 练习 18-3：使用 3D 和其他对象以及选择窗格\n\n在本练习中，你将使用图标、形状和 3D 对象。你将分组、取消分组并重新分组对象。你将学习如何使用“选择窗格”来更改对象的可见性和排列。\n\
  \n1.  单击最大的树形。在功能区的“开始”选项卡的“字体”组中，单击“颜色填充”的下拉箭头，然后选择一种绿色。\n\n2.  拖动较小的树形，使其覆盖大树形的一部分。在“选择窗格”中，单击“树”组中的顶层形状，然后点击向下箭头按钮（“下移一层”）。这会改变对象的顺序。点击向上箭头按钮（“上移一层”）将较小树形放回前面。你也可以在“选择窗格”中拖动对象来更改其顺序。\n\
  \n3.  单击单词“Zebra”（斑马）。将其拖到顶部或使用上箭头键。“斑马”图像移动到树和 3D 树的前面。将 3D 树拖到“海龟”组上方。参见图 18-23。\n\
  \n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig23_HTML.jpg](img/385660_2_En_18_Fig23_HTML.jpg)\n\
  \n图 18-23\n移动对象名称以更改其顺序\n\n4.  你可以通过在“选择窗格”中单击其名称来选择对象。单击名称“海龟”。在功能区上下文相关的“格式”选项卡上的“图形工具”下的“更改”组中，单击“转换为形状”。如果出现消息询问你是否要将其转换为\
  \ Microsoft Office 绘图对象，请单击“是”按钮。\n\n5.  在“选择窗格”中单击名称“树”。单击“转换为形状”。“选择窗格”显示“树”和“海龟”各由两个独立的形状组成。参见图\
  \ 18-22。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig22_HTML.jpg](img/385660_2_En_18_Fig22_HTML.jpg)\n\
  \n图 18-22\n“树”和“海龟”由独立对象组成\n\n6.  在功能区的“插入”选项卡上，单击“图标”。在“动物”组中，单击海龟。在“风景”组中，单击双树。单击“插入”按钮。单击一个空白单元格以取消选中这两个对象。移动它们并调整它们的大小，使其如图\
  \ 18-21 所示。在“选择窗格”中将对象的名称更改为 `Turtle` 和 `Trees`。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig21_HTML.jpg](img/385660_2_En_18_Fig21_HTML.jpg)\n\
  \n图 18-21\n将海龟和树添加到图像中\n\n7.  在功能区的“插入”选项卡的“插图”组中，单击“3D 模型”按钮的上半部分。在搜索框中输入 `zebra`，然后按\
  \ Enter 键。单击看起来像图 18-20 中的斑马。单击窗口底部的“插入”按钮。将斑马拖动到图 18-20 所示的位置。尝试旋转它。单击功能区上不同的 3D\
  \ 模型视图。在“选择窗格”中单击对象的名称。删除文本并输入 `Zebra` 作为名称。\n\n8.  在功能区的“插入”选项卡的“插图”组中，单击“3D 模型”按钮的上半部分。单击“花卉和植物”类别。单击松树。单击“插入”按钮。拖动树，使其位于\
  \ 3D 斑马的前面。拖动大小手柄以增大树的大小。\n\n\n\n在`Selection Pane`中，将对象重命名为`3D Tree`。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig20_HTML.jpg](img/385660_2_En_18_Fig20_HTML.jpg)\n\
  \n**图 18-20**\n向图像中添加了 3D 斑马和 3D 树\n\n1.  在功能区（Ribbon）的`Home`选项卡的`Editing`组中，点击`Find\
  \ & Select`，然后选择`Selection Pane`。`Selection Pane`中有两个对象：图片和`Thought Bubble`。你最后添加的对象会放置在`Selection\
  \ Pane`的顶部。请参阅图 18-19。每个对象对面都有一个眼睛图标。点击`Thought Bubble`的眼睛图标。该对象消失，眼睛图标变为一条水平线。点击该水平线，`Thought\
  \ Bubble`重新出现，眼睛图标也恢复。\n\n    ![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig19_HTML.jpg](img/385660_2_En_18_Fig19_HTML.jpg)\n\
  \n    **图 18-19**\n    包含可见性可更改的对象的 Selection 窗格\n\n2.  打开工作簿`Chapter18`。工作表`Sheet\
  \ 1`包含一张动物园图片。在功能区的`Insert`选项卡的`Illustrations`组中，点击`Shapes`。在`Callouts`组中，点击`Thought\
  \ Bubble Cloud`。光标变为十字准线。拖动云朵形状，使其看起来像是从鸵鸟那里冒出来的。输入“What are those strange animals?”。请参阅图\
  \ 18-18。你可能需要调整云朵的大小，以使文本按你想要的方式排列。\n\n    ![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig18_HTML.jpg](img/385660_2_En_18_Fig18_HTML.jpg)\n\
  \n    **图 18-18**\n    带有想法气泡形状的图片\n\n现在，黑色小树出现在绿色树木的前面。斑马出现在 3D 树的前面，而 3D 树又出现在乌龟的前面。结果如图\
  \ 18-24 所示。\n\n![../images/385660_2_En_18_Chapter/385660_2_En_18_Fig24_HTML.jpg](img/385660_2_En_18_Fig24_HTML.jpg)\n\
  \n**图 18-24**\n在 Selection 窗格中更改对象顺序的结果\n\n3.  按住`Ctrl`键，在`Selection Pane`中点击每个对象（当你点击一个组标题，例如`Turtle`或`Trees`时，你将选中该组中的所有对象）。右键点击图片，选择`Group`，然后选择`Group`。移动图片。所有对象会一起移动。\n\
  \n4.  右键点击图片，选择`Group`，然后选择`Ungroup`。点击一个空白单元格。移动图片，对象不会随图片移动。\n\n5.  右键点击图片，选择`Group`，然后选择`Regroup`。移动图片，对象再次随图片移动。\n\
  \n6.  练习移除和恢复对象的可见性。练习对部分对象进行分组、取消分组和重新分组。练习更改对象的顺序。\n\n## 总结\n\n本章讲解了如何单独以及组合使用各种类型的对象。你学习了如何将图标转换为形状。同样的过程也适用于将\
  \ SVG 文件转换为形状。你学习了如何使用右键菜单或`Selections Pane`进行分组、取消分组和重新分组。你还学习了如何使用`Selection Pane`更改对象的可见性和顺序。你了解到，可以从已添加的\
  \ 3D 对象中选择旋转的 3D 模型视图，或者更改 3D 对象的大小并自由旋转它们，使其达到你想要的视觉效果。\n\n在下一章中，你将学习如何创建宏。宏是一种快捷方式，可以消除为频繁执行的任务重复相同步骤的需要。\n\
  \n"
- "# 19. 使用宏自动执行任务\n\n对于你发现自己需要反复执行的任务，宏可以极大地节省时间。宏使你能够录制通常用于执行任务的系列步骤、存储这些步骤，并在需要时自动重新运行它们。通过为宏分配快捷键，可以快速激活它们。如果你认为自己可能会忘记宏的关联快捷键，则可以将其存储在`Quick\
  \ Access Toolbar`中。你还可以将宏附加到按钮和其他对象上。\n\n阅读并完成本章内容后，你将能够：\n\n*   创建使用绝对单元格引用的宏\n\
  *   创建使用相对单元格引用的宏\n*   为按钮分配宏\n*   为`Quick Access Toolbar`分配宏\n*   为形状分配宏\n*   创建并更新个人工作簿\n\
  *   保存启用宏的工作簿\n*   使用 VBA（Visual Basics for Applications）开发环境\n*   编辑宏\n\n\n\n##\
  \ 创建（录制）宏\n\n简单的宏可以使用宏录制器创建。更复杂的宏则需要在宏编辑器中创建。宏录制器会记录从你开始录制到停止录制期间的所有按键和鼠标点击操作。由于它会记录你所做的所有操作，因此除了与你要执行的任务直接相关的操作外，请不要点击任何其他单元格或执行任何步骤。\n\
  \n可以从以下三个位置启动宏录制器：\n\n-   在 `View`（视图）选项卡的 `Macros`（宏）组中，点击 `Macros`（宏）按钮上的下拉箭头，然后选择\
  \ `Record Macro`（录制宏）。\n-   在 `Developer`（开发工具）选项卡的 `Code`（代码）组中，点击 `Record Macro`（录制宏）。\n\
  -   在状态栏上，点击 `Macro Start Recording`（宏录制开始）按钮![../images/385660_2_En_19_Chapter/385660_2_En_19_Figa_HTML.jpg](img/385660_2_En_19_Figa_HTML.jpg)。\n\
  \n启动录制器后，会打开一个 `Record Macro`（录制宏）对话框。你需要在其中输入宏的名称、快捷键以及宏的存储位置；还可以提供宏的描述，以便日后能够记住其用途。参见图\
  \ 19-1。\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig1_HTML.jpg](img/385660_2_En_19_Fig1_HTML.jpg)\n\
  \n图 19-1：录制宏前需要进行的设置\n\n宏可以存储在三个位置：\n\n-   当前工作簿\n-   新工作簿\n-   个人宏工作簿\n\n如果你希望宏在其他工作簿中也可用，请选择\
  \ `Personal Macro Workbook`（个人宏工作簿）。在你将宏保存到个人宏工作簿之前，它是不存在的。Excel 会将文件保存为 `PERSONAL.xlsb`。此工作簿是隐藏的，并且在每次启动\
  \ Excel 时会自动打开。\n\n### 练习 19-1：创建一个简单的宏\n\n我们将创建的宏会对单元格应用格式设置。我们将使用状态栏上的 `Start\
  \ Recording`（开始录制）按钮。\n\n#### 录制宏\n\n![../images/385660_2_En_19_Chapter/385660_2_En_19_Fig2_HTML.jpg](img/385660_2_En_19_Fig2_HTML.jpg)\n\
  \n图 19-2：将填充颜色更改为橙色，着色 2，浅色 80%\n\n1.  点击状态栏上的 `Macro Stop Recording`（宏停止录制）按钮![../images/385660_2_En_19_Chapter/385660_2_En_19_Figd_HTML.jpg](img/385660_2_En_19_Figd_HTML.jpg)。\n\
  \n2.  查看状态栏上是否有 `Macro Start Recording`（宏录制开始）按钮![../images/385660_2_En_19_Chapter/385660_2_En_19_Figb_HTML.jpg](img/385660_2_En_19_Figb_HTML.jpg)。如果没有，则右键点击状态栏，选择\
  \ `Macro Recording`（宏录制）选项，然后按 (Esc) 键隐藏该选项窗口。\n\n3.  点击单元格 `A1`。\n\n4.  点击状态栏上的\
  \ `Macro Recording`（宏录制）按钮。此时会打开 `Record Macro`（录制宏）对话框。\n\n5.  宏名称不能包含空格。在宏名称框中输入\
  \ `FormatEntry`。\n\n快捷键当前显示为 `Ctrl +` 并带有一个文本框，你需要在其中输入将与 `Ctrl` 键组合使用的按键。如果你输入小写字母，Excel\
  \ 要求你使用 `Ctrl` 键和你输入的字母作为快捷键。不幸的是，几乎所有使用 `Ctrl` 键加小写字母的快捷键都已被 Excel 占用，因此我们只会使用大写字母。如果你输入大写字母，Excel\
  \ 会在快捷键中添加一个 `Shift` 键；因此，你需要输入 `Ctrl + Shift +` 你输入的字母作为快捷键。\n\n6.  点击文本框内部，然后输入\
  \ `Shift + F`。\n\n7.  点击 `Store Macro in`（宏存放在）下拉框的下拉箭头，然后选择 `This Workbook`（当前工作簿），因为我们只想在当前工作簿中使用该宏。\n\
  \n8.  在描述框中，输入 `这是我的第一个宏。它将加粗、设置为斜体、将字体大小更改为 16，并将背景颜色更改为橙色。`\n\n9.  点击 `OK`（确定）按钮。\n\
  \n从现在开始直到你点击 `Stop Recording`（停止录制）按钮期间，你的每一次按键和鼠标点击都会被记录下来，所以除了此处指示的操作外，不要点击任何其他单元格或命令按钮。你可以通过\
