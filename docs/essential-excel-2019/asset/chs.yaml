  \  删除旭日图。\n2.  选择单元格范围`A2:C15`，按住`Ctrl`键，再选择单元格范围`F2:F15`。让我们对该范围应用单元格样式，以便轻松识别哪些列正被用于图表。\n\
  3.  在功能区的“开始”选项卡上的“样式”组中，单击“单元格样式”按钮。选择`强调色 5`。参见图 13-75。\n\n您的电子表格应类似于图 13-76。\n\
  \n您已经学习了如何创建矩形式树状结构图和旭日图这两种层级结构图。层级结构图非常适合存在自然分组且数据按一定顺序组织的数据。\n\n\n\n## 漏斗图\n\n\
  漏斗图因其外观而得名。漏斗图以宽条开始，后续每个条块逐渐变窄。漏斗图通常用于展示流程中各个阶段的值。漏斗图由两列数据构成：一列包含描述信息，另一列为数值。\n\n\
  创建漏斗图非常简单：只需选择数据，单击功能区“插入”选项卡，在“图表”组中点击“**插入瀑布图、漏斗图、股价图、曲面图或雷达图**”按钮，然后选择“漏斗图”。参见图\
  \ 13-80。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig80_HTML.jpg](img/385660_2_En_13_Fig80_HTML.jpg)\n\
  \n图 13-80  \n如何访问漏斗图\n\n图 13-81 显示了用于创建图 13-82 中漏斗图的数据。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig82_HTML.jpg](img/385660_2_En_13_Fig82_HTML.jpg)\n\
  \n图 13-82  \n漏斗图展示达到“毕业学生人数”的阶段\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig81_HTML.jpg](img/385660_2_En_13_Fig81_HTML.jpg)\n\
  \n图 13-81  \n漏斗图数据\n\n你已经学习了如何创建漏斗图来展示流程中各阶段的值。接下来，你将了解 Excel 的两种地图图表：地图图和必应地图。必应地图不是“图表”组的一部分，而是一个加载项。在此对两者进行讨论，以便你比较并了解何时需要使用哪一种。\n\
  \n## 地图图\n\nExcel 的新型地图图用于按国家/地区、州、县或邮政编码显示地理数据。你可以使用地图图来显示数值或分类数据。它用于展示地点及其相关的一个变量，例如某地点的人口、该区域的销售额、该区域的医院数量等。在此图表之后将讨论必应地图。两者的优缺点如下所示：\n\
  \n- 必应地图\n  - 优点\n    - 具有鸟瞰视图。可查看街道。\n    - 可使用混合类型，例如使用包含邮政编码、州和国家的数据范围。\n   \
  \ - 可使用多个变量，例如，能够为各州绘制人口、收入和医院数量的图表。\n  - 缺点\n    - 只能表示数值数据，不能表示分类数据。\n    - 无法像其他图表那样使用“设计”和“格式”选项卡中的命令。\n\
  - 地图图\n  - 优点\n    - 最大优势在于可以使用你处理过的其他图表的所有格式和设计工具。\n    - 可以使用分类数据以及数值数据。\n  -\
  \ 缺点\n    - 没有鸟瞰视图，且无法查看任何街道。\n    - 不能使用混合类型。\n    - 只能使用一个变量。\n\n让我们看一个展示编写本书时发生的问题的地图，那就是冠状病毒。图\
  \ 13-83 显示了一些州及其当前的冠状病毒病例数。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig83_HTML.jpg](img/385660_2_En_13_Fig83_HTML.jpg)\n\
  \n图 13-83  \n冠状病毒数据\n\n我们可以通过选择单元格区域 `A1:B7`，然后单击功能区“插入”选项卡来将此数据绘制成图表。在“图表”组中，有一个“地图”按钮。参见图\
  \ 13-84。目前只有一种类型的地图图，即“着色地图图”。单击“更多地图图”仅允许你从可用的图表类型中选择一种。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig84_HTML.jpg](img/385660_2_En_13_Fig84_HTML.jpg)\n\
  \n图 13-84  \n选择着色地图\n\n选择地图数据并单击“着色地图”按钮后，Excel 会创建一个美国地图，图表中的各州以渐变色填充。参见图 13-85。颜色越深，冠状病毒病例数越多。图例显示了病例数，范围从最小值\
  \ (6) 到最大值 (93)。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig85_HTML.jpg](img/385660_2_En_13_Fig85_HTML.jpg)\n\
  \n图 13-85  \n冠状病毒病例地图\n\n你可以使用地图图来显示类别而非数值。每个类别将被分配一种颜色。图 13-86 显示了用于创建图 13-87 中地图的部分表格。\n\
  \n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig87_HTML.jpg](img/385660_2_En_13_Fig87_HTML.jpg)\n\
  \n图 13-87  \n使用类别的地图图\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig86_HTML.jpg](img/385660_2_En_13_Fig86_HTML.jpg)\n\
  \n图 13-86  \n地图的类别数据\n\n你可以通过以下操作更改某个类别所代表的所有区域的颜色：\n\n1. 单击图例以选中它。\n2. 右键单击要更改颜色的类别。\n\
  3. 单击“填充颜色”按钮。\n4. 选择一种颜色。\n\n参见图 13-88。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig88_HTML.jpg](img/385660_2_En_13_Fig88_HTML.jpg)\n\
  \n图 13-88  \n更改类别颜色\n\n\n\n### 使用必应地图\n\n使用 Excel 的必应地图，您可以在世界上任何地点创建数据的可视化表示。数据的第一列必须是地址、城市、州/省、国家、邮政编码、纬度/经度或其组合。之后的任何列都必须是数值数据。使用城市名的问题在于可能存在多个同名城市。您可以将城市与州/省或国家名称连接起来。\n\
  \n### 练习 13-7：使用必应地图\n\n在本练习中，您将创建能反映不同城市收入的地图。\n\n1.  点击 `X` 关闭启动消息。\n2.  将光标置于地图图标上方的边框上，光标将会变成四个箭头。现在您可以随意拖动地图。\n\
