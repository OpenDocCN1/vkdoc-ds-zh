  \  单击 **确定** 按钮。\n7.  单击 **关闭** 按钮。\n\n**使用“根据所选内容创建”创建命名区域**\n\n1.  选择单元格 `B2:F8`。\n\
  2.  在“定义的名称”组中，单击 **根据所选内容创建** 按钮。\n3.  从 **根据所选内容创建名称** 对话框中选中 **首行**。单击 **确定**\
  \ 按钮。\n4.  单击 **名称管理器** 按钮。已从列标题创建了命名区域。列名称中的空格已替换为下划线。参见图 7-56。\n\n![../images/385660_2_En_7_Chapter/385660_2_En_7_Fig56_HTML.jpg](img/385660_2_En_7_Fig56_HTML.jpg)\n\
