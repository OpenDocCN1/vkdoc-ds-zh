  \n图 2-1\n\n在工作表中输入这些值\n\n**使用 Tab 键**\n\n按 `Tab` 键可将光标从当前单元格向右移动一个单元格。\n\n1. 单击单元格\
  \ `C6`（`C` 列的第六行）。\n\n2. 按 `Tab` 键移动到单元格 `D6`。\n\n3. 按 `Tab` 键移动到单元格 `E6`。\n\n**使用\
  \ Shift+Tab 键**\n\n按住 `Shift` 键的同时按 `Tab` 键可将光标向左移动一个单元格。\n\n1. 按住 `Shift` 键，同时按\
  \ `Tab` 键移动到单元格 `D6`。\n\n2. 按住 `Shift` 键，同时按 `Tab` 键移动到单元格 `C6`。\n\n3. 按住 `Shift`\
