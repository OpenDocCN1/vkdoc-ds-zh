  \n1.  打开第 13 章的工作簿。选择名为 `Maps` 的工作表。\n\n此工作表中的示例使用 `Revenue` 作为数值。这些值可以是任何内容（例如，城市或州的人口、增长率、死亡率、公司在该地点工作的员工数量等）。\n\
  \n2.  点击功能区的 `Insert` 选项卡。在 `Add-ins` 组中，点击 `Bing Maps` 按钮。必应地图将会显示。参见图 13-89。\n\
