  \ `Excel Workbook`（Excel 工作簿）。\n    5.  点击 `Save`（保存）按钮。\n\n#### 播放宏\n\n1.  点击单元格\
  \ `C2`。\n\n2.  输入 `Hello`。\n\n3.  按 `Ctrl + Enter`。\n\n4.  按下你为此宏创建的快捷键 `Ctrl +\
