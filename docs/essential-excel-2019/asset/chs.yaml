  \ 12-42 中的第 14 行。\n\n## 总结\n\nExcel 中的主题由颜色、标题和正文字体以及应用于工作表的图形效果组成。您也可以创建自己的主题。您可以使用主题来增强电子表格的外观，并使其具有一致的外观。例如，您可以为不同的项目应用不同的主题，或者您的公司可能选择始终使用同一主题。Microsoft\
  \ Word 和 PowerPoint 拥有与 Excel 中相同的主题。\n\nMicrosoft Office 主题由颜色库、标题和正文字体以及图形效果组成。您可以单击不同的主题，同时查看它们如何影响您的工作表。您可以选择最令您满意的一个，或者您的公司可以更进一步，创建自己的自定义公司或企业主题；这样做既是为了在组织内部营造一种持续的专业感，也是为外部沟通赋予品牌感。如果您找不到符合需求的主题，您可以通过从颜色、标题和正文字体以及图形效果库中进行选择来创建自己的主题。\n\
  \n您无需手动设置单元格格式，而是从预定义的单元格样式组中进行选择。这些组包括“好、差和一般”、“数据和模型”、“标题和标头”以及“数字格式”。与主题一样，单元格样式可以使您的工作表具有一致的外观，例如始终使标题、表头与汇总具有相同的外观。\n\
  \n您可以将工作表中的数据转换为表格，然后再将其转换回原始格式。通过选择要转换为表格的数据，然后单击功能区“样式”组中的“套用表格格式”按钮来创建表格。将数据转换为表格允许您通过单击列标题右侧的下拉箭头来筛选数据。然后，您可以选择要用于筛选的值，或创建自定义筛选；如果数据是文本，您可以选择“文本筛选”；如果数据是数字，您可以选择“数字筛选”。筛选表格数据的另一种方法是创建切片器。切片器让您无需使用表格筛选器即可精确查看正在筛选的内容。\n\
  \n您可以使用各种颜色或图标来设置单元格格式，以高亮显示特别重要的单元格。例如，您可以使用一个图标高亮显示值在前 20% 的单元格，使用另一个图标高亮显示值在中间\
  \ 60% 的单元格，再使用另一个图标高亮显示值在最后 20% 的单元格。\n\n下一章将介绍图表。Excel 使得将电子表格数据转换为图表变得非常简单。图表使您能轻松发现数据中可能无法察觉的趋势。\n\
  \n"
- "# 13. 使用图表\n\n如果没有图表，我们会怎样？图表不仅比原始数据更吸引我们的眼球，而且还能让我们更容易发现趋势。那句老话“一图胜千言”也同样适用于图表。管理者并不总想查看电子表格中的每一条记录；他们更愿意根据趋势来做决策，无论这些趋势是好是坏。通过观察趋势，管理层可以决定公司未来应采取哪些行动。图表可以汇总大量数据并显示数据之间的关系。图表使我们更容易看到诸如哪些产品线利润更高、一年中哪个时期最赚钱、公司的盈利能力是上升还是下降、哪些部门表现良好、哪些部门表现不佳等等信息。\n\
  \n阅读并完成本章内容后，您应该能够：\n\n*   使用快捷键创建图表\n\n*   更改图表类型\n\n*   添加数据点\n\n*   更改数据源\n\n\
  *   创建饼图\n\n*   创建复合饼图\n\n*   创建复合条饼图\n\n*   创建具有多种数据图表类型的图表（组合图）\n\n*   创建树状图\n\
  \n*   创建旭日图\n\n*   创建漏斗图\n\n*   创建地图\n\n*   创建必应地图\n\n*   创建迷你图\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成高质量的中文。\n\
  \n\n## 图表类型\n\nExcel 提供了多种多样的图表类型供您选择，以便最佳地展示您的数据。您应该使用哪种图表类型取决于您要绘制的数据。在创建图表之前，您需要确定希望图表传达什么信息。选定图表后，您可以通过更改其主题来更改整个图表的格式，也可以更改图表的各个组件。Excel\
  \ 提供了多种不同的图表选项。稍后您会看到，Excel 会查看您选择的数据，进行**快速分析**，然后为您的数据提供**推荐**的图表类型。\n\n功能区“`插入`”选项卡的“`图表`”组中显示了可用的图表类型。单击某图表类型旁边的向下箭头将显示该图表类型的可用变体。参见图\
  \ 13-1。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig1_HTML.jpg](img/385660_2_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1\n\n饼图的变体\n\n单击“`图表`”组的对话框启动器，如图 13-2 所示，将弹出“`插入图表`”对话框（图 13-3）。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig3_HTML.jpg](img/385660_2_En_13_Fig3_HTML.jpg)\n\
  \n图 13-3\n\n已选中“`推荐的图表`”选项卡的“`插入图表`”对话框\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig2_HTML.jpg](img/385660_2_En_13_Fig2_HTML.jpg)\n\
  \n图 13-2\n\n“`图表`”组\n\n“`插入图表`”对话框有两个选项卡。“`推荐的图表`”选项卡会根据您当前在工作表中选定的数据，显示推荐的图表。参见图\
  \ 13-3。此处显示的图表使用的是您已选定的数据。单击某个图表类型会显示该图表类型用途的描述。\n\n推荐的图表只是一个建议。您不必使用 Excel 的建议。“`所有图表`”选项卡在左侧窗格中显示所有图表类型。单击左侧窗格中的某个图表类型，将在右侧窗格中显示该类型的所有变体。参见图\
  \ 13-4。此处显示的图表使用的是您当前在工作表上选定的数据。在左侧窗格中，有一个选项可以查看您最近使用的图表。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig4_HTML.jpg](img/385660_2_En_13_Fig4_HTML.jpg)\n\
  \n图 13-4\n\n“`柱形图`”的变体\n\n## 创建和修改图表\n\n创建图表有多种方法，包括使用上一节中介绍的“`插入`”选项卡上的选项。创建默认的二维簇状条形图最简单的方法是，选择您要在图表中显示的数据，然后：\n\
  \n*   按 `Alt + F1` 将图表显示在数据所在的工作表上，或者\n*   按 `F11` 将图表显示在单独的工作表上\n\n创建图表后，您可以通过多种方式进行更改。您可以进行的一些更改包括：\n\
  \n*   图表类型\n*   图表位置\n*   图表样式\n*   图表中显示的内容\n*   交换行列\n*   在图表中添加或移除项目\n*   更改单个条形的颜色和外观\n\
  *   添加或移除图例、标题和数据表\n*   绘图区的增量值\n\n选定图表会在功能区中添加两个上下文选项卡。上下文选项卡“`设计`”和“`格式`”会出现在“`图表工具`”标题下。“`设计`”选项卡主要用于进行影响整个图表的更改，而“`布局`”选项卡则用于更改图表中各个元素的外观。\n\
  \n**注意** 不要过分追求让图表过于花哨或过度使用颜色等。最重要的是图表如何很好地传达您希望表达的信息，以及目标受众阅读和理解图表的难易程度。受众应该能够快速领会图表所传达的内容。\n\
  \n### 练习 13-1：创建和修改 Excel 图表\n\n在本练习中，您将根据现有的“游戏销售”数据创建和修改柱形图和条形图。\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig5_HTML.jpg](img/385660_2_En_13_Fig5_HTML.jpg)\n\
