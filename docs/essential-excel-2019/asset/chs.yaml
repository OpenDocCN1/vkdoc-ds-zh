  7. 点击功能区上的“页面布局”选项卡。\n8. 在“主题”组中，点击“主题”按钮。点击 `Savon` 主题。\n9. 点击功能区上的“开始”选项卡。点击其中一个单元格。注意，默认字体现在是\
