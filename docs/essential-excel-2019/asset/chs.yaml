  \n---\n\n**练习 2-3：使用键盘选择单元格**\n\n继续使用上一个练习中的同一个工作簿。\n\n#### 选择整列\n\n按 `Ctrl + 空格键`\
  \ 可选择活动单元格所在列的所有单元格。\n\n1. 单击单元格 `D3`。\n2. 按住 `Ctrl` 键，然后按 `空格键`。\n\n#### 选择整行\n\
  \n按 `Shift + 空格键` 可选择活动单元格所在行的所有单元格。\n\n1. 单击单元格 `C3`。\n2. 按住 `Shift` 键，然后按 `空格键`。注意功能区\
  \ **字体** 组中的 `B` 按钮会高亮显示。这是因为您之前已将此行加粗。再次点击 `B` 按钮，可以取消该行的加粗效果。\n\n#### 选择多列\n\n\
  1. 将光标移至单元格 `D1`。\n2. 按住 `Shift` 键，同时按两次右箭头键。这将选中单元格 `D1`、`E1` 和 `F1`。松开 `Shift`\
  \ 键。\n3. 接着，按住 `Ctrl` 键，同时按 `空格键`。这将选中 D、E 和 F 整列。\n\n#### 选择多行\n\n1. 单击单元格 `A1`。\n\
  2. 按住 `Shift` 键，然后按两次下箭头键。\n3. 按住 `Shift` 键，然后按 `空格键`。这将选中第 1、2 和 3 行。\n\n#### 选择区域\n\
  \n在本练习中，您将使用不同的组合键选择几个不同的区域。\n\n1. 单击单元格 `A1`。按住 `Shift` 键并持续按下箭头键，直到行号变为 7。继续按住\
  \ `Shift` 键并持续按右箭头键，直到选中 A 列到 G 列。然后，按住 `Shift` 键并按左箭头键取消选择 G 列。这将选中区域 `A1:F7`。\n\
  2. 单击单元格 `F3`。按住 `Shift` 键加 `Home` 键。这将选中从当前单元格到行首的所有单元格。\n3. 单击单元格 `F4`。按住 `Shift`\
  \ 键加 `Ctrl` 键再加 `Home` 键。这将选中从当前单元格到单元格 `A1` 的所有内容。\n\n#### 从当前单元格选择到最后一个含数据的单元格\n\
