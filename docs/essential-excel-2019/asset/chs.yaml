  \n## 总结\n\n您已经学习了一种在工作表之间快速切换的方法，以及如何使用特殊的键盘快捷键跳转到不同的单元格。您还学习了如何在一个工作簿中创建和自定义多个工作表。在第\
  \ 3 章中，您将创建不同类型的数据，并学习如何插入特殊字符以及调整列宽和行高。其中包括有助于您继续以最适合自身需求的方式使用 Excel 的数据输入快捷方式。\n\
  \n"
- "# 3. 输入和编辑数据的最佳方法\n\n在本章中，您将了解 Excel 工作表如何使用三种数据类型：文本、数值和日期/时间。理解这些不同类型的数据非常重要。您还将开始使用键盘上找不到的特殊字符。\n\
  \nExcel 提供了多种工具和功能，使您的数据输入快速、高效且符合您所需的格式。Excel 会根据您输入的数据类型自动确定数据的对齐方式。您输入的数据可以使用各种文本、数值和数据格式进行格式化。如果输入的数据不能以您期望的方式正好放入单元格，您可以调整列宽和行高。\n\
  \nExcel 的`自动更正`功能有助于纠正常见的拼写错误、纠正大小写误用、输入无法直接从键盘输入的特殊符号，以及为常用单词或短语创建输入快捷方式。\n\n`自动完成`和`从下拉列表中选择`功能允许您轻松复制现有的列值。`自动填充`可用于创建重复单元格、输入数值序列、创建自定义列表或重复使用您教给它的模式。\n\
  \n阅读并完成本章练习后，您应能：\n\n*   创建三种数据类型\n*   插入特殊字符\n*   更改列宽和行高\n*   纠正输入错误\n*   使用`自动更正`进行更正并为输入单词或短语创建快捷方式\n\
  *   使用`自动完成`输入数据\n*   使用`从下拉列表中选择`输入数据\n*   使用`自动填充`创建重复单元格和序列\n*   创建自定义列表\n* \
  \  向电子表格添加附注和批注\n\n\n\n## 数据类型\n\n可以在单元格中输入三种类型的数据：文本、数字以及日期和时间。\n\n-   **文本数据**——文本数据也称为字符串数据。数据可以由字母、数字和一些符号的组合构成。文本数据在单元格中左对齐。你无法在公式中使用文本数据。\n\
  -   **数字数据**——数字单元格只能包含图 3-1 中所示的字符。\n\n    ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig1_HTML.jpg](img/385660_2_En_3_Fig1_HTML.jpg)\n\
  \n    **图 3-1** 数值中只能使用这些数字和字符\n\n    如果单元格中包含任何其他字符，甚至是空格，Excel 都会将数据视为文本。只有包含数值的单元格才能用在公式中。数字数据在单元格中右对齐。\n\
  \n-   **日期和时间数据**——日期和时间数据可用于处理日期、时间，或两者组合。你可以将日期输入为 `January 16, 2005`、`01/16/05`\
  \ 或 `01-16-2005`，但日期在单元格中的显示方式取决于该单元格的格式。日期和时间数据与数字数据一样，在单元格中右对齐。\n\n> **注意**\n\
  > 如果你将日期输入为 `January 15 2010`，Excel 会将其显示为文本而非日期，因为缺少将其识别为日期的特征。如果你在日期后加上逗号，Excel\
  \ 就能将其识别为日期并右对齐。\n\n图 3-2 中的第一列显示了在单元格中实际输入的内容；第二列显示了该输入在 Excel 中的显示方式。你可以通过更改其格式来改变日期的显示方式，我们将在后续章节中介绍这一点。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig2_HTML.jpg](img/385660_2_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2** 在单元格中输入的日期及其显示方式\n\n> **注意**\n> 在单元格中输入时间时，请确保在时间与 AM 或 PM 之间输入一个空格。时间应输入为\
  \ `11:35 AM` 而非 `11:35AM`。如果不加空格输入，该时间将被视为文本数据，并在单元格中左对齐。见图 3-3。对于被视为文本的日期和时间，你将无法对其执行日期和时间函数。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig3_HTML.jpg](img/385660_2_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** 输入时间时不加空格使其成为文本输入而非日期\n\n### 练习 3-1：练习输入不同类型的数据\n\n在本练习中，你将创建一个新的工作簿并输入不同类型的数据。\n\
  \n1.  启动 Excel 程序。创建一个名为 Chapter 3 的新工作簿。\n2.  在单元格 A1 中输入 `5 Text`。按 Tab 键。由于是文本，它保持左对齐。\n\
  3.  在单元格 B1 中输入 `12.75`。按 Tab 键。由于是数字，它右对齐。\n4.  在单元格 C1 中输入 `2/13`。按 Tab 键。由于是日期，它右对齐。\n\
  5.  在单元格 D1 中输入 `12:15 PM`。按 Tab 键。由于是时间，它右对齐。\n6.  在单元格 E1 中输入 `5:10AM`。按 Tab 键。由于你在\
  \ AM 前输入时间时没有加空格，Excel 将其左对齐，因为 Excel 认为它是文本。\n7.  在单元格 F1 中输入 `March 3 2014`。按\
  \ Tab 键。由于你输入日期时在日期后没有加逗号，Excel 将其左对齐，因为 Excel 认为它是文本。\n8.  将 Sheet1 工作表标签的名称更改为\
  \ `Data Types`。\n9.  保存工作簿。\n\n---\n\n## 插入特殊字符\n\n如果你想输入键盘上没有的字符，可以使用 Excel 的符号之一，例如**大于或等于号**\
  \ (`≥`) 或**小于或等于号** (`≤`)。可以通过单击功能区中的“插入”选项卡，然后在“符号”组中单击“符号”按钮来访问这些特殊字符。见图 3-4。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig4_HTML.jpg](img/385660_2_En_3_Fig4_HTML.jpg)\n\
  \n**图 3-4** “符号”按钮位于功能区的“符号”组中\n\n“符号”对话框有两个选项卡，一个用于符号，另一个用于特殊字符。“特殊字符”选项卡显示常用符号，如版权符号、商标符号、不同样式的右引号等。“符号”选项卡包含更多特殊字符，这也是我们本节的重点。\n\
  \n“符号”选项卡上可用的符号取决于所选字体。不同的字体可以创建不同的符号。某些字体比其他字体拥有更多可用的符号。例如，图 3-5 所示的通用（普通文本）选项提供了非常丰富的字符选择。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig5_HTML.jpg](img/385660_2_En_3_Fig5_HTML.jpg)\n\
  \n**图 3-5** 当需要输入键盘上没有的字符时使用此选项\n\n“最近使用的符号”列表显示你最近使用过的 36 个符号。你可以通过单击某个符号或特殊字符，然后单击“插入”按钮将其插入到单元格中。\n\
  \n单击“插入”按钮会将选定的符号放置到当前单元格中，但不会关闭“符号”对话框。这允许你在同一个单元格中插入多个符号，而无需重新打开“符号”对话框。如果“符号”对话框遮挡了你正在输入符号或特殊字符的单元格视图，你可能需要移动它。\n\
  \n单击 `来自:` 下拉框右侧的向下箭头，会显示三个可供选择的符号类别。见图 3-6。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig6_HTML.jpg](img/385660_2_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6** 符号类别\n\n> **注意**\n> 图 3-6 中的三个选项是你的计算机表示数据的不同方式。\n>\n> - Unicode 代表通用编码。Unicode\
  \ 代码可以显示超过 16,000 个符号。它用于表示全世界所有语言的符号。\n> - ASCII 代表美国信息交换标准代码。ASCII 格式创建符号的方式已经存在很长时间。它能够创建多达\
  \ 256 个不同的符号。它使用美国和西欧的符号。\n> - ASCII（十六进制）代码是十六进制格式。它们可以使用 0 到 15 的数字。\n\n`字符代码`\
  \ 是你所选符号的数值表示。同一个符号的字符代码会根据其是十进制格式还是十六进制格式而不同。如果你知道要使用的符号的字符代码，可以输入该代码来选择该符号。\n\n\
  ### 练习 3-2：输入特殊字符\n\n在本练习中，你将向电子表格中添加特殊字符。如果你已关闭上一次练习中的 Chapter 3 工作簿，请重新打开它。\n\n\
  1.  创建一个新工作表。将工作表标签重命名为“特殊字符”。\n2.  单击单元格 B2。在功能区上，单击“插入”选项卡。在“符号”组中，单击“符号”按钮。\n\
  3.  从 `字体` 下拉框中选择 `普通文本`，然后从对话框右下角的 `来自` 下拉列表中选择 `ASCII（十进制）`。增大“符号”对话框的大小，直到无需滚动即可看到所有符号。\n\
  \n\n\n4.  点击**½**符号。注意**½**符号的字符代码是 189。点击“插入”按钮。移动“符号”对话框，使其能够看到单元格 B2。\n\n**注意** 遗憾的是，您无法在工作表中选择另一个单元格然后再插入另一个符号。您必须先关闭“符号”对话框，选择另一个单元格，然后重新打开“符号”对话框。\n\
  \n1.  点击“符号”对话框上的“关闭”按钮。\n2.  在单元格 C2 中输入**25**。不要按回车键。我们将在 25 后面添加一个¢符号。\n3.  在功能区上的“符号”组中，点击“符号”按钮。在“字体”下拉框中拖动选中“普通文本”（如果尚未高亮显示）。输入**Ti**，然后按\
  \ Tab 键。这将显示 Times New Roman 字体的符号。点击¢符号，然后点击“插入”按钮。移动“符号”对话框，使其能够看到单元格 C2。\n4.\
  \  点击**来自**下拉框中的向下箭头，选择“Unicode (十六进制)”。您将看到更多符号。点击不同的符号；当您这样做时，请注意，某些符号的字符代码中包含字母，如\
  \ A、B、C、D、E 或 F。\n\n**注意** 当您选择了“Unicode (十六进制)”时，右上角会出现一个**子集**下拉框。点击其中的一些不同子集。\n\
  \n1.  关闭“符号”对话框。\n2.  点击单元格 D2。在功能区上的“符号”组中，点击“符号”按钮。在**最近使用的符号**中点击**½**符号。点击“插入”按钮。\n\
  3.  在“符号”对话框中点击**特殊字符**选项卡。双击“版权”符号。双击符号与先点击它再点击“插入”按钮的效果相同。移动“符号”对话框，使其能够看到单元格\
  \ D2。单元格 D2 应包含**½©**。\n4.  点击“符号”选项卡。点击**字体**下拉框的向下箭头。选择“Webdings”。该字体包含一些您可能会觉得有用的图像。也可以看看\
  \ Wingdings、Wingdings2 和 Wingdings3 字体。\n5.  关闭“符号”对话框。\n6.  点击单元格 E2。如果您记住字符代码，可以直接在单元格中输入大多数\
  \ ASCII 符号。要直接在单元格中输入符号，您需要在按住 Alt 键的同时，在小键盘上输入字符代码。字符代码只能在小键盘上输入。在开始输入数字之前，请确保\
  \ Num Lock 键已开启。\n7.  请记住，**½**符号的字符代码是 189。按住 Alt 键，输入**0189**，然后释放 Alt 键。您应该会看到**½**符号。需要额外的\
  \ 0 来使其成为一个四位数字。\n8.  点击快速访问工具栏 (QAT) 上的“保存”按钮 `![../images/385660_2_En_3_Chapter/385660_2_En_3_Figa_HTML.jpg](img/385660_2_En_3_Figa_HTML.jpg)`。\n\
  \n## 如何更改列宽\n\n当您输入的文本长于列宽时，如果右侧的相邻单元格为空，则溢出的字符会显示在该单元格中。这些字符可能看起来是相邻单元格的一部分，但实际上它们并未存储在那里。它们存储在您输入它们的单元格中。在以下示例中，名称\
  \ Anthony Bradtmueller 显示在单元格 A3、B3 和 C3 中，但整个名称实际上仅存储在单元格 A3 中。见图 3-7。\n\n`![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig7_HTML.jpg](img/385660_2_En_3_Fig7_HTML.jpg)`\n\
  \n图 3-7\n\n文本溢出到下一个单元格\n\n如果有溢出的字符，并且右侧相邻单元格不为空，则默认情况下溢出的字符会被隐藏，如图 3-8 所示。\n\n`![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig8_HTML.jpg](img/385660_2_En_3_Fig8_HTML.jpg)`\n\
  \n图 3-8\n\n文本被下一个单元格中的文本隐藏\n\n如果您输入的是数字数据，列将自动扩展以适应数字的大小。如果您输入的数字是该列中最长的值，并且包含小数，则该小数可能不会显示在单元格中。如果您更改了包含数字数据的列的宽度，则该列中的单元格将不再自动调整以适应任何新输入的内容。如果已更改大小的列中的单元格包含比单元格宽度更长的数字数据，则该单元格将显示\
  \ # 符号而不是数字值。见图 3-9。\n\n`![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig9_HTML.jpg](img/385660_2_En_3_Fig9_HTML.jpg)`\n\
  \n图 3-9\n\n\n\n### 列宽不足时出现的`#`符号\n\n`#`符号表示列宽不足以显示所有数据。看到这些`#`符号，新手用户往往会感到恐慌，认为电子表格出现了严重问题。\n\
  \n如果点击包含`#`符号的单元格，实际值会显示在公式栏中。请记住，当您在列中看到`#`符号时，简单的解决方法就是扩大列宽。\n\n如果您在单元格中输入一个非常大的数字，可能会看到类似`1.24312E+12`的内容。这是**指数记数法**。如果您希望将该值显示为长数字，可以选择该单元格，单击“开始”选项卡中“数字格式”的下拉箭头，然后选择要转换成的格式。参见图\
  \ 3-10。该数字可能太大而无法在单元格中显示；您需要加宽列宽才能查看该数字。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig10_HTML.jpg](img/385660_2_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10** 您可以将指数记数法值转换为以下格式之一\n\n您可以通过将光标放在列标题之间的线上，然后按住鼠标左键来查看列宽（光标会变成双箭头）。默认列宽为`8.43`；假设您使用的是默认字体类型`Calibri`和字号`11`，这将允许显示大约\
  \ 8 或 9 个字符。参见图 3-11。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig11_HTML.jpg](img/385660_2_En_3_Fig11_HTML.jpg)\n\
  \n**图 3-11** 检查列宽\n\n可以使用鼠标拖动列来更改列宽。要扩展列宽，可以将光标放在列标题之间的线上，按住鼠标左键；当显示列宽时，将线向右拖动到所需宽度。拖动时，Excel\
  \ 会显示宽度以及一条虚线垂直线，提示列边框将更改到的位置。参见图 3-12。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig12_HTML.jpg](img/385660_2_En_3_Fig12_HTML.jpg)\n\
  \n**图 3-12** 调整列宽\n\n列宽可以缩小，也可以扩大。将双箭头向左拖动以缩小列的大小。\n\n您还可以通过执行以下步骤更改列宽：\n\n1.  右键单击列标题，然后选择“列宽”。此时会打开“列宽”对话框（参见图\
  \ 3-13）。\n\n    ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig13_HTML.jpg](img/385660_2_En_3_Fig13_HTML.jpg)\n\
  \n    **图 3-13** 更改列宽\n\n2.  输入所需的宽度。您可以输入`0`到`255`之间的任何值。输入宽度`0`会将所选列隐藏。\n\n3.\
  \  单击“确定”。\n\n也可以通过单击“开始”选项卡，然后在“单元格”组中单击“格式”按钮，然后选择“列宽”来访问“列宽”对话框。参见图 3-14。\n\n\
  ![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig14_HTML.jpg](img/385660_2_En_3_Fig14_HTML.jpg)\n\
  \n**图 3-14** 从“格式”按钮选择列宽\n\n### 自动调整列宽以适合单元格中的字符数\n\n您可以让 Excel 自动调整列的大小以适合单元格中的字符数。这可以通过选择要更改宽度的列标题，然后双击所选列的任意列标题之间的位置来完成。您还可以通过单击“开始”选项卡，在“单元格”组中单击“格式”按钮并选择“`自动调整列宽`”来执行自动调整。\n\
  \n### 更改多个列的列宽\n\n您可以一次更改多个列的列宽。调整多个列宽与调整单个列宽所使用的方法之间的唯一区别是，您需要选择要更改宽度的所有列的列标题。所选列标题不必彼此相邻。以下步骤是同时更改多个列宽的示例：\n\
  \n1.  拖动鼠标选择要更改宽度的列的列标题。\n\n图 3-15 显示了列标题 D、E 和 F 已被选中。选中列标题即选中整个列。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig15_HTML.jpg](img/385660_2_En_3_Fig15_HTML.jpg)\n\
  \n**图 3-15** 整个列被选中\n\n2.  将光标放在任意选定列标题之间。光标会变成双箭头，如图 3-15 所示。按住鼠标左键，向右拖动以展开所有选定列，或向左拖动以收缩所有选定列。\n\
  \n现在，让我们应用本节中学到的一些内容。\n\n**练习 3-3：更改列宽**\n\n在此练习中，您将创建一个新工作表，创建数据列，然后修改这些列的宽度。如果您已从上次练习中关闭了第\
  \ 3 章工作簿，请重新打开它。\n\n**表 3-1** 在工作表中输入数据\n\n| 姓名 | 地址 | 职业 |\n| --- | --- | --- |\n\
  | Pyle, Gomer | 308 Marine Barracks | Marine Private |\n| Griffith, Andy | 408 Mayberry\
  \ Ave. | Town Sheriff |\n| Presley, Elvis | 215 Graceland | Rock Singer |\n| Douglas,\
  \ Lisa | 509 Green Acres | Unusual Housewife |\n| Adams, Mortisha | 313 Spooky Lane\
  \ | Strange Housewife |\n\n1.  创建一个新工作表。将工作表标签重命名为“`Column Widths`”。\n\n2.  将表 3-1\
  \ 的数据输入到起始单元格`A1`的工作表中。**不要调整**列宽。\n\n输入数据后，您的工作表应如图 3-16 所示。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig16_HTML.jpg](img/385660_2_En_3_Fig16_HTML.jpg)\n\
  \n**图 3-16** 不调整列宽输入数据\n\n3.  在仍选中列标题 A、B 和 C 的情况下，单击功能区的“开始”选项卡。在“单元格”组中，单击“格式”按钮。选择“**列宽**”。\n\
  \n4.  在“列宽”对话框中，输入`20`并单击“确定”按钮。三列应各自具有`20`的列宽。\n\n5.  再次单击“格式”按钮。选择“**自动调整列宽**”。列\
  \ A、B 和 C 将调整以适合其列中最长的文本。\n\n6.  单击快速访问工具栏上的“保存”按钮![../images/385660_2_En_3_Chapter/385660_2_En_3_Figb_HTML.jpg](img/385660_2_En_3_Figb_HTML.jpg)。\n\
  \n7.  将光标放在列标题 A 和 B 之间。将光标向左拖动，直到宽度为`7`。列 A 中的文本现在被列 B 中的文本部分遮盖。\n\n8.  右键单击列标题\
  \ A，然后选择“列宽”。输入`8.43`作为列宽。单击“确定”。\n\n9.  拖动选择列标题 A、B 和 C 以选中所有三列。\n\n10. 双击列标题 B\
  \ 和 C 之间。列 A、B 和 C 将调整以刚好适合其列中最长的文本，如图 3-18 所示。\n\n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig18_HTML.jpg](img/385660_2_En_3_Fig18_HTML.jpg)\n\
  \n**图 3-18** 列已调整以适合最长的列文本\n\n11. 将光标放在列标题 A 和 B 之间。将光标向右拖动，直到宽度为`16.43`。参见图 3-17。\n\
  \n![../images/385660_2_En_3_Chapter/385660_2_En_3_Fig17_HTML.jpg](img/385660_2_En_3_Fig17_HTML.jpg)\n\
