  \n`选项`组（图 5-11）包含用于页眉和页脚的选项：\n- 一个选项是为首页打印页创建一套页眉和页脚，而所有其他页面将使用另一套不同的页眉和页脚。\n- 另一个选项是为奇数页设置一套页眉和页脚，为偶数页设置另一套。\n\
  - 选中`随文档缩放`选项后，会按比例缩放页眉和页脚的大小，使其与您对打印缩放所做的任何更改成比例，以便在打印页面上容纳更多或更少的信息。\n- 选中`与页边距对齐`选项后，会将页眉和页脚放置在您设置的页面边距内。\n\
