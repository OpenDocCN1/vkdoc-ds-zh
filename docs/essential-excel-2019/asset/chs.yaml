  \n\n## 应用与定义单元格样式\n\n单元格样式提供了一种改善电子表格外观和可读性的方法。图 12-30 显示了单元格样式。可以通过单击“开始”选项卡“样式”组中的\
  \ `单元格样式` 按钮来访问它们。单元格样式分为五类：\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig30_HTML.jpg](img/385660_2_En_12_Fig30_HTML.jpg)\n\
  \n**图 12-30** 单元格样式\n\n- 好、差和适中\n- 数据和模型\n- 标题和标题\n- 主题单元格样式\n- 数字格式\n\n样式提供了一种简单的方法来为特定单元格提供一致的格式，例如那些包含公司认为的好消息的单元格和那些包含公司认为的坏消息的单元格、用于输入的单元格和用于输出的单元格、包含链接的单元格等。您还可以使用“主题单元格样式”，它们使用相同的颜色提供不同的透明度。这些预定义样式位于\
  \ `主页 ➤ 样式 ➤ 单元格样式`。主题单元格样式源自您当前使用的主题。如果您更改文档主题，您的主题单元格样式将会改变。通过首先选择要应用样式的单元格，然后从\
  \ `单元格样式` 库中单击相应的样式，即可将样式应用于工作表。样式的一个不错功能是，您可以在应用之前准确看到样式将如何影响您的电子表格。将鼠标悬停在任何样式上，即可获得它将如何影响电子表格的视觉预览。\n\
  \n如果 `单元格样式` 库中没有满足您需求的样式怎么办？没问题；只需创建您自己的样式。为此，请单击 `单元格样式` 库底部的 `新建单元格样式...`。这将打开\
  \ `样式` 对话框，您可以在其中为新样式指定名称。\n\n可以通过显示 `单元格样式` 库、右键单击该样式，然后按 `Delete` 键来删除样式。\n\n\
  ### 练习 12-3：使用和创建单元格样式\n\n在本练习中，您将应用现有的单元格样式，然后创建一个新的单元格样式并应用它。\n\n**注意** 如果您的 Excel\
  \ 窗口已最大化，您将看到 `单元格样式` 库的一部分。如果没有，您将看到一个 `单元格样式` 按钮。单击 `单元格样式` 按钮将显示该库。如果只看到库的一部分，请单击\
  \ `更多` 按钮 ![../images/385660_2_En_12_Chapter/385660_2_En_12_Figd_HTML.jpg](img/385660_2_En_12_Figd_HTML.jpg)。\n\
  \n1. 打开 `Workbook Chapter12`。单击 `单元格样式` 工作表标签。\n\n2. 单击单元格 `A1`。打开 `单元格样式` 库（参见前面的注释）。最大化您的\
  \ Excel 窗口。\n\n3. 在 `标题和标题` 组下，单击 `标题 1`。\n\n4. 选择单元格 `A3:J3`。单击 `单元格样式` 的 `更多`\
  \ 按钮。选择单元格样式 `20% - 强调文字颜色 5`。\n\n5. 选择单元格 `I14:J14`。单击 `单元格样式` 的 `更多` 按钮 ![../images/385660_2_En_12_Chapter/385660_2_En_12_Fige_HTML.jpg](img/385660_2_En_12_Fige_HTML.jpg)。选择单元格样式\
  \ `汇总`。\n\n6. 选择单元格 `J8`。单击 `单元格样式` 的 `更多` 按钮。选择 `差` 单元格样式。\n\n#### 创建新样式\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig32_HTML.jpg](img/385660_2_En_12_Fig32_HTML.jpg)\n\
  \n**图 12-32** 应用您创建的样式进行格式设置\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig31_HTML.jpg](img/385660_2_En_12_Fig31_HTML.jpg)\n\
  \n**图 12-31** 您创建的样式应位于 `自定义` 组中\n\n1. 单击您创建的样式。见图 12-32。\n\n2. 单击 `单元格样式` 的 `更多`\
  \ 按钮。单击 `新建单元格样式`。\n\n3. 单击 `格式` 按钮。\n\n4. 选择 `对齐` 选项卡。将文本设置为 45 度。\n\n5. 选择 `边框`\
  \ 选项卡。选择浅蓝色。在 `预设` 中选择 `外边框`。\n\n6. 选择 `填充` 选项卡。选择浅金色。\n\n7. 选择 `字体` 选项卡。选择颜色 `黑色`。单击\
  \ `确定` 按钮。\n\n8. 将 `样式` 窗口中的样式名称更改为您的姓氏后跟 `Style`，例如“`SlagerStyle`”。\n\n9. 单击 `确定`\
  \ 按钮。\n\n10. 选择单元格 `A3:J3`。单击 `单元格样式` 的 `更多` 按钮。您创建的样式应位于 `自定义` 组中。见图 12-31。\n\n\
  您已学习了如何通过使用主题和单元格样式来应用一致格式。接下来，您将学习如何基于条件设置格式（例如，为一列中所有值超过 500 的单元格应用格式）。\n\n\n\n\
  ## 条件格式\n\n条件格式可根据单元格包含的值来设置其格式。此格式基于你所设定的条件。可以高亮显示你特别关注的单元格。你可以将条件格式应用于表格或任何数据区域。\n\
  \n如果电子表格中包含大量数据，它可以使重要的单元格脱颖而出，或者让你对某一列数值的范围有一个快速的视觉概览。\n\n### 练习 12-4：创建条件格式\n\n\
  在此示例中，你将根据是否满足某些条件来创建格式。你将学习如何编辑、删除和创建新的格式规则。\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig33_HTML.jpg](img/385660_2_En_12_Fig33_HTML.jpg)\n\
  \n**图 12-33** “订单”工作表上的数据\n\n1. 打开工作簿 `Chapter12`。\n2. 单击 `Orders` 工作表。图 12-33 显示了数据。\n\
  \n#### 首/尾规则\n\n![../images/385660_2_En_12_Chapter/385660_2_En_12_Fig34_HTML.jpg](img/385660_2_En_12_Fig34_HTML.jpg)\n\
