  \ + A` 键。这将选中工作表中的所有单元格。\n3. 再次单击一个空白单元格，然后按 `Shift + Ctrl + 空格键`，结果相同。\n\n####\
  \ 选择整个数据块\n\n1. 单击单元格 `B5`。按 `Ctrl + A` 键。这将选中数据块中的所有单元格。\n2. 单击单元格 `B5`。按 `Shift\
  \ + Ctrl + 空格键`。\n3. 单击 **快速访问工具栏** 上的 **保存** 按钮。\n\n您已经学习了如何使用鼠标和键盘选择单元格。接下来，您将学习如何通过输入单元格地址来选择单元格。\n\
  \n\n\n### 直接跳转到任意单元格\n\nExcel 提供了两种直接跳转到任意单元格的方法。一种方法是在`名称`框中键入单元格地址，然后按 `Enter`。另一种方法是使用`定位`功能。\n\
  \n在`名称`框中输入单元格地址是更快捷的方法，但`定位`功能有一个好处，即它能存储你之前跳转过的单元格，便于在单元格之间来回切换。\n\n可以通过单击`开始`选项卡，然后在`编辑`组中单击`查找和选择`箭头以查看下拉菜单来访问`定位`功能。请见图\
  \ 2-8。此功能的快捷键是按 `Ctrl + G`。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig8_HTML.jpg](img/385660_2_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8\n\n从`查找和选择`按钮中选择`定位`\n\n选择`定位…`选项会弹出`定位`对话框。请见图 2-9。\n\n![../images/385660_2_En_2_Chapter/385660_2_En_2_Fig9_HTML.jpg](img/385660_2_En_2_Fig9_HTML.jpg)\n\
