  \n图 13-60：从“标签选项”中选择“横幅”\n\n![../images/385660_2_En_13_Chapter/385660_2_En_13_Fig59_HTML.jpg](img/385660_2_En_13_Fig59_HTML.jpg)\n\
  \n图 13-59：树状图\n\n1.  更改矩形的颜色：\n    1.  单击功能区的“设计”选项卡。在“图表样式”组中，单击“`更改颜色`”按钮。\n2.\
