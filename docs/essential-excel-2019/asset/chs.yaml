  \ Excel 提供了大量预定义形状，例如箭头、星形、横幅、标注等，您可以修改其形状和颜色。接下来，您将学习如何使用 SmartArt。SmartArt 通过将多个形状与文本相结合来创建各种可自定义的图表，从而将形状提升到另一个层次。共有九类图表，每类都包含许多可供选择的布局。您还可以将样式应用于这些布局。\n\
  \n\n\n## 使用 SmartArt\n\nSmartArt 是可自定义图表的集合，分为流程、层次结构、矩阵、棱锥图等类别。`全部`类别显示了其他类别中的所有图表。您可以通过`插入`选项卡`插图`组中的`SmartArt`按钮访问“选择\
  \ SmartArt 图形”对话框，所有图表都会显示出来。请参见图 17-42。\n\n![../images/385660_2_En_17_Chapter/385660_2_En_17_Fig42_HTML.jpg](img/385660_2_En_17_Fig42_HTML.jpg)\n\
  \n图 17-42\n\n`全部`类别显示了其他类别中的所有图表\n\n### 练习 17-8：创建组织结构图\n\n最好在开始在 Excel 中创建图表之前，先在纸上画出您想要的图表样式。在此练习中，您将创建如图\
