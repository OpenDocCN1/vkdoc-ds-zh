  \ 图 10-32 显示了工作表中的数据。\n\n#### 计算\n\n![../images/385660_2_En_10_Chapter/385660_2_En_10_Fig34_HTML.jpg](img/385660_2_En_10_Fig34_HTML.jpg)\n\
