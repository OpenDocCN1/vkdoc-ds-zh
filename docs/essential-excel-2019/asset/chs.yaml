  \ 选项**对话框中的**确定**按钮。\n3.  点击单元格 `A11`。点击你在快速访问工具栏上刚刚创建的按钮。`RelativeReferencing`\
  \ 宏就会运行。\n4.  在**自定义快速访问工具栏**下拉菜单中，选择**用于所有文档（默认）**。下拉菜单的另一个选项是，仅当在使用当前工作簿时，才将宏放入快速访问工具栏。\n\
