  \n---\n\n**练习 10-3：链接到当前工作簿中的某个位置**\n\n在处理大型工作簿时，能够链接到工作簿中的任意单元格是非常方便的。在本练习中，你将创建一个超链接，该链接将跳转到`Sheet2`上的单元格`DA`。\n\
