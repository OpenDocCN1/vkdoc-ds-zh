  trans: "\n# 研讨会问题\n\n1.  针对你选择的演讲主题，撰写一段简短的电梯演讲，描述该演讲的内容以及你将解决的问题。目前这并非完整的概要，而是如果有人问起你的演讲内容时你会如何回答。尝试将这段演讲控制在\
    \ 150 字以内。\n\n2.  根据你选择的主题，挑选一种你希望在幻灯片设计中使用的演讲风格。\n    *   高视觉化演讲\n    *   数据密集型演讲\n\
    \    *   自由流畅型演讲\n    *   激励型演讲\n    *   指导型演讲\n\n3.  既然你已经了解了自己的演讲风格，现在开始思考你的三幕结构，以及希望在每一部分传达什么信息。以下是每幕的提示。\n\
    \    *   **第一幕（开头）**：介绍你自己，以及为什么你要谈论这个主题。然后，引入主题或问题。\n    *   **第二幕（中间）**：开始更详细地探讨主题。\n\
    \    *   **第三幕（结尾）**：你现在已经详细涵盖了你的主要主题。开始总结你的关键点并得出结论。\n\n4.  思考你想在演讲中讲述的故事。仅仅陈述事实可能会使演讲缺乏吸引力，但将你的主题编织成一个故事则会非常引人入胜。你有来自自身经历的真实案例可以用于你的故事吗？如果有，真实的故事效果非常好，因为它们能让你的主题更具共鸣感。如果你没有真实案例可以借鉴，那么你可以虚构一个场景。\n\
    \n5.  使用你选择的幻灯片设计工具（如 Microsoft PowerPoint、Apple Keynote、Google Slides 等），开始构思演讲的视觉主题。不要让它过于复杂，使用基础模板就很好，但考虑设计元素以建立一个视觉风格指南。思考屏幕上的色彩对比度以及文本/图像的大小。你能否在较远距离看清幻灯片？如果你要在大型房间内进行演讲，这一点非常重要。对比度差的深色主题在远距离或对有视力障碍的人而言难以辨认。\n\
    \    *   你将如何格式化标题——字体、字号、标题大小写等。\n    *   你将使用什么配色方案——蓝色、红色、绿色、单色等。\n    *  \
    \ 你将如何呈现信息列表——项目符号的使用或文本分块。\n    *   你将如何使用图片——在屏幕上的位置或作为全屏图像。\n\n# 3. 撰写吸引观众的演讲简介\n\
    \n一旦你设计好了演讲内容和所有幻灯片，你就需要鼓励聚会小组或会议安排你的演讲。当演讲被选中后——尤其是如果你在一个听众同时有多个演讲可供选择的会议上发言——你需要说服与会者报名参加你的演讲。实现这一目标的工具就是演讲简介。简介包含演讲的名称以及演讲的内容。你的演讲简介是留下良好第一印象的最佳机会。\n\
    \n在本章中，我们将回顾简介的标准结构，然后看看我过去做过的四个演讲的简介。\n\n## 简介的重要性\n\n一份简介可以成就或毁掉你演讲的成功。你可能认为你的演讲是有史以来最好的，但如果你的简介很薄弱，无法激发潜在听众的兴趣，他们就会选择另一场演讲。\n\
    \n撰写简介没有固定的规则，但有一个你可以遵循的结构。你可能决定不总是使用这个结构，这也没问题，但它为你提供了一个坚实的起点。典型的简介结构可以概述如下：\n\
    \n*   引人入胜的演讲标题\n*   开场钩子\n*   更多细节\n*   结束语\n\n### 引人入胜的演讲标题\n\n任何人首先看到的就是你的演讲标题，这将决定他们是否想继续阅读。如果标题没有吸引住他们，他们就会直接点击到下一个演讲。我一直成功地采用主标题加副标题的方式来命名演讲。这种格式似乎效果很好。在本章后面，我将带你了解我自己演讲中的四个简介示例，但现在，我们先来看看标题。\n\
    \n第一个标题是“对抗分心的世界：提升你的专注力与自驱力”。主标题相当引人入胜，以一个关于分心世界的演讲吸引了你——这是大多数人都能感同身受的话题。然后副标题谈到提升专注力和自驱力。我们立刻就能看出这个演讲是关于战胜分心、提升专注力和动力的。这个标题本身就很好地展示了演讲的内容。\n\
    \n下一个标题是“`.NET Core` 数据安全：希望不是一种策略”。这是一个非常技术性的软件开发演讲的标题，专注于微软 `.NET` 编程框架。这个听众群体将立即知道这个演讲是关于\
    \ `.NET` 自带的那个安全框架。副标题说希望不是一种策略，暗示忽视数据安全是徒劳的，而本演讲将为你提供一个真正的策略。同样，合适的听众仅从标题就能立即知道演讲内容。这目前是我最受欢迎的演讲，我在世界各地都做过不同版本；它的评分一直非常高。\n\
    \n下一个标题是“使用 Azure Key Vault 保护加密密钥”。这个标题没有副标题，但主标题直切要点。任何在微软 Azure 云计算领域工作的软件开发者都会立刻明白这个演讲的内容。没有花哨的标题党风格用语；标题直接就切入主题。\n\
    \n本章要讨论的最后一个演讲标题是“入侵人类：社会工程学技术及如何防范”。“入侵人类”这个说法是特意选择的，相当大胆。这是一个关于社会工程学的安全演讲，但乍一看，“入侵人类”可能会被理解为别的东西。不过副标题确认了，这个演讲并非关于斧头谋杀。演讲涵盖了社会工程学技术以及如何防范。听过这个演讲的人说，完整的主标题和副标题非常引人注目，因为它们直接暗示你将了解到社会工程师如何运作以及如何防范他们。\n\
    \n最近有一股使用像 BuzzFeed 这类网站上的标题党风格标题的潮流。不过我要说，除非你的演讲设计成幽默风格，否则我建议避免使用标题党。如果内容严肃，标题党看起来会很糟糕，并且会削弱演讲的影响力。如果你觉得这个有趣，你绝对猜不到我接下来要说什么！光是写这句话我就觉得很尴尬。\n\
    \n### 开场钩子\n\n一旦演讲标题抓住了读者的注意力，他们就会想了解更多。你简介的开头几句需要提供一个出色的钩子。你可以陈述一个有趣的事实，或者提出一个你将解决的问题。如今人们的注意力持续时间很短，所以这几句开场白必须吸引人。一旦他们被钩住，就会继续读下去。如果他们读完你的钩子后认为这个演讲不适合自己，他们很可能会停止阅读，不会来参加你的演讲。我将在本章后面部分探讨我一些演讲中的钩子。\n\
    \n### 更多细节\n\n既然你已经通过标题和开场钩子抓住了他们的注意力，他们会想要更多关于你演讲的细节。在这一部分，你可以提供关于你将涵盖内容的详细细节。如果这个演讲针对的是中级或高级水平的人，你需要包含相当多的细节，以便他们能判断你的演讲是否适合他们。你不希望参会者来到你的演讲，期待某些主题，却感觉你没有满足他们的期望。\n"
- fmt: '### Closing Statement


    The closing statement is a final sentence or two that acts as a final hook for
    the reader. After providing the talk’s main details, you might state an interesting
    fact or reiterate the problem you are trying to solve. Essentially, you are trying
    to remind the reader about what’s in it for them if they come to your talk.


    These four steps for writing a synopsis are a guide, not a clear set of rules.
    Of course, you can write whatever you like in the synopsis, but these steps provide
    a solid method to create an enticing talk description. I haven’t always followed
    this style, but they will help if you need somewhere to start.


    Let’s now look at synopses for the four talks I have delivered. These are four
    of my most popular talks that have been accepted at conferences all over the world,
    and they have all been rated very highly by attendees at events that ask them
    to rate the talks. My talks tend to be in the realm of software development, security,
    and personal productivity. It doesn’t matter if your field of interest is different;
    it’s the principles that are important, as shown in the following examples.


    **Note:** The synopsis of your talk is one of the most important aspects of a
    presentation design, besides the presentation itself. If you are submitting to
    a conference, your talk will be accepted or rejected based on the synopsis alone.
    Once you are accepted to speak at an event, the synopsis becomes the primary advert
    to encourage people to attend your talk over someone else’s.


    ## Talk 1: Fighting Back Against a Distracted World: Increasing Your Focus and
    Self-Motivation


    “Fighting Back Against a Distracted World” is a productivity talk I started delivering
    at conferences in 2019. It has been quite popular and regularly fills halls with
    attendees who have given favorable feedback. I already talked about the title
    of this talk earlier in this section of the book and how I use a main title and
    a subtitle to give readers a good impression of what the talk is about.


    Before we break the synopsis down further, I want you to read it in its entirety.


    > *We live in an age of technical wonder, with the internet, high-end games, and
    streaming service all vying for our attention. We have never had so many significant
    innovations available at our fingertips, accessible 24/7. However, with all these
    systems, we are becoming increasingly distracted and struggling to focus for extended
    periods. If left unchecked, these distractions can affect our work, careers, and
    self-confidence. We need to be able to break this cycle of distraction while still
    enjoying all these innovations.*


    > *When I first became self-employed, I thought that I would have the ultimate
    freedom to do what I wanted when I wanted. To a degree, I did, but I didn’t have
    anyone looking over me, holding me accountable. I started to become distracted.
    After a while, I decided things had to change. I began a quest to become more
    productive, focused, and motivated—while still indulging in the occasional Netflix
    binge.*


    > *In this talk, I share my story of personal distraction, low motivation, and
    increased project anxiety. I also share how I broke this cycle and got my creative
    and productive mojo back.*


    > *This talk is aimed at anyone who strives to be more productive but struggles
    with distractions daily. I cover the following subjects:*


    * > *Distraction and procrastination*

    * > *Finding meaning in your work*

    * > *Self-motivation*

    * > *Locus of control*

    * > *Productivity and time management*

    * > *Social media addiction*


    > *I now consider myself very productive, but getting there was a battle. Let
    me share my story so that I can help you become productive and confident too.*


    Overall, this is a synopsis that I am proud of, and it is one of my newer talks.
    We have already looked at the title, but let’s break down the opening hook further.


    > *We live in an age of technical wonder, with the internet, high-end games, and
    streaming service all vying for our attention. We have never had so many significant
    innovations available at our fingertips, accessible 24/7. However, with all these
    systems, we are becoming increasingly distracted and struggling to focus for extended
    periods. If left unchecked, these distractions can affect our work, careers, and
    self-confidence. We need to be able to break this cycle of distraction while still
    enjoying all these innovations.*


    I start off by reminding the reader that the world we live in is wonderful with
    all the technology at our fingertips. Just look at the humble iPad, for example,
    a glass screen you can carry around and access any information you want, watch
    films, talk to family or friends, or play games. It wasn’t so long ago that iPad-like
    devices were the mainstay of science fiction. I always remember Jean-Luc Picard
    in his ready room on the Starship Enterprise accessing information on what looked
    like a tablet device. I always wanted one, and now we have several similar devices
    in my household.'
