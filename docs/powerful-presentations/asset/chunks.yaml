- fmt: '### The Rise of Online Presenting in a COVID-19 World


    Speaking online is nothing new. It has been around for many years, but with the
    onset of the COVID-19 pandemic in 2020 and 2021, online programs were brought
    to the forefront. Overnight, all in-person events were cancelled, and many were
    converted at the last minute into online events. I was caught up in many events
    that suddenly went online.


    One of the conference companies I work with, NDC Conferences based in Oslo, Norway,
    was no exception. Just before the pandemic officially started, I spoke at two
    in-person NDC events—a smaller security event in Oslo and one of their bigger
    multitrack conferences in London the following week. My next speaking event for
    NDC Conferences was scheduled in Porto, Portugal. I was looking forward to going
    to that event because I had never been to Porto before, but the event was quickly
    changed to an online event.


    Personally, out of all the online events in which I participated, I liked NDC’s
    approach to conferences the best, as it was simple. If you were a ticket holder,
    then you were invited to a `slack` team where multiple channels were set up for
    each presentation room, the chill-out and chat areas, etc. Each talk took place
    over either `Zoom` or `Cisco Webex`. The talks were advertised in the `slack`
    channels for each room, and the participants and speaker signed into the video
    conference software and the speaker delivered the talk.


    The experience, obviously, is different from an in-person event. However, given
    the unprecedented events the world was facing and everyone having to adopt social
    distancing, this virtual event setup worked very well.


    As the world emerges from the COVID-19 pandemic, I think what we will continue
    to see a more hybrid model for conferences. In-person events will return and command
    higher ticket prices, but there will also be a less expensive online-only version
    of the event in which talks will be streamed as they happen. If anything, the
    pandemic has taught speakers and event companies how to innovate, so the future
    could be quite interesting.


    ### Tips to Get the Most Out of Speaking Online


    Speaking at an in-person event vs. an online event is similar when it comes to
    the actual delivery of the talk. The writing, preparation, and rehearsal are not
    much different; you need to put in the same level of work and effort. The delivery
    of the talk is where the difference lies, as you are not physically in the same
    room as the people you are addressing. Let’s look at some tips to help you get
    the most out of speaking to an online audience.


    #### Stand If You Can


    It can be tempting to sit down when you’re presenting online as you are simply
    talking to your computer. Therefore, it might not feel much different from attending
    a virtual meeting with colleagues, but I find if you stand when speaking, it puts
    you into a different mindset of delivering a high-quality talk.


    I use an electric standing desk in my office, so if I want to stand, I simply
    press a button to raise the desk. If you don’t have a standing desk, you can still
    stand if you can reposition your webcam. If you are using a separate webcam from
    your computer, then you can attach it to a tripod to raise its level—please note
    that I do recommend buying a better-quality webcam, as the camera that comes with
    laptops is not great.


    #### Visualize Your Audience


    When you are delivering an in-person talk, it is very easy to gauge their reactions,
    as they are sitting close to you. Online, this is much harder, as physical distance
    and technology are separating you. With platforms like `Zoom`, `Microsoft Teams`,
    and `Cisco Webex`, you can see a gallery view of participants, hopefully with
    their cameras turned on, so you can see their faces and reactions. While in principle
    this is a great idea, it rarely works out that well.


    During the pandemic, when I was presenting online, people were initially keen
    to enable their camera and be seen. At the first online event I spoke at, toward
    the start of the event, cameras were on. As the event ran into the final day,
    more attendees started turning their cameras off, as they didn’t want to be seen.
    I can understand this: having your camera at home can feel like an invasion of
    privacy, and as people get more fatigued with online talks, it is only natural
    that people turn off their cameras.


    At one event I did in January 2021, not a single person had their camera on out
    of 80 attendees watching my talk. Now, whenever I do an online talk, I don’t even
    bother showing the gallery view. I just treat it more like a webinar. I show up
    and do my talk.


    #### Be Aware of Your Background


    This one may seem obvious, but I have watched loads of presentations where the
    speaker has a messy background, and it is very distracting. There is nothing worse
    than clutter or seeing laundry hanging up behind you. I can offer a few solutions
    here. First, tidy up before you present, move the clutter out of the way, and
    leave the background looking natural. Nobody wants to see your underpants hanging
    up to dry. If you can, setting a light behind you to illuminate the background
    can also make a substantial difference. You don’t have to spend a lot of money
    on fancy lighting rigs, but a desk lamp highlighting the background can work wonders
    to make an interesting scene.


    Some people—speakers and attendees—don’t necessarily like other people seeing
    where they live. Modern video platforms like `Zoom` allow you to change your background.
    `Zoom` will do a decent job of replacing your background with a picture of your
    choosing, but if you really want to make it look good, you can use a green screen
    behind you. If you use a green screen, `Zoom`, or other equivalent platforms,
    will do a much better job of removing your physical background and replacing it
    with an image. This way, you can have anything you like as the background—a library,
    a tropical island, or, my personal favorite, the bridge of the Starship Enterprise
    from Star Trek.


    #### Focus on Lighting


    Good lighting is important to making sure you look good on camera. If you have
    poor lighting, then you will look too dark on the screen. If you are presenting
    while standing in front of a big window, you will look like a silhouette on the
    video.


    If you are presenting from a room that is well lit—a window to your side, decent
    overhead room lights—then you really don’t need to invest in a lot of expensive
    lighting panels. However, if your room is quite dark, then a few LED lights on
    either side of your monitor may be a good idea. You can buy LED lighting panels
    for little cost these days. I bought two lighting panels with tripods for less
    than $100. Don’t over-engineer your lighting. You simply need a little illumination;
    you are not trying to light the next Hollywood blockbuster. If your room already
    has good lighting, just go with that. Your attendees will most likely be looking
    at your slides, not at you.


    #### Dress Appropriately


    Just because you’re presenting from home doesn’t mean you should look like a complete
    slob. Think about the event at which you are presenting, and then consider what
    clothing would be appropriate. If this is a corporate event full of C-suite-level
    executives, then you want to make some effort and dress smartly.


    If it is a software development conference, for example, then you can be a little
    more casual and wear jeans and a T-shirt. I don’t recommend wearing your pajamas
    for a talk, even if you just rolled out of bed ten minutes before you’re presenting—unless
    you are presenting at the international convention of pajama wearers.


    When you are speaking publicly, you are putting yourself out in the world to share
    ideas. People will judge you, and you must make a good first impression, no matter
    whether you are speaking online or on stage at an in-person event.'
