- fmt: "### Be Careful with Animation\n\nPresentation tools like `PowerPoint` and\
    \ `Keynote` allow you to set up elaborate animations of elements on the screen.\
    \ Animation can be a powerful way to add visual impact to your presentation, but\
    \ it doesn’t take much for animation to become a distraction. If you are using\
    \ animation to transition between slides and elements on the slides, this can\
    \ look quite good. However, I would guard against being overly clever as you don’t\
    \ want to distract the audience with too much movement.\n\nPersonally, I don’t\
    \ use any animation, as it can quickly go from looking subtle and tasteful to\
    \ being a gimmick. I am not a particularly good visual designer, so I err on the\
    \ side of caution and keep my slides as simple as possible.\n\nAs the designer\
    \ of your own slides, only you can decide what is acceptable for you and your\
    \ audience. As previously stated, there aren’t really any hard and fast rules—only\
    \ general advice.\n\n### Think of the People Sitting at the Back of the Room\n\
    \nWhen you are designing your slide deck, it is a good idea—as previously mentioned—to\
    \ think about the audience viewing the slides. You also need to think about the\
    \ audience sitting toward the back of the room, especially if you are speaking\
    \ to a group in a large hall. Unless the venue has screens positioned throughout\
    \ the hall, most people will be looking at a screen toward the front of the stage.\n\
    \nBuilding on what was already described in this chapter, imagine what it would\
    \ feel like for anyone sitting at the back of the room if your slides are cluttered\
    \ with text and too busy. They won’t be able to read the slides and will immediately\
    \ disengage with the talk. You could be giving the talk of your life, but if the\
    \ slides are hard to interpret and read, you will struggle to keep the engagement\
    \ levels high in the room.\n\nThe same can be said for the contrast of the slides,\
    \ which can greatly impact readability. By contrast, I mean the difference in\
    \ the intensity of colors on the screen. If you have a light blue box with slightly\
    \ lighter blue text on it, the text will be hard to read, especially if you are\
    \ at the back of the room. If you have a blue box with either white or black text,\
    \ the text will be easier to read at the back of the room.\n\nNot everyone has\
    \ perfect eyesight, so some people rely on high-contrast colors on the screen\
    \ to comfortably read any text.\n\n> **Note**  \n> Planning, writing, and delivering\
    \ a talk enable you to strengthen your critical thinking skills.\n\n### Summarizing\
    \ Information\n\nWhen you get to the end of your presentation, have made all your\
    \ main points, and have achieved your overall goal, you’ll need to wrap up the\
    \ presentation with a good summary. By that time, the audience will have listened\
    \ to your talk for up to an hour. Depending on the length of the talk, you would\
    \ have conveyed a lot of information to the audience. A standard conference talk,\
    \ for example, is 60 minutes. Speaking for this length of time means that you\
    \ will be giving a lot of information. When you get near the end of your talk,\
    \ you’ll need to summarize your main discussion points.\n\nThe talk summary shouldn’t\
    \ just be a brief recounting of everything that has come before it. Instead, use\
    \ the summary as a chance to illustrate the talk’s main points, the key resolution\
    \ to the talk’s goal, and any important takeaways.\n\nMost conference attendees\
    \ are likely to see at least five talks a day over a two- or three-day period.\
    \ That is a lot of information to absorb in a few days. The summary provides a\
    \ vital tool for making sure that your audience retains your main message. Don’t\
    \ skimp on the summary; it is probably the most important and most impactful part\
    \ of your entire talk.\n\n### Creating a Call to Action\n\nOnce you have written\
    \ your summary, you can then offer a call to action, which is an important part\
    \ of the presentation because this is where you could have the most significant\
    \ influence on your audience. To start, let’s talk about what a call to action\
    \ is.\n\nThe call to action refers to the part of your content where you encourage\
    \ audience members to do something after the presentation. The activity that you\
    \ ask of them to do can be as simple as following you on a social networking website.\
    \ It could also require a more significant commitment, such as asking them to\
    \ sign up for your newsletter or purchase a product.\n\nWhile you may want to\
    \ promote your products and services, it might not be appropriate, depending on\
    \ the nature of the event. In a conference, for example, people expect to learn\
    \ rather than hear marketing pitches. In this case, it may be better to use fewer\
    \ sales-based calls to action. Also, bear in mind that many conferences have strict\
    \ rules against sales pitches, so make sure that you’re not breaking any event\
    \ rules; otherwise, you may not be invited back in the future.\n\nThe call to\
    \ action may be subtly included in your presentation, or it could be delivered\
    \ quickly at the end. If you are championing a cause, and you think that it fits\
    \ well with your presentation, you may add it to the conclusion or create an engaging\
    \ story related to the call to action for a greater impact on the audience. You\
    \ could also include the call to action in your slides to remind the engaged audience\
    \ that you want them to do something.\n\nYou should also make sure that your call\
    \ to action is easy to understand. If the tasks that the audience needs to do\
    \ seem complicated, you could break them into steps and present them in sequential\
    \ order.\n\nOne brilliant technique that I have seen is to put a QR code on the\
    \ slide that redirects to a webpage instead of putting the web address on a slide.\
    \ Then, all the attendees must do is take a photo of the slide on the screen instead\
    \ of trying to type in a URL. If you want to generate a QR code, there are plenty\
    \ of free sites you can use.\n\n> **Tip**  \n> The most effective call to action\
    \ is the action that the audience member takes when they are sitting in the room\
    \ with you there and then. If you are speaking at a conference, the chances are\
    \ very high that they will forget to take any action that you ask of them.\n\n\
    ### Summary\n\nIn this chapter, we identified what makes a good presentation.\
    \ To put your point across with an audience, you need to plan ahead and design\
    \ your presentation, just like you would do for any creative exploit, whether\
    \ that’s software, a book, etc.\n\nIf you follow the advice from this chapter\
    \ and use the following workshop questions to help you, with a little planning,\
    \ you can create an engaging presentation on any subject that interests you."
  raw: '### Be Careful with Animation


    Presentation tools like PowerPoint and Keynote allow you to set up elaborate animations
    of elements on the screen. Animation can be a powerful way to add visual impact
    to your presentation, but it doesn’t take much for animation to become a distraction.
    If you are using animation to transition between slides and elements on the slides,
    this can look quite good. However, I would guard against being overly clever as
    you don’t want to distract the audience with too much movement.


    Personally, I don’t use any animation, as it can quickly go from looking subtle
    and tasteful to being a gimmick. I am not a particularly good visual designer,
    so I err on the side of caution and keep my slides as simple as possible.


    As the designer of your own slides, only you can decide what is acceptable for
    you and your audience. As previously stated, there aren’t really any hard and
    fast rules—only general advice.


    ### Think of the People Sitting at the Back of the Room


    When you are designing your slide deck, it is a good idea—as previously mentioned—to
    think about the audience viewing the slides. You also need to think about the
    audience sitting toward the back of the room, especially if you are speaking to
    a group in a large hall. Unless the venue has screens positioned throughout the
    hall, most people will be looking at a screen toward the front of the stage.


    Building on what was already described in this chapter, imagine what it would
    feel like for anyone sitting at the back of the room if your slides are cluttered
    with text and too busy. They won’t be able to read the slides and will immediately
    disengage with the talk. You could be giving the talk of your life, but if the
    slides are hard to interpret and read, you will struggle to keep the engagement
    levels high in the room.


    The same can be said for the contrast of the slides, which can greatly impact
    readability. By contrast, I mean the difference in the intensity of colors on
    the screen. If you have a light blue box with slightly lighter blue text on it,
    the text will be hard to read, especially if you are at the back of the room.
    If you have a blue box with either white or black text, the text will be easier
    to read at the back of the room.


    Not everyone has perfect eyesight, so some people rely on high-contrast colors
    on the screen to comfortably read any text.


    Note


    Planning, writing, and delivering a talk enable you to strengthen you critical
    thinking skills.


    ## Summarizing Information


    When you get to the end of your presentation, have made all your main points,
    and have achieved your overall goal, you’ll need to wrap up the presentation with
    a good summary. By that time, the audience will have listened to your talk for
    up to an hour. Depending on the length of the talk, you would have conveyed a
    lot of information to the audience. A standard conference talk, for example, is
    60 minutes. Speaking for this length of time means that you will be giving a lot
    of information. When you get near the end of your talk, you’ll need to summarize
    your main discussion points.


    The talk summary shouldn’t just be a brief recounting of everything that has come
    before it. Instead, use the summary as a chance to illustrate the talk’s main
    points, the key resolution to the talk’s goal, and any important takeaways.


    Most conference attendees are likely to see at least five talks a day over a two-
    or three-day period. That is a lot of information to absorb in a few days. The
    summary provides a vital tool for making sure that your audience retains your
    main message. Don’t skimp on the summary; it is probably the most important and
    most impactful part of your entire talk.


    ## Creating a Call to Action


    Once you have written your summary, you can then offer a call to action, which
    is an important part of the presentation because this is where you could have
    the most significant influence on your audience. To start, let’s talk about what
    a call to action is.


    The call to action refers to the part of your content where you encourage audience
    members to do something after the presentation. The activity that you ask of them
    to do can be as simple as following you on a social networking website. It could
    also require a more significant commitment, such as asking them to sign up for
    your newsletter or purchase a product.


    While you may want to promote your products and services, it might not be appropriate,
    depending on the nature of the event. In a conference, for example, people expect
    to learn rather than hear marketing pitches. In this case, it may be better to
    use fewer sales-based calls to action. Also, bear in mind that many conferences
    have strict rules against sales pitches, so make sure that you’re not breaking
    any event rules; otherwise, you may not be invited back in the future.


    The call to action may be subtly included in your presentation, or it could be
    delivered quickly at the end. If you are championing a cause, and you think that
    it fits well with your presentation, you may add it to the conclusion or create
    an engaging story related to the call to action for a greater impact on the audience.
    You could also include the call to action in your slides to remind the engaged
    audience that you want them to do something.


    You should also make sure that your call to action is easy to understand. If the
    tasks that the audience needs to do seem complicated, you could break them into
    steps and present them in sequential order.


    One brilliant technique that I have seen is to put a QR code on the slide that
    redirects to a webpage instead of putting the web address on a slide. Then, all
    the attendees must do is take a photo of the slide on the screen instead of trying
    to type in a URL. If you want to generate a QR code, there are plenty of free
    sites you can use.


    Tip


    The most effective call to action is the action that the audience member takes
    when they are sitting in the room with you there and then. If you are speaking
    at a conference, the chances are very high that they will forget to take any action
    that you ask of them.


    ## Summary


    In this chapter, we identified what makes a good presentation. To put your point
    across with an audience, you need to plan ahead and design your presentation,
    just like you would do for any creative exploit, whether that’s software, a book,
    etc.


    If you follow the advice from this chapter and use the following workshop questions
    to help you, with a little planning, you can create an engaging presentation on
    any subject that interests you.'
  trans: "\n### 谨慎使用动画\n\n`PowerPoint` 和 `Keynote` 等演示工具允许你为屏幕上的元素设置精妙的动画。动画是增强演示视觉冲击力的强大方式，但稍有不慎就可能变成一种干扰。如果在幻灯片之间以及幻灯片内元素之间使用动画进行过渡，效果会相当不错。不过，我建议要避免过于花哨，因为你不希望过多的动态效果分散观众的注意力。\n\
    \n就我个人而言，我不会使用任何动画，因为它很容易从微妙的雅致变成一种噱头。我不是一个特别出色的视觉设计师，所以我宁愿谨慎行事，让我的幻灯片尽可能保持简洁。\n\
    \n作为你自己幻灯片的设计者，只有你能决定什么对于你和你的观众是可接受的。如前所述，这里其实没有硬性规定——只有一些通用建议。\n\n### 为后排观众着想\n\
    \n在设计你的幻灯片时，建议——如前所述——要考虑到观看幻灯片的观众。你还需要考虑坐在房间后排的观众，尤其是在大型场馆对一群人演讲时。除非场地内遍布屏幕，否则大多数人都会看向舞台前方的屏幕。\n\
    \n结合本章已阐述的内容，想象一下：如果你的幻灯片充斥着文字且过于拥挤，坐在后排的人会是什么感觉？他们将无法看清幻灯片，并会立即对演讲失去兴趣。你可能正在进行一场毕生最精彩的演讲，但如果幻灯片难以解读和阅读，你将很难让现场的参与度保持在高水平。\n\
    \n幻灯片的对比度也是如此，它会极大地影响可读性。这里的对比度，指的是屏幕上色彩强度的差异。如果你有一个浅蓝色的框，上面再配上颜色稍浅的蓝色文字，那么文字将很难辨认，尤其是当你在房间后排时。如果你有一个蓝色的框，配以白色或黑色的文字，那么在后排阅读这些文字就会容易得多。\n\
    \n并不是每个人都有完美的视力，因此有些人需要依靠屏幕上的高对比度颜色才能舒适地阅读任何文本。\n\n> **注意**  \n> 规划、撰写和发表演讲能够帮助你加强批判性思维能力。\n\
    \n### 总结信息\n\n当你的演示接近尾声，你已经阐述了所有要点并实现了总体目标后，你需要用一个很好的总结来收尾。届时，观众已经听了长达一小时的演讲。根据演讲的长度，你向观众传达了大量的信息。例如，一个标准的会议演讲是\
    \ 60 分钟。进行这么长时间的演讲意味着你将提供很多信息。当演讲接近尾声时，你需要总结你的主要讨论要点。\n\n演讲总结不应仅仅是对前面所有内容的简要复述。相反，要利用总结的机会来阐明演讲的要点、演讲目标的关键解决方案，以及任何重要的收获。\n\
    \n大多数会议与会者可能每天至少观看五场演讲，持续两到三天。在几天内吸收如此大量的信息是很困难的。总结提供了一个至关重要的工具，以确保你的观众记住你的核心信息。不要在总结上吝啬；它可能就是你整个演讲中最重要、最有影响力的部分。\n\
    \n### 创建行动号召\n\n写下总结之后，你就可以提出行动号召了，这是演示文稿的重要组成部分，因为这是你能对观众产生最显著影响的地方。首先，我们来谈谈什么是行动号召。\n\
    \n行动号召指的是你内容中鼓励观众在演示后采取行动的部分。你要求他们做的活动可以简单到在社交网站上关注你。它也可能需要更重大的承诺，比如要求他们注册你的新闻通讯或购买产品。\n\
    \n虽然你可能想推广自己的产品和服务，但根据活动的性质，这或许并不合适。例如，在会议上，人们期望的是学习，而不是听到营销宣传。在这种情况下，最好少用基于销售的行动号召。同时，请记住，许多会议对推销有严格的规定，所以要确保你没有违反任何活动规则；否则，将来你可能不会再被邀请。\n\
    \n行动号召可以巧妙地包含在你的演示中，或者也可以在结尾处快速提及。如果你在倡导某项事业，并且认为这与你的演示很契合，你可以将其添加到结论中，或者创造一个与行动号召相关的引人入胜的故事，以便对观众产生更大的影响。你也可以在幻灯片中加入行动号召，以提醒专注的观众你希望他们做一些事情。\n\
    \n你还应该确保你的行动号召易于理解。如果观众需要完成的任务看起来很复杂，你可以将它们分解成步骤，并按顺序呈现。\n\n我见过一个很棒的技术：在幻灯片上放置一个二维码，链接到一个网页，而不是把网址放在幻灯片上。这样，所有与会者需要做的就是拍下屏幕上的幻灯片照片，而不是费力地输入\
    \ URL。如果你想生成二维码，有很多免费网站可以使用。\n\n> **提示**  \n> 最有效的行动号召是观众在和你同处一室、当场就能采取的行动。如果你在会议上发言，他们很可能会忘记执行你要求的任何行动。\n\
    \n### 总结\n\n在本章中，我们明确了什么是一次好的演示。要在观众面前清楚地表达你的观点，你需要提前规划并设计你的演示，就像你做任何创造性工作（无论是软件、书籍等）一样。\n\
    \n如果你遵循本章的建议，并利用下面的研讨会问题来协助自己，稍加规划，你就能就任何你感兴趣的主题创作出一场引人入胜的演示。\n"
- fmt: "# Workshop Questions\n\n1.  For your chosen presentation topic, write a simple\
    \ elevator pitch to describe what the talk is about and what problem you will\
    \ solve. This isn’t a full synopsis at this point, but what would you say if someone\
    \ asked you what the talk is about. Try and write this pitch in under 150 words.\n\
    \n2.  Based on your chosen topic, pick a style of presentation that you want to\
    \ use for the slide design.\n    *   Highly visual presentation\n    *   Data-rich\
    \ presentation\n    *   Free-flowing presentation\n    *   Motivational presentation\n\
    \    *   Instructional presentation\n\n3.  Now that you know your presentation\
    \ style, start to think about your three-act structure and what information you\
    \ want to convey in each section. Here is a reminder of each act.\n    *   **Act\
    \ 1 (The Beginning)**: Introduce yourself and why you are speaking on this topic.\
    \ Then, introduce the topic or problem.\n    *   **Act 2 (The Middle)**: Start\
    \ exploring the topic in more detail.\n    *   **Act 3 (The End)**: You have now\
    \ covered your main topic in detail. Start summarizing your key points and draw\
    \ your conclusions.\n\n4.  Think about the story you want to tell in your presentation.\
    \ Just presenting straight facts can make for an unappealing presentation, but\
    \ weaving your topic into a story can be very engaging. Do you have a real-world\
    \ example from your own experiences that you can use for your story? If so, real\
    \ stories work very well as they can make your topic relatable. If you don’t have\
    \ a real-world example to draw from, then you can make up a fictional scenario.\n\
    \n5.  Using your slide-designing tool of choice (Microsoft PowerPoint, Apple Keynote,\
    \ Google Slides, etc.), start to think about your visual theme for the presentation.\
    \ Don’t make it overcomplicated, and using basic templates is fine, but think\
    \ about the design elements to build up a visual style guide. Consider color contrast\
    \ on the screen and the size of text/images. Can you read the slides at a distance?\
    \ This is important if you are presenting in a large room. Darker color themes\
    \ with poor contrast are hard to read from a distance, or by people with visual\
    \ impairments.\n    *   How you will format titles—font, size, title case, etc.\n\
    \    *   What color scheme you will use—blues, reds, greens, monochrome, etc.\n\
    \    *   How you will represent lists of information—your use of bullet points\
    \ or text chunking\n    *   How you will use images—placement on the screen or\
    \ as full-screen images\n\n# 3. Writing a Synopsis to Draw in Your Audience\n\n\
    Once you have designed your talk and all the slides, you need to encourage meetup\
    \ groups or conferences to schedule your talk. Once the talk has been selected—especially\
    \ if you are speaking at a conference where the audience has a choice of talks\
    \ to see at the same time—you need to convince attendees to sign up for yours.\
    \ The tool for doing this is the synopsis. The synopsis contains the name of the\
    \ talk and what the talk is about. Your talk synopsis is your best opportunity\
    \ to make a strong first impression.\n\nIn this chapter, we’ll go over the standard\
    \ structure of a synopsis and then look at synopses of four talks I have presented\
    \ in the past.\n\n## The Importance of a Synopsis\n\nA synopsis can make or break\
    \ the success of your talk. You may believe that your talk is the best one ever\
    \ given, but if your synopsis is weak and doesn’t excite your potential audience,\
    \ they will choose a different talk instead.\n\nThere are no fixed rules about\
    \ writing a synopsis, but there is a structure you can follow. You may decide\
    \ not to use this structure all the time, and that’s fine, but it gives you a\
    \ solid starting point. A typical synopsis structure can be outlined as follows:\n\
    \n*   Catchy talk title\n*   Initial hook\n*   More details\n*   Closing statement\n\
    \n### Catchy Talk Title\n\nThe first thing anyone will see is your talk title,\
    \ which will determine whether they want to continue reading. If the title doesn’t\
    \ grab them, then they will simply click to the next talk. I have always had success\
    \ using a title and subtitle for a talk. This format seems to work quite well.\
    \ Later in this chapter, I will take you through four talk synopsis examples from\
    \ my own talks, but for now, let’s look at the titles.\n\nThe first title is “Fighting\
    \ Back Against a Distracted World: Increasing Your Focus and Self-Motivation.”\
    \ The main title is quite catchy and draws you in with a talk about a distracted\
    \ world—something most people can relate to. Then the subtitle talks about increasing\
    \ your focus and self-motivation. Straight away, we can see the talk is about\
    \ beating distractions and increasing focus and motivation. This title on its\
    \ own offers a good impression of what the talk is about.\n\nThe next title is\
    \ “Dot NET Core Data Security: Hope Is Not a Strategy.” This is the title of a\
    \ very technical software development talk focusing on the Microsoft Dot NET programming\
    \ framework. This audience group will immediately know that this talk is about\
    \ the security framework that comes with Dot NET. The subtitle says that hope\
    \ is not a strategy, which implies that ignoring data security is futile, and\
    \ this talk will give you a real strategy. Again, the right audience will immediately\
    \ know what the talk is about just from the title. This has been by far my most\
    \ popular talk, and I have done versions of it all around the world; it consistently\
    \ rates very high with attendees.\n\nThe next title is “Protecting Encryption\
    \ Keys with Azure Key Vault.” This title doesn’t have a subtitle, but the main\
    \ title gets straight to the point. Any software developer in the Microsoft Azure\
    \ cloud computing space will immediately know what this talk is about. There are\
    \ no fancy clickbait style words; the title just gets to the point straight away.\n\
    \nThe final talk title I will discuss in this chapter is “Hacking Humans: Social\
    \ Engineering Techniques and How to Protect Against Them.” The use of “hacking\
    \ humans” was deliberately picked to be quite bold. This is a security talk about\
    \ social engineering, but at first glance, hacking humans could be thought of\
    \ as something else. The talk isn’t about axe murders, though, which the subtitle\
    \ confirms. The talk covers social engineering techniques and how to protect against\
    \ them. People who have heard this talk said that the full title and subtitle\
    \ were compelling, as they immediately imply that you’ll learn about how social\
    \ engineers work and how to guard against them.\n\nThere has been quite a trend\
    \ lately to use clickbait-style titles like those on websites such as BuzzFeed.\
    \ I would say, however, that unless your talk is designed to be humorous, I would\
    \ avoid clickbait. It looks bad and cheapens the impact of your talk if it is\
    \ serious. If you find this interesting, you’ll never guess what I’m going to\
    \ say next! I cringed just writing that.\n\n### Initial Hook\n\nOnce the talk\
    \ title has grabbed your readers, they will want to know more. The first few sentences\
    \ of your synopsis need to provide a great hook. You may state an interesting\
    \ fact or propose a problem that you are going to solve. People have short attention\
    \ spans these days, so these first few sentences must draw people in. Once they\
    \ have been hooked, they will continue reading. If they don’t think the talk is\
    \ for them after reading your hook, they will likely stop reading and won’t attend\
    \ the talk. I will look at the hooks for some of my talks later in this chapter.\n\
    \n### More Detail\n\nNow that you have grabbed their attention with the title\
    \ and the first hook, they will want more details about your talk. In this section,\
    \ you can provide granular details on what you will cover. If this talk is aimed\
    \ at people at an intermediate or advanced level, you’ll want to include a fair\
    \ number of details so that they can determine whether your talk will be suitable\
    \ for them. You don’t want attendees to come to your talk who expect certain topics\
    \ but then feeling you didn’t deliver on their expectations."
