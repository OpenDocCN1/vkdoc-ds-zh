  trans: '

    ### 新冠疫情时代在线演讲的兴起


    线上演讲并非新鲜事。它已存在多年，但随着 2020 年和 2021 年新冠疫情的爆发，在线项目被推到了最前沿。一夜之间，所有线下活动都被取消，许多活动在最后一刻转为线上。我亲身经历了许多突然转向线上的活动。


    我合作的一家会议公司——位于挪威奥斯陆的 NDC Conferences——也不例外。就在疫情正式爆发前，我在两场 NDC 线下活动中发表过演讲——一场在奥斯陆举行的较小规模的安全会议，以及随后一周在伦敦举行的大型多轨会议之一。我为
    NDC Conferences 安排的下一场演讲活动原定在葡萄牙波尔图。我很期待参加那场活动，因为我从未去过波尔图，但该活动很快被改为线上形式。


    就个人而言，在我参与的所有线上活动中，我最喜欢 NDC 的会议组织方式，因为它很简单。如果你持有门票，你会被邀请加入一个 `slack` 团队，其中为每个演讲厅、休息区和聊天区等设置了多个频道。每次演讲通过
    `Zoom` 或 `Cisco Webex` 进行。演讲在每个房间对应的 `slack` 频道中发布通知，参与者和演讲者登录视频会议软件，然后演讲者开始演讲。


    显然，这种体验与线下活动不同。然而，考虑到世界正面临前所未有的状况，每个人都必须保持社交距离，这种虚拟活动的设置运作得非常好。


    随着世界逐渐走出新冠疫情，我认为我们将继续看到一种更为混合的会议模式。线下活动将回归，票价也会更高，但同时也会有一种更便宜的纯线上版本，演讲会进行实时直播。如果说疫情教会了演讲者和活动公司什么，那就是如何创新，因此未来可能会非常有趣。


    ### 充分发挥线上演讲效果的技巧


    在线上活动与线下活动发表演讲，在演讲的实际呈现方面是相似的。写作、准备和排练没有太大区别；你需要投入同等程度的工作和努力。区别在于演讲的呈现方式，因为你与听众并不在同一个物理空间。让我们看看一些技巧，帮助你更好地向线上观众演讲。


    #### 尽量站着演讲


    在线演讲时，你只是对着电脑说话，很容易想坐着。因此，这可能感觉与参加同事的虚拟会议没有太大区别，但我发现，如果你站着演讲，会让你进入一种不同的心态，从而呈现高质量的演讲。


    我在办公室使用电动升降桌，所以如果我想站着，只需按一下按钮就能把桌子升起来。如果你没有升降桌，只要能重新调整摄像头的角度，你仍然可以站着。如果你使用的是独立于电脑的摄像头，你可以把它安装在三脚架上抬高——请注意，我确实建议购买质量更好的摄像头，因为笔记本电脑自带的摄像头效果不佳。


    #### 想象你的观众


    进行线下演讲时，你很容易判断观众的反应，因为他们就坐在你附近。在线演讲则要困难得多，因为物理距离和技术手段将你们分隔开来。通过像 `Zoom`、`Microsoft
    Teams` 和 `Cisco Webex` 这样的平台，你可以看到参与者的**画廊视图**，希望他们打开了摄像头，这样你就能看到他们的面孔和反应。虽然理论上这是个好主意，但实际效果往往不尽如人意。


    在疫情期间，当我进行线上演讲时，人们最初很乐意开启摄像头并露面。在我参与的第一场线上活动中，活动初期摄像头是开着的。随着活动进入最后一天，越来越多的参与者开始关闭摄像头，因为他们不希望被看到。我能理解这一点：在家开启摄像头会让人感觉隐私受到侵犯，而且随着人们对线上演讲越来越疲劳，关掉摄像头也是很自然的事。


    在 2021 年 1 月我参加的一场活动中，观看我演讲的 80 名参与者中，没有一个人打开摄像头。现在，每当我进行线上演讲时，我甚至懒得显示画廊视图了。我更多地将它视为一场网络研讨会。我出现，然后做我的演讲。


    #### 注意你的背景


    这一点可能显而易见，但我看过很多演讲，演讲者的背景杂乱无章，非常分散注意力。没有什么比杂乱无章或看到你身后挂着待洗的衣物更糟糕的了。我可以提供几个解决方案。首先，在演讲前整理好，把杂物移开，让背景看起来自然。没人想看到你晾着的内裤。如果可能的话，在身后设置一盏灯照亮背景，也能带来显著的不同。你不必花大价钱购买昂贵的灯光设备，但一盏照亮背景的台灯就能创造出有趣的场景，效果出奇地好。


    有些人——包括演讲者和参与者——不一定喜欢让别人看到自己的居住环境。像 `Zoom` 这样的现代视频平台允许你更改背景。`Zoom` 可以用你选择的图片替换你的背景，效果还不错，但如果你真想让它看起来更棒，可以在身后使用绿幕。如果你使用绿幕，`Zoom`
    或其他类似平台能更出色地移除你的物理背景并用图像替换。这样，你可以选择任何你喜欢的背景——图书馆、热带岛屿，或者我个人最喜欢的，《星际迷航》中企业号星舰的舰桥。


    #### 关注照明


    良好的照明对于确保你在摄像头前看起来状态良好至关重要。如果照明不佳，你在屏幕上会显得太暗。如果你站在大窗户前演讲，在视频中你会看起来像一个剪影。


    如果你在一个光线充足的房间里演讲——窗户在你一侧、头顶有不错的室内灯光——那么你真的不需要投资很多昂贵的照明面板。然而，如果你的房间很暗，那么在显示器两侧放置几盏
    LED 灯可能是个好主意。如今，你可以花很少的钱买到 LED 照明面板。我花了不到 100 美元买了两个带三脚架的照明面板。不要过度设计你的灯光。你只需要一点照明；你不是要照出下一部好莱坞大片。如果你的房间已经有良好的照明，就用它吧。你的听众可能大部分时间在看你的幻灯片，而不是看你。


    #### 着装得体


    仅仅因为你是在家演讲，并不意味着你应该看起来像个彻底的邋遢鬼。考虑一下你正在演讲的活动，然后思考什么服装是合适的。如果这是一个充满高管的企业活动，那么你需要花些心思，穿得正式一点。


    如果是一个软件开发会议，举例来说，那么你可以穿得随意一些，穿牛仔裤和 T 恤。我不建议你穿着睡衣做演讲，即使你在演讲前十分钟才起床——除非你是在国际睡衣爱好者大会上演讲。


    当你公开演讲时，你是在向世界展示自己，分享想法。人们会评判你，你必须给人留下良好的第一印象，无论你是在线上演讲，还是在线下活动的舞台上演讲。

