  trans: '

    ### 激励型演讲风格


    激励型演讲风格诉诸于听众的情感层面。它侧重于信息中号召行动的部分。演讲中的每个元素都旨在鼓励听众遵循你的号召，从而提升自我。


    激励型的公共演说者通常被称为“气氛带动者”，因为他们擅长激发听众对特定任务的热情。这说起来容易做起来难，因为要成功带动气氛，演说者自身需具备一定程度的自信。缺乏自信，演说者就无法激励任何人。


    除了自信，演说者还需要能够呈现一场高能量的演讲。一场执行得当的激励型演讲能让听众在结束后感觉良好——事实上，是充满动力的。


    激励型演说者经常使用讲故事的方式来阐述观点。例如，一场关于成功的激励型演讲，可能会讲述他人如何通过展示所面临的挣扎、以及如何克服这些挣扎最终获得成功的故事。这些故事不仅要提供范例，还应能与听众产生共鸣。如果听众来自工薪阶层背景，演说者可以选择讲述一个从公司底层努力打拼的员工、最终成功跻身高层的故事。人人都喜欢白手起家的好故事。


    理想情况下，故事中的主角应与听众有显著的相似之处，这就是了解你的听众尤为重要原因。听众可能来自同一行业或领域；他们可能都是教师、家长或火箭科学家。演说者需要建立这些相似之处，使故事中的人物能与听众产生关联。


    故事旨在向听众灌输一种特定的信念体系。例如，在大多数销售激励型演讲中，演说者试图让听众相信他们能够成功达成销售目标。为此，演说者需要运用多个激励故事，并利用自身高涨的精力来激发听众。这种类型的演讲通常设计为在演讲过程中逐步提升听众的情绪。当听众情绪达到顶峰时，演说者便引入号召行动，邀请他们参与其中。


    如果你想亲眼目睹激励型公共演说者的风采，不妨看看诸如托尼·罗宾斯这类作家的研讨会，他是一位在演讲过程中将听众情绪推向狂热的专家。你可以在 YouTube 上找到他的演讲视频。


    ### 教学型演讲


    教学型演讲旨在教导听众，这与自由式或激励型演讲不同。你可以将教学型演讲视为一场讲座，在其中传授信息以讲授某个主题。其最终目标是传授听众在演讲前不具备的知识。


    在演示如何使用产品或技术时，教学型演讲风格非常有用。不要将其与产品推销混淆，二者并非同一回事。教学型演讲是关于教学的。


    我出身于软件开发背景。我演讲的领域之一是软件安全，尤其是在微软技术栈中。在`Azure`（他们的云计算平台）上，有一项名为`Azure Key Vault`的服务。这是一个用于存储和操作加密密钥的软件系统。听起来很复杂，对吧？我的一个演讲通过一系列六个指导性示例来讲解`Key
    Vault`是什么、如何设置以及如何使用，每个示例随着演讲的进行难度逐渐增加。在一个小时的时间里，听众从对`Key Vault`几乎一无所知，到学会如何设置和使用它。这是一个教学型演讲风格的好例子。那次演讲的目的不是娱乐。我没想讲一个有趣的故事。我是在教他们如何使用一个复杂的产品，并且希望以一种引人入胜的方式做到这一点。


    在软件开发领域，大多数会议演讲都是教学型的——并非全部，因为也有一些自我提升和激励型的演讲。


    ### 树立你在该话题上的权威形象


    人们往往尊重那些在自身技艺或专业领域投入了大量时间的人。为了鼓励人们倾听你的演讲——尤其是如果你是新手上路且尚未拥有追随者——你需要确立自己在你将要讨论的话题上的权威地位。


    做到这一点最佳方法之一，是以一个关于你自己的故事开场，在故事中你需要解释自己为何站在台上进行这次演讲。这个故事不必很长，但如果你是在一个专业会议上演讲，你可以说明你的雇主和你的职位。然后，你可以列举在所在领域的一些令人印象深刻的成就，并自然地过渡到你演讲的主题，或者你试图解决的问题。你无需在这个故事上花太多时间；一两分钟就足够了。你需要说足以证明你的资历，并希望以此赢得听众的信任。


    我在观众面前做的第一次演讲是关于使用微软软件开发库进行密码学和加密技术的。因为当时我是个不知名的演讲者，我解释了我的工作单位和职位，然后简要谈了一下我在金融服务领域参与开发的一个安全系统。这有助于确立我的权威角色。接着，我指出我的演讲将涵盖我在开发该安全系统时学到的知识，以及如何使用微软这些当时文档不佳的复杂库。这个过程大约花了一分钟。我没有更详细地介绍自己，因为演讲并非关于我，而是关于微软的库。我只是想让听众知道为什么我有资格谈论这些库。


    要成为一名公共演说者，你不一定非得是某个领域的专家。你或许正在学习一项新技能，并想就此做一场演讲。这类入门级的技能演讲可能很受欢迎。仅仅因为你并非该领域的专家，并不意味着你不能谈论这个主题。如果你将演讲纲要定位于初学者水平，你很可能比听众中的大多数人领先一两步，这完全没问题。我个人喜欢听定位于初学者的演讲，因为这是了解一个你原本可能忽略的主题新信息的绝佳方式。


    **注意**：在某话题上拥有权威并不意味着你必须成为专家。专家可能对某个主题有深入的知识，但权威能够影响经验不如自己的人。一个人可以既是一个话题的专家，也是该话题的权威。


    ## 使用你习惯的组织工具


    在规划和准备演讲内容时，你将面临多种组织和研究内容的方式选择。我每次构建新的演讲时，都遵循相同的流程。

    '
- fmt: '### Research


    We mentioned research earlier in the book, but I want to go into more detail here,
    as it is a vital part of the presentation creation process. A well-researched
    talk will always go down better with an audience, as opposed to a talk that is
    hastily put together. You don’t need to be an expert on a subject to talk about
    it, but you do need to be a good researcher.


    These days, with the internet, research is amazingly easy; you simply need a browser
    and a search engine. However, you don’t want to fall into the trap of searching
    only for information that confirms your views or beliefs. This is called confirmation
    bias, and it can lead to extremely one-sided talks. Even if you have a strong
    view about a particular subject and you know that differing viewpoints exist,
    I recommend that you research those differing viewpoints and include them in your
    talk. You can say you don’t agree with these views; that’s fine. As a civilized
    society, it is great that we can have different viewpoints on a subject, and it
    is fine to express those views, but a well-rounded talk should include other people’s
    views so your audience can make their own judgments.


    Today, there is a common concern about sharing opinions and worrying that others
    will be offended or will not agree with you, especially younger people. Personally,
    I think sharing your opinion is fine, especially if you live in a country that
    supports freedom of speech. There is always a line that you can cross, such as
    if your viewpoint is racist, homophobic, transphobic, etc. However, expressing
    your own views is perfectly acceptable and encouraged during a presentation, provided
    your intention isn’t to cause harm or deliberately offend anyone. You will know
    if your views fall into that category, so I recommend exercising good judgment.
    However, sharing different viewpoints with others is healthy, and debate should
    be encouraged.


    When you include information from your research, I recommend making a note of
    it so that you can remember the source. If you want to quote someone else’s work
    or include any data they may have published, this is acceptable use, as long as
    you attribute their work, so they are credited. Attributing their work also means
    that the audience has a frame of reference should they want to look up any information.


    When researching information for a talk, you need to consider the sources of the
    information, especially if it is from someone’s blog. Information can be wrong,
    so you should look at the source and try to find other independent sources that
    corroborate the information you have found. This is the same process that a journalist
    uses to write a story by checking multiple sources to fact-check information.
    Then, if someone questions any information in your talk, you have the sources
    written down.


    Researching information for a talk can be quite an in-depth process, so make sure
    to record your research notes and sources clearly. I know many people who prefer
    to write them down in a physical notebook, but I think your life will be much
    easier if you use a note-taking app. If you are an Apple Mac or iPad user, `Apple
    Notes` is included free with your computer, which is what I use. There are a lot
    of other great note-taking applications, including `Microsoft OneNote`, if you
    are a Microsoft Office user, and `Evernote`, or any of the other apps in existence.


    ### The Outline


    When you have conducted all your research, you will need to organize this information
    to build a cohesive talk. The best way to design the talk’s structure is by developing
    an outline. This is also how a novelist outlines a book, so they know the story’s
    plot arc, character development, conflict, and payoffs. By now, you already know
    the style of talk you’re going to prepare. Next, you want to think about breaking
    your talk into sections. Much like a story with a three-act structure, you want
    to plan the beginning, middle, and ending.


    ***Act 1 (The Beginning)***: Introduce yourself and why you are here talking.
    Then, introduce the topic or problem you want to discuss.


    ***Act 2 (The Middle)***: Start exploring the topic in more detail. This is where
    much of your research will come into play. Depending on your audience, you may
    have to provide a lot of introductory material or include topic details. Do you
    have research data to show? What are your opinions on the topic? Are there views
    counter to yours? This is a good place to explore them. Is your talk more instructional?
    If so, this is a good place to walk through the demo by starting with easier examples
    and then getting progressively harder.


    ***Act 3 (The End)***: By this point in the talk, you have covered your main content,
    so now you should start summarizing your key points. The summary is especially
    important and should be written carefully. Your talk may have included a huge
    amount of information that is hard for the audience to retain. If you are presenting
    at a larger conference, remember that the attendees will be more tired if your
    talk is scheduled later in the timetable. The summary is a great place to make
    sure that the audience leaves with a handful of the most important facts. Once
    you have finished your summary, you can open the floor to any questions.


    There is a reason most written content is split into this three-act structure—it’s
    because it works, and people generally expect any type of long-form information
    to be presented this way. Of course, any rule can be broken, and you are free
    to do that. But if you are a new speaker, I recommend that you stick to the three-act
    structure until you have more experience in public speaking and then you can deviate.
    However, to be honest, I can’t see why you’d want to do that.


    Your outline can be written in the same note-taking application that you used
    to store your research notes, or you can use a more visual application, such as
    a mind map (Figure [2-1](#524722_1_En_2_Chapter.xhtml#Fig1)). Mind mapping is
    my preferred way of structuring a talk, as it is visual. There are many mind-mapping
    applications available, ranging from free and open source to paid applications;
    choose one that works best for you. I use an application called `iThoughtsX` on
    the Mac. The following screenshot shows the start of my talk outline on artificial
    intelligence.


    ![](images/524722_1_En_2_Chapter/524722_1_En_2_Fig1_HTML.png)


    **Figure 2-1**


    Outlining a talk using mind maps


    **Note**


    Most modern entertainment (novels, TV shows, and films) uses a three-act structure
    as a basis for their storytelling. Designing a presentation is no different.


    Outlining is a powerful tool, and I highly recommend that you go through this
    process, as it will always result in writing a well-rounded and informative talk.'
