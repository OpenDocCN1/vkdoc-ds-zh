  trans: '

    # 开始准备


    当幻灯片准备就绪后，你应首先坐在电脑前完整过一遍演讲。这并非正式排练，但能让你逐一检查每张幻灯片，确保内容正确无误，并且你对所传达的信息感到满意。


    当你对内容满意后，就该开始练习了。我建议将演示软件（如 `PowerPoint` 或 `Keynote`）切换至演示者模式，站起来，然后开始演练你的演讲。我还建议设定一个计时器，因为你需要了解演讲会耗时多久。例如，如果你在会议上有一个完整的
    60 分钟演讲时段，那么你最好讲 50 分钟，留出 10 分钟在最后进行问答。通过现在计时演练，你可以判断自己是否会超时，或者远低于分配的时间。讲得少比超时要好，但你应该尽量充分利用你的全部时间。如果你在会议上演讲，演讲必须严格遵守时间表，以便与会者能前往下一个会场，并且下一位演讲者也有时间进行准备。


    如果你是演讲新手，你很可能会发现第一次演练极其痛苦：你会说错台词，忘记接下来要讲什么，整个演讲尝试都会一团糟。别担心，这很正常。即使我已经公开演讲多年，我最初的几次演练通常也很糟糕，而这正是练习的意义所在。想象一下，在演讲前最后一刻才做好幻灯片，然后第一次完整过稿就是在观众面前。通过提前规划，你可以在私下里把这些糟糕的尝试消化掉，而无需让任何人知道。


    在你完整过稿两三次之后，你就会开始掌握材料的脉络，并对该如何呈现演讲感到更有信心一些。如果你需要更多这样的排练，也没问题。根据需要尽可能多地练习。


    我不建议一次性尝试超过两次的完整过稿，因为你会开始感到精神疲劳。把你的初始练习分散在接下来的一周内进行。花上你需要的一切时间。


    此时，你应该开始感到更自信了。接下来，我建议你录下自己的演讲。你可以把手机放在书架上，用手机的内置摄像头和麦克风录制自己。画质不需要多好；你只需要能听到自己的声音。如果你有任何屏幕录制软件，比如
    `Camtasia` 或 `ScreenFlow`，那么你可以从电脑上录制幻灯片，并通过麦克风录制你的声音——这就是我的做法。这样录制自己的目的是，你可以观看/收听它，并批判性地评估你的演讲。这段视频不需要其他人看到；你看完后可以删除它。制作这样的视频是一个很棒的工具，因为它能让你从听众的角度去感受演讲听起来如何。我不建议录完视频后立即回看。过几天，再用全新的眼光重新观看。


    当你重新观看完视频后，你可能想要再排练几次，然后重新录制一次演讲。你做这个流程的次数取决于你的自信程度。你可以根据需要，像这样练习任意多次。每次练习，你都会在记忆材料和自信地呈现演讲方面做得更好。


    当你在演讲表现方面变得自信后，最后一步是在其他人面前练习。这些人可以是家人、朋友或办公室的同事。你甚至可以在工作中安排一次午餐学习会，邀请你的同事们来听演讲。这将是在真实观众面前的一次完整预演。尽管听起来很吓人，但在你面对会议上可能更庞大的观众群之前——尤其是如果你的目标是在会议或聚会小组上演讲的话——在一群人面前这样练习是一个好主意。


    # 身体表达：手势与面部表情


    在会议上，你通常可以找到一张小桌子或讲台来放置你的笔记本电脑，并且会有一瓶水——一定要随身带一瓶水，以防主办方没有提供。在家练习时，尽量重现这样的布置。你要避免的是把讲台当成藏在后面的盾牌。这对新手演讲者来说很常见。尝试远离笔记本电脑，在舞台区域或你练习的房间内走动。如果你使用蓝牙幻灯片翻页器，那么无需触碰笔记本电脑就能切换到下一张幻灯片，这样走动起来会更容易。


    许多会议会在舞台上设置一个屏幕，显示你笔记本电脑上的内容。有这样的屏幕非常好，因为这意味着当你在舞台上走动时，你仍然可以看到演示者视图的笔记，更重要的是，可以看到下一张幻灯片是什么。不过，有一点需要注意：许多会议会录制演讲视频。如果有人在你的演讲期间操作摄像机，他们会跟着你走动和讲话。有些会议使用固定摄像机对准讲台，这样你就不能随意走动了。你应该在会议开始前尽量了解录像安排，或者在演讲前与音视频工程师沟通，他们会告诉你是否有走动空间。


    练习演讲时另一个重要的考量是，你的手臂、双手和面部该怎么办。如果你笔直地站在舞台上，双手垂在身体两侧，说话时面无表情，观众很快就会对你的演讲感到厌倦，并脱离内容。务必利用你的手臂和双手来强调你所说的内容。你当然不想做得太过火，像章鱼一样挥舞手臂，但与你声音表达同步的细微动作可以产生真正的影响力。


    当你想了解什么样的动作幅度合适时，我建议在 YouTube 上观看演讲视频，并观察其他演讲者是怎么做的。试着观看好的演讲和不太好的演讲，目的是从中学到东西。你可以通过一个演讲的差评数量（相对于好评）来识别出无效的演讲。我喜欢观看
    TED 演讲，因为它们通常是演讲呈现方式的绝佳范例，你能从演讲的呈现方式中学到和演讲内容一样多的东西。


    你的面部表情也是一个关键因素，尤其因为人们会看着你的脸——如果演讲被录制下来，并且你被显示在大屏幕上，这一点就更为重要。记得在演讲开始时微笑。在活动中发表演讲是一种荣誉，你应该表现出兴奋和热情，因为你很荣幸能对那些选择花时间听你讲话的人说话。


    如果你站在那里，一脸惊恐，观众很可能会有点为你感到难过；更重要的是，他们可能会对演讲失去信心，尤其是如果他们花了很多钱来参加这个活动的话。如果你是在一个免费的用户组聚会上，那么听众往往会宽容得多。


    如果你演讲传达的信息是振奋人心和快乐的，那就微笑，看起来开心。你的面部表情应该与你所传达信息的强度相匹配。如果你在传达一个严肃或悲伤的信息，那么表情就应保持平静或悲伤。你不会——嗯，我希望你不会——在谈论某人被诊断出危及生命的重病时脸上还带着微笑，所以请尝试练习与主题相配的面部表情。不过，不要用力过猛。你的目标是微妙的表达，而不是证明你能复制金·凯瑞（Jim
    Carrey）那种富有弹性的面部表情。

    '
- fmt: '当你与人交谈时，试着注意双手的动作。在向他人解释概念时，你是否会自然而然地抬起手并做出手势？你是用手做手势，还是用手指指点？观察我们自然交谈的方式，可以让你学到很多关于在演讲中练习何种手势的知识。


    ## 建立表演前习惯


    随着重要日子的临近，并且你已经尽可能多地排练了演讲，你需要开始思考为那一天建立的表演前习惯。如果这是你的第一次演讲，你在演讲当天会感到紧张。即使经过多年公开演讲，我在演讲前仍然会紧张。你的表演前习惯是指你想在当天或之前做的任何事情，这些习惯能帮助你放松、感到舒适，并呈现出色的表现。


    以下是我的一个习惯示例，供你参考。你不必完全照搬，但这对本人有效，因此它可能是一个很好的指南，帮助你发展自己的习惯。


    在重要演讲的前一晚，我会尽量不喝酒——或者至少不多喝。如果我在参加的会议上与演讲者朋友聚会，这说起来容易做起来难，但你最不想要的就是宿醉。如果我是在清晨演讲，那么我完全不会喝酒。如果我是在下午演讲，我可能会在前一晚的晚餐时喝几杯，但仅此而已。演讲本身压力已经够大了，更不用说还要应对头痛和脱水。


    除了前一晚放松外，你还应该尽量获得良好的睡眠。早点上床，不要在睡前排练演讲或修改幻灯片。否则，你的大脑会充满关于演讲的念头，这会让你无法入睡。如果你喝咖啡或红茶，请在睡前几小时避免摄入咖啡因，除非你身边有脱咖啡因的饮品。我总是随身携带脱咖啡因的咖啡包。


    在演讲当天，我会根据演讲时间来计划进食。这可能不适用于所有人，但我不喜欢在演讲前几小时内吃东西。如果你刚吃完东西，身体正在消化食物，你可能会开始感到昏昏欲睡，这会让你在台上演讲时难以集中注意力。


    如果我是在清晨演讲，我通常会跳过早餐。（如果你患有糖尿病或有任何与饮食相关的医疗问题，请忽略这一点，并遵循医生的建议。）就个人而言，我从来不是一个吃大量早餐的人，所以在所有需要跳过的餐食中，跳过早餐对我来说是最容易的。如果我是在近中午或午后早些时候演讲，我会根据演讲时间吃一顿晚早餐或清淡的早午餐。如果我是在午后晚些时候演讲，我会吃一顿丰盛的早餐和一顿早但清淡的午餐。是否在演讲前吃东西是个人偏好；对我而言，它会让我感到疲倦，所以我通过计划进食时间来避免它。


    当天的另一个重要习惯是保持水分。公开演讲会让你感到非常口渴，所以要小口多喝水。但尽量不要在演讲前一小时内喝大量水；否则，你会需要频繁上厕所，你最不想看到的就是在台上时需要去洗手间。在大型会议上，洗手间排长队是很常见的情况。在演讲前一小时，我会在与会者听其他演讲时，放松一下并去一趟洗手间。如果你等到演讲前才去洗手间，你可能不得不应对长队，这会增加你的压力。


    虽然补水很重要，但尽量在演讲前避免饮用碳酸饮料。我曾经犯过这个错误，在上台前喝了一罐冰镇无糖百事可乐。我站在那里等着开始演讲，麦克风已经打开，而碳酸饮料一直在让我打嗝。在没有尴尬的情况下完成那次演讲简直是个奇迹，这是我通过惨痛教训学到的一课。


    当你打包去参加活动或会议时，我建议在包里放一些润喉糖。在大型会议上，你会与许多其他演讲者和与会者交谈，这意味着你的说话量会比平时多得多，这会对你的喉咙造成负担。在上台前，润喉糖可以成为缓解喉咙疼痛或嘶哑的非常受欢迎的良方。


    在出发参加活动前，请务必反复检查你打包的设备，包括你的笔记本电脑。如果你要出差，请确保带上电源线和适用于外国的电源插头转换器；如果你的笔记本电脑没有内置 HDMI
    接口，请检查你是否带了多个 HDMI 适配器。并非所有的会议投影系统都是现代的；有时，一个适配器会出现很多故障，而另一个不同品牌的适配器却工作正常。我从未弄清楚原因，但多带一个总是个好主意，因为这能减少你在为演讲做设置时的压力。你还应该带上一个旧的
    VGA 适配器；并非所有场地都升级到了 HDMI，因此你需要使用 VGA。我在许多大学演讲过，有些投影系统非常老旧——不要让自己陷入困境。


    当你在等待自己的演讲时段时，尽量放松并坐下。大多数会议都会为演讲者提供休息室。提前找到它的位置，并在演讲前在那里休息一段时间。我不建议在演讲前一小时内进行最后的排练，因为这很容易让你陷入恐慌。这也不是对演示文稿做最后改动的时候——此时它应该已经定稿并排练充分。


    如果我的酒店离场地很近，只需步行一小段路，我更喜欢在演讲前独自在酒店房间休息。我是个内向的人，所以这对我很有效。如果你喜欢与人相处，你可能会更喜欢待在会议场地与人交谈。做任何对你有用的事情，但尽量让自己得到充分休息。


    作为预防措施，请在手机上设置闹钟，至少在你需要到达演讲室前 30 分钟提醒。通常，在前一位演讲者离开后，到与会者开始陆续进入房间之前，有大约 15 分钟的时间窗口。请明智地利用这段时间解决任何投影仪或音响问题。


    我提供了不少关于表演前习惯的点子。我将这一节放在关于准备工作的章节中，是因为提前思考这些习惯是个好主意，而不是等到演讲当天才想。你的习惯可能大不相同，但我希望通过分享我的准备方法，能启发你思考自己的习惯。'
  raw: 'When you are talking to people, try to be aware of what you do with your hands.
    Do you naturally raise your hands and make gestures when trying to explain concepts
    to people? Do you use your hand in a gesture, or do you point with your fingers?
    Observing how we naturally talk to people can teach you a lot about what gestures
    to practice for your presentation.


    ## Creating Preperformance Rituals


    As you get closer to your big day and have been rehearsing your talk as much as
    you can, you will want to start thinking about preperformance rituals that you
    want to put in place for the big day. If this is your first talk, you will be
    nervous on presentation day. Even after many years of public speaking, I still
    get nervous before a talk. Your preperformance rituals are anything you want to
    do on the day, or leading up to the day, which will help you relax, be comfortable,
    and put on superior performance.


    Here is an example of my ritual as an example. You don’t have to use this, but
    it works for me, so it may be a good guide to help you develop your own rituals.


    The night before a big talk, I try not to drink alcohol—or too much at least.
    This is easier said than done if I am at a conference and hanging out with all
    my speaker friends, but the last thing you want is a hangover. If I am speaking
    early in the morning, then I won’t drink at all. If I am speaking in the afternoon,
    then I might have a couple of drinks the night before with dinner, but that is
    it. Speaking is stressful enough as it is, let alone having to deal with a headache
    and dehydration.


    In addition to taking it easy the night before, you should try to get a good night’s
    sleep. Go to bed early, and don’t rehearse your talk or change any slides right
    before you go to bed. Otherwise, your mind will be full of thoughts about the
    talk, and this will stop you from falling asleep. If you are a coffee or black
    tea drinker, avoid caffeine a few hours before bedtime, unless you have a supply
    of decaffeinated drinks with you. I always travel with sachets of decaffeinated
    coffee.


    On the day of a talk, I try to plan when I am going to eat based on when the talk
    is. This may not apply to everyone, but I don’t like to eat within a few hours
    of my talk. If you have just eaten and your body is trying to digest food, you
    may begin to feel lethargic, which makes it hard to concentrate when speaking
    on stage.


    If I am speaking early in the morning, I normally skip breakfast. (If you are
    diabetic or have any diet-related medical issues, then please ignore this, and
    do what your doctor recommends.) Personally, I have never been a big breakfast
    person, so out of all the meals to skip, this is the easiest for me. If I am speaking
    in late morning or early afternoon, then I will have a late breakfast or light
    brunch, depending on when the talk is. If I am speaking later in the afternoon,
    then I have a larger breakfast and an early but light lunch. Whether you eat before
    a talk is a personal preference; for me, it makes me tired, so I try to avoid
    it by planning when I eat.


    Another essential ritual of the day is to keep hydrated. Public speaking can make
    you feel very thirsty, so sip a lot of water. However, try not to drink a huge
    amount in the hour leading up to your talk; otherwise, you will need to use the
    bathroom frequently, and the last thing you want is to be needing the toilet when
    you are on stage. At a large conference, it’s quite common to have large queues
    for the bathrooms. In the hour before my talk, I relax and get a bathroom break
    while the attendees are listening to other talks. If you wait to go to the bathroom
    until just before you talk, you may have to deal with a large queue that adds
    to your stress.


    While hydrating is important, try to avoid fizzy drinks before you speak. I made
    this mistake once when I drank a cold can of Diet Pepsi before I went on stage.
    I was standing there waiting to start my talk, with the microphone switched on,
    and the fizzy drink kept repeating on me. The talk was very hard for me to deliver
    without burping. How I managed to get through that talk without embarrassing myself
    was a miracle, and it was a lesson I learned the hard way.


    When you are packing to go to an event or conference, I recommend putting some
    throat lozenges in your bag. At a large conference, you’ll be talking to many
    other speakers and attendees, which means you’ll be speaking much more than you
    usually do, and this can take its toll on your throat. Lozenges can be a very
    welcome remedy to a sore or strained throat before you go on stage.


    Before you leave for an event, make sure to check and double-check your packed
    equipment, including your laptop. If you are travelling to the event, make sure
    you have the power cable and power plug converters for foreign countries; check
    that you have multiple HDMI adapters if your laptop doesn’t have HDMI built in
    by default. Not all conference projection systems are modern; sometimes, you’ll
    have a lot of glitches with one adapter, while a different brand works fine. I
    never found out why this is the case, but it’s always a good idea to have more
    than one, as this reduces your stress when setting up for your talk. You should
    also include an older VGA adapter with you; not all venues have upgraded to HDMI,
    so you will need to use VGA. I have spoken at many universities, and some projector
    systems are very old—don’t get caught out.


    When you are waiting for your time slot, try to relax and sit down. Most conferences
    provide a green room for speakers. Find out where it is ahead of your talk and
    spend some time there resting beforehand. I don’t recommend doing a last-minute
    rehearsal in the hour before a talk, as that is a good way to get yourself in
    a panic. This is also not the time to make last-minute changes to your presentation—it
    should be written and well-rehearsed at this point.


    If my hotel is near the venue and is only a short walk, then I prefer to rest
    alone in my hotel room before my talk. I am an introvert, so this works well for
    me. If you enjoy being around people, you might prefer to be at the conference
    venue talking to people. Do whatever works for you but try to be as rested as
    you can.


    As a precaution, set an alarm on your phone for at least 30 minutes before you
    need to be in the room. Typically, there’s a 15-minute window from when the previous
    speaker has left, and you can set up before attendees start filtering into the
    room. Use the time wisely to work out any projector or sound issues.


    I’ve offered quite a few ideas for a preperformance ritual. I included this section
    in the chapter on preparation because it’s a good idea to think about this ritual
    ahead of time, not on the day of your talk. Your ritual may be quite different,
    but I hope by sharing my preparations, it inspires you to think about your own.'
