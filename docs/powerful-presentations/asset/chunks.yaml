- fmt: "# 排版后内容\n\nHere, I provide a lot of details on what the talk is about. The\
    \ talk is delivered more like a tutorial in which I show the audience how to set\
    \ up the Key Vault, how to write software using its software development kits,\
    \ and some different usage patterns. By the time the reader has finished this\
    \ section of the synopsis, they will know exactly what to expect.\n\nThis talk\
    \ has always rated extremely well with conference attendees, and I believe that’s\
    \ because of two main factors. First, I go into a lot of detail in this talk,\
    \ and it is very practical and demo led. Second, the synopsis is quite clear about\
    \ what to expect, so it is rare to get an attendee who shows up feeling that they\
    \ already know the content, or it is too advanced. I spent a lot of time trying\
    \ to pitch the synopsis at the right level.\n\nThe closing summary for this talk\
    \ is just one sentence.\n\n> *You will leave this talk with everything you need\
    \ to start using Azure Key Vault today.*\n\nHere, I reaffirm that by attending\
    \ this talk, you will be able to start using Azure Key Vault. The talk is a practical\
    \ tutorial, so the audience could take what I have said and the sample code I\
    \ give them in the talk and start using the principles straight away.\n\nLet’s\
    \ now look at the final synopsis.\n\n## Talk 4: Hacking Humans: Social Engineering\
    \ Techniques and How to Protect Against Them\n\nThis talk synopsis is the shortest\
    \ of them all, but it is also one of my most popular talks. We have already discussed\
    \ the title for this talk, in that the main title of “Hacking Humans” conjures\
    \ up all sorts of vivid images. To prove that this isn’t a talk about axe murders,\
    \ I use the subtitle to give extra context. This talk is about social engineering\
    \ techniques and how to protect against them. The subtitle implies that we may\
    \ be learning about something a little taboo, with the promise of techniques on\
    \ how to protect ourselves.\n\nLet’s first look at the entire synopsis.\n\n> *Social\
    \ engineering is one of the biggest threats to our organizations, as attackers\
    \ use manipulation techniques to coerce people into revealing secrets about companies\
    \ that give attackers access to critical systems.*\n\n> *In this talk, we will\
    \ look at some of the techniques used in social engineering and how to guard yourself\
    \ against them. We will cover subjects such as pretexting, elicitation, and body\
    \ language as manipulation techniques.*\n\nFirst, let’s look at the main hook.\n\
    \n> *Social engineering is one of the biggest threats to our organizations, as\
    \ attackers use manipulation techniques to coerce people into revealing secrets\
    \ about companies that give attackers access to critical systems.*\n\nIn the main\
    \ hook, I tell the reader that social engineering is one of the biggest threats\
    \ to organizations and that attackers use manipulation techniques to coerce people\
    \ into revealing secrets. This hook introduces a bit of conflict because social\
    \ engineering and manipulation are big problems for companies, so I try to pique\
    \ their interest.\n\n> *In this talk, we will look at some of the techniques used\
    \ in social engineering and how to guard yourself against them. We will cover\
    \ subjects such as pretexting, elicitation, and body language as manipulation\
    \ techniques.*\n\nWhen I go into more detail, I state that we will look at some\
    \ techniques used; that is, I will show them how to do the techniques and then\
    \ how to protect themselves against them. I then mention the techniques—pretexting,\
    \ elicitation, and body language as manipulation techniques. This naturally gets\
    \ people interested, as I talk about techniques that would result in committing\
    \ a crime if used against someone without their permission. However, the idea\
    \ is that by knowing these techniques, you can protect yourself and your organizations\
    \ from them.\n\nWhen I have spoken to attendees of this talk, most say they like\
    \ the idea that they are going to learn something that is potentially illegal,\
    \ but for the purposes of good. We are naturally curious creatures, so this is\
    \ quite alluring.\n\nIf I am honest, even though this is one of my most popular\
    \ talks, out of all my talk descriptions, this is the weakest, as I could go into\
    \ more detail than I have. I have refrained from doing so as the synopsis clearly\
    \ works, and many events have selected the talk and it consistently earns exceedingly\
    \ high ratings from attendees. So I took the “if it’s not broken, don’t fix it”\
    \ stance.\n\n## Summary\n\nI have spent quite a long time going over writing a\
    \ talk synopsis, as it is just as important, if not more important than the talk\
    \ itself. The talk must be good. If you haven’t thought out the synopsis, a conference\
    \ might not select the talk.\n\nThe synopsis serves multiple purposes. If you\
    \ are presenting to peers at your workplace, the synopsis will inform so they\
    \ can set their expectations. If you are public speaking at a conference, for\
    \ example, then the synopsis is a tool that helps you beat the competition to\
    \ have your talk selected. Conference speaking can be competitive, so writing\
    \ this vital document is very important.\n\nIf they select you to speak at a conference,\
    \ then your synopsis serves a second purpose, and that is encouraging attendees\
    \ to come and see your talk. It is a sales letter to the audience member. Be careful\
    \ to pitch the synopsis with accurate information so that the right people attend.\
    \ Don’t bluff. If people attend with the wrong expectations, then they could down-rate\
    \ your talk, which can affect your ability to be reselected at that conference.\n\
    \n## Workshop Questions\n\n1. Start thinking about your presentation’s synopsis.\
    \ It is a good idea to write the synopsis before designing the final presentation.\
    \ Include each of the following items:\n   - **Catchy talk title and subtitle**:\
    \ Pick a title that draws the potential audience members in. Try not to make it\
    \ sound like a clickbait link, but you can try a clever title provided it is not\
    \ misleading. For my *Hacking Humans* talk, as described earlier, it is a striking\
    \ title, yet the subtitle gives context, *Social Engineering Techniques and How\
    \ to Protect Against Them*.\n   - **Initial hook**: The initial hook draws the\
    \ reader in after the title. It is quite common for a conference schedule to only\
    \ show the title and initial hook, and the viewer needs to click through to read\
    \ more, so the impact of this initial hook could decide whether someone comes\
    \ to see your talk or not.\n   - **More details**: In this section, you can go\
    \ into more detail about the problem you are addressing and how you will solve\
    \ it. This section is there to convey more detailed information to help someone\
    \ make their decision to see your talk. Don’t write too much, though; it should\
    \ still be brief.\n   - **Closing statement**: The closing statement is an opportunity\
    \ to summarize why someone should attend your talk.\n\n2. Once you have written\
    \ your synopsis, you should show it to different people to get feedback. A useful\
    \ trick is to write two or three different synopsis documents in different styles.\
    \ Then get people to pick their favorite and tell you why they picked it over\
    \ the others. The synopsis is as important as the actual presentation itself,\
    \ as it is how you will sell the idea of your presentation to attendees and events.\n\
    \n# 4. Preparing to Give a Talk\n\nYou don’t want to leave preparing your slides\
    \ until the last minute. Not only is this unprofessional, but it sets you up for\
    \ failure, as you will not have any opportunity to practice the talk to learn\
    \ which elements work well and what your timings are like. If you plan and design\
    \ your talk and slides as early as possible, then you have plenty of time to rehearse\
    \ the talk and make necessary changes."
