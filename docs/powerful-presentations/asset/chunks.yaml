- fmt: '### The Data-Rich Presentation Style


    If you are planning to present complicated data to your audience, you may need
    to use a data-rich presentation style to connect with them. This presentation
    style makes use of careful sequencing of information to ensure that it all leads
    to one central point: the message of the presentation.


    In this style, the presenter needs to focus on creating slides that support their
    conclusion. For example, if you are trying to say that eating vegetables is good,
    you should use data showing the life expectancy of people who eat a vegetable-rich
    diet.


    A data-rich presentation style is good when you are trying to present a lot of
    facts and figures. You would typically find this style used for corporate or more
    scientific presentations.


    However, it’s not as simple as showing some graphs on the screen. To make sure
    that the information you present has a lasting impact on the audience, you need
    to make everything easy to remember. You can do this by ensuring that the information
    you present follows these simple rules.


    #### The Information Should Be Easy to Understand


    Backing up your claims with statistics and scientific data is one of the best
    ways to make your presentation come across as professional. However, if the data
    selection and presentation are done poorly, the audience may not understand it.
    You need to make sure that the audience will easily understand any content you
    decide to include by focusing on the data’s clarity.


    To accomplish this, you need to choose and include the types of data that are
    on the level your audience will grasp. A doctor talking to an audience with no
    medical background, for example, should limit the use of medical jargon when presenting
    data. They should also try to use analogies when explaining medical concepts.
    In contrast, if the doctor is explaining something to other professionals in the
    medical profession, it is acceptable to use technical jargon, as the audience
    is also familiar with the terms.


    Nevertheless, you should still make sure to explain each piece of data in the
    simplest way possible. This is to make sure that all audience members will understand
    the data being presented and that no one feels alienated.


    #### The Information Must Follow a Particular Order


    You should also decide on the best order to present the data. You could start
    with the most straightforward data and gradually make it more complicated as you
    go along. The best use of this method in lectures is whenever you are teaching
    a new concept to the audience—start simple and gradually build on what has come
    beforehand.


    If you are presenting historical data, you can make use of a timeline, which is
    an excellent way to indicate how the information you are presenting has developed
    or evolved over time. Explaining data in this way can be quite engaging for the
    audience as you can weave more of a story into how the data points change over
    time and the steps you took to enact that change.


    Make sure the method you use to arrange the data is also clear to the audience.
    In the previous example, you should point out that the data is organized in chronological
    order. This way, it will be easier for the audience to follow along if they know
    how the data will be presented. If you start showing historical data without any
    context on how you will explain it, the audience will need to use a lot of mental
    energy to figure out how all the data is related.


    The order of how you present data and information is important. It is nearly always
    best to start simple and then build the complexity. This way, if some audience
    members are at the novice level, they stand a better chance of following along
    and understanding. If someone gets lost near the start of a talk, they will disengage
    and stop listening, and that is the last thing you want.


    #### Avoid Overloading Your Presentation with Data


    Once you are clear on the order in which you will present your information, you
    should also make sure that the amount of information you plan to present is not
    mentally taxing. If you present 20 graphs, for example, the audience will barely
    remember one of them, let alone all of them. Eventually, they will experience
    information overload, and this will make your presentation less entertaining and
    engaging. The audience will remember your presentation as a negative experience
    instead of recalling the actual points you tried to make.


    Here is the golden rule when presenting data: less is more. Only show your audience
    the minimum they need to see to understand the point you are trying to convey.
    You will lose your audience by presenting a huge table of data. Just show enough
    to prove your points and tell your story.


    ### The Free-Flowing Presentation Style


    Professional stand-up comics are masters at public speaking and the free-flowing
    presentation style. They are so good at keeping their audiences engaged that most
    of them do not use slides to pull off their act. They use a conversational style
    of presenting to make the audience laugh.


    This style of presenting is not limited to comedy. Many public speakers, such
    as politicians, use a free-flowing style when talking to crowds. Most politicians
    make their public speeches as though they are simply speaking to you directly.
    In this case, there is no need for a slide deck at all. There is only you, the
    speaker, and your audience.


    The circumstances of the talk and the type of audience are big factors when deciding
    to use a free-flowing presentation style. With this style, your presentation will
    be more conversational—like telling a story to your friends in a bar. I find free-flowing
    presentation styles more suited to nondata-heavy talks or story-based talks, such
    as motivational stories or talks about how you overcame a problem or hurdle.


    If you are presenting a data-heavy talk, such as sales data or research results,
    then the free-flowing style might not work, and your audience will be prepared
    to hear hard facts as opposed to an entertaining story.


    In a comedy club, as another example, a stand-up comic’s audience wants to be
    entertained. They have already convinced themselves that they want to have a good
    time, and they will hopefully laugh at the comic’s jokes. A stand-up comic wouldn’t
    be effective if they decided to use a data-heavy presentation style and charts
    and graphs to tell their jokes.


    The free-flowing style of talk can be quite hard to deliver if you’re not good
    at thinking spontaneously about the story you’re telling, even if you have practiced.
    You don’t have the benefit of slides or slide notes to use as prompts. If you
    get stuck or forget what comes next, it can be difficult to recover, unless you
    have rehearsed significantly beforehand. When you are backed up by slides, if
    you forget a line, or can’t remember what happens next, you can usually recover
    by glancing at the slide notes or the next slide on the presenter view on your
    laptop.


    If the thought of speaking to an audience without visual cues fills you with dread,
    then I would stay away from the free-flowing style until you are more experienced
    with being on stage in front of a large audience.'
