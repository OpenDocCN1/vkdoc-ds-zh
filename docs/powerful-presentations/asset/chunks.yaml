    当你在等待自己的演讲时段时，尽量放松并坐下。大多数会议都会为演讲者提供休息室。提前找到它的位置，并在演讲前在那里休息一段时间。我不建议在演讲前一小时内进行最后的排练，因为这很容易让你陷入恐慌。这也不是对演示文稿做最后改动的时候——此时它应该已经定稿并排练充分。


    如果我的酒店离场地很近，只需步行一小段路，我更喜欢在演讲前独自在酒店房间休息。我是个内向的人，所以这对我很有效。如果你喜欢与人相处，你可能会更喜欢待在会议场地与人交谈。做任何对你有用的事情，但尽量让自己得到充分休息。


    作为预防措施，请在手机上设置闹钟，至少在你需要到达演讲室前 30 分钟提醒。通常，在前一位演讲者离开后，到与会者开始陆续进入房间之前，有大约 15 分钟的时间窗口。请明智地利用这段时间解决任何投影仪或音响问题。


    我提供了不少关于表演前习惯的点子。我将这一节放在关于准备工作的章节中，是因为提前思考这些习惯是个好主意，而不是等到演讲当天才想。你的习惯可能大不相同，但我希望通过分享我的准备方法，能启发你思考自己的习惯。

    '
- fmt: '## Be Aware of the Time You Have for Presenting


    Timing is also critical when giving a presentation, especially if you have a fixed
    length for the talk. At conferences, speakers are usually assigned a specific
    amount of time for their presentations. This time slot must be strictly adhered
    to because the organizers need to make sure that each invited speaker gets enough
    time without impeding on anyone else’s allocated time.


    The conference also advertises a specific time schedule that attendees use to
    plan their day, so if you go over time, it can create a bad experience for the
    attendees, who have, potentially, paid a lot of money to be there.


    By ensuring that all the information in your slides is discussed within the time
    you are given, you are showing the people in the audience that you are a professional
    and that you have adequately prepared for the event. Running out of time when
    giving a public talk is a sign of being ill-prepared. When you practice your presentation,
    time yourself to make sure you do not go over the time limit.


    On the day of the presentation, you should expect everything that could go wrong
    to go wrong. You should expect delays that may shorten your presentation time.
    To prepare for this, try to adjust your presentation according to the changes
    in the time you have. If the presentation time is shorter than expected, look
    for areas in your presentation that you can discuss faster or that you can skip
    to give way to the more essential parts of the presentation. Knowing what content
    can be cut should the need arise is an important preparation step. Hopefully,
    you will never need to cut content at the last minute, but it is a good idea to
    have the cuts in the back of your mind—just in case.


    **Tip**


    If your phone has a reminders application on it, such as `Reminders` on the iPhone,
    it is a good idea to set alerts to go off before your talk. I set a reminder for
    30 minutes before the talk starts, as well as a reminder to make sure I have my
    cables and dongle bag for earlier in the day. These can be a great help when you
    are busy at an event and nervous, as you are more likely to forget something.


    ### Know Your Timings


    When you design your talk and build the slides, you will notice that your talk
    breaks down into a natural structure. We have already talked about the three-act
    structure, but you will see that each section also breaks down into different
    topics. You may even have used a title to introduce these topics. With that structure
    in mind, write down each of those sections as titles; as you rehearse them, make
    a note of how long each section takes. If you are given a 60-minute slot to speak
    in, aim to talk for 50 minutes, and leave 10 minutes at the end for questions.


    Once you know the rough timing for each section of your presentation, you can
    keep an eye on your rehearsals to make sure you stick to your timings. I do this
    in the presenter notes for each slide. I write a note indicating what time that
    section should have started. For example, if section three consists of ten slides
    and I expect to complete that section within 15 minutes, I mark each of those
    ten slides with a comment that says `Time = 15 minutes`. These marks are visual
    reminders of where I need to be.


    With applications like PowerPoint, the presenter view has a time at the top when
    you go into presentation mode. As soon as I start my talk, I hit the reset button
    to set the timer to zero. This is the timer I use to keep an eye on my timings.
    It is a simple little trick, but it really helps. Especially when you are nervous,
    you can easily start talking too quickly and get ahead of yourself on your timings.
    By having a constant visual reminder like this, you can ensure that you remain
    on track.


    Another technique I have seen used by speakers is an interval-time application
    on their phone. Interval timers are commonly used by people who do High-Intensity
    Interval Training (HIIT). The interval timings tell them when to start a new exercise
    or take a break. You can use these applications to enter the timing details for
    each section of your presentation. It’s a great idea, and I have seen it used
    many times. The only downside is that if you mess up your timings because someone
    asks a question or go on a tangent, the interval timer will be out of sync, which
    can throw off your flow.


    ## Get Your Practice Audience to Ask Questions


    The questions section at the end of the presentation is one of the most challenging
    parts to prepare for, mainly because you do not know what to expect from the audience.
    Even in professional talks, you will find that the nature of the questions can
    vary greatly. Only a small proportion of the audience will ask questions. However,
    not all of them will focus their questions on the content that you discussed.
    Some will be more interested in your career, or a side comment you gave. Others
    will ask for advice on their careers or their projects.


    Because of the wide range of possible questions that your audience will ask, there
    is no way to thoroughly prepare for the question-and-answer part of your presentation.
    What you can do is practice answering anticipated questions.


    To do this, you will need to ask for help from those who are watching your presentation
    run-throughs. Before you show your presentation to them, give them a piece of
    paper, and ask them if they could write down questions that pop into their minds
    during your talk.


    After the practice presentation, collect the questions from them and prepare answers
    to as many as possible. Simply by reading their questions, you’ll be able to prepare
    for the question-and-answer portion of the talk.


    This technique will allow you to anticipate most questions that the audience may
    have after your presentation, and other questions can be answered with similar
    responses. I suggest adding the commonly asked questions in practice sessions
    into your presentation’s content so that your audience will no longer need to
    ask them. For example, if you are doing a presentation on software development
    and a particular programming library, you may get a few questions from attendees
    about how to set up the library. Even though your talk is mostly about how to
    use the library, add a small section with details about the setup process.


    The question-and-answer section of a talk can be quite nerve-racking, as people
    naturally fear uncertainties and not being able to provide an answer. However,
    if you prepare answers to many common questions, you will feel more relaxed and
    prepared. We will cover the question section of the talk in more detail later
    in this book when we discuss the actual talk delivery.


    ## Memorize the Introduction to Each Section of Your Presentation


    After preparing your presentation, you should practice each part to the point
    of memorizing the entire presentation. Ideally, you should have this level of
    mastery for all your presentations. However, you will seldom have enough time
    to memorize your presentation word for word—I certainly don’t!


    An alternative is to memorize only the beginnings of the different sections of
    your presentation. A lengthy talk, for example, could be divided into five parts.
    When practicing, try to memorize the introduction for each of the five sections
    you will present. The introductions are important because they signal your brain
    to start recalling the sequence of information you practiced. Simply by delivering
    each introduction, you will signal your brain to continue with subsequent topics.'
