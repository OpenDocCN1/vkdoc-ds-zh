    About the Author


    # 1. Why Public Speaking Is an Important Skill


    Learning how to deliver talks with confidence to an audience is a skill that will
    have many benefits for both you and your career. A concept that, on the surface,
    seems so simple can have quite big consequences. In this chapter, we’ll look at
    the importance of public speaking.'
