- fmt: "# Workshop Questions\n\n1.  When you have a working draft of your presentation\
    \ and you have practiced a few times yourself, form a small group of trusted people\
    \ that you can do the presentation too. This could be family, friends, or colleagues.\
    \ Try as best as you can to pick a group who represents your target demographic.\n\
    \n2.  When you have rehearsed several times and are feeling more confident with\
    \ your presentation, record one of your rehearsals so you can watch it back and\
    \ analyze your delivery. You could either:\n    *   Have the slides display on\
    \ your monitor and stand next to the screen. Using your mobile phone, place it\
    \ on a chair or stand and record yourself while doing your presentation. Turn\
    \ the brightness down on your computer screen so that you can see the slides.\
    \ The recording quality doesn’t matter if you can see yourself and the screen\
    \ and hear your voice.\n    *   Or using a screen-recording application such as\
    \ Camtasia, `ScreenFlow` or QuickTime, record your slides on the screen and a\
    \ webcam feed of you presenting.\n    *   When you have a recording of your talk\
    \ and don’t worry too much about recording quality, watch the video back and look\
    \ at how you did with your delivery. Things to look out for: Do you regularly\
    \ get stuck? Do you know the introduction to each section by memory? Are there\
    \ any areas in your delivery where more in-depth presenter notes will help you?\
    \ Are your slides clear and easy to read?\n\n3.  Have your practice audience ask\
    \ as many questions as possible about the subject you are presenting on. Ask them\
    \ not to hold back. If there is anything they are not sure about, or they have\
    \ requests for additional information, get them to ask.\n    *   Write each question\
    \ down.\n    *   After the practice session, start grouping the questions into\
    \ common themes.\n    *   Analyze each theme. Either prepare an answer for these\
    \ themes, or if a lot of people asked similar questions, think about adding additional\
    \ content into the presentation to cover the answers.\n\n4.  Spend time observing\
    \ people’s face and hand gestures when they speak. When you are talking with friends,\
    \ family, or colleagues, how do they use their hands to emphasize what they are\
    \ saying? Can you learn from this?\n    *   Look up talks on YouTube (TED Talks\
    \ are excellent) and study the speakers. How do they speak, stand, and use gestures\
    \ to convey information? Practice mimicking them.\n\n5.  Time your presentation\
    \ when rehearsing. Does it fit into your allocated time slot? If you are presenting\
    \ at a commercial conference, then the time slot will be strictly enforced. Do\
    \ you have enough time to present and leave time for questions and answers at\
    \ the end?\n    *   Work out rough timings for each section. In the speaker notes\
    \ in your presentation software, make a note of when in your time slot that should\
    \ start. This will help you when on stage to see if you are running ahead or behind.\n\
    \n6.  Memorize the introduction to your talk, the first five minutes or so. This\
    \ will allow you to get into a flow that puts you at ease. As part of your introduction,\
    \ see if you can introduce a little joke to make the audience smile, if this is\
    \ appropriate. Making the audience smile or laugh early on can help ease tension\
    \ and relax the audience.\n\n7.  Look through your presentation slides and demos\
    \ to determine any part of it that relies on an internet connection. Things to\
    \ consider:\n    *   Videos that play online: You ideally need to download the\
    \ videos to play from your laptop.\n    *   Software demonstrations that need\
    \ to contact an online service: If this is a software development demo, then look\
    \ at creating stubs for any online calls.\n\n8.  If there are parts of your presentation\
    \ that will not work without an internet connection, then create a duplicate slide\
    \ deck and take screenshots of any aspects that need the internet. If you have\
    \ an internet failure on stage, you can switch to this backup slide deck.\n\n\
    # Delivering the Talk\n\nOn the day of the talk, you will feel tension and anxiety\
    \ about the prospect of your upcoming talk. However, try not to let this feeling\
    \ affect your performance—managing your anxiety and working through it is one\
    \ of your challenges as a public speaker.\n\n## Be Prepared\n\nAs I’ve mentioned\
    \ several times in the book, preparation is the key to your success as a public\
    \ speaker. You should make sure that everything you need is set the night before\
    \ the presentation.\n\nIn the last chapter, we talked about your preperformance\
    \ rituals, and part of that was ensuring you have everything you need packed and\
    \ ready to go, such as your laptop, chargers, and HDMI adapters. On the morning\
    \ of your talk, you will have enough to think about, as opposed to worrying, if\
    \ you have all your adapters, slide clickers, and cables ready.\n\n## Visualize\
    \ Your Success\n\nVisualization is a great technique to use before your presentation.\
    \ In this technique, you imagine yourself giving a successful talk and everything\
    \ running smoothly. You imagine giving the talk from start to finish at the event\
    \ venue with a full audience. When doing this exercise, imagine that the audience\
    \ is completely engaged in your talk. Imagine the audience laughing when you deliver\
    \ your jokes and your punchlines. Also, imagine their looks of amazement when\
    \ they see your killer piece of information as a revelation.\n\nFinally, imagine\
    \ concluding your presentation as the audience gives you a standing ovation. This\
    \ activity helps motivate you to give an excellent performance. If you have any\
    \ doubts about your public speaking skills, visualizing yourself as successful\
    \ will significantly help decrease the amount of uncertainty and stress you feel.\n\
    \nIt may feel a little silly imagining the presentation like this, but positive\
    \ visualization is a very popular technique used by many professionals, such as\
    \ athletes and performers. Nobody needs to know you are doing it, but visualizing\
    \ success puts you in a positive frame of mind to do your talk. If you do the\
    \ opposite and visualize your talk going wrong, then you will be in a negative\
    \ frame of mind, which will set you off on the wrong path when you go to do the\
    \ talk.\n\n## People Want to See You Succeed in Giving Your Talk\n\nMost new public\
    \ speakers experience extreme cases of anxiety right before the presentation.\
    \ The most common reason cited is the fear of facing the audience. People fear\
    \ that they will make mistakes and that they will be humiliated in front of the\
    \ crowd.\n\nIf this happens to you often, always remind yourself that the audience\
    \ is there to see you succeed. They want you to give a successful talk because\
    \ they want to learn from you. If you do everything you have practiced, you will\
    \ do well in your presentation.\n\nYou should remember that the audience has chosen\
    \ to attend your talk. They didn’t come to see you fail. They are there because\
    \ they are genuinely interested in the topic, and they want to learn from you.\
    \ They are there to see you succeed. I have been to many talks where there have\
    \ been technical problems—a demo fails, the internet breaks, or the speaker forgets\
    \ a line and stumbles. I have never seen anyone put down the speaker because of\
    \ a mistake. As someone who is prepared to put themselves out in front of an audience,\
    \ there is a natural respectful relationship between the audience and the speaker."
