  trans: '

    # 遭遇技术故障时，道歉并继续前进


    如果你计划将来做更多演讲，你会意识到有些意外情况是你无法掌控的。无论你准备得多么充分，演示过程中终究会遇到一些灾难性状况。其中大部分是技术故障——当我们依赖的工具出现意外行为时。最糟糕的情况莫过于这些工具在演讲前或演讲过程中失灵。


    如果遇到这种情况，请务必在观众面前保持专业态度——不要大喊大叫、骂骂咧咧或惊慌失措。在压力下展现优雅风范。当事情在观众面前失去控制时，你正好可以向他们展示自己在紧张局势下的应对方式。对于咨询顾问来说，这是向潜在客户展示自己即便面临巨大压力也能保持冷静的绝佳机会。


    你也可以用幽默来化解尴尬局面。我记得有一次为大约 300 名软件开发人员做演讲。投影仪开始闪烁，然后完全熄灭了。我尝试了拔掉线缆再插回去的常规操作，但毫无效果。正当我这么做的时候，我看到音视频工程师正走上舞台。我知道会有一小段延迟，于是开了个玩笑。我问房间里是否有
    IT 专业人士——是的，在坐满 IT 专业人士的房间里。我们一起笑了起来。接着我指出自己忘了向演示之神献祭，并提名第一排观众为祭品。这引发了更多笑声。这时，音视频工程师已经重新启动了讲台下的
    HDMI 接线盒。投影仪恢复工作后，我直接接上继续演讲。尽管出现了技术故障，但根本没人介意。每个人都获得了他们想要的信息，这次演讲在与会者中获得了很高的评价。


    如果你的演讲依赖软件演示，就可能会遇到演示失败的情况。我曾开玩笑说要向演示之神献祭，但我迷信的那部分总觉得其中有些道理。我总是发现最难进行的演讲就是那些严重依赖演示的，尤其是软件开发演示。你可以反复练习这些演示而不会遇到任何问题；但一旦站上舞台，似乎总会出点什么差错。我们已经讨论过网络应急预案，但同样值得准备一个演示应急预案，即使它不依赖网络。如前所述，在这种情况下，我会在演讲幻灯片末尾准备一系列展示演示预期结果的截图。


    如果确实遇到演示失败，不要试图掩饰或蒙混过关。只需道歉，然后转到幻灯片末尾的应急幻灯片，展示结果。与会者知道演示可能会出错。舞台是一个高压环境，你很容易犯错。与其花很长时间试图弄清楚出了什么问题，不如直接展示结果。观众对此不会有意见。他们是来学习的。演示失败虽然令人恼火，但并非致命问题。只需为每次演示可能失败做好准备，并在幻灯片末尾准备好那些截图页面。比起因为事情不如预期就放弃，不如坚持到演讲结束，展示一些结果——即使是计划之外的。正因如此，观众反而会敬佩你保持冷静并完成演讲。


    如果演示失败，观众最不能接受的是你在台上手忙脚乱，而他们却得不到任何解决方案或结果。做好准备，日后你会感谢我的。


    ## 如果可能，至少在活动现场彩排一次


    在活动现场进行最后一次彩排有助于提升你的表现。如果可能的话，在演讲前一天前往活动现场，询问现场人员是否可以在舞台或讲台上进行简短彩排。这在大型会议上通常不太可能，但询问能否在正式演讲的房间练习一下也无妨。


    这次造访能让你了解场地以及演讲时可以利用的设施。例如，你可以了解舞台有多大，以及主办方将使用什么系统来展示幻灯片。有些会使用投影仪，而另一些则会使用大屏幕电视。


    在场地练习台词时，你应该已经开始思考如何在舞台上移动。如果你计划在演讲时走动，就需要确保有足够的空间；并非所有舞台都大到可以让你随意走动。另一个考虑因素是演讲是否会被录像。摄像机是固定位置的吗？如果是，你很容易走出画面。如果摄像机有操作员，那么你通常会有更多走动自由。你可以提前向会议主办方了解他们是如何管理摄像和录像的。


    如果无法提前在场地进行完整彩排，也不必担心。提前找到你要演讲的房间仍然是个好主意，哪怕只是为了看一眼并知道路线。


    ## 在舞台上


    重要的日子终于到来。你站在舞台上。笔记本电脑已设置好。投影仪正常工作，音视频工程师已为你配备了麦克风和发射器包。你站在那里——内心默默惊慌——与会者正陆续入场就座。就是这一刻：你为之准备的日子。你研究过演讲内容，制作了精美的幻灯片，排练的次数多到你自己都不好意思承认。你完成了演讲前的例行准备，此刻你站在舞台上，等待开始。


    会议室的门关上了；灯光暗了下来。你开始讲话。


    ### 将声音传送到会场后方


    在演讲过程中，你应该力求将声音传送到会场的最后一排。这样做能确保你的声音覆盖所有与会者。如果场地相当大，你应该考虑询问主办方将使用哪种麦克风，以确保全场观众都能听到你的声音。在大型会议上，主办方会为你提供麦克风，要么是领夹式麦克风，要么是头戴式麦克风。


    然而，在小规模活动中，可能没有麦克风可用。这意味着你需要稍微提高音量，确保每个人都能听到你。无论你是否使用麦克风，想象你在对最后一排的人讲话，同时将声音投射出去。不必担心通过麦克风声音太大；负责会场音效的工作人员会处理音量问题。


    ### 与观众进行眼神交流


    你还应该练习与听众进行眼神交流。如果你避免眼神接触，观众可能会认为这是焦虑或缺乏自信的表现。当你期待观众有所反应时，最适合进行眼神交流。例如，当你提出修辞性问题时，可以与观众进行眼神交流。在陈述结论或关键要点时，也可以这样做。


    一个好技巧是：与那些专注于演讲的人进行眼神交流。找到那些正在听你讲话的人，在演讲的关键时刻与他们进行眼神交流。


    进行眼神交流时，确保每次只持续几秒钟，以免对方感到不自在。你需要一次只与一个人进行眼神交流。

    '
- fmt: '### Accept That Some People Are Just Not Attentive


    Beginners in public speaking often feel bad when they see that some members of
    the audience are not listening and doing something else. When you can see that
    some attendees are not engaged in your presentation, don''t blame your performance.
    These situations are out of your control. Some people just don''t have the same
    level of interest in the content as you do, so having a few inattentive people
    in a large room is normal.


    Some may be busy and were forced to attend the event. Others may be tired or distracted.
    While you can try your best to engage the entire audience, you should expect that
    some people will be disengaged. The best you could do at this point is to focus
    your attention on the people paying attention.


    What you absolutely don''t want to do is call them out in front of everyone else.
    This will make them feel bad and make you look petty. There could be a genuine
    reason that someone isn''t paying attention, but the stage isn''t the place or
    time to judge them. Ignore it and move on by delivering a killer talk.


    ### Reaffirm to Yourself the Importance of Your Message


    Throughout your preparations for the talk, always reaffirm to yourself why the
    topic you will be discussing is important. Think of what actual value the talk
    has for the people in the audience. You should repeat this reaffirmation right
    before you take the stage. By reminding yourself why this talk is important, you
    will be able to inject passion into your presentation. Your emotions will seem
    more genuine, and the audience will more likely relate to your stories.


    By reaffirming the importance of your presentation to yourself, you will also
    feel motivated to deliver a great talk. You will care about how you deliver the
    talk and how the people in the audience receive it—you won''t present your topic
    on autopilot.


    Reaffirming the importance of your topic will also help in creating content that
    is relevant to the target audience. It''s common for people to create unnecessary
    content for their talks, especially to pad the presentation to make it fill out
    a longer time slot. As a result, some parts of their talks are not as important
    from the point of view of their target audience. Some people also tend to talk
    about other topics when they are at the podium or on stage. They sometimes skip
    the script and main topics and say whatever enters their minds at the time.


    You will quickly lose the interest of your audience if you go off topic often
    when you speak. The attendees will quickly become distracted if they are not interested
    in the subject. By keeping focused on the importance of your talk, you will be
    able to present a talk that doesn''t deviate from the topic.


    ### Create a Great First Impression in the First Few Minutes of the Talk


    Whenever you meet and talk to anyone new, they will perceive you as a stranger,
    which is when you have an opportunity to make a great first impression. The same
    is true with public speaking. Most of the audience will not know you, so you have
    a chance to make a good first impression. You will only have a single chance to
    make a good first impression, so you need to capitalize on this opportunity if
    you want to deliver a great presentation.


    To deliver a great first impression, you need to look and sound like a person
    of authority in your chosen subject. You also need to make sure you are dressed
    appropriately for the venue. If you are at a corporate event, then showing up
    on stage or in the boardroom in jeans and a T-shirt may not give the first impression
    that you hope for. On the other side, if you are speaking in a very informal meetup
    group, showing up on stage dressed as if you''re headed into a boardroom may not
    give the right impression either.


    The audience will also judge you on how you sound on stage as well as your perceived
    level of confidence. As you speak, you want to project your voice to the back
    of the room even if you are using a microphone. You need to talk slowly enough
    that people can understand you, but not so slowly that it sounds strange. Speaking
    too quickly will also come across as a lack of confidence and nervousness, which
    causes an audience to disengage if they can''t understand what you are saying.


    The audience will judge you based on what you say, so the first few words out
    of your mouth are crucial when it comes to building a great first impression.
    Beginning your presentation with a great introduction will create a positive image
    of you for the audience. The best way to do this is to let your personality come
    out.


    You should be yourself when you are presenting to your audience. While it may
    sound cliché, there is a reason being yourself is the best route to go when making
    a great first impression. When you are in front of a large audience, you will
    naturally feel nervous. While some people in the audience may understand that
    you are stressed, most of them will not care. They will simply judge you based
    on your behavior on stage.


    I have had some people suggest in the past that you should fake your personality
    when presenting so that you will appear confident even when you''re not; this
    only works if you are a good actor. For those of us without formal acting training,
    this strategy may backfire. People who try to pull this off without sufficient
    practice will end up looking like they are faking it. Their personalities will
    appear inconsistent, and the audience will see through this.


    Instead of faking your personality, try being more comfortable with who you are—speak
    to your audience just as you do when talking to friends or colleagues. Using humor
    can be a terrific way to engage an audience as it helps to disperse any skepticism
    or cynicism. Early in my speaking career, a mentor once suggested that I try to
    make the audience laugh or smile within the first 60 seconds of the talk. By making
    them laugh or smile, you automatically release any tension in the room; the audience
    relaxes and engages more with you. Using humor in talks helps to humanize the
    speaker. You are no longer a stranger on the stage blasting through monotonous
    slides. Humor shows you are human and that you have a playful side. Using humor
    also shows that you are confident and comfortable talking to the audience—even
    if you are terrified inside. If you smile and chuckle at your own jokes, you are
    also signaling to the audience that you are joking and that it is okay for them
    to laugh along with you.'
  raw: '### Accept That Some People Are Just Not Attentive


    Beginners in public speaking often feel bad when they see that some members of
    the audience are not listening and doing something else. When you can see that
    some attendees are not engaged in your presentation, don’t blame your performance.
    These situations are out of your control. Some people just don’t have the same
    level of interest in the content as you do, so having a few inattentive people
    in a large room is normal.


    Some may be busy and were forced to attend the event. Others may be tired or distracted.
    While you can try your best to engage the entire audience, you should expect that
    some people will be disengaged. The best you could do at this point is to focus
    your attention on the people paying attention.


    What you absolutely don’t want to do is call them out in front of everyone else.
    This will make them feel bad and make you look petty. There could be a genuine
    reason that someone isn’t paying attention, but the stage isn’t the place or time
    to judge them. Ignore it and move on by delivering a killer talk.


