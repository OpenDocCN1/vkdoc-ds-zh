    接着，我指出，尽管这些设备功能强大，但它们也极擅长分散我们的注意力——邮件、通知、电话、视频通话、推特消息。大量的干扰会阻碍你的工作效率。我提出，如果对这些干扰置之不理，我们的职业生涯和自信都会受到影响。我以此收尾，重申我们需要打破这种分心的循环，同时依然要享受科技带来的便利。在这里，我试图暗示我们将在演讲中尝试解决这个问题，但演讲的目的并非让你放弃科技。


    这是一个强有力的开场钩子。只需阅读这几句话，你就能对演讲的基调和内容有所了解。一些已接纳此演讲的会议会在日程页面上显示演讲标题和我的开场钩子。读者随后必须点击演讲才能了解更多信息。


    接着，在摘要中，我们会为那些在阅读开场钩子后感兴趣的读者提供更多关于演讲的信息。


    > *刚成为自由职业者时，我以为自己会拥有终极自由，想做什么就做什么。某种程度上确实如此，但没有人监督我，没人让我负起责任。我开始变得分心。过了一段时间，我决定必须做出改变。我开启了一段探索之旅，力求提高效率、专注力和动力——同时仍会偶尔放纵自己刷一刷网飞。*


    在摘要的下一部分，我介绍了自己的个人故事。我的意图是向读者暗示，我不只是要罗列一系列技巧——我是在分享亲身经验。在我看来，我最喜欢的一些演讲都基于演讲者的亲身经历，这能让你在演讲中编织一个故事，而大家都喜欢好故事。


    现在，我们希望读者已经完全被吸引住了。他们知道了演讲的主题以及我个人故事的引子。现在让我们提供更多细节。


    > *在本次演讲中，我将分享我关于个人分心、动力不足以及项目焦虑加剧的故事。我还会分享我是如何打破这个循环，重新找回创造力和工作热情的。*


    > *本次演讲面向所有渴望提高效率但每天却与分心作斗争的人。我将涵盖以下主题：*


    *   > *分心与拖延*

    *   > *在工作中寻找意义*

    *   > *自我激励*

    *   > *控制点*

    *   > *效率与时间管理*

    *   > *社交媒体成瘾*


    如果读者还没意识到我将要谈论个人经历，我会明确地告诉他们，这个演讲是关于我分心、动力不足和项目焦虑的故事。我声明将谈论我是如何打破这个循环的。我讲故事不是为了讲故事本身；谈论如何克服问题是有其目的的。


    然后我提到演讲的目标受众；在这个案例中，是那些想要提高效率、减少分心的人，这大概涵盖了所有人。接着，我将演讲的主要议题以项目符号列表的形式呈现。这意味着关于我将要涵盖的内容不会有任何歧义，因为我已直接说明。事实上，这个列表后来成为了演讲的主要章节标题。没人能说他们不知道演讲内容，因为我说得非常直接。


    有些人可能会说，详细到这种程度就相当于剧透了演讲内容，但我不同意。他们知道主要议题，但不知道所有细微的内容。这场演讲时长一小时，我平均会讲 55 分钟。里面内容很丰富。


    最后，我们进入结束语。


    > *我现在认为自己非常高效，但达到这个状态是一场战斗。让我分享我的故事，从而帮助你变得高效和自信。*


    我的结束语只有两句话，但很具体。我首先说明我认为自己现在很高效。换句话说，我解决了问题，但这过程很艰难。这向读者传递了一个信号：这是一场可以打赢的战斗。最后，我说我将分享我的故事——以防这一点还不够明确——并且我会帮助你变得高效和自信。换句话说，我不仅要给你讲故事，还要给你提供解决方案。


    在我写过的所有演讲中，这是个人最喜欢的一个。这也是我首先谈到它的原因。当我做这个演讲时，与会者会在活动结束后过来与我交谈，或私下联系我，告诉我他们有多喜欢这个演讲，以及它如何帮助他们，这让我感到无比谦卑。为了撰写这次演讲，我付出了很多心血，为了精心打磨一个——在我看来——完美的摘要也费了不少功夫。这个摘要并非一蹴而就，而是经历了多次修改。


    接下来我想介绍的演讲则完全不同，因为它面向的是极其特定的技术受众。

    '
- fmt: '# Talk 2: .NET Core Data Security: Hope Is Not a Strategy


    This talk is the first one I ever designed and delivered. The talk is aimed at
    a specific audience of Microsoft .NET developers, so it is quite a niche.


    Before we look at the initial hook, you can read the entire synopsis.


    > Failing to encrypt your data is a risky move, and simply hoping that you won’t
    get hacked and compromised is not a strategy. As a software developer, you have
    a duty to your employer to secure and protect their data.


    > Through this talk, you will learn how to use the `.NET` framework to protect
    data to ensure confidentiality, integrity, nonrepudiation, and authentication.


    > This talk covers random number generation, hashing, authenticated hashing, password-based
    key derivation functions, and symmetric and asymmetric encryption using `DES`,
    `Triple DES`, `AES` (`CBC` and `GCM`), and `RSA`. You will also learn how to combine
    them to produce a hybrid encryption scheme that includes `AES`, `RSA`, Hashed
    Message Authentication Codes, and digital signatures.


    The main title, “.NET Core Data Security,” will mean something to Microsoft .NET
    developers — as I said, this is a niche talk. The subtitle says hope is not a
    strategy, which implies that hoping your data will not be compromised is not a
    good business strategy; you need to act.


    I then built on this further with a remarkably simple hook.


    > Failing to encrypt your data is a risky move, and simply hoping that you won’t
    get hacked and compromised is not a strategy. As a software developer, you have
    a duty to your employer to secure and protect their data.


    Here, I am reaffirming the subtitle of the talk, just in case the reader doesn’t
    pick up on it. Again, when a conference displays a talk on its website, it typically
    includes the talk title and the first one or two sentences, and then the reader
    must click through to read more. When they want to read more, they get the subsequent
    details.


    I then state that as a software developer, you have a duty to your employer to
    protect their data. Here, I am telling the reader that if you are a developer,
    you have a responsibility. I am hoping this makes the reader suddenly sit up and
    think that they need to pay attention.


    We then get into the main details of the talk.


    > Through this talk, you will learn how to use the `.NET` framework to protect
    data to ensure confidentiality, integrity, nonrepudiation, and authentication.


    > This talk covers random number generation, hashing, authenticated hashing, password-based
    key derivation functions, and symmetric and asymmetric encryption using `DES`,
    `Triple DES`, `AES` (`CBC` and `GCM`), and `RSA`. You will also learn how to combine
    them to produce a hybrid encryption scheme that includes `AES`, `RSA`, Hashed
    Message Authentication Codes, and digital signatures.


    The main details are quite technical, but I am aiming at a specific audience niche.
    If the terms are familiar with the reader, then it is most likely a talk for them.
    In these details, I state what cryptography primitives I will talk about and how
    to use them together in their software solutions. The actual talk follows what
    I mention in this section quite closely.


    This talk does not have a closing statement. Since I originally designed the talk,
    the synopsis hasn’t changed much. As the talk is so niche to its intended audience,
    what I will talk about and the level of the talk are obvious.


    This has been an extremely popular talk that I have been fortunate to deliver
    all over the world, but it is my first-ever designed talk and probably not the
    best in terms of design. However, I have adapted it over the years, and it always
    goes down well with its intended audience.


    The next talk I want to talk about is also a specific technical talk with a niche
    audience.


    ### Talk 3: Protecting Encryption Keys with Azure Key Vault


    “Protecting Encryption Keys with Azure Key Vault” is another niche software development
    talk aimed at Microsoft developers using Azure, their cloud computing platform.
    This talk focuses on a service provided by Azure called the Key Vault, which is
    a service that allows you to create and manage encryption keys as well as store
    confidential secrets such as passwords for third-party services. The type of people
    who would be interested in this talk are software developers working in larger
    corporate enterprises, so that was my target audience.


    The title for this talk doesn’t have a subtitle. The main title says what the
    talk is about and what platform it is aimed at — Azure Key Vault. When I submit
    this talk to events that specialize in Microsoft-based software development, anyone
    who reads that title immediately knows what the talk is about.


    Before we look at the initial hook, you can read the entire synopsis.


    > In a world where we put our companies’ data in the cloud, protecting that data
    from data breaches has never been more important.


    > In this talk, I demonstrate how to set up and use the Microsoft Azure Key Vault
    to protect your encryption keys and secrets, such as passwords and connection
    strings. Azure Key Vault harnesses the power of hardware security modules to protect
    your secrets and make sure your solutions are as secure as they can be, which
    is particularly important in regulated industries like health care, finance, and
    insurance.


    > In addition to setting up and configuring the vault, I will show you how to
    code against key vault libraries and various patterns for security in a cloud-based
    multi-tenant environment. I will cover the following topics:


    - Setting up Azure Key Vault

    - Authorizing your application to access the vault with Azure Active Directory

    - Accessing the vault from your applications

    - Using the vault to wrap local encryption keys for performance

    - Encrypting connection strings as Key Vault secrets to get flexible database
    routing in the cloud


    > You will leave this talk with everything you need to start using Azure Key Vault
    today.


    Let’s start with the talk’s initial hook.


    > In a world where we put our companies’ data in the cloud, protecting that data
    from data breaches has never been more important.


    The initial hook for this talk is just one sentence. Here, I state that we are
    putting more data into the cloud, and that it is as important, now more than ever,
    that we protect that data. This is the main point of the talk. We need to protect
    our employers’ and customers’ data from data breaches. You can turn on the TV
    every day and hear about a company that has had data lost or stolen. We want to
    stop that, and this talk is designed to help.


    Next, we have the “more detail” section of the synopsis.


    > In this talk, I demonstrate how to set up and use the Microsoft Azure Key Vault
    to protect your encryption keys and secrets, such as passwords and connection
    strings. Azure Key Vault harnesses the power of hardware security modules to protect
    your secrets and make sure your solutions are as secure as they can be, which
    is particularly important in regulated industries like health care, finance, and
    insurance.


    > In addition to setting up and configuring the vault, I will show you how to
    code against key vault libraries and various patterns for security in a cloud-based
    multi-tenant environment. I will cover the following topics:


    - Setting up Azure Key Vault

    - Authorizing your application to access the vault with Azure Active Directory

    - Accessing the vault from your applications

    - Using the vault to wrap local encryption keys for performance

    - Encrypting connection strings as Key Vault secrets to get flexible database
    routing in the cloud'
