    \n学会如何在观众面前自信地进行演讲，是一项对个人和职业发展都有诸多裨益的技能。这个看似简单的概念，实际上可能产生相当深远的影响。在本章中，我们将探讨公开演讲的重要性。\n"
- fmt: '# My Story


    My adventure in public speaking started in 2014. I had just started writing online
    training courses for a company called Pluralsight in the United States. Pluralsight
    is an online training company focused on topics related to app development and
    information technology. While I had no problems creating my online classes, promoting
    them was new to me.


    To attract an audience for my courses, I needed to talk to communities that might
    be interested in taking my classes. I needed to talk to strangers about how my
    online courses could help improve their knowledge and performance on software
    security. No amount of time preparing slides prepared me for my first presentation;
    I had to speak to a meetup group of 60 prospective students.


    Before the presentation, I was terrified about what would happen. At that point,
    I realized that I had a genuine fear of public speaking. But after much research,
    I learned that speaking to a large group is one of the most common concerns that
    people have.


    Knowing that I was not the only one with this fear, I proceeded to put more time
    into preparing for my presentation. I practiced with my PowerPoint slides multiple
    times a day, recording my voice and working on my lines. I decided when I would
    deliver my punchlines and when to use silence to get the attention of the audience.


    Before my presentation, I rehearsed in front of a few friends, and they gave me
    valuable insights into the areas of my performance that I could improve. With
    their help, I created a solid presentation that made me look like an expert, and
    in some ways, I knew I was in the eyes of my audience.


    All my practice did not make my first public-speaking experience any less terrifying.
    On the day of the presentation, I was on the verge of having a panic attack. I
    had heard of performance anxiety in the past, but I had never actually experienced
    it until that moment. I attempted to manage my emotions and went through my presentation.


    Surprisingly, my presentation went well on my first try that day. All my hard
    work and practice gave me the confidence to stand in front of a large crowd. People
    were attentive even when I discussed the more technical parts of the subject.
    The reception from the audience was excellent; I had piqued their interest. There
    was no shortage of questions after my presentation.


    Thankfully, I was prepared for most of the questions that the audience asked.
    As for those I did not anticipate, I was still able to answer them because of
    all the extensive preparation and content research I did beforehand.


    My presentation went so well that I received an invitation to do another talk
    the following month at a different meetup group. It was essentially the same presentation,
    so all my previous preparations could be used as part of this new opportunity.


    For the second event, I worked on a few details for the presentation, such as
    adding storytelling segments to illustrate my key points based on feedback from
    the first event. I studied new strategies for organizing my ideas and how to manage
    the crowd. With all the added features for my second presentation, it was no surprise
    that it was even more successful than the first one. I knew the first presentation
    was good, but I did not know that it could be even better until after my second
    presentation when even more people enrolled in my courses.


    I continued presenting to more user groups for the next 18 months. My public-speaking
    success fueled people to take my online courses and to invite me to speak at more
    meetup groups. I realized that to boost the number of enrollees in my classes,
    I needed bigger audiences. I knew that I needed to summon the courage to talk
    at professional software development conferences. Without overthinking it, I applied
    to speak at the Norwegian Developers Conference (NDC) in London, one of the biggest
    conferences in my industry. I got in!


    With the new opportunity, however, came new fears. The people I was preparing
    to talk to were some of the leaders and senior peers in my industry. The attendees
    had paid a lot of money to attend and learn from authorities in their field. The
    margin of error was quite narrow if I wanted my courses to be taken seriously.


    However, with 18 months’ worth of experience as a presenter to professionals in
    my industry, I managed to overcome my fears and delivered a great presentation.
    The talk went well, and the response from the audience was excellent. People approached
    me with questions about my course and other topics mentioned during my talk.


    As more people learned about me and what I was speaking about, it became easier
    to line up more talking opportunities. After NDC London, I applied to give a talk
    on software security at Technorama in Belgium and another NDC event in Oslo, Norway.
    I did not shy away from more conference talks the following year. I presented
    at NDC London, Oslo, and Sydney.


    I also had the opportunity to talk at two Code Europe events in Poland: one in
    Krakow and another in Wroclaw. To cap the year off, I was invited to a second
    Technorama event in the Netherlands. In between these conferences, I continued
    to talk to smaller user groups to promote my courses in my local area and practice
    speaking in front of audiences.


    Public speaking brought a lot of benefits with it. With the help of my newly developed
    public-speaking skills, I established myself as an authority in my field, and
    I showed people why it was worth enrolling in my online courses.


    By actively building my skills in public speaking, I overcame my fears and the
    anxiety that used to come before every speaking engagement. When I talk to crowds
    these days, the level of stress I feel is insignificant compared to the stress
    levels when I first spoke in public. Large crowds no longer faze me. Instead,
    I get excited about new opportunities to speak before new user groups.


    Due to my public-speaking skills, I’ve had the opportunity to travel to new places
    and see the world. When I am one of the speakers, organizers of large conferences
    pay for flights and my accommodation. I’ve always wanted to travel the world but
    never actually got around to it when I was younger—one of my regrets. Through
    my public-speaking skills, I am now fulfilling that dream and seeing more of the
    world while doing what I love.


    Probably one of the most significant advantages of public speaking is the number
    of people with whom I managed to develop connections over time. Without public
    speaking, I would never have met some professionals with whom I now work. I help
    them through my courses and even with some professional advice I provide in the
    talks. They also do the same for me. The opportunities that came to me were primarily
    due to the relationships I built when talking to small and large gatherings alike.


    Lastly, my ability to talk to the public gave me the opportunity to maintain the
    lifestyle that I love. I am a freelancer, and I value having the freedom to decide
    how I use my time. Because of this skill set, my online courses are now successful,
    giving me the chance to continue this type of lifestyle. I work while I am traveling
    and meeting new people. I make money on my terms in a career that I built. Speaking
    at conferences and with small groups gave me the opportunity to continue this
    lifestyle.


    In the following chapters, I will help you learn some of the tips and tricks I
    learned during my years of experience in public speaking. Let’s begin by looking
    at some of the benefits of becoming a public speaker. It is important to mention,
    however, that public speaking is not limited to being on stage at a user group
    or a conference. Public speaking includes any situation in which you present information
    to a group of people, and this involves corporate presentations that you do at
    work. Everything in this book is just as relevant, regardless of whether you stand
    on stage at a conference or in a boardroom.


    **Note**


    The word “stage” is used to represent either standing on a stage at a conference,
    addressing your audience, or standing at the front of a room at a meetup group,
    in your office, or in the boardroom.'
