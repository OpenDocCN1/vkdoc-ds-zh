    If the worst does happen, the first backup measure you can use is to have a second\
    \ set of slides for the talk, with all the key points of the demo expressed as\
    \ screenshots. If the demo fails and you can’t fix it, don’t fret over it. Just\
    \ load up the second slide deck and carry on. The audience won’t mind; it is the\
    \ overall talk they are interested in; they will be sympathetic, so try not to\
    \ worry.\n\nIf you don’t want to use screenshots, you could record the demo as\
    \ a video using software such as `Camtasia` or `ScreenFlow` and embed those videos\
    \ in your second slide deck. Then, if you switch to those slides, you can set\
    \ the video to play when the slide comes into view, and you talk over it. I have\
    \ seen many speakers use this technique, and it is highly effective.\n\nOne of\
    \ my talks, which we looked at the synopsis for earlier in the book, is about\
    \ a cloud computing service called `Azure Key Vault`, which is part of Microsoft’s\
    \ Azure cloud computing platform. In that talk, I do many software development\
    \ demos, and each of those demos connects to a key vault in the cloud, so an internet\
    \ connection is required. The measure I took to mitigate bad internet connections\
    \ was to create what is called a programming interface, where I make a dummy copy\
    \ of the library that talks to the Key Vault service. This dummy library has all\
    \ the same operations as the real library. If there is an internet connection\
    \ issue, I can easily modify the code while on stage to use that dummy library\
