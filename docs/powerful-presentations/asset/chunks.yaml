  raw: '## Gathering Feedback and Improving Your Performance


    My last point about preparing to give a talk is to make sure you get as much feedback
    as you can. Ideally, you will practice the talk in front of family, friends, and
    colleagues. Before you deliver this practice talk, ask everyone to write down
    their honest feedback to give to you. This can be hard with family and friends,
    as their natural inclination might be to tell you that the talk was brilliant
    so that they don’t hurt your feelings. Make sure to stress that honest feedback
    is essential to performing well when you deliver to a larger audience.


    You want people to give feedback on your delivery: Could they hear you? Did the
    presentation make sense? What did they think of the pace?


    If you’re giving the practice speech to colleagues who are subject matter experts
    in your field, ask them to give an honest appraisal of the subject matter. Was
    your information accurate? Was it pitched at the right level, that is, beginner,
    intermediate, or advanced level?


    If people only give you brilliant feedback, then be wary—this type of feedback
    isn’t helpful. If you do get some negative feedback, don’t let it hurt your feelings.
    You want negative feedback at this stage as it gives you something to improve
    before the final talk. Getting feedback can be difficult, but it is essential,
    provided it is constructive. If someone says the talk was rubbish, that doesn’t
    help you. If they say it was rubbish because they couldn’t hear you, or because
    you explain one aspect in a way that was confusing, this is useful feedback, as
    you can fix the problem.


    ## Internet/Wi-Fi Contingency Planning


    Throughout our lives, we’re taught there are two constants in life: death and
    taxes. If you are a public speaker, there is a third constant: bad conference
    Wi-Fi. Reading that may make you smile, but I’m not joking. I have attended a
    substantial number of events all over the world, from small venues to huge conference
    centers, and I always face issues with the Wi-Fi or cellular signal at each event.
    It could be that the speeds are not very good, or the Wi-Fi could drop intermittently.
    If you are not prepared for bad Wi-Fi or internet connectivity, then you can really
    increase your anxiety at the event. Not only will you be nervous about speaking,
    but you also must contend with potential demo failure if your talk relies on an
    internet connection.


    When you are designing your talk, you need to have an internet contingency plan
    in place, even if your talk has no demos that rely on the internet directly. The
    internet is so pervasive that sometimes we forget to think of doing any kind of
    work without it, as it’s always there. Conferences can easily shatter that illusion
    when you have thousands of attendees all trying to connect to the same substandard
    Wi-Fi access points. I fell into this trap earlier in my speaking career, but
    now I make sure I’m prepared.


    Tip


    Always make sure to practice your talk at least once with your internet router
    unplugged or your laptop Wi-Fi disabled to make sure your presentation, demos,
    and contingency plans will still work.


    ### Make All Slide Resources Local


    You may be running your slides from PowerPoint on a laptop, but are all your resources
    also local on your machine? For example, do you show a video that might be streamed
    from YouTube or Vimeo? It’s quite easy to embed a player for a hosted video, and
    when you are rehearsing, the video plays fine. However, when the internet connection
    is struggling, or nonexistent, then you’ll be stuck with no video.


    The easiest solution is to first download any videos or other assets on your computer
    and then embed the link from the local files. Then, when you are rehearsing in
    the weeks before the talk, try practicing with your Wi-Fi disabled. It is an easy
    fix and one that you should embed into your talk preparation.


    ### Guarding Against Demo Failure


    If you are performing any demos, as opposed to just showing slide content, it
    is also a good idea to have a contingency plan in place. This is especially true
    for people doing software development-based talks . The demo might be pulling
    code from an online source code repository or accessing services on a cloud platform.
    Most software these days makes use of an online service, so doing a demo with
    bad Wi-Fi at a conference is a problem.


    I’m not saying you should never attempt a demo that requires an internet connection.
    You may be fine, especially if the organizers can provide a wired LAN connection
    at the lectern, but there are some useful backup measures you can take.


    If the worst does happen, the first backup measure you can use is to have a second
    set of slides for the talk, with all the key points of the demo expressed as screenshots.
    If the demo fails and you can’t fix it, don’t fret over it. Just load up the second
    slide deck and carry on. The audience won’t mind; it is the overall talk they
    are interested in; they will be sympathetic, so try not to worry.


    If you don’t want to use screenshots, you could record the demo as a video using
    software such as Camtasia or ScreenFlow and embed those videos in your second
    slide deck. Then, if you switch to those slides, you can set the video to play
    when the slide comes into view, and you talk over it. I have seen many speakers
    use this technique, and it is highly effective.


    One of my talks, which we looked at the synopsis for earlier in the book, is about
    a cloud computing service called Azure Key Vault, which is part of Microsoft’s
    Azure cloud computing platform. In that talk, I do many software development demos,
    and each of those demos connects to a key vault in the cloud, so an internet connection
    is required. The measure I took to mitigate bad internet connections was to create
    what is called a programming interface, where I make a dummy copy of the library
    that talks to the Key Vault service. This dummy library has all the same operations
    as the real library. If there is an internet connection issue, I can easily modify
    the code while on stage to use that dummy library instead of the real Key Vault.
    That dummy library would return a load of fake data to make it look like the demo
    had run successfully. If I switch to this dummy library, I tell the audience—I
    even make a joke about it. This allows me to get to the end of my talk, leaving
    the audience satisfied.


    I have done this talk around 20 times at conferences, and I have had to use this
    backup measure five times. The first time was in Poland, where the venue had no
    working Wi-Fi at all. Having this measure in place really helped reduce my anxiety
    levels, knowing that I had alternative options to allow me to get to the end of
    the talk. It is worth spending that extra effort to prepare before the event.
    The audience will respect you and be impressed by your preparation and professionalism.'
  trans: "\n# 收集反馈并提升你的演讲表现\n\n关于准备演讲的最后一点，是确保你尽可能多地获得反馈。理想情况下，你应该在家人、朋友和同事面前进行试讲。在开始试讲之前，请每个人都写下他们诚实的反馈意见并交给你。这对家人和朋友来说可能有些困难，因为他们自然会倾向于告诉你演讲很精彩，以免伤害你的感情。务必强调，诚实的反馈对于你在更大的观众面前表现出色至关重要。\n\
    \n你需要大家针对你的演讲表现给出反馈：他们能听清你说话吗？演讲内容是否条理清晰？他们觉得你的节奏怎么样？\n\n如果你是在向同领域的专家同事进行试讲，请他们对你所讲述的主题内容给出诚实的评价。你的信息准确吗？内容难度是否恰当，即适合初学者、中级还是高级水平？\n\
    \n如果大家只给你正面的反馈，那你就要警惕了——这种反馈没有帮助。如果你确实收到了一些负面反馈，不要因此感到沮丧。在这个阶段，你恰恰需要负面反馈，因为它能给你在最终演讲前提供改进的方向。接受反馈可能不容易，但这一点至关重要，前提是这些反馈具有建设性。如果有人说演讲很糟糕，这对你毫无帮助。但如果他们能指出糟糕的原因是听不清你说话，或者你对某个方面的解释让人困惑，这就是有用的反馈了，因为你可以针对这些问题进行改进。\n\
    \n# 互联网/无线网络应急计划\n\n在我们的一生中，我们被教导生活中有两件事是确定的：死亡和纳税。如果你是一位公众演讲者，那么还有第三件确定的事：糟糕的会议无线网络。读到这句你可能会心一笑，但我不是开玩笑。我参加过全球众多活动，从小型场地到大型会议中心，每次都面临无线网络或蜂窝信号的难题。可能是网速不佳，也可能是无线网络会断续掉线。如果你没有为糟糕的无线网络或网络连接做好准备，那么在活动现场，你的焦虑感真的会加剧。你不仅要为演讲本身紧张，如果你的演讲依赖网络连接，你还得应对演示可能失败的状况。\n\
    \n在设计你的演讲时，你需要制定一个网络应急计划，即使你的演讲中没有直接依赖网络的演示。互联网如今已无处不在，以至于有时我们忘记了没有它该如何工作，因为它总是就在那里。当数千名与会者同时试图连接那些本就不堪重负的无线网络接入点时，会议现场很容易就会打破这种错觉。我在演讲生涯早期也曾落入这个陷阱，但现在我确保自己已做好充分准备。\n\
    \n> **提示**\n> \n> 请务必至少在断开互联网路由器或禁用笔记本电脑无线网络的情况下，完整练习一次你的演讲，以确保你的演示文稿、演示内容和应急计划仍然可以正常运作。\n\
    \n## 让所有幻灯片资源都保存在本地\n\n你也许是在笔记本电脑上用 `PowerPoint` 运行幻灯片，但你所有的资源是否也都存储在本地机器上？例如，你展示的视频是否来自\
    \ `YouTube` 或 `Vimeo` 的在线流媒体？嵌入一个托管视频的播放器很容易，排练时视频播放也一切正常。然而，当网络连接不畅或完全不存在时，你就会面临没有视频可播放的窘境。\n\
    \n最简单的解决方案是先将任何视频或其他素材下载到你的电脑上，然后嵌入来自本地文件的链接。之后，在演讲前几周的排练中，尝试在关闭无线网络的情况下进行练习。这是一个很容易的修复方法，你应该将其融入你的演讲准备工作中。\n\
    \n## 防范演示失败\n\n如果你要进行的是现场演示，而不仅仅是展示幻灯片内容，那么制定一个应急计划也是个好主意。这对于进行软件开发类演讲的人尤其如此。演示内容可能需要从在线代码仓库拉取代码，或访问云平台上的服务。如今大多数软件都依赖于在线服务，因此在会议现场因无线网络不佳而进行演示是个问题。\n\
    \n我并不是说你永远不应该尝试需要网络连接的演示。你或许没问题，特别是如果组织者能在讲台上提供有线局域网连接的话，但还是有一些有用的备用措施你可以采取。\n\
    \n如果最坏的情况真的发生了，你可以采取的第一个备用措施是准备第二套演讲幻灯片，将演示的所有关键点都用截图的形式表达出来。如果演示失败且你无法修复，不要为此烦恼。只需加载第二套幻灯片继续下去。观众不会介意；他们感兴趣的是整个演讲；他们会表示理解，所以试着不要焦虑。\n\
    \n如果你不想使用截图，你也可以使用诸如 `Camtasia` 或 `ScreenFlow` 之类的软件将演示过程录制成视频，然后将这些视频嵌入你的第二套幻灯片中。这样，如果你切换到那些幻灯片，你可以设置视频在幻灯片进入视图时自动播放，然后你在一旁讲解。我见过很多演讲者使用这种技巧，效果非常好。\n\
    \n我本人的一个演讲（我们在本书前面看过其内容简介）是关于一个名为 `Azure Key Vault` 的云计算服务，它是微软 Azure 云计算平台的一部分。在那个演讲中，我做了很多软件开发演示，每次演示都需要连接到云端的密钥保管库，因此需要网络连接。为了应对糟糕的网络连接，我采取的措施是创建一个所谓编程接口，即制作一个与密钥保管库服务通信的库的虚拟副本。这个虚拟库拥有与真实库完全相同的所有操作。如果出现网络连接问题，我可以在舞台上轻松修改代码，使用那个虚拟库来代替真正的密钥保管库。这个虚拟库会返回一堆伪造的数据，让演示看起来像是成功运行了。如果我切换到虚拟库，我会告知观众——我甚至还会就此开个玩笑。这让我能够顺利地完成我的演讲，让观众感到满意。\n\
    \n这个演讲我在各种会议上已经做过大约 20 次，其中有五次不得不使用这个备用方案。第一次是在波兰，当时会场完全没有可用的无线网络。有了这个备用方案确实大大减轻了我的焦虑感，因为我知道自己还有备选方案可以让我顺利完成演讲。值得在活动前多花一些精力来准备。观众会尊重你，并对你的准备工作和专业性印象深刻。\n"
- fmt: '### Keep Multiple Copies of Your Files


    If all your presentation files are on your laptop, I recommend that you also keep
    a copy on a `USB` drive, or maybe two drives: one that you keep with you and one
    in your hotel room if you are staying away overnight. I failed to do this once,
    and I got burned by it after I had accidentally deleted some slide decks from
    my laptop sometime before an event.


    I was speaking at an event in Copenhagen. It was a conference with a two-day workshop
    and a single-day conference. At the single-day conference, I was scheduled to
    speak just after lunch, and I was prepared and ready. In the morning, I was hanging
    out at the event, and one of the organizers told me that another speaker had pulled
    out at the last minute, as he was ill. The organizers, with whom I had worked
    with for many years, knew I had a talk on a similar topic and asked if I could
    step in at the last minute. I said yes and then asked what time the talk was.
    The organizer replied, “In ten minutes!”


    I was quickly escorted to the stage, where I set up my laptop to load up the slides.
    However, they weren’t on my laptop in my “Talks” folder. I had somehow deleted
    them, and I’m not sure when or how. My recycle bin on the computer was empty.
    OK, I thought. I’ll load up `Dropbox` as I pay for their top tier and have unlimited
    history to recover the file. I couldn’t connect to `Wi-Fi` at all, and I had no
    phone reception. I quickly grabbed my laptop and went into the foyer to try again,
    but still no `Wi-Fi` or mobile reception. I was starting to panic at this point,
    as people were arriving in the room for the talk.


    All I had on my laptop was an old version of the slides, which were more in note
    form. They didn’t look great, but they had the basic structure of the talk. I
    scanned through very quickly to remove any glaring problems, and that was what
    I had to go with. Thankfully, this was a talk I was familiar with and had delivered
    many times. It was my Hacking Humans talk that I described earlier in the chapter
    on writing synopses.


    Even though the slides looked terrible, the talk went very well. At the beginning,
    I explained why I was there, as they were originally expecting the other speaker
    who was ill. I gave the audience an opportunity to go to a different talk if they
    wished, as this was not the scheduled talk. I would not have been upset if anyone
    had decided to go to another talk. I also explained and made a joke about my slide
    situation and then got on with it.


    Even though I had messed up by not having a copy of the slides on my laptop, I
    managed to get through the talk—to this day, I don’t know how or when I managed
    to delete the slide deck. Now, I always make sure I have copies of my slides on
    a separate `USB` thumb drive as a backup. I learned this the hard way.


    Along with having a backup of your slides, I also recommend having a backup of
    all files needed on that `USB` thumb drive. If for any reason your laptop dies,
    which can happen with the rigors of travel, you may need to use a backup machine
    from the conference company or someone else’s laptop. If you use any custom fonts
    not defaulted in your chosen operating system, put those on the `USB` drive too.
    Make sure you include any videos that need to be played, or any source code files
    needed for demos. Assume everything will go wrong, and you need your backup plan,
    and then be pleasantly surprised when everything goes well. Your anxiety levels
    on the day will thank you for being prepared.


    ## Summary


    In this chapter, we looked at how to make your final preparations to deliver your
    talk. By this point, you will have designed a brilliant synopsis, researched your
    talk content, and designed a killer set of slides. In this chapter, we covered
    your talk preparation, as giving a talk is like giving a performance. While this
    isn’t a Shakespearian performance, you will come across to the audience as a confident
    authority in your subject if you practice and prepare for any eventuality.


    One of the biggest preparations you can make is to practice delivering the talk,
    not only by yourself but in front of a test audience, if you can. If you practice
    the talk in front of a test audience, ask them to think of as many questions as
    you can. Collate these questions and work out the answers. The chances are if
    your test audience had those questions, then a real audience will too. If there
    are common themes in the questions, then consider adding some additional content
    to your talk to cover that subject.'
