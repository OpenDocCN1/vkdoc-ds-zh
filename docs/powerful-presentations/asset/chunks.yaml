  trans: '

    ### 数据密集型演示风格


    如果你计划向观众呈现复杂数据，可能需要采用数据密集型演示风格来建立联系。这种风格通过精心设计的信息顺序，确保所有内容都指向一个核心要点：演示的主旨。


    在此风格中，演示者需专注于制作能支撑结论的幻灯片。例如，若你想论证"吃蔬菜有益健康"，就应使用数据展示以蔬菜为主食的人群的预期寿命。


    当你需要呈现大量事实和数字时，数据密集型演示风格尤为合适。通常在企业或更具科学性的演示中能看到这种风格。


    然而，这并非简单地在屏幕上展示图表。要确保所呈现的信息对观众产生持久影响，你需要让一切易于记忆。可以通过确保信息遵循以下简单规则来实现这一点。


    #### 信息应易于理解


    用统计数据和科学依据支撑观点，是让演示显得专业的最佳方式之一。但如果数据选择和呈现方式欠佳，观众可能无法理解。你需要通过聚焦数据清晰度，确保观众能轻松理解你决定包含的任何内容。


    为此，你需要选择并纳入观众能够领会的数据类型。例如，医生向无医学背景的观众演讲时，应限制医学术语的使用。解释医学概念时还应尝试使用类比。相反，如果医生向其他医疗专业人士解释问题，使用专业术语是可以接受的，因为听众也熟悉这些术语。


    尽管如此，你仍应确保以最简单的方式解释每项数据。这样才能保证所有观众都能理解所呈现的数据，不会有人感到被排斥。


    #### 信息必须遵循特定顺序


    你还应决定呈现数据的最佳顺序。可以从最直观的数据开始，逐步增加复杂度。在讲座中运用此方法的最佳时机是教授新概念时——从简单入手，循序渐进地建立在先前内容之上。


    若呈现历史数据，可以利用时间线——这是展现信息如何随时间发展演变的绝佳方式。用这种方式解释数据能有效吸引观众，因为你可以将数据点随时间的变化以及促成变化所采取的措施编织成故事。


    确保你采用的排列顺序对观众而言同样清晰。在前例中，应明确指出数据按时间顺序排列。这样一来，如果观众了解数据的呈现方式，他们就更容易跟上思路。如果你在未说明解释背景的情况下直接展示历史数据，观众就需要耗费大量脑力来理解所有数据之间的关联。


    数据和信息的呈现顺序至关重要。几乎总是从简单开始，再构建复杂性。这样，即使部分观众处于新手水平，他们也能更好地跟上并理解。如果有人在演讲开始时就跟不上，他们就会走神停止倾听——这绝对是你最不希望看到的。


    #### 避免用数据过度填充演示


    当你明确了信息呈现顺序后，还应确保计划呈现的信息量不会造成认知负担。例如，如果展示 20 张图表，观众可能连其中一张都记不住，更别提全部了。最终他们会经历信息过载，使演示变得缺乏趣味和吸引力。观众记住的将是糟糕的体验，而非你想传达的实际要点。


    呈现数据时有一条黄金法则：少即是多。只向观众展示他们理解你观点所需的最少信息。展示庞大的数据表格会让你失去观众。只需展示足够证明观点、讲述故事的内容即可。


    ### 自由流畅的演示风格


    专业单口喜剧演员是公开演讲和自由流畅演示风格的大师。他们极其擅长保持观众参与度，以至于多数人都不用幻灯片来表演。他们采用对话式演讲风格来逗笑观众。


    这种演讲风格并不仅限于喜剧。许多公共演说家，如政客，在人群前演讲时也会使用自由流畅的风格。大多数政治家发表公开演讲时，仿佛就在与你直接交谈。这种情况下完全不需要幻灯片。只有你、演讲者和你的观众。


    演讲的场合和观众类型是决定是否采用自由流畅风格的重要因素。采用这种风格时，你的演讲会更像对话——就像在酒吧里向朋友讲故事。我发现自由流畅风格更适合非数据密集型或基于故事的演讲，比如励志故事，或关于如何克服问题/障碍的分享。


    如果你要进行数据密集型演讲（如销售数据或研究成果），自由流畅风格可能行不通——观众期待的是硬核事实，而非娱乐故事。


    再比如在喜剧俱乐部，单口喜剧演员的观众希望被娱乐。他们已经说服自己想要享受欢乐时光，并希望通过演员的笑话开怀大笑。如果单口喜剧演员决定用数据密集型风格，用图表和图形来讲笑话，那效果肯定不行。


    如果你不擅长即兴构思正在讲述的故事——即使练习过——自由流畅的演讲风格可能很难驾驭。你没有幻灯片或幻灯片备注作为提示。如果卡壳或忘记接下来要讲什么，除非事先经过大量排练，否则很难补救。而当你有幻灯片辅助时，如果忘词或记不起后续内容，通常可以通过瞥一眼幻灯片备注，或笔记本演示者视图中的下一张幻灯片来救场。


    如果想到要在没有视觉提示的情况下对观众演讲就让你感到恐惧，那我建议你先远离自由流畅风格，直到你对面对大舞台的大规模观众更有经验为止。

    '
- fmt: '### Motivational Presentation Style


    The motivational presentation style appeals to the affective side of the audience.
    It focuses on the call-to-action part of your message. Each element in the presentation
    is meant to encourage your audience to better themselves by following your call
    to action.


    Motivational public speakers are often called hype men—or women—because they specialize
    in boosting the eagerness of the audience to do a specific task. This is easier
    said than done because it takes a certain level of confidence in yourself to pull
    it off. Without self-confidence, the speaker will not be able to motivate anyone.


    Aside from being self-confident, the speaker should also be able to pull off a
    high-energy presentation. A well-executed motivational presentation can make the
    members of the audience feel good afterward—motivated, in fact.


    Motivational speakers often use storytelling to illustrate a point. A motivational
    presentation about success, for instance, may feature stories on how other people
    became successful by showing the struggles they faced and how they overcame those
    struggles to become successful. The stories should not only present examples but
    should also be relatable to the audience. If the audience comes from a working-class
    background, the speaker could choose to use a story about someone who started
    out as an employee struggling at the bottom of a company and succeeded in reaching
    top positions in a company. Everyone loves a good rags-to-riches story.


    Ideally, the protagonist in the story should be someone with distinct similarities
    with the people in the audience, which is why knowing your audience is particularly
    important. The audience might represent the same line of work or industry; they
    could all be teachers, parents, or rocket scientists. It is up to the speaker
    to establish these similarities so that the person in the story is relatable to
    the audience.


    The story aims to establish a particular belief system in the people listening
    to the presentation. In most sales motivational presentations, for example, the
    speaker tries to establish that the audience can succeed in reaching their sales
    numbers. To do this, the speaker will need to make use of multiple motivational
    stories. The speaker will also need to make use of their own high level of energy
    to excite the listeners. This type of presentation is usually designed to gradually
    increase the emotions of the audience throughout the presentation. When the audience’s
    emotions hit their peak, the speaker then introduces the call to action for activities
    in which they want them to participate.


    If you wish to see motivational public speakers in action, look no further than
    the seminars of authors like Tony Robbins, a master of whipping an audience into
    a frenzy over the duration of his talks. You can find his presentations on YouTube.


    ### Instructional Presentations


    Instructional presentations aim to teach the audience, as opposed to being freestyle
    or motivational. You can think of an instructional presentation as a lecture in
    which you are imparting information to teach a subject. Here, the end goal is
    to impart knowledge that the audience does not have prior to the presentation.


    The instructional presentation style is useful when showing how to use a product
    or technology. You shouldn’t confuse this with doing a sales pitch, which isn’t
    the same. Instructional presentations are about teaching.


    I come from a software development background. One of the fields I present on
    is software security, especially in the Microsoft space. On `Azure`, their cloud
    computing platform, there is a service called `Azure Key Vault`. It is a software
    system for storing and manipulating cryptographic encryption keys. Sounds complex,
    doesn’t it? One of my presentations explains what `Key Vault` is, how to set it
    up, and how to use it through a series of six guided examples, with each example
    becoming more complex as the talk goes on. In the space of an hour, the audience
    goes from knowing hardly anything about `Key Vault` to knowing how to set it up
    and how to use it. This is a good example of an instructional presentation style.
    The purpose of that talk isn’t to entertain. I am not trying to tell a fun story.
    I am teaching them how to use a complicated product in what I hope is an engaging
    way.


    In the software development field, most talks at conferences tend to be instructional
    talks—not all of them, as there are also some self-development and motivation
    talks.


    ### Establishing Yourself As an Authority on the Topic


    People tend to respect those who have put many hours into their craft or profession.
    To encourage people to listen to you—especially if you are new to public speaking
    and don’t yet have a following—you will need to establish that you are an authority
    on the topic that you are about to discuss.


    One of the best ways to do this is to begin your presentation with a story of
    you, in which you need to establish why you are standing on stage presenting this
    talk. The story doesn’t need to be long, but if you are presenting at a professional
    conference, for example, you might explain who you work for and your role. You
    could then list a few impressive achievements in your field and ease into the
    topic of your talk, or the problem you are trying to solve. You don’t need to
    spend much time on this story; a minute or two will suffice. You need to say enough
    to prove your credentials and hopefully get the audience to trust you.


    The first talk I ever did in front of an audience was about cryptography and encryption
    using Microsoft’s software development libraries. Because I was an unknown speaker
    at the time, I explained where I worked and my position and then briefly talked
    about a security system I had worked on in financial services. This helped to
    establish my role as an authority. I then noted that my talk would cover what
    I had learned while working on the security system and how to use these complex
    libraries from Microsoft—which at the time didn’t have good documentation. This
    took about a minute. I didn’t go into more detail about myself because the talk
    wasn’t about me; it was about the Microsoft libraries. I simply wanted the audience
    to know why I was qualified to talk about these libraries.


    You don’t always have to be an expert in your field to be a public speaker. You
    may be learning a new skill and want to do a talk about that skill. These types
    of entry-level skill talks can be quite popular. Just because you’re not an expert
    in that field doesn’t mean you can’t talk about the subject. If you pitch the
    synopsis of that talk at a beginner level, you are most likely one or two steps
    ahead of the people in the audience, which is fine. I personally enjoy listening
    to talks pitched at the beginner level, as this is a fantastic way to learn new
    information about a topic you would have otherwise overlooked.


    **Note**: Being an authority in a subject doesn’t mean you have to be an expert.
    An expert may have deep knowledge on a subject, but an authority will be able
    to influence someone with less experience than themselves. You can be both an
    expert and an authority on a subject.


    ## Use an Organizational Tool That You Are Comfortable With


    When planning and preparing the content of your presentation, you will have a
    variety of options for how to organize and research the content. I use the same
    process each time I build a new talk.'
