- fmt: '# The Benefits of Public Speaking


    In this section, I will cover what I believe are the main benefits of becoming
    proficient in public speaking and discuss how these benefits have applied to me.


    ## Critical Thinking


    The first benefit of public speaking is critical thinking. Designing a talk to
    be delivered in front of an audience requires a lot of research and planning.
    In the early stages, you will need to do a great deal of critical thinking on
    many levels to design the talk. For example, if this is a software development
    talk, you need to think about the parts of the programming system you want to
    discuss. How much of that system are you going to cover? If you have 60 minutes
    to talk, realistically, you want to talk for 50 minutes to allow time for questions
    at the end; therefore, you can''t cover everything.


    If you are explaining a topic that can be a little dry and potentially boring,
    consider weaving an interesting scenario or story into the talk to make it more
    interesting. How you pitch this scenario and the complexity of the features you
    discuss is also determined by the skill level of the audience. Is this a talk
    to beginners, who will have little to no knowledge of the subject, or are you
    speaking to people with some skills who want to learn more? On the topic of skill
    levels, consider how you will reshape the presentation if this is an advanced
    talk for professionals who are experts in the field. All these factors need to
    be considered carefully, and this level of critical thinking and weaving complexity,
    story, narration, and subject matter requires a great deal of thought and effort
    up front in the talk construction process.


    Your brain is a muscle, and the level of critical thought required to design an
    engaging talk is a skill. After designing a compelling talk for the first time,
    you will have developed new skills simply by going through the thought and design
    process for the talk.


    I personally find the design and research stage of a talk to be one of my favorite
    parts of the process. I really enjoy the level of thought that goes into the talk
    construction process. As I have progressed through my public-speaking career,
    I have also become better at weaving stories into my talks. Some earlier talks,
    which were software development talks, were purely technical, without much story.
    While I am proud of those talks, they were quite difficult for audience members
    to follow if someone''s concentration lapsed at any point. As I became better
    at designing talks, I started weaving scenarios into them. Sometimes, these would
    be made up of stories, and at other times, they would be based on personal experience.


    As a species, we are hardwired to enjoy stories, so if you can take a challenging
    subject and weave in a narrative, you can help your audience engage with the topic—and
    get them to hang on your every word. The key to reaching that stage is the level
    of critical thinking you put in at the beginning of the process, and this is a
    skill you can develop over time, which not only benefits your talk but can also
    benefit all aspects of your life and career.


    ## Personal Satisfaction


    Some people get their adrenaline rushes by climbing mountains; other people get
    them from running marathons. Public speakers get their adrenaline kicks by putting
    themselves in the vulnerable position of standing on a stage in front of a lot
    of people and confidently talking about a subject—and hoping they don''t get booed
    off the stage. However, in all my years of public speaking, I have never seen
    a speaker booed off a stage, so don''t fret over that one.


    No matter how nervous you are before you start speaking, you will experience a
    massive adrenaline rush once you get started that will carry you through the talk.
    By the time you get to the end and the audience starts clapping, you''ll feel
    amazing and have a great sense of personal satisfaction. If this was your first
    talk, you''ll feel like you''ve climbed that mountain. The audience loved the
    talk and applauded you, and for that moment in time, you conquered the room.


    Every time I speak at a conference or meetup group, no matter the size of the
    audience, I always feel amazing afterward. It''s as if I''m walking on clouds.
    That feeling of satisfaction is addictive, and I absolutely love it. You won''t
    see me bungee jumping off a bridge for kicks, but I will gladly stand in front
    of 1,000 people and talk to them.


    ## Increased Self-Confidence


    It takes a lot of confidence to stand on a stage—the same level of confidence
    it takes to play music on stage or act in a play. If you lack confidence, then
    learning to speak in public can really help you on a personal level. The first
    few times you speak to an audience, you will be terrified—everyone is. But the
    more you do it, the more confident you will become. You will still be nervous
    before each talk. I certainly am, but that''s a good thing. If you are a little
    nervous, then it means you care about the quality of the speech you are about
    to give.


    In my younger years, I lacked self-confidence. I am a classic introvert who likes
    spending time by myself, but I was also quite shy in my earlier career. I hated
    speaking to other people on an individual basis, let alone on stage. As I progressed
    through the ranks in my career, I had to give presentations—it came with the territory.
    These presentations occurred in the organizations where I worked, either to my
    peers or in the boardroom to higher-level executives. At the time, I absolutely
    hated doing these presentations. They made me feel physically sick, but I had
    to do them, as it was part of the job. Over time though, I started getting used
    to doing them; although I was never comfortable doing them, I got used to them.


    Later in my career, I started making online training courses for Pluralsight,
    a company in the United States. When it came to promoting these courses, it was
    recommended that I consider the public-speaking circuit. I was a little apprehensive
    at the time, but I designed my first talk and was invited by a local software
    development meetup group to speak. I figured presenting the talk to a small group
    would be a good idea. I expected around 10 to 15 people to attend, but about 60
    people turned up. To say I was terrified was an understatement. Thankfully, the
    talk went well, and the audience was incredibly supportive, even when I made a
    mistake halfway through the talk. I felt amazing when I finished the talk, and
    I sought out my second speaking gig. Fast forward many years, and I have now spoken
    all over the world at conferences. I no longer fear speaking—sure, I still get
    nervous before a talk, but I can control my fears, and I feel that my levels of
    self-confidence have increased significantly. It has been a fun ride with some
    amazing experiences, for which I am very grateful.'
