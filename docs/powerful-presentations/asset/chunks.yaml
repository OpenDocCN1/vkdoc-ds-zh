  trans: "\n# 排版后内容\n\n在此，我提供了关于本次演讲的大量细节。演讲更像是一场教程，我会向观众展示如何设置 Key Vault，如何使用其软件开发工具包编写软件，以及一些不同的使用模式。当读者阅读完摘要的这一部分时，他们将确切地知道将会听到什么。\n\
    \n这场演讲在会议参与者中一直获得极高的评价，我认为这主要归功于两个因素。首先，我在演讲中涉及了大量细节，非常实用且以演示为主导。其次，摘要非常清晰地说明了演讲内容，因此很少有参与者觉得自己已经知道内容，或者觉得内容太难。我花了很多时间来确保摘要的定位恰到好处。\n\
    \n本次演讲的结束语只有一句话。\n\n> *听完这场演讲，您将掌握立即开始使用 Azure Key Vault 所需的一切知识。*\n\n在此，我再次强调，通过参加这场演讲，您将能够开始使用\
    \ Azure Key Vault。这场演讲是一个实践教程，因此听众可以运用我所讲的内容以及我在演讲中提供的示例代码，并立即开始应用其中原则。\n\n现在，让我们看看最终的摘要。\n\
    \n## 演讲 4：黑掉人类：社会工程学技术及如何防范\n\n这份演讲摘要是所有摘要中最短的，但它也是我最受欢迎的演讲之一。我们已经讨论过这个演讲的标题，主标题“黑掉人类”会引发各种生动的联想。为了证明这不是一场关于斧头杀手的演讲，我使用了副标题来提供额外的背景信息。这场演讲是关于社会工程学技术以及如何防范它们。副标题暗示我们可能要学习一些略带禁忌的内容，并承诺会教我们如何保护自己。\n\
    \n首先，让我们看下完整的摘要。\n\n> *社会工程学是我们组织面临的最大威胁之一，因为攻击者使用操纵手段来胁迫人们泄露公司机密，从而使攻击者能够访问关键系统。*\n\
    \n> *在这次演讲中，我们将探讨社会工程学中使用的某些技术，以及如何防范它们。我们将涵盖诸如借口编造、诱导和肢体语言等操纵手段的主题。*\n\n首先，我们来看一下主要的钩子。\n\
    \n> *社会工程学是我们组织面临的最大威胁之一，因为攻击者使用操纵手段来胁迫人们泄露公司机密，从而使攻击者能够访问关键系统。*\n\n在主要的钩子中，我告诉读者社会工程学是组织面临的最大威胁之一，并且攻击者使用操纵手段来胁迫人们泄露秘密。这个钩子引入了一些冲突，因为社会工程学和操纵是公司的大问题，所以我试图激起他们的兴趣。\n\
    \n> *在这次演讲中，我们将探讨社会工程学中使用的某些技术，以及如何防范它们。我们将涵盖诸如借口编造、诱导和肢体语言等操纵手段的主题。*\n\n当我进入更详细的介绍时，我声明我们将探讨一些使用的技术；也就是说，我将向他们展示如何使用这些技术，以及如何保护自己免受其害。然后我提到了这些技术——借口编造、诱导和肢体语言作为操纵手段。这自然会激起人们的兴趣，因为我谈论的是未经他人同意使用就可能构成犯罪的技术。然而，其理念是，通过了解这些技术，你可以保护自己和你的组织免受其害。\n\
    \n当我与这场演讲的参与者交谈时，大多数人说他们喜欢这种想法，即即将学到一些可能非法但出于好意的东西。我们天生是好奇的生物，所以这相当吸引人。\n\n老实说，尽管这是我最受欢迎的演讲之一，但在我所有的演讲描述中，这一篇是最弱的，因为我本可以更详细地展开。我没有这样做，因为这个摘要显然有效，许多会议都选择了这个演讲，并且它持续获得与会者的极高评价。所以我采取了“如果没坏，就别修”的立场。\n\
    \n## 总结\n\n我花了相当长的时间来讨论如何撰写演讲摘要，因为它与演讲本身同等重要，甚至可能更重要。演讲本身必须精彩。如果你没有想好摘要，会议可能不会选中你的演讲。\n\
    \n摘要有多个用途。如果你是在工作场所向同事做演示，摘要将提供信息，让他们设定预期。例如，如果你是在会议上公开演讲，那么摘要就是一个工具，它能帮助你在竞争中胜出，让你的演讲被选中。会议演讲竞争激烈，因此撰写这份至关重要的文档非常重要。\n\
    \n如果他们选择你在会议上发言，那么你的摘要还有第二个目的，那就是鼓励与会者来听你的演讲。它就像一封给观众的推销信。要谨慎地用准确的信息来定位摘要，以便吸引合适的人来听。不要虚张声势。如果人们带着错误的预期来参加，他们可能会给你的演讲打低分，这会影响你在该会议上再次被选中的可能性。\n\
    \n## 研讨问题\n\n1. 开始思考你演示文稿的摘要。在最终设计演示文稿之前先写好摘要是一个好主意。请包含以下每一项：\n   - **引人注目的演讲标题和副标题**：选择一个能吸引潜在听众的标题。尽量不要让它听起来像点击诱饵链接，但可以尝试一个巧妙的标题，前提是它不会产生误导。对于我之前描述的《黑掉人类》演讲，这是一个引人注目的标题，而副标题则提供了背景信息，*社会工程学技术及如何防范*。\n\
    \   - **初始钩子**：初始钩子会在标题之后吸引读者。会议日程表通常只显示标题和初始钩子，观众需要点击才能阅读更多内容，因此这个初始钩子的影响力可能决定是否有人会来听你的演讲。\n\
    \   - **更多细节**：在这一部分，你可以更详细地介绍你正在解决的问题以及你将如何解决它。此部分旨在传达更详细的信息，以帮助人们决定是否来听你的演讲。但是，不要写太多；它仍然应该保持简洁。\n\
    \   - **结束语**：结束语是一个总结为什么某人应该来听你演讲的机会。\n\n2. 写好摘要后，你应该把它给不同的人看，以获取反馈。一个有用的技巧是写两三份风格不同的摘要文档。然后让人们选出他们最喜欢的，并告诉你为什么选择它而不是其他。摘要与实际演示本身同等重要，因为你将用它来向与会者和会议方推销你的演示想法。\n\
    \n# 4. 准备进行演讲\n\n不要等到最后一刻才准备你的幻灯片。这不仅不专业，还会让你注定失败，因为你将没有机会练习演讲，以了解哪些环节效果好以及你的时间安排如何。如果你尽早规划并设计你的演讲和幻灯片，那么你将有充足的时间来排练演讲并进行必要的修改。\n"
- fmt: '# Getting Started


    When your slides are ready, you should first run through the talk by sitting at
    your computer. This isn’t a full rehearsal as such, but it allows you to walk
    through each slide to make sure that the content is correct and that you are happy
    with the message you are conveying.


    When you are happy with the content, it’s time to start practicing. I recommend
    putting your presentation software—such as `PowerPoint` or `Keynote`—into its
    presenter mode, stand up, and start working through your talk. I also recommend
    setting a timer, as you need to find out how long your talk will take. If, for
    example, you are taking a full 60-minute talk slot at a conference, then you’ll
    want to talk for 50 minutes and leave 10 minutes for questions at the end. By
    timing the talk now, you can see if you are in danger of running over or being
    way under your allocated time. Being under is better than running over, but you
    should try to maximize your full amount of time. If you are speaking at a conference,
    the talks must adhere to a strictly run schedule so that attendees can get their
    next room, and the next speaker has an opportunity to set up.


    If you are new to speaking, you will most likely find your first run-through to
    be incredibly painful, and you will mess up your lines, forget what comes next,
    and do an all-round bad attempt at the talk. Don’t worry, this is normal. Even
    after all the years I’ve been speaking in public, my first few run-throughs of
    the talk are generally terrible, which is why you practice. Imagine creating your
    slides at the last moment before a talk, and the first time you get to run through
    the talk is in front of your audience. By planning ahead, you can get those dodgy
    attempts out of your system in private, and nobody needs to know about them.


    After you have run through the talk two or three times, you will start getting
    the hang of the material and feeling a little more confident about how to deliver
    the talk. If you need a few more rehearsals like this, that’s fine. Practice as
    much as you need.


    I don’t recommend trying to do more than two run-throughs in one sitting, as you
    can start suffering from mental fatigue. Perform your initial practice runs over
    the space of a week. Take all the time you need.


    At this point, you should start feeling more confident. I next recommend recording
    your talk. You can balance your phone on a bookcase and simply record yourself
    with the phone’s internal camera and mic. The quality doesn’t need to be great;
    you just need to be able to hear your voice. If you have any screen-recording
    software, such as `Camtasia` or `ScreenFlow`, then you could record the slides
    from your computer and your voice through a microphone—this is what I do. The
    aim of recording yourself this way is so that you can watch/listen to it and critically
    assess your talk. No one else needs to see this video; you can delete it when
    you are finished. Creating a video like this is a great tool because it allows
    you to see how the presentation sounds from your audience’s perspective. I don’t
    recommend recording the video and then watching it back right away. Give it a
    few days, and then rewatch it with fresh eyes.


    When you have rewatched your video, you may want to rehearse some more and then
    film the talk again. The number of times you do this depends on your confidence
    level. You can practice like this as many times are you find necessary. Each time
    you practice, you will get better at remembering your material and delivering
    it confidently.


    When you are confident in your delivery of the talk, the final stage is to practice
    in front of other people. This could be family members, friends, or colleagues
    at the office. You could even arrange a lunch-and-learn event at work and invite
    your peers to the talk. This will be a full dry run of the talk in front of a
    real audience. As terrifying as it sounds, it’s a good idea to practice like this
    in front of a group of people before you go in front of a potentially much larger
    audience at a conference—especially if speaking at conferences or to meetup groups
    is your goal.


    # Physical Delivery: Gestures and Facial Expressions


    At a conference, you will usually have access to a small table or lectern where
    your laptop will sit, and you will have a bottle of water—always take a bottle
    with you in case the event doesn’t provide one. Try to recreate this setup when
    you practice at home. What you want to avoid is using the lectern like a shield
    that you hide behind. This is common for new speakers. Try stepping away from
    the laptop and walking around the stage area or the room in which you are practicing.
    This will be easier to do if you are using a Bluetooth slide clicker so that you
    can progress to the next slide without touching your laptop.


    Many conferences set up a screen on the stage that displays what you see on your
    laptop. Having a screen like this is great, as it means that while you are walking
    around the stage, you can still see your presenter view notes and, more crucially,
    see what the next slide is going to be. One thing to be aware of, though, is that
    many conferences film their talks. If someone is operating the camera during your
    talk, they will follow you around as you walk and talk. Some conferences use a
    fixed camera pointing at the lectern, so you won’t be able to walk around as much.
    You should try to find out the filming situation before the start of the conference
    or talk to the audio/visual engineer prior to your talk, and they will tell you
    if there is room to walk around.


    Another important consideration when practicing your talk is what to do with your
    arms, hands, and face. If you stand on the stage bolt upright, with your arms
    by your side and a neutral look on your face while speaking, the audience will
    soon get bored with your talk and disengage from the content. Make sure to use
    your arms and hands to add emphasis to what you’re saying. You don’t want to go
    over the top and start waving your arms around like an octopus, but subtle movements
    in sync with your vocal delivery can add a real impact.


    When trying to learn how much movement is appropriate, I recommend reviewing presentation
    videos on YouTube and observing what other speakers do. Try to watch both good
    talks and not-so-good talks with the aim of learning from them. You can identify
    an ineffective talk by the number of downvotes they have compared to upvotes.
    I like watching TED talks, as they are usually splendid examples of talk delivery,
    and you can learn as much from how the talk is delivered as what the speaker says.


    Your facial expressions are also a key factor, especially as people will be looking
    at your face—even more so if the talk is filmed and you are being displayed on
    a large screen. Remember to smile at the start of your talk. Delivering a talk
    at an event is an honor, and you should come across as excited and enthusiastic
    that you have the privilege of speaking to people who have chosen to spend their
    time listening to you.


    If you stand there and look terrified, the audience will probably feel a little
    sorry for you; more importantly, they may lose confidence in the talk, more so
    if they have paid a lot of money to be at the event. If you are at a free user
    group meeting, then the audience tends to be much more forgiving.


    If your talk’s message is uplifting and happy, smile and look happy. Your facial
    expression should mirror the intensity of the message you are delivering. If you
    are giving a serious or sad message, then look neutral or sad. You wouldn’t talk
    about someone diagnosed with a serious life-threatening illness with a smile on
    your face—well, I hope you wouldn’t—so try to practice facial expressions that
    suit the subject matter. Don’t overdo it, though. You are aiming for subtle nuance,
    not proving you can replicate Jim Carrey’s elastic facial expressions.'
