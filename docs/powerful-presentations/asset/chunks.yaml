    into the talk, and everyone likes a good story.


    Now, we hopefully have readers fully hooked. They know the theme of the talk and
    the introduction to my own personal story. Now let’s give them some more granular
    details.


    > *In this talk, I share my story of personal distraction, low motivation, and
    increased project anxiety. I also share how I broke this cycle and got my creative
    and productive mojo back.*


    > *This talk is aimed at anyone who strives to be more productive but struggles
    with distractions daily. I cover the following subjects:*


    *   > *Distraction and procrastination*


    *   > *Finding meaning in your work*


    *   > *Self-motivation*


    *   > *Locus of control*


    *   > *Productivity and time management*


    *   > *Social media addiction*


    If the reader didn’t pick up on the fact that I was going to be talking about
    my personal experiences, I make it obvious by telling them that this talk is about
    my story of distraction, low motivation, and project anxiety. I state that I am
    going to talk about how I broke this cycle. I am not telling my story for the
    sake of it; there is a purpose in talking about how I overcame a problem.


    I then mention who the talk is aimed at; in this case, people who want to be more
    productive and reduce distractions, which is probably everybody. I then list the
    main topics from the talk as a bullet-point list. This means there will be no
    ambiguity over what I am going to cover, as I state it outright. In fact, that
    bullet-point list ended up becoming the main section headings for the talk. Nobody
    could say that they didn’t know what the talk was going to cover, as I am quite
    direct.


    Some people might say that going to that level of detail is giving away what’s
    in the talk, but I disagree. They know the main subjects, but not all the nuanced
    content. This talk is one-hour long, and I speak, on average, for 55 minutes.
    There’s a lot in there.


    Finally, we move on to the closing statement.


    > *I now consider myself very productive, but getting there was a battle. Let
    me share my story so that I can help you become productive and confident too.*


    My closing statement is only two sentences, but they are specific. I first state
    that I now consider myself productive. In other words, I solved the problem, but
    it was hard. This signals to the reader that this is a battle that can be won.
    I then finish by saying that I will be sharing my story—just in case that wasn’t
    obvious already—and that I am going to help you become productive and confident.
    In other words, I am not only going to tell you a story, but I am also going to
    give you a solution.


    Of all the talks I have written, this is my personal favorite. That is why I talked
    about it first. When I give this presentation, attendees come to talk with me
    after the event or contact me privately to tell me how much they liked the talk
    and how it helped them, which is incredibly humbling. Much work went into writing
    the talk, and a lot of effort went into trying to craft the perfect—in my eyes—synopsis.
    I didn’t write this synopsis on a single attempt; it took a few revisions.


    The next talk I want to cover is completely different in that it is aimed at an
    extremely specific technical audience.'
