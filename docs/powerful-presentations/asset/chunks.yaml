  trans: '

    # 公共演讲的益处


    在本节中，我将阐述我认为精通公共演讲所能带来的主要益处，并讨论这些益处如何在我身上得到体现。


    ## 批判性思维


    公共演讲的首个益处是培养批判性思维。设计一场面向听众的演讲需要大量的研究和规划。在早期阶段，你需要在多个层面进行大量的批判性思考来构思演讲。例如，如果这是一场软件开发类的演讲，你需要思考想讨论编程系统中的哪些部分。你要涵盖该系统的多少内容？如果你有
    60 分钟的演讲时间，实际上，你应当讲 50 分钟，以便在最后留出问答时间；因此，你无法面面俱到。


    如果你要解释一个可能略显枯燥乏味的话题，不妨考虑在演讲中穿插一个有趣的场景或故事，使其更具吸引力。你如何呈现这个场景以及所讨论特性的复杂程度，还取决于听众的技能水平。这是一场面向对该主题几乎一无所知的新手的演讲，还是面向那些具备一定技能并希望深入学习的人？关于技能水平，如果这是一场面向该领域专家型专业人士的高级演讲，你要考虑如何调整演讲内容。所有这些因素都需要仔细考量，这种程度的批判性思维，以及对复杂性、故事、叙述和主题的巧妙编织，需要在演讲构建过程的初期投入大量的思考和精力。


    你的大脑就像一块肌肉，而设计一场引人入胜的演讲所需的批判性思维水平是一种技能。在首次完成一场引人入胜的演讲设计后，仅通过经历演讲的构思和设计过程，你就能发展出新的技能。


    我个人认为，演讲的设计和研究阶段是我在整个过程中最喜欢的环节之一。我非常享受演讲构建过程所需的思考深度。随着我在公共演讲生涯中的不断进步，我在演讲中穿插故事的能力也日益增强。早期的一些演讲，比如软件开发类的演讲，纯粹是技术性的，没有太多故事。虽然我为那些演讲感到自豪，但听众一旦注意力稍有分散，就很难跟上。随着我设计演讲水平的提升，我开始在演讲中融入场景。有时，这些场景是虚构的故事；另一些时候，则是基于个人经历。


    作为人类，我们天生就喜欢听故事，所以如果你能驾驭一个具有挑战性的主题，并融入叙事，就能帮助听众投入到话题中，让他们全神贯注地听你讲的每一个字。达到这一阶段的关键在于你在演讲过程初期投入的批判性思考水平，而且这是一项可以随着时间推移而培养的技能，它不仅有益于你的演讲，还能让你生活和事业的方方面面都从中受益。


    ## 个人满足感


    有些人通过登山来获得肾上腺素飙升的快感；另一些人则通过跑马拉松来体会。而公共演讲者则是通过将自己置于一种脆弱的境地——站在众人面前的舞台上，自信地谈论一个话题，并希望自己不会被嘘下台——来获得这种兴奋感。不过，在我多年的公共演讲生涯中，我从未见过有演讲者被嘘下台，所以不必为此担心。


    无论你在开始演讲前有多紧张，一旦你开口，就会感受到一股巨大的肾上腺素冲击，这股力量将支撑你完成整场演讲。当你抵达终点，听众开始鼓掌时，你会感觉棒极了，并拥有巨大的个人满足感。如果这是你的第一次演讲，你会感觉就像刚刚征服了一座高山。听众喜欢你的演讲，为你鼓掌，那一刻，你征服了整个房间。


    每当我无论是在大会还是小组聚会上演讲，无论听众规模大小，之后的感觉都无比美妙。就像漫步云端。这种满足感令人上瘾，我绝对热爱它。你不会看到我为了寻求刺激而从桥上蹦极，但我很乐意站在一千人面前与他们交谈。


    ## 增强自信心


    站在舞台上需要很大的自信——这与在舞台上演奏音乐或表演戏剧所需的自信程度相同。如果你缺乏自信，那么学习公共演讲真的能在个人层面帮助你。最初几次面对听众演讲时，你会感到恐惧——每个人都是如此。但你做得越多，就会变得越自信。每次演讲前你仍然会紧张。我当然也会紧张，但这是好事。如果你有点紧张，说明你关心你即将发表的演讲的质量。


    在我年轻的时候，我缺乏自信。我是一个典型的内向者，喜欢独处，但在早期的职业生涯中，我也相当害羞。我讨厌与别人单独交谈，更不用说站在舞台上了。随着我在职业生涯中不断晋升，我不得不进行演示——这是工作的一部分。这些演示发生在我工作的组织内部，有时面对同事，有时在董事会上面对高层管理者。当时，我绝对讨厌做这些演示。它们让我感到生理上的不适，但我必须做，因为这是工作的一部分。不过，随着时间的推移，我开始习惯了；虽然我从未对此感到自在，但我渐渐适应了。


    在我职业生涯的后期，我开始为美国一家名为 Pluralsight 的公司制作在线培训课程。在推广这些课程时，有人建议我考虑走上公共演讲的舞台。当时我有点忐忑，但我设计了我的第一场演讲，并受到当地一个软件开发聚会的邀请。我想，向一个小团体演讲应该是个不错的主意。我预计会有
    10 到 15 人参加，但最后来了大约 60 人。说“我被吓坏了”都算轻描淡写。谢天谢地，演讲进行得很顺利，听众也给予了极大的支持，甚至在我中途讲错时也是如此。演讲结束后，我感觉棒极了，并立刻开始寻找我的第二次演讲机会。多年后的今天，我已经在世界各地的大会上发表过演讲。我不再害怕演讲——当然，我在演讲前仍然会紧张，但我能控制自己的恐惧，而且我感觉自己的自信心水平显著提升了。这是一段充满奇妙经历的愉快旅程，对此我深怀感激。

    '
- fmt: '### Improving Communication Skills


    Public speaking is all about effective communication. You are standing on stage
    and communicating an idea to people in the audience who have come to learn from
    you. Communicating so that people will listen and understand you is a critical
    skill to develop in a career, and public speaking is a fantastic way to practice
    this skill. Core personal skills like this are also very desirable to employers,
    as they want effective communicators on their staff.


    If you ever get the opportunity to speak at international events, you will also
    master speaking to audiences whose first language isn’t English. I was a little
    apprehensive when I first did this because I was worried that people would struggle
    with my British accent, but I needn’t have worried. Provided you talk at a slower
    pace—not so slow that you sound strange but slower and clearer than a conversation
    with a friend—you will have no issues.


    As a British person, I am always in awe of people from other countries who can
    speak in their native language and are fluent in English. I can’t speak another
    language except some very bad French, so I always appreciate the efforts of other
    people from different countries.


    Effective communication is a crucial skill for life and business, so becoming
    an experienced public speaker will pay you back repeatedly in your career and
    can even help give you a competitive advantage over other applicants for positions
    if you can demonstrate excellent communication skills.


    ### Networking and New Connections


    One of the biggest benefits of public speaking is networking and the people you
    meet along the way. The reason you get up on stage to speak is to pass on knowledge
    and ideas to others; therefore, public speaking is all about people. When you
    have delivered your talk and are at the venue, your audience will want to talk
    to you and hang out. This is all part of the public speaking package—meeting people.


    Meeting people in these avenues has many benefits. First, as social creatures,
    it’s nice to meet people with similar interests with whom you can have discussions.
    I have spoken to many conference attendees who have become good friends. Sometimes,
    after delivering a talk, someone will share an alternative view that differs from
    your presentation. This is a good thing, as it expands your horizons as a speaker
    to hear alternative viewpoints, which could make it into future versions of your
    talk if they are just as valid as the views you initially expressed.


    Another potential benefit of networking at an event after delivering a successful
    talk is being offered work engagements. I have had this happen several times after
    I have spoken at a conference, hung out with the attendees, and, in some cases,
    swapped contact details. Then, a few weeks or months after the event, I have been
    contacted about training or consulting opportunities. This doesn’t happen all
    the time, but it can be a great extra source of income when it does, especially
    if you work for yourself.


    I urge you to always mix with attendees; don’t simply do the talk and then run
    off to your hotel room and hide. People have taken the time out of their day and
    busy conference schedule to listen to your presentation specifically, so always
    try to talk with people and answer questions after the talk. People may not approach
    you straight away, but if you attend a social event hosted by the conference or
    event, people may chat with you over a drink. If you can, always be available
    for them.


    ### Travel


    Another benefit of public speaking is that you might get to travel around your
    country or even the world to deliver presentations, which is fantastic if you
    like to visit new places. When I started speaking, I delivered my first few talks
    to local meetup groups in the cities nearest me—in my case, Derby and Nottingham
    in the UK. I gradually started to expand from near my home to places like Hereford,
    Leeds, and London. I really enjoyed travelling around the country to give these
    talks, as it allowed for a day or two to travel to other cities, stay over in
    a hotel, and explore a little before getting the train back home.


    Over time, I earned invitations to larger conferences that allowed me to travel
    around the world to places such as Norway, Belgium, Denmark, Sweden, Poland, Germany,
    Holland, America, and Australia. I had never visited any of these countries before,
    so being accepted into these conferences broadened my travel horizons.


    Another great benefit of speaking on the conference circuit is that larger conferences
    tend to cover your airfare and a few nights in a hotel. I normally extended my
    trip by a few days—at my own expense—to do a little sightseeing.


    ### Persuasion Skills and Driving Change


    When you break down your process for conveying information to a group of people,
    what exactly are you doing? Teaching, most certainly. Entertaining, possibly.
    But you are also persuading people to agree with a point you are making, or at
    least trying to inform them of another viewpoint.


    Persuading people requires you to speak with confidence, have well-researched
    information and viewpoints, and come across as an authority. These are all skills
    that you can develop as a public speaker, and they will also benefit your career.
    Effective communication and persuasion will take you far in a career, and if you
    can do it onstage with several hundred people in front of you, you can do it in
    the office.


    ### Performance Skills


    When you are in front of an audience relaying information, you want them to be
    entertained, engaged—and most importantly—awake. To achieve this, you need to
    put on a good performance. Public speaking is as much about performance as it
    is about passing on information. I have attended many talks in my career. Some
    had fascinating subjects but were delivered in a dry and boring way, which made
    them extremely hard for me to watch and maintain my interest. I have also seen
    other talks on subjects that I don’t really have any interest in, which have been
    excellent: well, delivered, engaging, and captivating.


    The more talks you complete and the more you focus on delivery, the better you
    will become at performing. I’m not talking about doing a dance or bursting into
    song, I’m talking about getting people to listen to what you have to say, which
    is just as important as holding a tune for a singer.


    The audience doesn’t want to see you hugging the lectern and trying to hide behind
    your laptop. I suggest using a slide clicker so you can get away from the computer
    keyboard and walk around the stage a little. Make sure to emphasize what you’re
    saying with hand and arm gestures and focus on making your voice sound animated
    and excited. You don’t have to go over the top, but by focusing on these details
    in your delivery, you will drastically improve your performance skills.'
  raw: '### Improving Communication Skills


    Public speaking is all about effective communication. You are standing on stage
    and communicating an idea to people in the audience who have come to learn from
    you. Communicating so that people will listen and understand you is a critical
    skill to develop in a career, and public speaking is a fantastic way to practice
    this skill. Core personal skills like this are also very desirable to employers,
    as they want effective communicators on their staff.


    If you ever get the opportunity to speak at international events, you will also
    master speaking to audiences whose first language isn’t English. I was a little
    apprehensive when I first did this because I was worried that people would struggle
    with my British accent, but I needn’t have worried. Provided you talk at a slower
    pace—not so slow that you sound strange but slower and clearer than a conversation
    with a friend—you will have no issues.


    As a British person, I am always in awe of people from other countries who can
    speak in their native language and are fluent in English. I can’t speak another
    language except some very bad French, so I always appreciate the efforts of other
    people from different countries.


    Effective communication is a crucial skill for life and business, so becoming
    an experienced public speaker will pay you back repeatedly in your career and
    can even help give you a competitive advantage over other applicants for positions
    if you can demonstrate excellent communication skills.


    ### Networking and New Connections


    One of the biggest benefits of public speaking is networking and the people you
    meet along the way. The reason you get up on stage to speak is to pass on knowledge
    and ideas to others; therefore, public speaking is all about people. When you
    have delivered your talk and are at the venue, your audience will want to talk
    to you and hang out. This is all part of the public speaking package—meeting people.


    Meeting people in these avenues has many benefits. First, as social creatures,
    it’s nice to meet people with similar interests with whom you can have discussions.
    I have spoken to many conference attendees who have become good friends. Sometimes,
    after delivering a talk, someone will share an alternative view that differs from
    your presentation. This is a good thing, as it expands your horizons as a speaker
    to hear alternative viewpoints, which could make it into future versions of your
    talk if they are just as valid as the views you initially expressed.


    Another potential benefit of networking at an event after delivering a successful
    talk is being offered work engagements. I have had this happen several times after
    I have spoken at a conference, hung out with the attendees, and, in some cases,
    swapped contact details. Then, a few weeks or months after the event, I have been
    contacted about training or consulting opportunities. This doesn’t happen all
    the time, but it can be a great extra source of income when it does, especially
    if you work for yourself.


    I urge you to always mix with attendees; don’t simply do the talk and then run
    off to your hotel room and hide. People have taken the time out of their day and
    busy conference schedule to listen to your presentation specifically, so always
    try to talk with people and answer questions after the talk. People may not approach
    you straight away, but if you attend a social event hosted by the conference or
    event, people may chat with you over a drink. If you can, always be available
