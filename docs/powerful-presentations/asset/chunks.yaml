    fretting about the presentation. The more talks that you deliver and the more
    experienced you get, the better you become at managing and controlling your nerves.
    Even with all my experience, I still get nervous, and a walk before the talk usually
    helps. Make sure you don’t go too far from the venue and keep an eye on the time.
    Typically, you will have to be in your presentation room at least 15 minutes before
    the start of the advertised talk time to set up. Don’t walk so far from the venue
    that you will need to rush to get back on time, as this will just make you more
    stressed.


    When you’re setting up on stage, there will be some time while you’re waiting
    for your audience to come into the room and take their places. I find that it
    makes me even more nervous, waiting for people to come in while I am standing
    there, looking around, and knowing full well that people will be staring up at
    me. If you are doing your talk at a smaller and more intimate event where there
    are fewer than 30 people in the room, you could quite easily mix with the audience
    and talk to people, as you would in any other social situation. I like to do this
    whenever I can, and it serves as a good icebreaker to get to know your audience,
    but this does get harder to do as the audience gets larger.


    If you are speaking at a larger event where you could have over one hundred people,
    or possibly over five hundred to a thousand people, then interacting and mingling
    is harder to do. You will be in a large auditorium that is quite noisy as people
    are coming in and sitting down. I don’t like standing on stage, waiting to start
    the talk in rooms like this. The wait to get started can feel like an eternity,
    even if it is only ten minutes. Once the audio technician has set up my microphone
    and my laptop is set up correctly, I leave the title slide showing on the projector.
    Then I turn off my microphone pack and sit in the first row and wait there. By
    doing this, you are out of the gaze of the audience, and you can relax for a few
    minutes. You may even feel that a little bathroom break is a good idea, although
    try to get this done before you set up. If you do need to nip off the bathroom
    quickly, make sure you turn off your mic pack. I have unfortunately heard this
    trip up one speaker before, where their mic was not muted on the mixing desk.


    One last piece of advice that I want to give you is not to be tempted to go to
    the bar for a small drink to calm your nerves. I can’t stress this enough; never
    get up on stage after having a drink or two. If your mind is too relaxed, you
    could easily make a mistake or say something that you later regret. If you have
    more than a few drinks and end up on stage inebriated, then you will slur your
    words. Being drunk on stage is a great way to ruin your reputation and end your
    speaking career before it even gets started.


    ### Use Square Breathing to Manage Anxiety


    There is an easy breathing technique you can perform before taking the stage to
    help calm your anxiety, improve your mental alertness, and help you concentrate.
    It’s called square breathing—also known as box breathing. It is a technique used
    by elite military groups, such as Navy SEALS, to stay alert and calm when in stressful
    combat situations. It is a very simple technique, and you can do it anywhere,
    not just before a talk. You could use it before a job interview or before acting
    on stage—literally anywhere. It’s just four simple steps:


    1.  Breath in for four seconds so that air fills your lungs.


    2.  Hold your breath for four seconds.


    3.  Slowly exhale your breath for eight seconds.


    4.  Without taking a break, go straight back to the first step and fill your lungs
    again.


    Repeat this process three or four times in a row. I perform this breathing exercise
    all the time, and it is a wonderful way to calm down. If it works for elite military
    groups, then it will help you settle your nerves before heading onto stage.'
