  trans: '

    # 应能吸引观众


    演示本身应具有吸引听众的魅力。使用出色的幻灯片是提升吸引力的方式之一。你可以融入讲故事、说笑话、肢体语言和直接与观众互动等演讲技巧，让演讲妙趣横生且引人入胜。


    我始终认为，最令我享受的演讲都围绕着讲故事展开。故事可以是真实经历，也可以是虚构的，用以传达演讲的核心信息。人类天生就爱听故事，因此，如果你要讲一个略显枯燥的主题，编织一个叙事框架会极大地增强吸引力。


    最具吸引力的演讲，是那些让观众专注于台上的你的演讲。即使你借助幻灯片传递信息，也不希望观众只盯着屏幕，因为这会分散他们对你说内容的注意力。我们稍后会详细讨论幻灯片与演讲设计，但请记住，不要在幻灯片中堆砌大量文字，以免观众只顾着阅读而忽略你的讲述。


    ## 应结构清晰


    一场优秀的演讲会采用逻辑清晰的信息排列方式。如果你所呈现的信息缺乏逻辑顺序，听众将很难记住你的内容。人们通常会将结构混乱与准备不足联系起来。


    就像好故事一样，你的演讲应有开头、发展和结尾——这也就是所谓的“三段式结构”。开头部分，你要说明即将涵盖的内容，包括引入试图解决的问题。发展部分，你要呈现关于解决问题或演讲主题的核心内容，并开始提出解决方案。结尾部分，则要给出问题的最终答案或你想传达的核心观点，并在结束前总结你在演讲中提到的关键要点。


    遵循这样一个简单的结构，你就更容易满足观众的期待，他们也能自然而然地预判你演讲的走向。


    ## 演讲创作流程


    要成为公众演讲大师，你首先需要掌握演讲的准备流程。最终你会形成自己的一套构建演讲的方法，但在此过程中，你可以参考本节中的步骤。


    ### 在会议前很久就准备好讲稿和幻灯片


    在准备第一次演讲时，你可能会忍不住拖延到最后一刻才开始动手。但如果你想成为一名成功的公众演讲者，这种习惯是行不通的。当人们参加活动——甚至是付费参加的会议时，他们期望演讲者专业且准备充分。他们希望每场演讲都尽可能完美无缺。而完美的演讲，只有通过多次事先演练和修改才能实现。


    遗憾的是，我参加过许多会议，看到过演讲者在我于后台候场区进行最终走台时，还在疯狂地修改他们的幻灯片。这种最后一刻的修改显得很不专业，通常导致演讲显得仓促。对于缺乏经验的演讲者，你总能从他们频繁忘记下一张幻灯片内容的情况中，判断出他们是临时抱佛脚完成的演讲。这会带来几次尴尬的沉默，打断演讲的流畅性。


    理想情况下，如果是一场全新的演讲，你应该在会议开始前几个月就准备好幻灯片。你还需要练习使用幻灯片，确保自己熟悉演讲的流程。请你的家人、朋友或同事试听你的演讲，以获取他们的反馈。如果无法实现，你也可以在练习时给自己录音。回听录音能让你以第三方的视角审视自己的演讲。这是了解观众听感的好方法。最好尽早完成这一切，远远早于会议日期，这样你可以反复聆听，对自己的表现做出客观评判并进行修正。


    你还应当将自己的幻灯片与过去看过的优秀演讲进行对比。在 YouTube 上研究精彩的演讲，分析演讲者的幻灯片。找出你喜欢的特质，比如配色方案、字体类型与风格，以及所使用的媒体类型。


    然后，你可以将他人的优点应用到自己的演讲中。通过提前准备，你就能避免将所有工作堆积到最终演讲前的一周。你也会有足够的时间来全面评估你的幻灯片和演讲，并在必要时做出调整。


    通过提前准备幻灯片并反复练习，你就能在此之前尝试找到最高效的演讲方法。等到活动当天，你早已演练过无数次，即使没有提示也能自信完成。'
- fmt: '### Establishing the Presentation Subject or Problem


    You should devote the beginning of your presentation to establishing the problem
    with your audience; this will ensure that you are all on the same page.


    The challenge for you when presenting the problem will be to make people care
    and to establish yourself as an authority. If you have a choice about the presentation,
    pick one in which you have a great deal of experience. In most cases, the talk
    will be centered on a topic related to your job or personal interests.


    It is a good idea to present any evidence for the problem being discussed at the
    beginning of the presentation, as well as any information that will make the audience
    care more about the subject. An issue that may seem important to you may not be
    as important to the audience, so you want to paint a picture—potentially through
    a story—that will make the audience care. Ideally, you want the audience to feel
    empathy for you when presenting the problem. If you can get them to see the problem
    through your eyes so that they imagine themselves in your shoes, then you will
    keep them engaged throughout the entirety of the presentation.


    An efficient way to establish the problem in the audience’s minds is to present
    numbers and facts about the issue. When giving a software security presentation
    to business owners, for example, you could begin by discussing the statistics
    of the number of businesses victimized by hacking and data breaches. You could
    also consider specific cases of business owners whose identities have been stolen
    and leaked online. You could even add the financial damage that these security
    breaches caused to the victim, as financial consequences are always a great way
    to ensure that the audience is engaged. If the audience members are business owners,
    they are more likely to listen to the talk that follows because they can relate
    to the problem presented.


    When choosing a problem to tackle in your presentation, you should have your target
    audience in mind by creating a persona that represents your target audience. Think
    about the typical characteristics of the people in the audience. Do they belong
    to the same line of work? Do they have common interests or hobbies? If so, what
    common problems do they encounter with their hobbies or their jobs? What do they
    want to hear from you in relation to your expertise?


    By creating a persona that fits the mold of the general audience, you will be
    able to anticipate the needs of your audience, and you can then choose a topic
    and problem to discuss accordingly. You could also design your slides according
    to their needs.


    For example, I have delivered a talk about Agile software development at conferences
    in the past. The typical persona for people who might want to listen to this talk
    is that of software developers, who are very technical people. When delivering
    a talk to these people, they expect a lot of detail and concrete facts, backed
    up by examples that show the principles in use.


    I also delivered the same talk at an event where the audience members were software
    company managers and members of their leadership teams. The persona for this talk
    is different; they expect different results for the talk. Even though 70% of the
    talk I delivered to the managers was the same as the talk I delivered to the software
    developers, I had to adjust the talk to suit the audience. In that group—mostly
    nontechnical professionals—I had to remove some content focused more on software
    development and adapt the talk to be more general and suitable for the audience.
    My core message about the benefits of software teams using Agile software development
    techniques was the same, but they didn’t need a lot of the lower-level technical
    detail that my software development audience expected.


    ### Creating the Goal of Your Presentation


    Every time you present content to an audience, you want your presentation to lead
    to something; the presentation needs an end goal. Most presentations fail in this
    aspect. After listening to presentations that lack a goal, the audience isn’t
    motivated to make changes in their behavior. The presentation was unable to encourage
    the audience to do something about the problem.


    I have sat through many talks in which the speakers presented a lot of interesting
    information, but then they suddenly said, “Thanks for listening,” and the talk
    was over. In these instances, the audience received no payoff or satisfying end
    goal.


    The goal of your talk is important because it creates a sense of obligation in
    the audience. It’s just like saying “I’ve done my part in creating content and
    presenting the information. Now it is your turn to apply what you’ve learned so
    far.”


    When you have established the goal of your presentation, it’s time to create a
    call to action, which is a message that explicitly tells your audience how they
    can use the information after the talk. Ideally, the call to action should be
    short and straight to the point. The call to action should also ideally benefit
    members of the audience. In other words, by following what you have presented,
    the audience’s lives, careers, etc., should be enriched. Your talk doesn’t need
    to be life changing, but it would be impressive to deliver a talk with life-changing
    consequences. Instead, the audience should be able to get some benefit from your
    content as opposed to it simply being an information dump.


    The call to action also provides an excellent opportunity for you to establish
    a community around your subject area. You could tell the audience that you created
    a post on your website about the presentation you just gave. Then, if they wish
    to follow through with your call to action, they can go to your website after
    the talk to learn more. By using techniques like this, you will encourage people
    to visit your website and review all the content you have available. If you have
    an email capturing tool set up, they may choose to subscribe to your website content.
    This technique is also useful for people who have consultancies. The information
    you put on your website will further establish your authority in the industry.
    If you have a business built around the content, you can significantly improve
    your revenue using this technique.


    **Note**


    Understanding your overall goal is crucial to writing and presenting an effective
    presentation. Without it, your presentation will wander aimlessly from subject
    to subject with no overall payoff.'
