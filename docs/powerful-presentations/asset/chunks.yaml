  trans: '

    ### 研究


    我们在本书前面提到过研究，但我想在此更详细地探讨，因为它是演示文稿制作过程中至关重要的一环。经过充分研究的演讲总是比仓促拼凑的演讲更受听众欢迎。你不需要成为某个领域的专家才能谈论它，但你确实需要成为一名优秀的研究者。


    如今，借助互联网，研究变得异常简单；你只需要一个浏览器和一个搜索引擎。然而，你也要避免陷入只搜索那些证实自己观点或信念的信息的陷阱。这被称为**确认偏误**，它可能导致极其片面的演讲。即使你对某个特定主题有强烈的看法，并且知道存在不同观点，我也建议你研究这些不同观点，并将其纳入你的演讲中。你可以表示不同意这些观点；这没问题。作为一个文明社会，我们能够对某个主题持有不同看法是件好事，表达这些观点也完全可以，但一个全面的演讲应该包含他人的观点，以便你的听众能够自行作出判断。


    如今，人们普遍担心分享观点会冒犯他人或招致反对，尤其是年轻人。就我个人而言，我认为分享你的观点没问题，特别是当你生活在一个支持言论自由的国家时。当然，总会有一条界限，例如，如果你的观点涉及种族歧视、恐同、跨性别恐惧等，就可能越界。然而，只要你的意图不是造成伤害或故意冒犯任何人，在演讲中表达自己的观点是完全可接受且受到鼓励的。你会知道自己的观点是否属于那个范畴，所以我建议你做出良好的判断。但与他人分享不同的观点是健康的，辩论也应该被鼓励。


    当你引用研究中的信息时，我建议你做记录，以便记住来源。如果你想引用他人的作品或包含他们可能已发布的任何数据，只要注明他们的工作，给予其署名，这就是合理使用。注明他们的工作也意味着，如果听众想查找任何信息，他们就有一个参考依据。


    为演讲调研信息时，你需要考虑信息的来源，特别是如果它来自某个人的博客。信息可能是错误的，因此你应该查看来源，并尝试寻找其他独立来源来佐证你找到的信息。这与记者撰写报道时通过核查多个来源来核实信息的过程相同。这样，如果有人对你演讲中的任何信息提出质疑，你就有据可查。


    为演讲调研信息可能是一个相当深入的过程，所以请确保清晰记录你的研究笔记和来源。我认识很多人喜欢把它们记在实体笔记本上，但我认为，如果你使用笔记应用，生活会轻松得多。如果你是
    Apple Mac 或 iPad 用户，`Apple Notes` 是电脑自带的免费应用，也是我正在使用的。还有许多其他优秀的笔记应用，包括如果你是 Microsoft
    Office 用户可用的 `Microsoft OneNote`，以及 `Evernote` 或其他任何同类应用。


    ### 大纲


    当你完成所有研究后，需要组织这些信息来构建一场连贯的演讲。设计演讲结构的最好方法是制定一个**大纲**。这也是小说家构思一本书的方式，这样他们就能了解故事的情节弧线、人物发展、冲突和回报。到现在，你应该已经知道自己要准备什么风格的演讲了。接下来，你需要考虑将演讲分成几个部分。就像具有三幕结构的故事一样，你需要规划开头、中间和结尾。


    ***第一幕（开头）***：介绍你自己以及你为何在这里发言。然后，引入你想要讨论的主题或问题。


    ***第二幕（中间）***：开始更详细地探索主题。你研究的大部分内容将在此处发挥作用。根据你的听众，你可能需要提供大量介绍性材料或包含主题细节。你有研究数据要展示吗？你对这个主题的看法是什么？有与你相反的观点吗？这里很适合探讨它们。你的演讲更偏向教学性吗？如果是，这里很适合通过从简单例子开始，然后逐渐增加难度来演示过程。


    ***第三幕（结尾）***：到这个阶段，你已经涵盖了主要内容，现在应该开始总结关键点。总结尤其重要，应该仔细撰写。你的演讲可能包含了大量信息，听众难以全部记住。如果你在较大的会议上演讲，请记住，如果你的演讲被安排在日程较晚的时间，与会者会更疲劳。总结是一个很好的机会，可以确保听众带着几个最重要的事实离开。总结完成后，你可以开放提问环节。


    大多数书面内容被分成这种三幕结构是有原因的——因为它有效，而且人们通常期望任何长篇信息都以这种方式呈现。当然，任何规则都可以被打破，你完全可以那么做。但如果你是一位新手演讲者，我建议你坚持使用三幕结构，直到你在公开演讲方面有了更多经验，然后再进行变通。不过，说实话，我看不出你为什么要那么做。


    你的大纲可以写在用来存储研究笔记的同一个笔记应用中，也可以使用更视觉化的应用，例如思维导图（图 2-1）。思维导图是我构思演讲的首选方式，因为它很直观。市面上有许多思维导图应用，从免费开源到付费应用都有；选择一个最适合你的。我在
    Mac 上使用的是一款名为 `iThoughtsX` 的应用。以下截图展示了我关于人工智能演讲大纲的开头部分。


    ![](img/524722_1_En_2_Fig1_HTML.png)


    **图 2-1**


    使用思维导图构思演讲大纲


    **注意**


    大多数现代娱乐形式（小说、电视节目和电影）都以三幕结构作为叙事的基础。设计一场演示文稿也不例外。


    制定大纲是一个强大的工具，我强烈建议你经历这个过程，因为它总能帮助你写出全面且内容丰富的演讲。

    '
- fmt: '### Scripting


    Scripting your talk is a controversial step. Some speakers swear by writing a
    full script for their talk. Other people hate the idea. Personally, I don’t write
    scripts anymore, apart from one occasion that I will cover in a moment. However,
    I started by scripting my first few talks.


    The script is the written form of your presentation. In this organizational tool,
    you write a complete script of what you are going to say during your presentation.
    This can take a couple of forms. It could be an expanded version of your outline
    with more extensive notes where you write a brief paragraph for each point that
    you want to discuss, or it could be a full script that contains word for word
    what you will say. Some people find it helpful to write a full script, although
    memorizing a script takes a lot of effort and practice. The script can be important
    both on the day of the presentation and when you are practicing. During practice,
    the script is a useful guide to remind you of the sequence of your presentation.
    By following the script when practicing, you will be able to memorize the progression
    of the presentation you’ve prepared.


    For some types of conventions or conferences, the organizers may ask you specifically
    for the script so that it can uploaded into the event’s teleprompters. In all
    my years as a public speaker, I was only asked for the script once ahead of time
    for use in a teleprompter, and I really didn’t like it. When using a teleprompter,
    you’re forced to stand behind a lectern and read from a screen—much like a news
    reader. This particular event was cautious about checking what the speakers’ presentations
    are, so they vetted the scripts first. I have found the use of teleprompters with
    written scripts to be the exception rather than the norm; however, it does happen,
    so make sure you know the rules of engagement with a prebooked event well ahead
    of time.


    If you are using teleprompters for the first time, you may feel uncomfortable.
    It can be awkward because they make the presentation restrictive. Without prompters,
    you can insert any topic you wish to include into the talk. With a script on the
    screen, however, it will be difficult for you to do this primarily because the
    script has been designed to fit the presentation’s exact length of time. In most
    of my talks, I add or remove content on the fly based on the audience’s reactions
    or a question that comes from the audience. Personally, I think this makes for
    a more fun experience, as you can inject a little more personality into the talk.


    Teleprompters can be valuable when you become more comfortable using them. They
    help the presenter keep the presentation on topic. They also help remind the presenter
    of the sequence of the presentation. If you’re nervous about remembering the flow
    of your talk, then a teleprompter may help, but bear in mind that reading from
    a professional teleprompter is completely different from reading a script on your
    laptop screen. Teleprompters are set at eye level so that you will be looking
    at the audience as you are reading, and looking at the audience is important if
    you want them to stay engaged. If you are reading from a laptop screen, you will
    be looking down at the screen and not engaging with the audience. This is a huge
    turnoff for an audience, and it is very unprofessional. Nothing shows off inexperience
    as much as not looking at the people you’re addressing.


    I started out by writing scripts, and I still do when writing training courses,
    but now that I am more experienced, I simply glance at notes in my presenter view
    on `Microsoft PowerPoint`.


    Another big benefit to having a fully written script of your talk is that you
    can use it to post a blog post or a series of blog posts on the same subject.
    It is easy to adapt a script into articles without much effort, and it offers
    another great avenue to present your views to the world.


    ### Cue Cards and Prompts


    Cue cards can also perform a similar purpose when there is no teleprompter at
    the event. These are cards on which the presenter puts the presentation outline.


    Cue cards will not automatically make your presentation better. To make sure that
    your use of cue cards works, you will need to do two simple things. First, ensure
    that the content on the cards is short and easily understandable. The cards should
    only contain keywords and phrases rather than complete sentences. The purpose
    of these words or phrases is to remind you of your next topic. You should be able
    to pick up the information you need just by glancing at the cards. Second, you
    need to practice using them. The use of cue cards won’t come naturally to you
    at first. Specifically, you’ll need to practice when you will look down at your
    card’s content and when you will look at your audience. While teleprompters are
    usually positioned so that it looks like the presenters are looking at the audience
    while reading, cue cards require you to look down at them to check the information.


    To use cue cards properly, you need to know when it is appropriate to check them
    and when it’s best to maintain eye contact with your audience. Ideally, you want
    to look at the audience when you are in the middle of discussing a topic. As long
    as you are on the same topic, you should keep your attention on the audience.
    The best time to look down at your cue cards is when you are transitioning between
    topics. When you look down at your cards to check which topic to discuss next,
    you will need to create a mental picture of the entire section that you want to
    discuss. Instead of simply looking at the next topic on the card, you look at
    the next three to five topics. This way, you will be able to discuss a substantial
    amount of information before looking at your cards again.


    If you are using slides for your presentation, then you can use the notes section
    in the presenter view of your presentation software, such as `Microsoft PowerPoint`
    or `Apple Keynote`. The notes section for each slide fulfills the same purpose
    as cue cards; you can include a few bullet points to remind you of any content
    you need to cover. Again, don’t write a lot here, as it will be hard to read and
    stay engaged with the audience. I prefer using these presenter view notes instead
    of physical cue cards, but if you are doing a talk without the use of slides,
    the physical cards can be helpful, especially if you are nervous.


    A good trick to try if you are using prompts, such as cue cards or presenter notes
    on the laptop, is to take a small sip of water when you come to the end of a section
    to glance at your cards or notes. The audience will think nothing of it, as presenters
    often take several sips of water throughout presentations because their mouths
    can get quite dry.'
  raw: '### Scripting


    Scripting your talk is a controversial step. Some speakers swear by writing a
    full script for their talk. Other people hate the idea. Personally, I don’t write
    scripts anymore, apart from one occasion that I will cover in a moment. However,
    I started by scripting my first few talks.


    The script is the written form of your presentation. In this organizational tool,
    you write a complete script of what you are going to say during your presentation.
    This can take a couple of forms. It could be an expanded version of your outline
    with more extensive notes where you write a brief paragraph for each point that
    you want to discuss, or it could be a full script that contains word for word
    what you will say. Some people find it helpful to write a full script, although
    memorizing a script takes a lot of effort and practice. The script can be important
    both on the day of the presentation and when you are practicing. During practice,
    the script is a useful guide to remind you of the sequence of your presentation.
    By following the script when practicing, you will be able to memorize the progression
    of the presentation you’ve prepared.


    For some types of conventions or conferences, the organizers may ask you specifically
    for the script so that it can uploaded into the event’s teleprompters. In all
    my years as a public speaker, I was only asked for the script once ahead of time
    for use in a teleprompter, and I really didn’t like it. When using a teleprompter,
    you’re forced to stand behind a lectern and read from a screen—much like a news
    reader. This particular event was cautious about checking what the speakers’ presentations
    are, so they vetted the scripts first. I have found the use of teleprompters with
    written scripts to be the exception rather than the norm; however, it does happen,
    so make sure you know the rules of engagement with a prebooked event well ahead
    of time.


    If you are using teleprompters for the first time, you may feel uncomfortable.
    It can be awkward because they make the presentation restrictive. Without prompters,
    you can insert any topic you wish to include into the talk. With a script on the
    screen, however, it will be difficult for you to do this primarily because the
    script has been designed to fit the presentation’s exact length of time. In most
    of my talks, I add or remove content on the fly based on the audience’s reactions
    or a question that comes from the audience. Personally, I think this makes for
    a more fun experience, as you can inject a little more personality into the talk.


    Teleprompters can be valuable when you become more comfortable using them. They
    help the presenter keep the presentation on topic. They also help remind the presenter
    of the sequence of the presentation. If you’re nervous about remembering the flow
    of your talk, then a teleprompter may help, but bear in mind that reading from
    a professional teleprompter is completely different from reading a script on your
    laptop screen. Teleprompters are set at eye level so that you will be looking
    at the audience as you are reading, and looking at the audience is important if
    you want them to stay engaged. If you are reading from a laptop screen, you will
    be looking down at the screen and not engaging with the audience. This is a huge
    turnoff for an audience, and it is very unprofessional. Nothing shows off inexperience
    as much as not looking at the people you’re addressing.


    I started out by writing scripts, and I still do when writing training courses,
    but now that I am more experienced, I simply glance at notes in my presenter view
    on Microsoft PowerPoint.


    Another big benefit to having a fully written script of your talk is that you
    can use it to post a blog post or a series of blog posts on the same subject.
    It is easy to adapt a script into articles without much effort, and it offers
    another great avenue to present your views to the world.


    ### Cue Cards and Prompts


    Cue cards can also perform a similar purpose when there is no teleprompter at
    the event. These are cards on which the presenter puts the presentation outline.


    Cue cards will not automatically make your presentation better. To make sure that
    your use of cue cards works, you will need to do two simple things. First, ensure
    that the content on the cards is short and easily understandable. The cards should
    only contain keywords and phrases rather than complete sentences. The purpose
    of these words or phrases is to remind you of your next topic. You should be able
    to pick up the information you need just by glancing at the cards. Second, you
    need to practice using them. The use of cue cards won’t come naturally to you
    at first. Specifically, you’ll need to practice when you will look down at your
    card’s content and when you will look at your audience. While teleprompters are
    usually positioned so that it looks like the presenters are looking at the audience
    while reading, cue cards require you to look down at them to check the information.


    To use cue cards properly, you need to know when it is appropriate to check them
    and when it’s best to maintain eye contact with your audience. Ideally, you want
    to look at the audience when you are in the middle of discussing a topic. As long
    as you are on the same topic, you should keep your attention on the audience.
    The best time to look down at your cue cards is when you are transitioning between
    topics. When you look down at your cards to check which topic to discuss next,
    you will need to create a mental picture of the entire section that you want to
    discuss. Instead of simply looking at the next topic on the card, you look at
    the next three to five topics. This way, you will be able to discuss a substantial
    amount of information before looking at your cards again.


    If you are using slides for your presentation, then you can use the notes section
    in the presenter view of your presentation software, such as Microsoft PowerPoint
    or Apple Keynote. The notes section for each slide fulfills the same purpose as
    cue cards; you can include a few bullet points to remind you of any content you
    need to cover. Again, don’t write a lot here, as it will be hard to read and stay
    engaged with the audience. I prefer using these presenter view notes instead of
    physical cue cards, but if you are doing a talk without the use of slides, the
    physical cards can be helpful, especially if you are nervous.


    A good trick to try if you are using prompts, such as cue cards or presenter notes
    on the laptop, is to take a small sip of water when you come to the end of a section
    to glance at your cards or notes. The audience will think nothing of it, as presenters
    often take several sips of water throughout presentations because their mouths
    can get quite dry.'
  trans: '

    ### 讲稿撰写


    为你的演讲撰写讲稿是一个颇具争议的步骤。有些演讲者坚信要为演讲写一份完整的讲稿，而另一些人则讨厌这个想法。就我个人而言，我现在已经不写讲稿了，除了接下来会提到的一种特殊情况。不过，我最开始的几场演讲确实是写了讲稿的。


    讲稿是你演讲内容的书面形式。在这种组织工具中，你要完整地写下你在演讲过程中将要说的每一句话。这可以有几种形式。它可以是你大纲的扩展版本，包含更详尽的笔记，为你想要讨论的每个要点写下一小段内容；也可以是一份逐字逐句写下的完整讲稿。有些人认为写一份完整的讲稿很有帮助，尽管背诵讲稿需要大量的努力和练习。讲稿在演讲当天以及你练习的时候都可能很重要。在练习时，讲稿是一份有用的指南，可以提醒你演讲的顺序。通过照着讲稿练习，你将能够记住你准备好的演讲流程。


    对于某些类型的会议或大会，组织者可能会特别要求你提供讲稿，以便上传到活动的提词器中。在我多年的公开演讲生涯中，只有一次被提前要求提供讲稿用于提词器，而我真的很不喜欢那次体验。使用提词器时，你被迫站在讲台后面，对着屏幕念稿——就像新闻播报员一样。那次活动的主办方对检查演讲者的内容非常谨慎，所以他们事先审核了讲稿。我发现，使用书面讲稿配合提词器的情况更多是例外，而非常态。尽管如此，这种情况确实存在，所以一定要提前了解清楚与这场预约活动相关的具体规则。


    如果你第一次使用提词器，可能会感到不自在。这可能会很别扭，因为它们让演讲受到了限制。没有提词器，你可以在演讲中随时插入任何你想谈论的话题。然而，一旦屏幕上有了讲稿，你就很难这么做，主要是因为讲稿的设计时间长度与演讲正好吻合。在我大部分的演讲中，我会根据观众的反应或观众提出的问题，在现场临时增减内容。就个人而言，我认为这能带来更有趣的体验，因为你可以为演讲注入更多个人特色。


    当你对使用提词器感到更得心应手时，它们会变得很有价值。它们有助于帮助演讲者紧扣主题，也能帮助提醒演讲者演讲的顺序。如果你担心记不住演讲的流程，那么提词器可能会有所帮助，但请记住，从专业提词器上阅读，与在你的笔记本电脑屏幕上阅读讲稿是完全不同的。提词器被设置在视线水平的位置，这样你可以在阅读的同时看着观众。如果你想保持观众的参与感，看着观众这一点非常重要。如果你是从笔记本电脑屏幕上读稿，你会低着头看屏幕，无法与观众进行眼神交流。这会让观众非常反感，而且显得非常不专业。没有什么比不看你的听众更能暴露你的经验不足了。


    我最初是从写讲稿开始的，现在在编写培训课程时也仍然会写，但如今我更有经验了，我只会瞄一眼`Microsoft PowerPoint`演示者视图中我的备注。


    拥有完整书面讲稿的另一个巨大好处是，你可以利用它来发布一篇或一系列关于同一主题的博客文章。将讲稿改编成文章非常容易，几乎不费什么力气，这为你向世界展示你的观点提供了另一条绝佳途径。


    ### 提示卡与提词提示


    在没有提词器的活动中，提示卡也能起到类似的作用。这些卡片上写着演讲者准备的演讲大纲。


    提示卡并不会自动让你的演讲变得更好。要确保提示卡发挥作用，你需要做好两件简单的事情。首先，确保卡片上的内容简短易懂。卡片上应该只包含关键词和短语，而不是完整的句子。这些词语或短语的作用是提醒你下一个话题。你应该只需扫一眼卡片就能获取所需信息。其次，你需要练习使用它们。一开始，你并不会自然而然地会使用提示卡。具体来说，你需要练习何时低头看卡片上的内容，何时看向观众。虽然提词器通常被放置得看起来像是演讲者在阅读的同时正看着观众，但使用提示卡时，你需要低头去看上面的信息。


    要正确使用提示卡，你需要知道何时适合查看它们，何时最好与观众保持眼神交流。理想情况下，你应该在讨论某个话题的过程中看着观众。只要你在讲同一个话题，就应该把注意力放在观众身上。查看提示卡的最佳时机是在话题转换之间。当你低头看卡片，准备核对下一个要讨论的话题时，你需要在脑海中构建出你想要讨论的整个部分的图像。不要只看卡片上的下一个话题，而是要看接下来的三到五个话题。这样，你就能在再次查看卡片之前，讨论相当多的内容。


    如果你在演讲中使用幻灯片，那么你可以使用演示软件演示者视图中的备注功能，比如`Microsoft PowerPoint`或`Apple Keynote`。每张幻灯片的备注区域起着与提示卡相同的作用；你可以放上几个要点，来提醒自己需要涵盖的内容。再次强调，不要在这里写太多内容，否则很难阅读，也难以与观众保持互动。我更喜欢使用这些演示者视图中的备注，而不是实体提示卡。但如果你做的演讲不需要使用幻灯片，那么实体提示卡会很有帮助，尤其是当你感到紧张的时候。


    如果你使用提示（例如提示卡或笔记本电脑上的演讲者备注），一个好的技巧是：在某个部分即将结束时，喝一小口水，同时快速扫一眼你的卡片或备注。观众不会对此有任何想法，因为在演讲过程中，演讲者常常会喝好几口水，因为他们的嘴巴很容易变干。'
- fmt: '# Creating Effective Slides


    Slides are the primary visual tool for most presentations. With the use of slides,
    a presenter will be able to use all types of media content, such as text, pictures,
    images, and videos. If well designed, these slides will help the presenter pull
    off an engaging presentation.


    However, if the slides are not well designed, they can be a cause of disappointment
    to the audience. Instead of making the presentation better, poorly designed slides
    usually make presentations more challenging to understand, as the audience will
    spend more time trying to interpret the slides than listening to you speak. One
    of the biggest offenders here are presentations in which the slides are littered
    with bullet-point lists.


    As the presenter, you need to realize that the slides are there for the audience’s
    benefit, not yours. Well-designed slides support and enhance what you are saying
    and reinforce your message. It is a common fault among inexperienced speakers
    to design their slides with far too much information on them so that they can
    use them as visual prompts to remember what they are saying. Don’t do this; instead,
    rehearse often before the talk to help you remember what to say, and include some
    simple notes in the presenter’s view of your slide software. Let’s run through
    some points to consider when designing your slides.


    ## Reduce the Amount of Text


    Your slides are a support aid for the narrative you share with the audience. Therefore,
    the most critical point at that moment is what you are saying. If you put a lot
    of text on a slide, then the audience’s eyes will naturally be drawn to the slide,
    and they will try to read the text. While they are reading, they are not listening
    to you, and that will leave the audience feeling shortchanged, as you have asked
    too much of them.


    If you want the audience to read, then it would be better to point them to a blog
    post. Some speakers try to get around the idea of having too much text by littering
    their slides with bullet points, and this is almost as bad as large blocks of
    text. If you make the audience do more work than they need to do, then they will
    lose interest and disengage. That’s when you see audience members playing on their
    phones or their laptops.


    I’m not saying that you shouldn’t use any text at all, but it is wise to be careful
    with the amount. If I want to display text, I am a fan of a technique called text
    chunking. You can see this in the following screenshot of a slide from one of
    my talks (Figure [2-2](#524722_1_En_2_Chapter.xhtml#Fig2)).


    ![](images/524722_1_En_2_Chapter/524722_1_En_2_Fig2_HTML.png)


    Figure 2-2


    Using text chunking to reduce text on the screen


    By using colored boxes—or chunks—you can easily summarize what you are saying
    with text-based prompts on the screen. If I am going to spend a minute describing
    the content of each box, then I might show one box at a time. In the case of the
    preceding example, I would display the blue box first, then the green, then orange,
    then yellow. Using a Bluetooth slide clicker, I would progress through the slides.
    As a technique, this works quite well.


    Sometimes, you will want to display a block of text—such as a quote—and you can
    make this more visually appealing with some clever imagery. In the preceding screenshot
    (Figure [2-3](#524722_1_En_2_Chapter.xhtml#Fig3)), you can see that I displayed
    a quote from *A Tale of Two Cities* by Charles Dickens. The quote provides a powerful
    impact on the point I was making, so I tried to make the slide more visually appealing
    by using a cartoon of Charles Dickens.


    ![](images/524722_1_En_2_Chapter/524722_1_En_2_Fig3_HTML.png)


    Figure 2-3


    Using imagery to present text


    There are no hard and fast rules about what to put on a slide. I am not saying
    never use blocks of text, but a good guide is to put yourself in the audience’s
    shoes when you build a slide. How much work do they need to do to interpret what
    is on the slide while still trying to listen to you speak?


    ## Use a Slide Template


    Good slide design can be hard, as not everyone is a gifted designer. I’m certainly
    not. One way of creating visually impactful slides is to download either a free
    slide template or to purchase a template. There are many websites available that
    will allow you to download templates for both Microsoft PowerPoint and Apple’s
    Keynote application. Templates are a great way to create visually pleasing slides.


    Before you download any templates, you need to pay careful attention to the usage
    guidelines. Some templates state that they are only allowed to be used privately
    for internal company use. If you are using slides for a public performance and
    then potentially handing out copies of your slide deck to attendees, then you
    need to explicitly check that you are allowed to do so.


    Personally, I have never used a third-party slide template for a talk. I tend
    to use the default PowerPoint template and, where possible, use full-screen stock
    photos or text chunking, as described earlier.


    ## Images, Diagrams, and Reducing Clutter


    There is a saying that a picture speaks a thousand words, and this is true when
    designing slides for a presentation. Take the following screenshot as an example
    (Figure [2-4](#524722_1_En_2_Chapter.xhtml#Fig4)).


    ![](images/524722_1_En_2_Chapter/524722_1_En_2_Fig4_HTML.png)


    Figure 2-4


    Using images for impact


    In this talk, I explain the dangers of social media addiction and how we need
    to educate and protect children growing up with this technology. When I was designing
    the slides, I used a website called Shutterstock to look for inspiration, and
    I found this brilliant illustration of people on a train. No one in the picture
    is talking to each other; they are all staring at their phones. I thought this
    was a powerful image that backed up the point I was making. When I deliver this
    talk, I put this image on the screen for a few minutes while I am making my point.
    The audience will look at the image to see what is going on and then immediately
    look back at me to listen what I am saying. I am a big believer in using full-screen
    photos to illustrate points and leaving that image on the screen for as long as
    needed.


    Sometimes a full-screen photograph or illustration is not suitable, and you must
    show some data. The problem with data is that people need to use their cognitive
    power to interpret the data, even if you are explaining it at that point, so you
    want to be careful about how much you show.


    In the preceding screenshot (Figure [2-5](#524722_1_En_2_Chapter.xhtml#Fig5)),
    I show timing data regarding security operations in a Microsoft software development
    library. The details of those timings aren’t important for the purpose of this
    section of the book, but what is important is how I show the data.


    ![](images/524722_1_En_2_Chapter/524722_1_En_2_Fig5_HTML.png)


    Figure 2-5


    Use simple charts and tables to present data


    On the left, I have a simple table with some data. Next to that, I have a chart
    of that data. Using this chart makes it quite easy to see how the data in both
    columns of the table correlate to each other. In this case, you can immediately
    see that there is linear growth in the relationship between the number of iterations
    and the timing in milliseconds. Including that chart was a deliberate decision
    I made to make interpreting the data easier for the audience.'
