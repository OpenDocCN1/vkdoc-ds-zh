- fmt: "### Being Respected As an Authority in Your Field\n\nThe final benefit, and\
    \ one of the most important, is that you will start to be regarded as an authority\
    \ in your field as you present to more audiences at large conferences. Being an\
    \ authority doesn’t necessarily mean you are a top expert on the subject. An expert\
    \ can demonstrate ideas with a lot of stories and personal examples from their\
    \ work, but an authority will use a lot of emotions and metaphors to get their\
    \ point across and draw people in. Of course, you can be an authority and an expert.\n\
    \nBeing a public speaker gives you many potential advantages over applicants for\
    \ jobs. Public speaking is seen as a skill that has value, not only in your chosen\
    \ subject area, but also as someone who is able to write and deliver a talk, which\
    \ means you can finish what you started. You will also be seen as someone with\
    \ great confidence, which carries a lot of weight in the job market.\n\nAfter\
    \ you have written your talk, you will want to get on stage, or in a boardroom,\
    \ to deliver it to an audience. If you are presenting at a private company event\
    \ for work, this could happen quickly. If you are planning to present at a local\
    \ meetup group or at a conference, there may be a big delay in writing and performing\
    \ a talk if you do not plan.\n\nSmaller meetup groups tend to book their speakers\
    \ months in advance, so at the time you are planning the content of your talk,\
    \ try connecting with local groups to talk with them about dates. If they have\
    \ an open date two or three months in the future, it is worth getting booked and\
    \ advertising the talk. This gives you plenty of time to write and rehearse the\
    \ talk. Having a date already booked in the diary will be a great motivator to\
    \ get the talk written in plenty of time.\n\nIf you have already written the talk\
    \ and are practicing, but the earliest slot is still a few months away, let the\
    \ groups know that you can be contacted if there are last-minute cancellations—provided\
    \ you are comfortable with this—and they can put you on their reserve list. Some\
    \ people may need to pull out at the last minute for any number of genuine reasons,\
    \ so being flexible here helps.\n\nMany meetups have their own websites through\
    \ which they manage their bookings, so a `Google`/`Bing` search (or other search\
    \ engine) will uncover them for you. Another popular platform for booking and\
    \ arranging meetups is [`http://meetup.com`](http://meetup.com). The `Meetup`\
    \ website lets groups promote their events and allows attendees to book spaces\
    \ and speakers to contact the organizers. One useful `Meetup` feature allows you\
    \ to do geographic searches for meetup groups on specific subjects, which makes\
    \ it easy to seek out speaking opportunities near you.\n\nIf you want to speak\
    \ at a larger event, such as a conference, then you need to go through a process\
    \ called a Call for Papers (`CFP`) or Request for Papers (`RFP`). When a conference\
    \ is in its planning stages, it will launch its `CFP` process, and potential speakers\
    \ can submit talks for consideration. This process can start anywhere from two\
    \ to six months ahead of the event date. Once the `CFP` process ends and speakers\
    \ have submitted their talks, a conference selection panel reviews all submitted\
    \ talks and works to put together a potential agenda by selecting talks they believe\
    \ conference attendees will enjoy.\n\nIf you have speaking at conferences in mind,\
    \ then you will need to find out when conferences are scheduled during the year\
    \ and when they open their `CFP` for submissions, which means you’ll need to plan\
    \ ahead. Speaking at conferences takes a lot of planning, and it is worth starting\
    \ that process early, even before you have designed your slides.\n\nWhen I come\
    \ up with an idea for a new talk, I do a lot of planning and create a series of\
    \ mind maps that document what will be in the talk. We will look at mind maps\
    \ in the next chapter. I then write the talk synopsis that I will submit to the\
    \ conference. At that point, I apply to several conferences with the synopsis\
    \ for that talk. I don’t design the slides until the talk is accepted at a conference.\
    \ With that acceptance in place and a date in the diary, I plan when I will build\
    \ the slides and start rehearsing.\n\nIf you are a new speaker, then you might\
    \ not want to leave writing the talk until it has been accepted at an event, and\
    \ that is fine, but I sometimes do the planning for two or three new talks at\
    \ once and then build them when they get accepted. Sometimes my new talk idea\
    \ isn’t accepted at all; that can happen, so I never spend time building a complex\
    \ slide deck until I must.\n\n## Summary\n\nThe ability to communicate effectively\
    \ with an audience is a major skill that you can add to your professional toolbox.\
    \ Presenting to an audience, either as a public speaker or presenting to a room\
    \ full of your peers, is a skill that has many benefits. You will have the skills\
    \ to put your point across and influence people to believe in a cause that is\
    \ important to you. Effective communication skills will also help you excel in\
    \ your career, as you will work even better in a team environment.\n\nPublic speaking\
    \ is also a fantastic way to improve your self-confidence, critical thinking skills,\
    \ and ability to network with other like-minded people. Above all else, it is\
    \ fun.\n\n## Workshop Questions\n\n1.  Write down a list of personal goals that\
    \ you wish to satisfy by designing and presenting in front of an audience. These\
    \ goals could be something like the following:\n    *   Better research skills\n\
    \    *   Improved self-confidence and so on\n\n2.  For each of the goals you listed\
    \ in question 1, think specifically about how being able to speak in front of\
    \ an audience will help you. For example, if your goal was to improve your self-confidence,\
    \ then speaking will help you push through a fear of being in the spotlight and\
    \ having to think quickly if someone asks you a question.\n\n3.  For each of the\
    \ goals you have listed in question 1, write down the success criteria so you\
    \ will know how that goal has been achieved.\n\n# 2. Writing Engaging Presentations\n\
    \nThe presentation content is the foundation of your public-speaking performance.\
    \ People will judge your overall performance based on the information they remember.\
    \ A presentation needs to have several qualities to make it good at conveying\
    \ your message.\n\n## Centered on a Relevant Problem\n\nEffective presentations\
    \ focus on one problem. It is important that the people you are talking to are\
    \ familiar with that problem. It is even better if they are already facing these\
    \ issues, and they do not have a solution, which is why they are coming to hear\
    \ you talk in the first place. If the topic you’re discussing doesn’t match the\
    \ audience’s interests, they will not be engaged, and all your effort will amount\
    \ to nothing if you present the wrong problem to the wrong group of people.\n\n\
    My presentations focus on problems in my industry and professional fields—software\
    \ development, personal development, leadership, and security. Business owners\
    \ and software developers are interested in the most recent techniques in software\
    \ development. The issues I discuss vary depending on the group to which I am\
    \ speaking.\n\nAn even more important part of talking about a problem on stage\
    \ is demonstrating how you’re going to solve the problem. When people listen and\
    \ engage in a presentation, they want closure. Presenting a problem whets their\
    \ appetite and makes them want to listen. If you don’t present your version of\
    \ the solution, they may walk away from the presentation unsatisfied. This may\
    \ create a wrong impression of you as a professional, because you did not offer\
    \ a solution as a good payoff."
