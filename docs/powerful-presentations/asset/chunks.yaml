  trans: "\n#### 注意你的视线方向\n\n通过摄像头进行在线演讲时，你需要留意自己的视线方向。当你讲解幻灯片内容时，很自然地会盯着显示器或笔记本电脑屏幕。然而，在观众看来，这就像是你没有直视他们。为了解决这个问题，请务必看向摄像头——不必全程如此，但在整个演讲过程中应有规律地这样做。\n\
    \n一个好办法是在摄像头上贴两个塑料假眼睛，不知为何，你会不自觉地想去看它们的\"眼睛\"。当我们与真人交谈时，会注视对方的眼睛，而这招能达到类似效果。这是确保你定期进行眼神接触的绝佳技巧。\n\
    \n#### 不要过度复杂化你的演讲设备\n\n2020 年初疫情来袭时，当所有人都意识到必须居家办公并使用视频会议软件时，突然掀起一股抢购摄像头、灯光和各种小工具的热潮，人们试图将普通的视频通话变成全景电视制作。伴随着这些花哨硬件，人们还使用`Open\
    \ Broadcast System`等软件搭建不同的制作场景，以便在演讲中途像新闻直播那样切换场景。\n\n这一切虽然令人印象深刻，但并非必要。我并非说你永远不该尝试此类技巧。摆弄这些确实有趣，但我参加过大量演讲，它们虽在技术上令人赞叹，内容却相当肤浅——因为演讲者过分关注表达形式而忽视了内容。当然也不全是这样，有些人确实用这种技术完成了精彩的演讲，但他们都是经验非常丰富的演说家。\n\
    \n我不是要扫大家的兴——你大可以玩这些设备——但别忘了最关键的部分：构思并呈现一场精彩的演讲。只要你的演讲结构清晰、准备充分，观众就会喜爱你的内容。如果你连这些基本功都没掌握，那么即使视觉效果再好，演讲也会显得乏味。\n\
    \n公共演讲本质上是一场简单的交流。听众来到你的演讲现场，希望享受其中，然后带着对你核心观点的领悟满意离开。三个月后，没人会记得\"因为`Open Broadcast\
    \ System`触发了多个场景所以特别喜欢那场演讲\"——它仅仅是传递机制，远没有演讲的实际内容重要。在掌握基本功之前，别过度设计这些技术细节。\n\n\
    ## 总结\n\n我们来到了这本公共演讲书籍的结尾。在人前发言通常是件令人恐惧和紧张的事。我刚开始时也不例外。一想到要在大庭广众面前演讲，我就焦虑不已。在我一生克服的所有挑战中，公共演讲是我最引以为傲的成就。它赋予了我全新的自信，为我打开了在世界级活动中演讲的诸多乐趣，让我得以环游世界。如果我能做到，你也一定可以。\n\
    \n本书的核心主题是：准备是成功的关键。从研究主题、提前制作幻灯片、反复练习直至熟记于心，到为舞台上的突发状况制定预案——只要提前准备，你就能减轻表演焦虑，呈现精彩的演讲。\n\
    \n要成为公共演讲者，你不必是所在领域的专家。演讲可以设置不同难度层级，总会有听众比你更不了解这个主题。只要将演讲设定在合适的难度，你就没问题。例如，如果你要做一场关于学习\
    \ Java 编程语言的演讲，而你自己只是初学或中级程序员，就不该标榜这是高级演讲；否则会吸引错误的听众。反之，如果你讲授高级 Java 内容，却面向初学者宣传，听众就会跟不上，因为他们期待的是入门级演讲。\n\
    \n我写这本书的目的是在短时间内为你提供所有成功所需的工具。我更希望你快速阅读本书，然后把时间花在应用这些技巧上，而不是啃完一本 400 页的大部头，忘掉一半内容，最后却来不及准备你梦想中的演讲。\n\
    \n最后，感谢你购买并阅读这本书。我真诚希望书中所讲的内容能帮助你研究、规划、准备并呈现一场关于你选定主题的精彩演讲。祝你好运。\n\n## 课后练习\n\n\
    1.  练习本章前面讨论的可视化技巧：想象自己进行了一场成功的演讲，观众报以热烈掌声。提前做这些可视化练习有助于缓解焦虑。\n\n2.  练习\"方形呼吸法\"\
    ，熟悉这种技巧及其镇定效果。\n    *   吸气四秒，让空气充满肺部。\n    *   屏住呼吸四秒。\n    *   缓慢呼气八秒。\n    *\
    \   不要停顿，直接回到第一步，再次将肺部充满空气。\n\n3.  参加活动前，整理好你的线材、转接头和适配器包。考虑以下物品：\n    *   笔记本电脑充电器\n\
    \    *   出国旅行用的国际电源适配器\n    *   HDMI 适配器（可能备几种不同品牌）\n    *   VGA 适配器（有些场地使用极旧的投影系统）\n\
    \    *   幻灯片翻页器（让你能在舞台上远离笔记本电脑）\n    *   存有演讲所需所有文件备份的 U 盘\n\n4.  如果你计划面向线上虚拟观众进行演讲，请安装主流平台并熟悉它们。需要考虑的平台包括：\n\
    \    *   Zoom\n    *   Teams\n    *   Google Meet\n    *   Cisco Webex\n"
