  trans: "\n# 工作坊问题\n\n1.  当你的演示文稿有了初稿，并且自己练习了几遍之后，组成一个由信得过的伙伴组成的小团体，向他们进行演示。他们可以是家人、朋友或同事。尽量选择一个能代表你目标受众群体的成员组成的小组。\n\
    \n2.  当你多次排练并对自己的演示更加自信时，录下其中一次排练，这样你就可以回看并分析你的演讲表现。你可以这样做：\n    *   在显示器上放映幻灯片，然后站在屏幕旁边。用你的手机，把它放在椅子或支架上，在演示时进行录制。调低电脑屏幕的亮度，这样你就能看到幻灯片。只要能看清你自己、屏幕并听清你的声音，录制质量无关紧要。\n\
    \    *   或者使用屏幕录制应用，例如 Camtasia、`ScreenFlow` 或 QuickTime，录制屏幕上的幻灯片以及你演讲的网络摄像头画面。\n\
    \    *   当你录制好演讲后，不要过于担心录制质量，回看视频并观察你的演讲表现。要注意的事项：你是否经常卡壳？你是否记住了每一部分的引言？在你演讲的某些部分，更详细的主讲人备注是否会有所帮助？你的幻灯片是否清晰易读？\n\
    \n3.  让你的练习听众尽可能多地就你正在演示的主题提出问题。让他们不要有所保留。如果他们有任何不确定的地方，或者想要了解更多信息，请让他们提出来。\n\
    \    *   写下每一个问题。\n    *   练习环节结束后，开始将问题按共同主题分组。\n    *   分析每个主题。要么为这些主题准备答案，要么如果很多人问了类似的问题，考虑在演示文稿中添加额外内容来涵盖这些答案。\n\
    \n4.  花时间观察人们说话时的面部表情和手势。当你与朋友、家人或同事交谈时，他们是如何用手势来强调他们所说的话的？你能从中学习吗？\n    *   在\
    \ YouTube 上查找演讲（TED 演讲就很棒），并研究演讲者。他们如何说话、站立以及使用手势来传达信息？练习模仿他们。\n\n5.  排练时要计时你的演示。它符合你分配的时间段吗？如果你是在商业会议上做演示，那么时间安排会被严格执行。你有足够的时间演示并在最后留下问答环节的时间吗？\n\
    \    *   大致算出每个环节的时间。在你的演示软件的演讲者备注中，记下该环节应在时间段内的哪个时间点开始。这将在你上台时帮助你判断自己是讲得快了还是慢了。\n\
    \n6.  记住你演讲的开场白，大约前五分钟。这将使你能够进入一种流畅的状态，让你放松下来。在开场白中，如果合适的话，看看能否插入一个小笑话让听众微笑。尽早让听众微笑或大笑有助于缓解紧张气氛，使听众放松。\n\
    \n7.  仔细检查你的演示幻灯片和演示，确定其中任何依赖网络连接的部分。需要考虑的事项：\n    *   在线播放的视频：你最好将视频下载下来，以便在笔记本电脑上播放。\n\
    \    *   需要联系在线服务的软件演示：如果这是一个软件开发演示，考虑为所有在线调用创建桩代码。\n\n8.  如果你的演示文稿中有部分内容在没有网络连接的情况下无法正常工作，那么创建一个备份的幻灯片组，并为任何需要网络的部分截取屏幕截图。如果你在台上遇到网络故障，可以切换到这份备份的幻灯片组。\n\
    \n# 进行演讲\n\n在演讲当天，你会对即将到来的演讲感到紧张和焦虑。但是，尽量不要让这种感觉影响你的表现——管理焦虑并克服它，是你作为公众演讲者面临的挑战之一。\n\
    \n## 做好准备\n\n正如我在书中多次提到的，准备是你作为公众演讲者成功的关键。你应该确保在演示前一晚准备好所有需要的东西。\n\n在上一章中，我们讨论了你的演出前惯例，其中一部分就是确保你打包好所有需要的东西并准备就绪，比如你的笔记本电脑、充电器和\
    \ HDMI 转换器。在演讲的当天早上，你已经有足够多的事情需要考虑了，而不是去担心你所有的转换器、翻页器和连接线是否都准备好了。\n\n## 想象你的成功\n\
    \n想象法是在演示前使用的一个很好的技巧。在这种技巧中，你想象自己进行了一场成功的演讲，一切进行得十分顺利。你想象自己在活动场地面对满场观众从头到尾完成演讲。做这个练习时，想象观众完全沉浸在你的演讲中。想象当你讲出笑话和妙语时，观众在欢笑。同时，想象他们看到你分享的震撼信息时那惊叹的表情。\n\
    \n最后，想象你结束演示时，观众起立为你鼓掌。这项活动有助于激励你做出色的表现。如果你对自己的公众演讲能力有任何怀疑，想象自己成功将显著有助于减少你感到的不确定性和压力。\n\
    \n这样想象你的演示可能感觉有点傻，但积极的想象法是一种非常流行的技巧，被许多专业人士使用，例如运动员和表演者。没有人需要知道你在这样做，但想象成功会让你处于一种积极的心态去进行你的演讲。如果你反其道而行之，想象你的演讲搞砸了，那么你会处于消极的心态，这会使你在正式开始演讲时走上错误的路。\n\
    \n## 人们希望你成功完成演讲\n\n大多数新的公众演讲者在演示前都会经历极度的焦虑。最常见的原因是对面对观众感到恐惧。人们害怕自己会犯错，会当众出丑。\n\
    \n如果你经常遇到这种情况，请时刻提醒自己，观众是来看你成功的。他们希望你演讲成功，因为他们想向你学习。如果你按照练习时的方式去做，你的演示就会表现出色。\n\
    \n你应该记住，观众是选择来参加你的演讲的。他们不是来看你失败的。他们出现在那里是因为他们对该主题真正感兴趣，并且想向你学习。他们是来看你成功的。我参加过很多出现技术问题的演讲——演示失败、网络中断，或者演讲者忘词结巴。我从未见过有人因为一个错误而贬低演讲者。作为一个愿意站在观众面前的人，观众和演讲者之间存在着一种天然的相互尊重的关系。\n"
- fmt: '# In the Case of Technical Difficulties, Apologize and Move On


    If you plan to give more talks in the future, you will realize that some things
    that go wrong are out of your control. Regardless of how well you prepare, you
    will eventually experience disasters in your presentations. Most of them will
    be technical difficulties that occur when the tools we rely on don’t behave as
    expected. The worst thing that could happen is when these tools malfunction right
    before or during the presentation.


    If this happens to you, make sure that you act professionally in front of your
    audience—don’t shout, swear, or panic. Show grace under pressure. When things
    don’t go your way in front of the audience, you can show them how you behave during
    tense situations. This is an excellent chance for consultants to show their prospective
    clients that they are calm, even when faced with significant stress.


    You can also use humor to defuse an awkward situation. I remember one talk I was
    giving to about 300 software developers. The projector started flickering and
    then cut out. I tried the usual remedy of unplugging the cable and putting it
    back in, but that did nothing. As I was doing this, I saw the audiovisual engineer
    coming to the stage. I knew there was going to be a short delay, so I made a joke
    of it. I asked if there was anyone from IT in the room—yes, in a room filled with
    IT professionals. We all laughed together. I then pointed out that I forgot to
    make a sacrifice to the demo gods, in which I nominated the first row of the audience.
    This raised more laughter. By that time, the audiovisual engineer had restarted
    the HDMI junction box underneath the podium. With the projector working again,
    I just picked up and carried on. Even though I had a technical malfunction, no
    one cared. Everyone got the information they came for, and the talk rated well
    with the attendees.


    If you are delivering a talk that relies on software demonstrations, you can get
    demo failures. I joked about making a sacrifice to the demo gods, but the superstitious
    part of me thinks there is something in that. I always find that the hardest talks
    to deliver are those that rely heavily on demos, especially software development
    demos. You can practice these demos many times without encountering any issues;
    however, when you get on stage, something always seems to go wrong. We have already
    mentioned an internet contingency plan, but it is also worth having a demo contingency
    plan, even if it doesn’t rely on the internet. As mentioned previously, in this
    case, I have a series of slides at the back of my side deck with screenshots of
    the expected outcome from the demo.


    If you do experience a demo failure, don’t try to hide it or bluff your way through
    it. Just apologize and then go to the contingency slides at the back of your slide
    deck and show the results. Attendees know demos can go wrong. The stage is a high-pressure
    environment, and you can easily make a mistake. Instead of spending a long time
    trying to figure out what has gone wrong, just show the results. The audience
    will be fine with it. They are there to learn. Demo failures, while annoying,
    are not fatal. Simply prepare for every demo to fail, and have those screenshot
    slides ready at the back of your deck. It’s better to get to the end of the talk,
    showing some results—even if they are not planned—than it is to give up because
    something doesn’t go as expected. If anything, the audience will respect you for
    remaining calm and getting to the end of the talk.


    If the demo fails, what the audience won’t be fine with is you flailing about
    while they don’t get any resolution or results. Be prepared, you’ll thank me later.


    ## If You Can, Rehearse in the Event Venue at Least Once


    Rehearsing one last time at the event venue will help to improve your performance.
    If possible, go to the event venue the day before your presentation, and ask the
    people there if you can do a short rehearsal on the stage or at the podium. This
    isn’t always possible, especially at large conferences, but there’s no harm in
    asking if you can practice in the actual presentation room.


    The visit will allow you to learn about the venue and the facilities that you
    can make use of when you are presenting. For instance, you can find out how big
    the stage is and what type of system the organizers will use to display your slides.
    Some will use a projector, while others will use large televisions.


    When rehearsing your lines at the venue, you should already think of how you will
    move on the stage. If you planned to move around when presenting, you would need
    to make sure that you have enough space to do so; not all stages are large enough
    for you to walk around. Another consideration is if the talk is being filmed.
    Is the camera fixed into position? If so, then it would be easy for you to walk
    out of frame. If the camera has an operator, then you will usually have more freedom
    to move about. You can usually find out from the conference organizers ahead of
    time how they manage cameras and filming.


    If you can’t do a full rehearsal at the venue ahead of time, don’t worry. It’s
    still a good idea to find the room you’re going to be speaking in ahead of time,
    even if it is only to look and know where you’re going.


    ## On Stage


    The big day has arrived. You are standing on the stage. You have set up your laptop.
    The projector is working correctly, and the audiovisual engineer has set you up
    with a microphone and transmitter pack. You are standing there—silently panicking—and
    the attendees are entering the room and taking their seats. This is it: the day
    for which you have prepared. You have researched your talk, built beautiful slides,
    and rehearsed the talk more times than you care to admit. You have run through
    your preperformance ritual, and you are here on stage, waiting to start.


    The doors to the room are closed; the lights dim. You start talking.


    ### Project Your Voice to the Back of the Room


    During your presentation, you should aim to project your voice to the back of
    the room. By doing this, you ensure that your voice reaches all the attendees
    at your presentation. If the venue is quite large, you should consider asking
    what microphones the organizers will be using to ensure that the entire audience
    will hear you. At big conferences, the organizers will provide you with a microphone,
    either as a clip-on microphone or as a headset.


    At small events, however, a microphone may not be available. This means that you
    will need to raise your voice a bit to make sure that everyone hears you. Regardless
    of whether you are using a microphone or not, imagine that you are talking to
    the people in the back row and project your voice. Don’t worry about it being
    too loud through the microphone; the audio people looking after the room will
    deal with audio levels.


    ### Make Eye Contact with the Audience


    You should also practice making eye contact with audience members. If you avoid
    eye contact, your audience may see this as a sign of anxiety or a lack of confidence.
    Eye contact is best done when you expect a reaction from the audience. For example,
    you can make eye contact with your audience when you are asking a rhetorical question.
    You could also do this when you state conclusions or essential points in your
    presentation.


    A good trick is to make eye contact with the people who are engaged with the presentation.
    Find the people who are listening to you and make eye contact with them during
    critical moments in your presentation.


    When you make eye contact, make sure that it lasts only a few seconds so that
    it doesn’t seem awkward to the other person. You will need to make eye contact
    with one person at a time.'
