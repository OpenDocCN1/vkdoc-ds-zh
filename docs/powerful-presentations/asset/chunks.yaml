    \ of the event date. Once the CFP process ends and speakers have submitted their\
    \ talks, a conference selection panel reviews all submitted talks and works to\
    \ put together a potential agenda by selecting talks they believe conference attendees\
    \ will enjoy.\n\nIf you have speaking at conferences in mind, then you will need\
    \ to find out when conferences are scheduled during the year and when they open\
    \ their CFP for submissions, which means you’ll need to plan ahead. Speaking at\
    \ conferences takes a lot of planning, and it is worth starting that process early,\
    \ even before you have designed your slides.\n\nWhen I come up with an idea for\
    \ a new talk, I do a lot of planning and create a series of mind maps that document\
    \ what will be in the talk. We will look at mind maps in the next chapter. I then\
    \ write the talk synopsis that I will submit to the conference. At that point,\
    \ I apply to several conferences with the synopsis for that talk. I don’t design\
    \ the slides until the talk is accepted at a conference. With that acceptance\
    \ in place and a date in the diary, I plan when I will build the slides and start\
    \ rehearsing.\n\nIf you are a new speaker, then you might not want to leave writing\
    \ the talk until it has been accepted at an event, and that is fine, but I sometimes\
    \ do the planning for two or three new talks at once and then build them when\
    \ they get accepted. Sometimes my new talk idea isn’t accepted at all; that can\
    \ happen, so I never spend time building a complex slide deck until I must.\n\n\
    ## Summary\n\nThe ability to communicate effectively with an audience is a major\
    \ skill that you can add to your professional toolbox. Presenting to an audience,\
    \ either as a public speaker or presenting to a room full of your peers, is a\
    \ skill that has many benefits. You will have the skills to put your point across\
    \ and influence people to believe in a cause that is important to you. Effective\
    \ communication skills will also help you excel in your career, as you will work\
    \ even better in a team environment.\n\nPublic speaking is also a fantastic way\
    \ to improve your self-confidence, critical thinking skills, and ability to network\
    \ with other like-minded people. Above all else, it is fun.\n\n## Workshop Questions\n\
    \n1.  Write down a list of personal goals that you wish to satisfy by designing\
    \ and presenting in front of an audience. These goals could be something like\
    \ the following:\n    *   Better research skills\n\n    *   Improved self-confidence\
    \ and so on\n\n2.  For each of the goals you listed in question 1, think specifically\
    \ about how being able to speak in front of an audience will help you. For example,\
    \ if your goal was to improve your self-confidence, then speaking will help you\
    \ push through a fear of being in the spotlight and having to think quickly if\
    \ someone asks you a question.\n\n3.  For each of the goals you have listed in\
    \ question 1, write down the success criteria so you will know how that goal has\
    \ been achieved.\n\n# 2. Writing Engaging Presentations\n\nThe presentation content\
    \ is the foundation of your public-speaking performance. People will judge your\
    \ overall performance based on the information they remember. A presentation needs\
    \ to have several qualities to make it good at conveying your message.\n\n## Centered\
    \ on a Relevant Problem\n\nEffective presentations focus on one problem. It is\
    \ important that the people you are talking to are familiar with that problem.\
    \ It is even better if they are already facing these issues, and they do not have\
    \ a solution, which is why they are coming to hear you talk in the first place.\
    \ If the topic you’re discussing doesn’t match the audience’s interests, they\
    \ will not be engaged, and all your effort will amount to nothing if you present\
    \ the wrong problem to the wrong group of people.\n\nMy presentations focus on\
    \ problems in my industry and professional fields—software development, personal\
    \ development, leadership, and security. Business owners and software developers\
    \ are interested in the most recent techniques in software development. The issues\
    \ I discuss vary depending on the group to which I am speaking.\n\nAn even more\
    \ important part of talking about a problem on stage is demonstrating how you’re\
    \ going to solve the problem. When people listen and engage in a presentation,\
    \ they want closure. Presenting a problem whets their appetite and makes them\
    \ want to listen. If you don’t present your version of the solution, they may\
    \ walk away from the presentation unsatisfied. This may create a wrong impression\
    \ of you as a professional, because you did not offer a solution as a good payoff."
  trans: "\n### 成为你所在领域内受尊重的权威\n\n最后一点，也是最重要的一点是，随着你面向更多大型会议的听众进行演讲，你将开始被视为所在领域的权威。成为权威不一定意味着你是该主题的顶尖专家。专家可以通过大量故事和亲身经历的个人例子来阐述观点，而权威则会运用丰富的情感和比喻来传达信息并吸引听众。当然，你完全可以既是一位权威，也是一位专家。\n\
    \n成为一名公众演讲者能让你在求职者中获得许多潜在优势。公开演讲被视为一项有价值的技能，这不仅体现在你所选的专业领域，也体现在你能够撰写并发表演讲，这意味着你有始有终的能力。你还会被视为一个极具自信的人，这在就业市场上份量十足。\n\
    \n撰写完演讲稿后，你就需要登上舞台或进入会议室，向听众发表演讲。如果你是为公司内部的活动做演示，这个流程可能会很快。但如果你计划在当地的技术交流小组或会议上演讲，若不做规划，从撰写到实际演讲之间可能会有很长的延迟。\n\
    \n较小的技术交流小组通常会提前数月预订演讲者，因此，在你规划演讲内容时，可以尝试联系当地的小组，与他们商讨日期。如果他们未来两三个月内有空缺的时段，那就值得预订下来并宣传这次演讲。这会给你充足的时间来撰写和排练演讲。在日程表上定下一个日期，会极大地激励你按时完成演讲稿。\n\
    \n如果你已经写好了演讲稿并正在练习，但最早的档期还在几个月之后，可以告知这些小组，一旦有临时取消的情况可以联系你——前提是你不介意这么做——这样他们可以将你列入候补名单。有些人可能会因各种真实原因在最后一刻退出，因此灵活应对会很有帮助。\n\
    \n许多技术交流小组都有自己的网站来管理预订，所以通过`谷歌`/`必应`搜索（或其他搜索引擎）就能找到它们。另一个用于预订和安排技术交流活动的常用平台是[`http://meetup.com`](http://meetup.com)。`Meetup`网站允许小组推广活动，参会者预订席位，演讲者联系组织者。`Meetup`一个有用的功能是允许你按地理位置搜索特定主题的交流小组，这让你能轻松找到附近的演讲机会。\n\
    \n如果你想在更大规模的活动上演讲，比如会议，那么你需要经历一个称为“征稿启事”（`CFP`）或“论文征集”（`RFP`）的流程。当会议处于规划阶段时，它会启动`CFP`流程，潜在的演讲者可以提交演讲主题供考虑。这个流程可能在活动日期前两到六个月内的任何时间开始。一旦`CFP`流程结束，演讲者提交了他们的演讲主题，会议评选小组就会审核所有提交的演讲，并通过挑选他们认为参会者会喜欢的演讲来制定可能的议程。\n\
    \n如果你有在会议上演讲的打算，那么你需要了解一年中会议的日程安排以及它们何时开放`CFP`提交，这意味着你需要提前规划。在会议上演讲需要大量的筹备工作，提前开始这个流程是值得的，甚至在你设计幻灯片之前就要着手。\n\
    \n当我为一个新演讲构思时，我会做大量的规划，并创建一系列思维导图来记录演讲内容。我们将在下一章探讨思维导图。接着，我会撰写演讲摘要并提交给会议。与此同时，我会用这份摘要向多个会议提出申请。只有在演讲被某个会议接纳后，我才会开始设计幻灯片。有了会议的接纳和日程表上的日期，我就会规划何时制作幻灯片并开始排练。\n\
    \n如果你是一位新手演讲者，你或许不想等到演讲被活动接纳后才开始撰写，这完全没问题，但我有时候会同时规划两到三个新演讲，然后在它们被接纳时再着手构建。有时候，我的新演讲创意根本不会被接纳；这种情况是可能发生的，所以我从来不会在必须之前就花时间构建复杂的幻灯片组。\n\
    \n## 总结\n\n与听众有效沟通的能力是一项你能添入专业工具箱的重要技能。向听众进行演示，无论是作为公众演讲者还是在满屋子同行面前发言，都是一项能带来诸多益处的技能。你将掌握传达观点并影响他人相信对你重要事业的能力。有效的沟通技巧还能帮助你在职业生涯中脱颖而出，因为你在团队环境中会工作得更出色。\n\
    \n公开演讲也是提升自信、批判性思维能力以及与志同道合者建立人脉网络的绝佳方式。最重要的是，它充满乐趣。\n\n## 思考题\n\n1.  列出一份个人目标清单，这些目标是你希望通过面向听众设计和演讲来实现的。这些目标可以是类似于以下内容：\n\
    \    *   提升研究技能\n    *   增强自信等等\n\n2.  针对你在问题 1 中列出的每个目标，具体思考在听众面前演讲的能力将如何帮助你实现它。例如，如果你的目标是增强自信，那么演讲将帮助你克服对成为焦点的恐惧，以及在有人提问时需要快速思考的压力。\n\
    \n3.  针对你在问题 1 中列出的每个目标，写下成功的衡量标准，这样你就知道该目标是如何实现的。\n\n# 2. 撰写引人入胜的演示文稿\n\n演示内容是你公开演讲表现的基石。人们会根据他们记住的信息来评判你的整体表现。一个出色的演示文稿需要具备若干特质，才能有效地传达你的信息。\n\
    \n## 围绕一个相关问题展开\n\n有效的演示文稿聚焦于一个问题。重要的是，你的听众必须熟悉这个问题。如果他们已经面临这些难题并且尚无解决方案，那就更好了，这正是他们前来听你演讲的首要原因。如果你讨论的话题与听众的兴趣不符，他们就不会投入，而如果你把错误的问题抛给了错误的群体，你所有的努力都将付诸东流。\n\
    \n我的演讲聚焦于我的行业和专业领域中的问题——软件开发、个人发展、领导力和安全。企业主和软件开发人员对软件开发的最新技术感兴趣。我讨论的具体问题会根据听众群体的不同而变化。\n\
    \n在舞台上谈论问题时，更重要的部分是展示你将如何解决这个问题。当人们聆听并参与到演讲中时，他们希望得到一个结论。呈现一个问题会吊起他们的胃口，让他们想听下去。如果你不提供你的解决方案版本，他们可能会带着不满离开演讲现场。这可能会让你作为专业人士留下错误的印象，因为你未能提供一个好的解决方案作为回报。\n"
- fmt: '# It Should Engage the Audience


    The presentation itself should be engaging for the people listening. Using great
    slides is one way to make the presentation engaging. You can incorporate presentation
    techniques such as storytelling, jokes, gestures, and directly addressing the
    audience to make your talk entertaining and engaging.


    I have always found that the presentations I enjoy the most center around storytelling.
    The story could be a real-life story, or a fictional story used to convey the
    message of the talk. People are hardwired to enjoy stories, so if you are presenting
    a subject that could be perceived as a little boring, weaving in a narrative can
    be a great way to increase engagement.


    The most engaging presentations are those in which the audience is focusing on
    you on the stage. Even though you might be using slides to convey your message,
    you don’t want the audience to simply focus on what is on the screen, as that
    takes their attention away from what you are saying. We will talk more about slide
    and presentation design later, but it is a good idea not to clutter the slides
    with a lot of text that requires the audience to read instead of listening to
    you.


    ## It Should Be Well Organized


    An excellent presentation makes use of a logical arrangement of information. The
    people listening to you will have trouble remembering your content if the information
    you present is not in a logical sequence. People usually associate a lack of organization
    with unpreparedness.


    Like a good story, your presentation should have a beginning, middle, and end—which
    is otherwise known as a three-act structure. In the beginning, your talk explains
    what you are going to cover, including introducing any problems you are trying
    to solve. In the middle of the talk, you present the main context for the problem
    you are solving or the subject you are speaking about. You also start introducing
    a solution to the problem. Then at the end of the presentation, you cover the
    final solution to the problem or the main point you are trying to make, followed
    by a summary of the key points you made in the talk before ending.


    If you stick to a simple structure like this, then it is easier to satisfy the
    expectations of the audience, and they will naturally know what to expect from
    your presentation.


    ## The Presentation Creation Process


    To become a master at public speaking, you first need to master the process of
    preparing for a presentation. Eventually you will come to designing your own process
    for building a talk, but for now, you can use the steps in this section.


    ### Prepare Your Script and Slides Way Before the Conference


    When preparing for your first talk, you might be tempted to stall until the last
    minute before working on your presentation. This habit will not cut it if you
    want to be successful as a public speaker. When people come to events—or even
    conferences that they have paid to attend—they expect the speakers to be professional
    and well prepared. They expect each talk to be as flawless as possible. A flawless
    presentation is only possible if you have practiced and revised it multiple times
    beforehand.


    Unfortunately, I have attended many conferences where I’ve seen speakers frantically
    rewriting their slides as I run through a final rehearsal in the greenroom. These
    last-minute changes are unprofessional and typically lead to a presentation that
    feels rushed. With inexperienced speakers, you can always tell when they completed
    their presentations at the last minute, as they regularly forget what is coming
    next in their slides. This introduces several awkward silences as their presentation
    flow is interrupted.


    Ideally, you should prepare your slides months before the event if it is a new
    talk. You will also need to practice using your slides to make sure that you know
    how the presentation flows. Have your family, friends, or colleagues listen to
    your presentation so that you can get their opinions. If this is not possible,
    you could also record yourself while practicing. Listening to your recordings
    will allow you to hear yourself presenting from a third person’s point of view.
    This is a fantastic way to discover what the presentation will sound like to an
    audience. It is better to do this as soon as you can and way before the event
    so that you can listen several times and make critical judgments about your performance,
    which will allow you to make corrections.


    You should also view your slides and compare them to presentations you’ve seen
    in the past. Study great presentations on YouTube and analyze the speaker’s slides.
    Find qualities that you like, such as color scheme, font type and style, and types
    of media used.


    You can then apply what you’ve learned from other presentations to yours. By working
    on your presentation in advance, you will be able to avoid cramming all the work
    into the week before the final presentation. You will also have time to evaluate
    your slides and your presentation as a whole and make changes if necessary.


    By preparing your slides ahead of time and practicing with them, you’ll be able
    to experiment with finding the most effective presentation methods well beforehand.
    By the day of the event, you would have practiced the presentation countless times,
    so you could do it even without using prompts.'
