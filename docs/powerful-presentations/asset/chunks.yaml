  trans: '

    ### 结束语


    结束语是最后的一两句总结，旨在为读者留下最后的钩子。在提供演讲的主要细节后，你可以陈述一个有趣的事实，或重申你试图解决的问题。本质上，你是在提醒读者，如果参加你的演讲，他们能获得什么。


    撰写演讲摘要的这四个步骤是一个指南，而非一套明确的规则。当然，你可以在摘要中自由发挥，但这些步骤提供了一种可靠的方法来写出引人入胜的演讲介绍。我并非一直遵循这种风格，但如果你需要从某个起点开始，它们会有所帮助。


    现在，让我们看看我发表过的四场演讲的摘要。这些是我最受欢迎的四场演讲，已被全球各地的会议接受，并且在要求参会者评分的活动中获得了极高的评价。我的演讲主题通常涉及软件开发、安全和个人生产力。即使你感兴趣的领域不同也没关系，关键在于原则，如下面的示例所示。


    **注意：** 演讲摘要除了演示文稿本身之外，是演讲设计中最重要的方面之一。如果你向会议投稿，演讲是否被接受将完全取决于摘要。一旦你被获准在活动中演讲，摘要就会成为主要的广告，用来鼓励人们优先选择你的演讲而非其他人的。


    ## 演讲 1：对抗分心的世界：提升专注力与自我驱动力


    《对抗分心的世界》是我从 2019 年开始在会议上发表的一篇关于生产力的演讲。它非常受欢迎，经常能坐满整个大厅，与会者反馈也很好。我在本书前面部分已经讨论过这个演讲的标题，以及我如何使用主标题和副标题来让读者对演讲内容有个好印象。


    在进一步分解摘要之前，我希望你先完整地阅读它。


    > *我们生活在一个科技奇迹的时代，互联网、高端游戏和流媒体服务都在争抢我们的注意力。我们从未有过如此多的重要创新可以随时随地在指尖获取。然而，伴随着所有这些系统，我们变得越来越分心，难以长时间集中注意力。如果任其发展，这些干扰会影响我们的工作、职业和自信心。我们需要能够打破这种分心的循环，同时仍能享受所有这些创新。*


    > *当我刚开始成为自由职业者时，我以为我将拥有终极的自由，可以随时做自己想做的事。某种程度上确实如此，但没有人监督我，让我保持责任感。我开始变得分心。过了一段时间，我决定必须做出改变。我开启了一段旨在变得更高效、更专注、更有动力的旅程——同时仍然偶尔会沉迷于狂刷
    Netflix。*


    > *在这个演讲中，我将分享我个人关于分心、动力不足和项目焦虑增加的故事。我也会分享我如何打破这个循环，找回创造力和高效的工作状态。*


    > *这个演讲面向任何渴望提高生产力但却每日与分心作斗争的人。我将涵盖以下主题：*


    * > *分心与拖延*

    * > *在工作中寻找意义*

    * > *自我激励*

    * > *控制点*

    * > *生产力与时间管理*

    * > *社交媒体成瘾*


    > *我现在认为自己非常高效，但达到这个状态是一场战斗。让我分享我的故事，这样我也可以帮助你变得高效和自信。*


    总的来说，这是一个我引以为豪的摘要，也是我较新的演讲之一。我们已经看过了标题，现在让我们进一步分析开头的钩子。


    > *我们生活在一个科技奇迹的时代，互联网、高端游戏和流媒体服务都在争抢我们的注意力。我们从未有过如此多的重要创新可以随时随地在指尖获取。然而，伴随着所有这些系统，我们变得越来越分心，难以长时间集中注意力。如果任其发展，这些干扰会影响我们的工作、职业和自信心。我们需要能够打破这种分心的循环，同时仍能享受所有这些创新。*


    我一开始就提醒读者，我们生活在一个美妙的时代，所有科技都触手可及。就拿不起眼的 iPad 为例，一块你可以随身携带的玻璃屏幕，可以访问任何你想要的信息、看电影、与家人朋友通话或玩游戏。不久之前，像
    iPad 这样的设备还是科幻小说的主打。我总记得《星际迷航》中的让-卢克·皮卡德在进取号星舰的休息室里，在一个看起来像平板设备的装置上查阅信息。我一直想要一个，现在我家里有好几个类似的设备了。

    '
- fmt: 'I then go on to state that as wonderful as these devices are, they are brilliant
    at distracting us—emails, notifications, phone calls, video calls, twitter messages.
    A lot of distractions will stop you from being productive. I state that if these
    distractions are left unchecked, our careers and self-confidence can be affected.
    I end the hook by reaffirming that we need to break this cycle of distraction
    yet still enjoy our technology. Here, I am trying to imply that we will try to
    sort this problem out in the talk, but it isn’t the talk’s purpose to make you
    give up technology.


    This is a strong opening hook, and after reading only these few sentences, you
    get an idea of the talk’s tone and content. Some conferences that have accepted
    this talk have displayed the talk title and my opening hook on the schedule page.
    The reader then must click on the talk to learn more.


    Next, in the synopsis, we have more information about the talk for anyone who
    was interested after reading the opening hook.


    > *When I first became self-employed, I thought that I would have the ultimate
    freedom to do what I wanted when I wanted. To a degree, I did, but I didn’t have
    anyone looking over me, holding me accountable. I started to become distracted.
    After a while, I decided things had to change. I began a quest to become more
    productive, focused, and motivated—while still indulging in the occasional Netflix
    binge.*


    In the next part of the synopsis, I introduce my personal story. My intention
    here is to hint to readers that I am not just going to talk through a series of
    tips—I am talking from experience. In my opinion, some of my favorite talks are
    based on the speaker’s firsthand experiences, which allows you to weave a story
    into the talk, and everyone likes a good story.


    Now, we hopefully have readers fully hooked. They know the theme of the talk and
    the introduction to my own personal story. Now let’s give them some more granular
    details.


    > *In this talk, I share my story of personal distraction, low motivation, and
    increased project anxiety. I also share how I broke this cycle and got my creative
    and productive mojo back.*


    > *This talk is aimed at anyone who strives to be more productive but struggles
    with distractions daily. I cover the following subjects:*


    *   > *Distraction and procrastination*

    *   > *Finding meaning in your work*

    *   > *Self-motivation*

    *   > *Locus of control*

    *   > *Productivity and time management*

    *   > *Social media addiction*


    If the reader didn’t pick up on the fact that I was going to be talking about
    my personal experiences, I make it obvious by telling them that this talk is about
    my story of distraction, low motivation, and project anxiety. I state that I am
    going to talk about how I broke this cycle. I am not telling my story for the
    sake of it; there is a purpose in talking about how I overcame a problem.


    I then mention who the talk is aimed at; in this case, people who want to be more
    productive and reduce distractions, which is probably everybody. I then list the
    main topics from the talk as a bullet-point list. This means there will be no
    ambiguity over what I am going to cover, as I state it outright. In fact, that
    bullet-point list ended up becoming the main section headings for the talk. Nobody
    could say that they didn’t know what the talk was going to cover, as I am quite
    direct.


    Some people might say that going to that level of detail is giving away what’s
    in the talk, but I disagree. They know the main subjects, but not all the nuanced
    content. This talk is one-hour long, and I speak, on average, for 55 minutes.
    There’s a lot in there.


    Finally, we move on to the closing statement.


    > *I now consider myself very productive, but getting there was a battle. Let
    me share my story so that I can help you become productive and confident too.*


    My closing statement is only two sentences, but they are specific. I first state
    that I now consider myself productive. In other words, I solved the problem, but
    it was hard. This signals to the reader that this is a battle that can be won.
    I then finish by saying that I will be sharing my story—just in case that wasn’t
    obvious already—and that I am going to help you become productive and confident.
    In other words, I am not only going to tell you a story, but I am also going to
    give you a solution.


    Of all the talks I have written, this is my personal favorite. That is why I talked
    about it first. When I give this presentation, attendees come to talk with me
    after the event or contact me privately to tell me how much they liked the talk
    and how it helped them, which is incredibly humbling. Much work went into writing
    the talk, and a lot of effort went into trying to craft the perfect—in my eyes—synopsis.
    I didn’t write this synopsis on a single attempt; it took a few revisions.


    The next talk I want to cover is completely different in that it is aimed at an
    extremely specific technical audience.'
