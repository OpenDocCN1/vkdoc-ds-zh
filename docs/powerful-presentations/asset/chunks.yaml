- fmt: "#### Be Careful of Where You’re Looking\n\nWhen presenting online through\
    \ a webcam, you need to be aware of where you’re looking. It is quite natural\
    \ to look at your monitor or laptop screen while you’re talking about what is\
    \ on your slides. However, to the attendees watching, it looks like you’re not\
    \ looking at them directly. To address this problem, make sure you look at your\
    \ webcam—you don’t necessarily want to do this constantly, you should do it regularly\
    \ throughout the presentation.\n\nA good trick is to stick two of those plastic\
    \ googly eyes onto the webcam, and for some reason, you’ll feel compelled to look\
    \ at the eyes. When we have real conversations with people, we look into their\
    \ eyes, and this has the same effect. It is a great technique to ensure that you\
    \ make regular eye contact.\n\n#### Don’t Overcomplicate Your Speaking Setup\n\
    \nWhen the pandemic took hold in early 2020, and it became obvious to everyone\
    \ that they would have to work from home and make use of video conferencing software,\
    \ there was a sudden rush of people buying webcams, lighting, and all sorts of\
    \ gadgets for turning a humble video call into a full-scale television production.\
    \ Along with all this fancy hardware, people used software like `Open Broadcast\
    \ System` to put together different production scenes that they could switch to\
    \ mid-presentation, just like a news broadcast.\n\nThis is all impressive but\
    \ unnecessary. I am not saying that you should never experiment with techniques\
    \ like this. It is fun to play around with, but I have attended a lot of presentations\
    \ that, while technically impressive, were quite shallow, as the presenters focused\
    \ more on the delivery style than the content. This wasn’t always the case. Some\
    \ people did fantastic talks with this technology, but they were very experienced\
    \ speakers.\n\nI don’t mean to be a party pooper—by all means play with this stuff—but\
    \ don’t forget the most important piece of the puzzle: constructing and delivering\
    \ a great talk. Provided your talk is well structured and well rehearsed, people\
    \ will love what you have to say. If you don’t master these essential pieces first,\
    \ then your talk will be boring, even if it looks great.\n\nPublic speaking is\
    \ a simple transaction. Someone comes to your talk, hopefully enjoys it, and then\
    \ moves on, enlightened by your main topic points. Nobody will be thinking three\
    \ months later that they really enjoyed that talk because multiple scenes were\
    \ triggered in the `Open Broadcast System`. It is simply a delivery mechanism\
    \ and not as important as the actual content of your talk. Don’t over-engineer\
    \ it until you master the basics.\n\n## Summary\n\nWe have come to the end of\
    \ this book on public speaking. Speaking in front of people is usually a task\
    \ that fills people with fear and dread. I certainly felt no different when I\
    \ first started out. I used to suffer from a lot of anxiety about the idea of\
    \ speaking in front of a large group. Of every challenge I’ve ever overcome in\
    \ my life, public speaking is the one that I’m most proud to have conquered. Public\
    \ speaking has given me a new sense of self-confidence, and it has opened many\
    \ fun opportunities to speak at world-class events, which has enabled me to travel\
    \ the world. If I can do it, so can you.\n\nThe overall theme of this book is\
    \ that preparation is the key to success. From researching your topic, building\
    \ your slides ahead of time, practicing until you have the talk memorized, and\
    \ planning for failure on stage, if you prepare ahead of time, then you can reduce\
    \ your performance anxiety and deliver a fantastic talk.\n\nTo be a public speaker,\
    \ you don’t have to be an expert in your field. Talks can be pitched at different\
    \ levels, so there will always be an audience that knows less about the subject\
    \ than you. Provided you pitch the talk at the appropriate level, you will be\
    \ fine. For example, if you are doing a talk about learning the Java programming\
    \ language and you are a beginner or intermediate programmer, you wouldn’t advertise\
    \ the talk as an advanced-level talk; otherwise, the wrong audience will attend.\
    \ On the flip side, if you are delivering an advanced Java talk but advertise\
    \ the talk to beginners, you will lose people in the audience, as they will be\
    \ expecting a beginner’s talk.\n\nMy aim in writing this book was to give you\
    \ all the tools you need to succeed but in a short space of time. I would prefer\
    \ you read this book quickly and then spend your time applying the techniques\
    \ as opposed to wading through a 400-page tome, forgetting half the information,\
    \ and then not having time to prepare the talk you have imagined.\n\nWith that\
    \ said, thank you for buying and reading this book. I really hope that what I\
    \ have covered in these pages will help you research, plan, prepare, and deliver\
    \ a fantastic talk on your chosen topic. I wish you the best of luck.\n\n## Workshop\
    \ Questions\n\n1.  Practice the visualization techniques discussed earlier in\
    \ the chapter, where you imagine giving a successful presentation and the audience\
    \ gives you a huge round of applause. Preparing these visualizations can help\
    \ to relieve any anxiety.\n\n2.  Practice the square breathing technique so that\
    \ you are familiar with it and its calming effects.\n    *   Breath in for four\
    \ seconds so that air fills your lungs.\n    *   Hold your breath for four seconds.\n\
    \    *   Slowly exhale your breath for eight seconds.\n    *   Without taking\
    \ a break, go straight back to the first step and fill your lungs again.\n\n3.\
    \  Pack and prepare your bag of cables, dongles, and adapters prior to attending\
    \ your event. Consider the following:\n    *   Charger for your laptop\n    *\
    \   International power adapters if travelling to another country\n    *   HDMI\
    \ adapter (possibly a few different brands)\n    *   VGA adapter (some venues\
    \ have very old projection systems)\n    *   Slide navigator device (which allows\
    \ you to move away from your laptop while on stage)\n    *   USB memory stick\
    \ with backups of all the files you need for your presentation\n\n4.  If you are\
    \ planning on presenting to a virtual, online audience, then install the main\
    \ platforms and familiarize yourself with them. Platforms to consider are:\n \
    \   *   Zoom\n    *   Teams\n    *   Google Meet\n    *   Cisco Webex"
