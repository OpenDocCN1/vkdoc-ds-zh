  trans: '

    ### 确立演示主题或问题


    你应在演示的开头部分与观众共同确立问题；这将确保你们处于同一认知层面。


    在呈现问题时，你的挑战在于让观众重视问题，并让自己被视作权威。若你有选择演示主题的余地，请挑选自己经验丰富的领域。多数情况下，演讲内容会围绕你的工作或个人兴趣展开。


    在演示开头呈现问题的相关证据，以及能让观众更加关注该主题的信息，是个明智的做法。对你而言重要的问题，对观众可能未必同等重要，因此你需要描绘一幅图景——或许通过一个故事——来唤起观众的关注。理想情况下，你希望观众在听到问题描述时能与你产生共情。若能引导他们透过你的视角看待问题，使其设身处地思考，那么你就能在整个演示过程中牢牢抓住他们的注意力。


    在观众心中确立问题的有效方法之一是呈现相关数据与事实。例如，在向企业主进行软件安全演示时，你可从讲述遭受黑客攻击和数据泄露的企业数量统计入手。你也可以考虑列举企业主身份被盗并在网上泄露的具体案例。你甚至可以补充这些安全漏洞给受害者造成的经济损失，因为财务后果总是确保观众参与度的绝佳手段。如果观众都是企业主，他们更有可能认真听后续的演讲，因为这与他们面临的问题息息相关。


    在选择演示要探讨的问题时，你应心中装着目标受众，为其创建一个人物画像。思考观众群体的典型特征：他们是否属于同一行业？是否有共同的兴趣或爱好？若有，他们在爱好或工作中会遇到哪些共同问题？他们希望从你这里听到哪些与你专业领域相关的内容？


    通过创建符合总体受众画像的人物模型，你将能够预判观众的需求，从而选择相应的话题和问题进行讨论。你还能根据他们的需求来设计演示幻灯片。


    例如，过去我曾在会议上就敏捷软件开发发表过演讲。对此类演讲感兴趣的典型人物画像是软件开发人员——他们是技术性很强的人。向这类人群发表演讲时，他们期望获得大量细节和具体事实，并有展示原则应用的实例作为支撑。


    我也曾在另一场活动中发表过同样的演讲，当时的观众是软件公司的经理及其领导团队成员。这场演讲的人物画像就不同了，他们对演讲成果的期待也不一样。尽管我向经理们做的演讲中
    70%的内容与面向软件开发人员的相同，但我必须调整演讲以适合观众。在那个以非技术专业人士为主的群体中，我不得不删除一些更侧重于软件开发的内容，并将演讲调整得更为通用、更贴合听众。我关于软件团队使用敏捷开发技术益处的核心信息没有变，但他们不需要软件开发人员观众所期待的那么多底层技术细节。


    ### 设立演示目标


    每次向观众呈现内容时，你都希望演示能带来某种成果；演示需要有一个最终目标。大多数演示在这方面是失败的。在听完缺乏目标的演示后，观众没有动力去改变自己的行为。演示未能鼓励观众针对问题采取行动。


    我曾听过许多演讲，演讲者呈现了大量有趣的信息，但随后他们突然说道“谢谢聆听”，演讲便戛然而止。在这些情况下，观众没有得到任何回报或令人满意的最终目标。


    演讲的目标之所以重要，是因为它能给观众带来一种义务感。这就像在说：“我已尽我所能创作内容并呈现信息。现在轮到你来运用所学的知识了。”


    当你确立了演示的目标后，就该创建行动号召了。行动号召是一条信息，它明确告诉观众在演讲结束后如何运用这些信息。理想情况下，行动号召应简洁明了、直击要点。同时，行动号召最好也能惠及听众。换句话说，通过遵循你所呈现的内容，观众的生活、职业等应能因此得到改善。你的演讲不必改变人生，但若能产生这样的效果，那自然令人印象深刻。更进一步，观众应该能从你的内容中获取一些益处，而非仅仅是一场信息灌输。


    行动号召还为你提供了一个绝佳的机会，围绕你的主题领域建立社群。你可以告诉观众，你已在自己的网站上发布了一篇关于刚才所做演示的文章。这样，如果他们愿意响应你的行动号召，就可以在演讲结束后访问你的网站了解更多信息。通过运用此类技巧，你将鼓励人们访问你的网站，浏览你提供的所有内容。如果你设置了邮箱采集工具，他们可能会选择订阅你的网站内容。这一技巧对咨询行业人士也很有帮助。你在网站上发布的信息将进一步巩固你在该行业的权威地位。如果你的业务围绕这些内容展开，这一技巧还能显著提升你的收入。


    **注意**


    理解你的总体目标对于撰写和呈现一场有效的演示至关重要。没有目标，你的演示将漫无目的地在各个主题间游荡，最终毫无收获。

    '
- fmt: '### Information Gathering and Research


    Now that you have a topic to talk about and you have a goal for your presentation,
    it’s time to gather information about what you are going to present. In other
    words, it’s time to do some research. You should have both the topic and your
    purpose for the presentation in mind when deciding what information to include.
    For this part, you will need credible sources to support the points that you are
    about to make. You will also need to start thinking of the different ways to organize
    all the information in a way that will engage your audience.


    To begin, you’ll need to gather your information resources. This could include
    books, blog posts, online articles, or scientific journals. Much of the information
    you will use could be based on your experience with the topic. You could also
    review textbooks specific to your industry to see how they introduce topics.


    The most valuable forms of information are those that your audience will not have
    easy access to. If you are presenting information that is not easy to come by,
    you are already providing value to your audience, as they can learn something
    that they might not easily get from a blog post or YouTube video. This could include
    the data that you collated and analyzed with your team. It could also mean sharing
    the details of a failed project you worked on—people always love hearing about
    failures and how to avoid them.


    All the information included in your presentation should be related to the goal
    that you want to achieve. A public speaker encouraging people to recycle, for
    example, should present data that supports why they should recycle their rubbish.
    Any data that is not related to the argument of recycling should not be included
    in the presentation.


    I suggest that you include all your sources in your slides, so remember to copy
    the source details when you compile your information. This way, you will not forget
    where you got your data. You can cite sources in your presentation in multiple
    ways. While presenting the data, you could also have the name of the source and
    the date when it was published in the corner of the slide. You could include one
    slide at the end that compiles all your sources so that the audience can fact-check
    the data you presented. This is especially important when your information is
    unexpected or potentially controversial.


    ### Presenting Data in the Most Engaging Way


    When you find the data and information that you want to talk about in your presentation,
    you should start thinking of the best way to present it to the audience. For data,
    the best way depends on the reason you are including it in the first place. You
    could use graphs and other visual tools to help with your audience’s comprehension.
    You might also decide to use photographs or illustrations that convey the point,
    theme, or emotion of what you want to present.


    Numbers that show the declining governmental budget in education, for example,
    might be displayed better by using a line graph. In contrast, it would be better
    to use a pie chart to compare the distribution of resources. Most presentation
    software packages are equipped with tools for creating these visual aids. It is
    your task, however, to choose the most appropriate method for presenting the data.


    Using these methods to present information is much better than cramming a lot
    of text or bullet points onto slides. No one wants to read a lot of text or wade
    through bullet points while they are trying to listen to you. Honestly, I think
    it’s better to use as few slides as possible to present information or express
    your point. It is always preferable to convey meaning in two slides as opposed
    to ten, so making use of visualization tools to present information will always
    be beneficial. If you’re filling your slides with a lot of text, this is a sign
    that your slides will not engage your audience—find another way to present the
    information.


    ## Choosing a Presentation Style


    At this point, you already have data that will support the points you want to
    make in the presentation. You should also have an idea of how you will present
    this data—graphs, charts, photos, or illustrations. You can now start looking
    for the best way to present this data so that your presentation will be entertaining
    and easy to remember. To do this, you will need to choose a presentation style.


    There is no one best style of public speaking and presenting. Many people tend
    to neglect picking a style that entertains people. A presentation is as much about
    art and performance as it is about conveying data. To make your presentation more
    engaging to your audience, you will need to insert your personality into the delivery.


    The presentation style is important because it will guide the creation of your
    design. To find a suitable style that fits your personality, you could investigate
    the styles of other successful presenters. YouTube is a fantastic resource when
    it comes to finding existing talks to watch. I view many talks on YouTube, partly
    to learn new information, but most of the time, I watch them to look at other
    speakers’ presentation styles and their delivery. Let’s discuss some styles here.


    ### Highly Visual Presentation


    A public speaker using a highly visual style makes use of the slides to complement
    the narrative that the speaker will convey on stage. Their slides are there to
    back up the narrative and not as the focus. The presentation, in this case, starts
    with the script, which doesn’t need to be fully written, but rather an idea or
    outline of what the speaker will say to the audience. Your presentation’s words
    and information should be highly engaging in this style to be effective because
    the slides will not contain a lot of text, charts, or diagrams.


    One example of this style in practice occurred when Steve Jobs presented the first
    iPhone. In his presentation, he used suspense and humor to maintain the users’
    engagement in the presentation. People watch these presentations because they
    are entertaining, and they are interested in new types of consumer technology.


    In his presentations, Steve Jobs’ slides rarely contained much text. Instead,
    his presentation narrative delivered the message. The slides presented perfectly
    timed images and text that worked well with the script. When presenting the touchscreen
    feature of the iPhone, for example, Jobs doesn’t say that you could use your fingers
    to tap on the phone’s screen. Instead, he introduced suspense by first talking
    about how the smartphones at the time had challenges in managing QWERTY keys and
    some phones used a stylus. Steve Jobs’ narrative then hints that you can use your
    fingers to control the device. Just as he says this, he uses the clicker to show
    an image of a finger touching the surface of the iPhone on the slide. He used
    the visuals on the slide to illustrate what he was saying.


    While this may all seem simple, it takes a great deal of practice to pull this
    off. You will need to pick suitable images and practice the timing of when to
    make those images appear.


    People new to public speaking tend to use their slides as crutches so they don’t
    forget what to say. They do this by cramming too much information on the slide
    so they can look at it and remember what to say. If you are using a more visual
    presentation style, your slide content will be more minimal, so you can’t use
    them as prompts. The slides are there to support what you are saying, not the
    other way around. Using a more minimal style that uses images instead of text
