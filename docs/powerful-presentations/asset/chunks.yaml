  trans: '

    ### 通过小胜利建立自信


    随着你在面向大众演讲方面积累经验，你最终会形成自己的方法来防止焦虑。大多数经验丰富的演讲者通过提醒自己过去的成功，来学会避免怀疑性思维以及其他可能影响他们表现的各种焦虑想法。


    当你刚开始时，可能没有太多经验可以从中汲取自信。然而，你可以创造属于自己的成功感，以此来提醒自己你能行。例如，在一次大型会议演讲之前，你可以先承担一些自己容易组织的小型用户组演讲。


    在我面向大型会议和活动演讲之前，我曾在小型聚会小组中练习演讲。有些我演讲过的小组只有大约十名听众，但那没问题，因为我正在积累经验。在挑战大型专业会议之前，我在许多聚会小组中发表过演讲。


    当轮到我登上大型舞台，向数百人演讲时，我可以回顾自己参与过的所有聚会小组演讲。我能记起所有的成功，并用这些来安慰自己：我能做到，并且会成功。这是一个简单的技巧，但在关键时刻确实能发挥作用，因为在那种紧张时刻，你会遭受严重的自我怀疑。


    ### 让自己专注于演讲


    当你站在舞台上时，除了像练习时那样进行演讲之外，别无他事。在这个阶段，你需要让自己的思绪专注于手头的任务。你需要控制大脑，避免它游移到与演讲无关的其他想法上。


    当你开始演讲时，我提到过做一些基本的呼吸练习来清空大脑。从那时起，你应该让自己的思绪专注于下一步需要做什么。当你被某个随机的想法或周围环境分散注意力时，立即通过看向笔记本电脑、舞台屏幕或提示卡片，让自己重新回到演讲中；这应该能让你回到专注于演讲的精神状态。


    随着你获得更多经验，专注于演讲的练习会变得更容易。你的大脑会本能地屏蔽环境中的干扰。你也会习惯性地遵循自己的演讲流程。你将能够培养出对干扰想法的强大抵抗力。


    如果你随身带着手机，我建议将其调成飞行模式或关机——除非你正在使用计时或秒表功能。你最不希望发生的事就是在演讲期间接到电话。如果你忘记关机，而有人试图给你打电话，显然，你不应该接听。试着忽略它，或者巧妙地拿出手机并拒接来电。不过，静音的手机不会打扰你，所以尽量在开始演讲前确保将其静音。


    ### 适应演讲中的变化


    在理想情况下，你希望尽量减少演讲中的即兴发挥。但有时，某些情况会阻止你按练习的方式完成演讲。例如，你依赖的一些工具可能无法正常工作，或者某个演示就是运行不了。有时，你可能会在最后一刻想到一些想要补充的新想法。


    你应该准备好适应演讲中的变化。业余的公开演讲者在看到自己演讲的某个部分进展不顺利时，常常会抱怨。但这并不能解决问题。当你遇到这种情况时，尽量避开这类借口。相反，你需要想出一个解决问题的办法，让你即使遇到障碍也能顺利完成演讲。


    在本书前面，我谈过如何缓解网络问题和演示失败的情况。如果你是在进行技术演讲——以我为例，是软件开发演讲——遭遇演示失败是相当常见的事。无论你练习了多少次，在面对大量听众站在舞台上时，似乎总会出现问题。如果你没有准备，一次演示失败可能会完全破坏你的演讲，并击碎你的自信。


    当然，你可以为此种意外情况做好准备。我个人曾多次遭遇演示失败，但因为我有预案，总能成功完成演讲，并且听众也获得了他们想要的信息。听众并不在意演示是否失败；他们想要的是你的信息和见解，所以不要害怕使用你的备用幻灯片或预先录制的演示视频。


    有时，在演讲即将开始前，你会想到一些新想法。理想情况下，你不应该考虑对你练习过的演讲进行改动；已经太晚了。这些改动只会打乱你的节奏，因为你没有练习过这些新增内容，除非你是一位经验丰富的演讲者，否则这些未经练习的添加物会非常明显地被听众察觉。不过，你可以记下这些想法，并在以后版本的演讲中加入，这样你就有机会练习它们了。


    如果你的演讲是全新的，那么你无疑会看到可以改进的地方，所以记下它们，稍后再融入进去。不要试图即兴发挥。坚持原计划。


    ## 处理提问


    公开演讲中，比演讲本身更能让演讲者感到恐惧的，往往是最后的问答环节。演讲者害怕这个环节是很自然的，刚开始时我也一样。在整场演讲中，你掌控着局面，你控制着故事和节奏，一切由你主导。当演讲结束，你向听众开放提问环节时——你确实应该这样做——对局面的严格掌控可能会发生变化，因为听众会更有主动权，你完全不知道他们会问什么。


    不过，我可以给你一些建议，让问答环节不那么可怕。记住，你不必是自己选定主题的世界头号专家，不知道答案或不能马上回答也没关系。


    ### 告知听众你希望何时提问


    在开始演讲的介绍部分时，让听众知道你希望他们以何种方式提问。有些演讲者非常乐意在演讲过程中被举手提问打断，并随时回答问题。而包括我在内的其他演讲者，则更希望人们等到最后再提问，因为我可能无论如何都会回答他们的问题；他们只需要等待。不过，一定要表明你的偏好，因为这样可以避免有人打断你时你感到恼火。


    ### 回答前先思考


    当有人向你提问时，先用几秒钟思考一下你的回答，然后再作答。听众不会注意到这短暂的停顿，而这给了你理清思路的机会。仓促地回答一个问题可能会让你出错，你可能会说错话；紧张情绪会导致这种情况。


    ### 不要害怕要求重复问题


    在大房间里，尤其是在会议场所，会有很多背景噪音。如果你没听清问题，请听众澄清或重复一遍。有些会议现场会有拿着麦克风的工作人员，他们会走到提问者身边。那样的话，提问者的声音会通过公共广播系统传送过来，但如果听众是直接喊出问题，那么如果他们在房间后面，你很可能很难听清他们说什么。

    '
- fmt: '### Repeat the Question so Everyone Can Hear


    If there’s no one in the room to run a microphone to the person asking the question,
    chances are that most people will not hear the question. It is always a good idea
    to repeat a question before you answer it; otherwise, people will only hear the
    answer without the question for context.


    Not only is repeating the question a courtesy for the people in the room, but
    if the talk is being recorded for the conference website or `YouTube`, then repeating
    the question will make sense for the people watching the video.


    ### Remain Positive


    Answering random questions at the end of your talk can feel stressful, as you
    have no idea what the audience will ask. They may ask simple questions to clarify
    something you mentioned in the talk. Those questions are always easy to deal with.
    You may get someone talking about an alternative option to what you discussed;
    they are always appreciated as you learn something new. You may get the “Well,
    actually” person who simply wants to make you feel dumb by correcting you; they
    are always a little harder to deal with. No matter what the question or comment
    is from the audience, always thank them for their questions, suggestions, or insights.


    On the extreme end of the spectrum, you may get someone who disagrees with everything
    you have said, and boy, do they want you to know it in front of 200 other people.
    No matter the scenario, always remain positive, and if an audience member is being
    a jerk, never have a go at them. In all my years speaking, I have only ever had
    one person whom I thought was being a jerk during the `QA` section. My talk was
    on cryptography using the `Microsoft Dot NET` platform, specifically on the libraries
    provided by `Microsoft`. However, one audience member wasn’t happy with that and
    essentially tried to tell me I was an idiot because I wasn’t talking about a specific
    third-party cryptography library, even though the talk description specifically
    stated it was about the default libraries provided by `Microsoft`. There isn’t
    much you can do, except thank them for the question, and in this case, I reminded
    them that the talk was about the `Microsoft`-specific libraries and then moved
    on.


    If you get someone who comes across as though they’re looking for trouble, never
    argue or lose your temper because they will take your words out of context and
    try to make you look bad on social media. This is rare, but remain positive and
    polite if it happens.


    ### Be Truthful and Never Lie


    You are bound to get someone who asks a question that you don’t know the answer
    to. If that happens, don’t worry; it’s not the end of the world. When put on the
    spot, no one knows the answer to everything. If this happens, then just say you
    don’t know but will find out. Most audience members are very understanding. What
    you should never do is try to bluff your way through the answer or simply tell
    a lie, as you will be found out.


    A great technique I have used many times is to redirect the question to the audience.
    In the heat of the moment, you may struggle to think, even if you ordinarily would
    know the answer; the stress of being on stage can cloud your mind. If you ask
    the audience the question, someone can have a go at answering it. By doing this,
    the attendee who asked the question gets an answer and is happy, and you have
    the pressure taken off you. Also, as the question is answered, it may help to
    unblock your memory if it is about something you thought you knew but just couldn’t
    remember.


    If an audience member does help and provides an answer, make sure to repeat their
    answer in full so everyone else in the room can hear, and remember to thank them.


    As speakers, we’re not perfect. We can’t remember the answer or know the answer
    to every question, so use the audience to your advantage and get them to help.
    No one will mind, and everyone will benefit from the answer. You may even learn
    something new yourself, which is always nice.


    The question-and-answer section of a talk can fill even the most experienced speakers
    with dread, but it doesn’t have to. If you prepare and accept the fact that you
    can’t answer everything, you will feel more relaxed. In the previous chapter,
    I suggested practicing your answers for possible questions. This is a vital preparation
    tip, and you can often anticipate most questions that will be asked and then prepare
    answers to them. For everything else, don’t panic, just remain positive. As I
    suggested earlier, if you really can’t answer the question, just say so, and then
    redirect the question back at the audience. If you go in with this mindset, you
    can drastically reduce the level of anxiety you will face.


    ## Online Talks and Webinars


    When we think about public speaking, we assume we are talking about someone standing
    on a stage and addressing an audience or speaking to peers in a boardroom. While
    this is the conventional idea of public speaking, it isn’t the only option. Public
    speaking includes presenting online to an audience as a webinar or as a more interactive
    online facsimile of real talk.


    ### Webinar vs. Online Talk


    When thinking about the form of online talks, a webinar might come to mind first.
    A webinar consists of someone speaking to their computer via a webcam and microphone,
    and there could be anything from one to thousands of people signed up to watch
    the talk. Typically, as the speaker, you can’t see the audience members; you are
    simply broadcasting to any number of people online. You may have a small amount
    of interactivity via a chat window where people can post comments and questions,
    but generally you are not watching this window until the end.


    Online talks are like webinars and are often seen as the same thing; however,
    there are a few subtle differences. If you are speaking via a platform like `Zoom`,
    `Microsoft Teams`, `Google Hangouts`, or any of a myriad of conferencing platforms
    that have sprung up, then as you are speaking, you can access a gallery view of
    your audience. If the members of the audience have their cameras turned on, you
    can even see them.


    Being able to see the participants when using these platforms makes the experience
    feel like an in-person public speaking event. In reality, it is nothing like the
    real thing; however, these platforms do have their advantages.


    The main advantage is geography. To speak at an in-person event, you must get
    all the attendees in the same place at the same time. People could drive, use
    public transport, or even fly to an event. This means that some events are hard
    to get to and not as inclusive as we might otherwise want. Tickets for in-person
    events can be quite expensive, and that’s before you factor in travel, accommodations,
    and general expenses like food and drink.


    With an online event, you remove that geographic barrier, which opens the event
    to many more people. Being online also reduces attendees’ costs quite significantly,
    as you don’t have to travel, book hotels, and pay for other expenses.'
