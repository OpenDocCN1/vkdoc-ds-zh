  trans: '

    ### 复述问题，确保人人听清


    如果提问者所处位置没有麦克风供其使用，那么很可能大多数人无法听清问题。在回答问题之前先复述一遍问题总是个好主意；否则，听众只能听到答案而缺乏问题背景。


    复述问题不仅是对在场听众的礼貌，如果演讲内容要为会议网站或 `YouTube` 录制视频，那么复述问题也会让观看视频的人更好地理解内容。


    ### 保持积极心态


    在演讲结尾回答随机提问可能会让你感到压力，因为你无法预知听众会问什么。他们可能会问一些简单的问题，以澄清你在演讲中提到的内容。这类问题通常很容易处理。你也可能会听到有人讨论与你所述内容不同的替代方案；这种交流总是值得感谢，因为你能学到新东西。你也可能会遇到那种只想通过纠正你来让你难堪的“那个么，实际上……”类型的人，他们往往更难应付。无论听众提出什么样的问题或评论，都要感谢他们的提问、建议或见解。


    在最极端的情况下，你可能会遇到一个反对你所有观点的人，而且，天哪，他们就是想当着另外 200 个人的面让你知道这一点。无论何种情况，始终保持积极心态。如果某个听众故意刁难，绝不要与他发生冲突。在我多年的演讲生涯中，我只遇到过一个人在
    `QA` 环节表现得像个无礼之徒。我那次演讲的内容是关于使用 `Microsoft Dot NET` 平台的密码学，特别是关于 `Microsoft` 提供的库。但有一位听众对此并不满意，基本上是想说我是个白痴，因为我没有讲某个特定的第三方密码库，尽管演讲描述中明确说明这是关于
    `Microsoft` 自带的默认库。你对此能做的很有限，除了感谢他的提问，在这种情况下，我提醒他这次演讲是关于 `Microsoft` 特定库的，然后继续往下讲。


    如果你遇到一个看起来像是来找茬的人，绝不要争论或发脾气，因为他们会断章取义，试图在社交媒体上让你难堪。这种情况很少见，但如果发生了，请保持积极和礼貌。


    ### 诚实守信，绝不撒谎


    你一定会遇到有人问一个你不知道答案的问题。如果发生了，别担心；这并非世界末日。当场被问到时，没人能回答所有问题。如果出现这种情况，只需说你不知道，但会去查明答案。大多数听众都非常理解。你绝对不应该做的事，就是试图虚张声势地蒙混过关，或者干脆撒谎，因为你迟早会被揭穿。


    我有一个用过很多次的好技巧，就是把问题抛回给听众。在紧张时刻，即使你通常知道答案，也可能一时想不起来；上台的压力会让你思维混乱。如果你向听众提问，也许会有人尝试回答。这样做，提问的人得到了答案会感到满意，你的压力也卸下了。而且，随着问题被回答，如果你问的是自己认为知道但一时记不起来的，这也许会帮助你恢复记忆。


    如果有听众真的帮忙并提供了答案，一定要完整复述他们的答案，确保室内所有人都能听到，并记得感谢他们。


    作为演讲者，我们并非完人。我们记不住答案，也无法回答每一个问题，所以利用听众的优势，请他们帮忙吧。没人会介意，而且每个人都能从答案中受益。你自己甚至也可能学到新东西，这总是件好事。


    演讲的问答环节，即使是最有经验的演讲者也会感到恐惧，但它并非必然如此。如果你做好准备，并接受自己无法回答所有问题的事实，你会感到更放松。在上一章中，我建议为你预判可能的问题准备答案。这是一个至关重要的准备技巧，你通常能预测到大部分会被问到的问题，然后为其准备答案。对于所有其他问题，不要惊慌，保持积极心态。正如我之前建议的，如果你真的无法回答问题，就直说，然后把问题抛回给听众。如果你以这种心态去应对，就能大大降低将要面对的焦虑程度。


    ## 线上演讲与网络研讨会


    当我们想到公开演讲时，我们通常认为指的是某人站在舞台上向听众致辞，或在会议室里向同行发言。虽然这是公开演讲的传统概念，但它并非唯一的选择。公开演讲还包括以网络研讨会的形式在线向听众进行演示，或者作为更具互动性的线上模拟真实演讲。


    ### 网络研讨会 vs. 线上演讲


    在思考线上演讲的形式时，你可能首先想到的是网络研讨会。网络研讨会由一个人通过网络摄像头和麦克风对着电脑讲话组成，报名观看演讲的人数可以是从一个人到几千人不等。通常，作为演讲者，你看不到听众；你只是向任意数量的在线观众进行广播。你可能通过一个聊天窗口获得少量的互动，观众可以在那里发表评论和提问，但通常你直到最后才会去看这个窗口。


    线上演讲类似于网络研讨会，并且常被视为同一回事；然而，两者存在一些细微差别。如果你通过像 `Zoom`、`Microsoft Teams`、`Google
    Hangouts` 或任何其他涌现出来的众多会议平台进行演讲，那么当你讲话时，你可以看到听众的“画廊”视图。如果听众打开了他们的摄像头，你甚至能看到他们。


    在使用这些平台时能够看到参与者，让这种体验感觉更像是一场面对面的公开演讲活动。实际上，这和真实情况完全不同；不过，这些平台确实有它们的优势。


    主要优势在于地理方面。要进行现场演讲，你必须让所有与会者在同一时间聚集到同一地点。人们可能需要开车、乘坐公共交通甚至乘飞机才能参加活动。这意味着有些活动很难参与，并且不像我们可能希望的那样具有包容性。现场活动的门票可能相当昂贵，这还没算上路费、住宿以及餐饮等一般性开支。


    而通过线上活动，你消除了地理障碍，这能让更多的人参与到活动中来。线上形式也能显著降低与会者的成本，因为你无需旅行、预订酒店以及支付其他开销。

