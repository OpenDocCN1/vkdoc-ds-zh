  trans: '

    ## 注意演讲时长


    演讲时的计时同样至关重要，尤其是当你的演讲时长固定时。在会议上，主办方通常会为每位演讲者分配特定的时间。必须严格遵守这一时间安排，因为组织者需要确保每位受邀演讲者都有充足的时间，同时不影响其他人的既定时段。


    会议还会公布具体的时间表，供参会者规划行程。如果你超时，可能会给参会者带来糟糕的体验——他们可能为此支付了高额费用。


    确保幻灯片中的所有内容都能在规定时间内讨论完毕，这向观众展示了你的专业素养以及为活动所做的充分准备。在公开演讲中时间不够用，是准备不足的表现。练习演讲时，为自己计时，确保不会超时。


    在演讲当天，你要预料到所有可能出错的环节。要预想各种延误，它们可能会缩短你的演讲时间。为此，请根据实际拥有的时间调整演讲内容。如果演讲时间比预期的短，找出演讲中可以加快讲解或直接跳过、以便为更核心内容让路的部分。知道在必要时可以删减哪些内容，是重要的一步准备。希望你不会在最后一刻需要删减内容，但脑中留一份“删减预案”是个好主意——以防万一。


    **小贴士**


    如果你的手机上有提醒类应用，例如 iPhone 上的`提醒事项`，那么在演讲前设置提醒是个好办法。我会在演讲开始前 30 分钟设置一个提醒，此外还会设一个提醒，确保自己在当天早些时候带好了线缆和转接头包。当你忙于活动且紧张时，这些提醒能帮上大忙，因为这时你更可能忘事。


    ### 掌握各部分时间


    当你设计演讲并制作幻灯片时，你会注意到演讲会自然形成一定的结构。我们已经讨论过“三幕式结构”，但你会发现每个部分又进一步细分为不同主题。你甚至可能使用了标题来引出这些主题。牢记这种结构，将每个部分作为标题写下来；在排练时，记录每个部分耗时多久。如果你有
    60 分钟的演讲时间，目标是讲 50 分钟，最后留出 10 分钟用于提问。


    一旦了解了演讲每个部分的大致时间，你就能在排练时留意，确保遵守时间安排。我会在每个幻灯片的演讲者备注中做这件事。我会注明该部分应该开始的时间。例如，如果第三部分包含十张幻灯片，我预计在
    15 分钟内完成，那么我会在这十张幻灯片中的每一张上都添加一条备注，写着`时间 = 15 分钟`。这些标记能直观地提醒自己当前进度。


    使用 PowerPoint 这类应用时，进入演示模式后，演示者视图顶部会显示一个计时器。演讲一开始，我就点击重置按钮将计时器归零。我就用这个计时器来把控时间。这是一个简单的小技巧，但确实很有帮助。尤其当你紧张时，你很容易语速过快，导致时间提前。通过这样一个持续的视觉提醒，你可以确保自己按计划进行。


    我见过的另一种演讲者使用的技巧是手机上的间隔计时应用。进行高强度间歇训练（HIIT）的人常用间隔计时器。间隔计时会提示他们何时开始新的训练或休息。你可以用这些应用来录入演讲每个环节的时间细节。这是个很棒的主意，我见过很多人使用。唯一的缺点是，如果有人提问或你跑题打乱了时间，间隔计时器就会不同步，进而可能打乱你的节奏。


    ## 让练习观众提问


    演讲结束后的提问环节是最难准备的部分之一，主要是因为你不清楚观众会问什么。即使在专业演讲中，你也会发现问题的性质千差万别。只有一小部分听众会提问。然而，并非所有问题都聚焦于你讨论的内容。有些人可能对你的职业或你随口提到的某个评论更感兴趣。另一些人则会寻求关于他们自己职业或项目的建议。


    鉴于观众可能提出的问题范围极广，你无法为演讲的问答部分做万全准备。你能做的，就是练习回答那些可以预见的问题。


    为此，你需要请观看你彩排的人帮忙。在向他们展示你的演讲之前，给他们一张纸，请他们在你演讲过程中随时写下脑中冒出的问题。


    练习演讲结束后，从他们那里收集问题，并尽可能多地准备好答案。只需阅读他们的问题，你就能为演讲的问答部分做好准备。


    这个技巧能让你预判观众在演讲后可能提出的绝大多数问题，而其他问题也可以用类似的回答来应对。我建议将通过练习收集到的常见问题融入到演讲内容中，这样观众就无需再问了。例如，如果你做一个关于软件开发以及某个特定编程库的演讲，参会者可能会问一些关于如何搭建该库的问题。尽管你的演讲主要是关于如何使用这个库，但最好还是增加一小节，详细说明搭建过程。


    演讲的问答环节可能相当令人紧张，因为人们天生害怕不确定性，也担心自己无法给出答案。然而，如果你针对许多常见问题做好了准备，你会感到更放松、更有把握。本书稍后讨论实际演讲呈现时，我们将更详细地讲解演讲的问答环节。


    ## 背诵演讲每个部分的开场白


    准备好演讲后，你应该反复练习每个部分，直至能记住整个演讲。理想情况下，你应该对所有演讲都达到这种熟练程度。然而，你很少会有足够的时间去逐字逐句地背诵演讲——我肯定做不到！


    一个替代方案是，只背诵演讲中不同部分的开场白。例如，一个较长的演讲可以分成五个部分。练习时，试着记住你将呈现的这五个部分中，每个部分的引言。这些引言很重要，因为它们能向你的大脑发出信号，开始回忆你练习过的信息顺序。只需顺利说出每个引言，就能向大脑发出信号，让其继续展开后续的主题。

    '
- fmt: "# Gathering Feedback and Improving Your Performance\n\nMy last point about\
    \ preparing to give a talk is to make sure you get as much feedback as you can.\
    \ Ideally, you will practice the talk in front of family, friends, and colleagues.\
    \ Before you deliver this practice talk, ask everyone to write down their honest\
    \ feedback to give to you. This can be hard with family and friends, as their\
    \ natural inclination might be to tell you that the talk was brilliant so that\
    \ they don’t hurt your feelings. Make sure to stress that honest feedback is essential\
    \ to performing well when you deliver to a larger audience.\n\nYou want people\
    \ to give feedback on your delivery: Could they hear you? Did the presentation\
    \ make sense? What did they think of the pace?\n\nIf you’re giving the practice\
    \ speech to colleagues who are subject matter experts in your field, ask them\
    \ to give an honest appraisal of the subject matter. Was your information accurate?\
    \ Was it pitched at the right level, that is, beginner, intermediate, or advanced\
    \ level?\n\nIf people only give you brilliant feedback, then be wary—this type\
    \ of feedback isn’t helpful. If you do get some negative feedback, don’t let it\
    \ hurt your feelings. You want negative feedback at this stage as it gives you\
    \ something to improve before the final talk. Getting feedback can be difficult,\
    \ but it is essential, provided it is constructive. If someone says the talk was\
    \ rubbish, that doesn’t help you. If they say it was rubbish because they couldn’t\
    \ hear you, or because you explain one aspect in a way that was confusing, this\
    \ is useful feedback, as you can fix the problem.\n\n# Internet/Wi-Fi Contingency\
    \ Planning\n\nThroughout our lives, we’re taught there are two constants in life:\
    \ death and taxes. If you are a public speaker, there is a third constant: bad\
    \ conference Wi-Fi. Reading that may make you smile, but I’m not joking. I have\
    \ attended a substantial number of events all over the world, from small venues\
    \ to huge conference centers, and I always face issues with the Wi-Fi or cellular\
    \ signal at each event. It could be that the speeds are not very good, or the\
    \ Wi-Fi could drop intermittently. If you are not prepared for bad Wi-Fi or internet\
    \ connectivity, then you can really increase your anxiety at the event. Not only\
    \ will you be nervous about speaking, but you also must contend with potential\
    \ demo failure if your talk relies on an internet connection.\n\nWhen you are\
    \ designing your talk, you need to have an internet contingency plan in place,\
    \ even if your talk has no demos that rely on the internet directly. The internet\
    \ is so pervasive that sometimes we forget to think of doing any kind of work\
    \ without it, as it’s always there. Conferences can easily shatter that illusion\
    \ when you have thousands of attendees all trying to connect to the same substandard\
    \ Wi-Fi access points. I fell into this trap earlier in my speaking career, but\
    \ now I make sure I’m prepared.\n\n> **Tip**\n> \n> Always make sure to practice\
    \ your talk at least once with your internet router unplugged or your laptop Wi-Fi\
    \ disabled to make sure your presentation, demos, and contingency plans will still\
    \ work.\n\n## Make All Slide Resources Local\n\nYou may be running your slides\
    \ from `PowerPoint` on a laptop, but are all your resources also local on your\
    \ machine? For example, do you show a video that might be streamed from `YouTube`\
    \ or `Vimeo`? It’s quite easy to embed a player for a hosted video, and when you\
    \ are rehearsing, the video plays fine. However, when the internet connection\
