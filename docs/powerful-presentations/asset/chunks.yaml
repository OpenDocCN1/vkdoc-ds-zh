- fmt: '### Gain Small Victories to Create Self-Confidence


    As you gain experience talking to large groups, you will eventually develop your
    own method on how to prevent anxiety. Most experienced speakers learn to avoid
    doubtful thinking and other types of anxious thoughts that can affect their performance
    by reminding themselves of past successes.


    When you are just starting out, you may not have a lot of experience from which
    to draw confidence. However, you could create your own feelings of success to
    remind yourself that you can do this. Before talking at a big conference, for
    example, you can take on small user group talks that you can easily organize.


    Before I spoke at large conferences and events, I practiced speaking to small
    meetup groups. Some of the groups I spoke to would only have ten or so attendees,
    but that was fine because I was getting experience. I spoke at many meetup groups
    before tackling a large professional conference.


    When it came to getting up on a large stage and speaking to hundreds of people,
    I could look back at all the meetup group talks I had taken part in. I could remember
    all the success and use that to reassure myself that I could do this and be successful.
    It’s a simple technique, but it really does make a difference in the heat of the
    moment, as you will suffer from crippling self-doubt in the heat of the moment.


    ### Keeping Yourself Focused on the Presentation


    When you’re on stage, there’s nothing left to do but deliver the presentation
    as you practiced. At this point in the process, you need to keep your mind focused
    on the task at hand. You will need to tame your mind from wandering to other thoughts
    unrelated to your talk.


    When you start your presentation, I mentioned doing some basic breathing exercises
    to clear your mind. From that point on, you should keep your mind focused on what
    you need to do next. When you are distracted by some random thought or by your
    surroundings, immediately get your head back into the presentation by looking
    at the laptop, stage screens, or your cue cards; this should allow you to return
    to your presentation-focused state of mind.


    As you gain more experience, the practice of focusing on the presentation will
    be easier for you. Your mind will instinctively tune out distractions in your
    environment. You will also habitually follow your presentation process. You will
    be able to develop a strong resistance to distracting thoughts.


    If you have a mobile phone with you, I suggest putting it into flight mode or
    turning it off—unless you are using the time or stopwatch features. The last thing
    you want is a phone call during your talk. If you forget to turn it off and someone
    tries to call you, obviously, you should not answer it. Try to ignore it, or subtly
    take the phone and disable the call. A silent phone can’t disturb you, though,
    so try to make sure to silence it prior to starting the talk.


    ### Adapting to Changes in the Presentation


    In an ideal situation, you want to limit the number of improvisations you make
    during your presentation. There may be times when certain conditions prevent you
    from executing the presentation that you practiced. For instance, some tools you
    rely on may fail to function, or you just can’t get a demo to work. At times,
    you may think of additional ideas that you want to add at the last minute.


    You should be ready to adapt to changes in the presentation. Amateur public speakers
    often complain when they see that a certain part of their presentation is not
    going their way. This does not solve the problem. When this happens to you, try
    to avoid these types of excuses. Instead, you need to think of a solution to the
    problem that will allow you to pull off the presentation, even with the obstacle
    in your way.


    Earlier in the book, I talked about how to mitigate having internet problems and
    demo failures. If you are delivering a technical talk—in my case, software development
    talks—it is quite common to suffer demo failures. No matter how much you practice,
    something always seems to go wrong when you are on stage in front of a large audience.
    If you are unprepared, a demo failure can completely derail your talk and shatter
    your self-confidence.


    You can, of course, prepare for such an eventuality. I have personally fallen
    fowl of demo failures on many occasions, but because I had a plan, I always got
    to the end of the talk successfully, and the audience left with the information
    that they came for. The audience doesn’t care if a demo fails; they want your
    information and insights, so don’t be afraid to use your backup slides or prerecorded
    demo videos.


    Sometimes, you will think of new ideas just before the presentation is due to
    start. Ideally, you should not entertain changes to the presentation you practiced;
    it is too late. These changes will only disrupt your flow because you have not
    practiced the new additions, and unless you are an experienced speaker, these
    unpracticed additions will be glaringly obvious to your audience. You could take
    note of these ideas, though, and add them in later versions of your presentation,
    which will give you an opportunity to practice them.


    If your talk is new, then you will undoubtably see ways in which you can improve,
    so make a note of them and incorporate them later. Don’t try to wing it. Stay
    on plan.


    ## Handling Questions


    One part of speaking in public that can drive fear into the speaker more than
    the actual talk itself is the question-and-answer section at the end. It is quite
    natural for speakers to fear this part of the talk, and I was no different when
    I started out. For the entire talk, you are in control, you control the story
    and the pace of the talk, and you alone are in charge. When the talk is over and
    you open the floor to questions, and you should, the tight control over the situation
    can change so that the audience is more in control, as you have no idea what they
    are going to ask.


    There are some tips I can give you, though, to make the question-and-answer section
    less scary. Remember, you don’t have to be the world’s biggest expert in your
    chosen subject, and it is fine not to know and answer straight away.


    ### Inform the Audience When You Want Questions


    When you start your talk’s introduction, let the audience know how you want questions
    delivered. Some speakers are perfectly happy to be interrupted by raised hands
    during the flow of their talk and to answer questions as they come. Other speakers,
    myself included, prefer people to wait until the end because I am probably going
    to answer their question anyway; they just need to wait. Do state your preference,
    though, as it will stop you from being irritated if people interrupt you.


    ### Think Before Answering


    When someone asks you a question, take a few seconds to think through your response
    before answering. The audience won’t notice a short wait, and it gives you a chance
    to clarify your thoughts. Rushing into answering a question can trip you up, and
    you may say the wrong thing; nerves can do this.


    ### Don’t Be Afraid to Ask for Questions to Be Repeated


    Large rooms, especially at conferences, can have a lot of background noise. If
    you didn’t hear the question, ask the attendee to clarify or repeat the question.
    Some conferences may have runners in the room who have a microphone and will get
    to the person asking the question. In that case, their voice will be sent across
    the PA system, but if the audience is shouting out the question, then the chances
    are that you may struggle to hear them if they are further back in the room.'
