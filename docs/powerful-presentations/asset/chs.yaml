  \n> *在这次演讲中，我们将探讨社会工程学中使用的某些技术，以及如何防范它们。我们将涵盖诸如借口编造、诱导和肢体语言等操纵手段的主题。*\n\n当我进入更详细的介绍时，我声明我们将探讨一些使用的技术；也就是说，我将向他们展示如何使用这些技术，以及如何保护自己免受其害。然后我提到了这些技术——借口编造、诱导和肢体语言作为操纵手段。这自然会激起人们的兴趣，因为我谈论的是未经他人同意使用就可能构成犯罪的技术。然而，其理念是，通过了解这些技术，你可以保护自己和你的组织免受其害。\n\
  \n当我与这场演讲的参与者交谈时，大多数人说他们喜欢这种想法，即即将学到一些可能非法但出于好意的东西。我们天生是好奇的生物，所以这相当吸引人。\n\n老实说，尽管这是我最受欢迎的演讲之一，但在我所有的演讲描述中，这一篇是最弱的，因为我本可以更详细地展开。我没有这样做，因为这个摘要显然有效，许多会议都选择了这个演讲，并且它持续获得与会者的极高评价。所以我采取了“如果没坏，就别修”的立场。\n\
  \n## 总结\n\n我花了相当长的时间来讨论如何撰写演讲摘要，因为它与演讲本身同等重要，甚至可能更重要。演讲本身必须精彩。如果你没有想好摘要，会议可能不会选中你的演讲。\n\
  \n摘要有多个用途。如果你是在工作场所向同事做演示，摘要将提供信息，让他们设定预期。例如，如果你是在会议上公开演讲，那么摘要就是一个工具，它能帮助你在竞争中胜出，让你的演讲被选中。会议演讲竞争激烈，因此撰写这份至关重要的文档非常重要。\n\
  \n如果他们选择你在会议上发言，那么你的摘要还有第二个目的，那就是鼓励与会者来听你的演讲。它就像一封给观众的推销信。要谨慎地用准确的信息来定位摘要，以便吸引合适的人来听。不要虚张声势。如果人们带着错误的预期来参加，他们可能会给你的演讲打低分，这会影响你在该会议上再次被选中的可能性。\n\
  \n## 研讨问题\n\n1. 开始思考你演示文稿的摘要。在最终设计演示文稿之前先写好摘要是一个好主意。请包含以下每一项：\n   - **引人注目的演讲标题和副标题**：选择一个能吸引潜在听众的标题。尽量不要让它听起来像点击诱饵链接，但可以尝试一个巧妙的标题，前提是它不会产生误导。对于我之前描述的《黑掉人类》演讲，这是一个引人注目的标题，而副标题则提供了背景信息，*社会工程学技术及如何防范*。\n\
  \   - **初始钩子**：初始钩子会在标题之后吸引读者。会议日程表通常只显示标题和初始钩子，观众需要点击才能阅读更多内容，因此这个初始钩子的影响力可能决定是否有人会来听你的演讲。\n\
  \   - **更多细节**：在这一部分，你可以更详细地介绍你正在解决的问题以及你将如何解决它。此部分旨在传达更详细的信息，以帮助人们决定是否来听你的演讲。但是，不要写太多；它仍然应该保持简洁。\n\
  \   - **结束语**：结束语是一个总结为什么某人应该来听你演讲的机会。\n\n2. 写好摘要后，你应该把它给不同的人看，以获取反馈。一个有用的技巧是写两三份风格不同的摘要文档。然后让人们选出他们最喜欢的，并告诉你为什么选择它而不是其他。摘要与实际演示本身同等重要，因为你将用它来向与会者和会议方推销你的演示想法。\n\
  \n"
- "# 4. 准备进行演讲\n\n不要等到最后一刻才准备你的幻灯片。这不仅不专业，还会让你注定失败，因为你将没有机会练习演讲，以了解哪些环节效果好以及你的时间安排如何。如果你尽早规划并设计你的演讲和幻灯片，那么你将有充足的时间来排练演讲并进行必要的修改。\n\
  \n\n\n## 开始准备\n\n当幻灯片准备就绪后，你应首先坐在电脑前完整过一遍演讲。这并非正式排练，但能让你逐一检查每张幻灯片，确保内容正确无误，并且你对所传达的信息感到满意。\n\
  \n当你对内容满意后，就该开始练习了。我建议将演示软件（如 `PowerPoint` 或 `Keynote`）切换至演示者模式，站起来，然后开始演练你的演讲。我还建议设定一个计时器，因为你需要了解演讲会耗时多久。例如，如果你在会议上有一个完整的\
  \ 60 分钟演讲时段，那么你最好讲 50 分钟，留出 10 分钟在最后进行问答。通过现在计时演练，你可以判断自己是否会超时，或者远低于分配的时间。讲得少比超时要好，但你应该尽量充分利用你的全部时间。如果你在会议上演讲，演讲必须严格遵守时间表，以便与会者能前往下一个会场，并且下一位演讲者也有时间进行准备。\n\
  \n如果你是演讲新手，你很可能会发现第一次演练极其痛苦：你会说错台词，忘记接下来要讲什么，整个演讲尝试都会一团糟。别担心，这很正常。即使我已经公开演讲多年，我最初的几次演练通常也很糟糕，而这正是练习的意义所在。想象一下，在演讲前最后一刻才做好幻灯片，然后第一次完整过稿就是在观众面前。通过提前规划，你可以在私下里把这些糟糕的尝试消化掉，而无需让任何人知道。\n\
  \n在你完整过稿两三次之后，你就会开始掌握材料的脉络，并对该如何呈现演讲感到更有信心一些。如果你需要更多这样的排练，也没问题。根据需要尽可能多地练习。\n\n\
  我不建议一次性尝试超过两次的完整过稿，因为你会开始感到精神疲劳。把你的初始练习分散在接下来的一周内进行。花上你需要的一切时间。\n\n此时，你应该开始感到更自信了。接下来，我建议你录下自己的演讲。你可以把手机放在书架上，用手机的内置摄像头和麦克风录制自己。画质不需要多好；你只需要能听到自己的声音。如果你有任何屏幕录制软件，比如\
  \ `Camtasia` 或 `ScreenFlow`，那么你可以从电脑上录制幻灯片，并通过麦克风录制你的声音——这就是我的做法。这样录制自己的目的是，你可以观看/收听它，并批判性地评估你的演讲。这段视频不需要其他人看到；你看完后可以删除它。制作这样的视频是一个很棒的工具，因为它能让你从听众的角度去感受演讲听起来如何。我不建议录完视频后立即回看。过几天，再用全新的眼光重新观看。\n\
  \n当你重新观看完视频后，你可能想要再排练几次，然后重新录制一次演讲。你做这个流程的次数取决于你的自信程度。你可以根据需要，像这样练习任意多次。每次练习，你都会在记忆材料和自信地呈现演讲方面做得更好。\n\
  \n当你在演讲表现方面变得自信后，最后一步是在其他人面前练习。这些人可以是家人、朋友或办公室的同事。你甚至可以在工作中安排一次午餐学习会，邀请你的同事们来听演讲。这将是在真实观众面前的一次完整预演。尽管听起来很吓人，但在你面对会议上可能更庞大的观众群之前——尤其是如果你的目标是在会议或聚会小组上演讲的话——在一群人面前这样练习是一个好主意。\n\
  \n## 身体表达：手势与面部表情\n\n在会议上，你通常可以找到一张小桌子或讲台来放置你的笔记本电脑，并且会有一瓶水——一定要随身带一瓶水，以防主办方没有提供。在家练习时，尽量重现这样的布置。你要避免的是把讲台当成藏在后面的盾牌。这对新手演讲者来说很常见。尝试远离笔记本电脑，在舞台区域或你练习的房间内走动。如果你使用蓝牙幻灯片翻页器，那么无需触碰笔记本电脑就能切换到下一张幻灯片，这样走动起来会更容易。\n\
  \n许多会议会在舞台上设置一个屏幕，显示你笔记本电脑上的内容。有这样的屏幕非常好，因为这意味着当你在舞台上走动时，你仍然可以看到演示者视图的笔记，更重要的是，可以看到下一张幻灯片是什么。不过，有一点需要注意：许多会议会录制演讲视频。如果有人在你的演讲期间操作摄像机，他们会跟着你走动和讲话。有些会议使用固定摄像机对准讲台，这样你就不能随意走动了。你应该在会议开始前尽量了解录像安排，或者在演讲前与音视频工程师沟通，他们会告诉你是否有走动空间。\n\
  \n练习演讲时另一个重要的考量是，你的手臂、双手和面部该怎么办。如果你笔直地站在舞台上，双手垂在身体两侧，说话时面无表情，观众很快就会对你的演讲感到厌倦，并脱离内容。务必利用你的手臂和双手来强调你所说的内容。你当然不想做得太过火，像章鱼一样挥舞手臂，但与你声音表达同步的细微动作可以产生真正的影响力。\n\
  \n当你想了解什么样的动作幅度合适时，我建议在 YouTube 上观看演讲视频，并观察其他演讲者是怎么做的。试着观看好的演讲和不太好的演讲，目的是从中学到东西。你可以通过一个演讲的差评数量（相对于好评）来识别出无效的演讲。我喜欢观看\
  \ TED 演讲，因为它们通常是演讲呈现方式的绝佳范例，你能从演讲的呈现方式中学到和演讲内容一样多的东西。\n\n你的面部表情也是一个关键因素，尤其因为人们会看着你的脸——如果演讲被录制下来，并且你被显示在大屏幕上，这一点就更为重要。记得在演讲开始时微笑。在活动中发表演讲是一种荣誉，你应该表现出兴奋和热情，因为你很荣幸能对那些选择花时间听你讲话的人说话。\n\
  \n如果你站在那里，一脸惊恐，观众很可能会有点为你感到难过；更重要的是，他们可能会对演讲失去信心，尤其是如果他们花了很多钱来参加这个活动的话。如果你是在一个免费的用户组聚会上，那么听众往往会宽容得多。\n\
  \n如果你演讲传达的信息是振奋人心和快乐的，那就微笑，看起来开心。你的面部表情应该与你所传达信息的强度相匹配。如果你在传达一个严肃或悲伤的信息，那么表情就应保持平静或悲伤。你不会——嗯，我希望你不会——在谈论某人被诊断出危及生命的重病时脸上还带着微笑，所以请尝试练习与主题相配的面部表情。不过，不要用力过猛。你的目标是微妙的表达，而不是证明你能复制金·凯瑞（Jim\
  \ Carrey）那种富有弹性的面部表情。\n\n\n\n当你与人交谈时，试着注意双手的动作。在向他人解释概念时，你是否会自然而然地抬起手并做出手势？你是用手做手势，还是用手指指点？观察我们自然交谈的方式，可以让你学到很多关于在演讲中练习何种手势的知识。\n\
  \n## 建立表演前习惯\n\n随着重要日子的临近，并且你已经尽可能多地排练了演讲，你需要开始思考为那一天建立的表演前习惯。如果这是你的第一次演讲，你在演讲当天会感到紧张。即使经过多年公开演讲，我在演讲前仍然会紧张。你的表演前习惯是指你想在当天或之前做的任何事情，这些习惯能帮助你放松、感到舒适，并呈现出色的表现。\n\
  \n以下是我的一个习惯示例，供你参考。你不必完全照搬，但这对本人有效，因此它可能是一个很好的指南，帮助你发展自己的习惯。\n\n在重要演讲的前一晚，我会尽量不喝酒——或者至少不多喝。如果我在参加的会议上与演讲者朋友聚会，这说起来容易做起来难，但你最不想要的就是宿醉。如果我是在清晨演讲，那么我完全不会喝酒。如果我是在下午演讲，我可能会在前一晚的晚餐时喝几杯，但仅此而已。演讲本身压力已经够大了，更不用说还要应对头痛和脱水。\n\
  \n除了前一晚放松外，你还应该尽量获得良好的睡眠。早点上床，不要在睡前排练演讲或修改幻灯片。否则，你的大脑会充满关于演讲的念头，这会让你无法入睡。如果你喝咖啡或红茶，请在睡前几小时避免摄入咖啡因，除非你身边有脱咖啡因的饮品。我总是随身携带脱咖啡因的咖啡包。\n\
  \n在演讲当天，我会根据演讲时间来计划进食。这可能不适用于所有人，但我不喜欢在演讲前几小时内吃东西。如果你刚吃完东西，身体正在消化食物，你可能会开始感到昏昏欲睡，这会让你在台上演讲时难以集中注意力。\n\
  \n如果我是在清晨演讲，我通常会跳过早餐。（如果你患有糖尿病或有任何与饮食相关的医疗问题，请忽略这一点，并遵循医生的建议。）就个人而言，我从来不是一个吃大量早餐的人，所以在所有需要跳过的餐食中，跳过早餐对我来说是最容易的。如果我是在近中午或午后早些时候演讲，我会根据演讲时间吃一顿晚早餐或清淡的早午餐。如果我是在午后晚些时候演讲，我会吃一顿丰盛的早餐和一顿早但清淡的午餐。是否在演讲前吃东西是个人偏好；对我而言，它会让我感到疲倦，所以我通过计划进食时间来避免它。\n\
  \n当天的另一个重要习惯是保持水分。公开演讲会让你感到非常口渴，所以要小口多喝水。但尽量不要在演讲前一小时内喝大量水；否则，你会需要频繁上厕所，你最不想看到的就是在台上时需要去洗手间。在大型会议上，洗手间排长队是很常见的情况。在演讲前一小时，我会在与会者听其他演讲时，放松一下并去一趟洗手间。如果你等到演讲前才去洗手间，你可能不得不应对长队，这会增加你的压力。\n\
  \n虽然补水很重要，但尽量在演讲前避免饮用碳酸饮料。我曾经犯过这个错误，在上台前喝了一罐冰镇无糖百事可乐。我站在那里等着开始演讲，麦克风已经打开，而碳酸饮料一直在让我打嗝。在没有尴尬的情况下完成那次演讲简直是个奇迹，这是我通过惨痛教训学到的一课。\n\
  \n当你打包去参加活动或会议时，我建议在包里放一些润喉糖。在大型会议上，你会与许多其他演讲者和与会者交谈，这意味着你的说话量会比平时多得多，这会对你的喉咙造成负担。在上台前，润喉糖可以成为缓解喉咙疼痛或嘶哑的非常受欢迎的良方。\n\
  \n在出发参加活动前，请务必反复检查你打包的设备，包括你的笔记本电脑。如果你要出差，请确保带上电源线和适用于外国的电源插头转换器；如果你的笔记本电脑没有内置 HDMI\
  \ 接口，请检查你是否带了多个 HDMI 适配器。并非所有的会议投影系统都是现代的；有时，一个适配器会出现很多故障，而另一个不同品牌的适配器却工作正常。我从未弄清楚原因，但多带一个总是个好主意，因为这能减少你在为演讲做设置时的压力。你还应该带上一个旧的\
  \ VGA 适配器；并非所有场地都升级到了 HDMI，因此你需要使用 VGA。我在许多大学演讲过，有些投影系统非常老旧——不要让自己陷入困境。\n\n当你在等待自己的演讲时段时，尽量放松并坐下。大多数会议都会为演讲者提供休息室。提前找到它的位置，并在演讲前在那里休息一段时间。我不建议在演讲前一小时内进行最后的排练，因为这很容易让你陷入恐慌。这也不是对演示文稿做最后改动的时候——此时它应该已经定稿并排练充分。\n\
  \n如果我的酒店离场地很近，只需步行一小段路，我更喜欢在演讲前独自在酒店房间休息。我是个内向的人，所以这对我很有效。如果你喜欢与人相处，你可能会更喜欢待在会议场地与人交谈。做任何对你有用的事情，但尽量让自己得到充分休息。\n\
  \n作为预防措施，请在手机上设置闹钟，至少在你需要到达演讲室前 30 分钟提醒。通常，在前一位演讲者离开后，到与会者开始陆续进入房间之前，有大约 15 分钟的时间窗口。请明智地利用这段时间解决任何投影仪或音响问题。\n\
  \n我提供了不少关于表演前习惯的点子。我将这一节放在关于准备工作的章节中，是因为提前思考这些习惯是个好主意，而不是等到演讲当天才想。你的习惯可能大不相同，但我希望通过分享我的准备方法，能启发你思考自己的习惯。\n\
  \n\n\n## 注意演讲时长\n\n演讲时的计时同样至关重要，尤其是当你的演讲时长固定时。在会议上，主办方通常会为每位演讲者分配特定的时间。必须严格遵守这一时间安排，因为组织者需要确保每位受邀演讲者都有充足的时间，同时不影响其他人的既定时段。\n\
  \n会议还会公布具体的时间表，供参会者规划行程。如果你超时，可能会给参会者带来糟糕的体验——他们可能为此支付了高额费用。\n\n确保幻灯片中的所有内容都能在规定时间内讨论完毕，这向观众展示了你的专业素养以及为活动所做的充分准备。在公开演讲中时间不够用，是准备不足的表现。练习演讲时，为自己计时，确保不会超时。\n\
  \n在演讲当天，你要预料到所有可能出错的环节。要预想各种延误，它们可能会缩短你的演讲时间。为此，请根据实际拥有的时间调整演讲内容。如果演讲时间比预期的短，找出演讲中可以加快讲解或直接跳过、以便为更核心内容让路的部分。知道在必要时可以删减哪些内容，是重要的一步准备。希望你不会在最后一刻需要删减内容，但脑中留一份“删减预案”是个好主意——以防万一。\n\
  \n**小贴士**\n\n如果你的手机上有提醒类应用，例如 iPhone 上的`提醒事项`，那么在演讲前设置提醒是个好办法。我会在演讲开始前 30 分钟设置一个提醒，此外还会设一个提醒，确保自己在当天早些时候带好了线缆和转接头包。当你忙于活动且紧张时，这些提醒能帮上大忙，因为这时你更可能忘事。\n\
  \n### 掌握各部分时间\n\n当你设计演讲并制作幻灯片时，你会注意到演讲会自然形成一定的结构。我们已经讨论过“三幕式结构”，但你会发现每个部分又进一步细分为不同主题。你甚至可能使用了标题来引出这些主题。牢记这种结构，将每个部分作为标题写下来；在排练时，记录每个部分耗时多久。如果你有\
  \ 60 分钟的演讲时间，目标是讲 50 分钟，最后留出 10 分钟用于提问。\n\n一旦了解了演讲每个部分的大致时间，你就能在排练时留意，确保遵守时间安排。我会在每个幻灯片的演讲者备注中做这件事。我会注明该部分应该开始的时间。例如，如果第三部分包含十张幻灯片，我预计在\
  \ 15 分钟内完成，那么我会在这十张幻灯片中的每一张上都添加一条备注，写着`时间 = 15 分钟`。这些标记能直观地提醒自己当前进度。\n\n使用 PowerPoint\
  \ 这类应用时，进入演示模式后，演示者视图顶部会显示一个计时器。演讲一开始，我就点击重置按钮将计时器归零。我就用这个计时器来把控时间。这是一个简单的小技巧，但确实很有帮助。尤其当你紧张时，你很容易语速过快，导致时间提前。通过这样一个持续的视觉提醒，你可以确保自己按计划进行。\n\
  \n我见过的另一种演讲者使用的技巧是手机上的间隔计时应用。进行高强度间歇训练（HIIT）的人常用间隔计时器。间隔计时会提示他们何时开始新的训练或休息。你可以用这些应用来录入演讲每个环节的时间细节。这是个很棒的主意，我见过很多人使用。唯一的缺点是，如果有人提问或你跑题打乱了时间，间隔计时器就会不同步，进而可能打乱你的节奏。\n\
  \n## 让练习观众提问\n\n演讲结束后的提问环节是最难准备的部分之一，主要是因为你不清楚观众会问什么。即使在专业演讲中，你也会发现问题的性质千差万别。只有一小部分听众会提问。然而，并非所有问题都聚焦于你讨论的内容。有些人可能对你的职业或你随口提到的某个评论更感兴趣。另一些人则会寻求关于他们自己职业或项目的建议。\n\
  \n鉴于观众可能提出的问题范围极广，你无法为演讲的问答部分做万全准备。你能做的，就是练习回答那些可以预见的问题。\n\n为此，你需要请观看你彩排的人帮忙。在向他们展示你的演讲之前，给他们一张纸，请他们在你演讲过程中随时写下脑中冒出的问题。\n\
  \n练习演讲结束后，从他们那里收集问题，并尽可能多地准备好答案。只需阅读他们的问题，你就能为演讲的问答部分做好准备。\n\n这个技巧能让你预判观众在演讲后可能提出的绝大多数问题，而其他问题也可以用类似的回答来应对。我建议将通过练习收集到的常见问题融入到演讲内容中，这样观众就无需再问了。例如，如果你做一个关于软件开发以及某个特定编程库的演讲，参会者可能会问一些关于如何搭建该库的问题。尽管你的演讲主要是关于如何使用这个库，但最好还是增加一小节，详细说明搭建过程。\n\
  \n演讲的问答环节可能相当令人紧张，因为人们天生害怕不确定性，也担心自己无法给出答案。然而，如果你针对许多常见问题做好了准备，你会感到更放松、更有把握。本书稍后讨论实际演讲呈现时，我们将更详细地讲解演讲的问答环节。\n\
  \n## 背诵演讲每个部分的开场白\n\n准备好演讲后，你应该反复练习每个部分，直至能记住整个演讲。理想情况下，你应该对所有演讲都达到这种熟练程度。然而，你很少会有足够的时间去逐字逐句地背诵演讲——我肯定做不到！\n\
  \n一个替代方案是，只背诵演讲中不同部分的开场白。例如，一个较长的演讲可以分成五个部分。练习时，试着记住你将呈现的这五个部分中，每个部分的引言。这些引言很重要，因为它们能向你的大脑发出信号，开始回忆你练习过的信息顺序。只需顺利说出每个引言，就能向大脑发出信号，让其继续展开后续的主题。\n\
  \n\n\n## 收集反馈并提升你的演讲表现\n\n关于准备演讲的最后一点，是确保你尽可能多地获得反馈。理想情况下，你应该在家人、朋友和同事面前进行试讲。在开始试讲之前，请每个人都写下他们诚实的反馈意见并交给你。这对家人和朋友来说可能有些困难，因为他们自然会倾向于告诉你演讲很精彩，以免伤害你的感情。务必强调，诚实的反馈对于你在更大的观众面前表现出色至关重要。\n\
  \n你需要大家针对你的演讲表现给出反馈：他们能听清你说话吗？演讲内容是否条理清晰？他们觉得你的节奏怎么样？\n\n如果你是在向同领域的专家同事进行试讲，请他们对你所讲述的主题内容给出诚实的评价。你的信息准确吗？内容难度是否恰当，即适合初学者、中级还是高级水平？\n\
  \n如果大家只给你正面的反馈，那你就要警惕了——这种反馈没有帮助。如果你确实收到了一些负面反馈，不要因此感到沮丧。在这个阶段，你恰恰需要负面反馈，因为它能给你在最终演讲前提供改进的方向。接受反馈可能不容易，但这一点至关重要，前提是这些反馈具有建设性。如果有人说演讲很糟糕，这对你毫无帮助。但如果他们能指出糟糕的原因是听不清你说话，或者你对某个方面的解释让人困惑，这就是有用的反馈了，因为你可以针对这些问题进行改进。\n\
  \n## 互联网/无线网络应急计划\n\n在我们的一生中，我们被教导生活中有两件事是确定的：死亡和纳税。如果你是一位公众演讲者，那么还有第三件确定的事：糟糕的会议无线网络。读到这句你可能会心一笑，但我不是开玩笑。我参加过全球众多活动，从小型场地到大型会议中心，每次都面临无线网络或蜂窝信号的难题。可能是网速不佳，也可能是无线网络会断续掉线。如果你没有为糟糕的无线网络或网络连接做好准备，那么在活动现场，你的焦虑感真的会加剧。你不仅要为演讲本身紧张，如果你的演讲依赖网络连接，你还得应对演示可能失败的状况。\n\
  \n在设计你的演讲时，你需要制定一个网络应急计划，即使你的演讲中没有直接依赖网络的演示。互联网如今已无处不在，以至于有时我们忘记了没有它该如何工作，因为它总是就在那里。当数千名与会者同时试图连接那些本就不堪重负的无线网络接入点时，会议现场很容易就会打破这种错觉。我在演讲生涯早期也曾落入这个陷阱，但现在我确保自己已做好充分准备。\n\
  \n> **提示**\n> \n> 请务必至少在断开互联网路由器或禁用笔记本电脑无线网络的情况下，完整练习一次你的演讲，以确保你的演示文稿、演示内容和应急计划仍然可以正常运作。\n\
  \n### 让所有幻灯片资源都保存在本地\n\n你也许是在笔记本电脑上用 `PowerPoint` 运行幻灯片，但你所有的资源是否也都存储在本地机器上？例如，你展示的视频是否来自\
  \ `YouTube` 或 `Vimeo` 的在线流媒体？嵌入一个托管视频的播放器很容易，排练时视频播放也一切正常。然而，当网络连接不畅或完全不存在时，你就会面临没有视频可播放的窘境。\n\
  \n最简单的解决方案是先将任何视频或其他素材下载到你的电脑上，然后嵌入来自本地文件的链接。之后，在演讲前几周的排练中，尝试在关闭无线网络的情况下进行练习。这是一个很容易的修复方法，你应该将其融入你的演讲准备工作中。\n\
  \n### 防范演示失败\n\n如果你要进行的是现场演示，而不仅仅是展示幻灯片内容，那么制定一个应急计划也是个好主意。这对于进行软件开发类演讲的人尤其如此。演示内容可能需要从在线代码仓库拉取代码，或访问云平台上的服务。如今大多数软件都依赖于在线服务，因此在会议现场因无线网络不佳而进行演示是个问题。\n\
  \n我并不是说你永远不应该尝试需要网络连接的演示。你或许没问题，特别是如果组织者能在讲台上提供有线局域网连接的话，但还是有一些有用的备用措施你可以采取。\n\n\
  如果最坏的情况真的发生了，你可以采取的第一个备用措施是准备第二套演讲幻灯片，将演示的所有关键点都用截图的形式表达出来。如果演示失败且你无法修复，不要为此烦恼。只需加载第二套幻灯片继续下去。观众不会介意；他们感兴趣的是整个演讲；他们会表示理解，所以试着不要焦虑。\n\
  \n如果你不想使用截图，你也可以使用诸如 `Camtasia` 或 `ScreenFlow` 之类的软件将演示过程录制成视频，然后将这些视频嵌入你的第二套幻灯片中。这样，如果你切换到那些幻灯片，你可以设置视频在幻灯片进入视图时自动播放，然后你在一旁讲解。我见过很多演讲者使用这种技巧，效果非常好。\n\
  \n我本人的一个演讲（我们在本书前面看过其内容简介）是关于一个名为 `Azure Key Vault` 的云计算服务，它是微软 Azure 云计算平台的一部分。在那个演讲中，我做了很多软件开发演示，每次演示都需要连接到云端的密钥保管库，因此需要网络连接。为了应对糟糕的网络连接，我采取的措施是创建一个所谓编程接口，即制作一个与密钥保管库服务通信的库的虚拟副本。这个虚拟库拥有与真实库完全相同的所有操作。如果出现网络连接问题，我可以在舞台上轻松修改代码，使用那个虚拟库来代替真正的密钥保管库。这个虚拟库会返回一堆伪造的数据，让演示看起来像是成功运行了。如果我切换到虚拟库，我会告知观众——我甚至还会就此开个玩笑。这让我能够顺利地完成我的演讲，让观众感到满意。\n\
  \n这个演讲我在各种会议上已经做过大约 20 次，其中有五次不得不使用这个备用方案。第一次是在波兰，当时会场完全没有可用的无线网络。有了这个备用方案确实大大减轻了我的焦虑感，因为我知道自己还有备选方案可以让我顺利完成演讲。值得在活动前多花一些精力来准备。观众会尊重你，并对你的准备工作和专业性印象深刻。\n\
  \n\n\n#### 保留多份文件副本\n\n如果你的所有演示文件都在笔记本电脑上，我建议你同时在`U 盘`上保留一份副本，或者最好准备两个 U 盘：一个随身携带，另一个放在酒店房间（如果需要在外过夜的话）。我曾因为没有这样做而吃过亏——在一次活动前，我不小心从笔记本电脑上删除了几个幻灯片文件。\n\
  \n当时我在哥本哈根的一个活动上演讲。那是一个包含两天研讨会和一天会议的行业会议。在单日会议中，我被安排在午餐后演讲，并且已经准备就绪。上午我在活动现场闲逛时，一位组织者告诉我另一位演讲者因生病在最后一刻退出了。与我合作多年的组织者知道我有内容相似的演讲，便询问我能否临时顶替。我答应了，然后问演讲时间是什么时候。组织者回答：“十分钟后！”\n\
  \n我很快被带到舞台，准备连接笔记本电脑加载幻灯片。然而，我的“演讲”文件夹里根本没有这些文件。不知何时、如何操作的，我竟然把它们删除了，连回收站都清空了。好吧，我心想。那就用`Dropbox`吧——我付费购买了最高级套餐，拥有无限版本历史可以恢复文件。但我完全无法连接`Wi-Fi`，手机也没有信号。我迅速抓起笔记本电脑跑到门厅再试，但依然没有`Wi-Fi`或移动网络信号。此时我开始慌了，因为听众已经陆续进入演讲厅。\n\
  \n我的笔记本电脑里只有一份旧版幻灯片，更像是笔记形式。它们看起来不怎么样，但保留了演讲的基本结构。我快速浏览了一遍，删除了明显的问题，然后只能硬着头皮上。值得庆幸的是，这是一个我非常熟悉且多次演讲过的主题——就是我在“撰写摘要”一章中描述过的《黑掉人类》演讲。\n\
  \n尽管幻灯片看起来很糟糕，但演讲进行得相当顺利。开场时我解释了临时上场的原因（原本听众期待的是另一位生病的演讲者），并给听众机会去其他分会场——如果有人想离开，我完全不会介意。我还拿自己糟糕的幻灯片开了个玩笑，然后继续演讲。\n\
  \n虽然因为笔记本电脑没有备份而出了状况，但我最终还是完成了演讲——直到今天，我都不清楚自己是如何、何时删除了那个幻灯片文件。现在，我总会在单独的`U 盘`中保存一份幻灯片副本作为备份。这是吃一堑长一智的教训。\n\
  \n除了幻灯片备份，我还建议将所有活动需要的文件都保存在`U 盘`上。如果笔记本电脑因旅途劳顿突然无法工作（这种情况确实可能发生），你可能需要使用会议方提供的备用电脑或别人的电脑。如果你使用了所选操作系统中非默认的自定义字体，也请将这些字体存到`U\
  \ 盘`里。同时确保包含任何需要播放的视频或演示用的源代码文件。假设所有环节都可能出问题，因此你需要备份计划——当一切顺利时，你反而会感到惊喜。做好万全准备，能让你在活动当天的焦虑水平大大降低。\n\
  \n## 总结\n\n在本章中，我们探讨了如何为演讲做好最后准备。至此，你已经设计出精彩的摘要、研究了演讲内容、并制作了杀手级的幻灯片。本章重点讨论了演讲准备——因为演讲本质上就是一场表演。虽然这并非莎士比亚戏剧式的演出，但如果你勤加练习并做好应对各种情况的准备，在观众眼中你将成为该领域充满自信的权威。\n\
  \n你可以做的最重要的准备之一，就是练习演讲——不仅独自练习，如果可能的话，还要在试听观众面前演练。如果你面对试听观众演练，请他们尽可能多地提出各种问题。整理这些问题并找出答案。如果试听观众能提出这些问题，真实观众也很可能会问。如果问题中存在常见主题，考虑在演讲中增加额外内容来覆盖相关主题。\n\
  \n\n\n## 工作坊问题\n\n1.  当你的演示文稿有了初稿，并且自己练习了几遍之后，组成一个由信得过的伙伴组成的小团体，向他们进行演示。他们可以是家人、朋友或同事。尽量选择一个能代表你目标受众群体的成员组成的小组。\n\
  \n2.  当你多次排练并对自己的演示更加自信时，录下其中一次排练，这样你就可以回看并分析你的演讲表现。你可以这样做：\n    *   在显示器上放映幻灯片，然后站在屏幕旁边。用你的手机，把它放在椅子或支架上，在演示时进行录制。调低电脑屏幕的亮度，这样你就能看到幻灯片。只要能看清你自己、屏幕并听清你的声音，录制质量无关紧要。\n\
  \    *   或者使用屏幕录制应用，例如 Camtasia、`ScreenFlow` 或 QuickTime，录制屏幕上的幻灯片以及你演讲的网络摄像头画面。\n\
  \    *   当你录制好演讲后，不要过于担心录制质量，回看视频并观察你的演讲表现。要注意的事项：你是否经常卡壳？你是否记住了每一部分的引言？在你演讲的某些部分，更详细的主讲人备注是否会有所帮助？你的幻灯片是否清晰易读？\n\
  \n3.  让你的练习听众尽可能多地就你正在演示的主题提出问题。让他们不要有所保留。如果他们有任何不确定的地方，或者想要了解更多信息，请让他们提出来。\n  \
  \  *   写下每一个问题。\n    *   练习环节结束后，开始将问题按共同主题分组。\n    *   分析每个主题。要么为这些主题准备答案，要么如果很多人问了类似的问题，考虑在演示文稿中添加额外内容来涵盖这些答案。\n\
  \n4.  花时间观察人们说话时的面部表情和手势。当你与朋友、家人或同事交谈时，他们是如何用手势来强调他们所说的话的？你能从中学习吗？\n    *   在 YouTube\
  \ 上查找演讲（TED 演讲就很棒），并研究演讲者。他们如何说话、站立以及使用手势来传达信息？练习模仿他们。\n\n5.  排练时要计时你的演示。它符合你分配的时间段吗？如果你是在商业会议上做演示，那么时间安排会被严格执行。你有足够的时间演示并在最后留下问答环节的时间吗？\n\
  \    *   大致算出每个环节的时间。在你的演示软件的演讲者备注中，记下该环节应在时间段内的哪个时间点开始。这将在你上台时帮助你判断自己是讲得快了还是慢了。\n\
  \n6.  记住你演讲的开场白，大约前五分钟。这将使你能够进入一种流畅的状态，让你放松下来。在开场白中，如果合适的话，看看能否插入一个小笑话让听众微笑。尽早让听众微笑或大笑有助于缓解紧张气氛，使听众放松。\n\
  \n7.  仔细检查你的演示幻灯片和演示，确定其中任何依赖网络连接的部分。需要考虑的事项：\n    *   在线播放的视频：你最好将视频下载下来，以便在笔记本电脑上播放。\n\
  \    *   需要联系在线服务的软件演示：如果这是一个软件开发演示，考虑为所有在线调用创建桩代码。\n\n8.  如果你的演示文稿中有部分内容在没有网络连接的情况下无法正常工作，那么创建一个备份的幻灯片组，并为任何需要网络的部分截取屏幕截图。如果你在台上遇到网络故障，可以切换到这份备份的幻灯片组。\n\
  \n"
- "# 进行演讲\n\n在演讲当天，你会对即将到来的演讲感到紧张和焦虑。但是，尽量不要让这种感觉影响你的表现——管理焦虑并克服它，是你作为公众演讲者面临的挑战之一。\n\
  \n## 做好准备\n\n正如我在书中多次提到的，准备是你作为公众演讲者成功的关键。你应该确保在演示前一晚准备好所有需要的东西。\n\n在上一章中，我们讨论了你的演出前惯例，其中一部分就是确保你打包好所有需要的东西并准备就绪，比如你的笔记本电脑、充电器和\
  \ HDMI 转换器。在演讲的当天早上，你已经有足够多的事情需要考虑了，而不是去担心你所有的转换器、翻页器和连接线是否都准备好了。\n\n## 想象你的成功\n\
  \n想象法是在演示前使用的一个很好的技巧。在这种技巧中，你想象自己进行了一场成功的演讲，一切进行得十分顺利。你想象自己在活动场地面对满场观众从头到尾完成演讲。做这个练习时，想象观众完全沉浸在你的演讲中。想象当你讲出笑话和妙语时，观众在欢笑。同时，想象他们看到你分享的震撼信息时那惊叹的表情。\n\
  \n最后，想象你结束演示时，观众起立为你鼓掌。这项活动有助于激励你做出色的表现。如果你对自己的公众演讲能力有任何怀疑，想象自己成功将显著有助于减少你感到的不确定性和压力。\n\
  \n这样想象你的演示可能感觉有点傻，但积极的想象法是一种非常流行的技巧，被许多专业人士使用，例如运动员和表演者。没有人需要知道你在这样做，但想象成功会让你处于一种积极的心态去进行你的演讲。如果你反其道而行之，想象你的演讲搞砸了，那么你会处于消极的心态，这会使你在正式开始演讲时走上错误的路。\n\
  \n## 人们希望你成功完成演讲\n\n大多数新的公众演讲者在演示前都会经历极度的焦虑。最常见的原因是对面对观众感到恐惧。人们害怕自己会犯错，会当众出丑。\n\n\
  如果你经常遇到这种情况，请时刻提醒自己，观众是来看你成功的。他们希望你演讲成功，因为他们想向你学习。如果你按照练习时的方式去做，你的演示就会表现出色。\n\n\
  你应该记住，观众是选择来参加你的演讲的。他们不是来看你失败的。他们出现在那里是因为他们对该主题真正感兴趣，并且想向你学习。他们是来看你成功的。我参加过很多出现技术问题的演讲——演示失败、网络中断，或者演讲者忘词结巴。我从未见过有人因为一个错误而贬低演讲者。作为一个愿意站在观众面前的人，观众和演讲者之间存在着一种天然的相互尊重的关系。\n\
  \n\n\n## 遭遇技术故障时，道歉并继续前进\n\n如果你计划将来做更多演讲，你会意识到有些意外情况是你无法掌控的。无论你准备得多么充分，演示过程中终究会遇到一些灾难性状况。其中大部分是技术故障——当我们依赖的工具出现意外行为时。最糟糕的情况莫过于这些工具在演讲前或演讲过程中失灵。\n\
  \n如果遇到这种情况，请务必在观众面前保持专业态度——不要大喊大叫、骂骂咧咧或惊慌失措。在压力下展现优雅风范。当事情在观众面前失去控制时，你正好可以向他们展示自己在紧张局势下的应对方式。对于咨询顾问来说，这是向潜在客户展示自己即便面临巨大压力也能保持冷静的绝佳机会。\n\
  \n你也可以用幽默来化解尴尬局面。我记得有一次为大约 300 名软件开发人员做演讲。投影仪开始闪烁，然后完全熄灭了。我尝试了拔掉线缆再插回去的常规操作，但毫无效果。正当我这么做的时候，我看到音视频工程师正走上舞台。我知道会有一小段延迟，于是开了个玩笑。我问房间里是否有\
  \ IT 专业人士——是的，在坐满 IT 专业人士的房间里。我们一起笑了起来。接着我指出自己忘了向演示之神献祭，并提名第一排观众为祭品。这引发了更多笑声。这时，音视频工程师已经重新启动了讲台下的\
  \ HDMI 接线盒。投影仪恢复工作后，我直接接上继续演讲。尽管出现了技术故障，但根本没人介意。每个人都获得了他们想要的信息，这次演讲在与会者中获得了很高的评价。\n\
  \n如果你的演讲依赖软件演示，就可能会遇到演示失败的情况。我曾开玩笑说要向演示之神献祭，但我迷信的那部分总觉得其中有些道理。我总是发现最难进行的演讲就是那些严重依赖演示的，尤其是软件开发演示。你可以反复练习这些演示而不会遇到任何问题；但一旦站上舞台，似乎总会出点什么差错。我们已经讨论过网络应急预案，但同样值得准备一个演示应急预案，即使它不依赖网络。如前所述，在这种情况下，我会在演讲幻灯片末尾准备一系列展示演示预期结果的截图。\n\
  \n如果确实遇到演示失败，不要试图掩饰或蒙混过关。只需道歉，然后转到幻灯片末尾的应急幻灯片，展示结果。与会者知道演示可能会出错。舞台是一个高压环境，你很容易犯错。与其花很长时间试图弄清楚出了什么问题，不如直接展示结果。观众对此不会有意见。他们是来学习的。演示失败虽然令人恼火，但并非致命问题。只需为每次演示可能失败做好准备，并在幻灯片末尾准备好那些截图页面。比起因为事情不如预期就放弃，不如坚持到演讲结束，展示一些结果——即使是计划之外的。正因如此，观众反而会敬佩你保持冷静并完成演讲。\n\
  \n如果演示失败，观众最不能接受的是你在台上手忙脚乱，而他们却得不到任何解决方案或结果。做好准备，日后你会感谢我的。\n\n## 如果可能，至少在活动现场彩排一次\n\
  \n在活动现场进行最后一次彩排有助于提升你的表现。如果可能的话，在演讲前一天前往活动现场，询问现场人员是否可以在舞台或讲台上进行简短彩排。这在大型会议上通常不太可能，但询问能否在正式演讲的房间练习一下也无妨。\n\
  \n这次造访能让你了解场地以及演讲时可以利用的设施。例如，你可以了解舞台有多大，以及主办方将使用什么系统来展示幻灯片。有些会使用投影仪，而另一些则会使用大屏幕电视。\n\
  \n在场地练习台词时，你应该已经开始思考如何在舞台上移动。如果你计划在演讲时走动，就需要确保有足够的空间；并非所有舞台都大到可以让你随意走动。另一个考虑因素是演讲是否会被录像。摄像机是固定位置的吗？如果是，你很容易走出画面。如果摄像机有操作员，那么你通常会有更多走动自由。你可以提前向会议主办方了解他们是如何管理摄像和录像的。\n\
  \n如果无法提前在场地进行完整彩排，也不必担心。提前找到你要演讲的房间仍然是个好主意，哪怕只是为了看一眼并知道路线。\n\n## 在舞台上\n\n重要的日子终于到来。你站在舞台上。笔记本电脑已设置好。投影仪正常工作，音视频工程师已为你配备了麦克风和发射器包。你站在那里——内心默默惊慌——与会者正陆续入场就座。就是这一刻：你为之准备的日子。你研究过演讲内容，制作了精美的幻灯片，排练的次数多到你自己都不好意思承认。你完成了演讲前的例行准备，此刻你站在舞台上，等待开始。\n\
  \n会议室的门关上了；灯光暗了下来。你开始讲话。\n\n### 将声音传送到会场后方\n\n在演讲过程中，你应该力求将声音传送到会场的最后一排。这样做能确保你的声音覆盖所有与会者。如果场地相当大，你应该考虑询问主办方将使用哪种麦克风，以确保全场观众都能听到你的声音。在大型会议上，主办方会为你提供麦克风，要么是领夹式麦克风，要么是头戴式麦克风。\n\
  \n然而，在小规模活动中，可能没有麦克风可用。这意味着你需要稍微提高音量，确保每个人都能听到你。无论你是否使用麦克风，想象你在对最后一排的人讲话，同时将声音投射出去。不必担心通过麦克风声音太大；负责会场音效的工作人员会处理音量问题。\n\
  \n### 与观众进行眼神交流\n\n你还应该练习与听众进行眼神交流。如果你避免眼神接触，观众可能会认为这是焦虑或缺乏自信的表现。当你期待观众有所反应时，最适合进行眼神交流。例如，当你提出修辞性问题时，可以与观众进行眼神交流。在陈述结论或关键要点时，也可以这样做。\n\
  \n一个好技巧是：与那些专注于演讲的人进行眼神交流。找到那些正在听你讲话的人，在演讲的关键时刻与他们进行眼神交流。\n\n进行眼神交流时，确保每次只持续几秒钟，以免对方感到不自在。你需要一次只与一个人进行眼神交流。\n\
  \n\n\n### 接受有些人就是无法集中注意力\n\n初学公共演讲的人看到听众中有部分人心不在焉、做其他事情时，往往会感到沮丧。当你看到有听众没有投入你的演讲时，不要责怪自己的表现。这些情况是你无法控制的。有些人就是对你的内容没有和你同等的兴趣，所以在一个大房间里出现少数不专注的人是正常的。\n\
  \n有些人可能很忙，是被迫来参加活动的。另一些人可能感到疲倦或分心。虽然你可以尽最大努力吸引全场听众，但你也应当预料到有些人会走神。此时你能做的最好的事，就是把注意力集中在那些正在倾听的人身上。\n\
  \n你绝对不要做的事情，就是在所有人面前点名批评他们。这会让对方难堪，也会让你显得小气。别人不认真听可能有正当的原因，但舞台不是评判他们的地方和时间。忽略它，继续专注于你的演讲。\n\
  \n### 向自己重申你信息的重要性\n\n在准备演讲的整个过程中，始终要向自己重申你将要讨论的主题为何重要。思考你的演讲能为听众带来什么实际价值。你应该在登台前再次进行这种自我确认。通过提醒自己这场演讲为什么重要，你将能为你的陈述注入激情。你的情感会显得更真诚，听众也更容易与你的故事产生共鸣。\n\
  \n通过向自己重申演讲的重要性，你也会感到更有动力去呈现一场精彩的演讲。你会在意如何表达，以及听众如何接收——你不会机械地照本宣科。\n\n重申主题的重要性也有助于创作出与目标听众相关的内容。人们常常在演讲中堆砌不必要的内容，尤其是为了填满更长的演讲时间而注水。结果，从目标听众的角度看，演讲的某些部分并不那么重要。有些人站上讲台或演讲台时，也容易跑题。他们有时会脱离讲稿和主要话题，随口说出当时脑海中想到的任何东西。\n\
  \n如果你在讲话时经常偏离主题，你会很快失去听众的兴趣。如果听众对话题不感兴趣，他们很快就会分心。通过始终聚焦于你演讲的重要性，你就能呈现一场不偏离主题的演讲。\n\
  \n### 在演讲的最初几分钟留下绝佳的第一印象\n\n每当你与陌生人见面交谈时，他们都会将你视为陌生人，这时你就有了留下绝佳第一印象的机会。公共演讲也是如此。大多数听众并不认识你，所以你有一个机会留下好印象。留下良好第一印象的机会只有一次，因此如果你想呈现一场精彩的演讲，就必须抓住这个机会。\n\
  \n要创造绝佳的第一印象，你需要从外表和声音上都表现得像你所选主题的权威人士。你还需要确保穿着得体，与场合相符。如果你参加的是企业活动，穿着牛仔裤和 T 恤出现在舞台或会议室里，可能无法达到你期望的第一印象。另一方面，如果你在一个非常非正式的见面会上演讲，却穿得像是要去开董事会一样登上舞台，同样不会给人留下正确的印象。\n\
  \n听众还会根据你在舞台上的声音以及你表现出的自信程度来评判你。当你说话时，即使使用了麦克风，也要将声音传到房间的后排。你需要说得足够慢，让大家能听清，但又不能慢到听起来怪异。说得太快也会显得缺乏自信和紧张，如果听众听不清你在说什么，他们就会失去兴趣。\n\
  \n听众会根据你说的话来评判你，因此你开口的头几个词对于建立绝佳的第一印象至关重要。以一个出色的开场白开始你的演讲，会在听众心中为你树立积极的形象。最好的做法是展现你的个性。\n\
  \n在向听众演讲时，你应该做自己。虽然这听起来可能有点老套，但在创造绝佳第一印象时，做自己是最好的方法，这是有原因的。当你面对众多听众时，自然会感到紧张。虽然有些听众可能理解你的紧张，但大多数人不会在意。他们只会根据你在台上的表现来评判你。\n\
  \n过去有人建议我在演讲时伪装自己的个性，这样即使不自信也能显得自信；但这只在你是个好演员的情况下才有效。对于我们这些没有受过专业表演训练的人来说，这种策略可能会适得其反。那些没有经过充分练习就想这样做的人，最终会看起来像是在装模作样。他们的个性会显得不一致，听众也能看穿这一点。\n\
  \n与其伪装个性，不如试着更自在地做自己——像你与朋友或同事交谈那样向你的听众说话。使用幽默是与听众互动的一种绝佳方式，因为它有助于驱散质疑或讥讽。在我演讲生涯的早期，一位导师曾建议我尝试在演讲的头\
  \ 60 秒内让听众发笑或微笑。通过让他们发笑或微笑，你能自动释放房间里的任何紧张气氛；听众会放松下来，与你更加互动。在演讲中使用幽默有助于让演讲者更接地气。你不再是舞台上对着单调幻灯片侃侃而谈的陌生人。幽默表明你是个人，并且有风趣的一面。使用幽默也显示出你自信且自在地与听众交流——即使你内心害怕得要命。如果你对自己的笑话微笑或轻笑，你也在向听众发出信号：你在开玩笑，他们可以跟着你一起笑。\n\
  \n\n\n在演讲中注入些许幽默固然是个好主意，但不必觉得自己必须成为一个喜剧演员。喜剧演员只有一个任务：让观众捧腹大笑。你的目标并非如此；你的笑话与喜剧演员的有着不同目的。你是想让在场的每个人都感到自在。\n\
  \n并非所有笑话或幽默都适用于所有场合。你需要考虑你的听众以及你认为什么才是恰当的。如果你是在公司活动上演讲，那么为了博取笑声而抛出一连串笑话可能并不合适。讲一些可能带有文化冒犯性的笑话也是非常糟糕的主意，任何可能被视为种族主义、性别歧视、恐同、恐跨性别，或者任何以“主义”或“歧视”结尾的言论也是如此。我个人发现，使用自嘲式、针对自己而非听众的幽默效果最好。在某种程度上，你可以随心所欲地调侃自己，而且自嘲也能展现出一种脆弱感。\n\
  \n如果合适的话，我喜欢在幻灯片上使用大量视觉笑话。对于某些观众来说，表情包和动图可以神奇地活跃气氛。我在面对软件开发人群时经常这么做，他们更欣赏这类幽默。\n\
  \n花些时间思考什么样的幽默对你的听众是合适的。试着在演讲开始后的第一分钟就引起听众轻声一笑或会心一笑，然后由此展开。不必觉得自己必须成为喜剧演员——那并非你的职责——但一点幽默就能起到很大的作用。\n\
  \n## 管理焦虑\n\n当对着一大群人讲话时，感到某种程度的焦虑是正常的。演讲前的一点点焦虑可能是件好事，因为它会激励你竭尽全力去准备和排练你的演讲。然而，在活动进行中，焦虑可能导致表现问题，从而降低你演讲的质量。你的目标是管理这种焦虑，使其不会影响你的表现。\n\
  \n### 将焦虑作为动力\n\n在即将面对一大群人时，我们都有同样的感受——胃里翻江倒海。优秀演讲者和平庸演讲者的区别在于他们应对的方式。处理紧张情绪的最佳方法是将其引导到你的工作上。如果你在演讲前感到焦虑，想想你能控制的事情，比如完善你的演示文稿。当你感到紧张时，问自己这个问题：“我能做些什么来改进我的演讲？”\n\
  \n这个问题会引出一系列答案，这些答案都可以导向更好的演讲。在准备演讲时，你应该选择优先列表中排名第一的答案，然后着手处理，直到你满意为止。\n\n焦虑通常会在大脑空闲时袭来。如果你把时间花在准备演讲上，你的大脑就会忙得没空让焦虑趁虚而入。\n\
  \n### 在演讲当天减轻焦虑\n\n如果你觉得在演讲前一周焦虑已经糟得不能再糟了——特别是对于新演讲者来说——那么到了演讲当天，你的神经可能会崩溃。你的焦虑会在演讲当天增加十倍，尤其是在演讲前的几个小时里。\n\
  \n在演讲前一小时，我喜欢出去散散步，尤其是天气好的时候。如果可能，我会离开会场去散步，因为我通常不想被打扰。通过散步，我能让身心保持活跃，而不必为演讲而烦恼。你做的演讲越多，经验越丰富，就越能更好地管理和控制你的神经。即使经验丰富，我仍然会紧张，而演讲前的散步通常会有帮助。确保不要离会场太远，并注意时间。通常，你需要在广告宣传的演讲开始时间前至少\
  \ 15 分钟到达你的演讲室进行准备。不要离会场太远，以免到时候需要匆忙赶回，这只会让你更有压力。\n\n当你在台上做准备工作时，会有一段等待听众入场就座的时间。我发现，当我站在那里，环顾四周，清楚地知道人们会抬头盯着我看，等着人们进来时，这让我更加紧张。如果你是在一个更小、更亲密的活动中演讲，比如房间里少于\
  \ 30 人，你可以很轻松地融入听众中，与他们交谈，就像在任何其他社交场合一样。只要有机会，我都喜欢这样做，这能很好地打破僵局，让你了解你的听众，但当听众数量增多时，这就变得更难做到了。\n\
  \n如果你是在一个更大的活动上演讲，可能有上百人，或者甚至超过五百到一千人，那么交流和互动就变得更难了。你将身处一个大型礼堂，人们进来入座时会相当嘈杂。我不喜欢在这样的房间里站在台上等着开始。等待开始的感觉就像永恒一样漫长，即使只有十分钟。一旦音响师帮我设置好麦克风，我的笔记本电脑也正确连接，我会让标题幻灯片留在投影仪上。然后我关掉麦克风包，坐在第一排等着。这样做，你就脱离了观众的视线，可以放松几分钟。你甚至可能会觉得去上个卫生间是个好主意，尽管最好在设置设备前就解决这个问题。如果你确实需要快速去趟卫生间，确保关掉你的麦克风包。不幸的是，我曾听说一位演讲者因此出了岔子，当时他在调音台上的麦克风没有被静音。\n\
  \n我想给你的最后一条建议是，不要试图去酒吧喝点小酒来镇定神经。我再怎么强调也不为过：绝不要在喝了一两杯酒后上台。如果你的思维过于放松，你很容易犯错或说出一些之后会后悔的话。如果你喝多了，醉醺醺地上了台，那么你会口齿不清。在台上喝醉是毁掉自己声誉、在演讲生涯尚未开始就将其终结的绝佳方式。\n\
  \n### 使用方框呼吸法管理焦虑\n\n在上台之前，有一种简单的呼吸技巧可以帮助你平复焦虑，提高思维警觉性，并帮助你集中注意力。它叫做方框呼吸法，也称为箱式呼吸。这是一种被精锐军事小组（如海豹突击队）使用的技巧，用于在高压力的战斗情境中保持警觉和冷静。这是一个非常简单的技巧，你可以在任何地方使用，不仅仅是在演讲前。你可以在求职面试前或者上台表演前使用——实际上任何地方都可以。它只有四个简单的步骤：\n\
  \n1.  吸气四秒钟，让空气充满你的肺部。\n2.  屏住呼吸四秒钟。\n3.  慢慢呼气八秒钟。\n4.  不要停顿，直接回到第一步，再次充满你的肺部。\n\
  \n连续重复这个过程三到四次。我一直都在做这个呼吸练习，这是一种平复情绪的绝佳方法。如果它对精锐军事小组有效，那么它也一定能帮你在上台前稳住神经。\n\n\n\n\
  ### 通过小胜利建立自信\n\n随着你在面向大众演讲方面积累经验，你最终会形成自己的方法来防止焦虑。大多数经验丰富的演讲者通过提醒自己过去的成功，来学会避免怀疑性思维以及其他可能影响他们表现的各种焦虑想法。\n\
  \n当你刚开始时，可能没有太多经验可以从中汲取自信。然而，你可以创造属于自己的成功感，以此来提醒自己你能行。例如，在一次大型会议演讲之前，你可以先承担一些自己容易组织的小型用户组演讲。\n\
  \n在我面向大型会议和活动演讲之前，我曾在小型聚会小组中练习演讲。有些我演讲过的小组只有大约十名听众，但那没问题，因为我正在积累经验。在挑战大型专业会议之前，我在许多聚会小组中发表过演讲。\n\
  \n当轮到我登上大型舞台，向数百人演讲时，我可以回顾自己参与过的所有聚会小组演讲。我能记起所有的成功，并用这些来安慰自己：我能做到，并且会成功。这是一个简单的技巧，但在关键时刻确实能发挥作用，因为在那种紧张时刻，你会遭受严重的自我怀疑。\n\
  \n### 让自己专注于演讲\n\n当你站在舞台上时，除了像练习时那样进行演讲之外，别无他事。在这个阶段，你需要让自己的思绪专注于手头的任务。你需要控制大脑，避免它游移到与演讲无关的其他想法上。\n\
  \n当你开始演讲时，我提到过做一些基本的呼吸练习来清空大脑。从那时起，你应该让自己的思绪专注于下一步需要做什么。当你被某个随机的想法或周围环境分散注意力时，立即通过看向笔记本电脑、舞台屏幕或提示卡片，让自己重新回到演讲中；这应该能让你回到专注于演讲的精神状态。\n\
  \n随着你获得更多经验，专注于演讲的练习会变得更容易。你的大脑会本能地屏蔽环境中的干扰。你也会习惯性地遵循自己的演讲流程。你将能够培养出对干扰想法的强大抵抗力。\n\
  \n如果你随身带着手机，我建议将其调成飞行模式或关机——除非你正在使用计时或秒表功能。你最不希望发生的事就是在演讲期间接到电话。如果你忘记关机，而有人试图给你打电话，显然，你不应该接听。试着忽略它，或者巧妙地拿出手机并拒接来电。不过，静音的手机不会打扰你，所以尽量在开始演讲前确保将其静音。\n\
  \n### 适应演讲中的变化\n\n在理想情况下，你希望尽量减少演讲中的即兴发挥。但有时，某些情况会阻止你按练习的方式完成演讲。例如，你依赖的一些工具可能无法正常工作，或者某个演示就是运行不了。有时，你可能会在最后一刻想到一些想要补充的新想法。\n\
  \n你应该准备好适应演讲中的变化。业余的公开演讲者在看到自己演讲的某个部分进展不顺利时，常常会抱怨。但这并不能解决问题。当你遇到这种情况时，尽量避开这类借口。相反，你需要想出一个解决问题的办法，让你即使遇到障碍也能顺利完成演讲。\n\
  \n在本书前面，我谈过如何缓解网络问题和演示失败的情况。如果你是在进行技术演讲——以我为例，是软件开发演讲——遭遇演示失败是相当常见的事。无论你练习了多少次，在面对大量听众站在舞台上时，似乎总会出现问题。如果你没有准备，一次演示失败可能会完全破坏你的演讲，并击碎你的自信。\n\
  \n当然，你可以为此种意外情况做好准备。我个人曾多次遭遇演示失败，但因为我有预案，总能成功完成演讲，并且听众也获得了他们想要的信息。听众并不在意演示是否失败；他们想要的是你的信息和见解，所以不要害怕使用你的备用幻灯片或预先录制的演示视频。\n\
  \n有时，在演讲即将开始前，你会想到一些新想法。理想情况下，你不应该考虑对你练习过的演讲进行改动；已经太晚了。这些改动只会打乱你的节奏，因为你没有练习过这些新增内容，除非你是一位经验丰富的演讲者，否则这些未经练习的添加物会非常明显地被听众察觉。不过，你可以记下这些想法，并在以后版本的演讲中加入，这样你就有机会练习它们了。\n\
  \n如果你的演讲是全新的，那么你无疑会看到可以改进的地方，所以记下它们，稍后再融入进去。不要试图即兴发挥。坚持原计划。\n\n## 处理提问\n\n公开演讲中，比演讲本身更能让演讲者感到恐惧的，往往是最后的问答环节。演讲者害怕这个环节是很自然的，刚开始时我也一样。在整场演讲中，你掌控着局面，你控制着故事和节奏，一切由你主导。当演讲结束，你向听众开放提问环节时——你确实应该这样做——对局面的严格掌控可能会发生变化，因为听众会更有主动权，你完全不知道他们会问什么。\n\
  \n不过，我可以给你一些建议，让问答环节不那么可怕。记住，你不必是自己选定主题的世界头号专家，不知道答案或不能马上回答也没关系。\n\n### 告知听众你希望何时提问\n\
  \n在开始演讲的介绍部分时，让听众知道你希望他们以何种方式提问。有些演讲者非常乐意在演讲过程中被举手提问打断，并随时回答问题。而包括我在内的其他演讲者，则更希望人们等到最后再提问，因为我可能无论如何都会回答他们的问题；他们只需要等待。不过，一定要表明你的偏好，因为这样可以避免有人打断你时你感到恼火。\n\
  \n### 回答前先思考\n\n当有人向你提问时，先用几秒钟思考一下你的回答，然后再作答。听众不会注意到这短暂的停顿，而这给了你理清思路的机会。仓促地回答一个问题可能会让你出错，你可能会说错话；紧张情绪会导致这种情况。\n\
  \n### 不要害怕要求重复问题\n\n在大房间里，尤其是在会议场所，会有很多背景噪音。如果你没听清问题，请听众澄清或重复一遍。有些会议现场会有拿着麦克风的工作人员，他们会走到提问者身边。那样的话，提问者的声音会通过公共广播系统传送过来，但如果听众是直接喊出问题，那么如果他们在房间后面，你很可能很难听清他们说什么。\n\
  \n\n\n### 复述问题，确保人人听清\n\n如果提问者所处位置没有麦克风供其使用，那么很可能大多数人无法听清问题。在回答问题之前先复述一遍问题总是个好主意；否则，听众只能听到答案而缺乏问题背景。\n\
  \n复述问题不仅是对在场听众的礼貌，如果演讲内容要为会议网站或 `YouTube` 录制视频，那么复述问题也会让观看视频的人更好地理解内容。\n\n### 保持积极心态\n\
  \n在演讲结尾回答随机提问可能会让你感到压力，因为你无法预知听众会问什么。他们可能会问一些简单的问题，以澄清你在演讲中提到的内容。这类问题通常很容易处理。你也可能会听到有人讨论与你所述内容不同的替代方案；这种交流总是值得感谢，因为你能学到新东西。你也可能会遇到那种只想通过纠正你来让你难堪的“那个么，实际上……”类型的人，他们往往更难应付。无论听众提出什么样的问题或评论，都要感谢他们的提问、建议或见解。\n\
  \n在最极端的情况下，你可能会遇到一个反对你所有观点的人，而且，天哪，他们就是想当着另外 200 个人的面让你知道这一点。无论何种情况，始终保持积极心态。如果某个听众故意刁难，绝不要与他发生冲突。在我多年的演讲生涯中，我只遇到过一个人在\
  \ `QA` 环节表现得像个无礼之徒。我那次演讲的内容是关于使用 `Microsoft Dot NET` 平台的密码学，特别是关于 `Microsoft` 提供的库。但有一位听众对此并不满意，基本上是想说我是个白痴，因为我没有讲某个特定的第三方密码库，尽管演讲描述中明确说明这是关于\
  \ `Microsoft` 自带的默认库。你对此能做的很有限，除了感谢他的提问，在这种情况下，我提醒他这次演讲是关于 `Microsoft` 特定库的，然后继续往下讲。\n\
  \n如果你遇到一个看起来像是来找茬的人，绝不要争论或发脾气，因为他们会断章取义，试图在社交媒体上让你难堪。这种情况很少见，但如果发生了，请保持积极和礼貌。\n\n\
  ### 诚实守信，绝不撒谎\n\n你一定会遇到有人问一个你不知道答案的问题。如果发生了，别担心；这并非世界末日。当场被问到时，没人能回答所有问题。如果出现这种情况，只需说你不知道，但会去查明答案。大多数听众都非常理解。你绝对不应该做的事，就是试图虚张声势地蒙混过关，或者干脆撒谎，因为你迟早会被揭穿。\n\
  \n我有一个用过很多次的好技巧，就是把问题抛回给听众。在紧张时刻，即使你通常知道答案，也可能一时想不起来；上台的压力会让你思维混乱。如果你向听众提问，也许会有人尝试回答。这样做，提问的人得到了答案会感到满意，你的压力也卸下了。而且，随着问题被回答，如果你问的是自己认为知道但一时记不起来的，这也许会帮助你恢复记忆。\n\
  \n如果有听众真的帮忙并提供了答案，一定要完整复述他们的答案，确保室内所有人都能听到，并记得感谢他们。\n\n作为演讲者，我们并非完人。我们记不住答案，也无法回答每一个问题，所以利用听众的优势，请他们帮忙吧。没人会介意，而且每个人都能从答案中受益。你自己甚至也可能学到新东西，这总是件好事。\n\
  \n演讲的问答环节，即使是最有经验的演讲者也会感到恐惧，但它并非必然如此。如果你做好准备，并接受自己无法回答所有问题的事实，你会感到更放松。在上一章中，我建议为你预判可能的问题准备答案。这是一个至关重要的准备技巧，你通常能预测到大部分会被问到的问题，然后为其准备答案。对于所有其他问题，不要惊慌，保持积极心态。正如我之前建议的，如果你真的无法回答问题，就直说，然后把问题抛回给听众。如果你以这种心态去应对，就能大大降低将要面对的焦虑程度。\n\
  \n## 线上演讲与网络研讨会\n\n当我们想到公开演讲时，我们通常认为指的是某人站在舞台上向听众致辞，或在会议室里向同行发言。虽然这是公开演讲的传统概念，但它并非唯一的选择。公开演讲还包括以网络研讨会的形式在线向听众进行演示，或者作为更具互动性的线上模拟真实演讲。\n\
  \n### 网络研讨会 vs. 线上演讲\n\n在思考线上演讲的形式时，你可能首先想到的是网络研讨会。网络研讨会由一个人通过网络摄像头和麦克风对着电脑讲话组成，报名观看演讲的人数可以是从一个人到几千人不等。通常，作为演讲者，你看不到听众；你只是向任意数量的在线观众进行广播。你可能通过一个聊天窗口获得少量的互动，观众可以在那里发表评论和提问，但通常你直到最后才会去看这个窗口。\n\
  \n线上演讲类似于网络研讨会，并且常被视为同一回事；然而，两者存在一些细微差别。如果你通过像 `Zoom`、`Microsoft Teams`、`Google\
  \ Hangouts` 或任何其他涌现出来的众多会议平台进行演讲，那么当你讲话时，你可以看到听众的“画廊”视图。如果听众打开了他们的摄像头，你甚至能看到他们。\n\
  \n在使用这些平台时能够看到参与者，让这种体验感觉更像是一场面对面的公开演讲活动。实际上，这和真实情况完全不同；不过，这些平台确实有它们的优势。\n\n主要优势在于地理方面。要进行现场演讲，你必须让所有与会者在同一时间聚集到同一地点。人们可能需要开车、乘坐公共交通甚至乘飞机才能参加活动。这意味着有些活动很难参与，并且不像我们可能希望的那样具有包容性。现场活动的门票可能相当昂贵，这还没算上路费、住宿以及餐饮等一般性开支。\n\
  \n而通过线上活动，你消除了地理障碍，这能让更多的人参与到活动中来。线上形式也能显著降低与会者的成本，因为你无需旅行、预订酒店以及支付其他开销。\n\n\n\n\
  ### 新冠疫情时代在线演讲的兴起\n\n线上演讲并非新鲜事。它已存在多年，但随着 2020 年和 2021 年新冠疫情的爆发，在线项目被推到了最前沿。一夜之间，所有线下活动都被取消，许多活动在最后一刻转为线上。我亲身经历了许多突然转向线上的活动。\n\
  \n我合作的一家会议公司——位于挪威奥斯陆的 NDC Conferences——也不例外。就在疫情正式爆发前，我在两场 NDC 线下活动中发表过演讲——一场在奥斯陆举行的较小规模的安全会议，以及随后一周在伦敦举行的大型多轨会议之一。我为\
  \ NDC Conferences 安排的下一场演讲活动原定在葡萄牙波尔图。我很期待参加那场活动，因为我从未去过波尔图，但该活动很快被改为线上形式。\n\n就个人而言，在我参与的所有线上活动中，我最喜欢\
  \ NDC 的会议组织方式，因为它很简单。如果你持有门票，你会被邀请加入一个 `slack` 团队，其中为每个演讲厅、休息区和聊天区等设置了多个频道。每次演讲通过\
  \ `Zoom` 或 `Cisco Webex` 进行。演讲在每个房间对应的 `slack` 频道中发布通知，参与者和演讲者登录视频会议软件，然后演讲者开始演讲。\n\
  \n显然，这种体验与线下活动不同。然而，考虑到世界正面临前所未有的状况，每个人都必须保持社交距离，这种虚拟活动的设置运作得非常好。\n\n随着世界逐渐走出新冠疫情，我认为我们将继续看到一种更为混合的会议模式。线下活动将回归，票价也会更高，但同时也会有一种更便宜的纯线上版本，演讲会进行实时直播。如果说疫情教会了演讲者和活动公司什么，那就是如何创新，因此未来可能会非常有趣。\n\
  \n### 充分发挥线上演讲效果的技巧\n\n在线上活动与线下活动发表演讲，在演讲的实际呈现方面是相似的。写作、准备和排练没有太大区别；你需要投入同等程度的工作和努力。区别在于演讲的呈现方式，因为你与听众并不在同一个物理空间。让我们看看一些技巧，帮助你更好地向线上观众演讲。\n\
  \n#### 尽量站着演讲\n\n在线演讲时，你只是对着电脑说话，很容易想坐着。因此，这可能感觉与参加同事的虚拟会议没有太大区别，但我发现，如果你站着演讲，会让你进入一种不同的心态，从而呈现高质量的演讲。\n\
  \n我在办公室使用电动升降桌，所以如果我想站着，只需按一下按钮就能把桌子升起来。如果你没有升降桌，只要能重新调整摄像头的角度，你仍然可以站着。如果你使用的是独立于电脑的摄像头，你可以把它安装在三脚架上抬高——请注意，我确实建议购买质量更好的摄像头，因为笔记本电脑自带的摄像头效果不佳。\n\
  \n#### 想象你的观众\n\n进行线下演讲时，你很容易判断观众的反应，因为他们就坐在你附近。在线演讲则要困难得多，因为物理距离和技术手段将你们分隔开来。通过像\
  \ `Zoom`、`Microsoft Teams` 和 `Cisco Webex` 这样的平台，你可以看到参与者的**画廊视图**，希望他们打开了摄像头，这样你就能看到他们的面孔和反应。虽然理论上这是个好主意，但实际效果往往不尽如人意。\n\
  \n在疫情期间，当我进行线上演讲时，人们最初很乐意开启摄像头并露面。在我参与的第一场线上活动中，活动初期摄像头是开着的。随着活动进入最后一天，越来越多的参与者开始关闭摄像头，因为他们不希望被看到。我能理解这一点：在家开启摄像头会让人感觉隐私受到侵犯，而且随着人们对线上演讲越来越疲劳，关掉摄像头也是很自然的事。\n\
  \n在 2021 年 1 月我参加的一场活动中，观看我演讲的 80 名参与者中，没有一个人打开摄像头。现在，每当我进行线上演讲时，我甚至懒得显示画廊视图了。我更多地将它视为一场网络研讨会。我出现，然后做我的演讲。\n\
  \n#### 注意你的背景\n\n这一点可能显而易见，但我看过很多演讲，演讲者的背景杂乱无章，非常分散注意力。没有什么比杂乱无章或看到你身后挂着待洗的衣物更糟糕的了。我可以提供几个解决方案。首先，在演讲前整理好，把杂物移开，让背景看起来自然。没人想看到你晾着的内裤。如果可能的话，在身后设置一盏灯照亮背景，也能带来显著的不同。你不必花大价钱购买昂贵的灯光设备，但一盏照亮背景的台灯就能创造出有趣的场景，效果出奇地好。\n\
  \n有些人——包括演讲者和参与者——不一定喜欢让别人看到自己的居住环境。像 `Zoom` 这样的现代视频平台允许你更改背景。`Zoom` 可以用你选择的图片替换你的背景，效果还不错，但如果你真想让它看起来更棒，可以在身后使用绿幕。如果你使用绿幕，`Zoom`\
  \ 或其他类似平台能更出色地移除你的物理背景并用图像替换。这样，你可以选择任何你喜欢的背景——图书馆、热带岛屿，或者我个人最喜欢的，《星际迷航》中企业号星舰的舰桥。\n\
  \n#### 关注照明\n\n良好的照明对于确保你在摄像头前看起来状态良好至关重要。如果照明不佳，你在屏幕上会显得太暗。如果你站在大窗户前演讲，在视频中你会看起来像一个剪影。\n\
  \n如果你在一个光线充足的房间里演讲——窗户在你一侧、头顶有不错的室内灯光——那么你真的不需要投资很多昂贵的照明面板。然而，如果你的房间很暗，那么在显示器两侧放置几盏\
  \ LED 灯可能是个好主意。如今，你可以花很少的钱买到 LED 照明面板。我花了不到 100 美元买了两个带三脚架的照明面板。不要过度设计你的灯光。你只需要一点照明；你不是要照出下一部好莱坞大片。如果你的房间已经有良好的照明，就用它吧。你的听众可能大部分时间在看你的幻灯片，而不是看你。\n\
  \n#### 着装得体\n\n仅仅因为你是在家演讲，并不意味着你应该看起来像个彻底的邋遢鬼。考虑一下你正在演讲的活动，然后思考什么服装是合适的。如果这是一个充满高管的企业活动，那么你需要花些心思，穿得正式一点。\n\
  \n如果是一个软件开发会议，举例来说，那么你可以穿得随意一些，穿牛仔裤和 T 恤。我不建议你穿着睡衣做演讲，即使你在演讲前十分钟才起床——除非你是在国际睡衣爱好者大会上演讲。\n\
  \n当你公开演讲时，你是在向世界展示自己，分享想法。人们会评判你，你必须给人留下良好的第一印象，无论你是在线上演讲，还是在线下活动的舞台上演讲。\n\n\n\n\
  #### 注意你的视线方向\n\n通过摄像头进行在线演讲时，你需要留意自己的视线方向。当你讲解幻灯片内容时，很自然地会盯着显示器或笔记本电脑屏幕。然而，在观众看来，这就像是你没有直视他们。为了解决这个问题，请务必看向摄像头——不必全程如此，但在整个演讲过程中应有规律地这样做。\n\
  \n一个好办法是在摄像头上贴两个塑料假眼睛，不知为何，你会不自觉地想去看它们的\"眼睛\"。当我们与真人交谈时，会注视对方的眼睛，而这招能达到类似效果。这是确保你定期进行眼神接触的绝佳技巧。\n\
  \n#### 不要过度复杂化你的演讲设备\n\n2020 年初疫情来袭时，当所有人都意识到必须居家办公并使用视频会议软件时，突然掀起一股抢购摄像头、灯光和各种小工具的热潮，人们试图将普通的视频通话变成全景电视制作。伴随着这些花哨硬件，人们还使用`Open\
  \ Broadcast System`等软件搭建不同的制作场景，以便在演讲中途像新闻直播那样切换场景。\n\n这一切虽然令人印象深刻，但并非必要。我并非说你永远不该尝试此类技巧。摆弄这些确实有趣，但我参加过大量演讲，它们虽在技术上令人赞叹，内容却相当肤浅——因为演讲者过分关注表达形式而忽视了内容。当然也不全是这样，有些人确实用这种技术完成了精彩的演讲，但他们都是经验非常丰富的演说家。\n\
  \n我不是要扫大家的兴——你大可以玩这些设备——但别忘了最关键的部分：构思并呈现一场精彩的演讲。只要你的演讲结构清晰、准备充分，观众就会喜爱你的内容。如果你连这些基本功都没掌握，那么即使视觉效果再好，演讲也会显得乏味。\n\
  \n公共演讲本质上是一场简单的交流。听众来到你的演讲现场，希望享受其中，然后带着对你核心观点的领悟满意离开。三个月后，没人会记得\"因为`Open Broadcast\
  \ System`触发了多个场景所以特别喜欢那场演讲\"——它仅仅是传递机制，远没有演讲的实际内容重要。在掌握基本功之前，别过度设计这些技术细节。\n\n##\
  \ 总结\n\n我们来到了这本公共演讲书籍的结尾。在人前发言通常是件令人恐惧和紧张的事。我刚开始时也不例外。一想到要在大庭广众面前演讲，我就焦虑不已。在我一生克服的所有挑战中，公共演讲是我最引以为傲的成就。它赋予了我全新的自信，为我打开了在世界级活动中演讲的诸多乐趣，让我得以环游世界。如果我能做到，你也一定可以。\n\
  \n本书的核心主题是：准备是成功的关键。从研究主题、提前制作幻灯片、反复练习直至熟记于心，到为舞台上的突发状况制定预案——只要提前准备，你就能减轻表演焦虑，呈现精彩的演讲。\n\
  \n要成为公共演讲者，你不必是所在领域的专家。演讲可以设置不同难度层级，总会有听众比你更不了解这个主题。只要将演讲设定在合适的难度，你就没问题。例如，如果你要做一场关于学习\
  \ Java 编程语言的演讲，而你自己只是初学或中级程序员，就不该标榜这是高级演讲；否则会吸引错误的听众。反之，如果你讲授高级 Java 内容，却面向初学者宣传，听众就会跟不上，因为他们期待的是入门级演讲。\n\
  \n我写这本书的目的是在短时间内为你提供所有成功所需的工具。我更希望你快速阅读本书，然后把时间花在应用这些技巧上，而不是啃完一本 400 页的大部头，忘掉一半内容，最后却来不及准备你梦想中的演讲。\n\
  \n最后，感谢你购买并阅读这本书。我真诚希望书中所讲的内容能帮助你研究、规划、准备并呈现一场关于你选定主题的精彩演讲。祝你好运。\n\n## 课后练习\n\n\
  1.  练习本章前面讨论的可视化技巧：想象自己进行了一场成功的演讲，观众报以热烈掌声。提前做这些可视化练习有助于缓解焦虑。\n\n2.  练习\"方形呼吸法\"\
  ，熟悉这种技巧及其镇定效果。\n    *   吸气四秒，让空气充满肺部。\n    *   屏住呼吸四秒。\n    *   缓慢呼气八秒。\n    * \
  \  不要停顿，直接回到第一步，再次将肺部充满空气。\n\n3.  参加活动前，整理好你的线材、转接头和适配器包。考虑以下物品：\n    *   笔记本电脑充电器\n\
  \    *   出国旅行用的国际电源适配器\n    *   HDMI 适配器（可能备几种不同品牌）\n    *   VGA 适配器（有些场地使用极旧的投影系统）\n\
  \    *   幻灯片翻页器（让你能在舞台上远离笔记本电脑）\n    *   存有演讲所需所有文件备份的 U 盘\n\n4.  如果你计划面向线上虚拟观众进行演讲，请安装主流平台并熟悉它们。需要考虑的平台包括：\n\
  \    *   Zoom\n    *   Teams\n    *   Google Meet\n    *   Cisco Webex\n\n\n\n"
