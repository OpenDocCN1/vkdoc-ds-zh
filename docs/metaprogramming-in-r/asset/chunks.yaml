    \ and Expression Evaluation\n\nFinally, this section covers how you combine expressions\
    \ and environments to compute values. The good news is that you are past all the\
    \ hard stuff, and it gets pretty simple after all of the previous stuff. All you\
    \ have to do to evaluate an expression in any selected environment chain is to\
    \ provide it to the `eval` function. You can see this in the following example\
    \ that evaluates the same expression in the lexical scope and the dynamic scope:\n\
    \n```\nf <- function() {\nx <- 1\nfunction() {\ny <- 2\nfunction() {\nz <- 3\n\
    cat(\"Lexical scope: \", x + y + z, \"\\n\")\ncall_env <- build_caller_chain()\n\
    cat(\"Dynamic scope: \", eval(quote(x + y + z), call_env), \"\\n\")\n}\n}\n}\n\
    g <- f()()\nh <- function() {\nx <- 4\ny <- 5\ng()\n}\nh()\n## Lexical scope:\
    \  6\n## Dynamic scope:  12\n```\n\nThe hard part of working with environments\
    \ really isn’t evaluating them. It is manipulating them.\n\nFootnotes [1](#A449887_1_En_3_Chapter.html#Fn1_source)\n\
    \nIf you want to name your environments, you can set the attribute “name.” It\
    \ is generally not something you need, though.\n\n  [2](#A449887_1_En_3_Chapter.html#Fn2_source)\n\
    \nStrictly speaking, there is a lot more to importing other packages than what\
    \ I just explained here, but it’s beyond the scope of this book.\n\n  [3](#A449887_1_En_3_Chapter.html#Fn3_source)\n\
    \nIf you check the documentation for `new.env`, you will see that the default\
    \ argument is actually `parent.frame()`. If you think about it, this is how it\
    \ becomes the current environment: when you call `new.env`, the current environment\
    \ will be its parent frame."
  trans: "\n## 显式创建环境\n\n你可以通过 `new.env` 函数创建一个新环境。默认情况下，该环境会将当前环境作为其父环境，并且你可以使用 `exists`\
    \ 和 `get` 等函数来检查它所包含的内容。\n\n```\nenv <- new.env()\nx <- 5\nexists(\"x\", env)\n\
    ## [1] TRUE\nget(\"x\", env)\n## [1] 5\nf <- function() {\nx <- 7\nnew.env()\n\
    }\nenv2 <- f()\nget(\"x\", env2)\n## [1] 7\n```\n\n你也可以使用 `$` 下标运算符来访问它，但此时 R\
    \ 不会向上搜索父环境列表来查找变量；只有当变量存在于该实际环境中时，你才能获取到它。\n\n```\nenv$x\n## NULL\n```\n\n你可以使用\
    \ `assign` 或通过 `$<-` 函数向环境中赋值变量。\n\n```\nassign(\"x\", 3, envir = env)\nenv$x\n\
    ## [1] 3\nenv$x <- 7\nenv$x\n## [1] 7\n```\n\n根据你对环境的用途，你可能不希望它拥有父环境。但并没有办法实现这一点。\n\
    \n```\nenv <- new.env(parent = NULL) # 这行不通！\n```\n\n所有环境都有父环境，但空环境除外。不过，你可以通过将空环境设为你新环境的父环境来达到次优效果。\n\
    \n```\nglobal_x <- \"foo\"\nenv <- new.env(parent = emptyenv())\nexists(\"global_x\"\
    , env)\n## [1] FALSE\n```\n\n你可以尝试用手动创建的环境做一些更有趣的事情，比如构建一个并行的调用栈，用来实现动态作用域而不是词法作用域。词法作用域是\
    \ R 中已有的作用域机制，其中函数调用的父环境是函数的定义域。而动态作用域则将调用环境作为父环境。在具有动态作用域的语言中，程序逻辑极难推理，因此我建议你避免使用它，但出于教学目的，你可以尝试实现它。\n\
    \n由于你不想实际修改调用栈和父环境指针，你需要创建一系列并行的环境，并将每个调用栈帧的内容复制到这些环境中。你可以像这样复制一个环境：\n\n```\n\
    copy_env <- function(from, to) {\nfor (name in ls(from, all.names = TRUE)) {\n\
    assign(name, get(name, from), to)\n}\n}\n```\n\n为了说明问题，你需要一个函数来展示当你沿着环境链向下直到全局环境时，每个环境中可以看到哪些名称。你不想一路向下直到空环境，所以你可以提前停止。这个函数让你做到这一点：\n\
    \n```\nshow_env <- function(env) {\nif (!identical(env, globalenv())) {\nprint(env)\n\
    print(names(env))\nshow_env(parent.env(env))\n}\n}\n```\n\n现在轮到创建并行环境链的函数了。这并不难；你可以使用\
    \ `parent.frame` 来获取调用栈上任意深度的帧——实际上，可以一直向下到第一个函数调用——并且你可以使用 `sys.nframe` 函数来获取调用栈的深度。唯一需要注意的是，你需要将栈深度调整\
    \ 1，因为你希望为函数的调用者（而不是函数本身）创建调用栈链。剩下的部分只是一个循环。\n\n```\nbuild_caller_chain <- function()\
    \ {\nn <- sys.nframe() - 1\nenv <- globalenv()\nfor (i in seq(1,n)) {\nenv <-\
    \ new.env(parent = env)\nframe <- parent.frame(n - i + 1)\ncopy_env(frame, env)\n\
    }\nenv\n}\n```\n\n要看到它的实际效果，你需要设置一个相当复杂的示例，其中同时包含嵌套作用域和调用栈。它看起来不太美观，但请尝试理解它，并思考函数环境应该是什么样子，以及调用栈应该是什么结构。\n\
    \n```\nf \n## [1] \"z\"\n## \n## [1] \"y\"\n## \n## [1] \"x\"\n## [1] \"---Calling\
    \ environments---\"\n## \n## [1] \"z\"\n## \n## [1] \"x\" \"y\"\n```\n\n当你调用 `h`\
    \ 时，它会调用 `g`，你会得到一个环境列表，从包含 `z` 的最内层开始，一直到包含 `x` 的、全局环境之前的最后一个层级。在（并行的）调用栈上，你首先也会看到一个\
    \ `z`（它位于函数环境的副本中，但确实存在），但这个链只有两步长，第二个环境包含了 `x` 和 `y`。\n\n你可以使用这里构建的栈链来实现动态作用域。你只需要在这个链所定义的作用域内求值表达式，而不是在当前求值环境中。`<<-`\
    \ 赋值运算符不会起作用——你需要编写一个类似的函数来获得该行为，并且关于对这个链所做的更改在多大程度上应该被写回到实际调用栈帧中，这将是一个设计选择。然而，只要涉及表达式求值，你就可以将其用于动态作用域。\n\
    \n## 环境与表达式求值\n\n最后，本节介绍如何将表达式和环境结合起来计算值。好消息是，你已经度过了所有困难的部分，在经历了前面所有内容之后，这变得非常简单。你只需要在任何选定的环境链中求值一个表达式，就是将其提供给\
    \ `eval` 函数。你可以在以下示例中看到这一点，该示例在词法作用域和动态作用域中求值同一个表达式：\n\n```\nf <- function() {\n\
    x <- 1\nfunction() {\ny <- 2\nfunction() {\nz <- 3\ncat(\"Lexical scope: \", x\
    \ + y + z, \"\\n\")\ncall_env <- build_caller_chain()\ncat(\"Dynamic scope: \"\
    , eval(quote(x + y + z), call_env), \"\\n\")\n}\n}\n}\ng <- f()()\nh <- function()\
    \ {\nx <- 4\ny <- 5\ng()\n}\nh()\n## Lexical scope:  6\n## Dynamic scope:  12\n\
    ```\n\n使用环境时，真正的难点实际上不在于求值。而在于操作它们。\n\n脚注\n\n如果你想给你的环境命名，你可以设置 `\"name\"` 属性。不过通常你并不需要这样做。\n\
    \n严格来说，导入其他包的方法远比我这里解释的要多，但这超出了本书的范围。\n\n如果你查看 `new.env` 的文档，你会看到默认参数实际上是 `parent.frame()`。仔细想想，这就是它成为当前环境的方式：当你调用\
    \ `new.env` 时，当前环境将成为它的父框架。\n"
- fmt: "# Manipulating Expressions\n\nExpressions, the kind you create using the `quote()`\
    \ function, come in four flavors: a primitive value, a name, a function call or\
    \ a control structure, and a pairlist. Function calls include operators such as\
    \ the arithmetic or logical operators because these are function calls as well\
    \ in R, and control structures can be considered just a special kind of function\
    \ calls — they only really differ from function calls in the syntax you use to\
    \ invoke them.\n\n```\nclass(quote(1))\n## [1] \"numeric\"\nclass(quote(\"foo\"\
    ))\n## [1] \"character\"\nclass(quote(TRUE))\n## [1] \"logical\"\nclass(quote(x))\n\
    ## [1] \"name\"\nclass(quote(f(x)))\n## [1] \"call\"\nclass(quote(2+2))\n## [1]\
    \ \"call\"\nclass(quote(if (TRUE) \"foo\" else \"bar\"))\n## [1] \"if\"\nclass(quote(for\
    \ (x in 1:3) x))\n## [1] \"for\"\n```\n\nOf these, the calls and control structures\
    \ are of course the more interesting; values and symbols are pretty simple, and\
    \ you cannot do a lot with them. Pairlists are used for dealing with function\
    \ parameters, so unless you are working with function arguments, you won’t see\
    \ them in expressions. Calls and control structures, on the other hand, capture\
    \ the action in an expression; you can treat these as lists, and you can thus\
    \ examine them and modify them. Working with expressions this way is, I believe,\
    \ the simplest approach and is the topic of this chapter. Substituting values\
    \ for variables is another, complementary way that is the topic of the next chapter.\n\
    \nAfter you have learned the basics of expressions in the next section, the rest\
    \ of the chapter will go through some potential real-life examples of how you\
    \ would use metaprogramming. You can find a full version of the examples in the\
    \ `dfdr` package in the book’s downloadable source code, available via [www.apress.com/9781484228807](http://www.apress.com/9781484228807).\n\
    \n## The Basics of Expressions\n\nBoth function calls and control structures can\
    \ be manipulated as lists. Of those two, I will mostly focus on calls since those\
    \ are, in my experience, more likely to be modified in a program. So, let’s get\
    \ control structures out of the way first. I will describe only `if` and `for`;\
    \ the rest are similar.\n\n### Accessing and Manipulating Control Structures\n\
    \nStatements involving control structures are expressions like any other expressions\
    \ in R, and you can create an unevaluated version of them using `quote()`. As\
    \ I explained earlier, you can then treat this expression object as a list. So,\
    \ you can get the length of the object, and you can get access to the elements\
    \ in the object. For a single `if` statement, you get expressions of length 3,\
    \ while for `if-else` statements, you get expressions of length 4. The first element\
    \ is the name `if`. For all control structures and function calls, the first element\
    \ will always be the name of the function, so if you think of control structures\
    \ as just functions with a slightly weird syntax, you don’t have to consider them\
    \ a special case at all. The second element is the test condition in the `if`\
    \ statement, and after that, you get the body of the statement. If it is an `if-else`\
    \ statement, the fourth element is the `else` part of the expression.\n\n```\n\
    x <- quote(if (foo) bar)\nlength(x)\n## [1] 3\nx[[1]]\n## `if`\nx[[2]]\n## foo\n\
    x[[3]]\n## bar\ny <- quote(if (foo) bar else baz)\nlength(y)\n## [1] 4\ny[[1]]\n\
    ## `if`\ny[[2]]\n## foo\ny[[3]]\n## bar\ny[[4]]\n## baz\n```\n\nWith `for` loops\
    \ you get an expression of length 4 where the first element is, which is, of course,\
    \ the name `for`. The second is the iteration variable, the third is the expression\
    \ you iterate over, and the fourth is the loop body.\n\n```\nz <- quote(for (x\
    \ in 1:4) print(x))\nlength(z)\n## [1] 4\nz[[1]]\n## `for`\nz[[2]]\n## x\nz[[3]]\n\
    ## 1:4\nz[[4]]\n## print(x)\n```\n\nYou can evaluate these control structures\
    \ like any other expression.\n\n```\neval(z)\n## [1] 1\n## [1] 2\n## [1] 3\n##\
    \ [1] 4\n```\n\nYou can modify them by assigning values to their components to\
    \ change their behavior before you evaluate them. Here’s an example of changing\
    \ what you loop over:\n\n```\nz[[3]] <- 1:2\neval(z)\n## [1] 1\n## [1] 2\n```\n\
    \nHere’s an example of changing what you do in the function body:\n\n```\nz[[4]]\
    \ <- quote(print(x + 2))\neval(z)\n## [1] 3\n## [1] 4\n```\n\nHere’s an example\
    \ of changing the index variable and the body:\n\n```\nz[[2]] <- quote(y)\nz[[4]]\
    \ <- quote(print(y))\neval(z)\n## [1] 1\n## [1] 2\n```\n\n### Accessing and Manipulating\
    \ Function Calls\n\nFor function calls, their class is `call`, and when you treat\
    \ them as lists, the first element is the name of the function being called, and\
    \ the remaining elements are the function call arguments.\n\n```\nx <- quote(f(x,y,z))\n\
    class(x)\n## [1] \"call\"\nlength(x)\n## [1] 4\nx[[1]]\n## f\nx[[2]]\n## x\nx[[3]]\n\
    ## y\nx[[4]]\n## z\n```\n\nYou can test whether an expression is a function call\
    \ using the `is.call()` function.\n\n```\nis.call(quote(x))\n## [1] FALSE\nis.call(quote(f(x)))\n\
    ## [1] TRUE\n```\n\nYou don’t have access to any function body or environment\
    \ or anything like that here. This is just the name of a function; it is not until\
    \ you evaluate the expression that you will have to associate the name with an\
    \ actual function. You can, of course, always evaluate the function call using\
    \ `eval()`, and you can modify the expression if you want to change how it should\
    \ be evaluated.\n\n```\nx <- quote(sin(2))\neval(x)\n## [1] 0.9092974\nx[[1]]\
    \ <- quote(cos)\neval(x)\n## [1] -0.4161468\nx[[2]] <- 0\neval(x)\n## [1] 1\n\
    ```\n\nNote that I didn’t quote the zero in the last assignment; I didn’t have\
    \ to since numeric values are already expressions and do not need to be quoted.\n\
    \nTo explore an expression, you usually need a recursive function. The two basic\
    \ cases in a recursion are `is.atomic()` (for values) and `is.name()` (for symbols),\
    \ and the recursive cases are `is.call()` for function calls and `is.pairlist()`\
    \ if you want to deal with those. In the following function, which just prints\
    \ the structure of an expression (I did not handle the case where the expression\
    \ is a pairlist in this function):\n\n```\nf <- function(expr, indent = \"\")\
    \ {\n  if (is.atomic(expr)) {\n    print(paste0(indent, expr))\n  } else if (is.name(expr))\
    \ {\n    print(paste0(indent, deparse(expr)))\n  } else if (is.call(expr)) {\n\
    \    print(paste0(indent, deparse(expr[[1]])))\n    n <- length(expr)\n    if\
    \ (n > 1) {\n      new_indent <- paste0(indent, \"  \")\n      for (i in 2:n)\
    \ {\n        f(expr[[i]], new_indent)\n      }\n    }\n  } else {\n    print(paste0(indent,\
    \ \"Unexpected expression: \", expr[[1]]))\n  }\n}\nf(quote(2 + 3*(x + y)))\n\
    ## [1] \"+\"\n## [1] \"  2\"\n## [1] \"  *\"\n## [1] \"    3\"\n## [1] \"    (\"\
    \n## [1] \"      +\"\n## [1] \"        x\"\n## [1] \"        y\"\n```\n\nYou might\
    \ find the output here a little odd, but it captures the structure of the expression\
    \ `2+3*(x+y)`. The outermost function call is the function `+`, and it has two\
    \ arguments: `2` and the call to `*`. The call to `*` also has two arguments —\
    \ naturally — where one is `3` and the other is a call to the function `(`. If\
    \ you find this odd, then welcome to the club, but parentheses are functions in\
    \ R. The call to `(` has only a single argument, which happens to be a function\
    \ call to `+` with the arguments `x` and `y`.\n\nThis is all there is to the direct\
    \ manipulation of function calls, but of course, there is much that can be done\
    \ with these simple tools. The following sections will show how you can use them\
    \ to achieve powerful effects."
  raw: '# 4. Manipulating Expressions


    Expressions, the kind you create using the `quote` function , come in four flavors:
    a primitive value, a name, a function call or a control structure, and a pairlist.
    Function calls include operators such as the arithmetic or logical operators because
    these are function calls as well in R, and control structures can be considered
    just a special kind of function calls—they only really differ from function calls
    in the syntax you use to invoke them.


    ```

    class(quote(1))

    ## [1] "numeric"

    class(quote("foo"))

    ## [1] "character"

    class(quote(TRUE))

    ## [1] "logical"

    class(quote(x))

    ## [1] "name"

    class(quote(f(x)))

    ## [1] "call"

    class(quote(2+2))

    ## [1] "call"

    class(quote(if (TRUE) "foo" else "bar"))

    ## [1] "if"

    class(quote(for (x in 1:3) x))

    ## [1] "for"

    ```


    Of these, the calls and control structures are of course the more interesting;
    values and symbols are pretty simple, and you cannot do a lot with them. Pairlists
    are used for dealing with function parameters, so unless you are working with
    function arguments, you won’t see them in expressions. Calls and control structures,
    on the other hand, capture the action in an expression; you can treat these as
    lists, and you can thus examine them and modify them.[¹](#A449887_1_En_4_Chapter.html#Fn1)
    Working with expressions this way is, I believe, the simplest approach and is
    the topic of this chapter. Substituting values for variables is another, complementary
    way that is the topic of the next chapter.


    After you have learned the basics of expressions in the next section, the rest
    of the chapter will go through some potential real-life examples of how you would
    use metaprogramming. You can find a full version of the examples in the `dfdr`
    package in the book’s downloadable source code, available via [`www.apress.com/9781484228807`](http://www.apress.com/9781484228807)
    .


    ## The Basics of Expressions


    Both function calls and control structures can be manipulated as lists. Of those
    two, I will mostly focus on calls since those are, in my experience, more likely
    to be modified in a program. So, let’s get control structures out of the way first.
    I will describe only `if` and `for`; the rest are similar.


    ### Accessing and Manipulating Control Structures


    Statements involving control structures are expressions like any other expressions
    in R, and you can create an unevaluated version of them using `quote`. As I explained
    earlier, you can then treat this expression object as a list. So, you can get
    the length of the object, and you can get access to the elements in the object.
    For a single `if` statement, you get expressions of length 3, while for `if-else`
    statements, you get expressions of length 4\. The first element is the name `if`.
    For all control structures and function calls, the first element will always be
    the name of the function, so if you think of control structures as just functions
    with a slightly weird syntax, you don’t have to consider them a special case at
    all.[²](#A449887_1_En_4_Chapter.html#Fn2) The second element is the test condition
    in the `if` statement, and after that, you get the body of the statement. If it
    is an `if-else` statement, the fourth element is the `else` part of the expression.


    ```

    x <- quote(if (foo) bar)

    length(x)

    ## [1] 3

    x[[1]]

    ## `if`

    x[[2]]

    ## foo

    x[[3]]

    ## bar

    y <- quote(if (foo) bar else baz)

    length(y)

    ## [1] 4

    y[[1]]

    ## `if`

    y[[2]]

    ## foo

    y[[3]]

    ## bar

    y[[4]]

    ## baz

    ```


    With `for` loops you get an expression of length 4 where the first element is,
    which is, of course, the name `for`. The second is the iteration variable, the
    third is the expression you iterate over, and the fourth is the loop body.


    ```

    z <- quote(for (x in 1:4) print(x))

    length(z)

    ## [1] 4

    z[[1]]

    ## `for`

    z[[2]]

    ## x

    z[[3]]

    ## 1:4

    z[[4]]

    ## print(x)

    ```


    You can evaluate these control structures like any other expression.


    ```

    eval(z)

    ## [1] 1

    ## [1] 2

    ## [1] 3

    ## [1] 4

    ```


    You can modify them by assigning values to their components to change their behavior
    before you evaluate them. Here’s an example of changing what you loop over:


    ```

    z[[3]] <- 1:2

    eval(z)

    ## [1] 1

    ## [1] 2

    ```


    Here’s an example of changing what you do in the function body:


    ```

    z[[4]] <- quote(print(x + 2))

    eval(z)

    ## [1] 3

    ## [1] 4

    ```


    Here’s an example of changing the index variable and the body:


    ```

    z[[2]] <- quote(y)

    z[[4]] <- quote(print(y))

    eval(z)

    ## [1] 1

    ## [1] 2

    ```


    ### Accessing and Manipulating Function Calls


    For function calls, their class is `call`, and when you treat them as lists, the
    first element is the name of the function being called, and the remaining elements
    are the function call arguments.


    ```

    x <- quote(f(x,y,z))

    class(x)

    ## [1] "call"

    length(x)

    ## [1] 4

    x[[1]]

    ## f

    x[[2]]

    ## x

    x[[3]]

    ## y

    x[[4]]

    ## z

    ```


    You can test whether an expression is a function call using the `is.call` function.


    ```

    is.call(quote(x))

    ## [1] FALSE

    is.call(quote(f(x)))

    ## [1] TRUE

    ```


    You don’t have access to any function body or environment or anything like that
    here. This is just the name of a function; it is not until you evaluate the expression
    that you will have to associate the name with an actual function. You can, of
    course, always evaluate the function call using `eval`, and you can modify the
    expression if you want to change how it should be evaluated.


    ```

    x <- quote(sin(2))

    eval(x)

    ## [1] 0.9092974

    x[[1]] <- quote(cos)

    eval(x)

    ## [1] -0.4161468

    x[[2]] <- 0

    eval(x)

    ## [1] 1

    ```


    Note that I didn’t quote the zero in the last assignment; I didn’t have to since
    numeric values are already expressions and do not need to be quoted.


    To explore an expression, you usually need a recursive function. The two basic
    cases in a recursion are `is.atomic` (for values) and `is.name` (for symbols),
    and the recursive cases are `is.call` for function calls and `is.pairlist` if
    you want to deal with those. In the following function, which just prints the
    structure of an expression (I did not handle the case where the expression is
    a pairlist in this function):


    ```

    f  1) {

    new_indent <- paste0(indent, "  ")

    for (i in 2:n) {

    f(expr[[i]], new_indent)

    }

    }

    } else {

    print(paste0(indent, "Unexpected expression: ", expr[[1]]))

    }

    }

    f(quote(2 + 3*(x + y)))

    ## [1] "+"

    ## [1] "  2"

    ## [1] "  *"

    ## [1] "    3"

    ## [1] "    ("

    ## [1] "      +"

    ## [1] "        x"

    ## [1] "        y"

    ```


    You might find the output here a little odd, but it captures the structure of
    the expression `2+3*(x+y)`. The outermost function call is the function `+`, and
    it has two arguments: `2` and the call to `*`. The call to `*` also has two arguments—naturally—where
    one is `3` and the other is a call to the function `(`. If you find this odd,
    then welcome to the club, but parentheses are functions in R. The call to `(`
    has only a single argument, which happens to be a function call to `+` with the
    arguments `x` and `y`.


    This is all there is to the direct manipulation of function calls, but of course,
    there is much that can be done with these simple tools. The following sections
    will show how you can use them to achieve powerful effects.'
  trans: "\n# 操作表达式\n\n使用`quote()`函数创建的表达式共有四种类型：原始值、名称、函数调用或控制结构，以及点对列表。函数调用包含算术或逻辑运算符等运算符，因为在\
    \ R 中这些也是函数调用，而控制结构可以被视为一种特殊的函数调用——它们与函数调用的真正区别仅在于调用时使用的语法。\n\n```\nclass(quote(1))\n\
    ## [1] \"numeric\"\nclass(quote(\"foo\"))\n## [1] \"character\"\nclass(quote(TRUE))\n\
    ## [1] \"logical\"\nclass(quote(x))\n## [1] \"name\"\nclass(quote(f(x)))\n## [1]\
    \ \"call\"\nclass(quote(2+2))\n## [1] \"call\"\nclass(quote(if (TRUE) \"foo\"\
    \ else \"bar\"))\n## [1] \"if\"\nclass(quote(for (x in 1:3) x))\n## [1] \"for\"\
    \n```\n\n其中，调用和控制结构显然更有趣；值和符号则非常简单，可操作空间不大。点对列表用于处理函数参数，因此除非你在处理函数参数，否则不会在表达式中看到它们。另一方面，调用和控制结构捕捉了表达式中的操作；你可以将它们视为列表，从而可以检查并修改它们。我相信，以这种方式处理表达式是最简单的方法，也是本章的主题。另一种互补的方法是为变量替换值，这将是下一章的主题。\n\
    \n在下一节你了解了表达式的基础知识后，本章剩余部分将介绍一些现实世界中可能用到的元编程示例。你可以在本书可下载源代码的`dfdr`包中找到这些示例的完整版本，该代码可通过[www.apress.com/9781484228807](http://www.apress.com/9781484228807)获取。\n\
    \n## 表达式基础\n\n函数调用和控制结构都可以作为列表来操作。在这两者中，我将主要关注调用，因为根据我的经验，它们在程序中更常被修改。那么，我们先来处理控制结构。我只会描述`if`和`for`；其余的控制结构类似。\n\
    \n### 访问和操作控制结构\n\n包含控制结构的语句与 R 中的任何其他表达式一样，你可以使用`quote()`创建它们的未求值版本。正如我之前解释的，你可以将这个表达式对象视为一个列表。因此，你可以获取对象的长度，并访问对象中的元素。对于单个`if`语句，你会得到一个长度为\
    \ 3 的表达式；而对于`if-else`语句，你会得到一个长度为 4 的表达式。第一个元素是名称`if`。对于所有控制结构和函数调用，第一个元素始终是函数名，因此如果你将控制结构视为语法略为奇特的函数，就完全不必将它们视为特殊情况。第二个元素是`if`语句中的测试条件，之后是语句的主体部分。如果是`if-else`语句，第四个元素就是表达式的`else`部分。\n\
    \n```\nx <- quote(if (foo) bar)\nlength(x)\n## [1] 3\nx[[1]]\n## `if`\nx[[2]]\n\
    ## foo\nx[[3]]\n## bar\ny <- quote(if (foo) bar else baz)\nlength(y)\n## [1] 4\n\
    y[[1]]\n## `if`\ny[[2]]\n## foo\ny[[3]]\n## bar\ny[[4]]\n## baz\n```\n\n对于`for`循环，你会得到一个长度为\
    \ 4 的表达式，其中第一个元素当然是名称`for`。第二个是迭代变量，第三个是你迭代的表达式，第四个是循环体。\n\n```\nz <- quote(for\
    \ (x in 1:4) print(x))\nlength(z)\n## [1] 4\nz[[1]]\n## `for`\nz[[2]]\n## x\n\
    z[[3]]\n## 1:4\nz[[4]]\n## print(x)\n```\n\n你可以像求值任何其他表达式一样求值这些控制结构。\n\n```\n\
    eval(z)\n## [1] 1\n## [1] 2\n## [1] 3\n## [1] 4\n```\n\n你可以通过为其组件赋值来修改它们，从而在求值前改变其行为。下面是一个改变循环对象的示例：\n\
    \n```\nz[[3]] <- 1:2\neval(z)\n## [1] 1\n## [1] 2\n```\n\n下面是一个改变函数体内操作的示例：\n\n\
    ```\nz[[4]] <- quote(print(x + 2))\neval(z)\n## [1] 3\n## [1] 4\n```\n\n下面是一个改变索引变量和循环体的示例：\n\
    \n```\nz[[2]] <- quote(y)\nz[[4]] <- quote(print(y))\neval(z)\n## [1] 1\n## [1]\
    \ 2\n```\n\n### 访问和操作函数调用\n\n对于函数调用，其类是`call`，当你将它们视为列表时，第一个元素是被调用函数的名称，其余元素是函数调用的参数。\n\
    \n```\nx <- quote(f(x,y,z))\nclass(x)\n## [1] \"call\"\nlength(x)\n## [1] 4\n\
    x[[1]]\n## f\nx[[2]]\n## x\nx[[3]]\n## y\nx[[4]]\n## z\n```\n\n你可以使用`is.call()`函数测试一个表达式是否是函数调用。\n\
    \n```\nis.call(quote(x))\n## [1] FALSE\nis.call(quote(f(x)))\n## [1] TRUE\n```\n\
    \n在这里，你无法访问任何函数体、环境或类似的东西。这仅仅是一个函数名；直到你求值表达式时，你才需要将这个名称与实际的函数关联起来。当然，你始终可以使用`eval()`来求值函数调用，并且如果需要改变求值方式，你可以修改表达式。\n\
    \n```\nx <- quote(sin(2))\neval(x)\n## [1] 0.9092974\nx[[1]] <- quote(cos)\neval(x)\n\
    ## [1] -0.4161468\nx[[2]] <- 0\neval(x)\n## [1] 1\n```\n\n请注意，最后一条赋值语句中我没有引用零（0）；这并非必须，因为数值已经是表达式，不需要被引用。\n\
    \n要探查一个表达式，通常需要一个递归函数。递归中的两种基本情况是`is.atomic()`（用于值）和`is.name()`（用于符号），递归情况包括`is.call()`（用于函数调用）以及如果你想处理点对列表则用`is.pairlist()`。在下面的函数中，它只是打印出表达式的结构（此函数未处理表达式是点对列表的情况）：\n\
    \n```\nf <- function(expr, indent = \"\") {\n  if (is.atomic(expr)) {\n    print(paste0(indent,\
    \ expr))\n  } else if (is.name(expr)) {\n    print(paste0(indent, deparse(expr)))\n\
    \  } else if (is.call(expr)) {\n    print(paste0(indent, deparse(expr[[1]])))\n\
    \    n <- length(expr)\n    if (n > 1) {\n      new_indent <- paste0(indent, \"\
    \  \")\n      for (i in 2:n) {\n        f(expr[[i]], new_indent)\n      }\n  \
    \  }\n  } else {\n    print(paste0(indent, \"未预料到的表达式: \", expr[[1]]))\n  }\n\
    }\nf(quote(2 + 3*(x + y)))\n## [1] \"+\"\n## [1] \"  2\"\n## [1] \"  *\"\n## [1]\
    \ \"    3\"\n## [1] \"    (\"\n## [1] \"      +\"\n## [1] \"        x\"\n## [1]\
    \ \"        y\"\n```\n\n你可能会觉得这里的输出有点奇怪，但它捕捉到了表达式`2+3*(x+y)`的结构。最外层的函数调用是`+`函数，它有两个参数：`2`和对`*`的调用。对`*`的调用也有两个参数——理所当然——其中一个是`3`，另一个是对函数`(`的调用。如果你觉得这很奇怪，那么欢迎加入我们，但在\
    \ R 中圆括号就是函数。对`(`的调用只有一个参数，这个参数恰好是对`+`的函数调用，其参数是`x`和`y`。\n\n以上就是直接操作函数调用的全部内容，当然，这些简单的工具可以做很多事情。接下来的几节将展示如何使用它们来实现强大的效果。\n"
- fmt: '# Expression Simplification


    To see the manipulation of expressions in action, let''s consider a scenario where
    you want to simplify an expression. Say you want to evaluate subexpressions that
    you can immediately evaluate because they consist only of atomic values where
    you do not depend on variables, and you want to reduce multiplication by 1 or
    addition by 0. It looks something like this:


    ```r

    simplify_expr(quote(2*(0 + ((4 + 5)*x)*1)))

    ## 2 * (9 * x)

    ```


    This isn''t quite perfect; if you really reduced the expression, you would see
    that you could rearrange the parentheses and multiply 2 by 9, but you are going
    to simplify expressions locally and not attempt to rewrite them here.


    Since you are dealing with expressions, you need a recursive function that handles
    the basic cases (atomic values and names) and the recursive cases (calls and pairlists).
    You don''t expect to see a pairlist in an expression, so you simply give up if
    you see anything except atomic, name, or call objects. If you see any basic case,
    you just return that; you can''t simplify those further. For call objects, you
    call a function, `simplify_call`, which is responsible for handling calls.


    ```r

    simplify_expr <- function(expr) {

    if (is.atomic(expr) || is.name(expr)) {

    expr

    } else if (is.call(expr)) {

    simplify_call(expr)

    } else {

    stop(paste0("Unexpected expression ",

    deparse(expr),

    " in simplifying"))

    }

    }

    ```


    For call simplification, I don''t attempt to simplify function calls. I don''t
    know what any generic function is doing, so there is little I can do to simplify
    expressions that involve functions. I will assume, though, that if I am simplifying
    an expression, then functions in it behave as if they had call-by-value semantics
    and simplify their arguments. This is an assumption. It might be wrong, but for
    this exercise, you can assume it. So for general function calls, I will just simplify
    their arguments. For arithmetic expressions, I will try to simplify those further.
    I could also attempt to do that for other operations, but handling just the arithmetic
    operators shows how you would handle operators in sufficient detail that I trust
    you, dear reader, to be able to handle other operators if you need to do so.


    Call handling can then look like this:


    ```r

    simplify_call <- function(expr) {

    if (expr[[1]] == as.name("+"))

    return(simplify_addition(expr[[2]], expr[[3]]))

    if (expr[[1]] == as.name("-")) {

    if (length(expr) == 2)

    return(simplify_unary_subtraction(expr[[2]]))

    else

    return(simplify_subtraction(expr[[2]], expr[[3]]))

    }

    if (expr[[1]] == as.name("*"))

    return(simplify_multiplication(expr[[2]], expr[[3]]))

    if (expr[[1]] == as.name("/"))

    return(simplify_division(expr[[2]], expr[[3]]))

    if (expr[[1]] == as.name("^"))

    return(simplify_exponentiation(expr[[2]], expr[[3]]))

    if (expr[[1]] == as.name("(")) {

    subexpr <- simplify_expr(expr[[2]])

    if (is.atomic(subexpr) || is.name(subexpr))

    return(subexpr)

    else if (is.call(subexpr) && subexpr[[1]] == as.name("("))

    return(subexpr)

    else

    return(call("(", subexpr))

    }

    simplify_function_call(expr)

    }

    ```


    This code is mostly self-explanatory, but a few comments are in order: First,
    you need to compare the call names with name objects. They are not actually character
    strings but have the type `name`; thus, you need to use `as.name`. Second, the
    minus comes in two flavors: binary subtraction and unary negation. You can tell
    the two apart by checking whether the call has one or two arguments (i.e., whether
    it has length 2 or 3; remember that the first element is the call name), and you
    just use two different functions to handle the two cases. Third, parentheses are
    also calls, so you need to handle them. You just get hold of the expression inside
    the parentheses. If this is something that doesn''t need parentheses (single values,
    names, or an expression already surrounded by parentheses), you just return that
    subexpression. Otherwise, you put parentheses around it. Finally, if you don''t
    know what else to do, you just treat the expression as a function call.


    Now you just handle each operator in turn. They are all handled similarly, only
    differing in what you can simplify given each operator. For addition, you can
    get rid of addition by 0, and if both your arguments are numbers, you can evaluate
    them right away. Otherwise, you need to return a call to `+` with simplified operands.


    ```r

    simplify_addition <- function(f, g) {

    left <- simplify_expr(f)

    right <- simplify_expr(g)

    if (left == 0) return(right)

    if (right == 0) return(left)

    if (is.numeric(left) && is.numeric(right))

    return(left + right)

    call("+", left, right)

    }

    ```


    You can evaluate unary minus if its argument is numeric. Otherwise, you can get
    rid of an existing minus in the argument since two minuses make a plus, and if
    all else fails, you just have to return the simplified expression with a minus
    in front of it.


    ```r

    simplify_unary_subtraction <- function(f) {

    simplified <- simplify_expr(f)

    if (is.numeric(simplified))

    -simplified

    else if (is.call(simplified) && simplified[[1]] == "-")

    simplified[[2]]

    else

    bquote(-.(simplified))

    }

    ```


    For the final case here, you will use the function `bquote`. It works like `quote`
    but substitutes a value in where you put `.(...)`. So, you essentially write `quote(-simplified)`
    except that you put the simplified expression inside the expression.


    Binary subtraction is similar to addition but with a little more work when you
    subtract from 0. Here you need to use `bquote` again:


    ```r

    simplify_subtraction <- function(f, g) {

    left <- simplify_expr(f)

    right <- simplify_expr(g)

    if (left == 0) {

    if (is.numeric(right))

    return(-right)

    else

    return(bquote(-.(right)))

    }

    if (right == 0)

    return(left)

    if (is.numeric(left) && is.numeric(right))

    return(left - right)

    call("-", left, right)

    }

    ```


    For multiplication, you can simplify cases where the multiplication involves 0
    or 1, but otherwise, the function looks similar to what you have seen before.


    ```r

    simplify_multiplication <- function(f, g) {

    left <- simplify_expr(f)

    right <- simplify_expr(g)

    if (left == 0 || right == 0)

    return(0)

    if (left == 1)

    return(right)

    if (right == 1)

    return(left)

    if (is.numeric(left) && is.numeric(right))

    return(left * right)

    call("*", left, right)

    }

    ```


    Division and exponentiation are just more of the same, with different cases to
    handle.


    ```r

    simplify_division <- function(f, g) {

    left <- simplify_expr(f)

    right <- simplify_expr(g)

    if (right == 1)

    return(left)

    if (is.numeric(left) && is.numeric(right))

    return(left / right)

    call("/", left, right)

    }

    simplify_exponentiation <- function(f, g) {

    left <- simplify_expr(f)

    right <- simplify_expr(g)

    if (right == 0) return(1)

    if (left == 0) return(0)

    if (left == 1) return(1)

    if (right == 1) return(left)

    if (is.numeric(left) && is.numeric(right))

    return(left ^ right)

    call("^", left, right)

    }

    ```


    The final function you need is a function-call simplification. Here you just have
    to simplify all the function''s arguments before returning a call. You can collect
    the arguments in a list and create a function call with an expression like this:'
