  trans: "\n### 函数内部的非标准求值\n\n一旦你开始在其他函数内部使用非标准求值，就很难正确掌握它。当你以交互方式使用 `R`，或在全局作用域中编写分析管道时，这是一种简化许多操作语法的便捷方法，但由于替换倾向于对你提供给函数的参数进行逐字处理，因此一旦参数从一个函数传递到另一个函数，NSE\
    \ 就会变得棘手。\n\n考虑以下示例：\n\n```\nx <- 2; y <- 3\nf <- function(d, expr) my_with(d,\
    \ expr)\nf(d, x + y)\n## [1] 5\ng <- function(d, expr) my_with(d, substitute(expr))\n\
    g(d, x + y)\n## expr\n```\n\n在这里，你尝试在函数内部使用 `my_with` 两次，但都没有达到预期效果。在 `f` 中，`expr`\
    \ 在全局作用域中被求值。当你在函数内部使用该变量时，`promise` 会在传递到 `my_with` 之前被求值。在 `g` 中，你使用了 `substitute`，但\
    \ `my_with` 看到的是 `substitute(expr)`——记住，它不会将表达式视为 `promise`，而是对其进行替换以得到一个表达式——因此你实际上并没有让参数被替换。`my_with`\
    \ 中的 NSE 阻止了这一点。\n\n如果你想要进行 NSE 的函数，你真的应该编写那些处理表达式并对其执行“正常”求值的函数。你可以制作一个 `my_with`\
    \ 的版本，它期望表达式已经被引用，这样你可以在其他函数中使用它，然后像这样定义 `my_with` 来执行 NSE：\n\n```\nmy_with_q\
    \ <- function(df, expr) {\neval(expr, df, parent.frame())\n}\nmy_with <- function(df,\
    \ expr) my_with_q(d, substitute(expr))\ng <- function(d, expr) my_with_q(d, substitute(expr))\n\
    g(d, x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]  1.8495491\n\
    my_with(d, x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]\
    \  1.8495491\n```\n\n### 使用 NSE 编写宏\n\n由于 NSE 允许你在调用作用域中求值表达式，你可以用它来编写宏，即作为它们被调用处语句的快捷方式的函数。这与普通函数不同，普通函数通常不能修改其自身作用域之外的数据。然而，除非你有非常充分的理由，否则我不建议使用宏——数据的不可变性是\
    \ `R` 的一个重要特性，使用宏违反这一特性是与它相悖的。但是，由于这是一个很好的例子，说明你可以用 NSE 做什么，我将在这里包含这个示例。\n\n考虑以下代码。此示例是\
    \ Thomas Lumley (R Journal, 2001) 在 Programmer’s Niche: Macros in `R` ( [`www.r-project.org/doc/Rnews/Rnews_2001-3.pdf`](https://www.r-project.org/doc/Rnews/Rnews_2001-3.pdf)\
    \ ) 中展示的宏代码的修改实现。我简化了宏制造函数；你可以在原始文章在线版中看到完整版本。\n\n```\nmake_param_names <- function(params)\
    \ {\nparam_names <- names(params)\nif (is.null(param_names))\nparam_names <- rep(\"\
    \", length(params))\nfor (i in seq_along(param_names)) {\nif (param_names[i] ==\
    \ \"\") {\nparam_names[i] <- paste(params[[i]])\n}\n}\nparam_names\n}\nmake_macro\
    \ <- function(..., body) {\nparams <- eval(substitute(alist(...)))\nbody <- substitute(body)\n\
    # 构造宏\nf <- eval(substitute(\nfunction() eval(substitute(body), parent.frame())\n\
    ))\n# 设置宏参数\nparam_names <- make_param_names(params)\nnames(params) <- param_names\n\
    params <- as.list(params)\nformals(f) <- params\nf\n}\n```\n\n第一个函数只是从函数参数列表中提取名称，并确保所有参数都有名称。这在稍后构造函数的\
    \ `formals` 列表时是必要的。在 `formals` 列表中，所有参数都必须有名称，你可以用这个函数来构造这些名称。第二个函数是那个有趣的函数。这里，你通过构造一个函数来创建宏，该函数的主体将在其调用作用域中被求值。你首先获取宏应该具有的参数和主体。然后，通过替换\
    \ `...` 并求值 `alist(...)` 表达式，你将参数放入一个 `list` 中。如果没有替换，你会得到只包含 `...` 的参数列表，但有了替换，你会得到传递给\
    \ `make_macro` 函数的参数（除了命名参数 `body`，你通过另一个 `substitute` 调用将其直接转换为传递给 `make_macro`\
    \ 的表达式）。\n\n你构造的函数是魔法发生的地方。你创建了表达式\n\n```\nsubstitute(function() eval(substitute(body),\
    \ parent.frame()))\n```\n\n其中 `body` 将被替换为你传递给宏的表达式。当你求值这个表达式时，你得到函数\n\n```\n\
    function() eval(substitute(), parent.frame())\n```\n\n其中 `<body>` 不再是符号 `body`，而是\
    \ `body` 表达式。这是一个（目前）不接受任何参数的函数，但在求值结果表达式之前，它会替换 `<body>` 中在其调用作用域（即 `parent.frame()`）中已知的变量。\n\
    \n你可以通过这个小例子看到它的实际效果：\n\n```\n(m \n```\n\n当你调用 `m` 时，它会在其调用作用域中求值 `x + y`，因此你可以在全局作用域中设置变量\
    \ `x` 和 `y` 并像这样求值：\n\n```\nx <- 2; y <- 4\nm()\n## [1] 6\n```\n\n`make_macro`\
    \ 代码的最后一部分设置了宏的形式参数。它只是获取你已经指定的参数，确保它们都有名称，然后将它们转换为一个列表并设置 `formals(f)`。之后，`make_macro`\
    \ 返回构造好的函数。\n\n你可以使用这个函数来创建一个宏，将数据框中某一列的特定值替换为 `NA`，如下所示：\n\n```\nset_NA_val <-\
    \ make_macro(df, var, na_val,\nbody = df$var[df$var == na_val] <- NA)\n```\n\n\
    你构造的宏接受三个参数：数据框 `df`；数据框中的变量（列）`var`；以及对应 `NA` 的值 `na_val`。然后，它的主体是以下表达式，其中的 `df`、`var`\
    \ 和 `na_val` 被传递给宏的参数替换：\n\n```\ndf$var[df$var == na_val] <- NA\n```\n\n你可以像这样使用它：\n\
    \n```\n(d <- data.frame(x = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x  y\n## 1\
    \  1  1\n## 2 -9  2\n## 3  3 -9\n## 4  4 -9\nset_NA_val(d, x, -9); d\n##    x\
    \  y\n## 1  1  1\n## 2 NA  2\n## 3  3 -9\n## 4  4 -9\nset_NA_val(d, y, -9); d\n\
    ##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\n在这里，你看到构造的\
    \ `set_NA_val` 宏在调用作用域中修改了一个数据框。它省去了一些样板代码的编写，但代价是保持了参数值的不可变性。对于大多数 `R` 程序员来说，返回更新值的更传统函数解决方案可能更具可读性。\n\
    \n```\nset_NA_val_fun <- function(df, var, na_val) {\ndf[df[,var] == na_val, var]\
    \ <- NA\ndf\n}\n(d <- data.frame(x = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x\
    \  y\n## 1  1  1\n## 2 -9  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d,\
    \ \"x\", -9))\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 -9\n## 4  4 -9\n(d\
    \ <- set_NA_val_fun(d, \"y\", -9))\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3 \
    \ 3 NA\n## 4  4 NA\n```\n\n或者，这是 `magrittr` 管道版本：\n\n```\nlibrary(magrittr)\n\
    d % set_NA_val_fun(\"x\", -9) %>% set_NA_val_fun(\"y\", -9)\nd\n##    x  y\n##\
    \ 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n"
- fmt: "### Modifying Environments in Evaluations\n\nThe reason you can modify variables\
    \ in macros is that you can modify environments. Actual values are immutable,\
    \ but when you modify the data frame in the previous example, you are replacing\
    \ the reference in the environment to the modified data. If other variables refer\
    \ to the same data frame, they will still be referring to the original version.\
    \ Even with macros, you cannot actually modify data, but you can modify environments,\
    \ and because you can evaluate expressions in environments different from the\
    \ current evaluating environment, you can make it appear as if you are modifying\
    \ data in the calling environment.\n\nYou can see this by examining the evaluation\
    \ environment explicitly when you evaluate an assignment. If you explicitly make\
    \ an environment and evaluate an assignment in it, you see that it gets modified.\n\
    \n```\ne <- list2env(list(x = 2, y = 3))\neval(quote(z <- x + y), e)\nas.list(e)\n\
    ## $z\n## [1] 5\n##\n## $y\n## [1] 3\n##\n## $x\n## [1] 2\n```\n\nThis environment\
    \ has the global environment as its parent. Don’t try this with the empty environment\
    \ as its parent. If you do, it won’t know the `<-` function. What you see here\
    \ is that you modify `e` by setting the variable `z`.\n\nYou can also evaluate\
    \ expressions in lists, so you can attempt the same here:\n\n```\nl <- list(x\
    \ = 2, y = 3)\neval(quote(z <- x + y), l)\nl\n## $x\n## [1] 2\n##\n## $y\n## [1]\
    \ 3\n```\n\nHere you see that the list is not modified. It is only environments\
    \ you can modify in lists, and while you can evaluate an assignment in a list\
    \ using `eval`, you cannot actually modify the list.\n\n### Accessing Promises\
    \ Using the `pryr` Package\n\nAs I mentioned, there is no mechanism in pure R\
    \ to get access to the internals of promises, so if you use `substitute` to translate\
    \ a function argument into its corresponding expression, then you lose information\
    \ about which environment the expression should be evaluated in. You can, however,\
    \ use the `pryr` package to examine promises. This package has the function `promise_info`\
    \ that tells you both what the expression is and the environment it belongs to.\n\
    \nConsider this:\n\n```\nlibrary(pryr)\nf <- function(x, y) function(z = x + y)\
    \ {\n  promise_info(z)\n}\ng <- f(2, 3)\ng()\n## $code\n## x + y\n## \n## $env\n\
    ## <environment: 0x7f8e4e8a6b60>\n## \n## $evaled\n## [1] FALSE\n## \n## $value\n\
    ## NULL\nx <- 2\ny <- 3\ng(x + y)\n## $code\n## x + y\n## \n## $env\n## <environment:\
    \ R_GlobalEnv>\n## \n## $evaled\n## [1] FALSE\n## \n## $value\n## NULL\n```\n\n\
    For a promise you get the expression it corresponds to in the `code` field, the\
    \ environment it belongs to in the `env` field, and whether it has been evaluated\
    \ yet in the `evaled` field. If it has been evaluated, the corresponding value\
    \ is in the `value` field. In the two different calls to `g`, you see that the\
    \ `code` field is the same but the environment is different. In the first call,\
    \ where you use the default values for parameter `z`, the environment is the `f`\
    \ closure, and in the second, where you call `g` with an expression from the global\
    \ environment, the promise environment is also the global environment.\n\nYou\
    \ can see the difference between when a promise has been evaluated and before\
    \ it is evaluated in the following example:\n\n```\ng <- function(x, y) function(expr\
    \ = x + y) {\n  pi <- promise_info(expr)\n  cat(\"Before evaluation:\\n\")\n \
    \ str(pi)\n  pi$value <- eval(expr, pi$env)\n  cat(\"After evaluation:\\n\")\n\
    \  str(pi)\n}\nh <- g(4, 5)\nh()\n## Before evaluation:\n## List of 4\n## $ code\
    \  : language x + y\n## $ env   : <environment: 0x7f8e4e8a6b60>\n## $ evaled:\
    \ logi FALSE\n## $ value : NULL\n## \n## After evaluation:\n## List of 4\n## $\
    \ code  : language x + y\n## $ env   : NULL\n## $ evaled: logi TRUE\n## $ value\
    \ : num 9\n```\n\nThe code doesn’t change when you evaluate a promise, but the\
    \ environment is removed. You do not need to hold a reference to an environment\
    \ you no longer need, and if you are the only one holding on to this environment,\
    \ you can free it for garbage collection by no longer holding on to it when you\
    \ don’t need it any longer. The result of evaluating the promise is put in `value`,\
    \ and `evaled` is set to `TRUE`.\n\nYou can use the promise information to modify\
    \ an environment and still evaluate it in the right scope. You just need to get\
    \ hold of the code, which you can get either by the expression\n\n```\neval(substitute(\n\
    \  substitute(code, list(y = quote(2 * y))),\n  list(code = pi$code)))\n```\n\n\
    or the expression\n\n```\neval(substitute(\n  substitute(expr, list(y = quote(2\
    \ * y)))))\n```\n\nwhere `expr` is the parameter that holds the promise, and `pi`\
    \ is the result of calling `promise_info(expr)`. Neither is particularly pretty,\
    \ and you have to remember to construct the expressions inside out, but that is\
    \ the way you can get an expression substituted in for a variable that holds it\
    \ and then modify it. Of the two, the traditional approach—the second of the two—is\
    \ probably the simplest.\n\nIn both cases, you are creating the expression\n\n\
    ```\nsubstitute(<expr>, list(y = quote(2 * y)))\n```\n\nwhere `<expr>` refers\
    \ to the expression in the promise, and you then evaluate this expression to substitute\
    \ `y` for `quote(2 * y)`.\n\nEvaluating the expression once you have modified\
    \ it is almost trivial in comparison. You can just use `eval(expr, pi$env)`.\n\
    \n```\nf <- function(x, y) function(expr = x + y) {\n  pi <- promise_info(expr)\n\
    \  expr <- eval(substitute(\n    substitute(expr, list(y = quote(2 * y)))))\n\
    \  value <- eval(expr, pi$env)\n  list(expr = expr, value = value)\n}\ng <- f(2,\
    \ 2)\ng()\n## $expr\n## x + 2 * y\n##\n## $value\n## [1] 6\nx <- y <- 4\ng(x +\
    \ y)\n## $expr\n## x + 2 * y\n##\n## $value\n## [1] 12\nz <- 4\ng(z)\n## $expr\n\
    ## z\n##\n## $value\n## [1] 4\n```\n\nIn the substitution, when you create `expr`,\
    \ it is important that you replace `y` with `quote(2 * y)` and not simply `2 *\
    \ y`. If you did the latter, then `y` would be evaluated in the standard way and\
    \ would refer to the `y` in the enclosing scope, which is the parameter given\
    \ to the call to `f` that creates `g`. Of course, that could be what you wanted:\
    \ substitute whatever `y` is in the input expression with the `y` you have in\
    \ the enclosing scope. In that case, the code would simply look like this:\n\n\
    ```\nf <- function(x, y) function(expr = x + y) {\n  pi <- promise_info(expr)\n\
    \  expr <- eval(substitute(\n    substitute(expr, list(y = 2 * y))))\n  value\
    \ <- eval(expr, pi$env)\n  list(expr = expr, value = value)\n}\ng <- f(2, 2)\n\
    g()\n## $expr\n## x + 4\n##\n## $value\n## [1] 6\nx <- y <- 4\ng(x + y)\n## $expr\n\
    ## x + 4\n##\n## $value\n## [1] 8\nz <- 4\ng(z)\n## $expr\n## z\n##\n## $value\n\
    ## [1] 4\n```\n\nIn both cases, you modify the expression in the promise—just\
    \ in two different ways—and then you evaluate it in the promise scope. In the\
    \ first case, `y` is taken from the promise scope if it appears in the modified\
    \ expression; in the second case, `y` is replaced by the value you have in the\
    \ enclosing scope.\n\n**Footnotes** [1](#A449887_1_En_5_Chapter.html#Fn1_source)\n\
    \nIn the package `pryr`, which you will return to at the end of this chapter,\
    \ there are functions, written in C, that do provide access to the internals of\
    \ promises. Using `pryr`, you can get hold of both the expression and the associated\
    \ environment of a promise in case you need it."
