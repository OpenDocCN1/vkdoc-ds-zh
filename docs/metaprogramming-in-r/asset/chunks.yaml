    \ evaluating environment. You can get the parent of an environment using the function\
    \ `parent.env` , so you can get the definition environment like this:\n\n```\n\
    f \n```\n\nWhen you have hold of a function definition , as in the previous chapter,\
    \ you do not have an evaluating environment. That environment exists only when\
    \ the function is called. A function you have defined, but not invoked, has the\
    \ three components covered in the previous chapter, but there are more components\
    \ to a function that is actively executed. There is a difference between a function\
