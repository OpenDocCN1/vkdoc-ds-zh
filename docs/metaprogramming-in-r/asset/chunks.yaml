    \ evaluation）也有其限度。由于 `y` 是 2，你实际上是将 `f` 的函数体设置成了 4。之后再改变 `y` 也不会改变这一点：\n\n```\n\
    y <- 3\nf()\n## [1] 4\n```\n\n要得到一个未经计算的函数体，你必须再次使用 `quote`：\n\n```\nbody(f) \n\
    ```\n\n但现在，你又回到了函数调用的语义，这意味着函数体是在一个父环境为 `nested` 内部环境的计算环境中求值的，因此 `y` 引用的是局部变量，而非全局变量：\n\
    \n```\nf()\n## [1] 10\ny <- 2\nf()\n## [1] 10\n```\n\n如果你想让 `f` 使用全局变量 `y`，可以修改\
    \ `environment(f)`：\n\n```\nenvironment(f) <- globalenv()\nf()\n## [1] 4\ny <-\
    \ 3\nf()\n## [1] 6\n```\n\n不过，如果这样做，它就不再知晓 `nested` 内部的环境了。如果你想挑选函数在哪些环境中查找变量，需要大量的环境操作（environment\
    \ hacking）；如果你的确有此需求，那么最好重写函数，通过其他方式访问变量。\n\n如果你想将函数的形式参数设置为缺失值（即让它们成为没有默认值的参数），那么你需要使用\
    \ `list` 来创建参数。\n\n如果你像这样定义一个函数 `f`，它接受一个参数 `x`，并将其与一个全局参数 `y` 相加：\n\n```\nf <-\
    \ function(x) x + y\n```\n\n如果你希望 `y` 也是一个参数，但不给它默认值，你可以尝试这样：\n\n```\nformals(f)\
    \ <- list(x =, y =)\n```\n\n但这行不通，因为 `list` 不接受空值。相反，你可以使用 `alist`。这个函数创建了一个“成对列表”（pair-list），这是\
    \ R 内部用于表示形式参数的数据结构。这种数据结构仅用于此目的，但如果你要着手修改函数的参数，它就是你应该使用的工具：\n\n```\nformals(f)\
    \ <- alist(x =, y =)\n```\n\n使用 `alist` 时，表达式也会被自动引用。在前面的例子中，当你希望参数 `x` 默认值为 `y`\
    \ 时，需要使用 `quote(y)` 来让 `y` 作为一个 promise 在 `environment(f)` 中计算，而不是在调用作用域中计算。使用\
    \ `alist` 时，你不需要引用 `y`：\n\n```\nnested \nf()\n## [1] 5\n```\n"
- fmt: '# Constructing Functions


    You can also construct new functions by piecing together their components. The
    function to use for this is `as.function`. It takes an `alist` as input and interprets
    the last element in it as the new function’s body and the rest as the formal arguments.


    ```

    f <- as.function(alist(x =, y = 2, x + y))

    f

    ## function (x, y = 2)

    ## x + y

    f(2)

    ## [1] 4

    ```


    Don’t try to use a `list` here; it doesn’t do what you want.


    ```

    f <- as.function(list(x = 2, y = 2, x + y))

    ```


    If you give `as.function` a list, it interprets that as just an expression that
    then becomes the body of the new function. Here, if you have global definitions
    of `x` and `y` so you can evaluate `x + y`, you would get a body that is `c(2,
    2, x+y)` where `x+y` refers to the value, not the expression, of the sum of global
    variables `x` and `y`.


    The environment of the new function is by default the environment in which you
    call `as.function`. So to make a closure, you can just call `as.function` inside
    another function.


    ```

    nested

    (h

    ```


    Here you call `as.function` inside `nested`, so the environment of the functions
    created here will know about the `z` parameter of `nested` and be able to use
    it in the default value for `y`.


    Don’t try this:


    ```

    nested <- function(y) {

    as.function(alist(x =, y = y, x + y))

    }

    ```


    Remember that expressions that are default parameters are lazily evaluated inside
    the body of the function you define. Here, you say that `y` should evaluate to
    `y`, which is a circular dependency. It has nothing to do with `as.function`.
    You have the same problem in this definition:


    ```

    nested <- function(y) {

    function(x, y = y) x + y

    }

    ```


    If you want something like that, where you make a function with a given default
    `y` and you absolutely want the created function to call that parameter `y`, you
    need to evaluate the expression in the nesting scope and refer to it under a different
    name to avoid the nesting function’s argument to overshadow it.


    ```

    nested <- function(y) {

    z <- y

    function(x, y = z) x + y

    }

    nested(2)(2)

    ## [1] 4

    ```


    You can give an environment to `as.function` to specify the definition scope of
    the new function if you do not want it to be the current environment. In the following
    example, you have two functions for constructing closures. The first creates a
    function that can see the enclosing `z`, while the other, instead, uses the global
    environment and is thus no closure at all, so the argument `z` is not visible.
    Instead, the global `z` is.


    ```

    nested <- function(z) {

    as.function(alist(x =, y = z, x + y))

    }

    nested2 <- function(z) {

    as.function(alist(x =, y = z, x + y),

    envir = globalenv())

    }

    ```


    If you evaluate functions created with these two functions, the `nested` one will
    add `x` to the `z` value you provide in the call to `nested`, while the `nested2`
    one will ignore its input and look for `z` in the global scope.


    ```

    z <- -1

    nested(3)(1)

    ## [1] 4

    nested2(3)(1)

    ## [1] 0

    ```


    # Inside a Function Call


    When you execute the body of a function, as you have seen, you do this in the
    evaluation environment. This evaluation environment is linked through its parent
    to the environment where the function was defined. It has its arguments stored
    as promises that will be evaluated either in the environment where the function
    was defined (for default parameters) or in the environment where the function
    was called (for parameters provided to the function there). In the previous chapter,
    you saw how you could get hold of the formal parameters of a function, the body
    of the function, and the environment in which the function was defined. In this
    chapter, you will examine how you can access these, and more, from inside a function
    while the function is being evaluated.


    ## Getting the Components of the Current Function


    In the previous chapter, you could get the `formals`, `body`, and `environment`
    of a function you had a reference to. Inside a function body, you do not have
    such a reference. Functions do not have names as such; you give functions names
    when you assign them to variables, but that is a property of the environment where
    you have the name, not of the function itself. Functions you use as closures are
    often never assigned to any name at all. So, how do you get hold of the current
    function to access its components?


    To get hold of the current function, you can use the function `sys.function`.
    This function gives you the definition of the current function, which is what
    you need, not its name.


    You can define this function to see how `sys.function` works.


    ```

    f <- function(x = 5) {

    y <- 2 * x

    sys.function()

    }

    ```


    If you just write the function name on the prompt, you get the function definition.


    ```

    f

    ## function(x = 5) {

    ##   y <- 2 * x

    ##   sys.function()

    ## }

    ```


    Since the function returns the definition of itself, you get the same when you
    evaluate it.


    ```

    f()

    ## function(x = 5) {

    ##   y <- 2 * x

    ##   sys.function()

    ## }

    ```


    When you call any of `formals`, `body`, or `environment`, you don’t use a function
    name as the first parameter; you give each of them a reference to a function,
    and they get the function definition from that.


    You don’t need to explicitly call `sys.function` for `formals` and `body`, though,
    because these two functions already use a call to `sys.function` for the default
    value for the function parameter. If you want the components of the current function,
    you can simply leave out the function parameter.


    Thus, to get the formal parameter of a function, inside the function body, you
    can just use `formals` without any parameters.


    ```

    f <- function(x, y = 2 * x) formals()

    params <- f(1, 2)

    class(params)

    ## [1] "pairlist"

    params

    ## $x

    ##

    ##

    ## $y

    ## 2 * x

    ```


    The same goes for the body of the current function.


    ```

    f <- function(x, y = 2 * x) {

    z <- x - y

    body()

    }

    f(2)

    ## {

    ##     z <- x - y

    ##     body()

    ## }

    ```


    The `environment` function works slightly differently. If you call it without
    parameters, you get the current (evaluating) environment.


    ```

    f <- function() {

    x <- 1

    y <- 2

    z <- 3

    environment()

    }

    env <- f()

    as.list(env)

    ## $z

    ## [1] 3

    ##

    ## $y

    ## [1] 2

    ##

    ## $x

    ## [1] 1

    ```


    This is not what you would get with `environment(f)`.


    ```

    environment(f)

    ##

    ```


    The `f` function is defined in the global environment, and `environment(f)` gives
    you the environment in which `f` is defined. If you call `environment()` inside
    `f`, you get the evaluating environment. The local variables `x`, `y`, and `z`
    can be found in the evaluating environment, but they are not part of `environment(f)`—or
    if they are, they are different, global parameters.


    To get the equivalent of `environment(f)` from inside `f`, you must get hold of
    the parent of the evaluating environment. You can get the parent of an environment
    using the function `parent.env`, so you can get the definition environment like
    this:


    ```

    f

    ```


    When you have hold of a function definition, as in the previous chapter, you do
    not have an evaluating environment. That environment exists only when the function
    is called. A function you have defined, but not invoked, has the three components
    covered in the previous chapter, but there are more components to a function that
    is actively executed. There is a difference between a function definition, a description
    of what a function should do when it is called, and a function instantiation (the
    actual running code). One such difference is the evaluating environment. Another
    is that a function instantiation has actual parameters, while a function definition
    has only formal parameters. The latter are part of the function definition; the
    former are provided by the caller of the function.'
