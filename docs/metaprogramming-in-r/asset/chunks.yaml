  trans: '

    ### 函数环境


    函数的环境是其最简单的组成部分。它只是函数被定义时所处的环境。这个环境用于捕获外部作用域，也是 R 语言能够实现闭包的原因。当函数创建时，其计算环境会与函数环境相关联，这样，在局部环境（由局部变量和形式参数组成）中找不到的变量，就会到外部作用域中去查找。


    ## 调用函数


    在继续之前，有必要了解一下当函数被调用时这些组成部分是如何协同工作的。我在《R 语言函数式编程》中对此进行过一些详细解释，但理解表达式如何被求值是至关重要的。当你开始接触非标准求值时，这一点就变得更为重要，因此值得重申。


    表达式被求值时，是在某个环境中进行的。环境以树状结构链接。每个环境都有一个父环境。当 R 需要查找一个变量时，它首先在当前环境中查找该环境是否持有该变量。如果没有，R
    会去父环境中查找。如果在那里也找不到，它会继续去祖父环境中查找，并沿着这个树状结构向上查找，直到找到该变量，或者到达全局环境后发现变量也不存在，这时就会抛出错误。我们称一个表达式通过这种方式能够找到的变量为其作用域。由于查找过程总是选择它找到给定变量的第一个位置，因此局部变量会覆盖全局变量。并且，虽然父环境链上的多个环境可能包含相同的变量名，但只有最内层的环境（即首先找到的那个）会被使用。


    当一个函数 `f` 被创建时，它会与 `environment(f)` 关联。这个环境就是 `f` 被定义时所在的环境。当 `f` 被调用时，R 会为 `f`
    创建一个计算环境；我们称其为 `evalenv`。`evalenv` 的父环境被设置为 `environment(f)`。由于 `environment(f)`
    是 `f` 被定义时所在的环境，将其设置为计算环境的父环境意味着：如果 `f` 是一个闭包，那么 `f` 的函数体能够访问其外部作用域。


    在计算环境被创建之后，`f` 的形式参数会作为 promise 被添加到该环境中。正如你之前从语言定义中看到的，默认参数和在函数调用处传入的参数，在 promise
    的建立方式上有所不同。默认参数对应的 promise 应在计算作用域 `evalenv` 中进行求值。这意味着它们可以引用其他的局部变量或形式参数。由于这些变量会被放入
    `evalenv`，并且 `evalenv` 的父环境是 `environment(f)`，这些 promise 也可以引用 `f` 被定义的作用域中的变量。然而，在函数调用处传给
    `f` 的表达式，会被存储为应在调用环境中求值的 promise。我们称该环境为 `callenv`。如果它们在 `evalenv` 中被求值，就无法引用你调用
    `f` 所在作用域中的变量；它们只能引用局部变量或 `f` 被定义的作用域中的变量。


    你可以在下面的示例中看到这一切是如何运作的：


    ```

    enclosing <- function() {

    z <- 2

    function(x, y = x) {

    x + y + z

    }

    }

    f <- enclosing()

    calling <- function() {

    w <- 5

    f(x = 2 * w)

    }

    calling()

    ## [1] 22

    ```


    你从全局环境开始，在此处将 `enclosing` 定义为一个函数。当你调用 `enclosing` 时，会创建一个计算环境，在其中存储变量 `z`，然后返回一个函数，并将其作为
    `f` 存储在全局环境中。由于该函数是在 `enclosing` 的计算环境中定义的，因此这个环境就是 `f` 的 `environment`。


    接着你创建了 `calling`，将其存储在全局环境中，并调用它。这再次创建了一个计算环境。在其中，你存储了变量 `w`，然后调用 `f`。`f` 不在当前计算环境中，但由于计算环境的父环境是全局环境，你能够找到它。当你调用
    `f` 时，将表达式 `2 * w` 作为参数 `x` 传递给它。


    在 `f` 的内部调用中，有另一个计算环境。它的父环境是你从 `enclosing` 那里得到的闭包环境。这里你需要对 `f` 的函数体进行求值：`x +
    y + z`。然而，在此之前，需要先设置好计算环境。由于 `x` 和 `y` 是形式参数，它们会作为 promise 被存储在计算环境中。你在调用 `f`
    时提供了 `x` 作为参数，因此这个 promise 必须在调用环境（即 `calling` 内部的环境）中求值；而 `y` 有默认值，因此它必须在计算环境中求值。在这个计算环境中，它可以访问到
    `x` 和 `y`，并通过父环境访问到 `z`。你对 `x` 进行求值（即在调用环境中求表达式 `2 * w` 的值，此处 `w` 是已知的），然后对 `y`
    在局部环境中进行求值（此处 `x` 是已知的）。这样，你就得到了这两个变量的值，然后从闭包环境中获取 `z` 的值。


    你可以尝试使用显式环境和 `delayedAssign` 来存储 promise，以模拟这一切。你需要三个环境，因为这个例子不需要模拟全局环境。你需要 `f`
    函数被定义时的环境；我们称其为 `defenv`。然后你需要调用 `f` 时的计算环境，以及 `f` 被调用的环境。


    ```

    defenv <- new.env()

    evalenv <- new.env(parent = defenv)

    callenv <- new.env()

    ```


    这里，`defenv` 和 `calling` 的父环境都是全局环境，不过你无需担心这个。计算环境的父环境是 `defenv`。


    在定义环境中，你保存了 `z` 的值。


    ```

    defenv$z <- 2

    ```


    在调用环境中，你保存了 `w` 的值。


    ```

    callenv$w <- 5

    ```


    在计算环境中，你设置好 promise。`delayedAssign` 函数接收两个环境作为参数。第一个是 promise 应该被求值的环境，第二个是它应该被存储的环境。对于
    `x`，你希望表达式在调用环境中求值；对于 `y`，你希望它在计算环境中求值。两个变量都应存储在计算环境中。


    ```

    delayedAssign("x", 2 * w, callenv, evalenv)

    delayedAssign("y", x, evalenv, evalenv)

    ```


    现在，你可以在 `evalenv` 中对 `f` 进行求值。


    ```

    f <- function(x, y = x) x + y + z

    eval(body(f), evalenv)

    ## [1] 22

    ```


    一次函数调用的背后竟然有如此多的操作，这着实令人惊讶，但这一切都遵循着将参数作为 promise 进行传递的这些规则。

    '
- fmt: "# Modifying Functions\n\nYou can do more than just inspect functions. The\
    \ three functions for inspecting also come in assignment versions, and you can\
    \ use those to change the three components of a function. If you go back to the\
    \ simple definition of `f`:\n\n```\nf <- function(x) x\nf\n## function(x) x\n\
    ```\n\nYou can try modifying its formal arguments by setting a default value for\
    \ `x`:\n\n```\nformals(f) <- list(x = 3)\nf\n## function (x = 3)\n## x\n```\n\n\
    Where, with a default value for `x`, you can evaluate its body in the environment\
    \ of its formals:\n\n```\neval(body(f), formals(f))\n## [1] 3\n```\n\nI will stress\
    \ again, though, that evaluating a function is not quite as simple as evaluating\
    \ its body in the context of its formals. It doesn't matter that you change a\
    \ function's formal arguments outside of its definition when the function is invoked.\
    \ The formal arguments will still be evaluated in the context where the function\
    \ was defined.\n\nIf you define a closure, you can see this in action:\n\n```\n\
    nested <- function() {\ny <- 5\nfunction(x) x\n}\nf <- nested()\n```\n\nSince\
    \ `f` was defined inside the evaluating environment of `nested`, its `environment(f)`\
    \ will be that environment. When you call it, it will, therefore, be able to see\
    \ the local variable `y` from `nested`. It doesn't refer to that, but you can\
    \ change this by modifying its formals:\n\n```\nformals(f) \n```\n\nHere, you\
    \ have to use the function `quote` to make `y` a name. If you didn't, you would\
    \ get an error, or you would get a reference to a `y` in the global environment.\
    \ In function definitions, default arguments are automatically quoted to turn\
    \ them into expressions, but when you modify `formals`, you have to do this explicitly.\n\
    \nIf you now call `f` without arguments, `x` will take its default value as specified\
    \ by `formals(f)`. That is, it will refer to `y`. Since this is a default argument,\
    \ it will be turned into a promise that will be evaluated in `f`'s evaluation\
    \ environment. There is no local variable named `y`, so R will look in `environment(f)`\
    \ for `y` and find it inside the `nested` environment:\n\n```\nf()\n## [1] 5\n\
    ```\n\nJust because you modified `formals(f)` in the global environment, you do\
    \ not change in which environment R evaluates promises for default parameters.\
    \ If you have a global `y`, the `y` in `f`'s formals still refer to the one in\
    \ `nested`:\n\n```\ny <- 2\nf()\n## [1] 5\n```\n\nOf course, if you provide `y`\
    \ as a parameter when calling `f`, things change. Now it will be a promise that\
    \ should be evaluated in the calling environment, so in that case, you get a reference\
    \ to the global `y`:\n\n```\nf(x = y)\n## [1] 2\n```\n\nYou can modify the body\
    \ of `f` as well. Instead of having its body refer to `x`, you can, for example,\
    \ make it return the constant 6:\n\n```\nbody(f) \n```\n\nNow it evaluates that\
    \ constant, six, when we call it, regardless of what `x` is:\n\n```\nf()\n## [1]\
    \ 6\nf(x = 12)\n## [1] 6\n```\n\nYou can also try making `f`'s body more complex\
    \ and make it an actual expression:\n\n```\nbody(f) <- 2 * y\nf()\n## [1] 4\n\
    ```\n\nHere, however, you don't get quite what you want. You don't want the body\
    \ of a function to be evaluated before you call the function, but when you assign\
    \ an expression like this, you do evaluate it before you assign. There is a limit\
    \ to how far lazy evaluation goes. Since `y` was 2, you are in effect setting\
    \ the body of `f` to 4. Changing `y` afterward doesn't change this:\n\n```\ny\
    \ <- 3\nf()\n## [1] 4\n```\n\nTo get an unevaluated body, you must, again, use\
    \ `quote`:\n\n```\nbody(f) \n```\n\nNow, however, you get back to the semantics\
    \ for function calls, which means that the body is evaluated in an evaluation\
    \ environment whose parent is the environment inside `nested`, so `y` refers to\
    \ the local and not the global parameter:\n\n```\nf()\n## [1] 10\ny <- 2\nf()\n\
    ## [1] 10\n```\n\nYou can change `environment(f)` if you want to make `f` use\
    \ the global `y`:\n\n```\nenvironment(f) <- globalenv()\nf()\n## [1] 4\ny <- 3\n\
    f()\n## [1] 6\n```\n\nIf you do this, though, it will no longer know about the\
    \ environment inside `nested`. It takes a lot of environment hacking if you want\
    \ to pick and choose which environments a function finds its variables in, and\
    \ if that is what you want, you are probably better off rewriting the function\
    \ to get access to variables in other ways.\n\nIf you want to set the formals\
    \ of a function to missing values (that is, you want them to be parameters without\
    \ default values), then you need to use `list` to create the arguments.\n\nIf\
    \ you define a function `f` like this, it takes one parameter, `x`, and adds it\
    \ to a global parameter `y`:\n\n```\nf <- function(x) x + y\n```\n\nIf instead\
    \ you want `y` to be a parameter but not give it a default value, you could try\
    \ something like this:\n\n```\nformals(f) <- list(x =, y =)\n```\n\nThis will\
    \ not work, however, because `list` doesn't like empty values. Instead, you can\
    \ use `alist`. This function creates a pair-list, which is a data structure used\
    \ internally in R for formal arguments. It is the only thing this data structure\
    \ is used for, but if you start hacking around with modifying parameters of a\
    \ function, it is the one to use:\n\n```\nformals(f) <- alist(x =, y =)\n```\n\
    \nUsing `alist`, expressions are also automatically quoted. In the earlier example\
    \ where you wanted the parameter `x` to default to `y`, you needed to use `quote(y)`\
    \ to keep `y` as a promise to be evaluated in `environment(f)` rather than the\
    \ calling scope. With `alist`, you do not have to quote `y`:\n\n```\nnested \n\
