    This is an unfortunate name since `parent.frame` has nothing to do with the parent
    environment, which you get using the `parent.env` function. The “frame” refers
    to environments on the call stack, often called stack frames, while the parent
    environment refers to the parents in environments.


    # 3. Expressions and Environments


    This chapter digs deeper into how environments work and how you can evaluate expressions
    in different environments. Understanding how environments are chained together
    helps you understand how the language finds variables, and being able to create,
    manipulate, and chain together environments when evaluating expressions is a key
    trick for metaprogramming.


    ## Expressions


    You can consider everything that is evaluated in R to be an expression. Every
    statement you have in your programs is also an expression that evaluates to some
    value (which, of course, might be `NULL`). This includes control structures and
    function bodies. You can consider everything an expression; it’s just that some
    expressions involve evaluating several contained expressions for their side effects
    before returning the result of the last expression they evaluate. From a metaprogramming
    perspective, though, you are most interested in expressions you can get your hands
    on and examine, modify, or evaluate within a program.


    Believe it or not, you have already seen most of the ways to get expression objects.
    You can get function bodies using the `body` function, or you can construct expressions
    using `quote` or `call`. Using any of these methods, you get an object you can
    manipulate and evaluate from within a program. Usually, expressions are just automatically
    evaluated when R gets to them during a program’s execution, but if you have an
    expression as the kind of object you can manipulate, you have to evaluate it explicitly.
    If you don’t evaluate it, its value is the actual expression; if you evaluate
    it, you get the value it corresponds to in a given scope.


    In this chapter, you will not concern yourself with the manipulation of expressions.
    That is the topic of Chapter [4](#A449887_1_En_4_Chapter.html). Instead, you will
    focus on how expressions are evaluated and how you can change the scope when you
    evaluate an expression. If you just write an expression as R source code, it will
    be evaluated in the scope where it is written. This is what you are used to doing.
    To evaluate it in a different scope, you need to use the `eval` function. If you
    don’t give `eval` an environment, it will just evaluate an expression in the scope
    where `eval` is called, similar to if you had just written the expression there.
    If you give it an environment, however, that environment determines the scope
    in which the expression is evaluated.


    To understand how you can exploit scopes, though, you first need to understand
    how environments define scopes in detail.'
  trans: '

    您使用 `eval(substitute(alist(...)))` 表达式来获取函数的所有参数并放入一个配对列表中，且不对任何潜在表达式进行求值。您希望保留惰性求值特性，因为在您尝试赋值给绑定的变量之前，作为参数提供的表达式不能被求值。使用
    `eval(substitute(alist(...)))` 可以实现这一点。`substitute` 调用将函数的实际参数放入 `alist(...)`
    表达式中，当您随后对这个表达式求值时，就会得到配对列表。您从 `parent.frame` 中获取应该绑定变量的作用域，然后将绑定和作用域组合成一个名为 `bindings`
    的类。虽然不一定要将其设为类，但这并无坏处，所以您不妨这样做。


    实际工作是在 `%<-%` 运算符中完成的。在这里，您需要做几件事。您需要确定哪些参数绑定只是名称（此时应根据其位置分配值），哪些是需要求值的表达式。位置参数可以直接赋值，然后将其存储在您在绑定中记住的作用域中。表达式应同时具有名称和需要求值的表达式（您无法在任何作用域中直接对实际表达式赋值，因此这些表达式必须是有名称的参数）。如果表达式引用了您在
    `bind` 调用中命名的其他参数，它们需要知道这些参数是什么，因此您需要在 `bind` 提供的作用域中对表达式求值。如果您赋给表达式的值有名称，您还需要能够引用它们，例如编写如下赋值语句：


    ```

    bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

    ```


    为了实现这一点，您可以将这些值转换为一个环境，并将 `bind` 的父作用域也作为该环境的父环境。这样，它们既可以引用您赋值的变量，也可以引用您绑定中的变量。关于表达式引用您定义的其他参数，唯一的复杂之处在于表达式求值的顺序。为了对一个表达式求值，它所引用的所有变量都必须先被赋值。因此，您似乎需要解析表达式并确定顺序——即根据表达式使用了哪些变量对表达式进行拓扑排序——但您可以通过借用函数参数求值的一个技巧来避免：惰性求值。如果您不为每个参数赋值，而是赋一个承诺，那么您就不必担心变量赋值的顺序。每当
    R 看到对这些承诺的引用时，它会自行处理这个顺序。这意味着，如果您在访问另一个变量之前修改了某个已赋值的变量，您可能会得到函数的惰性求值行为。例如，如果执行以下操作，`y`
    将引用 10 而不是 24：


    ```

    bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

    z <- 5

    ```


    为避免此问题，您可以在完成所有表达式赋值后，强制对所有表达式求值。


    整个函数如下：


    ```

    .unpack  0)

    value_env  0) force(bindings$scope[[name]])

    }

    }

    ```


    它能按预期工作。


    ```

    bind(x, y, z) %<-% 1:3

    c(x, y, z)

    ## [1] 1 2 3

    bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

    c(y, z)

    ## [1]  8 12

    bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

    c(y, z)

    ## [1] 24 12

    ```


    这部分唯一复杂的是如何处理惰性赋值。您需要使用 `delayedAssign`，并且求值环境需要是包含值的环境，而赋值环境需要是您在 `bind` 函数中存储的环境。困难之处在于获取要求值的表达式。您不能对其求值——这正是您试图避免的——因此您需要将其作为一个表达式给出。然而，这个表达式要到以后并在不同的作用域中才会被求值，所以您不能简单地使用
    `bindings$bindings` 列表来获取表达式。您需要将表达式替换到整个赋值的表达式中，然后再对其进行求值。`eval(substitute(...))`
    模式就是实现这一点的关键；在此函数中，为了可读性将其分成了两行，但其核心技巧就是用 `substitute` 将表达式嵌入另一个表达式，然后再求值。


    如果这整套关于表达式、替换和求值的练习让你头晕目眩，那么请深吸一口气，继续读下去。你将在接下来的两章中对其进行更深入的探讨。


    脚注 1


    这是一个不幸的名称，因为 `parent.frame` 与父环境（parent environment）无关，父环境是通过 `parent.env` 函数获得的。“框架”（frame）指的是调用栈上的环境，通常称为栈帧，而父环境指的是环境链上的上级环境。


    # 3. 表达式与环境


    本章深入探讨环境的工作机制以及如何在不同的环境中对表达式求值。理解环境如何链接在一起，有助于您理解语言如何查找变量，而在求值表达式时能够创建、操作和链接环境，是元编程的关键技巧。


    ## 表达式


    在 R 中，任何被求值的内容都可以被视为一个表达式。程序中的每条语句也都是一个表达式，它会求出某个值（当然，该值可能是 `NULL`）。这包括控制结构和函数体。所有内容都可以视为表达式；只是某些表达式会对其包含的多个表达式进行求值以获得它们的副作用（side
    effects），然后返回最后一个被求值表达式的结果。然而，从元编程的角度来看，您最感兴趣的是那些可以在程序内部获取、检查、修改或求值的表达式。


    信不信由你，您已经看到了获取表达式对象的大部分方法。您可以使用 `body` 函数获取函数体，或者使用 `quote` 或 `call` 构建表达式。使用这些方法中的任何一种，您都会得到一个可以在程序内部操作和求值的对象。通常，表达式会在程序执行时由
    R 自动求值，但如果您拥有一个可以操作的对象形式的表达式，则必须显式地对其求值。如果您不对它求值，它的值就是实际的表达式本身；如果您对它求值，您就会得到它在给定作用域中所对应的值。


    在本章中，您将不涉及表达式的操作。那是第 4 章的主题。相反，您将重点关注表达式如何被求值，以及如何在求值表达式时更改其作用域。如果您只是将表达式作为 R
    源代码编写，它将在其书写的作用域中被求值，这是您习惯的做法。要在不同的作用域中求值，您需要使用 `eval` 函数。如果您不给 `eval` 提供一个环境，它将只会在
    `eval` 被调用的作用域中对表达式求值，就像您直接在那里编写表达式一样。然而，如果您给它一个环境，该环境就决定了表达式求值时的作用域。


    不过，要理解如何利用作用域，您首先需要详细了解环境如何定义作用域。

    '
- fmt: "# Chains of Linked Environments\n\nYou have seen how functions have associated\
    \ environments that capture where they were defined, and you have seen that when\
    \ you evaluate a function call, you have an evaluation environment that is linked\
    \ to this definition environment. You have also seen how this works through a\
    \ linked list of parent environments. So far, though, you have claimed that this\
    \ chain ends in the global environment, where you look for variables if you don’t\
    \ find them in any nested scope. For all the examples you have seen so far, this\
    \ might as well be true, but in any real use of R, you have packages loaded. The\
    \ reason that you can find functions from packages is that these packages are\
    \ also found in the chain of environments. The global environment also has a parent,\
    \ and when you load packages, the last package you loaded will be the parent of\
    \ the global environment, and the previous package will be the parent of the new\
    \ package. This explains both how you can find variables in loaded packages and\
    \ why loading new packages can overshadow variables defined in other packages.\n\
    \nIt has to stop at some point, of course, and there is a special environment\
    \ that terminates the sequence. This is known as the empty environment, and it\
    \ is the only environment that doesn’t have a parent. When you start up R, the\
    \ empty environment is there. Then R puts in the base environment, where all the\
    \ base language functionality lives. Next it puts in an `Autoload` environment,\
    \ responsible for loading data on demand, and on top of that, it puts in the global\
    \ environment. The base environment and the empty environment are sufficiently\
    \ important that you have functions to get hold of them. These are `baseenv()`\
    \ and `emptyenv()`, respectively.\n\nWhen you import packages, or generally attach\
    \ a namespace, it gets put on the this list just below the global environment.\
    \ The function `search()` will give you the sequence of environments from the\
    \ global environment and down. You can see how loading a library affects this\
    \ list in this example:\n\n```\nsearch()\n##  [1] \".GlobalEnv\"\n##  [2] \"package:ggplot2\"\
    \n##  [3] \"package:purrr\"\n##  [4] \"package:microbenchmark\"\n##  [5] \"package:pryr\"\
    \n##  [6] \"package:magrittr\"\n##  [7] \"package:knitr\"\n##  [8] \"package:stats\"\
    \n##  [9] \"package:graphics\"\n## [10] \"package:grDevices\"\n## [11] \"package:utils\"\
    \n## [12] \"package:datasets\"\n## [13] \"Autoloads\"\n## [14] \"package:base\"\
    \nlibrary(MASS)\nsearch()\n##  [1] \".GlobalEnv\"\n##  [2] \"package:MASS\"\n\
    ##  [3] \"package:ggplot2\"\n##  [4] \"package:purrr\"\n##  [5] \"package:microbenchmark\"\
    \n##  [6] \"package:pryr\"\n##  [7] \"package:magrittr\"\n##  [8] \"package:knitr\"\
    \n##  [9] \"package:stats\"\n## [10] \"package:graphics\"\n## [11] \"package:grDevices\"\
    \n## [12] \"package:utils\"\n## [13] \"package:datasets\"\n## [14] \"Autoloads\"\
    \n## [15] \"package:base\"\n```\n\nThe `search()` function is an internal function,\
    \ but you can write your own version to get a feeling for how it could work. While\
    \ `search()` searches from the global environment, though, you will make your\
    \ function more general and give it an environment to start from. You simply need\
    \ it to print out environment names and then move from the current environment\
    \ to the parent until you hit the empty environment.\n\nTo get the name of an\
    \ environment, you can use the function `environmentName()`. Not all environments\
    \ have names; environments you create when you nest or call functions or environments\
    \ you create with `new.env()` do not have names. However, environments created\
    \ when you are loading packages do. If an environment doesn’t have a name, though,\
    \ `environmentName()` will give you an empty string. In that case, you will instead\
    \ just use `str()` to get a representation of environments that you can print.\n\
    \nTo check whether you have reached the end of the environment chain, you check\
    \ `identical(env, emptyenv())`. You cannot compare two environments with `==`,\
    \ but you can use `identical()`. Your function could look like this:\n\n```\n\
    my_search <- function(env) {\nrepeat {\nname <- environmentName(env)\nif (nchar(name)\
    \ != 0)\nname <- paste0(name, \"\\n\")\nelse\nname <- str(env, give.attr = FALSE)\n\
    cat(name)\nenv <- parent.env(env)\nif (identical(env, emptyenv())) break\n}\n\
    }\n```\n\nCalling it with the global environment as the argument should give you\
    \ a result similar to `search()`, except you are printing the environments instead\
    \ of returning a list of names.\n\n```\nmy_search(globalenv())\n## R_GlobalEnv\n\
    ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
    ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
    ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n##\
    \ base\n```\n\nSince you can give it any environment, you can try to get hold\
    \ of the environment of a function. If you write a function nested into other\
    \ function scopes, you can see that you get (nameless) environments for the functions.\n\
    \n```\nf <- function() {\nmy_search(environment())\n}\nf()\n## \n## \n## R_GlobalEnv\n\
    ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
    ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
    ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n##\
    \ base\n```\n\nYou can also get hold of the environment of imported functions.\
    \ For example, you can get the chain of environments starting at the `ls()` function\
    \ like this:\n\n```\nmy_search(environment(ls))\n## base\n## R_GlobalEnv\n## package:MASS\n\
    ## package:ggplot2\n## package:purrr\n## package:microbenchmark\n## package:pryr\n\
    ## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
    ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n##\
    \ base\n```\n\nHere you see something that is a little weird. It looks like `base`\
    \ is found both at the top and at the bottom of the list. Clearly, this can’t\
    \ be the same environment; it would need to have, as its parent, both the global\
    \ environment and the parent, and environments have only one parent. The only\
    \ reason it looks like it is the same environment is that `environmentName()`\
    \ gives you the same name for two different environments. They are different.\n\
    \n```\nenvironment(ls)\n## <environment: namespace:base>\nbaseenv()\n## <environment:\
    \ base>\n```\n\nThe environment of `ls()` is a namespace defined by the `base`\
    \ package. The `baseenv()` environment is how this package is exported into the\
    \ environment below the global environment, making base functions available to\
    \ you outside of the `base` package.\n\nHaving such extra environments is how\
    \ packages manage to have private functions within a package and have other functions\
    \ that are exported to users of a package. The `base` package is special in defining\
    \ only two environments: the namespace for the package and the package environment.\
    \ All other packages have three packages set up in their environment chain before\
    \ the global environment: the package namespace, a namespace containing imported\
    \ symbols, and then the base environment, which, as you just saw, connects to\
    \ the global environment. Figure 3-1 shows the graph of environments when three\
    \ packages are loaded: `MASS`, `stats`, and `graphics` (here `graphics` was loaded\
    \ first, then `stats`, and then `MASS`, so `MASS` appears first, followed by `stats`\
    \ and then `graphics` on the path from the global environment to the base environment).\
    \ The solid arrows indicate parent pointers for the environments, and the dashed\
    \ arrows indicate from which package symbols are exported into package environments.\n\
    \n![A449887_1_En_3_Fig1_HTML.gif](A449887_1_En_3_Fig1_HTML.gif)\n\n**Figure 3-1.**\
    \ Environment graph with three loaded packages: MASS, stats, and graphics"
