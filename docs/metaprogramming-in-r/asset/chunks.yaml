- fmt: '# Substitution


    `substitute`函数用于在表达式中的变量替换为值。你刚才看到的`deparse(substitute(x))`结构正是利用了这一点：它使用`substitute`获取函数参数`x`所引用的表达式，然后将其转换为字符串。如果直接引用`x`，会强制求值参数并得到求值结果；而使用`substitute`则可以得到`x`所引用的表达式。


    获取用作函数参数的表达式（而非表达式的值）是`substitute`的常见用途。与`deparse`配合使用时，它用于创建图形标签。它也用于所谓的非标准求值（nonstandard
    evaluation）——即不遵循环境默认规则对参数进行求值的函数。非标准求值将在下一节中介绍，它使用`substitute`获取参数中的表达式，然后在不同于函数求值环境的环境中使用`eval`对表达式进行求值。


    在考虑求值表达式之前，你应先了解`substitute`的工作原理。这在一定程度上取决于它被调用的位置。在全局环境中，`substitute`不会做任何事，至少在你没有给它提供多于表达式本身参数的情况下（稍后会说明）。在所有其他环境中，如果你仅使用一个表达式调用`substitute`，该函数会在表达式中搜索变量。如果发现某个变量在当前环境中有值（无论是函数调用的承诺（promise）还是你已赋值的变量），它会将该变量替换为值。如果变量在环境中没有值，则保持不变。在全局环境中，它会让所有变量保持不变。


    在下面的示例中，你会看到即使在全局环境中定义了变量`x`和`y`，`substitute(x + y)`也没有被修改。但在函数`f`的环境中，这两个变量会被替换为它们的值。


    ```

    x <- 2; y <- 3

    substitute(x + y)

    ## x + y

    f <- function(x, y) substitute(x + y)

    f(2, 3)

    ## 2 + 3

    ```


    使用`substitute`时，变量的查找方式与`eval`不同。当`substitute`在环境中查找时，它不会沿着父环境指针向上查找。如果在调用它的确切环境中未找到要替换的变量，它就不会进一步查找。因此，如果你编写如下函数：


    ```

    y - 3

    ## [1] 0

    f <- function(x) substitute(x + y)

    f(2)

    ## 2 + y

    g <- function(x) function(y) substitute(x + y)

    h <- g(2)

    h(3)

    ## x + 3

    ```


    当调用函数`f`时，其求值环境中有`x`，父环境（即全局环境）中有`y`，但`substitute`只会替换局部变量`x`。对于`h`，它会知道`y`是局部变量，而`x`来自其闭包；然而，只有局部变量`y`会被替换。


    `substitute`实际用于查找变量的环境作为其第二个参数给出。默认值为当前的求值环境。你可以通过提供一个环境或一个包含变量到值映射的列表来更改此参数。


    ```

    e <- new.env(parent = emptyenv())

    e$x <- 2

    e$y <- 3

    substitute(x + y, e)

    ## 2 + 3

    substitute(x + y, list(x = 2, y = 3))

    ## 2 + 3

    ```


    同样，`substitute`不会沿着父环境指针查找。无论这些父环境是隐式设置还是显式设置在传递给函数的环境中，都是如此。


    ```

    x <- 2 ; y <- 3

    e <- new.env(parent = globalenv())

    substitute(x + y, e)

    ## x + y

    e <- new.env(parent = globalenv())

    e$x <- 2

    e$y <- 3

    e2 <- new.env(parent = e)

    substitute(x + y, e2)

    ## x + y

    ```


    如果你希望某个变量被替换，需要确保该变量存在于你提供给`substitute`的确切环境中。


    ## 替换存储在变量中的表达式


    当你操作表达式时，一个常见情况是持有对表达式的引用（例如来自函数参数），并希望修改它。在全局环境中，你不能直接用`substitute`做到这一点。如果你给`substitute`一个变量，它只会返回该变量。


    ```

    expr <- quote(x + y)

    substitute(expr)

    ## expr

    ```


    这是因为`substitute`不会替换全局环境中的变量。你可以通过显式地将表达式放在环境或列表中提供给`substitute`来使表达式被替换。


    ```

    substitute(expr, list(expr = expr))

    ## x + y

    ```


    不过，通常你并不是在全局环境中操作表达式，在函数内部你可以替换表达式。


    ```

    f <- function() {

    expr <- quote(x + y)

    substitute(expr)

    }

    f()

    ## x + y

    ```


    但如果你想要在这里替换表达式中的`y`为2呢？无论使用显式列表的全局环境还是在函数内部，替换都会将`expr`替换为`quote(x + y)`，但你还想进一步将`y`替换为2。你无法直接从局部环境获取`y`并显式地将其交给`substitute`；这样也行不通。


    ```

    f <- function() {

    expr <- quote(x + y)

    y <- 2

    substitute(expr)

    }

    f()

    ## x + y

    f <- function() {

    expr <- quote(x + y)

    substitute(expr, list(y = 2))

    }

    f()

    ## expr

    ```


    你想要做的是，首先将`expr`替换为表达式`quote(x + y)`，然后将`y`替换为2。因此，自然的方法是编写以下代码，但这行不通：


    ```

    substitute(substitute(expr, list(expr = expr)), list(y = 2))

    ## substitute(expr, list(expr = expr))

    ```


    这里的问题是，`y`没有出现在最外层`substitute`所给的表达式中任何位置，因此它不会被替换进去。你得到的只是以下表达式：


    ```

    substitute(expr, list(expr = expr))

    ```


    你可以计算这个表达式得到`x + y`。


    ```

    eval(substitute(substitute(expr, list(expr = expr)), list(y = 2)))

    ```


    然而，求值首先会将`y`替换到最内层的`substitute`表达式中（那里没有`y`变量），然后才会将`expr`替换到表达式`expr`中。顺序是错误的。


    要替换存储在其他变量中的表达式中的变量，必须以与直觉相反的顺序编写表达式。你不想先在最内层替换`expr`，然后在外层替换`y`；你应该先将`expr`替换到一个能够处理`y`替换的`substitute`表达式中。最外层将`expr`替换到`substitute(expr,
    list(y = 2))`中，然后你可以对该表达式求值，以得到将`y`替换到原表达式的结果。


    因此，你需要这样创建待求值的表达式：


    ```

    substitute(substitute(expr, list(y = 2)), list(expr = expr))

    ## substitute(x + y, list(y = 2))

    ```


    这样完成替换：


    ```

    eval(substitute(substitute(expr, list(y = 2)), list(expr = expr)))

    ## x + 2

    ```


    这可能需要一些时间来适应，但你只需记住，你需要按照这个顺序进行替换。'
  raw: '## Substitution


    The `substitute` function replaces variables for values in an expression. The
    `deparse(substitute(x))` construction you just saw exploits this by using `substitute`
    to get the expression that the function parameter `x` refers to before translating
    it into a string. If you just refer to `x`, you will force an evaluation of the
    argument and get the value it evaluates to; instead, because you use `substitute`,
    you get the expression that `x` refers to.


    Getting the expression used as a function argument, rather than the value of the
    expression, is a common use of `substitute`. Together with `deparse`, it is used
    to create labels for plots. It is also used for so-called nonstandard evaluation—functions
    that do not evaluate their arguments following the default rules for environments.
    Nonstandard evaluation, which you will return to in the next section, obtains
    the expressions in arguments using `substitute` and then evaluates them using
    `eval` in environments different from the function’s evaluation environment.


    Before you consider evaluating expressions, however, you should get a handle on
    how `substitute` works. This depends a little bit on where it is called. In the
    global environment, `substitute` doesn’t do anything, at least not unless you
    give it more arguments than the expression (I get to that shortly). In all other
    environments, if you just call `substitute` with an expression, the function will
    search through the expression and find variables. If it finds a variable that
    has a value in the current environment—whether it is a promise for a function
    call or a variable you have assigned values to—it will substitute the variable
    with the value. If the variable does not have a value in the environment, it is
    left alone. In the global environment, it leaves all variables alone.


    In the following example, you see that `substitute(x + y)` doesn’t get modified
    in the global environment, even though the variables `x` and `y` are defined.
    Inside the function environment for `f`, however, you substitute the two variables
    with their values.


    ```

    x <- 2; y <- 3

    substitute(x + y)

    ## x + y

    f <- function(x, y) substitute(x + y)

    f(2, 3)

    ## 2 + 3

    ```


    With `substitute`, variables are not found the same way as they are in `eval`.
    When `substitute` looks in an environment, it does not follow the parent pointer.
    If it doesn’t find the variable to substitute in the exact environment in which
    it is called, it will not look further. So, if you write functions like these:


    ```

    y - 3

    ## [1] 0

    f <- function(x) substitute(x + y)

    f(2)

    ## 2 + y

    g <- function(x) function(y) substitute(x + y)

    h <- g(2)

    h(3)

    ## x + 3

    ```


    the function `f`, when called, will have `x` in its evaluation environment and
    `y` in the parent environment (which is the global environment), but `substitute`
    will substitute only the local variable, `x`. For `h`, it will know `y` as a local
    variable and `x` from its closure; however, only `y`, the local variable, will
    be substituted.


    The actual environment that `substitute` uses to find variables is given as its
    second argument. The default is just the current evaluating environment. You can
    change that by providing either an environment or a list with a variable to value
    mapping.


    ```

    e <- new.env(parent = emptyenv())

    e$x <- 2

    e$y <- 3

    substitute(x + y, e)

    ## 2 + 3

    substitute(x + y, list(x = 2, y = 3))

    ## 2 + 3

    ```


    Again, `substitute` will not follow parent pointers. Whether these are set implicitly
    or explicitly in the environment, you pass on to the function.


    ```

    x <- 2 ; y <- 3

    e <- new.env(parent = globalenv())

    substitute(x + y, e)

    ## x + y

    e <- new.env(parent = globalenv())

    e$x <- 2

    e$y <- 3

    e2 <- new.env(parent = e)

    substitute(x + y, e2)

    ## x + y

    ```


    If you want a variable substituted, you need to make sure it is in the exact environment
    you provide to `substitute`.


    ### Substituting Expressions Held in Variables


    A common case when you manipulate expressions is that you have a reference to
    an expression—for example, from a function argument—and you want to modify it.
    In the global environment, you cannot do this directly with `substitute`. If you
    give `substitute` a variable, it will just return that variable.


    ```

    expr <- quote(x + y)

    substitute(expr)

    ## expr

    ```


    This is because `substitute` doesn’t replace the variable in the global environment.
    You can get the expression substituted by explicitly giving `substitute` the expression
    in an environment or a list.


    ```

    substitute(expr, list(expr = expr))

    ## x + y

    ```


    Usually, though, you don’t manipulate expressions in the global environment, and
    inside a function you can substitute an expression.


    ```

    f <- function() {

    expr <- quote(x + y)

    substitute(expr)

    }

    f()

    ## x + y

    ```


    But what if you want to replace, say, `y` with 2 in the expression here? The substitution,
    both in the global environment with an explicit list or inside a function, will
    replace `expr` with `quote(x + y)`, but you want to take that then and replace
    `y` with 2\. You cannot just get `y` from the local environment and give it to
    `substitute` explicitly; that won’t work either.


    ```

    f <- function() {

    expr <- quote(x + y)

    y <- 2

    substitute(expr)

    }

    f()

    ## x + y

    f <- function() {

    expr <- quote(x + y)

    substitute(expr, list(y = 2))

    }

    f()

    ## expr

    ```


    What you want to do is first replace `expr` with the expression `quote(x + y)`
    and then replace `y` with 2\. So, the natural approach is to write the following
    code, which will not work:


    ```

    substitute(substitute(expr, list(expr = expr)), list(y = 2))

    ## substitute(expr, list(expr = expr))

    ```


    The problem here is that `y` doesn’t appear anywhere in the expression given to
    the outermost `substitute`, so it won’t be substituted in anywhere. What you get
    is just the following expression:


    ```

    substitute(expr, list(expr = expr))

    ```


    You can evaluate this to get `x + y`.


    ```

    eval(substitute(substitute(expr, list(expr = expr)), list(y = 2)))

    ```


    However, the evaluation first substitutes `y` into the innermost `substitute`
    expression—where there is no `y` variable—and then substitutes `expr` into the
    expression `expr`. The order is wrong.


    To substitute variables in an expression that you hold in another variable, you
    have to write the expression in the opposite order of what comes naturally. You
    don’t want to substitute `expr` at the innermost level and then `y` at the outermost
    level; you want to first substitute `expr` into a substitute expression that takes
    care of substituting `y`. The outermost level substitutes `expr` into `substitute(expr,
    list(y = 2))`, which you can evaluate to get `y` substituted into the expression.


    So, you create the expression you need to evaluate like this:


    ```

    substitute(substitute(expr, list(y = 2)), list(expr = expr))

    ## substitute(x + y, list(y = 2))

    ```


    You complete the substitute like this:


    ```

    eval(substitute(substitute(expr, list(y = 2)), list(expr = expr)))

    ## x + 2

    ```


    It might take a little getting used to, but you just have to remember that you
    need to do the substitutions in this order.'
