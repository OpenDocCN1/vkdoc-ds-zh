    \n## 引言\n\n欢迎阅读《R 语言中的元编程》。我撰写本书以及我关于 R 语言编程的其他书籍，旨在提供超越大多数 R 语言教科书典型入门水平的高级教学材料。本书涵盖了一些在\
    \ R 语言编程中使用的更高级技术，例如充分利用函数式编程、编写元程序（用于实际操作语言结构的代码），以及编写嵌入 R 语言的领域特定语言。\n\n本书介绍了元编程。元编程是指编写操作其他程序的程序；换句话说，将代码视为可以生成、分析或修改的数据。R\
    \ 是一种非常高级的语言，其中所有操作都是函数，而所有函数都是可以操作的数据。\n\n函数调用和表达式的求值方式具有极大的灵活性。R 的惰性求值语义意味着函数参数作为未求值的表达式传递，这些表达式可以在求值前被修改，或者可以在定义函数的上下文之外的环境中求值。这可以用来创建小型领域特定语言，并且是诸如\
    \ `dplyr` 或 `ggplot2` 等包中“整洁宇宙”的基本组成部分，在这些包中，表达式在由数据框定义的上下文中进行求值。\n\n当然，修改语言对函数调用和表达式求值的方式存在一些风险。这会使推理代码变得更加困难。另一方面，添加用于处理日常编程任务的小型嵌入式语言增强了语言的表达能力，只要这种元编程被谨慎使用并在充分理解（且有充分文档说明）的框架内进行，其带来的好处就远远超过了编程混乱的风险。\n\
    \n在本书中，你将学习如何操作函数和表达式，以及如何以非标准方式对表达式进行求值。阅读本书的先决条件是熟悉函数式编程，至少熟悉高阶函数，即接受其他函数作为输入或返回函数的函数。\n\
