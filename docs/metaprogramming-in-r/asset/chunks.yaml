  raw: '## Afterword


    You have now seen the various techniques used for manipulating the actual language
    constructs of R from within R programs. Manipulating the actual language, doing
    metaprogramming, gives you the tools to extend R in various ways. You can write
    functions for modifying other functions—as you did with the code for computing
    the derivative of a function—or you can write small embedded domain-specific languages
    for manipulating or querying data frames, as done in `dplyr` and `ggplot2` . You
    know how to do nonstandard evaluation, changing how expressions are evaluated
    so you can evaluate them in different scopes than what they would usually be evaluated
    in, which can often simplify how functions are used in pipelines; however, you
    should be careful with using such programming when writing programs since it can
    be hard to reason about expressions passed between functions.


    You don’t want to overdo metaprogramming. Someone reading your code will, presumably,
    know how to read R code, so you shouldn’t break the person’s expectations for
    how the code will be evaluated. If you develop a domain-specific language and
    use metaprogramming for this, you are generally fine; someone who can read the
    expressions you implement there will know how they behave, but use metaprogramming
    with care. It is a powerful tool but also a very big gun to shoot yourself in
    the foot with if you are not careful.


