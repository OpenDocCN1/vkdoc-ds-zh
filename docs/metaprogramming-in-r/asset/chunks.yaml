    For function calls, you have to apply the chain rule. For primitive functions
    you cannot get a list of formal arguments, so you cannot handle these by inspecting
    the functions; you have to use their names to figure out what their arguments
    and derivatives are. I’m showing a few cases here, but I will leave handling other
    functions as an exercise for you:


    ```

    diff_built_in_function_call <- function(expr, x, e) {

    # chain rule with a known function to differentiate...

    if (expr[[1]] == as.name("sin"))

    return(call("*", call("cos", expr[[2]]),

    diff_expr(expr[[2]], x, e)))

    if (expr[[1]] == as.name("cos"))

    return(call("*", call("-", call("sin", expr[[2]])),

    diff_expr(expr[[2]], x, e)))

    if (expr[[1]] == as.name("exp"))

    return(call("*", call("exp", expr[[2]]),

    diff_expr(expr[[2]], x, e)))

    }

    ```


    For other function calls, you can inspect the function to work out which variables
    it has and apply the chain rules to those variables. This works only if you can
    figure out which function you are referring to, so you cannot handle cases where
    you have to compute the function. In those cases, you just give up. If you have
    a symbol for the function, however, you can look it up and inspect it. This isn’t
    entirely safe for general use. If you calculate the derivative of a function and
    then change a global function that it refers to, you will have a derivative that
    uses the old global function, while the actual function uses the new global function.
    There isn’t much you can do about this, though. At the point where you apply the
    chain rule, you need to know which arguments the function takes. That means you
    need to know which function you are working with.


    You can assume that the arguments used in the function call are the relevant ones
    to consider when you apply the chain rules. Those that you are not passing along
    in the function call will have default values and will not depend on the arguments
    given to the derivative function so that you can ignore them. Therefore, you can
    take the arguments in the function call and sum over those in the chain rule.
    You need to know the names of the arguments to compute the derivatives of the
    function, and you need to handle both positional and named arguments, and this
    is where you have to look up the actual function.


    In the environment you have passed along in the recursion—the environment of the
    original function you are computing the derivative of—you look up the function
    you have to apply the chain rule to. With that function in hand, you can use the
    function `match.call` to get all the names of the arguments in the function call.
    The `match.call` function takes care of merging named and positional arguments.
    For each argument, you build a function call by changing the function to its derivative
    to the appropriate variable. You use the `bquote` function to call `d` to compute
    these derivatives. You then multiply the function call with the argument differentiated
    with the original variable. Collecting all these terms in a sum completes the
    chain rule.


    ```

    diff_general_function_call <- function(expr, x, e) {

    function_name <- expr[[1]]

    if (!is.name(function_name))

    stop(paste0("Unexpected call ", deparse(expr)))

    func <- get(as.character(function_name), e)

    full_call <- match.call(func, expr)

    variables <- names(full_call)

    arguments <- vector("list", length(full_call) - 1)

    for (i in seq_along(arguments)) {

    var <- variables[i + 1]

    dfdz <- full_call

    dfdz[[1]] <- bquote(d(.(function_name), .(var)))

    dzdx <- diff_expr(expr[[i + 1]], x, e)

    arguments[[i]] <- bquote(.(dfdz) * .(dzdx))

    }

    as.call(c(list(sum), arguments))

    }

    ```


    There is one caveat with this solution: even if the original function is vectorized,
    the derivative won’t be. If you define the following functions, then `g` and `h`
    should be the same functions:


    ```

    f <- function(x, y) x^2 * y

    g <- function(z) f(2*z, z^2)

    h <- function(z) 4*z^4

    ```


    However, if you calculate `d(g,"z")` and `d(h,"z")` and call them with a vector
    of values, the former will add all the results together, while the latter will
    return a vector of values. The `sum` call in the derivative of `g` will gobble
    up all the values. You can fix this by calling `Vectorize` on `d(g,"z")`.


    Other than that, you now have a metaprogram for translating a function into its
    derivative. It doesn’t handle all possible functions; they have to be functions
    that evaluate simple expressions. The chain rule can be applied only to known
    functions mentioned by name, and you have handled only some of the primitive functions,
    but I trust you can see how you could build more functionality on top of what
    you have now.


    Footnotes [1](#A449887_1_En_4_Chapter.html#Fn1_source)


    To the extent that you can modify data in R. You are of course creating new objects
    with replacement operators.


    [2](#A449887_1_En_4_Chapter.html#Fn2_source)


    They basically are just special cases of calls. The `is.call` function will return
    `TRUE` for them, and there is no difference in how you can treat them. The only
    difference is in the syntax for how you write control-structure expressions compared
    to function calls.'
