    这是一个不幸的名称，因为`parent.frame`与父环境（parent environment）无关，父环境是通过`parent.env`函数获得的。“框架”（frame）指的是调用栈上的环境，通常称为栈帧，而父环境指的是环境链上的上级环境。


    # 3. 表达式与环境


    本章深入探讨环境的工作机制以及如何在不同的环境中对表达式求值。理解环境如何链接在一起，有助于您理解语言如何查找变量，而在求值表达式时能够创建、操作和链接环境，是元编程的关键技巧。


    ## 表达式


    在R中，任何被求值的内容都可以被视为一个表达式。程序中的每条语句也都是一个表达式，它会求出某个值（当然，该值可能是`NULL`）。这包括控制结构和函数体。所有内容都可以视为表达式；只是某些表达式会对其包含的多个表达式进行求值以获得它们的副作用（side
    effects），然后返回最后一个被求值表达式的结果。然而，从元编程的角度来看，您最感兴趣的是那些可以在程序内部获取、检查、修改或求值的表达式。


    信不信由你，您已经看到了获取表达式对象的大部分方法。您可以使用`body`函数获取函数体，或者使用`quote`或`call`构建表达式。使用这些方法中的任何一种，您都会得到一个可以在程序内部操作和求值的对象。通常，表达式会在程序执行时由R自动求值，但如果您拥有一个可以操作的对象形式的表达式，则必须显式地对其求值。如果您不对它求值，它的值就是实际的表达式本身；如果您对它求值，您就会得到它在给定作用域中所对应的值。


    在本章中，您将不涉及表达式的操作。那是第[4](A449887_1_En_4_Chapter.html)章的主题。相反，您将重点关注表达式如何被求值，以及如何在求值表达式时更改其作用域。如果您只是将表达式作为R源代码编写，它将在其书写的作用域中被求值，这是您习惯的做法。要在不同的作用域中求值，您需要使用`eval`函数。如果您不给`eval`提供一个环境，它将只会在`eval`被调用的作用域中对表达式求值，就像您直接在那里编写表达式一样。然而，如果您给它一个环境，该环境就决定了表达式求值时的作用域。


    不过，要理解如何利用作用域，您首先需要详细了解环境如何定义作用域。'
  raw: 'You use the `eval(substitute(alist(...)))` expression to get all the function’s
    arguments into a pair-list without evaluating any potential expressions. You want
    to preserve lazy evaluation because expressions provided as arguments cannot be
    evaluated before you try to assign to variables you bind. Using `eval(substitute(alist(...)))`
    you can achieve this. The `substitute` call puts the actual arguments of the function
    into the expression `alist(...)`, and when you then evaluate this expression,
    you get the pair-list. You get the scope where you should bind variables from
    `parent.frame` , and you then just combine the bindings and the scope in a class
    called `bindings`. You don’t need to make it into a class, but it doesn’t hurt,
    so you might as well.


    The real work is done in the `%<-%` operator. Here, you need to do several things.
    You need to figure out which of the parameter bindings are just names, where you
    should assign values based on their position, and which are expressions that you
    need to evaluate. Positional parameters you can just assign a value and then store
    them in the scope you remembered in the bindings. Expressions should have both
    a name and the expression we need to evaluate (we cannot assign to an actual expression
    in any scope, so you need these expressions to be named parameters). If expressions
    refer to other parameters that you name in the `bind` call, they need to know
    what those are, so you need to evaluate the expressions in a scope given by `bind`.
    If the values you are assigning to the expressions have names, then you also want
    to be able to refer to them, for example, to write an assignment like this:


    ```

    bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

    ```


    To achieve this, you can make the values into an environment and make the parent
    scope of `bind` the parent of this environment as well. This way, they can refer
    to variables both in the values you assign and in the variables you assign to
    in the binding. The only tricky part about having expressions refer to other parameters
    you define is then the order in which to evaluate the expressions. For an expression
    to be evaluated, all the variables it refers to must be assigned to first. So,
    it seems you would need to parse the expressions and figure out an order, a topological
    sorting of the expressions based on which variables are used in which expressions,
    but you can instead steal a trick from how functions evaluate arguments: lazy
    evaluation. If instead of assigning a value to each parameter you assign a promise,
    you won’t have to worry about the order in which you assign the variables. R will
    handle this order whenever it sees a reference to any of these promises. This
    would mean that if you modify one of the assigned variables before you access
    another, you could get the lazy evaluation behavior of functions. For example,
    if you did the following, then `y` would refer to 10 and not 24:


    ```

    bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

    z <- 5

    ```


    To avoid this problem, you can force evaluation of all the expressions once you
    are done assigning them all.


    The entire function is as follows:


    ```

    .unpack  0)

    value_env  0) force(bindings$scope[[name]])

    }

    }

    ```


    It works as intended.


    ```

    bind(x, y, z) %<-% 1:3

    c(x, y, z)

    ## [1] 1 2 3

    bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

    c(y, z)

    ## [1]  8 12

    bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

    c(y, z)

    ## [1] 24 12

    ```


    The only complicated part of this is how you handle the lazy assignment. You need
    to use `delayedAssign` for this, and you need the evaluation environment to be
    the environment that includes the values, and you need the assignment environment
    to be the one you stored in the `bind` function. The difficult bit is getting
    the expression evaluated. You cannot evaluate it. That is what you are actively
    trying to avoid, so you need to give it as an expression. This expression, however,
    will not be evaluated until later, and in a different scope, so you cannot simply
    use the `bindings$bindings` list for the expression. You need to substitute the
    expression into an expression for the entire assignment and then evaluate it.
    The `eval(substitute(...))` pattern is how you can achieve this; in this function,
    it is split over two lines for readability, but it is a simple trick of using
    substitute to get an expression into another expression and then evaluating it.


    If this whole exercise in expressions, substitutions, and evaluation makes your
    head spin, then take a deep breath and read on. You will take a deeper look at
    this in the next two chapters.


