- fmt: '# 5. Working with Substitutions


    You can take expressions and manipulate them by treating them as strings, but
    you can also modify them by substituting variables for expressions. In addition,
    you can build expressions by using more advanced quoting, and you can move back
    and forth between strings and expressions.


    ## A Little More on Quotes


    This chapter starts with quickly revisiting the quote mechanism. You have already
    seen how to quote expressions, but you can do more than just create verbatim expressions.
    I have discussed the `quote` function in some detail, but I showed the `bquote`
    function only in passing. The `bquote` function allows you create expressions
    where you only partially quote—you can evaluate some values when you create the
    expression and leave other parts for later. While `quote` wraps an entire expression
    in quotes, the `bquote` function does partial substitution in an expression. You
    call it with an expression, as you would call `quote`, but any subexpression you
    wrap in a call to “dot” (that is, you write `.(...)`) will not be quoted but will
    instead be evaluated, and the value will be put into the expression you are constructing.
    If you use `bquote` without using `.(...)`, it works just like `quote`.


    ```

    quote(x + y)

    ## x + y

    bquote(x + y)

    ## x + y

    bquote(.(2+2) + y)

    ## 4 + y

    ```


    You used `bquote` when you constructed terms for the chain rule in your differentiation
    program. Here you used `bquote(.(dfdz) * .(dzdx))` to construct the product of
    the differentiated function and the differentiated argument; you constructed `dfdz`
    and `dzdx` by constructing a differentiated function, using `bquote` again, for
    `dfdz` (as in `bquote(d(.(function_name), .(var))))`) and by calling the `diff_expr`
    function for `dzdx`.


    In many situations where you need to create a call object, using `bquote` can
    be much simpler than constructing the call object explicitly. For the simple example
    shown previously, there is not a huge difference.


    ```

    bquote(.(2+2) + y)

    ## 4 + y

    call("+", 2+2, quote(y))

    ## 4 + y

    ```


    However, once you start creating expressions with many nested calls (and you don’t
    need particularly complex expressions to need multiple nested calls), then explicitly
    creating calls becomes much more cumbersome than using `bquote`.


    ```

    bquote((.(2+2) + x) * y)

    ## (4 + x) * y

    call("*", call("(", call("+", 2+2, quote(x))), quote(y))

    ## (4 + x) * y

    ```


    ## Parsing and Deparsing


    When you use quoting to construct expressions, you get objects you can manipulate
    via recursive functions, but you can also work with expressions as strings and
    translate between strings and expressions using the functions `parse` and `deparse`.


    The `deparse` function translates an expression into the R source code that would
    be used to create the expression (represented as a string), and the `parse` function
    parses a string or a file and returns the expressions in it.


    ```

    deparse(quote(x + y))

    ## [1] "x + y"

    parse(text = "x + y")

    ## expression(x + y)

    ```


    For the call to `parse` here, you need to specify that you are parsing a text
    string. Otherwise, `parse` will assume you are giving it a file name and try to
    parse the content of that file. The result of the call to `parse` is not, strictly
    speaking, an expression. However, the type it writes is `expression`. That is
    an unfortunate choice for this type because `expression` objects are actually
    lists of expressions. The `parse` function can parse more than one expression,
    and sequences of expressions are represented in the `expression` type. You can
    get the actual expressions by indexing into this object.


    ```

    (expr <- parse(text = "x + y; z * x"))

    ## expression(x + y, z * x)

    expr[[1]]

    ## x + y

    expr[[2]]

    ## z * x

    ```


    The `deparse` function is often used when you need a string that represents an
    R object, for example, for a label in a plot. Many functions extract expressions
    given as arguments and use those as default labels. There, you cannot just use
    `deparse`. That would evaluate the expression you are trying to deparse before
    you turn it into a string. You need to get the actual argument, and for that,
    you need the `substitute` function.


    ```

    f <- function(x) deparse(x)

    g <- function(x) deparse(substitute(x))

    x <- 1:4; y <- x**2

    f(x + y)

    ## [1] "c(2, 6, 12, 20)"

    g(x + y)

    ## [1] "x + y"

    ```'
