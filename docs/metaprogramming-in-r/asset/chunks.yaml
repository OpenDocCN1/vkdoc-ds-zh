  trans: "\n# 链接环境的链条\n\n你已经了解了函数如何拥有捕获其定义位置的关联环境，也看到了在求值函数调用时，会有一个求值环境链接到该定义环境。你还通过父环境的链表明白了这其中的工作原理。不过到目前为止，你一直声称这条链终止于全局环境，即如果在任何嵌套作用域中都找不到变量，就会到全局环境中查找。对于你目前看到的所有示例来说，这可能确实如此，但在任何实际的\
    \ R 语言使用中，你都会加载包。你之所以能从包中找到函数，是因为这些包也位于环境链中。全局环境也有自己的父环境，当你加载包时，最后加载的包会成为全局环境的父环境，而之前加载的包则会成为新包的父环境。这既解释了你是如何在已加载的包中找到变量的，也解释了为什么加载新包可能会遮蔽其他包中定义的变量。\n\
    \n当然，这条链必须在某个点终止，有一个特殊的环境起到了终结序列的作用。这被称为空环境，它是唯一没有父环境的环境。当你启动 R 时，空环境就已存在。然后 R\
    \ 会放置基础环境，所有基础语言功能都在其中。接着会放置一个 `Autoload` 环境，负责按需加载数据，而在这之上，会放置全局环境。基础环境和空环境非常重要，因此你有专门的函数来获取它们。这两个函数分别是\
    \ `baseenv()` 和 `emptyenv()`。\n\n当你导入包，或者通常来说是附加一个命名空间时，它会被放置在这个列表的全局环境下方。`search()`\
    \ 函数会为你列出从全局环境向下的环境序列。你可以通过以下示例看到加载库是如何影响这个列表的：\n\n```\nsearch()\n##  [1] \".GlobalEnv\"\
    \n##  [2] \"package:ggplot2\"\n##  [3] \"package:purrr\"\n##  [4] \"package:microbenchmark\"\
    \n##  [5] \"package:pryr\"\n##  [6] \"package:magrittr\"\n##  [7] \"package:knitr\"\
    \n##  [8] \"package:stats\"\n##  [9] \"package:graphics\"\n## [10] \"package:grDevices\"\
    \n## [11] \"package:utils\"\n## [12] \"package:datasets\"\n## [13] \"Autoloads\"\
    \n## [14] \"package:base\"\nlibrary(MASS)\nsearch()\n##  [1] \".GlobalEnv\"\n\
    ##  [2] \"package:MASS\"\n##  [3] \"package:ggplot2\"\n##  [4] \"package:purrr\"\
    \n##  [5] \"package:microbenchmark\"\n##  [6] \"package:pryr\"\n##  [7] \"package:magrittr\"\
    \n##  [8] \"package:knitr\"\n##  [9] \"package:stats\"\n## [10] \"package:graphics\"\
    \n## [11] \"package:grDevices\"\n## [12] \"package:utils\"\n## [13] \"package:datasets\"\
    \n## [14] \"Autoloads\"\n## [15] \"package:base\"\n```\n\n`search()` 函数是一个内置函数，但你可以编写自己的版本来感受它的工作方式。不过，`search()`\
    \ 是从全局环境开始搜索的，而你的函数会更通用，允许你指定一个起始环境。你只需要让它打印出环境名称，然后从当前环境移动到父环境，直到遇到空环境为止。\n\n\
    要获取环境的名称，你可以使用 `environmentName()` 函数。并非所有环境都有名称；当你嵌套或调用函数时创建的环境，或者使用 `new.env()`\
    \ 创建的环境，都没有名称。但是，加载包时创建的环境是有名称的。如果一个环境没有名称，`environmentName()` 会返回一个空字符串。在这种情况下，你可以改用\
    \ `str()` 来获取一个可打印的环境表示。\n\n要检查是否已到达环境链的末尾，你可以检查 `identical(env, emptyenv())`。你不能用\
    \ `==` 来比较两个环境，但可以使用 `identical()`。你的函数可能如下所示：\n\n```\nmy_search <- function(env)\
    \ {\nrepeat {\nname <- environmentName(env)\nif (nchar(name) != 0)\nname <- paste0(name,\
    \ \"\\n\")\nelse\nname <- str(env, give.attr = FALSE)\ncat(name)\nenv <- parent.env(env)\n\
    if (identical(env, emptyenv())) break\n}\n}\n```\n\n以全局环境作为参数调用该函数，应该会得到与 `search()`\
    \ 类似的结果，只不过你是打印环境，而不是返回一个名称列表。\n\n```\nmy_search(globalenv())\n## R_GlobalEnv\n\
    ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
    ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
    ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n##\
    \ base\n```\n\n由于你可以将任何环境传递给它，因此可以尝试获取某个函数的环境。如果你编写一个嵌套在其他函数作用域中的函数，你会看到这些函数拥有（无名的）环境。\n\
    \n```\nf <- function() {\nmy_search(environment())\n}\nf()\n## \n## \n## R_GlobalEnv\n\
    ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
    ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
    ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n##\
    \ base\n```\n\n你也可以获取导入函数的环境。例如，你可以像这样获取从 `ls()` 函数开始的环境链：\n\n```\nmy_search(environment(ls))\n\
    ## base\n## R_GlobalEnv\n## package:MASS\n## package:ggplot2\n## package:purrr\n\
    ## package:microbenchmark\n## package:pryr\n## package:magrittr\n## package:knitr\n\
    ## package:stats\n## package:graphics\n## package:grDevices\n## package:utils\n\
    ## package:datasets\n## Autoloads\n## base\n```\n\n这里你看到了一些有点奇怪的现象。看起来 `base`\
    \ 在列表的顶部和底部都出现了。显然，这不能是同一个环境；因为一个环境需要同时将全局环境和它的父环境作为父环境，而每个环境只能有一个父环境。看起来像是同一个环境的唯一原因是，`environmentName()`\
    \ 为两个不同的环境返回了相同的名称。它们实际上是不同的。\n\n```\nenvironment(ls)\n## <environment: namespace:base>\n\
    baseenv()\n## <environment: base>\n```\n\n`ls()` 的环境是由 `base` 包定义的一个命名空间。`baseenv()`\
    \ 环境是这个包如何被导出到全局环境之下的环境，使得基础函数在 `base` 包之外也可以使用。\n\n拥有这些额外的环境，正是包能够在包内拥有私有函数，同时拥有导出给包用户的其他函数的方式。`base`\
    \ 包比较特殊，它只定义了两个环境：包的命名空间和包环境。所有其他包在全局环境之前的环境链中都设置了三个环境：包命名空间、一个包含导入符号的命名空间，以及基础环境（正如你刚才看到的，它连接到全局环境）。图\
    \ 3-1 展示了加载了三个包时的环境图：`MASS`、`stats` 和 `graphics`（这里先加载了 `graphics`，然后是 `stats`，最后是\
    \ `MASS`，因此在从全局环境到基础环境的路径上，`MASS` 首先出现，接着是 `stats`，然后是 `graphics`）。实线箭头表示环境的父指针，虚线箭头表示哪些包的符号被导出到了包环境中。\n\
    \n![A449887_1_En_3_Fig1_HTML.gif](img/A449887_1_En_3_Fig1_HTML.gif)\n\n**图 3-1.**\
    \ 加载了三个包（MASS、stats 和 graphics）时的环境示意图\n"
- fmt: "如果你尝试从全局环境访问包中的符号，则只能访问导出的函数，且其中一些可能被你加载的其他包所遮蔽。对于包内定义的函数，其父环境包含包中定义的所有函数（及其他变量）；由于这个包命名空间环境位于全局环境之前，当你执行包中的函数时，其他包中的变量不会遮蔽包内的变量。\n\
    \n如果某个包导入了其他包，这些导入会进入“导入环境”，位于包命名空间之下、基础环境之上。因此，包内的函数可以看见导入的符号，但仅当它们在包内未被遮蔽时。如果包的用户导入了其他包，这些导入不会遮蔽包函数所能看见的任何符号，因为从包内部来看，这些导入在环境链中位于更靠后的位置。在导入环境之后是基础命名空间。这使得所有包都能访问基本的\
    \ R 功能，即使其中部分功能从全局环境看可能被遮蔽了。[²](#A449887_1_En_3_Chapter.html#Fn2)\n\n在`DESCRIPTION`文件中，有三种方式指定一个包依赖另一个包：`Suggests:`、`Depends:`和`Imports:`。第一种实际上并不建立任何依赖关系；它只是建议其他可能增强被定义包功能的包。\n\
    \n`Depends:`指令中指定的包，在加载当前包时会被加载到搜索路径中。对于这里指定的包，你会污染全局命名空间（并非全局环境，而是其下方的搜索路径），并且你依赖的函数可能会被之后加载到全局命名空间中的包所遮蔽。只要可能，应避免使用`Depends:`。\n\
    \n使用`Imports:`时，你只需确保一组其他包在安装你自己的包之前已经安装。然而，这些包既不会被放入搜索路径，也不会被导入到“导入环境”中。使用`Imports:`仅仅允许你通过包命名空间前缀来访问另一个包中的函数和数据；因此，如果你使用`Imports:`导入`stats`包，你就可以保证在用户使用你的包时，`stats::sd`是可用的。\n\
    \n要将变量实际导入到`imports`命名空间，你需要修改`NAMESPACE`文件；分别使用以下指令来导入整个包、函数、S4类以及S4方法：\n\n*\
    \   `imports()`\n*   `importFrom()`\n*   `importClassesFrom()`\n*   `importMethodsFrom()`\n\
    \n不过，处理`NAMESPACE`文件最简单的方法是使用`Roxygen`，你可以通过以下方式导入名称：\n\n*   `@import <package>`\n\
    *   `@importFrom <package> <name>`\n*   `@importClassesFrom <package> <classes>`\n\
    *   `@importMethodsFrom <package> <methods>`\n\n为了确保你编写的包与其他命名空间良好协作，对于绝对需要的依赖应使用`Imports:`（对于其他依赖则使用`Suggests:`），并要么对其他包中的依赖使用包名前缀，要么在`NAMESPACE`中导入这些依赖。\n\
    \n函数`sd`位于包`stats`中。其父环境是`namespace:stats`，祖父环境是`imports:stats`，曾祖父环境是`namespace:base`。然而，如果你从全局环境访问`sd`，你会在`package:stats`中找到它。\n\
    \n```\nmy_search(environment(sd))\n## stats\n## imports:stats\n## base\n## R_GlobalEnv\n\
    ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
    ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
    ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n##\
    \ base\nenvironment(sd)\n## \nparent.env(environment(sd))\n## \n## attr(,\"name\"\
    )\n## [1] \"imports:stats\"\nparent.env(parent.env(environment(sd)))\n## \nparent.env(parent.env(parent.env(environment(sd))))\n\
    ## \n```\n\n图 3-2 展示了`ls`和`sd`如何位于包环境和命名空间环境中，以及它们的父环境是命名空间而非包环境。\n\n![A449887_1_En_3_Fig2_HTML.gif](A449887_1_En_3_Fig2_HTML.gif)\n\
    \n图 3-2. 展示`stats::sd`和`base::ls`位置的环境关系图\n\n正如你现在所见，这种简单的环境链机制不仅为函数提供了词法作用域，也解释了包中的命名空间是如何工作的。"
  raw: "If you try to access a symbol from a package, starting in the global environment,\
    \ then you get access only to the exported functions, and some of these might\
    \ be overshadowed by other packages you have loaded. For functions defined inside\
    \ the package, their parent environment contains all the functions (and other\
    \ variables) defined in the package, and because this package namespace environment\
    \ sits before the global environment in the chain, variables from other packages\
    \ do not overshadow variables inside the package when you execute functions from\
    \ the package.\n\nIf a package imports other packages, these go into the import\
    \ environment, below the package namespace and before the base environment. So,\
    \ functions inside a package can see imported symbols, but only if they aren’t\
    \ overshadowed inside the package. If a user of the package imports other packages,\
    \ these cannot overshadow any symbols the package functions can see, since such\
    \ imports come later in the environment chain, as seen from inside the package.\
    \ After the imports environment comes the base namespace. This gives all packages\
    \ access to the basic R functionality, even if some of it should be overshadowed\
    \ as seen from the global environment.[²](#A449887_1_En_3_Chapter.html#Fn2)\n\n\
    There are three ways of specifying that a package depends on another in the `DESCRIPTION`\
    \ file: using `Suggests` `:`, `Depends` `:`, and `Imports` `:`. The first doesn’t\
    \ actually set up any dependencies; it is just a suggestion of other packages\
    \ that might enhance the functionality of the one being defined.\n\nThe packages\
    \ specified in the `Depends` `:` directive will be loaded into the `search` path\
    \ when you load the package. For packages specified here, you will clutter up\
    \ the global namespace—not the global environment but the search path below it—and\
    \ you risk that functions you depend on will be overshadowed by packages that\
    \ are loaded into the global namespace later. You should avoid using `Depends:`\
    \ when you can, for these reasons.\n\nUsing `Imports` `:`, you just require that\
    \ a set of other packages are installed before your own package can be installed.\
    \ Those packages, however, are not put on the search path, nor are they imported\
    \ in the `imports` environment. Using `Imports:` just enables you to access functions\
    \ and data in another package using the package namespace prefix, so if you use\
    \ `Imports:` to import the `stats` package, you know you can access `stats::sd`\
    \ because that function is guaranteed to exist on the installation when your package\
    \ is used.\n\nWhen actually importing variables into the `imports` namespace,\
    \ you need to modify the `NAMESPACE` file; you use the following directives for\
    \ importing an entire package, functions, S4 classes, and S4 methods, respectively:\n\
    \n*   `imports()`\n*   `importFrom()`\n*   `importClassesFrom()`\n*   `importMethodsFrom()`\n\
    \nThe easiest way to handle the `NAMESPACE` file, though, is to use `Roxygen`,\
    \ and here you can import names using the following:\n\n*   `@import <package>`\n\
    *   `@importFrom <package> <name>`\n*   `@importClassesFrom <package> <classes>`\n\
    *   `@importMethodsFrom <package> <methods>`\n\nTo ensure that packages you write\
    \ play well with other namespaces, you should use `Imports:` for dependencies\
    \ you absolutely need (and `Suggests:` for other dependencies) and either use\
    \ the package prefixes for dependencies in other packages or import the dependencies\
    \ in the `NAMESPACE`.\n\nThe function `sd` sits in the package `stats` . Its parent\
    \ is `namespace:stats`, its grandparent is `imports:stats`, and its great-grandparent\
    \ is `namespace:base`. If you access `sd` from the global environment, though,\
    \ you find it in `package:stats`.\n\n```\nmy_search(environment(sd))\n## stats\n\
    ## imports:stats\n## base\n## R_GlobalEnv\n## package:MASS\n## package:ggplot2\n\
    ## package:purrr\n## package:microbenchmark\n## package:pryr\n## package:magrittr\n\
    ## package:knitr\n## package:stats\n## package:graphics\n## package:grDevices\n\
    ## package:utils\n## package:datasets\n## Autoloads\n## base\nenvironment(sd)\n\
    ## \nparent.env(environment(sd))\n## \n## attr(,\"name\")\n## [1] \"imports:stats\"\
    \nparent.env(parent.env(environment(sd)))\n## \nparent.env(parent.env(parent.env(environment(sd))))\n\
    ## \n```\n\nFigure [3-2](#A449887_1_En_3_Chapter.html#Fig2) shows how both `ls`\
    \ and `sd` sit in package and namespace environments and how their parents are\
    \ the namespace rather than the package environment.\n\n![A449887_1_En_3_Fig2_HTML.gif](A449887_1_En_3_Fig2_HTML.gif)\n\
    \nFigure 3-2.\n\nEnvironment graph showing the positions of stats::sd and base::ls\n\
    \nAs you now see, this simple way of chaining environments not only gives you\
    \ lexical scope in functions but also explains how namespaces in packages work."
  trans: "\n如果你尝试从全局环境访问包中的符号，则只能访问导出的函数，且其中一些可能被你加载的其他包所遮蔽。对于包内定义的函数，其父环境包含包中定义的所有函数（及其他变量）；由于这个包命名空间环境位于全局环境之前，当你执行包中的函数时，其他包中的变量不会遮蔽包内的变量。\n\
