- fmt: '### Substituting Function Arguments


    Function arguments are passed as unevaluated promises, but the second you access
    them, they get evaluated. If you want to get hold of the promises without evaluating
    them, you can use the `substitute` function. This gives you the argument as an
    unevaluated—or quoted—expression.


    This can be useful if you want to manipulate expressions or evaluate them in ways
    different from the norm (as you will explore in the next section), but you do
    throw away information about which context the expression was supposed to be evaluated
    in. Consider the following example:


    ```

    f <- function(x) function(y = x) substitute(y)

    g <- f(2)

    g()

    ## x

    x <- 4

    g(x)

    ## x

    ```


    In the first call to `g`, `y` has its default parameter, which is the one it gets
    from its closure, so it substitutes to the `x` that has the value 2. In the second
    call, however, you have the expression `x` from the global environment where `x`
    is 4. In both cases, you just have the expression `quote(x)`. From inside R, there
    is no mechanism for getting the environment out of a promise, so you cannot write
    code that modifies input expressions and then evaluates them in the enclosing
    scope for default parameters and the calling scope for function arguments.


    You also have to be a little careful when you use `substitute` in functions that
    are called with other functions. The expression you get when you `substitute`
    is the exact expression a function gets called with. This expression doesn’t propagate
    through other functions. In the following example, you call the function `g` with
    the expression `x + y`, but since `g` calls `f` with `expr`, that is what you
    get in the substitution.


    ```

    f <- function(expr) substitute(expr)

    f(x + y)

    ## x + y

    g <- function(expr) f(expr)

    g(x + y)

    ## expr

    x <- 2; y <- 3

    eval(f(x + y))

    ## [1] 5

    eval(g(x + y))

    ## x + y

    ```


    The `substitute` function is harder to use safely and correctly than using `bquote`
    and explicitly modifying `call` objects, but it is the function you need to use
    to implement nonstandard evaluation.


    ## Nonstandard Evaluation


    Nonstandard evaluation refers to any evaluation that doesn’t follow the rules
    for how you evaluate expressions in the local evaluation environment. When you
    use `eval` to evaluate a function argument in an environment other than the default
    (which is what you get from a call to `environment()`), you are evaluating an
    expression in a nonstandard way.


    Typical uses of nonstandard evaluation (NSE) are evaluating expressions in the
    calling scope, which you have already seen examples of, and evaluating expressions
    in data frames. You have already seen that you can use a list to provide a variable
    to value mapping when using `substitute`, but you can also do the same when using
    `eval`.


    ```

    eval(quote(x + y), list(x = 2, y = 3))

    ## [1] 5

    ```


    Since a data frame is just a list of vector elements of the same length, you can
    also evaluate expressions in the context of data frames.


    ```

    d <- data.frame(x = 1:2, y = 3:3)

    eval(quote(x + y), d)

    ## [1] 4 5

    ```


    When you use `eval` this way, where you explicitly quote the expression, you are
    not really doing NSE. The quoted expression would not be evaluated in any other,
    standard way. After all, you explicitly quote it, and if you didn’t quote it here,
    `x+y` would be evaluated in the calling scope, not inside the data frame.


    ```

    x <- 2; y <-  3

    eval(x + y, d)

    ## [1] 5

    ```


    To do NSE, you have to explicitly substitute an argument, so you do not evaluate
    the argument-promise in the calling scope and then evaluate it in an alternative
    scope. For example, you can implement your own version of the `with` function
    like this:


    ```

    my_with <- function(df, expr) {

    eval(substitute(expr), df)

    }

    d <- data.frame(x = rnorm(5), y = rnorm(5))

    my_with(d, x + y)

    ## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309

    ## [5]  1.8495491

    ```


    Here, the expression `x + y` is not quoted in the function call, so normally you
    would expect `x + y` to be evaluated in the calling scope. Because you explicitly
    use `substitute` to swap in the argument in `my_with`, this does not happen. Instead,
    you evaluate the expression in the context of the data frame. This is nonstandard
    evaluation.


    The real `with` function works a little better than your version. If the expression
    you evaluate contains variables that are not found in the data frame, then it
    takes these variables from the calling scope. Your version can also handle variables
    that do not appear in the data frame, but it works slightly differently.


    If you use the two functions in the global scope, you don’t see a difference.


    ```

    z <- 1

    with(d, x + y + z)

    ## [1] -0.4437635  1.9121930 -0.8908632  0.7843691

    ## [5]  2.8495491

    my_with(d, x + y + z)

    ## [1] -0.4437635  1.9121930 -0.8908632  0.7843691

    ## [5]  2.8495491

    ```


    However, if you use them inside functions, you do.


    ```

    f <- function(z) with(d, x + y + z)

    f(2)

    ## [1] 0.5562365 2.9121930 0.1091368 1.7843691

    ## [5] 3.8495491

    g <- function(z) my_with(d, x + y + z)

    g(2)

    ## [1] -0.4437635  1.9121930 -0.8908632  0.7843691

    ## [5]  2.8495491

    ```


    What is going on here?


    Well, `eval` takes a third argument that gives the enclosing scope for the evaluation.
    In `my_with` you haven’t provided this, so you use the default value, which is
    the enclosing scope where you call `eval`, which is the evaluating environment
    of `my_with`. You haven’t defined `z` in this environment, but the enclosing scope
    includes the global environment where you have defined `z`. When you evaluate
    the expression in `my_with`, you find `z` in the global environment. In contrast,
    when you use `with`, the enclosing environment is the calling environment.


    You can change `my_with` to have the same behavior thusly:


    ```

    my_with <- function(df, expr) {

    eval(substitute(expr), df, parent.frame())

    }

    f <- function(z) with(d, x + y + z)

    f(2)

    ## [1] 0.5562365 2.9121930 0.1091368 1.7843691

    ## [5] 3.8495491

    g <- function(z) my_with(d, x + y + z)

    g(2)

    ## [1] 0.5562365 2.9121930 0.1091368 1.7843691

    ## [5] 3.8495491

    ```


    Now, you have both typical uses of NSE: evaluating in a data frame and evaluating
    in the calling scope.'
