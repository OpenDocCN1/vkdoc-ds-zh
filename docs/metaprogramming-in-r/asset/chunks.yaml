    ## 自动微分


    作为第二个仅略复杂的示例，我们考虑自动微分，即自动将计算表达式的函数转换为计算其导数的函数。我假设你有一个函数，其函数体只包含一个表达式——不涉及控制结构或语句序列，仅是一个算术表达式——然后递归遍历此表达式，应用微分规则。尽管你在此元编程中所做的比刚刚实现的表达式简化更复杂，但你会发现程序的形式是相似的。


    我们从主函数开始，将其命名为`d`表示微分。它接受两个参数：待微分的函数和求导的变量。如果你希望函数能够处理内置数学函数，则需要将这些函数作为特例处理。这些函数以所谓的原始（primitive）函数形式实现，没有函数体。你需要在`d`函数中显式处理它们。对于所有其他函数，只需计算函数体中表达式的导数。如果你想返回一个新的导数函数，可以修改原函数并替换其函数体。由于R不允许修改函数参数，这将创建一个副本供返回，同时保留原函数不变。以这种方式重用参数可确保新函数与原函数具有相同的参数、名称和默认值。它还确保导数具有与原函数相同的封闭环境，这在求值时可能很重要。


    `d`函数可以如下所示，这里我只处理了三个原始函数——其余函数留作练习：


    ```

