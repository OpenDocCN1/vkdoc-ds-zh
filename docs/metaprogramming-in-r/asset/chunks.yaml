    ## Accessing the Calling Scope


    Inside a function, expressions are evaluated in the scope defined by the evaluating
    environment and its parent environment (which is the environment where the function
    was defined), except for promises provided in the function call, which are evaluated
    in the calling scope. If you want direct access to the calling environment, inside
    a function, you can get hold of it using the function `parent.frame`.[¹](#A449887_1_En_2_Chapter.html#Fn1)


    You can see this in action in this function:


    ```

    nested <- function(x) {

    function(local) {

    if (local) x

    else get("x", parent.frame())

    }

    }

    ```


    You have a function, `nested`, whose local environment knows the value of the
    parameter `x`. Inside it, you create and return a function that, depending on
    its argument, either returns the value of the argument to `nested` or looks for
    `x` in the scope where the function is called.


    ```

    f <- nested(2)

    f(TRUE)

    ## [1] 2

    x <- 1

    f(FALSE)

    ## [1] 1

    ```


    In the first call to `f`, you get the local value of `x`, the number `2`. In the
    second call to `f`, you bypass the local scope and instead find `x` in the calling
    scope, which in this case is the global environment, where you find that `x` has
    the value `1`.


    In a slightly more complicated version, you can try evaluating an expression either
    in the local evaluating environment or in the calling scope.


    ```

    nested <- function(x) {

    y <- 2

    function(local) {

    z <- 2

    expr <- expression(x + y + z)

    if (local) eval(expr)

    else eval(expr, envir = parent.frame())

    }

    }

    ```


    The logic is the same as the previous function, except in this function you define
    an expression and use `eval` to evaluate it either in the local scope or in the
    calling scope. You need to create the expression using the `expression` function;
    if you did not, the expression would be evaluated (in the local scope) before
    `eval` gets to it. As the function is defined, you can explicitly choose which
    environment to use when you evaluate the expression.


    ```

    f <- nested(2)

    x <- y <- z <- 1

    f(TRUE)

    ## [1] 6

    f(FALSE)

    ## [1] 3

    ```


    Like the previous example, you get a bit more inventive with what you can do with
    scopes, variables, and expressions. You want to write a function that lets you
    assign several variables at once from an expression, such as a function call,
    that returns a sequence of values. Rather than having to write


    ```

    x <- 1

    y <- 2

    z <- 3

    ```


    we want to be able to write the following and get the same effect:


    ```

    bind(x, y, z) <- 1:3

    ```


    You can''t quite get there because of how R deals with replacement functions (as
    it would interpret this expression to be), but you can modify the assignment operator
    to your infix function `` `%<-%` `` and get the following:


    ```

    bind(x, y, z) %<-% 1:3

    ```


    It''s maybe not the prettiest syntax, but it''s good enough as an example. You
    can, however, get even more ambitious and have this `bind` function assign to
    variables based on expressions. So, for example, the following assigns `2` to
    `x`, `4` to `y`, and `6` to `z`:


    ```

    bind(x, y = 2 * x, z = 3 * x) %<-% 2

    ```


    The first because it is a positional parameter, and the other two because you
    give them as expressions that can be evaluated once you know `x`.


    To implement this syntax, you need to define the `bind` function and the `%<-%`
    operator. Of these two, the `bind` function is the simplest.


    ```

    bind <- function(...) {

    bindings <- eval(substitute(alist(...)))

    scope <- parent.frame()

    structure(list(bindings = bindings, scope = scope),

    class = "bindings")

    }

    ```'
