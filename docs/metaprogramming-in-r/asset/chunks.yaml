    \n## Introduction\n\nWelcome to Metaprogramming in R. I am writing this book,\
    \ and my books on R programming in general, to help make more advanced teaching\
    \ material available beyond the typical introductory level most textbooks on R\
    \ have. This book covers some of the more advanced techniques used in R programming\
    \ such as fully exploiting functional programming, writing metaprograms (code\
    \ for actually manipulating the language structures), and writing domain-specific\
    \ languages to embed in R.\n\nThis book introduces metaprogramming. Metaprogramming\
    \ is when you write programs that manipulate other programs; in other words, you\
    \ treat code as data that you can generate, analyze, or modify. R is a very high-level\
    \ language where all operations are functions, and all functions are data that\
    \ you can manipulate.\n\nThere is great flexibility in how function calls and\
    \ expressions are evaluated. The lazy evaluation semantics of R mean that arguments\
    \ to functions are passed as unevaluated expressions, and these expressions can\
    \ be modified before they are evaluated, or they can be evaluated in other environments\
    \ than the context where a function is defined. This can be exploited to create\
    \ small domain-specific languages and is a fundamental component in the “tidy\
    \ verse” in packages such as `dplyr` or `ggplot2` where expressions are evaluated\
    \ in contexts defined by data frames.\n\nThere is some danger in modifying how\
    \ the language evaluates function calls and expressions, of course. It makes it\
    \ harder to reason about code. On the other hand, adding small embedded languages\
    \ for dealing with everyday programming tasks adds expressiveness to the language\
    \ that far outweighs the risks of programming confusion, as long as such metaprogramming\
    \ is used sparingly and in well-understood (and well-documented) frameworks.\n\
    \nIn this book, you will learn how to manipulate functions and expressions and\
    \ how to evaluate expressions in nonstandard ways. Prerequisites for reading this\
    \ book are familiarity with functional programming, at least familiarity with\
    \ higher-order functions, that is, functions that take other functions as an input\
    \ or that return functions.\n\n## Contents\n\n[Chapter 1: Anatomy of a Function](#A449887_1_En_1_Chapter.html)\
