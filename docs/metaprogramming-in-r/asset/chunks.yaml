    )\n## [1] \"imports:stats\"\nparent.env(parent.env(environment(sd)))\n## \nparent.env(parent.env(parent.env(environment(sd))))\n\
    ## \n```\n\n图 3-2 展示了`ls`和`sd`如何位于包环境和命名空间环境中，以及它们的父环境是命名空间而非包环境。\n\n![A449887_1_En_3_Fig2_HTML.gif](img/A449887_1_En_3_Fig2_HTML.gif)\n\
    \n图 3-2. 展示`stats::sd`和`base::ls`位置的环境关系图\n\n正如你现在所见，这种简单的环境链机制不仅为函数提供了词法作用域，也解释了包中的命名空间是如何工作的。\n"
- fmt: '# Environments and Function Calls


    How environments and package namespaces work together is interesting to understand
    and might give you some inspiration for how namespaces can be implemented for
    other uses, but in day-to-day programming, you should be more interested in how
    environments and functions work together. So from now on, I am going to pretend
    that the scope graph ends at the global environment and focus on how environments
    are chained together when you define and call functions.


    You already know the rules for this: when you call a function, you get an evaluation
    environment, its parent points to the environment in which the function was defined,
    and if you want the environment of the caller of the function, you can get it
    using the `parent.frame` function. Just to test your knowledge, though, you should
    consider a more complex example of nested functions than you have done so far.
    Consider the following code at the point where you evaluate the `i(3)` call. Figure
    [3-3](#A449887_1_En_3_Chapter.html#Fig3) shows how environments are chained together;
    here solid lines indicate parent pointers, and dashed lines are pointers from
    variables to their values. Figure [3-4](#A449887_1_En_3_Chapter.html#Fig4) adds
    the call stack as parent frame environments. Follow along in the figures while
    you go through the code.


    ![A449887_1_En_3_Fig4_HTML.gif](A449887_1_En_3_Fig4_HTML.gif)


    Figure 3-4. Environment graph for a complex example of nested functions highlighting
    the call stack as you can get it with `parent.frame`


    ![A449887_1_En_3_Fig3_HTML.gif](A449887_1_En_3_Fig3_HTML.gif)


    Figure 3-3. Environment graph for a complex example of nested functions


    ```

    f <- function(x) {

    g <- function(y, z) x + y + z

    g

    }

    h <- function(a) {

    g <- f(x)

    i <- function(b) g(a + b, 5)

    }

    x <- 2

    i <- h(1)

    i(3)

    ```


    The first two statements in the code define the functions `f` and `h`. You don’t
    call them; you just define them, so you are not creating any new environments.
    The environment associated with both functions is the global environment. Then
    you set `x` to 2. Nothing interesting happens here either. When you call `h`,
    however, you start creating new evaluation environments. You first create one
    to evaluate `h` inside. This environment sets `a` to 1 since you called `h` with
    1. It then calls `f` with `x`.


    Here is where it gets a little tricky. Since you call `f` with a variable, which
    will be lazy-evaluated inside `f`, you are not calling `f` with the value of the
    global parameter `x`. So, `f` gets a promise it can later use to get a value for
    `x`, and this promise knows that `x` should be found in the scope of the `h` call
    you are currently evaluating. That `x` happens to be the global variable in this
    example, but you could assign to a local variable `x` inside `h` after you called
    `f`, and then `f` would be using this local `x` instead. When you create a promise
    in a function call, the promise knows it should be evaluated in the calling scope,
    but it doesn’t find any variables just yet; that happens only when the promise
    is evaluated.


    Inside the call to `f`, you define the function `g` and then return it. Since
    `g` is defined inside the `f` call, its environment is set to the evaluation scope
    of the call. This will later let `g` know how to get a value for `x`. It doesn’t
    store `x` itself, but it can find it in the scope of the `f` call, where it will
    find it to be a promise that should be evaluated in the scope of the `h` call,
    where it will be found to be the global variable `x`. It already looks very complicated,
    but whenever you need a value, you should just follow the parent environment chain
    to see where you will eventually find it.


    The `h(1)` call then defines a function, `i`, and returns it, and you save that
    in the global variable `i`. The environment of this function is the evaluation
    scope of the `h(1)` call, so this is where the function will be looking for the
    names `a` and `g`.


    Now, finally, you call `i(3)`. This first creates an evaluation environment where
    you set the variable `b` to `3` since that is what the argument for `b` is. Then
    you find the `g` function, which is the closer you created earlier, and you call
    `g` with the parameters `a+b` and 5. The 5 is just passed along as a number, and
    you don’t translate constants into promises; however, the `a+b` will be lazily
    evaluated, so it is a promise in the call to `g`. Calling `g`, you create a new
    evaluation environment for it. Inside this environment, you store the variables
    `y` and `z`. The former is set to the promise `a+b` and the latter to `5`. Since
    promises should be evaluated where they are defined, here in the calling scope,
    this is stored together with the promise.


    You evaluate `g(a + b, 5)` as such: You first need to figure out what `x` is,
    so you look for it in the local evaluation environment, where you don’t find it.
    Then you look in the parent environment, where you do find it, but see that it
    is a promise from the `h(1)` environment, so you have to look there for it now.
    It isn’t there either, so you continue down the parent chain and find it in the
    global environment where it is 2. Then you need to figure out what `y` is. You
    can find `y` in the local environment where you see that it is a promise, `a+b`,
    that should be evaluated in the `i(3)` environment. Here you need to find `a`
    and `b`. You can find `b` directly in the environment, so that is easy, but you
    need to search for `a` in the parent environment. Here you find it, so you can
    evaluate `a+b` as `1+3`. This value now replaces the promise in `y`. Finally,
    you need to find `z`, but at least this is easy. That is just the number 5 stored
    in the local environment. You now have all the values you need to compute `x +
    y + z`. They are `2 + (1+3) + 5`, so when you return from the `i(3)` call, you
    get the return value 11.


    The environment graphs can get rather complicated, but the rules for finding values
    are quite simple. You just follow environment chains. The only pitfall that tends
    to confuse programmers is the lazy evaluation. Here, the rules are also simple;
    they are just not as familiar. Promises are evaluated in the scope where they
    are defined. So, a default parameter will be evaluated in the environment where
    the function is defined, and actual parameters will be evaluated in the calling
    scope. They will always be evaluated when you access a parameter, so if you don’t
    want side effects of modifying closure environments by changing variables in other
    scopes, you should use `force` before you create closures.


    Take some time to work through this example. Once you understand it, you understand
    how environments work. It doesn’t get more complicated than this (well, unless
    you start messing around with the environments!).'
