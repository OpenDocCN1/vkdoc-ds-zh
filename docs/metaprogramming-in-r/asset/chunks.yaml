  trans: "### 评估中的环境修改\n\n你之所以能在宏中修改变量，是因为可以修改环境。实际值是不可变的，但在前一个示例中修改数据框时，你实际上是将环境中指向该数据的引用替换为修改后的数据。如果其他变量引用同一个数据框，它们仍会指向原始版本。即使使用宏，你实际上也无法修改数据，但可以修改环境。由于你可以在不同于当前评估环境的环境中评估表达式，因此可以制造出在调用环境中修改数据的效果。\n\
    \n通过显式检查赋值时的评估环境，你可以观察到这一点。如果你显式创建一个环境并在其中评估赋值，就能看到该环境被修改了。\n\n```\ne <- list2env(list(x\
    \ = 2, y = 3))\neval(quote(z <- x + y), e)\nas.list(e)\n## $z\n## [1] 5\n##\n\
    ## $y\n## [1] 3\n##\n## $x\n## [1] 2\n```\n\n此环境的父环境是全局环境。不要尝试以空环境作为其父环境，否则它将无法识别\
    \ `<-` 函数。你可以看到，通过设置变量 `z`，你修改了 `e`。\n\n你也可以在列表（lists）中评估表达式，因此可以尝试相同操作：\n\n```\n\
    l <- list(x = 2, y = 3)\neval(quote(z <- x + y), l)\nl\n## $x\n## [1] 2\n##\n\
    ## $y\n## [1] 3\n```\n\n这里可以看到，列表并未被修改。你只能修改列表中的环境，虽然可以使用 `eval` 在列表中评估赋值，但实际上无法修改列表本身。\n\
    \n### 使用 `pryr` 包访问承诺（Promises）\n\n正如我之前提到的，纯 R 语言中没有机制可以直接访问承诺的内部结构。因此，如果你使用\
    \ `substitute` 将函数参数转换为其对应的表达式，就会丢失关于表达式应在哪个环境中评估的信息。不过，你可以使用 `pryr` 包来检查承诺。这个包提供了\
    \ `promise_info` 函数，它能告诉你表达式是什么以及它所属的环境。\n\n考虑以下代码：\n\n```\nlibrary(pryr)\nf <-\
    \ function(x, y) function(z = x + y) {\n  promise_info(z)\n}\ng <- f(2, 3)\ng()\n\
    ## $code\n## x + y\n## \n## $env\n## <environment: 0x7f8e4e8a6b60>\n## \n## $evaled\n\
    ## [1] FALSE\n## \n## $value\n## NULL\nx <- 2\ny <- 3\ng(x + y)\n## $code\n##\
    \ x + y\n## \n## $env\n## <environment: R_GlobalEnv>\n## \n## $evaled\n## [1]\
    \ FALSE\n## \n## $value\n## NULL\n```\n\n对于承诺，你可以从 `code` 字段获取其对应的表达式，从 `env`\
    \ 字段获取其所属的环境，以及从 `evaled` 字段获取它是否已经被评估。如果已被评估，相应的值会放在 `value` 字段中。在两次对 `g` 的不同调用中，可以看到\
    \ `code` 字段相同，但环境不同。在第一次调用中，你使用了参数 `z` 的默认值，环境是 `f` 的闭包；在第二次调用中，你使用全局环境中的表达式调用\
    \ `g`，承诺的环境也是全局环境。\n\n在以下示例中，你可以看到承诺在被评估之前和之后的区别：\n\n```\ng <- function(x, y)\
    \ function(expr = x + y) {\n  pi <- promise_info(expr)\n  cat(\"Before evaluation:\\\
    n\")\n  str(pi)\n  pi$value <- eval(expr, pi$env)\n  cat(\"After evaluation:\\\
    n\")\n  str(pi)\n}\nh <- g(4, 5)\nh()\n## Before evaluation:\n## List of 4\n##\
    \ $ code  : language x + y\n## $ env   : <environment: 0x7f8e4e8a6b60>\n## $ evaled:\
    \ logi FALSE\n## $ value : NULL\n## \n## After evaluation:\n## List of 4\n## $\
    \ code  : language x + y\n## $ env   : NULL\n## $ evaled: logi TRUE\n## $ value\
    \ : num 9\n```\n\n当你评估一个承诺时，代码不会改变，但环境会被移除。你不再需要持有一个不再需要的环境的引用。如果你是唯一持有这个环境的人，那么在不再需要它时，可以释放它以进行垃圾回收。评估承诺的结果被放入\
    \ `value` 中，并且 `evaled` 被设置为 `TRUE`。\n\n你可以利用承诺信息来修改环境，并仍然在正确的作用域中评估它。你只需要获取代码，这可以通过以下表达式实现：\n\
    \n```\neval(substitute(\n  substitute(code, list(y = quote(2 * y))),\n  list(code\
    \ = pi$code)))\n```\n\n或者通过以下表达式：\n\n```\neval(substitute(\n  substitute(expr,\
    \ list(y = quote(2 * y)))))\n```\n\n其中 `expr` 是持有承诺的参数，`pi` 是调用 `promise_info(expr)`\
    \ 的结果。这两种方式都不特别优雅，并且你必须记住由内而外地构建表达式，但这就是你能够替换持有表达式的变量中的表达式并进行修改的方法。在这两者中，传统的方法——即第二种——可能最简单。\n\
    \n在两种情况下，你都在创建以下表达式：\n\n```\nsubstitute(<expr>, list(y = quote(2 * y)))\n```\n\
    \n其中 `<expr>` 指的是承诺中的表达式，然后你评估这个表达式，将 `y` 替换为 `quote(2 * y)`。\n\n相比之下，一旦你修改了表达式，评估它就几乎微不足道了。你只需使用\
    \ `eval(expr, pi$env)` 即可。\n\n```\nf <- function(x, y) function(expr = x + y)\
    \ {\n  pi <- promise_info(expr)\n  expr <- eval(substitute(\n    substitute(expr,\
    \ list(y = quote(2 * y)))))\n  value <- eval(expr, pi$env)\n  list(expr = expr,\
    \ value = value)\n}\ng <- f(2, 2)\ng()\n## $expr\n## x + 2 * y\n##\n## $value\n\
    ## [1] 6\nx <- y <- 4\ng(x + y)\n## $expr\n## x + 2 * y\n##\n## $value\n## [1]\
    \ 12\nz <- 4\ng(z)\n## $expr\n## z\n##\n## $value\n## [1] 4\n```\n\n在替换过程中，当你创建\
    \ `expr` 时，重要的是你将 `y` 替换为 `quote(2 * y)`，而不是简单的 `2 * y`。如果你选择了后者，那么 `y` 会以标准方式被评估，并会引用封闭作用域中的\
    \ `y`，也就是传递给创建 `g` 的 `f` 调用的那个参数。当然，这可能正是你想要的：将输入表达式中的任何 `y` 替换为封闭作用域中的 `y`。在这种情况下，代码看起来会像这样：\n\
    \n```\nf <- function(x, y) function(expr = x + y) {\n  pi <- promise_info(expr)\n\
    \  expr <- eval(substitute(\n    substitute(expr, list(y = 2 * y))))\n  value\
    \ <- eval(expr, pi$env)\n  list(expr = expr, value = value)\n}\ng <- f(2, 2)\n\
    g()\n## $expr\n## x + 4\n##\n## $value\n## [1] 6\nx <- y <- 4\ng(x + y)\n## $expr\n\
    ## x + 4\n##\n## $value\n## [1] 8\nz <- 4\ng(z)\n## $expr\n## z\n##\n## $value\n\
    ## [1] 4\n```\n\n在两种情况下，你都修改了承诺中的表达式——只是修改方式不同——然后在承诺作用域中对其进行评估。在第一种情况中，如果 `y`\
    \ 出现在修改后的表达式中，它会从承诺作用域中获取；在第二种情况中，`y` 被替换为你在封闭作用域中拥有的值。\n\n**脚注** 1\n\n在 `pryr`\
    \ 包中（本章末尾会再次回到这个包），有一些用 C 语言编写的函数，它们确实提供了对承诺内部结构的访问。使用 `pryr`，你可以在需要时获取承诺的表达式及其关联环境。"
