- fmt: '# Accessing Actual Function Parameters


    You can see the difference between formal and actual parameters in the following
    example:


    ```

    f <- function(x = 1:3) {

    print(formals()$x)

    x

    }

    f(x = 4:6)

    ## 1:3

    ## [1] 4 5 6

    ```


    The `formals` give you the arguments as you gave them in the function definition,
    where `x` is set to the expression `1:3`. It is a promise, to be evaluated in
    the defining scope when you access `x` in the cases where no parameters were provided
    in the function call. So, in the `formals` list, it is not equal to the values
    1, 2, and 3; instead, it is the expression `1:3`. In the actual call, though,
    you have provided the `x` parameter, so what this function call returns is `4:6`.
    Because you return it as the result of an expression, this promise is evaluated.
    Therefore, `f` returns 4, 5, and 6.


    If you actually want the arguments passed to the current function in the form
    of the promises they are really represented as, you need to get hold of them without
    evaluating them. If you take an argument and use it as an expression, the promise
    will be evaluated. This goes for both default parameters and parameters provided
    in the function call; they are all promises that will be evaluated in different
    environments, but they are all promises nonetheless.


    One way to get the expression that the promises represent is to use the function
    `substitute`. This function, which you will get intimately familiar with in Chapter
    [4](#A449887_1_En_4_Chapter.html), substitutes into an expression the values that
    variables refer to. This means that variables are replaced by the verbatim expressions;
    the expressions are not evaluated before they are substituted into an expression.


    This small function illustrates how you can get the expression passed to a function:


    ```

    f <- function(x = 1:3) substitute(x)

    f()

    ## 1:3

    ```


    Here you see that calling `f` with default parameters gives you the expression
    `1:3` back. This is similar to the `formals` you saw earlier. You substitute `x`
    with the expression it has in its formal arguments; you do not evaluate the expression.
    You can, of course, once you have the expression


    ```

    eval(f())

    ## [1] 1 2 3

    ```


    but it isn’t done when you call `substitute`.


    ```

    f(5 * x)

    ## 5 * x

    f(foo + bar)

    ## foo + bar

    ```


    Because the substituted expression is not evaluated, you don’t even need to call
    the function with an expression that can be evaluated.


    ```

    f(5 + "string")

    ## 5 + "string"

    ```


    The substitution is verbatim. If you set up default parameters that depend on
    others, you just get them substituted with variable names; you do not get the
    value assigned to other variables.


    ```

    f <- function(x = 1:3, y = x) substitute(x + y)

    f()

    ## 1:3 + x

    f(x = 4:6)

    ## 4:6 + x

    f(y = 5 * x)

    ## 1:3 + 5 * x

    ```


    In this example, you also see that you can call `substitute` with an expression
    instead of a single variable. In addition, you see that `x` gets replaced with
    the argument given to `x`, whether default or actual, and `y` gets replaced with
    `x` as the default parameter—not the values you provide for `x` in the function
    call and with the actual argument when you provide it.


    If you try to evaluate the expression you get back from the call to `f`, you will
    not be evaluating it in the evaluation environment of `f`. That environment is
    not preserved in the substitution.


    ```

    x <- 5

    f(x = 5 * x)

    ## 5 * x + x

    eval(f(x = 5 * x))

    ## [1] 30

    ```


    The expression you evaluate is `5 * x + x`, not `5 * x + 5 * x` as it would be
    if you substituted the value of `x` into `y` (as you would if you evaluated the
    expression inside the function).


    ```

    g <- function(x = 1:3, y = x) x + y

    g(x = 5 * x)

    ## [1] 50

    ```


    A common use for `substitute` is to get the expression provided to a function
    as a string. This is used in the `plot` function, for instance, to set the default
    labels of a plot to the expressions that `plot` is called with. Here, `substitute`
    is used in combination with the `deparse` function. This function takes an expression
    and translates it into its text representation.


    ```

    f <- function(x) {

    cat(deparse(substitute(x)), "==", x)

    }

    f(2 + x)

    ## 2 + x == 7

    f(1:4)

    ## 1:4 == 1 2 3 4

    ```


    Here, you use the `deparse(substitute(x))` pattern to get a textual representation
    of the argument `f` was called with, and you use the plain `x` to get it evaluated.


    The actual type of object returned by `substitute` depends on the expression you
    give the function and what the expression’s variables refer to. If the expression,
    after variables have been substituted, is a simple type, that is what `substitute`
    returns.


    ```

    f <- function(x) substitute(x)

    f(5)

    ## [1] 5

    class(f(5))

    ## [1] "numeric"

    ```


    If you give `substitute` a local variable you have assigned to, you also get a
    value back. This is not because `substitute` does anything special here. Local
    variables like these are not promises; you evaluated an expression when you assigned
    to one.


    ```

    f <- function(x) {

    y <- 2 * x

    substitute(y)

    }

    f(5)

    ## [1] 10

    class(f(5))

    ## [1] "numeric"

    ```


    This behavior works only inside functions, though. If we call `substitute` in
    the global environment, it considers variables as names and does not substitute
    them for their values.


    ```

    x <- 5

    class(substitute(5))

    ## [1] "numeric"

    class(substitute(x))

    ## [1] "name"

    ```


    It will substitute variables for values if we give a function a simple type as
    an argument.


    ```

    f <- function(x, y = x) substitute(y)

    f(5)

    ## x

    class(f(5))

    ## [1] "name"

    f(5, 5)

    ## [1] 5

    class(f(5, 5))

    ## [1] "numeric"

    ```


    If the expression that `substitute` evaluates to is a single variable, the type
    it returns is `name`, as you just saw. For anything more complicated, `substitute`
    will return a `call` object. Even if it is an expression that could easily be
    evaluated to a simple value, `substitute` does not evaluate expressions; it just
    substitutes variables.


    ```

    f <- function(x, y) substitute(x + y)

    f(5, 5)

    ## 5 + 5

    class(f(5, 5))

    ## [1] "call"

    ```


    A `call` object refers to an unevaluated function call. In this case, you have
    the expression `5 + 5`, which is the function call `` `+`(5, 5) ``.


    Such `call` objects can also be manipulated. You can translate a `call` into a
    list to get its components, and you can evaluate it to invoke the actual function
    call.


    ```

    my_call <- f(5, 5)

    as.list(my_call)

    ## [[1]]

    ## `+`

    ##

    ## [[2]]

    ## [1] 5

    ##

    ## [[3]]

    ## [1] 5

    eval(my_call)

    ## [1] 10

    ```


    Since `substitute` doesn’t evaluate a call, you can create function call objects
    with variables you can later evaluate in different environments.


    ```

    rm(x) ; rm(y)

    my_call <- f(x, y)

    as.list(my_call)

    ## [[1]]

    ## `+`

    ##

    ## [[2]]

    ## x

    ##

    ## [[3]]

    ## y

    ```


    Here, you have created the call `x + y` but removed the global variables `x` and
    `y`, so you cannot evaluate the call.


    ```

    eval(my_call)

    ## Error in eval(expr, envir, enclos): object ''x'' not found

    ```


    You can, however, provide the variables when you evaluate the call.


    ```

    eval(my_call, list(x = 5, y = x))

    ```


    Or, you can set global variables and evaluate the call in the global environment.


    ```

    x <- 5; y <- 2

    eval(my_call)

    ## [1] 7

    ```


    You can treat a `call` as a list and modify it. The first element in a `call`
    is the function you will call, and you can replace it like this:


    ```

    (my_call <- f(5, 5))

    ## 5 + 5

    my_call[[1]] <- `-`

    eval(my_call)

    ## [1] 0

    ```


    The remaining elements in the `call` are the arguments to the function call, and
    you can modify these as well:


    ```

    my_call[[2]] <- 10

    eval(my_call)

    ## [1] 5

    ```


    You can also create `call` objects manually using the `call` function. The first
    argument to `call` is the name of the function to call, and any additional arguments
    are passed on to this function when the `call` object is evaluated.'
