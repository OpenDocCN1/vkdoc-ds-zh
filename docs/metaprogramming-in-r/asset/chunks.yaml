  trans: "\n# 后记\n\n至此，你已经了解了从 `R` 程序内部操作 `R` 语言实际构造的各种技术。操作实际语言，进行元编程，为你提供了以多种方式扩展\
    \ `R` 的工具。你可以编写用于修改其他函数的函数——就像你计算函数导数时所做的那样——或者你可以编写小型嵌入式领域特定语言来操作或查询数据框，就像在 `dplyr`\
    \ 和 `ggplot2` 中所做的那样。你知道了如何进行非标准求值，改变表达式的求值方式，以便在不同于通常求值的作用域中对它们进行求值，这通常可以简化函数在管道中的使用方式；但在编写程序时，应谨慎使用此类编程技术，因为很难推理在函数间传递的表达式。\n\
    \n你不应过度使用元编程。阅读你代码的人，大概知道如何阅读 `R` 代码，因此你不应打破他们对代码求值方式的预期。如果你开发了一个领域特定语言并为此使用元编程，这通常没问题；能够阅读你实现的语言表达式的人会知道它们的行为方式，但要谨慎使用元编程。它是一个强大的工具，但如果使用不当，也非常容易让你搬起石头砸自己的脚。\n\
