    # 构建函数


    你也可以通过拼接各个组成部分来构建新的函数。用于此目的的函数是 `as.function`。它接受一个 `alist` 作为输入，并将其中的最后一个元素解释为新函数的主体，其余元素解释为形式参数。


    ```

    f <- as.function(alist(x =, y = 2, x + y))

    f

    ## function (x, y = 2)

    ## x + y

    f(2)

    ## [1] 4

    ```


    不要试图在这里使用 `list`；它不会按你的预期工作。


    ```

    f <- as.function(list(x = 2, y = 2, x + y))

    ```


    如果你给 `as.function` 一个列表，它会将其解释为一个表达式，然后这个表达式会成为新函数的主体。在这里，如果你有全局定义的 `x` 和 `y`
    以便能够计算 `x + y`，那么你会得到一个主体为 `c(2, 2, x+y)` 的函数，其中 `x+y` 引用的是全局变量 `x` 和 `y` 的和的*值*，而不是它们的*表达式*。


    新函数的环境默认是调用 `as.function` 时的环境。因此，要创建一个闭包，你只需在另一个函数内部调用 `as.function` 即可。


    ```

    nested

    (h

    ```


    这里你在 `nested` 内部调用了 `as.function`，因此在此创建的这些函数的环境将会知道 `nested` 的参数 `z`，并能够在 `y`
    的默认值中使用它。


    不要尝试这样写：


    ```

    nested <- function(y) {

    as.function(alist(x =, y = y, x + y))

    }

    ```


    请记住，作为默认参数的表达式会在你定义的函数主体内部进行惰性求值。这里，你指定 `y` 应该求值为 `y`，这是一个循环依赖。这与 `as.function`
    无关。你在下面的定义中也会遇到同样的问题：


    ```

    nested <- function(y) {

    function(x, y = y) x + y

    }

    ```


    如果你想要类似的功能，即创建一个具有给定默认值 `y` 的函数，并且你绝对希望所创建的函数将该参数命名为 `y`，那么你需要在嵌套作用域中对表达式求值，并使用不同的名称来引用它，以避免嵌套函数的参数遮蔽它。


    ```

    nested <- function(y) {

    z <- y

    function(x, y = z) x + y

    }

    nested(2)(2)

    ## [1] 4

    ```


    如果你不希望新函数的环境是当前环境，你可以为 `as.function` 指定一个环境，以明确其定义域。在下面的例子中，你有两个用于构建闭包的函数。第一个创建的函数可以看到包围它的
    `z`，而另一个则使用了全局环境，因此根本不是闭包，所以参数 `z` 不可见。相反，全局的 `z` 是可见的。


    ```

    nested <- function(z) {

    as.function(alist(x =, y = z, x + y))

    }

    nested2 <- function(z) {

    as.function(alist(x =, y = z, x + y),

    envir = globalenv())

    }

    ```


    如果你对用这两个函数创建的函数进行求值，`nested` 创建的那个会将 `x` 与你在调用 `nested` 时提供的 `z` 值相加，而 `nested2`
    创建的那个则会忽略其输入，并在全局作用域中寻找 `z`。


    ```

    z <- -1

    nested(3)(1)

    ## [1] 4

    nested2(3)(1)

    ## [1] 0

    ```


    # 函数调用内部


    如你所见，当你执行函数主体时，你是在求值环境中进行的。这个求值环境通过其父环境链接到函数被定义的环境。它的参数存储为 promise，这些 promise
    要么在函数被定义的环境（对于默认参数）中求值，要么在函数被调用的环境（对于在该处提供给函数的参数）中求值。在上一章中，你看到了如何获取函数的形式参数、函数主体以及函数被定义的环境。在本章中，你将学习如何在函数被求值期间，从函数内部访问这些信息，以及更多其他信息。


    ## 获取当前函数的组成部分


    在上一章中，你可以通过一个函数引用来获取它的 `formals`、`body` 和 `environment`。在函数主体内部，你并没有这样的引用。函数本身并没有名称；当你将函数赋值给变量时，你是在给它们赋予名称，但这只是你拥有该名称的环境的属性，而不是函数本身的属性。你用作闭包的函数通常根本不会被赋予任何名称。那么，你如何获取当前函数来访问其组成部分呢？


    为了获取当前函数，你可以使用 `sys.function` 函数。这个函数会返回当前函数的定义，这正是你所需要的，而不是它的名称。


    你可以定义这个函数来看看 `sys.function` 是如何工作的。


    ```

    f <- function(x = 5) {

    y <- 2 * x

    sys.function()

    }

    ```


    如果你直接在提示符下输入函数名，你会得到函数定义。


    ```

    f

    ## function(x = 5) {

    ##   y <- 2 * x

    ##   sys.function()

    ## }

    ```


    由于该函数返回自身的定义，当你对它求值时，也会得到相同的结果。


    ```

    f()

    ## function(x = 5) {

    ##   y <- 2 * x

    ##   sys.function()

    ## }

    ```


    当你调用 `formals`、`body` 或 `environment` 中的任何一个时，你并非使用函数名作为第一个参数；你需要为它们每个提供一个函数引用，然后它们会从中获取函数定义。


    不过，你不需要为 `formals` 和 `body` 显式地调用 `sys.function`，因为这两个函数已经为它们的函数参数默认值使用了 `sys.function`
    的调用。如果你想获取当前函数的组成部分，你可以简单地省略掉函数参数。


    因此，要获取一个函数的形式参数，在函数主体内部，你可以直接使用不带任何参数的 `formals`。


    ```

    f <- function(x, y = 2 * x) formals()

    params <- f(1, 2)

    class(params)

    ## [1] "pairlist"

    params

    ## $x

    ##

    ##

    ## $y

    ## 2 * x

    ```


    对于当前函数的主体也是如此。


    ```

    f <- function(x, y = 2 * x) {

    z <- x - y

    body()

    }

    f(2)

    ## {

    ##     z <- x - y

    ##     body()

    ## }

    ```


    `environment` 函数的工作方式略有不同。如果你不带参数调用它，你会得到当前的（即求值）环境。


    ```

    f <- function() {

    x <- 1

    y <- 2

    z <- 3

    environment()

    }

    env <- f()

    as.list(env)

    ## $z

    ## [1] 3

    ##

    ## $y

    ## [1] 2

    ##

    ## $x

    ## [1] 1

    ```


    这不是你用 `environment(f)` 得到的结果。


    ```

    environment(f)

    ##

    ```


    `f` 函数是在全局环境中定义的，而 `environment(f)` 返回的是 `f` 被定义的环境。如果你在 `f` 内部调用 `environment()`，你会得到求值环境。局部变量
    `x`、`y` 和 `z` 可以在求值环境中找到，但它们不是 `environment(f)` 的一部分——或者说，如果它们存在，那也会是不同的全局参数。


    要从 `f` 内部获取等同于 `environment(f)` 的东西，你必须获取求值环境的父环境。你可以使用 `parent.env` 函数来获取一个环境的父环境，因此你可以像这样获取定义环境：


    ```

    f

    ```


    当你像上一章那样持有一个函数定义时，你并没有一个求值环境。那个环境只在函数被调用时才存在。一个你已定义但尚未调用的函数，拥有上一章涵盖的三个组成部分，但一个正在被积极执行的函数还有更多的组成部分。函数定义（即对函数在被调用时应做什么的描述）与函数实例化（即实际运行的代码）之间存在区别。其中一个区别就是求值环境。另一个区别是，函数实例化拥有实际参数，而函数定义只拥有形式参数。后者是函数定义的一部分；前者则由函数的调用者提供。

