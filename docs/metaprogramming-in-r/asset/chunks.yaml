- fmt: "# 1. Anatomy of a Function\n\nEverything you do in R involves defining functions\
    \ or calling functions. You cannot do any action without evaluating some function\
    \ or other. Even assigning values to variables or subscripting vectors or lists\
    \ involves evaluating functions. But functions are more than just recipes for\
    \ how to perform different actions; they are also data objects in themselves,\
    \ and there are ways of probing and modifying them.\n\n## Manipulating Functions\n\
    \nIf you define a simple function like the following, you can examine the components\
    \ it consists of:\n\n```\nf <- function(x) x\n```\n\nThere are three parts to\
    \ a function: its formal parameters, its body, and the environment it is defined\
    \ in. The functions `formals`, `body`, and `environment` give you these:\n\n```\n\
    formals(f)\n## $x\nbody(f)\n## x\nenvironment(f)\n## \n```\n\n### Formals\n\n\
    The formal parameters are given as a list where element names are the parameter\
    \ names and values are default parameters.\n\n```\ng \", parameters[[param]],\
    \ \"\\n\")\n}\n## x => 1\n## y => 2\n## z => 3\n```\n\nStrictly speaking, it is\
    \ a so-called `pairlist`, but that is an implementation detail that has no bearing\
    \ on how you treat it. You can treat it as if it is a `list`.\n\n```\ng  \", '\"\
    ', parameters[[param]], '\"', \"\\n\", sep = \"\")\n}\n## x => \"1\"\n## y =>\
    \ \"2\"\n## z => \"3\"\n```\n\nFor variables in this list that do not have default\
    \ values, the list represents the values as the empty name. This is a special\
    \ symbol that you cannot assign to, so it cannot be confused with a real value.\
    \ You cannot use the `missing` function to check for a missing value in a `formals`\
    \ function (that function is useful only inside a function call, and in any case\
    \ there is a difference between a missing parameter and one that doesn't have\
    \ a default value), but you can always check whether the value is the empty symbol.\n\
    \n```\ng  \", '\"', parameters[[param]], '\"',\n\" (\", class(parameters[[param]]),\
    \ \")\\n\", sep = \"\")\n}\n## x => \"\" (name)\n## y => \"\" (name)\n## z =>\
    \ \"3\" (numeric)\n```\n\nPrimitive functions (those that call into the runtime\
    \ system, such as `` `+` ``) do not have formals. Only functions that are defined\
    \ in R.\n\n```\nformals(`+`)\n## NULL\n```\n\n### Function Bodies\n\nThe function\
    \ body is an expression. For `f` it is a simple expression.\n\n```\nbody(f)\n\
    ## x\n```\n\nBut even multistatement function bodies are expressions. They just\
    \ evaluate to the result of the last expression in the sequence.\n\n```\ng <-\
    \ function(x) {\ny <- 2*x\nz <- x**2\nx + y + z\n}\nbody(g)\n## {\n##     y <-\
    \ 2 * x\n##     z <- x^2\n##     x + y + z\n## }\n```\n\nWhen a function is called,\
    \ R sets up an environment for it to evaluate this expression in; this environment\
    \ is called the evaluation environment for the function call. The evaluation environment\
    \ is first populated with values for the function's formal parameters, either\
    \ provided in the function call or given as default parameters, and then the body\
    \ executes inside this environment. Assignments will modify this local environment\
    \ unless you use the `<<-` operator, and the result of the function is the last\
    \ expression evaluated in the body. This is either the last expression in a sequence\
    \ or an expression explicitly given to the `return` function.\n\nWhen you just\
    \ have the body of a function as an expression, you don't get this function call\
    \ semantics, but you can still try to evaluate the expression.\n\n```\neval(body(f))\n\
    ## Error in eval(expr, envir, enclos): object 'x' not found\n```\n\nIt fails because\
    \ you do not have a variable `x` defined anywhere. If you had a global `x`, the\
    \ evaluation would use that and not any function parameter because the expression\
    \ here doesn't know it is part of a function. If we call the function, the expression\
    \ will know about the function context, of course, but not when we simply evaluate\
    \ the function body like this. You can give it a value for `x`, though, like this:\n\
    \n```\neval(body(f), list(x = 2))\n## [1] 2\n```\n\nThe `eval` function evaluates\
    \ an expression and uses the second argument to look up parameters. You can give\
    \ it an environment, and the expression will then be evaluated in it, or you can\
    \ use a list. Chapter [3](#A449887_1_En_3_Chapter.html) covers how to work with\
    \ expressions and how to evaluate them; for now all you have to know is that you\
    \ can evaluate an expression using `eval` if the variables in the expression are\
    \ either found in the scope where you call `eval` or provided in the second argument\
    \ to `eval`.\n\nYou can also set `x` as a default parameter and use that when\
    \ you evaluate the expression.\n\n```\nf <- function(x = 2) x\nformals(f)\n##\
    \ $x\n## [1] 2\neval(body(f), formals(f))\n## [1] 2\n```\n\nThings get a little\
    \ more complicated if default parameters refer to each other. This has to do with\
    \ the way the evaluation environment is set up and not so much with how expressions\
    \ are evaluated, but consider the following example where one default parameter\
    \ refers to another:\n\n```\nf <- function(x = y, y = 5) x + y\n```\n\nBoth parameters\
    \ have default values, so you can call `f` without any arguments.\n\n```\nf()\n\
    ## [1] 10\n```\n\nYou cannot, however, evaluate it just from the formal arguments\
    \ without providing values.\n\n```\neval(body(f), formals(f))\n## Error in x +\
    \ y: non-numeric argument to binary operator\n```\n\nIn `formals(f)`, `x` points\
    \ to the symbol `y`, and `y` points to the numeric 5. But `y` is not used in the\
    \ expression, and if you simply look up `x`, you just get the symbol `y`, and\
    \ you don't evaluate it further to figure out what `y` is. Therefore, you get\
    \ an error.\n\nFormal arguments are not evaluated this way when you call a function.\
    \ They are transformed into so-called promises, which are unevaluated expressions\
    \ with an associated scope. This is how the formal language definition puts it:\n\
    \n- When a function is called, each formal argument is assigned a promise in the\
    \ local environment of the call with the expression slot containing the actual\
    \ argument (if it exists) and the environment slot containing the environment\
    \ of the caller. If no actual argument for a formal argument is given in the call\
    \ and there is a default expression, it is similarly assigned to the expression\
    \ slot of the formal argument, but with the environment set to the local environment.\n\
    \nThis means that in the evaluating environment, R first assigns all variables\
    \ to these \"promises.\" The promises are placeholders for values but represented\
    \ as expressions you haven't evaluated yet. As soon as you access them, though,\
    \ they will be evaluated (and R will remember the value). For default parameters,\
    \ the promises will be evaluated in the evaluating environment, and for parameters\
    \ passed to the function in the function call, the promises will be evaluated\
    \ in the calling scope.\n\nSince all the promises are unevaluated expressions,\
    \ you don't have to worry about the order in which you assign the variables. As\
    \ long as the variables exist when you evaluate a promise, you are fine, and as\
    \ long as there are no circular dependencies between the expressions, you can\
    \ figure out all the values when you need them.\n\nDon't make circular dependencies.\
    \ Don't do something like this:\n\n```\ng <- function(x = 2*y, y = x/2) x + y\n\
    ```\n\nYou can try to make a similar setup for `f` where you build an environment\
    \ of its formals as promises. You can use the function `delayedAssign` to assign\
    \ values to promises like this:\n\n```\nfenv <- new.env()\nparameters <- formals(f)\n\
    for (param in names(parameters)) {\ndelayedAssign(param, parameters[[param]],\
    \ fenv, fenv)\n}\neval(body(f), fenv)\n## [1] 10\n```\n\nHere you assign the expression\
    \ `y` to variable `x` and the value 5 to variable `y`. Primitive values like a\
    \ numeric vector are not handled as unevaluated expressions. They could be, but\
    \ there is no point. So before you evaluate the body of `f`, the environment has\
    \ `y` pointing to 5 and `x` pointing to the expression `y`, wrapped as a promise\
    \ that says that the expression should be evaluated in `fenv` when you need to\
    \ know the value of `y`."
