  trans: '

    ### 替换函数参数


    函数参数作为未求值的 promise 传递，但一旦你访问它们，它们就会被求值。如果你希望在不求值的情况下获取这些 promise，可以使用 `substitute`
    函数。它会将参数作为未求值（或称引述）表达式返回。


    当你想要操作表达式或以不同于常规的方式求值时（你将在下一节中探索），这非常有用，但这样做会丢失关于表达式应在哪个上下文中求值的信息。考虑以下示例：


    ```

    f <- function(x) function(y = x) substitute(y)

    g <- f(2)

    g()

    ## x

    x <- 4

    g(x)

    ## x

    ```


    在第一次调用 `g` 时，`y` 使用其默认参数，即从闭包中继承的参数，因此它会替换为值为 2 的 `x`。然而在第二次调用中，你传入的是全局环境中的表达式
    `x`，此时 `x` 的值为 4。在这两种情况下，你得到的都只是表达式 `quote(x)`。从 R 语言内部来看，没有机制能从 promise 中提取环境，因此你无法编写这样的代码：修改输入表达式，然后在默认参数的封闭作用域和函数参数的调用作用域中对其求值。


    在其它函数内部调用 `substitute` 时也需要格外小心。当你使用 `substitute` 时得到的表达式，正是函数被调用时所使用的确切表达式。这个表达式不会在其它函数之间传播。在下面的示例中，你用表达式
    `x + y` 调用了函数 `g`，但由于 `g` 用 `expr` 调用了 `f`，因此替换时得到的就是 `expr`。


    ```

    f <- function(expr) substitute(expr)

    f(x + y)

    ## x + y

    g <- function(expr) f(expr)

    g(x + y)

    ## expr

    x <- 2; y <- 3

    eval(f(x + y))

    ## [1] 5

    eval(g(x + y))

    ## [1] 5

    ```


    `substitute` 函数比使用 `bquote` 和显式修改 `call` 对象更难安全、正确地使用，但它正是实现非标准求值所必需的函数。


    ## 非标准求值


    非标准求值指的是任何不遵循在本地求值环境中对表达式求值规则的求值方式。当你使用 `eval` 在默认环境（即通过调用 `environment()` 获得的环境）之外的其它环境中对函数参数求值时，你就是在以非标准方式对表达式求值。


    非标准求值的典型用途包括在调用作用域中对表达式求值（你已经看过相关示例），以及在数据框中对表达式求值。你已经知道在使用 `substitute` 时可以用列表来提供变量到值的映射，在使用
    `eval` 时同样可以这样做。


    ```

    eval(quote(x + y), list(x = 2, y = 3))

    ## [1] 5

    ```


    由于数据框本质上是一个由相同长度的向量元素组成的列表，你同样可以在数据框的上下文中对表达式求值。


    ```

    d <- data.frame(x = 1:2, y = 3:3)

    eval(quote(x + y), d)

    ## [1] 4 5

    ```


    当你以这种方式使用 `eval` 时（即显式引述表达式），其实并未真正进行非标准求值。被引述的表达式不会以任何其它标准方式进行求值。毕竟，你显式地引述了它，而如果你不在这里引述它，那么
    `x+y` 将在调用作用域内求值，而不是在数据框内部。


    ```

    x <- 2; y <-  3

    eval(x + y, d)

    ## [1] 4 5

    ```


    要进行非标准求值，你必须显式替换参数，从而避免在调用作用域中对参数 promise 求值，然后在替代作用域中对其求值。例如，你可以像这样实现你自己的 `with`
    函数版本：


    ```

    my_with <- function(df, expr) {

    eval(substitute(expr), df)

    }

    d <- data.frame(x = rnorm(5), y = rnorm(5))

    my_with(d, x + y)

    ## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309

    ## [5]  1.8495491

    ```


    在这里，表达式 `x + y` 在函数调用中并未被引述，因此通常情况下你会预期 `x + y` 在调用作用域内求值。但由于你在 `my_with` 中显式使用了
    `substitute` 来替换参数，这种情况并没有发生。相反，你是在数据框的上下文中对表达式求值。这就是非标准求值。


    真正的 `with` 函数工作得比你的版本更好一些。如果你求值的表达式包含数据框中未找到的变量，它会从调用作用域中获取这些变量。你的版本也能处理数据框中不存在的变量，但工作方式略有不同。


    如果你在全局作用域中使用这两个函数，看不出差别。


    ```

    z <- 1

    with(d, x + y + z)

    ## [1] -0.4437635  1.9121930 -0.8908632  0.7843691

    ## [5]  2.8495491

    my_with(d, x + y + z)

    ## [1] -0.4437635  1.9121930 -0.8908632  0.7843691

    ## [5]  2.8495491

    ```


    然而，如果你在函数内部使用它们，差别就显现出来了。


    ```

    f <- function(z) with(d, x + y + z)

    f(2)

    ## [1] 0.5562365 2.9121930 0.1091368 1.7843691

    ## [5] 3.8495491

    g <- function(z) my_with(d, x + y + z)

    g(2)

    ## [1] -0.4437635  1.9121930 -0.8908632  0.7843691

    ## [5]  2.8495491

    ```


    这是怎么回事？


    其实，`eval` 接受第三个参数，用于指定求值时的封闭作用域。在 `my_with` 中你没有提供这个参数，因此使用了默认值，即调用 `eval` 时的封闭作用域，也就是
    `my_with` 的求值环境。在这个环境中你没有定义 `z`，但封闭作用域包含全局环境，而你在全局环境中定义了 `z`。当你在 `my_with` 中对表达式求值时，会从全局环境中找到
    `z`。相比之下，使用 `with` 时，封闭环境是调用环境。


    你可以像这样修改 `my_with` 使其行为一致：


    ```

    my_with <- function(df, expr) {

    eval(substitute(expr), df, parent.frame())

    }

    f <- function(z) with(d, x + y + z)

    f(2)

    ## [1] 0.5562365 2.9121930 0.1091368 1.7843691

    ## [5] 3.8495491

    g <- function(z) my_with(d, x + y + z)

    g(2)

    ## [1] 0.5562365 2.9121930 0.1091368 1.7843691

    ## [5] 3.8495491

    ```


    现在，你掌握了非标准求值的两种典型用法：在数据框中求值以及在调用作用域中求值。

    '
- fmt: "### Nonstandard Evaluation from Inside Functions\n\nNonstandard evaluation\
    \ is hard to get right once you start using it from inside other functions. It\
    \ is a convenient approach to simplify the syntax for many operations when you\
    \ work with `R` interactively or when you write analysis pipelines in the global\
    \ scope, but because substitutions tend to work verbatim on the function arguments\
    \ that you give functions, once arguments get passed from one function to another,\
    \ NSE gets tricky.\n\nConsider the following example:\n\n```\nx <- 2; y <- 3\n\
    f <- function(d, expr) my_with(d, expr)\nf(d, x + y)\n## [1] 5\ng <- function(d,\
    \ expr) my_with(d, substitute(expr))\ng(d, x + y)\n## expr\n```\n\nHere, you make\
    \ two attempts at using `my_with` from inside a function, and neither works as\
    \ intended. In `f`, the `expr` gets evaluated in the global scope. When you use\
    \ the variable inside the function, the promise gets evaluated before it is passed\
    \ along to `my_with`. In `g`, you do `substitute`, but it is `substitute(expr)`\
    \ that `my_with` sees—remember, it does not see the expression as a promise but\
    \ substitutes it to get an expression—so you don’t actually get the argument substituted.\
    \ The NSE in `my_with` prevents this.\n\nIf you want functions that do NSE, you\
    \ really should write functions that work with expressions and do “normal” evaluation\
    \ on those instead. You can make a version of `my_with` that expects the expression\
    \ to be already quoted, which you can use in other functions, and then define\
    \ `my_with` to do the NSE like this:\n\n```\nmy_with_q <- function(df, expr) {\n\
    eval(expr, df, parent.frame())\n}\nmy_with <- function(df, expr) my_with_q(d,\
    \ substitute(expr))\ng <- function(d, expr) my_with_q(d, substitute(expr))\ng(d,\
    \ x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]  1.8495491\n\
    my_with(d, x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]\
    \  1.8495491\n```\n\n### Writing Macros with NSE\n\nSince NSE allows you to evaluate\
    \ expressions in the calling scope, you can use it to write macros, that is, functions\
    \ that work as shortcuts for statements where they are called. These differ from\
    \ functions, which cannot generally modify data outside of their own scope. However,\
    \ I do not recommend using macros unless you have very good reasons to—the immutability\
    \ of data is an important feature of `R`, and violating it with macros goes against\
    \ this. However, because it is a good example of what you can do with NSE, I will\
    \ include the example here.\n\nConsider the following code. This example is a\
    \ modified implementation of the macro code presented in Programmer’s Niche: Macros\
    \ in `R` ( [https://www.r-project.org/doc/Rnews/Rnews_2001-3.pdf](https://www.r-project.org/doc/Rnews/Rnews_2001-3.pdf)\
    \ ) by Thomas Lumley (R Journal, 2001). I have simplified the macro-making function\
    \ a bit; you can see the full version in the original article online.\n\n```\n\
    make_param_names <- function(params) {\nparam_names <- names(params)\nif (is.null(param_names))\n\
    param_names <- rep(\"\", length(params))\nfor (i in seq_along(param_names)) {\n\
    if (param_names[i] == \"\") {\nparam_names[i] <- paste(params[[i]])\n}\n}\nparam_names\n\
    }\nmake_macro <- function(..., body) {\nparams <- eval(substitute(alist(...)))\n\
    body <- substitute(body)\n# Construct macro\nf <- eval(substitute(\nfunction()\
    \ eval(substitute(body), parent.frame())\n))\n# Set macro arguments\nparam_names\
    \ <- make_param_names(params)\nnames(params) <- param_names\nparams <- as.list(params)\n\
    formals(f) <- params\nf\n}\n```\n\nThe first function simply extracts the names\
    \ from a list of function parameters and makes sure that all parameters have a\
    \ name. This is necessary later when you construct the `formals` list of a function.\
    \ In a `formals` list, all parameters must have a name, and you construct these\
    \ names with this function. The second function is the interesting one. Here you\
    \ construct a macro by constructing a function whose body will be evaluated in\
    \ its calling scope. You first get hold of the parameters and body the macro should\
    \ have. Then you get the parameters into a `list` by substituting `...` in and\
    \ then evaluating the `alist(...)` expression . Without the substitution you would\
    \ get the argument list that just contains `...`, but with the substitution you\
    \ get the arguments that are passed to the `make_macro` function, except for the\
    \ named argument `body` that you just translate into the expression passed to\
    \ the `make_macro` with another `substitute` call.\n\nThe function you construct\
    \ is where the magic happens. You create the expression\n\n```\nsubstitute(function()\
    \ eval(substitute(body), parent.frame()))\n```\n\nwhere `body` will be replaced\
    \ with the expression that you pass to the macro. When you evaluate this, you\
    \ get the function\n\n```\nfunction() eval(substitute(), parent.frame())\n```\n\
    \nwhere `<body>` is not the symbol `body` but the `body` expression. This is a\
    \ function that doesn’t take any arguments (yet) but will substitute variables\
    \ in `<body>` that are known in its calling scope—the `parent.frame()`—before\
    \ evaluating the resulting expression.\n\nYou can see this in action with this\
    \ small example:\n\n```\n(m \n```\n\nWhen you call `m`, it will evaluate `x +\
    \ y` in its calling scope, so you can set the variables `x` and `y` in the global\
    \ scope and evaluate it thusly:\n\n```\nx <- 2; y <- 4\nm()\n## [1] 6\n```\n\n\
    The last part of the `make_macro` code sets the formal arguments of the macro.\
    \ It simply takes the parameters you have specified, makes sure they all have\
    \ a name, and then turns them into a list and sets `formals(f)`. After that, `make_macro`\
    \ returns the constructed function.\n\nYou can use this function to create a macro\
    \ that replaces specific values in a column in a data frame with `NA` like this:\n\
    \n```\nset_NA_val <- make_macro(df, var, na_val,\nbody = df$var[df$var == na_val]\
    \ <- NA)\n```\n\nThe macro you construct takes three parameters: the data frame,\
    \ `df`; the variable (column) in the data frame, `var`; and the value that corresponds\
    \ to `NA`, `na_val`. Its body then is the following expression with `df`, `var`,\
    \ and `na_val` replaced with the arguments passed to the macro:\n\n```\ndf$var[df$var\
    \ == na_val] <- NA\n```\n\nYou can use it like this:\n\n```\n(d <- data.frame(x\
    \ = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x  y\n## 1  1  1\n## 2 -9  2\n## 3\
    \  3 -9\n## 4  4 -9\nset_NA_val(d, x, -9); d\n##    x  y\n## 1  1  1\n## 2 NA\
    \  2\n## 3  3 -9\n## 4  4 -9\nset_NA_val(d, y, -9); d\n##    x  y\n## 1  1  1\n\
    ## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\nHere, you see that the constructed\
    \ `set_NA_val` macro modifies a data frame in the calling scope. It saves some\
    \ boilerplate code from being written, but at the cost of keeping parameter values\
    \ immutable. The more traditional function solution where you return updated values\
    \ is probably much more readable to most `R` programmers.\n\n```\nset_NA_val_fun\
    \ <- function(df, var, na_val) {\ndf[df[,var] == na_val, var] <- NA\ndf\n}\n(d\
    \ <- data.frame(x = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x  y\n## 1  1  1\n\
    ## 2 -9  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d, \"x\", -9))\n##  \
    \  x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d,\
    \ \"y\", -9))\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\
    \nAlternatively, here’s the `magrittr` pipeline version:\n\n```\nlibrary(magrittr)\n\
    d % set_NA_val_fun(\"x\", -9) %>% set_NA_val_fun(\"y\", -9)\nd\n##    x  y\n##\
    \ 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```"
  raw: "### Nonstandard Evaluation from Inside Functions\n\nNonstandard evaluation\
    \ is hard to get right once you start using it from inside other functions. It\
    \ is a convenient approach to simplify the syntax for many operations when you\
    \ work with R interactively or when you write analysis pipelines in the global\
    \ scope, but because substitutions tend to work verbatim on the function arguments\
    \ that you give functions, once arguments get passed from one function to another,\
    \ NSE gets tricky.\n\nConsider the following example:\n\n```\nx <- 2; y <- 3\n\
    f <- function(d, expr) my_with(d, expr)\nf(d, x + y)\n## [1] 5\ng <- function(d,\
    \ expr) my_with(d, substitute(expr))\ng(d, x + y)\n## expr\n```\n\nHere, you make\
    \ two attempts at using `my_with` from inside a function, and neither works as\
    \ intended. In `f`, the `expr` gets evaluated in the global scope. When you use\
    \ the variable inside the function, the promise gets evaluated before it is passed\
    \ along to `my_with`. In `g`, you do substitute, but it is `substitute(expr)`\
    \ that `my_with` sees—remember, it does not see the expression as a promise but\
    \ substitutes it to get an expression—so you don’t actually get the argument substituted.\
    \ The NSE in `my_with` prevents this.\n\nIf you want functions that do NSE, you\
    \ really should write functions that work with expressions and do “normal” evaluation\
    \ on those instead. You can make a version of `my_with` that expects the expression\
    \ to be already quoted, which you can use in other functions, and then define\
    \ `my_with` to do the NSE like this:\n\n```\nmy_with_q <- function(df, expr) {\n\
    eval(expr, df, parent.frame())\n}\nmy_with <- function(df, expr) my_with_q(d,\
    \ substitute(expr))\ng <- function(d, expr) my_with_q(d, substitute(expr))\ng(d,\
    \ x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]  1.8495491\n\
    my_with(d, x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]\
    \  1.8495491\n```\n\n### Writing Macros with NSE\n\nSince NSE allows you to evaluate\
    \ expressions in the calling scope, you can use it to write macros, that is, functions\
    \ that work as shortcuts for statements where they are called. These differ from\
    \ functions, which cannot generally modify data outside of their own scope. However,\
    \ I do not recommend using macros unless you have very good reasons to—the immutability\
    \ of data is an important feature of R, and violating it with macros goes against\
    \ this. However, because it is a good example of what you can do with NSE, I will\
    \ include the example here.\n\nConsider the following code. This example is a\
    \ modified implementation of the macro code presented in Programmer’s Niche: Macros\
    \ in R ( [`https://www.r-project.org/doc/Rnews/Rnews_2001-3.pdf`](https://www.r-project.org/doc/Rnews/Rnews_2001-3.pdf)\
    \ ) by Thomas Lumley (R Journal, 2001). I have simplified the macro-making function\
    \ a bit; you can see the full version in the original article online.\n\n```\n\
    make_param_names <- function(params) {\nparam_names <- names(params)\nif (is.null(param_names))\n\
    param_names <- rep(\"\", length(params))\nfor (i in seq_along(param_names)) {\n\
    if (param_names[i] == \"\") {\nparam_names[i] <- paste(params[[i]])\n}\n}\nparam_names\n\
    }\nmake_macro <- function(..., body) {\nparams <- eval(substitute(alist(...)))\n\
    body <- substitute(body)\n# Construct macro\nf <- eval(substitute(\nfunction()\
    \ eval(substitute(body), parent.frame())\n))\n# Set macro arguments\nparam_names\
    \ <- make_param_names(params)\nnames(params) <- param_names\nparams <- as.list(params)\n\
    formals(f) <- params\nf\n}\n```\n\nThe first function simply extracts the names\
    \ from a list of function parameters and makes sure that all parameters have a\
    \ name. This is necessary later when you construct the `formals` list of a function.\
    \ In a `formals` list, all parameters must have a name, and you construct these\
    \ names with this function. The second function is the interesting one. Here you\
    \ construct a macro by constructing a function whose body will be evaluated in\
    \ its calling scope. You first get hold of the parameters and body the macro should\
    \ have. Then you get the parameters into a `list` by substituting `...` in and\
    \ then evaluating the `alist(...)` expression . Without the substitution you would\
    \ get the argument list that just contains `...`, but with the substitution you\
    \ get the arguments that are passed to the `make_macro` function, except for the\
    \ named argument `body` that you just translate into the expression passed to\
    \ the `make_macro` with another `substitute` call.\n\nThe function you construct\
    \ is where the magic happens. You create the expression\n\n```\nsubstitute(function()\
    \ eval(substitute(body), parent.frame()))\n```\n\nwhere `body` will be replaced\
    \ with the expression that you pass to the macro. When you evaluate this, you\
    \ get the function\n\n```\nfunction() eval(substitute(), parent.frame())\n```\n\
    \nwhere `<body>` is not the symbol `body` but the `body` expression. This is a\
    \ function that doesn’t take any arguments (yet) but will substitute variables\
    \ in `<body>` that are known in its calling scope—the `parent.frame()`—before\
    \ evaluating the resulting expression.\n\nYou can see this in action with this\
    \ small example:\n\n```\n(m \n```\n\nWhen you call `m`, it will evaluate `x +\
    \ y` in its calling scope, so you can set the variables `x` and `y` in the global\
    \ scope and evaluate it thusly:\n\n```\nx <- 2; y <- 4\nm()\n## [1] 6\n```\n\n\
    The last part of the `make_macro` code sets the formal arguments of the macro.\
    \ It simply takes the parameters you have specified, makes sure they all have\
    \ a name, and then turns them into a list and sets `formals(f)`. After that, `make_macro`\
    \ returns the constructed function.\n\nYou can use this function to create a macro\
    \ that replaces specific values in a column in a data frame with `NA` like this:\n\
    \n```\nset_NA_val <- make_macro(df, var, na_val,\nbody = df$var[df$var == na_val]\
    \ <- NA)\n```\n\nThe macro you construct takes three parameters: the data frame,\
    \ `df`; the variable (column) in the data frame, `var`; and the value that corresponds\
    \ to `NA`, `na_val`. Its body then is the following expression with `df`, `var`,\
    \ and `na_val` replaced with the arguments passed to the macro:\n\n```\ndf$var[df$var\
    \ == na_val] <- NA\n```\n\nYou can use it like this:\n\n```\n(d <- data.frame(x\
    \ = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x  y\n## 1  1  1\n## 2 -9  2\n## 3\
    \  3 -9\n## 4  4 -9\nset_NA_val(d, x, -9); d\n##    x  y\n## 1  1  1\n## 2 NA\
    \  2\n## 3  3 -9\n## 4  4 -9\nset_NA_val(d, y, -9); d\n##    x  y\n## 1  1  1\n\
    ## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\nHere, you see that the constructed\
    \ `set_NA_val` macro modifies a data frame in the calling scope. It saves some\
    \ boilerplate code from being written, but at the cost of keeping parameter values\
    \ immutable. The more traditional function solution where you return updated values\
    \ is probably much more readable to most R programmers.\n\n```\nset_NA_val_fun\
    \ <- function(df, var, na_val) {\ndf[df[,var] == na_val, var] <- NA\ndf\n}\n(d\
    \ <- data.frame(x = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x  y\n## 1  1  1\n\
    ## 2 -9  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d, \"x\", -9))\n##  \
    \  x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d,\
    \ \"y\", -9))\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\
    \nAlternatively, here’s the `magrittr` pipeline version:\n\n```\nlibrary(magrittr)\n\
    d % set_NA_val_fun(\"x\", -9) %>% set_NA_val_fun(\"y\", -9)\nd\n##    x  y\n##\
