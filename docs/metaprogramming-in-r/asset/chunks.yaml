  trans: '

    # 环境与函数调用


    理解环境与包命名空间如何协同工作是一件有趣的事，这或许能为你如何将命名空间应用于其他场景提供启发，但在日常编程中，你更应关注环境与函数如何协作。因此从现在开始，我将假设作用域图终止于全局环境，并聚焦于当定义和调用函数时，环境是如何链式连接的。


    你已经知道相关规则：调用函数时，会得到一个求值环境，它的父环境指向函数被定义时的环境；如果你需要获取函数调用者的环境，可以使用 `parent.frame`
    函数。不过，为了检验你的知识掌握程度，你应该考虑一个比之前更复杂的嵌套函数示例。请思考在评估 `i(3)` 调用时以下代码的状况。图 3-3 展示了环境如何链式连接；此处实线表示父级指针，虚线表示从变量指向其值的指针。图
    3-4 则添加了作为父帧环境的调用栈。请边阅读代码边对照图示。


    ![A449887_1_En_3_Fig4_HTML.gif](img/A449887_1_En_3_Fig4_HTML.gif)


    图 3-4. 嵌套函数复杂示例的环境图，突出展示了通过 `parent.frame` 获取的调用栈


    ![A449887_1_En_3_Fig3_HTML.gif](img/A449887_1_En_3_Fig3_HTML.gif)


    图 3-3. 嵌套函数复杂示例的环境图


    ```

    f <- function(x) {

    g <- function(y, z) x + y + z

    g

    }

    h <- function(a) {

    g <- f(x)

    i <- function(b) g(a + b, 5)

    }

    x <- 2

    i <- h(1)

    i(3)

    ```


    代码中的前两个语句定义了函数 `f` 和 `h`。你并未调用它们，只是定义，因此没有创建任何新环境。与这两个函数关联的环境都是全局环境。接着你将 `x` 设为
    2，这里同样没有发生什么有趣的事。然而，当你调用 `h` 时，便开始创建新的求值环境。首先，你创建一个环境来执行 `h` 内部的逻辑。由于你用参数 1 调用了
    `h`，该环境将 `a` 设为 1。接着它用 `x` 调用了 `f`。


    这里开始变得有些棘手。由于你用一个变量调用了 `f`（该变量将在 `f` 内部被惰性求值），所以你并非用全局参数 `x` 的值来调用 `f`。因此，`f`
    接收到一个承诺，它稍后可用此承诺获取 `x` 的值，并且这个承诺知道应当在当前正在评估的 `h` 调用作用域内寻找 `x`。在本例中，那个 `x` 恰好是全局变量，但你可以在调用
    `f` 之后，在 `h` 内部给局部变量 `x` 赋值，那样 `f` 就会使用这个局部变量 `x`。当你在函数调用中创建承诺时，该承诺知道它应在调用作用域内被求值，但此时它并不会立即寻找任何变量；这一过程只有在承诺被实际求值时才会发生。


    在 `f` 调用内部，你定义了函数 `g` 并将其返回。由于 `g` 是在 `f` 调用内部定义的，其环境被设置为该调用的求值作用域。这将使 `g` 之后知道如何获取
    `x` 的值。它并不存储 `x` 本身，但可以在 `f` 调用的作用域中找到它——在那里，它发现 `x` 是一个应在 `h` 调用作用域内求值的承诺，而最终在
    `h` 的作用域中，它将找到全局变量 `x`。这看起来已经非常复杂了，但无论何时你需要某个值，只需沿着父环境链查找，最终总能找到它。


    随后，`h(1)` 调用定义了一个函数 `i` 并将其返回，你将其保存在全局变量 `i` 中。该函数的环境是 `h(1)` 调用的求值作用域，因此函数会在这个作用域中查找名称
    `a` 和 `g`。


    现在，你终于调用了 `i(3)`。这首先创建了一个求值环境，将变量 `b` 设为 `3`（因为这是 `b` 对应的参数值）。接着你找到函数 `g`（即你之前创建的闭包），并用参数
    `a+b` 和 `5` 调用 `g`。`5` 只是作为一个数字直接传递，你并不会将常量转换为承诺；然而，`a+b` 会被惰性求值，因此它在调用 `g` 时是一个承诺。调用
    `g` 时，你为它创建一个新的求值环境。在这个环境中，你存储了变量 `y` 和 `z`。前者被设为承诺 `a+b`，后者被设为 `5`。由于承诺应在它们被定义的地方（即此处调用作用域内）求值，这一信息与承诺一同存储。


    你对 `g(a + b, 5)` 的求值过程如下：首先需要找出 `x` 是什么，于是你在本地求值环境中查找，但没有找到。接着你在父环境中查找，找到了它，但发现它来自于
    `h(1)` 环境的承诺，所以你现在需要到那里去找。那里也没有，于是你继续沿着父级链向下查找，最终在全局环境中找到它——值为 2。然后你需要找出 `y` 是什么。你在本地环境中找到了
    `y`，发现它是一个承诺 `a+b`，且该承诺应在 `i(3)` 环境中求值。在此环境中，你需要找到 `a` 和 `b`。`b` 可以直接在当前环境中找到，这很简单；但你需要到父环境中搜索
    `a`。你在父环境中找到了它，因此可以将 `a+b` 求值为 `1+3`。这个值现在替换了 `y` 中的承诺。最后，你需要找出 `z`，但这至少很简单，它就是本地环境中存储的数字
    `5`。现在你拥有了计算 `x + y + z` 所需的所有值，分别是 `2 + (1+3) + 5`，因此当从 `i(3)` 调用返回时，你得到返回值 11。


    环境图可能变得相当复杂，但寻找值的规则却非常简单。你只需沿着环境链查找。唯一容易让程序员困惑的陷阱就是惰性求值。不过这里的规则同样简单，只是不那么熟悉而已。承诺在它们被定义的作用域中被求值。因此，默认参数会在函数被定义时的环境中求值，而实际参数会在调用作用域中求值。当你访问一个参数时，它总会被求值，所以如果不想通过修改其他作用域的变量而对闭包环境产生副作用，你应该在创建闭包之前使用
    `force`。


    花些时间仔细研读这个示例。一旦你理解了它，你就理解了环境的工作方式。其复杂性不会超过这个程度（当然，除非你开始胡乱摆弄环境！）。

    '
- fmt: '## Manipulating Environments


    So, how can you make working with environments even more complicated? You can,
    of course, start modifying them and chaining them up in all kinds of new ways.
    You see, not only can you access environments and put variables in them, but you
    can also modify the chain of parent environments. You can, for example, change
    the environment you execute a function in by changing the parent of the evaluation
    environment like this:


    ```

    f <- function() {

    my_env <- environment()

    parent.env(my_env) <- parent.frame()

    x

    }

    g <- function(x) f()

    g(2)

    ## [1] 2

    ```


    You are not changing the local environment—that would be hard to do because you
    don’t have anywhere to put values if you don’t have that. However, you are making
    its parent point to the function call rather than the environment where the function
    was defined. If you didn’t mess with the parent environment, `x` would be searched
    for in the global environment, but because you set the parent environment to the
    parent frame, you will instead start the search in the caller where you find `x`.


    The power to modify scopes in this way can be used for good but certainly also
    for evil. There is nothing complicated in how it works; if you understood how
    environment graphs work from the previous section, you will also understand how
    they work if you start changing parent pointers. The main problem is just that
    environments are mutable, so if you start modifying them in one place, it has
    consequences elsewhere.


    Consider this example of a closure:


    ```

    f <- function() {

    my_env <- environment()

    call_env <- parent.frame()

    parent.env(my_env) <- call_env

    y

    }

    g <- function(x) {

    closure <- function(y) {

    z <- f()

    z + x

    }

    closure

    }

    add1 <- g(1)

    add2 <- g(2)

    ```


    It is just a complicated way of writing a closure for adding numbers, but you
    are not going for elegance here—you are seeing how modifying environments can
    affect you. Here you have a function `f` that sets up its calling environment
    as its scope and then returns `y`. Since `y` is not a local variable, it must
    be found in the enclosing scope with a search that starts in the parent environment;
    this is the environment you just changed to the calling scope. In the function
    `g`, you then define a closure that takes one argument, `y`, and then calls `f`
    and adds `x` to the result of the call. Since `y` is a parameter of the closure,
    `f` will be able to see it when it searches from its (modified) parent scope.
    Since `x` is not local to the closure, it will be searched for in the enclosing
    scope, where it was a parameter of the enclosing function.


    It works as you would expect it to work. Even though it is a complicated way of
    achieving this effect, there are no traps in the code.


    ```

    add1(3)

    ## [1] 4

    add2(4)

    ## [1] 6

    ```


    For reasons that will soon be apparent, I just want to show you that setting a
    global variable `x` does not change the behavior.


    ```

    x <- 3

    add1(3)

    ## [1] 4

    add2(4)

    ## [1] 6

    ```


    It also shouldn’t. When you read the definition of the closure, you can see that
    the `x` it refers to is the parameter of `g`, not a global variable.


    But now you are going to break the closure without even touching it. You just
    do one simple extra thing in `f`. Don’t just change the enclosing scope of `f`,
    and do the same for the caller of `f`. Set the parent of the caller of `f` to
    be its caller instead of its enclosing environment.


    ```

    f <- function() {

    my_env <- environment()

    call_env <- parent.frame()

    parent.env(my_env) <- call_env

    parent.env(call_env) <- parent.frame(2)

    y

    }

    ```


    You haven’t touched the closure, `g`, of the `add1` and `add2` functions. You
    have just made a small change to `f`. Now, however, if you don’t have a global
    variable for `x`, the addition functions do not work. This would give you an error.


    ```

    rm(x)

    add1(3)

    ```


    Even worse, if you do have a global variable `x`, you don’t get an error, but
    you don’t get the expected results either.


    ```

    x <- 3

    add1(3)

    ## [1] 6

    add2(4)

    ## [1] 7

    ```


    What happens here, of course, is that you change the enclosing scope of the closure
    from the `g` call to the global environment (which is the calling scope of `g`
    as well as its parent environment), so this is where you now start the search
    for `x`. The evaluation environment for the `g` call is not on the search path
    any longer.


    While you can modify environments in this way, you should need an excellent reason
    to do so. Changing the behavior of completely unrelated functions causes the worst
    kind of side effects. It is one thing to mess up your own function, but don’t
    mess up other people’s functions. Of course, you are only modifying active environments
    here. You have not permanently damaged any function; you have just messed up the
    behavior of function calls on the stack. If you want to mess up functions permanently,
    you can do so using the `environment` function as well, but doing that tends to
    be a more deliberate and thought-through choice.


    Don’t go modifying the scope of calling functions. If you want to change the scope
    of expressions you evaluate, you are better off creating new environment chains
    for this, rather than modifying existing ones. The latter solution can easily
    have unforeseen consequences, while the former at least has consequences restricted
    to the function you are writing.'
  raw: '## Manipulating Environments


    So, how can you make working with environments even more complicated? You can,
    of course, start modifying them and chaining them up in all kinds of new ways.
    You see, not only can you access environments and put variables in them, but you
    can also modify the chain of parent environments. You can, for example, change
    the environment you execute a function in by changing the parent of the evaluation
    environment like this:


    ```

    f <- function() {

    my_env <- environment()

    parent.env(my_env) <- parent.frame()

    x

    }

    g <- function(x) f()

    g(2)

    ## [1] 2

    ```


    You are not changing the local environment—that would be hard to do because you
    don’t have anywhere to put values if you don’t have that. However, you are making
    its parent point to the function call rather than the environment where the function
    was defined. If you didn’t mess with the parent environment, `x` would be searched
    for in the global environment, but because you set the parent environment to the
    parent frame, you will instead start the search in the caller where you find `x`.


    The power to modify scopes in this way can be used for good but certainly also
    for evil. There is nothing complicated in how it works; if you understood how
    environment graphs work from the previous section, you will also understand how
    they work if you start changing parent pointers. The main problem is just that
    environments are mutable, so if you start modifying them in one place, it has
    consequences elsewhere.


    Consider this example of a closure:


    ```

    f <- function() {

    my_env <- environment()

    call_env <- parent.frame()

    parent.env(my_env) <- call_env

    y

    }

    g <- function(x) {

    closure <- function(y) {

    z <- f()

    z + x

    }

    closure

    }

    add1 <- g(1)

    add2 <- g(2)

    ```


    It is just a complicated way of writing a closure for adding numbers, but you
    are not going for elegance here—you are seeing how modifying environments can
    affect you. Here you have a function `f` that sets up its calling environment
    as its scope and then returns `y`. Since `y` is not a local variable, it must
    be found in the enclosing scope with a search that starts in the parent environment;
    this is the environment you just changed to the calling scope. In the function
    `g`, you then define a closure that takes one argument, `y`, and then calls `f`
    and adds `x` to the result of the call. Since `y` is a parameter of the closure,
    `f` will be able to see it when it searches from its (modified) parent scope.
    Since `x` is not local to the closure, it will be searched for in the enclosing
    scope, where it was a parameter of the enclosing function.


    It works as you would expect it to work. Even though it is a complicated way of
    achieving this effect, there are no traps in the code.


    ```

    add1(3)

    ## [1] 4

    add2(4)

    ## [1] 6

    ```


    For reasons that will soon be apparent, I just want to show you that setting a
    global variable `x` does not change the behavior.


    ```

    x <- 3

    add1(3)

    ## [1] 4

    add2(4)

    ## [1] 6

    ```


    It also shouldn’t. When you read the definition of the closure, you can see that
    the `x` it refers to is the parameter of `g`, not a global variable.


    But now you are going to break the closure without even touching it. You just
    do one simple extra thing in `f`. Don’t just change the enclosing scope of `f`,
    and do the same for the caller of `f`. Set the parent of the caller of `f` to
    be its caller instead of its enclosing environment.


    ```

    f <- function() {

    my_env <- environment()

    call_env <- parent.frame()

    parent.env(my_env) <- call_env

    parent.env(call_env) <- parent.frame(2)

    y

    }

    ```


    You haven’t touched the closure, `g`, of the `add1` and `add2` functions. You
    have just made a small change to `f`. Now, however, if you don’t have a global
    variable for `x`, the addition functions do not work. This would give you an error.


    ```

    rm(x)

    add1(3)

    ```


    Even worse, if you do have a global variable `x`, you don’t get an error, but
    you don’t get the expected results either.


    ```

    x <- 3

    add1(3)

    ## [1] 6

    add2(4)

    ## [1] 7

    ```


    What happens here, of course, is that you change the enclosing scope of the closure
    from the `g` call to the global environment (which is the calling scope of `g`
    as well as its parent environment), so this is where you now start the search
    for `x`. The evaluation environment for the `g` call is not on the search path
    any longer.


    While you can modify environments in this way, you should need an excellent reason
    to do so. Changing the behavior of completely unrelated functions causes the worst
    kind of side effects. It is one thing to mess up your own function, but don’t
    mess up other people’s functions. Of course, you are only modifying active environments
    here. You have not permanently damaged any function; you have just messed up the
    behavior of function calls on the stack. If you want to mess up functions permanently,
    you can do so using the `environment` function as well, but doing that tends to
    be a more deliberate and thought-through choice.


    Don’t go modifying the scope of calling functions. If you want to change the scope
    of expressions you evaluate, you are better off creating new environment chains
    for this, rather than modifying existing ones. The latter solution can easily
    have unforeseen consequences, while the former at least has consequences restricted
    to the function you are writing.'
  trans: '

    ## 操控环境


    那么，如何才能让环境的使用变得更加复杂呢？当然，你可以开始修改它们，并以各种新奇的方式将它们串联起来。你看，你不仅可以访问环境并向其中放入变量，还可以修改父环境的链。例如，你可以像这样通过更改求值环境的父环境来改变函数执行时的环境：


    ```

    f <- function() {

    my_env <- environment()

    parent.env(my_env) <- parent.frame()

    x

    }

    g <- function(x) f()

    g(2)

    ## [1] 2

    ```


    你并没有更改局部环境——这很难做到，因为如果没有它，你就没有地方存放变量值。不过，你是让它的父环境指向了函数调用环境，而不是函数被定义时的环境。如果你没有篡改父环境，`x`
    会在全局环境中被查找，但由于你将父环境设置为父框架，你反而会在调用者中开始查找，从而找到 `x`。


    以这种方式修改作用域的能力可以用于正途，但无疑也可以用于邪道。其工作原理并不复杂；如果你从上一节理解了环境图是如何运作的，那么当你开始修改父指针时，你也会理解它们是如何工作的。主要问题就在于环境是可变的，因此如果你在某个地方修改它们，就会在其他地方产生连锁反应。


    考虑这个闭包的例子：


    ```

    f <- function() {

    my_env <- environment()

    call_env <- parent.frame()

    parent.env(my_env) <- call_env

    y

    }

    g <- function(x) {

    closure <- function(y) {

    z <- f()

    z + x

    }

    closure

    }

    add1 <- g(1)

    add2 <- g(2)

    ```


    这不过是编写一个数字加法闭包的复杂方式，但这里我们追求的不是优雅——而是观察修改环境会如何影响你。这里有一个函数 `f`，它将调用环境设置为自身的作用域，然后返回
    `y`。由于 `y` 不是局部变量，必须在封闭作用域中查找，查找从父环境开始；这个父环境正是你刚刚更改为调用作用域的环境。在函数 `g` 中，你定义了一个闭包，它接受一个参数
    `y`，然后调用 `f` 并将 `x` 加到调用的结果上。由于 `y` 是闭包的一个参数，`f` 从其（修改后的）父作用域中查找时就能看到它。由于 `x`
    不是闭包的局部变量，它会在封闭作用域中查找，而该变量正是封闭函数的参数。


    它的工作方式和你预期的一样。虽然达到这个效果的方法很复杂，但代码中并没有陷阱。


    ```

    add1(3)

    ## [1] 4

    add2(4)

    ## [1] 6

    ```


    出于马上就会明朗的原因，我只想向你展示，设置一个全局变量 `x` 并不会改变其行为。


    ```

    x <- 3

    add1(3)

    ## [1] 4

    add2(4)

    ## [1] 6

    ```


    这自然也是理所应当的。当你阅读闭包的定义时，可以看到它所引用的 `x` 是 `g` 的参数，而不是全局变量。


    但接下来，你要在不接触闭包本身的情况下破坏它。你只需在 `f` 中多做一件简单的事。不仅要改变 `f` 的封闭作用域，还要对 `f` 的调用者做同样的操作。将
    `f` 的调用者的父环境设置为其调用者，而不是它的封闭环境。


    ```

    f <- function() {

    my_env <- environment()

    call_env <- parent.frame()

    parent.env(my_env) <- call_env

    parent.env(call_env) <- parent.frame(2)

    y

    }

    ```


    你没有触碰闭包，即 `add1` 和 `add2` 函数中的 `g`。你只是对 `f` 做了一个小小的改动。然而现在，如果你没有为 `x` 设置全局变量，加法函数就无法工作。这会引发一个错误。


    ```

    rm(x)

    add1(3)

    ```


    更糟糕的是，如果你确实有一个全局变量 `x`，你不会遇到错误，但也不会得到预期的结果。


    ```

    x <- 3

    add1(3)

    ## [1] 6

    add2(4)

    ## [1] 7

    ```


    这里发生的情况，当然是将闭包的封闭作用域从 `g` 调用环境更改为了全局环境（这也是 `g` 的调用作用域及其父环境），所以现在你会从这里开始查找 `x`。`g`
    调用的求值环境不再处于搜索路径上。


    尽管你可以这样修改环境，但必须有充分的理由才能这么做。改变完全不相关函数的行为会导致最糟糕的副作用。搞砸自己的函数是一回事，但不要去搞乱别人的函数。当然，你在这里只是修改了活跃的环境。你并没有永久性地损害任何函数；你只是搞乱了调用栈上函数调用的行为。如果你想永久性地搞乱函数，也可以使用
    `environment` 函数来实现，但这样做通常是一个更慎重、经过深思熟虑的选择。


    不要去修改调用函数的作用域。如果你想改变所求解表达式的作用域，更好的做法是为其创建新的环境链，而不是修改已有的环境链。后者很容易产生不可预见的后果，而前者至少能将影响限制在你正在编写的函数之内。'
- fmt: "## Explicitly Creating Environments\n\nYou create a new environment with the\
    \ `new.env` function. By default, this environment will have the current environment\
    \ as its parent, and you can use functions such as `exists` and `get` to check\
    \ what it contains.\n\n```\nenv <- new.env()\nx <- 5\nexists(\"x\", env)\n## [1]\
    \ TRUE\nget(\"x\", env)\n## [1] 5\nf <- function() {\nx <- 7\nnew.env()\n}\nenv2\
    \ <- f()\nget(\"x\", env2)\n## [1] 7\n```\n\nYou can also use the `$` subscript\
    \ operator to access it, but in this case, R will not search up the parent list\
    \ to find a variable; only if a variable is in the actual environment can you\
    \ get to it.\n\n```\nenv$x\n## NULL\n```\n\nYou can assign variables to environments\
    \ using `assign` or through the `$<-` function.\n\n```\nassign(\"x\", 3, envir\
    \ = env)\nenv$x\n## [1] 3\nenv$x <- 7\nenv$x\n## [1] 7\n```\n\nDepending on what\
    \ you want to do with the environment, you might not want it to have a parent\
    \ environment. There is no way to achieve that.\n\n```\nenv <- new.env(parent\
    \ = NULL) # This won't work!\n```\n\nAll environments have a parent except the\
    \ empty environment, but you can get the next best thing by making this environment\
    \ the parent of your new one.\n\n```\nglobal_x <- \"foo\"\nenv <- new.env(parent\
    \ = emptyenv())\nexists(\"global_x\", env)\n## [1] FALSE\n```\n\nYou can try to\
    \ do something a little more interesting with manually created environments, such\
    \ as building a parallel call stack you can use to implement dynamic scoping rather\
    \ than lexical scoping. Lexical scoping is the scoping you already have in R,\
    \ where a function call's parent is the definition scope of the function. Dynamic\
    \ scope instead has the calling environment. It is terribly hard to reason about\
    \ programs in languages with dynamic scope, so I advise that you avoid them, but\
    \ for the purpose of education, you can try implementing it.\n\nSince you don't\
    \ want to mess around with the actual call stack and modify parent pointers, you\
    \ need to make a parallel sequence of environments, and you need to copy the content\
    \ of each call stack frame into these. You can copy an environment like this:\n\
    \n```\ncopy_env <- function(from, to) {\nfor (name in ls(from, all.names = TRUE))\
    \ {\nassign(name, get(name, from), to)\n}\n}\n```\n\nJust for illustration purposes,\
    \ you need a function that will show you what names you see in each environment\
    \ when moving down toward the global environment. You don't want to go all the\
    \ way down to the empty environment here, so you stop a little early. This function\
    \ lets you do that:\n\n```\nshow_env <- function(env) {\nif (!identical(env, globalenv()))\
    \ {\nprint(env)\nprint(names(env))\nshow_env(parent.env(env))\n}\n}\n```\n\nNow\
    \ comes the function for creating the parallel sequence of environments. It is\
    \ not that difficult; you can use `parent.frame` to get the frames on the call\
    \ stack arbitrarily deep—well, down to the first function call—and you can get\
    \ the depth of the call stack using the function `sys.nframe`. The only thing\
    \ you have to be careful about is adjusting the depth of the stack by 1 since\
    \ you want to create the call stack chain for the caller of the function, not\
    \ for the function itself. The rest is just a loop.\n\n```\nbuild_caller_chain\
    \ <- function() {\nn <- sys.nframe() - 1\nenv <- globalenv()\nfor (i in seq(1,n))\
    \ {\nenv <- new.env(parent = env)\nframe <- parent.frame(n - i + 1)\ncopy_env(frame,\
    \ env)\n}\nenv\n}\n```\n\nTo see it in action, you need to set up a rather convoluted\
    \ example with both nested scopes and a call stack. It doesn't look pretty, but\
    \ try to work through it and consider what the function environments must be and\
    \ what the call stack must look like.\n\n```\nf \n## [1] \"z\"\n## \n## [1] \"\
    y\"\n## \n## [1] \"x\"\n## [1] \"---Calling environments---\"\n## \n## [1] \"\
    z\"\n## \n## [1] \"x\" \"y\"\n```\n\nWhen you call `h`, it calls `g`, and you\
    \ get the list of environments starting from the innermost level where you have\
    \ a `z` and out until the outermost level, just before the global environment,\
    \ where you have the `x`. On the (parallel) call stack, you also see a `z` first\
    \ (it is in a copy of the function's environment, but it is there), but this chain\
    \ is only two steps long, and the second environment contains both `x` and `y`.\n\
    \nYou can use the stack chain you constructed here to implement dynamic scoping.\
    \ You simply need to evaluate expressions in the scope defined by this chain rather\
    \ than the current evaluating environment. The `<<-` assignment operator won't\
    \ work—it would require you to write a similar function to get that behavior,\
    \ and it would be a design choice to which degree changes made to this chain should\
    \ be moved back into the actual call stack frames. However, as long as it comes\
    \ to evaluating expressions, you can use it for dynamic scoping.\n\n## Environments\
    \ and Expression Evaluation\n\nFinally, this section covers how you combine expressions\
    \ and environments to compute values. The good news is that you are past all the\
    \ hard stuff, and it gets pretty simple after all of the previous stuff. All you\
    \ have to do to evaluate an expression in any selected environment chain is to\
    \ provide it to the `eval` function. You can see this in the following example\
    \ that evaluates the same expression in the lexical scope and the dynamic scope:\n\
    \n```\nf <- function() {\nx <- 1\nfunction() {\ny <- 2\nfunction() {\nz <- 3\n\
    cat(\"Lexical scope: \", x + y + z, \"\\n\")\ncall_env <- build_caller_chain()\n\
    cat(\"Dynamic scope: \", eval(quote(x + y + z), call_env), \"\\n\")\n}\n}\n}\n\
    g <- f()()\nh <- function() {\nx <- 4\ny <- 5\ng()\n}\nh()\n## Lexical scope:\
    \  6\n## Dynamic scope:  12\n```\n\nThe hard part of working with environments\
    \ really isn't evaluating them. It is manipulating them.\n\nFootnotes\n\nIf you\
    \ want to name your environments, you can set the attribute \"name.\" It is generally\
    \ not something you need, though.\n\nStrictly speaking, there is a lot more to\
    \ importing other packages than what I just explained here, but it's beyond the\
    \ scope of this book.\n\nIf you check the documentation for `new.env`, you will\
    \ see that the default argument is actually `parent.frame()`. If you think about\
    \ it, this is how it becomes the current environment: when you call `new.env`,\
    \ the current environment will be its parent frame."
