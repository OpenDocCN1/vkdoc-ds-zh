    \ the actual language constructs of `R` from within `R` programs. Manipulating\
    \ the actual language, doing metaprogramming, gives you the tools to extend `R`\
    \ in various ways. You can write functions for modifying other functions—as you\
    \ did with the code for computing the derivative of a function—or you can write\
    \ small embedded domain-specific languages for manipulating or querying data frames,\
    \ as done in `dplyr` and `ggplot2`. You know how to do nonstandard evaluation,\
    \ changing how expressions are evaluated so you can evaluate them in different\
    \ scopes than what they would usually be evaluated in, which can often simplify\
    \ how functions are used in pipelines; however, you should be careful with using\
    \ such programming when writing programs since it can be hard to reason about\
    \ expressions passed between functions.\n\nYou don’t want to overdo metaprogramming.\
