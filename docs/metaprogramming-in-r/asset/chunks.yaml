    instead of a single variable. In addition, you see that `x` gets replaced with
    the argument given to `x`, whether default or actual, and `y` gets replaced with
    `x` as the default parameter—not the values you provide for `x` in the function
    call and with the actual argument when you provide it.


    If you try to evaluate the expression you get back from the call to `f`, you will
    not be evaluating it in the evaluation environment of `f`. That environment is
    not preserved in the substitution.


