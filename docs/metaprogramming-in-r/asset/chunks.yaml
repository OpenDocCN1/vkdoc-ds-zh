  trans: "\n# 1. 函数的剖析\n\n你在 R 中所做的一切都涉及定义函数或调用函数。如果不求值某个函数，你无法执行任何操作。即使是将值赋给变量或对向量或列表进行下标操作，也涉及求值函数。但函数不仅仅是关于如何执行不同操作的配方；它们本身也是数据对象，并且有探查和修改它们的方法。\n\
    \n## 操作函数\n\n如果你定义一个像下面这样的简单函数，就可以检查它的组成部分：\n\n```\nf <- function(x) x\n```\n\n\
    一个函数包含三个部分：形式参数 (formal parameters)、函数体 (body) 以及它被定义的环境 (environment)。函数 `formals`、`body`\
    \ 和 `environment` 可以获取这些部分：\n\n```\nformals(f)\n## $x\nbody(f)\n## x\nenvironment(f)\n\
    ## \n```\n\n### 形式参数 (Formals)\n\n形式参数以列表形式给出，其中元素名称是参数名，值是默认参数。\n\n```\ng \"\
    , parameters[[param]], \"\\n\")\n}\n## x => 1\n## y => 2\n## z => 3\n```\n\n严格来说，它是一个所谓的“配对列表\
    \ (pairlist)”，但这是一个实现细节，对你如何处理它没有影响。你可以把它当作一个 `list` 来处理。\n\n```\ng  \", '\"',\
    \ parameters[[param]], '\"', \"\\n\", sep = \"\")\n}\n## x => \"1\"\n## y => \"\
    2\"\n## z => \"3\"\n```\n\n对于此列表中那些没有默认值的变量，该列表将其值表示为空名称。这是一个特殊的符号，你不能给它赋值，因此它不会与真实值混淆。你不能使用\
    \ `missing` 函数来检查 `formals` 函数中的缺失值（该函数仅在函数调用内部有用，并且无论如何，缺失参数与没有默认值的参数之间是有区别的），但你始终可以检查该值是否为空符号。\n\
    \n```\ng  \", '\"', parameters[[param]], '\"',\n\" (\", class(parameters[[param]]),\
    \ \")\\n\", sep = \"\")\n}\n## x => \"\" (name)\n## y => \"\" (name)\n## z =>\
    \ \"3\" (numeric)\n```\n\n原始函数 (Primitive functions) (那些调用运行时系统的函数，例如 `` `+` ``)\
    \ 没有形式参数。只有那些在 R 中定义的函数才有。\n\n```\nformals(`+`)\n## NULL\n```\n\n### 函数体 (Function\
    \ Bodies)\n\n函数体是一个表达式。对于 `f`，它是一个简单的表达式。\n\n```\nbody(f)\n## x\n```\n\n但即使是多语句的函数体也是表达式。它们只是求值为序列中最后一个表达式的结果。\n\
    \n```\ng <- function(x) {\ny <- 2*x\nz <- x**2\nx + y + z\n}\nbody(g)\n## {\n\
    ##     y <- 2 * x\n##     z <- x²\n##     x + y + z\n## }\n```\n\n当调用一个函数时，R 会为其设置一个环境来求值这个表达式；这个环境被称为该函数调用的求值环境。求值环境首先会被填充函数形式参数的值，这些值要么在函数调用中提供，要么作为默认参数给出，然后函数体在这个环境中执行。赋值操作将修改这个局部环境，除非你使用\
    \ `<<-` 运算符，而函数的结果是函数体中被求值的最后一个表达式。这要么是序列中的最后一个表达式，要么是显式传递给 `return` 函数的表达式。\n\
    \n当你只是将函数体作为一个表达式时，你无法获得这种函数调用语义，但你仍然可以尝试求值该表达式。\n\n```\neval(body(f))\n## Error\
    \ in eval(expr, envir, enclos): object 'x' not found\n```\n\n它失败了，因为你在任何地方都没有定义变量\
    \ `x`。如果你有一个全局变量 `x`，求值就会使用那个变量，而不会使用任何函数参数，因为这个表达式不知道它是函数的一部分。如果我们调用该函数，表达式当然会知道函数上下文，但当我们像这样简单地求值函数体时则不会。不过，你可以像这样为\
    \ `x` 提供一个值：\n\n```\neval(body(f), list(x = 2))\n## [1] 2\n```\n\n`eval` 函数用于求值一个表达式，并使用第二个参数来查找参数。你可以给它一个环境，然后表达式将在该环境中被求值，或者你可以使用一个列表。第\
    \ 3 章介绍了如何处理表达式以及如何求值它们；现在你只需要知道，如果表达式中的变量可以在你调用 `eval` 的作用域中找到，或者提供给 `eval` 的第二个参数中，你就可以使用\
    \ `eval` 来求值一个表达式。\n\n你还可以将 `x` 设置为一个默认参数，并在求值表达式时使用它。\n\n```\nf <- function(x\
    \ = 2) x\nformals(f)\n## $x\n## [1] 2\neval(body(f), formals(f))\n## [1] 2\n```\n\
    \n如果默认参数相互引用，事情会变得稍微复杂一些。这与求值环境的设置方式有关，而与表达式如何求值关系不大，但请考虑以下示例，其中一个默认参数引用另一个：\n\
    \n```\nf <- function(x = y, y = 5) x + y\n```\n\n两个参数都有默认值，因此你可以在不提供任何参数的情况下调用\
    \ `f`。\n\n```\nf()\n## [1] 10\n```\n\n但是，如果仅仅基于形式参数而不提供值，你是无法求值的。\n\n```\neval(body(f),\
    \ formals(f))\n## Error in x + y: non-numeric argument to binary operator\n```\n\
    \n在 `formals(f)` 中，`x` 指向符号 `y`，而 `y` 指向数值 5。但 `y` 并没有在表达式中使用，如果你只是查找 `x`，你只会得到符号\
    \ `y`，并且你不会进一步求值以找出 `y` 是什么。因此，你会得到一个错误。\n\n形式参数在调用函数时不会以这种方式求值。它们会被转换成所谓的“承诺\
    \ (promises)”，即带有相关作用域的未求值表达式。形式语言定义是这样描述的：\n\n- 当调用一个函数时，每个形式参数会在调用的局部环境中被分配一个承诺，其表达式插槽包含实际参数（如果存在），环境插槽包含调用者的环境。如果在调用中没有为某个形式参数提供实际参数，并且存在默认表达式，则该表达式类似地被分配到形式参数的表达式插槽中，但环境被设置为局部环境。\n\
    \n这意味着在求值环境中，R 首先将所有变量赋给这些“承诺”。承诺是值的占位符，但以你尚未求值的表达式形式表示。然而，一旦你访问它们，它们就会被求值（并且\
    \ R 会记住该值）。对于默认参数，承诺会在求值环境中被求值；对于在函数调用中传递给函数的参数，承诺会在调用作用域中被求值。\n\n由于所有承诺都是未求值的表达式，你不必担心变量赋值的顺序。只要在求值承诺时这些变量存在，就不会有问题；只要表达式之间没有循环依赖，你就可以在需要时找出所有值。\n\
    \n不要制造循环依赖。不要做类似这样的事情：\n\n```\ng <- function(x = 2*y, y = x/2) x + y\n```\n\n\
    你可以尝试为 `f` 建立一个类似的设置，将其形式参数构建为一个包含承诺的环境。你可以使用 `delayedAssign` 函数像这样将值赋给承诺：\n\n\
    ```\nfenv <- new.env()\nparameters <- formals(f)\nfor (param in names(parameters))\
    \ {\ndelayedAssign(param, parameters[[param]], fenv, fenv)\n}\neval(body(f), fenv)\n\
    ## [1] 10\n```\n\n这里你将表达式 `y` 赋给变量 `x`，将值 5 赋给变量 `y`。像数值向量这样的原始值不会作为未求值表达式来处理。它们可以被这样处理，但没有必要。因此，在求值\
    \ `f` 的函数体之前，环境中有 `y` 指向 5，`x` 指向表达式 `y`，后者被包装成一个承诺，表示当你需要知道 `y` 的值时，该表达式应在 `fenv`\
    \ 中被求值。\n"
- fmt: '### Function Environments


    The environment of a function is the simplest of its components. It is just the
    environment where the function was defined. This environment is used to capture
    the enclosing scope and is what makes closures possible in R. The evaluating environment
    will be set up with the function’s environment when it is created such that variables
    not found in the local environment, consisting of local variables and formal parameters,
    will be searched for in the enclosing scope.


    ## Calling a Function


    Before continuing, it might be worthwhile to see how these components fit together
    when a function is called. I explained this in some detail in Functional Programming
    in R, but it is essential to understand how expressions are evaluated. When you
    start to fiddle around with nonstandard evaluation, it becomes even more important,
    so it bears repeating.


    When expressions are evaluated, they are evaluated in an environment. Environments
    are chained in a tree structure. Each environment has a parent, and when R needs
    to look up a variable, it first looks in the current environment to see whether
    that environment holds the variable. If it doesn’t, R will look in the parent.
    If it doesn’t find it there either, it will look in the grandparent, and it will
    continue going up the tree until it either finds the variable or hits the global
    environment and sees that it isn’t there, at which point it will raise an error.
    You call the variables that an expression can find by searching this way its scope.
    Since the search always picks the first place it finds a given variable, local
    variables overshadow global variables, and while several environments on this
    parent-chain might contain the same variable name, only the innermost environment,
    the first you find, will be used.


    When a function, `f`, is created, it gets associated with `environment(f)`. This
    environment is the environment where `f` is defined. When `f` is invoked, R creates
    an evaluation environment for `f`; let’s call it `evalenv`. The parent of `evalenv`
    is set to `environment(f)`. Since `environment(f)` is the environment where `f`
    is defined, having it as the parent of the evaluation environment means that the
    body of `f` can see its enclosing scope if `f` is a closure.


    After the evaluation environment is created, the formals of `f` are added to it
    as promises. As you saw from the language definition earlier, there is a difference
    between default parameters and parameters given to the function where it is called
    in how these promises are set up. Default parameters will be promises that should
    be evaluated in the evaluation scope, `evalenv`. This means they can refer to
    other local variables or formal parameters. Since these will be put in `evalenv`
    and since `evalenv`’s parent is `environment(f)`, these promises can also refer
    to variables in the scope where `f` was defined. Expressions given to `f` where
    it is called, however, will be stored as promises that should be called in the
    calling environment. Let’s call that `callenv`. If they were evaluated in the
    `evalenv`, they would not be able to refer to variables in the scope where you
    call `f`; they would be able to refer only to local variables or variables in
    the scope where `f` was defined.


    You can see it all in action in the following example:


    ```

    enclosing <- function() {

    z <- 2

    function(x, y = x) {

    x + y + z

    }

    }

    f <- enclosing()

    calling <- function() {

    w <- 5

    f(x = 2 * w)

    }

    calling()

    ## [1] 22

    ```


    You start out in the global environment where you define `enclosing` to be a function.
    When you call `enclosing`, you create an evaluation environment in which you store
    the variable `z` and then return a function that you store in the global environment
    as `f`. Since this function was defined in the evaluation environment of `enclosing`,
    this environment is the `environment` of `f`.


    Then you create `calling`, store that in the global environment, and call it.
    This creates, once again, an evaluation environment. In this, you store the variable
    `w` and then call `f`. You don’t have `f` in the evaluation environment, but because
    the parent of the evaluation environment is the global environment, you can find
    it. When you call `f`, you give it the expression `2 * w` as parameter `x`.


    Inside the call to `f`, you have another evaluation environment. Its parent is
    the closure you got from `enclosing`. Here you need to evaluate `f`’s body: `x
    + y + z`. However, before that, the evaluation environment needs to be set up.
    Since `x` and `y` are formal parameters, they will be stored in the evaluation
    environment as promises. You provided `x` as a parameter when you called `f`,
    so this promise must be evaluated in the calling environment (the environment
    inside `calling`), while `y` has the default value, so it must be evaluated in
    the evaluation environment. In this environment, it can see `x` and `y` and through
    the parent environment `z`. You evaluate `x`, which is the expression `2 * w`
    in the calling environment, where `w` is known, and you evaluate `y` in the local
    environment, where `x` is known. So, you can get the value of those two variables
    and then get `z` from the enclosing environment.


    You can try to emulate all this using explicit environments and `delayedAssign`
    to store promises. You need three environments since you don’t need to simulate
    the global environment for this. You need the environment where the `f` function
    was defined; you call it `defenv`. Then you need the evaluating environment for
    the call to `f`, and you need the environment in which `f` is called.


    ```

    defenv <- new.env()

    evalenv <- new.env(parent = defenv)

    callenv <- new.env()

    ```


    Here, `defenv` and `calling` have the global environment as their parent, but
    you don’t need to worry about that. The evaluating environment has `defenv` as
    its parent.


    In the definition environment, you save the value of `z`.


    ```

    defenv$z <- 2

    ```


    In the calling environment, you save the value of `w`.


    ```

    callenv$w <- 5

    ```


    In the evaluation environment, you set up the promises. The `delayedAssign` function
    takes two environments as arguments. The first is the environment where the promise
    should be evaluated, and the second is where it should be stored. For `x` you
    want the expression to be evaluated in the calling environment, and for `y` you
    want it to be evaluated in the evaluation environment. Both variables should be
    stored in the evaluation environment.


    ```

    delayedAssign("x", 2 * w, callenv, evalenv)

    delayedAssign("y", x, evalenv, evalenv)

    ```


    In the `evalenv` you can now evaluate `f`.


    ```

    f <- function(x, y = x) x + y + z

    eval(body(f), evalenv)

    ## [1] 22

    ```


    There is surprisingly much going on behind a function call, but it all follows
    these rules for how arguments are passed along as promises.'
