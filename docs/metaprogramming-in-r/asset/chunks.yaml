- fmt: '您使用`eval(substitute(alist(...)))`表达式来获取函数的所有参数并放入一个配对列表中，且不对任何潜在表达式进行求值。您希望保留惰性求值特性，因为在您尝试赋值给绑定的变量之前，作为参数提供的表达式不能被求值。使用`eval(substitute(alist(...)))`可以实现这一点。`substitute`调用将函数的实际参数放入`alist(...)`表达式中，当您随后对这个表达式求值时，就会得到配对列表。您从`parent.frame`中获取应该绑定变量的作用域，然后将绑定和作用域组合成一个名为`bindings`的类。虽然不一定要将其设为类，但这并无坏处，所以您不妨这样做。


    实际工作是在`%<-%`运算符中完成的。在这里，您需要做几件事。您需要确定哪些参数绑定只是名称（此时应根据其位置分配值），哪些是需要求值的表达式。位置参数可以直接赋值，然后将其存储在您在绑定中记住的作用域中。表达式应同时具有名称和需要求值的表达式（您无法在任何作用域中直接对实际表达式赋值，因此这些表达式必须是有名称的参数）。如果表达式引用了您在`bind`调用中命名的其他参数，它们需要知道这些参数是什么，因此您需要在`bind`提供的作用域中对表达式求值。如果您赋给表达式的值有名称，您还需要能够引用它们，例如编写如下赋值语句：


    ```

    bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

    ```


    为了实现这一点，您可以将这些值转换为一个环境，并将`bind`的父作用域也作为该环境的父环境。这样，它们既可以引用您赋值的变量，也可以引用您绑定中的变量。关于表达式引用您定义的其他参数，唯一的复杂之处在于表达式求值的顺序。为了对一个表达式求值，它所引用的所有变量都必须先被赋值。因此，您似乎需要解析表达式并确定顺序——即根据表达式使用了哪些变量对表达式进行拓扑排序——但您可以通过借用函数参数求值的一个技巧来避免：惰性求值。如果您不为每个参数赋值，而是赋一个承诺，那么您就不必担心变量赋值的顺序。每当R看到对这些承诺的引用时，它会自行处理这个顺序。这意味着，如果您在访问另一个变量之前修改了某个已赋值的变量，您可能会得到函数的惰性求值行为。例如，如果执行以下操作，`y`将引用10而不是24：


    ```

    bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

    z <- 5

    ```


    为避免此问题，您可以在完成所有表达式赋值后，强制对所有表达式求值。


    整个函数如下：


    ```

    .unpack  0)

    value_env  0) force(bindings$scope[[name]])

    }

    }

    ```


    它能按预期工作。


    ```

    bind(x, y, z) %<-% 1:3

    c(x, y, z)

    ## [1] 1 2 3

    bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

    c(y, z)

    ## [1]  8 12

    bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

    c(y, z)

    ## [1] 24 12

    ```


    这部分唯一复杂的是如何处理惰性赋值。您需要使用`delayedAssign`，并且求值环境需要是包含值的环境，而赋值环境需要是您在`bind`函数中存储的环境。困难之处在于获取要求值的表达式。您不能对其求值——这正是您试图避免的——因此您需要将其作为一个表达式给出。然而，这个表达式要到以后并在不同的作用域中才会被求值，所以您不能简单地使用`bindings$bindings`列表来获取表达式。您需要将表达式替换到整个赋值的表达式中，然后再对其进行求值。`eval(substitute(...))`模式就是实现这一点的关键；在此函数中，为了可读性将其分成了两行，但其核心技巧就是用`substitute`将表达式嵌入另一个表达式，然后再求值。


    如果这整套关于表达式、替换和求值的练习让你头晕目眩，那么请深吸一口气，继续读下去。你将在接下来的两章中对其进行更深入的探讨。


