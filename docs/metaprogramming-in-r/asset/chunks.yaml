    ## Automatic Differentiation


    As a second and only slightly more involved example, let’s consider automatic
    differentiation, which means automatically translating a function that computes
    an expression into a function that calculates the derived expression. I will assume
    that you have a function whose body contains only a single expression—one that
    doesn’t involve control structures or sequences of statements but just a single
    arithmetic expression—and recurse through this expression, applying the rules
    of differentiation. Although what you do with this metaprogram is more complicated
    than the expression simplification just implemented, you will see that the form
    of the program is similar.


    You start with the main function, which you name `d` for differentiation. It takes
    two arguments: the function to be differentiated and the variable to take the
    derivative on. If you want the function to be able to handle the built-in mathematical
    functions, you need to handle these as special cases. These are implemented as
    so-called primitive functions and do not have a body. You need to handle them
    explicitly in the `d` function. For all other functions, you just need to compute
    the derivative of the expression in the function body. If you want to return a
    new function for the derivative, you can just take the function you are modifying
    and replace its body. Since R doesn’t let you modify arguments to a function,
    this will just create a copy you can return and leave the original function intact.
    Reusing the argument this way makes sure that the new function has the same arguments,
    with the same names and same default values, as the original. It also ensures
    that the derivative will have the same enclosing environment as the original function,
    which is potentially important for when you evaluate it.


    The `d` function can look like this, where I’ve handled only three of the primitive
    functions—you can add the remaining as an exercise:


    ```

    d <- function(f, x) {

    if (is.null(body(f))) {

    if (identical(f, sin)) return(cos)

    if (identical(f, cos)) return(function(x) -sin(x))

    if (identical(f, exp)) return(exp)

    stop("unknown primitive")

    } else {

    df <- f

    e <- environment(f)

    body(df) <- simplify_expr(diff_expr(body(f), x, e))

    df

    }

    }

    ```


    You send the function environment along with the recursion because you will need
    it when you have to deal with function calls later. There, you will need to look
    up functions and analyze which parameters they take to apply the chain rule. For
    now, you just pass it along in the recursion.


    For aesthetic reasons , you simplify the expression you get from differentiating
    the body of `f`, using the code you wrote in the previous section. You can use
    `d` like this:


    ```

    f <- function(x) x^2 + sin(x)

    df <- d(f, "x")

    df

    ## function (x)

    ## 2 * x + cos(x)

    ```


    For computing the derivative of the function body, you follow the pattern you
    used for the expression simplification: you write a recursive function for dealing
    with expressions, where you dispatch function calls to different cases for the
    different arithmetic operations.


    The two basic cases for the recursive function are numbers and names. Let’s assume
    that you do not get other atomic values such as logical vectors; you wouldn’t
    know how to differentiate them anyway. For numbers, the derivative is always 0,
    while for names it depends on whether you have the variable you are computing
    the derivative on or another variable. The recursive case for the function is
    function calls, where you just call another function to handle that case.


    ```

