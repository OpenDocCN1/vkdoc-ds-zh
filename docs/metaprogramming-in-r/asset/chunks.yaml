    \ you have two functions for constructing closures. The first creates a function\
    \ that can see the enclosing `z`, while the other, instead, uses the global environment\
    \ and is thus no closure at all, so the argument `z` is not visible. Instead,\
    \ the global `z` is.\n\n```\nnested <- function(z) {\nas.function(alist(x =, y\
    \ = z, x + y))\n}\nnested2 <- function(z) {\nas.function(alist(x =, y = z, x +\
    \ y),\nenvir = globalenv())\n}\n```\n\nIf you evaluate functions created with\
    \ these two functions, the `nested` one will add `x` to the `z` value you provide\
    \ in the call to `nested`, while the `nested2` one will ignore its input and look\
    \ for `z` in the global scope.\n\n```\nz <- -1\nnested(3)(1)\n## [1] 4\nnested2(3)(1)\n\
    ## [1] 0\n```\n\n# 2. Inside a Function Call\n\nWhen you execute the body of a\
    \ function, as you have seen, you do this in the evaluation environment. This\
    \ evaluation environment is linked through its parent to the environment where\
    \ the function was defined. It has its arguments stored as promises that will\
    \ be evaluated either in the environment where the function was defined (for default\
    \ parameters) or in the environment where the function was called (for parameters\
    \ provided to the function there). In the previous chapter, you saw how you could\
    \ get hold of the formal parameters of a function, the body of the function, and\
    \ the environment in which the function was defined. In this chapter, you will\
    \ examine how you can access these, and more, from inside a function while the\
    \ function is being evaluated.\n\n## Getting the Components of the Current Function\n\
    \nIn the previous chapter, you could get the `formals`, `body`, and `environment`\
    \ of a function you had a reference to. Inside a function body, you do not have\
    \ such a reference. Functions do not have names as such; you give functions names\
    \ when you assign them to variables, but that is a property of the environment\
    \ where you have the name, not of the function itself. Functions you use as closures\
    \ are often never assigned to any name at all. So, how do you get hold of the\
    \ current function to access its components?\n\nTo get hold of the current function,\
    \ you can use the function `sys.function` . This function gives you the definition\
    \ of the current function, which is what you need, not its name.\n\nYou can define\
    \ this function to see how `sys.function` works.\n\n```\nf <- function(x = 5)\
    \ {\ny <- 2 * x\nsys.function()\n}\n```\n\nIf you just write the function name\
    \ on the prompt, you get the function definition.\n\n```\nf\n## function(x = 5)\
    \ {\n##   y <- 2 * x\n##   sys.function()\n## }\n```\n\nSince the function returns\
    \ the definition of itself , you get the same when you evaluate it.\n\n```\nf()\n\
    ## function(x = 5) {\n##   y <- 2 * x\n##   sys.function()\n## }\n```\n\nWhen\
    \ you call any of `formals`, `body`, or `environment`, you don’t use a function\
    \ name as the first parameter; you give each of them a reference to a function,\
    \ and they get the function definition from that.\n\nYou don’t need to explicitly\
    \ call `sys.function` for `formals` and `body`, though, because these two functions\
    \ already use a call to `sys.function` for the default value for the function\
    \ parameter. If you want the components of the current function, you can simply\
    \ leave out the function parameter.\n\nThus, to get the formal parameter of a\
    \ function, inside the function body, you can just use `formals` without any parameters.\n\
    \n```\nf <- function(x, y = 2 * x) formals()\nparams <- f(1, 2)\nclass(params)\n\
    ## [1] \"pairlist\"\nparams\n## $x\n##\n##\n## $y\n## 2 * x\n```\n\nThe same goes\
    \ for the body of the current function.\n\n```\nf <- function(x, y = 2 * x) {\n\
    z <- x - y\nbody()\n}\nf(2)\n## {\n##     z <- x - y\n##     body()\n## }\n```\n\
    \nThe `environment` function works slightly differently. If you call it without\
    \ parameters, you get the current (evaluating) environment.\n\n```\nf <- function()\
    \ {\nx <- 1\ny <- 2\nz <- 3\nenvironment()\n}\nenv <- f()\nas.list(env)\n## $z\n\
    ## [1] 3\n##\n## $y\n## [1] 2\n##\n## $x\n## [1] 1\n```\n\nThis is not what you\
    \ would get with `environment(f)`.\n\n```\nenvironment(f)\n## \n```\n\nThe `f`\
    \ function is defined in the global environment, and `environment(f)` gives you\
    \ the environment in which `f` is defined. If you call `environment()` inside\
    \ `f`, you get the evaluating environment. The local variables `x`, `y`, and `z`\
    \ can be found in the evaluating environment, but they are not part of `environment(f)`—or\
