- '# 函数调用内部


  如你所见，当你执行函数主体时，你是在求值环境中进行的。这个求值环境通过其父环境链接到函数被定义的环境。它的参数存储为 promise，这些 promise 要么在函数被定义的环境（对于默认参数）中求值，要么在函数被调用的环境（对于在该处提供给函数的参数）中求值。在上一章中，你看到了如何获取函数的形式参数、函数主体以及函数被定义的环境。在本章中，你将学习如何在函数被求值期间，从函数内部访问这些信息，以及更多其他信息。


  ### 获取当前函数的组成部分


  在上一章中，你可以通过一个函数引用来获取它的 `formals`、`body` 和 `environment`。在函数主体内部，你并没有这样的引用。函数本身并没有名称；当你将函数赋值给变量时，你是在给它们赋予名称，但这只是你拥有该名称的环境的属性，而不是函数本身的属性。你用作闭包的函数通常根本不会被赋予任何名称。那么，你如何获取当前函数来访问其组成部分呢？


  为了获取当前函数，你可以使用 `sys.function` 函数。这个函数会返回当前函数的定义，这正是你所需要的，而不是它的名称。


  你可以定义这个函数来看看 `sys.function` 是如何工作的。


  ```

  f <- function(x = 5) {

  y <- 2 * x

  sys.function()

  }

  ```


  如果你直接在提示符下输入函数名，你会得到函数定义。


  ```

  f

  ## function(x = 5) {

  ##   y <- 2 * x

  ##   sys.function()

  ## }

  ```


  由于该函数返回自身的定义，当你对它求值时，也会得到相同的结果。


  ```

  f()

  ## function(x = 5) {

  ##   y <- 2 * x

  ##   sys.function()

  ## }

  ```


  当你调用 `formals`、`body` 或 `environment` 中的任何一个时，你并非使用函数名作为第一个参数；你需要为它们每个提供一个函数引用，然后它们会从中获取函数定义。


  不过，你不需要为 `formals` 和 `body` 显式地调用 `sys.function`，因为这两个函数已经为它们的函数参数默认值使用了 `sys.function`
  的调用。如果你想获取当前函数的组成部分，你可以简单地省略掉函数参数。


  因此，要获取一个函数的形式参数，在函数主体内部，你可以直接使用不带任何参数的 `formals`。


  ```

  f <- function(x, y = 2 * x) formals()

  params <- f(1, 2)

  class(params)

  ## [1] "pairlist"

  params

  ## $x

  ##

  ##

  ## $y

  ## 2 * x

  ```


  对于当前函数的主体也是如此。


  ```

  f <- function(x, y = 2 * x) {

  z <- x - y

  body()

  }

  f(2)

  ## {

  ##     z <- x - y

  ##     body()

  ## }

  ```


  `environment` 函数的工作方式略有不同。如果你不带参数调用它，你会得到当前的（即求值）环境。


  ```

  f <- function() {

  x <- 1

  y <- 2

  z <- 3

  environment()

  }

  env <- f()

  as.list(env)

  ## $z

  ## [1] 3

  ##

  ## $y

  ## [1] 2

  ##

  ## $x

  ## [1] 1

  ```


  这不是你用 `environment(f)` 得到的结果。


  ```

  environment(f)

  ##

  ```


  `f` 函数是在全局环境中定义的，而 `environment(f)` 返回的是 `f` 被定义的环境。如果你在 `f` 内部调用 `environment()`，你会得到求值环境。局部变量
  `x`、`y` 和 `z` 可以在求值环境中找到，但它们不是 `environment(f)` 的一部分——或者说，如果它们存在，那也会是不同的全局参数。


  要从 `f` 内部获取等同于 `environment(f)` 的东西，你必须获取求值环境的父环境。你可以使用 `parent.env` 函数来获取一个环境的父环境，因此你可以像这样获取定义环境：


  ```

  f

  ```


  当你像上一章那样持有一个函数定义时，你并没有一个求值环境。那个环境只在函数被调用时才存在。一个你已定义但尚未调用的函数，拥有上一章涵盖的三个组成部分，但一个正在被积极执行的函数还有更多的组成部分。函数定义（即对函数在被调用时应做什么的描述）与函数实例化（即实际运行的代码）之间存在区别。其中一个区别就是求值环境。另一个区别是，函数实例化拥有实际参数，而函数定义只拥有形式参数。后者是函数定义的一部分；前者则由函数的调用者提供。




  ### 访问实际函数参数


  在以下示例中，你可以看到形式参数与实际参数之间的区别：


  ```

  f <- function(x = 1:3) {

  print(formals()$x)

  x

  }

  f(x = 4:6)

  ## 1:3

  ## [1] 4 5 6

  ```


  `formals` 返回的是你在函数定义中提供的参数，其中 `x` 被设置为表达式 `1:3`。这是一个**承诺**（promise），当你在函数调用中未提供参数而访问
  `x` 时，它将在定义作用域中被求值。因此，在 `formals` 列表中，它并不等于数值 1、2 和 3，而是表达式 `1:3`。然而，在实际调用中，你提供了
  `x` 参数，因此该函数调用返回的是 `4:6`。由于你将其作为表达式的结果返回，这个承诺被求值了。因此，`f` 返回 4、5 和 6。


  如果你确实希望以承诺实际代表的形态获取传递给当前函数的参数，就需要在不求值的情况下获取它们。如果你获取一个参数并将其用作表达式，承诺就会被求值。这同样适用于默认参数和函数调用中提供的参数：它们都是承诺，会在不同的环境中被求值，但无论如何它们都是承诺。


  获取承诺所代表表达式的一种方法是使用函数 `substitute`。这个函数（你将在第 4 章中深入了解它）会将变量所引用的值替换到表达式中。这意味着变量会被逐字表达式替换；这些表达式在替换到另一个表达式之前不会被求值。


  这个小函数展示了如何获取传递给函数的表达式：


  ```

  f <- function(x = 1:3) substitute(x)

  f()

  ## 1:3

  ```


  此处可见，使用默认参数调用 `f` 会返回表达式 `1:3`。这与之前看到的 `formals` 类似。你用 `x` 在形式参数中的表达式替换了 `x`；并没有对表达式求值。当然，一旦你得到表达式，就可以


  ```

  eval(f())

  ## [1] 1 2 3

  ```


  但在调用 `substitute` 时并不会执行求值。


  ```

  f(5 * x)

  ## 5 * x

  f(foo + bar)

  ## foo + bar

  ```


  由于替换后的表达式不被求值，你甚至无需用可求值的表达式来调用函数。


  ```

  f(5 + "string")

  ## 5 + "string"

  ```


  替换是逐字进行的。如果你设置的默认参数依赖于其他参数，那么这些默认参数只会被替换成变量名；而不会获得赋给其他变量的值。


  ```

  f <- function(x = 1:3, y = x) substitute(x + y)

  f()

  ## 1:3 + x

  f(x = 4:6)

  ## 4:6 + x

  f(y = 5 * x)

  ## 1:3 + 5 * x

  ```


  在这个例子中，你还可以看到，可以用一个表达式而非单个变量来调用 `substitute`。此外，你会注意到 `x` 被替换为提供给 `x` 的参数（无论是默认值还是实际值），而
  `y` 则被替换为作为默认参数的 `x`（而不是你在函数调用中为 `x` 提供的值），当你为 `y` 提供实际参数时，它会被替换为实际参数。


  如果你尝试对从 `f` 调用返回的表达式求值，你不会在 `f` 的求值环境中求值它。该环境在替换过程中并未保留。


  ```

  x <- 5

  f(x = 5 * x)

  ## 5 * x + x

  eval(f(x = 5 * x))

  ## [1] 30

  ```


  你所求值的表达式是 `5 * x + x`，而不是 `5 * x + 5 * x`（如果 `x` 的值被替换到 `y` 中，就会是后者，就像你在函数内部求值表达式时那样）。


  ```

  g <- function(x = 1:3, y = x) x + y

  g(x = 5 * x)

  ## [1] 50

  ```


  `substitute` 的一个常见用途是将提供给函数的表达式作为字符串获取。例如，这在 `plot` 函数中用于将绘图默认标签设置为调用 `plot` 时所使用的表达式。这里，`substitute`
  与 `deparse` 函数结合使用。`deparse` 函数接收一个表达式并将其转换为文本表示形式。


  ```

  f <- function(x) {

  cat(deparse(substitute(x)), "==", x)

  }

  f(2 + x)

  ## 2 + x == 7

  f(1:4)

  ## 1:4 == 1 2 3 4

  ```


  此处，我们使用 `deparse(substitute(x))` 模式来获取调用 `f` 时所传入参数的文本表示，并使用纯粹的 `x` 来获取其求值结果。


  `substitute` 返回对象的实际类型取决于你提供给函数的表达式以及表达式变量所引用的内容。如果在变量被替换后，表达式属于简单类型，那么 `substitute`
  就返回该简单类型。


  ```

  f <- function(x) substitute(x)

  f(5)

  ## [1] 5

  class(f(5))

  ## [1] "numeric"

  ```


  如果你给 `substitute` 提供一个已赋值的局部变量，你也会得到一个值作为返回。这并不是因为 `substitute` 在这里做了什么特殊处理。像这样的局部变量不是承诺；你在赋值时已经对一个表达式进行了求值。


  ```

  f <- function(x) {

  y <- 2 * x

  substitute(y)

  }

  f(5)

  ## [1] 10

  class(f(5))

  ## [1] "numeric"

  ```


  不过，这种特性仅在函数内部有效。如果我们在全局环境中调用 `substitute`，它会将变量视为名称，而不会将它们替换为对应的值。


  ```

  x <- 5

  class(substitute(5))

  ## [1] "numeric"

  class(substitute(x))

  ## [1] "name"

  ```


  如果我们给函数传入一个简单类型作为参数，`substitute` 会将变量替换为值。


  ```

  f <- function(x, y = x) substitute(y)

  f(5)

  ## x

  class(f(5))

  ## [1] "name"

  f(5, 5)

  ## [1] 5

  class(f(5, 5))

  ## [1] "numeric"

  ```


  如果 `substitute` 求值得到的表达式是单个变量，那么它返回的类型是 `name`，正如你刚刚看到的那样。对于更复杂的情况，`substitute`
  会返回一个 `call` 对象。即使是一个可以轻松求值为简单值的表达式，`substitute` 也不会对表达式求值；它只是替换变量。


  ```

  f <- function(x, y) substitute(x + y)

  f(5, 5)

  ## 5 + 5

  class(f(5, 5))

  ## [1] "call"

  ```


  `call` 对象指的是一个未求值的函数调用。在这个例子中，你有一个表达式 `5 + 5`，它对应于函数调用 `` `+`(5, 5) ``。


  这样的 `call` 对象也可以被操作。你可以将一个 `call` 对象转换为列表以获取其组成部分，也可以对其进行求值以执行实际的函数调用。


  ```

  my_call <- f(5, 5)

  as.list(my_call)

  ## [[1]]

  ## `+`

  ##

  ## [[2]]

  ## [1] 5

  ##

  ## [[3]]

  ## [1] 5

  eval(my_call)

  ## [1] 10

  ```


  由于 `substitute` 不对调用求值，你可以创建包含变量的函数调用对象，稍后可以在不同的环境中对这些变量进行求值。


  ```

  rm(x) ; rm(y)

  my_call <- f(x, y)

  as.list(my_call)

  ## [[1]]

  ## `+`

  ##

  ## [[2]]

  ## x

  ##

  ## [[3]]

  ## y

  ```


  这里，我们创建了调用 `x + y`，但删除了全局变量 `x` 和 `y`，因此你无法对该调用求值。


  ```

  eval(my_call)

  ## Error in eval(expr, envir, enclos): object ''x'' not found

  ```


  不过，你可以在求值调用时提供这些变量。


  ```

  eval(my_call, list(x = 5, y = x))

  ```


  或者，你可以设置全局变量，并在全局环境中求值该调用。


  ```

  x <- 5; y <- 2

  eval(my_call)

  ## [1] 7

  ```


  你可以将 `call` 对象视为列表并进行修改。`call` 中的第一个元素是你要调用的函数，你可以像这样替换它：


  ```

  (my_call <- f(5, 5))

  ## 5 + 5

  my_call[[1]] <- `-`

  eval(my_call)

  ## [1] 0

  ```


  `call` 中的其余元素是函数调用的参数，你也可以修改这些：


  ```

  my_call[[2]] <- 10

  eval(my_call)

  ## [1] 5

  ```


  你也可以使用 `call` 函数手动创建 `call` 对象。`call` 的第一个参数是要调用的函数名称，任何额外的参数都将在 `call` 对象被求值时传递给该函数。




  `(my_call <- call("+", 2, 2))`

  ```

  ## 2 + 2

  eval(my_call)

  ## [1] 4

  ```


  然而，与函数内部的 `substitute` 不同，`call` 的参数在构建调用对象时就会被求值。这些参数并非惰性求值。


  ```

  (my_call <- call("+", x, y))

  ## 5 + 2

  (my_call <- call("+", x - y, x + y))

  ## 3 + 7

  ```


  在函数内部，你可以使用 `match.call` 函数获取用于调用该函数的调用。


  ```

  f <- function(x, y, z) {

  match.call()

  }

  (my_call <- f(2, 4, sin(2 + 4)))

  ## f(x = 2, y = 4, z = sin(2 + 4))

  as.list(my_call)

  ## [[1]]

  ## f

  ##

  ## $x

  ## [1] 2

  ##

  ## $y

  ## [1] 4

  ##

  ## $z

  ## sin(2 + 4)

  ```


  通过该调用的第一个元素，你可以获取被调用函数的名称。请记住，函数本身没有名称，但在对函数的调用中，你有一个对它的引用，你可以通过 `match.call` 函数获取该引用。


  ```

  g <- f

  (my_call <- g(2, 4, sin(2 + 4)))

  ## g(x = 2, y = 4, z = sin(2 + 4))

  my_call[[1]]

  ## g

  ```


  这个函数通常用于在统计模型中记住函数调用，其中模型构造器的调用会与拟合后的模型一起保存。


  ### 访问调用作用域


  在函数内部，表达式在由求值环境及其父环境（即定义函数的环境）定义的作用域内进行求值，但函数调用中提供的承诺（promises）除外，它们在调用作用域内求值。如果你想直接访问函数内部的调用环境，可以使用
  `parent.frame` 函数来获取它。¹


  你可以在以下函数中看到这一点：


  ```

  nested <- function(x) {

  function(local) {

  if (local) x

  else get("x", parent.frame())

  }

  }

  ```


  你有一个函数 `nested`，它的局部环境知道参数 `x` 的值。在它内部，你创建并返回一个函数，该函数根据其参数，要么返回 `nested` 的参数值，要么在调用该函数的作用域中查找
  `x`。


  ```

  f <- nested(2)

  f(TRUE)

  ## [1] 2

  x <- 1

  f(FALSE)

  ## [1] 1

  ```


  在第一次调用 `f` 时，你得到了 `x` 的局部值，即数字 `2`。在第二次调用 `f` 时，你绕过了局部作用域，转而在调用作用域中查找 `x`，本例中调用作用域是全局环境，你发现
  `x` 的值为 `1`。


  在一个稍微复杂的版本中，你可以尝试在局部求值环境或调用作用域中求值一个表达式。


  ```

  nested <- function(x) {

  y <- 2

  function(local) {

  z <- 2

  expr <- expression(x + y + z)

  if (local) eval(expr)

  else eval(expr, envir = parent.frame())

  }

  }

  ```


  逻辑与之前的函数相同，只是在这个函数中，你定义了一个表达式，并使用 `eval` 在局部作用域或调用作用域中对其求值。你需要使用 `expression` 函数来创建表达式；如果不这样做，表达式会在
  `eval` 处理之前（在局部作用域中）被求值。按照定义的函数，你可以显式地选择在评估表达式时使用哪个环境。


  ```

  f <- nested(2)

  x <- y <- z <- 1

  f(TRUE)

  ## [1] 6

  f(FALSE)

  ## [1] 3

  ```


  与前面的例子一样，你可以对作用域、变量和表达式进行更具创造性的操作。你想编写一个函数，允许你一次性从返回一系列值的表达式（例如函数调用）中为多个变量赋值。我们不想写成这样：


  ```

  x <- 1

  y <- 2

  z <- 3

  ```


  而是希望能够编写以下代码并获得相同的效果：


  ```

  bind(x, y, z) <- 1:3

  ```


  由于 R 处理替换函数的方式（它会将此表达式解释为替换函数），你无法完全实现这一点，但你可以将赋值运算符修改为你自定义的中缀函数 `` `%<-%` ``，从而得到以下结果：


  ```

  bind(x, y, z) %<-% 1:3

  ```


  这个语法可能不是最漂亮的，但作为示例已经足够好了。然而，你还可以更进一步，让这个 `bind` 函数根据表达式来为变量赋值。例如，以下代码将 `2` 赋值给 `x`，将
  `4` 赋值给 `y`，将 `6` 赋值给 `z`：


  ```

  bind(x, y = 2 * x, z = 3 * x) %<-% 2

  ```


  第一个是因为它是位置参数，另外两个是因为你给它们提供了表达式，一旦知道了 `x` 的值，就可以对这些表达式进行求值。


  为了实现这个语法，你需要定义 `bind` 函数和 `%<-%` 运算符。其中，`bind` 函数更简单。


  ```

  bind <- function(...) {

  bindings <- eval(substitute(alist(...)))

  scope <- parent.frame()

  structure(list(bindings = bindings, scope = scope),

  class = "bindings")

  }

  ```




  您使用 `eval(substitute(alist(...)))` 表达式来获取函数的所有参数并放入一个配对列表中，且不对任何潜在表达式进行求值。您希望保留惰性求值特性，因为在您尝试赋值给绑定的变量之前，作为参数提供的表达式不能被求值。使用
  `eval(substitute(alist(...)))` 可以实现这一点。`substitute` 调用将函数的实际参数放入 `alist(...)` 表达式中，当您随后对这个表达式求值时，就会得到配对列表。您从
  `parent.frame` 中获取应该绑定变量的作用域，然后将绑定和作用域组合成一个名为 `bindings` 的类。虽然不一定要将其设为类，但这并无坏处，所以您不妨这样做。


  实际工作是在 `%<-%` 运算符中完成的。在这里，您需要做几件事。您需要确定哪些参数绑定只是名称（此时应根据其位置分配值），哪些是需要求值的表达式。位置参数可以直接赋值，然后将其存储在您在绑定中记住的作用域中。表达式应同时具有名称和需要求值的表达式（您无法在任何作用域中直接对实际表达式赋值，因此这些表达式必须是有名称的参数）。如果表达式引用了您在
  `bind` 调用中命名的其他参数，它们需要知道这些参数是什么，因此您需要在 `bind` 提供的作用域中对表达式求值。如果您赋给表达式的值有名称，您还需要能够引用它们，例如编写如下赋值语句：


  ```

  bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

  ```


  为了实现这一点，您可以将这些值转换为一个环境，并将 `bind` 的父作用域也作为该环境的父环境。这样，它们既可以引用您赋值的变量，也可以引用您绑定中的变量。关于表达式引用您定义的其他参数，唯一的复杂之处在于表达式求值的顺序。为了对一个表达式求值，它所引用的所有变量都必须先被赋值。因此，您似乎需要解析表达式并确定顺序——即根据表达式使用了哪些变量对表达式进行拓扑排序——但您可以通过借用函数参数求值的一个技巧来避免：惰性求值。如果您不为每个参数赋值，而是赋一个承诺，那么您就不必担心变量赋值的顺序。每当
  R 看到对这些承诺的引用时，它会自行处理这个顺序。这意味着，如果您在访问另一个变量之前修改了某个已赋值的变量，您可能会得到函数的惰性求值行为。例如，如果执行以下操作，`y`
  将引用 10 而不是 24：


  ```

  bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

  z <- 5

  ```


  为避免此问题，您可以在完成所有表达式赋值后，强制对所有表达式求值。


  整个函数如下：


  ```

  .unpack  0)

  value_env  0) force(bindings$scope[[name]])

  }

  }

  ```


  它能按预期工作。


  ```

  bind(x, y, z) %<-% 1:3

  c(x, y, z)

  ## [1] 1 2 3

  bind(y = 2 * x, z = 3 * x) %<-% c(x = 4)

  c(y, z)

  ## [1]  8 12

  bind(y = 2 * z, z = 3 * x) %<-% c(x = 4)

  c(y, z)

  ## [1] 24 12

  ```


  这部分唯一复杂的是如何处理惰性赋值。您需要使用 `delayedAssign`，并且求值环境需要是包含值的环境，而赋值环境需要是您在 `bind` 函数中存储的环境。困难之处在于获取要求值的表达式。您不能对其求值——这正是您试图避免的——因此您需要将其作为一个表达式给出。然而，这个表达式要到以后并在不同的作用域中才会被求值，所以您不能简单地使用
  `bindings$bindings` 列表来获取表达式。您需要将表达式替换到整个赋值的表达式中，然后再对其进行求值。`eval(substitute(...))`
  模式就是实现这一点的关键；在此函数中，为了可读性将其分成了两行，但其核心技巧就是用 `substitute` 将表达式嵌入另一个表达式，然后再求值。


  如果这整套关于表达式、替换和求值的练习让你头晕目眩，那么请深吸一口气，继续读下去。你将在接下来的两章中对其进行更深入的探讨。


  脚注 1


  这是一个不幸的名称，因为 `parent.frame` 与父环境（parent environment）无关，父环境是通过 `parent.env` 函数获得的。“框架”（frame）指的是调用栈上的环境，通常称为栈帧，而父环境指的是环境链上的上级环境。


  '
- '# 3. 表达式与环境


  本章深入探讨环境的工作机制以及如何在不同的环境中对表达式求值。理解环境如何链接在一起，有助于您理解语言如何查找变量，而在求值表达式时能够创建、操作和链接环境，是元编程的关键技巧。


  ## 表达式


  在 R 中，任何被求值的内容都可以被视为一个表达式。程序中的每条语句也都是一个表达式，它会求出某个值（当然，该值可能是 `NULL`）。这包括控制结构和函数体。所有内容都可以视为表达式；只是某些表达式会对其包含的多个表达式进行求值以获得它们的副作用（side
  effects），然后返回最后一个被求值表达式的结果。然而，从元编程的角度来看，您最感兴趣的是那些可以在程序内部获取、检查、修改或求值的表达式。


  信不信由你，您已经看到了获取表达式对象的大部分方法。您可以使用 `body` 函数获取函数体，或者使用 `quote` 或 `call` 构建表达式。使用这些方法中的任何一种，您都会得到一个可以在程序内部操作和求值的对象。通常，表达式会在程序执行时由
  R 自动求值，但如果您拥有一个可以操作的对象形式的表达式，则必须显式地对其求值。如果您不对它求值，它的值就是实际的表达式本身；如果您对它求值，您就会得到它在给定作用域中所对应的值。


  在本章中，您将不涉及表达式的操作。那是第 4 章的主题。相反，您将重点关注表达式如何被求值，以及如何在求值表达式时更改其作用域。如果您只是将表达式作为 R 源代码编写，它将在其书写的作用域中被求值，这是您习惯的做法。要在不同的作用域中求值，您需要使用
  `eval` 函数。如果您不给 `eval` 提供一个环境，它将只会在 `eval` 被调用的作用域中对表达式求值，就像您直接在那里编写表达式一样。然而，如果您给它一个环境，该环境就决定了表达式求值时的作用域。


  不过，要理解如何利用作用域，您首先需要详细了解环境如何定义作用域。




  '
- "# 链接环境的链条\n\n你已经了解了函数如何拥有捕获其定义位置的关联环境，也看到了在求值函数调用时，会有一个求值环境链接到该定义环境。你还通过父环境的链表明白了这其中的工作原理。不过到目前为止，你一直声称这条链终止于全局环境，即如果在任何嵌套作用域中都找不到变量，就会到全局环境中查找。对于你目前看到的所有示例来说，这可能确实如此，但在任何实际的\
  \ R 语言使用中，你都会加载包。你之所以能从包中找到函数，是因为这些包也位于环境链中。全局环境也有自己的父环境，当你加载包时，最后加载的包会成为全局环境的父环境，而之前加载的包则会成为新包的父环境。这既解释了你是如何在已加载的包中找到变量的，也解释了为什么加载新包可能会遮蔽其他包中定义的变量。\n\
  \n当然，这条链必须在某个点终止，有一个特殊的环境起到了终结序列的作用。这被称为空环境，它是唯一没有父环境的环境。当你启动 R 时，空环境就已存在。然后 R 会放置基础环境，所有基础语言功能都在其中。接着会放置一个\
  \ `Autoload` 环境，负责按需加载数据，而在这之上，会放置全局环境。基础环境和空环境非常重要，因此你有专门的函数来获取它们。这两个函数分别是 `baseenv()`\
  \ 和 `emptyenv()`。\n\n当你导入包，或者通常来说是附加一个命名空间时，它会被放置在这个列表的全局环境下方。`search()` 函数会为你列出从全局环境向下的环境序列。你可以通过以下示例看到加载库是如何影响这个列表的：\n\
  \n```\nsearch()\n##  [1] \".GlobalEnv\"\n##  [2] \"package:ggplot2\"\n##  [3] \"\
  package:purrr\"\n##  [4] \"package:microbenchmark\"\n##  [5] \"package:pryr\"\n\
  ##  [6] \"package:magrittr\"\n##  [7] \"package:knitr\"\n##  [8] \"package:stats\"\
  \n##  [9] \"package:graphics\"\n## [10] \"package:grDevices\"\n## [11] \"package:utils\"\
  \n## [12] \"package:datasets\"\n## [13] \"Autoloads\"\n## [14] \"package:base\"\n\
  library(MASS)\nsearch()\n##  [1] \".GlobalEnv\"\n##  [2] \"package:MASS\"\n##  [3]\
  \ \"package:ggplot2\"\n##  [4] \"package:purrr\"\n##  [5] \"package:microbenchmark\"\
  \n##  [6] \"package:pryr\"\n##  [7] \"package:magrittr\"\n##  [8] \"package:knitr\"\
  \n##  [9] \"package:stats\"\n## [10] \"package:graphics\"\n## [11] \"package:grDevices\"\
  \n## [12] \"package:utils\"\n## [13] \"package:datasets\"\n## [14] \"Autoloads\"\
  \n## [15] \"package:base\"\n```\n\n`search()` 函数是一个内置函数，但你可以编写自己的版本来感受它的工作方式。不过，`search()`\
  \ 是从全局环境开始搜索的，而你的函数会更通用，允许你指定一个起始环境。你只需要让它打印出环境名称，然后从当前环境移动到父环境，直到遇到空环境为止。\n\n要获取环境的名称，你可以使用\
  \ `environmentName()` 函数。并非所有环境都有名称；当你嵌套或调用函数时创建的环境，或者使用 `new.env()` 创建的环境，都没有名称。但是，加载包时创建的环境是有名称的。如果一个环境没有名称，`environmentName()`\
  \ 会返回一个空字符串。在这种情况下，你可以改用 `str()` 来获取一个可打印的环境表示。\n\n要检查是否已到达环境链的末尾，你可以检查 `identical(env,\
  \ emptyenv())`。你不能用 `==` 来比较两个环境，但可以使用 `identical()`。你的函数可能如下所示：\n\n```\nmy_search\
  \ <- function(env) {\nrepeat {\nname <- environmentName(env)\nif (nchar(name) !=\
  \ 0)\nname <- paste0(name, \"\\n\")\nelse\nname <- str(env, give.attr = FALSE)\n\
  cat(name)\nenv <- parent.env(env)\nif (identical(env, emptyenv())) break\n}\n}\n\
  ```\n\n以全局环境作为参数调用该函数，应该会得到与 `search()` 类似的结果，只不过你是打印环境，而不是返回一个名称列表。\n\n```\nmy_search(globalenv())\n\
  ## R_GlobalEnv\n## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
  ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
  ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n## base\n\
  ```\n\n由于你可以将任何环境传递给它，因此可以尝试获取某个函数的环境。如果你编写一个嵌套在其他函数作用域中的函数，你会看到这些函数拥有（无名的）环境。\n\
  \n```\nf <- function() {\nmy_search(environment())\n}\nf()\n## \n## \n## R_GlobalEnv\n\
  ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
  ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
  ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n## base\n\
  ```\n\n你也可以获取导入函数的环境。例如，你可以像这样获取从 `ls()` 函数开始的环境链：\n\n```\nmy_search(environment(ls))\n\
  ## base\n## R_GlobalEnv\n## package:MASS\n## package:ggplot2\n## package:purrr\n\
  ## package:microbenchmark\n## package:pryr\n## package:magrittr\n## package:knitr\n\
  ## package:stats\n## package:graphics\n## package:grDevices\n## package:utils\n\
  ## package:datasets\n## Autoloads\n## base\n```\n\n这里你看到了一些有点奇怪的现象。看起来 `base` 在列表的顶部和底部都出现了。显然，这不能是同一个环境；因为一个环境需要同时将全局环境和它的父环境作为父环境，而每个环境只能有一个父环境。看起来像是同一个环境的唯一原因是，`environmentName()`\
  \ 为两个不同的环境返回了相同的名称。它们实际上是不同的。\n\n```\nenvironment(ls)\n## <environment: namespace:base>\n\
  baseenv()\n## <environment: base>\n```\n\n`ls()` 的环境是由 `base` 包定义的一个命名空间。`baseenv()`\
  \ 环境是这个包如何被导出到全局环境之下的环境，使得基础函数在 `base` 包之外也可以使用。\n\n拥有这些额外的环境，正是包能够在包内拥有私有函数，同时拥有导出给包用户的其他函数的方式。`base`\
  \ 包比较特殊，它只定义了两个环境：包的命名空间和包环境。所有其他包在全局环境之前的环境链中都设置了三个环境：包命名空间、一个包含导入符号的命名空间，以及基础环境（正如你刚才看到的，它连接到全局环境）。图\
  \ 3-1 展示了加载了三个包时的环境图：`MASS`、`stats` 和 `graphics`（这里先加载了 `graphics`，然后是 `stats`，最后是\
  \ `MASS`，因此在从全局环境到基础环境的路径上，`MASS` 首先出现，接着是 `stats`，然后是 `graphics`）。实线箭头表示环境的父指针，虚线箭头表示哪些包的符号被导出到了包环境中。\n\
  \n![A449887_1_En_3_Fig1_HTML.gif](img/A449887_1_En_3_Fig1_HTML.gif)\n\n**图 3-1.**\
  \ 加载了三个包（MASS、stats 和 graphics）时的环境示意图\n\n\n\n如果你尝试从全局环境访问包中的符号，则只能访问导出的函数，且其中一些可能被你加载的其他包所遮蔽。对于包内定义的函数，其父环境包含包中定义的所有函数（及其他变量）；由于这个包命名空间环境位于全局环境之前，当你执行包中的函数时，其他包中的变量不会遮蔽包内的变量。\n\
  \n如果某个包导入了其他包，这些导入会进入“导入环境”，位于包命名空间之下、基础环境之上。因此，包内的函数可以看见导入的符号，但仅当它们在包内未被遮蔽时。如果包的用户导入了其他包，这些导入不会遮蔽包函数所能看见的任何符号，因为从包内部来看，这些导入在环境链中位于更靠后的位置。在导入环境之后是基础命名空间。这使得所有包都能访问基本的\
  \ R 功能，即使其中部分功能从全局环境看可能被遮蔽了。²\n\n在`DESCRIPTION`文件中，有三种方式指定一个包依赖另一个包：`Suggests:`、`Depends:`和`Imports:`。第一种实际上并不建立任何依赖关系；它只是建议其他可能增强被定义包功能的包。\n\
  \n`Depends:`指令中指定的包，在加载当前包时会被加载到搜索路径中。对于这里指定的包，你会污染全局命名空间（并非全局环境，而是其下方的搜索路径），并且你依赖的函数可能会被之后加载到全局命名空间中的包所遮蔽。只要可能，应避免使用`Depends:`。\n\
  \n使用`Imports:`时，你只需确保一组其他包在安装你自己的包之前已经安装。然而，这些包既不会被放入搜索路径，也不会被导入到“导入环境”中。使用`Imports:`仅仅允许你通过包命名空间前缀来访问另一个包中的函数和数据；因此，如果你使用`Imports:`导入`stats`包，你就可以保证在用户使用你的包时，`stats::sd`是可用的。\n\
  \n要将变量实际导入到`imports`命名空间，你需要修改`NAMESPACE`文件；分别使用以下指令来导入整个包、函数、S4 类以及 S4 方法：\n\n\
  *   `imports()`\n*   `importFrom()`\n*   `importClassesFrom()`\n*   `importMethodsFrom()`\n\
  \n不过，处理`NAMESPACE`文件最简单的方法是使用`Roxygen`，你可以通过以下方式导入名称：\n\n*   `@import <package>`\n\
  *   `@importFrom <package> <name>`\n*   `@importClassesFrom <package> <classes>`\n\
  *   `@importMethodsFrom <package> <methods>`\n\n为了确保你编写的包与其他命名空间良好协作，对于绝对需要的依赖应使用`Imports:`（对于其他依赖则使用`Suggests:`），并要么对其他包中的依赖使用包名前缀，要么在`NAMESPACE`中导入这些依赖。\n\
  \n函数`sd`位于包`stats`中。其父环境是`namespace:stats`，祖父环境是`imports:stats`，曾祖父环境是`namespace:base`。然而，如果你从全局环境访问`sd`，你会在`package:stats`中找到它。\n\
  \n```\nmy_search(environment(sd))\n## stats\n## imports:stats\n## base\n## R_GlobalEnv\n\
  ## package:MASS\n## package:ggplot2\n## package:purrr\n## package:microbenchmark\n\
  ## package:pryr\n## package:magrittr\n## package:knitr\n## package:stats\n## package:graphics\n\
  ## package:grDevices\n## package:utils\n## package:datasets\n## Autoloads\n## base\n\
  environment(sd)\n## \nparent.env(environment(sd))\n## \n## attr(,\"name\")\n## [1]\
  \ \"imports:stats\"\nparent.env(parent.env(environment(sd)))\n## \nparent.env(parent.env(parent.env(environment(sd))))\n\
  ## \n```\n\n图 3-2 展示了`ls`和`sd`如何位于包环境和命名空间环境中，以及它们的父环境是命名空间而非包环境。\n\n![A449887_1_En_3_Fig2_HTML.gif](img/A449887_1_En_3_Fig2_HTML.gif)\n\
  \n图 3-2. 展示`stats::sd`和`base::ls`位置的环境关系图\n\n正如你现在所见，这种简单的环境链机制不仅为函数提供了词法作用域，也解释了包中的命名空间是如何工作的。\n\
  \n\n\n"
- "# 环境与函数调用\n\n理解环境与包命名空间如何协同工作是一件有趣的事，这或许能为你如何将命名空间应用于其他场景提供启发，但在日常编程中，你更应关注环境与函数如何协作。因此从现在开始，我将假设作用域图终止于全局环境，并聚焦于当定义和调用函数时，环境是如何链式连接的。\n\
  \n你已经知道相关规则：调用函数时，会得到一个求值环境，它的父环境指向函数被定义时的环境；如果你需要获取函数调用者的环境，可以使用 `parent.frame`\
  \ 函数。不过，为了检验你的知识掌握程度，你应该考虑一个比之前更复杂的嵌套函数示例。请思考在评估 `i(3)` 调用时以下代码的状况。图 3-3 展示了环境如何链式连接；此处实线表示父级指针，虚线表示从变量指向其值的指针。图\
  \ 3-4 则添加了作为父帧环境的调用栈。请边阅读代码边对照图示。\n\n![A449887_1_En_3_Fig4_HTML.gif](img/A449887_1_En_3_Fig4_HTML.gif)\n\
  \n图 3-4. 嵌套函数复杂示例的环境图，突出展示了通过 `parent.frame` 获取的调用栈\n\n![A449887_1_En_3_Fig3_HTML.gif](img/A449887_1_En_3_Fig3_HTML.gif)\n\
  \n图 3-3. 嵌套函数复杂示例的环境图\n\n```\nf <- function(x) {\ng <- function(y, z) x + y + z\n\
  g\n}\nh <- function(a) {\ng <- f(x)\ni <- function(b) g(a + b, 5)\n}\nx <- 2\ni\
  \ <- h(1)\ni(3)\n```\n\n代码中的前两个语句定义了函数 `f` 和 `h`。你并未调用它们，只是定义，因此没有创建任何新环境。与这两个函数关联的环境都是全局环境。接着你将\
  \ `x` 设为 2，这里同样没有发生什么有趣的事。然而，当你调用 `h` 时，便开始创建新的求值环境。首先，你创建一个环境来执行 `h` 内部的逻辑。由于你用参数\
  \ 1 调用了 `h`，该环境将 `a` 设为 1。接着它用 `x` 调用了 `f`。\n\n这里开始变得有些棘手。由于你用一个变量调用了 `f`（该变量将在\
  \ `f` 内部被惰性求值），所以你并非用全局参数 `x` 的值来调用 `f`。因此，`f` 接收到一个承诺，它稍后可用此承诺获取 `x` 的值，并且这个承诺知道应当在当前正在评估的\
  \ `h` 调用作用域内寻找 `x`。在本例中，那个 `x` 恰好是全局变量，但你可以在调用 `f` 之后，在 `h` 内部给局部变量 `x` 赋值，那样 `f`\
  \ 就会使用这个局部变量 `x`。当你在函数调用中创建承诺时，该承诺知道它应在调用作用域内被求值，但此时它并不会立即寻找任何变量；这一过程只有在承诺被实际求值时才会发生。\n\
  \n在 `f` 调用内部，你定义了函数 `g` 并将其返回。由于 `g` 是在 `f` 调用内部定义的，其环境被设置为该调用的求值作用域。这将使 `g` 之后知道如何获取\
  \ `x` 的值。它并不存储 `x` 本身，但可以在 `f` 调用的作用域中找到它——在那里，它发现 `x` 是一个应在 `h` 调用作用域内求值的承诺，而最终在\
  \ `h` 的作用域中，它将找到全局变量 `x`。这看起来已经非常复杂了，但无论何时你需要某个值，只需沿着父环境链查找，最终总能找到它。\n\n随后，`h(1)`\
  \ 调用定义了一个函数 `i` 并将其返回，你将其保存在全局变量 `i` 中。该函数的环境是 `h(1)` 调用的求值作用域，因此函数会在这个作用域中查找名称\
  \ `a` 和 `g`。\n\n现在，你终于调用了 `i(3)`。这首先创建了一个求值环境，将变量 `b` 设为 `3`（因为这是 `b` 对应的参数值）。接着你找到函数\
  \ `g`（即你之前创建的闭包），并用参数 `a+b` 和 `5` 调用 `g`。`5` 只是作为一个数字直接传递，你并不会将常量转换为承诺；然而，`a+b`\
  \ 会被惰性求值，因此它在调用 `g` 时是一个承诺。调用 `g` 时，你为它创建一个新的求值环境。在这个环境中，你存储了变量 `y` 和 `z`。前者被设为承诺\
  \ `a+b`，后者被设为 `5`。由于承诺应在它们被定义的地方（即此处调用作用域内）求值，这一信息与承诺一同存储。\n\n你对 `g(a + b, 5)` 的求值过程如下：首先需要找出\
  \ `x` 是什么，于是你在本地求值环境中查找，但没有找到。接着你在父环境中查找，找到了它，但发现它来自于 `h(1)` 环境的承诺，所以你现在需要到那里去找。那里也没有，于是你继续沿着父级链向下查找，最终在全局环境中找到它——值为\
  \ 2。然后你需要找出 `y` 是什么。你在本地环境中找到了 `y`，发现它是一个承诺 `a+b`，且该承诺应在 `i(3)` 环境中求值。在此环境中，你需要找到\
  \ `a` 和 `b`。`b` 可以直接在当前环境中找到，这很简单；但你需要到父环境中搜索 `a`。你在父环境中找到了它，因此可以将 `a+b` 求值为 `1+3`。这个值现在替换了\
  \ `y` 中的承诺。最后，你需要找出 `z`，但这至少很简单，它就是本地环境中存储的数字 `5`。现在你拥有了计算 `x + y + z` 所需的所有值，分别是\
  \ `2 + (1+3) + 5`，因此当从 `i(3)` 调用返回时，你得到返回值 11。\n\n环境图可能变得相当复杂，但寻找值的规则却非常简单。你只需沿着环境链查找。唯一容易让程序员困惑的陷阱就是惰性求值。不过这里的规则同样简单，只是不那么熟悉而已。承诺在它们被定义的作用域中被求值。因此，默认参数会在函数被定义时的环境中求值，而实际参数会在调用作用域中求值。当你访问一个参数时，它总会被求值，所以如果不想通过修改其他作用域的变量而对闭包环境产生副作用，你应该在创建闭包之前使用\
  \ `force`。\n\n花些时间仔细研读这个示例。一旦你理解了它，你就理解了环境的工作方式。其复杂性不会超过这个程度（当然，除非你开始胡乱摆弄环境！）。\n\
  \n\n\n### 操控环境\n\n那么，如何才能让环境的使用变得更加复杂呢？当然，你可以开始修改它们，并以各种新奇的方式将它们串联起来。你看，你不仅可以访问环境并向其中放入变量，还可以修改父环境的链。例如，你可以像这样通过更改求值环境的父环境来改变函数执行时的环境：\n\
  \n```\nf <- function() {\nmy_env <- environment()\nparent.env(my_env) <- parent.frame()\n\
  x\n}\ng <- function(x) f()\ng(2)\n## [1] 2\n```\n\n你并没有更改局部环境——这很难做到，因为如果没有它，你就没有地方存放变量值。不过，你是让它的父环境指向了函数调用环境，而不是函数被定义时的环境。如果你没有篡改父环境，`x`\
  \ 会在全局环境中被查找，但由于你将父环境设置为父框架，你反而会在调用者中开始查找，从而找到 `x`。\n\n以这种方式修改作用域的能力可以用于正途，但无疑也可以用于邪道。其工作原理并不复杂；如果你从上一节理解了环境图是如何运作的，那么当你开始修改父指针时，你也会理解它们是如何工作的。主要问题就在于环境是可变的，因此如果你在某个地方修改它们，就会在其他地方产生连锁反应。\n\
  \n考虑这个闭包的例子：\n\n```\nf <- function() {\nmy_env <- environment()\ncall_env <- parent.frame()\n\
  parent.env(my_env) <- call_env\ny\n}\ng <- function(x) {\nclosure <- function(y)\
  \ {\nz <- f()\nz + x\n}\nclosure\n}\nadd1 <- g(1)\nadd2 <- g(2)\n```\n\n这不过是编写一个数字加法闭包的复杂方式，但这里我们追求的不是优雅——而是观察修改环境会如何影响你。这里有一个函数\
  \ `f`，它将调用环境设置为自身的作用域，然后返回 `y`。由于 `y` 不是局部变量，必须在封闭作用域中查找，查找从父环境开始；这个父环境正是你刚刚更改为调用作用域的环境。在函数\
  \ `g` 中，你定义了一个闭包，它接受一个参数 `y`，然后调用 `f` 并将 `x` 加到调用的结果上。由于 `y` 是闭包的一个参数，`f` 从其（修改后的）父作用域中查找时就能看到它。由于\
  \ `x` 不是闭包的局部变量，它会在封闭作用域中查找，而该变量正是封闭函数的参数。\n\n它的工作方式和你预期的一样。虽然达到这个效果的方法很复杂，但代码中并没有陷阱。\n\
  \n```\nadd1(3)\n## [1] 4\nadd2(4)\n## [1] 6\n```\n\n出于马上就会明朗的原因，我只想向你展示，设置一个全局变量\
  \ `x` 并不会改变其行为。\n\n```\nx <- 3\nadd1(3)\n## [1] 4\nadd2(4)\n## [1] 6\n```\n\n这自然也是理所应当的。当你阅读闭包的定义时，可以看到它所引用的\
  \ `x` 是 `g` 的参数，而不是全局变量。\n\n但接下来，你要在不接触闭包本身的情况下破坏它。你只需在 `f` 中多做一件简单的事。不仅要改变 `f`\
  \ 的封闭作用域，还要对 `f` 的调用者做同样的操作。将 `f` 的调用者的父环境设置为其调用者，而不是它的封闭环境。\n\n```\nf <- function()\
  \ {\nmy_env <- environment()\ncall_env <- parent.frame()\nparent.env(my_env) <-\
  \ call_env\nparent.env(call_env) <- parent.frame(2)\ny\n}\n```\n\n你没有触碰闭包，即 `add1`\
  \ 和 `add2` 函数中的 `g`。你只是对 `f` 做了一个小小的改动。然而现在，如果你没有为 `x` 设置全局变量，加法函数就无法工作。这会引发一个错误。\n\
  \n```\nrm(x)\nadd1(3)\n```\n\n更糟糕的是，如果你确实有一个全局变量 `x`，你不会遇到错误，但也不会得到预期的结果。\n\n```\n\
  x <- 3\nadd1(3)\n## [1] 6\nadd2(4)\n## [1] 7\n```\n\n这里发生的情况，当然是将闭包的封闭作用域从 `g` 调用环境更改为了全局环境（这也是\
  \ `g` 的调用作用域及其父环境），所以现在你会从这里开始查找 `x`。`g` 调用的求值环境不再处于搜索路径上。\n\n尽管你可以这样修改环境，但必须有充分的理由才能这么做。改变完全不相关函数的行为会导致最糟糕的副作用。搞砸自己的函数是一回事，但不要去搞乱别人的函数。当然，你在这里只是修改了活跃的环境。你并没有永久性地损害任何函数；你只是搞乱了调用栈上函数调用的行为。如果你想永久性地搞乱函数，也可以使用\
  \ `environment` 函数来实现，但这样做通常是一个更慎重、经过深思熟虑的选择。\n\n不要去修改调用函数的作用域。如果你想改变所求解表达式的作用域，更好的做法是为其创建新的环境链，而不是修改已有的环境链。后者很容易产生不可预见的后果，而前者至少能将影响限制在你正在编写的函数之内。\n\
  \n\n### 显式创建环境\n\n你可以通过 `new.env` 函数创建一个新环境。默认情况下，该环境会将当前环境作为其父环境，并且你可以使用 `exists`\
  \ 和 `get` 等函数来检查它所包含的内容。\n\n```\nenv <- new.env()\nx <- 5\nexists(\"x\", env)\n\
  ## [1] TRUE\nget(\"x\", env)\n## [1] 5\nf <- function() {\nx <- 7\nnew.env()\n}\n\
  env2 <- f()\nget(\"x\", env2)\n## [1] 7\n```\n\n你也可以使用 `$` 下标运算符来访问它，但此时 R 不会向上搜索父环境列表来查找变量；只有当变量存在于该实际环境中时，你才能获取到它。\n\
  \n```\nenv$x\n## NULL\n```\n\n你可以使用 `assign` 或通过 `$<-` 函数向环境中赋值变量。\n\n```\nassign(\"\
  x\", 3, envir = env)\nenv$x\n## [1] 3\nenv$x <- 7\nenv$x\n## [1] 7\n```\n\n根据你对环境的用途，你可能不希望它拥有父环境。但并没有办法实现这一点。\n\
  \n```\nenv <- new.env(parent = NULL) # 这行不通！\n```\n\n所有环境都有父环境，但空环境除外。不过，你可以通过将空环境设为你新环境的父环境来达到次优效果。\n\
  \n```\nglobal_x <- \"foo\"\nenv <- new.env(parent = emptyenv())\nexists(\"global_x\"\
  , env)\n## [1] FALSE\n```\n\n你可以尝试用手动创建的环境做一些更有趣的事情，比如构建一个并行的调用栈，用来实现动态作用域而不是词法作用域。词法作用域是\
  \ R 中已有的作用域机制，其中函数调用的父环境是函数的定义域。而动态作用域则将调用环境作为父环境。在具有动态作用域的语言中，程序逻辑极难推理，因此我建议你避免使用它，但出于教学目的，你可以尝试实现它。\n\
  \n由于你不想实际修改调用栈和父环境指针，你需要创建一系列并行的环境，并将每个调用栈帧的内容复制到这些环境中。你可以像这样复制一个环境：\n\n```\ncopy_env\
  \ <- function(from, to) {\nfor (name in ls(from, all.names = TRUE)) {\nassign(name,\
  \ get(name, from), to)\n}\n}\n```\n\n为了说明问题，你需要一个函数来展示当你沿着环境链向下直到全局环境时，每个环境中可以看到哪些名称。你不想一路向下直到空环境，所以你可以提前停止。这个函数让你做到这一点：\n\
  \n```\nshow_env <- function(env) {\nif (!identical(env, globalenv())) {\nprint(env)\n\
  print(names(env))\nshow_env(parent.env(env))\n}\n}\n```\n\n现在轮到创建并行环境链的函数了。这并不难；你可以使用\
  \ `parent.frame` 来获取调用栈上任意深度的帧——实际上，可以一直向下到第一个函数调用——并且你可以使用 `sys.nframe` 函数来获取调用栈的深度。唯一需要注意的是，你需要将栈深度调整\
  \ 1，因为你希望为函数的调用者（而不是函数本身）创建调用栈链。剩下的部分只是一个循环。\n\n```\nbuild_caller_chain <- function()\
  \ {\nn <- sys.nframe() - 1\nenv <- globalenv()\nfor (i in seq(1,n)) {\nenv <- new.env(parent\
  \ = env)\nframe <- parent.frame(n - i + 1)\ncopy_env(frame, env)\n}\nenv\n}\n```\n\
  \n要看到它的实际效果，你需要设置一个相当复杂的示例，其中同时包含嵌套作用域和调用栈。它看起来不太美观，但请尝试理解它，并思考函数环境应该是什么样子，以及调用栈应该是什么结构。\n\
  \n```\nf \n## [1] \"z\"\n## \n## [1] \"y\"\n## \n## [1] \"x\"\n## [1] \"---Calling\
  \ environments---\"\n## \n## [1] \"z\"\n## \n## [1] \"x\" \"y\"\n```\n\n当你调用 `h`\
  \ 时，它会调用 `g`，你会得到一个环境列表，从包含 `z` 的最内层开始，一直到包含 `x` 的、全局环境之前的最后一个层级。在（并行的）调用栈上，你首先也会看到一个\
  \ `z`（它位于函数环境的副本中，但确实存在），但这个链只有两步长，第二个环境包含了 `x` 和 `y`。\n\n你可以使用这里构建的栈链来实现动态作用域。你只需要在这个链所定义的作用域内求值表达式，而不是在当前求值环境中。`<<-`\
  \ 赋值运算符不会起作用——你需要编写一个类似的函数来获得该行为，并且关于对这个链所做的更改在多大程度上应该被写回到实际调用栈帧中，这将是一个设计选择。然而，只要涉及表达式求值，你就可以将其用于动态作用域。\n\
  \n### 环境与表达式求值\n\n最后，本节介绍如何将表达式和环境结合起来计算值。好消息是，你已经度过了所有困难的部分，在经历了前面所有内容之后，这变得非常简单。你只需要在任何选定的环境链中求值一个表达式，就是将其提供给\
  \ `eval` 函数。你可以在以下示例中看到这一点，该示例在词法作用域和动态作用域中求值同一个表达式：\n\n```\nf <- function() {\n\
  x <- 1\nfunction() {\ny <- 2\nfunction() {\nz <- 3\ncat(\"Lexical scope: \", x +\
  \ y + z, \"\\n\")\ncall_env <- build_caller_chain()\ncat(\"Dynamic scope: \", eval(quote(x\
  \ + y + z), call_env), \"\\n\")\n}\n}\n}\ng <- f()()\nh <- function() {\nx <- 4\n\
  y <- 5\ng()\n}\nh()\n## Lexical scope:  6\n## Dynamic scope:  12\n```\n\n使用环境时，真正的难点实际上不在于求值。而在于操作它们。\n\
  \n脚注\n\n如果你想给你的环境命名，你可以设置 `\"name\"` 属性。不过通常你并不需要这样做。\n\n严格来说，导入其他包的方法远比我这里解释的要多，但这超出了本书的范围。\n\
  \n如果你查看 `new.env` 的文档，你会看到默认参数实际上是 `parent.frame()`。仔细想想，这就是它成为当前环境的方式：当你调用 `new.env`\
  \ 时，当前环境将成为它的父框架。\n\n\n\n"
- "# 操作表达式\n\n使用`quote()`函数创建的表达式共有四种类型：原始值、名称、函数调用或控制结构，以及点对列表。函数调用包含算术或逻辑运算符等运算符，因为在\
  \ R 中这些也是函数调用，而控制结构可以被视为一种特殊的函数调用——它们与函数调用的真正区别仅在于调用时使用的语法。\n\n```\nclass(quote(1))\n\
  ## [1] \"numeric\"\nclass(quote(\"foo\"))\n## [1] \"character\"\nclass(quote(TRUE))\n\
  ## [1] \"logical\"\nclass(quote(x))\n## [1] \"name\"\nclass(quote(f(x)))\n## [1]\
  \ \"call\"\nclass(quote(2+2))\n## [1] \"call\"\nclass(quote(if (TRUE) \"foo\" else\
  \ \"bar\"))\n## [1] \"if\"\nclass(quote(for (x in 1:3) x))\n## [1] \"for\"\n```\n\
  \n其中，调用和控制结构显然更有趣；值和符号则非常简单，可操作空间不大。点对列表用于处理函数参数，因此除非你在处理函数参数，否则不会在表达式中看到它们。另一方面，调用和控制结构捕捉了表达式中的操作；你可以将它们视为列表，从而可以检查并修改它们。我相信，以这种方式处理表达式是最简单的方法，也是本章的主题。另一种互补的方法是为变量替换值，这将是下一章的主题。\n\
  \n在下一节你了解了表达式的基础知识后，本章剩余部分将介绍一些现实世界中可能用到的元编程示例。你可以在本书可下载源代码的`dfdr`包中找到这些示例的完整版本，该代码可通过[www.apress.com/9781484228807](http://www.apress.com/9781484228807)获取。\n\
  \n### 表达式基础\n\n函数调用和控制结构都可以作为列表来操作。在这两者中，我将主要关注调用，因为根据我的经验，它们在程序中更常被修改。那么，我们先来处理控制结构。我只会描述`if`和`for`；其余的控制结构类似。\n\
  \n#### 访问和操作控制结构\n\n包含控制结构的语句与 R 中的任何其他表达式一样，你可以使用`quote()`创建它们的未求值版本。正如我之前解释的，你可以将这个表达式对象视为一个列表。因此，你可以获取对象的长度，并访问对象中的元素。对于单个`if`语句，你会得到一个长度为\
  \ 3 的表达式；而对于`if-else`语句，你会得到一个长度为 4 的表达式。第一个元素是名称`if`。对于所有控制结构和函数调用，第一个元素始终是函数名，因此如果你将控制结构视为语法略为奇特的函数，就完全不必将它们视为特殊情况。第二个元素是`if`语句中的测试条件，之后是语句的主体部分。如果是`if-else`语句，第四个元素就是表达式的`else`部分。\n\
  \n```\nx <- quote(if (foo) bar)\nlength(x)\n## [1] 3\nx[[1]]\n## `if`\nx[[2]]\n\
  ## foo\nx[[3]]\n## bar\ny <- quote(if (foo) bar else baz)\nlength(y)\n## [1] 4\n\
  y[[1]]\n## `if`\ny[[2]]\n## foo\ny[[3]]\n## bar\ny[[4]]\n## baz\n```\n\n对于`for`循环，你会得到一个长度为\
  \ 4 的表达式，其中第一个元素当然是名称`for`。第二个是迭代变量，第三个是你迭代的表达式，第四个是循环体。\n\n```\nz <- quote(for\
  \ (x in 1:4) print(x))\nlength(z)\n## [1] 4\nz[[1]]\n## `for`\nz[[2]]\n## x\nz[[3]]\n\
  ## 1:4\nz[[4]]\n## print(x)\n```\n\n你可以像求值任何其他表达式一样求值这些控制结构。\n\n```\neval(z)\n##\
  \ [1] 1\n## [1] 2\n## [1] 3\n## [1] 4\n```\n\n你可以通过为其组件赋值来修改它们，从而在求值前改变其行为。下面是一个改变循环对象的示例：\n\
  \n```\nz[[3]] <- 1:2\neval(z)\n## [1] 1\n## [1] 2\n```\n\n下面是一个改变函数体内操作的示例：\n\n\
  ```\nz[[4]] <- quote(print(x + 2))\neval(z)\n## [1] 3\n## [1] 4\n```\n\n下面是一个改变索引变量和循环体的示例：\n\
  \n```\nz[[2]] <- quote(y)\nz[[4]] <- quote(print(y))\neval(z)\n## [1] 1\n## [1]\
  \ 2\n```\n\n#### 访问和操作函数调用\n\n对于函数调用，其类是`call`，当你将它们视为列表时，第一个元素是被调用函数的名称，其余元素是函数调用的参数。\n\
  \n```\nx <- quote(f(x,y,z))\nclass(x)\n## [1] \"call\"\nlength(x)\n## [1] 4\nx[[1]]\n\
  ## f\nx[[2]]\n## x\nx[[3]]\n## y\nx[[4]]\n## z\n```\n\n你可以使用`is.call()`函数测试一个表达式是否是函数调用。\n\
  \n```\nis.call(quote(x))\n## [1] FALSE\nis.call(quote(f(x)))\n## [1] TRUE\n```\n\
  \n在这里，你无法访问任何函数体、环境或类似的东西。这仅仅是一个函数名；直到你求值表达式时，你才需要将这个名称与实际的函数关联起来。当然，你始终可以使用`eval()`来求值函数调用，并且如果需要改变求值方式，你可以修改表达式。\n\
  \n```\nx <- quote(sin(2))\neval(x)\n## [1] 0.9092974\nx[[1]] <- quote(cos)\neval(x)\n\
  ## [1] -0.4161468\nx[[2]] <- 0\neval(x)\n## [1] 1\n```\n\n请注意，最后一条赋值语句中我没有引用零（0）；这并非必须，因为数值已经是表达式，不需要被引用。\n\
  \n要探查一个表达式，通常需要一个递归函数。递归中的两种基本情况是`is.atomic()`（用于值）和`is.name()`（用于符号），递归情况包括`is.call()`（用于函数调用）以及如果你想处理点对列表则用`is.pairlist()`。在下面的函数中，它只是打印出表达式的结构（此函数未处理表达式是点对列表的情况）：\n\
  \n```\nf <- function(expr, indent = \"\") {\n  if (is.atomic(expr)) {\n    print(paste0(indent,\
  \ expr))\n  } else if (is.name(expr)) {\n    print(paste0(indent, deparse(expr)))\n\
  \  } else if (is.call(expr)) {\n    print(paste0(indent, deparse(expr[[1]])))\n\
  \    n <- length(expr)\n    if (n > 1) {\n      new_indent <- paste0(indent, \"\
  \  \")\n      for (i in 2:n) {\n        f(expr[[i]], new_indent)\n      }\n    }\n\
  \  } else {\n    print(paste0(indent, \"未预料到的表达式: \", expr[[1]]))\n  }\n}\nf(quote(2\
  \ + 3*(x + y)))\n## [1] \"+\"\n## [1] \"  2\"\n## [1] \"  *\"\n## [1] \"    3\"\n\
  ## [1] \"    (\"\n## [1] \"      +\"\n## [1] \"        x\"\n## [1] \"        y\"\
  \n```\n\n你可能会觉得这里的输出有点奇怪，但它捕捉到了表达式`2+3*(x+y)`的结构。最外层的函数调用是`+`函数，它有两个参数：`2`和对`*`的调用。对`*`的调用也有两个参数——理所当然——其中一个是`3`，另一个是对函数`(`的调用。如果你觉得这很奇怪，那么欢迎加入我们，但在\
  \ R 中圆括号就是函数。对`(`的调用只有一个参数，这个参数恰好是对`+`的函数调用，其参数是`x`和`y`。\n\n以上就是直接操作函数调用的全部内容，当然，这些简单的工具可以做很多事情。接下来的几节将展示如何使用它们来实现强大的效果。\n\
  \n\n\n### 表达式简化\n\n为了直观展示表达式的处理过程，我们考虑一个简化表达式的场景。假设你想要计算那些可以立即求值的子表达式（因为它们仅由不依赖变量的原子值组成），并希望化简乘以\
  \ 1 或加 0 的操作。大致如下：\n\n```r\nsimplify_expr(quote(2*(0 + ((4 + 5)*x)*1)))\n## 2 *\
  \ (9 * x)\n```\n\n这并非完美；如果真正简化表达式，你会发现可以重新排列括号并将 2 乘以 9，但此处你仅对表达式进行局部化简，并不尝试重写它们。\n\
  \n由于你处理的是表达式，需要一个递归函数来处理基本案例（原子值和名称）以及递归案例（调用和成对列表）。你预料到表达式中不会出现成对列表，因此如果遇到除原子、名称或调用对象之外的内容，就直接放弃。如果遇到任何基本案例，直接返回该值——你无法进一步简化它们。对于调用对象，你会调用一个名为`simplify_call`的函数，该函数负责处理调用。\n\
  \n```r\nsimplify_expr <- function(expr) {\nif (is.atomic(expr) || is.name(expr))\
  \ {\nexpr\n} else if (is.call(expr)) {\nsimplify_call(expr)\n} else {\nstop(paste0(\"\
  Unexpected expression \",\ndeparse(expr),\n\" in simplifying\"))\n}\n}\n```\n\n\
  对于调用的简化，我并不会尝试简化函数调用。我不知道任何泛型函数的具体行为，因此几乎无法简化涉及函数的表达式。不过，我假设在简化表达式时，其中的函数表现为具有按值调用语义，并且会简化它们的参数。这是一个假设，可能是错误的，但针对本练习，你可以这样假定。因此，对于一般函数调用，我只需简化其参数。对于算术表达式，我会尝试进一步简化。我也可以对其他操作进行类似处理，但仅处理算术运算符足以展示处理运算符的细节，我相信亲爱的读者，如果需要，你能够自行处理其他运算符。\n\
  \n调用处理可以写成这样：\n\n```r\nsimplify_call <- function(expr) {\nif (expr[[1]] == as.name(\"\
  +\"))\nreturn(simplify_addition(expr[[2]], expr[[3]]))\nif (expr[[1]] == as.name(\"\
  -\")) {\nif (length(expr) == 2)\nreturn(simplify_unary_subtraction(expr[[2]]))\n\
  else\nreturn(simplify_subtraction(expr[[2]], expr[[3]]))\n}\nif (expr[[1]] == as.name(\"\
  *\"))\nreturn(simplify_multiplication(expr[[2]], expr[[3]]))\nif (expr[[1]] == as.name(\"\
  /\"))\nreturn(simplify_division(expr[[2]], expr[[3]]))\nif (expr[[1]] == as.name(\"\
  ^\"))\nreturn(simplify_exponentiation(expr[[2]], expr[[3]]))\nif (expr[[1]] == as.name(\"\
  (\")) {\nsubexpr <- simplify_expr(expr[[2]])\nif (is.atomic(subexpr) || is.name(subexpr))\n\
  return(subexpr)\nelse if (is.call(subexpr) && subexpr[[1]] == as.name(\"(\"))\n\
  return(subexpr)\nelse\nreturn(call(\"(\", subexpr))\n}\nsimplify_function_call(expr)\n\
  }\n```\n\n这段代码大多不言自明，但仍有几点需要说明：首先，你需要用名称对象来比较调用名。它们实际上并非字符串，而是`name`类型；因此需要使用`as.name`。其次，减号有两种形式：二元减法和一元取反。你可以通过检查调用有\
  \ 1 个还是 2 个参数来区分它们（即长度是 2 还是 3；记住第一个元素是调用名），并用两个不同的函数来处理这两种情况。第三，括号也是调用，因此你需要处理它们。你只需获取括号内的表达式。如果该内容不需要括号（单个值、名称或已被括号包围的表达式），则直接返回该子表达式。否则，在其周围加上括号。最后，如果不知如何处理，就将该表达式视为函数调用。\n\
  \n现在，你依次处理每个运算符。它们处理方式类似，区别仅在于各运算符可简化的情况不同。对于加法，你可以消除加 0 的情况；如果两个参数都是数字，则可直接求值。否则，需要返回一个带有已简化操作数的`+`调用。\n\
  \n```r\nsimplify_addition <- function(f, g) {\nleft <- simplify_expr(f)\nright <-\
  \ simplify_expr(g)\nif (left == 0) return(right)\nif (right == 0) return(left)\n\
  if (is.numeric(left) && is.numeric(right))\nreturn(left + right)\ncall(\"+\", left,\
  \ right)\n}\n```\n\n如果一元减法的参数是数字，你可以直接求值。否则，可以消除参数中已有的负号（因为两个负号得正）。如果其他方法都失败，则只能返回带有负号的简化表达式。\n\
  \n```r\nsimplify_unary_subtraction <- function(f) {\nsimplified <- simplify_expr(f)\n\
  if (is.numeric(simplified))\n-simplified\nelse if (is.call(simplified) && simplified[[1]]\
  \ == \"-\")\nsimplified[[2]]\nelse\nbquote(-.(simplified))\n}\n```\n\n最后这种情况，你将使用`bquote`函数。它的功能类似于`quote`，但可以在`.(...)`处替换值。因此，你本质上是在写`quote(-simplified)`，只不过将简化后的表达式插入到了表达式中。\n\
  \n二元减法与加法类似，但当从 0 中减去时，需要多做一点工作。这里，你需要再次使用`bquote`：\n\n```r\nsimplify_subtraction\
  \ <- function(f, g) {\nleft <- simplify_expr(f)\nright <- simplify_expr(g)\nif (left\
  \ == 0) {\nif (is.numeric(right))\nreturn(-right)\nelse\nreturn(bquote(-.(right)))\n\
  }\nif (right == 0)\nreturn(left)\nif (is.numeric(left) && is.numeric(right))\nreturn(left\
  \ - right)\ncall(\"-\", left, right)\n}\n```\n\n对于乘法，你可以简化涉及 0 或 1 的情况，但除此之外，该函数与之前所见类似。\n\
  \n```r\nsimplify_multiplication <- function(f, g) {\nleft <- simplify_expr(f)\n\
  right <- simplify_expr(g)\nif (left == 0 || right == 0)\nreturn(0)\nif (left ==\
  \ 1)\nreturn(right)\nif (right == 1)\nreturn(left)\nif (is.numeric(left) && is.numeric(right))\n\
  return(left * right)\ncall(\"*\", left, right)\n}\n```\n\n除法和乘方只是类似的更多处理，但需要处理不同的情况。\n\
  \n```r\nsimplify_division <- function(f, g) {\nleft <- simplify_expr(f)\nright <-\
  \ simplify_expr(g)\nif (right == 1)\nreturn(left)\nif (is.numeric(left) && is.numeric(right))\n\
  return(left / right)\ncall(\"/\", left, right)\n}\nsimplify_exponentiation <- function(f,\
  \ g) {\nleft <- simplify_expr(f)\nright <- simplify_expr(g)\nif (right == 0) return(1)\n\
  if (left == 0) return(0)\nif (left == 1) return(1)\nif (right == 1) return(left)\n\
  if (is.numeric(left) && is.numeric(right))\nreturn(left ^ right)\ncall(\"^\", left,\
  \ right)\n}\n```\n\n你需要的最后一个函数是函数调用的简化。这里，你只需在返回调用之前简化函数的所有参数。你可以将参数收集到一个列表中，并用如下表达式创建函数调用：\n\
  \n\n\n`do.call(\"call\", c(list(function_name), arguments))`\n\n这会以列表形式接受参数，并在对`call`的调用中将其转换为参数。如果`function_name`的值是函数名称，这将正常工作，但像`f(x,y)(z)`这样的表达式也是函数调用；此处函数`name`是`f(x,y)`，参数是`z`。无法将这样的表达式包装在对`call`的调用中，但可以使用`as.call`直接获取一个列表并将其转换为调用。\n\
  \n```\nsimplify_function_call <- function(expr) {\nfunction_name <- expr[[1]]\n\
  arguments <- vector(\"list\", length(expr) - 1)\nfor (i in seq_along(arguments))\
  \ {\narguments[i] <- list(simplify_expr(expr[[i + 1]]))\n}\nas.call(c(list(function_name),\
  \ arguments))\n}\n```\n\n出于同样的原因，必须修补`simplify_call`函数。在此函数中，将`expr[[1]]`与名称进行比较以分派到各种算术运算符。这仅在`expr[[1]]`是名称时才有效，因此必须确保仅在其为名称时才进行这些比较。\n\
  \n```\nsimplify_call <- function(expr) {\nif (is.name(expr[[1]])) {\n### Dispatch\
  \ to operators...\n}\nsimplify_function_call(expr)\n}\n```\n\n你也可以尝试更激进的做法，尝试在函数的所有参数都是值且已知函数功能时对其求值——或者至少合理预期你能够知道。你总是可以检查是否能在相关环境中找到该名称，以及它是否是一个函数，但由于你在简化表达式时不期望知道非函数的变量，要求所有函数符号都已知可能要求过高。尽管如此，你可以说像`sin`、`cos`、`exp`、`log`这样的函数是它们通常的自身，然后执行如下操作：\n\
  \n```\nsimplify_function_call <- function(expr) {\nfunction_name <- expr[[1]]\n\
  arguments <- vector(\"list\", length(expr) - 1)\nfor (i in seq_along(arguments))\
  \ {\narguments[i] <- list(simplify_expr(expr[[i + 1]]))\n}\nif (all(unlist(Map(is.numeric,\
  \ arguments)))) {\nif (as.character(function_name) %in%\nc(\"sin\", \"cos\", \"\
  exp\", \"log\")) {\nresult <- do.call(as.character(function_name), arguments)\n\
  return(result)\n}\n}\nas.call(c(list(function_name), arguments))\n}\n```\n\n现在你有了一个能在一定程度上简化表达式的简单程序。\n\
  \n```\nsimplify_expr(quote(2*(0 + ((4 + 5)*x)*1)))\n## 2 * (9 * x)\n```\n\n两种函数调用解决方案都无法处理命名参数。你只需处理位置参数，并丢弃名称信息。\n\
  \n```\nf <- function(x, y) x\nexpr1 <- quote(f(x = 2, y = 1))\nexpr2 <- quote(f(y\
  \ = 2, x = 1))\neval(expr1)\n## [1] 2\neval(expr2)\n## [1] 1\nsimplify_expr(expr1)\n\
  ## f(2, 1)\nsimplify_expr(expr2)\n## f(2, 1)\neval(simplify_expr(expr1))\n## [1]\
  \ 2\neval(simplify_expr(expr2))\n## [1] 2\n```\n\n不过，修补这个问题并不困难。在处理函数调用时，使用命名参数无需特殊操作；只需通过`names`函数访问它们即可。\n\
  \n```\nnames(expr1)\n## [1] \"\"  \"x\" \"y\"\nnames(expr2)\n## [1] \"\"  \"y\"\
  \ \"x\"\n```\n\n如果确保简化结果与原始表达式具有相同的名称，那么就没问题了。\n\n```\nsimplify_function_call <-\
  \ function(expr) {\nfunction_name <- expr[[1]]\narguments <- vector(\"list\", length(expr)\
  \ - 1)\nfor (i in seq_along(arguments)) {\narguments[i] <- list(simplify_expr(expr[[i\
  \ + 1]]))\n}\nresult <- as.call(c(list(function_name), arguments))\nnames(result)\
  \ <- names(expr)\nresult\n}\nsimplify_expr(expr1)\n## f(x = 2, y = 1)\nsimplify_expr(expr2)\n\
  ## f(y = 2, x = 1)\neval(simplify_expr(expr1))\n## [1] 2\neval(simplify_expr(expr2))\n\
  ## [1] 1\n```\n\n## 自动微分\n\n作为第二个仅略复杂的示例，我们考虑自动微分，即自动将计算表达式的函数转换为计算其导数的函数。我假设你有一个函数，其函数体只包含一个表达式——不涉及控制结构或语句序列，仅是一个算术表达式——然后递归遍历此表达式，应用微分规则。尽管你在此元编程中所做的比刚刚实现的表达式简化更复杂，但你会发现程序的形式是相似的。\n\
  \n我们从主函数开始，将其命名为`d`表示微分。它接受两个参数：待微分的函数和求导的变量。如果你希望函数能够处理内置数学函数，则需要将这些函数作为特例处理。这些函数以所谓的原始（primitive）函数形式实现，没有函数体。你需要在`d`函数中显式处理它们。对于所有其他函数，只需计算函数体中表达式的导数。如果你想返回一个新的导数函数，可以修改原函数并替换其函数体。由于\
  \ R 不允许修改函数参数，这将创建一个副本供返回，同时保留原函数不变。以这种方式重用参数可确保新函数与原函数具有相同的参数、名称和默认值。它还确保导数具有与原函数相同的封闭环境，这在求值时可能很重要。\n\
  \n`d`函数可以如下所示，这里我只处理了三个原始函数——其余函数留作练习：\n\n```\nd <- function(f, x) {\nif (is.null(body(f)))\
  \ {\nif (identical(f, sin)) return(cos)\nif (identical(f, cos)) return(function(x)\
  \ -sin(x))\nif (identical(f, exp)) return(exp)\nstop(\"unknown primitive\")\n} else\
  \ {\ndf <- f\ne <- environment(f)\nbody(df) <- simplify_expr(diff_expr(body(f),\
  \ x, e))\ndf\n}\n}\n```\n\n你将函数环境随递归一起传递，因为稍后处理函数调用时需要用到它。届时，你需要查找函数并分析它们接受哪些参数，以便应用链式法则。目前，你只需在递归中将其传递下去。\n\
  \n出于美观原因，你使用上一节编写的代码简化从`f`的函数体微分得到的表达式。你可以像这样使用`d`：\n\n```\nf <- function(x) x²\
  \ + sin(x)\ndf <- d(f, \"x\")\ndf\n## function (x)\n## 2 * x + cos(x)\n```\n\n为了计算函数体的导数，你遵循表达式简化中使用的模式：编写一个用于处理表达式的递归函数，在该函数中，将函数调用分派到不同算术运算的不同情况。\n\
  \n递归函数的两个基本情形是数字和名称。我们假设你不会遇到其他原子值（如逻辑向量）；反正你也不知道如何对它们求导。对于数字，导数始终是 0；而对于名称，则取决于它是否是你对其求导的变量还是其他变量。函数调用的递归情形是，你只需调用另一个函数来处理该情形。\n\
  \n```\ndiff_expr <- function(expr, x, e) {\nif (is.numeric(expr)) {\nquote(0)\n\
  } else if (is.name(expr)) {\nif (expr == x) quote(1)\nelse quote(0)\n} else if (is.call(expr))\
  \ {\ndiff_call(expr, x, e)\n} else {\nstop(paste0(\"Unexpected expression \",\n\
  deparse(expr), \" in parsing.\"))\n}\n}\n```\n\n\n\n### 函数调用与表达式求导\n\n#### 调用分发策略\n\
  \n对于调用，你需要根据调用类型进行分发。因此，通过为每个运算符定义函数来处理算术表达式，而处理括号的方式与你之前在表达式简化和不同函数调用求导时的方式类似。\n\
  \n你同样需要将原始函数（primitive functions）和用户定义函数作为两个独立的案例来处理。对于用户定义函数，你可以对其进行分析，找出其形式参数，并应用链式法则。对于原始函数，`formals`会返回一个空列表，因此该策略不适用于它们。所以，你需要将它们作为特例来处理。\n\
  \n这里假设你有一个包含原始函数名称的列表。例如，如果你只需要处理以下三种情况，可以这样定义：\n\n```r\n.built_in_functions <-\
  \ c(\"sin\", \"cos\", \"exp\")\n```\n\n根据需要扩展该列表。\n\n处理函数调用的函数如下所示：\n\n```r\ndiff_call\
  \ <- function(expr, x, e) {\nif (is.name(expr[[1]])) {\nif (expr[[1]] == as.name(\"\
  +\"))\nreturn(diff_addition(expr[[2]], expr[[3]], x, e))\nif (expr[[1]] == as.name(\"\
  -\")) {\nif (length(expr) == 2)\nreturn(call(\"-\", diff_expr(expr[[2]], x, e)))\n\
  else\nreturn(diff_subtraction(expr[[2]], expr[[3]], x, e))\n}\nif (expr[[1]] ==\
  \ as.name(\"*\"))\nreturn(diff_multiplication(expr[[2]], expr[[3]], x, e))\nif (expr[[1]]\
  \ == as.name(\"/\"))\nreturn(diff_division(expr[[2]], expr[[3]], x, e))\nif (expr[[1]]\
  \ == as.name(\"^\"))\nreturn(diff_exponentiation(expr[[2]], expr[[3]], x, e))\n\
  if (expr[[1]] == as.name(\"(\")) {\nsubexpr <- diff_expr(expr[[2]], x, e)\nif (is.atomic(subexpr)\
  \ || is.name(subexpr))\nreturn(subexpr)\nelse if (is.call(subexpr) && subexpr[[1]]\
  \ == as.name(\"(\"))\nreturn(subexpr)\nelse\nreturn(call(\"(\", subexpr))\n}\n}\n\
  if (is.name(expr[[1]]) &&\nas.character(expr[[1]]) %in% .built_in_functions)\nreturn(diff_built_in_function_call(expr,\
  \ x, e))\nelse\nreturn(diff_general_function_call(expr, x, e))\n}\n```\n\n#### 算术运算求导\n\
  \n处理算术运算时，只需遵循你在微积分课上学到的规则。\n\n```r\ndiff_addition <- function(f, g, x, e) {\ncall(\"\
  +\", diff_expr(f, x, e), diff_expr(g, x, e))\n}\ndiff_subtraction <- function(f,\
  \ g, x, e) {\ncall(\"-\", diff_expr(f, x, e), diff_expr(g, x, e))\n}\ndiff_multiplication\
  \ <- function(f, g, x, e) {\n# f' g + f g'\ncall(\"+\",\ncall(\"*\", diff_expr(f,\
  \ x, e), g),\ncall(\"*\", f, diff_expr(g, x, e)))\n}\ndiff_division <- function(f,\
  \ g, x, e) {\n# (f' g − f g' )/g**2\ncall(\"/\",\ncall(\"-\",\ncall(\"*\", diff_expr(f,\
  \ x, e), g),\ncall(\"*\", f, diff_expr(g, x, e))),\ncall(\"^\", g, 2))\n}\ndiff_exponentiation\
  \ <- function(f, g, x, e) {\n#### 使用链式法则进行通用处理。\ndydf <- call(\"*\", g,\ncall(\"\
  ^\", f, substitute(n - 1, list(n = g))))\ndfdx <- diff_expr(f, x, e)\ncall(\"*\"\
  , dydf, dfdx)\n}\n```\n\n### 函数调用与链式法则\n\n对于函数调用，你需要应用链式法则。对于原始函数，你无法获取形式参数列表，因此无法通过检查函数本身来处理它们；你必须使用它们的名称来确定其参数和导数。下面展示了一些案例，但我会将其他函数的处理留作练习：\n\
  \n```r\ndiff_built_in_function_call <- function(expr, x, e) {\n# chain rule with\
  \ a known function to differentiate...\nif (expr[[1]] == as.name(\"sin\"))\nreturn(call(\"\
  *\", call(\"cos\", expr[[2]]),\ndiff_expr(expr[[2]], x, e)))\nif (expr[[1]] == as.name(\"\
  cos\"))\nreturn(call(\"*\", call(\"-\", call(\"sin\", expr[[2]])),\ndiff_expr(expr[[2]],\
  \ x, e)))\nif (expr[[1]] == as.name(\"exp\"))\nreturn(call(\"*\", call(\"exp\",\
  \ expr[[2]]),\ndiff_expr(expr[[2]], x, e)))\n}\n```\n\n对于其他函数调用，你可以通过检查该函数来找出它包含哪些变量，并对这些变量应用链式法则。这种方法仅在你能确定所引用的是哪个函数时有效，因此无法处理需要计算函数值的情况。在这些情况下，你只能放弃。然而，如果你拥有函数的符号名称，你可以查找并检查它。但这对于一般用途来说并不完全安全。如果你计算了一个函数的导数，然后更改了它所引用的全局函数，那么该导数将使用旧的全局函数，而实际函数则使用新的全局函数。对此你几乎无能为力。在应用链式法则时，你需要知道函数接受哪些参数。这意味着你需要知道你正在处理的是哪个函数。\n\
  \n你可以假设函数调用中使用的参数是应用链式法则时需要考虑的相关参数。那些未在函数调用中传递的参数将具有默认值，并且不会依赖于传递给导数函数的参数，因此你可以忽略它们。因此，你可以获取函数调用中的参数，并对它们求和以应用链式法则。你需要知道这些参数的名称来计算函数的导数，并且需要处理位置参数和命名参数，这正是你需要查找实际函数的地方。\n\
  \n在递归过程中传递的环境——即你要计算其导数的原始函数的环境——中，你查找需要应用链式法则的函数。有了该函数，你可以使用`match.call`函数来获取函数调用中所有参数的名称。`match.call`函数负责合并命名参数和位置参数。对于每个参数，你通过将函数更改为其对相应变量的导数来构建一个函数调用。你使用`bquote`函数调用`d`来计算这些导数。然后，你将函数调用与原始变量的参数导数相乘。将这些项求和就完成了链式法则。\n\
  \n```r\ndiff_general_function_call <- function(expr, x, e) {\nfunction_name <- expr[[1]]\n\
  if (!is.name(function_name))\nstop(paste0(\"Unexpected call \", deparse(expr)))\n\
  func <- get(as.character(function_name), e)\nfull_call <- match.call(func, expr)\n\
  variables <- names(full_call)\narguments <- vector(\"list\", length(full_call) -\
  \ 1)\nfor (i in seq_along(arguments)) {\nvar <- variables[i + 1]\ndfdz <- full_call\n\
  dfdz[[1]] <- bquote(d(.(function_name), .(var)))\ndzdx <- diff_expr(expr[[i + 1]],\
  \ x, e)\narguments[[i]] <- bquote(.(dfdz) * .(dzdx))\n}\nas.call(c(list(sum), arguments))\n\
  }\n```\n\n### 注意事项与局限\n\n这个解决方案有一个注意事项：即使原始函数是向量化的，其导数也不会是向量化的。例如，如果你定义以下函数，那么`g`和`h`应该是相同的函数：\n\
  \n```r\nf <- function(x, y) x² * y\ng <- function(z) f(2*z, z²)\nh <- function(z)\
  \ 4*z⁴\n```\n\n然而，如果你计算`d(g,\"z\")`和`d(h,\"z\")`，并用一个向量值调用它们，前者会将所有结果相加，而后者会返回一个向量值。`d(g,\"\
  z\")`导数中的`sum`调用会吞掉所有值。你可以通过在`d(g,\"z\")`上调用`Vectorize`来解决这个问题。\n\n除此之外，你现在拥有一个元程序，可以将函数转换为其导数。它并不能处理所有可能的函数；函数必须能够计算简单表达式。链式法则只能应用于通过名称引用的已知函数，并且你只处理了部分原始函数，但我相信你可以看出如何在现有基础上构建更多功能。\n\
  \n## 脚注\n\n1 在 R 语言中可以修改数据的程度上。当然，你是在使用替换运算符创建新对象。\n\n2 它们基本上只是调用（call）的特殊情况。`is.call`函数会为它们返回`TRUE`，并且处理它们的方式没有区别。唯一的区别在于编写控制结构表达式与函数调用的语法上。\n\
  \n\n\n"
- '# 5. 使用替换处理表达式


  你可以将表达式当作字符串进行处理和操作，也可以通过将变量替换为表达式来修改它们。此外，你还可以使用更高级的引用来构建表达式，并在字符串与表达式之间进行转换。


  ## 关于引用的更多内容


  本章首先快速回顾引用机制。你已经了解了如何引用表达式，但除了创建一字不差的表达式之外，你还能做更多事情。我之前详细讨论过 `quote` 函数，但只是顺带提过
  `bquote` 函数。`bquote` 函数允许你创建仅部分引用的表达式——你可以在创建表达式时求值某些部分，而将其他部分留待以后处理。`quote` 会将整个表达式包裹在引号中，而
  `bquote` 函数则会对表达式进行部分替换。调用 `bquote` 的方式与调用 `quote` 类似，都传入一个表达式，但任何包裹在“点”函数调用（即写为
  `.(...)`）中的子表达式都不会被引用，而是会被求值，并将求值结果放入你正在构建的表达式中。如果你使用 `bquote` 时没有使用 `.(...)`，它的行为就和
  `quote` 一样。


  ```

  quote(x + y)

  ## x + y

  bquote(x + y)

  ## x + y

  bquote(.(2+2) + y)

  ## 4 + y

  ```


  你在微分程序中构建链式法则的项时就用到了 `bquote`。这里你使用了 `bquote(.(dfdz) * .(dzdx))` 来构建微分函数与微分自变量的乘积；而
  `dfdz` 和 `dzdx` 的构建方式分别是：对于 `dfdz`，再次使用 `bquote` 构建一个微分函数（如 `bquote(d(.(function_name),
  .(var)))`），对于 `dzdx`，则调用 `diff_expr` 函数。


  在许多需要创建调用对象的场景中，使用 `bquote` 比显式构建调用对象要简单得多。对于前面展示的简单示例，两者差别不大。


  ```

  bquote(.(2+2) + y)

  ## 4 + y

  call("+", 2+2, quote(y))

  ## 4 + y

  ```


  然而，一旦你需要创建包含多个嵌套调用的表达式（而实际上你并不需要特别复杂的表达式就能产生多个嵌套调用），显式创建调用就会变得比使用 `bquote` 繁琐得多。


  ```

  bquote((.(2+2) + x) * y)

  ## (4 + x) * y

  call("*", call("(", call("+", 2+2, quote(x))), quote(y))

  ## (4 + x) * y

  ```


  ## 解析与反解析


  当你使用引用来构建表达式时，你会得到可以通过递归函数进行操作的对象；但你也可以将表达式作为字符串来处理，并使用 `parse` 和 `deparse` 函数在字符串与表达式之间进行转换。


  `deparse` 函数将一个表达式转换为用于创建该表达式的 R 源代码（表示为字符串形式），而 `parse` 函数则解析一个字符串或文件，并返回其中包含的表达式。


  ```

  deparse(quote(x + y))

  ## [1] "x + y"

  parse(text = "x + y")

  ## expression(x + y)

  ```


  在这里调用 `parse` 时，你需要指定正在解析一个文本字符串。否则，`parse` 会假定你给的是一个文件名，并尝试解析该文件的内容。严格来说，`parse`
  调用的结果并不直接是一个表达式，然而它输出的类型是 `expression`。对于这个类型来说，这其实是一个不太恰当的选择，因为 `expression` 对象实际上是一个表达式列表。`parse`
  函数可以解析多个表达式，这些表达式的序列都以 `expression` 类型表示。你可以通过对该对象进行索引来获取实际的表达式。


  ```

  (expr <- parse(text = "x + y; z * x"))

  ## expression(x + y, z * x)

  expr[[1]]

  ## x + y

  expr[[2]]

  ## z * x

  ```


  `deparse` 函数通常在你需要一个表示 R 对象的字符串时使用，例如，用于绘制图形时的标签。许多函数会提取参数中给出的表达式，并将其用作默认标签。在这些情况下，你不能直接使用
  `deparse`。那会在将表达式转换为字符串之前就先对其求值。你需要获取实际的参数，为此，你需要使用 `substitute` 函数。


  ```

  f <- function(x) deparse(x)

  g <- function(x) deparse(substitute(x))

  x <- 1:4; y <- x**2

  f(x + y)

  ## [1] "c(2, 6, 12, 20)"

  g(x + y)

  ## [1] "x + y"

  ```




  '
- "# 替换\n\n`substitute`函数用于在表达式中将变量替换为值。你刚才看到的`deparse(substitute(x))`结构正是利用了这一点：它使用`substitute`获取函数参数`x`所引用的表达式，然后将其转换为字符串。如果直接引用`x`，会强制求值参数并得到求值结果；而使用`substitute`则可以得到`x`所引用的表达式。\n\
  \n获取用作函数参数的表达式（而非表达式的值）是`substitute`的常见用途。与`deparse`配合使用时，它用于创建图形标签。它也用于所谓的非标准求值（nonstandard\
  \ evaluation）——即不遵循环境默认规则对参数进行求值的函数。非标准求值将在下一节中介绍，它使用`substitute`获取参数中的表达式，然后在不同于函数求值环境的环境中使用`eval`对表达式进行求值。\n\
  \n在考虑求值表达式之前，你应先了解`substitute`的工作原理。这在一定程度上取决于它被调用的位置。在全局环境中，`substitute`不会做任何事，至少在你没有给它提供多于表达式本身参数的情况下（稍后会说明）。在所有其他环境中，如果你仅使用一个表达式调用`substitute`，该函数会在表达式中搜索变量。如果发现某个变量在当前环境中有值（无论是函数调用的承诺（promise）还是你已赋值的变量），它会将该变量替换为值。如果变量在环境中没有值，则保持不变。在全局环境中，它会让所有变量保持不变。\n\
  \n在下面的示例中，你会看到即使在全局环境中定义了变量`x`和`y`，`substitute(x + y)`也没有被修改。但在函数`f`的环境中，这两个变量会被替换为它们的值。\n\
  \n```\nx <- 2; y <- 3\nsubstitute(x + y)\n## x + y\nf <- function(x, y) substitute(x\
  \ + y)\nf(2, 3)\n## 2 + 3\n```\n\n使用`substitute`时，变量的查找方式与`eval`不同。当`substitute`在环境中查找时，它不会沿着父环境指针向上查找。如果在调用它的确切环境中未找到要替换的变量，它就不会进一步查找。因此，如果你编写如下函数：\n\
  \n```\ny - 3\n## [1] 0\nf <- function(x) substitute(x + y)\nf(2)\n## 2 + y\ng <-\
  \ function(x) function(y) substitute(x + y)\nh <- g(2)\nh(3)\n## x + 3\n```\n\n\
  当调用函数`f`时，其求值环境中有`x`，父环境（即全局环境）中有`y`，但`substitute`只会替换局部变量`x`。对于`h`，它会知道`y`是局部变量，而`x`来自其闭包；然而，只有局部变量`y`会被替换。\n\
  \n`substitute`实际用于查找变量的环境作为其第二个参数给出。默认值为当前的求值环境。你可以通过提供一个环境或一个包含变量到值映射的列表来更改此参数。\n\
  \n```\ne <- new.env(parent = emptyenv())\ne$x <- 2\ne$y <- 3\nsubstitute(x + y,\
  \ e)\n## 2 + 3\nsubstitute(x + y, list(x = 2, y = 3))\n## 2 + 3\n```\n\n同样，`substitute`不会沿着父环境指针查找。无论这些父环境是隐式设置还是显式设置在传递给函数的环境中，都是如此。\n\
  \n```\nx <- 2 ; y <- 3\ne <- new.env(parent = globalenv())\nsubstitute(x + y, e)\n\
  ## x + y\ne <- new.env(parent = globalenv())\ne$x <- 2\ne$y <- 3\ne2 <- new.env(parent\
  \ = e)\nsubstitute(x + y, e2)\n## x + y\n```\n\n如果你希望某个变量被替换，需要确保该变量存在于你提供给`substitute`的确切环境中。\n\
  \n### 替换存储在变量中的表达式\n\n当你操作表达式时，一个常见情况是持有对表达式的引用（例如来自函数参数），并希望修改它。在全局环境中，你不能直接用`substitute`做到这一点。如果你给`substitute`一个变量，它只会返回该变量。\n\
  \n```\nexpr <- quote(x + y)\nsubstitute(expr)\n## expr\n```\n\n这是因为`substitute`不会替换全局环境中的变量。你可以通过显式地将表达式放在环境或列表中提供给`substitute`来使表达式被替换。\n\
  \n```\nsubstitute(expr, list(expr = expr))\n## x + y\n```\n\n不过，通常你并不是在全局环境中操作表达式，在函数内部你可以替换表达式。\n\
  \n```\nf <- function() {\nexpr <- quote(x + y)\nsubstitute(expr)\n}\nf()\n## x +\
  \ y\n```\n\n但如果你想要在这里替换表达式中的`y`为 2 呢？无论使用显式列表的全局环境还是在函数内部，替换都会将`expr`替换为`quote(x\
  \ + y)`，但你还想进一步将`y`替换为 2。你无法直接从局部环境获取`y`并显式地将其交给`substitute`；这样也行不通。\n\n```\nf <-\
  \ function() {\nexpr <- quote(x + y)\ny <- 2\nsubstitute(expr)\n}\nf()\n## x + y\n\
  f <- function() {\nexpr <- quote(x + y)\nsubstitute(expr, list(y = 2))\n}\nf()\n\
  ## expr\n```\n\n你想要做的是，首先将`expr`替换为表达式`quote(x + y)`，然后将`y`替换为 2。因此，自然的方法是编写以下代码，但这行不通：\n\
  \n```\nsubstitute(substitute(expr, list(expr = expr)), list(y = 2))\n## substitute(expr,\
  \ list(expr = expr))\n```\n\n这里的问题是，`y`没有出现在最外层`substitute`所给的表达式中任何位置，因此它不会被替换进去。你得到的只是以下表达式：\n\
  \n```\nsubstitute(expr, list(expr = expr))\n```\n\n你可以计算这个表达式得到`x + y`。\n\n```\n\
  eval(substitute(substitute(expr, list(expr = expr)), list(y = 2)))\n```\n\n然而，求值首先会将`y`替换到最内层的`substitute`表达式中（那里没有`y`变量），然后才会将`expr`替换到表达式`expr`中。顺序是错误的。\n\
  \n要替换存储在其他变量中的表达式中的变量，必须以与直觉相反的顺序编写表达式。你不想先在最内层替换`expr`，再在外层替换`y`；你应该先将`expr`替换到一个能够处理`y`替换的`substitute`表达式中。最外层将`expr`替换到`substitute(expr,\
  \ list(y = 2))`中，然后你可以对该表达式求值，以得到将`y`替换到原表达式的结果。\n\n因此，你需要这样创建待求值的表达式：\n\n```\n\
  substitute(substitute(expr, list(y = 2)), list(expr = expr))\n## substitute(x +\
  \ y, list(y = 2))\n```\n\n这样完成替换：\n\n```\neval(substitute(substitute(expr, list(y\
  \ = 2)), list(expr = expr)))\n## x + 2\n```\n\n这可能需要一些时间来适应，但你只需记住，你需要按照这个顺序进行替换。\n\
  \n\n\n### 替换函数参数\n\n函数参数作为未求值的 promise 传递，但一旦你访问它们，它们就会被求值。如果你希望在不求值的情况下获取这些 promise，可以使用\
  \ `substitute` 函数。它会将参数作为未求值（或称引述）表达式返回。\n\n当你想要操作表达式或以不同于常规的方式求值时（你将在下一节中探索），这非常有用，但这样做会丢失关于表达式应在哪个上下文中求值的信息。考虑以下示例：\n\
  \n```\nf <- function(x) function(y = x) substitute(y)\ng <- f(2)\ng()\n## x\nx <-\
  \ 4\ng(x)\n## x\n```\n\n在第一次调用 `g` 时，`y` 使用其默认参数，即从闭包中继承的参数，因此它会替换为值为 2 的 `x`。然而在第二次调用中，你传入的是全局环境中的表达式\
  \ `x`，此时 `x` 的值为 4。在这两种情况下，你得到的都只是表达式 `quote(x)`。从 R 语言内部来看，没有机制能从 promise 中提取环境，因此你无法编写这样的代码：修改输入表达式，然后在默认参数的封闭作用域和函数参数的调用作用域中对其求值。\n\
  \n在其它函数内部调用 `substitute` 时也需要格外小心。当你使用 `substitute` 时得到的表达式，正是函数被调用时所使用的确切表达式。这个表达式不会在其它函数之间传播。在下面的示例中，你用表达式\
  \ `x + y` 调用了函数 `g`，但由于 `g` 用 `expr` 调用了 `f`，因此替换时得到的就是 `expr`。\n\n```\nf <- function(expr)\
  \ substitute(expr)\nf(x + y)\n## x + y\ng <- function(expr) f(expr)\ng(x + y)\n\
  ## expr\nx <- 2; y <- 3\neval(f(x + y))\n## [1] 5\neval(g(x + y))\n## [1] 5\n```\n\
  \n`substitute` 函数比使用 `bquote` 和显式修改 `call` 对象更难安全、正确地使用，但它正是实现非标准求值所必需的函数。\n\n##\
  \ 非标准求值\n\n非标准求值指的是任何不遵循在本地求值环境中对表达式求值规则的求值方式。当你使用 `eval` 在默认环境（即通过调用 `environment()`\
  \ 获得的环境）之外的其它环境中对函数参数求值时，你就是在以非标准方式对表达式求值。\n\n非标准求值的典型用途包括在调用作用域中对表达式求值（你已经看过相关示例），以及在数据框中对表达式求值。你已经知道在使用\
  \ `substitute` 时可以用列表来提供变量到值的映射，在使用 `eval` 时同样可以这样做。\n\n```\neval(quote(x + y),\
  \ list(x = 2, y = 3))\n## [1] 5\n```\n\n由于数据框本质上是一个由相同长度的向量元素组成的列表，你同样可以在数据框的上下文中对表达式求值。\n\
  \n```\nd <- data.frame(x = 1:2, y = 3:3)\neval(quote(x + y), d)\n## [1] 4 5\n```\n\
  \n当你以这种方式使用 `eval` 时（即显式引述表达式），其实并未真正进行非标准求值。被引述的表达式不会以任何其它标准方式进行求值。毕竟，你显式地引述了它，而如果你不在这里引述它，那么\
  \ `x+y` 将在调用作用域内求值，而不是在数据框内部。\n\n```\nx <- 2; y <-  3\neval(x + y, d)\n## [1] 4\
  \ 5\n```\n\n要进行非标准求值，你必须显式替换参数，从而避免在调用作用域中对参数 promise 求值，然后在替代作用域中对其求值。例如，你可以像这样实现你自己的\
  \ `with` 函数版本：\n\n```\nmy_with <- function(df, expr) {\neval(substitute(expr), df)\n\
  }\nd <- data.frame(x = rnorm(5), y = rnorm(5))\nmy_with(d, x + y)\n## [1] -1.4437635\
  \  0.9121930 -1.8908632 -0.2156309\n## [5]  1.8495491\n```\n\n在这里，表达式 `x + y` 在函数调用中并未被引述，因此通常情况下你会预期\
  \ `x + y` 在调用作用域内求值。但由于你在 `my_with` 中显式使用了 `substitute` 来替换参数，这种情况并没有发生。相反，你是在数据框的上下文中对表达式求值。这就是非标准求值。\n\
  \n真正的 `with` 函数工作得比你的版本更好一些。如果你求值的表达式包含数据框中未找到的变量，它会从调用作用域中获取这些变量。你的版本也能处理数据框中不存在的变量，但工作方式略有不同。\n\
  \n如果你在全局作用域中使用这两个函数，看不出差别。\n\n```\nz <- 1\nwith(d, x + y + z)\n## [1] -0.4437635\
  \  1.9121930 -0.8908632  0.7843691\n## [5]  2.8495491\nmy_with(d, x + y + z)\n##\
  \ [1] -0.4437635  1.9121930 -0.8908632  0.7843691\n## [5]  2.8495491\n```\n\n然而，如果你在函数内部使用它们，差别就显现出来了。\n\
  \n```\nf <- function(z) with(d, x + y + z)\nf(2)\n## [1] 0.5562365 2.9121930 0.1091368\
  \ 1.7843691\n## [5] 3.8495491\ng <- function(z) my_with(d, x + y + z)\ng(2)\n##\
  \ [1] -0.4437635  1.9121930 -0.8908632  0.7843691\n## [5]  2.8495491\n```\n\n这是怎么回事？\n\
  \n其实，`eval` 接受第三个参数，用于指定求值时的封闭作用域。在 `my_with` 中你没有提供这个参数，因此使用了默认值，即调用 `eval` 时的封闭作用域，也就是\
  \ `my_with` 的求值环境。在这个环境中你没有定义 `z`，但封闭作用域包含全局环境，而你在全局环境中定义了 `z`。当你在 `my_with` 中对表达式求值时，会从全局环境中找到\
  \ `z`。相比之下，使用 `with` 时，封闭环境是调用环境。\n\n你可以像这样修改 `my_with` 使其行为一致：\n\n```\nmy_with\
  \ <- function(df, expr) {\neval(substitute(expr), df, parent.frame())\n}\nf <- function(z)\
  \ with(d, x + y + z)\nf(2)\n## [1] 0.5562365 2.9121930 0.1091368 1.7843691\n## [5]\
  \ 3.8495491\ng <- function(z) my_with(d, x + y + z)\ng(2)\n## [1] 0.5562365 2.9121930\
  \ 0.1091368 1.7843691\n## [5] 3.8495491\n```\n\n现在，你掌握了非标准求值的两种典型用法：在数据框中求值以及在调用作用域中求值。\n\
  \n\n\n### 函数内部的非标准求值\n\n一旦你开始在其他函数内部使用非标准求值，就很难正确掌握它。当你以交互方式使用 `R`，或在全局作用域中编写分析管道时，这是一种简化许多操作语法的便捷方法，但由于替换倾向于对你提供给函数的参数进行逐字处理，因此一旦参数从一个函数传递到另一个函数，NSE\
  \ 就会变得棘手。\n\n考虑以下示例：\n\n```\nx <- 2; y <- 3\nf <- function(d, expr) my_with(d, expr)\n\
  f(d, x + y)\n## [1] 5\ng <- function(d, expr) my_with(d, substitute(expr))\ng(d,\
  \ x + y)\n## expr\n```\n\n在这里，你尝试在函数内部使用 `my_with` 两次，但都没有达到预期效果。在 `f` 中，`expr`\
  \ 在全局作用域中被求值。当你在函数内部使用该变量时，`promise` 会在传递到 `my_with` 之前被求值。在 `g` 中，你使用了 `substitute`，但\
  \ `my_with` 看到的是 `substitute(expr)`——记住，它不会将表达式视为 `promise`，而是对其进行替换以得到一个表达式——因此你实际上并没有让参数被替换。`my_with`\
  \ 中的 NSE 阻止了这一点。\n\n如果你想要进行 NSE 的函数，你真的应该编写那些处理表达式并对其执行“正常”求值的函数。你可以制作一个 `my_with`\
  \ 的版本，它期望表达式已经被引用，这样你可以在其他函数中使用它，然后像这样定义 `my_with` 来执行 NSE：\n\n```\nmy_with_q <-\
  \ function(df, expr) {\neval(expr, df, parent.frame())\n}\nmy_with <- function(df,\
  \ expr) my_with_q(d, substitute(expr))\ng <- function(d, expr) my_with_q(d, substitute(expr))\n\
  g(d, x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]  1.8495491\n\
  my_with(d, x + y)\n## [1] -1.4437635  0.9121930 -1.8908632 -0.2156309\n## [5]  1.8495491\n\
  ```\n\n### 使用 NSE 编写宏\n\n由于 NSE 允许你在调用作用域中求值表达式，你可以用它来编写宏，即作为它们被调用处语句的快捷方式的函数。这与普通函数不同，普通函数通常不能修改其自身作用域之外的数据。然而，除非你有非常充分的理由，否则我不建议使用宏——数据的不可变性是\
  \ `R` 的一个重要特性，使用宏违反这一特性是与它相悖的。但是，由于这是一个很好的例子，说明你可以用 NSE 做什么，我将在这里包含这个示例。\n\n考虑以下代码。此示例是\
  \ Thomas Lumley (R Journal, 2001) 在 Programmer’s Niche: Macros in `R` ( [`www.r-project.org/doc/Rnews/Rnews_2001-3.pdf`](https://www.r-project.org/doc/Rnews/Rnews_2001-3.pdf)\
  \ ) 中展示的宏代码的修改实现。我简化了宏制造函数；你可以在原始文章在线版中看到完整版本。\n\n```\nmake_param_names <- function(params)\
  \ {\nparam_names <- names(params)\nif (is.null(param_names))\nparam_names <- rep(\"\
  \", length(params))\nfor (i in seq_along(param_names)) {\nif (param_names[i] ==\
  \ \"\") {\nparam_names[i] <- paste(params[[i]])\n}\n}\nparam_names\n}\nmake_macro\
  \ <- function(..., body) {\nparams <- eval(substitute(alist(...)))\nbody <- substitute(body)\n\
  #### 构造宏\nf <- eval(substitute(\nfunction() eval(substitute(body), parent.frame())\n\
  ))\n#### 设置宏参数\nparam_names <- make_param_names(params)\nnames(params) <- param_names\n\
  params <- as.list(params)\nformals(f) <- params\nf\n}\n```\n\n第一个函数只是从函数参数列表中提取名称，并确保所有参数都有名称。这在稍后构造函数的\
  \ `formals` 列表时是必要的。在 `formals` 列表中，所有参数都必须有名称，你可以用这个函数来构造这些名称。第二个函数是那个有趣的函数。这里，你通过构造一个函数来创建宏，该函数的主体将在其调用作用域中被求值。你首先获取宏应该具有的参数和主体。然后，通过替换\
  \ `...` 并求值 `alist(...)` 表达式，你将参数放入一个 `list` 中。如果没有替换，你会得到只包含 `...` 的参数列表，但有了替换，你会得到传递给\
  \ `make_macro` 函数的参数（除了命名参数 `body`，你通过另一个 `substitute` 调用将其直接转换为传递给 `make_macro`\
  \ 的表达式）。\n\n你构造的函数是魔法发生的地方。你创建了表达式\n\n```\nsubstitute(function() eval(substitute(body),\
  \ parent.frame()))\n```\n\n其中 `body` 将被替换为你传递给宏的表达式。当你求值这个表达式时，你得到函数\n\n```\nfunction()\
  \ eval(substitute(), parent.frame())\n```\n\n其中 `<body>` 不再是符号 `body`，而是 `body`\
  \ 表达式。这是一个（目前）不接受任何参数的函数，但在求值结果表达式之前，它会替换 `<body>` 中在其调用作用域（即 `parent.frame()`）中已知的变量。\n\
  \n你可以通过这个小例子看到它的实际效果：\n\n```\n(m \n```\n\n当你调用 `m` 时，它会在其调用作用域中求值 `x + y`，因此你可以在全局作用域中设置变量\
  \ `x` 和 `y` 并像这样求值：\n\n```\nx <- 2; y <- 4\nm()\n## [1] 6\n```\n\n`make_macro` 代码的最后一部分设置了宏的形式参数。它只是获取你已经指定的参数，确保它们都有名称，然后将它们转换为一个列表并设置\
  \ `formals(f)`。之后，`make_macro` 返回构造好的函数。\n\n你可以使用这个函数来创建一个宏，将数据框中某一列的特定值替换为 `NA`，如下所示：\n\
  \n```\nset_NA_val <- make_macro(df, var, na_val,\nbody = df$var[df$var == na_val]\
  \ <- NA)\n```\n\n你构造的宏接受三个参数：数据框 `df`；数据框中的变量（列）`var`；以及对应 `NA` 的值 `na_val`。然后，它的主体是以下表达式，其中的\
  \ `df`、`var` 和 `na_val` 被传递给宏的参数替换：\n\n```\ndf$var[df$var == na_val] <- NA\n```\n\
  \n你可以像这样使用它：\n\n```\n(d <- data.frame(x = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##  \
  \  x  y\n## 1  1  1\n## 2 -9  2\n## 3  3 -9\n## 4  4 -9\nset_NA_val(d, x, -9); d\n\
  ##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 -9\n## 4  4 -9\nset_NA_val(d, y, -9);\
  \ d\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\n在这里，你看到构造的\
  \ `set_NA_val` 宏在调用作用域中修改了一个数据框。它省去了一些样板代码的编写，但代价是保持了参数值的不可变性。对于大多数 `R` 程序员来说，返回更新值的更传统函数解决方案可能更具可读性。\n\
  \n```\nset_NA_val_fun <- function(df, var, na_val) {\ndf[df[,var] == na_val, var]\
  \ <- NA\ndf\n}\n(d <- data.frame(x = c(1,-9,3,4), y = c(1,2,-9,-9)))\n##    x  y\n\
  ## 1  1  1\n## 2 -9  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d, \"x\", -9))\n\
  ##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 -9\n## 4  4 -9\n(d <- set_NA_val_fun(d,\
  \ \"y\", -9))\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3 NA\n## 4  4 NA\n```\n\
  \n或者，这是 `magrittr` 管道版本：\n\n```\nlibrary(magrittr)\nd % set_NA_val_fun(\"x\", -9)\
  \ %>% set_NA_val_fun(\"y\", -9)\nd\n##    x  y\n## 1  1  1\n## 2 NA  2\n## 3  3\
  \ NA\n## 4  4 NA\n```\n\n\n### 评估中的环境修改\n\n你之所以能在宏中修改变量，是因为可以修改环境。实际值是不可变的，但在前一个示例中修改数据框时，你实际上是将环境中指向该数据的引用替换为修改后的数据。如果其他变量引用同一个数据框，它们仍会指向原始版本。即使使用宏，你实际上也无法修改数据，但可以修改环境。由于你可以在不同于当前评估环境的环境中评估表达式，因此可以制造出在调用环境中修改数据的效果。\n\
  \n通过显式检查赋值时的评估环境，你可以观察到这一点。如果你显式创建一个环境并在其中评估赋值，就能看到该环境被修改了。\n\n```\ne <- list2env(list(x\
  \ = 2, y = 3))\neval(quote(z <- x + y), e)\nas.list(e)\n## $z\n## [1] 5\n##\n##\
  \ $y\n## [1] 3\n##\n## $x\n## [1] 2\n```\n\n此环境的父环境是全局环境。不要尝试以空环境作为其父环境，否则它将无法识别\
  \ `<-` 函数。你可以看到，通过设置变量 `z`，你修改了 `e`。\n\n你也可以在列表（lists）中评估表达式，因此可以尝试相同操作：\n\n```\n\
  l <- list(x = 2, y = 3)\neval(quote(z <- x + y), l)\nl\n## $x\n## [1] 2\n##\n##\
  \ $y\n## [1] 3\n```\n\n这里可以看到，列表并未被修改。你只能修改列表中的环境，虽然可以使用 `eval` 在列表中评估赋值，但实际上无法修改列表本身。\n\
  \n### 使用 `pryr` 包访问承诺（Promises）\n\n正如我之前提到的，纯 R 语言中没有机制可以直接访问承诺的内部结构。因此，如果你使用 `substitute`\
  \ 将函数参数转换为其对应的表达式，就会丢失关于表达式应在哪个环境中评估的信息。不过，你可以使用 `pryr` 包来检查承诺。这个包提供了 `promise_info`\
  \ 函数，它能告诉你表达式是什么以及它所属的环境。\n\n考虑以下代码：\n\n```\nlibrary(pryr)\nf <- function(x, y)\
  \ function(z = x + y) {\n  promise_info(z)\n}\ng <- f(2, 3)\ng()\n## $code\n## x\
  \ + y\n## \n## $env\n## <environment: 0x7f8e4e8a6b60>\n## \n## $evaled\n## [1] FALSE\n\
  ## \n## $value\n## NULL\nx <- 2\ny <- 3\ng(x + y)\n## $code\n## x + y\n## \n## $env\n\
  ## <environment: R_GlobalEnv>\n## \n## $evaled\n## [1] FALSE\n## \n## $value\n##\
  \ NULL\n```\n\n对于承诺，你可以从 `code` 字段获取其对应的表达式，从 `env` 字段获取其所属的环境，以及从 `evaled` 字段获取它是否已经被评估。如果已被评估，相应的值会放在\
  \ `value` 字段中。在两次对 `g` 的不同调用中，可以看到 `code` 字段相同，但环境不同。在第一次调用中，你使用了参数 `z` 的默认值，环境是\
  \ `f` 的闭包；在第二次调用中，你使用全局环境中的表达式调用 `g`，承诺的环境也是全局环境。\n\n在以下示例中，你可以看到承诺在被评估之前和之后的区别：\n\
  \n```\ng <- function(x, y) function(expr = x + y) {\n  pi <- promise_info(expr)\n\
  \  cat(\"Before evaluation:\\n\")\n  str(pi)\n  pi$value <- eval(expr, pi$env)\n\
  \  cat(\"After evaluation:\\n\")\n  str(pi)\n}\nh <- g(4, 5)\nh()\n## Before evaluation:\n\
  ## List of 4\n## $ code  : language x + y\n## $ env   : <environment: 0x7f8e4e8a6b60>\n\
  ## $ evaled: logi FALSE\n## $ value : NULL\n## \n## After evaluation:\n## List of\
  \ 4\n## $ code  : language x + y\n## $ env   : NULL\n## $ evaled: logi TRUE\n##\
  \ $ value : num 9\n```\n\n当你评估一个承诺时，代码不会改变，但环境会被移除。你不再需要持有一个不再需要的环境的引用。如果你是唯一持有这个环境的人，那么在不再需要它时，可以释放它以进行垃圾回收。评估承诺的结果被放入\
  \ `value` 中，并且 `evaled` 被设置为 `TRUE`。\n\n你可以利用承诺信息来修改环境，并仍然在正确的作用域中评估它。你只需要获取代码，这可以通过以下表达式实现：\n\
  \n```\neval(substitute(\n  substitute(code, list(y = quote(2 * y))),\n  list(code\
  \ = pi$code)))\n```\n\n或者通过以下表达式：\n\n```\neval(substitute(\n  substitute(expr, list(y\
  \ = quote(2 * y)))))\n```\n\n其中 `expr` 是持有承诺的参数，`pi` 是调用 `promise_info(expr)` 的结果。这两种方式都不特别优雅，并且你必须记住由内而外地构建表达式，但这就是你能够替换持有表达式的变量中的表达式并进行修改的方法。在这两者中，传统的方法——即第二种——可能最简单。\n\
  \n在两种情况下，你都在创建以下表达式：\n\n```\nsubstitute(<expr>, list(y = quote(2 * y)))\n```\n\n\
  其中 `<expr>` 指的是承诺中的表达式，然后你评估这个表达式，将 `y` 替换为 `quote(2 * y)`。\n\n相比之下，一旦你修改了表达式，评估它就几乎微不足道了。你只需使用\
  \ `eval(expr, pi$env)` 即可。\n\n```\nf <- function(x, y) function(expr = x + y) {\n\
  \  pi <- promise_info(expr)\n  expr <- eval(substitute(\n    substitute(expr, list(y\
  \ = quote(2 * y)))))\n  value <- eval(expr, pi$env)\n  list(expr = expr, value =\
  \ value)\n}\ng <- f(2, 2)\ng()\n## $expr\n## x + 2 * y\n##\n## $value\n## [1] 6\n\
  x <- y <- 4\ng(x + y)\n## $expr\n## x + 2 * y\n##\n## $value\n## [1] 12\nz <- 4\n\
  g(z)\n## $expr\n## z\n##\n## $value\n## [1] 4\n```\n\n在替换过程中，当你创建 `expr` 时，重要的是你将\
  \ `y` 替换为 `quote(2 * y)`，而不是简单的 `2 * y`。如果你选择了后者，那么 `y` 会以标准方式被评估，并会引用封闭作用域中的 `y`，也就是传递给创建\
  \ `g` 的 `f` 调用的那个参数。当然，这可能正是你想要的：将输入表达式中的任何 `y` 替换为封闭作用域中的 `y`。在这种情况下，代码看起来会像这样：\n\
  \n```\nf <- function(x, y) function(expr = x + y) {\n  pi <- promise_info(expr)\n\
  \  expr <- eval(substitute(\n    substitute(expr, list(y = 2 * y))))\n  value <-\
  \ eval(expr, pi$env)\n  list(expr = expr, value = value)\n}\ng <- f(2, 2)\ng()\n\
  ## $expr\n## x + 4\n##\n## $value\n## [1] 6\nx <- y <- 4\ng(x + y)\n## $expr\n##\
  \ x + 4\n##\n## $value\n## [1] 8\nz <- 4\ng(z)\n## $expr\n## z\n##\n## $value\n\
  ## [1] 4\n```\n\n在两种情况下，你都修改了承诺中的表达式——只是修改方式不同——然后在承诺作用域中对其进行评估。在第一种情况中，如果 `y` 出现在修改后的表达式中，它会从承诺作用域中获取；在第二种情况中，`y`\
  \ 被替换为你在封闭作用域中拥有的值。\n\n**脚注** 1\n\n在 `pryr` 包中（本章末尾会再次回到这个包），有一些用 C 语言编写的函数，它们确实提供了对承诺内部结构的访问。使用\
  \ `pryr`，你可以在需要时获取承诺的表达式及其关联环境。\n\n\n"
- "# 后记\n\n至此，你已经了解了从 `R` 程序内部操作 `R` 语言实际构造的各种技术。操作实际语言，进行元编程，为你提供了以多种方式扩展 `R` 的工具。你可以编写用于修改其他函数的函数——就像你计算函数导数时所做的那样——或者你可以编写小型嵌入式领域特定语言来操作或查询数据框，就像在\
  \ `dplyr` 和 `ggplot2` 中所做的那样。你知道了如何进行非标准求值，改变表达式的求值方式，以便在不同于通常求值的作用域中对它们进行求值，这通常可以简化函数在管道中的使用方式；但在编写程序时，应谨慎使用此类编程技术，因为很难推理在函数间传递的表达式。\n\
  \n你不应过度使用元编程。阅读你代码的人，大概知道如何阅读 `R` 代码，因此你不应打破他们对代码求值方式的预期。如果你开发了一个领域特定语言并为此使用元编程，这通常没问题；能够阅读你实现的语言表达式的人会知道它们的行为方式，但要谨慎使用元编程。它是一个强大的工具，但如果使用不当，也非常容易让你搬起石头砸自己的脚。\n\
