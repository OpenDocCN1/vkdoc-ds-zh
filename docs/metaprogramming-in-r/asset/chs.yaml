- "# 1. 函数的剖析\n\n你在 R 中所做的一切都涉及定义函数或调用函数。如果不求值某个函数，你无法执行任何操作。即使是将值赋给变量或对向量或列表进行下标操作，也涉及求值函数。但函数不仅仅是关于如何执行不同操作的配方；它们本身也是数据对象，并且有探查和修改它们的方法。\n\
  \n## 操作函数\n\n如果你定义一个像下面这样的简单函数，就可以检查它的组成部分：\n\n```\nf <- function(x) x\n```\n\n\
  一个函数包含三个部分：形式参数 (formal parameters)、函数体 (body) 以及它被定义的环境 (environment)。函数 `formals`、`body`\
  \ 和 `environment` 可以获取这些部分：\n\n```\nformals(f)\n## $x\nbody(f)\n## x\nenvironment(f)\n\
  ## \n```\n\n### 形式参数 (Formals)\n\n形式参数以列表形式给出，其中元素名称是参数名，值是默认参数。\n\n```\ng \", parameters[[param]],\
  \ \"\\n\")\n}\n## x => 1\n## y => 2\n## z => 3\n```\n\n严格来说，它是一个所谓的“配对列表 (pairlist)”，但这是一个实现细节，对你如何处理它没有影响。你可以把它当作一个\
  \ `list` 来处理。\n\n```\ng  \", '\"', parameters[[param]], '\"', \"\\n\", sep = \"\"\
  )\n}\n## x => \"1\"\n## y => \"2\"\n## z => \"3\"\n```\n\n对于此列表中那些没有默认值的变量，该列表将其值表示为空名称。这是一个特殊的符号，你不能给它赋值，因此它不会与真实值混淆。你不能使用\
  \ `missing` 函数来检查 `formals` 函数中的缺失值（该函数仅在函数调用内部有用，并且无论如何，缺失参数与没有默认值的参数之间是有区别的），但你始终可以检查该值是否为空符号。\n\
  \n```\ng  \", '\"', parameters[[param]], '\"',\n\" (\", class(parameters[[param]]),\
  \ \")\\n\", sep = \"\")\n}\n## x => \"\" (name)\n## y => \"\" (name)\n## z => \"\
  3\" (numeric)\n```\n\n原始函数 (Primitive functions) (那些调用运行时系统的函数，例如 `` `+` ``) 没有形式参数。只有那些在\
  \ R 中定义的函数才有。\n\n```\nformals(`+`)\n## NULL\n```\n\n### 函数体 (Function Bodies)\n\n\
  函数体是一个表达式。对于 `f`，它是一个简单的表达式。\n\n```\nbody(f)\n## x\n```\n\n但即使是多语句的函数体也是表达式。它们只是求值为序列中最后一个表达式的结果。\n\
  \n```\ng <- function(x) {\ny <- 2*x\nz <- x**2\nx + y + z\n}\nbody(g)\n## {\n##\
  \     y <- 2 * x\n##     z <- x²\n##     x + y + z\n## }\n```\n\n当调用一个函数时，R 会为其设置一个环境来求值这个表达式；这个环境被称为该函数调用的求值环境。求值环境首先会被填充函数形式参数的值，这些值要么在函数调用中提供，要么作为默认参数给出，然后函数体在这个环境中执行。赋值操作将修改这个局部环境，除非你使用\
  \ `<<-` 运算符，而函数的结果是函数体中被求值的最后一个表达式。这要么是序列中的最后一个表达式，要么是显式传递给 `return` 函数的表达式。\n\n\
  当你只是将函数体作为一个表达式时，你无法获得这种函数调用语义，但你仍然可以尝试求值该表达式。\n\n```\neval(body(f))\n## Error in\
  \ eval(expr, envir, enclos): object 'x' not found\n```\n\n它失败了，因为你在任何地方都没有定义变量 `x`。如果你有一个全局变量\
  \ `x`，求值就会使用那个变量，而不会使用任何函数参数，因为这个表达式不知道它是函数的一部分。如果我们调用该函数，表达式当然会知道函数上下文，但当我们像这样简单地求值函数体时则不会。不过，你可以像这样为\
  \ `x` 提供一个值：\n\n```\neval(body(f), list(x = 2))\n## [1] 2\n```\n\n`eval` 函数用于求值一个表达式，并使用第二个参数来查找参数。你可以给它一个环境，然后表达式将在该环境中被求值，或者你可以使用一个列表。第\
  \ 3 章介绍了如何处理表达式以及如何求值它们；现在你只需要知道，如果表达式中的变量可以在你调用 `eval` 的作用域中找到，或者提供给 `eval` 的第二个参数中，你就可以使用\
  \ `eval` 来求值一个表达式。\n\n你还可以将 `x` 设置为一个默认参数，并在求值表达式时使用它。\n\n```\nf <- function(x =\
  \ 2) x\nformals(f)\n## $x\n## [1] 2\neval(body(f), formals(f))\n## [1] 2\n```\n\n\
  如果默认参数相互引用，事情会变得稍微复杂一些。这与求值环境的设置方式有关，而与表达式如何求值关系不大，但请考虑以下示例，其中一个默认参数引用另一个：\n\n```\n\
  f <- function(x = y, y = 5) x + y\n```\n\n两个参数都有默认值，因此你可以在不提供任何参数的情况下调用 `f`。\n\n\
  ```\nf()\n## [1] 10\n```\n\n但是，如果仅仅基于形式参数而不提供值，你是无法求值的。\n\n```\neval(body(f), formals(f))\n\
  ## Error in x + y: non-numeric argument to binary operator\n```\n\n在 `formals(f)`\
  \ 中，`x` 指向符号 `y`，而 `y` 指向数值 5。但 `y` 并没有在表达式中使用，如果你只是查找 `x`，你只会得到符号 `y`，并且你不会进一步求值以找出\
  \ `y` 是什么。因此，你会得到一个错误。\n\n形式参数在调用函数时不会以这种方式求值。它们会被转换成所谓的“承诺 (promises)”，即带有相关作用域的未求值表达式。形式语言定义是这样描述的：\n\
  \n- 当调用一个函数时，每个形式参数会在调用的局部环境中被分配一个承诺，其表达式插槽包含实际参数（如果存在），环境插槽包含调用者的环境。如果在调用中没有为某个形式参数提供实际参数，并且存在默认表达式，则该表达式类似地被分配到形式参数的表达式插槽中，但环境被设置为局部环境。\n\
  \n这意味着在求值环境中，R 首先将所有变量赋给这些“承诺”。承诺是值的占位符，但以你尚未求值的表达式形式表示。然而，一旦你访问它们，它们就会被求值（并且 R\
  \ 会记住该值）。对于默认参数，承诺会在求值环境中被求值；对于在函数调用中传递给函数的参数，承诺会在调用作用域中被求值。\n\n由于所有承诺都是未求值的表达式，你不必担心变量赋值的顺序。只要在求值承诺时这些变量存在，就不会有问题；只要表达式之间没有循环依赖，你就可以在需要时找出所有值。\n\
  \n不要制造循环依赖。不要做类似这样的事情：\n\n```\ng <- function(x = 2*y, y = x/2) x + y\n```\n\n你可以尝试为\
  \ `f` 建立一个类似的设置，将其形式参数构建为一个包含承诺的环境。你可以使用 `delayedAssign` 函数像这样将值赋给承诺：\n\n```\nfenv\
  \ <- new.env()\nparameters <- formals(f)\nfor (param in names(parameters)) {\ndelayedAssign(param,\
  \ parameters[[param]], fenv, fenv)\n}\neval(body(f), fenv)\n## [1] 10\n```\n\n这里你将表达式\
  \ `y` 赋给变量 `x`，将值 5 赋给变量 `y`。像数值向量这样的原始值不会作为未求值表达式来处理。它们可以被这样处理，但没有必要。因此，在求值 `f`\
  \ 的函数体之前，环境中有 `y` 指向 5，`x` 指向表达式 `y`，后者被包装成一个承诺，表示当你需要知道 `y` 的值时，该表达式应在 `fenv` 中被求值。\n\
  \n\n\n### 函数环境\n\n函数的环境是其最简单的组成部分。它只是函数被定义时所处的环境。这个环境用于捕获外部作用域，也是 R 语言能够实现闭包的原因。当函数创建时，其计算环境会与函数环境相关联，这样，在局部环境（由局部变量和形式参数组成）中找不到的变量，就会到外部作用域中去查找。\n\
  \n## 调用函数\n\n在继续之前，有必要了解一下当函数被调用时这些组成部分是如何协同工作的。我在《R 语言函数式编程》中对此进行过一些详细解释，但理解表达式如何被求值是至关重要的。当你开始接触非标准求值时，这一点就变得更为重要，因此值得重申。\n\
  \n表达式被求值时，是在某个环境中进行的。环境以树状结构链接。每个环境都有一个父环境。当 R 需要查找一个变量时，它首先在当前环境中查找该环境是否持有该变量。如果没有，R\
  \ 会去父环境中查找。如果在那里也找不到，它会继续去祖父环境中查找，并沿着这个树状结构向上查找，直到找到该变量，或者到达全局环境后发现变量也不存在，这时就会抛出错误。我们称一个表达式通过这种方式能够找到的变量为其作用域。由于查找过程总是选择它找到给定变量的第一个位置，因此局部变量会覆盖全局变量。并且，虽然父环境链上的多个环境可能包含相同的变量名，但只有最内层的环境（即首先找到的那个）会被使用。\n\
  \n当一个函数 `f` 被创建时，它会与 `environment(f)` 关联。这个环境就是 `f` 被定义时所在的环境。当 `f` 被调用时，R 会为 `f`\
  \ 创建一个计算环境；我们称其为 `evalenv`。`evalenv` 的父环境被设置为 `environment(f)`。由于 `environment(f)`\
  \ 是 `f` 被定义时所在的环境，将其设置为计算环境的父环境意味着：如果 `f` 是一个闭包，那么 `f` 的函数体能够访问其外部作用域。\n\n在计算环境被创建之后，`f`\
  \ 的形式参数会作为 promise 被添加到该环境中。正如你之前从语言定义中看到的，默认参数和在函数调用处传入的参数，在 promise 的建立方式上有所不同。默认参数对应的\
  \ promise 应在计算作用域 `evalenv` 中进行求值。这意味着它们可以引用其他的局部变量或形式参数。由于这些变量会被放入 `evalenv`，并且\
  \ `evalenv` 的父环境是 `environment(f)`，这些 promise 也可以引用 `f` 被定义的作用域中的变量。然而，在函数调用处传给\
  \ `f` 的表达式，会被存储为应在调用环境中求值的 promise。我们称该环境为 `callenv`。如果它们在 `evalenv` 中被求值，就无法引用你调用\
  \ `f` 所在作用域中的变量；它们只能引用局部变量或 `f` 被定义的作用域中的变量。\n\n你可以在下面的示例中看到这一切是如何运作的：\n\n```\n\
  enclosing <- function() {\nz <- 2\nfunction(x, y = x) {\nx + y + z\n}\n}\nf <- enclosing()\n\
  calling <- function() {\nw <- 5\nf(x = 2 * w)\n}\ncalling()\n## [1] 22\n```\n\n\
  你从全局环境开始，在此处将 `enclosing` 定义为一个函数。当你调用 `enclosing` 时，会创建一个计算环境，在其中存储变量 `z`，然后返回一个函数，并将其作为\
  \ `f` 存储在全局环境中。由于该函数是在 `enclosing` 的计算环境中定义的，因此这个环境就是 `f` 的 `environment`。\n\n接着你创建了\
  \ `calling`，将其存储在全局环境中，并调用它。这再次创建了一个计算环境。在其中，你存储了变量 `w`，然后调用 `f`。`f` 不在当前计算环境中，但由于计算环境的父环境是全局环境，你能够找到它。当你调用\
  \ `f` 时，将表达式 `2 * w` 作为参数 `x` 传递给它。\n\n在 `f` 的内部调用中，有另一个计算环境。它的父环境是你从 `enclosing`\
  \ 那里得到的闭包环境。这里你需要对 `f` 的函数体进行求值：`x + y + z`。然而，在此之前，需要先设置好计算环境。由于 `x` 和 `y` 是形式参数，它们会作为\
  \ promise 被存储在计算环境中。你在调用 `f` 时提供了 `x` 作为参数，因此这个 promise 必须在调用环境（即 `calling` 内部的环境）中求值；而\
  \ `y` 有默认值，因此它必须在计算环境中求值。在这个计算环境中，它可以访问到 `x` 和 `y`，并通过父环境访问到 `z`。你对 `x` 进行求值（即在调用环境中求表达式\
  \ `2 * w` 的值，此处 `w` 是已知的），然后对 `y` 在局部环境中进行求值（此处 `x` 是已知的）。这样，你就得到了这两个变量的值，然后从闭包环境中获取\
  \ `z` 的值。\n\n你可以尝试使用显式环境和 `delayedAssign` 来存储 promise，以模拟这一切。你需要三个环境，因为这个例子不需要模拟全局环境。你需要\
  \ `f` 函数被定义时的环境；我们称其为 `defenv`。然后你需要调用 `f` 时的计算环境，以及 `f` 被调用的环境。\n\n```\ndefenv\
  \ <- new.env()\nevalenv <- new.env(parent = defenv)\ncallenv <- new.env()\n```\n\
  \n这里，`defenv` 和 `calling` 的父环境都是全局环境，不过你无需担心这个。计算环境的父环境是 `defenv`。\n\n在定义环境中，你保存了\
  \ `z` 的值。\n\n```\ndefenv$z <- 2\n```\n\n在调用环境中，你保存了 `w` 的值。\n\n```\ncallenv$w <-\
  \ 5\n```\n\n在计算环境中，你设置好 promise。`delayedAssign` 函数接收两个环境作为参数。第一个是 promise 应该被求值的环境，第二个是它应该被存储的环境。对于\
  \ `x`，你希望表达式在调用环境中求值；对于 `y`，你希望它在计算环境中求值。两个变量都应存储在计算环境中。\n\n```\ndelayedAssign(\"\
  x\", 2 * w, callenv, evalenv)\ndelayedAssign(\"y\", x, evalenv, evalenv)\n```\n\n\
  现在，你可以在 `evalenv` 中对 `f` 进行求值。\n\n```\nf <- function(x, y = x) x + y + z\neval(body(f),\
  \ evalenv)\n## [1] 22\n```\n\n一次函数调用的背后竟然有如此多的操作，这着实令人惊讶，但这一切都遵循着将参数作为 promise 进行传递的这些规则。\n\
  \n\n\n"
- "# 修改函数\n\n你不仅能检查函数，还能做更多操作。用于检查的三个函数也各有赋值版本，你可以利用它们修改函数的三个组成部分。回到 `f` 的简单定义：\n\n\
  ```\nf <- function(x) x\nf\n## function(x) x\n```\n\n你可以尝试通过为 `x` 设置默认值来修改其形式参数：\n\
  \n```\nformals(f) <- list(x = 3)\nf\n## function (x = 3)\n## x\n```\n\n此时，由于 `x`\
  \ 有了默认值，你可以在其形式参数的环境中计算函数体：\n\n```\neval(body(f), formals(f))\n## [1] 3\n```\n\n\
  不过，我要再次强调，调用函数并不是简单地在形式参数上下文中计算函数体。当函数被调用时，你在其定义之外修改形式参数并不影响实际执行。形式参数仍会在函数定义时的环境中被计算。\n\
  \n如果你定义一个闭包，就能看到这一点：\n\n```\nnested <- function() {\ny <- 5\nfunction(x) x\n}\n\
  f <- nested()\n```\n\n由于 `f` 是在 `nested` 的计算环境中定义的，因此 `environment(f)` 就是那个环境。当你调用它时，它就能看见\
  \ `nested` 中的局部变量 `y`。它并没有引用这个变量，但你可以通过修改其形式参数来改变这一点：\n\n```\nformals(f) \n```\n\
  \n这里，你必须使用 `quote` 函数来让 `y` 成为一个名称。如果不这样做，你会遇到错误，或者得到对全局环境中 `y` 的引用。在函数定义中，默认参数会被自动引用（quote）以转化为表达式，但当你修改\
  \ `formals` 时，你需要显式地执行这一操作。\n\n如果你现在调用不带参数的 `f`，`x` 将采用 `formals(f)` 指定的默认值。也就是说，它会引用\
  \ `y`。由于这是一个默认参数，它会被转化为一个 promise，并在 `f` 的计算环境中求值。那里没有名为 `y` 的局部变量，因此 R 会在 `environment(f)`\
  \ 中查找 `y`，并在 `nested` 环境中找到它：\n\n```\nf()\n## [1] 5\n```\n\n仅仅因为你在全局环境中修改了 `formals(f)`，并不会改变\
  \ R 计算默认参数 promise 的环境。即使有一个全局变量 `y`，`f` 形式参数中的 `y` 仍然引用 `nested` 中的那个：\n\n```\n\
  y <- 2\nf()\n## [1] 5\n```\n\n当然，如果你在调用 `f` 时显式提供参数 `y`，情况就不同了。此时它会变成一个应在调用环境中计算的\
  \ promise，因此在这种情况下，你得到的是对全局变量 `y` 的引用：\n\n```\nf(x = y)\n## [1] 2\n```\n\n你也可以修改\
  \ `f` 的函数体。例如，不让函数体引用 `x`，而是让它返回常量 6：\n\n```\nbody(f) \n```\n\n现在，当我们调用它时，无论 `x`\
  \ 是什么，它都会计算那个常量 6：\n\n```\nf()\n## [1] 6\nf(x = 12)\n## [1] 6\n```\n\n你还可以尝试让 `f`\
  \ 的函数体更复杂，使其成为一个实际的表达式：\n\n```\nbody(f) <- 2 * y\nf()\n## [1] 4\n```\n\n然而，这里你并没有得到完全想要的结果。你并不希望在调用函数之前就计算函数体，但当你像这样赋值时，在赋值之前你就已经计算了它。惰性求值（lazy\
  \ evaluation）也有其限度。由于 `y` 是 2，你实际上是将 `f` 的函数体设置成了 4。之后再改变 `y` 也不会改变这一点：\n\n```\n\
  y <- 3\nf()\n## [1] 4\n```\n\n要得到一个未经计算的函数体，你必须再次使用 `quote`：\n\n```\nbody(f) \n\
  ```\n\n但现在，你又回到了函数调用的语义，这意味着函数体是在一个父环境为 `nested` 内部环境的计算环境中求值的，因此 `y` 引用的是局部变量，而非全局变量：\n\
  \n```\nf()\n## [1] 10\ny <- 2\nf()\n## [1] 10\n```\n\n如果你想让 `f` 使用全局变量 `y`，可以修改\
  \ `environment(f)`：\n\n```\nenvironment(f) <- globalenv()\nf()\n## [1] 4\ny <- 3\n\
  f()\n## [1] 6\n```\n\n不过，如果这样做，它就不再知晓 `nested` 内部的环境了。如果你想挑选函数在哪些环境中查找变量，需要大量的环境操作（environment\
  \ hacking）；如果你的确有此需求，那么最好重写函数，通过其他方式访问变量。\n\n如果你想将函数的形式参数设置为缺失值（即让它们成为没有默认值的参数），那么你需要使用\
  \ `list` 来创建参数。\n\n如果你像这样定义一个函数 `f`，它接受一个参数 `x`，并将其与一个全局参数 `y` 相加：\n\n```\nf <-\
  \ function(x) x + y\n```\n\n如果你希望 `y` 也是一个参数，但不给它默认值，你可以尝试这样：\n\n```\nformals(f)\
  \ <- list(x =, y =)\n```\n\n但这行不通，因为 `list` 不接受空值。相反，你可以使用 `alist`。这个函数创建了一个“成对列表”（pair-list），这是\
  \ R 内部用于表示形式参数的数据结构。这种数据结构仅用于此目的，但如果你要着手修改函数的参数，它就是你应该使用的工具：\n\n```\nformals(f)\
  \ <- alist(x =, y =)\n```\n\n使用 `alist` 时，表达式也会被自动引用。在前面的例子中，当你希望参数 `x` 默认值为 `y`\
  \ 时，需要使用 `quote(y)` 来让 `y` 作为一个 promise 在 `environment(f)` 中计算，而不是在调用作用域中计算。使用 `alist`\
  \ 时，你不需要引用 `y`：\n\n```\nnested \nf()\n## [1] 5\n```\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n"
- '# 构建函数


  你也可以通过拼接各个组成部分来构建新的函数。用于此目的的函数是 `as.function`。它接受一个 `alist` 作为输入，并将其中的最后一个元素解释为新函数的主体，其余元素解释为形式参数。


  ```

  f <- as.function(alist(x =, y = 2, x + y))

  f

  ## function (x, y = 2)

  ## x + y

  f(2)

  ## [1] 4

  ```


  不要试图在这里使用 `list`；它不会按你的预期工作。


  ```

  f <- as.function(list(x = 2, y = 2, x + y))

  ```


  如果你给 `as.function` 一个列表，它会将其解释为一个表达式，然后这个表达式会成为新函数的主体。在这里，如果你有全局定义的 `x` 和 `y` 以便能够计算
  `x + y`，那么你会得到一个主体为 `c(2, 2, x+y)` 的函数，其中 `x+y` 引用的是全局变量 `x` 和 `y` 的和的*值*，而不是它们的*表达式*。


  新函数的环境默认是调用 `as.function` 时的环境。因此，要创建一个闭包，你只需在另一个函数内部调用 `as.function` 即可。


  ```

  nested

  (h

  ```


  这里你在 `nested` 内部调用了 `as.function`，因此在此创建的这些函数的环境将会知道 `nested` 的参数 `z`，并能够在 `y` 的默认值中使用它。


  不要尝试这样写：


  ```

  nested <- function(y) {

  as.function(alist(x =, y = y, x + y))

  }

  ```


  请记住，作为默认参数的表达式会在你定义的函数主体内部进行惰性求值。这里，你指定 `y` 应该求值为 `y`，这是一个循环依赖。这与 `as.function`
  无关。你在下面的定义中也会遇到同样的问题：


  ```

  nested <- function(y) {

  function(x, y = y) x + y

  }

  ```


  如果你想要类似的功能，即创建一个具有给定默认值 `y` 的函数，并且你绝对希望所创建的函数将该参数命名为 `y`，那么你需要在嵌套作用域中对表达式求值，并使用不同的名称来引用它，以避免嵌套函数的参数遮蔽它。


  ```

  nested <- function(y) {

  z <- y

  function(x, y = z) x + y

  }

  nested(2)(2)

  ## [1] 4

  ```


  如果你不希望新函数的环境是当前环境，你可以为 `as.function` 指定一个环境，以明确其定义域。在下面的例子中，你有两个用于构建闭包的函数。第一个创建的函数可以看到包围它的
  `z`，而另一个则使用了全局环境，因此根本不是闭包，所以参数 `z` 不可见。相反，全局的 `z` 是可见的。


  ```

  nested <- function(z) {

  as.function(alist(x =, y = z, x + y))

  }

  nested2 <- function(z) {

  as.function(alist(x =, y = z, x + y),

  envir = globalenv())

  }

  ```


  如果你对用这两个函数创建的函数进行求值，`nested` 创建的那个会将 `x` 与你在调用 `nested` 时提供的 `z` 值相加，而 `nested2`
  创建的那个则会忽略其输入，并在全局作用域中寻找 `z`。


  ```

  z <- -1

  nested(3)(1)

  ## [1] 4

  nested2(3)(1)

  ## [1] 0

  ```


