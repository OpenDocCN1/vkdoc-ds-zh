- 'no': 78
  overturn_probability: 0.0
  alternative: 正文前置内容标题（关于作者）
  counter_evidence:
  - 根据规则，“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”。虽然它属于前置内容，但它紧接在目录之后，通常与“引言”或“前言”合并，或者单独作为“关于本书”章节。然而，如果
    Line 18 "引言" 已经作为一个章节起始，那么 Line 78 "关于作者" 是否应该新开一章？通常“关于作者”是书的末尾或前言的一部分。但在 Apress/Springer
    书籍结构中，Copyright、Dedication, Intro, Chapter 1... 以及 About the Author 通常都是独立的逻辑块。如果
    Line 18 是 Intro 的起始，那么 Line 78 作为 About Author 的起始，确实构成了一个新的逻辑部分。但仔细看图，Line 78
    后面直接跟了 Line 80 "第一章" 的正文。通常“关于作者”是在全书最后。这里出现在目录后、正文前，可能是排版错误或者是 "About this Book"
    部分。鉴于规则要求前置内容分章，且它与前面的“引言”在语义上是不同的元数据部分，保留分章是合理的。但更严格的反证是：它可能只是版权页/关于作者页，通常这些页面在电子书中不单独成章，或者归入“前言/版权”大章。如果
    Line 18 是 Intro，Line 78 是 About Author，它们之间没有正文，通常可以合并为一个“前置部分”章，或者分别开章。考虑到 18
    是 Intro，78 是 About Author，间隔了目录（32-74），这在逻辑上是两个独立的前置块。因此 78 开新章是合理的。
  keep_split: true
