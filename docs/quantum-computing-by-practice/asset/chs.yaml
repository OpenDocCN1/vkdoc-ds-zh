  \n伯恩斯坦-瓦齐拉尼算法是 1997 年提出的多伊奇-乔萨算法的扩展。¹⁶ 该算法与多伊奇-乔萨算法相似，但更为复杂：\n\n1.  我们从相同的函数 `f({x0,x1,..,xn})`\
  \ 开始，其中 `{x0,x1,..,xn}` 是一个比特串，`f(x)` 返回 0 或 1。\n\n2.  区别在于：与多伊奇-乔萨算法中函数是平衡函数或常数函数不同，`f(x)`\
  \ 返回输入 `x` 与某个秘密字符串 `s` 的按位乘积。\n\n3.  目标是找到秘密字符串 `s`，使得 `f(x) = s . x (mod 2)`，通过使用变换\
  \ `![$$ {H}^{\\otimes n}\\left.|s\\right\\rangle =\\frac{1}{\\sqrt{2^n}}\\sum \\\
  limits_{x\\in \\left\\{0.1\\right\\}}{\\left(-1\\right)}^{s.x}\\left.|x\\right\\\
  rangle $$](img/469026_2_En_9_Chapter_TeX_IEq3.png)`\n\n其中 `|s>` 是秘密比特串的 n 量子比特态置换，`|x>`\
  \ 是输入空间。电路和数学解释如图 9-6 所示。\n\n| ![](img/469026_2_En_9_Fig6_HTML.png)一个量子电路有 2 组 4\
  \ 个 H 块，分别接在管道 0 右尖括号和管道 S 右尖括号上，并连接到中央的 f 块。图 9-6 伯恩斯坦-瓦齐拉尼算法的量子电路 | 在两个量子比特上应用的哈达玛门给出：![$$\
  \ {H}^{\\otimes 2}\\left.|00\\right\\rangle =\\frac{1}{2}\\left(\\left.|00\\right\\\
  rangle +\\left.|01\\right\\rangle +\\left.|01\\right\\rangle +\\left.|11\\right\\\
  rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_IEq4.png)![$$ {H}^{\\otimes 2}\\\
  left.|01\\right\\rangle =\\frac{1}{2}\\left(\\left.|00\\right\\rangle -\\left.|01\\\
  right\\rangle +\\left.|01\\right\\rangle -\\left.|11\\right\\rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_IEq5.png)![$$\
  \ {H}^{\\otimes 2}\\left.|10\\right\\rangle =\\frac{1}{2}\\left(\\left.|00\\right\\\
  rangle +\\left.|01\\right\\rangle -\\left.|01\\right\\rangle -\\left.|11\\right\\\
  rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_IEq6.png)![$$ {H}^{\\otimes 2}\\\
  left.|11\\right\\rangle =\\frac{1}{2}\\left(\\left.|00\\right\\rangle -\\left.|01\\\
  right\\rangle -\\left.|01\\right\\rangle +\\left.|11\\right\\rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_IEq7.png)这可以表示为对输入比特串\
  \ `x` 的求和：![$$ {H}^{\\otimes 2}\\left.|a\\right\\rangle =\\frac{1}{2}\\sum \\limits_{x\\\
  in \\left\\{0.1\\right\\}}{\\left(-1\\right)}^{a.x}\\left.|x\\right\\rangle $$](img/469026_2_En_9_Chapter_TeX_IEq8.png)\
  \ |\n\n提示\n\n请记住 `![$$ H\\left.|0\\right\\rangle =\\frac{1}{\\sqrt{2}}\\left(\\\
  left.|0\\right\\rangle +\\left.|1\\right\\rangle \\right),\\kern0.5em H\\left.|1\\\
  right\\rangle =\\frac{1}{\\sqrt{2}}\\left(\\left.|0\\right\\rangle -\\left.|1\\\
  right\\rangle \\right),\\left.|0\\right\\rangle \\otimes \\left.|0\\right\\rangle\
  \ =\\left.|00\\right\\rangle $$](img/469026_2_En_9_Chapter_TeX_IEq9.png)`。\n\n练习\
  \ 9.6：通过乘法证明 `![$$ {H}^{\\otimes 2}\\left.|00\\right\\rangle =\\frac{1}{2}\\left(\\\
  left.|00\\right\\rangle +\\left.|01\\right\\rangle +\\left.|01\\right\\rangle +\\\
  left.|11\\right\\rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_IEq10.png)`。\n\
  \n`![$$ {H}^{\\otimes 2}\\left.|00\\right\\rangle =\\frac{1}{\\sqrt{2}}\\left(\\\
  left.|0\\right\\rangle +\\left.|1\\right\\rangle \\right)\\otimes \\frac{1}{\\sqrt{2}}\\\
  left(\\left.|0\\right\\rangle +\\left.|1\\right\\rangle \\right)=\\frac{1}{2}\\\
  left(\\left.|00\\right\\rangle +\\left.|01\\right\\rangle +\\left.|01\\right\\rangle\
