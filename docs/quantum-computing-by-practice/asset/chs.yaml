  \ * (|001> + |101> + |011> + |111>)`。\n\n2.  两个 CNOT 门将所有量子比特纠缠到状态`1/sqrt(2) * (|001>\
  \ + |010> + |100> + |111>)`。\n\n3.  最后，三个 Hadamard 门将第二步映射到状态`1/2 * (|000> - |111>)`。\n\
