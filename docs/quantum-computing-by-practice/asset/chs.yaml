  --- %s seconds ---\" % (time.time() - start_time))\n```\n\n**列表 7-2** 超密编码 Python\
  \ 脚本\n\n让我们在下一节中查看一次运行脚本 7-2 的结果。\n\n\n\n### 查看结果\n\n清单 7-2 运行一次的标准输出如下所示：\n\n```\n\
  C:\\python36-64\\python.exe p07-superdensecoding.py\nOPENQASM 2.0;\ninclude \"qelib1.inc\"\
