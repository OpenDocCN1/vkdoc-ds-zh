  \ `id`（访问令牌）。**请注意，API 令牌（用于身份验证）与访问令牌（用于调用操作）不同。** *提示：将访问令牌存储在 Postman 全局变量中，以便在后续操作中使用。*\n\
  \n4.  创建一个新请求：通过密码进行身份验证。使用以下参数：\n    1.  类型：`POST`\n    2.  URL：来自本章的身份验证部分：[`https://auth.quantum-computing.ibm.com/api/users/login`](https://auth.quantum-computing.ibm.com/api/users/login)\n\
