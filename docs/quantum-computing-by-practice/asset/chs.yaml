  \ 20 世纪早期并不流行。事实上，它们受到了一种名为“超决定论”的理论的挑战，该理论试图为这些原理寻找一条出路。\n\n\n\n#### 超级决定论：摆脱“幽灵”之途。爱因斯坦自始至终都是对的吗？\n\
  \n在 1969 年接受英国广播公司（BBC）采访时，物理学家约翰·贝尔谈到了他在量子力学方面的工作。他说，我们必须接受这样的预言：在对纠缠粒子进行测量时，作用力的传递会超过光速，但同时我们对此无能为力。信息不能以超过光速的速度传播，这一事实同样也被量子力学所预言。仿佛大自然在和我们玩一个把戏。他还提到，有一种方法可以通过一个名为**超级决定论**的原理来解开这个谜题。\n\
  \n粒子纠缠意味着，对一个粒子进行的测量会瞬间影响另一个粒子，即使它们相隔遥远（想想银河系或宇宙的两端），甚至跨越时间。爱因斯坦是这一理论的强烈反对者，他给尼尔斯·玻尔写信时有一句著名的话：`上帝不会掷骰子`。他无法接受量子力学的概率性质，因此，在\
  \ 1935 年，他与同事波多尔斯基和罗森一起，提出了那个著名的`EPR`悖论，旨在挑战量子力学的基础。在`EPR`悖论中，如果两个纠缠粒子被极其遥远的距离隔开，对其中一个粒子的测量不可能瞬间影响到另一个粒子，因为这种影响必须以超光速传播（而光速是宇宙中的终极速度极限）。这将违反广义相对论，从而产生一个悖论：没有什么能比光速更快，这是相对论的绝对法则。\n\
  \n然而，在 1982 年，量子力学的预言被法国物理学家阿兰·阿斯佩证实。他设计了一个实验，表明纠缠光子违反了贝尔不等式。他还证明，对其中一个纠缠光子的测量，会以超光速将自身状态信号传递给另一个光子。自那以后，阿斯佩的实验结果被一次又一次地证明是正确的（关于他实验的详细信息见第\
  \ 1 章）。讽刺的是，有可能爱因斯坦一直都是对的，而粒子纠缠不过是一种幻觉。关键在于超级决定论原理。\n\n**提示**\n\n简单来说，超级决定论认为，自宇宙诞生之初，自由选择就已经被取消了。所有粒子的关联和纠缠都在大爆炸的那一刻就已建立。因此，并不需要超光速信号来告诉粒子\
  \ B 粒子 A 的结果是什么。\n\n如果这一理论成立，它将证明爱因斯坦在提出“`EPR`”悖论时是正确的，而我们迄今为止的所有辛勤工作都只是幻觉。但这个原理听起来更像是宗教教条（一切结果都由命运决定），而不是科学，正如贝尔所认为的那样，超级决定论是不可信的。他的理由是，由于大量微小效应所带来的改变，在需要的情况下，自由选择实际上是自由的。超级决定论被称为无法检验的理论，因为实验者永远无法消除那些在宇宙诞生之初就建立起来的关联。尽管如此，这并没有阻止科学家们试图证明爱因斯坦是正确的，而粒子纠缠是幻觉。事实上，有一项实验正在艰苦进行中，试图解决这个问题，并且构思非常巧妙。让我们来看看。\n\
  \n![](img/469026_2_En_4_Fig4_HTML.jpg)\n\n该示意图展示了贝尔不等式检验实验，以及一个使用宇宙光子的实验变体。标签分别是偏振滤光片、钙源、激光束和计数器。\n\
  \n**图 4-4** 使用宇宙光子的贝尔不等式实验与标准测试对比\n\n图 4-4 展示了标准的贝尔不等式测试实验（底部）以及由安德鲁·弗里德曼及其在麻省理工学院的同事提出的使用宇宙光子的实验变体（顶部）。^(⁹)\n\
  \n**提示**\n\n关于标准贝尔不等式测试的完整描述，请参见第 1 章。\n\n弗里德曼及其同事提出了一个使用宇宙射线对标准贝尔实验进行的新颖变体。其想法是利用实时天文观测——观测我们银河系中的遥远恒星、遥远的类星体或宇宙微波背景的某片区域——本质上是让宇宙来决定如何设置实验，而不是使用标准的量子随机数生成器。也就是说，在纠缠光子到达之前，利用来自遥远星系的光子来控制偏振滤光片的朝向。\n\
  \n如果成功，其意义将是开创性的。如果此类实验的结果没有违反贝尔不等式，那就意味着超级决定论最终可能是正确的。粒子纠缠将是一种幻觉，纠缠粒子间的信号传递也无法像相对论所预言的那样超光速。爱因斯坦将是对的，不存在超距的“幽灵”作用。\n\
  \n对量子力学来说幸运的是，到目前为止还没有发生过这种情况。请记住，弗里德曼和他的同事们并不是唯一参与其中的团队。目前有多个团队正试图解开这个谜题。事实上，他们大多数结果都与量子力学相符。也就是说，他们的结果违反了贝尔不等式。因此，爱因斯坦和玻尔在相对论与量子力学之争中所造成的裂痕似乎至今仍未弥合。下一节将展示如何通过\
  \ IBM Quantum 简洁的 REST API 进行远程访问。\n\n## 通过 REST API 进行远程访问\n\nQuantum 拥有一个相对来说不为人知的\
  \ REST API，它在幕后处理所有的远程通信。当前的 Python SDK 都使用了它：\n\n* Qiskit：量子信息软件工具包（Quantum Information\
  \ Software Kit）是在 Python 中进行量子编程的事实上的访问工具。\n* QiskitIBMQProvider：一个与 Qiskit 捆绑的、不太知名的库，它将\
  \ REST API 封装在一个 Python 客户端中。\n\n在本节中，我们将深入探究 `IBMQprovider`，并查看用于远程访问的不同 REST 端点。但首先，需要进行身份验证。\n\
  \n### 身份验证\n\n要调用任何 REST API，我们首先必须获得一个访问令牌。这将是调用本节中任何调用的访问密钥。有两种方法可以获得此令牌：\n\n\
