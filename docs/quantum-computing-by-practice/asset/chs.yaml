  \ 态测试的三量子比特纠缠\n\n这些测试以物理学家格林伯格-霍恩-泽林格（Greenberger-Horne-Zeilinger）的名字命名，他们提出了一种针对\
  \ N 个纠缠量子比特的推广测试，其中最简单的就是三量子比特 GHZ 态：\n\n```\n|GHZ> = 1/sqrt(2) * (|000> - |111>)\n\
  ```\n\n**注意**\n\nGHZ 态的重要性在于，它们表明多于两个粒子的纠缠不仅在统计（概率）预测上，而且在非统计（确定性）预测上都与局域实在论相矛盾。\n\
  \n简而言之，GHZ 态表现出对贝尔不等式的更强违背。让我们通过一个简单的谜题来看看这是如何实现的：假设有三个独立的盒子，每个盒子包含两个变量 X、Y。每个变量有两个可能的结果：1、-1。问题是要找出一组\
  \ X、Y 的值，使之满足以下一组恒等式：\n\n```\n(1) XYY = 1\n(2) YXY = 1\n(3) YYX = 1\n(4) XXX = -1\n\
  ```\n\n对于心急的读者来说，这个问题无解。例如，在(1)、(2)和(3)中将`Y = 1`代入，然后将它们相乘，即(5) = (1) * (2) * (3)。这组等式就变成了：\n\
  \n```\n(1) X11 = 1\n(2) 1X1 = 1\n(3) 11X = 1\n(4) XXX = -1\n(5) 将(1)(2)(3)相乘，我们得到\
  \ XXX = 1\n```\n\n没有解，因为等式(4)`XXX = -1`与等式(5)`XXX = 1`相矛盾。可怕的是，一个 GHZ 态确实能够为这个问题提供一个解。这在经典实在论的确定性观点看来似乎是不可能的，但在量子力学的世界里，没有不可能，只有概率低。\n\
  \n难以置信的是，GHZ 测试可以在单次实验运行后便确定性地排除局域实在论描述。但首先，我们必须构建一个 GHZ 基态。尝试在作曲家中构建表 4-6 中的电路，以查看概率是否与左侧图表匹配。\n\
  \n**表 4-6** GHZ 基态\n\n| `|GHZ> = 1/sqrt(2) * (|000> - |111>)` | 构建 GHZ 基态的电路图。它包含三个量子比特\
  \ Q1、Q2 和 Q3。三个测量门分别对应 0、1 和 2。量子比特之间使用受控非门连接。 |\n\n为了启动实验，表 4-6 展示了 GHZ 基态（以及相应的概率结果，概率应约为一半）：\n\
