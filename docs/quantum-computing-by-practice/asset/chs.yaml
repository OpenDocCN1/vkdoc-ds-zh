  \"displayUrls\": {\n\"png\": \"URL\"\n},\n\"isPublic\": false,\n\"id\": \"…\",\n\
  \"userId\": \"…\"\n}]}\n清单 4-5\n实验列表响应\n```\n\n### 在硬件上运行作业\n\n使用此调用向您的客户计划中可用的硬件处理器提交量子作业。\n\
  \n* **HTTP 方法：** `POST`\n* **URL：** `https://runtime-us-east.quantum-computing.ibm.com/jobs`\n\
  \n#### HTTP 标头\n\n| 名称 | 值 |\n| --- | --- |\n| `X-Access-Token` | 访问令牌 |\n| `Content-Type`\
  \ | `application/json` |\n\n#### 负载格式\n\n负载的格式将执行参数（后端名称、执行次数和代码）全部嵌入到单个 JSON 文档中，如下所示。\n\
  \n```\n{\n\"program_id\": \"circuit-runner\",\n\"hub\": \"ibm-q\",\n\"group\": \"\
  open\",\n\"project\": \"main\",\n\"backend\": \"ibmq_quito\",\n\"params\": {\n\"\
  shots\": 1024,\n\"circuits\": [\n\" OPENQASM 2.0;\\ninclude \\\"qelib1.inc\\\";\\\
  n\\nqreg q[4];\\ncreg c[4];\\nh q[0];\\nh q[1];\\nx q[0];\\nmeasure q[0] -> c[0];\"\
  \n]\n},\n\"tags\": [\n\"composer-info:composer:true\",\n\"composer-info:code-id:d2262dd4e07a9f894caabd977b10c7e98d90537228723dd14dceaab023c36098\"\
  ,\n\"composer-info:code-version-id:646d2a856260a179aa094d3e\"\n]\n}\n```\n\n上述负载向真实设备\
  \ `ibmq_quito` 提交了一个随机实验。提交前请确保该设备在线（或改用模拟器）。同时确保 QASM 代码是包含换行符（`\\n`）的单行文本。注意双引号必须转义。如果提交失败，通常意味着设备离线或\
  \ QASM 负载无效。\n\n#### 响应格式\n\n如果一切正常，响应将如下所示：\n\n```\n{\n\"id\": \"chn19jpike34bjj7d400\"\
  ,\n\"backend\": \"ibmq_quito\"\n}\n```\n\n`id` 值代表作业 ID。您可以在仪表盘的“作业”菜单中监控其状态（见图\
