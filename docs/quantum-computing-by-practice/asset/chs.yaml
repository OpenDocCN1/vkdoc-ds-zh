  \ 1024，导致概率小于 `1`。\n\n![](img/469026_2_En_7_Fig7_HTML.jpg)\n\n一组 2 个截图。左侧是一个计数与\
  \ 11 的条形图。它绘制了一个 1024 计数的条形。右侧有 3 条水平线，分别为 q 0、q 1 和 c，以及各种门和屏障图标。\n\n**图 7-7**\
  \ 超密编码结果与电路图\n\n因此，超密编码提供了将两个经典比特编码到单个量子比特中的方法。需要注意的是，量子计算认为每个量子比特不可能存储超过一个经典比特，这似乎与本节中展示的内容相矛盾。事实上，这并不矛盾。该协议之所以有效，是因为\
  \ Alice 和 Bob 的量子比特通过贝尔对纠缠在一起。这使得可以通过 Alice 的纠缠量子比特发送两个经典比特。总而言之，只要你的量子比特通过贝尔对与另一个量子比特纠缠，每个量子比特最多可以存储两个经典比特。请注意，我们假设贝尔对可以在\
  \ Alice 和 Bob 之间以某种方式传输，而实际上这是一个艰巨的任务，并且需要大量研究。\n\n总的来说，该协议可以解释为一组模块化的抽象：一个贝尔对生成器模块，用于创建两个纠缠的量子比特；随后是一个信息编码器模块，应用\
  \ Alice 的规则来编码 2 个经典比特的信息；最后，一个解码器模块从贝尔对以及编码器模块提供的量子比特中提取经典比特（如果你愿意，可以将其视为一种量子压缩/解压缩工具）。超密编码为量子信息处理提供了一个高层次图景，并将帮助你理解本章的下一项内容：量子隐形传态。\n\
  \n> **提示**  \n> 这个简单的协议是物理学家查尔斯·贝内特在 1992 年开发的，距离量子力学的发现已近 70 年。尽管相对简单，但它并非显而易见的程序，通过详细研究可以学到非凡的东西。\n\
  \n## 量子隐形传态\n\n量子隐形传态是一种与超密编码密切相关的过程。或许“隐形传态”这个词有些夸张，因为我们并没有传送任何东西，至少不是科幻/《星际迷航》意义上的传送。从形式上讲，量子隐形传态是指一个量子比特的状态（`Ψ`）可以借助经典通信和上一节讨论的贝尔对从一个位置传输到另一个位置的过程。该过程总结在图\
  \ 7-8 中。\n\n![](img/469026_2_En_7_Fig8_HTML.jpg)\n\n一个框图连接了贝尔对 00 + 11、贝尔基测量以及通过测量结果进行恢复的各个模块：Bob、Alice\
  \ 管道的 psi 右尖括号 = alpha 右尖括号 + beta psi 右尖括号。最终导向 psi 右尖括号。\n\n**图 7-8** 量子隐形传态工作流程\n\
  \n1.  Alice 和 Bob 首先共享一对纠缠的贝尔对量子比特。一个给 Alice，另一个给位于不同远程位置的 Bob。想象贝尔对是由第三方（Eve）准备的。\n\
  \n2.  Alice 准备她要传输的量子比特，状态为 `|Ψ⟩ = α|0⟩ + β|1⟩`。然后她对她的量子比特以及 Eve 提供的贝尔对中的纠缠量子比特进行贝尔基测量。接着，Alice\
  \ 通过经典方式将测量结果发送给 Bob。\n\n3.  此时，Bob 的量子比特存在一个后验状态，该状态是 Alice 执行的测量结果的函数。这是理解该过程的关键；请记住，两者共享一个纠缠的量子比特。因此，我们将看到\
  \ Bob 如何通过应用适当的量子门来恢复 Alice 创建的原始状态 `Ψ`。\n\n让我们通过观察 Bob 在 Alice 测量时刻、恢复操作之前的后验状态来弄清楚这一点。为此，我们写出过程中涉及的三个量子比特的联合状态。注意，为简单起见，忽略了\
  \ ket 符号。因此，给定 Alice 的状态 `|Ψ⟩ = α|0⟩ + β|1⟩`，如果我们将其与 Eve 提供的共享纠缠量子比特（来自贝尔对）结合起来，我们得到：\n\
  \n```\n(α0 +β1) (00 + 11) = α000 + α011 + β100 +β111       (1)\n```\n\n现在我们需要使用贝尔基状态写出前两个量子比特的状态：\n\
  \n```\n| B0 = 00 + 11\nB1 = 10 + 01\nB2 = 00 - 11\nB3 = 10 - 01 |\n00 = B0 - B1\n\
  01 = B1 - B3\n10 = B1 - B3\n11 = B0 - B2\n```\n\n表达式 (1) 变为：\n\n```\n(α0 +β1) (00\
  \ + 11) = B0 (α0 + β1) + B1 (α1 + β0) + B2 (α0 - β1) + B3 (-α1+ β0)      (2)\n```\n\
  \n表达式 (2) 显示了 Alice 执行测量后三个量子比特的状态。Bob 通过查看表达式 2 中量子比特的后验状态（括号内的状态）知道如何恢复 Alice\
  \ 的 `Ψ`。这更清楚地显示在表 7-5 中。\n\n**表 7-5** 量子隐形传态恢复\n\n| 贝尔状态 | 后验状态 | Bob 的恢复操作 |\n\
  | --- | --- | --- |\n| `B0` | `α0 + β1` | `Ψ` |\n| `B1` | `α1 + β0` | `XΨ` |\n|\
  \ `B2` | `α0 - β1` | `ZΨ` |\n| `B3` | `-α1 + β0` | `ZXΨ` |\n\n总而言之，量子隐形传态协议提供了通过两个远程方之间共享纠缠贝尔对来恢复任何量子比特状态\
  \ `Ψ` 的方法，因此得名“隐形传态”。现在让我们为该协议构建一个电路，在模拟器中运行，最后查看结果。\n\n\n\n### Composer 电路\n\n\
  图 7-9 展示了量子隐形传态协议的 composer 电路及其执行结果（仅为模拟器——此时尚无可用的真实设备）：\n\n![](img/469026_2_En_7_Fig9_HTML.jpg)\n\
  \n一组两张截图。顶部的截图有 6 条水平线，分别对应 `q 0`、`q 1`、`q 2`、`c 0`、`c 1` 和 `c 2`，并包含量子门、屏障和操作图标。底部的截图是隐形传态柱状图，设备为模拟器，并包含用于量子态计算基的下载\
  \ CSV 按钮。\n\n**图 7-9** Composer 的量子隐形传态电路\n\n-   屏障符号（虚线）左侧的量子门代表由第三方（Eve）制备的贝尔对：量子比特\
  \ 1 和 2。\n-   Alice 将她的量子比特（0）制备到给定状态 `Ψ`。`Ψ` 的实际值无关紧要，因为最终会由 Bob 在过程最后阶段恢复。Alice\
  \ 从 Eve 处接收 `qubit[1]`；`qubit[2]` 则发送给 Bob。\n-   Alice 对她的量子比特 `[0,1]` 执行测量（如虚线右侧所示），并通过经典方式将结果发送给\
  \ Bob。\n-   Bob 根据上一节提到的恢复规则，依据 Alice 发送的结果，将恢复规则应用于他的量子比特（2）。最后，在对 `qubit[2]` 进行测量后，Bob\
  \ 恢复了最初由 Alice 创建的状态 `Ψ`。这一切之所以可能，是因为 Alice 和 Bob 共享一对纠缠的量子比特，这正是整个方案得以运作的关键。\n\n\
  当然，图 7-9 的执行结果需要进一步处理，以验证 Bob 的 `Ψ` 与 Alice 的一致。最佳方法是使用 Python 脚本。在下一节中，我们将远程运行同一个电路，并查看结果以验证该协议是否有效。\n\
  \n### 在 Python 中运行\n\n本节我们使用 Python 在模拟器中远程运行量子隐形传态协议。请注意，目前量子隐形传态无法在 **IBM Q Experience**\
  \ 的**真实量子设备**上运行。这是因为当前硬件不支持 Alice 创建其状态 `Ψ` 所需的旋转门。因此，我们将改用远程模拟器——使用本地 Python 模拟器也完全可以。清单\
  \ 7-3 展示了该协议的实际运行。其中特别说明：\n\n-   创建三个量子比特供双方（Alice 和 Bob）共享，外加三个经典寄存器（`c0`、`c1`、`c2`）用于存储\
  \ Alice 的结果（第 20-23 行）。\n-   Eve 通过对量子比特 1 和 2 施加 Hadamard 门 (`H`)，接着施加受控非门 (`CNOT`)\
  \ 来制备贝尔对（第 35-37 行）。\n-   Alice 通过在 Y 轴上旋转 `π/4` 弧度，将她的状态 `ѱ` 制备到量子比特 0 上（第 32 行）。\n\
  -   Alice 现在将她的 `qubit[0]` 与分配给她的贝尔对量子比特 `qubit[1]` 纠缠起来。然后她对两者进行测量，并将结果存储到经典寄存器\
  \ 0、1 中（第 35-41 行）。\n-   接下来轮到 Bob：他根据 Alice 发送的结果，对她的量子比特（2）施加 `Z` 或 `X` 门：如果经典寄存器\
  \ 0 为 1，则施加 `Z` 门。如果经典寄存器 1 为 1，则施加 `X` 门。然后他测量自己的量子比特，并将结果存储到经典寄存器 2 中（第 47-50\
  \ 行）。\n-   该程序在远程模拟器（`ibmq_qasm_simulator`）中执行，并收集结果用于显示和验证（第 58-79 行）。\n\n> **提示**：此程序的源代码包含在原书源代码的\
  \ `Workspace\\Ch07\\p07-teleport.py` 目录下。\n\n```\nimport sys,time,math\nimport numpy\
  \ as np\n# Importing QISKit\nfrom qiskit import *\n# Import basic plotting tools\n\
  from qiskit.tools.visualization import plot_histogram\ndef main():\n# Creating registers\n\
  q = QuantumRegister(3, 'q')\nc = ClassicalRegister(3,'c')\n# Quantum circuit to\
  \ make the shared entangled state (Bell Pair)\nteleport = QuantumCircuit(q, c, name='teleport')\n\
  teleport.h(q[1])\nteleport.cx(q[1], q[2])\n# Alice prepares her quantum state to\
  \ be teleported,\n# psi = a|0> + b|1> where a = cos(theta/2), b = sin (theta/2),\
  \ theta = pi/4\nteleport.ry(np.pi/4,q[0])\n# Alice applies CNOT to her two quantum\
  \ states followed by H, to entangle them\nteleport.cx(q[0], q[1])\nteleport.h(q[0])\n\
  teleport.barrier()\n# Alice measures her two quantum states:\nteleport.measure(q[0],\
  \ c[0])\nteleport.measure(q[1], c[1])\n# dump qasm. Note: cannot dump after c_if\n\
  circuits = [teleport]\nprint(circuits[0].qasm())\n##### BOB Depending on the results\
  \ applies X or Z, or both, to his state\nteleport.z(q[2]).c_if(c[0], 1)\nteleport.x(q[2]).c_if(c[1],\
  \ 1)\nteleport.measure(q[2], c[2])\n# Execute in the simulator\nbackend = Aer.get_backend(\"\
  qasm_simulator\")\nresult = execute(circuits, backend=backend).result()\nprint(\"\
  Counts:\" + str(result.get_counts(\"teleport\")))\n# RESULTS\n# Alice's measurement:\n\
  data = result.get_counts('teleport')\nprint (data)\nalice = {}\nalice['00'] = data['000']\
  \ + data['100']\nalice['10'] = data['010'] + data['110']\nalice['01'] = data['001']\
  \ + data['101']\nalice['11'] = data['011'] + data['111']\nplot_histogram(alice,\
  \ filename='alice.png')\n#BOB\nbob = {}\nbob['0'] = data['000'] + data['010'] +\
  \  data['001'] + data['011']\nbob['1'] = data['100'] + data['110'] +  data['101']\
  \ + data['111']\nplot_histogram(bob,  filename='bob.png')\n###########################################\n\
  # main\nif __name__ ==  '__main__':\nstart_time = time.time()\nmain()\nprint(\"\
  --- %s seconds ---\" % (time.time() - start_time))\n```\n\n**清单 7-3** 量子隐形传态的 Python\
  \ 脚本\n\n为了验证结果，必须收集模拟器返回的 Alice 和 Bob 的结果计数。绘制结果图表是验证 Bob 是否已恢复 Alice 的状态 `Ψ` 的最佳方式。以下是模拟器返回的示例输出：\n\
  \n```\n{'100': 37, '101': 45, '111': 43, '011': 215, '001': 200, '000': 206, '010':\
  \ 230, '110': 48}\n```\n\n在此 JSON 字符串中，左侧是三个量子比特结果的倒序排列。例如，在第一个结果 `1 0 0` 中：`B(1)`\
  \ `A(0)` `A(0)`，其中 Alice = A, Bob = B。右侧是该特定结果对应的计数。请记住，该结果的概率（用于绘图）是通过将计数除以总发射次数（1024）计算得出的，因此：\n\
  \n```\nP(1 0 0) = 37/1024 = 0.036\n```\n\n从执行清单 7-3 得到的 Alice 和 Bob 的结果直方图如图 7-10\
  \ 所示。\n\n![](img/469026_2_En_7_Fig10_HTML.jpg)\n\n一组两个柱状图：一个展示 Alice 的结果，其概率与值 00、01、10、11\
  \ 对应；另一个展示 Bob 的结果，其概率与值 0 和 1 对应。Alice 的图中，10 和 01 分别具有最高概率 0.262695 和最低概率 0.227539。Bob\
  \ 的图中，0 具有最高概率，1 具有最低概率。\n\n**图 7-10** Alice 和 Bob 测量的概率结果\n\n那么，这一切意味着什么？我们又如何知道状态\
  \ `Ψ` 已被 Bob 恢复？让我们更详细地审视这些结果。\n\n\n\n### 查看结果\n\n为了解读这些结果，首先我们来了解如何根据列表 7-3 返回的计数计算出概率值：\n\
  ```\n{'1 0 0': 37, '1 0 1': 45, '1 1 1': 43, '0 1 1': 215, '0 0 1': 200, '0 0 0':\
  \ 206, '0 1 0': 230, '1 1 0': 48}\n```\n利用这些计数，我们可以计算出图 7-10 中爱丽丝和鲍勃各自结果所对应的概率（参见表\
  \ 7-6）。\n\n**表 7-6** 量子隐形传态实验的概率结果\n\n| 行号 |      |      | 结果组合 | 计数 | 概率 |    \
  \  | 爱丽丝 | 概率和 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 0 |\
  \ 爱丽丝(00) | 鲍勃(0) | 0 0 0 | 206 | 0.201171875 |      | 0 0 | 0.237304688 |\n| 1\
  \ | 爱丽丝(01) | 鲍勃(0) | 0 0 1 | 200 | 0.1953125 |      | 1 0 | 0.239257813 |\n| 2\
  \ | 爱丽丝(10) | 鲍勃(0) | 0 1 0 | 230 | 0.224609375 |      | 0 1 | 0.271484375 |\n|\
  \ 3 | 爱丽丝(11) | 鲍勃(0) | 0 1 1 | 215 | 0.209960938 |      | 1 1 | 0.251953125 |\n\
  | 4 | 爱丽丝(00) | 鲍勃(1) | 1 0 0 | 37 | 0.036132813 |      |      |      |\n| 5 | 爱丽丝(01)\
  \ | 鲍勃(1) | 1 0 1 | 45 | 0.043945313 |      | **鲍勃** |      |\n| 6 | 爱丽丝(10) | 鲍勃(1)\
  \ | 1 1 0 | 48 | 0.046875 |      | 0 | 0.831054688 |\n| 7 | 爱丽丝(11) | 鲍勃(1) | 1\
  \ 1 1 | 43 | 0.041992188 |      | 1 | 0.168945313 |\n\n如表 7-6 所示，要计算爱丽丝结果为`00`的总概率，我们需要将第\
  \ 0 行和第 4 行的概率列相加，即 `P(A00) = 0.201 + 0.036 = 0.237`。同样的规则也适用于鲍勃。例如，`P(B0) = 0.20\
  \ + 0.19 + 0.22 + 0.20 = 0.83`（将第 0-3 行的概率列相加）。右侧展示了爱丽丝和鲍勃所有结果的概率和。这就是列表 7-3 中的脚本在绘制图\
  \ 7-10 所示结果之前对数据进行处理的方式。但这意味着什么？我们又怎么知道鲍勃已经恢复了爱丽丝的`Ψ`呢？让我们来看看鲍勃量子比特的总概率：\n\n| 鲍勃\
  \ |      |\n| --- | --- |\n| 0 | 0.20 + 0.19 + 0.22 + 0.20 = 0.83 |\n| 1 | 0.036\
  \ + 0.043 + 0.046 + 0.041 = 0.168 |\n\n量子力学指出，`Ψ`的概率由 `P(Ψ) = |Ψ|²` 给出。也就是说，概率密度是`Ψ`模的平方。现在请回忆，爱丽丝将`Ψ`准备为：\n\
  \n```\nΨ = RY(θ) 其中 θ = π/4\n```\n\n也就是说，爱丽丝在她的量子比特上绕 Y 轴施加了一个`π/4`的旋转。为了更清晰地理解这一点，让我们用几何图形来可视化状态`Ψ`（见图\
  \ 7-11）。\n\n一幅几何示意图展示了一条垂直双向线`|1⟩`，它在右侧以`θ/2`的角度绘制了 3 条线。这 3 条线中有 2 条被标记为`ψ`和`|0⟩`，距离分别为`α`和`β`，其中\
  \ `α = cos(θ/2)` 且 `β = sin(θ/2)`。\n\n**图 7-11** 爱丽丝的`Ψ`的叠加态\n\n请记住，叠加态`Ψ`可以用复数系数`α`和`β`描述为：\n\
  \n```\nΨ = α|0⟩ + β|1⟩\n```\n\n```\n|0⟩的概率 = |α|²， |1⟩的概率 = |β|²\n```\n\n但是，从图 7-11\
