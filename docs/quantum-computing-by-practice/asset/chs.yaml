  \n一个适用于任意秘密字符串大小的通用算法如代码清单 9-3 所示，电路和结果在图 9-7 中。\n\n![](img/469026_2_En_9_Fig7_HTML.jpg)\n\
  \n一组 2 张截图。左边显示一个电路，有 5 条水平线，分别代表 q 0、q 1、q 2、q 3 和 c，并带有各种门和屏障图标。右边显示一个计数与 101\
  \ 的条形图。图表绘制了一个计数为 1024 的条形。\n\n图 9-7 隐藏比特串 101 的伯恩斯坦-瓦齐拉尼电路和结果\n\n```\n### 初始化\n\
  import matplotlib.pyplot as plt\nimport numpy as np\nfrom qiskit import *\nfrom\
  \ qiskit.visualization import *\n### 生成器，用于一个以 n 个量子比特为输入的隐藏函数\ndef bv_oracle (n,\
  \ s) : #, qc) :\n### 反转 s 以匹配 Qiskit 的量子比特顺序\ns   = s[::-1]\nqc  = QuantumCircuit(n\
  \ + 1)\nfor q in range(n):\nif s[q] == '0':\nqc.i(q)\nelse:\nqc.cx(q, n)\nreturn\
  \ qc\n### 伯恩斯坦-瓦齐拉尼 (BV) 算法的 n 量子比特输入版本\ndef bv_circuit (n, s):\n#### 我们需要一个包含 n\
  \ 个量子比特，外加一个辅助量子比特的电路\n#### 还需要 n 个经典比特来写入输出\nbv = QuantumCircuit( n + 1, n)\n####\
  \ 将辅助量子比特置于 |->\n#bv.x(n)\nbv.h(n)\nbv.z(n)\n#### 在查询 oracle 之前应用哈达玛门\nfor i in\
  \ range(n):\nbv.h(i)\n#### 应用屏障\nbv.barrier()\n#### 应用内积 oracle\nbv = bv.compose(bv_oracle\
  \ (n, s))\n#### 应用屏障\nbv.barrier()\n#### 在查询 oracle 之后应用哈达玛门\nfor i in range(n):\n\
  bv.h(i)\n##### 测量\nfor i in range(n):\nbv.measure(i, i)\nreturn bv\n### 主程序\ns \
  \          = '101'    # 隐藏的二进制字符串\nn           = len(s)     # 用于表示 s 的量子比特数\nbvc\
  \         = bv_circuit (n, s)\n### 在模拟器中运行\nbackend     = Aer.get_backend('qasm_simulator')\n\
  results       = execute(bvc, backend).result()\nanswer      = results.get_counts()\n\
  display (bvc.draw())\nprint ('s =',s , ' n =',n , ' Result =', answer)\nplot_histogram(answer)\n\
  ```\n\n代码清单 9-3 适用于任意隐藏字符串 (`s`) 的通用伯恩斯坦-瓦齐拉尼算法\n\n练习 9.8：在量子实验室中对不同大小和排列的多种秘密字符串运行代码清单\
  \ 9-3。验证结果是否正确。\n\n练习 9.9：对于秘密字符串 011 和 110，oracle 电路会是什么样子？提示：使用量子实验室，并记住 Qiskit\
  \ 使用小端序比特排序（最低有效位绘制在电路顶部）。\n\n\n\n## 西蒙算法\n\n西蒙算法于 1997 年提出^(¹⁷)，是首个相对于最优经典解法展现出指数级加速的量子算法。事实上，这项工作启发了著名的量子傅里叶变换，而该变换正是肖尔因子分解算法的基础。与之前的算法类似，我们有一个预言机`f(x)`，它以两种方式将输入映射到输出：\n\
  \n*   **一对一**：每个输入唯一映射到一个输出。例如，`f(0) = 0`，`f(1) = 1`，`f(2) = 2`，`f(3) = 3`\n*  \
  \ **二对一**：两个输入映射到同一个输出。例如，`f(0) = 0`，`f(1) = 1`，`f(2) = 0`，`f(3) = 1`\n\n关键在于存在一个隐藏的比特串`b`，使得当`x1\
  \ ⊕ x2 = b`时，有`f(x1) = f(x2)`。任务是找到隐藏的比特串`b`，使得`b = x1x2x3...`代表`f(x)`的一对一映射。让我们看一下图\
  \ 9-8 中的内部结构。\n\n| ![](img/469026_2_En_9_Fig8_HTML.jpg) 一个量子电路有 2 组连接组件，用于表示|0⟩的\
  \ n 个量子比特。它连接了 4 个 H 模块和 4 个电流表模块与 Q f 模块。图 9-8 西蒙算法的量子电路 | 1) 初始化两个 n 量子比特寄存器。`|\
  \ ѱ1⟩ = | 0⟩^(⊗n) | 0⟩^(⊗n)` 2) 对第一个寄存器应用哈达玛门：`| ψ2⟩ = (1/√(2^n)) Σ_{x∈{0,1}} |x⟩\
  \ |0⟩^(⊗n)` 3) 应用预言机`Qf`：`| ψ3⟩ = (1/√(2^n)) Σ_{x∈{0,1}} |x⟩ |f(x)⟩` 4) 测量第二个寄存器：`|\
  \ ψ4⟩ = (1/√2) (|x⟩ + |y⟩), y = x ⊕ b` 5) 对第一个寄存器应用哈达玛门：`| ψ5⟩ = (1/√(2^(n+1)))\
  \ Σ_{x∈{0,1}} [(-1)^(x.z) + (-1)^(y.z)] |z⟩` 6) 测量第一个寄存器：`(-1)^(x.z) = (-1)^(y.z)`\
  \ |\n\n最后，通过多次执行此电路并解方程`x.z = y.z`（其中`y = x ⊕ b`），我们得到一个方程组，从中可以找到秘密字符串`b`：\n\n\
  ```\n{ b.z1 = 0\n  b.z2 = 0\n  ...\n  b.zn = 0 }\n```\n\n我们来看一下`b = 10`时的工作原理：\n\
  \n1.  两个寄存器初始化为零状态`| ѱ1⟩ = | 00⟩ | 00⟩`。\n2.  对第一个寄存器应用哈达玛门。这将构建 2 个量子比特的所有排列。因此，`|\
  \ ψ2⟩ = (1/2) (|00⟩ + |01⟩ + |10⟩ + |11⟩)`。\n3.  这是整个问题的关键。必须为`b = 10`定义预言机`Q[f]`。为此，遵循以下两条规则：\n\
  \    1.  从第一个寄存器的量子比特应用`CX`门到第二个寄存器的量子比特。这样做是为了将第一个寄存器的状态复制到第二个寄存器。\n    2.  找到`s`中第一个\
  \ 1 的索引`(i)`，然后应用从`(i)`到第二个寄存器中每个 1 出现位置的索引的 n-`CX`门（n 是`s`中 1 的个数）。因此，对于字符串`10`，预言机如下所示：\n\
  \n![](img/469026_2_En_9_Figc_HTML.jpg) 一个电路截图，显示有`x0`、`x1`、`y0`、`y1`四条水平线，以及各种门和屏障图标。\n\
  \n`| ψ3⟩ = (1/2) (|00⟩ |0⊕0⊕0, |0⊕0⊕0⟩⟩ + |01⟩ |0⊕0⊕1, |0⊕0⊕1⟩⟩ + |10⟩ |0⊕1⊕0, |0⊕1⊕0⟩⟩\
  \ + |11⟩ |0⊕1⊕1, |0⊕1⊕1⟩⟩)`\n\n`| ψ3⟩ = (1/2) (|00⟩ |00⟩ + |01⟩ |11⟩ + |10⟩ |11⟩\
  \ + |11⟩ |00⟩)`\n\n1.  如果我们测量第二个寄存器，得到`00`或`11`的概率各为 50%。例如，如果我们测量到`11`，那么`| ψ4⟩\
  \ = (1/√2) (|01⟩ + |10⟩)`。\n2.  对第一个寄存器应用哈达玛门后：`| ψ5⟩ = (1/2) (|00⟩ - |01⟩ - |10⟩\
