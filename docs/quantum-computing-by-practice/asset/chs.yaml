  begin{array}{cc}1&amp; 1\\\\ {}0&amp; -1\\end{array}\\right] $$](images/469026_2_En_11_Chapter/469026_2_En_11_Chapter_TeX_IEq4.png)\
  \ 是泡利自旋-1/2 矩阵，`J` 是耦合常数（相互作用中施加的强度），`h` 是外部磁场。这个哈密顿量的能谱描述了系统在热力学平衡下的统计特性（参见代码清单\
  \ 11-2）。\n\n```\n\"\"\"The Heisenberg model\"\"\"\nimport logging\nimport numpy\
  \ as np\nfrom fractions import Fraction\nfrom typing import Optional\nfrom qiskit_nature.operators.second_quantization\
  \ import SpinOp\nfrom qiskit_nature.problems.second_quantization.lattice.lattices\
  \ import Lattice\nfrom qiskit_nature.problems.second_quantization.lattice.models.lattice_model\
  \ import LatticeModel\nclass HeisenbergModel(LatticeModel):\n\"\"\"The Heisenberg\
  \ model.\"\"\"\ndef coupling_matrix(self) -> np.ndarray:\n\"\"\"Return the coupling\
  \ matrix.\"\"\"\nreturn self.interaction_matrix()\n@classmethod\ndef uniform_parameters(\n\
  cls,\nlattice: Lattice,\nuniform_interaction: complex,\nuniform_onsite_potential:\
  \ complex,\n) -> \"HeisenbergModel\":\nreturn cls(\ncls._generate_lattice_from_uniform_parameters(\n\
  lattice, uniform_interaction, uniform_onsite_potential\n)\n)\n@classmethod\ndef\
  \ from_parameters(\ncls,\ninteraction_matrix: np.ndarray,\n) -> \"HeisenbergModel\"\
  :\nreturn cls(cls._generate_lattice_from_parameters(interaction_matrix))\ndef second_q_ops(self,\
  \ display_format: Optional[str] = None) -> SpinOp:\nif display_format is not None:\n\
  logger.warning(\n\"Spin operators do not support display-format. Provided display-format\
  \ \"\n\"parameter will be ignored.\"\n)\nham = []\nweighted_edge_list = self._lattice.weighted_edge_list\n\
  register_length = self._lattice.num_nodes\n# kinetic terms\nfor node_a, node_b,\
  \ weight in weighted_edge_list:\nif node_a == node_b:\nindex = node_a\nham.append((f\"\
  X_{index}\", weight))\nelse:\nindex_left = node_a\nindex_right = node_b\ncoupling_parameter\
  \ = weight\nham.append((f\"X_{index_left} X_{index_right}\", coupling_parameter))\n\
  ham.append((f\"Y_{index_left} Y_{index_right}\", coupling_parameter))\nham.append((f\"\
  Z_{index_left} Z_{index_right}\", coupling_parameter))\nreturn SpinOp(ham, spin=Fraction(1,\
  \ 2), register_length=register_length)\n代码清单 11-2\n用于研究磁性系统临界点和相变的海森堡模型\n```\n\n\
