  \ 11，应用 ZX\nsuperdense.z(q[0])\nsuperdense.x(q[0])\nsuperdense.barrier()\n#### Bob\n\
  superdense.cx(q[0], q[1])\nsuperdense.h(q[0])\nsuperdense.measure(q[0], c[0])\n\
  superdense.measure(q[1], c[1])\nsuperdense.draw(filename='superdense-circ.png')\n\
  circuits = [superdense]\nprint(superdense.qasm())\nbackend = Aer.get_backend(\"\
