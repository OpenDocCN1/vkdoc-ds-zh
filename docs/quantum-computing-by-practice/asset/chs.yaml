  \ X 门。\n\n\n\n### 噪声模型与假提供者\n\n到目前为止，你已经了解了如何从完美（无噪声）模拟器中显示结果。然而，在现实中，量子电路是脆弱且充满噪声的。它们很容易因与环境的相互作用而变得模糊不清。出于以下几个原因，最好先在噪声模拟器中测试电路，然后再迁移到真实设备上：\n\
