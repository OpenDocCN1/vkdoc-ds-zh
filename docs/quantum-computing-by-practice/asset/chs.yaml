  ,\n\"deleted\": false,\n\"id\": \"d405c5829274d0ee49b190205796df87\",\n\"userId\"\
  : \"ef072577bd26831c59ddb212467821db\",\n\"calibration\": {}\n}, ...]\n代码清单 4-3\n\
  获取任务 API 调用的简化响应\n```\n\n**注意**\n\n根据执行队列的大小，如果队列中没有任务，你可能会得到一个空结果（`[]`），或者得到一个如代码清单\
  \ 4-3 所示的正式结果。无论哪种情况，请确保 HTTP 响应代码为 `200`（OK）。\n\n\n\n### 获取账户信息\n\n创建账户时，每位用户都会被分配若干执行积分，用于运行实验。该调用用于查询您的积分信息。\n\
