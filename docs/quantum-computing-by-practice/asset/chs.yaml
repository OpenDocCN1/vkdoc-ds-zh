- "# 7. 启动引擎：从量子随机数到量子隐形传态和超密编码\n\n本章将带你探索量子系统三种卓越的信息处理能力。我们从最简单的过程之一开始，研究量子力学的基本随机性，将其作为真正随机性的来源。接着，本章将探讨两个或许令人振奋但相互关联的过程，称为超密编码和量子隐形传态。在超密编码中，你将学习如何使用单个量子比特发送两个经典比特的信息。在量子隐形传态中，你将学习如何通过混合经典-量子信息传输过程来重建一个量子比特的量子态。所有算法都包含适用于\
  \ IBM Quantum 作曲家的电路设计以及 Python 和 QASM 代码。结果将被收集用于显示和分析，那么让我们开始吧。\n\n## 量子随机数生成\n\
  \n在本节中，你将学习如何利用量子计算机的概率特性，通过 Hadamard 门生成随机比特或数字。\n\n\n\n### 使用 Hadamard 门生成随机比特\n\
  \n`Hadamard` 是任何量子信息系统中的基本门之一。它用于将量子比特置于态的叠加中。从代数上讲，它由以下矩阵描述：\n\n![$$ H=\\frac{1}{\\\
  sqrt{2}}\\left[\\begin{array}{cc}1&amp; 1\\\\ {}1&amp; -1\\end{array}\\right] $$](images/469026_2_En_7_Chapter/469026_2_En_7_Chapter_TeX_Equa.png)\n\
  \n为了更好地理解该矩阵如何使量子比特处于叠加态，请考虑单个量子比特的几何表示：\n\n![](img/469026_2_En_7_Fig1_HTML.jpg)\n\
  \n一幅几何图，显示 `pipe 1 right angle bracket` 相对于 `pipe 0 right angle bracket`，其中 `beta` 和 `alpha` 分别位于\
  \ y 轴和 x 轴上。它从原点绘制了一条对角线箭头，表示 `alpha pipe 0 right angle bracket + beta pipe 1 right\
  \ angle bracket`。\n\n**图 7-1** 量子比特一般（叠加）态 ѱ 的几何表示\n\n在图 7-1 中，量子比特的基态使用狄拉克符号描述，其中\
  \ ![$$ \\mid \\left.0\\right\\rangle =\\left[\\begin{array}{c}1\\\\ {}0\\end{array}\\\
  right] $$](images/469026_2_En_7_Chapter/469026_2_En_7_Chapter_TeX_IEq1.png) 且 ![$$\
  \ \\mid \\left.1\\right\\rangle =\\left[\\begin{array}{c}0\\\\ {}1\\end{array}\\\
  right] $$](images/469026_2_En_7_Chapter/469026_2_En_7_Chapter_TeX_IEq2.png)。回顾前一章，ke\
  \ 态只是一个酉向量（长度为 1 的向量）。因此，一般（或叠加）态由酉向量 *ѱ* = *α*|0⟩ + *β*|1⟩ 定义，其中 α 和 β 是复系数。将 `H`\
  \ 应用于基态，得到：\n\n![$$ H\\mid \\left.0\\right\\rangle =\\frac{1}{\\sqrt{2}}\\left[\\\
  begin{array}{cc}1&amp; 1\\\\ {}1&amp; -1\\end{array}\\right]\\left[\\begin{array}{c}1\\\
  \\ {}0\\end{array}\\right]=\\frac{1}{\\sqrt{2}}\\left[\\begin{array}{c}1\\\\ {}1\\\
  end{array}\\right]=\\frac{1}{\\sqrt{2}}\\left(\\left[\\begin{array}{c}1\\\\ {}0\\\
  end{array}\\right]+\\left[\\begin{array}{c}0\\\\ {}1\\end{array}\\right]\\right)=\\\
  frac{\\mid \\left.0\\right\\rangle +\\mid \\left.1\\right\\rangle }{\\sqrt{2}} $$](images/469026_2_En_7_Chapter/469026_2_En_7_Chapter_TeX_Equb.png)\n\
  \n![$$ H\\mid \\left.1\\right\\rangle =\\frac{1}{\\sqrt{2}}\\left[\\begin{array}{cc}1&amp;\
  \ 1\\\\ {}1&amp; -1\\end{array}\\right]\\left[\\begin{array}{c}0\\\\ {}1\\end{array}\\\
  right]=\\frac{1}{\\sqrt{2}}\\left[\\begin{array}{c}1\\\\ {}-1\\end{array}\\right]=\\\
  frac{1}{\\sqrt{2}}\\left(\\left[\\begin{array}{c}1\\\\ {}0\\end{array}\\right]-\\\
  left[\\begin{array}{c}0\\\\ {}1\\end{array}\\right]\\right)=\\frac{\\mid \\left.0\\\
  right\\rangle -\\mid \\left.1\\right\\rangle }{\\sqrt{2}} $$](images/469026_2_En_7_Chapter/469026_2_En_7_Chapter_TeX_Equc.png)\n\
  \n对于叠加态 ѱ：\n\n![$$ \\uppsi =\\alpha \\left|\\left.0\\right\\rangle +\\beta \\right|\\\
  left.1\\right\\rangle \\to \\alpha \\left(\\frac{\\mid \\left.0\\right\\rangle +\\\
  mid \\left.1\\right\\rangle }{\\sqrt{2}}\\right)+\\beta \\left(\\frac{\\mid \\left.0\\\
  right\\rangle -\\mid \\left.1\\right\\rangle }{\\sqrt{2}}\\right)=\\frac{\\alpha\
  \ +\\beta }{\\sqrt{2}}\\mid \\left.0\\right\\rangle +\\frac{\\alpha -\\beta }{\\\
  sqrt{2}}\\mid \\left.1\\right\\rangle $$](img/469026_2_En_7_Chapter_TeX_Equd.png)\n\
  \n总而言之，`Hadamard` 门扩展了量子电路可能所处的状态范围。这一点很重要，因为状态的扩展创造了寻找捷径的可能性，从而实现更快的计算。\n\n> **提示**\
  \ 量子力学指出，即使完全了解物理定律或粒子的初始条件，我们也无法确定性地预测上述系数 α、β 的值。我们最多能做到的就是计算一个概率。\n\n有鉴于此，随机比特生成器电路的实现很简单：在\
  \ IBM Quantum Composer 中，创建一个电路，为第一个量子比特添加一个 `Hadamard` 门，然后在基态上执行测量，如图 7-2 所示。\n\
  \n![](img/469026_2_En_7_Fig2_HTML.jpg)\n\n一个窗口的截图，顶部有切换到 `Qasm` 编辑器、`run` 和 `simulate`\
  \ 的选项，以及关于后端、我的单位和实验单位的数据。下方有一个电路面板，包含 5 条标记为 `q0` 到 `q4` 的水平线，右侧是一个门面板。\n\n**图\
  \ 7-2** 随机比特生成电路\n\n在真实设备上运行此电路可能不是一个好主意，因为这可能需要一段时间（请记住，执行是排队的，根据运行队列中的作业数量，可能需要一些时间）。此外，每次在真实设备上执行都会消耗你的积分。在模拟器上运行该电路以立即获得结果（参见图\
  \ 7-3）。请注意，每个结果（0 或 1）的概率都是 ½；因此，你可以生成随机比特：如果结果为 1 的概率 > ½，则得到 1，否则得到 0。\n\n![](img/469026_2_En_7_Fig3_HTML.jpg)\n\
  \n量子结果窗口的截图，显示设备为模拟器，以及量子态计算基础柱状图，并带有下载 `CSV` 选项。该图绘制了两条柱状图，分别对应 `00001` 和 `00000`。`00000`\
  \ 的值为 0.550，高于 `00001` 的 0.450。\n\n**图 7-3** 电路 7-2 的执行结果\n\n当然，这是一种非常低效的生成随机比特的方式。更好的方法是编写一个\
  \ Qiskit Python 脚本，通过编程方式创建电路来完成这项工作。清单 7-1 展示了一个简单的脚本，用于使用 `x` 个量子比特生成 `n` 个随机数，其中比特数为\
  \ `2^x`。默认情况下，该脚本使用 3 个量子比特生成 10 个 8 位随机数，即 `n = 10` 和 `x = 3`，因为 `2³ = 8`。我们来仔细看看：\n\
  \n- 第 6 行定义了函数 `qrng`，用于创建一个使用 `n` 个量子比特的电路。\n- 使用 QISKit API，第 8-15 行创建了一个包含 `n`\
  \ 个量子比特和 `n` 个经典寄存器的 `QuantumProgram`，用于存储测量结果。\n- 对所有量子比特应用一个 `Hadamard` 门，然后对每个量子比特执行一次测量，最后将结果存储在经典寄存器\
  \ `n` 中（第 17-23 行）。\n- 电路被编译以在 `qasm_simulator` 上运行。电路被执行，并收集结果计数（第 26-36 行）。\n\
  - 最后，通过查看结果计数来生成随机比特。例如，给定结果 `{'100': 133, '101': 134, '011': 131, '110': 125, '001':\
  \ 109, '111': 128, '010': 138, '000': 126}`。对于每个结果，如果计数大于平均概率，则写入 `1`；否则写入 `0`。平均概率通过将总执行次数（此例中为\
  \ 1024）除以结果数（`2^x`，其中 `x` 是量子比特数（默认为 3） – 1024/8 = 128）来计算。因此，对于上面的结果，最终的随机二进制字符串变为\
  \ `11100010`（226）。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的格式要求，对给定的英文文本进行翻译。\n\n译文如下：\n\
  \n\n```python\nimport sys, time\nfrom qiskit import *\n\n# Generate an 2**n bit\
  \ random number where n = # of qubits\ndef qrng(n):\n    # create n qubit(s)\n \
  \   quantum_r = QuantumRegister(n, \"qr\")\n    # create n classical registers\n\
  \    classical_r = ClassicalRegister(n, \"cr\")\n    # create a circuit\n    circuit\
  \ = QuantumCircuit(quantum_r, classical_r, name=\"QRNG\")\n    # Hadamard gate to\
  \ all qubits\n    for i in range(n):\n        circuit.h(quantum_r[i])\n    # measure\
  \ qubit n and store in classical n\n    for i in range(n):\n        circuit.measure(quantum_r[i],\
  \ classical_r[i])\n    # backend simulator\n    backend = Aer.get_backend('qasm_simulator')\n\
  \    # Group of circuits to execute\n    circuits = [circuit]\n    shots = 1024\n\
  \    result = execute(circuits, backend, shots=shots).result()\n    # Show result\
  \ counts\n    # counts={'100': 133, '101': 134,… , '010': 138, '000': 126}\n   \
  \ counts = result.get_counts()\n    bits = \"\"\n    # convert the random count\
  \ to binary\n    for v in counts.values():\n        if v > shots / (2**n):\n   \
  \         bits += \"1\"\n        else:\n            bits += \"0\"\n    return int(bits,\
  \ 2)\n\nif __name__ == '__main__':\n    start_time = time.time()\n    numbers =\
  \ []\n    # generate 10 8 bit random numbers\n    size = 100\n    qubits = 3  #\
  \ bits = 2**qubits\n    for i in range(size):\n        n = qrng(qubits)\n      \
  \  numbers.append(n)\n    print(str(numbers).replace('[', '').replace(']', ''))\n\
  ```\n**清单 7-1** 生成 100 个 8 位随机数的量子程序\n\n> **注**  \n> 在执行程序之前，请务必确保您的账户已配置好。您的账户\
  \ API 令牌必须存在于文件 `$HOME/.qiskit/qiskitrc` 中。这是头痛的主要来源。如果您使用 Qiskit 运行时，还需更新同一文件夹下的\
  \ `qiskit-ibm.json` 文件。\n\n清单 7-1 的量子电路如图 7-4 所示。该电路使用 3 个量子比特来生成 0 到 255 之间的 8\
  \ 位随机数。\n\n![Figure 7-4](img/469026_2_En_7_Fig4_HTML.jpg)\n\n**图 7-4** 清单 7-1 的\
  \ Q Experience 电路\n\n让我们从多次运行中收集一些数据，并对结果进行测试。\n\n### 对随机性结果进行测试\n\nLinux 提供了一个名为\
  \ `ent`（熵的缩写）的简洁程序，它也被称为伪随机数序列测试程序。¹² 我们可以使用此命令来测试上一节生成的数字。\n\n> **提示**  \n> Windows\
  \ 用户 – 可从 ENT 项目网站下载 Windows32 二进制文件。本章源代码的 `Workspace\\Ch07\\ent.exe` 目录下也包含一个二进制文件。Mac\
  \ 用户应该能够从命令行运行 Linux 二进制文件。\n\n因此，使用清单 7-1 生成 100 个 8 位随机数，然后运行 `ent`，使用命令 `ent\
  \ [infile]` 测试您的序列，如下一段所示。\n\n```\nC:\\Workspace\\Ch07> python p7-1-qrng.py > qrnd-stdout.txt\n\
  C:\\Workspace\\Ch07>ent qrnd-stdout.txt\nEntropy = 3.122803 bits per byte.\nOptimum\
  \ compression would reduce the size of this 805 byte file by 60 percent.\nChi square\
  \ distribution for 805 samples is 29149.54, and randomly would exceed this value\
  \ less than 99.9 percent of the time.\nArithmetic mean value of data bytes is 46.1503\
  \ (127.5 = random).\nThe Monte Carlo value for Pi is 4.000000000 (error 27.32 percent).\n\
  Serial correlation coefficient is -0.356331 (totally uncorrelated = 0.0).\n```\n\
  \n根据 `ENT` 作者的说法，卡方检验决定了随机序列的质量。如果卡方百分比分布小于 1% 或大于 99%，则该序列质量不佳。我的输出显示百分比为 99.9%，这表明数字的随机性较低。这可能是因为我使用了远程模拟器。这个模拟器可能基于默认的\
  \ UNIX 随机数生成器（一个质量较差的生成器）。看看您的序列是否表现更好。表 7-1 展示了来自 `ENT` 开发者提供的多种确定性源和量子源之间的正面交锋结果。\n\
  \n**表 7-1** 由 ENT¹ 收集的来自不同来源的随机性测试结果\n\n| 来源 | 卡方百分比 |\n| --- | --- |\n| UNIX `rand()`\
  \ | 99.9%，针对 500000 个样本（差） |\n| Park 和 Miller 改进的 UNIX 生成器 | 97.53%，针对 500000 个样本（较好）\
  \ |\n| HotBits: 由放射性衰变¹³ 生成的随机数 | 40.98%，针对 500000 个样本（最佳） |\n\n表 7-1 显示，不应信任 UNIX\
  \ `rand()` 用于随机数生成。如果您需要大量真正的随机数（例如，用于生成加密密钥），请使用像 HotBits 这样的量子源。总而言之，本节的目的在于让您通过一个用于随机数生成的简单量子电路来初步了解。下一节将使用一种被称为超密集编码的奇特量子数据传输协议，将内容提升到新的水平。\n\
  \n\n\n## 超密编码\n\n超密编码（SDC）是一种数据传输协议，展示了量子系统卓越的信息处理能力。严格来说，SDC 是一种简单的过程，允许使用单个量子比特将两个经典比特的信息传输给另一方。该协议如图\
  \ 7-5 所示。\n\n该图使用各种值 `00 + 11`、`10 + 01`、`00 I`、`01 X` 和 `11 - 10` 等，通过门和操作图标将 Alice\
  \ 和 Bob 的 `q0` 和 `q1` 贝尔对连接起来。\n\n**图 7-5** 超密编码协议\n\n**表 7-4** 恢复后的量子比特状态\n\n|\
  \ 门 | 结果状态 | 说明 |\n| --- | --- | --- |\n| `CNOT` | `00 + 11`<br>`10 + 01`<br>`00\
  \ - 11`<br>`10 - 11` | 我们从第 2 步中 Alice 的状态开始：`00 + 11`、`10 + 01`、`00 – 11`、`10 -\
  \ 11`。如果第一个量子比特为 1，`CNOT` 门会翻转第二个量子比特，从而得到第 2 列中的状态。 |\n| `H` | `00`<br>`01`<br>`10`<br>`-11`\
  \ | 将 Hadamard 门应用于最后一行的第一个量子比特，得到第 2 列中的结果。当 Bob 在计算基态下进行测量时，他会得到四种可能的结果，每种结果的概率均为\
  \ 1。这些结果与 Alice 在第 2 步第 1 列中想要发送的内容相匹配。请注意，最后一个结果有一个负号。然而，因为概率被计算为振幅的平方，所以 `-1`\
  \ 变成了 `1`，这是正确的。 |\n\n**表 7-3** 超密编码的编码规则\n\n| 规则 | 结果状态 |\n| --- | --- |\n| `00`：`I`（单位门）<br>`01`：`X`<br>`10`：`Z`<br>`11`：`ZX`\
  \ | `I(00 + 11) = 00 + 11`<br>`X(00 + 11) = 10 + 01`<br>`Z(00 + 11) = 00 – 11`<br>`ZX(00\
  \ + 11) = 10 – 11` |\n\n**表 7-2** 贝尔对状态\n\n| 门 | 结果状态 | 说明 |\n| --- | --- | ---\
  \ |\n| `H` | `|00⟩ → |00⟩ + |10⟩` | 当 `H` 门应用于第一个量子比特时，它会进入叠加态；因此，我们得到状态 `00 + 10`，其中第二个量子比特保持为\
  \ `0`。请注意，为简单起见，省略了 Hadamard 矩阵中的平方根 (2)。 |\n| `CNOT` | `|00⟩ + |10⟩ → |00⟩ + |11⟩`\
  \ | `CNOT` 门将两个量子比特纠缠在一起。特别是，如果控制位 (`.`) 为 1，它会翻转目标位 (`+`)；否则保持不变。因此，如果第一个量子比特为\
  \ 1，我们就翻转第二个量子比特，得到 `00 + 11`。 |\n\n1. 该过程从第三方（Eve）生成所谓的贝尔对开始。Eve 从处于基态 `|0⟩` 的\
  \ 2 个量子比特开始。她对第一个量子比特应用 Hadamard 门以创建叠加态。然后，她使用第一个量子比特作为控制位（点），第二个作为目标位（`+`），应用\
  \ `CNOT` 门。这导致了表 7-2 中所示的状态。\n\n2. 在该过程的第二步中，第一个量子比特被发送给 Alice，第二个发送给 Bob。请注意，Alice\
  \ 和 Bob 可能位于遥远的地方。该协议的目标是让 Alice 使用她的量子比特向 Bob 发送两个经典比特的信息。但在她这样做之前，她需要根据她想要发送的\
  \ 2 个比特信息，对她的量子比特应用一组量子规则（或门）。（见表 7-3。）\n\n3. 因此，如果 Alice 发送 `00`，她对她的量子比特不做任何操作（应用单位门）。如果她发送\
  \ `01`，那么她应用 `X` 门（或比特翻转）。对于 `10`，她应用 `Z` 门。请注意，如果量子比特为 1，`Z` 门会翻转该量子比特的符号（相位）。因此，`Z|0⟩\
  \ = |0⟩`，`Z|1⟩ = -|1⟩`。最后，如果她发送 `11`，那么她对她的量子比特应用 `XZ` 门。然后 Alice 将她的量子比特发送给 Bob\
  \ 以进行该过程的最后一步。\n\n4. Bob 接收 Alice 的量子比特（量子比特-0），并使用他的量子比特来逆转 Eve 创建的贝尔态的过程。也就是说，他对第一个量子比特应用\
  \ `CNOT` 门，然后应用 Hadamard 门（`H`），最后对两个量子比特进行测量，以提取编码在 Alice 量子比特中的 2 个经典比特（见表 7-4）。\n\
  \n现在，让我们在 IBM Quantum 编辑器中将其整合到一个电路中。\n\n### 编辑器电路\n\n图 7-6 显示了超密编码电路以及编辑器中的状态向量概率：\n\
  \n一组 2 张截图。左边的截图具有带有各种门图标的左对齐下拉菜单。右边的截图具有状态向量下拉菜单，其下方有一个振幅条形图。它只在 x 轴上的 11 处绘制了一个条形。\n\
  \n**图 7-6** 编辑器的超密编码电路\n\n- 电路从创建一个贝尔对开始，也就是说，它将 `qubit[0]` 置于叠加态（使用 Hadamard 门），然后通过\
  \ `CNOT` 门将其与 `qubit[1]` 纠缠。\n\n- 接下来的两个门代表 Alice 的编码规则。请记住，她应用单位门（不做任何操作）来编码比特\
  \ `00`，应用 `X` 来编码 `01`，应用 `Z` 来编码 `10`，以及应用 `ZX` 来编码 `11`。在这种特定情况下，编码的比特是 `11`。这在图\
  \ 7-6 中隔离栏符号的左侧显示。请注意，隔离栏将阻止执行，直到两个量子比特都消耗完所有门。\n\n- 在隔离栏符号的右侧是 Bob 的协议。他执行与 Alice\
  \ 相反的操作。他在量子比特上应用 `CNOT` 门，然后应用 Hadamard 门。最后，对两个量子比特进行测量，以提取两个编码的经典比特。\n\n在模拟器中运行前面的电路，结果应该是一个条形图，显示结果\
  \ `11` 的概率非常接近或等于 1。这个结果应该与下一节中使用 Python 脚本获得的结果相匹配。\n\n### 在 Python 中运行\n\n列表 7-2\
  \ 显示了图 7-6 中电路的等效 Python 脚本：\n\n- 第 17-19 行创建了两个量子比特和两个经典寄存器来保存结果。\n- 接下来，使用纠缠的贝尔对创建\
  \ `superdense` 电路（第 22-14 行）。\n- Alice 通过应用 `ZX` 门来编码 `11`。可以选择注释掉这些语句中的任何一个来编码不同的对，然后确保结果与\
  \ Alice 的编码方案相匹配（第 32-35 行）。\n- Bob 逆转 Alice 的操作并测量量子比特（第 38-41 行）。\n- 最后，电路在远程模拟器（`ibmq_qasm_simulator`）上执行，并使用\
  \ Python 出色的绘图支持显示结果。\n\n```\nimport sys,time,math\n##### 导入 QISKit\nfrom qiskit\
  \ import *\n##### 导入基本绘图工具\nfrom qiskit.tools.visualization import plot_histogram\n\
  def main():\n#### 创建寄存器\nq = QuantumRegister(2, \"q\")\nc = ClassicalRegister(2,\
  \ \"c\")\n#### 用于制备共享纠缠态的量子电路\nsuperdense = QuantumCircuit(q, c, name=\"superdense\"\
  )\nsuperdense.h(q[0])\nsuperdense.cx(q[0], q[1])\n#### 对于 00，不做任何操作\n#### 对于 10，应用\
