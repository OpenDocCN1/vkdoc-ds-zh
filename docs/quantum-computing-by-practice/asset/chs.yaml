  qasm_simulator\"))` `plot_histogram (job.result().get_counts())` | ![](img/469026_2_En_6_Figa_HTML.jpg)\
  \ 计数与状态 00 和 11 的柱状图。数值如下：00, 497。11, 527。 |\n| `from qiskit import *` `from qiskit.visualization\
  \ import *` `qc = QuantumCircuit(2)` `qc.h(0)` `qc.cx(0,1)` `job = execute(qc, Aer.get_backend(\"\
  statevector_simulator\"))` `plot_state_city (job.result().get_statevector())` |\
