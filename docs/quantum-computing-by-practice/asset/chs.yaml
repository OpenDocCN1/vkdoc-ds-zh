  \n## 蛋白质折叠\n\n蛋白质是驱动地球上所有生命的基本构件。蛋白质是一条氨基酸链，它会折叠成一个紧凑的形状（构象）；它们起初是一条线性氨基酸链或具有不稳定三维结构的随机卷曲。最终，氨基酸相互作用形成结构明确、折叠好的蛋白质；这些化学机器创造了生命。可靠地预测蛋白质结构极其复杂，却能改变我们对自然界的理解。量子计算机可以通过预测对蛋白质功能至关重要的结构，来帮助解开这一复杂性。\n\
  \n注意\n\n蛋白质折叠是生物学界的圣杯，因为氨基酸序列决定了蛋白质的三维结构；折叠失败会产生有毒化合物，可能导致多种疾病。\n\n在这个问题中，有以下几个重要概念需要理解：\n\
  \n![](img/469026_2_En_11_Fig5_HTML.jpg)\n\n一张大肠杆菌蛋白链和血红蛋白链的示意图。它们用不同粗细和深浅的线条描绘了初级、二级及其他结构。\n\
  \n图 11-5\n\n左侧：大肠杆菌蛋白，展示了初级、二级和三级结构。右侧：血红蛋白，展示了四级结构（来自 AlphaFold^(²⁶) 蛋白质结构数据库）\n\
  \n-   **肽**：一种由氨基酸（由氨基和羧酸组成的有机化合物——自然界中有超过 500 种氨基酸）组成的小型链。\n-   **多肽**：一条更长、连续且不分枝的肽链，由化学键或肽键连接。\n\
  -   **折叠阶段**：决定蛋白质结构并控制其功能的四个阶段：\n    -   **一级结构**：这是多肽链中氨基酸残基的线性序列。\n    -   **二级结构**：由一级结构折叠成α螺旋或β折叠片层而成。\n\
  \    -   **三级结构**：由多个二级结构相互折叠而成。这是蛋白质的几何形状（见图 11-5 左侧）。\n    -   **四级结构**：由多个三级结构相互作用形成功能性蛋白质，如血红蛋白（见图\
  \ 11-5 右侧）。\n\n### 蛋白质折叠问题\n\n根据美国国家医学图书馆的定义，蛋白质折叠问题由三个难题组成：(a) 折叠代码是什么，(b) 折叠机制是什么，(c)\
  \ 蛋白质的三维结构是什么？目前，只有强大的超级计算机，结合蛋白质结构数据库、计算物理方法以及像蒙特卡洛采样^(²⁷) 这样复杂的算法等先进工具，才能根据氨基酸序列预测三维结构。\n\
  \n提示\n\n1994 年，CASP（蛋白质结构预测技术关键评估）成立，旨在预测未知的蛋白质结构。CASP 已从一个小团体发展成为一项全球性倡议，涵盖了来自\
  \ 19 个以上国家的 200 多个小组。\n\n### 使用量子计算机进行蛋白质折叠\n\n我们可以使用 Qiskit 的研究包（在撰写本文时，这个库还不太为人所知）进入蛋白质折叠领域。该库目前处于\
  \ alpha 阶段，并非官方发行版的一部分；但是，可以通过以下命令轻松安装：\n\n```\npip install qiskit-research\n```\n\
  \n现在我们已经准备好开始折叠了。让我们看看具体如何操作。\n\n\n\n#### 问题初始化\n\n本节中的代码分为三个部分。我们从初始化步骤开始（见代码清单\
  \ 11-7）。在此步骤中，我们定义：\n\n- 一条蛋白质氨基酸链或肽：在化学中，氨基酸用单字母符号表示。本例中，链为 `APRLR`：`A` = 丙氨酸，`P`\
  \ = 脯氨酸，`R` = 精氨酸，`L` = 亮氨酸。有关氨基酸符号的完整说明，请参见^((28))。请注意，蛋白质可能包含侧链；这些侧链可以相互结合，使蛋白质保持特定的形状或构象。\n\
  - 其次，它定义了氨基酸之间的能量相互作用过程。在此案例中，我们使用宫泽-杰尼根接触能量相互作用。这是一种广泛用于球状蛋白质的、基于知识的接触势。它采用概率模型，将单体项与氨基酸的多种疏水性标度进行比较。当将蛋白质视为椭球体时，该方法与蛋白质各层之间表现出很强的相关性^((29))。\n\
  - 接触能量相互作用以及肽被发送到 `ProteinFoldingProblem`，这是一个封装了该信息以便传递给算法的对象。请注意，还定义了一组惩罚参数。这些参数描述了强制执行问题的约束强度。\n\
  \n> **注意**：蛋白质折叠应通过本书的源代码从命令行运行，路径为 `Workspace\\Ch11\\proteinfolding.py`。此脚本无法在\
  \ Quantum Lab 中运行。\n\n```python\nfrom qiskit_research.protein_folding.interactions.miyazawa_jernigan_interaction\
  \ import *\nfrom qiskit_research.protein_folding.peptide.peptide import Peptide\n\
  from qiskit_research.protein_folding.protein_folding_problem import *\nfrom qiskit_research.protein_folding.penalty_parameters\
  \ import PenaltyParameters\nfrom qiskit.utils import algorithm_globals, QuantumInstance\n\
  from qiskit.circuit.library import *\nfrom qiskit.algorithms.optimizers import *\n\
  from qiskit.algorithms import NumPyMinimumEigensolver\nfrom qiskit.algorithms.minimum_eigensolvers\
  \ import SamplingVQE\nfrom qiskit import execute, Aer\nfrom qiskit.primitives import\
  \ Sampler\nimport matplotlib.pyplot as plt\n\n##### 不含侧链的蛋白质\n#main_chain = \"APRLRFY\"\
  \n#side_chains = [\"\"] * 7\n\n##### 含侧链\nmain_chain = \"APRLR\"\nside_chains =[\"\
  \", \"\", \"F\", \"Y\", \"\"]\n\n##### 相互作用\n#random_interaction = RandomInteraction()\n\
  mj_interaction = MiyazawaJerniganInteraction()\n\n##### 物理约束\npenalty_back = 10\n\
  penalty_chiral = 10\npenalty_1 = 10\npenalty_terms = PenaltyParameters(penalty_chiral,\
  \ penalty_back, penalty_1)\n\n##### 肽\npeptide = Peptide(main_chain, side_chains)\n\
  \n##### 问题\nprotein_folding_problem = ProteinFoldingProblem(peptide, mj_interaction,\
  \ penalty_terms)\nqubit_op = protein_folding_problem.qubit_op()\n\n##### 导出哈密顿量\n\
  #print(qubit_op)\n```\n\n**代码清单 11-7**  \n蛋白质折叠问题的初始化步骤\n\n---\n\n##### 运行 VQE\n\
  \n要运行 VQE，我们需要定义几个对象（见代码清单 11-8）：\n\n- **拟设** – `RealAmplitudes`：这是一种启发式试探波函数，用于化学应用或机器学习中的分类电路。该电路由围绕布洛赫球\
  \ y 轴的旋转（`RY`）以及相邻量子比特上的纠缠（`CX` 门）组成；其制备的量子态仅具有实振幅；虚部始终为 0。\n- **优化器** – `COBYLA`（线性近似约束优化）：这是一种用于约束问题的数值优化方法，通过目标函数的导数来寻找局部最小值。\n\
  - **哈密顿量**：它描述了系统的动能和势能。该特定案例使用四面体晶格（菱形或立方体晶格）通过构型量子比特来编码氨基酸的运动。有关该编码方式如何工作的更多详情，请参见^((30))。\n\
  \n```python\n##### 运行 VQE\n###### 经典优化器\noptimizer = COBYLA(maxiter=50)\n\n######\
  \ 变分拟设\nansatz = RealAmplitudes(reps=1)\n\ncounts = []\nvalues = []\n\ndef store_intermediate_result(eval_count,\
  \ parameters, mean, std):\n    counts.append(eval_count)\n    values.append(mean)\n\
  \n###### 使用 CVaR 初始化 VQE，alpha = 0.1\nvqe = SamplingVQE(\n    Sampler(),\n    ansatz=ansatz,\n\
  \    optimizer=optimizer,\n    aggregation=0.1,\n    callback=store_intermediate_result,\n\
  )\n\nraw_result = vqe.compute_minimum_eigenvalue(qubit_op)\n```\n\n**代码清单 11-8**\
