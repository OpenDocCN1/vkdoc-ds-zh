  \ 作曲家以图形方式构建电路，以及在 I B M quantum 实验室中开发量子实验。它还包含“跳回”选项和 API 令牌。\n\n**图 4-5** 从控制台获取您的\
  \ API 令牌。\n\n* 使用您的 API 令牌：要获取 API 令牌，请登录 IBM Q 控制台并从仪表板复制它（参见图 4-5）。\n* 使用您的账户用户名和密码：让我们看看如何使用\
  \ REST 完成此操作。\n\n#### 通过 API 令牌进行身份验证\n\n* **HTTP 方法：** `POST`\n* **URL：** `https://auth.quantum-computing.ibm.com/api/users/loginWithToken`\n\
