  : 5,\n\"couplingMap\": [\n[0, 1],\n[0, 2],\n[1, 2],\n[3, 2],\n[3, 4],\n[4, 2]\n\
  ]\n},..]\n```\n\n上表中最关键的键在表 4-8 中进行了描述。\n\n**表 4-8** 可用后端响应键\n\n| 键 | 描述 |\n| ---\
  \ | --- |\n| `Name` | 在对其执行代码时要使用的处理器名称 ID |\n| `Version` | 用于跟踪处理器变更的字符串或正整数 |\n\
  | `Description` | 这可能是对用于构建芯片的硬件的描述。你可能会看到类似：5 transmon bowtie, 16 transmon 2x8\
  \ ladder 的内容。注：transmon 被定义为一种抗噪声超导电荷量子比特。它由 Robert J. Schoelkopf、Michel Devoret、Steven\
  \ M. Girvin 及其同事于 2007 年在耶鲁大学开发^(¹⁰) |\n| `basisGates` | 这些是处理器的物理量子比特门。它们是构建更复杂逻辑门的基础\
  \ |\n| `nQubits` | 处理器使用的量子比特数量 |\n| `couplingMap` | 耦合映射定义了单个量子比特之间的相互作用，同时保持量子相干性。它用于简化量子电路，并允许系统被分解为更小的单元\
  \ |\n\n### 获取后端参数\n\n此调用返回 Q Experience 中给定处理器的后端参数的 JSON 列表。其中一些参数包括：\n\n- 以开尔文度量为单位的量子比特冷却温度：例如，我测得\
  \ `ibmqx4` 的温度为 0.021 K——那是一个极度寒冷的 -459.6 华氏度或 -273.1 摄氏度。\n- 以纳秒为单位的缓冲时间。\n- 以纳秒为单位的门时间。\n\
  - 其他量子规格在后端信息站点^(¹¹)中有更详细的记载。\n\n请求类型和端点 URL 为：\n\n- **HTTP 方法：** `GET`\n- **URL：**\
  \ [`https://api-qcon.quantum-computing.ibm.com/api/Backends/NAME/properties?access_token=ACCESS-TOKEN`](https://api-qcon.quantum-computing.ibm.com/api/Backends/NAME/properties?access_token=ACCESS-TOKEN)\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌 |\n\n####\
  \ HTTP 头部\n\n| 名称 | 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py`\
  \ |\n\n#### 响应示例\n\n代码清单 4-2 展示了 `ibmqx4` 参数的简化 JSON 响应。\n\n```\n{\n\"lastUpdateDate\"\
  : \"2018-04-15T10:47:03.000Z\",\n\"fridgeParameters\": {\n\"cooldownDate\": \"2017-09-07\"\
  ,\n\"Temperature\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 0.021,\n\"\
  unit\": \"K\"\n}\n},\n\"qubits\": [{\n\"name\": \"Q0\",\n\"buffer\": {\n\"date\"\
  : \"2018-04-15T10:47:03Z\",\n\"value\": 10,\n\"unit\": \"ns\"\n},\n\"gateTime\"\
  : {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 50,\n\"unit\": \"ns\"\n},\n\
  \"T2\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 16.5,\n\"unit\": \"μs\"\
  \n},\n\"T1\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 45.2,\n\"unit\"\
  : \"μs\"\n},\n\"frequency\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\":\
  \ 5.24208,\n\"unit\": \"GHz\"\n}\n},..]\n代码清单 4-2\nibmqx4 参数的简化响应\n```\n\n### 获取处理器的队列状态\n\
  \n此调用返回特定量子处理器事件队列的状态。\n\n- **HTTP 方法：** `GET`\n- **URL：** [`https://api-qcon.quantum-computing.ibm.com/api/Backends/NAME/queue/status?access_token=ACCESS-TOKEN`](https://api-qcon.quantum-computing.ibm.com/api/Backends/NAME/queue/status?access_token=ACCESS-TOKEN)\n\
  \n#### 请求参数\n\n这看起来很奇怪，但此 API 调用似乎不要求访问令牌。\n\n#### HTTP 头部\n\n| 名称 | 值 |\n| ---\
  \ | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py` |\n\n#### 响应示例\n\n\
  例如，要获取 `ibmqx4` 的事件队列，请在浏览器中粘贴以下 URL：\n\n[`https://quantumexperience.ng.bluemix.net/api/Backends/ibmqx4/queue/status`](https://quantumexperience.ng.bluemix.net/api/Backends/ibmqx4/queue/status)\n\
  \n响应看起来像：`{\"state\":true,\"status\":\"active\",\"lengthQueue\":0}` 其中：\n\n- **state:**\
  \ 处理器的状态。如果在线则为 `true`，否则为 `false`。\n- **status:** 执行队列的状态：`active`（活跃）或 `busy`（忙碌）。\n\
  - **lengthQueue:** 执行队列的大小，或等待执行的模拟任务数量。\n\n**提示**\n\n当你向 IBM Q Experience 提交实验时，它会进入执行队列。此\
  \ API 调用有助于监控处理器在特定时间段的繁忙程度。\n\n### 列出执行队列中的任务\n\n此调用返回处理器执行队列中的任务列表。\n\n- **HTTP\
  \ 方法：** `GET`\n- **URL：** [`https://api-qcon.quantum-computing.ibm.com/api/jobs?access_token=ACCESS-TOKEN&filter=FILTER`](https://api-qcon.quantum-computing.ibm.com/api/jobs?access_token=ACCESS-TOKEN&filter=FILTER)\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌 |\n| `filter`\
  \ | 一个 JSON 格式的结果大小提示。例如：`{\"limit\":2}` 最多返回 2 条记录 |\n\n#### HTTP 头部\n\n| 名称 |\
  \ 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py` |\n\n####\
  \ 响应示例\n\n代码清单 4-3 展示了此调用的响应格式。该信息似乎是实验执行的历史记录，包含状态、日期、结果、代码、校准等信息。\n\n```\n[{\n\
  \"qasms\": [{\n\"qasm\": \"...\",\n\"status\": \"DONE\",\n\"executionId\": \"331f15a5eed1a4f72aa2fb4d96c75380\"\
