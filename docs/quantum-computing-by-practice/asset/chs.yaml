  \ 量子比特处理器的传闻已经流传了一段时间。甚至有传言说到 2023 年底将推出 1000 量子比特的处理器，但先别兴奋；这台机器仅对企业客户可用。IBM 已制定了一份雄心勃勃的路线图，未来要达到一百万量子比特。详情请查阅\
  \ [www.ibm.com/quantum/roadmap](http://www.ibm.com/quantum/roadmap)。\n\n- 除了机器名称、版本、状态、量子比特数量等常规信息外，还有一些术语我们需要熟悉：\n\
  \    - `basisGates`：这些是处理器的物理量子比特门。它们是构建更复杂逻辑门的基础。列表中的大多数处理器都使用`u1,u2,u3,cx,id`。\n\
  \        - `u1`、`u2`、`u3`门被称为*部分非门*，它们通过 theta、phi 或 lambda 弧度对量子比特的 X、Y、Z 轴进行旋转。\n\
  \    - `Cx`被称为*受控非门*（`CNOT`或`CX`）。它作用于 2 个量子比特，仅当第一个量子比特为`|1>`时，才对第二个量子比特执行非操作，否则保持不变。\n\
  \    - `Id`是单位门，它在一个单位时间内对量子比特执行空闲操作。\n    - `couplingMap`：耦合映射定义了单个量子比特之间在保持量子相干性时的相互作用。量子比特耦合对于简化量子电路以及允许系统分解为更小的单元非常重要。\n\
  \n现在回到我们的第一个量子电路的作曲器。\n\n### 纠缠：贝尔态和 GHZ 态\n\n纠缠实验用于展示量子力学的奇异特性，主要分为两种类型：\n\n- **贝尔态**：它们证明物理学不是由局域实在性描述的。这就是爱因斯坦所说的*幽灵般的超距作用*（2\
  \ 量子比特纠缠）。\n- **GHZ 态**：比贝尔态更奇特（以其发明者命名：Greenberger-Horne-Zeilinger），它们描述了 3 量子比特纠缠。\n\
  \n接下来让我们更详细地了解它们。\n\n\n\n#### 贝尔态实现的双量子比特纠缠\n\n贝尔态是对著名的贝尔不等式的实验检验。1964 年，爱尔兰物理学家约翰·贝尔提出了一种检验量子纠缠（远距离的幽灵作用）的方法。他提出的一组不等式在物理学界变得极其重要，这组不等式被称为贝尔定理，其内容大致如下。\n\
  \n考虑光子偏振（光在特定平面内振荡）在三个不同角度`A = 0`、`B = 120`、`C = 240`的情况。实在论认为，光子对于这三个偏振设定具有确定的、同时存在的数值，而且它们必须对应于表\
  \ 4-3 中所示的八种情况。\n\n**表 4-3** 三个角度下光子偏振的排列组合\n\n| 计数 | A(0) | B(120) | C(240) | [AB]\
  \ | [BC] | [AC] | 总和 | 平均值 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| 1 | A+ | B+ | C+ | 1(++) | 1(++) | 1(++) | 3 | 1 |\n| 2 | A+ | B+ | C-\
  \ | 1(++) | 0 | 0 | 1 | 1/3 |\n| 3 | A+ | B- | C+ | 0 | 0 | 1(++) | 1 | 1/3 |\n\
  | 4 | A+ | B- | C- | 0 | 1(--) | 0 | 1 | 1/3 |\n| 5 | A- | B+ | C+ | 0 | 1(++) |\
  \ 0 | 1 | 1/3 |\n| 6 | A- | B+ | C- | 0 | 0 | 1(--) | 1 | 1/3 |\n| 7 | A- | B- |\
  \ C+ | 1(--) | 0 | 0 | 1 | 1/3 |\n| 8 | A- | B- | C- | 1(--) | 1(--) | 1(--) | 3\
  \ | 1 |\n\n现在贝尔定理提问：*任何相邻角度的偏振与第一个角度相同的概率是多少？* 我们还计算了偏振的总和与平均值。假设实在论为真，那么通过查看表 4-1，这个问题的答案必然是概率`>=\
  \ 1/3`。这就是贝尔不等式给出的内容：一种检验这个论断的方法。不可思议之处在于：信不信由你，量子力学违反了贝尔不等式，给出的概率小于`1/3`。这一点于 1982\
  \ 年由法国物理学家阿兰·阿斯佩首次通过实验证明。\n\n现在，让我们将上述光子偏振转化为可以在量子计算机上运行的实验。1969 年，约翰·克劳泽、迈克尔·霍恩、阿布纳·希莫尼和理查德·霍尔特提出了贝尔定理的一个证明：CHSH\
  \ 不等式，其正式表述为：\n\n```\nS = ⟨A, B⟩ - ⟨A, B′⟩ + ⟨A′, B⟩ + ⟨A′, B′⟩\n```\n\n```\nS ≤\
  \ 2\n```\n\n为了说明这一点，我们有两个探测器：爱丽丝和鲍勃。给定`A`和`A′`是爱丽丝一侧的探测器设置，`B`和`B′`是鲍勃一侧的设置，四种组合分别在单独的实验中测试。实在论认为，对于一对纠缠粒子，显示所有可能排列的奇偶表如下所示：\n\
  \n| A | B | 1 |\n| --- | --- | --- |\n| A | B’ | 0 |\n| A’ | B | 0 |\n| A’ | B’\
  \ | 1 |\n\n在经典实在论中，CHSH 不等式变为`|S| = 2`。然而，量子力学的数学形式体系预测`S`的最大值为`|S| = 2√2`，从而违反了这个不等式。这可以通过使用四个独立的量子电路（每次测量一个）来检验，每个电路都有\
  \ 2 个量子比特。为简化起见，让爱丽丝探测器上的测量为`A = Z`、`A′ = X`，鲍勃探测器上的测量为`B = W`、`B′ = V`（见表 4-2）。实验开始时，必须构建一个与恒等变换相符的基础贝尔态（见图\
  \ 4-5）：\n\n```\n1/√2 (|00⟩ + |11⟩)\n```\n\n上述表达式本质上意味着：爱丽丝持有的量子比特可以是`0`或`1`。如果爱丽丝在标准基下测量她的量子比特，结果将是完全随机的，每种可能性概率均为`1/2`。但如果鲍勃随后测量他的量子比特，结果将与爱丽丝得到的结果相同。所以，如果鲍勃测量，他乍看之下也会得到一个随机结果，但如果爱丽丝和鲍勃相互通信，他们会发现，尽管结果看似随机，但它们实际上是相关的。\n\
  \n**图 4-3** 基础贝尔态\n\n一个示例基础贝尔态图。它展示了两个量子比特`Q0`和`Q1`的纠缠。它包含四个量子门。`H`门创建了第一个量子比特的叠加态。两个测量门处于`0`和`1`状态。\n\
  \n在图 4-3 中，两个量子比特被制备在基态`|0⟩`。`H`门将第一个量子比特创建为`1/√2 (|00⟩ + |10⟩)`的叠加态。接下来，如果第一个量子比特被激发，`CNOT`门将翻转第二个量子比特，得到状态`1/√2\
  \ (|00⟩ + |11⟩)`。这是表 4-2 中四次测量所需的初始纠缠态（所有重印内容由国际商业机器公司提供，© 国际商业机器公司）。\n\n-   要将测量基旋转到`ZW`轴，请使用门序列`S-H-T-H`。\n\
