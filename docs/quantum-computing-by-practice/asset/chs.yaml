- "# 4. 走进 IBM Quantum：云上量子计算的独一无二平台\n\n在本章中，我们将通过 IBM Q 了解云上的量子计算：这是首个此类平台。本章首先概述了\
  \ Composer，这是一个用于可视化创建电路、提交实验、探索硬件设备等的 Web 控制台。接下来，你将学习如何创建你的第一个实验，并将其提交给模拟器或真实量子设备。IBM\
  \ Quantum 拥有强大的 REST API 来控制实验的生命周期，本章将通过对端点和请求参数的详细描述来展示如何使用它。最后，本章以一系列练习来测试你的\
  \ REST API 技能作为结尾。让我们开始吧。\n\nIBM 无疑在云量子计算的竞赛中占据了早期领先地位。他们推出了一个名为 IBM Quantum 的强大远程运行实验平台。让我们看看这个平台如何能够改变现状。\n\
  \n## 初探 IBM Quantum\n\n这是 IBM 的量子计算平台；让我们来看看——请遵循以下概述的步骤（所有重印件均由国际商业机器公司提供，© 国际商业机器公司）：\n\
  \n*   在 [`quantum-computing.ibm.com/`](https://quantum-computing.ibm.com/) 创建一个帐户。你需要一个电子邮箱；等待批准并确认。\n\
