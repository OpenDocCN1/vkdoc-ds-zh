  \ 任意相位的反冲\n\n在量子力学中，相位翻转和符号翻转可互换使用。例如，负相位反冲相当于布洛赫球上旋转 π 度。这是一个强大的概念，只要使用受控操作并且目标量子比特处于叠加态，就允许量子比特之间进行任意角度的相位反冲。这种壮举可以使用便捷的相位门来实现，该门可围绕\
