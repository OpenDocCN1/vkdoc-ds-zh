  ## 量子力学的基本假设\n\n对于不擅长数学的人来说，这一节可能有点难；然而，我们需要稍微深入（但不是太深）量子力学，以便扎实理解并补充线性代数知识。\n\n\
  ### 假设 1：状态与向量空间\n\n一个量子系统完全由希尔伯特空间中的一个状态向量描述：\n\n![$$ \\mid \\left.\\uppsi \\right\\\
  rangle ={\\sum}_i{\\alpha}_i\\mid \\left.{e}_i\\right\\rangle, {\\sum}_i{\\left|\\\
  alpha \\right|}²=1 $$](img/469026_2_En_5_Chapter_TeX_Equq.png)\n\n这个假设告诉我们，任何量子态\
  \ `ѱ` 都可以由一组线性无关的状态 `e[i]` 与复系数 `α[i]` 相乘后的叠加（求和）来描述。一个非常重要的条件是，复系数平方和必须等于 1。在量子计算中，所有变换都必须是幺正的（可逆的），而这一性质保证了这一点。另一个需要记住的重要概念是*基向量*。对于单个量子比特，基向量是\
  \ ![$$ \\mid \\left.0\\right\\rangle =\\left[\\begin{array}{c}1\\\\ {}0\\end{array}\\\
  right],\\mid \\left.1\\right\\rangle =\\left[\\begin{array}{c}0\\\\ {}1\\end{array}\\\
  right] $$](images/469026_2_En_5_Chapter/469026_2_En_5_Chapter_TeX_IEq20.png) 。对于\
  \ 2 量子比特系统，我们有 2² = 4 个基向量：\n\n![$$ \\mid \\left.00\\right\\rangle =\\left[\\begin{array}{c}1\\\
  \\ {}0\\\\ {}0\\\\ {}0\\end{array}\\right],\\mid \\left.01\\right\\rangle =\\left[\\\
  begin{array}{c}0\\\\ {}1\\\\ {}0\\\\ {}0\\end{array}\\right],\\mid \\left.10\\right\\\
  rangle =\\left[\\begin{array}{c}0\\\\ {}0\\\\ {}1\\\\ {}0\\end{array}\\right],\\\
  mid \\left.11\\right\\rangle =\\left[\\begin{array}{c}0\\\\ {}0\\\\ {}0\\\\ {}1\\\
  end{array}\\right] $$](images/469026_2_En_5_Chapter/469026_2_En_5_Chapter_TeX_Equr.png)\n\
  \n最后，一个 n 量子比特系统将拥有 2^n 个基向量。注意它们是线性无关的（列向量中只有一个元素是 1）。\n\n### 假设 2：可观测量与算子\n\n\
  物理系统的每个可观测量都由一个作用在描述系统的状态上的算子来描述。\n\n*   **可观测量：** 是粒子的可测量属性，例如自旋、位置、极化或电荷。\n* \
  \  **算子：** 是厄米矩阵的同义词，厄米矩阵是一个复方阵，等于其共轭转置。\n\n算子引出了本征态和本征值的概念。\n\n*   **本征态：** 是一个仅被标量乘子改变的量子态。因此对于作用在状态\
  \ `|a⟩` 上的算子 `M`：`M |a⟩ = λ |a⟩`。\n*   **本征值：** 是与本征态 `|a⟩` 相对应的标量 `λ`。\n\n### 假设\
  \ 3：测量\n\n当测量一个可观测量时，唯一可能的结果将是该可观测量算子的一个本征值。\n\n注\n\n物理测量值总是实数；任何虚部都将消失。\n\n*  \
  \ **本征态的测量：** 一个算子的本征态 `a[j]` 是正交的（垂直的）并构成一个基。`⟨a[j]| a[k]⟩ = δ[j, k]`。任何状态都可以表示为这些本征态带复系数的线性组合。\n\
  *   **概率幅：** 当测量系统 `|ѱ⟩` 时，得到本征态 `|a⟩` 的本征值 `λ` 的概率为：`|⟨a[j]| ѱ⟩|²`。注意 `⟨a|ѱ⟩` 是一个复数值（或概率幅）。必须对其取平方才能得到一个实数值。\n\
  *   **期望值：** 是使用算子 `A` 对状态 `|ѱ⟩` 进行多次测量的估计结果：![$$ \\left\\langle \\uppsi \\right\\\
  rangle \\equiv \\sum \\limits_i{\\lambda}_i\\ \\Pr \\Big(\\mid \\left.{a}_j\\right\\\
  rangle =\\left\\langle \\uppsi |A|\\uppsi \\right\\rangle $$](img/469026_2_En_5_Chapter_TeX_IEq21.png)\n\
  \n\n\n### 公设 4：波函数坍缩\n\n状态 `|ѱ>` 的波函数在测量时会“坍缩”，叠加态所包含的所有信息将永久丢失。\n\n> **注**：无人知晓波函数为何或如何坍缩。这是物理学中的一大谜团。例如，一个奇特的理论提出，这可能是平行宇宙间能量转移的结果。\n\
  \n波函数坍缩暗示了一个非常不祥的事实（至少从某个角度看如此）：我们不能“偷窥”盒子内部，因为这样做会破坏其量子态。这对调试量子电路来说是坏消息，但对注重隐私保护的密码学家来说却是好消息。\n\
  \n### 公设 5：酉变换\n\n酉变换描述了封闭量子系统随时间演化的过程。因此，给定时间 `t1` 的状态 `|ѱ>` 和时间 `t2` 的状态 `|ѱ2>`，其中酉变换\
  \ `U` 仅依赖于 `t1`、`t2`：`|ѱ2⟩ = U |ѱ⟩`。\n\n> **提示**：酉变换确保所有状态的概率之和为 1。所有操作（除测量外）都是可逆的，并且系统是封闭的（与外界无相互作用）。\n\
