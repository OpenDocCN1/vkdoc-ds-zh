  \ 11-3 中连接边的索引进行比较来验证这一点）。记住这一点，我们就可以将这些对象提供给 VQE，以提取点阵的基态。让我们看看如何操作。\n\n#### VQE\n\
  \n拼图的最后一块是一个`CustomVQE`对象类（参见代码清单 11-5）。它使用最小特征值求解器接口来计算给定算符或哈密顿量的最小特征值。其任务是：\n\n\
  *   实现图 11-2 中的目标函数。\n*   在目标函数内部，它调用 Qiskit Runtime Estimator 基元服务来获取量子电路（Ansatz）和可观测量（哈密顿量中的项）的期望值。请注意，该值是优化器每次交互收集的能量，并可选择性地发送回客户端。\n\
  *   运行优化器以最小化能量。优化器运行的周期数取决于具体实现。对于每个周期，都会产生一个能量值，并通过结果回调函数发送回来。\n*   为发送给优化器的 Ansatz\
  \ 定义随机参数（角度）的初始点。\n*   收集最终的 VQE 能量结果（在优化器完成后）并将其返回给客户端。\n\n```\nfrom qiskit.algorithms\
  \ import MinimumEigensolver, VQEResult\nimport numpy as np\n# Define a custom VQE\
  \ class\nclass CustomVQE(MinimumEigensolver):\ndef __init__(self, estimator, circuit,\
  \ optimizer, callback=None):\nself._estimator = estimator\nself._circuit = circuit\n\
  self._optimizer = optimizer\nself._callback = callback\ndef compute_minimum_eigenvalue(self,\
  \ operators, aux_operators=None):\n# Define objective function to classically minimize\
  \ over\ndef objective(x):\n# Execute job with estimator primitive\njob = self._estimator.run([self._circuit],\
  \ [operators], [x])\n# Get results from jobs\nest_result = job.result()\n# Get the\
  \ measured energy value\nvalue = est_result.values[0]\n# Save result information\
  \ using callback function\nif self._callback is not None:\nself._callback(value)\n\
  return value\n# Select an initial point for the ansatzs' parameters\nx0 = np.pi/4\
  \ * np.random.rand(self._circuit.num_parameters)\n# Run optimization\nres = self._optimizer.minimize(objective,\
  \ x0=x0)\n# Populate VQE result\nresult = VQEResult()\nresult.cost_function_evals\
  \ = res.nfev\nresult.eigenvalue = res.fun\nresult.optimal_parameters = res.x\nreturn\
  \ result\n代码清单 11-5\n用于基态计算的定制 VQE\n```\n\n现在，我们准备运行实验。将代码清单 11-1、11-3 和 11-6 收集到一个文件中。请注意，代码清单\
  \ 11-2 和 11-5 位于相同位置的单独文件中。所有文件都随本手稿的源代码一起提供。\n\n\n\n### 结果\n\n清单 11-6 是主程序的第三部分也是最后一部分。它完成了以下几项重要工作：\n\
  \n-   使用经典求解器 `NumPyEigensolver` 计算基态。这仅是为了对比，以便有一个基准与量子计算结果进行比对。\n-   调用 `CustomVQE`\
  \ 来最小化晶格哈密顿量，并收集优化器每一步的能量。这些能量将与经典的基态基准线一同绘制，用于比较。\n-   计算 VQE 最后能量与经典基态能量之间的相对误差，以得出最终的相对误差百分比。这能告诉我们实验的准确度。该值越低越好。\n\
  \n```\n#### 经典方法\n##### 计算基态能量\nfrom qiskit.algorithms import NumPyEigensolver\n\
  ##### 寻找前三个（k=3）特征值\nexact_solver = NumPyEigensolver(k=3)\nexact_result = exact_solver.compute_eigenvalues(hamiltonian)\n\
  print(exact_result.eigenvalues)\n##### 保存基态能量供后续使用\ngs_energy = np.round(exact_result.eigenvalues[0],\
  \ 4)\nprint(\"基态能量 \" + str(gs_energy))\n#### VQE\nansatz = EfficientSU2(nqubits)\n\
  optimizer = NFT(maxiter=100)\n#ansatz = TwoLocal(nqubits)\n#optimizer = SLSQP(maxiter=75)\n\
  intermediate_info = []\ndef callback(value):\nintermediate_info.append(value)\n\
  ##### 定义 qiskit-terra 的 Estimator 原始实例\nestimator   = Estimator() #[ansatz], [ham])\n\
  ##### 设置 VQE 算法\ncustom_vqe  = CustomVQE(estimator, ansatz, optimizer, callback=callback)\n\
  ##### 运行自定义 VQE 函数并监控执行时间\nstart       = time()\nresult      = custom_vqe.compute_minimum_eigenvalue(ham)\n\
  end         = time()\nprint(result)\nprint(f'执行时间（秒）: {end - start:.2f}')\ndef rel_err(target,\
  \ measured):\nreturn abs((target - measured) / target)\n##### 计算期望基态能量与 VQE 结果之间的相对误差\n\
  rel_error   = rel_err(gs_energy, result.eigenvalue)\nprint(f'期望基态能量: {gs_energy:.10f}')\n\
  print(f'计算所得基态能量: {result.eigenvalue:.10f}')\nprint(f'相对误差: {rel_error:.8f}')\n\
  ##### 绘制回调函数获取的能量收敛数据。\nplt.plot(intermediate_info, color='purple', lw=2, label='模拟\
  \ VQE')\nplt.ylabel('能量')\nplt.xlabel('迭代次数')\nplt.axhline(y=gs_energy, color=\"\
  tab:red\", ls=\"--\", lw=2, label=\"目标: \" + str(gs_energy))\nplt.legend()\nplt.grid()\n\
  plt.savefig(\"plot.png\")\n清单 11-6\nVQE 执行与结果\n```\n\n运行实验，并将你的结果与图 11-4 进行比较，该图显示\
