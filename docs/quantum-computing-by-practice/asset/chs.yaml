  \n以上就是用于无序搜索的 Grover 算法。它快速、强大，并且很快将在数据中心投入工作，启动各种数据库搜索。鉴于其相比经典算法的显著性能提升，几年后，当量子计算机变得更加商业化时，大多数网络搜索很可能将由这个量子引擎执行。在结束之前，值得一提的是，截至撰写本文时，IBM\
  \ Quantum 尚不存在能够找到真实物品的有用实现或实验。希望这种情况在未来会有所改变，但就目前而言，Grover 算法仍停留在理论层面。在下一节中，我们将通过分析著名的整数分解\
  \ Shor 算法来强势收尾。\n\n## 使用 Shor 算法进行整数分解\n\n密码学和密码分析之间的猫鼠游戏从未停歇：前者设计新的方法来加密我们的日常数据；后者则不断探测弱点，寻找突破口以瓦解加密体系。当前的非对称密码学依赖于分解极大质数（数百位数字级别）的公认难度。本节将剖析\
  \ Shor 算法的内部工作原理，这是一种利用量子计算机实现整数分解指数级加速的方法。随后，我们将使用名为 `ProjectQ` 的库进行实现。接下来，我们将对示例整数进行模拟并评估结果。最后，我们将探讨量子系统中整数分解的当前和未来发展方向。让我们开始吧。\n\
  \n### 用量子分解挑战非对称密码学\n\n在具有里程碑意义的论文《Polynomial-Time Algorithms for Prime Factorization\
  \ and Discrete Logarithms on a Quantum Computer》^((18))中，Peter Shor 提出了一种量子分解方法，该方法利用了数学家们长期熟知的一个原理：寻找元素\
  \ `a` 在乘法群 `modulo N` 中的周期（也称为阶）；即满足以下条件的最小正整数：\n\n![$$ {x}^r\\equiv 1\\ \\left(\\\
  mathit{\\operatorname{mod}}\\ N\\right) $$](img/469026_2_En_10_Chapter_TeX_Equg.png)\n\
  \n其中 `N` 是要分解的数，`r` 是 `x modulo N` 的周期。\n\n> **提示**\n> 大整数分解是一个困扰了数学家千年的问题。1976\
  \ 年，G. L. Miller 提出，利用随机化，可以将分解问题简化为寻找元素 `A` 在模 `N` 下的周期，从而大大简化了这一难题。这也是 Shor 算法背后的基本思想。\n\
  \nShor 将他的算法分为三个阶段，其中两个阶段由经典计算机在多项式时间内完成：\n\n1.  **输入准备**：在经典计算机上完成，时间复杂度为多项式时间\
  \ `log (n)`。\n2.  **寻找周期 `r`**：通过量子电路寻找元素 `a` 的周期 `r`，使得 `a^r ≡ 1 (mod N)`。据 Shor\
  \ 所述，这在量子计算机上需要 `O((log n)² (log log n)(log log log n))` 步。\n3.  **后处理**：在经典计算机上完成，时间复杂度为多项式时间\
  \ `log (n)`。\n\n但为什么这个方法会如此令人兴奋？将其时间复杂度（大 O 表示法）与当前经典的冠军算法“数域筛法”进行比较（如表 10-2 所示，以及另一位热门算法——历史悠久的二次筛法）。\n\
  \n**表 10-2** 常见分解算法的时间复杂度\n\n| 算法 | 时间复杂度 |\n| :--- | :--- |\n| Shor 算法 | `(log\
  \ n)² (log log n) (log log log n)` |\n| 数域筛法 | ![$$ \\exp \\left(c\\ {\\left(\\\
  log n\\right)}^{1/3}{\\left(\\log \\log n\\right)}^{\\frac{2}{3}}\\right) $$](img/469026_2_En_10_Chapter_TeX_IEq18.png)\
  \ |\n| 二次筛法 | ![$$ \\exp \\left(\\sqrt{\\ln n\\ln \\ln n}\\right) $$](img/469026_2_En_10_Chapter_TeX_IEq19.png)\
  \ |\n\n令人难以置信的是，Shor 算法具有多项式时间复杂度，远优于经典计算机上已知最快的分解方法——数域筛法的指数级时间。事实上，专家估计，Shor 算法可以在几分钟内分解一个\
  \ 200 多位数的整数。这样的壮举将动摇目前用于生成所有网络通信加密密钥的非对称密码学的基础。\n\n> **提示**\n> 对称密码学对量子计算具有高度抵抗力，因此也对\
  \ Shor 算法具有高度抵抗力。\n\n但先别惊慌；在真正的量子计算机上进行实际应用仍然任重道远。不过，我们可以使用流畅的 Python 库 `Project\
  \ Q` 在经典系统上模拟该算法。我们将在后续章节中运行 `Project Q` 的实现，但接下来，让我们看看周期查找如何高效地解决分解问题。\n\n\n\n\
  #### 周期寻找\n\n周期寻找是肖尔算法的基本构建模块。通过使用模运算，问题被简化为寻找函数 `f(x) = a^x mod N`（见图 10-9）的周期（`r`）。\n\
  \n![一种量子电路的图示，该电路用于 H H L 算法，包含以下步骤：准备输入态，应用预言机，应用量子傅里叶变换，以及测量量子比特。](img/469026_2_En_10_Fig9_HTML.jpg)\n\
  \n**图 10-9** 周期函数 `f(x)`\n\n图 10-9 给出了一个周期 `r = 4` 的周期函数 `f(x)` 的示例。为了使算法有效，`f(x)`\
  \ 必须满足三个条件：\n\n1.  `f(x)` 在每个周期内是一一对应的，即 `f(x)` 的值不能重复。在图 10-9 中，这些值由每个周期每条线的顶点表示。\n\
  2.  对于任意给定的 `M` 或周期数，`r` 必须能整除 `M`。例如，给定 `M = 100` 且周期 `r = 4`，则 `M/r = 25`。\n3.\
  \  `M` 除以 `r` 必须大于 `r`。即 `M > r²`。\n\n肖尔算法将 `f(x)` 转换为一个量子电路 `U[f]`，其中的输入处于叠加态。如果我们测量\
  \ `U[f]` 中的第二个寄存器，我们可能会看到振幅 ![$$ \\sum \\limits_{x=0}^{M-1}{\\propto}_x\\mid \\\
  left.x\\right\\rangle $$](img/469026_2_En_10_Chapter_TeX_IEq20.png) 的值，如图 10-9 的振幅图所示。这里，振幅恰好相隔\
  \ 4 个单位，这正是我们要寻找的周期。在这个特定例子中，我们得到了周期为 `r = 4` 的周期叠加。但是，我们该如何处理这个周期叠加呢？肖尔依赖于另一个技巧：傅里叶采样或量子傅里叶变换。\n\
  \n##### 傅里叶采样\n\n傅里叶采样是一种数据操作过程，具有以下属性：\n\n![一种量子电路的图示，该电路用于量子机器学习算法变分量子本征求解器，包含以下步骤：准备初始态，应用拟设，测量能量，更新拟设，并重复步骤\
  \ 2 到 4 直到达到所需精度。](img/469026_2_En_10_Fig10_HTML.jpg)\n\n**图 10-10** 显示周期叠加的傅里叶采样\n\
  \n*   它允许在不改变输出分布的情况下进行输入平移。\n*   这很好，因为现在我们有了一个周期叠加，其中非零振幅是周期的倍数（见图 10-10）。\n\n\
  但是傅里叶采样的输出是什么呢？它又有何帮助？答案是，其输出是 `M/r` 的一个随机倍数。在这个例子中，给定 `M = 100` 和 `r = 4`，我们得到\
  \ `100/4 = 25` 的一个随机倍数。这对我们的目标是有利的。让我们看看具体如何实现。\n\n##### 将傅里叶采样结果输入欧几里得最大公约数算法\n\
  \n如果我们多次运行傅里叶采样，我们将得到 `M/r` 的随机倍数。例如，我们可能会得到 `50`、`75`、`25` 等。现在，如果我们对我们得到的随机输出应用欧几里得最大公约数（`gcd`），那么瞧！通过将\
  \ `M` 除以 `gcd`，我们就得到了周期 `r`。因此：\n\n`r = M/gcd(50, 75, ...) = 100 /25 = 4`\n\n这就是通过量子电路寻找周期的概要。为了理解这种方法如何高效地找到一个因子，让我们通过分解数字\
  \ `N = 21` 的例子来运行一遍。我们的任务依赖于两个非常高效的操作：\n\n*   模运算：`a = b (mod N)`。例如，`3 = 15 (mod\
  \ 12)`。\n*   最大公约数 `gcd(a, b)`。例如，`gcd(15, 21) = 3`。\n\n因此，对于 `N = 21`，我们需要解方程 `x²\
  \ ≡ 1 (mod 21)`。也就是说，找到非平凡平方根 `x`，使得：\n\n*   `N` 能整除 `(x + 1)(x - 1)`。\n*   `N`\
  \ 不能整除 `(x ± 1)`。\n*   最后，通过应用 `gcd(N, x+1)` 恢复出一个质因数。\n\n为了找到 `N = 21` 的非平凡因数，随机选择一个\
  \ `x`。例如，给定 `N = 21`，选择 `x = 2`，因此：\n\n```\n20 ≡ 1 (mod 21)\n21 ≡ 2 (mod 21)\n22\
  \ ≡ 4 (mod 21)\n23 ≡ 8 (mod 21)\n24 ≡ 16 (mod 21)\n25 ≡ 11 (mod 21)\n26 ≡ 1 (mod\
  \ 21)。得到周期 r = 6。\n```\n\n在这个例子中，`2⁶ = (2³)²`。因此，`2³ = 8` 是一个非平凡因数，使得 `21` 能整除 `(8\
  \ + 1)(8 - 1)`。最后，我们通过最大公约数 `gcd(N, x+1) = gcd(21, 9) = 3` 恢复出一个因数。概括地说，随机选择一个 `x`，然后遍历\
  \ `x⁰, x¹,…, x^r ≡ mod N`。如果我们运气好，`r` 是偶数，即 `(x^(r/2))² ≡ 1 (mod N)`。这样我们就得到了 1\
  \ 模 N 的一个非平凡平方根。\n\n> **提示**\n> \n> 已经证明，我们运气好（即对于 `x² ≡ 1 (mod N)`，`r` 是偶数）的概率是\
  \ ½。反之，如果运气不好，那么我们必须重复整个过程。然而，鉴于成功概率很高，这在全局中影响甚微。\n\n现在，让我们使用简洁的 Python 库 ProjectQ\
  \ 来运行这个算法。\n\n#### 使用 ProjectQ 实现肖尔算法\n\nProjectQ 是一个用于量子计算的开源平台，它使用 Stéphane Beauregard^(¹⁹)\
  \ 提出的电路实现了肖尔算法。该电路使用 `2n + 3` 个量子比特，其中 `n` 是要分解的数字 `N` 的比特数。Beauregard 的方法分为以下步骤：\n\
  \n![一种量子电路的图示，该电路用于量子机器学习算法量子近似优化算法，包含 4 个步骤：准备初始态，应用混合器，应用代价函数，以及测量量子比特。](img/469026_2_En_10_Fig11_HTML.jpg)\n\
  \n**图 10-11** 用于周期寻找的 Beauregard 量子电路\n\n1.  如果 `N` 是偶数，则返回因子 2。\n2.  经典地判断对于 `p\
  \ ≥ 1` 和 `q ≥ 2`，`N = p^q` 是否成立，如果成立则返回因子 `p`（在经典计算机上，这可以在多项式时间内完成）。\n3.  选择一个随机数\
  \ `a`，使得 `1 < a ≤ N – 1`。使用欧几里得最大公约数算法，判断 `gcd(a, N) > 1` 是否成立。如果成立，则返回因子 `gcd(a,N)`。\n\
  4.  使用求阶量子电路来找到 `a` 模 `N` 的阶 `r`。在量子计算机上，这一步在多项式时间内完成。\n5.  如果 `r` 是奇数，或者 `r` 是偶数但\
  \ `a^(r/2) = -1 (mod N)`，则返回步骤 (3)。否则，计算 `gcd(a^(r/2) - 1 , N)` 和 `gcd(a^(r/2) +\
