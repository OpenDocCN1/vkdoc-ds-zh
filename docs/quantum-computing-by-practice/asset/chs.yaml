- "# 博弈论：有了量子力学，胜算永远在你这边\n\n本章探讨了两个游戏谜题，展示了量子算法相对于其经典算法的非凡力量：\n\n*   **假币谜题**：这是一个经典的称重谜题，由数学家\
  \ E.D. Schell 于 1945 年提出。它涉及用天平秤和有限的尝试次数来称量硬币，以确定哪一枚硬币重量不同（是假的）。\n*   **梅明-佩雷斯魔方游戏**：这是一个量子伪心灵感应（pseudo-telepathy）的例子，即玩家能够实现只有在游戏中神秘地沟通才可能实现的结果。\n\
  \n在这两种情况下，量子计算都赋予了玩家近乎神奇的能力，就好像他们一直在作弊一样。让我们来看看是怎么回事。\n\n## 假币谜题\n\n在这个谜题中，玩家有八枚硬币和一个天平秤。其中一枚硬币是假的，因此重量较轻。游戏的目标是仅使用天平秤两次就找出哪一枚是假币。你能想出办法吗？让我们来梳理一下图\
  \ 8-1 中所示的解决方案。\n\n![](img/469026_2_En_8_Fig1_HTML.jpg)\n\n一张八枚硬币假币谜题解决方案的示意图。三组硬币被分为向右倾、向左倾和平衡。如果天平向右倾，假币在\
  \ 1 到 3 中；如果向左倾，假币在 4 到 6 中；如果平衡，则假币是 7 或 8。\n\n**图 8-1** 八枚硬币的假币谜题解决方案\n\n1.  有\
  \ 8 枚硬币，将硬币（1-3）放在天平的左侧，4-6 放在右侧。将剩下的 2 枚硬币 7 和 8 放在一边，然后称重。\n2.  如果天平向右倾，假币就在 1-3\
  \ 中（左侧）。记住假币更轻。因此，从左侧取出最后一枚硬币（3），再次称重（第二次）。\n    *   如果天平向右倾，假币是 1。停止。\n    *  \
  \ 如果天平向左倾，假币是 2。停止。\n3.  如果天平向左倾，假币就在 4-6 中。取出最后一枚硬币（6），再次称重。\n    *   如果天平向右倾，假币是\
  \ 5。停止。\n    *   如果天平向左倾，假币是 6。停止。\n4.  如果天平平衡，假币要么是 7 要么是 8。将 7 和 8 放在天平上再次称重。\n\
  \    *   如果天平向右倾，假币是 7。停止。\n    *   如果天平向左倾，假币是 8。停止。\n\n从前一节的过程中可以看出，一个经典算法可以实现，它与硬币总数\
  \ `N` 和假币数量 `k` 无关。一般而言，广义假币谜题的时间复杂度由下式给出：\n\n![$$ O\\left(k\\log \\left(N/k\\right)\\\
  right) $$](img/469026_2_En_8_Chapter_TeX_Equa.png)\n\n> **提示** 已经证明，在经典计算机上使用天平秤找到一枚假币所需的最少尝试次数是两次。\n\
  \n### 假币问题的量子解法\n\n信不信由你，有一种量子算法可以仅使用量子天平秤一次就找到假币，而与硬币数量 `N` 无关！一般来说，对于任意数量的假币 `k`（与\
  \ `N` 无关），该算法的时间复杂度由下式给出：\n\n![$$ O\\left({k}^{1/4}\\right) $$](img/469026_2_En_8_Chapter_TeX_Equb.png)\n\
  \n> **提示** 量子假币算法是其经典算法的四次方加速（quartic speedup）的一个例子。\n\n因此，图 8-2 展示了针对假币谜题，量子算法相对于其经典算法的强大之处。现在，让我们深入探讨：找到一枚假币（`k\
  \ = 1`）的量子算法可以概括为三个阶段：查询量子天平秤、构建量子天平秤和识别假币。\n\n![](img/469026_2_En_8_Fig2_HTML.jpg)\n\
  \n一张量子时间与经典时间的对比图。从点 2 开始，曲线呈向下凹的斜率，且斜率逐渐增加。\n\n**图 8-2** 假币谜题的量子与经典时间复杂度对比\n\n\n\
  \n### 步骤 1：查询量子束平衡\n\n量子算法将以叠加态查询光束平衡器。为此，我们使用二进制查询字符串来编码放在天平托盘上的硬币。例如，查询字符串 `11101111`\
  \ 表示除索引为 `3` 的硬币外，所有硬币均在天平上。当没有包含假币时，天平平衡，否则倾斜。下表说明了这一点。\n\n| N（硬币数量） | F（假币索引）\
  \ | 查询字符串 | 结果 |\n| --- | --- | --- | --- |\n| 8 | 3 | `11101111` | 平衡 (0) |\n|\
  \ 8 | 3 | `11111111` | 倾斜 (1) |\n\n该过程可总结如下：\n\n1.  使用两个量子寄存器查询量子平衡，其中第一个寄存器用于查询字符串，第二个寄存器用于结果。\n\
  2.  准备所有具有偶数个 `1` 的二进制查询字符串的叠加态。\n3.  为了获得具有偶数个 `1` 的态的叠加，对基态 `|0>` 执行哈达玛变换，并检查\
  \ `|x|` 的汉明重量是否为偶数。可以证明，`|x|` 的汉明重量为偶数当且仅当 `x1 ⊕ x2 ⊕ … ⊕ xN = 0`。\n    **提示** \
  \ \n    字符串的汉明重量 (`hw`) 是与所用字母表中的零符号不同的符号数量。例如：`hw(11101) = 4`，`hw(11101000) = 4`，`hw(000000)\
  \ = 0`。\n4.  最后，测量第二个寄存器，如果观测到 `|0>`，则第一个寄存器就是我们想要的所有二进制查询字符串的叠加态。如果我们得到 `|1>`，则重复该过程直到观测到\
  \ `|0>`。\n\n请注意，每次重复都以恰好一半的概率保证成功。因此，经过几次重复后，我们应该能够获得所需的叠加态。清单 8-1 展示了一个用于查询光束平衡器的量子程序的实现，其对应的图形电路如图\
  \ 8-3 所示。\n\n**注意**  \n为便于说明，完整的假币程序被拆分为清单 8-1 至 8-3；要运行该程序，请使用来自 `Workspace\\Ch08\\\
  p_counterfeitcoin.py` 源文件的完整清单。\n\n```\n# ------- 查询量子束平衡\nqr = QuantumRegister(numberOfCoins\
  \ + 1, \"qr\")\n#### 用于记录对 qr 的测量结果\ncr = ClassicalRegister(numberOfCoins+1, \"\
  cr\")\ncircuitName = \"QueryStateCircuit\"\ncircuit   = QuantumCircuit( qr, cr,\
  \ name = circuitName)\nN = numberOfCoins\n##### 创建所有长度为 N 的字符串的均匀叠加\nfor i in range(N):\n\
  circuit.h(qr[i])\n##### 通过从 qr[0] 到 qr[N-1] 顺序应用 CNOT 门执行 XOR(x)\n##### 并将结果存储到\
  \ qr[N]\nfor i in range(N):\ncircuit.cx(qr[i], qr[N])\n##### 测量 qr[N] 并将结果存储到 cr[N]。\n\
  ##### 如果 cr[N] 为零则继续，否则重复\ncircuit.measure(qr[N], cr[N])\n##### 查询量子束平衡\n##### 如果\
  \ cr[0]...cr[N] 的值全为零\n##### 通过准备 |1> 的哈达玛态，即在 qr[N] 处为 |0> - |1>\ncircuit.x(qr[N]).c_if(cr,\
  \ 0)\ncircuit.h(qr[N]).c_if(cr, 0)\n##### 当 cr[N] 不为零时，我们回退计算\nfor i in range(N):\n\
  circuit.h(qr[i]).c_if(cr, 2**N)\n清单 8-1\n用于查询量子束平衡的脚本\n```\n\n![](img/469026_2_En_8_Fig3_HTML.jpg)\
  \  \n一个量子电路。不同部分包括查询量子束平衡、假币索引以及识别假币。\n\n**图 8-3**  \n针对 `N = 8`，`k = 1` 且假币位于索引\
  \ `6` 的假币谜题的量子电路\n\n图 8-3 展示了一个针对 8 枚硬币（其中 1 枚假币位于索引 6）的假币谜题的完整电路。该电路展示了在 IBM Q\
  \ Experience 平台上描述的所有阶段。算法的第二阶段是构造光束平衡器。\n\n### 步骤 2：构造量子平衡\n\n在上一节中，我们构建了所有汉明重量为偶数的二进制查询字符串的叠加态。在这一步中，我们通过设置假币的位置来构造量子束。因此，给定假币相对于二进制字符串\
  \ `|x1, x2, …, xN>|0>` 的位置 `k`，量子束平衡返回：\n\n`|x1, x2, … , xN> |0 ⊕ xk>`\n\n这是通过一个以\
  \ `x[k]` 为控制位、第二个寄存器为目标位的 CNOT 门实现的（参见部分清单 8-2）。\n\n```\n#----- 构造量子束平衡\nk = indexOfFalseCoin\n\
  #### 对所需的叠加态应用量子束平衡\n#（由 cr 等于零标记）\ncircuit.cx(qr[k], qr[N]).c_if(cr, 0)\n清单 8-2\n\
  构造量子束平衡。\n```\n\n### 步骤 3：识别假币\n\n在查询平衡后识别假币，对二进制查询字符串应用哈达玛变换。假设我们用汉明重量为偶数的二进制字符串查询量子束平衡，那么通过测量哈达玛变换后的计算基，我们可以识别出假币，因为它是其标签与多数不同的那个（参见清单\
  \ 8-3）。\n\n```\n# --- 识别假币\n##### 对 qr[0] ... qr[N-1] 应用哈达玛变换\nfor i in range(N):\n\
  circuit.h(qr[i]).c_if(cr, 0)\n##### 测量 qr[0] ... qr[N-1]\nfor i in range(N):\ncircuit.measure(qr[i],\
  \ cr[i])\nresults   = execute([circuit], backend=backend, shots=shots).result()\n\
  answer  = results.get_counts(circuitName)\nprint(\"设备 \" + str(backend) + \" 计数\
  \ \" + str(answer))\n##### 获取最常见的标签\nfor key in answer.keys():\nnormalFlag, _ =\
  \ Counter(key[1:]).most_common(1)[0]\nfor i in range(2,len(key)):\nif key[i] !=\
  \ normalFlag:\nprint(\"假币索引为：\", len(key) - i - 1)\n清单 8-3\n识别假币。\n```\n\n当最左边的位为\
  \ `0` 时，可以通过找到其值与其他值不同的位来确定假币的索引。例如，对于 `N = 8` 且假币索引为 `6`，结果应为 `010111111` 或 `001000000`。请注意，因为我们使用\
  \ `cr[N]` 来控制查询平衡前后的操作，因此：\n- 如果最左边的位是 `0`，则我们成功识别出假币。\n- 如果最左边的位是 `1`，则我们未能获得所需的叠加态，必须从头开始重复该过程。这可能导致与我下面展示的不同的模拟器计数结果；同时请记住，程序可能无法识别假币；因此你可能需要运行脚本几次。总而言之，可以在脚本中调整执行参数，例如假币索引、量子比特数量和硬币总数。\n\
  \n针对远程 IBM-Q 模拟器运行程序会得到以下结果（位于书籍源码 `Workspace\\Ch07\\p_counterfeitcoin.py`）。请注意，我在此实例中使用的是\
  \ Windows：\n\n```\nc:\\python36-64\\python.exe p_counterfeitcoin.py\n设备 ibmq_qasm_simulator\
  \ 计数 {'001000000': 1}\n假币索引为：  2\n```\n\n如果你无法访问书籍源码但仍想尝试此脚本，清单 8-4 是整个程序的精简版本。试试看吧。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，对给定的英文文本进行翻译。\n\n\n```python\nimport sys\n\
  import matplotlib.pyplot as plt\nimport numpy as np\n# useful math functions\nfrom\
  \ math import pi, cos, acos, sqrt\nfrom collections import Counter\n# importing\
  \ the QISKit\nfrom qiskit import *\n# import basic plot tools\nfrom qiskit.tools.visualization\
  \ import plot_histogram\n\ndef main(M = 16, numberOfCoins = 8 , indexOfFalseCoin\
  \ = 6\n, backend = None , shots = 1 ):\n    if numberOfCoins = M:\n        raise\
  \ Exception(\"Please use numberOfCoins between 4 and \", M-1)\n    if indexOfFalseCoin\
  \ = numberOfCoins:\n        raise Exception(\"indexOfFalseCoin must be between 0\
  \ and \", numberOfCoins-1)\n    # ------- Query the quantum beam balance\n    #\
  \ Create registers\n    qr = QuantumRegister(numberOfCoins + 1, \"qr\")\n    # for\
