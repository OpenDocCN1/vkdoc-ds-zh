  : \"c[5]\",\n\"additionalData\": {\n\"seed\": 348582688\n},\n\"time\": 0.0166247,\n\
  \"counts\": {\n\"11100\": 754,\n\"01100\": 270\n}\n}\n}\n}],\n\"shots\": 1024,\n\
  \"backend\": {\n\"name\": \"ibmqx_qasm_simulator\"\n},\n\"status\": \"COMPLETED\"\
