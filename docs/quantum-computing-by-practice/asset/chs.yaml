  \ 设计中，超导同轴电缆的作用是什么？\n15. 低温绝缘体的作用是什么？\n16. 读取量子比特量子态的非破坏性方法是什么？\n17. 在 IBM-Q 中，用于探测读取脉冲的两种设备是什么？\n\
