  \ 时，请勿登录云账户。这将允许你在本地工作。\n\n2.  为 IBM Quantum REST API 创建一个新集合。将工作区命名为 *IBM Quantum*。**提示：了解非常有用的\
  \ Postman 全局变量，以便快速存储 API 或访问令牌等信息。**参见 [`https://learning.postman.com/docs/sending-requests/variables/`](https://learning.postman.com/docs/sending-requests/variables/)。\n\
  \n3.  创建一个新请求：通过令牌进行身份验证。使用以下参数：\n    1.  类型：`POST`\n    2.  URL：来自本章的身份验证部分：[`https://auth.quantum-computing.ibm.com/api/users/loginWithToken`](https://auth.quantum-computing.ibm.com/api/users/loginWithToken)\n\
