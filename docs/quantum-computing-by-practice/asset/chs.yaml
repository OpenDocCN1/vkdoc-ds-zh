- "# 9. 量子优势：多伊奇-乔萨、伯恩斯坦-瓦齐拉尼与西蒙算法\n\n在本章中，我们研究三个实际用途不大但很重要的算法，因为它们是首批展示量子计算机能够比经典计算机更快地解决问题的算法。考虑算法的时间复杂度\
  \ `O(n)`：经典 vs. 量子，如表 9-1 所示（其中 `n` 是输入的大小）。\n\n**表 9-1**\n\n多伊奇-乔萨、伯恩斯坦-瓦齐拉尼和西蒙算法的时间复杂度\n\
  \n| 名称 | 经典 | 量子 |\n| --- | --- | --- |\n| 多伊奇-乔萨 | 2^(n-1) + 1 | 1 |\n| 伯恩斯坦-瓦齐拉尼\
  \ | n | 1 |\n| 西蒙 | 2^(n/2) | n |\n\n除了显著的性能提升，这些算法还阐述了几乎适用于所有现有算法的基本概念：\n\n*  \
  \ **大规模并行性：** 通过对所有输入应用 `Hadamard` 门，我们创建了所有二进制排列的集合，最不可思议的是，它们都在同一时间被处理。这听起来可能没什么大不了的，但考虑一个\
  \ 40 量子比特的处理器：它可以在同一时间处理 2⁴⁰ = 1TB 的二进制排列。这是惊人的原始算力，任何现有的超级计算机都无法匹敌。\n\n*   **预言机：**\
  \ 这些是对二进制排列执行某些变换的黑盒。当你拥有巨大的排列空间时，预言机提供了一种改变大多数排列的方法，以便它们可以相互抵消。几乎所有量子算法都会使用某种预言机。\n\
  \n*   **相位反冲：** 这是一个极其有用的概念，你必须充分理解它才能构建量子算法。相位反冲本质上改变了某些排列的相位（符号），以便它们（在被预言机变换后）可以相互抵消。这个过程的结果是一个缩小的排列空间，其中包含问题的解。但关于这一点，我们将在下一节中详细讨论。\n\
  \n这三个概念包含了量子优势的关键：想象一下，你通过量子比特的 `Hadamard` 门创建了一个大小为 2⁴⁰的二进制排列空间。在这个空间中，有一个独特的排列等待被发现，它给出了问题的解。我们需要一个机制来改变某些排列，以便它们可以相互抵消（预言机）。此外，我们需要一种方法来改变它们的相位（相位反冲），以便当我们让它们脱离叠加态时，它们会通过加法相互抵消（记住，叠加态就是量子态的加法）。最终的测量将触发这个过程，从而得到一个缩小的排列集，其中包含问题的解；所有这一切中最困难的部分是将问题编码到这样一个二进制排列空间中，而这正是所有研究进行的地方。那么，让我们来看看量子信息科学中这个精髓的部分：我们从极其重要的相位反冲概念开始。\n\
  \n\n\n## 相位反冲\n\n当门对量子比特添加的特征值通过受控操作被“反冲”到另一个量子比特时，就会发生相位反冲。要实现这一点，量子比特必须处于叠加态。请记住：\n\
  \n![$$ H\\left.|0\\right\\rangle =\\left.|+\\right\\rangle, \\kern0.5em H\\left.|1\\\
  right\\rangle =\\left.|-\\right\\rangle, \\kern0.5em X\\left.|-\\right\\rangle =-\\\
  left.|-\\right\\rangle $$](img/469026_2_En_9_Chapter_TeX_Equa.png)\n\n在双量子比特态中，当控制量子比特不处于\
  \ `|0>` 或 `|1>` 叠加态时，相位是全局的，没有可观测效应（全局相位无关紧要）。因此，应用控制-X 算符得到：\n\n![$$ CX\\left.|-0\\\
  right\\rangle =\\left.X|-\\right\\rangle \\otimes \\left.I|0\\right\\rangle =\\\
  left.|-0\\right\\rangle, \\kern0.5em CX\\left.|-1\\right\\rangle =\\left.X|-\\right\\\
  rangle \\otimes \\left.I|1\\right\\rangle =\\left.-|-1\\right\\rangle $$](img/469026_2_En_9_Chapter_TeX_Equb.png)\n\
  \n注意我们使用的是 **Qiskit 小端比特顺序**（控制比特或最低有效位在右边）。当控制（右侧）量子比特处于叠加态时，就会发生相位反冲。状态为 `|1>`\
  \ 的控制量子比特会对相应的目标量子比特施加一个相位因子。这个施加的相位因子反过来又会在控制量子比特中引入一个相对相位，如下所示：\n\n![$$ CX\\left.|-+\\\
  right\\rangle =\\frac{1}{\\sqrt{2}}\\ \\left( CX\\left.|-0\\right\\rangle + CX\\\
  left.|-1\\right\\rangle \\right)=\\kern0.5em \\frac{1}{\\sqrt{2}}\\ \\left(\\left.|-0\\\
  right\\rangle -\\left.|-1\\right\\rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_Equc.png)\n\
  \n![$$ CX\\left.|-+\\right\\rangle =\\left.|-\\right\\rangle \\otimes \\frac{1}{\\\
  sqrt{2}}\\ \\left(\\left.|0\\right\\rangle -\\left.|1\\right\\rangle \\right)=\\\
  kern0.5em \\left.|--\\right\\rangle $$](img/469026_2_En_9_Chapter_TeX_Equd.png)\n\
