  该算法由大卫·多伊奇和理查德·乔萨于 1992 年提出。给定一个隐藏布尔函数 `f({x0,x1,..,xn})`，其中 `{x0,x1,..,xn}` 是一个比特串，如果该函数是常值函数，则返回\
  \ 0；如果是平衡函数，则返回 1。布尔常值函数对任何输入都返回全 0 或全 1。布尔平衡函数对一半的输入返回 0，对另一半返回 1。任务是判断给定的函数是平衡函数还是常值函数。\n\
  \n**提示**\n\n布尔平衡函数的例子包括：将输入的第一个比特复制到输出的函数，以及 XOR（异或——可通过查看其真值表验证）。布尔平衡函数主要用于密码学。\n\
  \n图 9-2 中的电路仅需一次调用就能以 100% 的置信度解决这一问题。让我们看看这是如何实现的。我们从以下状态开始：\n\n![$$ \\left.|{\\\
  uppsi}_0\\right\\rangle ={\\left.|0\\right\\rangle}^{\\otimes n}\\left.|1\\right\\\
  rangle $$](img/469026_2_En_9_Chapter_TeX_Eque.png)\n\n![](img/469026_2_En_9_Fig2_HTML.jpg)\n\
  \n**图 9-2**  \n多伊奇-乔萨量子电路\n\nHadamard 门将输入比特置于叠加态，并将辅助量子比特 `|1>` 置于 `|->` 态：\n\n\
  ![$$ \\left.|{\\uppsi}_1\\right\\rangle =\\frac{1}{\\sqrt{2^{n+1}}}\\sum \\limits_{x=0}^{2^n-1}\\\
  left.|x\\right\\rangle \\left.|-\\right\\rangle $$](img/469026_2_En_9_Chapter_TeX_Equf.png)\n\
  \n其中 `x` 是输入比特串，接着函数 `U[f]` 是一个预言机，它利用相位反冲将状态变换为 `|x⟩|y⟩ → |x⟩|y ⊕ fx⟩`：\n\n![$$\
  \ \\left.|{\\uppsi}_2\\right\\rangle =\\frac{1}{\\sqrt{2^{n+1}}}\\sum \\limits_{x=0}^{2^n-1}\\\
  left.|x\\right\\rangle \\left.\\Big(| fx\\right\\rangle -\\left.|1\\oplus fx\\right\\\
  rangle \\left)=\\frac{1}{\\sqrt{2^{n+1}}}\\sum \\limits_{x=0}^{2^n-1}\\left.{\\\
  left(-1\\right)}^{fx}|x\\right\\rangle \\left.\\Big(|0\\right\\rangle -\\left.|1\\\
  right\\rangle \\right) $$](img/469026_2_En_9_Chapter_TeX_Equg.png)\n\n接下来，丢弃辅助量子比特；对第一个寄存器应用\
  \ Hadamard 变换，我们得到：\n\n![$$ \\left.|{\\uppsi}_2\\right\\rangle =\\frac{1}{2^n}\\\
  sum \\limits_{y=0}^{2^n-1}\\left[\\sum \\limits_{x=0}^{2^n-1}{\\left(-1\\right)}^{fx}{\\\
  left(-1\\right)}^{x.y}\\right]\\left.|y\\right\\rangle $$](images/469026_2_En_9_Chapter/469026_2_En_9_Chapter_TeX_Equh.png)\n\
  \n其中 `x.y` 是输入比特串 `x` 与辅助量子比特 (`y`) 的按位乘积。最后，测量第一个寄存器后，概率变为 ![$$ \\Pr ={\\left|\\\
  sum \\limits_{x=0}^{2^n-1}{\\left(-1\\right)}^{fx}\\right|}² $$](img/469026_2_En_9_Chapter_TeX_IEq2.png)，如果\
  \ `f(x)` 是平衡函数，该值计算结果为 1。让我们针对一个 3 量子比特电路实现该算法，该电路包含一个 2 比特大小的 `-x` 和一个 1 比特大小的\
  \ `-y`，用于两种函数：\n\n1. 使用单位门的常值函数\n2. 使用布尔 XOR 的平衡函数\n\n在量子实验室中运行代码清单 9-2，为 2 比特函数构建多伊奇-乔萨电路；它包含两个函数\
  \ `constant2` 和 `balanced2`，分别用于创建常值函数和平衡函数 `f(x)` 的预言机。该代码首先执行以下步骤：\n\n1. 将输入量子比特\
  \ (`x`) 置于叠加态。\n2. 然后应用常值函数或平衡函数的预言机。\n3. 将输入移回计算基。\n4. 测量输入 `x`。如果结果为 0，则函数是常值；否则是平衡的。\n\
  \n```python\nfrom qiskit import QuantumRegister, ClassicalRegister, QuantumCircuit\n\
  from qiskit import Aer, execute\nfrom qiskit.tools.visualization import plot_histogram\n\
  ### 创建量子/经典寄存器和一个量子电路\nqin     = QuantumRegister(2, 'x')\nqout    = QuantumRegister(1,\
  \ 'y')\nc       = ClassicalRegister(2)\nqc      = QuantumCircuit(qin,qout,c)\n###\
  \ 这是一个平衡函数 XOR\ndef balanced2(circ, input, output) :\ncirc.cx(input[0],output)\n\
  circ.cx(input[1],output)\n### 这是一个什么都不改变的常值函数\ndef constant2(circ, input, output)\
  \ :\ncirc.i(output)\n### 构建多伊奇-乔萨电路\n#### 首先应用相位偏移，以在 f(x) == 1 时取反\nqc.h(qin)\n\
  qc.x(qout)\nqc.h(qout)\n#### 使用 balanced2() 平衡函数 或 constant2() 常值函数\nconstant2(qc,qin,qout)\n\
  #balanced2(qc,qin,qout)\nqc.h(qout)\nqc.barrier()  # 设置屏障使电路看起来更美观\n#### 然后对输入比特进行\
  \ Walsh-Hadamard 变换\nqc.h(qin)\n#### 对于常值函数，输出以概率 1 为 |00>\n#### 对于平衡函数，输出以概率 1\
  \ 为 |11>\nqc.measure(qin,c)\n#### display 仅在量子实验室中有效\ndisplay(qc.draw())\n#### 模拟并显示结果\n\
  backend     = Aer.get_backend('qasm_simulator')\njob  = execute(qc, backend, shots=512)\n\
  result  = job.result()\nplot_histogram(result.get_counts())\n```\n\n**代码清单 9-2**\
  \  \n用于 2 量子比特（常值或平衡函数）的多伊奇-乔萨算法\n\n在量子实验室中运行代码清单 9-2，得到如图 9-3 所示的结果。\n\n![](img/469026_2_En_9_Fig3_HTML.jpg)\n\
