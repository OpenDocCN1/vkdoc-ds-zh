- "# 10. 高级算法：利用 Grover 和 Shor 算法进行非结构化搜索与整数分解\n\n本章介绍的两个算法为实用量子计算的潜能带来了激动人心的前景：\n\
  \n- **Grover 搜索**：这是由 Lov Grover 创建的一种非结构化量子搜索算法，能够使用黑盒函数或预言机以高概率找到输入。它可以在 ![$$\
  \ O\\left(\\sqrt{N}\\right) $$](img/469026_2_En_10_Chapter_TeX_IEq1.png) 步内找到一个项目，而经典平均需要\
  \ N/2 步。\n\n- **Shor 整数分解**：著名的量子因子分解算法，专家们认为它可能使当前的非对称密码学陷入困境。Shor 可以在大约 `log(n³)`\
  \ 步内分解整数，而最快的经典算法数域筛则需要 ![$$ \\exp \\left(k\\ast \\mathit{\\log}\\left({n}^{\\frac{1}{3}}\\\
  right)\\ {\\left(\\log \\mathit{\\log}\\ n\\right)}^{\\frac{2}{3}}\\right) $$](img/469026_2_En_10_Chapter_TeX_IEq2.png)\
  \ 步。\n\n让我们开始吧。\n\n\n\n## 量子非结构化搜索\n\n格罗弗算法是一种非结构化搜索的量子过程，用于在包含 `N` 个元素的数字大海（haystack）中寻找一个\
  \ `n` 位的条目。如图 10-1 所示，格罗弗量子算法在 `O(√N)` 步内提供了显著的加速。与经典解决方案相比，这看起来可能不算多，但当我们谈论数百万个条目时，10⁶\
  \ 的平方根要比 10⁶ 快得多。\n\n![](img/469026_2_En_10_Fig1_HTML.jpg)\n\n一幅由垂直排列的矩形堆叠成的示意图，标有经典\
  \ `O(N)` 的 0 到 3，以及量子 `O(√N)` 的 `x` 到 `N-1`。\n\n图 10-1\n\n非结构化搜索的时间复杂度\n\n如果 `x`\
  \ 是我们正在寻找的元素，那么格罗弗算法可以用以下伪代码描述：\n\n1.  根据给定的函数 `f: {0, 1, ..., N-1} → {0,1}` 准备输入。注意，输入的规模是\
  \ `2^n`，其中 `n` 是比特数，而 `N` 是步骤数或大海（haystack）的规模。最终目标是找到 `x` 使得 `f(x) = 1`。\n\n2.\
  \  对输入中的所有量子比特应用基态叠加。\n\n3.  对输入量子比特执行相位反转。\n\n4.  对输入执行关于均值的反转。\n\n5.  重复步骤 3 和\
  \ 4 至少 `√N` 次。此时将有很高的概率找到 `x`。\n\n让我们更仔细地看看关键的相位反转和关于均值的反转步骤。\n\n### 相位反转\n\n这是算法中的第一步，必须在大海中所有状态的叠加态中执行。如果我们正在寻找的元素是\
  \ `x'`，其中 `f(x') = 1`，那么叠加态可以表示为 `∑α|x⟩`。最终，相位反转的作用是：\n\n![$$ \\sum \\alpha \\mid\
  \ \\left.x\\right\\rangle \\overset{Phase\\ Inversion}{\\to }\\ \\left\\{\\begin{array}{c}\\\
  sum \\alpha \\mid \\left.x\\right\\rangle\\ if\\ x\\ne {x}^{\\hbox{'}}\\\\ {}-\\\
  alpha \\mid \\left.{x}^{\\prime}\\right\\rangle\\ Otherwise\\end{array}\\right.\
  \ $$](img/469026_2_En_10_Chapter_TeX_Equa.png)\n\n也就是说，如果给定的 `x` 不是我们要找的元素（`x ≠\
  \ x'`），那么它保持叠加态不变；否则，它会反转相位（即量子比特复系数 `α` 的符号——参见图 10-2 的图示）。\n\n![](img/469026_2_En_10_Fig2_HTML.jpg)\n\
  \n两个相位表示图，展示了信号的幅度，由波在水平轴上的位置和波的高度表示。信号的幅度被反转，而信号的其余部分保持不变。\n\n图 10-2\n\n相位反转的图示\n\
  \n这是格罗弗算法的第一步；我们将会看到相位反转如何帮助找到我们正在寻找的元素，但现在让我们先看第二步：关于均值的反转。\n\n### 关于均值的反转\n\n\
  给定之前的叠加态 `∑α|x⟩`，我们将均值 `μ` 定义为幅度的平均值：\n\n![$$ \\mu =\\frac{\\sum \\limits_{x=0}^{N-1}{\\\
  propto}_x}{N} $$](img/469026_2_En_10_Chapter_TeX_Equb.png)\n\n现在我们必须围绕这个均值翻转幅度。即：\n\
  \n![$$ {\\alpha}_x\\to \\left(\\ 2\\mu -{\\alpha}_x\\right) $$](img/469026_2_En_10_Chapter_TeX_Equc.png)\n\
  \n![$$ \\sum {\\alpha}_x\\mid \\left.x\\right\\rangle \\to \\sum \\left(\\ 2\\mu\
  \ -{\\alpha}_x\\right)\\mid \\left.x\\right\\rangle $$](img/469026_2_En_10_Chapter_TeX_Equd.png)\n\
  \n为了更好地理解这一点，图 10-3 展示了关于均值反转的图示。\n\n![](img/469026_2_En_10_Fig3_HTML.jpg)\n\n一幅微米与\
  \ `n-1` 的关系图，绘制了两条振荡波和一条水平波。右侧的方程显示为 `∑αx|x⟩ → ∑(2μ - αx)|x⟩`。\n\n图 10-3\n\n关于均值反转的图形表示\n\
  \n图 10-3 展示了由波函数 `Ψ` 定义的量子比特的叠加态。该函数的均值或 `μ` 在图表中以水平线显示。关于均值的反转的作用是让波函数 `Ψ` 关于均值\
  \ `μ` 进行镜像，从而产生一个镜像波（用虚线显示）。这相当于绕 `μ` 轴旋转波。让我们把所有这些步骤放在一起看看它们是如何运作的，以便理解这一切。\n\n\
  ![](img/469026_2_En_10_Fig4_HTML.jpg)\n\n3 个图示分别展示了：以 `αx` 对 `x` 的矩形块表示的叠加态；以被 `x*`\
  \ 分隔的两个块表示的相位反转；以一条虚线水平线下的两个块表示的关于均值的反转；以及经过 `√N` 步后的幅度增加。\n\n图 10-4\n\n单次格罗弗迭代\n\
  \n在图 10-4 中：\n\n-   所有量子比特的叠加态将所有幅度置于 `1/√N`\n-   接下来，相位反转将 `x'` 的幅度置于 `-1/√N`。注意，这会产生略微降低均值\
  \ `μ` 的效果，如图 10-4 步骤 2 中的虚线所示。\n-   在关于均值的反转之后，平均幅度略微下降，但 `x'` 的幅度大幅升高，比均值 `μ` 高出约\
  \ `2/√N`。\n-   如果我们重复这个序列，`x'` 的幅度每次增加约 `2/√N`，直到在大约 `√N` 步后，幅度变为 `1/√2`。\n-   此时，如果我们测量量子比特，根据量子力学定义，找到\
  \ `x'`（我们正在寻找的元素）的概率是幅度的平方，即 1/2。\n-   因此，我们完成了。在大约 `√N` 步内，我们找到了标记元素 `x'`。\n\n\
