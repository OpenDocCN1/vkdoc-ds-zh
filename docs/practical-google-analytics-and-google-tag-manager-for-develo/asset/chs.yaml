  \ fn); }\n    if (el.attachEvent) {\n      return el.attachEvent('on' + evt, function(evt)\
  \ {\n        // Call the event to ensure uniform 'this' handling, pass it event\n\
  \        fn.call(el, evt);\n      });\n    }\n    if (typeof el['on' + evt] ===\
  \ 'undefined' || el['on' + evt] === null) {\n      return el['on' + evt] = function(evt)\
