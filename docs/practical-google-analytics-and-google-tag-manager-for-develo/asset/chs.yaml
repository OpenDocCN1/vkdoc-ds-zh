  \n4. 保存对设置的更改。\n\n请记住，此设置仅影响之后的数据。过去为 URL 收集的数据将不受影响。\n\n**使用过滤器从 URL 中移除默认页面**\n\
  \n1. 在 GA 的管理区域中，选择相应的账户、媒体资源和数据视图后，点击第三列的`过滤器`查看该视图的过滤器。选择`新建`按钮添加一个新过滤器。\n2. 选择创建一个新过滤器（而不是应用现有过滤器）。\n\
  3. 为过滤器命名：“移除 index.php”（例如）。\n4. 选择`自定义`标签。选择`搜索和替换`作为过滤器类型。\n5. 选择`请求 URI`作为字段。\n\
  6. 在搜索字符串中，输入一个正则表达式来匹配你想要移除的模式。这可能很简单，如 `index\\.html`，或者如果存在多种可能，则使用更复杂的模式——例如\
  \ `(index|default)\\.(php|html?)`。\n7. 在替换字符串中，留空（表示替换为无）。\n8. 保存过滤器。\n\n请记住，此过滤器仅影响之后的数据。过去收集的\
  \ URL 中包含`index.php`的数据将不受影响。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，为您翻译以下文本。\n\
  \n\n#### 查询参数\n\nURL 中“查询字符串”或“查询参数”部分是指问号之后的内容：\n\n`http://www.aliceswonderlandresorts.com/reservation.php?status=completed&sort=az&sessionid=123456`\n\
  \n查询参数由等号连接的名值对组成，多个参数之间用与号分隔。有时，它们能告诉你关于页面内容或用户选择的非常有价值的信息（`status=completed`），但其他时候它们并不重要（`sort=az`），甚至对你的数据有害（`sessionid=123456`）。\n\
  \n为了解查询参数如何搅乱你的页面数据，请考虑最后一个示例 `sessionid`。Web 服务器有时会使用会话 ID 或访客 ID 来跟踪用户在一个流程中的状态。这个数字由\
  \ Web 服务器内部使用，但你并不关心它，而且它对于每个浏览器会话都是不同的。这就像你之前遇到的大小写问题，但现在 URL 不再只有两种写法，而是有数百甚至数千种！（见图\
  \ 8-11。）\n\n![A978-1-4842-0265-4_8_Fig11_HTML.jpg](img/A978-1-4842-0265-4_8_Fig11_HTML.jpg)\n\
  \n**图 8-11.** 查询参数值可能导致同一 URL 产生多种变体\n\n幸运的是，你可以移除希望去掉的查询参数。GA 中有一个视图设置，允许你从 URL\
  \ 中移除查询参数，这样你就可以看到一个一致的 URL，仅保留你希望保留的查询参数。或者，如果你想移除所有查询参数，可以使用一个简单的过滤器。\n\n> **提示**\
  \  \n> 有时，为网站设置多个视图，并对查询参数应用不同的设置或过滤器可能是有意义的。例如，一个视图可以保留更详细的查询参数信息，用于更具体的报告（当你确实想知道用户是按\
  \ A 到 Z 还是 Z 到 A 排序时），而另一个视图则可以移除这些参数，以便更好地获取页面级别的高层信息。\n\n在开始之前，你需要一份希望消除的查询参数列表。你感兴趣的查询参数部分是名称（即等号之前的部分）——例如，示例\
  \ URL 中的 `status`、`sort` 或 `sessionid`。如何编制这个列表？如果你在 GA 中已有数据，那是一个起点。（将页面导出到电子表格，并使用公式根据\
  \ `?`、`&` 和 `=` 等分隔符拆分查询参数可能会很有帮助。）查阅你的内容管理系统或其他用于管理网站的软件的文档，也可以帮助你了解查询参数及其使用方式。\n\
  \n一旦你确定了希望消除的查询参数列表，就可以移除它们了。\n\n> **提示**  \n> 你可能会遇到的一种查询参数是与内部网站搜索相关的参数。例如，在 `http://aliceswonderlandresorts.com/searchresults.php?q=hats`\
  \ 中，查询参数 `q=hats` 可能表示用户使用你的网站搜索功能搜索了“hats”一词。不要使用过滤器或视图设置移除这些参数——它们是有价值的信息，GA 有专门的一组报告来处理它们（之后你也可以将它们从\
  \ URL 中剥离）。你将在本章稍后的部分看到具体方法。\n\n##### 使用视图设置移除特定查询参数\n\nGA 提供了一个视图设置，允许你选择性地从 URL\
  \ 中移除查询参数。\n\n1.  在 GA 的管理区域中，选择相应的帐号、媒体资源和视图，然后点击第三列中的“视图设置”来编辑视图设置。\n2.  向下滚动到“排除\
  \ URL 查询参数”设置。\n3.  输入你想要排除的查询参数名称，用逗号分隔。注意，不应输入与号、等号或其他分隔符，只需输入查询参数名称。\n\n![A978-1-4842-0265-4_8_Figi_HTML.jpg](img/A978-1-4842-0265-4_8_Figi_HTML.jpg)\n\
  \n4.  保存对设置的更改。\n\n请记住，此设置仅会影响未来的数据。之前收集的包含 URL 中查询参数的历史数据不会受到影响。\n\n##### 使用过滤器移除所有查询参数\n\
  \n此过滤器会移除 URL 中问号字符（`?`）之后的所有内容。\n\n1.  在 GA 的管理区域中，选择相应的帐号、媒体资源和视图，然后点击第三列中的“过滤器”来查看该视图的过滤器。\n\
  2.  选择“新建”按钮以添加新过滤器。\n3.  选择创建一个新过滤器（而不是应用现有过滤器）。\n4.  为过滤器命名：“移除所有查询参数”。\n5.  选择“自定义”标签页。选择“搜索和替换”作为过滤器类型。\n\
  6.  选择“请求 URI”作为字段。\n7.  在“搜索字符串”中，输入以下正则表达式：`\\?.*`\n8.  在“替换字符串”中，留空（以替换为空）。\n\
  9.  保存过滤器。\n\n> **警告**  \n> 此过滤器会移除 URL 中问号字符之后的所有内容。请确保你至少还有一个包含完整、未过滤 URL 的其他视图，以备不时之需。\n\
  \n请记住，此过滤器仅会影响未来的数据。之前收集的包含 URL 中查询参数的历史数据不会受到影响。\n\n### 捕获 URL 片段\n\n你可能已经注意到，在之前的示例或你的\
  \ GA 数据中，GA 中的“页面”维度包含了 URL 的路径和查询字符串（在本示例中以粗体显示），但不包含片段（哈希标记之后的部分）：\n\n`http://www.aliceswonderlandresorts.com`**`/tea-party/index.html?location=wonderland`**`#agenda`\n\
  \n片段（在本示例中为 `#agenda`）通常用于链接到页面的特定部分。GA 默认会丢弃片段。如果你想捕获它，可以在 GTM 中使用一个变量来获取，并将附带了片段的默认页面\
  \ URL 进行覆盖。具体方法如下。\n\n> **注意**  \n> 如果 URL 片段的变化是由 AJAX 应用程序引起的，请参阅第 5 章及其关于历史监听器的信息，以触发标签来捕获该信息。此处描述的示例仅用于在页面\
  \ URL 中捕获片段，以便在现有标签被触发时记录。\n\n#### 使用 GTM 变量捕获 URL 片段\n\n首先，您需要设置一个变量来获取 URL 片段。\n\
  \n1.  在 GTM 中创建一个新变量。\n2.  选择“URL”作为变量类型。\n3.  选择“片段”作为组件。\n4.  保存变量，并为其命名：“页面 URL\
  \ 片段”。\n\n现在，您可以修改 GA 网页浏览标签，以在 URL 中包含片段。\n\n5.  在 GTM 中，编辑“GA – 网页浏览”标签。\n6. \
  \ 选择“配置标签”以更改 GA 标签设置。在“要设置的字段”部分，添加一个新字段。\n7.  从下拉菜单中选择“page”作为字段名称。\n8.  对于字段值，您将构建一个新的\
  \ URL，其中包含内建的`{{Page Path}}`变量和您刚刚创建的`{{Page URL Fragment}}`变量：`{{Page Path}}#{{Page\
  \ URL Fragment}}`\n\n![A978-1-4842-0265-4_8_Figj_HTML.jpg](img/A978-1-4842-0265-4_8_Figj_HTML.jpg)\n\
  \n> **注意**  \n> 如果没有片段，请注意此标签仍会在 URL 末尾附加 `#`。您可以轻松地在 GA 中使用“搜索和替换”过滤器来移除末尾的 `#`（如果不存在片段的话）。您也可以在\
  \ GTM 中巧妙地使用变量来处理这种情况。\n\n9.  保存对标签的更改。\n\n发布这些更改后，GTM 将在发送给 GA 的每个页面 URL 中包含片段。\n\
  \n\n\n### 查看子域名与跨域的主机名\n\n第 2 章和第 3 章讨论了如何设置 GA 跟踪代码，通过共享 cookie 将子域名或跨域视为单一网站。但正如你所见，GA\
  \ 的`页面`维度仅包含 URL 路径，而不包含主机名。虽然存在单独的`主机名`维度，但在基础的、开箱即用的报告中（例如“行为”>“网站内容”>“所有页面”报告），当存在多个域名时，并没有很好的方法来判断各页面归属于哪个站点（见图\
  \ 8-12）。\n\n![A978-1-4842-0265-4_8_Fig12_HTML.jpg](img/A978-1-4842-0265-4_8_Fig12_HTML.jpg)\n\
  \n图 8-12. “所有页面”报告未指明页面所在的域名或子域名\n\n你可以在 GA 中使用过滤器，将主机名值添加到`页面`维度的前面，这样这些报告就变得更易于解读（见图\
  \ 8-13）。\n\n![A978-1-4842-0265-4_8_Fig13_HTML.jpg](img/A978-1-4842-0265-4_8_Fig13_HTML.jpg)\n\
  \n图 8-13. 添加过滤器（将主机名包含在 URL 中）后的“所有页面”报告\n\n你将使用高级过滤器类型（图 8-14）来实现此目的，本章之前的示例中尚未介绍这种过滤器类型。高级过滤器允许你获取\
  \ GA 中的两个不同字段（字段 A 和字段 B），从中提取信息，并将这些信息输出到一个字段（输出字段）。\n\n![A978-1-4842-0265-4_8_Fig14_HTML.jpg](img/A978-1-4842-0265-4_8_Fig14_HTML.jpg)\n\
  \n图 8-14. GA 中的高级过滤器设置\n\n字段 A 和字段 B 各接受一个正则表达式。正则表达式中用括号括起来的任何部分都会捕获该字段的相应内容，以便在输出中使用。输出字段可以包含文本，也可以引用从字段\
  \ A 和字段 B 中捕获的信息的变量。这些变量看起来类似`$A1`，其中`$`是变量的标识符，`A`指代字段 A，`1`指代该正则表达式中第一组括号。\n\n\
  通过这种方式，你可以将两个字段的数据合并到一个字段中，这正是你希望对 URL 的主机名和路径所做的操作。让我们一起来操作一遍。\n\n**使用 GA 过滤器将主机名前置到\
  \ URL**\n\n在 GA 的管理区域中，选择相应的帐号、媒体资源和数据视图后，点击第三列中的“过滤器”，即可查看该数据视图的过滤器。点击`新建`按钮添加新过滤器。\n\
  \n- 选择创建一个新过滤器（而不是应用现有过滤器）。\n- 为过滤器命名：“为 URL 前置主机名”。\n- 选择`自定义`标签。选择`高级`作为过滤器类型。（有关高级过滤器如何工作的更多信息，请参阅本章前面关于跨域跟踪的示例。）\n\
  - 对于字段 A，在下拉菜单中选择`请求 URI`。输入正则表达式`(.*)`。这将选取`请求 URI`字段的全部内容，将其括在括号中可让你稍后在输出中使用它。\n\
  - 对于字段 B，在下拉菜单中选择`主机名`。输入正则表达式`(.*)`。这将选取`主机名`字段的全部内容，将其括在括号中可让你稍后在输出中使用它。\n- 对于输出字段，选择`请求\
  \ URI`（因为你想要用你的版本覆盖现有的 URL）。输入`$B1$A1`。`$B1$A1`回调了之前的字段。`$B1`选取字段 B 中的第一组括号（主机名），`$A1`选取字段\
  \ A 中的第一组括号（URL 路径）。由于你直接将它们连写在一起，没有空格或标点，它们在 GA 报告中的显示效果将会是例如[`www.aliceswonderlandresorts.com/page.html`](http://www.aliceswonderlandresorts.com/page.html)的形式。\n\
  \n![A978-1-4842-0265-4_8_Figk_HTML.jpg](img/A978-1-4842-0265-4_8_Figk_HTML.jpg)\n\
  \n勾选“字段 A”、“必需 B”和“覆盖输出字段”复选框。\n- 保存过滤器。\n\n请记住，此过滤器只会影响之后的数据。过去的 URL 在报告中不会改变。\n\
  \n### 站内搜索\n\n几乎每个网站都有让用户搜索网站内容的方式。根据网站类型的不同，此搜索可能用于查找文章、产品或任何可用的信息类型。GA 在“行为”>“站内搜索”下有一组专门衡量用户所执行的搜索及其找到答案的成功率的报告（见图\
  \ 8-15）。\n\n![A978-1-4842-0265-4_8_Fig15_HTML.jpg](img/A978-1-4842-0265-4_8_Fig15_HTML.jpg)\n\
  \n图 8-15. GA 中的站内搜索报告\n\n要启用这些报告，你需要告诉 GA 在哪里可以找到关于用户搜索内容的信息。网站的搜索可能属于以下三种情况：\n\n\
  *   搜索词包含在查询参数中。例如，搜索“帽子”可能会导致类似如下的 URL：`http://www.aliceswonderlandresorts.com/searchresults.php?q=hats`\
  \ 这是 GA 的默认假设，许多网站搜索引擎都是如此。这可以通过 GA 中的一个数据视图设置轻松完成。\n*   搜索词包含在 URL 中，但不在查询参数中：[`http://www.aliceswonderlandresorts.com/search/hats`](http://www.aliceswonderlandresorts.com/search/hats)\
  \ 使用 GA 中的过滤器，你可以将“hats”这个词从 URL 中提取出来，并将其放入适当的字段（`搜索词`维度）。\n*   搜索词根本不包含在 URL 中：[`http://www.aliceswonderlandresorts.com/searchresults.php`](http://www.aliceswonderlandresorts.com/searchresults.php)\
  \ 在这种情况下，由于搜索词不是 URL 的一部分，你需要在 GTM 的跟踪代码中捕获该搜索词。\n\n除了搜索词之外，GA 还可以选择性地捕获一个类别，该类别通常代表一种将搜索限制或限定在网站内容子集的方式。与搜索词类似，这可以表示在查询参数、URL\
  \ 中的其他信息中，或者不在 URL 中。在 URL 中，类别可能类似于以下 URL 中的`color`参数：\n\n`http://www.aliceswonderlandresorts.com/searchresults.php?q=hats&color=violet`\n\
  \n让我们看看每种情况的设置过程。\n\n**使用查询参数设置站内搜索**\n\n假设你的搜索结果 URL 看起来像`/searchresults.php?q=hats&color=violet`，其中“hats”是搜索词。\n\
  \n在 GA 的管理区域中，选择相应的帐号、媒体资源和数据视图后，点击第三列中的`数据视图设置`，即可查看该数据视图的设置。\n\n- 在底部标有`站内搜索设置`的部分，开启站内搜索跟踪。\n\
  - 指定在 URL 中何处查找站内搜索词：输入查询参数的名称。在此示例中，它是`q`。请注意，你不需要输入“与”符号（&）、等号或其他分隔符，只需输入查询参数的名称。\n\
  - （推荐）勾选复选框，从 URL 中去除此查询参数。一旦这些数据进入站内搜索报告，你就不需要在 URL 中看到它了。\n\n![A978-1-4842-0265-4_8_Figl_HTML.jpg](img/A978-1-4842-0265-4_8_Figl_HTML.jpg)\n\
  \n- （可选）通过开启站内搜索类别并输入查询参数，来指定在 URL 中何处查找站内搜索类别。在示例 URL 中，类别是`color`。\n- 保存对设置的更改。\n\
  \n请记住，此设置只会影响之后的数据。之前使用站内搜索参数收集的数据不会回填到站内搜索报告中。\n\n**在 URL 中包含信息时设置站内搜索**\n\n假设你的搜索结果\
  \ URL 看起来像`/search/hats`，其中“hats”是搜索词。以下是使用过滤器将该值从 URL 中提取并放入适当字段的方法。\n\n\n\n在 GA\
  \ 的管理区域中，使用适当的账户、媒体资源及数据视图，选择第三列中的“过滤器”以查看该数据视图的过滤器。点击“新建”按钮以添加一个新过滤器。选择创建新过滤器（而非应用现有过滤器）。为该过滤器命名：“Site\
  \ Search Term”。选择“自定义”选项卡。选择“高级”作为过滤器类型。（有关高级过滤器的工作原理，请参阅本章前面的跨域跟踪示例。）对于“字段 A”，从下拉菜单中选择“请求\
  \ URI”。输入一个正则表达式以提取 URL 中的搜索词部分（将要提取的 URL 部分括在圆括号中）。在此示例中，您可以使用以下表达式：`^/search/(.*)`。将“字段\
  \ B”留空。本过滤器不需要第二个字段。对于“输出”，选择“搜索词”。输入与搜索词对应的字段 A 变量；在此示例中为：`$A1`。\n\n![A978-1-4842-0265-4_8_Figm_HTML.jpg](img/A978-1-4842-0265-4_8_Figm_HTML.jpg)\n\
  \n勾选“字段 A 必需”和“覆盖输出字段”复选框。保存过滤器。\n\n请记住，此过滤器仅影响未来的数据。过去的数据将不会被回溯填充到网站搜索报告中。\n\n\
  与上一节中使用查询参数的设置类似，您也可以通过此方法捕获类别（如果适用于您的网站搜索）。创建另一个过滤器，选择“网站搜索类别”作为字段，并修改正则表达式以匹配\
  \ URL 的相关部分。\n\n### 使用 GTM 捕获网站搜索信息\n\n在最后一种场景中，搜索结果页面的 URL 类似于`/searchresults.php`，网站搜索信息完全不包含在\
  \ URL 中，因此您必须通过其他方式提供。您可以将此信息包含在数据层声明中：\n\n```\ndataLayer = [{ 'searchTerm': 'hats'\
  \ }];\n```\n\n首先，为此信息创建一个数据层变量。然后，您可以覆盖 GA 网页浏览标签中捕获的默认 URL，以包含此信息。\n\n**注意**：或者，可以使用\
  \ DOM 元素变量从页面内容中提取搜索词。但是，正如第 5 章中所讨论的，基于页面内容的变量可能受布局和外观变化的影响，因此，在可能的情况下，首选数据层变量。\n\
  \n在 GTM 中，创建一个新变量。对于变量类型，选择“数据层变量”。对于数据层变量名称，输入`searchTerm`（或您在数据层中用于搜索词的其他标签）。保存该变量，并将其命名为“Search\
  \ Term”。现在，您可以创建一个标签，使用此变量来扩充发送给 GA 的搜索结果页面 URL。在 GTM 中，复制“GA – 网页浏览”标签。您可以通过选择该标签进行编辑，然后选择右下角的“复制”按钮来复制标签。选择“配置标签”以修改\
  \ GA 标签设置。在“要设置的字段”部分，添加一个新字段。从下拉菜单中选择`page`作为字段名称。对于字段值，您将构造一个新的 URL，其中包含内置的`{{Page\
  \ Path}}`变量中的网站搜索词和刚刚创建的`{{Search Term}}`变量：`{{Page Path}}?q={{Search Term}}`。\n\
  \n![A978-1-4842-0265-4_8_Fign_HTML.jpg](img/A978-1-4842-0265-4_8_Fign_HTML.jpg)\n\
  \n选择“触发条件”以修改标签的触发器。移除“所有页面”触发器。您只希望此标签在搜索结果页面上触发。选择“部分页面”。创建一个名为“仅限搜索结果页面”的新触发器，其中页面\
  \ URL 与您的搜索结果页面 URL 匹配。在此示例中：`{{Page URL}}` – 等于 – `/searchresults.php`。\n\n![A978-1-4842-0265-4_8_Figo_HTML.jpg](img/A978-1-4842-0265-4_8_Figo_HTML.jpg)\n\
  \n保存该标签，并命名为“GA – 网页浏览 – 搜索结果”。\n\n**注意**：由于您创建了一个仅针对搜索结果页面触发条件的特定网页浏览标签，您还需要将此触发条件作为常规\
  \ GA 网页浏览标签的阻止触发器添加，以避免重复计数。\n\n在将此更改发布到 GTM 容器后，您的搜索结果页面将向 GA 发送类似于`/searchresults.php?q=hats`的\
  \ URL。至此，您可以像本部分前面讨论的那样，使用`q`作为查询参数设置，继续执行相同的设置。\n\n### 分组内容\n\n在上一节中，您了解了多种清理 URL\
  \ 的方法，使其能够精确对应页面，而无需聚合 URL 的各种变体。有时，您还需要在更高级别对页面进行分组：按类别、页面类型或其他分类。\n\nGA 提供了多种工具来解决此问题。有时，分组可以从\
  \ URL 的结构中明显看出：\n\n- [`http://aliceswonderlandresorts.com/hearts/queen/`](http://aliceswonderlandresorts.com/hearts/queen/)\n\
  - [`http://aliceswonderlandresorts.com/hearts/king/`](http://aliceswonderlandresorts.com/hearts/king/)\n\
  - [`http://aliceswonderlandresorts.com/spades/ace/`](http://aliceswonderlandresorts.com/spades/ace/)\n\
  - [`http://aliceswonderlandresorts.com/clubs/deuce/`](http://aliceswonderlandresorts.com/clubs/deuce/)\n\
  \n在这种情况下，“内容深入分析”报告（位于“行为” ➤ “网站内容”）会根据这些子目录对 URL 进行分组（参见图 8-16）。您可以在该报告中深入查看最多四级子目录。\n\
  \n![A978-1-4842-0265-4_8_Fig16_HTML.jpg](img/A978-1-4842-0265-4_8_Fig16_HTML.jpg)\n\
  \n**图 8-16.** 使用“内容深入分析”报告按子目录对 URL 分组\n\n在其他情况下，您可能希望根据 URL 中的其他信息（例如查询参数）或 URL\
  \ 中完全不存在的信息进行分组。您可以使用 GA 中名为“内容分组”的功能来实现此目的。\n\n内容分组是在数据视图中创建的。每个数据视图最多可以有五个内容分组——也就是说，最多可以有五组不同的页面分类集（每个分组内的类别数量不限）。有用的内容分组方式将取决于您的站点及其包含的内容类型，但常见的内容分组类型包括：\n\
  \n- 按主题或产品类别\n- 按内容类型或页面模板（着陆页、文章页面、产品页面等）\n- 按作者、发布日期或其他内容元数据\n- 按页面内容的属性（字数、是否包含视频等）\n\
  \n创建内容分组后，它们可用于在“行为” ➤ “网站内容” ➤ “所有页面”报告（参见图 8-17；以及其他以“页面”为主要维度的报告）以及导航报告（如“行为流”报告）中对页面进行分组。\n\
  \n![A978-1-4842-0265-4_8_Fig17_HTML.jpg](img/A978-1-4842-0265-4_8_Fig17_HTML.jpg)\n\
  \n**图 8-17.** GA 报告中的内容分组（此处为“所有页面”报告）\n\n内容分组可以通过三种方式定义：通过提取、通过规则定义以及通过跟踪代码。提取和规则定义允许您基于页面的\
  \ URL 或标题（或自定义维度；参见第 11 章）的模式进行分组，而跟踪代码选项则允许基于您提供的类别（通常在数据层中提供）进行分组。以下各节将结合实际使用场景的示例，说明每种内容分组方式。\n\
  \n\n\n### 通过提取进行分组\n\n提取使用正则表达式从页面的 URL 或标题（或自定义维度）中提取分组名称。例如，在以下 URL 中，您可能希望提取产品类型（`hats`、`teacups`等）：\n\
  \n`http://aliceswonderlandresorts.com/products?type=hats&id=123`\n\n`http://aliceswonderlandresorts.com/products?type=teacups&id=456`\n\
  \n`http://aliceswonderlandresorts.com/products?type=croquet&id=789`\n\n关键在于编写一个正则表达式来匹配这种模式，并只捕获您想要的\
  \ URL 部分。需要捕获的部分用括号表示。在这种情况下，以下正则表达式可能满足您的需求：\n\n`/products?type=([^&]*)`\n\n请记住，GA\
  \ 的`Page`维度不包含主机名，因此您可以从以`/products`开头的 URL 路径开始。`[^&]`匹配所有不是与号（&）的字符，而`*`表示匹配 0\
  \ 个或多个这样的字符。\n\n不过，您需要小心：如果类别参数并非总是第一个参数会怎样？考虑这样一个 URL：\n\n`/products?id=123&type=hats`\n\
  \n您希望正则表达式尽可能具体，但又不过度。为了匹配前面可能出现的各种情况，更好的正则表达式选择如下：\n\n`type=([^&]*)`\n\n现在，无论`type`参数出现在\
  \ URL 中的哪个位置，您都可以捕获其值。\n\n请注意，使用提取方法时，您需要在 URL 中指定内容组标签出现的位置，但无需指定标签本身。标签已经存在于 URL\
  \ 中，此模式将匹配 URL 中出现的所有不同类别名称。\n\n提示\n\n前面展示的正则表达式模式在通过提取创建内容组时特别有用。它被称为“字符类否定”：`[^something]`，最常用于匹配\
  \ URL 中的与号、斜杠和其他常见分隔符，以匹配除所列字符之外的所有字符。\n\n#### 通过提取设置内容分组\n\n根据前面的示例 URL，让我们设置一个通过提取实现的内容分组。\n\
  \n-   在 GA 的管理区域中，选择相应的帐号、媒体资源和数据视图，然后在第三列中选择`内容分组`，以查看该视图的内容分组。\n-   点击添加新内容分组的按钮。\n\
  -   为内容分组输入名称（即报告中此类别集合将显示的标签）：“产品类别”。\n-   选择按**提取**分组。在本示例中，选择`Page`作为维度。\n- \
  \  输入正则表达式：`category=([^&]*)` 请注意，您要提取的部分应包含在括号内。\n-   选择`保存`以保存内容分组。\n\n新的内容分组将立即可用于报告的下拉菜单中。但内容组中的类别仅从创建该内容分组的时间点起，对所收集的页面数据生效。\n\
  \n### 通过规则定义分组\n\n与提取方法类似，规则定义也使用页面的 URL 或标题（或自定义维度）。与提取方法不同，规则定义并不仅仅是从 URL 或标题中截取一段内容。相反，规则定义允许您根据字段内容创建一组有限的规则。\n\
  \n假设您有以下 URL：\n\n`http://aliceswonderlandresorts.com/hearts/queen/`\n\n`http://aliceswonderlandresorts.com/hearts/king/`\n\
  \n`http://aliceswonderlandresorts.com/spades/ace/`\n\n`http://aliceswonderlandresorts.com/clubs/deuce/`\n\
  \n如果您想按花色（`hearts`、`spades`等）对这些 URL 进行分组，通过提取可以轻松实现。但如果您想按颜色分组呢？红心和方块应为红色，黑桃和梅花应为黑色，但“红色”和“黑色”并未出现在\
  \ URL 中的任何位置。规则定义可以解决这个问题。您可以设置如下规则定义：\n\n**红色：**\n-   `Page` – 包含 – `hearts` –\
  \ 或\n-   `Page` – 包含 – `diamonds`\n\n**黑色：**\n-   `Page` – 包含 – `spades` – 或\n-\
  \   `Page` – 包含 – `clubs`\n\n匹配方式有多种选项——包含、开头是等——并且标准可以通过逻辑`或`和`与`进行组合。规则按照指定的顺序应用，第一个匹配的规则将用作该页面在内容组中的标签。\n\
  \n请注意，与提取不同，您需要在规则定义中明确指定所有可能的标签。在此示例中，`红色`和`黑色`将是唯一可能分配的类别，任何不包含“`hearts`”、“`diamonds`”、“`spades`”或“`clubs`”的\
  \ URL 将不会被分配到任何类别（在 GA 报告中会显示为“（未设置）”的值）。\n\n#### 通过规则定义设置内容分组\n\n根据前面的示例 URL，让我们设置一个通过规则定义实现的内容分组。\n\
  \n-   在 GA 的管理区域中，选择相应的帐号、媒体资源和数据视图，然后在第三列中选择`内容分组`，以查看该视图的内容分组。\n-   点击添加新内容分组的按钮。\n\
  -   为内容分组输入名称（即报告中此类别集合将显示的标签）：“花色颜色”。\n-   选择按**规则定义**分组，并选择添加新规则集的选项。\n-   在本示例中，将规则集命名为“红色”。对于第一个条件，选择`Page`作为维度。\n\
  -   选择`包含`作为匹配选项。\n-   输入`hearts`作为要匹配的文本。\n-   选择`或`来添加第二个条件，然后重复之前的步骤，选择“`Page`\
  \ 包含 `diamonds`”。\n-   选择`完成`以完成第一个规则集。\n-   添加另一个名为“黑色”的规则集，并重复上一步骤，设置“`Page` 包含\
  \ `spades`”或“`clubs`”。\n-   选择`保存`以保存内容分组。\n\n新的内容分组将立即可用于报告的下拉菜单中。但内容组中的类别仅从创建该内容分组的时间点起，对所收集的页面数据生效。\n\
  \n\n\n### 按跟踪代码分组\n\n在前两种方法中，内容分组都是基于 URL 中包含的信息或 GA 中已有的其他数据。然而，在某些情况下，您可能希望根据其他信息进行分组。考虑以下\
  \ URL：\n\n[`http://aliceswonderlandresorts.com/blog/2015/09/22/guide-rules-flamingo-croquet/`](http://aliceswonderlandresorts.com/blog/2015/09/22/guide-rules-flamingo-croquet/)\n\
  \n[`http://aliceswonderlandresorts.com/blog/2015/10/25/wheres-that-cat/`](http://aliceswonderlandresorts.com/blog/2015/10/25/wheres-that-cat/)\n\
  \n[`http://aliceswonderlandresorts.com/blog/2015/11/13/red-queen-proclamation/`](http://aliceswonderlandresorts.com/blog/2015/11/13/red-queen-proclamation/)\n\
  \n这种结构在博客或新闻文章中非常常见。如果您要查找发布日期，使用正则表达式（参见前文）即可轻松提取。但如果您想根据文章作者或文章长度进行分组呢？\n\n基于跟踪代码的分组允许您通过在页面标签中提供具有正确标签的\
  \ GTM 变量来提供标签。此变量的来源通常有以下两种选择：\n\n*   **数据层变量**：用于来自网站内容管理系统或其他来源的信息。在前面的示例中，内容管理系统知道文章的作者，因此您可以在页面的数据层声明中包含该信息：`dataLayer\
  \ = [{ 'author': 'Alice' }];` 这种方法可用于任何在页面渲染时，可从内容管理系统或其他来源获得的元数据。\n*   **自定义 JavaScript\
  \ 变量**：用于检查条件或进行计算。在前面的示例中，如果您想根据文章长度创建内容分组，可以编写一些 JavaScript 代码来查找页面的文章部分，按空格和其他标点符号进行拆分，测量长度，并将其分类为不同区间（例如\
  \ 0-100、101-200 等）。类似地，自定义 JavaScript 变量可以检查文章中的图片、视频或其他媒体文件的存在与否或数量，或者任何存在于页面内容中或可从页面内容计算出的其他信息。\n\
  \n**警告**\n\n尽管内容分组是在 GA 的每个视图中设置的，但按跟踪代码进行的内容分组将应用于该媒体资源的所有视图（因为所有数据都来自该媒体资源同一组跟踪代码，您只能在该位置提供一个值）。请规划好您将如何在单个媒体资源的各个视图中使用五个内容分组中的每一个，以确保不会在任何地方发生冲突。\n\
  \n### 设置按跟踪代码进行内容分组\n\n首先，您将在 GA 中设置内容分组。\n\n1.  在 GA 的管理区域中，选择相应的帐号、媒体资源和视图，然后在第三列选择**内容分组**以查看该视图的内容分组。\n\
  2.  选择添加新内容分组的按钮。\n3.  为内容分组输入一个名称（即报告菜单中显示的这组分类的标签）：“作者”。\n4.  选择“按跟踪代码分组”。将**启用**设置设为**开**。\n\
  5.  从索引下拉菜单中选择您要使用的插槽（1-5）。\n6.  保存内容分组。\n\n接下来，您需要在 GTM 中创建一个包含内容分组分类名称的变量。此示例假设您使用的是数据层变量，但您也可以使用自定义\
  \ JavaScript 变量。\n\n1.  在 GTM 中创建一个新变量。\n2.  选择类型为**数据层变量**。\n3.  输入`author`作为名称（此为示例；请使用您在数据层中使用的任何名称）。\n\
  4.  （可选）通过勾选复选框并输入一个值来设置一个默认值。否则，如果数据层未指定分类，该值将为空，GA 报告将显示“（未设置）”。\n5.  保存该变量，并为其命名：“作者”。\n\
  \n最后，您就可以修改 GA 的页面浏览量标签以包含内容分组了。\n\n1.  在 GTM 中，编辑**GA – 页面浏览量**标签。\n2.  选择**配置标签**以修改\
  \ GA 标签设置。在**内容组**部分，添加一个新的内容组。\n3.  对于索引，输入您在 GA 中创建分组时选择的索引编号（1-5）。\n4.  对于**内容组**，输入您刚刚创建的`{{Author}}`变量。\n\
  5.  保存该标签。\n\n当您将更改发布到 GTM 容器后，每个页面的内容组数据都将传递给 GA。新的内容分组会立即作为报告下拉菜单中的一个选项出现，但从该内容分组创建之时起，仅有之后的数据才会填充分类信息。\n\
  \n## 过滤器的其他应用\n\n前文介绍了使用过滤器及其他设置来清理 GA 数据的一些最常见应用，以及使用 GTM 捕获额外信息的大量变通方法。过滤器有许多潜在的用途，但前面的示例涵盖了大部分常见用例。\n\
  \n过滤器的另一个最常见用途是创建仅包含网站数据子集的视图。这在网站各部分之间运营或营销相对独立时尤为有用。例如，如果不同产品线或品牌有各自的营销团队，每个团队可能希望拥有一个仅包含其管辖网站部分数据的视图。这样他们就可以按照对自己最有利的方式对该视图的数据进行过滤和分组，并设置相关的转化目标（参见第\
  \ 6 章）。\n\n**注意**\n\n请记住，每个媒体资源的基本视图数量限制为 25 个。对于 Google Analytics Premium 订阅用户，在某些情况下也可能为其他\
  \ GA 用户提高此限制。\n\n将网站划分为此类功能区域的最常见方式是依据子目录或（子）域名：\n\n*   **子目录**：您希望将[`www.aliceswonderlandresorts.com/hotels/`](http://www.aliceswonderlandresorts.com/hotels/)\
  \ 和 [`www.aliceswonderlandresorts.com/amusement-parks/`](http://www.aliceswonderlandresorts.com/amusement-parks/)\
  \ 划分到不同的视图中。\n*   **（子）域名**：您希望将[`hotels.aliceswonderlandresorts.com`](http://hotels.aliceswonderlandresorts.com)\
  \ 和 [`parks.aliceswonderlandresorts.com`](http://parks.aliceswonderlandresorts.com)\
  \ 划分到不同的视图中。\n\nGA 为这些情况预定义了过滤器类型（参见图 8-18 和图 8-19）。\n\n![A978-1-4842-0265-4_8_Fig19_HTML.jpg](img/A978-1-4842-0265-4_8_Fig19_HTML.jpg)\n\
  \n**图 8-19.** 预定义过滤器，用于包含某个域名或子域名\n\n![A978-1-4842-0265-4_8_Fig18_HTML.jpg](img/A978-1-4842-0265-4_8_Fig18_HTML.jpg)\n\
  \n**图 8-18.** 预定义过滤器，用于包含某个子目录\n\n如果需要更复杂的标准来指定视图中的页面或主机名，则可以将自定义的**包含**过滤器与正则表达式结合使用。\n\
  \n\n\n### 筛选视图 vs. 细分\n\nGA 的报告界面包含一个名为 `细分` (Segments) 的功能。从表面上看，在报告中应用 `细分` 似乎与筛选视图的功能大同小异：你可以根据一长串维度和指标条件，在\
  \ `细分` 中包括或排除会话。那么，何时应该在报告中使用 `细分`，又何时应该在视图上使用 `筛选` (filter) 呢？\n\n在可能的情况下，优先选用\
  \ `细分` 而非 `筛选`。它们在 GA 报告中内置了易于理解的界面。无需掌握正则表达式知识，维度与指标名称与报告中的一致，并且创建和应用 `细分` 无需管理员的视图访问权限。最有用的是，作为一个报表内功能，`细分`\
  \ 可以应用于视图中已有的历史数据。\n\n然而，正如你在本章中所见，在某些情况和能力上，`筛选` 具有 `细分` 无法比拟的优势（例如重写字段值）。如果存在你始终希望排除的数据（如内部流量），需要为清洗目的而更改的数据，或者出于功能原因需要在不同视图中创建独立数据集（如前所述），`筛选`\
  \ 就是合适的工具。\n\n## 总结\n\n- Google Analytics 和 Google 跟踪代码管理器包含多种工具，可帮助你清洗数据，使其尽可能有用，包括\
  \ GA 中的 `筛选` 和视图设置，以及 GTM 中的拦截触发器和覆盖默认值。\n- 与 GA 和 GTM 中的所有更改一样，在将这些工具应用到用于报告和分析的数据之前，进行测试非常重要。在\
  \ GA 中，由于更改仅影响后续数据，因此谨慎使用测试视图和未筛选视图来尝试和比较结果至关重要。\n- 数据清洗最常见的需求包括：移除内部流量、标准化和整理 URL。有多种方法可以使用\
  \ GTM 和 GA 中的工具，适用于不同的情况，同时还有一些专门用于处理特定类型内容（如网址查询参数和片段、站内搜索结果网址）的工具。\n\n脚注\n[1](https://developers.google.com/analytics/devguides/collection/analyticsjs/field-reference)\n\
  [2](https://support.google.com/analytics/answer/1034380)\n\n"
- "# 9. 衡量广告活动与排查流量来源问题\n\n> 就在这时，爱丽丝跟着它掉下去了，根本没考虑过自己究竟怎样才能再爬出来。——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\
  \nGoogle Analytics 拥有一整套 `流量获取` (Acquisition) 报告，专门用于对用户访问网站的流量来源进行分类。他们来自搜索引擎、社交媒体网站的链接，还是付费广告？本章将探讨\
  \ GA 收集的关于流量来源的数据，以及如何通过 GA 中的设置和 GTM 中的工具来影响这些数据。\n\n## GA 中的流量来源\n\n在用户会话的首次匹配中，GA\
  \ 会查看浏览器的 `引荐来源` (Referrer) 值（前一个页面的 URL），以确定用户是从哪里来到网站的。基于这个值，它会为 `流量获取` 报告中使用的两个维度\
  \ `媒介` (Medium) 和 `来源` (Source) 赋值。`媒介` 代表流量的通用类别或类型，而 `来源` 则指定该类别中的具体网站。\n\nGA\
  \ 默认将流量分为以下几种媒介和来源：\n\n- **自然搜索流量：** `媒介`为 `organic`，`来源`为搜索引擎的名称（如 Google、Bing、Yahoo\
  \ 等）。这种流量来自搜索引擎网站。\n- **引荐流量：** `媒介`为 `referral`，`来源`为网站的域名。这种流量来自其他网站（除搜索引擎以外的任何网站）的链接。\n\
  - **直接流量：** `媒介`为 `(none)`，`来源`为 `direct`。直接流量指没有其他明显来源的流量，通常因为用户输入了网址、使用了书签，或直接使用了\
  \ URL。在网页浏览器中打开来自浏览器外部应用程序的 URL 也会被归类为 `direct`。\n\n这些值可以在 `流量获取` ➤ `所有流量` ➤ `来源/媒介`\
  \ 报告以及 GA 的各个报告中找到。\n\n### 边栏：GA 中的归因\n\n`归因` (Attribution) 是网站分析中的一个术语，指应用一种模型，将对理想行为（例如会话或转化）的功劳归于流量来源。用户通常会通过多个来源多次访问网站，因此有多种方法或模型可用于分配功劳：例如，将全部功劳归于第一个来源，或全部归于最后一个来源，或在所有来源之间平均分配。\n\
  \nGA 会记录每次会话的流量来源。在其所有标准报告中，GA 使用所谓的“最后点击归因”来报告这些流量来源，这意味着用户本次到达网站的方式（最后一次点击）就是该会话将被归因的流量来源。\n\
  \n然而，这个“最后点击”规则有一个重要的例外：如果某个会话的流量来源是 `direct`，GA 会记住之前的流量来源，并将该会话归因于它。本质上，`direct`\
  \ 永远不会覆盖之前的流量来源。\n\n这背后的逻辑是什么？回想一下，`direct` 流量基本上就是没有关于用户来源的信息。所以这个规则的意思是：如果你上次知道用户是如何到达的，那就不要用无信息的数据覆盖它。\n\
  \nGA“记住”用户先前来源的超时时间是可调整的；默认是六个月。你可以在管理区域的媒体资源设置中找到该设置，路径为 `跟踪信息` ➤ `会话设置`。\n\n如前所述，这个“除直接流量外的最后点击”规则应用于\
  \ GA 的所有标准报告。然而，GA 在 `转化` ➤ `多渠道路径` (Multi-Channel Funnels) 下也有一系列报告，可以查看转化前一段时间内每次会话的来源。`归因建模工具`\
  \ (Attribution Modeling Tool) 允许在不同的归因规则下进行分析，例如首次点击、包括直流的最后点击、所有流量来源的加权分配等。\n\n\
  除了 GA 执行的默认分类之外，你还可以影响这些分类，并提供关于如何标记流量来源以更好地反映你的网站及其受众的额外细节。让我们来看看如何操作。\n\n### 添加自然搜索引擎\n\
  \nGA 默认能识别大量的自然搜索引擎，但如果某个特定的搜索引擎不在该列表中，你可以添加域名，使其被计为搜索引擎（而非引荐来源）。这通常用于以下情况：\n\n\
  -   GA 默认列表中没有包含与你的网站相关的特定语言或特定国家的搜索引擎。\n-   与你的网站相关的特定行业或其他小众搜索引擎。\n\n你可以通过在 GA\
  \ 管理区域的媒体资源设置中，于 `跟踪信息` ➤ `自然搜索来源` 下指定搜索结果页面的域名和 URL 模式来添加搜索引擎。添加到该列表后，来自该网站的引荐将被归类为\
  \ `organic` 而非 `referrals`，就像来自其他搜索引擎的自然搜索流量一样。\n\n\n\n### 忽略特定引荐来源\n\nGA 还提供了忽略特定引荐网站（将其视为直接流量）的功能。这在以下情况中最为常见：\n\
  \n-   某些类型的第三方网站，例如 PayPal。用户离开你的网站，前往 PayPal（完成交易），然后返回你的网站查看最终的确认消息，这是一种典型场景。你并不希望将此次返回统计为来自\
  \ PayPal 的引荐。\n-   跨域跟踪（将在第 1 章和第 2 章以及本章后面的故障排除部分中进一步讨论）。\n\n你可以在 GA 管理界面中的媒体资源设置下的\
  \ `跟踪信息` ➤ `引荐排除列表` 中，指定要视为直接流量的域名。任何来自添加到该列表的网站的引荐都将被视为直接流量。\n\n### 广告系列跟踪\n\n\
  对于你控制的、指向你网站的链接，你可以精确指定你希望 GA 使用的媒介和来源值（以及额外的流量来源维度）。这可能包括多种类型的营销和广告链接：\n\n-   付费搜索和展示广告\n\
  -   社交媒体帖子和付费社交广告\n-   电子邮件营销中的链接，例如简报或促销\n-   合作伙伴或联盟网站的链接\n-   线下广告中的链接，例如印刷品、电视或广播\n\
  \n**注意：** GA 只能衡量你网站上的活动以及用户如何到达此处。它并非衡量其他网站活动的工具，例如有多少人在社交网络上点赞或分享了某个链接。其他工具可用于收集这些类型的数据。\n\
  \n能够为这些类型的流量指定你自己的标签非常有用，因为你希望将它们从引荐流量、自然搜索流量和直接流量中区分出来，并能够分析它们的有效性。你可以为多种流量来源维度指定你自己的值：\n\
  \n-   **媒介**（先前已讨论）：流量类型的一般类别。常见的值有 `email`、`social`、`display`、`print` 等。\n-   **来源**（先前也已讨论）：某个媒介内流量的具体来源。通常是另一个网站的域名，例如社交网络或显示广告投放的网站。对于电子邮件，它可能是邮件发送到的列表名称；对于印刷品，它可能是出版物的名称。\n\
  -   **广告系列**：特定的促销或营销活动。例如，你可能会跨多个媒介和来源推广“春季季票销售”。你希望能够将所有此类流量汇总到单个广告系列下。\n-   **关键字**（可选）：搜索广告中使用的关键词。\n\
  -   **广告内容**（可选）：描述广告内容或格式的标签。例如，你可以用此标签来区分具有不同创意内容的多个展示广告，或区分广告的不同尺寸和格式。\n\n`获客`\
  \ 报告允许你使用这些维度的任意组合来查看流量。\n\n#### 广告系列跟踪网址\n\n那么，如何向 GA 提供你希望用于这些流量来源维度的值呢？\n\n你可以使用广告系列跟踪网址（通常称为\
  \ GA 的广告系列标记）来为你希望用于这些维度的值指定参数。（不要被“标记”这个词误导；这些与 GTM 中的标记无关。）你可以在 URL 中包含特定的查询参数，来为这些流量来源维度指定值。以下是一个广告系列跟踪\
  \ URL 的示例（为清晰起见，此处分行显示）：\n\n`http://aliceswonderlandresorts.com/buy-season-tickets/?utm_medium=email&utm_source=Mad%20Hatter%27s%20Club&utm_campaign=Spring%20Season%20Ticket%20Sale`\n\
  \n这是一个指向落地页的 URL，你会将该链接用于发送给“疯帽子俱乐部”邮件列表（来源）用户的关于春季票务促销（广告系列）的促销电子邮件（媒介）中。请注意，查询参数以\
  \ `utm_` 开头，并且（在此示例中）对应于媒介、来源和广告系列维度。与所有查询参数一样，查询字符串的开始由问号（`?`）标示，每个参数都是一个由等号（`=`）分隔的键值对，每个参数之间由与号（`&`）分隔。GA\
  \ 能识别出与先前所列维度相对应的五个参数：`utm_medium`、`utm_source`、`utm_campaign`、`utm_term` 和 `utm_content`。其中，来源、媒介和广告系列是必需的（或者至少是强烈建议使用的；技术上仅来源是必需的），而关键字和内容是可选的。请注意，提供的值是经过\
  \ URL 编码的（例如，空格字符显示为 `%20`）。\n\n**提示：** 无需将所有广告系列值包含在 URL 中，你可以包含单个 `utm_id` 参数，并使用\
  \ GA 的数据导入功能来填充其余的值。有关数据导入的更多信息，请参见第 12 章。\n\nGA 提供了一个工具来帮助生成正确格式的 URL（见图 9-1）。\n\
  \n![A978-1-4842-0265-4_9_Fig1_HTML.jpg](img/A978-1-4842-0265-4_9_Fig1_HTML.jpg)\n\
  \n*图 9-1. 用于创建广告系列跟踪网址的网址构建器工具*\n\n这个工具很方便，但需要注意的是，并非必须使用它。只要你以正确的格式提供了参数，当有人点击此链接并访问网站时，GA\
  \ 就会识别这些值，并将其用于流量来源维度（而不是使用默认记录的任何值）。\n\n请注意，你无需事先对 GA 进行任何设置（例如，告知它来源、媒介和广告系列值的列表），任何人都可以创建这种\
  \ URL（他们不需要是 GA 的管理员）。这创建了一个非常灵活的系统，使营销部门的每个人都能够为他们负责的营销和广告链接打上标签，但这也意味着存在不一致的潜在可能性。\n\
  \nURL 参数中的任何值都将原样出现在 GA 中。保持所使用参数在大小写、拼写和格式上的一致性至关重要——例如，`email`、`Email` 和 `e-mail`\
  \ 在 GA 中会显示为不同的值。你可以使用视图上的过滤器来清理广告系列 URL 造成的意外错误（请参见第 8 章），但一致性应该是你的首要目标。\n\n为广告系列跟踪\
  \ URL 做的最重要的规划是，为你的组织以及你如何标记广告和营销活动定义一套标准，并确保每个人都遵守这些标准。有几种技术措施可以帮助你实现一致性：\n\n-\
  \   Google 广告平台 AdWords 和 DoubleClick 具有与 GA 的自动集成（本章后面会介绍），因此你无需担心手动应用广告系列参数。\n\
  -   许多第三方工具都具有与 GA 的集成，可以自动标记 URL。例如，流行的电子邮件营销系统 MailChimp 可以自动为电子邮件营销活动中的链接添加广告系列参数。\n\
  -   你可以使用共享电子表格（例如 Google 表格）或带有下拉选项的网络表单来强制执行一致性，而不是使用 GA 中的网址构建器表单，这样营销人员在创建广告系列\
  \ URL 时可以选择统一的值。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n### 缩短广告系列网址\n\
  \n广告系列网址可能很长，如果将其用作广告或电子邮件中的目标网址，这没问题。但在社交媒体帖子或印刷品中，当简洁性或可读性很重要时，使用网址缩短器会很有用。\n\n\
  将网址缩短器（如最流行的选项 `bit.ly`）与来自 GA 的、带有广告系列标记的链接一起使用是可以的。只需先添加广告系列参数，然后将带有广告系列标记的网址作为要缩短的链接输入即可。\n\
  \n您也可以使用所谓的“ vanity URL”作为广告系列网址的缩短版本，只需像这样从一个短网址进行重定向：\n\n[`http://aliceswonderlandresorts.com/tickets`](http://aliceswonderlandresorts.com/tickets)\n\
  \n到一个完整的、带有广告系列标记的网址：\n\n`http://aliceswonderlandresorts.com/?utm_medium=print&utm_source=brochure&utm_campaign=Tickets`\n\
  \n（如何实现重定向的详细信息取决于您的内容管理系统和/或 Web 服务器；请查阅相关文档了解详情。请参见本章后面关于与 GA 一起安全使用重定向的一些最佳实践。）对于印刷品或其他线下广告或营销材料，当您希望包含品牌链接时，Vanity\
  \ URL 尤其有用。当然，不能保证看到广告的人一定会使用该网址（而不是直接访问或使用搜索引擎），但这可以为您提供一些指示，表明用于为您的网站引流的不同线下广告的相对响应情况。\n\
  \n### 避免与广告系列网址冲突\n\n如您之前所见，您可以通过在指向您网站的链接的查询字符串中包含参数来指定流量来源维度。在大多数情况下，网站会简单地忽略它无法识别的查询参数（例如\
  \ `utm_` 参数）。但是，在某些内容管理系统或 Web 服务器上，无法识别的参数可能会导致问题或被禁止。具体来说，您应确保您的网站准备好处理以下查询参数：\n\
  \n-   `utm_source`、`utm_medium`、`utm_campaign`、`utm_term`、`utm_content`\n-   `utm_id`（前面提到过，并在第\
  \ 12 章中针对广告系列数据导入进行了更详细的描述）\n-   `gclid`、`dclid`（在接下来关于与其他 Google 工具集成的部分中描述）\n\n\
  例如，您的网站不应导致重定向而剥离这些参数。（有关重定向以及如何安全地与 GA 一起使用它们的更多信息，请参见本章后面部分。）\n\n如果由于某种原因需要避免使用查询参数，GA\
  \ 确实提供了一种替代方案。您可以使用 URL 的片段或锚点字符串部分（`#` 之后的部分）来代替 URL 的查询字符串，以包含广告系列信息。由于 URL 的这一部分由浏览器使用，通常不由服务器解释，因此在您的\
  \ Web 服务器或内容管理系统阻止您在 URL 中使用 GA 的广告系列跟踪查询参数的情况下，它是“安全的”。\n\n广告系列跟踪信息的格式相同，但位于 URL\
  \ 片段中（注意 `#`）：\n\n[`http://aliceswonderlandresorts.com/buy-season-tickets/`](http://aliceswonderlandresorts.com/buy-season-tickets/)\n\
  `#utm_medium=email`\n`&utm_source=Mad%20Hatter%27s%20Club`\n`&utm_campaign=Spring%20Season%20Ticket%20Sale`\n\
  \n要在 GA 中启用此功能，跟踪代码中有一个名为 `allowAnchor` 的设置。在 GTM 的 GA 网页浏览代码中，您可以在编辑代码时，在“Fields\
  \ to Set”部分设置此值（参见图 9-2）。\n\n![A978-1-4842-0265-4_9_Fig2_HTML.jpg](img/A978-1-4842-0265-4_9_Fig2_HTML.jpg)\n\
  \n**图 9-2.** 在 GTM 的 GA 代码的“Fields to Set”部分中使用 `allowAnchor`\n\n将此值设置为 `true` 允许您在\
  \ URL 片段中使用广告系列标签。\n\n### 使用 GTM 指定广告系列值\n\n有时，您可能不想通过在链接中使用前面描述的 URL 参数来指定广告系列值，而是希望根据您网站的一个或多个页面来指定广告系列参数。这最常用于以下情况：\n\
  \n-   **将旧的跟踪 URL 适配到 GA：** 在某些情况下，您可能有一套在您使用 GA 之前就已经存在的标记广告系列网址的系统。您可能使用特定的 URL\
  \ 模式或查询参数，并希望将其转换为 GA 中相应的广告系列维度。\n-   **“公开”的链接缺少或有错误的广告系列标签：** 即使尽最大努力勤勉且一致地将广告系列跟踪参数应用于\
  \ URL，有时也会出错。在这种情况下，您可以根据着陆页或引荐来源提供广告系列维度的值。\n\n无论出于何种原因，您都可以使用 GTM 来覆盖广告系列维度值。\n\
  \n#### 在 GTM 的 GA 代码中指定广告系列值\n\n让我们看看如何在 GTM 的 GA 代码中覆盖广告系列值。\n\n在 GTM 的“Tags”部分，选择一个\
  \ GA 网页浏览代码并选择编辑它。\n\n> **注意：** 通常您不会对所有页面的网页浏览代码进行此更改。您可能只想针对由触发器定义的特定情况（例如，在特定的着陆页\
  \ URL 上或针对特定的引荐来源）或基于变量值（例如 URL 中的查询参数）执行此操作。\n\n1.  点击 **Configure Tag** 以修改代码配置。\n\
  2.  在 **More Settings ➤ Fields to Set** 中，输入以下内容：对于 **Field Name**，根据您要设置的字段，选择以下选项之一：`campaignMedium`、`campaignSource`、`campaignName`、`campaignKeyword`、`campaignContent`\
  \ 或 `campaignId`。\n3.  对于 **Value**，输入一个固定值或一个 GTM 变量，该变量包含您要使用的值。\n\n![A978-1-4842-0265-4_9_Figa_HTML.jpg](img/A978-1-4842-0265-4_9_Figa_HTML.jpg)\n\
  \n> **提示：** 基于页面或引荐来源 URL（或其部分）的变量对于动态创建值非常有用。\n\n4.  为您要设置的每个附加广告系列值重复步骤 3。\n5.\
  \  选择 **Save Tag** 以保存对代码的更改。\n\n发布后，GTM 现在将使用代码中指定的值覆盖默认的流量来源维度值。\n\n\n\n### GA\
  \ 中的渠道分组\n\n你已经看到 GA 中有许多流量来源维度，包括 `source`、`medium`、`campaign` 等。此外，GA 允许你将这些维度的组合分组为**渠道分组**。渠道分组是一种将流量来源分类到与你对营销和广告活动的理解方式相对应的渠道中的方法。GA\
  \ 提供了一组默认的渠道分组（你可以在 `Acquisition ➤ All Traffic ➤ Channels` 报告中找到），但你可以根据自身情况进行自定义。\n\
  \n默认渠道分组包括以下渠道：\n\n- **直接流量**：直接流量，其 `Source` 值为 `direct`，`Medium` 值为 `(none)` 或\
  \ `(not set)`。\n- **自然搜索流量**：来自搜索引擎的自然流量，其 `Medium` 值为 `organic`。\n- **社交媒体流量**：来自社交媒体网站的引荐流量，其\
  \ `Medium` 值为 `referral`，且 `Source` 与 GA 识别的社交媒体网站列表匹配；或 `Medium` 包含 `social`、`social-network`、`social-media`、`sm`、`social\
  \ network` 或 `social media`。\n- **引荐流量**：来自所有其他（非社交媒体）网站的引荐流量，其 `Medium` 值为 `referral`。\n\
  - **电子邮件流量**：来自电子邮件的流量，其 `Medium` 值为 `email`。\n- **付费搜索流量**：来自搜索引擎的付费流量，其 `Medium`\
  \ 值为 `cpc`、`ppc` 或 `paidsearch`，但 `Ad Distribution Network` 不能为 `Content`。（有关 `Ad\
  \ Distribution Network` 等 AdWords 特有维度的更多信息，请参阅 `AdWords` 集成说明。）\n- **展示广告流量**：展示广告流量，其\
  \ `Medium` 值为 `display`、`cpm` 或 `banner`，或 `Ad Distribution Network` 值为 `Content`。\n\
  - **其他广告流量**：`Medium` 值为 `cpv`、`cpa`、`cpp` 或 `content-text`。\n- **任何不属于这些类别的流量都会被标记为\
  \ `(Other)`。**\n\n正如你所见，使用这些渠道分组有助于分类不同的流量类别，例如，从社交媒体网站中提取引荐流量，并将其与来自社交媒体的广告活动标记链接放在一起（从而将通常所说的“赢得”和“自有”社交流量归为一组）。\n\
  \n然而，默认类别可能不足以反映你实际开展的营销和广告类型。示例如下：\n\n- 将 `付费搜索` 渠道划分为品牌关键词和通用关键词。\n- 将 `展示广告`\
  \ 渠道划分为基于主题的广告和再营销广告。\n- 为 `合作伙伴` 或 `联盟营销` 链接创建一个渠道。\n\nGA 允许你在“管理”区域修改默认渠道分组或创建全新的分组。你可以在\
  \ `查看` 设置（第三列）下的 `渠道设置 ➤ 渠道分组` 中找到这些设置。每个渠道分组都基于一组规则（见图 9-3）。\n\n![A978-1-4842-0265-4_9_Fig3_HTML.jpg](img/A978-1-4842-0265-4_9_Fig3_HTML.jpg)\n\
  \n图 9-3. 创建渠道分组的规则\n\n这些规则按其在渠道分组设置中出现的顺序应用，与一次会话匹配的第一条规则即为该会话应用的标签。任何与会话分组中所有规则都不匹配的会话都会显示值\
  \ `(Other)`。\n\n对默认渠道分组的更改将应用于之后收集的所有数据，并且不会追溯性地更改历史数据。可以在报告中随意应用新的渠道分组（类似于细分）来查看历史数据（但应用时可能会触发抽样）。\n\
  \n## 流量数据集成\n\nGoogle 提供了 GA 与其他 Google 平台之间的多种集成，用于获取流量来源数据。这些集成可以将许多维度和指标导入 GA，以丰富交互数据，例如展示次数、点击率和费用。\n\
  \n另外，别忘了 GTM 不仅可用于 GA 代码标签，还可用于其他用途——包括广告和营销工具的跟踪和转化代码标签。GTM 为 Google 平台提供了内置的代码标签类型，例如\
  \ `AdWords` 转化和再营销代码标签、`DoubleClick Floodlight` 代码标签和 `Adometry` 代码标签，以及第三方工具代码标签。此外，GTM\
  \ 还提供了与 `DoubleClick Campaign Manager` 的集成，用于管理创建 `Floodlight` 代码标签的工作流程。\n\n在接下来的章节中，你将了解\
  \ GA 与 GTM 以及 Google 平台和工具之间的集成。\n\n\n### AdWords（谷歌关键词广告）\n\n`GA`与谷歌的广告平台`AdWords`（谷歌关键词广告）进行了整合，该平台用于在搜索结果和展示网络中投放广告。关联你的`GA`和`AdWords`帐户可启用多项功能：\n\
  \n-   **AdWords 目标网址的自动标记**。`AdWords`可以自动应用一个可识别广告的查询参数（`gclid`），而无需像本章前面所述那样手动标记广告系列网址。随后，`GA`会从`AdWords`导入流量来源维度数据，其中媒介为`cpc`、来源为`google`，而广告系列、关键词和广告内容则分别对应`AdWords`中的广告系列、竞价关键词和广告标题。此外，还会导入一系列`AdWords`特有的维度，包括广告组（用于将广告系列中的广告和关键词分组）、匹配搜索查询（根据竞价关键词触发广告的查询）、广告位、展示位置域名（针对展示网络投放）等。\n\
  -   **将 AdWords 指标导入 GA 报告**。`GA`在`流量获取`部分下包含一组`AdWords`报告，用于导入展示次数、点击次数、点击率（CTR）、费用和每次点击费用（CPC）等指标。结合`GA`中的转化和收入数据（见第\
  \ 6 章和第 7 章），这些数据可用于计算广告支出回报率（ROAS）或每次获取成本（CPA）。将费用数据（来自`AdWords`）和响应数据（来自`GA`）整合到同一组报告中，就能创建一个用于评估广告成本效益的极有价值工具。\n\
  -   **将 GA 指标导入 AdWords 报告**。`GA`指标（如跳出率）可用于`AdWords`内的报告，并且`GA`的目标和电子商务交易可作为转化数据导入`AdWords`。\n\
  -   **在 AdWords 中基于 GA 细分创建再营销受众群体**。`GA`中的所有行为数据都可用于创建再营销受众群体（向之前访问过网站或完成过特定操作的用户展示广告）。`GA`精细的细分工具允许你定制想要定位的特定受众行为。`AdWords`受众群体可以在属性设置的管理区域中创建，也可以直接从报告中细分下拉菜单中的现有细分创建。\n\
  \n要获得所有这些优势，你需要将你的`AdWords`和`GA`帐户关联起来。关联是在`AdWords`中的一个帐户与`GA`中的一个属性之间进行的。由于网站及其与`GA`属性和`AdWords`帐户的对应方式有多种可能的配置，因此可以根据需要将多个`AdWords`帐户关联到单个`GA`属性，也可以将多个`GA`属性关联到单个`AdWords`帐户。\n\
  \n> **提示**\n> \n> 将`AdWords`帐户关联到一个属性，将会导入该`AdWords`帐户中所有广告系列的`AdWords`指标（点击次数、费用、展示次数等），其中可能包括指向其他网站的广告的广告系列或广告组。最好尝试以类似的方式组织你的`AdWords`和`GA`帐户，即每个网站（`GA`属性）对应一个`AdWords`帐户。尽管并非严格必要，但这使得理解广告和网站如何匹配变得更加容易。\n\
  \n#### 将 AdWords 帐户关联到 GA\n\n关联`AdWords`和`GA`帐户需要一个登录帐号，该帐号需是`AdWords`帐户的管理员，并对要关联的`GA`属性拥有编辑权限。在继续操作之前，请确保你在两个工具中都具有适当的权限。（一旦关联，任何拥有`GA`中某个数据视图的报告与分析权限的用户都可以看到导入的数据，但关联过程需要编辑权限。）\n\
  \n在`GA`的管理区域中，选择相应的帐户和属性后，点击中间栏的`AdWords 关联`。选择`新建`按钮以添加新的`AdWords`关联。选择一个或多个你可以访问的`AdWords`帐户以关联到该属性。然后点击`继续`按钮。\n\
  \n![A978-1-4842-0265-4_9_Figb_HTML.jpg](img/A978-1-4842-0265-4_9_Figb_HTML.jpg)\n\
  \n给该关联组起一个标题以便识别。选择你要关联的属性内的数据视图。你可以选择一个或多个数据视图。所选的数据视图将启用前面讨论过的集成选项，而未选中的数据视图则不会包含任何详细的`AdWords`数据。（你可以在关联建立后稍后更新这些设置，以启用或禁用某个数据视图。）\n\
  \n![A978-1-4842-0265-4_9_Figc_HTML.jpg](img/A978-1-4842-0265-4_9_Figc_HTML.jpg)\n\
  \n> **注意**\n> 默认情况下，创建关联会启用`AdWords`帐户中的自动标记功能。如果需要，你可以覆盖此设置，但建议使用自动标记以获得`AdWords`与`GA`集成的所有好处。点击`关联帐户`按钮以完成关联。\n\
  >\n> 与`GA`管理设置中的其他更改一样，此数据仅从关联建立之时起开始导入。\n\n从广告发布的另一方面来看，`GA`还提供了与`AdSense`（谷歌广告联盟）的集成——即在你的网站上发布来自`AdWords`的广告（你可以从中获得谷歌的点击收入分成）。与`AdWords`类似，你可以将`AdSense`帐户关联到`GA`（在属性设置的管理区域中）。在`行为`\
  \ > `发布商`下可以找到额外的报告，并且从导入的数据中可以获取额外的维度和指标。\n\n### DoubleClick 平台\n\n与`AdWords`类似，`GA`还与谷歌的`DoubleClick`广告工具`DoubleClick\
  \ Campaign Manager`（DoubleClick 广告管理平台）和`DoubleClick Bid Manager`（DoubleClick 竞价管理器）进行了集成。这些集成仅适用于\
  \ Google Analytics Premium 订阅用户。与`AdWords`集成类似，`DoubleClick`支持自动标记（使用`dclid`参数），将数据导入到`流量获取`部分的`DoubleClick`报告中，以及基于`GA`细分创建用于`DoubleClick`的再营销受众群体。\n\
  \n`DoubleClick Campaign Manager`还与`GTM`进行了集成，允许在`DCM`界面中生成`DoubleClick Floodlight`（DoubleClick\
  \ 计数像素）代码，并将其推送到`GTM`进行审批。你可以在容器设置的`审批队列`中找到这些内容（见图 9-4）。当然，就像对容器进行的任何其他更改一样，容器必须在`GTM`中发布后才能生效。\n\
  \n![A978-1-4842-0265-4_9_Fig4_HTML.jpg](img/A978-1-4842-0265-4_9_Fig4_HTML.jpg)\n\
  \n**图 9-4.** `DoubleClick Floodlight`代码的审批队列可以在`GTM`管理区域的容器设置底部找到\n\n在广告发布方面，Google\
  \ Analytics Premium 用户还可以享受与`DoubleClick for Publishers`（DoubleClick 广告发布商平台）的集成，该集成提供了与`AdSense`集成类似的报告和指标。\n\
  \n### Google Search Console（谷歌搜索控制台）\n\n对于自然搜索，Google Search Console（原谷歌网站管理员工具）提供了大量关于谷歌搜索引擎如何与你的网站交互的信息。这包括关于你的网站出现的搜索结果页面的指标、列出的关键词和着陆页、它们的平均排名以及大致的展示次数和点击次数。`GSC`中的一个网站可以关联到`GA`中的一个属性（在属性设置的管理区域中），以将这些信息导入到`GA`中。导入的数据可在`流量获取`\
  \ > `搜索引擎优化`下的报告中找到。\n\n请注意，与`AdWords`和`DoubleClick`的集成不同，`GSC`的集成并不会将外部数据与`GA`中的会话数据连接起来。它只是为了方便，将`GSC`的报告在`GA`的界面中提供，从而免去你登录`GSC`并单独查看它们的麻烦。\n\
  \n## 流量来源问题排查\n\n有时，流量来源信息可能会丢失。让我们探讨一下流量来源数据不正确的原因，并了解如何避免这些陷阱。\n\n\n\n### 重定向\n\
  \n重定向是一种有价值的工具，用于强制网站 URL 的一致性、提供替代（通常是更短的）URL，并确保历史链接仍然有效。但是，您需要谨慎地在网站上使用重定向，以确保不会丢失关于用户如何到达网站的数据。您需要重定向来实现以下两个目标：\n\
  \n-   重定向保留 HTTP Referrer 标头。Referrer 标头告知浏览器，当点击链接时，上一个页面是哪个 URL，这也是 GA 用来在引荐流量和自然搜索流量中分配来源的信号。服务器端重定向（也称为\
  \ 301 或 302 重定向）通常能够保留 Referrer 标头。\n-   重定向保留原始 URL 上的任何查询参数——特别是本章前面描述的任意广告活动跟踪参数。这些参数应在最终目标页面的\
  \ URL 中可见——如果您在 URL 中看不到它们，GA 同样也看不到它们。\n\n您可以使用浏览器的测试工具，在重定向的 URL 上检查相应的行为。例如，假设我知道\
  \ [`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/) 被重定向到\
  \ [`aliceswonderlandresorts.com`](http://aliceswonderlandresorts.com)（不带 `www`）。我可以测试来自引荐网站的链接，以查看重定向类型并确认\
  \ Referrer 标头得以保留，同时我还可以测试带有广告活动标签的链接，以确保广告活动参数得以保留。具体操作如下。\n\n首先，我从另一个网站点击了一个链接（带\
  \ `www` 的链接）。查看 Chrome 开发者工具中的“网络”选项卡，您会看到图 9-5。\n\n![A978-1-4842-0265-4_9_Fig5_HTML.jpg](img/A978-1-4842-0265-4_9_Fig5_HTML.jpg)\n\
  \n**图 9-5.** 在 Chrome 开发者工具中查看服务器端重定向\n\n请注意，服务器返回的状态码是 `301 Moved Permanently`（一个永久性的服务器端重定向），查看请求标头，您会看到\
  \ Referrer 标头同时出现在原始请求和重定向后的 URL 中。\n\n如果情况并非如此（即，如果您没有看到 `301` 或 `302` 作为状态码），那么该重定向是客户端重定向，这意味着它发生在浏览器本身，而不是在\
  \ Web 服务器上。这样做的结果是，两个页面会依次加载——首先是重定向页面，然后是实际的目标页面。根据 GTM 中的设置，您会遇到以下两个问题之一：\n\n\
  -   您将在没有用户任何交互的情况下连续获得两次网页浏览，导致使用重定向 URL 的流量跳出率降至 0%。\n-   您在重定向页面上有一次未追踪的网页浏览，这意味着原始来源信息丢失，您将看到自身引荐（请参阅下一节）。\n\
  \n显然，这两种情况都不是理想状态——您会丢失某一种类型的数据。这就是不推荐使用客户端重定向的原因；请改用服务器端重定向。（具体如何操作将取决于您的 Web 服务器或内容管理系统；请参考相应的文档。）\n\
  \n**注意：** 存在一些变通方法，用于在 GA 中使用客户端重定向来捕获并提供原始引荐来源，可以通过 cookie 或查询参数值实现。然而，客户端重定向通常对搜索引擎优化也不利，因此最好的建议是完全避免它们，转而使用服务器端重定向。\n\
  \n现在，让我们尝试一个带有重定向 URL 的广告活动链接（见图 9-6）。\n\n![A978-1-4842-0265-4_9_Fig6_HTML.jpg](img/A978-1-4842-0265-4_9_Fig6_HTML.jpg)\n\
  \n**图 9-6.** 在 Chrome 开发者工具中查看带有广告活动参数的重定向\n\n这里您可以看到，广告活动参数既包含在原始请求中，也包含在重定向后的\
  \ URL 中。成功！\n\n同样，如果这不是您看到的情况，您需要检查您的 Web 服务器或内容管理系统的设置，看看是否有办法修改此行为以保留这些参数。（或者，您也可以使用本章前面描述的\
  \ `setAllowAnchor` 设置，利用 URL 片段而非查询字符串来传递广告活动跟踪信息。）\n\n### 自身引荐\n\nGA 中最常见的流量来源问题之一是看到自身引荐：您自己的网站显示为引荐来源（见图\
  \ 9-7）。显然，这并非预期结果——当用户从您网站上的一个页面点击链接跳转到另一个页面时，这不应计入引荐——这只是在浏览网站！\n\n![A978-1-4842-0265-4_9_Fig7_HTML.jpg](img/A978-1-4842-0265-4_9_Fig7_HTML.jpg)\n\
  \n**图 9-7.** 获客报告中的自身引荐（aliceswonderlandresorts.com 是我们的网站）\n\n为什么会出现自身引荐？两个最普遍的原因是：页面缺少\
  \ GA 代码标签，以及跨域或子域跟踪配置不正确。\n\n### 缺少 GA 代码标签的页面\n\n当用户登陆某个页面并开始一个会话时，GA 会分配来源、媒介以及本章前面讨论的其他流量来源维度。但是，假设出现这样一种情况：用户登陆的页面上没有触发任何\
  \ GA 标签。会发生什么？\n\n由于没有 GA 标签触发，会话尚未开始。如果用户继续导航到第二个页面——这个页面带有 GA 标签——GA 会开始一个会话并询问：“好的，这个用户是从哪里来的？”在这种情况下，它来自您网站上的另一个页面，于是\
  \ GA 将媒介分配为“引荐”，来源分配为您自己的域名。\n\n在“获客”>“流量来源”>“引荐”报告中，您可以深入查看自身引荐，了解它们源自哪些页面。请在这些页面上检查以下事项：\n\
  \n-   GTM 容器代码是否存在于该页面？ 使用 Google Tag Assistant 扩展程序或检查页面源代码来确认。有时某些页面可能使用了不同的模板或布局，您可能无意中遗漏了包含容器代码。\n\
  -   是否有一个 GA 标签被设置为在此页面的网页浏览（`gtm.js` 事件）时触发？ 使用 GTM 的调试模式查看标签以及哪些标签在此页面上触发。如果没有\
  \ GA 网页浏览标签被触发，您需要修改 GTM 中的触发器，以确保您正在跟踪此页面。\n\n### 跨域或子域跟踪配置不正确\n\n回顾第一章，GA 使用 cookie\
  \ 来跟踪用户。当有多个域或子域需要作为一个整体网站进行衡量时，您需要确保 GA 在这些域之间拥有一致的 cookie 值。如果做不到这一点，它会将每个网站视为独立的，每个网站都有独立的会话，您将看到这些域之间的引荐流量。\n\
  \n如果您有多个域或子域，并且看到它们之间存在引荐流量，那么 GTM 中 GA 标签的设置不正确很可能是罪魁祸首。您需要确保 GTM 中的所有 GA 标签都包含适当的跨域设置（详细信息请参阅第一章和第二章）。仔细检查您的标签设置并进行必要的调整。\n\
  \n\n\n## 摘要\n\n-   GA 提供了多个维度来描述会话的流量来源。除了分配的默认值之外，您还可以使用 GA 中的广告系列标记和其他功能，或覆盖 GTM\
  \ 的 GA 标记中的值，来自定义营销和广告来源的标签。\n-   Google 提供了多种将 Google 平台上的广告和营销数据来源与 GA 和 GTM 集成的方案。\n\
  -   自我引荐是流量来源数据中最常见的问题，通常由未标记的页面、行为不当的重定向或不正确的子域名或跨域跟踪导致。\n\n脚注 1\n\n[`https://support.google.com/analytics/answer/2795821#searchEngine`](https://support.google.com/analytics/answer/2795821#searchEngine)\n\
  \n2\n\n[`https://support.google.com/analytics/answer/1033867?hl=en`](https://support.google.com/analytics/answer/1033867?hl=en)\n\
  \n"
- "# 10. 跨设备跟踪用户\n\n> “你是谁？”毛毛虫问道。这可不是一个鼓励人开口交谈的开场白。爱丽丝怯生生地回答说：“我——先生，我现在几乎也说不清——至少我知道今天早上起床时我是谁，但从那以后，我想我已经变了好几次了。”\
  \ ——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\nGoogle Analytics 报告一个名为“用户”的指标，这听起来像是在统计使用网站的人数。一个“用户”应该代表一个单独个体在网站上随时间推移的活动情况，对吗？不幸的是，实际情况要更复杂一些。Google\
  \ 并没有（至少目前没有）通过我们设备的摄像头监视我们所有人并使用面部识别来识别我们的身份，因此“用户”和“人”并不完全是一回事。\n\n正如你在第 2 章中所记得的那样，GA\
  \ 使用一个包含客户端 ID 的 Cookie。这是一个随机生成的标识符。由于它存储在 Cookie 中，因此特定于具体的浏览器和设备。默认情况下，GA 使用此客户端\
  \ ID 来计算用户指标和跨会话的用户行为。所以，“用户”实际上对应的是“浏览器/设备”，而不是“人”。而且我们都知道，人们可能会删除浏览器的 Cookie（手动或使用“隐私”浏览模式），也可能使用多个设备（例如，他们在笔记本电脑和手机上访问过你的网站）。所有这些都意味着，通过客户端\
  \ ID 来计算用户数量在某种程度上是不准确的。\n\n在某些情况下，这是你能做到的最好程度，也是网站衡量中必须接受的一个限制。然而，有时你有更好的方法知道当用户与你的网站（例如，用户登录的网站）互动时他们是谁。因为他们已登录，无论他们的\
  \ Cookie 内容是什么或使用什么设备，你都能确切地知道他们是谁。GA 允许我们设置一个额外的标识符，称为用户 ID，它可以用来更准确地将“用户”和“人”对应起来，并向我们展示同一个人跨设备和浏览器的活动情况。\n\
  \n## 边栏：使用用户 ID 跟踪的场景\n\n使用用户 ID 跟踪的一个直接场景就是如上述所说，通过登录将同一用户跨设备的网站会话拼接起来。用户 ID 也可用于整合以下数据：\n\
  \n-   网站活动与移动应用（见第 13 章）。如果用户同时登录了你的网站和移动应用，你可以统一他们在这些界面和设备上的活动。\n-   网站活动与其他线上或线下营销活动。如果用户登录了你的网站，你可能在\
  \ CRM 或其他系统中拥有包含电子邮件地址、社交媒体用户名或（店内购买使用的）会员卡号等信息的资料。这些数据中的一部分可以通过数据导入（见第 12 章）或使用\
  \ Measurement Protocol（见第 14 章）在 GA 中获得，或者你也可以在导出数据后，使用诸如 BigQuery 进行数据仓库和分析（见奖励章节）或使用\
  \ GA API 提取数据（见附录）等工具来整合数据。\n\n根据你保留的客户内部数据，你可能还能想到使用这些数据的其他方式。\n\n### 注意\n\n在识别用户方面，技术上可行的方法超出了\
  \ GA 政策允许的范围。¹ 有许多技术可以更精确地跨浏览器或在 Cookie 被删除时识别个体，但这些技术是不被允许的（例如从 Flash 共享对象重新创建\
  \ Cookie、浏览器指纹识别或使用移动设备标识符）。Google 的政策以及你所在运营国家的法律可能会发生变化；请仔细检查这些政策和法律，并在必要时寻求法律建议，以确保你遵守规则。请记住，信誉良好的网站总会明确告知用户其数据将如何被收集、保留和使用。\n\
  \n在 GA 中设置用户 ID 跟踪有三个基本步骤：\n\n1.  在 GA 资源中启用用户 ID 功能。\n2.  在 GA 资源中创建一个用于报告用户 ID\
  \ 数据的视图。\n3.  修改 GTM 中的 GA 标记，以发送用户 ID 值。\n\n在接下来的章节中，你将逐步完成这些流程。\n\n\n\n## 在 GA\
  \ 中设置用户 ID\n\nGoogle Analytics 中的用户 ID 功能是在媒体资源级别启用的。一旦为媒体资源启用了用户 ID，您就可以在该媒体资源内创建基于用户\
  \ ID 统一用户并显示特殊跨设备报告的视图。我们所有现有的视图将继续使用旧规则（通过客户端 ID 计算用户）。您需要创建一个新视图才能利用用户 ID。用户 ID\
  \ 只能在创建视图时启用；此设置之后无法更改。\n\n使用用户 ID 的视图将仅包含设置了用户 ID 的会话数据。这意味着，用户 ID 视图将不包含例如未登录用户的会话。因此，您永远不应该只为媒体资源设置一个用户\
  \ ID 视图；您至少需要创建一个启用了该选项的视图（用于使用用户 ID 查看跨设备行为），另一个则关闭该选项（用于显示所有用户的会话，包括未标识的用户）。\n\
  \n设置用户 ID 功能时，您可以选择控制会话整合，这涉及用户被识别之前会话中收集的数据是否与该用户关联。例如，考虑会话中的以下页面浏览序列（见图 10-1）。\n\
  \n![A978-1-4842-0265-4_10_Fig1_HTML.gif](img/A978-1-4842-0265-4_10_Fig1_HTML.gif)\n\
  \n图 10-1. 用户在标识前后浏览的页面序列\n\n如果开启会话整合（默认设置），此会话中的所有页面浏览都将与该用户 ID 关联，即使在前两次页面浏览时您还不知道用户\
  \ ID。（请注意，会话整合仅适用于单个会话内的跟踪点击。未登录的会话永远不会与用户 ID 关联，也不会包含在用户 ID 视图中。）对于许多网站，开启会话整合可能是您想要的选项。\n\
  \n然而，有时您可能只想考虑设置了用户 ID 的页面（在此示例中为最后三次页面浏览）。这可能是出于政策原因，或者例如针对多人登录共享的计算机。关闭会话整合将仅包含在用户\
  \ ID 启用的视图中那些针对跟踪点击设置了用户 ID 的数据。\n\n### 为 GA 媒体资源启用用户 ID\n\n首先，您需要在 GA 媒体资源中启用用户\
  \ ID 跟踪。\n\n在 Google Analytics 的管理部分，选择所需的媒体资源（中间列）。在跟踪信息部分，选择用户 ID。查看相关政策，并通过将开关切换到“开启”来同意条款。选择“下一步”继续。GA\
  \ 将显示在跟踪代码中设置用户 ID 的说明；您可以暂时跳过此步骤，因为您将在本章后面部分在 GTM 中进行设置。选择保持会话整合开启或通过切换开关将其关闭。（请参见前面关于会话整合设置的讨论。）选择“下一步”继续。最后一步将提示您创建一个启用了用户\
  \ ID 的视图。您可以点击“创建”按钮开始此过程，或者如果您将来需要为此媒体资源创建一个新的启用了用户 ID 的视图，请参阅下一节。\n\n### 创建 GA\
  \ 视图以显示用户 ID 报告\n\n在 GA 的管理部分，选择视图下拉菜单（第三列），然后选择列表底部的“创建新视图”。（或者，如果您是从前面的步骤继续操作，点击该过程末尾的“创建”按钮也会到达相同的位置。）选择“网站”作为视图类型。为视图输入一个名称（例如“已登录用户”），并选择一个时区。将“用户\
  \ ID 视图”设置更改为“开启”。点击“创建视图”按钮完成视图创建。\n\n视图创建完成后，不要忘记更改您需要的任何其他设置，例如应用过滤器（请参阅第 8 章）、设置转化（请参阅第\
  \ 6 章）或渠道分组（请参阅第 9 章）。\n\n在您新建的启用了用户 ID 的视图中，只会显示指定了用户 ID 的会话和点击，“用户数”指标将基于唯一用户\
  \ ID 的计数。此外，您还会在“受众群体” ➤ “跨设备”（见图 10-2）下找到一些额外报告，这些报告显示了用户的跨设备行为。\n\n![A978-1-4842-0265-4_10_Fig2_HTML.jpg](img/A978-1-4842-0265-4_10_Fig2_HTML.jpg)\n\
  \n图 10-2. GA 用户 ID 视图中可用的跨设备报告示例\n\n## 使用 GTM 发送用户 ID 数据\n\n现在您已启用 GA 来接收和使用用户 ID\
  \ 数据，您需要设置您的网站和 GTM 来发送它。\n\n### 提供用户 ID 值\n\n您的网站需要提供一个用户 ID 值供 GTM 使用。最直接的方法是在数据层声明（GTM\
  \ 代码之前数据层中包含的信息）中包含一个条目：\n\n```\ndataLayer = [{\n                'userId': 'alice0214'\n\
  \            }];\n```\n\n然后，您可以简单地使用 GTM 中的数据层变量来访问此值。在数据层中获取此值通常涉及一些服务器端网站编码来插入适当的值（例如，类似于第\
  \ 7 章中放置在数据层中的电子商务数据）。\n\n根据您的网站，可能还有其他查找用户 ID 值的方法：在 cookie 中，甚至使用页面上显示“欢迎，alice0214!”的元素。使用数据层变量可确保站点的其他更改（例如，更改页面上放置“欢迎，alice0214!”元素的布局）不会影响您的跟踪设置。与本书讨论的许多其他变量一样，使用数据层为\
  \ GTM 组织信息始终比依赖页面内容或其他脚本（这些内容可能不受您控制）更安全、更可靠。\n\n**提示：** GA 报告中没有直接可见的用户 ID 值。在许多情况下，您需要报告用户\
  \ ID 值以匹配来自其他来源的数据，因此，在自定义维度中也发送此变量（请参阅第 11 章）是一个好主意，您可以在报告和导出的数据中使用它。\n\n\n\n###\
  \ 配置 GTM 以将用户 ID 发送到 GA\n\n既然网站数据层已提供用户 ID，你需要在 GTM 中设置一个变量来捕获该值，然后修改 GA 标签，将此变量作为用户\
  \ ID 发送。让我们逐步了解整个过程。\n\n#### 在 GTM 的 GA 标签上设置用户 ID\n\n首先，创建一个变量来从数据层捕获用户 ID。\n\n\
  在 GTM 的“变量”部分，选择“新建”按钮创建一个新的用户自定义变量。选择“数据层变量”作为变量类型，然后点击“继续”。在“数据层变量名称”字段中，输入你在数据层条目中使用的名称（本章前面的示例中为\
  \ `userId`）。选择“创建变量”以保存该变量。为其命名：`用户 ID`。接下来，你需要修改 GTM 中的 GA 标签，以传递此变量的值。我们先从基础的网页浏览标签开始。在\
  \ GTM 的“标签”部分，选择“GA – 网页浏览”标签并点击编辑。点击“配置标签”以修改标签配置。在“更多设置” ➤ “要设置的字段”下，选择 `userId`\
  \ 作为字段名称。在“值”字段中，使用你之前创建的 `{{用户 ID}}` 变量（参见以下截图）。\n\n![A978-1-4842-0265-4_10_Figa_HTML.jpg](img/A978-1-4842-0265-4_10_Figa_HTML.jpg)\n\
  \n选择“保存标签”以保存对标签的更改。\n\n你需要对容器内的所有 Google Analytics 标签进行此更改，以便在每次适用的跟踪点击中发送用户 ID\
  \ 值。当然，在数据出现在 GA 之前，你需要测试并发布新版本的容器。一旦这些更改在网站上发布，你将开始在 GA 的用户 ID 视图中看到已登录用户的数据。\n\
  \n## 总结\n\n- Google Analytics 通常使用客户端 ID（一个存储在 cookie 中的标识符，特定于某个浏览器和设备）来统计用户。对于用户可以登录或以其他方式识别的网站，GA\
  \ 支持使用用户 ID 来更准确地跨设备统计用户。\n- 在收集用户 ID 数据时，隐私问题、政策、法规以及对网站用户的适当披露是重要的考量因素。请仔细审查这些内容。\n\
  - 用户 ID 功能在 GA 中通过媒体资源级别启用，可以选择是否使用会话统一（统计用户登录前的点击）。在该媒体资源内，可以创建启用用户 ID 的视图，仅显示包含关联用户\
  \ ID 的数据以及额外的跨设备报告。\n- 在 GTM 中，用户 ID 从网站捕获，通常是将用户 ID 值插入数据层中。修改 GTM 中的 GA 标签以包含此用户\
  \ ID 变量。\n\n## 脚注\n\n您所在国家的 GA 服务条款可在 [`www.google.com/analytics/terms/`](http://www.google.com/analytics/terms/)\
  \ 找到。附加的用户 ID 政策（在 GA 中启用用户 ID 功能前必须同意）可在 [`https://developers.google.com/analytics/devguides/collection/protocol/policy`](https://developers.google.com/analytics/devguides/collection/protocol/policy)\
  \ 找到。\n\n"
- "# 11. 提供关于用户的附加数据\n\n> “再喝点茶吧，”三月野兔非常认真地对爱丽丝说。“我还没喝过一口呢，”爱丽丝用生气的语气回答，“所以我不能再喝了。”“你的意思是你不能喝更少的，”帽匠说：“从零开始喝多很容易。”\
  \ ——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\n前面几章介绍了如何使用 Google 跟踪代码管理器将网站信息传输到 Google Analytics。你已经学习了如何衡量基本信息——用户交互，例如页面加载（通过网页浏览跟踪）——以及更具体的操作——例如观看视频或下载文件（通过事件衡量）。\n\
  \n在本章中，你将学习如何为这些网页浏览或事件添加额外的自定义数据，以提供关于网站内容、访问用户及其操作的更多信息。在许多情况下，你的网站可能掌握关于用户及其行为的更多信息——这些信息来自你的用户注册数据库、内容管理系统或其他可通过\
  \ GTM 捕获的源——你希望将这些信息与 GA 中的交互行为数据关联起来。你将利用 GA 接受自定义维度和指标的能力来嵌入这些额外数据。这些数据将是你所在组织和网站独有的，对于在\
  \ GA 中进行更详细的分析和细分非常有价值。\n\n**注意**：自定义维度和指标是一组更新后的功能，取代了自定义变量这一 GA 中实现类似自定义的旧功能。如果你过去使用过自定义变量，它们将继续有效，但自定义维度和指标是未来的首选方法。\n\
  \n### 自定义维度和指标\n\n回顾（来自第 1 章）GA 的报表按维度和指标组织。你发送给 GA 的每次点击会填充某些内置维度和指标。然而，GA 也允许你向发送的点击中添加自定义维度和指标。让我们看看这些选项以及你可能需要使用它们的一些原因。\n\
  \n\n\n### 维度\n\n维度是将数据分门别类的标签。每种点击类型，例如页面浏览量和事件，都有预定义的维度，你可以用不同的数据片段填充这些维度。\n\n\
  例如，对于页面浏览量，你有一个名为 `Page` 的维度，通常是指你所在页面的路径（尽管在第 6 章中，你可以自定义这个维度来表示任何你想要的 URL）。\n\n\
  对于事件，你可以使用更通用的维度，例如 `Event Category`、`Event Action` 和 `Event Label`。你可以在这几个字段中填入任何内容；例如，你可以分别使用\
  \ `Downloads`、`PDF` 和 `example.pdf` 来告诉 Google Analytics（分析）：有人发起了下载，文件类型是 PDF，并且他们开始下载的具体文件名为\
  \ `example.pdf`。\n\n除了与每次点击相关联的维度之外，还有其他维度可能适用于整个会话、用户甚至特定产品（在电子商务数据中）。所有这些维度都是预先确定好的，并收集在\
  \ GTM 的 GA 代码中。自定义维度允许你提供自己的标签，以额外的数据分类方式来扩展这些维度。\n\n通过自定义维度，你拥有完全的控制权：你可以为维度命名，然后决定在该维度中存储什么内容。如果你知道发表博客文章的作者、用户的注册状态或产品的重量，都可以存储在\
  \ GA 中。GA 允许你为每个媒体资源创建 20 个自定义维度。（GA Premium 订阅用户每个媒体资源最多可获得 200 个自定义维度。）\n\n创建自定义维度时，你需要在\
  \ GA 中指定一个范围，该范围表示此维度与 GA 中哪些数据相关，或者 GA 应该“记住”自定义维度多长时间。共有四种可能的范围：\n\n*   **用户**：提供的信息会添加关于特定用户的更多详情（由浏览器中的客户端\
  \ ID Cookie 确定——请参阅第 10 章），并且每次该用户回来时都会被记住。用户级自定义维度用于描述应适用于用户当前会话及所有未来会话的用户属性（除非你更改或更新该值）。可能的示例包括以下内容：\n\
  \    *   人口统计信息，例如年龄、性别、收入、职业等。\n    *   客户信息，例如用户 ID、状态、订阅级别或续订日期。\n    *   用户与网站关系史上的累积数据，例如生命周期价值或总分享次数。\n\
  \    *   用户群组信息，例如首次购买日期、注册日期等。（首次访问日期是 GA 中的内置维度，因此你无需为此创建自定义维度，但其他“首次”数据，例如首次产品购买，可能会很有用。）\n\
  \n> **提示**  \n> 如果你正在按照第 10 章所述的方式收集用户 ID 以统一跨设备会话，你也应该为用户 ID 创建一个自定义维度，因为 GA 不会将此值作为内置维度在报告中提供。\n\
  \n*   **会话**：提供的信息描述的是该特定会话。示例如下：\n    *   会话期间发生的行为，例如登录状态或是否查看了特定类型的内容。\n    *\
  \   与网站特定功能的互动，例如分面导航或是否有任何商品添加到购物车。\n*   **点击**：提供的信息仅描述此次特定的点击，例如页面浏览量或事件。示例如下：\n\
  \    *   页面级信息，例如作者姓名、发布日期或页面类别。\n*   **产品**：该信息适用于特定产品，超出了在 GA 电子商务跟踪中可以使用的那些基本维度。示例如下：\n\
  \    *   产品重量、采购信息、内部跟踪 ID 等。\n\n> **警告**  \n> 对于自定义维度，你可以自由创建和填充字段。请记住，GA 的服务条款禁止收集个人身份信息——因此，包含用户姓名、电子邮件地址等的自定义维度是绝对不允许的。请确保你阅读并遵守相关政策。¹\n\
  \n### 指标\n\n维度是将点击、会话或用户数据分门别类的标签，而指标则是通过统计这些点击而得到的衡量结果。指标是各种单位的数字，例如总页面浏览量或事件数（仅从零开始计数）；或者时间元素，例如会话时长；或者是电子商务和目标价值的金额。\n\
  \n与维度一样，你也可以创建自己的自定义指标。创建自定义指标时，你可以选择格式为整数、十进制货币或时间度量。GA 会根据报告中此类型的信息适当格式化该指标。GA\
  \ 允许你为每个媒体资源创建 20 个自定义指标。（GA Premium 订阅用户每个媒体资源可获得 200 个。）\n\n你还需要选择一个范围。自定义指标只有两种范围：\n\
  \n*   **点击**：自定义指标代表与它所附加的点击（例如页面浏览量或事件）相关联的度量值。\n*   **产品**：自定义指标代表与电子商务交易中特定产品相关联的度量值。\n\
  \n> **注意**  \n> 自定义指标总是会基于某个维度（该维度也有作用域）进行汇总。因此，你可以通过使用点击级范围的维度（如 `Page`）来获取特定点击的自定义指标总计，通过使用会话级范围的维度（如\
  \ `Campaign`）来获取特定会话的总计，依此类推。\n\n#### 边栏：维度还是指标？\n\n当你拥有来自网站的一些数据片段想要在 GA 中使用时，你必须做出决定：这是维度还是指标？\n\
  \n有时，选择很容易。如果值是文本，那么它肯定是维度。指标总是数字。因此，任何你使用文本的地方——页面的类别或其他点击的类别、用户或会话的标签或标识符——都必须是维度。\n\
  \n那么，你可能会想，反过来是否成立：如果它是数字，就一定是指标吗？这需要多思考一下。指标总是数字（整数、货币值或时间长度），但并非所有数字都必须是指标。\n\n\
  要寻找示例，请查看 GA 中的内置维度列表。你会发现其中一些是数字：`Page Depth`（会话期间发生的页面浏览量）、`Day of Week`（0 到 6，对应周日到周六）等等。这是怎么回事？\n\
  \n在某些情况下，数字只是某物的标签。例如，`Day of Week` 维度就是这种情况：数字 0 到 6 只是周日到周六的标签，而不是任何类型的度量值，将它们加起来是毫无意义的。\n\
  \n在其他情况下，例如 `Page Depth`，这些数字是基于度量值的。已经有度量标准来衡量“有多少次页面浏览？”——那个指标就是 `Pageviews`！既然已经有了指标，为什么还需要一个维度呢？\n\
  \n要理解这背后的逻辑，请记住维度用于对点击、会话、用户或产品进行分类或分组。`Page Depth` 维度则提供了一种方式来说明“向我展示恰好有 1 次页面浏览量的所有会话的指标”（或者\
  \ 2 次、3 次等）。维度用作报告的行，而指标则填充列。如果你想查看某个类别列表中的指标，那么该类别就是维度。\n\n![A978-1-4842-0265-4_11_Figa_HTML.jpg](img/A978-1-4842-0265-4_11_Figa_HTML.jpg)\n\
  \n此外，请记住，指标会在点击、会话、用户等层面上进行汇总，而维度仅仅是标签。\n\n在考虑为你自己的网站创建所需的自定义维度和指标时，请思考你希望报告看起来是什么样的。行标签是维度；列的值是指标。\n\
  \n\n\n### 在 GA 中访问自定义维度和指标\n\n将数据发送到自定义维度或指标后，有几种不同的方式可以在 GA 报告中访问这些信息。在大多数标准报告中，自定义维度可用作**次级维度**（见图\
  \ 11-1）。\n\n![A978-1-4842-0265-4_11_Fig1_HTML.jpg](img/A978-1-4842-0265-4_11_Fig1_HTML.jpg)\n\
  \n图 11-1. 在报告的次级维度下拉菜单中可使用自定义维度\n\n您还可以在自定义报告和仪表板中使用自定义维度和指标（见图 11-2）。\n\n![A978-1-4842-0265-4_11_Fig2_HTML.jpg](img/A978-1-4842-0265-4_11_Fig2_HTML.jpg)\n\
  \n图 11-2. 自定义报告中的自定义维度和指标\n\n自定义报告是访问这些自定义数据最灵活且最有用的方式。（自定义维度和指标也可在`BigQuery`及报告\
  \ API 的 GA 数据中使用；详见补充章节和附录。）\n\n## 设置自定义维度和指标\n\n现在您已经了解了为何要使用自定义维度和指标，接下来我们来看看在\
  \ GA 和 GTM 中实施它们的流程。在自定义维度或指标中开始发送数据需要三个步骤：\n\n首先，您需要在 GA 中创建并标记自定义维度或指标，以存储数据。其次，您需要从网站内容或其他元数据中实际生成要使用的数据（通常是将数据放入\
  \ GTM 的数据层中）。最后，您需要通过 GTM 中的 GA 代码将自定义指标或维度随此数据一起发送到 GA。\n\n以下各节将介绍这一过程，从一个相对简单的示例开始。假设您网站的用户可以注册“爱丽丝仙境度假村疯帽匠俱乐部”，注册后可享受特别优惠和公园门票折扣。注册时，他们需要指定偏好的公园位置，这有助于您精准推送优惠信息。您希望在\
  \ GA 中记录此信息。\n\n在开始之前，您需要问自己几个问题：\n\n- **这是维度还是指标？** 这是维度，因为它是各类别（疯帽匠俱乐部会员的公园位置）的标签。您希望将这些标签用作报告中的行，例如图\
  \ 11-3 所示的内容。\n\n  ![A978-1-4842-0265-4_11_Fig3_HTML.jpg](img/A978-1-4842-0265-4_11_Fig3_HTML.jpg)\n\
  \n  图 11-3. 作为维度的疯帽匠俱乐部位置\n\n- **作用范围是什么？** 由于疯帽匠俱乐部位置在用户每次回访时都适用于同一用户，因此您希望作用范围设为“用户”。GA\
  \ 会将此值应用于用户使用同一 Cookie 回访的每次会话。\n- **数据从何而来？** 您必须已经拥有这些数据！网站（用户注册疯帽匠俱乐部的地方）背后关联着某个数据库或应用程序，当用户注册或登录时，您可以查找该信息。稍后我们将详细探讨这一点，但此问题的答案始终取决于您网站的特定平台和工具，因为数据最终来自某些现有信息。\n\
  \n### 在 GA 中创建自定义维度或指标\n\n创建自定义维度或指标时，您需要选择名称，该名称将作为维度或指标的标签显示在 GA 报告中。您希望名称具有描述性，便于使用数据的人员理解。由于\
  \ GA 中所有其他字段名称均采用首字母大写格式，建议您也采用相同格式。在本示例中，您可将维度命名为“疯帽匠俱乐部位置”。\n\n**在 GA 中创建自定义维度或指标**\n\
  \n您将使用疯帽匠俱乐部位置示例，在 GA 中添加一个自定义维度。\n\n在 GA 的管理区域中，选择相应的帐号、媒体资源和数据视图后，点击中间列的**自定义定义**\
  \ ➤ **自定义维度**（或**自定义指标**），查看媒体资源的自定义维度。点击**新建**按钮添加新的自定义维度。输入自定义维度（或指标）的名称：“疯帽匠俱乐部位置”。\n\
  \n![A978-1-4842-0265-4_11_Figb_HTML.jpg](img/A978-1-4842-0265-4_11_Figb_HTML.jpg)\n\
  \n- 从下拉菜单中选择与维度或指标相适应的作用范围。对于疯帽匠俱乐部位置，您应选择“用户”作用范围（如前所述）。\n- （仅限指标）选择自定义指标的格式类型：整数、货币或时间。\n\
  - （仅限指标）输入可选的*最小值*和*最大值*。GA 将忽略超出此范围的值。这有助于防止意外出现的异常值（例如误算的 1000 亿美元货币值）压垮自定义指标的总计数据。\n\
  - 勾选复选框以激活维度或指标。（取消勾选将停用维度或指标，并停止收集数据。）\n- 点击**创建**按钮创建自定义维度或指标。\n\n每个自定义维度或指标都会分配一个从\
  \ 1 到 20 的特定索引编号。请记下您所创建的维度或指标的索引编号，后续流程中您需要用到它来填写值。与目标一样，自定义维度和指标无法删除，只能开启或关闭。但如果您需要重复使用某个特定编号，可以对其进行重命名。\n\
  \n\n\n### 生成自定义数据\n\n现在，你已经设置了自定义维度的名称以及发送数据的范围，接下来你需要处理更困难的部分：找到要发送的数据。\n\n你需要已经开始收集想要发送到\
  \ GA 的信息，然后以某种方式使其可用。例如，如果你想发送描述用户性别和年龄的信息，逻辑上你需要首先了解他们的性别和年龄——GA 和 GTM 无法自动为你创建这些数据！\n\
  \n收集这类数据的方法有多种，但大致可分为两类：\n\n*   从内部数据库提取信息，例如包含页面和内容信息的内容管理系统、用于存储登录网站用户信息的用户数据库，或者包含产品数据的电子商务系统。\n\
  *   从用户处收集信息，既可以通过表单直接获取，也可以通过用户在网站上的行为间接收集。\n\n**注意**\n\n在本章中，你将考虑如何直接从网站填充自定义维度和指标。也可以使用\
  \ GA 的数据导入功能，通过批量导入一组值并将其与 GA 字段关联，来填充某些维度和指标（包括自定义维度和指标）的值（详情请参见第 12 章）。\n\n使用与网站相连系统中已有的信息是更常见的选择，因此我们先考虑这种情况。（你可以使用\
  \ GTM 的表单触发器来捕获表单字段的值；后续示例中会详细说明。）\n\n无论数据来源如何，你都需要弄清楚如何将其传递到网站代码中，以便 GTM 能够读取。有时，这些数据可能已经存在于网站上。例如，假设一个博客或新闻网站希望随每篇文章传递内容元数据，如发布日期、作者或标签。通常，这些信息已经存在于内容管理系统中，可以插入到网站模板中。\n\
  \n有时，检索这些信息会稍微复杂一些。例如，当用户登录时，你可能拥有一个包含用户各种信息的用户数据库，比如用户的联系方式、他们的“疯帽子俱乐部”状态、首选城市、帽子尺码以及你所知道的关于他们的一切。这些信息仅在用户登录并且你能将其与个人信息匹配时才能访问。\n\
  \n**提示**\n\n考虑用一些方式激励用户登录你的网站！这能提供更多关于网站受众的信息，并允许更频繁地传递自定义信息。此外，如果你正确配置了用户 ID 视图（见第\
  \ 10 章），已登录用户还能实现跨设备跟踪。\n\n如果你掌握了这些信息，那么有一种相对简单的方法可以将它们传递给 GTM：数据层。当然，访问该值并将其插入数据层的具体方式取决于你网站的特定工具和平台。\n\
  \n### 使用数据层\n\n本书中你已经多次使用数据层声明（在页面的 GTM 容器之前）向 GTM 提供信息。对于“疯帽子俱乐部位置”信息，你也可以这样做：\n\
  \n```\ndataLayer = [{\n    'hatterClub': 'Schenectady, NY'\n}];\n```\n\n该值（此示例中的\
  \ Schenectady, NY）是基于特定用户选择的其最喜欢的公园地点插入的。\n\n你可以继续向数据层添加任何你想作为自定义维度或指标传递给 GA 的信息。在\
  \ GTM 中，你可以简单地使用数据层变量来检索这些值。\n\n根据你的网站，可能还有其他方法可以找到所需的值，例如，如果数据出现在页面内容中，可以使用 DOM\
  \ 元素变量。然而，使用数据层变量可以确保网站的其他更改不会影响你的跟踪设置，并且确保值在 GTM 加载时立即可用。与本书中讨论的许多其他变量一样，使用数据层为\
  \ GTM 组织信息总是比依赖页面内容更安全、更可靠。\n\n**注意**\n\n对于产品范围内的维度或指标，请将这些指标包含在已添加到数据层的电子商务数据中的产品对象内，使用类似\
  \ `dimensionXX` 或 `metricXX` 的名称，其中 `XX` 是维度的索引编号：例如 `'dimension2': 'blue'`。由于你已经设置了\
  \ GTM 使用数据层来填充电子商务值，它将自动捕获这些值（关于在数据层中包含电子商务数据的详细信息，请参见第 7 章）。\n\n\n\n### 向 GA 发送自定义信息\n\
  \n一旦在数据层中获得了所需的值，就可以使用在 GTM 中设置的代码将这些值相对简单地传递给 GA。自定义维度和指标会随现有匹配一起发送，因此您可以将其添加到现有代码（例如网页浏览或事件代码）中。您只需找到一个已发送至\
  \ GA 的匹配，然后“搭个便车”即可。\n\n根据维度或指标的范围，您可能希望将其包含在所有匹配（代码）中，或仅包含在部分匹配中。对于匹配级维度或指标，您只希望将其包含在适当类型的匹配中，因此可能仅限定于某些代码。例如，文章发布日期的自定义维度可能仅适用于网页浏览（文章），而不适用于事件。\n\
  \n对于会话级或用户级维度，您只需在会话期间发送一次该值，或为用户发送一次即可。例如，对于“疯帽匠俱乐部”地点变量，您只需在用户首次注册“疯帽匠俱乐部”时设置此值。但在许多情况下，您希望再次发送该值（例如，用户每次登录时，甚至在每个页面上）。这有助于在用户切换设备或浏览器、清除\
  \ Cookie 或值发生更改时，强化该值的记录。\n\n如果您为会话级或用户级维度多次指定值，则该会话以最后一个值为准。（先前会话的值保持不变。）\n\n###\
  \ 从数据层发送自定义信息\n\n让我们从数据层获取“疯帽匠俱乐部”状态信息，并将其插入到 GTM 中的 GA 代码中。\n\n首先，您需要创建一个变量来从数据层捕获值。\n\
  \n在 GTM 的“变量”部分，选择“新建”按钮以创建新的用户定义变量。选择“数据层变量”作为变量类型，然后选择“继续”。在“数据层变量名称”中，输入您用于数据层条目的名称（在示例中，它是\
  \ `hatterClub`）。选择“创建变量”以保存该变量。为其命名：“疯帽匠俱乐部地点”。\n\n现在，您需要修改 GTM 中的 GA 代码，以传递此变量的值。在本例中，您只需将该值包含在基本的网页浏览代码中。只要数据层值出现在页面上，您就会将此自定义维度随同该网页浏览一起发送。\n\
  \n在 GTM 的“代码”部分，选择“GA – 网页浏览”代码并对其进行编辑。点击“配置代码”以更改代码配置。在“更多设置” ➤ “自定义维度”下，点击“添加自定义维度”按钮以添加新的自定义维度。填入与您之前在\
  \ GA 中创建的自定义维度相对应的索引号。对于“维度值”字段，使用您在步骤 1-4 中创建的 `{{疯帽匠俱乐部地点}}` 变量（见下方截图）。\n\n![A978-1-4842-0265-4_11_Figc_HTML.jpg](img/A978-1-4842-0265-4_11_Figc_HTML.jpg)\n\
  \n选择“保存代码”以保存对代码的更改。\n\n您需要测试然后发布新版本的容器，这些数据才会显示在 GA 中。与往常一样，您可以使用 GTM 调试面板或控制台中的\
  \ GA 调试模式来验证其是否正常工作。\n\n一旦这些更改发布到网站上，您将能够在自定义报告中，或通过在标准报告中使用次级维度，开始看到自定义维度或指标的数据。（请记住，没有内置的标准报告会自动包含自定义维度或指标，因此您必须创建一个才能看到这些值。）\n\
  \n### 其他示例\n\n上一节探讨了一个自定义维度的基本示例。现在，让我们再看几个示例来探索其可能性：一个基于表单输入的自定义维度，以及一个基于交互的自定义指标。\n\
  \n#### 来自表单输入的自定义维度\n\n除了使用数据层中来自其他系统的数据外，收集自定义维度数据的另一种方法是从用户填写的表单中抓取一些信息。这些信息可能只提供一次，在表单提交后您就无法再获取了。\n\
  \n假设您的网站上有一个联系表单。您可能会询问用户的性别，或者要求他们将自己归入某个特定类别，例如“教师”、“学生”或“家长”。如果您能在表单提交时截取这些数据，就有可能获取他们填写的这些字段，并将其存储为用户级自定义维度。\n\
  \n第 6 章 讨论了使用 GTM 的表单触发器来监听特定表单的提交。从表单中捕获自定义维度是表单触发器的另一个绝佳应用，但这需要您更深入地挖掘。\n\n与点击触发器（在第\
  \ 5 章中讨论过）类似，表单触发器会向数据层添加关于已提交表单的信息。它看起来像下面这样：\n\n```\n{\n    event: \"gtm.formSubmit\"\
  ,\n    gtm.element: form#contact-form,\n    gtm.elementClasses: \"\",\n    gtm.elementId:\
  \ \"contact-form\",\n    gtm.elementTarget: \"\",\n    gtm.elementUrl: \"http://aliceswonderlandresorts.com/contact-thankyou\"\
  \n}\n```\n\n您已经学习了如何获取表单的 ID 和类，它们的工作方式与点击完全相同。真正令人兴奋的是，GTM 会将整个 DOM 对象作为 `gtm.element`\
  \ 添加到数据层。这意味着，该表单的所有内容现在都可以在 GTM 内部访问，包括所有表单字段及其在提交时的当前值。\n\n访问各个部分只需导航表单的 DOM 对象以找到您想要的字段即可。对于表单字段，DOM\
  \ 结构其实非常简单：每个表单字段都按照其在表单中出现的顺序嵌套在 `gtm.element` 下，从 0 开始按数字编号。在每个表单字段下，都有一个名为 `value`\
  \ 的属性，它将是表单字段在提交时的值。（您可以使用 Web 浏览器的工具探索数据层中的 DOM 元素；图 11-4 是 Chrome 浏览器中的示例。）\n\n\
  ![A978-1-4842-0265-4_11_Fig4_HTML.jpg](img/A978-1-4842-0265-4_11_Fig4_HTML.jpg)\n\
  \n**图 11-4.** 使用 Chrome 的 JavaScript 控制台在数据层中查看表单字段（在本例中，编号为 0-3）\n\n要获取此信息并将其放入\
  \ GTM，您需要找到您关心的特定表单字段，然后使用数据层变量从数据层中获取其值。数据层使用句点来表示嵌套值，因此上述路径在数据层变量中将如下所示：\n\n`gtm.element.0.value`\n\
  \n这个数据层变量，当与表单触发器结合使用时，将返回刚提交表单中第一个字段的值。（对于非第一个字段，请使用不同的数字。）\n\n现在，您可以像之前使用在数据层中显式提供的值的场景一样，使用该变量来填充自定义维度。\n\
  \n**注意：** 此示例假设已存在一个使用该表单触发器的代码。请记住，自定义维度或指标始终需要随某个匹配（如网页浏览或事件）一起发送。如果当前没有代码由此表单触发，您可以简单地添加一个\
  \ GA 事件代码，使其在表单提交时触发，以包含该自定义维度。（更多关于表单触发器的信息，请参见第 6 章。）\n\n\n\n### 来自互动的自定义指标\n\n\
  你也可以根据你通过 `pageview` 或事件衡量的其他互动数量来创建自定义指标。\n\n为什么要用自定义指标重复统计事件或 `pageview` 的数量？同样，只是为了简化报告。尽管\
  \ GA 中有诸如 `pageview` 总数或事件总数之类的指标，但你需要采用创造性的过滤或细分才能获得特定类型的 `pageview` 或事件的数量。如果你只是想要一列显示特定类型\
  \ `pageview` 或事件数量的数据，该怎么办？自定义指标就是完美的解决方案。\n\n例如，假设你正在使用事件来跟踪网站上的下载。你可以为“下载”创建一个自定义指标，并轻松地在报告中将其显示为一列数据。\n\
  \n#### 从互动创建自定义指标\n\n你首先需要按照本章前面的说明在 GA 中创建一个自定义指标。将其命名为“下载”，并选择“整数”作为格式化类型。记下自定义指标的索引；你将在后续步骤中用到它。\n\
  \n你还需要在 GTM 中已经有一个带有用于跟踪下载的事件的代码（参见第 5 章）。\n\n在 GTM 的“代码”部分，选择用于下载的 GA 事件跟踪代码，然后选择“编辑”。点击**配置代码**以修改代码配置。在**更多设置**\
  \ ➤ **自定义指标**下，点击**添加自定义指标**按钮来添加一个新的自定义指标。填入与“下载”相对应的自定义指标的索引号。对于**指标值**字段，直接使用值\
  \ `1`。选择**保存代码**以保存对代码的更改。\n\n当然，你需要在 GTM 中进行测试和发布，这些更改才会生效。\n\n发布后，每当文件被下载且事件被发送到\
  \ GA 时，“下载”指标的计数就会增加 `1`。\n\n## 总结\n\n-   自定义维度和指标允许你向 GA 发送自定义信息，用于报告和分析。维度是类别标签，通常表示为报告中的行。指标是度量值（计数、货币金额或时间长度），通常表示为报告中的列。\n\
  -   你可以在 GA 中为自定义维度或指标指定名称和作用范围。作用范围会影响该维度或指标在 GA 中关联的数据。自定义维度和指标是在媒体资源级别配置的，每个媒体资源各有\
  \ 20 个配额。\n-   在 GTM 的代码中插入的自定义维度和指标的值，可以来自网站服务器（通过数据层），也可以来自页面及用户与页面的互动。GTM 的变量功能可以轻松获取这些值。\n\
  \n## 脚注\n\n1\n\n服务条款可能因您所在的国家/地区而异；请在此处查找您所在国家/地区和语言版本的条款：[`http://www.google.com/analytics/terms/`](http://www.google.com/analytics/terms/)\n\
  \n"
- '# 第三部分：从其他来源收集数据


  '
- "# 12. 向 Google Analytics 导入数据\n\n> 爱丽丝觉得这根本不能证明什么；不过，她还是继续说：“那你怎么知道自己疯了？”猫说：“首先，狗没有疯。你同意这个观点吗？”“我想是的，”爱丽丝说。“那好，”猫接着说，“你看，狗生气时会咆哮，高兴时会摇尾巴。而我呢，高兴时咆哮，生气时摇尾巴。所以我疯了。”“我认为那是咕噜声，不是咆哮，”爱丽丝说。\
  \ ——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\n在第 11 章中，你学习了如何使用 GA 中的自定义维度和指标来填充关于用户及其行为的附加数据。你将这些自定义维度和指标作为附加数据，随同\
  \ GTM 中的一次匹配一起发送。GA 提供了另一种填充这些值的方法，即通过其数据导入功能。数据导入允许你使用直接上传到 GA 的文件来填充数据。这在以下情况下非常有用：\n\
  \n-   数据在匹配发生时无法从网站获取——例如，因为它存储在一个单独的系统中。你可以从此类系统将数据上传到 GA。\n-   数据量庞大，直接包含在站点上会带来开发负担，或会超出匹配中包含数据的字符限制。你可以减少从站点发送的数据量，只发送某些关键维度，然后再填充其他值。\n\
  -   数据比较敏感，你不希望将其包含在站点上，例如某些类型的用户或产品数据。\n\n你将在下一节详细查看数据导入的过程，然后研究几种可用的数据导入类型及其应用。\n\
  \n## 数据导入流程\n\n数据导入的基本流程如下：\n\n1.  创建一个与 GA 中某个媒体资源关联的数据集，以配置将要导入的维度和指标。\n2.  上传一个包含待导入数据的文本文件。GA\
  \ 接收该文件并将其处理为报告中的数据。\n3.  根据需要更新数据集，以便后续更新数据。\n\n在本章后面，你将了解 GA 中可能的具体数据导入类型，但每种类型的基本流程都是相同的。让我们逐步了解。\n\
  \n### 创建数据集\n\n在 GA 媒体资源中创建数据集可以配置将要导入的维度和指标，并为用于上传数据的文本文件创建一种架构。数据集充当上传文件的容器，并控制导入的数据如何应用于\
  \ GA。\n\nGA 中可用的不同类型数据集，每种都支持一个或多个键（GA 中已有一个值，导入数据将与之关联的维度）以及一个或多个导入的维度或指标（将通过导入添加的数据）。\n\
  \n#### 设置用于导入的数据集\n\n数据集是在 GA 的某个媒体资源中创建的。\n\n1.  在 GA 的管理区域中，选择合适的帐号、媒体资源和数据视图后，选择中间列的**数据导入**，以查看该媒体资源的数据集。选择**新建**按钮以添加新的数据集。\n\
  2.  为数据集选择一种类型（参见下面的截图；更多关于类型的信息将在本章后面介绍）。选择**下一步**按钮。\n\n![A978-1-4842-0265-4_12_Figa_HTML.jpg](img/A978-1-4842-0265-4_12_Figa_HTML.jpg)\n\
  \n3.  为数据集输入一个名称，以描述要导入的数据。\n4.  （仅针对某些数据导入类型）选择该媒体资源内将显示导入数据的数据视图。\n5.  为导入选择维度和指标（参见下面的截图）。根据所选的数据导入类型，键维度和导入数据的选项会有所不同。\n\
  \n![A978-1-4842-0265-4_12_Figb_HTML.jpg](img/A978-1-4842-0265-4_12_Figb_HTML.jpg)\n\
  \n6.  （仅针对某些数据导入类型）选择覆盖数据的选项（我们稍后会在介绍具体数据类型时讨论这一点）。\n7.  选择**保存**按钮。\n\n保存数据集后，GA\
  \ 会显示两个按钮，分别链接到上传数据的架构，以及获取用于 API 的 ID。我们稍后会介绍如何使用它们。\n\nGA 允许每个媒体资源最多创建 50 个数据集。上传的数量和大小还有其他限制。GA\
  \ Premium 订阅用户拥有更高的限额。\n\n一旦数据集创建完成，你就可以上传数据用于导入了。\n\n\n\n### 数据导入架构\n\n用于向 GA 导入数据的文本文件采用\
  \ CSV（逗号分隔值）格式，这是一种用于表示电子表格行和列的文本文件格式。CSV 文件可以轻松使用 Google Sheets 或 Microsoft Excel\
  \ 等电子表格应用程序生成，并且作为许多应用程序的导出格式也得到广泛支持。\n\n如您之前所见，在创建数据集时，GA 会提供一个可供下载的示例架构文件。架构文件包含描述数据集中维度和指标的标头，并显示相应的文件格式。（请注意，数据集架构中使用的标头与\
  \ GA 的 API 中维度和指标的标签方式相匹配；更多详细信息请参见附录。）以下是一个示例上传文件，其中包含几行待导入的数据：\n\n```\nga:userId,ga:dimension3,ga:dimension2\n\
  alice0214,Student,7.5\nmadhatter13,Milliner,35\nqueenofhearts<3,Royalty,65\n```\n\
  \n只要您以此格式提供数据，GA 并不关心数据来源或创建工具。数据可以手动汇编、从其他系统或工具的导出数据重新格式化，或由自动化数据导入的脚本生成。\n\n###\
  \ 上传数据\n\n数据导入文件可以手动通过管理区域上传到 GA，也可以通过 API 实现自动化。本节将介绍手动流程。有关 GA API 的更多详细信息，请参见附录。\n\
  \n#### 将数据上传到数据集\n\n让我们来看看如何手动上传数据以供 GA 导入。假设您已经拥有数据文件，并且已按照前面所述的架构正确格式化。\n\n在 GA\
  \ 的管理区域中，选择相应的帐户、媒体资源和数据视图后，点击中间列的“数据导入”即可查看该媒体资源的数据集。在数据集列表中，为您要上传的数据集选择右侧的“管理上传”链接。GA\
  \ 会显示之前上传的文件列表（参见以下截图）。\n\n![A978-1-4842-0265-4_12_Figc_HTML.jpg](img/A978-1-4842-0265-4_12_Figc_HTML.jpg)\n\
  \n选择列表顶部的“上传文件”按钮。从计算机中选择要上传的文件，然后点击“上传”按钮。\n\n文件将被上传，状态显示为“待处理”，直到 GA 完全处理完该文件。如果没有格式错误，状态将更新为“已完成”。此时，GA\
  \ 将开始应用数据导入。\n\n### 更新数据集\n\n上传后，数据将应用于后续的数据。某些类型的数据导入在首次上传后可能很少需要更新，对于这些情况，前面描述的手动上传流程是一个简单的解决方案。\n\
  \n然而，其他类型的数据导入可能需要定期更新——对于某些可能频繁变化的数据，甚至可能需要每天更新。对于此类应用，手动上传流程可能较为繁琐，因此建议使用 API（参见附录）。\n\
  \n> **提示**  \n> 目前已存在许多现成的工具，可使用 GA API 从其他系统导入数据，例如来自广告平台的费用数据。您应寻找能够帮助您自动化这些重复性任务的工具。\n\
  \n更新或删除数据集通常仅影响后续数据，这与 GA 管理区域中的所有更改一致。历史数据不受影响。不同类型的数据导入受更新的影响方式略有不同；详细信息请参见下一节按类型划分的内容。\n\
  \n## 数据导入类型\n\nGoogle Analytics 提供三种基本的数据导入类别：点击数据（将点击直接导入 GA）、扩展数据（导入多种维度和指标值，以应用于\
  \ GA 中的现有点击）以及汇总数据（导入已按特定维度聚合的数据的指标）。您将在以下各节中了解每种类型的潜在用途。\n\n### 点击数据导入\n\n点击数据导入允许您直接将点击导入\
  \ GA。导入后，这些点击将与其他任何点击一样被处理，并根据应用于媒体资源数据视图的过滤器进行处理。仅支持一种类型的点击数据导入：电子商务交易的退款数据。\n\n\
  #### 退款数据\n\n退款数据用于导入电子商务交易的全部或部分退款。您可以使用电子商务或订单处理平台提供的数据，向 GA 添加关于网站上下文之外发生的退款的数据。一旦退款添加到\
  \ GA，相应的交易将被更新，以显示退款后的相应收入和产品。\n\n退款数据必须包含`交易 ID`维度。对于全额退款，仅需`交易 ID`。GA 中整个交易（包括所有产品）都将被退款。对于部分退款，有两种选择：\n\
  \n- 指定要退款的交易中的`产品 SKU`和`数量`。所有列出的产品将被退款，并从交易收入中扣除。\n- 指定要退款的`交易收入`金额。该部分交易收入将被退还，但交易中仍保留所有产品。\n\
  \n> **警告**  \n> 退款一旦导入 GA，将无法删除或修改。请谨慎操作，并先在测试媒体资源中测试退款数据，以确保在应用于生产数据之前了解该流程的工作原理。\n\
  \n### 扩展数据导入\n\n扩展数据导入允许您使用附加信息扩展 GA 中的现有点击。它们包含来自现有数据的一个或多个“键”维度值，以匹配导入的维度或指标值。这通常用于填充自定义维度或指标的值，但也可用于覆盖现有维度的值。\n\
  \n扩展数据导入发生在 GA 处理过程中，这意味着数据导入将在收集新点击时应用。您可以选择数据将出现在媒体资源的哪些数据视图中。由于数据在处理过程中被整合，如果您对数据集进行更改，这些更改将仅对后续数据生效，而不会影响历史数据。\n\
  \n> **注意**  \n> GA Premium 订阅用户能够指定数据导入是在处理时还是查询时进行，这意味着导入的数据可以应用于报告中的历史数据，并可随时更新。\n\
  \n扩展数据导入有六种不同的类型。让我们来看看每种类型的应用。\n\n#### 用户数据导入\n\n用户数据可以导入 GA，以增强关于单个用户的信息。您可以使用它从\
  \ CRM 或其他包含用户细分信息的系统中导入用户数据，例如人口统计信息、生命周期价值或购买信息等。¹\n\n第 11 章讨论了许多此类针对用户范围自定义维度的想法。用户数据导入的唯一区别在于，您只需在网站上传递单个维度来标识用户，然后在\
  \ GA 中稍后导入其余维度。\n\n用户数据可以根据`用户 ID`（参见第 10 章）或用户范围的自定义维度进行导入。导入的数据可以是用户范围的自定义维度。\n\
  \n\n\n#### 广告活动数据导入\n\n广告活动数据导入可用于填充来源、媒介和广告活动等与广告活动相关的维度。它使用一个名为 `Campaign ID`\
  \ 的关键维度，该维度可通过广告活动网址标记提供（请参见第 9 章）。\n\n广告活动数据导入可用于完成以下任一任务：\n\n*   简化广告活动网址标记，使您能够在广告活动网址中仅提供一个参数（`utm_id`），而不是为来源、媒介等分别提供各个参数（`utm_source`、`utm_medium`\
  \ 等）。随后，可以根据 `Campaign ID` 值导入完整的描述性维度集合。\n*   填充没有对应广告活动网址参数的广告活动相关字段，例如 `Ad Group`\
  \ 或 `Referral Path` 维度，或自定义维度。\n\n可导入的维度包括：`Medium`、`Source`、`Campaign`、`Ad Group`、`Ad\
  \ Content`、`Keyword`、`Referral Path`，或会话级自定义维度。\n\n#### 地理数据导入\n\n地理数据导入可用于利用 GA\
  \ 的地理数据创建自定义地理区域或分组。例如，在美国，您可能希望按县对城市进行分组，或将州划分为诸如“新英格兰”和“中西部”之类的区域。\n\n地理数据的关键维度可以是以下任意一项，按范围从大到小排列：\n\
  \n*   根据联合国 M.49 标准² 的次大陆代码。这些是与次大陆区域对应的数字代码，例如“西欧”或“加勒比海”。\n*   根据 ISO 3166-1 alpha-2\
  \ 标准³ 的国家代码。这些是与国家对应的两个字母代码，例如美国的“US”或英国的“UK”。\n*   来自 Google 地理标准 ID 列表⁴ 的区域 ID。这些是\
  \ Google 广告定位中使用的地理划分，但它们必须对应于 GA 中 `Region` 维度的某个区域。GA 中的区域是国家以下的地理划分，例如美国的州、加拿大的省等。\n\
  *   来自 Google 地理标准 ID 列表的城市 ID。这些 ID 必须对应于 GA 中 `City` 维度的某个位置。\n\n导入的值可以是任何会话级自定义维度。\n\
  \n**提示**\n\n您可以在 GA 自定义报表的可用维度列表中找到 `Subcontinent Code`、`Country Code`、`Region ID`\
  \ 和 `City ID`。如果不确定使用的值是否正确，可以创建一个自定义报表进行检查。\n\n#### 内容数据导入\n\n内容数据导入可用于基于 `Page`（网址）导入匹配范围级自定义维度。第\
  \ 11 章讨论了许多潜在的匹配范围级自定义维度，例如页面的作者、发布日期等。内容数据导入提供了将这些数据带入 GA 的另一种方法。\n\n#### 产品数据导入\n\
  \n产品数据导入可用于基于 `Product SKU` 导入产品相关数据。导入的数据可包括产品维度，如 `Product Category` 或 `Product\
  \ Brand`，或产品范围级自定义维度或指标。产品数据导入对于以下情况很有用：\n\n*   简化网站的电子商务跟踪。您无需在数据层中包含电子商务数据中关于产品的所有数据（如第\
  \ 7 章所述），只需包含 SKU（以及数量和价格），然后在之后使用导入功能填充额外的描述性字段。\n*   导入过于敏感而不适合直接包含在网站数据中的维度或指标，例如产品的利润率。\n\
  \n#### 自定义数据导入\n\n自定义数据导入可用于导入维度与指标之间的其他关联（通常是自定义维度和指标，但也支持某些内置维度）。作为关键维度，您可以从各种内置维度以及任何范围的自定义维度中选择最多两个维度。导入的值也可以是各种内置维度以及任何范围的自定义维度或指标。\n\
  \n### 汇总数据导入\n\n汇总数据导入与扩展数据导入不同，因为它导入的是汇总度量的数据，而不是对应于单个匹配的数据。汇总数据导入在处理后应用于 GA 的报表，因此可以在稍后时间点进行更新，以追溯性地应用数据。\n\
  \n唯一支持的用于导入的汇总数据类型是：广告和营销活动的费用数据。\n\n#### 费用数据导入\n\n第 9 章讨论了 GA 与 AdWords 和 DoubleClick\
  \ 平台的集成，以导入在这些平台上投放广告的展示次数、点击次数和费用数据。\n\n类似地，您可能希望导入其他网络上投放广告的数据。尽管其他广告网络和平台没有与\
  \ GA 自动集成，但您可以使用费用数据导入来引入这些数据。\n\n费用数据导入至少必须包含以下内容：\n\n*   `Medium` 和 `Source` 维度。\n\
  *   至少一个指标：`Impressions`、`Clicks` 或 `Cost`。\n*   数据适用的日期。\n\n此外，您可以通过包含更多维度（如 `Campaign`、`Ad\
  \ Group`、`Keyword` 等）来提高精确度。其他指标也根据这些数据计算得出，例如 `Cost per Click` 和 `Return on Ad\
  \ Spend`。\n\n创建费用数据导入集时，您可以选择新的数据上传是添加到该日期的任何现有数据中（将展示次数、点击次数和费用相加），还是覆盖现有数据。\n\n\
  ## 总结\n\n*   GA 支持基于一个或多个已在 GA 中具有值的关键维度，批量导入维度和指标值。这可用于将 GA 数据与其他系统关联，减少需要从网站发送的数据量，或保护敏感信息不在网站上暴露。\n\
  *   数据导入的工作原理是创建与 GA 中某个媒体资源关联的数据集，然后将文件上传到该数据集。如果数据频繁更新，上传可以自动化。\n*   GA 支持多种不同类型的数据导入，用于电子商务交易退款和产品数据、用户数据、广告活动标记和费用数据、地理数据、内容数据以及自定义数据。\n\
  \n**脚注**\n\n¹ 请记住，GA 中不允许出现个人身份信息。更多信息请参见第 10 章和第 11 章。\n\n² [`https://en.wikipedia.org/wiki/UN_M.49`](https://en.wikipedia.org/wiki/UN_M.49)\n\
  \n³ [`https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2`](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)\n\
  \n⁴ [`https://developers.google.com/analytics/devguides/collection/protocol/v1/geoid`](https://developers.google.com/analytics/devguides/collection/protocol/v1/geoid)\n\
  \n\n\n"
- "# 13. 从移动应用收集数据\n\n> 当兔子真的从马甲口袋里掏出一块怀表，看了一眼，然后匆匆赶路时，爱丽丝猛地站了起来，因为她脑子里闪过一个念头：她从未见过一只兔子穿着马甲口袋，或者从里面掏出怀表。——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\
  \n到目前为止，本书的重点是使用 `GTM` 来实施 `GA`（以及可能的其他标签）以衡量网站。但网站并非客户与我们互动的唯一方式。另一个重要渠道是使用适用于移动设备的原生应用——那种可以下载并安装在手机或平板电脑上的应用，而不是在浏览器中访问网站。\n\
  \n`GTM` 和 `GA` 也可用于收集移动应用的数据——具体来说，就是来自 Android 和 iOS 应用的数据（在任何使用这些操作系统的设备上）。使用这些工具进行衡量有许多优势：\n\
  \n-   一个统一的报告工具（`GA`），用于网站和应用，使用您已熟悉的所有数据清理和报告功能。\n-   一个统一的部署工具（`GTM`），用于网站和应用，使用您已熟悉的结构和发布机制。\n\
  -   一种在已发布的应用版本之间进行更新的方法。（通常，应用必须通过应用商店的发布流程进行更新，这可能很繁琐。）\n\n当然，`GA` 中收集的数据以及您在\
  \ `GTM` 中收集这些数据的方式存在一些差异，因为我们在讨论与网站不同的环境。本章将探讨这些差异、可以使用 `GA` 和 `GTM` 的平台，以及通过其软件开发工具包（`SDK`）在移动应用中部署这些工具的过程。\n\
  \n**注意**  \n请记住，本章并非旨在教您如何开发 Android 或 iOS 应用。虽然 `GTM` 中针对应用的实施与网站类似，但应用代码中的实施最好交给有能力的\
  \ Android 或 iOS 开发者来完成。本章旨在为您提供必要的知识，以便与开发者沟通，从而实现成功的实施。\n\n## 适用于移动应用的 GA\n\n在您了解如何收集移动应用的数据之前，我们先来分析一下将在\
  \ `GA` 中收集的数据本身。这些数据与网站数据相似，但存在一些差异：\n\n-   移动应用数据不包含 `pageview` 匹配类型，而是包含 `screenviews`，它代表应用内屏幕的加载。`screenviews`\
  \ 通过一个名为 `Screen Name`（屏幕名称）的维度来标识（而非包含 `pageviews` URL 的 `Page` 维度）。\n-   移动应用还支持一种用于异常的额外匹配类型；即您希望捕获的应用内发生的错误和崩溃。\n\
  -   移动应用中提供了额外的维度，例如 `Application Name`（应用名称）、`Application ID`（应用 ID）和 `Application\
  \ Version`（应用版本），而其他特定于网站的维度（如 `Hostname`（主机名））可能不适用于应用数据。\n-   与网站数据一样，移动应用中也提供了\
  \ `event`（事件）和 `social`（社交）互动的匹配类型（参见第 5 章），用于跟踪视频播放、按钮点击或社交媒体互动等交互行为。\n-   与网站数据一样，移动应用中也提供了电子商务和增强型电子商务功能（参见第\
  \ 7 章），用于跟踪应用内购买。\n-   广告系列在应用中的工作方式有所不同。广告系列可以通过两种不同的方式使用：\n    -   跟踪应用的最初安装来源——即用户如何到达\
  \ Google Play 商店（用于 Android）或 iTunes 商店（用于 iOS）以下载并安装该应用。\n    -   跟踪通过 URL 启动应用——即当网络浏览器中的链接启动用户的应用时。\n\
  \n由于这些差异，您可以在 `GA` 中创建特定于应用的媒体资源和视图，从而重新排列默认报告以更好地反映应用数据。\n\n### 应用媒体资源和视图\n\n当在\
  \ `GA` 中创建新的媒体资源或视图时（参见第 8 章），您可以选择该媒体资源或视图是用于应用还是网站（见图 13-1）。\n\n![A978-1-4842-0265-4_13_Fig1_HTML.jpg](img/A978-1-4842-0265-4_13_Fig1_HTML.jpg)\n\
  \n**图 13-1.** 在 `GA` 中创建媒体资源或视图时决定跟踪类型\n\n此选择会影响视图中可用报告的结构。（在创建媒体资源时做出此选择会影响随媒体资源一起创建的默认视图，但随后创建的视图可以用于网站或应用数据。）为移动应用选择视图会重新排列视图中的报告，以聚焦于应用数据（见图\
  \ 13-2）。\n\n![A978-1-4842-0265-4_13_Fig2_HTML.jpg](img/A978-1-4842-0265-4_13_Fig2_HTML.jpg)\n\
  \n**图 13-2.** `GA` 中的应用视图包含特定于应用的报告，例如“应用概览”报告\n\n例如，您会发现不再是 `行为` > `网站内容` > `所有页面`报告（侧重于\
  \ `pageviews`），而是拥有 `行为` > `屏幕`报告用于 `screenview` 数据。在 `获客` 报告中，您会发现专门针对 iTunes 和\
  \ Google Play 商店的报告。尽管应用的报告列表有所不同，但您会发现所有熟悉的 `GA` 报告功能仍然可用，例如细分、信息中心以及许多其他工具。\n\n\
  与网站数据一样，您可以使用视图和媒体资源设置来定制移动应用数据，包括创建目标（参见第 6 章）、使用过滤器和内容分组（参见第 8 章）等。\n\n#### 侧边栏：合并或分离网络和应用数据\n\
  \n请注意，可以将网站和移动应用数据包含在同一个媒体资源中。（需要时，可以通过过滤器将它们分开。）您应该合并移动应用数据还是将其分开？\n\n对于需要用户登录的网站和应用，您可以使用\
  \ `GA` 的 `User ID`（用户 ID）功能来关联用户跨这些平台的活动（参见第 10 章）。然而，合并移动应用和网站数据的一个缺点是，`GA` 不包含可以轻松合并内容数据（`pageviews`\
  \ 和 `screenviews`）的报告，这削弱了这种方法的优势。最终，选择权在您手中。您应该评估您的分析需求以及将这些类型的数据合并到 `GA` 中的实用性。\n\
  \nGoogle Analytics Premium 订阅者可以使用 `汇总媒体资源` 来合并来自不同媒体资源的数据，从而提供额外的灵活性。移动应用和网站数据可以保留在单独的媒体资源中，但可以在汇总媒体资源中合并以便一起分析。\n\
  \n其他合并数据的解决方案包括使用 `GA` API（参见附录）从媒体资源中提取数据，并在 `GA` 之外将它们合并到报告中。\n\n## 移动应用 SDK\n\
  \n`GTM` 拥有适用于 Android 和 iOS 平台的官方 `SDK`。此外，`GA` 还拥有适用于 Unity 游戏引擎的 `SDK`。\n\n**注意**\
  \  \n对于除拥有官方 `SDK` 之外的任何您想要跟踪的平台，都可以通过 `Measurement Protocol`（衡量协议）（参见第 14 章）将数据发送到\
  \ `Google Analytics`。\n\n\n\n### Android 与 iOS\n\nGTM SDK for Android 和 iOS 有许多相似之处。虽然它们的实现细节会有所不同（Android\
  \ 应用使用 Java，iOS 应用使用 Objective-C 或 Swift），但概念上它们都遵循相同的基本框架：\n\n- 应用中包含 GTM SDK。\n\
  \  - `Android 版 GTM SDK` 与 `Google Play Services SDK` 捆绑在一起，后者是一组用于 Google 服务（如\
  \ Google Drive、Google Maps 等）的 SDK 集合。`GTM SDK` 允许 Android 应用开发者在应用的 Java 代码中嵌入\
  \ GTM 容器，以便将事件和值推送到数据层。¹\n  - `iOS 版 GTM SDK` 可以加载到 iOS 应用中。可以使用 Objective-C 或 Swift\
  \ 代码将事件和值推送到数据层。²\n- 与网站每次加载时都会获取容器的新副本不同，移动应用会内置一个默认容器。应用可能在没有网络连接的设备上运行，因此如果应用启动时无法通过网络连接更新容器，内置一个默认容器对于跟踪功能至关重要。\n\
  - 应用中嵌入的代码会将事件和值推送到数据层。请注意，与网站每次页面加载都会重新创建数据层不同，应用中的数据层会持续整个会话期间。\n- 与网站一样，GTM 可以根据数据层事件触发标签。根据您在容器中设置的标签和触发器，数据会被发送到\
  \ GA（或其他工具的其他标签）。\n- 如前所述，应用可能在没有当前网络连接的设备上运行。`GTM` 会尝试向 GA 或其他工具发送匹配（`hit`），但如果网络不可用，它会将匹配加入队列以便稍后发送（对于长时间延迟，超过四小时的匹配可能不会被\
  \ GA 处理）。即使有网络连接，`GTM` 也会批量发送匹配，并按固定间隔调度以节省电量。\n\n本章稍后将详细介绍应用的 GTM 容器和数据层。\n\n###\
  \ Unity\n\n除了 iOS 和 Android，`Google Analytics` 还为 Unity 平台提供了 SDK。Unity 是一个游戏引擎，其中一组代码可以编译到多个平台的应用中。\n\
  \n虽然存在 GA SDK for Unity，但没有 GTM SDK。这意味着您无法通过 GTM 管理标签。相反，Unity 应用中的代码直接指定将屏幕视图（`screenview`）、事件（`event`）或异常（`exception`）数据发送到\
  \ GA（例如，类似于在网站的 JavaScript 中直接实现 GA）。³\n\n## 移动应用的 GTM 容器\n\n您可以通过账户概览屏幕创建新容器来为移动应用创建容器。创建容器时，`GTM`\
  \ 允许您选择容器是用于网站、Android 应用还是 iOS 应用（见图 13-3）。\n\n![A978-1-4842-0265-4_13_Fig3_HTML.jpg](img/A978-1-4842-0265-4_13_Fig3_HTML.jpg)\n\
  \nFigure 13-3. 创建容器时选择容器类型\n\n### 与网站容器的差异\n\n移动应用的 GTM 容器与网站容器的基本工作方式相同，包含标签、触发器和变量。然而，移动应用的可用选项和测试过程存在一些差异。我们来看一下。\n\
  \n#### 标签\n\n与 GTM 中的网站标签类似，移动应用也有许多内置标签以及自定义标签。这些标签包括：\n\n- 用于 GA、AdWords 和 DoubleClick\
  \ 的内置标签。这些标签的选项与网站相同。\n- 用于自定义跟踪像素的 `Custom Image` 标签。同样，此标签的选项与网站相同。\n- 一个 `Function\
  \ Call` 标签，可用于调用应用内的函数（必要时可包含参数）。\n\n请注意，与网站上的自定义 JavaScript 标签不同，自定义代码（Android\
  \ 的 Java，iOS 的 Objective-C 或 Swift）不能直接包含在标签中。但是，可以使用 `Function Call` 标签来调用已存在于应用中的函数。\n\
  \n#### 触发器\n\nGTM 移动应用容器中只有一种触发器，即 `Custom Event` 触发器。与网站一样，当 `event` 值被推送到数据层时，它会触发标签（示例请参见第\
  \ 5 章）。\n\n技巧\n\n与网站流量一样，您应该使用触发器（和阻止触发器）来分隔移动应用上的测试数据。具体来说，使用 `{{App Version Code}}`\
  \ 或 `{{Advertiser ID}}` 变量对于移动应用的测试触发器可能特别有用。\n\n\n\n### 变量\n\n移动应用容器包含了一些内置变量，可提供常用值。具体包括以下几类：\n\
  \n- 应用相关变量，包括应用 ID、名称、版本以及所使用的 GTM SDK 版本。\n- 与网站容器相同的实用变量，包括 GTM 容器 ID 和版本、来自数据层的自定义事件值以及随机数变量。此外，移动应用还提供了一个变量，用于指示用户是否已启用广告跟踪或已选择退出。（Android\
  \ 和 iOS 都提供了系统级的选项，允许用户选择退出兴趣定向广告。）\n- 设备相关变量，包括平台（Android 或 iOS）、操作系统版本、设备类型、语言、屏幕分辨率以及广告标识符。广告标识符是一种持久但可由用户重置的设备标识符（与永久的设备硬件标识符不同），Android\
  \ 和 iOS 都提供了该标识符用于跟踪设备。这个值——通常被称为“IDFA”或根据其在 iOS 中的名称称为“广告标识符”——取代了 Cookie（如同用于客户端\
  \ ID 的 GA Cookie）在移动应用设备识别中的作用。\n\n此外，你还可以创建以下类型的自定义变量：\n\n- 常量变量和数据层变量类型的工作方式与网站容器完全相同。\n\
  - 函数调用变量类型允许你调用应用内的函数并使用其返回值。\n- 值收集变量类型允许你指定一组可在应用中使用的键值对。\n- Google Analytics\
  \ 内容实验变量允许使用 GA 的内容实验功能⁴，在值收集变量的多组值之间进行切换。\n\n### 侧边栏：通过 GTM 提供应用内容\n\n与网站类似，移动应用中的\
  \ GTM 不仅可以提供跟踪功能（通过 GA 或 AdWords 转化等代码），还可以为应用提供实际内容或功能（通过变量值和自定义代码）。通常建议不要通过 GTM\
  \ 为网站提供内容或功能，原因如下：\n\n- 当存在其他选项（如内容管理系统、Web 服务器）可以动态地向网站提供此类数据时，使用 GTM 会混淆其原本的目的（即提供一个管理跟踪代码的系统）。\n\
  - 这会导致 GTM 容器（最大为 200 KB）变得臃肿，而这些内容在其他地方管理会更好。\n- 如果关键功能依赖于 GTM 中的内容，且容器因故无法访问，网站将无法正常运行。\n\
  \n然而，在应用中，各因素的平衡点有所不同。应用更新流程（通过应用商店）往往既漫长又繁琐，因此你会希望尽可能少地更新应用。所以，能够在应用商店更新间隔期内通过\
  \ GTM 进行小幅调整是非常有价值的。遗憾的是，目前并没有所谓的“应用内容管理系统”，而 GTM 恰好可以填补这一角色。此外，与网站不同，应用始终会包含一份容器的副本作为备用，即使在无法从\
  \ GTM 获取更新后的容器时也是如此，从而降低了容器不可用的风险。\n\n基于这些原因，在移动应用中更常见的是使用 GTM 来提供配置数据或启动功能。值收集变量常用于向应用提供配置设置或其他内容。例如，假设你有一个包含以下值的值收集变量：\n\
  \n```\n{\n  \"suit\": \"hearts\",\n  \"card\": \"queen\"\n}\n```\n\n我们的应用可以检索这些值（通过\
  \ Android 中的 `container.getString()` 函数或 iOS 中的 `container stringForKey:@{}` 函数）并在应用中使用它们：\n\
  \n![A978-1-4842-0265-4_13_Figa_HTML.jpg](img/A978-1-4842-0265-4_13_Figa_HTML.jpg)\n\
  \n值收集变量可用于包含配置值，或作为应用内函数输入的 URL、应用界面中使用的文本字符串，或任何其他可用于改变应用内容或行为的信息片段。这一功能是在移动应用中利用\
  \ GTM 的关键优势之一。\n\n### 移动应用中的数据层\n\n移动应用中的数据层与网站上的工作方式非常相似：它是一个运行中的事件和值队列，用于触发代码并提供变量值。\n\
  \n在网站上，每次加载新页面都会导致浏览器清除前一页面的所有 JavaScript。因此，数据层在每个页面加载时都会更新。然而，在移动应用中，数据层会持续存在，直到应用退出。这带来了几个后果：\n\
  \n- 拥有一个持久的数据层非常有用，因为你无需在用户的整个会话期间持续刷新持久值（就像在网站上必须做的那样）。例如，用户范围或会话范围的自定义维度、用户 ID\
  \ 或其他在整个会话期间保持不变的值会保留在数据层中，无需重新添加。\n- 另一方面，你需要手动清除那些不应应用于后续操作的临时值。例如，增强型电子商务值仅适用于特定的一次点击，而不适用于后续的点击。你需要清除这些值（或用新值覆盖它们），以便为每次点击发送正确的数据。\n\
  \n另请注意，与网站不同，这里没有默认的数据层事件（`gtm.js`、`gtm.dom`、`gtm.load`）。你需要通过应用代码显式推送所有你想放入数据层的内容。Android\
  \ 和 iOS SDK 提供了用于将信息推送到数据层的函数。对于 Android，使用 `DataLayer.pushEvent()` 函数；对于 iOS，使用\
  \ `[dataLayer push:@{}]` 函数。\n\n\n\n### 部署与测试\n\n移动应用的部署与测试流程与网站有所不同，因为我们的更新流程不同，可用的工具也不同。\n\
  \n首先，你在网站中使用的调试面板在移动应用中不可用。GTM SDK 内置了可启用的日志记录功能，用于在开发阶段查看详细的日志信息。在 Android 中通过\
  \ `TagManager.setVerboseLoggingEnabled(true)` 启用，或在 iOS 中通过 `[self.tagManager.logger\
  \ setLogLevel:kTAGLoggerLogLevelVerbose]` 启用。\n\n在 GTM 中进行更改时，有两种方式可在应用中预览对容器的更改：\n\
  \n- 如果应用仍处于开发阶段，你可以下载容器的二进制文件并将其包含在应用中。在移动应用版本列表的操作列表中可以找到“下载”选项（见图 13-4）。\n\n \
  \ ![A978-1-4842-0265-4_13_Fig4_HTML.jpg](img/A978-1-4842-0265-4_13_Fig4_HTML.jpg)\n\
  \n  图 13-4. 下载容器的二进制版本以编译到应用中\n\n> **注意：** 在提交到应用商店或分发给用户之前，应在编译的应用二进制文件中包含一份测试用的、功能完整的容器副本。\n\
  \n- 与网站类似，你可以使用预览链接（或二维码）来预览应用（包括已发布上线的应用）中容器的更改。使用此链接前，你必须在应用代码中注册 URL scheme。然后，在版本列表的操作列表中选择“预览”选项以获取链接（见图\
  \ 13-5）。（请注意，你还可以生成一个结束设备预览模式的链接。）\n\n  ![A978-1-4842-0265-4_13_Fig5_HTML.jpg](img/A978-1-4842-0265-4_13_Fig5_HTML.jpg)\n\
  \n  图 13-5. 通过链接或二维码在移动应用中启用容器版本的预览\n\n对于在设备上对已上线的应用进行移动应用容器测试，数据包嗅探器（监控设备发出的网络流量）可能很有用（类似于对网站使用浏览器开发者工具）。当然，你还可以监控传入\
  \ GA 的数据，以确保数据符合预期。\n\n> **注意：** 使用 GA 的实时报告监控测试活动时，请记住移动应用 SDK 会批量收集命中数据并按时间间隔发送。因此，你不会立即看到实时数据——而是会在短暂延迟后，一批命中数据同时到达。这是应用数据的正常行为。\n\
  \n## 总结\n\n- GA 除了可以使用之前讨论过的 `event`、`social` 和其他命中类型外，还可以通过 `screenview` 命中类型从移动应用收集数据，并包含一些专门适用于移动应用的额外维度。GTM\
  \ 提供了适用于 Android 和 iOS 的 SDK，支持在移动应用中使用容器，包括 GA 代码。\n- 移动应用容器包含代码、触发器和变量。代码和变量的选择与网站不同，并且唯一可用的触发器类型是针对推送到数据层的事件。\n\
  - 当使用 `值收集` 变量类型来提供内容更新或为移动应用在两个应用商店版本之间提供配置值时，GTM 对移动应用尤为重要。\n- 与网站不同，移动应用使用在整个会话期间持久存在的数据层。\n\
  - 移动应用测试工具包括预览模式，以及下载容器并将其编译到应用中的功能。\n\n**脚注**\n\n1. [`https://developers.google.com/tag-manager/android/v4/#push`](https://developers.google.com/tag-manager/android/v4/#push)\n\
  2. [`https://developers.google.com/tag-manager/ios/v3/#push-datalayer`](https://developers.google.com/tag-manager/ios/v3/#push-datalayer)\n\
  3. [`https://developers.google.com/analytics/devguides/collection/unity/v3/`](https://developers.google.com/analytics/devguides/collection/unity/v3/)\n\
  4. [`https://support.google.com/tagmanager/answer/6003007`](https://support.google.com/tagmanager/answer/6003007)\n\
  \n"
- "# 14. 使用 GA 的测量协议从其他来源发送数据\n\n> 越来越好奇了！——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\n本书大部分内容聚焦于通过 Google\
  \ 跟踪代码管理器向 Google Analytics 发送数据。这些在 GA 中收集数据的官方方法涵盖了网站（JavaScript）和移动应用（iOS 和 Android\
  \ SDK）。然而，除了网站和移动应用之外，还有许多你可能希望整合到 GA 中的潜在数据来源。\n\n为了支持这些额外的数据来源，GA 提供了测量协议。测量协议是一份关于数据如何发送到\
  \ GA 的规范，数据的来源无关紧要。只要你以正确的格式发送，GA 就能使用这些数据，并与从网站或移动应用收集的常规数据一起处理。\n\n测量协议可应用于多种场景，用于向\
  \ GA 发送数据：\n\n- 从具有用户线下或非网页交互数据的系统（如呼叫中心或零售店销售点系统）发送数据。\n- 在无法使用 JavaScript 的语境下（如\
  \ HTML 电子邮件）发送数据。\n- 从没有官方 SDK 的环境或设备（如 Windows Phone、机顶盒和其他联网设备）发送数据。\n\n由于测量协议的格式规范不依赖于数据的来源，因此你使用何种方法、编程语言或技术来捕获这些数据（这些都取决于平台和上下文）都无关紧要。只要你以相同的方式发送数据，GA\
  \ 就会像处理来自网站、iOS 和 Android 官方收集源的数据一样，接收并处理它们。\n\n> **注意：** GA 唯一的官方代码库是 `analytics.js`（用于网站）以及\
  \ iOS 和 Android SDK（用于移动应用）。你可以使用测量协议的格式从任何来源发送数据，但你需要使用你正在使用的任何编程或脚本语言自己创建用于发送数据的代码。\n\
  \n## 发送数据\n\n使用测量协议发送数据只需发起一个 HTTP 请求（就像在网页浏览器中请求一个网页一样），该请求包含一个有效负载，即一组构成所发送数据的参数。\n\
  \n\n\n### HTTP 请求\n\nMeasurement Protocol 会向以下 URL 发起 HTTP 请求：\n\n[`http://www.google-analytics.com/collect`](http://www.google-analytics.com/collect)\n\
  \n你已经知道，这也是 `analytics.js`（针对网站）和移动应用 SDK（针对 iOS 和 Android）发送数据的目标地址！Measurement\
  \ Protocol 允许任何其他来源以完全相同的方式发送数据。你也可以通过 SSL 使用此 URL 进行安全请求：\n\n[`https://ssl.google-analytics.com/collect`](https://ssl.google-analytics.com/collect)\n\
  \n两者的工作方式相同。\n\nMeasurement Protocol 请求可以使用 GET 或 POST 请求。（即使你之前没有特别留意，对这两种方法也一定不陌生：在网页浏览器中，页面和图片等项目使用\
  \ GET，而表单通常使用 POST。）\n\n使用 GET 请求的能力意味着，即使在 HTML 邮件这类静态环境中，你也可以通过嵌入包含 Measurement\
  \ Protocol URL 的图片来发送数据：\n\n`<img src=\"http://www.google-analytics.com/collect?...payload...\"\
  \ />`\n\n然而，出于浏览器兼容性原因，GET 请求的大小限制为 2000 字节（即 URL 中 2000 个字符，除非有双字节字符，例如亚洲语言）。与\
  \ GET 不同，POST 支持有效负载高达 8192 字节。POST 请求通常需要某种脚本来生成请求（例如，作为后端应用程序的扩展）。\n\n### 有效负载参数\n\
  \n“有效负载”指通过 HTTP 请求发送给 GA 的数据。它由一系列标准化参数组成。对于 GET 请求，这些参数作为查询参数附加到 URL 中：\n\n`http://www.google-analytics.com/collect?v=1&tid=UA-XXXX-Y&cid=12345&t=pageview&dp=%2Fhome`\n\
  \n在 POST 请求中，有效负载参数作为请求的主体发送，其格式与查询参数相同（由与号分隔的键值对）。\n\n**注意：** 有效负载数据应使用 URL 编码，这意味着空格、斜杠以及\
  \ URL 格式中的其他保留字符应被替换为编码后的字符。例如，在前面的 URL 中，参数 `dp` 中的页面 `/home` 使用 `%2F` 来编码斜杠。通常情况下，你的编程或脚本语言会提供编码和解码\
  \ URL 的函数。\n\nMeasurement Protocol 文档涵盖了有效负载中可能使用的所有参数及其可接受值。（你可能会发现，它们与 GTM 中 GA\
  \ 标签的“要设置的字段”中的所有字段完全相同。）每个 Measurement Protocol 匹配必须至少包含以下四个参数：\n\n*   协议版本：`v=1`。该值始终为\
  \ 1（直到有一天 GA 更新了 Measurement Protocol）。\n*   跟踪 ID：`tid=UA-12345-1`。GA 网站媒体资源 ID。\n\
  *   客户端 ID：`cid=12345`。客户端 ID，对应于 `analytics.js` 存储在其 Cookie 中的客户端 ID（下文会进一步说明）。\n\
  *   匹配类型：`t=pageview`。互动的类型；可以是 `pageview`、`event`、`social`、`transaction`、`item`、`screenview`、`exception`、`timing`\
  \ 之一。（与你在 GTM 的 GA 标签中可选择的互动类型相同。）\n\n对于不同的匹配类型，可能需要附加字段。例如，如果匹配类型是 `pageview`，则应设置页面路径参数\
  \ (`dp`)；如果匹配类型是 `event`，则应设置事件类别和事件操作 (`ec` 和 `ea`)。可用的参数包括本书中讨论的针对 Web 和移动应用的\
  \ GA 中的所有数据类型，涵盖了从网页浏览和事件到高度自定义信息（如自定义维度和增强型电子商务数据）的所有基础知识。\n\n#### 客户端 ID 和用户 ID\n\
  \n有两个用于按用户聚合数据的字段需要特别提及，即客户端 ID (`cid`) 和用户 ID (`uid`)。\n\n客户端 ID 通常代表一个设备标识符——在网站的\
  \ `analytics.js` 中，它是存储在 Cookie 中的值。对于 Measurement Protocol 匹配，根据其来源，你可以将此设置为一个新的随机\
  \ ID，或者从 Cookie 中提取现有的客户端 ID。例如，考虑以下场景：\n\n一位潜在客户通过营销活动链接访问了你的网站。他们在网站上浏览，但并未转化。相反，他们决定致电你的呼叫中心来完成转化。他们通过一个从电话号码池中随机分配的电话号码进行联系。你的呼叫中心收到了来自该电话号码的来电。呼叫中心软件与网站集成，以维护客户端\
  \ ID 和电话号码的对应关系，并向 GA 发送一个 Measurement Protocol 匹配，其中包含一个表明电话呼叫已开始的事件。客户在通话期间完成了购买。当客服代表在呼叫中心软件中录入此信息时，另一个\
  \ Measurement Protocol 匹配被发送到 GA，其中包含一个表明购买的事件。\n\n由于整个过程使用了相同的客户端 ID，在 GA 中你将看到此用户的会话跨越了网页和电话。非常神奇！\n\
  \n用户 ID 帮助你更进一步，为跨设备的个体提供标识符，即使互动发生在不同时间（即，跨越多个会话）。如果你知道用户的姓名、电子邮件地址或其他信息，你可以将其链接到一个持久的标识符（例如，在你的\
  \ CRM 系统中），并且只要该用户被识别（通过登录网站或移动应用、致电呼叫中心等），你就会知道是同一个人。（有关用户 ID 的更多信息，请参阅第 10 章。）\n\
  \n#### 有效负载之外的请求数据\n\n除了有效负载参数，Measurement Protocol 还会使用来自 HTTP 请求的几条额外信息：\n\n*\
  \   接收请求的 IP 地址，用于分配地理维度，如国家/地区和城市。\n*   用户代理标头，用于指示发起请求的浏览器和设备类型。\n*   接收请求的时间，用于为匹配分配日期和时间。\n\
  \n然而，在某些情况下，你可能希望覆盖这些值。例如，假设你使用 Measurement Protocol 从呼叫中心记录应用程序收集数据，客户通过该应用程序致电下单。如果所有请求都来自你自己服务器上的内部系统，它们将具有相同的\
  \ IP 地址，但这并不能准确体现来电客户的实际地理位置。\n\n有一些有效负载参数可以覆盖 IP 地址和/或地理位置、用户代理，并指定时间延迟（用于在连接可用时稍后发送的离线匹配，或批量发送的匹配）：\n\
  \n*   IP 覆盖：`uip` 参数可用于指定一个 IP 地址。然后会应用标准的 GA 处理来解释其位置。\n*   地理位置覆盖：`geoid` 参数可用于指定一个位置。其值可以是两个字母的国家/地区代码，或\
  \ AdWords 地理位置标准 ID，这是一套全球范围内的国家、城市和地区标识符，用于 AdWords 中的广告定位，并作为多个 Google 工具中的地理标识符。\n\
  *   用户代理覆盖：`ua` 参数可用于指定一个用户代理。然后会应用标准的 GA 处理来确定设备类型、操作系统和浏览器。\n*   队列时间：`qt` 参数可用于指定数据收集与发送之间经过的时间（以毫秒为单位）。队列时间超过四小时的匹配可能不会被\
  \ GA 处理。\n\n\n\n### 缓存破坏\n\n浏览器通常会缓存请求——也就是说，如果浏览器发起的请求与之前的某个请求完全相同，浏览器会首先检查该资源是否在缓存中，如果是，则直接从缓存加载，无需向服务器发起新的\
  \ HTTP 请求。\n\n然而，这显然不是你在使用 Measurement Protocol 命中时想要的效果。如果你针对一个具有相同负载的命中发起第二次请求，那是因为用户确实第二次查看了该页面，并且你希望该请求能被发送到服务器。\n\
  \n为了确保发送到 Measurement Protocol 的请求不被缓存，你可以在负载中使用一个名为缓存破坏器的参数。（`analytics.js` 库会自动处理缓存破坏，但使用\
  \ Measurement Protocol 时，你需要自行处理。）该参数（`z`）仅包含一个随机数，这样原本相同的请求就能被区分开来，并从服务器重新请求。例如，以下是同一个客户端\
  \ ID 针对同一页面发起的两个网页浏览请求，但通过为缓存破坏器参数设置不同的随机值来区分它们。\n\n```\nv=1&tid=UA-12345-1&cid=12345&t=pageview&dp=%2Fhome&z=384585985785\n\
  v=1&tid=UA-12345-1&cid=12345&t=pageview&dp=%2Fhome&z=214492387598\n```\n\n### 验证\n\
  \n为了测试 Measurement Protocol 的命中并确保其格式正确，GA 提供了一些原型设计和测试工具。\n\nHit Builder 工具提供了一个表单，允许你填写负载字段的值，从而构建一个\
  \ Measurement Protocol 请求（图 14-1）。\n\n![A978-1-4842-0265-4_14_Fig1_HTML.jpg](img/A978-1-4842-0265-4_14_Fig1_HTML.jpg)\n\
  \n图 14-1. 用于构建 Measurement Protocol 请求原型的 Hit Builder 工具\n\nGA 的验证服务器允许你发送一个命中来测试负载是否包含格式正确的必需参数。你可以将任何\
  \ Measurement Protocol 命中发送到此端点进行测试：\n\n`http://www.google-analytics.com/debug/collect`\n\
  \n此端点的功能与普通端点相同，但有两点区别：\n\n*   发送到验证服务器端点的数据不会出现在报告中。它仅用于测试目的，并且会被丢弃。\n*   验证服务器会以\
  \ JSON 格式发送详细的响应，显示请求是否有效以及生成的任何错误消息：\n\n```json\n{\n  \"hitParsingResult\": [{\n\
  \    \"valid\": false,\n    \"parserMessage\": [{\n      \"messageType\": \"ERROR\"\
  ,\n      \"description\": \"A value is required for parameter 'dp'. Please see http://goo.gl/a8d4RP#dp\
  \ for details.\",\n      \"messageCode\": \"VALUE_REQUIRED\",\n      \"parameter\"\
  : \"dp\"\n    }],\n    \"hit\": \"GET /debug/collect?v=1\\u0026t=pageview\\u0026tid=UA-12345-1\\\
  u0026cid=12345 HTTP/1.1\"\n  }]\n}\n```\n\n你可以首先生成任何 Measurement Protocol 命中并先使用验证服务器进行测试，以确保其格式正确。\n\
  \n## GA 中的数据处理\n\n一旦 GA 接收到数据（假设它通过了验证），这些数据将被视为该媒体资源的任何其他数据。过滤器和其他设置会被应用，数据会被放入视图的报告中。\n\
  \n请注意，目前没有针对 Measurement Protocol 数据的专门报告；它会与网站和应用程序数据一起出现（并且可以像这些数据一样被过滤）。为了使使用\
  \ Measurement Protocol 发送的数据与 GA 中的现有用户相关联，你应该包含一个与你的网站数据中现有值相匹配的客户端 ID 或用户 ID（参见\
  \ 第 10 章）。\n\n你需要自行决定如何在 Measurement Protocol 数据的上下文中解释“网页浏览量”和其他以网站为中心的指标，并且在设计发送数据的解决方案之前，你应该考虑如何在\
  \ GA 中使用这些数据。自定义维度和指标在记录本质上不同类型且不一定符合以网站为中心范式（参见 第 11 章）的数据时可能非常有用，而自定义报告和细分可能有助于以有用的方式呈现这些数据。\n\
  \n## 总结\n\n*   Measurement Protocol 是一个规范，用于从任何来源向 Google Analytics 发送数据。它是一个 HTTP\
  \ 请求规范，其中包含一个待 Google Analytics 接受的数据负载。\n*   Measurement Protocol 可用于从网站和移动应用以外的来源收集数据，例如后端应用程序或没有官方\
  \ SDK 的环境。\n*   负载数据可以包含与网站或移动应用命中相同的所有字段。GA 提供了用于构建原型和验证数据的工具。一旦 GA 接收到数据，它就会像来自网站和移动应用的数据一样出现在报告中。\n\
  \n## 脚注\n\n1 ISO 3166-1，它们也用于 GA 中“受众群体”➤“地理位置”➤“语言”报告的语言代码。\n\n2 [`http://developers.google.com/analytics/devguides/collection/protocol/v1/geoid`](http://developers.google.com/analytics/devguides/collection/protocol/v1/geoid)\n\
  \n"
- "# 15. 将 Google Analytics 与 BigQuery 结合用于大数据分析\n\nGoogle Analytics 在其网页界面中提供了一套广泛的报告和工具。标准报告旨在为关于网站的最常见问题提供答案，而自定义报告、细分和其他工具则有助于进行更深入的探索。然而，有些类型的问题很难通过\
  \ GA 报告中聚合的会话数据来解决——尤其是像数据挖掘和应用统计模型这样的应用，这些应用通常需要按命中的非聚合数据。这些工具可以处理的某些问题和场景包括：\n\
  \n*   发现行为之间的关联，例如“购买了产品 X 的用户也购买了产品 Y”或“阅读了文章 X 的用户也阅读了文章 Y”。\n*   复杂的归因建模，尤其是那些整合了来自\
  \ GA 外部的额外转化、营销数据或客户数据的模型。\n*   基于算法的用户分群，以及客户价值或转化可能性的预测模型。\n\n这些技术以及用于实现它们的技术工具通常都归入“大数据”这一总称之下。GA\
  \ 通过支持将数据逐条导出到另一个名为 BigQuery 的 Google 工具，为访问此类数据提供了渠道。BigQuery 是一种旨在轻松快速地分析和查询大型数据集的工具，无需担心底层技术和计算资源的支持。本章将探讨\
  \ GA 与 BigQuery 之间的集成、可用的数据以及如何利用这些数据。\n\nGA 与 BigQuery 的集成仅适用于 Google Analytics\
  \ Premium 订阅用户。\n\n注意：本章将探讨 BigQuery 及其用于访问和查询 GA 数据的工具。统计模型和数据挖掘工具本身不在本讨论范围之内。\n\
  \n本章首先介绍 BigQuery 和用于访问它的工具。后续章节将更详细地介绍查询语言以及如何将其应用于 BigQuery 中的 GA 数据。最后一部分将退后一步，从宏观角度讨论在诸如前述应用中使用\
  \ BigQuery 可用数据的策略。\n\n\n\n## 关于 BigQuery\n\nBigQuery 是一种可让你存储、查询和提取数据的工具。它独立于 GA\
  \ 和 GTM，是 Google 云平台的一部分，但你可以像使用其他 Google 工具一样，通过 Google 账号登录来访问它。虽然 BigQuery 提供了网页界面（你将在本章后面看到），但该界面主要用于探索和测试查询。通常，BigQuery\
  \ 会像其他任何数据库一样，作为一种服务来充当其他应用程序的信息源。与其他数据库一样，它支持一种查询语言，可以根据感兴趣的条件选择数据子集，并返回这些值，以便在报告、可视化、统计模型或其他应用程序中进一步处理。\n\
  \n**注意：** 在 BigQuery 中存储和查询数据会产生相关费用。¹ 本章中的示例查询执行一次大约只需花费几美分。你的 Google Analytics\
  \ Premium 订阅中包含月度 BigQuery 费用抵免额，可用于抵消使用费，但如果超出月度抵免额，你将需要为任何额外的使用量付费。\n\n### BigQuery\
  \ 不是什么\n\nBigQuery 并非一套精美的报告。（毕竟，你在 GA 中已经有这些了！）它可以与各种报告和商业智能工具配合使用来创建报告，但 BigQuery\
  \ 本身并未内置报告功能。\n\nBigQuery 也不是传统的关系型数据库。如果你已经熟悉传统的关系型数据库和 SQL 查询语言，你会发现学习 BigQuery\
  \ 很容易，但两者也存在一些差异。BigQuery 针对处理大型分布式数据集进行了优化，其结构可以包含嵌套和重复值。因此，BigQuery 的查询语言是“类 SQL”的，但并非在所有方面都符合\
  \ SQL 标准。BigQuery 表中的数据无法更改或更新；表仅能追加数据。\n\n## GA 与 BigQuery 集成\n\nGoogle Analytics\
  \ Premium 订阅用户可联系其客户经理启用 GA-BigQuery 集成。你可以选择 GA 中的一个或多个视图进行数据导出。\n\nBigQuery 的结构层次分为项目（Project）、数据集（Dataset）和表（Table）。通常，你有一个项目包含你所有的\
  \ GA 数据。你导出的每个 GA 视图在 BigQuery 中都是一个独立的数据集。\n\n一旦启用，GA 的数据会定期导出到 BigQuery。数据包括 GA\
  \ 中每次匹配（如页面浏览、事件等）的详细信息，并按会话（Session）组织排列。（本章后面的部分会更详细地探讨 GA 数据所使用的架构。）每天的数据在当天结束后导出，并成为\
  \ BigQuery 数据集中的一个独立表。如果你需要在当天结束前处理当天的数据，那么在当天数据表最终确定之前，还会有几次日内导出（大约每 8 小时一次）。\n\
  \n## 访问 BigQuery\n\n可以通过多种方式访问 BigQuery 数据：\n\n- 通过网页界面，可以在其中输入查询并查看或下载结果数据。这对于数据的探索和测试特别有用。\n\
  - 通过命令行界面输入查询并获取结果。这对于一次性数据导出或通过简单的自动化脚本从 BigQuery 检索数据可能很有用。\n- 通过 API，你可以与现有工具（如\
  \ Google Sheets 或 Tableau）结合使用，以报告和可视化来自 BigQuery 的数据，或者编写与你自己的应用程序的自定义集成，或将数据导出到位于其他位置的数据仓库。\n\
  \n本章将展示网页界面，但所有讨论的查询，无论通过哪种方法访问 BigQuery 数据，其工作方式都是相同的。\n\n### 网页界面\n\n如果你使用有权访问\
  \ BigQuery 项目的 Google 账号登录，则可以访问 BigQuery 网页界面（见图 15-1）。²\n\n![A978-1-4842-0265-4_15_Fig1_HTML.jpg](img/A978-1-4842-0265-4_15_Fig1_HTML.jpg)\n\
  \n*图 15-1. BigQuery 网页界面，显示从 GA 导出的一个数据集*\n\n左侧导航显示了项目、数据集和表的层次结构。此示例中的项目名为“Alice’s\
  \ Wonderland Resorts”。其中包含一个数据集（`123456789`），其名称是被导出视图在 GA 中的视图 ID 号。该数据集包含一些表，这些表的名称以\
  \ `ga_sessions_` 开头，后跟日期（以及当天以 `ga_sessions_intraday_` 开头的日内表）。\n\n该项目中还包含一些示例数据集。数据集\
  \ `[publicdata:samples]` 是所有 BigQuery 项目中都包含的一组通用示例数据。数据集 `[google.com:analytics-bigquery:LondonCycleHelmet]`\
  \ 是一个 GA 数据的示例数据集。它包含一个表，其中包含来自一个示例自行车电商网站的一天数据。在你将查询应用于自己网站上的更大数据集之前，使用这个较小的数据集来探索查询会很有帮助。\n\
  \n在右侧，你可以使用 BigQuery 类 SQL 查询语法输入查询并检索结果。以下是一个可供尝试的简单示例查询：\n\n```\nSELECT\n  hits.type,\n\
  \  count(hits.hitNumber)\nFROM\n  [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  GROUP BY\n  hits.type\n```\n\n此查询从示例数据集中按类型获取匹配计数。（暂时不要太担心此查询的语法——稍后你将看到查询语言如何工作的更多细节。）图\
  \ 15-2 显示了此查询在 BigQuery 网页界面中的结果。\n\n![A978-1-4842-0265-4_15_Fig2_HTML.jpg](img/A978-1-4842-0265-4_15_Fig2_HTML.jpg)\n\
  \n*图 15-2. 在网页界面中输入的查询的查询结果*\n\n在顶部，你可以看到输入的查询。选择“运行查询”按钮后，BigQuery 会执行查询并在下方显示结果（一个表格，行按匹配类型排列，列显示计数）。请注意，结果上方的按钮允许你下载为\
  \ CSV 或 JSON 文件，或将结果保存为 BigQuery 中的一个新表。\n\n\n\n## BigQuery 中的 GA 数据架构\n\nGA 导出至\
  \ BigQuery 的数据，代表所选数据视图在应用任何过滤器后的、非聚合的匹配级别数据（有关过滤器的更多信息，请参阅第 8 章）。数据表中的每条记录代表一个会话，会话中的嵌套记录代表各个匹配（页面浏览量、事件等）。您可以在网页界面中选择一个表，查看\
  \ GA 数据中各字段的详细信息（见图 15-3）。\n\n![A978-1-4842-0265-4_15_Fig3_HTML.jpg](img/A978-1-4842-0265-4_15_Fig3_HTML.jpg)\n\
  \n图 15-3. 网页界面中显示的 BigQuery 内 GA 表的架构详情\n\n`Schema` 选项卡显示字段名称、结构及类型。您还可以选择 `Details`\
  \ 选项卡查看表中前几条记录的数据，以了解数据填充方式。\n\nGA 数据的架构非常庞大，包含超过 150 个字段，这些字段代表了 GA 所捕获的众多信息，包括每次页面浏览、事件或其他匹配的相关信息；会话级别信息，如流量来源和地理位置；匹配中包含的增强型电子商务数据（请参阅第\
  \ 7 章）；以及自定义维度和指标（请参阅第 11 章）。这些字段的命名方式与 GA 中的维度名称非常相似，因此您应该能轻松解读它们，但架构文档提供了更详细的说明。³\n\
  \n该架构是一种嵌套结构，嵌套字段的名称用点号 (`.`) 分隔。例如，`totals` 记录包含 `totals.hits`、`totals.pageviews`，以及整个会话总数相关的其他几个计数字段。`trafficSource`\
  \ 记录包含 `trafficSource.source`、`trafficSource.medium` 以及其他流量来源维度。最重要的嵌套记录是 `hits`，它是一个可重复的记录，包含每次匹配的数据，例如\
  \ `hits.type`（针对不同的匹配类型：页面浏览量、事件等）、`hits.page.pagePath`（页面的 URL 路径）等。字段的值可以是字符串、整数、布尔值（`true`\
  \ 或 `false`）或其他类型。如果某个字段为空，其值可以为 `null`。\n\n与 GA 中的数据相比，您会注意到此数据的一个主要区别：它主要由维度值组成，仅有少数基本指标，并且缺少您在\
  \ GA 中可能常用的许多指标，例如跳出率、页面停留时间等。由于您在 BigQuery 中拥有非聚合的匹配数据，因此您可以通过选择的任何公式来计算您选择的任何指标。您可以重新计算\
  \ GA 中的指标（如跳出率和页面停留时间），但您也不再受 GA 中指标的限制——例如，您可以创建新的指标计算，比如每用户收入。\n\n由于 BigQuery\
  \ 中的数据代表 GA 视图中的完整数据，因此查询永远不受抽样、表行数限制或 GA 界面中其他报告限制的影响。（有关抽样的更多信息，请参阅第 1 章。）\n\n\
  BigQuery 中非聚合数据的另一个主要优势是按用户提供的详细的匹配级别数据。您可以查看用户在一段时间内（跨多个会话）的完整行为，从而对其进行详细分类。在 GA\
  \ 内部，通过使用细分功能可以实现有限的操作，但基于用户的细分只能应用于有限的时间范围内，并且会受到抽样影响。\n\n## BigQuery 的查询语言\n\n\
  BigQuery 使用一种修改过的 SQL 语法来查询数据集。如果您不熟悉 SQL 和数据库查询语言，本节将提供一些基本示例来帮助您入门。如果您熟悉在 MySQL、PostgreSQL、MS-SQL\
  \ 或 Oracle 等数据库中使用 SQL，那么您已经掌握了构建查询的基础知识，下面的示例将为您指出与传统 SQL 方言存在差异的地方。\n\n在这些示例中，您将使用“伦敦自行车头盔”示例数据集。该数据集包含一个表：`[google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]`，您将在所有查询中使用这个表。您应该可以在\
  \ BigQuery 的 GA 项目中访问此示例数据集。\n\n**注意：** “伦敦自行车头盔”数据集使用的架构版本比 GA 当前使用的版本稍旧。当前架构是向后兼容的。您可以针对当前的\
  \ Google Analytics 导出数据运行以下任何查询。\n\n查询是一个从数据集中获取所需结果的语句，可以包含以下子句：\n\n- `SELECT`\n\
  - `FROM`\n- `WHERE`\n- `GROUP BY`\n- `HAVING`\n- `ORDER BY`\n- `LIMIT`\n\n您可以将此理解为针对您想要检索的数据编写一个句子：\n\
  \n- `SELECT` `某些字段`\n- `FROM` `某些表`\n- `WHERE` `记录满足条件`\n- `GROUP BY` `某个希望其唯一的字段`\n\
  - `HAVING` `某个有趣的聚合条件`\n- `ORDER BY` `某些字段`\n- `LIMIT` `只取前若干条`\n\n让我们从一些基本示例开始，说明这个句子的各个子句及其工作方式。\n\
  \n**注意：** 本章包含一系列与 BigQuery 中 GA 数据相关的示例，但它并非查询语言的完整参考。GA-BigQuery 集成文档⁴ 和 BigQuery\
  \ 文档⁵ 提供了更多信息和示例。\n\n\n\n### 从表中选择数据\n\n`SELECT`关键词允许查询从表中挑选特定字段`FROM`表、重命名字段，并对数据执行计算。`SELECT`和`FROM`是任何查询的两个核心子句。\n\
  \n通常，查看表中的每一个字段并不实用或有效。仅选择你需要的字段可以简化待审查的结果，并减少完成查询所需的数据量和处理能力。使用`SELECT`，你可以使用字段名称（来自模式）或使用`*`作为通配符来选择所有字段。（通常不推荐使用`SELECT\
  \ *`，因为当模式中存在多个可重复字段时，它是不允许的。请参阅本节后面的“展平包含重复字段的表”）。\n\n一个非常简单的查询示例如下：\n\n```\nSELECT\
  \ fullVisitorId, totals.hits\nFROM   [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  ```\n\n这将从伦敦自行车头盔示例表中选择两个字段（`fullVisitorId`，对应 GA 中的客户端 ID；以及`totals.hits`，表示会话中的点击次数）。结果如下所示：\n\
  \n```\n     fullVisitorId       totals_hits\n1    380066991751227408  8\n2    712553853382222331\
  \  12\n3    881288060286722202  3\n4    881288060286722202  1\n5    881288060286722202\
  \  7\n```\n\n这里仅展示了前几个结果。如果你使用的是网络界面，它会分页显示结果，每次显示少量数据。（`LIMIT`子句也可以设置返回的最大行数；例如，只需在查询末尾加上`LIMIT\
  \ 5`即可。）\n\n**注意：** 在 SQL 语法中，大小写和空格并不重要。你可以根据需要随意插入换行符，使查询更具可读性。习惯上也会将`SELECT`和`FROM`等子句关键词大写。\n\
  \n你可以使用`AS`关键词重命名结果中的字段，如下所示：\n\n```\nSELECT fullVisitorId AS Client_ID, totals.hits\
  \ AS Hits\nFROM   [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  ```\n\n这将返回与之前相同的结果，但列标题现在对应你所选的名称：\n\n```\n     Client_ID           Hits\n1   \
  \ 380066991751227408  8\n2    712553853382222331  12\n3    881288060286722202  3\n\
  4    881288060286722202  1\n5    881288060286722202  7\n```\n\n为结果列赋予有意义的名称非常有帮助，尤其是在创建新列来表示新指标时。\n\
  \n### 计算函数\n\n除了选择字段的值，你还可以对字段执行计算。\n\n计算可以作用于单条记录中的字段，将它们组合起来，并返回一个结果。例如，你可以对数字进行加、减、乘、除（使用运算符`+`、`-`、`*`、`/`），或者连接字符串（使用`CONCAT()`）。\n\
  \n例如，假设你需要为每个会话设置一个唯一标识符。模式中没有这个字段，但你可以通过连接客户端 ID（`fullVisitorId`）和访问开始的时间戳（`visitId`）来创建一个：\n\
  \n```\nSELECT CONCAT(fullVisitorId, \".\", STRING(visitId)) AS Session_ID\nFROM\
  \   [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n```\n\
  \n此示例使用`CONCAT`函数组合了两个字段。注意它们在中间插入了一个点字符，以便直观地标识各部分。另外注意使用了`STRING()`来强制将`visitId`字段的类型转换为字符串，因为它实际上是一个整数字段（如模式中所述）。结果如下所示：\n\
  \n```\n     Session_ID\n1    380066991751227408.1378805776\n2    712553853382222331.1378804218\n\
  3    881288060286722202.1378803865\n4    881288060286722202.1378804975\n5    881288060286722202.1378805870\n\
  ```\n\n还有第二种类型的计算，称为聚合函数，因为它们通过计数、求平均值或求和等方式（使用`COUNT()`、`AVG()`或`SUM()`等），将多条记录中的值聚合到结果中的单一行中。例如，如果你想要当天的总点击次数，可以使用以下查询：\n\
  \n```\nSELECT SUM(totals.hits) AS Hits\nFROM   [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  ```\n\n这将产生以下结果：\n\n```\n     Hits\n1    362\n```\n\n请注意，使用聚合函数将表中的所有记录合并为单个结果。你可以对其他指标采用类似的方法。例如，假设你需要跳出率。你可以编写如下查询：\n\
  \n```\nSELECT AVG(totals.bounces) AS Bounce_Rate\nFROM   [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  ```\n\n但这是你将得到的结果：\n\n```\n     Bounce_Rate\n1    1\n```\n\n100%的跳出率——这可不妙！但这也是不正确的。不幸的是（或者幸运的是，取决于你的需求），聚合函数不包含空值，而`totals.bounces`的值对于跳出会话是`1`，对于非跳出会话则是`null`（如模式中所述）。因此，你可以将`null`值转换为`0`，或者计算`1`的数量并除以总会话数，如下例所示：\n\
  \n```\nSELECT COUNT(totals.bounces)/COUNT(totals.visits) AS Bounce_Rate\nFROM  \
  \ [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n```\n\n\
  得到以下结果：\n\n```\n     Bounce_Rate\n1    0.1746031746031746\n```\n\n啊，17.5%的跳出率——好多了！\n\
  \n### 表的日期范围\n\n到目前为止的示例仅使用了包含单个表的`FROM`子句。然而，正如你所见，GA 数据每天包含一个单独的表，因此如果你想聚合多天的数据，就需要查询多个表的并集，将它们当作一个大表来处理。你可以在查询中通过在`FROM`子句中使用逗号包含多个表来合并它们。\n\
  \n**注意：** 如果你熟悉 SQL，请注意 BigQuery 中的逗号表示并集，而不是连接。这是 BigQuery 与标准 SQL 语法的主要区别之一。\n\
  \n示例如下：\n\n```\nSELECT\n     fullVisitorId, totals.hits\nFROM\n     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910],\n\
  \     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130911]\n```\n\
  \n**注意：** 伦敦自行车头盔数据集仅包含一个单日表（2013 年 9 月 10 日），因此此示例会执行失败。请在你自己的数据集上尝试一些日期。\n\n如果你只想列出两三天，这种语法没问题，但超过这个范围，就会变得笨拙。为方便起见，BigQuery\
  \ 还包含了`TABLE_DATE_RANGE()`函数（及其姊妹函数`TABLE_DATE_RANGE_STRICT()`）。这允许你匹配一个日期范围。`TABLE_DATE_RANGE()`通过接受一个前缀，并为其给定范围内的每一天附加日期，然后将所有表合并在一起。（`TABLE_DATE_RANGE_STRICT()`工作方式类似，但如果日期范围内缺少任何表，则会返回错误。）\n\
  \n你会注意到，在 GA 导出中，所有表名都以`ga_sessions_`开头，后跟`YYYYMMDD`格式的日期。你可以像这样使用`TABLE_DATE_RANGE()`来合并这些表：\n\
  \n```\nSELECT\n     fullVisitorId, totals.hits\nFROM\n     TABLE_DATE_RANGE(\n \
  \         [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_],\n    \
  \      TIMESTAMP('2013-09-01'),\n          TIMESTAMP('2013-09-30'))\n```\n\n\n\n\
  ### 展平包含重复字段的表\n\n与传统的关联式数据库不同，在 BigQuery 中，你可以拥有可重复的字段。例如，`hits` 记录在一次会话中会重复多次，每次的值都不同。\n\
  \n`FLATTEN` 表达式会处理一个重复字段，并为该重复字段的每个值生成一行结果（其他所有字段会被复制）。如果你的 `SELECT` 子句中只有一个重复字段，BigQuery\
  \ 会自动对结果进行 `FLATTEN` 处理：\n\n```\nSELECT\n     CONCAT(fullVisitorId, \".\", STRING(visitId))\
  \ AS Session_ID,\n     hits.page.pagePath AS Page\nFROM\n     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  ```\n\n```\n     Session_ID                     Page\n1    380066991751227408.1378805776\
  \  /vests/\n2    380066991751227408.1378805776  /vests/orange.html\n3    380066991751227408.1378805776\
  \  /vests/orange.html\n4    380066991751227408.1378805776  /login.html\n5    380066991751227408.1378805776\
  \  /login.html\n```\n\n这与使用以下显式包含 `FLATTEN` 语句的查询是等效的：\n\n```\nSELECT\n     CONCAT(fullVisitorId,\
  \ \".\", STRING(visitId)) AS Session_ID,\n     hits.page.pagePath AS Page\nFROM\n\
  \     FLATTEN([google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910],\
  \ hits)\n```\n\n当 `SELECT` 查询中只有一个重复字段时（如此示例中的 `hits`），`FLATTEN` 语句是隐式的。但是，如果你想组合多个重复字段，比如同时使用\
  \ `hits` 和 `customDimensions`，你必须先对其中一个字段应用 `FLATTEN`：\n\n```\nSELECT\n     CONCAT(fullVisitorId,\
  \ \".\", STRING(visitId)) AS Session_ID,\n     hits.page.pagePath AS Page,\n   \
  \  customDimensions.index AS CD_Index,\n     customDimensions.value AS CD_Value\n\
  FROM\n     FLATTEN([google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910],\
  \ hits)\n```\n\n以下是结果（为了展示 `CD_Index` 和 `CD_Value` 列中的一些有趣数据，增加了几行）：\n\n```\n  \
  \   Session_ID                     Page                    CD_Index  CD_Value\n\
  1    380066991751227408.1378805776  /helmets/foldable.html  null      null\n2  \
  \  380066991751227408.1378805776  /helmets/foldable.html  null      null\n3    380066991751227408.1378805776\
  \  /helmets/foldable.html  null      null\n4    380066991751227408.1378805776  /\
  \                       null      null\n5    380066991751227408.1378805776  /vests/\
  \                 null      null\n6    380066991751227408.1378805776  /vests/yellow.html\
  \      null      null\n7    380066991751227408.1378805776  /vests/yellow.html  \
  \    null      null\n8    380066991751227408.1378805776  /                     \
  \  null      null\n9    712553853382222331.1378804218  /vests/                 2\
  \         Bronze\n10   712553853382222331.1378804218  /vests/                 3\
  \         Yes\n11   712553853382222331.1378804218  /vests/orange.html      2   \
  \      Bronze\n12   712553853382222331.1378804218  /vests/orange.html      3   \
  \      Yes\n13   712553853382222331.1378804218  /vests/orange.html      2      \
  \   Bronze\n14   712553853382222331.1378804218  /vests/orange.html      3      \
  \   Yes\n15   712553853382222331.1378804218  /login.html             2         Bronze\n\
  ```\n\n如果你编写了一个包含多个重复字段的查询，但没有正确地应用 `FLATTEN`，将会收到一个错误：\n\n```\nCannot output multiple\
  \ independently repeated fields at the same time.\n```\n\n### 按字段排序\n\n你常常会希望按照特定的顺序获取信息：例如，按用户浏览的页面数量排序。你可以使用\
  \ `ORDER BY` 子句对结果进行排序，排序方式可以是 `ASC`（从小到大）或 `DESC`（从大到小）。`ORDER BY` 与 `LIMIT` 结合使用非常有用，比如获取前\
  \ 5 个（或后 5 个）最大值。\n\n```\nSELECT\n     CONCAT(fullVisitorId, \".\", STRING(visitId))\
  \ AS Session_ID,\n     totals.pageviews AS Pageviews\nFROM\n     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  ORDER BY\n     Pageviews DESC\nLIMIT 5\n```\n\n```\n     Session_ID            \
  \          Pageviews\n1    6865576331513008945.1378805428  15\n2    7715166900416604175.1378805776\
  \  12\n3    8266000033835867941.1378803597  10\n4    7236424239009423246.1378806189\
  \  10\n5    5682534891274575276.1378819500  9\n```\n\n请注意，使用 `AS` 重命名字段后，你可以使用你创建的名称，如\
  \ `ORDER BY` 子句中的 `Pageviews` 所示。\n\n### 分组字段\n\n到目前为止，你已经了解了如何从表中检索字段以及如何在整个数据集上进行聚合。现在，让我们来看看如何使用\
  \ `GROUP BY` 对字段进行分组，以聚合值。\n\n例如，到目前为止，你已经了解了如何查询网站的聚合总页面浏览量，以及按会话（针对表中的每条记录）查询页面浏览量。如果你想要每个用户（基于\
  \ `fullVisitorId`）的页面浏览量呢？这就是 `GROUP BY` 子句的用途：为字段中具有特定值的每一行应用一个聚合函数。你可以应用 `SUM()`\
  \ 聚合函数，并按用户进行 `GROUP BY`：\n\n```\nSELECT\n     fullVisitorId AS Client_ID,\n   \
  \  SUM(totals.pageviews) AS Pageviews,\n     COUNT(visitId) AS Sessions\nFROM\n\
  \     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\nGROUP\
  \ BY\n     Client_ID\nORDER BY\n     Pageviews DESC\nLIMIT 5\n```\n\n```\n     Client_ID\
  \            Pageviews  Sessions\n1    6865576331513008945  15         1\n2    9007483028904009722\
  \  12         3\n3    8266000033835867941  12         2\n4    7715166900416604175\
  \  12         1\n5    3878411695083249177  11         2\n```\n\n现在，你已经汇总了每个用户（`Client_ID`）的总页面浏览量，即使某些用户拥有多个会话！例如，结果中的第\
  \ 2 行显示了一个用户，该用户在所查询的天数内，跨三个不同会话共有 12 次页面浏览量。\n\n请注意，如果你 `SELECT` 了一个字段值（例如 `fullVisitorId`）和聚合函数（例如\
  \ `SUM(totals.pageviews)`），则必须对字段值进行 `GROUP BY`。否则，查询将没有意义，并且你会收到一条错误消息。\n\n###\
  \ 查找满足条件的数据\n\n通常，你感兴趣的可能是数据的子集，而非全量数据：比如某个特定用户、页面、流量来源等。类似于在 GA 中构建细分，你可以在 BigQuery\
  \ 中使用 `WHERE` 子句将查询限制为符合一个或多个条件的数据。\n\n例如，考虑以下查询：\n\n```\nSELECT\n     CONCAT(fullVisitorId,\
  \ \".\", STRING(visitId)) AS Session_ID,\n     totals.pageviews AS Pageviews\nFROM\n\
  \     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\nWHERE\n\
  \     trafficSource.medium=\"organic\"\n```\n\n这个查询与你之前用来查看按会话统计的页面浏览量的查询相同，只是增加了一个\
  \ `WHERE` 子句，只选择流量媒介标签为“organic”的会话。你可以在 `WHERE` 子句中使用 `OR` 和 `AND` 来组合多个条件。\n\n\
  ## 更多 Google Analytics 示例\n\n现在你已经了解了 BigQuery 中查询的基本语法，这里提供几个更复杂的、针对 GA 数据实际应用的示例。\n\
  \n\n\n### 关于代码块的注意事项\n\n本文中的 SQL 查询和结果集示例应使用 Markdown 代码块格式，以保持其原始结构。所有变量名、函数名、路径名等均已添加反引号。\n\
  \n### 按着陆页统计的跳出率\n\n之前的查询计算了整体跳出率。现在，我们尝试按着陆页分组进行计算：\n\n```sql\nSELECT\n     hits.page.pagePath\
  \ AS Landing Page,\n     COUNT(totals.bounces)/COUNT(totals.hits) AS Bounce_Rate,\n\
  \     COUNT(totals.bounces) AS Bounces,\n     COUNT(totals.hits) AS Entrances\n\
  FROM\n     [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  WHERE\n     hits.type=\"PAGE\" AND hits.hitNumber=1\nGROUP BY\n     Landing Page\n\
  ORDER BY\n     Entrances DESC\n     Landing Page            Bounce_Rate        \
  \  Bounces  Entrances\n1    /                       0.13043478260869565  3     \
  \   23\n2    /helmets/foldable.html  0.25                 3        12\n3    /helmets/\
  \               0.2222222222222222   2        9\n4    /vests/                 0.16666666666666666\
  \  1        6\n5    /vests/orange.html      0.3333333333333333   1        3\n```\n\
  \n该查询中的 `WHERE` 子句是通过 `AND` 组合两个条件的示例。它使用了 `hits.type=\"Page\"` 和 `hits.hitNumber=1`\
  \ 来仅获取着陆页（会话中第一次页面浏览的 URL）。\n\n请注意，此查询会自动进行 `FLATTEN` 处理，因为您是从重复字段 `hits` 中进行选择。\n\
  \n### 按自定义维度细分\n\n自定义维度以重复字段的形式包含在 BigQuery 的 GA 数据中，该字段包含索引和值。（有关自定义维度的更多信息，请参见第\
  \ 11 章）。自定义维度的一个常见用途是细分：使用自定义维度值来定义您感兴趣的特定受众。\n\n在 `WHERE` 子句中使用字段（例如之前的 `trafficSource.medium`\
  \ 示例）进行细分很容易，但对于自定义维度（一个由两部分组成的重复字段）来说，则稍微复杂一些。\n\n在伦敦自行车头盔数据中，有几个自定义维度。索引为 2 的自定义维度是一个用户作用域的自定义维度，用于客户类型，其值可以是\
  \ `Bronze` 或 `Platinum`，反映了优选客户状态。（此维度为 null 或没有值则表示普通客户。）\n\n以下查询用于查找具有 `Platinum`\
  \ 状态的用户：\n\n```sql\nSELECT\n     fullVisitorId AS Client_ID,\n     LAST(IF(\n  \
  \        hits.customDimensions.index=2,\n          hits.customDimensions.value,\n\
  \          \"Regular\")) WITHIN RECORD AS Customer_Type\nFROM [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910]\n\
  HAVING Customer_Type = \"Platinum\"\n```\n\n此查询展示了几个新概念的示例：\n\n- `IF()` 是一个函数，它接受一个条件、一个条件为真时返回的值以及一个条件为假时返回的值。在此示例中，它仅为索引为\
  \ 2 的自定义维度返回值。\n- `LAST()` 是一个聚合函数（类似于 `SUM()`、`COUNT()` 等），它获取最后一个顺序值。在此示例中，它返回自定义维度的最后一个值（例如，以防有人在会话期间从\
  \ `Bronze` 升级到 `Platinum` 状态）。\n- `WITHIN RECORD` 允许我们在单个记录内使用聚合函数（在此示例中，使用 `LAST()`\
  \ 获取会话中的最后一个值）。\n- `HAVING` 类似于 `WHERE`，但可用于过滤聚合函数的结果。（`WHERE` 为要包含在 `SELECT` 语句中的记录定义条件，因此不能在\
  \ `WHERE` 子句中使用聚合函数值。）\n\n### 自定义维度值的指标\n\n除了上一个示例中的细分之外，您可能还想比较维度各值之间的指标，并使用更复杂的选择标准跨字段进行聚合。以下是一个示例：\n\
  \n```sql\nSELECT\n     Customer_Type,\n     COUNT(fullVisitorId) AS Users,\n   \
  \  SUM(totals.transactionRevenue)/1000000 AS Revenue,\n     SUM(totals.transactionRevenue)/1000000/COUNT(fullVisitorId)\
  \ AS Revenue_per_User\nFROM\n     (SELECT\n          fullVisitorId,\n          totals.transactionRevenue,\n\
  \          LAST(IF(\n              hits.customDimensions.index=2,\n            \
  \  hits.customDimensions.value,\n              \"Regular\")) WITHIN RECORD as Customer_Type\n\
  \     FROM [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910])\n\
  GROUP BY Customer_Type\n     Customer_Type  Users  Revenue  Revenue_per_User\n1\
  \    Regular        43     104.12   2.4213953488372093\n2    Bronze         12 \
  \    44.98    3.748333333333333\n3    Platinum       8      57.13    7.14125\n```\n\
  \n结果表明，Platinum 客户的平均价值大约是 Bronze 客户的两倍，是普通客户的三倍。太酷了！\n\n此查询展示了一个新概念——子查询的示例。`FROM`\
  \ 子句可以包含一个嵌套的 `SELECT` 语句，而不是直接从表中进行选择。在此示例中，它用于选择一些值（包括上一个示例中用于客户类型的自定义维度）。然后，外部的\
  \ `SELECT` 子句聚合这些值并按客户类型进行分组。\n\n### 数据透视维度\n\n最后，让我们来看一下构建数据透视表，以查看两个不同维度之间某个指标的交集。例如，假设您想按客户类型查看产品购买情况。以下是一个示例查询：\n\
  \n```sql\nSELECT\n     Sku,\n     SUM(IF(Customer_Type=\"Bronze\", Quantity, 0))\
  \ AS Bronze,\n     SUM(IF(Customer_Type=\"Platinum\", Quantity, 0)) AS Platinum,\n\
  \     SUM(IF(Customer_Type IS NULL, Quantity, 0)) AS none\nFROM\n  (SELECT\n   \
  \    hits.item.productSku AS Sku,\n       hits.item.itemQuantity AS Quantity,\n\
  \       LAST(IF(\n            hits.customDimensions.index=2,\n            hits.customDimensions.value,\n\
  \            NULL)) WITHIN RECORD AS Customer_Type\n   FROM [google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910])\n\
  WHERE Sku IS NOT NULL\nGROUP BY Sku\n     Sku            Bronze  Platinum  none\n\
  1    VEST-ORANGE-4  2       0         2\n2    HELM-HEAVY-2   3       0         1\n\
  3    HELM-FOLD-1    0       2         4\n4    VEST-YELLOW-5  0       1         2\n\
  5    HELM-LIGHT-3   0       2         0\n```\n\n结果将产品 SKU 放在行中，客户类型放在列中，值为购买数量。\n\
  \n此示例使用了上一个示例中的子查询概念，并在聚合函数中使用 `IF()` 按客户类型对数据进行透视。此外，表达式 `IS NULL` 和 `IS NOT NULL`\
  \ 可帮助排除空白字段或对它们进行不同处理，如所示。\n\n\n\n### 连接数据\n\n前述示例均使用了单一表或一组表，且这些表都拥有相同的架构。有时，在\
  \ BigQuery 中分析 GA 数据最有趣的应用场景在于将其与其他来源的数据相结合。（关于此类应用的更多讨论，请参见下一节。）与其他数据库系统一样，BigQuery\
  \ 也支持 `JOIN` 语句来组合多个表或查询。\n\n例如，假设你拥有退款数据（来自订单处理系统），希望将其与 GA 中的电子商务交易数据结合，以便更深入地了解净收入（即退款后的收入）。伦敦自行车头盔数据集实际上包含一个示例表\
  \ `refunds_201309`，其中就含有此类信息。让我们来看一个使用 `JOIN` 将该表与 GA 数据结合的查询：\n\n```\nSELECT\n\
  \     hits.transaction.transactionId AS Transaction_ID,\n     hits.transaction.transactionRevenue/1000000\
  \ AS Revenue,\n     Refund_data.RefundAmount AS Refunded,\n     hits.transaction.transactionRevenue/1000000-\
  \ Refund_data.RefundAmount AS Net_Revenue\nFROM FLATTEN([google.com:analytics-bigquery:LondonCycleHelmet.ga_sessions_20130910],hits)\
  \ AS GA_data\nJOIN\n    (SELECT TransactionId, RefundAmount\n     FROM [google.com:analytics-bigquery:LondonCycleHelmet.refunds_201309])\
  \ AS Refund_data\n    ON GA_data.hits.transaction.transactionId = Refund_data.TransactionId\n\
  WHERE hits.type = \"TRANSACTION\"\n     Transaction_ID  Revenue  Refunded  Net_Revenue\n\
  1    LCH75081220828  11.15    11.15     0.0\n2    LCH99499967532  7.56     7.56\
  \      0.0\n3    LCH69093459403  12.99    12.99     0.0\n4    LCH59885020485  12.99\
  \    12.99     0.0\n5    LCH62189793867  21.15    10.0      11.15\n```\n\n`JOIN`\
  \ 语句包含一个 `FROM` 第二个表的 `SELECT` 子句，其中 `ON` 子句指定了两个表用于连接所共享的值。\n\n结果中包含了交易 ID，这是已连接表之间共享的值，同时展示了来自\
  \ GA 的收入、退款表中的退款金额，以及两者之差计算得出的净收入。\n\n**注意**\n\n示例数据使用的是基础电子商务（而非增强型电子商务；有关差异的详细信息，请参见第\
  \ 7 章）。如果你的网站使用增强型电子商务，则需要修改查询，以便使用增强型电子商务数据中的交易 ID。\n\n这是一个所谓的 `INNER JOIN`（内连接）示例，这意味着只有两个数据集中具有对应值的记录才会被包含在结果中。与其他\
  \ SQL 方言一样，BigQuery 也支持 `OUTER JOIN`（外连接）（`LEFT`（左连接）、`RIGHT`（右连接）或 `FULL`（全连接））和\
  \ `CROSS JOIN`（交叉连接）功能。\n\n**注意**\n\n如果你熟悉关系数据库中的 `JOIN`，应了解它们在 BigQuery 中的工作方式有所不同。BigQuery\
  \ 在处理嵌套、非规范化的记录集时效率最高，并且未针对规范化结构进行优化。在将数据集加载到 BigQuery 之前，不应对其进行规范化，并且应谨慎使用 `JOIN`。\n\
  \n## 在数据分析中运用 GA 与 BigQuery 的策略\n\n既然你已经了解了 BigQuery 的一些功能及其查询 GA 数据的方式，让我们退一步，从全局角度进行审视。在充分利用网站、营销和客户关系相关数据的整体战略中，BigQuery\
  \ 扮演着怎样的角色？\n\nBigQuery 既可以作为数据的目的地，也可以作为数据的来源（参见图 15-4）。左侧是数据流入 BigQuery。正如 GA\
  \ 数据可以导出到 BigQuery 一样，其他系统也可能成为数据源，从而将 BigQuery 转变为存储多种你想要组合并查询的数据类型的仓库。\n\n![A978-1-4842-0265-4_15_Fig4_HTML.gif](img/A978-1-4842-0265-4_15_Fig4_HTML.gif)\n\
  \n图 15-4. 使用网页分析数据及其他数据在 BigQuery 中进行数据处理的架构\n\n右侧则是从 BigQuery 中提取数据。通过 BigQuery\
  \ 查询组合而成的数据集可以路由到其他数据仓库系统，供报表或商业智能工具使用，或者作为统计建模或数据挖掘算法的输入。\n\n### 将数据导入 BigQuery\n\
  \n来自其他来源的数据可以导入到 BigQuery 中，以便与 GA 数据进行连接。这有许多潜在的应用场景：\n\n- 任何可用于“数据导入”的数据类型（参见第\
  \ 12 章）也可以导入到 BigQuery 中并与 GA 数据进行 `JOIN`。这种方法的好处包括能够丰富历史数据（而“数据导入”仅适用于新收集的数据），以及能够利用个人身份信息（这在\
  \ GA 内是被禁止的）。\n- 来自其他来源的活动流数据，类似于 GA 中的数据。例如，你的电子邮件营销系统可能包含用户收到、打开和点击的电子邮件记录。你的\
  \ CRM 系统可能包含了与用户通过电话或当面互动的**时间线**。你可能还拥有针对用户的直邮或其他营销记录。BigQuery 是一个可以针对已识别用户整合所有这些信息的地方。\n\
  \nBigQuery 与 Google Cloud Platform（GCP）的其他产品（如 App Engine、Cloud Storage 和 Dataflow）一样，提供了多种\
  \ API 来实现从这些来源自动导入数据。\n\n与更传统的数据仓库系统相比，以这种方式将 BigQuery 用作数据仓库具有若干优势。BigQuery 是一个快速且可靠的查询大型数据集的引擎，其基础源于谷歌对此类工具的经验和需求，代表了从\
  \ Hadoop 等工具演进而来的下一代解决方案。GCP 产品在云端运行，减少了本地解决方案的硬件管理挑战。此外，BigQuery 和其他一些关键的 GCP 产品都是完全托管的服务，在很大程度上消除了在配置和维护解决方案时的猜测工作。\n\
  \n### 提取数据以用于其他应用程序\n\n来自 BigQuery 的数据也可以作为其他工具的来源：\n\n- BigQuery 中的数据可以完整或部分地复制到其他数据仓库系统中。\n\
  - 报表、可视化和商业智能工具可以访问数据，以构建报告或仪表板。简单的解决方案包括在 Google Sheets 中访问 BigQuery 数据。流行的数据探索和可视化工具\
  \ Tableau 将 BigQuery 作为数据源。许多商业智能平台都可以将 BigQuery 作为源数据库进行访问。\n- 统计建模和数据挖掘工具可以将 BigQuery\
  \ 的查询结果数据作为算法输入，用于预测分析、数据简化、细分、关联和聚类分析等。这是将未聚合的 GA 数据用于 BigQuery 最有前景的机会之一，因为此类分析在很大程度上无法使用聚合数据完成。统计编程语言\
  \ R 以及 Python 中的 Pandas 库（这些应用中最常用的工具集）都支持将 BigQuery 作为数据源。\n\n\n\n## 摘要\n\n*  \
  \ `BigQuery` 是谷歌云平台的一项工具，作为一个针对大规模数据集查询优化的数据库。它使用类 SQL 的查询语言，但在某些方面与传统关系型数据库有所不同。用户可以通过网页界面、命令行工具和\
  \ API 访问它。\n*   对于谷歌分析（Google Analytics）付费用户，其数据可以以未聚合的、点击级别的形式导出到 `BigQuery`。\n\
  *   `BigQuery` 可作为谷歌分析数据以及营销活动和客户关系等其他数据的数据仓库。`BigQuery` 的输出可用于向报表工具、其他数据仓库系统和统计模型提供数据。\n\
  \n脚注 1\n[`https://cloud.google.com/bigquery/pricing`](https://cloud.google.com/bigquery/pricing)\n\
  \n2\n[`https://bigquery.cloud.google.com`](https://bigquery.cloud.google.com/)\n\
  \n3\n[`https://support.google.com/analytics/answer/3437719`](https://support.google.com/analytics/answer/3437719)\n\
  \n4\n[`https://support.google.com/analytics/topic/3416089`](https://support.google.com/analytics/topic/3416089)\n\
  \n5\n[`https://cloud.google.com/bigquery/docs`](https://cloud.google.com/bigquery/docs)\n\
  \n6\n如架构文档所述。\n\n"
- '# 谷歌跟踪代码管理器与谷歌分析 API


  > 然而，爱丽丝已经非常习惯于只期待不寻常的事情发生，以至于生活按照平常的方式进行，反而显得相当枯燥乏味。 ——刘易斯·卡罗尔，《爱丽丝梦游仙境》


  本书主要侧重于使用 `GTM` 和 `GA` 网页界面进行配置，以便将数据导入报表。然而，有必要提及的是，这两个工具都提供了用于配置和导出数据的 API。


  应用程序编程接口（`API`）只是第三方应用程序或脚本读取或写入数据到另一个工具的标准化方式。与 API 交互通常需要具备某种编程或脚本语言（如 Java 或
  Python）的熟练使用能力，尽管对于不太熟练的开发人员来说，也有一些轻量级的可能性（例如，使用嵌入 API 的 HTML 和 JavaScript 解决方案）。本附录概述了可用的
  API，并讨论了如何使用它们，但并未包含使用这些 API 进行编程的深入示例。有大量的文档和示例代码，以及一些有用的工具，供你进一步探索。¹


  此外，还存在一个现有生态系统，包含许多免费和付费的第三方产品，它们都在利用这些 API。你可以在 `GA` 合作伙伴应用商店中找到与 `GA` 和 `GTM`
  集成的产品目录。²


  ## 谷歌 API 基础


  谷歌为其众多产品提供了 API。这些 API 中的大多数共享相同的基础架构和设计模式。一些常见功能包括：


  *   **授权**：谷歌使用 OAuth 授权来提供对您账户的访问权限（相当于在网站上使用电子邮件和密码登录）。OAuth 既支持客户端身份验证（适用于用户拥有适当访问权限并登录产品的场景），也支持服务器端身份验证（适用于自动仪表板更新、定时数据管道等场景）。

  *   **客户端库**：这些 API 是 REST API，可以通过任何方法经由 HTTP 访问。然而，官方提供了多种语言的客户端库。覆盖范围因 API 和语言而异。通常，Java
  和 Python 拥有最完整的库和文档。

  *   **配额**：这些 API 对在给定时间段内可以发出的请求数量设有配额。您可以通过 Google API 控制台管理您的配额使用情况。³ 如果特定应用程序有需要，可以申请调整配额。


  借助共享基础架构的谷歌 API，`GA`/`GTM` 与其他谷歌工具（如 Google Sheets 和 Google Cloud Platform）之间的集成得以简化。尽管这些
  API 可以从任何工具或环境工作，但通常的做法是，在适当的情况下使用多种谷歌提供的工具和系统，以最少的组件拼接来实现您的目标。


  ## 谷歌跟踪代码管理器 API


  `GTM` API 用于访问和更新代码、触发器和变量。因此，它是构建便捷工具的基础，这些工具可以在不使用网页界面的情况下设置容器：复制容器、对多个容器执行自动化更改等。请记住，`GTM`
  本身不包含任何数据；它仅能确保数据被发送到其他工具（如 `GA`），因此 `GTM` 的 API 完全专注于配置。


  `GTM` 的 API 能够完成我们在网页界面中可以做的所有事情：创建账户和容器；分配权限；设置代码、触发器和变量；以及发布和管理版本。


  ### GTM 容器 JSON 格式


  `GTM` API 使用标准化的 JSON 对象格式来表示容器版本的设置、代码、触发器和变量。该 JSON 对象格式在 `GTM` 文档中有详细说明⁴，并在 `GTM`
  API 中用于表示容器的内容，或使用新的设置、代码、触发器或变量来更新容器。


  我们还可以在 `GTM` 界面内使用相同的 JSON 格式导出和导入容器。这些选项可以在 `GTM` 管理区域的容器设置中找到（见图 A-1）。


  ![A978-1-4842-0265-4_16_Fig1_HTML.jpg](img/A978-1-4842-0265-4_16_Fig1_HTML.jpg)


  **图 A-1.** 在容器设置菜单中导入和导出 `GTM` 容器。


  ## 谷歌分析 API


  谷歌分析有两种类型的 API：配置和报表。


  *   **报表**：报表 API 可访问 `GA` 标准和自定义报表中提供的相同数据。您可以像在网页报表界面中一样，选择维度和指标、日期范围、过滤和排序选项，并应用细分来从
  `GA` 获取数据。

  *   **配置**：与 `GTM` API 类似，`GA` 的配置 API 专注于设置——即可以在 `GA` 管理区域中完成的操作，例如设置用户权限、关联 AdWords
  账户、设置视图和过滤器，以及创建目标转化。


  ### 报表 API


  主要的报表 API 是核心报表 API，它可以访问 `GA` 中的大部分数据。它由多渠道漏斗报表 API 和实时报表 API 补充，这些 API 可访问替代类型的数据。嵌入
  API 和元数据 API 围绕核心报表 API 提供了额外的便捷功能。


  #### 核心报表 API


  核心报表 API 允许访问与 `GA` 网页报表界面中的标准和自定义报表相同的数据。以编程方式访问这些数据的能力为自定义报表和仪表板、将 `GA` 数据集成到应用程序或网页内容中、与营销渠道或内部应用程序数据结合等开辟了无限可能。


  通过向请求中指定一个查询来访问核心报表 API。API 会针对该查询返回一个结果表。核心报表 API 中的查询具有许多选项；概述如下。


  ##### 指定视图


  每个查询必须指定一个 `GA` 中您希望从中提取数据的视图 ID。（当然，授权用户必须拥有对该视图的访问权限。）您可以在 `GA` 管理区域的视图设置中找到视图
  ID，或者通过使用管理 API 来获取。




  ### 维度与指标


  与 GA 网页界面中的报告由维度和指标构成一样，核心报告 API 中的查询也是如此。每个查询必须至少包含一个指标，最多可包含十个指标和七个维度。


  并非所有维度和指标在同一个查询中都兼容。在 GA 文档中，有一个名为“维度与指标浏览器”的工具。⁵ 它可以让你查看所有可用维度和指标的名称与描述，以及它们在 GA
  网页报告界面中的名称及其在 API 查询中的兼容性。在核心报告 API 中，维度和指标的名称以`ga:`为前缀（例如：`ga:pagePath`或`ga:sessions`）。


  ### 排序、过滤和细分


  核心报告 API 的查询可以按包含的任何维度或指标进行升序或降序排序。（维度按字母顺序排序，日期除外，日期按时间顺序排序；指标按数字顺序排序。）如果未指定排序顺序，GA
  会按第一个维度排序，这几乎从来都不是我们想要的！通常，我们感兴趣的是按基本指标（如`ga:sessions`或`ga:pageviews`）降序排序。


  与网页界面中的报告一样，你可以过滤查询结果的行。过滤器可以根据维度或指标值包含或排除行，包括对文本进行正则表达式匹配。过滤器可以通过逻辑“与”和“或”进行组合。


  此外，与网页界面中的报告一样，你可以应用细分。你可以从内置的细分中选择，也可以选择你之前在网页界面中为登录用户创建的细分，或者即时指定细分的条件。


  ### 日期范围、结果和分页


  每个查询都包含一个时间段。该 API 支持一些常见的简写，例如`today`、`yesterday`和`30daysAgo`。或者你也可以指定一个日期范围。


  默认情况下，查询返回 1,000 行结果（使用指定的排序顺序）。你可以指定返回的行数，范围从 1 到 10,000。如果结果超过 10,000 行，你可以为请求指定起始行。例如，你可以请求前
  10,000 行，然后发起第二个请求，请求从 10,001 行开始（到 20,000 行）的结果，依此类推。


  ### 查询浏览器工具


  基本上，你在 GA 网页界面的自定义报告中能想到的任何操作，都可以通过核心报告 API 来完成。探索核心报告 API 功能的一个好工具是“查询浏览器工具”。⁶
  该工具（图 A-2）使用下拉菜单系统来填写核心报告 API 请求，然后你可以提交并查看结果（或将其下载为文本文件）。


  ![A978-1-4842-0265-4_16_Fig2_HTML.jpg](img/A978-1-4842-0265-4_16_Fig2_HTML.jpg)


  图 A-2.


  查询浏览器工具是开始探索核心报告 API 可能性的好方法。


  ### 多渠道漏斗报告 API


  多渠道漏斗报告 API 允许访问 GA 中通过“转化” ➤ “多渠道漏斗”报告可获得的数据。这些数据处理的是促成转化的多个会话中的流量来源。


  由于此 API 处理的是多渠道会话数据，访问和处理这些数据与核心报告 API（基于单个会话）略有不同，但其应用类似：自定义报告和仪表板、与营销渠道数据集成等。多渠道漏斗报告
  API 中的维度和指标使用`mcf:`前缀。


  ### 实时报告 API


  实时 API 允许访问 GA 实时报告中的数据，包括页面、事件、目标转化、地理位置和流量来源。与核心报告 API 相比，这是一个更有限的数据集，但不同于核心报告
  API 的数据，这些数据是实时可用的。以编程方式访问这些数据使得实时仪表板或警报成为可能。实时报告 API 中的维度和指标使用`rt:`前缀。


  ### Embed API


  `Embed API`是一组 JavaScript 函数，为核心报告 API 提供了附加功能的封装。它包含一组组件，可以轻松完成以下任务：


  *   对用户进行授权，并从可用的帐户、媒体资源和数据视图中进行选择。

  *   针对核心报告 API 运行查询。

  *   使用 Google 图表将结果可视化。


  如果你刚开始探索 GA 报告 API，`Embed API`是一个很好的起点，因为它使用 JavaScript，可以在 Web 浏览器中轻松测试和迭代，它处理了
  OAuth 的繁重工作，并为数据提供了内置的可视化功能（图 A-3）。


  ![A978-1-4842-0265-4_16_Fig3_HTML.jpg](img/A978-1-4842-0265-4_16_Fig3_HTML.jpg)


  图 A-3.


  使用`Embed API`在不到 50 行的 HTML 和 JavaScript 代码中创建的图表。


  ### Metadata API


  `Metadata API`是 GA 的一个便捷 API，用于列出核心报告 API 中可用的维度和指标。这与前面提到的“维度与指标浏览器”工具类似，但它允许以编程方式访问这些信息。


  ### 配置 API


  GA 有两个配置 API。


  #### Management API


  `Management API`用于访问和更新 GA 中的配置设置，包括以下内容：


  *   创建、访问和更新媒体资源的设置。

  *   创建、访问和更新数据视图的设置。

  *   添加和更新用户权限。

  *   创建、访问和更新过滤器，并将其应用于数据视图。

  *   创建、访问和更新目标转化。

  *   添加和更新 AdWords 链接。

  *   创建、访问和更新自定义维度、指标和数据源。

  *   创建、访问和更新内容实验。

  *   创建和检索未抽样报告（仅限 GA Premium 版）。


  #### Provisioning API


  `Provisioning API`可用于在 GA 中创建帐户（然后可以通过`Management API`进行管理）。它旨在自动化 GA 的大规模部署，且仅限受邀合作伙伴使用。


