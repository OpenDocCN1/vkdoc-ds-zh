  \ False if you just use the default dataLayer variable, otherwise enter it here\n\
  \  'dataLayerName': false,\n  'distances': {\n    // Configure percentages of page\
  \ you’d like to see if users scroll past\n    'percentages': {\n      'each': [10,90],\n\
  \      'every': 25\n    },\n    // Configure for pixel measurements of page you’d\
  \ like to see if users scroll past\n    'pixels': {\n      'each': [],\n      'every':\
  \ null\n    }\n  },\n  // Accepts a number, DOM element, or query selector to determine\
  \ the top of the scrolling area\n  'top': null,\n  // Accepts a number, DOM element,\
  \ or query selector to determine the bottom of the scrolling area\n  'bottom': null,\n\
  }\n);\n</script>\n```\n\n对于标签的触发器，选择 `All Pages`。（或者，如果你只想跟踪网站上某些页面的滚动情况，可以在此处指定更严格的触发器。）\n\
  \n保存标签，为其命名：`Listener – Scroll Events`。\n\n\n\n## 理解滚动追踪脚本\n\n你无需完全理解此脚本的所有细节即可使用它，但简而言之，它的作用是：允许我们在一个配置对象（代码末尾的加粗部分）中设置一些断点（按百分比或像素），然后监控滚动活动，并在达到这些断点时向数据层发送一条消息（你可以在前面加粗的部分看到这一点）。此脚本包含的几个智能功能如下：\n\
  \n- 细致的跨浏览器支持，使其能够在最广泛的浏览器和版本中正常运行。\n- 一个缓存，用于捕获每个事件之前是否已被发送（例如，确保页面上只有一个 25%的滚动事件）。\n\
  - 一个计时器，用于限制滚动位置的检查频率（本例中最多每 500 毫秒检查一次），这样就不会在屏幕每次移动一个像素时都运行你的函数。\n\n这些概念值得在你创建的任何自定义事件监听器中加以运用。\n\
  \n接下来，让我们为`distance`数据层属性创建一个变量。\n\n创建一个新变量。对于变量类型，选择“数据层变量”。对于“数据层变量名称”，输入`attribute.distance`（这与前面代码中的名称相对应）。保存该变量，为其命名为“滚动进度”。\n\
  \n最后，创建一个标签，将这些数据作为事件发送到 GA（谷歌分析）。\n\n使用你之前创建的`{{GA Property ID}}`变量作为跟踪 ID。选择“跟踪类型”➤“事件”。填写要发送到\
  \ GA 的类别、操作和标签。你需要选择自己的约定来决定希望在报告中如何查看这些内容，但一个合理的选择可能是：\n\n- 类别：滚动\n- 操作：`{{Scroll\
  \ Progress}}`\n\n选择“继续”按钮来为标签指定一个触发器。选择“更多”，然后选择“新建”按钮来创建一个新的触发器。选择“自定义事件”作为触发该事件的事件类型。自定义事件允许你通过任何`event`名称触发`dataLayer.push`。在要匹配的事件名称中，输入`scrollTracking`（这与前面代码中的名称相对应）。选择“创建触发器”按钮，为其命名为“滚动追踪事件”。保存该标签，为其命名为“GA\
  \ – 事件 – 滚动追踪”。\n\n### 悬停及其他交互\n\n当用户点击一个元素时，可以使用 GTM 的自动事件追踪功能。JavaScript 还支持其他类型的交互，例如`mouseover`（即用户将鼠标移到某个元素上，这样你就可以追踪不一定导致点击的悬停行为）、`change`（用于在表单元素中输入文本或更改选择）以及其他许多交互。这些功能并未内置于\
  \ GTM 的自动事件追踪中，但你可以通过自定义 JavaScript 在现有模型基础上进行构建，以使用 GTM 追踪这些交互。\n\n### 扩展 GTM 的自动事件追踪模型\n\
  \n为悬停此类交互建模数据的一个合理方式是，与 GTM 为点击捕获的相同数据片段保持一致。² 你可以使用以下数据层消息来指示`mouseover`事件：\n\n\
  ```\ndataLayer.push({\n    'event': 'mouseover',\n    'gtm.element': 'http://aliceswonderlandresorts.com',\n\
  \    'gtm.elementClasses': 'button',\n    'gtm.elementId': 'link1',\n    'gtm.elementUrl':\
  \ 'http://aliceswonderlandresorts.com',\n    'gtm.elementTarget': '_blank'\n});\n\
  ```\n\n看起来眼熟吗？这就像 GTM 的自动事件追踪为点击所创建的数据层消息，只是事件名称是`mouseover`而不是`gtm.click`。这让你可以使用同一组熟悉的变量来设置事件标签。你唯一需要添加的是一个标签，该标签在所需交互发生时将此消息生成到数据层。\n\
  \n要做到这一点，你需要编写一些自己的 JavaScript 代码；请参考本章前面的侧边栏获取相关资源。上一节滚动追踪代码中的`addEvent`和`sendAnalyticsEvent`函数也是将功能扩展到你自己事件监听器的一个很好的基础示例。\n\
  \n## 社交互动\n\n页面中另一种常见的交互类型是社交行为：如今几乎无处不在的“点赞”和“推文”按钮（以及你能想到的任何其他社交网络）。虽然你可以使用 Google\
  \ Analytics 中的事件追踪来测量这些行为，但 GA 实际上有一种独立的、特定的命中类型，专门用于捕获社交交互的特定信息，并拥有自己的报告（在 GA 的“获取”➤“社交”➤“插件”报告中，该报告将与此类信息与关于你网站的社会化流量数据整合在一起）。\n\
  \n用于追踪社交互动的 GA 代码与事件追踪非常相似：\n\n```\nga('send', 'social', 'network', 'action', 'target');\n\
  ```\n\n社交互动使用网络、操作和目标，而不是事件的类别、操作和标签：\n\n- 网络指的是社交网络（Facebook、Twitter 等）\n- 操作指的是用户的行为（点赞、取消点赞、关注、发布推文、转发等）\n\
  - 目标是正在被点赞或发布推文的对象，通常是一个 URL（而且往往就是当前页面的 URL）\n\n当然，GTM 有一个标签可以为你生成 GA 代码，就像处理事件一样，你可以在其中填写网络、操作和目标变量（参见图\
  \ 5-6）。\n\n![A978-1-4842-0265-4_5_Fig6_HTML.jpg](img/A978-1-4842-0265-4_5_Fig6_HTML.jpg)\n\
  \n**图 5-6.** GTM 中的 GA 社交标签\n\n### 社交行为：发起与完成\n\n基于你在本章中已经看到的示例，为推文按钮（例如）设置一个带点击触发器的\
  \ GA 社交标签是很容易的。然而，挑战在于，点击推文按钮可能只是多个步骤中的第一步：首先，如果用户尚未登录，Twitter 会提示用户登录，然后用户可能会在最终发布前编辑推文。因此，发起这个过程的点击可能并不是你真正想要捕获的，你真正想要的是推文成功完成的那一刻。（另一个复杂之处在于，按钮可能存在于`iframe`元素中，这给直接追踪点击带来了额外的挑战。）\n\
  \n你的页面及其代码无法直接访问用户的 Twitter 活动（出于显而易见的安全和隐私原因）。因此，要测量社交行为的完成情况，通常需要与相关社交网络的 API\
  \ 进行交互。Twitter 的 API（它首先允许你在页面上包含一个推文按钮）也提供了在特定事件发生时（如发布推文、转发等）的回调函数。Facebook 对点赞（和取消点赞）也有类似的功能。这里我们来看一个针对\
  \ Facebook 的具体示例；你可以将此模型扩展到其他社交交互中，尽管具体细节将取决于社交网络及其提供的 API。\n\n\n\n### Facebook\
  \ 点赞\n\n跟踪 Facebook 点赞的基本方法与本章节中创建自定义监听器的其他示例类似：\n\n1.  创建一个自定义 HTML 标签，其中包含一个针对社交操作完成的事件监听器，该标签将在每个页面（或者至少是所有可能发生社交互动的页面）上触发。此标签将创建一条包含社交操作相关信息的\
  \ `dataLayer` 消息。\n2.  设置所需的变量，用于从 `dataLayer` 消息中提取信息。\n3.  设置一个跟踪类型为“社交”的 GA 标签，并使用变量填写网络、操作和目标。\n\
  \n由于模式保持不变，我们在此省略分步说明，仅查看不同的部分：自定义 HTML 标签监听器。（有关整个过程的详细分步示例，请参阅滚动跟踪部分。）\n\n用于监听\
  \ Facebook 点赞的自定义 HTML 标签可能如下所示：\n\n```javascript\n<script type=\"text/javascript\"\
  >\n    (function(window) {\n    var n = 0;\n    function checkIfSocialExists(n)\
  \ {\n       if(typeof window.FB !== 'undefined') { bindSocial()\n          } else\
  \ if(n < 30) {\n                 n++;\n            setTimeout(function() { checkIfSocialExists(n);\
  \ }, 500); }\n     }\n    checkIfSocialExists(0);\n    function socialTrack(network,\
  \ action, socialTarget, el) {\n        var target = typeof socialTarget === 'undefined'\
  \ ? '' : socialTarget;\n        dataLayer.push({\n          'event': 'socialShare',\n\
  \          'attributes': {\n              'network': network,\n              'action':\
  \ action,\n              'link': target }\n        });\n    }\n    function bindSocial()\
  \ {\n        FB.Event.subscribe('edge.create', function(targetUrl, el) {\n     \
  \     var lowerTarget = targetUrl.toLowerCase();\n          var type = 'share';\n\
  \          var trackTarget = targetUrl;\n          socialTrack('facebook', type,\
  \ trackTarget, el)\n        });\n      }\n    })(window);\n</script>\n```\n\n> **注意**：此代码假定您已经在页面中加载了\
  \ Facebook API，并在添加监听器之前检查 `FB` 对象是否存在。\n\n此监听器使用 Facebook API 方法 `FB.Event.subscribe`\
  \ 在发生分享事件时调用一个函数。推送一条包含详细信息的 `dataLayer` 消息。现在，您可以使用自定义事件 `socialShare` 在 GTM 中触发一个标签，并为\
  \ `dataLayer` 属性 `attributes.network`、`attributes.action` 和 `attributes.link` 创建变量，以填充\
  \ GA 社交标签。\n\n此监听器仅捕获点赞事件，但可以轻松调整以捕获取消点赞事件。\n\n### 视频\n\n页面中另一种常见的交互类型是嵌入媒体，通常是嵌入在页面中的视频。与社交网络按钮一样，每个视频平台都有自己的播放器，其实现细节各不相同。让我们来看看最常见的视频播放器：YouTube。\n\
  \n到目前位置，您应该已经熟悉此代码的基本模式：首先，一个自定义 JavaScript 监听器标签（使用 YouTube API），然后是一个 Google Analytics\
  \ 事件跟踪标签，将数据发送到 GA。再次，我们跳过逐步说明，直接切入正题。\n\n监听器标签如下所示：\n\n```javascript\n<script type=\"\
  text/javascript\">\n;(function( document, window, config ) {\n'use strict';\nwindow.onYouTubeIframeAPIReady\
  \ = (function() {\nvar cached = window.onYouTubeIframeAPIReady;\nreturn function()\
  \ {\nif( cached ) { cached.apply(this, arguments); }\n// 此脚本在 IE 6 或 7 上无法运行，因此如果检测到这些\
  \ UA，我们将在此处退出\nif( !navigator.userAgent.match( /MSIE [67]\\./gi ) ) { init(); }\n\
  };\n})();\nvar _config = config || {};\nvar forceSyntax = _config.forceSyntax ||\
  \ 0;\nvar dataLayerName = _config.dataLayerName || 'dataLayer';\n// 事件的默认配置\nvar\
  \ eventsFired = { 'Play': true, 'Pause' : true, 'Watch to End': true };\n// 用自定义配置覆盖默认值（如果存在）\n\
  var key;\nfor( key in _config.events ) {\nif( _config.events.hasOwnProperty( key\
  \ ) ) {\neventsFired[ key ] = _config.events[ key ]; }\n}\n// 当 YouTube API 就绪时由它调用\n\
  function init() {\nvar iframes = document.getElementsByTagName( 'iframe' );\nvar\
  \ embeds  = document.getElementsByTagName( 'embed' );\ndigestPotentialVideos( iframes\
  \ );\ndigestPotentialVideos( embeds );\n}\nvar tag            = document.createElement(\
  \ 'script' );\ntag.src            = '//www.youtube.com/iframe_api';\nvar firstScriptTag\
  \ = document.getElementsByTagName( 'script' )[0];\nfirstScriptTag.parentNode.insertBefore(\
  \ tag, firstScriptTag );\n// 将我们的视频转换为可跟踪的、带有事件的视频\nfunction digestPotentialVideos(\
  \ potentialVideos ) {\nvar i;\nfor( i = 0; i < potentialVideos.length; i++ ) {\n\
  var isYouTubeVideo = checkIfYouTubeVideo( potentialVideos[ i ] );\nif( isYouTubeVideo\
  \ ) {\nvar normalizedYouTubeIframe = normalizeYouTubeIframe( potentialVideos[ i\
  \ ] );\naddYouTubeEvents( normalizedYouTubeIframe ); }\n}\n}\n// 判断元素是否为 YouTube\
  \ 视频\nfunction checkIfYouTubeVideo( potentialYouTubeVideo ) {\nvar potentialYouTubeVideoSrc\
  \ = potentialYouTubeVideo.src || '';\nif( potentialYouTubeVideoSrc.indexOf( 'youtube.com/embed/'\
  \ ) > -1 ||\npotentialYouTubeVideoSrc.indexOf( 'youtube.com/v/' ) > -1 ) {\nreturn\
  \ true; }\nreturn false;\n}\n// 将嵌入对象转换为 iframe 对象，并确保它们具有正确的参数\nfunction normalizeYouTubeIframe(\
  \ youTubeVideo ) {\nvar a           = document.createElement( 'a' );\na.href   \
  \   = youTubeVideo.src;\na.hostname  = 'www.youtube.com';\na.protocol  = document.location.protocol;\n\
  var tmpPathname = a.pathname.charAt( 0 ) === '/' ? a.pathname : '/' + a.pathname;\
  \  // IE10 兼容处理\n// 出于安全原因，YouTube 希望设置一个与我们主机名匹配的 origin 参数\nvar origin = window.location.protocol\
  \ + '%2F%2F' + window.location.hostname + ( window.location.port ? ':' + window.location.port\
  \ : '' );\nif( a.search.indexOf( 'enablejsapi' ) === -1 ) {\na.search = ( a.search.length\
  \ > 0 ? a.search + '&' : '' ) + 'enablejsapi=1'; }\n// 本地测试时不设置\nif( a.search.indexOf(\
  \ 'origin' ) === -1  && window.location.hostname.indexOf( 'localhost' ) === -1 )\
  \ {\na.search = a.search + '&origin=' + origin; }\nif( youTubeVideo.type === 'application/x-shockwave-flash'\
  \ ) {\nvar newIframe     = document.createElement( 'iframe' );\nnewIframe.height\
  \  = youTubeVideo.height;\nnewIframe.width   = youTubeVideo.width;\ntmpPathname\
  \ = tmpPathname.replace('/v/', '/embed/');\n```\n\n\n```javascript\nyouTubeVideo.parentNode.parentNode.replaceChild(\
  \ newIframe, youTubeVideo.parentNode );\nyouTubeVideo = newIframe;\na.pathname =\
  \ tmpPathname;\nif(youTubeVideo.src !== a.href + a.hash) {\n    youTubeVideo.src\
  \ = a.href + a.hash;\n}\nreturn youTubeVideo;\n```\n\n```javascript\n// 为 YouTube\
  \ API 发出的事件添加事件处理程序\nfunction addYouTubeEvents( youTubeIframe ) {\n    youTubeIframe.pauseFlag\
  \  = false;\n    new YT.Player( youTubeIframe, {\n        events: {\n          \
  \  onStateChange: function( evt ) {\n                onStateChangeHandler( evt,\
  \ youTubeIframe );\n            }\n        }\n    } );\n}\n```\n\n```javascript\n\
  // 返回百分比与所需秒数的键值对\nfunction getMarks(duration) {\n    var marks = {};\n    // 为提供全面支持，我们通过已观看百分比来处理“观看至结尾”事件\n\
  \    if (_config.events[ 'Watch to End' ] ) {\n        marks[ 'Watch to End' ] =\
  \ duration * 99 / 100;\n    }\n    if( _config.percentageTracking ) {\n        var\
  \ points = [];\n        var i;\n        if( _config.percentageTracking.each ) {\n\
  \            points = points.concat( _config.percentageTracking.each );\n      \
  \  }\n        if( _config.percentageTracking.every ) {\n            var every =\
  \ parseInt( _config.percentageTracking.every, 10 );\n            var num = 100 /\
  \ every;\n            for( i = 1; i < num; i++ ) {\n                points.push(i\
  \ * every);\n            }\n        }\n        for(i = 0; i < points.length; i++)\
  \ {\n            var _point = points[i];\n            var _mark = _point + '%';\n\
  \            var _time = duration * _point / 100;\n            marks[_mark] = Math.floor(\
  \ _time );\n        }\n    }\n    return marks;\n}\n```\n\n```javascript\nfunction\
  \ checkCompletion(player, marks, videoId) {\n    var duration     = player.getDuration();\n\
  \    var currentTime  = player.getCurrentTime();\n    var playbackRate = player.getPlaybackRate();\n\
  \    player[videoId] = player[videoId] || {};\n    var key;\n    for( key in marks\
  \ ) {\n        if( marks[key] <= currentTime && !player[videoId][key] ) {\n    \
  \        player[videoId][key] = true;\n            fireAnalyticsEvent( videoId,\
  \ key );\n        }\n    }\n}\n```\n\n```javascript\n// YouTube API 事件的事件处理程序\n\
  function onStateChangeHandler( evt, youTubeIframe ) {\n    var stateIndex     =\
  \ evt.data;\n    var player         = evt.target;\n    var targetVideoUrl = player.getVideoUrl();\n\
  \    var targetVideoId  = targetVideoUrl.match( /[?&]v=([^&#]*)/ )[ 1 ];\n    var\
  \ playerState    = player.getPlayerState();\n    var duration       = player.getDuration();\n\
  \    var marks          = getMarks(duration);\n    var playerStatesIndex = {\n \
  \       '1' : 'Play',\n        '2' : 'Pause'\n    };\n    var state = playerStatesIndex[\
  \ stateIndex ];\n    youTubeIframe.playTracker = youTubeIframe.playTracker || {};\n\
  \    if( playerState === 1 && !youTubeIframe.timer ) {\n        clearInterval(youTubeIframe.timer);\n\
  \        youTubeIframe.timer = setInterval(function() {\n            checkCompletion(player,\
  \ marks, youTubeIframe.videoId);\n        }, 1000);\n    } else {\n        clearInterval(youTubeIframe.timer);\n\
  \        youTubeIframe.timer = false;\n    }\n    if( stateIndex === 1 ) {\n   \
  \     youTubeIframe.playTracker[ targetVideoId ] = true;\n        youTubeIframe.videoId\
  \ = targetVideoId;\n        youTubeIframe.pauseFlag = false;\n    }\n    if( !youTubeIframe.playTracker[\
  \ youTubeIframe.videoId ] ) {\n        return false;\n    }\n    if( stateIndex\
  \ === 2 ) {\n        if( !youTubeIframe.pauseFlag ) {\n            youTubeIframe.pauseFlag\
  \ = true;\n        } else {\n            return false;\n        }\n    }\n    if(\
  \ eventsFired[ state ] ) {\n        fireAnalyticsEvent( youTubeIframe.videoId, state\
  \ );\n    }\n}\n```\n\n```javascript\n// 向 Google Analytics 或 Google Tag Manager\
  \ 发送事件\nfunction fireAnalyticsEvent( videoId, state ) {\n    var videoUrl = 'https://www.youtube.com/watch?v='\
  \ + videoId;\n    window[dataLayerName].push({\n        'event'     : 'youTubeTrack',\n\
  \        'attributes': {\n            'videoUrl': videoUrl,\n            'videoAction':\
  \ state\n        }\n    });\n}\n```\n\n```javascript\n})( document, window, {\n\
  \    'events': {\n        'Play': true,\n        'Pause': true,\n        'Watch\
  \ to End': true\n    },\n    'percentageTracking': {\n        'every': 25,\n   \
  \     'each': [ 10, 90 ]\n    }\n});\n```\n\n这遵循了本章前面滚动监听器的相同模型。它使用 YouTube 的播放器\
  \ API 来检测视频播放器状态的变更（如播放、暂停或观看至结尾），并将事件推送到数据层（如加粗部分所示）。它还衡量了播放完成百分比，该百分比在配置对象中的断点处可配置（代码末尾的加粗部分）。\n\
  \n每次数据层推送看起来像下面的示例：\n\n```javascript\ndataLayer.push({\n    'event'        : 'youTubeTrack',\n\
  \    'attributes'   : {\n        'videoURL'     : 'https://www.youtube.com/watch?v=msvOUUgv6m8',\n\
  \        'videoAction'  : 'Play'\n    }\n});\n```\n\n属性 `attributes.videoAction`\
  \ 是视频播放器的状态，而 `attributes.videoURL` 是直接指向 YouTube 上该视频的链接（其中也包含视频标识符）。现在，您可以使用自定义事件\
  \ `youTubeTrack` 在 GTM 中触发一个标签，并为数据层属性 `attributes.videoURL` 和 `attributes.videoAction`\
  \ 创建变量，以填充 GA 事件跟踪标签的操作和标签。\n\n## 总结\n\n*   Google Analytics 有两种点击类型——事件和社交，用于跟踪页面内的互动。GTM\
  \ 为每种类型都提供了内置标签。事件用于与页面内容的一般互动，包括下载链接、出站链接、选项卡和折叠面板、视频播放等示例。社交互动用于社交网络操作，例如在 Facebook\
  \ 上点赞页面或在 Twitter 上发布推文。\n*   在 GTM 中跟踪互动的挑战在于为互动选择合适的触发器，以及选择合适的变量来捕获相关数据。有三种基本方法：\n\
  \    *   使用 GTM 的自动事件跟踪，该功能具有内置能力来跟踪页面内项目的点击（以及其他一些场景，如表单和计时器）。\n    *   通过自定义 HTML\
  \ 标签和自定义 JavaScript 变量，对 GTM 的功能进行自定义扩展。掌握 JavaScript 和 DOM 知识对于编写脚本以监听自定义事件并从页面中提取信息尤其有用。\n\
  \    *   在页面上使用 JavaScript 向 GTM 发送数据。这是一种灵活且对开发者友好的方法，但此代码的管理工作将脱离 GTM 的控制范围。\n\
  *   互动事件在 GTM 的数据层中表示为消息。您可以使用这些消息来创建触发器，并为互动跟踪标签填充变量。\n\n## 脚注\n\n这个非常优雅的函数最初由\
  \ Stephane Hamel 在 GTM Google+社区提出。[1]\n\n感谢 Conversion Works 的 Doug Hall 首次提出这种模式。[2]\n\
  \n\n"
- "# 6. 目标：衡量转化\n\n> “请你告诉我，从这里我该走哪条路？” “这很大程度上取决于你想去往何方，”猫说。“我不太在乎去哪里——”爱丽丝说。“那么你走哪条路也就无关紧要了，”猫说。——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\
  \n网站分析中最重要的概念之一是转化，即一个单纯的网站访问者转变为客户的过程。定义转化的行为可以是任何对你有价值的用户交互，从重大行为（购买、联系请求）到次要行为（内容互动、订阅新闻通讯）。通过设置目标，Google\
  \ Analytics 允许你指定希望视为转化的交互类型。\n\nGA 有四种目标：\n\n- **目标页**，最常见的目标类型，基于网页浏览的 URL。通常用于某种确认或感谢页面，表明用户已完成某个流程。目标页还可以包含一个渠道，即一系列通向最终目标页的步骤（例如必须填写的一系列表单等）。\n\
  - **会话时长**和**每次会话浏览页数**目标基于这些指标超过给定阈值（用户在网站上停留超过 5 分钟，或浏览了超过 3 页）。\n- **事件目标**基于事件，即衡量下载、出站链接或视频播放等活动的非页面浏览交互（详见第\
  \ 5 章）。\n\n在许多情况下，基于你已在 GTM 中使用的标签和触发器，这些目标的创建是直接的。然而，在某些 URL 不会改变的情况下，例如动态的、由 AJAX\
  \ 驱动的流程，你可能需要在 GTM 中添加额外的标签和触发器来适应。本章将探讨在 GA 中设置目标，以及 GTM 中为应对此类情况所需的任何标签和触发器。\n\
  \n**边栏：为什么要设置目标？**\n\n请注意，这些目标并不代表 GA 数据中尚未可用的用户操作。那么，这些目标有什么用呢？\n\n首先，创建目标迫使你真正思考你的网站为何存在，以及你希望用户完成什么。\n\
  \n在 GA 中，创建目标会提升这些特定操作在 GA 报告中呈现时的重要性。诸如转化率等目标指标在 GA 的所有报告类型中都能轻松获取，并且还能通过多渠道漏斗报告等工具进行进一步分析。目标指标在报告中的易获取性，使得进行比较以及找到最有价值的受众和营销渠道变得简单直接。如果没有目标，你将不得不在报告中更费力地使用细分和其他工具来找到这些答案。\n\
  \n你还可以为你创建的 GA 目标分配货币价值，并且存在一些指标可以让你在报告中也比较这些价值。如果网站上有实际购买行为，你可以通过电子商务跟踪来捕获（详见第\
  \ 7 章）；但对于其他类型的网站，你仍然可以为目标分配一个现实世界中的价值。例如，对于潜在客户生成流程，你也许能够从 GA 外部收集数据（在过去一年网站产生的\
  \ 1000 个潜在客户中，10%促成了一笔销售，而每笔销售的平均价值为 500 美元），从而得出每个潜在客户的平均价值（在本例中，如果你计算一下，是 50 美元）。\n\
  \n或者，如果你的网站没有任何能与你现实货币价值挂钩的转化，你仍然可以将目标价值用作权衡其重要性的一种方式。也许你的主要目标是 100 美元，几个次要目标各为\
  \ 50 美元，一些较小的目标各为 10 美元。\n\n## 创建和组织目标\n\n目标是在 GA 的每个数据视图中创建的。你能在 GA 管理设置的视图列中找到你已创建的所有目标以及创建新目标的功能（见图\
  \ 6-1）。\n\n![A978-1-4842-0265-4_6_Fig1_HTML.jpg](img/A978-1-4842-0265-4_6_Fig1_HTML.jpg)\n\
  \n图 6-1. GA 管理部分中的目标设置\n\n每个视图最多有 20 个目标位置（见图 6-2）。你需要拥有视图的编辑权限才能编辑或创建目标。（关于创建视图的更多信息，请参见第\
  \ 8 章。）\n\n![A978-1-4842-0265-4_6_Fig2_HTML.jpg](img/A978-1-4842-0265-4_6_Fig2_HTML.jpg)\n\
  \n图 6-2. GA 中的目标列表\n\n设置目标，就像对 GA 管理设置进行其他任何更改一样，不会追溯重新处理报告视图中的现有数据。创建目标将只测量该目标在未来的转化。\n\
  \n### 在 Google Analytics 中创建目标\n\n让我们逐步了解如何在 GA 中创建一个目标。\n\n1. 在 GA 管理标签页的视图列中的**目标**部分，选择\
  \ **+ 新目标** 按钮。\n\n![A978-1-4842-0265-4_6_Figa_HTML.jpg](img/A978-1-4842-0265-4_6_Figa_HTML.jpg)\n\
  \n2. 输入目标的名称。该名称将作为目标在你 GA 报告中显示的标签，因此要描述得足够清楚，以便任何使用你数据的人都能明确该目标代表什么。\n3. （可选）选择一个目标位置。如前所述，每个视图有\
  \ 20 个目标位置。这些位置被分为四组，每组五个目标，分别对应报告中可查看的目标组。默认情况下，GA 会使用下一个空位，但你可以更改（例如，如果你想将最重要的目标放在前面，不重要的放在最后）。\n\
  4. 选择目标类型：**目标页**、**时长**、**每次会话浏览页数/屏幕数**或**事件**。然后选择 **下一步** 按钮以提供目标详情。\n5. 根据你选择的目标类型，在下一步中\
  \ GA 会要求你提供该目标的详细信息：\n\n- 对于**目标页**目标，你需要输入目标页的 URL，以及可选的导向目标的渠道页面 URL。这种类型的目标将在下一节详细探讨。\n\
  - 对于**时长**目标，通过输入小时、分钟和秒的数字来指定一个时间。如果一次会话的时长超过你在此处输入的时间，GA 将计为一次目标转化。\n\n![A978-1-4842-0265-4_6_Figb_HTML.jpg](img/A978-1-4842-0265-4_6_Figb_HTML.jpg)\n\
  \n- 对于**每次会话浏览页数/屏幕数**目标，指定一个页面数量。如果一次会话包含的页面数量（对于移动应用则是屏幕数；参见第 13 章）超过该数字，GA 将计为一次目标转化。\n\
  \n![A978-1-4842-0265-4_6_Figc_HTML.jpg](img/A978-1-4842-0265-4_6_Figc_HTML.jpg)\n\
  \n- 对于**事件**目标，你可以指定一个或多个标准用于事件（如类别、操作、标签和值），以满足此标准的事件计为目标转化。如果你设置了多个标准，则必须所有标准都为真，才能计为一次目标转化。（关于事件及其属性的更多信息，请参见第\
  \ 5 章。）\n\n![A978-1-4842-0265-4_6_Figd_HTML.jpg](img/A978-1-4842-0265-4_6_Figd_HTML.jpg)\n\
  \n6. （可选）对于任何类型的目标，设置一个货币值。（对于事件目标，你还有额外的选项可以使用事件值作为目标值。）\n7. 使用 **验证此目标** 选项来仔细检查你的目标设置。它会将你的目标设置与过去七天的数据进行比较，并显示本应记录的转化次数。如果得到\
  \ 0 次，但你确定曾有转化发生，请检查你的设置是否存在 URL、事件属性等方面的拼写错误。\n8. 选择 **创建目标** 按钮以保存目标。\n\n从现在开始，GA\
  \ 将开始在报告中计算此目标的转化。\n\n\n\n### 删除目标\n\n如果某个目标不再相关，您可以通过目标列表中的开关将其停用，这样它就 不会在报告中显示。\n\
  \n但请注意，没有删除目标的选项。与所有 GA（Google Analytics）数据一样，一旦数据进入报告，就无法回溯更改（包括删除现有目标数据）。不过，您可以通过更改目标的名称及其所有设置来重新使用该目标的“槽位”。从此以后，该目标槽位中的数据将归属于新目标，而历史数据则归属于旧目标。\n\
  \n**提示**  \nGA 的报告界面中不会显示目标设置何时发生更改，因此您应该添加注释，并考虑在目标标题中注明日期，以清晰说明更改情况。\n\n## 目标页面与渠道\n\
  \nGA 中最常见的目标类型是“目标页面”（Destination goal），它表示用户已到达某个特定页面（通过 URL 定义）。通常这是某个流程结束时到达的页面，即完成操作后的确认页面。不过，它也可以是您希望用户访问的任何重要页面。\n\
  \n对于具有一组步骤引导至最终目标的目标，您可以创建渠道。GA 将显示用户在该渠道中的行进进度，以便您了解流程中可能导致部分用户未能完成目标的“泄漏点”或“瓶颈”。\n\
  \nGA 中有两个报告会显示渠道数据，即“渠道可视化”和“目标流程”报告（均可在“转化” ➤ “目标”下找到）。这些报告提供了不同的可视化效果，以及对用户行为不同详细程度的洞察（见图\
  \ 6-3）。\n\n![A978-1-4842-0265-4_6_Fig3_HTML.jpg](img/A978-1-4842-0265-4_6_Fig3_HTML.jpg)\n\
  \n图 6-3.\n\n“渠道可视化”（上方）和“目标流程”（下方）报告展示了用户在各渠道步骤中的行进进度。\n\n**注意**  \n目标的渠道设置仅影响这些渠道报告。GA\
  \ 中基于该目标的所有其他指标（转化次数、转化率、价值）仅关注最终目标页面是否被到达。\n\n渠道是为用户完成某个流程所需经历的一系列步骤而设计的。这个序列可能包含可选步骤，或者允许返回上一步，但渠道隐含着一个从第一步到最后一步的顺序。您只应将用户按特定顺序行进以达成目标的步骤包含在渠道中。如果页面可以按任意顺序查看，那么渠道报告将无法展示特别有用的数据。\n\
  \n### 设置渠道\n\n在设置目标渠道之前，您需要知道流程中每一步的 URL。具体取决于流程是什么，您可能很容易在网站上手动操作（例如，填写联系表单并注明“抱歉，只是测试一下”）来查看\
  \ URL 是什么。在其他情况（如购买、账户注册等）下，流程可能更复杂或难以测试。您可能需要使用网站的测试版本，或查阅文档、咨询开发人员，以了解流程及其涉及的\
  \ URL 顺序。\n\n在某些情况下，您可能会遇到一系列步骤，但它们之间在 URL 上没有区别。本章稍后将探讨如何处理这些问题。\n\n#### 创建带渠道的目标页面\n\
  \n假设您已经收集了流程中各步骤的 URL 列表，那么我们来设置一个带渠道的目标页面目标。\n\n完成“在 Google Analytics 中创建目标”的步骤\
  \ 1-4，并选择`目标页面`作为目标类型。\n\n对于目标页面目标，需要输入的第一个目标详情设置是目标的最终 URL（见下方截图）。这代表转化：如果用户到达此页面，则视为发生转化；否则未转化。\n\
  \n![A978-1-4842-0265-4_6_Fige_HTML.jpg](img/A978-1-4842-0265-4_6_Fige_HTML.jpg)\n\
  \n在此处输入 URL，应与 GA 报告中的显示形式一致，通常以路径开头（不含主机名）。有三种匹配选项：\n\n*   **完全等于**：URL 必须与输入的内容完全匹配，不多不少。这是默认选项，在多数情况下适用，但当需要更大灵活性时，可使用以下两个选项。\n\
  *   **开头为**：URL 必须以输入的字符串开头，但 URL 末尾可以附加其他文本。这对于 URL 会根据用户选择或填写表单信息而出现多种变化的情况非常有用。例如：`/locations/retail?zipcode=`\
  \ `12345` `/request-a-quote/thank-you` `?Industry=Education&Country=US`\n*   **正则表达式**：URL\
  \ 必须匹配正则表达式模式。这提供了从通用到特定模式的极大匹配灵活性。您还可以选择输入的 URL 是否应区分大小写（通常不需要）。输入最终目标页面的完整 URL、部分\
  \ URL 或正则表达式模式。\n\n（可选）为目标分配一个货币价值。\n\n要创建渠道，请将渠道选项切换为`开启`。将出现一个列表，供您为每个步骤输入标签和\
  \ URL（见下方截图）。\n\n![A978-1-4842-0265-4_6_Figf_HTML.jpg](img/A978-1-4842-0265-4_6_Figf_HTML.jpg)\n\
  \n对于每个步骤，`名称`就是该步骤在渠道报告中的标签。`屏幕/页面`是该步骤的 URL 或正则表达式模式。渠道 URL 遵循与最终目标 URL 相同的规则——即之前在最终目标\
  \ URL 中选择的`完全等于`、`开头为`或`正则表达式`。您可以根据需要添加最终目标页面之前的任意多个步骤（最多 20 个，不过如果一个流程有 20 步，您可能需要重新考虑用户体验）。您无需在渠道步骤中重复目标\
  \ URL；最终目标 URL 始终被视为最后一步。最后，请注意第一步有一个额外的选项，即该步骤是否应为“必需”。本章稍后将进一步讨论这一点以及适用的情形。\n\n\
  使用`验证`按钮来检查目标。请注意，`验证`按钮仅测试最终的转化，不会测试每个单独的渠道步骤。（关于测试和验证渠道 URL 的更多建议将在后文提供）。\n\n\
  选择`创建目标`按钮以保存目标。\n\n从此之后，GA 将开始在您的报告中计算此目标的转化次数和渠道数据。\n\n\n\n## 测试目标和渠道漏斗 URL\n\n\
  目标设置期间的“验证”功能可快速检查您的目标 URL 是否合理。然而，它无法提供太多细节，也无法让您测试渠道步骤。测试目标设置中使用的 URL 模式的最佳方法是使用\
  \ Google Analytics 中的“行为”➤“网站内容”➤“所有页面”报告。此报告中显示的页面 URL 与 GA 用于比较目标设置和记录转化的 URL\
  \ 相同。\n\n您可以使用报表内过滤器上的高级选项（见图 6-4）来显示符合某些条件的 URL。请注意，可用的选项包括“完全匹配”、“开头为”和“正则表达式匹配”，这些对应于目标设置中的选项。您需要确保目标设置中的\
  \ URL 模式与您认为应该匹配的页面匹配（并且不与任何不应匹配的页面匹配）。\n\n![A978-1-4842-0265-4_6_Fig4_HTML.jpg](img/A978-1-4842-0265-4_6_Fig4_HTML.jpg)\n\
  \n**图 6-4.** 在“所有页面”报告中，选择过滤器旁边的“高级”选项来测试目标 URL\n\n在此过滤器中尝试使用 URL 或正则表达式，看看它们是否按预期工作，并根据需要进行优化。\n\
  \n如果某些目标 URL 模式过于宽泛，可能会导致渠道看起来像图 6-5。\n\n![A978-1-4842-0265-4_6_Fig5_HTML.jpg](img/A978-1-4842-0265-4_6_Fig5_HTML.jpg)\n\
  \n**图 6-5.** 一个可疑的渠道\n\n这看起来有点好得令人难以置信，不是吗？虽然如果 100% 的会话都能一路完成转化漏斗，那将非常棒，但这些数据似乎有诈。\n\
  \n此类问题的原因在于 URL 模式匹配了多个步骤。考虑以下 URL 序列以及针对它们的目标设置：\n\n|       | 渠道设置 | 页面 URL |\n\
  |-------|--------------|-------------|\n| 步骤 1 | `/contact/`   | `/contact/` |\n\
  | 步骤 2 | `/contact/thank-you/` | `/contact/thank-you/` |\n\n如果您使用的是“等于”选项，则一切正常。但是，如果使用“开头为”或“正则表达式”选项，请注意您的步骤\
  \ 1 的渠道 URL 也匹配了步骤 2！您需要更加小心。在这种情况下，您可以使用正则表达式：\n\n|       | 渠道设置 | 页面 URL |\n|-------|--------------|-------------|\n\
  | 步骤 1 | `/contact/`   | `/contact/` $ |\n| 步骤 2 | `/contact/thank-you/` | `/contact/thank-you/`\
  \ |\n\n通过使用带有 `$`（美元符号）的正则表达式，表示“以...结尾”，您可以确保步骤 1 不会匹配步骤 2 的 URL。问题解决！\n\n### 必需的第一步\n\
  \n最后，还有一种在某些场景中有用的附加选项：第一个渠道步骤的“必需”选项。请注意，渠道报告会显示用户在流程的任何步骤进入渠道（见图 6-6）。通常，这是第一步，但也可能是后续步骤。\n\
  \n![A978-1-4842-0265-4_6_Fig6_HTML.jpg](img/A978-1-4842-0265-4_6_Fig6_HTML.jpg)\n\
  \n**图 6-6.** 在此部分渠道中，有 117 个会话从第二步进入\n\n这是如何发生的？您可能认为这不可能；不经过第一步就无法进入注册过程的第二步！然而，这可能在各种边缘情况下发生，例如：\n\
  \n> 嘿，我们应该买票去爱丽丝仙境度假村！我去第一步。\n> 等等，我应该问问疯帽匠是否愿意和我一起去。我先把这个页面开着，等我问完再说。\n> 过了 30\
  \ 多分钟，我的会话在 GA 中过期了。\n> 好的，现在我已经准备好订票了！我进入第二步，但由于我的会话已过期，GA 显示我从第二步进入了渠道。\n\n在大多数此类情况下，大部分用户从第一步进入，少数用户从后续步骤进入。然而，在某些场景中，您可能只希望看到完成了整个流程的用户。考虑图\
  \ 6-7 中的渠道。\n\n![A978-1-4842-0265-4_6_Fig7_HTML.jpg](img/A978-1-4842-0265-4_6_Fig7_HTML.jpg)\n\
  \n**图 6-7.** 一个许多用户从最后一页进入的渠道！\n\n前两步是一个注册过程，允许用户访问包含一些可下载资源的页面。最后一页可以被这些用户收藏并返回，他们经常这样做（这就是为什么您看到这么多用户从最后一步进入）。但您真正感兴趣的用户只是那些实际在步骤\
  \ 1 和 2 中注册的用户。\n\n通过在渠道的第一步设置“必需”设置，渠道报告将仅向您显示从步骤 1 开始的用户。请注意，这仅影响渠道报告；目标的总体转化次数始终仅由最终目标\
  \ URL 决定。\n\n## 没有明确 URL 的渠道\n\n对于步骤可以通过 URL 轻松区分的渠道，目标设置非常简单。如果渠道步骤无法通过 URL 轻易区分，会发生什么情况呢？例如：\n\
  \n*   页面内出现一个模态弹窗\n*   表单及其确认页面具有相同的 URL\n*   结账或注册过程在单个页面内包含多个步骤，无需重新加载（即 AJAX）\n\
  *   一个或多个步骤发生在外部、未被跟踪的网站上的流程\n\n在这些情况下设置渠道的方法是使用虚拟综合浏览量——也就是说，在某种交互（如表单提交或点击推进到下一步的按钮）时触发一个\
  \ GA 综合浏览量，并使用一个虚构的 URL 来表示该交互。GTM 的 GA 标签允许您使用“要设置的字段”部分中的 `page` 字段，用您选择的 URL\
  \ 覆盖当前页面的 URL（图 6-8）。\n\n![A978-1-4842-0265-4_6_Fig8_HTML.jpg](img/A978-1-4842-0265-4_6_Fig8_HTML.jpg)\n\
  \n**图 6-8.** GTM 的 GA 标签中的 `page` 字段允许您覆盖记录在 GA 中的 URL\n\n对于虚拟综合浏览量，选择了 `/drink-imaginary-tea`\
  \ 作为要记录的 URL——这个 URL 在您的网站上并不实际存在，但您会在 GA 数据中看到它，用以代表所执行的操作。由于这些操作在 Google Analytics\
  \ 中被记录为综合浏览量，您随后可以使用您选择的 URL 来设置渠道（并且您也能在“网站内容”报告中看到这些综合浏览量）。\n\n> **注意：** 对于外部网站，例如第三方支付网站，如果您能够将\
  \ GTM 容器代码放置在该网站上，则可以使用跨域跟踪来捕获数据（请参见第 2 章和第 3 章）。如果第三方不允许您放置代码，用户在其网站上的活动对您来说是不可见的，但您至少可以跟踪用户离开您的网站前往那里的情况。\n\
  \n\n\n## 模态窗口与 iFrame\n\n模态窗口是页面内弹出的一种窗口（而非浏览器中单独的标签页或窗口）。这种模态弹窗可能包含两种不同类型的信息：\n\
  \n- 通常它们会使用 HTML `iframe` 元素来简单集成另一个页面。\n- 在其他情况下，例如作为图片灯箱，它们可能只是简单地显示/隐藏或重新设置页面内容的元素样式。\n\
  \n要检查网站上特定模态弹窗的内容，直接查看源代码即可。\n\n如果使用了 `iframe` 元素，模态窗口的内容实际上是一个独立的页面。只要你的 GTM 容器在该页面中，你就可以像测量其他页面一样对其进行测量，并且该\
  \ URL 的页面浏览量会像其他所有页面一样出现在 GA 中。\n\n> **注意：** 如果 `iframe` 中的页面位于不同的域名，你需要使用跨域跟踪。关于跨域\
  \ iframe 还有一些额外的浏览器和安全问题；处理此场景的详细信息请参阅 GA 开发者文档。¹\n\n对于未使用 `iframe` 元素的模态窗口，你可以使用点击触发器（详见第\
  \ 5 章）来触发标签。根据交互的性质以及希望在 GA 中查看数据的方式，由你决定是触发 GA 事件标签还是页面浏览量标签。对于灯箱中的图片，事件标签可能是最合适的。然而，如果模态弹窗中包含表单或其他多步骤流程，你可能希望使用页面浏览量，以便设置带有步骤的目标漏斗。\n\
  \n## 为点击触发虚拟页面浏览量\n\n要为点击创建虚拟页面浏览量，请回顾第 5 章中概述的流程，即如何基于点击触发 GA 事件标签。在这里，你将改用 GA\
  \ 页面浏览量标签。\n\n1. 创建新标签。选择 **Google Analytics ➤ Universal Analytics** 作为类型。\n2. 在\
  \ **跟踪 ID** 中填写你之前创建的 `{{GA Property ID}}` 变量。\n3. 选择 **跟踪类型 ➤ 页面浏览量**。\n4. 在 **更多设置\
  \ ➤ 基本配置** 下，你会找到一个标记为 **文档路径** 的字段（见图 6-8）。这是 GA 记录的 URL。默认使用当前页面路径，但你可以在此处覆盖该标签。（这就是你“虚拟页面浏览量”的本质：你创建了一个并不实际存在的\
  \ URL 来表示表单提交。）你可以使用文本和变量的任意组合来构建 URL。通常，使用当前页面（`{{Page Path}}` 变量）并在末尾附加一些标签是合理的：`{{Page\
  \ Path}}/modal-newsletter-signup`\n5. 现在为此标签指定触发器。选择 **点击**，然后点击 **新建** 按钮创建一个新的点击触发器。\n\
  6. 指定一些条件，将点击触发器限制在适当的链接、按钮或其他元素上。有关使用点击触发器的更多讨论和示例，请参阅第 5 章。\n   > **注意：** 此处无需使用链接点击监听器的“等待标签”选项，因为点击后当前页面保持打开状态。\n\
  7. 选择 **创建触发器** 按钮，为触发器命名：“模态弹窗”。GTM 保存触发器并返回到标签创建页面。\n8. 保存标签，为其命名：“GA – 页面浏览量\
  \ – 模态弹窗”。\n\n## 表单与表单监听器\n\nHTML `form` 元素允许用户填写多个 `input` 字段，然后提交表单。输入字段的内容会提交到由你的网站（在\
  \ HTML 中由表单元素的 `action` 属性表示）处理的 URL。\n\n```html\n<form id=\"red-queen\" action=\"\
  /off-with-her-head/\">\n  <input id=\"first-name\" name=\"first-name\" type=\"text\"\
  \ placeholder=\"Alice\">\n  <input type=\"submit\" value=\"Submit!\">\n</form>\n\
  ```\n\n如果包含表单的页面与表单操作页面的 URL 不同，你可以轻松地在漏斗中区分这些步骤。然而，在某些情况下，表单的操作可能与当前页面相同。提交表单后，页面可能会显示不同的内容（例如确认消息），但\
  \ URL 保持不变。在无法通过 URL 区分表单的情况下，你可以使用 GTM 的表单触发器来跟踪表单提交。表单触发器类似于点击触发器（在第 5 章中描述），但它监听的是\
  \ HTML `form` 元素是否被提交。\n\n> **注意：** 就像 GTM 为点击监听器包含内置变量（如 `{{Click ID}}` 和 `{{Click\
  \ URL}}`）一样，它也为表单监听器提供了相同的变量集。在设置表单监听器之前，你需要确保在 GTM 的变量部分已启用这些变量。\n\n## 为表单提交触发页面浏览量\n\
  \n让我们看看如何为表单提交创建标签和触发器。\n\n1. 创建新标签。选择 **Google Analytics ➤ Universal Analytics**\
  \ 作为类型。\n2. 在 **跟踪 ID** 中填写你之前创建的 `{{GA Property ID}}` 变量。\n3. 选择 **跟踪类型 ➤ 页面浏览量**。\n\
  4. 在 **更多设置 ➤ 基本配置** 下，你会找到一个标记为 **文档路径** 的字段（见图 6-8）。这是 GA 记录的 URL。默认仅填入当前页面路径，但你可以在此处覆盖该标签。（这就是你“虚拟页面浏览量”的本质：你创建了一个并不实际存在的\
  \ URL 来表示表单提交。）你可以使用文本和变量的任意组合来构建 URL。通常，使用当前页面（`{{Page Path}}` 变量）并在末尾附加一些标签是合理的：`{{Page\
  \ Path}}/red-queen-submitted`\n5. 现在为此标签指定触发器。选择 **表单**，然后点击 **新建** 按钮创建一个新的表单触发器。\n\
  6. 类似于链接，表单通常会提交到同一个浏览器窗口，替换当前页面。选择 **等待标签** 选项，并使用默认的最长两秒等待时间，以便在表单提交前给跟踪标签足够的执行时间。\n\
  7. 使用 **检查验证** 选项，仅在表单成功提交时触发。通常，表单包含验证检查，例如检查用户是否填写了必填字段并以正确格式输入了值。启用此选项后，触发器仅在验证成功且表单提交时才会操作。如果禁用此选项，无论验证是否成功，用户每次点击提交按钮时触发器都会操作。\n\
  8. 在“启用条件”下，筛选触发器监听的页面。该监听器仅需要在可能包含表单的页面上操作。如果该表单出现在网站的多个位置，你可以使用正则表达式匹配任何 URL：`{{Page\
  \ URL}} – 匹配正则表达式 – .*` 否则，你可以进行更严格的限制，仅包含此表单出现的页面。\n9. 在“触发条件”下，选择 **部分表单**，并指定一个或多个条件，将此触发器限制为你想要跟踪的表单。最常见的是，你可能使用表单\
  \ ID 或表单 URL 变量来限定特定表单。 `{{Form ID}} – 等于 – red-queen`\n10. 选择 **创建触发器** 按钮，为触发器命名：“红皇后表单”。GTM\
  \ 保存触发器并返回到标签创建页面。\n11. 保存标签，为其命名：“GA – 页面浏览量 – 红皇后表单提交”。\n\n现在，你已经为表单提交生成了一个独特的\
  \ URL，即可将该 URL 用作目标或漏斗步骤。\n\n\n\n### AJAX 与动态流程\n\n有时，多步骤流程可能会完全发生在同一个页面内，页面不会重新加载，URL\
  \ 也不会改变。用户通过与内容交互来逐步完成流程，页面内容会动态变化，但用户始终停留在同一页面上。甚至有可能整个网站或网络应用都构建为单页面，当用户在其中“导航”时，内容发生变化，但页面从未完全重新加载或更改\
  \ URL。\n\n这通常被称为 AJAX（即异步 JavaScript 和 XML 的缩写，尽管该术语现已涵盖多种相关技术，这些技术不一定异步，也不一定使用\
  \ XML）。对于动态内容而言，AJAX 是一种优雅且颇具吸引力的选择，但由于它与拥有独立页面和 URL 的“标准”网站存在差异，因此也引入了一些挑战。\n\n\
  由于页面不会完全刷新，GTM 仅会触发初始的单个网页浏览量。要捕获后续的交互，您必须使用其他事件监听器来触发代码。根据网站的设置方式，有几种可行的选项。\n\n\
  * **历史记录监听器。** 大多数现代 AJAX 设计对浏览器和搜索引擎都很友好：它们允许直接链接到动态内容，并允许浏览器的“后退”和“前进”按钮正常运行。它们通过多种不同的方式在浏览器历史记录中插入条目来实现这一点，从而跟踪用户的状态和路径。GTM\
  \ 的历史记录监听器可以在这些更改发生时被触发。\n* **点击监听器。** 对于简单情况，或者动态交互未在浏览器历史记录中反映出来的情况，您可以使用点击监听器来触发对特定按钮、链接或其他元素的点击。\n\
  \n这两种方法将在以下各节中描述。\n\n> **注意：** 如果您不是网站上 AJAX 流程的创建者，请务必与开发人员沟通，了解其运作方式。GTM 的监听器是无害的，不太可能干扰页面功能，但您需要确保数据能准确反映您要捕获的交互。\n\
  \n### 历史记录监听器\n\n动态页面在浏览器中跟踪页面状态主要有两种方法：URL 片段，或 HTML5 的 `window.history` API。\n\
  \nURL 片段是 URL 中井号（`#`）之后的部分。您可能对此很熟悉，它用于页面内的链接，以跳转到页面内的特定位置。URL 片段不会更改基本 URL，也不会触发页面重新加载。然而，由于浏览器会在其历史记录中跟踪这些片段，动态页面可以使用\
  \ URL 片段的人工标签作为支持“后退”和“前进”按钮的一种方式。使用 URL 片段的动态页面可能具有如下所示的 URL：\n\n`/ticketing/registration.php#signup`\n\
  \n`/ticketing/registration.php#billing`\n\n`/ticketing/registration.php#confirmation`\n\
  \n此外，HTML5 引入了 `window.history` API，该 API 允许动态页面直接将条目插入浏览器历史记录。`window.history.pushState()`\
  \ 和 `window.history.replaceState()` 方法允许脚本在浏览器历史记录中插入条目，包括一个用于维护状态的 JSON 对象以及一个新的\
  \ URL。此外，`popstate` 事件允许监控历史状态的任何变化，包括使用“后退”和“前进”按钮。\n\n为了涵盖这些情况，GTM 提供了一个历史记录监听器触发器，允许您在以下任何一种情况发生时触发代码：\n\
  \n* URL 片段发生变化\n* 调用了 `window.history.pushState()` 或 `window.history.replaceState()`\
  \ 方法\n* 发生了 `popstate` 事件\n\n当这些情况中的任何一种发生时，一条消息将被推送到数据层，如下所示：\n\n```\ndataLayer.push({\n\
  \  'event': 'gtm.historyChange',\n  'gtm.historyChangeSource': 'pushState',\n  'gtm.newHistoryState':\
  \ historyStateObject,\n  'gtm.newUrlFragment': '',\n  'gtm.oldHistoryState': null,\n\
  \  'gtm.oldUrlFragment': ''\n});\n```\n\n其中包含新、旧历史状态对象和 URL 片段（如果有的话），以及历史更改的来源（`pushState`、`replaceState`\
  \ 或 `popstate`）。有几个内置变量可以访问这些信息；在使用历史记录监听器之前，请先在变量列表中启用它们。如果 `pushState` 或 `replaceState`\
  \ 更改了 URL，`{{Page URL}}` 变量也会更新，并且您可以创建一个或多个变量来访问状态对象的属性（如果使用了的话）。\n\n#### 为历史更改触发网页浏览量\n\
  \n让我们看看如何在 GTM 中为历史更改创建代码和触发器。\n\n1. 创建一个新代码。选择 **Google Analytics > Universal Analytics**\
  \ 作为类型。\n2. 使用您之前创建的 `{{GA Property ID}}` 变量填写 **跟踪 ID**。\n3. 选择 **跟踪类型 > 网页浏览量**。\n\
  4. 在 **更多设置 > 要设置的字段** 下，设置页面字段（GA 记录的 URL）。如果对 `pushState()` 或 `replaceState()`\
  \ 的调用更改了 URL，您可以直接使用 `{{Page Path}}` 变量，或者使用来自状态对象的信息作为虚拟 URL。对于 URL 锚点部分的更改，您可以将\
  \ `{{New History Fragment}}` 与 `{{Page Path}}` 变量结合使用来构建一个虚拟 URL：`{{Page Path}}#{{New\
  \ History Fragment}}`\n5. 选择 **继续** 按钮为代码指定一个触发器。选择 **更多** 以查看所有监听器的列表。然后选择 **新建**\
  \ 创建一个新触发器。\n6. 选择 **历史更改** 作为触发器类型。\n7. 您可以选择在 **所有历史更改** 上触发，这对于完全基于 AJAX 的网站可能是合适的选择。如果您只衡量特定页面或流程，可以指定一些条件来限制此触发器。根据具体场景，您可以通过\
  \ `{{Page URL}}` 变量将触发器限制在某些页面上，或者通过使用上述内置历史变量限制在特定类型的历史更改交互上。请指定反映您网站实际情况的条件。\n\
  8. 选择 **创建触发器** 按钮，并为触发器命名：“AJAX 预订页面”。GTM 会保存触发器并返回到代码创建界面。\n9. 保存代码，并为其命名：“GA\
  \ – 网页浏览量 – 票务预订”。\n\n现在，您为动态流程中的各个步骤设置了不同的 URL，便可以将这些 URL 用作目标或漏斗步骤。\n\n### 使用点击监听器\n\
  \n对于无 URL 更改的动态内容，另一种替代方法是使用点击监听器，这在第 5 章中讨论过。如果用户通过点击页面的某个元素引起页面的动态变化，点击监听器可以捕获该交互。这对于那些不使用\
  \ URL 片段或不使用 `window.history` API 来正确支持“后退”和“前进”按钮的 AJAX 流程来说，是一种特别有用的变通方法（如上一节所述）。\n\
  \n在这种情况下，您可以设置基于 URL、`id` 或其他属性等条件在链接上触发的触发器，正如第 5 章中所述，但您将使用本章示例中的网页浏览量代码，而不是使用\
  \ GA 事件代码。请记得为页面字段指定一个虚拟 URL 以标识该交互。\n\n\n\n### Flash 及其他浏览器插件\n\n页面中的交互式动态内容也可能通过浏览器插件以嵌入对象的形式呈现，例如使用\
  \ Adobe Flash 开发的内容。\n\n在浏览器的 DOM 中，此类对象是一个黑盒：其内容无法通过 JavaScript 访问，因此 GTM 的内置监听器或自定义\
  \ JavaScript 都无法提供用户与 Flash 内容交互的详细信息。不过，可以在 Flash 对象本身中内置跟踪功能，利用 Flash 的脚本语言（`ActionScript`）与浏览器的\
  \ JavaScript 进行交互。\n\n过去，Adobe 曾为 Google Analytics 中的 Flash 跟踪提供了一个半官方的 ActionScript\
  \ 库，² 尽管该库已有一段时间未更新，并且在本节出版时，它尚未更新以支持 GA 最新的 Universal Analytics 跟踪。（作为 Flash 替代品的\
  \ Microsoft Silverlight 也处于类似境地，但微软已宣布终止对 Silverlight 的支持，因此其 GA 跟踪库 ³ 不太可能得到更新。）然而，Flash\
  \ 对象中的 `ActionScript` 可以调用包含该对象的页面内的 JavaScript，因此你可以从 Flash 控件或应用中将事件推送到数据层以供 GTM\
  \ 使用。然后，GTM 可以基于数据层消息触发代码（参见第 5 章）。\n\n### 跨越会话的转化\n\nGA 的转化模型包含一个在单个会话内发生的漏斗。对于某些更复杂的过程，用户可能在一个会话中完成几个步骤，然后在稍后的时间回来完成剩余部分。\n\
  \n以下是在账户注册或登记流程中可能发生的常见示例：\n\n用户填写详细信息以创建账户，浏览网站上一个或多个表单页面（页面 A、B、C）。系统会向用户注册的电子邮件地址发送一封确认邮件。用户点击邮件中的链接，打开网站上的另一个页面，以确认并完成账户注册（页面\
  \ D）。\n\n你可以创建一个包含从页面 A 到页面 D 整个漏斗的单一目标。然而，用户完全有可能在完成从页面 A 到页面 C 的步骤后，在稍后的时间，于一个新的会话中，返回页面\
  \ D（在收到邮件后）。更好的方法可能是设置两个独立的目标：一个针对页面 A 到页面 C，另一个针对页面 D。（此外，你甚至可以使用 `Measurement\
  \ Protocol` 来测量邮件的打开情况；参见第 14 章。）\n\n在其他场景中，你可能有一个漫长或复杂的过程，用户可以保存进度并在稍后返回。或者，你可能对同一用户是否在一周内返回两次感兴趣。在这种情况下，你可以使用\
  \ cookie 记录特定的行为或成就，并仅在完成一定累积成就时为目标触发一次页面浏览。你可以使用自定义 JavaScript（通过 `document.cookie`\
  \ 属性）设置新 cookie，而 GTM 的变量类型包括从 cookie 读取值的能力。\n\n一旦你基于设置的 cookie 值创建了 GTM 变量，就可以在触发器或虚拟页面浏览的\
  \ URL 中使用它们。（另请参见第 10 章了解跨设备跟踪用户，这在用户登录且你希望关联其行为（无论他们使用何种设备或浏览器访问网站）的场景中非常有用。）\n\
  \n## 总结\n\n-   你可以在 GA 中设置目标，以便轻松对比转化指标。目标可以基于 URL、事件，或会话中的页面数量或时长。\n-   基于目标 URL\
  \ 的目标可以包含一个漏斗，该漏斗由一系列步骤组成（也通过 URL 指定），这些步骤指向最终的转化页面。\n-   对于 URL 不发生变化的交互，你仍然可以使用带虚拟\
  \ URL 的页面浏览来设置基于 URL 的目标。GTM 中包含了用于表单提交的表单触发器、用于基于动态 AJAX 交互的历史记录更改触发器，以及之前讨论过的点击触发器。你可以使用变量或文本覆盖\
  \ GTM 中代码记录的 GA URL，以生成虚拟 URL 标签。\n\n## 脚注\n\n1  \n[`https://developers.google.com/analytics/devguides/collection/analyticsjs/cross-domain#iframe`](https://developers.google.com/analytics/devguides/collection/analyticsjs/cross-domain#iframe)。\n\
  \n2  \n[`https://code.google.com/p/gaforflash/`](https://code.google.com/p/gaforflash/)。\n\
  \n3  \n[`http://msaf.codeplex.com/wikipage?title=Google%20Analytics`](http://msaf.codeplex.com/wikipage?title=Google%20Analytics)。\n\
  \n\n\n"
- "# 7. 电子商务：追踪产品与购买行为\n\n> “如果你从三百六十五里拿走一，还剩下什么？” “当然是三百六十四。” 矮胖子一脸怀疑，“我倒想看看你写在纸上是啥样。”\
  \ 他说。 ——刘易斯·卡罗尔，《爱丽丝镜中奇遇记》\n\n对于销售产品的网站，您可以收集关于用户在网站上进行购买的额外数据。Google Analytics（谷歌分析）提供了两种电子商务追踪的细节层级：\n\
  \n*   **基础电子商务追踪**仅追踪购买行为。由于它只关心完成的购买，您只需在 GTM（谷歌标签管理器）中对最终的购买确认页面进行修改。\n*   **增强型电子商务**提供了对用户在整个站点中与产品互动（从在列表中查看产品、添加到购物车，到最终的购买）的更广泛的追踪。它提供了更丰富的方式来分类和追踪所有类型的产品互动。因此，要充分利用增强型电子商务，您通常需要对网站的绝大部分进行追踪修改。\n\
  \n您应该选择哪一种？如果您只需要非常简单的电子商务追踪，基础选项可能就足够了。然而，对于许多网站来说，增强型电子商务提供了更深入且更具可操作性的数据，因此，如果您有资源去实施它，我们强烈推荐。\n\
  \n无论选择哪种电子商务追踪方案，实施通常都涉及两组任务：\n\n*   对您的网站进行修改，以通过数据层向 GTM 提供电子商务数据。\n*   在 GTM\
  \ 中修改代码，以支持将电子商务数据发送到 GA。\n\n本章将介绍基础型和增强型电子商务的实施流程，包括逐步讲解 GTM 的修改（第二项任务）。对于第一项任务，将详细说明数据层中需要存在何种信息及格式。这通常是通过对网站进行服务器端修改，从而在数据层中提供这些数据来实现的，因此具体实施将取决于您的网站和电子商务平台。\n\
  \n## 面向非电商网站的电子商务追踪\n\n尽管它通常用于衡量购买行为，但 GA 的电子商务追踪功能同样适用于任何类型的交易互动，无论其中是否涉及金钱。这可能包括以下场景：\n\
  \n*   从商品目录或项目库（如电子书、视频或其他内容）中进行选择，并下载、结账或查看此类项目。\n*   注册课程或在线课程。\n*   申请志愿者或工作机会。\n\
  *   选择或配置最终需要线下购买的产品（例如汽车）。\n\n在许多情况下，您可能会发现使用目标（参见第 6 章）来衡量这些场景就足够了。但如果您希望获得关于每笔交易细节的更详细数据，电子商务追踪是一个不错的选择。即使金额为`$0.00`，本章描述的所有电子商务追踪功能也仍然有效。\n\
  \n本章的剩余部分将分为两个小节，分别介绍基础型电子商务和增强型电子商务追踪。实施时，您应选择其中一种方案，只需阅读相关小节即可。\n\n## 基础电子商务追踪\n\
  \n基础电子商务仅追踪已完成的购买。设置基础电子商务涉及三个步骤：\n\n*   在 Google Analytics 中启用电子商务追踪。\n*   在网站的数据层中添加电子商务数据。\n\
  *   在 Google Tag Manager 中添加一个 Google Analytics 交易代码。\n\n让我们逐步了解整个过程。\n\n### 在 GA\
  \ 中启用基础电子商务追踪\n\n首先，您需要在 GA 中启用电子商务追踪。这将启用“转化”部分中的电子商务报告，以及整个 GA 中其他报告中可用的电子商务数据。可以在每个数据视图的设置中启用或禁用电子商务报告。\n\
  \n*   在 GA 的“管理”选项卡中，从下拉列表中选择所需的帐户、资源和数据视图。\n*   在数据视图的设置（最右侧列）中，选择“电子商务设置”（如下截图所示）。\n\
  \n![A978-1-4842-0265-4_7_Figa_HTML.jpg](img/A978-1-4842-0265-4_7_Figa_HTML.jpg)\n\
  \n*   要启用电子商务追踪，将开关设置为“开启”。选择“下一步”按钮。\n*   将增强型电子商务的设置保留为“关闭”，然后选择“提交”按钮。\n\n您还可以在此数据视图中设置希望在报告中看到的货币。（如果您拥有多币种商店，GA\
  \ 将负责货币间的电子商务数据转换；有关详细信息，请参见下方侧边栏。）\n\n*   仍然在 GA 的“管理”选项卡中，在最右侧列选择“数据视图设置”。\n*\
  \   在此设置页面大约中间位置，有一个货币下拉列表。选择您希望在此视图的报告中看到的货币。\n*   选择“保存”按钮。\n\n启用电子商务只是使 GA 中可用的相应报告生效，但您仍然需要发送电子商务数据来填充这些报告。接下来，您需要在数据层中添加一些关于购买的信息。然后，您将创建一个\
  \ GTM 代码，将这些数据发送到 GA。\n\n\n### 数据层中的电子商务数据\n\n有关购买的数据将通过 GTM 的 `dataLayer` 对象，在购买流程的最终确认页面上提供。GTM\
  \ 指定了 Google Analytics (GA) 所需信息片段的格式和标签。以下是数据层中购买数据的一个示例；我们稍后将对其中的各部分进行分解。\n\n\
  ```\n<script>\ndataLayer = [{\n  'transactionId': 'AW699168',\n  'transactionAffiliation':\
  \ 'Mad Hatter\\'s Hat Emporium',\n  'transactionTotal': 42.98,\n  'transactionTax':\
  \ 3.00,\n  'transactionShipping': 3.99,\n  'transactionProducts': [\n    { 'sku':\
  \ 'MH342',\n      'name': 'Felt Fedora',\n      'category': 'Hats',\n      'price':\
  \ 17.99,\n      'quantity': 1 },\n    { 'sku': 'MH007',\n      'name': 'Purple Top\
  \ Hat',\n      'category': 'Hats',\n      'price': 24.99,\n      'quantity': 1 }\
  \ ]\n}];\n</script>\n```\n\n**注意：** 你只能在页面中声明一次数据层（使用像 `dataLayer = []` 这样的语句），并且该声明必须位于\
  \ GTM 代码之前（GTM 会自动创建一个数据层，如果尚不存在的话）。稍后再次声明数据层会覆盖其先前的值，并可能导致 GTM 行为异常。要在数据层创建后为其提供额外的值，请使用\
  \ `dataLayer.push()`（如第 5 章交互跟踪中所见），该方法会向数据层追加内容，而不是覆盖它。在这种情况下，你需要这些值在页面加载时就被包含，因此你会将电子商务数据包含在声明中。\n\
  \n此代码应仅在交易完成时包含——即结帐流程中的最终收据页面。\n\n第一组属性对交易进行了概括：\n\n- `transactionId` 是必需的，用作此特定购买的唯一标识符。\n\
  - `transactionAffiliation` 是可选的，可以表示特定的商店（如果你有多家商店）或一个联盟代码。\n- `transactionTotal`\
  \ 是必需的，代表交易的总收入（该总额可以包含或排除运费和税费，具体取决于你希望在报告中查看收入的方式）。\n- `transactionTax` 和 `transactionShipping`\
  \ 是可选的，代表交易的税费和运费。\n\n电子商务数据的下一部分是一个名为 `transactionProducts` 的数组。该数组中的每个条目对应所购买的每个不同产品。每个产品条目包含以下属性：\n\
  \n- `sku` 和 `name` 是必需的，代表产品的标识符和名称。\n- `category` 是可选的，表示产品的分类或分组。\n- `price` 是必需的，代表产品的单价。\n\
  - `quantity` 是必需的，代表购买的数量。它应该是一个整数。\n\n你需要在数据层中为交易中包含的每个产品重复这些信息。在我们的示例中，有两个产品。\n\
  \n如前所述，数据层中的信息值来自你网站的数据，通常使用服务器端代码从你的数据库或电子商务平台中提取这些值。如何实现的具体细节取决于你的网站以及你用来处理这些交易的工具，但只要以这种方式格式化数据，GTM\
  \ 和 GA 就可以使用它。\n\n**注意：** 由于你是从数据库中插入值到这段 JavaScript 代码中，因此需要注意格式和语法。具体来说，要小心文本字段中的撇号或引号（请注意示例代码中\
  \ `'Mad Hatter\\'s Hat Emporium'` 里使用反斜杠转义的撇号）。另请注意，货币值是数字，因此应仅包含数字和小数点（不要包含货币符号或逗号）——所以应该是\
  \ `1342.57`，而不是 `$1,342.57`。\n\n### 侧边栏：货币换算\n\n如你所见，你可以为 GA 中的数据视图选择一个货币设置，该设置控制报告中显示的货币。如果你拥有单一货币商店，只需将报告设置为显示美元，以美元发送你的价格和交易金额，这些数字就会显示在报告中。\n\
  \n但是，你可能遇到这样的场景：你的商店接受多种货币，或者你有多个特定国家/地区的商店，并且希望跨区域汇总报告。在这种情况下，需要在报告中进行货币换算。\n\n\
  在数据层的交易数据中，你可以使用 `transactionCurrency` 属性（针对交易总额）和 `currency` 属性（针对每个产品）来指定货币。货币值是像\
  \ USD 或 EUR 这样的三个字母代码，代表相应的货币。GA 文档中包含 GA 支持的所有货币的完整列表。\n\n```\n<script>\ndataLayer\
  \ = [{\n  'transactionId': 'AW699168',\n  'transactionAffiliation': 'Mad Hatter\\\
  's Hat Emporium',\n  'transactionTotal': 42.98,\n  'transactionTax': 3.00,\n  'transactionShipping':\
  \ 3.99,\n  'transactionCurrency': 'EUR',\n  'transactionProducts': [\n    { 'sku':\
  \ 'MH342',\n      'name': 'Felt Fedora',\n      'category': 'Hats',\n      'price':\
  \ 17.99,\n      'quantity': 1,\n      'currency': 'EUR' },\n    { 'sku': 'MH007',\n\
  \      'name': 'Purple Top Hat',\n      'category': 'Hats',\n      'price': 24.99,\n\
  \      'quantity': 1,\n      'currency': 'EUR' } ]\n}];\n</script>\n```\n\n这与之前的交易相同，只是增加了\
  \ `transactionCurrency` 和 `currency` 属性来指明使用欧元结算（尽管不同产品使用不同货币的情况不太常见，但你仍需要为交易总额以及每个产品指定货币）。\n\
  \n如果交易数据中包含的货币代码与 GA 中的货币设置不同，则会使用每日汇率进行货币换算，并在报告中显示换算后的金额（汇率取自 Google Billing，是前一天的均值。因此，确切金额可能与你的金融机构实际提供的汇率存在微小差异）。\n\
  \n对于基本的电子商务跟踪，上面描述的数据层对象是你需要添加到网站的唯一额外代码。在下一节中，你将创建用于将此数据发送到 GA 的 GTM 标签。\n\n###\
  \ GTM 中的基本电子商务标签\n\n对于 Google Analytics 中的基本电子商务跟踪，有一种额外的点击类型用于发送交易数据（就像你之前看到的用于发送页面浏览或事件数据的点击类型一样）。要发送此数据，你需要在\
  \ GTM 中创建一个额外的标签。\n\n#### 在 GTM 中创建一个基本电子商务交易标签\n\n你可以按照以下步骤在 GTM 中添加一个 GA 交易标签：\n\
  \n1.  创建一个新标签。选择 **Google Analytics ➤ Universal Analytics** 作为标签类型。\n2.  就像你在基本页面浏览标签中所做的那样，使用你之前创建的\
  \ `{{GA Property ID}}` 变量（参见第 3 章）填写跟踪 ID。\n3.  选择 **Track Type ➤ Transaction**。你会注意到一条消息显示，指示你在数据层中进行相应的设置（请参见下面的截图），而这你已经完成了。选择\
  \ **Continue**。\n\n    ![A978-1-4842-0265-4_7_Figb_HTML.jpg](img/A978-1-4842-0265-4_7_Figb_HTML.jpg)\n\
  \n4.  对于触发器，选择 **Some Pages**。将显示你之前创建的所有页面触发器的列表。选择 **New** 以创建新的触发器。\n5.  给触发器适当命名；例如，`仅结帐收据页面`。\n\
  6.  输入一些条件，以便仅当访问最后的结帐页面（你在该页面的数据层中添加了电子商务代码）时触发此标签。通常，你可以使用 `{{Page URL}}` 变量作为条件来实现这一点（请参见下面的截图）。\n\
  \n    ![A978-1-4842-0265-4_7_Figc_HTML.jpg](img/A978-1-4842-0265-4_7_Figc_HTML.jpg)\n\
  \n7.  保存触发器。\n8.  保存标签，为其命名：\"GA – 电子商务\"。\n\n\n\n### 在 GA 中为结账流程创建目标\n\n前面几节的任务是您在\
  \ Google Analytics 中启用电子商务报告并收集交易数据所需的全部操作。不过，您可能还想为结账流程设置一个包含漏斗的目标，以便了解用户是如何逐步完成购买的（或未能完成）。第\
  \ 6 章 描述了如何设置此类目标漏斗。\n\n就是这样！此代码现在（当然，是在测试和发布之后）将在回执页面上触发，它会读取您之前添加到数据层的数据并将其发送到\
  \ GA。\n\n### 增强型电子商务跟踪\n\nGoogle Analytics 中的增强型电子商务功能不仅限于衡量已完成的购买，还能跟踪整个网站内的电子商务互动活动。\n\
  \n您可以收集的数据包括两种类型的互动：与产品的互动（从查看产品到完成购买）以及与内部促销活动（例如横幅广告或其他优惠）的互动。有关所有这些互动的信息将通过向数据层添加信息来处理。GTM\
  \ 和 GA 期望这些数据采用特定的格式和标签，稍后您将通过详细的示例来了解。GA 报告中`“转化” ➤ “电子商务”`部分有多种报告能反映您发送的数据。\n\n\
  对于产品，互动如下：\n\n-   产品展示（`impressions`）：用户看到了产品列表，例如在分类页面上。\n-   产品点击（`click`）：用户点击了某个产品列表项。\n\
  -   产品详情查看（`detail`）：用户查看了产品详情页面。\n-   从购物车添加和移除产品（`add` 和 `remove`）：用户在购物车中添加或移除了产品。\n\
  -   结账（`checkout`）：用户进行了结账流程的各个步骤（您将能够配置步骤的数量和顺序）。\n-   购买（`purchase`）：用户成功购买了一个或多个产品。\n\
  -   退款（`refund`）：发生了全额或部分退款。\n\n对于促销活动，互动如下：\n\n-   促销展示（`promoView`）：用户看到了促销活动，例如促销横幅。\n\
  -   促销点击（`promoClick`）：用户点击了促销活动。\n\n请注意，我们讨论的互动类型分为两类：页面加载时发生的互动，以及用户点击页面某个元素时才发生的互动。\n\
  \n第一类包括 `impressions`、`detail` 和 `promoView`，它们都表示页面上有内容被浏览。对于这些测量，您可以在页面加载时在数据层声明中包含电子商务数据。\n\
  \n后一类包括 `click` 和 `promoClick`，它们都表示点击行为。对于这些互动，您需要在点击发生时将信息推送到数据层（使用与第 5 章中跟踪点击相同的原则）。\n\
  \n其他互动，如 `add`、`remove`、`checkout` 和 `purchase`，根据网站的具体情况，可能属于任一类别。例如，有些网站在添加产品时会跳转到购物车页面，而另一些网站可能仅添加产品而不刷新页面。对于结账流程，每个步骤（账单、运输等）可能是一个单独的页面，或者所有步骤都在一个页面内完成（使用\
  \ AJAX）。这两种情况您都可以处理。\n\n最后，`refund` 是一种互动类型，它通常可能发生在网站的常规用户互动之外（例如，可能与客户服务请求同时发生）。您将单独研究如何处理退款。\n\
  \n#### 边栏：分阶段实施增强型电子商务\n\n在考虑实施时，增强型电子商务中可跟踪的互动类型以及支持它们所需的数据量可能会让人感到不知所措。但请认识到，不必一次性全部实施。这些互动类型之间没有依赖关系，因此您可以选择实施其中一部分而不实施其他部分（当然，Google\
  \ Analytics 报告只会显示您已实施的部分）。\n\n正因如此，通常的做法是先从最重要的互动开始，例如购物车、结账和已完成购买。然后可以逐步加入有关展示和点击的更多信息，最后，如果需要，再处理促销活动和退款。\n\
  \n\n\n### 启用增强型电子商务\n\n在发送数据之前，你首先需要在 Google Analytics 和 Google Tag Manager 中启用增强型电子商务。以下是操作流程。\n\
  \n#### 在 Google Analytics 中启用增强型电子商务\n\n首先，让我们在 `GA` 中启用电子商务跟踪。这将启用“转化”部分中的电子商务报告，以及\
  \ `GA` 中其他报告中可用的电子商务数据。每个数据视图的设置中都可以启用或禁用电子商务报告。\n\n在 `GA` 的“管理”标签页中，从下拉列表中选择所需的帐号、媒体资源和数据视图。在数据视图的设置（最右侧列）中，选择\
  \ `电子商务设置`（参见以下截图）。\n\n![A978-1-4842-0265-4_7_Figd_HTML.jpg](img/A978-1-4842-0265-4_7_Figd_HTML.jpg)\n\
  \n要启用电子商务跟踪，将开关设置为**开启**。选择**下一步**按钮。将增强型电子商务的设置更改为**开启**。在**结账标签**设置中，选择**添加漏斗步骤**，并为结账流程中的每个步骤添加一个标签（参见以下截图）。例如，如果结账包含以下步骤，你应该将每一步都作为漏斗中的一个带标签步骤添加：\n\
  \n- 配送\n- 账单\n- 付款\n- 审核\n\n这与目标漏斗设置类似（在第 6 章中有所描述），但专用于增强型电子商务报告。稍后你需要添加代码来指明用户在此流程中处于哪个步骤。请注意，不必将购买确认添加为一步；它通常被视为流程中的最后一步。\n\
  \n![A978-1-4842-0265-4_7_Fige_HTML.jpg](img/A978-1-4842-0265-4_7_Fige_HTML.jpg)\n\
  \n选择**提交**按钮以保存设置。\n\n你还可以在此数据视图的报告中设置希望看到的币种。（如果你的商店支持多种货币，`GA` 会在不同货币之间转换电子商务数据；详情请参见下方的边栏。）\n\
  \n仍在 `GA` 的“管理”标签页中，选择最右侧列中的**数据视图设置**。在此设置页面向下滚动约一半，会看到一个币种下拉列表。选择你希望在此数据视图的报告中看到的币种。选择**保存**按钮。\n\
  \n#### 在 Google Tag Manager 中启用增强型电子商务\n\n增强型电子商务会随现有的 `GA` 代码（例如基础网页浏览代码或事件跟踪代码）一同发送额外的电子商务数据。你需要为基础网页浏览代码启用增强型电子商务。本章稍后部分，你将学习需要使用事件或虚拟网页浏览代码的场景。\n\
  \n> **注意：** 不要对增强型电子商务使用 `GA` 的“交易”代码类型。交易代码用于基础电子商务跟踪。在增强型电子商务中，产品数据会随其他匹配（例如网页浏览或事件）一起发送；它不需要额外的代码类型。\n\
  \n在 `GTM` 的代码列表中，选择基础的 `GA` 网页浏览代码进行编辑。点击**配置代码**部分以编辑此代码。在**更多设置 ➤ 电子商务功能**下，选中**启用增强型电子商务功能**复选框（参见以下截图）。\n\
  \n![A978-1-4842-0265-4_7_Figf_HTML.jpg](img/A978-1-4842-0265-4_7_Figf_HTML.jpg)\n\
  \n勾选使用数据层的复选框。（另一个选项允许你从变量而不是数据层读取电子商务数据。本章稍后会介绍一个可能需要使用该选项的示例，但对于所有基础代码，你都将使用数据层。）保存对代码的更改。\n\
  \n现在，`GA` 的网页浏览代码已准备好让你向数据层添加电子商务数据。当电子商务数据以预期格式出现时，它将自动随网页浏览一起发送。\n\n### 数据层声明中的电子商务数据\n\
  \n现在你已经启用了增强型电子商务，可以开始将电子商务数据包含在数据层中，这些数据将随 `GA` 网页浏览代码一起发送。这是你在页面加载时获取可用数据时使用的方法。由于数据在页面加载时即可用，你需要在数据层声明（`dataLayer\
  \ = []`）中包含这些数据。（对于页面加载后通过点击或 AJAX 交互获得的数据，你需要使用 `dataLayer.push()` 来发送数据；详情请参见下一节。）\n\
  \n你可以通过在 `GTM` 容器代码之前将数据层声明包含在页面中来声明数据层。你的电子商务数据将包含在一个名为 `ecommerce` 的对象中。该对象的基本格式如下所示：\n\
  \n```html\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'currencyCode':\
  \ 'USD',   // 可选，用于货币转换\n        'action': {              // 其中一个电子商务操作：展示、详情、添加等\n\
  \              'actionField': {}, // 可选，用于某些操作的选项\n              'products': []\
  \     // 包含产品详情对象或其他数据的数组\n         }\n    }\n}];\n</script>\n```\n\n每个操作的详细信息、必需属性和可选属性都略有不同。以下各节为所有操作提供了详细示例。\n\
  \n如前所述，数据层中信息的值来自你网站的数据，通常使用服务器端代码从你的内容管理系统或电子商务平台中提取。具体实现方式取决于你的网站以及你用于处理这些交易的工具体系，但只要你以此格式组织数据，`GTM`\
  \ 和 `GA` 就能正常使用它。\n\n> **注意：** 增强型电子商务的数据层属性命名和层级结构与基础电子商务不同。如果你是从基础电子商务升级而来，你需要修改数据层中的字段。\n\
  \n#### 边栏：货币转换\n\n如你之前所见，你可以为 `GA` 中的数据视图选择一个币种设置，该设置控制报告中显示的货币。如果你只有一个币种的商店，只需将报告设置为显示美元，并以美元发送价格和交易金额，数字便会出现在报告中。\n\
  \n但是，你可能会遇到商店支持多种货币的情况，或者你有多个针对特定国家/地区的商店，并希望跨地区汇总报告。在这种情况下，就需要进行货币转换以生成报告。\n\n\
  在数据层的交易数据中，你可以使用 `currencyCode` 指定币种。货币值为三个字母的代码，例如 `USD` 或 `EUR`，代表相应的货币。`GA` 文档中包含了\
  \ `GA` 支持的完整货币列表。²\n\n如果交易数据中包含的货币代码与 `GA` 中的币种设置不同，`GA` 将使用每日汇率进行转换，并在你的报告中显示转换后的金额。（汇率取自\
  \ Google Billing，是前一天的均价。因此，精确金额可能与你的金融机构实际获得的汇率存在微小差异。）\n\n\n\n#### 产品数据\n\n许多电商行为都涉及产品数据，从产品展示，到查看产品、加入购物车，直至完成结账。在这一过程中，可以捕获产品的多个核心属性：\n\
  \n```json\n{\n    \"name\": \"高顶礼帽\",\n    \"id\": \"MH007\",\n    \"price\": \"\
  24.99\",\n    \"brand\": \"疯帽子帽业\",\n    \"category\": \"帽子/男款\",\n    \"variant\"\
  : \"紫色\"\n}\n```\n\n这些属性描述了产品的不同特征：\n\n- `name` 和 `id` 是必填项，分别代表产品的名称和标识符（SKU）。\n\
  - `price` 代表产品的单价。\n- `brand`、`category` 和 `variant` 为可选项，用于进一步描述产品并进行分类：\n  - `brand`\
  \ 代表产品的品牌名称或设计师。\n  - `category` 代表产品的分类或分组。与基础电商不同，增强型电商支持使用斜杠（`/`）指定最多五级的分层类别。在此示例中，顶级类别为\
  \ `Hats`（帽子），子类别为 `Mens`（男款）。通常，你会使用它来表示网站用于组织和展示产品的分类体系。\n  - `variant` 代表产品的进一步区分，例如颜色、尺寸等。\n\
  \n此外，还有其他属性，例如 `quantity`（数量），仅适用于特定情况；你将在后续的详细示例中看到它们。另外，如果合适，你还可以使用自定义维度来捕获更多产品信息（更多关于自定义维度的内容，请参见第\
  \ 11 章）。如前所述，这些属性大多是可选的，但你填写的信息越多，GA 中的电商报告就会越丰富。\n\n**注意**\n\n由于你要将数据库中的值插入到这段\
  \ JavaScript 代码中，因此需要特别注意格式和语法。具体来说，要注意文本字段中的撇号或引号（请注意示例代码中 `'Mad Hatter\\'s Hat\
  \ Emporium'` 内的转义撇号）。同时要注意，货币值是字符串，应仅包含数字和小数点（不含货币符号或逗号）——因此应使用 `'1342.57'`，而不是\
  \ `'$1,342.57'`。\n\n### 产品展示\n\n`impressions`（展示）操作用于记录用户在整个网站上看到产品时的展示情况。通常，电商网站会在多个地方展示产品列表：主页、分类页面、搜索结果页面以及相关产品推荐中。通过发送这些列表中哪些产品被查看（以及随后哪些产品被点击和购买）的数据，你可以更好地了解每个产品和每个列表的点击和购买行为。\n\
  \n以下是数据层中展示数据的示例：\n\n```html\n<script>\ndataLayer = [{\n    'ecommerce': {\n   \
  \     'impressions': [\n              {\n                'name': '高顶礼帽',\n     \
  \           'id': 'MH007',\n                'price': '24.99',\n                'brand':\
  \ '疯帽子帽业',\n                'category': '帽子/男款',\n                'variant': '紫色',\n\
  \                'list': '精选产品',\n                'position': 1\n              },\n\
  \              {\n                'name': '灰色软呢帽',\n                'id': 'MH342',\n\
  \                'price': '17.99',\n                'brand': '疯帽子帽业',\n        \
  \        'category': '帽子/男款',\n                'variant': '灰色',\n              \
  \  'list': '精选产品',\n                'position': 2\n              }\n         ]\n\
  \    }\n}];\n</script>\n```\n\n请注意，`impressions` 是包含展示数据的数组名称。该数组是你希望在此页面上记录展示的产品列表（此示例中仅有两个，但在你的网站上可以按需增加）。这些产品可以包含之前描述的所有核心属性，以及另外两个附加属性：\n\
  \n- `list` 是产品列表的名称。你可以使用任何你想要的名称；选择那些报告用户易于理解的名称来代表你网站上的产品列表，例如“分类页面”、“推荐产品”、“购买了此商品的用户也喜欢”等。\n\
  - `position` 是数值，代表产品在列表中的位置（从 1 开始）。\n\n你可以在页面上包含任意多个列表中的任意多个产品。\n\n**注意**\n\n\
  任何 Google Analytics 请求发送的数据量都有 8 KB 的限制（大约 8000 个字符）。通常情况下，这不会构成障碍，但如果一个页面上的展示数过多，你可能会超出此限制。请留意产品数据列表的长度增长情况，必要时可能需要将其拆分为多个请求（使用\
  \ `dataLayer.push()` 向 GA 发送包含更多产品展示的附加事件）。\n\n**边栏：使用懒加载或无限滚动的展示**\n\n在某些情况下，网站可能不会一次性加载所有产品，而是仅在用户开始向下滚动列表时才加载，这种效果有时被称为懒加载或无限滚动。在这种情况下，某些产品集的展示数据可能在页面加载后才能获得，因此你将无法将其包含在数据层定义中。\n\
  \n在这种情况下，你可以在页面加载后使用 `dataLayer.push()` 向页面发送额外的产品展示数据。你还需要一个事件来将这些数据发送给 GA。本章后面关于点击和\
  \ AJAX 交互的示例提供了在初始页面加载后发送电商信息的例子。\n\n### 产品详情查看\n\n`detail`（详情）操作代表查看产品详情页面。以下是数据层中产品详情查看的示例：\n\
  \n```html\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'detail': {\n \
  \           'products': [{\n                 'name': '高顶礼帽',\n                 'id':\
  \ 'MH007',\n                 'price': '24.99',\n                 'brand': '疯帽子帽业',\n\
  \                 'category': '帽子/男款',\n                 'variant': '紫色'\n     \
  \        }]\n         }\n    }\n}];\n</script>\n```\n\n对于这组数据，`detail` 是对象的名称，其中包含一个带有核心产品属性的\
  \ `products` 数组。（通常，对于产品详情查看，只有一个产品。）\n\n`detail` 操作有一个可选属性 `list`，可以通过 `actionField`\
  \ 对象提供，如下所示：\n\n```html\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'detail':\
  \ {\n            'actionField': { 'list': '精选产品' },\n            'products': [{\n\
  \                 // 同上\n             }]\n         }\n    }\n}];\n</script>\n```\n\
  \n这允许你捕获用户是从哪个列表进入产品详情页面的。（如果你已在跟踪产品展示和产品点击，则此操作并非必需，但如果不捕获这些详细信息，它可能会很有用。）\n\n\
  请注意，数据层中可能包含多种类型的电商数据。例如，在产品详情页面上，可能还有一个带有展示信息的产品列表（例如“相关产品”或“购买了此商品的用户也购买了...”）。你可以将这些合并到数据层中：\n\
  \n```html\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'detail': {\n \
  \            // 同上\n         },\n        'impressions': [\n             // 同上\n\
  \         ]\n    }\n}];\n</script>\n```\n\n\n\n#### 购物车添加与移除操作\n\n`add`（添加）和 `remove`（移除）操作可用于追踪被加入或移出购物车的商品。\n\
  \n```\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'add': {\n        \
  \    'products': [{\n                 'name': 'Top Hat',\n                 'id':\
  \ 'MH007',\n                 'price': '24.99',\n                 'brand': 'Mad Hatter\\\
  's Hat Emporium',\n                 'category': 'Hats/Mens',\n                 'variant':\
  \ 'Purple',\n                 'quantity': 1\n             }]\n         }\n    }\n\
  }];\n</script>\n```\n\n操作对象可命名为 `add` 或 `remove`（视情况而定），并包含一个或多个 `products`。产品对象除包含核心属性外，还包含数值类型的\
  \ `quantity` 属性，用于指示添加或移除的商品数量。\n\n#### 结账流程\n\n您可以使用 `checkout` 操作来测量结账流程。回想一下，当您在\
  \ GA 中启用增强型电子商务时，您标记了结账流程的各个步骤。在示例中，您包含了四个步骤：\n\n配送   账单   付款   审核\n\n最后一步始终是完成购买（这是一个单独的操作，将在下一节介绍）。对于您的网站，您应根据需要包含尽可能多的步骤。您需要在数据层中为每个步骤添加相应的代码，如下所示。\n\
  \n> **注意：** 本示例假设结账流程的每个步骤都是一个独立的页面。对于采用 AJAX 结账流程的网站，请参阅本章后面的“AJAX 购物车与结账交互”部分。\n\
  \n```\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'checkout': {\n   \
  \         'actionField': {\n                'step': 1,\n                'option':\
  \ '白兔快递服务'\n             },\n            'products': [\n                {\n    \
  \              'name': 'Top Hat',\n                  'id': 'MH007',\n          \
  \        'price': '24.99',\n                  'brand': 'Mad Hatter\\'s Hat Emporium',\n\
  \                  'category': 'Hats/Mens',\n                  'variant': 'Purple',\n\
  \                  'quantity': 1\n                },\n                {\n      \
  \            'name': 'Felt Fedora',\n                  'id': 'MH342',\n        \
  \          'price': '17.99',\n                  'brand': 'Mad Hatter\\'s Hat Emporium',\n\
  \                  'category': 'Hats/Mens',\n                  'variant': 'Grey',\n\
  \                  'quantity': 1\n                }\n            ]\n         }\n\
  \    }\n}];\n</script>\n```\n\n操作被命名为 `checkout`，在 `actionField` 对象中，您可以指定两个额外的属性：\n\
  \n- `step` 表示这是结账流程中的第几步。（如果是单步结账，则此项非必需；但在其他情况下，它是必需的。）\n- `option` 是一个可选属性，用于指示结账步骤的某些附加特征。例如，它可用于指示配送方式（如本例所示）或支付方式。\n\
  \n产品数据包含所有核心属性，以及一个 `quantity` 属性（与之前的 `add` 和 `remove` 操作类似）。您需要在构成结账流程的每个页面上重复此数据，并根据需要更改步骤编号和选项。\n\
  \n通常，直到下一步骤才能知道 `option` 的值。例如，在配送页面上，用户可以选择不同的配送方式。您无法在配送页面的数据层中预填该选项，因为您此时还不知道用户将选择什么。为适应这种情况，有一个名为\
  \ `checkout_option` 的附加操作，可用于更新某个步骤的已选选项：\n\n```\n'ecommerce': {\n    'checkout_option':\
  \ {\n        'actionField': {'step': 1, 'option': '白兔快递服务'}\n    }\n}\n```\n\n`actionField`\
  \ 指示 `step`（步骤）和 `option`（选项）的值。通常，您可以在后续页面（本例中为第 2 步）的数据层中包含此项。完整示例如下：\n\n```\n\
  <script>\ndataLayer = [{\n    'ecommerce': {\n        'checkout_option: {\n    \
  \        'actionField': { 'step': 1, 'option': '白兔快递服务' }\n        }\n        'checkout':\
  \ {\n            'actionField': { 'step': 2 },\n            'products': [ // 如上所示\
  \ ]\n         }\n    }\n}];\n</script>\n```\n\n#### 购买\n\n最后，当购买成功完成时，您可以使用 `purchase`\
  \ 操作。\n\n```\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'purchase':\
  \ {\n            'actionField': {\n                'id': 'AW699168',\n         \
  \       'affiliation': '在线商城',\n                'revenue': '55.97',\n          \
  \      'tax':'3.92',\n                'shipping': '',\n                'coupon':\
  \ 'FREE_SHIPPING'\n             },\n            'products': [\n                {\n\
  \                  'name': 'Top Hat',\n                  'id': 'MH007',\n      \
  \            'price': '19.99',\n                  'brand': 'Mad Hatter\\'s Hat Emporium',\n\
  \                  'category': 'Hats/Mens',\n                  'variant': 'Purple',\n\
  \                  'quantity': 1,\n                  'coupon': 'TOPHAT_SALE'\n \
  \               },\n                {\n                  'name': 'Felt Fedora',\n\
  \                  'id': 'MH342',\n                  'price': '17.99',\n       \
  \           'brand': 'Mad Hatter\\'s Hat Emporium',\n                  'category':\
  \ 'Hats/Mens',\n                  'variant': 'Grey',\n                  'quantity':\
  \ 2\n                }\n            ]\n         }\n    }\n}];\n</script>\n```\n\n\
  对于 `purchase` 操作，`actionField` 对象包含多个用于汇总交易的属性：\n\n- `id` 是必填项，作为此次特定购买的唯一标识符。\n\
  - `affiliation` 是选填项，可表示特定店铺（如果您有多个店铺）或联盟营销代码。\n- `revenue` 代表交易的总收入。（此总额可包含或不包含运费和税费，具体取决于您希望在报表中查看收入的方式。）如果您未指定\
  \ `revenue`，GA 将使用交易中 `products` 的 `price` 总和。\n- `tax` 和 `shipping` 是选填项，分别代表交易的税费和运费。\n\
  - `coupon` 是选填项，代表应用于整笔交易的优惠券。\n\n然后，将交易中涉及的每个产品（包括核心产品属性和以下属性）作为一个数组包含在 `products`\
  \ 中：\n\n- `quantity`，如之前在 `add`、`remove` 和 `checkout` 操作中所示，表示该特定产品的购买数量。\n- `coupon`\
  \ 是选填项，代表应用于特定产品的优惠券。\n\n> **注意：** 用于 GA 的相同字段也可用于 Doubleclick 交易标签的购买追踪（但还有一些额外的可选字段可供\
  \ Doubleclick 使用）。\n\n\n\n### 退款\n\n你也可以使用 `refund` 操作记录退款。可以对整个交易进行退款，如下例所示：\n\n\
  ```\n<script>\ndataLayer = [{\n    'ecommerce': {\n        'refund': {\n       \
  \     'actionField': { 'id': 'AW699168' }\n        }\n    }\n}];\n</script>\n```\n\
  \n`id` 属性应与原始交易的 id 匹配。\n\n你也可以只记录交易中特定产品的部分退款：\n\n```\n<script>\ndataLayer = [{\n\
  \    'ecommerce': {\n        'refund': {\n            'actionField': { 'id': 'AW699168'\
  \ },\n            'products': [\n                { 'id': 'MH342', 'quantity': 1\
  \ }\n            ]\n        }\n    }\n}];\n</script>\n```\n\n此处，`actionField` 对象中的\
  \ `id` 应与原始交易的 id 匹配，而 `products` 数组中每个项目的 `id` 和 `quantity` 应代表正在退款的商品。\n\n如本例所示，在数据层中提供退款数据，如果用户可以通过在你的网站上完成一个流程来获得退款，这是一种可行的方法。然而，在许多情况下，退款可能是通过客服流程进行的，该流程发生在网站的用户交互之外（例如，通过在线或电话支持）。在这种情况下，你可以使用\
  \ GA 的 Measurement Protocol 处理此类交互，以记录来自非网络应用程序的数据（第 13 章），或者通过电子表格将数据导入 GA（第 12\
  \ 章）。\n\n### 促销数据\n\n除了产品数据，你还可以提供关于内部促销的信息：例如，宣传某些特价商品的横幅。与产品一样，你可以衡量此类促销的展示次数和点击次数。关于这些促销的数据，以及点击后产生的购买数据，都可以在\
  \ GA 的增强型电子商务报告中获取。\n\n促销活动可以包含以下属性：\n\n```\n{\n    'name': '四月愚人清仓特卖',\n    'id':\
  \ 'PROMO_0401',\n    'creative': '呆头呆脑迪伊 v.1',\n    'position': '商店首页横幅'\n}\n```\n\
  \n这些属性描述促销活动如下：\n\n- `name` 或 `id` 至少需要提供一个。它们分别为促销活动提供标签和标识符。\n- `creative` 是可选的，描述促销活动的创意内容或形式。\n\
  - `position` 是可选的，描述促销活动展示的位置或广告位。\n\n由于促销展示数据在页面加载时可用，你可以像到目前为止看到的所有产品数据一样，将它们包含在数据层声明中。（关于促销点击，请参见本章后面的“产品和促销点击”部分。）\n\
  \n#### 促销展示\n\n促销展示可以按如下方式包含在数据层声明中：\n\n```\n<script>\ndataLayer = [{\n    'ecommerce':\
  \ {\n        'promoView': {\n            'promotions': [\n              {\n    \
  \            'name': '四月愚人清仓特卖',\n                'id': 'PROMO_0401',\n        \
  \        'creative': '呆头呆脑迪伊 v.1',\n                'position': '商店首页横幅'\n     \
  \         },\n              {\n                'name': '免费配送',\n               \
  \ 'id': 'FREE_SHIPPING',\n                'creative': '白兔送货服务',\n              \
  \  'position': '右侧边栏'\n              }\n            ]\n        }\n    }\n}];\n</script>\n\
  ```\n\n动作为 `promoView`，`promotions` 数组包含页面上包含的一个或多个促销活动，并具有前述的属性。\n\n## 用户交互中的电子商务数据\n\
  \n在本章之前的所有示例中，你都在页面加载时将增强型电子商务数据包含在数据层声明中。然而，对于某些类型的交互，你可能需要在稍后的时间点发送数据。你可以通过使用\
  \ `dataLayer.push()` 在用户交互发生时将信息添加到数据层，并使用事件将其发送到 GA。\n\n首先，你将了解始终是用户交互的两种电子商务操作：产品点击和促销点击。然后，你将查看购物车和结账交互，对于\
  \ AJAX 网站，这些交互可能也需要使用这些技术来处理。\n\n### 产品和促销点击\n\n在本章前面部分，你捕获了产品和促销的展示数据（使用 `impressions`\
  \ 和 `promoView` 操作）。现在，你可以使用 `click` 和 `promoClick` 操作来查看哪些展示带来了点击。你需要在相应的用户交互发生时触发这些操作。\n\
  \n你将采用在第 5 章中使用过的相同方法来捕获用户交互；你只需要将电子商务数据添加到其中即可。你会记得，我们讨论了几种跟踪用户交互的方法：\n\n- 直接在网站中嵌入\
  \ `dataLayer.push()` 代码来监听元素上的事件\n- 使用 GTM 的自动事件跟踪功能将事件附加到元素上\n\n这两种方法对于产品和促销点击同样适用，因此你将在接下来的章节中逐一了解。\n\
  \n\n## 网站代码中的显式数据层事件\n\n用于产品点击的电子商务对象如下所示：\n\n```\n'ecommerce': {\n   'click': {\n\
  \      'products': [{\n          'name': 'Top Hat',\n          'id': 'MH007',\n\
  \          'price': '24.99',\n          'brand': 'Mad Hatter\\'s Hat Emporium',\n\
  \          'category': 'Hats/Mens',\n          'variant': 'Purple'\n        }]\n\
  \    }\n}\n```\n\n动作为 `click`，其中包含一个 `products` 数组，内含核心产品属性。（除非你的网站存在特殊逻辑，否则用户每次只能点击一个产品，因此该数组中通常只有一个产品。）\n\
  \n对于促销点击，电子商务对象如下所示：\n\n```\n'ecommerce': {\n   'promoClick': {\n      'promotions':\
  \ [{\n          'name': 'April Foolery Clearance',\n          'id': 'PROMO_0401',\n\
  \          'creative': 'Tweedle Dee v.1',\n          'position': 'Store Home Banner'\n\
  \        }]\n    }\n}\n```\n\n动作为 `promoClick`，其中包含一个 `promotions` 数组，内含促销属性。\n\n\
  对于网站上的每个产品或促销链接，你希望捕获点击交互。为此，你可以在点击链接时调用 `dataLayer.push()` 函数：\n\n```\n<a onclick=\"\
  dataLayer.push({'ecommerce': { // 如上所示 }, 'event': 'ecommerceProductClick' })\"\
  >...</a>\n```\n\n> **注意：** 虽然此示例使用了内联的 `onclick` 属性来调用 `dataLayer.push()` 函数，但该代码也可以用于事件监听器或网站上任何其他现有的\
  \ JavaScript 代码。\n\n电子商务对象中的数据将由网站的服务器端代码填充，就像在页面加载时将数据填充到数据层中一样，但只有在点击链接时，该数据才会被添加到数据层。\n\
  \n请注意，你还添加了一个 `event` 属性。这允许你在 GTM 中设置一个触发器，用于触发 GA 事件跟踪代码，该代码将发送数据（就像 GA 页面浏览代码在页面加载时为数据层中的数据所做的那样）。\n\
  \n## 跟踪显式编码的电子商务点击\n\n假设你已经添加了前面描述的 `dataLayer.push()` 代码，你可以创建代码和触发器，以使用这些变量向 GA\
  \ 发送事件。\n\n创建一个新代码。选择 **Google Analytics** ➤ **Universal Analytics** 作为代码类型。使用之前创建的\
  \ `{{GA Property ID}}` 变量作为跟踪 ID。在“类别”和“操作”字段中，输入一些值来描述事件（请参见以下屏幕截图）。该示例使用了“Ecommerce”作为类别，以及“Product\
  \ Click”作为操作。\n\n![A978-1-4842-0265-4_7_Figg_HTML.jpg](img/A978-1-4842-0265-4_7_Figg_HTML.jpg)\n\
  \n在 **更多设置** ➤ **电子商务功能** 下，勾选“启用增强型电子商务功能”复选框（就像之前为 GA 页面浏览代码所做的那样）。勾选“使用数据层”复选框。选择“继续”以为代码指定一个触发器。选择“更多”，然后点击“新建”按钮以创建一个新触发器。选择“自定义事件”作为触发事件。自定义事件允许你通过任何\
  \ `event` 名称在 `dataLayer.push` 时触发。在“事件名称匹配”中，输入 `ecommerceProductClick`（与代码中的名称相对应）。点击“创建触发器”按钮，并为触发器命名：“Custom\
  \ Event – Product Clicks”。GTM 会保存触发器并返回到代码创建页面。保存代码，并为其命名：“GA – Event – Ecommerce\
  \ Product Clicks”。\n\n此示例专门针对产品点击。你可以为促销点击创建另一个代码（在 `event` 属性中使用不同的名称，该名称将作为该代码的触发器）。\n\
  \n## 使用 GTM 的自动事件跟踪\n\n上一节方法的缺点是（如第 5 章中所述），它迫使你将跟踪 JavaScript 代码包含在网站代码中，而你最初采用\
  \ GTM 的原因之一就是将跟踪 JavaScript 从网站代码中移除，并将其控制权集中到 GTM 中。\n\n作为替代方案，你可以使用 GTM 内置的自动事件跟踪来查找特定类型的链接或其他元素，以触发代码。不过，你仍然需要为每个元素提供要发送的电子商务数据，这可以通过使用\
  \ `data-` 属性来实现。在 HTML 中，`data-` 属性本质上是一个预留的属性命名空间，用于提供关于元素的附加的、特定于网站的数据。你可以在产品链接上使用\
  \ `data-` 属性：\n\n```\n<a data-ecommerce='{\"ecommerce\": { // 如上所示 }}' class=\"\
  product\" href=\"/products/fedora\"> Fedora</a>\n```\n\n此处你为该属性选择了名称 `data-ecommerce`。你可以选择任何以\
  \ `data-` 开头的名称，但要确保与你网站上已有的任何属性不会发生冲突。该属性的内容是一个对象，包含产品或促销点击的所有电子商务数据。\n\n> **警告：**\
  \ 尽管在大多数情况下，单引号 (`'`) 和双引号 (`\"`) 在 HTML 和 JavaScript 中可以互换使用，但 JSON（JavaScript\
  \ 对象表示法）规范明确要求使用双引号。JavaScript 的 `JSON.parse()` 函数（你将使用它来访问此值）会遵守此规范，并且仅当内部引号为双引号时，才会将\
  \ `data-ecommerce` 属性视为一个对象（否则，它将被解释为字符串）。简而言之：在此示例中不要互换引号样式。\n\n将数据放置在你要跟踪的产品和促销链接上之后，你可以在\
  \ GTM 中创建一个变量来读取此数据，然后将其与通过自动事件跟踪设置的事件一起发送。\n\n### 使用自动事件跟踪跟踪电子商务点击\n\n首先，你将创建一个变量来从\
  \ `data-ecommerce` 属性中读取电子商务数据。回忆第 5 章中的内容，使用自动事件跟踪会自动向数据层添加一条消息，其中包含一个名为 `{{Click\
  \ Element}}` 的变量，该变量允许你访问被点击元素的所有属性。你将在一个自定义 JavaScript 变量中使用此变量，以返回 `data-ecommerce`\
  \ 属性的值。\n\n创建一个新变量。对于变量类型，选择 **自定义 JavaScript**。以下是你要使用的代码：\n\n```\nfunction() {\n\
  \   var el = {{Click Element}};\n   if(el && el.getAttribute) {\n       var data\
  \ = el.getAttribute('data-ecommerce');\n       try { return JSON.parse(data); }\
  \ catch(e) { return data; }\n   }\n}\n```\n\n这使用了现有的 `{{Click Element}}` 变量，并调用名为\
  \ `JSON.parse()` 的 JavaScript 函数来检索 `data-ecommerce` 属性，并将该属性的内容作为变量的值返回。只要你按照前面讨论的方式在属性中正确格式化了该对象，它就会被作为\
  \ JavaScript 对象返回。\n\n保存变量，并为其命名：“Ecommerce Data Attribute”。\n\n接下来，你可以使用自动事件跟踪来设置一个\
  \ GA 事件代码，以跟踪产品或促销的点击。\n\n创建一个新代码。选择 **Google Analytics** ➤ **Universal Analytics**\
  \ 作为类型。使用之前创建的 `{{GA Property ID}}` 变量作为跟踪 ID。选择 **跟踪类型** ➤ **事件**。填写要发送到 GA 的“类别”、“操作”和“标签”。你需要根据自己的习惯选择希望在报告中看到这些内容的方式，但一个合理的选择可能是：\n\
  \n- 类别：Ecommerce\n- 操作：Product Click\n- 标签：`{{Click Text}}`（链接的锚文本）\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将以下英文文本翻译成中文。\n\
  \n\n在 `更多设置` ➤ `电子商务功能` 下，选中启用增强型电子商务功能的复选框。不要像本章其他示例那样选择使用数据层，而是选择您之前创建的 `{{Ecommerce\
  \ Data Attribute}}` 变量。选择 `继续` 来为标签指定一个触发器。选择 `点击`，然后点击“新建”按钮创建一个新的点击触发器。选择 `部分点击`。指定一些条件，以便在适当的点击上触发此标签。在本示例中，产品链接具有一个值为\
  \ `product` 的类属性，因此您可以使用它。（有关自动事件跟踪触发器的更深入讨论，请参见第 5 章）。`{{Click Classes}} – 包含 –\
  \ product`。命名此触发器。然后选择 `链接点击` 作为触发器类型。筛选触发器应监听产品点击的页面（如果需要）。如果您希望将此触发器限制为仅监听特定页面上的产品点击，您可以使用条件或正则表达式来匹配某些页面。要监听所有页面，请使用正则表达式匹配任意\
  \ URL：`{{Page URL}} – 匹配 RegEx – .*`。选择 `创建触发器` 按钮，并为触发器命名：「产品点击」。GTM 会保存该触发器并返回到标签创建页。保存标签，为其命名为：「GA\
  \ – 事件 – 电子商务产品点击」。\n\n此示例专门用于产品点击。您可以创建一个促销点击的标签（使用不同的触发器来定位适当的链接）。同一个 `{{Ecommerce\
  \ Data Attribute}}` 变量也可以用于此标签。\n\n### AJAX 购物车和结账交互\n\n在本章前面，您使用了 `add`、`remove`、`checkout`\
  \ 和 `purchase` 操作来跟踪购物车和结账流程中的交互，并且您假设该流程中的每一步都是一个不同的页面，并在这些页面上的数据层声明中加入了信息。\n\n\
  使用 AJAX 方法的网站可以使用 `dataLayer.push()` 将电子商务对象添加到数据层，以便衡量操作（`add`、`remove`、`checkout`、`purchase`）：\n\
  \n```\n<script>\ndataLayer.push({\n  'event': 'ecommerceCheckout',\n  'ecommerce':\
  \ {\n    'checkout': {\n      'actionField': {\n        'step': 1,\n        'option':\
  \ '白兔快递服务'\n      },\n      'products': [\n        {\n          'name': '高顶礼帽',\n\
  \          'id': 'MH007',\n          'price': '24.99',\n          'brand': '疯帽子帽子帝国',\n\
  \          'category': '帽子/男式',\n          'variant': '紫色',\n          'quantity':\
  \ 1\n        },\n        {\n          'name': '软呢帽',\n          'id': 'MH342',\n\
  \          'price': '17.99',\n          'brand': '疯帽子帽子帝国',\n          'category':\
  \ '帽子/男式',\n          'variant': '灰色',\n          'quantity': 1\n        }\n   \
  \   ]\n    }\n  }\n});\n</script>\n```\n\n这段代码通常会在页面加载新内容时嵌入到 AJAX 响应中。此代码与本章前面的结账示例相同，只是有两处更改：\n\
  \n- 它使用了 `dataLayer.push()`\n- 它包含了一个 `event` 属性\n\n由于页面不会重新加载，因此您不希望声明一个新的数据层（使用\
  \ `dataLayer = []`）；相反，您希望在现有数据层上追加数据（使用 `dataLayer.push()`）。在数据层已经存在后再次声明它将覆盖其先前的值，并可能导致\
  \ GTM 行为异常。\n\n此外，还添加了一个 `event` 属性。您可以使用此属性来触发事件或虚拟页面浏览标签，以将数据发送到 GA。\n\n> **注意**\
  \  \n> 此解决方案使用 `dataLayer.push()` 和自定义事件触发器，是跟踪 AJAX 购物车或结账流程的一种方法，可能也是最直接的方法。有关跟踪\
  \ AJAX 流程以及 GTM 中其他选项（如表单提交和历史更改触发器）的深入讨论，请参见第 6 章。\n\n#### 跟踪 AJAX 电子商务操作\n\n假设您已经添加了前面描述的\
  \ `dataLayer.push()` 代码，您可以创建标签和触发器来使用这些变量向 GA 发送事件。\n\n创建一个新标签。选择 `Google Analytics`\
  \ ➤ `Universal Analytics` 作为标签类型。使用之前创建的 `{{GA Property ID}}` 变量作为跟踪 ID。选择 `跟踪类型`\
  \ ➤ `页面浏览` 或 `跟踪类型` ➤ `事件`，具体取决于您是希望使用虚拟页面浏览还是事件来衡量此交互（进一步讨论请参见第 5 章和第 6 章）。填写页面或类别和操作字段（视情况而定）。在\
  \ `更多设置` ➤ `电子商务功能` 下，选中启用增强型电子商务功能的复选框。勾选使用数据层的框。选择 `继续` 来为标签指定一个触发器。选择 `更多`，然后点击“新建”按钮创建一个新的触发器。选择\
  \ `自定义事件` 作为导致触发器触发的事件。自定义事件允许您通过任何 `event` 名称的 `dataLayer.push` 来触发。要使事件名称匹配，请输入\
  \ `ecommerceCheckout`（与代码中的名称对应）。选择 `创建触发器` 按钮，并为触发器命名：「自定义事件 – 电子商务结账」。保存标签，为其命名为：「GA\
  \ – 电子商务 – 结账」。\n\n此示例专门用于结账操作。您可以创建其他标签用于 `add`、`remove` 或 `purchase` 操作（在您将用作这些标签触发器的\
  \ `event` 属性中使用不同的名称）。\n\n## 总结\n\n-   Google Analytics 提供两种电子商务跟踪选项。基础电子商务仅跟踪已完成的购买。增强型电子商务跟踪网站中的许多电子商务交互。两者都必须在\
  \ Google Analytics 中启用。您还可以在 Google Analytics 的视图设置中设置首选货币，如果您以不同货币发送数据，它可以自动转换。\n\
  -   基础电子商务跟踪需要实施服务器端代码，将电子商务数据添加到网站最终交易页面的数据层中。然后在 Google Tag Manager 中添加一个 Google\
  \ Analytics 交易标签，使其仅在此最终交易页面上触发，读取数据层中的信息并将其发送到 Google Analytics。这种方法的优点在于简单直接，但能够从数据中得出的洞察类型有限。\n\
  -   增强型电子商务跟踪需要实施服务器端代码，将电子商务数据添加到网站的许多页面，以记录诸如产品展示、点击、详情浏览、添加至购物车和从购物车移除、购买和退款、以及内部促销的展示和点击等详细信息。增强型电子商务数据通过从数据层读取电子商务数据，随现有的页面浏览或事件标签一起发送到\
  \ Google Analytics。对于触发电子商务操作的用户交互（例如点击或 AJAX 结账流程），您可以应用第 5 章和第 6 章中的自动事件跟踪和虚拟页面浏览量等方法发送电子商务数据。增强型电子商务的优点在于它提供了更广泛的数据池用于分析，但收集这些额外类型的数据需要付出更多努力。\n\
  \n## 脚注\n1. [`https://developers.google.com/analytics/devguides/platform/currencies`](https://developers.google.com/analytics/devguides/platform/currencies)\n\
  2. [`https://developers.google.com/analytics/devguides/platform/currencies`](https://developers.google.com/analytics/devguides/platform/currencies)\n\
  \n\n\n"
- "# 8. 数据清理与丰富\n\n> “我用一个词时，” 矮胖子相当轻蔑地说，“它正是我选择的意思——不多也不少。” ——刘易斯·卡罗尔，《爱丽丝镜中奇遇记》\n\
  \n你正在收集大量数据；前几章已经讨论了如何通过谷歌跟踪代码管理器自定义和扩展发送给谷歌分析的数据类型。然而，在所有这些数据中，有些部分你并不希望出现在报告中——例如，来自测试的内部数据。有时，你希望对数据进行修改以使其更有用——清理\
  \ URL、从查询参数中提取重要信息，以及将类似页面分组。\n\n本章首先探讨在 GTM 和 GA 中用于这类数据清理的工具。本章后半部分将详细介绍这些工具最常见用法的几个具体场景，以展示它们的实际应用。\n\
  \n## 数据清理工具\n\n你可以在两个环节删除或修改最终进入 GA 报告的数据：\n\n*   在谷歌跟踪代码管理器中，使用触发器和变量在数据收集时阻止或修改数据。\n\
  *   在谷歌分析中，在数据接收后，使用过滤器和其他设置来排除或修改视图中的数据。\n\n让我们来看看可用的选项。\n\n### GTM：阻止触发器与覆盖默认值\n\
  \n首先，我们来谈谈 GTM 如何删除或修改数据。\n\n在 GTM 中，你可以通过恰当地使用触发器来阻止数据被发送到 GA。你还可以使用变量来修改或覆盖 GA\
  \ 代码或其他 GTM 代码收集的默认值。\n\n#### 阻止触发器\n\nGTM 使用触发器来表示“当……时触发此代码”。这可以是网页浏览量、点击或表单提交等自动事件，或者是推送到数据层的自定义事件。（更多触发器示例请回顾第\
  \ 5 章。）\n\n你还可以指定阻止触发器。触发触发器与阻止触发器的组合表示“当 X 发生时触发此代码，但 Y 发生时除外”——也就是说，你可以设置一些例外情况来阻止代码触发。\n\
  \n添加阻止触发器的方式与设置触发触发器相同，即在代码设置流程中选择“创建例外”（见图 8-1）。\n\n![A978-1-4842-0265-4_8_Fig1_HTML.jpg](img/A978-1-4842-0265-4_8_Fig1_HTML.jpg)\n\
  \n**图 8-1.** 添加阻止触发器\n\n触发器必须始终包含一个推送到数据层的事件。如果选择网页浏览量的触发器类型，则会使用内置的`gtm.js`事件。如果选择点击、表单或其他自动事件选项，则会使用相应的自动事件标签（如`gtm.click`等，参见第\
  \ 5 章）。如果你指定自定义条件，则需要说明触发器应阻止哪个或哪些事件。\n\n> **提示：** 在许多情况下，触发触发器和阻止触发器会作用于同一事件，例如：“在所有网页浏览时触发，但\
  \ URL 包含`/blog`的网页浏览除外”。然而，有时你可能希望基于某个变量来阻止所有事件（网页浏览、点击等）。例如：“在 X（任何触发器）发生时触发，但\
  \ GTM 处于预览模式时除外”。在这种情况下，你可以使用自定义事件触发器，并指定一个正则表达式`.*`（匹配任何内容），以便在任何事件发生时阻止。然后，你可以将此触发器作为阻止触发器复用于多种不同类型的代码触发触发器。本章将给出多个示例。\n\
  \n#### 在代码中覆盖默认值\n\n在 GA 代码中，一些字段会自动填充，包括页面和引荐来源 URL、广告系列信息（参见第 9 章）等。但是，如果需要，你可以使用“更多设置”\
  \ ➤ “要设置的字段”来覆盖这些值（见图 8-2）。\n\n![A978-1-4842-0265-4_8_Fig2_HTML.jpg](img/A978-1-4842-0265-4_8_Fig2_HTML.jpg)\n\
  \n**图 8-2.** 使用“要设置的字段”覆盖 GTM 中 GA 代码的值\n\n你之前已经使用过这些设置来让 GA 执行非默认操作，例如设置跨域跟踪（参见第\
  \ 2 章）或为虚拟网页浏览创建 URL 标签（参见第 5 章）。任何时候，当你希望手动覆盖 GA 默认使用的某个字段值时，都可以使用“要设置的字段”。\n\n\
  每个字段通过名称指定，你需要提供一个值（通常是变量）来使用。下拉菜单中有一长串可用的字段。本章及本书后续章节将讨论其中的几个，你可以在 GA 文档中找到完整列表。¹\n\
  \n### GA：过滤器与视图\n\n接下来，让我们看看如何在 GA 中修改数据。\n\n回想一下第 1 章，你网站的跟踪代码对应于 GA 中的一个媒体资源。每个媒体资源可以有一个或多个视图，这些视图是针对该网站的不同数据桶。\n\
  \n创建视图非常简单，只需在谷歌分析“管理”标签页最右侧列的视图下拉菜单中选择“创建新视图”即可（见图 8-3）。请注意，视图从创建之时起开始累积来自媒体资源的数据，但不会追溯填充历史数据。\n\
  \n![A978-1-4842-0265-4_8_Fig3_HTML.jpg](img/A978-1-4842-0265-4_8_Fig3_HTML.jpg)\n\
  \n**图 8-3.** 创建新视图\n\n过滤器允许你从视图中包含或排除特定数据（例如，仅包含网站的某一部分，或排除你自己的员工在网站上的互动）。它们还可以让你修改数据（例如清理\
  \ URL 格式或其他信息）。\n\n在视图的设置中（最右侧列），你可以看到“过滤器”被列为选项之一（见图 8-4）。每个视图可以应用不同的过滤器，从而产生不同的数据集。你可以在该列表中查看已应用于该视图的任何现有过滤器。从该列表中选择一个过滤器可以对其进行编辑或从视图中移除。\n\
  \n![A978-1-4842-0265-4_8_Fig4_HTML.jpg](img/A978-1-4842-0265-4_8_Fig4_HTML.jpg)\n\
  \n**图 8-4.** GA 管理设置中视图的过滤器列表\n\n可以通过以下两种方式之一将过滤器添加到视图：\n\n*   将帐户中的现有过滤器应用于该视图。\n\
  *   创建一个新过滤器并应用于该视图。\n\n过滤器创建后存储在帐户级别。这意味着你可以创建一个过滤器，并将其应用于帐户内的任意多个视图。（这也意味着用户需要拥有帐户级别的“编辑”权限才能创建新过滤器。）你可以在“管理”区域的“帐户”列（最左侧列）下的“所有过滤器”中查看帐户中的所有过滤器，并在此处快速将过滤器应用于多个视图。\n\
  \n要应用现有过滤器或创建新过滤器，请选择过滤器列表顶部的按钮。你可以选择应用一个或多个现有过滤器，或创建一个新过滤器（见图 8-5）。\n\n![A978-1-4842-0265-4_8_Fig5_HTML.jpg](img/A978-1-4842-0265-4_8_Fig5_HTML.jpg)\n\
  \n**图 8-5.** 为视图创建过滤器\n\n#### 过滤器的类型\n\n创建新过滤器时，你有两个主要选择：\n\n*   预定义过滤器涵盖了几种常见用例，带有易于使用的下拉菜单来定义过滤器选项。\n\
  *   自定义过滤器提供更多灵活性，并允许使用正则表达式匹配模式。\n\n\n\n## 预定义过滤器\n\n预定义过滤器通过一系列下拉菜单，让你指定在视图中包含或排除哪些数据，涵盖了一些常见用例，例如排除某个\
  \ IP 地址，或仅包含网站的特定子目录。（本章稍后你将看到这两个示例。）\n\n## 自定义过滤器\n\n对于更复杂的需求，自定义过滤器提供了多种选项（见图\
  \ 8-6）。\n\n![A978-1-4842-0265-4_8_Fig6_HTML.jpg](img/A978-1-4842-0265-4_8_Fig6_HTML.jpg)\n\
  \n图 8-6. 自定义过滤器类型和选项\n\n首先，自定义过滤器有若干不同的类型：\n\n- **排除**：排除与正则表达式匹配的数据\n- **包含**：仅包含与正则表达式匹配的数据\n\
  - **小写**：将字段中的字母字符转换为小写\n- **大写**：将字段中的字母字符转换为大写\n- **搜索和替换**：在字段中查找正则表达式匹配项，并将其替换为文本\n\
  - **高级**：在一个或两个字段中查找正则表达式匹配项，并重新排列这些字段中的文本\n\n本章稍后，你会看到每种过滤器类型在实际应用中的使用情况。当你选择其中一种过滤器类型时，你会看到\
  \ GA 提供的用于过滤的字段下拉列表非常长（见图 8-7）。\n\n![A978-1-4842-0265-4_8_Fig7_HTML.jpg](img/A978-1-4842-0265-4_8_Fig7_HTML.jpg)\n\
  \n图 8-7. 过滤器中可用的字段（部分列表）\n\n此列表包含你可能预期的所有字段，但有一点小挑战：此列表中使用的字段名称，与 GA 报告中相应维度的命名有时并不完全匹配。例如，此菜单包含了`Request\
  \ URI`，这与 GA 报告中简单称为`Page`的维度是同一个东西。在阅读本章示例时，你会看到此列表中几个最常用的、可能有用的字段；如果你不太确定哪个字段是正确的，GA\
  \ 文档中有完整的说明。²\n\n所有允许你在字段中匹配值的过滤器类型（`包含`、`排除`、`搜索和替换`、`高级`）都使用正则表达式作为输入。这使你既可以做到非常具体（一个确切的值），也可以做到非常宽泛（多个值，或跨值的某种通用模式），按需选择。\n\
  \n**注意**：在正则表达式中，像点号（`.`）和问号（`?`）这样的字符具有特殊含义。然而，有时它们也会出现在你正在匹配的字符串中（例如，考虑一个像 `/alice.html?potion=drink-me`\
  \ 这样的 URL）。你需要小心，对于任何你想用作原义字符的特殊正则表达式字符，请在其前面加上反斜杠（`\\`）。需要反斜杠才能被视为普通字符的字符有：`\\\
  .?+*(^$`\n\n### 测试和排查 GA 中的视图和过滤器\n\n对于在 GTM 中进行的更改，你可以使用 GTM 的预览模式和其他浏览器工具来检查发送给\
  \ GA 的数据（见[第 4 章）。但是，对于在 GA 中使用视图和过滤器所做的更改呢？这些更改是在数据接收后应用的，因此基于浏览器的测试工具对你没有帮助。\n\
  \n在 GA 的管理界面中进行任何更改的关键特性是，它们仅从你进行更改的那一刻起生效。更改不会追溯性地影响视图中报告的数据。这对测试更改有着重要影响。假设你向一个视图添加了一个过滤器，之后（一小时、一天、一周）你发现有一个输入错误，不小心过滤掉了本不想过滤的内容。没有办法在视图数据中追溯性地撤消此操作。你可以修正过滤器中的拼写错误，这将修复之后的数据，但在这错误数据存在的中间一小时、一天或一周内，数据保持错误。\n\
  \n考虑到这个限制，为了帮助测试和排查过滤器及其他视图配置设置，你还需要创建以下视图：\n\n- 一个**未经过滤的视图**，用于排查和备份。如果你正在过滤掉流量，如果没有一组未经过滤的数据进行比较，你怎么知道你移除了什么？一个未经过滤的视图为你提供了一个比较点。创建此视图，并且不对其应用任何过滤器。未经过滤视图的另一个优点是作为备份：如果出现问题，你不小心丢失了一些数据，你总可以查阅未经过滤的视图。\n\
  - 一个或多个**测试视图**，用于测试对过滤器和其他视图配置设置的更改，并确保它们正常工作。这样，你有一个地方可以尝试更改，即使犯了错误也不会有不良后果（因为你实际上并不使用这些测试视图中的数据进行工作）。\n\
  \n当然，这些视图是除了你实际用于网站报告和分析的任何视图之外的额外视图。\n\n**提示**：如果你是从零开始搭建一个网站，请在 GA 中设置网站的同时创建这些视图，这样数据可以追溯回最初。如果你接手的是一个之前已经设置好的网站，请立即创建这些视图，以便它们开始收集数据，在你后续进行更改和更新时为你提供帮助。\n\
  \n一旦你创建了测试视图，就可以用它来尝试管理设置中的配置更改，然后查看测试视图报告中的数据，确保它们符合你的预期。\n\n由于 GA 中的数据通常按天报告，且更改仅对未来生效，因此一天之中进行的更改可能会导致当天的数据是混合的（包含更改前后的数据）。为了清晰判断过滤器是否正常工作以及数据是否“干净”，你通常需要等到第二天。这个过程通常如下：\n\
  \n1.  在测试视图中对过滤器或其他视图配置设置进行更改。\n2.  等到下一个日历日的某个时间。\n3.  检查 GA 中的相关报告，将日期范围更改为当天。\n\
  4.  更改是否正确？\n    -   如果一切看起来没问题，请将相同的过滤器或更改应用到报告视图中。\n    -   如果不对，则从第 1 步开始重复此过程。\n\
  \n**注意**：对于某些类型的数据，你或许可以使用实时报告查看新应用过滤器的效果，但这些报告并未全面覆盖 GA 中的数据类型，并且可能难以用于比较两组数据。\n\
  \n### 划分内部流量\n\n最常见的需求之一是将网站流量区分为内部用户流量和一般公众流量，即你对其网站行为感兴趣的客户和潜在客户。内部用户的行为与客户截然不同，他们被排除在你的营销活动目标之外，并且通常从事网站功能测试。尽管这些活动的数据可能对你有用，但其用途与外部用户的活动数据不同，因此你希望能够将它们分开。\n\
  \n接下来的部分将探讨与此挑战相关的两个主要主题：\n\n- 移除（或分离）内部用户的流量，以避免“污染”你的客户数据。\n- 处理用于开发、测试和预发布的多个网站版本，以确保测试活动与你的在线活动网站保持分离。\n\
  \n\n\n### 剔除内部流量\n\n“内部流量”包括你所在组织的员工，以及代表你进行网站维护工作的第三方人员，例如广告代理商或网站开发者。通常情况下，这些人员对网站的使用并不属于外部用户——即你的真实受众——的范畴，因此你需要将其排除或分离出来。\n\
  \n有多种不同的方法可以识别并屏蔽这些内部流量（在`GTM`或`GA`中通过 IP 地址进行，或者在`GA`中通过服务提供商进行），你将在接下来的章节中了解这些方法。不同组织对内部流量的定义和处理方式各不相同，因此请评估所有可用选项，以确定最适合你情况的方法。\n\
  \n**注意：** 这些方法都无法做到绝对完美：你的员工有时会出差、在家办公，或处于其他难以将其识别为“内部”人员的情况。请尽力而为，但应预期到无论如何总会有部分数据泄露。\n\
  \n#### 使用 IP 地址\n\n如果你打算针对特定 IP 地址来排除内部流量，有两种可选方案：\n\n-   在`GTM`中为`GA`代码添加一个屏蔽触发器。这可以阻止你的网站发送任何与内部\
  \ IP 地址相关的数据。\n-   在`GA`中为某个数据视图应用过滤器。这可以让你排除内部流量，同时仍能将内部流量的数据收集到`GA`的未过滤视图中。\n\n\
  如果你的唯一目标是排除内部流量，那么这两种方法都适用。然而，在很多情况下，你可能希望在`GA`的某些视图中仅保留内部流量。例如，假设你运营一个大学网站，并希望根据\
  \ IP 地址创建分别针对校内和校外流量的数据视图。在这种情况下，你需要通过`GTM`收集所有 IP 地址的数据，然后在`GA`的数据视图中进行数据过滤（即后一种方法）。\n\
  \n**侧边栏：在非 GA 代码中屏蔽内部流量**\n\n尽管本书主要关注如何在`GTM`中使用`GA`代码，但在`GTM`中使用屏蔽触发器来处理内部流量的方法同样适用于通过`GTM`部署的其他代码。你希望将内部流量排除在其他衡量工具之外，尤其是广告追踪和定向工具。（例如，完全没有必要向自己员工进行营销！）\n\
  \n与`GA`类似，其他工具通常也具备基于 IP 地址或其他特征来过滤或剔除内部流量的能力。但如果需要在每个工具中都单独进行此操作，那将非常麻烦。通过在`GTM`中设置一组屏蔽触发器，你就可以用一种集中的方式来阻止所有你想对内部流量禁用的代码被触发。并且，如果你的\
  \ IP 地址发生变化或需要更新，只需在一个地方修改即可。\n\n无论你是在`GA`中还是在`GTM`中分离内部流量，首先你需要知道哪些 IP 地址需要被过滤掉。虽然你可以查询自己的\
  \ IP 地址（在谷歌中搜索“我的 IP 地址是什么”即可搞定），但仅凭此你无法得知以下信息：你办公室网络中的所有设备是共享一个独立 IP 还是共享一个 IP\
  \ 地址段、其他办公地点是否存在额外 IP 地址、以及有关你内部网络的其他细节。你需要从 IT 部门的网络专家那里获取一份全面的 IP 地址列表或地址段，才能可靠地滤除内部流量。\n\
  \n**注意：** 通常一个设备同时拥有内部 IP 地址（由你网络的路由器分配）和外部 IP 地址（路由器在公共互联网上的地址）。你需要使用外部 IP 地址才能在`GA`或`GTM`中进行过滤。内部\
  \ IP 地址通常以`10`、`172`或`192`开头，因此如果你收到的列表中包含这些 IP 地址，请再次询问，并务必明确要求提供外部地址。\n\n现在让我们来看看通过\
  \ IP 地址排除流量的两种不同方法，首先从在`GTM`中设置屏蔽触发器开始。`GTM`本身没有内置的 IP 地址变量，且该值无法仅通过 JavaScript\
  \ 获取，因此你需要为`GTM`提供一种访问该值的方法。最自然的做法就是将其直接添加到数据层声明中：\n\n```\ndataLayer = [{ 'ipAddress':\
  \ '93.184.216.34' }];\n```\n\n使用任一种服务器端编程语言都可以非常简单地实现这一点。\n\n**注意：** 尽管将 IP 地址作为自定义维度传递给`GA`可能很诱人，但请不要这样做。IP\
  \ 地址被视为潜在的个人身份信息，禁止包含在`GA`的报告中。（关于自定义维度的更多信息，请参阅第 11 章。）\n\n**在`GTM`中通过 IP 地址阻止数据发送**\n\
  \n首先，你需要一个用于存储 IP 地址的变量。假设它已经按照前述方法存在于数据层中。\n\n在`GTM`中，创建一个新变量。对于变量类型，选择“数据层变量”。对于数据层变量名称，输入`ipAddress`（或者你在数据层中为\
  \ IP 地址使用的任何标签）。保存此变量，并为其命名：“IP Address”。\n\n\n\n现在您可以基于`{{IP Address}}`变量创建一个触发器。对于触发器类型，需要使用正则表达式匹配所有事件，因为您希望匹配页面浏览量、自动事件触发器以及发生的任何其他事件。\n\
  \n在 GTM 中创建一个新触发器。对于事件，选择“自定义事件”。对于事件名称，选中“使用正则表达式”复选框并输入`.*`（如下面的截图所示）。\n\n![A978-1-4842-0265-4_8_Figa_HTML.jpg](img/A978-1-4842-0265-4_8_Figa_HTML.jpg)\n\
  \n选择“添加过滤器”以应用条件。对于条件，选择`{{IP Address}}`变量以及适当的条件和值，以排除特定的一个或多个 IP 地址（如下面的截图所示）。如果只有一个\
  \ IP 地址，“等于”可能是合适的选项；如果要匹配一个范围，可以使用“匹配正则表达式”。\n\n![A978-1-4842-0265-4_8_Figb_HTML.jpg](img/A978-1-4842-0265-4_8_Figb_HTML.jpg)\n\
  \n保存触发器，将其命名为“Blocking – Internal IPs”。如果您要排除多个 IP 地址，可以重复上述步骤创建多个触发器。现在您终于可以应用此触发器来阻止标签了。\n\
  \n在 GTM 中选择您的 GA 页面浏览量标签（或任何其他标签）进行编辑。选择“触发条件”编辑标签的触发器。选择“创建例外”。选择您之前创建的“Blocking\
  \ – Internal IPs”触发器。如果您创建了多个阻塞触发器（用于多个 IP 地址），可以选择多个触发器。保存对标签的更改。\n\n别忘了预览并发布对容器的更改，以便新的阻塞触发器生效。\n\
  \n接下来，我们来看看使用 IP 地址的第二种方法——在 GA 中使用过滤器。GA 会自动捕获 IP 地址，因此无需在数据层中为该值设置变量。此外，GA 不仅允许您排除一个或多个\
  \ IP 地址，还允许您在视图中仅包含内部流量。\n\n## 在 GA 中按 IP 地址过滤流量\n\n您将在单个视图上创建一个过滤器，但创建后，可以将其应用到任意多个视图。\n\
  \n在 GA 的管理区域中，选择相应的账号、媒体资源和视图，然后点击第三列的“过滤器”以查看该视图的过滤器。选择“新建”按钮以添加新过滤器。选择创建一个新过滤器（而不是应用现有过滤器）。将过滤器命名为“Exclude\
  \ Internal IPs”。对于简单的情况（精确 IP、以特定值开头的 IP），您可以使用预定义过滤器；对于多个值或范围，可以使用自定义过滤器来编写正则表达式：\n\
  \n*   选择“预定义”选项卡，使用下拉菜单排除来自某个 IP 地址的流量（参见下面的截图）。“等于”或“开头为”都是非常有用的选项（分别适用于单个 IP 地址和整个\
  \ IP 地址段）。\n\n![A978-1-4842-0265-4_8_Figc_HTML.jpg](img/A978-1-4842-0265-4_8_Figc_HTML.jpg)\n\
  \n*   或者，选择“自定义”选项卡。选择“排除”作为过滤器类型，选择“IP 地址”作为字段。然后，输入要排除的 IP 地址的正则表达式（参见下面的截图）。\n\
  \n![A978-1-4842-0265-4_8_Figd_HTML.jpg](img/A978-1-4842-0265-4_8_Figd_HTML.jpg)\n\
  \n保存过滤器。\n\n请记住，此过滤器仅影响未来的数据。此前从该 IP 地址收集的数据不会受到影响。\n\n如果您希望创建一个仅包含内部流量的视图，只需在此过滤器中将其从“排除”更改为“包含”即可。\n\
  \n**提示**：GA 会先获取该媒体资源的完整数据集，然后应用过滤器来确定剩余的数据。这意味着应用多个排除过滤器是有意义的（例如，同时排除两个不同的 IP 地址）。然而，对同一个字段应用多个包含过滤器则没有意义——包含意味着仅包含。所以，如果您说“仅包含\
  \ IP 地址 A”，然后又说“仅包含 IP 地址 B”，结果数据中将不包含任何内容。相反，您必须在单个过滤器中使用正则表达式来匹配多个值。\n\n现在您已经创建了这个过滤器，可以将其应用到任意多个视图。\n\
  \n## 使用服务提供商\n\nGoogle Analytics 包含另一个有时对过滤内部流量有用的标签：一个名为“服务提供商”的维度。“服务提供商”维度根据用户的\
  \ IP 为用户的互联网服务提供商提供一个标签。\n\n对于许多消费者和一些企业，列出的互联网服务提供商将是他们访问互联网的电信公司（电话或电缆公司）。然而，较大的企业、机构和政府机构可能会被列为他们自身\
  \ IP 地址段的服务提供商。在这些情况下，您可以在 GA 中使用过滤器来处理服务提供商标签。这种方法的优点是您无需知道 IP 地址范围或使用正则表达式来表达它们。\n\
  \n您可以在 GA 的“受众群体”>“技术”>“网络”报告中查看您的组织是否被列为自己的服务提供商（参见图 8-8）。\n\n![A978-1-4842-0265-4_8_Fig8_HTML.jpg](img/A978-1-4842-0265-4_8_Fig8_HTML.jpg)\n\
  \n图 8-8. 服务提供商\n\n请注意，许多条目是电信提供商，但您也可能在这里看到自己的公司。使用报告顶部的搜索功能搜索您组织的名称，看看是否能找到自己。（同时尝试使用您组织名称的各种缩写，并注意如果您有多个办公地点或子公司，它们可能会出现在多个条目中。）如果您组织的名称出现在这里，您可以创建一个\
  \ GA 过滤器来排除内部流量。（没有找到？请参考上一节关于基于 IP 排除的内容。）\n\n## 在 GA 中使用按服务提供商排除流量的过滤器\n\n在 GA\
  \ 的管理区域中，选择相应的账号、媒体资源和视图，然后点击第三列的“过滤器”以查看该视图的过滤器。选择“新建”按钮以添加新过滤器。选择创建一个新过滤器（而不是应用现有过滤器）。将过滤器命名为“Exclude\
  \ Internal Service Provider”。选择“自定义”选项卡。选择“排除”作为过滤器类型。选择“ISP 组织”作为字段（这是过滤器字段下拉菜单中命名不佳的一个例子，与\
  \ GA 中的维度名称相比：这里叫“ISP 组织”，在 GA 报告中叫“服务提供商”）。输入一个正则表达式以匹配服务提供商的值（参见下面的截图）。\n\n![A978-1-4842-0265-4_8_Fige_HTML.jpg](img/A978-1-4842-0265-4_8_Fige_HTML.jpg)\n\
  \n保存过滤器。\n\n请记住，此过滤器仅影响未来的数据。此前从该 IP 地址收集的数据不会受到影响。\n\n如果您希望创建一个仅包含内部流量的视图，只需在此过滤器中将其从“排除”更改为“包含”即可。\n\
  \n现在您已经创建了这个过滤器，可以将其应用到任意多个视图。\n\n\n\n### 隔离测试环境与生产环境\n\n在许多情况下，你可能已经处理了在 GA 中排除内部流量的问题（参见本章前一节），这通常包括你的员工或代理机构对网站的测试。然而，你可能希望能够单独查看此类测试流量，以确保一切运行正常——在网站新内容或功能上线前收集相关测试数据，确保它们按预期运行并记录数据。\n\
  \n你的具体设置将取决于你的环境以及你希望如何查看数据。为了便于举例，我们假设你拥有以下环境：\n\n-   [`dev.aliceswonderlandresorts.com`](http://dev.aliceswonderlandresorts.com)\n\
  -   [`staging.aliceswonderlandresorts.com`](http://staging.aliceswonderlandresorts.com)\n\
  -   [`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/)\n\
  \n你希望将开发和预发布站点中杂乱的内部测试数据，与生产站点上用于分析网站内容和营销的优质、简洁的面向客户数据分隔开。为此，你可以为开发和预发布站点在 GA 中创建额外的媒体资源，并使用\
  \ GTM 将数据路由到正确的媒体资源。下一节将详细介绍这个过程。\n\n还有另一种你需要考虑的测试流量：当你使用 GTM 的预览模式（参见第 4 章）对线上生产网站（本例中为[`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/)）上的代码和触发器更改进行测试时。你可能也想将这些数据分隔到另一个媒体资源中。后面的章节也会讨论这种情况。\n\
  \n#### 使用查找表在 GTM 中划分流量\n\n早在第 3 章中，你创建了一个 `{{GA Property ID}}` 变量，用于保存 GTM 中 GA\
  \ 代码的媒体资源 ID。当时这看起来可能过于复杂（难道不能直接粘贴 ID 值吗？）。然而现在，你将能够用一个新的变量替换该变量，这个新变量会考虑到你的需求：根据代码位于开发站点、预发布站点还是生产站点来更改媒体资源\
  \ ID。\n\nGTM 中有一个变量类型叫做查找表。它允许你为输入变量提供多个条件，从而产生不同的输出变量。在本例中，你需要使用 `{{URL Hostname}}`\
  \ 的值，在你的 GA 媒体资源 ID 之间更改变量的值（参见表 8-1）。\n\n**表 8-1.** 示例网站测试版和开发版的媒体资源\n\n| 主机名 |\
  \ GA 媒体资源 ID |\n|---|---|\n| [`dev.aliceswonderlandresorts.com`](http://dev.aliceswonderlandresorts.com)\
  \ | `UA-12345-2` |\n| [`staging.aliceswonderlandresorts.com`](http://staging.aliceswonderlandresorts.com)\
  \ | `UA-12345-3` |\n| [`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/)\
  \ | `UA-12345-1` |\n\n让我们逐步操作。\n\n##### 使用查找表变量划分测试站点\n\n让我们将现有的 `{{GA Property\
  \ ID}}` 变量更改为查找表。\n\n1.  在 GTM 中编辑 `{{GA Property ID}}` 变量。\n2.  选择类型，将其从“常量”更改为“查找表”。\n\
  3.  作为输入变量，选择内置变量 `{{Page Hostname}}`。\n4.  在表中添加一行。在输入中，输入一个主机名，例如 `dev.aliceswonderlandresorts.com`。注意：查找表仅支持完全匹配。避免在输入值中使用正则表达式。\n\
  5.  在输出中，输入你希望将对应站点数据路由到的 GA 媒体资源 ID。\n6.  重复添加行，直到添加了所有开发、测试、预发布等站点的主机名（参见下面的截图）。\n\
  \n![A978-1-4842-0265-4_8_Figf_HTML.jpg](img/A978-1-4842-0265-4_8_Figf_HTML.jpg)\n\
  \n7.  （可选）通过勾选复选框并输入一个 GA 媒体资源 ID 来设置默认值。默认值将用于任何与表中任何行都不匹配的主机名。\n8.  保存变量。\n\n\
  无需更改代码，因为它们已经使用了这个现有的变量。测试并发布容器，即可开始将你的测试流量路由到不同的媒体资源。\n\n查找表在需要将一个值转换为另一个值的许多情况下都很有用。在本例中，你将主机名转换成了\
  \ GA 媒体资源 ID。然而，对于你的生产网站，你还有另一种类型的测试活动：在发布前使用 GTM 的预览模式来测试代码。\n\n你也想捕获此活动，但将其与其余的生产站点数据分开（如表\
  \ 8-2 所示）。你可以额外添加一个查找表来进一步分隔。让我们看看如何操作。\n\n**表 8-2.** 示例站点的测试流量路由，包括 GTM 调试模式\n\n\
  | 主机名 | 条件 | GA 媒体资源 ID |\n|---|---|---|\n| [`dev.aliceswonderlandresorts.com`](http://dev.aliceswonderlandresorts.com)\
  \ | | `UA-12345-2` |\n| [`staging.aliceswonderlandresorts.com`](http://staging.aliceswonderlandresorts.com)\
  \ | | `UA-12345-3` |\n| [`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/)\
  \ | 处于调试模式？ | `UA-12345-4` |\n| [`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/)\
  \ | 未处于调试模式？ | `UA-12345-1` |\n\n##### 使用查找表变量划分预览模式\n\n首先，你将创建一个额外的查找表来分隔预览模式。\n\
  \n1.  如果尚未启用，请启用内置变量 `{{Debug Mode}}`。当 GTM 处于预览模式时，此变量值为 `true`。\n2.  创建一个新变量。选择类型为“查找表”。\n\
  3.  作为输入变量，选择 `{{Debug Mode}}` 变量。\n4.  在表中添加一行。在输入中，输入 `true`。\n5.  在输出中，输入当 GTM\
  \ 处于预览模式时，你希望将对应站点数据路由到的 GA 媒体资源 ID。\n6.  通过勾选复选框并输入一个 GA 媒体资源 ID 来设置默认值，当 GTM 不处于预览模式时，数据将被路由至此。\n\
  7.  保存变量，并为其命名：`GA Property ID – Preview Mode`。\n\n现在，你可以在总的 `{{GA Property ID}}`\
  \ 变量中使用此值，该变量在上一节中已被更改为查找表。\n\n1.  编辑 `{{GA Property ID}}` 变量。\n2.  选择“配置变量”以编辑表格。\n\
  3.  在包含线上/生产网站（本例中为[`www.aliceswonderlandresorts.com`](http://www.aliceswonderlandresorts.com/)）的行中，将输出替换为\
  \ `{{GA Property ID – Preview Mode}}` 变量。\n\n![A978-1-4842-0265-4_8_Figg_HTML.jpg](img/A978-1-4842-0265-4_8_Figg_HTML.jpg)\n\
  \n4.  保存对变量的更改。\n\n发布此容器后，GTM 将继续像以前一样路由开发和预发布网站的流量。现在，对于线上网站，如果处于预览模式，它将路由到测试媒体资源，而线上生产数据则继续路由到主媒体资源。\n\
  \n\n\n## 清理与分组内容\n\nURL 仅仅是谷歌分析（GA）捕获的众多信息之一，但它们往往是最杂乱的部分。在理想情况下，你的网站应拥有符合以下条件的\
  \ URL：\n\n- 易于理解并按逻辑层级分组，\n- 不包含无关或不必要的信息，\n- 能够唯一代表单个页面。\n\n通常，你无法完全控制网站上 URL 的结构和格式（例如，由于使用了特定软件或历史原因）。在很多情况下，你需要在网站上处理那些为机器而非人类设计的\
  \ URL。默认情况下，谷歌分析会捕获浏览器地址栏中显示的 URL，且保持其原样。在 GA 的报告中，这些 URL 会被拆分为两个维度：\n\n- `主机名`，包含域名（不包括协议和标点符号，例如`http://`或`https://`）\n\
  - `页面`，包含 URL 的其余部分，包括路径和查询参数，但不包含片段标识符。\n\n因此，举例来说，在以下 URL 中，GA 针对`主机名`和`页面`维度会显示如下值：\n\
  \n`http://www.aliceswonderlandresorts.com/going/down/?hole=rabbit#lateness`\n\n\
  - 主机名：`www.aliceswonderlandresorts.com`\n- 页面：`/going/down/?hole=rabbit`\n\n由于 GA\
  \ 会原样捕获 URL 中的这些片段，你的数据中可能会出现不理想的不一致情况：一个 URL 的多种变体都对应着网站上本质相同的页面。这些不一致可能包括大小写、查询参数等方面的差异。本节将逐一审视这些问题及处理它们的一些最佳实践，同时也会介绍将\
  \ URL 归组的方法，例如按主题类别或内部搜索结果页面进行分组。\n\n**重要提示：** 对 URL 的更改也可能影响基于这些 URL 的目标转化。在通过过滤器对\
  \ URL 进行更改后，请务必根据需要更新你的目标配置（参见第 6 章）。\n\n### 强制统一 URL 大小写\n\n从技术上讲，URL 是区分大小写的。也就是说，`http://example.com/jabberwock`\
  \ 和 `http://example.com/JabberWock` 不一定指向同一个页面。然而，在实践中，网站几乎不会这样使用 URL；通常，你的网络服务器或内容管理系统会提供相同的页面，而不论其大小写。\n\
  \n但是，由于 GA 仅按原样捕获 URL，它可能会在报告中显示同一 URL 的不同大小写形式（见图 8-9）。\n\n![A978-1-4842-0265-4_8_Fig9_HTML.jpg](img/A978-1-4842-0265-4_8_Fig9_HTML.jpg)\n\
  \n**图 8-9.** GA 报告中不一致的 URL\n\n这非常不方便——如果你只想知道有多少人浏览了该页面，你就得自己进行算术运算。你更希望报告中每个页面都有一个统一的条目，无论其大小写如何。为此，你可以在谷歌分析中对这些数据应用一个过滤器。\n\
  \n**使用过滤器将 URL 转换为小写**\n\n1. 在 GA 的管理区域中，选择相应的账户、媒体资源和数据视图后，点击第三列的`过滤器`查看该视图的过滤器。选择`新建`按钮添加一个新过滤器。\n\
  2. 选择创建一个新过滤器（而不是应用现有过滤器）。\n3. 为过滤器命名：“小写 URL”。\n4. 选择`自定义`标签。选择`小写`作为过滤器类型。\n5.\
  \ 选择`请求 URI`作为字段。（这是过滤器字段下拉菜单与 GA 中维度名称不匹配的另一个例子：在这里是`请求 URI`，在 GA 报告中则是`页面`。）\n\
  6. 保存过滤器。\n\n请记住，此过滤器仅影响之后的数据。过去收集的包含混合大小写 URL 的数据将不受影响。\n\n**提示：** 小写过滤器对于任何可能在某环节涉及人为输入错误的字段都很有用。这包括\
  \ URL 的两个部分（`请求 URI`和`主机名`）以及广告系列字段（参见第 9 章）。你应该在 GA 报告中查看这些值，并考虑应用小写过滤器以提高一致性。\n\
  \n### 默认 URL\n\nURL 一致性的另一个问题涉及默认页面。对于你的首页或网站上子目录的默认页面，浏览器通常可以通过多个 URL 访问同一页面。例如，你的首页可能通过以下任一\
  \ URL 访问：\n\n- `http://www.aliceswonderlandresorts.com/`\n- `http://www.aliceswonderlandresorts.com/index.html`\n\
  \n**注意：** 结尾可能因你的内容管理系统和网络服务器而异：`index.html`、`index.php`、`default.aspx`等。请检查你的网站以了解其实际使用的文件。\n\
  \n这样一来，你的报告又会遇到问题（见图 8-10）。\n\n![A978-1-4842-0265-4_8_Fig10_HTML.jpg](img/A978-1-4842-0265-4_8_Fig10_HTML.jpg)\n\
  \n**图 8-10.** GA 报告中不一致的默认 URL\n\n与上一节描述的大小写问题类似，你必须将这些行相加才能了解该特定页面的实际浏览次数。幸运的是，你也可以在\
  \ GA 中解决这个问题。根据你希望统一成哪个版本的 URL，有两种选择：\n\n- 有一种视图设置，可以将`index.html`（或任何适当的文件）附加到以斜杠结尾的\
  \ URL 末尾。\n- 你可以使用过滤器来移除`index.html`（或任何适当的文件），仅保留尾部斜杠。\n\n你偏好哪种方式主要取决于你希望在报告中看到页面列表的样式选择。\n\
  \n**使用视图设置将默认页面附加到 URL**\n\nGA 提供了一种设置，可以自动将文本附加到任何以尾部斜杠结尾的 URL 末尾。\n\n1. 在 GA 的管理区域中，选择相应的账户、媒体资源和数据视图后，点击第三列的`视图设置`编辑该视图的设置。\n\
