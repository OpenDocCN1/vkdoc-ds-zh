  \ 100);\n        percents = percents.concat(_every); }\n    }\n    if(config.distances.pixels)\
  \ {\n      if(config.distances.pixels.each) {\n        pixels = pixels.concat(config.distances.pixels.each);\
  \ }\n      if(config.distances.pixels.every) {\n        var _every = every_(config.distances.pixels.every,\
  \ _docHeight);\n        pixels = pixels.concat(_every); }\n    }\n    marks = addMarks_(marks,\
  \ percents, '%', _docHeight, _offset);\n    marks = addMarks_(marks, pixels, 'px',\
  \ _docHeight, _offset);\n    return marks;\n  }\n  function addMarks_(marks, points,\
  \ symbol, _docHeight, _offset) {\n    var i;\n    for(i = 0; i < points.length;\
  \ i++) {\n      var _point = parseInt(points[i], 10);\n      var height = symbol\
  \ !== '%' ? _point + _offset : _docHeight * (_point / 100) + _offset;\n      var\
  \ mark = _point + symbol;\n      if(height <= _docHeight + _offset) { marks[mark]\
  \ = height; }\n    }\n    return marks;\n  }\n  function every_(n, total) {\n  \
  \  var n = parseInt(n, 10);\n    var _num = total / n;\n    var arr = [];\n    for(i\
  \ = 1; i < _num + 1; i++) { arr.push(i * n); }\n    return arr;\n  }\n  function\
  \ checkDepth() {\n    var _bottom = parseBorder_(config.bottom);\n    var _top =\
  \ parseBorder_(config.top);\n    var height = docHeight(_bottom, _top);\n    var\
  \ marks = getMarks(height, (_top || 0));\n    var _curr = currentPosition();\n \
  \   for(key in marks) {\n      if(_curr > marks[key] && !cache[key]) {\n       \
  \ cache[key] = true;\n        fireAnalyticsEvent(key); }\n    }\n  }\n  function\
  \ fireAnalyticsEvent(distance) {\n      dataLayer.push({\n        'event': 'scrollTracking',\n\
  \        'attributes': { 'distance': distance }\n      });\n    }\n  }\n  function\
  \ parseBorder_(border) {\n    if(typeof border === 'Number' || parseInt(border,\
  \ 10)) {\n      return parseInt(border, 10); }\n    try {\n      // If we have an\
  \ element or a query selector, poll getBoundingClientRect\n      var el = border.nodeType\
  \ && border.nodeType === 1 ? border : document.querySelector(border);\n      var\
  \ docTop = document.body.getBoundingClientRect().top;\n      var _elTop = Math.floor(el.getBoundingClientRect().top\
  \ - docTop);\n      return _elTop;\n    } catch (e) { return void(0); }\n  }\n \
  \ // Adapted from https://developer.mozilla.org/en-US/docs/Web/API/Window/scrollY\n\
  \  function currentPosition() {\n    var supportPageOffset = window.pageXOffset\
  \ !== undefined;\n    var isCSS1Compat = ((document.compatMode || \"\") === \"CSS1Compat\"\
  );\n    var currScrollTop = supportPageOffset ?\n                        window.pageYOffset\
  \ :\n                        isCSS1Compat ?\n                          document.documentElement.scrollTop\
  \ :\n                          document.body.scrollTop;\n    return parseInt(currScrollTop,\
  \ 10) + parseInt(viewportHeight(), 10);\n  }\n  function viewportHeight() {\n  \
  \  var elem = (document.compatMode === \"CSS1Compat\") ?\n               document.documentElement\
  \ :\n               document.body;\n    return elem.clientHeight;\n  }\n  function\
  \ docHeight(_bottom, _top) {\n    var body = document.body;\n    var html = document.documentElement;\n\
  \    var height = Math.max(body.scrollHeight, body.offsetHeight,\n             \
  \          html.clientHeight, html.scrollHeight, html.offsetHeight);\n    if(_top)\
  \     { height = height - _top; }\n    if(_bottom)  { height = _bottom - _top; }\n\
  \    return height - 5;\n  }\n  /*\n   * Throttle function borrowed from:\n   *\
