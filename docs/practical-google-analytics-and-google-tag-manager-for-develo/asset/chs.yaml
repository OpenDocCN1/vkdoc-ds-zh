- "# 1. Google Analytics 基础知识\n\n> “多么有趣的表啊！”她惊叹道。“它显示的是月中的日期，却不告诉你是几点钟！”“为什么非得这样呢？”帽匠咕哝道。——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\
  \n`Google Analytics`（`GA`）是一款易于使用的工具，用于衡量网站活动。基本的设置可能只需几分钟，许多标准报告即使没有经过专门培训或具备网站分析知识，也相当容易访问和理解。正因如此，许多用户在不甚了解其底层架构——数据如何构建和收集——的情况下就贸然使用`GA`，对于基础来说这没什么问题。但最终，用户会超出对`GA`及其数据的直观理解，需要更深入地了解它的工作原理以及它能做什么。\n\
  \n你可能已经在使用`GA`，或者刚刚入门。无论哪种情况，本章都将帮助你掌握`GA`的核心内容：\n\n-   `Google Analytics`账户的结构\n\
  -   你的数据如何进入`Google Analytics`\n-   报告是如何根据这些数据生成的\n\n## GA 账户结构与权限管理\n\n如果你刚刚从头开始创建你的`Google\
  \ Analytics`账户，无论是因为你正在启动一个新网站，还是从其他工具切换过来，恭喜你！你有机会从零开始设置一切。\n\n另一方面，如果你和大多数`GA`用户一样，正在接手一些早已存在、在遥远的过去某个时候搭建的账户。这些账户设置的内容和原因可能没有任何记录、文档或组织记忆。\n\
  \n为了理清这一切，让我们来看看`GA`账户的结构，从你用于登录的电子邮件地址开始。\n\n### 获取 Google 登录方式\n\n无论你是从头开始还是访问现有的`Google\
  \ Analytics`实现，你都需要一个登录方式。对于`GA`（以及所有其他 Google 工具，例如`Tag Manager`、`AdWords`、`Search\
  \ Console`、`Google+`等），这要求你拥有一个`Google Account`。\n\n如果你通过`Gmail`注册了一个电子邮件地址，那它自动就是一个`Google\
  \ Account`。但你也可以将任何电子邮件地址（例如 `alice@aliceswonderlandresorts.com`）注册为`Google Account`。只需查看几乎任何\
  \ Google 产品右上角的“登录”选项，它将允许你使用现有账户登录或创建一个新账户。它会问你几个安全问题，并允许你选择一个新的`Gmail`地址的用户名，或者使用现有的电子邮件地址。\n\
  \n> **提示**\n> 在使用 Google 工具处理官方业务时，最好使用公司电子邮件地址而非`Gmail`地址，因为你能对自己的电子邮件地址有更多控制权（例如，如果有人离开你的组织，你可以通过电子邮件验证来重置密码）。\n\
  \n你需要任何需要登录你组织在`Google Analytics`（以及之后的`Google Tag Manager`）中的数据和设置的人都以这种方式创建账户。你可以拥有许多不同的登录账户，它们对你`GA`数据的访问权限级别各不相同。\n\
  \n> **提示**\n> 你可能想知道：“我们应该共享一个登录账户吗？”是想要一个共享登录账户（例如 `analytics@aliceswonderlandresorts.com`）还是为不同人员设置独立登录账户（例如\
  \ `alice@aliceswonderlandresorts.com`、`lewis@aliceswonderlandresorts.com` 等），取决于你组织部门、业务单位或团队的结构，以及你的内部安全策略。考虑一下多人共享密码是否可行。（对于小型组织，或许可行。对于大型组织，你可能需要更细的粒度、控制权和个人的问责制。）\n\
  \n### Google Analytics 结构\n\n`Google Analytics`将数据组织成三个层级：账户、媒体资源和数据视图。每个登录账户（电子邮件地址）可以在这些层级中的任何一个层级拥有访问权限。\n\
  \n-   **账户** 是最高层级，通常对应于单个企业或组织。在许多情况下，你可能只有一个`GA`账户。但出于各种原因，你可能拥有多个账户：你有一个工作账户（用于你雇主的网站）和一个个人账户（用于你关于女帽行业趋势的博客）；你可能是一家与多个客户合作的代理机构，每个客户都拥有一个账户；或者你为一家庞大而复杂的组织工作，该组织拥有多个账户（北美分部\
  \ vs. 欧洲分部）。\n-   **媒体资源** 是下一个组织层级。每个账户可以有多个媒体资源。媒体资源对应于一个网站（或一组网站）、移动应用或其他数据来源。你的组织可能有多个网站（例如\
  \ `aliceswonderlandresorts.com`、`madhatterheadwareinc.com` 等），因此你的账户可能包含多个网络媒体资源。\n\
  -   **数据视图** 是第三个也是最低的组织层级。每个数据视图是来自媒体资源的一组特定数据，`GA`中的报告就是基于这些数据生成的。默认情况下，`GA`会为每个媒体资源创建一个数据视图，该视图简单包含了该媒体资源的所有数据。你可以指定每个数据视图中包含哪些数据，这样你就可以为网站内容的特定子集（例如，仅网站的特定部分，或仅特定的营销渠道）创建额外的数据视图。\n\
  \n在`GA`的`首页`标签页上，你会看到你的登录账户有权访问的所有账户、媒体资源和数据视图的层级列表，你可以通过折叠和展开各分区来浏览。每个数据视图都会显示一个简短的指标摘要，点击某个数据视图会进入其报告页面。\n\
  \n\n### 管理与访问控制\n\nGoogle Analytics 中的`Admin`（管理）标签页可让你访问 GA 的所有设置，你会发现其组织结构相同：按帐户、媒体资源和数据视图（从左到右）排列。这三列中的每一列都是该层级设置的一个菜单，而每列顶部的下拉菜单则控制着你正在查看的是哪个帐户、媒体资源或数据视图。\n\
  \n你在`Admin`标签页中看到的内容取决于你的登录账号对 GA 所拥有的权限级别。可以为登录账号分配以下几种权限级别：\n\n- `Read & Analyze`（读取与分析）是最基本的权限级别。它允许用户查看报告数据并创建个人自定义内容，例如自定义报告、提醒、信息中心或细分受众群。\n\
  - `Collaborate`（协作）是下一级别。它包含`Read & Analyze`所能执行的所有操作，以及与其他用户共享自定义内容的能力。\n- `Edit`（编辑）包含`Collaborate`所能执行的所有操作，此外还增加了在`Admin`区域更改设置的能力。\n\
  - `Manage Users`（管理用户）是一个独立于`Read & Analyze`、`Collaborate`或`Edit`的权限级别，并且不包含这些能力（不过可以将其作为附加权限授予用户）。`Manage\
  \ Users`允许为其他登录账号添加或移除权限。\n\n这些权限可以在帐户、媒体资源或数据视图层级分配，这提供了极大的灵活性。例如，Alice 可能负责所有公司网站的分析工作，因此她可以在帐户层级拥有`Edit`和`Manage\
  \ Users`权限。而负责管理网站电子商务商店部分的 Mad Hatter，可能只对该数据视图拥有`Edit`权限。\n\n如果你拥有`Manage Users`权限，你将能够在`Admin`标签页中看到`Manage\
  \ Users`菜单。点击进入会显示用户列表及其权限，以及添加新用户的功能。请注意，在将登录邮箱添加到 GA 之前，它必须是一个 Google 账号（参见前文）。\n\
  \n**提示**  \n通常情况下，对于大多数用户，你可能会使用`Collaborate`权限，无论是对他们来说合适的帐户、媒体资源还是数据视图层级。通常`Edit`和`Manage\
  \ Users`权限保留给有限数量的管理员（同样，在适当的帐户、媒体资源或数据视图层级）。\n\n后续章节将进一步探讨`Admin`区域中的其他设置。媒体资源级别的设置主要涉及\
  \ GA 收集哪些数据：跟踪代码本身（第 2 章）、自定义数据（第 11 章）和数据导入（第 14 章）。数据视图级别的设置控制哪些数据显示在报告中，你将学习如何使用这些设置来跟踪转化（第\
  \ 6 章）以及清理和组织你的数据（第 8 章）。\n\n## Google Analytics Premium 媒体资源\n\nGoogle Analytics\
  \ 是一款免费工具。人们常常会问：“为什么 Google 会免费提供它？” 那些拥有更好网站和营销数据的组织更有可能在广告上花钱，而这正是 Google 赚钱的地方。\n\
  \n然而，作为一款免费工具，它在你可以收集和处理的数据量上确实存在一些限制。Google 还提供 Google Analytics Premium，这是一项付费订阅服务，包括更高的数据收集和处理上限、服务级别和正常运行时间保证，以及客户支持和培训。GA\
  \ Premium 还提供一些处理更为密集的报告和数据检索方式，超越了免费工具所能提供的范围，并且可以提前使用 Beta 版功能。\n\nGA Premium\
  \ 在 GA 的媒体资源级别激活，你会在帐户列表中看到已启用 GA Premium 的媒体资源旁边有一个标志。\n\n本书讨论的大多数功能对所有用户（无论是 Premium\
  \ 用户还是标准用户）都可用。差异之处会特别指出，以便你了解。\n\n## Google Analytics 如何收集数据\n\nGoogle Analytics\
  \ 捕获各种各样的数据。数据通过跟踪匹配（hit）发送到 GA。每次匹配都是关于某种特定类型交互（例如，查看页面）的一束数据。\n\nGA 通过一种名为`Measurement\
  \ Protocol`（衡量协议）的数据收集规范来规定这种匹配数据的格式。`Measurement Protocol`对数据来源不做限制——只要匹配的格式正确，数据就会被收集到\
  \ Google Analytics 中。这意味着你可以从任何地方向 GA 发送数据：网站、iOS 或 Android 上的移动应用，或者你自己的自定义应用程序。（你可以在第\
  \ 14 章中了解更多关于`Measurement Protocol`的信息。）\n\n在大多数情况下，你将通过网站向 GA 发送数据，这也是本书大部分内容的重点。对于网站，GA\
  \ 提供了一个 JavaScript 库，它可以为你生成跟踪匹配，并自动化数据收集的许多繁琐细节，这样你就不必担心`Measurement Protocol`的具体细节。\n\
  \n这段 JavaScript 代码会加载到你网站的每个页面中（第 2 章有所有详细信息）。默认情况下，每次页面加载时，这段代码都会捕获该页面的视图（以及一系列相关数据）。通过添加更多代码，你可以跟踪其他交互或事件，例如点击按钮、滚动页面等。\n\
  \n对于标准（非 Premium）GA，根据服务条款，你每月最多只能收集一千万次跟踪匹配。如果你超过此限制，Google 可能会联系你购买 GA Premium\
  \ 订阅或减少你收集的数据量。（Premium 帐户具有更高的匹配上限，从每月十亿次匹配开始。）\n\n### 匹配、会话和用户\n\n发送到 Google Analytics\
  \ 的每次匹配代表一次交互。一组同时发生的匹配称为一次会话。例如，一个用户可能访问你的网站并连续查看多个页面——每个页面都会生成一次匹配，所有这些匹配共同构成一次会话。将匹配分组成会话的典型规则是，下一次匹配到来之前的时间间隔不超过\
  \ 30 分钟（尽管你可以在 GA 设置中更改此时间窗口）。\n\n**示例**  \nAlice 访问一个网站，浏览了页面 A、B 和 C。然后她跟着兔子掉进洞里，一小时后回来，浏览了页面\
  \ D 和 E。Alice 有两次会话：第一次包含 A、B 和 C，第二次包含 D 和 E。如果 C 和 D 之间只过了 29 分钟，那么所有五个页面将属于同一次会话。\n\
  \nGoogle Analytics 还会跟踪用户，每个用户可能有多次会话。当同一个用户反复访问网站时，GA 会记录他们访问的次数和最近一次访问的时间。（第 2\
  \ 章讨论了 GA 如何使用 Cookie 跟踪网站用户；第 10 章和第 11 章提供了更多关于如何跟踪单个用户以及记录其附加信息的详细信息。）\n\n\n\
  #### 隐私考量\n\n当然，您有兴趣跟踪用户活动以优化网站，但必须记住，访问您网站的用户是真实的人，而非单纯的数据集合。您需要清楚自己收集了哪些信息，并谨慎处理这些信息。\n\
  \nGoogle Analytics 的美国服务条款¹要求如下：\n\n-   必须披露您正在使用 Google Analytics 跟踪网站用户的行为（通常通过在网站隐私政策中链接至\
  \ Google 关于其数据收集方式的说明来实现）。\n-   不得绕过 GA 提供的任何用户退出跟踪的方法。\n-   不得在 GA 中收集任何个人身份信息（如姓名、电子邮件地址或账单信息）。\n\
  \n其他地区可能有不同条款，您也应熟悉所在国家/地区的隐私法规，以了解自己的义务。\n\n## GA 中的报告与数据结构\n\n数据发送至 Google Analytics\
  \ 后，将出现在您可在`报告`选项卡中访问的所有标准报告中（或在`自定义`选项卡的`自定义报告`中，前提是您已创建过此类报告）。接下来，我们来看看这些数据如何组织成报告，以及各项数值如何计算。\n\
  \n### 维度与指标\n\n维度和指标是 Google Analytics 中每份报告的基础构成要素。了解可用的维度与指标及其组合方式，将让您深入理解 GA\
  \ 的实际运作机制及数据处理能力。\n\n维度是描述数据的标签，通常作为报告中的行出现。例如：\n\n-   URL：`主机名`、`页面`、`着陆页`、`退出页`、`上一页`、`下一页`\n\
  -   流量来源：`来源`、`媒介`、`广告系列`、`关键字`、`引荐路径`、`社交网络`\n-   地理位置：`国家/地区`、`区域`、`城市`、`都会区`\n\
  \n指标是度量值，始终为数值，通常作为报告中的列出现。例如：\n\n-   用户指标：`用户`、`新会话百分比`\n-   会话行为指标：`跳出率`、`页数/会话`、`平均会话时长`、`转化率`\n\
  -   广告系列指标：`展示次数`、`点击次数`、`点击率`、`每次点击费用`\n\nGA 中的每份报告——无论是标准报告、自定义报告，还是通过 GA API\
  \ 提取的数据——都是从接收到的跟踪匹配中提取并计算出的维度与指标组合。大多数标准报告都有一些合理的默认设置，但允许您更改所显示的维度或指标，以不同方式呈现数据。自定义报告则允许您完全自由地选择维度与指标的组合。报告还支持基于维度与指标对数据进行过滤和细分。例如，您可以设定“显示所有`跳出率`大于\
  \ 50% 的`页面`”，或“仅显示用户位于佛罗里达州的`广告系列`”。\n\n只需浏览 GA 中的标准报告，您就能了解可用的维度与指标。GA 开发者文档中提供了完整的维度与指标参考²，其中包含报告界面中使用的标签以及\
  \ API 中使用的编程标识符。该参考手册还指出了哪些组合是允许的——某些维度或指标无法在同一份报告中查看，原因可能是逻辑上不兼容，也可能是 GA 中没有此类组合的底层数据。\n\
  \n### 预聚合与抽样\n\n对于大多数标准报告中的维度与指标组合，所有报告数据均由 Google Analytics 预聚合。这意味着，当您请求任何日期范围的报告时，这些报告中的指标已经计算完毕，可以随时使用。\n\
  \n#### 行数限制\n\n对于这些预聚合数据，聚合报告中每日显示的唯一行数上限为 50,000 行。一旦超过此限制，报告会将超出部分的值归入一个标记为`(其他)`的行中。这对大多数维度而言并不常见，但对于像`页面`（URL）或`关键字`这样的维度，可能会出现大量唯一值。（多日或多维度报告有其他限制，但超出每日限制是最常见的情况。GA\
  \ Premium 用户的上限更高。）您可以通过清理 URL 中不必要的特定查询参数或其他信息来克服这些限制，如第 8 章所述。\n\n#### 抽样\n\n\
  如果您请求的报告并非来自 GA 的预聚合数据——例如，为标准报告额外添加一个维度、应用细分，或创建自定义报告——GA 必须回溯原始跟踪匹配数据，即时计算报告中的指标。\n\
  \n对于非聚合数据，如果日期范围包含超过 500,000 次访问，Google Analytics 将在计算报告指标时采用抽样。（某些情况下还有其他限制，但会话限制是触发抽样的最常见原因。Google\
  \ Analytics Premium 用户的限制大幅提高，并且可以下载完全无抽样的报告。）\n\n抽样意味着汇总数据是从数据子集推算出来的。例如，如果您的时段内共有\
  \ 1,000,000 次会话，Google Analytics 可能会使用 500,000 次会话来计算指标，然后将结果乘以 2（1,000,000 / 500,000）得出汇总值。\n\
  \nGA 会在报告右上角通过通知指示何时发生了抽样，以及计算报告时使用了总流量的多少比例。它还允许您在“响应较慢，精度更高”（接近 500,000 次会话的限制，但计算报告耗时更长）和“响应更快，精度较低”（速度更快，但使用的会话数更少）之间进行选择。\n\
  \n如果您能缩小报告日期范围，使其涵盖的会话数少于 500,000 次，则可以避免抽样。（在这种情况下，您需要将多个日期范围的结果相加，才能获得整个关注时段的总计数据。您也可以使用\
  \ GA API 以编程方式应用此技术。）然而，这种方法会使 GA 报告中的分析变得繁琐，并且无法解决用户级指标（这些指标不能简单跨时段累加）的问题。\n\n\n\
  \n### 工具重叠与数据调和\n\n如果您和大多数人一样，正在使用多种工具来衡量网络活动，那么其中一些工具很可能与 Google Analytics 衡量的内容存在重叠。您的内容管理系统、社交媒体插件、电子商务系统、电子邮件营销工具等都可能包含关于网络活动的指标。\n\
  \n在可能的情况下，值得尝试将尽可能多的数据整合到一个足够灵活、能处理对您最重要的多数数据的单一系统中，以便能并排查看和分析所有这些数据，而无需以其他方式将它们拼接在一起。GA\
  \ 因其灵活性，是整合尽可能多的在线（甚至离线）客户互动的理想选择。本书大部分内容将聚焦于如何整合这些不同类别的数据。不过，在某些情况下，将所有数据收集到 GA\
  \ 中可能并不实际，因此也提供了众多数据导出功能（请参见附赠的第 16 章和附录）。\n\n当您将 GA 数据与其他来源的数据一起使用时，应注意指标并非总是完全匹配。这可能是由多种原因造成的。看似应该相同的指标，在不同的工具之间，其定义方式可能存在细微差别，或者测量方式不同。请仔细比较，不要假设不同工具之间的数字具有可比性，除非您清楚理解它们的定义并自行进行了交叉核对。总的来说，您应该期望不同工具之间的指标在趋势和比例上保持一致，而不应陷入调和工具的细枝末节，以至于无法将时间更好地用于根据足够好的数据来做出决策。\n\
  \n## Google Analytics 文档\n\n即使手头有这本出色的书，您也可能需要在某个时候查阅 Google Analytics 的文档。实际上，GA\
  \ 有两个主要的文档集：\n\n*   **帮助中心**，³ 可从顶部菜单访问，提供关于 Google Analytics 报告和管理功能的信息。如果您对某个报告或设置不太理解，它能为您提供一些关于其用途和运作方式的背景信息。\n\
  *   **开发者中心**，⁴ 包含了所有关于 Google Analytics JavaScript 跟踪代码、API 以及其他技术信息的文档。它是对本书的极好补充，文中将引用其中的部分参考文档和便捷工具以提供更深入的背景信息。\n\
  \n## 总结\n\n*   Google Analytics 具有三层结构：**帐户**、**媒体资源**和**数据视图**。对 Google Analytics\
  \ 的访问是通过 Google 帐户进行的，这些帐户是基于 Gmail 地址或任何其他电子邮件地址的登录名。每个登录名在 GA 帐户结构的任何层级都可能拥有不同的权限级别。\n\
  *   Google Analytics 通过跟踪**匹配**来收集数据，匹配是包含交互信息的数据包，通过您网站上的 JavaScript 代码发送，或来自其他数据源（如移动应用）。匹配被分组为**会话**，而**用户**则会在多个会话中被持续跟踪。存在一些**隐私条款**，用于通知用户您的数据收集做法并限制您可收集的数据。\n\
  *   Google Analytics 的数据基于**维度**（描述数据的标签）和**指标**（数值计量）。所有报告，包括标准报告、自定义报告和 API，都基于\
  \ GA 的维度和指标。标准报告是**预聚合**的，意味着其数值是预先计算好的。非预聚合的报告，例如自定义报告或添加了细分条件的标准报告，可能会被**抽样**，这意味着如果数据集很大，其数值会从数据子集中实时计算得出。\n\
  \n**脚注**\n\n1.  [`http://www.google.com/analytics/terms/us.html`](http://www.google.com/analytics/terms/us.html)\n\
  2.  [`https://developers.google.com/analytics/devguides/reporting/core/dimsmets`](https://developers.google.com/analytics/devguides/reporting/core/dimsmets)\n\
  3.  [`https://support.google.com/analytics/`](https://support.google.com/analytics/)\n\
  4.  [`https://developers.google.com/analytics/`](https://developers.google.com/analytics/)\n\
  \n"
- "# 2. Google Analytics 基础测量\n\n> “从开头开始，”国王非常严肃地说，“一直走到尽头，然后停下。” ——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\
  \nGoogle Analytics 对您网站的测量基于安装在网站上的 JavaScript 跟踪代码。尽管在本书的大部分内容中，我们将使用 Google 跟踪代码管理器（GTM）来管理和安装此代码（从第\
  \ 3 章开始），但了解 GA 跟踪代码的基础知识及其预期工作原理仍具有指导意义。实际上，您可能不会直接使用此跟踪代码。然而，对其有基本的了解，将有助于您理解\
  \ GTM 中 GA 标签的各项选项，以及解读 GA 文档和示例，从而为您的网站设置 GTM。\n\n## 基础 Google Analytics 跟踪代码\n\
  \n当您首次创建 Google Analytics 帐户时，需要提供一些基本信息，例如您网站的域名和时区。然后，GA 会提供一段 JavaScript 代码片段，并附上说明：“将此代码复制并粘贴到您要跟踪的每个网页中”（见图\
  \ 2-1）。\n\n![A978-1-4842-0265-4_2_Fig1_HTML.jpg](img/A978-1-4842-0265-4_2_Fig1_HTML.jpg)\n\
  \n图 2-1. GA 的跟踪代码说明\n\n如果在初始设置过程后需要查找此建议代码，可以在“管理”设置中的“媒体资源”列下，进入“跟踪信息” ➤ “跟踪代码”部分找到。\n\
  \n### 跟踪代码的工作原理\n\n让我们分解这段代码，看看它的作用。第一部分如下所示：\n\n```\n(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){\n\
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),\n\
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)\n\
  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');\n```\n\
  \n您甚至无需费心重新格式化这段代码使其更具可读性，因为它在每个网站上都是相同的，并且您几乎永远不会对其进行修改。它从 Google 服务器获取 GA 跟踪库（`analytics.js`）并将其插入到页面中。（这段脚本中唯一您可能需要更改的部分是最后一部分：`'ga'`是赋予\
  \ GA 跟踪函数的名称。如果您需要避免与页面中已存在的对象名称冲突，可以重命名此函数。）\n\n第二部分是告诉 Google Analytics 要做什么。默认代码包含两个命令：\n\
  \n```\nga('create', 'UA-XXXXX-YY', 'auto');\nga('send', 'pageview');\n```\n\n`ga`函数接受一系列参数，其中第一个是\
  \ GA 命令的名称。这里您看到两个不同的命令：`create`和`send`。\n\n\n\n#### 创建 GA 跟踪器\n\n`create` 命令用于设置\
  \ GA 跟踪器。每个跟踪器将数据发送到一个特定的 GA 媒体资源，该资源由本命令的第二个参数（即媒体资源 ID）标识。媒体资源 ID 的格式为 `UA-XXXXX-YY`，其中\
  \ `XXXXX` 是标识您 GA 帐号的数字，`YY` 是标识该帐号内某个媒体资源的数字。您可以在 GA 首页的每个媒体资源旁边，或者在“管理”设置的“媒体资源”列中找到该媒体资源\
  \ ID。\n\n最后一个参数 `auto` 是跟踪器的一个配置参数，它与跟踪器如何为网站设置 Cookie 有关。（本章稍后会详细介绍这一点。）\n\n####\
  \ 发送页面浏览\n\n第二个命令 `send` 用于向 GA 发送一个跟踪匹配。\n\n该命令的第二个参数是匹配类型，此处的类型为 `pageview`。GA\
  \ 中有多种不同的匹配类型，用于收集不同类型的数据并以不同方式在 GA 中报告，例如用于用户互动的 `event` 匹配类型（详见第 5 章），或用于移动应用的\
  \ `screenview` 匹配类型（详见第 13 章）。\n\n每当执行 `send` 命令时，数据就会被发送到 Google Analytics。系统会向\
  \ [`www.google-analytics.com/collect`](http://www.google-analytics.com/collect)\
  \ 发起一个 HTTP 请求，其中包含关于该匹配的数据负载（即填充 GA 中维度和指标的数据）。\n\n由于 GA 跟踪代码包含在您网站的每个页面中，因此每次页面加载时，都会执行发送页面浏览的命令，记录下该页面已被浏览。就是这么简单。这里展示的两个命令（用于创建跟踪器的\
  \ `create`，以及用于发送页面浏览的 `send`）是 GA 跟踪在您的网站上运行所需的最基本功能。\n\n现在，这段默认代码并不能捕获您可能想要的所有信息——它仅仅在每次页面加载时记录页面浏览。那么，当用户通过\
  \ AJAX 表单完成多个步骤但页面并未重新加载时，该怎么办？页面内的其他互动，比如播放嵌入式视频，又该如何处理？这些都需要额外的代码（仅在完成某些操作时执行，例如加载新的\
  \ AJAX 内容或播放视频）。第 5 章 提供了针对这种额外跟踪的通用方法（使用 GTM），以及针对常见场景的具体方案。\n\n#### GA 跟踪代码的历代版本\n\
  \n本书重点关注最新一代的 GA 跟踪库 `analytics.js`，它是 GA 名为“Universal Analytics”的一系列升级和扩展功能套件的一部分。还有其他更旧的\
  \ GA 跟踪库，例如 `urchin.js` 和 `ga.js`。它们的工作方式类似，但语法细节不同，并且本书描述的部分功能在旧版库中不可用。\n\n自 2014\
  \ 年起，`analytics.js` 库已成为 Google Analytics 中新媒体资源的默认代码，并且对于在该变更之前创建的媒体资源，也提供了升级流程。如果您尚未更新，您将在“管理”部分看到关于升级流程的通知（并且您将能在您的网站上看到旧代码）。尽管旧代码在一段时间内仍能继续工作并收集数据，但如果您想利用\
  \ GA 的任何较新功能，您应该尽快升级（最终升级将成为强制要求）。\n\nGA 开发者中心包含针对旧版代码的文档，并设有升级中心引导您完成升级过程。¹\n\n\
  #### 多个 GA 跟踪器\n\n关于创建 GA 跟踪器，最后一个重要细节：每个跟踪器都有一个标识其自身的名称。（默认跟踪器的实际名称是 `t0`，尽管这在任何地方都没有标明。）如果您只使用一个跟踪器，则无需担心其名称；但在某些情况下，您可能需要在网页上并行运行多个跟踪器。如果存在多个跟踪器，则每个命令必须指定它是在哪个跟踪器上调用的。（不过，对于默认跟踪器\
  \ `t0`，则无需指定名称。）\n\n为什么可能需要多个跟踪器？在某些情况下，您可能希望将数据发送到 GA 中的多个媒体资源，这可能是出于多种原因：\n\n\
  *   两个不同的主体（例如，您的组织及其母公司）对某个网站有共同利益，但使用不同的 GA 帐号。\n*   将您的跟踪代码添加到第三方供应商或应用提供的内容中，而该内容可能已经自带了其\
  \ GA 跟踪。\n*   在某些情况下，用于测试升级，以确保您的实现是正确的（参见第 4 章）。\n\n下面是命名跟踪器并对其调用命令的示例。名称可以是任意字符串；这里使用了\
  \ `t1`。\n\n```\nga('create', 'UA-XXXXX-YY', 'auto');       // 默认跟踪器\nga('create',\
  \ 'UA-WWWWW-ZZ', 'auto', 't1'); // 名为 t1 的额外跟踪器\nga('send', 'pageview');       \
  \             // 为默认跟踪器发送页面浏览\nga('t1.send', 'pageview');                 // 为 t1\
  \ 发送页面浏览\n```\n\n对于命名的跟踪器，命令名称前会加上跟踪器名称前缀，并用点分隔：例如 `t1.send`。\n\n#### 参数和字段名称\n\n\
  根据命令的不同，Google Analytics 会接受影响其工作方式或收集数据的额外字段的值。例如，正如您之前所见，`create` 命令指示了媒体资源 ID。\n\
  \n在许多情况下，有两种方法可以指定这些值。对于某些值，您可以直接在 `ga` 函数调用中将其指定为参数：\n\n```\nga('create', 'UA-XXXXX-YY',\
  \ 'auto');\n```\n\n这就是您已经见过的格式，它是一种提供某些最常用字段值的便捷方式。由于它使用函数参数，请注意顺序很重要，并且函数期望参数出现在特定的位置。\n\
  \n还有另一种可用的语法，并且它是指定某些较少使用字段的唯一方式，因为这些字段没有对应的参数。这种替代语法使用一个对象来表示字段和值：\n\n```\nga('create',\n\
  {\n   'trackingId': 'UA-XXXX-Y',\n   'cookieDomain': 'auto'\n});\n```\n\n由于对象包含了每个字段的名称，因此顺序无关紧要。这两种语法是等效的，工作方式相同。\n\
  \n### 将代码放到页面上\n\n那么，说明是“将此代码复制并粘贴到每个您要跟踪的网页中”，幸运的是，这很可能比听起来要简单。在这个时代，您很可能有一个包含可管理数量页面模板的内容管理系统（而不是为网站的每个页面单独创建不同的\
  \ HTML 文件）。\n\n如果是这种情况，您只需将代码放入一个或多个模板中，这样它就会自动包含在网站的每个页面中。您需要确保覆盖所有模板，因为任何缺失的页面都不会被\
  \ GA 统计。对于 GA 而言，如果页面上没有跟踪代码，就好像该页面不存在一样。\n\n\n\n### 代码放置\n\nGA 跟踪代码是异步的，这意味着浏览器无需等待代码加载完成，即可继续渲染页面中后续的元素。因此，您可以安全地将代码放置在页面顶部或靠近顶部的位置。建议将代码放在页面的\
  \ `<head>` 部分，不过如果您的模板中放在 `<body>` 开头更方便，那也是可以的。\n\n> **提示**  \n> 您应尽可能将代码放在页面的靠前位置。如果代码位于页面末尾，且页面加载需要较长时间，用户可能会在跟踪代码加载完成前就导航离开（点击链接或关闭浏览器窗口），这意味着您将无法捕获该次页面浏览的数据。\n\
  \nGA 代码与页面其余部分异步执行，但提供给 GA 的命令会按照调用顺序执行。因此，例如，`create` 命令必须位于 `send` 命令之前，这一点非常重要。\n\
  \n## Cookie 与域名\n\nGoogle Analytics 使用一个 cookie 来存储客户端 ID，这是一个针对特定浏览器和设备随机生成的标识符。它在计算用户数量以及跨会话的用户行为（例如最近访问时间、忠诚度和多渠道漏斗报告）时会用到该客户端\
  \ ID。\n\n您的浏览器会存储分配给特定域名的 cookie（出于安全原因，未授权的网站无法读取其他域名的 cookie）。GA 使用第一方 cookie，这意味着其名为\
  \ `_ga` 的 cookie 会被分配给您的域名。也就是说，如果我在 `aliceswonderlandresorts.com` 上部署了 GA 跟踪代码，那么该站点会有一个\
  \ `_ga` cookie（而不是针对 `google.com` 或 `google-analytics.com` 等第三方 cookie）。\n\n在很多情况下，GA\
  \ 使用 cookie 对您来说几乎是透明的。如果您只有单个域名，或拥有几个完全独立的站点，您无需担心这个问题。但是，如果您有多个域名或子域名共同构成一个网站，您可能需要指定\
  \ cookie 的设置位置以及域名之间如何共享客户端 ID 值。\n\n### 选择 Cookie 域名\n\nGoogle Analytics 会使用一些默认规则来决定\
  \ cookie 域名，您也可以显式指定要使用的域名。cookie 域名有三种可能的情况：\n\n*   **默认设置：** `ga('create', 'UA-XXXXX-YY')`\
  \ — GA 将使用 URL 主机名中显示的完整域名，但会忽略 `www.` 前缀（如果有）。如果您希望主域名的各子域名被单独对待，这是理想的选择。\n*  \
  \ **自动配置：** `ga('create', 'UA-XXXXX-YY', 'auto')` — GA 会从 URL 主机名中尽可能使用最高级别的域名。这是首次安装\
  \ GA 时的推荐代码。如果您希望主域名的各子域名被统一对待，这是理想的选择。\n*   **手动配置：** `ga('create', 'UA-XXXXX-YY',\
  \ 'store.aliceswonderlandresorts.com')` — GA 使用您指定的域名。该域名必须是 URL 主机名中域名的祖先域名。\n\n\
  > **注意**  \n> `create` 命令可以接受 cookie 域名作为第三个参数，或者您可以使用字段对象。以下两种写法是等效的：  \n> `ga('create',\
  \ 'UA-XXXXX-YY', 'store.aliceswonderlandresorts.com');`  \n> `ga('create', 'UA-XXXXX-YY',\
  \ { 'cookieDomain': 'store.aliceswonderlandresorts.com' });`\n\n**表 2-1. 在 `create`\
  \ 命令中使用不同设置时 GA 中的 Cookie 域名**\n\n![A978-1-4842-0265-4_2_Figa_HTML.jpg](img/A978-1-4842-0265-4_2_Figa_HTML.jpg)\n\
  \n在大多数情况下，您希望将多个子域名（例如 `www` 和 `store`）视为一个站点，并使用同一组 cookie，这正是 `auto` 选项的功能。如果您希望将子域名视为独立站点，则需要为每个域名手动指定并设置独立的\
  \ cookie。\n\n#### 备用 Cookie 与无 Cookie 解决方案\n\n默认的 Google Analytics cookie 名为 `_ga`。如果您需要重命名此\
  \ cookie 以避免冲突，可以在 `create` 命令中添加一个额外的字段：\n\n`ga('create', 'UA-XXXXX-YY', { 'cookieName':\
  \ 'my_ga_cookie' });`\n\n也可以在完全不使用 cookie 的情况下使用 GA。为此，您必须从自己的来源提供客户端 ID 来识别设备。此选项对于希望避免使用第一方\
  \ cookie、或使用第三方 cookie、或从共享信息亭的应用程序提供数据的联合内容非常有用——例如：\n\n```javascript\nga('create',\
  \ 'UA-XXXXX-YY', {\n     'storage': 'none',\n     'clientId': '5aced0c9-1d2f-4da0-bbdf-5775d8ff7ad7'\n\
  });\n```\n\n`clientId` 应是一个遵循 UUID 版本 4 格式的全局唯一标识符。\n\n### 将多个域名视为一个站点\n\n有时，您需要将多个域名视为一个站点。这在包含第三方组件的站点中最为常见，例如购物车、捐赠站点或其他某些功能位于不同域名上的应用程序。例如，您的站点可能是\
  \ `aliceswonderlandresorts.com`，但为了预订酒店，用户最终会跳转到第三方站点 `aliceswonderland.example.biz`。\n\
  \n如果在这样的站点上使用常规的 GA 跟踪代码，那么 `aliceswonderlandresorts.com` 和 `aliceswonderland.example.biz`\
  \ 会各自拥有独立的 `_ga` cookie。由于每个站点会有一组不同的客户端 ID，GA 将无法将一个站点上的行为与另一个站点关联起来——例如，在您站点上查看了特定页面的用户，最终是否在第三方站点上预订了酒店房间？这可能是您想回答的问题，但要做到这一点，您必须协调两个站点之间的客户端\
  \ ID（见图 2-2）。\n\n![A978-1-4842-0265-4_2_Fig2_HTML.jpg](img/A978-1-4842-0265-4_2_Fig2_HTML.jpg)\n\
  \n**图 2-2. 多个域名与 Google Analytics**\n\n这在 GA 中被称为跨域名跟踪。GA 提供了一些函数，用于向将用户从一个站点带到另一个站点的链接或表单中追加一个包含客户端\
  \ ID 的特殊参数，以便接收站点使用相同的客户端 ID。链接看起来像这样：\n\n[`http://aliceswonderland.example.biz/hotelbooking.php?_ga=1.1821195.1441315.1362115890410`](http://aliceswonderland.example.biz/hotelbooking.php?_ga=1.1821195.1441315.1362115890410)\n\
  \n链接器参数 `_ga` 包含接收站点的客户端 ID。让我们来看看如何设置它。\n\n#### 启用跨域名跟踪\n\n首先，在每个站点的 `create` 命令中，您需要开启跨域名链接器功能：\n\
  \n```javascript\nga('create', 'UA-XXXXX-YY', 'auto', {'allowLinker': true});\n```\n\
  \n当 `allowLinker` 设置为 `true` 时，GA 将检查页面 URL 中是否包含带有客户端 ID 的链接器参数。如果存在，GA 将使用该值，而不是为\
  \ cookie 生成一个新的客户端 ID。\n\n> **注意**  \n> 跨域名链接器参数还包含一个时间戳，GA 仅在该时间戳位于最近两分钟内时才会使用该客户端\
  \ ID。这有助于防止用户意外共享带链接器参数的链接，从而导致多个用户共享同一个客户端 ID。\n\n\n\n### 装饰链接\n\n接下来，您需要将 `linker`\
  \ 参数附加到任一网站中指向对方网站的链接上。这被称为“装饰”链接——就像在链接末尾挂上一个小装饰品。\n\nGoogle Analytics (GA) 在名为\
  \ `linker` 的插件中提供了多个实用函数来实现此功能。最简单的选项是使用 `autoLink` 命令，该命令允许您指定要包含的域名列表或模式，并自动装饰您网页上出现的链接。\n\
  \n```\nga('require', 'linker');\nga('linker:autoLink', ['aliceswonderlandresorts.com',\
  \ 'example.biz']);\n```\n\n第一行加载了 `linker` 插件。第二行调用了 `autolink` 命令，并提供了一个您希望为其装饰链接的域名数组。域名列表会针对链接的目标进行子字符串匹配——请注意，根据您希望的具体程度，您可以列出\
  \ `example.biz` 或 `aliceswonderland.example.biz`。\n\n提示\n\n除了使用字符串列表，您还可以使用正则表达式来匹配域名：\n\
  \n```\nga('linker:autoLink', [/^aliceswonderland(resorts\\.com|\\.example\\.biz)$/]);\n\
  ```\n\n`autoLink` 命令能够很好地自动装饰大多数网站上的链接。某些页面可能包含会阻止自动链接功能的脚本，因此与任何 JavaScript 一样，在部署到您的网站之前，您应该进行彻底测试。如果自动链接功能不适用于您的网站，`linker`\
  \ 插件还提供了一个 `linker:decorate` 函数，用于手动装饰您的链接。除了标准链接之外，此函数在多种情况下都很有用：\n\n*   装饰从一个网站向另一个网站提交数据的\
  \ HTML `form`。\n*   装饰一个网站内容在另一个网站内的 `iFrame` 的目标地址。\n*   如果 `autoLink` 函数与您网站上现有的脚本配合不佳时，用于装饰链接。\n\
  \n这些情况的具体示例可在 GA 开发者中心找到。\n\n## 总结\n\n*   Google Analytics 使用 JavaScript 跟踪代码来跟踪用户在网站上的活动。`analytics.js`\
  \ 跟踪库会与 `create` 命令（用于设置 GA 跟踪器）和 `send` 命令（用于向 GA 发送网页浏览量数据）一起包含在网站的每个页面上。\n* \
  \  Google Analytics 使用名为 `_ga` 的第一方 cookie 来存储用于识别浏览器和设备的客户端 ID。对于多个子域名或域名，可以选择指定\
  \ cookie 的域。\n*   对于多个域名，Google Analytics 提供跨域跟踪功能，通过域名之间链接中的参数，在不同 cookie 的站点之间共享客户端\
  \ ID。`linker` 插件提供了用此参数装饰链接的功能。\n\n脚注 1\n\n[`https://developers.google.com/analytics/devguides/collection/upgrade/`](https://developers.google.com/analytics/devguides/collection/upgrade/)\n\
  \n2\n\n[`www.ietf.org/rfc/rfc4122.txt`](http://www.ietf.org/rfc/rfc4122.txt)\n\n"
- "# 3. 介绍 Google 跟踪代码管理器\n\n> 这时，国王（他一直忙着在笔记本上写东西）咯咯地叫道：“安静！”然后宣读他的书，“第四十二条规则。所有身高超过一英里的人必须离开法庭。”\
  \ ——刘易斯·卡罗尔，《爱丽丝梦游仙境》\n\n基本的 Google Analytics 代码（见第 2 章）并不复杂。把它放到您的模板中，就大功告成了。除非……嗯，这本书剩下的章节里还有很多您可能想用\
  \ GA 跟踪的额外数据类型，其中许多都涉及到添加更多的代码。这里加一小段用于 PDF 跟踪，那里再加一小段用于跟踪用户登录，诸如此类。您添加的代码越多，就越难以跟踪所有这些小片段、哪些片段应该在什么情况下包含、以及当您做出更改时会发生什么。\n\
  \n而这仅仅是 GA。很可能会，您的网站上还有其他用于其他跟踪工具的小型 JavaScript 片段，用于捕获其他有用的数据——也许是其他 Google 工具，如\
  \ AdWords 或 DoubleClick 的转化和再营销标签，或者用于第三方广告平台和分析工具。有时，您可能需要为两个、三个或四个不同的工具测量同一个网页浏览量或点击量，以实现不同的目的，每个工具都需要一个\
  \ JavaScript 标签。\n\n如果这一切听起来有点混乱，那是因为它确实可能如此。这就是标签管理工具发挥作用的地方，它能够组织并标准化所有这些标签。\n\
  \n## 为什么要使用标签管理器？\n\n就像您的内容管理系统通过允许您在基于 Web 的界面中插入文本、标题和图像来管理网站内容一样，标签管理系统也管理着标签——允许您插入那些\
  \ JavaScript 片段，例如 Google Analytics 跟踪代码。它提供了一个基于 Web 的界面，用于选择、编辑和管理这些标签在网页中的引入方式。\n\
  \n这种方法提供了许多优势：\n\n*   在更新或添加标签时，无需对网站的实际源代码或其模板进行更改。\n*   您可以跟踪并组织标签，以避免重复和错误。\n\
  *   拥有内置的调试、测试和预览工具。\n*   您可以使用版本控制来跟踪更改。\n*   拥有查看、编辑和发布标签的多级权限。\n\n标签管理工具将添加和更新跟踪标签的过程与更改网站模板和代码的过程分离开来。目前有许多优秀的标签管理工具可用，但本书重点介绍\
  \ Google 跟踪代码管理器 (GTM)，因为它是一个免费工具，并且与 GA 配合得非常好。（如果您是 GA Premium 订阅者，GTM 也包含在 GA\
  \ Premium 的服务水平协议中。）\n\n## Google 跟踪代码管理器是如何工作的？\n\nGoogle 跟踪代码管理器有两个协同工作的组件，用于在您的网站上包含标签：\n\
  \n*   一个基于 Web 的界面，用于设置需要包含在您网站上的跟踪标签。\n*   一个放置在您网站模板中的容器脚本，用于加载这些标签。\n\n我们来逐一看看这些部分，以便设置您的\
  \ GTM 帐户。\n\n### 创建一个 GTM 帐户\n\n由于 GTM 是另一个 Google 工具，您可以使用与 GA 相同的 Google 帐户登录。您可以被授予访问现有\
  \ GTM 帐户的权限，或者您可以创建一个全新的帐户。就像 GA 一样，您的登录名可以访问多个 GTM 帐户。\n\n\n\n#### GTM 帐户结构\n\n\
  `GTM` 帐户被组织成多个容器。每个容器对应一段容器脚本（请参阅即将介绍的“GTM 容器脚本”部分），该脚本会嵌入到使用 `GTM` 的网站中。当你注册 `GTM`\
  \ 帐户时，系统会创建你的第一个容器，并且你可以根据需要创建更多容器。当你登录 `GTM` 时，它会显示你的帐户和容器概览（参见图 3-1）。\n\n![A978-1-4842-0265-4_3_Fig1_HTML.jpg](img/A978-1-4842-0265-4_3_Fig1_HTML.jpg)\n\
  \n图 3-1. `GTM` 的帐户和容器列表\n\n在某些方面，`GA` 中的帐户和媒体资源与 `GTM` 中的帐户和容器之间存在明显的相似之处。在帐户层面，这种类比是成立的：在这两种工具中，一个帐户通常代表一个单一的组织或企业。\n\
  \n然而，`GTM` 容器的概念可能比 `GA` 媒体资源更为宽泛。例如，虽然你可能会为开发、测试和生产网站分别设置不同的 `GA` 媒体资源，但你可能只用一个\
  \ `GTM` 容器来管理这些网站上的代码，因为你希望在所有网站上部署非常相似的代码。对于 `GTM` 容器，一个通用的经验法则是：如果各个网站上的代码大致相同，则使用单个容器；如果网站之间的代码差异很大，则使用不同的容器可能更合适。（在接下来的几章中，你将看到这些代码是如何设置的，因此你可能希望在最终决定如何构建你的帐户之前，先了解一下\
  \ `GTM` 中的代码是如何工作的。）\n\n#### GTM 权限\n\n就像在 `GA` 中一样，`GTM` 中的登录用户在帐户和容器级别可以拥有不同级别的权限，从而赋予他们不同的能力。你可以在\
  \ `GTM` 的 `管理` 区域的 `用户管理` 部分分配权限。\n\n在帐户级别，有两种不同级别的权限：\n\n*   `查看` 允许用户查看用户列表和帐户设置，但无法进行任何更改。\n\
  *   `管理` 允许用户添加和移除其他用户，并编辑帐户设置。\n\n在容器级别，有更详细的权限：\n\n*   `仅查看` 允许用户查看容器中的代码，但无法进行任何更改。\n\
  *   `查看和编辑` 允许用户对容器中的代码进行更改。\n*   `查看、编辑、删除和发布` 允许用户对代码进行更改、删除它们，并将它们发布到在线网站。\n\n\
  对你的网站的更改在 `GTM` 中发布之前不会生效。通过管理容器权限，你可以确保只有应该能够更改代码或将其发布到你网站的用户才能执行这些操作。（下一章将更详细地介绍\
  \ `GTM` 中的发布过程。）\n\n**注意**  \n`GTM` 帐户设置还允许你为某些活动（例如修改权限或编辑自定义代码）要求进行两步验证。两步验证是对\
  \ Google 帐户登录的一项额外安全措施，它会向手机或其他设备发送验证码以验证用户身份。\n\n### GTM 容器脚本\n\n为了在你的网站上包含代码，你必须添加\
  \ `GTM` 容器脚本。\n\n从表面上看，`GTM` 容器脚本只是你添加到网站模板中的另一段代码片段（就像 `GA` 或任何其他跟踪代码一样）。但是，`GTM`\
  \ 容器脚本旨在取代所有其他代码片段，成为一个你无需在网站上更新的单一脚本；所有更新都将通过 `GTM` 完成。\n\n当你首次创建容器时，`GTM` 会为你提供容器脚本和说明。或者，你也可以通过选择顶部的\
  \ `管理` 选项卡，然后在右侧列中选择 `安装 GTM` 来找到容器脚本。\n\n`GTM` 容器脚本看起来像这样：\n\n```\n<!-- Google\
  \ Tag Manager -->\n<noscript><iframe src=\"//www.googletagmanager.com/ns.html?id=GTM-XXXXXX\"\
  \nheight=\"0\" width=\"0\" style=\"display:none;visibility:hidden\"></iframe></noscript>\n\
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':\nnew Date().getTime(),event:'gtm.js'});var\
  \ f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=\n\
  '//www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'script','dataLayer','GTM-XXXXXX');</script>\n\
  <!-- End Google Tag Manager -->\n```\n\n这段代码包含你的 `GTM` 容器 ID，它是一个格式为 `GTM-XXXXXX`\
  \ 的标识符，用于唯一标识你的容器。此代码会加载一个名为 `gtm.js` 的脚本，该脚本包含你在 `GTM` 中设置的所有代码。\n\n与 `GA` 跟踪脚本类似，`GTM`\
  \ 脚本是异步的，因此应尽可能将其放在页面顶部。但是，请注意 `GTM` 代码包含两部分：一个 `<noscript>` 标签和一个 `<script>` 标签。`<noscript>`\
  \ 部分允许 `GTM` 即使在客户端浏览器中未启用 JavaScript 时也能包含某些类型的代码。这些代码包含在一个 `<iframe>` 元素中，这意味着\
  \ `GTM` 代码必须放在网页的正文部分（`head` 部分官方不支持 `iframe` 元素）。因此，建议将 `GTM` 代码放置在 `body` 的开头，紧跟在开头的\
  \ `<body>` 标签之后。\n\n一旦 `GTM` 容器代码被包含在你的网站上，就可以通过 `GTM` 网页界面添加和发布代码。\n\n## GTM 的构建模块\n\
  \n创建容器后，你将看到它列在 `GTM` 的帐户和容器列表中。选择一个容器将进入该容器的概览页面（参见图 3-2）。容器概览页面显示有关容器最近更改的信息，并提示你添加第一个代码（我们将在接下来的章节中完成此操作）。在顶部导航中，你会注意到\
  \ `帐户`（返回帐户和容器列表）、`容器`（此概览屏幕）、`版本`（容器的过往版本，在第 4 章 中讨论）和 `管理`（帐户和容器设置）选项卡。\n\n![A978-1-4842-0265-4_3_Fig2_HTML.jpg](img/A978-1-4842-0265-4_3_Fig2_HTML.jpg)\n\
  \n图 3-2. `GTM` 的容器概览\n\n`GTM` 有三个协同工作的构建模块：\n\n*   **代码**，用于 `GA` 或其他工具的跟踪组件，通常由\
  \ JavaScript 或图像（跟踪像素）组成。\n*   **触发器**，指定 `GTM` 容器应在何时执行代码的规则。\n*   **变量**，从页面中提取信息片段，用于代码和触发器。\n\
  \n**注意**  \n如果你从 `GTM` 诞生之初就开始使用它，你可能记得触发器曾经被称为“规则”，而变量被称为“宏”。一些较旧的文档可能仍会包含这些术语。\n\
  \n请注意，这三个构建模块对应于 `GTM` 左侧导航栏中的项目（参见图 3-2）。单击这些导航项中的任何一个，都会显示现有代码、触发器或变量的列表，并允许你创建新的项。\n\
  \n此外，你还可以将这些代码、触发器和变量组织到文件夹中。随着容器中项目数量的增加，这将成为一个非常实用的组织工具。\n\n\n\n#### 标签\n\n`Tags`，GTM\
  \ 的基础构件之一，是工具用于记录数据的跟踪脚本或像素。GTM 支持任何类型的异步`Tag`。它内置了多个 Google 产品和第三方工具的模板，并且支持添加完全自定义的\
  \ HTML 或图片`Tag`。\n\n对于`Tag`模板，GTM 会处理所有必要的 JavaScript，提供一个包含各种选项和输入字段的表单，用于在`Tag`的代码中填写设置或数据。例如，谷歌分析（`GA`）标签需要你填写`Property\
  \ ID`（媒体资源 ID）。无需编辑 JavaScript，只需在一个简单的表单字段中填写该值。（你将在本章后面看到使用 GTM 完整设置`GA`标签的流程。）每个不同的`Tag`模板根据其可用的选项和收集的数据，都有各自的设置。\n\
  \n`Tag`模板支持`GA`、AdWords 转化和再营销标签、DoubleClick Floodlight 计数器和转化标签，以及各种第三方（非 Google）工具。然而，GTM\
  \ 也支持完全自定义的`Tag`——可以是自定义 HTML（你可以在其中插入任何自定义 HTML，包括脚本），或自定义图片`Tag`（可用于使用简单跟踪像素且无需脚本的工具）。特别是自定义\
  \ HTML `Tag`，它在使用未提供模板的工具标签，或使用完全自定义的代码来跟踪页面元素或用户交互时，提供了极大的灵活性（参见第 5 章）。\n\n####\
  \ 触发器\n\n`Triggers`，GTM 的第二个基础构件，描述了在何种情况下应触发`Tag`。`Triggers`可以评估`Variables`上的各种条件，以判断是否应执行某个`Tag`（关于`Variables`的示例请参见下一节）。\n\
  \n当你创建一个 GTM 容器时，它会包含一个默认的`Trigger`——`All Pages`（所有页面），它在任何页面浏览时执行（例如，这适用于你的基本`GA`标签）。然而，在许多情况下，你希望`Tag`只在更特定的条件下执行（例如，当发生一次转化或某个用户交互发生时）。你可以创建额外的`Trigger`，每个`Trigger`包含一个或多个条件。如果一个`Trigger`中包含多个条件，则所有条件都必须满足才能应用该`Trigger`（逻辑与）。\n\
  \n在`Triggers`中指定的条件可以指定精确值、包含字符串的值、数值比较（如大于和小于），或者使用正则表达式来匹配模式。\n\n一旦创建，`Triggers`可以用于任意数量的`Tag`。对于你在\
  \ GTM 中创建的每个`Tag`，你可以分配触发`Trigger`和可选的阻止`Trigger`。触发`Trigger`规定了何时应该执行`Tag`。如果任何一个触发`Trigger`生效，该`Tag`就会被执行（逻辑或）。阻止`Trigger`则规定何时**不应**执行`Tag`，并且优先于触发`Trigger`。\n\
  \n一个`Tag`至少需要一个触发`Trigger`才能被执行。如果你没有为`Tag`分配任何`Trigger`，它将永远不会触发。\n\n### 变量\n\n\
  `Variables`是 GTM 的第三个基础构件，它们允许你从网页中提取信息，以便在`Tags`和`Triggers`中使用。`Variables`让你可以根据页面的实际内容来自定义所收集的信息。\n\
  \nGTM `Variables`可用于填充`Tags`中使用的数据和设置，以及`Rules`中指定的标准。在 GTM 的输入字段中，你会看到一个小积木块图标，它允许你访问容器中现有`Variables`的下拉列表。你也可以直接在\
  \ GTM 的任何文本输入字段或自定义代码中输入`Variable`名称，其名称用双花括号括起来：`{{Variable Name}}`。GTM 将自动插入该`Variable`的值。（在本书中提及`Variables`时，我们也将使用这种格式。）\n\
  \n你的容器已经包含了许多有用的内置`Variables`，例如`{{Page URL}}`和`{{Referrer}}`。你会在`Variables`部分顶部的分类中看到它们（图\
  \ 3-3）。\n\n![A978-1-4842-0265-4_3_Fig3_HTML.jpg](img/A978-1-4842-0265-4_3_Fig3_HTML.jpg)\n\
  \n**图 3-3.** GTM 中可用的内置`Variables`\n\n请注意，内置的`Variables`可以被启用或禁用。在一个全新的容器中，一些内置的`Variables`默认是启用的。目前这些已经足够了，但随着后面章节中其他需求的出现，你将启用更多这类变量。我们将在下面介绍`Variables`的类型以及它们包含的值。\n\
  \n你也可以创建用户自定义的`Variables`。在创建新`Variable`时，你可以从多种不同类型中进行选择。可用的`Variable`类型包括以下内容，它们根据用途被分成了几类：\n\
  \n- 基本页面属性：URL，HTTP Referrer\n- 从页面内容中提取数据：DOM 元素，JavaScript 变量，第一方 Cookie，数据层变量，自定义\
  \ JavaScript\n- 用户交互：自定义事件，自动事件变量\n- GTM 属性：容器版本号，调试模式\n- 其他：常量字符串，查找表，随机数\n\n####\
  \ 基本页面属性变量\n\n这些变量基于页面的基本属性，即 URL 和 Referrer。\n\n- **HTTP Referrer**：访问当前页面所通过的前一页面（通过链接或表单提交）。GTM\
  \ 同样包含一个内置变量`{{Referrer}}`，其中包含完整的引荐来源 URL，但该变量类型允许你访问 URL 字符串的各个部分。\n\n- **URL**：你的容器已经为当前页面的\
  \ URL 提供了三个内置变量：`{{Page URL}}`（从头到尾的完整 URL）、`{{Page Hostname}}`（仅域名）和`{{Page Path}}`（URL\
  \ 中域名之后的部分）。URL 变量类型还允许你创建变量来访问 URL 的各个组成部分（参见表 3-1），可用于当前页面或任何其他 URL。这是一种避免为正则表达式匹配\
  \ URL 特定部分而创建表达式的便捷方式。\n\n**表 3-1.** 使用 URL 变量可访问的 URL 部分\n\n| protocol | hostname\
  \ | port | path | query | fragment |\n| --- | --- | --- | --- | --- | --- |\n| `http://`\
  \ | `aliceswonderlandresorts.com` | `:8080` | `/folder/page.html` | `?category=hats&sort=mad`\
  \ | `#returns` |\n\n#### 页面内容变量\n\n下一组变量类型利用的是网页中包含的信息。它们通过浏览器的文档对象模型（DOM）或 JavaScript\
  \ 来提取页面内容。你将在第 5 章中广泛使用以下类型的变量，并进一步探索它们的功能。\n\n- **DOM 元素**：你可以通过其`id`属性指定页面中的一个元素。该变量的内容可以是元素的文本内容或属性的文本。\n\
  - **JavaScript 变量**：你可以指定页面上一个全局 JavaScript 变量的名称。这包括在你页面的自定义代码中可用的任何全局变量，但请注意，你也可以访问标准的\
  \ DOM 变量，例如`document.title`。\n- **第一方 Cookie**：你可以指定一个 Cookie 的名称并访问其值。\n- **数据层变量**：你可以通过一个称为数据层的标准化对象向\
  \ GTM 提供信息。更多信息请参见本章后面的“通过数据层向 GTM 提供数据”。\n- **自定义 JavaScript**：最灵活的变量类型，允许你包含任何\
  \ JavaScript 函数。该变量的值就是该函数返回的值。\n\n\n\n#### `用户交互`变量\n\n`自定义事件`和`自动事件`变量类型用于捕获与页面的交互。`点击`、`表单`和`历史记录`类别中的内置变量涵盖了这些类型。这些变量将在第\
  \ 5 章中介绍。\n\n#### `GTM 属性`变量\n\n这些变量作为内置变量，可以访问 `GTM` 内部使用的信息。\n\n- `容器版本号`：该变量的值是当前已发布\
  \ `GTM` 容器的版本号。\n- `调试模式`：该`真/假`变量表示页面正在使用 `GTM` 的调试模式进行查看（参见第 4 章）。\n\n#### 其他变量类型\n\
  \n- `常量字符串`：此变量类型可用于简单字符串。尽管它并非动态变量，但对于在多个标签或触发器中使用的字符串来说，此变量可能很有用，因为它提供了一个统一更新值的入口。\n\
  - `查找表`：查找表变量类型允许通过一系列比较，从列表中选择一个值。\n- `随机数`：此变量包含一个介于 0 和 2,147,483,647 之间的随机数。可作为内置变量使用。\n\
  \n## 通过数据层向 GTM 提供数据\n\n在某些情况下，您可以使用 URL、DOM 元素等变量直接从页面捕获感兴趣的信息。但有时，您可能想要捕获的信息并非页面的一部分——关于页面本身或正在查看它的用户的元数据，这些数据并未明确显示在页面内容中。示例可能包括诸如页面分类（如果\
  \ URL 中未明确说明）或用户身份（针对用户登录的站点）等信息。\n\nGTM 使用一个称为数据层的对象来传递此类信息。数据层提供了一个集中的信息列表，这些信息可以轻松地被\
  \ GTM 访问，但对查看页面的用户来说是不可见的。\n\n### 数据层的结构\n\n数据层是一个名为 `dataLayer` 的 JavaScript 数组，其中包含带有属性的对象。您可以通过在\
  \ GTM 容器脚本之前声明数据层来将其包含在页面中，如下所示：\n\n```\n<script>\n  dataLayer = [{\n    'pageCategory':\
  \ 'hats',\n    'userId': '12345'\n  }];\n</script>\n```\n\n数据层对象中提供的每个属性都有一个名称（您可以使用变量检索）和一个适用于特定页面或用户的值。这里的属性名称\
  \ `pageCategory` 和 `userId` 仅仅是示例。数据层属性可以有任何您想要的名称，尽管 GTM 使用一些具有特殊含义的属性名称（例如 `event`），您将在第\
  \ 5 章及后续章节中看到数据层的更详细用法。\n\n### 填充数据层\n\n填充数据层的值通常涉及您网站模板中的服务器端代码。例如，您的内容管理系统或应用服务器知道页面的分类或用户的登录\
  \ ID，您需要从这些系统的相应位置提取数据来填充数据层中的值。\n\n## 使用 GTM 实现 GA 基础功能\n\n现在您已经了解了 GTM 的基本构建块，让我们来创建您的第一个实用标签：标准的\
  \ GA 页面浏览跟踪标签（在第 2 章中描述）。假设您已经创建了一个 GTM 容器并将容器代码添加到了您的网站中。\n\n### 第一部分：创建 GA 标签\n\
  \n首先，为 GA 创建一个 GTM 标签。\n\n在容器的“标签”部分，选择**新建**按钮。编辑顶部的标签名称（“未命名标签”），为标签命名：“GA - 页面浏览”（见下方截图）。\n\
  \n![A978-1-4842-0265-4_3_Figa_HTML.jpg](img/A978-1-4842-0265-4_3_Figa_HTML.jpg)\n\
  \n**注意：** 您需要为标签、触发器和变量设计一个合理的命名约定，尤其是在多人添加和编辑它们的情况下。通常，标签的命名以类型或工具开头（此处为“GA”），然后是测量内容（“页面浏览”），最后是描述标签所需的任何附加信息。\n\
  \n从支持的标签模板列表中选择标签：**Google Analytics**。选择**继续**按钮。\n\n选择**Universal Analytics**\
  \ 作为标签类型。（Universal Analytics 是 GA 跟踪代码的当前版本。如果您因某些原因需要使用旧版本，可以选择**Classic Analytics**。）选择**继续**按钮以填写\
  \ GA 标签的选项。\n\n在**跟踪 ID** 字段中输入您的媒体资源 ID（见下方截图）。这是您 GA 中网络媒体资源的 `UA-XXXXX-YY` 标识符。GTM\
  \ 使用此字段来填充 GA 代码中 `create` 命令的值。\n\n![A978-1-4842-0265-4_3_Figb_HTML.jpg](img/A978-1-4842-0265-4_3_Figb_HTML.jpg)\n\
  \n选择**跟踪类型** ➤ **页面浏览**作为您要使用的 GA 跟踪类型（见上方截图）。这对应于 GA 跟踪代码中命中类型为 `pageview` 的 `send`\
  \ 命令。\n\n如果使用标准的、开箱即用的 GA 跟踪代码，这些就是您需要提供的所有设置，因为它们对应于 GA 中的两个命令（`create` 和 `send`）。但是，您会注意到在**更多设置**下还有许多其他设置。这些对应于在\
  \ GA 跟踪代码中传递的附加设置。您将找到在第 2 章的自定义设置中讨论的项目，例如跟踪器名称（**高级配置** ➤ **设置跟踪器名称**）和跨域跟踪功能（**跨域跟踪**）。还有一些字段会影响其他类型的数据，例如内容组、电子商务数据以及自定义维度和指标，这些是后续章节中探讨的功能。\n\
  \n尽管这些类别中的许多 GA 附加字段都可作为设置使用，但您也可以使用**要设置的字段**部分，这相当于在您的 GA 代码中使用字段对象（参见第 2 章）。如果\
  \ GA 中需要更改的任何设置在 GTM 中没有对应的选项，您可以使用**要设置的字段**。\n\n关于 GTM 中默认 GA 标签设置的两点重要说明：\n\n\
  ![A978-1-4842-0265-4_3_Figc_HTML.jpg](img/A978-1-4842-0265-4_3_Figc_HTML.jpg)\n\n\
  - 如果未指定跟踪器名称，GTM 会为每个 GA 标签分配一个随机跟踪器名称。通过这种方式，GTM 中的每个标签都会创建一个名称不同的跟踪器。\n- 如果未指定\
  \ Cookie 域名，GTM 会使用默认选项（完整域名，去除 `www.`），而非 `auto` 选项。如果我们想使用 `auto` 选项，则需要使用**要设置的字段**将\
  \ `cookieDomain` 设置为 `auto`（如下方截图所示）。\n\nGA 代码中的这两个选项均在第 2 章中讨论过。\n\n### 第二部分：分配触发器\n\
  \n在保存您的新 GA 标签之前，您需要至少分配一个触发器，以便其能够执行。\n\n\n\n### 创建标签触发器\n\n在标签创建界面，选择**继续**按钮为你的标签分配触发器。你可以从一些基本的触发器类型中进行选择。由于你希望默认的\
  \ GA 页面浏览标签在每个页面都执行，可以选择提供的**所有页面**触发器（见下方截图）。\n\n![A978-1-4842-0265-4_3_Figd_HTML.jpg](img/A978-1-4842-0265-4_3_Figd_HTML.jpg)\n\
  \n此时，你已经准备好保存标签。选择页面底部的**创建标签**按钮进行保存，并返回容器概览。\n\n### 第三部分：使用变量增加灵活性\n\n到目前为止，你已经设置了\
  \ GA 页面浏览标签在每个页面执行，这也是它需要做的全部工作。不过，提前做一些规划，并为任何可能复用的信息使用变量是值得的。你已配置的内容中，是否有任何部分可以从使用变量中获益？\n\
  \n你可能还记得，你刚刚在 GA 标签的对应设置中直接输入了 GA 属性 ID。如果你只有一个标签，这问题不大，但随着你后续添加更多类型的跟踪，你将再次用到这个属性\
  \ ID。如果你创建一个变量，就可以反复使用它，而不用担心拼写错误，并且在需要更改时，也能轻松地在所有地方进行更新。\n\n让我们为 GA 属性 ID 创建一个变量。\n\
  \n在容器的**变量**部分，选择**新建**按钮。将变量命名为：`GA Property ID`。选择变量类型：**常量字符串**。输入你的属性 ID（`UA-XXXXXX-YY`）作为变量的值。选择**保存**以保存并返回容器概览。\n\
  \n现在你有了一个属性 ID 的变量，让我们更新 GA 标签来使用它。\n\n在容器概览中，选择你的 GA 标签进行编辑。在**跟踪 ID** 字段中，删除之前直接输入的值。选择**跟踪\
  \ ID** 字段右侧的构建块图标，查看可用于填充的宏列表。选择你刚创建的`{{GA Property ID}}`变量（见下方截图）。\n\n![A978-1-4842-0265-4_3_Fige_HTML.jpg](img/A978-1-4842-0265-4_3_Fige_HTML.jpg)\n\
  \n选择**保存**以保存并返回容器概览。\n\n在 GTM 中，当你将变量包含到字段中时，你可以从块的下拉菜单中选择它，也可以直接输入。无论哪种方式，在标签执行时，`{{Variable\
  \ Name}}`都会被 GTM 替换为变量的实际值。\n\n### 下一步是什么\n\n到目前为止，你已经设置了一个包含触发器和变量的标签。但是，请注意，到目前为止网站没有任何变化。GTM\
  \ 中的所有更改，在你将其发布到网站之前都不会生效。第 4 章将讨论发布过程以及可用于确保一切就绪后再上线代码的测试工具。\n\n你目前已设置的内容涵盖了基本的\
  \ GA 页面浏览跟踪。在后续章节中，你将了解你可能会发送给 GA 的所有其他类型的数据，以及如何使用 GTM 来实现这些功能。\n\n### 边栏：迁移到 GTM\n\
  \n如果你刚开始使用 GA，你可以从一开始就在 GTM 中创建所有标签。但是，对于那些已经存在 GA 实施（代码直接放在页面上）的网站，如果你希望迁移到使用 GTM\
  \ 来管理标签，该怎么做呢？\n\n你希望在不停顿 GA 数据收集的情况下完成此次迁移。以下是推荐的流程：\n\n1.  创建一个 GTM 容器，并将容器脚本添加到你的网站。此时**不要**更改或移除任何现有的\
  \ GA 代码。\n2.  在 GA 中创建一个新属性。这将是一个用于测试的临时属性，你可以在迁移完成后删除它。\n3.  使用新属性 ID 在 GTM 中实施\
  \ GA 标签。目标是使用 GTM 中的标签，重现网站上现有的所有 GA 跟踪。这包括标准页面浏览跟踪，以及任何其他附加跟踪，例如事件、电子商务、自定义维度等。由于你同时拥有现有属性和来自\
  \ GTM 的新属性跟踪，你将能够进行比较，以确保你跟踪了所有相同的内容并且数据匹配。继续优化，直到你确信已经用 GTM 完整复现了现有的实施。\n4.  最后是最棘手的部分。大致在同一时间，你需要做两件事：\n\
  \    -   从网站中移除所有现有的 GA 代码。这包括标准页面浏览跟踪代码以及你添加的任何其他自定义代码。\n    -   将 GTM 中 GA 标签的属性\
  \ ID 从新属性切换回旧属性（这很快——尤其是如果你按照前面的建议为属性 ID 使用了变量）。\n\n移除旧代码是这里最棘手的部分。理想情况下，你可以一次性完成所有操作，但这取决于你网站的部署流程和内容管理系统。请记住，在移除旧代码和切换\
  \ GTM 中的属性 ID 之间的任何间隙，都意味着有一段时间你没有向 GA 属性捕获数据。（相反，任何重叠都会导致重复计数。）因此，你需要仔细安排这个过渡时间，并在非关键时间进行。\n\
  \n## 总结\n\n*   Google Tag Manager 是一个免费的标签管理系统，它提供了管理、版本控制和发布跟踪标签到网站的能力。与 Google\
  \ Analytics 一样，你可以使用 Google 账号登录 GTM，并且可以为用户分配多个级别的权限。\n*   GTM 容器通过 Web 界面进行管理，它是一个包含标签（要包含的\
  \ JavaScript 或图片代码片段）、触发器（指定何时触发或阻止标签的规则）和变量（从页面提取信息以填充标签数据或触发条件）的集合。GTM 容器脚本会放在受管理的网站的所有页面上，从而取代了直接将标签添加到这些页面的需求。\n\
  *   GTM 变量可以访问页面中的信息，例如 URL 和 HTML 元素。GTM 还可以使用数据层，这是一种使用 JavaScript 对象为 GTM 在中心位置提供信息的方式。当某个信息在页面上不明显或不可用时，数据层可用于提供关于页面或其浏览者的额外信息。数据层通常由服务器端代码填充。\n\
