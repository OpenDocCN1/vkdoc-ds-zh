- 'no': 7468
  overturn_probability: 0.9
  alternative: 索引内的分节标题/排版噪声
  counter_evidence:
  - 该行 '# B' 出现在索引部分内部（7432 '## 索引 A' 之后）。
  - '索引（Index）通常被视为一个整体章节。将索引内部的字母分节（# B, # C...）视为独立的“章”是不符合常规书籍结构的。'
  - 规则指出“只划分全书最高层级的大章”。'# B' 虽然是一级标记，但它是索引内部的子节划分，而非独立的主体章节。索引作为一个整体（从 '## 索引 A' 开始）应是一个章，内部的
    '# B', '# C' 等不应再分章，否则会导致索引被碎片化。
  - 对比前文，'## 索引 A' 是起始。'# B' 只是索引翻页后的新字母组，语义上不具备“统领性”去覆盖像正文章那样的一大块内容，它只是索引的一个子部分。
  keep_split: false
