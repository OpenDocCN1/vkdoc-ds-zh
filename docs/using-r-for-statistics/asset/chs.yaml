- '# 1. R 语言基础


  R 是一个统计分析与图形处理环境，其功能范围可与 SAS、SPSS、Stata 和 S-Plus 等软件包相媲美。基础安装已涵盖所有最常用的统计技术，例如单变量分析、分类数据分析、假设检验、广义线性模型、多变量分析以及时间序列分析。它还具有出色的统计图形生成功能。基础安装未包含的任何功能，通常都能由数以千计的附加软件包之一来提供。


  由于 R 是基于命令行操作的，掌握起来可能比点击式风格的软件需要更长的时间。然而，你付出的努力将换来软件更高的灵活性，以及使用最新开发方法的权限。


  为了帮助你入门，本章将介绍 R 系统。你将学习以下内容：


  -   下载并安装 R

  -   熟悉界面

  -   开始输入命令

  -   了解不同类型的 R 文件

  -   熟悉本书中将使用的所有重要技术术语


  如果你是 R 语言新手，我建议你通读整章，这将为你打下坚实的基础。


  ## 下载与安装 R


  R 软件可从 R 官方网站免费获取。Windows 和 Mac 用户应按照以下说明下载安装文件：


  访问 R 项目网站 [`www.r-project.org`](http://www.r-project.org/)。点击 CRAN 链接（位于左侧）。你将看到一个托管
  R 安装文件的站点列表（镜像站点）。选择一个离你较近的站点。选择你的操作系统。这里有适用于 Windows、Mac 和 Linux 操作系统的安装文件。如果下载
  Windows 版 R，系统会要求你从基础版或贡献版中选择。请选择基础版。点击链接下载 R 安装文件，并将其保存到计算机上的合适位置。


  要在 Windows 和 Mac OS 环境下安装 R，请打开安装文件并按照安装向导的说明进行操作。你可以选择自定义安装，但如果你是 R 新手，我建议你使用标准安装设置。如果你要在联网的计算机上安装
  R，可能需要联系系统管理员获得许可后才能进行安装。


  对于 Linux 用户，最简单的安装方式是通过包管理器。你可以通过搜索"r-base-core"来找到 R。详细的安装说明可在安装文件所在的同一位置找到。


  如果你具备必要的技术知识，也可以从源代码编译该软件。详细的指南可在 [`www.stats.bris.ac.uk/R/doc/manuals/R-admin.pdf`](http://www.stats.bris.ac.uk/R/doc/manuals/R-admin.pdf)
  找到。


  ## 界面熟悉


  安装完软件并首次打开后，你将看到如图 1-1 所示的 R 界面。


  ![A978-1-4842-0139-8_1_Fig1_HTML.jpg](img/A978-1-4842-0139-8_1_Fig1_HTML.jpg)


  图 1-1. R 界面


  有多个下拉菜单和按钮，但与点击式统计软件包不同，你只会用它们来进行一些辅助操作，比如打开和保存 R 文件、设置偏好以及加载附加软件包。所有主要任务（如导入数据、执行统计分析和创建图表）都将通过向
  R 输入命令来完成。


  R 控制台窗口是你输入命令的地方。同时，输出结果和任何错误信息也会显示在此处。之后你还会使用其他窗口，如数据编辑器、脚本编辑器和图形设备。


  ## R 控制台与命令提示符


  现在，请将注意力转向 R 控制台窗口。每次启动 R 时，控制台窗口中都会显示一些与版权及其他问题相关的文本，如图 1-1 所示。如果你觉得控制台中的文本难以阅读，可以通过选择"编辑"菜单中的"GUI
  偏好设置"来进行调整。这将打开一个对话框，允许你更改控制台文本的大小和字体，以及其他选项。


  在启动时控制台中显示的所有文本下方，你会看到命令提示符，它显示为红色，看起来像这样：


  `>`


  命令提示符告诉你 R 已准备好接收你的命令。


  尝试在提示符后输入以下命令并按回车键：


  `> 8-2`


  R 会在控制台的下一行给出如下输出：


  `[1] 6`


  `>`


  这里的`[1]`表示你正在查看的是输出的第几个分量，由于输出只有一个分量，所以现阶段这不重要。接着是计算结果，即 6。请注意，所有输出都以蓝色显示，以区别于你输入的命令。


  输出之后会显示另一个提示符`>`，告诉你 R 已完成命令处理，准备接收下一条命令。如果在输入命令后没有看到命令提示符，可能是因为你输入的命令不完整。尝试在命令提示符后输入以下不完整的命令：


  `> 8-`


  R 会响应一个加号：


  `+`


  如果你看到加号，意思是需要输入命令的剩余部分并按回车键。或者，你可以按 Esc 键取消该命令并返回到命令提示符。


  另一个看不到命令提示符的情况是 R 仍在执行任务。通常这段时间可以忽略不计，但对于更复杂的任务或涉及大型数据集的任务，可能需要一些等待时间。如果一个命令执行时间远超预期，你可以按
  Esc 键取消它。


  从现在开始，在展示输出时将省略命令提示符。


  表 1-1 显示了用于表示基本算术运算的符号。


  **表 1-1.** 算术运算符


  | 运算 | 符号 |

  | --- | --- |

  | 加法 | `+` |

  | 减法 | `-` |

  | 乘法 | `*` |

  | 除法 | `/` |

  | 乘方 | `^` |


  如果一个命令包含多个算术运算符，它们会按照通常的优先级顺序求值，即先计算乘方（幂）符号，然后是除法，接着是乘法，最后是加法和减法。如有必要，你也可以添加括号来控制优先级。例如，命令：


  `> 3²+6/3+2`


  给出的结果是：


  `[1] 13`


  而命令：


  `> (3²+6)/(3+2)`


  给出的结果是：


  `[1] 3`


  如果你想重复一个命令，可以使用键盘上的向上和向下箭头键滚动浏览之前输入的命令。你可以在按回车键之前编辑该命令。这意味着你无需为了纠正一个小错误而重新输入整个命令，当你开始使用更长、更复杂的命令时，你会发现这非常有用。




  ### 函数


  为了执行除基本算术运算之外的任何操作，你都需要使用函数。函数是一组已被命名的命令，它们共同执行特定任务并产生某种输出。通常，函数还需要某种数据作为输入。


  R 语言拥有许多内置函数，可用于执行各种任务，从简单的数值四舍五入到导入文件以及执行复杂的统计分析。你将在本书中全程用到这些函数。你也可以创建自己的函数，这在第
  12 章中会简要介绍。


  每当使用函数时，你需要输入函数名，后跟圆括号。函数所需的任何输入都放在括号内。


  一个无需任何输入的函数示例是 `date` 函数，它会返回你计算机时钟的当前日期和时间。


  ```

  > date()

  [1] "Thu Apr 10 20:59:26 2014"

  ```


  一个需要输入的简单函数示例是 `round` 函数，它用于对数字进行四舍五入。所需的输入是你想要四舍五入的数字。单个输入项称为一个参数。


  ```

  > round(3.141593)

  [1] 3

  ```


  正如你所见，`round` 函数会将给定数字四舍五入到最接近的整数，但你也可以用它来将数字四舍五入到不同的精度级别。下面的命令将同一个数字四舍五入到两位小数：


  ```

  > round(3.141593, digits=2)

  [1] 3.14

  ```


  通过添加一个指定所需小数位数的额外参数，我们就能改变 `round` 函数的行为。当你向一个函数提供多个参数时，必须用逗号将它们分隔开。每个参数都有一个名称。在这个例子中，指定小数位数的参数叫做
  `digits`。通常你不需要指定参数的名称，因为 R 语言能够根据它们的值和排列顺序识别它们。因此，对于 `round` 函数，以下命令也是可接受的：


  ```

  > round(3.141593, 2)

  ```


  有些参数是可选的，而有些则是函数正常工作所必需的。对于 `round` 函数，要四舍五入的数字（本例中是 3.141593）是必需参数，没有它函数将无法工作。`digits`
  参数是可选的。如果你不提供它，R 会假定其默认值为零。


  R 语言中的每个函数都附带一个帮助文件，你可以通过输入以下命令来查看：


  ```

  > help(函数名)

  ```


  帮助文件会详细说明该函数的所有参数，包括它们是必需还是可选的，以及它们的默认值是什么。


  表 1-2 展示了一些有用的数学函数。


  **表 1-2.** 有用的数学函数


  | 用途 | 函数 |

  | --- | --- |

  | 指数 | `exp` |

  | 自然对数 | `log` |

  | 以 10 为底的对数 | `log10` |

  | 平方根 | `sqrt` |

  | 余弦 | `cos` |

  | 正弦 | `sin` |

  | 正切 | `tan` |

  | 反余弦 | `acos` |

  | 反正弦 | `asin` |

  | 反正切 | `atan` |

  | 四舍五入 | `round` |

  | 绝对值 | `abs` |

  | 阶乘 | `factorial` |


  ### 对象


  在 R 语言中，对象是被赋予名称并存储在内存中的一些数据。这些数据可以是任何东西，从一个单独的数字到一整个包含混合类型数据的表格。


  ##### 简单对象


  你可以使用赋值运算符来创建对象，它看起来像这样：


  ```

  <-

  ```


  例如，要创建一个名为 `height` 的对象，用于保存值 `72.95`（一个人的身高，单位为英寸），可以使用以下命令：


  ```

  > height<-72.95

  ```


  创建新对象时，你必须选择一个对象名称，该名称必须：


  *   仅由大写和小写字母、数字、下划线 (`_`) 和点号 (`.`) 组成

  *   以大写或小写字母或点号 (`.`) 开头

  *   不是 R 语言的保留字（输入 `help(reserved)` 可查看这些保留字列表）


  R 语言是区分大小写的，因此 `height`、`HEIGHT` 和 `Height` 都是不同的对象名称。


  如果你选择的名称已被使用，你将用新对象覆盖旧对象。R 语言在执行此操作时不会给出任何警告。


  要查看已创建对象的内容，请输入该对象名称：


  ```

  > height

  [1] 72.95

  ```


  一旦你创建了一个对象，就可以用它来代替其所包含的信息。例如，作为函数的输入：


  ```

  > log(height)

  [1] 4.289774

  ```


  除了创建具有特定值的对象外，你还可以将函数或计算的结果直接保存到一个新对象中。例如，下面的命令将 `height` 对象的值从英寸转换为厘米，并将结果保存到一个名为
  `heightcm` 的新对象中：


  ```

  > heightcm<-round(height*2.54)

  ```


  请注意，当你将函数或计算的输出赋值给一个对象时，R 语言不会显示该输出。要查看它，你必须通过输入对象名称来查看对象的内容。


  要更改对象的内容，只需用一个新值覆盖它即可：


  ```

  > height<-69.45

  ```


  像这样的对象被称为数值对象，因为它们包含数字。你还可以创建其他类型的对象，例如字符对象，它包含任意键盘字符的组合，称为字符串。创建字符对象时，请将字符串用引号括起来：


  ```

  > string1<-"Hello!"

  ```


  你可以使用双引号或单引号来括起字符串，只要它们类型一致即可。要在字符串中包含引号，请在引号前加上反斜杠（这称为转义序列）：


  ```

  > string2<-"I said \"Hello!\""

  ```


  到目前为止，我们仅讨论了包含单个数据值的简单对象，但你也可以创建更复杂的对象类型。两种重要的类型是向量和数据框。向量是一个包含多个相同类型数据值的对象。数据框是一个用于保存整个数据集的对象。向量和数据框将在以下章节中更详细地讨论。




  ##### 向量


  向量是一个对象，它能容纳多个**同一数据类型**的值，并按特定顺序排列。你可以通过一个名为 `c` 的特殊函数来创建向量。例如，假设你在随机选择的五个地点测量了摄氏温度，并记录了数据：3,
  3.76, -0.35, 1.2, -5。要将这些数据保存到一个名为 `temperatures` 的向量中，请使用以下命令：


  ```

  > temperatures<-c(3, 3.76, -0.35, 1.2, -5)

  ```


  你可以像查看其他对象一样，通过输入向量名来查看其内容。


  ```

  > temperatures

  [1]  3.00  3.76 -0.35  1.20 -5.00

  ```


  向量中值的数量称为其长度。你可以使用 `length` 函数来检查向量的长度：


  ```

  > length(temperatures)

  [1] 5

  ```


  向量中的每个数据值在向量内部都有一个位置，你可以使用方括号来引用该位置。这被称为中括号表示法。例如，你可以使用以下命令查看 `temperatures` 的第三个成员：


  ```

  > temperatures[3]

  [1] -0.35

  ```


  如果你有一个大型向量（在显示时，向量的值会填满控制台窗口的多行），侧边的索引会告诉你每行从向量的第几个成员开始。例如，下面的向量包含二十七个值。侧边的索引显示，第二行从第十一个成员开始，第三行从第二十一个成员开始。这可以帮助你确定向量中每个值的位置。


  ```

  [1]   0.077  0.489  1.603  2.110  2.625  1.019  1.100  1.729  2.469 -0.125

  [11]  1.931  0.155  0.572  1.160 -1.405  2.868  0.632 -1.714  2.615  0.714

  [21]  0.979  1.768  1.429 -0.119  0.459  1.083 -0.270

  ```


  如果你将一个向量作为输入提供给一个设计用于处理单个数字的函数（例如 `exp` 函数），R 会将该函数分别应用于向量的每个成员，并输出另一个向量：


  ```

  > exp(temperatures)

  [1] 20.085536923 42.948425979  0.704688090  3.320116923  0.006737947

  ```


  有些函数是专门为向量设计的，它们会共同使用向量中的所有成员来生成一个单一的值作为输出。一个例子是 `mean` 函数，它计算向量中所有值的平均值：


  ```

  > mean(temperatures)

  [1] 0.522

  ```


  `mean` 函数和其他统计汇总函数将在第 5 章中详细讨论。


  与基本对象一样，向量可以存储不同类型的数据值，例如数字或字符串。但是，向量中的所有成员必须是同一类型。如果你尝试创建一个同时包含数字和字符的向量，R 会将任何数值转换为字符。数字的字符表示形式会被视为文本，不能用于计算。


  ##### 数据框


  数据框是一种适合保存数据集的对象类型。数据框由几个长度相同的向量组成，这些向量垂直显示并并排排列。这形成了一个矩形网格，其中每一列都有一个名称，并包含一个向量。尽管数据框一列中的所有值必须类型相同，但不同列可以保存不同类型的数据（例如数字或字符串）。这使得它们成为存储数据集的理想工具，每一列保存一个变量，每一行保存一个观测值。


  在第 2 章中，你将学习如何创建新的数据框来保存你自己的数据集。现在，R 附带了一些数据集供你实验。其中之一叫做 `Puromycin`，我们将在此用它来演示数据框的概念。你可以像查看任何其他对象一样，通过在命令提示符下输入其名称来查看
  `Puromycin` 数据集的内容：


  ```

  > Puromycin

  ```


  R 输出数据框的内容：


  ```

  conc     rate         state

  1     0.02       76       treated

  2     0.02       47       treated

  3     0.06       97       treated

  4     0.06      107       treated

  5     0.11      123       treated

  6     0.11      139       treated

  7     0.22      159       treated

  8     0.22      152       treated

  9     0.56      191       treated

  10    0.56      201       treated

  11    1.10      207       treated

  12    1.10      200       treated

  13    0.02       67     untreated

  14    0.02       51     untreated

  15    0.06       84     untreated

  16    0.06       86     untreated

  17    0.11       98     untreated

  18    0.11      115     untreated

  19    0.22      131     untreated

  20    0.22      124     untreated

