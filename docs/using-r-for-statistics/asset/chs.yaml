  12        12       Blue     184        225    1           R\n```\n\n若要按降序而非升序排序，请将\
  \ `decreasing` 参数设置为 `T`：\n\n```\n> people <- people[order(people$Hand.Span, decreasing=T),]\n\
  ```\n\n你也可以按多个变量进行排序。要首先按 `Sex` 然后按 `Height` 对数据集排序，请使用命令：\n\n```\n> people <- people[order(people$Sex,\
  \ people$Height),]\n```\n\n\n\n### 总结\n\n现在，您应该能够通过创建分析所需的新变量、删除无关数据以及整理最终数据集来准备数据集。\n\
  \n下表展示了本章中介绍的最重要的命令。\n\n| 任务 | 命令 |\n| --- | --- |\n| 重命名变量 | `names(dataset)[n]<-\"\
  Newname\"` |\n| 查看变量类型 | `class(dataset$variable)` |\n| 将变量类型改为数值型 | `dataset$var1<-as.numeric(dataset$var1)`\
  \ |\n| 将变量类型改为因子型 | `dataset$var1<-as.factor(dataset$var1)` |\n| 将变量类型改为字符型 | `dataset$var1<-as.character(dataset$var1)`\
  \ |\n| 将变量类型改为日期型 | `dataset$var1<-as.Date(dataset$var1, \"format\")` |\n| 复制变量\
  \ | `dataset$var2<-dataset$var1` |\n| 将变量划分为类别 | `dataset$factor1<-cut(dataset$var1,\
  \ c(1,2,3,4), c(\"Name1\", \"Name2\",\"Name3\"))` |\n| 重命名因子水平 | `dataset$variable)[n]<-\"\
  Newname\"` |\n| 重新排序因子水平 | `dataset$variable, \"Level1\")` |\n| 连接两个字符串 | `dataset$var3<-paste(dataset$var1,\
  \ dataset$var2)` |\n| 提取子字符串 | `dataset$var2<-substring(dataset$var1, first, last)`\
  \ |\n| 搜索字符变量 | `grep(\"search term\", dataset$variable)` |\n| 删除个案 | `dataset<-dataset[-c(2,4,7),]`\
  \ |\n| 删除重复项 | `dataset<-unique(dataset)` |\n| 选择子集 | `subset(dataset, variable==\"\
  value\")` |\n| 选择随机样本 | `newdataset<-dataset[sample(1:nrow(dataset), samplesize),]`\
  \ |\n| 排序数据集 | `dataset<-dataset[order(dataset$variable),]` |\n\n在第 4 章中，您将学习如何对数据集进行更复杂的修改，包括合并两个或多个数据集以及更改数据结构。\n\
  \n"
- '# 4. 合并与重构数据集


  本章解释如何对数据集的结构进行重大修改。您可能需要将来自两个或多个不同来源的数据合并到一个数据集中。这可能简单如将一个数据集附加到另一个数据集的底部或侧面（称为追加或连接），也可能涉及使用共同变量来匹配观测值（称为合并）。或者，您可能需要将多个变量的值合并到一个变量中（堆叠）或将一个变量拆分为多个变量（拆分）。最后，您可能需要重塑数据集，使得原本保存在不同变量中的数据现在保存在不同的观测中，反之亦然（也称为旋转或转置）。


  您将学习如何：


  - 追加行

  - 追加列

  - 使用共同变量合并两个数据集

  - 堆叠数据集

  - 拆分数据集

  - 重塑数据集


  本章使用了 `CIAdata1`、`CIAdata2`、`WHOdata`、`CPIdata`、`bigcats`、`endangered`、`grades1`、`resistance`
  和 `vitalsigns` 数据集，这些数据集可通过本书的下载资源获取（`www.apress.com/9781484201404`）。有关这些数据集的更多详细信息，请参阅附录
  C。本章还使用了 R 自带的 `iris` 数据集。要查看关于该数据集的更多信息，请输入 `help(iris)`。


  ## 追加行


  `rbind` 函数允许您将一个数据集附加到另一个数据集的底部，这被称为追加或连接数据集。当您想要合并两个包含相同变量但不同观测值的数据集时，这非常有用，例如图
  4-1a 和 b 中显示的 `CIAdata1` 和 `CIAdata2` 数据集。


  ![A978-1-4842-0139-8_4_Fig1_HTML.jpg](img/A978-1-4842-0139-8_4_Fig1_HTML.jpg)


  图 4-1. 来自 CIA 世界概况的数据（更多详细信息请参见附录 C）


  在使用 `rbind` 函数之前，请确保每个数据集包含相同数量的变量，并且所有变量名称匹配。您可能需要先删除或重命名某些变量，如第 3 章前两节所述。变量在数据集中的排列顺序不必相同，因为
  `rbind` 函数会自动按名称匹配它们。


  一旦数据集准备好，就可以使用 `rbind` 函数追加它们，如下所示针对 `CIAdata1` 和 `CIAdata2` 数据集：


  ```

  > CIAdata<-rbind(CIAdata1, CIAdata2)

  ```


  新的 `CIAdata` 数据集如图 4-2 所示。请注意，新数据集包含了原始顺序中的所有原始数据，包括斯洛伐克的两份数据副本。`rbind` 函数不会识别重复项或对数据进行排序。您可以使用
  `unique` 和 `order` 函数来完成此操作，如第 3 章（“删除重复观测”和“排序数据集”部分）所述。


  ![A978-1-4842-0139-8_4_Fig2_HTML.jpg](img/A978-1-4842-0139-8_4_Fig2_HTML.jpg)


  图 4-2. 追加 `CIAdata1` 和 `CIAdata2` 数据集以创建 `CIAdata` 数据集的结果


  您可以用类似的方式追加三个或更多数据集：


  ```

  > newdataset<-rbind(dataset1, dataset2, dataset3)

  ```


  ## 追加列


  `cbind` 函数将一个数据集粘贴到另一个数据集的侧面。如果每个数据集对应行的数据属于同一个观测值，这非常有用，如图 4-3a,b 中显示的 `CIAdata1`
  和 `WHOdata` 数据集的情况。


  ![A978-1-4842-0139-8_4_Fig3_HTML.jpg](img/A978-1-4842-0139-8_4_Fig3_HTML.jpg)


  图 4-3. 来自 CIA 世界概况和世界卫生组织的数据（更多详细信息请参见附录 C）


  您只能使用 `cbind` 函数来合并具有相同行数的数据集。如果您的数据集有一个或多个可用于匹配观测值的共同变量，请使用 `merge` 函数合并数据集，如下一节所述。


  此命令合并 `CIAdata1` 和 `WHOdata` 数据集以创建一个名为 `CIAWHOdata` 的新数据集；结果如图 4-4c 所示：


  ```

  > CIAWHOdata<-cbind(CIAdata1, WHOdata)

  ```


  ![A978-1-4842-0139-8_4_Fig4_HTML.jpg](img/A978-1-4842-0139-8_4_Fig4_HTML.jpg)


  图 4-4. 追加 `CIAdata1` 和 `WHOdata` 数据集以创建 `CIAWHOdata` 数据集的结果


  您可以用类似的方式合并三个或更多数据集：


  ```

  > newdataset<-cbind(dataset1, dataset2, dataset3)

  ```



  好的，作为高级文档工程师和翻译员，我将遵循您的指示，完成以下翻译任务。



  ## 通过公共变量合并数据集


  `merge` 函数允许您通过根据公共变量的值匹配观测值，来合并两个数据集。


  考虑图 4-5 中所示的 `CIAdata1` 和 `CPIdata` 数据集。这两个数据集有一个名为 `country` 的公共变量，可用于匹配相应的观测值。


  ![A978-1-4842-0139-8_4_Fig5_HTML.jpg](img/A978-1-4842-0139-8_4_Fig5_HTML.jpg)


  图 4-5.


  来自 CIA《世界概况》和 Numbeo 的数据（更多详情见附录 C）


  以下命令展示了如何合并 `CIAdata1` 和 `CPIdata` 数据集；结果如图 4-6 所示：


  ```

  > CIACPIdata<-merge(CIAdata1, CPIdata)

  ```


  `merge` 函数会识别名称相同的变量，并使用它们来匹配观测值。在这个例子中，两个数据集都包含一个名为 `country` 的变量，因此 R 会自动使用这个变量来匹配观测值。如果您的数据集有多个公共变量，R
  会根据所有公共变量的唯一组合来匹配观测值。


  如果两个数据集中公共变量的名称不完全相同，最简单的解决方案是重命名变量，如 第 3 章（参见“重命名变量”）所述。或者，您可以使用 `by.x` 和 `by.y`
  参数来指定用于匹配观测值的变量。例如，要合并两个数据集，其中公共变量在第一个数据集中名为 `var1`，在第二个数据集中名为 `VAR1`，请使用以下命令：


  ```

  newdataset <-merge(dataset1, dataset2, by.x="var1", by.y="VAR1")

  ```


  当您使用 `merge` 函数合并两个数据集时，R 会自动排除仅出现在一个数据集中的任何不匹配的观测值。在图 4-6 中，您可以看到斯洛伐克（仅出现在 `CIAdata1`
  中）以及意大利和克罗地亚（仅出现在 `CPIdata` 中）都被排除在合并后的数据集之外。


  ![A978-1-4842-0139-8_4_Fig6_HTML.jpg](img/A978-1-4842-0139-8_4_Fig6_HTML.jpg)


  图 4-6.


  合并 `CIAdata1` 和 `CPIdata` 数据集以创建 `CIACPIdata` 数据集的结果


  `all`、`all.x` 和 `all.y` 参数允许您控制 R 如何处理任何不匹配的观测值。要保留所有不匹配的观测值，请将 `all` 参数设置为 `T`：


  ```

  > allCIACPIdata<-merge(CIAdata1, CPIdata, all=T)

  ```


  结果如图 4-7 所示。请注意，斯洛伐克、意大利和克罗地亚现在已被包含在内，并且在相应数据缺失的地方，已替换为缺失数据符号 `NA`。


  ![A978-1-4842-0139-8_4_Fig7_HTML.jpg](img/A978-1-4842-0139-8_4_Fig7_HTML.jpg)


  图 4-7.


  使用 `all=T` 合并 `CIAdata` 和 `CPIdata` 数据集以创建 `allCIACPIdata` 数据集的结果


  或者，您可以使用 `all.x` 和 `all.y` 参数来仅包含来自其中一个数据集的未匹配个案，而非两者。因此，命令：


  ```

  > allCIAGPIdata<-merge(CIAdata1, CPIdata, all.x=T)

  ```


  会包含斯洛伐克的数据，但不包含意大利和克罗地亚的数据；而命令：


  ```

  > allCIAGPIdata<-merge(CIAdata1, CPIdata, all.y=T)

  ```


  会包含意大利和克罗地亚的数据，但不包含斯洛伐克的数据。


  当一个观测值存在多个匹配项时，R 会在最终数据集中为每个可能的匹配项创建一个观测值。这被称为笛卡尔积。考虑图 4-8a 和 b 中所示的 `bigcats` 和
  `endangered` 数据集。两个数据集都有两个名称为“Leopard”的观测值。当这两个数据集通过 `Name` 变量合并时，最终数据集（如图 4-8c
  所示）包含了四行关于 Leopard 的数据。


  ![A978-1-4842-0139-8_4_Fig8_HTML.jpg](img/A978-1-4842-0139-8_4_Fig8_HTML.jpg)


  图 4-8.


  提供四种大型猫科动物信息的数据集（更多详情见附录 C）


  为确保从合并操作中获得所需结果，请确保您使用的公共变量能让 R 正确识别匹配项。您可能还需要事先移除重复的观测值，如 第 3 章（参见“移除重复观测值”）所述。


  R 会自动按用于匹配观测值的相同变量对合并后的数据集进行排序。如果您想阻止此行为，请将 `sort` 参数设置为 `F`：


  ```

  > newdataset <-merge(dataset1, dataset2, sort=F)

  ```


  ## 堆叠与拆堆数据集


  堆叠数据集是指将其从非堆叠形式转换为堆叠形式，而拆堆数据集则是相反的过程，即将数据集从堆叠形式转换为非堆叠形式。为了说明这两种形式的区别，请考虑图 4-9 中所示的
  `grades1` 和 `grades2` 数据集。`grades1` 数据集是非堆叠形式。它给出了十五名学生的测试结果，按照他们所属的班级分别排列在不同的列中。`grades2`
  数据集以堆叠形式给出了相同的数据。这里的数据排列在两列中，第一列给出测试结果，第二列标识学生所属的班级。


  ![A978-1-4842-0139-8_4_Fig9_HTML.jpg](img/A978-1-4842-0139-8_4_Fig9_HTML.jpg)


  图 4-9.


  同样数据的堆叠形式与非堆叠形式


  如果您想汇总所有数据值，或者想要根据分组变量对数值进行建模，那么以堆叠形式存储数据会很方便。当您想要分别分析每个组中的值时，以非堆叠形式存储数据是作为将数据拆分为子集的替代方案。


  许多常用的 R 函数，例如 `aov`（用于方差分析）、`lm`（用于回归和一般线性模型）和 `glm`（用于广义线性模型），都需要数据采用堆叠形式。大多数 R
  的假设检验函数（例如 `t.test`）能够处理堆叠或非堆叠形式的数据。


  仅当数值是数值型、没有特定顺序，并且各组数值之间不存在对应关系时，您才应该堆叠或拆堆数据集。对于更复杂的情况，例如存在一个额外变量指示每组中的哪些数值相互对应时，请参考“重塑数据集”。


  ### 堆叠数据


  要将数据集从非堆叠形式转换为堆叠形式，请使用 `stack` 函数：


  ```

  > grades2<-stack(grades1)

  ```


  要仅堆叠数据集中的某些列，请使用 `select` 参数。例如，要仅堆叠 `grades1` 数据集中的 `ClassA` 和 `ClassC` 变量，请使用以下命令：


  ```

  > newdataset<-stack(grades1, select=c("ClassA", "ClassC"))

  ```


  如果您的数据集中有任何非数值变量，R 会将其从堆叠数据集中排除。


  `stack` 函数会自动将新变量命名为 `values` 和 `ind`，但您可以使用 `names` 函数将它们更改为更具信息性的名称：


  ```

  > names(grades2)<-c("Result", "Class")

  ```


  图 4-10 显示了最终的堆叠数据集。


  ![A978-1-4842-0139-8_4_Fig10_HTML.jpg](img/A978-1-4842-0139-8_4_Fig10_HTML.jpg)


  图 4-10.


  变量名称更改后的 `grades2` 数据集




  ### 解堆叠数据


  您可以使用`unstack`函数对数据集进行解堆叠。如果您的数据集只有两个变量，其中第一个变量提供数据值，第二个变量标识观测值所属的组（例如`grades2`数据集），请使用以下函数：


  ```

  > grades1 <- unstack(grades2)

  ```


  如果您的数据集包含两个以上变量，或者变量顺序相反，则必须指定要解堆叠的变量：


  ```

  > unstackeddata <- unstack(stackeddata, values ~ groups)

  ```


  在此，`values`是包含数据值的变量名称，`groups`是标识观测值所属组的变量名称。


  例如，要解堆叠`iris`数据集（随 R 附带）中的`Sepal.Width`列，为每个鸢尾花物种创建一个包含该列的新数据集，请使用以下命令：


  ```

  > sepalwidths <- unstack(iris, Sepal.Width ~ Species)

  ```


  如果您解堆叠的变量在每个组中的值数量不相等，R 将无法排列这些值以创建新的数据框。在这种情况下，R 会创建一个列表对象，而非数据框。不过，您仍然可以通过美元符号来访问新对象中的每个组的值：


  ```

  > unstackeddata$groupA

  ```


  ## 重塑数据集


  重塑数据集也称为旋转或转换数据集。它通常适用于重复测量值的数据集，但在其他情况下也很有用。重塑是在**长格式**（重复测量值位于不同列中）和**宽格式**（重复测量值位于同一列中）之间进行转换的过程。


  为了说明长格式和宽格式之间的区别，请考虑图 [4-11a]中所展示的`resistance`数据集，该数据集提供了四种混凝土配方在凝结后三天、七天和十四天的立方体电阻测量值。此数据集为宽格式。图
  [4-11b]展示了相同数据集的**长格式**，所有测量值位于一个变量中，另一个变量则提供测量值对应的天数。


  ![A978-1-4842-0139-8_4_Fig11_HTML.jpg](img/A978-1-4842-0139-8_4_Fig11_HTML.jpg)


  图 4-11. 长格式和宽格式下的`resistance`数据集（更多详情请参见附录 C）


  如果您想构建一个将时间点作为解释变量的模型，将数据集转换为长格式会很有用。例如，将`resistance`数据集转换为长格式，允许您将电阻值建模为自混凝土凝结以来经过的天数的函数。


  `reshape`函数允许您将数据集从宽格式转换为长格式。例如，要将`resistance`数据集转换为长格式，请使用以下命令：


  ```

  > resistance2 <- reshape(resistance, direction="long", varying=list(c("Day3", "Day7",
  "Day14")), times=c(3, 7, 14), idvar="Formula", v.names="Resistance", timevar="Day")

  ```


  使用`varying`参数指定要合并到一个列中的变量。使用`times`参数为这些变量中的每一个指定新的时间值或重复编号。请注意，`times`可以是字符值而不是数值。使用`idvar`参数指定将记录分组在一起的变量。`v.names`和`timevar`参数是可选的，用于为新变量指定名称。


  新的数据集如图 [4-11b]所示。


  您也可以使用`reshape`函数执行相反的过程，即将数据集从长格式转换为宽格式。


  考虑图 [4-12a]中展示的`vitalsigns`数据集，该数据集提供了四位患者的收缩压、舒张压和脉搏测量值。所有测量值都保存在`result`变量中，而`test`变量则标识参数。


  ![A978-1-4842-0139-8_4_Fig12_HTML.jpg](img/A978-1-4842-0139-8_4_Fig12_HTML.jpg)


  图 4-12. 长格式和宽格式下的`vitalsigns`数据集（更多详情请参见附录 C）


  如果您想比较两个或多个时间点或参数的数据，或者将它们作为不同的变量包含在同一模型中，将数据集转换为宽格式会很有用。例如，重塑`vitalsigns`数据集允许您计算收缩压和舒张压之间的相关性。


  要将不同类型的测量值拆分为单独的列，请使用以下命令：


  ```

  > vitalsigns2 <- reshape(vitalsigns, direction="wide", v.names="result", timevar="test",
  idvar="subject")

  ```


  使用`v.names`参数指定要拆分为不同列的变量。使用`timevar`参数指定指示该值属于哪一列的变量（即，给出记录的时间点、重复编号或类别的变量）。使用`idvar`参数指定用于将记录分组在一起的变量。


  图 [4-12b]展示了新的宽格式数据集。请注意，R 会自动为新变量生成名称。或者，您可以使用`varying`参数指定新名称：


  ```

  > vitalsigns2 <- reshape(vitalsigns, direction="wide", v.names="result", timevar="test",
  idvar="subject", varying=list(c("SysBP", "DiaBP", "Pulse")))

  ```


  ### 总结


  您现在应该能够合并两个或多个数据集，无论是通过追加它们，还是通过使用公共变量合并它们。您应该理解堆叠格式与解堆叠格式之间的区别，并能够根据需要堆叠和解堆叠数据集。您还应该理解长格式和宽格式之间的区别，并能够在两者之间进行转换。


  下表总结了本章中涵盖的最重要的命令。


  | 任务 | 命令 |

  | :--- | :--- |

  | 垂直追加数据集 | `rbind(dataset1, dataset2)` |

  | 水平追加数据集 | `cbind(dataset1, dataset2)` |

  | 合并数据集 | `merge(dataset1, dataset2)` |

  | 堆叠数据集 | `stack(dataset, select=c("var1", "var2", "var3"))` |

  | 解堆叠数据集 | `unstack(dataset, values ~ groups)` |

  | 重塑（宽到长） | `reshape(dataset, direction="long", varying=list(c("var1", "var2", "var3")),
  times=c(t1, t2, t3), idvar="identifier")` |

  | 重塑（长到宽） | `reshape(dataset, direction="wide", v.names="values", timevar="groups",
  idvar="identifier")` |


  在下一章中，我们将继续讨论数据的汇总，从连续变量开始。




  '
- "# 5. 连续变量的汇总统计量\n\n分析数据的一个良好起点是计算一些简单的汇总统计量。本章将解释如何计算连续变量的汇总统计量。\n\n汇总统计量主要分为两类：单变量汇总统计量和关联度量。单变量统计量是从单个变量计算得出的，包括均值和中位数等位置度量，以及方差、标准差和极差等离散程度度量。关联度量则用于概括两个变量之间的关系，包括协方差、皮尔逊相关系数和斯皮尔曼相关系数。\n\
  \n本章还涵盖了一些有助于对样本来源总体进行推断的方法，包括夏皮罗-威尔克检验、科尔莫戈罗夫-斯米尔诺夫检验，以及置信区间和预测区间。\n\n你将学习如何：\n\
  *   计算单变量统计量\n*   计算不同观察组别的统计量\n*   计算两个变量之间的协方差、皮尔逊相关系数和斯皮尔曼相关系数\n*   进行假设检验，检查相关性是否具有统计显著性\n\
  *   执行夏皮罗-威尔克检验和科尔莫戈罗夫-斯米尔诺夫检验\n*   计算置信区间和预测区间\n\n本章将使用 R 语言自带的`trees`、`iris`、`warpbreaks`和`PlantGrowth`数据集，以及本书下载资源中提供的`bottles`数据集。在开始本章之前，熟悉这些数据集会有所帮助。对于\
  \ R 自带的数据集，你可以通过输入`help(数据集名称)`来查看其更多信息。关于`bottles`数据集的更多信息，请参阅附录 C。\n\n## 单变量统计量\n\
  \n要生成数据集中所有变量的汇总信息，可以使用`summary`函数。该函数会根据每个变量的类别以适当方式进行汇总。对于数值型变量，它会给出均值、中位数、极差和四分位距。对于因子型变量，它会给出每个类别的数量。如果某个变量存在任何缺失值，它还会告诉你缺失值的数量。\n\
  \n```\n> summary(iris)\nSepal.Length     Sepal.Width    Petal.Length     Petal.Width         Species\n\
  Min.   :4.300   Min.   :2.000   Min.   :1.000   Min.   :0.100   setosa    :50\n\
  1st Qu.:5.100   1st Qu.:2.800   1st Qu.:1.600   1st Qu.:0.300   versicolor:50\n\
  Median :5.800   Median :3.000   Median :4.350   Median :1.300   virginica :50\n\
  Mean   :5.843   Mean   :3.057   Mean   :3.758   Mean   :1.199\n3rd Qu.:6.400   3rd\
  \ Qu.:3.300   3rd Qu.:5.100   3rd Qu.:1.800\nMax.   :7.900   Max.   :4.400   Max.   :6.900   Max.   :2.500\n\
  ```\n\n要计算单个变量的某个特定统计量，可以使用表 5-1 中对应的函数。\n\n表 5-1. 用于汇总连续变量的函数；标有星号(*)的函数输出单个数值\n\
  \n| 统计量 | 函数 |\n| --- | --- |\n| 均值* | `mean` |\n| 中位数* | `median` |\n| 标准差* | `sd`\
  \ |\n| 中位绝对偏差* | `mad` |\n| 方差* | `var` |\n| 最大值* | `max` |\n| 最小值* | `min` |\n\
  | 四分位距* | `IQR` |\n| 极差 | `range` |\n| 分位数 | `quantile` |\n| Tukey 五数总括 | `fivenum`\
  \ |\n| 总和* | `sum` |\n| 乘积* | `prod` |\n| 观察值数量* | `length` |\n\n例如，要计算树木的平均高度，使用以下命令：\n\
  \n```\n> mean(trees$Height)\n[1] 76\n```\n\n如果变量中存在缺失数据值，请按下文所示将`na.rm`参数设置为`T`。这告诉\
  \ R 在计算统计量时忽略任何缺失值。否则，根据函数的不同，结果可能是另一个缺失值或错误消息：\n\n```\n> mean(dataset$variable,\
  \ na.rm=T)\n```\n\n要同时计算数据集中每个变量的某个特定统计量，可以将`sapply`函数与表 5-1 中的任意统计量配合使用：\n\n```\n\
  > sapply(trees, mean)\n   Girth   Height   Volume\n13.24839 76.00000 30.17097\n\
  ```\n\n同样，如果数据集中有缺失值，则将`na.rm`参数设置为`T`：\n\n```\n> sapply(dataset, mean, na.rm=T)\n\
  ```\n\n如果你的数据集中有任何变量是非数值型的，`sapply`函数的行为会不一致。例如，此命令尝试计算`iris`数据集中每个变量的最大值。R 会返回一条错误消息，因为数据集中的第五个变量是一个因子变量：\n\
  \n```\n> sapply(iris, max)\nError in Summary.factor(c(1L, 1L, 1L, 1L, 1L, 1L, 1L,\
  \ 1L, 1L, 1L, 1L,  :\nmax not meaningful for factors\n```\n\n要避免此问题，可以使用方括号表示法或`subset`函数（如第\
  \ 1 章“数据框”和第 3 章“选择数据子集”中所述）从数据集中排除任何非数值型变量：\n\n```\n> sapply(iris[-5], max)\nSepal.Length  Sepal.Width\
  \ Petal.Length  Petal.Width\n         7.9          4.4          6.9          2.5\n\
  ```\n\n\n\n## 按组统计\n\n你可能希望根据某个因子的水平对数值变量的值进行分组，并计算每组的一个统计量。有两个函数可以实现此功能，分别是 `tapply`\
  \ 和 `aggregate`。\n\n你可以将 `tapply` 函数与表 5-1 中的任何统计量配合使用。例如，对于 `iris` 数据集，计算每个品种的**花萼宽度**的平均值：\n\
  \n```\n> tapply(iris$Sepal.Width, iris$Species, mean)\nsetosa versicolor  virginica\n\
  3.428      2.770      2.974\n```\n\n如果数值变量有任何缺失数据，请将 `na.rm` 参数设置为 `T`：\n\n```\n\
  > tapply(dataset$variable, dataset$factor1, mean, na.rm=T)\n```\n\n你也可以通过将因子变量嵌套在\
  \ `list` 函数内部，按多个因子对数据进行分组。R 会为因子水平的每种组合分别计算统计量。例如，对于 `warpbreaks` 数据集，显示**张力**和**羊毛类型**每种组合下断裂次数的中位数：\n\
  \n```\n> tapply(warpbreaks$breaks, list(warpbreaks$wool, warpbreaks$tension), median)\n\
  \   L  M  H\nA 51 21 24\nB 29 28 17\n```\n\n当使用多个分组变量时，你只能使用输出单个值的统计函数（即表 5-1 中带有星号的函数）。\n\
  \n或者，你也可以使用 `aggregate` 函数按组汇总变量。使用 `aggregate` 函数的优点在于你可以同时汇总多个连续变量。它也可以与输出多个值的统计函数（例如\
  \ `range` 和 `quantile`）一起使用。然而，结果的显示方式略有不同，因此是使用 `tapply` 还是 `aggregate` 取决于个人偏好。\n\
  \n要计算每个品种的**花萼宽度**平均值，请按如下方式使用 `aggregate` 函数：\n\n```\n> aggregate(Sepal.Width~Species,\
  \ iris, mean)\n     Species Sepal.Width\n1     setosa       3.428\n2 versicolor\
  \       2.770\n3  virginica       2.974\n```\n\n同样，你也可以使用多个分组变量。例如，对于 `warpbreaks`\
  \ 数据集，计算**羊毛**和**张力**每种组合下断裂次数的中位数：\n\n```\n> aggregate(breaks~wool+tension, warpbreaks,\
  \ median)\n  wool tension breaks\n1    A       L     51\n2    B       L     29\n\
  3    A       M     21\n4    B       M     28\n5    A       H     24\n6    B    \
  \   H     17\n```\n\n要同时汇总两个或更多连续变量，请按照如下方式将它们嵌套在 `cbind` 函数中：\n\n```\n> aggregate(cbind(Sepal.Width,\
  \ Sepal.Length)~Species, iris, mean)\n     Species Sepal.Width Sepal.Length\n1 \
  \    setosa       3.428        5.006\n2 versicolor       2.770        5.936\n3 \
  \ virginica       2.974        6.588\n```\n\n你可以将输出保存到一个新的数据框中，如下所示。这允许你将结果用于进一步分析：\n\
  \n```\n> sepalmeans<-aggregate(cbind(Sepal.Width, Sepal.Length)~Species, iris, mean)\n\
  ```\n\n如果任何连续变量有缺失值，请记得将 `na.rm` 参数设置为 `T`。\n\n## 关联度量\n\n两个变量之间的关联是指它们之间的关系，这种关系意味着如果你知道一个变量的值，就能了解另一个变量的一些情况。正关联意味着随着一个变量值的增加，另一个变量的值也趋于增加。负关联意味着随着一个变量值的增加，另一个变量的值趋于减少。最常用的关联度量包括：\n\
  \n*   **协方差**：衡量两个连续变量之间线性关联的度量。协方差是尺度依赖的，意味着其值取决于变量所使用的测量单位。因此，直接解释协方差的值比较困难。两个变量之间的绝对协方差越大，关联性越强。正值表示正关联，负值表示负关联。\n\
  *   **皮尔逊相关系数**（记为 `r`）：一种尺度独立的关联度量，意味着其值不受测量单位的影响。相关系数的取值范围在 -1 到 1 之间，其中 -1 表示完全负相关，0\
  \ 表示不相关，1 表示完全正相关。相关系数仅度量线性关系，因此通过散点图检查非线性关系非常重要（参见第 8 章中的“散点图”部分）。\n*   **斯皮尔曼秩相关系数**：皮尔逊相关系数的一种非参数替代方法，它既能度量非线性关系也能度量线性关系。其取值范围也在\
  \ -1（完全负相关）到 1（完全正相关）之间，值为 0 表示不相关。斯皮尔曼相关系数既可用于秩次数据，也可用于连续数据。\n\n以下小节将解释如何在 R 中计算这些关联度量中的每一种。\n\
  \n### 协方差\n\n要计算两个变量之间的协方差，请使用 `cov` 函数：\n\n```\n> cov(trees$Height, trees$Volume)\n\
  [1] 62.66\n```\n\n你也可以为整个数据集创建一个协方差矩阵，该矩阵显示每对变量之间的协方差：\n\n```\n> cov(trees)\n  \
  \         Girth   Height    Volume\nGirth   9.847914 10.38333  49.88812\nHeight\
  \ 10.383333 40.60000  62.66000\nVolume 49.888118 62.66000 270.20280\n```\n\n从输出中可以看出，树木周长和树木高度之间的协方差是\
  \ 10.38。矩阵对角线上的值给出了变量的方差。例如，树木体积的方差是 270.2。\n\n如果你的数据集有任何非数值变量，R 将显示一条错误消息：\n\n\
  ```\n> cov(iris)\nError: is.numeric(x) || is.logical(x) is not TRUE\n```\n\n要避免此问题，请使用括号索引或\
  \ `subset` 函数排除非数值变量：\n\n```\n> cov(iris[-5])\n             Sepal.Length Sepal.Width\
  \ Petal.Length Petal.Width\nSepal.Length    0.6856935  -0.0424340    1.2743154 \
  \  0.5162707\nSepal.Width    -0.0424340   0.1899794   -0.3296564  -0.1216394\nPetal.Length\
  \    1.2743154  -0.3296564    3.1162779   1.2956094\nPetal.Width     0.5162707 \
  \ -0.1216394    1.2956094   0.5810063\n```\n\n如果任何变量有缺失值，请将 `use` 参数设置为 `\"pairwise\"\
  `，如下所示。否则，协方差矩阵也将包含缺失值：\n\n```\n> cov(dataset, use=\"pairwise\")\n```\n\n`use` 参数的另一个有用选项是\
  \ `\"complete\"`。此选项完全排除在任何变量上有缺失值的观测值，而 `\"pairwise\"` 仅排除在给定一对变量中任何一个有缺失值的观测值。输入\
  \ `help(cov)` 可查看关于这些选项的更多详细信息。\n\n\n\n##### 皮尔逊相关系数\n\n要计算两个变量之间的皮尔逊相关系数，请使用 `cor`\
  \ 函数：\n\n```\n> cor(trees$Girth, trees$Volume)\n[1] 0.9671194\n```\n\n该值非常接近 1，这表明树的周长和体积之间存在非常强的正相关关系。这意味着周长较大的树往往体积也更大。\n\
  \n你也可以为整个数据集创建一个相关矩阵：\n\n```\n> cor(trees)\n           Girth    Height    Volume\n\
  Girth  1.0000000 0.5192801 0.9671194\nHeight 0.5192801 1.0000000 0.5982497\nVolume\
  \ 0.9671194 0.5982497 1.0000000\n```\n\n请注意，矩阵对角线上的值都等于 1，因为一个变量总是与自身完全相关。\n\n记住要使用方括号表示法或\
  \ `subset` 函数来排除所有非数值变量，如下所示以 `iris` 数据集为例：\n\n```\n> cor(iris[-5])\n```\n\n如果任何变量存在缺失值，请将\
  \ `use` 参数设置为 `\"pairwise\"`：\n\n```\n> cor(dataset, use=\"pairwise\")\n```\n\n\
  ##### 斯皮尔曼秩相关系数\n\n`cor` 函数也可以计算两个变量之间的斯皮尔曼秩相关系数。将 `method` 参数设置为 `\"spearman\"\
  `：\n\n```\n> cor(trees$Girth, trees$Volume, method=\"spearman\")\n[1] 0.9547151\n\
  ```\n\n你也可以为整个数据集创建一个相关矩阵。记住要使用方括号表示法排除所有非数值变量：\n\n```\n> cor(trees, method=\"spearman\"\
  )\n           Girth    Height    Volume\nGirth  1.0000000 0.4408387 0.9547151\n\
  Height 0.4408387 1.0000000 0.5787101\nVolume 0.9547151 0.5787101 1.0000000\n```\n\
  \n如果任何变量存在缺失值，请将 `use` 参数设置为 `\"pairwise\"`：\n\n```\n> cor(dataset$var1, dataset$var2,\
  \ method=\"spearman\", use=\"pairwise\")\n```\n\n## 相关性的假设检验\n\n相关性的假设检验用于确定相关性是否具有统计显著性。该检验的零假设是总体相关性等于零，这意味着变量之间没有相关性。备择假设是总体相关性不等于零，这意味着变量之间存在某种相关性。你也可以执行单侧检验，其中备择假设是总体相关性大于零（变量正相关）或总体相关性小于零（变量负相关）。\n\
  \n注意：有关假设检验的更多详细信息，请参见第 10 章。\n\n你可以使用 `cor.test` 函数对两个变量之间的相关性进行检验：\n\n```\n> cor.test(dataset$var1,\
  \ dataset$var2)\n```\n\n默认情况下，R 执行皮尔逊相关性的检验。如果你更倾向于检验斯皮尔曼相关性，请将 `method` 参数设置为 `\"\
  spearman\"`：\n\n```\n> cor.test(dataset$var1, dataset$var2, method=\"spearman\"\
  )\n```\n\n默认情况下，R 执行双侧检验，但你可以通过根据需要将 `alternative` 参数设置为 `\"less\"` 或 `\"greater\"\
  ` 来调整：\n\n```\n> cor.test(dataset$var1, dataset$var2, alternative=\"greater\")\n\
  ```\n\n输出结果包含相关性估计值的 95% 置信区间。要调整此区间的大小，请使用 `conf.level` 参数：\n\n```\n> cor.test(dataset$var1,\
  \ dataset$var2, conf.level=0.99)\n```\n\n### 示例 5-1. 使用树木数据集进行相关性的假设检验\n\n假设你想要执行一个假设检验来帮助确定树的周长和体积之间的相关性是否具有统计显著性。\n\
  \n要在 5% 的显著性水平下对树的周长和体积之间的皮尔逊积矩相关性进行双侧检验，请使用以下命令：\n\n```\n> cor.test(trees$Girth,\
  \ trees$Volume)\n```\n\n输出结果如下所示：\n\n```\nPearson's product-moment correlation\n\
  \ndata:  trees$Girth and trees$Volume\nt = 20.4783, df = 29, p-value < 2.2e-16\n\
  alternative hypothesis: true correlation is not equal to 0\n95 percent confidence\
  \ interval:\n 0.9322519 0.9841887\nsample estimates:\ncor\n 0.9671194\n```\n\n相关性估计值为\
  \ 0.967，95% 置信区间为 0.932 到 0.984。这意味着随着树的周长增加，树的体积也趋于增加。\n\n由于 p 值 2.2e-16 远小于显著性水平\
  \ 0.05，我们可以拒绝零假设（即周长和体积之间没有相关性），转而支持备择假设，即两者是相关的。\n\n### 科学计数法\n\n科学计数法是一种更紧凑地表示非常大或非常小数字的方法。\n\
  \n例如，数字 720000 等于 7.2 × 100000 或 7.2 × 10⁵。R 和许多其他编程语言使用字母 `e` 来表示“乘以 10 的幂”，因此\
  \ 7.2 × 10⁵ 显示为 `7.2e5`。\n\n科学计数法对于非常小的数字同样适用，例如，数字 0.000072 等于 7.2 × 0.00001 或\
  \ 7.2 × 10^(-5)。使用 R 表示法，这将显示为 `7.2e-5`。\n\n## 比较样本与指定分布\n\n有时你可能希望确定你的样本是否与从特定类型的分布（例如正态分布）中抽取的样本一致。这很有用，因为许多统计技术（例如方差分析）仅适用于正态分布的数据。\n\
  \n两种允许你进行此操作的方法是夏皮罗-威尔克检验和科尔莫戈罗夫-斯米尔诺夫检验。要直观地评估你的数据与正态分布的拟合程度，请使用直方图或正态概率图（详见第 8\
  \ 章）。\n\n#### 夏皮罗-威尔克检验\n\n夏皮罗-威尔克检验是一种假设检验，可以帮助确定样本是否来自正态分布。该检验的零假设是样本来自正态分布，备择假设是样本并非来自正态分布。\n\
  \n你可以使用 `shapiro.test` 函数执行夏皮罗-威尔克检验。\n\n```\n> shapiro.test(dataset$variable)\n\
  ```\n\n### 示例 5-2. 使用树木数据集进行夏皮罗-威尔克检验\n\n假设你想要执行一个夏皮罗-威尔克检验来帮助确定树的高度是否遵循正态分布。你将使用\
  \ 5% 的显著性水平。要执行此检验，请使用以下命令：\n\n```\n> shapiro.test(trees$Height)\n```\n\n输出结果：\n\
  \n```\nShapiro-Wilk normality test\n\ndata:  trees$Height\nW = 0.9655, p-value =\
  \ 0.4034\n```\n\n从输出结果可以看出，检验的 p 值为 0.4034。由于这不小于我们的显著性水平 0.05，我们不能拒绝零假设。这意味着没有证据表明树的高度不遵循正态分布。\n\
  \n\n\n"
- "# 柯尔莫戈洛夫-斯米诺夫检验\n\n单样本 `Kolmogorov-Smirnov test`（柯尔莫戈洛夫-斯米诺夫检验）有助于判断一个样本是否来自某个特定的理论分布。它的原假设是样本来自该分布，备择假设是样本并非来自该分布。\n\
  \n双样本 `Kolmogorov-Smirnov test`（柯尔莫戈洛夫-斯米诺夫检验）有助于判断两个样本是否来自同一分布。它的原假设是两个样本来自同一分布，备择假设是它们并非来自同一分布。\n\
  \n请注意，单样本和双样本的 `Kolmogorov-Smirnov` 检验都要求数据是连续的。如果你的数据包含结（即某些值完全相等），则无法执行该检验。如果你的数据没有记录到足够的小数位数，这可能会成为一个问题。\n\
  \n你可以使用 `ks.test` 函数执行 `Kolmogorov-Smirnov` 检验。要执行原假设为样本来自均值为 100、标准差为 10 的正态分布的单样本检验，请使用以下命令：\n\
  \n`> ks.test(dataset$variable, \"pnorm\", 100, 10)`\n\n要测试样本是否来自另一个理论分布，请将 `\"pnorm\"\
  ` 替换为相应的累积分布函数。标准概率分布的函数列表见第 7 章的表 7.1。你还必须将平均值和标准差替换为该分布相关的任何参数。使用 `help` 函数检查你所关注分布的参数。\n\
  \n要执行双样本检验以判断两个样本是否来自同一分布，请使用以下命令：\n\n`> ks.test(dataset$sample1, dataset$sample2)`\n\
  \n如果你的数据是堆叠形式（两个样本的值都在一个变量中），则必须首先像第 4 章（在“解堆叠数据”部分）所解释的那样，对数据集进行解堆叠。\n\n## 示例 5-3.\
  \ 使用瓶装数据进行的单样本柯尔莫戈洛夫-斯米诺夫检验\n\n考虑 `bottles` 数据集，该数据集可从本书的下载资源中获得。该数据集提供了从灌装线上抽取的\
  \ 20 瓶软饮料样本的数据。该数据集包含一个名为 `Volume` 的变量，该变量给出了每瓶饮料的液体体积（毫升）。\n\n瓶装灌装量被认为服从均值为 500\
  \ 毫升、标准差为 25 毫升的正态分布。假设您希望使用单样本 `Kolmogorov-Smirnov` 检验来确定数据是否与该理论相符。该检验的原假设是瓶装体积来自所述分布，备择假设是它们并非来自该分布。检验将使用\
  \ 0.05 的显著性水平。\n\n要执行此检验，请使用以下命令：\n\n`> ks.test(bottles$Volume, \"pnorm\", 500,\
  \ 25)`\n\n这将给出以下输出：\n\n```\nOne-sample Kolmogorov-Smirnov test\n\ndata:  bottles$Volume\n\
  D = 0.2288, p-value = 0.2108\nalternative hypothesis: two-sided\n```\n\n从输出中我们可以看到，该检验的\
  \ p 值为 0.2108。由于这不小于 0.05 的显著性水平，我们不能拒绝原假设。这意味着没有证据表明瓶装体积不是来自所述的正态分布。\n\n## 示例 5-4.\
  \ 使用 PlantGrowth 数据进行的双样本柯尔莫戈洛夫-斯米诺夫检验\n\n考虑 `PlantGrowth` 数据集（包含在 R 中），该数据集提供了三十批植物的干重，每批植物接受了三种不同处理中的一种。`weight`\
  \ 变量给出了批次的重量，`groups` 变量给出了接受的处理方式（`ctrl`、`trt1` 或 `trt2`）。\n\n假设您想使用双样本 `Kolmogorov-Smirnov`\
  \ 检验来确定批次重量在处理组 `trt1` 和 `trt2` 中是否具有相同的分布。\n\n首先，您需要使用 `unstack` 函数对数据进行解堆叠。\n\n\
  `> PlantGrowth2 <- unstack(PlantGrowth)`\n\n数据处于解堆叠形式后，按如下所示执行检验：\n\n`> ks.test(PlantGrowth2$trt1,\
  \ PlantGrowth2$trt2)`\n\n这将给出以下输出：\n\n```\nTwo-sample Kolmogorov-Smirnov test\n\n\
  data:  PlantGrowth2$trt1 and PlantGrowth2$trt2\nD = 0.8, p-value = 0.002057\nalternative\
  \ hypothesis: two-sided\n```\n\np 值 0.002057 小于显著性水平 0.05。这意味着有证据支持拒绝原假设（即两个处理组的批次重量分布相同），而支持备择假设（即两个处理组的批次重量分布不同）。\n\
  \n## 置信区间与预测区间\n\n总体均值的置信区间表明了样本均值估计总体均值的准确程度。95% 置信区间被定义为这样一种方式计算的区间：如果从总体中抽取大量样本，并为每个样本计算该区间，那么\
  \ 95% 的区间将包含真实的总体均值。\n\n预测区间表明了样本均值预测从总体中抽取的另一个观测值的准确程度。\n\n获取样本均值置信区间的最简单方法是使用\
  \ `t.test` 函数，该函数直接在输出中提供置信区间。第 10 章的“学生 t 检验”部分会更详细地讨论该函数。如果您只对获取置信区间感兴趣，请使用以下命令：\n\
  \n`> t.test(trees$Height)`\n\n```\nOne Sample t-test\n\ndata:  trees$Height\nt =\
  \ 66.4097, df = 30, p-value < 2.2e-16\nalternative hypothesis: true mean is not\
  \ equal to 0\n95 percent confidence interval:\n  73.6628 78.3372\nsample estimates:\n\
  mean of x\n76\n```\n\n从结果中，您可以看到树木的平均高度为 76 英尺，95% 置信区间为 73.7 到 78.3 英尺。\n\n默认情况下，R\
  \ 计算 95% 的区间。对于不同大小的置信区间，例如 99%，请按如下所示调整 `conf.level` 参数：\n\n`> t.test(trees$Height,\
  \ conf.level = 0.99)`\n\n您也可以计算单侧置信区间。对于上侧置信区间，将 `alternative` 参数设置为 `\"less\"`。对于下侧置信区间，将其设置为\
  \ `\"greater\"`。\n\n`> t.test(dataset$variable, alternative = \"greater\")`\n\n\
  要计算树木高度的预测区间，请使用以下命令：\n\n`> predict(lm(trees$Height ~ 1), interval = \"prediction\"\
  )[1,]`\n\n```\n    fit      lwr      upr\n76.0000 62.7788 89.2212\nWarning message:\n\
  In predict.lm(lm(trees$Height ~ 1), interval = \"prediction\") :\n  predictions\
  \ on current data refer to _future_ responses\n```\n\n从输出中您可以看到树木高度的预测区间为 62.8 到\
  \ 89.2 英尺。\n\n同样，您可以使用 `level` 参数调整置信水平，如下所示：\n\n`> predict(lm(dataset$variable\
  \ ~ 1), interval = \"prediction\", level = 0.99)[1,]`\n\n创建预测区间的命令使用了 `lm` 和 `predict`\
  \ 函数。您将在第 11 章中了解更多关于这些函数的内容，这将帮助您理解这些复杂命令的作用。目前，您只需替换相应的数据集和变量名即可直接使用它们。\n\n\n\n\
  ### 总结\n\n你现在应该能够使用 R 语言来总结数据集中的连续变量，并检验它们之间的关系。你还应该能够根据样本对总体进行一些推断，例如样本是否服从正态分布。\n\
  \n下表总结了本章涵盖的最重要的命令。\n\n| 任务 | 命令 |\n| --- | --- |\n| 每个变量的统计量 | `sapply(dataset,\
  \ statistic)` |\n| 按分组的统计量 | `tapply(dataset$var1, dataset$factor1, statistic)`\
  \ |\n| 按分组的统计量 | `aggregate(variable ~ factor, dataset, statistic)` |\n| 协方差 | `cov(dataset$var1,\
  \ dataset$var2)` |\n| 协方差矩阵 | `cov(dataset)` |\n| 皮尔逊相关系数 | `cor(dataset$var1, dataset$var2)`\
  \ |\n| 相关矩阵 | `cor(dataset)` |\n| 斯皮尔曼秩相关系数 | `cor(dataset$var1, dataset$var2, method=\"\
  spearman\")` |\n| 斯皮尔曼相关矩阵 | `cor(dataset, method=\"spearman\")` |\n| 相关性的假设检验 |\
  \ `cor.test(dataset$var1, dataset$var2)` |\n| 夏皮罗-威尔克检验 | `shapiro.test(dataset$variable)`\
  \ |\n| 单样本柯尔莫哥洛夫-斯米诺夫检验 | `ks.test(dataset$sample1, \"pnorm\", mean, sd)` |\n| 双样本柯尔莫哥洛夫-斯米诺夫检验\
  \ | `ks.test(dataset$sample1, dataset$sample2)` |\n| 置信区间 | `t.test(dataset$variable)`\
  \ |\n| 预测区间 | `predict(lm(dataset$variable ~ 1), interval=\"prediction\")[1,]` |\n\
  \n既然你已经学会了如何总结连续变量，我们可以进入下一章，该章将介绍分类变量。\n\n"
- "# 6. 表格数据\n\n本章将解释如何对分类变量进行总结和统计计算。分类数据通常用频数表（针对一个变量）或列联表（针对两个或多个变量）来呈现，这种表格显示了每个类别或每个类别组合中的数值个数。以此形式总结的数据被称为表格数据。\n\
  \n除了将分类数据总结到表格中，您可能还需要使用卡方拟合优度检验将其与假设的分布进行比较。您可能还想确定两个或多个分类变量之间是否存在关联。卡方关联检验和费希尔精确检验是两种可以帮助您实现这一目标的方法。\n\
  \n您将学习如何：\n\n-   创建频数表和列联表来总结分类数据，以及如何将结果存储为表格对象\n-   以百分比或边际和的形式显示您的表格\n-   执行卡方拟合优度检验\n\
  -   执行卡方关联检验，以确定两个或多个分类变量之间的关系\n-   对二乘二列联表执行费希尔精确关联检验\n-   执行比例检验\n\n本章使用 R 语言自带的\
  \ `warpbreaks` 和 `esoph` 数据集以及 `Titanic` 表格对象。您可以通过输入 `help(datasetname)` 来查看关于它们的更多信息。本章还使用了\
  \ `people2` 数据集（这是第 3 章介绍的 `people` 数据集的修改版）和 `apartments` 数据集。这两个数据集都随本书的下载资源提供，并在附录\
  \ C 中进行了描述。\n\n#### 频数表\n\n频数表通过显示每个类别中的观测数量来总结一个分类变量。针对两个或多个分类变量的频数表（称为列联表或交叉表）通过显示落入每个类别组合中的观测数量来总结两个或多个分类变量之间的关系。\n\
  \n在 R 语言中，表格也是一种保存制表数据的对象类型。R 语言自带了一些示例表格对象，例如 `HairEyeColor` 和 `Titanic`。\n\n###\
  \ 创建表格\n\n要创建显示因子变量每个水平观测数量的一维频数表，请使用 `table` 函数：\n\n```\n> table(people2$Eye.Color)\n\
  \nBlue Brown Green\n  7     6     3\n```\n\n尽管 R 语言允许你从任何类型的变量创建表格，但它们仅对取值数量相对较少的因子变量才有实际意义。如果你想包含一个连续变量，请先使用\
  \ `cut` 函数将其划分为类别，如第 3 章“将连续变量划分为类别”中所述。要向表格添加一个显示缺失值数量（如果有的话）的额外列，请设置 `useNA` 参数：\n\
  \n```\n> table(dataset$factor1, useNA=\"ifany\")\n```\n\n要创建一个二维列联表，请将两个变量作为输入：\n\
  \n```\n> table(people2$Eye.Color, people2$Sex)\n\n        Male Female\n  Blue  \
  \   4      3\n  Brown    5      1\n  Green    1      2\n```\n\n类似地，你可以为三个或更多变量创建列联表：\n\
  \n```\n> table(people2$Eye.Color, people2$Height.Cat, people2$Sex)\n\n, ,  = Male\n\
  \n        Medium Short Tall\n  Blue       2     0    2\n  Brown      4     0   \
  \ 1\n  Green      0     0    1\n\n, ,  = Female\n\n        Medium Short Tall\n \
  \ Blue       3     0    0\n  Brown      0     0    0\n  Green      0     2    0\n\
  ```\n\n要将表格保存为表格对象，请将 `table` 函数的输出赋值给一个新的对象名称：\n\n```\n> sexeyetable <- table(people2$Eye.Color,\
  \ people2$Sex)\n```\n\n创建表格对象后，你可以将进一步的函数应用于该对象，以生成与表格数据相关的输出。例如，你可以使用 `pie` 函数创建饼图来显示每种眼睛颜色的人数比例，或者使用\
  \ `summary` 函数来检验眼睛颜色与性别之间的关联。你将在本章后面部分了解其中一些函数。请保存 `sexeyetable` 对象，因为它将在后面派上用场。\n\
  \n\n\n### 显示表格\n\n有一些函数可以让你以不同方式展示表格对象。其中包括 `ftable`、`prop.table` 和 `addmargins`。\n\
  \n`ftable` 函数以更紧凑的方式显示表格，这对于具有三个或更多维度的表格非常有用：\n\n```\n> ftable(Titanic)\n      \
  \             Survived  No Yes\nClass Sex    Age\n1st   Male   Child           \
  \ 0   5\n             Adult          118  57\n      Female Child            0  \
  \ 1\n             Adult            4 140\n2nd   Male   Child            0  11\n\
  \             Adult          154  14\n      Female Child            0  13\n    \
  \         Adult           13  80\n3rd   Male   Child           35  13\n        \
  \     Adult          387  75\n      Female Child           17  14\n            \
  \ Adult           89  76\nCrew  Male   Child            0   0\n             Adult\
  \          670 192\n      Female Child            0   0\n             Adult    \
  \        3  20\n```\n\n`prop.table` 函数将表格中的每个单元格计数显示为总数的比例：\n\n```\n> prop.table(sexeyetable)\n\
  \          Male Female\n  Blue  0.2500 0.1875\n  Brown 0.3125 0.0625\n  Green 0.0625\
  \ 0.1250\n```\n\n要显示单元格计数占行或列总和的比例（而非占总计数的比例），可以将 `margin` 参数设置为：1 表示行，2 表示列，3 及以上表示更高维度：\n\
  \n```\n> prop.table(sexeyetable, margin=2)\n             Male    Female\n  Blue\
  \  0.4000000 0.5000000\n  Brown 0.5000000 0.1666667\n  Green 0.1000000 0.3333333\n\
  ```\n\n要显示百分比，请将整个表格乘以 100。你也可以使用 `round` 函数来四舍五入表格中的所有数字：\n\n```\n> round(prop.table(sexeyetable)*100)\n\
  \        Male Female\n  Blue    25     19\n  Brown   31      6\n  Green    6   \
  \  12\n```\n\n`addmargins` 函数显示包含行和列总计的表格：\n\n```\n> addmargins(sexeyetable)\n \
  \       Male Female Sum\n  Blue     4      3   7\n  Brown    5      1   6\n  Green\
  \    1      2   3\n  Sum     10      6  16\n```\n\n要仅向表格的一个维度添加边际和，可以将 `margin`\
  \ 参数设置为：1 表示行，2 表示列，3 及以上表示更高维度：\n\n```\n> addmargins(sexeyetable, margin=1)\n \
  \       Male Female\n  Blue     4      3\n  Brown    5      1\n  Green    1    \
  \  2\n  Sum     10      6\n```\n\n### 从计数数据创建表格\n\n到目前为止，你是通过将数据集中的每一行计为一个观测值来创建表格的。然而，有时你可能会遇到计数数据已经聚合的数据集，例如\
  \ `warpbreaks` 数据集（包含在 R 中）。\n\n要从包含计数数据的数据框创建表格，请使用 `xtabs` 函数：\n\n```\n> xtabs(breaks~wool+tension,\
  \ warpbreaks)\n    tension\nwool   L   M   H\n   A 401 216 221\n   B 254 259 169\n\
  ```\n\n如果数据框有多列计数数据，请将它们放在 `list` 函数中：\n\n```\n> xtabs(list(counts1, counts2) ~\
  \ factor1, dataset)\n```\n\n你可以通过将 `xtabs` 函数的输出分配给一个新对象名称来创建一个表格对象：\n\n```\n> warpbreakstable\
  \ <- xtabs(breaks~wool+tension, warpbreaks)\n```\n\n要从表格对象创建计数数据的数据框，请使用 `as.data.frame`\
  \ 函数：\n\n```\n> as.data.frame(Titanic)\n   Class    Sex   Age Survived Freq\n1 \
  \   1st   Male Child       No    0\n2    2nd   Male Child       No    0\n3    3rd\
  \   Male Child       No   35\n4   Crew   Male Child       No    0\n5    1st Female\
  \ Child       No    0\n6    2nd Female Child       No    0\n7    3rd Female Child\
  \       No   17\n8   Crew Female Child       No    0\n9    1st   Male Adult    \
  \   No  118\n10   2nd   Male Adult       No  154\n11   3rd   Male Adult       No\
  \  387\n12  Crew   Male Adult       No  670\n13   1st Female Adult       No    4\n\
  14   2nd Female Adult       No   13\n15   3rd Female Adult       No   89\n16  Crew\
  \ Female Adult       No    3\n17   1st   Male Child      Yes    5\n18   2nd   Male\
  \ Child      Yes   11\n19   3rd   Male Child      Yes   13\n20  Crew   Male Child\
  \      Yes    0\n21   1st Female Child      Yes    1\n22   2nd Female Child    \
  \  Yes   13\n23   3rd Female Child      Yes   14\n24  Crew Female Child      Yes\
  \    0\n25   1st   Male Adult      Yes   57\n26   2nd   Male Adult      Yes   14\n\
  27   3rd   Male Adult      Yes   75\n28  Crew   Male Adult      Yes  192\n29   1st\
  \ Female Adult      Yes  140\n30   2nd Female Adult      Yes   80\n31   3rd Female\
  \ Adult      Yes   76\n32  Crew Female Adult      Yes   20\n```\n\n### 直接创建表格\n\n\
  有时你可能根本没有数据集，只有一个计数表。为了能够执行诸如卡方检验（本章后面会介绍）之类的分析，你需要将数据作为表格对象输入到 R 中。\n\n你可以使用 `as.table`\
  \ 函数创建一个一维表格对象。如下所示，输入每个类别的计数：\n\n```\n> table1D <- as.table(c(5, 21, 17, 3, 1))\n\
  ```\n\n当你查看表格时，可以看到 R 已为类别提供了默认名称 A、B 等：\n\n```\n> table1D\nA  B  C  D  E\n5 21\
  \ 17  3  1\n```\n\n要使用正确的类别名称覆盖默认名称，请使用 `row.names` 函数：\n\n```\n> row.names(table1D)\
  \ <- c(\"类别 1\", \"类别 2\", \"类别 3\", \"类别 4\", \"类别 5\")\n```\n\n你也可以用类似的方式将二维表格输入到\
  \ R 中。假设你想要输入表 6-1 中显示的数据。\n\n表 6-1. 接受活性治疗或对照治疗后，患病与未患病受试者的数量\n\n| | | 疾病状态 |\n\
  | --- | --- | --- |\n| | | 已痊愈 | 未痊愈 |\n| 组别 | 活性治疗组 | 15 | 11 |\n| | 对照组 | 10 |\
  \ 15 |\n\n要创建一个二维表格，你首先需要创建一个矩阵对象，然后将其转换为表格对象。矩阵是一种保存矩形数据网格的对象类型，其中所有数据都是同一类型（字符型或数字型）。它有点像向量，但具有两个维度。要创建矩阵，请使用\
  \ `matrix` 函数：\n\n```\n> matrix1 <- matrix(c(15, 10, 11, 15), nrow=2)\n```\n\n这将创建如下所示的矩阵：\n\
  \n```\n> matrix1\n     [,1] [,2]\n[1,]   15   11\n[2,]   10   15\n```\n\n如你所见，R\
  \ 已将值列表排列成一个二乘二矩阵。R 从矩阵的第一列开始，从上到下填充，然后移动到第二列，依此类推。`nrow` 参数告诉 R 矩阵应该有多少行，所需的列数是自动计算的。或者，你可以使用\
  \ `ncol` 参数来指定列数。\n\n要为表格的维度和水平提供适当的标签，请使用 `dimnames` 参数：\n\n```\n> matrix1 <- matrix(c(15,\
  \ 9, 11, 17), nrow=2, dimnames=list(组别=c(\"活性\", \"对照\"), 疾病=c(\"已痊愈\", \"未痊愈\"\
  )))\n```\n\n一旦你创建了矩阵，就可以使用 `as.table` 函数将其转换为表格对象：\n\n```\n> treattable <- as.table(matrix1)\n\
  ```\n\n或者，你可以通过将 `matrix` 函数嵌套在 `as.table` 函数中，一步创建表格：\n\n```\n> treattable <- as.table(matrix(c(15,\
  \ 9, 11, 16), nrow=2, dimnames=list(组别=c(\"活性\", \"对照\"), 疾病=c(\"已痊愈\", \"未痊愈\"\
  ))))\n```\n\n\n\n#### 卡方拟合优度检验\n\n卡方拟合优度检验（也称为皮尔逊卡方检验或χ²检验）允许你将分类数据与理论分布进行比较。其原假设是数据遵循指定的分布，备择假设是数据不遵循该分布。该检验仅在数据量充足时适用，通常定义为每个类别（在原假设下）的期望频数至少为\
  \ 5。\n\n该检验不应与卡方关联性检验（见本章下一节）混淆，后者用于判断两个或多个分类变量是否相关。卡方拟合优度检验和卡方关联性检验都是皮尔逊卡方检验的形式，但它们针对数据回答了不同的问题。为了说明区别，假设你记录了一系列六面骰子的投掷结果，并希望通过这些数据判断骰子是否公平，此时应使用卡方拟合优度检验。该检验的原假设是六个面被掷出的概率相等，均为\
  \ 1/6。然而，如果你同时记录了掷骰子的人名和骰子结果，并想判断掷骰结果与掷骰人之间是否存在关系，则应使用卡方关联性检验。\n\n**注意**\n\n有关假设检验的更多详细信息，请参阅第\
  \ 10 章。\n\n你可以使用`chisq.test`函数执行卡方拟合优度检验。如果你有一个一维表对象，可以针对均匀分布（即原假设所有类别出现的概率相等）进行检验，如下所示：\n\
  \n```\n> chisq.test(tableobject)\n```\n\n如果你使用原始数据，请将`table`函数嵌套在`chisq.test`函数中：\n\
  \n```\n> chisq.test(table(dataset$factor1))\n```\n\n若要针对不同的理论分布检验数据，请使用`p`参数给出原假设下期望的相对频率列表。你必须提供与表中水平数量相同的相对频率，且它们的总和必须为\
  \ 1。\n\n例如，要检验以下假设：10%的总体属于第一类，40%属于第二类，40%属于第三类，10%属于第四类，请使用以下命令：\n\n```\n> chisq.test(tableobject,\
  \ p=c(0.1, 0.4, 0.4, 0.1))\n```\n\n**示例 6-1. 使用公寓数据进行卡方拟合优度检验**\n\n考虑`apartments`数据集（可从本书的下载资源中获得，并在附录\
  \ C 中描述），该数据集提供了 2012 年 10 月英国某个特定区域中 39 套一居室公寓的出租详情。其中`Price.Cat`变量表示公寓的租金价格类别。\n\
  \n要创建一个显示各价格类别中公寓数量的表格，请使用以下命令：\n\n```\n> table(apartments$Price.Cat)\n```\n\n```\n\
  £500-550 £551-600 £601-650    £651+\n5       13        8        6\n```\n\n据信，该区域\
  \ 20%的一居室公寓租金低于 550 英镑，30%的公寓租金在 551 至 600 英镑之间，30%的公寓租金在 601 至 650 英镑之间，20%的公寓租金高于\
  \ 650 英镑。\n\n假设你想使用卡方拟合优度检验来判断数据是否与假设的价格分布一致。该检验的原假设是所述的价格分布是正确的，备择假设是它不正确。显著性水平设为\
  \ 0.05。\n\n要执行该检验，请使用以下命令：\n\n```\n> chisq.test(table(apartments$Price.Cat), p=c(0.2,\
  \ 0.3, 0.3, 0.2))\n```\n\n这将输出以下结果：\n\n```\nChi-squared test for given probabilities\n\
  \ndata:  table(apartments$Price.Cat)\nX-squared = 1.8021, df = 3, p-value = 0.6145\n\
  ```\n\np 值为 0.6145，不小于 0.05 的显著性水平，因此我们无法拒绝原假设。这意味着数据与假设的价格分布一致。\n\n## 分类变量之间的关联性检验\n\
  \n正如我们可以使用协方差和相关性等统计量来考察连续变量之间的关联性一样，也有方法可以帮助你判断分类变量之间是否存在关联。其中两种方法是卡方关联性检验和费希尔精确检验。这些检验回答相同的问题，但适用于不同的情况。\n\
  \n卡方关联性检验用于检验两个或多个变量之间的关联性，并且无论每个变量有多少个水平都可以使用。然而，该检验仅在数据量充足时适用。\n\n相比之下，费希尔精确检验只能用于考察两个各有两个水平的分类变量之间的关联性。然而，即使在数据量非常少的情况下，它也是适用的。\n\
  \n以下部分将解释如何在 R 中执行这些检验。\n\n\n\n### 关联性卡方检验\n\n关联性卡方检验（有时也称为独立性卡方检验）有助于确定两个或多个分类变量之间是否存在关联。该检验的原假设是变量之间相互独立，备择假设是变量之间并不独立（即至少有两个变量存在关联）。该检验仅在数据量充足时适用，通常定义为：所有表格单元格在（原假设下）的期望计数至少为\
  \ 5。\n\n当输入一个表格对象时，`summary`函数会执行关联性卡方检验。如果你已经创建了一个表格对象，可以直接使用`summary`函数：\n\n```\n\
  > summary(tableobject)\n```\n\n如果你拥有原始数据，可以将`table`函数嵌套在`summary`函数内使用：\n\n```\n\
  > summary(table(dataset$var1, dataset$var2, dataset$var3))\n```\n\n### 示例 6-2. 使用\
  \ PEOPLE2 数据进行关联性卡方检验\n\n假设你想使用关联性卡方检验，利用`people2`数据集来确定性别与眼睛颜色之间是否存在关联。\n\n如果你在本章前面“频数表”部分创建的`sexeyetable`对象仍然存在，请使用以下命令：\n\
  \n```\n> summary(sexeyetable)\n```\n\n或者，你也可以使用原始数据进行检验：\n\n```\n> summary(table(people2$Sex,\
  \ people2$Eye.Colour))\n表中案例数：16\n因子数：2\n所有因子独立性检验：\n卡方值 = 2.2857，自由度 = 2，p 值 =\
  \ 0.3189\n卡方近似可能不准确\n```\n\n由于 p 值 0.3189 不小于显著性水平 0.05，我们不能拒绝性别与眼睛颜色相互独立这一原假设。这意味着没有证据表明两者之间存在关联。\n\
  \n“卡方近似可能不准确”这一警告告诉我们，某些单元格的期望计数小于 5。这意味着结果可能不可靠，解释时应谨慎。关于期望计数较小时的卡方检验讨论，可参见 B.\
  \ S. Everitt 所著的《列联表分析》（第二版，Chapman & Hall/CRC 出版社，1992 年）第 39 页。\n\n### 示例 6-3.\
  \ 使用 ESOPH 数据进行关联性卡方检验\n\n考虑`esoph`数据集，该数据集包含在 R 中。该数据集提供了一项食管癌病例对照研究的结果。你可以通过输入`help(esoph)`查看更多细节。变量`agegp`、`alcgp`和`tobgp`分别列出了受试者的年龄、饮酒量和吸烟习惯的类别。变量`ncases`和`ncontrols`给出了每个类别中患有和未患有食管癌的受试者人数。\n\
  \n假设你想使用关联性卡方检验来确定吸烟习惯与食管癌之间是否存在任何关联。该检验的原假设是吸烟习惯与食管癌相互独立，备择假设是它们之间存在关联。将使用 0.05\
  \ 的显著性水平。\n\n由于该数据集包含已表示为计数形式的数据，你可以使用`xtabs`函数创建一个表格，其中给出每个吸烟习惯类别中患有和未患有食管癌的受试者人数：\n\
  \n```\n> tobacco <- xtabs(cbind(ncases, ncontrols) ~ tobgp, esoph)\n> tobacco\n\
  tobgp      ncases ncontrols\n0-9g/天      78       525\n10-19        58       236\n\
  20-29        33       132\n30+          31        82\n```\n\n要执行检验，请使用以下命令：\n\n\
  ```\n> summary(tobacco)\n调用：xtabs(formula = cbind(ncases, ncontrols) ~ tobgp, data\
  \ = esoph)\n表中案例数：1175\n因子数：2\n所有因子独立性检验：\n卡方值 = 18.363，自由度 = 3，p 值 = 0.0003702\n\
  ```\n\n由于 p 值 0.0003702 小于显著性水平 0.05，我们可以拒绝吸烟类别与食管癌相互独立这一原假设，转而支持两者存在关联的备择假设。这意味着有证据表明吸烟习惯与食管癌之间存在关系。\n\
  \n#### 费希尔精确检验\n\n费希尔精确检验用于检验各有两个水平的两个分类变量之间的关联性。与关联性卡方检验不同，即使数据量非常少，也可以使用该检验。该检验的原假设是两个变量相互独立，备择假设是它们并不独立。\n\
  \n你可以使用`fisher.test`函数执行费希尔精确检验。你可以将该函数用于一个 2×2 的表格对象：\n\n```\n> fisher.test(tableobject)\n\
  ```\n\n你也可以使用原始数据：\n\n```\n> fisher.test(dataset$var1, dataset$var2)\n```\n\n检验结果会附带一个比值比的\
  \ 95%置信区间。你可以使用`conf.level`参数更改区间大小：\n\n```\n> fisher.test(dataset$var1, dataset$var2,\
  \ conf.level = 0.99)\n```\n\n### 示例 6-4. 使用 PEOPLE2 数据进行费希尔精确检验\n\n使用`table`函数，我们可以看到在`people2`数据集中，左撇子女性多于左撇子男性：\n\
  \n```\n> table(people2$Sex, people2$Handedness)\n         左撇子 右撇子\n  男性        0\
  \     9\n  女性        2     2\n```\n\n假设你想执行费希尔精确检验，以确定性别与用手习惯之间是否存在任何统计上显著的关系。该检验的原假设是性别与用手习惯相互独立，备择假设是它们之间存在关联。使用\
  \ 0.05 的显著性水平。\n\n要执行检验，请使用以下命令：\n\n```\n> fisher.test(people2$Sex, people2$Handedness)\n\
  ```\n\n这将给出输出结果：\n\n```\n        计数数据的费希尔精确检验\n\n数据：people2$Sex 和 people2$Handedness\n\
  p 值 = 0.07692\n备择假设：真实比值比不等于 1\n95%置信区间：\n 0.000000 2.098087\n样本估计值：\n比值比\n    \
  \     0\n```\n\n由于 p 值 0.07692 不小于显著性水平 0.05，我们不能拒绝性别与用手习惯相互独立这一原假设。这意味着没有证据表明性别与用手习惯之间存在关系。\n\
  \n\n\n#### 比例检验\n\n比例检验允许你比较两组或更多组观测数据中，具有特定结果或属性（即成功）的观测比例，以判断这些比例是否存在显著差异。该检验的原假设是所有组的成功概率相同，备择假设是所有组的成功概率不全相同。\n\
  \n该检验可应用于一个 n 行两列的列联表，其中两列分别表示成功数与失败数，n 行表示每个分组中的观测数量。\n\n你可以使用 `prop.test` 函数执行比例检验。如果数据已保存为表格对象，可以使用以下命令：\n\
  \n> `prop.test(tableobject)`\n\n为使命令生效，你的表格必须恰好有两列，且表格的行应显示你要比较的不同分组。如果你的表格方向错误，即列显示分组而行显示成功与失败，可以使用\
  \ `t` 函数来转置表格：\n\n> `prop.test(t(tableobject))`\n\n如果你没有表格对象，可以通过将 `table` 函数嵌套在\
  \ `prop.test` 函数内，使用原始数据执行检验：\n\n> `prop.test(table(dataset$groups, dataset$outcome))`\n\
  \n或者，你也可以使用原始计数数据执行检验：\n\n> `prop.test(c(success1, success2), c(n1, n2))`\n\n其中，`success1`\
  \ 和 `success2` 分别是组 1 和组 2 的成功数，`n1` 和 `n2` 分别是组 1 和组 2 的总观测数。\n\n### 示例 6-5：比例检验\n\
  \n考虑表 6-1（见“直接创建表格”部分）中的数据，该表显示了接受活跃治疗或对照治疗后，疾病已解决和未解决的患者数量。如果你仍有 `treattable` 表格对象，可以查看其内容：\n\
  \n> `treattable`\n\n```\n         Disease\nGroup     Resolved Unresolved\n  Active\
  \        15         11\n  Control        8         17\n```\n\n要查看每个治疗组中疾病已解决和未解决的比例，请使用命令：\n\
  \n> `prop.table(treattable, margin=1)`\n\n```\n         Disease\nGroup      Resolved\
  \ Unresolved\n  Active  0.5769231  0.4230769\n  Control 0.3200000  0.6800000\n```\n\
  \n从输出中可以看出，治疗组中疾病已解决的受试者比例为 58%，而对照组为 32%。假设你想使用比例检验来判断这一差异是否显著，或者仅仅是随机变异的结果。将使用显著性水平\
  \ 0.05。\n\n要执行检验，请输入命令：\n\n> `prop.test(treattable)`\n\n或者，你也可以使用原始数据执行检验：\n\n>\
  \ `prop.test(c(15,8), c(26,25))`\n\n这将产生以下输出：\n\n```\n2-sample test for equality\
  \ of proportions with continuity correction\n\ndata:  treattable\nX-squared = 1.6153,\
  \ df = 1, p-value = 0.2038\nalternative hypothesis: two.sided\n95 percent confidence\
  \ interval:\n -0.08963846  0.52348461\nsample estimates:\n   prop 1    prop 2\n\
  0.5769231 0.3600000\n```\n\n从输出中可以看出，p 值为 0.2038，不小于显著性水平 0.05，因此我们不能拒绝原假设，即两个治疗组中疾病已解决的患者比例相同。这意味着没有证据表明活跃治疗与对照治疗在疾病解决概率上存在差异。\n\
  \n### 总结\n\n你应该能够创建频数表和列联表来汇总分类数据，并能根据需要以边际和或百分比形式呈现它们。你应该能够使用卡方拟合优度检验将分类数据与假设分布进行比较。你还应该能够使用卡方关联检验或\
  \ Fisher 精确检验来寻找两个分类变量之间的关联。最后，你应该能够使用检验来比较两个或多个比例。\n\n下表总结了所涵盖的最重要的命令。\n\n| 任务\
  \ | 命令 |\n| --- | --- |\n| 列联表 | `table(dataset$factor1, dataset$factor2)` |\n|\
  \ 紧凑表 | `ftable(tableobject)` |\n| 比例表 | `prop.table(tableobject)` |\n| 含边际的表 |\
  \ `addmargins(tableobject)` |\n| 卡方拟合优度检验 | `chisq.test(tableobject, p=c(p1, p2,\
  \ pN))` `chisq.test(table(dataset$factor1), p=c(p1, p2, pN))` |\n| 卡方关联检验 | `summary(tableobject)`\
  \ `summary(table(dataset$factor1, dataset$factor2))` |\n| Fisher 精确检验 | `fisher.test(tableobject)`\
  \ `fisher.test(dataset$factor1, dataset$factor2)` |\n| 比例检验 | `prop.test(tableobject)`\
  \ `prop.test(table(dataset$groups, dataset$outcome))` |\n\n现在你已经学习了如何汇总连续变量和分类变量，我们可以进入下一章，你将学习概率分布。\n\
  \n"
- '# 7. 概率分布


  本章探讨概率分布主题，例如正态分布、指数分布、二项分布和泊松分布。描述概率分布有多种方式，包括给出其概率密度函数（或离散分布的概率质量函数）、累积分布函数或逆累积分布函数。这些函数的作用类似于一套统计表，因为它们允许你计算给定分布的概率和分位数。


  本章还涵盖随机数生成。随机数允许你模拟数据，这对于在缺乏原始数据时尝试统计技术非常有用。


  你将学习如何：


  - 计算随机变量取给定值或落在给定区间内的概率

  - 找到给定百分比的人口所落在的值范围

  - 生成随机数




  ## R 语言中的概率分布


  R 语言为所有常见概率分布都提供了相应的函数。对于每一种分布，都有以下四种函数：


  -   概率密度函数或概率质量函数（前缀 `d`）对于离散分布，你可以使用概率质量函数来回答诸如“结果等于 x 的概率是多少？”这类问题。

  -   累积分布函数（前缀 `p`）你可以使用累积密度函数来回答诸如“如果我们从给定总体中随机选择一个个体，其值小于 x，或介于 x 和 y 之间的概率是多少？”这类问题。

  -   逆累积分布函数（前缀 `q`）使用逆累积分布函数来回答诸如“百分之 x 的总体成员低于哪个值？”或“百分之 x 的总体成员落在哪个值域范围内？”这类问题。

  -   随机数生成器（前缀 `r`）使用随机数生成器来模拟给定分布的一个随机样本。


  函数名由前缀（`d`、`p`、`q` 或 `r`）和表 7-1 中对应的分布后缀构成。例如，正态分布的累积分布函数称为 `pnorm`，指数分布的随机数生成器称为
  `rexp`。


  **表 7-1.** R 语言内置的标准概率分布。将分布后缀与以下前缀组合：`d` 表示概率密度函数；`p` 表示累积分布函数；`q` 表示逆累积分布函数；`r`
  表示随机数生成器


  | 分布 | 函数后缀 |

  | --- | --- |

  | Beta 分布 | `beta` |

  | 二项分布 | `binom` |

  | 柯西分布 | `cauchy` |

  | 卡方分布 | `chisq` |

  | 指数分布 | `exp` |

  | F 分布 | `f` |

  | 伽马分布 | `gamma` |

  | 几何分布 | `geom` |

  | 超几何分布 | `hyper` |

  | Logistic 分布 | `logis` |

  | 对数正态分布 | `lnorm` |

  | 多项分布 | `multinom` |

  | 负二项分布 | `nbinom` |

  | 正态分布 | `norm` |

  | 泊松分布 | `pois` |

  | 学生 t 分布 | `t` |

  | 均匀分布 | `unif` |

  | 威布尔分布 | `weibull` |


  ### 概率密度函数与累积分布函数


  概率密度函数和累积分布函数是指定随机变量概率分布的两种方式。


  概率密度函数记为 `f(x)`，它给出了随机变量取值等于 x 的相对可能性。曲线下的总面积为 1。


  累积分布函数记为 `F(x)`，它给出了随机变量取值小于或等于 x 的概率。在 x 处的累积分布函数值等于概率密度函数曲线下从负无穷到 x 的面积。累积分布函数的值介于
  0 和 1 之间。


  图 7-1 展示了标准正态分布的概率密度函数和累积分布函数。


  ![A978-1-4842-0139-8_7_Fig1_HTML.jpg](img/A978-1-4842-0139-8_7_Fig1_HTML.jpg)


  **图 7-1.** 标准正态分布的概率密度函数和累积分布函数


  ### 概率密度函数与概率质量函数


  对于离散分布，使用概率质量函数来求结果或观测值等于给定值 x 的概率。函数名由前缀 `d` 与表 7-1 中对应的后缀组合而成。


  使用概率质量函数时，该函数所需的第一个参数始终是感兴趣的潜在结果（x），其后是分布相关的任何参数。你可以使用 `help` 函数查看这些参数。本节中的示例演示了如何使用二项分布和泊松分布的概率质量函数。


  对于连续分布，概率密度函数给出 x 的相对可能性，这没有直接的解释意义。不过，你仍然可以像处理离散分布一样，通过相同的方式找到概率密度函数的值。


  在第 8 章的“绘制函数”部分，你将学习如何使用 `curve` 函数来绘制概率分布的概率密度函数图。


  #### 示例 7-1. 二项分布的概率质量函数


  假设将一个公平的骰子掷 10 次。恰好掷出两次六点的概率是多少？


  你可以使用 `dbinom` 函数来回答这个问题：


  ```

  > dbinom(2, 10, 1/6)

  [1] 0.29071

  ```


  掷出两次六点的概率约为 0.29，即 29%。


  #### 示例 7-2. 泊松分布的概率质量函数


  已知某餐厅某天点龙虾的数量服从平均值为 20 的泊松分布。明天恰好有 18 只龙虾被点到的概率是多少？


  你可以使用 `dpois` 函数来回答这个问题：


  ```

  > dpois(18, 20)

  [1] 0.08439355

  ```


  恰好有 18 只龙虾被点到的概率是 8.4%。


  #### 示例 7-3. 正态分布的概率密度函数


  要找出均值为 5、标准差为 2 的正态分布中，`x = 2.5` 处的概率密度函数值，可以使用以下命令：


  ```

  > dnorm(2.5, mean=5, sd=2)

  [1] 0.09132454

  ```


  在 `x = 2.5` 处的概率密度函数值为 0.091。




  ## 查找概率


  要计算从总体中随机选取的一个成员其值小于或等于给定值 `x` 的概率，请使用相应分布的累积分布函数（`cdf`）。该函数的名称由前缀 `p` 与表 7-1 中的相关后缀组合而成。


  对于正态分布，请使用 `pnorm` 函数。对于标准正态分布（均值为 0，标准差为 1），该函数无需任何额外参数。例如，要计算随机选取的值小于或等于 2.5 的概率，请使用命令：


  ```

  > pnorm(2.5)

  [1] 0.9937903

  ```


  从输出中可以看到，概率为 0.9937903，约等于 99%。


  要计算非标准正态分布的概率，请添加 `mean` 和 `sd` 参数。例如，如果一个随机变量已知服从均值为 5、标准差为 2 的正态分布，并且你想计算随机选取的一个成员其值不超过
  6 的概率，请使用命令：


  ```

  > pnorm(6, mean=5, sd=2)

  [1] 0.6914625

  ```


  要计算值大于 6 的互补概率，请将 `lower.tail` 参数设置为 `F`：


  ```

  > pnorm(6, 5, 2, lower.tail=F)

  [1] 0.3085375

  ```


  这等同于命令：


  ```

  > 1-pnorm(6, 5, 2)

  [1] 0.3085375

  ```


  你可以通过将 `norm` 替换为表 7-1 中相关分布的后缀，来计算其他分布的概率。你还需要根据分布的参数更改 `mean` 和 `sd` 参数。使用 `help`
  函数检查所使用函数的参数。


  **示例 7-4. 查找正态分布的概率**


  假设英国男性的身高已知服从均值为 177 厘米、标准差为 10 厘米的正态分布。如果你从英国男性人口中随机选取一名男性，他身高超过 200 厘米的概率是多少？


  要回答这个问题，请使用命令：


  ```

  > pnorm(200, 177, 10, lower.tail=F)

  [1] 0.01072411

  ```


  从输出中可以看到，概率约为 0.011，即 1.1%。


  他身高低于 150 厘米的概率是多少？


  ```

  > pnorm(150, 177, 10)

  [1] 0.003466974

  ```


  概率为 0.0035，即 0.35%。


  **示例 7-5. 查找二项分布的概率**


  如果你掷一个公平的六面骰子 100 次，掷出 6 的次数不超过 10 次的概率是多少？


  100 次掷骰子中掷出 6 的次数服从二项分布，因此你可以使用 `pbinom` 函数来回答这个问题：


  ```

  > pbinom(10, 100, 1/6)

  [1] 0.04269568

  ```


  从输出中可以看到，掷出不超过 10 次 6 的概率为 0.043（4.3%）。


  掷出 6 的次数超过 20 次的概率是多少？


  ```

  > pbinom(20, 100, 1/6, lower.tail=F)

  [1] 0.1518878

  ```


  掷出超过 20 次 6 的概率约为 0.15，即 15%。


  **示例 7-6. 查找指数分布的概率**


  某种特定类型的电子设备的故障时间已知服从指数分布，平均故障时间为 24 个月。随机选取的一台设备在前 6 个月内发生故障的概率是多少？


  你可以使用 `pexp` 函数来回答这个问题：


  ```

  > pexp(6, 1/24)

  [1] 0.2211992

  ```


  六个月内发生故障的概率为 0.22（22%）。


  随机选取的一台设备无故障使用超过 5 年（60 个月）的概率是多少？


  ```

  > pexp(60, 1/24, lower.tail=F)

  [1] 0.082085

  ```


  它使用超过 5 年的概率约为 0.08，即 8%。


  ## 查找分位数


  要查找总体中给定百分比的值高于或低于的数值，或者总体中给定百分比的值所在的范围，请使用相应分布的逆 `cdf`。该函数的名称由前缀 `q` 与表 7-1 中的相关后缀组合而成。


  要查找正态分布的分位数，请使用 `qnorm` 函数。对于标准正态分布，使用该函数时无需任何额外参数。例如，要查找 95% 的值低于该数值的值，请使用命令：


  ```

  > qnorm(0.95)

  [1] 1.644854

  ```


  对于非标准正态分布，请使用 `mean` 和 `sd` 参数来指定分布的参数。例如，假设一个变量已知服从均值为 5、标准差为 2 的正态分布。要查找总体中 95%
  的值低于该数值的值，请使用命令：


  ```

  > qnorm(0.95, mean=5, sd=2)

  [1] 8.289707

  ```


  要查找总体中 95% 的值高于该数值的值，请将 `lower.tail` 参数设置为 `F`：


  ```

  > qnorm(0.95, 5, 2, lower.tail=F)

  [1] 1.710293

  ```


  对于其他标准概率分布，你必须将 `mean` 和 `sd` 参数替换为你所使用的分布相关的其他参数。使用 `help` 函数查看这些参数是什么。


  **示例 7-7. 查找正态分布的分位数**


  一家生产特殊型号均码手套的制造商希望设计的手套至少能适合 99% 的人口。已知手掌宽度服从均值为 195 毫米、标准差为 17 毫米的正态分布。手套需要适应的手掌宽度范围是多少？


  要查找 0.5% 的人口低于该数值的值，请使用命令：


  ```

  > qnorm(0.005, 195, 17)

  [1] 151.2109

  ```


  类似地，要查找 0.5% 的人口高于该数值的值，请使用命令：


  ```

  > qnorm(0.005, 195, 17, lower.tail=F)

  [1] 238.7891

  ```


  剩下的 99% 的人口位于这两个值之间。因此，为了适应 99% 的人口，手套必须设计成能适应手掌宽度在 151 毫米到 239 毫米之间的手。


  **示例 7-8. 查找指数分布的分位数**


  某种特定类型的电子设备的故障时间已知服从指数分布，平均故障时间为 24 个月。多少个月后，将有 40% 的设备已经发生故障？


  要查找 40% 的设备会发生故障的时间长度，请使用命令：


  ```

  > qexp(0.4, 1/24)

  [1] 12.25981

  ```


  因此，40% 的设备将在 12.3 个月内发生故障。


  **示例 7-9. 查找泊松分布的分位数**


  某餐厅某日点的龙虾数量已知服从均值为 20 的泊松分布。如果经理希望至少能在 80% 的日子里满足所有龙虾订单，他们每天应该订购多少只龙虾？


  要查找在 80% 的日子里不会超过的龙虾订单数量，请使用命令：


  ```

  > qpois(0.8, 20)

  [1] 24

  ```


  每天订购 24 只龙虾，该餐厅将能在至少 80% 的日子里满足所有龙虾订单。



