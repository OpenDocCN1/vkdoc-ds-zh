  22    0.56      158     untreated

  23    1.10      160     untreated

  ```


  该数据集有三个变量，分别名为 `conc`、`rate` 和 `state`，包含 23 个观测值。


  了解如何引用数据框的不同组成部分非常重要。要通过名称引用数据集中的特定变量，可以使用美元符号（`$`）：


  ```

  > Puromycin$rate

  [1]  76  47  97 107 123 139 159 152 191 201 207 200  67  51  84  86  98 115 131

  [20] 124 144 158 160

  ```


  这很有用，因为它允许你将函数应用于该变量，例如，计算 `rate` 变量的平均值：


  ```

  > mean(Puromycin$rate)

  [1] 126.8261

  ```


  除了使用美元符号按名称选择变量外，你还可以使用中括号表示法来引用数据框的各个部分。中括号表示法可以被视为数据框的坐标系统。你在方括号内提供行号和列号：


  ```

  > dataset[ r , c ]

  ```


  例如，要使用中括号表示法选择 `Puromycin` 数据集第二列第六行的值，请使用命令：


  ```

  > Puromycin[6,2]

  [1] 139

