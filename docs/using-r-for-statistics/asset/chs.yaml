  \n**献词**\n\n**关于作者**\n\n![A978-1-4842-0139-8_BookFrontmatter_Fig1_HTML.jpg](img/A978-1-4842-0139-8_BookFrontmatter_Fig1_HTML.jpg)\n\
  \nSarah Stowell 是一位常驻英国的合同统计学家，曾与三菱制药欧洲公司、MDSL International 和葛兰素史克合作。她拥有统计学硕士学位。\n\
  \n**关于技术审校**\n\nLarry Pace 博士是一位统计学作家、教育工作者和顾问。他居住在南卡罗来纳州北部安德森市。他是统计学、数学、心理学、管理和领导力教授。他使用多种语言和脚本语言进行编程，包括\
  \ R、Visual Basic、JavaScript、C##、PHP、APL，以及在久远的过去使用过的 Fortran IV。他撰写关于统计学、计算机和技术的书籍和教程。他还发表了许多学术论文，并进行了数十次演示和讲座。他曾为康柏电脑、AT&T、施乐公司、美国海军和国际纸业提供咨询。他曾在凯泽大学、阿戈西大学、卡佩拉大学、阿什福德大学、安德森大学（他曾担任行为科学系主任）、克莱姆森大学、路易斯安那理工大学、路易斯安那州立大学什里夫波特分校、田纳西大学、康奈尔大学、罗切斯特理工学院、伦斯勒理工学院和佐治亚大学任教。\n\
  \n## 引言\n\n欢迎阅读《使用 R 进行统计》。本书是为任何希望使用 R 进行数据分析和创建统计图表的人编写的。它适合那些对 R 经验较少或没有经验的人，旨在让您快速上手并运行，而无需学习所有编程细节。\n\
  \n### 关于 R\n\nR 是一个统计分析和图形环境，也是一种编程语言。它由命令驱动，与商业化的 S-Plus®软件非常相似。R 以其专业外观的图形而闻名，这些图形允许完全自定义。\n\
  \nR 是开源软件，可根据 GNU 通用公共许可证免费安装。它由一群被称为 R 核心团队的志愿者编写和维护。\n\n基础软件由全球 R 用户开发的超过 5,000\
  \ 个附加包补充，其中许多用户属于学术界。这些包涵盖了广泛的统计技术，包括一些最新开发的和特定用途的技术。任何人都可以贡献附加包，这些包在添加到集合之前会经过质量检查。\n\
  \n在撰写本文时，R 的当前版本是 3.1.0。\n\n### 你将学到什么\n\n本书旨在为在 R 中执行流行的统计方法提供直接、实用的指导。仅简要探讨 R\
  \ 的编程方面。\n\n阅读本书后，你将能够：\n\n- 导航 R 系统\n- 输入和导入数据\n- 操作数据集\n- 计算汇总统计量\n- 创建统计图表并自定义其外观\n\
  - 执行假设检验，如 t 检验和方差分析\n- 构建回归模型\n- 通过使用附加包访问额外功能\n- 创建自己的函数\n\n\n\n## 预备知识\n\n尽管本书包含对统计学方法的简要说明及使用示例，但本书并非旨在教授统计学。因此，你需要具备一定的先前知识。你应该能够根据自身目的选择最合适的统计方法，并解读分析结果。同时，你也需要对常见的统计术语和概念有所了解。如果你对自己正在使用的任何方法没有把握，建议将本书与更详细的统计学书籍配合使用。\n\
  \n本书不要求读者具备`R`语言或编程知识，因此对于更习惯使用点击式软件包的用户来说十分理想。你只需具备基本的计算机技能并熟悉自己的操作系统即可。\n\n##\
  \ 本书约定\n\n本书采用以下排版约定：\n\n*   等宽字体用于区分所有`R`命令及其输出与正文内容。\n*   标准等宽字体用于内置`R`函数名、参数名、语法、特定数据集和变量名，以及可直接逐字复制的命令其他部分。\n\
  *   斜体等宽字体用于通用数据集和变量名，以及需替换为用户自定义值的命令其他部分。\n*   由于页面宽度限制，有时无法在一行内完整显示命令。此时，命令将在下一行继续并以缩进形式呈现。遇到这种情况，你仍应在控制台中作为单行输入。\n\
  *   与正文分离的文本框包含对统计理论或方法的提示。\n*   实操示例将以独立的编号章节呈现。\n\n## 本书使用的数据集\n\n`R`附带大量示例数据集，打开软件后即可使用。本书将使用其中若干数据集进行演示说明。\n\
  \n此外，全书还使用了其他一些数据集，详情见附录 C。这些数据集可在[`www.apress.com/9781484201404`](http://www.apress.com/9781484201404)下载。\n\
  \n## 联系作者\n\n如果你有任何建议或反馈，我期待你的来信。你可以发送邮件至`'s.stowell@instantr.com'`与我联系。\n\n## 致谢\n\
  \n首先，我要感谢 Apress 团队，特别是：首席编辑 Steve Anglin，他让我有机会与 Apress 合作；协调编辑 Anamika Panchoo\
  \ 和 Mark Powers，他们让我按时推进工作；发展编辑 Chris Nelson，他教会了我很多写作技巧；技术编辑 Larry Pace，他为提升本书质量提出了许多宝贵建议；以及许多我未曾谋面但亲眼见证他们为成品付出巨大努力的其他成员。\n\
  \n我还要感谢为示例提供数据的 Andrés Barnett、James Sedgwick 和 Therese Stukel，以及我的丈夫 Timothy Baldock\
  \ 和朋友们——Jemma-Kay Johnstone、Christopher Gilmour、Nina Farrell、Chris Brown、Artur Kyral\
  \ 和 Eddie Chung，他们在项目初期提供了各种帮助。\n\n\n\n"
