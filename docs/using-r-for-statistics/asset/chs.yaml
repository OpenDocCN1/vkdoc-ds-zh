  > **注意：** 有关绘图符号的更多信息，请输入命令`help(points)`。


  或者，您可以选择任何单个键盘字符作为绘图符号，只需将其放在引号内，如下所示（以美元符号为例）：


  ```

  > plot(dataset$variable, pch="$")

  ```


  您可以使用`cex`参数调整绘图符号的大小。该大小是相对于正常大小指定的。例如，要使绘图符号大小变为正常的 5 倍，请使用以下命令：


  ```

  > plot(dataset$variable, cex=5)

  ```


  ## 绘图线条


  本节仅适用于包含线条的绘图，例如使用`plot`函数创建且`type`参数设置为使用线条的选项（如`"l"`或`"b"`）的散点图和基本绘图。它也适用于向现有绘图添加额外线条的函数，例如`abline`、`curve`、`segments`和`lines`，这些将在本章后面的“向绘图添加项目”和“叠加绘图”部分中介绍。


  您可以使用`lty`参数更改线条类型。数字 1 到 6 对应表 9-5 中给出的线条类型。


  **表 9-5.** 绘图线条类型


  | 数字 | 名称 | 线条样式 |

  | --- | --- | --- |

  | 1 | `solid` | ![A978-1-4842-0139-8_9_Figz_HTML.jpg](img/A978-1-4842-0139-8_9_Figz_HTML.jpg)
  |

  | 2 | `dashed` | ![A978-1-4842-0139-8_9_Figaa_HTML.jpg](img/A978-1-4842-0139-8_9_Figaa_HTML.jpg)
  |

  | 3 | `dotted` | ![A978-1-4842-0139-8_9_Figab_HTML.jpg](img/A978-1-4842-0139-8_9_Figab_HTML.jpg)
  |

  | 4 | `dotdash` | ![A978-1-4842-0139-8_9_Figac_HTML.jpg](img/A978-1-4842-0139-8_9_Figac_HTML.jpg)
  |

  | 5 | `longdash` | ![A978-1-4842-0139-8_9_Figad_HTML.jpg](img/A978-1-4842-0139-8_9_Figad_HTML.jpg)
  |

  | 6 | `twodash` | ![A978-1-4842-0139-8_9_Figae_HTML.jpg](img/A978-1-4842-0139-8_9_Figae_HTML.jpg)
  |


  例如，您可以将线条类型更改为虚线：


  ```

  > plot(dataset$variable, type="l", lty=2)

  ```


  您也可以按名称选择线条类型：


  ```

  > plot(dataset$variable, type="l", lty="dashed")

  ```


  您可以使用`lwd`参数调整线条的粗细。线条粗细是相对于标准线条粗细指定的。例如，要使线条粗细变为通常的 3 倍，请使用以下命令：


  ```

  > plot(dataset$variable, type="l", lwd=3)

  ```


  ##### 阴影区域


  本节仅适用于具有阴影区域的绘图，例如条形图、饼图和直方图。


  阴影区域的密度是指用于阴影的每英寸线条数。您可以使用`density`参数更改阴影区域的密度，并使用`angle`参数更改阴影的角度：


  ```

  > barplot(tableobject, density=20, angle=30)

  ```


  作为参考，密度值在 5 到 80 之间会产生可辨别的变化，而值为 150 则与纯色无法区分。


  您也可以提供一个密度列表，R 会使用列表中的不同密度来为饼图或条形图的每个部分添加阴影。图 9-5 展示了以下代码的结果：


  ```

  > pie(table(people2$Eye.Color), density=c(10, 20, 40))

  ```


  ![A978-1-4842-0139-8_9_Fig5_HTML.jpg](img/A978-1-4842-0139-8_9_Fig5_HTML.jpg)


  **图 9-5.** 每个类别具有不同阴影密度的饼图


  ## 向绘图添加项目


  本节介绍一些向绘图添加额外项目的函数。您可以将它们与任何类型的绘图一起使用。首先，使用`plot`或另一个绘图函数创建绘图。当绘图仍显示在图形设备中时，输入本节中的相关命令。该项目将添加到当前绘图中。


  ### 添加直线


  您可以使用`abline`函数向绘图添加直线。


  要在 x=5 处添加一条垂直线，请使用以下命令：


  ```

  > abline(v=5)

  ```


  要在 y=2 处添加一条水平线，请使用：


  ```

  > abline(h=2)

  ```


  要添加一条截距为 2、斜率为 3 的对角线（即直线 y=2+3x），请使用以下命令：


  ```

  > abline(a=2, b=3)

  ```


  要绘制一条线段（从一个点延伸到另一个点的线），请使用`segments`函数。例如，下面的命令绘制一条从坐标(12, 20)到坐标(18, 55)的直线：


  ```

  > segments(12,20,18,55)

  ```


  结果如图 9-6 所示。


  ![A978-1-4842-0139-8_9_Fig6_HTML.jpg](img/A978-1-4842-0139-8_9_Fig6_HTML.jpg)


  **图 9-6.** 添加了线段后的绘图


  您可以使用`col`、`lty`和`lwd`参数更改线条的颜色、类型和粗细，如本章前面所述。


  ### 添加数学函数曲线


  要添加数学函数曲线到您的绘图，请使用`curve`函数（在第 8 章的“绘制函数”下介绍）。默认情况下，`curve`函数会创建一个新绘图。要将曲线叠加到当前绘图上，请将`add`参数设置为`T`：


  ```

  > curve(x², add=T)

  ```




  ### 添加标签与文本


  你可以使用 `text` 函数向绘图添加文本。例如，要在坐标 (3, 4) 处居中添加文本"Text String"，请使用以下命令：


  `> text(3, 4, "Text String")`


  **注意：** 如果需要知道绘图上某个位置的坐标，`locator` 函数可以为你提供这些信息。当图形显示在图形设备中时，请输入以下命令：


  `> locator(1)`


  R 将等待你使用鼠标指针在图形设备中选择一个位置，然后返回所选位置的坐标。


  你可以使用 `family`、`font`、`cex` 和 `col` 参数调整文本的外观。例如，要添加一个红色、斜体且大小为默认大小两倍的文本，请使用以下命令：


  `> text(3, 4, "Text String", col="red", font=3, cex=2)`


  如果你想使用来自第三个变量或数据集行名的文本为散点图中的所有点添加标签，`text` 函数会非常有用。例如，以下命令创建了一个人均 GDP 与城市人口的散点图，每个观测点都使用国家名称进行标记（使用了第
  4 章中"Appending Rows"部分展示的`CIAdata`数据集）：


  ```

  > plot(pcGDP～urban, CIAdata, xlim=c(50, 100), ylim=c(0,40000))

  > text(pcGDP～urban, CIAdata, CIAdata$country, pos=1)

  ```


  图 9-7 显示了结果。


  ![A978-1-4842-0139-8_9_Fig7_HTML.jpg](img/A978-1-4842-0139-8_9_Fig7_HTML.jpg)


  **图 9-7.** 使用 `text` 函数添加标签的结果


  `pos` 参数告诉 R 标签相对于坐标的位置：1 表示下方；2 表示左侧；3 表示上方；4 表示右侧。你也可以使用 `offset` 参数调整坐标与标签之间的距离（相对于字符宽度）。下面的命令创建了图
  9-8 所示的结果。


  `> text(pcGDP～urban, CIAdata, CIAdata$country, pos=4, offset=0.3)`


  ![A978-1-4842-0139-8_9_Fig8_HTML.jpg](img/A978-1-4842-0139-8_9_Fig8_HTML.jpg)


  **图 9-8.** 文本位于数据点右侧的绘图


  如果你只想标记几个特定的数据点（例如任何异常值），可以在绘图函数后使用 `identify` 函数：


  ```

  > plot(pcGDP～urban, CIAdata, xlim=c(50, 100), ylim=c(0,40000))

  > identify(CIAdata$urban, CIAdata$pcGDP, label=CIAdata$country)

  ```


  输入命令后，R 将允许你使用鼠标指针在绘图上选择点，并标记你所选择的任何点。选择完所有要标记的点后，请按 Esc 键。


  ## 添加网格


  要为绘图添加网格（如图 9-9 所示），请使用 `grid` 函数：


  `> grid()`


  ![A978-1-4842-0139-8_9_Fig9_HTML.jpg](img/A978-1-4842-0139-8_9_Fig9_HTML.jpg)


  **图 9-9.** 带有网格线的绘图


  默认情况下，网格线与坐标轴刻度标记对齐。或者，你可以指定每个坐标轴上显示的网格线数量：


  `> grid(3, 3)`


  要仅添加水平网格线（如图 9-10 所示），请使用以下命令：


  `> grid(nx=NA, ny=NULL)`


  ![A978-1-4842-0139-8_9_Fig10_HTML.jpg](img/A978-1-4842-0139-8_9_Fig10_HTML.jpg)


  **图 9-10.** 带有水平网格线的绘图


  要仅添加垂直网格线，请使用：


  `> grid(ny=NA)`


  默认情况下，R 使用灰色虚线作为网格线，但你可以使用 `col`、`lty` 和 `lwd` 参数调整线型，如本章前面所述。


  ## 添加箭头


  你可以使用 `arrows` 函数向当前绘图添加箭头。例如，要绘制一个从点 (10, 50) 指向点 (12.7, 35) 的箭头，请使用以下命令：


  `> arrows(10,50,12.7,35)`


  结果如图 9-11 所示。


  ![A978-1-4842-0139-8_9_Fig11_HTML.jpg](img/A978-1-4842-0139-8_9_Fig11_HTML.jpg)


  **图 9-11.** 带有箭头的绘图


  对于双端箭头，请将 `code` 参数设置为 `3`：


  `> arrows(10,50,12.7,35, code=3)`


  你可以使用 `col`、`lty` 和 `lwd` 调整线型，如本章前面所述。你可以使用 `length` 参数指定箭头头的长度（以英寸为单位），并使用 `angle`
  参数指定箭头头与箭身之间的角度（以度为单位）。以下命令添加了图 9-12 所示的箭头：


  `> arrows(10,50,12.7,35, angle=25, length=0.1)`


  ![A978-1-4842-0139-8_9_Fig12_HTML.jpg](img/A978-1-4842-0139-8_9_Fig12_HTML.jpg)


  **图 9-12.** 包含调整后箭头头的绘图




  ## 叠加图


  R 语言中有两个函数，`points` 和 `lines`，允许你将一组数据值叠加在另一组之上。


  `points` 函数与 `plot` 函数非常相似。不过，它不会创建新图，而是将数据点添加到当前在图形设备中显示的图形上。`lines` 函数与 `points`
  函数非常相似，区别在于它使用线而不是符号来绘制数据（即，`type` 参数的默认值是 `"l"`）。


  当你希望在同一坐标轴上绘制两个或多个变量（如示例 9-1 所示），或使用不同的绘图符号来表示不同类别时（如示例 9-2 所示），这些函数非常有用。


  ### 示例 9-1. 使用 `fiveyearreport` 数据的叠加图


  考虑图 9-13 中显示的 `fiveyearreport` 数据集，该数据集给出了三家超市连锁店在五年期间内的英国销售额。假设你想在同一张图中显示 Tesco、Sainsburys
  和 Morrisons 的销售数据。


  ![A978-1-4842-0139-8_9_Fig13_HTML.jpg](img/A978-1-4842-0139-8_9_Fig13_HTML.jpg)


  图 9-13. `fiveyearreport` 数据集（更多详情见附录 C）


  要创建此图，首先按常规方式绘制 Tesco 的数据，确保设置好坐标轴范围，使其足够宽以容纳 Sainsburys 和 Morrisons 的数据：


  ```

  > plot(Tesco∼Year, fiveyearreport, type="b", ylab="英国销售额（百万英镑）", ylim=c(0, 50000))

  ```


  一旦图形在图形设备中显示，你就可以使用 `lines` 函数添加 Sainsburys 和 Morrisons 的数据，该函数会将数据叠加到当前图形上。使用 `pch`
  和 `lty` 参数来更改符号和线型，以便区分不同连锁店的数据。或者，你也可以使用 `col` 参数为每个连锁店赋予不同的颜色：


  ```

  > lines(Sainsburys∼Year, fiveyearreport, type="b", pch=2, lty=2)

  > lines(Morrisons∼Year, fiveyearreport, type="b", pch=3, lty=3)

  ```


  图 9-14 显示了结果。该图需要一个图例来标识各个连锁店，你可以使用 `legend` 函数添加图例，具体说明见“添加图例”部分。


  ![A978-1-4842-0139-8_9_Fig14_HTML.jpg](img/A978-1-4842-0139-8_9_Fig14_HTML.jpg)


  图 9-14. `fiveyearreport` 数据集的叠加图


  ### 示例 9-2. 使用 `iris` 数据的叠加图


  假设你想为 `iris` 数据创建一个花萼长度与花萼宽度的散点图，并使用不同的绘图符号来代表每种鸢尾花品种。要创建此图，你需要使用 `points` 函数分别绘制每个品种的数据，并将它们叠加到同一张图上。


  首先使用 `plot` 函数绘制原始（完整）数据，并添加你需要的任何标签或标题。将 `type` 参数设置为 `"n"`，以防止数据值被添加到图形中。这将创建一个空的坐标轴，其大小恰好能容纳所有三个品种的全部数据：


  ```

  > plot(Sepal.Length∼Sepal.Width, iris, type="n")

  ```


  接下来，使用 `points` 函数分别绘制每个品种的数据。使用 `subset` 参数依次选择每个品种。使用 `pch` 参数为每个品种选择不同的绘图符号。或者，你也可以使用
  `col` 参数为每个品种赋予不同颜色的符号：


  ```

  > points(Sepal.Length∼Sepal.Width, iris, subset=Species=="setosa", pch=10)

  > points(Sepal.Length∼Sepal.Width, iris, subset=Species=="versicolor", pch=16)

  > points(Sepal.Length∼Sepal.Width, iris, subset=Species=="virginica", pch=1)

  ```


  结果如图 9-15 所示。图例使用 `legend` 函数添加，具体说明见下一节。


  ![A978-1-4842-0139-8_9_Fig15_HTML.jpg](img/A978-1-4842-0139-8_9_Fig15_HTML.jpg)


  图 9-15. `iris` 数据集的叠加图


  ## 添加图例


  你可以使用 `legend` 函数为图形添加图例。该函数会将图例添加到当前在图形设备中显示的图形上。


  以下命令创建了图 9-15 中显示的图例：


  ```

  > legend(3.7, 7, legend=c("Setosa", "Versicolor", "Virginica"), pch=c(10, 16, 1))

  ```


  前两个参数（`3.7` 和 `7`）是图例左上角的 x 和 y 坐标。除了使用坐标，还有其他两种方式来指定图例的位置。第一种是使用位置名称之一：`"top"`、`"bottom"`、`"left"`、`"right"`、`"center"`、`"topright"`、`"topleft"`、`"bottomright"`
  或 `"bottomleft"`。以下命令将图例定位在图形的右上角：


  ```

  > legend("topright", legend=c("Setosa", "Versicolor", "Virginica"), pch=c(10, 16,
  1))

  ```


  第二种是使用 `locator(1)`。这允许你通过鼠标手动选择图例左上角的位置：


  ```

  > legend(locator(1), legend=c("Setosa", "Versicolor", "Virginica"), pch=c(10, 16,
  1))

  ```


  `legend` 参数给出要在图例上显示的标签。`pch` 参数给出与每个标签对应的绘图符号。


  你可以根据图形的具体情况，用 `lty`、`lwd`、`col`、`cex`、`fill`、`density` 或 `angle` 参数替换 `pch` 参数。你可能需要使用其中两个或多个参数。


  请注意，你不需要使用 `legend` 函数为条形图添加图例，因为 `barplot` 函数内置了图例选项（参见 第 8 章 中的“条形图”）。


  ### 示例 9-3. 图例类型与效果


  以下三个示例演示了如何创建一些不同类型的图例。结果如图 9-16 所示。接着我们将看另一个示例，演示如何显示跨越多个列的图例（如图 9-17 所示）。


  #### 显示不同密度阴影区域的图例


  要创建如图 9-16a 所示的、用于不同密度阴影区域的图例，请使用以下命令：


  ```

  > legend(locator(1), legend=c("标签 1", "标签 2", "标签 3"), density=c(10,20,40))

  ```


  #### 显示不同线型和符号类型的图例


  要创建如图 9-16b 所示的、用于不同线型和符号类型的图例，请使用以下命令：


  ```

  > legend(locator(1), legend=c("标签 1", "标签 2", "标签 3"), lty=1:3, pch=1:3)

  ```


  #### 具有不同颜色和类型线条的图例


  要创建如图 9-16c 所示的、用于不同类型和颜色线条的图例，请使用以下命令：


  ```

  > legend(locator(1), legend=c("标签 1", "标签 2", "标签 3"), col=c("black", "grey40",
  "grey70"), lty=1:3)

  ```


  ![A978-1-4842-0139-8_9_Fig16_HTML.jpg](img/A978-1-4842-0139-8_9_Fig16_HTML.jpg)


  图 9-16. 不同类型的图例


  #### 跨越多列的图例


  要显示跨越多列的图例，请使用 `ncol` 参数指定列数。以下命令创建了一个两列的图例，如图 9-17 所示：


  ```

  > legend(x, y, legend=c("标签 1", "标签 2", "标签 3"), lty=c(1,2,3), ncol=2)

  ```


  ![A978-1-4842-0139-8_9_Fig17_HTML.jpg](img/A978-1-4842-0139-8_9_Fig17_HTML.jpg)


  图 9-17. 两列图例




  ## 绘图区域中的多图


  除了创建单个图形外，R 还允许你创建一个由多个较小图形组成的图像，这些图形以网格形式排列。


  要设置图形设备以显示多个图形，请使用以下命令：


  `> par(mfrow=c(R, C))`


  其中 `R` 和 `C` 是网格的行数和列数。你随后创建的任何图形将按从左到右的顺序填充第一行的位置，接着是第二行，以此类推。


  例如，要将四个图形排列成一个两行两列的网格，请使用以下命令：


  `> par(mfrow=c(2,2))`


  然后，你可以创建最多四个任意类型的图形来填充每个位置，如图 9-18 所示：


  ```

  > hist(iris$Sepal.Length)

  > qqnorm(iris$Sepal.Length)

  > pie(summary(iris$Species))

  > plot(Petal.Length~Sepal.Length, iris)

  ```


  ![A978-1-4842-0139-8_9_Fig18_HTML.jpg](img/A978-1-4842-0139-8_9_Fig18_HTML.jpg)


  图 9-18. 多图


  当你创建第五个图形时，将会开始一个新图像。图形设备将在本次会话的剩余时间内继续显示多图，或者直到你使用以下命令恢复原状：


  `> par(mfrow=c(1,1))`


  ## 更改默认绘图设置


  到目前为止，本章已经解释了如何对特定图形进行修改。然而，你可能希望更改设置，使其应用于所有图形。


  `par` 函数允许你更改默认的绘图样式。例如，要将默认绘图符号改为三角形，并将默认标题颜色改为红色，请使用以下命令：


  `> par(pch=2, col.main="red")`


  你随后创建的任何图形都将具有红色的标题文本，并使用三角形作为绘图符号（如果适用）。这些更改将在本次会话的剩余时间内生效，或者直到它们被覆盖。


  R 允许对图形的几乎每个方面进行自定义。输入命令 `help(par)` 可查看完整的设置列表。一些不能通过 `par` 函数更改的参数包括 `main`、`sub`、`xlab`、`ylab`、`xlim`
  和 `ylim`，这些参数仅适用于单个图形。


  ### 总结


  现在，你应该能够通过添加适当的标题、标签、文本、图例和其他元素，使你的图形更具信息性。你还应该能够通过调整线条和符号的颜色、样式等方面，使图形在视觉上更具吸引力。如有必要，你应该能够将多组数据叠加到一张图形上，或将多个图形显示在一张图像中。


  下表总结了本章介绍的最重要的参数和命令。


  | 任务 | 参数或命令 |

  | --- | --- |

  | 添加标题 | `main="标题文本"` |

  | 添加副标题 | `sub="副标题文本"` |

  | 添加坐标轴标签 | `xlab="X 轴标签", ylab="Y 轴标签"` |

  | 更改坐标轴范围 | `xlim=c(x 最小值, x 最大值), ylim=c(y 最小值, y 最大值)` |

  | 更改绘图颜色 | `col="red"` |

  | 更改绘图符号 | `pch=2` |

  | 更改绘图符号大小 | `cex=2` |

  | 更改线条类型 | `lty=2` |

  | 更改线条宽度 | `lwd=2` |

  | 更改阴影密度 | `density=20` |

  | 向图形添加垂直线 | `abline(v=2)` |

  | 向图形添加水平线 | `abline(h=2)` |

  | 向图形添加直线 | `abline(a=截距, b=斜率)` |

  | 向图形添加线段 | `segments(x1, y1, x2, y2)` |

  | 向图形添加曲线 | `curve(x³, add=T)` |

  | 向图形添加文本 | `text(x, y, "文本字符串")` |

  | 向图形添加网格 | `grid()` |

  | 向图形添加箭头 | `arrows(x1, y1, x2, y2)` |

  | 向图形添加点 | `points(dataset$variable)` |

  | 向图形添加线 | `lines(dataset$variable)` |

  | 向图形添加图例 | `legend(x, y, legend=c("标签 1", "标签 2", "标签 3"), ...)` |

  | 显示多个图形 | `par(mfrow=c(行数, 列数))` |

  | 更改默认绘图设置 | `par(...)` |


  在下一章中，我们将告别绘图，转而讨论假设检验。


  '
- "# 10. 假设检验\n\n假设检验非常有用，因为它允许你利用数据作为证据来支持或反驳某个论断，并帮助你做出决策。本章将解释如何执行一些最常用的假设检验类型。\n\
  \n本章讨论的大多数检验用于比较样本均值，但我们也会讨论比较样本方差的检验。涵盖参数检验和非参数检验。参数检验对数据的分布做出一些假设，通常假设数据遵循正态分布。非参数检验不做此类假设，因此适用于更广泛的情况。\n\
  \n你将学习如何：\n\n- 使用 t 检验比较两个样本的均值，或将一个样本与一个固定值进行比较\n- 执行 Wilcoxon 秩和检验（t 检验的非参数替代方法）\n\
  - 使用方差分析比较三个或更多样本的均值\n- 执行 Kruskal-Wallis 检验（方差分析的非参数替代方法）\n- 使用多重比较方法（如 Tukey 的\
  \ HSD、Bonferroni 和成对 Wilcoxon 秩和检验）进行成对比较\n- 使用 F 检验或 Bartlett 检验比较两个或多个样本的方差\n\n\
  其他章节也涵盖了几种假设检验。相关性假设检验以及用于检验分布拟合的 Shapiro-Wilk 检验和 Kolmogorov-Smirnov 检验在第 5 章中讨论。用于分类数据的检验（如卡方检验和\
  \ Fisher 检验）可在第 6 章中找到。\n\n本章使用 `iris`、`PlantGrowth` 和 `sleep` 数据集（包含在 R 中）以及 `bottles`、`brains`\
  \ 和 `grades1` 数据集（随本书的下载文件提供）。要查看 R 自带数据集的更多详细信息，请输入 `help(datasetname)`。有关所有其他数据集的更多详细信息，请参阅附录\
  \ C。\n\n**假设检验**\n\n假设检验利用样本来检验关于该样本所来自总体的假设。这有助于你对总体做出决策或得出结论。一个假设检验包含以下组成部分：\n\
  \n- **零假设**（记为 `H[0]`）是关于一个或多个样本所来自总体的假设。它通常是关于一个未知参数（如总体均值或方差）值的假设，例如 `H[0]`：总体均值等于\
  \ 5。除非被证明为假，否则接受零假设。\n\n- **备择假设**（记为 `H[1]` 或 `H[A]`）是当有足够证据拒绝零假设时将被接受的假设。这通常是零假设的反面，例如\
  \ `H[1]`：总体均值不等于 5。\n\n- **检验统计量**是根据样本值计算出的统计量，其在零假设下具有已知分布。它因检验类型而异，且没有直接的解释意义。\n\
  \n- **p 值**给出了在假定零假设为真的情况下，观察到当前检验统计量或更极端结果的概率。如果这个值非常小，则表明零假设不可行，从而为支持备择假设提供了证据。\n\
  \n- **显著性水平**（记为 `α`）是决定拒绝零假设的临界点。显著性水平应在开始检验前确定。通常使用显著性水平 `0.05`，但 `0.01` 和 `0.1`\
  \ 也是常用的选择。如果使用显著性水平 `0.05`，则只有当 p 值小于 `0.05` 时，我们才拒绝零假设，转而支持备择假设。否则，不做出任何结论。选择显著性水平\
  \ `0.05` 意味着，如果零假设为真，则会有 `5%` 的概率错误地拒绝它（即犯第一类错误）。\n\n\n\n### 学生 t 检验\n\n学生 t 检验用于检验关于一个或两个总体均值的假设。如果数据被认为来自正态分布，则\
  \ t 检验是合适的。如果样本足够大（即每个样本至少包含 30 个值），那么即使数据不呈正态分布，也可以使用 t 检验。这是因为，即使随机变量不呈正态分布，只要样本足够大，从该分布中抽取的一系列样本的均值将趋向于围绕总体均值呈正态分布（中心极限定理）。如果您的数据不满足上述任一条件，则应改用本章后面介绍的\
  \ Wilcoxon 秩和检验。\n\nt 检验有三种类型：\n\n- **单样本 t 检验**用于比较样本的均值与一个常量值 `μ[0]`。其原假设为总体均值等于\
  \ `μ[0]`，备择假设为总体均值不等于 `μ[0]`。\n- **双样本 t 检验**用于比较两个独立样本的均值，以确定它们是否来自均值相等的总体。其原假设为两个均值相等，备择假设为两个均值不相等。\n\
  - **配对 t 检验**用于比较两个样本的均值，其中一个样本中的每个值与另一个样本中的特定值相对应。其原假设为两个均值相等，备择假设为两个均值不相等。\n\n\
  t 检验也可以使用单侧备择假设进行，这被称为单尾检验。对于单样本 t 检验，单侧备择假设可以是均值大于 `μ[0]` 或均值小于 `μ[0]`。对于双样本或配对\
  \ t 检验，单侧备择假设可以是第一个总体的均值大于第二个总体的均值，或者第一个总体的均值小于第二个总体的均值。\n\n以下各节将说明如何在 R 中执行每种类型的\
  \ t 检验。\n\n#### 单样本 t 检验\n\n您可以使用 `t.test` 函数执行单样本 t 检验。要将样本均值与常量值 `mu0` 进行比较，请使用以下命令：\n\
  \n```\n> t.test(dataset$sample1, mu=mu0)\n```\n\n`mu` 参数给出了您要与样本均值进行比较的值。它是可选参数，默认值为\
  \ 0。\n\n默认情况下，R 执行双尾检验。要执行单尾检验，请将 `alternative` 参数设置为 `\"greater\"` 或 `\"less\"\
  `：\n\n```\n> t.test(dataset$sample1, mu=mu0, alternative=\"greater\")\n```\n\n输出结果中包含总体均值的\
  \ 95% 置信区间。要调整区间的大小，请使用 `conf.level` 参数：\n\n```\n> t.test(dataset$sample1, mu=mu0,\
  \ conf.level=0.99)\n```\n\n示例 10-1. 使用瓶子数据的单尾、单样本 t 检验\n\n一台瓶子灌装机被设置为向瓶子中灌装 500\
  \ 毫升的软饮料。已知实际灌装量服从正态分布。制造商认为机器存在灌装不足的情况。抽取了 20 个瓶子作为样本，并测量了其中的液体体积。结果在 `bottles`\
  \ 数据集中给出，该数据集可从网站获取。\n\n要计算样本均值，请使用以下命令：\n\n```\n> mean(bottles$Volume)\n[1] 491.5705\n\
  ```\n\n假设您想使用单样本 t 检验来确定瓶子是否持续灌装不足，或者样本的低平均体积是否可能是随机变异的结果。由于制造商特别关心体积是否小于 500 毫升，因此单侧检验是合适的。该检验的原假设为平均灌装体积等于\
  \ 500 毫升，备择假设为平均灌装体积小于 500 毫升。将使用 0.01 的显著性水平。\n\n要执行该检验，请使用以下命令：\n\n```\n> t.test(bottles$Volume,\
  \ mu=500, alternative=\"less\", conf.level=0.99)\n```\n\n这将产生以下输出：\n\n```\n    \
  \    One Sample t-test\n\ndata:  bottles$Volume\nt = -1.5205, df = 19, p-value =\
  \ 0.07243\nalternative hypothesis: true mean is less than 500\n99 percent confidence\
  \ interval:\n     -Inf 505.6495\nsample estimates:\nmean of x\n491.5705\n```\n\n\
  从输出结果中，我们可以看到样本的平均瓶子体积为 491.6 毫升。单侧 99% 置信区间告诉我们，平均灌装体积很可能小于 505.6 毫升。p 值为 0.07243，这表明如果机器的平均灌装体积为\
  \ 500 毫升，那么抽取一个平均体积小于或等于该样本的样本的概率约为 7%。\n\n由于 p 值不小于显著性水平 0.01，我们不能拒绝平均灌装体积等于 500\
  \ 毫升的原假设。这意味着没有证据表明瓶子存在灌装不足的情况。\n\n\n\n### 双样本 T 检验\n\n你可以使用 `t.test` 函数对堆叠格式或非堆叠格式的数据执行双样本\
  \ t 检验。如果所有数据值都存储在一个变量中，且第二个变量给出每个观测值所属样本的名称或编号，则你的数据为堆叠格式。如果每个样本的值分别存放在不同的变量中，则你的数据为非堆叠格式。如果你不确定数据属于哪种格式，请参考图\
  \ 10-1，该图展示了同一数据集在堆叠格式和非堆叠格式下的示例。\n\n![A978-1-4842-0139-8_10_Fig1_HTML.jpg](img/A978-1-4842-0139-8_10_Fig1_HTML.jpg)\n\
  \n图 10-1. 同一数据集的堆叠格式和非堆叠格式\n\n要对堆叠格式的数据执行双样本 t 检验，请使用以下命令：\n\n`> t.test(values ∼\
  \ groups, dataset)`\n\n其中 `values` 是包含数据值的变量名，`groups` 是包含样本名称的变量名。如果分组变量具有两个以上的水平，则必须指定要比较哪两个组：\n\
  \n`> t.test(values ∼ groups, dataset, groups %in% c(\"Group1\", \"Group2\"))`\n\n\
  如果你的数据是非堆叠格式，请使用以下命令：\n\n`> t.test(dataset$sample1, dataset$sample2)`\n\n默认情况下，R\
  \ 在执行双样本和配对 t 检验时使用单独的方差估计。如果你认为两个组的方差相等，则可以使用合并方差估计。*F 检验*或*巴特利特检验*（参见本章后面的“方差的假设检验”）有助于判断情况是否如此。要使用合并方差估计，请将\
  \ `var.equal` 参数设置为 `T`：\n\n`> t.test(values ∼ groups, dataset, var.equal=T)`\n\n\
  要执行单侧检验，请将 `alternative` 参数设置为 `\"greater\"` 或 `\"less\"`：\n\n`> t.test(values ∼\
  \ groups, dataset, alternative=\"greater\")`\n\n当 `alternative` 参数设置为 `\"greater\"\
  ` 时，检验的备择假设是第一个组的均值大于第二个组的均值。如果你使用的是堆叠数据，可能需要使用 `levels` 函数来检查哪一个是第一个组和第二个组（参见第\
  \ 3 章中的“使用因子变量”）。类似地，将其设置为 `\"less\"` 则给出备择假设：第一个组的均值小于第二个组的均值。\n\n输出中包含均值差异的 95%\
  \ 置信区间。你可以使用 `conf.level` 参数调整此区间的范围：\n\n`> t.test(values ∼ groups, dataset, conf.level=0.99)`\n\
  \n**示例 10-2. 使用鸢尾花数据的双样本 T 检验**\n\n假设你想使用双样本 t 检验来确定变色鸢尾和维吉尼亚鸢尾的花萼宽度均值是否存在真实差异。你可以假设花萼宽度服从正态分布，并且两个组的方差相等。检验的原假设是这两个物种的花萼宽度均值没有真实差异，备择假设是存在差异。\n\
  \n数据是堆叠格式，因此使用以下命令执行检验：\n\n`> t.test(Sepal.Width∼Species, iris, Species %in% c(\"\
  versicolor\", \"virginica\"), var.equal=T)`\n\n输出如下所示。\n\n```\nTwo Sample t-test\n\
  \ndata:  Sepal.Width by Species\nt = -3.2058, df = 98, p-value = 0.001819\nalternative\
  \ hypothesis: true difference in means is not equal to 0\n95 percent confidence\
  \ interval:\n -0.33028246 -0.07771754\nsample estimates:\nmean in group versicolor\
  \  mean in group virginica\n2.770                    2.974\n```\n\n差异的 95% 置信区间为\
  \ –0.33 到 –0.08，这意味着变色鸢尾的平均花萼宽度估计比维吉尼亚鸢尾小 0.08 到 0.33 厘米。\n\n_p_ 值为 0.001819，小于显著性水平\
  \ 0.05，因此我们可以拒绝原假设（变色鸢尾和维吉尼亚鸢尾的平均花萼宽度相同），转而支持备择假设（这两个物种的平均花萼宽度不同）。\n\n此示例在示例 10-9\
  \ 中继续，其中使用 **F 检验**来检验方差相等的假设（参见“F 检验”）。\n\n### 配对 T 检验\n\n你可以通过将 `paired` 参数设置为\
  \ `T` 来执行配对 t 检验。如果你的数据是堆叠格式，请使用以下命令：\n\n`> t.test(values ∼ groups, dataset, paired=T)`\n\
  \n你的数据必须在每个组中具有相同数量的观测值，以便样本之间存在一一对应关系。R 会将第一个样本的第一个值与第二个样本的第一个值进行匹配。\n\n对于非堆叠格式的数据，请使用以下命令：\n\
  \n`> t.test(dataset$sample1, dataset$sample2, paired=T)`\n\n与双样本检验一样，你可以使用 `alternative`、`conf.level`\
  \ 和 `var.equal` 参数调整检验。因此，要执行备择假设为第一个组的均值小于第二个组的均值，并使用合并方差估计的检验，请使用以下命令：\n\n`> t.test(values\
  \ ∼ groups, dataset, paired=T, alternative=\"less\", var.equal=T)`\n\n**示例 10-3.\
  \ 使用大脑数据的配对 T 检验**\n\n考虑图 10-2 中显示的 `brains` 数据集，该数据集给出了十对同卵双胞胎中头胎和二胎的大脑体积（以立方厘米为单位）。\n\
  \n![A978-1-4842-0139-8_10_Fig2_HTML.jpg](img/A978-1-4842-0139-8_10_Fig2_HTML.jpg)\n\
  \n图 10-2. `brains` 数据集，提供来自 Tramo 等人文章《同卵双胞胎的大脑大小、头围与智商》的大脑体积数据（更多详情请参见附录 C）\n\n\
  假设你想使用 t 检验来确定大脑体积是否与出生顺序有关。假设大脑体积服从正态分布。数据自然是配对的，因为同一对双胞胎中的头胎与二胎相对应，因此配对 t 检验是合适的。由于对任一方向的差异都感兴趣，因此使用双尾检验。检验的原假设是头胎和二胎双胞胎的平均大脑体积没有差异，备择假设是头胎双胞胎的平均大脑体积与二胎双胞胎不同。\n\
  \n要执行检验，请使用以下命令：\n\n`> t.test(brains$Twin1, brains$Twin2, paired=T)`\n\n输出如下所示。\n\
  \n```\n        Paired t-test\n\ndata:  brains$Twin1 and brains$Twin2\nt = -0.4742,\
  \ df = 9, p-value = 0.6466\nalternative hypothesis: true difference in means is\
  \ not equal to 0\n95 percent confidence interval:\n -49.04566  32.04566\nsample\
  \ estimates:\nmean of the differences\n                   -8.5\n```\n\n平均大脑体积差异估计为\
  \ –8.5，这意味着头胎双胞胎的大脑体积平均比其二胎兄弟姐妹小 8.5 立方厘米。差异的置信区间为 –49 到 32 立方厘米。\n\n_p_ 值为 0.6466\
  \ 告诉我们，如果头胎和二胎双胞胎的平均大脑体积相同，那么在我们样本中观察到相等或更大差异的概率为 65%。由于 _p_ 值不小于显著性水平 0.05，因此不能拒绝原假设。这意味着没有证据表明双胞胎的大脑体积与出生顺序有关。\n\
  \n\n\n### 威尔科克森秩和检验\n\n威尔科克森秩和检验（也称为曼-惠特尼 U 检验）允许你检验关于一个或两个样本均值的假设。它是学生 t 检验的一种非参数替代方法，即使数据分布未知且样本量较小，也同样适用。与\
  \ t 检验类似，它也有单样本、双样本和配对形式。备择假设可以是双尾或单尾。\n\n你可以使用 `wilcox.test` 函数执行威尔科克森秩和检验。其命令与执行\
  \ t 检验的命令相似。\n\n要执行单样本检验，请使用以下命令：\n\n`> wilcox.test(dataset$sample1, mu=mu0)`\n\n\
  要以堆叠形式对数据进行双样本检验，请使用命令：\n\n`> wilcox.test(values∼groups, dataset)`\n\n如果分组变量有两个以上的水平，则必须指定要比较的两个水平：\n\
  \n`> wilcox.test(values∼groups, dataset, groups %in% c(\"Group1\", \"Group2\"))`\n\
  \n如果你的数据是非堆叠形式（每个样本的值保存在单独的变量中），请使用命令：\n\n`> wilcox.test(dataset$sample1, dataset$sample2)`\n\
  \n对于配对检验，请将 `paired` 参数设为 `T`：\n\n`> wilcox.test(values∼groups, dataset, paired=T)`\n\
  \n要执行单尾检验，请将 `alternative` 参数设置为 `\"greater\"` 或 `\"less\"`：\n\n`> wilcox.test(values∼groups,\
  \ dataset, alternative=\"greater\")`\n\n默认情况下，输出结果不包含置信区间。要计算总体均值（对于单样本检验）或均值差（对于配对检验和双样本检验）的置信区间，请将\
  \ `conf.int` 参数设为 `T`。置信区间的默认大小为 95%，但你可以通过 `conf.level` 参数进行调整：\n\n`> wilcox.test(values∼groups,\
  \ dataset, conf.int=T, conf.level=0.99)`\n\n### 例 10-4：基于睡眠数据的配对威尔科克森秩和检验\n\n考虑\
  \ `sleep` 数据集，该数据集包含在 R 中。该数据给出了一个实验的结果，在该实验中，10 名患者分别接受了两种不同的治疗方法，并记录了他们在接受每种治疗期间经历的额外睡眠时间（与平时相比）。`extra`\
  \ 变量给出了睡眠的增加量（每小时每晚计），`group` 变量给出了治疗编号（1 或 2），`ID` 变量给出了患者编号（1 到 10）。\n\n假设你想确定两种治疗在平均睡眠增加量上是否存在真实差异。威尔科克森秩和检验是合适的，因为额外睡眠时间的分布未知，且样本量较小。使用配对检验是因为患者编号\
  \ x 在服用药物 1 时经历的额外睡眠与同一患者在服用药物 2 时经历的额外睡眠相对应。该检验的原假设是两种治疗方法的平均额外睡眠没有差异。备择假设是两种治疗方法的平均额外睡眠不同。将使用显著性水平\
  \ 0.05。\n\n由于数据是堆叠形式的，你可以使用以下命令执行检验：\n\n`> wilcox.test(extra∼group, sleep, paired=T)`\n\
  \n这将给出结果：\n\n```\nWilcoxon signed rank test with continuity correction\n\ndata:\
  \  extra by group\nV = 0, p-value = 0.009091\nalternative hypothesis: true location\
  \ shift is not equal to 0\n\nWarning messages:\n1: In wilcox.test.default(x = c(0.7,\
  \ -1.6, -0.2, -1.2, -0.1, 3.4, 3.7,  :\n  cannot compute exact p-value with ties\n\
  2: In wilcox.test.default(x = c(0.7, -1.6, -0.2, -1.2, -0.1, 3.4, 3.7,  :\n  cannot\
  \ compute exact p-value with zeroes\n```\n\np 值为 0.009091 告诉我们，如果两种药物的效果相同，那么观察到平均睡眠增加量差异达到数据中如此大程度的概率将低于\
  \ 1%。由于这个值小于我们的显著性水平 0.05，我们可以拒绝原假设，即两种治疗方法的额外睡眠时间相同。这意味着有证据表明两种治疗方法在有效性上存在差异。\n\
  \nR 给出了一个警告，提示数据中存在结。这意味着某些观测值在感兴趣的变量上具有完全相同的值，因为测量值只保留了一位小数。出于这个原因，R 无法计算精确的 p\
  \ 值，因此应谨慎解读结果。关于结数据对威尔科克森秩和检验影响的更深入解释，可参见 S. Siegel 和 N.J. Castellan 所著《行为科学的非参数统计学》第二版（McGraw-Hill\
  \ 1988）第 134 页。\n\n\n\n## 方差分析\n\n方差分析（ANOVA）允许您比较三个或更多独立样本的均值。当数据值来自正态分布且每组的方差大致相同时，此方法适用。您可以使用巴特利特检验来检验方差相等的假设（请参阅本章后面的“方差假设检验”）。该检验的零假设是所有组的均值相同，备择假设是至少有一对组的均值不同。\n\
  \n更复杂的模型（如双向方差分析或协方差分析）将在第 11 章中介绍。\n\n您可以使用`aov`函数进行方差分析。由于方差分析是一种广义线性模型，您也可以使用第\
  \ 11 章中介绍的`lm`或`glm`函数。不过，`aov`函数呈现结果更为便捷。\n\n该命令的形式如下：\n\n```\n> aov(数值 ∼ 分组, 数据集)\n\
  ```\n\n其中`数值`是保存数据值的变量名，`分组`是标识每个观测值所属样本的变量。如果您的数据是非堆叠形式（每个样本的值保存在单独的变量中），那么您需要先堆叠数据，如第\
  \ 4 章中“堆叠数据”部分所述。\n\n分析结果包含许多 R 不会自动显示的组成部分。如果您将结果保存到一个对象中（如下所示），则可以使用其他函数来提取输出的各个元素：\n\
  \n```\n> aov 对象 <- aov(数值 ∼ 分组, 数据集)\n```\n\n将结果保存为对象后，您可以使用`anova`函数查看方差分析表：\n\n\
  ```\n> anova(aov 对象)\n```\n\n要查看模型系数，请使用`coef`函数：\n\n```\n> coef(aov 对象)\n```\n\n\
  要查看系数的置信区间，请使用`confint`函数：\n\n```\n> confint(aov 对象)\n```\n\n**示例 10-5. 使用`PlantGrowth`数据进行方差分析**\n\
  \n考虑`PlantGrowth`数据集（已包含在 R 中），该数据集包含三组（每组 10 批）植物的干燥重量，每组 10 批植物接受了不同的处理。`weight`变量表示每批植物的重量，`group`变量表示接受的处理。图\
  \ 10-3 显示了按处理组分组的重量箱线图。\n\n![A978-1-4842-0139-8_10_Fig3_HTML.jpg](img/A978-1-4842-0139-8_10_Fig3_HTML.jpg)\n\
  \n图 10-3. `PlantGrowth`数据集中按处理组分组的重量箱线图\n\n从箱线图中可以看出，三组之间的植物生长（以每批重量衡量）存在一些差异。假设您希望进行方差分析，以确定这些差异是否具有统计显著性。您可以假设植物生长服从正态分布，并且所有三种处理的方差相同。使用显著性水平\
  \ 0.05。\n\n要执行方差分析并将结果保存到名为`plantanova`的对象中，请使用以下命令：\n\n```\n> plantanova <- aov(weight\
  \ ~ group, PlantGrowth)\n```\n\n要查看方差分析表，请使用以下命令：\n\n```\n> anova(plantanova)\n\
  ```\n\n这将输出以下结果：\n\n```\nAnalysis of Variance Table\n\nResponse: weight\n      \
  \    Df  Sum Sq Mean Sq F value  Pr(>F)\ngroup      2  3.7663  1.8832  4.8461 0.01591\
  \ *\nResiduals 27 10.4921  0.3886\n---\nSignif. codes:  0 '***' 0.001 '**' 0.01\
  \ '*' 0.05 '.' 0.1 ' ' 1\n```\n\n我们可以看到`group`效应的 p 值为 0.01591。这意味着，如果所有三种处理的效果相同，我们观察到各组间差异达到如此之大或更大的概率将低于\
  \ 2%。由于 p 值小于显著性水平 0.05，我们可以拒绝所有处理平均生长量相同的零假设，转而支持至少有一对处理组的平均生长量不同的备择假设。\n\n要查看处理效应的大小，请使用以下命令：\n\
  \n```\n> coef(plantanova)\n\n(Intercept)   grouptrt1   grouptrt2\n     5.032   \
  \   -0.371       0.494\n```\n\n输出告诉我们，对照处理的平均重量为 5.032。处理 1（`trt1`）的效果是，与对照方法相比，平均重量减少了\
  \ 0.371 个单位；处理 2（`trt2`）的效果是，与对照方法相比，平均重量增加了 0.494 个单位。\n\n本示例将在示例 10-7（参见“图基 HSD\
  \ 检验”）中继续，其中将使用成对 t 检验进一步研究处理差异；并在示例 10-10 中继续，其中将使用巴特利特检验来检验方差相等的假设。请保存`plantanova`对象，因为它在这些示例中将很有用。\n\
  \n### 克鲁斯卡尔-沃利斯检验\n\n克鲁斯卡尔-沃利斯检验允许您比较三个或更多样本的均值。它是方差分析的非参数替代方法，当数值的分布未知时可以使用。\n\n\
  您可以使用`kruskal.test`函数进行克鲁斯卡尔-沃利斯检验。要对堆叠数据执行检验，请使用以下命令：\n\n```\n> kruskal.test(数值\
  \ ∼ 分组, 数据集)\n```\n\n其中`数值`变量包含数据值，`分组`变量指示每个观测值属于哪个样本。\n\n对于非堆叠数据（样本存放在单独的变量中），请将变量嵌套在`list`函数内：\n\
  \n```\n> kruskal.test(list(数据集$样本 1, 数据集$样本 2, 数据集$样本 3))\n```\n\n**示例 10-6. 使用`grades1`数据进行克鲁斯卡尔-沃利斯检验**\n\
  \n考虑`grades1`数据集，如图 10-4 所示。该数据集显示了来自三个不同班级的 15 名学生的测试成绩（满分 100 分）。\n\n![A978-1-4842-0139-8_10_Fig4_HTML.jpg](img/A978-1-4842-0139-8_10_Fig4_HTML.jpg)\n\
  \n图 10-4. `grades1`数据集（更多详细信息请参见附录 C）\n\n假设您想使用克鲁斯卡尔-沃利斯检验来确定这三个班级各自使用的教学方法在有效性上是否存在差异，以学生的平均测试成绩来衡量。使用显著性水平\
  \ 0.05。\n\n由于数据是非堆叠形式，您可以使用以下命令执行检验：\n\n```\n> kruskal.test(list(grades1$ClassA,\
  \ grades1$ClassB, grades1$ClassC))\n```\n\n这将输出以下结果：\n\n```\n        Kruskal-Wallis\
  \ rank sum test\n\ndata:  list(grades1$ClassA, grades1$ClassB, grades1$ClassC)\n\
  Kruskal-Wallis chi-squared = 6.6796, df = 2, p-value = 0.03544\n```\n\n从输出中可以看出\
  \ p 值为 0.03544。由于该值小于显著性水平 0.05，我们可以拒绝所有班级平均分数相等的零假设。这意味着有证据表明三个班级所使用的教学方法在有效性上存在差异。\n\
  \n本示例将在示例 10-9 中继续，其中将使用成对威尔科克森秩和检验来进一步研究三个班级之间的差异。\n\n\n\n#### 多重比较方法\n\n在执行方差分析并发现组均值之间存在一些差异后，您可能希望执行一系列两两\
  \ t 检验，以识别特定组对之间的差异。然而，当执行大量 t 检验时，至少错误地拒绝一个检验的原假设（I 类错误）的整体概率会高于用于单个检验的显著性水平。多重比较方法允许您对三个或更多样本执行两两\
  \ t 检验，同时控制整体 I 类错误。\n\n有多种方法可以进行多重比较。其中一些最流行的方法是 **图基的诚实显著性差异（HSD）检验** 和 **邦费罗尼检验**。\n\
  \n以下部分介绍如何在 R 中执行几种主要的多重比较方法。\n\n##### 图基 HSD 检验\n\n您可以使用 `TukeyHSD` 函数执行图基 HSD\
  \ 检验。如果您之前使用 `aov`、`lm` 或 `glm` 函数执行了方差分析，并将结果保存到一个对象中（如“方差分析”之前所述），请直接使用该函数：\n\n\
  `> TukeyHSD(aovobject)`\n\n如果您没有 `aov` 对象并且使用的是原始数据，请将 `aov` 函数嵌套在 `TukeyHSD` 函数中：\n\
  \n`> TukeyHSD(aov(values ∼ groups, dataset))`\n\n默认的总体置信水平是 0.95，但您可以使用 `conf.level`\
  \ 参数进行调整：\n\n`> TukeyHSD(aovobject, conf.level=0.99)`\n\n**示例 10-7. 使用 PlantGrowth\
  \ 数据的图基 HSD 检验**\n\n在示例 10-5 中，使用了方差分析来帮助确定三个处理组之间的平均植物生长量（通过批次重量测量）是否存在差异。结论是至少有一对处理组之间的植物生长存在差异。\n\
  \n假设您希望通过使用两两 t 检验来继续此分析，以确定哪些处理组在植物生长上存在差异。使用 0.05 的整体显著性水平。\n\n如果您仍然拥有示例 10-5\
  \ 中创建的 `plantanova` `aov` 对象，您可以使用以下命令执行检验：\n\n`> TukeyHSD(plantanova)`\n\n如果您不再拥有该模型对象，您可以从原始数据执行检验：\n\
  \n`> TukeyHSD(aov(weight∼group, PlantGrowth))`\n\n输出如下所示：\n\n```\n  Tukey multiple\
  \ comparisons of means\n    95% family-wise confidence level\nFit: aov(formula =\
  \ weight ∼ group, data = PlantGrowth)\n$group\n            diff        lwr     \
  \  upr     p adj\ntrt1-ctrl -0.371 -1.0622161 0.3202161 0.3908711\ntrt2-ctrl  0.494\
  \ -0.1972161 1.1852161 0.1979960\ntrt2-trt1  0.865  0.1737839 1.5562161 0.0120064\n\
  ```\n\n`diff` 列显示了两组样本均值的差异，`lwr` 和 `upr` 列给出了该差异的 95% 置信区间。`p adj` 列给出了两组之间 t 检验的\
  \ p 值，并对多重 t 检验进行了调整。\n\n将 p 值与我们的显著性水平 0.05 进行比较，我们可以看到 `trt2-trt1` 的比较在统计上显著。这意味着处理组\
  \ 1 的植物生长量与处理组 2 的生长量存在显著差异。处理组 1 和处理组 2 与对照组相比均无显著差异。\n\n估计处理组 2 比处理组 1 多产生 0.865\
  \ 个单位的生长量。生长差异的 95% 置信区间为 0.174 到 1.556。\n\n### 其他两两 t 检验\n\n`pairwise.t.test` 函数允许您使用多种其他多重比较方法执行两两\
  \ t 检验。要使用邦费罗尼校正执行两两 t 检验，请使用以下命令：\n\n`> pairwise.t.test(dataset$values, dataset$groups,\
  \ p.adj=\"bonferroni\")`\n\n`p.adj` 参数的其他可能选项包括 `holm`（默认方法）、`hochberg` 和 `hommel`。输入\
  \ `help(p.adjust)` 可查看完整列表。\n\n**示例 10-8. 使用 PlantGrowth 数据和邦费罗尼校正的两两比较**\n\n继续\
  \ `PlantGrowth` 示例，假设您希望尝试使用邦费罗尼校正进行两两 t 检验以进行比较：\n\n`> pairwise.t.test(PlantGrowth$weight,\
  \ PlantGrowth$group, p.adj=\"bonferroni\")`\n\n结果如下所示：\n\n```\n        Pairwise\
  \ comparisons using t tests with pooled SD\ndata:  PlantGrowth$weight and PlantGrowth$group\n\
  \     ctrl  trt1\ntrt1 0.583 -\ntrt2 0.263 0.013\nP value adjustment method: bonferroni\n\
  ```\n\n输出显示了每个比较的 p 值。从输出中，我们可以看到处理组 1（`trt1`）和处理组 2（`trt2`）的比较的 p 值为 0.013，这在 0.05\
  \ 水平上具有统计显著性。对照组与处理组 1 之间以及对照组与处理组 2 之间的比较在统计上不显著。这与前一个示例中图基 HSD 检验的结果一致。\n\n###\
  \ 两两 Wilcoxon 秩和检验\n\n还有一个名为 `pairwise.wilcox.test` 的函数，它允许您执行两两 Wilcoxon 秩和检验。这在执行\
  \ Kruskal-Wallis 检验（本章前面已介绍）后，用于识别各组间个体对之间的差异非常有用。\n\n要执行检验，请使用以下命令：\n\n`> pairwise.wilcox.test(dataset$values,\
  \ dataset$groups)`\n\n与执行两两 t 检验时一样，您可以使用 `p.adj` 参数调整多重比较方法。\n\n## 方差的假设检验\n\n\
  方差的假设检验允许您比较两个或多个样本的方差，以确定它们是否来自具有相等方差的总体。这些检验的原假设是方差相等，备择假设是方差不相等。这些检验对于检查 t 检验或方差分析的假设非常有用。\n\
  \n本节涵盖两种类型的方差检验：\n\n*   **F 检验** 允许您比较两个样本的方差。它适用于正态分布的数据。\n*   **巴特利特检验** 允许您比较两个或多个样本的方差。它适用于正态分布的数据。\n\
  \n以下部分说明如何在 R 中执行 F 检验和巴特利特检验。\n\n\n\n### F 检验\n\n你可以使用`var.test`函数进行 F 检验。如果数据是堆叠格式，请使用以下命令：\n\
  \n```r\nvar.test(values ~ groups, dataset)\n```\n\n如果`groups`变量包含两个以上的水平，则必须指定要比较的两个水平：\n\
  \n```r\nvar.test(values ~ groups, dataset, groups %in% c(\"Group1\", \"Group2\"\
  ))\n```\n\n对于非堆叠格式的数据（样本存储在单独的变量中），请使用以下命令：\n\n```r\nvar.test(dataset$sample1, dataset$sample2)\n\
  ```\n\n#### 示例 10-10：使用鸢尾花数据集进行 F 检验\n\n在示例 10-2 中，我们使用了 t 检验，并采用合并方差估计来比较弗吉尼亚鸢尾和杂色鸢尾的萼片宽度均值。该检验的一个假设前提是两种鸢尾的萼片宽度方差相等。\n\
  \n假设你想使用 F 检验来帮助判断这两个物种的萼片宽度方差是否相等。将使用显著性水平 0.05。\n\n执行检验，请使用以下命令：\n\n```r\nvar.test(Sepal.Width\
  \ ~ Species, iris, Species %in% c(\"versicolor\", \"virginica\"))\n```\n\n输出结果如下所示：\n\
  \n```\nF test to compare two variances\n\ndata:  Sepal.Width by Species\nF = 0.9468,\
  \ num df = 49, denom df = 49, p-value = 0.849\nalternative hypothesis: true ratio\
  \ of variances is not equal to 1\n95 percent confidence interval:\n 0.5372773 1.6684117\n\
  sample estimates:\nratio of variances \n         0.9467839\n```\n\np 值为 0.849，不小于显著性水平\
  \ 0.05，因此我们不能拒绝两组方差相等的原假设。没有证据表明弗吉尼亚鸢尾和杂色鸢尾的萼片宽度方差存在差异。\n\n#### 巴特利特检验\n\n你可以使用`bartlett.test`函数进行巴特利特检验。如果数据是堆叠格式，请使用以下命令：\n\
  \n```r\nbartlett.test(values ~ groups, dataset)\n```\n\n与 F 检验不同，巴特利特检验允许你比较两个以上组的方差。不过，如果需要，你仍然可以选择一个子集进行比较：\n\
  \n```r\nbartlett.test(values ~ groups, dataset, groups %in% c(\"Group1\", \"Group2\"\
  ))\n```\n\n如果你有非堆叠格式的数据（样本存储在单独的变量中），请将变量嵌套在`list`函数中：\n\n```r\nbartlett.test(list(dataset$sample1,\
  \ dataset$sample2, dataset$sample3))\n```\n\n#### 示例 10-11：使用 PlantGrowth 数据进行巴特利特检验\n\
  \n在示例 10-5 中，我们使用方差分析比较了三个处理组植物批次的平均重量。该检验的一个假设前提是所有处理组的重量方差相等。\n\n假设你想使用巴特利特检验来判断所有处理组的重量方差是否相等。将使用显著性水平\
  \ 0.05。\n\n执行检验，请使用以下命令：\n\n```r\nbartlett.test(weight ~ group, PlantGrowth)\n```\n\
  \n这将输出：\n\n```\nBartlett test of homogeneity of variances\n\ndata:  weight by group\n\
  Bartlett's K-squared = 2.8786, df = 2, p-value = 0.2371\n```\n\n从输出中可以看出，p 值为 0.2371，不小于显著性水平\
  \ 0.05。这意味着我们不能拒绝所有处理组方差相等的原假设。这表明，没有证据表明三个处理组的植物生长方差存在差异。\n\n### 总结\n\n现在，你应该能够使用\
  \ t 检验或 Wilcoxon 秩和检验来比较两个样本的均值，并使用方差分析或 Kruskal-Wallis 检验来比较三个或更多样本的均值。你应该能够使用适当的方法对三个或更多组进行两两比较。最后，你应该能够使用\
  \ F 检验或巴特利特检验来比较两个组的方差。\n\n下表总结了涵盖的最重要的命令。\n\n| 检验类型 | 命令 |\n| --- | --- |\n| 单样本\
  \ t 检验 | `t.test(dataset$sample1, mu=mu0)` |\n| 双样本 t 检验 | `t.test(values ~ groups,\
  \ dataset)` |\n| | `t.test(dataset$sample1, dataset$sample2)` |\n| 配对 t 检验 | `t.test(values\
  \ ~ groups, dataset, paired=T)` |\n| | `t.test(dataset$sample1, dataset$sample2,\
  \ paired=T)` |\n| 单样本 Wilcoxon 秩和检验 | `wilcox.test(dataset$sample1, mu=mu0)` |\n\
  | 双样本 Wilcoxon 秩和检验 | `wilcox.test(values ~ groups, dataset)` |\n| | `wilcox.test(dataset$sample1,\
  \ dataset$sample2)` |\n| 配对 Wilcoxon 秩和检验 | `wilcox.test(values ~ groups, dataset,\
  \ paired=T)` |\n| | `wilcox.test(dataset$sample1, dataset$sample2, paired=T)` |\n\
  | 方差分析 | `aov(values ~ groups, dataset)` |\n| Kruskal-Wallis 检验 | `kruskal.test(values\
  \ ~ groups, dataset)` |\n| | `kruskal.test(list(dataset$sample1, dataset$sample2,\
  \ dataset$sample3))` |\n| 图基 HSD 检验 | `TukeyHSD(aovobject)` |\n| | `TukeyHSD(aov(values\
  \ ~ groups, dataset))` |\n| 两两 t 检验 | `pairwise.t.test(dataset$values, dataset$groups,\
  \ method=\"bonferroni\")` |\n| 两两 Wilcoxon 秩和检验 | `pairwise.wilcox.test(dataset$values,\
  \ dataset$groups)` |\n| F 检验 | `var.test(values ~ groups, dataset)` |\n| | `var.test(dataset$sample1,\
  \ dataset$sample2)` |\n| 巴特利特检验 | `bartlett.test(values ~ groups, dataset)` |\n\
  | | `bartlett.test(list(dataset$sample1, dataset$sample2))` |\n\n在下一章中，我们将学习如何构建回归模型和其他类型的广义线性模型。\n\
  \n\n\n"
- "# 11. 回归与一般线性模型\n\n模型构建有助于你理解变量之间的关系，并对未来观测值进行预测。本章将讲解如何构建回归模型以及一般线性模型系列中的其他模型。\n\
  \n你将学习如何：\n\n-   构建简单线性回归、多元线性回归和多项式回归模型\n-   在模型中包含交互项、变换变量和因子变量\n-   向现有模型添加或移除项\n\
  -   执行逐步、向前和向后模型选择程序\n-   评估模型对数据的拟合程度\n-   解释模型系数\n-   使用最佳拟合线或曲线以图形方式表示模型\n- \
  \  使用残差、偏差和库克距离等诊断方法检验模型的有效性\n-   使用模型对新数据进行预测\n\n本章将使用 `trees` 数据集（包含在 R 中）以及 `powerplant`、`concrete`\
  \ 和 `people2` 数据集（这些数据集随本书下载提供，并在附录 C 中描述）。\n\n## 一般线性模型\n\n一般线性模型用于根据一个或多个解释变量来预测一个连续变量（称为响应变量）的值。一般线性模型的形式如下：\n\
  \n`y = β[0] + β[1]x[1] + β[2]x[2] + … … + β[n]x[n] + ε`\n\n其中，`y` 是响应变量，`x[i]` 是解释变量，`β[i]`\
  \ 是待估计的系数，`ε` 表示随机误差。\n\n解释变量可以是连续变量或分类变量，并且可以包括其他变量的交叉乘积、多项式和变换。\n\n随机误差被假定为独立，服从均值为零的正态分布，并且对于解释变量的所有值具有相同的方差。\n\
  \n简单线性回归、多元线性回归、多项式回归、方差分析、双因素方差分析、协方差分析和实验设计模型都属于一般线性模型的类型。\n\n## 构建模型\n\n你可以使用\
  \ `lm` 函数或 `glm` 函数来构建回归模型或一般线性模型。用于此目的时，这些函数执行相同的操作并给出类似的输出。在本书中，我们将使用 `lm` 函数来构建一般线性模型，但请注意，你可能会看到\
  \ `glm` 函数也在使用中。\n\n#### 简单线性回归\n\n要构建一个包含名为 `var1` 的解释变量和名为 `resp` 的响应变量的简单线性回归模型，请使用以下命令：\n\
  \n```\n> lm(resp ~ var1, dataset)\n```\n\n你不需要在模型中指定截距项（或常数项），因为 R 会自动包含一个。要构建一个不含截距项的模型，请使用以下命令：\n\
  \n```\n> lm(resp ~ -1 + var1, dataset)\n```\n\n当你使用 `lm` 函数构建模型时，R 会显示系数估计值。然而，输出中还有更多未显示的内容，例如汇总统计量、残差和拟合值。你可以将所有输出保存到一个对象中，如下所示。在本章后面，你将学习如何访问模型输出的各个组成部分。\n\
  \n```\n> modelname <- lm(resp ~ var1, dataset)\n```\n\n#### 示例 11-1. 使用树木数据进行简单线性回归\n\
  \n在第 5 章的“皮尔逊相关系数”部分，我们看到了树木周长与树木体积之间存在相关性。假设你想要构建一个简单线性回归模型，根据树的周长来预测其体积。要构建该模型，请使用以下命令：\n\
  \n```\n> lm(Volume ~ Girth, trees)\n```\n\n```\nCall:\nlm(formula = Volume ~ Girth,\
  \ data = trees)\n\nCoefficients:\n(Intercept)        Girth\n   -36.943        5.066\n\
  ```\n\n从输出中你可以看到模型公式为：\n\n`Volume = -36.943 + 5.066 × Girth`\n\n这意味着，一棵周长为 10 英寸的树木，其预期体积为\
  \ `-36.943 + 5.066 × 10 = 13.717` 立方英尺。周长每增加一英寸，预期体积增加 5.066 立方英尺。\n\n要将模型输出保存为一个对象，请使用以下命令：\n\
  \n```\n> treemodel <- lm(Volume ~ Girth, trees)\n```\n\n`treemodel` 对象将在本章后面部分使用。\n\
  \n#### 多元线性回归\n\n要在模型中包含多个解释变量，请用加号将它们分隔开：\n\n```\n> modelname <- lm(resp ~ var1\
  \ + var2 + var3, dataset)\n```\n\n#### 示例 11-2. 使用发电厂数据进行多元线性回归\n\n考虑 `powerplant`\
  \ 数据集，该数据集在附录 C 中有描述，并随本书下载提供。该数据集包含三个变量。`Output` 变量给出了燃气轮机的输出功率（单位兆瓦）。`Pressure`\
  \ 和 `Temp` 变量给出了轮机内部的温度和压力测量值。\n\n要构建一个根据压力和温度来预测输出功率的多元线性回归模型，请使用以下命令：\n\n```\n\
  > lm(Output ~ Pressure + Temp, powerplant)\n```\n\n```\nCall:\nlm(formula = Output\
  \ ~ Pressure + Temp, data = powerplant)\n\nCoefficients:\n(Intercept)     Pressure\
  \         Temp\n   -32.8620       0.1858      -0.9916\n```\n\n从输出中你可以看到模型为：\n\n\
  `Output = -32.8620 + 0.1858 × Pressure - 0.9916 × Temperature`\n\n这告诉我们，压力每增加一毫巴，轮机的预期输出功率增加\
  \ 0.1858 兆瓦。温度每升高一摄氏度，预期输出功率减少 0.9916 兆瓦。\n\n\n\n#### 交互项\n\n要在模型中添加交互项，请使用冒号（`:`）。例如，`var1:var2`\
  \ 表示两个变量 `var1` 和 `var2` 之间的交互作用。该命令会构建一个包含两个变量及其交互项的模型：\n\n```\n> modelname <-\
  \ lm(resp ~ var1 + var2 + var1:var2, dataset)\n```\n\n你也可以使用冒号来表达三阶及更高阶的交互作用：\n\n\
  ```\n> modelname <- lm(resp ~ var1 + var2 + var3 + var1:var2 + var1:var3 + var2:var3\
  \ + var1:var2:var3, dataset)\n```\n\n正如你所见，对于包含许多变量的模型，这种表示法会变得冗长。R 为交互项提供了两种有用的速记符号，即星号（`*`）符号和\
  \ hat 符号（`^`）。\n\n使用星号符号可以包含一组变量及其所有可能的交互作用。例如，命令：\n\n```\n> modelname <- lm(resp\
  \ ~ var1 * var2 * var3, dataset)\n```\n\n会构建一个包含三个变量主效应（`var1`、`var2`、`var3`）、三个二阶交互作用（`var1:var2`、`var1:var3`、`var2:var3`）以及三阶交互作用（`var1:var2:var3`）的模型。这等同于之前那个非常冗长的公式。\n\
  \nhat 符号则包含一组变量以及最高至指定阶数的所有可能的交互作用。例如，要包含所有主效应和二阶交互作用（但不包含三阶交互作用），请使用命令：\n\n```\n\
  > modelname <- lm(resp ~ (var1 + var2 + var3)², dataset)\n```\n\n这等同于以下命令：\n\n```\n\
  > modelname <- lm(resp ~ var1 + var2 + var3 + var1:var2 + var1:var3 + var1:var2,\
  \ dataset)\n```\n\n### 示例 11-3. 使用混凝土数据的因子实验\n\n考虑 `concrete` 数据集，如图 11-1 所示，可从网站上获取。该数据集展示了一项实验的结果，旨在确定水泥类型（I\
  \ 或 II）、添加剂类型（A 或 B）以及添加剂剂量（0.3%、0.4% 或 0.5%）对混凝土密度的影响。\n\n![A978-1-4842-0139-8_11_Fig1_HTML.jpg](img/A978-1-4842-0139-8_11_Fig1_HTML.jpg)\n\
  \n图 11-1. `concrete` 数据集（更多详情请参见附录 C）\n\n要构建一个用于预测密度的模型，该模型包含所有解释变量（水泥类型、添加剂类型和添加剂剂量）及其交互作用项（二阶和三阶），请使用命令：\n\
  \n```\n> concmodel <- lm(Density ~ Cement * Additive * Additive.Dose, concrete)\n\
  ```\n\n`concmodel` 对象将在本章后面使用。\n\n#### 多项式项\n\n要构建一个包含 `var1`、`var1`² 和 `var1`³\
  \ 项的多项式回归模型，请使用命令：\n\n```\n> modelname <- lm(resp ~ var1 + I(var1²) + I(var1³),\
  \ dataset)\n```\n\n请注意，`var1²` 和 `var1³` 项被嵌套在 `I()` 函数内。这是因为符号 `^`、`*` 和 `+` 在模型公式中具有特殊含义，容易与它们通常的算术含义（乘幂、乘法和加法）混淆。如果你想将这些符号用于其通常的算术含义，则必须将它们嵌套在\
  \ `I` 函数内。\n\n### 示例 11-4. 使用树木数据集进行多项式回归\n\n要构建一个预测树木体积的模型，该模型包含树围和树围²项，请使用命令：\n\
  \n```\n> lm(Volume ~ Girth + I(Girth²), trees)\nCall:\nlm(formula = Volume ~ Girth\
  \ + I(Girth²), data = trees)\n\nCoefficients:\n(Intercept)        Girth   I(Girth²)\n\
  \   10.7863      -2.0921       0.2545\n```\n\n从结果可以看出，模型公式为：\n\n`Volume = 10.7863\
  \ - 2.0921×Girth + 0.2545×Girth²`\n\n要将模型保存为一个对象，请使用命令：\n\n```\n> polytrees <- lm(Volume\
  \ ~ Girth + I(Girth²), trees)\n```\n\n`polytrees` 对象将在本章后面使用。\n\n#### 变换\n\n简单的变量变换，如对数或平方根变换，可以通过在公式中直接使用相关函数应用于响应变量或解释变量：\n\
  \n```\n> modelname <- lm(log(resp) ~ var1, dataset)\n```\n\n对于使用星号、hat 符号或加号的变换，请将它们嵌套在\
  \ `I` 函数内：\n\n```\n> modelname <- lm(I(resp²) ~ var1, dataset)\n```\n\n#### 截距项\n\
  \n有时你可能想要构建一个不含截距项的模型。为此，请在模型中添加 `-1` 作为一项，如下所示。这会告诉 R 不要包含截距项，而默认情况下 R 会自动包含：\n\
  \n```\n> modelname <- lm(resp ~ -1 + var1 + var2 + var3, dataset)\n```\n\n你也可以创建一个只包含截距项的模型，这被称为零模型：\n\
  \n```\n> modelname <- lm(resp ~ 1, dataset)\n```\n\n## 包含因子变量\n\n你可以像包含连续变量一样，将分类变量包含在模型中。在包含分类变量之前，请使用\
  \ `class` 函数检查其是否为 `factor` 变量类，如第 3 章中“处理因子变量”部分所述。\n\n当你在模型中包含一个因子变量时，R 会将因子的第一个水平视为参考水平。因此，对于一个有\
  \ n 个水平的因子，模型将产生 n-1 个系数，用于表示其余 n-1 个水平相对于参考水平的影响。\n\n要检查因子变量的第一个水平是哪个，请使用 `levels`\
  \ 函数：\n\n```\n> levels(dataset$variable)\n```\n\n你可以使用 `relevel` 函数更改因子变量的参考水平：\n\
  \n```\n> dataset$variable <- relevel(dataset$variable, \"reflevel\")\n```\n\n通过更改因子变量的对照（contrasts），可以改变\
  \ R 使用系数来表示因子影响的方式。每个因子变量都有一组与之关联的对照，你可以使用 `contrasts` 函数查看和更改这些对照。输入 `help(contrasts)`\
  \ 可获取有关如何更改因子变量对照的更多详情，输入 `help(contr.treatment)` 可查看对照选项列表。\n\n### 示例 11-5. 使用\
  \ people2 数据集的含因子变量模型\n\n假设你想使用 `people2` 数据集构建一个模型，根据一个人的手跨和眼睛颜色来预测其身高。\n\n你可以使用以下命令构建模型：\n\
  \n```\n> lm(Height ~ Hand.Span + Eye.Color, people2)\nCall:\nlm(formula = Height\
  \ ~ Hand.Span + Eye.Color, data = people2)\n\nCoefficients:\n   (Intercept)    \
  \   Hand.Span  Eye.ColorBrown  Eye.ColorGreen\n         82.8902          0.4456\
  \         -3.6233         -4.1924\n```\n\n从输出中，我们可以看到公式有两个系数，用于表示棕色和绿色眼睛相对于蓝色眼睛对身高的影响。因此，对于蓝眼睛的人来说，模型公式为：\n\
  \n`Height = 82.8902 + 0.4456×Hand Span`\n\n对于棕色眼睛的人来说，公式为：\n\n`Height = 82.8902\
  \ + 0.4456×Hand Span - 3.6233`\n\n对于绿色眼睛的人来说，公式为：\n\n`Height = 82.8902 + 0.4456×Hand\
  \ Span - 4.1924`\n\n\n\n### 更新模型\n\n构建模型后，你可能希望向模型中添加或删除某个项，以观察新模型与先前模型的对比情况。`update`\
  \ 函数允许你通过向现有模型添加或删除项来构建新模型。这在处理包含多个项的模型时非常有用，因为这意味着你无需在每次添加或删除项时重新输入整个模型规格。\n\n\
  假设你已经构建了一个模型，并将其保存到名为 `model1` 的对象中：\n\n```\n> model1 <- lm(resp ~ var1 + var2 +\
  \ var3 + var4, dataset)\n```\n\n若要创建一个名为 `model2` 的新模型（通过向 `model1` 添加一个额外的项，例如交互项\
  \ `var1:var2`），可使用以下命令：\n\n```\n> model2 <- update(model1, ~. + var1:var2)\n```\n\
  \n类似地，你也可以从模型中删除一个项：\n\n```\n> model2 <- update(model1, ~. - var4)\n```\n\n要检查新模型是否包含你期望的公式，可使用\
  \ `formula` 函数：\n\n```\n> formula(model2)\n```\n\n**示例 11-6. 更新 CONCMODEL 模型**\n\
  \n在示例 11-3 中，我们使用以下命令构建了 `concmodel` 模型：\n\n```\n> concmodel <- lm(Density ~ Cement*Additive*Additive.Dose,\
  \ concrete)\n```\n\n若要创建一个新模型（通过从 `concmodel` 模型中删除三阶交互项），可使用以下命令：\n\n```\n> concmodel2\
  \ <- update(concmodel, ~. - Cement:Additive:Additive.Dose)\n```\n\n使用以下命令检查新模型的公式：\n\
  \n```\n> formula(concmodel2)\n```\n\n```\nDensity ~ Cement + Additive + Additive.Dose\
  \ + Cement:Additive +\n    Cement:Additive.Dose + Additive:Additive.Dose\n```\n\n\
  你可以看到，三阶交互项（`Cement:Additive:Additive.Dose`）现在已从模型中删除。\n\n### 逐步模型选择过程\n\n逐步模型选择过程是一类算法，旨在简化寻找既能解释大量变异性、又包含尽可能少项的模型的过程。在处理具有许多潜在项的大型模型时，它们非常有用。常见的逐步选择过程包括前向选择、后向消除和通用逐步选择。\n\
  \n`step` 函数允许你在 R 中执行前向、后向和逐步模型选择。该函数接受一个 `lm` 或 `glm` 模型对象作为输入，该对象应为你要从中选择项子集的完整模型。\n\
  \n假设你已经创建了一个大型模型，如下所示，其中总共包含十五个项：四个主效应、六个二阶交互项、四个三阶交互项和一个四阶交互项：\n\n```\n> model1\
  \ <- lm(resp ~ var1*var2*var3*var4, dataset)\n```\n\n创建模型后，使用以下命令执行逐步选择过程：\n\n```\n\
  > model2 <- step(model1)\n```\n\n默认情况下，`step` 函数使用通用逐步选择方法。若要使用后向或前向方法，可将 `direction`\
  \ 参数设置为 `\"backward\"` 或 `\"forward\"`：\n\n```\n> model2 <- step(model1, direction=\"\
  backward\")\n```\n\n新创建的模型对象可以像其他任何模型对象一样使用。若要查看新模型中保留了哪些项，可使用 `formula` 函数：\n\n\
  ```\n> formula(model2)\n```\n\n**示例 11-7. 使用混凝土数据进行逐步选择**\n\n在示例 11-3 中，我们使用以下命令构建了\
  \ `concmod` 模型：\n\n```\n> concmodel <- lm(Density ~ Cement*Additive*Additive.Dose,\
  \ concrete)\n```\n\n若要对这个模型执行逐步选择过程，可使用以下命令：\n\n```\n> concmodel3 <- step(concmodel)\n\
  ```\n\n要查看最终模型的公式，可使用以下命令：\n\n```\n> formula(concmodel3)\n```\n\n```\nDensity ~\
  \ Cement + Additive + Additive.Dose + Cement:Additive\n```\n\n从输出中，你可以看到逐步选择过程已从模型中删除了三阶交互项以及两个二阶交互项，保留了水泥类型、添加剂类型和添加剂剂量的主效应，以及水泥类型与添加剂类型之间的交互项。\n\
  \n\n\n## 评估模型的拟合度\n\n在解释和使用模型之前，你需要确定它是否与数据良好拟合，并且是否包含一组良好的解释变量。你可能还在考虑多个备选模型来拟合数据，并希望比较它们。\n\
  \n### 模型拟合度\n\n模型的拟合度通常通过几种不同的方式来衡量。这些包括：\n\n-   **决定系数（`R²`）**：表明模型预测未来观测值的可能效果。它衡量了模型能够解释的数据总变异比例。其取值介于\
  \ 0 和 1 之间。接近 1 的值表明模型预测效果良好，而接近 0 的值则表明模型预测效果较差。\n-   **调整后的 `R 平方`**：与 `R²` 类似，但会根据模型中项的数量进行调整。\n\
  -   **模型系数的显著性检验**：告诉你单个系数估计值是否显著不为 0，从而判断这些系数是否对模型有贡献。考虑移除 p 值大于 0.05 的系数。\n- \
  \  **`F 检验`**：告诉你模型是否比使用总体均值进行预测显著更好。对于良好的模型，p 值应小于 0.05。`F 检验` 也可用于比较两个模型。在这种情况下，p\
  \ 值小于 0.05 表明更复杂的模型显著优于更简单的模型。\n\n要查看模型的一些汇总统计量，请使用 `summary` 函数：\n\n```\n> summary(lmobject)\n\
  ```\n\n`summary` 函数会显示：\n\n-   模型公式\n-   残差的分位数\n-   系数估计值及其标准误差和显著性检验\n-   残差标准误差和自由度\n\
  -   `R²`（多重 R 平方和调整后的 R 平方）\n-   用于模型拟合度的 `F 检验`\n\n请注意，如果你使用 `glm` 函数而不是 `lm` 函数构建模型，输出将略有不同，并将使用广义线性模型的术语。\n\
  \n要查看模型的 ANOVA 表（该表展示了 `F 检验` 背后的计算过程），请使用 `anova` 函数：\n\n```\n> anova(lmobject)\n\
  ```\n\n你也可以使用 `anova` 函数执行 `F 检验` 来比较一个更复杂的模型和一个更简单的模型（模型的顺序不重要）：\n\n```\n> anova(model1,\
  \ model2)\n```\n\n这仅适用于嵌套模型。也就是说，较简单模型中的所有项也必须在更复杂的模型中存在。\n\n#### 示例 11-8：`treemodel`\
  \ 模型的汇总统计量\n\n在示例 11-1 中，我们创建了一个简单的线性回归模型，用树的周长预测树的体积，并将输出保存到一个名为 `treemodel` 的对象中。\n\
  \n要查看模型的汇总统计量，请使用命令：\n\n```\n> summary(treemodel)\n```\n\n这将给出以下输出：\n\n```\nCall:\n\
  lm(formula = Volume ~ Girth, data = trees)\n\nResiduals:\n   Min     1Q Median \
  \    3Q    Max\n-8.065 -3.107  0.152  3.495  9.587\n\nCoefficients:\n          \
  \  Estimate Std. Error t value Pr(>|t|)\n(Intercept) -36.9435     3.3651  -10.98\
  \ 7.62e-12 ***\nGirth         5.0659     0.2474   20.48  < 2e-16 ***\n---\nSignif.\
  \ codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\nResidual standard error:\
  \ 4.252 on 29 degrees of freedom\nMultiple R-squared:  0.9353,    Adjusted R-squared:\
  \  0.9331\nF-statistic: 419.4 on 1 and 29 DF,  p-value: < 2.2e-16\n```\n\n`R²` 值为\
  \ 0.9353，告诉我们该模型解释了树的体积中大约 94% 的变异。这表明该模型在预测树的体积方面会非常出色。\n\n模型系数的假设检验告诉我们，截距和周长系数显著不为\
  \ 0。\n\n`F 检验` 的 p 值小于 0.05，这告诉我们模型解释了树的体积中很大一部分变异。\n\n要查看 ANOVA 表，请使用命令：\n\n```\n\
  > anova(treemodel)\nAnalysis of Variance Table\n\nResponse: Volume\n          Df\
  \ Sum Sq Mean Sq F value    Pr(>F)\nGirth      1 7581.8  7581.8  419.36 < 2.2e-16\
  \ ***\nResiduals 29  524.3    18.1\n---\nSignif. codes:  0 '***' 0.001 '**' 0.01\
  \ '*' 0.05 '.' 0.1 ' ' 1\n```\n\n输出显示了 `F 检验` 背后的计算过程。\n\n#### 示例 11-9：比较 `treemodel`\
  \ 和 `polytrees` 模型\n\n假设你想比较 `treemodel`（在示例 11-1 中创建的简单线性回归模型）和 `polytrees`（在示例\
  \ 11-4 中创建的多项式回归模型），以确定 `polytrees` 模型中的额外多项式项是否显著改善了模型的拟合度。\n\n要执行 `F 检验` 来比较这两个模型，请输入命令：\n\
  \n```\n> anova(treemodel, polytrees)\nAnalysis of Variance Table\n\nModel 1: Volume\
  \ ~ Girth\nModel 2: Volume ~ Girth + I(Girth²)\n  Res.Df    RSS Df Sum of Sq   \
  \   F    Pr(>F)\n1     29 524.30\n2     28 311.38  1    212.92 19.146 0.0001524\
  \ ***\n---\nSignif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n```\n\
  \n从结果可以看出，p 值 0.0001524 小于 0.05。这意味着 `polytrees` 模型对数据的拟合度显著优于 `treemodel` 模型。\n\
  \n### 系数估计值\n\n系数估计值（或参数估计值）会在汇总输出中提供，但你也可以使用 `coef` 函数或与之相同的 `coefficients` 函数来查看它们：\n\
  \n```\n> coef(lmobject)\n```\n\n要查看系数估计值的置信区间，请使用 `confint` 函数：\n\n```\n> confint(lmobject)\n\
  ```\n\n该函数默认给出 95% 的置信区间，但你可以通过 `level` 参数进行调整：\n\n```\n> confint(lmobject, level=0.99)\n\
  ```\n\n#### 示例 11-10：`treemodel` 模型的系数估计值\n\n要查看 `treemodel` 模型的系数估计值，请使用命令：\n\n\
  ```\n> coef(treemodel)\n(Intercept)       Girth\n-36.943459    5.065856\n```\n\n\
  要查看系数估计值的置信区间，请使用命令：\n\n```\n> confint(treemodel)\n                2.5 %     97.5\
  \ %\n(Intercept) -43.825953 -30.060965\nGirth         4.559914   5.571799\n```\n\
  \n从输出中可以看出，截距的 95% 置信区间为 –43.83 到 –30.06，`Girth` 系数的 95% 置信区间为 4.56 到 5.57。\n\n\n\
  \n## 绘制最佳拟合线\n\n对于简单线性回归模型，你可以在数据上叠加一条最佳拟合线来创建散点图，以帮助可视化模型。使用 `plot` 和 `abline`\
  \ 函数：\n\n```\n> plot(resp ∼ var1, dataset)\n```\n\n```\n> abline(coef(lmobject))\n\
  ```\n\n有关使用 `plot` 函数创建散点图的更多详细信息，请参见第 8 章中的“散点图”部分；有关使用 `abline` 函数添加直线的更多信息，请参见第\
  \ 9 章中的“添加直线”部分。\n\n对于多项式回归模型，你可以在数据上叠加一条多项式曲线。使用 `curve` 函数（请参见第 8 章中的“绘制函数”部分）。\n\
  \n**示例 11-11. TREEMODEL 模型带最佳拟合线的散点图**\n\n要为 `treemodel` 创建带最佳拟合线的散点图，请使用以下命令：\n\
  \n```\n> plot(Volume∼Girth, trees)\n```\n\n```\n> abline(coef(treemodel))\n```\n\
  \n结果如图 11-2 所示。\n\n![A978-1-4842-0139-8_11_Fig2_HTML.jpg](img/A978-1-4842-0139-8_11_Fig2_HTML.jpg)\n\
  \n图 11-2. 叠加了简单线性回归模型的散点图\n\n**示例 11-12. POLYTREES 模型带多项式曲线的散点图**\n\n在示例 11-4 中，我们创建了一个名为\
  \ `polytrees` 的多项式回归模型，用于根据树木周长预测树木体积。要查看 `polytrees` 模型的系数，请使用 `coef` 函数：\n\n```\n\
  > coef(polytrees)\n(Intercept)       Girth  I(Girth²)\n10.7862655  -2.0921396  \
  \ 0.2545376\n```\n\n要创建叠加曲线的散点图，请使用 `curve` 函数：\n\n```\n> plot(Volume∼Girth, trees)\n\
  ```\n\n```\n> curve(10.7863-2.0921*x+0.2545*x², add=T)\n```\n\n图 11-3 显示了结果。\n\n\
  ![A978-1-4842-0139-8_11_Fig3_HTML.jpg](img/A978-1-4842-0139-8_11_Fig3_HTML.jpg)\n\
  \n图 11-3. 叠加了多项式回归模型的散点图\n\n## 模型诊断\n\n本节讨论用于检查模型对数据的适用性以及系数估计可靠性的方法。这些方法包括检查模型残差，以及诸如杠杆值和每个观测值的\
  \ Cook 距离等影响度量。\n\n### 残差分析\n\n给定模型的残差是响应变量的观测值与模型预测值（拟合值）之间的一组差值。标准化残差和学生化残差是经过调整使其方差为\
  \ 1 的残差类型。\n\n检查模型的残差集有助于你确定模型是否合适。如果满足一般线性模型的假设，那么残差将呈正态分布并具有恒定方差。它们也将是独立的，并且不会遵循任何可观察到的模式。残差还能帮助你识别对模型影响较大的任何观测值。\n\
  \n要计算模型的原始残差，请使用 `residuals` 函数。还有一个相同的函数叫做 `resid`。要计算标准化残差，请使用 `rstandard` 函数；对于学生化残差，请使用\
  \ `rstudent` 函数：\n\n```\n> residuals(lmobject)\n```\n\n你可以将残差保存到数据集中的一个新变量中，如下所示。如果你想绘制残差与响应变量或解释变量的关系图，这会很有用：\n\
  \n```\n> dataset$resids <- rstudent(lmobject)\n```\n\n类似地，你可以使用 `fitted` 函数创建一个包含拟合值的新变量：\n\
  \n```\n> dataset$fittedvals <- fitted(lmobject)\n```\n\n绘制残差图是检查模型假设是否被违反的最简单方法。残差的正态概率图或直方图将帮助你确定残差是否呈正态分布。残差与拟合值的关系图以及残差与解释变量的关系图将允许你检查方差是否恒定。如果不是，你会看到一个类似图\
  \ 11-4a 中所示的漏斗形状。这些图还能帮助你发现残差中的模式，如图 11-4b 所示。\n\n![A978-1-4842-0139-8_11_Fig4_HTML.jpg](img/A978-1-4842-0139-8_11_Fig4_HTML.jpg)\n\
  \n图 11-4. 提示模型存在问题的残差图\n\n你可以使用 `plot` 函数为模型对象创建残差图：\n\n```\n> plot(lmobject, which=1)\n\
  ```\n\n使用 `which` 参数从以下图形中选择：\n\n- 残差与拟合值\n- 残差的正态概率图\n- 尺度-位置图\n- 残差与杠杆值\n\n这里我省略了选择影响度量图的数字\
  \ 4 和 6，因为你将在下一节中学习它们。\n\n还可以创建其他一些有用的残差图：\n\n- 用于检查正态性假设的残差直方图：\n```\n> hist(dataset$resids)\n\
  ```\n\n- 残差与响应变量的关系图：\n```\n> plot(resids ∼ resp, dataset)\n```\n\n- 残差与解释变量的关系图：\n\
  ```\n> plot(resids ∼ var1, dataset)\n```\n\n**示例 11-13. TREEMODEL 模型的残差图**\n\n假设你希望分析\
  \ `treemodel` 模型的残差，以检查模型的假设是否得到满足。\n\n首先，将学生化残差保存到 `trees` 数据集中：\n\n```\n> trees$Resids\
  \ <- rstudent(treemodel)\n```\n\n接下来，按照第 9 章中“绘图区域中的多个图形”部分的说明，设置图形设备以显示六个图形：\n\n\
  ```\n> par(mfrow=c(3,2))\n```\n\n然后，使用相关命令创建以下图形：残差直方图；残差的正态概率图；残差与拟合值；残差与响应变量（`Volume`）；残差与解释变量（`Girth`）；残差与其他感兴趣的变量（`Height`）：\n\
  \n```\n> hist(trees$Resids)\n> plot(treemodel, which=2)\n> plot(treemodel, which=1)\n\
  > plot(Resids∼Volume, trees)\n> plot(Resids∼Girth, trees)\n> plot(Resids∼Height,\
  \ trees)\n```\n\n图 11-5 显示了结果。\n\n![A978-1-4842-0139-8_11_Fig5_HTML.jpg](img/A978-1-4842-0139-8_11_Fig5_HTML.jpg)\n\
  \n图 11-5. `treemodel` 模型的残差图\n\n从直方图和正态概率图可以看出，残差近似正态分布。\n\n在残差与拟合值的关系图以及残差与周长的关系图中，我们可以看到残差中存在轻微的模式。对于中等周长的树木，残差往往为负值；而对于周长非常小或非常大的树木，残差则为正值。这表明向模型添加多项式项可能会改善拟合效果。\n\
  \n残差与体积和高度的关系图中没有明显的模式。所有图中也没有明显的异常值。\n\n### 杠杆值\n\n杠杆值有助于识别解释变量中具有异常值或异常组合的观测值。较大的杠杆值表明该观测值可能对模型有很大影响。\n\
  \n要计算给定模型中每个观测值的杠杆值，请使用 `hatvalues` 函数：\n\n```\n> hatvalues(lmobject)\n```\n\n要创建残差与杠杆值的关系图，请使用命令：\n\
  \n```\n> plot(lmobject, which=5)\n```\n\n要创建 Cook 距离与杠杆值的关系图，请使用命令：\n\n```\n> plot(lmobject,\
  \ which=6)\n```\n\n\n\n### 库克距离\n\n一个观测值的库克距离衡量了在模型估计前移除该观测值时，模型参数的变化程度。值越大表明该观测值对模型的影响越大。\n\
  \n要计算模型的库克距离，请使用 `cooks.distance` 函数：\n\n```\n> cooks.distance(lmobject)\n```\n\n\
  你可以使用以下命令创建库克距离相对于观测序号的图：\n\n```\n> plot(lmobject, which=4)\n```\n\n以及使用以下命令创建库克距离相对于杠杆值的图：\n\
  \n```\n> plot(lmobject, which=6)\n```\n\n**示例 11-14. 树模型的杠杆值与库克距离**\n\n假设你想为 `treemodel`\
  \ 回归模型创建一组图，以帮助识别可能对模型有较大影响的任何观测值。\n\n首先设置图形设备以容纳四个图（参见第 9 章中的“在绘图区域绘制多个图”）：\n\n\
  ```\n> par(mfrow=c(2,2))\n```\n\n然后创建三个显示杠杆值和库克距离的图：\n\n```\n> plot(treemodel, which=4)\n\
  > plot(treemodel, which=5)\n> plot(treemodel, which=6)\n```\n\n结果如图 11-6 所示。\n\n\
  ![A978-1-4842-0139-8_11_Fig6_HTML.jpg](img/A978-1-4842-0139-8_11_Fig6_HTML.jpg)\n\
  \n**图 11-6.** `treemodel` 模型的影响图\n\n第二个图（残差 vs. 杠杆值）上的等高线划分了具有相似库克距离的区域。第三个图（库克距离\
  \ vs. 杠杆值）上的等高线划分了具有相似标准化残差的区域。\n\n所有三个图都显示观测序号 31 具有较大的库克距离和杠杆值，同时标准化残差也相当大。这表明该观测值对模型有较大影响，应进一步调查。\n\
  \n### 进行预测\n\n一旦你构建了一个满意的模型，你可能希望用它来对新数据进行预测。R 提供了一个便捷的预测函数，名为 `predict`。要使用此函数，新数据必须组织在数据框中（有关如何创建数据框，请参见第\
  \ 2 章中的“直接输入数据”）。新数据集中的解释变量应使用与构建模型所用原始数据集相同的名称。变量的顺序不同或存在额外的变量都没有关系。\n\n当你的新数据组织在数据框中后，就可以使用\
  \ `predict` 函数：\n\n```\n> predict(lmobject, newdata)\n```\n\n该命令会创建一个与数据框各行相对应的预测值向量。你可以将其作为一个新变量附加到数据框中：\n\
  \n```\n> newdata$predictedvalues <- predict(lmobject, newdata)\n```\n\n你还可以使用 `predict`\
  \ 函数来计算预测的置信区间或预测区间。回顾一下，置信区间仅考虑模型估计的不确定性，而预测区间还考虑了响应变量中自然的随机变异。\n\n要计算置信区间，请将 `interval`\
  \ 参数设置为 `\"confidence\"`；要计算预测区间，则将其设置为 `\"prediction\"`。你可以使用 `level` 参数调整区间的大小：\n\
  \n```\n> predict(lmobject, newdata, interval=\"confidence\", level=0.99)\n```\n\n\
  **示例 11-15. 使用树模型进行预测**\n\n假设你想使用 `treemodel` 回归模型来估算三棵周长分别为 17.2、12.0 和 11.4 英寸的树的体积。\n\
  \n首先将新数据放入一个数据框中：\n\n```\n> newtrees <- data.frame(Girth=c(17.2, 12.0, 11.4))\n\
  ```\n\n要生成预测并将其添加到 `newtrees` 数据框中，请使用以下命令：\n\n```\n> newtrees$predictions <- predict(treemodel,\
  \ newtrees, interval=\"prediction\")\n```\n\n然后查看数据集的内容：\n\n```\n> newtrees\n  Girth\
  \ predictions.fit predictions.lwr predictions.upr\n1  17.2        50.18927     \
  \   41.13045        59.24809\n2  12.0        23.84682        14.98883        32.70481\n\
  3  11.4        20.80730        11.92251        29.69210\n```\n\n从输出中可以看出，对于周长为 17.2\
  \ 英寸的树，预测体积为 50.2 立方英尺，预测区间为 41.1 至 59.2 立方英尺。\n\n### 总结\n\n现在，你应该能够构建包含因子变量、多项式项以及交互项（在适当情况下）的一般线性模型，并解释模型系数。你应该能够从现有模型中添加或删除项，并应用逐步模型选择程序。你应该能够评估模型与数据的拟合程度，并使用模型诊断来确定模型是否有效。对于简单线性回归和多项式回归模型，你应该能够以图形方式呈现模型。最后，你还应该能够使用你的模型对未来的观测值进行预测。\n\
  \n下表总结了所涉及的主要命令。\n\n| 任务 | 命令 |\n| --- | --- |\n| 构建简单线性回归模型 | `lm(resp ~ var1,\
  \ dataset)` |\n| 构建多元回归模型 | `lm(resp ~ var1 + var2 + var3, dataset)` |\n| 构建含交互项的模型\
  \ | `lm(resp ~ var1 + var2 + var1:var2, dataset)` |\n| 构建含给定阶数交互项的模型 | `lm(resp\
  \ ~ (var1 + var2 + var3)², dataset)` |\n| 构建因子模型 | `lm(resp ~ var1 * var2 * var3,\
  \ dataset)` |\n| 构建多项式回归模型 | `lm(resp ~ var1 + I(var1²) + I(var1³), dataset)` |\n\
  | 构建响应变量对数变换的模型 | `lm(log(resp) ~ var1 + var2 + var3, dataset)` |\n| 构建不含截距项的模型\
  \ | `lm(resp ~ -1 + var1 + var2 + var3, dataset)` |\n| 构建空模型 | `lm(resp ~ 1, dataset)`\
  \ |\n| 更新模型 | `update(lmobject, .~. + var4)` |\n| 逐步选择 | `step(lmobject)` |\n| 汇总模型\
  \ | `summary(lmobject)` |\n| 系数估计值 | `coef(lmobject)` |\n| 系数估计值的置信区间 | `confint(lmobject)`\
  \ |\n| 绘制最佳拟合线 | `plot(resp ~ var1, dataset)` `abline(coef(lmobject))` |\n| 原始残差\
  \ | `residuals(lmobject)` |\n| 标准化残差 | `rstandard(lmobject)` |\n| 学生化残差 | `rstudent(lmobject)`\
  \ |\n| 拟合值 | `fitted(lmobject)` |\n| 残差及影响图 | `plot(lmobject, which=1)` |\n| 杠杆值\
  \ | `hatvalues(lmobject)` |\n| 库克距离 | `cooks.distance(lmobject)` |\n| 预测值 | `predict(lmobject,\
  \ newdata)` |\n\n现在，你已经掌握了执行最常见类型统计分析所需的一切知识。对于好奇的读者，附录 A 将解释如何通过使用附加包来访问额外功能。\n\
  \n### 附加包\n\nR 有超过五千个附加包可供使用，它们服务于各种不同的目的。附加包包含额外的函数，有时也包含如示例数据集等对象。本附录将解释如何找到符合你目的的包并进行安装。\n\
  \n\n\n### 查看可用附加包列表\n\n要查看可用附加包的列表，请按照以下步骤操作：\n\n访问 R 项目网站 [`www.r-project.org`](http://www.r-project.org/)。点击\
  \ CRAN 链接（位于页面左侧）。您将进入一个托管 R 安装文件的站点列表（镜像站点），如图 A-1 所示。选择一个离您较近的站点。从左侧菜单中选择 `Packages`。选择\
  \ `Table of available packages`（按名称排序）。\n\n![A978-1-4842-0139-8_12_Fig1_HTML.jpg](img/A978-1-4842-0139-8_12_Fig1_HTML.jpg)\n\
  \n图 A-1. 镜像站点列表\n\n页面会显示一个包含软件包及其用途描述的列表，如图 A-2 所示。您可以使用浏览器工具搜索该列表，通常通过按 `Ctrl+F`\
  \ 或 `Cmd+F` 进行。\n\n![A978-1-4842-0139-8_12_Fig2_HTML.jpg](img/A978-1-4842-0139-8_12_Fig2_HTML.jpg)\n\
  \n图 A-2. 按名称排序的可用软件包列表\n\n选择适合的软件包后，您将看到软件包信息页面，如图 A-3 所示。在此页面上，您可以找到该软件包功能的说明，以及\
  \ PDF 格式的参考手册。您会注意到该软件包可供下载，但无需自行下载，因为从 R 环境内部安装更为简便。\n\n![A978-1-4842-0139-8_12_Fig3_HTML.jpg](img/A978-1-4842-0139-8_12_Fig3_HTML.jpg)\n\
  \n图 A-3. `lme4` 软件包信息页面\n\n### 安装和加载附加包\n\n要使用附加包，必须先安装它（只需安装一次）。R 基础安装中包含了许多软件包（例如我们在第\
  \ 2 章中使用的 `foreign` 包），这些包无需安装。\n\n软件包安装完成后，必须加载才能使用其中的函数。这些函数将在当前会话的剩余时间内可用，因此每次需要使用该包时，都需要在会话中加载它。\n\
  \n您可以在 R 环境内部安装和加载软件包，以下将分别为 Windows、Mac 和 Linux 用户进行说明。\n\n#### Windows 用户\n\n\
  安装软件包：\n\n从 `Package` 菜单中选择 `Install Package(s)`。首次安装软件包时，系统会提示选择一个镜像站点，如图 A-4 所示。选择一个离您较近的站点。根据提示，从列表中选择所需的软件包，如图\
  \ A-5 所示。\n\n![A978-1-4842-0139-8_12_Fig4_HTML.jpg](img/A978-1-4842-0139-8_12_Fig4_HTML.jpg)\n\
  \n图 A-4. 选择镜像站点（Windows）\n\n![A978-1-4842-0139-8_12_Fig5_HTML.jpg](img/A978-1-4842-0139-8_12_Fig5_HTML.jpg)\n\
  \n图 A-5. 选择要安装的软件包（Windows）\n\n加载软件包：\n\n从 `Packages` 菜单中选择 `Load Package`。根据提示，从列表中选择所需的软件包。\n\
  \n#### Mac 用户\n\n安装软件包：\n\n从 `Packages & Data` 菜单中选择 `R Package Installer`。当 `R\
  \ Package Installer` 出现时，按下 `Get List`。软件包列表将显示出来。从列表中选择所需的软件包，然后勾选 `Install Dependencies`\
  \ 复选框，并按下 `Install Selected`，如图 A-6 所示。关闭窗口。\n\n![A978-1-4842-0139-8_12_Fig6_HTML.jpg](img/A978-1-4842-0139-8_12_Fig6_HTML.jpg)\n\
  \n图 A-6. 选择要安装的软件包（Mac）\n\n加载软件包：\n\n从 `Packages & Data` 菜单中选择 `R Package Manager`。\n\
  \n> **注意**：Mac 版 R 3.1.0 存在一个问题，可能导致您无法打开 Package Manager。如果遇到此问题，可以从 [`http://r.research.att.com/`](http://r.research.att.com/)\
  \ 下载修补版本。此问题应在 3.1.1 及更高版本中解决。\n\n点击所需软件包旁边的 `Status` 框，将状态更改为 `Loaded`，如图 A-7 所示。\n\
  \n![A978-1-4842-0139-8_12_Fig7_HTML.jpg](img/A978-1-4842-0139-8_12_Fig7_HTML.jpg)\n\
  \n图 A-7. 加载软件包（Mac）\n\n#### Linux 用户\n\n安装软件包：\n\n输入以下命令：\n\n```\n> download.packages(packagename,\
  \ \"/home/Username/folder\")\n```\n\n文件路径指定保存软件包的位置。根据提示，选择一个离您较近的镜像站点。\n\n加载软件包，输入以下命令：\n\
  \n```\n> install.packages(\"packagename\")\n```\n\n"
- "# R 基础编程\n\nR 不仅是一个统计计算环境，也是一门编程语言。R 编程的主题超出了本书的范围。不过，本章将简要介绍基础编程和编写自定义函数。\n\n\
  编程时，请使用脚本文件，以便轻松编辑代码。记得使用井号（`#`）添加充分的注释，以便您的脚本能被他人或未来的自己理解。\n\n\n\n### 创建新函数\n\n\
  在本书中，你将使用到许多 R 语言的内置函数，但你也可以创建自己的函数。创建自定义函数可以让你将一组执行特定任务、且需要重复使用的命令整洁地打包在一起。\n\n\
  要创建新函数，脚本通常遵循以下通用格式：\n\n```\nfunctionname <- function(arg1name, arg2name, ..., argNname)\
  \ {\n  command(s)\n  return(outputvalue)\n}\n```\n\n所有的缩进和额外的空行都是可选的，但它们有助于展示程序的层级结构，并且被认为是良好的编程习惯。\n\
  \n第一行决定了函数名称以及输入参数的名称。你可以根据需要包含任意数量的参数，也可以不包含任何参数。此外，你还可以为参数赋默认值：\n\n```\nfunctionname\
  \ <- function(arg1name = value1, arg2name = value2, ..., argNname = valueN) {\n\
  \  command(s)\n  return(outputvalue)\n}\n```\n\n脚本的第一行以左花括号结尾。在此之后，函数的主体内容开始。通常，这是一组以某种方式操作输入参数或基于它们执行计算，从而生成输出值的命令。这些命令可以利用现有函数，包括你自己编写的任何函数。请注意，在函数内部创建的任何对象仅存在于函数内部，并不会保存到工作空间中。\n\
  \n`return` 函数决定了函数的输出值，该值要么显示在控制台中，要么在函数被调用时赋值给一个对象。它可以是字面量值（如数字或字符串），也可以是向量、数据框或任何其他类型的对象。\n\
  \n你还可以在最后一个命令中使用 `print` 函数来代替 `return` 函数，该函数始终会将输出显示在控制台窗口中，即使输出被赋值给了某个对象。另一种情况是，你可能希望创建一个用于生成图表的函数，而不是返回一个输出值。在这种情况下，最后的命令将是\
  \ `plot` 或其他绘图函数。\n\n最后，脚本以右花括号结束。\n\n当你编写好函数并运行脚本后，该函数会作为对象保存到工作空间中，并在当前工作空间加载期间随时可用。你可以像使用内置函数一样使用它：\n\
  \n```\n> functionname(value1, value2, ..., valueN)\n```\n\n#### 示例 B-1：计算一个数值立方根的函数\n\
  \n以下脚本创建了一个简单的函数，它接受单个数值作为输入，并计算其立方根：\n\n```\ncube.root <- function(x) {\n  y <-\
  \ x^(1/3)\n  return(y)\n}\n```\n\n尝试将函数输入到脚本文件中并运行程序。请注意，在 Windows 环境下运行脚本文件时，需要高亮你想要运行的文本，然后右键点击并选择“运行行或选定内容”（Run\
  \ line or selection），如图 B-1 所示。或者，你也可以高亮文本后点击“运行”（Run）按钮。Mac 用户应高亮文本，然后按下 Cmd+Return。\n\
  \n![A978-1-4842-0139-8_13_Fig1_HTML.jpg](img/A978-1-4842-0139-8_13_Fig1_HTML.jpg)\n\
  \n图 B-1. 在脚本文件中输入程序并运行（Windows 环境）\n\n编写好函数并运行脚本后，`cube.root` 函数即可使用：\n\n```\n>\
  \ cube.root(5)\n[1] 1.709976\n```\n\n#### 示例 B-2：计算三角形斜边长的函数\n\n以下脚本创建了一个简单的函数，它根据三角形另外两条边的长度计算斜边长（公式为\
  \ c² = a² + b²）：\n\n```\nhypot <- function(a=2, b=3) {\n  c <- sqrt(a² + b²)\n \
  \ return(c)\n}\n```\n\n编写好函数并运行脚本后，你可以使用它：\n\n```\n> hypot(6, 7)\n[1] 9.219544\n\
  ```\n\n由于参数已经被赋予了默认值，即使缺少一个或两个参数，函数也能正常工作：\n\n```\n> hypot(b=2)\n[1] 2.828427\n\
  ```\n\n#### 示例 B-3：生成随机数直方图的函数\n\n以下脚本创建了一个函数，该函数从标准正态分布中生成指定数量的随机数，并将它们绘制成直方图：\n\
  \n```\nrandhist <- function(n) {\n  vector1 <- rnorm(n)      # 生成 n 个随机数\n  # 将随机数绘制成直方图，添加标题并移除\
  \ x 轴标签：\n  hist(vector1, main=\"来自标准正态分布的随机样本直方图\", xlab=\"\")\n}\n```\n\n编写好函数并运行脚本后，你可以使用它：\n\
  \n```\n> randhist(50)\n```\n\n结果应类似于图 B-2。\n\n![A978-1-4842-0139-8_13_Fig2_HTML.jpg](img/A978-1-4842-0139-8_13_Fig2_HTML.jpg)\n\
  \n图 B-2. 由 `randhist` 函数创建的直方图\n\n#### 条件语句\n\n回顾示例 B-1 中创建的 `cube.root` 函数。如果你尝试输入一个负数，会得到如下结果：\n\
  \n```\n> cube.root(-5)\n[1] NaN\n```\n\n如果函数能够返回一条错误信息，向用户解释问题所在，那就好了。为了实现这一点，函数需要根据用户输入的是正数还是负数，表现出不同的行为。这正是条件语句可以做到的。\n\
  \n条件语句允许你仅在特定条件满足时执行某个命令或一组命令。条件语句为函数增加了灵活性，因为它们允许函数根据不同的输入表现出不同的行为。\n\n有几种类型的条件语句可以实现略有不同的功能。在了解它们之前，你需要先理解条件以及它们在\
  \ R 中是如何构建的。\n\n\n#### 条件\n\n在编程中，条件是一个可以为真或假的表达式。例如，条件 `4 < 5`（4 小于 5）为真，而条件 `5\
  \ == 8`（5 等于 8）为假。\n\n如果你在命令提示符下输入一个条件，R 会告诉你它是真还是假：\n\n```\n> 6 > 8\n[1] FALSE\n\
  ```\n\n一个条件必须至少包含一个比较运算符（也称为关系运算符）。在前面的例子中，比较运算符是 `>`（大于）。表 B-1 列出了可用于构成条件的比较运算符。\n\
  \n**表 B-1. 比较运算符**\n\n| 运算符 | 含义 |\n| --- | --- |\n| `==` | 等于 |\n| `<` | 小于 |\n\
  | `<=` | 小于或等于 |\n| `>` | 大于 |\n| `>=` | 大于或等于 |\n| `%in%` | 属于 |\n\n`%in%` 运算符将一个单一值与向量的所有成员进行比较：\n\
  \n```\n> vector1 <- c(4, 2, 1, 6)\n> 2 %in% vector1\n[1] TRUE\n```\n\n只包含常量的条件用处不大，因为我们事先已经知道它们是真还是假。更有用的是包含对象的条件，例如\
  \ `object1 < 5`（`object1` 的值小于 5）。该条件是否为真取决于 `object1` 的值：\n\n```\n> object1 <-\
  \ 4\n> object1 < 5\n[1] TRUE\n```\n\n你可以使用 OR 和 AND 运算符将两个或多个条件连接起来，形成一个更大的条件。\n\
  \nAND 运算符用 `&` 表示。当两个表达式用 AND 运算符连接时，必须两者都为真，整个条件才为真。例如，以下条件为假，因为只有一个表达式为真：\n\n\
  ```\n> 3 < 5 & 7 < 5\n[1] FALSE\n```\n\n这个语句为真，因为两个表达式都为真：\n\n```\n> 3 < 5 & 7 >\
  \ 5\n[1] TRUE\n```\n\nOR 运算符用 `|` 表示。当两个表达式用 OR 运算符连接时，只要其中一个或两个表达式为真，整个条件就为真。例如，以下条件为真，因为其中一个表达式为真：\n\
  \n```\n> 3 < 5 | 7 < 5\n[1] TRUE\n```\n\n当两个表达式都为真时，条件也为真：\n\n```\n> 3 < 5 | 7 >\
  \ 5\n[1] TRUE\n```\n\n你可以使用 `!` 运算符对条件取反。这会将条件的结果反转：\n\n```\n> !3 < 5\n[1] FALSE\n\
  ```\n\n如果条件很复杂，你可以使用括号对整个条件取反：\n\n```\n> !(3 < 5 & 7 < 5)\n[1] TRUE\n```\n\n#####\
  \ If 语句\n\n条件语句最简单的形式是 if 语句。if 语句由一个条件和一个命令组成。当 R 运行 if 语句时，它首先检查条件是真还是假。如果条件为真，则运行该命令；如果条件为假，则不运行。该语句的一般形式如下所示：\n\
  \n```\nif (condition) command\n```\n\n你也可以通过在 if 语句中将一组命令放在大括号内来包含它们：\n\n```\nif\
  \ (condition) {\n     commands to be performed if condition is true\n}\n```\n\n\
  if 语句作为函数的一部分非常有用，如下面的示例所示。\n\n**示例 B-4. 计算一个值的立方根的函数（更新版）**\n\n此脚本创建了示例 B-1 中 `cube.root`\
  \ 函数的更新版本，如果用户输入负数，该函数会返回一条警告消息。请注意，它使用了 `warning` 函数来打印警告消息。R 也有一个名为 `stop` 的函数，该函数会导致函数中止并打印错误消息：\n\
  \n```\ncube.root <- function(x) {\n     y <- x^(1/3)                      # 计算立方根\n\
  \     # 如果用户输入负数，打印警告消息：\n     if (x < 0) warning(\"Cannot calculate cube root of\
  \ negative number\")\n     return(y)\n}\n```\n\n更新后的函数仅在用户输入负数时返回警告消息：\n\n```\n\
  > cube.root(5)\n[1] 1.709976\n> cube.root(-5)\n[1] NaN\nWarning message:\nIn cube.root(-5)\
  \ : Cannot calculate cube root of negative number\n```\n\n**示例 B-5. 一个计算身体质量指数的函数**\n\
  \n一个人的身体质量指数（BMI）是根据其身高（米）和体重（千克）使用公式计算的：BMI = 体重 / 身高²。如果使用英制单位（身高以英寸计，体重以磅计），公式为：BMI\
  \ = 体重 × 702 / 身高²。\n\n此脚本创建一个根据身高和体重计算 BMI 的函数。默认情况下，该函数假定使用了公制测量值来计算 BMI。如果用户将\
  \ `units` 参数设置为 `\"imperial\"`，则该函数会进行相应的调整以适用于英制测量值。请注意使用 if 语句来控制是否进行此调整：\n\n\
  ```\nbmi <- function(height, weight, units = \"metric\") {\n     bmi <- weight /\
  \ height²                  # 计算 BMI\n     if (units == \"imperial\") bmi <- bmi\
  \ * 702   # 调整为英制测量值\n     return(bmi)\n}\n```\n\n脚本运行后，你可以使用该函数使用公制测量值计算 BMI：\n\
  \n```\n> bmi(1.7, 70)\n[1] 24.22145\n```\n\n或使用英制测量值：\n\n```\n> bmi(66, 125, \"\
  imperial\")\n[1] 20.17332\n```\n\n##### If/else 语句\n\nif/else 语句扩展了 if 语句，如果条件为假，则执行第二个命令（或命令集）。一般形式如下所示：\n\
  \n```\nif (condition) command1 else command2\n```\n\n你可以将命令组放在大括号之间：\n\n```\nif\
  \ (condition) {\n     commands to be performed if condition is true\n} else {\n\
  \     commands to be performed if condition is false\n}\n```\n\n你也可以扩展 if/else 语句以适应三个或更多可能的结果：\n\
  \n```\nif (condition1) command1 else if (condition2) command2 else command3\n```\n\
  \n当运行该语句时，R 首先检查第一个条件是真还是假。如果为真，则运行第一个命令。如果第一个条件为假，则 R 继续检查第二个条件。如果第二个条件为真，则运行第二个命令。否则，运行最后一个命令。\n\
  \n**示例 B-6. 一个对日期进行分类的函数**\n\n此脚本创建一个函数，用于将日期（以 ddmmmyyyy 格式给出）分类为周末或工作日：\n\n```\n\
  day.type <- function(date) {\n     date1 <- as.Date(date, \"%d%b%Y\")     # 将日期转换为日期格式\n\
  \     # 判断日期是周末还是工作日并打印结果：\n     if (weekdays(date1) %in% c(\"Saturday\", \"Sunday\"\
  )) return (\"Weekend\") else return(\"Weekday\")\n}\n```\n\n该函数根据输入的日期是周末还是工作日给出不同的输出：\n\
  \n```\n> day.type(\"27JUN2014\")\n[1] \"Weekday\"\n> day.type(\"28JUN2014\")\n[1]\
  \ \"Weekend\"\n```\n\n**示例 B-7. 一个对身高进行分类的函数**\n\n此脚本创建一个函数，该函数以厘米为单位的身高作为输入，并给出身高类别作为输出。140\
  \ 厘米以下的身高归类为“矮”，140 厘米到 180 厘米之间的身高归类为“中等”，180 厘米以上的身高归类为“高”。\n\n```\nheightcat\
  \ <- function(height) {\n     if (height < 140) return(\"Short\") else if (height\
  \ < 180) return(\"Medium\")\nelse return(\"Tall\")\n}\n```\n\n脚本运行后，你可以使用该函数：\n\n\
  ```\n> heightcat(136)\n[1] \"Short\"\n> heightcat(187)\n[1] \"Tall\"\n```\n\n\n\n\
  ##### `switch` 函数\n\n在某些情况下，当存在多个可能的结果时，你可以使用`switch`函数作为`if/else`语句的紧凑替代方案。`switch`函数在一系列备选命令中进行选择，每个命令必须返回单个值。R\
  \ 将输入与一个选项列表进行比较，如果找到匹配项，则执行相应的命令。如果输入与任何选项都不匹配，则执行最后一个命令（可选）：\n\n```\n> switch(input,\
  \ option1 = command1, option2 = command2, option3 = command3, command4)\n```\n\n\
  `switch`函数还有另一种用法，它接受一个整数值作为输入，并输出值列表中对应的值：\n\n```\n> switch(input, value1, value2,\
  \ value3, value4)\n```\n\n**示例 B-8. 用两个数字执行选定计算的函数**\n\n此脚本创建了一个函数，允许用户提供两个数字和一个计算类型。`switch`函数用于根据用户选择的选项从多个命令中进行选择：\n\
  \n```\ncalculator<-function(number1, number2, calctype=\"add\") {\n\n     result<-switch(calctype,\n\
  \n          \"multiply\"=number1*number2,\n\n          \"divide\"=number1/number2,\n\
  \n          \"add\"=number1+number2,\n\n          \"subtract\"=number1-number2,\n\
  \n          \"exponent\"=number1^number2,\n\n          \"Invalid calculation type\"\
  \    # 涵盖所有其他可能性\n\n     )\n\n     return(result)\n\n}\n```\n\n脚本运行后，你可以使用该函数：\n\
  \n```\n> calculator(2, 3, \"divide\")\n[1] 0.6666667\n> calculator(2, 3, \"mean\"\
  )\n[1] \"Invalid calculation type\"\n```\n\n**示例 B-9. 返回星期名称的函数**\n\n此脚本创建了一个名为`week.day`的函数，该函数接受一个\
  \ 1 到 7 之间的数字作为输入，并返回一个表示对应星期几的字符串：\n\n```\nweek.day<-function(daynum) {\n\n   \
  \  dayname<-switch(daynum,\n\n          \"Monday\",\n\n          \"Tuesday\",\n\n\
  \          \"Wednesday\",\n\n          \"Thursday\",\n\n          \"Friday\",\n\n\
  \          \"Saturday\",\n\n          \"Sunday\"\n\n     )\n\n     return(dayname)\n\
  \n}\n```\n\n脚本运行后，你可以使用它：\n\n```\n> week.day(2)\n[1] \"Tuesday\"\n```\n\n### 循环\n\
  \n思考以下脚本，它创建了一个函数，该函数接受一个数字作为输入，将其分别乘以 1 到 10，并在控制台窗口中显示结果：\n\n```\ntimes.table<-function(x)\
  \ {\n\n     result<-x*1                                   # 计算 x*1 的结果\n\n     text<-paste(x,\
  \ \"times 1 equals\", result)      # 创建包含结果的字符串\n\n                            \
  \                       # 输出结果\n\n     print(text)                             \
  \      # 打印结果\n\n     # 对数字 2 到 10 重复：\n\n     Result<-x*2\n\n     text<-paste(x,\
  \ \"times 2 equals\", result)\n\n     print(text)\n\n     result<-x*3\n\n     text<-paste(x,\
  \ \"times 3 equals\", result)\n\n     print(text)\n\n     # 一直继续到 x*10\n\n}\n```\n\
  \n该函数将相同的三个命令重复了 10 次。如果你能只编写一次命令，然后告诉 R 对 1 到 10 的每个数字重复执行它们，效率会高得多。这就是循环发挥作用的地方。\n\
  \n循环允许你将一个命令（或一组命令）重复执行多次。两种最重要的循环类型是`for`循环和`while`循环。\n\n#### For 循环\n\n`for`循环允许你将一个命令或一组命令重复执行预先指定的次数。`for`循环的一般形式如下：\n\
  \n```\nfor (i in startvalue : endvalue) command\n```\n\n你不必使用`i`来表示重复次数。可以使用任何有效的对象名称；不过，习惯上使用`i`。`startvalue`和`endvalue`可以是常量值，也可以是对象名称。R\
  \ 会为从`startvalue`到`endvalue`的每个值重复执行该命令。\n\n或者，你也可以像下面这样提供一个非顺序的向量，甚至可以提供一个字符串向量。R\
  \ 会为向量中的每个值重复执行该命令一次。\n\n```\nfor i in c(5,7,8,2,11) command\n```\n\n你还可以将要重复执行的一组命令用花括号括起来：\n\
  \n```\nfor (i in startvalue : endvalue) {\n\n     commands to be repeated\n\n}\n\
  ```\n\n**示例 B-10. 计算乘法表的函数**\n\n此脚本创建了一个函数，该函数接受一个数字作为输入，将其分别乘以 1 到 10，并在控制台窗口中显示结果。`for`循环（以粗体显示）用于对\
  \ 1 到 10 的每个数字重复计算：\n\n```\ntimes.table<-function(x) {\n\n     for (i in 1:10) {\n\
  \n          result<-x*i                                   # 计算结果\n\n          #\
  \ 创建包含结果的字符串：\n\n          text<-paste(x, \"times\", i, \"equals\", result)\n\n\
  \          print(text)                                   # 打印结果\n\n     }\n\n}\n\
  ```\n\n脚本运行后，你可以使用该函数：\n\n```\n> times.table(5)\n[1] \"5 times 1 equals 5\"\n[1]\
  \ \"5 times 2 equals 10\"\n[1] \"5 times 3 equals 15\"\n[1] \"5 times 4 equals 20\"\
  \n[1] \"5 times 5 equals 25\"\n[1] \"5 times 6 equals 30\"\n[1] \"5 times 7 equals\
  \ 35\"\n[1] \"5 times 8 equals 40\"\n[1] \"5 times 9 equals 45\"\n[1] \"5 times\
  \ 10 equals 50\"\n```\n\n#### While 循环\n\n当你想要重复一个命令或一组命令直到满足给定条件，但事先不知道需要重复多少次才能达到此目的时，`while`循环是合适的。`while`循环的一般形式如下所示：\n\
  \n```\nwhile (condition) command\n```\n\n要包含一组命令，请使用花括号：\n\n```\nwhile (condition)\
  \ {\n\n     commands to be repeated\n\n}\n```\n\n循环内的命令应该执行一些会影响条件是否为真的操作。例如，以下脚本将持续打印`i`的值，直到它达到\
  \ 10，此时它将退出循环：\n\n```\ni<-1\nwhile (i<10) {\n\n     print(i)\n\n     i<-i+1\n\n\
  }\n```\n\n如果循环内的命令不影响条件是否为真，R 将无限期地持续处理这些命令。考虑以下示例：\n\n```\nb<-2\nwhile (b<3) {\n\
  \n     print(b)\n\n     a<-4\n\n}\n```\n\n由于循环内的命令与条件无关，因此每次重复循环时条件都为真。这会导致 R 无限地重复循环并停止响应。如果你发现\
  \ R 卡在重复执行某个循环，请按`Esc`键取消命令。\n\n**示例 B-11. 模拟掷骰子的函数**\n\n以下脚本创建了一个模拟掷骰子的函数。该函数持续掷虚拟骰子，直到掷出六点为止：\n\
  \n```\ndie.rolls<-function() {\n\n     roll<-0                   # 在循环中使用之前创建该对象\n\
  \n     while (roll!=6) {\n\n          roll<-sample(1:6, 1) # 生成一个介于 1 和 6 之间的随机数\n\
  \n          print(roll)\n\n     }\n\n}\n```\n\n脚本运行后，你可以使用该函数：\n\n```\n> die.rolls()\n\
  [1] 1\n[1] 1\n[1] 5\n[1] 6\n> die.rolls()\n[1] 1\n[1] 3\n[1] 3\n[1] 1\n[1] 3\n[1]\
  \ 6\n```\n\n\n\n### 总结\n\n现在您应该已经掌握了 R 语言编程的基础知识，并能创建简单的函数来执行日常任务。您应该能够通过使用适当的语句来执行条件判断，从而使程序更灵活，并使用循环来重复执行一组命令。\n\
  \n下表总结了所涵盖的主要语句。\n\n| 任务 | 常规形式 |\n| --- | --- |\n| 创建函数 | `functionname <- function(arguments)\
  \ { command(s) return(output) }` |\n| `if` 语句 | `if (condition) command` |\n| `if/else`\
  \ 语句 | `if (condition) command1 else command2` |\n| `if/else` 语句 (扩展) | `if (condition1)\
  \ command1 else if (condition2) command2 else command3` |\n| `switch` 函数 | `switch(input,\
  \ value1, value2, valueN)` |\n|  | `switch(input, option1 = command1, option2 =\
  \ command2, optionN = commandN)` |\n| `for` 循环 | `for (i in startval:endval) command`\
  \ |\n| `while` 循环 | `while (condition) command` |\n\n### 数据集\n\n本附录提供了本书中使用的每个示例数据集的详细信息和相关来源。这些数据集可作为\
  \ R 工作区文件或单独的 csv 文件随本书下载获取（`www.apress.com/9781484201404`）。\n\n### `apartments`\n\
  \n| 描述 | 2012 年 10 月在英国赫特福德郡毕晓普斯托福德五英里半径范围内广告出租的 32 套一居室公寓的详细信息。 |\n| 变量 | `Town`\
  \ | 公寓地点 |\n| `Furnished` | 提供家具（是或否） |\n| `Price.Cat` | 租金价格类别（每历月） |\n| 来源 | `www.rightmove.co.uk`\
  \ |\n| 使用章节 | 第六章 |\n\n### `bigcats`\n\n| 描述 | 四种大型猫科动物的平均体重 |\n| 变量 | `Name` |\
