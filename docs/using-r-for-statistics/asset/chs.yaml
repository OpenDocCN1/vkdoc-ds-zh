  ##### 数据编辑器


  作为在命令窗口中查看数据集的替代方案，R 提供了一个名为数据编辑器的电子表格风格查看器，允许你查看和编辑数据框。要在数据编辑器窗口中打开`Puromycin`数据集，请使用以下命令：


  ```

  > fix(Puromycin)

  ```


  或者，你可以从“编辑”菜单中选择“数据编辑器”，然后在提示时输入要查看的数据集名称。数据集将在数据编辑器窗口中打开，如图 1-2 所示。你可以在此处对数据进行更改。完成后，关闭编辑器窗口以应用更改。


  ![A978-1-4842-0139-8_1_Fig2_HTML.jpg](img/A978-1-4842-0139-8_1_Fig2_HTML.jpg)


  图 1-2. 数据编辑器窗口


  虽然数据编辑器对于进行微小更改很有用，但通常有更高效的方法来操作数据集。这些将在第 3 章中介绍。


  ## 工作区


  工作区是包含你在会话中创建的所有对象的虚拟区域。要查看工作区中所有对象的列表，请使用`objects`函数：


  ```

  > objects()

  ```


  你可以使用`rm`函数从工作区中删除对象：


  ```

  > rm(height, string1, string2)

  ```


  要删除工作区中的所有对象，请使用以下命令：


  ```

  > rm(list=objects())

  ```


  你可以将工作区的内容保存到文件中，这允许你在其他时间恢复使用它们。


  Windows 用户可以通过选择“文件”然后从下拉菜单中选择“保存工作区”，然后以常规方式命名并保存文件。请确保文件名具有`.RData`扩展名，因为它不会自动添加。


  R 会在每个新会话开始时自动加载最近保存的工作区。你也可以通过选择“文件”，然后从下拉菜单中选择“打开工作区”，并以常规方式选择文件来打开之前保存的工作区。打开工作区后，其中的所有对象都可供你使用。


  Mac 用户可以在“工作区”菜单中找到用于保存和加载工作区的选项。


  Linux 用户可以通过输入以下命令来保存工作区：


  ```

  > save.image("`/home/Username/folder/filename.RData`")

  ```


  文件路径可以是绝对路径，也可以是相对于主目录的路径。


  要加载工作区，请使用以下命令：


  ```

  > load("`/home/Username/folder/filename.RData`")

  ```


  ##### 错误消息


  有时 R 在尝试执行你的命令时会遇到问题。发生这种情况时，控制台窗口中会显示一条消息，通知你问题的相关信息。这些消息分为两种类型，即错误消息和警告消息。


  错误消息以文本`Error:`开头，并且在 R 完全无法执行命令时显示。


  错误消息最常见的原因之一是给出了无效的 R 命令，因为它包含 R 无法识别的符号，或者因为符号缺失或位置错误。这称为语法错误。在以下示例中，错误是由命令末尾多余的右括号引起的：


  ```

  > round(3.141592))

  Error: unexpected '')'' in "round(3.141592))"

  ```


  错误的另一个常见原因是输错了对象名称，导致引用了不存在的对象。请记住，对象名称区分大小写：


  ```

  > log(object5)

  Error: object ''object5'' not found

  ```


  同样的规则也适用于函数名称，它们也是区分大小写的：


  ```

  > Log(3.141592)

  Error: could not find function "Log"

  ```


  错误的第三个常见原因是向函数提供了错误的输入类型，例如，在需要向量的地方提供了数据框，或者在需要数字的地方提供了字符串：


  ```

  > log("Hello!")

  Error in log("Hello!") : Non-numeric argument to mathematical function

  ```


  警告消息以文本`Warning:`开头，并告知你一些没有阻止命令完成，但你应该注意的问题。例如，下面的命令计算了`temperatures`向量中每个值的自然对数。但是，并非所有值都能计算对数，因为其中一些是负数：


  ```

  > log(temperatures)

  [1] 1.0986123 1.3244190       NaN 0.1823216       NaN

  Warning message:

  In log(temperatures) : NaNs produced

  ```


  尽管 R 仍然能够执行命令并生成输出，但它会显示一条警告消息，以提醒你注意此问题。




  ##### 脚本文件


  脚本文件是一种文本文件，允许你保存命令，以便轻松回顾、编辑和重复使用。


  要创建新的脚本文件，请从`文件`菜单中选择`新建脚本`。Mac 用户应从`文件`菜单中选择`新建文档`。这将打开一个新的`R 编辑器`窗口，你可以在其中输入命令。Linux
  版本的`R`不包含脚本编辑器，但可以使用许多外部编辑器。要查看这些编辑器的列表，请访问[`www.sciviews.org/_rgui/projects/Editors.html`](http://www.sciviews.org/_rgui/projects/Editors.html)。


  若要在 Windows 环境下从`R 编辑器`运行命令，请将光标放在要运行的行上，右键单击并选择`运行当前行或所选内容`。你也可以使用快捷键`Ctrl+R`。或者，单击运行按钮，其外观如下：


  ![A978-1-4842-0139-8_1_Fig1a_HTML.jpg](img/A978-1-4842-0139-8_1_Fig1a_HTML.jpg)


  要运行多条命令，请高亮选择一组命令，然后右键单击并选择`运行当前行或所选内容`，如图 1-3 所示。


  ![A978-1-4842-0139-8_1_Fig3_HTML.jpg](img/A978-1-4842-0139-8_1_Fig3_HTML.jpg)


  图 1-3. 在 Windows 环境中从脚本文件运行命令


  Mac 用户可以通过按下`Cmd+Return`来运行当前行或所选命令。


  运行所选命令后，这些命令会被提交到命令窗口并逐一执行。


  如果你的脚本文件将被他人使用，或者你可能会在很长时间后重新查看它，添加一些注释会很有帮助。注释是额外的文本，不属于命令本身，用于做笔记和解释命令。


  通过在注释前输入井号（`#`）来为脚本文件添加注释。`R`会忽略同一行中井号后的所有文本。这意味着，如果你运行一段包含注释的命令，注释不会导致错误。图 1-4
  展示了包含注释的脚本文件。


  ![A978-1-4842-0139-8_1_Fig4_HTML.jpg](img/A978-1-4842-0139-8_1_Fig4_HTML.jpg)


  图 1-4. 包含注释的脚本文件


  你可以通过选择`文件`，然后选择`保存`来保存脚本文件。如果`文件`菜单中没有显示`保存`选项，那是因为你没有将焦点放在脚本编辑器窗口上，需要先选中它。文件将以`.R`作为扩展名保存。类似地，你可以通过选择`文件`，然后选择`打开脚本`，再按常规方式选择文件来打开之前保存的脚本文件。


  Mac 用户可以通过点击脚本编辑器窗口左上角的图标来保存脚本文件，并通过从`文件`菜单中选择`打开文档`来打开之前保存的脚本文件。


  ### 总结


  本章的目的是让你熟悉 R 界面以及本书中会用到的一些编程术语。在继续之前，请确保你理解以下术语：


  - **R 控制台** — 你输入命令并显示输出、错误或警告信息的窗口。

  - **命令** — 对 R 的键入指令。

  - **命令提示符** — `R`用于表示已准备好接收命令的符号，其外观为：`>`。

  - **函数** — 一组被赋予名称并共同执行特定任务的命令。

  - **参数** — 作为输入提供给函数的一个值或一段数据。

  - **对象** — 已存储并赋予名称的一段数据或信息。

  - **向量** — 包含多个相同类型数据值并按特定顺序排列的对象。

  - **数据框** — 一种适合保存数据集的对象类型。

  - **工作空间** — 包含会话中创建的所有对象的虚拟区域，可保存为扩展名为`.RData`的文件。

  - **脚本文件** — 扩展名为`.R`的文件，用于保存命令和注释。


  现在你已经熟悉了 R 界面，我们可以进入第 2 章，你将学习如何将数据导入 R。


  '
- "# 2. 处理数据文件\n\n在开始任何统计分析之前，你需要学习处理外部数据文件，以便导入数据。`R`能够读取逗号分隔值（CSV）、制表符分隔和数据库交换格式（DIF）文件格式，这些是统计和数据库软件包之间传输数据常用的标准文件格式。借助一个名为`foreign`的附加包，可以导入更多类型的文件。\n\
  \n无论你是在纸上或电子表格中自行记录数据，还是从他人那里收到数据文件，本章将解释如何将数据导入 R。\n\n你将学习如何：\n\n- 通过直接输入值来录入数据\n\
  - 导入纯文本文件，包括 CSV、制表符分隔和 DIF 文件格式\n- 先将 Excel 文件转换为 CSV 格式再导入\n- 导入以其他软件包（如 SPSS\
  \ 或 Stata）特定文件类型存储的数据集\n- 使用相对文件路径\n- 将数据集导出为 CSV 或制表符分隔文件\n\n## 直接输入数据\n\n如果你有一个尚未以电子形式记录的小数据集，你可能希望直接将数据输入到\
  \ R 中。\n\n考虑表 2-1 中所示的数据集，它提供了英国四家超市连锁店的一些数据。这代表了一个典型数据集，其中列代表变量，每一行包含一个观测值。\n\n\
  表 2-1. 英国四大超市连锁店数据（2011 年）；更多详情请参见附录 C\n\n| 连锁店 | 门店数 | 销售面积（千平方英尺） | 市场份额 % |\n\
  | --- | --- | --- | --- |\n| Morrisons | 439 | 12261 | 12.3 |\n| Asda | | | 16.9\
  \ |\n| Tesco | 2715 | 36722 | 30.3 |\n| Sainsbury’s | 934 | 19108 | 16.5 |\n\n要将数据集输入\
  \ R，第一步是使用`c`函数为每个变量创建一个数据值向量，如第 1 章“向量”部分所述。因此，对于超市数据，输入四个变量：\n\n```R\n> Chain<-c(\"\
  Morrisons\", \"Asda\", \"Tesco\", \"Sainsburys\")\n> Stores<-c(439, NA, 2715, 934)\n\
  > Sales.Area<-c(12261, NA, 36722, 19108)\n> Market.Share<-c(12.3, 16.9, 30.3, 16.5)\n\
  ```\n\n每个向量的长度应相同，即包含相同数量的值。如果数据值缺失，请在其位置输入字符`NA`。请记住，为非数值的值加上引号，如`Chain`变量所示。\n\
  \n为每个变量创建向量后，使用`data.frame`函数将它们组合成一个数据框：\n\n```R\n> supermarkets<-data.frame(Chain,\
  \ Stores, Sales.Area, Market.Share)\n```\n\n你可以通过输入数据框的名称来检查数据集是否正确输入：\n\n```R\n\
  > supermarkets\n        Chain   Stores   Sales.Area   Market.Share\n1   Morrisons\
  \      439        12261           12.3\n2        Asda       NA           NA    \
  \       16.9\n3       Tesco     2715        36722           30.3\n4  Sainsburys\
  \      934        19108           16.5\n```\n\n创建数据框后，各个向量作为独立的对象仍存在于工作空间中。为避免混淆，你可以使用`rm`函数删除它们：\n\
  \n```R\n> rm(Chain, Stores, Sales.Area, Market.Share)\n```\n\n\n\n## 导入纯文本文件\n\n\
  将数据传输到 R 最简单的方法是使用纯文本文件，有时也称为扁平文本文件。这类文件由无额外格式的纯文本组成，可以用记事本（Windows）、TextEdit（Mac）或\
  \ gedit（Linux）等纯文本编辑器读取。有多种标准格式可用于在文本文件中存储电子表格数据，这些格式使用特定符号来表示数据的布局，包括：\n\n* 逗号分隔值或逗号定界（`.csv`）文件\n\
  * 制表符分隔（`.txt`）文件\n* 数据交换格式（`.dif`）文件\n\n这些文件格式非常有用，因为它们可以被所有主流的统计和数据库软件包读取，从而便于在不同软件之间轻松传输数据集。\n\
  \n以下小节将解释如何从这些标准文件格式将数据集导入到 R 中。\n\n### CSV 和制表符分隔文件\n\n逗号分隔值（CSV）文件是在纯文本文件中存储电子表格数据最流行的方法。在\
  \ CSV 文件中，数据值按每行一个观测值排列，并用逗号分隔每行内的数据值（因此得名）。有时，当数据本身包含逗号时，会使用分号代替逗号。制表符分隔文件格式与 CSV\
  \ 格式非常相似，只是数据值使用水平制表符而非逗号进行分隔。图 2-1 和 2-2 展示了超市数据在 CSV 和制表符分隔格式下的显示效果。这些文件可在本书的下载资源中找到（`www.apress.com/9781484201404`）。\n\
  \n![A978-1-4842-0139-8_2_Fig2_HTML.jpg](img/A978-1-4842-0139-8_2_Fig2_HTML.jpg)\n\
  \n图 2-2. 以制表符分隔文件格式保存的超市数据集\n\n![A978-1-4842-0139-8_2_Fig1_HTML.jpg](img/A978-1-4842-0139-8_2_Fig1_HTML.jpg)\n\
  \n图 2-1. 以 CSV 文件格式保存的超市数据集\n\n你可以使用 `read.csv` 函数导入 CSV 文件：\n\n```\n> dataset1\
  \ <- read.csv(\"C:/folder/filename.csv\")\n```\n\n此命令从文件路径 `C:/folder/filename.csv`\
  \ 导入数据，并将其保存至名为 `dataset1` 的数据框。\n\n请记住，在选择数据集名称时，需遵循常规的对象命名规则（参见第 1 章中的“对象”部分）。建议选择一个简短但有意义的名称来描述文件中的数据。\n\
  \n文件路径 `C:/folder/filename.csv` 是 CSV 文件在硬盘、网络驱动器或存储设备上的位置。注意，必须使用正斜杠（而非 Windows\
  \ 使用的反斜杠）来表示目录，并且必须将文件路径括在引号内。对于 Mac 和 Linux 用户，文件路径将以正斜杠开头，例如 `/Users/username/folder/filename.csv`。\n\
  \n如果数据集成功导入，则没有输出信息，R 会在导入完成后显示命令提示符。否则，你将看到一条解释导入失败原因的错误消息。假设没有出现问题，你的数据将存储在名为\
  \ `dataset1` 的数据框中。你可以在命令提示符下输入数据集名称来查看和检查数据，或者使用数据编辑器打开它。\n\n对于导入制表符分隔文件，有一个类似的函数叫\
  \ `read.delim`：\n\n```\n> dataset1 <- read.delim(\"C:/folder/filename.txt\")\n```\n\
  \n当使用 `read.csv` 或 `read.delim` 函数导入文件时，R 会默认文件第一行的条目是数据集的变量名称。有时 R 会调整变量名称以使其符合命名规则（参见第\
  \ 1 章中的“对象”部分），并确保它们在数据集中是唯一的。\n\n如果文件不包含任何变量名称，请将 `header` 参数设置为 `F`（表示假），如下所示。这可以防止\
  \ R 将数据的第一行用作变量名称：\n\n```\n> dataset1 <- read.csv(\"C:/folder/filename.csv\", header=F)\n\
  ```\n\n当将 `header` 参数设置为 `F` 时，R 会分配通用的变量名称，如 `V1`、`V2` 等。或者，你也可以使用 `col.names`\
  \ 参数提供自己的名称：\n\n```\n> dataset1 <- read.csv(\"C:/folder/filename.csv\", header=F,\
  \ col.names=c(\"Name1\", \"Name2\", \"Name3\"))\n```\n\n使用 `col.names` 参数时，请确保提供的名称数量与文件中的变量数量相同。否则，你可能会看到错误消息，或者发现某些变量未被命名。\n\
  \n在 CSV 或制表符分隔文件中，缺失数据通常由空白字段表示。然而，有些文件可能使用符号或字符，例如小数点、数字 9999 或单词 `NULL` 作为占位符。如果是这种情况，请使用\
  \ `na.strings` 参数告诉 R 哪些字符应被解释为缺失数据：\n\n```\n> dataset1 <- read.csv(\"C:/folder/filename.csv\"\
  , na.strings=\".\")\n```\n\n注意，R 会自动将字母 `NA` 解释为表示缺失数据。在数值变量（而非字符变量）中发现的空白也会被视为缺失数据。\n\
  \n在世界上的某些地区，数字中使用逗号代替点号来表示小数点。图 2-3 展示了一个包含此格式数字的制表符分隔文件。R 有两个专门处理此格式数据的函数，分别是 `read.csv2`\
  \ 和 `read.delim2`，可以用来替代 `read.csv` 和 `read.delim` 函数。\n\n![A978-1-4842-0139-8_2_Fig3_HTML.jpg](img/A978-1-4842-0139-8_2_Fig3_HTML.jpg)\n\
  \n图 2-3. 以制表符分隔文件格式保存的超市数据集，使用逗号表示小数点\n\n#### DIF 文件\n\n要导入扩展名为 `.dif` 的数据交换格式（DIF）文件，请使用\
  \ `read.DIF` 函数：\n\n```\n> dataset1 <- read.DIF(\"C:/folder/filename.dif\")\n```\n\
  \n默认情况下，`read.DIF` 函数假定文件中没有变量名称（与 `read.csv` 和 `read.delim` 函数不同）。如果文件确实包含变量名称，请将\
  \ `header` 参数设置为 `T`（表示真），如下所示。否则，R 会将变量名称视为数据值的一部分：\n\n```\n> dataset1 <- read.DIF(\"\
  C:/folder/filename.dif\", header=T)\n```\n\n与导入 CSV 和制表符分隔文件时一样，你可以使用 `na.strings`\
  \ 参数告诉 R 任何应被解释为缺失数据的值：\n\n```\n> dataset1 <- read.DIF(\"C:/folder/filename.dif\"\
  , na.string=\"NULL\")\n```\n\n注意，如果你正在导入由 Microsoft Excel 创建的 DIF 文件，在尝试导入时可能会看到错误消息\
  \ `'More rows than specified in header'; maybe use 'transpose=TRUE'`。出现此错误消息是因为某些版本的\
  \ Microsoft Excel 使用的是 DIF 文件格式的修改版本，而非标准版本。你可以通过将 `transpose` 参数设置为 `T` 来解决此问题：\n\
  \n```\n> dataset1 <- read.DIF(\"C:/folder/filename.dif\", transpose=T)\n```\n\n\n\
  \n### 其他纯文本文件\n\n除了所有可用于导入特定文件格式的函数外，R 还提供了一个用于从纯文本文件导入数据的通用函数，名为`read.table`。它允许你导入任何纯文本文件，只要其中的数据按每行一个观测值的方式排列。\n\
  \n请考虑图 2-4 所示的文件，其数据按每行一个观测值的方式排列，并且数据值由正斜杠符号 (`/`) 分隔。\n\n![A978-1-4842-0139-8_2_Fig4_HTML.jpg](img/A978-1-4842-0139-8_2_Fig4_HTML.jpg)\n\
  \n图 2-4. 非标准文件类型中的超市数据\n\n你可以使用以下命令导入该文件：\n\n```\n> dataset1 <- read.table(\"C:/folder/supermarkets.txt\"\
  , sep=\"/\", header=T)\n```\n\n默认情况下，`read.table`函数假定文件第一行不包含变量名（这与`read.csv`和`read.delim`函数不同）。如果文件的第一行包含变量名（如本例所示），请将`header`参数设置为`T`。\n\
  \n与其他导入函数一样，你可以使用`na.strings`参数告知 R 将哪些值解释为缺失数据：\n\n```\n> dataset1 <- read.table(\"\
  C:/folder/filename.txt\", sep=\"/\", header=T, na.strings=\"NULL\")\n```\n\n## 导入\
  \ Excel 文件\n\n导入 Microsoft Excel 文件最简单的方法是先将 Excel 文件另存为 CSV 文件，然后按本章前面“CSV 和制表符分隔文件”部分所述的方法进行导入。\n\
  \n首先在 Excel 中打开你的文件，确保电子表格中的数据排列正确，即每列为一个变量，每行为一个观测值。如果数据集包含变量名，则应将其放在电子表格的第一行。否则，数据值应从第一行开始。图\
  \ 2-5 显示了超市数据在 Excel 文件中正确排列时的样子。\n\n![A978-1-4842-0139-8_2_Fig5_HTML.jpg](img/A978-1-4842-0139-8_2_Fig5_HTML.jpg)\n\
  \n图 2-5. 在 Excel 电子表格中正确排列数据集以便轻松转换为 CSV 文件格式的正确方法\n\n为确保文件转换顺畅，请检查以下事项：\n\n-  \
  \ 数据网格上方或左侧没有空单元格\n-   没有合并单元格\n-   列标题不超过一行\n-   没有粗体、斜体或彩色文本、单元格边框或背景色等格式\n- \
  \  数据值缺失的单元格保持为空\n-   大数字中没有逗号（例如，1324157 是可接受的，但 1,324,157 则不可）\n-   如果使用指数（科学）记数法，格式必须正确（例如，0.00312\
  \ 可表示为 3.12e-3 或 3.12E-3）\n-   数值变量中没有货币、单位或百分比符号（分类变量或变量名中的符号是可以的）\n-   使用减号表示负数（例如\
  \ -5），而不是使用括号或红色文本\n-   工作簿中只有一个工作表\n\n数据准备好后，从“文件”菜单中选择“另存为”，将电子表格保存为 CSV 文件。出现“另存为”对话框时，从“保存类型”字段中选择`.csv`文件类型，如图\
  \ 2-6 所示。然后像往常一样保存文件。Excel 会提示你所有格式都将丢失，你可以接受该提示。\n\n![A978-1-4842-0139-8_2_Fig6_HTML.jpg](img/A978-1-4842-0139-8_2_Fig6_HTML.jpg)\n\
  \n图 2-6. 将 Excel 文件另存为 CSV 文件\n\n现在，CSV 文件已准备好，可以使用`read.csv`函数进行导入，如前文本章所述（参见“CSV\
  \ 和制表符分隔文件”）。\n\n如果你无法使用 Excel，也可以使用诸如`xlsx`或`xlsReadWrite`之类的附加包来直接导入 Excel 文件。有关使用附加包的更多详细信息，请参阅附录\
  \ B。\n\n## 从其他软件导入文件\n\n有时你可能需要导入以其他统计软件包专用格式保存的数据集，例如 SPSS 或 Stata 数据文件。\n\n如果你有该软件的使用权限，最简单的解决方案是使用该软件打开文件，并通过“文件”菜单中的“另存为”或“导出”选项将文件转换为\
  \ CSV 文件格式。文件转换为 CSV 格式后，你可以使用`read.csv`函数进行导入（参见本章前面的“CSV 和制表符分隔文件”部分）。\n\n如果你无法转换文件，则可以使用名为`foreign`的附加包，它允许你直接从一些流行的统计软件包生成的文件类型中导入数据。\n\
  \n附录 A 中会更详细地介绍附加包。目前，你只需知道附加包包含标准 R 安装中不包含的额外函数。要使用`foreign`包中的函数，你必须首先加载该包。\n\n\
  要加载`foreign`包，请从“包”菜单中选择“加载包”。当包列表出现后，选择“foreign”并按下“确定”。包加载后，其中的所有函数将在当前会话期间可供你使用。\n\
  \n表 2-2 列出了一些可用于导入外部文件类型的函数。\n\n表 2-2. `foreign`附加包中提供的一些函数\n\n| 文件类型 | 扩展名 | 函数\
  \ |\n| --- | --- | --- |\n| 数据库格式文件 | `.dbf` | `read.dbf` |\n| Stata 5 至 12 版本数据文件\
  \ | `.dta` | `read.dta` |\n| Minitab 可移植工作表文件 | `.mtp` | `read.mtp` |\n| SPSS 数据文件\
  \ | `.sav` | `read.spss` |\n| SAS 传输格式 | `.xport` | `read.xport` |\n| Epi Info 数据文件\
  \ | `.rec` | `read.epiinfo` |\n| Octave 文本数据文件 | `.txt` | `read.octave` |\n| 属性关系文件\
  \ | `.arff` | `read.arff` |\n| Systat 文件 | `.sys`, `.syd` | `read.systat` |\n\n\
  例如，要导入 Stata 数据文件，请使用以下命令：\n\n```\n> dataset1 <- read.dta(\"C:/folder/filename.dta\"\
  )\n```\n\n你可能需要使用其他参数来确保文件被正确导入。有关使用`foreign`包中函数的更多信息，请使用`help`函数，或参考可从 R 项目网站`cran.r-project.org/web/packages/foreign/foreign.pdf`获取的包文档。\n\
  \n## 使用相对文件路径\n\n到目前为止，我们只使用了绝对文件路径来描述数据文件的位置。绝对文件路径给出了文件的完整地址，在 Windows 环境中以驱动器名称（如`C:/`）开头。\n\
  \n你也可以使用相对文件路径，它描述的是文件相对于工作目录的位置。工作目录是 R 在给定相对文件路径时默认查找的目录。这在需要导入或导出大量文件且不想每次都键入完整文件路径时非常有用。要查看当前的工作目录，请使用以下命令：\n\
  \n```\n> getwd()\n```\n\n如果你使用的是全新安装的 R for Windows，工作目录将是你的“文档”文件夹，R 会输出类似如下的内容：\n\
  \n```\n[1] \"C:/Users/Username/Documents\"\n```\n\n对于 Mac 和 Linux 用户，默认工作目录将是你的主目录，看起来类似这样：\n\
  \n```\n[1] \"/Users/Username\"\n```\n\n因此，要导入一个绝对文件路径为`C:/Users/Username/Documents/Data/filename.csv`的\
  \ CSV 文件，你可以使用以下命令：\n\n```\n> read.csv(\"Data/filename.csv\")\n```\n\n要更改工作目录到你更喜欢的存储数据文件的位置，请使用`setwd`函数，如下所示。此更改将在当前会话的剩余时间内生效：\n\
  \n```\n> setwd(\"C:/folder/subfolder\")\n```\n\n\n\n## 导出数据集\n\nR 允许您将 R 工作区中的数据集导出为\
  \ CSV 和制表符分隔的文件格式。\n\n要将名为 `dataset` 的数据框导出为 CSV 文件，请使用 `write.csv` 函数：\n\n```\n\
  > write.csv(dataset, \"filename.csv\")\n```\n\n例如，要将 `Puromycin` 数据集导出为名为 `puromycin_data.csv`\
  \ 的文件，请使用以下命令：\n\n```\n> write.csv(Puromycin, \"puromycin_data.csv\")\n```\n\n此命令会创建文件并将其保存到您的工作目录（有关如何查找和设置工作目录，请参见上一节“使用相对文件路径”）。要将文件保存到工作目录以外的位置，请输入文件的完整路径：\n\
  \n```\n> write.csv(dataset, \"C:/folder/filename.csv\")\n```\n\n如果指定位置已存在与您所选名称相同的文件，R\
  \ 会直接覆盖原文件，且不会发出警告。您应事先检查目标文件夹中的文件，确保不会覆盖任何重要内容。\n\n`write.table` 函数允许您将数据导出到更广泛的文件格式中，包括制表符分隔的文件。使用\
  \ `sep` 参数来指定用于分隔值的字符。要将数据集导出为制表符分隔的文件，请将 `sep` 参数设置为 `\"\\t\"`（表示制表符）：\n\n```\n\
  > write.table(dataset, \"filename.txt\", sep=\"\\t\")\n```\n\n默认情况下，`write.csv`\
  \ 和 `write.table` 函数会在文件中创建一个包含观测编号的额外列。要避免这种情况，请将 `row.names` 参数设置为 `F`：\n\n```\n\
  > write.csv(dataset, \"filename.csv\", row.names=F)\n```\n\n使用 `write.table` 函数时，您还可以通过\
  \ `col.names` 参数防止变量名出现在文件的第一行：\n\n```\n> write.table(dataset, \"filename.txt\"\
  , sep=\"\\t\", col.names=F)\n```\n\n### 总结\n\n现在，您应该能够将数据导入 R 了，无论是直接输入还是从外部数据文件导入。您还应了解如何使用相对文件路径，并能够将数据集导出到外部文件。\n\
  \n下表总结了本章涉及的最重要的命令。\n\n| 任务 | 命令 |\n| --- | --- |\n| 创建数据框 | `dataset <- data.frame(vector1,\
  \ vector2, vector3)` |\n| 导入 CSV 文件 | `dataset <- read.csv(\"filepath\")` |\n| 导入制表符分隔文件\
  \ | `dataset <- read.delim(\"filepath\")` |\n| 导入 DIF 文件 | `dataset <- read.DIF(\"\
  filepath\")` |\n| 导入其他文本文件 | `dataset <- read.table(\"filepath\", sep=\"?\")` |\n\
  | 显示工作目录 | `getwd()` |\n| 更改工作目录 | `setwd(\"C:/folder/subfolder\")` |\n| 将数据集导出为\
  \ CSV 文件 | `write.csv(dataset, \"filename.csv\")` |\n| 将数据集导出为制表符分隔文件 | `write.table(dataset,\
  \ \"filename.txt\", sep=\"\\t\")` |\n\n既然您已经学会了如何将数据集导入 R，接下来我们可以进入第 3 章，该章将介绍如何为分析准备数据集。\n\
  \n"
- "# 3. 准备与操作数据\n\n在导入数据集后，很可能需要在开始任何统计分析之前做一些更改。您的分析可能需要一些新变量，或者可能需要删除一些无关数据。此外，您可能希望确保变量和类别名称正确无误，以便在您创建的任何统计输出中看起来更美观。本章将说明如何对数据集进行此类更改。\n\
  \n您将学习如何：\n\n-   重命名、重新排列和删除变量\n-   更改变量的数据类型\n-   从旧变量计算新变量\n-   将数值变量划分为类别\n-\
  \   修改分类（因子）变量的类别名称\n-   操作字符串\n-   处理日期和时间\n-   添加或删除观测值\n-   选择数据子集（按类型或随机抽样）\n\
  -   对数据进行排序\n\n更复杂的更改，例如合并两个数据集或更改数据结构，将在第 4 章中介绍。\n\n本章以图 3-1 所示的 `people` 数据集为例进行演示。该数据集包含十六个人的眼睛颜色（棕色、蓝色或绿色）、身高（厘米）、手跨度（毫米）、性别（1\
  \ 表示男性，2 表示女性）以及惯用手（L 表示左撇子，R 表示右撇子）。\n\n![A978-1-4842-0139-8_3_Fig1_HTML.jpg](img/A978-1-4842-0139-8_3_Fig1_HTML.jpg)\n\
  \n图 3-1. `people` 数据集\n\n本章还将使用 `pulserates`、`fruit`、`flights`、`customers` 和 `coffeeshop`\
  \ 数据集，这些数据集均可以 CSV 格式或 R 工作区文件的形式随本书下载（[`www.apress.com/9781484201404`](http://www.apress.com/9781484201404)）。有关这些数据集的更多信息，请参见附录\
  \ C。\n\n### 变量\n\n如果数据集包含大量变量，您可以通过删除不必要的变量并以有意义的顺序排列剩余变量，使其更易于管理。您应检查每个变量是否具有适当的名称和适合其包含的数据类型的类别，具体说明见以下各节。\n\
  \n#### 重新排列和删除变量\n\n您可以使用 `subset` 函数重新排列或删除数据集中的变量。使用 `select` 参数选择要保留的变量及其顺序。通过将不需要的变量排除在列表之外来删除它们。\n\
  \n例如，以下命令从 `people` 数据集中删除了 `Subject`、`Height` 和 `Handedness` 变量，并重新排列了剩余变量，使 `Hand.Span`\
  \ 位于首位，其后依次是 `Sex` 和 `Eye.Color`：\n\n```\n> people1 <- subset(people, select=c(Hand.Span,\
  \ Sex, Eye.Color))\n```\n\n图 3-2 显示了应用更改后新数据集的样子。\n\n![A978-1-4842-0139-8_3_Fig2_HTML.jpg](img/A978-1-4842-0139-8_3_Fig2_HTML.jpg)\n\
  \n图 3-2. 使用 `subset` 函数从 `people` 数据集中删除变量后创建的 `people1` 数据集\n\n请注意，该命令创建了一个名为 `people1`\
  \ 的新数据集，它是原始数据集的修改版本，并保持原始数据集不变。或者，您也可以用此修改版本覆盖原始数据集：\n\n```\n> people <- subset(people,\
  \ select=c(Hand.Span, Sex, Eye.Color))\n```\n\n`subset` 函数不仅能删除和重新排列变量。您还可以使用它从数据集中选择观测的子集，这将在本章后面的“根据选择标准选择子集”部分中解释。\n\
  \n另一种从数据集中删除变量的方法是使用方括号表示法。当您的数据集包含大量变量而您只想删除少数几个时，这种方法尤其有用。例如，要从 `people` 数据集中删除第一、第三和第六个变量，请使用命令：\n\
  \n```\n> people1 <- people[-c(1,3,6)]\n```\n\n类似地，要保留第二、第四和第一个变量并重新排序，请使用命令：\n\n\
  ```\n> people1 <- people[c(2,4,1)]\n```\n\n**注意：** 有关使用方括号表示法的更多详细信息，请参见第 1 章中的“数据框”部分。\n\
  \n\n\n#### 重命名变量\n\n`names` 函数会显示数据集中所有变量名称的列表：\n\n```\n> names(people)\n[1] \"\
  Subject\"    \"Eye.Color\" \"Height\"     \"Hand.Span\"  \"Sex\"        \"Handedness\"\
  \n```\n\n你也可以使用 `names` 函数来重命名变量。以下命令将 `people` 数据集中的第五个变量重命名：\n\n```\n> names(people)[5]<-\"\
  Gender\"\n```\n\n类似地，要重命名第二个、第四个和第五个变量：\n\n```\n> names(people)[c(2,4,5)]<-c(\"\
  Eyes\", \"Span.mm\", \"Gender\")\n```\n\n或者，你也可以一次性重命名数据集中的所有变量：\n\n```\n> names(people)<-c(\"\
  Subject\", \"Eyes\", \"Height.cm\", \"Span.mm\", \"Gender\", \"Hand\")\n```\n\n\
  请确保你提供的变量名称数量与数据集中的变量数量相同。\n\n#### 变量类别\n\n数据集中的每个变量都有一个类别，它描述了该变量包含的数据类型。你可以使用\
  \ `class` 函数查看变量的类别：\n\n```\n> class(dataset$variable)\n```\n\n要同时检查所有变量的类别，请使用以下命令：\n\
  \n```\n> sapply(dataset, class)\n```\n\n变量的类别决定了你在统计分析或绘图中使用它时，R 将如何处理该变量。R 中有许多可能的变量类别，但你可能只会用到其中的几种：\n\
  \n*   `numeric` 变量包含实数，即正数或负数，可以包含小数点，也可以不含。它们也可以包含缺失数据符号（`NA`）。\n*   `integer`\
  \ 变量包含没有小数点的正数或负数。此类别行为上与 `numeric` 类别非常相似。如果包含一个带有小数部分的值，`integer` 变量会自动转换为 `numeric`\
  \ 变量。\n*   `factor` 变量适用于分类数据。`factor` 变量通常具有少量唯一值，这些值被称为水平（levels）。实际值可以是数字或字符串。\n\
  *   `date` 和 `POSIXlt` 变量以特殊格式包含日期或日期时间，方便处理。\n*   `character` 变量包含字符串。字符串是 unicode\
  \ 字符的任意组合，包括字母、数字和符号。此类别适用于不属于其他任何类别的数据，例如参考编号、标签，以及提供额外注释或信息的文本。\n\n当你使用诸如 `read.csv`\
  \ 之类的函数导入数据文件时，R 会根据变量的内容自动为每个变量分配一个类别。如果变量只包含数字，R 会分配 `numeric` 或 `integer` 类别。如果变量包含任何非数值，R\
  \ 会分配 `factor` 类别。\n\n由于 R 不知道你打算如何使用每个变量中包含的数据，因此它分配的类别可能并不总是合适的。举例来说，考虑 `people`\
  \ 数据集中的 `Sex` 变量。因为该变量包含整数，R 在导入数据时会自动分配 `integer` 类别。但 `factor` 类别会更合适，因为这些值代表的是类别，而不是计数或测量值。\n\
  \n你可以使用 `as.factor` 函数将变量的类别更改为 `factor`：\n\n```\n> dataset$variable<-as.factor(dataset$variable)\n\
  ```\n\n如果你有一个包含数值但因某些原因被分配了其他类别的变量，你可以使用 `as.numeric` 函数来更改它。任何非数值都将被视为缺失数据，并替换为缺失数据代码（`NA`）：\n\
  \n```\n> dataset$variable<-as.numeric(dataset$variable)\n```\n\n如果在导入数据集时 R 没有自动将某个变量识别为\
  \ `numeric`，那该变量至少包含一个非数值。明智的做法是找出原因，因为这可能是一个值被错误地输入，或者用于表示缺失数据的符号未被识别。\n\n你可以使用\
  \ `as.character` 函数将变量的类别更改为 `character`：\n\n```\n> dataset$variable<-as.character(dataset$variable)\n\
  ```\n\n还有一个用于创建日期变量的 `as.Date` 函数，你将在本章后面的“处理日期和时间”中了解更多。\n\n## 计算新的数值变量\n\n你可以像创建任何其他新对象一样，使用赋值运算符（`<-`）在数据集中创建一个新变量。因此，要创建一个名为\
  \ `var2` 的新变量，它是现有变量 `var1` 的副本，请使用以下命令：\n\n```\n> dataset$var2<-dataset$var1\n\
  ```\n\n你可以通过组合现有的数值变量、算术运算符和函数来创建新的数值变量。例如，下面的命令在 `people` 数据集中添加了一个名为 `Height.Inches`\
  \ 的新变量，该变量以英寸为单位给出受试者的身高，并四舍五入到最近的整数：\n\n```\n> people$Height.Inches<-round(people$Height/2.54)\n\
  ```\n\n你可以使用方括号标记法对变量进行条件修改。例如，要将所有小于 150 厘米的 `Height` 值设为缺失，请使用以下命令：\n\n```\n>\
  \ people$Height[people$Height<150]<-NA\n```\n\n**注意：** 你将在本章后面的“根据选择标准选取子集”以及附录\
  \ B 中了解有关使用条件的更多信息。\n\n你可能想要创建一个新变量，该变量是几个现有变量的统计汇总。`apply` 函数允许你做到这一点。\n\n考虑图 3-3\
  \ 中显示的 `pulserates` 数据集，它给出了四位患者的脉搏率数据。患者的脉搏率被测量三次并存储在变量 `Pulse1`，`Pulse2` 和 `Pulse3`\
  \ 中。\n\n![A978-1-4842-0139-8_3_Fig3_HTML.jpg](img/A978-1-4842-0139-8_3_Fig3_HTML.jpg)\n\
  \n**图 3-3.** `pulserates` 数据集提供了四位患者三次重复测量的脉搏率（更多细节见附录 C）\n\n假设你想计算一个新变量，表示每个患者的平均脉搏率。你可以使用以下命令创建新变量（如图\
  \ 3-4 所示）：\n\n```\n> pulserates$Mean.Pulse<-apply(pulserates[2:4], 1, mean)\n```\n\
  \n![A978-1-4842-0139-8_3_Fig4_HTML.jpg](img/A978-1-4842-0139-8_3_Fig4_HTML.jpg)\n\
  \n**图 3-4.** 包含新变量 `Mean.Pulse` 的 `pulserates` 数据集\n\n请注意，这里使用了方括号标记法选择了第 2 到第 4\
  \ 列。（第 1 章的“数据框”部分提供了关于使用方括号标记法的更多细节。）\n\n第二个参数允许你指定汇总计算是针对每一行（设为 `1`）还是每一列（设为 `2`）。要创建一个新变量，请将其设为\
  \ `1`。\n\n你可以将 `mean` 函数替换为任何输出单个值的单变量统计汇总函数，例如 `sd` 或 `max`。表 5-1 列出了这些函数（请仅使用标有星号的函数）。\n\
  \n\n\n## 将连续变量划分为类别\n\n有时你可能希望根据连续变量的值对观测进行分类，从而创建一个新的分类变量。\n\n例如，考虑图 3-1 中展示的 `people`\
  \ 数据集。假设你想创建一个名为 `Height.Cat` 的新变量，该变量根据身高将人群划分为“矮”、“中等”和“高”。身高小于 160 厘米的人被归类为“矮”，身高在\
  \ 160 厘米到 180 厘米之间的人被归类为“中等”，身高大于 180 厘米的人被归类为“高”。\n\n你可以使用 `cut` 函数创建新变量：\n\n```\n\
  > people$Height.Cat<-cut(people$Height, c(150, 160, 180, 200), c(\"Short\", \"Medium\"\
  , \"Tall\"))\n```\n\n图 3-5 展示了包含新变量 `Height.Cat` 的 `people` 数据集。\n\n![A978-1-4842-0139-8_3_Fig5_HTML.jpg](img/A978-1-4842-0139-8_3_Fig5_HTML.jpg)\n\
  \n图 3-5. 包含新变量 `Height.Cat` 的 `people` 数据集\n\n使用 `cut` 函数时，分组边界值的数量（此例中为四个）必须比分组的名称数量（此例中为三个）多一个。如果一个数据值等于某个边界值，它会被归入到该边界值对应的下一类别中。请确保你的类别覆盖了所有数据值的范围；否则，新变量中将出现缺失值。在此例中，有一个观测值（对象\
  \ 3）不属于已定义的任何类别，因此其在 `Height.Cat` 变量中对应了一个缺失值。\n\n如果你愿意，可以指定类别的数量，让 R 来决定边界的位置。R\
  \ 会划分变量的范围以创建大小均匀的类别。例如，以下命令展示了如何将 `Height` 变量分割成三个均匀的类别：\n\n```\n> people$Height.Cat<-cut(people$Height,\
  \ 3, c(\"Short\", \"Medium\", \"Tall\"))\n```\n\n任何用 `cut` 函数创建的变量都会自动被赋予 `factor`\
  \ 类。\n\n> **注意：** 始终要仔细考虑是否真的需要将一个数值变量划分为类别。数值变量包含的信息比分类变量更多，因此，在统计模型中尽可能直接纳入原始的数值变量通常是最明智的做法。\n\
  \n## 处理因子变量\n\n正如在“变量类”中所解释的，因子变量适用于存储分类数据。要将变量的类更改为 `factor`，请使用 `as.factor` 函数：\n\
  \n```\n> people$Sex<-as.factor(people$Sex)\n```\n\n一个因子变量具有多个水平，这些水平是该变量取值的所有唯一值（即所有可能的类别）。要查看因子变量的水平，请使用\
  \ `levels` 函数：\n\n```\n> levels(people$Sex)\n[1] \"1\" \"2\"\n```\n\n由于水平名称会出现在你基于该变量创建的任何图表和统计输出中，因此，如果它们既具有意义又美观，将会很有帮助。你可以更改这些水平名称：\n\
  \n```\n> levels(people$Sex)<-c(\"Male\", \"Female\")\n```\n\n你必须提供与因子水平数量相同的名称，并按照对应的顺序输入新名称。\n\
  \n你也可以通过重命名来合并因子水平。考虑 `people` 数据集中的 `Eye.Color` 变量。使用 `levels` 函数，你可以看到由于拼写变体而产生了一个额外的水平：\n\
  \n```\n> levels(people$Eye.Color)\n[1] \"Blue\" \"brown\" \"Brown\" \"Green\"\n\
  ```\n\n要将第二个因子水平重命名为正确的拼写，请使用以下命令：\n\n```\n> levels(people$Eye.Color)[2]<-\"Brown\"\
  \n```\n\n当再次查看因子水平时，你可以看到这两个水平已经合并：\n\n```\n> levels(people$Eye.Color)\n[1] \"Blue\"\
  \  \"Brown\" \"Green\"\n```\n\n你可以使用 `relevel` 函数更改水平的顺序。例如，要将 `Brown` 设为 `Eye.Color`\
  \ 变量的第一个水平，请使用以下命令：\n\n```\n> people$Eye.Color<-relevel(people$Eye.Color, \"Brown\"\
  )\n```\n\n因子水平的顺序很重要，因为如果你将因子纳入统计模型，R 会使用因子的第一个水平作为参考水平。你将在第 11 章中了解更多相关信息。\n\n\
  ## 处理字符变量\n\nR 有许多用于处理字符串的函数。其中最有用的三个是 `paste`（用于拼接字符串）、`substring`（用于提取子字符串）和 `grep`（用于搜索字符串）。以下小节将对它们进行演示。\n\
  \n### 拼接字符串\n\n`paste` 函数允许你通过拼接现有变量（任何类）和其他字符来创建新的字符变量。\n\n考虑图 3-6 中展示的 `fruit`\
  \ 数据集，该数据集提供了一些精选水果的价格。\n\n![A978-1-4842-0139-8_3_Fig6_HTML.jpg](img/A978-1-4842-0139-8_3_Fig6_HTML.jpg)\n\
  \n图 3-6. 提供 2012 年 8 月英国水果价格的 `fruit` 数据集（更多详情请参见附录 C）\n\n假设你想创建一个新变量，为每种水果提供一个价格标签。该标签应包含产品描述、带英镑符号的价格以及销售单位。你可以使用以下命令创建新变量（如图\
  \ 3-7 所示）：\n\n```\n> fruit$Label<-paste(fruit$Product, \": £\", format(fruit$Price,\
  \ trim=T, digits=2), \" \", fruit$Unit, sep=\"\")\n```\n\n![A978-1-4842-0139-8_3_Fig7_HTML.jpg](img/A978-1-4842-0139-8_3_Fig7_HTML.jpg)\n\
  \n图 3-7. 包含新变量 `Label` 的 `fruits` 数据集\n\n默认情况下，`paste` 函数会在每个被拼接的组件之间插入一个空格。在此例中，添加了\
  \ `sep=\"\"` 来防止这种情况，这样空格就不会被插入到不需要的地方，例如英镑符号和价格之间。相反，空格已在需要的位置手动插入，放在引号之间。你也可以使用\
  \ `sep` 参数来指定其他键盘符号作为分隔符。\n\n请注意，已经使用了 `format` 函数来确保水果价格始终显示为两位小数。\n\n### 提取子字符串\n\
  \n`substring` 函数允许你通过从现有变量中提取一部分字符来创建一个新变量。\n\n考虑图 3-8a 中展示的 `flights` 数据集。`Flight.Number`\
  \ 变量给出的航班号以两个字母的前缀开头，表示运营该航班的航空公司。假设你希望创建两个新变量，一个名为 `Airline`，给出两个字母的航空公司前缀；另一个名为\
  \ `Ref`，给出数字部分，如图 3-8b 所示。\n\n![A978-1-4842-0139-8_3_Fig8_HTML.jpg](img/A978-1-4842-0139-8_3_Fig8_HTML.jpg)\n\
  \n图 3-8. 提供南安普敦机场航班详细信息的 `flights` 数据集（更多详情请参见附录 C）\n\n使用 `substring` 函数时，要给出字符串中你想提取的第一个和最后一个字符的位置。因此，要从\
  \ `Flight.Number` 变量中提取前两个字符来创建 `Airline` 变量，请使用以下命令：\n\n```\n> flights$Airline<-substring(flights$Flight.Number,\
  \ 1, 2)\n```\n\n你也可以只给出一个起始位置，此时会提取字符串的剩余部分。因此，要创建 `Ref` 变量，请使用以下命令：\n\n```\n> flights$Ref<-substring(flights$Flight.Number,\
  \ 3)\n```\n\n请注意，尽管新的 `Ref` 变量包含数字，但它仍然具有 `character` 类，因为它是用 `substring` 函数创建的。如果你想将其用作数值变量，可以按照“变量类”中的描述，使用\
  \ `as.numeric` 函数进行转换。\n\n\n\n### 搜索字符变量\n\n`grep`函数用于在字符串中搜索指定内容。\n\n请参考图 3-9 中的`customers`数据集。假设您要识别出所有居住在雷丁市的客户。\n\
  \n![A978-1-4842-0139-8_3_Fig9_HTML.jpg](img/A978-1-4842-0139-8_3_Fig9_HTML.jpg)\n\
  \n图 3-9. `customers`数据集（详见附录 C）\n\n以下命令在`Address`变量中搜索“reading”一词：\n\n```\n> grep(\"\
  reading\", customers$Address)\n```\n\n```\n[1] 2\n```\n\nR 输出数字 2，表示第 2 个观测值包含“reading”一词。\n\
  \n请注意，R 只返回了一个结果，因为搜索默认区分大小写，因此“Reading”和“READING”不被视为与搜索词“reading”匹配。要更改此设置，请将`ignore.case`参数设置为`T`：\n\
  \n```\n> grep(\"reading\", customers$Address, ignore.case=T)\n```\n\n```\n[1] 1\
  \ 2 4\n```\n\n您可以将这些观测值编号保存到一个对象中，而不是直接显示出来。这样，您就可以创建一个仅包含匹配搜索词观测值的新数据集：\n\n```\n\
  > matches<-grep(\"reading\", customers$Address, ignore.case=T)\n> reading.customers<-customers[matches,]\n\
  ```\n\n### 处理日期与时间\n\nR 拥有专门的日期和日期时间变量类别，使得处理这类数据更加容易。当您导入数据集时，R 不会自动识别日期变量，而是根据其内容将其归入其他类别。您可以使用`as.Date`和`strptime`函数来转换这些变量。\n\
  \n对于仅包含日期（不含时间）的变量，请使用`as.Date`函数将其转换为`date`类别。命令格式如下：\n\n```\n> dataset$variable\
  \ <- as.Date(dataset$variable, \"format\")\n```\n\n其中`\"format\"`告诉 R 如何解读日期。R 使用一套特殊的符号来指定日期格式，如表\
  \ 3-1 所示。\n\n表 3-1. 日期时间格式最常用的符号。输入`help(strptime)`可查看完整列表\n\n| 符号 | 含义 | 可能值 |\n\
  | --- | --- | --- |\n|`%d`| 月份中的日期 | 01 至 31, 或 1 至 31 |\n|`%m`| 月份数字 | 01 至 12\
  \ |\n|`%b`| 月份的三字母缩写 | Jan, Feb, Mar, Apr 等 |\n|`%B`| 月份的完整名称 | January, February,\
  \ March, April 等 |\n|`%y`| 两位数的年份 | 00 至 99, 例如 10 代表 2010 |\n|`%Y`| 四位数的年份 | 例如\
  \ 2004 |\n|`%H`| 24 小时制的小时 | 0 至 23, 例如 19 代表下午 7 点 |\n|`%M`| 分钟 | 00 至 59 |\n|`%S`|\
  \ 秒 | 00 至 59 |\n|`%I`| 12 小时制的小时 | 01 至 12 |\n|`%p`| 上午或下午 | AM 或 PM |\n\n请参考图\
  \ 3-10 中`coffeeshop`数据集的`Date`变量。该变量的日期格式为 dd/mmm/yyyy。\n\n![A978-1-4842-0139-8_3_Fig10_HTML.jpg](img/A978-1-4842-0139-8_3_Fig10_HTML.jpg)\n\
  \n图 3-10. `coffeeshop`数据集（详见附录 C）\n\n要转换该变量为`date`类别，请使用以下命令：\n\n```\n> coffeeshop$Date<-as.Date(coffeeshop$Date,\
  \ \"%d/%b/%Y\")\n```\n\n格式`%d/%b/%Y`告诉 R，期望看到的是日期（`%d`）、三字母的月份缩写（`%b`）和四位数的年份（`%Y`），各部分之间用斜杠分隔。该格式必须用引号括起来。\n\
  \nR 有两种无需指定格式即可识别的日期格式，即 yyyy-mm-dd 和 yyyy/mm/dd。如果您的日期属于这两种格式之一，那么在使用`as.Date`函数时无需提供格式。\n\
  \n对于包含日期和时间信息的变量，请使用`strptime`函数将其转换为`POSIXlt`类别。\n\n例如，假设您想根据`flights`数据集中的`Date`和`Time`变量创建一个新的日期时间变量（参考图\
  \ 3-6）。\n\n在创建日期时间变量之前，您需要使用`paste`函数将这两个变量合并成一个单一的字符变量（请参考“连接字符串”部分）：\n\n```\n\
  > flights$DateTime<-paste(flights$Date, flights$Time)\n```\n\n一旦日期和时间被组合在同一个字符串中，您就可以使用`strptime`函数来转换变量类别。`strptime`函数的使用方法与`as.Date`函数相同：\n\
  \n```\n> flights$DateTime<-strptime(flights$DateTime, \"%d/%m/%Y %H:%M\")\n```\n\
  \n一旦您的变量属于`date`或`POSIXlt`类别，您就可以使用专为这些变量类别设计的函数执行多种与日期相关的操作。\n\n例如，要计算两个日期或日期时间之间的时间间隔长度，请使用`difftime`函数：\n\
  \n```\n> dataset$duration <- difftime(dataset$enddate, dataset$startdate, units=\"\
  hours\")\n```\n\n`units`参数的可选值有`secs`、`mins`、`hours`、`days`（默认值）和`weeks`。\n\n要将日期变量与当前日期进行比较（例如，计算年龄），请使用`Sys.Date`函数：\n\
  \n```\n> dataset$age <- difftime(Sys.Date(), dataset$dob)\n```\n\n您可以使用算术运算符来增加或减少天数（针对日期变量）或秒数（针对`POSIXlt`变量）。例如，要计算给定日期前一周的日期：\n\
  \n```\n> dataset$newdatevar <- dataset$datevar - 7\n```\n\n要确定某个日期是星期几，请使用`weekdays`函数。此外还有类似的函数，名为`months`和`quarters`：\n\
  \n```\n> coffeeshop$Day<-weekdays(coffeeshop$Date)\n```\n\n`round`函数也可用于日期时间变量。指定时间单位之一：`secs`、`mins`、`hours`或`days`：\n\
  \n```\n> round(flights$DateTime, units=\"hours\")\n```\n\n您可以使用`format`函数从日期变量生成一个字符变量。使用表\
  \ 3-1 中给出的格式符号，指定您希望 R 如何显示日期：\n\n```\n> dataset$charvar <- format(dataset$datevar,\
  \ format=\"%d.%m.%Y\")\n```\n\n## 添加和删除观测值\n\n您可以使用数据编辑器向数据框添加新的观测值，并使用方括号符号删除特定的观测值。R\
  \ 有一个名为`unique`的特殊函数用于删除重复值。\n\n如果您想删除所有符合特定条件或属于特定分组的观测值，请使用`subset`函数，如本章后续“根据选择标准选取子集”部分所述。\n\
  \n### 添加新观测值\n\n向数据集添加额外观测值最简单的方法是使用数据编辑器。您可以通过以下命令打开它：\n\n```\n> fix(dataset)\n\
  ```\n\n当编辑器窗口打开时，在现有数据下方的第一个空行中输入新观测值的值。如果有任何值缺失，请将相应的单元格留空。添加完新值后，关闭数据编辑器以应用更改。\n\
  \n### 删除特定观测值\n\n从数据集中删除单个观测值的最简单方法是使用方括号表示法（参见第 1 章中的“数据框”部分）。例如，要删除观测值编号 2、4 和\
  \ 7，请使用命令：\n\n```\n> dataset <- dataset[-c(2,4,7),]\n```\n\n请务必在右括号前包含逗号；否则，您将删除列而不是行。\n\
  \n请记住，您也可以使用冒号符号（`:`）来选择一个连续的观测值范围。例如，要删除观测值 2 到 10，请使用命令：\n\n```\n> dataset <-\
  \ dataset[-c(2:10),]\n```\n\n\n\n## 移除重复观测值\n\n要从数据集中移除重复的观测值，请使用 `unique` 函数。\n\
  \n```\n> dataset <- unique(dataset)\n```\n\n若要在移除重复值前将其另存为单独的数据集，请使用 `duplicated`\
  \ 函数：\n\n```\n> dups <- dataset[duplicated(dataset),]\n```\n\n## 选择数据子集\n\n可以根据数据属性定义的筛选条件来选择观测值，也可以随机选择以形成随机样本。\n\
  \n### 根据筛选条件选择子集\n\n有时你可能需要选择一个数据集的子集，其中仅包含符合特定条件的观测值，例如属于某个特定类别，或某个数值变量的值落在给定范围内。这可以通过\
  \ `subset` 函数实现。该命令的一般形式为：\n\n```\n> subset(dataset, condition)\n```\n\n例如，要从 `people`\
  \ 数据集中选择 `Eye.Color` 变量值为 `Brown` 的所有观测值，请使用命令：\n\n```\n> subset(people, Eye.Color==\"\
  Brown\")\n\nSubject  Eye.Color  Height  Hand.Span  Sex  Handedness\n1        1 \
  \     Brown     186        210    1           R\n3        3      Brown     147 \
  \       167    2\n5        5      Brown     170        193    1           R\n11\
  \      11      Brown     163        223    1           R\n16      16      Brown\
  \     173        196    1           R\n```\n\n注意，必须使用两个等号，而不是一个。\n\n要将选定的观测值保存到新数据集，请将输出赋值给一个新的数据集名称：\n\
  \n```\n> browneyes <- subset(people, Eye.Color==\"Brown\")\n```\n\n要选择变量值等于列表中任一值的所有观测值，请使用\
  \ `%in%` 运算符。例如，要选择 `Eye.Color` 为 `Brown` 或 `Green` 的所有观测值，请使用命令：\n\n```\n> subset(people,\
  \ Eye.Color %in% c(\"Brown\", \"Green\"))\n\nSubject  Eye.Color  Height  Hand.Span\
  \  Sex  Handedness\n1        1      Brown     186        210    1           R\n\
  2        2      Green     182        220    1           R\n3        3      Brown\
  \     147        167    2\n4        4      Green     157        180    2       \
  \    L\n5        5      Brown     170        193    1           R\n11      11  \
  \    Brown     163        223    1           R\n15      15      Green     160  \
  \      190    2\n16      16      Brown     173        196    1           R\n```\n\
  \n若要排除而非包含某些观测值，请将 `==` 替换为 `!=`（意为“不等于”）。例如，要排除 `Eye.Color` 值等于 `\"Blue\"` 的所有观测值，请使用命令：\n\
  \n```\n> subset(people, Eye.Color!=\"Blue\")\n```\n\n观测值也可以根据数值变量的值进行选择。例如，要从 `people`\
  \ 数据集中选择 `Height` 变量等于 169 的所有观测值，请使用命令：\n\n```\n> subset(people, Height==169)\n\
  \nSubject  Eye.Color  Height  Hand.Span  Sex  Handedness\n6         6       Blue\
  \     169        190    2           L\n```\n\n注意，数值不需要加引号。\n\n对于数值变量，你还可以使用关系运算符来选择观测值。例如，要选择\
  \ `Height` 变量值小于 165 的所有观测值，请使用命令：\n\n```\n> subset(people, Height<165)\n\nSubject\
  \  Eye.Color  Height  Hand.Span  Sex  Handedness\n3          3      Brown     147\
  \        167    2\n4          4      Green     157        180    2           L\n\
  11        11      Brown     163        223    1           R\n15        15      Green\
  \     160        190    2\n```\n\n你可以使用的其他关系运算符包括 `>`（大于）、`>=`（大于或等于）和 `<=`（小于或等于）。\n\
  \n你可以使用 AND 运算符（表示为 `&`）和 OR 运算符（表示为 `|`）来组合两个或多个条件。当两个条件用 AND 运算符连接时，R 仅选择同时满足这两个条件的观测值。当它们用\
  \ OR 运算符连接时，R 选择满足任一条件或同时满足两个条件的观测值。\n\n例如，要选择 `Eye.Color` 为 `Brown` 且 `Height`\
  \ 小于 165 的观测值，请使用命令：\n\n```\n> subset(people, Eye.Color==\"Brown\" & Height<165)\n\
  \nSubject  Eye.Color  Height  Hand.Span  Sex  Handedness\n3          3      Brown\
  \     147        167    2\n11        11      Brown     163        223    1     \
  \      R\n```\n\n除了选择数据集的观测值子集外，你还可以使用 `select` 参数来选择要保留的变量。\n\n```\n> subset(people,\
  \ Height<165, select=c(Hand.Span, Height))\n\nHand.Span  Height\n3          167\
  \     147\n4          180     157\n11         223     163\n15         190     160\n\
  ```\n\n另一种对数据集取子集的方法是使用方括号符号。例如，此命令仅选择棕色眼睛的人：\n\n```\n> people[people$Eye.Color==\"\
  Brown\",]\n```\n\n请注意，在进行分析之前，并非总需要对数据集进行子集划分。许多分析函数内部都有一个 `subset` 参数。这允许你针对数据的子集执行分析。例如，此命令创建了一个身高与手展的散点图，仅显示男性（即\
  \ `Sex` 等于 2 的情况）：\n\n```\n> plot(Height ~ Hand.Span, people, subset=Sex==2)\n```\n\
  \n你将在第 8 章中了解更多关于散点图的信息。\n\n### 从数据集中选取随机样本\n\n要从数据集中选取随机样本的观测值，请使用 `sample` 函数。例如，以下命令从名为\
  \ `dataset` 的数据集中随机抽取 50 个观测值，并将其保存到名为 `sampledata` 的新数据集中：\n\n```\n> sampledata\
  \ <- dataset[sample(1:nrow(dataset), 50),]\n```\n\n默认情况下，`sample` 函数进行无放回抽样，因此任何观测值都不会被选中超过一次。因此，样本大小必须小于数据集中的观测值数量。要进行有放回抽样，请将\
  \ `replace` 参数设置为 `T`：\n\n```\n> sampledata <- dataset[sample(1:nrow(dataset), 50,\
  \ replace=T),]\n```\n\n## 对数据集排序\n\n你可以使用 `order` 函数对数据集进行排序。例如，要按 `Hand.Span` 变量对\
  \ `people` 数据集排序，请使用命令：\n\n```\n> people <- people[order(people$Hand.Span),]\n\n\
  \     Subject  Eye.Color  Height  Hand.Span  Sex  Handedness\n3          3     \
  \ Brown     147        167    2\n10        10       Blue     166        178    2\
  \           R\n4          4      Green     157        180    2           L\n6  \
