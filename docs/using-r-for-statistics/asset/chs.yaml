  类似地，要选择整列，请将行号留空。例如，选择 `Puromycin` 数据集的第二列：


  ```

  > Puromycin[,2]

  [1]  76  47  97 107 123 139 159 152 191 201 207 200  67  51  84  86  98 115 131

  [20] 124 144 158 160

  ```


  在选择整列时，你也可以完全省略逗号，只给出列号。


