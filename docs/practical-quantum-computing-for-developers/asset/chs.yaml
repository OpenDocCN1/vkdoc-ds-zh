- "# 5. 启动引擎：从量子随机数到隐形传态，在超密编码处进站\n\n本章将带您领略量子系统三种卓越的信息处理能力。我们从一个最简单的程序开始，探索量子力学本质上的随机性作为真正随机性的来源。接下来，本章将着眼于两个或许令人兴奋但相互关联的程序：超密编码和量子隐形传态。在超密编码中，您将学习如何使用单个量子比特发送\
  \ 2 个经典比特的信息。在量子隐形传态中，您将学习如何通过混合经典-量子信息传输过程来重建一个量子比特的量子态。所有算法都包括针对 IBM Q Experience\
  \ Composer 的电路设计以及 Python 和 QASM 代码。将收集结果用于展示和分析，那么让我们开始吧。\n\n## 量子随机数生成\n\n在本节中，您将学习如何利用量子计算机的概率性质，通过阿达马门生成随机比特或数字。\n\
  \n### 使用阿达马门生成随机比特\n\n阿达马门是任何量子信息系统中的基本门之一。它用于将量子比特置于态的叠加中。代数学上，它由以下矩阵描述\n\n```\n\
  H = 1/√2 * [[1, 1], [1, -1]]\n```\n\n为了更好地理解该矩阵如何将量子比特置于叠加态，请考虑单个量子比特的几何表示：\n\n\
  在图 5-1 中，量子比特的基态使用右矢符号描述，其中 `|0⟩ = [1, 0]` 且 `|1⟩ = [0, 1]`。从前一章中可知，右矢只是一个酉向量（长度为\
  \ 1 的向量）。因此，一般态（或叠加态）由酉向量 ψ = α|0⟩ + β|1⟩ 定义，其中 α 和 β 是复系数。将 H 应用于基态，得到\n\n```\n\
  H|0⟩ = 1/√2 * [[1, 1], [1, -1]] * [1, 0] = 1/√2 * [1, 1] = 1/√2 ( [1, 0] + [0, 1]\
  \ ) = (|0⟩ + |1⟩) / √2\n```\n\n```\nH|1⟩ = 1/√2 * [[1, 1], [1, -1]] * [0, 1] = 1/√2\
  \ * [1, -1] = 1/√2 ( [1, 0] - [0, 1] ) = (|0⟩ - |1⟩) / √2\n```\n\n对于叠加态 ψ：\n\n```\n\
  ψ = α|0⟩ + β|1⟩ → α * ((|0⟩ + |1⟩) / √2) + β * ((|0⟩ - |1⟩) / √2) = (α + β) / √2\
  \ * |0⟩ + (α - β) / √2 * |1⟩\n```\n\n总而言之，阿达马门扩展了量子电路可能达到的状态范围。这一点很重要，因为状态的扩展创造了找到捷径的可能性，从而实现更快的计算。\n\
  \n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig1_HTML.jpg](img/469026_1_En_5_Fig1_HTML.jpg)\n\
  \n**图 5-1**  \n量子比特一般（叠加）态 ψ 的几何表示\n\n\n\n###### 提示\n\n量子力学指出，即使完全掌握物理定律或粒子的初始条件，我们也无法确定性地预测前述基态中系数`α`和`β`的值。我们最多能做的就是计算概率。\n\
  \n基于这一原理，随机比特生成器电路的实现可谓简单至极。在 IBM Q Experience Composer 中，创建一个电路：为第一个量子比特添加一个 Hadamard\
  \ 门，然后按图 5-2 所示在基态下执行测量。\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig2_HTML.jpg](img/469026_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2：随机比特生成电路\n\n不建议在实际设备上运行此电路，因为可能需要等待一段时间（请注意，执行任务需要排期，等待时间取决于运行队列中的任务数量）。此外，在实际设备上每次执行都会消耗您的积分。建议在模拟器上运行该电路以立即获得结果（见图\
  \ 5-3）。请注意，每个结果（0 或 1）出现的概率均为 ½，因此我们可以这样生成随机比特：如果结果为`1`的概率 > ½，则输出 1，否则输出 0。\n\n\
  ![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig3_HTML.jpg](img/469026_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3：图 5-2 中电路的执行结果\n\n当然，这是一种效率极低的随机比特生成方式。更好的方法是编写一个 QISKit Python 脚本，以编程方式创建电路来完成此任务。代码清单\
  \ 5-1 展示了一个简单脚本，它使用`x`个量子比特生成`n`个随机数，其中比特位数为`2^x`。默认情况下，该脚本使用 3 个量子比特生成 10 个 8 位随机数，即`n\
  \ = 10`且`x = 3`，对应`2³ = 8`。让我们来仔细分析：\n\n*   第 12 行定义函数`qrng`，用于创建使用`n`个量子比特的电路。\n\
  *   使用 QISKit API，第 15-21 行创建了一个包含`n`个量子比特和`n`个经典寄存器的`QuantumProgram`，用于存储测量结果。\n\
  *   对所有量子比特应用 Hadamard 门，然后对每个量子比特执行测量，最后将结果存入经典寄存器`n`（第 30-35 行）。\n*   通过系统调用`set_api(API-TOKEN,\
  \ URL)`将电路编译后，在 Q Experience 远程模拟器上运行。请注意，您需要使用包含 API 令牌和端点 URL 的配置描述符。电路执行后，收集结果计数（第\
  \ 40-51 行）。\n*   最后，查看结果计数以生成随机比特。例如，给定结果`{'100': 133, '101': 134, '011': 131, '110':\
  \ 125, '001': 109, '111': 128, '010': 138, '000': 126}`。对于每个结果，如果其计数大于平均概率，则得到 1，否则得到\
  \ 0。平均概率通过将总执行次数（本例中为 1024）除以结果总数（`2^x`，其中`x`是量子比特数，默认为 3 – 1024/8 = 128）计算得出。因此，对于上述结果：\n\
  \n| `133` | `1` |   |   |   |\n| `134` | `1` |   | `11100010 = 226` |   |\n| `131`\
  \ | `1` |   |   |   |\n| `125` | `0` |   |   |   |\n| `109` | `0` |   |   |   |\n\
  | `128` | `0` |   |   |   |\n| `138` | `1` |   |   |   |\n| `126` | `0` |   |  \
  \ |   |\n\n```\n#############################\nimport sys,time\nimport qiskit\n\
  import logging\nfrom qiskit import QuantumProgram\n##### Q Experience config\nsys.path.append('../Config/')\n\
  import Qconfig\n##### Generate an 2**n bit random number where n = # of qubits\n\
  def qrng(n):\n# create a  program\nqp = QuantumProgram()\n##### create n qubit(s)\n\
  quantum_r = qp.create_quantum_register(\"qr\", n)\n##### create n classical registers\n\
  classical_r = qp.create_classical_register(\"cr\", n)\n##### create a circuit\n\
  circuit = qp.create_circuit(\"QRNG\", [quantum_r], [classical_r])\n##### enable\
  \ logging\n#qp.enable_logs(logging.DEBUG);\n##### Hadamard gate to all qubits\n\
  for i in range(n):\ncircuit.h(quantum_r[i])\n##### measure qubit n and store in\
  \ classical n\nfor i in range(n):\ncircuit.measure(quantum_r[i], classical_r[i])\n\
  ##### backend simulator\nbackend = 'ibmq_qasm_simulator'\n##### Group of circuits\
  \ to execute\ncircuits = ['QRNG']\n##### Compile your program: ASM print(qp.get_qasm('Circuit')),\
  \ JSON: print(str(qobj))\n##### set the APIToken and Q Experience API url\nqp.set_api(Qconfig.APItoken,\
  \ Qconfig.config['url'])\nshots=1024\nresult = qp.execute(circuits, backend, shots=shots,\
  \ max_credits=3, timeout=240)\n##### Show result counts\n##### counts={'100': 133,\
  \ '101': 134, '011': 131, '110': 125, '001': 109, '111': 128, '010': 138, '000':\
  \ 126}\ncounts = result.get_counts('QRNG')\nbits = \"\"\nfor v in counts.values():\n\
  if v > shots/(2**n) :\nbits += \"1\"\nelse:\nbits += \"0\"\nreturn int(bits, 2)\n\
  ###########################################\nif __name__ ==  '__main__':\nstart_time\
  \ = time.time()\nnumbers = []\n##### generate 100 8 bit rands\nsize = 10\nqubits\
  \ = 3 # bits = 2**qubits\nfor i in range(size):\nn = qrng(qubits)\nnumbers.append(n)\n\
  print (\"list=\" + str(numbers))\nprint(\"--- %s seconds ---\" % (time.time() -\
  \ start_time))\n```\n\n代码清单 5-1：生成`2x`位随机数的量子程序\n\n###### 警告\n\n在执行任何程序之前，请务必确保您的配置正确，包括有效的\
  \ API 令牌和端点 URL。这是最常见的问题来源。请记住，如果忽略这个关键步骤，程序将运行失败。\n\n代码清单 5-1 的量子电路如图 5-4 所示。该电路使用\
  \ 3 个量子比特生成一个介于 0 到 255 之间的 8 位随机数。\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig4_HTML.jpg](img/469026_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4：代码清单 5-1 的 Q Experience 电路\n\n让我们从多次运行中收集一些数据，并对结果进行检验。\n\n### 检验随机性结果\n\
  \nLinux 提供了一个便捷的程序`ent`（entropy 的缩写），它被称为伪随机数序列测试程序^(³⁰)。我们可以使用此命令来测试上一节中生成的数字。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n###### 提示\n\nWindows\
  \ 用户——可从项目网站下载 Windows 32 位二进制文件。本书配套源码中的 `Workspace\\Ch05\\ent.exe` 也包含了一个二进制文件。\n\
  \n因此，我收集了约 200 个使用清单 5-1 生成的随机 8 位数。使用 `ent`，可以通过命令 `ent [infile]` 对该序列进行测试，如下一段所示。\n\
  \n```\nC:\\Workspace\\Ch05>ent qrnd-stdout.txt\nEntropy = 3.122803 bits per byte.\n\
  Optimum compression would reduce the size of this 805 byte file by 60 percent.\n\
  Chi square distribution for 805 samples is 29149.54, and randomly would exceed this\
  \ value less than 99.9 percent of the times.\nArithmetic mean value of data bytes\
  \ is 46.1503 (127.5 = random).\nMonte Carlo value for Pi is 4.000000000 (error 27.32\
  \ percent).\nSerial correlation coefficient is -0.356331 (totally uncorrelated =\
  \ 0.0).\n```\n\n根据作者的说明，卡方检验用于判断随机序列的质量。如果卡方百分比分布小于 1% 或大于 99%，则该序列不合格。我的输出显示百分比为\
  \ 99.9%，这表明这些数字的随机性很低。这很可能是因为我使用了远程模拟器。该模拟器可能基于默认的 UNIX 随机数生成器（一种质量较差的生成器）。看看你的序列是否表现更好。下表展示了由\
  \ `ENT` 的开发者提供的，来自各种确定性和量子源的测试结果对比。\n\n表 5-1\n\n`ENT` 收集的来自不同源的随机性测试结果\n\n| 源 |\
  \ 卡方百分比 |\n| --- | --- |\n| UNIX `rand()` | 500,000 个样本为 99.9%（差） |\n| Park & Miller\
  \ 改进的 UNIX 生成器 | 500,000 个样本为 97.53%（较好） |\n| HotBits：通过放射性衰变生成的随机数 | 500,000 个样本为\
  \ 40.98%（最好） |\n\n上表清楚地表明，不应信任 UNIX `rand()` 用于随机数生成。如果需要大量真正的随机数（例如，生成加密密钥），请使用量子源，例如\
  \ HotBits。总而言之，本节的目的在于让您通过一个简单的随机数生成量子电路来初步体验。下一节将通过一种名为**超密编码**的奇异量子数据传输协议，将内容提升到新的水平。\n\
  \n## 超密编码\n\n超密编码是一种数据传输协议，它展示了量子系统卓越的信息处理能力。从形式上讲，超密编码是一个简单的过程，它允许使用一个量子比特向另一方传输\
  \ 2 个经典比特的信息。该协议如图 5-5 所示。\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig5_HTML.jpg](img/469026_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\n超密编码协议\n\n1.  该过程从一个第三方（Eve）生成所谓的贝尔对开始。Eve 从基态 `|0>` 中的 2 个量子比特开始。她对第一个量子比特应用一个\
  \ Hadamard 门以创建叠加态。然后，她使用第一个量子比特作为控制（点），第二个量子比特作为目标（+），应用一个 CNOT 门。这产生了表 5-2 所示的状态。\n\
  \n    表 5-2\n\n    贝尔对状态\n\n    | 门 | 结果状态 | 详情 |\n    | --- | --- | --- |\n   \
  \ | H | `∣00⟩ →  ∣ 00⟩+ ∣ 10⟩` | 当 H 门应用于第一个量子比特时，它进入叠加态；因此我们得到状态 00 + 10，其中第二个量子比特保持为\
  \ 0。请注意，为简化起见，省略了 Hadamard 矩阵中的平方根 (2)。 |\n    | CNOT | `∣00⟩+ ∣ 10⟩ →  ∣ 00⟩+ ∣\
  \ 11⟩` | CNOT 门将两个量子比特纠缠在一起。特别地，如果控制 (.) 为 1，它会翻转目标 (+)，否则保持不变。因此，如果第一个量子比特为 1，我们翻转第二个量子比特，得到\
  \ 00 + 11。 |\n\n2.  在该过程的第二步，第一个量子比特被发送给 Alice，第二个发送给 Bob。请注意，Alice 和 Bob 可能位于远程地点。该协议的目标是让\
  \ Alice 使用她的量子比特向 Bob 发送 2 个经典比特的信息。但在她这样做之前，她需要根据她想发送的 2 比特信息，对她自己的量子比特应用一组量子规则（或门）。（见表\
  \ 5-3。）\n\n    表 5-3\n\n    超密编码的编码规则\n\n    | 规则 | 结果状态 |\n    | --- | --- |\n\
  \    | 00: I（单位门）<br>01: X<br>10: Z<br>11: ZX | `I(00+11) = 00 + 11`<br>`X(00+11)\
  \ = 10 + 01`<br>`Z(00+11) = 00 – 11`<br>`ZX(00+11) = 10 – 11` |\n\n3.  因此，如果她发送\
  \ 00，她对她自己的量子比特不做任何操作（应用单位门）。如果她发送 01，那么她应用 X 门（或比特翻转）。对于 10，她应用 Z 门。请注意，如果量子比特为\
  \ 1，Z 门会翻转该量子比特的符号（相位）。因此 `Z | 0⟩ = |0⟩`，`Z | 1⟩ = − | 1⟩`。最后，如果她发送 11，那么她将门 XZ\
  \ 应用于她的量子比特。然后 Alice 将她的量子比特发送给 Bob 以进行该过程的最后一步。\n\n4.  Bob 接收 Alice 的量子比特（量子比特\
  \ 0），并使用他自己的量子比特来逆转由 Eve 创建的贝尔状态的过程。也就是说，他将 CNOT 门应用于第一个量子比特，接着应用 Hadamard 门 (H)，最后在两个量子比特上进行测量，以提取编码在\
  \ Alice 量子比特中的 2 个经典比特（见表 5-4）。\n\n    表 5-4\n\n    恢复后的量子比特状态\n\n    | 门 | 结果状态\
  \ | 详情 |\n    | --- | --- | --- |\n    | CNOT | `00 + 10`<br>`11 + 01`<br>`00 –\
  \ 10`<br>`11 – 10` | 我们从第 2 步中 Alice 的状态开始：<br>`00 + 11`<br>`10 + 01`<br>`00 – 11`<br>`10\
  \ – 11`<br>CNOT 门在第一个量子比特为 1 时翻转第二个量子比特，从而得到第 #2 列中的状态。 |\n    | H | `00`<br>`01`<br>`10`<br>`–11`\
  \ | 将 Hadamard 应用于最后一行中的第一个量子比特，得到第 #2 列中的结果。当 Bob 在计算基态中进行测量时，他最终会得到四种可能的输出，每个输出概率为\
  \ 1。这些输出与 Alice 在第 2 步第 #1 列中想要发送的内容相匹配。请注意，最后一个输出带有负号。然而，由于概率是按振幅平方计算的，–1 变成了 1，这是正确的。\
  \ |\n\n让我们在 IBM Q Experience Composer 的一个电路中把所有这些整合起来。\n\n### Composer 的电路\n\n图\
  \ 5-6 展示了超密编码电路以及 Composer 中的量子汇编代码：\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig6_HTML.jpg](img/469026_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n\n用于 Q Experience 的超密编码电路\n\n- 电路首先创建贝尔对；也就是说，它将 `qubit[0]` 置于叠加态（使用 Hadamard\
  \ 门），然后通过 CNOT 门将其与 `qubit[1]` 纠缠在一起。\n\n- 接下来的两个门代表 Alice 的编码规则。记住，她应用单位门（不做任何操作）来编码比特\
  \ 00，应用 X 来编码 01，应用 Z 来编码 10，应用 ZX 来编码 11。在这个特定示例中，编码的比特是 11。这在图 5-6 中屏障符号的左侧显示。请注意，屏障将阻止执行，直到两个量子比特的所有门都被消耗完毕。\n\
  \n- 在屏障符号的右侧，是 Bob 的协议。他基本上执行与 Alice 相反的操作。他对量子比特应用 CNOT 门，然后应用 Hadamard 门。最后，在两个量子比特上进行测量，以提取编码后的\
  \ 2 个经典比特。\n\n在模拟器中运行上述电路，结果应该是一个条形图，其中输出 11 的概率非常接近或等于 1。该结果应与下一节使用 Python 脚本获得的结果相匹配。\n\
  \n\n\n### 使用 Python 远程运行\n\n清单 5-2 展示了图 5-6 中电路对应的 Python 脚本：\n\n-   第 17-19 行创建\
  \ 2 个量子比特和两个经典寄存器用于存储结果。\n-   接着，利用纠缠的贝尔态（第 22-14 行）创建`superdense`电路。\n-   爱丽丝通过应用`Z`和`X`门将\
  \ 11 编码。可选择性地注释掉其中任意一条语句以编码不同的组合，然后确保结果与爱丽丝的编码方案一致（第 32-35 行）。\n-   鲍勃反转爱丽丝的操作并测量量子比特（第\
  \ 38-41 行）。\n-   最后，电路在远程模拟器（`ibmq_qasm_simulator`）上执行，并使用 Python 优秀的绘图支持库显示结果。\n\
  \n```python\nimport sys,time,math\n##### 导入 QISKit\nfrom qiskit import QuantumCircuit,\
  \ QuantumProgram\nsys.path.append('../Config/')\nimport Qconfig\n##### 导入基本绘图工具\n\
  from qiskit.tools.visualization import plot_histogram\ndef main():\n##### 量子程序设置\n\
  Q_program = QuantumProgram()\nQ_program.register (Qconfig.APItoken, Qconfig.config[\"\
  url\"])\n##### 创建寄存器\nq = Q_program.create_quantum_register(\"q\", 2)\nc = Q_program.create_classical_register(\"\
  c\", 2)\n##### 创建共享纠缠态的量子电路\nsuperdense = Q_program.create_circuit(\"superdense\"\
  , [q], [c])\nsuperdense.h(q[0])\nsuperdense.cx(q[0], q[1])\n##### 对于 00，不做任何操作\n\
  ##### 对于 10，应用 X 门\n##### superdense.x(q[0])\n##### 对于 01，应用 Z 门\n##### superdense.z(q[0])\n\
  ##### 爱丽丝：对于 11，应用 ZX 门\nsuperdense.z(q[0])\nsuperdense.x(q[0])\nsuperdense.barrier()\n\
  ##### 鲍勃\nsuperdense.cx(q[0], q[1])\nsuperdense.h(q[0])\nsuperdense.measure(q[0],\
  \ c[0])\nsuperdense.measure(q[1], c[1])\ncircuits = [\"superdense\"]\nprint(Q_program.get_qasms(circuits)[0])\n\
  backend = \"ibmq_qasm_simulator\" #ibmqx2 量子设备\nshots = 1024       # 实验中的射击次数\n\
  result = Q_program.execute(circuits, backend=backend, shots=shots, max_credits=3,\
  \  timeout=240)\nprint(\"计数:\" + str(result.get_counts(\"superdense\")))\nplot_histogram(result.get_counts(\"\
  superdense\"))\n###########################################\n##### 主函数\nif __name__\
  \ ==  '__main__':\nstart_time = time.time()\nmain()\nprint(\"--- %s 秒 ---\" % (time.time()\
  \ - start_time))\n```\n\n*清单 5-2：超密编码 Python 脚本*\n\n接下来，我们在下一节看看清单 5-2 单次运行的结果。\n\
  \n### 查看结果\n\n清单 5-2 一次运行的标准输出如下所示：\n\n```assembly\nC:\\python36-64\\python.exe\
  \ p05-superdensecoding.py\nOPENQASM 2.0;\ninclude \"qelib1.inc\";\nqreg q[2];\n\
  creg c[2];\nh q[0];\ncx q[0],q[1];\nz q[0];\nx q[0];\nbarrier q[0],q[1];\ncx q[0],q[1];\n\
  h q[0];\nmeasure q[0] -> c[0];\nmeasure q[1] -> c[1];\n计数:{'11': 1024}\n--- 167.52969431877136\
  \ 秒 ---\n```\n\n脚本输出了电路的汇编代码以及结果的计数：`{'11': 1024}`，外加执行时间。结果计数用于通过将射击次数（1024）除以结果计数（1024）来计算结果的概率。因此结果为\
  \ 11 的概率为 1，如清单 5-2 最后一步运行的图表所示（见图 5-7）。请注意，在模拟器中执行时，概率始终为 1，即 counts = shots。然而，如果你在真实的量子设备上运行，由于噪声和环境误差，计数次数应小于\
  \ 1024，导致概率小于 1。\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig7_HTML.jpg](img/469026_1_En_5_Fig7_HTML.jpg)\n\
  \n*图 5-7：超密编码结果图*\n\n因此，超密编码提供了一种将 2 个经典比特编码到单个量子比特中的方法。值得注意的是，量子计算理论指出每个量子比特不可能存储超过一个经典比特的信息，这似乎与本协议所展示的内容相矛盾。事实上，这并不矛盾。该协议之所以有效，是因为爱丽丝和鲍勃的量子比特通过贝尔态发生了纠缠。这使得可以在爱丽丝的纠缠量子比特中发送\
  \ 2 个经典比特。总之，只要你的量子比特通过贝尔态与另一个量子比特纠缠，每个量子比特最多可以存储 2 个经典比特。\n\n从广义上讲，此协议可以解释为一组模块化抽象：一个用于创建\
  \ 2 个纠缠量子比特的贝尔态生成器模块，接着是一个信息编码器模块，该模块应用爱丽丝的规则来编码 2 个经典比特的信息。最后，解码器模块从贝尔态以及编码器模块提供的量子比特中提取经典比特（如果你愿意，可以将其视为一种量子压缩/解压缩工具）。超密编码为量子信息处理提供了一个高级视角，并将帮助你理解本章的下一项内容：量子隐形传态。\n\
  \n###### 提示\n\n这个简单的协议是由物理学家查尔斯·贝内特于 1992 年开发的，距离量子力学的发现已近 70 年。尽管它相对简单，但并非显而易见的过程，深入研究它可以学到很多非凡的东西。\n\
  \n\n\n## 量子隐形传态\n\n量子隐形传态是一种与超级密集编码密切相关的过程。也许\"隐形传态\"这个术语有些夸张，因为我们实际上并没有传输任何实物，至少不是科幻或`《星际迷航》`中的那种含义。从形式上讲，量子隐形传态是指借助经典通信和上一节讨论的贝尔对，将一个量子比特的状态（`ψ`）从一个位置传输到另一个位置的过程。该过程总结在图\
  \ 5-8 中。\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig8_HTML.jpg](img/469026_1_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8：量子隐形传态工作流程\n\n1. Alice 和 Bob 首先共享一个由纠缠量子比特组成的贝尔对。其中一个量子比特归 Alice，另一个归位于不同远程地点的\
  \ Bob。假设这个贝尔对由第三方（Eve）制备。\n2. Alice 准备她想要隐形传态的量子比特，其状态为 `|ψ⟩ = α|0⟩ + β ∣ 1⟩`。然后，她对自己的量子比特以及\
  \ Eve 提供的贝尔对中的纠缠量子比特执行贝尔基测量。Alice 随后通过经典方式将测量结果发送给 Bob。\n3. 此时，Bob 的量子比特处于一个后验状态，该状态是\
  \ Alice 所执行测量的函数。这是理解整个过程的关键；请记住，两人共享一个纠缠量子比特。因此，我们将看到 Bob 如何通过应用适当的量子门来恢复 Alice\
  \ 创造的原始状态 `ψ`。\n\n让我们通过观察 Bob 的量子比特在 Alice 测量时刻（在恢复操作之前）的后验状态来弄清楚这一点。为此，我们写出过程中涉及的三个量子比特的联合状态。注意，为了简单起见，我们忽略了右矢符号。因此，给定\
  \ Alice 的状态 `|ψ⟩ = α|0⟩ + β ∣ 1⟩`，如果我们将其与 Eve 提供的共享贝尔对中的纠缠量子比特结合，我们得到：\n\n```\n\
  (α0 + β1) (00 + 11) = α000 + α011 + β100 + β111       (1)\n```\n\n现在，我们需要使用贝尔基态来表示前两个量子比特的状态：\n\
  \n| `B0 = 00 + 11` | `00 = B0 – B1` |\n| --- | --- |\n| `B1 = 10 + 01` | `01 = B1\
  \ – B3` |\n| `B2 = 00 – 11` | `10 = B1 – B3` |\n| `B3 = 10 – 01` | `11 = B0 – B2`\
  \ |\n\n表达式 (1) 变为：\n\n```\n(α0 + β1) (00 + 11) = B0 (α0 + β1) + B1 (α1 + β0) + B2\
  \ (α0 – β1) + B3 (-α1 + β0)                                                    \
  \          (2)\n```\n\n表达式 (2) 展示了 Alice 执行测量后三个量子比特的状态。Bob 通过观察表达式 2 中（括号内的）量子比特后验状态，知道如何恢复\
  \ Alice 的 `ψ`。这在表 5-5 中展示得更清楚。\n\n表 5-5：量子隐形传态恢复\n\n| 贝尔态 | 后验状态 | Bob 的恢复操作 |\n\
  | --- | --- | --- |\n| `B0` | `α0 + β1` | `ψ` |\n| `B1` | `α1 + β0` | `Xψ` |\n|\
  \ `B2` | `α0 – β1` | `Zψ` |\n| `B3` | `–α1 + β0` | `ZXψ` |\n\n总而言之，量子隐形传态协议提供了一种方法，通过让两个远程方共享一个纠缠贝尔对来恢复任何量子比特的状态\
  \ `ψ`，因此得名\"隐形传态\"。现在，让我们为该协议构建一个电路，在模拟器中运行它，最后查看结果。\n\n### 适用于 Composer 的电路\n\n\
  图 5-9 显示了量子隐形传态协议的 Composer 电路以及执行结果（目前仅限模拟器，无真实设备）：\n\n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig9_HTML.jpg](img/469026_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9：适用于 Composer 的量子隐形传态电路\n\n-   障碍符（虚线）左侧的门代表由第三方 (Eve) 制备的贝尔对：量子比特 1 和 2。\n\
  -   Alice 准备她的量子比特（0）到给定的状态 `ψ`。`ψ` 的实际值无关紧要，因为它在流程的最后阶段会被 Bob 恢复。Alice 从 Eve 那里接收\
  \ `量子比特[1]`，而 `量子比特[2]` 则交给 Bob。\n-   Alice 对她的量子比特 `[0, 1]` 执行测量（如虚线右侧所示），并通过经典方式将结果发送给\
  \ Bob。\n-   Bob 根据 Alice 发送的结果，对上一节提到的他的量子比特（2）应用恢复规则。最后，在测量 `量子比特[2]` 之后，Bob 恢复了\
  \ Alice 最初创建的状态 `ψ`。所有这些之所以成为可能，是因为 Alice 和 Bob 共享一对纠缠量子比特，这使得整个过程得以运作。\n\n当然，图\
  \ 5-9 中的执行结果需要经过处理才能验证 Bob 的 `ψ` 是否与 Alice 的匹配。最好的方法是使用 Python 脚本。在下一节中，我们将远程运行相同的电路并查看结果，以验证协议是否有效。\n\
  \n### 使用 Python 远程运行\n\n在本节中，我们使用 Python 在模拟器中远程运行量子隐形传态协议。请注意，目前，量子隐形传态无法在 IBM\
  \ Q Experience 的真实量子设备上运行。这是因为硬件不支持 Alice 创建其状态 `ψ` 所需的旋转门。因此，我们将改用远程模拟器——本地 Python\
  \ 模拟器也可以。清单 5-3 展示了运行的协议。具体来说：\n\n-   创建三个量子比特以供 Alice 和 Bob 双方共享，再加上三个经典寄存器（`c0`、`c1`、`c2`）来存储\
  \ Alice 的结果（第 20-23 行）。\n-   Eve 通过对量子比特 1 和 2 应用哈达玛门 (`H`) 后接受控非门 (`CNOT`) 来制备贝尔对（第\
  \ 35-37 行）。\n-   Alice 通过在 Y 轴上旋转 `π/4` 弧度来准备她位于量子比特 0 上的状态 `ψ`（第 32 行）。\n-   Alice\
  \ 现在将她的 `量子比特[0]` 与给她的贝尔对量子比特 `量子比特[1]` 纠缠起来。然后她对两者进行测量，并将结果存储在经典寄存器 0 和 1 中（第 35-41\
  \ 行）。\n-   轮到 Bob 了：他根据 Alice 发送的结果，对她的量子比特（2）应用 `Z` 或 `X` 门——如果经典寄存器 0 为 1，则应用\
  \ `Z` 门。如果经典寄存器 1 为 1，则应用 `X` 门。然后他测量他的量子比特并将结果存储在经典寄存器 2 中（第 47-50 行）。\n-   该程序在远程模拟器\
  \ (`ibmq_qasm_simulator`) 中执行，并收集结果以供显示和验证（第 58-79 行）。\n\n\n\n###### 提示\n\n本程序的源代码包含在书籍源代码的\
  \ `Workspace\\Ch05\\p05-teleport.py` 路径下。\n\n```python\nimport sys,time,math\nimport\
