  \ |\n\n清单 7-7 展示了遍历魔方阵所有轮次的脚本片段：\n\n-   它循环遍历 `a[1,3]` 和 `b[1,3]`（包含边界值）。\n-   对于每一组\
  \ `(a, b)`，从清单 7-6 中检索爱丽丝的电路（`Alice-a`）和鲍勃的电路（`Bob-b`）。\n-   将共享纠缠态 `ψ` 以及 `Alice-a`\
