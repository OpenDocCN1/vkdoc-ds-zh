  \ 1 |\n\n现在提出一个简单的问题：如果我们在任意一个角度测量偏振，那么该偏振在相邻角度上保持相同的概率是多少？同时计算出偏振的和与平均值。在表 1-2\
  \ 中，相邻偏振用 `AB`、`BC` 和 `AC` 列表示。`A`、`B`、`C` 列中的 `+` 和 `–` 符号表示在给定角度下的正向或反向偏振。请注意，总共存在八种可能的排列组合，由“序号”列描述。因此，如果我们在两个相邻角度找到相同的偏振（相同的符号），则在\
  \ `AB`、`BC` 或 `AC` 列中记录 `1` 以及相应的符号。这是为了计算排列组合表中对应行的和与平均值所必需的。\n\n现在，如果偏振独立于测量而存在（**局域因果性**），正如爱因斯坦所主张的那样，那么该偏振的概率必须\
  \ ≥ `1/3`。另一方面，如果玻尔是正确的，现实是由观测行为定义的，那么偏振的概率将 < `1/3`。这正是贝尔不等式的核心所在。贝尔并没有偏袒任何一方；它没有说哪一方是正确的，而是提供了通过实验发现真理的手段。事实上，在\
  \ 1982 年，法国物理学家阿兰·阿斯佩克特设计了一项实验，最终一劳永逸地证明玻尔一直以来都是正确的。\n\n#### EPR 佯谬被击败：玻尔笑到最后\n\n\
  在阿斯佩克特的实验中，一束激光照射钙源，产生一对光子，它们同时沿相反方向传播。光子通过一个偏振滤波器，该滤波器只允许在同一平面内偏振的光子通过。如果光子通过，结果就会被记录在两侧的测量装置中。最后，这些测量装置连接到一个计数器上，该计数器记录多次相互作用的结果（见图\
  \ 1-9）。\n\n![../images/469026_1_En_1_Chapter/469026_1_En_1_Fig10_HTML.jpg](img/469026_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10\n\n阿斯佩克特检验贝尔不等式的实验——第一阶段\n\n如果两个偏振滤波器校准在同一方向上，阿斯佩克特观察到光子对之间存在关联。它们要么同时通过，要么同时被阻挡。这种关联与爱因斯坦的观点一致，即光子的偏振属性在从光源发射的那一刻就已经预先确定，而非如量子力学所预测的那样在测量时刻才被确定。\n\
  \n另一方面，如果滤波器的偏振设置不同，那么我们应该预期有一定的最小百分比的光子要么通过要么被阻挡。此时贝尔不等式便开始发挥作用（如前一小节表 1-2 所示）：\n\
  \n*   如果通过或被阻挡的光子百分比大于或等于预期最小值，则贝尔不等式成立，光子的偏振在发射时刻就已经确定（**爱因斯坦获胜，量子力学被击败**）。\n\n\
  *   另一方面，如果百分比小于预期最小值，则贝尔不等式被违反，量子物理学是正确的。偏振在测量时刻被确定（**玻尔获胜，量子力学得到维护**）。\n\n阿斯佩克特在不同偏振设置下测量了许多对光子。结果令人震惊：测量结果违反了贝尔不等式；因此，偏振不可能在发射时刻被预先确定。量子力学是正确的！光子似乎是在测量时刻才共同选择了一个偏振状态。难道光子之间存在某种未知的信号，告诉它们在测量时刻选取一个共同的值吗？\n\
  \n爱因斯坦的相对论指出，没有任何信号能够超越光速——宇宙中的终极速度极限。他将这种看似同时发生的信号称为“鬼魅般的超距作用”。阿斯佩克特希望在他实验的第二阶段对这一论断进行检验。\n\
  \n![../images/469026_1_En_1_Chapter/469026_1_En_1_Fig11_HTML.jpg](img/469026_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11\n\n阿斯佩克特检验“鬼魅般的超距作用”的实验\n\n在实验的第二阶段，阿斯佩克特使用了两个光开关，每个开关分叉连接到两个独立的偏振滤波器，每个滤波器再连接到一个测量装置（见图\
  \ 1-10）。和之前一样，所有测量装置都连接到一个计数器以收集结果：\n\n*   光开关设计为能以极快的速度（2 纳秒或 2 ns）将光子发送到两个方向之一。\n\
  *   实验两端之间的距离为 12 米。光速（以 `3*10⁸` 米/秒的速度传播）需要 40 纳秒才能从实验的一端到达另一端。\n\n\n\n"
- '# 量子计算：弯曲现实本身的结构


  现在，根据爱因斯坦相对论的假设，如果任何信号都不能超过光速，那么一个光子需要超过 40 纳秒才能告诉另一个光子该选择何种偏振值。由于光开关的切换速率更快（2 纳秒），因此光子之间的关联性不应成立。也就是说，这些光子在测量瞬间不应能够选择相同的偏振态（不存在超距幽灵作用）。另一方面，如果关联性成立，事情就会变得极其怪异，因为某种信号正以超光速传输给两个光子。


  不可思议的是，这种关联性与量子力学的预测完美契合，从而一劳永逸地证明了：在测量瞬间，两个光子是以超光速同时选择偏振值的。其影响令人震惊，因为光子之间的距离可以是无限远（例如从宇宙的一端到另一端），甚至更可怕的是，还能跨越时间：从现在到过去，或者反过来！


  ## 现实在戏弄我们：万物皆相连吗？


  阿斯佩克的实验证明了量子关联的存在，并且如果我们想要解释这种关联（而不仅仅是接受它），那么我们就必须承认某些作用的发生速度超过了光速。如果这对某些人来说难以接受，那么事情还会变得更加诡异。物理学家约翰·贝尔在接受
  BBC 电视采访时说：“我们对此无能为力，例如，我们不能以超光速发送消息或信息，这也是量子力学所预言的事实。大自然似乎在戏弄我们：在幕后发生着非凡的事情，而我们却无法利用。”


  最终，玻尔和爱因斯坦从未解决他们之间的分歧。他们两人都已离世，但他们的遗产却永续流传。阅读他们引人入胜的生平，人们不禁会想：玻尔看到阿兰·阿斯佩克的实验结果证明他一直正确时，会作何感想？他会为战胜爱因斯坦而感到高兴吗？这一切难道只是两位自负天才为了证明谁更优秀而进行的斗争吗？你怎么看？我宁愿相信这是一场为了科学进步而进行的斗争。总而言之，这场两位巨人之争的最终赢家是人类。


