- "# 8. 更快的搜索——用格罗弗和肖尔威胁非对称密码学的基础\n\n本章以两个算法作为结束，这两个算法激发了人们对实用量子计算可能性的热情：\n\n-   **格罗弗搜索**：这是一个由洛夫·格罗弗创建的非结构化量子搜索算法，它能够使用黑盒函数或预言机，以高概率找到一个输入。它可以在\
  \ ![$$ O\\left(\\sqrt{N}\\right) $$](img/469026_1_En_8_Chapter_TeX_IEq1.png) 步内找到一项，而经典算法的平均步数为\
  \ `N/2`。\n\n-   **肖尔整数分解**：专家称，这种臭名昭著的量子分解算法可能使当前的非对称密码学陷入崩溃。肖尔算法可以在大约 `log(n³)`\
  \ 步内分解整数，而最快的经典算法——数域筛法——则需要 ![$$ \\exp \\left(k\\ast \\log \\left({n}^{\\frac{1}{3}}\\\
  right)\\kern0.28em {\\left(\\log \\log \\kern0.28em n\\right)}^{\\frac{2}{3}}\\\
  right) $$](img/469026_1_En_8_Chapter_TeX_IEq2.png) 步。\n\n让我们开始吧。\n\n## 量子非结构化搜索\n\
  \n格罗弗算法是一种非结构化搜索的量子过程，用于在一个包含`N`个元素的“数字草堆”中找到一个`n`位的条目。如图 8-1 所示，格罗弗量子算法在 ![$$ O\\\
  left(\\sqrt{N}\\right) $$](img/469026_1_En_8_Chapter_TeX_IEq3.png) 步内提供了显著的加速。与经典解决方案相比，这可能看起来不多，但当我们谈论数百万个条目时，`10⁶`\
  \ 的平方根比 `10⁶` 快得多。\n\n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig1_HTML.jpg](img/469026_1_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** 非结构化搜索的时间复杂度\n\n如果`x`是我们正在寻找的元素，那么格罗弗算法可以用下面的伪代码描述：\n\n1.  准备给定的输入`f`:\
  \ {0, 1, … , N-1} → {0,1}。请注意，输入的大小是 `2^n`，其中`n`是位数，`N`是步骤数或“草堆”的大小。最终目标是找到满足 `f(x)\
  \ = 1` 的 `x`。\n\n2.  对所有输入量子比特应用基态叠加。\n\n3.  对输入量子比特执行相位反转。\n\n4.  对输入执行均值反转。\n\n\
  5.  重复步骤 3 和 4 至少 ![$$ \\sqrt{N} $$](img/469026_1_En_8_Chapter_TeX_IEq4.png) 次。此时，有很大概率会找到`x`。\n\
  \n让我们仔细看看关键的相位反转和均值反转步骤。\n\n### 相位反转\n\n这是算法中的第一步，必须在“草堆”中所有状态的叠加态下执行。如果我们正在寻找的元素是\
  \ `xʹ`，并且满足 `f(xʹ) = 1`，那么叠加态可以表示为 `∑ α ∣ x⟩`。最终，相位反转的作用是\n\n![$$ \\sum \\alpha\
  \ \\kern0.28em \\mid x\\left\\rangle {\\kern0.28em }^{\\underrightarrow{Phase\\\
  \ Inversion}}\\right\\{{\\displaystyle \\begin{array}{c}\\sum \\alpha \\kern0.28em\
  \ \\mid x\\Big\\rangle \\kern0.28em if\\kern0.28em x\\ne {x}^{\\prime}\\\\ {}-\\\
  alpha \\kern0.28em \\mid {x}^{\\prime}\\Big\\rangle \\kern0.28em Otherwise\\end{array}}\
  \ $$](img/469026_1_En_8_Chapter_TeX_Equa.png)\n\n也就是说，如果给定的`x`不是我们正在寻找的元素（`x ≠ xʹ`），则保持叠加态不变；否则，反转相位（量子比特复系数`α`的符号——参见图\
  \ 8-2 的图示）。\n\n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig2_HTML.jpg](img/469026_1_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** 相位反转的图示\n\n这是格罗弗算法的第一步；我们将会看到相位反转如何帮助我们找到正在寻找的元素，但现在让我们先看第二步：均值反转。\n\
  \n\n\n### 关于均值的反演\n\n给定之前的叠加态 `∑ α ∣ x⟩`，我们定义均值 `μ` 为所有振幅的平均值：\n\n![$$ \\mu =\\\
  frac{\\sum_{x=0}^{N-1}{\\propto}_x}{N} $$](img/469026_1_En_8_Chapter_TeX_Equb.png)\n\
  \n现在我们需要围绕这个均值翻转振幅，即：\n\n![$$ {\\alpha}_x\\to \\left(\\kern0.28em 2\\mu -{\\alpha}_x\\\
  right) $$](img/469026_1_En_8_Chapter_TeX_Equc.png)\n\n![$$ \\sum {\\alpha}_x\\kern0.28em\
  \ \\mid x\\left\\rangle \\to \\sum \\left(\\kern0.28em 2\\mu -{\\alpha}_x\\right)\\\
  kern0.28em \\mid x\\right\\rangle $$](img/469026_1_En_8_Chapter_TeX_Equd.png)\n\n\
  为了更好地理解这一点，图 8-3 展示了关于均值反演的图形表示。\n\n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig3_HTML.jpg](img/469026_1_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3** – 关于均值反演的图形表示\n\n图 8-3 显示了由波函数 `ψ` 定义的量子比特叠加态。该函数的均值或 `μ` 以图表中的水平线表示。关于均值反演的操作是将波函数\
  \ `ψ` 相对于均值 `μ` 进行镜像，从而产生一个镜像波（用虚线表示）。这相当于将波绕轴 `μ` 旋转。让我们将所有步骤整合起来，通过实际操作来理解这一切：\n\
  \n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig4_HTML.jpg](img/469026_1_En_8_Fig4_HTML.jpg)\n\
  \n**图 8-4** – 单次 Grover 迭代\n\n在图 8-4 中：\n\n*   所有量子比特的叠加态将所有振幅置于 `1 / sqrt(N)`。\n\
  *   接着，相位反转将 `xʹ` 的振幅置于 `-1 / sqrt(N)`。注意，这会使均值 `μ` 的值略微降低，如图 8-4 步骤 2 中的虚线所示。\n\
  *   经过关于均值的反演后，均值振幅略有下降，但 `xʹ` 的振幅大幅上升，达到比均值 `μ` 高出 `2 / sqrt(N)` 的程度。\n*   如果我们重复这一序列，`x’`\
  \ 的振幅大约会增加 `2 / sqrt(N)`，直到大约经过 `sqrt(N)` 步后，振幅变为 `1 / sqrt(2)`。\n*   此时，如果我们测量量子比特，根据量子力学的定义，找到\
  \ `x’`（我们正在寻找的元素）的概率是振幅的平方，即 ½。\n*   至此，我们就完成了。大约经过 `sqrt(N)` 步，我们找到了标记元素 `xʹ`。\n\
  \n现在，让我们将这一切整合到一个量子电路以及相应的代码实现中。\n\n### 实际实现\n\n我们将在 IBM Q Experience 中查看 Grover\
