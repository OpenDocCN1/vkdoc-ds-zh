  \ |10)`。随后，`CNOT`门在第一个量子比特激发时翻转第二个量子比特，得到态 `1/√2 (|00 + |11)`。这就是表 3-4 中四次测量所需的初始纠缠态（所有重印均经国际商业机器公司许可，©\
