  \ API 调用的 HTTP 响应\n\n列表 3-1 显示了当前可用的处理器列表，该列表与 IBM Q Experience 网站上的官方列表基本一致。不过，其中还包含大量关于这些机器结构布局的有趣信息：\n\
  \n- 额外的处理器和模拟器：\n    - 似乎有两个远程模拟器可供使用（`ibmqx_qasm_simulator`， `ibmqx_hpc_qasm_simulator`），尽管官方文档只提到了一个：`ibmqx_qasm_simulator`。在测试复杂电路时，这些信息可能会派上用场：更多的模拟器总是件好事。\n\
  \n- 关于 20 量子比特处理器的传言已经流传了一段时间。甚至有传言说，到 2018 年底，将会推出一款 50 量子比特的巨型处理器。这份列表至少证实了 20\
  \ 量子比特机器的存在。但先别激动；这台机器仅供企业客户使用。\n\n- 除了机器名称、版本、状态、量子比特数量等常见信息外，我们还应熟悉一些术语：\n   \
  \ - `basisGates`：这些是处理器的物理量子比特门。它们是构建更复杂逻辑门的基础。列表中的大多数处理器使用 `u1`、`u2`、`u3`、`cx`、`id`。\n\
  \        - `u1`、`u2`、`u3` 门被称为 *部分非门*，它们执行一个量子比特在 X、Y、Z 轴上分别以 theta、phi 或 lambda\
  \ 弧度进行的旋转。\n\n- `cx` 被称为 *受控非门*（CNOT 或 CX）。它作用于两个量子比特，并且仅当第一个量子比特为 |1> 时，才对第二个量子比特执行非操作，否则保持不变。\n\
  \n- `id` 是恒等门，它对一个量子比特执行一个时间单位的空闲操作。\n\n- `couplingMap`：耦合映射定义了单个量子比特之间的相互作用，同时保持量子相干性（或一个纯态——想象一组士兵在通过一座旧桥时步调不一致，这样他们的脚落地时的振幅就不会叠加从而毁掉这座桥）。量子比特耦合用于简化量子电路，并允许系统被分解成更小的单元。\n\
  \n现在，回到合成器，开始我们的第一次量子合成。\n\n### 作品 1：贝尔态和 GHZ 态的变奏\n\n这个合成比较奇特。我们在此探讨两个用以展示量子力学奇异性的令人费解的量子实验：\n\
  \n- *贝尔态*：它们证明了物理学不能用局域实在性来描述。这就是爱因斯坦所说的 *幽灵般的超距作用*。\n\n- *GHZ 态*：比贝尔态更为奇异，GHZ 态（以其提出者格林伯格-霍恩-泽林格的名字命名）是贝尔态在\
  \ 3 量子比特上的推广。\n\n让我们更详细地看看它们。\n\n\n\n### 贝尔态与幽灵般的超距作用\n\n`Bell`态是著名贝尔不等式的实验验证。1964\
  \ 年，爱尔兰物理学家约翰·贝尔提出了一种检验量子纠缠（幽灵般的超距作用）的方法。他提出的一组不等式在物理学界变得极其重要。这组不等式被称为贝尔定理，其内容大致如下。\n\
  \n考虑三种不同角度 `A = 0`、`B = 120` 和 `C = 240` 下的光子偏振（即光在特定平面内的振动）。实在论认为，光子在这三种偏振设置下具有确定的同步值，且必须对应表\
  \ 3-3 所示的八种情况。\n\n**表 3-3**\n三种角度下光子偏振的排列组合\n\n| 计数 | A(0) | B(120) | C(240) | [AB]\
  \ | [BC] | [AC] | 总和 | 平均值 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- |\n| 1 | A+ | B+ | C+ | 1(++) | 1(++) | 1(++) | 3 | 1 |\n| 2 | A+ | B+ | C–\
  \ | 1(++) | 0 | 0 | 1 | 1/3 |\n| 3 | A+ | B– | C+ | 0 | 0 | 1(++) | 1 | 1/3 |\n\
  | 4 | A+ | B– | C– | 0 | 1(−−) | 0 | 1 | 1/3 |\n| 5 | A− | B+ | C+ | 0 | 1(++) |\
  \ 0 | 1 | 1/3 |\n| 6 | A− | B+ | C− | 0 | 0 | 1(−−) | 1 | 1/3 |\n| 7 | A− | B− |\
  \ C+ | 1(−−) | 0 | 0 | 1 | 1/3 |\n| 8 | A− | B− | C− | 1(−−) | 1(−−) | 1(−−) | 3\
  \ | 1 |\n\n现在贝尔定理问道：*任一相邻角度下的偏振与第一个角度偏振相同的概率是多少？* 我们还计算了偏振的总和与平均值。假设实在论成立，那么通过观察表\
  \ 3-3，这个问题的答案就是概率必须 `>= 1/3`。这正是贝尔不等式所给出的：提供了一种检验这一论断的手段。令人难以置信之处在于：信不信由你，量子力学违反了贝尔不等式，给出的概率小于\
  \ `1/3`。这一点于 1982 年由法国物理学家阿兰·阿斯佩首次通过实验证明。\n\n###### 提示\n\n关于阿斯佩实验与贝尔不等式的更详细描述，请参见第\
  \ 1 章《EPR 佯谬被破解：玻尔笑到最后》。\n\n现在，让我们将前文中的光子偏振转化为可在量子计算机上运行的实验。1969 年，约翰·克劳泽、迈克尔·霍恩、阿布纳·西蒙尼和理查德·霍尔特提出了贝尔定理的一个证明：即\
  \ CHSH 不等式，其正式表述为\n\n```\nS = ⟨A,B⟩ - ⟨A,B′⟩ + ⟨A′,B⟩ + ⟨A′,B′⟩\n```\n```\nS ≤ 2\n\
  ```\n\n为了说明这一点，我们设置两个探测器：爱丽丝和鲍勃。假设`A`和`A′`是爱丽丝一侧的探测器设置，`B`和`B′`是鲍勃一侧的设置，四种组合在不同实验中进行测试。实在论认为，对于一对纠缠粒子，展示所有可能排列的奇偶性表格如下所示：\n\
  \n| A | B | 1 |\n| A | B' | 0 |\n| A' | B | 0 |\n| A' | B' | 1 |\n\n在经典实在论中，CHSH\
  \ 不等式变为 `|S| = 2`。然而，量子力学的数学形式体系预测`S`的最大值为 `|S| = 2√2`，因此违反了该不等式。这可以通过四个独立的量子电路（每个测量对应一个电路）进行检验，每个电路包含\
  \ 2 个量子比特。为简化起见，设爱丽丝探测器的测量为`A = Z`和`A′ = X`，鲍勃探测器的测量为`B = W`和`B′ = V`（见表 3-4）。实验开始时，必须构建一个与恒等矩阵匹配的基态贝尔态（见图\
  \ 3-4）：\n\n```\n1/√2 (|00 + |11)\n```\n\n上述表达式本质上意味着爱丽丝持有的量子比特可以是 0 或 1。如果爱丽丝在标准基下测量她的量子比特，结果将是完全随机的，每种可能性概率均为\
  \ `1/2`。但如果鲍勃随后测量他的量子比特，其结果将与爱丽丝得到的结果相同。因此，如果鲍勃进行测量，他乍一看也会得到一个随机结果，但如果爱丽丝和鲍勃进行通信，他们会发现，尽管结果看似随机，但它们却是相关的。\n\
  \n![../images/469026_1_En_3_Chapter/469026_1_En_3_Fig4_HTML.jpg](img/469026_1_En_3_Fig4_HTML.jpg)\n\
