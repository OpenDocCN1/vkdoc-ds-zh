  \ IBM 科学家于 2017 年 5 月 2 日在 8192 次测量中进行的官方测试结果。²⁴ 你的结果如何？\n\n### 更令人毛骨悚然：GHZ 态测试\n\
  \n这些以物理学家格林伯格-霍恩-泽林格（Greenberger-Horne-Zeilinger）的名字命名，他们提出了针对 N 个纠缠量子比特的推广测试，最简单的是三量子比特\
  \ GHZ 态：\n\n![$$ \\left| GHZ\\right\\rangle =1/\\sqrt{2}\\left(\\left|000\\right\\\
  rangle -\\left|111\\right\\rangle \\right) $$](img/469026_1_En_3_Chapter_TeX_Eque.png)\n\
  \n###### 注释\n\nGHZ 态的重要性在于，它们表明超过两个粒子的纠缠不仅在统计（概率）预测方面与定域实在论相冲突，而且在非统计（确定性）预测方面也是如此。\n\
  \n简单来说，GHZ 态显示出对贝尔不等式更强的违反。让我们通过一个简单的谜题来看看：想象三个独立的盒子，每个盒子包含两个变量 X 和 Y。每个变量有两个可能的结果：1\
  \ 和 -1。问题是找到一组 X 和 Y 的值，使得以下一组恒等式成立：\n\n```\n(1)   XYY = 1\n(2)   YXY = 1\n(3) \
  \  YYX = 1\n(4)   XXX = –1\n```\n\n对于没有耐心的人来说，这个方程组无解。例如，将 `Y = 1` 代入 (1)、(2) 和\
  \ (3)，然后将它们相乘，即 (5) = (1) * (2) * (3)。这组等式就变成了：\n\n```\n(1)   X11 = 1\n(2)   1X1\
  \ = 1\n(3)   11X = 1\n(4)   XXX = –1\n(5)   将 (1) (2) (3) 相乘得到 XXX = 1\n```\n\n\
  没有解，因为恒等式 (4) `XXX = –1` 与恒等式 (5) `XXX = 1` 矛盾。可怕的地方在于，一个 GHZ 态确实可以为这个问题提供解，这在经典实在论的确定性观点看来似乎是不可能的，但在量子力学的世界里，没有什么是不可能的，只是概率低而已。\n\
  \n不可思议的是，GHZ 测试可以在单次实验运行后以确定性排除对定域实在的描述，但首先我们必须构建一个 GHZ 基态。\n\n**表 3-6.** GHZ 基态\n\
