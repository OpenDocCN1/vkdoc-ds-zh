  \ 文件夹内执行 `node test\\tests.js`。请注意，我留下了两个方法 `getJobs` 和 `getMycredits` 作为练习。有了这个基础，你应该能够轻松实现并测试它们。\n\
  \n### 与世界分享：发布你的模块\n\n如果你希望与世界分享你的工作，可以将模块发布到 npm 注册表。为此，你需要在 [`www.npmjs.com/`](http://www.npmjs.com/)\
