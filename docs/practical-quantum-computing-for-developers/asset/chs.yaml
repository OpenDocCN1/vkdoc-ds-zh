  \ `A = 0`、`B = 120` 和 `C = 240` 度（见图 1-8）下的偏振（光在特定平面内的振荡）。\n\n![../images/469026_1_En_1_Chapter/469026_1_En_1_Fig9_HTML.jpg](img/469026_1_En_1_Fig9_HTML.jpg)\n\
  \n图 1-9\n\n光在三个角度下的偏振状态\n\n根据贝尔定理，如果现实独立于观测存在，那么光子对于这三种偏振设置必然具有确定的、同时存在的值，且这些值必须对应表\
