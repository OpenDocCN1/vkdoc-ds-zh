  \ BOB Depending on the results applies X or Z, or both, to his state\nteleport.z(q[2]).c_if(c0,\
  \ 1)\nteleport.x(q[2]).c_if(c1, 1)\nteleport.measure(q[2], c2[0])\n##### dump asm\n\
  circuits = ['teleport']\nprint(Q_program.get_qasms(circuits)[0])\n##### Execute\
