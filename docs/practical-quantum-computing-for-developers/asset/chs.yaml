- "# QISKit：用于 Python 量子编程的卓越 SDK\n\n在本章中，你将开始使用 QISKit，这是目前最好的量子编程 SDK。你将学习如何在本地系统上轻松安装此\
  \ SDK。但在编写第一个量子程序之前，理解什么是量子计算以及它如何区别于经典计算总是很有帮助的。为此，本节使用线性代数对量子比特态和量子门进行了非常基础的解释。本节还展示了量子计算如何镜像其经典对应物，并进一步找到更快的途径来获得结果。接下来，本章将介绍量子程序的解剖结构，包括系统调用、电路编译格式、量子汇编等内容。\n\
  \nQISKit 提供了一套有用的模拟器，可以在本地或远程执行你的程序，但也允许你在真实设备上运行。你将逐步学习如何在强大的 IBM Q Experience\
  \ 云平台提供的真实设备上运行量子程序。所以，启动你的桌面，让我们开始吧。\n\n## 安装 QISKit\n\nQISKit 是量子信息软件工具包（Quantum\
  \ Information Software Kit），是云端量子编程的事实标准 SDK。它用 Python 编写，Python 是一种用于科学计算的强大脚本语言。我的背景主要是在商业领域，所以多年来我没有写过太多\
  \ Python 代码，那么让我们看看如何将 SDK 安装在 Linux CentOS 6–7 和 Windows 64 位上。我们将从最简单的（Windows）开始，然后跳到最具挑战性的（CentOS）。\n\
  \n\n\n### 在 Windows 中设置\n\nQISKit 需要 Python 3.5 或更高版本。如果你的系统是 Windows，很可能没有安装 Python。如果是这样，你可以从\
  \ Python.org 网站获取安装程序。下载安装程序并运行，然后在命令窗口中运行以下命令来验证安装：\n\n```\nC:\\>Python -V\nPython\
  \ 2.7.6\n```\n\n我使用的是老旧的 Python 2.7，但你也可以同时安装多个版本的 Python。就我而言，我下载了可嵌入的 zip 文件并解压到了\
  \ `C:\\Python36-64`，因此：\n\n```\nC:\\>C:\\Python36-64\\Python.exe -V\nPython 3.6.4\n\
  ```\n\nPython 有一个出色的包管理器 `pip`（首选的安装程序），它让模块安装变得非常简单。因此，要安装 QISKit，只需在控制台输入：\n\n\
  ```\nC:\\>pip install qiskit\n```\n\n你的屏幕输出应类似于清单 4-1。确保没有错误消息。\n\n```\nCollecting\
  \ qiskit\nUsing cached qiskit-0.4.11.tar.gz\nCollecting IBMQuantumExperience>=1.8.28\
  \ (from qiskit)\nUsing cached IBMQuantumExperience-1.9.0-py3-none-any.whl\nCollecting\
