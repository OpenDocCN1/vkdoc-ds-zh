  \nbackend = \"ibmq_qasm_simulator\"\nshots = 1024       # the number of shots in\
  \ the experiment\nresult = Q_program.execute(circuits, backend=backend, shots=shots\n\
  , max_credits=3, timeout=240)\nprint(\"Counts:\" + str(result.get_counts(\"teleport\"\
  )))\n##### RESULTS\n##### Alice's measurement:\ndata = result.get_counts('teleport')\n\
  alice = {}\nalice['00'] = data['0 0 0'] + data['1 0 0']\nalice['10'] = data['0 1\
  \ 0'] + data['1 1 0']\nalice['01'] = data['0 0 1'] + data['1 0 1']\nalice['11']\
  \ = data['0 1 1'] + data['1 1 1']\nplot_histogram(alice)\n#BOB\nbob = {}\nbob['0']\
  \ = data['0 0 0'] + data['0 1 0'] +  data['0 0 1'] + data['0 1 1']\nbob['1'] = data['1\
  \ 0 0'] + data['1 1 0'] +  data['1 0 1'] + data['1 1 1']\nplot_histogram(bob)\n\
  ###########################################\n##### main\nif __name__ ==  '__main__':\n\
  start_time = time.time()\nmain()\nprint(\"--- %s seconds ---\" % (time.time() -\
  \ start_time))\n```\n\n代码清单 5-3：量子隐形传态的 Python 脚本\n\n为了验证结果，需要收集模拟器返回的爱丽丝和鲍勃的结果计数。绘制结果图是验证鲍勃是否恢复了爱丽丝的\
  \ ψ 状态的最佳方式。以下是模拟器返回的示例：\n\n```python\n{'1 0 0': 37, '1 0 1': 45, '1 1 1': 43, '0\
  \ 1 1': 215, '0 0 1': 200, '0 0 0': 206, '0 1 0': 230, '1 1 0': 48}\n```\n\n在此 JSON\
  \ 字符串中，左侧是 3 个量子比特的逆序测量结果。例如，在第一个结果 `1 0 0` 中：B(1) A(0) A(0)，其中 A 代表爱丽丝，B 代表鲍勃。右侧是该特定结果获得的计数。请记住，该结果的概率（用于绘图）是通过将结果计数除以总实验次数（1024）计算得出的；因此\n\
  \n```\nP(1 0 0) = 37/1024 = 0.036\n```\n\n执行代码清单 5-3 后，为爱丽丝和鲍勃的结果绘制的直方图如图 5-10 所示。\n\
  \n![../images/469026_1_En_5_Chapter/469026_1_En_5_Fig10_HTML.jpg](img/469026_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10：爱丽丝和鲍勃测量的概率结果\n\n那么这一切意味着什么呢？我们如何知道鲍勃已经恢复了 ψ 状态？让我们更详细地看看这些结果。\n\n### 查看结果\n\
  \n要解释这些结果，首先让我们看看如何根据代码清单 5-3 返回的计数计算概率：\n\n```python\n{'1 0 0': 37, '1 0 1': 45,\
  \ '1 1 1': 43, '0 1 1': 215, '0 0 1': 200, '0 0 0': 206, '0 1 0': 230, '1 1 0':\
