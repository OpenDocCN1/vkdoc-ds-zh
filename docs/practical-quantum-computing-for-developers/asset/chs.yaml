  \n\n\n### 超级决定论：摆脱量子诡异性的出路，爱因斯坦一直是对的？\n\n在 1969 年接受 BBC 采访时，物理学家约翰·贝尔谈到了他在量子力学方面的工作。他说，我们必须接受这样的预测：纠缠粒子之间的作用转移速度超过光速，但同时我们无法利用这一点做任何事情。信息不能传播得比光速快，这一事实也由量子力学本身所预言。仿佛自然在跟我们开玩笑。他还提到，有一条摆脱这个谜团的出路，就是通过一个称为**超级决定论**的原理。\n\
  \n粒子纠缠意味着，对一个粒子进行的测量会瞬间影响另一个粒子，即使相隔遥远的距离（想想星系或宇宙的两端），甚至跨越时间。爱因斯坦是这一理论的激烈反对者，他曾著名地写信给尼尔斯·玻尔说*上帝不掷骰子*。他无法接受量子力学的概率性本质，所以在\
  \ 1935 年，他与同事波多尔斯基和罗森一起提出了著名的**EPR 悖论**来挑战其基础。在 EPR 悖论中，如果两个纠缠粒子被巨大的距离分开，对一个粒子的测量不可能瞬间影响另一个，因为该事件必须传播得比光速（宇宙中的速度极限）还快。这将违反广义相对论，从而产生一个悖论：没有任何东西比光速快，这是相对论的绝对规则。\n\
  \n尽管如此，1982 年，量子力学的预言被法国物理学家阿兰·阿斯佩证实。他设计了一个实验，表明纠缠光子违反了**贝尔不等式**。他还证明，对一个纠缠光子的测量传播得比光速快，以将自身状态信号传递给另一个光子。自那以后，阿斯佩的结果被反复证明是正确的（关于他实验的细节见第\
  \ 1 章）。讽刺的是，存在一种可能性：爱因斯坦自始至终都是对的，纠缠只是一种幻觉。这就是**超级决定论**的原理。\n\n> **小贴士**\n> 简单来说，超级决定论认为，自宇宙诞生之初起，自由选择就不复存在。所有粒子关联和纠缠都是在**大爆炸**那一刻建立起来的。因此，并不需要超光速信号来告诉粒子\
  \ B 粒子 A 的结果是什么。\n\n如果属实，这一漏洞将证明爱因斯坦在提出 EPR 悖论时是正确的，而我们在量子编程方面所做的所有艰苦工作都只是一种幻觉。但这个原理听起来更像是宗教教条（所有结果都由命运决定）而不是科学，因为贝尔认为超级决定论是不可信的。他的理由是，由于大量微小效应引入的改变，自由选择对于手头的目的而言实际上是自由的。超级决定论被称为不可检验的，因为实验者永远无法消除宇宙诞生之初就创建的那些关联。尽管如此，这并没有阻止科学家们试图证明爱因斯坦是对的，而粒子纠缠只是一种幻觉。事实上，有一个实验正在努力地试图解决这个问题，并且非常有创意。让我们来看看。\n\
  \n![../images/469026_1_En_3_Chapter/469026_1_En_3_Fig5_HTML.jpg](img/469026_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n使用宇宙光子的贝尔不等式实验 vs. 标准测试\n\n图 3-5 显示了标准的贝尔不等式测试实验（底部）以及由安德鲁·弗里德曼及其麻省理工学院同事使用宇宙光子（顶部）进行的实验变体。^(²⁶)\n\
  \n> **小贴士**\n> 关于标准贝尔不等式测试的完整描述，请参见第 1 章“EPR 悖论被击败：玻尔笑到最后”。\n\n弗里德曼及其同事提出了一个使用宇宙射线的标准贝尔实验的新颖变体。其想法是利用对银河系内遥远恒星、遥远类星体或宇宙微波背景斑块的实时天文观测，本质上是让宇宙来决定如何设置实验，而不是使用标准的量子随机数生成器。也就是说，遥远星系发出的光子被用来在纠缠光子到达之前立即控制偏振滤光片的方向。\n\
  \n如果成功，其影响将是开创性的。如果这类实验的结果没有违反贝尔不等式，那就意味着超级决定论终究可能是真的。粒子纠缠将是一种幻觉，纠缠粒子之间的信号传递不可能像相对论所预言的那样快过光速。爱因斯坦将是对的，并且不存在超距幽灵作用。\n\
  \n对我们量子力学爱好者来说幸运的是，到目前为止还没有发生过这样的事情。请记住，弗里德曼及其同事并不是唯一这样做的团队。有多个团队正试图解开这个谜团。事实上，他们的大多数结果都与量子力学一致。也就是说，他们的结果违反了贝尔不等式。所以，爱因斯坦和玻尔早在很久以前在相对论与量子力学之争中制造的裂痕，似乎依然存在且活跃。不过，我还是把赌注押在量子力学上。继续前进，下一节将展示如何通过其简洁的\
  \ REST API 远程访问 IBM Q Experience。\n\n## 通过 REST API 进行远程访问\n\nQ Experience 拥有一个相对不为人知的\
  \ REST API，它在幕后处理所有远程通信。当前的 Python SDK 都在使用它：\n\n*   *QISKit*：量子信息软件套件是 Python 量子编程的事实上的访问工具。\n\
  *   *IBMQExperience*：一个与 QISKit 捆绑在一起的鲜为人知的库，它用 Python 客户端封装了 REST API。\n\n在本节中，我们将深入探究\
  \ IBMQExperience，并查看用于远程访问的不同 REST 端点。但首先，需要进行身份验证。\n\n### 身份验证\n\n要调用任何 REST API，我们必须首先获取一个访问令牌。这将是调用本节中任何调用的访问密钥。请注意，访问令牌与\
  \ API 令牌不同（API 令牌用于在 Python 中执行量子程序）。有两种方法可以获得访问令牌：\n\n*   *使用您的 API 令牌*：要获取 API\
  \ 令牌，请登录 IBM Q Experience 控制台，并按照下一节的说明操作。\n*   *使用您的账户用户名和密码*：让我们看看如何使用 REST 完成此操作。\n\
  \n> **小贴士**\n> 要获取您的 API 令牌，请登录 IBM Q Experience 控制台，点击您的用户名 ➤ *我的账户*，然后点击右上方的*高级*选项卡。最后点击*生成*，然后*复制\
  \ API 令牌*（见图 3-6）。请始终确保令牌的安全。\n\n![../images/469026_1_En_3_Chapter/469026_1_En_3_Fig6_HTML.jpg](img/469026_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6\n从控制台获取您的 API 令牌\n\n#### 通过 API 令牌进行身份验证\n\n*   **HTTP 方法：** `POST`\n* \
  \  **URL：** `https://quantumexperience.ng.bluemix.net/api/users/loginWithToken`\n\
  *   **载荷：** `{\"apiToken\": \"YOUR_API_TOKEN\"}`\n\n\n\n#### 通过用户密码进行身份验证\n\n- **HTTP\
  \ 方法：** `POST`\n- **URL：** [`https://quantumexperience.ng.bluemix.net/api/users/login`](https://quantumexperience.ng.bluemix.net/api/users/login)\n\
  - **负载：** `{\"email\": \"USER-NAME\", \"password\": \"YOUR-PASSWORD\"}`\n\n两种方法的响应如下：\n\
  \n```json\n{\n\"id\": \"ACCESS_TOKEN\",\n\"ttl\": 1209600,\n\"created\": \"2018-04-15T20:21:03.204Z\"\
  ,\n\"userId\": \"USER-ID\"\n}\n```\n\n其中，`id` 是您的访问令牌，`ttl` 是生存时间（或过期时间，以毫秒为单位），`userId`\
  \ 是您的用户 ID。请保存访问令牌和用户 ID，以便在本节中使用。请注意，当您的会话过期时，需要生成一个新的访问令牌。\n\n### 列出可用的后端\n\n\
  此调用返回 IBM Q Experience 中所有可用后端和模拟器的 JSON 列表：\n\n- **HTTP 方法：** `GET`\n- **URL：**\
  \ [`https://quantumexperience.ng.bluemix.net/api/Backends?access_token=ACESS-TOKEN`](https://quantumexperience.ng.bluemix.net/api/Backends%253Faccess_token%253DACESS-TOKEN)\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌 |\n\n####\
  \ HTTP 头部\n\n| 名称 | 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py`\
  \ |\n\n#### 响应示例\n\n所有 API 调用的响应内容类型均为 `application/json`。下一段展示了对该端点调用后的部分结果。请注意，此端点将同时返回真实处理器和模拟器。\n\
  \n```json\n[{\n\"name\": \"ibmqx2\",\n\"version\": \"1\",\n\"status\": \"on\",\n\
  \"serialNumber\": \"Real5Qv2\",\n\"description\": \"5 transmon bowtie\",\n\"basisGates\"\
  : \"u1,u2,u3,cx,id\",\n\"onlineDate\": \"2017-01-10T12:00:00.000Z\",\n\"chipName\"\
  : \"Sparrow\",\n\"id\": \"28147a578bdc88ec8087af46ede526e1\",\n\"topologyId\": \"\
  250e969c6b9e68aa2a045ffbceb3ac33\",\n\"url\": \"https://ibm.biz/qiskit-ibmqx2\"\
  ,\n\"simulator\": false,\n\"nQubits\": 5,\n\"couplingMap\": [\n[0, 1],\n[0, 2],\n\
  [1, 2],\n[3, 2],\n[3, 4],\n[4, 2]\n]\n},..]\n```\n\n上表响应中最重要的键值对在表 3-8 中进行了描述。\n\
  \n**表 3-8** 可用后端响应键值\n\n| 键 | 描述 |\n| --- | --- |\n| `Name` | 运行代码时所使用的处理器的名称 ID。\
  \ |\n| `Version` | 字符串或正整数，可能用于追踪处理器的变更。 |\n| `Description` | 这可能是对用于制造芯片的硬件的描述。您可能会看到类似以下内容：•\
  \ 5 transmon bowtie • 16 transmon 2x8 ladder。注意：transmon 被定义为一种抗噪声的超导电荷量子比特。由罗伯特·J·肖尔科夫、米歇尔·德沃雷特、史蒂文·M·格尔文及其耶鲁大学的同事于\
  \ 2007 年开发。^((27)) |\n| `basisGates` | 这些是处理器的物理量子比特门。它们是构建更复杂逻辑门的基础。 |\n| `nQubits`\
  \ | 处理器使用的量子比特数量。 |\n| `couplingMap` | 耦合映射定义了单个量子比特之间在保持量子相干性时的相互作用。它用于简化量子电路，并使系统能够分解为更小的单元。\
  \ |\n\n### 获取给定处理器的校准信息\n\n此调用返回 Q Experience 中给定处理器校准参数的 JSON 列表。这些参数在 IBMQX 后端信息站点中有详细记录。^((28))\n\
  \n- **HTTP 方法：** `GET`\n- **URL：** [`https://quantumexperience.ng.bluemix.net/api/Backends/NAME/calibration?access_token=ACCESS-TOKEN`](https://quantumexperience.ng.bluemix.net/api/Backends/NAME/calibration%253Faccess_token%253DACCESS-TOKEN)\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌 |\n\n####\
  \ HTTP 头部\n\n| 名称 | 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py`（官方客户端的默认值，但我认为它可以被修改）。\
  \ |\n\n#### 响应示例\n\n量子比特对错误和环境噪声高度敏感。校准信息概述了处理器内部量子比特的质量。清单 3-2 展示了 `ibmqx4` 校准参数的简化响应。其中一些最显著的参数包括：\n\
  \n- **`gateError`：** 这是特定时间点量子比特门操作的错误率。\n- **`readoutError`：** 这是特定时间点量子比特读取操作的错误率。\n\
  \n###### 提示\n\n量子比特质量评估涉及四个阶段（操作）：准备、存储、门操作和读取。错误率在门操作和读取阶段进行计算，以追踪量子比特的质量。这就是此\
  \ API 调用返回的信息。请注意，使用后，量子比特必须被重置（冷却）到基态。\n\n```json\n{\n\"lastUpdateDate\": \"2018-04-15T10:47:03.000Z\"\
  ,\n\"qubits\": [{\n\"gateError\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\"\
  : 0.0012019552727863259\n},\n\"name\": \"Q0\",\n\"readoutError\": {\n\"date\": \"\
  2018-04-15T10:47:03Z\",\n\"value\": 0.049\n}\n}, ...\n],\n\"multiQubitGates\": [{\n\
  \"qubits\": [1, 0],\n\"type\": \"CX\",\n\"gateError\": {\n\"date\": \"2018-04-15T10:47:03Z\"\
  ,\n\"value\": 0.03024023736391171\n},\n\"name\": \"CX1_0\"\n},...\n]\n}\n```\n\n\
  **清单 3-2** `ibmqx4` 校准参数的简化响应\n\n清单 3-2 中的信息可以在 IBM Q Experience 控制台主菜单的*设备*选项卡下查看（见图\
  \ 3-7）。通过 REST 获取校准信息，并将其与 Web 控制台进行比较（经 International Business Machines Corporation\
  \ 许可转载，© International Business Machines Corporation）。\n\n![../images/469026_1_En_3_Chapter/469026_1_En_3_Fig7_HTML.jpg](img/469026_1_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7** Web 控制台报告的校准信息\n\n### 获取后端参数\n\n此调用返回 Q Experience 中给定处理器后端参数的 JSON\
  \ 列表。其中一些参数包括：\n\n- 量子比特冷却温度（以开尔文为单位）：例如，对于 `ibmqx4`，我得到了 0.021 K——即极冷温度 –459.6\
  \ `°`F 或 –273.1 `°`C。\n- 缓冲时间（以 `ns` 为单位）。\n- 门操作时间（以 `ns` 为单位）。\n- 其他量子规格，在后端信息站点中有更详细的记录。^((29))\n\
  \n请求类型和端点 URL 为：\n\n- **HTTP 方法：** `GET`\n- **URL：** [`https://quantumexperience.ng.bluemix.net/api/Backends/NAME/parameters?access_token=ACCESS-TOKEN`](https://quantumexperience.ng.bluemix.net/api/Backends/NAME/parameters%253Faccess_token%253DACCESS-TOKEN)\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌 |\n\n####\
  \ HTTP 头部\n\n| 名称 | 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py`\
  \ |\n\n#### 响应示例\n\n清单 3-3 展示了 `ibmqx4` 参数的 JSON 简化响应。\n\n```json\n{\n\"lastUpdateDate\"\
  : \"2018-04-15T10:47:03.000Z\",\n\"fridgeParameters\": {\n\"cooldownDate\": \"2017-09-07\"\
  ,\n\"Temperature\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 0.021,\n\"\
  unit\": \"K\"\n}\n},\n\"qubits\": [{\n\"name\": \"Q0\",\n\"buffer\": {\n\"date\"\
  : \"2018-04-15T10:47:03Z\",\n\"value\": 10,\n\"unit\": \"ns\"\n},\n\"gateTime\"\
  : {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 50,\n\"unit\": \"ns\"\n},\n\
  \"T2\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 16.5,\n\"unit\": \"μs\"\
  \n},\n\"T1\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\": 45.2,\n\"unit\"\
  : \"μs\"\n},\n\"frequency\": {\n\"date\": \"2018-04-15T10:47:03Z\",\n\"value\":\
  \ 5.24208,\n\"unit\": \"GHz\"\n}\n},..\n]\n```\n\n**清单 3-3** `ibmqx4` 参数的简化响应\n\n\
  \n\n### 获取处理器队列状态\n\n此调用返回特定量子处理器事件队列的状态。\n\n- **HTTP 方法：** `GET`\n- **URL：** `https://quantumexperience.ng.bluemix.net/api/Backends/NAME/queue/status`\n\
  \n#### 请求参数\n\n这看起来有些奇怪，但此 API 调用似乎不需要访问令牌。\n\n#### HTTP 标头\n\n| 名称 | 值 |\n| ---\
  \ | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py` |\n\n#### 响应示例\n\n\
  例如，要获取 `ibmqx4` 的事件队列，请在浏览器中粘贴以下 URL：\n\n`https://quantumexperience.ng.bluemix.net/api/Backends/ibmqx4/queue/status`\n\
  \n响应看起来类似于 `{\"state\":true,\"status\":\"active\",\"lengthQueue\":0}`，其中：\n\n- **state：**\
  \ 处理器的状态。如果正常运行，则为 `true`，否则为 `false`。\n- **status：** 执行队列的状态 – `active`（活跃）或 `busy`（繁忙）。\n\
  - **lengthQueue：** 执行队列的大小，即等待执行的模拟任务数量。\n\n###### 提示\n\n当您向 IBM Q Experience 提交实验时，该实验将进入执行队列。此\
  \ API 调用有助于监控处理器在特定时间内的繁忙程度。\n\n### 列出执行队列中的任务\n\n此调用返回处理器执行队列中的任务列表。\n\n- **HTTP\
  \ 方法：** `GET`\n- **URL：** `https://quantumexperience.ng.bluemix.net/api/Jobs?access_token=ACCESS-TOKEN&filter=FILTER`\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌。 |\n| `filter`\
  \ | 一个 JSON 格式的结果大小提示。例如，`{\"limit\":2}` 最多返回两条记录。 |\n\n#### HTTP 标头\n\n| 名称 | 值\
  \ |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py` |\n\n####\
  \ 响应示例\n\n清单 3-4 展示了此调用的响应格式。这些信息似乎是实验执行的历史记录，包含状态、日期、结果、代码、校准等信息。\n\n```json\n\
  [{\n\"qasms\": [{\n\"qasm\": \"...\",\n\"status\": \"DONE\",\n\"executionId\": \"\
  331f15a5eed1a4f72aa2fb4d96c75380\",\n\"result\": {\n\"date\": \"2018-04-05T14:25:37.948Z\"\
  ,\n\"data\": {\n\"creg_labels\": \"c[5]\",\n\"additionalData\": {\n\"seed\": 348582688\n\
  },\n\"time\": 0.0166247,\n\"counts\": {\n\"11100\": 754,\n\"01100\": 270\n}\n}\n\
  }\n}],\n\"shots\": 1024,\n\"backend\": {\n\"name\": \"ibmqx_qasm_simulator\"\n},\n\
  \"status\": \"COMPLETED\",\n\"maxCredits\": 3,\n\"usedCredits\": 0,\n\"creationDate\"\
  : \"2018-04-05T14:25:37.597Z\",\n\"deleted\": false,\n\"id\": \"d405c5829274d0ee49b190205796df87\"\
  ,\n\"userId\": \"ef072577bd26831c59ddb212467821db\",\n\"calibration\": {}\n}, ...]\n\
  ```\n*清单 3-4：获取任务 API 调用的简化响应*\n\n###### 注意\n\n根据执行队列的大小，如果队列中没有任务，您可能会得到一个空结果（`[]`），或者得到如清单\
  \ 3-4 所示的正式结果。无论哪种情况，请确保 HTTP 响应代码为 `200`（成功）。\n\n### 获取账户信用信息\n\n创建账户时，每个用户会被分配一定数量的默认执行信用额度（15\
  \ 点），运行实验时会消耗这些额度。此调用会列出您的信用信息。\n\n- **HTTP 方法：** `GET`\n- **URL：** `https://quantumexperience.ng.bluemix.net/api/users/USER-ID?access_token=ACCESS-TOKEN`\n\
  \n###### 提示\n\n可以通过 API 令牌或用户密码的身份验证响应来获取用户 ID。详见“身份验证”部分。\n\n#### 请求参数\n\n| 名称\
  \ | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌。 |\n\n#### HTTP 标头\n\n| 名称 |\
  \ 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py` |\n\n####\
  \ 响应示例\n\n清单 3-5 展示了此调用的示例响应。\n\n```json\n{\n\"institution\": \"Private Research\"\
  ,\n\"status\": \"Registered\",\n\"blocked\": \"None\",\n\"dpl\": {\n\"blocked\"\
  : false,\n\"checked\": false,\n\"wordsFound\": {},\n\"results\": {}\n},\n\"credit\"\
  : {\n\"promotional\": 0,\n\"remaining\": 150,\n\"promotionalCodesUsed\": [],\n\"\
  lastRefill\": \"2018-04-12T14:05:09.136Z\",\n\"maxUserType\": 150\n},\n\"additionalData\"\
  : {\n},\n\"creationDate\": \"2018-04-01T15:36:16.344Z\",\n\"username\": \"\",\n\"\
  email\": \"\",\n\"emailVerified\": true,\n\"id\": \"\",\n\"userTypeId\": \"...\"\
  ,\n\"firstName\": \"...\",\n\"lastName\": \"...\"\n}\n```\n*清单 3-5：信用信息示例响应*\n\n\
  ### 列出用户的实验\n\n此调用列出指定用户 ID 的所有实验。\n\n- **HTTP 方法：** `GET`\n- **URL：** `https://quantumexperience.ng.bluemix.net/api/users/USER-ID/codes/lastest?access_token=ACCESS-TOKEN&includeExecutions=true`\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `USER-ID` | 从身份验证步骤获取的用户 ID。 |\n| `access_token`\
  \ | 您的账户访问令牌。 |\n| `includeExecutions` | 如果为 `true`，则在结果中包含执行记录。 |\n\n#### HTTP\
  \ 标头\n\n| 名称 | 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py`\
  \ |\n\n#### 响应示例\n\n清单 3-6 展示了此调用的示例响应。\n\n```json\n{\n\"total\": 17,\n\"count\"\
  : 17,\n\"codes\": [{\n\"type\": \"Algorithm\",\n\"active\": true,\n\"versionId\"\
  : 1,\n\"idCode\": \"...\",\n\"name\": \"3Q GHZ State YXY-Measurement 1\",\n\"jsonQASM\"\
  : {\n...\n},\n\"qasm\": \"\",\n\"codeType\": \"QASM2\",\n\"creationDate\": \"2018-04-14T19:09:51.382Z\"\
  ,\n\"deleted\": false,\n\"orderDate\": 1523733740504,\n\"userDeleted\": false,\n\
  \"displayUrls\": {\n\"png\": \"URL\"\n},\n\"isPublic\": false,\n\"id\": \"...\"\
  ,\n\"userId\": \"...\"\n}]}\n```\n*清单 3-6：实验列表响应*\n\n### 运行实验\n\n此调用在 IBM Q Experience\
  \ 上远程运行一个实验。\n\n- **HTTP 方法：** `POST`\n- **URL：** `https://quantumexperience.ng.bluemix.net/api/codes/execute?access_token=ACCESS-TOKEN&shots=SHOTS&deviceRunType=RUN-TYPE`\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `shots` | 要执行的实验次数（shots）。次数越高，结果精度越好。请注意，消耗信用额度按每\
  \ 1024 次实验 3 点信用计算。量子世界中的空间非常珍贵。 |\n| `access_token` | 您的账户访问令牌。 |\n| `deviceRunType`\
  \ | 运行实验的设备。可以是：<br>• 真实设备名称，如 `ibmqx2` 和 `ibmqx3`，用于真实处理器。<br>• 模拟器：`simulator`\
  \ 或 `sim_trivial_2`。 |\n| `seed`（可选） | 仅模拟器需要的可选随机数。 |\n\n#### HTTP 标头\n\n| 名称 |\
  \ 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py` |\n| `Content-Type`\
  \ | `application/json` |\n\n#### 负载格式\n\n请求体是一个描述实验的 JSON 文档，如下所示：\n\n```json\n\
  {\n\"name\": \"Experiment NAME\",\n\"codeType\": \"QASM2\",\n\"qasm\": \"CODE\"\n\
  }\n```\n\n\n\n#### 响应示例\n\n这可以说是该 API 中最重要的调用。作为练习，让我们从前一节中选取一个贝尔态，利用 REST API 在模拟器和真实设备上分别运行它。\n\
  \n```\nIBMQASM 2.0;\ninclude \"qelib1.inc\";\nqreg q[2];\ncreg c[2];\nh q[0];\n\
  cx q[0],q[1];\nh q[0];\ns q[1];\nh q[1];\nt q[1];\nh q[1];\nmeasure q[0] -> c[0];\n\
  measure q[1] -> c[1];\n代码清单 3-7\n贝尔态 XW 测量\n```\n\n代码清单 3-7 展示了上一节中利用 Web 控制台执行的一个贝尔态\
  \ (XW) 实验的汇编代码。获取此代码并创建一个 JSON 负载，格式为：`{\"name\": \"NAME\", \"codeType\": \"QASM2\"\
  , \"qasm\": \"ONE-LINE-QASM\"}`。请注意，我们必须为其指定一个实验名称，并且 QASM 代码必须格式化为单行，包含换行符（`\\\
  n`）；因此最终的负载变为：\n\n```\n{\"name\": \"REST Bell State XW\", \"codeType\": \"QASM2\"\
  , \"qasm\": \"IBMQASM 2.0;\\ninclude \\\"qelib1.inc\\\";\\nqreg q[2];\\ncreg c[2];\\\
  nh q[0];\\ncx q[0],q[1];\\nh q[0];\\ns q[1];\\nh q[1];\\nt q[1];\\nh q[1];\\nmeasure\
  \ q[0] -> c[0];\\nmeasure q[1] -> c[1];\"}\n```\n\n现在，我们已准备好通过 REST 提交实验。别忘了，您必须先进行身份验证以获取访问令牌。\n\
  \n###### 提示\n\n大多数（即便不是全部）当前浏览器都提供 REST 客户端。安装您喜欢的浏览器 REST 客户端，并按照“身份验证”部分所述创建一个身份验证请求。保存并把它放在手边，以便随时获取您的访问令牌。\n\
  \n我将使用 Chrome 的 YARC（Yet Another REST Client）首先将负载提交到模拟器，然后再提交到真实设备（参见图 3-8）。\n\n\
  ![../images/469026_1_En_3_Chapter/469026_1_En_3_Fig8_HTML.jpg](img/469026_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8\n\n用于贝尔态 XW 实验的 Chrome YARC REST 客户端及负载\n\n##### 提交至模拟器\n\n要提交至模拟器，请使用以下请求参数：\n\
  \n```\naccess_token=ACESS_TOKEN&shots=1&deviceRunType=simulator\n```\n\n验证响应代码是否为\
  \ 200 (OK)，并查看响应输出。验证该实验已记录在 Q Experience 控制台中（参见图 3-9）。\n\n![../images/469026_1_En_3_Chapter/469026_1_En_3_Fig9_HTML.jpg](img/469026_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9\n\n显示通过 REST 提交的贝尔态 XW 实验的 Web 控制台\n\n##### 提交至真实设备\n\n要提交至真实设备（此处为 `ibmqx4`），请将请求参数改为：\n\
  \n```\naccess_token=ACESS_TOKEN &shots=1&deviceRunType=ibmqx4\n```\n\n###### 注意事项\n\
  \n真实量子设备可能因维护或其他原因而离线。如果发生这种情况，提交将失败，并返回 400（错误请求）HTTP 响应。在提交至真实量子设备之前，请确保该设备在线！\n\
  \n如果一切顺利，该作业应被放入执行队列并记录在 Web 控制台中。代码清单 3-8 显示了向真实设备提交的结果，其状态为 `PENDING_IN_QUEUE`。\n\
  \n```\n{\n\"startDate\": \"2018-04-16T13:05:43.440Z\",\n\"modificationDate\": 1523883943441,\n\
  \"typeCredits\": \"plan\",\n\"status\": {\n\"id\": \"WORKING_IN_PROGRESS\"\n},\n\
  \"deviceRunType\": \"real\",\n\"ip\": {\n\"ip\": \"...\",\n\"city\": \"Raleigh\"\
  ,\n\"country\": \"United States\",\n\"continent\": \"North America\"\n},\n\"shots\"\
  : 1,\n\"paramsCustomize\": {},\n\"deleted\": false,\n\"userDeleted\": false,\n\"\
  id\": \"...\",\n\"codeId\": \"...\",\n\"userId\": \"...\",\n\"infoQueue\": {\n\"\
  status\": \"PENDING_IN_QUEUE\",\n\"position\": 21,\n\"estimatedTimeInQueue\": 735\n\
  },\n\"code\": {\n\"type\": \"Algorithm\",\n\"active\": true,\n\"versionId\": 1,\n\
  \"idCode\": \"...\",\n\"name\": \"REST Bell State XW #1\",\n\"jsonQASM\": {\n...\n\
  \"numberGates\": 7,\n\"hasMeasures\": true,\n\"numberColumns\": 11,\n\"include\"\
  : \"include \\\"qelib1.inc\\\";\"\n},\n\"qasm\": \"...\",\n\"codeType\": \"QASM2\"\
  ,\n\"creationDate\": \"2018-04-16T13:05:42.547Z\",\n\"deleted\": false,\n\"orderDate\"\
  : 1523883943351,\n\"userDeleted\": false,\n\"isPublic\": false,\n\"id\": \"...\"\
  ,\n\"userId\": \"...\"\n}\n}\n代码清单 3-8\n通过 REST 提交的贝尔态 XW 实验的简化 HTTP 响应\n```\n\n\
  至此，您已成功通过 REST 提交了第一个实验。尝试增加实验的重复次数（shots），以获得更高的精度。\n\n### 运行作业\n\n此调用与之前的*运行实验*非常相似；但它有两个端点：\n\
  \n- **端点 1：** 适用于 IBM Q Experience 的普通用户。\n- **端点 2：** 适用于企业客户。需要提供 hub、group 和\
  \ project ID。\n\n企业客户享有高级访问权限，并可访问强大的 20 量子比特处理器，以及可能在 2018 年底推出的传说中的 50 量子比特芯片。\n\
  \n- **HTTP 方法：** POST\n- **URL 1：** (5, 16 量子比特) `https://quantumexperience.ng.bluemix.net/api/Jobs?access_token=ACCESS-TOKEN`\n\
  - **URL 2：** (20+ 量子比特，企业版) `https://quantumexperience.ng.bluemix.net/api/Network/HUB/Groups/GROUP/Projects/PROJECT/jobs?access_token=ACCESS-TOKEN`\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| access_token | 您的账户访问令牌 |\n\n#### HTTP\
  \ 标头\n\n| 名称 | 值 |\n| --- | --- |\n| x-qx-client-application | 默认为 `qiskit-api-py`\
  \ |\n| Content-Type | `application/json` |\n\n#### 负载格式\n\n负载的格式将所有执行参数（后端名称、重复次数和代码）嵌入到一个\
  \ JSON 文档中，如下所示：\n\n```\n{\n\"backend\": {\n\"name\": \"simulator\"\n},\n\"shots\"\
  : 1,\n\"qasms\": [{\n\"qasm\": \"qams\"\n}, ...]\n}\n```\n\n###### 提示\n\n通过“运行作业”端点提交的实验不会记录在作曲家的*分数*部分，而是放入执行队列中等待处理。\n\
  \n另一方面，通过“运行实验”端点提交将会在作曲家中记录一个条目。此外，请注意，提交给模拟器的任何实验都会立即返回结果。提交给真实量子设备的实验将始终以 `PENDING`\
  \ 状态进入执行队列。完成后，将向用户发送通知电子邮件。让我们快速地向真实设备 `ibmqx4` 发送一个作业。将以下端点粘贴到您的 REST 客户端中：\n\n\
  `https://quantumexperience.ng.bluemix.net/api/Jobs?access_token=access_token`\n\n\
  按照上一节的描述，将 HTTP 方法设置为 POST，并设置访问令牌和标头。使用以下 JSON 负载：\n\n```\n{\n\"qasms\": [{\n\"\
  qasm\": \"\\n\\ninclude \\\"qelib1.inc\\\";\\nqreg q[5];\\ncreg c[5];\\nu2(-4*pi/3,2*pi)\
  \ q[0];\\nu2(-3*pi/2,2*pi) q[0];\\nu3(-pi,0,-pi) q[0];\\nu3(-pi,0,-pi/2) q[0];\\\
  nu2(pi,-pi/2) q[0];\\nu3(-pi,0,-pi/2) q[0];\\nmeasure q -> c;\\n\" }],\n\"shots\"\
  : 1024,\n\"backend\": {\n\"name\": \"ibmqx4\"\n},\n\"maxCredits\": 3\n}\n```\n\n\
  上述负载向真实设备 `ibmqx4` 提交了一个随机实验。在提交之前请确保它在线（或者改用模拟器）。同时确保 QASM 代码为单行，包含换行符（`\\n`）。请注意，双引号必须转义。如果提交失败，很可能意味着设备离线或您的\
  \ QASM 负载无效。请再三检查以确保它们正确。我得到的响应告诉我，我的作业正在 `RUNNING`（运行中）：\n\n```\n{\n\"qasms\":\
  \ [\n{\n\"qasm\": \"...\",\n\"status\": \"WORKING_IN_PROGRESS\",\n\"executionId\"\
  : \"5ba6955fd867ef0046615172\"\n}\n],\n\"shots\": 1024,\n\"backend\": {\n\"id\"\
  : \"5ae875670f020500393162b3\",\n\"name\": \"ibmqx4\"\n},\n\"status\": \"RUNNING\"\
  ,\n\"maxCredits\": 3,\n\"usedCredits\": 3,\n\"creationDate\": \"2018-09-22T19:17:51.448Z\"\
  ,\n\"id\": \"5ba6955fd867ef0046615171\",\n\"userId\": \"5ae875060f0205003931559a\"\
  ,\n\"infoQueue\": {\n\"status\": \"PENDING_IN_QUEUE\",\n\"position\": 11\n}\n}\n\
  ```\n\n请注意，我的作业不会显示在作曲家中；但是，我会收到一封包含结果链接的电子邮件。\n\n\n\n### 获取 API 版本\n\n此接口返回 Q Experience\
  \ REST API 的版本号。\n\n- **HTTP 方法：** `GET`\n- **URL：** [`https://quantumexperience.ng.bluemix.net/api/version?access_token=ACCESS-TOKEN`](https://quantumexperience.ng.bluemix.net/api/version?access_token=ACCESS-TOKEN)\n\
  \n#### 请求参数\n\n| 名称 | 值 |\n| --- | --- |\n| `access_token` | 您的账户访问令牌 |\n\n####\
  \ HTTP 请求头\n\n| 名称 | 值 |\n| --- | --- |\n| `x-qx-client-application` | 默认为 `qiskit-api-py`\
  \ |\n\n#### 响应格式\n\n该接口返回一个包含 API 版本的字符串，在撰写本文时版本为 `6.4.8`。\n\n我们已经剖析了 Python 版\
  \ IBMQuantumExperience REST API，以了解其幕后运作机制。作为练习，让我们为 Node JS 构建一个自定义客户端。具体方法如下。\n\
  \n## IBMQuantumExperience 的 Node JS 客户端\n\n本节将展示一个简单练习，用于模拟 Python SDK（也称为 QISKit，即量子信息软件工具包）的其中一个组件。在下一章中，我们将更详细地探讨\
  \ Python SDK，但首先需要说明的是，该 SDK 构建于两个基础库之上：\n\n- **IBMQuantumExperience：** 这是一个用 Python\
  \ 实现的 REST 客户端库，我通过剖析它来呈现上一节中介绍的 REST API。这个库的文档并不完善，但这也在情理之中，因为它被设计成一个未来可能会发生变化的模块化库。\n\
  - **QISKit SDK：** 这是所有量子程序的主要入口点。它包含门逻辑、汇编转换、模拟器（包括本地 Python 模拟器和快速 C++ 模拟器）以及更多功能。该库还通过\
  \ REST 调用`IBMQuantumExperience`，以完成与 IBM Q Experience 平台的所有交互。\n\nPython 是一种出色的语言，但\
  \ Node JS 目前在数据中心领域风头正劲；因此，本节将为 Node JS 提供一个简单的 REST API 实现。以下是构建这样一个库的一些理由：\n\n\
  - Node JS 是网络 I/O 异步调用的强大引擎。它速度快，是构建 REST 客户端的理想平台。\n- Python 是一种优秀的语言，拥有大量出色的数值计算、数学和图表库，但它也有一些可能让某些人觉得不讨喜的特性。例如，缩进在\
  \ Python 中很重要（你不能混用制表符 `TAB` 和空格——没有花括号来区分代码块）。这起初让我抓狂，花了我不少时间才弄清楚，因为几乎所有其他计算机语言都使用花括号来区分逻辑块。但在\
  \ Python 中并非如此，你必须使用空格或制表符，而且不能混用。我不喜欢这点。我认为这是糟糕的设计，因为一旦出错，你就无法知道一个逻辑块在哪里结束。这正是花括号的作用所在。\n\
  - 多样性总是好的：在经历了 Python 带来的种种麻烦之后，我认为这个库可以作为 Node JS 版 QISKit 克隆的基础。\n\n那么，让我们开始吧。\n\
  \n### 构建 IBMQuantumExperience 的 Node 模块\n\n我尽量保持名称与 Python 版本尽可能接近。要创建一个 Node JS\
  \ 模块，请创建一个名为`IBMQuantumExperience`的文件夹，并按照以下命令集初始化 Node JS：\n\n```\n$ mkdir IBMQuantumExperience\n\
  $ cd IBMQuantumExperience\n$ npm init\n```\n\n###### 提示\n\nLinux 用户：我是在 Windows\
  \ 系统上编写本节的；此外，我假定你已经安装了 Node JS、熟悉 Node 模块并能用 Javascript 编写代码。总之，你可以从[`https://nodejs.org/en/`](https://nodejs.org/en/)获取适用于所有平台的\
  \ Node 安装程序。另请注意，Linux 系统会因包名使用大写字母而报错。为了避免麻烦，建议使用 Windows 来阅读本节。\n\nNode 提供了一个名为\
  \ `npm` 的包管理器（这与 Python 的 `pip` 非常相似），可用于初始化你的模块。第三个命令会在当前文件夹中创建两个文件：\n\n- `index.js`：这是你的模块代码。注意：对于\
  \ Linux 用户，这个文件可能不会被创建。如果是这样，请手动创建它。\n- `package.json`：这是模块描述文件，包含名称、版本、作者、依赖项等信息。\n\
  \n在同一位置创建一个 `test` 文件夹，用于存放单元测试，并安装强大的 Node REST 客户端 `request`：\n\n```\n$ mkdir\
  \ test\n$ npm install request\n```\n\n第二条命令会在当前文件夹中安装流行的 HTTP 请求包及其所有依赖项。现在，我们准备开始实现上一节介绍的\
  \ REST API。在你喜欢的编辑器中打开 `index.js`，让我们开始吧。\n\n### 导出 API 方法\n\n要通过 Node 暴露 API，请使用\
  \ `module.exports` 库，如下代码清单 3-9 所示。请注意，这是该库的部分实现，各部分将在后续章节中逐步组装完成。尽管如此，本书源代码的 `Workspace\\\
  Ch03\\IBMQuantumExperience` 目录下提供了完整实现。话虽如此，你应该能够将所有代码片段粘贴到 `index.js` 中。再次强调，此处我假定你熟悉如何用\
  \ Node JS 编写模块。\n\n```\nconst log = require('./log'); // 一个简单的自定义日志库（参见调试章节）\nconst\
  \ request = require('request');\n//...\nmodule.exports =  {\ninit: function (cfg)\
  \ {\n_config = cfg;\nvar debug = _config.debug ? _config.debug : false;\nlog.init\
  \ (debug);\nreturn loginWithToken ();\n},\ngetCalibration  : calibration,\ngetBackends\
  \    : backends,\ngetParameters  : parameters,\nrunExperiment  : experiment\n//\
  \ 留作练习  getJobs      : jobs,\n// 留作练习  getMyCredits  : credits\n}\n代码清单 3-9\n通过\
  \ Node 暴露公共 API 方法\n```\n\n在代码清单 3-9 中，我们使用 `require` 关键字导入了一个外部库：\n\n- 第 2 行导入了\
  \ `request` HTTP 客户端库，用于与 Q Experience 交互。\n- 第 5 行声明了此模块要暴露的公共方法：\n  - `init`：此方法按照上一节“通过\
  \ REST API 远程访问”所述，对 Q Experience 平台进行身份验证。\n  - `getCalibration`：返回指定设备的平台校准参数。\n\
  \  - `getBackends`：返回可供使用的量子设备（和模拟器）列表。\n  - `getParameters`：返回设备参数，如 Composer Web\
  \ 控制台的“设备”部分所述。\n  - `runExperiment`：在模拟器或真实量子设备上远程运行实验。\n  - `getJobs`：返回实验执行队列中的当前任务列表。\n\
  \  - `getMyCredits`：返回用户的执行积分及其他有用信息。\n\n\n\n### 使用令牌进行身份验证\n\n在身份验证之前，库的初始化方式与在\
  \ Python 中相同，需要一个包含平台 URL、API 令牌等信息的配置 JSON 对象。例如，下面是我们测试获取后端信息 REST API 调用的方式（取自\
  \ `test.js`）：\n\n```\n// 从同一目录引入 `index.js` 文件\nconst qx = require('index.js');\n\
  // 在此处输入你的 API 令牌\nvar config = { APItoken: 'YOUR_API_TOKEN'\n, debug    : true\n\
  , 'url'    : 'https://quantumexperience.ng.bluemix.net/api'\n, 'hub'    : 'MY_HUB'\n\
  , 'group'  : 'MY_GROUP'\n, 'project'  : 'MY_PROJECT'\n}\n// 获取后端信息\nasync function\
  \ testBackends() {\nawait qx.init(config);\nvar result = await qx.getBackends();\n\
  console.log(\"---- 后端列表 ----\\n\" + JSON.stringify(result) + \"\\n-----\" );\n}\n\
  ```\n\n请注意，`hub`、`group` 和 `project` 仅适用于企业客户参数；因此在此实现中未使用；不过可以轻松添加对它们的支持。初始化完成后，只需按\
  \ REST API 所述提交一个 POST 请求，使用令牌登录（见清单 3-10）。请注意，此代码以及本节中的所有代码清单都应放在 `index.js` 中。\n\
  \n```\nfunction loginWithToken () {\nlet options = {\nurl: _config.url + '/users/loginWithToken',\n\
  form: {'apiToken': _config.APItoken}\n};\nreturn new Promise(function(resolve, reject)\
  \ {\n// 执行异步任务\n// 返回结果: {\"id\":\"访问令牌\",\"ttl\":1209600,\"created\":\"2018-04-17T23:30:21.089Z\"\
  ,\"userId\":\"用户 ID\"}\nrequest.post(options, function(err, res, body) {\nif (err)\
  \ {\nreject(err);\n}\nelse {\nvar json     = JSON.parse(body);\n_accessToken  =\
  \ json.id;\n_userId      = json.userId;\nlog.debug(\"获取到用户:\" + _userId + \" 令牌:\"\
  \ +  _accessToken);\nresolve(JSON.parse(body));\n}\n});\n})\n}\n清单 3-10\n通过 REST\
  \ 进行令牌认证\n```\n\n在清单 3-10 中：\n\n- 使用 `request.post` 系统调用，通过 JSON 载荷 `{'apiToken':\
  \ 'YOUR_TOKEN'}` 向端点 `https://quantumexperience.ng.bluemix.net/api/users/loginWithToken`\
  \ 发送 HTTP POST 请求。如 REST API 所述，此调用返回一个新的 JSON 文档：`{\"id\":\"TOKEN\",\"ttl\":1209600,\"\
  created\":\"DATE\",\"userId\":\"USERID\"}`。该文档被解析，访问令牌（`id`）和用户 ID（`userId`）被保存以供后续使用。\n\
  - 请注意，由于 Node 中所有网络 I/O 都是异步的，所有方法都返回一个 `Promise`。这基本上是一个异步任务，封装了在读取结果之前必须等待任务完成的复杂性。因此，如果\
  \ HTTP 请求调用成功，`Promise` 中的 `resolve` 回调将携带 HTTP 响应数据触发；否则将调用 `Promise` 的 `reject`\
  \ 回调。\n\n###### 提示\n\n对于异步代码而言，Promise 是回调函数的一种引人注目的替代方案。但有时它们也会让人感到困惑。总而言之，Promise\
  \ 正逐渐成为 Javascript 异步编程事实上的标准。\n\n不过，如果你觉得 `Promise` 处理代码过于复杂，还有一种更简单的方法来处理，这将在下一节展示，我们将实现一个获取后端列表的方法。\n\
  \n### 列出后端\n\n清单 3-11 展示了一个从 Q Experience 获取后端的 Node 请求。\n\n- 它向 `https://quantumexperience.ng.bluemix.net/api/Backends?access_token=TOKEN`\
  \ 发送一个 HTTP GET 请求。\n- 它返回一个 `Promise`，可以在任何异步函数中通过使用 Javascript 新的 `async/await`\
  \ 特性来进行调用。\n\n```\nconst _defaultHdrs = {\n'x-qx-client-application': _userAgent\n\
  };\nfunction backends () {\nlet options = {\nurl: _config.url + '/Backends?access_token='\
  \ + _accessToken,\nheaders: _defaultHdrs\n};\nreturn new Promise(function(resolve,\
  \ reject) {\n// 执行异步任务\nrequest.get(options, function(err, res, body) {\nif (err)\
  \ {\nreject(err);\n}\nelse {\nresolve(JSON.parse(body));\n}\n});\n})\n}\n清单 3-11\n\
  通过 Node 获取后端列表\n```\n\n要测试上述方法，我们可以使用 Node.js >=7.6 中的 `async/await` 特性，如下代码片段所示：\n\
  \n```\nasync function testBackends() {\nawait qx.init(config);\nvar result = await\
  \ qx.getBackends();\nconsole.log(\"---- 后端列表 ----\\n\" + JSON.stringify(result)\
  \ + \"\\n-----\" );\n}\n```\n\n###### 提示\n\n一个 `async` 函数可以包含一个 `await` 表达式，该表达式会暂停\
  \ async 函数的执行，等待传入的 Promise 解析完成，然后恢复 async 函数的执行并返回解析后的值。\n\n### 列出校准参数\n\n清单 3-12\
  \ 展示了如何在 IBM Q Experience 中获取特定后端的校准和硬件参数：\n\n- 通过向 `https://quantumexperience.ng.bluemix.net/api/Backends/NAME/calibration?access_token=TOKEN`\
  \ 发送 GET 请求获取校准信息，其中 `NAME` 是你要查询的后端，`TOKEN` 是从身份验证步骤获取的访问令牌。\n- 通过向类似的 GET 请求 `https://quantumexperience.ng.bluemix.net/api/Backends/NAME/parameters?access_token=TOKEN`\
  \ 获取后端参数。\n- 两个请求的响应格式在本章的“通过 REST API 进行远程访问”部分中描述。\n\n```\nfunction calibration\
  \ (name) {\nlet options = {\nurl: _config.url + '/Backends/' + name +'/calibration?access_token='\
  \ + _accessToken,\nheaders: _defaultHdrs\n};\nreturn new Promise(function(resolve,\
  \ reject) {\nrequest.get(options, function(err, res, body) {\nif (err) {\nreject(err);\n\
  }\nelse {\nresolve(JSON.parse(body));\n}\n});\n})\n}\nfunction parameters (name)\
  \ {\nlet options = {\nurl: _config.url + '/Backends/' + name +'/parameters?access_token='\
  \ + _accessToken,\nheaders: _defaultHdrs\n};\nreturn new Promise(function(resolve,\
  \ reject) {\nrequest.get(options, function(err, res, body) {\nif (err) {\nreject(err);\n\
  }\nelse {\nresolve(JSON.parse(body));\n}\n});\n})\n}\n清单 3-12\n获取设备校准和参数数据\n```\n\
  \n要测试代码，创建一个 async 函数并使用 `await` 关键字从异步任务中获取响应，如下代码片段所示：\n\n```\nasync function\
  \ testCalibration() {\nawait qx.init(config);\nvar result1 = await qx.getCalibration('ibmqx4');\n\
  var result2 = await qx.getParameters('ibmqx4');\nconsole.log(JSON.stringify(result1)\
  \ );\nconsole.log(JSON.stringify(result1) );\n}\n```\n\n最后一步，让我们看看如何运行一个实验。\n\n\
  ### 运行实验\n\n这是 API 中最重要的调用，执行后，实验应记录在 IBM Q Experience Web 控制台的得分部分（见清单 3-13）。要以编程方式提交实验，请向\
  \ `/codes/execute` 端点发送一个带有 JSON 载荷的 HTTP POST 请求：\n\n- 请记住，汇编代码必须格式化为单行，使用换行符（`\\\
  n`）分隔指令。例如，以下代码声明了 5 个量子比特和 5 个经典寄存器：`\"\\n\\ninclude \\\"qelib1.inc\\\";\\nqreg\
  \ q[5];\\ncreg c[5];\\n\"`。\n- `name` 参数定义了要在 Web 控制台中记录的实验名称。\n- `shots` 参数是量子处理器执行的\
  \ shots 次数。\n- `device` 参数可以是 `simulator`（用于远程模拟器）或真实的量子设备名称，例如 `ibmqx4`。\n\n```\n\
  {'name': name, \"codeType\": \"QASM2\", \"qasm\":  \"YOUR_QASM_CODE\"}\n```\n\n\n\
  \n###### 提示\n\n如果你在真实设备上运行实验，该实验将进入执行队列等待后续处理。实验完成后你将收到一封电子邮件。另一方面，如果在远程模拟器上运行实验，结果将同步返回。\n\
  \n```\nconst _userAgent = 'qiskit-api-py'; // 全局变量\nfunction experiment (name, qasm,\
  \ shots, device) {\nlet options = {\nurl: _config.url + '/codes/execute?access_token='\
  \ + _accessToken\n+ '&shots=' + shots + '&deviceRunType=' + device,\nheaders: {'Content-Type':\
  \ 'application/json', 'x-qx-client-application': _userAgent} ,\nform: {'name': name,\
  \ \"codeType\": \"QASM2\", \"qasm\": qasm}\n};\nreturn new Promise(function(resolve,\
  \ reject) {\nrequest.post(options, function(err, res, body) {\nif (err) {\nreject(err);\n\
  }\nelse {\nresolve(JSON.parse(body));\n}\n});\n})\n}\n代码清单 3-13\n运行实验\n```\n\n将代码清单\
  \ 3-13 粘贴到 `index.js` 中，使用以下代码片段在真实量子设备 `ibmqx4` 上运行实验，然后验证实验已记录在网络控制台中，最后等待通知邮件。\n\
  \n```\nasync function testExperiment () {\nawait qx.init(config);\nvar name   =\
  \ \"REST Experiment from Node JS #1\"\nvar qasm   =  \"\\n\\ninclude \\\"qelib1.inc\\\
  \";\\nqreg q[5];\\ncreg c[5];\\nu2(-4*pi/3,2*pi) q[0];\\nu2(-3*pi/2,2*pi) q[0];\\\
  nu3(-pi,0,-pi) q[0];\\nu3(-pi,0,-pi/2) q[0];\\nu2(pi,-pi/2) q[0];\\nu3(-pi,0,-pi/2)\
  \ q[0];\\nmeasure q -> c;\\n\";\nvar shots   = 1;\nvar device   = \"ibmqx4\";\n\
  var result   = await qx.runExperiment(name, qasm, shots, device);\nconsole.log(\"\
  ---- 实验 \" + name + \" ----\\n\" + JSON.stringify(result) + \"\\n-----\" )\n}\n\
  ```\n\n###### 提示\n\nIBMQuantumExperience Node 模块的代码包含在本书源码的 `Workspace\\Ch03\\IBMQuantumExperience`\
  \ 目录下。该项目在 `test/tests.js` 中有一个测试脚本。编辑此文件，添加你的 API 令牌，并在 `IBMQuantumExperience`\
  \ 目录中使用命令 `node test/tests.js` 执行它。\n\n### 调试与测试\n\n对于简单的调试，我创建了子模块 `log.js`（与 `index.js`\
