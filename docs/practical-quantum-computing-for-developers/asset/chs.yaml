  \ LOGD( tag, txt ) {\nif ( _debug ) {\nconsole.log('[DBG-QX] ' + tag + ' '  + (txt\
  \ ? txt : \"));\n}\n}\nfunction LOGE( tag, txt ) {\nconsole.error('[ERR-QX] ' +\
  \ tag + ' ' + (txt ? txt : \"));\n}\nfunction init (debug) {\n_debug = debug;\n\
  }\nexports.init = init;\nexports.debug = LOGD;\nexports.error = LOGE;\n```\n\n主模块（`index.js`）使用此子模块在控制台中显示调试消息。最后，要测试该包，请编辑\
  \ `test/tests.js` 并粘贴本节中描述的测试片段，如下面来自 `tests.js` 的部分代码所示：\n\n```\n// test/tests.js\
