  \ 文档（`readme.md`）来记录你的代码。发布后，导航到 [`​npmjs.​com/​package/​<package>`](https://npmjs.com/package/%253cpackage%253e)\
  \ 查看你的在线模块。现在其他人应该可以这样安装它：\n\n```\nnpm install IBMQuantumExperience\n```\n\nNode\
