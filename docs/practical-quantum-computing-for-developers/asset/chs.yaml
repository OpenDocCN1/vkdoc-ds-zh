- "# 6. 趣玩量子游戏\n\n在本章中，你将学习如何在量子计算机上实现一个基础游戏。为此，我们使用 QISKit Python 教程附带的典型量子战舰游戏。第一部分探讨游戏的机制，包括：\n\
  \n*   使用量子比特表示棋盘上的舰船位置\n*   如何通过量子程序计算损坏百分比，以便在本地或远程模拟器或真实量子设备上运行\n*   如何使用部分非门对单个量子比特进行\
  \ X 轴旋转\n\n但我们并不止步于此。本章的第二部分将内容提升到更高层次。通过向你展示如何实现具有以下功能的基于云的量子战舰，游戏得到了重大改观：\n\n\
  *   基于浏览器的用户界面，带有交互式棋盘用于放置舰船或炸弹。游戏机制保持不变。\n*   使用 Apache Web 服务器的基于 CGI 的脚本，用于消费游戏事件并将其分派给量子程序。\n\
  *   对原始量子程序的修改版本，用于对量子比特执行部分非旋转以计算舰船损坏。大部分原始代码保持不变。\n\n你将学习如何将原始代码模块化并重新用于云中不同的量子战舰版本。让我们开始吧。\n\
  \n## 量子战舰的变体\n\n本节我们将探讨 QISKit 教程附带的一个名为*量子战舰*的游戏。该程序使用 5 个量子比特表示一个棋盘，每位玩家放置三艘舰船。然后，它要求每位玩家在\
  \ 0-5 的位置放置一枚炸弹。最后，每艘舰船的损坏由使用双脉冲单量子比特门`U3(theta, phi, lambda)`的量子程序计算。该门称为部分非门，通过\
  \ theta、phi 或 lambda 弧度对 X、Y、Z 轴进行旋转。\n\n```\n4       0\n|\\     /|\n| \\   / |\n\
  |  \\ /  |\n|   2  |\n|  / \\  |\n| /   \\ |\n|/     \\|\n3        1\n```\n\n在此特定情况下，舰船损坏是通过使用该位置的炸弹数量，对\
  \ X 轴（theta）进行一系列部分旋转来计算的。如果某个位置（或舰船）的损坏超过 95%，该舰船即被摧毁，一旦整个玩家的舰队被摧毁，则宣布获胜者，游戏结束。这只是我们小时候都玩过的标准战舰游戏，但后台使用的是量子计算机或模拟器。\n\
  \n###### 注意\n\n该游戏由巴塞尔大学的 James Wootton 编写，并贡献给 QISKit Python 教程。Wootton 原始代码的修改版可从本书源代码的`Workspace\\\
  Ch06\\battleship\\BattleShip.py`处获得（省略了一些不必要的花哨文本）。\n\n让我们运行程序并查看游戏机制。\n\n### 设置说明\n\
  \n从本书源码中，按以下段落描述的方式执行`BattleShip.py`程序：\n\n*   对于 CentOS 6 或 7 或任何类似 Fedora 的操作系统，激活你的\
  \ Python 虚拟环境。仅在你有多个 Python 版本（例如 2.7 和 3.6）时才需要此操作。请记住你必须使用 3.5 或更高版本。关于如何设置 Python\
  \ 虚拟环境的说明已在第 3 章中介绍过。\n*   将脚本`Workspace/Ch06/battleship/BattleShip.py`和配置文件`Qconfig.py`从本书源码复制到你的工作区，并执行它（如下所示）。\n\
