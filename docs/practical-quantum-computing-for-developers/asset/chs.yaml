  \ 8-7 所示。`f(x)` 和 `b` 异或真值表的第三行（图 8-7 的右侧）显示了相位反转的效果。\n\n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig7_HTML.jpg](img/469026_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7  \n相位反转电路\n\n-   最后，如图 8-3 所示，均值反演等同于围绕 `|μ⟩ = 1/√N ∑_x |x⟩` 进行反射。为了更好地形象化这一点，可以将叠加态\
  \ `ψ` 和均值 `μ` 表示为二维空间中的向量，如图 8-8 所示。要反射 `ψ`，请创建 `μ` 的正交向量，然后将 `ψ` 以相同角度 `θ` 投影到新的象限上。\n\
  \n均值反演将 `∑ α[x] |x⟩ → ∑ (2μ − α[x]) |x⟩` 的证明包含三个步骤，如图 8-8 中的电路所示。\n\n1.  将 `|μ⟩`\
  \ 变换为全零向量 `|0， …, 0⟩`。这是通过对输入应用 Hadamard 门实现的。\n2.  围绕全零向量 `|0， …, 0⟩` 进行反射。这可以通过将其乘以稀疏矩阵\
  \ `[[1, …, 0], [0, -1, …], [⋮, …, ⋱], [0, …, -1]]` 来完成。\n3.  通过再次应用 Hadamard，将 `|0，\
  \ …, 0⟩` 变换回 `|μ⟩`。因此\n\n`H^(⊗n) [[1, …, 0], [0, -1, …], [⋮, …, ⋱], [0, …, -1]]\
  \ H^(⊗n) = H^(⊗n) ([[2, …, 0], [⋮, …, ⋱], [0, …, 0]] - I) H^(⊗n) = H^(⊗n) [[2, …,\
  \ 0], [⋮, …, ⋱], [0, …, 0]] H^(⊗n) - H^(⊗n) I H^(⊗n)`\n\n`= [[2/N, …, 2/N], [⋮,\
  \ …, ⋱], [2/N, …, 2/N]] - I = [[2/N - 1, …, 2/N], [⋮, …, ⋱], [2/N, …, 2/N - 1]]` (1)\n\
  \n注意 `H^(⊗n) I H^(⊗n) = I` 且 `H = (2/√N) |x⟩`。最后，将矩阵 (1) 应用于状态 `ψ = α[x] |x⟩` 得到\n\
  \n```\n[[2/N - 1, …, 2/N], [⋮, …, ⋱], [2/N, …, 2/N - 1]] [α₀， …, α_x, …, α_(N-1)]ᵀ\
  \ → [⋮, 2/N ∑ α_y - α_x, ⋮]ᵀ = 2μ - α_x 其中 2/N ∑ α_y = 2μ\n```\n\n以上就是用于无结构搜索的 Grover\
  \ 算法。它快速、强大，并且很快将应用于数据中心，全力处理各种数据库搜索。考虑到其相对于经典算法显著的性能提升，很可能在几年后，当量子计算机变得更易于商业应用时，大多数网络搜索将由这个量子强手执行。在结束之前，值得一提的是，在撰写本文时，IBM\
  \ Q Experience 上还没有一个有用的实现或实验（能够找到真实事物的实验）。希望未来这种情况会有所改变，但就目前而言，Grover 算法仍处于理论层面。在下一节中，我们将研究著名的用于整数因子分解的\
  \ Shor 算法，以此作为强有力的收尾。\n\n## 使用 Shor 算法进行整数因子分解\n\n密码学与密码分析之间的猫鼠游戏仍在激烈进行：前者不断设计新方法来加密我们的日常数据，而后者则不断探测弱点，寻找可攻破的裂缝。当前的非对称密码学依赖于众所周知的大素数（数百位数字范围）因子分解的难度。本节将研究\
  \ Shor 算法的内部工作原理，这是一种使用量子计算机对整数因子分解实现指数级加速的方法。接着，我们将使用一个名为 `ProjectQ` 的库进行实现。然后，我们对样本整数进行模拟并评估结果。最后，我们将探讨量子系统中整数因子分解的当前和未来方向。让我们开始吧。\n\
  \n### 用量子因子分解挑战非对称密码学\n\n在具有里程碑意义的论文《Polynomial-Time Algorithms for Prime Factorization\
  \ and Discrete Logarithms on a Quantum Computer》^(³³)中，Peter Shor 提出了一种量子因子分解方法，该方法使用了数学家们熟知已久的一个原理：在乘法群\
  \ `模 N` 中寻找元素 `a` 的周期（也称为阶），即满足以下条件的最小正整数：\n\n`x^r ≡ 1 (mod N)`\n\n其中 `N` 是要分解的数，`r`\
  \ 是 `x 模 N` 的周期。\n\n\n\n###### 提示\n\n大整数分解是一个困扰了数学家数千年的难题。1976 年，G. L. Miller 提出，利用随机化，可以将分解问题简化为寻找元素\
  \ `a modulo N` 的周期，从而大大简化了这一难题。这就是肖尔算法的基本思想。\n\n肖尔将他的算法分为三个阶段，其中两个阶段由经典计算机在多项式时间内完成：\n\
  \n1. *输入准备*：在经典计算机上以多项式时间 `log(n)` 完成。\n2. 通过量子电路寻找元素 `a` 的周期 `r`，使得 `a^r ≡ 1 (mod\
  \ N)`。根据肖尔的理论，这需要在量子计算机上经过 `O((log n)² (log log n)(log log log n))` 步。\n3. *后处理*：在经典计算机上以多项式时间\
  \ `log(n)` 完成。\n\n但为什么人们对这种方法如此兴奋呢？将它的时间复杂度（大 O 表示法）与当前经典算法中的佼佼者：数域筛法进行比较，如表 8-2\
  \ 所示（还包括另一个备受青睐的算法，历史悠久的二次筛法）。\n\n**表 8-2** 常见分解算法的时间复杂度\n\n| 算法 | 时间复杂度 |\n| ---\
  \ | --- |\n| 肖尔算法 | `(log n)² (log log n) (log log log n)` |\n| 数域筛法 | `exp(c (log\
  \ n)^{1/3} (log log n)^{2/3})` |\n| 二次筛法 | `exp(sqrt(ln n ln ln n))` |\n\n不可思议的是，肖尔算法具有多项式时间复杂度，远远优于数域筛法的指数时间复杂度，后者是经典计算机上已知最快的分解方法。事实上，专家估计，肖尔算法可以在几分钟内分解一个超过\
  \ 200 位的整数。这样的壮举将撼动当前用于为所有网络通信生成加密密钥的非对称密码学的基础。\n\n###### 提示\n\n对称密码学对量子计算具有很高的抵抗力，因此也能抵抗肖尔算法。\n\
  \n但先别恐慌；在实际量子计算机上实现该算法还有很长的路要走。尽管如此，我们可以使用精巧的 Python 库 `ProjectQ` 在经典系统上模拟该算法。我们将在后续章节中运行\
  \ `ProjectQ` 的实现，但接下来，让我们看看周期寻找如何高效地解决分解问题。\n\n### 周期寻找\n\n周期寻找是肖尔算法的基本构建模块。通过使用模运算，问题被简化为寻找函数\
  \ `f(x) = a^x mod N` 的周期 (`r`)（见图 8-9）。\n\n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig9_HTML.jpg](img/469026_1_En_8_Fig9_HTML.jpg)\n\
  \n**图 8-9** 周期函数 `f(x)`\n\n图 8-9 给出了周期 `r = 4` 的周期函数 `f(x)` 的示例。为了使算法有效，`f(x)` 必须满足三个条件：\n\
  \n1. `f(x)` 在每个周期内是一一对应的；也就是说，`f(x)` 的值不能重复。在图 8-9 中，这些值由每个周期内每条线的顶点表示。\n2. 对于任何给定的\
  \ `M` 或周期数，`r` 必须能整除 `M`。例如，给定 `M = 100` 和周期 `r = 4`，则 `M / r = 25`。\n3. `M` 除以\
  \ `r` 必须大于 `r`。也就是说，`M > r²`。\n\n肖尔算法将 `f(x)` 转换为一个量子电路 `U[f]`，其中输入处于叠加态。如果我们测量\
  \ `U[f]` 中的第二个寄存器，可能会看到振幅 `sum_{x=0}^{M-1} α_x |x⟩` 的值，如图 8-9 的振幅图所示。这里的振幅恰好相隔四个单位，这正是我们要寻找的周期。在这个特定情况下，我们得到周期为\
  \ `r = 4` 的周期叠加态。但是我们该如何处理这个周期叠加态呢？肖尔依赖于另一个技巧：傅里叶采样或量子傅里叶变换。\n\n#### 傅里叶采样\n\n傅里叶采样是一种数据处理过程，具有以下特性：\n\
  \n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig10_HTML.jpg](img/469026_1_En_8_Fig10_HTML.jpg)\n\
  \n**图 8-10** 显示周期叠加的傅里叶采样\n\n- 它允许输入移位而不改变输出分布。\n- 这很好，因为现在我们有了一个周期叠加态，其中非零振幅是周期的倍数（见图\
  \ 8-10）。\n\n但是傅里叶采样的输出是什么？它又有何帮助？答案是，它的输出是 `M / r` 的随机倍数。在本例中，给定 `M = 100` 和 `r\
  \ = 4`，我们得到 `100 / 4 = 25` 的随机倍数。这对我们的目标有利。让我们来看看具体如何实现。\n\n#### 将傅里叶采样结果输入欧几里得最大公约数算法\n\
  \n如果我们多次运行傅里叶采样，将会得到 `M / r` 的随机倍数。例如，我们可能得到 `50`、`75`、`25` 等。现在，如果我们对随机输出应用欧几里得最大公约数（`gcd`）算法，那么奇迹发生了：通过用\
  \ `M` 除以 `gcd`，我们就得到了周期 `r`。因此\n\n```\nr = M / gcd(50, 75, ...) = 100 / 25 = 4\n\
  ```\n\n这就是通过量子电路寻找周期的概要。要理解这种方法如何高效地找到因子，让我们通过分解数字 `N = 21` 来运行一个示例。我们的任务依赖于两个非常高效的操作：\n\
  \n- 模运算：`a = b (mod N)`。例如，`3 = 15 (mod 12)`。\n- 最大公约数 `gcd(a, b)`。例如，`gcd(15, 21)\
  \ = 3`。\n\n因此对于 `N = 21`，我们需要求解方程 `x² ≡ 1 (mod 21)`。也就是说，找到非平凡平方根 `x`，使得\n\n- `N`\
  \ 能整除 `(x + 1)(x - 1)`。\n- `N` 不能整除 `(x ± 1)`。\n- 最后，通过对 `gcd(N, x+1)` 的计算来恢复一个质因子。\n\
  \n要找到 `N = 21` 的非平凡因子，随机选择一个 `x`。例如，给定 `N = 21`，选择 `x = 2`；因此\n\n```\n2⁰ ≡ 1 (mod\
  \ 21)\n2¹ ≡ 2 (mod 21)\n2² ≡ 4 (mod 21)\n2³ ≡ 8 (mod 21)\n2⁴ ≡ 16 (mod 21)\n2⁵ ≡\
  \ 11 (mod 21)\n2⁶ ≡ 1 (mod 21)。得到周期 r = 6。\n```\n\n在这种情况下，`2⁶ = (2³)²`。因此 `2³ =\
  \ 8` 是一个非平凡因子，使得 `21` 能整除 `(8 + 1)(8 - 1)`。最后，我们通过最大公约数 `gcd(N, x+1) = gcd(21, 9)\
  \ = 3` 恢复一个因子。概括来说，随机选择一个 `x`，然后遍历 `x⁰, x¹, …, x^r ≡ mod N`。如果我们运气好，那么 `r` 是偶数，即\
  \ `(x^(r/2))² ≡ 1 (mod N)`。这样我们就得到了 `1 mod N` 的一个非平凡平方根。\n\n###### 提示\n\n已经证明，我们运气好，即对于\
  \ `x² ≡ 1 (mod N)` 而言 `r` 是偶数的概率为 `½`。反之，如果运气不好，我们必须从头重复整个过程。然而，鉴于成功的概率很高，这在全局中并不重要。\n\
  \n现在，让我们使用精巧的 Python 库 `ProjectQ` 来运行这个算法。\n\n\n\n### ProjectQ 实现的秀尔算法\n\n`ProjectQ`\
  \ 是一个用于量子计算的开源平台，它使用斯特凡·博雷加德提出的电路^(³⁴)实现了秀尔算法。该电路使用了 `2n + 3` 个量子比特，其中 `n` 是要分解的数字\
  \ `N` 的位数。博雷加德的方法分为以下步骤：\n\n![../images/469026_1_En_8_Chapter/469026_1_En_8_Fig11_HTML.jpg](img/469026_1_En_8_Fig11_HTML.jpg)\
  \  \n图 8-11：用于周期查找的博雷加德量子电路\n\n1. 如果 `N` 是偶数，则返回因子 2。\n2. 通过经典计算确定 `N = p^q` 是否成立（其中\
  \ `p ≥ 1` 且 `q ≥ 2`），如果是，则返回因子 `p`（在经典计算机上，这可以在多项式时间内完成）。\n3. 选择一个随机数 `a`，满足 `1\
  \ < a ≤ N – 1`。使用欧几里得最大公约数算法，判断 `gcd(a, N) > 1` 是否成立。如果成立，则返回因子 `gcd(a, N)`。\n4.\
  \ 使用周期查找量子电路来找出 `a` 模 `N` 的阶 `r`。在量子计算机上，此步骤可在多项式时间内完成。\n5. 如果 `r` 是奇数，或者 `r` 是偶数但\
  \ `a^(r/2) = –1 (mod N)`，则返回步骤 3。否则，计算 `gcd(a^(r/2) – 1, N)` 和 `gcd(a^(r/2) + 1,\
  \ N)`。检验其中一项是否是 `N` 的非平凡因子，如果是，则返回该因子（在经典计算机上，这可以在多项式时间内完成）。\n\n博雷加德通过在傅里叶空间中使用一系列受控加法和乘法来实现周期查找，以求解\
  \ `f(x) = a^x (mod N) → a^r ≡ 1 mod N`（见图 8-11）：\n\n- 一个受控乘法器 `U[a]` 将 `|x⟩` 映射为\
  \ `|ax (mod N)⟩`，其中：\n  - `a` 是一个经典互质数，用作 `a^x (mod N)` 的底数。\n  - `x` 是量子寄存器。\n\
  \  - `c` 是控制量子比特的寄存器，使得当 `c = 1` 时 `U[a] = ax (mod N)`，否则保持 `x`。\n- 受控乘法器 `U[a]`\
  \ 进一步通过一系列双控模加法门实现，使得：\n  - 如果两个控制量子比特均为 `c1 = c2 = 1`，则输出为 `f(x) = |φ(a + b mod\
  \ N)⟩`，即在傅里叶空间中的 `a + b (mod N)`。注意，该门将两个数相加：一个互质数 (`a`) 和一个量子数 (`b`)。\n  - 如果任一控制量子比特\
  \ (`c1`, `c2`) 处于状态 `|0⟩`，则 `f(x) = |φ(b)⟩`。\n- 双控模加法门又建立在德雷珀的量子加法电路之上^(³⁵)。该电路在傅里叶空间中实现了一个经典值\
  \ (`a`) 与量子值 (`b`) 的加法。\n\n#### 使用 ProjectQ 进行因式分解\n\n让我们安装 `ProjectQ` 并测试该算法。首先要做的是使用\
  \ Python 包管理器下载并安装 `ProjectQ`（注意，为简单起见，我使用的是 Windows。Linux 用户可以遵循相同的步骤）：\n\n```\n\
  C:\\> pip install projectq\n```\n\n接下来，从 `ProjectQ` 的示例文件夹^(³⁶)或本书的源代码 `Workspace\\\
  Ch08\\p08-shor.py` 中获取 `shor.py` 脚本。然后，运行脚本并输入一个要分解的数字（参见代码清单 8-2）。\n\n```\nC:\\\
  >python shor.py\nNumber to factor: 21\nFactoring N = 21: ..........\nFactors found\
  \ : 7 * 3 = 21\nGate class counts:\nAllocateQubitGate : 166\nCCR : 1467\nCR : 7180\n\
  CSwapGate : 50\nCXGate : 200\nDeallocateQubitGate : 166\nHGate : 2600\nMeasureGate\
  \ : 11\nR : 608\nXGate : 206\nGate counts:\nAllocate : 166\nCCR(0.098174770425)\
  \ : 18\nCCR(0.196349540849) : 30\nCCR(0.392699081699) : 70\nCCR(0.490873852124)\
  \ : 18\nCCR(0.785398163397) : 80\nCCR(0.981747704246) : 38\nCCR(1.079922474671)\
  \ : 20\nCCR(1.178097245096) : 16\n...\nR(5.252350217719) : 1\nR(5.301437602932)\
  \ : 1\nR(5.497787143782) : 1\nX : 206\nMax. width (number of qubits) : 13.\n---\
  \ 5.834410190582275 seconds ---\nListing 8-2: Shor’s Algorithm by ProjectQ in Action\n\
  ```\n\n对于 `N = 21`，该脚本输出了一组非常有用的统计数据，例如：\n\n- **使用的量子比特数量**：给定 `N = 21`，我们需要 5 个比特；因此\
  \ `总量子比特数 = 2 * 5 + 3 = 13`。\n- **按类型划分的门的总数**：在本例中，双控门 `CCR = 1467`、`CR = 7180`、`CSwap\
  \ = 50`、`CX = 200`、`R = 608`、`X = 206` 等，总共有 12,646 个量子门。\n\n`ProjectQ` 使用博雷加德算法实现了量子周期查找，如代码清单\
  \ 8-3 所示：\n\n- `run_shor` 函数接受三个参数：\n  - `ProjectQ` 提供的量子引擎或模拟器，加上\n  - `N`：要分解的数字\n\
  \  - `a`：用作 `a^x mod N` 底数的互质数\n- 然后，函数从 `a = 0` 到 `a = ln(N)` 循环，量子输入寄存器 `x` 处于叠加态；接着对\
  \ `f(a) = a^x mod N` 执行量子电路，如图 8-11 所示。\n- 接下来，它根据先前的结果对 `x` 寄存器执行傅里叶采样，并进行测量。\n\
  - 最后，它将测量值求和为一个范围在 `[0,1]` 内的数字。然后使用连分数展开来返回分母，即潜在周期 (`r`)。\n\n```\ndef run_shor(eng,\
  \ N, a):\n    n = int(math.ceil(math.log(N, 2)))\n    x = eng.allocate_qureg(n)\n\
  \    X | x[0]\n    measurements = [0] * (2 * n)  # 将保存 2n 个测量结果\n    ctrl_qubit\
  \ = eng.allocate_qubit()\n    for k in range(2 * n):\n        current_a = pow(a,\
  \ 1 << (2 * n - k - 1), N)\n        # 受控乘法：a^(2^(2n-k-1)) 模 N\n        for i in\
  \ range(k):\n            if measurements[i]:\n                R(-math.pi/(1 << (k\
  \ - i))) | ctrl_qubit\n        H | ctrl_qubit\n        # 并进行测量\n        Measure\
  \ | ctrl_qubit\n        eng.flush()\n        measurements[k] = int(ctrl_qubit)\n\
  \        if measurements[k]:\n            X | ctrl_qubit\n    Measure | x\n    #\
  \ 将测量值转换为 [0,1) 区间内的数字\n    y = sum([(measurements[2 * n - 1 - i]*1. / (1 << (i\
  \ + 1)))\n             for i in range(2 * n)])\n    # 使用连分数展开得到分母（周期？）\n    r =\
  \ Fraction(y).limit_denominator(N-1).denominator\n    # 返回（潜在）周期\n    return r\n\
  Listing 8-3: ProjectQ Period Finding Quantum Subroutine\n```\n\n下一节将针对不同的 `N` 值编译一组因式分解结果。\n\
  \n\n\n#### 模拟结果\n\nProjectQ 的周期查找子程序是在经典计算机上对量子电路进行模拟，因此用它来分解大数并不实际。事实上，在个人电脑上，它无法在合理时间内分解超过四位的数字。表\
  \ 8-3 展示了从我笔记本电脑上收集的、针对不同 `N` 值的一组结果，数值最高达 2491。\n\n**表 8-3** 针对不同 `N` 值的因式分解结果\n\
  \n| 数字 (`N`) | 量子比特 | 时间 (秒) | 内存 (MB) | 量子门计数 |\n| --- | --- | --- | --- | ---\
  \ |\n| 15 | 11 | 2.44 | 50 | `CCR = 792` `CR = 3186` `CSwap = 32` `CX = 128` `H\
  \ = 1408` `R = 320` `X = 130` `Measure = 9` |\n| 105 | 17 | 27.74 | 200 | `CCR =\
  \ 3735` `CR = 25062` `CSwap = 98` `CX = 392` `H = 6666` `R = 1568` `X = 393` `Measure\
  \ = 15` |\n| 1150 | 25 | 17542.12 (4.8 小时) | 500 | `CCR = 15366` `CR = 139382` `CSwap\
  \ = 242` `CX = 968` `H = 24222` `R = 5829` `X = 981` `Measure = 23` |\n| 2491 |\
  \ 27 | 246164.74 (68.3 小时) | 2048 | `CCR = 20601` `CR = 194670` `CSwap = 288` `CX\
  \ = 1152` `H = 31126` `R = 7509` `X = 1166` `Measure = 25` |\n\n在一台配备 2.6 GHz Intel\
  \ Core i-5 CPU 和 16 GB RAM 的 64 位 Windows 7 PC 上，分解四位数 2491 耗时超过 68 小时。我尝试更进一步，试图分解\
  \ `N = 8122`，但在一周后放弃了。总而言之，这些结果表明，对于较小的 `N` 值，该算法可以成功模拟；然而，它需要在真实的量子计算机上实现，才能检验其真正的能力。\n\
  \n本章以两种算法作为结尾，这两种算法激发了人们对实用量子计算可能性的热情：Grover 算法，一种非结构化量子搜索方法，能够以平均 `sqrt(N)` 步找到输入。这远优于最佳经典方案平均\
  \ `N/2` 步的性能。预计未来所有的网络搜索都将由 Grover 算法执行。\n\nShor 算法用于在量子计算机中进行因式分解，专家称该算法可能使当前的非对称密码学陷入瘫痪。Shor\
  \ 算法可以说是目前最著名的量子算法，它通过提供比最佳经典方案指数级的加速，生动地展现了量子计算的能力。\n\n最后，我想总结一下，我已经尽力通过融合数学、软件以及尽可能多的图表来阐释量子计算的复杂概念。写这本书稿的过程中，我喝掉了无数杯咖啡，度过了无数个不眠之夜，更不用说，我认为书中的大部分数学内容和你一样令人困惑。希望你喜欢阅读这本书，就像我喜欢写它一样，并且请记住：伟大的物理学家理查德·费曼曾说过：“如果有人声称他理解量子力学，那恰恰说明他不理解量子力学。”\n\
