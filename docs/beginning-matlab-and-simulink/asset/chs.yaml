  \ 2 章中讨论。\n\n## 关闭 MATLAB 窗口\n\n退出 MATLAB 非常简单。有几个命令可用于完成 MATLAB 中的工作并关闭其所有窗口。您可以输入\
  \ `>> quit` 或 `>> exit`，或使用键盘快捷键 `Ctrl+Q`。您也可以单击主 MATLAB 窗口左上角的 X，或者从命令窗口调用 `>>\
  \ finishdlg` 函数。\n\n请注意，退出/关闭 MATLAB 时，工作区中的所有变量都将被清除。默认情况下，下次启动 MATLAB 时，它们将丢失且无法恢复。但是，它们可以保存到\
  \ `*.mat` 文件中，然后重新加载到工作区。输入命令的命令历史记录会自动保存，下次启动 MATLAB 时，可以访问在命令窗口中输入的所有命令。如果您有兴趣更改可通过\
  \ MATLAB 首选项调整的命令数量，请选择“首选项”➤“命令历史记录”。\n\n## 总结\n\n本章介绍了 MATLAB 环境，包括其设置、变量、常用命令以及\
  \ M 文件/MLX 文件 GUI 工具。您还学习了如何从命令窗口分配变量和值，以及在 M/MLX 文件编辑器窗口中工作。此外，本章探讨了数据类型、格式和结构，并涵盖了如何使用内置\
  \ MATLAB 命令和函数。特别地，它涵盖了帮助搜索选项和最常用的命令，包括 `help`、`helpwin`、`helpbrowser`、`doc`、`lookfor`、`clear`、`clear\
  \ all`、`dir`、`pwd`、`cd`、`ls`、`save`、`load`、`clearvars`、`edit`、`format`、`char`、`size`、`who`、`whos`、`input`、`what`\
  \ 和 `exit/quit`。\n\n## 自测练习\n\n### 练习 1\n\n执行以下操作：\n\n1. 从预装的 MATLAB 演示中找到*振动徽标*演示并运行它。提示：`membrane`。\n\
