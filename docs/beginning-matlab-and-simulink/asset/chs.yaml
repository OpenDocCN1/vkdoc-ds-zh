  >> Acell{1,3}=Ach1Tab  % 元胞 (1, 3) 被填入 Ach1Tab\nAcell =\n3×4 元胞数组\n{[      13]}\
  \    {3×3 double}    {3×3 table }    {0×0 double}\n{0×0 double}    {0×0 double}\
  \    {0×0 double}    {0×0 double}\n{0×0 double}    {0×0 double}    {0×0 double}\
  \    {0×0 double}\n>> C1 = 'matlab';\n>> Acell{1,4}=C1  % 元胞 (1, 4) 被填入 C1\nAcell\
  \ =\n3×4 元胞数组\n{[      13]}    {3×3 double}    {3×3 table }    {'matlab'  }\n{0×0\
  \ double}    {0×0 double}    {0×0 double}    {0×0 double}\n{0×0 double}    {0×0\
  \ double}    {0×0 double}    {0×0 double}\n>> D1 = A1new>3 & A1new> Acell{2,2}=D1\
  \  % 元胞 (2, 2) 被填入 D1 逻辑数组\nAcell =\n3×4 元胞数组\n{[      13]}    {3×3 double }   \
  \ {3×3 table }    {'matlab'  }\n{0×0 double}    {3×3 logical}    {0×0 double}  \
  \  {0×0 double}\n{0×0 double}    {0×0 double }    {0×0 double}    {0×0 double}\n\
  >> f=@(x, a1, a2, a3)(a1*x²+a2*x+a3);\n>> Acell{2,3}=f  % 元胞 (2, 3) 被填入 f 函数句柄\n\
  Acell =\n3×4 元胞数组\n{[      13]}    {3×3 double }    {3×3 table      }    {'matlab'\
  \  }\n{0×0 double}    {3×3 logical}    {function_handle}    {0×0 double}\n{0×0 double}\
  \    {0×0 double }    {0×0 double     }    {0×0 double}\n>> Acell{3,1}= 'This is\
  \ a cell array' % 向元胞数组输入字符串：元胞 (3, 1)\nAcell =\n3×4 元胞数组\n{[                13]}\
  \    {3×3 double }    {3×3 table      }       {'matlab'  }\n{0×0 double        \
  \  }    {3×3 logical}    {function_handle}       {0×0 double}\n{'This is a cell\
  \ ...'}    {0×0 double }    {0×0 double     }       {0×0 double}\n>> Acell{3,2}=rand(5,6)\
  \ % 向元胞数组输入数值数组：元胞 (3,2)\nAcell =\n3×4 元胞数组\n{[               13]}    {3×3 double\
  \ }    {3×3 table      }    {'matlab'  }\n{0×0 double         }    {3×3 logical}\
  \    {function_handle}    {0×0 double}\n{'This is a cell ...'}    {5×6 double }\
  \    {0×0 double     }    {0×0 double}\n```\n\n要访问和查看元胞数组的内容，请使用以下命令。\n\n```\n>>\
  \ Acell{1,1}\nans =\n13>> Acell{1,4}\nans =\n'matlab'\n>> Acell{2,3}\nans =\nfunction_handle\
  \ with value:\n@(x,a1,a2,a3)(a1*x²+a2*x+a3)>> Acell{7}\nans =\n3×3 表格\na    b  \
  \  c\n_    _    _\n1    2    3\n3    4    5\n7    8    9\n>> Acell{8}\nans =\nfunction_handle\
  \ with value:\n@(x,a1,a2,a3)(a1*x²+a2*x+a3)\n```\n\n在工作区中双击元胞变量名，可以查看元胞的内容，如图 1-14\
  \ 所示。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig14_HTML.jpg](img/471979_1_En_1_Fig14_HTML.jpg)\n\
  \n**图 1-14** 工作区中的变量及 `Acell` 元胞数组的内容\n\n你可以通过双击每个元胞并输入新值来更改元胞数组的内容。\n\n\n\n# 结构数组\n\
  \n结构数组可以容纳所有先前创建的数组和条目（变量）类型，即所有类型的数值、逻辑值、字符、表格、元胞数组和函数句柄。它们不仅可以存储不同类型的数据，还可以存储不同大小的数据。结构数组的一个重要方面是它们适合代码生成。此外，它们在编程、数据处理、数据采集以及从\
  \ Simulink 模型读取数据中非常有用。\n\n结构数组将数据存储在不同的字段或字段名称中，你可以通过名称来访问这些字段。例如：\n\n```\n% 人员\
  \ 1：姓名 - SE；出生日期 - 1982 年 6 月 6 日；职业 - 教授\nWHO(1).Name = 'SE';\nWHO(1).DOB = '06.06.1982';\n\
  WHO(1).Profession = '教授';\n% 人员 2：姓名 - NE；出生日期 - 1992 年 12 月 12 日；职业 - 设计师\nWHO(2).Name\
  \ = 'NE';\nWHO(2).DOB = '12.12.1982';\nWHO(2).Profession = '设计师';\n```\n\n结构变量 `WHO`\
  \ 包含两个人的信息。数据包含他们的姓名、出生日期和职业。\n\n```\n>>WHO =\n1×2 struct array with fields:\n \
  \   Name\n    DOB\n    Profession\n>> WHO(1)\nans =\n  struct with fields:\n   \
  \ Name: 'SE'\n    DOB: '06.06.1982'\n    Profession: '教授'\n>> WHO(2)\nans =\n  struct\
  \ with fields:\n    Name: 'NE'\n    DOB: '12.12.1982'\n    Profession: '设计师'\n```\n\
  \n请注意，我们只保存了一个结构数组形式的变量。如果你想要访问所创建结构的特定字段，可以调用该字段名称以及结构名称：\n\n```\n>> WHO(1).Name\
  \   % 访问人员 1 的姓名字段\nans =\n'SE'\n>> WHO(1).Profession   % 访问人员 1 的职业字段\nans =\n\
  '教授'\n>> WHO(2).DOB    % 访问人员 2 的出生日期字段\nans =\n'12.12.1982'\n```\n\n除了这种创建结构数组的方法之外，还有几种其他设置或创建它们的方法。让我们看一些示例。另一种方法是使用\
  \ `struct()` 命令创建一个空结构。空结构将使用 `struct('FieldName', VALUE)` 命令语法填充变量。请注意，字段名称（变量名称）不能包含空格或符号，但下划线符号\
  \ `_` 除外。\n\n```\n>>  Astr1 = struct()\nAstr1 =\n  struct with no fields.\n>> %\
  \ 现在我们可以在创建的空结构 Astr1 内部赋值/设置值和数据字段。\n>> a = 2.1; A = [1, 2; 3, 4]; B = A> D = 'mathworks.com';\n\
  >> F = table(magic(3));\n>>  Astr1 = struct('Number', a, 'Matrix', A, 'Logic', B,\
  \ 'F_Handle', f, 'Cell', C, 'Char', D, 'Table', F)\nAstr1 =\n  1×2 struct array\
  \ with fields:\n    Number\n    Matrix\n    Logic\n    F_Handle\n    Cell\n    Char\n\
  \    Table\n```\n\n创建结构数组的另一种方法是单独指定它们的字段，如开头创建结构变量 `WHO` 的示例所示。\n\n```\n>> Bstr.Number\
  \ = a; Bstr.Matrix = A; Bstr.Logic = B; Bstr.F_Handle=f; Bstr.Cell=C; Bstr.Char\
  \ = D;\n>> Bstr.Table = F;\n>> Bstr\nBstr =\n  struct with fields:\n    Number:\
  \ 2.1000e+00\n    Matrix: [2×2 double]\n    Logic: [2×2 logical]\n    F_Handle:\
  \ @(x)(a*x²+x-a)\n    Cell: {[3×3 double]  'matlab'}\n    Char: 'mathworks.com'\n\
  \    Table: [3×1 table]\n```\n\n现在我们可以比较我们创建结构变量 `Astr` 和 `Bstr` 的两种不同方式。创建结构数组的另一种方法是转换；换句话说，你可以使用\
  \ `cell2struct()` 和 `table2struct()` 命令将现有的元胞类型变量或表格类型变量转换为结构类型变量。\n\n```\n>> %\
  \ 元胞变量 C 包含：矩阵 C 和字符串 'matlab'\n>> C{1} =rand(3); C{2} = 'matlab';\n>> F_Names =\
  \ {'Matrix', 'Char'};    % 字段名称/标题\n>> Cstr = cell2struct(C, Headers, 2) % 2 表示嵌入的两个元胞\n\
  Cstr =\n  struct with fields:\n    Matrix: [3×3 double]\n    Char: 'matlab'\n```\n\
  \n现在让我们看看如何使用 `table2struct()` 命令将表格数组转换为结构数组。\n\n```\n>> F = table(magic(3));\n\
  >> Dstr = table2struct(F)\nDstr =\n  3×1 struct array with fields:\n    Var1\n```\n\
  \n图 1-15 显示了工作区中保存的变量列表以及 `Astr` 和 `Bstr` 结构数组的内容。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig15_HTML.jpg](img/471979_1_En_1_Fig15_HTML.jpg)\n\
  \n**图 1-15**\n\n创建的变量以及 `Astr` 和 `Bstr` 结构数组\n\n本节通过示例演示了如何创建七种不同类型的变量（数组）——数值数组（标量和数组类型变量）、字符串、逻辑数组、表格数组、元胞数组和结构数组以及函数句柄。你可以使用\
  \ `clear` 或 `clearvars` 命令，或使用鼠标右键选项和“删除”从工作区中移除任何已创建的变量。在命令窗口中，你可以使用以下命令从工作区中清除变量。\n\
  \n```\n>> clearvars a A  B% 移除变量 a, A, B\n>> clear ans C D % 移除变量 ans, C, D\n```\n\
  \n根据工作区中变量的属性（参见图 1-12），你可以确定变量类型（标量、数组、逻辑值、表格、元胞、结构、字符或函数句柄）及其存储类型（`double`、`single`、`uint8`\
  \ 或 `int8`）。此外，图 1-15 中显示的表示每个变量的符号展示了图 1-9 中所示的一些 MATLAB 支持的数据（数组）集。\n\n必须注意的是，正如你在一些示例中看到的，许多这些数组可以从一种类型转换为另一种类型。例如，可以通过\
  \ `cell2table()` 函数将元胞数组转换为表格数组，类似地，可以通过 `struct2table()` 将结构数组转换为表格数组。表格数组可以分别通过\
  \ `table2cell()` 和 `table2struct()` 转换为元胞数组和表格数组。\n\n# 复数\n\n两个字母——`i` 和 `j` 或 `1i`\
  \ 和 `1j`——被保留用于表示虚数。因此，建议不要使用这些字母来指定变量名称。赋值的另一种方法是将它们乘以 `sqrt(-1)`。\n\n# 精度\n\n\
  MATLAB 的精度并非绝对。\n\n例如：\n\n```\n>> sin(pi)\nans =\n   1.2246e-016\n```\n\n在 MATLAB\
  \ 中，`sin(π)` 不等于 0。这是因为数字 `π` 在 MATLAB 中由双精度数表示。我们可以通过执行勾股定理 `1 = sin²(t) + cos²(t)`\
  \ 的计算来演示精度问题。\n\n```\nt=0:pi/50:2*pi; F=1-(sin(t).²+cos(t).²); plot(t, F)\n```\n\
  \n在这些表达式中，`t` 是一个包含一行元素的时间向量，例如 `[0, π/50, ... 2π]`。`F` 的某些值为零，某些值非零，尽管它们是非常小的数字。其原因是所有三角函数，包括指数函数和对数函数，都由一个仅包含自变量（在此示例中为\
  \ `t`）奇次幂的 13 次多项式近似。例如，`sin(t) ≈ t − c[1]t³ + c[2]t⁵ + ... + c[6]t¹³ = p(t)`。所有这些函数的计算算法都是基于\
  \ `fdlibm` 实现的，`fdlibm` 是由 Sun Microsystems 的 K. C. Ng 等人开发的“可自由分发的数学库”（有关更多信息，请参阅\
  \ [`www.netlib.org/fdlibm`](http://www.netlib.org/fdlibm)）。\n\n必须注意的是，MATLAB 的精度级别取决于用于保存数据的数据存储类型。例如：\n\
  \n```\n>> int8(128)*-5\nans =\n\n```\n\n分配的数据存储 `int8` 最多可以容纳 `2⁸ − 1` 个整数。所有 MATLAB\
  \ 支持的数据存储类型如图 1-15 所示。\n\n\n\n# M 文件与 MLX 文件编辑器\n\n在本书中，代码、脚本和程序这些术语可互换使用，均指代扩展名为\
  \ `.m` 的 M 文件和扩展名为 `.mlx` 的 MLX 文件，包括函数文件和可执行文件。由于扩展名，这些文件被称为 M 文件和 MLX 文件。在前面的示例中，所有操作和工作均在命令窗口中完成。然而，对于编程和编写、编辑与调试而言，M\
  \ 文件和 MLX 文件编辑器将大有裨益，因为它们提供了有用的工具和提示，有助于编写快速且更高效的代码/脚本/程序。\n\nM 文件和 MLX 文件的整体功能相似，但有一个重要区别。MLX\
  \ 文件编辑器窗口可以在 MLX 编辑器窗口内显示计算/仿真的输出，并在其左侧输出窗口中指示最常见的命令语法相关错误。M 文件编辑器则在 M 文件执行后，在命令窗口中显示所有错误。此外，MLX\
  \ 文件编辑器可以通过公式编辑器交互式地显示所有插入的公式；插入的图像和超链接文本直接显示在同一窗口中。两个文件的输出都将显示在工作区中。这两个文件可以互换使用。下面我们开始审视\
  \ M 文件和 MLX 文件编辑器的窗口和工具。\n\n## M 文件编辑器\n\nM 文件编辑器窗口的菜单和 GUI 工具分为三个选项卡：编辑器、发布和视图，分别如图\
  \ 1-16、1-17 和 1-18 所示。注意，有三个主要菜单子分组——主页、绘图和应用程序——属于主 MATLAB 窗口，已在前面章节中展示。\n\n在 M\
  \ 文件编辑器的主工具菜单（见图 1-16）中，有五个子部分：文件、导航、编辑、断点和运行。每个子部分中的所有工具都非常直观。例如，文件子部分拥有用于创建新文件或打开现有文件、保存当前文件、查找\
  \ M 文件、比较同名 M 文件的不同版本以及打印当前 M 文件的 GUI 工具。类似地，导航子部分工具帮助用户在当前文件中移动光标、查找关键字，并在必要时将其替换为其他词语。编辑子部分工具允许你在当前文件中插入新节、添加或删除注释行、包装注释以及添加缩进以使文件更具可读性。断点子部分使你能够调试/编辑当前\
  \ M 文件代码。最后，运行子部分拥有用于逐步运行当前 M 文件的不同单元、运行当前 M 文件并测量文件不同部分评估时间的 GUI 工具。值得注意的是，在编写\
  \ M 文件时，主要使用编辑器窗口工具。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig16_HTML.jpg](img/471979_1_En_1_Fig16_HTML.jpg)\n\
  \n图 1-16\nM 文件编辑器的主工具菜单\n\n图 1-17 所示的发布工具用于生成不同文件格式的报告文件，例如 HTML、DOC、PPT 等。发布窗口的\
  \ GUI 工具非常直观，与许多文档编辑软件应用程序相似。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig17_HTML.jpg](img/471979_1_En_1_Fig17_HTML.jpg)\n\
  \n图 1-17\nM 文件编辑器的发布工具菜单\n\n图 1-18 所示的视图工具用于在一个窗口区域内显示多个 M 文件和 MLX 文件（文档）窗口。你可以通过使用名为平铺、文档选项卡或拆分文档的\
  \ GUI 工具，并排或上下拆分视图。显示子部分中的勾选选项非常方便，可以在编辑 M 文件时显示数据提示、显示行号并高亮当前行。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig18_HTML.jpg](img/471979_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18\nM 文件编辑器的视图工具菜单\n\n## MLX 文件编辑器\n\nMLX 文件（实时编辑器）编辑器选项卡（如图 1-19、1-20 和 1-21\
  \ 所示）包含许多 M 文件编辑器的工具以及若干其他不同的 GUI 工具。实时编辑器选项卡（见图 1-19）有一个与 M 文件编辑器不同的主要子部分，称为文本，它包含了\
  \ M 文件编辑器中发布工具的大部分功能。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig19_HTML.jpg](img/471979_1_En_1_Fig19_HTML.jpg)\n\
  \n图 1-19\nMLX 文件编辑器的主工具菜单\n\n此外，MLX 编辑器的插入选项卡（见图 1-20）拥有一些非常方便的工具，可以直接在 MLX 文件中编写/编辑公式，并插入带注释的子节。你可以在当前\
  \ MLX 文件内容中插入控制 GUI 工具，例如滑块和下拉框。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig20_HTML.jpg](img/471979_1_En_1_Fig20_HTML.jpg)\n\
  \n图 1-20\nMLX 文件编辑器的插入菜单\n\nMLX 编辑器的视图窗口（如图 1-21 所示）拥有一些与 M 文件编辑器视图相似的工具，以及其他一些工具，例如文档选项卡、显示、输出和布局，通过这些工具，用户可以显示脚本（代码）行号（不包括注释行）、数据提示、全屏视图、清理输出以及显示或隐藏输出。\n\
  \n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig21_HTML.jpg](img/471979_1_En_1_Fig21_HTML.jpg)\n\
  \n图 1-21\nMLX 文件编辑器的视图工具菜单\n\nM 文件和 MLX 文件可以通过多种不同方式创建——使用 GUI 按钮 ![../images/471979_1_En_1_Chapter/471979_1_En_1_Figo_HTML.jpg](img/471979_1_En_1_Figo_HTML.jpg)\
  \ 或 ![../images/471979_1_En_1_Chapter/471979_1_En_1_Figp_HTML.jpg](img/471979_1_En_1_Figp_HTML.jpg)\
  \ ，或在命令窗口中键入命令。\n\n为了演示 M 文件编辑器和 MLX 文件编辑器的某些突出工具和选项，我们来看下面这个示例，通过勾股定理来演示 MATLAB\
  \ 的精度并非绝对。\n\n示例：![$$ \\alpha =-\\frac{\\pi }{2}\\dots \\frac{\\pi }{2},\\Delta\
  \ \\alpha =\\frac{\\pi }{100};F\\left(\\alpha \\right)=1-\\left({\\sin}²\\alpha\
  \ +{\\cos}²\\alpha \\right); $$](img/471979_1_En_1_Chapter_TeX_IEq1.png)\n\n首先，这个简单示例的解决方案脚本将在\
  \ M 文件编辑器中创建，并发布结果。随后，所有仿真都将在 MLX 编辑器中进行，以展示两个编辑器的相似和不同之处。\n\n解决此练习的算法由以下六个步骤组成。\n\
  \n1.  插入一些描述给定问题陈述的注释。\n\n2.  定义输入变量：![$$ \\alpha =-\\frac{\\pi }{2}\\dots \\frac{\\\
  pi }{2},\\Delta \\alpha =\\frac{\\pi }{100}; $$](img/471979_1_En_1_Chapter_TeX_IEq2.png)。\n\
  \n3.  执行计算：`F(α) = 1 − (sin²α + cos²α)`。\n\n4.  定义对于输入变量 `α` 的哪些值，函数 `F(α)` 的值等于\
  \ 0。\n\n5.  绘制仿真结果：`α` 与 `F(α)` 的关系图。\n\n6.  发布所有获得的结果，包括整个脚本。\n\n这是直接在 M 文件编辑器中编写的脚本。\n\
  \n\n\n```matlab\n% 第 1 步：问题陈述\n% MATLAB 的精度并非绝对。\n% 勾股定理：F = 1 - (sin² (alpha) +\
  \ cos²(alpha));\n% 输入变量：alpha = -0.5*pi ... 0.5*pi\n% 第 2 步：定义输入变量\nalpha = -pi/2:pi/100:pi/2;\n\
  % 第 3 步：执行计算\nF = 1-(sin(alpha).²+cos(alpha).²);\n% 第 4 步：定义 F(alpha) = 0 所对应的 alpha\
  \ 值\nFindex=find(F==0);\nF0=F(Findex);\n% 第 5 步：绘制仿真结果：alpha 与 F(alpha)的关系图\nplot(alpha,\
  \ F, 'b-', alpha(Findex), F0, 'ro'),\nlegend('\\alpha vs F(\\alpha)', 'F(\\alpha)\
  \ = 0')\ntitle('基于勾股定理的 MATLAB 精度仿真'), grid on\nxlabel('\\alpha'), ylabel('F(\\\
  alpha) = 1-(sin(\\alpha)²+cos(\\alpha)²)')\n% 第 6 步：发布包括整个脚本在内的所有获得结果\n```\n\n请注意，在本脚本中，我们使用\
  \ `%` 插入注释（非可执行信息），并使用 `\\` 插入和显示希腊字母。\n\n### % 注释\n\n注释不可执行，旨在为用户提供额外信息。`%` 符号用于在\
  \ M 文件和 MLX 文件中放置注释、备注或任何附加信息。注释可以单独成行，也可以放在命令语法之后，只要以 `%` 开头即可。使用双百分号（`%%`）后跟一个空格，会自动使后续的注释文本变为粗体。此外，在一行开头插入\
  \ `%%` 并留一个空格后，会在脚本中创建一个单元格模式。我们将在第 2 章中详细讨论单元格模式的选项和优势。请注意，`%` 符号还有其他几个功能。它可用于格式化写入、显示、读取时的规格说明，我们将在第\
  \ 2 章中讨论。\n\n以下内容已使用 PUBLISH 工具进行了轻微编辑，例如使用粗体（![../images/471979_1_En_1_Chapter/471979_1_En_1_Figq_HTML.jpg](img/471979_1_En_1_Figq_HTML.jpg)\
