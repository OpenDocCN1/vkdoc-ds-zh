  \n该软件包有各种应用领域，例如：车辆性能等各类系统的仿真、人类基因组图谱绘制、新兴经济体的金融分析、诊断和治疗微小生物的微生物学应用、按比例缩小的实验室模型中的大型船舶动态仿真、下一代网络音频产品的仿真、用于本科生计算机编程教学并与实时实验室测试和测量相结合、以及水下考古和地质学的图像处理。\n\
