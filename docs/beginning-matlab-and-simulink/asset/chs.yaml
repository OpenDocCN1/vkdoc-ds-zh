  M/MLX 编辑器兼容大多数常见的 LaTEX 数学模式命令。兼容 LaTEX 的数学命令和符号可用于插入绘图标题、坐标轴标签、图形注释等，这些内容将在后续章节（编程、绘图和常微分方程）的示例中讨论。例如，要插入表达式：`x²\
