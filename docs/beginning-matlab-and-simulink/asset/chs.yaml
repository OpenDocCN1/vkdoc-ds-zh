  \n\n\n### 注意事项\n\n在调用/执行函数文件时，输出变量名和输入参数名可以更改。这不会引起任何错误。这是函数文件相较于 M 文件的一个有用特性。\n\
  \n1.  需要四个代表 `t1`、`t2`、`t3` 和 `t4` 的输入参数，以及九个代表 `f1`、`f2`、`f3`、`f4`、`t_all`、`t1`、`t2`、`t3`\
  \ 和 `tD4` 的输出变量。\n\n```\n>> clearvars\nt1 = -20:.0025:-13; t2=-12.999:.005:-3; t3=-2.999:.002:3;\
  \ t4 = 3.001:5e-3:6;\n>> [f1, f2, f3, f4, T_all, time1, time2, time3, time4]=Ex8Var(t1,\
  \ t2, t3, t4);\n>> whos\nName       Size              Bytes  Class     Attributes\n\
  T_all      1x8401            67208  double\nf1         1x2801            22408 \
  \ double\nf2         1x2000            16000  double\nf3         1x3000        \
  \    24000  double\nf4         1x600              4800  double\nt1         1x2801\
  \            22408  double\nt2         1x2000            16000  double\nt3     \
  \    1x3000            24000  double\nt4         1x600              4800  double\n\
  time1      1x2801            22408  double\ntime2      1x2000            16000 \
  \ double\ntime3      1x3000            24000  double\ntime4      1x600         \
  \     4800  double\n```\n\n所有请求的输出变量都会出现在工作区中，同时还会显示如图第一个案例所示的图形。此外，需要注意的是，输入条目\
  \ `t1`、`t2`、`t3` 和 `t4` 分别与输出变量 `time1`、`time2`、`time3` 和 `time4` 相匹配。\n\n1.  需要在没有任何输入参数的情况下，获取九个代表\
  \ `f1`、`f2`、`f3`、`f4`、`t_all`、`t1`、`t2`、`t3` 和 `t4` 的输出变量。\n\n```\n>> clearvars\n\
  >> [f1, f2, f3, f4, T_all, time1, time2, time3, time4]=Ex7Var();\n>> whos\nName\
  \       Size                Bytes  Class     Attributes\nT_all      1x26001    \
  \        208008  double\nf1         1x7001              56008  double\nf2      \
  \   1x10000             80000  double\nf3         1x6000              48000  double\n\
  f4         1x3000              24000  double\ntime1      1x7001              56008\
  \  double\ntime2      1x10000             80000  double\ntime3      1x6000     \
  \         48000  double\ntime4      1x3000              24000  double\n```\n\n在没有输入参数且只有九个输出变量的情况下，函数文件会在工作区中产生九个输出变量，并使用指定的输出变量名。这是通过使用\
  \ `t[1]`、`t[2]`、`t[3]`、`t[4]` 的默认设置值以及生成（如第一个案例所示的）图形来实现的。\n\n1.  使用一个输入参数 `t` 和十个输出：\n\
  \n```\n>> clearvars\n>> tall=-20:.001:6;\n>> [f1, f2, f3, f4, T_all, time1, time2,\
  \ time3, time4, T_all]=Ex7Var(tall);\nAsked  10 outputs are beyond the set outputs\
  \ !!!\nOne or more output arguments not assigned during call to \"varargout\". >>\
  \ whos\nName      Size                Bytes  Class     Attributes\ntall      1x26001\
  \            208008  double\n```\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figcf_HTML.jpg](img/471979_1_En_2_Figcf_HTML.jpg)\n\
  \n第十个输出变量超出了已分配输出变量的数量。因此，函数文件除了显示两条警告信息、警告对话框以及图形外，不会在工作区产生任何输出变量。\n\n还有很多其他可能的情景来测试此函数文件的健壮性。在本练习的预定义条件下（尤其是输入参数方面），此函数文件的健壮性相当高。但还有一些其他情况，由于\
  \ `t` 或 `t[1]`、`t[2]`、`t[3]`、`t[4]` 的条目选择不准确，可能导致此函数文件的结果不准确。例如，为 `t` 提供的一个输入可能只包含一个行向量或列向量的两个元素（如\
  \ [-20, 6]）。类似地，`t[1]`、`t[2]`、`t[3]`、`t[4]` 的条目也可能是 [-20, -13]、[-12.999, -3]、[-2.999,\
  \ 3]、[3.001, 6]。为了提高此函数文件的健壮性，你可以使用 MATLAB 内置的工具/运算符 `nargchk` 以及 `nargin` 来验证允许的输入参数数量。同样，另一个内置工具/运算符\
  \ `nargoutchk` 可以与 `nargout` 一起使用，以验证已定义的输出变量数量。\n\n## 函数文件的嵌套函数与子函数\n\n函数文件可以包含一个或多个执行特定计算和分析的嵌套函数（子函数）。这类函数文件的通用语法如下：\n\
  \n```\nfunction [Output1, Output2, Output3, ...] = MAIN(In1, In2, In3, ...)\n% MAIN.m\
  \ 包含多个嵌套的子函数\nOutput1 = Nest1;\nOutput2 = Nest2;\nOutput3 = Nest3;\n...\nfunction\
  \ Out1Nest1()\nOut1 = [执行某些操作]\nend\nfunction Out2=Nest2(In2)\nOut2 = [执行某些操作]\n\
  end\nfunction Out3=Nest3(In3)\nOut3 = [执行某些操作]\nend\n```\n\n我们来看几个在函数文件中使用嵌套函数的示例。\n\
  \n### 示例 8\n\n本示例在三个嵌套函数中生成了三个不同的方阵（Pascal 矩阵、Cauchy 矩阵和 Krylov 矩阵），这些方阵与主函数的输入参数（仅限整数）相关。请注意，输入参数定义了输出矩阵的大小。\n\
  \n以下是解决方案脚本；它是一个名为 `Ex8_MAIN` 的函数文件：\n\n```\nfunction [Output1,Output2, Output3]\
  \ = Ex8_MAIN(In1,In2, In3)\n% Ex8_MAIN.m 在三个嵌套函数中生成三个方阵\n%   输入参数: In1, In2, In3\
  \ 是定义输出矩阵大小的整数。\n%   Nest1 生成帕斯卡（Pascal）方阵\n%   Nest2 生成柯西（Cauchy）方阵\n%   Nest3\
  \ 生成克雷洛夫（Krylov）方阵\ndisp(['这是一个 ' num2str(In1) ' 乘 ' num2str(In1) ' 的 Pascal 矩阵'])\n\
  Output1 = Nest1; disp(Output1)\ndisp(['这是一个 ' num2str(In2) ' 乘 ' num2str(In2) '\
  \ 的 Cauchy 矩阵'])\nOutput2 = Nest2; disp(Output2)\ndisp(['这是一个 ' num2str(In3) ' 乘\
  \ ' num2str(In3) ' 的 Krylov 矩阵'])\nOutput3 = Nest3; disp(Output3)\nfunction Out1=Nest1()\n\
  %   Nest1 生成帕斯卡方阵\nOut1 = pascal(In1);\nend\nfunction Out2=Nest2()\n%   Nest2 生成柯西方阵\n\
  Out2 = gallery('cauchy',In2);\nend\nfunction Out3=Nest3()\n%   Nest3 生成克雷洛夫方阵\n\
  Out3 = gallery('krylov',In3);\nend\nend\n```\n\n现在，我们来测试这个包含三个嵌套函数的函数文件。\n\n```\n\
  >> Input1 = 2; Input2=3; Input3=4;\n>> [Output1,Output2, Output3] = Ex8_MAIN(Input1,Input2,\
  \ Input3);\n这是一个 2 乘 2 的 Pascal 矩阵\n1     1\n1     2\n这是一个 3 乘 3 的 Cauchy 矩阵\n0.5000\
  \    0.3333    0.2500\n0.3333    0.2500    0.2000\n0.2500    0.2000    0.1667\n\
  这是一个 4 乘 4 的 Krylov 矩阵\n1.0000    0.6731    3.8494   -2.7613\n1.0000    1.7986 \
  \   2.3591    4.8361\n1.0000   -0.8049    1.0833   -0.5926\n1.0000    1.7760   -1.1635\
  \    1.2842\n>> whos\nName         Size            Bytes  Class     Attributes\n\
  Input1       1x1                 8  double\nInput2       1x1                 8 \
  \ double\nInput3       1x1                 8  double\nOutput1      2x2         \
  \       32  double\nOutput2      3x3                72  double\nOutput3      4x4\
  \               128  double\n```\n\n## M 文件中的函数文件\n\n在最新版本的 MATLAB 中，函数文件（包括嵌套函数和子函数）也可以用在\
  \ M 文件中。这使得计算过程更高效，并节省了工作区中的内存空间。请看下面的示例。\n\n\n\n### 示例 9\n\n给定 `y(x, t) = y[0]\
  \ sin(kx - ωt)`，这是波动方程的解，其中 `k = 2π / λ` 为波数，`ω = 2πf` 为角频率，`λ` 为波长。\n\n编写一个包含两个嵌套函数的\
  \ M 文件，用于计算 `y(x, t)` 的值，并输入 `k, ω, x` 和 `t` 四个参数。\n\n已知：`y0 = 1/2`；`λ = 495 * 10^-9`；`k\
  \ = 2π / λ`；`f = 5000`；`ω = 2πf`；`x = [0, 1]`，`t = [0, 5]`；`N = 10⁶`（`x` 和 `t` 的数据点数）。\n\
  \n名为 `Ex9_wFUN.m` 的解决方案脚本包含两个内嵌函数，内容如下：\n\n```\ny0=1/2;         % 波的振幅\nlambda=495e-9;\
  \  % 可见光波长\nk=2*pi/lambda;  % 波数\nf=5000;         % 频率\nomega=2*pi*f;   % 角频率\n\
  x=[0, 1e-5];    % 长度\nt=[0, 1e-3];    % 时间长度\nN=1e5;          % 待计算与模拟的数据点数\nxs=linspace(x(1),\
  \ x(2), N);    % 波长的序列\ntime=linspace(t(1), t(2), N);  % 时间序列\ny1 = F1(y0, k, xs,\
  \ omega, time);\ny2 = F2(y0, k, time, omega, xs); % 注意：变量的顺序（xs 与 time，以及 V5 与 V3）至关重要\n\
  plot(xs, y1, 'bo', xs, y2, 'rx-'), grid on, hold on\ntitle('M 文件中的嵌套函数文件')\nORG0\
  \ = y0*sin(k*xs-omega*time);\nplot(xs, ORG0, 'k', 'linewidth', 2)\nlegend('Fun1','Fun2','Original'),\
  \ shg\nfunction out1 = F1(var1, var2, var3, var4, var5)\n% M 文件嵌套函数 1 名称：F1\nout1=var1*sin(var2*var3-var4*var5);\n\
  end\nfunction out2 = F2(V1, V2, V3, V4, V5)\n% M 文件嵌套函数 2 名称：F2\n% 注意：变量的顺序（xs 与\
  \ time，以及 V5 与 V3）至关重要\nout2=V1*sin(V2*V5-V4*V3);\nend\n```\n\n可以通过单击菜单面板中的“**运行**”按钮来执行此\
  \ M 文件，也可以从另一个 M 文件或命令窗口中调用它。如果执行该文件，将得到以下输出：\n\n```\n>> clearvars\n>> Ex9_wFUN\n\
  >> whos\nName        Size                 Bytes  Class     Attributes\nN       \
  \    1x1                      8  double\nORG0        1x100000            800000\
  \  double\nf           1x1                      8  double\nk           1x1     \
  \                 8  double\nlambda      1x1                      8  double\nomega\
  \       1x1                      8  double\nt           1x2                    \
  \ 16  double\ntime        1x100000            800000  double\nx           1x2  \
  \                   16  double\nxs          1x100000            800000  double\n\
  y0          1x1                      8  double\ny1          1x100000           \
  \ 800000  double\ny2          1x100000            800000  double\n```\n\n此外，还会生成如图\
  \ 2-8 所示的图形。\n\n![图 2-8](img/471979_1_En_2_Fig8_HTML.png)\n\n**图 2-8** 比较 M 文件内嵌套函数获得的模拟结果\n\
  \n模拟结果表明，包含内嵌函数的 M 文件与其他任何 M 文件一样运行。与函数文件类似，输入参数的顺序对于 M 文件中的内嵌函数至关重要。如果顺序搞乱，由于一个变量的值将被应用于另一个变量，输出结果将不正确。\n\
  \n### 脚本与函数文件总结\n\nM 文件和函数文件中包含的警告和错误信息，不仅对用户，而且对开发人员都有极大帮助。因此，在编写脚本（程序）时，添加警告和错误信息以及额外的提示（以注释形式）非常重要。\n\
  \n以下是如何编写健壮且高效的 M 文件和函数文件的基本提示：\n\n- 在执行整个脚本之前，尽可能多地检查（输入和输出参数，例如大小和数据类型），以避免因耗时计算而导致的错误输出负担。\n\
  - 始终从最通用的检查（显而易见的检查）开始，然后转向更复杂和繁琐的检查。在必要或适当的地方添加警告和错误信息。例如，在调试过程中，当你有不同数量的输入参数和输出变量时，添加一个独特的示例进行显示（例如\
  \ `disp('这是……')`）。这些信息不仅帮助开发人员发现错误，还能遍历代码/脚本中所有预期的场景。\n- 当错误发生时，解释如何纠正（例如 `warning('请对某某进行操作……',\
  \ A, B, C)`）以及（例如 `error('某某处出现错误……', Num(1), Den(3), u(1))`）。\n- 添加警告信息标识符，以便用户可以开启或关闭警告。\n\
  - 添加数值示例，用已知的正确解来测试你的脚本。\n- 使用 M 文件分析器来检查 M 文件的效率。要使用分析器，请键入 `>> help profile` 或\
  \ `>> doc profile`。\n\n## 内联函数\n\nMATLAB 的 `inline` 命令允许用户使用输入变量开发解析表达式，并将该表达式赋值给一个变量。创建\
  \ `inline` 函数表达式的一般语法如下：\n\n```\nf=inline('[表达式 1; 表达式 2, ...]','参数 1','参数 2','参数\
  \ 3', ...);\n```\n\n在此命令语法中，`表达式 1`、`表达式 2` 等是内联函数，`参数 1`、`参数 2`、`参数 3` 等是输入变量。\n\
  \n### 示例 1\n\n`f(t) = sin(2t) / e^(2t)` 可以通过 `inline` 函数表达，无需定义任何参数，因为系统会自动识别出唯一变量。\n\
  \n```\n>> f = inline('sin(2*t)/exp(2*t)');\n```\n\n### 示例 2\n\n`f(t, θ) = [e^(-2tθ);\
  \ sin(2t)]` 写成 `f(t, θ)` 的 `inline` 函数形式。必须指定参数。在本例中，有两个变量：`t` 和 `θ`。因此，给定的函数表达式可以通过以下\
  \ `inline` 函数表示：\n\n```\n>> F = inline('[exp(2*t.*theta); sin(2*t)]', 't', 'theta');\n\
  ```\n\n这可以用预定义的参数（例如 `t` 和 `theta`）进行测试。\n\n```\n>> t=0:pi/20:pi; theta=linspace(0,1,length(t));\n\
  ```\n\n你可以通过简单地用预定义的输入参数调用 `inline` 函数 `F` 来执行计算。\n\n```\n>> fcalc=F(t, theta);\n\
  ```\n\n此外，还可以同时执行计算并绘制 `inline` 函数 `F` 的计算结果数据。\n\n```\n>> plot(t, log(F(t, theta)),\
  \ 'linewidth', 1.5);\n```\n\n### 示例 3\n\n给定一个二阶微分方程 `y'' + y' + 3y = t²`，它可以用两个一阶微分方程表示：\n\
  \n```\ny1' = y2\ny2' = t² - (y2 + 3*y1)\n```\n\n这两个一阶微分方程可以使用以下 `inline` 函数定义：\n\
  \n```\nf =inline('[y(2); t²-(y(2)+3*y(1))]', 't', 'y');\n```\n\n基于这些示例，你可以看到，无论是在命令窗口还是在解决各种计算问题的脚本中，使用\
  \ `inline` 函数工具都非常简单直接。\n\n### 注意\n\n`inline` 命令将在 MATLAB 的未来版本中移除，因此建议使用匿名函数来代替它。\n\
  \n\n\n# 带函数句柄的匿名函数（`@`）\n\n匿名函数是一种不存储在程序文件中的函数。它与一个变量相关联，并通过函数句柄（`@`）进行调用。通常，函数句柄接受输入变量并返回输出变量，这与函数文件（如前所述）类似。函数文件与匿名函数表达式的一个主要区别在于，带句柄（`@`）的匿名函数只包含一条可执行语句。带函数句柄的匿名函数的一般语法如下：\n\
  \n```\nFun_handle=@(arg1, arg2, arg3, ...)([expression1; expression2;...])\n```\n\
  \n### 示例 1\n\n![$$ f(t)=\\frac{\\mathit{\\sin}(2t)}{e^{2t}} $$](img/471979_1_En_2_Chapter_TeX_IEq60.png)给定函数\
  \ `f(t)` 可通过以下命令用函数句柄表示：\n\n```\n>> f_handle = @(t)(sin(2*t)./exp(2*t));\n>> t=linspace(0,2*pi,\
  \ 100);\n>> f=f_handle(t); plot(t, f, 'o-')\n```\n\n也可以将函数句柄用于脚本的循环迭代中；例如，`Fun_handle.m`。\n\
  \n```\n% Fun_handle.m\nf_handle = @(t)(sin(2*t)./exp(2*t));\nt=linspace(0,2*pi,\
  \ 100);\nfor ii=1:length(t)\nf(ii)=f_handle(t(ii));\nend\nplot(t, f, 'o-')\ntitle('plot:\
  \ f(t)=(sin(2*t)./exp(2*t)')\n```\n\n### 示例 2\n\n给定 `f(t, θ) = [e^(-2t*θ); sin(2*t)]`。\n\
  \n该给定函数 `f(t, θ)` 可通过一个函数句柄表示：\n\n```\n>> F_handle = @(t, theta)([exp(2*t.*theta);\
  \ sin(2*t)]);\n```\n\n让我们为输入参数 `t` 和 `theta` 指定数据值。\n\n```\n>> t=0:pi/20:pi; theta=linspace(0,1,length(t));\n\
  ```\n\n为了从函数句柄 `F_handle` 获得计算结果，需要再次调用它，并传入输入参数 `t` 和 `theta`。\n\n```\n>> Fvalues=F_handle(t,\
  \ theta);\n```\n\n### 示例 3\n\n给定 ![$$ \\ddot{y}+\\dot{y}+3y={t}² $$](img/471979_1_En_2_Chapter_TeX_IEq61.png)\n\
  \n它可以写成状态空间形式的两个一阶微分方程。\n\n![$$ \\left\\{\\begin{array}{c}{\\dot{\\mathrm{y}}}_1={y}_2\\\
  \\ {}{\\dot{y}}_2={t}²-\\left({y}_2+3{y}_1\\right)\\end{array}\\right. $$](img/471979_1_En_2_Chapter_TeX_Equh.png)\n\
  \n这个由两个一阶微分方程推导出的系统可以通过以下函数句柄（`@`）定义：\n\n```\nf =@(t, y)([y(2); t²-(y(2)+3*y(1))]);\n\
  ```\n\n匿名函数的函数句柄（`@`）工具也可以像`inline`函数一样用来解决多种问题，包括微分方程。\n\n至此，我已经演示了如何使用函数文件、`inline`函数和匿名函数工具。与函数文件相比，使用带句柄（`@`）定义的匿名函数和`inline`函数各有一些优缺点。匿名函数易于实现和设计，并且在函数名和输入参数方面发生混淆的可能性非常小。另一方面，函数文件在计算时间上效率更高、更灵活。当数值模拟空间较大时，这一点非常重要。此外，函数文件可以在\
  \ Simulink 模型中使用。\n\n## 如何提升脚本性能\n\n那么，如何加速仿真/计算过程呢？当处理大型数据集时，你可能会遇到内存问题。为了在 MATLAB\
  \ 中防止内存问题或错误，或者仅仅是为了提高计算效率，建议遵循以下提示：\n\n*   避免大型临时变量，将变量拆分为较小的部分，并在不再需要时清除变量（使用\
  \ `clearvars`）。\n*   在不需要更高精度时，使用较低精度的数据类型。\n*   通过使用标准矩阵如 `zeros()` 和 `ones()`\
  \ 为固定大小的数组预分配内存，以减少内存碎片。\n*   使用 `pack()` 函数整理内存碎片。\n*   考虑定期将数据写入磁盘。\n*   增加交换文件的大小。可以通过我的电脑\
  \ ➤ 属性 ➤ 高级 ➤ 性能设置来完成。注意，建议将交换文件大小设置为计算机 RAM 的两倍。\n\n其他加速仿真过程的技术：\n\n*   函数（函数文件）比脚本运行速度更快\n\
  *   当需要导入或导出数据集时，`load` 和 `save` 比文件 I/O 函数更快\n*   避免大型后台进程\n*   用 `try-catch` 替代参数检查\n\
  *   优先使用 `switch-case` 而非 `if–elseif-else`\n*   对稀疏数据使用稀疏数组\n\n关于基本编程问题的讨论到此结束。\n\
  \n脚注 1 2 3\n\n# 3. 图形用户界面模型开发\n\nMATLAB 提供了许多图形用户界面（GUI）工具和函数，无论是在构建 GUI 模型时使用 GUI\
  \ 工具还是编写脚本，都可以用到它们。在本章中，我们将介绍如何使用 GUI 开发环境（GUIDE）构建 GUI 模型，以及如何编写脚本生成弹出框和对话框。\n\n\
  \n\n# 指南\n\n构建 MATLAB GUI 模型需要三类基本元素，分别是**组件**、**图形窗口**和**回调函数**。\n\n-   MATLAB\
  \ GUI 组件包括图形控件（按钮、编辑框、列表、滑块和弹出式菜单）、静态元素（框架、文本字符串）、菜单和坐标轴。图形控件和静态元素可通过 `uicontrol`\
  \ 函数创建。菜单可通过 `uimenu` 和 `uicontextmenu` 函数生成。`axes` 函数用于显示图形数据。\n\n-   `figure`\
  \ 函数用于创建容纳各种组件组合的图形窗口。\n\n-   回调或回调函数用于根据用户的操作（例如鼠标或触摸屏的点击，或键盘输入）执行相应动作（如模拟和显示）。\n\
  \n所有这些组件、图形窗口及其属性和行为，都可以通过编写脚本、函数和回调函数，并利用 MATLAB 内置的功能工具来创建。然而，这种方法相当繁琐冗长，需要大量的代码和编程工作。另一种更直接的设计\
  \ GUI 模型的方法是使用 MATLAB 用户友好的 GUI 开发环境（GUIDE）工具。\n\nGUIDE 包含多种模板，包括带 UI 控件的 GUI、带坐标轴和菜单的\
  \ GUI 以及模态问题对话框。使用此工具，您可以相当轻松地创建包含所有必要组件（如按钮、菜单、静态元素、文本等）的 GUI 模型布局，并调整它们的属性（大小、颜色、类型等）以及它们在\
  \ GUI 模型设计中的位置。这一切都可以通过鼠标和键盘完成，无需任何编程。请注意，MATLAB（从 MATLAB R2016a 开始）引入了一个名为 App\
  \ Designer 的用户友好型拖放式应用开发环境。它类似于 GUIDE，在未来的版本中，App Designer 和 GUIDE 将整合在一起。这里我们将演示如何使用\
  \ GUIDE 工具来创建 GUI。\n\nGUIDE 中的许多 GUI 控件都非常直观，使用 GUI 控件工具构建 GUI 模型并不困难。我们首先启动 GUIDE\
  \ 工具，熟悉其组件和工具。然后，我们继续使用 GUI 的属性检查器工具，修改模型中使用的 GUI 模块的操作行为。采用这种方法，在完成使用 GUI 模块的 GUI\
  \ 建模后，我们保存模型。MATLAB 会自动生成一个脚本函数文件（M 文件），我们根据给定的 GUI 模型需求对其进行修改。\n\n我们可以通过在命令窗口中输入\
  \ `guide`，或者从菜单栏中选择 `![../images/471979_1_En_3_Chapter/471979_1_En_3_Figa_HTML.jpg](img/471979_1_En_3_Figa_HTML.jpg)`\
  \ ➤ 应用 ➤ GUIDE 来启动 GUIDE 应用程序。随后，将出现 GUIDE 快速启动窗口，如图 3-1 所示。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig1_HTML.jpg](img/471979_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\nGUIDE 快速启动窗口\n\n在这些选项中，我们可以选择空白 GUI（默认），或者选择 MATLAB 的现成示例模型，包括带 UI 控件的\
  \ GUI、带坐标轴和菜单的 GUI，或模态问题对话框。当我们选择“空白 GUI（默认）”时，将打开如图 3-2 所示的空白窗口（默认名称为 `untitled.fig`）。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig2_HTML.jpg](img/471979_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n不带名称标签的 GUI 图形窗口组件\n\n从这个 GUI 布局窗口（图 3-2）开始，我们就可以进行工作了。我们可以通过从 MATLAB\
  \ GUIDE 首选项中选择“在组件面板上显示名称”来查看 GUI 组件和工具的名称标签。进行此调整后，组件将显示其名称标签，如图 3-3 所示。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig3_HTML.jpg](img/471979_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n显示名称标签的 GUI 组件\n\n图 3-4 所示的 GUI 窗口由 GUI 组件、设计区域以及名为“对齐对象”、“菜单编辑器”、“Tab\
  \ 顺序编辑器”等的菜单工具组成。一旦 GUI 窗口打开，我们可以通过将所需的 GUI 组件拖放到设计区域来开始构建我们的 GUI 模型（见图 3-4）。我们可以通过单击并拖动鼠标，或使用鼠标右键选项、属性检查器、对齐对象以及其他菜单栏工具，在设计区域内调整\
  \ GUI 组件的大小和对齐方式。此外，我们可以通过单击“编辑器”来编辑 GUI 组件的属性，并通过单击“工具栏编辑器”向 GUI 添加菜单工具。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig4_HTML.jpg](img/471979_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\nGUI GUIDE 工具窗口及其菜单栏\n\n构建 GUI 模型需要几个基本步骤：\n\n1.  明确定义预期的 GUI 模型应具备的特定功能，以及需要哪些工具和组件。一如既往，最好先在纸上草拟\
  \ GUI 模型的草图。\n\n2.  将所有必要的 GUI 组件拖放到设计区域，然后根据您的需求和项目要求对其进行修改和对齐。当每个组件都放置到位并相互调整好后，您可以将它们放入一个按钮组（有一个名为“按钮组”的组件），这为您在设计区域移动和对齐对象提供了良好的灵活性。请注意，将组件分组到按钮组中是可选的。\n\
  \n3.  为模型中使用的所有组件重命名或提供可识别的名称“标签”，以便在稍后阶段编辑脚本和 M 文件时轻松识别它们。此外，您可能需要调整和修改组件的颜色、字体和大小。请注意，更改模型中组件的颜色、字体大小、文本类型、大小和位置不会影响\
  \ GUI 模型的执行/仿真结果。\n\n4.  保存已创建的工作。它将以两种不同的文件格式保存，一种是 `*.fig`（图形文件），另一种是 `.m`（函数文件），其中包含模型的完整脚本，包括每个\
  \ GUI 组件的所有嵌套回调函数。\n\n5.  编写/编辑一个脚本，实现每个 GUI 组件与其他组件关联的性能。此步骤需要一些额外的编程工作，将在以下示例中讨论。\n\
  \n## 示例 1：构建二维绘图\n\n让我们来看一个非常简单的示例，为用户的输入值范围构建一个辛格函数的二维绘图：![$$ \\mathit{\\operatorname{sinc}}\\\
  left(\\pi x\\right)=\\frac{\\mathit{\\sin}\\left(\\pi x\\right)}{\\pi x} $$](img/471979_1_En_3_Chapter_TeX_IEq1.png)。\n\
  \n通过拖放“按钮”、“静态文本”、“编辑文本”和“坐标轴”模块，我们开始构建 GUI 模型的界面，如图 3-5 所示。在 GUI 模型中调整好所有模块的相对位置后，我们可以通过双击每个模块或使用鼠标右键的“属性检查器”选项来编辑它们的属性。请注意，“静态文本”用于显示输入条目名称：Xmin\
  \ 和 Xmax。Xmin 和 Xmax 的值代表变量的边界值，可以在“编辑文本”模块中定义。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig5_HTML.jpg](img/471979_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n选定的必要模块已放置到 GUI 模型区域中\n\n\n\n### 注意\n\n静态文本块与编辑文本块之间有一个主要区别：用户可以在编辑文本块中修改条目，但在静态文本块中则无法进行此操作。\n\
  \n此外，我们还添加了一个坐标区模块，用于根据我们在编辑文本块中输入的*x*[*最小值*]和*x*[*最大值*]，显示函数 *sinc*(*x*)计算值的图形。我们还添加了一个按钮模块，使构建的模型（见图\
  \ 3-5）能够计算函数值，并将结果显示在绘图区域中。\n\n为了让我们的 GUI 模型信息更丰富、可读性更强且更用户友好，我们可以通过更改字体大小、颜色、背景色等属性来编辑每个模块。每个模块都有许多可更改的属性。例如，我们可以更改前景色、背景色、字体类型、大小和颜色、位置、尺寸、字符串、名称以及其他一些属性（见图\
  \ 3-6）。在这些属性中，有两个主要属性（见图 3-6）需要我们特别关注。第一个是`tag`，它是模块的名称，必须具有唯一性。第二个属性是`string`，用于显示固定文本或空白区域。`string`会显示在\
  \ GUI 模型中。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig6_HTML.jpg](img/471979_1_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6** 用于编辑模块属性的属性检查器窗口\n\n现在，让我们对 GUI 模型中的模块进行一些修改：更改它们的背景色、尺寸、字体大小、颜色和类型，并调整模块的位置。请注意，在静态文本块中，我们将字符串编辑为加粗、字体大小\
  \ 12.0 的“Xmin”和“Xmax”，并分别设为红色和蓝色。在编辑文本块中，我们移除它们的字符串，使其为空。此外，我们将它们的字体大小改为 12.0，加粗，并设置黄色背景色。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figb_HTML.jpg](img/471979_1_En_3_Figb_HTML.jpg)\n\
  \n### 注意\n\n若要使编辑文本块具有预定义值（例如 -6、0、3.14 和 100），我们需要将这些值插入到每个编辑文本块的“String”值中。\n\n\
  按钮的背景色、字体大小、类型、字符串和标签名称均已修改。其字符串更改为`\"PLOT\"`，标签重命名为`PLOTsinc`。图 3-7 展示了完成后的 GUI\
  \ 模型。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig7_HTML.jpg](img/471979_1_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7** 所有按钮和组件均已修改的完成版 GUI 模型\n\n保存模型并点击“运行”按钮，或从键盘按下`Ctrl+T`。新模型（如图 3-8 所示）目前尚未显示任何结果。模型编码部分仍缺少一个关键步骤。\n\
  \n### 注意\n\n在构建 GUI 模型并编辑模块属性时，务必为每个模块分配唯一的名称。当修改 GUI 模型的回调函数时，需要使用模块的标签。\n\n若要同时更改多个模块的属性，请选中所有目标模块，然后在属性检查器中进行修改。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig8_HTML.jpg](img/471979_1_En_3_Fig8_HTML.jpg)\n\
  \n**图 3-8** 创建的 SINC 函数绘图 GUI\n\nMATLAB 以两种文件格式保存模型——`SINC_fun.m`（函数文件）和 `SINC_fun.fig`（GUI\
  \ 图形文件）。`SINCfun.m`中使用的所有按钮的回调函数如下所示：\n\n```\nfunction varargout = SINCfun(varargin)\n\
  % SINCFUN MATLAB code for SINCfun.fig\n% SINCFUN, by itself, creates a new SINCFUN\
  \ or raises the existing\n% singleton*.\n...\n% Begin initialization code - DO NOT\
  \ EDIT\ngui_Singleton = 1;\ngui_State = struct('gui_Name', mfilename, ...\n'gui_Singleton',\
  \ gui_Singleton, ...\n'gui_OpeningFcn', @SINCfun_OpeningFcn, ...\n'gui_OutputFcn',\
  \ @SINCfun_OutputFcn, ...\n'gui_LayoutFcn', [] , ...\n'gui_Callback', []);\nif nargin\
  \ && ischar(varargin{1})\ngui_State.gui_Callback = str2func(varargin{1});\nend\n\
  if nargout\n[varargout{1:nargout}] = gui_mainfcn(gui_State, varargin{:});\nelse\n\
  gui_mainfcn(gui_State, varargin{:});\nend\n% End initialization code - DO NOT EDIT\n\
  % --- Executes just before SINCfun is made visible.\nfunction SINCfun_OpeningFcn(hObject,\
  \ eventdata, handles, varargin)\n% This function has no output args, see OutputFcn.\n\
  ...\nfunction Xmax_Callback(hObject, eventdata, handles)\n% hObject handle to Xmax\
  \ (see GCBO)\n...\n% --- Executes on button press in PLOTsinc.\nfunction PLOTsinc_Callback(hObject,\
  \ eventdata, handles)\n% hObject handle to PLOTsinc (see GCBO)\n...\n```\n\n请注意，此脚本（`SINC_fun.m`）的大部分内容是在保存\
  \ GUI 模型时自动生成的，并且不会更改，我们只需编辑一个回调函数。必须编辑回调函数才能使 GUI 模型执行预期的计算并显示图形。请注意，每个回调函数都有三个参数句柄——`hObject`、`eventdata`\
  \ 和 `handles`。\n\n在编辑/编写回调函数时，我们可以使用`get()`函数查询句柄的属性，并使用`set()`函数为句柄赋值或更改其任何属性。请注意，在`SINCfun.m`模型中，只有一个需要编辑的回调函数——`PLOTsinc_Callback(hObject,\
  \ eventdata, handles)`。`PLOTsinc_Callback`回调函数调用 PLOT 按钮，该按钮的标签名为`PLOTsinc`。`PLOTsinc`标签名是在构建\
  \ GUI 模型时通过属性检查器赋予 PLOT 按钮的。此回调函数通过获取用户输入的*x*[*最小值*]和*x*[*最大值*]来计算*sinc*(*πx*)并绘制计算结果的图形。要编辑`PLOTsinc_Callback(hObject,\
  \ eventdata, handles)`回调函数，我们首先需要将 Xmin 和 Xmax 的条目从字符串格式转换为双精度格式，具体方式如下：\n\n```\n\
  Xmin=str2double(get(handles.Xmin, 'string'));\nXmax=str2double(get(handles.Xmax,\
  \ 'string'));\n```\n\n`get()`命令从`handles.Xmin`和`handles.Xmax`中获取字符串格式的数据，然后`str2double()`将其转换为数值格式。使用双精度格式的\
  \ Xmin 和 Xmax 值来生成变量 x 的等间距值，然后用于计算 f(x) = *sinc*(*πx*) 并使用以下命令绘制结果：\n\n```\nx=linspace(Xmin,\
  \ Xmax, 200); f=sinc(x*pi); plot(x, f, 'b');\ngrid on\ntitle('sinc(\\pi*x) = sin(\\\
  pi*x)/(\\pi*x) ')\nxlabel('x'),ylabel('f(x)=sinc(\\pi*x)'),\naxis([Xmin, Xmax, -.25,\
  \ 1.1])\n```\n\n最终，编辑后的回调函数 `PLOTsinc_Callback(hObject, eventdata, handles)` 包含以下内容：\n\
  \n\n```matlab\nfunction PLOTsinc_Callback(hObject, eventdata, handles)\nXmin=str2double(get(handles.Xmin,\
  \ 'string'));\nXmax=str2double(get(handles.Xmax, 'string'));\nx=linspace(Xmin, Xmax,\
  \ 200);\nf=sinc(x*pi);\nplot(x, f, 'b'); grid on\ntitle('sinc(\\pi*x) = sin(\\pi*x)/(\\\
  pi*x) ')\nxlabel('x'),ylabel('f(x)=sinc(\\pi*x)'),\naxis([Xmin, Xmax, -.25, 1.1])\n\
  ```\n\n如上所述，这是我们为了在 GUI 模型中通过一次点击计算并绘制 *sinc*(*πx*) 函数而编辑的 `SINCfun.m` M 文件的唯一一部分。我们保存\
  \ `SINCfun.m` 文件，并通过在 M 文件编辑器中使用![../images/471979_1_En_3_Chapter/471979_1_En_3_Figc_HTML.jpg](img/471979_1_En_3_Figc_HTML.jpg)或从键盘按下\
  \ `F5` 来执行它。当我们运行 `SINCfun.m` 时，`SINCfun.fig` GUI 模型弹出。我们输入两个条目——*X*[*min*] = −5\
  \ 和 *X*[*max*] = 6——然后点击 `PLOT` 按钮。函数的结果被计算并绘制出来，如图 3-9 所示。请注意，`Xmax` 的值必须大于 `Xmin`\
  \ 的值；否则，将会出现错误。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig9_HTML.jpg](img/471979_1_En_3_Fig9_HTML.jpg)\n\
  \n**图 3-9** 用于绘制 *sinc*(*πx*) 函数的 GUI 模型\n\n这个简单的例子展示了使用 GUIDE 工具构建 GUI 模型是多么容易。一旦\
  \ GUI 模型界面布局完成，并且组件的属性已被编辑和保存，M 文件（函数文件）的回调函数就会被生成。随后，通过仅编辑所需的回调函数，我们就可以得到 GUI 模型。\n\
  \n### 示例 2：添加功能\n\n让我们为我们的 GUI 模型（图 3-9）再添加四个选项：\n\n-   创建一个退出/关闭按钮来关闭 GUI 模型窗口\n\
  -   通过调用并执行另一个 M 文件（名为 `SOUND_hear.m`）来播放声音\n-   显示一个 `*.jpg`/`*.jpeg` 格式的图像（名为\
  \ `GC2011.jpg`）\n-   显示一个消息框，消息内容为 `\"All Done Well Done!!!\"`\n\n有几种方法可以完成这些任务，其中一种方法是添加一个\
  \ Push Button 模块并编辑其回调函数。我们首先回到 GUI 模型编辑器，添加一个 Push Button 模块。像之前一样更改 Push Button\
  \ 的属性（背景颜色、字体大小和类型以及字符串和标签）。现在，我们通过更改其字符串将 Push Button 模块重命名为 `QUIT`；其名称标签被重命名为\
  \ `QUIT_button`。在保存更新后的 GUI 模型 `SINCfun.fig` 之前，我们需要更改窗口的名称。为此，我们需要在设计区域（任何模块之外的区域，可打开属性检查器窗口）上双击，然后将名称标签从\
  \ `figure1`（默认）更改为 `GUI_window`。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figd_HTML.jpg](img/471979_1_En_3_Figd_HTML.jpg)\n\
  \n我们保存 GUI 模型并执行它。之后，我们编辑最后一个自动添加的回调函数，名为 `QUIT_button_Callback(hObject, eventdata,\
  \ handles)`，在其中添加以下内容。内置的 MATLAB 函数 `delete()` 会停止整个过程并关闭窗口。\n\n```matlab\nfunction\
  \ QUIT_button_Callback(hObject, eventdata, handles)\ndelete(handles.GUI_window)\n\
  run('SOUND_hear.m'); A=imread('GC2011.jpg'); image(A);\nmsgbox('All Done Well Done!!!')\n\
  ```\n\n图 3-10 展示了更新后的 GUI 模型。我们可以输入 `Xmin` 和 `Xmax` 的数值来测试它，然后点击 `QUIT` 按钮。按下 `QUIT`\
  \ 后，GUI 窗口 `SINCfun.fig` 将被关闭。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig10_HTML.jpg](img/471979_1_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10** 用于显示 *sinc*(*πx*) 和退出选项的 GUI 模型\n\n随后，内置函数 `run()` 执行 `SOUND_hear.m`\
  \ 文件，该文件播放一个声波。另一个名为 `image()` 的内置函数显示 `GC2011.jpg` 图像，如图 3-11 所示。最后，`msgbox()`\
  \ 函数显示消息：`All Done Well Done!!!`。\n\n单独的 M 文件 `SOUND_hear.m` 包含以下脚本：\n\n```matlab\n\
  % SOUND_hear.m\n% 三个 CHIRP 信号以产生声音\nt=0:1/1e4:10;\nD0=chirp(t, 0, 10, 3000, 'quadratic');\n\
  D1=chirp(t, 0, 10, 4000, 'q',[],'convex');\nD2=chirp(t, .001, 10, 5000, 'logarithmic');\n\
  y=[D0, D1, D2]; sound(y);\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig11_HTML.jpg](img/471979_1_En_3_Fig11_HTML.jpg)\n\
  \n**图 3-11** 显示的图像文件 `GC2011.jpg`\n\n在这个简单的练习中，我们演示了如何将 GUI 模型按钮与其他 GUI 模块和 M 文件关联起来。类似地，Simulink\
  \ 的文件以及与 MATLAB 包兼容的任何应用程序都可以链接到 GUI 模型。\n\n### 示例 3：求解二次方程\n\n让我们再举一个例子，创建一个 GUI\
  \ 模型，该模型求解任意给定系数 *a*、*b* 和 *c* 的二次方程，并显示用户指定的变量 *x* 的值范围对应的曲线图。二次方程的公式为 *ax*² +\
  \ *bx* + *c* = 0，如果给定了 *a*、*b* 和 *c* 的数值，我们可以数值计算给定方程的根。此练习分两个阶段完成：构建 GUI 界面和编辑回调函数。\n\
  \n#### 构建 GUI\n\n我们再次从一个空白的 GUI 窗口开始，选择一个 Panel 模块，然后向其中拖放几个模块，例如 Static Text、Edit\
  \ Text、Push Button 和 Axes。在构建 GUI 模型时使用 Panel 模块有一个很好的理由。它可以帮助您相对于彼此在设计区域内及周围操作所有\
  \ GUI 模块。\n\n我们按照 *a*、*b*、*c* 的顺序放置模块，然后为 *D*（判别式）、*x*[1] 和 *x*[2] 的根计算结果，以及 Push\
  \ Button 模块，以使 GUI 模型计算判别式、根 *x*[1] 和根 *x*[2] 的值。之后，我们通过更改每个模块的字体大小、类型、字符串、标签和背景颜色来编辑模块属性。此外，我们编辑\
  \ *x*[*min*] 和 *x*[*max*] 的用户输入模块，并使用一个 Push Button 模块以 2D 方式绘制计算结果。另外，我们通过在设计区域上双击并在属性检查器中更改标题，将面板窗口的名称更改为“二次方程求解器”。图\
  \ 3-12 显示了我们完成的 GUI 模型窗口。\n\n\n### 注意\n\n在此 GUI 模型（如图 3-12 所示）中，为节省组件面板窗口空间，组件名称未予显示。您可以通过选择“文件\
  \ ➤ 首选项 ➤ GUIDE ➤ 在组件面板中显示名称”来开启或关闭该功能。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig12_HTML.jpg](img/471979_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12  \nGUI 模型窗口的完整设计\n\n请注意，在图 3-12 所示的 GUI 模型中，模块的以下属性已更改：在“a”、“b”、“c”、“x1”、“x2”、“Xmin”和“Xmax”等静态文本模块中，其字符串、字体大小与类型以及背景色已更改。用于显示判别式、x1\
  \ 和 x2 计算结果的三个静态文本模块的属性也已更改。例如，用于显示判别式值的静态文本模块，其背景色、字体类型、大小、字符串和标签均被更改。其字符串被修改为空白，标签重命名为\
  \ D。\n\n用于显示 x1 和 x2 值的静态文本模块的背景色、字体类型、大小、字符串和标签也已被更改。这些字符串被设为空，其标签分别重命名为 x1 和 x2，对应*x*[1]和*x*[2]。此外，还有两个按钮模块：一个用于求解给定方程（基于\
  \ a、b、c 的值），另一个用于根据用户输入的 Xmin 和 Xmax 值显示二次方程的图形。\n\n第一个按钮模块的字符串改为`SOLVE`，其标签为`SOLVE_eqn`；第二个按钮的字符串称为`PLOT`，其标签为`PLOT_eqn`。如前所述，在编辑或重写\
  \ GUI 模型 M 文件中的子函数时，标签至关重要，需要仔细处理。\n\n至此，我们的所有工作均在 GUI 设计窗口内完成，并通过属性检查器（双击各模块进入）修改所选模块的属性。在本例中，我们还对面板窗口进行了更改：修改了其背景色、标题、字体类型和大小。最后，在\
  \ GUI 模型中完成所有更改后，我们将其保存为`QUAD_eqn_SIM.fig`文件（见图 3-13），`QUAD_eqn_SIM.m`文件也随之自动保存。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig13_HTML.jpg](img/471979_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13  \n用于计算根并显示二次方程二维图形的完整 GUI 模型\n\n### 编辑回调函数\n\n图 3-13 所示的模型在单击“SOLVE”或“PLOT”按钮时不会显示任何结果。我们需要编辑并重写\
  \ M 文件 `QUAD_eqn_SIM.m` 的两个回调函数。请注意，脚本中所有自动生成的注释均已移除。\n\n```\nfunction varargout\
  \ = QUAD_eqn_SIM(varargin)\n% QUAD_EQN_SIM MATLAB code for QUAD_eqn_SIM.fig\n...\n\
  gui_Singleton = 1;\ngui_State = struct('gui_Name', mfilename, ...\n'gui_Singleton',\
  \ gui_Singleton, ...\n'gui_OpeningFcn', @QUAD_eqn_SIM_OpeningFcn, ...\n'gui_OutputFcn',\
  \ @QUAD_eqn_SIM_OutputFcn, ...\n'gui_LayoutFcn', [] , ...\n'gui_Callback', []);\n\
  if nargin && ischar(varargin{1})\ngui_State.gui_Callback = str2func(varargin{1});\n\
  end\n...\nhandles.output = hObject;\nguidata(hObject, handles);\nfunction varargout\
  \ = QUAD_eqn_SIM_OutputFcn(hObject, eventdata, handles)\n...\nvarargout{1} = handles.output;\n\
  function a_Callback(hObject, eventdata, handles)\n...\nfunction a_CreateFcn(hObject,\
  \ eventdata, handles)\n...\nfunction b_Callback(hObject, eventdata, handles)\n...\n\
  function b_CreateFcn(hObject, eventdata, handles)\n...\nfunction edit3_Callback(hObject,\
  \ eventdata, handles)\n...\nfunction edit3_CreateFcn(hObject, eventdata, handles)\n\
  ...\nif ispc && isequal(get(hObject,'BackgroundColor'), get(0,'defaultUicontrolBackgroundColor'))\n\
  set(hObject,'BackgroundColor','white');\nend\nfunction Xmin_Callback(hObject, eventdata,\
  \ handles)\n...\nfunction Xmin_CreateFcn(hObject, eventdata, handles)\n...\nfunction\
  \ Xmax_Callback(hObject, eventdata, handles)\n...\nfunction Xmax_CreateFcn(hObject,\
  \ eventdata, handles)\n...\nif ispc && isequal(get(hObject,'BackgroundColor'), get(0,'defaultUicontrolBackgroundColor'))\n\
  set(hObject,'BackgroundColor','white');\nend\nfunction SOLVE_eqn_Callback(hObject,\
  \ eventdata, handles)\n...\nfunction PLOT_eqn_Callback(hObject, eventdata, handles)\n\
  ...\n```\n\n我们将编辑的回调函数是 `PLOT_eqn_Callback(hObject, eventdata, handles)` 和 `SOLVE_eqn_Callback(hObject,\
  \ eventdata, handles)`。这些回调函数使 GUI 模型能够根据我们输入的 Xmin 和 Xmax 值，计算并显示判别式、两个实根（在预定义的模块中），并显示二维图形。以下是名为\
  \ `SOLVE` 和 `PLOT` 的两个按钮的编辑后回调函数：\n\n```\n...\nfunction SOLVE_eqn_Callback(hObject,\
  \ eventdata, handles)\na=str2double(get(handles.a, 'string'));\nb=str2double(get(handles.b,\
  \ 'string'));\nc=str2double(get(handles.c, 'string'));\nD=b²-4*a*c;\nif D>0 % 存在两个实根;\n\
  x1=(-b+sqrt(D))/(2*a);\nx2=(-b-sqrt(D))/(2*a);\nelseif D==0 % 存在唯一根;\nx1=-b/(2*a);\n\
  x2=x1;\nelse % 不存在实根;\nx1='No Root';\nx2='No Root';\nend\nD=num2str(D); set(handles.D,\
  \ 'string', D);\nx1=num2str(x1); set(handles.x1, 'string', x1);\nx2=num2str(x2);\
  \ set(handles.x2, 'string', x2);\nfunction PLOT_eqn_Callback(hObject, eventdata,\
  \ handles)\na=str2double(get(handles.a, 'string'));\nb=str2double(get(handles.b,\
  \ 'string'));\nc=str2double(get(handles.c, 'string'));\nD=str2double(get(handles.D,\
  \ 'string'));\nx1=str2double(get(handles.x1, 'string'));\nx2=str2double(get(handles.x2,\
  \ 'string'));Xmin=str2double(get(handles.Xmin, 'string'));\nXmax=str2double(get(handles.Xmax,\
  \ 'string'));\nx=linspace(Xmin, Xmax, 200); y=a*x.²+b*x+c;\nplot(x, y, 'r-', 'linewidth',\
  \ 1.5); xlabel('x'), ylabel('y = ax²+bx+c')\nif D>=0   % 如果方程有实根，则绘制根 x1 和 x2\n\
  hold on  % 如果 D>=0，保持图形\nplot(x1, 0, 'rs', x2, 0, 'gd', 'markersize', 7, 'markerfacecolor',\
  \ 'y')\nlegend('plot of quad. eqn', 'root: x_1', 'root: x_2')\nend\ntitle(['Plot\
  \ of:  ' num2str(a)  'x² + '  num2str(b)  'x + '  num2str(c)  ' = 0']); grid on\n\
  ```\n\n\n\n请注意，在子函数 `SOLVE_eqn_Callback` 中，我们使用 `get()` 命令获取 *a*、*b*、*c* 的字符串值，并通过\
  \ `str2double()` 将其转换为数值数据。使用 `set()` 命令，将计算得到的 `D`、`x1` 和 `x2` 的值分别赋给 `D`、`x1`\
  \ 和 `x2`，以便在名为“D”、“x1”和“x2”的相应静态文本块中显示。在后一个子函数中，我们使用 `get()` 命令获取 *a*、*b* 和 *c*\
  \ 的数值。然后，我们通过点击“运行”按钮或从命令窗口调用该文件（例如 `-3*x² + 5*x + 1 = 0`）来运行名为 `QUAD_eqn_SIM.m`\
  \ 的整个 M 文件，并绘制给定方程在 *x* = −1…3 范围内的图形。\n\n请注意，在 `SOLVE_eqn_Callback` 回调函数中，如果判别式\
  \ *D* ≥ 0，则计算出的根也将被绘制。此外，这里还使用了几个绘图工具（`hold on`、`legend`、`markersize` 和 `markerfacecolor`），这些工具在第\
  \ 6 章中有详细说明。\n\n图 3-14 显示了针对给定示例 `-3*x² + 5*x + 1 = 0` 和 *x* = −1…3 的最终 GUI 模型及其结果。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fig14_HTML.jpg](img/471979_1_En_3_Fig14_HTML.jpg)\n\
  \n**图 3-14** — 用于计算二次方程根并在用户输入的 Xmin 和 Xmax 范围内绘制其值的 GUI 模型。\n\n让我们回顾一下在编辑和重写子函数时最常见的一些错误。它们是：\n\
  \n-   在子函数中调用或设置值以在 GUI 模型窗口中显示时，块的标签名称拼写错误。\n-   在子函数中未正确使用必要的转换操作符（例如 `get()`\
  \ 和 `set()` 操作符）进行数值计算。\n-   编辑了错误的按钮子函数（回调函数），导致 GUI 模型无法执行其预期操作。\n\n为了避免这些常见错误，建议仔细选择标签名称，并在编写和编辑嵌套回调函数时反复检查其名称。另一个建议是写下所有标签名称并仔细键入。在使用\
  \ `get()` 和 `set()` 操作符转换变量值时，请查看任务的具体要求。例如，处理时需要什么类型的数据，以及通过哪个句柄名称（例如 `handles.WHAT`）获取变量或数据的值。有几种方法可以避免编辑错误的回调函数。一种是查找每个按钮的分配名称标签，该标签使\
  \ GUI 模型执行其预期操作。MATLAB 会自动为每个操作按钮和输入块分配一个子函数名称，该名称由其给定的名称标签（用户给定的名称标签）加上下划线和 `callback()`\
  \ 组成。例如，如果一个操作按钮的名称标签是 `PLOT_all`，那么它将有一个名为 `PLOT_all_Callback(hObject, eventdata,\
  \ handles)` 的子函数。另一种方法是在保存 GUI 模型和自动生成的 M 文件后，在 GUI 模型设计窗口中单击一个操作按钮（例如，一个按钮）。然后右键单击并选择\
  \ **查看回调** ➤ **回调**，以直接访问需要编辑的正确子函数主体。\n\n## GUI 对话框和消息框\n\nMATLAB 有几种命令，可以创建/调用现成的弹出式对话框，包括错误、警告、帮助、信息、用户输入对话框等。无需编写脚本和回调函数或构建\
  \ GUI 即可创建它们。这些消息框最常见的用途之一是向用户传递消息。通常，创建这些弹出式消息框非常简单，只需要一个命令。除用户输入框外，所有对话框和消息框都可以通过一个通用命令调用和生成：`errordlg()`、`warndlg()`、`helpdlg()`\
  \ 和 `msgbox()`。另一方面，用户输入对话框需要几个命令，例如输入对话框的名称、输入对话框窗口的标题/消息以及输入对话框窗口。让我们看几个示例，了解如何创建这些消息框、用户输入对话框窗口以及输入状态框。\n\
  \n### 错误对话框\n\n通用命令语法：`errordlg('添加备注')`\n\n示例：\n\n```\nerrordlg(['时间已到！' '今天是 '\
  \ date])\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fige_HTML.jpg](img/471979_1_En_3_Fige_HTML.jpg)\n\
  \n### 警告消息\n\n通用命令语法：`warndlg('添加备注')`\n\n示例：\n\n```\nwarndlg(['室外温度为 ' num2str(-20)\
  \ ' C；因此，请相应着装！！！'])\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figf_HTML.jpg](img/471979_1_En_3_Figf_HTML.jpg)\n\
  \n### F1 帮助/消息框\n\n通用命令语法：\n\n```\nhelpdlg('添加备注')\n```\n\n示例：\n\n```\nhelpdlg('您有什么问题？',\
  \ '这是帮助热线');\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figg_HTML.jpg](img/471979_1_En_3_Figg_HTML.jpg)\n\
  \n第二个示例：\n\n```\nCreateStruct.WindowStyle='replace';\nCreateStruct.Interpreter='tex';\n\
  msgbox('f(\\alpha) = e^{cos(\\omega*\\alpha)}','函数: ',CreateStruct);\n```\n\n请注意，此示例中使用的\
  \ `CreateStruct` 是一个 `struct` 类型的变量，它创建了一个结构类型变量，包含两个字符类型字段——名为 `WindowStyle`，值为\
  \ `replace`；以及名为 `Interpreter`，值为 `tex`。它们会被 MATLAB 自动识别。如果不创建包含 `WindowStyle` 和\
  \ `Interpreter` 这两个字段的 `CreateStruct` 变量，则等式将按原样显示在消息框中：*f*(*α*) = *e*^(cos(*ωα*))\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figh_HTML.jpg](img/471979_1_En_3_Figh_HTML.jpg)\n\
  \n最后：\n\n```\nmsgbox('\\copyright by NDSU', '版权',CreateStruct)\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figi_HTML.jpg](img/471979_1_En_3_Figi_HTML.jpg)\n\
  \n### 通用语法\n\n创建帮助/消息/错误/警告消息还有其他方法。通用命令语法是：\n\n```\nHM = msgbox('消息', '框标题', '图标')\n\
  ```\n\n这里仅是一个消息框：\n\n```\nmsgbox('Hello World', '我的消息')\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figj_HTML.jpg](img/471979_1_En_3_Figj_HTML.jpg)\n\
  \n这是一个警告消息：\n\n```\nmsgbox('Hello World', '我的消息', 'warn')\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figk_HTML.jpg](img/471979_1_En_3_Figk_HTML.jpg)\n\
  \n这是一个带有错误符号的消息框：\n\n```\nmsgbox('Hello Students', '我的消息', 'error')\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figl_HTML.jpg](img/471979_1_En_3_Figl_HTML.jpg)\n\
  \n这是一个带有信息符号的消息框：\n\n```\nmsgbox('Hello Students', '我的消息', 'help')\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figm_HTML.jpg](img/471979_1_En_3_Figm_HTML.jpg)\n\
  \n### 输入对话框\n\n通用命令语法：\n\n```\nANSWER = inputdlg(PROMPT,NAME)\n```\n\n这是一个简短的脚本：\n\
  \n```\nEnter1={'输入要演变的傅里叶级数项数，然后点击[确定]并等待: '}; % 消息\nName1='傅里叶级数项数的输入'; % 对话框名称\n\
  Numlines = 1; % 输入对话框的行数\nANSWER=inputdlg(Enter1, Name1, Numlines); % 生成并读取输入对话框\n\
  [n status] = str2num(ANSWER{1}); % 将用户输入赋值给变量 n\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Fign_HTML.jpg](img/471979_1_En_3_Fign_HTML.jpg)\n\
  \n\n\n### 问题对话框\n\n通用命令语法：\n\n```\n|ButtonName = questdlg('Your Question ...', 'Question?',\
  \ 'Option1', 'Option2', ....)\n```\n\n一个示例：\n\n```\nYA= questdlg('请选择你对问题：\"你感觉如何？\"\
  \ 的回答','问题','非常好','我还能工作一会儿','有点累','')\n```\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figo_HTML.jpg](img/471979_1_En_3_Figo_HTML.jpg)\n\
  \n让我们看一个包含多个选项的更复杂示例。\n\n#### 做出选择\n\n你正在一家咖啡馆里，想要买点东西。你想从菜单中做出选择：咖啡、茶或一些甜点。咖啡馆有一些你并不知道的缺货情况。需要根据你的订单和咖啡馆的缺货情况来显示消息和对话框，例如警告、帮助、输入或错误消息。以下是此脚本中需要实现的步骤。\n\
  \n- 步骤 0。你在咖啡馆里，一位服务员走过来准备接受你的点单。\n- 步骤 1。你在咖啡、茶和巧克力蛋糕之间做出决定。\n- 步骤 2。服务员回应说，他们实际上不提供茶，并且巧克力蛋糕已经卖完了。\n\
  - 步骤 3。然后你选择咖啡类型：普通、浓或特制（根据你的口味）。\n- 步骤 4。你品尝并评价咖啡。\n- 步骤 5。你付款并留下小费。\n\n以下是答案脚本：\n\
  \n```\nclearvars\n% 是时候喝咖啡了，我们去咖啡馆吧...\n% 步骤 0\nH1 = msgbox('你在一家咖啡馆，正在点你最爱口味的咖啡',\
  \ '咖啡馆');\npause(2), delete(H1)\n% 步骤 1. 点咖啡\nH2 = msgbox('今天能为您做点什么？您想要咖啡还是甜点？',\
  \ ...\n'服务员已到');\npause(3), delete(H2)\n% 回答你想要什么\nYA= questdlg('你的回答：\"你想要咖啡还是甜点？\"\
  \ ','问题', ...\n'咖啡', '茶', '巧克力蛋糕', '');\nswitch YA\ncase '咖啡'\nCA = questdlg('你的回答：\"\
  好的。您想要哪种咖啡？\" ','问题', ...\n'普通', '浓', '特制', '');\ncase '茶'\nH3=warndlg(['抱歉！我们不提供'\
  \ '茶。或许来点别的？']); pause(2)\ndelete(H3)\ncase '巧克力蛋糕'\nH4=errordlg(['非常抱歉！' '没有蛋糕了']);\
  \ pause(2)\ndelete(H4)\nend\nResponse=exist('CA', 'var');\nif Response ==1\nswitch\
  \ CA\ncase '普通'\nHN=warndlg(['普通咖啡是', ...\n' 3 茶匙咖啡+3 汤匙牛奶+1 茶匙糖']);\npause(3),\
  \ delete(HN)\ncase '浓'\nHS=warndlg(['浓咖啡是', ...\n' 4 茶匙咖啡+2 汤匙牛奶+2 茶匙糖']);\npause(3),\
  \ delete(HS)\ncase '特制'\nHS = msgbox('选择：要加多少咖啡、牛奶和糖？', '选择');\npause(3), delete(HS)\n\
  Call = '点你的咖啡';\nSelection = {'咖啡要多少茶匙：', ...\n'牛奶要多少汤匙：', '糖要多少茶匙：'};\nn_lines=[1,\
  \ 13];\nANS=inputdlg(Selection, Call, 1, {'', '', ''});\nend\nOK = msgbox('你已经喝完了咖啡',\
  \ '你即将离开');\npause(5), delete(OK)\nPB= questdlg('服务员问：\"咖啡味道如何？\" ','问题', ...\n\
  '非常好', '不错', '嗯...还行吧', '');\nswitch PB\ncase '非常好'\nhelpdlg('非常感谢！4 美元+1 美元（小费）',\
  \ '这是账单');\ncase '不错'\nhelpdlg('谢谢！4 美元+0.50 美元（小费）', '这是账单');\ncase '嗯...还行吧'\n\
  helpdlg('谢谢！4 美元（无小费）', '这是账单');\nend\nelse\nH5 = msgbox('再见！下次见！', '服务员离开');\n\
  pause(4), delete(H5)\nend\n```\n\n请注意，在此脚本中，我们使用了 MATLAB 的内置函数 `exist`，它用于验证工作区中是否存在特定变量。它使用命令语法\
  \ `exist('N', 'var')` 来确定变量 `N` 是否在工作区中可用。它也可以用来验证当前目录下是否存在任何特定文件。例如，`exist('MY_fun.c',\
  \ 'file')` 检查 MATLAB 当前目录下是否存在名为 `MY_fun.c` 的文件。内置函数 `exist()` 的输出可以是 0、1 或 2。0\
  \ 表示变量或文件不存在，1 表示变量存在，2 表示文件存在于当前目录。\n\n当执行这个脚本时，会显示两个消息框（`H1` 和 `H2`）两到三秒钟，然后自动关闭。接着下一个问题对话框会弹出，你需要选择咖啡、茶或巧克力蛋糕。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figp_HTML.jpg](img/471979_1_En_3_Figp_HTML.jpg)\n\
  \n根据你的选择，其他选项和响应会出现。如果你选择咖啡，问题对话框（`CA`）会弹出，并要求你选择咖啡类型：普通、浓或特制。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figq_HTML.jpg](img/471979_1_En_3_Figq_HTML.jpg)\n\
  \n如果你在对话框（`CA`）中选择普通或浓，会弹出一个窗口显示你选择的咖啡在咖啡、牛奶和糖方面的配方。如果你选择特制类型咖啡，你需要输入（输入对话框 `ANS`）你想要的咖啡、牛奶和糖的用量。\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figr_HTML.jpg](img/471979_1_En_3_Figr_HTML.jpg)\n\
  \n消息框（`OK`）弹出并在五秒钟后自动关闭。最后，服务员会询问你咖啡的味道如何。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figs_HTML.jpg](img/471979_1_En_3_Figs_HTML.jpg)\n\
  \n根据你的回答，你会看到一个帮助对话框，指示需要支付多少钱，包括小费。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figt_HTML.jpg](img/471979_1_En_3_Figt_HTML.jpg)\n\
  \n如果你选择茶，警告对话框（`H3`）会弹出并在两秒后自动关闭。如果你选择巧克力蛋糕，错误对话框（`H4`）会弹出并在两秒后自动关闭。\n\n如果你在第一步选择了茶或巧克力蛋糕，则会显示最后一个消息框（`H5`）。\n\
  \n这些消息和对话框也可以以非常相似的方式在函数文件中使用。\n\n\n\n#### 为方程提供输入\n\n这个简单的数值模拟练习通过向函数文件写入一个数值来计算一个数学方程的值：`F\
  \ = e^(cos(ωt))`。\n\n其可变输入如下：\n\n-   无输入，此时采用默认值 `ωn = 13; t = 0:π/100:π;`\n-  \
  \ 一个输入，即 `ω[n]` 或 `t`，此时缺失的参数采用默认值\n-   两个输入，即 `ω[n]` 和 `t`，此时会弹出一个错误对话框。\n\n以下是该练习的完整答案脚本：\n\
  \n```\nfunction F = ERR(varargin)\n% HELP. ERR.m simulates how to employ ERROR dialog\
  \ box\nwarndlg('Note that this is a varargin function file ');\nif nargin == 0\n\
  omega = 13; t = 0:pi/100:pi;F = exp(cos(omega*t)); plot(t, F, 'bo--'), shg\nelseif\
  \ nargin == 1 && numel(varargin{1})==1\nomega=varargin{1}; t = 0:pi/100:pi;F = exp(cos(omega*t));\
  \ plot(t, F, 'bo--')\nelseif nargin == 1 && numel(varargin{1})>1\nt = varargin{1};\
  \ omega=13;F = exp(cos(omega*t)); plot(t, F, 'bo--')\nelseif nargin ==2 && numel(varargin{1})==1\n\
  omega=varargin{1}; t =varargin{2};F = exp(cos(omega*t)); plot(t, F, 'bo--')\nelseif\
  \ nargin == 2 && numel(varargin{1})>1\nomega=varargin{2}; t = varargin{1};F = exp(cos(omega*t));\
  \ plot(t, F, 'bo--')\nelse\nerrordlg(['Wrong Number of Inputs!' num2str(nargin)\
  \ ' are too many INPUTs'])\ndisp('No OUPUTS')\nF=warndlg(['No OUTPUTS because '\
  \ num2str(nargin) ' are too many INPUTS']);\nend\nend\n```\n\n让我们从命令窗口模拟上述函数文件 (`ERR.m`)：\n\
  \n```\n>> omega = 13; t = 0:pi/100:pi; OmegaN=13;\n>> F = ERR(omega, OmegaN, t);\n\
  No OUPUTS\n```\n\n这些警告和错误对话框会显示出来。\n\n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figu_HTML.jpg](img/471979_1_En_3_Figu_HTML.jpg)\n\
  \n![../images/471979_1_En_3_Chapter/471979_1_En_3_Figv_HTML.jpg](img/471979_1_En_3_Figv_HTML.jpg)\n\
  \n至此，我们对 GUI 工具和函数的简要讨论就结束了。这些工具非常方便，可以与 M/MLX 文件和函数文件关联，借助 GUI 工具使脚本更易于使用。\n\n\
  # MEX 文件、C/C++ 和独立应用程序\n\n`MEX` 代表 *MATLAB 可执行文件*，它是一种直接从 MATLAB 调用自定义 C、C++ 或 FORTRAN\
  \ 例程/代码的方式，从而将它们视为 MATLAB 的内置函数。由于 MATLAB 与多种编程语言兼容，包括 C/C++、FORTRAN、C# 和 Java，\
  \ `MEX` 文件可以像 `M 文件` 或 `M 函数` 一样在 MATLAB 环境中被直接调用。也可以在 MATLAB 中创建作为自执行文件的独立应用程序。\n\
  \nMATLAB 的 `Coder` 工具箱非常强大，能够创建独立且可自执行的 C 代码。了解如何从 MATLAB 的 `M 文件` 创建 C 代码非常有益，因为\
  \ C 编程语言是免费的，没有任何许可要求。它可以用来创建可执行文件、动态链接库以及大型应用程序的库。实际上，C 语言可用于解决各种类型应用中的广泛任务。\n\n\
  我们有多种理由创建或使用 `MEX` 文件。其中之一是它们能够直接从 MATLAB 调用大型现有的 C、C++ 或 FORTRAN 程序，而无需将其重写为 `M\
  \ 文件`。另一个原因是为了加速计算过程，尤其是在 `M 文件` 存在瓶颈的地方。例如，`MEX` 文件可用于基于大型循环的计算，以避免耗时计算过程中的瓶颈。`MEX`\
  \ 文件在多个方面优于 `M 文件`。它们作为可执行文件被调用和执行，无需像 `M 文件` 那样需要进行编译。它们可以直接从 MATLAB 调用大型现有的 C\
  \ 或 FORTRAN 例程，而无需重写为 `M 文件`。此外，`MEX` 文件支持并行性，因此我们可以为各种（在机器时间方面）成本高昂且无法向量化的计算和模拟编写多线程\
  \ C 代码。\n\n## 验证编译器\n\n在开始生成 `MEX` 文件之前，最好先验证当前 MATLAB 软件包中安装了哪些编译器。这可以通过在命令窗口提示符下键入以下命令来完成：\n\
  \n```\n>> mex –setup\n```\n\n然后，我们按照指示从已安装的编译器列表中选择合适的编译器。如果没有安装编译器，我们需要安装一个与 MATLAB\
  \ 兼容的编译器，以便生成 `MEX` 文件（兼容编译器列表可在 MathWorks 网站上找到：[`https://www.mathworks.com/support/requirements/previous-releases.html`](https://www.mathworks.com/support/requirements/previous-releases.html)）。图\
  \ 4-1 显示了 MATLAB 中 C/C++ 代码生成的一般流程图。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig1_HTML.jpg](img/471979_1_En_4_Fig1_HTML.jpg)\n\
  \n**图 4-1** C/C++ 代码生成流程图\n\n接下来，我们将演示几个示例，包括将 `M 文件` 转换为 C/C++、`MEX` 和可执行的独立应用程序，编译\
  \ C 代码，并在 MATLAB 环境中进行测试。\n\n## 生成 C 代码\n\n这个简单的示例将在 MATLAB 中生成 C 代码，以根据用户指定的整数计算奇数和。我们首先编写一个\
  \ `M 文件`，然后使用名为 MATLAB `Coder⁴` 的代码生成器应用程序工具，将其转换为 MATLAB 中的 `MEX` 文件。该工具用于从 MATLAB\
  \ 代码为各种硬件平台、嵌入式系统和桌面平台生成 C 和 C++ 代码。生成的代码可以作为源代码、库和/或动态库集成到现有的程序和项目中。\n\n\n\n###\
  \ 注意\n\n`MATLAB Coder` 是一个独立的应用程序，不随基础 MATLAB 软件包提供，需要单独安装。\n\n让我们以一个名为 `SUModd.m`\
  \ 的 M 文件函数为例，该函数计算直到用户指定整数 `N` 的奇数之和。\n\n```\nfunction SUModd(N)\n%#codegen\nSum=0;\
  \ ii=1;\nwhile ne(ii,N)\nif ne(mod(ii,2),0)\nSum=Sum+ii;\nelse\nSum=Sum;\nend\n\
  ii=ii+1;\nend\nSum\n```\n\n请注意，`SUModd.m` 函数的第二行是一条指令（注释），`%#codegen`。建议我们在要转换为\
  \ MEX 文件的 M 文件中包含此注释。M 文件的转换可以通过三种方式实现。使用以下命令：\n\n```\n>> mex SUModd.m\n```\n\n\
  或者在命令窗口中输入 `>> coder`，或者使用主菜单中 `APPS` 选项卡下的 `MATLAB Coder`^(⁵) 选项 ![../images/471979_1_En_4_Chapter/471979_1_En_4_Figa_HTML.jpg](img/471979_1_En_4_Figa_HTML.jpg)。当我们点击\
  \ `MATLAB Coder` 图标时，`MATLAB Coder` 的 GUI 窗口会弹出。然后，我们在 `Generate Code for Function`\
  \ 框中指定要转换为 C/C++ 和 MEX 的 M 文件的名称，并输入变量类型 `N`（single、double、int8、uint8、int16、uint16、…\
  \ 结构体、复数等）和大小（1x1、… mxn）。\n\n按下回车键后，如果转换 MATLAB 函数没有问题，`MATLAB Coder` 将自动生成包含所有\
  \ `*.c` 和 `*.h` 源代码的 MEX 文件。我们通过从下拉选项中选择要生成的源代码类型来启动代码生成过程。在这种情况下，我们可以选择 `C/C++\
  \ 源代码`、`MEX`、`静态库 (.lib)`、`动态库 (.dll)` 和 `可执行文件 (.exe)`，如图 4-2 所示。请注意，这些选项取决于操作系统和平台。在我们的例子中，我们在\
  \ Windows 操作系统环境下工作，因此这些库适用于 Windows 操作系统。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig2_HTML.jpg](img/471979_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2 选择生成的 C/C++ 源代码类型\n\n接下来，我们需要选择使用哪种语言——C 或 C++——来创建 MEX 文件（见图 4-3）。\n\n\
  ![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig3_HTML.jpg](img/471979_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3 通过 `MATLAB Coder` 从 MATLAB 脚本生成 C/C++ 的 GUI 窗口\n\n然后我们选择设备厂商和类型——生产硬件、主机计算机类型（见图\
  \ 4-4）。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig4_HTML.jpg](img/471979_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4 生产硬件和处理器类型选择选项\n\n我们还可以从 `更多设置` 区域进行一些额外调整，如图 4-5 所示。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig5_HTML.jpg](img/471979_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5 Coder GUI 窗口工具的 `更多设置` 选项\n\n如果没有错误或警告，将会显示生成的 C 代码及其目标源代码（见图 4-6）。MEX 文件可以在\
  \ MATLAB 工作区或任何 M 文件中打开，就像打开任何 MATLAB 函数文件或 M 文件一样。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig6_HTML.jpg](img/471979_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6 从名为 `SUModd.m` 的源代码生成的 MEX 文件内容和库\n\n图 4-6 显示了成功生成的名为 `SUModd_mex.c` 的 MEX\
  \ 文件。它保存在 MATLAB 的当前（工作）目录中。\n\n将 M 文件转换为 MEX 文件的过程可能涉及编码和转换方面的问题，因为许多 MATLAB 函数与\
  \ C 不兼容。例如，让我们修改 M 文件（在我们最初名为 `SUModd.m` 的 M 文件中），添加用于计算运行时间的 `tic` 和 `toc` MATLAB\
  \ 命令，然后尝试重新创建 MEX 文件。\n\n对 M 文件进行这些修改后，Coder 会提示图 4-7 中所示的两个兼容性问题。从 M 文件中删除 `tic`\
  \ 和 `toc` 这两个命令并保存更新版本后，我们重新编码，然后不再收到警告。随后，转换后的代码完美运行。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig7_HTML.jpg](img/471979_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7 将 M 文件转换为 MEX 文件时，`tic` 和 `toc` 命令出现两个错误/问题\n\n调用和使用 MEX 文件的过程与任何 M 文件类似。对于此示例，可以通过以下方式调用创建的\
  \ MEX 文件：\n\n```\n>> SUModd_mex(N)\n```\n\n它也可以在任何 M 文件中以类似方式调用。请注意，`N` 是根据初始步骤中\
  \ MEX 文件使用的变量类型和大小在 MATLAB 工作区中预定义的。在处理 `for` 和 `while` 循环时，MEX 文件相对于 M 文件最重要的优势之一是其速度，换句话说，就是计算效率。例如，从之前的例子中，我们可以展示\
  \ MEX 文件相对于其源 M 文件的效率。\n\n```\n% 比较 MATLAB 和 MEX 文件的计算效率\nclearvars; N=1e+8;\nTmatlab=cputime;\
  \ SUModd(N), TM=cputime-Tmatlab;\nfprintf('M 文件计算时间为 %5.5f 秒 \\n', TM);\nclearvars;\
  \ N=1e+8;\nTmex=cputime; SUModd_mex(N), TMEX=cputime-Tmex;\nfprintf('MEX 文件计算时间为\
  \ %5.5f 秒 \\n', TMEX);\n```\n\n每个文件的（运行）计算时间如下：\n\n*   M 文件计算时间为 9.26115 秒\n*  \
  \ MEX 文件计算时间为 1.06168 秒\n\n因此，MEX 文件的计算时间比原始 M 文件短约九倍。此外，必须注意，当 M 文件和 MEX 函数中存在相同文件名时，MEX\
  \ 文件优先于 M 文件。\n\n## 从其他语言创建 MEX 文件\n\nMEX 文件也可以从 C/C++ 或 FORTRAN 源代码创建。这可以通过单个命令完成：\n\
  \n```\n>> mex HELLO.c\n```\n\n另一个替代命令是：\n\n```\n>> mex -v HELLO.c\n```\n\n在后一种情况下，`-v`\
  \ 标志会显示编译和链接过程。请注意，C 语言的源代码 `HELLO.c`（如下所示）已经创建并放置在 MATLAB 的工作目录中。\n\n```\n#include\
  \ \"mex.h\" /* 始终包含此头文件 */\nvoid mexFunction(int nlhs, mxArray *plhs[], /* 输出变量\
  \ */\nint nrhs, const mxArray *prhs[]) /* 输入变量 */\n{\n/* 做一些有趣或好玩的事情 */\nmexPrintf(\"\
  Hello WORLD:)...:), This is SALOMON ... world!\\n\");\nreturn;\n}\n```\n\n从源代码 `HELLO.c`\
  \ 创建的 MEX 文件（名为 `HELLO_mex.mexw64`）可以通过在命令窗口中调用来执行：\n\n```\n>> HELLO_mex\n```\n\n\
  该命令输出以下内容：\n\n```\n>> Hello WORLD:)...:), This is SALOMON ... world!\n```\n\n请注意，MEX\
  \ 文件的扩展名，无论是 `mexw32` 还是 `mexw64`，都指示用户计算机上运行的处理器类型（操作系统）。\n\n在这里，我们介绍了创建 MEX 文件的一般步骤；然而，具体步骤取决于系统。换句话说，它们取决于安装了哪个操作系统、安装和使用了哪个\
  \ MATLAB 版本和编译器等等。因此，有必要为每个平台重新编译 MEX 文件。开发 MEX 文件时最关键的一个挑战是问题陈述必须以向量形式呈现。如果不是，那么创建的\
  \ MEX 应用程序将会相当慢。\n\n\n\n# 构建独立应用程序\n\n独立应用程序可以在未安装 MATLAB 软件包的机器/计算机上安装和运行。要从 MATLAB\
  \ 代码/脚本编译/创建独立应用程序，除了 MATLAB 软件包外，还需要 MATLAB Application Compiler。从现有的 MATLAB 脚本生成独立应用程序是一个直接的过程，可以通过多种方式完成。我们可以运行以下命令：\n\
  \n```\n>> mcc\n```\n\n或者，我们可以使用带有 GUI 工具的 MATLAB Application Compiler，通过选择 APPS\
  \ 选项卡 ➤ APPLICATION DEPLOYMENT ➤ MATLAB Application Compiler ![../images/471979_1_En_4_Chapter/471979_1_En_4_Figb_HTML.jpg](img/471979_1_En_4_Figb_HTML.jpg)\
  \ 来访问。\n\n当我们点击 ![../images/471979_1_En_4_Chapter/471979_1_En_4_Figc_HTML.jpg](img/471979_1_En_4_Figc_HTML.jpg)\
  \ 图标时，MATLAB Application Compiler 的 GUI 窗口将打开，如图 4-8 所示。我们可以执行以下操作，如图 4-8 上的数字标注所示。(1)\
  \ 我们可以通过点击添加 + 按钮来添加一个主文件名（M 文件）。(2) 我们可能还需要向应用程序添加信息，例如应用程序名称、作者姓名、电子邮件、公司、摘要、描述等。(3)\
  \ 我们可以通过点击占位符并添加照片/截图来添加/更改自定义启动画面。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig8_HTML.jpg](img/471979_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8\n\nMATLAB Compiler 的独立应用程序 GUI 开发工具\n\n(4) 我们还可以通过“设置”图标调整设置，例如传递给 MATLAB\
  \ Compiler 的任何附加参数、测试和最终用户文件的输出文件夹位置以及软件包安装程序。(5) 在步骤 1 中添加文件名以创建可执行的独立应用程序后，“打包”图标将变为可用状态（见图\
  \ 4-9）。\n\n请注意，在此示例中，我们使用名为 `QUAD_eqn_SIM.m` 的函数文件（在第 3 章中创建的 GUI 模型）来生成独立应用程序。此外，我们还添加了一些关于项目的信息，并为自定义启动画面添加了一张照片。完成所有这些步骤后，我们点击\
  \ ![../images/471979_1_En_4_Chapter/471979_1_En_4_Figd_HTML.jpg](img/471979_1_En_4_Figd_HTML.jpg)\
  \ 图标，并指示保存独立应用程序项目的位置。\n\n然后，创建独立应用程序的过程开始，如图 4-9 所示。这可能需要几分钟时间，具体取决于原始 M 文件的复杂性，以及它是否还调用/使用其他\
  \ M 文件和数据（`.mat` 文件），是否使用 GUI 工具等。如果在独立应用程序的打包过程中没有遇到有问题的错误或问题，新应用程序将被创建并打包到三个文件夹中——`for_redistribution`、`for_redistribution_files_only`\
  \ 和 `for_testing`——以及一个名为 `PackagingLog.txt` 的日志文件中。这些由编译器自动生成。为了验证生成的独立应用程序，我们打开名为\
  \ `for_testing` 的文件夹（或单击超链接的“打开输出文件夹”），并在此文件夹中，通过点击运行 `QUAD_eqn_SIM.prj` ![../images/471979_1_En_4_Chapter/471979_1_En_4_Fige_HTML.jpg](img/471979_1_En_4_Fige_HTML.jpg)。\n\
  \n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig9_HTML.jpg](img/471979_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9\n\n指示已成功完成编译的独立应用程序项目 `QUAD_eqn_SIM.prj` 的说明\n\n### 注意\n\n当独立应用程序的打包/编译过程完成后，将生成三个文件夹——`for_redistribution`、`for_redistribution_files_only`\
  \ 和 `for_testing`——以及一个名为 `PackagingLog.txt` 的日志文件。这些由 MATLAB Application Compiler\
  \ 自动生成。\n\n创建的独立应用程序打开，如图 4-10 所示。现在可以用一些输入项对其进行测试。\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig10_HTML.jpg](img/471979_1_En_4_Fig10_HTML.jpg)\n\
  \n图 4-10\n\n完整的独立应用程序\n\n我们可以使用以下输入项测试我们新创建的应用程序：—`a = 2`，`b = 7` 和 `c = 3`—并设置\
  \ `xmin = -5` 和 `xmax = 5` 进行绘图。结果显示在图 4-11 中。因此，现在这个独立应用程序可以安装在任何计算机上，并且无需 MATLAB\
  \ 软件包即可运行。独立应用程序的安装包是一个可执行文件，名为 `MyAppinstaller_web.exe`。这个 `*.exe` 文件位于名为 `for_redistribution`\
  \ 的文件夹内。该应用程序可以通过在任何计算机上双击此 `*.exe` 文件进行安装。它可以在没有 MATLAB 软件包的情况下无缝运行，如图 4-12 所示。我们只需选择要安装应用程序的文件夹，然后按照软件包安装的其他几个标准步骤进行操作。请注意，此安装过程可能需要几分钟时间。\n\
  \n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig12_HTML.jpg](img/471979_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n`QUAD_eqn_SIM` 独立应用程序安装过程\n\n![../images/471979_1_En_4_Chapter/471979_1_En_4_Fig11_HTML.jpg](img/471979_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11\n\n带有仿真结果的完整独立应用程序\n\n一旦独立应用程序安装完成，它将出现在计算机的程序列表中，并且可以像任何其他程序一样通过单击或使用其快捷图标启动。\n\
  \n### 注意\n\n唯一的安装 `*.exe` 文件（称为 `MyAppinstaller_web.exe`）位于名为 `for_redistribution`\
  \ 的文件夹内。这是在任何机器上安装所开发应用程序所需的唯一文件。\n\n请注意，与 MEX 文件一样，独立应用程序也是系统相关的。换句话说，如果我们在 MATLAB\
  \ 中的 64 位处理器操作系统计算机上创建了一个独立应用程序，它只能在没有安装 MATLAB 软件包的 64 位处理器操作系统计算机上运行。因此，对于每种系统类型，我们都必须重新编译独立应用程序。此外，必须注意，MATLAB\
  \ 中各种工具箱内有许多函数和工具，如果我们使用了 MATLAB 和/或软件包中特定工具箱的函数或工具，并打算创建独立应用程序，MATLAB Compiler\
  \ 可能会因显而易见的原因而无法打包这些应用程序。另一方面，基于 MATLAB 与这些独立应用程序的不兼容性，从 GUI 模型创建独立应用程序是可行的，但存在一些限制。\n\
  \n\n\n# 5. Simulink 建模基础\n\n`Simulink`^(⁷) 是一个图形化编程包，它与 `MATLAB` 协同工作，并作为一个组合包进行交互。它用于动态系统的建模、仿真与分析、控制算法开发等。它支持线性和非线性系统、连续和离散系统以及多速率系统。使用\
  \ `Simulink`，您可以对多种类型的系统、过程和问题进行建模，并可以采用自顶向下和自底向上的方法。\n\n`Simulink` 包与 `MATLAB`\
  \ 一样，具有可扩展性。通过使用其标准模块，您可以开发自己的模块库和子系统，并将其添加到现有的 `Simulink` 库中进行扩展。在我们的 `Simulink`\
  \ 模型中，我们可以将连续系统与离散系统结合起来。从用户的角度来看，使用该包的主要优势之一是，通过模块图来建模要容易得多，而无需用户具备任何编程基础或经验。在\
  \ `Simulink` 中，您只需拖拽、放置并连接模块，当然，还可以调整模型中的参数、求解器等。`Simulink` 包的另一个显著优势是其模型可以与 `MATLAB`\
  \ 交互式工作，并且可以通过 `MATLAB` 命令窗口以及 `M`/`MLX` 文件和函数文件进行操作/执行。\n\n## Simulink 建模\n\n要从\
  \ `MATLAB` 启动该包，您只需在命令窗口中键入 `>> simulink`，点击菜单栏中的 Simulink 图标 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figa_HTML.jpg](img/471979_1_En_5_Figa_HTML.jpg)，或点击\
  \ ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figb_HTML.jpg](img/471979_1_En_5_Figb_HTML.jpg)\
  \ 和 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figc_HTML.jpg](img/471979_1_En_5_Figc_HTML.jpg)\
  \ Simulink 模型。此时将弹出图 5-1 所示的窗口。从 Simulink 启动窗口，您可以从右侧窗格（打开）打开现有模型（最近使用过的），或通过点击空白模型或其他选项来创建新模型。此外，“示例”选项卡允许用户打开、研究并修改现有示例。这里有来自工程、物理、计算、图像处理、代码生成等不同领域的数十个示例。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig1_HTML.jpg](img/471979_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\nSimulink 的启动窗口\n\n图 5-1 展示了 `Simulink` 包的默认启动窗口。请注意，`Simulink` 是一个独立的包，并且有一些可安装的工具箱和附加产品（见图\
  \ 5-2）。一旦从 Simulink 库浏览器中安装了额外的库和附加产品的所有模块，它们即可使用。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig2_HTML.jpg](img/471979_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\nSimulink 的启动窗口及其中安装的附加工具箱\n\n### 示例：算术运算\n\n我们通过以下简单示例来演示如何构建一个计算四个不同标量的加法、乘法和减法的\
  \ `Simulink` 模型。完整的模型如图 5-3 所示。它由 `Constant`（常量）、`Gain`（增益）、`Sum`（求和）和 `Display`（显示）模块组成。在常量模块中输入的标量分别为\
