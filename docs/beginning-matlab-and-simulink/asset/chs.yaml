  \n汽车到完全静止的平均加速度等于：\n\n![$$ a=\\frac{\\Delta v}{\\Delta t}=\\frac{v_0-v}{\\Delta\
  \ t}=-\\frac{v}{\\Delta t}=-544.44\\ m/ se{\\mathrm{c}}² $$](img/471979_1_En_5_Chapter_TeX_IEq39.png)\n\
  \n注意，这大约是 55*g*，意味着非常大的加速度（减速度）从惯性力中吸收了大量能量并将其转化为热量。编写一个函数文件，针对任何类型、以不同行驶速度 *v*\
  \ 行驶的汽车的碰撞测试，计算 `a` 作为 Δ*x*（针对不同类型的前保险杠）和 *v* 的函数（对于所有情况，取 `v[0] = 0`）。\n\n### 练习\
  \ 23\n\n创建一个函数文件（命名为 `Ex23.m`）。它应有一个输入参数（枫树的种植年份，是一个四位整数：0 … 2018）和两个输出变量：`AGE`（计算出的枫树年龄）和\
  \ `NOTE`（枫树的年龄状态），以及带有提示信息的警告/消息框。\n\n1.  如果树的种植年份在 1000 年之前，则输出为：`NOTE = \"CANNOT\
  \ be TRUE\"`，`AGE = []`（空值），并显示一个带有提示信息 `\"Check Your Entry\"` 的错误框。\n\n2.  如果树的种植年份在\
  \ 1000 到 1918 年之间，则输出为：`NOTE = \"NEED to be PROTECTED\"`，`AGE = [∀]`（相对于当前年份计算出的年龄），以及一个带有提示信息\
  \ `\"Maple Tree is to be Under Protection\"` 的警告对话框。\n\n3.  如果树的种植年份在 1919 到 2000\
  \ 年之间，则输出为：`NOTE = \"WELL fit\"`，`AGE = [∀]`（相对于当前年份计算出的年龄），以及一个带有提示信息 `\"GOOD one\
  \ for a timber\"` 的消息框。\n\n4.  如果树的种植年份在 2001 到 2018 年之间，则输出为：`NOTE = \"TOO young\"\
  `，`AGE = [∀]`（相对于当前年份计算出的年龄），并显示一个带有提示信息 `\"TOO young for timber\"` 的消息框。\n\n###\
  \ 练习 24\n\n阿基米德螺线（也称为阿基米德螺旋）是一条螺旋曲线（以公元三世纪的希腊数学家阿基米德命名）。螺线的方程使用以下方程在极坐标系中表示：*r*\
  \ = *a* + *bθ*。其中 *r* 是到原点的距离，*θ* 是该点相对于原点的弧度角。方程中的参数 *a*、*b* 是实数，分别控制螺线的位置和连续螺线匝之间的距离。\n\
  \n1.  使用向量化方法计算当 ![$$ \\theta =0:\\frac{\\pi }{10000}:13\\pi, a=-1.25,b=-2.25 $$](img/471979_1_En_5_Chapter_TeX_IEq40.png)\
  \ 时的阿基米德螺线。\n\n2.  使用 `for ... end` 和 `while ... end` 循环（不分配内存）计算当 ![$$ \\theta\
  \ =0:\\frac{\\pi }{10000}:13\\pi, a=-1.25,b=-2.25 $$](img/471979_1_En_5_Chapter_TeX_IEq41.png)\
  \ 时的阿基米德螺线。\n\n3.  使用 `for ... end` 和 `while ... end` 循环（分配内存）计算当 ![$$ \\theta =0:\\\
  frac{\\pi }{10000}:13\\pi, a=-1.25,b=-2.25 $$](img/471979_1_En_5_Chapter_TeX_IEq42.png)\
  \ 时的阿基米德螺线。\n\n4.  使用 `tic ... toc` 比较步骤 2 和步骤 3 相对于步骤 1 的计算效率。\n\n### 练习 25\n\n\
