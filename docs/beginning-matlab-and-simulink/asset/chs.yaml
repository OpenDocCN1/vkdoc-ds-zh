  5.  将当前路径和函数句柄保存到一个名为 `EX44` 的结构数组中。\n\n# 2. 编程基础\n\n本章涵盖了 MATLAB 中最基本且最常用的编程工具、运算符和控制语句、Simulink\
  \ 中的建模基础、图形用户界面开发及其工具，以及 MATLAB 可执行文件和独立应用程序的开发。\n\n本章还包含一些简单的示例，这些示例展示了在 MATLAB/Simulink\
  \ 中进行编程和建模以节省计算时间的有效方法和工具。它解释了如何创建简短紧凑的代码/脚本，并包含一些编写健壮程序和脚本的基本提示和方法。\n\n在整本书中，关键词——脚本、代码、程序、`M`\
  \ 文件、`MLX` 文件和函数文件——被频繁用于指代在 MATLAB 中编写和执行的程序。本书上下文中使用的术语——如代码、脚本和程序，例如 `M`/`MLX`\
  \ 文件和函数文件——指的是用户可读的源代码，而非计算机理解的机器代码。\n\n\n\n# 编写 M/MLX 文件\n\n前一章通过示例讨论了数组、字符、元胞、结构体、表格和逻辑数组，并概述了\
  \ M/MLX 文件编辑器。脚本（M/MLX 文件）也可以在记事本或写字板编辑器中编写。只要文件以 `*.m` 或 `*.mlx` 扩展名命名，它们就会成为 M\
  \ 文件。它们也可以使用记事本编辑器打开和编辑。\n\n如前一章所述，M/MLX 文件编辑器拥有许多易于使用的工具和直观的选项，你可以在编写和调试脚本时使用它们。在\
  \ M/MLX 文件编辑器中，你可以使用单元模式、设置断点、评估选定的单元格或脚本行、自动检测错误（例如拼写错误的命令名称和代数运算中缺失的括号）、检测所有已使用和未使用的变量、提高脚本性能、显示关于不必要赋值变量的警告提示、在循环中设置变量值、使用性能分析器等等。\n\
  \n所有这些工具都有助于在编写脚本时避免语法错误。此外，还有许多其他工具可以帮助你在编写和发布 HTML（超文本）或 PDF 格式的报告时节省时间和精力。\n\n\
  在开始编写脚本之前，让我们先了解一些基本的准备步骤。在用任何编程语言编写实际代码之前，了解并考虑这些步骤非常重要。编写脚本/程序的过程始于纸笔。它由流程图（图\
  \ 2-1）中所示的步骤组成。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Fig1_HTML.jpg](img/471979_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n脚本/程序编写的一般流程\n\n此流程图说明了以下步骤：\n\n1. 阐明问题陈述。\n2. 阐明/创建/声明输入变量，例如 `var1`、`var2`、`var3`\
  \ ... `varN`。\n3. 读取 `var1`、`var2`、`var3`、... `varN` 的值。\n4. 定义输出变量，例如 `out1`、`out2`、`out3`、...\
  \ `outN`。\n5. 执行计算、评估和分析操作。\n6. 检查所获结果/输出变量的质量/正确性。\n7. 如果所得结果的质量/正确性不达标，则返回步骤 3。重复步骤\
  \ 3-5，直到达到预期的质量/正确性。\n8. 结束并报告结果。\n\n所描述的算法是一个非常通用的过程，还可能包括考虑目标、输入/输出数据类型、数据源、评估/计算操作等。一旦算法被明确定义，你就可以开始用给定的编程语言进行编码。编写程序/脚本时，最耗时的部分是执行步骤\
  \ 3-5 中的验证操作。这称为*调试*，它有助于定位步骤 4 中计算/评估和分析操作中的错误或缺陷。\n\n调试是一个过程，涉及根据编程语言纠正程序的语法，根据给定的问题陈述纠正计算/运算操作，并在需要时调整输出的精度。在许多情况下，调试并非易事，而\
  \ MATLAB 的 M/MLX 文件编辑器提供了一些有用的工具，可以检测脚本中的常见错误。同时，许多错误不通过执行和分析获得的输出是无法检测到的。没有单一的方法可以找到编写代码时所有可能的错误（缺陷和失误）。最常见的一种检查代码是否按预期运行的方法是使用已知输出的测试示例，然后验证输出。\n\
  \n本书将非常注重调试。必须指出，编写没有任何缺陷的代码是不可能的。因此，调试是“必须拥有”的步骤。此外，当你编写解决不同问题的代码并发现并修复你所犯的错误时，你将会磨练并构建你的编程技能。\n\
  \n### 注\n\n始终从执行练习中最基本部分的简单明了的操作/命令开始编写脚本。一旦练习的基本部分完成，你就可以添加更多细节。从简单到复杂是一种良好的编程习惯。\n\
  \n### 如何创建 M/MLX 文件\n\n有几种方法可以创建新脚本（在此情况下指 M/MLX 文件）。\n\n* 在命令窗口中输入 `>> edit` 并按键盘上的回车键。\n\
  * 按键盘上的 `Ctrl+N` 键。\n* 点击 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figa_HTML.jpg](img/471979_1_En_2_Figa_HTML.jpg)\
  \ 创建 M 文件。\n* 点击 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figb_HTML.jpg](img/471979_1_En_2_Figb_HTML.jpg)\
  \ 创建 MLX 文件。\n* 点击 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figc_HTML.jpg](img/471979_1_En_2_Figc_HTML.jpg)\
  \ 并从下拉选项中选择 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figd_HTML.jpg](img/471979_1_En_2_Figd_HTML.jpg)\
  \ 用于 M 文件，![../images/471979_1_En_2_Chapter/471979_1_En_2_Fige_HTML.jpg](img/471979_1_En_2_Fige_HTML.jpg)\
  \ 用于 MLX 文件，![../images/471979_1_En_2_Chapter/471979_1_En_2_Figf_HTML.jpg](img/471979_1_En_2_Figf_HTML.jpg)\
  \ 用于扩展名为 `*.m` 的函数文件，或 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figg_HTML.jpg](img/471979_1_En_2_Figg_HTML.jpg)\
  \ 用于扩展名为 `*.mlx` 的函数文件。\n* 通过以下命令收集在命令窗口中键入的命令：`diary on`、`diary NewFileName`、`diary\
  \ off`。\n\n\n\n### 脚本中的警告\n\n在编写 M/MLX 文件时（包括函数文件 M 文件和 MLX（实时）文件），编辑器会自动生成警告标志，这些标志在许多情况下是有用的提示，有助于提高效率并定位缺失或被忽略的参数。它们不会阻止脚本的执行。这些警告通过带有下划线的波浪线和连字符\
  \ ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figh_HTML.jpg](img/471979_1_En_2_Figh_HTML.jpg)\
  \ 表示，并在 M 文件编辑器窗口右侧通过一个矩形框 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figi_HTML.jpg](img/471979_1_En_2_Figi_HTML.jpg)\
  \ 显示。默认情况下，它们是橙色的。同样，MLX（实时）文件编辑器通过带有下划线的波浪线、连字符 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figj_HTML.jpg](img/471979_1_En_2_Figj_HTML.jpg)\
  \ 以及编辑器窗口右侧栏上的三角形警告标志 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figk_HTML.jpg](img/471979_1_En_2_Figk_HTML.jpg)\
  \ 来指示警告。\n\n请注意，其颜色可以通过偏好设置进行调整。以下是 M/MLX 文件编辑器自动检测到的一些常见警告：\n\n-   建议抑制命令窗口中的输出显示（仅由\
  \ M 文件编辑器检测）：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figl_HTML.jpg](img/471979_1_En_2_Figl_HTML.jpg)\n\
  \n-   建议进行内存分配（例如，当变量大小在 `for ... end` 和 `while ... end` 循环迭代中变化/增加时，变量 `A` 和 `B`\
  \ 会带有橙色波浪线）。\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figm_HTML.jpg](img/471979_1_En_2_Figm_HTML.jpg)\
  \  \n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Fign_HTML.jpg](img/471979_1_En_2_Fign_HTML.jpg)\n\
  \n-   建议移除不必要的分号。例如，在第 1 行的末尾，`;` 是不必要的：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figo_HTML.jpg](img/471979_1_En_2_Figo_HTML.jpg)\n\
  \n-   建议移除 `for ... end` 循环索引声明中（第 4 行）不必要的分号：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figp_HTML.jpg](img/471979_1_En_2_Figp_HTML.jpg)\n\
  \n-   指示 M 文件中已赋值但未使用的变量名（第 5 行的 `G`）：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figq_HTML.jpg](img/471979_1_En_2_Figq_HTML.jpg)\n\
  \n-   指示格式化 `fprintf()` 时缺少参数：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figr_HTML.jpg](img/471979_1_En_2_Figr_HTML.jpg)\n\
  \n-   指示不必要的括号（第 2 行的 `a = [13]`）：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figs_HTML.jpg](img/471979_1_En_2_Figs_HTML.jpg)\n\
  \n必须注意，M 编辑器检测到的某些警告标志不会被 MLX 编辑器（实时编辑器）捕捉。例如，用于抑制命令窗口输出显示的遗漏的 `;` 不适用于 MLX 编辑器（实时编辑器）。\n\
  \n另一方面，其他警告，如与内存分配相关的警告、不必要的分号、格式化 `fprintf()` 时缺少参数以及不必要的括号，都会被 MLX 编辑器非常明确地检测并突出显示，该编辑器在编辑器窗口右侧使用\
  \ ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figt_HTML.jpg](img/471979_1_En_2_Figt_HTML.jpg)。\n\
  \n-   建议进行内存分配：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figu_HTML.jpg](img/471979_1_En_2_Figu_HTML.jpg)\n\
  \n-   指示函数语句中的不必要分号：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figv_HTML.jpg](img/471979_1_En_2_Figv_HTML.jpg)\n\
  \n-   指示为 `for ... end` 循环定义索引时的不必要分号：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figw_HTML.jpg](img/471979_1_En_2_Figw_HTML.jpg)\n\
  \n-   指示 `fprintf()` 中缺少参数：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figx_HTML.jpg](img/471979_1_En_2_Figx_HTML.jpg)\n\
  \n-   指示不必要的括号：\n\n  ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figy_HTML.jpg](img/471979_1_En_2_Figy_HTML.jpg)\n\
  \n### 脚本中的错误\n\n在 MATLAB 中，脚本可以包含执行各种计算和分析以及定义函数的代码。让我们看几个在 M 文件和 MLX 文件编辑器中编写脚本的简单示例，了解如何定位和修复编写脚本时出现的常见错误。\n\
  \n\n\n### 示例 1\n\n求解以下列一般形式表示的二次方程：`ax² + bx + c = 0`。首先，打开一个 M 文件编辑器，并输入以下命令。\n\
  \n```\na=input('请输入 a = ');\nb=input('请输入 b = ');\nc=input('请输入 c = ');\nD=b²-4*a*c;\n\
  disp(['该方程的判别式为：' num2str(D)])\n```\n\n文件以扩展名 `*.m` 保存后即可执行。执行时，代码会提示用户输入三个值（`input()`），并使用用户输入的\
  \ `a`、`b` 和 `c` 计算二次方程的判别式，然后在命令窗口中显示结果。需要注意的是，第 5 行的 `disp()` 命令是可选的。它用于在命令窗口中显示计算结果并附带一些注释。`disp()`\
  \ 命令不会对输出结果产生任何影响。\n\n这段代码还剩下两个步骤——计算二次方程的两个根。剩余的步骤可以插入到第 5 行之后。如果在编写脚本时发生非法操作/错误，M/MLX\
  \ 文件编辑器会自动检测到它们，并用红色波浪线标出：\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figz_HTML.jpg](img/471979_1_En_2_Figz_HTML.jpg)\n\
  \n第 6 行有一个错误（`a` 下方的红色波浪线），其中缺少了乘法 `*` 号；第 7 行的 `=` 号下方有一条橙色波浪线，表示一个警告，建议添加分号以抑制该行输出的显示。\n\
  \n此类错误和警告信息会显示在编辑器滚动条的右侧边缘。如果红色波浪线表示存在错误，则该脚本（M/MLX 文件）无法执行。如果存在任何橙色波浪线表示的警告标志，该脚本可以正常执行。M/MLX\
  \ 编辑器会自动检测几种不同类型的拼写错误和非法操作，但无法自动修复它们。因此，您必须理解并解决此类问题。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figaa_HTML.jpg](img/471979_1_En_2_Figaa_HTML.jpg)\n\
  \n第 7 行的警告信息可以通过在光标位置添加分号或单击修复按钮来解决。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figab_HTML.jpg](img/471979_1_En_2_Figab_HTML.jpg)\n\
  \n最后，这是修复后的脚本。右上角的绿色按钮表示语法正确，脚本已准备好执行。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figac_HTML.jpg](img/471979_1_En_2_Figac_HTML.jpg)\n\
  \n将此脚本保存为 `Eqn.m` 后，您可以通过单击编辑器主菜单中的 GUI 按钮、按键盘上的 `Ctrl+Enter`，或者直接在命令窗口中通过脚本名称调用（`>>\
  \ run('Eqn')`）来执行它。执行后，它会在命令窗口中提示输入。然后，您可以分别输入 1、2、3 作为 `a`、`b` 和 `c` 的值。\n\n```\n\
  请输入 a = 1\n请输入 b = 2\n请输入 c = 3\n该方程的判别式为：-8\n```\n\n这样整个计算就完成了，这就是在命令窗口中得到的输出。工作区中也保存了一些其他变量，如下所示。\n\
  \n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figae_HTML.jpg](img/471979_1_En_2_Figae_HTML.jpg)\n\
  \n来自脚本和 M/MLX 文件的所有输入及处理/计算的输出都会自动保存到工作区中。除非执行函数文件，否则除了函数文件中指定的输出变量外，并非所有结果都会保存到工作区。此问题将在本章后面的函数文件部分讨论。\n\
  \n### 示例 2\n\n通过编写一个 M 文件（脚本）计算以下表达式：`ab ∛((ax - by)² / (cd - f))`，其中 `x = [1/5,\
  \ 2/5, 3/5, 4/5]; y = [1/3, 2/3, 1, 4/3]; c = 2; d = 2.5; f = 2`，而值 `a`、`b` 由用户输入（标量）。根据给定的变量值，`x`\
  \ 和 `y` 是行数组，其他变量——`a`、`b`、`c`、`d` 和 `f`——是标量。\n\n如同二次方程示例一样，输入提示也包含在脚本中。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figaf_HTML.jpg](img/471979_1_En_2_Figaf_HTML.jpg)\n\
  \n这是创建的用于计算给定任务的简短脚本。快速浏览此脚本，可以发现 MATLAB 编辑器检测到一个错误。这是与第 9 行末尾缺少括号相关的无效语法。缺失的括号位于第一个\
  \ `^` 乘幂符号之前。以下是修复后的代码，右上角带有绿色按钮。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figag_HTML.jpg](img/471979_1_En_2_Figag_HTML.jpg)\n\
  \n根据编辑器的语法检查，现在一切似乎都正确。然而，仍然存在几个错误：\n\n- 在第 4 行定义 `x` 的元素时，使用了分号作为元素分隔符，但必须使用逗号或空格。\n\
  - 变量 `f` 在第 8 行定义，但在第 9 行的表达式中，却使用了 `ff`。\n- 第 9 行的计算表达式使用了变量 `a`、`b`、`c`、`d` 和\
  \ `f`（这些是标量），以及变量 `x` 和 `y`（这些是行数组）。这是不正确的。该行必须对行数组变量 `x` 和 `y` 进行逐元素运算。修复这些错误后，脚本将如下所示。\n\
  \n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figah_HTML.jpg](img/471979_1_En_2_Figah_HTML.jpg)\n\
  \n现在，无需保存即可通过按键盘上的 `Ctrl+Enter` 执行脚本，或者在保存后单击 GUI 按钮执行。以下是结果（来自命令窗口的输入）：\n\n```\n\
  请输入 a = 1\n请输入 b = 2\n```\n\n以下是工作区中的变量：\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figaj_HTML.jpg](img/471979_1_En_2_Figaj_HTML.jpg)\n\
  \n\n\n### 示例 3\n\n使用 MLX 文件编辑器并创建一个 MLX 文件来计算数学表达式的值并绘图。已知：*H*(*t*) = sin(ω*t*)；ω\
  \ = 3；*t* = [0°, 450°]，步长 ∆*t* = 1°。\n\n注意，给定的自变量 `t` 的值是角度制，而非弧度制。在 MATLAB 中，有两个函数——`sin()`\
  \ 和 `sind()`——分别用于计算弧度和角度下的正弦值。因此，在这种情况下有两种处理方法——始终使用正确的 MATLAB 函数，或者采用从角度换算到弧度的转换函数\
  \ `deg2rad()`，反之则使用 `rad2deg()`。\n\n现在，在实时编辑器中创建了考虑输入参数 `t` 的 MLX 文件（脚本）：\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figak_HTML.jpg](img/471979_1_En_2_Figak_HTML.jpg)\n\
  \n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figal_HTML.jpg](img/471979_1_En_2_Figal_HTML.jpg)\n\
  \n注意，错误会以波浪下划线显示，并且 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figam_HTML.jpg](img/471979_1_En_2_Figam_HTML.jpg)\
  \ 和 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figan_HTML.jpg](img/471979_1_En_2_Figan_HTML.jpg)\
  \ 会以红色形式出现在 MLX 编辑器的右侧。修复错误（去掉 `*` 前的逗号）后，修正后的代码如下所示。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figao_HTML.jpg](img/471979_1_En_2_Figao_HTML.jpg)\n\
  \nM 文件编辑器和 MLX 文件编辑器之间存在几个关键区别。其中之一是，在输入变量名称的首字母后，MLX 编辑器能自动检测已定义的变量。额外的提示会显示参数类型（例如，角度制下的\
  \ *ω* 和 `t`）。MLX 文件编辑器的另一个特性是，如果赋值变量的命令末尾未加分号，它不会显示警告信息。例如，`t = 0:1:450`，这一情况我们在使用\
  \ M 文件编辑器时就曾见过。MLX 文件编辑器将输出显示在 MLX 编辑器的右侧窗口中，而非命令窗口中。同时，执行 MLX 文件后，所有变量和已计算的表达式都会像\
  \ M 文件一样保存在工作区中。MLX 文件的执行方式与 M 文件类似，可以通过键盘按下 `Ctrl+Enter` 或点击 ![../images/471979_1_En_2_Chapter/471979_1_En_2_Figap_HTML.jpg](img/471979_1_En_2_Figap_HTML.jpg)\
  \ GUI 按钮来完成。以下是包含 `plot()` 命令及其计算结果在内的最终脚本。\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figaq_HTML.jpg](img/471979_1_En_2_Figaq_HTML.jpg)\n\
  \n### 示例 4\n\n编写一个 MLX 文件，用于分析和计算以下跳伞运动员的加速度方程 *a*(*v*)（加速度作为速度的函数）：\n\n![$$ a(v)=g\\\
