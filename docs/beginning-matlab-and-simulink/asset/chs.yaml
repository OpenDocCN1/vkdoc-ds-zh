  \ 模型都可以通过工作区或任何 M 文件中的 `sim()` 命令从 MATLAB 进行仿真/执行。被仿真的模型必须位于当前工作目录中。例如，之前的模型可以通过以下命令运行：\n\
  \n```\n>> sim('Ex1_Arithmetic_operations.mdl')\n```\n\n### 注意\n\n任何模块的名称都可以通过点击其名称标签来更改。\n\
