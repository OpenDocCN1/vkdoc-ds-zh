  \ 和 ![](img/471979_1_En_5_Figq_HTML.jpg) 工具完成。\n\n图 5-20 中显示的模拟结果与设定的仿真周期（设定在 `-3*pi\
  \ ... 3*pi` 范围内）不一致。问题出在示波器模块的时间显示偏移量上，其默认值为 0。需要将时间偏移量设置为 `-3*pi`，这可以通过示波器的“配置属性”进行修复。点击其下拉选项中的\
  \ ![](img/471979_1_En_5_Figr_HTML.jpg) 图标，即可进入示波器的“配置属性”。打开“配置属性”后，点击“时间”选项卡，并在“时间显示偏移量”中输入\
