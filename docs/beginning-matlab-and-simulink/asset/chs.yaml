  \ MLX 编辑器中编写和编辑脚本时，频繁执行实时脚本，以便捕捉任何缺陷和错误。\n\n以下是 MLX 编辑器中本练习修正并最终确定的解决方案脚本：\n\n![../images/471979_1_En_2_Chapter/471979_1_En_2_Figat_HTML.jpg](img/471979_1_En_2_Figat_HTML.jpg)\n\
