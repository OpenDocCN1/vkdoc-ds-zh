  \ `Ctrl` 键并点击鼠标左键来连接一个模块。然后点击另一个模块上的鼠标左键，即可将两者连接。另一种连接模块或在模块之间连接信号的方法是，将信号箭头（见图\
  \ 5-7）拖到您想要连接的模块上。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig7_HTML.jpg](img/471979_1_En_5_Fig7_HTML.jpg)\n\
  \n**图 5-7** 连接模块\n\n有些模块既有输入端口也有输出端口，有些只有输入端口，还有些只有输出端口。您只能从它们的输出端口向另一个模块的输入端口连接信号。换句话说，无法将输出端口连接到输出端口，或将输入端口连接到输入端口。\n\
  \n### 注意\n\n模块可以轻松调整大小。点击要调整大小的模块，然后从模块周围矩形边界的四个角之一进行拖动。\n\n在开始使用 Simulink 建模之前，您必须调整一个工具以简化模块库的使用过程。为了将\
  \ Simulink 库始终置于所有模型窗口的顶部，必须点击图标 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figg_HTML.jpg](img/471979_1_En_5_Figg_HTML.jpg)\
