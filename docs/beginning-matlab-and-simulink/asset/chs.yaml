  \n# 7. 线性代数\n\n本章包括对线性代数的简要介绍。它讨论了求解线性方程组的一些基本方法，以及各种矩阵运算（矩阵求逆、行列式、求和、减法、除法、乘法、幂、指数、逐元素和逐数组运算等）。它涵盖了特征值问题和矩阵分解/因式分解，例如\
  \ Cholesky、Schur、LU、QR 和奇异值分解。本章还包括 MATLAB 和 Simulink 模型中的内置函数和脚本。此外，本章通过 MATLAB\
  \ 和 Simulink 中的示例，解释了 MATLAB 的标准矩阵生成函数、创建向量空间、求解多项式以及矩阵的逻辑索引。\n\n\n\n# 线性代数导论\n\n\
  线性代数是数学中较为重要的分支之一。它研究向量、向量空间、线性空间、矩阵以及线性方程组。线性代数在工程与科学计算中有着广泛的应用，涵盖自然与社会研究的众多领域。线性代数从不欠定、过定和适定线性方程组开始。对于一个由\
  \ *m* 个线性方程和 *n* 个未知数组成的系统，若 *m* ≥ *n*，则该系统可解。考虑以下由方程组（公式 7.1）表述的线性系统。\n\n![$$ \\\
  left\\{\\begin{array}{ccc}{a}_{11}{x}_{11}&amp; +{\\dots}_{.}&amp; +{a}_{1n}{x}_{1n}\\\
  \\ {}\\vdots &amp; \\vdots &amp; \\vdots \\\\ {}{a}_{m1}{x}_{m1}&amp; +{\\dots}_{.}&amp;\
  \ +{a}_{mn}{x}_{mn}\\end{array}\\right.{\\displaystyle \\begin{array}{c}\\kern1.25em\
  \ ={b}_1\\\\ {}=\\kern0.5em \\vdots \\\\ {}={b}_m\\end{array}} $$](img/471979_1_En_7_Chapter_TeX_Equ1.png)\n\
  \n（公式 7.1）\n\n当 *m* ≥ *n* 时，线性方程组（公式 7.1）在所有情况下均可直接求解。若 *m* < *n*，未知数的数量多于线性无关方程的数量，这样的系统称为欠定系统，无法直接求解。若\
  \ *m* > *n*，线性无关方程的数量更多，这样的系统称为过定系统，可以直接求解。\n\n为简便起见，我们取 *m* = *n*，并将公式 7.1 重写为：\n\
  \n![$$ \\left\\{\\begin{array}{ccc}{a}_{11}{x}_1&amp; +{\\dots}_{.}&amp; +{a}_{1n}{x}_n\\\
  \\ {}\\vdots &amp; \\vdots &amp; \\vdots \\\\ {}{a}_{n1}{x}_1&amp; +{\\dots}_{.}&amp;\
  \ +{a}_{nn}{x}_n\\end{array}\\right.{\\displaystyle \\begin{array}{c}\\kern0.75em\
  \ ={b}_1\\\\ {}=\\kern0.5em \\vdots \\\\ {}\\kern0.75em ={b}_n\\end{array}} $$](img/471979_1_En_7_Chapter_TeX_Equ2.png)\n\
  \n（公式 7.2）\n\n公式 7.2 中的线性方程组也可以用矩阵符号形式表示。\n\n![$$ \\left[A\\right]\\ast \\left\\\
  {X\\right\\}=\\left[B\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equ3.png)\n\
  \n（公式 7.3）\n\n其中：\n\n![$$ \\left[A\\right]=\\left[\\begin{array}{ccc}{a}_{11}&amp;\
  \ \\dots &amp; {a}_{1n}\\\\ {}:&amp; \\dots &amp; :\\\\ {}{a}_{n1}&amp; \\dots &amp;\
  \ {a}_{nn}\\end{array}\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq1.png),\
  \ ![$$ \\left[B\\right]=\\left[\\begin{array}{c}{b}_1\\\\ {}:\\\\ {}{b}_n\\end{array}\\\
  right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq2.png), {*X*}\
  \ = {*x*[1] ... *x*[*n*]}。\n\n公式 7.3 也可以改写为列矩阵的形式：\n\n![$$ {x}_1\\left[\\begin{array}{c}{A}_1\\\
  \\ {}\\vdots \\\\ {}{A}_{n1}\\end{array}\\right]+\\dots +{x}_n\\left[\\begin{array}{c}{A}_{1n}\\\
  \\ {}\\vdots \\\\ {}{A}_{nn}\\end{array}\\right]=\\left[\\begin{array}{c}{b}_1\\\
  \\ {}\\vdots \\\\ {}{b}_n\\end{array}\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equ4.png)\n\
  \n（公式 7.4）\n\n其中 *A* 和 *B* 是矩阵，*X* 是未知数向量。\n\n公式 7.3 中关于 *X*（未知数）的系统可通过以下公式求解。\n\
  \n![$$ \\left\\{X\\right\\}={\\left[A\\right]}^{-1}\\ast \\left[B\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equ5.png)\n\
  \n（公式 7.5）\n\n其中 [*A*]^(−1) 是矩阵 [A] 的逆。\n\n## 矩阵属性与运算\n\n矩阵具有多个重要属性和运算，例如行列式、对角线、转置、逆、奇异性、秩等。\n\
  \n矩阵的*行列式*只能在给定矩阵为方阵时计算。例如：\n\n![$$ M=\\left[\\begin{array}{ccc}a&amp; b&amp; c\\\
  \\ {}d&amp; e&amp; f\\\\ {}g&amp; h&amp; i\\end{array}\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equa.png)\n\
  \n矩阵 M 的行列式将通过以下表达式计算：\n\n![$$ \\mathit{\\det}(M)= aei+ bfg+ dhc- ceg- dbi- hfa\
  \ $$](img/471979_1_En_7_Chapter_TeX_Equb.png)\n\n用于行列式计算的 MATLAB 命令是 `det()`。例如：\n\
  \n```\n>> A =[      8     1     6;      3     5     7;      4     9     2]\nA =\n\
  8     1     6\n3     5     7\n4     9     2\n>> det(A)\nans =\n```\n\n矩阵的*对角线*由其沿对角线的元素组成。例如，在前例中，对角线元素为\
  \ *aei* 和 *ceg*。\n\n用于对角线提取的 MATLAB 命令是 `diag()`。例如：\n\n```\n>> A =[      8    \
  \ 1     6;      3     5     7;      4     9     2];\n>> diag(A)\nans =\n```\n\n\
  矩阵的*转置*可通过将矩阵逆时针旋转 90° 来确定。转置性质如下：\n\n![$$ {\\left({M}^T\\right)}^T=M $$](img/471979_1_En_7_Chapter_TeX_Equc.png)\n\
  \n![$$ {\\left(M+B\\right)}^T={M}^T+{B}^T $$](img/471979_1_En_7_Chapter_TeX_Equd.png)\n\
  \n![$$ {(kM)}^T=k{M}^T $$](img/471979_1_En_7_Chapter_TeX_Eque.png)\n\n![$$ {(MB)}^T={B}^T{M}^T\
  \ $$](img/471979_1_En_7_Chapter_TeX_Equf.png)\n\n![$$ {\\left({M}^{-1}\\right)}^T={\\\
  left({M}^T\\right)}^{-1} $$](img/471979_1_En_7_Chapter_TeX_Equg.png)\n\n其中 `M` 和\
  \ `B` 是大小相同的矩阵，`k` 是标量，`^T` 和 `^-1` 分别是转置和逆运算。\n\n用于转置操作的 MATLAB 命令是 `transpose()`\
  \ 和 `'`。例如：\n\n```\n>> A =[      8     1     6;      3     5     7;      4     9\
  \     2];\n>> transpose(A)\nans =\n8     3     4\n1     5     9\n6     7     2\n\
  >> A'\nans =\n8     3     4\n1     5     9\n6     7     2\n```\n\n### 用于矩阵行列式、对角线提取和转置的\
  \ Simulink 模块\n\nSimulink 提供了可用于计算矩阵行列式、提取矩阵对角线元素以及获取矩阵转置的模块。行列式模块（`[det(A) (3x3)]`）存在于\
  \ Simulink 的 Aerospace Blockset/Utilities/Math Operations 中，它有一个约束条件：只能计算 3×3 矩阵的行列式。\n\
  \n\n\n### 注意\n\n注意 Aerospace Blockset 中的 `[det(A) (3x3)]` 模块是有限制的；它只能计算 3x3 矩阵的行列式。\n\
  \n用于提取矩阵对角元素的模块位于 DSP System Toolbox/Math Functions/Matrices and Linear Algebra/Matrix\
  \ Operations 中。用于计算矩阵转置的模块位于 Simulink/Math Operations 中，模块名称为 `Math Function`。该模块内嵌了多种数学函数，包括\
  \ `exp`（默认）、`log`、`10^u`、`magnitude²`、`square`、`pow` 和 `transpose`。可以在 `Math Function`\
  \ 模块中选择任意一种数学函数。只需点击模块的 `Apply` 和 `OK` 按钮，所选的数学函数即可生效。这三个模块如图 7-1 所示。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig1_HTML.jpg](img/471979_1_En_7_Fig1_HTML.jpg)\n\
  \n*图 7-1*\n\n*用于行列式计算、对角元素提取和转置运算的 Simulink 模块，从左到右*\n\n这些模块都只有一个输入端口和一个输出端口。因此，我们需要添加另外两个模块：一个用于输入数据的\
  \ `Constant` 模块，以及一个用于获取/查看计算结果的 `Display` 模块。`Constant` 模块可以从 Simulink 库的 Simulink/Sources\
  \ 或 DSP System Toolbox/Sources 中获取。类似地，`Display` 模块可以从 Simulink/Sinks 或 DSP System\
  \ Toolbox/Sinks 中获取。或者，从 2018a 版本开始的 MATLAB 最新版本中，你可以通过双击（鼠标左键）并在搜索框中输入模块名称来获取所有必要的模块。正如前几章所述，在任何\
  \ Simulink 模型中，一个信号源可以根据需要多次使用。无需为了将其作为输入信号用于其他模块而在一个模型中重复生成该信号。此外，为了优化 Simulink\
  \ 模型，强烈建议您构建模块数量较少的 Simulink 模型，以使模型更具可读性、更全面且易于编辑。因此，本示例使用一个 `Constant` 模块作为输入源\
  \ `[A]`。图 7-2 显示了 Simulink 模型的初始版本。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig2_HTML.jpg](img/471979_1_En_7_Fig2_HTML.jpg)\n\
  \n*图 7-2*\n\n*用于计算矩阵行列式、提取矩阵对角元素和对矩阵进行转置的 Simulink 模型*\n\n让我们使用示例矩阵 `[A]` 来演示这三个\
  \ Simulink 模块。矩阵 `[A]` 的元素可以通过两种不同的方式输入：\n\n*   在 `Constant` 模块的 `Constant Value`\
  \ 框中直接输入所有元素，如图 7-3 所示。然后点击 `Apply` 和 `OK` 按钮。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig3_HTML.jpg](img/471979_1_En_7_Fig3_HTML.jpg)\n\
  \n*图 7-3*\n\n*在 `Constant` 模块中输入矩阵元素*\n\n*   通过 MATLAB 的命令行窗口和工作区定义 `[A]`：\n```\n\
  >> A =[ 8  1  6;  3  5  7; 4  9  2];\n```\n然后，在 `Constant` 模块的 `Constant Value`\
  \ 框中为 `[A]` 提供变量名 `A`，如图 7-4 所示。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig4_HTML.jpg](img/471979_1_En_7_Fig4_HTML.jpg)\n\
  \n*图 7-4*\n\n*在 MATLAB 工作区中定义的矩阵 `[A]`，通过 `Constant` 模块调用*\n\n然后点击 `Apply` 和 `OK`\
  \ 按钮。请注意，在本示例中我们不打算使用第二种方法（见图 7-4）来定义矩阵 `[A]` 的元素；此处展示仅用于说明目的。\n\n最后，你将得到完整的模型，其中矩阵\
  \ `[A]` 的元素是直接在图 7-3 所示的 `Constant` 模块中输入的。完成模型后，通过按键盘上的 `Ctrl+T` 或点击 Simulink 模型窗口中的\
  \ `Run` ![../images/471979_1_En_7_Chapter/471979_1_En_7_Figa_HTML.jpg](img/471979_1_En_7_Figa_HTML.jpg)\
  \ 按钮，将创建包含计算结果的完整模型。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig5_HTML.jpg](img/471979_1_En_7_Fig5_HTML.jpg)\n\
  \n*图 7-5*\n\n*对 3x3 矩阵进行行列式计算、对角元素提取和转置运算的完整 Simulink 模型*\n\n### 注意\n\n要在 `Display`\
  \ 模块中看到仿真结果，需要调整/拉伸其大小。用鼠标左键点击它，然后按住鼠标按钮进行拖动。\n\nSimulink 模型的仿真结果与 MATLAB 命令（如 `det()`、`diag()`\
  \ 和 `transpose()`）的结果一致。\n\n### 矩阵的逆 (Matrix Inverse or Inverse Matrix)\n\n*逆矩阵*\
  \ 具有以下重要性质：\n\n![$$ \\left[A\\right]\\ast {\\left[A\\right]}^{-1}=\\left[I\\right]\
  \ $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equh.png)\n\n其中 `[I]`\
  \ 是单位矩阵。\n\n例如，![$$ A=\\left[\\begin{array}{cc}1&amp; 1\\\\ {}3&amp; 4\\end{array}\\\
  right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq3.png) 的逆矩阵是\
  \ ![$$ {A}^{-1}=\\left[\\begin{array}{cc}4&amp; -1\\\\ {}-3&amp; 1\\end{array}\\\
  right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq4.png)，其计算过程如下：\n\
  \n![$$ {A}^{-1}=\\frac{1}{\\det (A)}\\ adjugate(A)=\\frac{1}{4\\ast 1-\\left(-1\\\
  ast \\left(-3\\right)\\right)}\\ast \\left[\\begin{array}{cc}4&amp; -1\\\\ {}-3&amp;\
  \ 1\\end{array}\\right]=\\left[\\begin{array}{cc}4&amp; -1\\\\ {}-3&amp; 1\\end{array}\\\
  right]. $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equi.png)\n\n\
  用于计算矩阵逆的 MATLAB 命令是 `inv()`。例如：\n\n```\n>> A =[      8     1     6;      3     5\
  \     7;      4     9     2];\n>> inv(A)\nans =\n0.1472   -0.1444    0.0639\n-0.0611\
  \    0.0222    0.1056\n-0.0194    0.1889   -0.1028\n```\n\n如果一个方阵没有逆矩阵，并且其行列式为 `0`，则该矩阵是*奇异的*。\n\
  \n### 用于求逆矩阵的 Simulink 模块 (Simulink Blocks for Inverse Matrix)\n\n*矩阵求逆* 也可以通过多个\
  \ Simulink 模块根据给定的矩阵大小（即方阵或矩形阵）进行计算。求逆矩阵或矩阵逆计算的模块存在于 Simulink 的 DSP System 和 Aerospace\
  \ Blockset 工具箱中，可以通过 Simulink 库访问：DSP System Toolbox/Math Functions/Matrices and\
  \ Linear Algebra/Matrix Inverses 和 Aerospace Blockset/Utilities/Math Operations。让我们测试一下这个工具箱中用于计算上一示例中矩阵\
  \ `[A]` 的逆的可用模块。打开一个空白的 Simulink 模型，并从图 7-6 所示的 DSP System 和 Aerospace Blockset\
  \ 工具箱的库中拖放模块。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig6_HTML.jpg](img/471979_1_En_7_Fig6_HTML.jpg)\n\
  \n*图 7-6*\n\n*用于计算逆矩阵的 Simulink 模块*\n\n这些模块如每个模块顶部所示——`General Inverse (LU)`、`Pseudoinverse\
  \ (SVD)` 和 `inv(A)`——分别用于基于 LU 分解计算方阵的逆，以及基于 SVD 计算矩形矩阵（即 `m > n`，或行数大于列数，反之亦然）的伪逆。关于\
  \ LU、SVD 以及其他矩阵分解和变换操作的理论方面，将在“矩阵分解”小节中详细介绍。\n\n\n\n### 说明\n\nAerospace Blockset\
  \ 中的 `[inv(A) (3x3)]` 模块规模有限，只能计算 3×3 矩阵的逆矩阵。\n\n这三个模块各有一个用于输入矩阵的输入端口和一个用于输出计算结果的输出端口。请按照步骤操作，添加两个额外的模块——一个\
  \ Constant 模块和一个 Display 模块。图 7-7 显示了 Simulink 模型的初始版本。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig7_HTML.jpg](img/471979_1_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7**\n\n通过三个不同的模块计算逆矩阵的 Simulink 模型\n\n矩阵 `[A]` 的元素可以通过两种方式输入：(1) 在 Constant\
  \ 模块的 Constant Value 框中输入所有元素，然后点击 Apply 和 OK 按钮；或 (2) 通过 MATLAB 的命令窗口和工作区定义 `[A]`。\n\
  \n最后，你将得到以下完整模型，其中矩阵 `[A]` 的元素直接输入在 Constant 模块中。完成模型后，按下键盘上的 `Ctrl+T` 或点击 Simulink\
  \ 模型窗口中的 Run ![../images/471979_1_En_7_Chapter/471979_1_En_7_Figb_HTML.jpg](img/471979_1_En_7_Figb_HTML.jpg)\
  \ 按钮，即可生成带有计算结果的最终模型，如图 7-8 所示。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig8_HTML.jpg](img/471979_1_En_7_Fig8_HTML.jpg)\n\
  \n**图 7-8**\n\n通过三个不同模块计算的逆矩阵\n\n计算出的逆矩阵 (`A`^(-1)) 的值与使用 MATLAB 的 `inv()` 命令计算的值相匹配，精确到四位小数。\n\
  \n矩阵的另一个重要运算是其**秩**。矩阵（例如 `[A]`）的**秩**是指该矩阵最大的线性无关行向量的数量，这也等同于最大的线性无关列向量的数量。如果 `[A]`\
  \ 矩阵的秩等于相同维度矩阵的最大可能秩，则称其满秩。如果矩阵 `[M]` 不满秩，则称其为秩亏损。矩阵的秩决定了系统包含多少个线性无关的行。在 MATLAB\
  \ 中，用于计算矩阵秩的命令是 `rank()`。例如：\n\n```\n>> A =[8, 1, 6; 3, 5, 7; 4, 9, 2]; % 满秩矩阵\n\
  >> rank(A)\nans =\n\n>> M =[8 0 6; -3, 0,  7; 0  0 2]   % 秩亏损矩阵\nM =\n8     0  \
  \   6\n-3     0     7\n0     0     2\n>> rank(M)\nans =\n\n```\n\n根据秩的不同，系统（系统矩阵）可以是满秩、超定和欠定的。\n\
  \n### 示例 1：求解线性方程组\n\n以下示例向你展示如何使用这些公式求解线性方程。\n\n![$$ \\left\\{\\begin{array}{ccc}2x&amp;\
  \ +3y&amp; +5z\\\\ {}-3x&amp; -2y&amp; +5z\\\\ {}4x&amp; -7y&amp; +6z\\end{array}\\\
  right.{\\displaystyle \\begin{array}{c}\\kern0.75em =1\\\\ {}=\\kern0.5em 2\\\\\
  \ {}=3\\end{array}} $$](img/471979_1_En_7_Chapter_TeX_Equj.png)\n\n为了求解未知数（例如 `x`,\
  \ `y`, `z`），你直接应用公式 7.3、7.4 和 7.5，然后执行以下操作。\n\n![$$ \\left[\\begin{array}{ccc}2&amp;\
  \ 3&amp; 5\\\\ {}-3&amp; -2&amp; 5\\\\ {}4&amp; -7&amp; 6\\end{array}\\right]\\\
  ast \\left\\{\\begin{array}{c}x\\\\ {}y\\\\ {}z\\end{array}\\right\\}=\\left[\\\
  begin{array}{c}1\\\\ {}2\\\\ {}3\\end{array}\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq5.png)，可以重写为：\n\
  \n![$$ \\left\\{\\begin{array}{c}x\\\\ {}y\\\\ {}z\\end{array}\\right\\}={\\left[\\\
  begin{array}{ccc}2&amp; 3&amp; 5\\\\ {}-3&amp; -2&amp; 5\\\\ {}4&amp; -7&amp; 6\\\
  end{array}\\right]}^{-1}\\ast \\left[\\begin{array}{c}1\\\\ {}2\\\\ {}3\\end{array}\\\
  right]\\left\\{\\begin{array}{c}x\\\\ {}y\\\\ {}z\\end{array}\\right\\}=\\left[\\\
  begin{array}{ccc}0.0754&amp; -0.1738&amp; 0.0820\\\\ {}0.1246&amp; -0.0262&amp;\
  \ -0.0820\\\\ {}0.0951&amp; 0.0852&amp; 0.0164\\end{array}\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq6.png)*![$$\
  \ \\left[\\begin{array}{c}1\\\\ {}2\\\\ {}3\\end{array}\\right]=\\left[\\begin{array}{c}-0.0262\\\
  \\ {}-0.1738\\\\ {}0.3148\\end{array}\\right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_IEq7.png)\n\
  \n![$$ Solution:\\left\\{\\begin{array}{c}x\\\\ {}y\\\\ {}z\\end{array}\\right\\\
  }\\cong \\left[\\begin{array}{c}-0.0262\\\\ {}-0.1738\\\\ {}0.3148\\end{array}\\\
  right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equk.png)\n\n\
  解决此问题的其他方法包括简化行阶梯形矩阵法、高斯消元法和图解法。在前面的练习中，为了计算方程的解，我们使用了矩阵乘法、求和和求逆运算。MATLAB 中有许多运算符和内置函数可用于求解线性方程组。它们如下所示：\n\
  \n- `inv()`，计算给定矩阵的逆矩阵或给定系统（用于超定系统）的伪逆矩阵。\n- `\\`，反斜杠运算符，直接求解线性方程组。它基于高斯消元法。这是 MATLAB\
  \ 中最强大的矩阵处理运算符（工具）之一。\n- `mldivide()`，一个与 `\\` 反斜杠运算符类似的内置函数。\n- `linsolve()`，一个与\
  \ `\\` 反斜杠运算符类似的内置函数。\n- `lsqr()`，一个基于最小二乘法的内置函数。\n- `lu()`，一个基于高斯消元法的内置函数。\n- `rref()`，一个基于简化行阶梯形法的内置函数。\n\
  - `svd()`，一个基于奇异值分解的内置函数。\n- `chol()`，一个基于 Cholesky 分解的内置函数。\n- `qr()`，一个基于正交三角分解的内置函数。\n\
  - `decomposition()`，一个自动选择分解方法的内置函数。\n- `bicg()`、`cgs()`、`gmres()`、`pcg()`、`symmlq()`\
  \ 和 `gmr()`，这些是基于梯度法的内置函数。\n- `solve()`，一个来自符号数学工具箱的内置函数。\n\n\n\n### 注意\n\n在这些列出的函数/命令和运算符中，有些使用了相同的计算算法，彼此之间互为替代。例如，反斜杠运算符`\\\
  ` 是 `mldivide()` 的替代方案。\n\n首先，用以下符号表示给定的系统。\n\n![$$ \\underset{A}{\\underbrace{\\\
  left[\\begin{array}{ccc}2&amp; 3&amp; 5\\\\ {}-3&amp; -2&amp; 5\\\\ {}4&amp; -7&amp;\
  \ 6\\end{array}\\right]}}\\ast \\underset{X}{\\underbrace{\\left\\{\\begin{array}{c}x\\\
  \\ {}y\\\\ {}z\\end{array}\\right\\}}}=\\underset{B}{\\underbrace{\\left[\\begin{array}{c}1\\\
  \\ {}2\\\\ {}3\\end{array}\\right]}} $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equl.png)\n\
  \n在命令窗口中定义`[A]`矩阵的元素（未知数`x`, `y`, `z`的系数）以及`[B]`矩阵的元素。\n\n```\n>> A=[2, 3, 5; -3,\
  \ -2, 5; 4, -7, 6]\nA =\n2     3     5\n-3    -2     5\n4    -7     6\n>> B=[1;\
  \ 2; 3]\nB =\n1\n2\n3\n```\n\n使用 `inv()` 和 `(*)`。\n\n```\n>>Ai=inv(A)    %  [B]\
  \ 矩阵是 [A] 矩阵的逆矩阵。\nAi =\n0.0754   -0.1738    0.0820\n0.1246   -0.0262   -0.0820\n\
  0.0951    0.0852    0.0164\n>> XYZ1=Ai*B    %   问题的解\nXYZ1 =\n-0.0262\n-0.1738\n\
  0.3148\n```\n\n下一个示例使用基于高斯消元法的反斜杠`\\`运算符。这种方法在计算时间方面相当简单高效。\n\n```\n>> XYZ2=A\\\
  B\nXYZ2 =\n-0.0262\n-0.1738\n0.3148\n```\n\n使用 `mldivide()`:\n\n```\n>>XYZ3=mldivide(A,B)\n\
  XYZ3 =\n-0.0262\n-0.1738\n0.3148\n```\n\n使用 `linsolve()`:\n\n```\n>>XYZ4=linsolve(A,B)\n\
  XYZ4 =\n-0.0262\n-0.1738\n0.3148\n```\n\n使用 `lsqr()`:\n\n```\n>>XYZ5=lsqr(A,B)\n\
  lsqr converged at iteration 3 to a solution with relative residual 6.6e-17.\nXYZ5\
  \ =\n-0.0262\n-0.1738\n0.3148\n```\n\n使用 `lu()`:\n\n```\n>>[L, U, P] = lu(A); %L-下三角矩阵;\
  \ U-上三角矩阵; P-置换矩阵\n>> y = L\\(P*B);\n>> XYZ6 = U\\y\nXYZ6 =\n-0.0262\n-0.1738\n\
  0.3148\n```\n\n使用 `rref()`:\n\n```\n>> MA = [A, B];       % 增广矩阵\n>> xyz = rref(MA);\n\
  >> XYZ7= xyz(:,end)\nXYZ7 =\n-0.0262\n-0.1738\n0.3148\n```\n\n使用 `svd()`:\n\n```\n\
  >> [U, S, V]= svd(A);\n>> XYZ8 = V*inv(S)*U'*B\nXYZ8 =\n-0.0262\n-0.1738\n0.3148\n\
  ```\n\n使用 `chol()`:\n\n```\n>> [U, L] = chol(A);    % A 必须是埃尔米特正定矩阵\n>> XYZ9 = U\\\
  (U'\\B)      % U'*U = A\nXYZ9 =\n-0.0262\n-0.1738\n0.3148\n```\n\n使用 `qr()`:\n\n\
  ```\n>> [Q, R] = qr(A);\n>> XYZ10  = R\\Q.'*B\nXYZ10 =\n-0.0262\n-0.1738\n0.3148\n\
  ```\n\n使用 `decomposition()`:\n\n```\n>> XYZ11 = decomposition(A)\\B\nXYZ11 =\n-0.0262\n\
  -0.1738\n0.3148\n```\n\n使用 `bicg()` 梯度方法:\n\n```\n>> XYZ12 = bicg(A, B)\nbicg converged\
  \ at iteration 3 to a solution with relative residual 3.1e-14.\nXYZ12=\n-0.0262\n\
  -0.1738\n0.3148\n```\n\n使用 `solve()`，这是一个符号数学工具箱函数:\n\n```\n>> syms x y z\n>> sol=solve(2*x+3*y+5*z-1,\
  \ -3*x-2*y+5*z-2, 4*x-7*y+6*z-3);\n>> XYZ13=[sol.x; sol.y; sol.z]\nXYZ13 =\n-8/305\n\
  -53/305\n96/305\n>> XYZ13=double([sol.x; sol.y; sol.z])\nXYZ13 =\n-0.0262\n-0.1738\n\
  0.3148\n```\n\n所有计算出的解在所使用运算符和函数的四位小数范围内都是精确的。事实上，每个运算符或函数的解的精度和计算时间会有所不同。例如，逆矩阵的计算不仅计算成本高昂，而且精度也较低。此外，在所研究的方法中，符号数学工具箱的最后一个函数\
  \ `solve()` 是最慢且效率最低的方法。\n\n### 注意\n\n请注意，从 MATLAB 2018b 开始的 MATLAB 较新版本中提供了 `decomposition()`\
  \ 函数。\n\n#### Simulink 建模\n\n除了前面展示和演示的 MATLAB 命令之外，Simulink 还有几个模块可以用来求解如 `[A]{x}\
  \ = [B]` 这样的线性方程组。所有这些求解器模块都位于 DSP System Toolbox 中，可以通过 Simulink 库访问：DSP System\
  \ Toolbox/数学函数/矩阵与线性代数/线性系统求解器。我们来测试其中的一些模块，以解决前面的示例，称为示例 1。打开一个空白的 Simulink 模型，从图\
  \ 7-9 所示的 DSP System Toolbox 库中拖放模块。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig9_HTML.jpg](img/471979_1_En_7_Fig9_HTML.jpg)\n\
  \n图 7-9\n\n用于求解线性方程组的 Simulink 模块\n\n它们分别如每个模块顶部所示——基于 LU、SVD、QR 分解和分解运算的求解器。所有这些求解器都有两个输入端口，用于输入`[A]`和`[B]`，以及一个输出端口用于输出解`{x}`。因此，您需要添加三个额外的模块——两个常量模块和一个显示模块——按照之前在构建\
  \ Simulink 模型计算矩阵的行列式、转置和逆矩阵时说明的方法添加。图 7-10 显示了 Simulink 模型的基本版本。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig10_HTML.jpg](img/471979_1_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10\n\n用于求解线性方程组的 Simulink 模型\n\n矩阵`[A]`和`[B]`的元素可以直接在常量模块的“常量值”窗口中输入，如图 7-3\
  \ 所示。或者，您可以通过 MATLAB 的命令窗口和工作区定义`[A]`和`[B]`的元素：\n\n```\n>> A=[2, 3, 5; -3, -2, 5;\
  \ 4, -7, 6]\n>> B=[1; 2; 3];\n```\n\n然后，将变量名称 `A` 和 `B` 分别输入到第一个和第二个常量模块的“常量值”框中，分别对应`[A]`和`[B]`，如图\
  \ 7-11 所示。单击“应用”和“确定”以完成模型。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig11_HTML.jpg](img/471979_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\n在常量模块中定义的变量名称\n\n通过在键盘上按 Ctrl+T 或单击 Simulink 模型窗口中的“运行”![../images/471979_1_En_7_Chapter/471979_1_En_7_Figc_HTML.jpg](img/471979_1_En_7_Figc_HTML.jpg)按钮，您将获得完整的模型及其仿真结果（见图\
  \ 7-12）。计算出的结果/解与 MATLAB 的解在小数点后四位内匹配。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig12_HTML.jpg](img/471979_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12\n\n包含计算结果的完整模型\n\n请注意，变量（矩阵）`A`和`B`是通过 MATLAB 命令窗口定义的。\n\n为了使用显示模块获得计算结果更多的小数位数，需要通过选择`long_e`来调整模块参数（格式类型），如图\
  \ 7-13 所示。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig13_HTML.jpg](img/471979_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13\n\n调整显示模块的格式参数\n\n\n\n#### 示例 2：嵌入 MATLAB Function 模块以计算行列式并求解线性方程组\n\n\
  之前演示的所有用于计算矩阵行列式、矩阵逆或线性系统解的 MATLAB 函数/命令，都可以通过 MATLAB Function 模块 ![../images/471979_1_En_7_Chapter/471979_1_En_7_Figd_HTML.jpg](img/471979_1_En_7_Figd_HTML.jpg)\
  \ 嵌入到 Simulink 中。我们将采用两个 MATLAB 函数/命令：一个用于使用 `det()` 计算任意大小矩阵的行列式，另一个用于使用 `linsolve()`\
  \ 求解，并将它们嵌入到一个 Simulink 模型中。例如：\n\n![$$ A1=\\left[\\begin{array}{ccc}16&amp; 2&amp;\
  \ -3\\kern0.5em 13\\\\ {}-5&amp; 11&amp; \\begin{array}{cc}10&amp; -8\\end{array}\\\
  \\ {}\\begin{array}{c}9\\\\ {}-4\\end{array}&amp; \\begin{array}{c}7\\\\ {}14\\\
  end{array}&amp; \\begin{array}{cc}\\begin{array}{c}-6\\\\ {}15\\end{array}&amp;\
  \ \\begin{array}{c}12\\\\ {}1\\end{array}\\end{array}\\end{array}\\right],B1=\\\
  left[\\begin{array}{c}\\begin{array}{c}3\\\\ {}2\\end{array}\\\\ {}4\\\\ {}5\\end{array}\\\
  right] $$](images/471979_1_En_7_Chapter/471979_1_En_7_Chapter_TeX_Equm.png)\n\n\
  以下是完整的 Simulink 模型。图 7-14 由三个 Constant、两个 MATLAB Function 和两个 Display 模块构建而成。\n\n\
  ![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig14_HTML.jpg](img/471979_1_En_7_Fig14_HTML.jpg)\n\
  \n**图 7-14**\n\n使用 MATLAB Function 模块计算行列式并求解线性方程组的 Simulink 模型\n\n在此模型中，输入变量 `A1`\
  \ 和 `B1` 的取值通过命令窗口和 MATLAB 工作区定义。要编辑并输入必要的脚本，需要打开 MATLAB Function 模块。双击该模块即可打开 MATLAB\
  \ 编辑器窗口。以下分别是针对上方 MATLAB Function 模块（带有一个输入）和下方模块（带有两个输入 `A1` 和 `B1`）的模型，在 MATLAB\
  \ 编辑器中键入的函数文件脚本。编辑完模块代码后，保存它们。这些脚本会保存在已创建的 Simulink 模型下，而不会作为独立的 MATLAB 函数文件保存。\n\
  \n```\nfunction y = fcn(u)\ny = det(u);\n```\n\n以及\n\n```\nfunction y = fcn(A1,\
  \ B1)\ny = linsolve(A1, B1);\n```\n\n然后模型就完成了，接着执行最终化的模型。图 7-15 显示的是带有计算结果（显示在 Display\
  \ 模块中）的完整模型。上方的 Display 模块显示行列式，下方的 Display 模块显示给定方程组的解。\n\n![../images/471979_1_En_7_Chapter/471979_1_En_7_Fig15_HTML.jpg](img/471979_1_En_7_Fig15_HTML.jpg)\n\
  \n**图 7-15**\n\n带有计算结果的完整模型\n\nSimulink 模型的计算结果可以与 MATLAB 的计算结果进行比较。\n\n```\n>>\
  \ A1=[16 2 -3 13 ; -5 11 10 -8; 9 7 -6 12; -4 14 15 1 ];\n>> B1 = [3; 2; 4; 5];\n\
  >> det(A1)\nans =\n\n>> linsolve(A1, B1)\nans =\n-3.614714012332536e-03\n2.740803742292154e-01\n\
  6.272591962577077e-02\n2.075271103550925e-01\n```\n\n行列式计算和线性 MATLAB 求解器的计算结果与 Simulink\
  \ 模型的结果精确匹配到小数点后 13 位。\n\n#### 示例 3：线性方程组求解函数的精度\n\n让我们来探究示例 1 中强调的函数/工具（方法）中哪一个在计算解时更精确。在本演示练习中，您将使用由\
  \ MATLAB 的 `magic()` 和 `randi()`（随机整数）矩阵生成函数生成的以下 13×13 `[A]` 矩阵和 13×1 `[B]` 矩阵。此外，`norm()`\
  \ 函数用于结合计算出的解来给定线性系统计算范数。`LA_ex2.m` 是完整的求解脚本：\n\n```\n%% Given 13-by-13 system of\
  \ linear equations\nclearvars; clc\nA = magic(13);\nB = randi([-169,169], 13,1);\
  \ % Elements of B vary within [-169, 169]\n%% 1-Way: inv()  or pinv()     %% INVERSE\
  \ matrix method\nx1a = inv(A)*B;\nErr_INV = norm(A*x1a-B)/norm(B)     %#ok: ERROR\
  \ checking\nx1b = pinv(A)*B;\nErr_PINV = norm(A*x1b-B)/norm(B)     %#ok: ERROR checking\n\
  %% 2-Way: \\     %% backslash\nx2  = A\\B;\nErr_BACKSLASH = norm(A*x2-B)/norm(B)\
  \    %#ok: ERROR checking\n%% 3-Way: mldivide()          %% Left divide function\n\
  x3 = mldivide(A, B);\nErr_MLDIVIDE = norm(A*x3-B)/norm(B)   %#ok: ERROR checking\n\
  %% 4-Way: Using linsolve()\nx4 = linsolve(A, B);\nErr_LINSOLVE = norm(A*x4-B)/norm(B)\
  \   %#ok: ERROR checking\n%% 5-Way: Using lsqr()\nx5 = lsqr(A, B);\nErr_LSQR = norm(A*x5-B)/norm(B)\
  \   %#ok: ERROR checking\n%% 6-Way: Using lu()\n[L, U, P] = lu(A);\ny = L\\(P*B);\n\
  x6 = U\\y;\nErr_LU = norm(A*x6-B)/norm(B)   %#ok: ERROR checking\n%% 7 - Way: Using\
  \ rref()\nMA = [A, B];\nxyz = rref(MA);\nx7= xyz(:,end);\nErr_RREF = norm(A*x7-B)/norm(B)\
  \   %#ok: ERROR checking\n%%  8 - Way: Using svd()\n[U, S, V]= svd(A);\nx8 = V*inv(S)*U'*B;\n\
  Err_SVD = norm(A*x8-B)/norm(B)   %#ok: ERROR checking\n%% 9 - Way: Using chol()\n\
  [U, L] = chol(A);\nx9 = U\\(U'\\B);\nErr_CHOL = norm(A*x9-B)/norm(B)   %#ok: ERROR\
  \ checking\n%% 10 - Way: Using qr()\n[Q, R] = qr(A);\nx10  = R\\Q.'*B;\nErr_QR =\
  \ norm(A*x10-B)/norm(B)   %#ok: ERROR checking\n%% 11 - Way: Using decomposition()\n\
  x11 = decomposition(A)\\B;\nErr_DECOMPOSITION = norm(A*x11-B)/norm(B) %#ok: ERROR\
  \ checking\n%% 12 - Way: Using bicg()\nx12 = bicg(A,B);\nErr_BICG = norm(A*x12-B)/norm(B)\
  \   %#ok: ERROR checking\n%% 13-Way: solve()            %% SOLVE() symbolic math\
  \ method\nx = sym('x', [1, 13]); x=x';\nEqn = A*(x); Eqn = Eqn - B;\nSolution =\
  \ solve(Eqn); SOLs = struct2array(Solution);\nSOLs = double(SOLs); x13 = SOLs';\n\
  Err_SOLVE = norm(A*x13-B)/norm(B)   %#ok: ERROR checking\n```\n\n以下是使用这些方法求解方程组时产生的误差。\n\
  \n```\nErr_INV =\n5.8087e-16\nErr_PINV =\n3.7982e-15\nErr_BACKSLASH =\n3.0569e-16\n\
  Err_MLDIVIDE =\n3.0569e-16\nErr_LINSOLVE =\n3.0569e-16\nlsqr converged at iteration\
  \ 7 to a solution with relative residual 3.5e-07.\nErr_LSQR =\n3.4959e-07\nErr_LU\
  \ =\n3.0569e-16\nErr_RREF =\n1.1576e-05\nErr_SVD =\n3.7982e-15\nErr_CHOL =\n2.2400\n\
  Err_QR =\n7.0615e-16\nErr_DECOMPOSITION =\n3.0569e-16\nbicg stopped at iteration\
  \ 13 without converging to the desired tolerance 1e-06\nbecause the maximum number\
  \ of iterations was reached.\nThe iterate returned (number 13) has relative residual\
  \ 9.6e-06.\nErr_BICG =\n9.5856e-06\nErr_SOLVE =\n1.5109e-16\n```\n\n从计算出的误差来看，`RREF()`、`BICG()`\
  \ 和 `LSQR()` 函数在计算该给定系统的解时，误差控制在 10^(−5)…10^(−7) 范围内，而所有其他方法在计算该给定系统的解时，误差均控制在 10^(−15)…10^(−16)\
  \ 范围内。\n\n\n#### 示例 4：线性方程求解函数的效率\n\n本示例旨在展示所列方法中哪一种在计算时间上更为高效。为此，你将使用随机整数生成函数 `randi()`\
  \ 生成两个大型矩阵 [A]（1000×1000）和 [B]（1000×1）的元素。此外，为了记录每种计算方法的耗时，将使用 `tic` 和 `toc` 函数。以下是完整的求解脚本，名为\
  \ `LA_ex3.m`：\n\n```\nclearvars\nA=randi([-100,100],1000); B=randi([-100, 100],\
  \ 1000, 1);\n%% 1) inv() 或 pinv()\ntic; Ai = inv(A); xyz1=Ai*B; T_inv=toc\n%% 2)\
  \ 反斜杠运算符：\\\nclearvars\nA=randi([-100,100],1000); B=randi([-100, 100], 1000, 1);\n\
  tic; xyz2 = A\\B; T_backslash = toc\n%% 3) mldivide()\nclearvars\nA=randi([-100,100],1000);\
  \ B=randi([-100, 100], 1000, 1);\ntic; xyz3= mldivide(A, B); T_mld = toc\n%% 4)\
  \ linsolve()\nclearvars\nA=randi([-100,100],1000); B=randi([-100, 100], 1000, 1);\n\
  tic; xyz4 = linsolve(A, B); T_linsolve = toc\n%% 5) lsqr()\nclearvars\nA=randi([-100,100],1000);\
  \ B=randi([-100, 100], 1000, 1);\ntic; xyz5 = lsqr(A, B); T_lsqr = toc\n%% 6) lu()\n\
  clearvars\nA=randi([-100,100],1000); B=randi([-100, 100], 1000, 1);\ntic; [L, U,\
  \ P]=lu(A); y=L\\(P*B); xys6=U\\y; T_lu=toc\n%% 7) rref()\nclearvars\nA=randi([-100,100],1000);\
  \ B=randi([-100, 100], 1000, 1);\ntic; MA = [A, B];xyz7 = rref(MA); XYZ7=xyz7(:,\
  \ end); T_rref=toc\n%% 8) svd()\nclearvars\nA=randi([-100,100],1000); B=randi([-100,\
  \ 100], 1000, 1);\ntic; [U S V] = svd(A); xyz8 = V*inv(S)*U'*B; T_svd=toc\n%% 9)\
  \ chol()\nclearvars\nA=randi([-100,100],1000); B=randi([-100, 100], 1000, 1);\n\
  tic; [U L]= chol(A); xyz9 = U\\(U'\\B); T_chol=toc\n%% 10) qr()\nclearvars\nA=randi([-100,100],1000);\
  \ B=randi([-100, 100], 1000, 1);\ntic; [Q R] = qr(A); xyz10 = R\\Q.'*B ; T_qr=toc\n\
  %% 11) decomposition()\nclearvars\nA=randi([-100,100],1000); B=randi([-100, 100],\
  \ 1000, 1);\ntic; xyz11 = decomposition(A)\\B; T_decom = toc\n%% 12) bicg()  梯度方法\n\
  clearvars\nA=randi([-100,100], 1000); B=randi([-100, 100], 1000, 1);\ntic; xyz12\
  \ = bicg(A, B); T_bicg=toc\n%% 13) solve()\nA=randi([-100,100],100); B=randi([-100,\
  \ 100], 100, 1);\ntic;\nx = sym('x', [1, 100]); x=x';\nEqn = A*(x); Eqn = Eqn -\
  \ B;\nSolution = solve(Eqn); SOLs = struct2array(Solution);\nSOLs = double(SOLs);\
  \ x13 = SOLs';\nT_solve=toc\n```\n\n以下是模拟得出的计算耗时值。\n\n```\nT_inv =\n0.0390\nT_backslash\
  \ =\n0.0173\nT_mld =\n0.0171\nT_linsolve =\n0.0171\nlsqr stopped at iteration 20\
  \ without converging to the desired tolerance 1e-06\nbecause the maximum number\
  \ of iterations was reached.\nThe iterate returned (number 20) has relative residual\
  \ 0.24.\nT_lsqr =\n0.0236\nT_lu =\n0.0235\nT_rref =\n10.1406\nT_svd =\n0.4263\n\
  T_chol =\n0.0330\nT_qr =\n0.1045\nT_decom =\n0.0459\nbicg stopped at iteration 20\
  \ without converging to the desired tolerance 1e-06\nbecause the maximum number\
  \ of iterations was reached.\nThe iterate returned (number 0) has relative residual\
  \ 1.\nT_bicg =\n0.0195\nT_solve =\n14.6306\n```\n\n从这些计算中可以看出，`linsolve()`、`mldivide`\
  \ 和 `\\`（反斜杠运算符，即高斯消元法）在所有测试方法中速度最快。最慢且计算成本最高的是符号数学工具箱中的 `solve()` 运算符，即便系统的规模小了\
  \ 10 倍。值得注意的是，行简化阶梯形方法 `rref()` 是仅次于 `solve()` 运算符的第二慢方法。\n\n我们再看另一个示例，来求解前面讨论过的四种不同方法：`\\\
  `、`linsolve()`、`inv()` 和 `solve()`。\n\n#### 示例 5：通过改变 `[b]` 的值来求解线性方程（`[A]{x} =\
  \ [b]`）\n\n本练习包含两部分：\n\n1.  求解给定线性系统中的未知数 *a*、*b* 和 *c*。\n\n    ![$$ \\left\\{\\\
  begin{array}{c}0.072a-c=-12\\\\ {}0.12b-c=-9\\\\ {}a+b=50\\end{array}\\right. $$](img/471979_1_En_7_Chapter_TeX_Equn.png)\n\
  \n2.  求解给定系统中的未知数 *a*、*b* 和 *c*。第三个方程的值在 50…250 的范围内变化。\n\n    ![$$ \\left\\{\\\
  begin{array}{c}0.072a-c=-12\\\\ {}0.12b-c=-9\\\\ {}a+b=50\\dots 250\\end{array}\\\
  right. $$](img/471979_1_En_7_Chapter_TeX_Equo.png)\n\n将该系统重写为矩阵形式 `[A]{x} = [B]`，然后直接求解未知数\
  \ *a*、*b* 和 *c*。以下是求解脚本（`LA_Ex4.m`）。\n\n```\n% 第一部分。\n% 给定的系统从 Ax=B 写为 [A]*[abc]=[B]\n\
  A=[.072, 0, -1; 0, .12, -1; 1 1 0];\nB=[-12, -9, 50];\nabc1=A\\B'              \
  \  %#ok  % 反斜杠 \\\nabc2 = linsolve(A,B')    %#ok  % LINSOLVE()\nabc3 = inv(A)*B'\
  \         %#ok  % INV\n% 符号数学中的 SOLVE()\nsyms a b c\nabc4=solve(0.072*a-c+12, 0.12*b-c+9,\
  \ a+b-50);\nabc4=double([abc4.a; abc4.b; abc4.c]) %#ok  % SOLVE()\n%% 第二部分 %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%\n\
  % 反斜杠 \\ ; LINSOLVE(); INV\ntic\nBk=50:250;\na=zeros(numel(Bk),1); b=zeros(numel(Bk),1);\
  \ c=zeros(numel(Bk),1);\nA=[.072, 0, -1; 0, .12, -1; 1 1 0];\nfor ii=1:numel(Bk)\n\
  B=[-12; -9; Bk(ii)];\nabc=A\\B;\na(ii)=abc(1,:);\nb(ii)=abc(2,:);\nc(ii)=abc(3,:);\n\
  end\nTime1=toc;\nfprintf('使用反斜杠的计算时间: %3.3f  \\n', Time1)\nclearvars\ntic\nBk=50:250;\n\
  a=zeros(numel(Bk),1); b=zeros(numel(Bk),1); c=zeros(numel(Bk),1);\nA=[.072, 0, -1;\
  \ 0, .12, -1; 1 1 0];\nfor ii=1:numel(Bk)\nB=[-12; -9; Bk(ii)];\nabc=linsolve(A,B);\n\
  a(ii)=abc(1,:);\nb(ii)=abc(2,:);\nc(ii)=abc(3,:);\nend\nTime2=toc;\nfprintf('使用\
  \ LINSOLVE 的计算时间:  %3.3f  \\n', Time2)\nclearvars\ntic\nBk=50:250;\na=zeros(numel(Bk),1);\
  \ b=zeros(numel(Bk),1); c=zeros(numel(Bk),1);\nA=[.072, 0, -1; 0, .12, -1; 1 1 0];\n\
  for ii=1:numel(Bk)\nB=[-12; -9; Bk(ii)];\nabc=inv(A)*B;\na(ii)=abc(1,:); b(ii)=abc(2,:);\
  \ c(ii)=abc(3,:);\nend\nTime3=toc;\nfprintf('使用 INV 的计算时间:       %3.3f  \\n', Time3)\n\
  %% 符号数学中的 SOLVE()\nclearvars\ntic;\nBk=50:250;\na1=zeros(numel(Bk),1);b1=zeros(numel(Bk),1);\
  \ c1=zeros(numel(Bk),1);\nsyms a b c\nfor ii=1:numel(Bk)\nabc=solve(0.072*a-c+12,0.12*b-c+9,a+b-Bk(ii));\n\
  a1(ii)=double(abc.a);\nb1(ii)=double(abc.b);\nc1(ii)=double(abc.c);\nend\nTime4=toc;\n\
  fprintf('使用 SOLVE 的计算时间:     %3.3f  \\n', Time4)\n```\n\n以下是第一部分计算的结果：\n\n```\n\
  abc1 =\n15.6250\n34.3750\n13.1250\nabc2 =\n15.6250\n34.3750\n13.1250\nabc3 =\n15.6250\n\
  34.3750\n13.1250\nabc4 =\n15.6250\n34.3750\n13.1250\n```\n\n以下是第二部分脚本的结果：\n\n```\n\
  使用反斜杠的计算时间: 0.002\n使用 LINSOLVE 的计算时间:  0.002\n使用 INV 的计算时间:       0.002\n使用 SOLVE\
  \ 的计算时间:    22.066\n```\n\n从使用四种方法计算包含三个变量和 201 种可能情况的给定线性系统所花费的计算时间来看，效率最低的求解线性方程的方法是使用符号数学工具箱的\
  \ `solve()` 函数。反斜杠运算符（`\\`）、`linsolve()` 和 `inv()` 方法的性能相当。求解器 `linsolve()`、`\\\
  ` 和 `inv()` 方法比 `solve()` 函数高效 11033 倍以上。\n\n\n# 矩阵运算\n\n本节涵盖矩阵、向量和特征向量的一般数学运算与计算。文中使用大量数值示例来解释矩阵运算。表\
  \ 7-1 列出了矩阵运算及其命令语法。\n\n**表 7-1** 两种等价形式的矩阵运算符\n\n| 运算名称 | MATLAB 第一种方式 | MATLAB\
  \ 第二种方式 |\n| --- | --- | --- |\n| 矩阵乘法 | `A*B` | `mtimes(A,B)` |\n| 逐元素乘法 | `A.*B`\
  \ | `times(A,B)` |\n| 矩阵右除 | `A/B` | `mrdivide(A,B)` |\n| 逐元素右除 | `A./B` | `rdivide(A,B)`\
  \ |\n| 矩阵左除 | `A\\B` | `mldivide(A,B)` |\n| 逐元素左除 | `A.\\B` | `ldivide(A,B)` |\n\
  | 矩阵幂 | `A^B` | `mpower(A,B)` |\n| 逐元素幂 | `A.^B` | `power(A,B)` |\n| 复共轭转置 | `A'`\
  \ | `ctranspose(A)` |\n| 矩阵转置 | `A.'` | `transpose(A)` |\n| 二元加法 | `A+B` | `plus(A,B)`\
  \ |\n| 一元加法 | `+A` | `uplus(A)` |\n| 二元减法 | `A-B` | `minus(A,B)` |\n| 一元减法 | `-A`\
  \ | `uminus(A)` |\n| 行列式 | `det(A)` | `det(A)` |\n| 逆时针旋转 90⁰ | `rot90(A)` | `rot90(A)`\
  \ |\n| 复制并平铺数组 n 次 | `repmat(A, n)` | `repmat(A, n)` |\n| 左右翻转矩阵 | `fliplr(A)` |\
  \ `fliplr(A)` |\n| 上下翻转矩阵 | `flipud(A)` | `flipud(A)` |\n\nMATLAB 的基本单元数据采用数组类型格式。在许多情况下，可以使用矩阵和向量来定义输入输出、局部数据以及函数的输入输出。此外，它们还可用于将多个独立的标量合并为一个信号，并处理多维输入和输出信号。数组由一个名称和按行、列排列的一组数据来定义，如下所示。\n\
