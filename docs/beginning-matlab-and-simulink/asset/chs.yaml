  ## 引言


  本书面向 MATLAB/Simulink 软件包的初学级学习者。它涵盖了 MATLAB 和 Simulink 软件包中必备的实践工具与函数，并通过互动示例和案例研究进行讲解。本书的主要原则是“做中学”，内容由浅入深。书中包含数十个通过
  M/MLX 文件/脚本和 Simulink 模型实现的解决方案与仿真模型，可帮助您学习编程和建模的要点。此外，本书还提供了许多关于避免 MATLAB/Simulink
  软件包在编程和建模方面常见陷阱的建议。


  《MATLAB 与 Simulink 入门》通过对比 MATLAB 的编程工具和 Simulink 的模块，并行解释了编程和建模的各种实际应用问题。学习本书后，您将能够熟练使用
  MATLAB/Simulink 软件包。您可以将书中的示例源代码和模型作为模板，应用于您自己的数据科学、数值分析、建模与仿真或工程项目中。


  本书的核心学习成果包括：


  - 开始使用 MATLAB 和 Simulink

  - 使用 MATLAB 执行数据分析和可视化

  - MATLAB 的编程要点与 Simulink 的核心建模方面，以及如何关联 MATLAB 和 Simulink 软件包的脚本与模型

  - 在 MATLAB 中开发 GUI 模型和独立应用程序

  - 在 MATLAB 和 Simulink 中使用积分和数值求根方法

  - 在 MATLAB 和 Simulink 中求解微分方程

  - 应用 MATLAB 进行数据分析与数据科学项目


  本书包含八个逻辑上相互关联的章节。


  - 第 1 章专门介绍 MATLAB 环境及 MATLAB 可识别的数据类型，包括数值型、元胞数组、结构体、字符型、逻辑型、函数句柄和表格。

  - 第 2 章涵盖了大部分基本编程工具和函数，例如`for … end`和`while … end`循环运算符、`if…elseif…else…end`条件运算符、符号引用，以及最常见的错误和警告。本章还介绍了
  MATLAB 中的 M 文件调试工具和选项。此外，本章还讲解了 MATLAB 特有的编程工具，包括函数文件、函数句柄和显示运算符，如`disp()`、`display`、`fprintf`和`sprint`。

  - 第 3 章涵盖 GUI 开发以及如何编写和编辑 GUI 模型回调函数。

  - 第 4 章讨论如何从现有的 M 文件开发 MEX 文件、C/C++ 代码和独立应用程序的问题。

  - 第 5 章专门介绍 Simulink 建模要点。本章中的示例涵盖矩阵运算、函数值计算、建模以及求解常微分方程。此外，还讨论了如何将 Simulink 模型与
  MATLAB 脚本关联的问题。

  - 第 6 章致力于数据可视化问题，例如在 MATLAB 中构建 2D 和 3D 图形以及动画图形。

  - 第 7 章专门介绍矩阵代数和数组操作。它通过同时在 MATLAB 和 Simulink 中求解的示例，阐述了求解线性方程组、特征值问题、矩阵分解、矩阵和向量运算，以及数组和字符串的转换。

  - 第 8 章涵盖了解析求解常微分方程以及使用 MATLAB 内置函数和命令的一些基本方面。


  本书中讨论的所有源代码（脚本、M/MLX/MAT 文件、Simulink 模型、SLX/MDL 文件、C 代码、MEX 文件和安装`*.exe`文件）均可通过本书在
  `apress.com` 产品页面上的“下载源代码”按钮获取，也可通过位于 [`www.apress.com/9781484250600`](http://www.apress.com/9781484250600)
  的“下载源代码”链接访问。




