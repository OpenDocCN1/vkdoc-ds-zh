  \ `untitled.slx`，就像 `MATLAB` 的 `M`/`MLX` 文件一样。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig4_HTML.jpg](img/471979_1_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n\n新建的 Simulink 模型窗口（默认未命名）\n\n在打开的空白模型窗口中，点击 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Fige_HTML.jpg](img/471979_1_En_5_Fige_HTML.jpg)（Simulink\
  \ 库图标）。这将打开一个 Simulink 库窗口，如图 5-5 所示。必须注意，库中可用的工具箱由已安装的工具箱以及用户开发/创建的自定义库决定。如有必要，您也可以通过点击库浏览器中的“新建模型”图标\
