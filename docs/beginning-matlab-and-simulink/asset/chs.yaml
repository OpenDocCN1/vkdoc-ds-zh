- "# 在命令窗口中工作\n\n在 MATLAB 中，工作通常始于命令窗口，但在输入任何命令之前，有必要留意一下当前目录。当前目录地址可以直接在主窗口中查看（见图\
  \ 1-8），或者在命令窗口中输入以下命令查看：\n\n```\n>> pwd\n```\n\n如有需要，你可以使用 `>> cd` 命令，或者用鼠标左键点击路径目录（见图\
  \ 1-8）并输入目录地址（`C:` ➤ `Users` ➤ `David` ➤ `Documents` ➤ `MATLAB` ➤）来更改当前目录。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig8_HTML.jpg](img/471979_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8\n\n查看和更改当前工作目录\n\n此外，你可以添加一些新路径到工作目录中。例如，要向一个已有文件夹添加路径，请使用以下命令。\n\n```\n\
  >> addpath('C:\\Users\\David\\Documents\\MATLAB');\n```\n\n`addpath()` 命令在脚本中也很有用，可用于从特定文件夹或目录读取或加载数据。对于简短命令和计算，以及查看当前目录中可用变量的属性，请使用命令窗口。但对于一系列命令和较长的脚本，使用脚本编辑器（例如\
  \ M 文件和 MLX 文件编辑器）则效率更高。\n\nMATLAB 应用程序中有几种可通过其扩展名识别的文件类型。它们分别是 `.M`、`.MLX`、`.MAT`、`.BI`\
  \ 和 `.FIG`。M 文件用于编写程序/脚本/函数文件。MLX 文件（即 Live M 文件）用于编写程序/脚本/函数文件，并可在 MLX 文件编辑器窗口中查看计算结果。MAT\
  \ 文件用于保存工作区中所有类型的变量，并且可以轻松地从 M/MLX 文件和命令窗口访问。在这些文件中，`.BI` 文件用于 MATLAB 的内置文件，`.FIG`\
  \ 文件用于保存 MATLAB 中的图形窗口。此外，Simulink 应用有三种文件类型——`mdl`、`.slx` 和 `.slxc`。它们用于构建和仿真 Simulink\
  \ 模型，也可以在不打开的情况下从 MATLAB 中调用/仿真。我将在本书后面章节中讨论这些文件的基本功能以及如何使用它们。\n\n虽然使用命令窗口进行简单计算、数据生成和处理已经足够，但可以使用键盘的上箭头键来避免重新输入之前输入过的命令和条目。例如，如果你在命令窗口中输入了\
  \ `>> A1 = [1, 2, 4, -5, 6]; B = A+2`，然后需要对这些条目进行修改，你可以在输入 `>> A` 后使用上箭头键。MATLAB\
  \ 会自动调用你之前的输入。\n\n## 命令窗口与变量\n\nMATLAB 是区分大小写的，并且其所有内置命令都是小写。当你执行计算时，会为计算结果指定一个名称。这个指定的名称就是变量名。计算结果会以给定的变量名保存在\
  \ MATLAB 工作区中。例如，`>> A =13`；`B = A*2` 表示名为 `A` 的变量等于 `13`，名为 `B` 的变量等于 `2` 乘以 `A`。\n\
  \n### 使用变量\n\n变量名必须以字母开头，并且可以包含任意整数（如 0、1、2……9）和下划线（`_`）。变量名中不能使用其他符号。变量名的最大长度为\
  \ 63 个字符。由于 ANSI/ASCII 符号转换，MATLAB 将名为 `a` 和 `A` 的变量视为两个不同的变量。现在，让我们开始在命令窗口中工作：输入并指定变量名，执行一些基本的算术运算，并对输出数据格式进行更改。\n\
  \n```\n>> A=3; B=-2; C=1/2; D = -1.5; ABCD=A²+B/C+D;\n>> ABCD              % 缺少\
  \ \";\"，因此显示了变量 ABCD 的内容\nABCD =\n3.5000\n>> sqrt(ABCD)  % 如果未指定变量名，则 \"ans\" 是\
  \ MATLAB 的默认名称\nans =\n1.8708\n>> ans+1  % 如果未指定变量名，\"ans\" 将替代之前的 \"ans\"。\nans\
  \ =\n2.8708\n```\n\n用户输入的结果显示在命令窗口中，并可以使用以下显示格式选项进行更改：`format long`、`format short`、`format\
  \ long eng`、`format bank`、`format hexadecimal`、`format rational` 等。以下是格式选项的一些示例。当你更改显示格式类型时，实际的变量值不会改变。\n\
  \n```\n>> A=3; B=-2; C=1/2; D = -1.5;\n>> ABCD=A²+B/C+D;\n>> format bank\n>> ABCD\n\
  ABCD =\n3.50\n>> format long eng\n>> ABCD\nABCD =\n3.50000000000000e+000\n>> sqrt(ABCD)\n\
  ans =\n1.87082869338697e+000\n>> format short\n>> sqrt(ABCD)\nans =\n1.8708\n>>\
  \ format bank\n>> sqrt(ABCD)\nans =\n1.87\n>> format long eng\n>> sqrt(ABCD)\nans\
  \ =\n1.87082869338697e+000\n>> format compact\n>> sqrt(ABCD)\nans =\n1.87082869338697e+000\n\
  >> format rat\n>> sqrt(ABCD)\nans =\n1738/929\n>> format hex\n>> sqrt(ABCD)\nans\
  \ =\n3ffdeeea11683f49\n```\n\n\n\n### 注意\n\nMATLAB 是区分大小写的，因此它将变量 `a` 和 `A` 视为两个不同的变量。\n\
  \n在命令窗口中输入变量名或内置命令/函数名的前几个字母后，可以使用 TAB 键访问匹配的命令/函数，包括您开发的函数文件。例如，如果您键入`>> AB`然后按下\
  \ TAB 键，`ABCD`变量计算表达式的其余部分将显示为一个选项。\n\n命令窗口的另一个有用功能是使用键盘的上箭头 (↑) 来重新调用之前键入的变量或命令。您只需键入之前键入的任何命令或函数名的前几个字母，然后按上箭头\
  \ (↑)。例如，`>> f`↑ 会重新调用之前键入的命令`>> format long`。此外，上箭头 (↑) 还可以与 TAB 键配合使用，以在命令窗口中重新调用之前输入的命令。\n\
  \n在命令窗口中输入的所有变量的值和属性都将保存在工作区中，直到您通过使用 `clear`、`clearvars` 或 `clear all` 命令删除变量，或使用鼠标左右键选项选择并删除它们来清理工作区为止。此外，所有变量及其属性都会保存在工作区中，直到\
  \ MATLAB 程序包关闭为止。\n\nMATLAB 中最常用的三个整理命令是：\n\n*   `clc` — 用于清理命令窗口，并从一个空白命令窗口开始\n\
  *   `clear` 和 `clearvars` — 用于移除工作区中保存的所有变量\n*   `clear all` — 用于移除所有变量以及临时编译并保存的\
  \ M 文件机器码、断点和调试设置\n\n所有这些命令也可以与 M 文件和 MLX 文件一起使用。必须注意，不推荐将 `clear all` 命令与 M 文件和\
  \ MLX 文件一起使用，因为它会降低代码/脚本的效率，并在您声明 `clear global` 命令时产生意外行为。让我们来看一些有效使用这些命令的方法。\n\
  \n```\n>> A=3; B=-2; C=1/2; D = -1.5; ABCD=A²+B/C+D;\n>> clear         % 移除工作区中的所有条目，工作区变为空白\n\
  >> clearvars       % 等同于 \"clear\"\n>> clear variables % 等同于 \"clearvars\"\n>> clear\
  \ all % 等同于 \"clear\"，并且还会移除已编译的代码\n>> clear  A B C D  % 移除变量：A B C D，保留 ABCD 不变\n\
  >> A=3; B=-2; C=1/2; D = -1.5; ABCD=A²+B/C+D;\n>> clearvars  –except A B C   % 移除除\
  \ A B C 之外的所有变量\n```\n\nMATLAB 可以对变量和文件名使用通配符 `*` 星号。例如，要移除所有名称以字母“A”开头的变量，您可以使用以下命令。\n\
  \n```\n>> A=3; B=-2; C=1/2; D = -1.5; ABCD=A²+B/C+D; ABC=A²+B*C;\n>> clear  A* \
  \   % 移除所有以 A 开头的变量，即 A、ABCD 和 ABC 被移除\n>> clearvars A*  % 等同于：clear A*\n```\n\n\
  所有输入和保存的变量都可以通过在命令窗口中键入 `who` 或 `whos` 命令，从工作区窗口中查看。例如：\n\n```\n>> A=3; B=-2; C=1/2;\
  \ D = -1.5; ABCD=A²+B/C+D; ABC=A²+B*C;\n>> who\n\nA  B  C  D  ABCD  ABC\n\n>> whos\n\
  \n  Name      Size            Bytes  Class     Attributes\n  A       1x1       \
  \          8  double\n  ABC     1x1                 8  double\n  ABCD    1x1   \
  \              8  double\n  B       1x1                 8  double\n  C       1x1\
  \                 8  double\n  D       1x1                 8  double\n```\n\n从这些例子可以清楚地看出，MATLAB\
  \ 将每个条目都读取为一个数组/矩阵。例如，一个标量被 MATLAB 读取为大小为 1×1 的数组。MATLAB 的这个属性在逻辑上与其名称“矩阵实验室”（MATrix\
  \ LABoratory）相关联。MATLAB 的默认存储（内存分配）是双精度，这是可分配的最大可用空间。然而，为了提高内存效率和更快的计算速度，也可以使用其他存储格式。MATLAB\
  \ 支持单精度或整数类型以及 `int8` … `int64`、`uint8` … `uint64` 存储格式类型。表 1-1 展示了数据如何保存在每种存储类类型中，以及\
  \ MATLAB 中每种类型使用的转换函数。\n\n### 注意\n\nMATLAB 的默认存储类型是 double。然而，这可以通过指定或转换变量/数据的值，更改为单精度或整数类型\
  \ — `int8` … `int64`、`uint8` … `uint64`。\n\n**表 1-1** MATLAB 中的数据存储格式类型\n\n| -![../images/471979_1_En_1_Chapter/471979_1_En_1_Figf_HTML.gif](img/471979_1_En_1_Figf_HTML.gif)\
  \ |\n\n当您拥有数值数据和浮点格式时，双精度存储为您提供了最大的存储空间以获得更高精度。双精度最多可以保存 16 位十进制数字。对于浮点格式的数据，单精度存储比双精度（MATLAB\
  \ 中的默认存储格式）内存效率更高，但精度较低。如果在计算和数据处理中仅使用整数，根据数据的最大值，使用 `int8` … `int64` 或 `uint8`\
  \ … `uint64` 更为合适。以下是如何在保存声明变量的值时指定存储类型的一些示例。\n\n```\n>> F01=127;Fint_08=int8(F01),\
  \ Fnew1 = Fint_08+1\n\nFint_08 =\n\n  int8\n\n\nFnew1 =\n\n  int8\n\n\n>> F16=65535;\
  \ Fint_16=uint16(F16), Fnew2 = Fint_16+1\n\nFint_16 =\n\n  uint16\n\nFnew2 =\n\n\
  \  uint16\n\n```\n\n在根据 `int8` 和 `uint16` 格式的变量值计算 `Fnew1` 和 `Fnew2` 变量时，分配的存储空间无法容纳更多值（即，对于\
  \ `int8`，最大分配存储空间为 127 = 2⁷ − 1；对于 `uint16`，最大为 65535 = 2¹⁶ − 1）。因此，计算中发生了错误。请注意，在这种情况下，MATLAB\
  \ 不会显示错误。图 1-9 展示了 MATLAB 中支持的所有数据存储类型和数据格式。\n\n![../images/471979_1_En_1_Chapter/471979_1_En_1_Fig9_HTML.png](img/471979_1_En_1_Fig9_HTML.png)\n\
  \n**图 1-9** MATLAB 中支持的不同类型的数据存储选项\n\n命令窗口的历史记录窗格是查看所有条目（除非您删除它们，否则这些条目会被保留）的好方法。您也可以更改“首选项”窗口中的设置，以便在结束会话后清除条目历史记录。\n\
  \n最后，要退出 MATLAB 或结束一个工作会话，请在命令窗口中发出以下命令之一：\n\n```\n>> exit\n>> quit\n```\n\n或者使用键盘上的\
  \ `Ctrl+Q` 退出。\n\n另一种退出方式是点击主窗口右上角的关闭按钮（**x**）。这将关闭整个程序包。\n\n\n"
- "# 何时使用命令窗口\n\n在以下情况下使用命令窗口：\n\n- 执行简短计算\n- 查看命令或/及在执行 M 文件、MLX 文件以及 SLX/MDL Simulink\
  \ 模型后产生的错误和警告信息\n- 查看工作区中保存的变量属性以及当前目录中的文件\n- 查看 MATLAB 兼容文件的内容\n- 执行 MATLAB 文件，例如\
  \ M 文件、MLX 文件、SLX/MDL 文件和 MAT 文件\n- 获取关于 MATLAB 命令/函数和用户创建函数文件的实用快速帮助\n- 调整数值数据的显示格式\n\
  - 添加/删除路径/目录\n- 创建/删除/保存变量和文件\n\n让我们看几个示例来展示您可以在命令窗口中执行的其他操作。\n\n1.  查看和分析常见错误并解释错误消息：\n\
  \n```\n>> F16=65535; Fint_16=uint16(F16); Fnew2 = Fint_16+1;\n>> Fnew+2 % 变量 Fnew\
  \ 在工作区中不存在\n未定义函数或变量 'Fnew'。\n>> clar F16 % 拼写错误：\"clar\" 而不是 \"clear\"\n未定义函数或变量\
  \ 'clar'。\n>> CLear % 拼写错误：\"CLear\" 而不是 \"clear\"。注意：MATLAB 区分大小写\n未定义函数或变量 'CLear'。\n\
  您是不是想找：\n>> clear % MATLAB 自动建议最接近命令的正确语法\n>> B=-2; C=1/2; BC=B/.C; % 非法操作：B/.C\
  \ 而不是 B/C；\nB=-2; C=1/2; BC=B/.C;\n↑\n错误：意外的 MATLAB 运算符。\n>> B=-2; C=1/2; BC=B /*C;\
  \ % 非法操作：B/*C 而不是 B/C；\nB=-2; C=1/2; BC=B /*C;\n↑\n错误：无效的运算符使用。\n>> % 让我们创建一个包含两个元素的两行矩阵，即第一行中的\
  \ B, C 和第二行中的 F16。\n>> BCF = [B, C; F16] % 第 1 行的元素数量与第 2 行的元素数量不匹配\n使用 vertcat\
  \ 时出错\n要连接的数组的维度不一致。\n>> % 让我们尝试创建一个元素之间用 \",\"、空格和 \".\" 分隔的行矩阵\n>> BCF = [B, C.\
  \ F16] % 错误是错误使用了 \".\" 而不是 \",\"，但不属于所示的点索引\n此类型的变量不支持点索引。\n>> BCF = [B, C, F16]\
  \ % 这是预期的正确命令。\n```\n\n2.  将工作区中保存的变量保存到 `*.mat` 文件中：\n\n```\n>> save MYdata.mat\
  \ % 将工作区中的所有变量保存到 MYdata.mat 文件中\n>> save('MYdata.mat') % 同上\n>> save MYdata.mat\
  \ F16 Fnew2 % 将变量 F16、Fnew2 保存到 MYdata.mat 文件中\n>> save('MYdata.mat', 'F16 ', 'Fnew2\
  \ ') % 同上\n>> save MYdata.mat F* % 保存所有名称以 F 开头的变量（在工作区中）\n```\n\n3.  获取快速帮助：\n\n\
  ```\n>> help format\nformat 设置输出格式。\n不带输入的 format 将输出格式设置为变量类别的默认格式。\n对于浮点变量，默认值为\n\
  format SHORT。...\n>> help dir\ndir 列出目录。\ndir directory_name 列出目录中的文件。可以使用路径名和\n\
