  \ 乘法。\n\n3. 将 `Math Function`（转置）模块链接到 `Gain` 模块（`1/5`），该模块随后链接到 `Sum` 模块。`Product\
  \ of Elements` 模块连接到 `Sqrt` 模块，后者又链接到 `Gain` 模块（![$$ \\sqrt{3.3i} $$](img/471979_1_En_5_Chapter_TeX_IEq10.png)）。最后，来自\
  \ `Gain` 模块（`1/5`）和 `Gain` 模块（![$$ \\sqrt{3.3i} $$](img/471979_1_En_5_Chapter_TeX_IEq11.png)）的信号连接到\
  \ `Sum` 模块（见图 5-13），该模块再链接到 `Display` 模块。\n\n> **注：** 在 Simulink 建模中，通过更改模块的属性和参数可以得到相同的结果。例如，矩阵求逆可以通过在\
  \ `Interpreted MATLAB Function` 模块中插入名为 `inv(u)` 的 MATLAB 函数来实现。\n\n矩阵转置是通过 `Math\
  \ Function` 模块的选项获得的，如图 5-14 所示。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig15_HTML.jpg](img/471979_1_En_5_Fig15_HTML.jpg)\n\
  \n**图 5-15**  \n所有模块均已调整选项并输入数值/元素\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig14_HTML.jpg](img/471979_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5-14**  \n在 `Math Function` 模块中选择 `Function` 类型\n\n请注意，在完成的模型中有两种方法可以获得矩阵的逆，如图\
  \ 5-16 所示。通过运行完成的模型，您可以看到两种矩阵求逆操作的结果是相同的。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig16_HTML.jpg](img/471979_1_En_5_Fig16_HTML.jpg)\n\
  \n**图 5-16**  \n完整的矩阵运算及名为 `Ex2__MATRIX_operations.slx` 的 Simulink 模型\n\n> **注：**\
  \ 用于保存 Simulink 模型的文件格式有两种：`*.mdl` 和 `*.slx`。后一种模型类型受 Simulink 软件包更高版本（自 MATLAB\
  \ 2010 起）支持，而前一种格式可以被大多数版本打开和仿真，这取决于所使用的模块。通过“模型导出”选项，我们可以将模型保存为 Simulink 的早期版本。\n\
  \nSimulink 软件包的更高版本中包含了一些具有不同属性的新模块。因此，通过使用此类新模块开发的模型无法通过该软件包的早期版本进行仿真。\n\n\n\n\
  # 计算函数值\n\n在本节中，您将学习如何计算以下数学函数的值，将计算结果同时保存到独立的 `*.mat` 文件和 MATLAB 工作区中，并在图形窗口中显示。已知：*H*(*t*)\
  \ = *e*^(*sinc*(*t*)) + *e*^(sin(250*t*))，*t* = − 3*π* … 3*π*，∆*t* = *π*/3000。\n\
  \n构建给定示例的计算模型有多种方法。我们从一种简单直接的方法开始。与前面两个示例类似，您首先从 Simulink 库中获取所需的模块。为此，您需要以下模块：`Clock`、`Scope`、`Math\
  \ Function`、`Gain`、`Trigonometric Function`、`To File` 和 `Add To Workspace`，它们分别来自\
  \ `Simulink/Sources`、`Simulink/Math Operations`、`Simulink/Sinks` 和 `Simulink/User-Defined\
  \ Functions`。建模过程从将所有模块从 Simulink 库中拖出并按照以下顺序连接开始：`Clock` + `Interpreted MATLAB\
  \ Function` + `Math Function1` + `Add` + `Scope2` + `To File` 以及 `Clock` + `Trigonometric\
  \ Function` + `Math Function` + `Scope1` + `Add` + `To Workspace`。图 5-17 显示了已完成的模型，其保存文件名为\
  \ `Ex3_Function_Compute.slx`。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig17_HTML.jpg](img/471979_1_En_5_Fig17_HTML.jpg)\n\
  \n**图 5-17** 名为 `Ex3_Function_Compute.slx` 的完整仿真模型\n\n这个完成的模型本身无法直接运行，因为模型中使用的几个模块的属性和参数需要根据本练习的给定任务进行调整。\n\
  \n例如，仿真周期应在 *t* = − 3*π*…3*π* 范围内，时间间隔为 ∆*t* = *π*/300。`Interpreted MATLAB Function`\
  \ 模块的 MATLAB 函数必须修改为 `sinc()`，并且两个可选编辑点——`To File` 和 `To Workspace` 模块——应重命名为外部\
  \ `*.mat` 文件和一个以结构体格式保存在工作区中的变量。\n\n您可以通过模型配置参数开始调整仿真时间间隔和时间步长（见图 5-18）。可以通过点击 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figm_HTML.jpg](img/471979_1_En_5_Figm_HTML.jpg)\
  \ 图标或按下键盘上的 `Ctrl+E` 键来访问这些参数。您需要输入开始时间：`-3*pi` 和停止时间：`3*pi`，并将求解器类型从默认选择的变步长更改为固定步长。此外，您还应在求解器选项中指定类型：`Fixed-step`，并在附加选项中指定固定步长大小（基本采样时间）：`pi/3000`。有关求解器以及如何选择其类型和参数（包括求解算法、步长、相对误差和绝对误差容限）的更详细说明，请参见第\
  \ 8 章。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig18_HTML.jpg](img/471979_1_En_5_Fig18_HTML.jpg)\n\
  \n**图 5-18** 调整配置参数\n\n### 注意\n\n对于许多模型，仿真结果的准确性取决于所选的求解器类型和步长。\n\n另外，在进行仿真之前，您需要对模型进行以下调整：\n\
  \n1.  `Interpreted MATLAB Function` 模块的 MATLAB 函数应为 `sinc(u)`。请注意，输入变量名 `u` 是默认定义的。\n\
