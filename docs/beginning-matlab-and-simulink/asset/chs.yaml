  \ 模块（见图 5-12）。\n\n2. 将两个矩阵的元素分别输入到两个 `Constant` 模块中：`[3 2.5j; 2j 3.2]`（见图 5-13）和\
  \ `[-3i 2.2; 2.5 5.4]`。这些模块将连接两个独立的 `Math Function` 模块，其中一个为 `Math Function`（矩阵转置），另一个为\
  \ `Product of Elements`（矩阵求逆）。相应地编辑这两个模块；例如，要为 `Math Function` 模块获取转置算子，需从下拉选项中选择\
