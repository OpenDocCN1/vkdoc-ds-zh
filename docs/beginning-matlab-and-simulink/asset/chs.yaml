  \ {\\left[\\begin{array}{cc}3&amp; 2.5i\\\\ {}-2i&amp; 3.2\\end{array}\\right]}^T,\\\
  kern0.5em {\\left[\\begin{array}{cc}\\sqrt{-3i}&amp; \\sqrt{2.2}\\\\ {}\\sqrt{2.5}&amp;\
  \ \\sqrt{5.4}\\end{array}\\right]}^{-1} $$](images/471979_1_En_5_Chapter/471979_1_En_5_Chapter_TeX_IEq9.png)\
