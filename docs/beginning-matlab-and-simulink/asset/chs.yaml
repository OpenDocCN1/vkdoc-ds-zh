  \ MATLAB 工作区）来减少此模型中使用的模块数量。图 5-25 与基于图 5-23 中的模型创建的子系统一起，可产生与图 5-19 中的子系统相同的结果。\n\
  \n![](img/471979_1_En_5_Fig25_HTML.jpg)\n\n图 5-25 简化模型 `Ex3_Function_Compute_Simple.slx`\n\
  \n\n\n### MATLAB 工作空间的输入/输出信号\n\n如前所述，Simulink 模型与 MATLAB 工作空间能够交互式且完美地协同工作。出于模型开发和仿真目的，输入信号可以在\
  \ MATLAB 工作空间或 M 文件中生成，然后传输到 Simulink 模型环境中。同样，Simulink 模型的所有最终仿真结果都可以发送到 MATLAB\
  \ 工作空间。为了同时从 MATLAB 工作空间加载输入信号并将输出信号（仿真结果）发送回 MATLAB 工作空间，需要使用输入和输出模块，并调整模型配置参数。可以通过点击菜单面板上的图标或按键盘上的\
  \ `Ctrl+E` 来访问这些参数。在图 5-25 所示的上一示例（考虑简化部分）中，我们用 `In1`（输入模块）替代了输入信号 Clock 模块，并用 `Out1`（输出模块）替代了\
  \ Scope 模块；见图 5-26。\n\n此外，在模型配置参数中检查输入和输出信号选项（见图 5-27），分别将输入设置为 `t`、`u`，将输出设置为 `tout`\
  \ 和 `yout`。请注意，在开始仿真之前，必须在 MATLAB 工作空间中以 `t`、`u` 的形式将输入信号定义为两个列向量。对于此示例，可以按如下方式操作：\n\
  \n```\n>> t=[-3*pi:pi/3000:3*pi]'; u=t;\n```\n\n在此示例中，输入信号仅由时间定义，因此 `t=u`。此外，我们通过配置参数对此模型的求解器选项进行了多项调整（开始时间：`-3*pi`；结束时间：`3*pi`；类型：`固定步长`；固定步长大小（基本采样时间）：`pi/3000`），如图\
  \ 5-18 所示。\n\n此外，我们可以通过点击通往 `Out1` 模块的信号线，并使用鼠标右键选项（Create & Connect Viewer -->\
  \ Simulink --> Scope）将 Scope 模块添加到模型中，如图 5-28, a 所示。选择 Scope 后，通往 `Out1` 模块的信号线上方会出现示波器图标，如图\
  \ 5-28, b 所示。\n\n另外，在 Scope 模块中做一项重要调整（时间显示偏移量：`-3*pi`），使其能完整显示整个仿真结果，如示例和图 5-21\
  \ 所示。现在，保存模型（`Ex3__Function_compute_In_Out.slx`），并在 MATLAB 工作空间中输入以下内容后开始仿真：\n\n\
  ```\n>> t=[-3*pi:pi/3000:3*pi]'; u=t;\n```\n\n在仿真了三个替代模型 `Ex3__Function_compute.slx`、`Ex3_Function_Compute_Simple.slx`\
  \ 和 `Ex3_Function_Compute_In_Out.slx` 之后，仿真结果是一致的。通过这些示例，您已经看到如何轻松地用一个模块替代另一个模块，如何通过关联互连模块的部分来从现有模型创建子系统，以及如何通过减少模型中使用的模块数量来简化模型。\n\
  \n### 仿真一个机械系统\n\n让我们考虑一个具有牛顿摩擦力的机械弹簧-质量-阻尼器系统，其微分方程表述为：`m\\ddot{x}(t)+ bsign(\\\
  dot{x}){\\dot{x}}²(t)+ kx(t)=f(t)`。\n\n我们将把给定的系统模型视为连续系统和离散系统，以演示如何在 Simulink 中对这类系统进行建模和仿真。请注意，通过\
  \ Simulink 建模求解和仿真微分方程在第 8 章中有更多解释。这里，我们更侧重于模型构建、调整模块参数以及 Simulink 与 MATLAB 的交互。此外，我们还将讨论连续和离散系统的建模问题以及创建子系统的相关问题。\n\
  \n已知：`m=0.52 kg`；`b=0.00525 kg/m`；`k=165.5 N/m`；`f(t)=A cos(\\omega t)`；`\\omega\
  \ =131 rad/sec`；`A=2.3`，所有初始条件均为“零”。采样时间：`t[s]=0.01`。系统的参数中，`m` 代表质量，`b` 代表阻尼系数，`k`\
  \ 代表刚度，`f(t)` 代表输入力，`A` 代表幅值，`\\omega` 代表频率。\n\n1.  通过拖放的方式，从 Simulink 库中收集所有必需的模块到空白模型窗口中。图\
  \ 5-29 显示了所需的模块，它们来自 Simulink/Math Operations、Continuous、Discrete、Sources、Signal\
  \ Routing 和 Sinks。\n\n2.  通过移动模块以及将其中一些旋转 180 度，将模块调整成更容易阅读的顺序。Product、Sign 和 Gain\
  \ 模块需要旋转。您可以通过选择一个模块并按键盘上的 `Ctrl+R` 键，或使用鼠标右键的 Rotate & Flip 选项来进行旋转。见图 5-30。\n\n\
  3.  调整模块的参数。首先调整作为输入信号的 Sine Wave 和 Sine Wave1 模块的幅值、频率和采样时间（见图 5-31）。请注意，对于 Sine\
  \ Wave1，采样时间设置为 0，因为默认情况下它用于连续系统建模。\n\n4.  注意，当采样时间设置为 0.01 时，Sine Wave 模块中的正弦波符号如何从平滑曲线变为阶梯曲线。将\
  \ Gain 和 Gain3 的增益值更改为 `1/m`，Gain1 和 Gain4 的增益值更改为 `b`，Gain2 和 Gain5 的增益值更改为 `k`。另外，将\
  \ Add 和 Add1 模块中的符号更改为 `-+-`。\n\n5.  所有模块均已连接，完整的模型搭建完成。此外，添加了两个注释：Discrete System\
  \ 和 Continuous System；见图 5-32。完整的模型已保存（`Ex4_Discrete_Continuous_Sys.slx`）。\n\n6.\
  \  您可以通过按键盘上的 `Ctrl+T` 键或按 Run 按钮来执行这些模型。\n\n\n\n现在，完成的模型（`Ex4_Discrete_Continuous_Sys.slx`）似乎已准备好进行仿真。然而，如果直接执行它们，将会弹出错误消息窗口，并且无法获得任何结果。这是因为三个参数——`m`、`k`、`b`——的值尚未定义。你可以通过多种不同方式定义它们，其中一种是在每个模块或\
  \ MATLAB 工作区中指定参数值。你也可以在 **模型属性/回调/初始化函数** 中指定此信息，可通过 **文件 ➤ 模型属性** 访问。在命令窗口中输入：`>>\
  \ m=0.52; k=155; b=.00144`。\n\n随后，点击 Simulink 模型窗口中的 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figz_HTML.jpg](img/471979_1_En_5_Figz_HTML.jpg)\
  \ **运行** 按钮。你可以更改示波器模块的“样式”设置（通过 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figaa_HTML.jpg](img/471979_1_En_5_Figaa_HTML.jpg)\
  \ 下拉选项 --> **样式** ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figab_HTML.jpg](img/471979_1_En_5_Figab_HTML.jpg)），并获取显示在示波器模块中的仿真结果；参见图\
  \ 5-33。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig33_HTML.jpg](img/471979_1_En_5_Fig33_HTML.jpg)\n\
  \n**图 5-33**\n\n**仿真结果**\n\n从仿真结果可以看出，其中一个系统（离散系统）不稳定，需要进行调整。该离散系统建模的问题在于采样时间，需要对其进行调整。这可以通过输入信号模块（即正弦波）轻松解决。在该模块的采样时间值从\
  \ 0.01 更改为 0.0001，这比初始设置小了 100 倍。\n\n### 注意\n\n如果在离散积分器模块中将采样时间设置为 -1，则采样时间将从输入信号源自动继承。\n\
  \n除了通过为离散和连续系统模型显示图例使示波器中的图形更具可读性之外，我们还应该勾选示波器模块属性的**图例**选项 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figac_HTML.jpg](img/471979_1_En_5_Figac_HTML.jpg)。其次，点击从\
  \ **离散时间积分器 1** 到 **总线创建器** 的信号线，使用鼠标右键的选项访问**属性（信号属性）**。在那里，指定**信号名称**为 `Discrete\
  \ Sys`，然后点击确定。类似地，更改从 **积分器 1** 到 **总线创建器** 的信号线的信号名称，将其命名为 `Continuous Sys`。然后点击确定，如图\
  \ 5-34 所示。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig34_HTML.jpg](img/471979_1_En_5_Fig34_HTML.jpg)\n\
  \n**图 5-34**\n\n**信号名称更改**\n\n完成这三处更改后，整个模型运行并得到以下结果，如图 5-35 所示。注意，这是沿水平轴放大的视图。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig35_HTML.jpg](img/471979_1_En_5_Fig35_HTML.jpg)\n\
  \n**图 5-35**\n\n**在属性调整后的示波器中显示的仿真结果**\n\n您已经完成并验证了系统模型，这些模型可以使用子系统选项进行简化，如前面的示例所示（参见图\
  \ 5-25；`Ex3_Function_Compute_Simple.slx`）。任何包含两个以上模块的系统都可以通过使用子系统模块进行简化或替换。从系统模型创建子系统有几种方法。最简单的方法是选中打算归入一个子系统的模型模块，然后使用鼠标右键选项\
  \ **从所选内容创建子系统**，或从键盘按下 `Ctrl+G`。您可以从离散和连续系统模型中创建两个子系统（**Subsystem** 和 **Subsystem1**）（见图\
  \ 5-36）。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig36_HTML.jpg](img/471979_1_En_5_Fig36_HTML.jpg)\n\
  \n**图 5-36**\n\n**包含两个子系统模型的模型**\n\n可以通过双击来访问任何子系统下的模型。代表离散系统的子系统包含如图 5-37 所示的模型。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig37_HTML.jpg](img/471979_1_En_5_Fig37_HTML.jpg)\n\
  \n**图 5-37**\n\n**该子系统由此模型组成**\n\n此外，也可以逆转子系统的创建过程，方法是点击一个子系统模块，然后使用鼠标右键选项 **子系统与模型引用\
  \ ➤ 展开子系统**。或者在点击一个子系统模块后，按下 `Ctrl+Shift+G` 键。\n\n在本练习中，您学习了如何构建离散和连续系统，以及 Simulink\
  \ 如何处理这种系统组合，但您尚未对求解器参数进行任何调整。仿真过程的精度和效率可以通过调整求解器类型（默认选择可变步长求解器或固定步长求解器）和参数设置（求解器、误差容限、求解算法、如果选择固定步长求解器则为步长、过零点等）来提高。关于这些关键问题的更多讨论和解释将在第\
  \ 8 章关于微分方程的章节中重点阐述。\n\n\n\n### 处理二阶微分方程\n\n我们将为二阶微分方程描述的系统构建一个 Simulink 模型：\n\n\
  ```\nA\\ddot{q}(t) + B\\ddot{q}(t) + Cq(t) = F(t)\n```\n\n其中 `F(t)` 是施加的力（系统的输入信号），与\
  \ MATLAB 函数文件相关联。`F(t)` 是一个由傅里叶级数近似的矩形脉冲：\n\n```\nF(t) = (Amp/π) * Σ_{n=1}^N (1\
  \ - cos(nπ)) * sin(nπ t)\n```\n\n该函数在 MATLAB 中通过 `function_pulse.m` 函数文件实现：\n\n\
  ```matlab\nfunction F = function_pulse(t, Amp, n)\n% 帮助说明: 仿真需要两个输入参数，即 t, Amp 和\
  \ n，\n% 其中 t 是时间向量，Amp 是脉冲幅度，n 是傅里叶级数中的近似项数。\nF(1,:) = (Amp/pi) * (1 - cos(pi))\
  \ * sin(pi * t);\nfor ii = 2:n\n    F = F + (Amp/(ii * pi)) * (1 - cos(ii * pi))\
  \ * sin(ii * pi * t);\nend\nreturn\n```\n\n让我们构建一个与函数文件 `function_pulse.m` 关联的 Simulink\
  \ 模型。此外，您将使用 Simulink 模块——重复序列和信号发生器——来生成矩形脉冲信号。您将探索使用 MATLAB 关联函数文件和 Simulink 模块生成输入信号的选项。另外，您还将探索一些关键的\
  \ Simulink 建模工具和辅助功能，例如模型浏览器、模型顾问、C/C++ 代码生成和报告生成等。数值仿真采用以下值：`A = 2`；`B = 4`；`C\
  \ = 200`；`Amp = 10`；`n = 25`。\n\n此练习的完整模型如图 5-38 所示。该模型通过 Interpreted MATLAB Fcn\
  \ 模块关联了名为 `function_pulse.m` 的函数文件。输入信号 `F(t)` 矩形脉冲通过两种方式生成：一种是带有三个输入变量（`Amp`、`n`、`t`）的\
  \ Interpreted MATLAB Fcn，另一种是带有两个输入（`amp` 和 `frequency`）的信号发生器。您可以比较来自两个输入信号源的仿真结果，即\
  \ MATLAB 关联的输入信号生成（通过 Interpreted MATLAB Fcn 嵌入的 `pulse_function.m`）与 Simulink 库模块（信号发生器）。此外，您还将了解如何使用\
  \ Simulink 的模型属性输入模型参数，例如 `Amp`、`n`、`A`、`B`、`C`，以及如何使用多端口开关模块。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig38_HTML.jpg](img/471979_1_En_5_Fig38_HTML.jpg)\n\
  \n**图 5-38** 二阶 ODE 的完整模型：`A\\ddot{q}(t) + B\\ddot{q}(t) + Cq(t) = F(t)`\n\n建模此练习所需的模块包括\
  \ Add、Gain、Integrator、Bus Creator 和 Scope，您可以将它们拖放到空白模型窗口中。这些模块按图 5-38 所示连接。请注意，与\
  \ Bus Creator 和 Scope 模块相连的三个信号分别称为 Input、`dq(t)` 和 `q(t)`，它们代表输入信号、脉冲、速度和位移。这些信息通过\
  \ Scope 模块绘图中的图例显示。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig39_HTML.jpg](img/471979_1_En_5_Fig39_HTML.jpg)\n\
  \n**图 5-39** 无输入力信号发生器的给定二阶微分方程 Simulink 模型\n\n函数文件（名为 `function_pulse.m`）通过 Interpreted\
  \ MATLAB Fcn 模块与 Simulink 模型关联（见图 5-38）。Interpreted MATLAB Fcn 被修改为调用 MATLAB 函数：`function_pulse(u(1),\
  \ u(2), u(3))`，其中 `u(1)` 调用时间信号，`u(2)` 调用幅度 `Amp`，`u(3)` 调用傅里叶级数近似的项数 `n`。因此，Interpreted\
  \ MATLAB Fcn 模块需要同时接收三个输入信号。这可以通过 Bus Creator 模块实现，如图 5-40 所示。请注意，您可以通过单击每个模块的名称并输入新名称来更改模块名称。另请注意，模块标签在模型仿真期间不被考虑，因此它们仅对用户/程序员具有信息提示作用。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig40_HTML.jpg](img/471979_1_En_5_Fig40_HTML.jpg)\n\
  \n**图 5-40** 具有三个输入的 MATLAB Fcn 模块\n\n随后，向模型添加一个名为 Signal Generator 的 Simulink 模块，并设置其参数以生成脉冲（`Amplitude\
  \ = -Amp/2` 和 `Frequency = 3.15 [rad/sec]`）。然后根据给定的脉冲参数进行调整，如图 5-41 所示。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig41_HTML.jpg](img/471979_1_En_5_Fig41_HTML.jpg)\n\
  \n**图 5-41** Signal Generator 模块的已调整参数\n\n要连接两个输入信号源（Signal Generator 和 MATLAB Interpreted\
  \ Fcn），请添加 Multiport Switch 模块，并将其连接到另一个 Constant 模块以指定用于选择的源信号模块。最后，通过 Bus Selector\
  \ 模块命名连接到 Scope 模块的三个信号。此外，调整 Scope 模块的样式选项以使输出信号清晰可读。完成的模型如图 5-42 所示。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig42_HTML.jpg](img/471979_1_En_5_Fig42_HTML.jpg)\n\
  \n**图 5-42** 称为 `Ex5_Function_PULSE.slx` 的完整 Simulink 模型\n\n在开始仿真之前，您需要指定 `A`、`B`、`C`、`Amp`\
  \ 和 `n` 的值。您可以通过回调选项进行设置，路径为 **文件** > **模型属性** > **模型属性** > **回调**（模型回调）> **InitFcn**。在模型初始化函数窗口（或替代地，在命令窗口中），输入\
  \ `A = 2; B = 4; C = 200; n = 25; Amp = 10` 并单击 **确定**。当您执行模型时，两个输入信号将根据 Constant\
  \ 模块（称为 `Which_Signal`）的值 1、2 按第一和第二顺序被接收。它们对应于 **输入 1** – Signal Generator 和 MATLAB\
  \ Interpreted Fcn。图 5-43 中的仿真结果表明，两个输入信号和两对输出信号（`dq(t)`、`q(t)`，分别代表速度 `\\dot{q}`\
  \ 和位移 `q`）已良好收敛。请注意，输入：1 是 Signal Generator，输入：2 是 MATLAB Interpreted Fcn。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig43_HTML.jpg](img/471979_1_En_5_Fig43_HTML.jpg)\n\
  \n**图 5-43** 仿真结果：a) 来自 Signal Generator, b) 来自 Repeating Sequence, 和 c) 来自 Interpreted\
  \ MATLAB Fcn\n\n从图 5-43 显示的仿真结果可以清楚地看出，所有三个生成脉冲输入信号的模块在系统中产生了大致相同的激励。Simulink 模型模块如果正确建模和调整，可以与\
  \ MATLAB 文件关联。需要注意的是，通过 Interpreted MATLAB Fcn 的第二种输入信号生成方法精度较低。它从 M 文件 `function_pulse.m`\
  \ 中近似傅里叶级数。此外，它的速度更慢，因为它调用外部 M 文件来生成信号。\n\n\n\n# Simulink 模型分析与诊断\n\n`Simulink 模型分析与诊断`\
  \ 工具为程序员提供了良好的辅助，帮助他们在仿真速度、效率以及消除不准确和低效仿真方面改进模型。因此，建议对所使用模块及其组合的效率与充分性、所选的求解器类型以及许多其他选项进行分析和诊断。所有这些选项都可以通过\
  \ `模型浏览器` ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figad_HTML.jpg](img/471979_1_En_5_Figad_HTML.jpg)\
  \ 和 `模型顾问` ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figae_HTML.jpg](img/471979_1_En_5_Figae_HTML.jpg)\
  \ 工具进行探索。通过 `模型浏览器` 工具，你可以生成 `Simulink` 模型的 C/C++ 代码、获取模型的分析报告、启动模型顾问、重置求解器、输入/输出、优化和代码生成的配置参数，以及执行更多操作。让我们以之前的示例为例，看看\
  \ `模型浏览器` 中的一些工具。\n\n## 代码生成\n\n代码生成（见图 5-44）可以通过 `模型浏览器` ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figaf_HTML.jpg](img/471979_1_En_5_Figaf_HTML.jpg)\
  \ 或 `模型配置参数` ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figag_HTML.jpg](img/471979_1_En_5_Figag_HTML.jpg)\
  \ 按钮访问。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig44_HTML.jpg](img/471979_1_En_5_Fig44_HTML.jpg)\n\
  \n图 5-44 `模型浏览器工具`\n\n在依次点击 `仅生成代码` 和 `打包代码与工件` 之后，点击 `生成代码` 按钮。随后，C 代码（C 是所选语言）将被生成。请注意，代码生成存在一些限制条件；例如，所选的求解器必须是固定步长，并且并非所有使用的模块都与\
  \ C/C++ 代码生成兼容。如果这些或其他类似的要求没有得到满足，则无法生成 C/C++ 代码。此外，代码生成过程还取决于所安装的编译器类型和版本。\n\n\
  ## 模型顾问\n\n`模型顾问` ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figah_HTML.jpg](img/471979_1_En_5_Figah_HTML.jpg)\
  \ 工具（见图 5-45）有助于识别模型中出现问题的位置以及需要优化的地方。它可以按产品、按任务类型或同时按两者来识别与代码生成和模型性能相关的问题。\n\n\
  ![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig45_HTML.jpg](img/471979_1_En_5_Fig45_HTML.jpg)\n\
  \n图 5-45 `模型顾问工具`\n\n你首先需要选择要从 `模型顾问` 获取帮助/建议的流程，然后点击 `运行` ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figai_HTML.jpg](img/471979_1_En_5_Figai_HTML.jpg)\
  \ 按钮。在此示例中，我们选择了 `按产品` 和 `按任务` 的 `模型顾问`。一旦 `模型顾问` 启动，就会对该模型（`Ex5_Function_PULSE.slx`）运行所有诊断检查，并准备一份关于所有通过、失败、警告和未运行检查点的报告。你可以通过点击\
  \ `模型顾问` 窗口中的 `生成报告` 按钮来查看报告。点击 `生成报告` 按钮会弹出 `生成模型顾问报告` 窗口，你可以从中选择目录（用于保存生成的报告）、文件名、文件格式（默认为\
  \ HTML，也可选 PDF 或 Word）以及一个勾选选项，以便在报告生成后立即查看。见图 5-46。我们选择了 HTML，这是 `模型顾问` 的默认报告格式。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig46_HTML.jpg](img/471979_1_En_5_Fig46_HTML.jpg)\n\
  \n图 5-46 `生成模型顾问报告窗口`\n\n此外，还有一些关于模型中模块使用双精度运算的警告。代码生成不支持 `解释的 MATLAB 函数` 模块。此外，`时钟`、`积分器`、`积分器\
  \ 1`、`信号发生器` 和 `解释的 MATLAB 函数` 模块不建议用于 C/C++ 生产环境部署。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig47_HTML.jpg](img/471979_1_En_5_Fig47_HTML.jpg)\n\
  \n图 5-47 `模型顾问报告`\n\n图 5-47 显示了 `Ex5_Function_PULSE.slx` 的 `模型顾问报告` 部分内容。该报告以 HTML\
  \ 格式创建，显示：59 个通过，0 个失败，10 个警告，0 个未运行，共运行 69 项。向下滚动报告，你可以看到模型哪些地方通过了检查，哪些地方存在一些警告问题，例如优化设置——建议将参数“移除浮点数到整数转换中会导致超出范围值的警告的代码（`EfficientFloat2IntCast`）”设置为开启。另一个建议是将参数“内联不变信号（`InlineInvariantSignals`）”设置为开启。此外，另一个警告是检查数据存储内存模块是否存在多任务、强类型和屏蔽问题。未将重复数据存储名称检查设置为错误。重复使用数据存储名称可能导致意外屏蔽更高模型作用域中的数据存储。因此，请考虑将重复数据存储名称的设置更改为错误。\n\
  \n另一个有趣的警告与总线信号有关。该警告内容是：检查被当作向量处理的总线信号。总线信号被 `Simulink` 软件当作向量处理。请识别模型中那些被 `Simulink`\
  \ 软件当作向量处理的总线信号。\n\n馈入模块输入端口 1 的总线信号：`Ex5_Function_PULSE`/解释的 MATLAB 函数。馈入 `Ex5_Function_PULSE/示波器`\
  \ 中模块输入端口 1 的总线信号。\n\n建议操作：模型中存在被 `Simulink` 软件隐式转换为向量的总线信号。然而，模型并未配置为明确将这些信号转换为向量。要解决此问题，请在上述列出的模块的输入端口处插入“总线转向量”模块。\n\
  \n\n\n您可以按照以下步骤自动执行此操作：按下修改按钮或运行`Simulink.BlockDiagram.addBusToVector`函数。您也可以手动执行此操作，使用\
  \ `Simulink` → `Signal Attributes` 库。\n\n通过研究 Model Advisor 的报告，您可以通过移除错误、仿真瓶颈和不必要的警告，并替换模型中一些低效的模块来改进模型。\n\
  \n除了 Model Advisor，您还可以使用 Model Explorer 或 Configuration Parameters 下的 Optimization\
  \ 工具来优化模型中的参数和模块。此外，为了定位错误或瓶颈，我们还可以使用调试工具。这些工具可以通过菜单栏访问：`Simulation` ➤ `Debug` ➤\
  \ `Debug Model`。另一种了解模型性能的方法是通过菜单栏：`Analysis` ➤ `Performance Tools` ➤ `Show Profile\
  \ Report`（选择），然后 ➤ `Performance Tools` ➤ `Performance Advisor`。相关选项如图 5-48 所示。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig48_HTML.jpg](img/471979_1_En_5_Fig48_HTML.jpg)\n\
  \n**图 5-48**\nPerformance Advisor 选项\n\n点击 `Run Selected Checks`（见图 5-48）后，将显示 `Simulink\
  \ Profile Report`。该报告由 Summary 和 `Simulink Performance Advisor Report` 组成，展示了模型及其仿真过程的完整视图。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig49_HTML.jpg](img/471979_1_En_5_Fig49_HTML.jpg)\n\
  \n**图 5-49**\n`Simulink Model Profile Report` 的 Summary\n\n因此，建议您运行 `Model Advisor`\
  \ 和 `Performance Advisor` 选项，以获取许多有助于改进模型性能的提示。此外，还可以通过命令重新调用和执行`profile report\
  \ generator`，以定位模型中低效的操作和模块。\n\n```\n>> profile on; sim('Ex5_Function__PULSE.mdl');\
  \ profile viewer\n```\n\n`profile report generator` 适用于所有 `M` 文件和 `Simulink` 模型，并提供全面的报告，包括代码/脚本/模型中每个命令和操作的计算和执行时间瓶颈。\n\
  \n## 总结\n\n在本章中，我们涵盖了 `Simulink` 软件包中大多数基本的图形化编程工具和一些常用模块，包括信号源、矩阵运算、积分、可视化、信号路由和\
  \ `C` 代码生成。此外，本章通过数值仿真示例，重点介绍并演示了如何调整参数、使用求解器工具、设置误差容限以及提高 `Simulink` 模型性能的几个关键点。您学习了如何从现有模型创建子系统，以及如何将\
  \ `Simulink` 模型与 `MATLAB` 脚本和函数文件关联。您还使用了 `Simulink` 模型分析和诊断工具，并学习了如何获取 `Model Advisor`\
  \ 和 `Performance Reports`。\n\n## 自测练习\n\n### 练习 1\n\n编写一个 `M` 文件，使用 `while, end`\
  \ 循环控制语句计算余弦函数 *g*(*θ*) = cos (*θ*) 的值，*θ* = 0…*π*，步长为 2000 步。当函数 *g*(*θ*) ≈ 0.99999\
  \ 时停止计算。此外，显示计算过程在多少步后停止，并绘制仿真结果。在同一张图中也显示最终值 0.99999。\n\n### 练习 2\n\n根据用户输入的以下数值，计算圆、正方形和矩形的面积：\n\
  \n*   `W = input('Width of a rectangle:    ')`\n*   `L = input('Length of a rectangle:\
  \    ')`\n*   `R = input('Radius of a circle:            ')`\n*   `S = input('Side\
  \ length of a square: ')`\n\n脚本中需要考虑几种情况：(1) 如果用户输入矩形宽度(`W`)和长度(`L`)两个维度，代码必须计算矩形的面积并附带注释显示；(2)\
  \ 如果用户输入圆半径(`R`)和正方形边长(`S`)两个维度，代码必须分别计算圆和正方形的面积并附带注释显示；(3) 如果用户输入所有必需的值，代码必须计算三个面积并附带适当的注释显示；(4)\
  \ 如果用户没有输入所有值或遗漏了任何必需的值(`W, L, R, S`)，代码必须显示`\"You need to ENTER all dimensions!\"\
  ` 可以使用`input()`，`isempty()`，`exist()`，`length()`，`numel()`，`size()`和`fprintf()`命令。\n\
  \n### 练习 3\n\n编写一个脚本，根据学生获得的分数显示其等级。学生等级需根据以下标准定义：\n\n*   F → 0…65\n*   D → 66 …\
  \ 70\n*   C → 71 … 81\n*   B → 82 … 87\n*   A → 88 … 100\n*   使用`input()`，`disp()`，`fprintf()`和`if,\
  \ elseif, elseif, elseif, else ... end`。\n\n使用以下示例分数测试您的脚本：70, 82, 35, 90, 99, 56,\
  \ 81, 89, 66, 87, 88, 83, 71, 69, 和 55。\n\n### 练习 4\n\n这些练习涵盖了`while, end`和`for,\
  \ end`循环控制运算符：\n\n1.  使用`while, end`和`for, end`循环控制语句计算级数：![$$ \\frac{\\pi²}{8}=1+\\\
  frac{1}{3²}+\\frac{1}{5²}+\\frac{1}{7²}+\\dots =\\sum \\limits_{n=0}^{\\infty}\\\
  frac{1}{{\\left(2n+1\\right)}²} $$](img/471979_1_En_5_Chapter_TeX_IEq18.png)。取 *n*\
  \ = 101 并绘制迭代过程中的误差值。\n2.  计算以下级数的和：1², 2², 3², … *n*²。取 *n* = 500 并使用`while, end`和`for,\
  \ end`循环控制语句计算总和 ![$$ {\\sum}_{n=1}^{500}{n}² $$](img/471979_1_En_5_Chapter_TeX_IEq19.png)。绘制总和与`n`的关系图。\n\
  3.  计算以下级数的和：1 * 2 + 2 * 3 + 3 * 4 + 4 * 5 + …。这可以重写为求和 ![$$ {\\sum}_{k=1}^N\\mathrm{k}\\\
  left(\\mathrm{k}+1\\right). $$](img/471979_1_En_5_Chapter_TeX_IEq20.png)。使用`while,\
  \ end`和`for, end`循环控制语句计算总和。绘制总和与`k`的关系图。\n4.  使用`while, end`和`for, end`循环控制语句计算此级数（欧拉于\
  \ 1735 年发现）：![$$ \\frac{\\pi²}{6}=1+\\frac{1}{2²}+\\frac{1}{3²}+\\frac{1}{4²}+\\\
  dots ={\\sum}_{n=1}^{\\infty}\\frac{1}{n²} $$](img/471979_1_En_5_Chapter_TeX_IEq21.png)。取\
