  \ 5-21）。\n\n此外，示波器模块还具有许多图形显示选项，可以通过 ![](img/471979_1_En_5_Figt_HTML.jpg) 下拉选项（即选择“样式”\
  \ ![](img/471979_1_En_5_Figu_HTML.jpg)）进行访问。通过“样式” ![](img/471979_1_En_5_Figv_HTML.jpg)\
  \ 选项，您可以调整图形颜色、坐标轴颜色、线条和标记。参见图 5-22。\n\n![](img/471979_1_En_5_Fig22_HTML.jpg)\n\n\
  图 5-22 模拟结果完整视图\n\n![](img/471979_1_En_5_Fig21_HTML.jpg)\n\n图 5-21 在“配置属性：示波器”中将时间显示偏移量设置为\
  \ `-3*pi`\n\n为了提高大型复杂 Simulink 模型的可读性和可管理性，可以将整个模型或部分模型关联到一个子系统模块中。从现有模型创建子系统非常简单直接。从现有模型创建子系统的最简单方法是：按住鼠标左键并拖动光标选中所需模块（相互连接的模块），然后按键盘上的\
  \ `Ctrl+G`。要基于整个模型创建一个子系统，请先按 `Ctrl+A`，然后再按键盘上的 `Ctrl+G`。\n\n我们来看一下完整的模型（见图 5-19），并基于整个模型（不包括输入信号（至\
  \ Clock 模块）和输出信号（至 To File、Scope 和 To Workspace 模块））创建一个子系统。首先，使用鼠标左键选中除输入模块和所有输出模块之外的模型模块，然后按键盘上的\
  \ `Ctrl+G`。子系统将从选中的模型模块中创建，如图 5-23 所示。要查看所创建子系统的内部内容，需要双击它。参见图 5-24。\n\n![](img/471979_1_En_5_Fig24_HTML.jpg)\n\
  \n图 5-24 所创建的子系统的组件\n\n![](img/471979_1_En_5_Fig23_HTML.jpg)\n\n图 5-23 基于完整模型（图\
  \ 5-19）但不包含输入和输出模块创建的子系统\n\n请注意，图 5-24 中的这个子系统有一个名为 `In1` 的输入模块和一个名为 `Out1` 的输出模块。它们分别与输入模块（Clock）和输出模块（To\
  \ File、Scope、To Workspace）连接，用于接收和发送信号。请注意，如果基于整个模型（图 5-19）创建子系统时仅排除输入模块，那么该子系统将只包含一个输入模块，名为\
  \ `In1`。如果基于整个模型（图 5-19）创建子系统时仅排除输出模块（To File、Scope、To Workspace），那么它将包含一个输出模块 `Out1`。如果基于整个模型（包括所有输入和输出模块）创建子系统，那么所创建的子系统中将不包含任何输入和输出模块。\n\
