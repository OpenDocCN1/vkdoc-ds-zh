  \  12    19    21     3\n11    18    25     2     9    11    18    25     2    \
  \ 9\n```\n\n提示：使用 `magic()` 和 `repmat()`。\n\n# 常微分方程\n\n许多工程应用的建模问题都可以使用常微分方程（ODE）来描述。微分方程有几种不同的定义。其中最简单的定义来自文献[1]：“微分方程是包含导数的任意方程，导数可以是常导数或偏导数。”根据这个定义，我们可以推导出两种类型的微分方程——常微分方程（ODE）和偏微分方程（PDE）。ODE\
  \ 包含一种类型的导数或一个自变量，而与之相反，PDE 包含两个或多个导数或自变量。例如，一阶 ODE 可以表示为：\n\n![$$ \\frac{dy}{dx}=f\\\
  left(y,x\\right) $$](img/471979_1_En_8_Chapter_TeX_Equ1.png)\n\n(方程 8.1)\n\n其中 `y(x)`\
  \ 是因变量，其值取决于自变量 `x` 的值。ODE 的另一个典型例子是牛顿第二运动定律，它被表述为：\n\n`ma` = `dp/dt` = `m dv/dt`\
  \ = `F(t, v)` (方程 8.2)\n\n其中 `F(t, v)` 是力，它是时间（`t`）和速度（`v`）的函数；`dv/dt` 是运动物体的速度变化率（加速度）；`m`\
  \ 是运动物体的质量；`a` 是运动物体的加速度；`p` 是动量；`dp/dt` 是其导数。牛顿第二定律的这种表述也可以改写为以下形式。\n\n![$$ \\\
  frac{md}{dt}\\left(\\frac{dx}{dt}\\right)=\\kern0.5em \\frac{m{d}²x}{d{t}²}=F\\\
  left(t,x,\\frac{dx}{dt}\\ \\right) $$](img/471979_1_En_8_Chapter_TeX_Equ2.png)\n\
  \n(方程 8.3)\n\n其中，运动物体位移（`x`）的导数 `(dx/dt)` 即为速度（`v`）。换句话说，速度是运动物体位移 `x(t)` 随时间的变化率。这可以用图\
  \ 8-1 中的流程图来直观展示。\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig1_HTML.jpg](img/471979_1_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** 描述运动物体运动与所受作用力的流程图\n\n## ODE 的分类\n\n与 ODE 相关的问题分为两类：\n\n- 初值问题（IVP）：`ẍ\
  \ = x t - 3ẋ`，初始条件为 `x(0) = 3, ẋ(0) = 1`\n- 边值问题（BVP）：`ẍ = x t - 3ẋ`，边界条件为 `x(0)\
  \ = 3, x(2) = 1.50`\n\n初值问题（IVP）的定义是：ODE 以及在解域中给定点处未知函数的一个指定值（称为初始条件）共同构成的问题。在 ODE\
  \ 的 IVP 中，可能存在唯一解、无解或许多解。根据定义，ODE 的 IVP 可以显式定义或隐式定义。大多数 IVP 都是显式定义的。我们从显式定义的 IVP\
  \ 开始，然后过渡到隐式定义的 IVP。除了按解类型（解值在解搜索空间中的变化方式）分类外，IVP 还分为刚性问题和非刚性问题。此外，ODE 可分为线性和非线性两大类，以及齐次和非齐次两类。\n\
  \n以下是不同类型、类别和分组的 ODE 的具体示例。\n\n- 刚性 ODE：`{ẋ = -0.04x + 10⁴ yz, ẏ = 0.04x - 10⁴\
  \ yz - 3*10⁷ y², ż = 3*10⁷ y²}`，`t ∈ [0, 40]`\n- 非刚性 ODE：`ẏ + 2y = 2t`，`ẅ + ẇ\
  \ = 5`\n- 线性 ODE：`dv/dt = 9.81 - 0.198v`，`ẍ + 3ẋ + 5x = 0`\n- 非线性 ODE：`dv/dt =\
  \ 9.81 - 0.198v²`，`ẍ + 3x ẋ + 5x² = 0`\n- 齐次 ODE：`ẏ + 2y = 0`，`ẍ + 3ẋ + 5x\
  \ = 0`\n- 非齐次 ODE：`ẏ + 2y = sin(x)`，`ẍ + 3ẋ + 5x = e^(2t)`\n\n以下是几个 ODE 及其应用领域的示例。\n\
  \n\n\n### 示例 1：生物体的无约束增长\n\n这是一个指数增长问题，描述了生物机体（例如细菌）的无约束增长。此行为也可用于描述房地产或投资价值、热门社交网站的会员增长、零售业务增长、电气系统的正反馈以及化学反应。该问题由以下一阶常微分方程表示：\n\
  \n![$$ \\frac{dy}{dt}=\\mu y $$](img/471979_1_En_8_Chapter_TeX_IEq16.png) 的解为：`y(t)\
  \ = y[0]e^(μt)`\n\n### 示例 2：放射性衰变\n\n这指的是指数衰减，它描述了自然界和工程学中的许多现象，例如放射性衰变、反应器中化学物质的洗脱、电容器的放电以及河流中物质的分解。它使用以下一阶常微分方程表示：\n\
  \n![$$ \\frac{dy}{dt}=-\\mu y $$](img/471979_1_En_8_Chapter_TeX_IEq17.png) 的解为：`y(t)\
  \ = y[0]e^(-μt)`\n\n示例 1 和示例 2 是一阶常微分方程的两个简单例子。\n\n### 示例 3：牛顿第二定律\n\n使用牛顿第二定律，下落物体的运动由以下方程表示。\n\
  \n![$$ \\frac{m{d}²y}{d{t}²}= mg-\\frac{\\gamma dy}{dt} $$](img/471979_1_En_8_Chapter_TeX_Equa.png)\n\
  \n这是一个二阶常微分方程，其解的形式为：\n\n![$$ y(t)={C}_1{e}^{-\\left(\\frac{\\gamma t}{m}\\right)}-\\\
  frac{m\\left( mg- g\\gamma t\\right)}{\\gamma²}+{C}_2 $$](img/471979_1_En_8_Chapter_TeX_Equb.png)\n\
  \n其中，`m` 是下落物体的质量；`g` 是重力加速度；`γ` 是下落物体的空气阻力系数。三个参数——`m`、`g` 和 `γ`——是常量，而两个参数随时间变化——![$$\
  \ \\frac{d²y}{d{t}²} $$](img/471979_1_En_8_Chapter_TeX_IEq18.png)（加速度）和 ![$$ \\\
  frac{dy}{dt} $$](img/471979_1_En_8_Chapter_TeX_IEq19.png)（速度）。在自由落体物体的解中，`C[1]`\
  \ 和 `C[2]` 是取决于初始条件的任意数。换句话说，它们可以通过考虑下落物体的初始条件来计算。\n\n有几种方法可以评估常微分方程的解析解，包括分离变量法、引入新变量法等。我们将通过考察这些类型常微分方程的具体例子，来了解如何评估它们的解析解并计算数值解。为此，我们将在\
  \ MATLAB/Simulink 环境中运用不同的技术，编写脚本并构建模型。在计算常微分方程的解析解时，我们将通过具体例子解释如何使用符号数学工具箱⁽⁸⁾和\
  \ MuPAD⁽⁹⁾ 笔记本的内置函数。我们更侧重于符号数学工具箱的命令语法，而非 MuPAD 笔记本。在 MATLAB 的未来版本中，MuPAD 笔记本将被移除。\n\
  \n显而易见，我们更多地关注数值求解方法，而非解析解搜索工具。评估常微分方程的解析解并非总是可行，或者成本过高。因此，数值求解通常是最佳选择。数值方法有很多种，包括欧拉法（向前、向后、修正）、休恩法、中点法、龙格-库塔法、龙格-库塔-吉尔法、亚当斯-巴什福斯法、米尔恩法、亚当斯-莫尔顿法、泰勒级数法和梯形法。这些方法中有些是显式的，有些是隐式的。为了演示如何运用这些方法，我们首先描述它们的公式，然后研究它们的实现算法，以便显式地编写脚本（程序）。我们不试图推导这些数值方法中使用的任何公式。有许多文献资料\
  \ [参见 2, 3, 4, 5] 解释了这些方法的理论层面。\n\n在使用数值方法求解初值问题时，我们从一个初始点（初始条件）开始，然后在时间上向前迈一步（等步长或变步长）来计算后续的数值解。之前提到的一些数值方法（如欧拉法）是单步法，而其他方法（如龙格-库塔法、亚当斯-巴什福斯法、米尔恩法、亚当斯-莫尔顿法和泰勒级数法）是多步法。单步法仅参考前一个点及其导数值来确定当前值。其他方法，如龙格-库塔法，会采取一些中间步骤来获得一个高阶步长，然后在进行下一步之前丢弃之前的值。与单步法不同，多步法会保留并使用前几步的值，而不是丢弃它们。这样，多步法将先前获得的几个值（解）和导数值联系起来。所有这些方法，即单步法和多步法，都会根据其准确性和效率进行评估，这些评估基于为特定类型的常微分方程初值问题计算数值解所花费的计算时间和资源（例如机器时间）。然而，事实仍然是，一阶、二阶或更高阶初值问题的大多数解无法通过解析方法找到。因此，我们需要采用各种数值方法。\n\
  \n## 解析方法\n\n符号数学工具箱（或 MuPAD 笔记本）具有多个函数，能够评估许多可解析求解的常微分方程的解析解。有两个命令（内置函数）可以用于评估某些常微分方程的解析解——`dsolve`\
  \ 和 `ilaplace`/`laplace`。\n\n请注意，在本小节中，我们将通过一些一阶和二阶常微分方程以及耦合微分方程组的示例来演示如何计算常微分方程的解析解。\n\
  \n### DSOLVE\n\n在 MATLAB 中，用于计算任意给定常微分方程解析（或通）解的第一个常微分方程求解器工具是 `dsolve`。它可以与以下通用语法一起使用：\n\
  \n```\nSolution = dsolve(equation)\nSolution = dsolve(equation, conditions)\nSolution\
  \ = dsolve(equation, conditions, Name, Value)\n[y1,...,yN] = dsolve(equations)\n\
  [y1,...,yN] = dsolve(equations, conditions)\n[y1,...,yN] = dsolve(equations, conditions,\
  \ Name, Value)\n```\n\n### 示例 1：使用 dsolve\n\n给定一个常微分方程 ![$$ \\dot{y}+2t{y}²=0 $$](img/471979_1_En_8_Chapter_TeX_IEq20.png)，注意未指定初始条件和边界条件。\n\
  \n```\n>> y_solution=dsolve('Dy=-2*y²*t')\nY_solution=-1/(C3-t²)\n```\n\n请注意，`C3`\
  \ 是由给定常微分方程的初始条件或边界条件定义的。\n\n还有一个替代命令。在更高版本的 MATLAB 中（从 MATLAB 2012 开始），我们可以通过使用以下命令语法来解决给定问题：\n\
  \n```\n>>syms y(t); y_sol=dsolve(diff(y) == -2*y²*t)\ny_sol =\n\n-1/(- t² + C3)\n\
  ```\n\n### 示例 2：根据 dsolve 绘图\n\n给定一个常微分方程 ![$$ \\dot{y}+2t{y}²=0 $$](img/471979_1_En_8_Chapter_TeX_IEq21.png)\
  \ 及初始条件 `y(0) = 0.5`：\n\n```\n>> Solution=dsolve('Dy=-2*y²*t', 'y(0)=0.5')\nSolution\
  \ =\n1/(t² + 2)\n```\n\n更高版本 MATLAB 的替代命令语法如下：\n\n```\n>> syms y(t); Solution=dsolve(diff(y)\
  \ == -2*y²*t, y(0)==0.5)\nSolution =\n1/(t² + 2)\n```\n\n解析解是以符号形式给出的，因此可以使用 `ezplot`\
  \ 进行绘图。（参见图 8-2。）\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig2_HTML.png](img/471979_1_En_8_Fig2_HTML.png)\n\
  \n图 8-2\n\n![$$ \\dot{y}+2t{y}²=0,y(0)=0.5 $$](img/471979_1_En_8_Chapter_TeX_IEq22.png)\
  \ 的解析解\n\n```\n>> ezplot(Solution)\n```\n\n解析解（方程）的数值可以通过向量化（参数化）符号公式（解）来计算：\n\n\
  ```\n>> ysol=vectorize(solution)\nysol =\n1./(t.² + 2)\n>> t=(-5:.1:5); ysol_values=eval(ysol);\n\
  ```\n\n\n\n### 示例 3：添加一个未指定的参数\n\n给定 ![$$ \\dot{y}+ kt{y}²=0,y(0)=0.5 $$](img/471979_1_En_8_Chapter_TeX_IEq23.png)，注意该练习包含一个未指定参数\
  \ `k`。\n\n```\n>> syms k\n>> solution=dsolve('Dy=-k*y²*t', 'y(0)=0.5')\nsolution\
  \ =\n1/((k*t²)/2 + 2)\n```\n\n以下是备选命令语法：\n\n```\n>> syms y(t) k; solution=dsolve(diff(y)\
  \ == -k*y²*t, y(0)==0.5)\nsolution =\n1/((k*t²)/2 + 2)\n```\n\n### 注意\n\n`dsolve`\
  \ 中的选项需要根据问题类型进行适当设置。在 MATLAB 2008-2010 或更早版本中，为了获得所有可能的解，应将 `IgnoreAnalyticConstraints`\
  \ 设置为 `none`。\n\n例如：\n\n```\nsolution=dsolve('Dy=-k*y²*t', 'y(0)=0.5', ... 'IgnoreAnalyticConstraints',\
  \ 'none')\n```\n\n### 注意\n\n对于 MATLAB 2012 或更高版本，为了获得所有参数值的所有可能正确答案，应将 `IgnoreAnalyticConstraints`\
  \ 设置为 `false`。否则，`dsolve` 可能因其预代数简化而输出错误答案。\n\n例如：\n\n```\nsolution=dsolve(diff(y)==-k*y²*t,\
  \ y(0)==0.5, ... 'IgnoreAnalyticConstraints', false)\n```\n\n## 二阶常微分方程与常微分方程组\n\
  \n许多过程和现象都通过二阶微分方程来表达。例如，弹簧-质量系统的简谐运动、具有一定加速度的物体的运动（牛顿第二定律）、阻尼振动、电阻-电容-电感电路中的电流流动等。通常，二阶常微分方程以两种不同形式表示——齐次方程（方程\
  \ 8.4）和非齐次方程（方程 8.5）。\n\n![$$ \\ddot{y}+p(x)\\dot{y}+q(x)y=0 $$](img/471979_1_En_8_Chapter_TeX_Equ3.png)\n\
  \n（方程 8.4）\n\n![$$ \\ddot{y}+p(x)\\dot{y}+q(x)y=g(x) $$](img/471979_1_En_8_Chapter_TeX_Equ4.png)\n\
  \n（方程 8.5）\n\n请注意，方程 8.4 中的齐次常微分方程总是有一个平凡解，即 `y(x) = 0`，它满足方程 8.4 中的给定条件。关于独立函数\
  \ `p(x)`、`q(x)`、`g(x)`，这些常微分方程可以是线性的或非线性的。在某些情况下，独立函数 `p(x)`、`q(x)`、`g(x)` 可以是常量或非常量。\n\
  \n让我们通过几个二阶常微分方程的示例，看看如何使用 MATLAB 的符号数学工具箱计算通解和特解。\n\n### 示例 1：使用 dsolve 求解二阶常微分方程\n\
  \n给定一个常微分方程 ![$$ \\frac{d²u}{dt²}+100u=2.5\\sin (10t),\\kern0.5em u(0)=0,\\kern0.5em\
  \ \\frac{du(0)}{dt}=0 $$](img/471979_1_En_8_Chapter_TeX_IEq24.png)：\n\n```\nusol=dsolve('D2u+100*u=2.5*sin(10*t)',\
  \ 'u(0)=0', 'Du(0)=0');\npretty(usol)\n%% 备选语法\nsyms u(t)\nDu = diff(u);\nu(t) =\
  \ dsolve(diff(u, 2)==2.5*sin(10*t)-100*u, u(0)==0, Du(0) == 0);\npretty(u(t))\n\
  ```\n\n执行这两个简短脚本/命令后的输出为：\n\n```\n3 sin(10 t)   sin(30 t)\n----------- - ---------\
  \ -\n320          320\n/ t   sin(20 t) \\\ncos(10 t) | - - --------- |\n\\ 8   \
  \   160    /\n```\n\n### 示例 2：常微分方程组\n\n给定常微分方程组：![$$ \\left\\{\\begin{array}{c}{y}_1^{\\\
  prime }={y}_2\\\\ {}{y}_2^{\\prime }=-{y}_1-0.125{y}_2\\end{array}\\right.,\\kern0.5em\
  \ {y}_1(0)=1,{y}_2(0)=0 $$](img/471979_1_En_8_Chapter_TeX_IEq25.png)；\n\n给定的问题是一个由两个一阶常微分方程组成的方程组。这个问题可以使用\
  \ `dsolve` 直接求解，类似于之前的示例：\n\n```\n%% 使用 dsolve 求解两个一阶常微分方程组成的方程组\nyt=dsolve('Dy1=y2',\
  \ 'Dy2=-y1-0.125*y2','y1(0)=1', 'y2(0)=0');\npretty(yt.y1)\npretty(yt.y2)\n%% 备选语法\n\
  syms y1(t) y2(t)\nz=dsolve(diff(y1,1)==y2, diff(y2,1)==(-y1-0.125*y2), y1(0)==1,\
  \ y2(0)==0);\npretty(z.y1), pretty(z.y2)\n```\n\n在命令窗口中显示的计算得出的解析解为：\n\n```\n/ \
  \   1/2   \\             /    1/2   \\\n| 255    t |      1/2    | 255    t |\n\
  cos| -------- |   255    sin| -------- |\n\\    16    /             \\    16   \
  \ /\n--------------- + ----------------------\n1/16                    1/16\nexp(t)\
  \              255 exp(t)\n/    1/2   \\\n1/2    | 255    t |\n16 255    sin| --------\
  \ |\n\\    16    /\n- -------------------------\n1/16\n255 exp(t)\n```\n\n计算得出的解析解为：\n\
  \n![$$ {y}_1(t)=\\frac{\\mathit{\\cos}\\left(\\frac{\\sqrt{255}t}{16}\\right)}{\\\
  sqrt[16]{e^t}}+\\frac{\\sqrt{255}\\mathit{\\sin}\\left(\\frac{\\sqrt{255}t}{16}\\\
  right)}{255\\sqrt[16]{e^t}} $$](images/471979_1_En_8_Chapter/471979_1_En_8_Chapter_TeX_Equc.png)\n\
  \n![$$ {y}_2(t)=-\\frac{16\\sqrt{255}\\mathit{\\sin}\\left(\\frac{\\sqrt{255}t}{16}\\\
  right)}{255\\sqrt[16]{e^t}} $$](images/471979_1_En_8_Chapter/471979_1_En_8_Chapter_TeX_Equd.png)\n\
  \n### 示例 3：使用 dsolve 无法求解的解\n\n给定一个二阶常微分方程：![$$ 2\\ddot{y}+3{\\dot{y}}³-\\left|y\\\
  right|\\cos (100t)=2 $$](img/471979_1_En_8_Chapter_TeX_IEq26.png)，`y(0)=0` 且 ![$$\
  \ \\dot{y}(0)=0\\. $$](img/471979_1_En_8_Chapter_TeX_IEq27.png)\n\n```\n>> Solution_dsolve=dsolve('2*D2y+3*(Dy³)-cos(100*t)*abs(y)-2=0',\
  \ ... 'y(0)=0','Dy(0) =0');\n警告: 无法找到显式解。\n> In dsolve at 194\n```\n\n这是处理无法使用 `dsolve`\
  \ 解析求解的常微分方程的一种好方法。\n\n让我们看几个在 MuPAD 笔记本中计算常微分方程解析解的示例。我们可以通过在命令窗口中输入以下命令来打开 MuPAD：\n\
  \n```\n>> mupad\n```\n\n### 示例 4：计算解析解\n\n![$$ \\dot{y}-\\left|y\\right|{e}^t=2,y(0)=2\\\
  . $$](img/471979_1_En_8_Chapter_TeX_IEq28.png) 图 8-3 显示了用于计算给定练习解析解的命令。\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig3_HTML.jpg](img/471979_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n用于解析求解 ![$$ \\dot{y}-\\left|y\\right|{e}^t=2,y(0)=2 $$](img/471979_1_En_8_Chapter_TeX_IEq29.png)\
  \ 的 MuPAD 命令\n\n### 示例 5：一个有趣的常微分方程\n\n让我们考虑一个二阶常微分方程，如下所示：![$$ \\ddot{y}+\\dot{y}=\\\
  sin t\\mathrm{with}\\ y(0)=1,\\kern0.5em \\dot{y}(0)=2\\. $$](img/471979_1_En_8_Chapter_TeX_IEq30.png)\n\
  \n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig4_HTML.jpg](img/471979_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n用于求解二阶常微分方程的 MuPAD 工具\n\n### 示例 6：应对无解析解的情况\n\n给定 ![$$ \\ddot{y}+3{\\\
  dot{y}}³-\\left|y\\right|\\mathrm{y}=2 $$](img/471979_1_En_8_Chapter_TeX_IEq31.png)，`y(0)=0`\
  \ 且 ![$$ \\dot{y}(0)=0 $$](img/471979_1_En_8_Chapter_TeX_IEq32.png)，这是一个二阶非齐次非线性常微分方程。\n\
  \n```\nY:=ode({y\"(t)+3*(y'(t)³)-y(t)*abs(y(t))=2,y(0)=0,y'(0)=0},y(t)\n```\n\n\
  ![../images/471979_1_En_8_Chapter/471979_1_En_8_Figa_HTML.jpg\n\n```\nYsolution:=solve(Y)\n\
  ```\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Figb_HTML.jpg\n\n本练习中未计算出解。当\
  \ MuPAD 无法计算给定常微分方程问题的解析解时，它会重写给定的问题表述，并且不产生解析解表达式。\n\n\n\n# 拉普拉斯变换\n\n常系数线性常微分方程的解可以通过拉普拉斯变换来求解。拉普拉斯变换在解微分方程时最重要的特征之一在于，变换后的方程是一个代数方程。它将被用于定义给定微分方程的解。通常，应用拉普拉斯变换求解微分方程的过程可以表述如下。\n\
  \n考虑 `y`^(*n*)(`x`) = `f`(`t`) 的 n 阶导数。`y`^(*n*)(`x`) 的拉普拉斯变换如下：\n\n![$$ \\mathcal{L}\\\
  left\\{\\frac{d^ny}{d{t}^n}=f(t)\\right\\}=&gt;{s}^nY(s)-{s}^{n-1}{y}^{n-1}(0)-{s}^{n-2}{y}^{n-2}(0)-\
  \ $$](img/471979_1_En_8_Chapter_TeX_Eque.png)\n\n![$$ -s{y}^{\\prime }(0)-y(0)=F(s)\
  \ $$](img/471979_1_En_8_Chapter_TeX_Equ5.png)\n\n(方程 8.6)\n\n或者\n\n![$$ {s}^nY(s)-{\\\
  sum}_{i=1}^n{s}^{n-1}{y}^{i-1}(0)=F(s) $$](img/471979_1_En_8_Chapter_TeX_Equ6.png)\n\
  \n(方程 8.7)\n\n在方程 8.6 或 8.7 中，如果我们代入在 `t` = 0 时给出的初始条件常数值，即 `y`(0) = `a`[0]; `y`^′(0)\
  \ = `a`[1]; `y`^\"(0) = `a`[2]; …; `y`^(*n* − 2)(0) = `a`[*n* − 2]; `y`^(*n* − 1)(0)\
  \ = `a`[*n* − 1].\n\n现在，我们可以将表达式（方程 8.6 或 8.7）重写如下：\n\n![$$ \\mathcal{L}\\left\\\
  {\\frac{d^ny}{d{t}^n}=f(t)\\right\\}=&gt;{s}^nY(s)-{s}^{n-1}{a}_0-{s}^{n-2}{a}_1-{s}^{n-3}{a}_2-\\\
  dots -s\\ {a}_{n-2}-{a}_{n-1}=F(s) $$](img/471979_1_En_8_Chapter_TeX_Equ7.png)\n\
  \n(方程 8.8)\n\n随后，我们首先求解 `Y(s)`，对 `Y(s)` 进行逆拉普拉斯变换，然后得到 n 阶微分方程的解 `y(t)`。\n\n应用拉普拉斯变换和逆拉普拉斯变换求解常系数微分方程的一般步骤如下。\n\
  \n1. 对给定方程的两边同时进行拉普拉斯变换。\n2. 用 `F(s)` 和其他未知量表示并求解 `Y(s)`。\n3. 对找到的表达式进行逆拉普拉斯变换，以获得问题的最终解。\n\
  \n注意，在步骤 3 中，我们还应将步骤 2 中的表达式分解为部分分式，以便使用逆拉普拉斯变换的对应表。图 8-5 中的流程图给出了拉普拉斯变换和逆拉普拉斯变换的示意图。\n\
  \n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig5_HTML.jpg](img/471979_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5\n\n用拉普拉斯变换及其逆变换求解常微分方程的流程图\n\n## 示例 1：第一个拉普拉斯变换\n\n让我们考虑一个二阶非齐次微分方程：![$$\
  \ \\frac{d²y}{d{t}²}+A\\frac{dy}{dt}+C={e}^{nt} $$](img/471979_1_En_8_Chapter_TeX_IEq33.png)，`dy`(0)\
  \ = `k`，`y`(0) = `m`。\n\n现在，通过应用流程图中所示的拉普拉斯变换和逆变换的步骤，我们以明确的步骤写出给定问题的拉普拉斯变换。\n\n\
  ![$$ \\mathcal{L}\\left\\{\\frac{d²y}{d{t}²}+A\\frac{dy}{dt}+C={e}^{nt}\\ \\right\\\
  }=&gt;L\\left\\{\\frac{d²y}{d{t}²}\\right\\}+\\mathcal{L}\\left\\{A\\frac{dy}{dt}\\\
  right\\}+\\mathcal{L}\\left\\{C\\right\\}=\\mathcal{L}\\left\\{{e}^{nt}\\right\\\
  } $$](img/471979_1_En_8_Chapter_TeX_Equ8.png)\n\n(方程 8.9)\n\n![$$ \\mathcal{L}\\\
  left\\{{e}^{nt}\\right\\}=\\frac{1}{s-n} $$](img/471979_1_En_8_Chapter_TeX_Equ9.png)\n\
  \n(方程 8.10)\n\n所以，\n\n![$$ \\mathcal{L}\\left\\{\\frac{d²y}{d{t}²}\\right\\}={s}²Y(s)-\
  \ dy(0)-s\\ast y(0)={s}²Y(s)-k-s\\ast m $$](img/471979_1_En_8_Chapter_TeX_Equ10.png)\n\
  \n(方程 8.11)\n\n![$$ \\mathcal{L}\\left\\{A\\frac{dy}{dt}\\right\\}=A\\ast \\mathcal{L}\\\
  left\\{\\frac{dy}{dt}\\right\\}=A\\ast \\left(s\\ast Y(s)-y(0)\\right)=A\\ast s\\\
  ast Y(s)-m $$](img/471979_1_En_8_Chapter_TeX_Equ11.png)\n\n(方程 8.12)\n\n![$$ \\\
  mathcal{L}\\left\\{C\\right\\}=C $$](img/471979_1_En_8_Chapter_TeX_Equ12.png)\n\n\
  (方程 8.13)\n\n将方程 8.10、8.11、8.12 和 8.13 代入方程 8.9，我们得到以下表达式：\n\n![$$ {s}²Y(s)-k- sm+\
  \ AsY(s)-m+C=\\frac{1}{s-n} $$](img/471979_1_En_8_Chapter_TeX_Equ13.png)\n\n(方程\
  \ 8.14)\n\n我们求解方程 8.5 得到 `Y(s)`，以确定下式：\n\n![$$ Y(s)=\\frac{1+\\left( sm+\\left(k+m-C\\\
  right)\\right)\\left(s-n\\right)}{\\left(s-n\\right)\\left({s}²+ As\\right)}=-\\\
  frac{Cn- Cs- kn- mn+ ks+ ms+m{s}²}{s\\left(A+s\\right)\\left(n-s\\right)} $$](img/471979_1_En_8_Chapter_TeX_Equ14.png)\n\
  \n(方程 8.15)\n\n根据方程 8.15 中 `Y(s)` 的表达式，我们可以将其分解为部分分式，并对两边取逆拉普拉斯变换。我们得到方程 8.16，即给定微分方程的\
  \ `y(t)`：\n\n![$$ y(t)=\\frac{e^{nt}}{An+{n}²}-\\frac{Cn- kn- mn+1}{An}+\\frac{Cn-\
  \ kn- mn-A\\left(k- mn-C\\right)+1}{A{e}^{At}\\left(A+n\\right)} $$](img/471979_1_En_8_Chapter_TeX_Equ15.png)\n\
  \n(方程 8.16)\n\n符号数学工具箱内置的 `laplace()` 函数用于计算任何代数表达式或微分方程的拉普拉斯变换。同样，符号数学工具箱的 `ilaplace()`\
  \ 函数用于计算已求得的拉普拉斯变换后 `s` 域表达式的逆变换。这两个函数通过自动分解部分分式过程来处理所有变换，然后计算给定常微分方程练习的解析解。\n\n\
  ## LAPLACE/ILAPLACE\n\n如前所述，`laplace`/`ilaplace` 基于拉普拉斯变换和逆拉普拉斯变换，它们是符号数学工具箱的内置函数工具。`laplace`/`ilaplace`\
  \ 的一般语法如下：\n\n```\nF=laplace(f)\nF=laplace(f, t)\nF=laplace(f, var1, var2)\n```\n\
  \n以及\n\n```\nf=ilaplace(F)\nf=ilaplace(F, s)\nf=ilaplace(F, var1, var2)\n```\n\n\
  ### 示例 2：使用 LAPLACE\n\n给定 `x`(`t`) = sin (2`t`)，使用以下命令语法计算 `x`(`t`) 的拉普拉斯变换。\n\n\
  ```\n>> syms t\n>> xt=sin(2*t); Xs=laplace(xt)\nXs =\n2/(s² + 4)\n```\n\n给定：`y`(`t`)\
  \ = sin (`Kt`)\n\n```\n>> syms t K\n>> yt=sin(K*t); Ys=laplace(yt)\nYs =\nK/(K²\
  \ + s²)\n```\n\n### 示例 3：最后一个 LAPLACE\n\n![$$ y(x)=a{x}³+b. $$](img/471979_1_En_8_Chapter_TeX_Equf.png)\n\
  \n```\n>> syms x a b\n>> yx=a*x³+b; Ys=laplace(yx)\nYs =\n(6*a)/s⁴ + b/s\n```\n\n\
  我们也可以获得 `t` 变量域而不是 `s`。\n\n```\n>> yx=a*x³+b; Yt=laplace(yx, x, t)\nYt =\n(6*a)/t⁴\
  \ + b/t\n```\n\n`ilaplace()` 函数的语法和实现与 `laplace` 完全相同。让我们看几个常微分方程练习，看看如何使用 `laplace`/`ilaplace`，并将它们求得的解与使用\
  \ `dsolve` 得到的解进行比较。\n\n\n\n### 示例 4：比较 LAPLACE/ILAPLACE 与 DSOLVE\n\n让我们使用 `laplace`/`ilaplace`\
  \ 和 `dsolve` 求解 ![$$ \\dot{y}+2y=0,y(0)=0.5 $$](img/471979_1_En_8_Chapter_TeX_IEq34.png)。以下脚本\
  \ (`ODE_Laplace.m`) 展示了求解过程。\n\n```\n% ODE_Laplace.m\nclearvars; clc; close all\n\
  % 步骤 #1. 定义符号变量名称\nsyms t s Y\nODE1='D(y)(t)=-2*y(t)';\n% 步骤 #2. 拉普拉斯变换\nLT_A=laplace(ODE1,\
  \ t, s);\n% 步骤 #3. 代入初始条件并引入未知量 Y\nLT_A=subs(LT_A,{'laplace(y(t),t, s)','y(0)'},{Y,0.5});\n\
  % 步骤 #4. 求解 Y（未知量）\nY=solve(LT_A, Y);\ndisplay('给定 ODE 及其初始条件的拉普拉斯变换'); disp(Y)\n\
  % 步骤 #5. 计算逆拉普拉斯变换\nSolution_Laplace=ilaplace(Y);\ndisplay('使用拉普拉斯变换求得的解：')\npretty(Solution_Laplace)\n\
  % 步骤 #6. 计算数值并绘图\nt=0:.01:2.5; LTsol=eval(vectorize(Solution_Laplace));\nfigure,\
  \ semilogx(t, LTsol, 'ro-')\nxlabel('t'), ylabel('解的值')\ntitle('laplace/ilaplace\
  \ vs dsolve ')\ngrid on; hold on\n% 与 dsolve 求解方法对比\nY_d=dsolve('Dy=-2*y', 'y(0)=0.5');\
  \ display('使用 dsolve 的解')\npretty(Y_d); Y_sol=eval(vectorize(Y_d));\nplot(t,Y_sol,\
  \ 'b-', 'linewidth', 2), grid minor\nlegend('laplace+ilaplace', 'dsolve'), hold\
  \ off; axis tight\n```\n\n执行 `ODE_Laplace.m` 脚本后，得到以下输出。\n\n```\nLaplace Transforms\
  \ of the given ODE with ICs\n1/(2*s + 4)\nSolution found using Laplace Transforms:\n\
  exp(-2 t)\n\nSolution with dsolve\nexp(-2 t)\n```\n\n图 8-6 所示的解曲线清楚地显示了通过 `laplace`/`ilaplace`\
  \ 和 `dsolve` 求得的解完美收敛。\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig6_HTML.png](img/471979_1_En_8_Fig6_HTML.png)\n\
  \n**图 8-6**  \n使用 `laplace`/`ilaplace` 和 `dsolve` 求解的问题 ![$$ \\dot{y}+2y=0,y(0)=0.5\
  \ $$](img/471979_1_En_8_Chapter_TeX_IEq35.png)\n\n### 示例 5：收敛的解\n\n给定 ![$$ \\ddot{y}+\\\
  dot{y}=\\sin t,y(0)=1,\\dot{y}(0)=2 $$](img/471979_1_En_8_Chapter_TeX_IEq36.png)，以下脚本\
  \ (`Laplace_vs_Dsolve.m`) 使用 `laplace`、`ilaplace` 和 `dsolve` 求解这个二阶非齐次常微分方程。\n\n\
  ```\n% Laplace_vs_Dsolve.m\n% %%   拉普拉斯变换\n% 给定: y\"+y'=sin(t) 初始条件: y(0)=1, y'(0)=2.\n\
  clearvars, clc, close all\nsyms t s Y\nODE2nd='D(D(y))(t)+D(y)(t)-sin(t)';\n% 步骤\
  \ 1. 拉普拉斯变换\nLT_A=laplace(ODE2nd, t, s);\n% 步骤 2. 代入初始条件并引入未知量 Y\nLT_A=subs(LT_A,{'laplace(y(t),t,\
  \ s)','y(0)','D(y)(0)'},{Y,1,2});\n% 步骤 3. 求解未知量 Y\nY=solve(LT_A, Y);\ndisplay('给定\
  \ ODE 及其初始条件的拉普拉斯变换'); disp(Y)\nSolution_Laplace=ilaplace(Y);\ndisplay('使用拉普拉斯变换求得的解：')\n\
  pretty(Solution_Laplace); t=0:.01:13;\nLTsol=eval(vectorize(Solution_Laplace));\n\
  figure, plot(t, LTsol, 'ro-'); xlabel('t'),\nylabel('解的值')\ntitle('laplace/ilaplace\
  \ vs. dsolve: ddy+dy=sin(t)'); hold on\n% dsolve 求解方法\nY=dsolve('D2y+Dy=sin(t)',\
  \ 'y(0)=1, Dy(0)=2', 't');\ndisplay('使用 dsolve 的解：');\npretty(Y); Y_sol=eval(vectorize(Y));\n\
  plot(t,Y_sol, 'b-', 'linewidth', 2); grid minor\nlegend('laplace+ilaplace', 'dsolve');\
  \ hold off\n```\n\n计算得到的解析解如下：\n\n```\nLaplace Transforms of the given ODE with\
  \ ICs\n(s + 1/(s² + 1) + 3)/(s² + s)\nSolution found using Laplace Transforms:\n\
  cos(t)   sin(t)   5 exp(-t)\n4 - ------ - ------ - ---------\n2        2       \
  \   2\nSolution with dsolve:\ncos(t)   sin(t)   5 exp(-t)\n4 - ------ - ------ -\
  \ ---------\n2        2          2\n```\n\n从图 8-7 的曲线可以清楚地看出，通过拉普拉斯变换（`laplace`/`ilaplace`）和\
  \ `dsolve` 函数求得的解完美收敛。两个函数都计算出了给定 ODE 的相同解析解。\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig7_HTML.png](img/471979_1_En_8_Fig7_HTML.png)\n\
  \n**图 8-7**  \n![$$ \\ddot{y}+\\dot{y}=\\mathit{\\sin}(t),y(0)=1,\\kern0.5em \\\
  dot{y}(0)=2 $$](img/471979_1_En_8_Chapter_TeX_IEq37.png) 的数值解\n\n### 示例 6：无解析解\n\
  \n给定一个二阶非齐次非线性 ODE ![$$ 2\\ddot{y}+3{\\dot{y}}³-\\left|y\\right|\\cos (t)=2 $$](img/471979_1_En_8_Chapter_TeX_IEq38.png)，*y*(0)\
  \ = 0 和 ![$$ \\dot{y}(0)=0. $$](img/471979_1_En_8_Chapter_TeX_IEq39.png)。以下是使用拉普拉斯和逆拉普拉斯变换的求解脚本\
  \ (`Lap_inv_Lap.m`)：\n\n```\n% Lap_inv_Lap.m\nclearvars, clc, close all\nsyms t\
  \ s Y\nODE2nd='2*D(D(y))(t)+3*(D(y)(t))³-cos(100*t)*abs(y(t))-2';\n% 步骤 1. 拉普拉斯变换\n\
  LT_A=laplace(ODE2nd, t, s);\n% 步骤 2. 代入初始条件并引入未知量 Y\nLT_A=subs(LT_A,{'laplace(y(t),t,\
  \ s)','y(0)','D(y)(0)'},{Y,0,0});\n% 步骤 3. 求解未知量 Y\nY=solve(LT_A, Y);\ndisplay('给定\
  \ ODE 及其初始条件的拉普拉斯变换'); disp(Y)\nSolution_Laplace=ilaplace(Y);\ndisplay('使用拉普拉斯变换求得的解：')\n\
  pretty(Solution_Laplace)\n```\n\n`Lap_inv_Lap.m` 脚本在命令窗口产生以下输出：\n\n```\nLaplace\
  \ Transforms of the given ODE with ICs\n(4 + s*laplace(abs(y(t)), t, s - 100*i)\
  \ + s*laplace(abs(y(t)), t, s + 100*i) - 6*s*laplace(D(y)(t)³, t, s))/(4*s³)\nSolution\
  \ found using Laplace Transforms:\n/                3              \\\n| laplace(D(y)(t)\
  \ , t, s)       |\n3 ilaplace| -----------------------, s, t |\n2             |\
  \            2                  |\nt              \\           s               \
  \    /\n-- - ------------------------------------------- +\n2                  \
  \       2\n/ laplace(|y(t)|, t, s - 100 i)       \\\nilaplace| -----------------------------,\
  \ s, t |\n|               2                     |\n\\              s           \
  \           /\n----------------------------------------------- +\n\n/ laplace(|y(t)|,\
  \ t, s + 100 i)       \\\nilaplace| -----------------------------, s, t |\n|   \
  \            2                     |\n\\              s                      /\n\
  -----------------------------------------------\n```\n\n这个输出意味着，与 `dsolve` 函数工具一样，`laplace`/`ilaplace`\
  \ 未能显式计算解析解。\n\n\n\n#### 示例 7：论证高效与便捷\n\n给定一个二阶非齐次常微分方程 ![$$ 2\\ddot{y}+3\\dot{y}-2y=g(t)\
  \ $$](img/471979_1_En_8_Chapter_TeX_IEq40.png)，`y(0) = 0` 且 ![$$ \\dot{y}(0)=0 $$](img/471979_1_En_8_Chapter_TeX_IEq41.png)，其中\
  \ `g(t)` 是一个不连续的强制函数，定义为\n\n![$$ g(t)={u}_2(t)-{u}_{10}(t)=\\left\\{\\begin{array}{c}5,\\\
  kern7.75em 2\\le t&lt;10,\\\\ {}0,\\kern3em 0\\le t&lt;2\\kern0.5em \\mathrm{and}\\\
  \ t\\ge 10.\\kern0.5em \\end{array}\\right. $$](img/471979_1_En_8_Chapter_TeX_Equg.png)\n\
  \n给定方程的拉普拉斯变换为：\n\n![$$ \\mathcal{L}\\left\\{2\\ddot{y}+3\\dot{y}-2y\\right\\}=\\\
  mathcal{L}\\left\\{{u}_2(t)-{u}_{10}(t)\\right\\} $$](img/471979_1_En_8_Chapter_TeX_Equh.png)\n\
  \n![$$ 2{s}²Y(s)-2s\\ast y(0)-2\\ast \\dot{y}(0)+3 sY(s)-y(0)-2Y(s)=\\frac{5\\left({e}^{-2s}-{e}^{-10s}\\\
  right)}{s} $$](img/471979_1_En_8_Chapter_TeX_Equi.png)\n\n![$$ Y(s)=\\frac{5\\left({e}^{-2s}-{e}^{-10s}\\\
  right)}{s\\left(2{s}²+3s-2\\right)} $$](img/471979_1_En_8_Chapter_TeX_Equj.png)\n\
  \n请注意，`e^(-2s)`、`e^(-10s)` 用于解释系统输出信号中的时间延迟；换句话说，-2 和 -10 分别表示 2 秒和 10 秒的时间延迟。5\
  \ 是赫维赛德（阶跃）函数的幅值。\n\n公式 `Y(s)` 是微分方程在 `s` 域的解，但我们需要其在时域中的形式。因此，我们需要计算其逆拉普拉斯变换：![$$\
  \ {\\mathcal{L}}^{-1}\\left\\{Y(s)\\right\\}=y(t) $$](img/471979_1_En_8_Chapter_TeX_IEq42.png)。通过使用\
  \ `ilaplace()`，编写了以下简短脚本（`Lap_4_non_homog.m`）。该脚本求解了给定问题，并计算了其解析解和数值解。\n\n```\n\
  % Lap_4_non_homog.m\nsyms t s\nF=5*(exp(-2*s)-exp(-10*s))/s; Y=2*s²+s+2;\nTF=F/Y;\
  \ TFt=ilaplace(TF); pretty(TFt); Sol=vectorize(TFt);\nt=linspace(0, 20, 400); S=eval(Sol);\
  \ plot(t, S, 'bo-');\ngrid minor\ntitle('Differential Equation with Discontinuous\
  \ Forcing Fcn')\ngrid on, xlabel('time'), ylabel('y(t) solution'), shg\n```\n\n\
  脚本执行后，得到如下解图和解的表达式，如图 8-8 所示。\n\n![../images/471979_1_En_8_Chapter/471979_1_En_8_Fig8_HTML.png](img/471979_1_En_8_Fig8_HTML.png)\n\
  \n图 8-8\n\n受不连续强制函数作用的二阶非齐次常微分方程的仿真\n\n```\n>> pretty(TFt)\n/                / \
  \            1/2         \\       \\\n|    /       t \\ |           15    sin(#1)\
  \ |       |\n| exp| 5/2 - - | | cos(#1) + ------------- |       |\n|    \\     \
  \  4 / \\                15       /       |\n5 heaviside(t - 10) | ------------------------------------------\
  \ - 1/2 |\n\\                     2                            /\n/            \
  \    /             1/2         \\       \\\n|    /       t \\ |           15   \
  \ sin(#2) |       |\n| exp| 1/2 - - | | cos(#2) + ------------- |       |\n|   \
  \ \\       4 / \\                15       /       |\n5 heaviside(t - 2) | ------------------------------------------\
  \ - 1/2 |\n\\                     2                            /\nwhere\n1/2\n15\
  \    (t - 10)\n#1 == --------------\n\n1/2\n15    (t - 2)\n#2 == -------------\n\
  ```\n\n从上一个练习中，可以得出以下几点结论。使用拉普拉斯变换（`laplace`/`ilaplace`）来计算受外部不连续强制函数作用的非齐次常微分方程的解析解相对容易、快速且省力。这类练习在控制工程问题中尤为常见。此外，必须指出，拉普拉斯变换和逆拉普拉斯变换（`laplace`/`ilaplace`）在求解常微分方程时易于实现。用它们求得的常微分方程的解与用\
  \ `dsolve()` 求得的解完全吻合。如前所述，许多常微分方程无法用 `laplace`/`ilaplace` 和 `dsolve` 函数解析求解。因此，数值方法通常是唯一的选择。\n\
