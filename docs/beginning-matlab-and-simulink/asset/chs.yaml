  \n### 注意\n\n要将 Simulink 库始终置于所有窗口（包括模型窗口）的顶部，请点击置顶图标 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figi_HTML.jpg](img/471979_1_En_5_Figi_HTML.jpg)。\n\
  \n此外，一开始您需要在 Simulink 库中工作。可以通过点击 Simulink 前面的 `+` 来访问该库。Simulink 库包含许多模块组，这些模块组被归纳在\
  \ `Commonly Used Blocks`、`Continuous`、`Dashboard`、`Discontinuities`、`Discrete`、`Logic`\
  \ 和 `Bit Operations` 中。让我们通过几个示例来探索 Simulink 环境中的建模工具和方面。\n\n### 示例：对简单算术运算进行建模\n\
  \n让我们计算简单的算术运算，例如 `+`、`-`、`/`、`*`、`sqrt()` 等。\n\n计算 `13+22*5.3-(3i/2+sqrt(5))` 并显示结果。\n\
  \n为了对这个练习中的算术计算进行建模，您需要从库中获取以下模块：`Simulink/Commonly Used Blocks`：四个 `Constant` 模块、三个\
  \ `Sum` 模块、一个 `Gain` 模块，以及来自 `Simulink/Sinks` 的一个 `Display` 模块，用于输出计算结果。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig8_HTML.jpg](img/471979_1_En_5_Fig8_HTML.jpg)\n\
  \n**图 5-8** 模块\n\n1.  将所有模块拖放到模型区。\n2.  所有 `Constant` 模块的常量值必须根据给定任务进行更改（`13`、`22`、`3i/2`、`sqrt(5)`）——见图\
  \ 5-8。类似地，通过依次双击每个模块来添加一个 `Gain` 模块（用于 `5.3`）（见图 5-9）。\n3.  将一个名为 `Constant`（`13`）的\
  \ `Constant` 模块连接到一个带有 `+` 符号的 `Sum` 模块。操作方法是：左键点击该模块并按住键盘上的 `Ctrl` 键，然后左键点击一个 `Sum`\
  \ 模块。\n4.  将一个名为 `Constant1`（`22`）的 `Constant` 模块连接到一个 `Gain` 模块，该模块再连接到带有 `+` 符号的\
  \ `Sum` 模块，如图 5-6 所示。\n5.  将一个名为 `Constant2`（`3i/2`）的 `Constant` 模块连接到第二个 `Sum`\
  \ 模块。这个矩形形状可以通过双击带有 `+` 符号的 `Sum` 模块来更改。类似地，使用 `+` 符号将一个名为 `Constant3`（`sqrt(5)`）的\
  \ `Constant` 模块连接到此 `Sum` 模块。\n6.  将两个 `Sum` 模块连接到一个带有 `+` 和 `-` 符号的第三个 `Sum` 模块。随后，将第三个\
  \ `Sum` 模块连接到 `Display` 模块。\n\n### 注意\n\n任何模块都可以通过按住 `Ctrl` 并左键点击该模块，然后将其拖到模型空间中的任意位置来复制多次。这种方法比从库中拖动同一个模块更快、更高效。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig9_HTML.jpg](img/471979_1_En_5_Fig9_HTML.jpg)\n\
  \n**图 5-9** 更改 `Sum` 模块的符号和图标形状\n\n至此，我们简单的 Simulink 计算模型就完成了。\n\n此模型以文件名 `Ex1_Arithmetic_operations.mdl`\
  \ 保存。\n\n### 注意\n\n在 Simulink 的最新版本中，模型可以保存为 `*.mdl`（向后兼容的文件格式）或 `*.slx`（后续版本支持）格式。任何\
  \ Simulink 模型都可以通过 `文件 ➤ 导出模型到 ➤ 先前版本...` 导出到以前的版本。在“保存类型”选项中，您可以从下拉菜单中选择适当的版本。\n\
  \n要查看计算结果，请点击 `运行` 按钮 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figj_HTML.jpg](img/471979_1_En_5_Figj_HTML.jpg)\
  \ 或按键盘上的 `Ctrl+T` 键。结果将显示在显示模块中。图 5-10 显示了完整的模型。\n\n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig10_HTML.jpg](img/471979_1_En_5_Fig10_HTML.jpg)\n\
  \n**图 5-10** 名为 `Ex1_Arithmetic_operations.mdl` 的完整 Simulink 模型\n\n### 注意\n\n要在全屏模式下查看模型，只需按键盘上的空格键。要放大或缩小，请按键盘上的\
  \ `Ctrl++` 和 `Ctrl+-` 键（在后续版本中），或者点击 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figk_HTML.jpg](img/471979_1_En_5_Figk_HTML.jpg)\
  \ 以获得适合视图，或使用 ![../images/471979_1_En_5_Chapter/471979_1_En_5_Figl_HTML.jpg](img/471979_1_En_5_Figl_HTML.jpg)\
