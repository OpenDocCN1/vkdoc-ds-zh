  \ `Simulink` 中创建的模型与旧版本并不完全兼容。所有模型都是向前兼容的：在旧版本 `Simulink` 中创建的模型可以在该包的后续版本中运行。\n\
  \n![../images/471979_1_En_5_Chapter/471979_1_En_5_Fig5_HTML.jpg](img/471979_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n\nSimulink 库浏览器\n\n让我们构建一个新模型，从库中拖放所有必需的模块。将模块拖放到新模型区域是基于 `Simulink` 建模或编程中最常见的做法；然而，在较新版本的\
