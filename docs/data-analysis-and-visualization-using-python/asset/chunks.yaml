  raw: '### Unify Interpretation


    Data visualizations can produce charts and graphics that lead to the same interpretations
    by all who use the extracted information for decision-making. There are many data
    visualization tools such as R, Python, Matlab, Scala, and Java. Table [2-1](#472943_1_En_2_Chapter.xhtml#Tab1)
    compares the most common languages, which are the R and Python languages.


    Table 2-1


    The R Language vs. Python


    | Parameter | R | Python |

    | --- | --- | --- |

    | **Main use** | Data analysis and statistics. | Deployment and production. |

    | **Users** | Scholars and researchers. | Programmers and developers. |

    | **Flexibility** | Easy-to-use available library. | It’s easy to construct new
    models from scratch. |

    | **Integration** | Runs locally. | Well-integrated with app.Runs through the
    cloud. |

    | **Database size** | Handles huge size. | Handles huge size. |

    | **IDE examples** | RStudio. | Spyder, IPython Notebook, Jupyter Notebook, etc.
    |

    | **Important packages and libraries** | Tydiverse, Ggplot2, Caret, Zoo. | Pandas,
    Numpy, Scipy, Scikit-learn, TensorFlow, Caret. |

    | **Advantages** | • Comprehensive statistical analysis package.• Open source;
    anyone can use it.• It is cross-platform and can run on many operating systems.•
    Anyone can fix bugs and make code enhancements. | • Python is a general-purpose
    language that is easy and intuitive.• Useful for mathematical computation.• Can
    share data online via clouds and IDEs such as Jupyter Notebook.• Can be deployed.•
    Fast processing.• High code readability.• Supports multiple systems and platforms.•
    Easy integration with other languages such as C and Java. |

    | **Disadvantages** | • Quality of some packages is not good.• R can consume all
    the memory because of its memory management.• Slow and high learning curve.• Dependencies
    between library.• There is no regular and direct update for R packages and bugs.
    | • Comparatively smaller pool of Python developers.• Python doesn’t have as many
    libraries as R.• Not good for mobile development.• Database access limitations.
    |


    ## Introducing Data Visualization Techniques


    Data visualization aims to understand data by extracting and graphing information
    to show patterns, spot trends, and identify outliers. There are two basic types
    of data visualization.


    *   *Exploration* helps to extract information from the collected data.


    *   *Explanation* demonstrates the extracted information.


    There are many types of 2D data visualizations, such as temporal, multidimensional,
    hierarchical, and network. In the following section, we demonstrate numerous data
    visualization techniques provided by the Python programming language.


    ### Loading Libraries


    Some libraries are bundled with Python, while others should be directly downloaded
    and installed.


    For instance, you can install Matplotlib using `pip` as follows:


    ```

    python -m pip install -U pip setuptools

    python -m pip install matplotlib

    ```


    You can install, search, or update Python packages with Jupyter Notebook or with
    a desktop Python IDE such as Spyder. Table [2-2](#472943_1_En_2_Chapter.xhtml#Tab2)
    shows how to use the `pip` and `conda` commands .


    Table 2-2


    Installing and Upgrading Python Packages


    | Description | pip | conda Anaconda |

    | --- | --- | --- |

    | Works with | Python and Anaconda | Anaconda only |

    | Search a package | `pip search matplolib` | `conda search matplolib` |

    | Install a package | `pip install matplolib` | `conda install matplolib` |

    | Upgrade a package | `pip install matplolib-upgrade` | `conda install matplolib-upgrade`
    |

    | Display installed packages | `pip list` | `conda list` |


    Let’s list all the installed or upgraded Python libraries using the `pip` and
    `conda` commands .


    ```

    conda list

    pip list

    ```


    Similarly, you can install or upgrade packages or specific Python packages such
    as Matplotlib on Jupyter Notebooks, as shown in Listing [2-1](#472943_1_En_2_Chapter.xhtml#PC3).


    ```

    In [5]: try:

    import matplotlib

    except:

    import pip pip.main([''install'', ''matplotlib''])

    import matplotlib

    Listing 2-1

    Installed or Upgraded Packages

    ```


    It is possible to import any library and use alias names, as shown here:


    ```

    In [ ]:import matplotlib.pyplot as plt import numpy as np

    import pandas as pd

    import seaborn as sns

    import pygal from mayavi

    import mlab

    etc....

    ```


    Once you load any library to your Python script, then you can call the package
    functions and attributes.


    ### Popular Libraries for Data Visualization in Python


    The Python language provides numerous data visualization libraries for plotting
    data. The most used and common data visualization libraries are Pygal, Altair,
    VisPy, PyQtGraph, Matplotlib, Bokeh, Seaborn, Plotly, and ggplot, as shown in
    Figure [2-1](#472943_1_En_2_Chapter.xhtml#Fig1).


    ![../images/472943_1_En_2_Chapter/472943_1_En_2_Fig1_HTML.png](images/472943_1_En_2_Chapter/472943_1_En_2_Fig1_HTML.png)


    Figure 2-1


    Data visualization libraries


    Each of these libraries has its own features. Some of these libraries may be adopted
    for implementation and dependent on other libraries. For example, Seaborn is a
    statistical data visualization library that uses Matplotlib. In addition, it needs
    Pandas and maybe NumPy for statistical processing before visualizing data.


    #### Matplotlib


    Matplotlib is a Python 2D plotting library for data visualization built on Numpy
    arrays and designed to work with the broader SciPy stack. It produces publication-quality
    figures in a variety of formats and interactive environments across platforms.
    There are two options for embedding graphics directly in a notebook.


    *   The `%matplotlib` notebook will lead to *interactive* plots embedded within
    the notebook.


    *   The `%matplotlib` inline will lead to *static* graphs images of your plot
    embedded in the notebook.


    Listing [2-2](#472943_1_En_2_Chapter.xhtml#PC5) plots fixed data using Matplotlib
    and adjusts the plot attributes.


    ```

    In [12]:import numpy as np

    import matplotlib.pyplot as plt

    %matplotlib inline

    plt.style.use(''seaborn-whitegrid'')

    X = [590,540,740,130,810,300,320,230,470,620,770,250]

    Y = [32,36,39,52,61,72,77,75,68,57,48,48]

    plt.scatter(X,Y)

    plt.xlim(0,1000)

    plt.ylim(0,100)

    #scatter plot color

    plt.scatter(X, Y, s=60, c="red", marker="^")

    #change axes ranges

    plt.xlim(0,1000)

    plt.ylim(0,100)

    #add title

    plt.title(''Relationship Between Temperature and Iced Coffee Sales'')

    #add x and y labels

    plt.xlabel(''Sold Coffee'')

    plt.ylabel(''Temperature in Fahrenheit'')

    #show plot

    plt.show()

    Listing 2-2

    Importing and Using the Matplotlib Library

    ```


    Figure [2-2](#472943_1_En_2_Chapter.xhtml#Fig2) shows a visualization in the Matplot
    library.


    ![../images/472943_1_En_2_Chapter/472943_1_En_2_Fig2_HTML.jpg](images/472943_1_En_2_Chapter/472943_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Visualizing data using Matplotlib


    Listing [2-3](#472943_1_En_2_Chapter.xhtml#PC6) plots fixed data using Matplotlib
    and adjusts the plot attributes.


    ```

    In [20]:%matplotlib inline

    import matplotlib.pyplot as plt

    import numpy as np

    plt.style.use(''seaborn-whitegrid'')

    # Create empty figure

    fig = plt.figure()

    ax = plt.axes()

    x = np.linspace(0, 10, 1000)

    ax.plot(x, np.sin(x));

    plt.plot(x, np.sin(x))

    plt.plot(x, np.cos(x))

    # set the x and y axis range

    plt.xlim(0, 11)

    plt.ylim(-2, 2)

    plt.axis(''tight'')

    #add title

    plt.title(''Plotting data using sin and cos'')

    Listing 2-3

    Importing Numpy and Calling Its Functions

    ```


    Figure [2-3](#472943_1_En_2_Chapter.xhtml#Fig3) shows the accumulated attributes
    added to the same graph.


    ![../images/472943_1_En_2_Chapter/472943_1_En_2_Fig3_HTML.jpg](images/472943_1_En_2_Chapter/472943_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Determining the adapted function (sin and cos) by Matplotlib


    All altered attributes are applied to the same graph as shown above.


    There are many different plotting formats generated by the Matplotlib package;
    some of these formats will be discussed in Chapter [7](#472943_1_En_7_Chapter.xhtml).'
