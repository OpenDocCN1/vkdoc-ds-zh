  trans: '

    # 2. 数据可视化在商业智能中的重要性


    `数据可视化`是将数据解读并以图形或图表形式呈现的过程。当前，我们正生活在大数据时代，数据已被描述为商业的原材料。企业、行业、研究机构和技术开发中使用的数据量巨大，且每天都在快速增长。我们收集和分析的数据越多，就越有能力做出关键的业务决策。然而，随着数据的急剧增长，企业从现有数据中提取关键信息变得愈发困难。这正是数据可视化重要性凸显之处。数据可视化通过将海量数据总结并以简单易懂的格式呈现，帮助人们理解数据的意义，从而清晰有效地传达信息。


    ## 从输入到输出的转变


    任何企业的决策者都希望使用高度可视化的商业智能（BI）工具，以便快速做出正确决策。商业智能已变得更加主流；因此，供应商开始关注流程的两端，并提高数据输入的质量。同时，他们也高度重视确保输出结构良好且清晰呈现。这种对输出的关注很大程度上是由消费者的需求驱动的，而消费者已被可视化所能提供的价值所吸引。BI
    仪表板是整合多种不同数据可视化的绝佳方式，能够提供业务绩效和待改进领域的概览。


    ## 数据可视化为何重要？


    俗话说，一图胜千言。人类通过图片理解数据，远比阅读行列中的数字更有效。因此，如果数据以图形格式呈现，人们就能更有效地发现相关性并提出重要问题。


    数据可视化有助于企业实现众多目标。


    *   将业务数据转换为交互式图表，进行动态解读，以服务于业务目标

    *   将来自不同数据源的数据转化为视觉上吸引人、可交互的仪表板，为业务提供洞察

    *   创建更具吸引力和信息量的仪表板，展示各种图形化的数据表示

    *   通过深入挖掘数据并发现洞察，做出恰当的决策

    *   找出所分析数据中的模式、趋势和相关性，以确定必须在哪些方面改进运营流程，从而促进业务增长

    *   提供所分析数据的更全面图景

    *   直观地组织和呈现海量数据，以展示数据中的重要发现

    *   借助数据可视化做出更优、更快速且更明智的决策


    ## 现代企业为何需要数据可视化？


    通过不同方式收集到的关于业务活动的海量数据，企业领导者需要合适的技术来轻松深入挖掘数据，以了解可以在哪些方面改进运营流程并促进业务增长。数据可视化将商业智能变为现实。现代企业需要数据可视化，原因如下：


    *   数据可视化帮助公司分析其不同流程，以便管理层能够专注于需要改进的领域，从而增加收入并提高生产力。

    *   它让商业智能变得生动。

    *   它采用创造性的方法来理解业务数据中隐藏的信息。

    *   它提供了一种更好、更快的方式来识别数据集中的模式、趋势和相关性，而这些仅靠文本是无法发现的。

    *   它通过预测即将到来的趋势或销售量及其将产生的收入，来识别新的商业机会。

    *   它通过将数据集绘制在同一可视化图表上，为管理者提供进行更有效比较所需的信息。

    *   它使管理者能够理解运营条件与业务绩效之间的相关性。

    *   它帮助企业发现业务的灰色地带，并做出正确的改进决策。

    *   数据可视化帮助管理者理解客户的行为和兴趣，从而留住客户并保持市场份额。


    ## 数据可视化的未来


    数据可视化正从一门艺术转变为一门科学领域。数据科学技术要求我们从相对简单的图表转向多方面的关系图谱。多维可视化将提升数据可视化在物联网、网络与复杂性理论、纳米科学、社会科学研究、教育系统、认知科学、太空等领域所能发挥的作用。现在和未来，数据可视化都将在应用网络理论、物联网、复杂性理论等众多概念中发挥关键作用。例如，网络理论运用算法来理解和建模对象之间的成对关系，以理解犯罪预防与疾病管理、社交网络分析、生物网络分析、网络优化和链接分析等多个领域中的关系与交互。


    数据可视化将被大量用于分析和可视化从数十亿互联设备（从智能家电和可穿戴设备到汽车传感器以及环境和智慧城市监测器）收集的数据流。物联网设备数据将提供对全球正在发生之事的非凡洞察。在此背景下，数据可视化将提高安全水平，提升运营效率，帮助更好地理解多种全球现象，并改进和定制所提供的洲际服务。


    ## 数据可视化如何用于商业决策


    数据可视化对于任何企业来说都是一项真正的资产，有助于做出实时业务决策。它将提取的信息可视化为逻辑清晰、有意义的各个部分，并通过保持简单、相关和清晰来帮助用户避免信息过载。可视化有多种方式可以帮助企业改进决策。


    ### 更快的响应


    快速响应客户或用户的需求对于任何公司留住客户并保持其忠诚度都至关重要。通过社交网络或公司系统每天收集的海量数据，将收集到的数据的有用解读交到管理者和决策者手中变得极其有用，这样他们就能快速识别问题并缩短响应时间。


    ### 简洁性


    基于大量原始数据做出有效决策是不可能的。因此，数据可视化提供了所限定参数的完整图景，并通过让决策者能够挑选所需的相关数据并在需要时深入查看细节，从而简化了数据。


    ### 更轻松的模式可视化


    数据可视化提供了更简单的方法来识别数据集中即将出现的趋势和模式，从而使企业能够做出有效决策并提前制定策略。


    ### 团队参与


    数据可视化不仅处理历史数据，也处理实时数据。不同的组织单元都能受益于直接访问由数据可视化工具展示的提取信息。这提高了部门之间的协作水平，帮助他们实现战略目标。

    '
- fmt: "### Unify Interpretation\n\nData visualizations can produce charts and graphics\
    \ that lead to the same interpretations by all who use the extracted information\
    \ for decision-making. There are many data visualization tools such as `R`, `Python`,\
    \ `Matlab`, `Scala`, and `Java`. Table [2-1](#472943_1_En_2_Chapter.xhtml#Tab1)\
    \ compares the most common languages, which are the `R` and `Python` languages.\n\
    \nTable 2-1  \nThe R Language vs. Python\n\n| Parameter | R | Python |\n| ---\
    \ | --- | --- |\n| **Main use** | Data analysis and statistics. | Deployment and\
    \ production. |\n| **Users** | Scholars and researchers. | Programmers and developers.\
    \ |\n| **Flexibility** | Easy-to-use available library. | It’s easy to construct\
    \ new models from scratch. |\n| **Integration** | Runs locally. | Well-integrated\
    \ with app. Runs through the cloud. |\n| **Database size** | Handles huge size.\
    \ | Handles huge size. |\n| **IDE examples** | RStudio. | Spyder, IPython Notebook,\
    \ Jupyter Notebook, etc. |\n| **Important packages and libraries** | Tydiverse,\
    \ Ggplot2, Caret, Zoo. | Pandas, Numpy, Scipy, Scikit-learn, TensorFlow, Caret.\
    \ |\n| **Advantages** | • Comprehensive statistical analysis package. • Open source;\
    \ anyone can use it. • It is cross-platform and can run on many operating systems.\
    \ • Anyone can fix bugs and make code enhancements. | • Python is a general-purpose\
    \ language that is easy and intuitive. • Useful for mathematical computation.\
    \ • Can share data online via clouds and IDEs such as Jupyter Notebook. • Can\
    \ be deployed. • Fast processing. • High code readability. • Supports multiple\
    \ systems and platforms. • Easy integration with other languages such as C and\
    \ Java. |\n| **Disadvantages** | • Quality of some packages is not good. • R can\
    \ consume all the memory because of its memory management. • Slow and high learning\
    \ curve. • Dependencies between library. • There is no regular and direct update\
    \ for R packages and bugs. | • Comparatively smaller pool of Python developers.\
    \ • Python doesn’t have as many libraries as R. • Not good for mobile development.\
    \ • Database access limitations. |\n\n## Introducing Data Visualization Techniques\n\
    \nData visualization aims to understand data by extracting and graphing information\
    \ to show patterns, spot trends, and identify outliers. There are two basic types\
    \ of data visualization.\n\n* *Exploration* helps to extract information from\
    \ the collected data.\n* *Explanation* demonstrates the extracted information.\n\
    \nThere are many types of 2D data visualizations, such as temporal, multidimensional,\
    \ hierarchical, and network. In the following section, we demonstrate numerous\
    \ data visualization techniques provided by the `Python` programming language.\n\
    \n### Loading Libraries\n\nSome libraries are bundled with `Python`, while others\
    \ should be directly downloaded and installed.\n\nFor instance, you can install\
    \ `Matplotlib` using `pip` as follows:\n\n```\npython -m pip install -U pip setuptools\n\
    python -m pip install matplotlib\n```\n\nYou can install, search, or update `Python`\
    \ packages with `Jupyter Notebook` or with a desktop `Python` IDE such as `Spyder`.\
    \ Table [2-2](#472943_1_En_2_Chapter.xhtml#Tab2) shows how to use the `pip` and\
    \ `conda` commands.\n\nTable 2-2  \nInstalling and Upgrading Python Packages\n\
    \n| Description | pip | conda Anaconda |\n| --- | --- | --- |\n| Works with |\
    \ Python and Anaconda | Anaconda only |\n| Search a package | `pip search matplolib`\
    \ | `conda search matplolib` |\n| Install a package | `pip install matplolib`\
    \ | `conda install matplolib` |\n| Upgrade a package | `pip install matplolib-upgrade`\
    \ | `conda install matplolib-upgrade` |\n| Display installed packages | `pip list`\
    \ | `conda list` |\n\nLet’s list all the installed or upgraded `Python` libraries\
    \ using the `pip` and `conda` commands.\n\n```\nconda list\npip list\n```\n\n\
    Similarly, you can install or upgrade packages or specific `Python` packages such\
    \ as `Matplotlib` on `Jupyter Notebooks`, as shown in Listing [2-1](#472943_1_En_2_Chapter.xhtml#PC3).\n\
    \n```\nIn [5]: try:\nimport matplotlib\nexcept:\nimport pip pip.main(['install',\
    \ 'matplotlib'])\nimport matplotlib\nListing 2-1\nInstalled or Upgraded Packages\n\
    ```\n\nIt is possible to import any library and use alias names, as shown here:\n\
    \n```\nIn [ ]:import matplotlib.pyplot as plt import numpy as np\nimport pandas\
    \ as pd\nimport seaborn as sns\nimport pygal from mayavi\nimport mlab\netc....\n\
    ```\n\nOnce you load any library to your `Python` script, then you can call the\
    \ package functions and attributes.\n\n### Popular Libraries for Data Visualization\
    \ in Python\n\nThe `Python` language provides numerous data visualization libraries\
    \ for plotting data. The most used and common data visualization libraries are\
    \ `Pygal`, `Altair`, `VisPy`, `PyQtGraph`, `Matplotlib`, `Bokeh`, `Seaborn`, `Plotly`,\
    \ and `ggplot`, as shown in Figure [2-1](#472943_1_En_2_Chapter.xhtml#Fig1).\n\
    \n![../images/472943_1_En_2_Chapter/472943_1_En_2_Fig1_HTML.png](images/472943_1_En_2_Chapter/472943_1_En_2_Fig1_HTML.png)\n\
    \nFigure 2-1  \nData visualization libraries\n\nEach of these libraries has its\
    \ own features. Some of these libraries may be adopted for implementation and\
    \ dependent on other libraries. For example, `Seaborn` is a statistical data visualization\
    \ library that uses `Matplotlib`. In addition, it needs `Pandas` and maybe `NumPy`\
    \ for statistical processing before visualizing data.\n\n#### Matplotlib\n\n`Matplotlib`\
    \ is a `Python` 2D plotting library for data visualization built on `Numpy` arrays\
    \ and designed to work with the broader `SciPy` stack. It produces publication-quality\
    \ figures in a variety of formats and interactive environments across platforms.\
