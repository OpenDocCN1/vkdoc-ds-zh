    ### Indexing, Slicing, and Matrices


    Lists are a sequence of indexed elements that can be accessed forward or backward.
    Therefore, you can read their elements using a positive index or negative (backward)
    index, as shown in Listing [3-6](#472943_1_En_3_Chapter.xhtml#PC6).


    ```

    In [9]:list1 = [''Egypt'', ''chemistry'', 2017, 2018]

    list2 = [1, 2, 3, [4, 5]]

    list3 = ["a", 3.7, ''330'', "Omar"]

    print (list1[2])

    print (list2 [3:])

    print (list3 [-3:-1])

