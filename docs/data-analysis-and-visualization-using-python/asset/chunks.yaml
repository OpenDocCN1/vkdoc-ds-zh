    ### 更新和访问数据框的列选择


    你可以使用列标签选择特定的列。例如，`df1[''Test2'']` 用于仅选择数据框中标签为 `Test2` 的列，而 `df1[:]` 用于显示所有列和所有行，如代码清单
    6-13 所示。


    ```

    In [51]: import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    df1 = pd.DataFrame(data)

    print (df1[''Test2'']) # 列选择

    print("\n")

    print (df1[:]) # 列选择

    Ahmed     56

    Ali       77

    Omar      82

    Salwa     65

    Name: Test2, dtype: int64

    Test1       Test2

    Ahmed     70.0        56

    Ali       89.0        77

    Omar      55.0        82

    Salwa     NaN         65

    代码清单 6-13

    数据框列选择

    ```


    你可以使用列标签或列索引来选择列。`df1.iloc[:, [1,0]]` 用于显示列 1 和列 0 的所有行，从列 1 开始，它指的是名为 `Test2`
    的列。此外，`df1[0:4:1]` 用于显示从第 0 行到第 3 行（步长为 1）的所有行，即给出从 0 到 3 的所有行。参见代码清单 6-14。


    ```

    In [46]: df1.iloc[:, [1,0 ]]

    Out[46]:             Test2   Test1

    Ahmed       56      70.0

