    ## Python String Functions and Methods


    Numerous built-in methods and functions can be used for string processing; Table
    [1-14](#472943_1_En_1_Chapter.xhtml#Tab14) lists these methods.


    **Table 1-14** Built-in String Methods


    | Method/Function | Description |

    | --- | --- |

    | `capitalize()` | Capitalizes the first character of the string. |

    | `count(string,begin,end)` | Counts a number of times a substring occurs in a
    string between the beginning and end indices. |

    | `endswith(suffix, begin=0,end=n)` | Returns a Boolean value if the string terminates
    with a given suffix between the beginning and end. |

    | `find(substring, beginIndex, endIndex)` | Returns the index value of the string
    where the substring is found between the begin index and the end index. |

    | `index(subsring, beginIndex, endIndex)` | Throws an exception if the string
    is not found and works same as the `find()` method. |

    | `isalnum()` | Returns true if the characters in the string are alphanumeric
    (i.e., letters or numbers) and there is at least one character. Otherwise, returns
    false. |

    | `isalpha()` | Returns true when all the characters are letters and there is
    at least one character; otherwise, false. |

    | `isdigit()` | Returns true if all the characters are digits and there is at
    least one character; otherwise, false. |

    | `islower()` | Returns true if the characters of a string are in lowercase; otherwise,
    false. |

    | `isupper()` | Returns false if the characters of a string are in uppercase;
    otherwise, false. |

    | `isspace()` | Returns true if the characters of a string are white space; otherwise,
    false. |

    | `len(string)` | Returns the length of a string. |

    | `lower()` | Converts all the characters of a string to lowercase. |

    | `upper()` | Converts all the characters of a string to uppercase. |

    | `startswith(str,begin=0,end=n)` | Returns a Boolean value if the string starts
    with the given `str` between the beginning and end. |

    | `swapcase()` | Inverts the case of all characters in a string. |

    | `lstrip()` | Removes all leading white space of a string and can also be used
    to remove a particular character from leading white spaces. |

    | `rstrip()` | Removes all trailing white space of a string and can also be used
    to remove a particular character from trailing white spaces. |


    Listing [1-26](#472943_1_En_1_Chapter.xhtml#PC34) shows how to use built-in methods
    to remove white space from a string, count specific letters within a string, check
    whether the string contains another string, and so on.


    ```

    In [29]:var1 ='' Higher Colleges of Technology ''

    var2=''College''

    var3=''g''

    print (var1.upper())

    print (var1.lower())

    print (''WELCOME TO''.lower())

    print (len(var1))

    print (var1.count(var3, 2, 29) ) # find how many g letters in var1

    print ( var2.count(var3) )

    HIGHER COLLEGES OF TECHNOLOGY

    higher colleges of technology

    welcome to


    In [33]:print (var1.endswith(''r''))

    print (var1.startswith(''O''))

    print (var1.find(''h'', 0, 29))

    print (var1.lstrip()) # It removes all leading whitespace of a string in var1

    print (var1.rstrip()) # It removes all trailing whitespace of a string in var1

    print (var1.strip()) # It removes all leading and trailing whitespace

    print (''\n'')

    print (var1.replace(''Colleges'', ''University''))

    False

    False


    Higher Colleges of Technology

    Higher Colleges of Technology

    Higher Colleges of Technology

    Higher University of Technology

    Listing 1-26

    Implementing String Methods

    ```


    ## The `in` Operator


    The word `in` is a Boolean operator that takes two strings and returns true if
    the first appears as a substring in the second, as shown in Listing [1-27](#472943_1_En_1_Chapter.xhtml#PC35).


    ```

    In [43]:var1 ='' Higher Colleges of Technology ''

    var2=''College''

    var3=''g''

    print ( var2 in var1)

    print ( var2 not in var1)

    True

    False

    Listing 1-27

    The in Method in String Processing

    ```


    ## Parsing and Extracting Strings


    The `find` operator returns the index of the first occurrence of a substring in
    another string, as shown in Listing [1-28](#472943_1_En_1_Chapter.xhtml#PC36).
    The `atpost` variable is used to maintain a returned index of the substring `@`
    as it appears in the `Maindata` string variable.


    ```

    In [39]:# Parsing and Extracting strings

    Maindata = ''From ossama.embarak@hct.ac.ae Sunday Jan 4 09:30:50 2017'' atpost
    = Maindata.find(''@'')

    print ("\n>>>>>>>>>>>>")

    print (atpost)

    print (Maindata[ :atpost])

    data = Maindata[ :atpost]

    name=data.split('' '')

    print (name)

    print (name[1].replace(''.'', '' '').upper())

    print ("\n>>>>>>>>>>>>")

    >>>>>>>>>>>>


    From ossama.embarak

    [''From'', ''ossama.embarak'']

    OSSAMA EMBARAK

    >>>>>>>>>>>>

    In [41]:# Another way to split strings

    Maindata = ''From ossama.embarak@hct.ac.ae Sunday Jan 4 09:30:50 2017''

    name= Maindata[ :atpost].replace(''From'','''').upper()

    print (name.replace(''.'','' '').upper().lstrip())

    print ("\n>>>>>>>>>>>>")

    sppos=Maindata.find('' '', atpost)

    print (sppos)

    print (Maindata[ :sppos])

    host = Maindata [atpost + 1 : sppos ]

    print (host)

    print ("\n>>>>>>>>>>>>")

    OSSAMA EMBARAK

    >>>>>>>>>>>>


    From ossama.embarak@hct.ac.ae

    hct.ac.ae

    >>>>>>>>>>>>

    Listing 1-28

    Parsing and Extracting Strings

    ```'
