- fmt: '# Tabular Data and Data Formats


    Data is available in different forms. It can be unstructured data, semistructured
    data, or structured data. Python provides different structures to maintain data
    and to manipulate it such as variables, lists, dictionaries, tuples, series, panels,
    and data frames. Tabular data can be easily represented in Python using lists
    of tuples representing the records of the data set in a data frame structure.
    Though easy to create, these kinds of representations typically do not enable
    important tabular data manipulations, such as efficient column selection, matrix
    mathematics, or spreadsheet-style operations. `Tabular` is a package of Python
    modules for working with tabular data. Its main object is the `tabarray` class,
    which is a data structure for holding and manipulating tabular data. You can put
    data into a `tabarray` object for more flexible and powerful data processing.
    The Pandas library also provides rich data structures and functions designed to
    make working with structured data fast, easy, and expressive. In addition, it
    provides a powerful and productive data analysis environment.


    A Pandas data frame can be created using the following constructor:


    ```

    pandas.DataFrame( data, index, columns, dtype, copy)

    ```


    A Pandas data frame can be created using various input forms such as the following:


    * List

    * Dictionary

    * Series

    * Numpy ndarrays

    * Another data frame


    Chapter [3](#472943_1_En_3_Chapter.xhtml) will demonstrate the creation and manipulation
    of the data frame structure in detail.


    ## Python Pandas Data Science Library


    Pandas is an open source Python library providing high-performance data manipulation
    and analysis tools via its powerful data structures. The name Pandas is derived
    from “panel data,” an econometrics term from multidimensional data. The following
    are the key features of the Pandas library:


    * Provides a mechanism to load data objects from different formats

    * Creates efficient data frame objects with default and customized indexing

    * Reshapes and pivots date sets

    * Provides efficient mechanisms to handle missing data

    * Merges, groups by, aggregates, and transforms data

    * Manipulates large data sets by implementing various functionalities such as
    slicing, indexing, subsetting, deletion, and insertion

    * Provides efficient time series functionality


    Sometimes you have to import the Pandas package since the standard Python distribution
    doesn’t come bundled with the Pandas module. A lightweight alternative is to install
    Numpy using popular the Python package installer `pip`. The Pandas library is
    used to create and process series, data frames, and panels.


    ### A Pandas Series


    A *series* is a one-dimensional labeled array capable of holding data of any type
    (integer, string, float, Python objects, etc.). Listing [1-29](#472943_1_En_1_Chapter.xhtml#PC38)
    shows how to create a series using the Pandas library.


    ```

    In [34]:#Create series from array using pandas and numpy

    import pandas as pd

    import numpy as np

    data = np.array([90,75,50,66])

    s = pd.Series(data,index=[''A'',''B'',''C'',''D''])

    print (s)

    A 90

    B 75

    C 50

    D 66

    dtype: int64

    In [36]:print (s[1])


    In [37]:#Create series from dictionary using pandas

    import pandas as pd

    import numpy as np

    data = {''Ahmed'' : 92, ''Ali'' : 55, ''Omar'' : 83}

    s = pd.Series(data,index=[''Ali'',''Ahmed'',''Omar''])

    print (s)

    Ali 55

    Ahmed 92

    Omar 83

    dtype: int64

    In [38]:print (s[1:])

    Ahmed 92

    Omar 83

    dtype: int64

    Listing 1-29

    Creating a Series Using the Pandas Library

    ```


    ### A Pandas Data Frame


    A *data frame* is a two-dimensional data structure. In other words, data is aligned
    in a tabular fashion in rows and columns. In the following table, you have two
    columns and three rows of data. Listing [1-30](#472943_1_En_1_Chapter.xhtml#PC39)
    shows how to create a data frame using the Pandas library.


    | Name | Age |

    | --- | --- |

    | Ahmed | 35 |

    | Ali | 17 |

    | Omar | 25 |


    ```

    In [39]:import pandas as pd

    data = [[''Ahmed'',35],[''Ali'',17],[''Omar'',25]]

    DataFrame1 = pd.DataFrame(data,columns=[''Name'',''Age''])

    print (DataFrame1)

    Name   Age

    0  Ahmed  35

    1  Ali    17

    2  Omar   25

    Listing 1-30

    Creating a Data Frame Using the Pandas Library

    ```


    You can retrieve data from a data frame starting from index 1 up to the end of
    rows.


    ```

    In [40]: DataFrame1[1:]

    Out[40]:     Name   Age

    1   Ali    17

    2   Omar   25

    ```


    You can create a data frame using a dictionary.


    ```

    In [41]:import pandas as pd

    data = {''Name'':[''Ahmed'', ''Ali'', ''Omar'', ''Salwa''],''Age'':[35,17,25,30]}

    dataframe2 = pd.DataFrame(data, index=[100, 101, 102, 103])

    print (dataframe2)

    Age    Name

    100   35     Ahmed

    101   17     Ali

    102   25     Omar

    103   30     Salwa

    ```


    You can select only the first two rows in a data frame.


    ```

    In [42]: dataframe2[:2]

    Out[42]:     Age   Name

    100   35    Ahmed

    101   17    Ali

    ```


    You can select only the `name` column in a data frame.


    ```

    In [43]: dataframe2[''Name'']

    Out[43]:100         Ahmed

    101    Ali

    102    Omar

    103    Salwa

    Name: Name, dtype: object

    ```


    ### A Pandas Panels


    A *panel* is a 3D container of data that can be created from different data structures
    such as from a dictionary of data frames, as shown in Listing [1-31](#472943_1_En_1_Chapter.xhtml#PC44).


    ```

    In [44]:# Creating a panel

    import pandas as pd

    import numpy as np

    data = {''Temperature Day1'' : pd.DataFrame(np.random.randn(4, 3)),''Temperature
    Day2'' : pd.DataFrame(np.random.randn(4, 2))}

    p = pd.Panel(data)

    print (p[''Temperature Day1''])

    0        1          2

    0   1.152400    -1.298529   1.440522

    1   -1.404988   -0.105308   -0.192273

    2   -0.575023   -0.424549   0.146086

    3   -1.347784   1.153291   -0.131740

    Listing 1-31

    Creating a Panel Using the Pandas Library

    ```


    ## Python Lambdas and the Numpy Library


    The lambda operator is a way to create small anonymous functions, in other words,
    functions without names. These functions are throwaway functions; they are just
    needed where they have been created. The lambda feature is useful mainly for Lisp
    programmers. Lambda functions are used in combination with the functions `filter()`,
    `map()`, and `reduce()`.


    *Anonymous* functions refer to functions that aren’t named and are created by
    using the keyword `lambda`. A lambda is created without using the `def` keyword;
    it takes any number of arguments and returns an evaluated expression, as shown
    in Listing [1-32](#472943_1_En_1_Chapter.xhtml#PC45).


    ```

    In [34]:# Anonymous Function Definition

    summation=lambda val1, val2: val1 + val2#Call summation as a function

    print ("The summation of 7 + 10 = ", summation(7,10) )

    The summation of 7 + 10 = 17

    In [46]:result = lambda x, y : x * y

    result(2,5)

    Out[46]: 10

    In [47]:result(4,10)

    Out[47]: 40

    Listing 1-32

    Anonymous Function

    ```


    ### The map() Function


    The `map()` function is used to apply a specific function on a sequence of data.
    The `map()` function has two arguments.


    ```

    r = map(func, seq)

    ```


    Here, `func` is the name of a function to apply, and `seq` is the sequence (e.g.,
    a list) that applies the function `func` to all the elements of the sequence `seq`.
    It returns a new list with the elements changed by `func`, as shown in Listing
    [1-33](#472943_1_En_1_Chapter.xhtml#PC47).


    ```

    In [65]:def fahrenheit(T):

    return ((float(9)/5)*T + 32)

    def celsius(T):

    return (float(5)/9)*(T-32)

    Temp = (15.8, 25, 30.5,25)

    F = list ( map(fahrenheit, Temp))

    C = list ( map(celsius, F))

    print (F)

    print (C)

    [60.44, 77.0, 86.9, 77.0]

    [15.799999999999999, 25.0, 30.500000000000004, 25.0]

    In [72]:Celsius = [39.2, 36.5, 37.3, 37.8]

    Fahrenheit = map(lambda x: (float(9)/5)*x + 32, Celsius)

    for x in Fahrenheit:

    print(x)

    102.56

    97.7

    99.14

    100.03999999999999

    Listing 1-33

    Using the map() Function

    ```'
