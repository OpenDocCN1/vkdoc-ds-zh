- fmt: '# Running Basic Inferential Analyses


    Python provides numerous libraries for inference and statistical analysis such
    as `Pandas`, `SciPy`, and `Numpy`. Python is an efficient tool for implementing
    numerous statistical data analysis operations such as the following:


    - Linear regression

    - Finding correlation

    - Measuring central tendency

    - Measuring variance

    - Normal distribution

    - Binomial distribution

    - Poisson distribution

    - Bernoulli distribution

    - Calculating p-value

    - Implementing a Chi-square test


    Linear regression between two variables represents a straight line when plotted
    as a graph, where the exponent (power) of both of the variables is 1. A nonlinear
    relationship where the exponent of any variable is not equal to 1 creates a curve
    shape.


    Let’s use the built-in Tips data set available in the `Seaborn` Python library
    to find linear regression between a restaurant customer’s total bill value and
    each bill’s tip value, as shown in Figure [1-9](#472943_1_En_1_Chapter.xhtml#Fig9).
    The function in `Seaborn` to find the linear regression relationship is `regplot`.


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig9_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig9_HTML.jpg)


    Figure 1-9: Regression analysis


    ```

    In [40]:import seaborn as sb

    from matplotlib import pyplot as plt

    df = sb.load_dataset(''tips'')

    sb.regplot(x = "total_bill", y = "tip", data = df)

    plt.xlabel(''Total Bill'')

    plt.ylabel(''Bill Tips'')

    plt.show()

    ```


    *Correlation* refers to some statistical relationship involving dependence between
    two data sets, such as the correlation between the price of a product and its
    sales volume.


    Let’s use the built-in Iris data set available in the `Seaborn` Python library
    and try to measure the correlation between the length and the width of the sepals
    and petals of three species of iris, as shown in Figure [1-10](#472943_1_En_1_Chapter.xhtml#Fig10).


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig10_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig10_HTML.jpg)


    Figure 1-10: Correlation analysis


    ```

    In [42]: import matplotlib.pyplot as plt

    import seaborn as sns

    df = sns.load_dataset(''iris'')

    sns.pairplot(df, kind="scatter")

    plt.show()

    ```


    In statistics, *variance* is a measure of how dispersed the values are from the
    mean value. Standard deviation is the square root of variance. In other words,
    it is the average of the squared difference of values in a data set from the mean
    value. In Python, you can calculate this value by using the function `std()` from
    the `Pandas` library.


    ```

    In [58]: import pandas as pd

    d = {

    ''Name'': pd.Series([''Ahmed'',''Omar'',''Ali'',''Salwa'',''Majid'',

    ''Othman'',''Gameel'',''Ziad'',''Ahlam'',''Zahrah'',

    ''Ayman'',''Alaa'']),

    ''Age'': pd.Series([34,26,25,27,30,54,23,43,40,30,28,46]),

    ''Height'':pd.Series([114.23,173.24,153.98,172.0,153.20,164.6,

    183.8,163.78,172.0,164.8 ])}

    df = pd.DataFrame(d) #Create a DataFrame

    print (df.std())# Calculate and print the standard deviation

    Age     9.740574

    Height 18.552823

    Out[46]: [Text(0,0.5,''Frequency''), Text(0.5,0,''Binomial'')]

    ```


    You can use the `describe()` method to find the full description of a data frame
    set, as shown here:


    ```

    In [59]: print (df.describe())

    Age Height

    count 12.000000 12.000000

    mean 33.833333 164.448333

    std 9.740574 18.552823

    min 23.000000 114.230000

    25% 26.750000 161.330000

    50% 30.000000 168.400000

    75% 40.750000 173.455000

    max 54.000000 183.800000

    ```


    *Central tendency* measures the distribution of the location of values of a data
    set. It gives you an idea of the average value of the data in the data set and
    an indication of how widely the values are spread in the data set.


    The following example finds the mean, median, and mode values of the previously
    created data frame:


    ```

    In [60]: print ("Mean Values in the Distribution")

    print (df.mean())

    print ("*******************************")

    print ("Median Values in the Distribution")

    print (df.median())

    print ("*******************************")

    print ("Mode Values in the Distribution")

    print (df[''Height''].mode())

    Mean Values in the Distribution

    Age 33.833333

    Height    164.448333

    dtype: float64

    *******************************

    Median Values in the Distribution

    Age 30.0

    Height    168.4

    dtype: float64

    *******************************

    Mode Values of height in the Distribution

    0     172.0

    dtype: float64

    ```


    ## Summary


    This chapter introduced the data science field and the use of Python programming
    for implementation. Let’s recap what was covered in this chapter.


    - The data science main concepts and life cycle

    - The importance of Python programming and its main libraries used for data science
    processing

    - Different Python data structure use in data science applications

    - How to apply basic Python programming techniques

    - Initial implementation of abstract series and data frames as the main Python
    data structure

    - Data cleaning and its manipulation techniques

    - Running basic inferential statistical analyses


    The next chapter will cover the importance of data visualization in business intelligence
    and much more.'
