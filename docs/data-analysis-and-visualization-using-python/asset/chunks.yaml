    ### 变量名与关键字


    *变量*是一个标识符，用于分配特定的内存空间并赋予一个在程序运行期间可能改变的值。变量名应能体现变量的用途，例如，如果你想为学生的年龄创建一个变量，可以将其命名为
    `age` 或 `student_age`。变量名有许多规则和限制。变量命名中不允许使用特殊字符或空格。例如，变量名不能以任何特殊字符开头，也不能是 Python
    的保留关键字。以下示例展示了错误的命名：`{?age, 1age, age student, and, if, 1_age, etc}`。以下展示了正确的变量命名：`{age,
    age1, age_1, if_age, etc}`。


    ### 语句与表达式


    *语句*是可由 Python 解释器执行以获取特定结果或执行特定任务的任何代码单元。程序包含一系列语句，每条语句在程序执行期间都有特定目的。*表达式*是值、变量和运算符的组合，由解释器求值以执行特定任务，如代码清单
    1-10 所示。


    ```

    In [16]:# 表达式

    x=0.6              # 语句

    x=3.9 * x * (1-x)  # 表达式

    print (round(x, 2))

    0.94

    代码清单 1-10

    表达式和语句形式

    ```


    ## Python 中的基本运算符


    运算符是可以操作操作数值的构造。与不同的编程语言一样，Python 支持以下运算符：


    *   算术运算符

    *   关系运算符

    *   赋值运算符

    *   逻辑运算符

    *   成员运算符

    *   身份运算符

    *   位运算符


    ### 算术运算符


    表 1-2 展示了 Python 中算术运算符的示例。


    **表 1-2** Python 算术运算符


    | 运算符 | 描述 | 示例 | 输出 |

    | --- | --- | --- | --- |

    | `//` | 执行整除（返回除法后的整数值） | `print (13//5)` | 2 |

    | `+` | 执行加法 | `print (13+5)` | 18 |

    | `-` | 执行减法 | `print (13-5)` | 8 |

    | `*` | 执行乘法 | `print (2*5)` | 10 |

    | `/` | 执行除法 | `print (13/5)` | 2.6 |

    | `%` | 返回除法后的余数（取模） | `print (13%5)` | 3 |

    | `**` | 返回幂运算结果（乘方） | `print (2**3)` | 8 |


    ### 关系运算符


    表 1-3 展示了 Python 中关系运算符的示例。


    **表 1-3** Python 关系运算符


    | 运算符 | 描述 | 示例 | 输出 |

    | --- | --- | --- | --- |

    | `<` | 小于 | `print (13<5)` | False |

    | `>` | 大于 | `print (13>5)` | True |

    | `<=` | 小于或等于 | `print (13<=5)` | False |

    | `>=` | 大于或等于 | `print (2>=5)` | False |

    | `==` | 等于 | `print (13==5)` | False |

    | `!=` | 不等于 | `print (13! =5)` | True |


    ### 赋值运算符


    表 1-4 展示了 Python 中赋值运算符的示例。


    **表 1-4** Python 赋值运算符


    | 运算符 | 描述 | 示例 | 输出 |

    | --- | --- | --- | --- |

    | `=` | 赋值 | `x=10` `print (x)` | 10 |

    | `/=` | 除后赋值 | `x=10; x/=2` `print (x)` | 5.0 |

    | `+=` | 加后赋值 | `x=10; x+=7` `print (x)` | 17 |

    | `-=` | 减后赋值 | `x=10; x-=6` `print (x)` | 4 |

    | `*=` | 乘后赋值 | `x=10; x*=5` `print (x)` | 50 |

    | `%=` | 取模后赋值 | `x=13; x%=5` `print (x)` | 3 |

    | `**=` | 幂运算后赋值 | `x=10; x**=3` `print(x)` | 1000 |

    | `//=` | 整除后赋值 | `x=10; x//=2` `print(x)` | 5 |


    ### 逻辑运算符


    表 1-5 展示了 Python 中逻辑运算符的示例。


    **表 1-5** Python 逻辑运算符


    | 运算符 | 描述 | 示例 | 输出 |

    | --- | --- | --- | --- |

    | `and` | 逻辑与（当两个条件都为真时，输出为真） | `x=10>5 and 4>20` `print (x)` | False |

    | `or` | 逻辑或（如果任一条件为真，输出即为真） | `x=10>5 or 4>20` `print (x)` | True |

    | `not` | 逻辑非（对条件取反，即反转结果） | `x=not (10<4)` `print (x)` | True |


    一个 Python *程序* 是一系列旨在完成某项任务的 Python 语句序列。它可以是一行代码，也可以是数千行代码段，由计算机执行以完成特定任务。Python
    语句会立即执行，而不会等待整个程序执行完毕。因此，Python 是一种逐行执行的解释型语言。这与其他语言（如 C#）不同，C# 是一种需要处理整个程序的编译型语言。

