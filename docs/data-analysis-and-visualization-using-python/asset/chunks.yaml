    ## Panel Data Structures


    As mentioned earlier, a *panel* is a three-dimensional data structure like a three-dimensional
    array.


    ## Creating a Panel


    Pandas creates a panel using the constructor `pandas.Panel(data, items, major_axis,
    minor_axis, dtype, copy)`. The panel can be created from a dictionary of data
    frames and narrays. The data can take various forms, such as ndarray, series,
    map, lists, dictionaries, constants, and also another data frames.


    The following Python script creates an empty panel:


    ```

    #creating an empty panel

    import pandas as pd

    p = pd.Panel ()

    ```


    Listing [6-27](#472943_1_En_6_Chapter.xhtml#PC36) creates a panel with three dimensions.


    ```

    In [143]: # creating an empty panel

    import pandas as pd

    import numpy as np

    data = np.random.rand(2,4,5)

    Paneldf = pd.Panel(data)

    print (Paneldf)

    Listing 6-27

    Creating a Panel with Three Dimensions

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figq_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figq_HTML.jpg)


    ## Accessing Data from a Panel with a Position


    Listing [6-28](#472943_1_En_6_Chapter.xhtml#PC37) creates a panel and fills it
    with random data, where the first item in the panel is a 4x3 array and the second
    item is a 4x2 array of random values. For the `Item2` column, two values are NaN
    since its dimension is 4x2. You can also access data from a panel using item labels,
    as shown in Listing [6-28](#472943_1_En_6_Chapter.xhtml#PC37).


    ```

    In [147]: # creating an empty panel

    import pandas as pd

    import numpy as np

    data = {''Item1'' : pd.DataFrame(np.random.randn(4, 3)),

    ''Item2'' : pd.DataFrame(np.random.randn(4, 2))}

    Paneldf = pd.Panel(data)

    print (Paneldf[''Item1''])

    print ("\n")

    print (Paneldf[''Item2''])

    Listing 6-28

    Selecting and Displaying Panel Items

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figr_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figr_HTML.jpg)


    Python displays the panel items in a data frame with two dimensions, as shown
    previously. Data can be accessed using the method `panel.major_axis(index)` and
    also using the method `panel.minor_axis(index)`. See Listing [6-29](#472943_1_En_6_Chapter.xhtml#PC38).


    ```

    In [149]: print (Paneldf.major_xs(1))

    Listing 6-29

    Selecting and Displaying a Panel with Major and Minor Dimensions

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figs_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figs_HTML.jpg)


    ```

    In [150]: print (Paneldf.minor_xs(1))

    ```


