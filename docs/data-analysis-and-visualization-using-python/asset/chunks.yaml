    ''Ali'',

    ''Height'' : pd.Series([160, 154, 175, 165], index=[''Ahmed'', ''Omar'', ''Ali'',
    ''Salwa''

    ''Weight'' : pd.Series([85, 70, 92, 65], index=[''Ahmed'', ''Omar'', ''Ali'',
    ''Salwa'']),

    ''Gender'' : pd.Series([''Male'', ''Male'', ''Male'', ''Female''], index=[''Ahmed'',
    ''Omar'',

    data = pd.DataFrame(data)

    print (data)

    print("\n")

    df2 = pd.DataFrame([[42, 31000, 170, 80, ''Female'']], columns =[''Age'',''Salary'',''Height''

    , index=[''Mona''])

    data = data.append(df2)

    print (data)

