    `Seaborn` is a Python data visualization library based on `Matplotlib` that provides
    a high-level interface for drawing attractive and informative statistical graphics
    (see Listing [2-4](#472943_1_En_2_Chapter.xhtml#PC7)).


    ```

    In [34]: import matplotlib.pyplot as plt

    %matplotlib inline

    import numpy as np

    import pandas as pd

    import seaborn as sns

    plt.style.use(''classic'')

    plt.style.use(''seaborn-whitegrid'')

    # Create some data

    data = np.random.multivariate_normal([0, 0], [[5, 2], [2, 2]], size=2000)

    data = pd.DataFrame(data, columns=[''x'', ''y''])

    # Plot the data with seaborn

    sns.distplot(data[''x''])

    sns.distplot(data[''y'']);

