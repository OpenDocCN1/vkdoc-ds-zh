    在前面的示例中，第一个和第二个迭代使用了带有 `range` 语句的 `for` 循环。在最后一个示例中，迭代遍历一个元素列表，并在到达被迭代列表的最后一个元素时停止。


    `break` 语句用于跳出语句并转移执行控制。它会中断当前执行，如果是内层循环，则内层循环会立即终止。而 `continue` 语句是一种跳转语句，它会跳过当前迭代的执行。跳过之后，循环会继续执行下一次迭代。`pass`
