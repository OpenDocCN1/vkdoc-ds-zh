    \n#### 字符串特殊运算符\n\n表 1-12 列出了字符串处理中使用的运算符。假设你有两个变量 `a = 'Hello'` 和 `b = 'Python'`。那么你可以实现表\
    \ 1-12 中所示的操作。\n\n**表 1-12**  \n字符串运算符\n\n| 运算符 | 描述 | 输出 |\n| --- | --- | ---\
    \ |\n| `+` | 连接：将运算符两侧的值相加 | `a + b` 将得到 `HelloPython`。 |\n| `*` | 重复：创建新字符串，连接同一字符串的多个副本\
    \ | `a*2` 将得到 `-HelloHello`。 |\n| `[]` | 切片：返回给定索引处的字符 | `a[1]` 将得到 `e`。 |\n|\
    \ `[ : ]` | 范围切片：返回给定范围内的字符 | `a[1:4]` 将得到 `ell`。 |\n| `in` | 成员资格：如果字符存在于给定字符串中，则返回\
    \ true | `H in a` 将返回 true。 |\n| `not in` | 成员资格：如果字符不存在于给定字符串中，则返回 true | `M\
    \ not in a` 将返回 true。 |\n\n使用运算符 `%` 进行字符串格式化时会用到各种符号。表 1-13 给出了一些简单的示例。\n\n**表\
    \ 1-13**  \n字符串格式符号\n\n| 格式符号 | 转换 |\n| --- | --- |\n| `%c` | 字符 |\n| `%s` | 格式化前通过\
    \ `str()` 进行字符串转换 |\n| `%i` | 有符号十进制整数 |\n| `%d` | 有符号十进制整数 |\n| `%u` | 无符号十进制整数\
    \ |\n| `%o` | 八进制整数 |\n| `%x` | 十六进制整数（小写字母） |\n| `%X` | 十六进制整数（大写字母） |\n| `%e`\
    \ | 指数表示法（使用小写 `e`） |\n| `%E` | 指数表示法（使用大写 `E`） |\n| `%f` | 浮点实数 |\n| `%g` | `%f`\
    \ 和 `%e` 中较短的形式 |\n| `%G` | `%f` 和 `%E` 中较短的形式 |\n\n#### 字符串切片与连接\n\n*字符串切片*指的是使用索引或搜索方法从字符串中提取的一段。此外，`len()`\
    \ 方法是一个内置函数，用于返回字符串中的字符数。连接使你能够将多个字符串连接在一起形成另一个字符串。\n\n运算符 `[n:m]` 返回字符串中从第 *n*\
    \ 个字符到第 *m* 个字符的部分，包括第一个但不包括最后一个。如果省略第一个索引（冒号之前），切片将从字符串的开头开始。同样，如果省略第二个索引，切片将一直进行到字符串的末尾。清单\
    \ 1-22 中的示例展示了使用 `+` 运算符进行字符串切片和连接。\n\n```\nIn [3]:var1 = 'Welcome to Dubai'\n\
    var2 = \"Python Programming\"\nprint (\"var1[0]:\", var1[0])\nprint (\"var2[1:5]:\"\
    , var2[1:5])\nvar1[0]: W\nvar2[1:5]: ytho\nIn [5]:st1=\"Hello\"\nst2=' World'\n\
    fullst=st1 + st2\nprint (fullst)\nHello World\nIn [11]:# looking inside strings\n\
    fruit = 'banana'\nletter= fruit[1]\nprint (letter)\nindex=3\nw = fruit[index-1]\n\
    print (w)\nprint (len(fruit))\na\nn\n\nListing 1-22\nString Slicing and Concatenation\n\
    ```\n\n#### 字符串转换与格式符号\n\n如果字符串值适用于转换，则可以将其转换为浮点数、双精度数或整数，如清单 1-23 所示。\n\n```\n\
    In [14]:#Convert string to int\nstr3 = '123'\nstr3= int (str3)+1\nprint (str3)\n\
    \nIn [15]:#Read and convert data\nname=input('Enter your name: ')\nage=input('Enter\
    \ your age: ')\nage= int(age) + 1\nprint (\"Name: %s\"% name ,\"\\t Age:%d\"%\
    \ age)\nEnter your name: Omar\nEnter your age: 41\nName: Omar    Age:42\nListing\
    \ 1-23\nString Conversion and Format Symbols\n```\n"
