    # 7. 数据可视化


    Python 提供了多种数据可视化方法。多种 Python 库可用于数据可视化，例如 Pandas、Seaborn、Bokeh、Pygal 和 Ploty。Python
    Pandas 是进行基本绘图的最简单方法。Python Seaborn 非常适合创建包含颜色的、视觉上吸引人的统计图表。Python Bokeh 适用于更复杂的可视化，尤其是基于
    Web 的交互式演示。Python Pygal 在生成矢量文件和交互式文件方面表现出色，但其灵活性不如其他方法。Python Plotly 是创建高度交互式基于
    Web 的可视化最有用且最简单的选择。


    条形图是一种重要的可视化工具，用于比较不同类别中的值。通过调整 x 轴和 y 轴，条形图可以垂直或水平定向，具体取决于图表需要呈现的信息或类别类型。本章演示了各种可视化工具的使用和实现；本章将使用图
    7-1 中所示的 `salaries.csv` 文件作为绘图数据集。


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Fig1_HTML.jpg](img/472943_1_En_7_Fig1_HTML.jpg)


    图 7-1


    薪资数据集


    ## 直接绘图


    Pandas 是一个具有数据框特性的 Python 库，它提供了内置选项，用于以二维表格样式绘制可视化图表。在代码清单 7-1 中，你读取了薪资数据集并创建了一些变量向量，这些变量是
    `rank`、`discipline`、`phd`、`service`、`sex` 和 `salary`。


    ```

    In [3]: import pandas as pd

    dataset = pd.read_csv("./Data/Salaries.csv")

    rank = dataset[''rank'']

    discipline = dataset[''discipline'']

    phd = dataset[''phd'']

    service = dataset[''service'']

    sex = dataset[''sex'']

    salary = dataset[''salary'']

    dataset.head()

    代码清单 7-1

    读取数据集

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figa_HTML.jpg](img/472943_1_En_7_Figa_HTML.jpg)


    ### 折线图


    你可以使用如代码清单 7-2 所示的折线图。确保数据单位（例如 `phd`、`service` 和 `salary` 变量）用于绘图非常重要。然而，只有薪资是可见的，而
    `phd` 和 `service` 信息在图上并未清晰显示。这是因为薪资的数值单位是数十万，而 `phd` 和 `service` 信息的单位非常小。


    ```

    In [5]: dataset[["rank", "discipline","phd","service", "sex", "salary"]].plot()

    代码清单 7-2

    可视化数值单位差异较大的模式

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figb_HTML.jpg](img/472943_1_En_7_Figb_HTML.jpg)


    让我们可视化更具可比性的单位，例如 `phd` 和 `service` 信息，如代码清单 7-3 所示。你可以观察到多年来 `phd` 和 `service`
    之间的相关性，除了从 55 岁到 80 岁，`service` 有所下降，这意味着一些人在 55 岁及以后离开了服务岗位。


    ```

    In [6]: dataset[["phd","service"]].plot()

    代码清单 7-3

    可视化数值单位相近的模式

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figc_HTML.jpg](img/472943_1_En_7_Figc_HTML.jpg)


    在代码清单 7-4 中，你按服务年限对数据进行分组，并汇总每个服务类别的薪资。然后，你根据薪资对派生数据集进行降序排序。最后，你使用条形图绘制排序后的数据集。


    ```

    In [4]: dataset1 = dataset.groupby([''service'']).sum()

    dataset1.sort_values("salary", ascending = False, inplace=True)

    dataset1.head()

    代码清单 7-4

    可视化每个服务类别的薪资

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figd_HTML.jpg](img/472943_1_En_7_Figd_HTML.jpg)


    ```

    In [8]: dataset1["salary"].plot.bar()

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Fige_HTML.jpg](img/472943_1_En_7_Fige_HTML.jpg)


    你可以看到大多数人服务年限约为 19 年，这就是为什么该类别累积薪资最高的原因。

