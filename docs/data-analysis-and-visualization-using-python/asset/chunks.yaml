    1.  What is meant by data visualization?


    **Answer:**


    Data visualization is the process of interpreting the data in the form of pictorial
    or graphical format.


    2.  Why is data visualization important?


    **Answer:**


    - Data Visualization helps business to achieve numerous goals through the following.

    - Convert the business data into interactive graphs for dynamic interpretation
    to serve the business goals.

    - Transforming data into visually appealing, interactive dashboards of various
    data sources to serve the business with the insights.

    - Create more attractive and informative dashboard of various graphical data representation.

    - Make appropriate decisions by drilling into the data and finding the insights.

    - Figure out the patterns, trends and correlations in the data being analyzed
    to determine where they must improve their operational processes and thereby grow
    their business.

    - Give full picture of the data under analysis.

    - Enable to organize and present massive data intuitively to present important
    findings from the data.

    - Make better, quick and informed decisions.


    3.  Why do modern businesses need data visualization?


    **Answer:**


    - Data visualization is needed by the modern business to support the following
    areas.

    - Analyze the business different processes where the management can focus on the
    areas of improvement to generate more revenue and improve productivity.

    - Bring business intelligences to life.

    - Apply creative approach to improve the abilities to understand the hidden information
    within the business data.

    - Provide better and faster way to identify patterns, trends, and correlation
    in the data sets that would remain undetected with a text.

    - Identify new business opportunities by predicting upcoming trends or sales volumes
    and the revenue they would generate.

    - Helps to spot trends in data that may not have been noticeable from the text
    alone.

    - Supply managers with information they need to make more effective comparisons
    between data sets by plotting them on the same visualization.

    - Enable managers to understand the correlations between the operating conditions
    and business performance.

    - Help to discover the gray areas of the business and hence take right decisions
    for improvement.

    - Helps to understand customers’ behaviors and interests, and hence retains customers
    and market.


    4.  How is data visualization used for business decision-making?


    **Answer:**


    - There are many ways in which visualization help the business to improve decision
    making.

    - **Faster Times Response:** It becomes incredibly useful to put useful interpretation
    of the collected data into the hands of managers and decision makers enabling
    them to quickly identify issues and improve response times.

    - **Simplicity:** data visualization techniques gives the full picture of the
    scoped parameters and simplify the data by enabling decision makers to cherry-pick
    the relevant data they need and dive to detailed wherever is needed.

    - **Easier Pattern Visualization:** provides easier approaches to identify upcoming
    trends and patterns within datasets, and hence enable to take efficient decisions
    and prepare strategies in advance.

    - **Team Involvement:** increase the levels of collaboration between departments
    and keep them on the same page to achieve strategic goals.

    - **Unify Interpretation:** produced charts and graphics have the same interpretation
    by all beneficial who use extracted information for decisions making and hence
    avoid any misleading.


