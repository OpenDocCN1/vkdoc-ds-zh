    ### 列删除


    你可以使用 `del` 方法删除任意列。例如，`del df2[''Test2'']` 会从数据集中删除 `Test2` 列。此外，你还可以使用 `pop`
    方法来删除列。例如，`df2.pop(''Project'')` 用于删除 `Project` 列。但是，在使用 `del` 或 `pop` 方法时需要小心，因为可能存在引用。在这种情况下，它不仅会从执行的数据框中删除，还会从被引用的数据框中删除。清单
    6-16 创建了数据框 `df1`，并将 `df1` 复制给 `df2`。


    ```

    In [70]: import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    print (df1)

    df2 = df1

    print ("\n")

    print (df2)

    Test1    Test2   Project   Average

    Ahmed    70.0     56      87        71.00

    Ali      89.0     77      90        85.33

    Omar     55.0     82      83        73.33

    Salwa    NaN      65      67        NaN

    Test1    Test2   Project   Average

    Ahmed             70.0     56      87        71.00

    Ali               89.0     77      90        85.33

    Omar              55.0     82      83        73.33

    Salwa             NaN      65      6         7  NaN

    清单 6-16

    创建和复制数据框

    ```


    在前面的 Python 脚本中，你看到了如何创建 `df2` 并将其赋值为 `df1`。在清单 6-17 中，你依次使用 `del` 和 `pop` 方法删除了
    `Test2` 和 `Project` 变量。如图所示，这两个变量都从数据框 `df1` 和 `df2` 中被删除了，这是因为使用赋值（`=`）运算符导致这两个数据框之间存在引用关系。


    ```

    In [71]: # 使用 del 函数删除数据框中的列

    print ("使用 DEL 函数删除第一列:")

    del df2[''Test2'']

    print (df2)

    # 使用 pop 函数删除数据框中的列

    print ("\n 使用 POP 函数删除另一列:")

    df2.pop(''Project'')

    print (df2)

    使用 DEL 函数删除第一列:

