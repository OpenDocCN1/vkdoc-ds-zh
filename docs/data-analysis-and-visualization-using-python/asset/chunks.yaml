- fmt: '# Exercises and Answers


    1. Create a data frame called `df` from the following tabular data dictionary
    that has these index labels: `[''a'', ''b'', ''c'', ''d'', ''e'', ''f'', ''g'',
    ''h'', ''i'', ''j'']`.


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figao_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figao_HTML.jpg)


    **Answer:** You should import both the Pandas and Numpy libraries.


    ```

    import numpy as np

    import pandas as pd

    ```


    You must create a dictionary and list of labels and then call the data frame method
    and assign the labels list as an index, as shown in Listing [6-40](#472943_1_En_6_Chapter.xhtml#PC61).


    ```

    In [5]: import numpy as np

    import pandas as pd

