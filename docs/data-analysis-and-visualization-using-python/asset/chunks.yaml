    ### Pie Chart


    Pie charts are useful for comparing parts of a whole. They do not show changes
    over time. Bar graphs are used to compare different groups or to track changes
    over time. However, when trying to measure change over time, bar graphs are best
    when the changes are larger. In addition, a pie chart is useful for comparing
    small variables, but when it comes to a large number of variables, it falls short.
    Listing [7-6](#472943_1_En_7_Chapter.xhtml#PC9) compares the salary package of
    ten professionals from the Salaries data set.


    ```

    In [13]: dataset["salary"].head(10).plot.pie(autopct=''%.2f'')

    Listing 7-6

    Pie Chart

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figi_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figi_HTML.jpg)


    ### Box Plot


    Box plotting is used to compare variables using some statistical values. The comparable
    variables should be of the same data units; Listing [7-7](#472943_1_En_7_Chapter.xhtml#PC10)
    shows that when you compare `phd` and `salary`, it produces improper figures and
    does not provide real comparison information since the `salary` numerical units
    are much higher than the `phd` numerical values. Plotting `phd` and `services`
    shows that the median and quantiles of `phd` are higher than the median and quantiles
    of the `service` information; in addition, the range of `phd` is wider than the
    range of `service` information.


    ```

    In [14]: dataset[["phd","salary"]].head(100).plot.box()

    Listing 7-7

    Box Plotting

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figj_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figj_HTML.jpg)


    ```

    In [15]: dataset[["phd","service"]].plot.box()

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figk_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figk_HTML.jpg)


    ### Histogram Plot


    A histogram can be used to represent a specific variable or set of variables.
    Listing [7-8](#472943_1_En_7_Chapter.xhtml#PC12) plots 20 records of the `salaries`
    variables; it shows that salary packages of about 135,000 are the most frequent
    in this data set.


    ```

    In [16]: dataset["salary"].head(20).plot.hist()

    Listing 7-8

    Histogram Plotting

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figl_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figl_HTML.jpg)


    ### Scatter Plot


    A scatter plot shows the relationship between two factors of an experiment (e.g.
    `phd` and `service`). A trend line is used to determine positive, negative, or
