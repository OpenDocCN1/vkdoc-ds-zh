    ### 选择语句


    `if` 语句用于在给定条件为真时执行特定的语句或语句集。`if` 结构有多种形式，如表 1-9 所示。


    **表 1-9** `if` 语句结构


    | 形式 | `if` 语句 | `if-else` 语句 | 嵌套 `if` 语句 |

    | --- | --- | --- | --- |

    | **结构** | `if(condition):` `statements` | `if(condition):` `statements` `else:`
    `statements` | `if (condition):` `statements` `elif (condition):` `statements`
    `else:` `statements` |


    `if` 语句用于根据程序执行过程中出现的特定条件做出决策。如果结果为真，则执行一个或一组操作；如果结果为假，则执行另一组操作。图 1-6 展示了大多数编程语言（包括
    Python）中典型的决策结构的一般形式。在 Python 中，任何非零和非空值都被视为真，而零或空值则被视为假。


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig6_HTML.jpg](img/472943_1_En_1_Fig6_HTML.jpg)


    **图 1-6** 选择语句结构


    清单 1-13 演示了两个选择语句的示例，请记住缩进在 Python 结构中非常重要。第一个代码块显示 `x` 的值等于 5；因此，条件测试的是 `x` 是否等于
    5。因此，当条件为真时，输出执行该语句。


    ```

    In [13]:#Comparison operators

    x=5

    if x==5:

    print (''Equal 5'')

    elif x>5:

    print (''Greater than 5'')

    elif x<5:

    print (''Less than 5'')

    Equal 5

    In [14]:year=2000

    if year%4==0:

    print("Year(", year ,")is Leap")

    else:

