    ### String Processing


    A *string* is a sequence of characters that can be accessed by an expression in
    brackets called an *index* . For instance, if you have a string variable named
    `var1`, which maintains the word `PYTHON`, then `var1[1]` will return the character
    *Y*, while `var1[-2]` will return the character *O*. Python considers strings
    by enclosing text in single as well as double quotes. Strings are stored in a
    contiguous memory location that can be accessed from both directions (forward
    and backward), as shown in the following example, where


    *   Forward indexing starts with 0, 1, 2, 3, and so on.


    *   Backward indexing starts with -1, -2, -3, -4, and so on.


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Figh_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Figh_HTML.jpg)


    #### String Special Operators


    Table [1-12](#472943_1_En_1_Chapter.xhtml#Tab12) lists the operators used in string
    processing. Say you have the two variables `a= ''Hello''` and `b = ''Python''`.
    Then you can implement the operations shown in Table [1-12](#472943_1_En_1_Chapter.xhtml#Tab12).


    Table 1-12


    String Operators


    | Operator | Description | Outputs |

    | --- | --- | --- |

    | + | Concatenation: adds values on either side of the operator | `a + b` will
    give `HelloPython`. |

    | * | Repetition: creates new strings, concatenating multiple copies of the same
    string | a`*2` will give `-HelloHello`. |

    | [] | Slice: gives the character from the given index | `a[1]` will give `e`.
    |

    | [ : ] | Range slice: gives the characters from the given range | `a[1:4]` will
    give `ell`. |

    | in | Membership: returns true if a character exists in the given string | `H
    in a` will give true. |

    | not in | Membership: returns true if a character does not exist in the given
    string | `M not in a` will give true. |


    Various symbols are used for string formatting using the operator `%`. Table [1-13](#472943_1_En_1_Chapter.xhtml#Tab13)
    gives some simple examples.


    Table 1-13


    String Format Symbols


    | Format Symbol | Conversion |

    | --- | --- |

    | `%c` | Character |

    | `%s` | String conversion via `str()` prior to formatting |

    | `%i` | Signed decimal integer |

    | `%d` | Signed decimal integer |

    | `%u` | Unsigned decimal integer |

    | `%o` | Octal integer |

    | `%x` | Hexadecimal integer (lowercase letters) |

    | `%X` | Hexadecimal integer (uppercase letters) |

    | `%e` | Exponential notation (with lowercase `e`) |

    | `%E` | Exponential notation (with uppercase `E`) |

    | `%f` | Floating-point real number |

    | `%g` | The shorter of `%f` and `%e` |

    | `%G` | The shorter of `%f` and `%E` |


    #### String Slicing and Concatenation


    *String slicing* refers to a segment of a string that is extracted using an index
    or using search methods. In addition, the `len()` method is a built-in function
    that returns the number of characters in a string. Concatenation enables you to
    join more than one string together to form another string.


    The operator `[n:m]` returns the part of the string from the *n*th character to
    the *m*th character, including the first but excluding the last. If you omit the
    first index (before the colon), the slice starts at the beginning of the string.
    In addition, if you omit the second index, the slice goes to the end of the string.
    The examples in Listing [1-22](#472943_1_En_1_Chapter.xhtml#PC30) show string
    slicing and concatenation using the `+` operator.


