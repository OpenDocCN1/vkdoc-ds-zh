- fmt: "### Built-in Dictionary Functions\n\nVarious built-in functions can be implemented\
    \ on dictionaries. Table [3-3](#472943_1_En_3_Chapter.xhtml#Tab4) shows some of\
    \ these functions. The compare function `cmp()` in older Python versions was used\
    \ to compare two dictionaries; it returns `0` if both dictionaries are equal,\
    \ `1` if `dic1` > `dict2`, and `-1` if `dict1` < `dict2`. But starting with Python\
    \ 3, the `cmp()` function is not available anymore, and you cannot define it.\
    \ See also Listing [3-16](#472943_1_En_3_Chapter.xhtml#PC15).\n\n**Table 3-3**\
    \ Built-in Dictionary Functions\n\n| **No** | **Function** | **Description** |\n\
    | --- | --- | --- |\n| 1 | `cmp(dict1, dict2)` | Compares elements of two dictionaries.\
    \ |\n| 2 | `len(dict)` | Gives the total length of the dictionary, i.e., the number\
    \ of items in the dictionary. |\n| 3 | `str(dict)` | Produces a printable string\
    \ representation of a dictionary. |\n| 4 | `type(variable)` | Returns the type\
    \ of the passed variable. If the passed variable is a dictionary, then it would\
    \ return a dictionary type. |\n\n```\nIn [43]:Staff_Salary = { 'Omar Ahmed' :\
    \ 30000 , 'Ali Ziad' : 24000,\n'Ossama Hashim': 25000, 'Majid Hatem':10000}\n\
    STDMarks={\"Salwa Ahmed\":50, \"Abdullah Mohamed\":80, \"Sultan\nGhanim\":90}\n\
    In [52]: def cmp(a, b):\nfor key, value in a.items():\nfor key1, value1 in b.items():\n\
    return (key >key1) - (key \nListing 3-16\nImplementing Dictionary Functions\n\
    ```\n\n### Built-in Dictionary Methods\n\nPython provides various methods for\
    \ dictionary processing. Table [3-4](#472943_1_En_3_Chapter.xhtml#Tab5) summarizes\
    \ the methods that can be used to access dictionaries.\n\n**Table 3-4** Built-in\
    \ Dictionary Methods\n\n| **No** | **Methods** | **Description** |\n| --- | ---\
    \ | --- |\n| 1 | `dict1.clear()` | Removes all elements of dictionary `dict1`\
    \ |\n| 2 | `dict1.copy()` | Returns a copy of dictionary `dict1` |\n| 3 | `dict1.fromkeys()`\
    \ | Creates a new dictionary with keys from `seq` and values |\n| 4 | `dict1.get(key,\
    \ default=None)` | For the key name `key`, returns the value or default if key\
    \ not in dictionary |\n| 5 | `dict1.has_key(key)` | Returns true if key is in\
    \ dictionary `dict1`, false otherwise |\n| 6 | `dict1.items()` | Returns a list\
    \ of `dict1`’s (key, value) tuple pairs |\n| 7 | `dict1.keys()` | Returns list\
    \ of the dictionary `dict1`’s keys |\n| 8 | `dict1.setdefault(key, default=None)`\
    \ | Similar to `get()`, but will set `dict1 [key]=default` if `key` is not already\
    \ in `dict1` |\n| 9 | `dict1.update(dict2)` | Adds dictionary `dict2`’s key-values\
    \ pairs to `dict1` |\n| 10 | `dict1.values()` | Returns list of dictionary `dict1`’s\
    \ values |\n\nListing [3-17](#472943_1_En_3_Chapter.xhtml#PC16) shows the use\
    \ and implementation of dictionary methods.\n\n```\nIn [89]: Staff_Salary = {\
    \ 'Omar Ahmed' : 30000 , 'Ali Ziad' : 24000,\n'Ossama Hashim': 25000, 'Majid Hatem':10000}\n\
    STDMarks={\"Salwa Ahmed\":50, \"Abdullah Mohamed\":80, \"Sultan\nGhanim\":90}\n\
    print (Staff_Salary.get('Ali Ziad') )\nprint (STDMarks.items())\nprint (Staff_Salary.keys())\n\
    print()\nSTDMarks.setdefault('Ali Ziad')\nprint (STDMarks)\nprint (STDMarks.update(dict1))\n\
    print (STDMarks)\n\ndict_items([('Salwa Ahmed', 50), ('Abdullah Mohamed', 80),\
    \ ('Sultan Ghanim', 90)])\ndict_keys(['Omar Ahmed', 'Ali Ziad', 'Ossama Hashim',\
    \ 'Majid Hatem'])\n{'Salwa Ahmed': 50, 'Abdullah Mohamed': 80, 'Sultan Ghanim':\
    \ 90, 'Ali Ziad': None}\nNone\n{'Salwa Ahmed': 50, 'Abdullah Mohamed': 80, 'Sultan\
    \ Ghanim': 90, 'Ali Ziad': None}\nListing 3-17\nImplementing Dictionary Methods\n\
    ```\n\nYou can sort a dictionary by key and by value, as shown in Listing [3-18](#472943_1_En_3_Chapter.xhtml#PC17).\n\
    \n```\nIn [96]: Staff_Salary = { 'Omar Ahmed' : 30000 , 'Ali Ziad' : 24000, 'Ossama\
    \ Hashim': 25000, 'Majid Hatem':10000}\nprint (\"\\nSorted by key\")\nfor k in\
    \ sorted(Staff_Salary):\nprint (k, Staff_Salary[k])\nSorted by key\nAli Ziad 24000\n\
    Majid Hatem 10000\nOmar Ahmed 30000\nOssama Hashim 25000\nIn [97]: Staff_Salary\
    \ = { 'Omar Ahmed' : 30000 , 'Ali Ziad' : 24000, 'Ossama Hashim': 25000, 'Majid\
    \ Hatem':10000}\nprint (\"\\nSorted by value\")\nfor w in sorted(Staff_Salary,\
    \ key=Staff_Salary.get, reverse=True):\nprint (w, Staff_Salary[w])\nSorted by\
    \ value\nOmar Ahmed      30000\nOssama Hashim   25000\nAli Ziad        24000\n\
    Majid Hatem     10000\nListing 3-18\nSorting a Dictionary\n```\n\n## Tuples\n\n\
    A *tuple* is a sequence just like a list of immutable objects. The differences\
    \ between tuples and lists are that the tuples cannot be altered; also, tuples\
    \ use parentheses, whereas lists use square brackets.\n\n### Creating Tuples\n\
    \nYou can create tuples simply by using different comma-separated values. You\
    \ can access an element in the tuple by index, as shown in Listing [3-19](#472943_1_En_3_Chapter.xhtml#PC18).\n\
    \n```\nIn [1]:Names = ('Omar', 'Ali', 'Bahaa')\nMarks = ( 75, 65, 95 )\nprint\
    \ (Names[2])\nprint (Marks)\nprint (max(Marks))\nBahaa\n(75, 65, 95)\n\nIn [2]:\
    \ for name in Names:\nprint (name)\nOmar\nAli\nBahaa\nListing 3-19\nCreating and\
    \ Displaying Tuples\n```\n\nLet’s try to alter a tuple to modify any element,\
    \ as shown in Listing [3-20](#472943_1_En_3_Chapter.xhtml#PC19); we get an error\
    \ because, as indicated earlier, tuples cannot be altered.\n\n```\nIn [3]: Marks[1]=66\n\
    \nTypeError    Traceback (most recent call last)\n in ()\n----> 1 Marks[1]=66\n\
    TypeError: 'tuple' object does not support item assignment\nListing 3-20\nAltering\
    \ a Tuple for Editing\n```\n\nLike lists, you can access tuple elements forward\
    \ and backward using the element’s indices. Here’s an example:\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figb_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Figb_HTML.jpg)\n\
    \nYou can sort a list of tuples. Listing [3-21](#472943_1_En_3_Chapter.xhtml#PC20)\
    \ shows how to sort tuple elements in place as well as how to create another sorted\
    \ tuple.\n\n```\nIn [1]:import operator\nMarksCIS = [(88,65),(70,90,85), (55,88,44)]\n\
    print (MarksCIS)           # original tuples\nprint (sorted(MarksCIS))   # direct\
    \ sorting\n[(88, 65), (70, 90, 85), (55, 88, 44)]\n[(55, 88, 44), (70, 90, 85),\
    \ (88, 65)]\nIn [2]: print (MarksCIS)     # original tuples\n#create a new sorted\
    \ tuple\nMarksCIS2 = sorted(MarksCIS, key=lambda x: (x[0], x[1]))\nprint (MarksCIS2)\n\
    [(88, 65), (70, 90, 85), (55, 88, 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\n\
    In [3]:print (MarksCIS) # original tuples\nMarksCIS.sort(key=lambda x: (x[0],\
    \ x[1])) # sort in tuple\nprint (MarksCIS)\n[(88, 65), (70, 90, 85), (55, 88,\
    \ 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\nListing 3-21\nSorting a Tuple\n\
    ```\n\nBy default the `sort` built-in function detected that the items are in\
    \ tuples form, so the sort function sorts tuples based on the first element, then\
    \ based on the second element.\n\n### Concatenating Tuples\n\nAs mentioned, tuples\
    \ are immutable, which means you cannot update or change the values of tuple elements.\
    \ You can take portions of existing tuples to create new tuples, as Listing [3-22](#472943_1_En_3_Chapter.xhtml#PC21)\
    \ demonstrates.\n\n```\nIn [5]:MarksCIS=(70,85,55)\nMarksCIN=(90,75,60)\nCombind=MarksCIS\
    \ + MarksCIN\nprint (Combind)\n(70, 85, 55, 90, 75, 60)\nListing 3-22\nConcatenating\
    \ Tuples\n```"
