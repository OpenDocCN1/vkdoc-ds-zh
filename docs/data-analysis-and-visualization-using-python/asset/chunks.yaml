- fmt: '### Creating a Data Frame


    Pandas can create a data frame using the constructor `pandas.DataFrame(data, index,
    columns, dtype, copy)`. A data frame can be created from lists, series, dictionaries,
    Numpy arrays, or other data frames. A Pandas data frame not only helps to store
    tabular data but also performs arithmetic operations on rows and columns of the
    data frame. Listing [6-10](#472943_1_En_6_Chapter.xhtml#PC12) creates a data frame
    from a single list and a list of lists.


    ```

    In [19]: import pandas as pd

    data = [10,20,30,40,50]

    DF1 = pd.DataFrame(data)

    print (DF1)

    0    10

    1    20

    2    30

    3    40

    4    50

    In [22]: import pandas as pd

    data = [[''Ossama'',25],[''Ali'',43],[''Ziad'',32]]

    DF1 = pd.DataFrame(data,columns=[''Name'',''Age''])

    print (DF1)

    Name       Age

    0    Ossama     25

    1    Ali        43

    2    Ziad       32

    In [21]: import pandas as pd

    data = [[''Ossama'',25],[''Ali'',43],[''Ziad'',32]]

    DF1 = pd.DataFrame(data,columns=[''Name'',''Age''],dtype=float) print (DF1)

    Name       Age

    0    Ossama     25.0

    1    Ali        43.0

    2    Ziad       32.0

    Listing 6-10

    Creating a Data Frame from a List

    ```


    You can create a data frame from dictionaries or arrays, as shown in Listing [6-11](#472943_1_En_6_Chapter.xhtml#PC13).
    Also, you can set the data frame indices. However, if you don’t set the indices,
    then the data frame starts with 0 and goes up to `n`-1, where `n` is the length
    of the list. Column names are taken by default from the dictionary keys. However,
    it’s possible to set labels for columns as well. The first data frame’s `df1`
    columns are labeled with the dictionary key names; that’s why you don’t see NaN
    cases except for the missing value of the project in dictionary 1. While in the
    second data frame, named `df2`, you change the column name from `Test1` to `Test_1`,
    and you get NaNs for all the records. This is because of the absence of `Test_1`
    in the dictionary key of `data`.


    ```

    In [13]: import pandas as pd

    data = [{''Test1'': 10, ''Test2'': 20},{''Test1'': 30, ''Test2'': 20, ''Project'':
    20}]

    # With three column indices, values same as dictionary keys

    df1 = pd.DataFrame(data, index=[''First'', ''Second''], columns=[''Test2'', ''Project''
    , ''Test1''])

    #With two column indices with one index with another name

    df2 = pd.DataFrame(data, index=[''First'', ''Second''], columns=[''Project'',
    ''Test_1'',''Test2 '')]

    print (df1)

    print ("\n")

    print (df2)

    Test2       Project        Test1

    First     20          NaN            10

    Second    20          20.0           30

    Project     Test_1         Test2

    First     NaN         NaN            20

    Second    20.0        NaN            20

    Listing 6-11

    Creating a DataFrame from a Dictionary

    ```


    Pandas allows you to create a data frame from a dictionary of series where you
    get the union of all series indices passed. As shown in Listing [6-12](#472943_1_En_6_Chapter.xhtml#PC14)
    with the student `Salwa`, no `Test1` value is given. That’s why NaN is set automatically.


    ```

    In [16]: import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    df1 = pd.DataFrame(data)

    print (df1)

    Test1     Test2

    Ahmed      70.0      56

    Ali        89.0      77

    Omar       55.0      82

    Salwa      NaN       65

    Listing 6-12

    Creating a Data Frame from a Series

    ```


    ### Updating and Accessing a Data Frame’s Column Selection


    You can select a specific column using the column labels. For example, `df1[''Test2'']`
    is used to select only the column labeled `Test2` in the data frame, while `df1[:]`
    is used to display all the columns and all the rows, as shown in Listing [6-13](#472943_1_En_6_Chapter.xhtml#PC15).


    ```

    In [51]: import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    df1 = pd.DataFrame(data)

    print (df1[''Test2'']) # Column selection

    print("\n")

    print (df1[:]) # Column selection

    Ahmed     56

    Ali       77

    Omar      82

    Salwa     65

    Name: Test2, dtype: int64

    Test1       Test2

    Ahmed     70.0        56

    Ali       89.0        77

    Omar      55.0        82

    Salwa     NaN         65

    Listing 6-13

    Data Frame Column Selection

    ```


    You can select columns by using the column labels or the column index. `df1.iloc[:,
    [1,0]]` is used to display all rows for columns 1 and 0 starting with column 1,
    which refers to the column named `Test2`. In addition, `df1[0:4:1]` is used to
    display all the rows starting from row 0 up to row 3 incremented by 1, which gives
    all rows from 0 up to 3. See Listing [6-14](#472943_1_En_6_Chapter.xhtml#PC16).


    ```

    In [46]: df1.iloc[:, [1,0 ]]

    Out[46]:             Test2   Test1

    Ahmed       56      70.0

    Ali         77      89.0

    Omar        82      55.0

    Salwa       65      NaN

    In [39]: df1[0:4:1]

    Out[39]:             Test1   Test2

    Ahmed       70.0    56

    Ali         89.0    77

    Omar        55.0    82

    Salwa       NaN     65

    Listing 6-14

    Data Frame Column and Row Selection

    ```


    ### Column Addition


    You can simply add a new column and add its values directly using a series. In
    addition, you can create a new column by processing the other columns, as shown
    in Listing [6-15](#472943_1_En_6_Chapter.xhtml#PC17).


    ```

    In [66]: # add a new Column

    import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    df1 = pd.DataFrame(data)

    print (df1)

    df1[''Project''] = pd.Series([90,83,67, 87], index=[''Ali'',''Omar'',''Salwa'',
    ''Ahmed''])

    print ("\n")

    df1[''Average''] = round((df1[''Test1'']+df1[''Test2'']+df1[''Project''])/3, 2)

    print (df1)

    Test1   Test2

    Ahmed    70.0    56

    Ali      89.0    77

    Omar     55.0    82

    Salwa    NaN     65

    Test1   Test2   Project   Average

    Ahmed    70.0    56      87        71.00

    Ali      89.0    77      90        85.33

    Omar     55.0    82      83        73.33

    Salwa    NaN     65      67        NaN

    Listing 6-15

    Adding a New Column to a Data Frame

    ```'
