    ### Formatting Strings


    The Python special operator `%` helps to create formatted output. This operator
    takes two operands, which are a formatted string and a value. The following example
    shows that you pass a string and the `3.14259` value in string format. It should
    be clear that the value can be a single value, a tuple of values, or a dictionary
    of values.


    ```

    In [20]: print ("pi=%s"%"3.14159")

    pi=3.14159

    ```


    ### Conversion Types


    You can convert values using different conversion specifier syntax, as summarized
    in Table [1-6](#472943_1_En_1_Chapter.xhtml#Tab6).


    Table 1-6


    Conversion Syntax


    | Syntax | Description |

    | --- | --- |

    | `%c` | Converts to a single character |

    | `%d`, `%i` | Converts to a signed decimal integer or long integer |

    | `%u` | Converts to an unsigned decimal integer |

    | `%e`, `%E` | Converts to a floating point in exponential notation |

    | `%f` | Converts to a floating point in fixed-decimal notation |

    | `%g` | Converts to the value shorter of `%f` and `%e` |

    | `%G` | Converts to the value shorter of `%f` and `%E` |

    | `%o` | Converts to an unsigned integer in octal |

    | `%r` | Converts to a string generated with `repr()` |

    | `%s` | Converts to a string using the `str()` function |

    | `%x`, `%X` | Converts to an unsigned integer in hexadecimal |


    For example, the conversion specifier `%s` says to convert the value to a string.
    Therefore, to print a numerical value inside string output, you can use, for instance,
    `print("pi=%s" % 3.14159)`. You can use multiple conversions within the same string,
    for example, to convert into double, float, and so on.


    ```

    In [1]:print("The value of %s is = %02f" % ("pi", 3.14159))

    The value of pi is = 3.141590

    ```


    You can use a dot (`.`) followed by a positive integer to specify the precision.
    In the following example, you can use a tuple of different data types and inject
    the output in a string message:


    ```

    In [21]:print ("Your name is %s, and your height is %.2f while your weight is
    %.2d" % (''Ossama'', 172.156783, 75.56647))

    Your name is Ossama, and your height is 172.16 while your weight is 75

    ```


    In the previous example, you can see that `%.2f` is replaced with the value `172.16`
    with two decimal fractions after the decimal point, while `%2d` is used to display
    decimal values only but in a two-digit format.


    You can display values read directly from a dictionary, as shown next, where `%(name)s`
    says to take as a string the dictionary value of the key `Name` and `%(height).2f`
    says to take it as a float with two fraction values, which are the dictionary
    values of the key `height`:


    ```

    In [23]:print ("Hi %(Name)s, your height is %(height).2f" %{''Name'':"Ossama",
    ''height'': 172.156783})

    Hi Ossama, your height is 172.16

    ```


    ### The Replacement Field, `{}`


    You can use the replacement field, `{}`, as a name (or index). If an index is
    provided, it is the index of the list of arguments provided in the field. It’s
    not necessary to have indices with the same sequence; they can be in a random
    order, such as indices 0, 1, and 2 or indices 2, 1, and 0.


    ```

    In [24]:x = "price is"

    print ("{1} {0} {2}".format(x, "The", 1920.345))

    The price is 1920.345

    ```


    Also, you can use a mix of values combined from lists, dictionaries, attributes,
    or even a singleton variable. In the following example, you will create a class
    called `A()`, which has a single variable called `x` that is assigned the value
    9.


    Then you create an instance (*object*) called `w` from the class `A()`. Then you
    print values indexed from variable `{0}` and the `{1[2]}` value from the list
    of values `["a," "or," "is"]`, where 1 refers to the index of printing and 2 refers
    to the index in the given list where the string index is 0. `{2[test]}` refers
    to index 2 in the print string and reads its value from the passed dictionary
    from the key `test`. Finally, `{3.x}` refers to the third index, which takes its
    value from `w`, which is an instance of the class `A()`.


    ```

    In [34]:class A():x=9 w=A()

    print ("{0} {1[2]} {2[test]} {3.x}".format("This", ["a", "or", "is"], {"test":
    "another"},w))

    This is another 9

    In [34]:print ("{1[1]} {0} {1[2]} {2[test]}{3.x}".format("This", ["a", "or", "is"],
    {"test": "another"},w))

    or This is another 9

    ```


    ### The Date and Time Module


    Python provides a time package to deal with dates and times. You can retrieve
    the current date and time and manipulate the date and time using the built-in
    methods.


    The example in Listing [1-12](#472943_1_En_1_Chapter.xhtml#PC19) imports the time
    package and calls its `.localtime()` function to retrieve the current date and
    time.


    ```

    In [42]:import time localtime = time.asctime(time.localtime(time.time()))

    print ("Formatted time :", localtime)

    print(time.localtime())

    print (time.time())

    Formatted time : Fri Aug 17 19:12:07 2018

    time.struct_time(tm_year=2018, tm_mon=8, tm_mday=17, tm_hour=19, tm_min=12, tm_sec=7,
    tm_wday=4, tm_yday=229, tm_isdst=0)

    1534533127.8304486

    Listing 1-12

    Time Methods

    ```


    ### Time Module Methods


    Python provides various built-in time functions, as in Table [1-7](#472943_1_En_1_Chapter.xhtml#Tab7),
    that can be used for time-related purposes.


    Table 1-7


    Built-in Time Methods


    | Methods | Description |

    | --- | --- |

    | `time()` | Returns time in seconds since January 1, 1970. |

    | `asctime(time)` | Returns a 24-character string, e.g., Sat Jun 16 21:27:18 2018.
    |

    | `sleep(time)` | Used to stop time for the given interval of time. |

    | `strptime(String,format)` | Returns a tuple with nine time attributes. It receives
    a string of date and a format.`time.struct_time(tm_year=2018, tm_mon=6, tm_mday=16,
    tm_hour=0, tm_min=0, tm_sec=0, tm_wday=3, tm_yday=177, tm_isdst=-1)` |

    | `gtime()/gtime(sec)` | Returns `struct_time`, which contains nine time attributes.
    |

    | `mktime()` | Returns the seconds in floating point since the epoch. |

    | `strftime(format)/strftime(format,time)` | Returns the time in a particular
    format. If the time is not given, the current time in seconds is fetched. |


    ### Python Calendar Module


    Python provides a calendar module, as in Table [1-8](#472943_1_En_1_Chapter.xhtml#Tab8),
    which provides many functions and methods to work with a calendar.


    Table 1-8


    Built-in Calendar Module Functions


    | Methods | Description |

    | --- | --- |

    | `prcal(year)` | Prints the whole calendar of the year. |

    | `firstweekday()` | Returns the first weekday. It is by default 0, which specifies
    Monday. |

    | `isleap(year)` | Returns a Boolean value, i.e., true or false. Returns true
    in the case the given year is a leap year; otherwise, false. |

    | `monthcalendar(year,month)` | Returns the given month with each week as one
    list. |

    | `leapdays(year1,year2)` | Returns the number of leap days from `year1` to `year2`.
    |

    | `prmonth(year,month)` | Prints the given month of the given year. |


    You can use the Calendar package to display a 2018 calendar as shown here:


    ```

    In [45]:import calendar

    calendar.prcal(2018)

    ```


