    ```


    ### Creating Data Frames from a Structured or Record Array


    Listing [3-37](#472943_1_En_3_Chapter.xhtml#PC37) creates a data frame by first
    specifying the data types of each column and then the values of each row. `(''A'',
    ''i4'')` determines the column label and its data type as integers, `(''B'', ''f4'')`
    determines the label as B and the data type as float, and finally `(''C'', ''a10'')`
    assigns the label C and data type as a string with a maximum of ten characters.


    ```

    In [18]:import pandas as pd

    import numpy as np

    data = np.zeros((2,), dtype=[(''A'', ''i4''),(''B'', ''f4''),(''C'', ''a10'')])

    data[:] = [(1,2.,''Hello''), (2,3.,"World")]

    pd.DataFrame(data)

    Out[18]:     A      B      C

    0 1      2.0    b''Hello''

    1 2      3.0    b''World''

    In [16]: pd.DataFrame(data, index=[''First'', ''Second''])

    Out[16]:            A     B      C

    First      1     2.0    b''Hello''

    Second     2     3.0    b''World''

    In [17]: pd.DataFrame(data, columns=[''C'', ''A'', ''B''])

    Out[17]:      C         A     B

    0    b''Hello''  1     2.0

    1    b''World''  2     3.0

    Listing 3-37

    Creating a Data Frame from a Record Array

    ```


