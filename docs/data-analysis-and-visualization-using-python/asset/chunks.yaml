    b.drop(columns, inplace=True, axis=1)

    b.head()

    Listing 5-16

    Dropping Columns 2009, 2012, 2013, and 2014

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figs_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figs_HTML.jpg)


    Python''s `.merge()` method can used to merge data sets; you can specify the merging
    variables, or you can let Python find the matching variables and implement the
    merging, as shown in Listing [5-17](#472943_1_En_5_Chapter.xhtml#PC23).


