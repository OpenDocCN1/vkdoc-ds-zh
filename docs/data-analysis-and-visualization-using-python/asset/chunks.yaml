    dataX.head()

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figu_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figu_HTML.jpg)


    You can merge two data sets using Index via Rows Union operation, as indicated
    in Listing [5-18](#472943_1_En_5_Chapter.xhtml#PC25), where the `.concat()` method
    is used to merge `Data1` and `Data2` over axis 0. This is a row-wise operation.


