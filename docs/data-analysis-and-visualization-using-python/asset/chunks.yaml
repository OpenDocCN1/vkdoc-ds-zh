    ## Introduction


    This book looks at Python from a data science point of view and teaches the reader
    proven techniques of data visualization that are used to make critical business
    decisions. Starting with an introduction to data science using Python, the book
    then covers the Python environment and gets you acquainted with editors like Jupyter
    Notebooks and the Spyder IDE. After going through a primer on Python programming,
    you will grasp the fundamental Python programming techniques used in data science.
    Moving on to data visualization, you will learn how it caters to modern business
    needs and is key to decision-making. You will also take a look at some popular
    data visualization libraries in Python. Shifting focus to collecting data, you
    will learn about the various aspects of data collections from a data science perspective
    and also take a look at Python’s data collection structures. You will then learn
    about file I/O processing and regular expressions in Python, followed by techniques
    to gather and clean data. Moving on to exploring and analyzing data, you will
    look at the various data structures in Python. Then, you will take a deep dive
    into data visualization techniques, going through a number of plotting systems
    in Python. In conclusion, you will go through two detailed case studies, where
    you’ll get a chance to revisit the concepts you’ve grasped so far.


    This book is for people who want to learn Python for the data science field in
    order to become data scientists. No specific programming prerequisites are required
    besides having basic programming knowledge.


    Specifically, the following list highlights what is covered in the book:


    *   Chapter [1](#472943_1_En_1_Chapter.xhtml) introduces the main concepts of
    data science and its life cycle. It also demonstrates the importance of Python
    programming and its main libraries for data science processing. You will learn
    how different Python data structures are used in data science applications. You
    will learn how to implement an abstract series and a data frame as a main Python
    data structure. You will learn how to apply basic Python programming techniques
    for data cleaning and manipulation. You will learn how to run the basic inferential
    statistical analyses. In addition, exercises with model answers are given for
    practicing real-life scenarios.


    *   Chapter [2](#472943_1_En_2_Chapter.xhtml) demonstrates how to implement data
    visualization in modern business. You will learn how to recognize the role of
    data visualization in decision-making and how to load and use important Python
    libraries for data visualization. In addition, exercises with model answers are
    given for practicing real-life scenarios.


    *   Chapter [3](#472943_1_En_3_Chapter.xhtml) illustrates data collection structures
    in Python and their implementations. You will learn how to identify different
    forms of collection in Python. You will learn how to create lists and how to manipulate
    list content. You will learn about the purpose of creating a dictionary as a data
    container and its manipulations. You will learn how to maintain data in a tuple
    form and what the differences are between tuple structures and dictionary structures,
    as well as the basic tuples operations. You will learn how to create a series
    from other data collection forms. You will learn how to create a data frame from
    different data collection structures and from another data frame. You will learn
    how to create a panel as a 3D data collection from a series or data frame. In
    addition, exercises with model answers are given for practicing real-life scenarios.


    *   Chapter [4](#472943_1_En_4_Chapter.xhtml) shows how to read and send data
    to users, read and pull data stored in historical files, and open files for reading,
    writing, or for both. You will learn how to access file attributes and manipulate
    sessions. You will learn how to read data from users and apply casting. You will
    learn how to apply regular expressions to extract data, use regular expression
    alternatives, and use anchors and repetition expressions for data extractions
    as well. In addition, exercises with model answers are given for practicing real-life
    scenarios.


    *   Chapter [5](#472943_1_En_5_Chapter.xhtml) covers data gathering and cleaning
    to have reliable data for analysis. You will learn how to apply data cleaning
    techniques to handle missing values. You will learn how to read CSV data format
    offline or pull it directly from online clouds. You will learn how to merge and
    integrate data from different sources. You will learn how to read and extract
    data from the JSON, HTML, and XML formats. In addition, exercises with model answers
    are given for practicing real-life scenarios.


    *   Chapter [6](#472943_1_En_6_Chapter.xhtml) shows how to use Python scripts
    to explore and analyze data in different collection structures. You will learn
    how to implement Python techniques to explore and analyze a series of data, create
    a series, access data from a series with a position, and apply statistical methods
    on a series. You will learn how to explore and analyze data in a data frame, create
    a data frame, and update and access data in a data frame structure. You will learn
    how to manipulate data in a data frame such as including columns, selecting rows,
    adding, or deleting data, and applying statistical operations on a data frame.
    You will learn how to apply statistical methods on a panel data structure to explore
    and analyze stored data. You will learn how to statistically analyze grouped data,
    iterate through groups, and apply aggregations, transformations, and filtration
    techniques. In addition, exercises with model answers are given for practicing
    real-life scenarios.


    *   Chapter [7](#472943_1_En_7_Chapter.xhtml) shows how to visualize data from
    different collection structures. You will learn how to plot data from a series,
    a data frame, or a panel using Python plotting tools such as line plots, bar plots,
    pie charts, box plots, histograms, and scatter plots. You will learn how to implement
    the Seaborn plotting system using strip plots, box plots, swarm plots, and joint
    plots. You will learn how to implement Matplotlib plotting using line plots, bar
    charts, histograms, scatter plots, stack plots, and pie charts. In addition, exercises
    with model answers are given for practicing real-life scenarios.


    *   Chapter [8](#472943_1_En_8_Chapter.xhtml) investigates two real-life case
    studies, starting with data gathering and moving through cleaning, data exploring,
    data analysis, and visualizing. Finally, you’ll learn how to discuss the study
    findings and provide recommendations for decision-makers.'
