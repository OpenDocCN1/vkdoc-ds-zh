- fmt: '# Exercises and Answers


    1. Write a Python script to prompt users to enter two values; then perform the
    basic arithmetical operations of addition, subtraction, multiplication, and division
    on the values.


    **Answer:**


    ```

    In [2]: # Store input numbers:

    num1 = input(''Enter first number: '')

    num2 = input(''Enter second number: '')

    sumval = float(num1) + float(num2)     # Add two numbers

    minval = float(num1) - float(num2)     # Subtract two numbers

    mulval = float(num1) * float(num2)     # Multiply two numbers

    divval = float(num1) / float(num2)     #Divide two numbers

    # Display the sum

    print(''The sum of {0} and {1} is {2}''.format(num1, num2, sumval))

    # Display the subtraction

    print(''The subtraction of {0} and {1} is {2}''.format(num1, num2, minval))

    # Display the multiplication

    print(''The multiplication of {0} and {1} is {2}''.format(num1, num2, mulval))

    # Display the division

    print(''The division of {0} and {1} is {2}''.format(num1, num2, divval))

    Enter first number: 10

    Enter second number: 5

    The sum of 10 and 5 is 15.0

    The subtraction of 10 and 5 is 5.0

    The multiplication of 10 and 5 is 50.0

    The division of 10 and 5 is 2.0

    ```


    1. Write a Python script to prompt users to enter the lengths of a triangle sides.
    Then calculate the semiperimeters. Calculate the triangle area and display the
    result to the user. The area of a triangle is `(s*(s-a)*(s-b)*(s-c))-1/2`.


    **Answer:**


    ```

    In [3]:a = float(input(''Enter first side: ''))

    b = float(input(''Enter second side: ''))

    c = float(input(''Enter third side: ''))

