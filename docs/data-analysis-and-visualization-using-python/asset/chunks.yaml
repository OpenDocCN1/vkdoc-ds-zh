    print (df1)

    print ("\n")

    df2= df1.copy() # copy df1 into df2 using copy() method

    print (df2)

    #delete columns using del and pop methods

    del df2[''Test2'']

    df2.pop(''Project'')

    print ("\n")

    print (df1)

    print ("\n")

    print (df2)

