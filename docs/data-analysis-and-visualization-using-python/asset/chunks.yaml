    Ahmed       70.0     71.00

    Ali         89.0     85.33

    Omar        55.0     73.33

    Salwa       NaN      NaN

    清单 6-17

    从数据框中删除列

    ```


    为了解决这个问题，你可以使用 `df.copy()` 方法代替赋值运算符（`=`）。清单 6-18 展示了依次使用 `del()` 和 `pop()` 方法删除变量
    `Test2` 和 `Project`，但只有 `df2` 受到了影响，而 `df1` 保持不变。


    ```

    In [83]: # 添加一个新列

    import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    df1 = pd.DataFrame(data)

    df1[''Project''] = pd.Series([90,83,67, 87],index=[''Ali'',''Omar'',''Salwa'',
    ''Ahmed''])

    print ("\n")

    df1[''Average''] = round((df1[''Test1'']+df1[''Test2'']+df1[''Project''])/3, 2)

    print (df1)

    print ("\n")

    df2= df1.copy() # 使用 copy() 方法将 df1 复制到 df2

    print (df2)

    #使用 del 和 pop 方法删除列

    del df2[''Test2'']

    df2.pop(''Project'')

    print ("\n")

    print (df1)

    print ("\n")

    print (df2)

