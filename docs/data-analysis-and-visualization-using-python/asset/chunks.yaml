    \nData Visualization\n\n@July 2018\n```\n\n***答案：***\n\n```\nfrom bs4 import BeautifulSoup\n\
    soup = BeautifulSoup(htmldata, 'html.parser')\nprint(soup.prettify())\nprint(soup.get_text())\n\
    ```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figav_HTML.jpg](img/472943_1_En_5_Figav_HTML.jpg)\
    \ ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figaw_HTML.jpg](img/472943_1_En_5_Figaw_HTML.jpg)\n\
    \n# 6. 数据探索与分析\n\n如今，每天都会收集海量数据并分发到各种渠道。这需要高效且灵活的数据分析工具。Python 的开源 Pandas 库填补了这一空白，并处理三种不同的数据结构：序列、数据框和面板。*序列*是一维数据结构，例如字典、数组、列表、元组等。*数据框*是包含异构数据类型的二维数据结构，即表格数据。*面板*指的是三维数据结构，例如三维数组。需要明确的是，高维数据结构是其低维数据结构的容器。换句话说，面板是数据框的容器，而数据框是序列的容器。\n\
    \n## 序列数据结构\n\n如前所述，序列是一维数据的序列，例如字典、列表、数组、元组等。\n\n### 创建序列\n\nPandas 提供了一个 `Series()`\
    \ 方法，用于创建序列结构。大小为 `n` 的序列结构应具有长度为 `n` 的索引。默认情况下，Pandas 创建从 0 开始到 `n`-1 结束的索引。可以使用构造函数\
    \ `pandas.Series(data, index, dtype, copy)` 创建 Pandas 序列，其中 `data` 可以是数组、常量、列表等。序列\
    \ `index` 应该是唯一的、可哈希的，并且长度为 `n`，而 `dtype` 是一种数据类型，可以显式声明或从接收到的数据中推断。清单 6-1 创建了一个具有默认索引和自定义索引的序列。\n\
    \n```\nIn [5]: import pandas as pd\nimport numpy as np\ndata = np.array(['O','S','S','A'])\n\
    S1 = pd.Series(data) # 不添加索引\nS2 = pd.Series(data,index=[100,101,102,103]) # 添加索引\
    \ print (S1) print (\"\\n\") print (S2)\n0    O\n1    S\n2    S\n3    A\ndtype:\
    \ object\n100  O\n101  S\n102  S\n103  A\ndtype: object\nIn [40]:import pandas\
    \ as pd\nimport numpy as np\nmy_series2 = np.random.randn(5, 10)\nprint (\"\\\
    nmy_series2\\n\", my_series2)\n清单 6-1\n创建序列\n```\n\n这是创建包含 5 行 10 列的随机值序列的输出。\n\
    \n![../images/472943_1_En_6_Chapter/472943_1_En_6_Figa_HTML.jpg](img/472943_1_En_6_Figa_HTML.jpg)\n\
    \n如前所述，您可以从字典创建序列；清单 6-2 演示了如何为数据序列创建索引。\n\n```\nIn [6]: import pandas as pd\n\
    import numpy as np\ndata = {'X' : 0., 'Y' : 1., 'Z' : 2.}\nSERIES1 = pd.Series(data)\n\
    print (SERIES1)\nX 0.0\nY 1.0\nZ 2.0\ndtype: float64\nIn [7]: import pandas as\
    \ pd\nimport numpy as np\ndata = {'X' : 0., 'Y' : 1., 'Z' : 2.}\nSERIES1 = pd.Series(data,index=['Y','Z','W','X'])\n\
    print (SERIES1)\nY 1.0\nZ 2.0\nW NaN\nX 0.0\ndtype: float64\n清单 6-2\n创建带索引的序列\n\
    ```\n\n如果您可以从标量值创建序列数据，如清单 6-3 所示，那么索引是必需的，并且标量值将重复以匹配给定索引的长度。\n\n```\nIn [9]:\
    \ # 使用标量创建序列\nimport pandas as pd\nimport numpy as np\nSeries1 = pd.Series(7,\
    \ index=[0, 1, 2, 3, 4])\nprint (Series1)\n0    7\n1    7\n2    7\n3    7\n4 \
    \   7\ndtype: int64\n清单 6-3\n使用标量创建序列\n```\n"
- fmt: '### Accessing Data from a Series with a Position


    Like lists, you can access a series data via its index value. The examples in
    Listing [6-4](#472943_1_En_6_Chapter.xhtml#PC4) demonstrate different methods
    of accessing a series of data. The first example demonstrates retrieving a specific
    element with index 0. The second example retrieves indices 0, 1, and 2. The third
    example retrieves the last three elements since the starting index is -3 and moves
    backward to -2, -1. The fourth and fifth examples retrieve data using the series
    index labels.


    ```

    In [18]: import pandas as pd

    Series1 = pd.Series([1,2,3,4,5],index =

    [''a'',''b'',''c'',''d'',''e''])

    print ("Example 1:Retrieve the first element")

    print (Series1[0] )

    print ("\nExample 2:Retrieve the first three element")

    print (Series1[:3])

    print ("\nExample 3:Retrieve the last three element")

    print(Series1[-3:])

    print ("\nExample 4:Retrieve a single element")

    print (Series1[''a''])

    print ("\nExample 5:Retrieve multiple elements")

    print (Series1[[''a'',''c'',''d'']])

    Listing 6-4

    Accessing a Data Series

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figb_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figb_HTML.jpg)


    ### Exploring and Analyzing a Series


    Numerous statistical methods can be applied directly on a data series. Listing
    [6-5](#472943_1_En_6_Chapter.xhtml#PC5) demonstrates the calculation of mean,
    max, min, and standard deviation of a data series. Also, the `.describe()` method
    can be used to give a data description, including quantiles.


    ```

    In [10]: import pandas as pd

    import numpy as np

    my_series1 = pd.Series([5, 6, 7, 8, 9, 10])

    print ("my_series1\n", my_series1)

    print ("\n Series Analysis\n ")

    print ("Series mean value : ", my_series1.mean()) # find mean value in a series

    print ("Series max value : ",my_series1.max()) # find max value in a series

    print ("Series min value : ",my_series1.min()) # find min value in a series

    print ("Series standard deviation value : ",my_series1.std()) # find standard
    deviation

    my_series1

    0    5

