    You can use iteration statements to go through a string forward or backward. A
    lot of computations involve processing a string one character at a time. String
    processing can start at the beginning, select each character in turn, do something
    to it, and continue until the end. This pattern of processing is called a *traversal*.
    One way to write a traversal is with a `while` loop, as shown in Listing [1-24](#472943_1_En_1_Chapter.xhtml#PC32).


    ```

    In [30]:# Looking through string

    fruit =''banana''

    index=0

    while index'')

    if line[0]==''#'':

    continue

    if line ==''done'':

    break

    print (line )

    print (''End!'')

