    ## Matplotlib Plot


    Matplotlib is a Python 2D plotting library that produces high-quality figures
    in a variety of hard-copy formats and interactive environments across platforms.
    In Matplotlib, you can add features one by one, such as adding a title, labels,
    legends, and more.


    ### Line Plot


    In inline plotting, you should determine the x- and y-axes, and then you can add
    more features such as a title, a legend, and more (see Listing [7-16](#472943_1_En_7_Chapter.xhtml#PC36)).


    ```

    In [2]: import matplotlib.pyplot as plt

    x =[3,6,8,11,13,14,17,19,21,24,33,37]

    y = [7.5,12,13.2,15,17,22,24,37,34,38.5,42,47]

    x2 =[3,6,8,11,13,14,17,19,21,24,33]

    y2 = [50,45,33,24,21.5,19,14,13,10,6,3]

    plt.plot(x,y, label=''First Line'')

    plt.plot(x2, y2, label=''Second Line'')

    plt.xlabel(''Plot Number'')

    plt.ylabel(''Important var'')

    plt.title(''Interesting Graph\n2018 '')

    plt.yticks([0,5,10,15,20,25,30,35,40,45,50],

    [''0B'',''5B'',''10B'',''15B'',''20B'',''25B'',''30B'',''35B'',''40B'',''45B'',''50

    B''])

    plt.legend()

    plt.show()

    Listing 7-16

    Matplotlib Line Plotting

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figaj_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figaj_HTML.jpg)


    ```

    In [13]: plt.plot(phd, label=''Ph.D.'')

    plt.plot(service, label="service")

    plt.xlabel(''Ph.D./service'')

    plt.ylabel(''Frequency'')

    plt.title(''Ph.D./service\nDistribution'')

    plt.legend()

    plt.show()

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figak_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figak_HTML.jpg)


    ```

    In [15]: plt.plot(phd, service, ''bo'', label="Ph.D. Vs services", lw=10)

    plt.grid()

    plt.legend()

    plt.xlabel(''Ph.D'')

    plt.ylabel(''service'')

    plt.title(''Ph.D./salary\nDistribution'')

    plt.yscale(''log'')

    ```


