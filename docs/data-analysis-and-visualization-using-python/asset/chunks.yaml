  trans: "\n# 数据清洗\n\n数据是通过各种方法手动或自动收集的，例如气象传感器、金融股票市场数据服务器、用户的在线商业偏好等。收集到的数据并非没有错误，通常存在各种缺失数据点和错误输入的数据。例如，在线用户可能因隐私问题而不愿输入其信息。因此，处理缺失和噪声数据（`NA`\
    \ 或 `NaN`）对于任何数据分析处理都至关重要。\n\n## 检查缺失值\n\n你可以使用内置的 Python 方法来检查缺失值。让我们使用 `Numpy`\
    \ 和 `Pandas` 库创建一个数据框。包含索引值 `a` 到 `h`，并为列指定标签 `stock1`、`stock2` 和 `stock3`，如清单\
    \ 5-1 所示。\n\n```\nIn [47]: import pandas as pd\nimport numpy as np\ndataset =\
    \ pd.DataFrame(np.random.randn(5, 3), index=['a', 'c', 'e', 'f', 'h'],columns=['stock1',\
    \ 'stock2', 'stock3'])\ndataset.rename(columns={\"one\":'stock1',\"two\":'stock2',\
    \ \"three\":'stock3'}, inplace=True)\ndataset = dataset.reindex(['a', 'b', 'c',\
    \ 'd', 'e', 'f', 'g', 'h'])\nprint (dataset)\n清单 5-1\n创建包含 NaN 的数据框\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figa_HTML.jpg](img/472943_1_En_5_Figa_HTML.jpg)\n\
    \n应该清楚的是，你可以使用 `Numpy` 创建一个随机值数组，如清单 5-2 所示。\n\n```\nIn [46]: import numpy as\
    \ np\nnp.random.randn(5, 3)\n清单 5-2\n创建随机值矩阵\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figb_HTML.jpg](img/472943_1_En_5_Figb_HTML.jpg)\n\
    \n在清单 5-2 中，你忽略了行 `b`、`d` 和 `g`。这就是你得到 `NaN` 的原因，它表示非数值。`Pandas` 提供了 `isnull()`\
    \ 和 `notnull()` 函数来检测数据集中的缺失值。当检测到 `NaN` 时，会返回一个布尔值；否则，返回 `False`，如清单 5-3 所示。\n\
    \n```\nIn [48]: print (dataset['stock1'].isnull())\n清单 5-3\n检查空值情况\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figc_HTML.jpg](img/472943_1_En_5_Figc_HTML.jpg)\n\
    \n## 处理缺失值\n\n有多种技术可用于处理缺失值。\n\n*   你可以用标量值替换 `NaN`。\n\n    清单 5-4 将所有 `NaN` 情况替换为\
    \ `0` 值。\n\n    ```\n    In [49]: print (dataset)\n    dataset.fillna(0)\n   \
    \ 清单 5-4\n    用标量值替换 NaN\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figd_HTML.jpg](img/472943_1_En_5_Figd_HTML.jpg)\n\
    \n*   你可以向前和向后填充 `NaN` 情况。\n\n    另一种处理缺失值的技术是使用 `pad`/`fill` 方法向前填充，或使用 `bfill`/`backfill`\
    \ 方法向后填充。在清单 5-5 中，行 `a` 的值复制到了行 `b` 的缺失值中。\n\n    ```\n    In [50]: # 向前填充缺失值\n\
    \    print (dataset)\n    dataset.fillna(method='pad')\n    清单 5-5\n    向前填充缺失值\n\
    \    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Fige_HTML.jpg](img/472943_1_En_5_Fige_HTML.jpg)\n\
    \n*   你可以删除缺失值。\n\n    另一种技术是排除所有包含 `NaN` 值的行。`Pandas` 的 `dropna()` 函数可用于从数据集中删除整行。如清单\
    \ 5-6 所示，行 `b`、`d` 和 `g` 已从数据集中完全删除。\n\n    ```\n    In [51]: print (dataset)\n\
    \    dataset.dropna()\n    清单 5-6\n    删除所有包含 NaN 的行\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figf_HTML.jpg](img/472943_1_En_5_Figf_HTML.jpg)\n\
    \n*   你可以替换缺失（或通用）值。\n\n    `replace()` 方法可用于将数据集中的特定值替换为另一个给定值。此外，它还可用于替换 `NaN`\
    \ 情况，如清单 5-7 所示。\n\n    ```\n    In [52]: print (dataset)\n    dataset.replace(np.nan,\
    \ 0 )\n    清单 5-7\n    使用 replace() 函数\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figg_HTML.jpg](img/472943_1_En_5_Figg_HTML.jpg)\n"
- fmt: '# Reading and Cleaning CSV Data


    In this section, you will read data from a comma-separated values (CSV) file.
    The CSV sales file format shown in Figure [5-1](#472943_1_En_5_Chapter.xhtml#Fig1)
    will be used to demonstrate the data cleaning process.


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Fig1_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Sales data in CSV format


    You can use the Pandas library to read a file and display the first five records.
    An autogenerated index has been generated by Python starting with 0, as shown
    in Listing [5-8](#472943_1_En_5_Chapter.xhtml#PC8).


    ```

    In [53]: import pandas as pd

    sales = pd.read_csv("Sales.csv")

    print ("\n\n<<<<<<< First 5 records <<<<<<<\n\n" )

    print (sales.head())

    Listing 5-8

    Reading a CSV File and Displaying the First Five Records

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figh_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figh_HTML.jpg)


    You can display the last five records using the `tail()` method.


    ```

    In [54]:  print (sales.tail())

    ```


    `pd.read_csv()` is used to read the entire CSV file; sometimes you need to read
    only a few records to reduce memory usage, though. In that case, you can use the
    `nrows` attribute to control the number of rows you want to read.


    ```

    In [55]:   import pandas as pd

    salesNrows = pd.read_csv("Sales.csv", nrows=4)

    salesNrows

    ```


    Similarly, you can read specific columns using a column index or label. Listing
    [5-9](#472943_1_En_5_Chapter.xhtml#PC11) reads columns 0, 1, and 6 using the `usecols`
    attribute and then uses the column labels instead of the column indices.


    ```

    In [58]: salesNrows = pd.read_csv("Sales.csv", nrows=4, usecols=[0, 1, 6])

    salesNrows

    Listing 5-9

    Renaming Column Labels

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figi_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figi_HTML.jpg)


    ```

    In [60]: salesNrows = pd.read_csv("Sales.csv", nrows=4, usecols=[''SALES_ID''
    , ''SALES_BY_REGION'', ''FEBRUARY'', ''MARCH''])

    salesNrows

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figj_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figj_HTML.jpg)


    In Listing [5-10](#472943_1_En_5_Chapter.xhtml#PC13), the `.rename()` method is
    used to change data set column labels (e.g., `SALES_ID` changed to `ID`). In addition,
    you set `inplace=True` to commit these changes to the original data set, not to
    a copy of it.


    ```

    In [56]: salesNrows.rename(columns={"SALES_ID":''ID'',"SALES_BY_REGION":''REGION''},
    inplace=True)

    salesNrows

    Listing 5-10

    Renaming Column Labels

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figk_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figk_HTML.jpg)


    You can find the unique values in your data set variables; you just refer to each
    column as a variable or pattern that can be used for further processing. See Listing
    [5-11](#472943_1_En_5_Chapter.xhtml#PC14).


    ```

    In [57]: print (len(salesNrows[''JANUARY''].unique()))

    print (len(salesNrows[''REGION''].unique()))

    print (salesNrows[''JANUARY''].unique())

    Listing 5-11

    Finding Unique Values in Columns

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figl_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figl_HTML.jpg)


    To get precise data, you can replace all values that are anomalies with NaN for
    further processing. For example, as shown in Listing [5-12](#472943_1_En_5_Chapter.xhtml#PC15),
    you can use `na_values =["n.a.", "not avilable", -1]` to generate NaN cases while
    you are reading the CSV file.


    ```

    In [61]: import pandas as pd

    sales = pd.read_csv("Sales.csv", nrows=7, na_values =["n.a.", "not avilable"])

    mydata = sales.head(7)

    mydata

    Listing 5-12

    Automatically Replacing Matched Cases with NaN

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figm_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figm_HTML.jpg)


    ```

    In [62]: import pandas as pd

    sales = pd.read_csv("Sales.csv", nrows=7, na_values =["n.a.", "not avilable",
    -1])

    mydata = sales.head(7)

    mydata

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Fign_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Fign_HTML.jpg)


    Since you have different patterns in a data set, you should be able to use different
    values for data cleaning and replacement. The following example is reading from
    the `sales.csv` file and storing the data into the sales data frame. All values
    listed in the `na_values` attribute are replaced with the NaN value. So, for the
    January column, all `["n.a.", "not available", -1]` values are converted into
    NaN.


    ```

    In [25]: sales = pd.read_csv("Sales.csv", na_values = {

    "SALES_BY_REGION": ["n.a.", "not avilabl”],

    "JANUARY": ["n.a.", "not avilable", -1],

    "FEBRUARY": ["n.a.", "not avilable", -1]})

    sales.head(20)

    ```


    Another professional method to clean data, while you are loading it, is to define
    functions for data cleaning. In Listing [5-13](#472943_1_En_5_Chapter.xhtml#PC18),
    you define and call two functions: `CleanData_Sales()` to clean numerical values
    and reset all NaN values to 0 and `CleanData_REGION()` to clean string values
    and reset all NaN values to `Abu Dhabi`. Then you call these functions in the
    `converters` attribute.


    ```

    In [26]: def CleanData_Sales(cell):

    if (cell=="n.a." or cell=="-1" or cell=="not avilable"):

    return 0

    return cell

    def CleanData_REGION(cell):

    if (cell=="n.a." or cell=="-1" or cell=="not avilable"):

    return ''AbuDhabi''

    return cell

    In [28]: sales = pd.read_csv("Sales.csv", nrows=7, converters={

    "SALES_BY_REGION": CleanData_REGION,

    "JANUARY": CleanData_Sales,

    "FEBRUARY": CleanData_Sales,

    "APRIL": CleanData_Sales,

    })

    sales.head(20)

    Listing 5-13

    Defining and Calling Functions for Data Cleaning

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figo_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figo_HTML.jpg)'
