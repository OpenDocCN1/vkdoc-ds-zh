    ## 从 JSON 格式读取数据


    Pandas 库可以使用 `read_json` 函数直接从云端或硬盘读取 JSON 文件。清单 5-19 演示了如何创建 JSON 数据并以 JSON 格式加载，然后迭代或操作数据。JSON
    格式类似于字典结构，具有键值对，但在 JSON 中，你可以拥有带有内部值的子属性，类似于第一个示例中的 `email`，以及其子属性 `hide`，值为 `NO`。


    ```

    In [73]: import json data = ''''''{

    "name" : "Ossama",

    "phone" : { "type" : "intl", "number" : "+971 50 244 5467"},

    "email" : {"hide" : "No" }

    }''''''

    info = json.loads(data)

    print (''Name:'',info["name"])

    print (''Hide:'',info["email"]["hide"])

    Name: Ossama

