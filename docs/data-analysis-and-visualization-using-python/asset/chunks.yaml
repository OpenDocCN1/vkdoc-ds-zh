    ```

    In [17]: dataset.plot(kind=''scatter'', x="phd", y="service", title=''Popuation
    vs area and density\n 2018'', s=0.9)

    Listing 7-9

    Scatter Plotting

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figm_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figm_HTML.jpg)


    ## Seaborn Plotting System


    The Python Seaborn library provides various plotting representations for visualizing
    data. A strip plot is a scatter plot where one of the variables is categorical.
    Strip plots can be combined with other plots to provide additional information.
    For example, a box plot with an overlaid strip plot is similar to a violin plot
    because some additional information about how the underlying data is distributed
    becomes visible. Seaborn’s swarm plot is virtually identical to a strip plot except
    that it prevents data points from overlapping.


    ### Strip Plot


    Listing [7-10](#472943_1_En_7_Chapter.xhtml#PC14) uses strip plotting to display
    data per salary category.


    ```

    In [3]: # Simple stripplot sns.stripplot( x = dataset[''salary''])

    Listing 7-10

    Simple Strip Plot

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Fign_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Fign_HTML.jpg)


    ```

    In [4]: # Stripplot over categories

    sns.stripplot( x = dataset[''sex''], y= dataset[''salary''], data=dataset);

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figo_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figo_HTML.jpg)


    The previous example visualizes the `salary` variable per gender.


    You can visualize the data vertically or horizontally using Listing [7-11](#472943_1_En_7_Chapter.xhtml#PC16),
    which presents two disciplines, A and B. Discipline B has a bigger range and higher
    packages compared to discipline A.


    ```

    In [5]: # Stripplot over categories

    sns.stripplot( x = dataset[''discipline''], y = dataset[''salary''], data=dataset,
    jitter=1)

    Listing 7-11

    Strip Plot with Vertical and Horizontal Visualizing

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figp_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figp_HTML.jpg)


    ```

    In [6]: # Stripplot over categories Horizontal

    sns.stripplot( x= dataset[''salary''], y = dataset[''discipline''], data=dataset,
    jitter=True);

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figq_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figq_HTML.jpg)


    You can visualize data in a strip plot per category; Listing [7-12](#472943_1_En_7_Chapter.xhtml#PC18)
    uses the assistance prof, associate prof, and full professor categories. The `hue`
    attribute is used to determine the `legend` attribute.


    ```

    In [7]: # Stripplot over categories

    sns.stripplot( x = dataset[''rank''], y= dataset[''salary''], data=dataset, jitter=True);

    Listing 7-12

    Strip Plot per Category

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figr_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figr_HTML.jpg)


    ```

    In [8]: # Add hue to the graph

    # Stripplot over categories

    sns.stripplot( x =''sex'', y= ''salary'', hue="rank", data=dataset, jitter=True
    )

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figs_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figs_HTML.jpg)'
