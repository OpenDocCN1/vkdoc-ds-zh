- fmt: '### Column Deletion


    You can delete any column using the `del` method. For example, `del df2[''Test2'']`
    deletes the `Test2` column from the data set. In addition, you can use the `pop`
    method to delete a column. For example, `df2.pop(''Project'')` is used to delete
    the column `Project`. However, you should be careful when you use the `del` or
    `pop` method since a reference might exist. In this case, it deletes not only
    from the executed data frame but also from the referenced data frame. Listing
    [6-16](#472943_1_En_6_Chapter.xhtml#PC18) creates the data frame `df1` and copies
    `df1` to `df2`.


