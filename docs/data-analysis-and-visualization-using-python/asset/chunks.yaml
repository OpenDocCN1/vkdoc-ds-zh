  trans: "\n### 访问元组中的值\n\n要访问元组中的元素，可以使用方括号和元素索引来获取元素值，如代码清单 3-23 所示。\n\n```\nIn\
    \ [4]:MarksCIS = (70, 85, 55)\nMarksCIN = (90, 75, 60)\nprint (\"CIS 的第三个分数是 \"\
    , MarksCIS[2])\nprint (\"CIN 的第三个分数是 \", MarksCIN[2])\nCIS 的第三个分数是 55\nCIN 的第三个分数是\
    \ 60\n代码清单 3-23\n访问元组中的值\n```\n\n你可以使用 `del` 删除元组，如代码清单 3-24 所示。\n\n```\nIn [5]:\
    \ MarksCIN = (90, 75, 60)\nprint (MarksCIN)\ndel MarksCIN\nprint (MarksCIN)\n\
    (90, 75, 60)\n\nNameError                                 Traceback (most recent\
    \ call last)\n in ()\n2 print (MarksCIN) 3 del MarksCIN\n----> 4 print (MarksCIN)\n\
    NameError: name 'MarksCIN' is not defined\n代码清单 3-24\n删除元组\n```\n\n你收到错误是因为你要求\
    \ Python 打印一个名为 `MarksCIN` 的元组，而该元组已被删除。你可以正向和反向访问元组元素；此外，你还可以使用索引从元组中切片取值。代码清单\
    \ 3-25 展示了如何进行正向切片，其中 `MarksCIS[1:4]` 获取从元素 1 到元素 3 的元素，而 `MarksCIS[:]` 获取元组中的所有元素。在反向切片中，`MarksCIS[-3]`\
    \ 反向获取第三个元素，`MarksCIS[-4:-2]` 反向获取从第四个元素到第三个元素（但不包括第二个反向元素）。\n\n```\nIn [6]: MarksCIS\
    \ = (88, 65, 70,90,85,45,78,95,55)\nprint (\"\\n 正向切片\")\nprint (MarksCIS[1:4])\n\
    print (MarksCIS[:3])\nprint (MarksCIS[6:])\nprint (MarksCIS[4:6])\nprint (\"\\\
    n 反向切片\")\nprint (MarksCIS[-4:-2])\nprint (MarksCIS[-3])\nprint (MarksCIS[-3:])\n\
    print (MarksCIS[ :-3])\n正向切片\n(65, 70, 90)\n(88, 65, 70)\n(78, 95, 55)\n(85, 45)\n\
    反向切片\n(45, 78)\n\n(78, 95, 55)\n(88, 65, 70, 90, 85, 45)\n代码清单 3-25\n切片元组值\n```\n\
    \n### 基本元组操作\n\n与字符串类似，元组支持 `+` 和 `*` 运算符，分别用于连接和重复，以生成新的元组。参见表 3-5。\n\n**表 3-5**\
    \ 元组操作\n\n| **表达式** | **结果** | **描述** |\n| --- | --- | --- |\n| `len((5, 7, 2,6))`\
    \ | `4` | 长度 |\n| `(1, 2, 3,10) + (4, 5, 6,7)` | `(1, 2, 3,10, 4, 5, 6,7)` | 连接\
    \ |\n| `('Hi!',) * 4` | `('Hi!', 'Hi!', 'Hi!', 'Hi!')` | 重复 |\n| `10 in (10, 2,\
    \ 3)` | `True` | 成员关系 |\n| `for x in (10, 1, 5): print x,` | `10 1 5` | 迭代 |\n\
    \n## 序列\n\n序列被定义为一维带标签的数组，能够容纳任何数据类型（整数、字符串、浮点数、Python 对象等）。\n\n```\nSeriesX =\
    \ pd.Series(data, index=index),\n```\n\n这里，`pd` 是 Pandas 的缩写，`data` 指的是一个 Python\
    \ 字典、一个 ndarray，甚至是一个标量值。\n\n### 创建带索引的序列\n\n如果数据是 ndarray，则直接传递一个轴标签列表作为索引；否则，Python\
    \ 会自动创建一个从 0 到 n-1 的索引。参见代码清单 3-26 和代码清单 3-27。\n\n```\nIn [9]:import numpy as\
    \ np\nimport pandas as pd\nSeries2 = pd.Series(np.random.randn(4))\nprint(Series2)\n\
    print(Series2.index)\n0 1.784219\n1 -0.627832\n2 0.429453\n3 -0.473971\ndtype:\
    \ float64\nRangeIndex(start=0, stop=4, step=1)\n代码清单 3-27\n创建无标签的 Ndarray 数据序列\n\
    ```\n\n```\nIn [8]: import numpy as np\nimport pandas as pd\nSeries1 = pd.Series(np.random.randn(4),\
    \ index=['a', 'b', 'c', 'd'])\nprint(Series1)\nprint(Series1.index)\na 0.350241\n\
    b -1.214802\nc 0.704124\nd 0.866934\ndtype: float64\nIndex(['a', 'b', 'c', 'd'],\
    \ dtype=\"object\")\n代码清单 3-26\n创建带标签的 Ndarray 数据序列\n```\n\n从 ndarray 创建序列对大多数\
    \ Numpy 函数都有效；此外，像切片这样的操作也会对索引进行切片。参见代码清单 3-28 和代码清单 3-29。\n\n```\nIn [11]:  print\
    \ (\"\\n 序列示例操作\")\nprint (\"\\n 大于均值的序列值: %.4f\" % Series1.mean())\nprint (Series1\
    \ [Series1> Series1.mean()])\nprint (\"\\n 大于中位数的序列值:%.4f\" % Series1.median())\n\
    print (Series1 [Series1> Series1.median()])\nprint (\"\\n 指数值 \")\nSeries1Exp\
    \ = np.exp(Series1)\nprint (Series1Exp)\n序列示例操作\n大于均值的序列值: 0.1766\na    0.350241\n\
    c    0.704124\nd    0.866934\ndtype: float64\n大于中位数的序列值: 0.5272\nc    0.704124\n\
    d    0.866934\ndtype: float64\n指数值\na    1.419409\nb    0.296769\nc    2.022075\n\
    d    2.379604\ndtype: float64\n代码清单 3-29\n序列中的示例操作\n```\n\n```\nIn [10]: print\
    \ (\" \\n 序列切片 \")\nprint (Series1[:3])\nprint (\"\\n 索引访问\")\nprint (Series1[[3,1,0]])\n\
    print (\"\\n 单个索引\")\nx = Series1[0]\nprint (x)\n序列切片\na 0.350241\nb -1.214802\n\
    c 0.704124\ndtype: float64\n索引访问\nd 0.866934\nb -1.214802\na 0.350241\ndtype:\
    \ float64\n单个索引\n0.35024081401881596\n代码清单 3-28\n从序列中切片数据\n```\n\n### 从字典创建序列\n\
    \n你可以直接从字典创建序列，如代码清单 3-30 所示。如果你没有显式传递索引，Python 3.6 及以上版本会按照字典插入顺序来确定序列索引。否则，序列索引将是字典键的按字典序排列的列表。\n\
    \n```\nIn [12]: dict = {'m' : 2, 'y' : 2018, 'd' : 'Sunday'}\nprint (\"\\n 未声明索引的序列\"\
    )\nSeriesDict1 = pd.Series(dict)\nprint(SeriesDict1)\nprint (\"\\n 声明了索引的序列\"\
    )\nSeriesDict2 = pd.Series(dict, index=['y', 'm', 'd', 's']) print(SeriesDict2)\n\
    未声明索引的序列\nd    Sunday\nm    2\ny    2018\ndtype: object\n声明了索引的序列\ny    2018\n\
    m    2\nd    Sunday\ns    NaN\ndtype: object\n代码清单 3-30\n从字典创建序列\n```\n\n你可以使用\
    \ `get` 方法通过索引标签访问序列值，如代码清单 3-31 所示。\n\n```\nIn [13]: print (\"\\n 使用 get 和 set\
    \ 方法通过索引标签\"\n\"访问序列值\\n\")\nSeriesDict2 = pd.Series(dict, index=['y', 'm', 'd',\
    \ 's']) print (SeriesDict2['y']) # 显示年份 SeriesDict2['y']=1999     # 更改年份值\nprint\
    \ (SeriesDict2)           # 显示所有字典值 print (SeriesDict2.get('y')) # 通过键获取特定值\n\
    使用 get 和 set 方法通过索引标签访问序列值\n\ny   1999\nm   2\nd   Sunday\ns   NaN\ndtype: object\n\
    \n代码清单 3-31\n修改序列并使用 Get() 方法\n```\n\n### 从标量值创建序列\n\n如果数据是标量值，则必须提供索引。该值将被重复以匹配\
    \ `index` 的长度。参见代码清单 3-32。\n\n```\nIn [14]: print (\"\\n 从标量值创建序列 \")\nScl = pd.Series(8.,\
    \ index=['a', 'b', 'c', 'd'])\nprint (Scl)\n从标量值创建序列\na   8.0\nb   8.0\nc   8.0\n\
    d   8.0\ndtype: float64\n代码清单 3-32\n使用标量值创建序列\n```\n"
- fmt: '### Vectorized Operations and Label Alignment with Series


    `Series` operations automatically align the data based on label. Thus, you can
    write computations without giving consideration to whether the series involved
    have the same labels. If labels are not matches, it gives a missing value `NaN`.
    See Listing [3-33](#472943_1_En_3_Chapter.xhtml#PC33).


    ```

    In [16]: SerX = pd.Series([1,2,3,4], index=[''a'', ''b'', ''c'', ''d''])

    print ("Addition");

    print( SerX + SerX)

    print ("Addition with non-matched labels");

    print (SerX[1:] + SerX[:-1])

    print ("Multiplication");

    print (SerX * SerX)

    print ("Exponential");

    print (np.exp(SerX))

    Addition

    a 2

    b 4

    c 6

    d 8

    dtype: int64

    Addition with non-matched labels

    a  NaN

    b  4.0

    c  6.0

    d  NaN

    dtype: float64

    Multiplication

    a  1

    b  4

    c  9

    d  16

    dtype: int64

    Exponential

    a  2.718282

    b  7.389056

    c  20.085537

    d  54.598150

    dtype: float64

    Listing 3-33

    Vectorizing Operations on a Series

    ```


    ### Name Attribute


    You can name a series; also, you can alter a series, as shown in Listing [3-34](#472943_1_En_3_Chapter.xhtml#PC34).


    ```

    In [17]:std = pd.Series([77,89,65,90], name="StudentsMarks")

    print (std.name)

    std = std.rename("Marks")

    print (std.name)

    StudentsMarks

    Marks

    Listing 3-34

    Using a Series Name Attribute

    ```


    ## Data Frames


    A *data frame* is a two-dimensional tabular labeled data structure with columns
    of potentially different types. A data frame can be created from numerous data
    collections such as the following:


    *   A 1D `ndarray`, list, `dict`, or series

    *   2D Numpy `ndarray`

    *   [Structured or record](http://docs.scipy.org/doc/numpy/user/basics.rec.html)
    `ndarray`

    *   A series

    *   Another data frame


    A data frame has arguments, which are an index (row labels) and columns (column
    labels).


    ### Creating Data Frames from a Dict of Series or Dicts


    You can simply create a data frame from a dictionary of series; it’s also possible
    to assign an index. If there is an index without a value, it gives a `NaN` value,
    as shown in Listing [3-35](#472943_1_En_3_Chapter.xhtml#PC35).


    ```

    In [5]: import pandas as pd

    dict1 = {''one'' : pd.Series([1., 2., 3.], index=[''a'', ''b'', ''c'']),

    ''two'' : pd.Series([1., 2., 3., 4.], index=[''a'', ''b'', ''c'', ''d''])}

    df = pd.DataFrame(dict1)

    df

    Out[5]: one  two

    a    1.0    1.0

    b    2.0    2.0

    c    3.0    3.0

    d    NaN    4.0

    In [6]: # set index for the DataFrame

    pd.DataFrame(dict1, index=[''d'', ''b'', ''a''])

    Out[6]: one  two

    d    NaN    4.0

    b    2.0    2.0

    a    1.0    1.0

    In [8]: # Control the labels appearance of the DataFrame pd.DataFrame(dict1, index=[''d'',
    ''b'', ''a''], columns=[''two'', ''three'', ''one''])

    Out[8]: two  three  one

    d    4.0    NaN    NaN

    b    2.0    NaN    2.0

    a    1.0    NaN    1.0

    Listing 3-35

    Creating a Data Frame from a Dict of Series

    ```


    ### Creating Data Frames from a Dict of Ndarrays/Lists


    When you create a data frame from an `ndarray`, the ndarrays must all be the same
    length. Also, the passed index should be of the same length as the arrays. If
    no index is passed, the result will be `range(n)`, where `n` is the array length.
    See Listing [3-36](#472943_1_En_3_Chapter.xhtml#PC36).


    ```

    In [11]: # without index

    ndarrdict = {''one'' : [1., 2., 3., 4.],''two'' : [4., 3., 2., 1.]}

    pd.DataFrame(ndarrdict)

    Out[11]:           one    two

    0     1.0    4.0

    1     2.0    3.0

    2     3.0    2.0

    3     4.0    1.0

    In [12]: # Assign index

    pd.DataFrame(ndarrdict, index=[''a'', ''b'', ''c'', ''d''])

    Out[12]:     one    two

    a      1.0      4.0

    b      2.0      3.0

    c      3.0      2.0

    d      4.0      1.0

    Listing 3-36

    Creating a Data Frame from an Ndarray

    ```


    ### Creating Data Frames from a Structured or Record Array


    Listing [3-37](#472943_1_En_3_Chapter.xhtml#PC37) creates a data frame by first
    specifying the data types of each column and then the values of each row. `(''A'',
    ''i4'')` determines the column label and its data type as integers, `(''B'', ''f4'')`
    determines the label as B and the data type as float, and finally `(''C'', ''a10'')`
    assigns the label C and data type as a string with a maximum of ten characters.


    ```

    In [18]:import pandas as pd

    import numpy as np

    data = np.zeros((2,), dtype=[(''A'', ''i4''),(''B'', ''f4''),(''C'', ''a10'')])

    data[:] = [(1,2.,''Hello''), (2,3.,"World")]

    pd.DataFrame(data)

    Out[18]:     A      B      C

    0 1      2.0    b''Hello''

    1 2      3.0    b''World''

    In [16]: pd.DataFrame(data, index=[''First'', ''Second''])

    Out[16]:            A     B      C

    First      1     2.0    b''Hello''

    Second     2     3.0    b''World''

    In [17]: pd.DataFrame(data, columns=[''C'', ''A'', ''B''])

    Out[17]:      C         A     B

    0    b''Hello''  1     2.0

    1    b''World''  2     3.0

    Listing 3-37

    Creating a Data Frame from a Record Array

    ```


    ### Creating Data Frames from a List of Dicts


    Also, you can create data frame from a list of dictionaries, as shown in Listing
    [3-38](#472943_1_En_3_Chapter.xhtml#PC38).


    ```

    In [19]: data2 = [{''A '': 1, ''B '': 2}, {''A'': 5, ''B'': 10, ''C'': 20}]

    pd.DataFrame(data2)

    Out[19]: A  B       C

    0   1  2   NaN

    1   5  10  20.0

    In [20]: pd.DataFrame(data2, index=[''First'', ''Second''])

    Out[20]:           A   B      C

    First    1   2    NaN

    Second   5   10   20.0

    In [21]: pd.DataFrame(data2, columns=[''A'', ''B''])

    Out[21]:    A   B

    0  1   2

    1  5  10

    Listing 3-38

    Creating a Data Frame from a List of Dictionaries

    ```


    ### Creating Data Frames from a Dict of Tuples


    Another method to create a multi-indexed data frame is to pass a dictionary of
    tuples, as indicated in Listing [3-39](#472943_1_En_3_Chapter.xhtml#PC39).


    ```

    In [22]: pd.DataFrame({(''a'', ''b''): {(''A'', ''B''): 1, (''A'', ''C''): 2},

    (''a'', ''a''): {(''A'', ''C''): 3, (''A'', ''B''): 4},

    (''a'', ''c''): {(''A'', ''B''): 5, (''A'', ''C''): 6},

    (''b'', ''a''): {(''A'', ''C''): 7, (''A'', ''B''): 8},

    (''b'', ''b''): {(''A'', ''D''): 9, (''A'', ''B''): 10}})

    Listing 3-39

    Creating a Data Frame from a Dictionary of Tuples

    ```


    ![../images/472943_1_En_3_Chapter/472943_1_En_3_Figc_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Figc_HTML.jpg)


    ### Selecting, Adding, and Deleting Data Frame Columns


    Once you have a data frame, you can simply add columns, remove columns, and select
    specific columns. Listing [3-40](#472943_1_En_3_Chapter.xhtml#PC40) demonstrates
    how to alter a data frame and its related operations.


    ```

    In [25]: # DATAFRAME COLUMN SELECTION, ADDITION, DELETION

    ndarrdict = {''one'' : [1., 2., 3., 4.], ''two'' : [4., 3., 2., 1.]}

    df = pd.DataFrame(ndarrdict, index=[''a'', ''b'', ''c'', ''d''])

    df

    Listing 3-40

    Adding Columns and Making Operations on a Created Data Frame

    ```


    ![../images/472943_1_En_3_Chapter/472943_1_En_3_Figd_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Figd_HTML.jpg)


    ```

    In [26]: df[''three''] = df[''one''] * df[''two''] # Add column

    df[''flag''] = df[''one''] > 2     # Add column

    df

    ```


    ![../images/472943_1_En_3_Chapter/472943_1_En_3_Fige_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Fige_HTML.jpg)


    You can insert a scalar value to a data frame; it will naturally be propagated
    to fill the column. Also, if you insert a series that does not have the same index
    as the data frame, it will be conformed to the data frame’s index. To delete a
    column, you can use the `del` or `pop` method, as shown in Listing [3-41](#472943_1_En_3_Chapter.xhtml#PC42).


    ```

    In [27]: df[''Filler''] = ''HCT''

    df[''Slic''] = df[''one''][:2]

    df

    Listing 3-41

    Adding a Column Using a Scalar and Assigning to a Data Frame

    ```


    ![../images/472943_1_En_3_Chapter/472943_1_En_3_Figf_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Figf_HTML.jpg)


    ```

    In [28]:# Delet columns

    del df[''two'']

    Three = df.pop(''three'')

    df

    ```


    ![../images/472943_1_En_3_Chapter/472943_1_En_3_Figg_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Figg_HTML.jpg)


    ```

    In [29]: df.insert(1, ''bar'', df[''one''])

    df

    ```


    ![../images/472943_1_En_3_Chapter/472943_1_En_3_Figh_HTML.jpg](images/472943_1_En_3_Chapter/472943_1_En_3_Figh_HTML.jpg)


    By default, columns get inserted at the end. However, you can use the `insert()`
    function to insert at a particular location in the columns, as shown previously.'
