    101 COM Computers\n205 MAT Mathematics\n189 ENG English\"\"\"\n```\n\n```\nIn\
    \ [66]: import re\nCoursesData = \"\"\"10 COM Computers\n205 MAT Mathematics 1899\
    \ ENG English\"\"\"\nprint(re.findall('\\d{4}', CoursesData)) # {n} Matches repeat\
    \ n times.\nprint(re.findall('\\d{2,4}', CoursesData))\n['1899']\n['10', '205',\
    \ '1899']\n```\n\n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT Mathematics\n\
    189 ENG English\"\"\"\n```\n\n# 5. Data Gathering and Cleaning\n\nIn the 21st\
    \ century, data is vital for decision-making and developing long-term strategic\
    \ plans. Python provides numerous libraries and built-in features that make it\
    \ easy to support data analysis and processing. Making business decisions, forecasting\
    \ weather, studying protein structures in biology, and designing a marketing campaign\
    \ are all examples that require collecting data and then cleaning, processing,\
    \ and visualizing it.\n\nThere are five main steps for data science processing.\n\
    \n1.  *Data acquisition* is where you read data from various sources of unstructured\
    \ data, semistructured data, or full-structured data that might be stored in a\
    \ spreadsheet, comma-separated file, web page, database, etc.\n\n2.  *Data cleaning*\
    \ is where you remove noisy data and make operations needed to keep only the relevant\
    \ data.\n\n3.  *Exploratory analysis* is where you look at your cleaned data and\
    \ make statistical processing fits for specific analysis purposes.\n\n4.  An *analysis\
    \ model* needs to be created. Advanced tools such as machine learning algorithms\
    \ can be used in this step.\n\n5.  *Data visualization* is where the results are\
    \ plotted using various systems provided by Python to help in the decision-making\
    \ process.\n\nPython provides several libraries for data gathering, cleaning,\
    \ integration, processing, and visualizing.\n\n*   Pandas is an open source Python\
    \ library used to load, organize, manipulate, model, and analyze data by offering\
    \ powerful data structures.\n\n*   Numpy is a Python package that stands for “numerical\
    \ Python. It is a library consisting of multidimensional array objects and a collection\
    \ of routines for manipulating arrays. It can be used to perform mathematical,\
    \ logical, and linear algebra operations on arrays.\n\n*   SciPy is another built-in\
    \ Python library for numerical integration and optimization.\n\n*   Matplotlib\
    \ is a Python library used to create 2D graphs and plots. It supports a wide variety\
    \ of graphs and plots such as histograms, bar charts, power spectra, error charts,\
    \ and so on, with additional formatting such as control line styles, font properties,\
    \ formatting axes, and more."
  trans: "\n### 锚点\n\n锚点用于确定字符串中匹配模式的位置。表 4-8 展示了多个锚点示例。\n\n**表 4-8** 锚点字符\n\n| 序号\
    \ | 示例 | 描述 |\n| --- | --- | --- |\n| 1 | `^Python` | 匹配字符串或内部行开头的 `\"Python\"\
    ` |\n| 2 | `Python$` | 匹配字符串或行结尾的 `\"Python\"` |\n| 3 | `\\APython` | 匹配字符串开头的\
    \ `\"Python\"` |\n| 4 | `Python\\Z` | 匹配字符串结尾的 `\"Python\"` |\n| 5 | `\\bPython\\\
    b` | 匹配单词边界处的 `\"Python\"` |\n| 6 | `\\brub\\B` | `\\B` 是非单词边界：匹配 *rube* 和 *ruby*\
    \ 中的 `\"rub\"`，但不匹配独立的 `\"rub\"` |\n| 7 | `Python(?=!)` | 匹配后跟感叹号的 `\"Python\"\
    ` |\n| 8 | `Python(?!!)` | 匹配后不跟感叹号的 `\"Python\"` |\n\n正则表达式不仅用于从字符串中提取数据，各种内置方法也可用于相同目的。清单\
    \ 4-13 演示了使用方法与正则表达式提取相同字符的对比。\n\n```\nIn [54]: import re\nprint (\"\\nFine-Tuning\
    \ String Extraction \\n\")\nmystr=\"From ossama.embarak@hct.ac.ae Sat Jun 5 08:14:16\
    \ 2018\" Extract = re.findall('\\S+@\\S+',mystr)\nprint (Extract)\nE_xtracted\
    \ = re.findall('^From.*? (\\S+@\\S+)',mystr) # non greedy white space\nprint (E_xtracted)\n\
    print (E_xtracted[0])\nFine-Tuning String Extraction\n['ossama.embarak@hct.ac.ae']\n\
    ['ossama.embarak@hct.ac.ae']\nossama.embarak@hct.ac.ae\nIn [57]: mystr=\"From\
    \ ossama.embarak@hct.ac.ae Sat Jun 5 08:14:16 2018\"\natpos = mystr.find('@')\n\
    sppos = mystr.find(' ',atpos) # find white space starting from atpos\nhost = mystr[atpos+1\
    \ : sppos]\nprint (host)\nusernamepos = mystr.find(' ')\nusername = mystr[usernamepos+1\
    \ : atpos]\nprint (username)\nhct.ac.ae\nossama.embarak\nListing 4-13\nThe Use\
    \ of Methods vs. Regular Expressions\n```\n\n`re.findall('@([^ ]*)',mystr)` 从\
    \ `mystr` 字符串中检索子字符串，该子字符串从 `@` 之后开始，一直持续到找到空白字符为止。类似地，`re.findall('^From .*@([^\
    \ ]*)', mystr)` 从 `mystr` 字符串中检索子字符串，该子字符串从 `From` 之后开始，查找零个或多个字符，然后是 `@` 字符，*然后是除空白字符之外的任何字符。*\
    \ 参见清单 4-14。\n\n```\nIn [58]: print (\"\\n The Regex Version\\n\")\nimport re\n\
    mystr=\"From ossama.embarak@hct.ac.ae Sat Jun 5 08:14:16 2018\"\nExtract = re.findall('@([^\
    \ ]*)',mystr)\nprint (Extract)\nExtract = re.findall('^From .*@([^ ]*)',mystr)\n\
    print (Extract)\nThe Regex Version\n['hct.ac.ae']\n['hct.ac.ae']\nIn [59]: print\
    \ (\"\\nScape character \\n\")\nmystr = 'We just received $10.00 for cookies and\
    \ $20.23 for juice'\nExtract = re.findall('\\$[0-9.]+',mystr)\nprint (Extract)\n\
    Scape character\n['$10.00', '$20.23']\nListing 4-14\nUsing the Regular Expression\
    \ findall() Method\n```\n\n## 总结\n\n本章涵盖了从存储文件中读取或拉取，或直接从用户读取的输入/输出数据。让我们回顾一下本章涵盖的内容。\n\
    \n*   本章涵盖了如何打开文件进行读取、写入或两者兼有。此外，还涵盖了如何访问打开文件的属性以及关闭所有打开的会话。\n*   本章涵盖了如何通过屏幕直接从用户收集数据。\n\
    *   它涵盖了正则表达式及其模式以及特殊字符的用法。\n*   本章涵盖了如何应用正则表达式提取数据，以及如何使用替代、锚点和重复表达式进行数据提取。\n\
    \n下一章将研究收集和清理数据以进行进一步处理的技术，以及更多内容。\n\n## 练习与答案\n\n1.  编写一个 Python 脚本，使用正则表达式从以下文本中提取课程编号、代码和名称：\n\
    \n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT Mathematics\n189 ENG English\"\
    \"\"\n```\n\n**答案：**\n\n1.  编写一个 Python 脚本，使用正则表达式从以下文本中以元组形式提取每门课程的详细信息。此外，使用正则表达式检索\
    \ `CoursesData` 中的字符串值，然后检索 `CoursesData` 中的数值。\n\n    **答案：**\n\n```\nIn [60]:\
    \ import re\nCoursesData = \"\"\"101 COM Computers\n205 MAT  Mathematics\n189\
    \ ENG  English\"\"\"\nIn [61]: # Extract all course numbers\nCourse_numbers =\
    \ re.findall('[0-9]+', CoursesData)\nprint (Course_numbers)\n# Extract all course\
    \ codes\nCourse_codes = re.findall('[A-Z]{3}', CoursesData)\nprint (Course_codes)\n\
    # Extract all course names\nCourse_names = re.findall('[A-Za-z]{4,}', CoursesData)\
    \ print (Course_names)\n['101', '205', '189']\n['COM', 'MAT', 'ENG']\n['Computers',\
    \ 'Mathematics', 'English']\n```\n\n1.  编写一个 Python 脚本，使用正则表达式提取大小为 4 的数字和大小为\
    \ 2 到 4 的数字。\n\n    **答案：**\n\n```\nIn [63]: # define the course text pattern\
    \ groups and extract\ncourse_pattern = '([0-9]+)\\s*([A-Z]{3})\\s*([A-Za-z]{4,})'\n\
    re.findall(course_pattern, CoursesData)\nOut[63]: [('101', 'COM', 'Computers'),\n\
    ('205', 'MAT', 'Mathematics'),\n('189', 'ENG', 'English')]\nIn [64]: print(re.findall('[a-zA-Z]+',\
    \ CoursesData)) # [] Matches any character inside\n['COM', 'Computers', 'MAT',\
    \ 'Mathematics', 'ENG', 'English']\nIn [65]: print(re.findall('[0-9]+', CoursesData))\
    \ # [] Matches any numeric inside\n['101', '205', '189']\n```\n\n```\nCoursesData\
    \ = \"\"\"101 COM Computers\n205 MAT Mathematics\n189 ENG English\"\"\"\n```\n\
    \n```\nIn [66]: import re\nCoursesData = \"\"\"10 COM Computers\n205 MAT Mathematics\
    \ 1899 ENG English\"\"\"\nprint(re.findall('\\d{4}', CoursesData)) # {n} Matches\
    \ repeat n times.\nprint(re.findall('\\d{2,4}', CoursesData))\n['1899']\n['10',\
    \ '205', '1899']\n```\n\n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT Mathematics\n\
    189 ENG English\"\"\"\n```\n\n# 5. 数据收集与清洗\n\n在 21 世纪，数据对于决策和制定长期战略计划至关重要。Python\
    \ 提供了众多库和内置功能，使得支持数据分析和处理变得容易。制定商业决策、预测天气、研究生物学中的蛋白质结构以及设计营销活动，这些都是需要收集数据，然后进行清洗、处理和可视化的例子。\n\
    \n数据处理主要有五个步骤。\n\n1.  *数据获取*：从各种来源读取数据，这些来源可能是非结构化数据、半结构化数据或完全结构化数据，可能存储在电子表格、逗号分隔文件、网页、数据库等中。\n\
    2.  *数据清洗*：移除噪声数据，并执行必要的操作以仅保留相关数据。\n3.  *探索性分析*：查看清洗后的数据，并进行适合特定分析目的的统计处理。\n\
    4.  需要创建*分析模型*。此步骤可以使用诸如机器学习算法之类的先进工具。\n5.  *数据可视化*：使用 Python 提供的各种系统绘制结果，以帮助决策过程。\n\
    \nPython 提供了几个用于数据收集、清洗、集成、处理和可视化的库。\n\n*   `Pandas` 是一个开源的 Python 库，通过提供强大的数据结构来加载、组织、操作、建模和分析数据。\n\
    *   `Numpy` 是一个 Python 包，代表“数值 Python”。它是一个由多维数组对象和一组用于操作数组的例程组成的库。它可以用于对数组执行数学、逻辑和线性代数运算。\n\
    *   `SciPy` 是另一个用于数值积分和优化的内置 Python 库。\n*   `Matplotlib` 是一个用于创建二维图形和图表的 Python\
    \ 库。它支持多种图形和图表，例如直方图、条形图、功率谱、误差图等，并具有额外的格式化功能，例如控制线条样式、字体属性、格式化坐标轴等。\n"
- fmt: "# Cleaning Data\n\nData is collected and entered manually or automatically\
    \ using various methods such as weather sensors, financial stock market data servers,\
    \ users’ online commercial preferences, etc. Collected data is not error-free\
    \ and usually has various missing data points and erroneously entered data. For\
    \ instance, online users might not want to enter their information because of\
    \ privacy concerns. Therefore, treating missing and noisy data (`NA` or `NaN`)\
    \ is important for any data analysis processing.\n\n## Checking for Missing Values\n\
    \nYou can use built-in Python methods to check for missing values. Let’s create\
    \ a data frame using the `Numpy` and `Pandas` libraries. Include the index values\
    \ `a` to `h`, and give the columns labels of `stock1`, `stock2`, and `stock3`,\
    \ as shown in Listing [5-1](#472943_1_En_5_Chapter.xhtml#PC1).\n\n```\nIn [47]:\
    \ import pandas as pd\nimport numpy as np\ndataset = pd.DataFrame(np.random.randn(5,\
    \ 3), index=['a', 'c', 'e', 'f', 'h'],columns=['stock1', 'stock2', 'stock3'])\n\
    dataset.rename(columns={\"one\":'stock1',\"two\":'stock2', \"three\":'stock3'},\
    \ inplace=True)\ndataset = dataset.reindex(['a', 'b', 'c', 'd', 'e', 'f', 'g',\
    \ 'h'])\nprint (dataset)\nListing 5-1\nCreating a Data Frame Including NaN\n```\n\
    \n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figa_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figa_HTML.jpg)\n\
    \nIt should be clear that you can use `Numpy` to create an array of random values,\
    \ as shown in Listing [5-2](#472943_1_En_5_Chapter.xhtml#PC2).\n\n```\nIn [46]:\
    \ import numpy as np\nnp.random.randn(5, 3)\nListing 5-2\nCreating a Matrix of\
    \ Random Values\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figb_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figb_HTML.jpg)\n\
    \nIn Listing [5-2](#472943_1_En_5_Chapter.xhtml#PC2), you are ignoring rows `b`,\
    \ `d`, and `g`. That’s why you got `NaN`, which means non-numeric values. `Pandas`\
    \ provides the `isnull()` and `notnull()` functions to detect the missing values\
    \ in a data set. A Boolean value is returned when `NaN` has been detected; otherwise,\
    \ `False` is returned, as shown in Listing [5-3](#472943_1_En_5_Chapter.xhtml#PC3).\n\
    \n```\nIn [48]: print (dataset['stock1'].isnull())\nListing 5-3\nChecking Null\
    \ Cases\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figc_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figc_HTML.jpg)\n\
    \n## Handling the Missing Values\n\nThere are various techniques that can be used\
    \ to handle missing values.\n\n*   You can replace `NaN` with a scalar value.\n\
    \n    Listing [5-4](#472943_1_En_5_Chapter.xhtml#PC4) replaces all `NaN` cases\
    \ with `0` values.\n\n    ```\n    In [49]: print (dataset)\n    dataset.fillna(0)\n\
    \    Listing 5-4\n    Replacing NaN with a Scalar Value\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figd_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figd_HTML.jpg)\n\
    \n*   You can fill `NaN` cases forward and backward.\n\n    Another technique\
    \ to handle missing values is to fill them forward using `pad`/`fill` or fill\
    \ them backward using `bfill`/`backfill` methods. In Listing [5-5](#472943_1_En_5_Chapter.xhtml#PC5),\
    \ the values of row `a` are replicating the missing values in row `b`.\n\n   \
    \ ```\n    In [50]: # Fill missing values forward\n    print (dataset)\n    dataset.fillna(method='pad')\n\
    \    Listing 5-5\n    Filling In Missing Values Forward\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Fige_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Fige_HTML.jpg)\n\
    \n*   You can drop the missing values.\n\n    Another technique is to exclude\
    \ all the rows with `NaN` values. The `Pandas` `dropna()` function can be used\
    \ to drop entire rows from the data set. As you can see in Listing [5-6](#472943_1_En_5_Chapter.xhtml#PC6),\
    \ rows `b`, `d`, and `g` are removed entirely from the data set.\n\n    ```\n\
    \    In [51]: print (dataset)\n    dataset.dropna()\n    Listing 5-6\n    Dropping\
    \ All NaN Rows\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figf_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figf_HTML.jpg)\n\
    \n*   You can replace the missing (or generic) values.\n\n    The `replace()`\
    \ method can be used to replace a specific value in a data set with another given\
    \ value. In addition, it can be used to replace `NaN` cases, as shown in Listing\
    \ [5-7](#472943_1_En_5_Chapter.xhtml#PC7).\n\n    ```\n    In [52]: print (dataset)\n\
    \    dataset.replace(np.nan, 0 )\n    Listing 5-7\n    Using the replace() Function\n\
    \    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figg_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figg_HTML.jpg)"
