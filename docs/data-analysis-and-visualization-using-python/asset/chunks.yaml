- fmt: '# Exploring and Analyzing a Data Frame


    Pandas provides various methods for analyzing data in a data frame. The `.describe()`
    method is used to generate descriptive statistics that summarize the central tendency,
    dispersion, and shape of a data set''s distribution, excluding NaN values.


    ```

    DataFrame.describe(percentiles=None,include=None, exclude=None)[source]

    ```


    `DataFrame.describe()` analyzes both numeric and object series, as well as data
    frame column sets of mixed data types. The output will vary depending on what
    is provided. Listing [6-22](#472943_1_En_6_Chapter.xhtml#PC25) analyzes the `Age`,
    `Salary`, `Height`, and `Weight` attributes in a data frame. It also shows the
    mean, max, min, standard deviation, and quantiles of all attributes. However,
    Salwa''s `Age` is missing; you get the full description of `Age` attributes excluding
    Salwa''s data.


    ```

    In [61]: print (df1)

    data = {''Age'' : pd.Series([30, 25, 44, ], index=[''Ahmed'', ''Omar'', ''Ali'']),

