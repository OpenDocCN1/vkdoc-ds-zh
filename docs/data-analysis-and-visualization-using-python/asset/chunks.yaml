    ## Dictionaries


    A *dictionary* is an unordered set of key-value pair; each key is separated from
    its value by a colon (`:`). The items (the pair) are separated by commas, and
    the whole thing is enclosed in curly braces (`{}`). In fact, an empty dictionary
    is written only with curly braces. Dictionary keys should be unique and should
    be of an immutable data type such as string, integer, etc. Dictionary values can
    be repeated many times, and the values can be of any data type. It’s a mapping
    between keys and values; you can create a dictionary using the `dict()` method.


