    ### 创建数据框


    Pandas 可以使用构造函数 `pandas.DataFrame(data, index, columns, dtype, copy)` 创建数据框。数据框可以从列表、序列、字典、Numpy
    数组或其他数据框创建。Pandas 数据框不仅有助于存储表格数据，还可以对数据框的行和列执行算术运算。代码清单 6-10 从单个列表和列表的列表创建了一个数据框。


    ```

    In [19]: import pandas as pd

    data = [10,20,30,40,50]

    DF1 = pd.DataFrame(data)

    print (DF1)

    0    10

    1    20

    2    30

    3    40

    4    50

    In [22]: import pandas as pd

    data = [[''Ossama'',25],[''Ali'',43],[''Ziad'',32]]

    DF1 = pd.DataFrame(data,columns=[''Name'',''Age''])

    print (DF1)

    Name       Age

    0    Ossama     25

    1    Ali        43

    2    Ziad       32

    In [21]: import pandas as pd

    data = [[''Ossama'',25],[''Ali'',43],[''Ziad'',32]]

    DF1 = pd.DataFrame(data,columns=[''Name'',''Age''],dtype=float) print (DF1)

    Name       Age

    0    Ossama     25.0

    1    Ali        43.0

    2    Ziad       32.0

    代码清单 6-10

    从列表创建数据框

    ```


    你可以从字典或数组创建数据框，如代码清单 6-11 所示。此外，你还可以设置数据框的索引。但是，如果你不设置索引，那么数据框将从 0 开始，一直到 `n`-1，其中
    `n` 是列表的长度。列名默认取自字典的键。不过，也可以为列设置标签。第一个数据框 `df1` 的列使用字典键名作为标签；这就是为什么除了字典 1 中项目（project）的缺失值外，你看不到
    NaN 的情况。而在第二个名为 `df2` 的数据框中，你将列名从 `Test1` 更改为 `Test_1`，并且所有记录都得到了 NaN。这是因为 `data`
    的字典键中缺少 `Test_1`。


    ```

    In [13]: import pandas as pd

    data = [{''Test1'': 10, ''Test2'': 20},{''Test1'': 30, ''Test2'': 20, ''Project'':
    20}]

    # 使用三个列索引，值与字典键相同

    df1 = pd.DataFrame(data, index=[''First'', ''Second''], columns=[''Test2'', ''Project''
    , ''Test1''])

    # 使用两个列索引，其中一个索引使用另一个名称

    df2 = pd.DataFrame(data, index=[''First'', ''Second''], columns=[''Project'',
    ''Test_1'',''Test2 ''])

    print (df1)

    print ("\n")

    print (df2)

    Test2       Project        Test1

    First     20          NaN            10

    Second    20          20.0           30

    Project     Test_1         Test2

    First     NaN         NaN            20

    Second    20.0        NaN            20

    代码清单 6-11

    从字典创建数据框

    ```


    Pandas 允许你从序列字典创建数据框，此时你会得到所有传入序列索引的并集。如代码清单 6-12 所示，对于学生 `Salwa`，没有给出 `Test1`
    的值。这就是 NaN 被自动设置的原因。


    ```

    In [16]: import pandas as pd

    data = {''Test1'' : pd.Series([70, 55, 89], index=[''Ahmed'', ''Omar'', ''Ali'']),

    ''Test2'' : pd.Series([56, 82, 77, 65], index=[''Ahmed'', ''Omar'', ''Ali'', ''Salwa''])}

    df1 = pd.DataFrame(data)

    print (df1)

    Test1     Test2

    Ahmed      70.0      56

    Ali        89.0      77

    Omar       55.0      82

    Salwa      NaN       65

