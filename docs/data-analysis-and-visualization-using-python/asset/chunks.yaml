    交互式科学开发环境，用于数值计算、数据分析和数据可视化。

    -   *WinPython*：这是一个适用于 Windows 平台的免费 Python 发行版；它包含了用于 ScientificPython 的预构建包。

    -   *Anaconda*：这是一个完全免费、可用于企业级应用的 Python 发行版，适用于大规模数据处理、预测分析和科学计算。

    -   *PythonAnywhere*：PythonAnywhere 让在云端创建和运行 Python 程序变得简单。你可以在基于 Web 的编辑器中编写程序，或者在任何现代
    Web 浏览器中运行控制台会话。

    -   *Anaconda Navigator*：这是 Anaconda 发行版中包含的一个桌面图形用户界面（GUI），允许你启动应用程序并轻松管理 Anaconda
    包（如图 1-2 所示）、环境和频道，而无需使用命令行。Navigator 可以在 Anaconda 云或本地 Anaconda 仓库中搜索包。它适用于 Windows、macOS
    和 Linux。


    以下部分将演示如何设置和使用 Azure Jupyter Notebooks。

    '
- fmt: "### Azure Notebooks\n\nThe Azure Machine Learning workbench supports interactive\
    \ data science experimentation through its integration with Jupyter Notebooks.\n\
    \nAzure Notebooks is available for free at [`https://notebooks.azure.com/`](https://notebooks.azure.com/).\
    \ After registering and logging into Azure Notebooks, you will get a menu that\
    \ looks like this:\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figa_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Figa_HTML.jpg)\n\
    \nOnce you have created your account, you can create a library for any Python\
    \ project you would like to start. All libraries you create can be displayed and\
    \ accessed by clicking the Libraries link.\n\nLet’s create a new Python script.\n\
    \n1.  Create a library.\n\n    Click New Library, enter your library details,\
    \ and click Create, as shown here:\n\n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Figb_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Figb_HTML.jpg)\n\
    \n    A new library is created, as shown in Figure [1-3](#472943_1_En_1_Chapter.xhtml#Fig3).\n\
    \n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Figc_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Figc_HTML.jpg)\n\
    \n2.  Create a project folder container.\n\n    Organizing the Python library\
    \ scripts is important. You can create folders and subfolders by selecting +New\
    \ from the ribbon; then for the item type select Folder, as shown in Figure [1-3](#472943_1_En_1_Chapter.xhtml#Fig3).\n\
    \n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig3_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig3_HTML.jpg)\n\
    \n    Figure 1-3\n\n    Creating a folder in an Azure project\n\n3.  Create a\
    \ Python project.\n\n    Move inside the created folder and create a new Python\
    \ project.\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figd_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Figd_HTML.jpg)\n\
    \nYour project should look like this:\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fige_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fige_HTML.jpg)\n\
    \n1.  Write and run a Python script.\n\nOpen the Created Hello World script by\
    \ clicking it, and start writing your Python code, as shown in Figure [1-4](#472943_1_En_1_Chapter.xhtml#Fig4).\n\
    \n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig4_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nA Python script file on Azure\n\nIn Figure [1-4](#472943_1_En_1_Chapter.xhtml#Fig4),\
    \ all the green icons show the options that can be applied on the running file.\
    \ For instance, you can click + to add new lines to your file script. Also, you\
    \ can save, cut, and move lines up and down. To execute any segment of code, press\
    \ `Ctrl+Enter`, or click Run on the ribbon.\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figf_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Figf_HTML.jpg)\n\
    \n### Offline and Desktop Python Editors\n\nThere are many offline Python IDEs\
    \ such as Spyder, PyDev via Eclipse, NetBeans, Eric, PyCharm, Wing, Komodo, Python\
    \ Tools for Visual Studio, and many more.\n\nThe following steps demonstrate how\
    \ to set up and use Spyder. You can download Anaconda Navigator and then run the\
    \ Spyder software, as shown in Figure [1-5](#472943_1_En_1_Chapter.xhtml#Fig5).\n\
    \n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig5_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nPython Spyder IDE\n\nOn the left side, you can write Python scripts,\
    \ and on the right side you can see the executed script in the console.\n\n##\
    \ The Basics of Python Programming\n\nThis section covers basic Python programming.\n\
    \n### Basic Syntax\n\nA Python *identifier* is a name used to identify a variable,\
    \ function, class, module, or other object in the created script. An identifier\
    \ starts with a letter from *A* to *Z* or from *a* to *z* or an underscore (`_`)\
    \ followed by zero or more letters, underscores, and digits (0 to 9).\n\nPython\
    \ does not allow special characters such as `@`, `$`, and `%` within identifiers.\
    \ Python is a case-sensitive programming language. Thus, `Manpower` and `manpower`\
    \ are two different identifiers in Python.\n\nThe following are the rules for\
    \ naming Python identifiers:\n\n*   Class names start with an uppercase letter.\
    \ All other identifiers start with a lowercase letter.\n\n*   Starting an identifier\
    \ with a single leading underscore indicates that the identifier is private.\n\
    \n*   Starting an identifier with two leading underscores indicates a strongly\
    \ private identifier.\n\n*   If the identifier also ends with two trailing underscores,\
    \ the identifier is a language-defined special name.\n\nThe `help?` method can\
    \ be used to get support from the Python user manual, as shown in Listing [1-1](#472943_1_En_1_Chapter.xhtml#PC1).\n\
    \n```\nIn [3]:      help?\nSignature:   help(*args, **kwds)\nType:        _Helper\n\
    String form: Type help() for interactive help, or help(object) for help about\
    \ object.\nNamespace:   Python builtin\nFile:        ~/anaconda3_501/lib/python3.6/_sitebuiltins.py\n\
    Docstring:\nDefine the builtin 'help'.\nThis is a wrapper around pydoc.help that\
    \ provides a helpful message\nwhen 'help' is typed at the Python interactive prompt\
    \ .\nCalling help() at the Python prompt starts an interactive help session.\n\
    Calling help(thing) prints help for the python object 'thing'.\nListing 1-1\n\
    Getting Help from Python\n```\n\nThe smallest unit inside a given Python script\
    \ is known as a *token*, which represents punctuation marks, reserved words, and\
    \ each individual word in a statement, which could be keywords, identifiers, literals,\
    \ and operators.\n\nTable [1-1](#472943_1_En_1_Chapter.xhtml#Tab1) lists the reserved\
    \ words in Python. Reserved words are the words that are reserved by the Python\
    \ language already and can’t be redefined or declared by the user.\n\nTable 1-1\n\
    \nPython Reserved Keywords\n\n| `and` | `exec` | `not` | `continue` | `global`\
    \ | `with` | `yield` | `in` |\n| --- | --- | --- | --- | --- | --- | --- | ---\
    \ |\n| `assert` | `finally` | `or` | `def` | `if` | `return` | `else` | `is` |\n\
    | `break` | `for` | `pass` | `except` | `lambda` | `while` | `try` |   |\n| `class`\
    \ | `from` | `print` | `del` | `import` | `raise` | `elif` |   |\n\n#### Lines\
    \ and Indentation\n\nLine indentation is important in Python because Python does\
    \ not depend on braces to indicate blocks of code for class and function definitions\
    \ or flow control. Therefore, a code segment block is denoted by line indentation,\
    \ which is rigidly enforced, as shown in Listing [1-2](#472943_1_En_1_Chapter.xhtml#PC2).\n\
    \n```\nIn [4]:age, mark, code=10,75,\"CIS2403\"\nprint (age)\nprint (mark)\nprint\
    \ (code)\nFile \"\", line 4\nprint (code)\nIndentationError: unexpected indent\n\
    Listing 1-2\nLine Indentation Syntax Error\n```\n\n#### Multiline Statements\n\
    \nStatements in Python typically end with a new line. But a programmer can use\
    \ the line continuation character (`\\`) to denote that the line should continue,\
    \ as shown in Listing [1-3](#472943_1_En_1_Chapter.xhtml#PC3). Otherwise, a syntax\
    \ error will occur.\n\n```\nIn [5]:TV=15\nMobile=20 Tablet = 30\ntotal = TV +\n\
    Mobile +\nTablet\nprint (total)\nFile \"\", line 5\ntotal = TV +\nSyntaxError:\
    \ invalid syntax\nListing 1-3\nMultiline Statements\n```\n\nThe following is the\
    \ correct syntax:\n\n```\nIn [6]: TV=15\nMobile=20\nTablet = 30\ntotal = TV +\
    \ \\\nMobile + \\\nTablet\nprint (total)\n\n```\n\nThe code segment with statements\
    \ contained within the `[]`, `{}`, or `()` brackets does not need to use the line\
    \ continuation character, as shown in Listing [1-4](#472943_1_En_1_Chapter.xhtml#PC5).\n\
    \n```\nIn [7]: days = ['Monday', 'Tuesday', 'Wednesday',\n'Thursday', 'Friday']\n\
    print (days)\n['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday']\nListing\
    \ 1-4\nStatements with Quotations\n```"
