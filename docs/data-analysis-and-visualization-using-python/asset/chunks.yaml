    ### Stack Plot


    Stack plots present the frequency of every activity, such as the frequency of
    sleeping, eating, working, and playing per day (see Listing [7-20](#472943_1_En_7_Chapter.xhtml#PC48)).
    In this data set, on day 2, a person spent eight hours sleeping, three hours in
    eating, eight hours working, and five hours playing.


    ```

    In [9]: days = [1,2,3,4,5]

    sleeping = [7,8,6,11,7]

    eating = [2,3,4,3,2]

    working = [7,8,7,2,2]

    playing = [8,5,7,8,13]

    plt.plot([],[], color="m", label="Sleeping")

    plt.plot([],[], color="c", label="Eating")

    plt.plot([],[], color="r", label="Working")

    plt.plot([],[], color="k", label="Playing")

    plt.stackplot(days, sleeping, eating, working , playing, colors=[''m'',''c'',
    ''r'', ''k''])

    plt.xlabel(''days'')

    plt.ylabel(''Activities'')

    plt.title(''Persons Weekly Spent Time per activities\n Spring 2018'')

    plt.legend()

    plt.show()

    Listing 7-20

    Persons Weekly Spent Time per activities using Matplotlib Stack Plot

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figaw_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figaw_HTML.jpg)


    ### Pie Chart


    In Listing [7-21](#472943_1_En_7_Chapter.xhtml#PC50), you are using the `explode`
    attribute to slice out a specific activity. After that, you can add the gender
    and title to the pie chart.


    ```

    In [10]: days = [1,2,3,4,5]

    sleeping = [7,8,6,11,7]

    eating = [2,3,4,3,2]

    working = [7,8,7,2,2]

    playing = [8,5,7,8,13]

    slices = [39,14,26,41]

    activities = [''sleeping'', ''eating'', ''working'', ''playing'']

    cols = [''c'',''m'',''r'', ''b'',''g'']

    plt.pie(slices,

    labels= activities,

    colors= cols,

    startangle=100,

    shadow=True,

    explode = (0.0,0.0,0.09,0),

    autopct = ''%1.1f%%'')

    plt.title(''Persons Weekly Spent Time per activities\n Spring 2018'')

    plt.legend()

    plt.show()

    Listing 7-21

    Persons Weekly Spent Time per activities using Matplotlib Pie Chart

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figax_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figax_HTML.jpg)


    ## Summary


    This chapter covered how to plot data from different collection structures. You
    learned the following:


    *   How to directly plot data from a series, data frame, or panel using Python
    plotting tools such as line plots, bar plots, pie charts, box plots, histogram
    plots, and scatter plots


    *   How to implement the Seaborn plotting system using strip plotting, box plotting,
    swarm plotting, and joint plotting


    *   How to implement Matplotlib plotting using line plots, bar charts, histogram
    plots, scatter plots, stack plots, and pie charts


    The next chapter will cover the techniques you’ve studied in this book via two
    different case studies; it will make recommendations, and much more.'
