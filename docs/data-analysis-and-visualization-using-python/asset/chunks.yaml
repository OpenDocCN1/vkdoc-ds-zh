    ### 关于作者与技术审校者


    ### 关于作者


    ### 关于技术审校者


    # 1. 使用 Python 进行数据科学入门


    数字数据量正以惊人的速度增长，每两年翻一番，并改变着我们的生活方式。据估计，到 2020 年，地球上每个人每秒钟将产生约 1.7MB 的新数据。这意味着我们需要拥有技术工具、算法和模型，来清理、处理和理解不同形式的可用数据，以便进行决策。*数据科学*是一个涵盖与清理、准备和分析非结构化、半结构化和结构化数据相关所有内容的领域。这门科学结合了统计学、数学、编程、问题解决和数据采集，从数据中提取洞察和信息。


    ## 数据科学的阶段


    图 1-1 展示了数据科学领域的不同阶段。数据科学家使用诸如 `Python`、`R`、`SAS`、`Java`、`Perl` 和 `C/C++` 等编程工具，从准备好的数据中提取知识。为了提取这些信息，他们采用基于机器学习算法、统计学和数学方法的各种适用模型。


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig1_HTML.png](img/472943_1_En_1_Fig1_HTML.png)


    图 1-1


    数据科学项目阶段


    数据科学算法应用于诸多产品中，例如互联网搜索引擎，以在更短时间内为搜索查询提供最佳结果；推荐系统，利用用户经验生成推荐；数字广告；教育系统；医疗系统等等。数据科学家应深入了解诸如
    `Python`、`R`、`SAS`、`Hadoop` 平台和 `SQL` 数据库等编程工具；熟悉诸如 `JSON`、`XML`、`HTML` 等半结构化格式。此外，还需掌握处理非结构化数据的知识。


    ## 为什么选择 Python？


    `Python` 是一种动态、通用的编程语言，应用于各个领域。`Python` 可用于从一次性脚本到提供 24/7 不间断服务的大型可扩展 Web 服务器等各种场景。它用于
    GUI 和数据库编程、客户端和服务器端 Web 编程以及应用程序测试。科学家用它为世界上最快的超级计算机编写应用程序，儿童也用它初次学习编程。它最初由 Guido
    van Rossum 在 20 世纪 90 年代初开发，现在由非营利组织 Python 软件基金会管理，并得到微软、谷歌等公司的赞助。


    `Python` 的第一个版本于 1991 年发布。`Python` 目前处于 `3.x` 版本，该版本于 2011 年 2 月经过长期测试后发布。其许多主要特性也已向后移植到兼容的
    `Python 2.6`、`2.7` 和 `3.6` 版本。


    ### Python 的基本特性


    `Python` 提供了众多特性；以下是一些重要特性：


    *   *易于学习和使用*：`Python` 使用优雅的语法，使程序易于阅读。它开发者友好，是一种高级编程语言。


    *   *表达力强*：`Python` 语言表达力强，这意味着它比其他语言更易于理解和阅读。


    *   *解释型*：`Python` 是一种解释型语言。换句话说，解释器逐行执行代码。这使得调试变得容易，因此适合初学者。


    *   *跨平台*：`Python` 可以在 Windows、Linux、Unix、Macintosh 等不同平台上同样良好地运行。因此，`Python`
    是一种可移植语言。


    *   *免费且开源*：`Python` 语言可在 [`www.python.org`](http://www.python.org) 免费获取。其源代码也可获得。


    *   *面向对象*：`Python` 是一种面向对象的语言，具有类和对象的概念。


    *   *可扩展*：通过添加用编译语言（如 `C` 或 `C++`）实现的新模块，可以轻松扩展 `Python`，这些模块可用于编译代码。


    *   *大型标准库*：它附带一个大型标准库，支持许多常见编程任务，例如连接 Web 服务器、使用正则表达式搜索文本以及读取和修改文件。


    *   *GUI 编程支持*：可以使用 `Python` 开发图形用户界面。


    *   *可集成*：它可以轻松地与 `C`、`C++`、`Java` 等语言集成。

    '
- fmt: '### Python Learning Resources


    Numerous amazing Python resources are available to train Python learners at different
    learning levels. There are so many resources out there, though it can be difficult
    to know how to find all of them. The following are the best general Python resources
    with descriptions of what they provide to learners:


    - *Python Practice Book* is a book of Python exercises to help you learn the basic
    language syntax. (See [`https://anandology.com/python-practice-book/index.html`](https://anandology.com/python-practice-book/index.html).)

    - *Agile Python Programming*: *Applied for Everyone* provides a practical demonstration
    of Python programming as an agile tool for data cleaning, integration, analysis,
    and visualization fits for academics, professionals, and researchers. (See [`http://www.lulu.com/shop/ossama-embarak/agile-python-programming-applied-for-everyone/paperback/product-23694020.html`](https://www.lulu.com/shop/ossama-embarak/agile-python-programming-applied-for-everyone/paperback/product-23694020.html).)

    - “A Python Crash Course” gives an awesome overview of the history of Python,
    what drives the programming community, and example code. You will likely need
    to read this in combination with other resources to really let the syntax sink
    in, but it’s a great resource to read several times over as you continue to learn.
    (See [`https://www.grahamwheeler.com/posts/python-crash-course.html`](https://www.grahamwheeler.com/posts/python-crash-course.html).)

    - “A Byte of Python” is a beginner’s tutorial for the Python language. (See [`https://python.swaroopch.com/`](https://python.swaroopch.com/).)

    - The O’Reilly book *Think Python*: *How to Think Like a Computer Scientist* is
    available in HTML form for free on the Web. (See [`https://greenteapress.com/wp/think-python/`](https://greenteapress.com/wp/think-python/).)

    - *Python for You and Me* is an approachable book with sections for Python syntax
    and the major language constructs. The book also contains a short guide at the
    end teaching programmers to write their first Flask web application. (See [`https://pymbook.readthedocs.io/en/latest/`](https://pymbook.readthedocs.io/en/latest/).)

    - Code Academy has a Python track for people completely new to programming. (See
    [`www.codecademy.com/catalog/language/python`](https://www.codecademy.com/catalog/language/python).)

    - *Introduction to Programming with Python* goes over the basic syntax and control
    structures in Python. The free book has numerous code examples to go along with
    each topic. (See [`www.opentechschool.org/`](https://www.opentechschool.org/).)

    - Google has a great compilation of material you should read and learn from if
    you want to be a professional programmer. These resources are useful not only
    for Python beginners but for any developer who wants to have a strong professional
    career in software. (See [`techdevguide.withgoogle.com`](https://techdevguide.withgoogle.com).)

    - Looking for ideas about what projects to use to learn to code? Check out the
    five programming projects for Python beginners at [`knightlab.northwestern.edu`](https://knightlab.northwestern.edu).

    - There’s a Udacity course by one of the creators of Reddit that shows how to
    use Python to build a blog. It’s a great introduction to web development concepts.
    (See [`mena.udacity.com`](https://mena.udacity.com).)


    ## Python Environment and Editors


    Numerous integrated development environments (IDEs) can be used for creating Python
    scripts.


    ### Portable Python Editors (No Installation Required)


    These editors require no installation:


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig2_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Anaconda Navigator


    - *Azure Jupyter Notebooks*: The open source Jupyter Notebooks was developed by
    Microsoft as an analytic playground for analytics and machine learning.

    - *Python(x,y)*: Python(x,y) is a free scientific and engineering development
    application for numerical computations, data analysis, and data visualization
    based on the Python programming language, Qt graphical user interfaces, and Spyder
    interactive scientific development environment.

    - *WinPython*: This is a free Python distribution for the Windows platform; it
    includes prebuilt packages for ScientificPython.

    - *Anaconda*: This is a completely free enterprise-ready Python distribution for
    large-scale data processing, predictive analytics, and scientific computing.

    - *PythonAnywhere*: PythonAnywhere makes it easy to create and run Python programs
    in the cloud. You can write your programs in a web-based editor or just run a
    console session from any modern web browser.

    - *Anaconda Navigator*: This is a desktop graphical user interface (GUI) included
    in the Anaconda distribution that allows you to launch applications and easily
    manage Anaconda packages (as shown in Figure [1-2](#472943_1_En_1_Chapter.xhtml#Fig2)),
    environments, and channels without using command-line commands. Navigator can
    search for packages on the Anaconda cloud or in a local Anaconda repository. It
    is available for Windows, macOS, and Linux.


    The following sections demonstrate how to set up and use Azure Jupyter Notebooks.'
