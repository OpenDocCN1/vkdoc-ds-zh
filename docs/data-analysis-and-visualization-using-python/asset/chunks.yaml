    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figx_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figx_HTML.jpg)


    ## Reading Data from the JSON Format


    The Pandas library can read JSON files using the `read_json` function directly
    from the cloud or from a hard disk. Listing [5-19](#472943_1_En_5_Chapter.xhtml#PC28)
    demonstrates how to create JSON data and load it in JSON format and then iterate
    or manipulate the data. The JSON format is similar to a dictionary structure where
    you have a key-value pair, but in JSON, you can have subattributes with inner
    values, similar to `email` in the first example, and its subattribute `hide` with
    the value `NO`.


    ```

    In [73]: import json data = ''''''{

    "name" : "Ossama",

    "phone" : { "type" : "intl", "number" : "+971 50 244 5467"},

    "email" : {"hide" : "No" }

    }''''''

    info = json.loads(data)

    print (''Name:'',info["name"])

    print (''Hide:'',info["email"]["hide"])

    Name: Ossama

    Hide: No

    In [74]: input = ''''''[

    { "id" : "001", "x" : "5", "name" : "Ossama"} ,

    { "id" : "009","x" : "10","name" : "Omar" }

    ]''''''

    info = json.loads(input) print (''User count:'', len(info)) for item in info:

    print (''\nName'', item[''name''])

    print (''Id'', item[''id''])

    print (''Attribute'', item[''x''])

    User count: 2

    Name Ossama

    Id 001

    Attribute 5

    Name Omar

    Id 009

    Attribute 10

    Listing 5-19

    Creating and Manipulating JSON Data

    ```


    You can directly read JSON data from an online resource, as shown in Listing [5-20](#472943_1_En_5_Chapter.xhtml#PC29)
    and Listing [5-21](#472943_1_En_5_Chapter.xhtml#PC30).


    ```

    url='' http://python-data.dr-chuck.net/comments_244984.json''

    print (''Retrieving'', url)

    uh = urllib.urlopen(url)

    data = uh.read()

    Listing 5-20

    JSON Sample Data

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figy_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figy_HTML.jpg)


    ```

    In [101]: import json

    with open(''comments.json'') as json_data:

    JSONdta = json.load(json_data)

    print(JSONdta)

    Listing 5-21

    Loading a JSON File

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figz_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figz_HTML.jpg)


    You can access JSON data and make further operations on the extracted data. For
    instance, you can calculate the total number of all users, find the average value
    of all counts, and more, as shown in Listing [5-22](#472943_1_En_5_Chapter.xhtml#PC31).


    ```

    In [102]:sumv=0

    counter=0

    for i in range(len(JSONdta["comments"])):

    counter+=1

    Name = JSONdta["comments"][i]["name"]

    Count = JSONdta["comments"][i]["count"]

    sumv+=int(Count)

    print (Name," ", Count)

    print ("\nCount: ", counter)

    print ("Sum: ", sumv)

    Listing 5-22

    Accessing JSON Data

    ```


    The following is a sample of extracted data from the JSON file and the calculated
    total number of all users:


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figaa_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figaa_HTML.jpg)'
