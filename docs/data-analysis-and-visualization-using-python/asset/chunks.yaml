    # 8. Case Studies


    This chapter covers two case studies. I will provide some brief information about
    each case and then show how to gather the data needed for analysis, how to analyze
    the data, and how to visualize the data related to specific patterns.


    ## Case Study 1: Cause of Deaths in the United States (1999–2015)


    This study analyses the leading causes of death in the United States of America
    between 1999 and 2015.


    ### Data Gathering


    It’s important to gather a study’s data set from a reliable source; it’s also
    important to use an updated and accurate data set to get unbiased findings. The
    data set in this case study comes from open data from the U.S. government, which
    can be accessed through [`https://data.gov`](https://data.gov) .


    You can download it from here:


    [`https://catalog.data.gov/dataset/age-adjusted-death-rates-for-the-top-10-leading-causes-of-death-united-states-2013`](https://catalog.data.gov/dataset/age-adjusted-death-rates-for-the-top-10-leading-causes-of-death-united-states-2013)


    This case study will try to answer the following questions:


    *   What is the total number of records in the dataset?


    *   What were the causes of death in this data set?


    *   What was the total number of deaths in the United States from 1999 to 2015?


    *   What is the number of deaths per each year from 1999 to 2015?


    *   Which ten states had the highest number of deaths overall?


    *   What were the top causes of deaths in the United States during this period?


