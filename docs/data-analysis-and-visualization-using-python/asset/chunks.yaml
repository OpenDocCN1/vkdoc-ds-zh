    ## 数据框


    *数据框*是一种二维表格型标签化数据结构，其列可能具有不同的数据类型。数据框可以通过多种数据集合创建，例如：


    *   一维 `ndarray`、列表、`dict` 或序列

    *   二维 Numpy `ndarray`

    *   [结构化或记录型](http://docs.scipy.org/doc/numpy/user/basics.rec.html) `ndarray`

    *   一个序列

    *   另一个数据框


    数据框具有参数，即索引（行标签）和列（列标签）。


    ### 从序列字典或字典字典创建数据框


    你可以简单地通过序列字典创建一个数据框；也可以为其指定索引。如果索引没有对应的值，则会给出 `NaN` 值，如清单 3-35 所示。


    ```

    In [5]: import pandas as pd

    dict1 = {''one'' : pd.Series([1., 2., 3.], index=[''a'', ''b'', ''c'']),

    ''two'' : pd.Series([1., 2., 3., 4.], index=[''a'', ''b'', ''c'', ''d''])}

    df = pd.DataFrame(dict1)

    df

    Out[5]: one  two

    a    1.0    1.0

    b    2.0    2.0

    c    3.0    3.0

    d    NaN    4.0

    In [6]: # 为 DataFrame 设置索引

    pd.DataFrame(dict1, index=[''d'', ''b'', ''a''])

    Out[6]: one  two

    d    NaN    4.0

    b    2.0    2.0

    a    1.0    1.0

    In [8]: # 控制 DataFrame 的标签显示

    pd.DataFrame(dict1, index=[''d'', ''b'', ''a''], columns=[''two'', ''three'',
    ''one''])

    Out[8]: two  three  one

    d    4.0    NaN    NaN

    b    2.0    NaN    2.0

    a    1.0    NaN    1.0

    清单 3-35

    从序列字典创建数据框

    ```


    ### 从 Ndarrays/列表字典创建数据框


    当你从 `ndarray` 创建数据框时，所有 ndarray 的长度必须相同。同时，传入的索引长度应与数组长度相同。如果未传入索引，结果将是 `range(n)`，其中
    `n` 是数组长度。参见清单 3-36。


    ```

    In [11]: # 无索引

    ndarrdict = {''one'' : [1., 2., 3., 4.],''two'' : [4., 3., 2., 1.]}

    pd.DataFrame(ndarrdict)

    Out[11]:           one    two

    0     1.0    4.0

    1     2.0    3.0

    2     3.0    2.0

    3     4.0    1.0

    In [12]: # 指定索引

    pd.DataFrame(ndarrdict, index=[''a'', ''b'', ''c'', ''d''])

    Out[12]:     one    two

    a      1.0      4.0

    b      2.0      3.0

    c      3.0      2.0

    d      4.0      1.0

    清单 3-36

    从 Ndarray 创建数据框

    ```


    ### 从结构化或记录数组创建数据框


    清单 3-37 通过先指定每列的数据类型，再指定每行的值来创建一个数据框。`(''A'', ''i4'')` 将列标签及其数据类型确定为整数，`(''B'',
    ''f4'')` 将标签确定为 B 且数据类型为浮点数，最后 `(''C'', ''a10'')` 将标签 C 和数据类型指定为最多十个字符的字符串。


