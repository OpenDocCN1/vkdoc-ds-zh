    ## 面板数据结构


    如前所述，*面板*是一种三维数据结构，类似于三维数组。


    ## 创建面板


    Pandas 使用构造函数 `pandas.Panel(data, items, major_axis, minor_axis, dtype, copy)`
    创建面板。面板可以从数据框和数组的字典创建。数据可以采用多种形式，例如 ndarray、序列、映射、列表、字典、常量，以及另一个数据框。


    以下 Python 脚本创建了一个空面板：


    ```

    #creating an empty panel

    import pandas as pd

    p = pd.Panel ()

    ```


    清单 6-27 创建了一个三维面板。


