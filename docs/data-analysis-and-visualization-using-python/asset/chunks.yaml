  trans: '

    ### Python 学习资源


    众多优秀的 Python 资源可供不同学习阶段的 Python 学习者使用。虽然资源数量庞大，但想要全部找到却并非易事。以下是最通用的 Python 资源，并附有它们为学习者提供的内容说明：


    -   *《Python 练习册》*是一本 Python 练习题集，旨在帮助你掌握基本的语言语法。（参见 [`https://anandology.com/python-practice-book/index.html`](https://anandology.com/python-practice-book/index.html)。）

    -   *《敏捷 Python 编程：人人适用》* 提供了 Python 编程作为敏捷工具的实践演示，适用于数据清洗、集成、分析和可视化，适合学术界人士、专业人士和研究人员。（参见
    [`http://www.lulu.com/shop/ossama-embarak/agile-python-programming-applied-for-everyone/paperback/product-23694020.html`](https://www.lulu.com/shop/ossama-embarak/agile-python-programming-applied-for-everyone/paperback/product-23694020.html)。）

    -   “Python 速成课”精彩地概述了 Python 的历史、驱动编程社区的因素以及示例代码。你可能需要结合其他资源来阅读，才能真正掌握语法，但它是随着你持续学习而值得反复阅读的优秀资源。（参见
    [`https://www.grahamwheeler.com/posts/python-crash-course.html`](https://www.grahamwheeler.com/posts/python-crash-course.html)。）

    -   “Python 简明教程”是一份面向初学者的 Python 语言教程。（参见 [`https://python.swaroopch.com/`](https://python.swaroopch.com/)。）

    -   O''Reilly 出版的书籍 *《像计算机科学家一样思考 Python》* 在网络上以 HTML 格式免费提供。（参见 [`https://greenteapress.com/wp/think-python/`](https://greenteapress.com/wp/think-python/)。）

    -   *《为你我而写的 Python》* 是一本通俗易懂的书籍，包含 Python 语法和主要语言结构的章节。该书末尾还附有一份简短指南，教程序员编写他们的第一个
    Flask Web 应用程序。（参见 [`https://pymbook.readthedocs.io/en/latest/`](https://pymbook.readthedocs.io/en/latest/)。）

    -   Code Academy 为完全编程新手提供了 Python 学习路径。（参见 [`www.codecademy.com/catalog/language/python`](https://www.codecademy.com/catalog/language/python)。）

    -   *《Python 编程入门》* 介绍了 Python 的基本语法和控制结构。这本免费书籍为每个主题提供了大量代码示例。（参见 [`www.opentechschool.org/`](https://www.opentechschool.org/)。）

    -   如果你想成为一名专业程序员，Google 整理了一份极好的学习材料汇编。这些资源不仅对 Python 初学者有用，对任何希望在软件领域拥有强大职业生涯的开发者都很有帮助。（参见
    [`techdevguide.withgoogle.com`](https://techdevguide.withgoogle.com)。）

    -   正在寻找通过项目学习编程的灵感？请查看 [`knightlab.northwestern.edu`](https://knightlab.northwestern.edu)
    上为 Python 初学者准备的五个编程项目。

    -   Udacity 上有一门由 Reddit 创始人之一讲授的课程，展示了如何使用 Python 构建博客。这是对 Web 开发概念的极好介绍。（参见
    [`mena.udacity.com`](https://mena.udacity.com)。）


    ## Python 环境与编辑器


    有许多集成开发环境（IDE）可用于创建 Python 脚本。


    ### 便携式 Python 编辑器（无需安装）


    这些编辑器无需安装：


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig2_HTML.jpg](img/472943_1_En_1_Fig2_HTML.jpg)


