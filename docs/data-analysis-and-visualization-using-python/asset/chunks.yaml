    ### Swarm Plot


    A swarm plot is used to visualize different categories; it gives a clear picture
    of a variable distribution against other variables. For instance, the salary distribution
    per gender and per profession indicates that the male professors have the highest
    salary range. Most of the males are full professors, then associate, and then
    assistant professors. There are more male professors than female professors, but
    there are more female associate professors than male associate professors. See
    Listing [7-14](#472943_1_En_7_Chapter.xhtml#PC27).


    ```

    In [11]: # swarmplot

    sns.swarmplot( x =''sex'', y= ''salary'', hue="rank", data=dataset, palette="Set2",
    dodge=True)

