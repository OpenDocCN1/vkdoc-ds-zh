- fmt: "# Reading Data from the HTML Format\n\nYou can read online HTML files, but\
    \ you should install and use the `Beautiful Soup` package to do so. Listing [5-23](#472943_1_En_5_Chapter.xhtml#PC32)\
    \ shows how to make a request to a URL to be loaded into the Python environment.\
    \ Then you use the `HTML` parser parameter to read the entire HTML file. You can\
    \ also extract values stored with HTML tags.\n\n```\nIn [104]:import urllib from\
    \ bs4\nimport BeautifulSoup\nresponse = urllib.request.urlopen('http://python-data.dr-chuck.net/known_by_Rona.html'\n\
    html_doc = response.read()\nsoup = BeautifulSoup(html_doc, 'html.parser')\nprint(html_doc[:700])\n\
    print(\"\\n\")\nprint (soup.title)\nprint(soup.title.string)\nprint(soup.a.string)\n\
    Listing 5-23\nReading and Parsing an HTML File\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figab_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figab_HTML.jpg)\n\
    \n```\nIn [103]: import urllib.request\nwith urllib.request.urlopen(\"http://python-data.dr-chuck.net/known_by_Rona.html\"\
    ) as url:\nstrhtml = url.read()\n#I'm guessing this would output the html source\
    \ code? print(strhtml[:700])\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figac_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figac_HTML.jpg)\n\
    \nYou can also load HTML and use the `Beautiful Soup` package to parse HTML tags\
    \ and display the first ten anchor tags, as shown in Listing [5-24](#472943_1_En_5_Chapter.xhtml#PC34).\n\
    \n```\nIn [107]: import urllib from bs4\nimport BeautifulSoup\nresponse = urllib.request.urlopen('http://python-data.dr\
    \ chuck.net/known_by_Rona.html' html_doc = response.read()\nprint (html_doc[:300])\n\
    soup = BeautifulSoup(html_doc, 'html.parser')\nprint (\"\\n\") counter=0\nfor\
    \ link in soup.findAll(\"a\"):\nprint(link.get(\"href\"))\nif counter<10: counter+=1\n\
    continue\nelse:\nbreak\nListing 5-24\nParsing HTML Tags\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figad_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figad_HTML.jpg)\n\
    \nLet’s create an `html` variable that maintains some web page content and read\
    \ it using `Beautiful Soup`, as shown in Listing [5-25](#472943_1_En_5_Chapter.xhtml#PC35).\n\
    \n```\nIn [108]: htmldata=\"\"\"\n\nThe Dormouse's story\n\nThe Dormouse's story\n\
    \nOnce upon a time there were three little sisters; and their names were\n Elsie\n\
    \n,\n Lacie\n and\n Tillie\n\n; and they lived at the bottom of a well.\n\n...\n\
    \n\"\"\"\nfrom bs4 import BeautifulSoup\nsoup = BeautifulSoup(htmldata, 'html.parser')\n\
    print(soup.prettify())\nListing 5-25\nReading HTML Using Beautiful Soup\n```\n\
    \n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figae_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figae_HTML.jpg)\n\
    \nYou can also use `Beautiful Soup` to extract data from HTML. You can extract\
    \ data, tags, or all related data such as all hyperlinks in the parsed HTML content,\
    \ as shown in Listing [5-26](#472943_1_En_5_Chapter.xhtml#PC36).\n\n```\nIn [109]:\
    \ soup.title\nOut[109]: \nThe Dormouse's story\n\nIn [110]: soup.title.name\n\
    Out[110]: 'title'\nIn [111]: soup.title.string\nOut[111]: \"\\n      The Dormouse's\
    \ story\\n \"\nIn [112]: soup.title.parent.name\nOut[112]: 'head'\nIn [113]: soup.p\n\
    Out[113]:\n\nThe Dormouse's story\n\nIn [114]: soup.p['class']\nOut[114]: ['title']\n\
    In [115]: soup.a\nOut[115]:  Elsie\n\nIn [116]: soup.find_all('a')\nOut[116]:\
    \ [ Elsie\n,  Lacie\n,  Tillie\n]\nIn [117]: soup.find(id=\"link2\")\nOut[117]:\
    \  Lacie\n\nListing 5-26\nUsing Beautiful Soup to Extract Data from HTML\n```\n\
    \nIt is possible to extract all the URLs found within a page’s `<a>` tags, as\
    \ shown in Listing [5-27](#472943_1_En_5_Chapter.xhtml#PC37).\n\n```\nIn [118]:\
    \ for link in soup.find_all('a'):\nprint(link.get('href'))\nListing 5-27\nExtracting\
    \ All URLs in Web Page Content\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figaf_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figaf_HTML.jpg)\n\
    \nAnother common task is extracting all the text from a page and ignoring all\
    \ the tags, as shown in Listing [5-28](#472943_1_En_5_Chapter.xhtml#PC38).\n\n\
    ```\nIn [119]: print(soup.get_text())\nListing 5-28\nExtracting Only the Contents\n\
    ```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figag_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figag_HTML.jpg)\n\
    \n# Reading Data from the XML Format\n\nPython provides the `xml.etree.ElementTree`\
    \ (`ET`) module to implement a simple and efficient parsing of XML data. `ET`\
    \ has two classes for this purpose: `ElementTree`, which represents the whole\
    \ XML document as a tree, and `Element`, which represents a single node in this\
    \ tree. Interactions with the whole document (reading and writing to/from files)\
    \ are usually done on the `ElementTree` level. The interactions with a single\
    \ XML element and its subelements are done on the `Element` level. In Listing\
    \ [5-29](#472943_1_En_5_Chapter.xhtml#PC39), you are creating an XML container\
    \ and reading it using `ET` for parsing purposes. Then you extract data from the\
    \ container using the `find()` and `get()` methods, parsing through the generated\
    \ tree.\n\n```\nIn [128]: xmldata = \"\"\"\n\n3.5\n\n2.8\n\n3.7\n\n\"\"\".strip()\n\
    In [129]:from xml.etree import ElementTree as ET stuff = ET.fromstring(xmldata)\
    \ lst = stuff.findall('student')\nprint ('Students count:', len(lst)) for item\
    \ in lst:\nprint (\"\\nName:\", item.get(\"name\"))\nprint ('concentration:',\
    \ item.find(\"concentration\").get(\"name\"))\nprint ('Rank:', item.find('rank').text)\n\
    print ('GPA:', item.find(\"GPA\").text)\nListing 5-29\nReading XML and Extracting\
    \ Its Data\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figah_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figah_HTML.jpg)\n\
    \n# Summary\n\nThis chapter covered data gathering and cleaning so that you can\
    \ have reliable data for analysis. This list recaps what you studied in this chapter:\n\
    \n* How to apply cleaning techniques to handle missing values\n* How to read CSV-formatted\
    \ data offline and directly from the cloud\n* How to merge and integrate data\
    \ from different sources\n* How to read and extract data from JSON, HTML, and\
    \ XML formats\n\nThe next chapter will study how to explore and analyze data and\
    \ much more."
