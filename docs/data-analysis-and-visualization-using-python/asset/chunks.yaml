    ## Case Study 2: Analyzing Gun Deaths in the United States (2012–2014)


    This study analyzes gun deaths in the United States of America between 2012 and
    2014.


    This case study will try to answer the following questions:


    - What is the number of annual suicide gun deaths in the United States from 2012
    to 2014, by gender?

    - What is the number of gun deaths by race in the United States per 100,000 people
    from 2012 to 2014?

    - What is the annual number of gun deaths in the United States on average from
    2012 to 2014, by cause?

    - What is the percentage per 100,000 people of annual gun deaths in the United
    States from 2012 to 2014, by cause?

    - What is the percentage of annual suicide gun deaths in the United States from
    2012 to 2014, by year?


