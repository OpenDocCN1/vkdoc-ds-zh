    ## Python 字符串函数与方法


    有许多内置的方法和函数可用于字符串处理；表 1-14 列出了这些方法。


    **表 1-14** 内置字符串方法


    | 方法/函数 | 描述 |

    | --- | --- |

    | `capitalize()` | 将字符串的第一个字符大写。 |

    | `count(string,begin,end)` | 统计子字符串在字符串中从起始索引到结束索引之间出现的次数。 |

    | `endswith(suffix, begin=0,end=n)` | 如果字符串以给定的后缀结尾（在起始和结束索引之间），则返回布尔值`True`。
    |

    | `find(substring, beginIndex, endIndex)` | 返回子字符串在字符串中从起始索引到结束索引之间首次出现的索引值。 |

    | `index(subsring, beginIndex, endIndex)` | 如果未找到字符串则抛出异常，其他功能与`find()`方法相同。 |

    | `isalnum()` | 如果字符串中的字符都是字母数字（即字母或数字）且至少有一个字符，则返回`True`；否则返回`False`。 |

    | `isalpha()` | 如果所有字符都是字母且至少有一个字符，则返回`True`；否则返回`False`。 |

    | `isdigit()` | 如果所有字符都是数字且至少有一个字符，则返回`True`；否则返回`False`。 |

    | `islower()` | 如果字符串中的字符都是小写，则返回`True`；否则返回`False`。 |

    | `isupper()` | 如果字符串中的字符都是大写，则返回`False`；否则返回`False`。 |

    | `isspace()` | 如果字符串中的字符都是空白字符，则返回`True`；否则返回`False`。 |

    | `len(string)` | 返回字符串的长度。 |

    | `lower()` | 将字符串中的所有字符转换为小写。 |

    | `upper()` | 将字符串中的所有字符转换为大写。 |

    | `startswith(str,begin=0,end=n)` | 如果字符串以给定的`str`开头（在起始和结束索引之间），则返回布尔值`True`。
    |

    | `swapcase()` | 反转字符串中所有字符的大小写。 |

    | `lstrip()` | 移除字符串中所有前导空白字符，也可用于移除前导空白中的特定字符。 |

    | `rstrip()` | 移除字符串中所有尾随空白字符，也可用于移除尾随空白中的特定字符。 |


    代码清单 1-26 展示了如何使用内置方法移除字符串中的空白、统计字符串中的特定字母、检查字符串是否包含另一个字符串等操作。


