    # 表格数据与数据格式


    数据以不同形式存在，可以是**非结构化数据**、**半结构化数据**或**结构化数据**。Python 提供了不同的结构来维护和操作数据，例如变量、列表、字典、元组、序列、面板和数据框。在
    Python 中，可以使用表示数据集中记录的元组列表，以数据框结构轻松表示表格数据。虽然易于创建，但这种表示方式通常无法实现重要的表格数据操作，例如高效的列选择、矩阵运算或电子表格风格的操作。`Tabular`
    是一个用于处理表格数据的 Python 模块包。其主要对象是 `tabarray` 类，这是一种用于保存和操作表格数据的数据结构。你可以将数据放入 `tabarray`
    对象中，以实现更灵活、更强大的数据处理。Pandas 库也提供了丰富的数据结构和函数，旨在使结构化数据的处理变得快速、简单且富有表现力。此外，它还提供了一个强大且高效的数据分析环境。


    可以使用以下构造函数创建 Pandas 数据框：


    ```

    pandas.DataFrame( data, index, columns, dtype, copy)

    ```


    Pandas 数据框可以通过多种输入形式创建，例如：


    *   列表

    *   字典

    *   序列

    *   Numpy ndarrays

    *   另一个数据框


    第 3 章将详细演示数据框结构的创建和操作。


    ## Python Pandas 数据科学库


    Pandas 是一个开源的 Python 库，通过其强大的数据结构提供高性能的数据操作和分析工具。Pandas 这个名字来源于“面板数据”（panel data），这是一个计量经济学中用于多维数据的术语。以下是
    Pandas 库的主要特性：


    *   提供从不同格式加载数据对象的机制

    *   创建具有默认和自定义索引的高效数据框对象

    *   重塑和透视数据集

    *   提供处理缺失数据的有效机制

    *   合并、分组、聚合和转换数据

    *   通过实现切片、索引、子集化、删除和插入等各种功能来操作大型数据集

    *   提供高效的时间序列功能


    有时你需要导入 Pandas 包，因为标准的 Python 发行版不附带 Pandas 模块。一个轻量级的替代方案是使用流行的 Python 包安装程序 `pip`
    来安装 Numpy。Pandas 库用于创建和处理序列、数据框和面板。


    ### Pandas 序列


    *序列*是一种一维标签数组，能够保存任何类型的数据（整数、字符串、浮点数、Python 对象等）。清单 1-29 展示了如何使用 Pandas 库创建序列。


    ```

    In [34]:#使用 pandas 和 numpy 从数组创建序列

    import pandas as pd

    import numpy as np

    data = np.array([90,75,50,66])

    s = pd.Series(data,index=[''A'',''B'',''C'',''D''])

    print (s)

    A 90

    B 75

    C 50

    D 66

    dtype: int64

    In [36]:print (s[1])


    In [37]:#使用 pandas 从字典创建序列

    import pandas as pd

    import numpy as np

    data = {''Ahmed'' : 92, ''Ali'' : 55, ''Omar'' : 83}

    s = pd.Series(data,index=[''Ali'',''Ahmed'',''Omar''])

    print (s)

    Ali 55

    Ahmed 92

    Omar 83

    dtype: int64

    In [38]:print (s[1:])

    Ahmed 92

    Omar 83

    dtype: int64

    清单 1-29

    使用 Pandas 库创建序列

    ```


    ### Pandas 数据框


    *数据框*是一种二维数据结构。换句话说，数据以表格形式按行和列对齐。在下表中，你有两列和三行数据。清单 1-30 展示了如何使用 Pandas 库创建数据框。


    | 姓名 | 年龄 |

    | --- | --- |

    | Ahmed | 35 |

    | Ali | 17 |

    | Omar | 25 |


    ```

    In [39]:import pandas as pd

    data = [[''Ahmed'',35],[''Ali'',17],[''Omar'',25]]

    DataFrame1 = pd.DataFrame(data,columns=[''Name'',''Age''])

    print (DataFrame1)

    Name   Age

    0  Ahmed  35

    1  Ali    17

    2  Omar   25

    清单 1-30

    使用 Pandas 库创建数据框

    ```


    你可以从索引 1 开始到行尾检索数据框中的数据。


    ```

    In [40]: DataFrame1[1:]

    Out[40]:     Name   Age

    1   Ali    17

    2   Omar   25

    ```


    你可以使用字典创建数据框。


    ```

    In [41]:import pandas as pd

    data = {''Name'':[''Ahmed'', ''Ali'', ''Omar'', ''Salwa''],''Age'':[35,17,25,30]}

    dataframe2 = pd.DataFrame(data, index=[100, 101, 102, 103])

    print (dataframe2)

    Age    Name

    100   35     Ahmed

    101   17     Ali

    102   25     Omar

    103   30     Salwa

    ```


    你可以只选择数据框中的前两行。


    ```

    In [42]: dataframe2[:2]

    Out[42]:     Age   Name

    100   35    Ahmed

    101   17    Ali

    ```


    你可以只选择数据框中的 `name` 列。


    ```

    In [43]: dataframe2[''Name'']

    Out[43]:100         Ahmed

    101    Ali

    102    Omar

    103    Salwa

    Name: Name, dtype: object

    ```


    ### Pandas 面板


    *面板*是一个 3D 数据容器，可以从不同的数据结构创建，例如从数据框字典创建，如清单 1-31 所示。


    ```

    In [44]:# 创建一个面板

    import pandas as pd

    import numpy as np

    data = {''Temperature Day1'' : pd.DataFrame(np.random.randn(4, 3)),''Temperature
    Day2'' : pd.DataFrame(np.random.randn(4, 2))}

    p = pd.Panel(data)

    print (p[''Temperature Day1''])

    0        1          2

    0   1.152400    -1.298529   1.440522

    1   -1.404988   -0.105308   -0.192273

    2   -0.575023   -0.424549   0.146086

    3   -1.347784   1.153291   -0.131740

    清单 1-31

    使用 Pandas 库创建面板

    ```


    ## Python Lambda 与 Numpy 库


    lambda 运算符是一种创建小型匿名函数的方法，换句话说，就是没有名称的函数。这些函数是一次性函数；它们只在创建它们的地方被需要。lambda 特性主要对
    Lisp 程序员有用。Lambda 函数与 `filter()`、`map()` 和 `reduce()` 函数结合使用。


    *匿名*函数是指没有命名的函数，通过使用关键字 `lambda` 创建。lambda 的创建不使用 `def` 关键字；它接受任意数量的参数并返回一个求值后的表达式，如清单
    1-32 所示。


    ```

    In [34]:# 匿名函数定义

    summation=lambda val1, val2: val1 + val2#将 summation 作为函数调用

    print ("The summation of 7 + 10 = ", summation(7,10) )

    The summation of 7 + 10 = 17

    In [46]:result = lambda x, y : x * y

    result(2,5)

    Out[46]: 10

    In [47]:result(4,10)

    Out[47]: 40

    清单 1-32

    匿名函数

    ```


    ### map() 函数


    `map()` 函数用于将特定函数应用于数据序列。`map()` 函数有两个参数。


    ```

    r = map(func, seq)

    ```


    这里，`func` 是要应用的函数名称，`seq` 是序列（例如，列表），它将函数 `func` 应用于序列 `seq` 的所有元素。它返回一个新列表，其中的元素已被
    `func` 改变，如清单 1-33 所示。


    ```

    In [65]:def fahrenheit(T):

    return ((float(9)/5)*T + 32)

    def celsius(T):

    return (float(5)/9)*(T-32)

    Temp = (15.8, 25, 30.5,25)

    F = list ( map(fahrenheit, Temp))

    C = list ( map(celsius, F))

    print (F)

    print (C)

    [60.44, 77.0, 86.9, 77.0]

    [15.799999999999999, 25.0, 30.500000000000004, 25.0]

    In [72]:Celsius = [39.2, 36.5, 37.3, 37.8]

    Fahrenheit = map(lambda x: (float(9)/5)*x + 32, Celsius)

    for x in Fahrenheit:

    print(x)

    102.56

    97.7

    99.14

    100.03999999999999

    清单 1-33

    使用 map() 函数

    ```

