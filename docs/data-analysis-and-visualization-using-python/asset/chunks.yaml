    # 3. Data Collection Structures


    Lists, dictionaries, tuples, series, data frames, and panels are Python data collection
    structures that can be used to maintain a collection of data. This chapter will
    demonstrate these various structures in detail with practical examples.


    ## Lists


    A *list* is a sequence of values of any data type that can be accessed forward
    or backward. Each value is called an *element* or a *list item*. Lists are mutable,
    which means that you won’t create a new list when you modify a list element. Elements
    are stored in the given order. Various operations can be conducted on lists such
    as insertion, sort, and deletion. A list can be created by storing a sequence
    of different types of values separated by commas. A Python list is enclosed between
