    ### Adding and Updating Lists


    You can update single or multiple elements of lists by giving the slice on the
    left side of the assign operator, and you can add elements to a list with the
    `append()` method, as shown in Listing [3-3](#472943_1_En_3_Chapter.xhtml#PC3).


    ```

    In [50]: courses=["OOP","Networking","MIS","Project"] students=["Ahmed", "Ali",

    "Salim", "Abdullah", "Salwa"] OOP_marks = [65, 85, 92]

    OOP_marks.append(50)    # Add new element

    OOP_marks.append(77)    # Add new element

    print (OOP_marks[ : ])  # Print list before updating

    OOP_marks[0]=70         # update new element

    OOP_marks[1]=45         # update new element

    list1 = [88, 93]

    OOP_marks.extend(list1) # extend list with another list print

    (OOP_marks[ : ])        # Print list after updating

    [65, 85, 92, 50, 77]

    [70, 45, 92, 50, 77, 88, 93]

    Listing 3-3

    Adding and Updating List Elements

    ```


    As shown in Listing [3-3](#472943_1_En_3_Chapter.xhtml#PC3), you can add a new
    element to the list using the `append()` method. You can also update an element
    in the list by using the list name and the element index. For example, `OOP_marks[1]=45`
    changes the value of index 1 from 85 to 45.


    ### Deleting List Elements


    To remove a list element, either you can delete it using the `del` statement in
    the element index, or you can remove the element using the `remove()` method via
    the element value in the list. If you use the `remove()` method to remove an element
    that is repeated more than one time in the list, it removes only the first occurrence
    of that element inside the list. Also, you can use the `pop()` method to remove
    a specific element by its index value, as shown in Listing [3-4](#472943_1_En_3_Chapter.xhtml#PC4).


    ```

    In [48]: OOP_marks = [70, 45, 92, 50, 77, 45]

    print (OOP_marks)

    del OOP_marks[0] # delete an element using del

    print (OOP_marks)

    OOP_marks.remove (45) # remove an element using remove() method

    print (OOP_marks)

    OOP_marks.pop (2) # remove an element using pop() method

    print (OOP_marks)

    [70, 45, 92, 50, 77, 45]

    [45, 92, 50, 77, 45]

    [92, 50, 77, 45]

    [92, 50, 45]

    Listing 3-4

    Deleting an Element from a List

    ```


    ### Basic List Operations


    Like string processing, lists respond to `+` and `*` operators as concatenation
    and repetition, except that the result is a new list, as shown in Listing [3-5](#472943_1_En_3_Chapter.xhtml#PC5).


