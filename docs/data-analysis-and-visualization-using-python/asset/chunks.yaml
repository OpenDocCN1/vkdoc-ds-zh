    # 7. Data Visualization


    Python provides numerous methods for data visualization. Various Python libraries
    can be used for data visualization, such as Pandas, Seaborn, Bokeh, Pygal, and
    Ploty. Python Pandas is the simplest method for basic plotting. Python Seaborn
    is great for creating visually appealing statistical charts that include color.
    Python Bokeh works great for more complicated visualizations, especially for web-based
    interactive presentations. Python Pygal works well for generating vector and interactive
    files. However, it does not have the flexibility that other methods do. Python
    Plotly is the most useful and easiest option for creating highly interactive web-based
    visualizations.


    Bar charts are an essential visualization tool used to compare values in a variety
    of categories. A bar chart can be vertically or horizontally oriented by adjusting
    the x- and y-axes, depending on what kind of information or categories the chart
    needs to present. This chapter demonstrates the use and implementation of various
    visualization tools; the chapter will use the `salaries.csv` file shown in Figure
    [7-1](#472943_1_En_7_Chapter.xhtml#Fig1) as the data set for plotting purposes.


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Fig1_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Salaries data set


    ## Direct Plotting


    Pandas is a Python library with data frame features that supplies built-in options
    for plotting visualizations in a two-dimensional tabular style. In Listing [7-1](#472943_1_En_7_Chapter.xhtml#PC1),
    you read the Salaries data set and create some vectors of variables, which are
    `rank`, `discipline`, `phd`, `service`, `sex`, and `salary`.


    ```

    In [3]: import pandas as pd

    dataset = pd.read_csv("./Data/Salaries.csv")

    rank = dataset[''rank'']

    discipline = dataset[''discipline'']

    phd = dataset[''phd'']

    service = dataset[''service'']

    sex = dataset[''sex'']

    salary = dataset[''salary'']

    dataset.head()

    Listing 7-1

    Reading the Data Set

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figa_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figa_HTML.jpg)


    ### Line Plot


    You can use line plotting as shown in Listing [7-2](#472943_1_En_7_Chapter.xhtml#PC2).
    It’s important to ensure the data units, such as the `phd`, `service`, and `salary`
    variables, are used for plotting. However, only the salaries are visible, while
    the `phd` and `service` information is not clearly displayed on the plot. This
    is because the numerical units in the salaries are in the hundreds of thousands,
    while the `phd` and `services` information is in very small units.


    ```

    In [5]: dataset[["rank", "discipline","phd","service", "sex", "salary"]].plot()

    Listing 7-2

    Visualizing Patterns with High Differences in Numerical Units

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figb_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figb_HTML.jpg)


    Let’s visualize more comparable units such as the `phd` and `services` information,
    as shown in Listing [7-3](#472943_1_En_7_Chapter.xhtml#PC3). You can observe the
    correlation between `phd` and `services` over the years, except from age 55 up
    to 80, where `services` decline, which means that some people left the service
    at the age of 55 and older.


    ```

    In [6]: dataset[["phd","service"]].plot()

    Listing 7-3

    Visualizing Patterns with Close Numerical Units

    ```


    ![../images/472943_1_En_7_Chapter/472943_1_En_7_Figc_HTML.jpg](images/472943_1_En_7_Chapter/472943_1_En_7_Figc_HTML.jpg)


    In Listing [7-4](#472943_1_En_7_Chapter.xhtml#PC4), you are grouping data by service
    and summarizing the salaries per service category. Then you sort the derived data
    set in descending order according to the salaries. Finally, you plot the sorted
    data set using a bar chart.


    ```

    In [4]: dataset1 = dataset.groupby([''service'']).sum()

    dataset1.sort_values("salary", ascending = False, inplace=True)

    dataset1.head()

    Listing 7-4

    Visualizing Salaries per Service Category

    ```


