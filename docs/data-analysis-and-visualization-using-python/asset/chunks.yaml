    \ gsilver@umich.edu\nFrom: wagnermr@iupui.edu\nFrom: zqian@umich.edu\nFrom: antranig@caret.cam.ac.uk\n\
    From: gopal.ramasammycook@gmail.com\nFrom: david.horwitz@uct.ac.za\nFrom: david.horwitz@uct.ac.za\n\
    From: david.horwitz@uct.ac.za\nFrom: david.horwitz@uct.ac.za\nFrom: stephen.marquard@uct.ac.za\n\
    From: louis@media.berkeley.edu\nFrom: louis@media.berkeley.edu\nFrom: ray@media.berkeley.edu\n\
    From: cwen@iupui.edu\nFrom: cwen@iupui.edu\nFrom: cwen@iupui.edu\n```\n清单 4-7：提取以特定模式开头的行\n\
    \n虽然正则表达式对于从文本中提取数据很有用，但应谨慎使用。清单 4-9 中的正则表达式查找所有以大写字母 *X* 开头、后跟零个或多个任意字符、并以冒号（`:`）结尾的文本。\n\
    \n```python\nIn [48]: import re\nprint(\"\\nRegular Expressions\\n'^X.*:' \\n\"\
    )\nhand = open('Data.txt')\nfor line in hand:\n    line = line.rstrip()\n    y\
    \ = re.findall('^X.*:', line)\n    print(y)\n```\n清单 4-9：正则表达式示例\n\n这是一个用于维护文本数据的文本文件，我们用它来应用正则表达式，如下所示。\n\
    \n![../images/472943_1_En_4_Chapter/472943_1_En_4_Figb_HTML.jpg](img/472943_1_En_4_Figb_HTML.jpg)\n\
    \n在以下代码中，表达式 `'^X.*:'` 检索所有以大写字母 *X* 开头、后跟零个或多个任意字符（包括空格）、并以冒号分隔符（`:`）结尾的行。然而，它没有考虑空白字符。清单\
    \ 4-10 仅检索匹配模式中不包含空白字符的值。\n\n```python\nIn [49]: print(\"\\nRegular Expressions\\\
    nWild-Card Characters '^X-\\S+:'\\n\")\nhand = open('Data.txt')\nfor line in hand:\n\
    \    line = line.rstrip()\n    y = re.findall('^X-\\S+:', line)  # 匹配任何非空白字符\n\
    \    print(y)\n```\n```\nRegular Expressions\nWild-Card Characters 'X-\\S+:'\n\
    ['X-Sieve:']\n['X-DSPAM-Result:']\n['X-DSPAM-Confidence:']\n[]\n[]\n```\n清单 4-10：提取非空白模式\n\
    \n```\n'X.*:'\n['X-Sieve:']\n['X-DSPAM-Result:']\n['X-DSPAM-Confidence:']\n['X-\
    \ Content-Type-Message-Body:']\n['X-Plane is behind schedule:']\n```\n\n正则表达式使您能够提取字符串中的数值，并在字符串中查找特定的字符模式，如清单\
    \ 4-11 所示。\n\n```python\nIn [50]: print(\"\\n Matching and Extracting Data \\\
    n\")\nx = 'My 2 favorite numbers are 19 and 42'\ny = re.findall('[0-9]+', x)\n\
    print(y)\n```\n```\nMatching and Extracting Data\n['2', '19', '42']\n```\n```python\n\
    In [51]: y = re.findall('[AEsOUn]+', x)  # 在字符串中查找这些字符中的任意一个\nprint(y)\n```\n\
    ```\n['n', 's', 'n']\n```\n清单 4-11：提取数值和特定字符\n\n虽然正则表达式对于提取数据很有用，但应谨慎实现。以下示例展示了贪婪提取和非贪婪提取。在清单\
    \ 4-12 的第一个示例中，Python 查找以 *F* 开头、包含任意数量字符直到冒号的字符串，并在到达行尾时停止。这就是为什么即使找到第一个冒号，它也会继续检索字符。在第二个示例中，`re.findall('^F.+?:',\
    \ x)` 要求 Python 检索以 *F* 开头、以分隔符（即冒号）第一次出现位置结尾的字符，无论是否到达行尾。\n\n```python\nIn [52]:\
    \ print(\"\\nGreedy Matching \\n\")\nx = 'From: Using the : character'\ny = re.findall('^F.+:',\
    \ x)\nprint(y)\n```\n```\nGreedy Matching\n['From: Using the :']\n```\n```python\n\
    In [53]: print(\"\\nNon-Greedy Matching \\n\")\nx = 'From: Using the : character'\n\
    y = re.findall('^F.+?:', x)\nprint(y)\n```\n```\nNon-Greedy Matching\n['From:']\n\
    ```\n清单 4-12：贪婪匹配与非贪婪匹配\n\n表 4-4 展示了正则表达式的各种实现。\n\n**表 4-4** 正则表达式示例\n\n| 序号 |\
    \ 示例 | 描述 |\n| --- | --- | --- |\n| 1 | `[Pp]ython` | 匹配 `\"Python\"` 或 `\"python\"\
    ` |\n| 2 | `rub[ye]` | 匹配 `\"ruby\"` 或 `\"rube\"` |\n| 3 | `[aeiou]` | 匹配任意一个小写元音字母\
    \ |\n| 4 | `[0-9]` | 匹配任意一个数字；等同于 `[0123456789]` |\n| 5 | `[a-z]` | 匹配任意一个小写 ASCII\
    \ 字母 |\n| 6 | `[A-Z]` | 匹配任意一个大写 ASCII 字母 |\n| 7 | `[a-zA-Z0-9]` | 匹配上述任意字符 |\n\
    | 8 | `[^aeiou]` | 匹配除小写元音字母外的任意字符 |\n| 9 | `[⁰-9]` | 匹配除数字外的任意字符 |\n\n### 特殊字符类\n\
    \n正则表达式中使用一些特殊字符来提取数据。表 4-5 总结了其中一些特殊字符。\n\n**表 4-5** 正则表达式特殊字符\n\n| 序号 | 示例 |\
    \ 描述 |\n| --- | --- | --- |\n| 1 | `.` | 匹配除换行符外的任意字符 |\n| 2 | `\\d` | 匹配一个数字：`[0-9]`\
    \ |\n| 3 | `\\D` | 匹配一个非数字：`[⁰-9]` |\n| 4 | `\\s` | 匹配一个空白字符：`[ \\t\\r\\n\\f]`\
    \ |\n| 5 | `\\S` | 匹配一个非空白字符：`[^ \\t\\r\\n\\f]` |\n| 6 | `\\w` | 匹配一个单词字符：`[A-Za-z0-9_]`\
    \ |\n| 7 | `\\W` | 匹配一个非单词字符：`[^A-Za-z0-9_]` |\n\n### 重复类\n\n字符串可能存在不同拼写，例如“ok”和“okay”。为处理此类情况，可以使用重复表达式，如表\
    \ 4-6 所示。\n\n**表 4-6** 正则表达式重复字符\n\n| 序号 | 示例 | 描述 |\n| --- | --- | --- |\n| 1\
    \ | `ruby?` | 匹配 `\"rub\"` 或 `\"ruby\"`；*y* 是可选的 |\n| 2 | `ruby*` | 匹配 `\"rub\"\
    ` 加上零个或多个 *y* |\n| 3 | `ruby+` | 匹配 `\"rub\"` 加上一个或多个 *y* |\n| 4 | `\\d{3}` |\
    \ 匹配恰好三个数字 |\n| 5 | `\\d{3,}` | 匹配三个或更多数字 |\n| 6 | `\\d{3,5}` | 匹配三个、四个或五个数字 |\n\
    \n### 选择\n\n选择指的是可以使用多个表达式语句来提取数据的表达式，如表 4-7 所示。\n\n**表 4-7** 选择正则表达式字符\n\n| 序号\
    \ | 示例 | 描述 |\n| --- | --- | --- |\n| 1 | `python\\|RLang` | 匹配 `\"python\"` 或\
    \ `\"RLang\"` |\n| 2 | `R(L\\|Lang)` | 匹配 `\"RL\"` 或 `\"RLang\"` |\n| 3 | `Python(!+\\\
    |\\?)` | `\"Python\"` 后跟一个或多个 `!` 或一个 `?` |\n"
- fmt: "### Anchors\n\nAnchors enable you to determine the position in which you can\
    \ find the match pattern in a string. Table [4-8](#472943_1_En_4_Chapter.xhtml#Tab8)\
    \ demonstrates numerous examples of anchors.\n\n**Table 4-8** Anchor Characters\n\
    \n| No. | Example | Description |\n| --- | --- | --- |\n| 1 | `^Python` | Matches\
    \ `\"Python\"` at the start of a string or internal line |\n| 2 | `Python$` |\
    \ Matches `\"Python\"` at the end of a string or line |\n| 3 | `\\APython` | Matches\
    \ `\"Python\"` at the start of a string |\n| 4 | `Python\\Z` | Matches `\"Python\"\
    ` at the end of a string |\n| 5 | `\\bPython\\b` | Matches `\"Python\"` at a word\
    \ boundary |\n| 6 | `\\brub\\B` | `\\B` is nonword boundary: matches `\"rub\"\
    ` in *rube* and *ruby* but not on its own |\n| 7 | `Python(?=!)` | Matches `\"\
    Python,\"` if followed by an exclamation point |\n| 8 | `Python(?!!)` | Matches\
    \ `\"Python,\"` if not followed by an exclamation point |\n\nNot only are regular\
    \ expressions used to extract data from strings, but various built-in methods\
    \ can be used for the same purposes. Listing [4-13](#472943_1_En_4_Chapter.xhtml#PC16)\
    \ demonstrates the use of methods versus regular expressions to extract the same\
    \ characters.\n\n```\nIn [54]: import re\nprint (\"\\nFine-Tuning String Extraction\
    \ \\n\")\nmystr=\"From ossama.embarak@hct.ac.ae Sat Jun 5 08:14:16 2018\" Extract\
    \ = re.findall('\\S+@\\S+',mystr)\nprint (Extract)\nE_xtracted = re.findall('^From.*?\
    \ (\\S+@\\S+)',mystr) # non greedy white space\nprint (E_xtracted)\nprint (E_xtracted[0])\n\
    Fine-Tuning String Extraction\n['ossama.embarak@hct.ac.ae']\n['ossama.embarak@hct.ac.ae']\n\
    ossama.embarak@hct.ac.ae\nIn [57]: mystr=\"From ossama.embarak@hct.ac.ae Sat Jun\
    \ 5 08:14:16 2018\"\natpos = mystr.find('@')\nsppos = mystr.find(' ',atpos) #\
    \ find white space starting from atpos\nhost = mystr[atpos+1 : sppos]\nprint (host)\n\
    usernamepos = mystr.find(' ')\nusername = mystr[usernamepos+1 : atpos]\nprint\
    \ (username)\nhct.ac.ae\nossama.embarak\nListing 4-13\nThe Use of Methods vs.\
    \ Regular Expressions\n```\n\n`re.findall('@([^ ]*)',mystr)` retrieves a substring\
    \ in the `mystr` string, which starts after `@` and continues until finding the\
    \ whitespace. Similarly, `re.findall('^From .*@([^ ]*)', mystr)` retrieves a substring\
    \ in the `mystr` string, which starts after `From` and finds zero or more characters\
    \ and then the `@` character *and then anything other than whitespace characters.*\
    \ See Listing [4-14](#472943_1_En_4_Chapter.xhtml#PC17).\n\n```\nIn [58]: print\
    \ (\"\\n The Regex Version\\n\")\nimport re\nmystr=\"From ossama.embarak@hct.ac.ae\
    \ Sat Jun 5 08:14:16 2018\"\nExtract = re.findall('@([^ ]*)',mystr)\nprint (Extract)\n\
    Extract = re.findall('^From .*@([^ ]*)',mystr)\nprint (Extract)\nThe Regex Version\n\
    ['hct.ac.ae']\n['hct.ac.ae']\nIn [59]: print (\"\\nScape character \\n\")\nmystr\
    \ = 'We just received $10.00 for cookies and $20.23 for juice'\nExtract = re.findall('\\\
    $[0-9.]+',mystr)\nprint (Extract)\nScape character\n['$10.00', '$20.23']\nListing\
    \ 4-14\nUsing the Regular Expression findall() Method\n```\n\n## Summary\n\nThis\
    \ chapter covered input/output data read or pulled from stored files or directly\
    \ read from users. Let’s recap what was covered in this chapter.\n\n*   The chapter\
    \ covered how to open files for reading, writing, or both. Furthermore, it covered\
    \ how to access the attributes of open files and close all opened sessions.\n\
    *   The chapter covered how to collect data directly for users via the screen.\n\
    *   It covered regular expressions and their patterns and special character usage.\n\
    *   The chapter covered how to apply regular expressions to extract data and how\
    \ to use alternatives, anchors, and repetition expressions for data extraction.\n\
    \nThe next chapter will study techniques of gathering and cleaning data for further\
    \ processing, and much more.\n\n## Exercises and Answer\n\n1.  Write a Python\
    \ script to extract a course number, code, and name from the following text using\
    \ regular expressions:\n\n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT\
    \ Mathematics\n189 ENG English\"\"\"\n```\n\n**Answer:**\n\n1.  Write a Python\
    \ script to extract each course’s details in a tuple form from the following text\
    \ using regular expressions. In addition, use regular expressions to retrieve\
    \ string values in the `CoursesData` and then retrieve numerical values in `CoursesData`.\n\
    \n    **Answer:**\n\n```\nIn [60]: import re\nCoursesData = \"\"\"101 COM Computers\n\
    205 MAT  Mathematics\n189 ENG  English\"\"\"\nIn [61]: # Extract all course numbers\n\
    Course_numbers = re.findall('[0-9]+', CoursesData)\nprint (Course_numbers)\n#\
    \ Extract all course codes\nCourse_codes = re.findall('[A-Z]{3}', CoursesData)\n\
    print (Course_codes)\n# Extract all course names\nCourse_names = re.findall('[A-Za-z]{4,}',\
    \ CoursesData) print (Course_names)\n['101', '205', '189']\n['COM', 'MAT', 'ENG']\n\
    ['Computers', 'Mathematics', 'English']\n```\n\n1.  Write a Python script to extract\
    \ digits of size 4 and digits of size 2 to 4 using regular expressions.\n\n  \
    \  **Answer:**\n\n```\nIn [63]: # define the course text pattern groups and extract\n\
    course_pattern = '([0-9]+)\\s*([A-Z]{3})\\s*([A-Za-z]{4,})'\nre.findall(course_pattern,\
    \ CoursesData)\nOut[63]: [('101', 'COM', 'Computers'),\n('205', 'MAT', 'Mathematics'),\n\
    ('189', 'ENG', 'English')]\nIn [64]: print(re.findall('[a-zA-Z]+', CoursesData))\
    \ # [] Matches any character inside\n['COM', 'Computers', 'MAT', 'Mathematics',\
    \ 'ENG', 'English']\nIn [65]: print(re.findall('[0-9]+', CoursesData)) # [] Matches\
    \ any numeric inside\n['101', '205', '189']\n```\n\n```\nCoursesData = \"\"\"\
    101 COM Computers\n205 MAT Mathematics\n189 ENG English\"\"\"\n```\n\n```\nIn\
    \ [66]: import re\nCoursesData = \"\"\"10 COM Computers\n205 MAT Mathematics 1899\
    \ ENG English\"\"\"\nprint(re.findall('\\d{4}', CoursesData)) # {n} Matches repeat\
    \ n times.\nprint(re.findall('\\d{2,4}', CoursesData))\n['1899']\n['10', '205',\
    \ '1899']\n```\n\n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT Mathematics\n\
    189 ENG English\"\"\"\n```\n\n# 5. Data Gathering and Cleaning\n\nIn the 21st\
    \ century, data is vital for decision-making and developing long-term strategic\
    \ plans. Python provides numerous libraries and built-in features that make it\
    \ easy to support data analysis and processing. Making business decisions, forecasting\
    \ weather, studying protein structures in biology, and designing a marketing campaign\
    \ are all examples that require collecting data and then cleaning, processing,\
    \ and visualizing it.\n\nThere are five main steps for data science processing.\n\
    \n1.  *Data acquisition* is where you read data from various sources of unstructured\
    \ data, semistructured data, or full-structured data that might be stored in a\
    \ spreadsheet, comma-separated file, web page, database, etc.\n2.  *Data cleaning*\
    \ is where you remove noisy data and make operations needed to keep only the relevant\
    \ data.\n3.  *Exploratory analysis* is where you look at your cleaned data and\
    \ make statistical processing fits for specific analysis purposes.\n4.  An *analysis\
    \ model* needs to be created. Advanced tools such as machine learning algorithms\
    \ can be used in this step.\n5.  *Data visualization* is where the results are\
    \ plotted using various systems provided by Python to help in the decision-making\
    \ process.\n\nPython provides several libraries for data gathering, cleaning,\
    \ integration, processing, and visualizing.\n\n*   `Pandas` is an open source\
    \ Python library used to load, organize, manipulate, model, and analyze data by\
    \ offering powerful data structures.\n*   `Numpy` is a Python package that stands\
    \ for “numerical Python.” It is a library consisting of multidimensional array\
    \ objects and a collection of routines for manipulating arrays. It can be used\
    \ to perform mathematical, logical, and linear algebra operations on arrays.\n\
    *   `SciPy` is another built-in Python library for numerical integration and optimization.\n\
    *   `Matplotlib` is a Python library used to create 2D graphs and plots. It supports\
    \ a wide variety of graphs and plots such as histograms, bar charts, power spectra,\
    \ error charts, and so on, with additional formatting such as control line styles,\
    \ font properties, formatting axes, and more."
