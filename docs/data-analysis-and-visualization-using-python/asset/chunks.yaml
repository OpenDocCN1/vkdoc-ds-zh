    Table 4-4


    Examples of Regular Expressions


    | No. | Example | Description |

    | --- | --- | --- |

    | 1 | `[Pp]ython` | Matches `"Python"` or `"python"` |

    | 2 | `rub[ye]` | Matches `"ruby"` or `"rube"` |

    | 3 | `[aeiou]` | Matches any one lowercase vowel |

    | 4 | `[0-9]` | Matches any digit; same as `[0123456789]` |

    | 5 | `[a-z]` | Matches any lowercase ASCII letter |

    | 6 | `[A-Z]` | Matches any uppercase ASCII letter |

    | 7 | `[a-zA-Z0-9]` | Matches any of the above |

    | 8 | `[^aeiou]` | Matches anything other than a lowercase vowel |

    | 9 | `[^0-9]` | Matches anything other than a digit |


    ### Special Character Classes


    Some special characters are used within regular expressions to extract data. Table
    [4-5](#472943_1_En_4_Chapter.xhtml#Tab5) summarizes some of these special characters.


    Table 4-5


    Regular Expression Special Characters


    | No. | Example | Description |

    | --- | --- | --- |

    | 1 | . | Matches any character except newline |

    | 2 | \d | Matches a digit: `[0-9]` |

    | 3 | \D | Matches a nondigit: `[^0-9]` |

    | 4 | \s | Matches a whitespace character: `[ \t\r\n\f]` |

    | 5 | \S | Matches nonwhitespace: `[^ \t\r\n\f]` |

    | 6 | \w | Matches a single word character: `[A-Za-z0-9_]` |

    | 7 | \W | Matches a nonword character: `[^A-Za-z0-9_]` |


    ### Repetition Classes


    It is possible to have a string with different spelling such as “ok” and “okay.”
    To handle such cases, you can use repetition expressions, as shown in Table [4-6](#472943_1_En_4_Chapter.xhtml#Tab6).


    Table 4-6


    Regular Expression Repetition Characters


    | No. | Example | Description |

    | --- | --- | --- |

    | 1 | `ruby?` | Matches `"rub"` or `"ruby"`; the *y* is optional |

    | 2 | `ruby*` | Matches `"rub"` plus zeros or more *y*s |

    | 3 | `ruby+` | Matches `"rub"` plus one or more *y*s |

    | 4 | `\d{3}` | Matches exactly three digits |

    | 5 | `\d{3,}` | Matches three or more digits |

    | 6 | `\d{3,5}` | Matches three, four, or five digits |


    ### Alternatives


    Alternatives refer to expressions where you can use multiple expression statements
    to extract data, as shown in Table [4-7](#472943_1_En_4_Chapter.xhtml#Tab7).


    Table 4-7


    Alternative Regular Expression Characters


    | No | Example | Description |

    | --- | --- | --- |

    | 1 | `python&#124;RLang` | Matches `"python"` or `" RLang "` |

    | 2 | `R(L&#124;Lang))` | Matches `" RL"` or `" RLang"` |

    | 3 | `Python(!+&#124;\?)` | `"Python"` followed by one or more `!` or one `?`
    |'
