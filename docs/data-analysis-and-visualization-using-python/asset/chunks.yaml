    print (Staff_Salary.keys())\nprint()\nSTDMarks.setdefault('Ali Ziad')\nprint (STDMarks)\n\
    print (STDMarks.update(dict1))\nprint (STDMarks)\n\ndict_items([('Salwa Ahmed',\
    \ 50), ('Abdullah Mohamed', 80), ('Sultan Ghanim', 90)])\ndict_keys(['Omar Ahmed',\
    \ 'Ali Ziad', 'Ossama Hashim', 'Majid Hatem'])\n{'Salwa Ahmed': 50, 'Abdullah\
    \ Mohamed': 80, 'Sultan Ghanim': 90, 'Ali Ziad': None}\nNone\n{'Salwa Ahmed':\
    \ 50, 'Abdullah Mohamed': 80, 'Sultan Ghanim': 90, 'Ali Ziad': None}\n代码清单 3-17\n\
    实现字典方法\n```\n\n你可以按键和按值对字典进行排序，如代码清单 3-18 所示。\n\n```\nIn [96]: Staff_Salary =\
    \ { 'Omar Ahmed' : 30000 , 'Ali Ziad' : 24000, 'Ossama Hashim': 25000, 'Majid\
    \ Hatem':10000}\nprint (\"\\nSorted by key\")\nfor k in sorted(Staff_Salary):\n\
    print (k, Staff_Salary[k])\nSorted by key\nAli Ziad 24000\nMajid Hatem 10000\n\
    Omar Ahmed 30000\nOssama Hashim 25000\nIn [97]: Staff_Salary = { 'Omar Ahmed'\
    \ : 30000 , 'Ali Ziad' : 24000, 'Ossama Hashim': 25000, 'Majid Hatem':10000}\n\
    print (\"\\nSorted by value\")\nfor w in sorted(Staff_Salary, key=Staff_Salary.get,\
    \ reverse=True):\nprint (w, Staff_Salary[w])\nSorted by value\nOmar Ahmed    \
    \  30000\nOssama Hashim   25000\nAli Ziad        24000\nMajid Hatem     10000\n\
    代码清单 3-18\n排序字典\n```\n\n## 元组\n\n*元组*是一个序列，就像不可变对象的列表一样。元组和列表之间的区别在于元组不能被更改；此外，元组使用圆括号，而列表使用方括号。\n\
    \n### 创建元组\n\n你可以简单地通过使用不同的逗号分隔值来创建元组。你可以通过索引访问元组中的元素，如代码清单 3-19 所示。\n\n```\n\
    In [1]:Names = ('Omar', 'Ali', 'Bahaa')\nMarks = ( 75, 65, 95 )\nprint (Names[2])\n\
    print (Marks)\nprint (max(Marks))\nBahaa\n(75, 65, 95)\n\nIn [2]: for name in\
    \ Names:\nprint (name)\nOmar\nAli\nBahaa\n代码清单 3-19\n创建和显示元组\n```\n\n让我们尝试更改元组以修改任何元素，如代码清单\
    \ 3-20 所示；我们会得到一个错误，因为如前所述，元组不能被更改。\n\n```\nIn [3]: Marks[1]=66\n\nTypeError \
    \   Traceback (most recent call last)\n in ()\n----> 1 Marks[1]=66\nTypeError:\
    \ 'tuple' object does not support item assignment\n代码清单 3-20\n尝试编辑元组\n```\n\n\
    与列表类似，你可以使用元素的索引向前和向后访问元组元素。示例如下：\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figb_HTML.jpg](img/472943_1_En_3_Figb_HTML.jpg)\n\
    \n你可以对元组列表进行排序。代码清单 3-21 展示了如何对元组元素进行原地排序，以及如何创建另一个已排序的元组。\n\n```\nIn [1]:import\
    \ operator\nMarksCIS = [(88,65),(70,90,85), (55,88,44)]\nprint (MarksCIS)    \
    \       # original tuples\nprint (sorted(MarksCIS))   # direct sorting\n[(88,\
    \ 65), (70, 90, 85), (55, 88, 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\nIn\
    \ [2]: print (MarksCIS)     # original tuples\n#create a new sorted tuple\nMarksCIS2\
    \ = sorted(MarksCIS, key=lambda x: (x[0], x[1]))\nprint (MarksCIS2)\n[(88, 65),\
    \ (70, 90, 85), (55, 88, 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\nIn [3]:print\
    \ (MarksCIS) # original tuples\nMarksCIS.sort(key=lambda x: (x[0], x[1])) # sort\
    \ in tuple\nprint (MarksCIS)\n[(88, 65), (70, 90, 85), (55, 88, 44)]\n[(55, 88,\
    \ 44), (70, 90, 85), (88, 65)]\n代码清单 3-21\n排序元组\n```\n\n默认情况下，内置的 `sort` 函数检测到项目是元组形式，因此排序函数会先根据第一个元素排序，然后根据第二个元素排序。\n\
    \n### 连接元组\n\n如前所述，元组是不可变的，这意味着你不能更新或更改元组元素的值。你可以从现有元组中取出一部分来创建新的元组，如代码清单 3-22\
    \ 所示。\n\n```\nIn [5]:MarksCIS=(70,85,55)\nMarksCIN=(90,75,60)\nCombind=MarksCIS\
    \ + MarksCIN\nprint (Combind)\n(70, 85, 55, 90, 75, 60)\n代码清单 3-22\n连接元组\n```\n"
- fmt: "### Accessing Values in Tuples\n\nTo access an element in a tuple, you can\
    \ use square brackets and the element index for retrieving an element value, as\
    \ shown in Listing [3-23](#472943_1_En_3_Chapter.xhtml#PC22).\n\n```\nIn [4]:MarksCIS\
    \ = (70, 85, 55)\nMarksCIN = (90, 75, 60)\nprint (\"The third mark in CIS is \"\
    , MarksCIS[2])\nprint (\"The third mark in CIN is \", MarksCIN[2])\nThe third\
    \ mark in CIS is 55\nThe third mark in CIN is 60\nListing 3-23\nAccessing Values\
    \ in a Tuple\n```\n\nYou can delete a tuple using `de`, as shown in Listing [3-24](#472943_1_En_3_Chapter.xhtml#PC23).\n\
    \n```\nIn [5]: MarksCIN = (90, 75, 60)\nprint (MarksCIN)\ndel MarksCIN\nprint\
    \ (MarksCIN)\n(90, 75, 60)\n\nNameError                                 Traceback\
    \ (most recent call last)\n in ()\n2 print (MarksCIN) 3 del MarksCIN\n----> 4\
    \ print (MarksCIN)\nNameError: name 'MarksCIN' is not defined\nListing 3-24\n\
    Deleting a Tuple\n```\n\nYou received an error because you ordered Python to print\
    \ a tuple named `MarksCIN`, which has been removed. You can access a tuple element\
    \ forward and backward; in addition, you can slice values from a tuple using indices.\
    \ Listing [3-25](#472943_1_En_3_Chapter.xhtml#PC24) shows that you can slice in\
    \ a forward manner where `MarksCIS[1:4]` retrieves elements from element 1 up\
    \ to element 3, while `MarksCIS[:]` retrieves all elements in a tuple. In backward\
    \ slicing, `MarksCIS[-3]` retrieves the third element backward, and `MarksCIS[-4:-2]`\
    \ retrieves the fourth element backward up to the third element but not the second\
    \ backward element.\n\n```\nIn [6]: MarksCIS = (88, 65, 70,90,85,45,78,95,55)\n\
    print (\"\\nForward slicing\")\nprint (MarksCIS[1:4])\nprint (MarksCIS[:3])\n\
    print (MarksCIS[6:])\nprint (MarksCIS[4:6])\nprint (\"\\nBackward slicing\")\n\
    print (MarksCIS[-4:-2])\nprint (MarksCIS[-3])\nprint (MarksCIS[-3:])\nprint (MarksCIS[\
    \ :-3])\nForward slicing\n(65, 70, 90)\n(88, 65, 70)\n(78, 95, 55)\n(85, 45)\n\
    Backward slicing\n(45, 78)\n\n(78, 95, 55)\n(88, 65, 70, 90, 85, 45)\nListing\
    \ 3-25\nSlicing Tuple Values\n```\n\n### Basic Tuples Operations\n\nLike strings,\
    \ tuples respond to the `+` and `*` operators as concatenation and repetition\
    \ to get a new tuple. See Table [3-5](#472943_1_En_3_Chapter.xhtml#Tab6).\n\n\
    **Table 3-5** Tuple Operations\n\n| **Expression** | **Results** | **Description**\
    \ |\n| --- | --- | --- |\n| `len((5, 7, 2,6))` | `4` | Length |\n| `(1, 2, 3,10)\
    \ + (4, 5, 6,7)` | `(1, 2, 3,10, 4, 5, 6,7)` | Concatenation |\n| `('Hi!',) *\
    \ 4` | `('Hi!', 'Hi!', 'Hi!', 'Hi!')` | Repetition |\n| `10 in (10, 2, 3)` | `True`\
    \ | Membership |\n| `for x in (10, 1, 5): print x,` | `10 1 5` | Iteration |\n\
    \n## Series\n\nA series is defined as a one-dimensional labeled array capable\
    \ of holding any data type (integers, strings, floating-point numbers, Python\
    \ objects, etc.).\n\n```\nSeriesX = pd.Series(data, index=index),\n```\n\nHere,\
    \ `pd` is a Pandas form, and `data` refers to a Python dictionary, an ndarray,\
    \ or even a scalar value.\n\n### Creating a Series with index\n\nIf the data is\
    \ an ndarray, then the index is a list of axis labels that is directly passed;\
    \ otherwise, an auto index is created by Python starting with 0 up to n-1. See\
    \ Listing [3-26](#472943_1_En_3_Chapter.xhtml#PC26) and Listing [3-27](#472943_1_En_3_Chapter.xhtml#PC27).\n\
    \n```\nIn [9]:import numpy as np\nimport pandas as pd\nSeries2 = pd.Series(np.random.randn(4))\n\
    print(Series2)\nprint(Series2.index)\n0 1.784219\n1 -0.627832\n2 0.429453\n3 -0.473971\n\
    dtype: float64\nRangeIndex(start=0, stop=4, step=1)\nListing 3-27\nCreating a\
    \ Series of Ndarray Data Without Labels\n```\n\n```\nIn [8]: import numpy as np\n\
    import pandas as pd\nSeries1 = pd.Series(np.random.randn(4), index=['a', 'b',\
    \ 'c', 'd'])\nprint(Series1)\nprint(Series1.index)\na 0.350241\nb -1.214802\n\
    c 0.704124\nd 0.866934\ndtype: float64\nIndex(['a', 'b', 'c', 'd'], dtype=\"object\"\
    )\nListing 3-26\nCreating a Series of Ndarray Data with Labels\n```\n\nCreating\
    \ a series from ndarrays is valid to most Numpy functions; also, operations such\
    \ as slicing will slice the index. See Listing [3-28](#472943_1_En_3_Chapter.xhtml#PC28)\
    \ and Listing [3-29](#472943_1_En_3_Chapter.xhtml#PC29).\n\n```\nIn [11]:  print\
    \ (\"\\nSeries Sample operations\")\nprint (\"\\n Series values greater than the\
    \ mean: %.4f\" % Series1.mean())\nprint (Series1 [Series1> Series1.mean()])\n\
    print (\"\\n Series values greater than the Meadian:%.4f\" % Series1.median())\n\
    print (Series1 [Series1> Series1.median()])\nprint (\"\\nExponential value \"\
    )\nSeries1Exp = np.exp(Series1)\nprint (Series1Exp)\nSeries Sample operations\n\
    Series values greater than the mean: 0.1766\na    0.350241\nc    0.704124\nd \
    \   0.866934\ndtype: float64\nSeries values greater than the Median: 0.5272\n\
    c    0.704124\nd    0.866934\ndtype: float64\nExponential value\na    1.419409\n\
    b    0.296769\nc    2.022075\nd    2.379604\ndtype: float64\nListing 3-29\nSample\
    \ Operations in a Series\n```\n\n```\nIn [10]: print (\" \\n Series slicing \"\
    )\nprint (Series1[:3])\nprint (\"\\nIndex accessing\")\nprint (Series1[[3,1,0]])\n\
    print (\"\\nSingle index\")\nx = Series1[0]\nprint (x)\nSeries slicing\na 0.350241\n\
    b -1.214802\nc 0.704124\ndtype: float64\nIndex accessing\nd 0.866934\nb -1.214802\n\
    a 0.350241\ndtype: float64\nSingle index\n0.35024081401881596\nListing 3-28\n\
    Slicing Data from a Series\n```\n\n### Creating a Series from a Dictionary\n\n\
    You can create a series directly from a dictionary, as shown in Listing [3-30](#472943_1_En_3_Chapter.xhtml#PC30).\
    \ If you don’t explicitly pass the index, Python version +3.6 considers the series\
    \ index by the dictionary insertion order. Otherwise, the series index will be\
    \ the lexically ordered list of the dictionary keys.\n\n```\nIn [12]: dict = {'m'\
    \ : 2, 'y' : 2018, 'd' : 'Sunday'}\nprint (\"\\nSeries of non declared index\"\
    )\nSeriesDict1 = pd.Series(dict)\nprint(SeriesDict1)\nprint (\"\\nSeries of declared\
    \ index\")\nSeriesDict2 = pd.Series(dict, index=['y', 'm', 'd', 's']) print(SeriesDict2)\n\
    Series of non declared index\nd    Sunday\nm    2\ny    2018\ndtype: object\n\
    Series of declared index\ny    2018\nm    2\nd    Sunday\ns    NaN\ndtype: object\n\
    Listing 3-30\nCreating a Series from a Dictionary\n```\n\nYou can use the `get`\
    \ method to access a series values by index label, as shown in Listing [3-31](#472943_1_En_3_Chapter.xhtml#PC31).\n\
    \n```\nIn [13]: print (\"\\nUse the get and set methods to access\"\n\"a series\
    \ values by index label\\n\")\nSeriesDict2 = pd.Series(dict, index=['y', 'm',\
    \ 'd', 's']) print (SeriesDict2['y']) # Display the year SeriesDict2['y']=1999\
    \     # change the year value\nprint (SeriesDict2)           # Display all dictionary\
    \ values print (SeriesDict2.get('y')) # get specific value by its key\nUse the\
    \ get and set methods to access a series values by index label\n\ny   1999\nm\
    \   2\nd   Sunday\ns   NaN\ndtype: object\n\nListing 3-31\nAltering a Series and\
    \ Using the Get() Method\n```\n\n### Creating a Series from a Scalar Value\n\n\
    If data is a scalar value, an index must be provided. The value will be repeated\
    \ to match the length of `index`. See Listing [3-32](#472943_1_En_3_Chapter.xhtml#PC32).\n\
    \n```\nIn [14]: print (\"\\n CREATE SERIES FORM SCALAR VALUE \")\nScl = pd.Series(8.,\
    \ index=['a', 'b', 'c', 'd'])\nprint (Scl)\nCREATE SERIES FORM SCALAR VALUE\n\
    a   8.0\nb   8.0\nc   8.0\nd   8.0\ndtype: float64\nListing 3-32\nCreating a Series\
    \ Using a Scalar Value\n```"
