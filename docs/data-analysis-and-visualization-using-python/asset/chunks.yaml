    There are two types of comments in Python: single-line comments and multiline
    comments.


    The `#` symbol is used for single-line comments.


    Multiline comments can be given inside triple quotes, as shown in Listing [1-11](#472943_1_En_1_Chapter.xhtml#PC12).


