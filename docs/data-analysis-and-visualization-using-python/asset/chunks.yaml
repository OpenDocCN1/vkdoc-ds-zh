    ### Python 注释


    Python 中有两种注释：单行注释和多行注释。


    `#` 符号用于单行注释。


    多行注释可以放在三引号内，如清单 1-11 所示。


    ```

    In [18]: # Python 单行注释

    In [19]: '''''' 这是

    多行注释''''''

    清单 1-11

    Python 注释形式

    ```


    ### 格式化字符串


    Python 的特殊运算符 `%` 有助于创建格式化输出。该运算符接受两个操作数：一个格式化字符串和一个值。以下示例展示了如何以字符串格式传递一个字符串和值
    `3.14259`。需要明确的是，该值可以是单个值、值的元组或值的字典。


    ```

    In [20]: print ("pi=%s"%"3.14159")

    pi=3.14159

    ```


    ### 转换类型


    你可以使用不同的转换说明符语法来转换值，如表 1-6 所总结。


    表 1-6


    转换语法


    | 语法 | 描述 |

    | --- | --- |

    | `%c` | 转换为单个字符 |

    | `%d`, `%i` | 转换为有符号十进制整数或长整数 |

    | `%u` | 转换为无符号十进制整数 |

    | `%e`, `%E` | 转换为指数记数法的浮点数 |

    | `%f` | 转换为定点十进制记数法的浮点数 |

    | `%g` | 转换为 `%f` 和 `%e` 中较短的值 |

    | `%G` | 转换为 `%f` 和 `%E` 中较短的值 |

    | `%o` | 转换为八进制无符号整数 |

    | `%r` | 转换为使用 `repr()` 生成的字符串 |

    | `%s` | 转换为使用 `str()` 函数的字符串 |

    | `%x`, `%X` | 转换为十六进制无符号整数 |


    例如，转换说明符 `%s` 表示将值转换为字符串。因此，要在字符串输出中打印数值，你可以使用例如 `print("pi=%s" % 3.14159)`。你可以在同一个字符串中使用多个转换，例如，转换为双精度、浮点数等。


    ```

    In [1]:print("The value of %s is = %02f" % ("pi", 3.14159))

    The value of pi is = 3.141590

    ```


    你可以使用点号 (`.`) 后跟一个正整数来指定精度。在以下示例中，你可以使用不同数据类型的元组，并将输出注入到字符串消息中：


    ```

    In [21]:print ("Your name is %s, and your height is %.2f while your weight is
    %.2d" % (''Ossama'', 172.156783, 75.56647))

    Your name is Ossama, and your height is 172.16 while your weight is 75

    ```


    在前面的示例中，你可以看到 `%.2f` 被替换为值 `172.16`，小数点后保留两位小数，而 `%2d` 用于仅显示十进制值，但采用两位数字格式。


    你可以显示直接从字典中读取的值，如下所示，其中 `%(name)s` 表示将键 `Name` 的字典值作为字符串，`%(height).2f` 表示将其作为带有两位小数的浮点数，即键
    `height` 的字典值：


    ```

    In [23]:print ("Hi %(Name)s, your height is %(height).2f" %{''Name'':"Ossama",
    ''height'': 172.156783})

    Hi Ossama, your height is 172.16

    ```


    ### 替换字段 `{}`


    你可以使用替换字段 `{}` 作为名称（或索引）。如果提供了索引，它就是字段中提供的参数列表的索引。索引不必按顺序排列；它们可以是随机顺序，例如索引 0、1
    和 2，或者索引 2、1 和 0。


    ```

    In [24]:x = "price is"

    print ("{1} {0} {2}".format(x, "The", 1920.345))

    The price is 1920.345

    ```


    此外，你可以使用来自列表、字典、属性甚至单个变量的混合值。在以下示例中，你将创建一个名为 `A()` 的类，它有一个名为 `x` 的变量，赋值为 9。


    然后你从类 `A()` 创建一个名为 `w` 的实例（*对象*）。然后你打印从变量 `{0}` 索引的值，以及从值列表 `["a," "or," "is"]`
    中索引的 `{1[2]}` 值，其中 1 指的是打印索引，2 指的是给定列表中的索引（字符串索引为 0）。`{2[test]}` 指的是打印字符串中的索引
    2，并从传递的字典中通过键 `test` 读取其值。最后，`{3.x}` 指的是第三个索引，它从 `w` 获取值，`w` 是类 `A()` 的一个实例。


    ```

    In [34]:class A():x=9 w=A()

    print ("{0} {1[2]} {2[test]} {3.x}".format("This", ["a", "or", "is"], {"test":
    "another"},w))

    This is another 9

    In [34]:print ("{1[1]} {0} {1[2]} {2[test]}{3.x}".format("This", ["a", "or", "is"],
    {"test": "another"},w))

    or This is another 9

    ```


    ### 日期和时间模块


    Python 提供了一个 time 包来处理日期和时间。你可以使用内置方法检索当前日期和时间，并操作日期和时间。


    清单 1-12 中的示例导入了 time 包，并调用其 `.localtime()` 函数来检索当前日期和时间。


    ```

    In [42]:import time localtime = time.asctime(time.localtime(time.time()))

    print ("Formatted time :", localtime)

    print(time.localtime())

    print (time.time())

    Formatted time : Fri Aug 17 19:12:07 2018

    time.struct_time(tm_year=2018, tm_mon=8, tm_mday=17, tm_hour=19, tm_min=12, tm_sec=7,
    tm_wday=4, tm_yday=229, tm_isdst=0)

    1534533127.8304486

    清单 1-12

    时间方法

    ```


    ### 时间模块方法


    Python 提供了各种内置的时间函数，如表 1-7 所示，可用于与时间相关的目的。


    表 1-7


    内置时间方法


    | 方法 | 描述 |

    | --- | --- |

    | `time()` | 返回自 1970 年 1 月 1 日以来的秒数。 |

    | `asctime(time)` | 返回一个 24 字符的字符串，例如 Sat Jun 16 21:27:18 2018。 |

    | `sleep(time)` | 用于在给定的时间间隔内暂停时间。 |

    | `strptime(String,format)` | 返回一个包含九个时间属性的元组。它接收一个日期字符串和一个格式。`time.struct_time(tm_year=2018,
    tm_mon=6, tm_mday=16, tm_hour=0, tm_min=0, tm_sec=0, tm_wday=3, tm_yday=177, tm_isdst=-1)`
    |

    | `gtime()/gtime(sec)` | 返回 `struct_time`，其中包含九个时间属性。 |

    | `mktime()` | 返回自纪元以来的浮点秒数。 |

    | `strftime(format)/strftime(format,time)` | 以特定格式返回时间。如果未提供时间，则获取当前时间的秒数。 |


    ### Python 日历模块


    Python 提供了一个日历模块，如表 1-8 所示，它提供了许多用于处理日历的函数和方法。


    表 1-8


    内置日历模块函数


    | 方法 | 描述 |

    | --- | --- |

    | `prcal(year)` | 打印全年的日历。 |

    | `firstweekday()` | 返回第一个工作日。默认是 0，表示星期一。 |

    | `isleap(year)` | 返回一个布尔值，即 true 或 false。如果给定年份是闰年，则返回 true；否则返回 false。 |

    | `monthcalendar(year,month)` | 返回给定月份，每周作为一个列表。 |

    | `leapdays(year1,year2)` | 返回从 `year1` 到 `year2` 的闰日数量。 |

    | `prmonth(year,month)` | 打印给定年份的给定月份。 |


    你可以使用 Calendar 包来显示 2018 年的日历，如下所示：


    ```

    In [45]:import calendar

    calendar.prcal(2018)

    ```


