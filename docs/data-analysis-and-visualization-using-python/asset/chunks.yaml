- fmt: '### Selection Statements


    The `if` statement is used to execute a specific statement or set of statements
    when the given condition is true. There are various forms of `if` structures,
    as shown in Table [1-9](#472943_1_En_1_Chapter.xhtml#Tab9).


    **Table 1-9** `if` Statement Structure


    | Form | `if` statement | `if-else` Statement | Nested `if` Statement |

    | --- | --- | --- | --- |

    | **Structure** | `if(condition):` `statements` | `if(condition):` `statements`
    `else:` `statements` | `if (condition):` `statements` `elif (condition):` `statements`
    `else:` `statements` |


    The `if` statement is used to make decisions based on specific conditions occurring
    during the execution of the program. An action or set of actions is executed if
    the outcome is true or false otherwise. Figure [1-6](#472943_1_En_1_Chapter.xhtml#Fig6)
    shows the general form of a typical decision-making structure found in most programming
    languages including Python. Any nonzero and non-null values are considered true
    in Python, while either zero or null values are considered false.


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig6_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig6_HTML.jpg)


    **Figure 1-6** Selection statement structure


    Listing [1-13](#472943_1_En_1_Chapter.xhtml#PC21) demonstrates two examples of
    a selection statement, remember the indentation is important in the Python structure.
    The first block shows that the value of `x` is equal to 5; hence, the condition
    is testing whether `x` equals 5 or not. Therefore, the output implements the statement
    when the condition is true.


    ```

    In [13]:#Comparison operators

    x=5

    if x==5:

    print (''Equal 5'')

    elif x>5:

    print (''Greater than 5'')

    elif x<5:

    print (''Less than 5'')

    Equal 5

    In [14]:year=2000

    if year%4==0:

    print("Year(", year ,")is Leap")

    else:

    print (year , "Year is not Leap" )

    Year( 2000 )is Leap

    Listing 1-13

    The if-else Statement Structure

    ```


    Indentation determines which statement should be executed. In Listing [1-14](#472943_1_En_1_Chapter.xhtml#PC22),
    the `if` statement condition is false, and hence the outer `print` statement is
    the only executed statement.


    ```

    In [12]:#Indentation

    x=2

    if x>2:

    print ("Bigger than 2")

    print (" X Value bigger than 2")

    print ("Now we are out of if block\n")

    Now we are out of if block

    Listing 1-14

    Indentation of Execution

    ```


    The nested `if` statement is an `if` statement that is the target of another `if`
    statement. In other words, a nested `if` statement is an `if` statement inside
    another `if` statement, as shown in Listing [1-15](#472943_1_En_1_Chapter.xhtml#PC23).


    ```

    In [2]:a=10

    if a>=20:

    print ("Condition is True" )

    else:

    if a>=15:

    print ("Checking second value" )

    else:

    print ("All Conditions are false" )

    All Conditions are false

    Listing 1-15

    Nested Selection Statements

    ```


    ### Iteration Statements


    There are various iteration statement structures in Python. The `for` loop is
    one of these structures; it is used to iterate the elements of a collection in
    the order that they appear. In general, statements are executed sequentially,
    where the first statement in a function is executed first, followed by the second,
    and so on. There may be a situation when you need to execute a block of code several
    numbers of times.


    Control structures allow you to execute a statement or group of statements multiple
    times, as shown by Figure [1-7](#472943_1_En_1_Chapter.xhtml#Fig7).


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig7_HTML.jpg](images/472943_1_En_1_Chapter/472943_1_En_1_Fig7_HTML.jpg)


    **Figure 1-7** A loop statement


    Table [1-10](#472943_1_En_1_Chapter.xhtml#Tab10) demonstrates different forms
    of iteration statements. The Python programming language provides different types
    of loop statements to handle iteration requirements.


    **Table 1-10** Iteration Statement Structure


    | 1 | `for` loop Executes a sequence of statements multiple times and abbreviates
    the code that manages the loop variable. |

    | 2 | Nested loops You can use one or more loop inside any another `while`, `for`,
    or `do..while` loop. |

    | 3 | `while` loop Repeats a statement or group of statements while a given condition
    is true. It tests the condition *before* executing the loop body. |

    | 4 | `do {....} while ()` Repeats a statement or group of statements while a
    given condition is true. It tests the condition *after* executing the loop body.
    |


    Python provides various support methods for iteration statements where it allows
    you to terminate the iteration, skip a specific iteration, or pass if you do not
    want any command or code to execute. Table [1-11](#472943_1_En_1_Chapter.xhtml#Tab11)
    summarizes control statements within the iteration execution.


    **Table 1-11** Loop Control Statements


    | 1 | Break statement Terminates the loop statement and transfers execution to
    the statement immediately following the loop. |

    | 2 | Continue statement Causes the loop to skip the remainder of its body and
    immediately retests its condition prior to reiterating. |

    | 3 | Pass statement The `pass` statement is used when a statement is required
    syntactically but you do not want any command or code to execute. |


    The `range()` statement is used with `for` loop statements where you can specify
    one value. For example, if you specify 4, the loop statement starts from 1 and
    ends with 3, which is n-1. Also, you can specify the start and end values. The
    following examples demonstrate loop statements.


    Listing [1-16](#472943_1_En_1_Chapter.xhtml#PC24) displays all numerical values
    starting from 1 up to n-1, where n=4.


    ```

    In [23]:# use the range statement

    for a in range (1,4):

    print ( a )


    Listing 1-16

    for Loop Statement

    ```


    Listing [1-17](#472943_1_En_1_Chapter.xhtml#PC25) displays all numerical values
    starting from 0 up to n-1, where n=4.


    ```

    In [24]:# use the range statement

    for a in range (4):

    print ( a )


    Listing 1-17

    Using the range() Method

    ```


    Listing [1-18](#472943_1_En_1_Chapter.xhtml#PC26) displays the `while` iteration
    statement.


    ```

    In [32]:ticket=4

    while ticket>0:

    print ("Your ticket number is ", ticket)

    ticket -=1

    Your ticket number is 4

    Your ticket number is 3

    Your ticket number is 2

    Your ticket number is 1

    Listing 1-18

    while Iteration Statement

    ```


    Listing [1-19](#472943_1_En_1_Chapter.xhtml#PC27) iterates all numerical values
    in a list to find the maximum value.


    ```

    In [2]:largest = None

    print (''Before:'', largest)

    for val in [30, 45, 12, 90, 74, 15]:

    if largest is None or val>largest:

    largest = val

    print ("Loop", val, largest)

    print ("Largest", largest)

    Before: None

    Loop 30 30

    Loop 45 45

    Loop 90 90

    Largest 90

    Listing 1-19

    Using a Selection Statement Inside a Loop Statement

    ```


    In the previous examples, the first and second iterations used the `for` loop
    with a range statement. In the last example, iteration goes through a list of
    elements and stops once it reaches the last element of the iterated list.


    A `break` statement is used to jump statements and transfer the execution control.
    It breaks the current execution, and in the case of an inner loop, the inner loop
    terminates immediately. However, a `continue` statement is a jump statement that
    skips execution of current iteration. After skipping, the loop continues with
    the next iteration. The `pass` keyword is used to execute nothing. The following
    examples demonstrate how and when to employ each statement.'
