    \nData Visualization\n\n@July 2018\n```\n\n***Answer:***\n\n```\nfrom bs4 import\
    \ BeautifulSoup\nsoup = BeautifulSoup(htmldata, 'html.parser')\nprint(soup.prettify())\n\
    print(soup.get_text())\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figav_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figav_HTML.jpg)\
    \ ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figaw_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figaw_HTML.jpg)\n\
    \n# 6. Data Exploring and Analysis\n\nNowadays, massive data is collected daily\
    \ and distributed over various channels. This requires efficient and flexible\
    \ data analysis tools. Python's open source Pandas library fills that gap and\
    \ deals with three different data structures: series, data frames, and panels.\
    \ A *series* is a one-dimensional data structure such as a dictionary, array,\
    \ list, tuple, and so on. A *data frame* is a two-dimensional data structure with\
    \ heterogeneous data types, i.e., tabular data. A *panel* refers to a three-dimensional\
    \ data structure such as a three-dimensional array. It should be clear that the\
    \ higher-dimensional data structure is a container of its lower-dimensional data\
    \ structure. In other words, a panel is a container of a data frame, and a data\
    \ frame is a container of a series.\n\n## Series Data Structures\n\nAs mentioned\
    \ earlier, a series is a sequence of one-dimensional data such as a dictionary,\
    \ list, array, tuple, and so on.\n\n### Creating a Series\n\nPandas provides a\
    \ `Series()` method that is used to create a series structure. A series structure\
    \ of size `n` should have an index of length `n`. By default Pandas creates indices\
    \ starting at 0 and ending with `n`-1. A Pandas series can be created using the\
    \ constructor `pandas.Series(data, index, dtype, copy)` where `data` could be\
    \ an array, constant, list, etc. The series `index` should be unique and hashable\
    \ with length `n`, while `dtype` is a data type that could be explicitly declared\
    \ or inferred from the received data. Listing [6-1](#472943_1_En_6_Chapter.xhtml#PC1)\
    \ creates a series with a default index and with a set index.\n\n```\nIn [5]:\
    \ import pandas as pd\nimport numpy as np\ndata = np.array(['O','S','S','A'])\n\
    S1 = pd.Series(data) # without adding index\nS2 = pd.Series(data,index=[100,101,102,103])\
    \ # with adding index print (S1) print (\"\\n\") print (S2)\n0    O\n1    S\n\
    2    S\n3    A\ndtype: object\n100  O\n101  S\n102  S\n103  A\ndtype: object\n\
    In [40]:import pandas as pd\nimport numpy as np\nmy_series2 = np.random.randn(5,\
    \ 10)\nprint (\"\\nmy_series2\\n\", my_series2)\nListing 6-1\nCreating a Series\n\
    ```\n\nThis is the output of creating a series of random values of 5 rows and\
    \ 10 columns.\n\n![../images/472943_1_En_6_Chapter/472943_1_En_6_Figa_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figa_HTML.jpg)\n\
    \nAs mentioned earlier, you can create a series from a dictionary; Listing [6-2](#472943_1_En_6_Chapter.xhtml#PC2)\
    \ demonstrates how to create an index for a data series.\n\n```\nIn [6]: import\
    \ pandas as pd\nimport numpy as np\ndata = {'X' : 0., 'Y' : 1., 'Z' : 2.}\nSERIES1\
    \ = pd.Series(data)\nprint (SERIES1)\nX 0.0\nY 1.0\nZ 2.0\ndtype: float64\nIn\
    \ [7]: import pandas as pd\nimport numpy as np\ndata = {'X' : 0., 'Y' : 1., 'Z'\
    \ : 2.}\nSERIES1 = pd.Series(data,index=['Y','Z','W','X'])\nprint (SERIES1)\n\
    Y 1.0\nZ 2.0\nW NaN\nX 0.0\ndtype: float64\nListing 6-2\nCreating an Indexed Series\n\
    ```\n\nIf you can create series data from a scalar value as shown in Listing [6-3](#472943_1_En_6_Chapter.xhtml#PC3),\
    \ then an index is mandatory, and the scalar value will be repeated to match the\
    \ length of the given index.\n\n```\nIn [9]: # Use sclara to create a series\n\
    import pandas as pd\nimport numpy as np\nSeries1 = pd.Series(7, index=[0, 1, 2,\
    \ 3, 4])\nprint (Series1)\n0    7\n1    7\n2    7\n3    7\n4    7\ndtype: int64\n\
    Listing 6-3\nCreating a Series Using a Scalar\n```"
