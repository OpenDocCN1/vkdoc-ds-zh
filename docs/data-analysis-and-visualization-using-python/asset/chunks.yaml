    ### Operations on a Series


    Numerous operations can be implemented on series data. You can check whether an
    index value is available in a series or not. Also, you can check all series elements
    against a specific condition, such as if the series value is less than 8 or not.
    In addition, you can perform math operations on series data directly or via a
    defined function, as shown in Listing [6-8](#472943_1_En_6_Chapter.xhtml#PC8).


    ```

    In [23]: ''F'' in my_series_11

    Out[23]: True

    In [27]: temp = my_series_11 < 8

    temp

    Out[27]: A    True

    B    True

    C    True

    D    False

    E    False

    F    False

    dtype: bool

    In [35]: len(my_series_11)

    Out[35]: 6

    In [28]: temp = my_series_11[my_series_11 < 8 ] * 2

    temp

    Out[28]: A    10

    B    12

    C    14

    dtype: int64

    Listing 6-8

    Operations on Series

    ```


    Define a function to add two series and call the function, like this:


    ```

    In [37]: def AddSeries(x,y):

    for i in range (len(x)):

    print (x[i] + y[i])

    In [39]: print ("Add two series\n")

    AddSeries (my_series_11, my_series1)

    Add two series


    ```


