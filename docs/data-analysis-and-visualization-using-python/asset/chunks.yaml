    ```


    ### Reading and Writing to Files


    The `file.write()` method is used to write to a file as shown in below figure,
    and the `file.read()` method is used to read data from an opened file. A file
    can be opened for writing (`W`), reading (`r`), or both (`r+`), as shown in Listing
    4-4.


    ```

    In [39]:Filehndl = open("Egypt.txt", "w+")

    Filehndl.write( "Python Processing Files\nMay 2018!!\n")

    # Close opend file

