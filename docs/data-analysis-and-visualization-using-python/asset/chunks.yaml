    1-5 所示。


    ```

    In [8]:sms1 = ''Hellow World''

    sms2 = "Hellow World"

    sms3 = """ Hellow World"""

    sms4 = """ Hellow

    World"""

    print (sms1)

    print (sms2)

    print (sms3)

    print (sms4)

    Hellow World

    Hellow World

    Hellow World

    Hellow

    World

    代码清单 1-5

    Python 中的引号

    ```


    # 单行多条语句


    Python 允许使用 `\n` 将一行拆分为多行。此外，如果语句都不启动新的代码块，则分号（`;`）允许在单行上放置多条语句，如代码清单 1-6 所示。


    ```

    In [9]: TV=15; name="Nour"; print (name); print ("Welcome to\nDubai Festival 2018")

    Nour

    Welcome to

    Dubai Festival 2018

    代码清单 1-6

    分号和换行符的使用

    ```


    # 从用户读取数据


    代码清单 1-7 中的代码段提示用户输入姓名和年龄，将年龄转换为整数，然后显示数据。


    ```

    In [10]:name = input("Enter your name ")

    age = int (input("Enter your age "))

    print ("\nName =", name); print ("\nAge =", age)

    Enter your name Nour

    Enter your age 12

    Name = Nour

    Age = 12

    代码清单 1-7

    从用户读取数据

    ```


    ## 声明变量并赋值


    在 Python 中，没有限制必须显式声明变量。一旦你给变量赋值，Python 就会根据所赋的值来认定该变量。如果赋的值是字符串，则该变量被视为字符串。如果赋的值是实数，则
    Python 会将该变量视为双精度浮点型变量。因此，Python 并不限制你在应用程序中使用变量之前必须先声明它们。它允许你在需要的时候创建变量。


    Python 有五种标准数据类型，用于定义可对它们执行的操作以及每种数据类型的存储方法。


    *   数字（Number）

    *   字符串（String）

    *   列表（List）

    *   元组（Tuple）

    *   字典（Dictionary）


    等号（`=`）运算符用于给变量赋值，如代码清单 1-8 所示。


    ```

    In [11]: age = 11

    name ="Nour"

    tall=100.50

    In [12]: print (age)

    print (name)

    print (tall)


    Nour

    100.5

    代码清单 1-8

    赋值运算符

    ```


    ### 多重赋值


    Python 允许你在一条语句中给多个变量赋值，这也称为*多重赋值*。你可以给多个变量赋同一个值，也可以给多个变量赋多个不同的值，如代码清单 1-9 所示。


    ```

    In [13]:age= mark = code =25

    print (age)

    print (mark)

