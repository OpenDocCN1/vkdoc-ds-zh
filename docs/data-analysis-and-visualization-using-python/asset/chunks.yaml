  trans: "\n### Azure Notebooks\n\nAzure Machine Learning 工作台通过与 Jupyter Notebook\
    \ 的集成，支持交互式数据科学实验。\n\nAzure Notebooks 可在 [`https://notebooks.azure.com/`](https://notebooks.azure.com/)\
    \ 免费获取。注册并登录 Azure Notebooks 后，您将看到如下所示的菜单：\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figa_HTML.jpg](img/472943_1_En_1_Figa_HTML.jpg)\n\
    \n创建账户后，您可以为任何想要启动的 Python 项目创建一个库。您创建的所有库都可以通过点击“库”链接来显示和访问。\n\n让我们创建一个新的 Python\
    \ 脚本。\n\n1.  创建一个库。\n\n    点击“新建库”，输入库的详细信息，然后点击“创建”，如下图所示：\n\n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Figb_HTML.jpg](img/472943_1_En_1_Figb_HTML.jpg)\n\
    \n    新库创建完成，如图 1-3 所示。\n\n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Figc_HTML.jpg](img/472943_1_En_1_Figc_HTML.jpg)\n\
    \n2.  创建一个项目文件夹容器。\n\n    组织 Python 库脚本非常重要。您可以通过从功能区选择“+新建”来创建文件夹和子文件夹；然后对于项目类型，选择“文件夹”，如图\
    \ 1-3 所示。\n\n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig3_HTML.jpg](img/472943_1_En_1_Fig3_HTML.jpg)\n\
    \n    图 1-3\n\n    在 Azure 项目中创建文件夹\n\n3.  创建一个 Python 项目。\n\n    进入创建的文件夹，并创建一个新的\
    \ Python 项目。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figd_HTML.jpg](img/472943_1_En_1_Figd_HTML.jpg)\n\
    \n您的项目应该如下所示：\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fige_HTML.jpg](img/472943_1_En_1_Fige_HTML.jpg)\n\
    \n1.  编写并运行一个 Python 脚本。\n\n    通过点击打开已创建的 Hello World 脚本，并开始编写您的 Python 代码，如图\
    \ 1-4 所示。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig4_HTML.jpg](img/472943_1_En_1_Fig4_HTML.jpg)\n\
    \n图 1-4\n\nAzure 上的一个 Python 脚本文件\n\n在图 1-4 中，所有绿色图标显示了可应用于正在运行的文件的选项。例如，您可以点击\
    \ + 为脚本文件添加新行。此外，您还可以保存、剪切以及上下移动行。要执行任何代码段，请按 `Ctrl+Enter`，或点击功能区上的“运行”。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figf_HTML.jpg](img/472943_1_En_1_Figf_HTML.jpg)\n\
    \n### 离线与桌面 Python 编辑器\n\n有许多离线的 Python IDE，例如 Spyder、通过 Eclipse 使用的 PyDev、NetBeans、Eric、PyCharm、Wing、Komodo、用于\
    \ Visual Studio 的 Python 工具等等。\n\n以下步骤演示了如何设置和使用 Spyder。您可以下载 Anaconda Navigator，然后运行\
    \ Spyder 软件，如图 1-5 所示。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig5_HTML.jpg](img/472943_1_En_1_Fig5_HTML.jpg)\n\
    \n图 1-5\n\nPython Spyder IDE\n\n在左侧，您可以编写 Python 脚本，在右侧，您可以在控制台中看到已执行的脚本。\n\n\
    ## Python 编程基础\n\n本节介绍 Python 编程的基础知识。\n\n### 基本语法\n\nPython *标识符* 是用于标识所创建脚本中的变量、函数、类、模块或其他对象的名称。标识符以字母\
    \ *A* 到 *Z* 或 *a* 到 *z* 或下划线（`_`）开头，后跟零个或多个字母、下划线和数字（0 到 9）。\n\nPython 不允许在标识符中使用特殊字符，例如\
    \ `@`、`$` 和 `%`。Python 是一种区分大小写的编程语言。因此，`Manpower` 和 `manpower` 在 Python 中是两个不同的标识符。\n\
    \n以下是命名 Python 标识符的规则：\n\n*   类名以大写字母开头。所有其他标识符以小写字母开头。\n\n*   以单个前导下划线开头的标识符表示该标识符是私有的。\n\
    \n*   以两个前导下划线开头的标识符表示一个强私有的标识符。\n\n*   如果标识符也以两个尾随下划线结尾，则该标识符是语言定义的特殊名称。\n\n\
    `help?` 方法可用于从 Python 用户手册获取支持，如代码清单 1-1 所示。\n\n```\nIn [3]:      help?\nSignature:\
    \   help(*args, **kwds)\nType:        _Helper\nString form: Type help() for interactive\
    \ help, or help(object) for help about object.\nNamespace:   Python builtin\n\
    File:        ~/anaconda3_501/lib/python3.6/_sitebuiltins.py\nDocstring:\nDefine\
    \ the builtin 'help'.\nThis is a wrapper around pydoc.help that provides a helpful\
    \ message\nwhen 'help' is typed at the Python interactive prompt .\nCalling help()\
    \ at the Python prompt starts an interactive help session.\nCalling help(thing)\
    \ prints help for the python object 'thing'.\n代码清单 1-1\n从 Python 获取帮助\n```\n\n\
    给定 Python 脚本中的最小单元称为 *标记*，它代表标点符号、保留字以及语句中的每个单独单词，这些单词可以是关键字、标识符、字面量和运算符。\n\n\
    表 1-1 列出了 Python 中的保留字。保留字是 Python 语言已经保留的单词，用户不能重新定义或声明。\n\n表 1-1\n\nPython 保留关键字\n\
    \n| `and` | `exec` | `not` | `continue` | `global` | `with` | `yield` | `in` |\n\
    | --- | --- | --- | --- | --- | --- | --- | --- |\n| `assert` | `finally` | `or`\
    \ | `def` | `if` | `return` | `else` | `is` |\n| `break` | `for` | `pass` | `except`\
    \ | `lambda` | `while` | `try` |   |\n| `class` | `from` | `print` | `del` | `import`\
    \ | `raise` | `elif` |   |\n\n#### 行与缩进\n\n行缩进在 Python 中很重要，因为 Python 不依赖花括号来表示类、函数定义或流程控制的代码块。因此，代码段块由行缩进表示，并且被严格执行，如代码清单\
    \ 1-2 所示。\n\n```\nIn [4]:age, mark, code=10,75,\"CIS2403\"\nprint (age)\nprint\
    \ (mark)\nprint (code)\nFile \"\", line 4\nprint (code)\nIndentationError: unexpected\
    \ indent\n代码清单 1-2\n行缩进语法错误\n```\n\n#### 多行语句\n\nPython 中的语句通常以换行符结束。但程序员可以使用行继续符（`\\\
    `）来表示该行应该继续，如代码清单 1-3 所示。否则，将发生语法错误。\n\n```\nIn [5]:TV=15\nMobile=20 Tablet =\
    \ 30\ntotal = TV +\nMobile +\nTablet\nprint (total)\nFile \"\", line 5\ntotal\
    \ = TV +\nSyntaxError: invalid syntax\n代码清单 1-3\n多行语句\n```\n\n以下是正确的语法：\n\n```\n\
    In [6]: TV=15\nMobile=20\nTablet = 30\ntotal = TV + \\\nMobile + \\\nTablet\n\
    print (total)\n\n```\n\n包含在 `[]`、`{}` 或 `()` 括号内的语句代码段不需要使用行继续符，如代码清单 1-4 所示。\n\
    \n```\nIn [7]: days = ['Monday', 'Tuesday', 'Wednesday',\n'Thursday', 'Friday']\n\
    print (days)\n['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday']\n代码清单 1-4\n\
    带引号的语句\n```\n"
- fmt: '# Quotation Marks in Python


    Python accepts single (`''`), double (`"`), and triple (`''''''` or `"""`) quotes
    to denote string literals, as long as the same type of quote starts and ends the
    string. However, triple quotes are used to span the string across multiple lines,
    as shown in Listing [1-5](#472943_1_En_1_Chapter.xhtml#PC6).


    ```

    In [8]:sms1 = ''Hellow World''

    sms2 = "Hellow World"

    sms3 = """ Hellow World"""

    sms4 = """ Hellow

    World"""

    print (sms1)

    print (sms2)

    print (sms3)

    print (sms4)

    Hellow World

    Hellow World

    Hellow World

    Hellow

    World

    Listing 1-5

    Quotation Marks in Python

    ```


    # Multiple Statements on a Single Line


    Python allows the use of `\n` to split line into multiple lines. In addition,
    the semicolon (`;`) allows multiple statements on a single line if neither statement
    starts a new code block, as shown in Listing [1-6](#472943_1_En_1_Chapter.xhtml#PC7).


    ```

    In [9]: TV=15; name="Nour"; print (name); print ("Welcome to\nDubai Festival 2018")

    Nour

    Welcome to

    Dubai Festival 2018

    Listing 1-6

    The Use of the Semicolon and New Line Delimiter

    ```


    # Read Data from Users


    The line code segment in Listing [1-7](#472943_1_En_1_Chapter.xhtml#PC8) prompts
    the user to enter a name and age, converts the age into an integer, and then displays
    the data.


    ```

    In [10]:name = input("Enter your name ")

    age = int (input("Enter your age "))

    print ("\nName =", name); print ("\nAge =", age)

    Enter your name Nour

    Enter your age 12

    Name = Nour

    Age = 12

    Listing 1-7

    Reading Data from the User

    ```


    ## Declaring Variables and Assigning Values


    There is no restriction to declaring explicit variables in Python. Once you assign
    a value to a variable, Python considers the variable according to the assigned
    value. If the assigned value is a string, then the variable is considered a string.
    If the assigned value is a real, then Python considers the variable as a double
    variable. Therefore, Python does not restrict you to declaring variables before
    using them in the application. It allows you to create variables at the required
    time.


    Python has five standard data types that are used to define the operations possible
    on them and the storage method for each of them.


    *   Number

    *   String

    *   List

    *   Tuple

    *   Dictionary


    The equal (`=`) operator is used to assign a value to a variable, as shown in
    Listing [1-8](#472943_1_En_1_Chapter.xhtml#PC9).


    ```

    In [11]: age = 11

    name ="Nour"

    tall=100.50

    In [12]: print (age)

    print (name)

    print (tall)


    Nour

    100.5

    Listing 1-8

    Assign Operator

    ```


    ### Multiple Assigns


    Python allows you to assign a value to multiple variables in a single statement,
    which is also known as *multiple assigns*. You can assign a single value to multiple
    variables or assign multiple values to multiple variables, as shown in Listing
    [1-9](#472943_1_En_1_Chapter.xhtml#PC10).


    ```

    In [13]:age= mark = code =25

    print (age)

    print (mark)

    print (code)


    In [14]:age, mark, code=10,75,"CIS2403"

    print (age)

    print (mark)

    print (code)


    CIS2403

    Listing 1-9

    Multiple Assigns

    ```


    ### Variable Names and Keywords


    A *variable* is an identifier that allocates specific memory space and assigns
    a value that could change during the program runtime. Variable names should refer
    to the usage of the variable, so if you want to create a variable for student
    age, then you can name it as `age` or `student_age`. There are many rules and
    restrictions for variable names. It’s not allowed to use special characters or
    white spaces in variable naming. For instance, variable names shouldn’t start
    with any special character and shouldn’t be any of the Python reserved keywords.
    The following example shows incorrect naming: `{?age, 1age, age student, and,
    if, 1_age, etc}`. The following shows correct naming for a variable: `{age, age1,
    age_1, if_age, etc}`.


    ### Statements and Expressions


    A *statement* is any unit of code that can be executed by a Python interpreter
    to get a specific result or perform a specific task. A program contains a sequence
    of statements, each of which has a specific purpose during program execution.
    The expression is a combination of values, variables, and operators that are evaluated
    by the interpreter to do a specific task, as shown in Listing [1-10](#472943_1_En_1_Chapter.xhtml#PC11).


    ```

    In [16]:# Expressions

    x=0.6              # Statement

    x=3.9 * x * (1-x)  # Expressions

    print (round(x, 2))

    0.94

    Listing 1-10

    Expression and Statement Forms

    ```


    ## Basic Operators in Python


    Operators are the constructs that can manipulate the value of operands. Like different
    programming languages, Python supports the following operators:


    *   Arithmetic operators

    *   Relational operators

    *   Assign operators

    *   Logical operators

    *   Membership operators

    *   Identity operators

    *   Bitwise operators


    ### Arithmetic Operators


    Table [1-2](#472943_1_En_1_Chapter.xhtml#Tab2) shows examples of arithmetic operators
    in Python.


    **Table 1-2** Python Arithmetic Operators


    | Operators | Description | Example | Output |

    | --- | --- | --- | --- |

    | `//` | Performs floor division (gives the integer value after division) | `print
    (13//5)` | 2 |

    | `+` | Performs addition | `print (13+5)` | 18 |

    | `-` | Performs subtraction | `print (13-5)` | 8 |

    | `*` | Performs multiplication | `print (2*5)` | 10 |

    | `/` | Performs division | `print (13/5)` | 2.6 |

    | `%` | Returns the remainder after division (modulus) | `print (13%5)` | 3 |

    | `**` | Returns an exponent (raises to a power) | `print (2**3)` | 8 |


    ### Relational Operators


    Table [1-3](#472943_1_En_1_Chapter.xhtml#Tab3) shows examples of relational operators
    in Python.


    **Table 1-3** Python Relational Operators


    | Operators | Description | Example | Output |

    | --- | --- | --- | --- |

    | `<` | Less than | `print (13<5)` | False |

    | `>` | Greater than | `print (13>5)` | True |

    | `<=` | Less than or equal to | `print (13<=5)` | False |

    | `>=` | Greater than or equal to | `print (2>=5)` | False |

    | `==` | Equal to | `print (13==5)` | False |

    | `!=` | Not equal to | `print (13! =5)` | True |


    ### Assign Operators


    Table [1-4](#472943_1_En_1_Chapter.xhtml#Tab4) shows examples of assign operators
    in Python.


    **Table 1-4** Python Assign Operators


    | Operators | Description | Example | Output |

    | --- | --- | --- | --- |

    | `=` | Assigns | `x=10` `print (x)` | 10 |

    | `/=` | Divides and assigns | `x=10; x/=2` `print (x)` | 5.0 |

    | `+=` | Adds and assigns | `x=10; x+=7` `print (x)` | 17 |

    | `-=` | Subtracts and assigns | `x=10; x-=6` `print (x)` | 4 |

    | `*=` | Multiplies and assigns | `x=10; x*=5` `print (x)` | 50 |

    | `%=` | Modulus and assigns | `x=13; x%=5` `print (x)` | 3 |

    | `**=` | Exponent and assigns | `x=10; x**=3` `print(x)` | 1000 |

    | `//=` | Floor division and assigns | `x=10; x//=2` `print(x)` | 5 |


    ### Logical Operators


    Table [1-5](#472943_1_En_1_Chapter.xhtml#Tab5) shows examples of logical operators
    in Python.


    **Table 1-5** Python Logical Operators


    | Operators | Description | Example | Output |

    | --- | --- | --- | --- |

    | `and` | Logical AND (when both conditions are true, the output will be true)
    | `x=10>5 and 4>20` `print (x)` | False |

    | `or` | Logical OR (if any one condition is true, the output will be true) |
    `x=10>5 or 4>20` `print (x)` | True |

    | `not` | Logical NOT (complements the condition; i.e., reverses it) | `x=not
    (10<4)` `print (x)` | True |


    A Python *program* is a sequence of Python statements that have been crafted to
    do something. It can be one line of code or thousands of code segments written
    to perform a specific task by a computer. Python statements are executed immediately
    and do not wait for the entire program to be executed. Therefore, Python is an
    interpreted language that executes line per line. This differs from other languages
    such as C#, which is a compiled language that needs to handle the entire program.'
