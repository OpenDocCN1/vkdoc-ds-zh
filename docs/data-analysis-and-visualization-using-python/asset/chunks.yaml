- fmt: '# Merging and Integrating Data


    Python provides the `merge()` method to merge different data sets together using
    a specific common pattern. Listing [5-14](#472943_1_En_5_Chapter.xhtml#PC19) reads
    two different data sets about export values in a different range of years but
    for the same countries.


    ```

    In [35]: import pandas as pd

    a = pd.read_csv("1\. Export1_Columns.csv")

    b = pd.read_csv("1\. Export2_Columns.csv")

    Listing 5-14

    Two Files of Export Sales

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figp_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figp_HTML.jpg)


    Suppose that you want to drop specific years from this study such as 2009, 2012,
    2013, and 2014. Listing [5-15](#472943_1_En_5_Chapter.xhtml#PC20) and Listing
    [5-16](#472943_1_En_5_Chapter.xhtml#PC22) demonstrate different methods that are
    used to drop these columns.


    ```

    In [35]: import pandas as pd

    a = pd.read_csv("1\. Export1_Columns.csv")

    b = pd.read_csv("1\. Export2_Columns.csv")

    In [31]: a.head()

    Listing 5-15

    Loading Two Different Data Sets with One Common Attribute

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figq_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figq_HTML.jpg)


    ```

    In [30]: b.head()

    ```


    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figr_HTML.jpg](images/472943_1_En_5_Chapter/472943_1_En_5_Figr_HTML.jpg)


    ```

    In [32]: b.drop(''2014'', axis=1, inplace=True)

