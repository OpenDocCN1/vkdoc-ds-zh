    while count < nterms:

    nth = n1 + n2

    print(nth,end='' , '')

    # 更新值

    n1 = n2

    n2 = nth

    count += 1

    您想要多少项？8

    斐波那契数列：

    0 , 1, 1 , 2 , 3 , 5 , 8 , 13 ,

    ```

