- fmt: '### About the Author and About the Technical Reviewers


    ### About the Author


    ### About the Technical Reviewers


    # 1. Introduction to Data Science with Python


    The amount of digital data that exists is growing at a rapid rate, doubling every
    two years, and changing the way we live. It is estimated that by 2020, about 1.7MB
    of new data will be created every second for every human being on the planet.
    This means we need to have the technical tools, algorithms, and models to clean,
    process, and understand the available data in its different forms for decision-making
    purposes. *Data science* is the field that comprises everything related to cleaning,
    preparing, and analyzing unstructured, semistructured, and structured data. This
    field of science uses a combination of statistics, mathematics, programming, problem-solving,
    and data capture to extract insights and information from data.


    ## The Stages of Data Science


    Figure [1-1](#472943_1_En_1_Chapter.xhtml#Fig1) shows different stages in the
    field of data science. Data scientists use programming tools such as `Python`,
    `R`, `SAS`, `Java`, `Perl`, and `C/C++` to extract knowledge from prepared data.
    To extract this information, they employ various fit-to-purpose models based on
    machine leaning algorithms, statistics, and mathematical methods.


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig1_HTML.png](images/472943_1_En_1_Chapter/472943_1_En_1_Fig1_HTML.png)


    Figure 1-1


    Data science project stages


    Data science algorithms are used in products such as internet search engines to
    deliver the best results for search queries in less time, in recommendation systems
    that use a user’s experience to generate recommendations, in digital advertisements,
    in education systems, in healthcare systems, and so on. Data scientists should
    have in-depth knowledge of programming tools such as `Python`, `R`, `SAS`, `Hadoop`
    platforms, and `SQL` databases; good knowledge of semistructured formats such
    as `JSON`, `XML`, `HTML`. In addition to the knowledge of how to work with unstructured
    data.


    ## Why Python?


    `Python` is a dynamic and general-purpose programming language that is used in
    various fields. `Python` is used for everything from throwaway scripts to large,
    scalable web servers that provide uninterrupted service 24/7. It is used for GUI
    and database programming, client- and server-side web programming, and application
    testing. It is used by scientists writing applications for the world’s fastest
    supercomputers and by children first learning to program. It was initially developed
    in the early 1990s by Guido van Rossum and is now controlled by the not-for-profit
    Python Software Foundation, sponsored by Microsoft, Google, and others.


    The first-ever version of `Python` was introduced in 1991. `Python` is now at
    version `3.x`, which was released in February 2011 after a long period of testing.
    Many of its major features have also been backported to the backward-compatible
    `Python 2.6`, `2.7`, and `3.6`.


    ### Basic Features of Python


    `Python` provides numerous features; the following are some of these important
    features:


    *   *Easy to learn and use*: `Python` uses an elegant syntax, making the programs
    easy to read. It is developer-friendly and is a high-level programming language.


    *   *Expressive*: The `Python` language is expressive, which means it is more
    understandable and readable than other languages.


    *   *Interpreted*: `Python` is an interpreted language. In other words, the interpreter
    executes the code line by line. This makes debugging easy and thus suitable for
    beginners.


    *   *Cross-platform*: `Python` can run equally well on different platforms such
    as Windows, Linux, Unix, Macintosh, and so on. So, `Python` is a portable language.


    *   *Free and open source*: The `Python` language is freely available at [`www.python.org`](http://www.python.org).
    The source code is also available.


    *   *Object-oriented*: `Python` is an object-oriented language with concepts of
    classes and objects.


    *   *Extensible*: It is easily extended by adding new modules implemented in a
    compiled language such as `C` or `C++`, which can be used to compile the code.


    *   *Large standard library*: It comes with a large standard library that supports
    many common programming tasks such as connecting to web servers, searching text
    with regular expressions, and reading and modifying files.


    *   *GUI programming support*: Graphical user interfaces can be developed using
    `Python`.


    *   *Integrated*: It can be easily integrated with languages such as `C`, `C++`,
    `Java`, and more.'
  raw: '### About the Author and About the Technical Reviewers


    ### About the Author


    ### About the Technical Reviewers


    # 1. Introduction to Data Science with Python


    The amount of digital data that exists is growing at a rapid rate, doubling every
    two years, and changing the way we live. It is estimated that by 2020, about 1.7MB
    of new data will be created every second for every human being on the planet.
    This means we need to have the technical tools, algorithms, and models to clean,
    process, and understand the available data in its different forms for decision-making
    purposes. *Data science* is the field that comprises everything related to cleaning,
    preparing, and analyzing unstructured, semistructured, and structured data. This
    field of science uses a combination of statistics, mathematics, programming, problem-solving,
    and data capture to extract insights and information from data.


    ## The Stages of Data Science


    Figure [1-1](#472943_1_En_1_Chapter.xhtml#Fig1) shows different stages in the
    field of data science. Data scientists use programming tools such as Python, R,
    SAS, Java, Perl, and C/C++ to extract knowledge from prepared data. To extract
    this information, they employ various fit-to-purpose models based on machine leaning
    algorithms, statistics, and mathematical methods.


    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig1_HTML.png](images/472943_1_En_1_Chapter/472943_1_En_1_Fig1_HTML.png)


    Figure 1-1


    Data science project stages


    Data science algorithms are used in products such as internet search engines to
    deliver the best results for search queries in less time, in recommendation systems
    that use a user’s experience to generate recommendations, in digital advertisements,
    in education systems, in healthcare systems, and so on. Data scientists should
    have in-depth knowledge of programming tools such as Python, R, SAS, Hadoop platforms,
    and SQL databases; good knowledge of semistructured formats such as JSON, XML,
    HTML. In addition to the knowledge of how to work with unstructured data.


    ## Why Python?


    Python is a dynamic and general-purpose programming language that is used in various
    fields. Python is used for everything from throwaway scripts to large, scalable
    web servers that provide uninterrupted service 24/7\. It is used for GUI and database
    programming, client- and server-side web programming, and application testing.
    It is used by scientists writing applications for the world’s fastest supercomputers
    and by children first learning to program. It was initially developed in the early
    1990s by Guido van Rossum and is now controlled by the not-for-profit Python Software
    Foundation, sponsored by Microsoft, Google, and others.


    The first-ever version of Python was introduced in 1991\. Python is now at version
    3.*x*, which was released in February 2011 after a long period of testing. Many
    of its major features have also been backported to the backward-compatible Python
    2.6, 2.7, and 3.6.


    ### Basic Features of Python


    Python provides numerous features; the following are some of these important features:


    *   *Easy to learn and use*: Python uses an elegant syntax, making the programs
    easy to read. It is developer-friendly and is a high-level programming language.


    *   *Expressive*: The Python language is expressive, which means it is more understandable
    and readable than other languages.


    *   *Interpreted*: Python is an interpreted language. In other words, the interpreter
    executes the code line by line. This makes debugging easy and thus suitable for
    beginners.


    *   *Cross-platform*: Python can run equally well on different platforms such
    as Windows, Linux, Unix, Macintosh, and so on. So, Python is a portable language.


    *   *Free and open source*: The Python language is freely available at [`www.python.org`](http://www.python.org)
    . The source code is also available.


    *   *Object-oriented*: Python is an object-oriented language with concepts of
    classes and objects.


    *   *Extensible*: It is easily extended by adding new modules implemented in a
    compiled language such as C or C++, which can be used to compile the code.


    *   *Large standard library*: It comes with a large standard library that supports
    many common programming tasks such as connecting to web servers, searching text
    with regular expressions, and reading and modifying files.


    *   *GUI programming support*: Graphical user interfaces can be developed using
    Python.


    *   *Integrated*: It can be easily integrated with languages such as C, C++, Java,
    and more.'
