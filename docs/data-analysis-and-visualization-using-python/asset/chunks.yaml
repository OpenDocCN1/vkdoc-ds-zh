- fmt: '### Data Grouping


    You can split data into groups to perform more specific analysis over the data
    set. Once you perform data grouping, you can compute summary statistics (aggregation),
    perform specific group operations (transformation), and discard data with some
    conditions (filtration). In Listing [6-33](#472943_1_En_6_Chapter.xhtml#PC51),
    you group data using `City` and find the count of genders per city. In addition,
    you group the data set by city and display the results, where for example rows
    1 and 5 are people from Dubai. You can use multiple grouping attributes. You can
    group the data set using `City` and `Gender`. The retrieved data shows that, for
    instance, Fujairah has females (row 4) and males (rows 0 and 9).


    ```

    In [3]: dataset.groupby(''City'')[''Gender''].count()

    Listing 6-33

    Data Grouping

    ```


    The following output shows that we have 2 students from Abu dhabi, 2 from Dubai,
    3 from Fujairah and 3 from Sharjah groupped by gender.


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figaf_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figaf_HTML.jpg)


    ```

    In [4]: print (dataset.groupby(''City'').groups)

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figag_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figag_HTML.jpg)


    ```

    In [5]: print (dataset.groupby([''City'',''Gender'']).groups)

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figah_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figah_HTML.jpg)


    ### Iterating Through Groups


    You can iterate through a specific group, as shown in Listing [6-34](#472943_1_En_6_Chapter.xhtml#PC54).
    When you iterate through the gender, it should be clear that by default the `groupby`
    object has the same name as the group name.


    ```

    In [7]: grouped = dataset.groupby(''Gender'')

    for name,group in grouped:

    print (name)

    print (group)

    print ("\n")

    Listing 6-34

    Iterating Through Grouped Data

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figai_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figai_HTML.jpg)


    You can also select a specific group using the `get_group()` method, as shown
    in Listing [6-35](#472943_1_En_6_Chapter.xhtml#PC55) where you group data by gender
    and then select only females.


    ```

    In [9]: grouped = dataset.groupby(''Gender'')

    print (grouped.get_group(''Female''))

    Listing 6-35

    Selecting a Single Group

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figaj_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figaj_HTML.jpg)


    ### Aggregations


    Aggregation functions return a single aggregated value for each group. Once the
    `groupby` object is created, you can implement various functions on the grouped
    data. In Listing [6-36](#472943_1_En_6_Chapter.xhtml#PC56), you calculate the
    mean and size of height and weight for both males and females. In addition, you
    calculate the summation and standard deviations for both patterns of males and
    females.


    ```

    In [18]: # Aggregation

    grouped = dataset.groupby(''Gender'')

    print (grouped[''Height''].agg(np.mean))

    print ("\n")

    print (grouped[''Weight''].agg(np.mean))

    print ("\n")

    print (grouped.agg(np.size))

    print ("\n")

    print (grouped[''Height''].agg([np.sum, np.mean, np.std]))

    Listing 6-36

    Data Aggregation

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figak_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figak_HTML.jpg)


    ### Transformations


    Transformation on a group or a column returns an object that is indexed the same
    size as the one being grouped. Thus, the transform should return a result that
    is the same size as that of a group chunk. See Listing [6-37](#472943_1_En_6_Chapter.xhtml#PC57).


    ```

    In [26]: dataset = dataset.set_index([''Number''])

    print (dataset)

    Listing 6-37

    Creating the Index

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figal_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figal_HTML.jpg)


    In Listing [6-38](#472943_1_En_6_Chapter.xhtml#PC58), you group data by `Gender`,
    then implement the function lambda `x: (x - x.mean()) / x.std()*10`, and display
    results for both height and weight. The lambda operator or lambda function is
    a way to create a small anonymous function, i.e., a function without a name. This
    function is throwaway function; in other words, it is just needed where it has
    been created.


    ```

    In [28]: grouped = dataset.groupby(''Gender'')

    score = lambda x: (x - x.mean()) / x.std()*10

    print (grouped.transform(score))

    Listing 6-38

    Transformation

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figam_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figam_HTML.jpg)


    ### Filtration


    Python provides direct filtering for data. In Listing [6-39](#472943_1_En_6_Chapter.xhtml#PC59),
    you applied filtering by city, and the return cities appear more than three times
    in the data set.


    ```

    In [30]: print (dataset.groupby(''City'').filter(lambda x: len(x) >= 3))

    Listing 6-39

    Filtration

    ```


    ![../images/472943_1_En_6_Chapter/472943_1_En_6_Figan_HTML.jpg](images/472943_1_En_6_Chapter/472943_1_En_6_Figan_HTML.jpg)


    ## Summary


    This chapter covered how to explore and analyze data in different collection structures.
    Here is a list of what you just studied in this chapter:


    *   How to implement Python techniques to explore and analyze a series of data,
    create a series, access data from series with the position, and apply statistical
    methods on a series.


    *   How to explore and analyze data in a data frame, create a data frame, and
    update and access data. This included column and row selection, addition, and
    deletion, as well as applying statistical methods on a data frame.


    *   How to apply statistical methods on a panel to explore and analyze its data.


    *   How to apply statistical analysis on the derived data from implementing Python
    data grouping, iterating through groups, aggregations, transformations, and filtration
    techniques.


    The next chapter will cover how to visualize data using numerous plotting packages
    and much more.'
