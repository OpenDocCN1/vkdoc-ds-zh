    You can access list elements forward or backward. For instance, in Listing [3-2](#472943_1_En_3_Chapter.xhtml#PC2),
    `list2[3:]` returns elements starting from index 3 to the end of the list since
    `list2` has four elements where `[4,5]` is the element of index 3, which is in
    the form of nested list. Then you get `[[4,5]]` as a result of `print(list2[3:])`.
    You can also access a list element backward using negative indices. For example,
    `list3[-3]` will return the third element in the backward sequence `n-3`, i.e.,
    index 1. Here’s an example:


