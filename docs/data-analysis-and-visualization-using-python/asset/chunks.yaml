    10,000 人，这表明男性更倾向于使用枪支自杀。 |

    | 2. 2012 年至 2014 年间，美国每 10 万人口中的枪击死亡人数是多少？ | 死亡人数最高的是白人，其次是黑人，然后是西班牙裔。 |

    | 3. 2012 年至 2014 年间，美国按原因划分的年均枪击死亡人数是多少？ | 自杀和他杀死亡人数很高，而意外死亡人数较低。 |

