    # 4. File I/O Processing and Regular Expressions


    In this chapter, you’ll study input-output functions and file processing. In addition,
    you’ll study regular expressions and how to extract data that matches specific
    patterns.


    ## File I/O Processing


    Python provides numerous methods for input, output, and file processing. You can
    get input from the screen and output data to the screen as well as read data from
    files and store data in files.


    ### Data Input and Output


    You can read data from a user using the `input()` function. Received data by default
    is in text format. Hence, you should use conversion functions to convert the data
    into numeric values if required, as shown in Listing [4-1](#472943_1_En_4_Chapter.xhtml#PC1).


    ```

    In [2]: Name = input ("Enter your name: ")

    Name

    Enter your name: Osama Hashim

    Out[2]: ''Osama Hashim''

    In [3]: Mark = input("Enter your mark: ") Mark = float(Mark)

    Enter your mark: 92

    In [4]:print ("Welcome to Grading System \nHCT 2018")

    print ("\nCampus\t Name\t\tMark\tGrade")

    if (Mark>=85):

    Grade="B+"

    print ("FMC\t", Name,"\t",Mark,"\t", Grade)

    Welcome to Grading System

    HCT 2018

    Campus       Name         Mark    Grade

    FMC       Osama Hashim    92.0    B+

    Listing 4-1

    Screen Data Input/Output

    ```


    Here you are converting the `Mark` value into a float using `float(Mark)`. You
    use `\t` to add tabs and `\n` to jump lines on the screen.


    ### Opening and Closing Files


    Python’s built-in `open()` function is used to open a file stored on a computer
    hard disk or in the cloud. Here’s its syntax:


    ```

    file object = open(file_name [, access_mode][, buffering])

    ```


    Table [4-1](#472943_1_En_4_Chapter.xhtml#Tab1) describes its modes.


    **Table 4-1** Open File Modes


    | No. | Modes | Description |

    | --- | --- | --- |

    | 1 | `r` | Opens a file for reading only; the default mode |

    | 2 | `rb` | Opens a file for reading only in binary format |

    | 3 | `r+` | Opens a file for both reading and writing |

    | 4 | `rb+` | Opens a file for both reading and writing in binary format |

    | 5 | `w` | Opens a file for writing only |

    | 6 | `wb` | Opens a file for writing only in binary format |

    | 7 | `w+` | Opens a file for both writing and reading |

    | 8 | `wb+` | Opens a file for both writing and reading in binary format |

    | 9 | `a` | Opens a file for appending |

    | 10 | `ab` | Opens a file for appending in binary format |

    | 11 | `a+` | Opens a file for both appending and reading |

    | 12 | `ab+` | Opens a file for both appending and reading in binary format |'
