    os.remove( "test2.txt" )

    ```


    ### Directories in Python


    Python provides various methods for creating and accessing directories. Listing
    4-5 demonstrates how to create, move, and delete directories. You can find the
    current working directory using Python’s `getcwd()` method.


    ```

    In [35]: import os

    os.mkdir("Data 1") # create a directory

    os.mkdir("Data_2")

    os.chdir("Data_3")     # create a Childe directory

    os.getcwd()            # Get the current working directory

    os.rmdir(''Data 1'') # remove a directory

    os.rmdir(''Data_3'') # remove a directory

    Listing 4-5

    Creating and Deleting Directories

    ```


    ## Regular Expressions


    A *regular expression* is a special sequence of characters that helps find other
    strings or sets of strings matching specific patterns; it is a powerful language
    for matching text patterns.


    ### Regular Expression Patterns


    Different regular expression syntax can be used for extracting data from text
    files, XML, JSON, HTML containers, and so on.


    Table 4-3 lists some Python regular expression syntax.


    **Table 4-3** Python Regular Expression Syntax


    | No. | Pattern | Description |

    | --- | --- | --- |

    | 1 | `^` | Matches beginning of the line. |

    | 2 | `$` | Matches end of the line. |

    | 3 | `.` | Matches any single character except a newline. |

    | 4 | `[...]` | Matches any single character in brackets. |

    | 5 | `[^...]` | Matches any single character not in brackets. |

    | 6 | `re*` | Matches zero or more occurrences of the preceding expression. |

    | 7 | `re+` | Matches one or more occurrence of the preceding expression. |

    | 8 | `re?` | Matches zero or one occurrence of the preceding expression. |

    | 9 | `re{ n}` | Matches exactly *n* number of occurrences of the preceding expression.
    |

    | 10 | `re{ n,}` | Matches *n* or more occurrences of the preceding expression.
    |

    | 11 | `re{ n, m}` | Matches at least *n* and at most *m* occurrences of the preceding
    expression. |

    | 12 | `a&#124; b` | Matches either *a* or *b*. |

    | 13 | `(re)` | Groups regular expressions and remembers matched text. |

    | 14 | `(?imx)` | Temporarily toggles on *i*, *m*, or *x* options within a regular
    expression. |

    | 15 | `(?-imx)` | Temporarily toggles off *i*, *m*, or *x* options within a regular
    expression. |

    | 16 | `(?: re)` | Groups regular expressions without remembering matched text.
    |

    | 17 | `(?imx: re)` | Temporarily toggles on *i*, *m*, or *x* options within parentheses.
    |

    | 18 | `(?-imx: re)` | Temporarily toggles off *i*, *m*, or *x* options within
    parentheses. |

    | 19 | `(?#...)` | Comment . |

    | 20 | `(?= re)` | Specifies the position using a pattern. Doesn’t have a range.
    |

    | 21 | `(?! re)` | Specifies the position using pattern negation. Doesn’t have
    a range. |

    | 22 | `(?> re)` | Matches independent pattern without backtracking. |

    | 23 | `\w` | Matches word characters. |

    | 24 | `\W` | Matches nonword characters. |

    | 25 | `\s` | Matches whitespace. Equivalent to `[\t\n\r\f]`. |

    | 26 | `\S` | Matches nonwhitespace. |

    | 27 | `\d` | Matches digits. Equivalent to `[0-9]`. |

    | 28 | `\D` | Matches nondigits. |

    | 29 | `\A` | Matches beginning of the string. |

    | 30 | `\Z` | Matches end of the string. If a newline exists, it matches just
    before the newline. |

    | 31 | `\z` | Matches end of the string. |

    | 32 | `\G` | Matches point where the last match finished. |

    | 33 | `\b` | Matches word boundaries when outside brackets. |

    | 34 | `\B` | Matches nonword boundaries. |

    | 35 | `\n`, `\t`, etc. | Matches newlines, carriage returns, tabs, etc. |

    | 36 | `\1...\9` | Matches nth grouped subexpression. |

    | 37 | `\10` | Matches nth grouped subexpression if it matched already. |


    For instance, if you have a text file of e-mail log data and you want to extract
    only the text lines where the `@uct.ac.za` pattern appears, then you can use iteration
    to capture only the lines with the given pattern, as shown in Listing 4-6.


    ```

    In [46]: print ("\nUsing in to select lines // only print lines which has specific
    string ")

    fhand = open(''Emails.txt'')

    for line in fhand:

    line = line.rstrip()

    if not ''@uct.ac.za'' in line :

    continue

    print (line)

    Listing 4-6

    Reading and Processing a Text File

    ```


    You can extract only the lines starting with `From:`. Once it has been extracted,
    then you can split each line into a list and slice only the e-mail element, as
    indicated in Listing 4-7 and Listing 4-8.'
