    如果你通过引用将一个序列复制到另一个序列，那么对其中一个序列的任何更改都会影响到另一个序列。将 `my_series1` 复制到 `my_series_11`
    后，一旦更改 `my_series_11` 的索引，它就会反映回 `my_series1`，如清单 6-6 所示。


    ```

    In [17]: my_series_11 = my_series1

    print (my_series1)

    my_series_11.index = [''A'', ''B'', ''C'', ''D'', ''E'', ''F'']

    print (my_series_11)

    print (my_series1)

