  print (\"打开模式: \", Filehndl.mode)\n文件名称: Egypt.txt\n是否已关闭: False\n打开模式: r\n清单 4-2\n\
  已打开文件的属性\n```\n\n你可以使用 `close()` 方法关闭已打开的文件，以从内存中清除所有相关内容，并关闭指向后端文件的任何已打开流，如清单 4-3\
