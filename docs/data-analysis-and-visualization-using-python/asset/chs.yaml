  \n`rename()` 方法用于重命名文件；它接受两个参数：当前文件名和新文件名。此外，`remove()` 方法可用于删除文件，只需将要删除的文件名作为参数传入。\n\
  \n```\nIn [34]: import os\nos.rename( \"Egypt.txt\", \"test2.txt\" )\nos.remove(\
  \ \"test2.txt\" )\n```\n\n### Python 中的目录\n\nPython 提供了多种创建和访问目录的方法。清单 4-5 演示了如何创建、移动和删除目录。你可以使用\
