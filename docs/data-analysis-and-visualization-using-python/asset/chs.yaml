- '# 表格数据与数据格式


  数据以不同形式存在，可以是**非结构化数据**、**半结构化数据**或**结构化数据**。Python 提供了不同的结构来维护和操作数据，例如变量、列表、字典、元组、序列、面板和数据框。在
  Python 中，可以使用表示数据集中记录的元组列表，以数据框结构轻松表示表格数据。虽然易于创建，但这种表示方式通常无法实现重要的表格数据操作，例如高效的列选择、矩阵运算或电子表格风格的操作。`Tabular`
  是一个用于处理表格数据的 Python 模块包。其主要对象是 `tabarray` 类，这是一种用于保存和操作表格数据的数据结构。你可以将数据放入 `tabarray`
  对象中，以实现更灵活、更强大的数据处理。Pandas 库也提供了丰富的数据结构和函数，旨在使结构化数据的处理变得快速、简单且富有表现力。此外，它还提供了一个强大且高效的数据分析环境。


  可以使用以下构造函数创建 Pandas 数据框：


  ```

  pandas.DataFrame( data, index, columns, dtype, copy)

  ```


  Pandas 数据框可以通过多种输入形式创建，例如：


  *   列表

  *   字典

  *   序列

  *   Numpy ndarrays

  *   另一个数据框


  第 3 章将详细演示数据框结构的创建和操作。


  ## Python Pandas 数据科学库


  Pandas 是一个开源的 Python 库，通过其强大的数据结构提供高性能的数据操作和分析工具。Pandas 这个名字来源于“面板数据”（panel data），这是一个计量经济学中用于多维数据的术语。以下是
  Pandas 库的主要特性：


  *   提供从不同格式加载数据对象的机制

  *   创建具有默认和自定义索引的高效数据框对象

  *   重塑和透视数据集

  *   提供处理缺失数据的有效机制

  *   合并、分组、聚合和转换数据

  *   通过实现切片、索引、子集化、删除和插入等各种功能来操作大型数据集

  *   提供高效的时间序列功能


  有时你需要导入 Pandas 包，因为标准的 Python 发行版不附带 Pandas 模块。一个轻量级的替代方案是使用流行的 Python 包安装程序 `pip`
  来安装 Numpy。Pandas 库用于创建和处理序列、数据框和面板。


  ### Pandas 序列


  *序列*是一种一维标签数组，能够保存任何类型的数据（整数、字符串、浮点数、Python 对象等）。清单 1-29 展示了如何使用 Pandas 库创建序列。


