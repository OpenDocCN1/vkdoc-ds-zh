  \n## 基础 Python 编程技术\n\n本节演示了许多 Python 编程语法结构。\n\n\n\n### 选择语句\n\n`if` 语句用于在给定条件为真时执行特定的语句或语句集。`if`\
  \ 结构有多种形式，如表 1-9 所示。\n\n**表 1-9** `if` 语句结构\n\n| 形式 | `if` 语句 | `if-else` 语句 | 嵌套\
  \ `if` 语句 |\n| --- | --- | --- | --- |\n| **结构** | `if(condition):` `statements`\
  \ | `if(condition):` `statements` `else:` `statements` | `if (condition):` `statements`\
  \ `elif (condition):` `statements` `else:` `statements` |\n\n`if` 语句用于根据程序执行过程中出现的特定条件做出决策。如果结果为真，则执行一个或一组操作；如果结果为假，则执行另一组操作。图\
  \ 1-6 展示了大多数编程语言（包括 Python）中典型的决策结构的一般形式。在 Python 中，任何非零和非空值都被视为真，而零或空值则被视为假。\n\n\
