  ## 数据清洗与操作技术


  对于任何数据科学家来说，保持数据的准确性都至关重要。开发准确的模型并从所应用的模型中获得准确的预测，都依赖于对缺失值的处理。因此，处理缺失数据对于使模型更准确和有效非常重要。


  有许多技术和方法来处理缺失数据，例如：


  -   向前填充缺失值

  -   向后填充缺失值

  -   删除缺失值

  -   替换缺失（或）通用值

  -   用标量值替换 NaN


  以下示例用于处理表格数据集中的缺失值：


  ```

  In [31]: dataset.fillna(0) # 用零值填充缺失值

  In [35]: dataset.fillna(method=''pad'') # 向前填充方法

  In [35]: dataset.fillna(method='' bfill'') # 向后填充方法

  In [37]: dataset.dropna() # 删除所有缺失数据

  ```


  第 5 章涵盖了不同的数据收集和清洗技术。


  ## Series 和 DataFrame 的抽象


  *Series* 是 Pandas 中的主要数据结构之一。它与列表和字典不同。一个简单的可视化方法是将其视为两列数据。第一列是特殊的索引，很像字典的键，而第二列是你的实际数据。你可以为
  Series 指定一个索引，或者让 Python 自动分配索引。可以使用不同的属性从 Series 的 `iloc()` 和 `loc()` 属性中检索数据。此外，Python
  可以根据传递的值自动检索数据。如果你传递一个对象，那么 Python 会认为你想使用基于索引标签的 `loc()`。但是，如果你传递一个整数索引参数，那么 Python
  会考虑 `iloc()` 属性，如清单 1-37 所示。


  ```

  In [6]: import pandas as pd

  animals = ["Lion", "Tiger", "Bear"]

  pd.Series(animals)

  Out[6]: 0 Lion

  1 Tiger

  2 Bear

  dtype: object

  清单 1-37

  Series 结构与查询

  ```


