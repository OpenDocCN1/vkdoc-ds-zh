  ### 列删除


  你可以使用 `del` 方法删除任意列。例如，`del df2[''Test2'']` 会从数据集中删除 `Test2` 列。此外，你还可以使用 `pop` 方法来删除列。例如，`df2.pop(''Project'')`
  用于删除 `Project` 列。但是，在使用 `del` 或 `pop` 方法时需要小心，因为可能存在引用。在这种情况下，它不仅会从执行的数据框中删除，还会从被引用的数据框中删除。清单
