  \ 包可以生成许多不同的绘图格式；其中一些格式将在第 7 章中讨论。\n\n\n\n#### Seaborn\n\n`Seaborn` 是一个基于 `Matplotlib`\
  \ 的 Python 数据可视化库，它提供了高级接口，用于绘制美观且信息丰富的统计图形（参见代码清单 2-4）。\n\n```\nIn [34]: import\
