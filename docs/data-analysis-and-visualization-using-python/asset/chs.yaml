  清单 4-5\n创建和删除目录\n```\n\n## 正则表达式\n\n*正则表达式*是一种特殊的字符序列，有助于查找匹配特定模式的其他字符串或字符串集合；它是一种用于匹配文本模式的强大语言。\n\
  \n### 正则表达式模式\n\n可以使用不同的正则表达式语法从文本文件、XML、JSON、HTML 容器等中提取数据。\n\n表 4-3 列出了一些 Python\
  \ 正则表达式语法。\n\n**表 4-3** Python 正则表达式语法\n\n| 序号 | 模式 | 描述 |\n| --- | --- | --- |\n\
  | 1 | `^` | 匹配行首。 |\n| 2 | `$` | 匹配行尾。 |\n| 3 | `.` | 匹配除换行符之外的任意单个字符。 |\n| 4 |\
  \ `[...]` | 匹配方括号内的任意单个字符。 |\n| 5 | `[^...]` | 匹配不在方括号内的任意单个字符。 |\n| 6 | `re*` |\
  \ 匹配前一个表达式零次或多次。 |\n| 7 | `re+` | 匹配前一个表达式一次或多次。 |\n| 8 | `re?` | 匹配前一个表达式零次或一次。\
  \ |\n| 9 | `re{ n}` | 精确匹配前一个表达式 *n* 次。 |\n| 10 | `re{ n,}` | 匹配前一个表达式至少 *n* 次。\
  \ |\n| 11 | `re{ n, m}` | 匹配前一个表达式至少 *n* 次，至多 *m* 次。 |\n| 12 | `a&#124; b` | 匹配\
  \ *a* 或 *b*。 |\n| 13 | `(re)` | 对正则表达式进行分组并记住匹配的文本。 |\n| 14 | `(?imx)` | 在正则表达式内临时启用\
  \ *i*、*m* 或 *x* 选项。 |\n| 15 | `(?-imx)` | 在正则表达式内临时禁用 *i*、*m* 或 *x* 选项。 |\n| 16\
  \ | `(?: re)` | 对正则表达式进行分组但不记住匹配的文本。 |\n| 17 | `(?imx: re)` | 在括号内临时启用 *i*、*m* 或\
  \ *x* 选项。 |\n| 18 | `(?-imx: re)` | 在括号内临时禁用 *i*、*m* 或 *x* 选项。 |\n| 19 | `(?#...)`\
  \ | 注释。 |\n| 20 | `(?= re)` | 使用模式指定位置。没有范围。 |\n| 21 | `(?! re)` | 使用模式否定指定位置。没有范围。\
  \ |\n| 22 | `(?> re)` | 匹配独立模式，不进行回溯。 |\n| 23 | `\\w` | 匹配单词字符。 |\n| 24 | `\\W`\
  \ | 匹配非单词字符。 |\n| 25 | `\\s` | 匹配空白字符。等价于 `[\\t\\n\\r\\f]`。 |\n| 26 | `\\S` | 匹配非空白字符。\
  \ |\n| 27 | `\\d` | 匹配数字。等价于 `[0-9]`。 |\n| 28 | `\\D` | 匹配非数字字符。 |\n| 29 | `\\A`\
  \ | 匹配字符串开头。 |\n| 30 | `\\Z` | 匹配字符串结尾。如果存在换行符，则匹配换行符之前的位置。 |\n| 31 | `\\z` | 匹配字符串结尾。\
  \ |\n| 32 | `\\G` | 匹配上一次匹配结束的位置。 |\n| 33 | `\\b` | 在括号外时匹配单词边界。 |\n| 34 | `\\B`\
  \ | 匹配非单词边界。 |\n| 35 | `\\n`、`\\t` 等 | 匹配换行符、回车符、制表符等。 |\n| 36 | `\\1...\\9` | 匹配第\
  \ n 个分组子表达式。 |\n| 37 | `\\10` | 如果已匹配，则匹配第 n 个分组子表达式。 |\n\n例如，如果你有一个包含电子邮件日志数据的文本文件，并且只想提取出现\
  \ `@uct.ac.za` 模式的文本行，那么你可以使用迭代来仅捕获包含该模式的行，如清单 4-6 所示。\n\n```\nIn [46]: print (\"\
