  -1.0 到 1.0。换句话说，其值不能超过 1.0 或小于 -1.0，其中 -1.0 的相关系数表示完全负相关，1.0 的相关系数表示完全正相关。相关系数用
  `r` 表示。如果其值大于零，则为正相关；如果值小于零，则为负相关。值为零表示两个变量之间没有关系。


