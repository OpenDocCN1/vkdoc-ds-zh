  \ `o`），就停止迭代。此外，当语法上需要一条语句，但你不想执行任何命令或代码时，可以使用 `pass` 语句。`pass` 语句是一个空操作；执行时不会发生任何事情。\n\
  \n### `try` 和 `except`\n\n`try` 和 `except` 用于处理意外值，你可以通过它们验证输入值以避免错误发生。在清单 1-21\
