  ## 元组\n\n*元组*是一个序列，就像不可变对象的列表一样。元组和列表之间的区别在于元组不能被更改；此外，元组使用圆括号，而列表使用方括号。\n\n###\
  \ 创建元组\n\n你可以简单地通过使用不同的逗号分隔值来创建元组。你可以通过索引访问元组中的元素，如代码清单 3-19 所示。\n\n```\nIn [1]:Names\
  \ = ('Omar', 'Ali', 'Bahaa')\nMarks = ( 75, 65, 95 )\nprint (Names[2])\nprint (Marks)\n\
  print (max(Marks))\nBahaa\n(75, 65, 95)\n\nIn [2]: for name in Names:\nprint (name)\n\
  Omar\nAli\nBahaa\n代码清单 3-19\n创建和显示元组\n```\n\n让我们尝试更改元组以修改任何元素，如代码清单 3-20 所示；我们会得到一个错误，因为如前所述，元组不能被更改。\n\
  \n```\nIn [3]: Marks[1]=66\n\nTypeError    Traceback (most recent call last)\n in\
  \ ()\n----> 1 Marks[1]=66\nTypeError: 'tuple' object does not support item assignment\n\
  代码清单 3-20\n尝试编辑元组\n```\n\n与列表类似，你可以使用元素的索引向前和向后访问元组元素。示例如下：\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figb_HTML.jpg](img/472943_1_En_3_Figb_HTML.jpg)\n\
  \n你可以对元组列表进行排序。代码清单 3-21 展示了如何对元组元素进行原地排序，以及如何创建另一个已排序的元组。\n\n```\nIn [1]:import\
  \ operator\nMarksCIS = [(88,65),(70,90,85), (55,88,44)]\nprint (MarksCIS)      \
  \     # original tuples\nprint (sorted(MarksCIS))   # direct sorting\n[(88, 65),\
  \ (70, 90, 85), (55, 88, 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\nIn [2]: print\
  \ (MarksCIS)     # original tuples\n#create a new sorted tuple\nMarksCIS2 = sorted(MarksCIS,\
  \ key=lambda x: (x[0], x[1]))\nprint (MarksCIS2)\n[(88, 65), (70, 90, 85), (55,\
  \ 88, 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\nIn [3]:print (MarksCIS) # original\
  \ tuples\nMarksCIS.sort(key=lambda x: (x[0], x[1])) # sort in tuple\nprint (MarksCIS)\n\
  [(88, 65), (70, 90, 85), (55, 88, 44)]\n[(55, 88, 44), (70, 90, 85), (88, 65)]\n\
  代码清单 3-21\n排序元组\n```\n\n默认情况下，内置的 `sort` 函数检测到项目是元组形式，因此排序函数会先根据第一个元素排序，然后根据第二个元素排序。\n\
  \n### 连接元组\n\n如前所述，元组是不可变的，这意味着你不能更新或更改元组元素的值。你可以从现有元组中取出一部分来创建新的元组，如代码清单 3-22 所示。\n\
  \n```\nIn [5]:MarksCIS=(70,85,55)\nMarksCIN=(90,75,60)\nCombind=MarksCIS + MarksCIN\n\
  print (Combind)\n(70, 85, 55, 90, 75, 60)\n代码清单 3-22\n连接元组\n```\n\n\n\n### 访问元组中的值\n\
  \n要访问元组中的元素，可以使用方括号和元素索引来获取元素值，如代码清单 3-23 所示。\n\n```\nIn [4]:MarksCIS = (70, 85,\
  \ 55)\nMarksCIN = (90, 75, 60)\nprint (\"CIS 的第三个分数是 \", MarksCIS[2])\nprint (\"\
  CIN 的第三个分数是 \", MarksCIN[2])\nCIS 的第三个分数是 55\nCIN 的第三个分数是 60\n代码清单 3-23\n访问元组中的值\n\
  ```\n\n你可以使用 `del` 删除元组，如代码清单 3-24 所示。\n\n```\nIn [5]: MarksCIN = (90, 75, 60)\n\
  print (MarksCIN)\ndel MarksCIN\nprint (MarksCIN)\n(90, 75, 60)\n\nNameError    \
  \                             Traceback (most recent call last)\n in ()\n2 print\
  \ (MarksCIN) 3 del MarksCIN\n----> 4 print (MarksCIN)\nNameError: name 'MarksCIN'\
  \ is not defined\n代码清单 3-24\n删除元组\n```\n\n你收到错误是因为你要求 Python 打印一个名为 `MarksCIN` 的元组，而该元组已被删除。你可以正向和反向访问元组元素；此外，你还可以使用索引从元组中切片取值。代码清单\
  \ 3-25 展示了如何进行正向切片，其中 `MarksCIS[1:4]` 获取从元素 1 到元素 3 的元素，而 `MarksCIS[:]` 获取元组中的所有元素。在反向切片中，`MarksCIS[-3]`\
  \ 反向获取第三个元素，`MarksCIS[-4:-2]` 反向获取从第四个元素到第三个元素（但不包括第二个反向元素）。\n\n```\nIn [6]: MarksCIS\
  \ = (88, 65, 70,90,85,45,78,95,55)\nprint (\"\\n 正向切片\")\nprint (MarksCIS[1:4])\n\
  print (MarksCIS[:3])\nprint (MarksCIS[6:])\nprint (MarksCIS[4:6])\nprint (\"\\n\
  \ 反向切片\")\nprint (MarksCIS[-4:-2])\nprint (MarksCIS[-3])\nprint (MarksCIS[-3:])\n\
  print (MarksCIS[ :-3])\n正向切片\n(65, 70, 90)\n(88, 65, 70)\n(78, 95, 55)\n(85, 45)\n\
  反向切片\n(45, 78)\n\n(78, 95, 55)\n(88, 65, 70, 90, 85, 45)\n代码清单 3-25\n切片元组值\n```\n\
  \n### 基本元组操作\n\n与字符串类似，元组支持 `+` 和 `*` 运算符，分别用于连接和重复，以生成新的元组。参见表 3-5。\n\n**表 3-5**\
  \ 元组操作\n\n| **表达式** | **结果** | **描述** |\n| --- | --- | --- |\n| `len((5, 7, 2,6))`\
  \ | `4` | 长度 |\n| `(1, 2, 3,10) + (4, 5, 6,7)` | `(1, 2, 3,10, 4, 5, 6,7)` | 连接\
  \ |\n| `('Hi!',) * 4` | `('Hi!', 'Hi!', 'Hi!', 'Hi!')` | 重复 |\n| `10 in (10, 2,\
  \ 3)` | `True` | 成员关系 |\n| `for x in (10, 1, 5): print x,` | `10 1 5` | 迭代 |\n\n\
  ## 序列\n\n序列被定义为一维带标签的数组，能够容纳任何数据类型（整数、字符串、浮点数、Python 对象等）。\n\n```\nSeriesX = pd.Series(data,\
  \ index=index),\n```\n\n这里，`pd` 是 Pandas 的缩写，`data` 指的是一个 Python 字典、一个 ndarray，甚至是一个标量值。\n\
