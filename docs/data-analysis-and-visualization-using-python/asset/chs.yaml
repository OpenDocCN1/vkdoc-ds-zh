  \ 工作台通过与 Jupyter Notebook 的集成，支持交互式数据科学实验。\n\nAzure Notebooks 可在 [`https://notebooks.azure.com/`](https://notebooks.azure.com/)\
  \ 免费获取。注册并登录 Azure Notebooks 后，您将看到如下所示的菜单：\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figa_HTML.jpg](img/472943_1_En_1_Figa_HTML.jpg)\n\
