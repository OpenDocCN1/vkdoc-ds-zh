  ## 数据框数据结构


  如前所述，数据框是一种二维数据结构，包含异构数据类型，即表格数据。




  ### 创建数据框


  Pandas 可以使用构造函数 `pandas.DataFrame(data, index, columns, dtype, copy)` 创建数据框。数据框可以从列表、序列、字典、Numpy
  数组或其他数据框创建。Pandas 数据框不仅有助于存储表格数据，还可以对数据框的行和列执行算术运算。代码清单 6-10 从单个列表和列表的列表创建了一个数据框。


  ```

