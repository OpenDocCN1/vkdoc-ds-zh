  \ print (SeriesDict2.get('y')) # 通过键获取特定值\n使用 get 和 set 方法通过索引标签访问序列值\n\ny   1999\n\
  m   2\nd   Sunday\ns   NaN\ndtype: object\n\n代码清单 3-31\n修改序列并使用 Get() 方法\n```\n\n\
  ### 从标量值创建序列\n\n如果数据是标量值，则必须提供索引。该值将被重复以匹配 `index` 的长度。参见代码清单 3-32。\n\n```\nIn [14]:\
  \ print (\"\\n 从标量值创建序列 \")\nScl = pd.Series(8., index=['a', 'b', 'c', 'd'])\nprint\
  \ (Scl)\n从标量值创建序列\na   8.0\nb   8.0\nc   8.0\nd   8.0\ndtype: float64\n代码清单 3-32\n\
  使用标量值创建序列\n```\n\n\n\n### 序列的向量化运算与标签对齐\n\n`Series` 运算会自动根据标签对齐数据。因此，你可以在编写计算时无需考虑涉及的序列是否具有相同的标签。如果标签不匹配，则会给出缺失值\
  \ `NaN`。参见清单 3-33。\n\n```\nIn [16]: SerX = pd.Series([1,2,3,4], index=['a', 'b',\
  \ 'c', 'd'])\nprint (\"加法\");\nprint( SerX + SerX)\nprint (\"标签不匹配的加法\");\nprint\
  \ (SerX[1:] + SerX[:-1])\nprint (\"乘法\");\nprint (SerX * SerX)\nprint (\"指数运算\"\
  );\nprint (np.exp(SerX))\n加法\na 2\nb 4\nc 6\nd 8\ndtype: int64\n标签不匹配的加法\na  NaN\n\
  b  4.0\nc  6.0\nd  NaN\ndtype: float64\n乘法\na  1\nb  4\nc  9\nd  16\ndtype: int64\n\
  指数运算\na  2.718282\nb  7.389056\nc  20.085537\nd  54.598150\ndtype: float64\n清单 3-33\n\
  对序列进行向量化运算\n```\n\n### 名称属性\n\n你可以为序列命名；也可以修改序列的名称，如清单 3-34 所示。\n\n```\nIn [17]:std\
  \ = pd.Series([77,89,65,90], name=\"StudentsMarks\")\nprint (std.name)\nstd = std.rename(\"\
  Marks\")\nprint (std.name)\nStudentsMarks\nMarks\n清单 3-34\n使用序列名称属性\n```\n\n## 数据框\n\
  \n*数据框*是一种二维表格型标签化数据结构，其列可能具有不同的数据类型。数据框可以通过多种数据集合创建，例如：\n\n*   一维 `ndarray`、列表、`dict`\
  \ 或序列\n*   二维 Numpy `ndarray`\n*   [结构化或记录型](http://docs.scipy.org/doc/numpy/user/basics.rec.html)\
  \ `ndarray`\n*   一个序列\n*   另一个数据框\n\n数据框具有参数，即索引（行标签）和列（列标签）。\n\n### 从序列字典或字典字典创建数据框\n\
  \n你可以简单地通过序列字典创建一个数据框；也可以为其指定索引。如果索引没有对应的值，则会给出 `NaN` 值，如清单 3-35 所示。\n\n```\nIn\
  \ [5]: import pandas as pd\ndict1 = {'one' : pd.Series([1., 2., 3.], index=['a',\
  \ 'b', 'c']),\n'two' : pd.Series([1., 2., 3., 4.], index=['a', 'b', 'c', 'd'])}\n\
  df = pd.DataFrame(dict1)\ndf\nOut[5]: one  two\na    1.0    1.0\nb    2.0    2.0\n\
  c    3.0    3.0\nd    NaN    4.0\nIn [6]: # 为 DataFrame 设置索引\npd.DataFrame(dict1,\
  \ index=['d', 'b', 'a'])\nOut[6]: one  two\nd    NaN    4.0\nb    2.0    2.0\na\
  \    1.0    1.0\nIn [8]: # 控制 DataFrame 的标签显示\npd.DataFrame(dict1, index=['d', 'b',\
  \ 'a'], columns=['two', 'three', 'one'])\nOut[8]: two  three  one\nd    4.0    NaN\
  \    NaN\nb    2.0    NaN    2.0\na    1.0    NaN    1.0\n清单 3-35\n从序列字典创建数据框\n\
  ```\n\n### 从 Ndarrays/列表字典创建数据框\n\n当你从 `ndarray` 创建数据框时，所有 ndarray 的长度必须相同。同时，传入的索引长度应与数组长度相同。如果未传入索引，结果将是\
  \ `range(n)`，其中 `n` 是数组长度。参见清单 3-36。\n\n```\nIn [11]: # 无索引\nndarrdict = {'one'\
  \ : [1., 2., 3., 4.],'two' : [4., 3., 2., 1.]}\npd.DataFrame(ndarrdict)\nOut[11]:\
  \           one    two\n0     1.0    4.0\n1     2.0    3.0\n2     3.0    2.0\n3\
  \     4.0    1.0\nIn [12]: # 指定索引\npd.DataFrame(ndarrdict, index=['a', 'b', 'c',\
  \ 'd'])\nOut[12]:     one    two\na      1.0      4.0\nb      2.0      3.0\nc  \
  \    3.0      2.0\nd      4.0      1.0\n清单 3-36\n从 Ndarray 创建数据框\n```\n\n### 从结构化或记录数组创建数据框\n\
  \n清单 3-37 通过先指定每列的数据类型，再指定每行的值来创建一个数据框。`('A', 'i4')` 将列标签及其数据类型确定为整数，`('B', 'f4')`\
  \ 将标签确定为 B 且数据类型为浮点数，最后 `('C', 'a10')` 将标签 C 和数据类型指定为最多十个字符的字符串。\n\n```\nIn [18]:import\
  \ pandas as pd\nimport numpy as np\ndata = np.zeros((2,), dtype=[('A', 'i4'),('B',\
  \ 'f4'),('C', 'a10')])\ndata[:] = [(1,2.,'Hello'), (2,3.,\"World\")]\npd.DataFrame(data)\n\
  Out[18]:     A      B      C\n0 1      2.0    b'Hello'\n1 2      3.0    b'World'\n\
  In [16]: pd.DataFrame(data, index=['First', 'Second'])\nOut[16]:            A  \
  \   B      C\nFirst      1     2.0    b'Hello'\nSecond     2     3.0    b'World'\n\
  In [17]: pd.DataFrame(data, columns=['C', 'A', 'B'])\nOut[17]:      C         A\
  \     B\n0    b'Hello'  1     2.0\n1    b'World'  2     3.0\n清单 3-37\n从记录数组创建数据框\n\
  ```\n\n### 从字典列表创建数据框\n\n此外，你也可以从字典列表创建数据框，如清单 3-38 所示。\n\n```\nIn [19]: data2 =\
  \ [{'A ': 1, 'B ': 2}, {'A': 5, 'B': 10, 'C': 20}]\npd.DataFrame(data2)\nOut[19]:\
  \ A  B       C\n0   1  2   NaN\n1   5  10  20.0\nIn [20]: pd.DataFrame(data2, index=['First',\
  \ 'Second'])\nOut[20]:           A   B      C\nFirst    1   2    NaN\nSecond   5\
  \   10   20.0\nIn [21]: pd.DataFrame(data2, columns=['A', 'B'])\nOut[21]:    A \
  \  B\n0  1   2\n1  5  10\n清单 3-38\n从字典列表创建数据框\n```\n\n### 从元组字典创建数据框\n\n另一种创建多级索引数据框的方法是传递一个元组字典，如清单\
  \ 3-39 所示。\n\n```\nIn [22]: pd.DataFrame({('a', 'b'): {('A', 'B'): 1, ('A', 'C'):\
  \ 2},\n('a', 'a'): {('A', 'C'): 3, ('A', 'B'): 4},\n('a', 'c'): {('A', 'B'): 5,\
  \ ('A', 'C'): 6},\n('b', 'a'): {('A', 'C'): 7, ('A', 'B'): 8},\n('b', 'b'): {('A',\
  \ 'D'): 9, ('A', 'B'): 10}})\n清单 3-39\n从元组字典创建数据框\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figc_HTML.jpg](img/472943_1_En_3_Figc_HTML.jpg)\n\
  \n### 选择、添加和删除数据框列\n\n一旦你有了一个数据框，就可以简单地添加列、删除列以及选择特定列。清单 3-40 演示了如何修改数据框及其相关操作。\n\
  \n```\nIn [25]: # 数据框列的选择、添加、删除\nndarrdict = {'one' : [1., 2., 3., 4.], 'two' :\
  \ [4., 3., 2., 1.]}\ndf = pd.DataFrame(ndarrdict, index=['a', 'b', 'c', 'd'])\n\
  df\n清单 3-40\n在已创建的数据框上添加列并执行操作\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figd_HTML.jpg](img/472943_1_En_3_Figd_HTML.jpg)\n\
  \n```\nIn [26]: df['three'] = df['one'] * df['two'] # 添加列\ndf['flag'] = df['one']\
  \ > 2     # 添加列\ndf\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Fige_HTML.jpg](img/472943_1_En_3_Fige_HTML.jpg)\n\
  \n你可以向数据框插入一个标量值；该值会自动填充整个列。此外，如果你插入一个索引与数据框不匹配的序列，它将会调整为数据框的索引。要删除一列，可以使用 `del`\
  \ 或 `pop` 方法，如清单 3-41 所示。\n\n```\nIn [27]: df['Filler'] = 'HCT'\ndf['Slic'] = df['one'][:2]\n\
  df\n清单 3-41\n使用标量添加列并赋值给数据框\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figf_HTML.jpg](img/472943_1_En_3_Figf_HTML.jpg)\n\
  \n```\nIn [28]:# 删除列\ndel df['two']\nThree = df.pop('three')\ndf\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figg_HTML.jpg](img/472943_1_En_3_Figg_HTML.jpg)\n\
  \n```\nIn [29]: df.insert(1, 'bar', df['one'])\ndf\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figh_HTML.jpg](img/472943_1_En_3_Figh_HTML.jpg)\n\
  \n默认情况下，列会被添加到末尾。但是，你可以使用 `insert()` 函数将列插入到列中的特定位置，如上所示。\n\n\n\n### 在方法链中分配新列\n\
  \n数据框有一个`assign()`方法，可以让你轻松创建可能源自现有列的新列。此外，你还可以通过修改列并执行必要操作来更改特定列的值，如清单 3-42 中的列\
  \ A 所示。\n\n```\nIn [54]: import numpy as np\nimport pandas as pd\ndf = pd.DataFrame({\"\
  A\": [1, 2, 3], \"B\": [4, 5, 6]})\ndf = df.assign(C=lambda x: x['A'] + x['B'])\n\
  df = df.assign( D=lambda x: x['A'] + x['C'])\ndf\n清单 3-42\n使用 assign() 方法添加派生列\n\
  ```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figi_HTML.jpg](img/472943_1_En_3_Figi_HTML.jpg)\n\
  \n```\nIn [55]: df = df.assign( A=lambda x: x['A'] *2)\ndf\n```\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figj_HTML.jpg](img/472943_1_En_3_Figj_HTML.jpg)\n\
  \n### 索引与选择数据框\n\n表 3-6 总结了数据框的列和行索引与选择方法。\n\n表 3-6\n\n数据框索引与选择方法\n\n| **操作** |\
