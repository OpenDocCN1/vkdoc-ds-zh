  \ 和 `except` 处理字符串 `12`，该字符串可以转换为整数值。\n\n```\nIn [14]: # Try and Except\nastr='Al\
  \ Fayoum'\nerrosms=''\ntry:\nistr=int(astr) # error\nexcept:\nistr=-1\nerrosms=\"\
  \\nIncorrect entry\"\nprint (\"First Try:\", istr , errosms)\nFirst Try: -1\nIncorrect\
  \ entry\nIn [15]:# Try and Except\nastr='12'\nerrosms=' '\ntry:\nistr=int(astr)\
  \ # error\nexcept:\nistr=-1\nerrosms=\"\\nIncorrect entry\"\nprint (\"First Try:\"\
  , istr , errosms)\nFirst Try: 12\nListing 1-21\ntry and except Statements\n```\n\
  \n### 字符串处理\n\n*字符串*是一个字符序列，可以通过方括号中的表达式（称为*索引*）来访问。例如，如果你有一个名为 `var1` 的字符串变量，它保存单词\
  \ `PYTHON`，那么 `var1[1]` 将返回字符 `Y`，而 `var1[-2]` 将返回字符 `O`。Python 通过将文本括在单引号或双引号中来处理字符串。字符串存储在连续的内存位置中，可以从两个方向（正向和反向）访问，如下例所示，其中\n\
  \n*   正向索引从 0、1、2、3 等开始。\n*   反向索引从 -1、-2、-3、-4 等开始。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Figh_HTML.jpg](img/472943_1_En_1_Figh_HTML.jpg)\n\
  \n#### 字符串特殊运算符\n\n表 1-12 列出了字符串处理中使用的运算符。假设你有两个变量 `a = 'Hello'` 和 `b = 'Python'`。那么你可以实现表\
  \ 1-12 中所示的操作。\n\n**表 1-12**  \n字符串运算符\n\n| 运算符 | 描述 | 输出 |\n| --- | --- | --- |\n\
  | `+` | 连接：将运算符两侧的值相加 | `a + b` 将得到 `HelloPython`。 |\n| `*` | 重复：创建新字符串，连接同一字符串的多个副本\
  \ | `a*2` 将得到 `-HelloHello`。 |\n| `[]` | 切片：返回给定索引处的字符 | `a[1]` 将得到 `e`。 |\n| `[\
  \ : ]` | 范围切片：返回给定范围内的字符 | `a[1:4]` 将得到 `ell`。 |\n| `in` | 成员资格：如果字符存在于给定字符串中，则返回\
  \ true | `H in a` 将返回 true。 |\n| `not in` | 成员资格：如果字符不存在于给定字符串中，则返回 true | `M not\
  \ in a` 将返回 true。 |\n\n使用运算符 `%` 进行字符串格式化时会用到各种符号。表 1-13 给出了一些简单的示例。\n\n**表 1-13**\
