  import mlab\netc....\n```\n\n一旦你将任何库加载到你的 `Python` 脚本中，你就可以调用该包的函数和属性。\n\n### Python\
  \ 中用于数据可视化的流行库\n\n`Python` 语言提供了大量用于绘制数据的数据可视化库。最常用和常见的数据可视化库有 `Pygal`、`Altair`、`VisPy`、`PyQtGraph`、`Matplotlib`、`Bokeh`、`Seaborn`、`Plotly`\
  \ 和 `ggplot`，如图 2-1 所示。\n\n![../images/472943_1_En_2_Chapter/472943_1_En_2_Fig1_HTML.png](img/472943_1_En_2_Fig1_HTML.png)\n\
  \n图 2-1  \n数据可视化库\n\n这些库各有其特点。其中一些库可能被采用用于实现，并依赖于其他库。例如，`Seaborn` 是一个使用 `Matplotlib`\
  \ 的统计数据可视化库。此外，在可视化数据之前，它还需要 `Pandas`，可能还需要 `NumPy` 进行统计处理。\n\n#### Matplotlib\n\
  \n`Matplotlib` 是一个用于数据可视化的 `Python` 二维绘图库，它基于 `Numpy` 数组构建，旨在与更广泛的 `SciPy` 栈协同工作。它能以多种格式生成出版质量的图形，并在跨平台的交互式环境中运行。有两种选项可以将图形直接嵌入到笔记本中。\n\
  \n* `%matplotlib notebook` 将导致在笔记本中嵌入*交互式*绘图。\n* `%matplotlib inline` 将导致在笔记本中嵌入绘图的*静态*图形图像。\n\
  \n代码清单 2-2 使用 `Matplotlib` 绘制固定数据并调整绘图属性。\n\n```\nIn [12]:import numpy as np\nimport\
  \ matplotlib.pyplot as plt\n%matplotlib inline\nplt.style.use('seaborn-whitegrid')\n\
  X = [590,540,740,130,810,300,320,230,470,620,770,250]\nY = [32,36,39,52,61,72,77,75,68,57,48,48]\n\
  plt.scatter(X,Y)\nplt.xlim(0,1000)\nplt.ylim(0,100)\n#scatter plot color\nplt.scatter(X,\
  \ Y, s=60, c=\"red\", marker=\"^\")\n#change axes ranges\nplt.xlim(0,1000)\nplt.ylim(0,100)\n\
  #add title\nplt.title('Relationship Between Temperature and Iced Coffee Sales')\n\
  #add x and y labels\nplt.xlabel('Sold Coffee')\nplt.ylabel('Temperature in Fahrenheit')\n\
  #show plot\nplt.show()\n代码清单 2-2\n导入并使用 Matplotlib 库\n```\n\n图 2-2 展示了 `Matplot`\
