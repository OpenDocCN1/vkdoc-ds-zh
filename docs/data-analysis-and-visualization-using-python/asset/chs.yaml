  \n图 1-5\n\nPython Spyder IDE\n\n在左侧，您可以编写 Python 脚本，在右侧，您可以在控制台中看到已执行的脚本。\n\n##\
  \ Python 编程基础\n\n本节介绍 Python 编程的基础知识。\n\n### 基本语法\n\nPython *标识符* 是用于标识所创建脚本中的变量、函数、类、模块或其他对象的名称。标识符以字母\
  \ *A* 到 *Z* 或 *a* 到 *z* 或下划线（`_`）开头，后跟零个或多个字母、下划线和数字（0 到 9）。\n\nPython 不允许在标识符中使用特殊字符，例如\
  \ `@`、`$` 和 `%`。Python 是一种区分大小写的编程语言。因此，`Manpower` 和 `manpower` 在 Python 中是两个不同的标识符。\n\
  \n以下是命名 Python 标识符的规则：\n\n*   类名以大写字母开头。所有其他标识符以小写字母开头。\n\n*   以单个前导下划线开头的标识符表示该标识符是私有的。\n\
  \n*   以两个前导下划线开头的标识符表示一个强私有的标识符。\n\n*   如果标识符也以两个尾随下划线结尾，则该标识符是语言定义的特殊名称。\n\n`help?`\
  \ 方法可用于从 Python 用户手册获取支持，如代码清单 1-1 所示。\n\n```\nIn [3]:      help?\nSignature:  \
  \ help(*args, **kwds)\nType:        _Helper\nString form: Type help() for interactive\
  \ help, or help(object) for help about object.\nNamespace:   Python builtin\nFile:\
  \        ~/anaconda3_501/lib/python3.6/_sitebuiltins.py\nDocstring:\nDefine the\
  \ builtin 'help'.\nThis is a wrapper around pydoc.help that provides a helpful message\n\
  when 'help' is typed at the Python interactive prompt .\nCalling help() at the Python\
  \ prompt starts an interactive help session.\nCalling help(thing) prints help for\
  \ the python object 'thing'.\n代码清单 1-1\n从 Python 获取帮助\n```\n\n给定 Python 脚本中的最小单元称为\
  \ *标记*，它代表标点符号、保留字以及语句中的每个单独单词，这些单词可以是关键字、标识符、字面量和运算符。\n\n表 1-1 列出了 Python 中的保留字。保留字是\
  \ Python 语言已经保留的单词，用户不能重新定义或声明。\n\n表 1-1\n\nPython 保留关键字\n\n| `and` | `exec` | `not`\
  \ | `continue` | `global` | `with` | `yield` | `in` |\n| --- | --- | --- | --- |\
  \ --- | --- | --- | --- |\n| `assert` | `finally` | `or` | `def` | `if` | `return`\
  \ | `else` | `is` |\n| `break` | `for` | `pass` | `except` | `lambda` | `while`\
  \ | `try` |   |\n| `class` | `from` | `print` | `del` | `import` | `raise` | `elif`\
  \ |   |\n\n#### 行与缩进\n\n行缩进在 Python 中很重要，因为 Python 不依赖花括号来表示类、函数定义或流程控制的代码块。因此，代码段块由行缩进表示，并且被严格执行，如代码清单\
  \ 1-2 所示。\n\n```\nIn [4]:age, mark, code=10,75,\"CIS2403\"\nprint (age)\nprint (mark)\n\
  print (code)\nFile \"\", line 4\nprint (code)\nIndentationError: unexpected indent\n\
  代码清单 1-2\n行缩进语法错误\n```\n\n#### 多行语句\n\nPython 中的语句通常以换行符结束。但程序员可以使用行继续符（`\\`）来表示该行应该继续，如代码清单\
  \ 1-3 所示。否则，将发生语法错误。\n\n```\nIn [5]:TV=15\nMobile=20 Tablet = 30\ntotal = TV +\n\
  Mobile +\nTablet\nprint (total)\nFile \"\", line 5\ntotal = TV +\nSyntaxError: invalid\
  \ syntax\n代码清单 1-3\n多行语句\n```\n\n以下是正确的语法：\n\n```\nIn [6]: TV=15\nMobile=20\nTablet\
  \ = 30\ntotal = TV + \\\nMobile + \\\nTablet\nprint (total)\n\n```\n\n包含在 `[]`、`{}`\
  \ 或 `()` 括号内的语句代码段不需要使用行继续符，如代码清单 1-4 所示。\n\n```\nIn [7]: days = ['Monday', 'Tuesday',\
  \ 'Wednesday',\n'Thursday', 'Friday']\nprint (days)\n['Monday', 'Tuesday', 'Wednesday',\
  \ 'Thursday', 'Friday']\n代码清单 1-4\n带引号的语句\n```\n\n\n\n#### Python 中的引号\n\nPython\
  \ 接受单引号（`'`）、双引号（`\"`）和三引号（`'''` 或 `\"\"\"`）来表示字符串字面量，只要字符串的起始和结束使用相同类型的引号即可。不过，三引号用于跨越多行的字符串，如代码清单\
  \ 1-5 所示。\n\n```\nIn [8]:sms1 = 'Hellow World'\nsms2 = \"Hellow World\"\nsms3 =\
  \ \"\"\" Hellow World\"\"\"\nsms4 = \"\"\" Hellow\nWorld\"\"\"\nprint (sms1)\nprint\
  \ (sms2)\nprint (sms3)\nprint (sms4)\nHellow World\nHellow World\nHellow World\n\
  Hellow\nWorld\n代码清单 1-5\nPython 中的引号\n```\n\n#### 单行多条语句\n\nPython 允许使用 `\\n` 将一行拆分为多行。此外，如果语句都不启动新的代码块，则分号（`;`）允许在单行上放置多条语句，如代码清单\
  \ 1-6 所示。\n\n```\nIn [9]: TV=15; name=\"Nour\"; print (name); print (\"Welcome to\\\
  nDubai Festival 2018\")\nNour\nWelcome to\nDubai Festival 2018\n代码清单 1-6\n分号和换行符的使用\n\
  ```\n\n#### 从用户读取数据\n\n代码清单 1-7 中的代码段提示用户输入姓名和年龄，将年龄转换为整数，然后显示数据。\n\n```\nIn [10]:name\
  \ = input(\"Enter your name \")\nage = int (input(\"Enter your age \"))\nprint (\"\
  \\nName =\", name); print (\"\\nAge =\", age)\nEnter your name Nour\nEnter your\
  \ age 12\nName = Nour\nAge = 12\n代码清单 1-7\n从用户读取数据\n```\n\n### 声明变量并赋值\n\n在 Python\
  \ 中，没有限制必须显式声明变量。一旦你给变量赋值，Python 就会根据所赋的值来认定该变量。如果赋的值是字符串，则该变量被视为字符串。如果赋的值是实数，则\
  \ Python 会将该变量视为双精度浮点型变量。因此，Python 并不限制你在应用程序中使用变量之前必须先声明它们。它允许你在需要的时候创建变量。\n\n\
  Python 有五种标准数据类型，用于定义可对它们执行的操作以及每种数据类型的存储方法。\n\n*   数字（Number）\n*   字符串（String）\n\
  *   列表（List）\n*   元组（Tuple）\n*   字典（Dictionary）\n\n等号（`=`）运算符用于给变量赋值，如代码清单 1-8 所示。\n\
  \n```\nIn [11]: age = 11\nname =\"Nour\"\ntall=100.50\nIn [12]: print (age)\nprint\
  \ (name)\nprint (tall)\n\nNour\n100.5\n代码清单 1-8\n赋值运算符\n```\n\n#### 多重赋值\n\nPython\
  \ 允许你在一条语句中给多个变量赋值，这也称为*多重赋值*。你可以给多个变量赋同一个值，也可以给多个变量赋多个不同的值，如代码清单 1-9 所示。\n\n```\n\
  In [13]:age= mark = code =25\nprint (age)\nprint (mark)\nprint (code)\n\nIn [14]:age,\
  \ mark, code=10,75,\"CIS2403\"\nprint (age)\nprint (mark)\nprint (code)\n\nCIS2403\n\
  代码清单 1-9\n多重赋值\n```\n\n#### 变量名与关键字\n\n*变量*是一个标识符，用于分配特定的内存空间并赋予一个在程序运行期间可能改变的值。变量名应能体现变量的用途，例如，如果你想为学生的年龄创建一个变量，可以将其命名为\
  \ `age` 或 `student_age`。变量名有许多规则和限制。变量命名中不允许使用特殊字符或空格。例如，变量名不能以任何特殊字符开头，也不能是 Python\
  \ 的保留关键字。以下示例展示了错误的命名：`{?age, 1age, age student, and, if, 1_age, etc}`。以下展示了正确的变量命名：`{age,\
  \ age1, age_1, if_age, etc}`。\n\n#### 语句与表达式\n\n*语句*是可由 Python 解释器执行以获取特定结果或执行特定任务的任何代码单元。程序包含一系列语句，每条语句在程序执行期间都有特定目的。*表达式*是值、变量和运算符的组合，由解释器求值以执行特定任务，如代码清单\
  \ 1-10 所示。\n\n```\nIn [16]:# 表达式\nx=0.6              # 语句\nx=3.9 * x * (1-x)  #\
  \ 表达式\nprint (round(x, 2))\n0.94\n代码清单 1-10\n表达式和语句形式\n```\n\n## Python 中的基本运算符\n\
  \n运算符是可以操作操作数值的构造。与不同的编程语言一样，Python 支持以下运算符：\n\n*   算术运算符\n*   关系运算符\n*   赋值运算符\n\
  *   逻辑运算符\n*   成员运算符\n*   身份运算符\n*   位运算符\n\n### 算术运算符\n\n表 1-2 展示了 Python 中算术运算符的示例。\n\
  \n**表 1-2** Python 算术运算符\n\n| 运算符 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- |\n\
  | `//` | 执行整除（返回除法后的整数值） | `print (13//5)` | 2 |\n| `+` | 执行加法 | `print (13+5)`\
  \ | 18 |\n| `-` | 执行减法 | `print (13-5)` | 8 |\n| `*` | 执行乘法 | `print (2*5)` | 10\
  \ |\n| `/` | 执行除法 | `print (13/5)` | 2.6 |\n| `%` | 返回除法后的余数（取模） | `print (13%5)`\
  \ | 3 |\n| `**` | 返回幂运算结果（乘方） | `print (2**3)` | 8 |\n\n### 关系运算符\n\n表 1-3 展示了 Python\
  \ 中关系运算符的示例。\n\n**表 1-3** Python 关系运算符\n\n| 运算符 | 描述 | 示例 | 输出 |\n| --- | --- |\
  \ --- | --- |\n| `<` | 小于 | `print (13<5)` | False |\n| `>` | 大于 | `print (13>5)`\
  \ | True |\n| `<=` | 小于或等于 | `print (13<=5)` | False |\n| `>=` | 大于或等于 | `print\
  \ (2>=5)` | False |\n| `==` | 等于 | `print (13==5)` | False |\n| `!=` | 不等于 | `print\
  \ (13! =5)` | True |\n\n### 赋值运算符\n\n表 1-4 展示了 Python 中赋值运算符的示例。\n\n**表 1-4** Python\
  \ 赋值运算符\n\n| 运算符 | 描述 | 示例 | 输出 |\n| --- | --- | --- | --- |\n| `=` | 赋值 | `x=10`\
  \ `print (x)` | 10 |\n| `/=` | 除后赋值 | `x=10; x/=2` `print (x)` | 5.0 |\n| `+=` |\
  \ 加后赋值 | `x=10; x+=7` `print (x)` | 17 |\n| `-=` | 减后赋值 | `x=10; x-=6` `print (x)`\
  \ | 4 |\n| `*=` | 乘后赋值 | `x=10; x*=5` `print (x)` | 50 |\n| `%=` | 取模后赋值 | `x=13;\
  \ x%=5` `print (x)` | 3 |\n| `**=` | 幂运算后赋值 | `x=10; x**=3` `print(x)` | 1000 |\n\
  | `//=` | 整除后赋值 | `x=10; x//=2` `print(x)` | 5 |\n\n### 逻辑运算符\n\n表 1-5 展示了 Python\
  \ 中逻辑运算符的示例。\n\n**表 1-5** Python 逻辑运算符\n\n| 运算符 | 描述 | 示例 | 输出 |\n| --- | --- |\
  \ --- | --- |\n| `and` | 逻辑与（当两个条件都为真时，输出为真） | `x=10>5 and 4>20` `print (x)` | False\
  \ |\n| `or` | 逻辑或（如果任一条件为真，输出即为真） | `x=10>5 or 4>20` `print (x)` | True |\n| `not`\
  \ | 逻辑非（对条件取反，即反转结果） | `x=not (10<4)` `print (x)` | True |\n\n一个 Python *程序* 是一系列旨在完成某项任务的\
  \ Python 语句序列。它可以是一行代码，也可以是数千行代码段，由计算机执行以完成特定任务。Python 语句会立即执行，而不会等待整个程序执行完毕。因此，Python\
  \ 是一种逐行执行的解释型语言。这与其他语言（如 C#）不同，C# 是一种需要处理整个程序的编译型语言。\n\n\n\n### Python 注释\n\nPython\
  \ 中有两种注释：单行注释和多行注释。\n\n`#` 符号用于单行注释。\n\n多行注释可以放在三引号内，如清单 1-11 所示。\n\n```\nIn [18]:\
  \ # Python 单行注释\nIn [19]: ''' 这是\n多行注释'''\n清单 1-11\nPython 注释形式\n```\n\n### 格式化字符串\n\
  \nPython 的特殊运算符 `%` 有助于创建格式化输出。该运算符接受两个操作数：一个格式化字符串和一个值。以下示例展示了如何以字符串格式传递一个字符串和值\
  \ `3.14259`。需要明确的是，该值可以是单个值、值的元组或值的字典。\n\n```\nIn [20]: print (\"pi=%s\"%\"3.14159\"\
  )\npi=3.14159\n```\n\n### 转换类型\n\n你可以使用不同的转换说明符语法来转换值，如表 1-6 所总结。\n\n表 1-6\n\n转换语法\n\
  \n| 语法 | 描述 |\n| --- | --- |\n| `%c` | 转换为单个字符 |\n| `%d`, `%i` | 转换为有符号十进制整数或长整数\
  \ |\n| `%u` | 转换为无符号十进制整数 |\n| `%e`, `%E` | 转换为指数记数法的浮点数 |\n| `%f` | 转换为定点十进制记数法的浮点数\
  \ |\n| `%g` | 转换为 `%f` 和 `%e` 中较短的值 |\n| `%G` | 转换为 `%f` 和 `%E` 中较短的值 |\n| `%o`\
  \ | 转换为八进制无符号整数 |\n| `%r` | 转换为使用 `repr()` 生成的字符串 |\n| `%s` | 转换为使用 `str()` 函数的字符串\
  \ |\n| `%x`, `%X` | 转换为十六进制无符号整数 |\n\n例如，转换说明符 `%s` 表示将值转换为字符串。因此，要在字符串输出中打印数值，你可以使用例如\
  \ `print(\"pi=%s\" % 3.14159)`。你可以在同一个字符串中使用多个转换，例如，转换为双精度、浮点数等。\n\n```\nIn [1]:print(\"\
  The value of %s is = %02f\" % (\"pi\", 3.14159))\nThe value of pi is = 3.141590\n\
  ```\n\n你可以使用点号 (`.`) 后跟一个正整数来指定精度。在以下示例中，你可以使用不同数据类型的元组，并将输出注入到字符串消息中：\n\n```\n\
  In [21]:print (\"Your name is %s, and your height is %.2f while your weight is %.2d\"\
  \ % ('Ossama', 172.156783, 75.56647))\nYour name is Ossama, and your height is 172.16\
  \ while your weight is 75\n```\n\n在前面的示例中，你可以看到 `%.2f` 被替换为值 `172.16`，小数点后保留两位小数，而\
  \ `%2d` 用于仅显示十进制值，但采用两位数字格式。\n\n你可以显示直接从字典中读取的值，如下所示，其中 `%(name)s` 表示将键 `Name` 的字典值作为字符串，`%(height).2f`\
  \ 表示将其作为带有两位小数的浮点数，即键 `height` 的字典值：\n\n```\nIn [23]:print (\"Hi %(Name)s, your\
  \ height is %(height).2f\" %{'Name':\"Ossama\", 'height': 172.156783})\nHi Ossama,\
  \ your height is 172.16\n```\n\n### 替换字段 `{}`\n\n你可以使用替换字段 `{}` 作为名称（或索引）。如果提供了索引，它就是字段中提供的参数列表的索引。索引不必按顺序排列；它们可以是随机顺序，例如索引\
  \ 0、1 和 2，或者索引 2、1 和 0。\n\n```\nIn [24]:x = \"price is\"\nprint (\"{1} {0} {2}\"\
  .format(x, \"The\", 1920.345))\nThe price is 1920.345\n```\n\n此外，你可以使用来自列表、字典、属性甚至单个变量的混合值。在以下示例中，你将创建一个名为\
  \ `A()` 的类，它有一个名为 `x` 的变量，赋值为 9。\n\n然后你从类 `A()` 创建一个名为 `w` 的实例（*对象*）。然后你打印从变量 `{0}`\
  \ 索引的值，以及从值列表 `[\"a,\" \"or,\" \"is\"]` 中索引的 `{1[2]}` 值，其中 1 指的是打印索引，2 指的是给定列表中的索引（字符串索引为\
  \ 0）。`{2[test]}` 指的是打印字符串中的索引 2，并从传递的字典中通过键 `test` 读取其值。最后，`{3.x}` 指的是第三个索引，它从 `w`\
  \ 获取值，`w` 是类 `A()` 的一个实例。\n\n```\nIn [34]:class A():x=9 w=A()\nprint (\"{0} {1[2]}\
  \ {2[test]} {3.x}\".format(\"This\", [\"a\", \"or\", \"is\"], {\"test\": \"another\"\
  },w))\nThis is another 9\nIn [34]:print (\"{1[1]} {0} {1[2]} {2[test]}{3.x}\".format(\"\
  This\", [\"a\", \"or\", \"is\"], {\"test\": \"another\"},w))\nor This is another\
  \ 9\n```\n\n### 日期和时间模块\n\nPython 提供了一个 time 包来处理日期和时间。你可以使用内置方法检索当前日期和时间，并操作日期和时间。\n\
  \n清单 1-12 中的示例导入了 time 包，并调用其 `.localtime()` 函数来检索当前日期和时间。\n\n```\nIn [42]:import\
  \ time localtime = time.asctime(time.localtime(time.time()))\nprint (\"Formatted\
  \ time :\", localtime)\nprint(time.localtime())\nprint (time.time())\nFormatted\
  \ time : Fri Aug 17 19:12:07 2018\ntime.struct_time(tm_year=2018, tm_mon=8, tm_mday=17,\
  \ tm_hour=19, tm_min=12, tm_sec=7, tm_wday=4, tm_yday=229, tm_isdst=0)\n1534533127.8304486\n\
  清单 1-12\n时间方法\n```\n\n### 时间模块方法\n\nPython 提供了各种内置的时间函数，如表 1-7 所示，可用于与时间相关的目的。\n\
  \n表 1-7\n\n内置时间方法\n\n| 方法 | 描述 |\n| --- | --- |\n| `time()` | 返回自 1970 年 1 月 1 日以来的秒数。\
  \ |\n| `asctime(time)` | 返回一个 24 字符的字符串，例如 Sat Jun 16 21:27:18 2018。 |\n| `sleep(time)`\
