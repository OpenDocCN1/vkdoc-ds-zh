- '# 6. 数据探索与分析


  如今，每天都会收集海量数据并分发到各种渠道。这需要高效且灵活的数据分析工具。Python 的开源 Pandas 库填补了这一空白，并处理三种不同的数据结构：序列、数据框和面板。*序列*是一维数据结构，例如字典、数组、列表、元组等。*数据框*是包含异构数据类型的二维数据结构，即表格数据。*面板*指的是三维数据结构，例如三维数组。需要明确的是，高维数据结构是其低维数据结构的容器。换句话说，面板是数据框的容器，而数据框是序列的容器。


  ## 序列数据结构


  如前所述，序列是一维数据的序列，例如字典、列表、数组、元组等。


  ### 创建序列


  Pandas 提供了一个 `Series()` 方法，用于创建序列结构。大小为 `n` 的序列结构应具有长度为 `n` 的索引。默认情况下，Pandas 创建从
  0 开始到 `n`-1 结束的索引。可以使用构造函数 `pandas.Series(data, index, dtype, copy)` 创建 Pandas 序列，其中
  `data` 可以是数组、常量、列表等。序列 `index` 应该是唯一的、可哈希的，并且长度为 `n`，而 `dtype` 是一种数据类型，可以显式声明或从接收到的数据中推断。清单
  6-1 创建了一个具有默认索引和自定义索引的序列。


  ```

  In [5]: import pandas as pd

  import numpy as np

  data = np.array([''O'',''S'',''S'',''A''])

  S1 = pd.Series(data) # 不添加索引

  S2 = pd.Series(data,index=[100,101,102,103]) # 添加索引 print (S1) print ("\n") print
  (S2)

  0    O

  1    S

  2    S

  3    A

  dtype: object

  100  O

  101  S

  102  S

  103  A

  dtype: object

