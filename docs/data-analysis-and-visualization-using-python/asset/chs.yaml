- "# 3. 数据收集结构\n\n列表、字典、元组、序列、数据框和面板是 Python 的数据收集结构，可用于维护数据集合。本章将通过实际示例详细演示这些不同的结构。\n\
  \n## 列表\n\n*列表*是任何数据类型的值的序列，可以向前或向后访问。每个值称为一个*元素*或*列表项*。列表是可变的，这意味着当你修改一个列表元素时，你不会创建一个新列表。元素按给定顺序存储。可以对列表执行各种操作，例如插入、排序和删除。可以通过存储由逗号分隔的不同类型值的序列来创建列表。Python\
  \ 列表用方括号（`[]`）括起来，元素基于起始索引 0 存储在索引中。\n\n### 创建列表\n\n你可以拥有字符串值和整数的列表、空列表以及嵌套列表（即列表中的列表）。清单\
  \ 3-1 展示了如何创建列表。\n\n```\nIn [1]: # Create List\nList1 = [1, 24, 76]\nprint (List1)\n\
  colors=['red', 'yellow', 'blue']\nprint (colors)\nmix=['red', 24, 98.6]\nprint (mix)\n\
  nested= [ 1, [5, 6], 7]\nprint (nested)\nprint ([])\n[1, 24, 76]\n['red', 'yellow',\
  \ 'blue']\n['red', 24, 98.6]\n[1, [5, 6], 7]\n[]\n清单 3-1\n创建列表\n```\n\n\n\n### 访问列表中的值\n\
  \n你可以向前或向后访问列表元素。例如，在代码清单 3-2 中，`list2[3:]` 返回从索引 3 开始到列表末尾的元素，因为 `list2` 有四个元素，其中\
  \ `[4,5]` 是索引 3 的元素，它是以嵌套列表的形式存在的。因此，`print(list2[3:])` 的结果是 `[[4,5]]`。你也可以使用负索引向后访问列表元素。例如，`list3[-3]`\
  \ 将返回向后序列 `n-3` 中的第三个元素，即索引 1。示例如下：\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Figa_HTML.jpg](img/472943_1_En_3_Figa_HTML.jpg)\n\
  \n```\nIn [9]: list1 = ['Egypt', 'chemistry', 2017, 2018]\nlist2 = [1, 2, 3, [4,\
  \ 5] ]\nlist3 = [\"a\", 3.7, '330', \"Omar\"]\nprint (list1[2])\nprint (list2 [3:])\n\
  print (list3 [-3:-1])\nprint (list3[-3])\n\n[[4, 5]]\n[3.7, '330']\n3.7\n代码清单 3-2\n\
  访问列表\n```\n\n### 添加和更新列表\n\n你可以通过将切片放在赋值运算符的左侧来更新列表的单个或多个元素，并且可以使用 `append()` 方法向列表添加元素，如代码清单\
  \ 3-3 所示。\n\n```\nIn [50]: courses=[\"OOP\",\"Networking\",\"MIS\",\"Project\"]\
  \ students=[\"Ahmed\", \"Ali\",\n\"Salim\", \"Abdullah\", \"Salwa\"] OOP_marks =\
  \ [65, 85, 92]\nOOP_marks.append(50)    # 添加新元素\nOOP_marks.append(77)    # 添加新元素\n\
  print (OOP_marks[ : ])  # 更新前打印列表\nOOP_marks[0]=70         # 更新新元素\nOOP_marks[1]=45\
  \         # 更新新元素\nlist1 = [88, 93]\nOOP_marks.extend(list1) # 用另一个列表扩展列表\nprint\
  \ (OOP_marks[ : ])  # 更新后打印列表\n[65, 85, 92, 50, 77]\n[70, 45, 92, 50, 77, 88, 93]\n\
  代码清单 3-3\n添加和更新列表元素\n```\n\n如代码清单 3-3 所示，你可以使用 `append()` 方法向列表添加新元素。你也可以通过使用列表名和元素索引来更新列表中的元素。例如，`OOP_marks[1]=45`\
  \ 将索引 1 的值从 85 更改为 45。\n\n### 删除列表元素\n\n要移除一个列表元素，你可以使用 `del` 语句在元素索引处删除它，或者使用 `remove()`\
  \ 方法通过列表中的元素值来移除该元素。如果你使用 `remove()` 方法移除一个在列表中出现多次的元素，它只会移除该元素在列表中的第一次出现。此外，你还可以使用\
  \ `pop()` 方法通过其索引值移除特定元素，如代码清单 3-4 所示。\n\n```\nIn [48]: OOP_marks = [70, 45, 92,\
  \ 50, 77, 45]\nprint (OOP_marks)\ndel OOP_marks[0] # 使用 del 删除一个元素\nprint (OOP_marks)\n\
  OOP_marks.remove (45) # 使用 remove() 方法移除一个元素\nprint (OOP_marks)\nOOP_marks.pop (2)\
  \ # 使用 pop() 方法移除一个元素\nprint (OOP_marks)\n[70, 45, 92, 50, 77, 45]\n[45, 92, 50,\
  \ 77, 45]\n[92, 50, 77, 45]\n[92, 50, 45]\n代码清单 3-4\n从列表中删除元素\n```\n\n### 基本列表操作\n\
  \n与字符串处理类似，列表响应 `+` 和 `*` 运算符作为连接和重复，不同之处在于结果是一个新列表，如代码清单 3-5 所示。\n\n```\nIn [46]:print\
  \ (len([5, \"Omar\", 3]))      # 查找列表长度。\nprint ([3, 4, 1] + [\"Omar\", 5, 6]) #\
  \ 连接列表。\nprint (['Eg!'] * 4)  # 在列表中重复一个元素。\nprint (3 in [1, 2, 3])     # 检查元素是否在列表中\n\
  for x in [1, 2, 3]:\nprint (x, end=' ') # 遍历列表元素\n\n[3, 4, 1, 'Omar', 5, 6]\n['Eg!',\
  \ 'Eg!', 'Eg!', 'Eg!']\nTrue\n1 2 3\n代码清单 3-5\n列表操作\n```\n\n### 索引、切片和矩阵\n\n列表是一系列带索引的元素，可以向前或向后访问。因此，你可以使用正索引或负（向后）索引来读取它们的元素，如代码清单\
  \ 3-6 所示。\n\n```\nIn [9]:list1 = ['Egypt', 'chemistry', 2017, 2018]\nlist2 = [1,\
  \ 2, 3, [4, 5]]\nlist3 = [\"a\", 3.7, '330', \"Omar\"]\nprint (list1[2])\nprint\
  \ (list2 [3:])\nprint (list3 [-3:-1])\nprint (list3[-3])\n\n[[4, 5]]\n[3.7, '330']\n\
  3.7\n代码清单 3-6\n索引和切片列表元素\n```\n\n### 内置列表函数和方法\n\n各种函数和方法可用于列表处理，如表 3-1 所示。\n\n\
  表 3-1\n\n列表函数\n\n| **序号** | **函数** | **描述** |\n| --- | --- | --- |\n| 1 | `cmp(list1,\
  \ list2)` | 比较两个列表的元素 |\n| 2 | `len(list1)` | 给出列表的总长度 |\n| 3 | `max(list1)` | 从列表中返回具有\
  \ `max` 值的项 |\n| 4 | `min(list1)` | 从列表中返回具有 `min` 值的项 |\n| 5 | `list(seq)` | 将元组转换为列表\
  \ |\n\n#### 列表函数\n\n内置函数简化了列表处理。下表显示了可用于操作列表的函数和方法。例如，你可以简单地使用 `cmp()` 来比较两个列表，如果两者相同，则返回\
  \ `TRUE`；否则，返回 `FALSE`。你可以使用 `len()` 方法查找列表大小。此外，你可以分别使用 `min()` 和 `max()` 方法查找列表中的最小值和最大值。示例请参见代码清单\
  \ 3-7。\n\n```\nIn [51]: #内置函数和列表\ntickets = [3, 41, 12, 9, 74, 15]\nprint (tickets)\n\
  print (len(tickets))\nprint (max(tickets))\nprint (min(tickets))\nprint (sum(tickets))\n\
  print (sum(tickets)/len(tickets))\n[3, 41, 12, 9, 74, 15]\n\n25.666666666666668\n\
  代码清单 3-7\n应用列表函数的 Python 脚本\n```\n\n#### 列表方法\n\n内置方法简化了列表编辑。表 3-2 显示，你可以简单地使用 `append()`、`insert()`\
  \ 和 `extend()` 向列表添加新元素。`pop()` 和 `remove()` 方法用于从列表中移除元素。表 3-2 总结了一些你可以应用于已创建列表的方法。\n\
  \n表 3-2\n\n内置列表方法\n\n| **序号** | **方法** | **描述** |\n| --- | --- | --- |\n| 1 | `list.append(obj)`\
  \ | 将对象 `obj` 追加到列表 |\n| 2 | `list.count(obj)` | 返回 `obj` 在列表中出现的次数 |\n| 3 | `list.extend(seq)`\
  \ | 将 `seq` 的内容追加到列表 |\n| 4 | `list.index(obj)` | 返回 `obj` 在列表中出现的最低索引 |\n| 5 |\
  \ `list.insert(index, obj)` | 将对象 `obj` 插入到列表的偏移索引处 |\n| 6 | `list.pop(obj=list[-1])`\
  \ | 移除并返回列表中的最后一个对象或 `obj` |\n| 7 | `list.remove(obj)` | 从列表中移除对象 `obj` |\n| 8 |\
  \ `list.reverse()` | 原地反转列表中的对象 |\n| 9 | `list.sort([func])` | 对列表中的对象进行排序；如果给定，则使用比较函数\
  \ `func` |\n\n### 列表排序与遍历\n\n列表排序很重要，特别是对于列表搜索目的。你可以从序列创建列表；此外，你可以使用迭代语句对列表元素进行排序和遍历以进行处理，如代码清单\
  \ 3-8 所示。\n\n```\nIn [58]: #列表排序与遍历\nseq=(41, 12, 9, 74, 3, 15) # 使用序列创建列表\ntickets=list(seq)\n\
  print (tickets)\ntickets.sort()\nprint (tickets)\nprint (\"\\n 排序后的列表元素 \")\nfor\
  \ ticket in tickets:\nprint (ticket)\n[41, 12, 9, 74, 3, 15]\n[3, 9, 12, 15, 41,\
  \ 74]\n排序后的列表元素\n\n代码清单 3-8\n列表排序与遍历\n```\n\n\n\n### 列表与字符串\n\n你可以将字符串拆分为字符列表。此外，还可以使用\
  \ `split()` 方法将字符串拆分为单词列表。`split()` 方法的默认分隔符是空格。不过，你可以指定哪些字符作为单词边界。例如，你可以使用连字符作为分隔符，如清单\
  \ 3-9 所示。\n\n```\nIn [63]: # 将字符串转换为字符列表\nWord = 'Egypt'\nList1 = list(Word)\nprint\
  \ (List1)\n['E', 'g', 'y', 'p', 't']\nIn [69]: # 使用分隔符\nGreeting= 'Welcome-to-Egypt'\n\
  List2 =Greeting.split(\"-\")\nprint (List2)\nGreeting= 'Welcome-to-Egypt'\ndelimiter='-'\n\
  List2 =Greeting.split(delimiter)\nprint (List2)\n['Welcome', 'to', 'Egypt']\n['Welcome',\
  \ 'to', 'Egypt']\nIn [70]: # 我们可以使用 split 方法将字符串拆分为单词\nGreeting= 'Welcome to Egypt'\n\
  List2 =Greeting.split()\nprint (List2)\nprint (List2[2])\n['Welcome', 'to', 'Egypt']\n\
  Egypt\n清单 3-9\n将字符串转换为字符或单词列表\n```\n\n`join()` 方法是 `split()` 方法的逆操作（参见清单 3-10）。它接收一个字符串列表并将元素连接起来。你必须指定\
  \ `join()` 方法在列表元素之间添加的分隔符，以形成一个字符串。\n\n```\nIn [73]: List1 = ['Welcome', 'to',\
  \ 'Egypt']\ndelimiter = ' '\ndelimiter.join(List1)\nOut[73]: 'Welcome to Egypt'\n\
  In [74]: List1 = ['Welcome', 'to', 'Egypt']\ndelimiter = '-'\ndelimiter.join(List1)\n\
  Out[74]: 'Welcome-to-Egypt'\n清单 3-10\n使用 join() 方法\n```\n\n### 解析行\n\n你可以从文件中读取文本数据，并将其转换为单词列表以供进一步处理。图\
  \ 3-1 展示了如何读取 `myfile.txt`，逐行解析，并将数据转换为单词列表。\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Fig1_HTML.jpg](img/472943_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n解析文本行\n\n在前面的例子中，你可以只提取联系人的年份或电子邮件，如图 3-2 所示。\n\n![../images/472943_1_En_3_Chapter/472943_1_En_3_Fig2_HTML.jpg](img/472943_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n通过列表从文本文件中提取特定数据\n\n### 别名\n\n如果不小心使用，赋值运算符是危险的。变量与对象的关联称为*引用*。此外，拥有多个引用和多个名称的对象称为*别名*。清单\
  \ 3-11 演示了赋值运算符的使用。假设你有一个名为 `a` 的列表。如果 `a` 引用一个对象，并且你赋值 `b = a`，那么变量 `a` 和 `b` 都引用同一个对象，对\
  \ `a` 执行的操作将自动适用于 `b`。\n\n清单 3-11\n\n别名对象\n\n| **有别名** | **无别名** |\n| --- | ---\
  \ |\n| `In [117]:a = [1, 2, 3]`         `b = a`          `print (a)`          `print\
  \ (b)` | `In [120]:a = [1, 2, 3]``b = [1, 2, 3]``print (a)``print (b)` |\n|          `[1,\
  \ 2, 3]`         `[1, 2, 3]` | `[1, 2, 3]``[1, 2, 3]` |\n| `In [118]:a.append(77)`         `print\
  \ (a)`          `print (b)` | `In [121]:a.append(77)``print (a)``print (b)` |\n\
  |           `[1, 2, 3, 77]`          `[1, 2, 3, 77]` | `[1, 2, 3, 77]``[1, 2, 3]`\
  \ |\n| `In [119]: b is a` | `In [122]: b is a` |\n| `Out[119]: True` | `Out[122]:\
  \ False` |\n\n## 字典\n\n*字典*是一个无序的键值对集合；每个键与其值之间用冒号（`:`）分隔。项（键值对）之间用逗号分隔，整个集合用花括号（`{}`）括起来。实际上，空字典只用花括号表示。字典的键应该是唯一的，并且应该是不可变的数据类型，例如字符串、整数等。字典的值可以重复多次，并且值可以是任何数据类型。它是键和值之间的映射；你可以使用\
  \ `dict()` 方法创建字典。\n\n### 创建字典\n\n你可以直接创建字典并分配键值对。此外，你也可以先创建一个空字典，然后为每个生成的键赋值，如清单\
  \ 3-12 所示。\n\n```\nIn [36]: Prices = {\"Honda\":40000, \"Suzuki\":50000, \"Mercedes\"\
  :85000, \"Nissan\":35000, \"Mitsubishi\": 43000}\nprint (Prices)\n{'Honda': 40000,\
  \ 'Suzuki': 50000, 'Mercedes': 85000, 'Nissan': 35000, 'Mitsubishi': 43000}\nIn\
  \ [37]: Staff_Salary = { 'Omar Ahmed' : 30000 , 'Ali Ziad' : 24000,\n'Ossama Hashim':\
  \ 25000, 'Majid Hatem':10000}\nprint(Staff_Salary)\nSTDMarks={\"Salwa Ahmed\":50,\
  \ \"Abdullah Mohamed\":80, \"Sultan Ghanim\":90}\nprint(STDMarks)\n{'Omar Ahmed':\
  \ 30000, 'Ali Ziad': 24000, 'Ossama Hashim': 25000, 'Majid Hatem': 10000}\n{'Salwa\
  \ Ahmed': 50, 'Abdullah Mohamed': 80, 'Sultan Ghanim': 90}\nIn [38]:STDMarks = dict()\n\
  STDMarks['Salwa Ahmed']=50\nSTDMarks['Abdullah Mohamed']=80\nSTDMarks['Sultan Ghanim']=90\n\
  print (STDMarks)\n{'Salwa Ahmed': 50, 'Abdullah Mohamed': 80, 'Sultan Ghanim': 90}\n\
  清单 3-12\n创建字典\n```\n\n### 更新和访问字典中的值\n\n一旦创建了字典，你就可以更新和访问其值以进行任何进一步的处理。清单 3-13 展示了你可以添加一个新项\
  \ `STDMarks['Omar Majid'] = 74`，其中 `Omar Majid` 是键，74 是映射到该键的值。此外，你还可以更新键 `Salwa\
  \ Ahmed` 的现有值。\n\n```\nIn [39]: STDMarks={\"Salwa Ahmed\":50, \"Abdullah Mohamed\"\
  :80, \"Sultan\nGhanim\":90}\nSTDMarks['Salwa Ahmed'] = 85 # 更新键 'Salwa Ahmed' 的当前值\n\
  STDMarks['Omar Majid'] = 74 # 向字典添加一个新项\nprint (STDMarks)\n{'Salwa Ahmed': 85, 'Abdullah\
  \ Mohamed': 80, 'Sultan Ghanim': 90, 'Omar Majid': 74}\n清单 3-13\n更新字典并向字典添加新项\n\
  ```\n\n你可以直接访问字典中的任何元素，或者遍历所有字典元素，如清单 3-14 所示。\n\n```\nIn [2]: Staff_Salary = {\
