  e\ne to Higher Co Welcome to H\nlcome to Higher Colleges of Technology Welcome to\
  \ Higher Colleges of Technology\nWelcome to Higher Colleges of Technology\n代码清单\
  \ 1-25\n字符串的迭代与切片\n```\n\n### Python 字符串函数与方法\n\n有许多内置的方法和函数可用于字符串处理；表 1-14 列出了这些方法。\n\
  \n**表 1-14** 内置字符串方法\n\n| 方法/函数 | 描述 |\n| --- | --- |\n| `capitalize()` | 将字符串的第一个字符大写。\
  \ |\n| `count(string,begin,end)` | 统计子字符串在字符串中从起始索引到结束索引之间出现的次数。 |\n| `endswith(suffix,\
  \ begin=0,end=n)` | 如果字符串以给定的后缀结尾（在起始和结束索引之间），则返回布尔值`True`。 |\n| `find(substring,\
  \ beginIndex, endIndex)` | 返回子字符串在字符串中从起始索引到结束索引之间首次出现的索引值。 |\n| `index(subsring,\
  \ beginIndex, endIndex)` | 如果未找到字符串则抛出异常，其他功能与`find()`方法相同。 |\n| `isalnum()` | 如果字符串中的字符都是字母数字（即字母或数字）且至少有一个字符，则返回`True`；否则返回`False`。\
  \ |\n| `isalpha()` | 如果所有字符都是字母且至少有一个字符，则返回`True`；否则返回`False`。 |\n| `isdigit()`\
