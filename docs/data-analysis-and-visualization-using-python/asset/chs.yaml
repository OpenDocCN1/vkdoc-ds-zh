- "# 1. 使用 Python 进行数据科学入门\n\n数字数据量正以惊人的速度增长，每两年翻一番，并改变着我们的生活方式。据估计，到 2020 年，地球上每个人每秒钟将产生约\
  \ 1.7MB 的新数据。这意味着我们需要拥有技术工具、算法和模型，来清理、处理和理解不同形式的可用数据，以便进行决策。*数据科学*是一个涵盖与清理、准备和分析非结构化、半结构化和结构化数据相关所有内容的领域。这门科学结合了统计学、数学、编程、问题解决和数据采集，从数据中提取洞察和信息。\n\
  \n## 数据科学的阶段\n\n图 1-1 展示了数据科学领域的不同阶段。数据科学家使用诸如 `Python`、`R`、`SAS`、`Java`、`Perl`\
  \ 和 `C/C++` 等编程工具，从准备好的数据中提取知识。为了提取这些信息，他们采用基于机器学习算法、统计学和数学方法的各种适用模型。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig1_HTML.png](img/472943_1_En_1_Fig1_HTML.png)\n\
  \n图 1-1\n\n数据科学项目阶段\n\n数据科学算法应用于诸多产品中，例如互联网搜索引擎，以在更短时间内为搜索查询提供最佳结果；推荐系统，利用用户经验生成推荐；数字广告；教育系统；医疗系统等等。数据科学家应深入了解诸如\
  \ `Python`、`R`、`SAS`、`Hadoop` 平台和 `SQL` 数据库等编程工具；熟悉诸如 `JSON`、`XML`、`HTML` 等半结构化格式。此外，还需掌握处理非结构化数据的知识。\n\
  \n## 为什么选择 Python？\n\n`Python` 是一种动态、通用的编程语言，应用于各个领域。`Python` 可用于从一次性脚本到提供 24/7\
  \ 不间断服务的大型可扩展 Web 服务器等各种场景。它用于 GUI 和数据库编程、客户端和服务器端 Web 编程以及应用程序测试。科学家用它为世界上最快的超级计算机编写应用程序，儿童也用它初次学习编程。它最初由\
  \ Guido van Rossum 在 20 世纪 90 年代初开发，现在由非营利组织 Python 软件基金会管理，并得到微软、谷歌等公司的赞助。\n\n\
  `Python` 的第一个版本于 1991 年发布。`Python` 目前处于 `3.x` 版本，该版本于 2011 年 2 月经过长期测试后发布。其许多主要特性也已向后移植到兼容的\
  \ `Python 2.6`、`2.7` 和 `3.6` 版本。\n\n### Python 的基本特性\n\n`Python` 提供了众多特性；以下是一些重要特性：\n\
  \n*   *易于学习和使用*：`Python` 使用优雅的语法，使程序易于阅读。它开发者友好，是一种高级编程语言。\n\n*   *表达力强*：`Python`\
  \ 语言表达力强，这意味着它比其他语言更易于理解和阅读。\n\n*   *解释型*：`Python` 是一种解释型语言。换句话说，解释器逐行执行代码。这使得调试变得容易，因此适合初学者。\n\
  \n*   *跨平台*：`Python` 可以在 Windows、Linux、Unix、Macintosh 等不同平台上同样良好地运行。因此，`Python`\
  \ 是一种可移植语言。\n\n*   *免费且开源*：`Python` 语言可在 [`www.python.org`](http://www.python.org)\
  \ 免费获取。其源代码也可获得。\n\n*   *面向对象*：`Python` 是一种面向对象的语言，具有类和对象的概念。\n\n*   *可扩展*：通过添加用编译语言（如\
  \ `C` 或 `C++`）实现的新模块，可以轻松扩展 `Python`，这些模块可用于编译代码。\n\n*   *大型标准库*：它附带一个大型标准库，支持许多常见编程任务，例如连接\
  \ Web 服务器、使用正则表达式搜索文本以及读取和修改文件。\n\n*   *GUI 编程支持*：可以使用 `Python` 开发图形用户界面。\n\n* \
  \  *可集成*：它可以轻松地与 `C`、`C++`、`Java` 等语言集成。\n\n\n\n### Python 学习资源\n\n众多优秀的 Python\
  \ 资源可供不同学习阶段的 Python 学习者使用。虽然资源数量庞大，但想要全部找到却并非易事。以下是最通用的 Python 资源，并附有它们为学习者提供的内容说明：\n\
  \n-   *《Python 练习册》*是一本 Python 练习题集，旨在帮助你掌握基本的语言语法。（参见 [`https://anandology.com/python-practice-book/index.html`](https://anandology.com/python-practice-book/index.html)。）\n\
  -   *《敏捷 Python 编程：人人适用》* 提供了 Python 编程作为敏捷工具的实践演示，适用于数据清洗、集成、分析和可视化，适合学术界人士、专业人士和研究人员。（参见\
  \ [`http://www.lulu.com/shop/ossama-embarak/agile-python-programming-applied-for-everyone/paperback/product-23694020.html`](https://www.lulu.com/shop/ossama-embarak/agile-python-programming-applied-for-everyone/paperback/product-23694020.html)。）\n\
  -   “Python 速成课”精彩地概述了 Python 的历史、驱动编程社区的因素以及示例代码。你可能需要结合其他资源来阅读，才能真正掌握语法，但它是随着你持续学习而值得反复阅读的优秀资源。（参见\
  \ [`https://www.grahamwheeler.com/posts/python-crash-course.html`](https://www.grahamwheeler.com/posts/python-crash-course.html)。）\n\
  -   “Python 简明教程”是一份面向初学者的 Python 语言教程。（参见 [`https://python.swaroopch.com/`](https://python.swaroopch.com/)。）\n\
  -   O'Reilly 出版的书籍 *《像计算机科学家一样思考 Python》* 在网络上以 HTML 格式免费提供。（参见 [`https://greenteapress.com/wp/think-python/`](https://greenteapress.com/wp/think-python/)。）\n\
  -   *《为你我而写的 Python》* 是一本通俗易懂的书籍，包含 Python 语法和主要语言结构的章节。该书末尾还附有一份简短指南，教程序员编写他们的第一个\
  \ Flask Web 应用程序。（参见 [`https://pymbook.readthedocs.io/en/latest/`](https://pymbook.readthedocs.io/en/latest/)。）\n\
  -   Code Academy 为完全编程新手提供了 Python 学习路径。（参见 [`www.codecademy.com/catalog/language/python`](https://www.codecademy.com/catalog/language/python)。）\n\
  -   *《Python 编程入门》* 介绍了 Python 的基本语法和控制结构。这本免费书籍为每个主题提供了大量代码示例。（参见 [`www.opentechschool.org/`](https://www.opentechschool.org/)。）\n\
  -   如果你想成为一名专业程序员，Google 整理了一份极好的学习材料汇编。这些资源不仅对 Python 初学者有用，对任何希望在软件领域拥有强大职业生涯的开发者都很有帮助。（参见\
  \ [`techdevguide.withgoogle.com`](https://techdevguide.withgoogle.com)。）\n-   正在寻找通过项目学习编程的灵感？请查看\
  \ [`knightlab.northwestern.edu`](https://knightlab.northwestern.edu) 上为 Python 初学者准备的五个编程项目。\n\
  -   Udacity 上有一门由 Reddit 创始人之一讲授的课程，展示了如何使用 Python 构建博客。这是对 Web 开发概念的极好介绍。（参见 [`mena.udacity.com`](https://mena.udacity.com)。）\n\
  \n## Python 环境与编辑器\n\n有许多集成开发环境（IDE）可用于创建 Python 脚本。\n\n### 便携式 Python 编辑器（无需安装）\n\
  \n这些编辑器无需安装：\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig2_HTML.jpg](img/472943_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\nAnaconda Navigator\n\n-   *Azure Jupyter Notebooks*：开源 Jupyter Notebooks\
  \ 由微软开发，作为分析和机器学习的分析平台。\n-   *Python(x,y)*：Python(x,y) 是一款免费的科研与工程开发应用程序，基于 Python\
  \ 编程语言、Qt 图形用户界面和 Spyder 交互式科学开发环境，用于数值计算、数据分析和数据可视化。\n-   *WinPython*：这是一个适用于 Windows\
  \ 平台的免费 Python 发行版；它包含了用于 ScientificPython 的预构建包。\n-   *Anaconda*：这是一个完全免费、可用于企业级应用的\
  \ Python 发行版，适用于大规模数据处理、预测分析和科学计算。\n-   *PythonAnywhere*：PythonAnywhere 让在云端创建和运行\
  \ Python 程序变得简单。你可以在基于 Web 的编辑器中编写程序，或者在任何现代 Web 浏览器中运行控制台会话。\n-   *Anaconda Navigator*：这是\
  \ Anaconda 发行版中包含的一个桌面图形用户界面（GUI），允许你启动应用程序并轻松管理 Anaconda 包（如图 1-2 所示）、环境和频道，而无需使用命令行。Navigator\
  \ 可以在 Anaconda 云或本地 Anaconda 仓库中搜索包。它适用于 Windows、macOS 和 Linux。\n\n以下部分将演示如何设置和使用\
