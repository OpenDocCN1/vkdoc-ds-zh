  From: cwen@iupui.edu\nFrom: cwen@iupui.edu\n```\n清单 4-7：提取以特定模式开头的行\n\n虽然正则表达式对于从文本中提取数据很有用，但应谨慎使用。清单\
  \ 4-9 中的正则表达式查找所有以大写字母 *X* 开头、后跟零个或多个任意字符、并以冒号（`:`）结尾的文本。\n\n```python\nIn [48]:\
  \ import re\nprint(\"\\nRegular Expressions\\n'^X.*:' \\n\")\nhand = open('Data.txt')\n\
  for line in hand:\n    line = line.rstrip()\n    y = re.findall('^X.*:', line)\n\
  \    print(y)\n```\n清单 4-9：正则表达式示例\n\n这是一个用于维护文本数据的文本文件，我们用它来应用正则表达式，如下所示。\n\n![../images/472943_1_En_4_Chapter/472943_1_En_4_Figb_HTML.jpg](img/472943_1_En_4_Figb_HTML.jpg)\n\
  \n在以下代码中，表达式 `'^X.*:'` 检索所有以大写字母 *X* 开头、后跟零个或多个任意字符（包括空格）、并以冒号分隔符（`:`）结尾的行。然而，它没有考虑空白字符。清单\
  \ 4-10 仅检索匹配模式中不包含空白字符的值。\n\n```python\nIn [49]: print(\"\\nRegular Expressions\\\
  nWild-Card Characters '^X-\\S+:'\\n\")\nhand = open('Data.txt')\nfor line in hand:\n\
  \    line = line.rstrip()\n    y = re.findall('^X-\\S+:', line)  # 匹配任何非空白字符\n \
  \   print(y)\n```\n```\nRegular Expressions\nWild-Card Characters 'X-\\S+:'\n['X-Sieve:']\n\
  ['X-DSPAM-Result:']\n['X-DSPAM-Confidence:']\n[]\n[]\n```\n清单 4-10：提取非空白模式\n\n```\n\
  'X.*:'\n['X-Sieve:']\n['X-DSPAM-Result:']\n['X-DSPAM-Confidence:']\n['X- Content-Type-Message-Body:']\n\
  ['X-Plane is behind schedule:']\n```\n\n正则表达式使您能够提取字符串中的数值，并在字符串中查找特定的字符模式，如清单 4-11\
  \ 所示。\n\n```python\nIn [50]: print(\"\\n Matching and Extracting Data \\n\")\nx\
  \ = 'My 2 favorite numbers are 19 and 42'\ny = re.findall('[0-9]+', x)\nprint(y)\n\
  ```\n```\nMatching and Extracting Data\n['2', '19', '42']\n```\n```python\nIn [51]:\
  \ y = re.findall('[AEsOUn]+', x)  # 在字符串中查找这些字符中的任意一个\nprint(y)\n```\n```\n['n',\
  \ 's', 'n']\n```\n清单 4-11：提取数值和特定字符\n\n虽然正则表达式对于提取数据很有用，但应谨慎实现。以下示例展示了贪婪提取和非贪婪提取。在清单\
  \ 4-12 的第一个示例中，Python 查找以 *F* 开头、包含任意数量字符直到冒号的字符串，并在到达行尾时停止。这就是为什么即使找到第一个冒号，它也会继续检索字符。在第二个示例中，`re.findall('^F.+?:',\
  \ x)` 要求 Python 检索以 *F* 开头、以分隔符（即冒号）第一次出现位置结尾的字符，无论是否到达行尾。\n\n```python\nIn [52]:\
  \ print(\"\\nGreedy Matching \\n\")\nx = 'From: Using the : character'\ny = re.findall('^F.+:',\
  \ x)\nprint(y)\n```\n```\nGreedy Matching\n['From: Using the :']\n```\n```python\n\
  In [53]: print(\"\\nNon-Greedy Matching \\n\")\nx = 'From: Using the : character'\n\
  y = re.findall('^F.+?:', x)\nprint(y)\n```\n```\nNon-Greedy Matching\n['From:']\n\
  ```\n清单 4-12：贪婪匹配与非贪婪匹配\n\n表 4-4 展示了正则表达式的各种实现。\n\n**表 4-4** 正则表达式示例\n\n| 序号 | 示例\
  \ | 描述 |\n| --- | --- | --- |\n| 1 | `[Pp]ython` | 匹配 `\"Python\"` 或 `\"python\"\
  ` |\n| 2 | `rub[ye]` | 匹配 `\"ruby\"` 或 `\"rube\"` |\n| 3 | `[aeiou]` | 匹配任意一个小写元音字母\
  \ |\n| 4 | `[0-9]` | 匹配任意一个数字；等同于 `[0123456789]` |\n| 5 | `[a-z]` | 匹配任意一个小写 ASCII\
  \ 字母 |\n| 6 | `[A-Z]` | 匹配任意一个大写 ASCII 字母 |\n| 7 | `[a-zA-Z0-9]` | 匹配上述任意字符 |\n\
  | 8 | `[^aeiou]` | 匹配除小写元音字母外的任意字符 |\n| 9 | `[⁰-9]` | 匹配除数字外的任意字符 |\n\n### 特殊字符类\n\
  \n正则表达式中使用一些特殊字符来提取数据。表 4-5 总结了其中一些特殊字符。\n\n**表 4-5** 正则表达式特殊字符\n\n| 序号 | 示例 | 描述\
  \ |\n| --- | --- | --- |\n| 1 | `.` | 匹配除换行符外的任意字符 |\n| 2 | `\\d` | 匹配一个数字：`[0-9]`\
  \ |\n| 3 | `\\D` | 匹配一个非数字：`[⁰-9]` |\n| 4 | `\\s` | 匹配一个空白字符：`[ \\t\\r\\n\\f]` |\n\
  | 5 | `\\S` | 匹配一个非空白字符：`[^ \\t\\r\\n\\f]` |\n| 6 | `\\w` | 匹配一个单词字符：`[A-Za-z0-9_]`\
  \ |\n| 7 | `\\W` | 匹配一个非单词字符：`[^A-Za-z0-9_]` |\n\n### 重复类\n\n字符串可能存在不同拼写，例如“ok”和“okay”。为处理此类情况，可以使用重复表达式，如表\
  \ 4-6 所示。\n\n**表 4-6** 正则表达式重复字符\n\n| 序号 | 示例 | 描述 |\n| --- | --- | --- |\n| 1 |\
  \ `ruby?` | 匹配 `\"rub\"` 或 `\"ruby\"`；*y* 是可选的 |\n| 2 | `ruby*` | 匹配 `\"rub\"` 加上零个或多个\
  \ *y* |\n| 3 | `ruby+` | 匹配 `\"rub\"` 加上一个或多个 *y* |\n| 4 | `\\d{3}` | 匹配恰好三个数字 |\n\
  | 5 | `\\d{3,}` | 匹配三个或更多数字 |\n| 6 | `\\d{3,5}` | 匹配三个、四个或五个数字 |\n\n### 选择\n\n选择指的是可以使用多个表达式语句来提取数据的表达式，如表\
  \ 4-7 所示。\n\n**表 4-7** 选择正则表达式字符\n\n| 序号 | 示例 | 描述 |\n| --- | --- | --- |\n| 1 |\
  \ `python\\|RLang` | 匹配 `\"python\"` 或 `\"RLang\"` |\n| 2 | `R(L\\|Lang)` | 匹配 `\"\
  RL\"` 或 `\"RLang\"` |\n| 3 | `Python(!+\\|\\?)` | `\"Python\"` 后跟一个或多个 `!` 或一个 `?`\
  \ |\n\n\n\n### 锚点\n\n锚点用于确定字符串中匹配模式的位置。表 4-8 展示了多个锚点示例。\n\n**表 4-8** 锚点字符\n\n| 序号\
  \ | 示例 | 描述 |\n| --- | --- | --- |\n| 1 | `^Python` | 匹配字符串或内部行开头的 `\"Python\"`\
  \ |\n| 2 | `Python$` | 匹配字符串或行结尾的 `\"Python\"` |\n| 3 | `\\APython` | 匹配字符串开头的 `\"\
  Python\"` |\n| 4 | `Python\\Z` | 匹配字符串结尾的 `\"Python\"` |\n| 5 | `\\bPython\\b` |\
  \ 匹配单词边界处的 `\"Python\"` |\n| 6 | `\\brub\\B` | `\\B` 是非单词边界：匹配 *rube* 和 *ruby* 中的\
  \ `\"rub\"`，但不匹配独立的 `\"rub\"` |\n| 7 | `Python(?=!)` | 匹配后跟感叹号的 `\"Python\"` |\n\
  | 8 | `Python(?!!)` | 匹配后不跟感叹号的 `\"Python\"` |\n\n正则表达式不仅用于从字符串中提取数据，各种内置方法也可用于相同目的。清单\
  \ 4-13 演示了使用方法与正则表达式提取相同字符的对比。\n\n```\nIn [54]: import re\nprint (\"\\nFine-Tuning\
  \ String Extraction \\n\")\nmystr=\"From ossama.embarak@hct.ac.ae Sat Jun 5 08:14:16\
  \ 2018\" Extract = re.findall('\\S+@\\S+',mystr)\nprint (Extract)\nE_xtracted =\
  \ re.findall('^From.*? (\\S+@\\S+)',mystr) # non greedy white space\nprint (E_xtracted)\n\
  print (E_xtracted[0])\nFine-Tuning String Extraction\n['ossama.embarak@hct.ac.ae']\n\
  ['ossama.embarak@hct.ac.ae']\nossama.embarak@hct.ac.ae\nIn [57]: mystr=\"From ossama.embarak@hct.ac.ae\
  \ Sat Jun 5 08:14:16 2018\"\natpos = mystr.find('@')\nsppos = mystr.find(' ',atpos)\
  \ # find white space starting from atpos\nhost = mystr[atpos+1 : sppos]\nprint (host)\n\
  usernamepos = mystr.find(' ')\nusername = mystr[usernamepos+1 : atpos]\nprint (username)\n\
  hct.ac.ae\nossama.embarak\nListing 4-13\nThe Use of Methods vs. Regular Expressions\n\
  ```\n\n`re.findall('@([^ ]*)',mystr)` 从 `mystr` 字符串中检索子字符串，该子字符串从 `@` 之后开始，一直持续到找到空白字符为止。类似地，`re.findall('^From\
  \ .*@([^ ]*)', mystr)` 从 `mystr` 字符串中检索子字符串，该子字符串从 `From` 之后开始，查找零个或多个字符，然后是 `@`\
  \ 字符，*然后是除空白字符之外的任何字符。* 参见清单 4-14。\n\n```\nIn [58]: print (\"\\n The Regex Version\\\
  n\")\nimport re\nmystr=\"From ossama.embarak@hct.ac.ae Sat Jun 5 08:14:16 2018\"\
  \nExtract = re.findall('@([^ ]*)',mystr)\nprint (Extract)\nExtract = re.findall('^From\
  \ .*@([^ ]*)',mystr)\nprint (Extract)\nThe Regex Version\n['hct.ac.ae']\n['hct.ac.ae']\n\
  In [59]: print (\"\\nScape character \\n\")\nmystr = 'We just received $10.00 for\
  \ cookies and $20.23 for juice'\nExtract = re.findall('\\$[0-9.]+',mystr)\nprint\
  \ (Extract)\nScape character\n['$10.00', '$20.23']\nListing 4-14\nUsing the Regular\
  \ Expression findall() Method\n```\n\n## 总结\n\n本章涵盖了从存储文件中读取或拉取，或直接从用户读取的输入/输出数据。让我们回顾一下本章涵盖的内容。\n\
  \n*   本章涵盖了如何打开文件进行读取、写入或两者兼有。此外，还涵盖了如何访问打开文件的属性以及关闭所有打开的会话。\n*   本章涵盖了如何通过屏幕直接从用户收集数据。\n\
  *   它涵盖了正则表达式及其模式以及特殊字符的用法。\n*   本章涵盖了如何应用正则表达式提取数据，以及如何使用替代、锚点和重复表达式进行数据提取。\n\n\
  下一章将研究收集和清理数据以进行进一步处理的技术，以及更多内容。\n\n## 练习与答案\n\n1.  编写一个 Python 脚本，使用正则表达式从以下文本中提取课程编号、代码和名称：\n\
  \n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT Mathematics\n189 ENG English\"\
  \"\"\n```\n\n**答案：**\n\n1.  编写一个 Python 脚本，使用正则表达式从以下文本中以元组形式提取每门课程的详细信息。此外，使用正则表达式检索\
  \ `CoursesData` 中的字符串值，然后检索 `CoursesData` 中的数值。\n\n    **答案：**\n\n```\nIn [60]:\
  \ import re\nCoursesData = \"\"\"101 COM Computers\n205 MAT  Mathematics\n189 ENG\
  \  English\"\"\"\nIn [61]: # Extract all course numbers\nCourse_numbers = re.findall('[0-9]+',\
  \ CoursesData)\nprint (Course_numbers)\n### Extract all course codes\nCourse_codes\
  \ = re.findall('[A-Z]{3}', CoursesData)\nprint (Course_codes)\n### Extract all course\
  \ names\nCourse_names = re.findall('[A-Za-z]{4,}', CoursesData) print (Course_names)\n\
  ['101', '205', '189']\n['COM', 'MAT', 'ENG']\n['Computers', 'Mathematics', 'English']\n\
  ```\n\n1.  编写一个 Python 脚本，使用正则表达式提取大小为 4 的数字和大小为 2 到 4 的数字。\n\n    **答案：**\n\n```\n\
  In [63]: # define the course text pattern groups and extract\ncourse_pattern = '([0-9]+)\\\
  s*([A-Z]{3})\\s*([A-Za-z]{4,})'\nre.findall(course_pattern, CoursesData)\nOut[63]:\
  \ [('101', 'COM', 'Computers'),\n('205', 'MAT', 'Mathematics'),\n('189', 'ENG',\
  \ 'English')]\nIn [64]: print(re.findall('[a-zA-Z]+', CoursesData)) # [] Matches\
  \ any character inside\n['COM', 'Computers', 'MAT', 'Mathematics', 'ENG', 'English']\n\
  In [65]: print(re.findall('[0-9]+', CoursesData)) # [] Matches any numeric inside\n\
  ['101', '205', '189']\n```\n\n```\nCoursesData = \"\"\"101 COM Computers\n205 MAT\
  \ Mathematics\n189 ENG English\"\"\"\n```\n\n```\nIn [66]: import re\nCoursesData\
  \ = \"\"\"10 COM Computers\n205 MAT Mathematics 1899 ENG English\"\"\"\nprint(re.findall('\\\
  d{4}', CoursesData)) # {n} Matches repeat n times.\nprint(re.findall('\\d{2,4}',\
  \ CoursesData))\n['1899']\n['10', '205', '1899']\n```\n\n```\nCoursesData = \"\"\
  \"101 COM Computers\n205 MAT Mathematics\n189 ENG English\"\"\"\n```\n\n"
- "# 5. 数据收集与清洗\n\n在 21 世纪，数据对于决策和制定长期战略计划至关重要。Python 提供了众多库和内置功能，使得支持数据分析和处理变得容易。制定商业决策、预测天气、研究生物学中的蛋白质结构以及设计营销活动，这些都是需要收集数据，然后进行清洗、处理和可视化的例子。\n\
  \n数据处理主要有五个步骤。\n\n1.  *数据获取*：从各种来源读取数据，这些来源可能是非结构化数据、半结构化数据或完全结构化数据，可能存储在电子表格、逗号分隔文件、网页、数据库等中。\n\
  2.  *数据清洗*：移除噪声数据，并执行必要的操作以仅保留相关数据。\n3.  *探索性分析*：查看清洗后的数据，并进行适合特定分析目的的统计处理。\n4.\
  \  需要创建*分析模型*。此步骤可以使用诸如机器学习算法之类的先进工具。\n5.  *数据可视化*：使用 Python 提供的各种系统绘制结果，以帮助决策过程。\n\
  \nPython 提供了几个用于数据收集、清洗、集成、处理和可视化的库。\n\n*   `Pandas` 是一个开源的 Python 库，通过提供强大的数据结构来加载、组织、操作、建模和分析数据。\n\
  *   `Numpy` 是一个 Python 包，代表“数值 Python”。它是一个由多维数组对象和一组用于操作数组的例程组成的库。它可以用于对数组执行数学、逻辑和线性代数运算。\n\
  *   `SciPy` 是另一个用于数值积分和优化的内置 Python 库。\n*   `Matplotlib` 是一个用于创建二维图形和图表的 Python\
  \ 库。它支持多种图形和图表，例如直方图、条形图、功率谱、误差图等，并具有额外的格式化功能，例如控制线条样式、字体属性、格式化坐标轴等。\n\n\n\n## 数据清洗\n\
  \n数据是通过各种方法手动或自动收集的，例如气象传感器、金融股票市场数据服务器、用户的在线商业偏好等。收集到的数据并非没有错误，通常存在各种缺失数据点和错误输入的数据。例如，在线用户可能因隐私问题而不愿输入其信息。因此，处理缺失和噪声数据（`NA`\
  \ 或 `NaN`）对于任何数据分析处理都至关重要。\n\n### 检查缺失值\n\n你可以使用内置的 Python 方法来检查缺失值。让我们使用 `Numpy`\
  \ 和 `Pandas` 库创建一个数据框。包含索引值 `a` 到 `h`，并为列指定标签 `stock1`、`stock2` 和 `stock3`，如清单 5-1\
  \ 所示。\n\n```\nIn [47]: import pandas as pd\nimport numpy as np\ndataset = pd.DataFrame(np.random.randn(5,\
  \ 3), index=['a', 'c', 'e', 'f', 'h'],columns=['stock1', 'stock2', 'stock3'])\n\
  dataset.rename(columns={\"one\":'stock1',\"two\":'stock2', \"three\":'stock3'},\
  \ inplace=True)\ndataset = dataset.reindex(['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'])\n\
  print (dataset)\n清单 5-1\n创建包含 NaN 的数据框\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figa_HTML.jpg](img/472943_1_En_5_Figa_HTML.jpg)\n\
  \n应该清楚的是，你可以使用 `Numpy` 创建一个随机值数组，如清单 5-2 所示。\n\n```\nIn [46]: import numpy as np\n\
  np.random.randn(5, 3)\n清单 5-2\n创建随机值矩阵\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figb_HTML.jpg](img/472943_1_En_5_Figb_HTML.jpg)\n\
  \n在清单 5-2 中，你忽略了行 `b`、`d` 和 `g`。这就是你得到 `NaN` 的原因，它表示非数值。`Pandas` 提供了 `isnull()`\
  \ 和 `notnull()` 函数来检测数据集中的缺失值。当检测到 `NaN` 时，会返回一个布尔值；否则，返回 `False`，如清单 5-3 所示。\n\n\
  ```\nIn [48]: print (dataset['stock1'].isnull())\n清单 5-3\n检查空值情况\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figc_HTML.jpg](img/472943_1_En_5_Figc_HTML.jpg)\n\
  \n### 处理缺失值\n\n有多种技术可用于处理缺失值。\n\n*   你可以用标量值替换 `NaN`。\n\n    清单 5-4 将所有 `NaN` 情况替换为\
  \ `0` 值。\n\n    ```\n    In [49]: print (dataset)\n    dataset.fillna(0)\n    清单\
  \ 5-4\n    用标量值替换 NaN\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figd_HTML.jpg](img/472943_1_En_5_Figd_HTML.jpg)\n\
  \n*   你可以向前和向后填充 `NaN` 情况。\n\n    另一种处理缺失值的技术是使用 `pad`/`fill` 方法向前填充，或使用 `bfill`/`backfill`\
  \ 方法向后填充。在清单 5-5 中，行 `a` 的值复制到了行 `b` 的缺失值中。\n\n    ```\n    In [50]: # 向前填充缺失值\n\
  \    print (dataset)\n    dataset.fillna(method='pad')\n    清单 5-5\n    向前填充缺失值\n\
  \    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Fige_HTML.jpg](img/472943_1_En_5_Fige_HTML.jpg)\n\
  \n*   你可以删除缺失值。\n\n    另一种技术是排除所有包含 `NaN` 值的行。`Pandas` 的 `dropna()` 函数可用于从数据集中删除整行。如清单\
  \ 5-6 所示，行 `b`、`d` 和 `g` 已从数据集中完全删除。\n\n    ```\n    In [51]: print (dataset)\n\
  \    dataset.dropna()\n    清单 5-6\n    删除所有包含 NaN 的行\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figf_HTML.jpg](img/472943_1_En_5_Figf_HTML.jpg)\n\
  \n*   你可以替换缺失（或通用）值。\n\n    `replace()` 方法可用于将数据集中的特定值替换为另一个给定值。此外，它还可用于替换 `NaN`\
  \ 情况，如清单 5-7 所示。\n\n    ```\n    In [52]: print (dataset)\n    dataset.replace(np.nan,\
  \ 0 )\n    清单 5-7\n    使用 replace() 函数\n    ```\n\n    ![../images/472943_1_En_5_Chapter/472943_1_En_5_Figg_HTML.jpg](img/472943_1_En_5_Figg_HTML.jpg)\n\
  \n\n\n### 读取与清洗 CSV 数据\n\n在本节中，你将从一个逗号分隔值（CSV）文件中读取数据。图 5-1 所示的 CSV 销售文件格式将用于演示数据清洗过程。\n\
  \n![../images/472943_1_En_5_Chapter/472943_1_En_5_Fig1_HTML.jpg](img/472943_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1\n\nCSV 格式的销售数据\n\n你可以使用 Pandas 库读取文件并显示前五条记录。Python 会生成一个从 0 开始的自动索引，如代码清单\
  \ 5-8 所示。\n\n```\nIn [53]: import pandas as pd\nsales = pd.read_csv(\"Sales.csv\"\
  )\nprint (\"\\n\\n<<<<<<< 前 5 条记录 <<<<<<<\\n\\n\" )\nprint (sales.head())\n代码清单\
  \ 5-8\n读取 CSV 文件并显示前五条记录\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figh_HTML.jpg](img/472943_1_En_5_Figh_HTML.jpg)\n\
  \n你可以使用 `tail()` 方法显示最后五条记录。\n\n```\nIn [54]:  print (sales.tail())\n```\n\n`pd.read_csv()`\
  \ 用于读取整个 CSV 文件；但有时你只需要读取少量记录以减少内存占用。在这种情况下，你可以使用 `nrows` 属性来控制要读取的行数。\n\n```\n\
  In [55]:   import pandas as pd\nsalesNrows = pd.read_csv(\"Sales.csv\", nrows=4)\n\
  salesNrows\n```\n\n类似地，你可以使用列索引或标签读取特定列。代码清单 5-9 使用 `usecols` 属性读取第 0、1 和 6 列，然后改用列标签代替列索引。\n\
  \n```\nIn [58]: salesNrows = pd.read_csv(\"Sales.csv\", nrows=4, usecols=[0, 1,\
  \ 6])\nsalesNrows\n代码清单 5-9\n重命名列标签\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figi_HTML.jpg](img/472943_1_En_5_Figi_HTML.jpg)\n\
  \n```\nIn [60]: salesNrows = pd.read_csv(\"Sales.csv\", nrows=4, usecols=['SALES_ID'\
  \ , 'SALES_BY_REGION', 'FEBRUARY', 'MARCH'])\nsalesNrows\n```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figj_HTML.jpg](img/472943_1_En_5_Figj_HTML.jpg)\n\
  \n在代码清单 5-10 中，使用 `.rename()` 方法更改数据集列标签（例如，将 `SALES_ID` 改为 `ID`）。此外，你设置 `inplace=True`\
  \ 以将这些更改提交到原始数据集，而不是其副本。\n\n```\nIn [56]: salesNrows.rename(columns={\"SALES_ID\"\
  :'ID',\"SALES_BY_REGION\":'REGION'}, inplace=True)\nsalesNrows\n代码清单 5-10\n重命名列标签\n\
  ```\n\n![../images/472943_1_En_5_Chapter/472943_1_En_5_Figk_HTML.jpg](img/472943_1_En_5_Figk_HTML.jpg)\n\
  \n你可以查找数据集中变量的唯一值；只需将每一列视为一个可用于进一步处理的变量或模式。参见代码清单 5-11。\n\n```\nIn [57]: print (len(salesNrows['JANUARY'].unique()))\n\
  print (len(salesNrows['REGION'].unique()))\nprint (salesNrows['JANUARY'].unique())\n\
