  ### 数据分析


  如前所述，Pandas 提供了多种数据分析方法。本节的目标是熟悉数据并总结其主要特征。此外，你还可以为特定的统计分析定义自己的方法。


  ### 统计分析


  以下大多数统计方法在前文中已通过三种主要数据集合（序列、数据框和面板）的实际示例进行了介绍。


  *   `df.describe()`：数值列的汇总统计

  *   `df.mean()`：返回所有列的均值

  *   `df.corr()`：返回数据框中列之间的相关性

  *   `df.count()`：返回每个数据框列中非空值的数量

  *   `df.max()`：返回每列中的最大值

  *   `df.min()`：返回每列中的最小值

  *   `df.median()`：返回每列的中位数

  *   `df.std()`：返回每列的标准差


