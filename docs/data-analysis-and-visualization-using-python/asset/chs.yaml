  line = line.rstrip()\nif not '@uct.ac.za' in line :\ncontinue\nprint (line)\n清单\
  \ 4-6\n读取和处理文本文件\n```\n\n你可以仅提取以 `From:` 开头的行。提取后，你可以将每一行拆分为一个列表，并仅切片出电子邮件元素，如清单\
