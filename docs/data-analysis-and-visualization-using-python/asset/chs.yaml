  Enter your name: Omar\nEnter your age: 41\nName: Omar    Age:42\nListing 1-23\n\
  String Conversion and Format Symbols\n```\n\n\n\n#### 遍历字符串\n\n你可以使用迭代语句向前或向后遍历字符串。许多计算任务都涉及逐个字符地处理字符串。字符串处理可以从开头开始，依次选取每个字符，对其进行操作，并持续到末尾。这种处理模式称为*遍历*。编写遍历的一种方法是使用`while`循环，如代码清单\
