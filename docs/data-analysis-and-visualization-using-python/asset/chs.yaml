- "# 4. 文件 I/O 处理与正则表达式\n\n在本章中，你将学习输入输出函数和文件处理。此外，你还将学习正则表达式以及如何提取匹配特定模式的数据。\n\n\
  ## 文件 I/O 处理\n\nPython 提供了多种用于输入、输出和文件处理的方法。你可以从屏幕获取输入并将数据输出到屏幕，也可以从文件读取数据并将数据存储到文件中。\n\
  \n### 数据输入与输出\n\n你可以使用 `input()` 函数从用户处读取数据。默认情况下，接收到的数据是文本格式。因此，如果需要，你应该使用转换函数将数据转换为数值，如代码清单\
  \ 4-1 所示。\n\n```\nIn [2]: Name = input (\"Enter your name: \")\nName\nEnter your\
  \ name: Osama Hashim\nOut[2]: 'Osama Hashim'\nIn [3]: Mark = input(\"Enter your\
