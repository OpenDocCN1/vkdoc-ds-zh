  \ value\" )\nelse:\nprint (\"All Conditions are false\" )\nAll Conditions are false\n\
  清单 1-15\n嵌套选择语句\n```\n\n### 迭代语句\n\nPython 中有多种迭代语句结构。`for` 循环是其中一种结构；它用于按元素出现的顺序遍历集合中的元素。通常，语句是按顺序执行的，即函数中的第一条语句先执行，接着是第二条，依此类推。有时可能需要多次执行一段代码块。\n\
  \n控制结构允许你多次执行一条语句或一组语句，如图 1-7 所示。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig7_HTML.jpg](img/472943_1_En_1_Fig7_HTML.jpg)\n\
  \n**图 1-7** 循环语句\n\n表 1-10 展示了迭代语句的不同形式。Python 编程语言提供了不同类型的循环语句来处理迭代需求。\n\n**表 1-10**\
  \ 迭代语句结构\n\n| 1 | `for` 循环 多次执行一系列语句，并简化管理循环变量的代码。 |\n| 2 | 嵌套循环 你可以在任何其他 `while`、`for`\
  \ 或 `do..while` 循环内部使用一个或多个循环。 |\n| 3 | `while` 循环 在给定条件为真时重复执行一条语句或一组语句。它在*执行循环体之前*测试条件。\
  \ |\n| 4 | `do {....} while ()` 在给定条件为真时重复执行一条语句或一组语句。它在*执行循环体之后*测试条件。 |\n\nPython\
  \ 为迭代语句提供了多种支持方法，允许你终止迭代、跳过特定迭代，或者在你不想执行任何命令或代码时使用 `pass`。表 1-11 总结了迭代执行中的控制语句。\n\
  \n**表 1-11** 循环控制语句\n\n| 1 | Break 语句 终止循环语句，并将执行转移到循环之后紧接着的语句。 |\n| 2 | Continue\
  \ 语句 使循环跳过其主体剩余部分，并在重新迭代之前立即重新测试其条件。 |\n| 3 | Pass 语句 当语法上需要一条语句，但你不想执行任何命令或代码时，使用\
  \ `pass` 语句。 |\n\n`range()` 语句与 `for` 循环语句一起使用，你可以指定一个值。例如，如果你指定 4，循环语句从 1 开始，到\
