  ### 散点图


  散点图用于可视化不同类别；它能清晰地展示一个变量相对于其他变量的分布情况。例如，按性别和职业划分的薪资分布表明，男性教授的薪资范围最高。大多数男性是正教授，其次是副教授，然后是助理教授。男性教授的数量多于女性教授，但女性副教授的数量多于男性副教授。参见代码清单
  7-14。


  ```

