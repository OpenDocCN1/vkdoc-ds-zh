  , Filehndl.closed)\nFilehndl.close()\nprint (\"是否已关闭: \", Filehndl.closed)\n是否已关闭:\
  \ False\n是否已关闭: True\n清单 4-3\n关闭文件\n```\n\n### 读写文件\n\n`file.write()` 方法用于向文件写入数据，如下图所示；`file.read()`\
  \ 方法用于从已打开的文件中读取数据。文件可以以写入（`w`）、读取（`r`）或读写（`r+`）模式打开，如清单 4-4 所示。\n\n```\nIn [39]:Filehndl\
