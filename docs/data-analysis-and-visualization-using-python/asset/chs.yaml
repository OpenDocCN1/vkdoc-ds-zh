  \ 脚本。\n\n1.  创建一个库。\n\n    点击“新建库”，输入库的详细信息，然后点击“创建”，如下图所示：\n\n    ![../images/472943_1_En_1_Chapter/472943_1_En_1_Figb_HTML.jpg](img/472943_1_En_1_Figb_HTML.jpg)\n\
