  )\nif (Mark>=85):\nGrade=\"B+\"\nprint (\"FMC\\t\", Name,\"\\t\",Mark,\"\\t\", Grade)\n\
  Welcome to Grading System\nHCT 2018\nCampus       Name         Mark    Grade\nFMC\
  \       Osama Hashim    92.0    B+\nListing 4-1\nScreen Data Input/Output\n```\n\
  \n这里你使用 `float(Mark)` 将 `Mark` 值转换为浮点数。你使用 `\\t` 来添加制表符，使用 `\\n` 在屏幕上换行。\n\n###\
  \ 打开和关闭文件\n\nPython 内置的 `open()` 函数用于打开存储在计算机硬盘或云端的文件。其语法如下：\n\n```\nfile object\
  \ = open(file_name [, access_mode][, buffering])\n```\n\n表 4-1 描述了其模式。\n\n**表 4-1**\
  \ 文件打开模式\n\n| 序号 | 模式 | 描述 |\n| --- | --- | --- |\n| 1 | `r` | 以只读方式打开文件；默认模式 |\n\
  | 2 | `rb` | 以二进制格式只读打开文件 |\n| 3 | `r+` | 以读写方式打开文件 |\n| 4 | `rb+` | 以二进制格式读写打开文件\
  \ |\n| 5 | `w` | 以只写方式打开文件 |\n| 6 | `wb` | 以二进制格式只写打开文件 |\n| 7 | `w+` | 以读写方式打开文件\
  \ |\n| 8 | `wb+` | 以二进制格式读写打开文件 |\n| 9 | `a` | 以追加方式打开文件 |\n| 10 | `ab` | 以二进制格式追加打开文件\
  \ |\n| 11 | `a+` | 以追加和读取方式打开文件 |\n| 12 | `ab+` | 以二进制格式追加和读取打开文件 |\n\n\n\n### 文件对象属性\n\
  \nPython 提供了多种方法来检测已打开文件的信息，如表 4-2 所示。\n\n**表 4-2** 已打开文件的属性\n\n| 序号 | 属性 | 描述 |\n\
  | --- | --- | --- |\n| 1 | `file.closed` | 如果文件已关闭则返回 true，否则返回 false |\n| 2 | `file.mode`\
  \ | 返回打开文件时使用的访问模式 |\n| 3 | `file.name` | 返回文件的名称 |\n\n清单 4-2 展示了一个名为 `Egypt.txt`\
  \ 的已打开文件的属性。\n\n```\nIn [41]: # 打开一个文件并查找其属性\nFilehndl = open(\"Egypt.txt\", \"\
