  \n由于数据集中存在不同的模式，你应该能够使用不同的值进行数据清洗和替换。以下示例从 `sales.csv` 文件读取数据并将其存储到 sales 数据框中。`na_values`\
  \ 属性中列出的所有值都被替换为 NaN 值。因此，对于 January 列，所有 `[\"n.a.\", \"not available\", -1]` 值都被转换为\
  \ NaN。\n\n```\nIn [25]: sales = pd.read_csv(\"Sales.csv\", na_values = {\n\"SALES_BY_REGION\"\
  : [\"n.a.\", \"not avilabl”],\n\"JANUARY\": [\"n.a.\", \"not avilable\", -1],\n\"\
  FEBRUARY\": [\"n.a.\", \"not avilable\", -1]})\nsales.head(20)\n```\n\n另一种在加载数据时进行清洗的专业方法是定义数据清洗函数。在代码清单\
  \ 5-13 中，你定义并调用了两个函数：`CleanData_Sales()` 用于清洗数值并将所有 NaN 值重置为 0，`CleanData_REGION()`\
  \ 用于清洗字符串值并将所有 NaN 值重置为 `Abu Dhabi`。然后在 `converters` 属性中调用这些函数。\n\n```\nIn [26]:\
  \ def CleanData_Sales(cell):\nif (cell==\"n.a.\" or cell==\"-1\" or cell==\"not\
  \ avilable\"):\nreturn 0\nreturn cell\ndef CleanData_REGION(cell):\nif (cell==\"\
  n.a.\" or cell==\"-1\" or cell==\"not avilable\"):\nreturn 'AbuDhabi'\nreturn cell\n\
  In [28]: sales = pd.read_csv(\"Sales.csv\", nrows=7, converters={\n\"SALES_BY_REGION\"\
  : CleanData_REGION,\n\"JANUARY\": CleanData_Sales,\n\"FEBRUARY\": CleanData_Sales,\n\
  \"APRIL\": CleanData_Sales,\n})\nsales.head(20)\n代码清单 5-13\n定义并调用数据清洗函数\n```\n\n\
