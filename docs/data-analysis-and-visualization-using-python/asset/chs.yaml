  \n您的项目应该如下所示：\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fige_HTML.jpg](img/472943_1_En_1_Fige_HTML.jpg)\n\
  \n1.  编写并运行一个 Python 脚本。\n\n    通过点击打开已创建的 Hello World 脚本，并开始编写您的 Python 代码，如图 1-4\
  \ 所示。\n\n![../images/472943_1_En_1_Chapter/472943_1_En_1_Fig4_HTML.jpg](img/472943_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\nAzure 上的一个 Python 脚本文件\n\n在图 1-4 中，所有绿色图标显示了可应用于正在运行的文件的选项。例如，您可以点击 +\
