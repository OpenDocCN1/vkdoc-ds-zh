  在循环语句中使用选择语句\n```\n\n在前面的示例中，第一个和第二个迭代使用了带有 `range` 语句的 `for` 循环。在最后一个示例中，迭代遍历一个元素列表，并在到达被迭代列表的最后一个元素时停止。\n\
  \n`break` 语句用于跳出语句并转移执行控制。它会中断当前执行，如果是内层循环，则内层循环会立即终止。而 `continue` 语句是一种跳转语句，它会跳过当前迭代的执行。跳过之后，循环会继续执行下一次迭代。`pass`\
  \ 关键字用于不执行任何操作。以下示例演示了如何以及何时使用每个语句。\n\n\n\n### Break、Continue 和 Pass 语句的使用\n\n清单\
  \ 1-20 展示了 `break`、`continue` 和 `pass` 语句。\n\n```\nIn [44]:for letter in 'Python3':\n\
  if letter == 'o':\nbreak\nprint (letter)\nP\ny\nt\nh\nIn [45]: a=0\nwhile a<=5:\n\
  a=a+1\nif a%2==0:\ncontinue\nprint (a)\nprint (\"End of Loop\" )\n\nEnd of Loop\n\
  In [46]: for i in [1,2,3,4,5]:\nif i==3:\npass\nprint (\"Pass when value is\", i\
