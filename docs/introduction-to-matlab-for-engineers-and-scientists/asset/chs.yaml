  ```\n1  >> x = [1,2,3,4,5];\n2  >> y = [12,5,11,9,10];\n3  >> barh(x,y)\n```\n\n\
  图 3-5 显示了一个标准条形图，图 3-6 显示了一个水平条形图。\n\n![A458923_1_En_3_Fig6_HTML.gif](img/A458923_1_En_3_Fig6_HTML.gif)\n\
  \n图 3-6：水平条形图\n\n![A458923_1_En_3_Fig5_HTML.gif](img/A458923_1_En_3_Fig5_HTML.gif)\n\
  \n图 3-5：条形图\n\n可以类似地使用 `hist()` 函数来绘制直方图。让我们看看由 `randn()` 函数生成的随机数的正态分布行为。\n\n```\n\
  1  >> x = randn(100);\n2  >> hist(x)\n```\n\n在图 3-7 中，你可以清晰地观察到包络线的钟形曲线，从而确认这些随机数确实是正态分布的。\n\
  \n![A458923_1_En_3_Fig7_HTML.gif](img/A458923_1_En_3_Fig7_HTML.gif)\n\n图 3-7：显示随机数正态分布的直方图\n\
  \n\n\n#### 对数坐标图\n\n在绘制涉及对数刻度的图形时，MATLAB 提供了三种选项：\n\n- `semilogx()`: 绘制 x 轴为对数刻度的图形。例如，请考虑列表\
