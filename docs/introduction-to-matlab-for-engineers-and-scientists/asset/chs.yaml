  \ {f}^n(a){\\left(x-a\\right)}^n\\end{array}} $$ ](img/A458923_1_En_7_Chapter_Equd.gif)\n\
  \n    可以用西格玛记法重写如下：\n\n    ![ $$ {p}_n(x)=\\sum \\limits_{k=0}^n\\frac{1}{k!}{f}^k(a){\\\
