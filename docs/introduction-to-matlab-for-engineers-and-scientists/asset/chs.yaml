  @12\",x,y2,x,y3,\"4\",x,y4,\"+\")\n9  grid on\n10  legend('xˆ2','xˆ{2.1}','xˆ{2.2}','xˆ{2.3}');\n\
  11  xlabel('x−axis')\n12  ylabel('y−axis')\n13  title('Multiple Graphs')\n\n15 \
