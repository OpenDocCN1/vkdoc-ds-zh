  \ $$ ](img/A458923_1_En_7_Chapter_Equb.gif)\n\n    ![ $$ {p}_1(x)={f}^{\\prime }(a)x+f(a)-{f}^{\\\
  prime }(a)a=f(a)\\left(x-a\\right) $$ ](img/A458923_1_En_7_Chapter_Equc.gif)\n\n\
  \    *   `p1` 必须是 `p1 = mx + c` 的形式（一条斜率为 `m`、截距为 `c` 的直线）。\n    *   由于 `p'(a) =\
  \ f'(a)`，所以 `m = f'(a)`。\n    *   因此我们可以写成 `c = f(a) - f'(a)a`。\n    *   将 `m` 和\
  \ `c` 的值代回，我们得到上式。\n3.  以类似的方式继续应用相同的论点，你可以写出 `n` 阶泰勒多项式的一般形式为：\n\n    ![ $$ {\\\
  displaystyle \\begin{array}{l}{p}_n(x)=f(a)+{f}^{\\hbox{'}}(a)\\left(x-a\\right)+\\\
