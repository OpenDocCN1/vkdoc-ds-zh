  pm \\frac{1}{n!}{x}^n $$ ](img/A458923_1_En_7_Chapter_Equ6.gif)\n\n(方程 7-6)\n\n\
  **表 7-1** 计算 `sin(x)` 在 `x = 0` 处的麦克劳林级数的系数\n\n| n | f(x) | f(a) |\n| --- | ---\
