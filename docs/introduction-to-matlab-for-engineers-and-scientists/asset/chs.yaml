- '# 6. 数值计算形式体系


  ## 6.1 引言


  数值计算允许您计算出数值问题的解，前提是您能够将它们构造成合适的格式。这需要一些考量。例如，如果您对连续函数进行数字化处理，那么由于以有限频率进行采样，将会引入某些误差。因此，非常精确的结果需要非常高的采样率。当需要计算大型数据集时，这将成为一项计算密集且耗时的任务。此外，您必须明白，与分析解相比，数值解充其量只是一种近似。寻找它们的物理意义和重要性的责任在于您。舍弃在现实世界场景中没有意义的解，是科学家/工程师多年来培养出的技艺。此外，计算设备的智能程度只与其操作者相当。GIGO（垃圾进，垃圾出）定律在这个领域被严格遵守。


  本章试图解释一些重要步骤，您必须考虑这些步骤才能使用数值计算来解决物理问题。以恰当的术语定义问题只是第一步。建立正确的模型，然后使用正确的方法（求解器）来解决问题，是经验不足的科学家/工程师与经验丰富的科学家/工程师之间的区别。


  ## 6.2 物理问题


  我们物理世界中的一切事物都受物理定律的支配。得益于那些在艰苦条件下辛勤工作、为我们周围发生的事情提出精妙解决方案的科学先贤们，我们获得了物理定律的数学理论。为了检验这些物理定律的数学形式体系，我们使用数值计算。如果它产生了与真实实验相同的结果，那么它们就相互验证了。数值模拟可以完全消除进行实际实验的需要，前提是您拥有经过充分测试的数学形式体系。例如，我们这个时代的核能大国不再需要真正进行核弹试验。在真实核爆炸期间获得的与核爆炸相关的数据，使科学家能够相当精确地对这些物理系统进行建模，从而消除了进行真实测试的必要性。


  除了模拟真实实验等应用之外，对物理问题进行建模也是很好的教育练习。在建模过程中，动手练习使学生能够深入探究该主题，并为所研究的课题赋予恰当的意义。解决数值问题并将结果可视化，可以使学习永久化，并揭示数学理论中的任何缺陷，这最终会带来新的发现。



  好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，对给定的英文文本进行专业、准确的中文翻译。



  ## 6.3 定义模型


  建模是指为物理系统编写方程。顾名思义，方程就是将两边相等。方程使用等号（`=`）编写，左边的项等于右边的项。方程两边的项可以是数字或表达式。例如：


  ![ $$ 3x+4y+9z=10 $$ ](img/A458923_1_En_6_Chapter_Equa.gif)


  这个方程左边（LHS）是 `3x + 4y + 9z`，右边（RHS）是 `10`。注意，左边是一个代数项，而右边是一个数字。


  表达式是使用函数编写的，函数本质上是两个域之间的关系。例如，`f(x) = y` 就是利用代数规则建立的从 `y` 到 `x` 的关系。数学拥有丰富的函数库，你可以使用它们来构建表达式。


  选择合适的函数取决于具体问题。某些函数最能描述某些情形。例如，振荡行为可以用三角函数（如 `sin(x)`、`cos(x)` 等）进行合理描述。直线运动的物体可以用线性方程（如
  `y = mx + c`）很好地描述，其中 `x` 是当前位置，`m` 是 `x` 的恒定变化率，`c` 是偏移量。沿曲线运动的物体则可以用各种非线性函数（其中因变量的幂次不为
  1）来描述。


  在现实生活中，你可能会遇到多种情形混合的情况。一个物体可以同时振荡和沿曲线运动。在这种情况下，你需要使用混合函数来编写表达式，或者寻找能够解释该物体行为的新函数。验证函数是通过求解描述行为的方程，并将其与对物体的观察结果进行匹配来完成的。如果它们完全匹配，你就得到了一个完美的解。在大多数情况下，获得精确解可能很困难。在这些情况下，你会得到一个“近似”解。如果获得近似解时涉及的误差在可容忍的范围内，那么该模型就是可以接受的。


  如前所述，物理情形可以通过用包含因变量的函数来编写数学表达式，从而进行解析求解。最简单的问题在因变量之间具有简单的函数关系，并且只有一个方程。也可能存在需要多个方程才能解释一个物理行为的情况。在求解多个方程的情况下，矩阵理论就派上用场了。


  假设下列方程定义了一个系统的物理行为：


  ![ $$ -x+3y=4 $$ ](img/A458923_1_En_6_Chapter_Equ1.gif)


  （方程 6-1）


  ![ $$ 2x-4y=-3 $$ ](img/A458923_1_En_6_Chapter_Equ2.gif)


  （方程 6-2）


  那么这个由两个方程组成的方程组可以用一个矩阵方程表示，如下所示：


  ![ $$ \left[\begin{array}{cc}-1& 3\\ {}2& -4\end{array}\right]+\left[\begin{array}{c}x\\
  {}y\end{array}\right]=\left[\begin{array}{c}4\\ {}3\end{array}\right] $$ ](A458923_1_En_6_Chapter_Equb.gif)


  现在，通过使用矩阵代数，可以找到变量 `x` 和 `y` 的值，使它们满足这些方程。这些值被称为这些方程的根。这些根是二维空间（因为有两个因变量）中的点，在该点上，系统对于该物理问题将达到稳定状态。通过这种方式，你可以在不实际进行实验的情况下预测系统的行为。


  在处理动态系统时，微分和积分的数学概念变得非常重要。当系统不断改变其因变量的值以产生某种情景时，了解这些变量的变化率就很重要。当这些变量相互独立时，你可以使用简单导数来定义它们的变化率。当它们不相互独立时，你必须为此使用偏导数。


  例如，牛顿第二运动定律指出，物体速度的变化率与施加在其上的力成正比。数学表达式为：


  ![ $$ F\ \alpha\ \frac{dy}{dx} $$ ](img/A458923_1_En_6_Chapter_Equ3.gif)


  （方程 6-3）


  通过代入一个乘法常数 `m`，可以将比例关系转化为相等关系，如下所示：


  ![ $$ F=m\times \frac{dy}{dx} $$ ](img/A458923_1_En_6_Chapter_Equ4.gif)


  （方程 6-4）


  如果你知道 `F` 的值或表达式，就可以解析求解这个方程，并找到该方程的解。但在某些情况下，解析解可能难以获得。在这些情况下，你可以将系统数字化并找到数值解。


  对给定函数进行数字化和数值求解的方法有很多。用于实现特定方法以数值方式求解函数的程序被称为求解器。存在大量用于求解函数的求解器。求解器的选择对于成功获得解至关重要。例如，方程
  6-4 是一个微分方程。它是一个一阶常微分方程。存在许多求解器来解决此类问题，例如欧拉法、龙格-库塔法等。特定求解器的选择取决于其解的准确性、求解所需的时间以及过程中使用的内存量。当内存不是可以随意消耗的资源时（例如，当你在内存存储容量有限的微型计算机上工作时），最后一点尤为重要。


  使用 MATLAB 进行数值计算的优势在于，它拥有非常丰富的函数库来执行所需的各种任务。预定义的函数已经针对速度和准确性（在某些情况下，准确性可以预先定义）进行了优化。这使你可以快速构建问题原型，而不是专注于编写执行基本任务的函数并优化其速度、准确性和内存使用。


  ## 6.4 示例：多项式


  多项式的系数被定义为向量的元素。通过这种方式，可以为数值计算定义系数。例如，考虑定义两个数组 `p1` 和 `p2`，如下所示：


  ```

  >> p1 = [1 0 3 2]


  p1 =


  1     0     3     2


  >> p2 =[3 4 0 5]


  p2 =


  3     4     0     5

  ```


  `p1` 对应的多项式是 `p1 = s³ + 3s − 2 = 0`，`p2` 对应的多项式是 `p2 = 3s³ + 4s² − 5 = 0`。见图 6-1。


  ![A458923_1_En_6_Fig1_HTML.gif](img/A458923_1_En_6_Fig1_HTML.gif)


  图 6-1


  方程 `p2 = 3s³ + 4s² − 5 = 0` 的绘图


  ### 6.4.1 `polyval()`


  可以使用 `polyval()` 函数对单个或多个值计算多项式的值。考虑在 `p1` 和 `p2` 中定义的多项式。让我们计算 `p1` 和 `p₂(-2)`
  的值。


  ```

  >> s = 5


  s =


  5


  >> polyval(p1,s)


  ans =


  142


  >> s=2


  s =


  2


  >> polyval(p2,s)


  ans =


  45

  ```


  如果需要对多个值（例如 `p[1]` 从 1 到 10）计算多项式的值，则可以将数组 `1:10` 赋给 `s` 变量，并在 `polyval()` 函数中使用它。


  ```

  >> s = 1:10;

  >> polyval(p2,s)


  ans =


  12    45    122    261    480    797    1230    1797    2516    3405

  ```


  此功能可以方便地绘制多项式图形。可以将 `s` 和 `polyval()` 的输出分别作为 x 轴和 y 轴输入给 `plot()` 命令，以可视化图形。




  ### 6.4.2 `roots()`


  多项式的根是使多项式取值为零的数值。使用 `roots()` 函数可以轻松求得根。下面是一个使用前面定义的多项式 `p1` 和 `p2` 的示例。


  ```

  1  >> p1

  3  p1 =

  5  1     0     3     2

  7  >> p2

  9  p2 =

  11  3     4     0     5

  13  >> roots(p1)

  15  ans =

  17  0.2980 + 1.8073i

  18  0.2980 − 1.8073i

  19  −0.5961 + 0.0000i

  21  >> roots(p2)

  23  ans =

  25  −1.8307 + 0.0000i

  26  0.2487 + 0.9212i

  27  0.2487 − 0.9212i

  29  >> polyval(p1,roots(p1))

  31  ans =

  33  1.0e−14*

  35  −0.1776 − 0.2720i

  36  −0.1776 + 0.2720i

  37  0.0888 + 0.0000i

  39  >> polyval(p2,roots(p2))

  41  ans =

  43  1.0e−13*

  45  −0.2753 + 0.0000i

  46  −0.0089 − 0.0111i

  47  −0.0089 + 0.0111i

  ```


  根据根的定义，多项式在根处的取值应为零，但 `roots(p1,roots(p1))` 的计算结果并非零。它实际上是一个非常小的数，量级为 10^(-14)。这是由于计算根时数值近似引入的误差导致的。


  ### 6.4.3 多项式的加法与减法


  两个多项式相加是通过将其系数相加完成的。由于它们在 MATLAB 中被定义为数组，多项式的加减法只是逐元素运算。


  ```

  1  >> p1+p2

  3  ans =

  5  4     4     3     7

  7  >> p1−p2

  9  ans =

  11  −2    −4     3     −3

  ```


  这实际上意味着：


  ![ $$ {p}_1(s)={s}³+3s-2=0 $$ ](img/A458923_1_En_6_Chapter_Equ5.gif)

  (公式 6-5)


  ![ $$ {p}_2(s)=3{s}³+4{s}²-5=0 $$ ](img/A458923_1_En_6_Chapter_Equ6.gif)

  (公式 6-6)


  ![ $$ {p}_1(s)+{p}_2(s)=4{s}³+4{s}²+3s+7 $$ ](img/A458923_1_En_6_Chapter_Equ7.gif)

  (公式 6-7)


  ![ $$ {p}_1(s)-{p}_2(s)=-2{s}³-4{s}²+3-3 $$ ](img/A458923_1_En_6_Chapter_Equ8.gif)

  (公式 6-8)


  ### 6.4.4 多项式的乘法


  两个多项式的乘积可以通过卷积运算求得，MATLAB 中可使用 `conv()` 函数来实现。


  ![ $$ {p}_1(s)={s}³+3s-2=0 $$ ](img/A458923_1_En_6_Chapter_Equ9.gif)

  (公式 6-9)


  ![ $$ {p}_2(s)=3{s}³+4{s}²-5=0 $$ ](img/A458923_1_En_6_Chapter_Equ10.gif)

  (公式 6-10)


  ![ $$ {P}_1(a)\times {p}_2(a)=3{s}⁶+4{s}⁵+9{s}⁴+23{s}³+8{s}²+15x+10=0 $$ ](img/A458923_1_En_6_Chapter_Equ11.gif)

  (公式 6-11)


  ```

  1  >> p1

  3  p1 =

  5  1     0     3     2

  7  >> p2

  9  p2 =

  11  3     4     0     5

  13  >> conv(p1,p2)

  15  ans =

  17  3     4     9     23     8     15     10

  ```


  ### 6.4.5 多项式的除法


  多项式除法通过解卷积运算实现，MATLAB 中可使用 `deconv()` 函数。它会返回两个输出——商和余数。


  ```

  1  >> p1

  3  p1 =

  5  1     0     3     2

  7  >> p2

  9  p2 =

  11  3     4     0     5

  13  >> [q,r] = deconv(p1,p2)

  15  q =

  17  0.3333

  20  r =

  22  0     −1.3333     3.0000     0.3333

  24  >> [q,r] = deconv(p2,p1)

  26  q =

  28  3

  31  r =

  33  0     4     −9     −1

  ```


  这意味着，如果：


  ![ $$ {p}_1(s)={s}³+3s-2=0 $$ ](img/A458923_1_En_6_Chapter_Equ12.gif)

  (公式 6-12)


  ![ $$ {p}_2(s)=3{s}³+4{s}²-5=0 $$ ](img/A458923_1_En_6_Chapter_Equ13.gif)

  (公式 6-13)


  那么：


  ![ $$ \frac{p_1}{p_2}\to q=0.333,r=-1.3333{s}²+3s+0.3333 $$ ](img/A458923_1_En_6_Chapter_Equ14.gif)

  (公式 6-14)


  ![ $$ \frac{p_2}{p_1}\to q=3,r=-4{s}²-9s-1=0 $$ ](img/A458923_1_En_6_Chapter_Equ15.gif)

  (公式 6-15)


  ### 6.4.6 多项式的微分


  多项式微分可以使用 `polyder()` 函数完成。例如，假设你有一个多项式 `y(x) = x ³ − 2x ² + 4x − 5 = 0`。这意味着：


  ![ $$ \frac{dy}{dx}=3{x}²-4x+4=0 $$ ](img/A458923_1_En_6_Chapter_Equc.gif)


  这可以通过 MATLAB 计算如下。


  ```

  1  >> y = [1 −2 4 −5]

  3  y =

  5  1     −2     4     −5

  7  >> dydx = polyder(y)

  9  dydx =

  11  3     −4     4

  ```


  ### 6.4.7 多项式的积分


  与微分类似，你可以使用 `polyint()` 函数来定义多项式的积分。例如，假设你有一个多项式 `y(x) = x ³ − 2x ² + 4x − 5 = 0`。那么：


  ![ $$ \int y(x) dx=0.25{x}⁴-0.6667{x}³+2{x}²-5x=0 $$ ](img/A458923_1_En_6_Chapter_Equd.gif)


  ```

  1  >> y = [1 −2 4 −5]

  3  y =

  5  1     −2     4     −5

  7  >> integration = polyint(y)

  9  integration =

  11  0.2500     −0.6667     2.0000     −5.0000     0

  ```


  ### 6.4.8 多项式曲线拟合


  假设你得到一些数据，需要找到一个能拟合这些数据的多项式。这个任务可以使用 `polyfit()` 函数完成。例如，假设你想拟合下面给出的数据：


  | x | 1 | 2 | 3 | 4 | 5 | 6 |

  | y | 10 | 11 | 21 | 2 | 3 | 7 |


  ```

  1  >> x = [1,2,3,4,5,6]

  3  x =

  5  1     2     3     4     5     6

  7  >> y = [10,11,21,2,3,7]

  9  y =

  11  10     11     21     2     3     7

  13  >> polyfit(x,y,2)

  15  ans =

  17  −0.3750     0.9679     11.3000

  19  >> polyfit(x,y,3)

  21  ans =

  23  1.0833     −11.7500     35.3095     −16.0000

  ```


  拟合数据的二、三次多项式分别为 `−0.375x ² + 0.9679x + 11.3 = 0` 和 `1.0833x ³ − 11.75x ² + 35.3095x
  − 16 = 0`。


  ## 6.5 小结


  几乎所有科学和工程分支都需要你执行数值计算。MATLAB 是实现此目的的备选工具之一。MATLAB 拥有一个针对通用计算进行优化的函数库。它还拥有多种执行专门任务的软件包。这使其成为高效原型化数值计算问题的理想选择。本章总结了与数值计算过程中产生的误差相关的各种问题，以及获取误差值或量级大小的各种方法。这些量的测量很重要，因为在现实生活中，你将需要这些值来定义最终产品的精度。


  '
- "# 7. 数值计算中的近似答案\n\n## 7.1 数值近似\n\n在科学研究过程中，有时可能无法找到精确答案。与其投入大量精力通过解析求解来寻找精确答案，另一种替代方法是开发产生近似答案的方法。对于涉及像\
  \ `pi` 这样的无理数的解来说尤其如此。你可以选择与 `pi` 一起使用的有效数字位数，并确定结果的精度。\n\n所需的精度程度始终取决于目标应用。例如，在测量建筑物的长度时，我们不需要精确到原子长度（Å）。在测量人体体温时，对于大多数应用来说，我们不需要精确到两位以上的小数。在计算机更快、效率更高的时代，只要需要，就可以通过投入更多时间和内存存储来计算更高精度的结果。但这必须明智地使用。\n\
  \n\n\n## 7.2 容差\n\n当用户获得一个或多个近似答案时，必须根据应用的要求从中选出一个答案。做出此决定的方法之一是定义容差限。容差可以定义为一个单一数值或一个数值范围（包含最大值和最小值）。定义容差限的规则完全取决于具体应用。例如，在测量人的身高时，我们可以将容差定义为\
  \ 1 厘米；但与此同时，在测量人类头发的直径时，我们可能希望将精度提高到 1 微米。同样地，在测量红细胞的大小时，我们需要将精度进一步降低到 1 纳米。然而，在测量尺寸时定义容差相对简单——即容差比物体尺寸小一到两个数量级——但在其他应用中这可能并非易事。例如，测量用于建造建筑物的土地时，容差需要在零点几米；而将螺丝定位到孔中时，精度则需在零点几厘米以内。\n\
  \n在数学术语中，如果 ∈ 是容差限，`x` 代表真实值，`x^*` 代表近似值：\n\n![ $$ \\mid x-{x}^{\\ast}\\mid \\le\
  \ \\in $$ ](img/A458923_1_En_7_Chapter_Equ1.gif)\n\n(方程 7-1)\n\n在这种情况下，测量中的绝对误差\
  \ (`e[a]`) 和相对误差 (`e[r]`) 由下式给出：\n\n![ $$ {e}_a=\\mid x-{x}^{\\ast}\\mid $$ ](img/A458923_1_En_7_Chapter_Equ2.gif)\n\
  \n(方程 7-2)\n\n![ $$ {e}_r=\\frac{\\mid x-{x}^{\\ast}\\mid }{x} $$ ](img/A458923_1_En_7_Chapter_Equ3.gif)\n\
  \n(方程 7-3)\n\n因此，如果绝对误差小于或等于容差限，则该近似解或解集是可接受的。然而，如果已知 `x`，我们为什么还需要计算近似解呢？\n\n当物理系统的解未知时，可以计算出\
  \ `x^*`，然后将其与物理测量值进行比较。在这种情况下，物理测量值构成了 `x` 的值。然后，通过使用方程 7-2，我们可以计算误差。接着，可以利用某些 `x^*`\
  \ 与 `x` 相差不大（即误差影响不大）这一事实来确定容差。\n\n## 7.3 泰勒级数\n\n大多数数学函数的计算都需要许多复杂的算符——除了像 `+`、`−`、`×`\
  \ 和 `÷` 这样简单的算符之外。然而，多项式只需要这些基本算符即可计算。因此，如果其他数学函数可以用多项式表示，它们就可以相对容易地被近似。\n\n多项式定义如下：\n\
  \n![ $$ p(x)={a}_0+{a}_1x+{a}_2{x}²+\\cdots +{a}_n{x}^n $$ ](img/A458923_1_En_7_Chapter_Equ4.gif)\n\
  \n(方程 7-4) 其中 `a[n] ∈ R`（这些 a 称为系数）。对于对应 `a[n] ≠ 0` 的最大 `n`，该多项式的次数被定义为 `n`。\n\n\
  ## 7.4 泰勒多项式\n\n泰勒定理解释了如何定义大量数学函数，这些函数可以定义为多项式，称为泰勒多项式。泰勒多项式所示最终答案的精度取决于它的次数，即多项式中定义的项数。这提供了一种便捷的方法，可以根据期望的容差来定制多项式。\n\
  \n假设一个数学函数 `f(x)` 需要在 `x = a` 附近被近似。一个以 `x = a` 为中心、`n` 次的泰勒多项式 `pn` 是一个（次数至多为 `n`\
  \ 的）多项式，它在 `x = a` 处的值与 `f` 的 `n` 阶导数值相同。\n\n以下是推导泰勒多项式公式的方法：\n\n1.  零阶多项式 `p0`\
  \ 的次数至多为零。\n    *   `p0` 必须是一个常数函数（图形上是水平线函数）。\n    *   在 `x = a` 附近近似：`p0 = f(a)`。\n\
  2.  一阶多项式 `p1` 的次数至多为 1。\n\n    ![ $$ {p}_1(a)=f(a) $$ ](img/A458923_1_En_7_Chapter_Equa.gif)\n\
