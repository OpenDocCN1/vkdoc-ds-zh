  *   打开图形的网格线（第 10 行）。\n*   `xlable` 获取字符串 `x-axis` 的值（第 11 行）。\n*   `ylabel` 获取字符串\
  \ `y-axis` 的值（第 12 行）。\n*   `title` 获取字符串 `Multiple Graphs` 的值（第 13 行）。\n\n*   `clear\
  \ all` 从内存中清除变量名和值（第 1 行）。\n*   `clf` 清除当前图形窗口（第 2 行）。\n*   `x = linspace(1,100,100)`\
