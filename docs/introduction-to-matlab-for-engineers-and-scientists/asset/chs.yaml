  \ 程序\n\n从图 7-2 可以看到，当使用更高阶的项来描述`cos(x)`时，拟合精度不断提高，误差随之降低。为了达到理想拟合效果，必须使用非常多的项来描述近似的`cos(x)`函数。容差的选择由用户定义。根据容差值，可以确定具体的项数。\n\
  \n\n\n### 7.4.2 `e^x` 的麦克劳林级数\n\n让我们通过另一个关于 `e^x` 的麦克劳林级数的例子来探讨误差的概念：\n\n![ $$ {e}^a=1+a+\\\
  frac{a²}{2!}+\\frac{a³}{3!}+\\frac{a⁴}{4!}+\\cdots $$ ](img/A458923_1_En_7_Chapter_Equ8.gif)\n\
  \n（方程 7-8）\n\n出于编程的考虑，推导出麦克劳林级数各项之间的内在关系更为简便。第一项是数字 1，但此后，每一项都可以通过将前一项乘以以下方程得到：\n\
  \n![ $$ \\frac{a}{n} $$ ](img/A458923_1_En_7_Chapter_Equ9.gif)\n\n（方程 7-9）其中 `n`\
  \ 代表第 `n` 项。这一事实在 `MaclaurinExp.m` 代码（见代码清单 7-3）中得到了应用。在该代码中，第一项在第 5 行被定义在变量 `expVal`\
  \ 中，然后该变量被加到 `currentTerm` 变量上，而 `currentTerm` 仅仅是利用方程 7-9 中的公式计算得出的。\n\n```\n1\
  \  %exp(0.1)的麦克劳林级数\n\n3  n = 5; %项数\n4  a = 0.1; %eˆ(x) 中 x 的函数值\n5  expVal = 1.0;\n\
  6  currentTerm = 1.0;\n7  for i=1:n\n8    currentTerm = currentTerm*a/i;\n9    expVal\
  \ = expVal+currentTerm\n10  endfor\n\n12  trueVal = exp(0.1);\n13  error = abs(trueVal\
  \ −expVal)\n代码清单 7-3\nMaclaurinExp.m 程序\n```\n\n输出显示如下：\n\n```\n1  >> MaclaurinExp\n\
  2  expVal = 1.1000\n3  expVal = 1.1050\n4  expVal = 1.1052\n5  expVal = 1.1052\n\
  6  expVal = 1.1052\n7  error = 1.4090e −09\n8  >> format long\n9  >> MaclaurinExp\n\
  10  expVal = 1.10000000000000\n11  expVal = 1.10500000000000\n12  expVal = 1.10516666666667\n\
  13  expVal = 1.10517083333333\n14  expVal = 1.10517091666667\n15  error  = 1.40898115397192e−09\n\
  ```\n\n请注意，虽然数值显示通常只设置为小数点后四位，但 `format long` 命令提高了这一精度（`format short` 命令则恢复为默认行为）。因此，你可以清晰地观察到，通过增加项数，误差会急剧减小，逐渐接近真实值，并且仅用五项就能达到\
  \ `10^(−9)` 量级的误差。\n\n如果你希望将所有计算出来的值都存储在 `expVal` 变量中，必须将其定义为一个向量，如代码清单 7-4（`MaclaurinExp1.m`\
  \ 程序）所示。\n\n```\n1  %exp(0.1)的麦克劳林级数\n\n3  n = 5; %项数\n4  a = 0.1; % eˆ(x) 中 x 的函数值\n\
  5  expVal = 1.0;\n6  currentTerm = 1.0;\n7  for i =1:n\n8    currentTerm = currentTerm*a/i;\n\
  9    expVal(i+1) = expVal(i)+currentTerm;\n10  endfor\n\n12  trueVal = exp(0.1);\n\
  13  error = abs(trueVal−expVal)\n代码清单 7-4\nMaclaurinExp1.m 程序\n```\n\n在这里，第 9 行指出第\
  \ `(i+1)` 项是根据方程 7-9 并使用前一项（即第 `(i)` 项）进行修改的。还要注意，通过使用 `;` 运算符，第 9 行的打印被抑制了。输出如下所示：\n\
  \n```\n1  >> MaclaurinExp1\n2  error =\n\n4  1.0517e−01   5.1709e−03   1.7092e−04\
  \   4.2514e−06 8.4742e−08   1.4090e−09\n5  >>>plot(error,'r*−')\n```\n\n使用 `plot(error,'r*-')`\
  \ 命令，你可以生成绘制误差值的图形（`'r*-'` 参数表示用规则连接的红色星号）。如图 7-3 所示。\n\n![A458923_1_En_7_Fig3_HTML.gif](img/A458923_1_En_7_Fig3_HTML.gif)\n\
  \n图 7-3\n\n计算 `e^(0.1)` 时随项数增加的误差\n\n由于每增加一项，误差都会下降几个数量级，因此在对数坐标图中可以最好地观察到这一效果。这可以通过使用\
  \ `semilogy(error,'r*-')` 命令生成。将生成图 7-4。\n\n![A458923_1_En_7_Fig4_HTML.gif](img/A458923_1_En_7_Fig4_HTML.gif)\n\
  \n图 7-4\n\n计算 `e^(0.1)` 时随项数增加的误差\n\n似乎超过 10 项后，误差就趋于平稳了。但你会看到，这是一个错误的结果，因为该图形将取决于你所用计算设备的最小计数单位。\n\
  \n#### 需要多少项？\n\n从图 7-4 中你可以观察到，在计算 `e^(0.1)` 时，通过增加项数，你可以将误差降低两个数量级。但是，这是否意味着要达到真实值，就必须包含无限多的项呢？毕竟，每增加一个新项，你都需要投入时间和计算资源。通常来说，当使用\
  \ `n` 项时，麦克劳林级数的精度为 `a^(n+1)`：\n\n![ $$ {e}^a=1+a+\\frac{a²}{2!}+\\frac{a³}{3!}+\\\
  frac{a⁴}{4!}+\\dots +\\frac{a^n}{n!}+O\\left({a}^{n+1}\\right) $$ ](img/A458923_1_En_7_Chapter_Equ10.gif)\n\
  \n（方程 7-10）\n\n从分析的角度，你可以选择任意大的 `n`，但在计算设备上无法做到这一点。接下来将探讨其原因。\n\n图 7-4 显示了一个有趣的现象：超过\
  \ 10 项后，误差不再按数量级变化，而是趋于平稳。这是一个具有误导性的结果。每台计算设备在存储最小浮点数方面都有极限。这可以通过发出 `eps` 命令来获取。运行该程序的系统显示以下输出。\n\
  \n```\n1  >> error(9:12)\n2  ans =\n\n4  3.10862446895044e−15  4.44089209850063e−16\
  \  4.44089209850063e−16  4.44089209850063e−16\n5  >>> eps\n6  ans = 2.22044604925031e−16\n\
  ```\n\n你现在可以看到，当误差值非常接近 `eps` 值时，它们就无法再被可靠地存储了。命令 `error(9:12)` 输出了一个类似的观点。可以看出，尽管第\
  \ 9 项产生的误差量级为 `10^(−15)`，但从第 11 项开始，数值都相似，量级为 `10^(−16)`。这样做是为了让计算机避免因超出由 `eps`\
  \ 值定义的限制而导致计算崩溃。\n\n`eps` 命令给出机器精度。`help('eps')` 命令显示了 `eps` 命令的文档及其用法。从技术上讲，`eps`\
  \ 是机器浮点系统中任意两个相邻数字之间的相对间距，即计算设备的最小计数单位。这个数字显然依赖于系统，因为你可以设计专门的硬件来提升机器精度。事实上，在需要更高精度时（例如导弹制导、太空导航等）就会这样做。在支持\
  \ IEEE 浮点运算的设备上，双精度的 `eps` 约为 `2.2204 × 10^(−16)`，单精度的 `eps` 约为 `1.1921 × 10^(−7)`。\n\
  \n有趣的是，`2^(-25) ≈ 2.2204 × 10^(-16)`。这本质上是说，软件的双精度模式可以存储小数点后 52 位数字。你将在本章的“计算误差”部分了解更多相关内容，该部分讨论了数值计算中的机器精度方面以及了解特定数值问题所需运算精度的重要性。\n\
  \n`realmax`、`realmin`、`intmax` 和 `intmin` 命令显示了安装该软件的特定机器上实数和整数的最大值和最小值。\n\n```\n\
  1  >> realmax\n2  ans = 1.79769313486232e+308\n3  >> intmax\n4  ans = 2147483647\n\
  5  >> realmin\n6  ans = 2.22507385850720e−308\n7  >> intmin\n8  ans = −2147483648\n\
  ```\n\n了解这些数字很有用，因为超出这些范围的数字会因为机器精度而容易产生误差。\n\n## 7.5 计算误差\n\n到目前为止，你已经了解了在计算数学函数时，因包含特定数量的项而产生的固有误差。事实上，还存在另一种误差，这是由于计算机只能存储有限长度的数字而引入的。\n\
  \n\n\n### 7.5.1 有效数字\n\n有效数字的概念在此起着重要作用。如果计算机能够存储最终答案的所有有效数字，那么误差就无关紧要。否则，在报告最终答案时，识别这些误差并尽可能加以纠正就显得很重要。例如，在处理`pi`时，如果只需要三位有效数字，那么任何低端计算解决方案都能轻松存储。\n\
  \n计算机可以将数字存储为浮点数对象。浮点数对象按如下方式存储数字：\n\n![ $$ \\pm {d}_1{d}_2\\dots {d}_s\\times {\\\
  beta}^e $$ ](img/A458923_1_En_7_Chapter_Equ11.gif)\n\n(方程 7-11)\n\n其中 ![ $$ {d}_i=0,1,2\\\
  dots \\beta -1 $$ ](img/A458923_1_En_7_Chapter_IEq5.gif) 但 ![ $$ {d}_1\\ne 0 $$\
  \ ](img/A458923_1_En_7_Chapter_IEq6.gif) 且 ![ $$ m\\le e\\le M $$ ](img/A458923_1_En_7_Chapter_IEq7.gif)\
  \ ，这里 ![ $$ m\\in {I}^{-} $$ ](img/A458923_1_En_7_Chapter_IEq8.gif) ，![ $$ M\\in\
  \ {I}^{+} $$ ](img/A458923_1_En_7_Chapter_IEq9.gif)。\n\n浮点数的三个组成部分为：\n\n- 符号（`±`）\n\
  - 尾数（`d[1]d[2]...d[s]`）\n- 指数（`β`）\n\n在 IEEE 双精度舍入标准下，MATLAB 使用二进制运算，其中：\n\n- ![\
  \ $$ \\beta =2 $$ ](img/A458923_1_En_7_Chapter_Eque.gif)\n- `s = 53`\n- `m = -1074`\n\
  - `M = +1023`\n\n由于人类习惯于十进制运算系统，为了报告结果，这些二进制数会被转换为十进制数。理解以下关键点很重要：所有内部计算都以二进制形式进行，但面向人类的输入和输出则以十进制形式提供。因转换而产生的舍入误差由单位舍入量\
  \ `u` 给出，它是在将实数近似为浮点数时的最大相对误差。\n\nMATLAB 可以处理绝对值的范围从 ![ $$ {2}^{-1074}\\simeq {10}^{-324}\
  \ $$ ](img/A458923_1_En_7_Chapter_IEq10.gif) 到 ![ $$ {2}^{-1023}\\simeq {10}^{308}\
  \ $$ ](img/A458923_1_En_7_Chapter_IEq11.gif) 的数字，其单位舍入量为 ![ $$ u={2}^{-53}\\simeq\
  \ {10}^{-16} $$ ](img/A458923_1_En_7_Chapter_IEq12.gif)。\n\n## 7.6 实数转换为浮点数的挑战\n\
  \n实数 `x` 可按浮点表示法（由方程 7-11 给出）存储为：\n\n![ $$ x=\\pm {d}_1{d}_2\\dots {d}_s{d}_{s+1}\\\
  dots \\times {10}^e $$ ](img/A458923_1_En_7_Chapter_Equ12.gif)\n\n(方程 7-12)\n\n\
  现在注意 `s = 53`，但上述描述并未限制浮点数的表示方式。然而，其存储过程则完全是另一回事。在存储时，数字会根据指导原则进行舍入并存储，即 `s = 53`。\n\
  \n### 7.6.1 上溢\n\n根据方程 7-11 和 7-12，如果 `e > M`，则称计算发生了上溢。这意味着出现了一个比可能存储范围更大的数字，从而导致存储容器溢出。在这种情况下，MATLAB\
  \ 会生成 `Inf` 或 `-Inf` 作为答案，这表示答案是一个非常大的数字。\n\n以下在 MATLAB 终端中执行的练习清晰地说明了这一过程。当尝试计算\
  \ `e900` 时，结果显示为 `Inf`。当该数字除以一个负数时，结果显示为 `-Inf`，表明在存储负数时发生了上溢。当尝试计算 `Inf - Inf`\
  \ 时，结果显示为 `NaN`（代表“非数字”），表明这些过大的数字无法产生有意义的结果。\n\n```\n1  >> format long\n2  >> exp(50)\n\
  \n4  ans =\n\n6  5.184705528587072e+21\n\n8  >> exp(100)\n\n10  ans =\n\n12  2.688117141816136e+43\n\
  \n14  >> exp(500)\n\n16  ans =\n\n18  1.403592217852837e+217\n\n20  >> exp(700)\n\
  \n22  ans =\n\n24  1.014232054735005e+304\n\n26  >> exp(900)\n\n28  ans =\n\n30\
  \  Inf\n\n32  >> exp(900)/-2\n\n34  ans =\n\n36  -Inf\n\n38  >> exp(900)-exp(900)\n\
  \n40  ans =\n\n42  NaN\n```\n\n### 7.6.2 下溢\n\n如果 `e < m`，则称发生了下溢。Octave 通过显示零和答案来表示下溢。表面上看下溢似乎不严重，但请考虑以下事实：根据指数运算的基本规则：\n\
  \n![ $$ {e}^a{e}^{-a}={e}^{a-a}={e}⁰=1 $$ ](img/A458923_1_En_7_Chapter_Equf.gif)\n\
  \n当对表示上溢和下溢的数字执行相同计算时，Octave 必须计算 `Inf * 0`，结果为 `NaN`。以下示例演示了这一点：\n\n```\n1  >>\
  \ exp(900)*exp(-900)\n\n3  ans =\n\n5  NaN\n\n7  >> exp(900)\n\n9  ans =\n\n11 \
  \ Inf\n\n13  >> exp(-900)\n\n15  ans =\n\n17  0\n```\n\n## 7.7 实数到浮点数的实际转换\n\n在了解了上溢和下溢这两个极端情况后，您需要理解实数到浮点数的转换过程。回顾方程\
  \ 7-11 和 7-12，一个实数可以用 `s` 位有效数字存储如下：\n\n![ $$ \\pm {d}_1{d}_2\\dots {d}_s\\times\
  \ {\\beta}^e $$ ](img/A458923_1_En_7_Chapter_Equg.gif)\n\n而它可以用浮点表示法（以 10 为基数）写成如下形式：\n\
  \n![ $$ x=\\pm {d}_1{d}_2\\dots {d}_s{d}_{s+1}\\dots \\times {10}^e $$ ](img/A458923_1_En_7_Chapter_Equh.gif)\n\
  \n有两种方法可以实现转换：截断法和舍入法。截断法会直接丢弃 `s` 之后的所有数字，即生成以下结果：\n\n![ $$ x=\\pm {d}_1{d}_2\\\
  dots {d}_s\\times {10}^e $$ ](img/A458923_1_En_7_Chapter_Equ13.gif)\n\n(方程 7-13)\n\
  \n另一方面，舍入法推荐以下过程：\n\n1. 如果 `s_{s+1}` < 5，则执行截断并保留 `x` 的符号。\n2. 如果 `s_{s+1}` > 5，则\
  \ `d[s]` 加 1。然后执行截断并保留 `x` 的符号。\n\n这个看似简单的方案存在一个缺陷。假设 `s = 4`，您需要对 2.9345 进行舍入。答案会是\
  \ 2.934，即最后一位数字 5 被直接丢弃。类似地，当对 2.9355 进行舍入时，答案可以写成 2.936，其中最后一位数字被丢弃，最后一位有效数字加 1。在这两种情况下，只有一个数字发生了变化。但假设您需要对\
  \ 2.9999 进行舍入。在这种情况下，结果会是 3.000，其中有四个数值发生了变化。\n\n## 7.8 MATLAB 的替代方案\n\n随着计算能力的增长、数值计算机的进步以及计算资源价格的下降，MATLAB\
  \ 已成为工程领域的语言。面对来自开源替代方案（如 Scilab [1]、Octave [2] 和 Python [3]）的挑战，它现在需要在新的维度上进行创新，以在商业和学术领域保持相关性。我关于\
  \ Octave、Scilab 和 Python 的书籍（可在亚马逊 [4, 5, 6] 上找到）与本书内容并行，以便于比较 [7]。我强烈建议您研究所有这些选项，以便为您的需求做出最佳决策。\n\
  \n## 7.9 总结\n\n现在应该清楚的是，使用数值计算对物理系统进行数学建模，并不仅仅是输入数据然后得到输出。这必须审慎进行。在有限计算精度的离散系统上执行计算这一行为本身就会引入误差。在呈现结果时必须提及这些误差，以便其他研究者可以交叉验证。尽管数值计算编码繁琐且会引入误差，但在科学家中仍然非常流行。这是因为现代计算机提供了更高的计算速度，而且对大多数物理世界问题的解析解进行人工计算过于繁琐。预计这一趋势在不久的将来仍将持续。\n\
  \n"
- '# 8. 符号计算




  ## 8.1 引言


  到目前为止，我们一直在处理数值计算，其中变量存储的是数值。在第 7 章中，你学习了数值计算涉及使用近似解。另一方面，解析解不是近似解，因为它使用符号而非数字。MATLAB
  也提供了执行符号计算的方法。


  ## 8.2 定义符号变量


  关键字 `syms` 用于定义一个或多个符号变量。符号变量的关键特性是它仅存储一个符号以执行符号计算。


  ```

  >> syms x y z

  >>

  ```


  执行该命令后，查看工作区窗口（见图 8-1），注意已创建了三个新变量——`x`、`y` 和 `z`。


  ![A458923_1_En_8_Fig1_HTML.jpg](img/A458923_1_En_8_Fig1_HTML.jpg)


  图 8-1


  工作区中出现的新符号变量


  ## 8.3 定义符号方程


  定义好变量后，就可以定义一个方程：


  ![$$ z={x}²+y $$](img/A458923_1_En_8_Chapter_Equ1.gif)


  （方程 8-1）使用这些变量如下：


  ```

  >> z = xˆ2+y

  z =

  xˆ2 + y

  ```


  在本例中，`z` 被预定义为一个符号变量。输出变量由 MATLAB 创建并默认成为符号变量。其输入已被定义为符号变量。例如，假设你想定义这个方程：


  ![$$ a={x}³+{y}²+z $$](img/A458923_1_En_8_Chapter_Equ2.gif)


  （方程 8-2）


  这将创建一个新的符号变量（可以通过检查工作区窗口来验证）。以下 MATLAB 代码执行此任务：


  ```

  >> syms x y z

  >> a = xˆ3+yˆ2+z

  a =

  xˆ3 + yˆ2 + z

  ```


  ## 8.4 执行符号计算


  符号计算与我们平时在纸上手算的方式相同。你定义一个变量，并使用代数和微积分的数学规则来执行计算。例如，一个二次方程的两个根（`r`[1] 和 `r`[2]）：


  ![$$ y=a{x}²+ bx+c $$](img/A458923_1_En_8_Chapter_Equ3.gif)


  （方程 8-3）可以写成如下形式：


  ![$$ {r}_1=\frac{-b+\sqrt{b²-4 ac}}{2a} $$](img/A458923_1_En_8_Chapter_Equ4.gif)


  （方程 8-4）


  ![$$ {r}_1=\frac{-b-\sqrt{b²-4 ac}}{2a} $$](img/A458923_1_En_8_Chapter_Equ5.gif)


  （方程 8-5）


  这可以使用以下 MATLAB 代码执行：


  ```

  >> syms a b c x

  >> y = a*(xˆ2)+(b*x)+c

  y =

  a*xˆ2 + b*x + c

  >> solve(y)

  ans =

  −(b + (bˆ2 − 4*a*c)ˆ(1/2))/(2*a)

  −(b − (bˆ2 − 4*a*c)ˆ(1/2))/(2*a)

  ```


  类似地，符号数学表达式可以进行积分和微分，如下所示：


  ```

  >> syms a b c x

  >> y = a*(xˆ2)+(b*x)+c

  y =

  a*xˆ2 + b*x + c

  >> int(y)

  ans =

  (a*xˆ3)/3 + (b*xˆ2)/2 + c*x

  >> diff(y)

  ans =

  b + 2*a*x

  ```


  这可以通过手算在纸上验证，我们知道以下内容：


  ![$$ y=a{x}²+ bx+c $$](img/A458923_1_En_8_Chapter_Equ6.gif)


  （方程 8-6）


  ![$$ \int y=\frac{a{x}³}{3}+\frac{b{x}²}{2}+ cx $$](img/A458923_1_En_8_Chapter_Equ7.gif)


  （方程 8-7）


  ![$$ \frac{dy}{dx}=2 ax+b $$](img/A458923_1_En_8_Chapter_Equ8.gif)


  （方程 8-8）


  ### 8.4.1 算术表达式


  简单的算术表达式可以使用符号来处理。例如，可以用两个多项式来定义一个新的多项式。


  ```

  >> syms x y z

  >> a1 = xˆ2+2*y+z

  a1 =

  xˆ2 + 2*y + z

  >> a2 = xˆ(−2)−2*y+3*z

  a2 =

  3*z − 2*y + 1/xˆ2

  >> a3 = a1/a2

  a3 =

  (xˆ2 + 2*y + z)/(3*z − 2*y + 1/xˆ2)

  >> a4 = a1*a2

  a4 =

  (xˆ2 + 2*y + z)*(3*z − 2*y+1/xˆ2)

  ```


  ### 8.4.2 三角表达式


  使用符号变量定义的三角变量也可用于数学计算，如下所示：


  ![$$ y=\sin (x) $$](img/A458923_1_En_8_Chapter_Equ9.gif)


  （方程 8-9）


  ![$$ \frac{dy}{dx}=-\cos (x) $$](img/A458923_1_En_8_Chapter_Equ10.gif)


  （方程 8-10）


  ```

  >> syms a b c x

  >> y = sin(x)

  y =

  sin(x)

  >> int(y)

  ans =

  −cos(x)

  ```


  甚至更复杂的计算只需一键即可完成。


  ```

  >> z = cos(xˆ(1/2)) − (sin(y))ˆ(1/3)

  z =

  cos(xˆ(1/2)) − sin(y)ˆ(1/3)

  >> int(z)

  ans =

  2*cos(xˆ(1/2)) − x*sin(y)ˆ(1/3) + 2*xˆ(1/2)*sin(xˆ(1/2))

  >> diff(z)

  ans =

  −sin(xˆ(1/2))/(2*xˆ(1/2))

  ```




  ### 8.4.3 表达式的展开与因式分解


  `expand()` 函数可用于将方程写成展开后多项式的各项形式。`expand()` 最重要的用途是应用分配律，将积的和重写为和的积。如果 `f` 代表一个符号表达式，则
  `expand(f)` 通过以下规则集进行计算：


  *   ![$$ {x}^{a+b}={x}^a\times {x}^b $$](img/A458923_1_En_8_Chapter_Equa.gif)

  *   ![$$ {(xy)}^b={x}^b\times {y}^b\forall x,y\ge 0,b\in I $$](img/A458923_1_En_8_Chapter_Equb.gif)

  *   ![$$ {\left({x}^a\right)}^b={x}^{a+b} $$](img/A458923_1_En_8_Chapter_Equc.gif)


  还需要注意的是，`expand()` 函数会递归地对给定表达式的子表达式进行展开。


  ```

  1  >> syms x y z

  2  >> a1 = xˆ2+2*y+z

  3  a1 =

  4  xˆ2 + 2*y + z

  5  >> a2 = xˆ(−2)−2*y+3*z

  6  a2 =

  7  3*z − 2*y + 1/xˆ2

  8  >> a3 = a1/a2

  9  a3 =

  10  (xˆ2 + 2*y + z)/(3*z − 2*y + 1/xˆ2)

  11  >> a4 = a1*a2

  12  a4 =

  13  (xˆ2 + 2*y + z)*(3*z − 2*y + 1/xˆ2)

  14  >> a5 = expand(a3)

  15  a5 =

  16  (2*y)/(3*z − 2*y + 1/xˆ2) + z/(3*z − 2*y + 1/xˆ2) + xˆ2/(3*z − 2*y + 1/xˆ2)

  17  >> a6 = expand(a4)

  18  a6 =

  19  4*y*z + (2*y)/xˆ2 − 2*xˆ2*y + z/xˆ2 + 3*xˆ2*z − 4*yˆ2 + 3*zˆ2 + 1

  ```


  名为 `factor` 的函数生成一个表达式的因式，使得所有因式相乘的结果等于原表达式。让我们尝试对符号变量 `a5` 和 `a6` 中存储的值进行因式分解。


  ```

  1  >> a7 = factor(a5)

  2  a7 =

  3  [−1,x,x, xˆ2 + 2*y + z, −1/(3*xˆ2*z − 2*xˆ2*y + 1)]

  4  >> a8 = factor(a5)

  5  a8 =

  6  [−1,x,x, xˆ2 + 2*y + z, −1/(3*xˆ2*z − 2*xˆ2*y + 1)]

  ```


  这些因式以数组元素的形式存在，可以通过其索引进行访问。这在提取因式并将其用于数学分析时非常方便。


  ```

  1  >> a7[2] = x

  2  >> a7[4] = xˆ2 + 2*y + z

  3  >> a8[3:5] = [x, xˆ2 + 2*y + z, −1/(3*xˆ2*z − 2*xˆ2*y + 1)]

  ```


  在上一个示例中，`a7[2]` 提取变量 `a7` 的第二个元素，`a7[4]` 提取变量 `a7` 的第四个元素，而 `a8[3:5]` 提取从第三个到第五个的所有元素，并将其存储为符号表达式列表。


  当一个表达式是另一个表达式的幂时，`expand()` 的作用方式与数学规则一致。例如，考虑定义了一个表达式：


  ![$$ a=x{y}^{\left(z+y\right)} $$](img/A458923_1_En_8_Chapter_Equd.gif)


  其展开形式为：


  ![$$ x\times {y}^y\times {y}^z $$](img/A458923_1_En_8_Chapter_Eque.gif)


  每一项显然都是该表达式的一个因式。这可以通过以下 MATLAB 代码验证：


  ```

  1  >> syms x y z

  2  >> a = x*yˆ(z+y)

  3  a =

  4  x*yˆ(y + z)

  5  >> b = expand(a)

  6  b =

  7  x*yˆy*yˆz

  8  >> c = factor(b)

  9  c =

  10  [x,yˆy,yˆz]

  ```


  当一个表达式是另一个表达式的指数时，`expand()` 函数会递归地工作。


  ```

  1  >> a=((x+y)ˆ(x+z+2))

  2  a =

  3  (x + y)ˆ(x + z + 2)

  4  >> expand(a)

  5  ans =

  6  xˆ2*(x + y)ˆx*(x + y)ˆz + yˆ2*(x + y)ˆx*(x + y)ˆz + 2*x*y*(x + y)ˆx*

  (x + y)ˆz

  ```


  它可用于检验三角恒等式：


  ```

  1  >> expand(sin(x+y))

  2  ans =

  3  cos(x)*sin(y) + cos(y)*sin(x)

  4  >> expand(cos(x+y))

  5  ans =

  6  cos(x)*cos(y) − sin(x)*sin(y)

  7  >> expand(tan(x+y))

  8  ans =

  9  −(tan(x) + tan(y))/(tan(x)*tan(y) − 1)

  10  >> expand(sec(x+y))

  11  ans =

  12  1/(cos(x)*cos(y) − sin(x)*sin(y))

  13  >> a = cosh(x+y)

  14  a =

  15  cosh(x+y)

  16  >> expand(a)

  17  ans =

  18  cosh(x)*cosh(y) + sinh(x)*sinh(y)

  19  >> a = cosh(2*x)

  20  a =

  21  cosh(2*x)

  22  >> expand(a)

  23  ans =

  24  2*cosh(x)ˆ2 − 1

  25  >> a = coth(x+y)

  26  a =

  27  coth(x + y)

  28  >> expand(a)

  29  ans =

  30  (coth(x)*coth(y) + 1)/(coth(x) + coth(y))

  ```


  ## 8.5 小结


  本章阐述了如何使用符号来求解数学方程。当容易出错的数值计算不被接受时，符号计算被证明非常有用，但它也有其局限性。有限的内置函数集必须由用户自定义函数来补充，这需要编写
  MATLAB 程序包的经验。但这绝对是值得探索的。


  本书阐述了如何使用 MATLAB 作为高效科学计算的工具。它首先通过单行命令说明了基本用法，然后阐述了如何将多行命令编写成一个 `.m` 文件。数组是科学计算的基础模块，因此可以使用数组进行基于矩阵的计算。绘图被简化到即使是初学者也能轻松绘制方程图形以可视化图形的程度。通过使用循环和函数，程序可以实现模块化，并且信息流可以得到有效控制。您还看到了一些数值计算的基本示例。本书应能使任何初学者轻松进入科学计算的世界。其广泛流行的用法恰如其分地印证了“MATLAB
  是工程领域的语言”这一说法。




