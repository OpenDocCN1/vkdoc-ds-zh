  \n图 3-4：同一图形内独立的多个子图\n\n### 3.1.2 `bar()`、`barh()` 和 `hist()` 命令\n\n条形图是一种原始但非常有效的统计信息可视化方式。绘制条形图和直方图有三种选项。\n\
