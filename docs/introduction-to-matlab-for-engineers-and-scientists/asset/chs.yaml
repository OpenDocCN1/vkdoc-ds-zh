  对数组进行运算涉及两个方面：\n\n- 对两个或多个数组进行运算\n- 逐元素运算\n\n所有算术运算符（如`+`、`-`、`*`、`/`、`%`、`^`等）在两种情况下都可以使用。当需要进行逐元素运算时，需要在运算符前加上一个`.`（点）。逐元素运算符就变成了`.+`、`.-`、`.*`、`./`、`.%`和`.^`。下面的示例会让这一点更加清晰。\n\
  \n```\n1  >> a = [1,2;3,4]\n2  a =\n\n4  1    2\n5  3    4\n\n7  >> b = [5,6;7,8]\n\
  8  b =\n\n10  5    6\n11  7    8\n\n13  >> a+b\n14  ans =\n\n16  6    8\n17  10\
  \   12\n\n19  >> 2.+a\n20  ans =\n\n22  3    4\n23  5    6\n\n25  >> –10.+b\n26\
  \  ans =\n\n28  –5   –4\n29  –3   –2\n```\n\n当`a`和`b`是要相加/相减的矩阵时，其元素会与相同位置的元素进行相加/相减。因此，两个矩阵的大小必须相同。另一方面，当你写`2.+a`时，是将数字\
  \ 2 逐一加到每个元素上。这可以忽略矩阵大小进行，并且统一应用于矩阵的所有元素。\n\n## 2.5 内置函数\n\n大量内置函数提供了计算数组属性以便快速计算的功能。这些包括：\n\
  \n- 使用`sum()`函数对所有元素求和。\n- 使用`prod()`求数组所有元素的乘积。\n- 使用`length()`求数组的长度。\n- 使用`mean()`函数求数组元素的平均值。\n\
  - 使用数组的`max()`和`min()`查找元素中的最大值和最小值。\n- 使用`find()`函数根据逻辑表达式查找特定元素。\n- 取整函数如下：\n\
  \  - 使用`fix()`函数将数组元素向零方向舍入为最接近的整数。\n  - 使用`floor()`函数将数组元素向负无穷方向舍入为最接近的整数。\n  -\
  \ 使用`ceil()`函数将数组元素向正无穷方向舍入为最接近的整数。\n  - 使用`round()`函数将数组元素舍入为最接近的整数。\n- 使用`sort()`函数按升序或降序对数组元素进行排序。\n\
  \n它们的用法如下所示：\n\n```\n1  >> A = 1:5\n2  A =\n3  1     2     3     4     5\n4  >>\
  \ sum(A)\n5  ans =\n6  15\n7  >> prod(A)\n8  ans =\n9  120\n10  >> length(A)\n11\
  \  ans =\n12  5\n13  >> mean(A)\n14  ans =\n15  3\n16  >> max(A)\n17  ans =\n18\
  \  5\n19  >> min(A)\n20  ans =\n21  1\n22  >> find(A>4)\n23  ans =\n24  5\n25  >>\
  \ find(A> A= –1.1:0.5:1.1\n29  A =\n30  –1.1000   –0.6000   –0.1000   0.4000   0.9000\n\
  31  >> fix(A)\n32  ans =\n33  –1     0     0     0     0\n34  >> floor(A)\n35  ans\
  \ =\n36  –2    –1    –1     0     0\n37  >> ceil(A)\n38  ans =\n39  –1    0    \
  \  0     1     1\n40  >> round(A)\n41  ans =\n42  –1   –1      0     0     1\n43\
  \  >> A = [2,4.4,2,7,0,–2]\n44  A =\n45  2.0000    4.4000    2.0000    7.0000  \
  \       0    –2.0000\n46  >> sort(A,'ascend')\n47  ans =\n48  –2.0000        0 \
  \   2.0000    2.0000    4.4000     7.0000\n49  >> sort(A,'descend')\n50  ans =\n\
  51  7.0000     4.4000   2.0000    2.0000         0    –2.0000\n```\n\n## 2.6 矩阵代数\n\
  \n矩阵的算术运算可分为两类：\n\n- 代数运算（在第 2 章中介绍）\n- 矩阵运算\n\n### 2.6.1 矩阵的代数运算\n\n矩阵的代数运算涉及逐元素运算。例如：\n\
  \n```\n1  >> a = [1,2;3,4;5,6]\n2  a =\n3  1     2\n4  3     4\n5  5     6\n6  >>\
  \ a+2\n7  ans =\n8  3     4\n9  5     6\n10  7     8\n```\n\n注意，`a`定义了一个 3×2 矩阵，因此`a+2`命令对`a`与数字\
  \ 2 进行逐元素加法。从计算角度讲，这是通过创建一个所有元素都为数字 2 的 3×2 矩阵，然后进行加法来实现的。\n\n类似地，此处展示了其他一些运算：\n\
  \n```\n1  >> 2*a\n2  ans =\n3  2     4\n4  6     8\n5  10    12\n6  >> 2–a\n7  ans\
  \ =\n8  1     0\n9  –1    –2\n10  –3    –4\n11  >> a–2\n12  ans =\n13  –1    0\n\
  14  1     2\n15  3     4\n16  >> a/2\n17  ans =\n18  0.5000    1.0000\n19  1.5000\
  \    2.0000\n20  2.5000    3.0000\n```\n\n问题始于其他算术运算。例如，当我们想计算`a²`时，这意味着将`a`与自身相乘，即矩阵乘法。这要求要么矩阵是方阵，要么内部维度匹配，因为一个\
  \ n×m 维的矩阵只能与一个`m×t`维的矩阵相乘，结果矩阵的维度为`n×t`。因此，命令`a²`会导致错误信息，如下所示：\n\n```\n1  >> a²\n\
  2  使用 ^ 时出错\n3  输入必须为标量和方阵。\n4  要进行逐元素幂运算，请使用 POWER (.^)。\n```\n\n如果我们想要计算矩阵`a`的逐元素平方，那么`错误信息`的最后一行就派上用场了。在幂运算符（`.^`）前加一个点运算符，会指示\
  \ MATLAB 执行相同的逐元素运算。\n\n```\n1  >> a.²\n2  ans =\n3  1    4\n4  9   16\n5  25  36\n\
  ```\n\n另一方面，两个矩阵的乘法是矩阵代数的范畴，接下来讨论。\n\n### 2.6.2 矩阵的矩阵运算\n\n熟悉矩阵代数的人都知道，矩阵的乘法和除法并非直接了当的任务。一个`m×n`矩阵只能与一个`n×t`矩阵相乘，结果得到一个`a×c`矩阵。这是通过将行的元素与列的元素相乘来获得新元素来完成的。\n\
  \n```\n1  >> a = rand(2,3)\n\n3  a =\n\n5  0.8147     0.1270    0.6324\n6  0.9058\
  \     0.9134    0.0975\n\n8  >> b = rand(3,4)\n\n10  b =\n\n12  0.2785     0.9649\
  \    0.9572    0.1419\n13  0.5469     0.1576    0.4854    0.4218\n14  0.9575   \
  \  0.9706    0.8003    0.9157\n15  >> c = rand(2,3)\n\n17  c =\n\n19  0.7922   \
  \  0.6557    0.8491\n20  0.9595     0.0357    0.9340\n\n22  >> a.*c\n\n24  ans =\n\
  \n26  0.6454     0.0833    0.5370\n27  0.8691     0.0326    0.0911\n```\n\n这里，矩阵`a`、`b`和`c`使用`rand`函数（该函数生成\
  \ 0 到 1 之间均匀分布的随机数）定义。现在，`a*b`执行矩阵乘法，而`a.*c`执行逐元素乘法。两者的要求如下：\n\n- 对于矩阵乘法，内部维度必须匹配。\n\
  - 对于逐元素乘法，所有维度必须匹配。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n###\
  \ 2.6.2 矩阵求逆与转置\n\n#### 转置\n\n单个井号标记（`'`），也称为撇号，用于转置矩阵（行变成列，列变成行）。对矩阵进行除法运算涉及矩阵求逆。\n\
  \n```\n1  >> a\n\n3  a =\n\n5  1    2\n6  3    4\n7  5    6\n8  >> pinv(a)\n9  ans\
  \ =\n\n11  –1.3333    –0.3333    0.6667\n12  1.0833     0.3333   –0.4167\n13  >>\
  \ b\n\n15  b =\n\n17  5    6\n18  7    8\n19  >> pinv(b)\n\n21  ans =\n\n23  –4.0000\
  \    3.0000\n24  3.5000   –2.5000\n```\n\n#### 逆矩阵\n\n矩阵 `a` 的逆矩阵，记为 `a^(-1)`，是一个满足如下条件的矩阵：\n\
  \n`a * a^(-1) = I`\n\n其中 `I` 是单位矩阵。如果给定的矩阵是方阵，则可以使用函数 `inv()`；否则，使用函数 `pinv()`。示例如下：\n\
  \n```\n1  >> a = [1,2;3,4;5,6]\n\n3  a =\n\n5  1     2\n6  3     4\n7  5     6\n\
  \n9  >> pinv(a)\n\n11  ans =\n\n13  –1.3333      –0.3333      0.6667\n14  1.0833\
  \       0.3333     –0.4167\n\n16  >> pinv(a)*a\n\n18  ans =\n\n20  1.0000     0.0000\n\
  21  –0.0000    1.0000\n\n23  >> a = rand(5,5)\n\n25  a =\n\n27  0.9649    0.8003\
  \    0.9595    0.6787    0.1712\n28  0.1576    0.1419    0.6557    0.7577    0.7060\n\
  29  0.9706    0.4218    0.0357    0.7431    0.0318\n30  0.9572    0.9157    0.8491\
  \    0.3922    0.2769\n31  0.4854    0.7922    0.9340    0.6555    0.0462\n\n33\
  \  >> inv(a)\n\n35  ans =\n\n37   2.5545    –0.3119    –0.0173    –0.4492   –1.9962\n\
  38  –4.9167    –0.1095     0.8740     2.7919    2.5562\n39   3.3797    –0.1001 \
  \   –1.3938    –1.5253   –0.8910\n40  –0.6203     0.4252     0.9340    –1.0120 \
  \   1.2230\n41  –2.0554     1.1445     0.1203     2.0420   –0.5531\n\n43  >> a_pinv(a)\n\
  \n45  ans =\n\n47   1.0000   –0.0000    0.0000   –0.0000   –0.0000\n48   0.0000\
  \    1.0000   –0.0000   –0.0000    0.0000\n49  –0.0000    0.0000    1.0000    0.0000\
  \    0.0000\n50   0.0000   –0.0000   –0.0000    1.0000   –0.0000\n51  –0.0000  \
  \  0.0000    0.0000    0.0000    1.0000\n```\n\n`I` 被称为单位矩阵，因为它的所有对角元素都是 1，所有非对角元素都是\
  \ 0，这使得它的行列式为 1。矩阵 `a` 的行列式使用命令 `det(a)` 计算。使用命令 `eye(a,b)` 可以自动生成单位矩阵，其中 `a` 和\
  \ `b` 分别是行数和列数的值。\n\n```\n1  >> eye(2,2)\n2  ans =\n\n4  1    0\n5  0    1\n6  >>\
  \ det(eye(2,2))\n7  ans =\n\n9  1\n10  >> eye(4,5)\n11  ans =\n\n13  1    0    0\
  \    0    0\n14  0    1    0    0    0\n15  0    0    1    0    0\n16  0    0  \
  \  0    1    0\n```\n\n#### rank()\n\n矩阵的秩，即线性无关的行或列的数量，可以通过内置的 `rank()` 函数来确定。\n\
  \n```\n1  a = ones(5,3)\n\n3  a =\n\n5  1    1    1\n6  1    1    1\n7  1    1 \
  \   1\n8  1    1    1\n9  1    1    1\n\n11  >> rank(a)\n\n13  ans =\n\n15  1\n\n\
  17  >> a = rand(3,2)\n\n19  a =\n\n21  0.4456    0.7547\n22  0.6463    0.2760\n\
  23  0.7094    0.6797\n\n25  >> rank(a)\n\n27  ans =\n\n29  2\n```\n\n### 2.6.3 trace()\n\
  \n矩阵对角元素之和称为矩阵的迹。这由内置的 `trace()` 函数给出，如下所示：\n\n```\n1  >> a = ones(4,4)\n\n3  a\
  \ =\n\n5  1    1    1    1\n6  1    1    1    1\n7  1    1    1    1\n8  1    1\
  \    1    1\n\n10  >> trace(a)\n\n12  ans =\n\n14  4\n```\n\n#### norm()\n\n`norm()`\
  \ 函数计算矩阵的 2-范数，它等于向量的欧几里得长度。\n\n```\n1  >> A = [1,2;3,4;5,6]\n\n3  A =\n\n5  1 \
  \    2\n6  3     4\n7  5     6\n\n9  >> norm(A)\n\n11  ans =\n\n13  9.5255\n\n15\
  \  >> A = [1,2,3]\n\n17  A =\n\n19  1     2     3\n\n21  >> norm(A)\n\n23  ans =\n\
  \n25  3.7417\n```\n\n#### 逻辑运算\n\n两个矩阵可以逐元素地进行比较。\n\n```\n1  >> a = rand(2,3)\n\n\
  3  a =\n\n5  0.6787    0.7431    0.6555\n6  0.7577    0.3922    0.1712\n\n8  >>\
  \ b = rand(2,3)\n\n10  b =\n\n12  0.7060    0.2769    0.0971\n13  0.0318    0.0462\
  \    0.8235\n\n15  >> c = (a< b)\n\n17  c =\n\n19  1    0    0\n20  0    0    1\n\
  \n22  >> whos\n24  Name      Size            Bytes    Class     Attributes\n\n26\
  \  a         2x3                48    double\n27  b         2x3                48\
  \    double\n28  c         2x3                 6    logical\n29  >> a+c\n\n31  ans\
  \ =\n\n33  1.6787   0.7431   0.6555\n34  0.7577   0.3922   1.1712\n```\n\n矩阵 `c`\
  \ 的元素为 1 或 0，通过判断 `a` 的对应元素是否小于 `b` 来赋值。注意，使用 `whos` 命令，我们可以探查变量 `a`、`b` 和 `c`。矩阵\
  \ `c` 包含逻辑数据类型，即 1 和 0 代表布尔量 `True` 和 `False`。但是执行 `a+c` 操作会将其视为数值。这种特性可能导致错误计算，因此一些编程语言（如\
  \ Python）明确使用 `True` 和 `False` 来表示布尔值，而不是 1 和 0。\n\n### 2.6.4 多项式与数组\n\n每个矩阵都有一个与之关联的特征多项式。它可以使用\
  \ `poly()` 函数找到。让我们看一个例子：\n\n```\n1  >> A1 = [–3 2 0 4]\n\n3  A1 =\n\n5  –3    \
  \ 2     0     4\n\n7  >> B1 = poly(A1)\n\n9  B1 =\n\n11  1    –3    –10    24  \
  \  0\n\n13  >> A2 = [1,2;3,4]\n\n15  A2 =\n\n17  1    2\n18  3    4\n\n20  >> B2\
  \ = poly(A2)\n\n22  B =\n\n24  1.0000    –5.0000    –2.0000\n```\n\n在第一个例子中，得到的多项式（由\
  \ `B1` 给出）是 `x⁴ - 3x³ - 10x² + 24x`，而在第二个例子中（由 `B2` 给出），是 `x² - 5x - 2`。结果矩阵呈现了特征多项式的系数。\n\
  \n#### find()\n\n内置函数 `find()` 返回矩阵中非零元素的行和列索引。例如，在由 `A = [1,0;0,2]` 定义的 2×2 矩阵中，非零元素位于\
  \ `A(1,1)` 和 `A(2,2)`。此处展示了作为向量的行和列信息：\n\n```\n1  >> A = [1,0;0,2]\n\n3  A =\n\n\
  5  1    0\n6  0    2\n\n8  >> [row,col,v]=find(A)\n\n10  row =\n\n12  1\n13  2\n\
  \n16  col =\n\n18  1\n19  2\n\n22  v =\n\n24  1\n25  2\n```\n\n#### sort()\n\n内置函数\
  \ `sort()` 可用于按特定顺序对每列的元素进行排序。顺序可以作为函数的第二个参数以字符串形式指定（`ascend` 或 `descend`）。\n\n\
  ```\n1  >> A = [1,–2,3;4,5,–2;0,–2,3]\n\n3  A =\n\n5  1    –2    3\n6  4     5 \
  \  –2\n7  0    –2    3\n\n9  >> sort(A)\n\n11  ans =\n\n13  0    –2    –2\n14  1\
  \    –2     3\n15  4     5     3\n\n17  >> sort(A,'ascend')\n\n19  ans =\n\n21 \
  \ 0    –2    –2\n22  1    –2     3\n23  4     5     3\n\n25  >> sort(A,'descend')\n\
  \n27  ans =\n\n29  4    5    3\n30  1   –2    3\n31  0   –2   –2\n```\n\n\n```markdown\n\
  \n## 2.7 随机矩阵\n\n使用随机数生成器可以创建随机矩阵。使用 `rand(a,b)` 命令：\n\n```\n>> rand(4,5)\nans =\n\
  \nColumns 1 through 4\n\n0.8147    0.6324    0.9575    0.9572\n0.9058    0.0975\
  \    0.9649    0.4854\n0.1270    0.2785    0.1576    0.8003\n0.9134    0.5469  \
  \  0.9706    0.1419\n\nColumn 5\n\n0.4218\n0.9157\n0.7922\n0.9595\n```\n\n请注意，即使是同一台机器，每次生成的数字也会不同，因为它们本质上是随机的。默认情况下，它们均匀分布在区间\
  \ (0, 1) 内。一个向量简单来说就是一个行向量，因此可以使用 `rand(a)` 命令随机生成。`help rand` 提供了随机数生成器其他各种功能和参数的详细描述。\n\
  \n要创建随机整数，可以使用 `randi()` 函数。你还可以为这些随机整数指定一个范围。例如，`randi([1,10],1,5)` 将创建 5 个在 1\
  \ 到 10 之间的随机整数（一个 1×5 的数组）。另一方面，`randi([1,10],5)` 将创建一个在 1 到 10 之间的随机整数数组（一个 5×5\
  \ 的数组）。\n\n```\n>> randi([1,10],5)\n\nans =\n\n5    3    5    8    10\n5    7  \
  \ 10    3     6\n7    7    4    6     2\n8    2    6    7     2\n8    2    3   \
  \ 9     3\n\n>> randi([1,10],1,5)\n\nans =\n\n9    3    9    3    10\n```\n\n可以使用\
  \ `rand` 命令生成一个随机复数，如下所示：\n\n```\n>> rand + i* rand\n\nans =\n\n0.3500 + 0.1966i\n\
  \n>> rand + i* rand\n\nans =\n\n0.2511 + 0.6160i\n```\n\n有时，你可能希望每次程序执行时生成相同的随机数集。这可以通过使用\
  \ `rng` 命令设置随机数函数的状态来实现，如下所示：\n\n```\n>> state1 = rng;\n>> r1 = rand(2,3)\n\nr1\
  \ =\n\n0.4733    0.8308    0.5497\n0.3517    0.5853    0.9172\n\n>> r12 = rand(2,3)\n\
  \nr12 =\n\n0.2858    0.7537    0.5678\n0.7572    0.3804    0.0759\n\n>> rng(s);\n\
  未定义函数或变量 's'。\n\n>> rng(state1);\n>> r3 = rand(2,3)\n\nr3 =\n\n0.4733    0.8308\
  \    0.5497\n0.3517    0.5853    0.9172\n```\n\n状态被保存在 `state1` 变量中，然后 `r1` 和 `r2`\
  \ 创建了两个 2×3 大小的数组。它们包含不同的元素。但是，当使用 `rng(state1)` 重置状态时，存储在 `r3` 中的相同大小的新数组与 `r1`\
  \ 完全相同，而 `r1` 是在机器状态保存到 `state1` 变量时创建的。\n\n正态分布的随机数生成器由函数 `randn()` 提供。这样生成的随机数在\
  \ 0 附近呈正态分布。第 3 章的图 3-7 证实了这一事实。\n\n可以通过为每个维度输入一个数组来生成三维随机数数组。例如，如果将数组 `A = [3,2,4]`\
  \ 输入到 `rand()` 函数中，则会创建一个三维随机数数组，如下所示：\n\n```\n>> A = [3,2,4];\n>> B = rand(A)\n\
  \nB(:,:,1) =\n\n0.7482    0.2290\n0.4505    0.9133\n0.0838    0.1524\n\nB(:,:,2)\
  \ =\n\n0.8258    0.0782\n0.5383    0.4427\n0.9961    0.1067\n\nB(:,:,3) =\n\n0.9619\
  \    0.8173\n0.0046    0.8687\n0.7749    0.0844\n\nB(:,:,4) =\n\n0.3998    0.4314\n\
  0.2599    0.9106\n0.8001    0.1818\n\n>> size(B)\n\nans =\n\n3    2    4\n```\n\n\
  ### 2.7.1 矩阵操作\n\n一些常见的矩阵操作已经以函数形式编写，这使得开发人员能够直接使用它们，而不必将时间花在编写最优代码上。\n\n### 2.7.2\
  \ 翻转矩阵\n\n`flipud(A)` 返回矩阵 `A` 的一个副本，其行的顺序沿水平轴反转。`flipud` 代表上下翻转。`fliplr(A)` 返回矩阵\
  \ `A` 的一个副本，其行的顺序从左到右反转。`fliplr` 代表左右翻转。\n\n```\n>> a = [1 2; 3 4; 5 6]\na =\n\n\
  1    2\n3    4\n5    6\n\n>> fliplr(a)\nans =\n\n2    1\n4    3\n6    5\n\n>> flipud(a)\n\
  ans =\n\n5    6\n3    4\n1    2\n```\n\n### 2.7.3 旋转矩阵\n\n使用命令 `rot90(a,n)`，你可以将矩阵\
  \ `a` 按 90 度旋转 `n` 次。\n\n```\n>> a = [1 2; 3 4; 5 6]\na =\n\n1    2\n3    4\n5 \
  \   6\n\n>> rot90(a,1)\nans =\n\n2    4    6\n1    3    5\n\n>> rot90(a,2)\nans\
  \ =\n\n6    5\n4    3\n2    1\n\n>> rot90(a,4)\nans =\n\n1    2\n3    4\n5    6\n\
  ```\n\n### 2.7.4 重塑矩阵\n\n只要元素总数保持不变，可以更改矩阵的行数和列数。\n\n```\n>> a = [1 2; 3 4; 5 6]\n\
  a =\n\n1    2\n3    4\n5    6\n\n>> reshape(a,6,1)\nans =\n\n1\n3\n5\n2\n4\n6\n\n\
  >> reshape(a,4,1)\nError using reshape\n要执行 RESHAPE，元素的数目必须不变。\n```\n\n### 2.7.5\
  \ 排序\n\n可以使用 `sort` 函数按升序对数字进行排序：\n\n```\n>> a = rand(1,5)\na =\n\n0.7431    0.3922\
  \    0.6555    0.1712    0.7060\n\n>> sort(a)\nans =\n\n0.1712    0.3922    0.6555\
  \    0.7060    0.7431\n```\n\n### 2.7.6 上三角矩阵和下三角矩阵\n\n上三角矩阵是指只有对角线及其上方的元素非零的矩阵。类似地，下三角矩阵是指只有对角线及其下方的元素非零的矩阵。\n\
  \n```\n>> a = rand(3,3)\na =\n\n0.0318    0.0971    0.3171\n0.2769    0.8235   \
  \ 0.9502\n0.0462    0.6948    0.0344\n\n>> tril(a)\nans =\n\n0.0318    0       \
  \  0\n0.2769    0.8235    0\n0.0462    0.6948    0.0344\n\n>> triu(a)\nans =\n\n\
  0.0318    0.0971    0.3171\n0         0.8235    0.9502\n0         0         0.0344\n\
  ```\n\n### 2.7.7 全 1 矩阵和全 0 矩阵\n\n所有元素都是 1 或 0 的矩阵分别构成全 1 矩阵和全 0 矩阵：\n\n```\n>>\
  \ ones(3,3)\nans =\n\n1    1    1\n1    1    1\n1    1    1\n\n>> zeros(3,3)\nans\
  \ =\n\n0    0    0\n0    0    0\n0    0    0\n```\n\n## 2.8 索引\n\n矩阵的每个元素由两个数字表示：行号和列号。这用于精确定位一个元素并对其进行操作。\n\
  \n```\n>> a = rand(2,3)\na =\n\n0.6557    0.8491    0.6787\n0.0357    0.9340   \
  \ 0.7577\n\n>> a(2,3)=1\na =\n\n0.6557    0.8491    0.6787\n0.0357    0.9340   \
  \ 1.0000\n\n>> a(1,1)=0\na =\n\n0         0.8491    0.6787\n0.0357    0.9340   \
  \ 1.0000\n```\n\n请注意，`a(2,3)=1` 将第二行第三列的元素，即数字 0.3041072 设置为 1，而 `a(1,1)=0` 将第一行第一列的元素，即数字\
  \ 0.5248873 设置为 0。要对向量中的元素进行索引，只需要一个数字。\n\n```\n>> a = [1,2,3,4,5,6,7,8,9]\na =\n\
  \nColumns 1 through 7\n\n1    2    3    4    5    6    7\n\nColumns 8 through 9\n\
  \n8    9\n\n>> a(1)\nans =\n\n1\n\n>> a(–1)\n下标索引必须为正整数类型或逻辑类型。\n\n>> a(5)\nans\
  \ =\n\n5\n\n>> a(10)\n索引超出矩阵维度。\n```\n\n需要特别注意的是，与某些从 0 开始索引的编程语言不同，MATLAB 的索引从\
  \ 1 开始，并且不接受负数作为索引。\n\n### 2.8.1 使用索引创建新向量\n\n```\n>> a = [10 20 30 40 50 60]\n\
  a =\n\n10   20   30   40   50   60\n\n>> b = a([1 3 6 1])\nb =\n\n10   30   60 \
  \  10\n```\n\n在上一个示例中，`b` 是由向量 `a` 形成的新向量，其连续元素由取自索引向量 `[1 3 6 1]` 的元素组成。\n\n```\n\
  >> a = [11,12,13;40,50,60;17,18,19]\na =\n\n11    12    13\n40    50    60\n17 \
  \   18    19\n\n>> a([1,2], [2,3])\nans =\n\n12    13\n50    60\n```\n\n请注意，由于逗号运算符是可选的，因此我们将仅使用空格来定义向量和矩阵。\n\
  \n```\n\n\n## 2.9 切片\n\n通过使用索引和冒号`:`运算符，可以将矩阵切片成所需的部分。\n\n```\n1  >> a = [1 2 3\
  \ 4 1 3 2 4 6 4 5]\n2  a =\n\n4  第 1 至 7 列\n\n6  1    2    3    4    1    3    2\n\
  \n8  第 8 至 11 列\n\n10  4     6     4     5\n\n12  >> b =a(1:5)\n13  b =\n\n15  1\
  \   2   3   4   1\n\n17  >> c = a(5:7)\n18  c =\n\n20  1    3    2\n```\n\n这是一个重要特性，因为大多数实验计算都需要对数据进行筛选。在这里，数据的一个切片会被单独存储到一个变量中，然后可以对其执行各种数学运算。\n\
  \n现在让我们尝试访问一个多维数组的切片。定义一个 5×5 的矩阵 `a`。\n\n*   要访问单个元素，我们使用行和列的索引值。例如，`b = a(1,1)`\
  \ 访问第一行第一列中的元素。\n*   要访问某一行或某一列的所有元素，可以使用 `:` 运算符。因此，`c = a(1,:)` 访问第一行的所有元素。类似地，`>>\
  \ d = a(:,1)` 访问第一列的所有元素。用语言简单记忆的方法是：将冒号 (`:`) 读作“所有元素，然后第 n 行/列”，其中 n 是一个给定值。\n\
  *   使用 `a(:)`，可以创建一个包含所有元素的新列矩阵。\n*   可以通过先定义列/行的所有元素，再在方括号中定义索引来访问子矩阵。例如，`f = a(:,[1,3])`\
  \ 定义了一个新矩阵，其元素由第一列和第三列的所有元素组成。类似地，`a([1,3],:)` 使用第一行和第三行的所有元素。\n\n```\n1  >> a =\
  \ rand(5,5)\n\n3  a =\n\n5  0.6948    0.3816    0.4456    0.6797    0.9597\n6  0.3171\
  \    0.7655    0.6463    0.6551    0.3404\n7  0.9502    0.7952    0.7094    0.1626\
  \    0.5853\n8  0.0344    0.1869    0.7547    0.1190    0.2238\n9  0.4387    0.4898\
  \    0.2760    0.4984    0.7513\n\n11  >> b = a(1,1)\n\n13  b =\n\n15  0.6948\n\
  16  >> c = a(1,:)\n\n18  c =\n\n20  0.6948    0.3816    0.4456    0.6797    0.9597\n\
  \n22  >> d = a(:,1)\n\n24  d =\n\n26  0.6948\n27  0.3171\n28  0.9502\n29  0.0344\n\
  30  0.4387\n31  >> e = a(:)\n\n33  e =\n\n35  0.6948\n36  0.3171\n37  0.9502\n38\
  \  0.0344\n39  0.4387\n40  0.3816\n41  0.7655\n42  0.7952\n43  0.1869\n44  0.4898\n\
  45  0.4456\n46  0.6463\n47  0.7094\n48  0.7547\n49  0.2760\n50  0.6797\n51  0.6551\n\
  52  0.1626\n53  0.1190\n54  0.4984\n55  0.9597\n56  0.3404\n57  0.5853\n58  0.2238\n\
  59  0.7513\n60  >> f = a(:,[1,3])\n\n62  f =\n\n64  0.6948    0.4456\n65  0.3171\
  \    0.6463\n66  0.9502    0.7094\n67  0.0344    0.7547\n68  0.4387    0.2760\n\
  69  >> g= a([1,3],:)\n\n71  g =\n\n73  0.6948    0.3816    0.4456    0.6797    0.9597\n\
  74  0.9502    0.7952    0.7094    0.1626    0.5853\n```\n\n你可以使用这种强大的方式来定义你选择的元素，从而组成复杂的子矩阵。\n\
  \n```\n1  >> a = rand(5,6)\n\n3  a =\n\n5  0.3510    0.1233    0.9027    0.9001\
  \    0.2417    0.9561\n6  0.5132    0.1839    0.9448    0.3692    0.4039    0.5752\n\
  7  0.4018    0.2400    0.4909    0.1112    0.0965    0.0598\n8  0.0760    0.4173\
  \    0.4893    0.7803    0.1320    0.2348\n9  0.2399    0.0497    0.3377    0.3897\
  \    0.9421    0.3532\n\n11  >> b = a([2,5],1:3)\n\n13  b =\n\n15  0.5132    0.1839\
  \    0.9448\n16  0.2399    0.0497    0.3377\n17  >> c = a(2:5,[1,3])\n\n19  c =\n\
  \n21  0.5132    0.9448\n22  0.4018    0.4909\n23  0.0760    0.4893\n24  0.2399 \
  \   0.3377\n25  >> d = a([2,5],[1,3])\n\n27  d =\n\n29  0.5132    0.9448\n30  0.2399\
  \    0.3377\n31  >>e = a(2:5,1:3)\n\n33  e=\n\n35  0.5132    0.1839    0.9448\n\
  36  0.4018    0.2400    0.4909\n37  0.0760    0.4173    0.4893\n38  0.2399    0.0497\
  \    0.3377\n```\n\n我们定义一个新的 5×5 矩阵 `a`，然后使用 `a([2,5],1:3)` 定义该矩阵的一个子集，这表示：从第二行和第三行中，取第一列到第三列的元素。类似地，`c\
  \ = a(2:5,[1,3])` 根据以下逻辑创建一个矩阵：从第一列和第五列中，取第二行到第三行的元素。现在你可以很容易地猜到 `a([2,5],[1,3])`\
  \ 和 `a(2:5,1:3)` 的功能。强烈建议认真练习数组切片，因为这通常是数据清洗和数据分析中最不可或缺的技能之一。\n\n## 2.10 数组的自动生成\n\
  \nMATLAB 提供了多种方法，可以根据指定规则自动生成数字数组。以下各节将讨论三种方法。\n\n### 2.10.1 `:` 运算符\n\n`:` 运算符是\
  \ MATLAB 中最有用的运算符之一，很容易掌握。你已经在第 2 章中看到了它在选择子矩阵时的用法。\n\n```\n1  >> help:\n2  :  冒号。\n\
  3  J:K 等同于 [J,J+1,...,J+m]，其中 m = fix(K–J)。当 J 和 K 都是整数时，\n4  这简化为 [J,J+1,...,K]。如果\
  \ J>K，则此语法返回一个空矩阵。\n\n7  J:I:K 等同于 [J,J+I,...,J+m_I]，其中 m = fix((K–J)/I)。\n8  当\
  \ I == 0，或 I>0 且 J>K，或 I<0 且 J<K 时，此语法返回一个空矩阵。\n\n11  colon (J,K) 等同于 J:K，colon\
  \ (J,I,K) 等同于 J:I:K。\n\n13  冒号表示法可用于挑选出向量、矩阵和数组的选定行、列和元素。\n14  A(:) 是 A 的所有元素，被视为单个列。在赋值语句的左侧，\n\
  15  A(:) 填充 A，保持其先前的形状。\n16  A(:,J) 是 A 的第 J 列。\n17  A(J:K) 是 [A(J),A(J+1),...,A(K)]。\n\
  18  A(:,J:K) 是 [A(:,J),A(:,J+1),...,A(:,K)]，以此类推。\n\n20  冒号表示法可用于元胞数组以生成逗号分隔的列表。\n\
  21  C{:} 等同于 Cf1g,Cf2g,...,Cfendg。\n22  逗号分隔列表语法在 ()（用于函数调用）、[]（用于连接和函数返回参数）\n23\
  \  以及 {} 内（用于生成元胞数组）有效。像 S(:).name 这样的表达式会为结构体 S\n24  生成逗号分隔的列表 S(1).name,S(2).name,...,S(end).name。\n\
  \n27  关于冒号在 FOR 语句中的使用，请参见 FOR。\n28  关于冒号在逗号分隔列表中的使用，请参见 VARARGIN。\n\n30  关于 colon\
  \ 的参考页\n31  其他名为 colon 的函数\n```\n\n你可以使用 `start:step:stop` 命令生成一系列数字，并将它们存储为数组。\n\
  \n```\n1  >> a=1:1:10\n2  a =\n\n4  第 1 至 7 列\n\n6  1    2    3    4    5    6 \
  \   7\n\n8  第 8 至 10 列\n\n10  8    9    10\n\n12  >> a =[1:1:10]\n13  a =\n\n15\
  \  第 1 至 7 列\n\n17  1    2    3    4    5    6    7\n\n19  第 8 至 10 列\n\n21  8 \
  \   9    10\n```\n\n请注意，这里的括号（`[]`）是可选的。如果未定义步长，则默认为 1。\n\n```\n1  >> a=1:10\n2\
  \  a =\n\n4  第 1 至 7 列\n\n6  1    2    3    4    5    6    7\n\n8  第 8 至 10 列\n\n\
  10  8    9    10\n\n12  >> a=1:2:10\n\n14  a =\n\n16  1    3    5    7    9\n```\n\
  \n### 2.10.2 线性间距向量\n\n`linspace(start, stop, n)` 命令生成一个数组，从第一个数字开始，到第二个数字结束，总共包含\
  \ n 个数字。因此，它们是线性间隔的。\n\n```\n1  >> a = linspace(1,2,5)\n2  a =\n\n4  第 1 至 4 列\n\
  \n6  1.0000    1.2500    1.5000    1.7500\n\n8  第 5 列\n\n10  2.0000\n\n12  >> a\
  \ = linspace(1,2,10)\n13  a =\n\n15  第 1 至 4 列\n\n17  1.0000    1.1111    1.2222\
  \    1.3333\n\n19  第 5 至 8 列\n\n21  1.4444    1.5556    1.6667    1.7778\n\n23 \
  \ 第 9 至 10 列\n\n25  1.8889    2.0000\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，对给定的英文文本进行准确翻译。\n\
  \n\n### 2.10.3 `logspace`\n\n与`linspace`命令类似，`logspace(start, stop, n)`从`start`到`stop`生成`n`个在数值上呈对数均匀分布的数。\n\
  \n```\n1  >>> help logspace\n2  logspace Logarithmically spaced vector.\n3  logspace(X1,X2)\
  \ generates a row vector of 50 logarithmically\n4  equally spaced points between\
  \ decades 10^X1 and 10^X2. If X2\n5  is pi, then the points are between 10^X1 and\
  \ pi.\n6\n7  logspace(X1,X2,N) generates N points.\n8  For N = 1, logspace returns\
  \ 10^X2.\n9\n10  Class support for inputs X1,X2:\n11  float:double, single\n12\n\
  13  See also linspace, colon.\n14\n15  Reference page for logspace\n16  >>>logspace\
  \ (1,5,10)\n17\n18  ans =\n19\n20  1.0e+05 *\n21\n22  Columns 1 through 4\n23\n\
  24  0.0001    0.0003    0.0008    0.0022\n25\n26  Columns 5 through 8\n27\n28  0.0060\
  \    0.0167    0.0464    0.1292\n29\n30  Columns 9 through 10\n31\n32  0.3594  \
  \  1.0000\n```\n\n## 2.11 求解方程组\n\n求解一个方程组只需一行代码，使用`\\`运算符。假设需要求解以下方程组：\n\n![ $$\
  \ 2x-2y=4 $$ ](img/A458923_1_En_2_Chapter_Equ1.gif)\n\n(Equation 2-1)\n\n![ $$ -3x+4y=9\
  \ $$ ](img/A458923_1_En_2_Chapter_Equ2.gif)\n\n(Equation 2-2)\n\n你可以在矩阵中定义此问题，如下所示：\n\
  \n![ $$ \\left[\\begin{array}{cc}2& -2\\\\ {}-3& 4\\end{array}\\right]\\times \\\
  left[\\begin{array}{c}x\\\\ {}y\\end{array}\\right]=\\left[\\begin{array}{l}4\\\\\
  \ {}9\\end{array}\\right] $$ ](A458923_1_En_2_Chapter_Equ3.gif)\n\n(Equation 2-3)\n\
  \n假设：\n\n![ $$ A=\\left[\\begin{array}{cc}2& -2\\\\ {}-3& 4\\end{array}\\right]\
  \ $$ ](A458923_1_En_2_Chapter_Equ4.gif)\n\n(Equation 2-4)\n\n![ $$ X=\\left[\\begin{array}{l}x\\\
  \\ {}y\\end{array}\\right] $$ ](A458923_1_En_2_Chapter_Equ5.gif)\n\n(Equation 2-5)\n\
  \n![ $$ B=\\left[\\begin{array}{l}4\\\\ {}9\\end{array}\\right] $$ ](A458923_1_En_2_Chapter_Equ6.gif)\n\
  \n(Equation 2-6)\n\n这样，你可以写成：\n\n![ $$ A\\times X=B $$ ](img/A458923_1_En_2_Chapter_Equ7.gif)\n\
  \n(Equation 2-7)\n\n解由`X = A^(-1)B`给出。你可以计算`A`的逆矩阵（使用`inv()`或`pinv()`函数），然后将结果矩阵与`B`给出的矩阵相乘来求解。或者，你可以仅用一个命令`A\\\
  B`完成此任务：\n\n```\n1  >> A = [2,–2;–3,4]\n2\n3  A =\n4\n5  2   –2\n6  –3    4\n7\n\
  8  >> B = [4;9]\n9\n10  B =\n11\n12  4   9\n13\n14  >> C = A/B\n15\n16  ans =\n\
  17\n18  17.0000\n19  15.0000\n```\n\n因此，解为`x = 17`和`y = 15`。由于`C`矩阵的元素就是解，这通常被称为解矩阵。\n\
  \n## 2.12 特征值与特征向量\n\n特征值问题是确定方程`Av = λv`的解，其中`A`是一个`n × n`矩阵，`v`是一个长度为`n`的列向量，`λ`是一个标量。满足方程的`λ`值称为特征值。满足方程的对应`v`值称为右特征向量。左特征向量`w`满足方程![\
  \ $$ {w}^{\\prime }A=\\lambda {w}^{\\prime } $$ ](img/A458923_1_En_2_Chapter_IEq1.gif)。MATLAB\
  \ 函数`eig()`返回特征值和特征向量。它还给出与`W`和`A`相关的对角矩阵`D`（特征值的对角矩阵），关系为![ $$ {W}^{\\prime }A=D{W}^{\\\
  prime } $$ ](img/A458923_1_En_2_Chapter_IEq2.gif)：\n\n```\n1  >> A = rand(3,3)\n\
  2\n3  A =\n4\n5  0.6551    0.4984    0.5853\n6  0.1626    0.9597    0.2238\n7  0.1190\
  \    0.3404    0.7513\n8\n9  >> [V,D,W] = eig(A)\n10\n11  V =\n12\n13  –0.7284 \
  \  –0.9532   0.8945\n14  –0.5300   0.2997    –0.4178\n15  –0.4341   0.0411    0.1590\n\
  16\n17\n18  D =\n19\n20  1.3665        0             0\n21  0             0.4732\
  \        0\n22  0             0             0.5264\n23\n24\n25  W =\n26\n27  –0.2724\
  \    –0.3066    –0.1266\n28  –0.7915    –0.3145    –0.5186\n29  –0.5471    0.8984\
  \     0.8456\n```\n\n## 2.13 结构体数组\n\n数组存储相同数据类型的元素，而结构体数组可以存储不同数据类型的数据。结构体是按命名字段组织的数据集合。例如，一个字段可能包含文本数据，另一个包含数字，第三个可能是一个数组，等等。单个结构体是一个`1-by-1`的结构体数组。让我们通过一个示例来理解如何创建它们。让我们为这本书创建一个结构体数组，并将该数组命名为`book`。现在，可以使用点运算符添加各种字段，例如`name`、`author`、`pages`和`chapters`。`book`数组是一个`1-by-1`的结构体，包含四个字段。这里演示了这一点。\n\
  \n```\n1  >> book.name = 'Introducing MATLAB'\n2\n3  book =\n4\n5  struct with fields:\n\
  6\n7  name:'Introducing MATLAB'\n8\n9  >> book.author = 'Sandeep Nagar'\n10\n11\
  \  book =\n12\n13  struct with fields:\n14\n15  name:'Introducing MATLAB'\n16  author:'Sandeep\
  \ Nagar'\n17\n18  >> book.pages = '175'\n19\n20  book =\n21\n22  struct with fields:\n\
  23\n24  name:'Introducing MATLAB'\n25  author:'Sandeep Nagar'\n26  pages:'175'\n\
  27\n28  >> book.chapters = [1 2 3 4 5 6 7]\n29\n30  book =\n31\n32  struct with\
  \ fields:\n33\n34  name:'Introducing MATLAB'\n35  author:'Sandeep Nagar'\n36  pages:'175'\n\
  37  chapters:[1 2 3 4 5 6 7]\n```\n\n### 2.13.1 在结构体数组中定义新的结构体元素\n\n可以使用索引值在现有结构体数组（本例中为`book`）中定义一个新的结构体元素，方式如下。\n\
  \n```\n1  >> book(2).name = 'Introducing SCILAB'\n2\n3  book =\n4\n5  1x2 struct\
  \ array with fields:\n6\n7  name\n8  author\n9  pages\n10  chapters\n11\n12  >>\
  \ book(2).author = 'Sandeep Nagar'\n13\n14  book =\n15\n16  1x2 struct array with\
  \ fields:\n17\n18  name\n19  author\n20  pages\n21  chapters\n22\n23  >> book(2).pages\
  \ = 175\n24\n25  book =\n26\n27  1x2 struct array with fields:\n28\n29  name\n30\
  \  author\n31  pages\n32  chapters\n33\n34  >> book(2).chapters = [1 2 3 4 5 6 7\
  \ 8 9]\n35\n36  book =\n37\n38  1x2 struct array with fields:\n39\n40  name\n41\
  \  author\n42  pages\n43  chapters\n```\n\n这样，`book`现在是一个`1×2`的结构体数组。一个结构体数组中的所有结构体都具有相同数量的字段，并且所有字段都具有相同数量的字段名。当在命令提示符下输入结构体数组的名称时，会显示信息和字段的摘要。可以使用`fieldnames()`函数获取包含字段信息的元胞数组。这在以下代码中进行了演示。\n\
  \n```\n1  >> book\n2\n3  book =\n4\n5  1x2 struct array with fields:\n6\n7  name\n\
  8  author\n9  pages\n10  chapters\n11\n12  >> fieldnames(book)\n13\n14  ans =\n\
  15\n16  4x1 cell array\n17\n18  'name'\n19  'author'\n20  'pages'\n21  'chapters'\n\
  ```\n\n在扩展结构体数组时，不必填写所有字段。未关联值的字段将保留为空。\n\n### 2.13.2 添加和删除字段\n\n可以在任何时候向单个结构体添加新字段。例如，让我们向`book`结构体添加`publisher`字段，如下所示。\n\
  \n```\n1  >> book(2).publisher = 'Apress'\n2\n3  book =\n4\n5  1x2 struct array\
  \ with fields:\n6\n7  name\n8  author\n9  pages\n10  chapters\n11  publisher\n12\n\
  13  >> book\n14\n15  book =\n16\n17  1x2 struct array with fields:\n18\n19  name\n\
  20  author\n21  pages\n22  chapters\n23  publisher\n24\n25  >> book = rmfield(book,'publisher')\n\
  26\n27  book =\n28\n29  1x2 struct array with fields:\n30\n31  name\n32  author\n\
  33  pages\n34  chapters\n```\n\n要从`book`结构体中删除某个字段（例如`publisher`），可以使用`rmfield()`函数，如演示所示。\n\
  \n\n\n### 2.13.3 `struct()`\n\n函数 `struct()` 也可以用来定义结构体数组，语法如下方代码所示：\n\n```\n1 \
  \ >> book1 = struct('name','Introducing MATLAB','author','Sandeep Nagar','pages',175,'chapters',[1,\
  \ 2, 3, 4, 5, 6, 7])\n\n3  book1 =\n\n5  struct with fields:\n\n7  name:'Introducing\
  \ MATLAB'\n8  author:'Sandeep Nagar'\n9  pages:175\n10  chapters:[1 2 3 4 5 6 7]\n\
  \n12  >> book1(2) = struct('name','Introducing python','author',\n'Sandeep Nagar','pages',175,'chapters',[1,\
  \ 2, 3, 4, 5, 6, 7, 8, 9])\n\n14  book1 =\n\n16  1x2 struct array with fields:\n\
  \n18  name\n19  author\n20  pages\n21  chapters\n```\n\n一个新结构体`book1`被创建，其中字段名和值被依次填充。可以通过类似的方式使用索引号对其进行扩展，使其成为一个`1-by-2`的结构体数组。\n\
  \n一个结构体数组可以包含另一个结构体，甚至是一个结构体数组作为其字段。这些被称为嵌套数组。这里演示了如何将`book1`（先前定义的结构体数组）作为新字段添加到结构体数组`book`中。\n\
  \n```\n1  >> book(3).linked book = book1\n\n3  book =\n\n5  1x3 struct array with\
  \ fields:\n\n7  name\n8  author\n9  pages\n10  chapters\n11  linked_book\n```\n\n\
  ## 2.14 从结构体数组中获取数据\n\n可以使用索引号从结构体数组中赋值数据，如下所示。这里，`info1`存储了第二个结构体（由语法`book(2)`表示）的字段`name`的值。类似地，`info2`存储了第一个结构体（由语法`book(1)`表示）的字段`name`的值。变量`info3`从结构体数组`book`的第二个结构体中提取了字段`chapter`的第三个元素。\n\
  \n```\n1  >> info1 = book(2).name()\n\n3  info1 =\n\n5  'Introducing SCILAB'\n\n\
  7  >> info2 = book(1).name()\n\n9  info1 =\n\n11  'Introducing MATLAB'\n\n13  info3\
  \ = book(2).chapters(3)\n\n15  info3 =\n\n17  3\n```\n\n## 2.15 元胞数组\n\n元胞数组是由元胞组成的数组，其中每个元胞存储一个数组。在一个元胞内，元素必须是相同类型（因为元胞存储数组），但两个元胞可以有不同的类型。例如，假设你有三个数组：`array1`（存储数值）、`array2`（存储文本值）和`array3`（存储数值）。然后你可以使用这三个数组构建一个元胞数组。这个元胞数组的元素存储不同类型的数组，但每个元素只存储一种类型的数据。\n\
  \n### 2.15.1 创建元胞数组\n\n函数`cell(m,n)`创建一个大小为`m`×`n`的空元胞数组。通过向这个空元胞数组赋值，可以按需一次一个元胞地构建它。首先创建一个由变量`a`引用的空元胞数组。有两种赋值数据的方法：\n\
  \n*   **元胞索引**：元胞索引写在圆括号`()`内，元胞内容写在花括号`{}`内，位于赋值运算符的两侧，如下所示：\n    ```\n    1  >>\
  \ a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n    7  []    []    []\n\
  \    8  []    []    []\n    9  []    []    []\n\n    11  >> a(1,1) = ([1,2,3]);\n\
  \    12  >> a(1,2) = (['a','b']);\n    13  >> a(1,3) = (\"Sandeep\");\n    14  >>\
  \ a(2,3) = ([1.5,–2]);\n    15  >> a(2,2) = ([–200]);\n    16  >> a(2,1) = ([\"\
  Nagar\"]);\n    17  >> a(3,1) = ([–10,–15.5,5.3]);\n    18  >> a(3,2) = ([\"Hello\"\
  ]);\n    19  >> a(3,3) = ([\"World\"])\n\n    21  a =\n\n    23  3x3 cell array\n\
  \n    25  [1x3 double]    'ab'           [\"Sandeep\"]\n    26  [\"Nagar\"]    \
  \   [–200]         [1x2 double]\n    27  [1x3 double]    [\"Hello\"]      [\"World\"\
  ]\n\n    ```\n\n*   **内容索引**：这里，花括号/圆括号的使用顺序相反，即`()`用于内容，`[]`用于索引。\n    ```\n  \
  \  1  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n    7  []    []\
  \    []\n    8  []    []    []\n    9  []    []    []\n\n    11  >> a {1,1} = ([1,2,3]);\n\
  \    12  >> a {1,2} = (['a','b']);\n    13  >> a {1,3} = (\"Sandeep\");\n    14\
  \  >> a {2,3} = ([1.5,–2]);\n    15  >> a {2,2} = ([–200]);\n    16  >> a {2,1}\
  \ = ([\"Nagar\"]);\n    17  >> a {3,1} = ([–10,–15.5,5.3]);\n    18  >> a {3,2}\
  \ = ([\"Hello\"]);\n    19  >> a {3,3} = ([\"World\"])\n\n    21  a =\n\n    23\
  \  3x3 cell array\n\n    25  [1x3 double]    'ab'         [\"Sandeep\"]\n    26\
  \  [\"Nagar\"]       [–200]       [1x2 double]\n    27  [1x3 double]    [\"Hello\"\
  ]    [\"World\"]\n\n    ```\n\n### 2.15.2 `celldisp()` 和 `cellplot()` 函数\n\n构建好的元胞数组可以通过两个函数`celldisp()`和`cellplot()`来显示。`celldisp()`命令显示完整的元胞内容，而`cellplot()`则显示元胞架构的图形化表示。见图\
  \ 2-1。\n\n![A458923_1_En_2_Fig1_HTML.gif](img/A458923_1_En_2_Fig1_HTML.gif)\n\n\
  图 2-1 `cellplot(a)`的输出\n\n### 2.15.3 `cell2struct()`, `num2cell()`, 和 `struct2cell()`\
  \ 函数\n\n`cell2struct()`命令可用于将元胞数组转换为结构体。类似地，`num2cell()`可用于将数值数组转换为元胞数组，而`struct2cell()`可用于将结构体转换为元胞数组。\n\
  \n## 2.16 总结\n\n基于数组的计算是现代计算技术的核心。MATLAB 提供了一个非常合适的平台来轻松执行这项技术。各种预定义函数使用户能够在原型设计问题时节省时间。拥有灵活的方法来定义多维数组并执行快速计算是我们这个时代的必需品。大多数仿真时间要么花在循环中，要么花在数组操作上。预定义的数组操作已经过算法优化，以实现可靠性、节省时间和高效的内存管理。\n\
  \n"
- "# 3. 绘图\n\n## 3.1 引言\n\n没有可视化，数值计算难以评估。生成能够提供数值结果有意义分析的复杂图形的出版级图像，一直是全世界科学家面临的挑战。许多商业软件程序在满足这一需求方面非常成功。MATLAB\
  \ 也提供了这一功能。其绘图特性包括：从各种 2D 和 3D 图形类型中选择，通过添加额外信息（如标题、带标签的坐标轴、网格和数据标签）来增强图形，以及书写关于数据的方程式和其他重要信息。最重要的特性是，图形可以以编程方式定义，即你可以使用计算机程序输入绘图数据。这与手动输入数据截然不同。\n\
  \n其中一个优势是，你可以使用各种函数来定义数据。另一个优势是，当数据有大量条目时，可以按照支配计算机程序的规则来输入。以下各节将详细描述这些操作。\n\n值得一提的是，绘图能力对于机器学习实验至关重要，因为从渐进步骤中获得的视觉指引能让你直观地理解所考虑的问题。\n\
  \n### 3.1.1 2D 绘图\n\n\n\n#### `plot(x, y)`\n\n由于绘图需要两个轴的数据，因此首先需要创建图形。假设本示例中 x 轴有\
  \ 100 个线性间隔的数据点，在其上定义了 y = x²。请参见图 3-1。\n\n![A458923_1_En_3_Fig1_HTML.gif](img/A458923_1_En_3_Fig1_HTML.gif)\n\
  \n图 3-1：y = x² 图\n\n```\n1  >> x = linspace(0,100,100);\n2  >> y=x.ˆ2;\n3  >> plot(x,y)\n\
  4  >> xlabel('x')\n5  >> ylabel('y=xˆ{2}')\n6  >> title('Plot of x versus y=xˆ{2}')\n\
  ```\n\n首先，我们定义一个变量 `x`，并将 0 到 100 之间 100 个等间距的数据点放入其中。这会创建一个 1×100 的矩阵。利用标量的指数运算，我们定义变量\
  \ `y` 为 y = x²。然后使用 `plot()` 函数，该函数接受两个参数，分别作为 x 轴和 y 轴的数据点。在命令提示符下输入 `help plot`\
  \ 可以深入了解这个用于绘制二维数据的出色函数。\n\n可以使用 `xlabel()` 和 `ylabel()` 函数来设置 x 轴和 y 轴标签，这两个函数接受一个字符串作为输入。该字符串可以使用\
  \ LATEX 命令进行格式化——例如，可以使用 `x^{2}` 语法来输出 x²。类似地，可以用适当的字符串为图形添加标题。\n\n#### `area()`\n\
  \n`area()` 函数创建的图形与 `plot()` 类似，但它还会对曲线下方的区域进行着色，如图 3-2 所示。\n\n![A458923_1_En_3_Fig2_HTML.gif](img/A458923_1_En_3_Fig2_HTML.gif)\n\
  \n图 3-2：使用 `area()` 函数创建的 y = x² 图\n\n```\n1  >> x = linspace(0,100,100);\n2  >>\
  \ y = x.ˆ2;\n3  >> area(x,y)\n```\n\n#### 在同一张图上绘制多个图形\n\n只需提供 x 轴和 y 轴的向量，就可以在同一张图上绘制多个图形，如代码\
  \ 3-1 所示。图 3-3 展示了结果。\n\n![A458923_1_En_3_Fig3_HTML.gif](img/A458923_1_En_3_Fig3_HTML.gif)\n\
  \n图 3-3：同一图形内的多个绘图\n\n```\n1  clear all;\n2  clf;\n3  x = linspace(1,100,100);\n\
