  \ = cos(x);\n3  >> stem(y)\n```\n\n### 3.1.3 三维绘图\n\nMATLAB 中有多种可用于三维绘图的函数。您选择哪个函数取决于具体问题。\n\
  \n\n\n#### mesh\n\n考虑使用`mesh`命令，如代码清单 3-5 所示。该命令生成的图形如图 3-14 所示。\n\n![A458923_1_En_3_Fig14_HTML.gif](img/A458923_1_En_3_Fig14_HTML.gif)\n\
  \n图 3-14 3D 网格\n\n```\n1  a = b = linspace(−8,8,41)';\n2  [xx,yy] = meshgrid(a,b);\n\
  3  c = sqrt(xx.ˆ2+yy.ˆ2)+eps;\n4  d = sin(c)./c;\n5  mesh(a,b,d);\nListing 3-5\n\
  The ThreeDMesh.m Program\n```\n\n需要注意的是，这段代码使用了一个名为`meshgrid`的新函数。你可以使用`help meshgrid`快速搜索该函数。`meshgrid`的用法如下：\n\
  \n```\n1  >> a = b = linspace(−8,8,41);\n2  >> [xx,yy] = meshgrid(a,b);\n```\n\n\
  这里创建了两个变量`a`和`b`，它们以行向量的形式存储了从-8 到 8 之间的 41 个线性间隔数据点。这两个行向量（维度均为 1×41）作为参数传递给`meshgrid`函数，该函数产生两个输出：`xx`和`yy`。它们是维度为\
  \ 41×41 的矩阵，其中`xx`的行是`a`的副本，`yy`的列是`b`的副本。\n\n`meshgrid`也可以接受第三个参数，用于构建完整的三维网格。除此之外，在这个二维基础网格上，可以为由`a`和`b`向量的副本定义的数据点定义一个函数。在这个例子中，函数定义如下：\n\
  \n![ $$ c=\\sqrt{x²+{y}²} $$ ](img/A458923_1_En_3_Chapter_Equ1.gif)\n\n（公式 3-1）和\n\
  \n![ $$ d=\\frac{\\mathit{\\sin}(c)}{c} $$ ](img/A458923_1_En_3_Chapter_Equ2.gif)\n\
  \n（公式 3-2）注意：函数`eps`会产生一个非常小的数字（由机器精度定义的 2.2204.10^(-16) [1]）。它在数值计算中被广泛使用，特别是在需要避免零值的情况下，尤其是在除以零的情形中。通过给大数加上一个非常小的数字，我们避免了这个问题（请记住，在第\
  \ 3 步中计算的变量`c`随后在第 4 步中作为分母用于除法运算）。\n\n现在继续绘图练习，新的数组可以通过应用 3D 绘图函数`mesh()`来绘制图形，该函数将数组`a`和`d`作为其参数，得到图\
  \ 3-14。如果使用`mesh(x,y,z)`，则会创建一个由矩形构成的线框网格。矩形的顶点由函数（在本例中为公式 3-1 和 3-2）生成的数据点构成。顶点的（x,\
  \ y）坐标由`xx`和`yy`矩阵给出，因为 x 坐标来自`xx`矩阵，y 坐标来自`yy`矩阵。`z`决定了每个顶点在平面上方的高度。\n\n通过这种方式，就创建了一个\
  \ 3D 图形。需要注意的是，原始的 3D“曲线”被解释为由平面矩形构成的曲面，这充其量只是一种近似。在某些情况下，这种误差可以忽略不计。为了减少误差，如果可能的话，可以使矩形更小一些。同一个函数还有其他一些变体，例如`ezmesh`、`meshc`和`meshz`。一个简单的`help`命令对于确定哪个变体最适合特定问题非常有用。网格还会根据高度（z\
  \ 值）编码颜色。这是通过线性缩放 z 值以适应当前颜色映射的范围来计算的（键入`help colormap`了解更多信息）。\n\n#### meshc\n\n\
  `meshc()`生成一个 3D 矩形网格以及底部的等高线图。如图 3-15 所示，除了为给定函数生成 3D 图形外，你还能得到一个等高线图。请注意，这一次，对矩阵进行运算的方程被编写为`meshc()`函数的一个参数，从而使程序更精简。参见代码清单\
  \ 3-6。\n\n![A458923_1_En_3_Fig15_HTML.gif](img/A458923_1_En_3_Fig15_HTML.gif)\n\n\
  图 3-15 使用`meshc()`函数的 3D 网格\n\n```\n1  x=linspace(−10,10,50);\n2  y=linspace(−10,10,50);\n\
  3  [xx,yy]=meshgrid(x,y);\n4  meshc(xx,yy,2−(xx.ˆ2+yy.ˆ2))\nListing 3-6\nThe ThreeDMeshc.m\
  \ Program\n```\n\n#### surf()\n\n`surf()`生成一个曲面图，其中线框在空白点处被简单地填充，如图 3-16 所示。参见代码清单\
  \ 3-7。\n\n![A458923_1_En_3_Fig16_HTML.gif](img/A458923_1_En_3_Fig16_HTML.gif)\n\n\
  图 3-16 使用`surf()`函数的 3D 网格\n\n```\n1  a = b = linspace(−8,8,10)';\n2  [xx,yy] =\
  \ meshgrid(a,b);\n3  c = sqrt(xx.ˆ2+yy.ˆ2)+eps;\n4  d = sin(c)./c;\n5  surf(c,d);\n\
  Listing 3-7\nThe ThreeDsurf.m Program\n```\n\n## 3.2 总结\n\n丰富的绘图函数库使 MATLAB 成为以各种可出版格式绘制数据的合适选择。结合访问系统文件和文件夹的命令，这些图形可以被引导保存到合适的位置，以创建合适的报告。在\
  \ MATLAB 中进行 3D 绘图并从不同角度查看是相当直观的。因此，MATLAB 是一种可视化数据的合适方法。数据和执行速度的限制取决于计算机的存储器和主板上的\
  \ RAM。\n\n"
- "# 4. 输入与输出\n\n## 4.1 简介\n\nMATLAB 的基本数据类型是数组。大多数科学和工程目的数值计算都涉及处理各种文件格式的数据。科学设备和计算机程序本身会以文件形式生成数据。然后这些文件被读取并转换成数组（大多数情况下）。这些数组可以根据矩阵代数的数学要求进行操作。结果会生成一组新的数组。这些数组进一步被转换成文件用于可视化。\n\
  \n利用第 2 章和第 3 章（数组和绘图）的信息，你现在可以将物理问题转化为数值计算，并在数字计算机上求解。这个过程有一些要求，例如：\n\n*   数据应为数字格式（数字文件）。\n\
  *   计算机程序应能无误地读取文件并从中创建数组。如果发生错误，应存在检查错误并向用户发出警告的机制。如果可能，还应存在修正错误的机制。\n*   数据应以适当的数据类型存储为数组，并应根据需求以适当的格式显示。\n\
  *   对数据的数组操作将导致涉及在磁盘上读写数据的内存使用。系统应为此提供便利。用户应能在需要时检查内存状态。\n*   后处理任务包括以各种格式显示数据——例如打印机打印、终端显示、终端或打印机/绘图仪上的图形等。\n\
  *   如果特定实验的报告包含输入参数，将处理后的数据和输出以文件或图形的形式呈现，将使用户的任务更简单。\n\nMATLAB 为这些步骤中的每一步都提供了一些特性。本章将简要讨论这些内容。\n\
  \n## 4.2 键盘交互输入\n\n用户通过键盘与 MATLAB 进行交互。键盘为特定字符生成 ASCII 或 Unicode 字符串。这些字符串被输入 MATLAB，然后由\
  \ MATLAB 解释以执行特定任务。在编程过程中与 MATLAB 进行交互式会话时，MATLAB 提供了以下几节讨论的函数。\n\n\n\n### 4.2.1\
  \ `input()`\n\n`input(\"Text\")` 会在 MATLAB 提示符（默认符号为 `>>>`）处显示文本字符串 `Text`，并等待用户输入一个值后按回车键。用户可以输入任何类型的数据。输入内容会被视为\
  \ MATLAB 表达式，并在当前工作区中计算。如果使用 `input()` 函数进行赋值操作，则数据会被相应地赋给一个变量。如果用户直接按回车键而未输入任何内容，则输入会返回一个空矩阵。当用户在提示符处输入无效表达式时，提示符处会显示相关的错误信息。当需要向\
  \ `input()` 输入字符或字符向量字符串时，用户必须将其定义为字符串。否则，使用 `'s'` 作为第二个参数，此时输入会被视为字符串。其用法在以下代码中进行了演示。\n\
  \n```\n1  >> prompt = 'What is your name:';\n2  >> name = input(prompt)\n3  What\
  \ is your name:Sandeep\n4  Error using input\n5  Undefined function or variable\
  \ 'Sandeep'.\n\n7  What is your name:'Sandeep'\n\n9  name =\n\n11  'Sandeep'\n\n\
  13  >> name = input(prompt,'s')\n14  What is your name:Sandeep\n\n16  name =\n\n\
  18  'Sandeep'\n\n```\n\n在处理数值时，必须使用单个值或数组，但要遵循有效的 MATLAB 语法。例如，在以下代码中，用户可以输入单个值\
  \ `r`（用于存储圆的半径）或输入多个值作为数组。然后，这些信息可用于计算周长（= 2πr）和面积（= πr²）。\n\n```\n1  >> r = input('Enter\
  \ value of radius:');\n2  Enter value of radius:2\n3  >> circumference = 2*pi*r\n\
  \n5  circumference =\n\n7  12.5664\n\n9  >> area = pi*rˆ2\n\n11  area =\n\n13  12.5664\n\
  \n15  >> r = input('Enter value of radius:');\n16  Enter value of radius:[1 2 3]\n\
  17  >> r\n\n19  r =\n\n21  1     2     3\n\n23  >> circumference = 2*pi*r\n\n25\
  \  circumference =\n\n27  6.2832   12.5664   18.8496\n\n29  >> area = pi*r.ˆ2\n\n\
  31  area =\n\n33  3.1416   12.5664   28.2743\n\n```\n\n### 4.2.2 `keyboard()`\n\n\
  `keyboard` 关键字会在程序运行期间将控制权交给用户，以便用户可以根据需要输入数据或额外的 MATLAB 命令。用户可以有效地利用此过程来检查程序，这被称为调试。\n\
  \n完成此操作后，MATLAB 提示符会从 `>>>` 变为 `k>`。通过执行命令 `dbcont` 可以退出键盘模式。也可以使用 `dbquit` 退出键盘模式，但这样会终止调用它的\
  \ MATLAB 代码文件。控制权会返回给调用它的 MATLAB 代码文件。\n\n此处必须输入有效的 MATLAB `表达式`。此关键字可以非常有效地在程序运行过程中更改变量的值。其用法在清单\
  \ 4-1 的示例代码中进行了展示。\n\n```\n1  %program to demonstrate\n2  %usage of keyboard command\n\
  \n4  x = 10;\n5  y = 12;\n6  keyboard %change value of x here\n7  answer = xˆ2\n\
  Listing 4-1\nThe keyboardCommand.m Program\n```\n\n执行此代码时，你将看到以下会话：\n\n```\n1  >>\
  \ keyboardCommand\n2  K>> x=2.5\n\n4  x =\n\n6  2.5000\n\n8  K>> dbcont\n\n10  answer\
  \ =\n\n12  6.2500\n\n14  >> x=2.5\n\n16  x =\n\n18  2.5000\n\n20  >> x.ˆ2\n\n22\
  \  ans =\n\n24  6.2500\n\n```\n\n当遇到 `keyboard` 关键字时，MATLAB 会话会进入调试模式，用户随后可以将值更改为\
  \ `x=2.5`。输入 `dbcont` 将继续执行程序。计算结果将基于新的赋值。\n\n### 4.2.3 `menu()`\n\n一种图形化的输入值方式是通过\
  \ `menu()` 命令实现的，该命令以标题和一组选项作为输入（用逗号分隔）。这需要用户的计算机终端具备图形显示能力，否则会在命令提示符处显示一个选项列表。用户会看到一个图形窗口，并可以使用鼠标或键盘选择一个选项。这些选项会返回一个标量值，该值可以存储在一个变量中。选项内部会进行编号。\n\
  \n我们通过一个示例来看看它的用法。创建一个标题为“Even or Odd Numbers”（偶数或奇数）并包含两个选项——`Even`（偶数）和 `Odd`（奇数）的菜单。将此值存储在变量\
  \ `I` 中。执行此命令后，将出现图 4-1 所示的图形窗口。可能的输出如下：\n\n![A458923_1_En_4_Fig1_HTML.jpg](img/A458923_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\n菜单窗口输出\n\n- 如果用户关闭窗口而未输入任何值，则输出为 0。\n- 如果用户点击 `Even`（偶数），则输出为 1。\n- 如果用户点击\
  \ `Odd`（奇数），则输出为 2。\n\n如下代码所示：\n\n```\n1  >> I = menu('Even or Odd Numbers','Even','Odd')\n\
  \n3  I =\n\n5  0\n\n7  >> I = menu('Even or Odd numbers','Even','Odd')\n\n9  I =\n\
  \n11  1\n\n13  >> I = menu('Even or Odd numbers','Even','Odd')\n\n15  I =\n\n17\
  \  2\n\n```\n\n- `pause()`：如果您想临时暂停程序，可以使用 `pause()` 命令。按任意键继续执行程序。为了理解其用法，考虑一个示例。假设您有一个\
  \ 3×3 的随机数矩阵。那么 MATLAB 程序 `pauseCommand.m` 将显示其秩、转置和大小。每次用户按一个键，就会显示一个项目。请参阅清单 4-2。\n\
  \n```\n1  %Program to show usage\n2  %of pause command\n\n4  x = rand(3,3);\n5 \
  \ r = rank(x);\n6  t = x';\n7  s = size(x);\n8  disp('Given matrix is:')\n9  disp(x)\n\
  10  disp('To continue checking its rank, press any key')\n11  pause\n12  disp('Rank\
  \ of matrix is:')\n13  disp(r)\n14  pause\n15  disp('To continue checking its transpose,\
  \ press any key')\n16  pause\n17  disp('Transpose of matrix is:')\n18  disp(t)\n\
  19  pause\n20  disp('To continue checking its size, press any key')\n21  pause\n\
  22  disp('Size of matrix is:')\n23  disp(s)\n24  pause\nListing 4-2\nThe pauseCommand.m\
  \ Program\n```\n\n运行 `pauseCommand.m` 的输出如下所示：\n\n```\n1  >> pauseCommand\n2  Given\
  \ matrix is:\n3  0.8147    0.9134    0.2785\n4  0.9058    0.6324    0.5469\n5  0.1270\
  \    0.0975    0.9575\n\n7  To continue checking its rank, press any key\n8  Rank\
  \ of matrix is:\n9  3\n\n11  To continue checking its transpose, press any key\n\
  12  Transpose of matrix is:\n13  0.8147    0.9058    0.1270\n14  0.9134    0.6324\
  \    0.0975\n15  0.2785    0.5469    0.9575\n\n17  To continue checking its size,\
  \ press any key\n18  Size of matrix is:\n19  3     3\n\n```\n\n## 4.3 文件路径\n\nMATLAB\
  \ 会话从一个默认文件夹启动，该文件夹取决于特定操作系统的安装方式。通常在安装时会创建一个专用文件夹，默认名称一般为 `MATLAB`。通过在命令提示符处输入\
  \ `pwd` 可以查看此文件夹的路径。\n\n```\n1   >> pwd\n\n3   ans =\n\n5   '/Users/.../MATLAB'\n\
  ```\n\n请注意，您计算机上的路径可能不同，这里使用三个点来表示路径的通用表示形式。\n\n当您想要运行 MATLAB 的 `.m` 文件时，会首先在默认文件夹中搜索该文件。如果文件不在那里，您必须将工作目录更改为存储该文件的目录。这可以通过在\
  \ MATLAB 的命令提示符处输入 `pathtool` 来实现（见图 4-2）。\n\n![A458923_1_En_4_Fig2_HTML.jpg](img/A458923_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n使用 `pathtool` 命令设置工作目录路径\n\n您可以简单地将该目录添加到当前会话的目录列表中，或者保存它。您也可以选择将该目录设置为未来\
  \ MATLAB 会话的默认目录。如果您将长期在一个项目上工作，并且确定每天都会使用该目录，那么这是一个很好的选择。强烈建议您将所有文件保存在已安装 MATLAB\
  \ 程序的默认目录中，或者将您的工作目录设置为默认目录。\n\n\n\n## 4.4 文件操作\n\n文件操作是计算中的一个重要组成部分。需要注意的是，文件系统依赖于操作系统\
  \ (OS)。与大多数科学程序类似，MATLAB 适用于类 UNIX 系统，因此它能在基于 Linux 的系统和 MacOS X 上使用相同的命令良好运行。在\
  \ Windows 系统中，你在 MATLAB 环境中处理文件时，使用与 Linux 版本相同的命令。本书中的代码示例是在 Windows 8、MacOSX 10.10\
  \ 和 Ubuntu 14.04 系统上编写和测试的。\n\n### 4.4.1 用户\n\n计算系统由不同的用户访问。每个用户都定义一个工作空间，以避免损坏彼此的工作。登录后，用户的工作空间对该用户激活。工作空间由各种文件和文件夹组成。有些文件对于操作系统定义工作空间及其属性是必需的，因此不应更改。这是通过向不同用户授予权限来确保的。\n\
  \n读取和写入文件受到权限的限制。管理员（通常被称为`admin`）也被称为超级用户，拥有编辑任何文件/文件夹的所有特权和权限。你必须了解计算机系统定义的用户类型，然后相应地执行这些命令。如果你没有被授权访问某些文件夹，而你需要输入的数据又存放在这些文件/文件夹中，你总会收到一个错误（除非管理员更改了你的权限）。\n\
  \n### 4.4.2 文件路径\n\n目录/文件夹可以包含子目录/子文件夹和文件。如果此过程不受管理员限制，则可以达到任意层级。\n\n`pwd` 命令代表“打印工作目录”。在\
  \ MATLAB 终端中，输入 `pwd` 会显示当前工作目录的路径，如下例所示：\n\n```\n1  >> pwd\n2  ans = /home/sandeep\n\
  ```\n\n用户的 `/home` 目录包含另一个名为 `/sandeep` 的目录。这是当前的工作空间。当在终端中输入 `pwd` 时，一个名为 `ans`\
  \ 的变量会存储此数据（文件路径）。你可以分配一个自己选择的变量名来将文件名存储为字符串。\n\n通过在终端输入文件路径来访问文件/文件夹。通过这个简短练习来理解此过程。要创建新目录，你可以像下面这样使用\
  \ `mkdir name`：\n\n```\n1  >> mkdir matlab−practice\n2  ans = 1\n3  >> ls\n4  Downloads\
  \                           Music\n5  R\n6  Templates\n7  matplab−practice\n8  Videos\n\
  9  Desktop                             software\n10  Work\n11  Documents       \
  \                    Library\n12  Pictures\n13  >> cd matplab−practice\n14  >>\n\
  ```\n\n在第 1 行，`mkdir matplab-practice` 创建了一个名为 `matplab-practice` 的目录。要查看当前目录的内容，你可以使用\
  \ `ls` 命令，正如第 3 行所示，它代表“列表”（list）。要切换目录，你可以像第 13 行展示的那样使用 `cd file path` 命令。我建议你在此目录中完成本书的其余部分。\n\
  \n### 4.4.3 创建和保存文件\n\n`save` 和 `load` 命令允许你向内存写入和读取数据。\n\n```\n1  >> matrix = rand(3,3);\n\
  2  >> save MyFirstFile.mat matrix\n3  >> ls\n4  MyFirstFile.mat\n5  >> load MyFirstFile.mat\n\
  6  >> matrix\n7  matrix =\n\n9  0.467414     0.610273     0.429941\n10  0.568490\
  \     0.037898     0.734682\n11  0.547370     0.275421     0.539650\n\n13  >>\n\
  ```\n\n在第 1 行，首先创建了一个名为 `matrix` 的变量，它存储了一个 3×3 的随机值矩阵。在第 2 行，此数据被存储为一个名为 `MyFirstFile.mat`\
  \ 的 `.mat` 文件，并将该变量名作为参数传递。需要时，可以使用 `load MyFirstFile.mat` 命令将此文件加载到工作空间中，然后调用名为\
  \ `matrix` 的变量。保存文件时记录的随机数被加载为 3×3 矩阵的数据。请注意，此数据不一定是数字。它可以是数字计算机能够处理的任何内容，包括图片、视频、字符串和字符等等。\n\
  \n通过在保存时传递变量名，可以将多个变量存储在同一文件中。\n\n```\n1  >> matrix1 = rand(4,4);\n2  >> matrix2\
  \ = rand(2,3);\n3  >> matrix3 = rand(2,2);\n4  >> save(\"SavingMultipleVariables.mat\"\
  ,\"matrix1\",\"matrix2\",\"matrix3\")\n5  >> load SavingMultipleVariables.mat\n\
  6  >> matrix1\n7  matrix1 =\n\n9     0.8598130     0.0118250     0.9803720     0.3044413\n\
  10     0.6676748     0.0056845     0.1101545     0.2183920\n11     0.2547204   \
  \  0.8192626     0.8056112     0.6961116\n12     0.7924558     0.9130480     0.1976146\
  \     0.4635055\n\n14  >> matrix2\n15  matrix2 =\n\n17     0.35215    0.55770  \
  \  0.66650\n18     0.98515    0.98677    0.45513\n\n20  >> matrix3\n21  matrix3\
  \ =\n\n23     0.097693    0.540354\n24     0.923853    0.329501\n\n26  >>>> save\
  \ −binary SavedAsBinary m*\n27  >> ls\n28  MyFirstFile.mat  SavedAsBinary  SavingMultipleVariables.mat\n\
  ```\n\n`help save` 和 `help load` 命令提供了关于使用 `save` 和 `load` 的非常有用的说明。使用这些选项，你可以将文件保存为特定格式。例如，在第\
  \ 26 行，所有以 `m` 开头的变量名都被保存为二进制数据，存放在一个名为 `SavedAsBinary` 的二进制文件中。当基于 MATLAB 的数值计算生成的数据要在其他软件程序中使用时，这一点尤为重要。你还可以使用选项指定保存数据的精度。你也可以使用\
  \ `-zip` 命令压缩大文件。当 MATLAB 生成的数据体积庞大且需要传输时，这非常有用。\n\n`load` 函数遵循与 `save` 函数相同的逻辑。数据可以从特定格式的文件中解压并加载为一个数组。这样填充的数组可用于计算，如果需要，可以使用\
  \ `save` 函数再次生成结果文件。复杂的计算需要连续多次重复此过程，因此这些函数已被优化，以便在短时间内定位和加载所需数据。\n\n可以使用 `dlmread()`\
  \ 和 `dlmwrite()` 读取和写入带分隔符的数值数据文件（由分隔符分隔的数值数据）。这些函数生成 ASCII 分隔文件。为了说明这一点，以下 MATLAB\
  \ 代码执行以下任务：\n\n*   将一个 3×3 矩阵存储在变量 `A` 中。\n*   使用 `dlmwrite()` 函数，写入一个名为 `randomNumbers.txt`\
  \ 的文件，该文件从存储在 `A` 中的矩阵获取输入。\n    *   分隔符定义为 `;`\n    *   你可以在工作目录中检查该文件，并使用合适的文本编辑器或电子表格软件打开它。\n\
  *   初始化一个新变量 `B` 为空矩阵。\n*   使用 `dlmread()` 函数读取此文件。定义创建文件时使用的分隔符非常重要。结果存储在 `B` 中，并且发现与\
  \ `A` 完全相同。\n\n```\n1  >> A = randn(3,3)\n\n3  A =\n\n5   0.3252   −1.7115     \
  \ 0.3192\n6  −0.7549   −0.1022      0.3129\n7   1.3703   −0.2414     −0.8649\n\n\
  9  >> dlmwrite('randomNumbers.txt',A,';')\n10  >> B = []\n11  >> B = dlmread('randomNumbers.txt',';')\n\
  \n13  B =\n\n15   0.3252    −1.7115     0.3192\n16  −0.7549    −0.1022     0.3129\n\
  17   1.3703    −0.2414    −0.8649\n```\n\n### 4.4.4 使用 Diary 和 History 命令\n\n可以通过使用\
  \ `diary` 命令将 MATLAB 会话记录到文件中。输入 `help diary` 了解其使用信息。写入 `help filename` 可以将会话记录到具有给定文件名的文件中。此功能会持续更新命令及其输出。\n\
  \n你可以使用 `history` 命令来显示已执行命令的列表。有各种选项可用于查看特定格式的历史记录。\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 4.4.5 打开和关闭文件\n\n要读写数据文件，必须先打开文件并将其定义为可读和/或可写。`fopen` 函数返回一个指向已打开文件的指针，该文件已准备好读取或写入。这由以下选项定义：`r`\
  \ 表示可读，`w` 表示可写，`r+` 表示可读可写，`a` 表示追加（即在文件末尾写入新内容），`a+` 表示可读、可写和追加。打开模式可以设置为 `t`\
  \ 文本模式或 `b` 二进制模式。`z` 可以打开一个 gzip 压缩文件进行读取和写入。\n\n当所有数据读取或写入完成后，应关闭已打开的文件。`fclose`\
  \ 函数用于执行此操作。\n\n```\n1  MyFile = fopen(\"a.dat\",\"r\");\n```\n\n创建了一个名为 `MyFile`\
  \ 的变量，用于存储文件 `a.dat` 的内容。该文件以只读模式打开，这意味着它不能被编辑。如果文件的作者希望在共享信息时保持信息不变，这一点很重要。对于包含不应更改的常量或重要代码段的文件来说，这可能是必要的。\n\
  \n`freport()` 命令会列出已打开的文件以及它们是为读取、写入还是两者都打开。例如：\n\n```\n1  >> freport\n\n3  number\
  \    mode    arch         name\n4  −−−−−   −−−−   −−−−       −−−−\n5  0        \
  \ r       ieee−le     stdin\n6  1         w       ieee−le     stdout\n7  2     \
  \    w       ieee−le     stderr\n\n9  >>\n```\n\n### 4.4.6 读写二进制文件\n\n二进制文件是计算机可读的文件。它们只是字节序列。它们与\
  \ C 语言函数 `fread` 和 `fwrite` 相同，可以从文件中读写二进制数据。\n\n#### csvread 和 csvwrite 函数\n\n\
  `csvread` 和 `csvwrite` 函数用于读写 `.csv`（逗号分隔值）文件。假设需要将以下数据存储为 `.csv` 文件。\n\n```\n1\
  \   2   3   4\n5   6   7   8\n8   7   6   5\n4   3   2   1\n```\n\n以下代码使用 `csvwrite`\
  \ 创建一个数组，以生成名为 `csvTestData.dat` 的文件，其中包含矩阵的值。您可以通过在文本编辑器中打开这个新创建的文件来验证这一点。在第 3\
  \ 行，创建了一个名为 `csvTestData1.dat` 的新文件，其偏移量定义为第 1 行和第 2 列。\n\n```\n1  >> a = [1,2,3,4;5,6,7,8;8,7,6,5;4,3,2,1];\n\
  2  >> a\n3  a =\n\n5  1   2   3   4\n6  5   6   7   8\n7  8   7   6   5\n8  4  \
  \ 3   2   1\n9  >> csvwrite('csvTestData.dat',a)\n10  >> csvwrite('csvTestData1.dat',a,1,2)\n\
  11  >> a1 = csvread('csvTestData.dat')\n12  a 1 =\n\n14  1   2   3   4\n15  5  \
  \ 6   7   8\n16  8   7   6   5\n17  4   3   2   1\n\n19  >> a1 = csvread('csvTestData.dat',1,2)\n\
  20  a1 =\n\n22  7   8\n23  6   5\n24  2   1\n\n26  >>\n```\n\n现在，`csvread` 函数可以像\
  \ `csvwrite` 函数一样，用来创建具有所需偏移量的矩阵。\n\n**注意**\n\n存在许多其他用于读写文件的函数，但本节重点介绍一些最常用的函数。如果需要，您可以访问文档以了解如何使用这些专用函数。\n\
  \n### 4.4.7 使用 Excel 文件\n\n互联网上有大量数据以 Excel 文件的形式呈现。请注意，在这种情况下，计算机必须连接到互联网。\n\n\
  `xlsopen`、`xlswrite`、`xlsclose`、`odsopen`、`odswrite` 和 `odsclose` 命令分别用于打开、写入和关闭\
  \ `.xls` 和 `.ods` 文件。`.xls` 文件由 Microsoft Excel 生成，而 `.ods` 文件由 Open/Libre Office\
  \ 软件生成，它是 Microsoft Excel 的开源替代品。打开、读取和写入数据的流程如下：\n\n*   `xlsopen('Filename.xls')`\n\
  *   `a = xlsread ('Filename.xls', '3rd_sheet', 'B3:AA10');` 将从名为 `3rd sheet` 的 `Filename.xls`\
  \ 工作表中读取从单元格 B3 到 AA10 的数值数据。此数据存储为一个名为 `a` 的数组。\n*   `[Array, Text, Raw, limits]\
  \ = xlsread ('a.xls', 'hello');` 从名为 `hello` 的工作表中读取文件 `a.xls`，所有数值数据被输入到名为 `Array`\
  \ 的数组中。文本数据被输入到名为 `Text` 的数组中，原始单元格数据被输入到名为 `Raw` 的元胞数组中，实际数据所在的区域被保存在 `limits`\
  \ 中。\n*   `xlswrite('new.xls',a)` 将名为 `a` 的数组中的数据写入一个名为 `new.xls` 的 `.xls` 格式的 Excel\
  \ 工作表。\n*   `xlsclose`\n\n    ```\n    1  >> a = rand(10,10);\n    2  >> odswrite('a.ods',a)\n\
  \    3  ans = 1\n    4  >> ls\n    5  a.ods\n    ```\n\n## 4.5 从互联网读取数据\n\n大多数情况下，您需要访问的大型数据集都保存在某个远程服务器上。使用\
  \ `urlread()`，您可以读取远程文件。要将数据保存到本地磁盘，可以使用 `urlwrite()` 函数。\n\n```\n1  >> a = urlread('http://www.fs.fed.us/land/wfas/fdr_obs.dat');\n\
  2  >> who\n3  Variables in the current scope:\n\n5  a    ans\n\n7  >> whos\n8  Variables\
  \ in the current scope:\n\n10  Attr Name        Size              Bytes     Class\n\
  11  ==== ====        ====              =====     =====\n12  a                1x147589\
  \          147589    char\n13  ans              1x1               8         double\n\
  \n15  Total is 147590 elements using 147597 bytes\n\n17  >> urlwrite('http://www.fs.fed.us/land/wfas/fdr_obs.dat','fire.dat')\n\
  18  >> ls\n19  fire.dat\n20  >>\n```\n\n这里，名为 `a` 的变量存储来自位于 `http://www.fs.fed.us/land/wfas/fdr_obs.dat`\
  \ 的数据文件。或者，使用函数 `urlwrite(URL)` 将所有数据存储为名为 `a.dat` 的文件。\n\n## 4.6 打印和保存图表\n\n一些命令，如\
  \ `print` 和 `saveas`，用于保存由 MATLAB 程序生成的图形/图表，以便以所需的格式保存。它们将在以下部分进行讨论。\n\n### 4.6.1\
  \ print 命令\n\n`print` 命令可打印作业，包括使用打印机和/或绘图仪打印、打印到文件等。如果您需要以指定格式、按照所需文件名自动保存图形，此命令非常有用。\n\
  \n```\n1  %以 svg 格式保存\n2  figure(1);\n3  clf();\n4  peaks();\n5  print −dsvg figure1.svg\n\
  \n7  %以 png 格式保存\n8  figure(1);\n9  clf();\n10  sombrero();\n11  print −dpng figure2.png\n\
  \n13  %打印到 HP DeskJet 550C\n14  clf();\n15  sombrero();\n16  print −dcdj550\n```\n\
  \n`clf` 函数用于清除当前图形窗口。`print` 命令还有许多其他用于保存不同格式的选项。要了解更多信息，请在 MATLAB 终端中键入 `help print`。\n\
  \n### 4.6.2 saveas 函数\n\n`saveas` 函数以所需格式保存图形对象，如下所示：\n\n```\n1  clf();\n2  a =\
  \ sombrero();\n3  saveas (a,\"figure3.png\");\n```\n\n`orient(a,orientation)` 函数定义图形对象\
  \ `a` 的方向。`orientation` 参数的有效值为 `portrait`、`landscape` 和 `tall`。`landscape` 选项更改方向，使绘图宽度大于绘图高度。`tall`\
  \ 选项将方向设置为 `portrait`，并用绘图填充页面，同时保留 0.25 英寸的边距。`portrait` 选项（默认）更改方向，使绘图高度大于绘图宽度。\n\
  \n\n\n## 4.7 总结\n\n本章介绍了各种用于读写权限以及从文件读取数据和向文件写入数据的函数。这成为数值计算练习中的一个基本部分。数据可以通过软件或硬件（仪器）以文件形式生成。MATLAB\
  \ 并不关心其来源。它根据数据的类型和文件类型来处理数据。用户在使用文件时，必须根据具体情况确定合适的函数。\n\n文件操作确实提供了修剪数据的功能，以便只将有用的部分作为数组使用。进一步的修剪可以通过切片操作来完成。掌握了文件处理的技巧，你就可以自信地着手处理复杂的数值计算了。\n\
  \n"
- '# 5. 函数与循环


  ## 5.1 引言


  当某个特定的数值任务需要在不同的数据点上“重复”执行时，数字计算机就成为了有用的工具，因为它们比人类能更快地完成这项工作。循环正是执行这些任务的。通过使用条件来检查开始和终止规则，你可以轻松地执行一个过程中的重复部分。不同的编程语言和环境对于定义循环有不同的规则。MATLAB
  提供了一种更简单的方式来定义和运行循环。稍后将讨论这些内容。


  在此定义“函数”这个术语很有用。一个大型程序可能需要在不同时间调用一组指令。因此，这组指令可以被定义为一个子程序，可以在需要时请求它执行计算。这样，一个复杂的任务就可以被分解成许多小的部分。这种编程架构被称为模块化编程。这是最流行的编程方式，因为它非常合乎逻辑，更利于可视化问题，并且易于调试。定义这些小指令集最流行的方法是将它们定义为函数。本章将详细讨论这两个概念。


  ## 5.2 循环


  循环构成了算法的一个基本部分，因为它们执行的是计算机最擅长的任务：非常快速地执行重复性操作。循环有多种形式——`for` 循环在一系列变量值上重复执行某些任务，`while`
  循环在执行特定任务之前检查一个逻辑条件，而 `if-then-else` 循环则检查一个条件并引导算法的流程。选择哪种循环取决于手头的问题。


  以下各节列出了各种函数及其用法。批判性地判断它们的用法变得非常重要，因为算法中的循环部分消耗了大部分执行时间。


  ### 5.2.1 `while` 循环


  `while` 循环定义一个逻辑条件，在条件满足之前，它会运行一个代码块。`while` 循环的语法如下：


  ```

  1  while condition

  2  BODY

  3  endwhile

  ```


  这里，关键字 `while` 启动了一个 `while` 循环的执行。`condition` 是一个逻辑条件，其答案可以是 `true`（真）（1）或 `false`（假）（0）。`BODY`
  包含一组命令，这些命令在条件成立之前一直执行（见清单 5-1）。


  ```

  1  x = 1.0;

  2  while x<10

  3     disp(sqrt(x));

  4     x = x+1;

  5  endwhile

  清单 5-1

  while1.m 程序

  ```


  `while1.m` 程序首先将变量 `x` 初始化为值 `1.0`。然后它列出一个逻辑条件：


  `x < 10`


  在循环的第一步中，`x = 1`，由于 `1 < 10`，此条件满足。由于此条件满足，执行 `disp(sqrt(x))` 并显示 `x` 的平方根。然后执行第
  4 行，`x = x + 1` 使 `x` 递增。`x` 的新递增值为 2，再次检查逻辑条件 `x < 10`，并执行第 3 行和第 4 行给出的循环体。这个过程一直持续到
  `x = 10`，此时循环条件不再满足。此时，执行第 5 行，宣告 `while` 循环结束。执行 `while1.m` 的结果如下：


  ```

  1  >> while1

  2  1

  3  1.4142

  4  1.7321

  5  2

  6  2.2361

  7  2.4495

  8  2.6458

  9  2.8284

  10  3

  ```


  ### 5.2.2 `do-until` 循环


  重要的是要注意，在某些情况下，对于 `while` 循环，循环体可能一次都不会被执行。这种情况发生在初始化之后，条件不满足时。为了处理这种情况，`do-until`
  循环的语法如下：


  ```

  1  do

  2  BODY

  3  until condition

  ```


  该循环首先执行代码体，然后检查条件。这样，构成循环 `BODY` 的代码块至少会被执行一次。其用法可以通过清单 5-2 中的示例来理解。


  ```

  1  %显示前十个正自然数的平方根

  2  %前十个正自然数

  3

  4  x = 1.0;

  5  do

  6    disp(sqrt(x));

  7    x = x+1;

  8  until x == 10

  清单 5-2

  dountil1.m 程序

  ```


  执行该代码的结果如下：


  ```

  1  >> dountil1

  2  1

  3  1.4142

  4  1.7321

  5  2

  6  2.2361

  7  2.4495

  8  2.6458

  9  2.8284

  10  3

  11  >>

  ```


  在第 4 行，`x` 被初始化为 `1.0`。然后编写循环体来显示 `x` 的平方根，并将其递增 1。这个过程一直持续到 `x = 10`，即直到 `x` 的值变为
  `10`。


  ### 5.2.3 `for` 循环


  `for` 循环用于对一组已知的值执行计算。`for` 循环的语法如下：


  ```

  1  for variable = vector

  2    BODY

  3  end

  ```


  关键字 `for` 声明循环开始，此时一个变量会取存储在向量中的值。然后执行代码体（此处用 `BODY` 表示）。关键字 `end` 声明 `for` 循环的结束。这在清单
  5-3 的示例中进行了解释。


  ```

  1  %计算前 10 个数的平方根的程序

  2  %前 10 个数的平方根

  3

  4  for i = 1:10

  5    ans = sqrt(i)

  6  end

  清单 5-3

  for1.m 程序

  ```


  执行 `for1.m` 的结果如下：


  ```

  1  >> for1

  2  ans = 1

  3  ans = 1.4142

  4  ans = 1.7321

  5  ans = 2

  6  ans = 2.2361

  7  ans = 2.4495

  8  ans = 2.8284

  9  ans = 3

  10  ans = 3.1623

  ```


  ### 5.2.4 `if-elseif-else` 循环


  当你需要在不同时间检查多个条件时，`if-elseif-else` 循环效果很好。此循环的语法如下：


  ```

  1  if condition1

  2  BODY1

  3  elseif condition2

  4  BODY2

  5  else

  6  BODY3

  7  endif

  ```


  在第 1 行，定义了一个条件。如果该条件满足，则执行第 2 行；否则，执行第 3 行。因此，`BODY1` 和 `BODY2` 是通过检查不同条件集而执行的代码块，而
  `BODY3` 是在任何条件都不满足时执行的代码。见清单 5-4。


  ```

  1  %检查一个数的程序

  2  %数是奇数还是偶数

  3

  4  x = 33;

  5

  6  if(rem(x,2) == 0)

  7    printf("x 是偶数\n");

  8  elseif(rem(x,5) == 0)

  9    printf("x 是奇数且可被 5 整除\n");

  10  else

  11    printf("x 是奇数\n");

  12  endif

  清单 5-4

  ifelse1.m 程序

  ```


  执行 `ifelse1.m` 的结果如下：


  ```

  1  >> ifelse1

  2  x 是奇数且可被 5 整除

  ```


  在第 4 行，`x` 被初始化为 `33`。然后，在第 6 行，检查 `x / 2` 的余数。如果为零，则执行第 7 行。否则，执行第 8 行，并检查 `x /
  5` 的余数。如果为零，则执行第 9 行。如果两个条件都不满足，则执行第 11 行。第 12 行结束 `if-else` 循环。


  ## 5.3 函数


  函数是可以根据需要调用的代码。因此，它可以单独定义，要么在单独的文件中，要么在程序体内。MATLAB 提供了几种定义函数的方法，这些将在以下小节中讨论。




  ### 5.3.1 `function` 函数


  `function` 的定义遵循以下语法：


  ```

  1  function [返回值 1, 返回值 2, ...] = 函数名([参数 1, 参数 2,...])

  2  函数体

  3  endfunction

  ```


  在这里，`function` 关键字将对象类型定义为函数。然后，定义一组该函数预期返回的变量。接下来是 `=` 运算符，然后是函数的名称。在这个例子中，它被命名为
  `name`。`name` 对象接受一组参数，这些参数是函数所定义的对象。接着是函数的主体部分。最后一部分定义了函数的结束。例如，可以编写一个函数来计算 x²
  − y²，并将结果赋值给名为 `z` 的变量，如下所示：


  ```

  1  function y = fn1(x,y)

  2  y = xˆ2−yˆ2;

  3  end

  ```


  将其保存为当前工作目录下的 `fn1.m` 文件。现在转到 MATLAB 终端并输入以下内容：


  ```

  1  >> fn1(5,1)

  2  ans = 24

  3  >> fn1(5,2)

  4  ans = 21

  5  >> fn1(5,3)

  6  ans = 16

  7  >> fn1(5,4)

  8  ans = 9

  9  >> fn1(5,5)

  10  ans = 0

  ```


  可以看到，名为 `fn1` 的函数正在对其定义的两个输入参数执行 x² − y² 的计算。


  将程序定义为一组函数文件，然后在存储为脚本文件的主程序中调用它们，是一种良好的实践。这种模块化方法使得尝试不同的思路变得容易，同时也使代码的调试和测试更加简便。一个函数也可以返回两个以上的值。例如：


  ```

  1  function[y1,y2,y3] = fn2(x,y)

  2  y1 = xˆ2−yˆ2;

  3  y2 = xˆ2+yˆ2;

  4  y3 = y2−y1;

  5  end

  ```


  这将得到以下结果：


  ```

  1  >> [a,b,c] = fn2(5,2)

  2  a = 21

  3  b = 29

  4  c = 8

  5  >> [a,b,c] = fn2(5,0)

  6  a = 25

  7  b = 25

  8  c = 0

  ```


  函数可以包含循环来管理程序中的重复任务。例如，可以使用下面给出的函数来计算一个数的阶乘：


  ```

  1  function result = factorial(n)

  2    if(n == 0)

  3      result = 1;

  4      return;

  5    else

  6      result = prod(1:n);

  7    endif

  8  endfunction

  ```


  一个名为 `factorial` 的函数，它接受一个数字 `n` 作为参数，计算该数字与所有连续数字的乘积。当从 MATLAB 命令行调用时，该函数产生以下结果：


  ```

  1  >> factorial(50)

  2  ans = 3.0414e+064

  3  >> factorial(1)

  4  ans = 1

  5  >> factorial(0)

  6  ans = 1

  7  >> factorial(100)

  8  ans = 9.3326e+157

  9  >> factorial(1000)

  10  ans = NaN

  11  >> factorial(−1)

  12  error:factorial:N must all be non−negative integers

  ```


  `help NaN` 和 `help prod` 提供了关于这些命令行为的有用见解。


  ### 5.3.2 `inline` 函数


  函数也可以使用 `inline` 关键字进行内联定义，如下所示：


  ```

  1  >> f = inline("xˆ2+y");

  2  >> f(1,2)

  3  ans = 3

  4  >> f(10,10)

  5  ans = 110

  6  >> f(0,2)

  7  ans = 2

  8  >>

  ```


  第 1 行定义了一个名为 `f` 的函数，包含两个变量 `x` 和 `y`，用于计算 f(x, y) = x² + y。当使用这两个变量的值调用时，该函数会输出计算出的值。


  ### 5.3.3 匿名函数


  匿名函数是在程序中定义的未命名函数对象。它们的定义遵循简单的语法：


  ```

  @(参数列表) 表达式

  ```


  例如：


  ```

  1  >> a = @(x) sin(x)*cos(x);

  2  >> quad(a,0,1)

  3  ans = 0.35404

  4  >> quad(a,0,pi)

  5  ans = 7.3031e−017

  6  >> quad(a,−pi,pi)

  7  ans = 0

  8  >> quad(a,−pi,2*pi)

  9  ans = −2.8435e−016

  10  >> quad(a,−2*pi,2*pi)

  11  ans = 0

  ```


  `help quad` 告诉我们，函数 `quad` 用于计算一个函数在两个值之间的积分。因此，第 1 行定义了一个函数 sin(x)cos(x)，其积分结果如下所示。


  ![ $$ {\displaystyle \begin{array}{l}\underset{0}{\overset{1}{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0.35404\\
  {}\underset{0}{\overset{\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=7.3031\times
  {10}^{-17}\\ {}\kern0.125em \underset{-\pi }{\overset{\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0\\
  {}\underset{-\pi }{\overset{2\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=-2.8435\times
  {10}^{-16}\\ {}\underset{-\pi }{\overset{2\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0\end{array}}
  $$ ](img/A458923_1_En_5_Chapter_Equb.gif)


  因此，如果使用匿名函数定义，则无需为函数命名。


  ## 5.4 总结


  定义函数是模块化编程的关键。MATLAB 提供了一种优雅的方式来定义和使用函数，无论是内联形式还是单独的文件形式。当与在循环中编写函数的能力相结合时，复杂的问题只需几行代码即可实现。这需要在设计算法时具备艺术性的态度，其中函数和循环就像是画笔，帮助您为给定的数值问题设计出优雅的解决方案。


