  *   `y4 = x.^(2.3)` 创建一个名为 `y4` 的新向量，其元素为向量 `x` 的 2.3 次幂（第 7 行）。\n*   `y5 = x.^(2.4)`\
  \ 创建一个名为 `y5` 的新向量，其元素为向量 `x` 的 2.4 次幂（第 8 行）。\n\n运行代码即可得到图 3-3。这类图形用于通过改变特定参数来检查结果的变化情况。\n\
  \n#### 分别绘制多个图形\n\n`subplot(row, coloumn, index)` 命令用于在同一个图形上，但以独立的子视图形式绘制多个图形。`subplot(2,2,4)`\
