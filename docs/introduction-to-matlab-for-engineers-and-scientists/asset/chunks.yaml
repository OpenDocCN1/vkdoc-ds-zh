  trans: '

    ### 7.5.1 有效数字


    有效数字的概念在此起着重要作用。如果计算机能够存储最终答案的所有有效数字，那么误差就无关紧要。否则，在报告最终答案时，识别这些误差并尽可能加以纠正就显得很重要。例如，在处理`pi`时，如果只需要三位有效数字，那么任何低端计算解决方案都能轻松存储。


    计算机可以将数字存储为浮点数对象。浮点数对象按如下方式存储数字：


    ![ $$ \pm {d}_1{d}_2\dots {d}_s\times {\beta}^e $$ ](img/A458923_1_En_7_Chapter_Equ11.gif)


    (方程 7-11)


    其中 ![ $$ {d}_i=0,1,2\dots \beta -1 $$ ](img/A458923_1_En_7_Chapter_IEq5.gif) 但
    ![ $$ {d}_1\ne 0 $$ ](img/A458923_1_En_7_Chapter_IEq6.gif) 且 ![ $$ m\le e\le M
    $$ ](img/A458923_1_En_7_Chapter_IEq7.gif) ，这里 ![ $$ m\in {I}^{-} $$ ](img/A458923_1_En_7_Chapter_IEq8.gif)
    ，![ $$ M\in {I}^{+} $$ ](img/A458923_1_En_7_Chapter_IEq9.gif)。


    浮点数的三个组成部分为：


    - 符号（`±`）

    - 尾数（`d[1]d[2]...d[s]`）

    - 指数（`β`）


    在 IEEE 双精度舍入标准下，MATLAB 使用二进制运算，其中：


    - ![ $$ \beta =2 $$ ](img/A458923_1_En_7_Chapter_Eque.gif)

    - `s = 53`

    - `m = -1074`

    - `M = +1023`


    由于人类习惯于十进制运算系统，为了报告结果，这些二进制数会被转换为十进制数。理解以下关键点很重要：所有内部计算都以二进制形式进行，但面向人类的输入和输出则以十进制形式提供。因转换而产生的舍入误差由单位舍入量
    `u` 给出，它是在将实数近似为浮点数时的最大相对误差。


    MATLAB 可以处理绝对值的范围从 ![ $$ {2}^{-1074}\simeq {10}^{-324} $$ ](img/A458923_1_En_7_Chapter_IEq10.gif)
    到 ![ $$ {2}^{-1023}\simeq {10}^{308} $$ ](img/A458923_1_En_7_Chapter_IEq11.gif)
    的数字，其单位舍入量为 ![ $$ u={2}^{-53}\simeq {10}^{-16} $$ ](img/A458923_1_En_7_Chapter_IEq12.gif)。


    ## 7.6 实数转换为浮点数的挑战


    实数 `x` 可按浮点表示法（由方程 7-11 给出）存储为：


    ![ $$ x=\pm {d}_1{d}_2\dots {d}_s{d}_{s+1}\dots \times {10}^e $$ ](img/A458923_1_En_7_Chapter_Equ12.gif)


    (方程 7-12)


    现在注意 `s = 53`，但上述描述并未限制浮点数的表示方式。然而，其存储过程则完全是另一回事。在存储时，数字会根据指导原则进行舍入并存储，即 `s =
    53`。


    ### 7.6.1 上溢


    根据方程 7-11 和 7-12，如果 `e > M`，则称计算发生了上溢。这意味着出现了一个比可能存储范围更大的数字，从而导致存储容器溢出。在这种情况下，MATLAB
    会生成 `Inf` 或 `-Inf` 作为答案，这表示答案是一个非常大的数字。


    以下在 MATLAB 终端中执行的练习清晰地说明了这一过程。当尝试计算 `e900` 时，结果显示为 `Inf`。当该数字除以一个负数时，结果显示为 `-Inf`，表明在存储负数时发生了上溢。当尝试计算
    `Inf - Inf` 时，结果显示为 `NaN`（代表“非数字”），表明这些过大的数字无法产生有意义的结果。


    ```

    1  >> format long

    2  >> exp(50)


    4  ans =


    6  5.184705528587072e+21


    8  >> exp(100)


    10  ans =


    12  2.688117141816136e+43


    14  >> exp(500)


    16  ans =


    18  1.403592217852837e+217


    20  >> exp(700)


    22  ans =


    24  1.014232054735005e+304


    26  >> exp(900)


    28  ans =


    30  Inf


    32  >> exp(900)/-2


    34  ans =


    36  -Inf


    38  >> exp(900)-exp(900)


    40  ans =


    42  NaN

    ```


    ### 7.6.2 下溢


    如果 `e < m`，则称发生了下溢。Octave 通过显示零和答案来表示下溢。表面上看下溢似乎不严重，但请考虑以下事实：根据指数运算的基本规则：


    ![ $$ {e}^a{e}^{-a}={e}^{a-a}={e}⁰=1 $$ ](img/A458923_1_En_7_Chapter_Equf.gif)


    当对表示上溢和下溢的数字执行相同计算时，Octave 必须计算 `Inf * 0`，结果为 `NaN`。以下示例演示了这一点：


    ```

    1  >> exp(900)*exp(-900)


    3  ans =


    5  NaN


    7  >> exp(900)


    9  ans =


    11  Inf


    13  >> exp(-900)


    15  ans =


    17  0

    ```


    ## 7.7 实数到浮点数的实际转换


    在了解了上溢和下溢这两个极端情况后，您需要理解实数到浮点数的转换过程。回顾方程 7-11 和 7-12，一个实数可以用 `s` 位有效数字存储如下：


    ![ $$ \pm {d}_1{d}_2\dots {d}_s\times {\beta}^e $$ ](img/A458923_1_En_7_Chapter_Equg.gif)


    而它可以用浮点表示法（以 10 为基数）写成如下形式：


    ![ $$ x=\pm {d}_1{d}_2\dots {d}_s{d}_{s+1}\dots \times {10}^e $$ ](img/A458923_1_En_7_Chapter_Equh.gif)


    有两种方法可以实现转换：截断法和舍入法。截断法会直接丢弃 `s` 之后的所有数字，即生成以下结果：


    ![ $$ x=\pm {d}_1{d}_2\dots {d}_s\times {10}^e $$ ](img/A458923_1_En_7_Chapter_Equ13.gif)


    (方程 7-13)


    另一方面，舍入法推荐以下过程：


    1. 如果 `s_{s+1}` < 5，则执行截断并保留 `x` 的符号。

    2. 如果 `s_{s+1}` > 5，则 `d[s]` 加 1。然后执行截断并保留 `x` 的符号。


    这个看似简单的方案存在一个缺陷。假设 `s = 4`，您需要对 2.9345 进行舍入。答案会是 2.934，即最后一位数字 5 被直接丢弃。类似地，当对
    2.9355 进行舍入时，答案可以写成 2.936，其中最后一位数字被丢弃，最后一位有效数字加 1。在这两种情况下，只有一个数字发生了变化。但假设您需要对
    2.9999 进行舍入。在这种情况下，结果会是 3.000，其中有四个数值发生了变化。


    ## 7.8 MATLAB 的替代方案


    随着计算能力的增长、数值计算机的进步以及计算资源价格的下降，MATLAB 已成为工程领域的语言。面对来自开源替代方案（如 Scilab [1]、Octave
    [2] 和 Python [3]）的挑战，它现在需要在新的维度上进行创新，以在商业和学术领域保持相关性。我关于 Octave、Scilab 和 Python
    的书籍（可在亚马逊 [4, 5, 6] 上找到）与本书内容并行，以便于比较 [7]。我强烈建议您研究所有这些选项，以便为您的需求做出最佳决策。


    ## 7.9 总结


    现在应该清楚的是，使用数值计算对物理系统进行数学建模，并不仅仅是输入数据然后得到输出。这必须审慎进行。在有限计算精度的离散系统上执行计算这一行为本身就会引入误差。在呈现结果时必须提及这些误差，以便其他研究者可以交叉验证。尽管数值计算编码繁琐且会引入误差，但在科学家中仍然非常流行。这是因为现代计算机提供了更高的计算速度，而且对大多数物理世界问题的解析解进行人工计算过于繁琐。预计这一趋势在不久的将来仍将持续。


    # 8. 符号计算

    '
- fmt: '# 8.1 Introduction


    Until now, we have been dealing with numeric computation where variables store
    numeric values. In Chapter [7](#A458923_1_En_7_Chapter.html), you learned that
    numerical computation involves working with approximate solutions. On the other
    hand, an analytical solution is not an approximation since one uses symbols rather
    than numbers. MATLAB provides the means to perform symbolic computations, too.


    # 8.2 Defining a Symbolic Variable


    The keyword `syms` is used to define single or multiple symbolic variable(s).
    The key feature of a symbolic variable is that it just stores a symbol to perform
    symbolic calculations.


    ```

    >> syms x y z

    >>

    ```


    After executing the command, inspect the Workspace window (see Figure [8-1](#A458923_1_En_8_Chapter.html#Fig1))
    and note that three new variables—`x`, `y`, and `z` —have been created.


    ![A458923_1_En_8_Fig1_HTML.jpg](A458923_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    New symbolic variables appearing in the workspace


    # 8.3 Defining a Symbolic Equation


    Once the variables have been defined, you can define an equation:


    ![$$ z={x}^2+y $$](A458923_1_En_8_Chapter_Equ1.gif)


    (Equation 8-1) using these variables as follows:


    ```

    >> z = xˆ2+y

    z =

    xˆ2 + y

    ```


    In the present example, `z` was predefined as a symbolic variable. The output
    variable is created by MATLAB and becomes a symbolic variable by default. Its
    inputs have been defined as symbolic variables. For example, suppose you want
    to define this equation:


    ![$$ a={x}^3+{y}^2+z $$](A458923_1_En_8_Chapter_Equ2.gif)


    (Equation 8-2)


    This results in the creation of a new symbolic variable (which can be verified
    by checking the Workspace window). The following MATLAB code performs this task:


    ```

    >> syms x y z

    >> a = xˆ3+yˆ2+z

    a =

    xˆ3 + yˆ2 + z

    ```


    # 8.4 Performing Symbolic Computations


    Symbolic computations are same as what we are used to doing by hand on paper.
    You define a variable and use mathematical rules of algebra as well as calculus
    to perform calculations. For example, two roots (`r` [1] and `r` [2]) of a quadratic
    equation :


    ![$$ y=a{x}^2+ bx+c $$](A458923_1_En_8_Chapter_Equ3.gif)


    (Equation 8-3) can be written as follows:


    ![$$ {r}_1=\frac{-b+\sqrt{b^2-4 ac}}{2a} $$](A458923_1_En_8_Chapter_Equ4.gif)


    (Equation 8-4)


    ![$$ {r}_1=\frac{-b-\sqrt{b^2-4 ac}}{2a} $$](A458923_1_En_8_Chapter_Equ5.gif)


    (Equation 8-5)


    This can be performed using the following MATLAB code :


    ```

    >> syms a b c x

    >> y = a*(xˆ2)+(b*x)+c

    y =

    a*xˆ2 + b*x + c

    >> solve(y)

    ans =

    −(b + (bˆ2 − 4*a*c)ˆ(1/2))/(2*a)

    −(b − (bˆ2 − 4*a*c)ˆ(1/2))/(2*a)

    ```


    Similarly, a symbolic mathematical expression can be integrated and differentiated
    as follows:


    ```

    >> syms a b c x

    >> y = a*(xˆ2)+(b*x)+c

    y =

    a*xˆ2 + b*x + c

    >> int(y)

    ans =

    (a*xˆ3)/3 + (b*xˆ2)/2 + c*x

    >> diff(y)

    ans =

    b + 2*a*x

    ```


    This can be verified using paper-based calculation by hand, where we know the
    following:


    ![$$ y=a{x}^2+ bx+c $$](A458923_1_En_8_Chapter_Equ6.gif)


    (Equation 8-6)


    ![$$ \int y=\frac{a{x}^3}{3}+\frac{b{x}^2}{2}+ cx $$](A458923_1_En_8_Chapter_Equ7.gif)


    (Equation 8-7)


    ![$$ \frac{dy}{dx}=2 ax+b $$](A458923_1_En_8_Chapter_Equ8.gif)


    (Equation 8-8)


    ## 8.4.1 Arithmetic Expressions


    Simple arithmetic expressions can be dealt with using symbols. For example, two
    polynomials can be used to define a new polynomial.


    ```

    >> syms x y z

    >> a1 = xˆ2+2*y+z

    a1 =

    xˆ2 + 2*y + z

    >> a2 = xˆ(−2)−2*y+3*z

    a2 =

    3*z − 2*y + 1/xˆ2

    >> a3 = a1/a2

    a3 =

    (xˆ2 + 2*y + z)/(3*z − 2*y + 1/xˆ2)

    >> a4 = a1*a2

    a4 =

    (xˆ2 + 2*y + z)*(3*z − 2*y+1/xˆ2)

    ```


    ## 8.4.2 Trigonometric Expressions


    Trigonometric variables defined using symbolic variables can also be used in mathematical
    calculations, as follows:


    ![$$ y=\sin (x) $$](A458923_1_En_8_Chapter_Equ9.gif)


    (Equation 8-9)


    ![$$ \frac{dy}{dx}=-\cos (x) $$](A458923_1_En_8_Chapter_Equ10.gif)


    (Equation 8-10)


    ```

    >> syms a b c x

    >> y = sin(x)

    y =

    sin(x)

    >> int(y)

    ans =

    −cos(x)

