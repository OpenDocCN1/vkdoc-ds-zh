    ## 2.11 Solving a System of Equations


    Solving a system of equations in one line simply involves the `\` operator. Suppose
    the following system of equations needs to be solved:


    ![ $$ 2x-2y=4 $$ ](A458923_1_En_2_Chapter_Equ1.gif)


    (Equation 2-1)


    ![ $$ -3x+4y=9 $$ ](A458923_1_En_2_Chapter_Equ2.gif)


    (Equation 2-2)


    You can define this problem in a matrix, as follows:


    ![ $$ \left[\begin{array}{cc}2& -2\\ {}-3& 4\end{array}\right]\times \left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{l}4\\ {}9\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ3.gif)


    (Equation 2-3)


    Suppose:


    ![ $$ A=\left[\begin{array}{cc}2& -2\\ {}-3& 4\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ4.gif)


    (Equation 2-4)


    ![ $$ X=\left[\begin{array}{l}x\\ {}y\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ5.gif)


    (Equation 2-5)


    ![ $$ B=\left[\begin{array}{l}4\\ {}9\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ6.gif)


    (Equation 2-6)


    In this way, you can write the following:


    ![ $$ A\times X=B $$ ](A458923_1_En_2_Chapter_Equ7.gif)


    (Equation 2-7)


    The solution is given by X = A ^(−1) B. You can find the inverse of `A` (using
    the `inv()` or `pinv()`) function) and then multiply the resultant matrix with
    the matrix given by `B` to find a solution. Alternatively, you can accomplish
    this task in just one command, as `A\B`:


    ```

    1  >> A = [2,–2;–3,4]


    3  A =


    5  2   –2

    6  –3    4


    8  >> B = [4;9]


    10  B =


    12  4   9


    14  >> C = A/B


    16  ans =


    18  17.0000

    19  15.0000

    ```


    Hence, the solution is x = 17 and y = 15\. Since the elements of the `C` matrix
    are solutions, this is often called a solution matrix .


    ## 2.12 Eigen Values and Eigen Vectors


    The eigenvalue problem is to determine the solution to the equation Av = λv, where
    A is an n × n matrix, v is a column vector of length n, and λ is a scalar. The
    values of λ that satisfy the equation are the eigenvalues. The corresponding values
    of v that satisfy the equation are the right eigenvectors. The left eigenvectors,
    w, satisfy the equation ![ $$ {w}^{\prime }A=\lambda {w}^{\prime } $$ ](A458923_1_En_2_Chapter_IEq1.gif).
    The MATLAB function `eig()` returns the eigenvalues and eigenvectors. It also
    gives the matrix D (diagonal matrix D of eigenvalues), which is related to W and
    A as ![ $$ {W}^{\prime }A=D{W}^{\prime } $$ ](A458923_1_En_2_Chapter_IEq2.gif):


    ```

    1  >> A = rand(3,3)


    3  A =


    5  0.6551    0.4984    0.5853

    6  0.1626    0.9597    0.2238

    7  0.1190    0.3404    0.7513


    9  >> [V,D,W] = eig(A)


    11  V =


    13  –0.7284   –0.9532   0.8945

    14  –0.5300   0.2997    –0.4178

    15  –0.4341   0.0411    0.1590


    18  D =


    20  1.3665        0             0

    21  0             0.4732        0

    22  0             0             0.5264


    25  W =


    27  –0.2724    –0.3066    –0.1266

    28  –0.7915    –0.3145    –0.5186

    29  –0.5471    0.8984     0.8456

    ```


    ## 2.13 Structure Arrays


    Arrays stores elements of the same data types, whereas structure arrays can store
    data of different data types. Structures are collections of data organized by
    named fields. For example, one field may contain textual data, another a number,
    and a third may be an array, etc. A single structure is a `1-by-1` structure array.
    Let’s understand how to create them by using an example. Let’s create a structure
    array for this book and name this array `book`. Now, various fields can be added
    using the dot operator, such as `name`, `author`, `pages`, and `chapter`. The
    `book` array is a `1-by-1` structure with four fields. This is demonstrated here.


    ```

    1  >> book.name = ''Introducing MATLAB''


    3  book =


    5  struct with fields:


    7  name:''Introducing MATLAB''


    9  >> book.author = ''Sandeep Nagar''


    11  book =


    13  struct with fields:


    15  name:''Introducing MATLAB''

    16  author:''Sandeep Nagar''


    18  >> book.pages = ''175''


    20  book =


    22  struct with fields:


    24  name:''Introducing MATLAB''

    25  author:''Sandeep Nagar''

    26  pages:''175''


    28  >> book.chapters = [1 2 3 4 5 6 7]


    30  book =


    32  struct with fields:


    34  name:''Introducing MATLAB''

    35  author:''Sandeep Nagar''

    36  pages:''175''

    37  chapters:[1 2 3 4 5 6 7]

    ```


    ### 2.13.1 Defining a New Structure Element Within a Structure Array


    A new structure element can be defined within an existing structure array (`book`,
    in this example) using index values in the following manner.


    ```

    1  >> book(2).name = ''Introducing SCILAB''


    3  book =


    5  1x2 struct array with fields:


    7  name

    8  author

    9  pages

    10  chapters


    12  >> book(2).author = ''Sandeep Nagar''


    14  book =


    16  1x2 struct array with fields:


    18  name

    19  author

    20  pages

    21  chapters


    23  >> book(2).pages = 175


    25  book =


    27  1x2 struct array with fields:


    29  name

    30  author

    31  pages

    32  chapters


    34  >> book(2).chapters = [1 2 3 4 5 6 7 8 9]


    36  book =


    38  1x2 struct array with fields:


    40  name

    41  author

    42  pages

    43  chapters

    ```


    In this way, the book is now a `1×2` structure array. All structures in a structure
    array have the same number of fields and all fields have the same number of field
    names. When the name of the structure array is entered at the command prompt,
    the summary of information and fields is displayed. The `fieldnames()` function
    can be used to get a cell array having information about the fields. This is demonstrated
    in the following code.


    ```

    1  >> book


    3  book =


    5  1x2 struct array with fields:


    7  name

    8  author

    9  pages

    10  chapters


    12  >> fieldnames(book)


    14  ans =


    16  4x1 cell array


    18  ''name''

    19  ''author''

    20  ''pages''

    21  ''chapters''

    ```


    While expanding a structure array, it is not mandatory to fill in all the fields.
    Fields that are not associated with values are left empty.


    ### 2.13.2 Adding and Removing Fields


    A new field can be added at any point to a single structure. For example, let’s
    add the field `publisher` to the structure `book`, as demonstrated here.


    ```

    1  >> book(2).publisher = ''Apress''


    3  book =


    5  1x2 struct array with fields:


    7  name

    8  author

    9  pages

    10  chapters

    11  publisher


    13  >> book


    15  book =


    17  1x2 struct array with fields:


    19  name

    20  author

    21  pages

    22  chapters

    23  publisher


    25  >> book = rmfield(book,''publisher'')


    27  book =


    29  1x2 struct array with fields:


    31  name

    32  author

    33  pages

    34  chapters

    ```


    To remove a field, say `publisher`, from the structure `book`, you can use the
    `rmfield()` function, as demonstrated.'
