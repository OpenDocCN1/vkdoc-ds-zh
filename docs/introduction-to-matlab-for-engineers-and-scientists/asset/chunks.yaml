    \ it’s `2` if it is a semiconductor, and it’s `3` if it is an insulator. Then,\
    \ a row vector (a matrix composed of only one row) `[1 0 0 3 2 1 3 0 1 0 3 2 1]`\
    \ has information about 13 compounds. In electrical conductivity experiments,\
    \ this row vector (a 13×1 matrix) can be utilized as input. In this way, you need\
    \ to model the system in terms of matrix formulation to be solved using MATLAB.\n\
    \nMATLAB defines a data object for dealing with matrices. They are called `arrays`.\
    \ Using different properties of this object, you can define various kinds of matrices.\
    \ Built-in functions for matrix operations make it easier for a programmer to\
    \ deal with large amounts of data by arranging it as a matrix in the desired format\
    \ and performing array operations. This chapter explores the various options for\
    \ defining and manipulating arrays.\n\nSince MATLAB was made for matrix manipulation,\
    \ it has a large set of built-in functions and a robust environment to define\
    \ and work with matrices.\n\n## 2.2 Arrays and Vectors\n\nInstead of just pointing\
    \ to a single number, a variable name can also point to a sequential set of numbers,\
    \ called an `array`. The following example shows how this can be achieved:\n\n\
    ```\n>> a = [1,2,3,4,5]\na =\n     1     2     3     4     5\n\n>> a1 = [10,11,12,13,14]\n\
