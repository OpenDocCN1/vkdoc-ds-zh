    状态被保存在 `state1` 变量中，然后 `r1` 和 `r2` 创建了两个 2×3 大小的数组。它们包含不同的元素。但是，当使用 `rng(state1)`
    重置状态时，存储在 `r3` 中的相同大小的新数组与 `r1` 完全相同，而 `r1` 是在机器状态保存到 `state1` 变量时创建的。


    正态分布的随机数生成器由函数 `randn()` 提供。这样生成的随机数在 0 附近呈正态分布。第 3 章的图 3-7 证实了这一事实。


    可以通过为每个维度输入一个数组来生成三维随机数数组。例如，如果将数组 `A = [3,2,4]` 输入到 `rand()` 函数中，则会创建一个三维随机数数组，如下所示：


    ```

    >> A = [3,2,4];

    >> B = rand(A)


    B(:,:,1) =


    0.7482    0.2290

    0.4505    0.9133

    0.0838    0.1524


    B(:,:,2) =


    0.8258    0.0782

    0.5383    0.4427

    0.9961    0.1067


    B(:,:,3) =


    0.9619    0.8173

    0.0046    0.8687

    0.7749    0.0844


    B(:,:,4) =


    0.3998    0.4314

    0.2599    0.9106

    0.8001    0.1818


    >> size(B)


    ans =


    3    2    4

    ```


    ### 2.7.1 矩阵操作


    一些常见的矩阵操作已经以函数形式编写，这使得开发人员能够直接使用它们，而不必将时间花在编写最优代码上。


    ### 2.7.2 翻转矩阵


    `flipud(A)` 返回矩阵 `A` 的一个副本，其行的顺序沿水平轴反转。`flipud` 代表上下翻转。`fliplr(A)` 返回矩阵 `A` 的一个副本，其行的顺序从左到右反转。`fliplr`
    代表左右翻转。


    ```

    >> a = [1 2; 3 4; 5 6]

    a =


    1    2

    3    4

    5    6


    >> fliplr(a)

    ans =


    2    1

    4    3

    6    5


    >> flipud(a)

    ans =


    5    6

    3    4

    1    2

    ```


    ### 2.7.3 旋转矩阵


    使用命令 `rot90(a,n)`，你可以将矩阵 `a` 按 90 度旋转 `n` 次。


    ```

    >> a = [1 2; 3 4; 5 6]

    a =


    1    2

    3    4

    5    6


    >> rot90(a,1)

    ans =


    2    4    6

    1    3    5


    >> rot90(a,2)

    ans =


    6    5

    4    3

    2    1


    >> rot90(a,4)

    ans =


    1    2

    3    4

    5    6

    ```


    ### 2.7.4 重塑矩阵


    只要元素总数保持不变，可以更改矩阵的行数和列数。


    ```

    >> a = [1 2; 3 4; 5 6]

    a =


    1    2

    3    4

    5    6


    >> reshape(a,6,1)

    ans =


    1

    3

    5

    2

    4

    6


    >> reshape(a,4,1)

    Error using reshape

    要执行 RESHAPE，元素的数目必须不变。

    ```


    ### 2.7.5 排序


    可以使用 `sort` 函数按升序对数字进行排序：


    ```

    >> a = rand(1,5)

    a =


    0.7431    0.3922    0.6555    0.1712    0.7060


    >> sort(a)

    ans =


    0.1712    0.3922    0.6555    0.7060    0.7431

    ```


    ### 2.7.6 上三角矩阵和下三角矩阵


    上三角矩阵是指只有对角线及其上方的元素非零的矩阵。类似地，下三角矩阵是指只有对角线及其下方的元素非零的矩阵。


    ```

    >> a = rand(3,3)

    a =


    0.0318    0.0971    0.3171

    0.2769    0.8235    0.9502

    0.0462    0.6948    0.0344


    >> tril(a)

    ans =


    0.0318    0         0

    0.2769    0.8235    0

    0.0462    0.6948    0.0344


    >> triu(a)

    ans =


    0.0318    0.0971    0.3171

    0         0.8235    0.9502

    0         0         0.0344

    ```


    ### 2.7.7 全 1 矩阵和全 0 矩阵


    所有元素都是 1 或 0 的矩阵分别构成全 1 矩阵和全 0 矩阵：


    ```

    >> ones(3,3)

    ans =


    1    1    1

    1    1    1

    1    1    1


    >> zeros(3,3)

    ans =


    0    0    0

    0    0    0

    0    0    0

    ```


    ## 2.8 索引


    矩阵的每个元素由两个数字表示：行号和列号。这用于精确定位一个元素并对其进行操作。


    ```

    >> a = rand(2,3)

    a =


    0.6557    0.8491    0.6787

    0.0357    0.9340    0.7577


    >> a(2,3)=1

    a =


    0.6557    0.8491    0.6787

    0.0357    0.9340    1.0000


    >> a(1,1)=0

    a =


    0         0.8491    0.6787

    0.0357    0.9340    1.0000

    ```


    请注意，`a(2,3)=1` 将第二行第三列的元素，即数字 0.3041072 设置为 1，而 `a(1,1)=0` 将第一行第一列的元素，即数字 0.5248873
    设置为 0。要对向量中的元素进行索引，只需要一个数字。


    ```

    >> a = [1,2,3,4,5,6,7,8,9]

    a =


    Columns 1 through 7


    1    2    3    4    5    6    7


    Columns 8 through 9


    8    9


    >> a(1)

    ans =


    1


    >> a(–1)

    下标索引必须为正整数类型或逻辑类型。


    >> a(5)

    ans =


    5


    >> a(10)

    索引超出矩阵维度。

    ```


    需要特别注意的是，与某些从 0 开始索引的编程语言不同，MATLAB 的索引从 1 开始，并且不接受负数作为索引。


    ### 2.8.1 使用索引创建新向量


    ```

    >> a = [10 20 30 40 50 60]

    a =


    10   20   30   40   50   60


    >> b = a([1 3 6 1])

    b =


    10   30   60   10

    ```


    在上一个示例中，`b` 是由向量 `a` 形成的新向量，其连续元素由取自索引向量 `[1 3 6 1]` 的元素组成。


    ```

    >> a = [11,12,13;40,50,60;17,18,19]

    a =


    11    12    13

    40    50    60

    17    18    19


    >> a([1,2], [2,3])

    ans =


    12    13

    50    60

    ```


    请注意，由于逗号运算符是可选的，因此我们将仅使用空格来定义向量和矩阵。


