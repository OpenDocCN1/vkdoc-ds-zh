    ```'
  raw: '## 8.1 Introduction


    Until now, we have been dealing with numeric computation where variables store
    numeric values. In Chapter [7](#A458923_1_En_7_Chapter.html), you learned that
    numerical computation involves working with approximate solutions. On the other
    hand, an analytical solution is not an approximation since one uses symbols rather
    than numbers. MATLAB provides the means to perform symbolic computations, too.


    ## 8.2 Defining a Symbolic Variable


    The keyword `syms` is used to define single or multiple symbolic variable(s).
    The key feature of a symbolic variable is that it just stores a symbol to perform
    symbolic calculations.


    ```

    1  >> syms x y z

    2  >>

    ```


    After executing the command, inspect the Workspace window (see Figure [8-1](#A458923_1_En_8_Chapter.html#Fig1))
    and note that three new variables—`x`, `y`, and `z` —have been created.


    ![A458923_1_En_8_Fig1_HTML.jpg](A458923_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    New symbolic variables appearing in the workspace


    ## 8.3 Defining a Symbolic Equation


    Once the variables have been defined, you can define an equation:


    ![$$ z={x}^2+y $$](A458923_1_En_8_Chapter_Equ1.gif)


    (Equation 8-1) using these variables as follows:


    ```

    1  >> z = xˆ2+y

    2  z =

    3  xˆ2 + y

    ```


    In the present example, `z` was predefined as a symbolic variable. The output
    variable is created by MATLAB and becomes a symbolic variable by default. Its
    inputs have been defined as symbolic variables. For example, suppose you want
    to define this equation:


    ![$$ a={x}^3+{y}^2+z $$](A458923_1_En_8_Chapter_Equ2.gif)


    (Equation 8-2)


    This results in the creation of a new symbolic variable (which can be verified
    by checking the Workspace window). The following MATLAB code performs this task:


    ```

    1  >> syms x y z

    2  >> a = xˆ3+yˆ2+z

    3  a =

    4  xˆ3 + yˆ2 + z

    ```


    ## 8.4 Performing Symbolic Computations


    Symbolic computations are same as what we are used to doing by hand on paper.
    You define a variable and use mathematical rules of algebra as well as calculus
    to perform calculations. For example, two roots (`r` [1] and `r` [2]) of a quadratic
    equation :


    ![$$ y=a{x}^2+ bx+c $$](A458923_1_En_8_Chapter_Equ3.gif)


    (Equation 8-3) can be written as follows:


    ![$$ {r}_1=\frac{-b+\sqrt{b^2-4 ac}}{2a} $$](A458923_1_En_8_Chapter_Equ4.gif)


    (Equation 8-4)


    ![$$ {r}_1=\frac{-b-\sqrt{b^2-4 ac}}{2a} $$](A458923_1_En_8_Chapter_Equ5.gif)


    (Equation 8-5)


    This can be performed using the following MATLAB code :


    ```

    1  >> syms a b c x

    2  >> y = a*(xˆ2)+(b*x)+c

    3  y =

    4  a*xˆ2 + b*x + c

    5  >> solve(y)

    6  ans =

    7  −(b + (bˆ2 − 4*a*c)ˆ(1/2))/(2*a)

    8  −(b − (bˆ2 − 4*a*c)ˆ(1/2))/(2*a)

    ```


    Similarly, a symbolic mathematical expression can be integrated and differentiated
    as follows:


    ```

    1  >> syms a b c x

    2  >> y = a*(xˆ2)+(b*x)+c

    3  y =

    4  a*xˆ2 + b*x + c

    5  >> int(y)

    6  ans =

    7  (a*xˆ3)/3 + (b*xˆ2)/2 + c*x

    8  >> diff(y)

    9  ans =

    10  b + 2*a*x

    ```


    This can be verified using paper-based calculation by hand, where we know the
    following:


    ![$$ y=a{x}^2+ bx+c $$](A458923_1_En_8_Chapter_Equ6.gif)


    (Equation 8-6)


    ![$$ \int y=\frac{a{x}^3}{3}+\frac{b{x}^2}{2}+ cx $$](A458923_1_En_8_Chapter_Equ7.gif)


    (Equation 8-7)


    ![$$ \frac{dy}{dx}=2 ax+b $$](A458923_1_En_8_Chapter_Equ8.gif)


    (Equation 8-8)


    ### 8.4.1 Arithmetic Expressions


    Simple arithmetic expressions can be dealt with using symbols. For example, two
    polynomials can be used to define a new polynomial.


    ```

    1  >> syms x y z

    2  >> a1 = xˆ2+2*y+z

    3  a1 =

    4  xˆ2 + 2*y + z

    5  >> a2 = xˆ(−2)−2*y+3*z

    6  a2 =

    7  3*z − 2*y + 1/xˆ2

    8  >> a3 = a1/a2

    9  a3 =

    10  (xˆ2 + 2*y + z)/(3*z − 2*y + 1/xˆ2)

    11 >> a4 = a1*a2

    12  a4 =

    13  (xˆ2 + 2*y + z)*(3*z − 2*y+1/xˆ2)

    ```


    ### 8.4.2 Trigonometric Expressions


    Trigonometric variables defined using symbolic variables can also be used in mathematical
    calculations, as follows:


    ![$$ y=\sin (x) $$](A458923_1_En_8_Chapter_Equ9.gif)


    (Equation 8-9)


    ![$$ \frac{dy}{dx}=-\cos (x) $$](A458923_1_En_8_Chapter_Equ10.gif)


    (Equation 8-10)


    ```

    1  >> syms a b c x

    2  >> y = sin(x)

    3  y =

    4  sin(x)

    5  >> int(y)

    6  ans =

    7  −cos(x)

    ```


    Even more complicated calculations can be performed by a click of a button.


    ```

    1  >> z = cos(xˆ(1/2)) − (sin(y))ˆ(1/3)

    2  z =

    3  cos(xˆ(1/2)) − sin(y)ˆ(1/3)

    4  >> int(z)

    5  ans =

    6  2*cos(xˆ(1/2)) − x*sin(y)ˆ(1/3) + 2*xˆ(1/2)*sin(xˆ(1/2))

    7  >> diff(z)

    8  ans =

    9  −sin(xˆ(1/2))/(2*xˆ(1/2))

    ```'
