- fmt: '### 5.3.1 The `function` Function


    The definition of a `function` follows this syntax:


    ```

    1  function [return value 1, return value 2, ...] = name([arg1, arg2,...])

    2  body

    3  endfunction

    ```


    Here, the `function` keyword defines the object types as a function. Then, a set
    of variables are defined that this function is expected to return. Next comes
    an `=` operator, and then the name of the function. In this case, it''s called
    `name`. `name` objects takes a set of arguments, which are objects that the function
    defined. Then comes the main body of the function. The last part defines the end
    of the function. For example, you can write a function to find x² − y² and assign
    the result to a variable named `z`, as follows:


    ```

    1  function y = fn1(x,y)

    2  y = xˆ2−yˆ2;

    3  end

    ```


    Save this as `fn1.m` in the present working directory. Now go to the MATLAB terminal
    and type the following:


    ```

    1  >> fn1(5,1)

    2  ans = 24

    3  >> fn1(5,2)

    4  ans = 21

    5  >> fn1(5,3)

    6  ans = 16

    7  >> fn1(5,4)

    8  ans = 9

    9  >> fn1(5,5)

    10  ans = 0

    ```


    You can see that the function named `fn1` is performing the computation x² − y²
    on the two input arguments for which it is defined.


    It is a good practice to define the program as a group of function files and call
    them in the master program stored as a script file. This modular approach makes
    it easy to experiment with the idea and also makes it easier to debug and test
    the code. A function can return more than two values too. For example:


    ```

    1  function[y1,y2,y3] = fn2(x,y)

    2  y1 = xˆ2−yˆ2;

    3  y2 = xˆ2+yˆ2;

    4  y3 = y2−y1;

    5  end

    ```


    This gives the following result:


    ```

    1  >> [a,b,c] = fn2(5,2)

    2  a = 21

    3  b = 29

    4  c = 8

    5  >> [a,b,c] = fn2(5,0)

    6  a = 25

    7  b = 25

    8  c = 0

    ```


    Functions can incorporate loops to regulate the repetitive tasks inside the program.
    For example, a factorial of a number can be calculated using the function given
    here:


    ```

    1  function result = factorial(n)

    2    if(n == 0)

    3      result = 1;

    4      return;

    5    else

    6      result = prod(1:n);

    7    endif

    8  endfunction

    ```


    A function named `factorial`, which takes a number `n` as an argument, calculates
    the product of the number with all its successive numbers. When called from the
    MATLAB command line, the function yields the following result.


    ```

    1  >> factorial(50)

    2  ans = 3.0414e+064

    3  >> factorial(1)

    4  ans = 1

    5  >> factorial(0)

    6  ans = 1

    7  >> factorial(100)

    8  ans = 9.3326e+157

    9  >> factorial(1000)

    10  ans = NaN

    11  >> factorial(−1)

    12  error:factorial:N must all be non−negative integers

    ```


    `help NaN` and `help prod` provide useful insights into the behavior of these
    commands.


    ### 5.3.2 The `inline` Function


    Functions can also be defined inline using the `inline` keyword, as follows:


    ```

    1  >> f = inline("xˆ2+y");

    2  >> f(1,2)

    3  ans = 3

    4  >> f(10,10)

    5  ans = 110

    6  >> f(0,2)

    7  ans = 2

    8  >>

    ```


    Line 1 defines a function named `f` with two variables, `x` and `y`, to calculate
    f (x, y) = x² + y. When called with values of these two variables, the function
    outputs the calculated values.


    ### 5.3.3 Anonymous Functions


    Anonymous functions are unnamed function objects defined in a program. Their definition
    follows a simple syntax:


    ```

    @(argument list) expression

    ```


    For example:


    ```

    1  >> a = @(x) sin(x)*cos(x);

    2  >> quad(a,0,1)

    3  ans = 0.35404

    4  >> quad(a,0,pi)

    5  ans = 7.3031e−017

    6  >> quad(a,−pi,pi)

    7  ans = 0

    8  >> quad(a,−pi,2*pi)

    9  ans = −2.8435e−016

    10  >> quad(a,−2*pi,2*pi)

    11  ans = 0

    ```


    `help quad` tells us that the function `quad` evaluated the integration of a function
    between two values. Hence, line 1 defines a function sin(x)cos(x), whose integration
    is as follows.


    ![ $$ {\displaystyle \begin{array}{l}\underset{0}{\overset{1}{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0.35404\\
    {}\underset{0}{\overset{\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=7.3031\times
    {10}^{-17}\\ {}\kern0.125em \underset{-\pi }{\overset{\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0\\
    {}\underset{-\pi }{\overset{2\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=-2.8435\times
    {10}^{-16}\\ {}\underset{-\pi }{\overset{2\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0\end{array}}
    $$ ](A458923_1_En_5_Chapter_Equb.gif)


    Hence, if you use the anonymous function definition, you do not need to name a
    function.


    ## 5.4 Summary


    Defining functions is the key to modular programming. MATLAB presents an elegant
    way to define and use functions, both inline and in separate files. When combined
    with the ability to write functions inside a loop, complex problems can be implemented
    in just a few lines of code. This requires an artistic attitude while designing
    an algorithm, where functions and loops are the paintbrushes that help you devise
    an elegant solution to a given numerical problem.


    # 6. Numerical Computing Formalism


    ## 6.1 Introduction


    Numerical computation enables you to compute solutions to numerical problems,
    provided you can frame them into a proper format. This requires certain considerations.
    For example, if you digitize continuous functions, then you are going to introduce
    certain errors due to the sampling at a finite frequency. Hence, a very accurate
    result would require very a fast sampling rate. When a large data set needs to
    be computed, it becomes a computationally intensive and time consuming task. Also
    you must understand that the numerical solutions are an approximation at best,
    compared to analytical solutions. The onus of finding their physical meaning and
    significance lies on you. The art of discarding solutions that do not have meaning
    in real world scenarios is something that a scientist/engineer develops over the
    years. Also, a computational device is only as intelligent as its operator. The
    law of GIGO (garbage-in-garbage-out) is followed very strictly in this domain.


    This chapter attempts to explain some of the important steps you must consider
    in order to solve a physical problem using numerical computations. Defining a
    problem in the proper terms is just the first step. Making the right model and
    then using the right method to solve (solver) the issue is the difference between
    a naive and an experienced scientist/engineer.


    ## 6.2 Physical Problems


    Everything in our physical world is governed by physical laws. Owing to men and
    women of science who toiled under difficult circumstances and came up with fine
    solutions to the things happening around us, we obtained mathematical theories
    for physical laws. To test these mathematical formalisms of physical laws, we
    use numerical computations. If it yields the same results as that of a real experiment,
    they validate each other. Numerical simulations can remove the need to do an experiment
    altogether, provided you have a well tested mathematical formalism. For example,
    nuclear powers of our times need not test nuclear bombs for real any more. The
    data related to nuclear explosion, which was obtained during real nuclear explosions,
    enables scientists to model these physical systems quite accurately, thus eliminating
    the need to do real testing.


    Apart from applications like simulating a real experiment, modeling physical problems
    are good educational exercises. While modeling, hands-on exercises enable students
    to explore the subject in depth and give proper meaning to the topic under study.
    Solving numerical problems and visualizing results makes the learning permanent
    and also elucidates any flaws in the mathematical theory, which ultimately leads
    to new discoveries.'
