    \ 的数据文件。或者，使用函数 `urlwrite(URL)` 将所有数据存储为名为 `a.dat` 的文件。\n\n## 4.6 打印和保存图表\n\n\
    一些命令，如 `print` 和 `saveas`，用于保存由 MATLAB 程序生成的图形/图表，以便以所需的格式保存。它们将在以下部分进行讨论。\n\n\
    ### 4.6.1 print 命令\n\n`print` 命令可打印作业，包括使用打印机和/或绘图仪打印、打印到文件等。如果您需要以指定格式、按照所需文件名自动保存图形，此命令非常有用。\n\
    \n```\n1  %以 svg 格式保存\n2  figure(1);\n3  clf();\n4  peaks();\n5  print −dsvg figure1.svg\n\
    \n7  %以 png 格式保存\n8  figure(1);\n9  clf();\n10  sombrero();\n11  print −dpng figure2.png\n\
    \n13  %打印到 HP DeskJet 550C\n14  clf();\n15  sombrero();\n16  print −dcdj550\n\
    ```\n\n`clf` 函数用于清除当前图形窗口。`print` 命令还有许多其他用于保存不同格式的选项。要了解更多信息，请在 MATLAB 终端中键入\
    \ `help print`。\n\n### 4.6.2 saveas 函数\n\n`saveas` 函数以所需格式保存图形对象，如下所示：\n\n```\n\
    1  clf();\n2  a = sombrero();\n3  saveas (a,\"figure3.png\");\n```\n\n`orient(a,orientation)`\
    \ 函数定义图形对象 `a` 的方向。`orientation` 参数的有效值为 `portrait`、`landscape` 和 `tall`。`landscape`\
    \ 选项更改方向，使绘图宽度大于绘图高度。`tall` 选项将方向设置为 `portrait`，并用绘图填充页面，同时保留 0.25 英寸的边距。`portrait`\
    \ 选项（默认）更改方向，使绘图高度大于绘图宽度。\n"
- fmt: '# 4.7 Summary


    This chapter explained various functions enabling reading and writing permission
    as well as taking data to and from a file. This becomes an essential part of a
    numerical computation exercise. The data can be generated in the form of files
    using software or hardware (an instrument). MATLAB does not care about its origin.
    It treats data by its type and by file type. Determining the appropriate function
    when using files has to be done by the user as per the situation.


    File operations do provide faculties to trim the data so that only the useful
    part is used as an array. Further trimming can be performed by slicing operations.
    With the art of handling files under your belt, you can confidently proceed toward
    handling sophisticated numerical computations.


    # 5. Functions and Loops


    ## 5.1 Introduction


    When a particular numerical tasks needs to be “repeated” over different data points,
    digital computers become a useful tool since they can do this with greater speed
    than humans. Loops perform exactly these tasks. Using a condition to check the
    start and termination rules, you can perform repetitive parts of a process easily.
    Different programming languages and environments have different rules for defining
    loops. MATLAB provides a much simpler way to define and run loops. They will be
    discussed shortly.


    It’s useful to define the term function here. A big program may require a set
    of instructions to be called at different times. Hence, these set of instructions
    can be defined as a sub-program, which can be requested to perform the computation
    at a desired time. In this way, a complicated task can be divided into many small
    parts. This architecture of programming is called modular programming. This is
    the most popular way of programming since it’s quite logical, better at visualizing
    the problem, and easy to debug. The most popular way of defining these small sets
    of instructions is to define them as functions. This chapter discusses both of
    these concepts in detail.


    ## 5.2 Loops


    Loops form an essential part of an algorithm since they perform the tasks that
    computers perform best: doing repetitive actions very quickly. Loops come in many
    flavors—the `for` loop repeats certain tasks over a list of variable values, the
    `while` loop checks a logical condition before executing a certain task, and the
    `if-then-else` loop checks a condition and directs the flow of the algorithm.
    The choice of a particular loop depends on the problem at hand.


    A variety of functions and their usage are listed in the following sections. Judging
    their usage critically becomes very important because the looping part of the
    algorithm consumes most of the execution time.


    ### 5.2.1 The while Loop


    The `while` loop defines a logical condition and, until it is satisfied, it runs
    a block of code. The syntax for the `while` loop is:


    ```

    1  while condition

    2  BODY

    3  endwhile

    ```


    Here, the keyword `while` initiates the execution of a `while` loop. The `condition`
    is a logical condition whose answer can be `true` (1) or `false` (0). The `BODY`
    encompasses a set of commands that is executed until the condition holds true
    (see Listing 5-1).


    ```

    1  x = 1.0;

    2  while x<10

    3     disp(sqrt(x));

    4     x = x+1;

    5  endwhile

    Listing 5-1

    The while1.m Program

    ```


    The `while1.m` program runs by first initializing the `x` variable to a value,
    `1.0`. Then it lists a logical condition:


    `x < 10`


    In the first step of the loop, `x = 1`, this condition is satisfied since `1 <
    10`. Since this condition is satisfied, `disp(sqrt(x))` is executed and displays
    the square root of `x`. Then line 4 is executed, where `x = x + 1` increments
    `x`. With the new incremented value of `x` being 2, the logical condition `x <
    10` is again checked and the body of loop given in lines 3 and 4 is executed.
    This is done until `x = 10`, when the loop condition is not satisfied. At that
    point, line 5 is executed and declares the end of the `while` loop. The execution
    of `while1.m` yields:


    ```

    1  >> while1

    2  1

    3  1.4142

    4  1.7321

    5  2

    6  2.2361

    7  2.4495

    8  2.6458

    9  2.8284

    10  3

    ```


    ### 5.2.2 The do-until Loop


    It is important to note that there can be cases where the body of a loop might
    not get executed even once in the case of `while` loop. This is the case when,
    after initialization, a condition is not satisfied. To deal with this scenario,
    the `do-until` loop’s syntax is as follows:


    ```

    1  do

    2  BODY

    3  until condition

    ```


    The loop first executes the body of the code and then checks for the condition.
    This way, the code block comprising the `BODY` of loop is executed at least once.
    The usage can be understood in the example shown in Listing 5-2.


    ```

    1  %Displaying square root of

    2  %first ten positive natural numbers

    3

    4  x = 1.0;

    5  do

    6    disp(sqrt(x));

    7    x = x+1;

    8  until x == 10

    Listing 5-2

    The dountil1.m Program

    ```


    The execution of the code yields the following:


    ```

    1  >> dountil1

    2  1

    3  1.4142

    4  1.7321

    5  2

    6  2.2361

    7  2.4495

    8  2.6458

    9  2.8284

    10  3

    11  >>

    ```


    At line 4, `x` is initialized at `1.0`. Then the body of the loop is written to
    display the square root of `x` and then increment it by 1. This is done until
    `x = 10`, i.e., until the value of `x` becomes `10`.


    ### 5.2.3 The for Loop


    The `for` loop is used to perform computations on a list of known values. The
    syntax of the `for` loop is as follows:


    ```

    1  for variable = vector

    2    BODY

    3  end

    ```


    The keyword `for` declares the start of the loop where a variable takes the values
    stored in a vector. Then the body of the code (here represented by `BODY`) is
    executed. The keyword `end` declares the end of the `for` loop. This is explained
    in the example in Listing 5-3.


    ```

    1  %program to calculate square root

    2  %of first 10 numbers

    3

    4  for i = 1:10

    5    ans = sqrt(i)

    6  end

    Listing 5-3

    The for1.m Program

    ```


    Executing `for1.m` yields:


    ```

    1  >> for1

    2  ans = 1

    3  ans = 1.4142

    4  ans = 1.7321

    5  ans = 2

    6  ans = 2.2361

    7  ans = 2.4495

    8  ans = 2.8284

    9  ans = 3

    10  ans = 3.1623

    ```


    ### 5.2.4 The if-elseif-else Loop


    When you need a number of conditions to be checked at different times, the `if-elseif-else`
    loop works well. The syntax for this loop is given by:


    ```

    1  if condition1

    2  BODY1

    3  elseif condition2

    4  BODY2

    5  else

    6  BODY3

    7  endif

    ```


    At line 1, a condition is defined. If this condition is satisfied, then line 2
    is executed; otherwise, line 3 is executed. Hence, `BODY1` and `BODY2` are the
    blocks of code that are executed by checking for different sets of conditions
    and `BODY3` is the code that’s executed when none of the conditions are executed.
    See Listing 5-4.


    ```

    1  %Program to check if a

    2  %number is even or odd

    3

    4  x = 33;

    5

    6  if(rem(x,2) == 0)

    7    printf("x is even\n");

    8  elseif(rem(x,5) == 0)

    9    printf("x is odd and divisible by 5\n");

    10  else

    11    printf("x is odd\n");

    12  endif

    Listing 5-4

    The ifelse1.m Program

    ```


    Executing `ifelse1.m` yields:


    ```

    1  >> ifelse1

    2  x is odd and divisible by 5

    ```


    At line 4, `x` is initialized as `33`. Then, at line 6, the remainder of `x /
    2` is checked. If it is zero, then line 7 is executed. Otherwise, line 8 is executed
    and the remainder of `x / 5` is checked. If it is zero, then line 9 is executed.
    If neither of the conditions is satisfied, then line 11 is executed. Line 12 ends
    the `if-else` loop.


    ## 5.3 Functions


    A function is code that can be called as and when required. Hence, it can be defined
    separately, either in a separate file or within the body of program. MATLAB presents
    several ways to define functions, which are discussed in the following subsections.'
