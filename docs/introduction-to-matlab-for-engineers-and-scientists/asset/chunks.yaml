    ### 8.4.3 表达式的展开与因式分解


    `expand()` 函数可用于将方程写成展开后多项式的各项形式。`expand()` 最重要的用途是应用分配律，将积的和重写为和的积。如果 `f` 代表一个符号表达式，则
    `expand(f)` 通过以下规则集进行计算：


    *   ![$$ {x}^{a+b}={x}^a\times {x}^b $$](img/A458923_1_En_8_Chapter_Equa.gif)

    *   ![$$ {(xy)}^b={x}^b\times {y}^b\forall x,y\ge 0,b\in I $$](img/A458923_1_En_8_Chapter_Equb.gif)

    *   ![$$ {\left({x}^a\right)}^b={x}^{a+b} $$](img/A458923_1_En_8_Chapter_Equc.gif)


    还需要注意的是，`expand()` 函数会递归地对给定表达式的子表达式进行展开。


    ```

    1  >> syms x y z

    2  >> a1 = xˆ2+2*y+z

    3  a1 =

    4  xˆ2 + 2*y + z

    5  >> a2 = xˆ(−2)−2*y+3*z

    6  a2 =

    7  3*z − 2*y + 1/xˆ2

    8  >> a3 = a1/a2

    9  a3 =

    10  (xˆ2 + 2*y + z)/(3*z − 2*y + 1/xˆ2)

    11  >> a4 = a1*a2

    12  a4 =

    13  (xˆ2 + 2*y + z)*(3*z − 2*y + 1/xˆ2)

    14  >> a5 = expand(a3)

    15  a5 =

    16  (2*y)/(3*z − 2*y + 1/xˆ2) + z/(3*z − 2*y + 1/xˆ2) + xˆ2/(3*z − 2*y + 1/xˆ2)

    17  >> a6 = expand(a4)

    18  a6 =

    19  4*y*z + (2*y)/xˆ2 − 2*xˆ2*y + z/xˆ2 + 3*xˆ2*z − 4*yˆ2 + 3*zˆ2 + 1

    ```


    名为 `factor` 的函数生成一个表达式的因式，使得所有因式相乘的结果等于原表达式。让我们尝试对符号变量 `a5` 和 `a6` 中存储的值进行因式分解。


    ```

    1  >> a7 = factor(a5)

    2  a7 =

    3  [−1,x,x, xˆ2 + 2*y + z, −1/(3*xˆ2*z − 2*xˆ2*y + 1)]

    4  >> a8 = factor(a5)

    5  a8 =

    6  [−1,x,x, xˆ2 + 2*y + z, −1/(3*xˆ2*z − 2*xˆ2*y + 1)]

    ```


    这些因式以数组元素的形式存在，可以通过其索引进行访问。这在提取因式并将其用于数学分析时非常方便。


    ```

    1  >> a7[2] = x

    2  >> a7[4] = xˆ2 + 2*y + z

    3  >> a8[3:5] = [x, xˆ2 + 2*y + z, −1/(3*xˆ2*z − 2*xˆ2*y + 1)]

    ```


    在上一个示例中，`a7[2]` 提取变量 `a7` 的第二个元素，`a7[4]` 提取变量 `a7` 的第四个元素，而 `a8[3:5]` 提取从第三个到第五个的所有元素，并将其存储为符号表达式列表。


    当一个表达式是另一个表达式的幂时，`expand()` 的作用方式与数学规则一致。例如，考虑定义了一个表达式：


    ![$$ a=x{y}^{\left(z+y\right)} $$](img/A458923_1_En_8_Chapter_Equd.gif)


    其展开形式为：


    ![$$ x\times {y}^y\times {y}^z $$](img/A458923_1_En_8_Chapter_Eque.gif)


    每一项显然都是该表达式的一个因式。这可以通过以下 MATLAB 代码验证：


    ```

    1  >> syms x y z

    2  >> a = x*yˆ(z+y)

    3  a =

    4  x*yˆ(y + z)

    5  >> b = expand(a)

    6  b =

    7  x*yˆy*yˆz

    8  >> c = factor(b)

    9  c =

    10  [x,yˆy,yˆz]

    ```


    当一个表达式是另一个表达式的指数时，`expand()` 函数会递归地工作。


    ```

    1  >> a=((x+y)ˆ(x+z+2))

    2  a =

    3  (x + y)ˆ(x + z + 2)

    4  >> expand(a)

    5  ans =

    6  xˆ2*(x + y)ˆx*(x + y)ˆz + yˆ2*(x + y)ˆx*(x + y)ˆz + 2*x*y*(x + y)ˆx*

    (x + y)ˆz

    ```


    它可用于检验三角恒等式：


    ```

    1  >> expand(sin(x+y))

    2  ans =

    3  cos(x)*sin(y) + cos(y)*sin(x)

    4  >> expand(cos(x+y))

    5  ans =

    6  cos(x)*cos(y) − sin(x)*sin(y)

    7  >> expand(tan(x+y))

    8  ans =

    9  −(tan(x) + tan(y))/(tan(x)*tan(y) − 1)

    10  >> expand(sec(x+y))

    11  ans =

    12  1/(cos(x)*cos(y) − sin(x)*sin(y))

    13  >> a = cosh(x+y)

    14  a =

    15  cosh(x+y)

    16  >> expand(a)

    17  ans =

    18  cosh(x)*cosh(y) + sinh(x)*sinh(y)

    19  >> a = cosh(2*x)

    20  a =

    21  cosh(2*x)

    22  >> expand(a)

    23  ans =

    24  2*cosh(x)ˆ2 − 1

    25  >> a = coth(x+y)

    26  a =

    27  coth(x + y)

    28  >> expand(a)

    29  ans =

    30  (coth(x)*coth(y) + 1)/(coth(x) + coth(y))

    ```


    ## 8.5 小结


    本章阐述了如何使用符号来求解数学方程。当容易出错的数值计算不被接受时，符号计算被证明非常有用，但它也有其局限性。有限的内置函数集必须由用户自定义函数来补充，这需要编写
    MATLAB 程序包的经验。但这绝对是值得探索的。


    本书阐述了如何使用 MATLAB 作为高效科学计算的工具。它首先通过单行命令说明了基本用法，然后阐述了如何将多行命令编写成一个 `.m` 文件。数组是科学计算的基础模块，因此可以使用数组进行基于矩阵的计算。绘图被简化到即使是初学者也能轻松绘制方程图形以可视化图形的程度。通过使用循环和函数，程序可以实现模块化，并且信息流可以得到有效控制。您还看到了一些数值计算的基本示例。本书应能使任何初学者轻松进入科学计算的世界。其广泛流行的用法恰如其分地印证了“MATLAB
    是工程领域的语言”这一说法。

