- fmt: '## 2.7 Random Matrix


    Using random number generators, a random matrix can be created. Use the `rand(a,b)`
    command:


    ```

    >> rand(4,5)

    ans =


    Columns 1 through 4


    0.8147    0.6324    0.9575    0.9572

    0.9058    0.0975    0.9649    0.4854

    0.1270    0.2785    0.1576    0.8003

    0.9134    0.5469    0.9706    0.1419


    Column 5


    0.4218

    0.9157

    0.7922

    0.9595

    ```


    Note that the numbers generated here will be different each time even on the same
    machine, since they are supposed to be random in nature. By default, they are
    uniformly distributed over the interval (0, 1). A vector is simply a row vector,
    so it can be generated randomly using the `rand(a)` command. `help rand` provides
    a detailed description of various other features and arguments of the random number
    generator.


    To create random integers, you can use the `randi()` function. You can also specify
    a range for these random integers. For example, `randi([1,10],1,5)` will create
    five random integers (an array of 1×5) within 1 to 10. On the other hand, `randi([1,10],5)`
    will create an array of random integers (an array of 5×5) within 1 to 10.


    ```

    >> randi([1,10],5)


    ans =


    5    3    5    8    10

    5    7   10    3     6

    7    7    4    6     2

    8    2    6    7     2

    8    2    3    9     3


    >> randi([1,10],1,5)


    ans =


    9    3    9    3    10

    ```


    A random complex number can be generated using the `rand` command, as follows:


    ```

    >> rand + i* rand


    ans =


    0.3500 + 0.1966i


    >> rand + i* rand


    ans =


    0.2511 + 0.6160i

    ```


    Sometimes, you might want to generate the same set of random numbers each time
    the program executes. This can be done by setting the state of the random number
    function using the `rng` command, as follows:


    ```

    >> state1 = rng;

    >> r1 = rand(2,3)


    r1 =


    0.4733    0.8308    0.5497

    0.3517    0.5853    0.9172


    >> r12 = rand(2,3)


    r12 =


    0.2858    0.7537    0.5678

    0.7572    0.3804    0.0759


    >> rng(s);

    Undefined function or variable ''s''.


    >> rng(state1);

    >> r3 = rand(2,3)


    r3 =


    0.4733    0.8308    0.5497

    0.3517    0.5853    0.9172

    ```


    The state is saved in the `state1` variable and then `r1` and `r2` create two
    arrays of 2×3 size. They have different elements. But when the state is reset
    using `rng(state1)`, the new array of the same size stored in `r3` is exactly
    the same as `r1`, which was created when the state of the machine was saved in
    the `state1` variable.


    A normally distributed random number generator is given by the function `randn()`.
    The random numbers, thus generated, are normally distributed around 0. Figure
    3-7 in Chapter 3 confirms this fact.


    A 3D array of random numbers can be generated by inputting an array for each dimension.
    For example, if an array `A = [3,2,4]` is fed into the `rand()` function, a 3D
    array of random numbers is created, as shown here:


    ```

    >> A = [3,2,4];

    >> B = rand(A)


    B(:,:,1) =


    0.7482    0.2290

    0.4505    0.9133

    0.0838    0.1524


    B(:,:,2) =


    0.8258    0.0782

    0.5383    0.4427

    0.9961    0.1067


    B(:,:,3) =


    0.9619    0.8173

    0.0046    0.8687

    0.7749    0.0844


    B(:,:,4) =


    0.3998    0.4314

    0.2599    0.9106

    0.8001    0.1818


    >> size(B)


    ans =


    3    2    4

    ```


    ### 2.7.1 Matrix Manipulations


    Some common matrix manipulations have been written in function form, which makes
    it easier for developers to use them right away, rather than invest time in writing
    optimum code.


    ### 2.7.2 Flipping a Matrix


    `flipud(A)` returns a copy of matrix `A` with the order of the rows reversed along
    the horizontal axis. `flipud` stands for flip-up-down. `fliplr(A)` returns a copy
    of matrix `A` with the order of the rows reversed from left to right. `fliplr`
    stands for flip left right.


    ```

    >> a = [1 2; 3 4; 5 6]

    a =


    1    2

    3    4

    5    6


    >> fliplr(a)

    ans =


    2    1

    4    3

    6    5


    >> flipud(a)

    ans =


    5    6

    3    4

    1    2

    ```


    ### 2.7.3 Rotating a Matrix


    Using the command `rot90(a,n)`, you can rotate a matrix `a` `n` times by 90 degrees.


    ```

    >> a = [1 2; 3 4; 5 6]

    a =


    1    2

    3    4

    5    6


    >> rot90(a,1)

    ans =


    2    4    6

    1    3    5


    >> rot90(a,2)

    ans =


    6    5

    4    3

    2    1


    >> rot90(a,4)

    ans =


    1    2

    3    4

    5    6

    ```


    ### 2.7.4 Reshaping a Matrix


    The number of rows and columns in a matrix can be changed provided the total number
    of elements remains the same.


    ```

    >> a = [1 2; 3 4; 5 6]

    a =


    1    2

    3    4

    5    6


    >> reshape(a,6,1)

    ans =


    1

    3

    5

    2

    4

    6


    >> reshape(a,4,1)

    Error using reshape

    To RESHAPE the number of elements must not change.

    ```


    ### 2.7.5 Sorting


    Numbers can be sorted in increasing order using the `sort` function:


    ```

    >> a = rand(1,5)

    a =


    0.7431    0.3922    0.6555    0.1712    0.7060


    >> sort(a)

    ans =


    0.1712    0.3922    0.6555    0.7060    0.7431

    ```


    ### 2.7.6 Upper and Lower Triangular Matrix


    The upper triangular matrix is such that only diagonal and elements above diagonal
    are non-zero. Similarly, the lower triangular matrix is such that diagonal and
    elements below diagonal are non-zero.


    ```

    >> a = rand(3,3)

    a =


    0.0318    0.0971    0.3171

    0.2769    0.8235    0.9502

    0.0462    0.6948    0.0344


    >> tril(a)

    ans =


    0.0318    0         0

    0.2769    0.8235    0

    0.0462    0.6948    0.0344


    >> triu(a)

    ans =


    0.0318    0.0971    0.3171

    0         0.8235    0.9502

    0         0         0.0344

    ```


    ### 2.7.7 Ones and Zeros Matrix


    A matrix having all its numbers as 1 or 0 makes up a ones and zeros matrix, respectively:


    ```

    >> ones(3,3)

    ans =


    1    1    1

    1    1    1

    1    1    1


    >> zeros(3,3)

    ans =


    0    0    0

    0    0    0

    0    0    0

    ```


    ## 2.8 Indexing


    Each element of the matrix is characterized by two numbers, the row number and
    the column number. This is used to pinpoint an element and operate on that.


    ```

    >> a = rand(2,3)

    a =


    0.6557    0.8491    0.6787

    0.0357    0.9340    0.7577


    >> a(2,3)=1

    a =


    0.6557    0.8491    0.6787

    0.0357    0.9340    1.0000


    >> a(1,1)=0

    a =


    0         0.8491    0.6787

    0.0357    0.9340    1.0000

    ```


    Note that `a(2,3)=1` sets the element at the second row and third column, i.e.,
    number 0.3041072 to 1, and `a(1,1)=0` sets the element at the first row and first
    column, i.e., number 0.5248873 to 0. To index numbers in a vector, you need a
    single number.


    ```

    >> a = [1,2,3,4,5,6,7,8,9]

    a =


    Columns 1 through 7


    1    2    3    4    5    6    7


    Columns 8 through 9


    8    9


    >> a(1)

    ans =


    1


    >> a(–1)

    Subscript indices must either be real

    positive integers or logicals.


    >> a(5)

    ans =


    5


    >> a(10)

    Index exceeds matrix dimensions.

    ```


    It is important to note that, unlike some programming languages where indices
    start at 0, MATLAB starts indices at 1 and does not take negative numbers as indices.


    ### 2.8.1 Using Indices to Create a New Vector


    ```

    >> a = [10 20 30 40 50 60]

    a =


    10   20   30   40   50   60


    >> b = a([1 3 6 1])

    b =


    10   30   60   10

    ```


    In the previous example, `b` is a new vector formed from vector `a`, where successive
    elements are made up of elements taken from an index vector `[1 3 6 1]`.


    ```

    >> a = [11,12,13;40,50,60;17,18,19]

    a =


    11    12    13

    40    50    60

    17    18    19


    >> a([1,2], [2,3])

    ans =


    12    13

    50    60

    ```


    Note that since the use of the comma operator is optional, we will define vectors
    and matrices by simply using whitespace.'
