- fmt: '### 6.4.2 `roots()`


    The roots of a polynomial are the numerical values where the evaluated polynomial
    is valued at zero. Roots can be found easily using the `roots()` function. Here’s
    an example using the previously defined polynomials, `p1` and `p2`.


    ```

    1  >> p1

    3  p1 =

    5  1     0     3     2

    7  >> p2

    9  p2 =

    11  3     4     0     5

    13  >> roots(p1)

    15  ans =

    17  0.2980 + 1.8073i

    18  0.2980 − 1.8073i

    19  −0.5961 + 0.0000i

    21  >> roots(p2)

    23  ans =

    25  −1.8307 + 0.0000i

    26  0.2487 + 0.9212i

    27  0.2487 − 0.9212i

    29  >> polyval(p1,roots(p1))

    31  ans =

    33  1.0e−14*

    35  −0.1776 − 0.2720i

    36  −0.1776 + 0.2720i

    37  0.0888 + 0.0000i

    39  >> polyval(p2,roots(p2))

    41  ans =

    43  1.0e−13*

    45  −0.2753 + 0.0000i

    46  −0.0089 − 0.0111i

    47  −0.0089 + 0.0111i

    ```


    As per the definition of a root, the polynomial should be valued at zero at its
    roots, but the value for `roots(p1,roots(p1))` is not zero. Instead, it’s a very
    small number in the order of 10^(−14). This is due to errors introduced in the
    numerical approximations for calculating the roots.


    ### 6.4.3 Addition and Subtraction of Polynomials


    Two polynomials are added by adding their coefficients. Since they are defined
    as arrays in MATLAB, polynomial addition and subtraction is simply an element-wise
    operation.


    ```

    1  >> p1+p2

    3  ans =

    5  4     4     3     7

    7  >> p1−p2

    9  ans =

    11  −2    −4     3     −3

    ```


    This effectively means that:


    ![ $$ {p}_1(s)={s}^3+3s-2=0 $$ ](A458923_1_En_6_Chapter_Equ5.gif)

    (Equation 6-5)


    ![ $$ {p}_2(s)=3{s}^3+4{s}^2-5=0 $$ ](A458923_1_En_6_Chapter_Equ6.gif)

    (Equation 6-6)


    ![ $$ {p}_1(s)+{p}_2(s)=4{s}^3+4{s}^2+3s+7 $$ ](A458923_1_En_6_Chapter_Equ7.gif)

    (Equation 6-7)


    ![ $$ {p}_1(s)-{p}_2(s)=-2{s}^3-4{s}^2+3-3 $$ ](A458923_1_En_6_Chapter_Equ8.gif)

    (Equation 6-8)


    ### 6.4.4 Polynomial Multiplication


    The product of two polynomials can be found using a convolution operation, which
    is provided using the `conv()` function in MATLAB.


    ![ $$ {p}_1(s)={s}^3+3s-2=0 $$ ](A458923_1_En_6_Chapter_Equ9.gif)

    (Equation 6-9)


    ![ $$ {p}_2(s)=3{s}^3+4{s}^2-5=0 $$ ](A458923_1_En_6_Chapter_Equ10.gif)

    (Equation 6-10)


    ![ $$ {P}_1(a)\times {p}_2(a)=3{s}^6+4{s}^5+9{s}^4+23{s}^3+8{s}^2+15x+10=0 $$
    ](A458923_1_En_6_Chapter_Equ11.gif)

    (Equation 6-11)


    ```

    1  >> p1

    3  p1 =

    5  1     0     3     2

    7  >> p2

    9  p2 =

    11  3     4     0     5

    13  >> conv(p1,p2)

    15  ans =

    17  3     4     9     23     8     15     10

    ```


    ### 6.4.5 Polynomial Division


    Polynomial division is performed by using deconvolving operations, which are provided
    by the `deconv()` function. It gives two outputs—a quotient and a remainder.


    ```

    1  >> p1

    3  p1 =

    5  1     0     3     2

    7  >> p2

    9  p2 =

    11  3     4     0     5

    13  >> [q,r] = deconv(p1,p2)

    15  q =

    17  0.3333

    20  r =

    22  0     −1.3333     3.0000     0.3333

    24  >> [q,r] = deconv(p2,p1)

    26  q =

    28  3

    31  r =

    33  0     4     −9     −1

    ```


    This means that if:


    ![ $$ {p}_1(s)={s}^3+3s-2=0 $$ ](A458923_1_En_6_Chapter_Equ12.gif)

    (Equation 6-12)


    ![ $$ {p}_2(s)=3{s}^3+4{s}^2-5=0 $$ ](A458923_1_En_6_Chapter_Equ13.gif)

    (Equation 6-13)


    Then:


    ![ $$ \frac{p_1}{p_2}\to q=0.333,r=-1.3333{s}^2+3s+0.3333 $$ ](A458923_1_En_6_Chapter_Equ14.gif)

    (Equation 6-14)


    ![ $$ \frac{p_2}{p_1}\to q=3,r=-4{s}^2-9s-1=0 $$ ](A458923_1_En_6_Chapter_Equ15.gif)

    (Equation 6-15)


    ### 6.4.6 Polynomial Differentiation


    Polynomial differentiation can be accomplished using the `polyder()` function.
    For example, say you have a polynomial `y(x) = x ³ − 2x ² + 4x − 5 = 0`. That
    means:


    ![ $$ \frac{dy}{dx}=3{x}^2-4x+4=0 $$ ](A458923_1_En_6_Chapter_Equc.gif)


    This can be calculated by MATLAB as follows.


    ```

    1  >> y = [1 −2 4 −5]

    3  y =

    5  1     −2     4     −5

    7  >> dydx = polyder(y)

    9  dydx =

    11  3     −4     4

    ```


    ### 6.4.7 Polynomial Integration


    Just as with differentiation, you can define integration of polynomials using
    the `polyint()` function. For example, say you have a polynomial `y(x) = x ³ −
    2x ² + 4x − 5 = 0`. Then:


    ![ $$ \int y(x) dx=0.25{x}^4-0.6667{x}^3+2{x}^2-5x=0 $$ ](A458923_1_En_6_Chapter_Equd.gif)


    ```

    1  >> y = [1 −2 4 −5]

    3  y =

    5  1     −2     4     −5

    7  >> integration = polyint(y)

    9  integration =

    11  0.2500     −0.6667     2.0000     −5.0000     0

    ```


    ### 6.4.8 Polynomial Curve Fitting


    Suppose you are given some data and need to find a polynomial that fits the data.
    This task can be performed using the `polyfit()` function. For example, suppose
    you want to fit the data given here:


    | x | 1 | 2 | 3 | 4 | 5 | 6 |

    | y | 10 | 11 | 21 | 2 | 3 | 7 |


    ```

    1  >> x = [1,2,3,4,5,6]

    3  x =

    5  1     2     3     4     5     6

    7  >> y = [10,11,21,2,3,7]

    9  y =

    11  10     11     21     2     3     7

    13  >> polyfit(x,y,2)

    15  ans =

    17  −0.3750     0.9679     11.3000

    19  >> polyfit(x,y,3)

    21  ans =

    23  1.0833     −11.7500     35.3095     −16.0000

    ```


    Second and third degree polynomials that fit the data are `−0.375x ² + 0.9679x
    + 11.3 = 0` and `1.0833x ³ − 11.75x ² + 35.3095x − 16 = 0`, respectively.


    ## 6.5 Summary


    Almost all branches of science and engineering require you to perform numerical
    computations. MATLAB is one of the alternatives for doing so. MATLAB has a library
    of optimized functions for general computation. It also has a variety of packages
    that perform specialized jobs. This makes it an ideal choice for prototyping a
    numerical computation problem efficiently. This chapter summarized various issues
    related to errors generated during numerical computation and various methods to
    obtain their value or order of magnitude. These quantities are important to measure,
    since in real life, you will need these values to define the accuracy of the final
    product.


    # 7. Approximate answers in numerical computation


    ## 7.1 Numerical Approximations


    In the course of scientific investigation, finding exact answers may not be possible
    at times. Instead of devoting a lot of effort trying to find an exact answer by
    solving the problem analytically, another alternative is to develop methods to
    produce approximate answers. This is particularly true for solutions involving
    irrational numbers like `pi`. You can choose the number of significant digits
    to be used with `pi` and determine the accuracy of the result.


    The degree of accuracy required always depends on the targeted application. For
    example, when measuring the length of a building, we don’t need the answer to
    be accurate to the length of an atom (Å). When measuring a person’s body temperature,
    we don’t need to be accurate to more than two decimal places for most applications.
    In the era of faster and more efficient computers, higher accuracies of computations
    can be calculated by investing more time and memory storage, whenever required.
    But this must be used judiciously.'
