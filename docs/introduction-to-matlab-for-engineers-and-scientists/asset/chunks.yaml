    ### 6.4.7 Polynomial Integration


    Just as with differentiation, you can define integration of polynomials using
    the `polyint()` function. For example, say you have a polynomial y(x) = x ³ −
    2x ² + 4x − 5 = 0\. Then:


    ![ $$ \int y(x) dx=0.25{x}^4-0.6667{x}^3+2{x}^2-5x=0 $$ ](A458923_1_En_6_Chapter_Equd.gif)


    ```

    1  >>>> y = [1 −2 4 −5]


    3  y =


    5  1     −2     4     −5


    7  >> integration =vpolyint(y)


    9  integrationv=


    11  0.2500     −0.6667     2.0000     −5.0000     0

    ```


    ### 6.4.8 Polynomial Curve Fitting


    Suppose you are given some data and need to find a polynomial that fits the data.
    This task can be performed using the `polyfit()` function . For example, suppose
    you want to fit the data given here:


    | x | 1 | 2 | 3 | 4 | 5 | 6 |

    | y | 10 | 11 | 21 | 2 | 3 | 7 |


    ```

    1  >> x = [1,2,3,4,5,6]


    3  x =


    5  1     2     3     4     5     6


    7  >> y = [10,11,21,2,3,7]


    9  y =


    11  10     11     21     2     3     7


    13  >> polyfit(x,y,2)


    15  ans =


    17  −0.3750     0.9679     11.3000


    19  >> polyfit(x,y,3)


    21  ans =


    23  1.0833     −11.7500     35.3095     −16.0000

    ```


    Second and third degree polynomials that fit the data are −0.375x ² + 0.9679x
    + 11.3 = 0 and 1.0833x ³ − 11.75x ² + 35.3095x − 16 = 0, respectively.


    ## 6.5 Summary


    Almost all branches of science and engineering require you to perform numerical
    computations. MATLAB is one of the alternatives for doing so. MATLAB has a library
    of optimized functions for general computation. It also has a variety of packages
    that perform specialized jobs. This makes it an ideal choice for prototyping a
    numerical computation problem efficiently. This chapter summarized various issues
    related to errors generated during numerical computation and various methods to
    obtain their value or order of magnitude. These quantities are important to measure,
    since in real life, you will need these values to define the accuracy of the final
    product.


    # 7. Approximate answers in numerical computation


    ## 7.1 Numerical Approximations


    In the course of scientific investigation, finding exact answers may not be possible
    at times. Instead of devoting a lot of effort trying to find an exact answer by
    solving the problem analytically, another alternative is to develop methods to
    produce approximate answers. This is particularly true for solutions involving
    irrational numbers like `pi`. You can choose the number of significant digits
    to be used with `pi` and determine the accuracy of the result.


    The degree of accuracy required always depends on the targeted application. For
    example, when measuring the length of a building, we don’t need the answer to
    be accurate to the length of an atom (Å). When measuring a person’s body temperature,
    we don’t need to be accurate to more than two decimal places for most applications.
    In the era of faster and more efficient computers, higher accuracies of computations
    can be calculated by investing more time and memory storage, whenever required.
    But this must be used judiciously.'
