    We define a new 5×5 matrix `a` and then define a subset of this matrix using `a([2,5],1:3)`,
    which says that from the second and third row, take elements from the first column
    to the third column. Similarly, `c = a(2:5,[1,3])` creates a matrix using this
    logic: from the first and fifth column, take elements from the second row to the
    third row. Now you can easily guess what `a([2,5],[1,3])` and `a(2:5,1:3)` should
    do. It’s a good idea to practice slicing of arrays rigorously, as this is one
    of the most sought-after skills in data cleaning and data analysis in general.


    ## 2.10 Automatic Generation of Arrays


    MATLAB presents a variety of ways to generate arrays of numbers automatically
    according to a specified rule. Three methods are discussed in the following sections.


    ### 2.10.1 The `:` Operator


    One of the most useful operators in MATLAB, the `:` operator can be mastered easily.
    You have already seen its usage in selecting a sub-matrix in Chapter 2.


    ```

    1  >> help:

    2  :  Colon.

    3  J:K is the same as [J,J+1,...,J+m], where m = fix(K–J). In the

    4  case where both J and K are integers, this is simply [J,J+1,...,K].

    5  This syntax returns an empty matrix if J>K.


    7  J:I:K is the same as [J,J+I,...,J+m_I], where m = fix((K–J)/I).

    8  This syntax returns an empty matrix when I == 0, I>0 and J>K, or

    9  I<0 and J<K.


    11  colon (J,K) is the same as J:K and colon (J,I,K) is the same as J:I:K.


    13  The colon notation can be used to pick out selected rows, columns

    14  and elements of vectors, matrices, and arrays. A(:) is all the

    15  elements of A, regarded as a single column. On the left side of an

    16  assignment statement, A(:) fills A, preserving its shape from before.

    17  A(:,J) is the J–th column of A. A(J:K) is [A(J),A(J+1),...,A(K)].

    18  A(:,J:K) is [A(:,J),A(:,J+1),...,A(:,K)] and so on.


    20  The colon notation can be used with acellar ray to produce a comma–

    21  separated list. C{:} is the same as Cf1g,Cf2g,...,Cfendg.

    22  The comma separated list syntax is valid inside () for function calls, []
    for

    23  concatenation and function return arguments, and inside fg to produce

    24  a cell array. Expressions such as S(:). name produce the comma

    25  separated list S(1).name,S(2).name,...,S(end). name for the structure S.


    27  For the use of the colon in the FOR statement, See FOR.

    28  For the use of the colon in a comma separated list, See VARARGIN.


    30  Reference page for colon

    31  Other functions named colon

    ```


    You can generate a series of numbers and store them as arrays by using the `start:step:stop`
    command.


    ```

    1  >> a=1:1:10

    2  a =


    4  Columns 1 through 7


    6  1    2    3    4    5    6    7


    8  Columns 8 through 10


    10  8    9    10


    12  >> a =[1:1:10]

    13  a =


    15  Columns 1 through 7


    17  1    2    3    4    5    6    7


    19  Columns 8 through 10


    21  8    9    10

    ```


    Note that brackets (`[]`) are optional here. If a step is not defined, then it
    is taken as 1.


    ```

    1  >> a=1:10

    2  a =


    4  Columns 1 through 7


    6  1    2    3    4    5    6    7


    8  Columns 8 through 10


    10  8    9    10


    12  >> a=1:2:10


    14  a =


    16  1    3    5    7    9

    ```


    ### 2.10.2 Linearly Spaced Vectors


    The `linspace(start, stop, n)` command produces an array starting at the first
    number and stopping at the second one with a total of n numbers. Hence, they are
    linearly spaced.


    ```

    1  >> a = linspace(1,2,5)

    2  a =


    4  Columns 1 through 4


    6  1.0000    1.2500    1.5000    1.7500


    8  Column 5


    10  2.0000


    12  >> a = linspace(1,2,10)

    13  a =


    15  Columns 1 through 4


    17  1.0000    1.1111    1.2222    1.3333


    19  Columns 5 through 8


    21  1.4444    1.5556    1.6667    1.7778


    23  Columns 9 through 10


    25  1.8889    2.0000

    ```'
