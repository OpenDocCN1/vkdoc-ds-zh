- fmt: '### 6.3 Defining a Model


    Modeling means writing equations for a physical system. As the name suggests,
    an equation is about equating two sides. An equation is written using an equals
    (`=`) sign, where terms on the left side are equal to terms on the right side.
    The terms on either side of an equation can be numbers or expressions. For example:


    ![ $$ 3x+4y+9z=10 $$ ](A458923_1_En_6_Chapter_Equa.gif)


    This equation has the term `3x + 4y + 9z` on the left hand side (LHS) and the
    term `10` on the right hand side (RHS). Note that whereas LHS is an algebraic
    term, RHS is a number.


    Expressions are written using functions, which is simply a relationship between
    two domains. Like `f(x) = y` is a relationship from `y` to `x` using the rules
    of algebra. Mathematics has a rich library of functions, which you can use to
    make expressions.


    Choosing the proper functions depends on the problem. Some functions describe
    some situations best. For example, the oscillatory behavior can be described in
    a reasonable manner using trigonometric functions like `sin(x)`, `cos(x)`, etc.
    Objects moving in straight lines can be described well using linear equations
    like `y = mx + c`, where `x` is the present position, `m` is the constant rate
    of change of `x`, and `c` is the offset position. Objects moving in a curved fashion
    can be described by various non-linear functions (where the power of the dependent
    variable is not 1).


    In real life, you can have situations that are a mixture of these scenarios. An
    object can oscillate and move in a curved fashion at the same time. In that case,
    you write an expression using a mixture of functions or find new functions that
    can explain the behavior of the object. Verifying the functions is done by finding
    solutions to equations describing the behavior and matching it with observations
    of the object. If they match perfectly, you have a perfect solution. In most cases,
    an exact solution might be difficult to obtain. In these cases, you get an “approximate”
    solution. If the errors involved while obtaining an approximate solution are within
    tolerable limits, the models can be acceptable.


    As discussed, physical situations can be analytically solved by writing mathematical
    expressions in terms of functions involving dependent variables. The simplest
    problems have simple functions between dependent variables with a single equation.
    There can be situations where multiple equations are needed to explain a physical
    behavior. In case of multiple equations being solved, the theory of the matrix
    comes in handy.


    Suppose the following equations define the physical behavior of a system:


    ![ $$ -x+3y=4 $$ ](A458923_1_En_6_Chapter_Equ1.gif)


    (Equation 6-1)


    ![ $$ 2x-4y=-3 $$ ](A458923_1_En_6_Chapter_Equ2.gif)


    (Equation 6-2)


    Then this system of two equations can be represented by a matrix equation, as
    follows:


    ![ $$ \left[\begin{array}{cc}-1& 3\\ {}2& -4\end{array}\right]+\left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{c}4\\ {}3\end{array}\right] $$ ](A458923_1_En_6_Chapter_Equb.gif)


    Now using matrix algebra, values of variables `x` and `y` can be found such that
    they satisfy the equations. Those values are called roots of these equations.
    These roots are the point in 2D space (because there are two dependent variables)
    where the system will find stability for that physical problem. In this way, you
    can predict the behavior of system without actually doing an experiment.


    Mathematical concepts of differentiation and integration become very important
    when you need to work with dynamic systems. When the system is constantly changing
    the values of its dependent variables to produce a scenario, it’s important to
    know the rate of change of these variables. When these variables are independent
    of each other, you can use simple derivatives to define their rate of change.
    When they are not independent of each other, you must use partial derivatives
    for the same.


    For example, Newton’s second law of motion says that the rate of change of velocity
    of an object is directly proportional to the force applied on it. Mathematically:


    ![ $$ F\ \alpha\ \frac{dy}{dx} $$ ](A458923_1_En_6_Chapter_Equ3.gif)


    (Equation 6-3)


    The proportionality is turned into equality by substituting for a constant of
    multiplication `m` such that:


    ![ $$ F=m\times \frac{dy}{dx} $$ ](A458923_1_En_6_Chapter_Equ4.gif)


    (Equation 6-4)


    If you know values or expressions for `F`, this equation can be solved analytically
    and solutions can be found to this equation. But in some cases, the analytical
    solution may be too difficult to obtain. In those cases, you can digitize the
    system and find a numerical solution.


    There are many methods to digitize and numerically solve a given function. Programs
    used to implement a particular method to solve a function numerically are called
    solvers. A lot of solvers exist to solve a function. The choice of solver is critical
    to successfully obtain a solution. For example, Equation 6-4 is a differential
    equation. It is a first order ordinary differential equation. A number of solvers
    exist to solve such problems, like Euler, Runge-Kutta, etc. The choice of the
    particular solver depends on the accuracy of its solution, the time taken for
    obtaining a solution, and the amount of memory used during the process. The last
    point is especially important when memory is not a freely expendable commodity,
    such as when you’re using micro-computers with limited memory storage.


    The advantage of using MATLAB to perform numerical computations lies in the fact
    that it has a very rich library of functions to perform the various tasks required.
    The predefined functions have been optimized for speed and accuracy (in some cases,
    accuracy can be predefined). This enables you to rapidly prototype the problem
    instead of concentrating on writing functions to do basic tasks and optimizing
    them for speed, accuracy, and memory usage.


    ### 6.4 Example: Polynomials


    The coefficients of a vector are defined as elements of a vector. In this manner,
    a coefficient is defined for numerical computing. For example, consider defining
    two arrays, `p1` and `p2`, as shown:


    ```

    >> p1 = [1 0 3 2]


    p1 =


    1     0     3     2


    >> p2 =[3 4 0 5]


    p2 =


    3     4     0     5

    ```


    The corresponding polynomial for `p1` is `p[1](s) = s³ + 3s − 2 = 0` and for `p2`,
    it’s `p[2](s) = 3s³ + 4s² − 5 = 0`. See Figure [6-1](#A458923_1_En_6_Chapter.html#Fig1).


    ![A458923_1_En_6_Fig1_HTML.gif](A458923_1_En_6_Fig1_HTML.gif)


    Figure 6-1


    Plot for equation `p[2](s) = 3s³ + 4s² − 5 = 0`


    #### 6.4.1 `polyval()`


    Polynomials can be evaluated for a single value or multiple values using the `polyval()`
    function. Consider the polynomials defined in `p1` and `p2`. Let’s calculate the
    values for `p[1](5)` and `p₂(-2)`.


    ```

    >> s = 5


    s =


    5


    >> polyval(p1,s)


    ans =


    142


    >> s=2


    s =


    2


    >> polyval(p2,s)


    ans =


    45

    ```


    If a polynomial needs to be calculated on multiple values, say from 1 to 10 for
    `p[1]`, then an array `1:10` can be fed to the `s` variable and this can be used
    in the `polyval()` function.


    ```

    >> s = 1:10;

    >> polyval(p2,s)


    ans =


    12    45    122    261    480    797    1230    1797    2516    3405

    ```


    This facility can be used to plot polynomials easily. The `plot()` command can
    be fed `s` and `polyval()` output as the x and y axes to visualize a plot.'
