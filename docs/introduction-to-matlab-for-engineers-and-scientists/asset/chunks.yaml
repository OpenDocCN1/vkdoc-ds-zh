    \  info3 = book(2).chapters(3)\n\n15  info3 =\n\n17  3\n```\n\n## 2.15 元胞数组\n\n\
    元胞数组是由元胞组成的数组，其中每个元胞存储一个数组。在一个元胞内，元素必须是相同类型（因为元胞存储数组），但两个元胞可以有不同的类型。例如，假设你有三个数组：`array1`（存储数值）、`array2`（存储文本值）和`array3`（存储数值）。然后你可以使用这三个数组构建一个元胞数组。这个元胞数组的元素存储不同类型的数组，但每个元素只存储一种类型的数据。\n\
    \n### 2.15.1 创建元胞数组\n\n函数`cell(m,n)`创建一个大小为`m`×`n`的空元胞数组。通过向这个空元胞数组赋值，可以按需一次一个元胞地构建它。首先创建一个由变量`a`引用的空元胞数组。有两种赋值数据的方法：\n\
    \n*   **元胞索引**：元胞索引写在圆括号`()`内，元胞内容写在花括号`{}`内，位于赋值运算符的两侧，如下所示：\n    ```\n    1\
    \  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n    7  []    []\
    \    []\n    8  []    []    []\n    9  []    []    []\n\n    11  >> a(1,1) = ([1,2,3]);\n\
    \    12  >> a(1,2) = (['a','b']);\n    13  >> a(1,3) = (\"Sandeep\");\n    14\
    \  >> a(2,3) = ([1.5,–2]);\n    15  >> a(2,2) = ([–200]);\n    16  >> a(2,1) =\
    \ ([\"Nagar\"]);\n    17  >> a(3,1) = ([–10,–15.5,5.3]);\n    18  >> a(3,2) =\
    \ ([\"Hello\"]);\n    19  >> a(3,3) = ([\"World\"])\n\n    21  a =\n\n    23 \
    \ 3x3 cell array\n\n    25  [1x3 double]    'ab'           [\"Sandeep\"]\n   \
    \ 26  [\"Nagar\"]       [–200]         [1x2 double]\n    27  [1x3 double]    [\"\
    Hello\"]      [\"World\"]\n\n    ```\n\n*   **内容索引**：这里，花括号/圆括号的使用顺序相反，即`()`用于内容，`[]`用于索引。\n\
    \    ```\n    1  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n \
    \   7  []    []    []\n    8  []    []    []\n    9  []    []    []\n\n    11\
    \  >> a {1,1} = ([1,2,3]);\n    12  >> a {1,2} = (['a','b']);\n    13  >> a {1,3}\
    \ = (\"Sandeep\");\n    14  >> a {2,3} = ([1.5,–2]);\n    15  >> a {2,2} = ([–200]);\n\
    \    16  >> a {2,1} = ([\"Nagar\"]);\n    17  >> a {3,1} = ([–10,–15.5,5.3]);\n\
    \    18  >> a {3,2} = ([\"Hello\"]);\n    19  >> a {3,3} = ([\"World\"])\n\n \
    \   21  a =\n\n    23  3x3 cell array\n\n    25  [1x3 double]    'ab'        \
    \ [\"Sandeep\"]\n    26  [\"Nagar\"]       [–200]       [1x2 double]\n    27 \
    \ [1x3 double]    [\"Hello\"]    [\"World\"]\n\n    ```\n\n### 2.15.2 `celldisp()`\
    \ 和 `cellplot()` 函数\n\n构建好的元胞数组可以通过两个函数`celldisp()`和`cellplot()`来显示。`celldisp()`命令显示完整的元胞内容，而`cellplot()`则显示元胞架构的图形化表示。见图2-1。\n\
    \n![A458923_1_En_2_Fig1_HTML.gif](A458923_1_En_2_Fig1_HTML.gif)\n\n图2-1 `cellplot(a)`的输出\n\
    \n### 2.15.3 `cell2struct()`, `num2cell()`, 和 `struct2cell()` 函数\n\n`cell2struct()`命令可用于将元胞数组转换为结构体。类似地，`num2cell()`可用于将数值数组转换为元胞数组，而`struct2cell()`可用于将结构体转换为元胞数组。\n\
    \n## 2.16 总结\n\n基于数组的计算是现代计算技术的核心。MATLAB提供了一个非常合适的平台来轻松执行这项技术。各种预定义函数使用户能够在原型设计问题时节省时间。拥有灵活的方法来定义多维数组并执行快速计算是我们这个时代的必需品。大多数仿真时间要么花在循环中，要么花在数组操作上。预定义的数组操作已经过算法优化，以实现可靠性、节省时间和高效的内存管理。\n\
    \n# 3. 绘图\n\n## 3.1 引言\n\n没有可视化，数值计算难以评估。生成能够提供数值结果有意义分析的复杂图形的出版级图像，一直是全世界科学家面临的挑战。许多商业软件程序在满足这一需求方面非常成功。MATLAB也提供了这一功能。其绘图特性包括：从各种2D和3D图形类型中选择，通过添加额外信息（如标题、带标签的坐标轴、网格和数据标签）来增强图形，以及书写关于数据的方程式和其他重要信息。最重要的特性是，图形可以以编程方式定义，即你可以使用计算机程序输入绘图数据。这与手动输入数据截然不同。\n\
    \n其中一个优势是，你可以使用各种函数来定义数据。另一个优势是，当数据有大量条目时，可以按照支配计算机程序的规则来输入。以下各节将详细描述这些操作。\n\n\
    值得一提的是，绘图能力对于机器学习实验至关重要，因为从渐进步骤中获得的视觉指引能让你直观地理解所考虑的问题。\n\n### 3.1.1 2D绘图"
  raw: "### 2.13.3 struct()\n\nThe function `struct()` can also be used to define\
    \ a structured array with the syntax shown in the following code:\n\n```\n1  >>\
    \ book1 = struct('name','Introducing MATLAB','author','Sandeep Nagar','pages',175,'chapters',[1,\
    \ 2, 3, 4, 5, 6, 7])\n\n3  book1 =\n\n5  struct with fields:\n\n7  name:'Introducing\
    \ MATLAB'\n8  author:'Sandeep Nagar'\n9  pages:175\n10  chapters:[1 2 3 4 5 6\
    \ 7]\n\n12  >> book1(2) = struct('name','Introducing python','author',\n'Sandeep\
    \ Nagar','pages',175,'chapters',[1, 2, 3, 4, 5, 6, 7, 8, 9])\n\n14  book1 =\n\n\
    16  1x2 struct array with fields:\n\n18  name\n19  author\n20  pages\n21  chapters\n\
    ```\n\nA new structure named `book1` is created where field names and values are\
    \ filled in successively. It can be expanded using the index number in a similar\
    \ fashion, making it a `1-by-2` structure array.\n\nA structure array may contain\
    \ another structure or even a structure array as its fields. These are called\
    \ nested array. This is demonstrated here, where `book1` (a structure array defined\
    \ previously) is added as a new field to the structure array `book`.\n\n```\n\
    1  >> book(3).linked book = book1\n\n3  book =\n\n5  1x3 struct array with fields:\n\
    \n7  name\n8  author\n9  pages\n10  chapters\n11  linked_book\n```\n\n## 2.14\
    \ Getting Data from a Structure Array\n\nData values can be assigned from a structure\
    \ array using index numbers, as demonstrated next. Here, `info1` stores the value\
    \ of the field `name` for the second structure (signified by the syntax `book(2)`).\
    \ In a similar fashion, `info2` stores the value of the field `name` for the first\
    \ structure (signified by the syntax `book(1)`). The variable `info3` extracts\
    \ the third element of the field `chapter` from the second structure of the structure\
    \ array `book`.\n\n```\n1  >> info1 = book(2).name()\n\n3  info1 =\n\n5  'Introducing\
    \ SCILAB'\n\n7  >> info2 = book(1).name()\n\n9  info1 =\n\n11  'Introducing MATLAB'\n\
    \n13  info3 = book(2).chapters(3)\n\n15  info3 =\n\n17  3\n```\n\n## 2.15 Cell\
    \ Arrays\n\nCell arrays are arrays of cells where each cell stores an array. Within\
    \ a cell, elements must be the same type (because cells store arrays), but two\
    \ cells may have different types. For example, suppose you have three arrays—`array1`\
    \ (stores numerical values), `array2` (stores textual values), and `array2` (stores\
    \ numerical values). You can then construct a cell array using these three arrays.\
    \ The elements of this cell array store different types of arrays, but each element\
    \ stores just one type of data.\n\n### 2.15.1 Creating Cell Arrays\n\nThe `cell(m,n)`\
    \ function makes an empty cell array of the size m − by − n. By assigning data\
    \ values to this empty cell array, it can then be constructed as desired, one\
    \ cell at a time. Let’s first create an empty cell array, referenced by a variable,\
    \ say `a`. There are two ways to assign the data:\n\n*   Cell indexing: Cell indices\
    \ are mentioned within parentheses `()` and cell contents are mentioned within\
    \ brackets `{}` on either side of assignment operator, like so:\n\n    ```\n \
    \   1  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n    7  []  \
    \  []    []\n    8  []    []    []\n    9  []    []    []\n\n    11  >> a(1,1)\
    \ = ([1,2,3]);\n    12  >> a(1,2) = (['a','b']);\n    13  >> a(1,3) = (\"Sandeep\"\
    );\n    14  >> a(2,3) = ([1.5,–2]);\n    15  >> a(2,2) = ([–200]);\n    16  >>\
    \ a(2,1) = ([\"Nagar\"]);\n    17  >> a(3,1) = ([–10,–15.5,5.3]);\n    18  >>\
    \ a(3,2) = ([\"Hello\"]);\n    19  >> a(3,3) = ([\"World\"])\n\n    21  a =\n\n\
    \    23  3x3 cell array\n\n    25  [1x3 double]    'ab'           [\"Sandeep\"\
    ]\n    26  [\"Nagar\"]       [–200]         [1x2 double]\n    27  [1x3 double]\
    \    [\"Hello\"]      [\"World\"]\n\n    ```\n\n*   Content indexing: Here, brackets/parentheses\
    \ are used in reverse fashion, i.e., () for content and `[]` for indices.\n\n\
    \    ```\n    1  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n \
    \   7  []    []    []\n    8  []    []    []\n    9  []    []    []\n\n    11\
    \  >> a {1,1} = ([1,2,3]);\n    12  >> a {1,2} = (['a','b']);\n    13  >> a {1,3}\
    \ = (\"Sandeep\");\n    14  >> a {2,3} = ([1.5,–2]);\n    15  >> a {2,2} = ([–200]);\n\
    \    16  >> a {2,1} = ([\"Nagar\"]);\n    17  >> a {3,1} = ([–10,–15.5,5.3]);\n\
    \    18  >> a {3,2} = ([\"Hello\"]);\n    19  >> a {3,3} = ([\"World\"])\n\n \
    \   21  a =\n\n    23  3x3 cell array\n\n    25  [1x3 double]    'ab'        \
    \ [\"Sandeep\"]\n    26  [\"Nagar\"]       [–200]       [1x2 double]\n    27 \
    \ [1x3 double]    [\"Hello\"]    [\"World\"]\n\n    ```\n\n### 2.15.2 The celldisp()\
    \ and cellplot() Functions\n\nThe constructed cell arrays can be displayed by\
    \ using two functions called `celldisp()` and `cellplot()`. The `celldisp()` command\
    \ displays the full cell contents, whereas `cellplot()` displays a graphical display\
    \ of the cell architecture. See Figure [2-1](#A458923_1_En_2_Chapter.html#Fig1).\n\
    \n![A458923_1_En_2_Fig1_HTML.gif](A458923_1_En_2_Fig1_HTML.gif)\n\nFigure 2-1\n\
    \nOutput of cellplot (a)\n\n### 2.15.3 The cell2struct(), num2cell(), and struct2cell()\
    \ Functions\n\nThe `cell2struct()` command can be used to convert a cell array\
    \ to a structure. Similarly, `num2cell()` can be used to convert a numeric array\
    \ into a cell array and `struct2cell()` can be used to convert a structure into\
    \ a cell array.\n\n## 2.16 Summary\n\nArray based computing lies at the very heart\
    \ of modern computational techniques . MATLAB presents a very suitable platform\
    \ to perform this technique with ease. A variety of predefined functions enable\
    \ users to save time while prototyping a problem. Having flexible methods to define\
    \ multidimensional arrays and perform fast computation is the necessity of our\
    \ times. Most of the time spent on a simulation is either in loops or in array\
    \ operations. Predefined array operations have been optimized with algorithms\
    \ for reliability, time savings, and efficient memory management.\n\n# 3. Plotting\n\
    \n## 3.1 Introduction\n\nWithout visualization, numerical computations are difficult\
    \ to judge. Producing publication quality images of complex plots that provide\
    \ meaningful analysis of numerical results has been a challenge for scientists\
    \ all over the world. Many commercial software programs have been very successful\
    \ in satisfying this need. MATLAB also provides this facility. Its plotting features\
    \ include choosing from various types of plots in 2D and 3D, enhancing plots with\
    \ additional information like titles, labeled axes, grids, and labels for data,\
    \ and writing equations and other important information about the data. The most\
    \ important feature is that plots can be defined in a programmatic manner, i.e.,\
    \ you can enter the data for a plot using a computer program. This is quite different\
    \ than entering the data by hand.\n\nOne of the advantages is that you can define\
    \ the data using a variety of functions. The other advantage is when the data\
    \ has a huge number of entries, it can be entered according to the rules that\
    \ govern the computer program. The following sections describe these actions in\
    \ detail.\n\nIt is worth mentioning that plotting capabilities are essential to\
    \ machine learning experiments, since visual directions from the progressive steps\
    \ give you an intuitive understanding of the problem under consideration.\n\n\
    ### 3.1.1 2D Plotting"
  trans: "\n### 2.13.3 `struct()`\n\n函数 `struct()` 也可以用来定义结构体数组，语法如下方代码所示：\n\n```\n\
    1  >> book1 = struct('name','Introducing MATLAB','author','Sandeep Nagar','pages',175,'chapters',[1,\
    \ 2, 3, 4, 5, 6, 7])\n\n3  book1 =\n\n5  struct with fields:\n\n7  name:'Introducing\
    \ MATLAB'\n8  author:'Sandeep Nagar'\n9  pages:175\n10  chapters:[1 2 3 4 5 6\
    \ 7]\n\n12  >> book1(2) = struct('name','Introducing python','author',\n'Sandeep\
    \ Nagar','pages',175,'chapters',[1, 2, 3, 4, 5, 6, 7, 8, 9])\n\n14  book1 =\n\n\
    16  1x2 struct array with fields:\n\n18  name\n19  author\n20  pages\n21  chapters\n\
    ```\n\n一个新结构体`book1`被创建，其中字段名和值被依次填充。可以通过类似的方式使用索引号对其进行扩展，使其成为一个`1-by-2`的结构体数组。\n\
    \n一个结构体数组可以包含另一个结构体，甚至是一个结构体数组作为其字段。这些被称为嵌套数组。这里演示了如何将`book1`（先前定义的结构体数组）作为新字段添加到结构体数组`book`中。\n\
    \n```\n1  >> book(3).linked book = book1\n\n3  book =\n\n5  1x3 struct array with\
    \ fields:\n\n7  name\n8  author\n9  pages\n10  chapters\n11  linked_book\n```\n\
    \n## 2.14 从结构体数组中获取数据\n\n可以使用索引号从结构体数组中赋值数据，如下所示。这里，`info1`存储了第二个结构体（由语法`book(2)`表示）的字段`name`的值。类似地，`info2`存储了第一个结构体（由语法`book(1)`表示）的字段`name`的值。变量`info3`从结构体数组`book`的第二个结构体中提取了字段`chapter`的第三个元素。\n\
    \n```\n1  >> info1 = book(2).name()\n\n3  info1 =\n\n5  'Introducing SCILAB'\n\
    \n7  >> info2 = book(1).name()\n\n9  info1 =\n\n11  'Introducing MATLAB'\n\n13\
    \  info3 = book(2).chapters(3)\n\n15  info3 =\n\n17  3\n```\n\n## 2.15 元胞数组\n\n\
    元胞数组是由元胞组成的数组，其中每个元胞存储一个数组。在一个元胞内，元素必须是相同类型（因为元胞存储数组），但两个元胞可以有不同的类型。例如，假设你有三个数组：`array1`（存储数值）、`array2`（存储文本值）和`array3`（存储数值）。然后你可以使用这三个数组构建一个元胞数组。这个元胞数组的元素存储不同类型的数组，但每个元素只存储一种类型的数据。\n\
    \n### 2.15.1 创建元胞数组\n\n函数`cell(m,n)`创建一个大小为`m`×`n`的空元胞数组。通过向这个空元胞数组赋值，可以按需一次一个元胞地构建它。首先创建一个由变量`a`引用的空元胞数组。有两种赋值数据的方法：\n\
    \n*   **元胞索引**：元胞索引写在圆括号`()`内，元胞内容写在花括号`{}`内，位于赋值运算符的两侧，如下所示：\n    ```\n    1\
    \  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n    7  []    []\
    \    []\n    8  []    []    []\n    9  []    []    []\n\n    11  >> a(1,1) = ([1,2,3]);\n\
    \    12  >> a(1,2) = (['a','b']);\n    13  >> a(1,3) = (\"Sandeep\");\n    14\
    \  >> a(2,3) = ([1.5,–2]);\n    15  >> a(2,2) = ([–200]);\n    16  >> a(2,1) =\
    \ ([\"Nagar\"]);\n    17  >> a(3,1) = ([–10,–15.5,5.3]);\n    18  >> a(3,2) =\
    \ ([\"Hello\"]);\n    19  >> a(3,3) = ([\"World\"])\n\n    21  a =\n\n    23 \
    \ 3x3 cell array\n\n    25  [1x3 double]    'ab'           [\"Sandeep\"]\n   \
    \ 26  [\"Nagar\"]       [–200]         [1x2 double]\n    27  [1x3 double]    [\"\
    Hello\"]      [\"World\"]\n\n    ```\n\n*   **内容索引**：这里，花括号/圆括号的使用顺序相反，即`()`用于内容，`[]`用于索引。\n\
    \    ```\n    1  >> a = cell(3,3)\n\n    3  a =\n\n    5  3x3 cell array\n\n \
    \   7  []    []    []\n    8  []    []    []\n    9  []    []    []\n\n    11\
    \  >> a {1,1} = ([1,2,3]);\n    12  >> a {1,2} = (['a','b']);\n    13  >> a {1,3}\
    \ = (\"Sandeep\");\n    14  >> a {2,3} = ([1.5,–2]);\n    15  >> a {2,2} = ([–200]);\n\
    \    16  >> a {2,1} = ([\"Nagar\"]);\n    17  >> a {3,1} = ([–10,–15.5,5.3]);\n\
    \    18  >> a {3,2} = ([\"Hello\"]);\n    19  >> a {3,3} = ([\"World\"])\n\n \
    \   21  a =\n\n    23  3x3 cell array\n\n    25  [1x3 double]    'ab'        \
    \ [\"Sandeep\"]\n    26  [\"Nagar\"]       [–200]       [1x2 double]\n    27 \
    \ [1x3 double]    [\"Hello\"]    [\"World\"]\n\n    ```\n\n### 2.15.2 `celldisp()`\
    \ 和 `cellplot()` 函数\n\n构建好的元胞数组可以通过两个函数`celldisp()`和`cellplot()`来显示。`celldisp()`命令显示完整的元胞内容，而`cellplot()`则显示元胞架构的图形化表示。见图\
    \ 2-1。\n\n![A458923_1_En_2_Fig1_HTML.gif](img/A458923_1_En_2_Fig1_HTML.gif)\n\n\
    图 2-1 `cellplot(a)`的输出\n\n### 2.15.3 `cell2struct()`, `num2cell()`, 和 `struct2cell()`\
    \ 函数\n\n`cell2struct()`命令可用于将元胞数组转换为结构体。类似地，`num2cell()`可用于将数值数组转换为元胞数组，而`struct2cell()`可用于将结构体转换为元胞数组。\n\
    \n## 2.16 总结\n\n基于数组的计算是现代计算技术的核心。MATLAB 提供了一个非常合适的平台来轻松执行这项技术。各种预定义函数使用户能够在原型设计问题时节省时间。拥有灵活的方法来定义多维数组并执行快速计算是我们这个时代的必需品。大多数仿真时间要么花在循环中，要么花在数组操作上。预定义的数组操作已经过算法优化，以实现可靠性、节省时间和高效的内存管理。\n\
    \n# 3. 绘图\n\n## 3.1 引言\n\n没有可视化，数值计算难以评估。生成能够提供数值结果有意义分析的复杂图形的出版级图像，一直是全世界科学家面临的挑战。许多商业软件程序在满足这一需求方面非常成功。MATLAB\
    \ 也提供了这一功能。其绘图特性包括：从各种 2D 和 3D 图形类型中选择，通过添加额外信息（如标题、带标签的坐标轴、网格和数据标签）来增强图形，以及书写关于数据的方程式和其他重要信息。最重要的特性是，图形可以以编程方式定义，即你可以使用计算机程序输入绘图数据。这与手动输入数据截然不同。\n\
    \n其中一个优势是，你可以使用各种函数来定义数据。另一个优势是，当数据有大量条目时，可以按照支配计算机程序的规则来输入。以下各节将详细描述这些操作。\n\n\
    值得一提的是，绘图能力对于机器学习实验至关重要，因为从渐进步骤中获得的视觉指引能让你直观地理解所考虑的问题。\n\n### 3.1.1 2D 绘图\n"
- fmt: '#### `plot(x, y)`


    Since you need data on two axes to be plotted, you first need to create the plots.
    Assume for this example that the x axis has 100 linearly spaced data points on
    which y = x² is defined. See Figure [3-1](#A458923_1_En_3_Chapter.html#Fig1).


    ![A458923_1_En_3_Fig1_HTML.gif](A458923_1_En_3_Fig1_HTML.gif)


    Figure 3-1: The y = x² plot


    ```

    1  >> x = linspace(0,100,100);

    2  >> y=x.ˆ2;

    3  >> plot(x,y)

    4  >> xlabel(''x'')

    5  >> ylabel(''y=xˆ{2}'')

    6  >> title(''Plot of x versus y=xˆ{2}'')

    ```


    First we define a variable `x` and placed 100 equally spaced data points from
    0 to 100. This creates a 1×100 matrix. Using the scalar operation of exponentiation,
    we define a variable `y` as y = x². Then we use the `plot()` function, which takes
    two arguments as the x-axis and y-axis data points. Typing `help plot` on the
    command prompt gives useful insight into this wonderful function written to plot
    two dimensional data.


    The x and y axis labels can be placed using the `xlabel()` and `ylabel()` functions,
    which take a string as input. The string can be formatted with LATEX commands—for
    example, x² can be printed by using the `x^{2}` syntax. Similarly, the title can
    be added for the graph with an appropriate string.


    #### `area()`


    The `area()` function creates a similar plot as `plot()`, but it also shades the
    area under the curve, as shown in Figure [3-2](#A458923_1_En_3_Chapter.html#Fig2).


    ![A458923_1_En_3_Fig2_HTML.gif](A458923_1_En_3_Fig2_HTML.gif)


