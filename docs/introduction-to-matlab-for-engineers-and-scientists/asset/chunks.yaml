    and then various mathematical operations can be performed on it.


    Now let’s try to access slices of a multidimensional array. A matrix `a` is defined
    to be a 5×5 matrix.


    *   To access a single element, we use the index value of the row and column,
    For example, `b = a(1,1)` accesses the element within the first row and first
    column.

    *   To access all elements of a row or column, you can use the `:` operator. Hence,
    `c = a(1,:)` accesses all elements of the first row. Similarly, `>> d = a(:,1)`
    accesses all elements of the first column. A simple way to remember in words is
