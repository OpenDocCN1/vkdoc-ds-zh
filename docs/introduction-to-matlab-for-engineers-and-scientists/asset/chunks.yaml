- fmt: '### 1.6.3 List of Variables


    While working on a project, it is useful to keep track of all the variables used
    in the project to avoid errors due to duplication of names. You can obtain a list
    of all variables by using the `who` and `whos` commands. Whereas the command `who`
    simply presents the list of variables in the workspace, `whos` presents the same
    with more information, like the size of the variable, the number of bytes used
    to store the variable, and the variable type.


    ```

    1  >> who

    2  Your variables are:


    4  a    a1   a2   a3   ans


    6  >> whos

    7  Name       Size           Bytes  Class       Attributes


    9  a          1x1                8  double

    10  a1         1x1                8  double

    11  a2         1x1                8  double

    12  a3         1x1                8  double

    13  ans       20x1             2462  cell

    ```


    Note that the list of variables produced in this example represents the present
    state on my computer. If you have been working on projects other than practicing
    from the present book, all the variables defined in the present session will get
    reflected when you type `who` or `whos`. By using `who` and `whos`, you can keep
    track of memory requirements. Remember that judicious use of memory resources
    is important, especially on Raspberry Pi based systems. To wipe off the stored
    variables, you can use the `clear` command. It is also important to note that
    the variables list is session dependent. When you exit the session by closing
    MATLAB using the icon or using `exit`, the list of variables is erased from memory.


    ### 1.6.4 Global and Local Variables


    A variable declared globally (i.e., within the main program) is known as a global
    variable, whereas a variable declared locally within a function (explained in
    later chapters) is known as a local variable. To define a global variable, you
    use the `global` declaration statement. Once defined, it remains the same irrespective
    of any new definition, unless you issue the `clear` command to clear the variable
    names and values from memory.


    As seen, `a = 1` stays the same irrespective of the next definition, `a = 2`.
    When the command `clear` is issued at the command prompt, all variable names and
    values are flushed out of memory and the variable name can be used again. This
    time, if it is not defined as a `global` variable, its value can be changed repeatedly.
    The `isglobal()` command lets one check if a variable name has been defined as
    a global variable.


    Global variables are used to define constants during numerical calculations. Suppose
    you want certain variables to change values, so you could make those unchanging
    values be global variables by giving the name of your choice. The predefined variables,
    like `pi`, `e`, etc., are defined in a similar manner.


    ### 1.6.5 The clear Command


    As seen in the previous section, the `clear` command flushes out the variable
    names and their values from memory. It proves to be much more useful than that.
    Whereas `clear all` is the same as `clear`, it can also be used to selectively
    wipe out variables and their values. Simply type `help clear` to see a detailed
    view of its use, as shown in Listing [1-1](#A458923_1_En_1_Chapter.html#Par63).


    ```

    1  >> help clear

    2  clear Clear variables and functions from memory.

    3  clear removes all variables from the workspace.

    4  clear VARIABLES does the same thing.

    5  clear GLOBAL removes all global variables.

    6  clear FUNCTIONS removes all compiled MATLAB and MEX–functions.

    7  Calling clear FUNCTIONS decreases code performance and is usually unnecessary.

    8  For more information, see the clear Reference page.


    10  clear ALL removes all variables, globals, functions and MEX links.

    11  clear ALL at the command prompt also clears the base import list.

    12  Calling clear ALL decreases code performance and is usually

    unnecessary.

    13  For more information, see the clear Reference page.


    15  clear IMPORT clears the base import list. It can only be issued at the

    16  command prompt. It cannot be used in a function or a script.


    18  clear CLASSES is the same as clear ALL except that class definitions

    19  are also cleared. If any objects exist outside the workspace (say in

    20  userdata or persistent in a locked program file) a warning will be

    21  issued and the class definition will not be cleared.

    22  Calling clear CLASSES decreases code per formance and is usually unnecessary.

    23  If you modify a class definition, MATLAB automatically updates it.

    24  For more information, see the clear Reference page.


    26  clear JAVA is the same as clear ALL except that java classes on the

    27  dynamic java path (defined using JAVACLASSPATH) are also cleared.


    29  clear VAR1 VAR2 ... clears the variables specified. The wildcard

    30  character ''*'' can be used to clear variables that match a pattern. For

    31  instance, clear X* clears all the variables in the current workspace

    32  that start with X.


    34  clear –REGEXP PAT1 PAT2 can be used to match all patterns using regular

    35  expressions. This option only clears variables. For more information on

    36  using regular expressions, type "doc regexp" at the command prompt.


    38  If X is global, clear X removes X from the current workspace, but

    39  leaves it accessible to any functions declaring it global.

    40  clear GLOBAL –REGEXP PAT removes global variables that match regular

    41  expression patterns.

    42  Note that to clear specific global variables, the GLOBAL option must

    43  come first. Otherwise, all global variables will be cleared.


    45  clear FUN clears the function specified. If FUN has been locked by

    46  MLOCK it will remain in memory. If FUN is a script or function that

    47  is currently executing, then it is not cleared. Use a partial path

    48  (see PARTIALPATH) to distinguish between different overloaded versions

    49  of FUN. For instance, ''clear inline/display'' clears only the INLINE

    50  method for DISPLAY, leaving any other implementations in memory.


    52  Examples for pattern matching:

    53  clear a*                  % Clear variables starting with "a"

    54  clear –regexp ^b\d2{3} $  % Clear variables starting with "b" and  %    followed
    by 3 digits


    56  clear –regexp \d         % Clear variables containing any digits


    58  See also clearvars, who, whos, mlock, munlock, persistent, import.


    60  Reference page for clear

    61  >>

    Listing 1-1

    The help clear Command

    ```


    Judicious use of the `clear` command proves to be a very powerful tool in managing
    memory requirements for a memory intensive numerical calculation.


    ## 1.7 Summary


    MATLAB is a high performance language for technical computing. By using MATLAB
    as a simple calculator (using numbers and basic operations) as well as a complex
    calculator (using variables with complex functions), you can perform numerical
    calculations with ease. The learning curve for MATLAB is quite flat, owing to
    its simple and intuitive syntax. Whenever you become confused, the documentation
    for the particular commands can be easily accessed using the `help` command. The
    MATLAB GUI (Graphic User Interface) also provides an integrated environment for
    working with many different kinds of computational tasks, as shall be explored
    in upcoming chapters.


    # 2. Array Based Computing'
