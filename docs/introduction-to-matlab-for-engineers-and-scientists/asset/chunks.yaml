    `input("Text")` displays the `Text` string at the MATLAB prompt (the default symbol
    is `>>>`) and waits for the user to input a value and press Enter. Users may enter
    any type of data. The input is treated as a MATLAB expression and it is evaluated
    in the current workspace. If the `input()` function is used for an assignment
    operation, then the data is assigned to a variable appropriately. If the user
    presses the Enter key without entering anything, then the input returns an empty
    matrix. When the user enters an invalid expression into the prompt, a relevant
    error message is displayed at the prompt. When a character or a string of character
    vectors needs to be fed into `input()`, the user must define them as a string.
    Otherwise, `''s''` is used as a second argument and then input is treated as a
    string. The usage is demonstrated in this code.


    ```

    1  >> prompt = ''What is your name:'';

    2  >> name = input(prompt)

    3  What is your name:Sandeep

    4  Error using input

    5  Undefined function or variable ''Sandeep''.


    7  What is your name:''Sandeep''


    9  name =


    11  ''Sandeep''


    13  >> name = input(prompt,''s'')

    14  What is your name:Sandeep


    16  name =


    18  ''Sandeep''


    ```


    While dealing with numerical values, a single value or an array must be used,
    but with valid MATLAB syntax. For example, in the following code, the user can
    type a single value of `r` (storing the radius of a circle) or multiple values
    as arrays. This information can then be used to find the circumference (= 2πr)
    and area (= πr2).


    ```

    1  >> r = input(''Enter value of radius:'');

    2  Enter value of radius:2

    3  >> circumference = 2*pi*r


    5  circumference =


    7  12.5664


    9  >> area = pi*rˆ2


    11  area =


    13  12.5664


    15  >> r = input(''Enter value of radius:'');

    16  Enter value of radius:[1 2 3]

