    9  >> sort(A)


    11  ans =


    13  0    –2    –2

    14  1    –2     3

    15  4     5     3


    17  >> sort(A,''ascend'')


    19  ans =


    21  0    –2    –2

    22  1    –2     3

    23  4     5     3


    25  >> sort(A,''descend'')


    27  ans =


    29  4    5    3

    30  1   –2    3

    31  0   –2   –2

    ```'
