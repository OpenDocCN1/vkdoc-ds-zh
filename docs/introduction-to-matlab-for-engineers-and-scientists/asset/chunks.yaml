    \nTaylor’s theorem explains how to define a great many mathematical functions,\
    \ which can be defined as polynomials and are called Taylor polynomials. The accuracy\
    \ of the final answer shown by a Taylor polynomial depends on its degree, i.e.,\
    \ the number of terms defined in the polynomial. This provides a convenient method\
    \ to customize the polynomial based on the desired tolerance.\n\nSuppose a mathematical\
    \ function f (x) needs to be approximated around x = a. A Taylor Polynomial p\
    \ [n] (x) of degree n centered at x = a is a polynomial (of degree at-most n)\
    \ that has the same value as n ^(th) derivative at x = a.\n\nHere’s how to derive\
    \ the formula for a Taylor Polynomial:\n\n1.  The zero order polynomial p [0]\
    \ (x) has degrees of at most zero.\n    *   p [0] (x) must be a constant function\
    \ (a horizontal line function, graphically).\n    *   Approximating around x =\
    \ a: p [0](x) = f(a). \n2.  The first order polynomial p [0](x) has a degree at\
    \ most of 1.\n\n    ![ $$ {p}_1(a)=f(a) $$ ](A458923_1_En_7_Chapter_Equa.gif)\n\
    \n    *   p1(x) must satisfy two conditions:and\n\n    ![ $$ {p}_1^{\\hbox{'}}(a)={f}_1^{\\\
    hbox{'}}(a) $$ ](A458923_1_En_7_Chapter_Equb.gif)\n\n    ![ $$ {p}_1(x)={f}^{\\\
    prime }(a)x+f(a)-{f}^{\\prime }(a)a=f(a)\\left(x-a\\right) $$ ](A458923_1_En_7_Chapter_Equc.gif)\n\
    \n    *   p [1](x) must be of the form p [1] (x) = mx + c (a straight line with\
    \ slope m and c as the intercept).\n    *   Since ![ $$ {p}^{\\prime }(a)={f}^{\\\
    prime }(a) $$ ](A458923_1_En_7_Chapter_IEq1.gif) so ![ $$ m={f}^{\\prime }(a)\
    \ $$ ](A458923_1_En_7_Chapter_IEq2.gif)\n    *   So we can write ![ $$ \\mathrm{c}=f(a)-{f}^{\\\
    prime }(a)a $$ ](A458923_1_En_7_Chapter_IEq3.gif)\n    *   Substituting back the\
    \ values of m and c, we get \n3.  Carrying forward the same arguments in a similar\
    \ fashion, you can write the general form of the Taylor Polynomial of order n\
    \ as:\n\n    ![ $$ {\\displaystyle \\begin{array}{l}{p}_n(x)=f(a)+{f}^{\\hbox{'}}(a)\\\
    left(x-a\\right)+\\frac{1}{2}{f}^{\\hbox{'}\\hbox{'}}(a){\\left(x-a\\right)}^2\\\
    \\ {}+\\frac{1}{3!}{f}^{\\hbox{'}\\hbox{'}\\hbox{'}}(a){\\left(x-a\\right)}^3+\\\
    cdots +\\frac{1}{n!}\\kern0.125em {f}^n(a){\\left(x-a\\right)}^n\\end{array}}\
    \ $$ ](A458923_1_En_7_Chapter_Equd.gif)\n\n    which can be rewritten in sigma\
    \ notation as follows:\n\n    ![ $$ {p}_n(x)=\\sum \\limits_{k=0}^n\\frac{1}{k!}{f}^k(a){\\\
    left(x-a\\right)}^k $$ ](A458923_1_En_7_Chapter_Equ5.gif)\n\n    (Equation 7-5)\
    \  \n\nThis definition requires that the polynomial must have n derivatives at\
    \ x = a.\n\nThe Maclaurin Series is simply the Taylor Series defined for a = 0\\\
    . You can use algebraic manipulations of the Taylor/Maclaurin Series for basic\
    \ functions like sin(x), cos(x), and e ^x to define other complicated functions\
    \ in their series forms. These can be performed by simply using algebraic operators\
    \ in addition to substitutions, derivatives, and integrations. This mathematical\
    \ convenience comes in handy in formulating approximate solutions for physical\
    \ systems defined by complicated functions.\n\n### 7.4.1 Maclaurin Series for\
    \ sin(x) and cos(x)\n\nTo check Maclaurin expansion, let’s start with the trigonometric\
    \ functions sin(x) and cos(x). Both are continuous and differentiable in the range\
    \ given by any set of real numbers. Hence their differentials exist in the same.\
    \ They can be expanded in the form of a Maclaurin Series as follows.\n\nSuppose\
    \ f (x) = sin(x) needs to be approximated at a = 0.\n\nUsing Table [7-1](#A458923_1_En_7_Chapter.html#Tab1)\
    \ and Equation 7.5 results in this equation:\n\n![ $$ \\mathit{\\sin}(x)=x-\\\
    frac{1}{3!}{x}^3+\\frac{1}{5!}{x}^5-\\frac{1}{7!}{x}^7+\\frac{1}{9!}{x}^9-\\cdots\
    \ \\pm \\frac{1}{n!}{x}^n $$ ](A458923_1_En_7_Chapter_Equ6.gif)\n\n(Equation 7-6)\n\
    \nTable 7-1\n\nCalculating Coefficients for the Maclaurin Series of sin(x) at\
    \ x = 0\n\n| n | f(x) | f(a) |\n| --- | --- | --- |\n| 0 | sin(x) | 0 |\n| 1 |\
    \ cos(x) | 1 |\n| 0 | −sin(x) | 0 |\n| 1 | −cos(x) | −1 |\n| 0 | sin(x) | 0 |\n\
    \nSimilarly for f (x) = cos(x) approximated at a = 0, using Table [7-2](#A458923_1_En_7_Chapter.html#Tab2)\
    \ and Equation 7-5 results in this equation:\n\n![ $$ \\mathit{\\cos}(x)=1-\\\
    frac{x^2}{2}+\\frac{1}{4!}{x}^4-\\frac{1}{6!}{x}^6+\\frac{1}{8!}{x}^8-\\cdots\
    \ \\pm \\frac{1}{n!}{x}^n $$ ](A458923_1_En_7_Chapter_Equ7.gif)\n\n(Equation 7-7)\n\
    \nTable 7-2\n\nCalculating Coefficients for the Maclaurin Series of cos(x) at\
    \ x = 0\n\n| n | f(x) | f(a) |\n| --- | --- | --- |\n| 0 | cos(x) | 1 |\n| 1 |\
    \ −sin(x) | 0 |\n| 0 | −cos(x) | −1 |\n| 1 | sin(x) | 0 |\n| 0 | cos(x) | 1 |"
  trans: "\n## 7.2 容差\n\n当用户获得一个或多个近似答案时，必须根据应用的要求从中选出一个答案。做出此决定的方法之一是定义容差限。容差可以定义为一个单一数值或一个数值范围（包含最大值和最小值）。定义容差限的规则完全取决于具体应用。例如，在测量人的身高时，我们可以将容差定义为\
    \ 1 厘米；但与此同时，在测量人类头发的直径时，我们可能希望将精度提高到 1 微米。同样地，在测量红细胞的大小时，我们需要将精度进一步降低到 1 纳米。然而，在测量尺寸时定义容差相对简单——即容差比物体尺寸小一到两个数量级——但在其他应用中这可能并非易事。例如，测量用于建造建筑物的土地时，容差需要在零点几米；而将螺丝定位到孔中时，精度则需在零点几厘米以内。\n\
    \n在数学术语中，如果 ∈ 是容差限，`x` 代表真实值，`x^*` 代表近似值：\n\n![ $$ \\mid x-{x}^{\\ast}\\mid \\\
    le \\in $$ ](img/A458923_1_En_7_Chapter_Equ1.gif)\n\n(方程 7-1)\n\n在这种情况下，测量中的绝对误差\
    \ (`e[a]`) 和相对误差 (`e[r]`) 由下式给出：\n\n![ $$ {e}_a=\\mid x-{x}^{\\ast}\\mid $$ ](img/A458923_1_En_7_Chapter_Equ2.gif)\n\
    \n(方程 7-2)\n\n![ $$ {e}_r=\\frac{\\mid x-{x}^{\\ast}\\mid }{x} $$ ](img/A458923_1_En_7_Chapter_Equ3.gif)\n\
    \n(方程 7-3)\n\n因此，如果绝对误差小于或等于容差限，则该近似解或解集是可接受的。然而，如果已知 `x`，我们为什么还需要计算近似解呢？\n\n\
    当物理系统的解未知时，可以计算出 `x^*`，然后将其与物理测量值进行比较。在这种情况下，物理测量值构成了 `x` 的值。然后，通过使用方程 7-2，我们可以计算误差。接着，可以利用某些\
    \ `x^*` 与 `x` 相差不大（即误差影响不大）这一事实来确定容差。\n\n## 7.3 泰勒级数\n\n大多数数学函数的计算都需要许多复杂的算符——除了像\
    \ `+`、`−`、`×` 和 `÷` 这样简单的算符之外。然而，多项式只需要这些基本算符即可计算。因此，如果其他数学函数可以用多项式表示，它们就可以相对容易地被近似。\n\
    \n多项式定义如下：\n\n![ $$ p(x)={a}_0+{a}_1x+{a}_2{x}²+\\cdots +{a}_n{x}^n $$ ](img/A458923_1_En_7_Chapter_Equ4.gif)\n\
    \n(方程 7-4) 其中 `a[n] ∈ R`（这些 a 称为系数）。对于对应 `a[n] ≠ 0` 的最大 `n`，该多项式的次数被定义为 `n`。\n\
    \n## 7.4 泰勒多项式\n\n泰勒定理解释了如何定义大量数学函数，这些函数可以定义为多项式，称为泰勒多项式。泰勒多项式所示最终答案的精度取决于它的次数，即多项式中定义的项数。这提供了一种便捷的方法，可以根据期望的容差来定制多项式。\n\
    \n假设一个数学函数 `f(x)` 需要在 `x = a` 附近被近似。一个以 `x = a` 为中心、`n` 次的泰勒多项式 `pn` 是一个（次数至多为\
    \ `n` 的）多项式，它在 `x = a` 处的值与 `f` 的 `n` 阶导数值相同。\n\n以下是推导泰勒多项式公式的方法：\n\n1.  零阶多项式\
    \ `p0` 的次数至多为零。\n    *   `p0` 必须是一个常数函数（图形上是水平线函数）。\n    *   在 `x = a` 附近近似：`p0\
    \ = f(a)`。\n2.  一阶多项式 `p1` 的次数至多为 1。\n\n    ![ $$ {p}_1(a)=f(a) $$ ](img/A458923_1_En_7_Chapter_Equa.gif)\n\
    \n    *   `p1(x)` 必须满足两个条件：\n\n        和\n\n    ![ $$ {p}_1^{'}(a)={f}_1^{'}(a)\
    \ $$ ](img/A458923_1_En_7_Chapter_Equb.gif)\n\n    ![ $$ {p}_1(x)={f}^{\\prime\
    \ }(a)x+f(a)-{f}^{\\prime }(a)a=f(a)\\left(x-a\\right) $$ ](img/A458923_1_En_7_Chapter_Equc.gif)\n\
    \n    *   `p1` 必须是 `p1 = mx + c` 的形式（一条斜率为 `m`、截距为 `c` 的直线）。\n    *   由于 `p'(a)\
    \ = f'(a)`，所以 `m = f'(a)`。\n    *   因此我们可以写成 `c = f(a) - f'(a)a`。\n    *   将 `m`\
    \ 和 `c` 的值代回，我们得到上式。\n3.  以类似的方式继续应用相同的论点，你可以写出 `n` 阶泰勒多项式的一般形式为：\n\n    ![ $$\
    \ {\\displaystyle \\begin{array}{l}{p}_n(x)=f(a)+{f}^{\\hbox{'}}(a)\\left(x-a\\\
    right)+\\frac{1}{2}{f}^{\\hbox{'}\\hbox{'}}(a){\\left(x-a\\right)}²\\\\ {}+\\\
    frac{1}{3!}{f}^{\\hbox{'}\\hbox{'}\\hbox{'}}(a){\\left(x-a\\right)}³+\\cdots +\\\
    frac{1}{n!}\\kern0.125em {f}^n(a){\\left(x-a\\right)}^n\\end{array}} $$ ](img/A458923_1_En_7_Chapter_Equd.gif)\n\
    \n    可以用西格玛记法重写如下：\n\n    ![ $$ {p}_n(x)=\\sum \\limits_{k=0}^n\\frac{1}{k!}{f}^k(a){\\\
    left(x-a\\right)}^k $$ ](img/A458923_1_En_7_Chapter_Equ5.gif)\n\n    (方程 7-5)\n\
    \n这个定义要求多项式必须在 `x = a` 处有 `n` 阶导数。\n\n麦克劳林级数就是定义在 `a = 0` 时的泰勒级数。你可以使用 `sin(x)`、`cos(x)`\
    \ 和 `e^x` 等基本函数的泰勒/麦克劳林级数的代数运算，来定义其他复杂函数的级数形式。这些运算可以通过简单地使用代数算符，加上代换、求导和积分来完成。这种数学上的便利性有助于为那些由复杂函数描述的物理系统制定近似解。\n\
    \n### 7.4.1 `sin(x)` 和 `cos(x)` 的麦克劳林级数\n\n为了验证麦克劳林展开，让我们从三角函数 `sin(x)` 和 `cos(x)`\
    \ 开始。两者在任意实数集给出的范围内都是连续且可微的。因此它们的微分在此范围内存在。它们可以展开为如下形式的麦克劳林级数。\n\n假设 `f(x) = sin(x)`\
    \ 需要在 `a = 0` 处被近似。\n\n使用表 7-1 和方程 7.5 可以得到以下方程：\n\n![ $$ \\mathit{\\sin}(x)=x-\\\
    frac{1}{3!}{x}³+\\frac{1}{5!}{x}⁵-\\frac{1}{7!}{x}⁷+\\frac{1}{9!}{x}⁹-\\cdots\
    \ \\pm \\frac{1}{n!}{x}^n $$ ](img/A458923_1_En_7_Chapter_Equ6.gif)\n\n(方程 7-6)\n\
    \n**表 7-1** 计算 `sin(x)` 在 `x = 0` 处的麦克劳林级数的系数\n\n| n | f(x) | f(a) |\n| --- |\
    \ --- | --- |\n| 0 | sin(x) | 0 |\n| 1 | cos(x) | 1 |\n| 2 | −sin(x) | 0 |\n|\
    \ 3 | −cos(x) | −1 |\n| 4 | sin(x) | 0 |\n\n类似地，对于在 `a = 0` 处近似的 `f(x) = cos(x)`，使用表\
    \ 7-2 和方程 7-5 可以得到以下方程：\n\n![ $$ \\mathit{\\cos}(x)=1-\\frac{x²}{2}+\\frac{1}{4!}{x}⁴-\\\
    frac{1}{6!}{x}⁶+\\frac{1}{8!}{x}⁸-\\cdots \\pm \\frac{1}{n!}{x}^n $$ ](img/A458923_1_En_7_Chapter_Equ7.gif)\n\
    \n(方程 7-7)\n\n**表 7-2** 计算 `cos(x)` 在 `x = 0` 处的麦克劳林级数的系数\n\n| n | f(x) | f(a)\
    \ |\n| --- | --- | --- |\n| 0 | cos(x) | 1 |\n| 1 | −sin(x) | 0 |\n| 2 | −cos(x)\
    \ | −1 |\n| 3 | sin(x) | 0 |\n| 4 | cos(x) | 1 |\n"
- fmt: "### Choosing Tolerance While Calculating `cos(x)`\n\nThe program `MaclaurinCos.m`\
    \ in Listing [7-1](#A458923_1_En_7_Chapter.html#Par31) shows how error is reduced\
    \ by many orders of magnitude, as more and more terms of the Taylor Series are\
    \ included for calculating `cos(15⁰)`. See Figure [7-1](#A458923_1_En_7_Chapter.html#Fig1).\n\
    \n![A458923_1_En_7_Fig1_HTML.gif](A458923_1_En_7_Fig1_HTML.gif)\n\n**Figure 7-1**\
    \  \nVariation of logarithmic error in the number of terms used to define a Maclaurin\
    \ Series for `cos(x)`\n\n```\n1  %A program to show usage of Taylor Series expansion\
    \ of cos(x)\n2  %Suppose we wish to calculate cos(15) where argument of cos function\
    \ is given in degrees\n\n4  x = 15*pi/180; %converts 15 degrees into radian\n\n\
    6  format long %show results in long format having a lot of decimal places for\
    \ numbers\n\n8  %Calculating each term of Taylor Series\n\n10  p1 = 1;\n11  p2\
    \ = xˆ(2)/2;\n12  p4 = xˆ(4)/factorial(4);\n13  p6 = xˆ(6)/factorial(6);\n14 \
    \ p8 = xˆ(8)/factorial(8);\n15  p10 = xˆ(10)/factorial(10);\n\n17  approx_1= p1−p2;\
    \ %approximate values using two terms\n18  approx_2= p1−p2+p4; %approximate values\
    \ using three terms\n19  approx_3= p1−p2+p4−p6; %approximate values using four\
    \ terms\n20  approx_4= p1−p2+p4−p6+p8; %approximate values using five terms\n\
    21  approx_5= p1−p2+p4−p6+p8−p10; %approximate values using six terms\n\n23  real_value\
    \ = cos(x); %calculating the real value to find errors\n\n25  %calculation of\
    \ final errors\n\n27  error_1 = abs(real_value − approx_1);\n28  error_2 = abs(real_value\
    \ − approx_2);\n29  error_3 = abs(real_value − approx_3);\n30  error_4 = abs(real_value\
    \ − approx_4);\n31  error_5 = abs(real_value − approx_5);\n\n33  %making an error\
    \ vector for plotting\n\n35  error = [error_1, error_2, error_3, error_4, error_5];\n\
    \n37  %plotting error versus number of terms\n\n39  figure(1)\n40  semilogy(error,'*r−')\n\
    41  title('Variation of error in calculating cos(15ˆ{0}) using Taylor Series')\n\
    42  xlabel('Number of terms on Taylor Series')\n43  ylabel('log(error)')\n\n45\
    \  %plotting cos(x) and its various approximations\n\n47  t = 0:0.001:20;\n48\
    \  %length(t)\n\n50  figure(2)\n51  y = cos(t);\n52  subplot(2,3,1)\n53  plot(t,y,t,ones(length(t)))\n\
    54  subplot(2,3,2)\n55  plot(t,y,t,(1−t.ˆ2/2))\n56  subplot(2,3,3)\n57  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)))\n\
    58  subplot(2,3,4)\n59  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)−t.ˆ6/factorial(6)))\n\
    60  subplot(2,3,5)\n61  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)−t.ˆ6/factorial(6)+t.ˆ8/\n\
    factorial(8)))\n62  subplot(2,3,6)\n63  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)−t.ˆ6/factorial(6)+t.ˆ8/\n\
    factorial (8)−t . ˆ 10 / factorial (10)))\n```\n**Listing 7-1**  \nThe `MaclaurinCos.m`\
    \ Program\n\nAs seen from Figure [7-1](#A458923_1_En_7_Chapter.html#Fig1), you\
    \ can now choose to insert certain numbers of terms as per the given tolerance\
    \ for calculating `cos(x)`. To make a judicious decision about the number of terms,\
    \ you must inspect the function in a similar fashion (as was done by `MaclaurinCos.m`).\
    \ Inserting a lot of terms while demanding less accuracy is a waste of time, energy,\
    \ and resources (both human and computational).\n\nInstead of expanding around\
    \ one particular point, the series can be defined for a set of points. The Octave\
    \ program called `CosApprox.m` attempts the same, as shown in Listing [7-2](#A458923_1_En_7_Chapter.html#Par34).\
    \ See Figure [7-2](#A458923_1_En_7_Chapter.html#Fig2).\n\n![A458923_1_En_7_Fig2_HTML.gif](A458923_1_En_7_Fig2_HTML.gif)\n\
    \n**Figure 7-2**  \nFitting of Maclaurin Series with different numbers of terms\
    \ to `cos(x)`\n\n```\n1  %plotting cos(x) and its various approximations\n\n3\
    \  t = −3*pi:pi/10:3*pi; %defining an array of points for x−axis\n4  l = length(t);\
    \ %to be used for defining pi\n5  y = cos(t); %real values of cosine function\n\
    \n7  %defining various terms of Maclaurin Series\n8  a1 = ones(l); %only first\
    \ term\n9  a2 = (1−t.ˆ2/2); %first and second term\n10  a3 = (a2+t.ˆ4/factorial(4));\
    \ %first, second and third term\n11  a4 = (a3−t.ˆ6/factorial(6)); %first, second,\
    \ third and fourth term\n12  a5 = (a4+t.ˆ8/factorial(8)); %first, second, third,\
    \ fourth and fifth term\n13  a6 = (a5−t.ˆ10/factorial(10)); %first, second, third,\
    \ fourth, fifth and sixth term\n\n15  %plotting fitting of cos(x) with increasing\
    \ number of terms\n16  figure(1)\n\n18  subplot(3,2,1)\n19  plot(t,y,'*r−',t,a1,'*b−')\n\
    20  axis([−3*pi 3*pi −1.2 1.2])\n21  title('fitting p_{1} to cos(x)')\n22  xlabel('t')\n\
    23  ylabel('cos(t)')\n\n25  subplot(3,2,2)\n26  plot(t,y,'*r−',t,a2,'*b−')\n27\
    \  axis([−3*pi 3*pi −1.2 1.2])\n28  title('fitting p_{2} to cos(x)')\n29  xlabel('t')\n\
    30  ylabel('cos(t)')\n\n32  subplot(3,2,3)\n33  plot(t,y,'*r−',t,a3,'*b−')\n34\
    \  axis([−3*pi 3*pi −1.2 1.2])\n35  title('fitting p_{3} to cos(x)')\n36  xlabel('t')\n\
    37  ylabel('cos(t)')\n\n39  subplot(3,2,4)\n40  plot(t,y,'*r−',t,a4,'*b−')\n41\
    \  axis([−3*pi 3*pi −1.2 1.2])\n42  title('fitting p_{4} to cos(x)')\n43  xlabel('t')\n\
    44  ylabel('cos(t)')\n\n46  subplot(3,2,5)\n47  plot(t,y,'*r−',t,a5,'*b−')\n48\
    \  axis([−3*pi 3*pi −1.2 1.2])\n49  title('fitting p_{5} to cos(x)')\n50  xlabel('t')\n\
    51  ylabel('cos(t)')\n\n53  subplot(3,2,6)\n54  plot(t,y,'*r−',t,a6,'*b−')\n55\
    \  axis([−3*pi 3*pi −1.2 1.2])\n56  title('fitting p_{6} to cos(x)')\n57  xlabel('t')\n\
    58  ylabel('cos(t)')\n```\n**Listing 7-2**  \nThe `CosApprox.m` Program\n\nAs\
    \ you can see from Figure [7-2](#A458923_1_En_7_Chapter.html#Fig2), as higher\
    \ orders of terms are used to describe `cos(x)`, the error reduces by fitting\
    \ with increasing accuracy. For ideal fitting, very large numbers of terms must\
    \ be used to describe the approximated `cos(x)` function. The choice of tolerance\
    \ is user defined. Depending on the tolerance value, a particular number of terms\
    \ can be determined."
  raw: '#### Choosing Tolerance While Calculating cos(x)


    The program `MaclaurinCos.m` in Listing [7-1](#A458923_1_En_7_Chapter.html#Par31)
    shows how error is reduced by many orders of magnitude, as more and more terms
    of the Taylor Series are included for calculating cos(15⁰). See Figure [7-1](#A458923_1_En_7_Chapter.html#Fig1).


    ![A458923_1_En_7_Fig1_HTML.gif](A458923_1_En_7_Fig1_HTML.gif)


    Figure 7-1


    Variation of logarithmic error in the number of terms used to define a Maclaurin
    Series for cos(x)


    ```

    1  %A program to show usage of Taylor Series expansion of cos(x)

    2  %Suppose we wish to calculate cos(15) where argument of cos function is given
    in degrees


    4  x = 15*pi/180; %converts 15 degrees into radian


    6  format long %show results in long format having a lot of decimal places for
    numbers


    8  %Calculating each term of Taylor Series


    10  p1 = 1;

    11  p2 = xˆ(2)/2;

    12  p4 = xˆ(4)/factorial(4);

    13  p6 = xˆ(6)/factorial(6);

    14  p8 = xˆ(8)/factorial(8);

    15  p10 = xˆ(10)/factorial(10);


    17  approx_1= p1−p2; %approximate values using two terms

    18  approx_2= p1−p2+p4; %approximate values using three terms

    19  approx_3= p1−p2+p4−p6; %approximate values using four terms

    20  approx_4= p1−p2+p4−p6+p8; %approximate values using five terms

    21  approx_5= p1−p2+p4−p6+p8−p10; %approximate values using six terms


    23  real_value = cos(x); %calculating the real value to find errors


    25  %calculation of final errors


    27  error_1 = abs(real_value − approx_1);

    28  error_2 = abs(real_value − approx_2);

    29  error_3 = abs(real_value − approx_3);

    30  error_4 = abs(real_value − approx_4);

    31  error_5 = abs(real_value − approx_5);


    33  %making an error vector for plotting


    35  error = [error_1, error_2, error_3, error_4, error_5];


    37  %plotting error versus number of terms


    39  figure(1)

    40  semilogy(error,''*r−'')

    41  title(''Variation of error in calculating cos(15ˆ{0}) using Taylor Series'')

    42  xlabel(''Number of terms on Taylor Series'')

    43  ylabel(''log(error)'')


    45  %plotting cos(x) and its various approximations


    47  t = 0:0.001:20;

    48  %length(t)


    50  figure(2)

    51  y = cos(t);

    52  subplot(2,3,1)

    53  plot(t,y,t,ones(length(t)))

    54  subplot(2,3,2)

    55  plot(t,y,t,(1−t.ˆ2/2))

    56  subplot(2,3,3)

    57  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)))

    58  subplot(2,3,4)

    59  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)−t.ˆ6/factorial(6)))

    60  subplot(2,3,5)

    61  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)−t.ˆ6/factorial(6)+t.ˆ8/

    factorial(8)))

    62  subplot(2,3,6)

    63  plot(t,y,t,(1−t.ˆ2/2+t.ˆ4/factorial(4)−t.ˆ6/factorial(6)+t.ˆ8/

    factorial (8)−t . ˆ 10 / factorial (10)))

    Listing 7-1

    The MaclaurinCos.m Program

    ```


    As seen from Figure [7-1](#A458923_1_En_7_Chapter.html#Fig1), you can now choose
    to insert certain numbers of terms as per the given tolerance for calculating
    cos(x) . To make a judicious decision about the number of terms, you must inspect
    the function in a similar fashion (as was done by `MaclaurinCos.m`). Inserting
    a lot of terms while demanding less accuracy is a waste of time, energy, and resources
    (both human and computational).


    Instead of expanding around one particular point, the series can be defined for
    a set of points. The Octave program called `CosApprox.m` attempts the same, as
    shown in Listing [7-2](#A458923_1_En_7_Chapter.html#Par34). See Figure [7-2](#A458923_1_En_7_Chapter.html#Fig2).


    ![A458923_1_En_7_Fig2_HTML.gif](A458923_1_En_7_Fig2_HTML.gif)


    Figure 7-2


    Fitting of Maclaurin Series with different numbers of terms to cos(x)


    ```

    1  %plotting cos(x) and its various approximations


    3  t = −3*pi:pi/10:3*pi; %defining an array of points for x−axis

    4  l = length(t); %to be used for defining pi

    5  y = cos(t); %real values of cosine function


    7  %defining various terms of Maclaurin Series

    8  a1 = ones(l); %only first term

    9  a2 = (1−t.ˆ2/2); %first and second term

    10  a3 = (a2+t.ˆ4/factorial(4)); %first, second and third term

    11  a4 = (a3−t.ˆ6/factorial(6)); %first, second, third and fourth term

    12  a5 = (a4+t.ˆ8/factorial(8)); %first, second, third, fourth and fifth term

    13  a6 = (a5−t.ˆ10/factorial(10)); %first, second, third, fourth, fifth and sixth
    term


    15  %plotting fitting of cos(x) with increasing number of terms

    16  figure(1)


    18  subplot(3,2,1)

    19  plot(t,y,''*r−'',t,a1,''*b−'')

    20  axis([−3*pi 3*pi −1.2 1.2])

    21  title(''fitting p_{1} to cos(x)'')

    22  xlabel(''t'')

    23  ylabel(''cos(t)'')


    25  subplot(3,2,2)

    26  plot(t,y,''*r−'',t,a2,''*b−'')

    27  axis([−3*pi 3*pi −1.2 1.2])

    28  title(''fitting p_{2} to cos(x)'')

    29  xlabel(''t'')

    30  ylabel(''cos(t)'')


    32  subplot(3,2,3)

    33  plot(t,y,''*r−'',t,a3,''*b−'')

    34  axis([−3*pi 3*pi −1.2 1.2])

    35  title(''fitting p_{3} to cos(x)'')

    36  xlabel(''t'')

    37  ylabel(''cos(t)'')


    39  subplot(3,2,4)

    40  plot(t,y,''*r−'',t,a4,''*b−'')

    41  axis([−3*pi 3*pi −1.2 1.2])

    42  title(''fitting p_{4} to cos(x)'')

    43  xlabel(''t'')

    44  ylabel(''cos(t)'')


    46  subplot(3,2,5)

    47  plot(t,y,''*r−'',t,a5,''*b−'')

    48  axis([−3*pi 3*pi −1.2 1.2])

    49  title(''fitting p_{5} to cos(x)'')

    50  xlabel(''t'')

    51  ylabel(''cos(t)'')


    53  subplot(3,2,6)

    54  plot(t,y,''*r−'',t,a6,''*b−'')

    55  axis([−3*pi 3*pi −1.2 1.2])

    56  title(''fitting p_{6} to cos(x)'')

    57  xlabel(''t'')

    58  ylabel(''cos(t)'')

    Listing 7-2

    The CosApprox.m Program

    ```


    As you can see from Figure [7-2](#A458923_1_En_7_Chapter.html#Fig2), as higher
    orders of terms are used to describe `cos(x)` , the error reduces by fitting with
    increasing accuracy. For ideal fitting, very large numbers of terms must be used
    to describe the approximated `cos(x)` function. The choice of tolerance is user
    defined. Depending on the tolerance value, a particular number of terms can be
    determined.'
