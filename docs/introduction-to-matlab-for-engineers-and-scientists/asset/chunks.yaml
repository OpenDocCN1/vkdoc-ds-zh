- fmt: '### 7.4.2 The Maclaurin Series for `e^x`


    Let’s explore the concept of errors using another example of the Maclaurin Series—for
    `e^x`:


    ![ $$ {e}^a=1+a+\frac{a^2}{2!}+\frac{a^3}{3!}+\frac{a^4}{4!}+\cdots $$ ](A458923_1_En_7_Chapter_Equ8.gif)


    (Equation 7-8)


    For programming purposes, it’s easier to derive an inherent relationship between
    the terms of the Maclaurin Series. The first terms is the number 1, but afterward,
    each term can be obtained by multiplying the previous terms by this equation:


    ![ $$ \frac{a}{n} $$ ](A458923_1_En_7_Chapter_Equ9.gif)


    (Equation 7-9) where `n` represents the `n`-th term. This fact is used in the
    `MaclaurinExp.m` code (see Listing 7-3), where the first term is defined at line
    number 5 in variable `expVal` and then this variable is added to the `currentTerm`
    variable, which is simply calculated using the formula in Equation 7-9.


    ```

    1  %Maclaurin Series for exp(0.1)


    3  n = 5; %Number of terms

    4  a = 0.1; %Functional value of x for eˆ(x)

    5  expVal = 1.0;

    6  currentTerm = 1.0;

    7  for i=1:n

    8    currentTerm = currentTerm*a/i;

    9    expVal = expVal+currentTerm

    10  endfor


    12  trueVal = exp(0.1);

    13  error = abs(trueVal −expVal)

    Listing 7-3

    The MaclaurinExp.m Program

    ```


    The output is displayed as follows:


    ```

    1  >> MaclaurinExp

    2  expVal = 1.1000

    3  expVal = 1.1050

    4  expVal = 1.1052

    5  expVal = 1.1052

    6  expVal = 1.1052

    7  error = 1.4090e −09

    8  >> format long

    9  >> MaclaurinExp

    10  expVal = 1.10000000000000

    11  expVal = 1.10500000000000

    12  expVal = 1.10516666666667

    13  expVal = 1.10517083333333

    14  expVal = 1.10517091666667

    15  error  = 1.40898115397192e−09

    ```


    Notice that while the numeric display is usually set for just four numerical values
    after the decimal point, the `format long` command increases this accuracy (the
    `format short` command returns to the default behavior). Thus, you can clearly
    observe that by increasing the number of terms, the error is reduced drastically
    as it approaches the true value and you will achieve an error of the order `10^(−9)`
    in just five terms.


    If you want to store all the calculated values in the `expVal` variable, you must
    define it as a vector, as shown in Listing 7-4 (the `MaclaurinExp1.m` program).


    ```

    1  %Maclaurin Series for exp(0.1)


    3  n = 5; %Number of terms

    4  a = 0.1; %Functional value of x foreˆ(x)

    5  expVal = 1.0;

    6  currentTerm = 1.0;

    7  for i =1:n

    8    currentTerm = currentTerm*a/i;

    9    expVal(i+1) = expVal(i)+currentTerm;

    10  endfor


    12  trueVal = exp(0.1);

    13  error = abs(trueVal−expVal)

    Listing 7-4

    The MaclaurinExp1.m Program

    ```


    Here, line 9 dictates that the `(i+1)`-th term is modified as per Equation 7-9,
    using the previous term, i.e., the `(i)`-th term. Also notice that printing line
    9 has been suppressed by using the `;` operator. The output is shown as follows:


    ```

    1  >> MaclaurinExp1

    2  error =


    4  1.0517e−01   5.1709e−03   1.7092e−04   4.2514e−06 8.4742e−08   1.4090e−09

    5  >>>plot(error,''r*−'')

    ```


    Using the `plot(error,''r*-'')` command, you can generate graphs where error values
    are plotted (the `''r*-''` argument shows red stars connected with rules). This
    is shown in Figure 7-3.


    ![A458923_1_En_7_Fig3_HTML.gif](A458923_1_En_7_Fig3_HTML.gif)


    Figure 7-3


    Error in calculating `e^(0.1)` with an increasing number of terms


    Since the error drops by orders of magnitude with each new term, the effect can
    be best seen in a logarithmic plot. This can be generated using the `semilogy(error,''r*-'')`
    command. Figure 7-4 will be generated.


    ![A458923_1_En_7_Fig4_HTML.gif](A458923_1_En_7_Fig4_HTML.gif)


    Figure 7-4


    Error in calculating `e^(0.1)` with an increasing number of terms


    It seems that beyond 10 terms, the error flattens out. But you will see that this
    is an erroneous result, as this graph will depend on the least count of your computing
    machine.


    #### How Many Number of Terms?


    You can observe from Figure 7-4 that, by increasing the number of terms, you reduce
    the error by two orders of magnitude when calculating `e^(0.1)`. But does this
    trend mean that to achieve true values, you must include an infinite number of
    terms? After all, each time you add a new term, you invest time and energy into
    the computation. In general, the Maclaurin Series has the accuracy of `a^(n+1)`
    when `n` terms are used:


    ![ $$ {e}^a=1+a+\frac{a^2}{2!}+\frac{a^3}{3!}+\frac{a^4}{4!}+\dots +\frac{a^n}{n!}+O\left({a}^{n+1}\right)
    $$ ](A458923_1_En_7_Chapter_Equ10.gif)


    (Equation 7-10)


    Analytically, you can choose `n` to be any large number, but this cannot be done
    on a computing machine. The reason for this is explored next.


    Figure 7-4 shows one interesting fact that beyond 10 terms, the error no longer
    changes by orders of magnitude and instead just flattens out. This is a misleading
    result. Each computing machine has limits for storing the smallest floating point
    number. This can be obtained by issuing the `eps` command. The system on which
    the program has been run shows the following output.


    ```

    1  >> error(9:12)

    2  ans =


    4  3.10862446895044e−15  4.44089209850063e−16  4.44089209850063e−16  4.44089209850063e−16

    5  >>> eps

    6  ans = 2.22044604925031e−16

    ```


    You can now see that, when error values are very close to `eps` values, they cannot
    be stored reliably anymore. The command `error(9:12)` outputs a similar viewpoint.
    It can be seen that while the ninth term yields an error of the order of `10^(−15)`,
    the eleventh term onward have similar values of the order `10^(−16)`. This is
    done so that the computer avoids crashing the calculation by going beyond its
    limits defined by the `eps` value.


    The `eps` command gives the machine precision. The `help(''eps'')` command shows
    the documentation for the `eps` command and its usage. Technically, `eps` is the
    relative spacing between any two adjacent numbers in the machine’s floating point
    system, i.e., computational machines’ least count. This number is obviously system
    dependent as you can devise specialized hardware where machine precision can be
    enhanced. In fact, this is done when increased precision matters, such as for
    missile guidance, space navigation, etc. On machines that support IEEE floating
    point arithmetic, `eps` is approximately `2.2204 × 10^(−16)` for double precision
    and `1.1921 × 10^(−7)` for single precision.


    It is interesting to note that `2^(-25) ≈ 2.2204 × 10^(-16)`. This essentially
    signifies that the double precision mode of software can store 52 digits after
    the decimal point. You learn more about this in the “Computational Errors” section
    of this chapter, which discusses the machine precision aspect of numerical computations
    and the importance of knowing which precision you need to work on for a particular
    numerical problem.


    The `realmax`, `realmin`, `intmax`, and `intmin` commands show the maximum and
    minimum values of real numbers and integers on the particular machine where the
    software is installed.


    ```

    1  >> realmax

    2  ans = 1.79769313486232e+308

    3  >> intmax

    4  ans = 2147483647

    5  >> realmin

    6  ans = 2.22507385850720e−308

    7  >> intmin

    8  ans = −2147483648

    ```


    It is useful to know these numbers, as the numbers beyond these limits will be
    prone to error because of machine precision.


    ## 7.5 Computational Errors


    Up until now, you have read about the inherent errors that are due to the inclusion
    of a certain number of terms while calculating a mathematical function. There
    is, in fact, another kind of error, which is introduced due to the fact that computers
    can store only numbers of finite lengths.'
  raw: '### 7.4.2 The Maclaurin Series for e ^x


    Let’s explore the concept of errors using another example of the Maclaurin Series—for
    e ^x :


    ![ $$ {e}^a=1+a+\frac{a^2}{2!}+\frac{a^3}{3!}+\frac{a^4}{4!}+\cdots $$ ](A458923_1_En_7_Chapter_Equ8.gif)


    (Equation 7-8)


    For programming purposes, it’s easier to derive an inherent relationship between
    the terms of the Maclaurin Series. The first terms is the number 1, but afterward,
    each term can be obtained by multiplying the previous terms by this equation:


    ![ $$ \frac{a}{n} $$ ](A458923_1_En_7_Chapter_Equ9.gif)


    (Equation 7-9) where n represents the n^(th) term. This fact is used in the `MaclaurinExp.m`
    code (see Listing [7-3](#A458923_1_En_7_Chapter.html#Par38)), where the first
    term is defined at line number 5 in variable `expVal` and then this variable is
    added to the `currentTerm` variable, which is simply calculated using the formula
    in Equation 7-9.


    ```

    1  %Maclaurin Series for exp(0.1)


    3  n = 5; %Number of terms

    4  a = 0.1; %Functional value of x for eˆ(x)

    5  expVal = 1.0;

    6  currentTerm = 1.0;

    7  for i=1:n

    8    currentTerm = currentTerm*a/i;

    9    expVal = expVal+currentTerm

    10  endfor


    12  trueVal = exp(0.1);

    13  error = abs(trueVal −expVal)

    Listing 7-3

    The MaclaurinExp.m Program

    ```


    The output is displayed as follows:


    ```

    1  >> MaclaurinExp

    2  expVal = 1.1000

    3  expVal = 1.1050

    4  expVal = 1.1052

    5  expVal = 1.1052

    6  expVal = 1.1052

    7  error = 1.4090e −09

    8  >> format long

    9  >> MaclaurinExp

    10  expVal = 1.10000000000000

    11  expVal = 1.10500000000000

    12  expVal = 1.10516666666667

    13  expVal = 1.10517083333333

    14  expVal = 1.10517091666667

    15  error  = 1.40898115397192e−09

    ```


    Notice that while the numeric display is usually set for just four numerical values
    after the decimal point, the `format long` command increases this accuracy (the
    `format short` command returns to the default behavior). Thus, you can clearly
    observe that by increasing the number of terms, the error is reduced drastically
    as it approaches the true value and you will achieve an error of the order 10^(−9)
    in just five terms.


    If you want to store all the calculated values in the `expVal` variable, you must
    define it as a vector, as shown in Listing [7-4](#A458923_1_En_7_Chapter.html#Par43)
    (the `MaclaurinExp1.m` program).


    ```

    1  %Maclaurin Series for exp(0.1)


    3  n = 5; %Number of terms

    4  a = 0.1; %Functional value of x foreˆ(x)

    5  expVal = 1.0;

    6  currentTerm = 1.0;

    7  for i =1:n

    8    currentTerm = currentTerm*a/i;

    9    expVal(i+1) = expVal(i)+currentTerm;

    10  endfor


    12  trueVal = exp(0.1);

    13  error = abs(trueVal−expVal)

    Listing 7-4

    The MaclaurinExp1.m Program

    ```


    Here, line 9 dictates that the (i + 1) ^(th) is modified as per Equation 7-9,
    using the previous term , i.e., the (i) ^(th) term. Also notice that printing
    line 9 has been suppressed by using the `;` operator. The output is shown as follows:


    ```

    1  >> MaclaurinExp1

    2  error =


    4  1.0517e−01   5.1709e−03   1.7092e−04   4.2514e−06 8.4742e−08   1.4090e−09

    5  >>>plot(error,''r*−'')

    ```


    Using the `plot(error,''r*-'')`, you can generate graphs where error values are
    plotted (the `r*-` argument shows red stars connected with rules). This is shown
    in Figure [7-3](#A458923_1_En_7_Chapter.html#Fig3).


    ![A458923_1_En_7_Fig3_HTML.gif](A458923_1_En_7_Fig3_HTML.gif)


    Figure 7-3


    Error in calculating e^(0.1) with an increasing number of terms


    Since the error drops by orders of magnitude with each new term, the effect can
    be best seen in a logarithmic plot. This can be generated using the `semilogy(error,''r`
    ^(`*`) `-'')` command. Figure [7-4](#A458923_1_En_7_Chapter.html#Fig4) will be
    generated.


    ![A458923_1_En_7_Fig4_HTML.gif](A458923_1_En_7_Fig4_HTML.gif)


    Figure 7-4


    Error in calculating e^(0.1) with an increasing number of terms


    It seems that beyond 10 terms , the error flattens out. But you will see that
    this is an erroneous result, as this graph will depend on the least count of your
    computing machine.


    #### How Many Number of Terms?


    You can observe from Figure [7-4](#A458923_1_En_7_Chapter.html#Fig4) that, by
    increasing the number of terms, you reduce the error by two orders of magnitude
    when calculating e ^(0.1). But does this trend mean that to achieve true values,
    you must include an infinite number of terms? After all, each time you add a new
    term, you invest time and energy into the computation. In general, the Maclaurin
    Series has the accuracy of a ^(n+1) when n terms are used:


    ![ $$ {e}^a=1+a+\frac{a^2}{2!}+\frac{a^3}{3!}+\frac{a^4}{4!}+\dots +\frac{a^n}{n!}+O\left({a}^{n+1}\right)
    $$ ](A458923_1_En_7_Chapter_Equ10.gif)


    (Equation 7-10)


    Analytically, you can choose n to be any large number, but this cannot be done
    on a computing machine . The reason for this is explored next.


    Figure [7-4](#A458923_1_En_7_Chapter.html#Fig4) shows one interesting fact that
    beyond 10 terms, the error no longer changes by orders of magnitude and instead
    just flattens out. This is a misleading result. Each computing machine has limits
    for storing the smallest floating point number. This can be obtained by issuing
    the `eps` command. The system on which the program has been run shows the following
    output.


    ```

    1  >> error(9:12)

    2  ans =


    4  3.10862446895044e−15  4.44089209850063e−16  4.44089209850063e−16  4.44089209850063e−16

    5  >>> eps

    6  ans = 2.22044604925031e−16

    ```


    You can now see that, when error values are very close to `eps` values, they cannot
    be stored reliably anymore. The command `error(9:12)` outputs a similar viewpoint.
    It can be seen that while the ninth term yields an error of the order of 10^(−15),
    the eleventh term onward have similar values of the order 10^(−16). This is done
    so that the computer avoids crashing the calculation by going beyond its limits
    defined by the `eps` value.


    The `eps` command gives the machine precision. The `help(''eps'')` command shows
    the documentation for the `eps` command and its usage. Technically, `eps` is the
    relative spacing between any two adjacent numbers in the machine’s floating point
    system, i.e., computational machines’ least count. This number is obviously system
    dependent as you can devise specialized hardware where machine precision can be
    enhanced. In fact, this is done when increased precision matters, such as for
    missile guidance, space navigation, etc. On machines that support IEEE floating
    point arithmetic, `eps` is approximately 2.2204 × 10^(−16) for double precision
    and 1.1921 × 10^(−7) for single precision.


    It is interesting to note that ![ $$ {2}^{-25}\approx 2.2204\times {10}^{-16}
    $$ ](A458923_1_En_7_Chapter_IEq4.gif). This essentially signifies that the double
    precision mode of software can store 52 digits after the decimal point. You learn
    more about this in the “Computational Errors” section of this chapter, which discusses
    the machine precision aspect of numerical computations and the importance of knowing
    which precision you need to work on for a particular numerical problem.


    The `realmax`, `realmin`, `intmax`, and `intmin` commands show the maximum and
    minimum values of real numbers and integers on the particular machine where the
    software is installed.


    ```

    1  >> realmax

    2  ans = 1.79769313486232e+308

    3  >> intmax

    4  ans = 2147483647

    5  >> realmin

    6  ans = 2.22507385850720e−308

    7  >> intmin

    8  ans = −2147483648

    ```


    It is useful to know these numbers, as the numbers beyond these limits will be
    prone to error because of machine precision.


    ## 7.5 Computational Errors


    Up until now, you have read about the inherent errors that are due to the inclusion
    of a certain number of terms while calculating a mathematical function. There
    is, in fact, another kind of error, which is introduced due to the fact that computers
    can store only numbers of finite lengths.'
