    16  col =


    18  1

    19  2


    22  v =


    24  1

    25  2

    ```


    #### sort()


    内置函数 `sort()` 可用于按特定顺序对每列的元素进行排序。顺序可以作为函数的第二个参数以字符串形式指定（`ascend` 或 `descend`）。


    ```

    1  >> A = [1,–2,3;4,5,–2;0,–2,3]


    3  A =


    5  1    –2    3

    6  4     5   –2

    7  0    –2    3


    9  >> sort(A)


    11  ans =


    13  0    –2    –2

    14  1    –2     3

    15  4     5     3


    17  >> sort(A,''ascend'')


    19  ans =


    21  0    –2    –2

    22  1    –2     3

    23  4     5     3


    25  >> sort(A,''descend'')


    27  ans =


    29  4    5    3

    30  1   –2    3

    31  0   –2   –2

    ```

