  raw: '### 7.5.1 Significant Digits


    The concept of significant digits plays an important role here. If computers can
    store all the significant digits of the final answer, the errors become irrelevant.
    Otherwise, it is important to identify them and, if possible, rectify them when
    reporting a final answer. For example, while dealing with `pi`, if only three
    significant digits are desired, this can be stored easily on any low-end computing
    solution.


    Computers can store numbers as floating point objects. A floating point object
    stores a number as follows:


    ![ $$ \pm {d}_1{d}_2\dots {d}_s\times {\beta}^e $$ ](A458923_1_En_7_Chapter_Equ11.gif)


    (Equation 7-11)


    Where ![ $$ {d}_i=0,1,2\dots \beta -1 $$ ](A458923_1_En_7_Chapter_IEq5.gif) but
    ![ $$ {d}_1\ne 0 $$ ](A458923_1_En_7_Chapter_IEq6.gif) and ![ $$ m\le e\le M $$
    ](A458923_1_En_7_Chapter_IEq7.gif)where ![ $$ m\in {I}^{-} $$ ](A458923_1_En_7_Chapter_IEq8.gif)
    and ![ $$ M\in {I}^{+} $$ ](A458923_1_En_7_Chapter_IEq9.gif).


    Three parts of a floating point number are:


    *   Sign (±)

    *   Mantissa (d [1] d [2] … d [s] )

    *   Exponent (β)


    In IEEE double precision roundoff, MATLAB uses binary arithmetic where:


    *   ![ $$ \beta =2 $$ ](A458923_1_En_7_Chapter_Eque.gif)


    *   s = 53

    *   m = −1074

    *   M = +1023


    Since humans are used to decimal arithmetic systems, these binary numbers are
    converted to decimal numbers for reporting purposes. It is important to understand
    the key point that all internal calculations are done in binary form but input
    and output for humans are fed in decimal form. The rounding-off error due to conversion
    is given by the unit roundoff, u, which is the maximum relative error while approximating
    a real number as a floating point number.


    MATLAB can handle numbers with absolute values from ![ $$ {2}^{-1074}\simeq {10}^{-324}
    $$ ](A458923_1_En_7_Chapter_IEq10.gif) and ![ $$ {2}^{-1023}\simeq {10}^{308}
    $$ ](A458923_1_En_7_Chapter_IEq11.gif) with a unit roundoff of ![ $$ u={2}^{-53}\simeq
    {10}^{-16} $$ ](A458923_1_En_7_Chapter_IEq12.gif).


    ## 7.6 Challenges in Real Number to Floating Point Number Conversion


    A real number x can be stored in floating point representation given by Equation
    7-11 as:


    ![ $$ x=\pm {d}_1{d}_2\dots {d}_s{d}_{s+1}\dots \times {10}^e $$ ](A458923_1_En_7_Chapter_Equ12.gif)


    (Equation 7-12)


    Now note that s = 53, but the previous description does not restrict representation
    of a floating point number. Its storage is, however, an altogether different game.
    When it is stored, the number is rounded off and stored as per the guidelines,
    i.e., s = 53.


    ### 7.6.1 Overflow


    From Equations 7-11 and 7-12, if e > M, computation is said to have overflowed.
    That means a number bigger than possible has been presented and hence the storage
    container has overflowed. In this case, MATLAB produces `Inf` or `-Inf` as the
    answer, which represents the fact that the answer is a very large number.


    The following exercise, performed in a MATLAB terminal, explains the process clearly.
    `Inf` is displayed as an answer when `e900` is attempted. When this number is
    divided by a negative number, `-Inf` is displayed, signifying an overflow while
    storing a negative number. When `Inf-Inf` is attempted, `NaN` (which stands for
    Not a Number) is displayed, signifying that the large numbers cannot produce a
    result that’s meaningful.


    ```

    1  >> format long

    2  >> exp(50)


    4  ans =


    6  5.184705528587072e+21


    8  >> exp(100)


    10  ans =


    12  2.688117141816136e+43


    14  >> exp(500)


    16  ans =


    18  1.403592217852837e+217


    20  >> exp(700)


    22  ans =


    24  1.014232054735005e+304


    26  >> exp(900)


    28  ans =


    30  Inf


    32  >> exp(900)/−2


    34  ans =


    36  −Inf


    38  >> exp(900)−exp(900)


    40  ans =


    42  NaN

    ```


    ### 7.6.2 Underflow


    If e < m, then underflow is said to have occurred. Octave represents an underflow
    by showing zero and the answer. It would seem that underflow is not serious, but
    consider the fact that, as per basic rules of exponentiation:


    ![ $$ {e}^a{e}^{-a}={e}^{a-a}={e}^0=1 $$ ](A458923_1_En_7_Chapter_Equf.gif)


    When you perform the same calculations for numbers representing overflow and underflow,
    Octave has to perform `Inf X 0`, which results in `NaN`. This is demonstrated
    in the following example:


    ```

    1  >> exp(900)*exp(−900)


    3  ans =


    5  NaN


    7  >> exp(900)


    9  ans =


    11  Inf


    13  >> exp(−900)


    15  ans =


    17  0

    ```


    ## 7.7 Actual Conversions of Real Numbers to Floating Point Numbers


    After look at the two extreme cases, overflow and underflow, you need to understand
    the real number to floating point number conversion process. Recall from Equations
    7-11 and 7-12 that a real number can be stored with s significant digits, as follows:


    ![ $$ \pm {d}_1{d}_2\dots {d}_s\times {\beta}^e $$ ](A458923_1_En_7_Chapter_Equg.gif)


    whereas it can be written in floating point notation (for base 10) as follows:


    ![ $$ x=\pm {d}_1{d}_2\dots {d}_s{d}_{s+1}\dots \times {10}^e $$ ](A458923_1_En_7_Chapter_Equh.gif)


    There are two ways to achieve the conversion: using the method of truncation and
    using the method of rounding off. The method of truncation will simply discard
    all digits after s, i.e., it will produce the following:


    ![ $$ x=\pm {d}_1{d}_2\dots {d}_s\times {10}^e $$ ](A458923_1_En_7_Chapter_Equ13.gif)


    (Equation 7-13)


    On the other hand, the method of rounding off recommends the following process:


    1.  If ![ $$ {s}_{s+1} $$ ](A458923_1_En_7_Chapter_IEq13.gif)< 5, then perform
    truncation and retain the sign of x.  

    2.  If ![ $$ {s}_{s+1} $$ ](A458923_1_En_7_Chapter_IEq14.gif) > 5, then d [s]
    is incremented. Then truncation is performed and retain the sign of x.  


    This seemingly simple scheme has a flaw. Suppose for s = 4, you need to round
    off 2.9345. The answer would be 2.934, i.e., last digit 5 is simply discarded.
    In a similar fashion, when 2.9355 is rounded off, the answer can be written as
    2.936, where the last digit is discarded and the last significant digit is incremented
    . In both cases, only one digit changed. But suppose you need to round off 2.9999\.
    In this case, the answer comes out to be 3.000, where four numeral values changed.


