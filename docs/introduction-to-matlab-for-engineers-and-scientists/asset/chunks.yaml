    \  >> odswrite('a.ods',a)\n    3  ans = 1\n    4  >> ls\n    5  a.ods\n    ```\n\
    \n## 4.5 从互联网读取数据\n\n大多数情况下，您需要访问的大型数据集都保存在某个远程服务器上。使用 `urlread()`，您可以读取远程文件。要将数据保存到本地磁盘，可以使用\
    \ `urlwrite()` 函数。\n\n```\n1  >> a = urlread('http://www.fs.fed.us/land/wfas/fdr_obs.dat');\n\
    2  >> who\n3  Variables in the current scope:\n\n5  a    ans\n\n7  >> whos\n8\
    \  Variables in the current scope:\n\n10  Attr Name        Size              Bytes\
    \     Class\n11  ==== ====        ====              =====     =====\n12  a   \
    \             1x147589          147589    char\n13  ans              1x1     \
    \          8         double\n\n15  Total is 147590 elements using 147597 bytes\n\
    \n17  >> urlwrite('http://www.fs.fed.us/land/wfas/fdr_obs.dat','fire.dat')\n18\
