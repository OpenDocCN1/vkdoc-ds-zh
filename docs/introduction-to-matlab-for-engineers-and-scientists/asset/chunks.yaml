    11  1    –3    –10    24    0


    13  >> A2 = [1,2;3,4]


    15  A2 =


    17  1    2

    18  3    4


    20  >> B2 = poly(A2)


    22  B =


    24  1.0000    –5.0000    –2.0000

    ```


    In the first case, the resultant polynomial (given by `B1`) is `x^4 - 3x^3 - 10x^2
    + 24x`, whereas in the second case (given by `B2`), it''s `x^2 - 5x - 2`. The
    resultant matrix presents the coefficients of the characteristic polynomial.


