    ### 2.11 Solving a System of Equations


    求解一个方程组只需一行代码，使用`\`运算符。假设需要求解以下方程组：


    ![ $$ 2x-2y=4 $$ ](A458923_1_En_2_Chapter_Equ1.gif)


    (Equation 2-1)


    ![ $$ -3x+4y=9 $$ ](A458923_1_En_2_Chapter_Equ2.gif)


    (Equation 2-2)


    你可以在矩阵中定义此问题，如下所示：


    ![ $$ \left[\begin{array}{cc}2& -2\\ {}-3& 4\end{array}\right]\times \left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{l}4\\ {}9\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ3.gif)


    (Equation 2-3)


    假设：


    ![ $$ A=\left[\begin{array}{cc}2& -2\\ {}-3& 4\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ4.gif)


    (Equation 2-4)


    ![ $$ X=\left[\begin{array}{l}x\\ {}y\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ5.gif)


    (Equation 2-5)


    ![ $$ B=\left[\begin{array}{l}4\\ {}9\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ6.gif)


    (Equation 2-6)


    这样，你可以写成：


    ![ $$ A\times X=B $$ ](A458923_1_En_2_Chapter_Equ7.gif)


    (Equation 2-7)


    解由`X = A^(-1)B`给出。你可以计算`A`的逆矩阵（使用`inv()`或`pinv()`函数），然后将结果矩阵与`B`给出的矩阵相乘来求解。或者，你可以仅用一个命令`A\B`完成此任务：


    ```

    1  >> A = [2,–2;–3,4]

    2

    3  A =

    4

    5  2   –2

    6  –3    4

    7

    8  >> B = [4;9]

    9

    10  B =

    11

    12  4   9

    13

    14  >> C = A/B

    15

    16  ans =

    17

    18  17.0000

    19  15.0000

    ```


    因此，解为`x = 17`和`y = 15`。由于`C`矩阵的元素就是解，这通常被称为解矩阵。


    ### 2.12 Eigen Values and Eigen Vectors


    特征值问题是确定方程`Av = λv`的解，其中`A`是一个`n × n`矩阵，`v`是一个长度为`n`的列向量，`λ`是一个标量。满足方程的`λ`值称为特征值。满足方程的对应`v`值称为右特征向量。左特征向量`w`满足方程![
    $$ {w}^{\prime }A=\lambda {w}^{\prime } $$ ](A458923_1_En_2_Chapter_IEq1.gif)。MATLAB函数`eig()`返回特征值和特征向量。它还给出与`W`和`A`相关的对角矩阵`D`（特征值的对角矩阵），关系为![
    $$ {W}^{\prime }A=D{W}^{\prime } $$ ](A458923_1_En_2_Chapter_IEq2.gif)：


    ```

    1  >> A = rand(3,3)

    2

    3  A =

    4

    5  0.6551    0.4984    0.5853

    6  0.1626    0.9597    0.2238

    7  0.1190    0.3404    0.7513

    8

    9  >> [V,D,W] = eig(A)

    10

    11  V =

    12

    13  –0.7284   –0.9532   0.8945

    14  –0.5300   0.2997    –0.4178

    15  –0.4341   0.0411    0.1590

    16

    17

    18  D =

    19

    20  1.3665        0             0

    21  0             0.4732        0

    22  0             0             0.5264

    23

    24

    25  W =

    26

    27  –0.2724    –0.3066    –0.1266

    28  –0.7915    –0.3145    –0.5186

    29  –0.5471    0.8984     0.8456

    ```


    ### 2.13 Structure Arrays


    数组存储相同数据类型的元素，而结构数组可以存储不同数据类型的数据。结构体是按命名字段组织的数据集合。例如，一个字段可能包含文本数据，另一个包含数字，第三个可能是一个数组，等等。单个结构体是一个`1-by-1`的结构体数组。让我们通过一个示例来理解如何创建它们。让我们为这本书创建一个结构体数组，并将该数组命名为`book`。现在，可以使用点运算符添加各种字段，例如`name`、`author`、`pages`和`chapters`。`book`数组是一个`1-by-1`的结构体，包含四个字段。这里演示了这一点。


    ```

    1  >> book.name = ''Introducing MATLAB''

    2

    3  book =

    4

    5  struct with fields:

    6

    7  name:''Introducing MATLAB''

    8

    9  >> book.author = ''Sandeep Nagar''

    10

    11  book =

    12

    13  struct with fields:

    14

    15  name:''Introducing MATLAB''

    16  author:''Sandeep Nagar''

    17

    18  >> book.pages = ''175''

    19

    20  book =

    21

    22  struct with fields:

    23

    24  name:''Introducing MATLAB''

    25  author:''Sandeep Nagar''

    26  pages:''175''

    27

    28  >> book.chapters = [1 2 3 4 5 6 7]

    29

    30  book =

    31

    32  struct with fields:

    33

    34  name:''Introducing MATLAB''

    35  author:''Sandeep Nagar''

    36  pages:''175''

    37  chapters:[1 2 3 4 5 6 7]

    ```


    #### 2.13.1 Defining a New Structure Element Within a Structure Array


    可以使用索引值在现有结构数组（本例中为`book`）中定义一个新的结构元素，方式如下。


    ```

    1  >> book(2).name = ''Introducing SCILAB''

    2

    3  book =

    4

    5  1x2 struct array with fields:

    6

    7  name

    8  author

    9  pages

    10  chapters

    11

    12  >> book(2).author = ''Sandeep Nagar''

    13

    14  book =

    15

    16  1x2 struct array with fields:

    17

    18  name

    19  author

    20  pages

    21  chapters

    22

    23  >> book(2).pages = 175

    24

    25  book =

    26

    27  1x2 struct array with fields:

    28

    29  name

    30  author

    31  pages

    32  chapters

    33

    34  >> book(2).chapters = [1 2 3 4 5 6 7 8 9]

    35

    36  book =

    37

    38  1x2 struct array with fields:

    39

    40  name

    41  author

    42  pages

    43  chapters

    ```


    这样，`book`现在是一个`1×2`的结构体数组。一个结构体数组中的所有结构体都具有相同数量的字段，并且所有字段都具有相同数量的字段名。当在命令提示符下输入结构体数组的名称时，会显示信息和字段的摘要。可以使用`fieldnames()`函数获取包含字段信息的元胞数组。这在以下代码中进行了演示。


    ```

    1  >> book

    2

    3  book =

    4

    5  1x2 struct array with fields:

    6

    7  name

    8  author

    9  pages

    10  chapters

    11

    12  >> fieldnames(book)

    13

    14  ans =

    15

    16  4x1 cell array

    17

    18  ''name''

    19  ''author''

    20  ''pages''

    21  ''chapters''

    ```


    在扩展结构体数组时，不必填写所有字段。未关联值的字段将保留为空。


    #### 2.13.2 Adding and Removing Fields


    可以在任何时候向单个结构体添加新字段。例如，让我们向`book`结构体添加`publisher`字段，如下所示。


    ```

    1  >> book(2).publisher = ''Apress''

