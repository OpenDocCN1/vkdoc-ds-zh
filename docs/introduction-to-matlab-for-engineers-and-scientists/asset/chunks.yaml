- fmt: "### Logarithmic Plots\n\nFor plotting graphs involving logarithmic scale,\
    \ MATLAB provides three options:\n\n- `semilogx()`: Plots with a logarithmically\
    \ spaced x-axis. As an example, consider the code `log1a.m` shown in Listing 3-3,\
    \ which produces the plot shown in Figure 3-8.\n\n![A458923_1_En_3_Fig8_HTML.gif](A458923_1_En_3_Fig8_HTML.gif)\n\
    \n**Figure 3-8** Describing usage of `semilogx()`\n\n```\n1  %MATLAB program to\
    \ illustrate\n2  %usage of semilogx() and\n3  %semilogy() and loglog() command\n\
    \n5  %semilogx()\n6  y = 0:2:50;\n7  x = exp(−y/2);\n8  subplot(3,1,1)\n9  semilogx(x,y)\n\
    10  grid on\n11  xlabel('x=eˆ{y/2}');\n12  ylabel('y');\n13  title('Using semilogx()\
    \ command');\n\n15  %semilogy()\n16  x1 = 0:2:50;\n17  y1 = exp(−x1/2);\n18  subplot\
    \ (3,1,2)\n19  semilogy (x1,y1)\n20  grid on\n21  xlabel('y=eˆ{x/2}');\n22  ylabel('x');\n\
    23  title('Using semilogy() command');\n\n25  %loglog()\n26  x2 = 0:2:50;\n27\
    \  y1 = exp(x2);\n28  y2 = exp(x2/2);\n29  subplot(3,1,3)\n30  loglog(x1,y1)\n\
    31  grid on\n32  xlabel('y1=eˆ{x}');\n33  ylabel('y2=eˆ{x/2}');\n34  title('Using\
    \ loglog() command');\n```\n\n*Listing 3-3: The `log1a.m` Program*\n\n- `semilogy()`:\
    \ Similarly, `semilogy()` plots a logarithmically spaced y-axis.\n- `loglog()`:\
    \ Plots with both axes logarithmically spaced.\n\n### Polar Plots\n\nSometimes\
    \ you’ll prefer to plot in polar coordinates, rather than Cartesian ones. Then,\
    \ instead of `x` and `y`, the coordinates are `r` and `θ`. See Listing 3-4.\n\n\
    ![A458923_1_En_3_Fig9_HTML.gif](A458923_1_En_3_Fig9_HTML.gif)\n\n**Figure 3-9**\
    \ Polar graph\n\n```\n1  theta = 0:0.02:2*pi;\n2  a1 = 0.5+1.3.ˆtheta;\n3  a2\
    \ = 5*cos(theta);\n4  a3 = 3*(1−cos(theta));\n5  a4 = 6*sin(4*theta);\n6  r =\
    \ [a1;a2;a3;a4];\n7  Polar Graph = polar(theta,r,\"*\");\n8  set(Polar Graph,\"\
    LineWidth\",2);\n9  legend(\"spiral\",\"circle\",\"heart\",\"Rose\");\n```\n\n\
    *Listing 3-4: The `CoordinatesPolar.m` Program*\n\nFigure 3-9 shows an example\
    \ of a polar graph for the code given in the `CoordinatesPolar.m` example. Explanation\
    \ of the program follows (according to the line number):\n\n- A variable named\
    \ `theta` representing θ is defined by points starting from 0 to 2π, with steps\
    \ of 0.02 (line 1).\n- A variable named `a1` representing r for spiral is calculated\
    \ using the following equation (line 2).\n\n    ![A458923_1_En_3_Chapter_Equa.gif](A458923_1_En_3_Chapter_Equa.gif)\n\
    \n- A variable named `a2` representing r for circle is calculated using the following\
    \ equation (line 3).\n\n    ![A458923_1_En_3_Chapter_Equb.gif](A458923_1_En_3_Chapter_Equb.gif)\n\
    \n- A variable named `a3` representing r for heart is calculated using the equation\
    \ (line 4).\n\n    ![A458923_1_En_3_Chapter_Equc.gif](A458923_1_En_3_Chapter_Equc.gif)\n\
    \n- A variable named `a4` representing r for rose is calculated using the equation\
    \ (line 5).\n\n    ![A458923_1_En_3_Chapter_Equd.gif](A458923_1_En_3_Chapter_Equd.gif)\n\
    \n- A variable named `r` stores all the r calculated using equations as a column\
    \ vector (line 6).\n- A variable named `PolarGraph` stores the values produced\
    \ by the function `polar()`, which takes θ, r as arguments and `\"*\"` for the\
    \ type of marker (line 7).\n- The `set` function is used to set the property values\
    \ for the graph function. This is a neat way of setting properties of the graph\
    \ and experimenting with them later. In this case, the property named `LineWidth`\
    \ is set to 2 (line 8).\n- The `legend()` function sets four legends in the same\
    \ order that the polar function takes them from vector `r` (line 9).\n\n### The\
    \ `rose()` Function\n\nThe `rose()` function draws an angled histogram, i.e.,\
    \ a polar histogram. The input should be a vector of numbers. Let’s look at the\
    \ usage by constructing a vector of 100 random numbers using `randn(100,1)*pi`\
    \ and then feeding it to the `rose()` function. The resultant plot is shown in\
    \ Figure 3-10.\n\n![A458923_1_En_3_Fig10_HTML.gif](A458923_1_En_3_Fig10_HTML.gif)\n\
    \n**Figure 3-10** Plot of random numbers by the `rose()` function\n\n```\n1  >>\
    \ x = randn(100,1)*pi;\n2  >> rose(x)\n```\n\n### `pie()`\n\nA pie chart can be\
    \ created using the `pie()` function. This provides a very powerful tool to visualize\
    \ the parts of a whole. The usage is explained in the following code and graphs\
    \ are shown in Figure 3-11. This function supports 34 items, which are distributed\
    \ such that `a`, `b`, `c`, `d`, `e`, `f` get `4`, `7`, `2`, `8`, `4` and `9` parts.\
    \ The pie chart can be made by first defining the parts as an array, then defining\
    \ the labels as an array. Then if the `pie()` function is fed directly, you see\
    \ a color coded exploded pie chart showing the percentages of each part. When\
    \ a `show` array is also entered, it explodes only those parts where the value\
    \ of the corresponding element is 1.\n\n![A458923_1_En_3_Fig11_HTML.gif](A458923_1_En_3_Fig11_HTML.gif)\n\
    \n**Figure 3-11** Pie plots with all parts exploded and with some parts exploded\n\
    \n```\n1  >> x = [4,7,2,8,4,9];\n2  >> subplot(2,1,1)\n3  >> pie(x)\n4  >> subplot(2,1,2)\n\
    5  >> show = [1,0,0,1,0,1];\n6  >> pie(x,show,labels)\n7  >>\n```\n\n### `stairs()`\n\
    \nA staircase graph draws a stair-step graph for elements of a vector. Consider\
    \ an example of plotting `y = x^(2.5)`, where `x` is a vector of 100 elements\
    \ from −π to π. As shown in Figure 3-12, the data points are connected in a stair-step\
    \ fashion.\n\n![A458923_1_En_3_Fig12_HTML.gif](A458923_1_En_3_Fig12_HTML.gif)\n\
    \n**Figure 3-12** Stair plot for `y = x^(2.5)`\n\n```\n1  >> x = −pi:pi:100;\n\
    2  >> y = x.ˆ(2.5);\n3  >> stairs(y)\n```\n\n### `stem()`\n\nStem plots draw data\
    \ points as stems that extend from equally spaced values. Sample code for plotting\
    \ `y = cos(x) ϵ (−π, π)` is presented here and it produces the graph shown in\
    \ Figure 3-13.\n\n![A458923_1_En_3_Fig13_HTML.gif](A458923_1_En_3_Fig13_HTML.gif)\n\
    \n**Figure 3-13** Stem plot for `y = cos(x) ϵ (−π, π)`\n\n```\n1  >> x = −2*pi:2*pi;\n\
    2  >> y = cos(x);\n3  >> stem(y)\n```\n\n### 3.1.3 3D Plotting\n\nThere are various\
    \ functions available for 3D plotting in MATLAB. Your choice of function depends\
    \ on the particular problem."
