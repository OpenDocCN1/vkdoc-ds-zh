- fmt: '#### mesh


    考虑使用`mesh`命令，如代码清单[3-5](#A458923_1_En_3_Chapter.html#Par64)所示。该命令生成的图形如图[3-14](#A458923_1_En_3_Chapter.html#Fig14)所示。


    ![A458923_1_En_3_Fig14_HTML.gif](A458923_1_En_3_Fig14_HTML.gif)


    图3-14 3D网格


    ```

    1  a = b = linspace(−8,8,41)'';

    2  [xx,yy] = meshgrid(a,b);

    3  c = sqrt(xx.ˆ2+yy.ˆ2)+eps;

    4  d = sin(c)./c;

    5  mesh(a,b,d);

    Listing 3-5

    The ThreeDMesh.m Program

    ```


    需要注意的是，这段代码使用了一个名为`meshgrid`的新函数。你可以使用`help meshgrid`快速搜索该函数。`meshgrid`的用法如下：


    ```

    1  >> a = b = linspace(−8,8,41);

    2  >> [xx,yy] = meshgrid(a,b);

    ```


    这里创建了两个变量`a`和`b`，它们以行向量的形式存储了从-8到8之间的41个线性间隔数据点。这两个行向量（维度均为1×41）作为参数传递给`meshgrid`函数，该函数产生两个输出：`xx`和`yy`。它们是维度为41×41的矩阵，其中`xx`的行是`a`的副本，`yy`的列是`b`的副本。


    `meshgrid`也可以接受第三个参数，用于构建完整的三维网格。除此之外，在这个二维基础网格上，可以为由`a`和`b`向量的副本定义的数据点定义一个函数。在这个例子中，函数定义如下：


    ![ $$ c=\sqrt{x^2+{y}^2} $$ ](A458923_1_En_3_Chapter_Equ1.gif)


    （公式3-1）和


    ![ $$ d=\frac{\mathit{\sin}(c)}{c} $$ ](A458923_1_En_3_Chapter_Equ2.gif)


    （公式3-2）注意：函数`eps`会产生一个非常小的数字（由机器精度定义的2.2204.10^(-16) [[1](#A458923_1_En_3_Chapter.html#Par101)]）。它在数值计算中被广泛使用，特别是在需要避免零值的情况下，尤其是在除以零的情形中。通过给大数加上一个非常小的数字，我们避免了这个问题（请记住，在第3步中计算的变量`c`随后在第4步中作为分母用于除法运算）。


    现在继续绘图练习，新的数组可以通过应用3D绘图函数`mesh()`来绘制图形，该函数将数组`a`和`d`作为其参数，得到图[3-14](#A458923_1_En_3_Chapter.html#Fig14)。如果使用`mesh(x,y,z)`，则会创建一个由矩形构成的线框网格。矩形的顶点由函数（在本例中为公式3-1和3-2）生成的数据点构成。顶点的（x,
    y）坐标由`xx`和`yy`矩阵给出，因为x坐标来自`xx`矩阵，y坐标来自`yy`矩阵。`z`决定了每个顶点在平面上方的高度。


    通过这种方式，就创建了一个3D图形。需要注意的是，原始的3D“曲线”被解释为由平面矩形构成的曲面，这充其量只是一种近似。在某些情况下，这种误差可以忽略不计。为了减少误差，如果可能的话，可以使矩形更小一些。同一个函数还有其他一些变体，例如`ezmesh`、`meshc`和`meshz`。一个简单的`help`命令对于确定哪个变体最适合特定问题非常有用。网格还会根据高度（z值）编码颜色。这是通过线性缩放z值以适应当前颜色映射的范围来计算的（键入`help
    colormap`了解更多信息）。


    #### meshc


    `meshc()`生成一个3D矩形网格以及底部的等高线图。如图[3-15](#A458923_1_En_3_Chapter.html#Fig15)所示，除了为给定函数生成3D图形外，你还能得到一个等高线图。请注意，这一次，对矩阵进行运算的方程被编写为`meshc()`函数的一个参数，从而使程序更精简。参见代码清单[3-6](#A458923_1_En_3_Chapter.html#Par74)。


    ![A458923_1_En_3_Fig15_HTML.gif](A458923_1_En_3_Fig15_HTML.gif)


    图3-15 使用`meshc()`函数的3D网格


    ```

    1  x=linspace(−10,10,50);

    2  y=linspace(−10,10,50);

    3  [xx,yy]=meshgrid(x,y);

    4  meshc(xx,yy,2−(xx.ˆ2+yy.ˆ2))

    Listing 3-6

    The ThreeDMeshc.m Program

    ```


    #### surf()


    `surf()`生成一个曲面图，其中线框在空白点处被简单地填充，如图[3-16](#A458923_1_En_3_Chapter.html#Fig16)所示。参见代码清单[3-7](#A458923_1_En_3_Chapter.html#Par76)。


    ![A458923_1_En_3_Fig16_HTML.gif](A458923_1_En_3_Fig16_HTML.gif)


    图3-16 使用`surf()`函数的3D网格


    ```

    1  a = b = linspace(−8,8,10)'';

    2  [xx,yy] = meshgrid(a,b);

    3  c = sqrt(xx.ˆ2+yy.ˆ2)+eps;

    4  d = sin(c)./c;

    5  surf(c,d);

    Listing 3-7

    The ThreeDsurf.m Program

    ```


    ## 3.2 总结


    丰富的绘图函数库使MATLAB成为以各种可出版格式绘制数据的合适选择。结合访问系统文件和文件夹的命令，这些图形可以被引导保存到合适的位置，以创建合适的报告。在MATLAB中进行3D绘图并从不同角度查看是相当直观的。因此，MATLAB是一种可视化数据的合适方法。数据和执行速度的限制取决于计算机的存储器和主板上的RAM。


    # 4. 输入与输出


    ## 4.1 简介


    MATLAB的基本数据类型是数组。大多数科学和工程目的数值计算都涉及处理各种文件格式的数据。科学设备和计算机程序本身会以文件形式生成数据。然后这些文件被读取并转换成数组（大多数情况下）。这些数组可以根据矩阵代数的数学要求进行操作。结果会生成一组新的数组。这些数组进一步被转换成文件用于可视化。


    利用第[2](#A458923_1_En_2_Chapter.html)章和第[3](#A458923_1_En_3_Chapter.html)章（数组和绘图）的信息，你现在可以将物理问题转化为数值计算，并在数字计算机上求解。这个过程有一些要求，例如：


    *   数据应为数字格式（数字文件）。

    *   计算机程序应能无误地读取文件并从中创建数组。如果发生错误，应存在检查错误并向用户发出警告的机制。如果可能，还应存在修正错误的机制。

    *   数据应以适当的数据类型存储为数组，并应根据需求以适当的格式显示。

    *   对数据的数组操作将导致涉及在磁盘上读写数据的内存使用。系统应为此提供便利。用户应能在需要时检查内存状态。

    *   后处理任务包括以各种格式显示数据——例如打印机打印、终端显示、终端或打印机/绘图仪上的图形等。

    *   如果特定实验的报告包含输入参数，将处理后的数据和输出以文件或图形的形式呈现，将使用户的任务更简单。


    MATLAB为这些步骤中的每一步都提供了一些特性。本章将简要讨论这些内容。


    ## 4.2 键盘交互输入


    用户通过键盘与MATLAB进行交互。键盘为特定字符生成ASCII或Unicode字符串。这些字符串被输入MATLAB，然后由MATLAB解释以执行特定任务。在编程过程中与MATLAB进行交互式会话时，MATLAB提供了以下几节讨论的函数。'
  raw: '#### mesh


    Consider the `mesh` command shown in Listing [3-5](#A458923_1_En_3_Chapter.html#Par64).
    It produces the graph shown in Figure [3-14](#A458923_1_En_3_Chapter.html#Fig14).


    ![A458923_1_En_3_Fig14_HTML.gif](A458923_1_En_3_Fig14_HTML.gif)


    Figure 3-14


    3D meshing


    ```

    1  a = b = linspace(−8,8,41)'';

    2  [xx,yy] = meshgrid(a,b);

    3  c = sqrt(xx.ˆ2+yy.ˆ2)+eps;

    4  d = sin(c)./c;

    5  mesh(a,b,d);

    Listing 3-5

    The ThreeDMesh.m Program

    ```


    It’s important to note that this code uses a new function named `meshgrid`. Do
    a quick search of it using `help meshgrid`.


    `meshgrid` is used as follows:


    ```

    1  >> a = b = linspace(−8,8,41);

    2  >> [xx,yy] = meshgrid(a,b);

    ```


    Two variables are created, namely `a` and `b`, and they store 41 linearly spaced
    data points between −8 to 8, as a row vector. These two row vectors (both 1×41
    in dimension) are passed as arguments for the function `meshgrid`, which gives
    two outputs: `xx` and `yy`. These are 41×41 dimensioned matrices where rows of
    `xx` are copies of `a` and columns of `yy` are copies of `b`.


    `meshgrid` can also take a third argument whose copes make a complete 3D grid.
    Otherwise on this two-dimensional base grid, a function can be defined for data
    points defined by copies of the `a` and `b` vectors. In this case, the function
    is defined as follows:


    ![ $$ c=\sqrt{x^2+{y}^2} $$ ](A458923_1_En_3_Chapter_Equ1.gif)


    (Equation 3-1) and


    ![ $$ d=\frac{\mathit{\sin}(c)}{c} $$ ](A458923_1_En_3_Chapter_Equ2.gif)


    (Equation 3-2)Note


    unction `eps` produces a very small number (2.2204.10^(−16) defined by machine
    precision [[1](#A458923_1_En_3_Chapter.html#Par101)]. It is widely used in numerical
    computation, where zero needs to be avoided, especially in the case of division
    by zero. By adding a very small number to large numbers, we avoid this problem
    (remember that variable `c` calculated in Step 3 is then used under division as
    a denominator in Step 4).


    Continuing now with the plotting exercise, new arrays can be used to plot by applying
    the 3D plotting function `mesh()`, which takes these two arrays `a` and `d` as
    its arguments, resulting in Figure [3-14](#A458923_1_En_3_Chapter.html#Fig14).
    If `mesh(x,y,z)` is used then a wire-frame mesh made up of rectangles is created.
    The vertices of the rectangles are made of data points generated by the function
    (in this case, Equations 3-1 and 3-2). The (x, y) coordinates of vertices are
    given by the `xx` and `yy` matrices, since the x coordinate comes from the `xx`
    matrix and the y coordinate comes from the `yy` matrix. `z` determines the height
    above the plane of each vertex.


    In this way, a 3D plot is created. It is important to note that the original 3D
    “curve” is interpreted as a surface made of flat rectangles, which is at best
    an approximation. In some cases, this error can be ignored. To get less error,
    the rectangles can be smaller, if possible. There are some other variations of
    the same function, such as `ezmesh`, `meshc`, and `meshz`. A simple `help` command
    can be very useful to determine which one suits a particular problem best. The
    mesh also codes color for height (z-value). This is computed by linearly scaling
    the Z values to fit the range of the current color-map (type `help colormap` to
    learn more).


    #### meshc


    `meshc()` generates a 3D rectangulated mesh as well as a contour at the base.
    As shown in Figure [3-15](#A458923_1_En_3_Chapter.html#Fig15), apart from producing
    a 3D plot for a given function, you also get a contour plot. Note that at this
    time, the equation working on matrices is written as an argument of the `meshc()`
    function , thus making the program even smaller. See Listing [3-6](#A458923_1_En_3_Chapter.html#Par74).


    ![A458923_1_En_3_Fig15_HTML.gif](A458923_1_En_3_Fig15_HTML.gif)


    Figure 3-15


    3D meshing with the meshc() function


    ```

    1  x=linspace(−10,10,50);

    2  y=linspace(−10,10,50);

    3  [xx,yy]=meshgrid(x,y);

    4  meshc(xx,yy,2−(xx.ˆ2+yy.ˆ2))

    Listing 3-6

    The ThreeDMeshc.m Program

    ```


    #### surf()


    `surf()` generates a surface plot where the wire mesh is simply filled up at the
    empty points, as shown in Figure [3-16](#A458923_1_En_3_Chapter.html#Fig16). See
    Listing [3-7](#A458923_1_En_3_Chapter.html#Par76).


    ![A458923_1_En_3_Fig16_HTML.gif](A458923_1_En_3_Fig16_HTML.gif)


    Figure 3-16


    3D meshing with the surf() function


    ```

    1  a = b = linspace(−8,8,10)'';

    2  [xx,yy] = meshgrid(a,b);

    3  c = sqrt(xx.ˆ2+yy.ˆ2)+eps;

    4  d = sin(c)./c;

    5  surf(c,d);

    Listing 3-7

    The ThreeDsurf.m Program

    ```


    ## 3.2 Summary


    A rich library of plotting functions makes MATLAB a suitable choice for plotting
    data in a variety of publication-ready formats. Together with commands to access
    system files and folders, these plots can be directed to be saved at appropriate
    places for creating a suitable report. Plotting in 3D and viewing at different
    angles is quite intuitive in MATLAB. Hence, MATLAB is a suitable method to visualize
    data. The limitations of data and the speed of execution depend on the computer
    storage and RAM on the motherboard.


    # 4. Input and Output


    ## 4.1 Introduction


    The fundamental data type for MATLAB is an array. Most of numerical computations
    for scientific and engineering purposes involve dealing with data in various file
    formats. Scientific devices and computer programs themselves generate data as
    files. These files are then read and converted into arrays (mostly). These arrays
    can be manipulated as per mathematical requirements by the files of matrix algebra.
    The results generate a new set of arrays. These arrays are further converted into
    files for visualization.


    Using the information in Chapters [2](#A458923_1_En_2_Chapter.html) and [3](#A458923_1_En_3_Chapter.html)
    (arrays and plotting), you can now formulate physical problems in terms of numerical
    computations and solve them on a digital computer. This process has some requirements
    such as:


    *   The data should be in a digital form (a digital file).

    *   The computer program should be able to read the file and make arrays from
    it without errors. If errors occur, a mechanism to check those errors and warning
    the user should be in place. If possible, a mechanism for correcting them should
    also be in place.

    *   The data should be stored as an array in the proper data type and should be
    displayed on demand in the proper format.

    *   Array operations on data will result in memory usage in terms of reading and
    writing data on disk. This should be facilitated by the system. Users should be
    able to check the status of memory as and when required.

    *   Post-processing tasks include displaying data in various formats—as a printout
    from a printer, on a terminal, as a graph on a terminal or printer/plotter, etc.

    *   If a report for a particular experiment has input parameters, processing the
    data and output as a file or graph will make the user’s task easier.


    MATLAB has some features for each of these steps. This chapter discusses them
    in brief.


    ## 4.2 Interactive Input from a Keyboard


    A user interacts with MATLAB using a keyboard. Keyboards generate ASCII or Unicode
    strings for specific characters. These are fed into MATLAB, which then interprets
    them to perform a specific task. For an interactive session with MATLAB during
    the course of programming, MATLAB offers the functions discussed in the following
    sections.'
