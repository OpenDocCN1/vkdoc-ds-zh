  trans: "\n### 对数坐标图\n\n在绘制涉及对数刻度的图形时，MATLAB 提供了三种选项：\n\n- `semilogx()`: 绘制 x 轴为对数刻度的图形。例如，请考虑列表\
    \ 3-3 中所示的代码 `log1a.m`，它生成了图 3-8 所示的图形。\n\n![A458923_1_En_3_Fig8_HTML.gif](img/A458923_1_En_3_Fig8_HTML.gif)\n\
    \n**图 3-8** 说明 `semilogx()` 的用法\n\n```\n1  %MATLAB program to illustrate\n2  %usage\
    \ of semilogx() and\n3  %semilogy() and loglog() command\n\n5  %semilogx()\n6\
    \  y = 0:2:50;\n7  x = exp(−y/2);\n8  subplot(3,1,1)\n9  semilogx(x,y)\n10  grid\
    \ on\n11  xlabel('x=eˆ{y/2}');\n12  ylabel('y');\n13  title('Using semilogx()\
    \ command');\n\n15  %semilogy()\n16  x1 = 0:2:50;\n17  y1 = exp(−x1/2);\n18  subplot\
    \ (3,1,2)\n19  semilogy (x1,y1)\n20  grid on\n21  xlabel('y=eˆ{x/2}');\n22  ylabel('x');\n\
    23  title('Using semilogy() command');\n\n25  %loglog()\n26  x2 = 0:2:50;\n27\
    \  y1 = exp(x2);\n28  y2 = exp(x2/2);\n29  subplot(3,1,3)\n30  loglog(x1,y1)\n\
    31  grid on\n32  xlabel('y1=eˆ{x}');\n33  ylabel('y2=eˆ{x/2}');\n34  title('Using\
    \ loglog() command');\n```\n\n*列表 3-3: `log1a.m` 程序*\n\n- `semilogy()`: 类似地，`semilogy()`\
    \ 绘制 y 轴为对数刻度的图形。\n- `loglog()`: 绘制两个轴均为对数刻度的图形。\n\n### 极坐标图\n\n有时您会更倾向于使用极坐标而非笛卡尔坐标绘图。此时，坐标不是\
    \ `x` 和 `y`，而是 `r` 和 `θ`。请参见列表 3-4。\n\n![A458923_1_En_3_Fig9_HTML.gif](img/A458923_1_En_3_Fig9_HTML.gif)\n\
    \n**图 3-9** 极坐标图\n\n```\n1  theta = 0:0.02:2*pi;\n2  a1 = 0.5+1.3.ˆtheta;\n3 \
    \ a2 = 5*cos(theta);\n4  a3 = 3*(1−cos(theta));\n5  a4 = 6*sin(4*theta);\n6  r\
    \ = [a1;a2;a3;a4];\n7  Polar Graph = polar(theta,r,\"*\");\n8  set(Polar Graph,\"\
    LineWidth\",2);\n9  legend(\"spiral\",\"circle\",\"heart\",\"Rose\");\n```\n\n\
    *列表 3-4: `CoordinatesPolar.m` 程序*\n\n图 3-9 展示了针对 `CoordinatesPolar.m` 示例中给出的代码所生成的极坐标图示例。程序说明如下（按行号对应）：\n\
    \n- 一个名为 `theta` 的变量代表 θ，由从 0 到 2π、步长为 0.02 的点定义（第 1 行）。\n- 一个名为 `a1` 的变量代表螺旋线的\
    \ r，通过以下方程计算得到（第 2 行）。\n\n    ![A458923_1_En_3_Chapter_Equa.gif](img/A458923_1_En_3_Chapter_Equa.gif)\n\
    \n- 一个名为 `a2` 的变量代表圆的 r，通过以下方程计算得到（第 3 行）。\n\n    ![A458923_1_En_3_Chapter_Equb.gif](img/A458923_1_En_3_Chapter_Equb.gif)\n\
    \n- 一个名为 `a3` 的变量代表心形的 r，通过以下方程计算得到（第 4 行）。\n\n    ![A458923_1_En_3_Chapter_Equc.gif](img/A458923_1_En_3_Chapter_Equc.gif)\n\
    \n- 一个名为 `a4` 的变量代表玫瑰线的 r，通过以下方程计算得到（第 5 行）。\n\n    ![A458923_1_En_3_Chapter_Equd.gif](img/A458923_1_En_3_Chapter_Equd.gif)\n\
    \n- 一个名为 `r` 的变量将使用方程计算出的所有 r 存储为一个列向量（第 6 行）。\n- 一个名为 `PolarGraph` 的变量存储由函数 `polar()`\
    \ 产生的值，该函数接受 θ、r 作为参数，并以 `\"*\"` 作为标记类型（第 7 行）。\n- `set` 函数用于设置图形函数的属性值。这是一种设置图形属性并在之后进行试验的简洁方法。在此例中，属性\
    \ `LineWidth` 被设置为 2（第 8 行）。\n- `legend()` 函数按照极坐标函数从向量 `r` 中获取图例的相同顺序设置四个图例（第\
    \ 9 行）。\n\n### `rose()` 函数\n\n`rose()` 函数绘制角度直方图，即极性直方图。输入应该是一个数值向量。让我们通过使用 `randn(100,1)*pi`\
    \ 构建一个包含 100 个随机数的向量，然后将其输入到 `rose()` 函数来查看其用法。生成的图形如图 3-10 所示。\n\n![A458923_1_En_3_Fig10_HTML.gif](img/A458923_1_En_3_Fig10_HTML.gif)\n\
    \n**图 3-10** 使用 `rose()` 函数绘制的随机数图\n\n```\n1  >> x = randn(100,1)*pi;\n2  >> rose(x)\n\
    ```\n\n### `pie()`\n\n可以使用 `pie()` 函数创建饼图。这提供了一种非常强大的工具来可视化整体的各个部分。其用法通过以下代码进行说明，图形如图\
    \ 3-11 所示。该函数支持 34 个项目，这些项目按如下方式分布：`a`、`b`、`c`、`d`、`e`、`f` 分别获得 `4`、`7`、`2`、`8`、`4`\
    \ 和 `9` 份。制作饼图时，首先将各部分定义为一个数组，然后将标签定义为一个数组。然后，如果直接输入 `pie()` 函数，您将看到一个彩色编码的分离式饼图，显示每个部分的百分比。当同时输入一个\
    \ `show` 数组时，它将只分离出对应元素值为 1 的那些部分。\n\n![A458923_1_En_3_Fig11_HTML.gif](img/A458923_1_En_3_Fig11_HTML.gif)\n\
    \n**图 3-11** 所有部分都分离以及部分分离的饼图\n\n```\n1  >> x = [4,7,2,8,4,9];\n2  >> subplot(2,1,1)\n\
    3  >> pie(x)\n4  >> subplot(2,1,2)\n5  >> show = [1,0,0,1,0,1];\n6  >> pie(x,show,labels)\n\
    7  >>\n```\n\n### `stairs()`\n\n阶梯图绘制向量元素的阶梯状图形。以绘制 `y = x^(2.5)` 为例，其中 `x` 是一个包含从\
