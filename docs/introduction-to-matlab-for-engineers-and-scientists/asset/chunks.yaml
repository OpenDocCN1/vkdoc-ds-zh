    29  >> area = pi*r.ˆ2


    31  area =


    33  3.1416   12.5664   28.2743


    ```


    ### 4.2.2 `keyboard()`


    The `keyboard` keyword gives control to the user while running a program so that
    user can enter data or additional MATLAB commands, if required. This process can
    be effectively used by the user to check the program. It is called debugging.


    When this is done, the MATLAB prompt changes from `>>>` to `k>`. The keyboard
    mode is terminated by executing the command `dbcont`. `dbquit` can also be used
    to exit keyboard mode, but in this case the invoking MATLAB code file is terminated.
    Control returns to the invoking MATLAB code file.


    A valid MATLAB `expression` must be entered here. This keyword can be used to
    change values of variables in the middle of programs very effectively. Its usage
    is shown in the sample code in Listing [4-1](#A458923_1_En_4_Chapter.html#Par18).


    ```

    1  %program to demonstrate

    2  %usage of keyboard command


    4  x = 10;

    5  y = 12;

    6  keyboard %change value of x here

    7  answer = xˆ2

    Listing 4-1

    The keyboardCommand.m Program

    ```


    When this is executed, you’ll see the following session:


    ```

    1  >> keyboardCommand

    2  K>> x=2.5


    4  x =


    6  2.5000


    8  K>> dbcont


    10  answer =


    12  6.2500


    14  >> x=2.5


    16  x =


    18  2.5000


    20  >> x.ˆ2


    22  ans =


    24  6.2500


    ```


    When the `keyboard` keyword is encountered, the MATLAB session goes into debug
    mode and the user then alters the values of `x=2.5`. Typing `dbcont` continues
    the execution of the program. The answer is calculated as per the new assignment
    of value.


    ### 4.2.3 `menu()`


    A graphical way of inputting values can be performed using the `menu()` command,
    where a title and a set of options are given as inputs (separated by commas).
    This works if the user has a computer terminal with graphics capabilities. Otherwise,
    a list of options is presented at the command prompt. The user is presented with
    a graphical window and can use a mouse or keyboard to select an option. The options
    return a scalar value, which can be stored in a variable. The options are numbered
    internally.


    Let’s look at the usage with an example. Create a menu with the title “Even or
    Odd Numbers” and two options—`Even` and `Odd`. Store this value in the variable
    `I`. When this command is executed, the graphical window shown in Figure [4-1](#A458923_1_En_4_Chapter.html#Fig1)
    appears. The following outputs are possible:


    ![A458923_1_En_4_Fig1_HTML.jpg](A458923_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    The Menu window output


    - If the user closes the window without entering a value, the output is 0.

    - If the user clicks on `Even`, the output is 1.

    - If the user clicks on `Odd`, the output is 2.


    This is shown in the following code:


    ```

    1  >> I = menu(''Even or Odd Numbers'',''Even'',''Odd'')


    3  I =


    5  0


    7  >> I = menu(''Even or Odd numbers'',''Even'',''Odd'')


    9  I =


    11  1


    13  >> I = menu(''Even or Odd numbers'',''Even'',''Odd'')


    15  I =


    17  2


    ```


    - `pause()`: If you want to temporarily halt the program, you can use the `pause()`
    command. Press any key to continue the program execution. To understand its usage,
    consider an example. Suppose you have an 3×3 matrix of random numbers. Then MATLAB
    program `pauseCommand.m` will show its rank, transpose, and size. Each item is
    shown if the user presses a key. See Listing [4-2](#A458923_1_En_4_Chapter.html#Par30).


    ```

    1  %Program to show usage

    2  %of pause command


    4  x = rand(3,3);

    5  r = rank(x);

    6  t = x'';

    7  s = size(x);

    8  disp(''Given matrix is:'')

    9  disp(x)

    10  disp(''To continue checking its rank, press any key'')

    11  pause

    12  disp(''Rank of matrix is:'')

    13  disp(r)

    14  pause

    15  disp(''To continue checking its transpose, press any key'')

    16  pause

    17  disp(''Transpose of matrix is:'')

    18  disp(t)

    19  pause

    20  disp(''To continue checking its size, press any key'')

    21  pause

    22  disp(''Size of matrix is:'')

    23  disp(s)

    24  pause

    Listing 4-2

    The pauseCommand.m Program

    ```


    The output for running `pauseCommand.m` is shown here:


    ```

    1  >> pauseCommand

    2  Given matrix is:

    3  0.8147    0.9134    0.2785

    4  0.9058    0.6324    0.5469

    5  0.1270    0.0975    0.9575


    7  To continue checking its rank, press any key

    8  Rank of matrix is:

    9  3


    11  To continue checking its transpose, press any key

    12  Transpose of matrix is:

    13  0.8147    0.9058    0.1270

    14  0.9134    0.6324    0.0975

    15  0.2785    0.5469    0.9575


    17  To continue checking its size, press any key

    18  Size of matrix is:

    19  3     3


    ```


    ## 4.3 File Path


    A MATLAB session starts from a default folder, which depends on the installation
    of a particular operating system. Usually a dedicated folder is created at the
    time of installation and it is generally named `MATLAB` by default. This folder’s
    path can be viewed by typing `pwd` at the command prompt.


    ```

    1   >> pwd


    3   ans =


    5   ''/Users/.../MATLAB''

    ```


    Note that the path may be different on your computer and the three dots are used
    to represent a generalized representation of the path.


    When you want to run a MATLAB’s `.m` file, the file is searched first in the default
    folder. If it is not there, you must change the working directory to the one where
    the file is stored. This can be initiated by typing `pathtool` at MATLAB’s command
    prompt (see Figure [4-2](#A458923_1_En_4_Chapter.html#Fig2)).


    ![A458923_1_En_4_Fig2_HTML.jpg](A458923_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Setting the path of working directory using the `pathtool` command


    You can simply add the directory to the list of directories for the session or
    save it. You can also choose to set the directory as the default for future MATLAB
    sessions. This is a good option if you will be working on a project for a long
    time and are sure that the directory will be used on a daily basis. It is strongly
    suggested that you keep all the files in either the default directory of the installed
    MATLAB program or make your working directory the default one.'
