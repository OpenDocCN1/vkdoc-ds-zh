    ### 2.11 求解方程组


    求解一个方程组只需一行代码，使用`\`运算符。假设需要求解以下方程组：


    ![ $$ 2x-2y=4 $$ ](img/A458923_1_En_2_Chapter_Equ1.gif)


    (Equation 2-1)


    ![ $$ -3x+4y=9 $$ ](img/A458923_1_En_2_Chapter_Equ2.gif)


    (Equation 2-2)


    你可以在矩阵中定义此问题，如下所示：


    ![ $$ \left[\begin{array}{cc}2& -2\\ {}-3& 4\end{array}\right]\times \left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{l}4\\ {}9\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ3.gif)


    (Equation 2-3)


    假设：


    ![ $$ A=\left[\begin{array}{cc}2& -2\\ {}-3& 4\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ4.gif)


    (Equation 2-4)


    ![ $$ X=\left[\begin{array}{l}x\\ {}y\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ5.gif)


    (Equation 2-5)


    ![ $$ B=\left[\begin{array}{l}4\\ {}9\end{array}\right] $$ ](A458923_1_En_2_Chapter_Equ6.gif)


    (Equation 2-6)


    这样，你可以写成：


    ![ $$ A\times X=B $$ ](img/A458923_1_En_2_Chapter_Equ7.gif)


    (Equation 2-7)


    解由`X = A^(-1)B`给出。你可以计算`A`的逆矩阵（使用`inv()`或`pinv()`函数），然后将结果矩阵与`B`给出的矩阵相乘来求解。或者，你可以仅用一个命令`A\B`完成此任务：


    ```

    1  >> A = [2,–2;–3,4]

    2

    3  A =

    4

    5  2   –2

    6  –3    4

    7

    8  >> B = [4;9]

    9

    10  B =

    11

    12  4   9

    13

    14  >> C = A/B

    15

    16  ans =

    17

    18  17.0000

    19  15.0000

    ```


    因此，解为`x = 17`和`y = 15`。由于`C`矩阵的元素就是解，这通常被称为解矩阵。


    ### 2.12 特征值与特征向量


    特征值问题是确定方程`Av = λv`的解，其中`A`是一个`n × n`矩阵，`v`是一个长度为`n`的列向量，`λ`是一个标量。满足方程的`λ`值称为特征值。满足方程的对应`v`值称为右特征向量。左特征向量`w`满足方程![
    $$ {w}^{\prime }A=\lambda {w}^{\prime } $$ ](img/A458923_1_En_2_Chapter_IEq1.gif)。MATLAB
    函数`eig()`返回特征值和特征向量。它还给出与`W`和`A`相关的对角矩阵`D`（特征值的对角矩阵），关系为![ $$ {W}^{\prime }A=D{W}^{\prime
    } $$ ](img/A458923_1_En_2_Chapter_IEq2.gif)：


    ```

    1  >> A = rand(3,3)

    2

    3  A =

    4

    5  0.6551    0.4984    0.5853

    6  0.1626    0.9597    0.2238

    7  0.1190    0.3404    0.7513

    8

    9  >> [V,D,W] = eig(A)

    10

    11  V =

    12

    13  –0.7284   –0.9532   0.8945

    14  –0.5300   0.2997    –0.4178

    15  –0.4341   0.0411    0.1590

    16

    17

    18  D =

    19

    20  1.3665        0             0

    21  0             0.4732        0

    22  0             0             0.5264

    23

    24

