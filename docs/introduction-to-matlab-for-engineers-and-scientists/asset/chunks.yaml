    \ Arrays from Other Arrays\n\nMulti-dimensional arrays can be created from other\
    \ multi-dimensional arrays too, as explained here:\n\n```\n>> a = [1,2,3;4,5,6]\n\
    \na =\n     1     2     3\n     4     5     6\n\n>> B = [(1:3);(4:6);(7:9)]\n\n\
    B =\n     1     2     3\n     4     5     6\n     7     8     9\n\n>> c = [a;B]\n\
    \nc =\n     1     2     3\n     4     5     6\n     1     2     3\n     4    \
    \ 5     6\n     7     8     9\n\n>> c = [a,B]\nError using horzcat\nDimensions\
    \ of matrices being concatenated are not\nconsistent.\n```\n\nHere, the matrix\
    \ `a` has elements `1`, `2`, `3` in the first row. Then a row separator (`;`)\
