  trans: "\n# 4.4 文件操作\n\n文件操作是计算中的一个重要组成部分。需要注意的是，文件系统依赖于操作系统 (OS)。与大多数科学程序类似，MATLAB\
    \ 适用于类 UNIX 系统，因此它能在基于 Linux 的系统和 MacOS X 上使用相同的命令良好运行。在 Windows 系统中，你在 MATLAB\
    \ 环境中处理文件时，使用与 Linux 版本相同的命令。本书中的代码示例是在 Windows 8、MacOSX 10.10 和 Ubuntu 14.04\
    \ 系统上编写和测试的。\n\n## 4.4.1 用户\n\n计算系统由不同的用户访问。每个用户都定义一个工作空间，以避免损坏彼此的工作。登录后，用户的工作空间对该用户激活。工作空间由各种文件和文件夹组成。有些文件对于操作系统定义工作空间及其属性是必需的，因此不应更改。这是通过向不同用户授予权限来确保的。\n\
    \n读取和写入文件受到权限的限制。管理员（通常被称为`admin`）也被称为超级用户，拥有编辑任何文件/文件夹的所有特权和权限。你必须了解计算机系统定义的用户类型，然后相应地执行这些命令。如果你没有被授权访问某些文件夹，而你需要输入的数据又存放在这些文件/文件夹中，你总会收到一个错误（除非管理员更改了你的权限）。\n\
    \n## 4.4.2 文件路径\n\n目录/文件夹可以包含子目录/子文件夹和文件。如果此过程不受管理员限制，则可以达到任意层级。\n\n`pwd` 命令代表“打印工作目录”。在\
    \ MATLAB 终端中，输入 `pwd` 会显示当前工作目录的路径，如下例所示：\n\n```\n1  >> pwd\n2  ans = /home/sandeep\n\
    ```\n\n用户的 `/home` 目录包含另一个名为 `/sandeep` 的目录。这是当前的工作空间。当在终端中输入 `pwd` 时，一个名为 `ans`\
    \ 的变量会存储此数据（文件路径）。你可以分配一个自己选择的变量名来将文件名存储为字符串。\n\n通过在终端输入文件路径来访问文件/文件夹。通过这个简短练习来理解此过程。要创建新目录，你可以像下面这样使用\
    \ `mkdir name`：\n\n```\n1  >> mkdir matlab−practice\n2  ans = 1\n3  >> ls\n4 \
    \ Downloads                           Music\n5  R\n6  Templates\n7  matplab−practice\n\
    8  Videos\n9  Desktop                             software\n10  Work\n11  Documents\
    \                           Library\n12  Pictures\n13  >> cd matplab−practice\n\
    14  >>\n```\n\n在第 1 行，`mkdir matplab-practice` 创建了一个名为 `matplab-practice` 的目录。要查看当前目录的内容，你可以使用\
    \ `ls` 命令，正如第 3 行所示，它代表“列表”（list）。要切换目录，你可以像第 13 行展示的那样使用 `cd file path` 命令。我建议你在此目录中完成本书的其余部分。\n\
    \n## 4.4.3 创建和保存文件\n\n`save` 和 `load` 命令允许你向内存写入和读取数据。\n\n```\n1  >> matrix =\
    \ rand(3,3);\n2  >> save MyFirstFile.mat matrix\n3  >> ls\n4  MyFirstFile.mat\n\
    5  >> load MyFirstFile.mat\n6  >> matrix\n7  matrix =\n\n9  0.467414     0.610273\
    \     0.429941\n10  0.568490     0.037898     0.734682\n11  0.547370     0.275421\
    \     0.539650\n\n13  >>\n```\n\n在第 1 行，首先创建了一个名为 `matrix` 的变量，它存储了一个 3×3 的随机值矩阵。在第\
    \ 2 行，此数据被存储为一个名为 `MyFirstFile.mat` 的 `.mat` 文件，并将该变量名作为参数传递。需要时，可以使用 `load MyFirstFile.mat`\
    \ 命令将此文件加载到工作空间中，然后调用名为 `matrix` 的变量。保存文件时记录的随机数被加载为 3×3 矩阵的数据。请注意，此数据不一定是数字。它可以是数字计算机能够处理的任何内容，包括图片、视频、字符串和字符等等。\n\
    \n通过在保存时传递变量名，可以将多个变量存储在同一文件中。\n\n```\n1  >> matrix1 = rand(4,4);\n2  >> matrix2\
    \ = rand(2,3);\n3  >> matrix3 = rand(2,2);\n4  >> save(\"SavingMultipleVariables.mat\"\
    ,\"matrix1\",\"matrix2\",\"matrix3\")\n5  >> load SavingMultipleVariables.mat\n\
    6  >> matrix1\n7  matrix1 =\n\n9     0.8598130     0.0118250     0.9803720   \
    \  0.3044413\n10     0.6676748     0.0056845     0.1101545     0.2183920\n11 \
    \    0.2547204     0.8192626     0.8056112     0.6961116\n12     0.7924558   \
    \  0.9130480     0.1976146     0.4635055\n\n14  >> matrix2\n15  matrix2 =\n\n\
    17     0.35215    0.55770    0.66650\n18     0.98515    0.98677    0.45513\n\n\
    20  >> matrix3\n21  matrix3 =\n\n23     0.097693    0.540354\n24     0.923853\
    \    0.329501\n\n26  >>>> save −binary SavedAsBinary m*\n27  >> ls\n28  MyFirstFile.mat\
    \  SavedAsBinary  SavingMultipleVariables.mat\n```\n\n`help save` 和 `help load`\
    \ 命令提供了关于使用 `save` 和 `load` 的非常有用的说明。使用这些选项，你可以将文件保存为特定格式。例如，在第 26 行，所有以 `m` 开头的变量名都被保存为二进制数据，存放在一个名为\
    \ `SavedAsBinary` 的二进制文件中。当基于 MATLAB 的数值计算生成的数据要在其他软件程序中使用时，这一点尤为重要。你还可以使用选项指定保存数据的精度。你也可以使用\
    \ `-zip` 命令压缩大文件。当 MATLAB 生成的数据体积庞大且需要传输时，这非常有用。\n\n`load` 函数遵循与 `save` 函数相同的逻辑。数据可以从特定格式的文件中解压并加载为一个数组。这样填充的数组可用于计算，如果需要，可以使用\
    \ `save` 函数再次生成结果文件。复杂的计算需要连续多次重复此过程，因此这些函数已被优化，以便在短时间内定位和加载所需数据。\n\n可以使用 `dlmread()`\
    \ 和 `dlmwrite()` 读取和写入带分隔符的数值数据文件（由分隔符分隔的数值数据）。这些函数生成 ASCII 分隔文件。为了说明这一点，以下 MATLAB\
    \ 代码执行以下任务：\n\n*   将一个 3×3 矩阵存储在变量 `A` 中。\n*   使用 `dlmwrite()` 函数，写入一个名为 `randomNumbers.txt`\
    \ 的文件，该文件从存储在 `A` 中的矩阵获取输入。\n    *   分隔符定义为 `;`\n    *   你可以在工作目录中检查该文件，并使用合适的文本编辑器或电子表格软件打开它。\n\
    *   初始化一个新变量 `B` 为空矩阵。\n*   使用 `dlmread()` 函数读取此文件。定义创建文件时使用的分隔符非常重要。结果存储在 `B`\
    \ 中，并且发现与 `A` 完全相同。\n\n```\n1  >> A = randn(3,3)\n\n3  A =\n\n5   0.3252   −1.7115\
    \      0.3192\n6  −0.7549   −0.1022      0.3129\n7   1.3703   −0.2414     −0.8649\n\
    \n9  >> dlmwrite('randomNumbers.txt',A,';')\n10  >> B = []\n11  >> B = dlmread('randomNumbers.txt',';')\n\
    \n13  B =\n\n15   0.3252    −1.7115     0.3192\n16  −0.7549    −0.1022     0.3129\n\
    17   1.3703    −0.2414    −0.8649\n```\n\n## 4.4.4 使用 Diary 和 History 命令\n\n可以通过使用\
    \ `diary` 命令将 MATLAB 会话记录到文件中。输入 `help diary` 了解其使用信息。写入 `help filename` 可以将会话记录到具有给定文件名的文件中。此功能会持续更新命令及其输出。\n\
    \n你可以使用 `history` 命令来显示已执行命令的列表。有各种选项可用于查看特定格式的历史记录。\n"
- fmt: "### 4.4.5 Opening and Closing Files\n\nTo read and write data files, they\
    \ must be opened and defined as readable and/or writable. The`fopen` function\
    \ returns a pointer to an open file that is ready to be read or written to. This\
    \ is defined by the following options: `r` as readable, `w` as writable, `r+`\
    \ as readable and writable, `a` for appending (i.e., writing new content at the\
    \ end of the file), and `a+` for reading, writing, and appending. The opening\
    \ mode can be set to `t` for text mode or `b` for binary mode. `z` enables opening\
    \ a gzipped file for reading and writing.\n\nOnce all the data has been read from\
    \ or written to, the opened file should be closed. The`fclose` function does this.\n\
    \n```\n1  MyFile = fopen(\"a.dat\",\"r\");\n```\n\nA variable`MyFile` is created\
    \ which is used to store the contents of the file `a.dat`. This file is opened\
    \ in reading mode only in the sense that it cannot be edited. This is important\
    \ if the author of the file wants the information to remain unchanged while sharing\
    \ it. This might be necessary for files containing constants or important pieces\
    \ of code that should not be changed.\n\nThe`freport()` command prints a list\
    \ of opened files and whether they are opened for reading, writing, or both. For\
    \ example:\n\n```\n1  >> freport\n\n3  number    mode    arch         name\n4\
    \  −−−−−   −−−−   −−−−       −−−−\n5  0         r       ieee−le     stdin\n6 \
    \ 1         w       ieee−le     stdout\n7  2         w       ieee−le     stderr\n\
    \n9  >>\n```\n\n### 4.4.6 Reading and Writing Binary Files\n\nA binary file is\
    \ computer readable file. They are simply sequence of bytes. They are the same\
    \ as the C functions`fread` and `fwrite`, which can read and write binary data\
    \ from a file.\n\n#### The csvread and csvwrite Functions\n\nThe`csvread` and\
    \ `csvwrite` functions are used to read data from `.csv` files, which stands for\
    \ comma separated values. Suppose the following data needs to be stored as a `.csv`\
    \ file.\n\n```\n1   2   3   4\n5   6   7   8\n8   7   6   5\n4   3   2   1\n```\n\
    \nThe following code creates an array using`csvwrite` to create a file named `csvTestData.dat`\
    \ containing the matrix values. You can check this by simply opening this newly\
    \ created file in a text editor. At line 3, a new file named `csvTestData1.dat`\
    \ is created with an offset defined at row 1 and column 2.\n\n```\n1  >> a = [1,2,3,4;5,6,7,8;8,7,6,5;4,3,2,1];\n\
    2  >> a\n3  a =\n\n5  1   2   3   4\n6  5   6   7   8\n7  8   7   6   5\n8  4\
    \   3   2   1\n9  >> csvwrite('csvTestData.dat',a)\n10  >> csvwrite('csvTestData1.dat',a,1,2)\n\
    11  >> a1 = csvread('csvTestData.dat')\n12  a 1 =\n\n14  1   2   3   4\n15  5\
    \   6   7   8\n16  8   7   6   5\n17  4   3   2   1\n\n19  >> a1 = csvread('csvTestData.dat',1,2)\n\
    20  a1 =\n\n22  7   8\n23  6   5\n24  2   1\n\n26  >>\n```\n\nNow the`csvread`\
    \ function can be used to create matrices with desired offsets just as the `csvwrite`\
    \ function.\n\n**Note**\n\nA number of other functions to read and write files\
    \ exist, but the present section focuses on some of the most commonly used ones.\
    \ You can access the documentation to learn about using these specialized functions,\
    \ if required.\n\n### 4.4.7 Working with Excel Files\n\nA lot of data is presented\
    \ on the Internet in the form of Excel files. Note that one must be connected\
    \ to the Internet in this case.\n\nThe`xlsopen`, `xlswrite`, `xlsclose`, `odsopen`,\
    \ `odswrite`, and `odsclose` commands open, write, and close`.xls` and `.ods`\
    \ files, respectively. While `.xls` files are generated using Microsoft Excel,\
    \ `.ods` files are generated using Open/Libre Office software, which is the open\
    \ source equivalent of Microsoft Excel. The process of opening, reading, and writing\
    \ data is as follows:\n\n*   `xlsopen('Filename.xls')`\n*   `a = xlsread ('Filename.xls',\
    \ '3rd_sheet', 'B3:AA10');` Numeric data from the `Filename.xls` worksheet named\
    \ `3rd sheet` will be read from cell B3 to AA10. This data is stored as an array\
    \ named `a`.\n*   `[Array, Text, Raw, limits] = xlsread ('a.xls', 'hello');` The\
    \ file `a.xls` is read from the worksheet named `hello`, and the whole numeric\
    \ data is fed into an array named `Array`. The text data is fed into array named\
    \ `Text`, the raw cell data into cell array named `Raw`, and the ranges where\
    \ the actual data came in is saved in `limits`.\n*   `xlswrite('new.xls',a)` writes\
    \ the data in an array named `a` into an `.xls` formatted Excel sheet named `new.xls`.\n\
    *   `xlsclose`\n\n    ```\n    1  >> a = rand(10,10);\n    2  >> odswrite('a.ods',a)\n\
    \    3  ans = 1\n    4  >> ls\n    5  a.ods\n    ```\n\n## 4.5 Reading Data from\
    \ the Internet\n\nMost often, large data sets that you need to access are kept\
    \ on some remote server. Using`urlread()`, you can read a remote file. To save\
    \ data to the local disk, you use the `urlwrite()` functions.\n\n```\n1  >> a\
    \ = urlread('http://www.fs.fed.us/land/wfas/fdr_obs.dat');\n2  >> who\n3  Variables\
    \ in the current scope:\n\n5  a    ans\n\n7  >> whos\n8  Variables in the current\
    \ scope:\n\n10  Attr Name        Size              Bytes     Class\n11  ==== ====\
    \        ====              =====     =====\n12  a                1x147589    \
    \      147589    char\n13  ans              1x1               8         double\n\
    \n15  Total is 147590 elements using 147597 bytes\n\n17  >> urlwrite('http://www.fs.fed.us/land/wfas/fdr_obs.dat','fire.dat')\n\
    18  >> ls\n19  fire.dat\n20  >>\n```\n\nHere, a variable named`a` stores the data\
    \ from the data file stored at `http://www.fs.fed.us/land/wfas/fdr_obs.dat`. Alternatively,\
    \ the whole data is stored as a file named `a.dat` using the function `urlwrite(URL)`.\n\
    \n## 4.6 Printing and Saving Plots\n\nSome commands, like`print` and `saveas`,\
    \ exist to save graphs/figures generated by MATLAB programs, to be saved in desired\
    \ formats. They are discussed in the following sections.\n\n### 4.6.1 The print\
    \ Command\n\nThe`print` command prints jobs, including printing using a printer\
    \ and/or plotter, printing to a file, etc. This command is very useful if you\
    \ need to save a figure automatically by a desired filename in a specified format.\n\
    \n```\n1  %Saving in svg format\n2  figure(1);\n3  clf();\n4  peaks();\n5  print\
    \ −dsvg figure1.svg\n\n7  %Saving in png format\n8  figure(1);\n9  clf();\n10\
    \  sombrero();\n11  print −dpng figure2.png\n\n13  %Printing to a HP DeskJet 550C\n\
    14  clf();\n15  sombrero();\n16  print −dcdj550\n```\n\nThe`clf` function clears\
    \ the current graphic window. A lot of other options for saving in different formats\
    \ exist for the `print` command. To learn more, type `help print` into the MATLAB\
    \ terminal.\n\n### 4.6.2 The saveas Function\n\nThe`saveas` function saves a graphic\
    \ object in a desired format, as follows:\n\n```\n1  clf();\n2  a = sombrero();\n\
    3  saveas (a,\"figure3.png\");\n```\n\nThe`orient(a,orientation)` function defines\
    \ the orientation of an graphical object `a`. The valid values for the `orientation`\
    \ parameters are `portrait`, `landscape`, and `tall`. The `landscape` option changes\
    \ the orientation so the plot width is larger than the plot height. The `tall`\
    \ option sets the orientation to `portrait` and fills the page with the plot,\
    \ while leaving a 0.25 inch border. The `portrait` option (default) changes the\
    \ orientation so the plot height is larger than the plot width."
