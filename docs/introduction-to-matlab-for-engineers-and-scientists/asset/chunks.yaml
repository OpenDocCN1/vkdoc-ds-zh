    ### 5.3.1 `function` 函数


    `function` 的定义遵循以下语法：


    ```

    1  function [返回值 1, 返回值 2, ...] = 函数名([参数 1, 参数 2,...])

    2  函数体

    3  endfunction

    ```


    在这里，`function` 关键字将对象类型定义为函数。然后，定义一组该函数预期返回的变量。接下来是 `=` 运算符，然后是函数的名称。在这个例子中，它被命名为
    `name`。`name` 对象接受一组参数，这些参数是函数所定义的对象。接着是函数的主体部分。最后一部分定义了函数的结束。例如，可以编写一个函数来计算 x²
    − y²，并将结果赋值给名为 `z` 的变量，如下所示：


    ```

    1  function y = fn1(x,y)

    2  y = xˆ2−yˆ2;

    3  end

    ```


    将其保存为当前工作目录下的 `fn1.m` 文件。现在转到 MATLAB 终端并输入以下内容：


    ```

    1  >> fn1(5,1)

    2  ans = 24

    3  >> fn1(5,2)

    4  ans = 21

    5  >> fn1(5,3)

    6  ans = 16

    7  >> fn1(5,4)

    8  ans = 9

    9  >> fn1(5,5)

    10  ans = 0

    ```


    可以看到，名为 `fn1` 的函数正在对其定义的两个输入参数执行 x² − y² 的计算。


    将程序定义为一组函数文件，然后在存储为脚本文件的主程序中调用它们，是一种良好的实践。这种模块化方法使得尝试不同的思路变得容易，同时也使代码的调试和测试更加简便。一个函数也可以返回两个以上的值。例如：


    ```

    1  function[y1,y2,y3] = fn2(x,y)

    2  y1 = xˆ2−yˆ2;

    3  y2 = xˆ2+yˆ2;

    4  y3 = y2−y1;

    5  end

    ```


    这将得到以下结果：


    ```

    1  >> [a,b,c] = fn2(5,2)

    2  a = 21

    3  b = 29

    4  c = 8

    5  >> [a,b,c] = fn2(5,0)

    6  a = 25

    7  b = 25

    8  c = 0

    ```


    函数可以包含循环来管理程序中的重复任务。例如，可以使用下面给出的函数来计算一个数的阶乘：


    ```

    1  function result = factorial(n)

    2    if(n == 0)

    3      result = 1;

    4      return;

    5    else

    6      result = prod(1:n);

    7    endif

    8  endfunction

    ```


    一个名为 `factorial` 的函数，它接受一个数字 `n` 作为参数，计算该数字与所有连续数字的乘积。当从 MATLAB 命令行调用时，该函数产生以下结果：


    ```

    1  >> factorial(50)

    2  ans = 3.0414e+064

    3  >> factorial(1)

    4  ans = 1

    5  >> factorial(0)

    6  ans = 1

    7  >> factorial(100)

    8  ans = 9.3326e+157

    9  >> factorial(1000)

    10  ans = NaN

    11  >> factorial(−1)

    12  error:factorial:N must all be non−negative integers

    ```


    `help NaN` 和 `help prod` 提供了关于这些命令行为的有用见解。


    ### 5.3.2 `inline` 函数


    函数也可以使用 `inline` 关键字进行内联定义，如下所示：


    ```

    1  >> f = inline("xˆ2+y");

    2  >> f(1,2)

    3  ans = 3

    4  >> f(10,10)

    5  ans = 110

    6  >> f(0,2)

    7  ans = 2

    8  >>

    ```


    第 1 行定义了一个名为 `f` 的函数，包含两个变量 `x` 和 `y`，用于计算 f(x, y) = x² + y。当使用这两个变量的值调用时，该函数会输出计算出的值。


    ### 5.3.3 匿名函数


    匿名函数是在程序中定义的未命名函数对象。它们的定义遵循简单的语法：


    ```

    @(参数列表) 表达式

    ```


    例如：


    ```

    1  >> a = @(x) sin(x)*cos(x);

    2  >> quad(a,0,1)

    3  ans = 0.35404

    4  >> quad(a,0,pi)

    5  ans = 7.3031e−017

    6  >> quad(a,−pi,pi)

    7  ans = 0

    8  >> quad(a,−pi,2*pi)

    9  ans = −2.8435e−016

    10  >> quad(a,−2*pi,2*pi)

    11  ans = 0

    ```


    `help quad` 告诉我们，函数 `quad` 用于计算一个函数在两个值之间的积分。因此，第 1 行定义了一个函数 sin(x)cos(x)，其积分结果如下所示。


    ![ $$ {\displaystyle \begin{array}{l}\underset{0}{\overset{1}{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0.35404\\
    {}\underset{0}{\overset{\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=7.3031\times
    {10}^{-17}\\ {}\kern0.125em \underset{-\pi }{\overset{\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0\\
    {}\underset{-\pi }{\overset{2\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=-2.8435\times
    {10}^{-16}\\ {}\underset{-\pi }{\overset{2\pi }{\int }}\mathit{\sin}(x)\mathit{\cos}(x)=0\end{array}}
    $$ ](img/A458923_1_En_5_Chapter_Equb.gif)


    因此，如果使用匿名函数定义，则无需为函数命名。


    ## 5.4 总结


    定义函数是模块化编程的关键。MATLAB 提供了一种优雅的方式来定义和使用函数，无论是内联形式还是单独的文件形式。当与在循环中编写函数的能力相结合时，复杂的问题只需几行代码即可实现。这需要在设计算法时具备艺术性的态度，其中函数和循环就像是画笔，帮助您为给定的数值问题设计出优雅的解决方案。


    # 6. 数值计算形式体系


    ## 6.1 引言


    数值计算允许您计算出数值问题的解，前提是您能够将它们构造成合适的格式。这需要一些考量。例如，如果您对连续函数进行数字化处理，那么由于以有限频率进行采样，将会引入某些误差。因此，非常精确的结果需要非常高的采样率。当需要计算大型数据集时，这将成为一项计算密集且耗时的任务。此外，您必须明白，与分析解相比，数值解充其量只是一种近似。寻找它们的物理意义和重要性的责任在于您。舍弃在现实世界场景中没有意义的解，是科学家/工程师多年来培养出的技艺。此外，计算设备的智能程度只与其操作者相当。GIGO（垃圾进，垃圾出）定律在这个领域被严格遵守。


    本章试图解释一些重要步骤，您必须考虑这些步骤才能使用数值计算来解决物理问题。以恰当的术语定义问题只是第一步。建立正确的模型，然后使用正确的方法（求解器）来解决问题，是经验不足的科学家/工程师与经验丰富的科学家/工程师之间的区别。


    ## 6.2 物理问题


    我们物理世界中的一切事物都受物理定律的支配。得益于那些在艰苦条件下辛勤工作、为我们周围发生的事情提出精妙解决方案的科学先贤们，我们获得了物理定律的数学理论。为了检验这些物理定律的数学形式体系，我们使用数值计算。如果它产生了与真实实验相同的结果，那么它们就相互验证了。数值模拟可以完全消除进行实际实验的需要，前提是您拥有经过充分测试的数学形式体系。例如，我们这个时代的核能大国不再需要真正进行核弹试验。在真实核爆炸期间获得的与核爆炸相关的数据，使科学家能够相当精确地对这些物理系统进行建模，从而消除了进行真实测试的必要性。


    除了模拟真实实验等应用之外，对物理问题进行建模也是很好的教育练习。在建模过程中，动手练习使学生能够深入探究该主题，并为所研究的课题赋予恰当的意义。解决数值问题并将结果可视化，可以使学习永久化，并揭示数学理论中的任何缺陷，这最终会带来新的发现。

