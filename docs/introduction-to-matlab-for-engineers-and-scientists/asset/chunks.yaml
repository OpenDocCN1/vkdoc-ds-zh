    \ [1,2;3,4]\n\nA =\n     1     2\n     3     4\n\n>> B = [5,6]\n\nB =\n     5\
    \     6\n\n>> size(A)\nans =\n     2     2\n\n>> size(B)\nans =\n     1     2\n\
    \n>> C = [A;B]\n\nC =\n     1     2\n     3     4\n     5     6\n\n>> size(C)\n\
    ans =\n     3     2\n\n>> D = [5;6]\n\nD =\n     5\n     6\n\n>> size(D)\nans\
    \ =\n     2     1\n\n>> E = [A,D]\n\nE =\n     1     2     5\n     3     4   \
    \  6\n\n>> size(E)\nans =\n     2     3\n```\n\n### 2.3.2 Deleting a Row and/or\
    \ Column of a Matrix\n\nRows and columns can be deleted by assigning null matrices\
    \ `[]` to them. For example, `A(1,:) = []` deletes the first row and `A(:,1) =\
    \ []` deletes the first column of a matrix, as shown here:\n\n```\n>> A = rand(3,3)\n\
    \nA =\n    0.8147    0.9134    0.2785\n    0.9058    0.6324    0.5469\n    0.1270\
    \    0.0975    0.9575\n\n>> A(1,:) = []\n\nA =\n    0.9058    0.6324    0.5469\n\
    \    0.1270    0.0975    0.9575\n\n>> A(:,1) = []\n\nA =\n    0.6324    0.5469\n\
    \    0.0975    0.9575\n```\n\n### 2.3.3 Concatenation Along a Dimension\n\nConcatenation\
    \ of two matrices along a dimension can be obtained using `cat(dim, A, B, ...)`,\
    \ where `dim` presents the dimension and `A` and `B` are the input matrices. Its\
    \ usage is shown here:\n\n```\n>> A = [1,2;3,4]\nA =\n     1     2\n     3   \
    \  4\n\n>> B = [5,6;7,8]\nB =\n     5     6\n     7     8\n\n>> cat(1,A,B)\nans\
    \ =\n     1     2\n     3     4\n     5     6\n     7     8\n\n>> cat(2,A,B)\n\
    ans =\n     1     2     5     6\n     3     4     7     8\n\n>> C = cat(3,A,B)\n\
    ans(:,:,1) =\n     1     2\n     3     4\nans(:,:,2) =\n     5     6\n     7 \
    \    8\n\n>> size(C)\nans =\n     2     2     2\n```\n\nWhen `cat(1, A, B)` is\
    \ entered at the command prompt, `A` and `B` are concatenated row-wise and `cat(2,\
    \ A, B)` performs concatenation column-wise. In case of `cat(3, A, B)`, a new\
    \ matrix is created whose first element of the third dimension is the matrix `A`\
    \ and the second element is the matrix `B`."
