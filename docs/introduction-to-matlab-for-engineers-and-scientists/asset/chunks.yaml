    # 1\. MATLAB 简介


    ## 1.1 数值计算简介


    随着二战后计算机的出现，利用这一新工具模拟物理问题的需求催生了数值计算的发明。分析计算需要纸、笔和人类大脑，而数值计算则额外需要计算设备。在科学与工程的许多领域，都观察到成功使用计算设备来解决涉及大量数据点的问题（尤其是包含重复性任务的问题）的案例。例如，破解敌方密码、在核爆炸前模拟核反应等。其应用范围进一步扩展到民用领域，例如设计和模拟水道、水坝、发电站、城镇规划等。所有这些应用都需要使用代表物理问题的物理模型的方程或方程组。处理这些方程有两种方法：使用分析技术和数值技术。在本书中，我们只关注使用
    MATLAB 求解方程的数值方法。


    随着时间的推移，为数字计算机编写了各种定义数学函数（如微分、积分、三角函数等）的方案。这涉及到数字化，而数字化必然会引入误差。了解误差并恰当地将其消除，可以比分析结果更快地获取有价值的信息。因此，它成为了科学领域研究最活跃的领域之一，并且至今仍是如此。对更快、更精确算法的追求持续推动着数值计算领域的创新，并使人类能够模拟那些原本不可能完成的任务。


    ## 1.2 数值计算工具


    随着数值方法作为分析方法的一种替代方案不断发展，计算机编程语言越来越多地被用于将其编码，以进行模拟的程序化研究。存在多种进行数值计算的选择 [1]。诸如 FORTRAN、C、Python、Java
    和 Julia 等旨在处理数学函数的编程语言，可以用来编写数值计算的算法。


    ### 1.2.1 对专用软件的需求


    虽然所有问题都可以用编程语言编码，但当微处理器平台或操作系统发生变化时，必须改变计算方法、文件管理方式等。这阻碍了互操作性。现代编程语言解决了一些这类问题，但学术界已经感受到对数值计算专用软件的需求——在这种软件中，可以随时按需调用预定义的数值方法工具，并且可以开发自定义工具。在这方面已经进行了多次尝试。


    ### 1.2.2 MATLAB 的历史


    MATLAB 就是这样一个程序，由克利夫·莫勒 [2] 开发。他当时是新墨西哥大学的数学教授，教授数值分析和矩阵理论。在攻读博士学位期间，他最初用 FORTRAN
    编写了大量代码来解决涉及矩阵代数的联立线性方程组，他最终将其命名为 MATrixLABoratory（MATLAB）。作为一名教授，他希望他的学生能够使用这些新的软件包，而无需编写
    FORTRAN 程序。


    因此，在 20 世纪 70 年代末，MATLAB 的第一个版本诞生了（用 FORTRAN 编写）。它有 80 个用于执行线性代数问题计算的函数。后来，杰克·利特尔和史蒂夫·班格特用
    C 语言重新编写了 MATLAB，并增加了新的特性，以制作该软件的商业版本。三人于 1984 年在加利福尼亚共同创立了 MathWorks [3]，该公司在全球范围内开发、维护和分发
    MATLAB 及其相关产品。MATLAB 已被证明是用于数值方法的绝佳工具 [4]。


    随着时间的推移，MATLAB 的基础软件包中添加了如此多的工具和功能，以至于连同这丰富的库集，其安装需求达到了数个 GB 的数据。MATLAB 在科学界变得极为流行。全球有超过
    5000 所大学在使用它。它有时被恰当地称为“工程语言”。数字计算资源的廉价可得性极大地推动了它在工业界和学术界的应用，以至于现在几乎所有实验室都需要 MATLAB。


    ## 1.3 安装要求


    MATLAB 应从 MathWorks [3] 的官方网站或官方经销商处购买。计算机系统要求取决于随基础 MATLAB 软件包安装的可选工具 [5] 的类型和数量。本书讨论的是基础
    MATLAB 软件包的使用。因此，为了获得良好的 MATLAB 软件使用体验，请使用配备 1GB 内存以及 Windows、Linux 或 MacOSX 中任意一种操作系统的笔记本电脑或工作站。产品附带了安装说明。MATLAB
    环境在所有系统上都是相似的，因此在使用本书练习时无需为此担心。本书已在 MacOSX 10.12 操作系统上的 MATLAB R2017a 版本上进行了测试。


    ## 1.4 工作区


    在 MATLAB 中有两种工作方式。第一种方式是在命令行上一次编写一条命令。第二种方法是编写一个脚本（一个包含一系列命令的 `.m` 文件），然后通过在命令行中直接键入其名称来运行它。例如，要运行
    `a.m` 脚本文件，只需在命令提示符下输入以下内容：


    ```

    1  >>a

    ```


    默认情况下，命令提示符由符号 `>>` 表示。你在命令提示符处输入一个命令，然后按 Enter 键执行该命令。参见图 1-1。


    ![A458923_1_En_1_Fig1_HTML.jpg](img/A458923_1_En_1_Fig1_HTML.jpg)


    图 1-1


    运行中的 MATLAB


    ### 1.4.1 REPL 原则


    MATLAB 命令行基于 REPL 原则工作，REPL 代表“读取-求值-打印-循环”。当输入被送入 MATLAB 命令提示符时，Julia 语言：


    *   **读取**用户输入的内容

    *   **求值**它读取的内容

    *   **打印**求值后的返回值

    *   **循环**回去并重复整个过程


    所有 MATLAB 命令都被视为需要在 REPL 中求值的表达式。许多编程环境，例如 Python 的交互式 shell 以及 Jupyter notebook
    格式，都采用相同的方法。名为 Julia 的新语言也有一个 REPL，并以类似的方式工作。


    ### 1.4.2 计算器


    从最简单的角度来看，MATLAB 就像一个计算器，使用数学运算符，如乘法 (`*`)、除法 (`/`)、加法 (`+`)、减法 (`-`) 和幂运算 (`^`)：


    ```

    1  >> 3 + 5

    2  ans = 8

    3  >> 2 – 3

    4  ans = –1

    5  >> 3.0 * 5

    6  ans = 15

    7  >> 2 / 3

    8  ans = 0.6667

    9  >> format long

    10  >> 2 / 3

    11  ans = 0.666666666666667

    12  >> format short

    13  >> 2 / 3

    14  ans = 0.6667

    15  >> 2 % 3

    16  ans = 2

    17  >> 2 ^ 3

    18  ans = 8

    ```


    如前面的示例所示，当一条命令被送入命令提示符 `>>` 时，它会被执行，并通过在下一行显示结果为 `ans =` 来给出答案。要在结果中显示更多小数位数，可以使用
    `format long` 命令。默认情况下，MATLAB 使用 `format short` 命令。


    ### 1.4.3 预定义常量


    ```

    1  >> pi

    2  ans = 3.1416

    3  >> i

    4  ans = 0.0000 + 1.0000i

    5  >> j

    6  ans = 0.0000 + 1.0000i

    7  >> Inf/Inf

    8  ans = NaN

    ```


    定义了许多物理常量：`pi`、`e`（欧拉数）、`i` 和 `j`（虚数 `sqrt(-1)`）、`inf`（无穷大）、`NaN`（非数字，由未定义的操作产生，例如
    `Inf/Inf`）。

    '
- fmt: '### 1.4.4 Common Mathematical Functions


    ```

    1  >> abs(–10.034)

    2  ans = 10.034

    3  >> log10(10)

    4  ans = 1

    5  >> sin(10)

    6  ans = −0.5440

    7  >> cos(10)

    8  ans = −0.8391

    9  >> tan(10)

    10  ans = 0.6484

    11  >> asin(1)

    12  ans = 1.5708

    13  >> asin(10)

    14  ans = 1.5708 + 2.9932i

    15  >> acos(1)

    16  ans = 0

    17  >> acos(10)

    18  ans = 0.0000 - 2.9932i

    19  >> atan(1)

    20  ans = 0.78540

    21  >> atan(10)

    22  ans = 1.4711

    ```


    A number of predefined mathematical functions exist in MATLAB, including:


    *   Absolute value: `abs()`

    *   Logarithm: Natural logarithm `log()` and Base-10 logarithm `log10()`

    *   Trigonometric functions: `sin()`, `cos()`, and `tan()`. Arguments are taken
    in radians.

    *   Inverse-trigonometric functions: `asin()`, `acos()`, and `atan()`


    When one works on the command prompt, it is often convenient to have a clear screen
    by getting rid of the previous command written at the command prompt. This is
    done using the command `clc`, which clears the screen by removing all inputs and
    outputs.


    Complex calculations involving these functions and operations can be performed
    with ease, like the following


    ![ $$ \sqrt{\mathit{\sin}{(10)}^2+\mathit{\cos}{(10)}^2} $$ ](A458923_1_En_1_Chapter_Equa.gif)


    and


    ![ $$ \frac{\mathit{\sin}(10)}{\sqrt{\mathit{\cos}(10)}} $$ ](A458923_1_En_1_Chapter_Equb.gif)


    ```

    1  >> sqrt(((sin(10))^2)+(cos(10))^2)

    2  ans = 1

    3  >> sin(10)/sqrt(cos(10))

    4  ans = 0.0000 + 0.5939i

    ```


    ## 1.5 Self Learning and Getting Help


    Covering all the functions available with MATLAB is beyond the scope of this book
    (or any other book!). To understand how a particular function needs to be used,
    you can use the `help` and `doc` commands. For example, typing `help exp` gives
    you detailed information about how this function should be used, whereas `doc
    exp` opens the official documentation page for the built-in function, `exp`.


    ```

    1  >> help exp

    2  exp     Exponential.

    3  exp(X) is the exponential of the elements of X, e to the X.

    4  For complex Z = X+i*Y, exp(Z) = exp(X)*(COS(Y)+i*SIN(Y)).


    6  See also expm1, log, log10, expm, expint.


    8  Reference page for exp

    ```


    Whereas `help` is typically used by programmers to get a quick overview of usage
    for a particular built-in command, the `doc` is used to learn about MATLAB structures.
    The `doc` provides detailed descriptions of usage as well as useful examples.
    For example, typing `doc exp` on the MATLAB command prompt will open a new window,
    which will show the documentation for using the `exp` facility.


    ## 1.6 Variables


    To store values temporarily, we use variables that store the value at a particular
    memory location and address it with a symbol or a set of symbols (called strings).
    For example, you can store the value of `1/10 * pi` as a variable `a` and then
    use it in an equation like this:


    ![ $$ {a}^2+10\sqrt{a} $$ ](A458923_1_En_1_Chapter_Equc.gif)


    To perform this calculation:


    ![ $$ {\pi}^2+10\sqrt{\pi } $$ ](A458923_1_En_1_Chapter_Equd.gif)


    ```

    1  >> a=1/10* pi

    2  a =  0.3142

    3  >> a^2 + 10* sqrt(a)

    4  ans = 5.7037

    ```


    Hence, the symbol `=` works as an assignment operator. It assigns the value on
    the right side to the variable named on the left side. Multiple assignments can
    be performed by using the comma (`,`) operator. Also, if you don’t want to produce
    the results on-screen, you can suppress this by using the `;` operator.


    ```

    1  >> a1 = 1, a2 = 10, a3 = 100

    2  a1 = 1

    3  a2 = 10

    4  a3 = 100

    5  >> a1 = 1, a2 = 10, a3 = 100;

    6  a1 = 1

    7  a2 = 10

    8  >> a1 = 1; a2 = 10; a3 = 100;

    9  >> a1

    10  a1 = 1

    11  >> a2

    12  a2 = 10

    13  >> a3

    14  a3 = 100

    ```


    ### 1.6.1 Data Types


    While assigning data to a variable, it is important to understand that data can
    be defined as a variety of objects defined by their data types, as follows:


    *   `logical`: This type of data stores Boolean values `1` or `0`, which can be
    operated by Boolean operators like `AND`, `OR`, `XOR`, etc.

    *   `char`: This type of data stores alphabetic characters and strings (groups
    of characters written in a sequence).

    *   `int8`, `int16`, `int32`, and `int64`: This type of data is stored as integers
    within 8 bits, 10 bits, 32 bits, and 64 bits, respectively. The size of the integer
    is given by its bit counts. Both `logical` and `char` are one byte (8 bits) wide.

    *   `uint8`, `uint16`, `uint32`, and `uint64`: This type of data stores unsigned
    integer data in 8, 16, 32 and 64 bits, respectively.

    *   `double` and `single`: This type of data is stored as double and single precision
    floating types, respectively. Decimal numbers are represented by floating point
    data types. Single precision occupies 4 bytes (32 bits) and double precision occupies
    8 bytes (64 bits) to store the floating point numbers. In the single precision
    system, 23 bits store the fraction bits (i.e., the numbers after the decimal point),
    8 bits store the exponent (i.e., the numbers before the decimal point), and the
    32nd bit is reserved for storing the sign. In a double precision system, 52 bits
    store the fraction bits (i.e., the numbers after the decimal point), 11 bits store
    the exponent (i.e., the numbers before the decimal point), and the 64th bit is
    reserved for storing the sign. Single and double precision matters when the precision
    of the result matters. In cases like GPS positioning for a projectile flying at
    high speeds, the results must be as precise as possible for greater accuracy of
    hit.

    *   `double complex` and `single complex`: Complex numbers have real and imaginary
    parts, which are stored separately. These numbers can be stored as single or double
    precision numbers using these data types.


    ### 1.6.2 Naming Conventions for Variables


    There are some naming conventions for variables names, which must be respected
    to avoid errors.


    *   Names should not start with a number; however, numbers can be used anywhere
    afterward.

    *   Variable names are case sensitive.

    *   Keywords cannot be used as names.

    *   Names can include underscores (`_`).


    While naming a variable, if you need to check that the name given is a keyword
    first, you can use the built-in function called `iskeyword(name)`. Simply typing
    `iskeyword()` produces a list of keywords, as shown here:


    ```

    1  >> iskeyword()

    2  ans =


    4  20x1 cell array


    6  ''break''

    7  ''case''

    8  ''catch''

    9  ''classdef''

    10  ''continue''

    11  ''else''

    12  ''elseif''

    13  ''end''

    14  ''for''

    15  ''function''

    16  ''global''

    17  ''if''

    18  ''otherwise''

    19  ''parfor''

    20  ''persistent''

    21  ''return''

    22  ''spmd''

    23  ''switch''

    24  ''try''

    25  ''while''

    ```'
