- fmt: "## 7.2 Tolerance\n\nWhen an approximated answer or a set of approximated answers\
    \ is available to the user, one answer must be chosen depending on the requirements\
    \ of the application. One of the ways to make this decision is to define a tolerance\
    \ limit. Tolerance can be defined as a single number or a range of numbers (having\
    \ a maximum and a minimum). The rules to define tolerance limits are entirely\
    \ application dependent. For example, while measuring human height, we could define\
    \ the tolerance to be 1 centimeter but at the same time, while measuring the diameter\
    \ of a human hair, we might like to be more accurate, by going down to 1 micron.\
    \ At the same time, while measuring the size of a red blood cell, we would need\
    \ to go further down, to 1 nm (nanometer). Whereas the decision to define tolerance\
    \ is simpler when measuring sizes—i.e., tolerance is one or two orders of magnitude\
    \ smaller than the size of the object—it may not be a straightforward task in\
    \ other applications. For example, measuring land when constructing a building\
    \ would require a tolerance of a fraction of meters, whereas positioning a screw\
    \ in a hole requires an accuracy within a fraction of a centimeter.\n\nIn mathematical\
    \ terms, if ∈ is the tolerance limit, `x` represents the real values, and `x^*`\
    \ represents the approximated value:\n\n![ $$ \\mid x-{x}^{\\ast}\\mid \\le \\\
    in $$ ](A458923_1_En_7_Chapter_Equ1.gif)\n\n(Equation 7-1)\n\nIn this case, the\
    \ absolute error (`e[a]`) and the relative error (`e[r]`) in the measurements\
    \ are given by:\n\n![ $$ {e}_a=\\mid x-{x}^{\\ast}\\mid $$ ](A458923_1_En_7_Chapter_Equ2.gif)\n\
    \n(Equation 7-2)\n\n![ $$ {e}_r=\\frac{\\mid x-{x}^{\\ast}\\mid }{x} $$ ](A458923_1_En_7_Chapter_Equ3.gif)\n\
    \n(Equation 7-3)\n\nHence, if absolute error is less than or equal to the tolerance\
    \ limit, the approximate solution or set of solutions is acceptable. However,\
    \ if `x` is known, why do we need to calculate an approximate solution?\n\nWhen\
    \ solutions of physical systems are unknown, `x^*` can be calculated and then\
    \ be compared to the physical measurements. The physical measurements constitute\
    \ the value of `x` in this case. Then, by using Equation 7-2, we can calculate\
    \ errors. Tolerance can then be determined using the fact that some `x^*` will\
    \ differ from `x` insignificantly, i.e., the errors don’t matter much.\n\n## 7.3\
    \ Taylor Series\n\nMost mathematical functions require many complex operators—other\
    \ than the simpler ones like `+`, `−`, `×`, and `÷` —to be computed. However,\
    \ a polynomial requires only these basic ones to be computed. Hence, if other\
    \ mathematical functions can be represented in terms of polynomials, they can\
    \ be approximated with relative ease.\n\nA polynomial is defined as follows:\n\
    \n![ $$ p(x)={a}_0+{a}_1x+{a}_2{x}^2+\\cdots +{a}_n{x}^n $$ ](A458923_1_En_7_Chapter_Equ4.gif)\n\
    \n(Equation 7-4) where `a[n] ∈ R` (The as are called the coefficients). For the\
    \ largest `n` that corresponds to `a[n] ≠ 0`, the degree of polynomial is defined\
    \ to be `n`.\n\n## 7.4 Taylor Polynomials\n\nTaylor’s theorem explains how to\
    \ define a great many mathematical functions, which can be defined as polynomials\
    \ and are called Taylor polynomials. The accuracy of the final answer shown by\
    \ a Taylor polynomial depends on its degree, i.e., the number of terms defined\
    \ in the polynomial. This provides a convenient method to customize the polynomial\
    \ based on the desired tolerance.\n\nSuppose a mathematical function `f(x)` needs\
    \ to be approximated around `x = a`. A Taylor Polynomial `p[n](x)` of degree `n`\
    \ centered at `x = a` is a polynomial (of degree at-most `n`) that has the same\
    \ value as `n^(th)` derivative at `x = a`.\n\nHere’s how to derive the formula\
    \ for a Taylor Polynomial:\n\n1.  The zero order polynomial `p[0](x)` has degrees\
    \ of at most zero.\n    *   `p[0](x)` must be a constant function (a horizontal\
    \ line function, graphically).\n    *   Approximating around `x = a`: `p[0](x)\
    \ = f(a)`.\n2.  The first order polynomial `p[1](x)` has a degree at most of 1.\n\
    \n    ![ $$ {p}_1(a)=f(a) $$ ](A458923_1_En_7_Chapter_Equa.gif)\n\n    *   `p1(x)`\
    \ must satisfy two conditions:\n\n        and\n\n    ![ $$ {p}_1^{'}(a)={f}_1^{'}(a)\
    \ $$ ](A458923_1_En_7_Chapter_Equb.gif)\n\n    ![ $$ {p}_1(x)={f}^{\\prime }(a)x+f(a)-{f}^{\\\
    prime }(a)a=f(a)\\left(x-a\\right) $$ ](A458923_1_En_7_Chapter_Equc.gif)\n\n \
    \   *   `p[1](x)` must be of the form `p[1](x) = mx + c` (a straight line with\
    \ slope `m` and `c` as the intercept).\n    *   Since `p'(a) = f'(a)`, so `m =\
    \ f'(a)`.\n    *   So we can write `c = f(a) - f'(a)a`.\n    *   Substituting\
    \ back the values of `m` and `c`, we get.\n3.  Carrying forward the same arguments\
    \ in a similar fashion, you can write the general form of the Taylor Polynomial\
    \ of order `n` as:\n\n    ![ $$ {\\displaystyle \\begin{array}{l}{p}_n(x)=f(a)+{f}^{\\\
    hbox{'}}(a)\\left(x-a\\right)+\\frac{1}{2}{f}^{\\hbox{'}\\hbox{'}}(a){\\left(x-a\\\
    right)}^2\\\\ {}+\\frac{1}{3!}{f}^{\\hbox{'}\\hbox{'}\\hbox{'}}(a){\\left(x-a\\\
    right)}^3+\\cdots +\\frac{1}{n!}\\kern0.125em {f}^n(a){\\left(x-a\\right)}^n\\\
    end{array}} $$ ](A458923_1_En_7_Chapter_Equd.gif)\n\n    which can be rewritten\
    \ in sigma notation as follows:\n\n    ![ $$ {p}_n(x)=\\sum \\limits_{k=0}^n\\\
    frac{1}{k!}{f}^k(a){\\left(x-a\\right)}^k $$ ](A458923_1_En_7_Chapter_Equ5.gif)\n\
    \n    (Equation 7-5)\n\nThis definition requires that the polynomial must have\
    \ `n` derivatives at `x = a`.\n\nThe Maclaurin Series is simply the Taylor Series\
    \ defined for `a = 0`. You can use algebraic manipulations of the Taylor/Maclaurin\
    \ Series for basic functions like `sin(x)`, `cos(x)`, and `e^x` to define other\
    \ complicated functions in their series forms. These can be performed by simply\
    \ using algebraic operators in addition to substitutions, derivatives, and integrations.\
    \ This mathematical convenience comes in handy in formulating approximate solutions\
    \ for physical systems defined by complicated functions.\n\n### 7.4.1 Maclaurin\
    \ Series for `sin(x)` and `cos(x)`\n\nTo check Maclaurin expansion, let’s start\
    \ with the trigonometric functions `sin(x)` and `cos(x)`. Both are continuous\
    \ and differentiable in the range given by any set of real numbers. Hence their\
    \ differentials exist in the same. They can be expanded in the form of a Maclaurin\
    \ Series as follows.\n\nSuppose `f(x) = sin(x)` needs to be approximated at `a\
    \ = 0`.\n\nUsing Table [7-1](#A458923_1_En_7_Chapter.html#Tab1) and Equation 7.5\
    \ results in this equation:\n\n![ $$ \\mathit{\\sin}(x)=x-\\frac{1}{3!}{x}^3+\\\
    frac{1}{5!}{x}^5-\\frac{1}{7!}{x}^7+\\frac{1}{9!}{x}^9-\\cdots \\pm \\frac{1}{n!}{x}^n\
    \ $$ ](A458923_1_En_7_Chapter_Equ6.gif)\n\n(Equation 7-6)\n\n**Table 7-1** Calculating\
    \ Coefficients for the Maclaurin Series of `sin(x)` at `x = 0`\n\n| n | f(x) |\
    \ f(a) |\n| --- | --- | --- |\n| 0 | sin(x) | 0 |\n| 1 | cos(x) | 1 |\n| 2 | −sin(x)\
    \ | 0 |\n| 3 | −cos(x) | −1 |\n| 4 | sin(x) | 0 |\n\nSimilarly for `f(x) = cos(x)`\
    \ approximated at `a = 0`, using Table [7-2](#A458923_1_En_7_Chapter.html#Tab2)\
    \ and Equation 7-5 results in this equation:\n\n![ $$ \\mathit{\\cos}(x)=1-\\\
    frac{x^2}{2}+\\frac{1}{4!}{x}^4-\\frac{1}{6!}{x}^6+\\frac{1}{8!}{x}^8-\\cdots\
    \ \\pm \\frac{1}{n!}{x}^n $$ ](A458923_1_En_7_Chapter_Equ7.gif)\n\n(Equation 7-7)\n\
    \n**Table 7-2** Calculating Coefficients for the Maclaurin Series of `cos(x)`\
    \ at `x = 0`\n\n| n | f(x) | f(a) |\n| --- | --- | --- |\n| 0 | cos(x) | 1 |\n\
    | 1 | −sin(x) | 0 |\n| 2 | −cos(x) | −1 |\n| 3 | sin(x) | 0 |\n| 4 | cos(x) |\
    \ 1 |"
