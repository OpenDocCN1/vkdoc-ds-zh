    \     1     2\n     3     4\n\n>> matrix33 = [1,2,3;4,5,6;7,8,9]\nmatrix33 =\n\
    \     1     2     3\n     4     5     6\n     7     8     9\n\n>> size(a)\nans\
    \ =\n     1     5\n\n>> size(matrix22)\nans =\n     2     2\n\n>> size(matrix33)\n\
    ans =\n     3     3\n```\n\nAs seen in the example code, an array can be understood\
