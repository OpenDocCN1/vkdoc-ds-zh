    `who` 和 `whos`，你可以跟踪内存需求。请记住，明智地使用内存资源非常重要，尤其是在基于 Raspberry Pi 的系统上。要清除存储的变量，可以使用
    `clear` 命令。同样重要的是要注意，变量列表是依赖于会话的。当你通过图标或使用 `exit` 关闭 MATLAB 来退出会话时，变量列表会从内存中擦除。


    ### 1.6.4 全局变量和局部变量


    在全局范围内（即主程序内部）声明的变量称为全局变量，而在函数内部（将在后续章节中解释）局部声明的变量称为局部变量。要定义全局变量，你需要使用 `global`
    声明语句。一旦定义，无论任何新定义如何，它都保持不变，除非你发出 `clear` 命令来从内存中清除变量名和值。


