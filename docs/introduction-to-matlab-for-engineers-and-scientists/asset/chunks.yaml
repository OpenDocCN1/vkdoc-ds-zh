    当遇到 `keyboard` 关键字时，MATLAB 会话会进入调试模式，用户随后可以将值更改为 `x=2.5`。输入 `dbcont` 将继续执行程序。计算结果将基于新的赋值。


    ### 4.2.3 `menu()`


    一种图形化的输入值方式是通过 `menu()` 命令实现的，该命令以标题和一组选项作为输入（用逗号分隔）。这需要用户的计算机终端具备图形显示能力，否则会在命令提示符处显示一个选项列表。用户会看到一个图形窗口，并可以使用鼠标或键盘选择一个选项。这些选项会返回一个标量值，该值可以存储在一个变量中。选项内部会进行编号。


    我们通过一个示例来看看它的用法。创建一个标题为“Even or Odd Numbers”（偶数或奇数）并包含两个选项——`Even`（偶数）和 `Odd`（奇数）的菜单。将此值存储在变量
    `I` 中。执行此命令后，将出现图 4-1 所示的图形窗口。可能的输出如下：


    ![A458923_1_En_4_Fig1_HTML.jpg](img/A458923_1_En_4_Fig1_HTML.jpg)


    图 4-1


    菜单窗口输出


    - 如果用户关闭窗口而未输入任何值，则输出为 0。

    - 如果用户点击 `Even`（偶数），则输出为 1。

    - 如果用户点击 `Odd`（奇数），则输出为 2。


    如下代码所示：


    ```

    1  >> I = menu(''Even or Odd Numbers'',''Even'',''Odd'')


    3  I =


    5  0


    7  >> I = menu(''Even or Odd numbers'',''Even'',''Odd'')


    9  I =


    11  1


    13  >> I = menu(''Even or Odd numbers'',''Even'',''Odd'')


    15  I =


    17  2


    ```


    - `pause()`：如果您想临时暂停程序，可以使用 `pause()` 命令。按任意键继续执行程序。为了理解其用法，考虑一个示例。假设您有一个 3×3
    的随机数矩阵。那么 MATLAB 程序 `pauseCommand.m` 将显示其秩、转置和大小。每次用户按一个键，就会显示一个项目。请参阅清单 4-2。


    ```

    1  %Program to show usage

    2  %of pause command


    4  x = rand(3,3);

    5  r = rank(x);

    6  t = x'';

    7  s = size(x);

    8  disp(''Given matrix is:'')

    9  disp(x)

    10  disp(''To continue checking its rank, press any key'')

    11  pause

    12  disp(''Rank of matrix is:'')

    13  disp(r)

    14  pause

    15  disp(''To continue checking its transpose, press any key'')

    16  pause

    17  disp(''Transpose of matrix is:'')

    18  disp(t)

    19  pause

    20  disp(''To continue checking its size, press any key'')

    21  pause

    22  disp(''Size of matrix is:'')

    23  disp(s)

    24  pause

    Listing 4-2

    The pauseCommand.m Program

    ```


    运行 `pauseCommand.m` 的输出如下所示：


    ```

    1  >> pauseCommand

    2  Given matrix is:

    3  0.8147    0.9134    0.2785

    4  0.9058    0.6324    0.5469

    5  0.1270    0.0975    0.9575


    7  To continue checking its rank, press any key

    8  Rank of matrix is:

    9  3


    11  To continue checking its transpose, press any key

    12  Transpose of matrix is:

    13  0.8147    0.9058    0.1270

    14  0.9134    0.6324    0.0975

    15  0.2785    0.5469    0.9575


    17  To continue checking its size, press any key

    18  Size of matrix is:

    19  3     3


    ```


    ## 4.3 文件路径


    MATLAB 会话从一个默认文件夹启动，该文件夹取决于特定操作系统的安装方式。通常在安装时会创建一个专用文件夹，默认名称一般为 `MATLAB`。通过在命令提示符处输入
    `pwd` 可以查看此文件夹的路径。


    ```

    1   >> pwd


    3   ans =


    5   ''/Users/.../MATLAB''

    ```


    请注意，您计算机上的路径可能不同，这里使用三个点来表示路径的通用表示形式。


    当您想要运行 MATLAB 的 `.m` 文件时，会首先在默认文件夹中搜索该文件。如果文件不在那里，您必须将工作目录更改为存储该文件的目录。这可以通过在 MATLAB
    的命令提示符处输入 `pathtool` 来实现（见图 4-2）。


    ![A458923_1_En_4_Fig2_HTML.jpg](img/A458923_1_En_4_Fig2_HTML.jpg)


    图 4-2


    使用 `pathtool` 命令设置工作目录路径


    您可以简单地将该目录添加到当前会话的目录列表中，或者保存它。您也可以选择将该目录设置为未来 MATLAB 会话的默认目录。如果您将长期在一个项目上工作，并且确定每天都会使用该目录，那么这是一个很好的选择。强烈建议您将所有文件保存在已安装
    MATLAB 程序的默认目录中，或者将您的工作目录设置为默认目录。

    '
- fmt: "# 4.4 File Operations\n\nFile operations constitute an important part of computation.\
    \ It is important to note that the file system is OS (Operating System) dependent.\
    \ Just like most scientific programs, MATLAB works with UNIX-like systems, so\
    \ it works on Linux-based and MacOS X equally well with the same set of commands.\
    \ On Windows, you use the same commands as the Linux version for dealing with\
    \ files within the MATLAB environment. The code examples in this book were written\
    \ and tested on Windows 8, MacOSX 10.10, and Ubuntu 14.04 systems.\n\n## 4.4.1\
    \ Users\n\nA computing system is accessed by different users. Each user defines\
    \ a workspace to avoid damaging each other’s work. After login, a user’s workspace\
    \ becomes active for that user. The workspace is made up of various files and\
    \ folders. Some files are essential for the OS to define the workspace and its\
    \ properties, hence they should not be altered. This is ensured by giving permissions\
    \ to various users.\n\nReading and writing a file is restricted by permission.\
    \ The administrator (fondly called the `admin`) is also called the superuser and\
    \ has all privileges and permission to edit any file/folder. You must understand\
    \ the defined user types for a computer system and then issue those commands accordingly.\
    \ If you are not permitted to access certain folders and the input data you need\
    \ is placed inside those files/folders, you will always get an error (unless the\
    \ admin changes your permissions).\n\n## 4.4.2 File Path\n\nDirectories/folders\
    \ can contain sub-directories/sub-folders and files again. This can go to any\
    \ level if this process is not restricted by the administrator.\n\nThe `pwd` command\
    \ stands for print working directory. On the MATLAB terminal, typing `pwd` displays\
    \ the path of the present working directory, as shown in this example:\n\n```\n\
    1  >> pwd\n2  ans = /home/sandeep\n```\n\nThe user’s `/home` directory contains\
    \ another directory named `/sandeep`. This is the present working space. When\
    \ `pwd` is typed into the terminal, a variable name named `ans` stores this data\
    \ (file path). A variable name of your choice can be assigned to store the filename\
    \ as a string.\n\nA file/folder is accessed by typing the file path into the terminal.\
    \ Consider this small exercise to understand this process. To create a new directory,\
    \ you use `mkdir name` as follows:\n\n```\n1  >> mkdir matlab−practice\n2  ans\
    \ = 1\n3  >> ls\n4  Downloads                           Music\n5  R\n6  Templates\n\
    7  matplab−practice\n8  Videos\n9  Desktop                             software\n\
    10  Work\n11  Documents                           Library\n12  Pictures\n13  >>\
    \ cd matplab−practice\n14  >>\n```\n\nAt line 1, `mkdir matplab-practice` creates\
    \ a directory named `matplab-practice`. To see the contents of the present directory,\
    \ you can use the `ls` command, as is done at line 3, which stands for `list`.\
    \ To change the directory, you can use the `cd file path` command, as shown in\
    \ line 13. I suggest that you work in this directory for rest of the book.\n\n\
    ## 4.4.3 Creating and Saving Files\n\nThe `save` and `load` commands allow you\
    \ to write and read data to memory.\n\n```\n1  >> matrix = rand(3,3);\n2  >> save\
    \ MyFirstFile.mat matrix\n3  >> ls\n4  MyFirstFile.mat\n5  >> load MyFirstFile.mat\n\
    6  >> matrix\n7  matrix =\n\n9  0.467414     0.610273     0.429941\n10  0.568490\
    \     0.037898     0.734682\n11  0.547370     0.275421     0.539650\n\n13  >>\n\
    ```\n\nAt line 1, a variable named `matrix` is created first, which stores a random-value\
    \ 3×3 matrix. At line 2, this data is stored as a `.mat` file named `MyFirstFile.mat`,\
    \ which is passed the variable name as the argument. When required, this file\
    \ can be loaded in the workspace using the `load MyFirstFile.mat` command and\
    \ then by calling the variable named `matrix`. The random numbers recorded when\
    \ the file was saved are loaded as the data for the 3×3 matrix. Note that this\
    \ data does not need be numbers. It can be anything that a digital computer can\
    \ handle, including pictures, videos, strings, and characters, just to name a\
    \ few.\n\nMultiple variables can be stored in the same file by passing the name\
    \ of the variables at the time of saving.\n\n```\n1  >> matrix1 = rand(4,4);\n\
    2  >> matrix2 = rand(2,3);\n3  >> matrix3 = rand(2,2);\n4  >> save(\"SavingMultipleVariables.mat\"\
    ,\"matrix1\",\"matrix2\",\"matrix3\")\n5  >> load SavingMultipleVariables.mat\n\
    6  >> matrix1\n7  matrix1 =\n\n9     0.8598130     0.0118250     0.9803720   \
    \  0.3044413\n10     0.6676748     0.0056845     0.1101545     0.2183920\n11 \
    \    0.2547204     0.8192626     0.8056112     0.6961116\n12     0.7924558   \
    \  0.9130480     0.1976146     0.4635055\n\n14  >> matrix2\n15  matrix2 =\n\n\
    17     0.35215    0.55770    0.66650\n18     0.98515    0.98677    0.45513\n\n\
    20  >> matrix3\n21  matrix3 =\n\n23     0.097693    0.540354\n24     0.923853\
    \    0.329501\n\n26  >>>> save −binary SavedAsBinary m*\n27  >> ls\n28  MyFirstFile.mat\
    \  SavedAsBinary  SavingMultipleVariables.mat\n```\n\nThe `help save` and `help\
    \ load` commands provide very useful instructions about using `save` and `load`.\
    \ Using the options, you can save the file in a specific format. For example,\
    \ on line 26, all variables names starting with `m` are saved as binary data inside\
    \ a binary file named `SavedAsBinary`. This is particularly important when data\
    \ generated from MATLAB-based numerical computations is used in other software\
    \ programs. You can also specify the precision of saved data using options. You\
    \ can also compress a big file using the `-zip` command. This is very useful when\
    \ the data generated by MATLAB is large in size and needs to be transmitted.\n\
    \nThe `load` function follows the same logic as the `save` function. Data can\
    \ be unzipped and loaded from a particular formatted file as an array. The array,\
    \ thus populated, can be used for computation and the resultant files can be made\
    \ by using the `save` function again (if required). Elaborate computations require\
    \ this procedure to be repeated successively many times, thus the functions have\
    \ been optimized to locate and load the required data in a short time.\n\nDelimited\
    \ numeric data files (numerical data values separated by a delimiter) can be read\
    \ and written using `dlmread()` and `dlmwrite()`. The functions produce ASCII-delimited\
    \ files. To illustrate this, the following MATLAB code performs the following\
    \ task:\n\n*   Stores a 3×3 matrix in variable `A`.\n*   Using the `dlmwrite()`\
    \ function, a file named `randomNumbers.txt` is written, which takes its inputs\
    \ from the matrix stored in `A`.\n    *   The delimiter is defined to `;`\n  \
    \  *   You can check the file in the working directory and open it with an appropriate\
    \ text editor or spreadsheet software.\n*   A new variable named `B` is initialized\
    \ to be an empty matrix.\n*   Using the function `dlmread()`, this file is read.\
    \ It is important to define the delimiter used during the creation of the file.\
    \ The results are stored in `B` and found to be exactly same as that of `A`.\n\
    \n```\n1  >> A = randn(3,3)\n\n3  A =\n\n5   0.3252   −1.7115      0.3192\n6 \
    \ −0.7549   −0.1022      0.3129\n7   1.3703   −0.2414     −0.8649\n\n9  >> dlmwrite('randomNumbers.txt',A,';')\n\
    10  >> B = []\n11  >> B = dlmread('randomNumbers.txt',';')\n\n13  B =\n\n15  \
    \ 0.3252    −1.7115     0.3192\n16  −0.7549    −0.1022     0.3129\n17   1.3703\
    \    −0.2414    −0.8649\n```\n\n## 4.4.4 Using the Diary and History Commands\n\
    \nA MATLAB session can be recorded in a file by using the command `diary`. Type\
    \ `help diary` to see information about its use. Writing `help filename` allows\
    \ recording the session in a file with given filename. The commands and their\
    \ outputs are continuously updated using this function.\n\nYou can use the `history`\
    \ command to display a list of executed commands. Various options are available\
    \ to see this history in particular formats."
