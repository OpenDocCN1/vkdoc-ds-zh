    #### 需要多少项？


    从图 7-4 中你可以观察到，在计算 `e^(0.1)` 时，通过增加项数，你可以将误差降低两个数量级。但是，这是否意味着要达到真实值，就必须包含无限多的项呢？毕竟，每增加一个新项，你都需要投入时间和计算资源。通常来说，当使用
    `n` 项时，麦克劳林级数的精度为 `a^(n+1)`：


    ![ $$ {e}^a=1+a+\frac{a²}{2!}+\frac{a³}{3!}+\frac{a⁴}{4!}+\dots +\frac{a^n}{n!}+O\left({a}^{n+1}\right)
    $$ ](img/A458923_1_En_7_Chapter_Equ10.gif)


    （方程 7-10）


    从分析的角度，你可以选择任意大的 `n`，但在计算设备上无法做到这一点。接下来将探讨其原因。


    图 7-4 显示了一个有趣的现象：超过 10 项后，误差不再按数量级变化，而是趋于平稳。这是一个具有误导性的结果。每台计算设备在存储最小浮点数方面都有极限。这可以通过发出
    `eps` 命令来获取。运行该程序的系统显示以下输出。


    ```

    1  >> error(9:12)

    2  ans =


    4  3.10862446895044e−15  4.44089209850063e−16  4.44089209850063e−16  4.44089209850063e−16

    5  >>> eps

    6  ans = 2.22044604925031e−16

    ```


    你现在可以看到，当误差值非常接近 `eps` 值时，它们就无法再被可靠地存储了。命令 `error(9:12)` 输出了一个类似的观点。可以看出，尽管第 9
    项产生的误差量级为 `10^(−15)`，但从第 11 项开始，数值都相似，量级为 `10^(−16)`。这样做是为了让计算机避免因超出由 `eps` 值定义的限制而导致计算崩溃。


    `eps` 命令给出机器精度。`help(''eps'')` 命令显示了 `eps` 命令的文档及其用法。从技术上讲，`eps` 是机器浮点系统中任意两个相邻数字之间的相对间距，即计算设备的最小计数单位。这个数字显然依赖于系统，因为你可以设计专门的硬件来提升机器精度。事实上，在需要更高精度时（例如导弹制导、太空导航等）就会这样做。在支持
    IEEE 浮点运算的设备上，双精度的 `eps` 约为 `2.2204 × 10^(−16)`，单精度的 `eps` 约为 `1.1921 × 10^(−7)`。


    有趣的是，`2^(-25) ≈ 2.2204 × 10^(-16)`。这本质上是说，软件的双精度模式可以存储小数点后 52 位数字。你将在本章的“计算误差”部分了解更多相关内容，该部分讨论了数值计算中的机器精度方面以及了解特定数值问题所需运算精度的重要性。


    `realmax`、`realmin`、`intmax` 和 `intmin` 命令显示了安装该软件的特定机器上实数和整数的最大值和最小值。


    ```

    1  >> realmax

    2  ans = 1.79769313486232e+308

    3  >> intmax

    4  ans = 2147483647

    5  >> realmin

    6  ans = 2.22507385850720e−308

    7  >> intmin

    8  ans = −2147483648

    ```


    了解这些数字很有用，因为超出这些范围的数字会因为机器精度而容易产生误差。


    ## 7.5 计算误差


    到目前为止，你已经了解了在计算数学函数时，因包含特定数量的项而产生的固有误差。事实上，还存在另一种误差，这是由于计算机只能存储有限长度的数字而引入的。

