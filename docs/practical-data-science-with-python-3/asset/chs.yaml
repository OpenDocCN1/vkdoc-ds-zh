  \ 软件系统的公司。下面这句话很好地强调了这一老生常谈的道理：\n\n> *毕竟，随着所研究的系统变得越来越大，软件工程和人工智能的关键编程问题往往会融合在一起。*\n\
  > \n> ——艾伦·J·珀利斯，为《计算机程序的构造和解释（第二版）》（MIT 出版社，1996 年）所作序言\n\n通常，数据科学被描述为一门融合了数学技能、计算机科学技能和领域专业知识的学科。这里所欠缺的是工程和经济学的概念（选择的科学）。软件工程方面对于创建可维护、可扩展且可靠的解决方案至关重要。ISO/IEC/IEEE\
  \ 系统和软件工程词汇表（SEVOCAB；参见 [`https://pascal.computer.org`](https://pascal.computer.org)）将*软件工程*定义为“将系统的、规范的、可量化的方法应用于软件的开发、运行和维护；即，将工程学应用于软件。”本章试图填补这一空白，并解释工程和经济学在数据科学中的作用。\n\
  \n为应对大规模软件开发挑战而进行的编程语言变革已迫在眉睫；Python 内部的变化也已在进行中。在这方面，Python 将与其他许多企业级语言共享同一命运（回顾\
  \ Java 在过去二十年中的演变是很有启发性的）。本章提及了一些关键的质量保证工具，这些工具增强了 Python 的表现力，使其更适合企业级软件系统。\n\n\
  无论如何，复述已知事实或仅仅空谈理论都是没有意义的。因此，本章的内容相当非典型，而是聚焦于软件行业中那些隐藏却至关重要的方面。\n\n## 大规模软件系统的特征\n\
  \n大规模软件系统与小型软件系统之间最大的区别在于软件的生命周期模型。它指的是软件产品的所有阶段，从最初的开发，到使用、维护、演进，直至退役。为简化讨论，我们对*大规模*的定义是：一个无法由小型团队实现的软件系统；它是一个复杂的社会技术密集型软件系统的一部分；并且其退役将产生巨大的业务影响。软件维护和演进通常是大规模软件系统生命周期中最长的阶段；对于某些安全关键的软件系统，这个阶段可能跨越几十年。这意味着大部分活动都将在第一个生产版本部署后发生。\n\
  \n用锦标赛级别的国际象棋比赛来类比软件生命周期模型是很有启发性的。与软件开发一样，这样的棋局之前需要一个初始的准备和规划阶段（例如，分析对手的棋风和开局库，回忆过去与对手对弈的经验，比较当前的排名，决定是要激进地争取胜利等）。你不能像业余爱好者那样，仅仅根据棋子的当前位置来走棋。在比赛过程中，你需要平衡资源（子力、时间、局面等），运用理论，利用经验，并通过各个阶段（开局、中局和残局）推进。棋局的阶段与软件生命周期模型的阶段映射关系参见图\
  \ 3-1。\n\n为了保持这个循环的持续运转，需要采用一种整体性的软件工程方法。你必须评估广泛的可能性，以正确判断潜在变更的向量。这些向量决定了你的软件在哪些方面必须足够灵活，以便容纳未来的增加和改进。在每一轮中，你还必须应对一波又一波的变更请求；这与国际象棋类似，你必须持续监控对手的动向并相应调整策略。最后，就像下棋一样，如果你搞砸了需求或设计了错误的架构，那么后期进行纠正将非常困难。在国际象棋中，一个糟糕的开局会让你的比赛变成一场争取平局的苦战。\n\
  \n虽然在国际象棋中一切在最后阶段结束，但在大规模软件系统的开发中则完全不同。这些周期是连锁的，并包含新功能的开发。甚至有一种观点认为，软件维护和演进是开发阶段的延续，在这方面，我们称之为永续演进（对产品进行成功的改进和扩展）。从某种意义上说，开发一个小型软件产品就像下一盘棋，而开发一个大规模软件系统则类似于一场非常漫长的锦标赛。\n\
  \n除了为现有软件添加新功能外，还存在维护的需求。修复错误是这项活动的一个主要例子。为了经济高效地进行维护和演进，软件必须是*可维护的*。根据 ISO/IEC\
  \ 25010 标准，可维护性作为一项质量属性（其子属性是可测试性）代表了将变更高效地集成到代码库中的能力。根据 IEEE 14764，我们可以区分以下四类维护活动，它们可归类为两种主要类型（纠正或增强）：\n\
  \n- **纠正性维护（纠正）**：与修复故障（在生产环境中造成损害的可观察问题）相关，通常由客户报告。\n\n- **适应性维护（增强）**：涉及因环境变化（例如，业务流程、外部法律法规、平台、技术等）而进行的修改。目标是主动保持软件的可用性。\n\
  \n\n\n![../images/473947_1_En_3_Chapter/473947_1_En_3_Fig1_HTML.jpg](img/473947_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n棋局阶段到软件生命周期模型的映射\n\n- **预防性维护（纠错）**：涉及在故障转化为失败之前修复缺陷。假设你的代码中有一个函数接受一个数值参数作为除数。如果不对零值进行检查，可能会引发异常。然而，如果该参数永远不会接收到零值，那么这一潜在缺陷就不会演变为失败（运行故障）。这需要深入理解客户将如何使用产品，因为某些缺陷在特定情况下可能永远不会引发失败。\n\
  \n- **完善性维护（增强）**：处理所有旨在提升软件质量（包括可维护性）的主动变更。这项活动对于对抗维护和演进过程中代码库持续变更带来的负面影响至关重要。随着新功能的增加，复杂度上升，现有代码结构会劣化。这一现象在*莱曼软件演化定律*中得到了很好的阐述。\n\
  \n所有前述的维护活动和类别都必须根据目标软件系统的类型进行评估。共存在三种类型：\n\n- **S 型系统**：具有有限可枚举的问题空间和固定的环境。一旦初始需求确定，未来不会发生任何变化（这里我们不将潜在的用户界面增强视为重大变更）。例如，流行的井字棋游戏就是\
  \ S 型系统。\n\n- **P 型系统**：具有复杂的问题空间和固定的环境。运用各种启发式方法来搜索问题空间。对抽象模型的改进会引发系统的重大变更。例如，国际象棋和围棋等流行的棋盘游戏属于\
  \ P 型系统。\n\n- **E 型系统**：由于环境高度动态，是最复杂的系统类型。无法 100% 准确地预测环境未来会如何波动。不幸的是，没有人能保证新法规不会破坏系统的原有架构。最近一个典型的例子是欧盟《通用数据保护条例》（GDPR；参见\
  \ [`https://gdpr-info.eu`](https://gdpr-info.eu)）的颁布，为遵守该条例，许多组织在软件系统更新上投入了大量资金。总而言之，大规模数据科学产品属于此类。\n\
  \n软件系统的总拥有成本（TCO）由以下要素构成：\n\n- 新产品的初始开发\n- 完善性维护类活动\n- 纠错性维护类活动\n- 客户支持\n\n显然，维护与初始开发之间的比例是\
  \ 3:1。因此，我们应当警惕为了追求速度而牺牲质量。许多不成熟的公司怀有一种错误信念，认为工具是银弹，既能加快速度，又能弥补人的不足（缺乏知识与经验、疏忽大意等）。正如你之后会看到的，唯一的解决方案是优先投资于人。\n\
  \n### 软件工程知识领域\n\n软件工程由 15 个主要知识领域组成（另见“参考文献”部分的 [3]）：\n\n- 软件需求\n- 软件设计\n- 软件构造\n\
  - 软件测试\n- 软件维护\n- 软件配置管理\n- 软件工程管理\n- 软件工程过程\n- 软件工程模型与方法\n- 软件质量\n- 软件工程专业实践\n\
  - 软件工程经济学\n- 计算基础\n- 数学基础\n- 工程基础\n\n为了全面界定软件工程的范畴，我们还需包含以下七个相关学科：\n\n- 计算机工程\n\
  - 计算机科学\n- 通用管理\n- 数学\n- 项目管理\n- 质量管理\n- 系统工程\n\n计算机科学和数学是显而易见的基础，但人们往往难以理解系统工程（请阅读边栏“成功与否？”）。系统工程是一个更为广泛的学科，它将软件产品置于社会技术背景中，赋予其意义。\n\
  \n### 成功与否？\n\n我敢肯定到目前为止你收到过许多自动生成的生日祝福邮件。假设生成这些邮件的软件完美无缺。它每天搜索用户数据库，筛选出所有当天过生日的用户。然后使用通用模板生成消息并发送出去。当你收到这样的消息时开心吗？就我个人而言，我觉得它们非常烦人。你很可能乐意收到来自配偶、孩子、亲戚、朋友或同事的消息，但大概不想收到由机械发送问候的程序发出的消息。\n\
  \n从软件工程的角度来看，公司可能会说这个软件取得了完全成功。然而，如果没有人愿意收到自动生成的问候，那么从系统工程的角度来看，它就是一个彻底的失败。尽管软件运行得完美无缺，但它毫无用处。\n\
  \n\n\n## 规则、原则、约定与标准\n\n本节标题中的术语相互关联，主要区别在于严格程度。约定是各方之间的协议，而标准是由相应标准化机构管理的正式规范（例如，*IEEE\
  \ 754-2019 - IEEE 浮点运算标准*；参见 [`https://standards.ieee.org/standard/754-2008.html`](https://standards.ieee.org/standard/754-2008.html)）。与物理学不同，软件工程学科通常没有定律，尽管存在例外。规则和原则介于约定和标准之间。它们都旨在对系统设计施加约束，以促进互操作性、集成性和生产力。这听起来或许有些奇怪，但有节制地限制选择反而能激发创造力；其目标是避免始终重复发明轮子。此外，规则和原则以一种直接的方式综合了某个领域的知识，有助于实现一致性和质量。Python\
  \ 还附带了一套名为 **Python 之禅** 的规则，如图 3-2 所示。标准质量模型也被附在列表中，以提醒您这些项的重要性。\n\n![../images/473947_1_En_3_Chapter/473947_1_En_3_Fig2_HTML.jpg](img/473947_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n在 Python 控制台中执行 `import this` 后得到的一套规则\n\n如您所见，根据 **Python 之禅**，避免将规则和原则视为教条的诱惑至关重要。通过对比第一条和第九条规则（我用曲线箭头连接了它们），这一点得到了极好的说明。因此，即便是\
  \ **Python 之禅** 也警告了我们这个问题。我在左侧框内的评论提供了一个示例，说明为何强行满足某条规则可能会引发问题。另一方面，有一条重要的元规则（带边框显示的第八条规则）提醒我们，公然无视规则同样是错误的。在偏离任何类型的指令之前，您必须清楚自己在做什么。“可读性很重要”\
  \ 处于中心位置，这是有充分理由的。软件工程师在维护和演进过程中，大部分时间都花在理解代码上。\n\n本章隐含地遵循了图 3-2 中列出的规则；主题阐述依赖于简单的示例（**Python\
  \ 之禅** 提及的是实现细节而非叙述）。缺乏此类示例可能表明主题模糊、讲师能力不足，或两者兼有。接下来的图示尽可能简单，以便您将注意力集中在核心主题上。关于简洁性，有一条关键的敏捷原则（参见\
  \ [`https://agilemanifesto.org/principles`](https://agilemanifesto.org/principles)）指出：“简洁——即最大化未完成工作的艺术——至关重要。”\
  \ 具有讽刺意味的是，这是被误用最严重的一条原则。要意识到哪些工作应该被排除，这项工作本身绝非简单。\n\n软件工程师利用质量保证工具来轻松应用规则（它们也可以强制执行规则，尤其是在与构建服务器结合使用时）。Python\
  \ 生态系统拥有丰富的此类工具。以下列表仅是可用工具的一部分示例：\n\n- **Pylint** ( [`https://www.pylint.org`](https://www.pylint.org)\
  \ ) 提供以下功能：\n    - 代码风格检查（访问 [`https://www.python.org/dev/peps/pep-0008`](https://www.python.org/dev/peps/pep-0008)）\n\
  \    - 逆向工程支持（与 `Pyreverse` 集成，从代码生成 UML 图）\n    - 重构帮助（例如检测重复代码）\n    - IDE 集成（例如，它是\
  \ `Spyder` 的组成部分）\n    - 错误检测（可自定义的检查器）\n- **Codacy** ( [`https://www.codacy.com`](https://www.codacy.com)\
  \ ) 提供自动化代码审查。\n- **CodeFactor** ( [`https://www.codefactor.io`](https://www.codefactor.io)\
  \ ) 也提供自动化代码审查。\n- **Radon** ( [`https://pypi.org/project/radon`](https://pypi.org/project/radon)\
  \ ) 提供以下功能：\n    - McCabe 圈复杂度（本章稍后解释）\n    - 原始度量，包括源代码行数（SLOC）、注释行数、空白行数等\n  \
  \  - Halstead 度量\n    - 可维护性指数\n- **Mypy** ( [`https://mypy-lang.org`](https://mypy-lang.org)\
  \ ) 是 Python 的一个实验性的、可选的静态类型检查器。已知静态类型语言对于大型代码库具有优于动态类型语言的优势。编译器能够及早检测到与类型相关的疏漏，这往往是救星。因此，在这个列表中看到这个工具并不意外。\n\
  \n上述工具为代码库的定性方面计算了定量代理指标。因此，它们只能报告并作用于可有效测量的指标。通常，软件开发工作中最重要的特质是难以甚至无法衡量的。与人相关的要素就属于这一类。下一节将更详细地解释这一现象。\n\
  \n## 上下文意识与沟通能力\n\n总的来说，我们可以识别出软件工程师中的三种主要人格类型^(⁷)：\n\n![../images/473947_1_En_3_Chapter/473947_1_En_3_Fig4_HTML.jpg](img/473947_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4\n\n最终的“完成”消息并不意味着业务目标已达成（经许可改编自 [2]）。结果的质量可能是合适的。\n\n![../images/473947_1_En_3_Chapter/473947_1_En_3_Fig3_HTML.jpg](img/473947_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n最终的“完成”消息并不意味着业务目标已达成（经许可改编自参考文献 [2]）。结果的质量也存疑。\n\n- **缺乏上下文与知识**  \n\
  \  接收者将盲目遵循指令，不会寻求进一步的澄清。这类人将凭猜测行事，而非基于事实做出决定。此外，由于缺乏知识，他们会根据自认为合适的方式，临时编造规则/原则。您或许会尝试过度的微观管理，这同样会给双方带来麻烦。这种行为如图\
  \ 3-3 所示。\n\n- **具备知识**  \n  这类人与前一类非常相似，唯一区别在于这类人拥有适当的知识，因此会遵守该学科的主要规则和原则。这种行为如图\
  \ 3-4 所示。\n\n- **具备上下文意识与知识**  \n  这类人通过根据需要主动提问，力求维持一个持续的反馈循环。这种行为如图 3-5 所示。\n\n\
  软件工程师必须意识到业务的语言，并以资金流动的方式与管理层沟通。否则，就有可能破坏开发与管理之间宝贵的反馈循环，导致形成两个孤立的派系（这在组织中经常发生）。这种分离会对业务成功产生不利影响。\n\
  \n提出正确的问题（问题本身就像图 3-5 中岛上的宝藏），恰当地阐述问题，并以业务的语言表达选择方案，对于维持宝贵的反馈循环至关重要。通过反馈循环实现质量有两个先决条件：有时间提问并创建替代设计方案，以及知道如何与业务（管理层）沟通。这两个条件通常被软件专业人士所忽视。\n\
  \n![../images/473947_1_En_3_Chapter/473947_1_En_3_Fig5_HTML.jpg](img/473947_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n这类人试图以高质量解决正确的问题（经许可改编自 [2]）\n\n\n\n### 降低圈复杂度\n\n`圈复杂度` 是一种度量指标，它会随着程序中备选执行流程数量的增加而升高。例如，每个条件语句都会提高该数值。复杂度较低的代码会拥有更低的圈复杂度数值。假设管理层决定通过允许开发者寻找简化当前代码的机会来降低代码库的圈复杂度。\n\
  \n很快，一位*对上下文和知识一无所知*的开发者偶然发现了对数组进行排序的函数，如代码清单 3-1 所示（参见 `cyclomatic_complexity`\
  \ 文件夹中的 `sort_original.py`）。目前，假设此功能是独一无二的，并且没有内置函数可以替代。\n\n```\ndef sort(data):\n\
  \    for i in range(len(data)):\n        for j in range(len(data)):\n          \
  \  if data[i] > data[j]:\n                data[i], data[j] = (data[j], data[i])\n\
  \    return data\n代码清单 3-1\n将输入数组按升序排序的函数\n```\n\n执行 `sort([-2, -4, 100, 3, 4.1])`\
  \ 后，该函数返回 `[100, 4.1, 3, -2, -4]`。当然，它也会改变输入的数组，因为它是就地排序。\n\n这位热心的开发者还在 Spyder 中运行了静态分析（本质上是运行\
  \ Pylint 工具）。报告如下：\n\n```\n************* Module sort_original\nC0304:  8,0: : Final\
  \ newline missing\nC0111:  1,0: : Missing module docstring\nC0111:  3,0: sort: Missing\
  \ function docstring\nC0200:  4,4: sort: Consider using enumerate instead of iterating\
  \ with range and len\nC0200:  5,8: sort: Consider using enumerate instead of iterating\
  \ with range and len\n\nYour code has been rated at 1.67/10\n```\n\n过了一段时间，他发现了一种“绝妙”的方法来降低圈复杂度，即消除内部的\
  \ `if` 语句（分数肯定会降低）。代码清单 3-2 展示了排序例程的“改进”版本。\n\n```\ndef sort(data):\n    for i in\
  \ range(len(data)):\n        for j in range(len(data)):\n            avg = (data[i]\
  \ + data[j]) / 2.0\n            diff = abs(data[i] - avg)\n            data[i] =\
  \ avg - diff\n            data[j] = avg + diff\n    return data\n代码清单 3-2\n圈复杂度更低的排序函数版本\n\
  ```\n\n执行 `sort([-2, -4, 100, 3, 4.1])` 后，该函数现在返回 `[100.0, 4.100000000000001, 3.0,\
  \ -2.0, -4.0]`（所以，它并不完全正确，但相当“接近”）。静态分析报告进一步有力地支持了开发者认为这是一项伟大成就的结论（他还很精明地修复了之前报告的新行结尾问题）：\n\
  \n```\n************* Module sort_new\nC0111:  1,0: : Missing module docstring\n\
  C0111:  3,0: sort: Missing function docstring\nC0200:  4,4: sort: Consider using\
  \ enumerate instead of iterating with range and len\nC0200:  5,8: sort: Consider\
  \ using enumerate instead of iterating with range and len\n\nYour code has been\
  \ rated at 5.00/10\n```\n\n总而言之，除了降低圈复杂度外，整体评估分数从 1.67 分飙升至惊人的 5 分！到底发生了什么？Pylint\
  \ 失效了吗？显然，最终结果与管理层的预期相去甚远。这段代码甚至无法正常工作了。\n\n##### 警告\n\n当基本的数学逻辑失效时，其他任何东西都无关紧要。在这个案例中，开发者认为蕴含关系等同于其逆否命题。这是错误的；也就是说，φ\
  \ ⇒ ψ ⇎ ψ ⇒ φ！较低的圈复杂度并不意味着代码的复杂度更低。其推论是，仅靠工具是不够的！人应该驱动工具，而不是工具驱动人。\n\n### 不确定性锥与提出问题的时机\n\
  \n*不确定性锥*表示在项目生命周期内最佳情况下估算误差减少的图形化模型（参见练习 3-1 并访问 [`https://www.construx.com/software-thought-leadership/books/the-cone-of-uncertainty`](https://www.construx.com/software-thought-leadership/books/the-cone-of-uncertainty)）。不确定性锥告诉我们，在一个管理良好的项目中，随着项目逐渐接近尾声，我们可以预期项目范围（规模、成本或功能）的变动性会降低。变动性降低意味着估算的可预测性和准确性更高。在项目开始时，变动性非常大（范围在\
  \ [0.25×, 4×] 之间）。任何 <1× 的值都表示低估，而任何 >1× 的值都表示高估。显然，1× 代表完全可预测。不确定性锥偏向于下限；换句话说，低估的倾向更高。\n\
  \n其理念是首先消除导致这种不可预测性的关键原因，从而尽可能快速地缩小锥体。以下事件是降低变动性的主要里程碑（我们从已经制定初步项目愿景开始列表）：\n\n*\
  \   初始概念\n*   已批准的产品定义\n*   市场要求完成\n*   详细技术要求完成且用户界面设计完成（预期变动性约为 [0.8×, 1.25×]）\n\
  *   详细设计完成\n\n项目负责人和软件工程师都必须区分*估算*和*承诺*。后者只有在锥体足够狭窄时（当变动性在 [0.8×, 1.25×] 范围内时）才被允许。过早做出承诺只会消耗您专注于质量的时间，因为不切实际的期望会导致压力和仓促的工作。此外，项目中的所有参与者都必须努力使锥体不断缩小。否则，它看起来更像是一片云，在项目整个过程中都保持同样高的变动性。锥体不会随着时间的推移而自行缩小。\n\
  \n根据做出承诺的时间点，存在三种可能的情况：\n\n*   **危险区域**：变动性在 [1.25×, 4×] 范围内，具有线性惩罚（根据帕金森定律，该定律指出人们总是会用一些工作来填满他们的时间）：\n\
  \    高估 ➟ 承诺不足 ➟ 低压 ➟ 中等质量\n\n*   **危险区域**：变动性在 [0.25×, 0.8×] 范围内，具有指数级惩罚：\n   \
  \ 低估 ➟ 过度承诺 ➟ 极端压力 ➟ 低质量\n\n*   **允许区域**：变动性在 [0.8×, 1.25×] 范围内，无惩罚：\n    良好估算 ➟\
  \ 良好承诺 ➟ 最佳压力 ➟ 高质量\n\n不确定性锥以及围绕估算和承诺的启发式方法，对于数据科学项目与任何其他软件项目同等重要。两者都是由利益相关者资助的，而这些利益相关者是根据项目计划做出决策的。\n\
  \n\n\n### 修复 Bug 与懂得如何提问\n\n本节将呈现一系列与企业环境中修复 Bug 相关的场景。假设在这些场景中，公司遵循现代敏捷方法所要求的实践。更具体地说，任何已报告的问题都会经历以下状态：\n\
  \n1.  在 Bug 跟踪系统中发现并报告问题。\n2.  评估工作量。\n3.  分配问题并设定优先级。\n4.  编写适当的单元测试。\n5.  修复 Bug，所有测试通过。\n\
  6.  设置状态并部署热修复。\n\n假设前三项已经完成，因此我们只需处理剩余的三项。针对清单 3-3（保存在 `bug_fixing` 文件夹下的 `double_preceding1.py`\
  \ 中）所示的代码报告了该 Bug。这段代码并不优美，其实现也没有反映出嵌入文档中强调的意图。\n\n```python\nfrom array import\
  \ array\ndef double_preceding(x: array) -> None:\n\"\"\"通过设置 x[i] = 2 * x[i-1] 和\
  \ x[0] = 0 来转换数组。\n>>> x = array('i', [5, 10, 15])\n>>> double_preceding(x)\n>>>\
  \ x\narray('i', [0, 10, 20])\n\"\"\"\nif x:\ntemp = x[0]; x[0] = 0\nfor i in range(1,\
  \ len(x)):\nx[i] = 2 * temp; temp = x[i]\n```\n\n清单 3-3 客户报告的包含缺陷的代码\n\n首要任务是编写单元测试，其中要包括能暴露该\
