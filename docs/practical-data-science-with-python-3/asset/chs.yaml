  \ = set()\n>>> path_finder = BasePathFinder(np.array([[(-2, 0), (3, 0), (2, 0),\
  \ (1, 0)]]))\n>>> path_finder.wall((0, 1))\nFalse\n>>> BasePathFinder.__abstractmethods__\
  \ = set()\n>>> path_finder = BasePathFinder(np.array([[(-2, 0), (3, 0), (2, 0),\
  \ (1, 0)]]))\n>>> path_finder.wall((-1, 0))\nTrue\n\"\"\"\ncurr_x, curr_y = position\n\
  length, width = self.terrain.shape[:2]\nreturn (curr_x < 0) or (curr_x >= length)\
  \ or (curr_y < 0) or (curr_y >= width)\n@abc.abstractmethod\ndef next_neighbor(self,\
  \ position: Tuple[int, int],\nvisited: Set[Tuple[int, int]]) -> Tuple[int, int]:\n\
  \"\"\"\nReturns the position of the lowest neighbor or the current position.\nArgs:\n\
  position: the pair of integers representing the ball's current position.\nvisited:\
  \ the set of visited points.\nOutput:\nThe position (pair of coordinates) of the\
  \ lowest neighbor .\n\"\"\"\n@abc.abstractmethod\ndef find_path(self, position:\
  \ Tuple[int, int],\nvisited: Set[Tuple[int, int]]) -> List[Tuple[int, int]]:\n\"\
  \"\"\nFinds the path that the ball would follow while descending in the terrain.\n\
  Args:\nposition: the pair of integers representing the ball's current position.\n\
  visited: the set of visited points (may be preset to avoid certain points).\nOutput:\n\
  The list of coordinates of the path.\n\"\"\"\nif __name__ == \"__main__\":\nimport\
  \ doctest\ndoctest.testmod()\n```\n\n**清单 5-1**  \n重构后的路径查找模块，采用了面向对象编程\n\n清单 5-2\
  \ 展示了我们实现该逻辑的首次尝试。\n\n\n\n```python\n\"\"\"简单的递归路径查找器实现。\"\"\"\nfrom typing import\
  \ List, Tuple, Set\nfrom pathfinder.base_pathfinder import BasePathFinder\n\nclass\
  \ SimplePathFinder(BasePathFinder):\n    \"\"\"使用递归且顺序执行的具体路径查找器。\"\"\"\n\n    def\
  \ next_neighbor(self, position: Tuple[int, int],\n                      visited:\
  \ Set[Tuple[int, int]]) -> Tuple[int, int]:\n        \"\"\"\n        采用从西南方向开始的简单顺时针邻居搜索。\n\
  \n        示例：\n        >>> path_finder = SimplePathFinder(np.array([[(-2, 0), (3,\
  \ 0), (2, 0), (1, 0)]]))\n        >>> path_finder.next_neighbor((0, 1), set((0,\
  \ 1)))\n        (0, 0)\n        \"\"\"\n        curr_x, curr_y = position\n    \
  \    current_slope = self.terrain[position][1]\n        min_altitude = self.terrain[position][0]\n\
  \        min_position = position\n        for delta_x in range(-1, 2):\n       \
  \     for delta_y in range(-1, 2):\n                new_position = (curr_x + delta_x,\
  \ curr_y + delta_y)\n                if not self.wall(new_position) and not new_position\
  \ in visited:\n                    new_altitude = self.terrain[new_position][0]\n\
  \                    if new_altitude < min_altitude:\n                        min_altitude\
  \ = new_altitude\n                        min_position = new_position\n        return\
  \ min_position\n\n    def find_path(self, position: Tuple[int, int],\n         \
  \         visited: Set[Tuple[int, int]] = None) -> List[Tuple[int, int]]:\n    \
  \    \"\"\"\n        递归地查找路径。\n\n        示例：\n        >>> path_finder = SimplePathFinder(np.array([[(-1,\
  \ 2), (-2, 1), (-2, 2), (1, 0)]]))\n        >>> path_finder.find_path((0, 2))\n\
  \        [(0, 2), (0, 1)]\n        \"\"\"\n        if visited is None:\n       \
  \     visited = set()\n        visited.add(position)\n        next_position = self.next_neighbor(position,\
  \ visited)\n        if position == next_position:\n            return [position]\n\
  \        return [position] + self.find_path(next_position, visited)\n\nif __name__\
  \ == \"__main__\":\n    import doctest\n    doctest.testmod()\n```\n代码清单 5-2：使用递归遍历地形的`SimplePathFinder`类\n\
  \n即使是这个简单的路径查找器，也比第 4 章中的初始变体复杂得多。它使用多维 Numpy 数组代替矩阵来表示地形数据，在`next_neighbor()`方法内部采用了不同的逻辑，并追踪了已访问的点。如果没有最后这一步，很容易引发无限递归。下一个代码单元进行了一个简单的测试，输出结果也已显示（标记为`>>>`）：\n\
