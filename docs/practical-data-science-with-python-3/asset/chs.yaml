  \ 4\nprint('Move top disk from', start, 'to\", end)\n^\nSyntaxError: EOL while scanning\
  \ string literal\n============ 1 failed in 2.16 seconds ========================\n\
  ```\n\n###### 重构模拟器的笔记本\n\n你应该始终寻求提高工件（artifact）的清晰度和结构。笔记本也不例外。当前这个笔记本包含大量 Python\
  \ 代码，这可能会分散用户对工作主要内容的注意力。我们将进行以下改进：\n\n1. 将 `wall`、`next_neighbor` 和 `find_path`\
  \ 函数移到一个名为 `pathfinder` 的独立包中。\n2. 将 `doctest` 调用移到我们的新包中。\n3. 将新包导入到我们的笔记本中（我们需要访问\
  \ `find_path` 函数）。\n4. 增加更多关于我们在做什么的解释，并附上一个格式优美的公式。\n\n在当前项目文件夹下创建一个名为 `pathfinder`\
  \ 的新文件夹。在 `pathfinder` 中创建一个新文件，并命名为 `pathfinder.py`。将 `wall`、`next_neighbor` 和\
  \ `find_path` 函数复制到此文件中。从笔记本中删除匹配的代码单元格。复制 `numpy` 和 `typing` 的导入语句（位于笔记本开头）。从笔记本中删除\
  \ `typing` 的导入。在 `pathfinder` 中创建一个名为 `__init__.py` 的文件（参见参考文献 [4]），并插入以下行：\n\n\
  ```\nfrom pathfinder.pathfinder import find_path\n```\n\n将笔记本中调用 `doctest` 的代码单元格的内容移出，并将其放在\
  \ `pathfinder.py` 末尾的以下 `if` 语句中：\n\n```\nif __name__ == \"__main__\":\n```\n\n\
  在笔记本的开头，插入以下 `import` 语句：\n\n```\nfrom pathfinder import find_path\n```\n\n此时，你的笔记本应该与之前功能相同。注意其整洁性。最后，在笔记本中添加以下文本作为第二句和第三句：\n\
  \n```\n它模拟了牛顿万有引力定律对球体运动的影响，公式为 $F=g\\frac{m_1m_2}{r²}$。其中，F 是物体之间的引力，$m_1$ 和 $m_2$\
  \ 是它们的质量，r 是两个物体质心之间的距离，g 是引力常数。\n```\n\n加粗部分是 LaTex 表达式（必须用 `$` 分隔）。执行文本单元格后，公式将很好地呈现，如图\
