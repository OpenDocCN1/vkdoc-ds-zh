  \ intercept], color=\"r\", lw=2, ls=\"--\")\n```\n\n请注意统一 API（如`fit`、`predict`等）的优势，它可以让我们与各种模型协作。即便是流水线（pipeline）也能以相同方式处理。清单\
  \ 7-3 展示了`session.py`模块中的`demo_metrics_and_mse`函数。它描述了使用不同噪声水平从观测数据重建参数的步骤。在没有噪声的情况下，我们得到的是确定性的线性回归。随着噪声增加，参数的估计会变差。\n\
  \n```python\nimport warnings\nwarnings.simplefilter(action='ignore', category=FutureWarning)\n\
