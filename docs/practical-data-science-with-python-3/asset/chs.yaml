  \n### 特征工程\n\n目前，我们拥有原始收盘价、原始成交量、波动率归一化的收盘价对数收益率以及成交量对数收益率作为特征（后续还将创建更多特征）。为了解这些特征对潜在目标变量（如预测股价变动）的影响，查阅皮尔逊相关系数\
  \ *r* 十分有用。该指标用于衡量两个特征之间的线性关系，取值范围为 [-1, 1]。正相关表示一个值增加/减少时，另一个值也同步变化；负相关则表示相反行为；值为零表示不存在线性关系（尽管变量间可能存在非线性关联）。通常，若\
  \ `|r| > 0.3`，则可认为相关性较为显著（此为经验判断，需谨慎参考此准则）。\n\n对数收益率反映了波动情况，探究这些收益率在特定时间段（如 *N*\
  \ 天）内是呈*均值回归*还是*趋势跟踪*特征具有重要意义。均值回归表明收益率围绕某个均值波动，而趋势跟踪则指其模仿近期走势。我们可以通过固定 `N` 值，计算过去与未来收益率之间的系数\
  \ `r` 来发现这一特征。若相关性较低，则表现为均值回归；反之则为趋势跟踪。清单 7-12 展示了报告相关系数并创建过去与未来价格及成交量对数收益率散点图的函数（另见练习\
  \ 7-3）。该函数调用 `scatter_time_series` 函数生成散点图（见清单 7-13）。\n\n```\ndef scatter_time_series(ts,\
  \ x, y):\n    ax = ts.plot(x=x, y=y, figsize=(9, 8), kind=\"scatter\", fontsize=12)\n\
  \    ax.set_title('自相关图', fontsize=19)\n    ax.set_xlabel(x, fontsize=15)\n    ax.set_ylabel(y,\
  \ fontsize=15)\n    plt.show()\n清单 7-13\n用于创建追踪自相关的散点图函数（data_visualization.py 模块）\n\
  ```\n\n```\nfrom data_visualization import *\ndef report_auto_correlation(ts, periods=5):\n\
  \    for column in filter(lambda str: str.endswith('_ret'), ts.columns):\n     \
