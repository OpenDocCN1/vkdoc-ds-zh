  ### 发现特征之间的关联


  前面提到的列是我们描述每个网页访客的基本特征。在我们深入探讨任何特征工程（即创建更具信息量的特征，例如前面提到的点击率）之前，我们必须了解现有特征之间是如何相互作用的。任何规则或模式都标志着特定的关联（关系）。可视化在这里非常有效，并且是对描述性统计（如最小值、最大值、均值等）的补充。SciPy
  生态系统提供了 Pandas 框架来处理表格数据，包括可视化功能，这正是我们这里所需要的（参见参考文献 [3]，其中对 Pandas 有极好的介绍）。回想一下，我们正处于
  EDA 阶段，因此不需要任何花哨的功能（第 6 章描述了更高级的可视化）。在控制台中输入以下代码片段：


  ```

  >> import pandas as pd

  >> nyt_data = pd.read_csv(''nyt1.csv'')

  >> nyt_data.head(n=10)

  Age  Gender  Impressions  Clicks  Signed_In

  0   36       0            3       0          1

  1   73       1            3       0          1

  2   30       0            3       0          1

  3   49       1            3       0          1

  4   47       1           11       0          1

  5   47       0           11       1          1

  6    0       0            7       1          0

  7   46       0            5       0          1

  8   16       0            3       0          1

  9   52       0            4       0          1

  ```


  `pd` 是 `pandas` 包的常用缩写（就像 `np` 是 `numpy` 的缩写一样）。`read_csv` 函数处理了解析 CSV 文件并形成合适的
  `DataFrame` 对象的所有繁琐细节。该对象是 Pandas 框架中处理二维数据的主要实体。`head` 方法以整洁的表格格式显示前指定数量的记录。请注意，我们的表格继承了
  CSV 文件中的列名。最左侧的数字是索引；默认情况下，它们是从 0 开始的记录编号，但下面的示例展示了如何轻松地重新定义它们。


  下一行显示了我们表格的整体维度：


  ```

