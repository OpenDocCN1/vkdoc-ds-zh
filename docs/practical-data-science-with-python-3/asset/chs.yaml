  ## 引言\n\n本书以务实的方式融合了数据科学与软件工程。它引导读者了解这两个领域中的主题，并通过软件实例阐述概念。作为读者，您将深入了解教科书很少涉及的内容，因为这些内容难以解释和阐明。您将通过示例看到\
  \ Cynefin 框架的实际应用，这些示例为您的数据科学工作提供了全局背景和系统化方法。\n\n本书还向您介绍了最实用的 Python 3 数据科学框架和工具：`Numpy`、`Pandas`、`scikit-learn`、`matplotlib`、`Seaborn`、`Dask`、`Apache\
  \ Spark`、`PyTorch` 以及其他辅助框架。所有示例都是独立的，允许您重现书中的每一部分内容，包括图表。每章末尾的练习会指导您如何进一步加深理解。\n\
  \n最后，本书再次通过大量示例，解释了数据科学生命周期模型的所有阶段：从项目启动到数据探索和回顾。其目的是让您掌握数据科学主要领域的必要知识，以便您能够*见树又见林*。\n\
