  ### 下载数据集


  你现在应该下载数据集并解压它。你可以手动、通过 shell 脚本或从 Python 中（列举几种选项）完成此操作。我选择了最后一个选项来演示 Python 中的一些技巧，尽管我更喜欢用
  bash 脚本处理这类事情。清单 2-1 展示了下载脚本 `nyt_data.py`，它负责下载数据集并执行必要的清理工作。注意它是如何解压包含我们数据的嵌入式
