  >>\n>> %time calc_path = path_finder.find_path((0, 0))\nCPU times: user 53 μs, sys:\
  \ 39 μs, total: 92 μs\nWall time: 105 μs\n>>\n>> %time calc_paths = path_finder.find_paths([(0,\
  \ 0), (0, 2000)])\nCPU times: user 44.6 ms, sys: 1.75 ms, total: 46.3 ms\nWall time:\
  \ 45.1 ms\n>>\n>> %time calc_path = path_finder.find_path((0, 3000))\n...省略行...\n\
  RecursionError: maximum recursion depth exceeded\n```\n\n\n好的，这是根据您的要求翻译后的中文版本。\n\
  \n\n好吧，我们甚至无法超过 3000 点。让我们摆脱递归，继续我们的测试运行。清单 5-10 展示了简单寻路器类的非递归版本。这个修订版无法与递归思想的优雅性相媲美，但在这里我们无法选择最自然的问题解决范式。在纯函数式语言中，情况会有所不同。\n\
  \n```python\n\"\"\"Simple nonrecursive path finder implementation.\"\"\"\nfrom typing\
  \ import List, Tuple, Set\nfrom pathfinder.simple_pathfinder import SimplePathFinder\n\
  class NonRecursiveSimplePathFinder(SimplePathFinder):\n\"\"\"Concrete path finder\
  \ that doesn't use recursion.\"\"\"\ndef find_path(self, position: Tuple[int, int],\n\
  visited: Set[Tuple[int, int]] = None) -> List[Tuple[int, int]]:\n\"\"\"\nIteratively\
  \ finds the path (without using recursion).\nExample:\n>>> path_finder = NonRecursiveSimplePathFinder(np.array([[(-1,\
  \ 2), (-2, 1), (-2, 2),➥\n(1, 0)]]))\n>>> path_finder.find_path((0, 2))\n[(0, 2),\
  \ (0, 1)]\n\"\"\"\nif visited is None:\nvisited = set()\nvisited.add(position)\n\
  calculated_path = [position]\nnext_position = self.next_neighbor(position, visited)\n\
  while position != next_position:\nposition = next_position\nvisited.add(position)\n\
  calculated_path.append(position)\nnext_position = self.next_neighbor(position, visited)\n\
  return calculated_path\nif __name__ == \"__main__\":\nimport doctest\ndoctest.testmod()\n\
  清单 5-10\n非递归的简单寻路器，理论上能处理所有起始位置\n```\n\n以下语句示例了这个新类：\n\n```python\n>> from pathfinder\
  \ import NonRecursiveSimplePathFinder\n>> path_finder = NonRecursiveSimplePathFinder(test_terrain)\n\
  >>\n>> %time calc_paths = path_finder.find_paths([(0, 0), (1000, 1000)])\nCPU times:\
  \ user 1min 46s, sys: 830 ms, total: 1min 46s\nWall time: 1min 46s\n```\n\n非递归版本能够处理更长的路径，在使用\
  \ Python 编程时这不应让我们感到惊讶（递归变体依赖于*尾递归*，这在纯函数式语言中开销不高）。尽管如此，从点`(1000, 1000)`到最低点的运行时间已经异常缓慢。没有必要尝试更长的距离。\n\
  \n#### 性能优化\n\n如果我们在实际工作前只是宣布一个模糊的目标，比如“代码必须运行得更快”，那么我们的优化尝试很可能会失败。我们必须满足以下所有条件：\n\
  \n*   识别出代码的瓶颈和关键部分；必须在性能分析器下运行你的代码。\n*   需要改进的用例是显而易见的；这定义了优化的整体上下文。人们经常针对生产环境中永远不会出现的场景进行优化。\n\
  *   代码库的结构具有足够的质量，并包含测试，以避免回归和混乱。\n\n图 5-6 展示了一个用户与我们的系统之间的典型操作序列；我们将只关注一个特定用户，但请记住，我们的服务需要并行支持多个用户。从这个用例中，我们可以得出结论：许多模拟将在同一地形上进行。所有这些运行都可以并行执行，因为模型是静态的（地形数据不会以任何方式更改）。对于动态设置，情况将有所不同。\n\
  \n以下是同时计算多条路径的分析会话的输出：\n\n![../images/473947_1_En_5_Chapter/473947_1_En_5_Fig6_HTML.jpg](img/473947_1_En_5_Fig6_HTML.jpg)\n\
  \n**图 5-6** 此交互序列将为每个用户独立发生\n\n```python\n>> %prun calc_paths = path_finder.find_paths([(0,\
  \ 0), (0, 10), (0, 100), (0, 1000),➥\n(2, 10), (1000, 1000)])\n150598334 function\
  \ calls in 145.934 seconds\nOrdered by: internal time\nncalls  tottime  percall\
  \  cumtime  percall  filename:lineno(function)\n5022106   84.972    0.000  136.366\
  \    0.000  simple_pathfinder.py:9(next_neighbor)\n45198954   39.729    0.000  \
  \ 45.899    0.000  base_pathfinder.py:26(wall)\n90333057   11.665    0.000   11.665\
  \    0.000  base_pathfinder.py:21(terrain)\n6    5.339    0.890  143.266   23.878\
  \  non_recursive_simple_pathfinder.py:9(find_path)\n1    2.505    2.505  145.933\
  \  145.933  :1()\n5022106    1.051    0.000    1.051    0.000  {method 'add' of\
  \ 'set' objects}\n5022100    0.510    0.000    0.510    0.000  {method 'append'\
  \ of 'list' objects}\n1    0.162    0.162  143.428  143.428  base_pathfinder.py:90()\n\
  1    0.001    0.001  145.934  145.934  {built-in method builtins.exec}\n1    0.000\
  \    0.000  143.428  143.428  base_pathfinder.py:79(find_paths)\n1    0.000    0.000\
  \    0.000    0.000  {method 'disable' of '_lsprof.Profiler' objects}\n```\n\n我们假设并优化每种地形的试验次数很多（>>\
  \ 1）的情况。这可能会对每种地形只模拟一次的极端情况产生负面影响。再次，这是一个很好的例子，说明为什么你应该明确你的用例。\n\n优化程序有三种策略：\n\n\
  *   消除或减少对方法的调用次数。\n*   加快方法的速度。\n*   结合前两个选项。\n\n显然，有大量的调用针对`terrain`属性和`wall`方法。这些调用完全发生在`next_neighbor`方法中，而该方法针对路径中的每个点被调用一次。如果将来计算下一个点会变得计算密集，那么我们可以通过在初始化期间预处理地形（见图\
  \ 5-6）来消除反复“重新计算”地形的需要。之后，我们只需通过查询索引来获取下一个点。在某种意义上，你可以将其视为一种*记忆化*。图 5-7 直观地描绘了这个想法。当然，其缺点是会消耗额外的内存来存储预处理的数据。显然，只有当在同一地形上进行大量模拟、且其实时处理代价高昂时，这样做才是有益的。否则，这完全是浪费时间和内存。我们将只加速`next_neighbor`方法，而将预处理留作额外的练习。\n\
  \n![../images/473947_1_En_5_Chapter/473947_1_En_5_Fig7_HTML.jpg](img/473947_1_En_5_Fig7_HTML.jpg)\n\
  \n**图 5-7**\n\n\n\n在这里，模拟过程中根本没有使用原始地形数据。\n\n`next_neighbor()` 方法仅根据当前位置读出下一个点。预处理通过遍历每个点并存储其最佳邻居（如果球无法前往任何其他地方，则该邻居也可能是当前点）来完成。例如，索引单元\
  \ `(1, 5)` 引用了下一个邻居，其值为 `(2, 4)`。读取 `(1, 5)` 处的原始地形数据可以获得该点的海拔和坡度。\n\n对于列表中的每个起始位置，`find_path()`\
  \ 方法都会被调用同样多次。如果我们可以并行化 `find_path()` 的执行，那么就能减少 `find_paths()` 方法的执行时间。\n\n总而言之，我们有了一个计划，并且已经准备好实施了。此时，我们必须从复用的角度重新思考如何推进构建过程。我们绝对应该依赖某个成熟的框架，因为并行和分布式计算领域有丰富的选择。以下是我们对新框架的期望需求：\n\
  \n-   它必须同时支持显式和隐式并行。因此，我们寻找的不仅仅是能够让我们触及多个核心或机器的抽象。例如，Apache Spark 通过*弹性分布式数据集*\
  \ 抽象暴露了一个直截了当的模型，但迫使我们以特定方式构建问题。对于任意复杂的逻辑，我们需要更接近通用框架的东西，比如 Python 中的 `multiprocessing`。\n\
  -   我们不想重写大量现有代码，也不想切换到另一个运行时环境。例如，基于 JVM 的技术就不是首选。\n-   理想情况下，我们希望在使用新抽象时保留当前的\
  \ API。这也会减少学习时间。\n\n事实证明，有一个开源框架符合我们的期望。Numba（参见 [`http://numba.pydata.org`](http://numba.pydata.org)）是一个即时（JIT）编译器，它可以将包含\
  \ Numpy 代码的 Python 函数转换为机器码。它没有特殊的预编译阶段。你只需注释你想要加速的函数即可。Numba 与 Dask 无缝集成，甚至可以生成行为类似于内置\
  \ Numpy 函数的通用函数。当你有包含大量条件判断的复杂业务逻辑时，能够加速任意函数就非常重要。在这种情况下，任何粗糙的并行化方案都会变得难以应用。最后，使用\
  \ Numba 你还可以针对 GPU 进行优化，这对于获得顶级性能同样至关重要。\n\n清单 5-11 展示了新的 `ParallelSimplePathFinder`\
  \ 类。它使用继承自 `next_neighbor()` 方法的逻辑来创建索引，因此球移动的规则保持不变。提升性能所需的全部工作就是那个简单的装饰器（`@jit`）。当然，你需要了解\
  \ `jit` 装饰函数内容的约束条件。这就是为什么你应该始终设置 `nopython=True`（否则你不会收到警告）。\n\n```\n\"\"\"Efficient\
  \ parallel version of the path finder system.\"\"\"\nfrom typing import Tuple, Set\n\
  import numpy as np\nfrom numba import jit\nfrom pathfinder.non_recursive_simple_pathfinder\
  \ import NonRecursiveSimplePathFinder\n\nclass ParallelSimplePathFinder(NonRecursiveSimplePathFinder):\n\
  \"\"\"Concrete path finder that uses Numba to perform operations in parallel.\"\"\
  \"\n\n@staticmethod\n@jit(nopython=True, parallel=True, cache=True)\ndef _best_neighbor(terrain:\
  \ np.ndarray, position: Tuple[int, int]) -> Tuple[int, int]:\ncurr_x, curr_y = position\n\
  length, width = terrain.shape[:2]\ncurrent_slope = terrain[position][1]\nmin_altitude\
  \ = terrain[position][0]\nmin_position = position\nfor delta_x in range(-1, 2):\n\
  for delta_y in range(-1, 2):\nnew_position = (curr_x + delta_x, curr_y + delta_y)\n\
  new_x, new_y = new_position\nif not ((new_x = length) or\n(new_y >= width)) and\
  \ not new_position == position:\nnew_altitude = terrain[new_position][0]\nif new_altitude\
  \ < min_altitude:\nmin_altitude = new_altitude\nmin_position = new_position\nreturn\
  \ min_position\n\ndef next_neighbor(self, position: Tuple[int, int],\nvisited: Set[Tuple[int,\
  \ int]]) -> Tuple[int, int]:\n\"\"\"\nUses a vectorized clockwise search of neighbors\
  \ starting at south-west.\n\nExample:\n>>> terrain = np.array([[(-2, 0), (2, 0),\
  \ (2, 1), (3, 1)]])\n>>> path_finder = ParallelSimplePathFinder(terrain)\n>>> path_finder.next_neighbor((0,\
  \ 2), set((0, 2)))\n(0, 1)\n\"\"\"\nbest_neighbor = ParallelSimplePathFinder._best_neighbor(self.terrain,\
  \ position)\nif not best_neighbor in visited:\nreturn best_neighbor\nreturn position\n\
  \nif __name__ == \"__main__\":\nimport doctest\ndoctest.testmod()\n```\n\n**清单 5-11**\
  \ 使用 Numba 的性能调优路径查找器类\n\n现在，让我们重复在基线版本中使用的命令（`path_finder` 变量指向我们的新类）：\n\n```\n\
  >> %time calc_paths = path_finder.find_paths([(0, 0), (1000, 1000)])\nCPU times:\
  \ user 8.42 s, sys: 395 ms, total: 8.82 s\nWall time: 8.81 s\n```\n\n因此，执行时间从 1\
  \ 分 46 秒降到了 8.82 秒！这是一个超过 10 倍的改进。好消息是，还有大量进一步减少运行时间的可能性（前面提到的索引就是其中之一）。\n\n###\
  \ 版本 1.3 回顾\n\n这个版本旨在向你展示一个结构良好的代码库如何帮助系统演进。我们在每次迭代中只做了很小的修改，无需花费时间与混乱代码作斗争。Python\
  \ 世界充满了等待被复用的框架。你必须避免被其中任何一个过度影响的危险。为了确保你的程序始终能够接受额外的增强，你必须控制并评估其高效运行所需的条件，并避免添加有依赖关系的功能。这结束我们关于这个项目的一系列迭代。图\
  \ 5-8 显示了这最后一个版本的雷达图。\n\n![../images/473947_1_En_5_Chapter/473947_1_En_5_Fig8_HTML.jpg](img/473947_1_En_5_Fig8_HTML.jpg)\n\
  \n**图 5-8** 现在性能令人满意，这使我们能够添加新的、复杂的功能。\n\n\n\n## 抽象 vs. 潜在特征\n\n到目前为止，我们一直在与软件抽象打交道：框架、类、数据结构等。抽象是我们应对复杂性的主要机制。在适当的抽象层次上处理实体既能提升效率也能保证质量。这些软件抽象都是显式的，因为我们亲手创建了它们。在本节中，你将看到另一类完全不同的抽象，它们会在幕后自然涌现。我们甚至不知道它们代表什么，尽管我们对其产生过程的原理了如指掌。这类产物通常被称为*潜在特征*。\n\
  \n潜在特征能以更简洁的方式描述原始数据；通过使用它们，我们可以在多个方面实现高压缩。除了降低数据量本身，更重要的是，我们可以减少数据集中的维度数量。这直接降低了复杂性，因为许多机器学习算法在低维空间中表现更好（我们将在第\
  \ 7 章讨论机器学习）。\n\n压缩过程可分为两种基本类型：完全可解释型和部分可解释型。在第 2 章中你已经见识了前者，即通过应用数理统计获得了更紧凑的数据表示。换句话说，我们在保留所有关于客户行为的相关细节的同时对数据集进行了总结。在本节中，你将看到一个部分可解释型压缩过程的示例。\n\
  \n如今，解决方案的可解释性是一个非常重要的议题（参考文献 [1] 对此进行了很好的回顾）。例如，许多公司想知道推荐系统为何以及如何向用户推荐特定商品。你不能仅仅回应说这是由一台利用著名矩阵分解技术的机器决定的。当你开始设计新系统时，请记住潜在特征的这个副作用。\n\
  \n### 压缩评分矩阵\n\n假设你正在构建一个推荐系统，并将用户对商品的评分存储在矩阵 *R* 中。每一行代表一个用户，每一列代表一个商品。对于用户 `u`\
  \ 和商品 `i`，你可以通过查看矩阵中对应的单元格轻松找到评分 `r[ui]`。显然，许多单元格会是空的，因为用户只会对极少数商品进行评分。随着用户和商品数量达到数百万级，这个矩阵可能会变得极其庞大（即使你将其存储为稀疏矩阵）。显然，没有任何商业推荐系统会使用这种原始矩阵。\n\
  \n线性代数中有一个定理指出：任何秩为 `k` 的矩阵 `R[mxn]` 都可以分解为三个子矩阵 `U[mxk]`、`S[kxk]` 和 `V[kxn]`，使得\
  \ `R = USV^T`。`U` 和 `V` 的列是两两正交的，矩阵 `S` 是对角矩阵（其元素称为*奇异值*）。现在，神奇之处与选择潜在特征的数量 `d <\
  \ k` 有关，这样我们就可以舍弃 `U`、`S` 和 `V` 中的大部分元素。当然，目标仍然是能够近似重构原始矩阵 `R`。其目的是高效计算用户与尚未被评分商品之间的预测评分（我们假设采用多值评分方案，例如星级评分）。^(¹⁵)\n\
  \n下面来自 Spyder 控制台的代码片段创建了一个随机稠密评分矩阵 `R`，将其分解为子矩阵，并展示了在低维情形下（当 `d < rank(R)` 时）会发生什么：\n\
  \n```\n>> m = 10, n = 6\n>> np.random.seed(10)\n>> a = np.random.randint(1, 5, size=(m,\
  \ n))\n>> a\narray([[2, 2, 1, 4, 1, 2],\n[4, 1, 2, 2, 1, 2],\n[2, 3, 1, 2, 1, 3],\n\
  [1, 3, 1, 4, 1, 1],\n[4, 4, 3, 1, 4, 3],\n[3, 2, 1, 1, 3, 2],\n[4, 3, 2, 2, 2, 4],\n\
  [2, 3, 2, 1, 3, 3],\n[3, 2, 1, 2, 4, 2],\n[1, 4, 3, 2, 2, 3]])\n>>\n>> np.linalg.matrix_rank(a)\n\
  \n>>\n>> u, s, vt = np.linalg.svd(a, full_matrices=True)\n>> u.shape, s.shape, vt.shape\n\
  ((10, 10), (6,), (6, 6))\n>>\n>> s\narray([18.30683743,  4.73046021,  3.60649612,\
  \  2.79133251,  1.65155672, 0.97798699])\n>>\n>> np.allclose(a, np.dot(u[:, :n]\
  \ * s, vt))\nTrue\n>>\n>> d = 5\n>> np.allclose(a, np.dot(u[:, :d] * s[:d], vt[:d]))\n\
  False\n>>\n>> np.allclose(a, np.dot(u[:, :d] * s[:d], vt[:d]), atol = 0.3)\nTrue\n\
  >>\n>> u[:1, :d]\narray([[-0.26299616, -0.50400408,  0.2691205 ,  0.10395761,  0.06633331]])\n\
  ```\n\n奇异值按降序排列，我们保留了前五个潜在特征。当然，我们无法再在低维空间中精确重构 `R`，但我们可以相当准确地估计其值。评分本身包含噪声，我们的目标并非找出已知值。任务是预测未知评分，为此，对\
  \ `R` 的近似已经足够。上面最后一行显示了用户 1 的降维向量。它由五个潜在特征表示，这些特征在某种程度上标识了用户的\"品味\"。在没有进一步深入分析的情况下，我们无从得知它们具体代表\"\
  品味\"的哪一方面。\n\n这个例子仅触及推荐系统的皮毛，但我希望你已经掌握了核心思想。^(¹⁶) 你会在各处遇到潜在特征；主成分分析方法和神经网络都基于它们。从某种意义上说，你不再需要自己进行特征工程，而是将这项工作交给机器来完成。\n\
  \n### 练习 5-1. 随机路径查找器\n\n`SimplePathFinder` 类按预定义顺序访问潜在邻居。因此，它每次都会生成相同的路径（假设起始位置不变）。这不太符合真实世界的情况，而且是一种无聊的行为。\n\
  \n创建一个新类 `RandomSimplePathFinder`，作为 `SimplePathFinder` 的子类，并重写 `next_neighbor`\
  \ 方法。如果有多个同等优秀的候选点，它应该随机选择下一个点。如果你认为这样可以减少代码重复，请随意重构父类。\n\n### 练习 5-2. 更可复用的交互监视器\n\
  \n`InteractionMonitor` 类接收一个文本区域，每当用户选择新的起始位置时，就更新其 `value` 属性。这当时是为了我们的目的而设计的，但在其他情况下可能不适用。\n\
  \n改进此类，使其更具可复用性。一种选择是接收一个函数（而不是该信息区域），该函数接受一个表示所选起始位置的元组参数。这样，用户就可以完全控制选择过程。一个很好的用例是选择多个点。这些点可以由你的自定义函数收集，直到达到所需数量为止。之后，你的函数将在\
  \ `InteractionMonitor` 实例上调用 `stop` 方法。\n\n\n\n## 总结\n\n本章展示了软件工程方法与数据科学特有的方法及概念是如何相互作用的。你已经看到，在多个相互关联的维度上取得进展需要精心的规划和实现。这些维度包括性能、输入、输出、数据和算法。雷达图非常便于你保持条理清晰，并能直观地展示当前系统的优势和劣势。你应该已经潜移默化地领会了主要信息：一旦你在某个特定领域开始尝试复杂操作，事情就会变得混乱。这正是小规模有效的方法未必适用于大规模情况的主要原因。\n\
  \n还有很多框架我们甚至没有提及，但所有框架都应像本章中处理`Numba`一样对待。接下来两段将简要介绍几个值得注意的框架，在后续章节中你还会遇到一些非常强大的框架，例如用于深度神经网络的`PyTorch`（见第\
  \ 12 章）。我们还会在第 11 章回到`Dask`的话题。\n\n`Dask`（参见[`https://dask.org`](https://dask.org)）是一个用于\
  \ Python 并行计算的库（参阅参考文献[1]和[2]可获得极佳的概述）。`Dask`对数值计算的 Python 生态系统（包括`Numpy`、`Pandas`和`Scikit-Learn`）进行并行化。你可以利用`Dask`的隐式和显式并行化能力。此外，`Dask`还能管理无法装入内存的数据，并扩展计算能力以在分布式集群中运行。`Dask`引入了新的抽象，这些抽象模仿了`SciPy`生态系统中底层实体的\
  \ API。例如，使用`dask`数组，你可以在后台处理多个较小的`Numpy`数组，同时使用熟悉的`Numpy` API。有一些需要注意的事项。例如，不要尝试使用`vindex`方法（在`dask`数组上实现花式索引）来切片大型`dask`数组。无论如何，将`Dask`和`Numba`结合起来，可以为你提供一个非常强大的组合，用于扩展你的数据科学产品。\n\
  \n`Luigi`（参见[`https://github.com/spotify/luigi`](https://github.com/spotify/luigi)）是一个用于构建复杂批处理作业管线的框架，并内置了对\
  \ Hadoop 的支持（这体现了协调不同框架的能力）。另一方面，`Apache Nifi`（参见[`https://nifi.apache.org`](https://nifi.apache.org)）可用于生成可扩展的数据管线。如你所见，这两个框架解决不同的问题，尽管根据你的需求，它们可能被编排在一起协同工作。\n\
  \n"
- "# 6. 数据可视化\n\n可视化是深入了解数据和底层流程的强大方法。在探索阶段广泛应用，以更好地理解数据的结构。结果的可视化展示也是传达关键发现的有效方式；人们通常更容易掌握漂亮且信息丰富的图表，而不是理解隐藏在复杂表格形式中的事实。当然，这并不意味着可视化应该取代其他方法；最佳效果是通过明智地结合多种描述数据和结果的方式来达到的。可视化主题本身非常广泛，因此本章聚焦于两个在其他地方不常讨论的方面：可视化如何帮助优化应用程序，以及如何为高速数据创建动态仪表板。你可以在本书中找到其他用途的例子。\n\
  \n可视化应贯穿于数据科学的过程和产品。它不能被当作一个孤立的实体来对待，更不应被简化为花哨的图表。在这方面，我反感任何僵化的分类，也不喜欢将何种可视化适用于不同场景进行模板化。关于使用各种图表类型对变量进行编码（见参考文献[1]），有一些通用指南，应尽可能遵循。尽管如此，主要信息是：如果可视化有助于从数据中获得可操作的见解，那么它就是有用的。\n\
  \n算法是做数据科学和处理大数据的基础。这一点将在下一个案例研究中得到证明。算法指明了程序的渐近行为（通常用大 O 表示法表示），而包括并行和分布式计算在内的技术则驱动着常数因子。我们将应用各种类型的可视化来展示这些特性。需要强调的是，*程序*的概念可能象征着许多不同类型的计算。计算特征就是其中一种类型。一个快速的算法可以使你的模型在批处理和在线模式下都能正常运行。有关使用交互式可视化展示数据结构和算法实现的例子，你可以访问\
  \ Data Structure Visualizations 网站（参见[`https://www.cs.usfca.edu/~galles/visualization`](https://www.cs.usfca.edu/%257Egalles/visualization)）。另一个值得探索的有趣网站是\
  \ Python Tutor，它用于可视化 Python 程序的执行（访问[`https://pythontutor.com`](https://pythontutor.com)）。该网站还提供了学习其他流行语言（如\
  \ JavaScript、C++、Java 等）的类似站点链接。\n\n生成静态图表与尝试描绘持续变化数据的主要特征完全不同。这将是本章第二部分的主题。高效的仪表板通过可视化业务指标实现对流程的实时监控，以便操作人员能够及时采取行动。\n\
  \n## 可视化温度数据案例研究\n\n本节旨在阐明`matplotlib`的架构，它是最著名的 Python 可视化框架（你应该阅读[`http://aosabook.org/en/matplotlib.html`](http://aosabook.org/en/matplotlib.html)上的权威指南）。为了使主题更易于理解，我们将使用\
  \ NOAA 全球历史气候学网络 - 每日数据（GHCN-Daily）版本 3 中的一个公开样本数据集。该样本数据集包含 2010 年 1 月来自单个站点的测量数据。它在本章的源代码中提供，但你也可以直接从[`https://www1.ncdc.noaa.gov/pub/data/cdo/samples/GHCND_sample_csv.csv`](https://www1.ncdc.noaa.gov/pub/data/cdo/samples/GHCND_sample_csv.csv)下载。对于每一天，我们将使用表示最低和最高温度读数的列，单位为十分之一摄氏度。该站点的纬度和经度在相应命名的列中表示。\n\
  \n图 6-1 展示了 `matplotlib` 生态系统的主要组件。许多复杂的扩展都是在其基础上构建的，例如 `Seaborn` 库（你将在后续章节中看到它的实际应用）。你可能想知道为什么\
  \ `Pandas` 会出现在这里。嗯，它有自己的可视化子系统，直接依赖于 `matplotlib`。`Matplotlib` 还带有一个简单的脚本库 `pyplot`。它用于快速解决方案，在探索性数据分析期间尤其有用。\n\
  \n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig1_HTML.jpg](img/473947_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n一些位于 `matplotlib` 之上的更高级组件，`matplotlib` 本身可进一步细分为更小的、你可以引用的单元。\n\n\n\n\
  ### 在地图上显示站点\n\n清单 6-1 展示了使用数据源（本例中唯一的温度传感器）生成地理地图的函数。代码使用了 `mplleaflet` Python\
  \ 库，将 `matplotlib` 绘图转换为 `Leaflet` 地图（参见 [`https://leafletjs.com`](https://leafletjs.com)）。`temp_plots`\
  \ 文件夹内的 `plot_stations.py` 模块用于在地图上显示数据源。它通过 `pyplot` 以脚本方式使用 `matplotlib`。\n\n\
  ```\nimport matplotlib.pyplot as plt\nimport mplleaflet\ndef plot_stations(longitudes,\
  \ latitudes, embedded = False):\nif embedded:\nplt.figure(figsize = (8, 8))\nplt.scatter(longitudes,\
  \ latitudes,\nc = 'b',\nmarker = 'D',\nalpha = 0.7,\ns = 200)\nreturn mplleaflet.display()\
  \ if embedded else mplleaflet.show()\n```\n\n*清单 6-1: 在地图上显示数据源的模块*\n\n`embedded`\
  \ 参数应设置为 `True`，以便在 Jupyter notebook 中以行内形式包含生成的地图。清单 6-2 展示了驱动代码的第一部分。\n\n```\n\
  import pandas as pd\ndf = pd.read_csv('GHCND_sample_csv.csv',\nusecols = [3, 4,\
  \ 5, 6, 7],\nindex_col = 2,\nparse_dates = True,\ninfer_datetime_format = True)\n\
  df['TMIN'] = df['TMIN'] / 10\ndf['TMAX'] = df['TMAX'] / 10\nprint(df.head())\nfrom\
  \ plot_stations import plot_stations\nplot_stations(df['LONGITUDE'].tolist()[0],\
  \ df['LATITUDE'].tolist()[0])\n```\n\n*清单 6-2: `temp_visualization_demo.py` 模块的第一部分*\n\
  \n执行此代码时，输出如下：\n\n```\nLATITUDE  LONGITUDE  TMAX  TMIN\nDATE\n2010-01-01   48.0355\
  \     -98.01 -17.8 -31.1\n2010-01-02   48.0355     -98.01 -24.4 -32.2\n2010-01-03\
  \   48.0355     -98.01 -19.4 -28.9\n2010-01-04   48.0355     -98.01 -16.7 -20.0\n\
  2010-01-05   48.0355     -98.01 -13.3 -16.7\n```\n\n图 6-2 展示了生成的交互式地图，其中的蓝色菱形代表温度传感器。您还会在当前工作目录中找到\
  \ `_map.html` 文件。该文件由 `mplleaflet.show()` 自动创建（可以更改输出文件名）。\n\n### 绘制温度图\n\n现在我们将绘制最低和最高温度，并叠加标记出摄氏温度极高（>\
  \ 0）和极低（< –30）的点。为了使图表更有用，我们还将添加一个额外的 y 轴来显示华氏温度。这次代码依赖于 `matplotlib` 和 Pandas 的可视化功能，并演示了如何在不同的抽象层之间切换。清单\
  \ 6-3 展示了驱动代码的第二部分，它准备数据并调用我们的自定义绘图函数，该函数如清单 6-4 所示，并显示在图 6-3 中。此解决方案稍作修改后也可用于其他场景（例如，更改轴标题、调整刻度等）。\n\
  \n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig2_HTML.jpg](img/473947_1_En_6_Fig2_HTML.jpg)\n\
  \n*图 6-2: 带有温度传感器的交互式地图（仅用几行代码即可获得的相当显著的结果）*\n\n```\nmin_temp = df['TMIN'].min()\n\
  max_temp = df['TMAX'].max()\nprint(\"\\nMinimum temperature: %g\\nMaximum temperature:\
