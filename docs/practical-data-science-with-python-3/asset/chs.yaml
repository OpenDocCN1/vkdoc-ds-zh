  如第 1 章所述，这些添加工作最好先为项目创建一个自定义环境来处理。现在启动 JupyterLab 并加载你的笔记本。在新的代码单元格中输入以下内容：\n\n\
  ```\ninteract(lambda start_x, start_y: find_path(terrain, (start_x, start_y)),\n\
  start_x = widgets.IntSlider(value=1, max=terrain.shape[0]-1, description='起始 X'),\n\
  start_y = widgets.IntSlider(value=1, max=terrain.shape[1]-1, description='起始 Y'));\n\
  ```\n\n执行此单元格后，你将看到两个带有标签的滑块，用于设置弹球的初始位置（`X` 代表行，`Y` 代表列）。每次移动滑块，系统都会输出一条新的路径。由于滑块的配置与地形形状相匹配，因此不可能提供无效的起始位置。本书源代码包中包含的笔记本还提供了一些叙述性内容，用于在单独的章节中展示结果。\n\
