  \n*   具有最低海拔的相邻点即为最低相邻点。\n*   如果当前点的坡度大于零，则具有相同海拔的相邻点（若其他点海拔更高）即为最低相邻点。\n*   如果存在多个满足上述条件的相邻点，则从西南方向开始，按顺时针方向选择其中一个。\n\
  \n我们显然不需要蓝色分量（坡向）。下一行代码将此层设置为零：\n\n```python\nterrain[:, :, 2] = 0\n```\n\n####\
