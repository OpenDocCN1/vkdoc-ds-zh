  \ 这一特征也被从数据中删除了。\n\n\n\n#### 使用 PyTorch 实现\n\n清单 12-3 提供了我们简单神经网络的完整实现，但这次使用的是 PyTorch。PyTorch\
  \ 帮助你减少需要编写的代码量，从而使产品更易于维护。同时，你在实现中引入微妙错误的可能性也更小。最重要的是，PyTorch 拥有大量强大的功能，例如对深度神经网络的支持，包括卷积网络、循环网络、门控循环网络和长短期记忆网络。由于训练深度神经网络的计算量相当大，PyTorch\
  \ 允许你利用机器上的 GPU（只要你的环境也支持 CUDA 编程模型）。\n\n![../images/473947_1_En_12_Chapter/473947_1_En_12_Fig5_HTML.jpg](img/473947_1_En_12_Fig5_HTML.jpg)\n\
  \n图 12-5\n\n测试数据的实际输出和预测输出\n\n```\nfrom collections import OrderedDict\nimport torch\n\
  from torch import nn\nclass NeuralNetwork:\ndef __init__(self, input_nodes, hidden_nodes,\
  \ output_nodes, learning_rate):\nself.model = nn.Sequential(OrderedDict([\n('fc',\
  \ nn.Linear(input_nodes, hidden_nodes)),\n('sigmoid', nn.Sigmoid()),\n('output',\
  \ nn.Linear(hidden_nodes, output_nodes))]))\nself.device = torch.device(\"cuda\"\
  \ if torch.cuda.is_available() else \"cpu\")\nself.model.to(self.device)\nself.criterion\
  \ = nn.MSELoss()\nself.optimizer = torch.optim.SGD(self.model.parameters(), lr =\
  \ learning_rate)\ndef train(self, features, targets):\nfeatures, targets = features.to(self.device),\
  \ targets.to(self.device)\nself.model.train()\nself.optimizer.zero_grad()\noutput\
  \ = self.model(features)\nloss = self.criterion(output, targets)\nloss.backward()\n\
  self.optimizer.step()\ndef run(self, x):\nself.model.eval()\nwith torch.no_grad():\n\
  return self.model(torch.tensor(x.values, dtype = torch.float) \\\n.to(self.device)).cpu().numpy()\n\
