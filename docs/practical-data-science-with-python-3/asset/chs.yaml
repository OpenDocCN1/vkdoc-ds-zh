  \ `O(n log n)`），我们甚至无法等待测试完成。\n\n代码清单 11-3 展示了一个快得多的 `O(log n)` 算法，它通过分析区间 `[1,\
  \ 10^i - 1]`（`∀ i ∈ ℕ ∧ i ≤ 50`）中数字位数的重复模式得出。数字 1 到 9 遵循相同的模式，而数字 0 略有不同（需要忽略前导零，因此公式更具挑战性）。将驱动程序代码修改为包含这种更快变体后，我们得到了如图\
  \ 11-4 所示的折线图。执行时间上的差异确实令人震惊。你可以调整测试运行以覆盖完整范围（应省略朴素算法，因为当 `n > 10⁷` 时，其性能无法接受）。将代码推广到处理任意进制（如\
  \ 16 进制）并不困难。\n\n![../images/473947_1_En_11_Chapter/473947_1_En_11_Fig4_HTML.jpg](img/473947_1_En_11_Fig4_HTML.jpg)\
  \  \n\n**图 11-4**\n\n新算法的执行时间极小，以至于在此尺度下均显示为零。`O(log n)` 模型与测量值完全吻合。\n\n```python\n\
  def setup():\n    MAX_EXPONENT = 50\n    # 存储数字 k 在区间 [0, (10**i) - 1] 中出现的次数，i\
  \ > 0。\n    # 如果区间是部分的（复合键的第一部分为 False），则忽略前导零（这是 k == 0 时的特殊情况）。\n    table_of_occurrences\
  \ = {(False, 0): 0, (False, 1): 1,\n                            (True, 0): 0, (True,\
  \ 1): 1}\n    for i in range(2, MAX_EXPONENT + 1):\n        table_of_occurrences[(True,\
  \ i)] = i * 10**(i - 1)\n        table_of_occurrences[(False, i)] = \\\n       \
  \     10**(i - 1) + 10 * table_of_occurrences[(False, i - 1)] - 10\n    return table_of_occurrences\n\
  \ndef count_occurrences_digit(k, n, table_of_occurrences=setup()):\n    digits =\
  \ str(n)\n    num_digits = len(digits)\n    count = 0\n    is_first_digit = num_digits\
  \ > 1\n    for digit in map(int, digits):\n        span = 10**(num_digits - 1)\n\
  \        count += (digit - 1) * table_of_occurrences[(True, num_digits - 1)]\n \
  \       count += table_of_occurrences[(k != 0 or not is_first_digit, num_digits\
  \ - 1)]\n        if digit > k:\n            if k > 0 or not is_first_digit:\n  \
  \              count += span\n        elif digit == k:\n            count += (n\
  \ % span) + 1\n        num_digits -= 1\n        is_first_digit = False\n    return\
  \ count\n\nif __name__ == '__main__':\n    k, n = tuple(map(int, input().split()))\n\
  \    print(count_occurrences_digit(k, n))\n```  \n\n**代码清单 11-3** *改进的对数版本，额外使用*\
  \ `O(log n)` *内存空间。*\n\n本案例研究展示了在不牺牲准确性的前提下实现加速的场景。此外，改进后的代码不需要任何额外的基础设施支持。**寻找更优算法**应成为你的首要任务（在考虑\
  \ Hadoop、Spark 等工具之前）。\n\n## 估计边介数中心性\n\n在第 10 章的图分析部分，我们研究了社交网络中的一些中心性指标，其中就包括边介数中心性。精确计算该指标需要大量\
  \ CPU 资源。当网络规模庞大，且只需求得足够好的结果时，**采样**是一个可行的选择。其思路非常简单：基于 N 个样本而非整个网络来计算指标。这通常能给出几乎相同的结果，但耗时大幅缩短。`NetworkX`\
  \ 已内置对此方法的支持。代码清单 11-4 展示了对比绝对准确结果与采样结果的代码。你可以尝试调整代码，增加样本数量。显然，随着样本量增加，结果会更精确，但运行时间也会增加。你需要通过实验找到最佳平衡点。\n\
  \n```python\nimport operator\nimport networkx as nx\nimport matplotlib.pyplot as\
  \ plt\n\nG = nx.karate_club_graph()\nnode_colors = ['orange' if props['club'] ==\
  \ 'Officer' else 'blue'\n               for _, props in G.nodes(data=True)]\nnode_sizes\
  \ = [180 * G.degree(u) for u in G]\n\nplt.figure(figsize=(10, 10))\npos = nx.kamada_kawai_layout(G)\n\
  nx.draw_networkx(G, pos,\n                 node_size=node_sizes,\n             \
  \    node_color=node_colors, alpha=0.8,\n                 with_labels=False,\n \
  \                edge_color='.6')\n\n### 计算绝对的边介数中心性。\nmain_conns = nx.edge_betweenness_centrality(G,\
  \ normalized=True)\nmain_conns = sorted(main_conns.items(), key=operator.itemgetter(1),\
  \ reverse=True)[:5]\nmain_conns = tuple(map(operator.itemgetter(0), main_conns))\n\
  nx.draw_networkx_edges(G, pos, edgelist=main_conns, edge_color=\"green\", alpha=0.5,\
  \ width=6)\n\n### 通过采样 40% 的节点来估计边介数中心性。\nNUM_SAMPLES = int(0.4 * len(G))\nest_main_conns\
  \ = nx.edge_betweenness_centrality(G, k=NUM_SAMPLES, normalized=True, seed=10)\n\
  est_main_conns = sorted(est_main_conns.items(), key=operator.itemgetter(1), reverse=True)[:5]\n\
  est_main_conns = tuple(map(operator.itemgetter(0), est_main_conns))\nnx.draw_networkx_edges(G,\
  \ pos, edgelist=est_main_conns,\n                       edge_color='red', alpha=0.9,\
  \ width=6, style=\"dashed\")\n```  \n\n**代码清单 11-4** *为简洁起见，仅重复代码的第一部分，该部分与原始版本略有不同。请注意使用\
  \ 40% 节点评估* `est_main_conns` *的部分。空手道俱乐部网络非常小，采样在大型网络中才真正有效。但原理是相同的。*\n\n请注意，我设置了\
  \ `seed` 参数。这对于其他人使用随机化方法复现结果至关重要。图 11-5 展示了新图。\n\n![../images/473947_1_En_11_Chapter/473947_1_En_11_Fig5_HTML.jpg](img/473947_1_En_11_Fig5_HTML.jpg)\
  \  \n\n**图 11-5**\n\n红色的虚线边是通过采样计算得出的。其中大部分与原始边重合，只有一条被误判。\n\n本案例研究展示了如何用准确性换取更好性能。这种随机化方法属于**蒙特卡洛方法**。**拉斯维加斯模型**总能产生准确结果，但在极少数情况下可能运行较慢（快速排序就是一个很好的例子）。无论如何，新代码在不依赖计算集群的情况下运行得更快（参见练习\
  \ 11-2）。\n\n\n#### 可整除数的计数\n\n假设你需要找出区间 `[a, b]`（其中 `0 < a < b < 10¹⁸`）内所有能够被自然数\
  \ `c ≤ 10¹⁸` 整除的自然数。清单 11-5 展示了解决该问题的 `num_divisible` 函数。该函数的运行速度已接近极限，这意味着你无法显著加快其速度。如果没有额外的需求，比如以下两点，你甚至可以在此时停止：\n\
  \n- 你需要处理的海量三元组 `(a, b, c)` 数量巨大。\n- 这些数据无法同时存入内存。\n\n这些条件是很好的信号，表明有必要考虑技术层面的转变，此时应用并行和分布式计算确实合情合理。你可以利用\
  \ Dask 框架来处理与上述约束相关的用例。清单 11-5 阐释了利用 Dask 数组背后的核心思想。示例精简到了最核心的要素，以便你更容易理解底层机制（例如，在实际操作中你会处理更大的数据块）。\n\
  \nDask 提供了用于并行化自定义应用的结构（`delayed` 任务和 futures）。清单 11-5 将输入数组划分为若干数据块，并将它们作为独立块分别处理。这使得它们能够被并行计算。Dask\
  \ 还以透明的方式处理数组与外部数据之间的所有映射关系。Dask 数组是原始 Numpy 数组网格的一个虚拟视图（Dask 数据帧与底层 Pandas 数据帧的关系也是如此）。你的操作方式就如同所有数据都存储在机器内存中一样。\n\
  \n```python\nimport numpy as np\nimport dask.array as da\ndef num_divisible(a, b,\
  \ c):\n    r = a % c\n    if r == 0:\n        start = a\n    else:\n        start\
  \ = a + (c - r)\n    if start > b:\n        return 0\n    else:\n        return\
  \ 1 + (b - start) // c\nnum_divisible_vect = np.vectorize(num_divisible)\nx = da.asanyarray([(1,\
  \ 100, 10), (16789, 445267839, 7), (34, 10**18, 3000), (3, 7, 9)])\nx = x.rechunk(chunks=(2,\
  \ -1))\ny = x.map_blocks(lambda block: num_divisible_vect(*block.T),\n         \
  \        chunks=(-1,),\n                 drop_axis=1,\n                 dtype='i8')\n\
  print(y.compute())\n清单 11-5\nDask 提供了其自有的数组和数据帧数据结构，其 API 模仿了 Numpy 和 Pandas 中的相应接口。\n\
  ```\n\n运行上述程序后，你将收到以下输出，这是一个包含四个值的数组，分别对应每个输入的三元组：\n\n```\n[             10    \
  \    63607293 333333333333333             0]\n```\n\n本案例研究表明，一旦你真正明确自己需要并行和分布式计算，它就是一项强大的选择。\n\
  \n## 从失序到复杂\n\n复杂域的特点是*已知的未知*，而复合域则关乎*未知的未知*。失序应是一个暂时的状态，用于探索问题空间以理解其归属。从这个意义上说，失序是探索性数据分析的催化剂。\n\
  \n高维数据集是最初困惑的最可能原因。经典的可视化方法在此并不适用，因为你甚至不知道如何表示这些维度。高维数据中存在大量重复且无信息量的特征（例如，那些方差极低或为零的特征）。这些特征应从数据集中剔除。此外，许多特征将被证明与目标变量无关，因此也应作为不相关特征移除。主要目标是降低维度，以便你能“见树又见林”。黄金标准是*主成分分析（PCA）*方法，它应用特征提取，用正交的主成分来描述数据。\n\
  \n### 注意\n\n任何最终使用特征值和特征向量的方法（SVD、PCA、谱方法等）都不可避免地落入复合域。这些实践的主要难点在于它们的输出通常难以解释。你可以推测每个特征向量的含义，但肯定无法准确解读它们。\n\
  \n在本节中，我们将只关注一种名为 t-SNE 的特殊可视化技术，以便一窥高维数据的面貌；关于该主题的精彩互动介绍以及如何避免常见陷阱，请参阅参考文献 [2]。从某种意义上说，这是\
  \ Cynefin 框架的一个元应用，因为我们必须将可视化视为复合/复杂，而非简单。\n\n顺便提一下，你也应该尝试使用标准技术窥探数据集，例如，对 Pandas\
  \ 数据帧使用 `describe` 方法。方差接近零的列是移除的良好候选。此外，你可以使用 Seaborn 中的 `pairplot` 函数对列进行成对可视化。高度相关的列是冗余的，应避免使用。这些操作都与特征选择相关。其中一部分也可以自动化完成。例如，你可以使用实现特征选择算法的\
  \ `sklearn.feature_selection` 模块。对于修剪低方差特征，你可以使用 `VarianceThreshold` 类。无论如何，所有这些方法对于低维数据集（列数/特征数少于十个的数据集）都是适用的。\n\
  \n当创建新特征时，特征提取是对特征选择的补充。例如，将实例分箱（这个过程称为*分箱*）就是创建新分类特征的一个例子。我们在第 2 章中已经遇到过这种情况，当时我们按年龄范围对用户进行分组。\n\
  \n\n\n### 探索 KDD Cup 1999 数据集\n\n正如 KDD Cup 1999 数据官方网站（参见 [`https://kdd.ics.uci.edu/databases/kddcup99/kddcup99.html`](https://kdd.ics.uci.edu/databases/kddcup99/kddcup99.html)）所述：\n\
  \n- 该数据集用于第三届国际知识发现与数据挖掘工具竞赛，该竞赛与 KDD-99 第五届知识发现与数据挖掘国际会议同期举行。竞赛任务是构建一个网络入侵检测器，即一个能够区分“不良”连接（称为入侵或攻击）与“正常”连接的预测模型。该数据库包含一套标准的审计数据，其中涵盖了在军事网络环境中模拟的各种入侵行为。\n\
  \n清单 11-6 展示了 t-SNE 在揭示 KDD Cup 数据集中的某些模式方面的应用（scikit-learn 已完整封装对该数据集的支持）。总共有 41\
  \ 个特征。其中，34 个为数值型特征，这是 t-SNE 唯一能接受的特征类型。类别变量应被取消选择或进行编码。t-SNE 方法即使对微小的变化也非常敏感。清单\
  \ 11-6 中的两个辅助方法会从官方网站下载列描述符（另请参见图 11-6）。\n\n![../images/473947_1_En_11_Chapter/473947_1_En_11_Fig6_HTML.jpg](img/473947_1_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6\n\n值得注意的是，t-SNE 成功地将 34 个特征压缩为 2 个分量，清晰地突出了数据中的关键模式。\n\n```python\nfrom\
  \ sklearn.datasets import fetch_kddcup99\nfrom sklearn.manifold import TSNE\nimport\
  \ pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn as sns\ndef retrieve_column_desc():\n\
  import requests\nr = requests.get('https://kdd.ics.uci.edu/databases/kddcup99/kddcup.names')\n\
  column_desc = {}\nfor row in r.text.split('\\n')[1:]:\nif row.find(':') > 0:\ncol_name,\
  \ col_type = row[:-1].split(':')\ncolumn_desc[col_name] = col_type.strip()\nreturn\
  \ column_desc\ndef get_numeric_columns(column_desc):\nreturn [name for name in column_desc\
  \ if column_desc[name] == 'continuous']\ncolumn_desc = retrieve_column_desc()\n\
  numeric_columns = get_numeric_columns(column_desc)\nprint('Number of numeric columns:',\
  \ len(numeric_columns))\nX, _ = fetch_kddcup99(subset='SA', random_state=10, return_X_y=True)\n\
  X = pd.DataFrame(X, columns=column_desc.keys())\nX[numeric_columns] = X[numeric_columns].apply(pd.to_numeric)\n\
  #### We need to work on a small sample to get results in any reasonable time frame.\n\
  X = X.sample(frac=0.05, random_state=10)\nm = TSNE(learning_rate=150, random_state=10)\n\
  X_tsne = m.fit_transform(X[numeric_columns])\nprint('First 10 rows of the TSNE reduced\
  \ dataset:')\nprint(X_tsne[:10, :])\nX['t-sne_1'] = X_tsne[:, 0]\nX['t-sne_2'] =\
  \ X_tsne[:, 1]\nsns.set(rc={'figure.figsize': (10, 10)})\nsns.scatterplot(x='t-sne_1',\
  \ y='t-sne_2',\nhue='protocol_type', style=\"protocol_type\",\ndata=X[numeric_columns\
  \ + ['protocol_type', 't-sne_1', 't-sne_2']])\nplt.show()\n清单 11-6\n展示 t-SNE 强大功能的代码，不过你需要耐心尝试许多不同的参数设置（学习率、随机状态、困惑度、t-SNE\
  \ 组件数量等）。\n```\n\n符号变量 `protocol_type` 用于标记不同的组（观察右侧绿色的 icmp 集群），各组之间的行为存在良好分离。再一次，t-SNE\
  \ 在未查看 `protocol_type` 特征的情况下成功地提取出了这些模式。\n\n本案例研究阐明了进行探索性数据分析的重要性，这是判断你的数据科学问题属于\
  \ Cynefin 框架中哪个领域的一部分。一旦你确定需要执行特征提取及相关降维操作，就可以通过应用 PCA 或类似技术继续推进。降维有助于你的机器学习工作，因为降维后的数据集无需巨大的存储空间或处理时间，并且能降低模型过拟合的风险。\n\
  \n### Cynefin 与数据科学\n\n前面的一些例子对你来说可能有些抽象，因此本节通过一个具体的数据科学产品来阐述 Cynefin 领域。第 8 章已经介绍了推荐系统，所以这里我们也将使用它。以下列表举例说明了适用于前三个\
  \ Cynefin 象限的推荐引擎类型：\n\n- **简单**: 非个性化推荐系统根据产品的整体流行度来提供推荐，或根据当前用户的行为进行各种类型的关联分析。例如，如果用户正在浏览特定类型的产品，推荐系统可能会提供相似的产品。如果用户将某件商品放入购物车，推荐系统可能会提供常与该商品一起购买的其他产品。这是你在网页上看到“购买此商品的顾客也购买了...”版块时的典型情况。\n\
  \n- **复杂**: 结合了协同过滤和基于内容过滤的个性化推荐系统比其非个性化版本更精细、更有用。它们试图通过建立用户画像来对客户进行建模。如今，大多数推荐引擎至少属于该领域。\n\
  \n- **复合**: 多维度和上下文感知的混合推荐系统则更为强大。例如，这些推荐系统可能会根据用户当前的情绪来推荐内容。该领域寻求创新性解决方案，并且经常需要应用启发式算法和近似算法。\n\
  \n\n\n### 练习 11-1. 理解算法\n\n对于给定的闭区间 `[a, b]`（其中 `0 <= a <= b <= 10⁸`），以下朴素算法会找出所有各位数字不重复的数字，并输出它们的个数：\n\
  \n```\na, b = tuple(map(int, input().split()))\ncount = 0\nfor i in range(a, b +\
  \ 1):\n    s = str(i)\n    if len(set(s)) == len(s):\n        count += 1\nprint(count)\n\
  ```\n\n如果你输入数字 `0` 和 `1000`，你会得到计数 `739`。这是一个简单但低效的程序，其时间复杂度为 *O*((*b* − *a*) log\
  \ *b*)。下面是一个快得多的 *O*((log *b*)³) 算法：\n\n```\nimport math\na, b = tuple(map(int,\
  \ input().split()))\ndef variation_without_repetition(n, k):\n    return math.factorial(n)\
  \ // math.factorial(n - k)\n#### 找出 [0, k] 中有多少个各位数字不重复的数字。\ndef count_numbers_with_non_repeating_digits(k):\n\
  \    if k < 0:\n        return 0\n    if k == 0:\n        return 1\n    # 我们可以用组合数学找出大部分数字。\n\
  \    digits = str(k)\n    num_digits = len(digits)\n    first_digit = int(digits[0])\n\
  \    span = 10 ** (num_digits - 1)\n    s = (first_digit - 1) * variation_without_repetition(9,\
  \ num_digits - 1)\n    # 我们必须小心处理关于前导零的较低区间。\n    s += count_numbers_with_non_repeating_digits(span\
  \ - 1)\n    # 我们继续搜索较高部分。\n    used_digits = {first_digit}\n    t = num_digits ==\
  \ 1\n    for i in range(1, num_digits):\n        first_digit = int(digits[i])\n\
  \        allowed_digits = set(range(first_digit + 1)) - used_digits\n        v =\
  \ variation_without_repetition(9 - i, num_digits - 1 - i)\n        used_digits.add(first_digit)\n\
  \        if first_digit not in allowed_digits:\n            if len(allowed_digits)\
  \ == 0 and i == 1:\n                t = 0\n            else:\n                t\
  \ += len(allowed_digits) * v\n            break\n        else:\n            t +=\
  \ (len(allowed_digits) - (i != num_digits - 1)) * v\n    return s + t\nprint(count_numbers_with_non_repeating_digits(b)\
  \ - \\\n      count_numbers_with_non_repeating_digits(a - 1))\n```\n\n请尝试完全理解这个程序的工作原理。显然，任何激进的性能调优都会损害代码库的可维护性。不过，如果你能指数级地加速你的算法，那就可以省去使用昂贵且复杂的分布式解决方案的必要。\n\
  \n**加分题：** 你能将这个程序泛化，使其能处理任意进制（例如，十六进制）的数字吗？一旦你理解了前面的代码，这应该不难。这正是先前的朴素算法会立刻失效的地方（对于大于十的进制，搜索空间会急剧增加）。\n\
  \n### 练习 11-2. 数据流式处理\n\n假设你需要生成一个数据流的直方图（即描述流中数值的频率分布）。这听起来只是另一个计数任务。毕竟，对于一组数值，只需使用\
  \ Numpy 的 `histogram` 函数即可。唯一的难点是，这个流是无限的，并且数值持续不断地到来。无法将它们全部存储在内存中。这又是一个需要将 Cynefin\
  \ 域从简单域转变为复杂域的场景。\n\n一个非常流行的解决此问题的算法叫做 *Count Sketch*。这是一种概率性的蒙特卡洛风格的数据结构。其核心思想是使用一个二维数组和一组通用哈希函数来对项目进行计数。基于计数器的值，你可以估算出频率。更多信息，请阅读\
  \ [`http://bit.ly/count-sketch`](http://bit.ly/count-sketch)。\n\n请实现一个 Count-Sketch\
  \ 数据结构，或找到一个开源项目并尝试这种方法。你可以使用 Python 的生成器函数来模拟一个流。\n\n### 练习 11-3. 审视混沌\n\n混沌域需要即时行动。一个很好的例子是异常检测系统，它必须在检测到异常行为的瞬间做出反应。KDD\
  \ Cup 1999 数据集是练习构建自动化入侵检测设施的绝佳素材。在这个练习中，你将做一些更简单但同样有启发性的内容。\n\n物理学中的胡克定律模拟了当你将弹簧拉伸一定距离时，由具有某种弹性系数\
  \ `k` 的弹簧产生的力。公式是 *F* = −*k∆x*，其中负号表示与拉伸方向相反的力。每个弹簧的弹簧常数 `k` 都是独一无二的。\n\n假设你已经收集了一组在不同位移\
  \ *∆x* 下的力的读数。只要弹簧在正常工作状态下，我们的弹簧模型就是正确的。不幸的是，如果你过度拉伸弹簧，可能会损坏它。从那时起，你将无法再使用该模型。\n\
  \n请为弹簧实现一个异常检测应用。你的系统应预先记录正常工作条件下的数据，以便能够识别异常。你可能需要查看 `sklearn.neighbors.LocalOutlierFactor`\
  \ 类。当弹簧损坏时，它产生的数据点将不再靠近正常工作状态下的数据点。这便是你的分类器触发警报的时机。你应该明白，误报（无效警报）是可能发生的。毕竟，在正常使用中，也许从未有人试图将弹簧拉伸到极限。即使没有发生任何坏事，你的系统也可能认为出了问题。这是混沌域的基本特性。在你行动之前，没有太多时间思考。\n\
  \n## 总结\n\n知道某种方法何时合适且可行，是成为一名成功数据科学家的基石。你必须抵制那种为了尝试新事物而围绕某一新兴技术构建产品的炒作和诱惑。算法与数理统计一同，是处理大数据的核心。本章阐述了\
  \ Cynefin 框架如何为更好的决策和选择正确的解决方案提供背景。\n\n# 12. 深度学习\n\n深度学习是机器学习的一个领域，它真正实现了人工智能领域的尖端成就。*深度*一词意味着一种复杂结构，旨在通过密集的并行计算（主要利用配备\
  \ GPU 的机器集群）来处理海量数据集。在此上下文中，*学习*一词意味着特征工程和模型参数的定制都留给机器去完成。在实践中，将这些术语组合成*深度学习*则意味着多层神经网络。神经网络广泛应用于图像分类、语音识别/合成、时间序列分析等任务。神经网络倾向于模仿我们的大脑细胞在决策活动中协同工作的方式。本章将向你介绍神经网络以及如何使用\
  \ `PyTorch` 来构建它们。`PyTorch` 是一个开源的 Python 框架（请访问 [`https://pytorch.org`](https://pytorch.org)），它拥有对于熟悉\
  \ `Numpy` 的人来说非常相似的 API。此外，作为本书的最后一章，它举例说明了数据科学生命周期模型的许多阶段（数据准备、特征工程、数据可视化、数据分析和数据产品部署）。不过，首先，让我们思考一下*智能*的概念，以及它何时、如何以及为何如此重要。\n\
  \n\n\n## 智能机器\n\n*智能*一词的含义是主观的，并随着历史变迁而改变。在 18、19 世纪，人们为机械装置和自动化蒸汽机感到惊叹，这是完全可以理解的；当我参观伦敦塔桥时，对其燃煤蒸汽机系统中存在的自动化程度印象深刻——这套系统直到\
  \ 1974 年仍用于操控这座开启式桥梁。当塔桥于 1894 年投入运行时，许多伦敦人可能认为塔桥发动机室内的机器是“智能的”。当然，如今没有人会再认为任何类型的蒸汽机具备智能属性。这是为什么？原因在于，随着人们对某项技术背后机理的理解变得普及，其带来的惊奇程度也会相应下降。因此，我们可以在*智能*与我们对某项技术的兴奋程度之间建立关联。以下是一些值得思考的问题：\n\
  \n- 什么让汽车变得智能？自动驾驶汽车是智能的吗？自动泊车汽车也是智能的吗（尽管其智能程度不及完全自动驾驶汽车）？配备定速巡航系统的汽车到底算不算智能？分界线在哪里？\n\
  - 普通果蝇是智能的吗？一只人造的、能自我复制的果蝇，是否是 2019 年之后人工智能的*最先进水平*？\n- 是否存在间接的智能迹象？（请查看稍后会讨论的图\
  \ 12-1。）\n\n假设你有一台“愚蠢”的洗衣机，它内部没有内置任何模糊逻辑或类似的智能算法。此外，假设你偶然发现了一款“智能”洗衣粉（例如在[`https://www.skip.co.za/product-format`](https://www.skip.co.za/product-format)上销售的那种）。不要花太多时间思考洗衣粉中的智能体现在何处，或者模糊逻辑如何能让你的机器变得更聪明。这些方面目前并不重要。相反，试着回答以下问题：将“智能”洗衣粉倒入你“愚蠢”的洗衣机中这一简单行为，就能让它变智能吗？你该如何做出判断？你是否会仅仅根据洗衣机清洗后衣物的洁净程度来评估结果？你还会监控洗衣机的运行方式吗？你会拆解洗衣机，分别分析各个部件（包括洗衣粉），希望能从中找到智能吗？\n\
  \n![../images/473947_1_En_12_Chapter/473947_1_En_12_Fig1_HTML.jpg](img/473947_1_En_12_Fig1_HTML.jpg)\n\
  图 12-1\n你和你的团队正在执行寻找宜居行星的任务\n\n想象一下，你和你的团队正在邻近的太阳系中搜寻宜居行星。你们接近了一个很有希望的候选行星，但遇到了一个问题。你们注意到沙滩上有一把铲子。你们不敢降落，不是因为害怕铲子本身，而是害怕它所代表的意义。这是智能生命存在的明确标志，而他们可能不欢迎你们。甚至，这颗行星是由智能生物还是由机器人殖民都无关紧要。重要的是这种间接的智能迹象，它引发了某种程度的敬畏。参考文献[1]对这一观点进行了精彩的阐述，我们将在本章中进一步展开讨论。\n\
  \n长期以来，评估人类和机器的智能水平一直是一个众所周知的难题。解决这个问题的一种方法体现在图灵测试中，该测试衡量机器表现出与人类无法区分的智能行为的能力，如图\
  \ 12-2 所示。这绝对是一个黑盒测试，它试图仅通过观察外部属性和结果来回答问题。\n\n![../images/473947_1_En_12_Chapter/473947_1_En_12_Fig2_HTML.jpg](img/473947_1_En_12_Fig2_HTML.jpg)\n\
  图 12-2\n图灵测试设置（来源：[`https://commons.wikimedia.org/wiki/File:Test_de_Turing.jpg`](https://commons.wikimedia.org/wiki/File:Test_de_Turing.jpg)）。询问者（C）试图仅通过提问和查看书面回答来揭示哪个参与者（A\
  \ 或 B）是人类。\n\n图灵测试旨在为“什么构成智能机器”确立终极标准。也许有一天我们能够达到如此复杂的程度。在那之前，我们必须将注意力集中在更实际的目标上。回到我们洗衣机示例，我们真的关心是谁或什么清洗了一件衣服吗？真正的问题是：“我们能否区分衣服是由人工手洗还是洗衣机洗的？”如果没有区别，那么洗衣机就是一种有用的器具，能让我们更高效，并让我们从琐碎的任务中解脱出来。这就是人机交互的全部意义。从这个意义上说，智能只是一个与我们要处理的任务复杂度相关的必要评分，无论是否借助机器。对于更高级的工作，我们需要采用更先进的技术、方法和工具。我们通常不关心机器所期望的智能水平是来自“愚蠢的硬件+超级智能的软件”、“超智能硬件+愚蠢的软件”，还是“精明的硬件和软件”。有时，即使是一台普通的计算器，也足以让我们在规定时间内以所需的精度解决问题。\n\
  \n### 注意\n\n本着前文的精神，我只在更简单、更易解释的解决方案无法实现时，才考虑使用深度神经网络。深度神经网络对外部观察者来说可能显得神秘，但在内部，它们大致只是线性代数和微积分。尽管如此，在其背后投入的研究和人力是惊人的（开发训练深度神经网络的算法花费了大约\
  \ 30 年时间，凝聚了许多科学家的共同努力）。关于智能以及看待事物的不同方式，你可能还想查阅参考文献[2]和[3]。\n\n神经网络令人着迷且有趣的成就之一体现在\
  \ 20Q 游戏（更多细节请阅读参考文献[4]）。该产品在用户玩游戏时不断学习。关于神经网络何时适用的例子以及学习 Keras（本章我将介绍 PyTorch），你也可以查阅参考文献[5]。\n\
  \n## 智能作为符号的掌握\n\n我思考了很久，如何最好地举例说明神经网络内部发生的事情。我认为立刻跳到节点、权重、层和激活函数是不合适的。幸运的是，我设法在\
  \ Topcoder 上找到了一个合适的问题陈述，针对一个名为`AToughGame`的游戏，用以演示抽象如何在创造看似智能的行为中相互作用（要跟进此讨论，你必须先阅读其规范；点击[`https://www.topcoder.com/blog/how-to-come-up-with-problem-ideas`](https://www.topcoder.com/blog/how-to-come-up-with-problem-ideas)上的`AToughGame`链接）。如参考文献[1]所述，智能可以被视为在多个粒度级别上掌握产生符号（抽象）的能力。抽象层次结构被积累并相互构建，直到最终解决方案可以用它们来简单描述为止。\n\
  \n\n\n### 手动特征工程\n\n图 12-3 以状态图的形式展示了`AToughGame`问题的通用结构。玩家根据给定的概率从一个关卡推进到下一个关卡。主要思路是成对处理状态。这样一来，每次迭代后状态数量就会减少一个。这是一种典型的贪心算法，其安全操作是聚合两个状态。唯一实际的工作就是使用`combine`运算符来实现该算法。难点在于要找出所有可能完成这两个关卡（即这一对关卡）的方式中，宝物的期望值。联合概率仅仅是各个关卡概率的乘积。总而言之，这产生了一个非常快速的线性算法（每个状态只需访问一次就足够了）。\n\
  \n![../images/473947_1_En_12_Chapter/473947_1_En_12_Fig3_HTML.jpg](img/473947_1_En_12_Fig3_HTML.jpg)\n\
  \n**图 12-3** — 问题的总体状态图\n\n如果通过某个关卡的概率是 `p`，那么相反的结果就是 `q = 1 – p`。最终状态是获胜状态。目标是计算完成所有关卡后收集到的宝物的期望数量。图中显示的是将要首先聚合的初始状态对。\n\
  \n#### 对聚合状态进行建模\n\n关于组合后的状态，有两个问题需要回答：\n\n- 新状态的联合概率是多少？\n- 新状态的联合价值（我将用 `v` 表示价值）是多少？\n\
  \n我们已经回答了第一个问题，如图 12-3 所示。新价值是最后一个价值加上考虑到所有可能离开这两个状态的方式后的期望宝物数量之和。最简单的情况是连续通过两个状态，没有在任何一关死亡。下一种可能性是在第\
  \ 0 关死亡一次，然后连续完成两个状态。第三种情况是在第 0 关连续死亡两次，然后连续完成两个状态。这种模式会无限延续下去。我们可以用公式 ![$$ E(T)={v}_1+{v}_0\\\
  ast {p}_1\\ast {p}_0\\ast \\sum \\limits_{i=0}^{\\infty }{q}_0^i $$](img/473947_1_En_12_Chapter_TeX_IEq1.png)\
  \ 来描述所有这些情况，其中 `E(T)` 是期望宝物数量。\n\n最后一个表达式已经包含了两个强大的抽象。我们现在应该将它们综合起来。别忘了，完成这两个关卡的途径还有很多，这意味着直接操作原始概率很快就会变得笨拙。第一个抽象来自代数，它提供了一个求和的封闭解。这被称为几何级数求和\
  \ ![$$ \\sum \\limits_{i=0}^{\\infty }{r}^i=\\frac{1}{1-r},r&lt;1\\. $$](img/473947_1_En_12_Chapter_TeX_IEq2.png)。在我们的例子中，参数\
  \ `r` 总是一个非负实数。为抽象命名很重要，这个求和将被记为 `series1(r)`。我们的第二个抽象是 *γ* = *p*[0] ∗ *series1*(*q*[0])，其含义是“离开第\
  \ 0 关的概率”。注意，我们可以不死亡就离开这一关，也可以死亡一次、两次等等再离开。\n\n离开这两个关卡的另一种情况由以下伪代码描述：\n\n```\n重复任意多次：\n\
  \    以任何方式离开第 0 关\n    在第 1 关死亡\n    至少死亡一次后离开第 0 关\n    通过第 1 关\n```\n\n得益于之前引入的抽象，我们可以用简洁的方式将上述用例的联合概率表示为\
  \ *series1*(*γ* ∗ *q*[1]) ∗ *q*[0] ∗ *γ* ∗ *p*[1]。注意 *γ* 是如何嵌套在 `series1` 内部的。\n\
  \n下一个用例与在不死于第 0 关的情况下，通过在第 1 关多次死亡来积累财富的能力有关。换句话说，这个场景由以下伪代码描述：\n\n```\n重复任意多次：\n\
  \    通过第 0 关\n    在第 1 关死亡\n    通过第 0 关\n    通过第 1 关\n```\n\n在这种情况下，每次迭代后，留在第 1\
  \ 关的宝物数量等于 *v*[0] ∗ *m*，其中 `m` 是迭代次数。为了有效地描述这种情况，我们需要一个新的抽象，它是几何级数求和的衍生形式：![$$ \\\
  sum \\limits_{i=1}^{\\infty }i\\ast {r}^{i-1}=\\frac{1}{{\\left(1-r\\right)}²},r&lt;1\
  \ $$](img/473947_1_En_12_Chapter_TeX_IEq3.png)。我们将这个抽象命名为 `series2(r)`。因此，联合概率由\
  \ *series2*(*p*[0] ∗ *q*[1]) ∗ *p*[0] ∗ *p*[1] 给出。\n\n最后一点是，最后一个用例也可以与第二个用例相关联。换句话说，可以先积累财富，然后在最后一轮，因为至少死亡一次才离开第\
  \ 0 关而失去所有财富。\n\n#### 将所有部分整合在一起\n\n在重构了每个用例的公式后，完整的解决方案如代码清单 12-1 所示。`combine`\
  \ 函数接收两个连续关卡的原始概率和价值作为输入，并返回聚合后的概率和宝物的期望值。在此过程中，它从原始数据中构建抽象。这与神经网络从原始输入节点开始，通过隐藏层创建抽象层级，最终输出结果的方式非常相似。\n\
  \n我们可以去掉 *γ*，因为它等于 1。此外，我们可以直接内联 `series1` 和 `series2`，并将表达式 `series1(q1)` 简化为 `1\
  \ / p1`。最终结果与展开后的版本几乎完全不同。优化应该作为最后一步。这类优化也同样发生在神经网络内部。并非所有由隐藏层产生的特征都同样有用，也不会以独立的方式被使用（许多特征会被整合到更高级的抽象中）。\n\
  \n```\nclass AToughGame:\n    def expectedGain(self, prob, value):\n        def\
  \ combine(level0, level1):\n            p0, v0, p1, v1 = level0[0], level0[1], level1[0],\
  \ level1[1]\n            q0, q1 = 1 - p0, 1 - p1\n            return p0 * p1, v1\
  \ + v0 * p1 ∗ (p0 + q0 / p1) * (1 - p0 * q1) ** -2\n        from functools import\
  \ reduce\n        return reduce(combine, zip(map(lambda p: p / 1000, prob), value))[1]\n\
  ```\n\n**代码清单 12-1** — `AToughGame.py` 模块，实现了 Topcoder 问题 `AToughGame`\n\n类名和唯一的方法签名是需求规范的一部分（参见练习\
  \ 12-1）。尽管所有抽象都是手动创建的，但其中的内部细节对于没有阅读过前述说明的人来说是难以理解的。因此，你务必为压缩后的代码附上合适的设计文档。\n\n\
  看看前面的代码，你可能会好奇这九行代码（包括样板代码和空行）中的智慧何在。也许你运行它，看到它在几纳秒内就给出解决方案，会惊叹于它的巧妙。你能想象它包含了所有必要的知识，来考虑玩家可能完成游戏的所有方式吗？这个程序很好地说明了\
  \ 1990 年代之前 AI 的状况。当时的软件解决方案预先配备了所有必要的启发式规则。\n\n现在，想象一个软件魔法师，它能够解读处理问题所需的所有抽象。这正是神经网络大放异彩的地方。你只需定义解决方案的架构，然后将生成更高级符号的艰巨任务交给网络。上层网络会复用来自下层的抽象。层数越多，产生的特征就越复杂。\n\
  \n\n\n### 基于机器的特征工程\n\n现在我们将构建两个版本的神经网络，以演示自动特征工程及其工作原理。第一个版本将从零开始构建，第二个版本将使用 `PyTorch`。你在第\
  \ 7 章（关于机器学习）中已经看到过线性回归，其中输出被估计为 ![$$ \\hat{y}=\\mathrm{W}\\ast \\mathrm{features}+\\\
  mathrm{b} $$](img/473947_1_En_12_Chapter_TeX_IEq4.png)（`W` 是特征的权重，`b` 是偏置项）。不过，特征可能包含非线性成分。可以为这个输出关联一个激活函数；这样做可以将线性回归转变为用于分类的逻辑回归。激活函数甚至可以是一个简单的阶跃函数，当\
  \ ![$$ \\hat{y}\\ge 0 $$](img/473947_1_En_12_Chapter_TeX_IEq5.png) 时输出 1，否则输出 0。事实上，任何具有某种阈值来区分正负样本的函数都可以用作激活函数。\n\
  \n图 12-4 展示了一个具有一个输入层、一个隐藏层和一个输出层的神经网络通用结构。输入层的节点数量等于不同特征的数量（此处为两个），再加上一个额外的常数节点来表示偏置。隐藏层的节点数量是可配置的。输出层的节点数量等于目标变量的数量（此处仅有一个）。\n\
  \n隐藏层中带阴影的节点由一个聚合器和一个激活函数组成。节点的聚合器计算匹配的输入权重与输入的乘积，而激活函数则对聚合器的输出值进行变换。当你进行的是分类而非回归任务时，最终的输出节点也可能应用一个激活函数。在图\
  \ 12-4 中，激活函数是 Sigmoid 函数，其公式也在图中给出（你可以看到其关于输入的导数非常简洁）。\n\n每个神经网络在使用前都必须经过训练，训练本质上是一个寻找合适权重的迭代增量过程。开始时，权重被初始化为一些较小的随机值。一个训练周期（迭代）由两部分组成：前向传播（计算最终输出）和反向传播（通过网络回传误差来更新权重）。周期会重复进行，直到网络收敛到稳定的权重。每次迭代传统上被称为一个*轮次*。\n\
  \n![../images/473947_1_En_12_Chapter/473947_1_En_12_Fig4_HTML.jpg](img/473947_1_En_12_Fig4_HTML.jpg)\n\
  \n*图 12-4 用于回归任务的具有一个隐藏层的简单神经网络架构*\n\n误差是真值与预测值之间的差，表示为 ![$$ E(W)=y-\\hat{y} $$](img/473947_1_En_12_Chapter_TeX_IEq6.png)。该误差函数对权重的一组偏导数为我们提供了更新权重所需的梯度；这是梯度下降方法的核心。更新权重\
  \ ![$$ {W}_{ij}^{(1)} $$](img/473947_1_En_12_Chapter_TeX_IEq7.png) 的量是 ![$$ -\\\
  frac{\\partial E}{\\partial {W}_{ij}^{(1)}}=-\\frac{\\partial E}{\\partial \\hat{y}}\\\
  frac{\\partial \\hat{y}}{\\partial {h}_j}\\frac{\\partial {h}_j}{\\partial {W}_{ij}^{(1)}}\
  \ $$](img/473947_1_En_12_Chapter_TeX_IEq8.png)，这是链式法则在导数计算中的应用。如果最终输出也应用了激活函数，上述表达式会多出一项。无论如何，这些偏导数只有在激活函数（或多个激活函数；你可以在每一层使用不同的函数）是连续且可微时才是可行的。此外，为了避免深度神经网络中出现的梯度消失问题（当所有偏导数的乘积变得非常小时），激活函数应该将输出分布在一个更大的范围内。在这方面，Sigmoid\
  \ 函数表现不佳。这就是你会看到双曲正切函数（`tanh`）或线性整流单元（`ReLU`）在发挥作用的原因。后者是隐藏层的默认选择。\n\n为了避免权重突变，存在一个称为*学习率*的超参数。每个梯度都会乘以这个量，从而使优化过程谨慎地朝着最小值（通常是良好的局部最小值）移动。\n\
  \n神经网络的能力源于隐藏节点输出的非线性。在深度神经网络中，随着每一层重复使用前一层的输出，可以从原始输入中创建出复杂的特征。美妙之处在于，你无需担心网络如何以简洁的方式描述问题。当然，缺点是你会很难解释网络的决策过程。还有一个令人惊叹的项目，可以从深度神经网络创建的中间特征中产生视觉效果（请访问\
  \ [`https://github.com/google/deepdream`](https://github.com/google/deepdream)）。\n\
  \n\n\n#### 从零开始的实现  \n\n清单 12-2 提供了一份仅使用 NumPy 数组的简单神经网络完整实现。这段代码实际上是我在 [`http://bit.ly/project-bikes`](http://bit.ly/project-bikes)\
  \ 上完成的 Udacity 共享单车项目解决方案（我也推荐 Udacity 上免费的优秀课程《使用 PyTorch 入门深度学习》）。  \n\n```python\n\
  import numpy as np\n\nclass NeuralNetwork:\n    def __init__(self, input_nodes,\
  \ hidden_nodes, output_nodes, learning_rate):\n        self.input_nodes = input_nodes\n\
  \        self.hidden_nodes = hidden_nodes\n        self.output_nodes = output_nodes\n\
  \        # 使用正态分布将权重初始化为较小的随机值。\n        self.weights_input_to_hidden = np.random.normal(\n\
  \            scale=self.input_nodes ** -0.5,\n            size=(self.input_nodes,\
  \ self.hidden_nodes))\n        self.weights_hidden_to_output = np.random.normal(\n\
  \            scale=self.hidden_nodes ** -0.5,\n            size=(self.hidden_nodes,\
  \ self.output_nodes))\n        self.lr = learning_rate\n        self.activation_function\
  \ = lambda x: 1 / (1 + np.exp(-x))  # sigmoid\n\n    def train(self, features, targets):\n\
  \        delta_weights_i_h = np.zeros(self.weights_input_to_hidden.shape)\n    \
  \    delta_weights_h_o = np.zeros(self.weights_hidden_to_output.shape)\n       \
  \ for X, y in zip(features, targets):\n            y_hat, hidden_outputs = self.__forward(X)\n\
  \            delta_weights_i_h, delta_weights_h_o = self.__backward(\n         \
  \       y_hat, hidden_outputs, X, y, delta_weights_i_h, delta_weights_h_o)\n   \
  \     self.__update_weights(delta_weights_i_h, delta_weights_h_o)\n\n    def run(self,\
  \ X):\n        return self.__forward(X)[0]\n\n    def __forward(self, X):\n    \
  \    hidden_inputs = np.dot(X, self.weights_input_to_hidden)\n        hidden_outputs\
  \ = self.activation_function(hidden_inputs)\n        final_inputs = np.dot(hidden_outputs,\
  \ self.weights_hidden_to_output)\n        y_hat = final_inputs\n        return y_hat,\
  \ hidden_outputs\n\n    def __backward(self, y_hat, hidden_outputs, X, y, delta_weights_i_h,\
  \ delta_weights_h_o):\n        error = y - y_hat\n        hidden_error = np.dot(self.weights_hidden_to_output,\
  \ error)\n        output_error_term = error\n        hidden_error_term = hidden_error\
  \ * hidden_outputs * (1 - hidden_outputs)\n        delta_weights_i_h += np.dot(X[:,\
  \ np.newaxis], hidden_error_term[np.newaxis, :])\n        delta_weights_h_o += np.dot(hidden_outputs[:,\
  \ np.newaxis], output_error_term[np.newaxis, :])\n        return delta_weights_i_h,\
  \ delta_weights_h_o\n\n    def __update_weights(self, delta_weights_i_h, delta_weights_h_o):\n\
  \        self.weights_hidden_to_output += self.lr * delta_weights_h_o\n        self.weights_input_to_hidden\
  \ += self.lr * delta_weights_i_h\n```\n\n*清单 12-2*  \n*面向图 12-4 所示回归任务的简单神经网络实现（不含偏置）*\
  \  \n\n该类有两个公有方法：`train` 和 `run`。私有的 `__update_weights` 方法并不计算 delta 权重的平均值，而是假设已提供的学习率包含了这一因子。这是一种常见做法，因为该参数本身就是一个需要针对每个问题单独调整的任意数值。\
  \  \n\n权重使用标准差为 `sqrt(n)` 的正态分布初始化为较小的随机值（其中 `n` 是匹配层的输入节点数）。这被称为 Xavier 初始化，你可以在\
  \ [`http://bit.ly/xavier-init`](http://bit.ly/xavier-init) 了解更多信息。这是缓解梯度消失问题的另一种方式。\
  \  \n\n以下是一份简单的操作指南，用于观察这个网络的运行效果：  \n\n1. 执行 `git clone` [`https://github.com/udacity/deep-learning-v2-pytorch.git`](https://github.com/udacity/deep-learning-v2-pytorch.git)\
