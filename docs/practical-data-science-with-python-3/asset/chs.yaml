  \ 获取有关如何模拟 matplotlib 子图的帮助。\n\n## 总结\n\n遍历所有类型的可视化是不可能的，因为其数量众多；你可能希望访问 D3 可视化画廊\
  \ [`github.com/d3/d3/wiki/Gallery`](https://github.com/d3/d3/wiki/Gallery)，它集中收集了许多类型的可视化。最重要的一点是要始终牢记利益相关者的目标，并思考信息的图形化呈现如何能帮助他们。换句话说，你所做的一切都必须有充分的理由，并且是上下文的一部分。不要仅仅为了娱乐而制作花哨的展示。\n\
  \n交互式展示非常强大，因为它们将分析与图形化呈现结合了起来。当底层数据快速变化时，用户通常喜欢监控这些变化，并可能执行与假设场景相关的操作。因此，将交互集中在这些频繁的活动上，以便用户能够专注于数据，快速进行操作。构建强大的交互式仪表板需要用户体验设计的专业知识和熟练度，这是一个相当广阔的领域。再次，我们得出了相同的结论：任何非平凡的数据科学项目都是团队合作的结果。\n\
  \n仪表板需要自动化，而基于云的服务非常适合此目的。它们提供了必要的可扩展且容错的基础设施，以便你可以顺利地设置你的管道。你可能需要关注两个突出的选项：PythonAnywhere（参见\
  \ [`www.pythonanywhere.com`](https://www.pythonanywhere.com)）和 Google Cloud Platform（参见\
  \ [`cloud.google.com`](https://cloud.google.com)）。前者依赖于 Amazon Web Services (AWS)。当然，你也可以使用\
  \ OpenStack（参见 [`www.openstack.org`](https://www.openstack.org)）创建本地解决方案。你可以通过使用\
  \ Kaggle 的 API 和参考文献[5]中的指南快速入门仪表板。\n\n\n\n# 7. 机器学习\n\n机器学习被视为人工智能的一个子领域，它涉及从数据中提炼知识的算法与技术。其基本要素是大数据，因为没有机器的帮助，我们试图手动处理海量数据的尝试将毫无希望。作为计算机科学的产物，机器学习试图以算法而非纯粹数学的方式解决问题。机器学习模块的外部观察者会将其视为某种发生在黑箱中的魔法。激进的还原论可能会让我们说，这一切不过是运行在经典计算机系统上的“纯粹”代码。当然，这种说法将是令人反感的。机器学习确实属于软件的一个独立分支，它从数据中学习，而不是盲目遵循预定义的规则。尽管如此，为了高效应用，我们必须了解这些算法如何学习、学习什么，以及在特定上下文中应用何种类型的算法。没有机器学习系统能察觉到它被误用。本章的目标是通过示例，专门阐述机器学习的基础概念和原理。\n\
  \n对机器学习算法进行分组有多种方式。我们可以区分以下三种学习风格：\n\n- **监督学习**：在此类学习中，算法在已知观测数据上进行训练，直到达到理想性能水平。主要挑战在于获取足够多的高质量标记数据以进行恰当训练。该组的成员包括线性回归、逻辑回归、支持向量机、朴素贝叶斯分类器等。\n\
  \n- **无监督学习**：此类算法试图自主发现数据中的隐藏结构，目的是进行分组、寻找有趣的关系（又称关联规则学习）或减少固有维度（用更少的特征描述效果）。该组的成员包括\
  \ K-Means 聚类、主成分分析、流形学习、Aprori 算法等。\n\n- **半监督学习**：此类算法试图基于标记样本的指导，解读隐藏结构。无监督学习算法在半标记数据上运行作为预处理步骤，以标记剩余的数据点（一种称为*标签传播*的技术）的情况并不少见。\n\
  \n除了对算法进行分组，我们还可以区分以下不同的学习方法：\n\n- **全批次学习（又称统计学习）**：我们一次性将所有训练数据输入算法。初始训练后，模型参数保持固定。由于其简单性，这种方案在演示各种算法的实际应用中也是最常见的。\n\
  \n- **小批量学习**：我们以分块的方式输入算法。例如，对于极庞大的训练样本，标准的梯度下降优化方法并不可行。这时，随机梯度下降替代方案变得有吸引力，它在任何时刻都只处理一个较小的数据块。\n\
  \n- **在线学习**：这是小批量学习的一个极端情况，其中批次大小缩减为单个观测值。通常的设置是，系统在历史数据上进行预热，然后在生产运行中更新其参数。这种学习方法有许多子变体，为避免嵌套，下面将它们列为单独的组。\n\
  \n- **流式学习**：在此类学习中，算法每次也只处理单个观测值，但无法重新访问历史记录（通用的在线学习算法允许多次遍历数据）。流式系统可以缓存近期项目或保持运行统计（如移动平均值），尽管这些与前面几组中使用的训练语料库相比微不足道。最后，许多流式方法实际上依赖于微批量处理（使用极小批次）。它们仍然被称为流式学习，因为它们不会多次遍历较旧的批次。\n\
  \n- **主动学习**：此方法在运行过程中主动寻求其他实体的反馈。例如，基于在线学习的垃圾邮件过滤器可能会结合用户操作（将某封垃圾邮件重新归类为正常邮件，反之亦然）来持续更新自身。半监督系统可以请求帮助来标记冲突（令人困惑）的观测数据。\n\
  \n- **强化学习**：这种特殊的动态学习方法建立在系统与其环境交互的基础上。通过高效的反馈循环和奖励机制（包含正向和负向奖励），算法学习在特定上下文中哪些行为是合适的。机器人通常以这种方式学习。\n\
  \n我们还可以根据算法的相似性进行分类（例如，神经网络、谱方法、贝叶斯网络等）。尽管如此，任何分类都只能大致列举知识领域，并且存在边界模糊和重叠。然而，有些概念是所有方法共享的。这些将是本章剩余部分的主题。\n\
  \n无论你选择哪种方法，在某个时候，你都需要深入探究许多算法的内部原理，以调整高级参数、将它们组合起来以统一方式工作（又称集成学习），或将它们作为流水线连接起来进行分阶段处理。你最终无法逃避深奥的数学。好消息是，你可以通过渐进的方式应对这一挑战。\n\
  \n\n\n## 核心概念与技术阐述\n\n本节使用*普通最小二乘回归*逐步介绍常见的机器学习概念，该方法既易于理解，又足够强大，可作为讨论的基础。它通过在特征（预测变量）之间建立线性关系来预测输出值（响应变量）。特征本身可以是任意阶数和复杂度的（例如，可以是多项式项）。代码清单\
  \ 7-1 展示了 `data_generator.py` 模块，该模块通过模拟虚构的“现实世界”过程，基于各种标准生成特征和输出。代码清单 7-1 为我们演示框架提供了基础结构，以展示以下概念：现实世界、训练过程、过程参数、运行时模型、运行时参数、估计器、评估指标（损失函数、均方误差、解释方差）、过拟合、欠拟合、特征交互、共线性和正则化。我的意图是宁可通过过度简化来传达核心思想。市面上有很多优秀的机器学习书籍，背后涉及大量复杂数学知识；这个领域非常广阔。\n\
  \n```python\nimport numpy as np\nimport pandas as pd\ndef generate_base_features(sample_size):\n\
  \    x_normal = np.random.normal(6, 9, sample_size)\n    x_uniform = np.random.uniform(0,\
  \ 1, sample_size)\n    x_interacting = x_normal * x_uniform\n    x_combined = 3.6\
  \ * x_normal + np.random.exponential(2/3, sample_size)\n    x_collinear = 5.6 *\
  \ x_combined\n    features = {\n        'x_normal': x_normal,\n        'x_uniform':\
  \ x_uniform,\n        'x_interacting': x_interacting,\n        'x_combined': x_combined,\n\
  \        'x_collinear': x_collinear\n    }\n    return pd.DataFrame.from_dict(features)\n\
  def identity(x):\n    return x\ndef generate_response(X, error_spread, beta, f=identity):\n\
  \    error = np.random.normal(0, error_spread, (X.shape[0], 1))\n    intercept =\
  \ beta[0]\n    coef = np.array(beta[1:]).reshape(X.shape[1], 1)\n    return f(intercept\
  \ + np.dot(X, coef)) + error\n```\n\n*代码清单 7-1*  \n`data_generator.py` 模块\n\n我们对每个底层数据生成过程的深入了解，使我们能够准确地阐释这些概念。由\
  \ `generate_response` 模拟的现实世界具有以下向量形式：*y* = *f* (*β*[0] + *Xβ*[1 : *n*]) + *ε*（另请参阅侧边栏“线性回归的变体”），其中\
  \ `f` 是一个自定义函数。误差项代表了模型无法涵盖的固有*噪声*。我们将其视为高斯随机变量 ![$$ \\varepsilon \\sim \\mathcal{N}\\\
  left(\\mu =0,\\sigma = error\\_ spread\\right) $$](img/473947_1_En_7_Chapter_TeX_IEq1.png)；也就是说，它是一个围绕输出值呈正态分布对称波动的项。为简单起见，我们生成*同方差*输出，这意味着误差不相关且均匀（它们不依赖于\
  \ `X`）。向量 *β* 是任意的。\n\n外部观察者只能从这个世界中看到记录 (*x*[*i*], *y*[*i*])，其中 *i* ∈ [1, *样本大小*]。如图\
  \ 7-1 所示，利用一个或多个样本来重建现实世界现象，这既是艺术、工程，也是科学。我们首先*假设*一个特定的模型（例如，具有给定误差分布的线性模型）。然后，我们尝试找出模型参数（如向量\
  \ *β* 和 *σ*），并寻找合适的特征（这显然对参数有影响）。总而言之，我们需要假设和计算很多东西。\n\n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig1_HTML.jpg](img/473947_1_En_7_Fig1_HTML.jpg)\n\
  \n*图 7-1*\n\n^(¹⁸)从外部我们只能收集观测值，并尝试在特征与输出之间建立合理的关系。\n\n在特征与输出之间建立关系，使我们能够预测未来的结果，或更好地理解系统中正在发生的事情。在图\
  \ 7-1 中，前面的数字代表假设的预测变量和拟合值（我们在生产中仔细检查和计算的内容），而地球上的数字代表现实世界的数据。我们可以说，如果模型与现实世界之间的匹配程度可以接受，那么我们的模型就非常接近现实世界。\n\
  \n### 线性回归的变体\n\n线性回归的一般形式为 *y* = *m*(*x*) + *ε*。如果 *E*[*ε*|*x*]=0（当同方差性成立时），条件期望函数\
  \ *m* 即为 *E*[*y*|*x*]。根据 *m* 的结构，我们可以区分以下类型的线性回归：\n\n*   **参数化**：*m* = *β*[0] +\
  \ *Xβ*[1 : *n*] 是平滑的、确定的且易于解释。\n*   **非参数化**：*m* 是平滑的，必须从数据中发现，灵活但难以解释。\n*   **半参数化**：介于前两种情况之间（部分结构化）。\n\
  \n在决定使用哪个版本之前，您必须评估成本效益比。例如，如果您有异常值（无法剔除的极端但有效的观测值），那么简单的参数化线性回归就不是一个好的选择。非参数化版本对异常值更具鲁棒性且不易受影响。\n\
  \n想象一下，您遇到了一位乐于助人的巫师，他揭示了关于现实世界过程的一切。有了这些知识，您预测未来结果的准确度能有多高？您绝对不能说得绝对，因为在做出预测时必须应对随机性；您只能谈论看到特定响应的概率。换句话说，您可以建立一个在给定观测值条件下输出值的条件概率分布。这可以表示为\
  \ ![$$ P\\left(y|X\\right)=\\mathcal{N}\\left(f\\left({\\beta}_0+{\\beta}_{1:n}\\\
  mathrm{X}\\right),\\sigma \\right) $$](img/473947_1_En_7_Chapter_TeX_IEq2.png)\n\
  \n事实上，如果您期望遇到这样一位巫师，您离现实（和理智）并不遥远。`scikit-learn` 框架（ [`https://scikit-learn.org`](https://scikit-learn.org)\
  \ ）本身就是一个巫师。您只需仔细解读 `scikit-learn` 的“话语”，切勿误用赋予您的力量。本节的目的在于阐明必要的沟通技巧和语言，使您成为这位巫师钟爱的学徒。\n\
  \n代码清单 7-2 展示了 `scikit-learn` 包在实际中的应用，并可视化了一些底层发生的情况。`observer.py` 模块包含用于恢复参数并演示与训练、测试和评估相关的各种效果的函数。您不需要完全理解辅助显示代码（查看\
  \ `explain_sse` 和 `plot_mse` 函数）即可跟上进度。`train_model` 函数仅通过使用观测值（即带标签的训练数据）来恢复现实世界的参数。`evaluate_model`\
  \ 函数通过使用测试数据计算*均方误差 (MSE)* 和*解释方差分数*来检查模型的有效性。在实践中，您应始终选择与问题目标相一致的性能标准。脱离上下文的度量是有误导性的。\n\
  \n\n\n```python\nimport numpy as np\nimport pandas as pd\nimport seaborn as sns\n\
  import matplotlib.pyplot as plt\nplt.style.use('seaborn-whitegrid')\ndef train_model(model,\
  \ X_train, y_train):\n    model.fit(X_train, y_train)\ndef evaluate_model(model,\
  \ X_test, y_test, plot_residuals=False, title=\"\"):\n    from sklearn.metrics import\
  \ mean_squared_error, explained_variance_score\n    y_pred = model.predict(X_test)\n\
  \    if plot_residuals:\n        _, ax = plt.subplots(figsize=(9, 9))\n        ax.set_title('残差图\
  \ - ' + title, fontsize=19)\n        ax.set_xlabel('预测值', fontsize=15)\n       \
  \ ax.set_ylabel('残差', fontsize=15)\n        sns.residplot(y_pred.squeeze(), y_test.squeeze(),\n\
  \                      lowess=True,\n                      ax=ax,\n            \
  \          scatter_kws={'alpha': 0.3},\n                      line_kws={'color':\
  \ 'black', 'lw': 2, 'ls': '--'})\n    metrics = {\n        'explained_variance':\
  \ explained_variance_score(y_test, y_pred),\n        'mse': mean_squared_error(y_test,\
  \ y_pred)\n    }\n    return metrics\ndef make_poly_pipeline(model, degree):\n \
