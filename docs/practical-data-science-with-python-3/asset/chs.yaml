  \ 2！\nax.set_ylim(max(0, y_min), min(2 * error_variance, y_max))\n```\n\n你的任务是找出为什么这一行标记的代码是错误的，并实现修复。在现实中，情况甚至更糟，因为没人会给你指出错误的代码段。定位问题的确切位置是纠正错误过程中的一个巨大里程碑。\n\
  \n提示：图 7-6 是在这两行代码都被注释掉的情况下生成的。显然，这种解决方案是一个权宜之计。尝试使用原始的`plot_mse`函数运行`demo_underfitting`，看看会发生什么。\n\
  \n### 练习 7-3 避免副作用\n\n在清单 7-12 中，你可以看到一个具有副作用的函数。它通过增加额外列来修改输入的*数据框*。这个修改是调用清单 7-14\
  \ 中所示函数的前提条件。所有的链式调用都由驱动模块驱动。\n\n以副作用的方式进行编程通常是一种不好的实践。你可能会疑惑，为什么在调用模型的`fit`方法后，模型会以这种形式被更改（参见清单\
  \ 7-2）。关键区别在于，模型将其状态封装在一个对象内部，这样你对内部内容的更改有更多的控制权。当普通函数散布着隐含的副作用时，很容易失去控制，造成无法维护的混乱局面。\n\
  \n重构`feature_engineering.py`模块，将特征相关的操作归组到一个专门的类中。比较这种面向对象的方式如何有助于保持对系统内部的控制。\n\n\
  ### 练习 7-4 体验流式处理行为\n\n在清单 7-16 中，训练和测试流是按以下方式构建的：\n\n```\ntrain_stream = streamContext.queueStream([train_rdd])\n\
  test_stream = streamContext.queueStream([test_rdd])\n```\n\n这对于演示解决方案的框架来说是可以的，但在真实环境中毫无意义。流式处理的全部意义在于允许数据持续地分块到达。Apache\
  \ Spark 甚至允许将流合并，这样你可以通过多个通道获取数据（例如，你也可以监视一个文件夹以获取新的数据文件并实时解析它们）。\n\n重构解决方案，让训练集和测试集包含多个部分。你需要将引用的数据框`df_train`和`df_test`分割成多个部分，并将每个部分转换为一个`RDD`。最后，将这些部分以列表的形式提供给`queueStream`方法。观察你在输出中得到了什么（你应该收到与测试数据片段数量相同的报告）。\n\
  \n附加任务：当前的准确率报告没有暴露出太多关于性能的信息。你可能想要创建一个预测值与实际值（来自测试数据的观测值）的散点图。同时画出理想线（这基本上就是函数`y\
  \ = x`）。\n\n## 本章小结\n\n本章只是触及了机器学习（ML）领域的皮毛。即使是几十本书也不足以完全涵盖（即使是在入门级别上）所有可用的算法和技术。本章的主要目标是介绍贯穿于机器学习知识领域的通用概念。如果不了解欠拟合、过拟合、正则化、缩放等类似主题，你就无法高效地使用任何机器学习方法。要精通机器学习，你还必须记住数据科学和工程学的黄金法则：“保持简单，傻瓜！”（也就是\
  \ KISS 原则）。通常，你甚至不需要机器学习就能解决问题，而且很少有需要启动复杂的深度神经网络的时候。\n\n本章传达的另一个有力信息是：在参数调优方面，科学与艺术之间的界限相当模糊。虽然有一些经验法则（想获得良好的概述，我建议阅读[`http://martin.zinkevich.org/rules_of_ml/rules_of_ml.pdf`](http://martin.zinkevich.org/rules_of_ml/rules_of_ml.pdf)上的文档），但你仍然需要大量的实验和尝试。因此，为了在合理的时间内完成所有这些工作，你需要强大的硬件（在云中作为基础设施或平台即服务很容易获得）。\n\
  \n机器学习完全是关于数学的。你无法逃避这个事实。神经网络似乎为你提供了一条看似不错的逃避路线（我们将在第 12 章详细讨论），但最终你还是需要深入探究其内部原理，以了解正在发生的事情。这与模型的可解释性紧密相关。使用我们的普通最小二乘回归方法，系数很容易解释。一个特定的系数代表当相应特征变化一个单位时，目标变量变化多少。对于更复杂的模型，情况就不同了。无论如何，我将在第\
  \ 9 章更多地讨论模型的内部特性。\n\n机器学习正受到研究机构和工业界的巨大关注。这并不奇怪，因为随着我们更深入地进入大数据领域，就更需要以高效的方式处理如此大量的数据。只有借助机器的帮助，我们才有望掌控海量数据。一个热门话题是*迁移学习*，它试图提高训练模型的复用性。其思想是利用为一个任务优化的模型也能在其他任务上表现良好（可能只需进行少量的额外调整和训练）。这必将催生一大批新的算法和技术。\n\
  \n机器学习领域的一个迫切需求是，需要一种高效且标准化的方式来交换预测模型。其中一个标准是预测模型标记语言（PMML）。有一个 Python 库可以将 scikit-learn\
  \ 管道转换为 PMML，网址为[`https://github.com/jpmml/sklearn2pmml`](https://github.com/jpmml/sklearn2pmml)。\n\
  \n\n\n# 8. 推荐系统\n\n当人们问及机器学习在工业领域有哪些广泛应用时，推荐系统是一个典型的答案。事实上，这类系统无处不在，我们非常依赖它们。亚马逊或许是运用多种推荐系统来提升用户体验、帮助用户快速找到所需商品的最佳电商网站示例。专注于音乐领域的\
  \ Spotify 则是另一个很好的例子。尽管大量使用了机器学习，但推荐系统在以下两个关键方面与传统训练的机器学习系统有所不同：\n\n-   除了基础内容外，它们还尝试结合许多额外线索，以提供更具个性化的选择。\n\
  -   它们倾向于偏好可变性而非可预测性，以激发用户的兴奋感。试想一个推荐系统，其推荐内容从不包含令人意外的项目。\n\n这些特性使得评估推荐系统的指标完全不同。如果你试图仅通过标准均方根误差来优化预测准确性，那么你的系统在实践中很可能表现不佳，会被认为很乏味。本章将简要介绍推荐系统，并解释一些核心概念及相关技术。\n\
  \n## 推荐系统简介\n\n要熟悉推荐系统，可以试试无商业负担、免费使用的 MovieLens 项目（`https://movielens.org`）。¹⁹\
  \ MovieLens 提供个性化电影推荐。创建账户后，它立即会要求你在六种电影类型中分配三分，以生成初始档案。之后，随着你对电影进行评分和标记，它会进一步了解你，并提供更合适的电影。这是推荐系统中的典型案例：数据越多，系统就能创建关于你的更精细的档案，从而更成功地筛选内容。在这方面，高质量的输入应带来高质量的输出。图\
  \ 8-1 展示了 MovieLens 主用户界面的部分内容。尝试给几部电影评分，观察系统如何适应你更新的档案。\n\n与 MovieLens 类似，大多数推荐系统收集两种类型的数据：\n\
  \n-   **显式数据**：由用户自愿提供。例如，每次你对电影评分时，都是有意提供反馈。收集大量显式数据需要系统设计者找到巧妙的方法来吸引用户响应，例如提供激励措施。当然，如果你恰当地评价电影，你理应获得更好的推荐，这是任何人愿意费心评价产品的最小激励。\n\
  -   **隐式数据**：系统在监控用户活动时自动收集的数据（例如点击、购买等）。甚至时间事件也可能有价值；例如，如果用户在某部特定电影剧本的页面上花费的时间比其他电影页面更长，这可能表明对该电影有更高的兴趣。另一种收集隐式数据的方法是追踪关于电影的推文，以评估它们的总体流行度。总而言之，众多来源可以组合成一个单一的偏好公式。自然，获取隐式数据比获取显式数据更容易，因为它不需要用户的主动参与。\n\
  \n![../images/473947_1_En_8_Chapter/473947_1_En_8_Fig1_HTML.png](img/473947_1_En_8_Fig1_HTML.png)\n\
  \n图 8-1\n\nMovieLens 的推荐以行表示不同类别进行展示\n\n为了始终让用户有机会发现新内容，推荐是个性化内容和非个性化内容（例如总体热门项目）的混合。后者可以基于一般人口统计信息（例如年龄组、性别等）进行定制。另一个考虑是，有时你只想探索一些东西，而无需“干扰”你的个人档案（请记住，每次操作都会被追踪，包括浏览和点击，这可能会影响未来的推荐）。在\
  \ MovieLens 中，可以通过 `MovieExplorer` 功能实现这一点（该功能可能会随时间变化，因为在撰写本书时它纯粹是试验性的）。无论如何，在设计时请考虑为客户提供类似的“不追踪”选项。\n\
  \n图 8-2 突出了推荐系统与传统数据库及其他信息检索系统的另一个不同之处。推荐系统基于学习到的偏好筛选项目，而数据库则试图尽可能快地回答临时查询。MovieLens\
  \ 执行的查询集相当静态（例如，列出用户的热门电影、列出最受欢迎的电影等），如图 8-1 所示，尽管你会得到不同的结果。如果你对关系数据库系统执行相同的查询，无论你喜欢与否，你都会得到相同的输出（假设基础内容没有改变）。\n\
  \n![../images/473947_1_En_8_Chapter/473947_1_En_8_Fig2_HTML.jpg](img/473947_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n\n\n### 推荐系统\n\n在信息检索系统中，用户必须明确识别她正在寻找的内容（例如，在关系数据库中，这是通过发出 SQL 查询来完成的）。\n\
  \n推荐系统会学习用户的喜好和厌恶，并相应地修改底层查询。输出反映了当前的用户画像（即，假设个性化解决方案，结果与用户的口味产生共鸣）。通常，在推荐系统中，你不会经常更改输出类别；它们随着时间的推移是相当稳定的。基于内容的推荐系统可以使用产品数据库来显示项目的详细信息，因此它可以根据项目的属性来编码用户的品味。\n\
  \n与推荐系统相关的有三种主要接口：\n\n- **过滤功能**：尝试从流数据源（如新闻、推文、电子邮件等）中移除不感兴趣的主题（根据用户画像）。例如，个性化新闻推荐引擎可能只挑选对您重要的文章。\n\
  \n- **推荐接口**：呈现您可能喜欢的一组项目，如前文图 8-1 所示。通常，现代推荐系统是混合系统，利用不同的推荐算法来生成混合内容。例如，它既可以为您提供与您品味相匹配的特定项目，也可以为您提供当前流行的项目建议。此外，系统可能仅使用其自身的初始推荐来触发基于对话的交互，其中来自用户的额外反馈可能有助于缩小最终选择范围。\n\
  \n- **预测接口**：尝试准确预测您对某些产品的喜爱程度（例如，您会为一部未看过的电影打多少星）。当然，这些值是估计值，有时可能不准确。总的来说，您给一个项目打\
  \ 5 星还是 4.5 星并没有那么重要。更重要的是提供您认为有价值的东西。\n\n如今，大多数推荐系统都基于协同过滤技术。协同意味着利用其他用户的数据为您定制推荐。系统可能会将您的品味与其他用户关联起来，这样您就能根据这些用户的喜好和厌恶获得推荐。这是`user-user`类型的过滤。也可以根据评分关联项目，这构成了`item-item`类型的过滤；这是当今大多数系统中首选的可扩展模型。最后，还可以使用“购买了该商品的用户也购买了……”形式的产品关联规则来推荐项目。\n\
  \n基于上下文的系统还使用上下文和环境数据来微调结果（例如，根据您的心情，系统可能在您的一般偏好模型之上提供不同的音乐）。这些数据可以从您的智能手机收集；系统可能使用位置信息将列表缩小到您附近的物体。\n\
  \n## 简单电影推荐器案例研究\n\n我们将构建一个非常简单的混搭应用，用于推荐与用户输入的电影相似的电影。此示例的灵感来自参考文献[3]。该程序将使用两个公共服务并合并它们的结果；这种安排被称为*混搭*。\n\
  \n`TasteDive`（[`tastedive.com`](https://tastedive.com)，这也是其 API 的基础 URL）是一个推荐引擎，根据您的品味推荐相似的音乐、电影、电视节目、书籍、作者、游戏和播客。它提供了一个资源\
  \ API（REST Level 2），以编程方式获取相似物（该 API 文档位于`/read/api`）。如果您直接访问`/api/similar`端点（无需输入访问密钥或提供任何其他参数），您将收到以下简化的\
  \ JSON 响应（内容可能会随时间变化）：\n\n```json\n{\n\"Similar\": {\n\"Info\": [\n{\n\"Name\":\
  \ \"!!!\",\n\"Type\": \"music\"\n}\n],\n\"Results\": [\n{\n\"Name\": \"Meeting Of\
  \ Important People\",\n\"Type\": \"music\"\n},\n{\n\"Name\": \"The Vanity Project\"\
  ,\n\"Type\": \"music\"\n},\n...\n]\n}\n}\n```\n\n您可以免费发出几个 HTTP 请求。您需要一个访问密钥才能将未来的推荐服务投入生产。清单\
  \ 8-1 显示了从`TasteDive`获取物的类。这个程序完全独立于我们的最终服务。它也可以在许多其他上下文中重用。作为额外的练习，将`requests`模块更改为`requests_with_caching`（请查阅参考文献[3]的第[24\
  \ 章](https://doi.org/10.1007/978-1-4842-4859-1_24)）。\n\n```python\nimport requests\n\
  class TasteDiveService:\n    SUPPORTED_ARTIFACTS = ['music', 'movies', 'shows',\
  \ 'podcasts', 'books', 'authors', 'games']\n    API_URL = 'https://tastedive.com/api/similar'\n\
  \n    def __init__(self, artifact_type = 'movies'):\n        assert artifact_type\
  \ in TasteDiveService.SUPPORTED_ARTIFACTS, 'Invalid artifact type'\n        self._artifact_type\
  \ = artifact_type\n\n    def _retrieve_artifacts(self, name, limit):\n        params\
  \ = {'q': name, 'type': self._artifact_type, 'limit': limit}\n        return requests.get(TasteDiveService.API_URL,\
  \ params).json()\n\n    @staticmethod\n    def _extract_titles(response):\n    \
  \    artifacts = response['Similar']['Results']\n        return [artifact['Name']\
  \ for artifact in artifacts]\n\n    def similar_titles(self, titles, limit = 5):\n\
  \        \"\"\"\n        Returns a set of similar titles up to the defined limit.\
  \ Each instance of this class is supposed to work only with one artifact type. This\
  \ type is specified during object construction.\n        \"\"\"\n        assert\
  \ 0 < limit <= 50, 'Limit must be in range (0, 50].'\n        return {similar_title\n\
  \                for title in titles\n                for similar_title in TasteDiveService._extract_titles(\n\
  \                    self._retrieve_artifacts(title, limit))}\n```\n\n清单 8-1 `tastedrive_service.py`模块（位于`simple_recommender`文件夹中），用于从`TasteDive`获取相似物\n\
  \n以下是如何接收与*终结者*相似的电影的示例：\n\n```python\n>> td.similar_titles(['Terminator'])\n{'Aliens',\
  \ 'Commando', 'First Blood', 'Predator', 'Terminator Salvation'}\n```\n\n`OMDb`服务（请参阅[`www.omdbapi.com`](http://www.omdbapi.com)）提供了一个资源\
  \ API 来获取电影信息。我们将使用它来获取电影的评分，以便我们能够根据此标准对来自`TasteDive`的最终结果进行排序。清单 8-2 显示了与`OMDb`通信的类。\n\
  \n```python\nimport requests\nclass OMDbService:\n    API_URL = 'http://www.omdbapi.com/'\n\
  \n    def __init__(self, api_key):\n        self._api_key = api_key\n\n    def retrieve_info(self,\
  \ title):\n        \"\"\"Returns information about the movie title in JSON format.\"\
  \"\"\n        params = {'apikey': self._api_key, 't': title, 'type': 'movie', 'r':\
  \ 'json'}\n        return requests.get(OMDbService.API_URL, params).json()\n```\n\
  \n清单 8-2 `omdb_service.py`模块，用于帮助与`OMDb`服务通信\n\n\n\n您需要获取一个 API 密钥才能使用 OMDb。幸运的是，您可以在其网站上申请一个免费密钥（每日限制\
  \ 1000 次请求）（点击首页上的 `API Key` 标签页）。以下是获取电影 *Terminator* 信息的示例：\n\n```\n>> omdb =\
  \ OMDbService('YOUR API KEY HERE')\n>> omdb.retrieve_info('Terminator')\n{'Title':\
  \ 'Terminator',\n'Year': '1991',\n'Rated': 'N/A',\n'Released': 'N/A',\n'Runtime':\
  \ '39 min',\n'Genre': 'Short, Action, Sci-Fi',\n'Director': 'Ben Hernandez',\n'Writer':\
  \ 'James Cameron (characters), James Cameron (concept), Ben Hernandez (screenplay)',\n\
  'Actors': 'Loris Basso, James Callahan, Debbie Medows, Michelle Kovach',\n'Plot':\
  \ 'A cyborg comes from the future, to kill a girl named Sarah Lee.',\n'Language':\
  \ 'English',\n'Country': 'USA',\n'Awards': 'N/A',\n'Poster': 'N/A',\n'Ratings':\
  \ [{'Source': 'Internet Movie Database', 'Value': '6.2/10'}],\n'Metascore': 'N/A',\n\
  'imdbRating': '6.2',\n'imdbVotes': '23',\n'imdbID': 'tt5817168',\n'Type': 'movie',\n\
  'DVD': 'N/A',\n'BoxOffice': 'N/A',\n'Production': 'N/A',\n'Website': 'N/A',\n'Response':\
  \ 'True'}\n```\n\n现在我们准备创建自定义电影推荐器，该推荐器将根据评分对推荐内容进行排序。可以使用多种数据源。我们将以互联网电影数据库（Internet\
  \ Movie Database）作为主要来源，并在必要时回退到`imdbRating`。您也可以利用其他来源（例如烂番茄（Rotten Tomatoes））。清单\
  \ 8-3 展示了这个简单的推荐混搭服务。\n\n```\nfrom tastedive_service import TasteDiveService\nfrom\
  \ omdb_service import OMDbService\nclass SimpleMovieRecommender:\nPRIMARY_SOURCE\
  \ = 'Internet Movie Database'\ndef __init__(self, omdb_api_key):\nself._omdb = OMDbService(omdb_api_key)\n\
  self._td = TasteDiveService()\n@staticmethod\ndef _retrieve_rating(omdb_response):\n\
  for rating in omdb_response['Ratings']:\nif rating['Source'] == SimpleMovieRecommender.PRIMARY_SOURCE:\n\
  return float(rating['Value'].split('/')[0])\nreturn float(omdb_response['imdbRating'])\n\
  def recommendations(self, titles, limit = 5):\n\"\"\"\nReturn a list of recommended\
  \ movie titles up to the specified limit.\nThe items are ordered according to their\
  \ ratings (from top to bottom).\n\"\"\"\nsimilar_titles = self._td.similar_titles(titles,\
  \ limit)\nratings = map(\nlambda title:\nSimpleMovieRecommender._retrieve_rating(self._omdb.retrieve_info(title)),\n\
  similar_titles)\nreturn list(map(lambda item: item[1],\nsorted(zip(ratings, similar_titles),\
  \ reverse = True)))\nListing 8-3\nsimple_movie_recommender.py Module to Offer Similar\
  \ Movies in Sorted Order\n```\n\n以下是一次会话，获取 *Terminator* 的 10 个按排序顺序排列的推荐结果：\n\n\
  ```\n>> smr = SimpleMovieRecommender('YOUR API KEY')\n>> smr.recommendations(['Terminator'],\
  \ 10)\n['Aliens',\n'Die Hard',\n'Predator',\n'First Blood',\n'Robocop',\n'Lethal\
  \ Weapon',\n'Commando',\n'Terminator Salvation',\n'Alien: Resurrection',\n'Robocop\
  \ 2']\n```\n\n### LensKit for Python 简介\n\nLensKit for Python (LKPY) 是一个用于进行离线推荐实验的开源框架。它具有高度模块化的设计，利用了\
  \ PyData 生态系统（[`pydata.org`](https://pydata.org)）。LensKit 使您能够快速启动推荐系统，并使用各种算法和评估策略进行实验。它还集成了外部推荐工具，以提供包括指标和配置在内的通用控制平面。在本节中，我们将演示使用\
  \ LensKit 进行研究和教育实验是多么容易。您可以通过执行`conda install -c lenskit lenskit`来安装 LensKit。\n\
  \n图 8-3 描述了 LensKit 的包结构，而图 8-4 展示了`algorithms`包的部分 UML 类图。LensKit 非常灵活，使您能够添加新的算法或指标，这些新内容应能基于对\
  \ PyData 标准化数据结构和框架的依赖，与现有组件无缝集成。与之前基于 Java 的 LensKit 系统相比，这是一个重大突破，因为旧系统引入了专有数据格式，并将许多内容（如固化的评估流程、隐式特性和间接配置）隐藏在工具内部。\n\
  \n![../images/473947_1_En_8_Chapter/473947_1_En_8_Fig3_HTML.jpg](img/473947_1_En_8_Fig3_HTML.jpg)\n\
  \nFigure 8-3\n\nLensKit 的包结构（根包是`lenskit`），各包之间具有定义良好的 API。\n\n`metrics`包接受 Pandas\
  \ `Series`对象作为输入，因此它可以与任何外部框架结合使用。存在一个细微的不一致之处：缺少一个简单的`knn`包装包，因为`user_knn`和`item_knn`只是最近邻搜索的不同实现（这一点已反映在相应的类名中）。针对`implicit`外部框架还有两个额外的包装类，此处省略。`Fallback`类是一个简单的混合类，它将返回从一组作为输入传入的预测器中获得的第一个结果。当更复杂的算法难以计算结果时，这会很方便，因为一个更简单的版本可能会提供替代答案。我建议您阅读参考文献\
  \ [4]，以全面了解实现推荐引擎的各种方法（所有示例均在 RapidMiner 中实现，并带有推荐系统的扩展）。\n\n下一个示例使用小型 MovieLens\
  \ 数据集，您可以从 [`http://files.grouplens.org/datasets/movielens/ml-latest-small.zip`](http://files.grouplens.org/datasets/movielens/ml-latest-small.zip)\
  \ 下载该数据集。您应将压缩包解压到`data`子文件夹中（相对于本章源代码目录）。我建议您阅读随压缩包附带的 `README.txt` 文件，以熟悉其内容。\n\
  \n![../images/473947_1_En_8_Chapter/473947_1_En_8_Fig4_HTML.jpg](img/473947_1_En_8_Fig4_HTML.jpg)\n\
  \nFigure 8-4\n\n所有具体算法类共享的通用 API 遵循 SciPy 风格，这使得无论算法内部细节如何，都能对其进行统一处理。\n\n我们将在此演示使用\
  \ LensKit 进行各种推荐引擎实验的好处（另请参见参考文献 [2]）。只需在 IPython 控制台中输入以下语句（确保您位于本章的源代码目录中）；所有步骤都记录在`lkpy_demo.py`文件中，因此您可以通过执行`%load\
  \ lkpy_demo.py`轻松地一次性执行它们。我们从导入必要的包开始：\n\n```\nfrom itertools import tee\nimport\
  \ pandas as pd\nfrom lenskit import batch\nfrom lenskit import crossfold as xf\n\
  from lenskit.algorithms import funksvd, item_knn, user_knn\nfrom lenskit.metrics\
  \ import topn\n```\n\n接下来，我们加载数据集并创建一个 Pandas `DataFrame` 对象：\n\n\n\n```python\n\
  ratings = pd.read_csv('data/ratings.csv')\nratings.rename({'userId': 'user', 'movieId':\
  \ 'item'}, axis = 'columns', inplace = True)\nprint(ratings.head())\nuser  item\
  \  rating  timestamp\n0     1     1     4.0  964982703\n1     1     3     4.0  964981247\n\
  2     1     6     4.0  964982224\n3     1    47     5.0  964983815\n4     1    50\
  \     5.0  964982931\n```\n\n如上所示，重命名列非常重要。该框架期望用户标识位于`user`列下，项目标识位于`item`列下。接下来，我们生成一个用于基于用户的五折交叉验证的数据集：\n\
  \n```python\nxf_dataset_batch, xf_dataset_test = tee(xf.partition_users(ratings[['user',\
  \ 'item', 'rating']]\n, 5, xf.SampleFrac(0.2)))\ntruth = pd.concat([test for _,\
  \ test in xf_dataset_test], ignore_index = True)\n```\n\n`tee`函数会生成底层生成器的两个副本。一个用于批量评估，另一个用于创建完整的测试数据。此函数后续将用于计算用户的理想\
  \ DCG（折损累计增益）。\n\n接下来，我们配置多种不同参数的算法。`MultiEval`工具非常适合遍历各种配置参数并生成推荐结果。每种算法的输出结果会保存在一个组合\
  \ Parquet 文件内的指定子文件夹中（你也可以生成单独的文件，然后通过调用`collect_results`进行汇总）。随后，我们可以计算各种指标来评估所达到的复杂程度。\n\
  \n```python\nrunner = batch.MultiEval('result', False, nprocs = 4)\nrunner.add_algorithms(\n\
  [item_knn.ItemItem(10), item_knn.ItemItem(20), item_knn.ItemItem(30)],\nFalse,\n\
  ['nnbrs']\n)\nrunner.add_algorithms(\n[user_knn.UserUser(10), user_knn.UserUser(20),\
  \ user_knn.UserUser(30)],\nTrue,\n['nnbrs']\n)\nrunner.add_algorithms(\n[funksvd.FunkSVD(40,\
  \ damping = 0, range = (1, 5)),\nfunksvd.FunkSVD(50, damping = 5, range = (1, 5)),\n\
  funksvd.FunkSVD(60, damping = 10, range = (1, 5))],\nFalse,\n['features', 'damping']\n\
  )\nrunner.add_datasets(xf_dataset_batch)\nrunner.run()\n```\n\n`UserUser`算法比其他两种算法慢得多。这就是为什么你非常有必要并行运行它的原因。对于每种算法，你可以收集相关属性来追踪其配置。接下来的几条语句会加载结果并将其合并到一个统一、整洁的记录结构中：\n\
  \n```python\nruns = pd.read_parquet('result/runs.parquet',\ncolumns = ('AlgoClass','RunId','damping','features','nnbrs'))\n\
  runs.rename({'AlgoClass': 'Algorithm'}, axis = 'columns', inplace = True)\ndef extract_config(x):\n\
  from math import isnan\ndamping, features, nnbrs = x\nresult = \"\nif not isnan(damping):\n\
  result = \"damping=%.2f \" % damping\nif not isnan(features):\nresult += \"features=%.2f\
  \ \" % features\nif not isnan(nnbrs):\nresult += \"nnbrs=%.2f\" % nnbrs\nreturn\
  \ result.strip()\nruns['Configuration'] = runs[['damping','features','nnbrs']].apply(extract_config,\
  \ axis = 1)\nruns.drop(columns = ['damping','features','nnbrs'], inplace = True)\n\
  recs = pd.read_parquet('result/recommendations.parquet')\nrecs = recs.merge(runs,\
  \ on = 'RunId')\nrecs.drop(columns = ['RunId'], inplace = True)\nprint(recs.head(10))\n\
  item     score  user  rank  rating Algorithm Configuration\n0   98154  5.273100\
  \     3     1     0.0  ItemItem   nnbrs=10.00\n1    4429  5.027890     3     2 \
  \    0.0  ItemItem   nnbrs=10.00\n2    1341  5.002217     3     3     0.0  ItemItem\
  \   nnbrs=10.00\n3  165103  4.991935     3     4     0.0  ItemItem   nnbrs=10.00\n\
  4    4634  4.871810     3     5     0.0  ItemItem   nnbrs=10.00\n5   98279  4.871810\
  \     3     6     0.0  ItemItem   nnbrs=10.00\n6    7008  4.869243     3     7 \
  \    0.0  ItemItem   nnbrs=10.00\n7    6530  4.777890     3     8     0.0  ItemItem\
  \   nnbrs=10.00\n8   32770  4.777890     3     9     0.0  ItemItem   nnbrs=10.00\n\
  9    4956  4.777890     3    10     0.0  ItemItem   nnbrs=10.00\n```\n\n`extract_config`方法会收集每种算法相关的配置信息。我们将算法及其配置分组，以判断哪种组合效果最佳。接下来的几行代码计算了\
  \ nDCG Top-N 准确率指标（另请参见练习 8-1）：\n\n```python\nuser_dcg = recs.groupby(['Algorithm',\
  \ 'Configuration', 'user']).rating.apply(topn.dcg)\nuser_dcg = user_dcg.reset_index(name='DCG')\n\
  ideal_dcg = topn.compute_ideal_dcgs(truth)\nuser_ndcg = pd.merge(user_dcg, ideal_dcg)\n\
  user_ndcg['nDCG'] = user_ndcg.DCG / user_ndcg.ideal_dcg\nuser_ndcg = user_ndcg.groupby(['Algorithm',\
  \ 'Configuration']).nDCG.mean()\n```\n\n接下来的两行代码生成了条形图，如图 8-5 所示：\n\n![../images/473947_1_En_8_Chapter/473947_1_En_8_Fig5_HTML.jpg](img/473947_1_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5** — 每种算法与配置组合对应的平均 nDCG\n\n```python\n%matplotlib inline\nuser_ndcg.plot.bar()\n\
  ```\n\nLensKit 帮助你试验各种推荐算法，并以标准化的方式对其进行评估。看看 LensKit 未来是否会支持预测模型标记语言（参见 `http://dmg.org`）作为交换推荐模型的一种方式，这将非常有趣。与其手动编写管道代码，不如使用根据\
  \ PMML 模式格式化的 XML 输入。PMML 序列化模型可以通过 GUI 工具（如 RapidMiner，它甚至可以通过通用优化器——包括基于遗传算法的优化器——来调整模型参数）进行管理，这进一步简化了整个流程。\n\
  \n## 练习 8-1\\. 报告预测准确率\n\n请阅读 [LKPY](https://lkpy.lenskit.org/en/stable/) 文档（`https://lkpy.lenskit.org/en/stable/`）中关于预测准确率指标的内容。注意，我们调用评估器时使用了\
  \ `batch.MultiEval('result',` `False`, `nprocs = 4)`。将第二个参数改为 `True` 以启用预测功能。你需要使用\
  \ `lenskit.metrics.predict` 包中提供的指标来评估准确率。\n\n这也是尝试使用 `Fallback` 算法来处理缺失数据的好机会。\n\
  \n## 练习 8-2\\. 实现一个新指标\n\n在 Top-N 准确率指标中，你会发现两个分类指标（也称为决策支持指标）：精确率（P）和召回率（R）。前者报告有多少推荐元素是相关的，而后者报告推荐系统涵盖了有多少相关项目。召回率至关重要，因为它关系到推荐系统是否真的能通过合适的推荐给用户带来“惊喜”（即避免遗漏有用的内容）。这可能缓解一个被称为*过滤气泡*的已知问题，即推荐系统因用户对特定项目的稀疏输入而产生偏见。许多项目缺少评分这一事实并不意味着它们对用户毫无价值。\n\
  \n通常，我们希望平衡精确率和召回率。简单地将所有内容都返回就能最大化召回率，这很容易做到。F 值指标为我们提供了均衡的解决方案。采用与我们实现 nDCG 类似的方式，实现\
  \ `F1 = 2PR / (P + R)`。根据这个新指标对算法进行排名。\n\n\n  \n## 摘要  \n\n在网络世界中，信息与产品供给极为丰富，推荐系统堪称救星。它能筛选出符合我们兴趣的条目（新闻文章、书籍、电影、音乐等，假设为个性化版本）并推荐给我们。为使推荐列表多样化，大多数推荐系统采用混合模式，将高度定制化条目与通用条目相结合。此外，许多系统还会考虑当前情境以缩小推荐范围。推荐系统的整体影响力可通过执行\
  \ A/B 测试并监测用户行为是否发生统计学上的显著变化来评估。  \n\n然而，有两个重要议题必须妥善处理：  \n\n*   **用户偏好数据的隐私与保密性**，因为推荐系统可能基于显式与隐式输入积累大量事实信息。必须告知用户这些数据如何处理，以及为何推荐特定条目（这与机器学习模型的可解释性密切相关），并且用户应能管理偏好数据（例如，你应能从系统中删除关于自己的某些事实）。第\
  \ 9 章深入讨论了隐私与保密性问题。  \n\n*   **基于机器品味塑造所产生的负面偏差**。令人略感不安的是，已有艺术家（以及帮助他们的咨询公司）试图创作迎合主流推荐系统的内容。另一方面，为启动基于内容的引擎，部分系统机械地预处理并从内容中提取特征（例如，对音频数据进行信号处理，以发现歌曲的节奏、音高和印象）。我们绝不愿看到任何分布长尾上的条目仅仅因为对推荐系统不友好而消失。\
  \  \n\n# 9. 数据安全  \n\n数据科学的核心是数据，而这不可避免地包含关于个人、组织、政府机构等的敏感信息。任何机密信息都必须以最高谨慎程度处理，并对恶意者保密。保护隐私与从数据中榨取价值是相互对立的力量，类似于在尽力优化软件系统性能的同时保障其安全性。一方改善，另一方就会削弱。作为数据科学家，我们既要确保数据得到妥善保护，又要保证数据科学产品能够抵御滥用及非预期使用（例如，防止其被用于通过推荐特定条目或说服用户以某种特定方式行动来操纵他人）。所有保护措施都应与数据科学产品的实用性良好配合；否则，开发该产品便毫无意义。\
  \  \n\n鉴于数据安全是广泛的安全工程领域的一部分，本章的目标仅是引导你关注那些你需要知晓的众多细节。本章包含大量小示例，以务实的方式解释概念。先从攻击类型及应对工具概览入手。接着，为让你了解需要关注的数据隐私法规类型，本章详细阐述了欧盟的《通用数据保护条例》（GDPR），该条例影响所有处理欧盟公民数据的解决方案。最后，本章讨论了如何保护机器学习模型以尊重隐私。\
  \  \n\n## 检查是否遭遇泄露  \n\n为理解隐私的实际含义，建议访问网站 `*';--have i been pwned?*`（[`https://haveibeenpwned.com`](https://haveibeenpwned.com)），输入你的电子邮箱地址，检查是否有账户在数据泄露事件中遭到入侵。你可能会对结果感到惊讶。图\
  \ 9-1 展示了我其中一个邮箱的查询报告，显示了三起事件。报告甚至包含链接，指向详细解释泄露事件发生经过的文章。如果你的报告显示未发现泄露，建议务必点击链接阅读报告，了解“真实场景”中的运作方式。\
  \  \n\n![../images/473947_1_En_9_Chapter/473947_1_En_9_Fig1_HTML.jpg](img/473947_1_En_9_Fig1_HTML.jpg)\
  \  \n\n**图 9-1**  \n显示与我的邮箱相关事件的报告  \n\n如果你的地址遭到“入侵”，主要存在两大问题：  \n\n*   由于安全措施不当，你的私人详细信息可能已泄露给恶意人员。\
  \  \n\n*   你从未联系过的第三方掌握了你的一些信息。以我为例，尽管我的邮箱被注册在 GeekedIn 系统中，但我从未访问过该网站；他们通过不当抓取公开的\
  \ GitHub 个人资料收集了关于用户的数据。  \n\n此案例凸显了收集个人数据的实体与提供个人数据的用户之间重要的相互责任。一方面，实体必须尽最大努力遵守安全标准；另一方面，用户必须了解相关风险，并遵循通用的互联网安全建议。例如，用户应知晓绝不在多个网站上使用相同的账号/密码组合（另请参阅参考文献[1]），绝不通过不安全的连接提供敏感数据，绝不点击可疑邮件中的链接（如何识别垃圾邮件和钓鱼网站本身就是一个话题），等等。现代世界中的计算要求所有参与者具备足够的安全意识。这就像在交通中作为行人一样，无论你是否持有驾照，都需要遵守基本规则。当然，若你立志驾驶机动车，则必须积累足够经验并取得合法驾照。某些大型车辆仅能由专业司机驾驶。数据科学领域亦是如此。随着你积累的数据越来越多，必须确保自身安全技能达到足够水平，因为潜在的数据泄露不仅影响你个人。数据科学的许多领域受到严格监管，公司需要从权威机构获取证书才能处理敏感数据。不同政府机构针对数据安全制定了各种不同的法律法规（下一节我们将以\
  \ GDPR 为例进行探讨）。请参阅参考文献[2]，了解一项覆盖整个网络的、旨在建立互联网透明度与自由的有趣倡议。  \n\n大多数数据科学产品通过 API 进行远程访问，这实现了高效的数据交换场景以及混搭应用的创建（见第\
  \ 8 章）。在任何情况下，数据在传输中和静态存储时都必须受到保护。因此，外部网络通常是公共网络上的某种安全覆盖层（例如，安全的 HTTPS 通道、专用虚拟专用网络等）。互联网环境充满敌意，你的产品最终会成为攻击目标，尤其当它包含珍贵的机密数据时。\
  \  \n\n\n\n有许多组织致力于分享各种技术的最佳安全实践，你应该至少访问其中几个网站。例如，开放 Web 应用程序安全项目（OWASP）专注于通过推广成熟实践和标准来改善软件安全性（请访问\
  \ [`https://www.owasp.org`](https://www.owasp.org) ）。[SecTools.​org](http://sectools.org)\
  \ （ [`https://sectools.org`](https://sectools.org) ）将许多优秀的网络安全工具汇集在一处。（关于开发安全解决方案的良好概述，请参考参考文献[3]、[4]和[5]。）其他优秀的资源还有专注于开发安全产品的专业会议\
  \ SecAppDev（ [`https://secappdev.org`](https://secappdev.org) ），以及 ISO/IEC 27000\
  \ 系列标准，该标准规定了组织保护信息资产安全的技术（请访问 [`https://www.iso.org/isoiec-27001-information-security.html`](https://www.iso.org/isoiec-27001-information-security.html)\
  \ ）。\n\n很多时候，你会依赖开源软件来实现你的数据科学产品（另请阅读边栏“OSS 供应链攻击”）。你已经接触过许多免费可用的`Python`数据科学框架。即使理论上你一切都做对了，仅仅通过使用第三方库，仍有可能在你的产品中引入安全漏洞。以下是一些在这方面可能有用的工具示例：\n\
  \n- `Burp Suite`（ [`https://portswigger.net`](https://portswigger.net) ）有助于发现 Web\
  \ 安全问题。\n- `Snort`（ [`https://www.snort.org`](https://www.snort.org) ）是一个入侵防御系统，能够实时监控网络并根据预定义规则采取行动。\n\
  - `Snyk`（ [`https://snyk.io`](https://snyk.io) ）自动化查找和修复依赖项中的漏洞。它支持多种编程语言，包括 Python。\n\
  - `Clair`（ [`https://github.com/coreos/clair`](https://github.com/coreos/clair)\
  \ ）对应用容器中的漏洞进行静态分析（支持 Docker）。\n- `Docker Bench for Security`（ [`https://github.com/docker/docker-bench-security`](https://github.com/docker/docker-bench-security)\
  \ ）就如何使你打包的 Docker 应用程序更安全提供了宝贵建议。\n- `Gitrob`（ [`https://github.com/michenriksen/gitrob`](https://github.com/michenriksen/gitrob)\
  \ ）是一个帮助查找推送到 GitHub 公共仓库中的潜在敏感文件的工具。这种疏忽非常常见，尤其是在部署过程混乱的情况下。\n- `Vault`（ [`https://www.hashicorp.com/products/vault`](https://www.hashicorp.com/products/vault)\
  \ ）是一个用于解决`Gitrob`试图检测的问题的工具（参考上一项）。\n\n### OSS 供应链攻击\n\n开源软件（OSS）是一种新的攻击向量，其中社会工程学扮演着核心角色（参考[6]）。一个坏人通过向开源项目做出有价值的贡献开始他的旅程，直到获得项目发起人和其他贡献者的信任。一旦他获得了适当的凭证，他就会直接向开源组件的供应链植入漏洞。例如，曾发生过一起已知的`PyPI`（SSH\
  \ Decorator）被攻破事件，未来我们很可能会看到更多此类攻击。由于流行的开源框架下载量巨大，虚假代码的传播速度可能非常惊人。别忘了，如果你将开源组件整合到自己的数据科学产品中，你仍然要为产品的安全性承担法律责任；你是责任链的最后一环。因此，始终要检查你考虑使用的任何开源组件的安全状况。\n\
  \n应对这个问题的一种方法是抵制急于寻找最新版本 OSS 的诱惑。版本升级应该以可控的方式进行，可能由集中式企业风险管理（ERM）工具支持；一个好的选择是`JFrog\
  \ Artifactory`（参见 [`https://jfrog.com/artifactory`](https://jfrog.com/artifactory)\
  \ ），它有一个免费的社区版。ERM 引入了一个重要的间接层，并且还可以通过缓存工件来提高可用性。开发人员应该只检索经 QA 部门批准的组件。\n\n安全的许多方面都受到各种标准和工具的覆盖。图\
  \ 9-2 展示了在数据科学产品生命周期中持续发生的四个全局类别的安全活动。还有安全模型可以作为组织安全工作的模板。例如，你可能想了解一下微软安全开发生命周期（\
  \ [`https://www.microsoft.com/en-us/sdl`](https://www.microsoft.com/en-us/sdl) ）。\n\
  \n![../images/473947_1_En_9_Chapter/473947_1_En_9_Fig2_HTML.png](img/473947_1_En_9_Fig2_HTML.png)\n\
  \n图 9-2\n\n处理安全事件的主要阶段\n\n在一切正常运行时就提前计划好这些至关重要。例如，你必须在首次恢复尝试之前验证备份流程（假设你确实建立了这样一个流程，这是高优先级事项）。你对客户的回应必须在平静时期就制定好；永远不要试图掩盖问题！实际上，正如你稍后将看到的，`GDPR`\
  \ 甚至强制要求按照第 33 条和第 34 条的规定进行适当通知（条款是`GDPR`中作为强制性规则处理的陈述）。\n\n公司获取你信息的主要方式有三种：披露、收集和推断（另见参考文献[7]的第\
  \ 10 节，并阅读边栏“什么是隐私？”）。让我们以推荐系统为例（在第 8 章中介绍）。如果你明确给一部电影评分，那么你就是在自愿披露信息。披露是最明显的数据收集形式，因为用户完全知情并控制着这个过程。收集则稍微特殊一些。^(²¹)\
  \ 也就是说，当你点击电影描述时，系统会记录这些事件并相应地更改你的个人资料。此外，*不*点击推荐的电影也是一个有用的输入，就像你在页面上阅读电影介绍所花的时间一样；观看预告片则是另一个强烈的信号，表明你被该项目所吸引。最后，推断相当神秘。它指的是机器基于看似无害的数据发现关于你的事实的能力。最大的挑战是如何控制这种推断出的信息，防止其被进一步滥用。换句话说，如果你是一些基本事实的所有者，那么你也应该保留对衍生值的所有权。参考文献[8]中给出了一个旨在解决这个难题的好提案。\n\
  \n\n\n### 什么是隐私？\n\n术语 `privacy`（隐私）根据视角不同具有不同含义（即它是一个主观概念）。隐私的一个共同属性是与**控制**相关的预期。如果你从未同意接收未经请求的营销信息（电子邮件、短信、通知等），并且没有选择将自己的姓名从相应地址簿中删除的选项，你可能会认为这是一种隐私侵犯。从这个角度来看，**控制权的有无**决定了你是否会将那些信息归类为垃圾邮件。\n\
  \n在隐私级别与数据科学产品的实用性/能力之间存在一个微妙的临界点。在一个极端，只有不存在的（已删除的）数据才是绝对隐私的。当然，在这种情况下，你无法从数据科学服务中获得任何有价值的东西。例如，如果你从未在电影推荐网站上给任何电影评分或执行任何其他活动，那么当你获得完全非个性化的内容时，就不应感到惊讶。另一个极端是**公共数据**，它显然包含最高级别的信息内容，并且完全缺乏隐私。因此，数据科学领域的所有利益相关者都必须在**隐私与效用**之间取得平衡。如果用户能够保持控制权并改变他们关于隐私级别的决定，那么基础就得以妥善建立。\n\
  \n在她的著作 *Privacy in Context: Technology, Policy, and the Integrity of Social Life*（*情境中的隐私：技术、政策与社会生活的完整性*）（斯坦福大学出版社，2009\
  \ 年）中，海伦·尼森鲍姆教授提出，隐私关乎**情境完整性**。在某些情境下，你假设你私下透露的任何个人信息都不会被以意想不到的方式使用，或在未经你授权的情况下被分享。例如，如果你告诉医生你的健康问题，你假设医生不会将这些细节分享给你的雇主。因此，任何与特定行为规范紧密相关的事物在某种程度上都是一种隐私。\n\
  \n## GDPR 简介\n\n探究这部影响所有处理欧盟公民个人数据（包括在其大数据解决方案中）的组织的欧盟法律是很有趣的（也可以考虑观看[9]中的视频课程）。该法律既适用于总部位于欧盟的组织（无论数据处理发生在何处），也适用于处理欧盟公民数据的非欧盟组织（在本文其余部分，“欧盟”指欧盟和欧洲经济区国家）。GDPR\
  \ 是先前数据保护法的一项渐进式演进，以适应近期的技术进步（例如物联网、大数据、电子商务等）。本质上，它是一部试图规范组织行为模式以确保它们尊重人们隐私的法律。作为一部法律，它受到当地数据保护机构的严格监督，这些机构负责追究数据安全漏洞的责任。其理念是促成具有共享数据隐私预期的可互操作数据科学解决方案。即使你不在欧盟国家工作，你的组织也有可能代表一家欧盟公司处理数据。此外，审视隐私如何被制定为法律也是有益的。GDPR\
  \ 并非安全标准，因此如何实施的具体技术细节超出了本书的范畴。\n\nGDPR 由两种类型的条目组成：99 条**条款**和 173 条**序言**。前者可近似视为业务需求，而后者则作为解释条款缘由的原则。我喜欢\
  \ [`https://gdpr-info.eu`](https://gdpr-info.eu) 上呈现 GDPR 的方式，它还有一种额外的**关键问题**元素类型（该类型描述了一些应用\
  \ GDPR 时的常见问题，并附有条款和序言的引用）²²。我建议你在研读 GDPR 时，始终打开**第 4 条**，因为它包含关键术语的定义（如数据主体、个人数据、控制者、处理者等）。\n\
  \nGDPR 的主要贡献在于将数据与**控制和处理方面**的权利进行映射，这体现在**序言第 1 条**？请参见 [`https://gdpr-info.eu/recitals/no-1/`](https://gdpr-info.eu/recitals/no-1/)：“在处理个人数据方面保护自然人是一项基本权利。”其理念是在人们的基本权利与自由同个人数据处理之间取得平衡，其中包括控制者的权利（任何决定对你的个人数据进行操作的组织的权利）。例如，如果一家公司拥有关于你的极其敏感的数据，那么数据泄露可能会危及你的一些基本权利，例如你保护私人生活和家庭生活的权利（想想那些受\
  \ 2015 年 Ashley Madison 网站——一个为寻求婚外情的已婚人士提供的约会网站——黑客事件影响的用户）。\n\n**第 5 条**规定了与个人数据处理相关的原则。从某种意义上说，这应该是你进入\
  \ GDPR 的切入点。**第 6 条**详细解释了**合法处理**的含义（处理个人数据有六种法律理由）。第 5 条和第 6 条涵盖了数据的基本类别。**第 9\
  \ 条**还规定了特殊的个人数据类别以及更严格的处理规则。\n\n### 注意\n\n确保始终遵循记录完善的过程来处理与个人数据处理相关的任何决策。任何控制者都必须向监管机构证明已建立适当的治理机制，并且所有保护隐私的措施都得到严格遵守。这是**问责原则**的一部分。\n\
  \n\n\n#### 提示\n\n遵守 GDPR 有助于优化你的数据处理流程。第 5 条第 1 款第 c 项就个人数据处理作出如下规定：“个人数据应充分、相关且仅限于实现处理目的所必需的范围（‘数据最小化’）。”因此，你将不得不重新审视静态数据和传输中数据的量级。无论数据安全要求如何，减少数据量都绝对是有益的。\n\
  \n数据主体可依据第 12-23 条向控制者发送与其数据相关的请求。这些请求可主张以下权利：\n\n*   数据主体的访问权，包括获取所有数据及元数据的副本（例如，关于数据来源或处理方式的谱系信息）。\n\
  *   更正权，以便数据主体修正数据中的错误。\n*   删除权（被遗忘权），以便即使在保留期结束前也可删除数据。当然，出于法律原因，某些删除请求可能无法满足。\n\
  *   限制处理权，直至错误数据得到修正或删除。\n*   数据可携权，允许控制者之间高效地交换数据（例如，当数据主体选择以自动化方式将数据从一个控制者转移到另一个控制者），并保证能够以标准机器可读格式从控制者处接收数据。\n\
  *   反对处理权，该权利基于数据处理可能危及某些基本个人权利与自由的理由。\n*   不受包括用户画像在内的自动化决策制约的权利。\n\n控制者必须在一个月内对任何请求做出回应，且不得收费。毫无疑问，在可能的情况下，将许多任务自动化是划算的。一种特别危险的做法是，始终允许人们远程管理其个人数据。与此相关的第\
  \ 63 条序言建议是：“在可能的情况下，控制者应能够提供对一个安全系统的远程访问，使数据主体能够直接访问其个人数据。”任何通过互联网的远程访问都会立即引发一系列安全问题，一个错误可能是灾难性的。\n\
  \n还有另一组条款，即第 24-43 条，规定了控制者与处理者的义务。这些可视为数据保护要求。第 32 条涉及处理安全，其中包含了控制者和处理者需要实施的具体技术与措施（例如假名化和数据加密）。为了更好地理解\
  \ GDPR 的信息安全措施，可将第 63 条序言视为第 32 条的简要总结：\n\n> *为了维护安全并防止违反本条例的处理行为，控制者或处理者应评估处理过程中固有的风险，并实施措施来减轻这些风险，例如加密。这些措施应确保适当的安全水平，包括保密性，同时考虑到技术发展水平以及实施成本与要保护的个人数据的风险及性质之间的关系。在评估数据安全风险时，应考虑个人数据处理所带来的风险，例如意外或非法的破坏、丢失、篡改、未经授权的披露或对传输、存储或以其他方式处理的个人数据的访问，这些可能导致物理、物质或非物质损害。*\n\
  >\n> ——《通用数据保护条例》(GDPR) 第 83 条序言\n\nGDPR 倡导一种**以人为本、基于风险**的安全体系。理解这一点至关重要，因为任何绝对化的方法都必将失败。像\
  \ `ISO 27001`、`NIST` 等安全标准可能会为适当的技术提供指导，但在发生安全事件时，它们应结合对数据主体（而非组织）基本权利和自由的影响来应用。因此，GDPR\
  \ 第 32 条的核心是风险管理，这是一个适用于任何软件开发项目的广泛主题。这里的主要区别在于，评估风险的严重性必须包括可能受到攻击影响的数据主体数量。^(²³)\
  \ 此外，需注意数据量会影响风险的概率和影响，因此将风险简单地计算为概率、影响和数据量的乘积是不精确的。换言之，`risk = probability(volume)\
  \ × impact(volume)`；这两个量都是数据量的函数，并且可能具有非线性关系。例如，你的系统存储的记录越多，它成为攻击目标的可能性就越大。此外，任何数据泄露的影响也会更大，因为会波及更多的数据主体。由于很难将这些量表示为实数，你可以改用序数（借鉴敏捷用户故事估算中的\
  \ T 恤尺码法）。例如，低概率和低影响的风险将具有低严重性。\n\n\n\n### 注意\n\n不要被数字蒙蔽。如果存在可能危及他人生命的威胁，则应适用最高风险等级。我之前已提到过\
  \ Ashley Madison 约会网站的数据泄露事件。至少有两人在数据曝光后自杀身亡，因此任何类似的系统都应将与数据盗窃相关的风险视为严重风险。\n\n所有风险都应登记并存储在一个中心位置。它们应根据某种优先级策略来处理，这与从产品待办列表中选取用户故事的方式非常相似。关键区别在于，IT\
  \ 团队需要与组织的治理/法律部门密切合作，而不是让产品负责人与客户沟通。以下是一个便捷的清单，可帮助避免忽视那些根据《通用数据保护条例》（GDPR）非常重要的风险：\n\
  \n![../images/473947_1_En_9_Chapter/473947_1_En_9_Fig3_HTML.jpg](img/473947_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\n该架构的主要组件包括策略执行点 (PEP)、策略决策点 (PDP) 和策略信息点 (PIP)，如 David Brossard 在 [*http://bit.ly/abac_architecture*](http://bit.ly/abac_architecture)\
  \ 中所述。\n\n*   你删除多余数据的能力是否可操作？GDPR 规定，所有数据必须在指定的保留期后或数据主体提出请求时予以删除。作为控制者，你必须注意在任何外部处理者（尤其是在欧盟之外）处强制执行和监督数据删除。\n\
  \n*   你是否存在自认为可能不符合 GDPR 的领域？这是一种特殊的风险类型，你应该根据条款编号来评估风险。换句话说，编号较低的条款比后续列举的条款更为重要。这意味着违反第\
  \ 5 条中定义的核心原则比不遵守第 32 条更为严重。\n\n*   你对处理者是否有足够的控制？你是否已安排好与处理者合同终止后的事宜？你必须注意在合同完成后取回数据或确保数据被完全擦除。\n\
  \n*   你是否规划了足够的能力来及时响应数据主体的请求？从某种意义上说，这是大多数组织已有的常规客户支持的延伸。\n\n*   你的访问控制机制是否足够灵活，以支持所有与数据处理相关的用例？你可能希望应用一个基于属性的访问控制模型，该模型带有一个推荐的架构，如图\
  \ 9-3 所示（另请参见参考文献 [10]）。\n\n*   你是否有记录在案的响应计划？你必须在意识到数据泄露事件后的 72 小时内做出响应。当然，该事件可能发生得更早，但\
  \ 72 小时的期限是从你意识到该事件时才开始计算的。即使在最初的这一期限之后，也应继续调查问题，以纳入防御机制来防止将来此类事件的发生。监管机构通常会协助决定是否以及如何联系数据主体。\n\
  \n*   对员工活动的监控是否符合 GDPR？员工也是组织内部的数据主体，因此过度收集他们活动的数据可能会引发隐私问题。\n\n*   是否按照第 30 条的规定定义并实施了数据处理活动的审计？\n\
  \n参照图 9-2，PEP 可以是 API 网关的一部分，它拦截请求并将相应的授权请求传递给 PDP。PDP 根据预定义的策略决定是否批准每个请求。这些策略由另一个独立组件——策略编写点\
  \ (PAP) 进行编辑。PDP 可以从 PIP 收集额外的属性，PIP 是一个从各种外部来源收集属性的中心枢纽。\n\n一个可行的启发式方法是研究公认的行业标准，并确保你的实践与类似企业相匹配。如果你打算开展与医疗保健相关的研究，那么你可能会在该领域找到许多同行公司。只需确保不要落后于它们。同样，这取决于具体情境，所以如果你处理的是\
  \ GDPR 中描述的特殊类别数据，请务必小心。\n\n第 32 条还阐述了服务可用性对数据主体的影响。这正是领域驱动设计，尤其是微服务可以大显身手的地方。拥有单一数据库可能构成巨大的安全隐患，因为它可能成为单点故障（在此情况下，是数据泄露的目标）。微服务可以选择不同的技术来处理数据，因此针对特定技术的攻击范围将是有限的。微服务可以作为分布式系统提高可用性，从而实现分区的概念。最后，由于每个微服务负责一个专门的业务领域（即，具有明确限定的上下文），因此可以逐案选择适当的安全措施。例如，医疗保健系统可能拥有独立于核心服务的辅助分区，这些分区不需要与患者记录同等级别的保护。有关构建基于微服务的安全系统的更多信息，请观看参考文献\
  \ [5] 中的视频。\n\n依赖微服务交付安全的数据科学产品的另一个好处，或者说积极副作用，是高度关注自动化和 DevOps 范式。集中式日志记录、监控和分布式追踪（全部由工具支持），以及主动执行健壮性和安全性测试（甚至在生产环境中），有助于遵守第\
  \ 32 条，该条包含有关安全措施的操作意识和有效性的章节。这些默认情况下是 DevOps 文化的一部分，该文化支持在生产环境中运行大规模基于微服务的系统。\n\
  \n## 机器学习与安全\n\n对人工智能 (AI) 系统的攻击是现实存在的。如参考文献 [11] 所述，研究人员成功修改了医疗保健领域 AI 系统所用图像上极为微小的一部分，从而欺骗系统认为存在某种健康问题，或者反过来。在参考文献\
  \ [12] 中，研究人员展示了图像识别技术如何以多种方式被欺骗。从机器学习 (ML) 模型中挖掘个人详细信息也是可能的。这给安全增加了另一个需要注意的维度。评估基于\
  \ ML 系统的安全风险的主要困难在于，我们无法确切掌握训练好的模型内部包含什么。这与模型的可解释性有关，而大多数模型（包括神经网络使用的模型）都很难理解。因此，无法保证训练好的模型能对某种逆向工程完全免疫。类似的推理也适用于\
  \ ML 算法（即，它们也是不同攻击的受害者）。\n\n若想更详细地了解 ML 安全性这一主题，建议阅读参考文献 [13]。另一个极好的知识来源是 EvadeML\
  \ 项目（访问 [`https://evademl.org`](https://evademl.org)），该项目旨在研究如何使 ML 方法在面对攻击者时更具鲁棒性。在接下来的几个小节中，我将介绍两种攻击类型及其工作原理：决策时攻击（针对模型的攻击）和训练时攻击（针对算法的攻击，通常称为*中毒*攻击）。为使文本更易读并适用于广泛的受众，我将在准确性方面稍作权衡，以使问题更易于理解。\n\
  \n\n\n### 成员推断攻击\n\n我们来看一种黑盒攻击（发表于[14]），其目的是判断某个目标模型是否使用监督学习方法，并以给定的部分记录进行了训练。这个案例研究之所以有趣，是因为它利用机器学习的对抗性用途，训练了另一个能够对初始系统预测结果进行分类的机器学习系统。显然，机器学习被用来对抗机器学习，以从目标模型中挤压出信息。机器学习模型对此类攻击的脆弱性是普遍存在的。如今，像亚马逊、谷歌、微软和\
  \ BigML 这样的大型云提供商都在提供*机器学习即服务（MLaaS）*，他们的服务产品也容易受到此类攻击（实际上，它们正是[14]中所述攻击的主要目标）。因此，如果对机器学习的安全性抱有不切实际的期望，可能会使你的系统面临风险。当然，许多弱点是可以缓解的，前提是你意识到了这些问题。\n\
  \n其基本思路是向目标模型发送一个查询，并将其预测结果输入对抗系统。^(²⁴) 最终的输出将是一个信号，指示该查询中的数据是否属于训练数据集的一部分。发送查询并收集预测结果是唯一允许与目标模型进行的交互。（白盒攻击依赖于了解目标模型的内部结构细节，因此它比黑盒变体更容易解决。）其前提是，目标模型在接收到来自训练数据集的输入时的行为，与接收到系统从未见过的数据时的行为存在显著差异。从某种意义上说，这种攻击属于侧信道攻击家族。^(²⁵)\n\
  \n我们为什么要关注这个呢？假设我们已经获得某人同意参与一个数据科学项目（同意是 GDPR 中处理个人数据的法律依据之一）。我们向她出示了隐私声明，声明她的数据将仅用于模型训练目的，并将永久安全保管。一旦她同意，任何来自成员推断攻击的潜在数据泄露都会自动成为隐私问题。如果我们的数据科学项目存储了特殊类别的数据，例如健康、财务或类似敏感领域的数据，那么我们必须对此潜在问题保持高度警惕。请注意，你不能声称这种泄露不是你的错，因为你使用的是商业云服务，从而逃避责任。根据\
  \ GDPR，作为数据控制者，你对处理者执行的任何数据处理行为负有完全的责任和义务。\n\n这里的侧信道在哪里？在第七章中，我们讨论了过拟合模型的现象。当我们急切地试图减少训练预测误差时，就会发生这种情况。因此，模型会从训练集中拾取那些与泛化无关的微小细节。一个过拟合的模型，会因为你提供的是来自训练数据集的记录还是全新的记录而表现出不同的行为。成员推断攻击正是依赖这种行为差异来将输入分类为属于或不属于训练数据集（过拟合并非唯一可能性，但为简单起见，假设就是它）。显然，避免过拟合有助于防止成员推断攻击，而正则化是实现这一点的一种方法（详见第七章）。因此，改进我们的机器学习系统以获得更好的泛化能力，从安全角度来看也是有益的。\n\
  \n#### 影子训练\n\n影子训练是一种独特的技术，其架构如图 9-4 所示。它与大卫·惠勒提出的*软件工程基本定理*产生了很好的共鸣：“计算机科学中的所有问题都可以通过增加一个间接层来解决。”在影子训练中，影子模型使用与目标模型相同的机器学习平台进行训练。目标系统对我们来说是完全不透明的，包括其私有的训练数据集。影子模型使用合成训练集进行训练。生成影子训练集的一个简单方法是依赖关于目标模型训练数据集来源总体的统计知识。更具体地说，我们需要知道各个特征的边际分布，然后从这些分布中进行采样。最终结果是在统计上有效的、代表目标模型私有训练数据集的样本。我们生成多个具有不同配置的影子模型以提高准确性。影子测试集也以类似方式生成。\n\
  \n第 i 个影子训练集用于生成第 i 个影子模型。该训练数据集包含记录及其真实标签。对于来自匹配训练数据集的每个输入，影子模型的输出都被添加到所谓的攻击训练数据集中（用于训练最终的攻击模型）。测试集则用于在攻击训练数据集中创建表示影子模型对未见数据响应的记录。\n\
  \n攻击模型是一个简单的二分类器，仅用于指示输入是否属于目标的训练数据集。实际上，攻击模型是一组模型，每个输出类对应一个模型（不过，这个细节目前并不那么重要）。要执行攻击，你需要将一个已知记录传递给目标模型，并收集其预测向量。这是一个概率向量，表示类别标签的分布。得分最高的标签被视为预测类别。攻击模型接收这个预测向量和真实的类别标签。这些就是它在训练过程中的输入（见图\
  \ 9-4）。然后，攻击模型根据它认为给定记录是否属于目标训练数据集的一部分，输出“是”或“否”。\n\n![../images/473947_1_En_9_Chapter/473947_1_En_9_Fig4_HTML.jpg](img/473947_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n\n如[14]所述，影子训练过程的整体结构及其执行流程\n\n\n\n### 投毒攻击\n\n在此类攻击中，攻击者会修改训练数据集，从而使模型发生偏移。通常，每次修改都伴随着相应的成本。攻击主要分为以下四类：\n\
  \n- **标签修改攻击**：攻击者试图修改数据集中的标签。显然，这仅适用于监督学习方法。对于二元分类器而言，此类操作被称为*标签翻转*。\n- **投毒插入攻击**：攻击者试图通过添加虚假记录来污染有限数量的任意特征向量。\n\
  - **数据修改攻击**：攻击者试图修改任意数量的记录（包括特征和标签）。\n- **温水煮蛙攻击**：攻击者在每次训练迭代中逐步注入带毒记录。其思路是保持增量变化足够小，以避免被检测到。当然，随着时间的推移，累积效应可能非常显著。此攻击名称源自一则寓言：如果将青蛙放入温水中并缓慢加热，青蛙会被煮熟而不会跳出锅；但若直接将其投入沸水中，它则会立刻跳出来。\n\
  \n图 9-5 展示了一个简单线性回归模型如何因插入异常值而被误导的示例。在这种情况下，显而易见的补救措施是移除异常值，这也是一种良好的实践做法。\n\n![../images/473947_1_En_9_Chapter/473947_1_En_9_Fig5_HTML.jpg](img/473947_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5** 即便仅一个异常值，也可能使回归线严重偏离预期方向。\n\n### 练习 9-1：研究隐私政策\n\nBitly（请参阅`http://bit.ly`）是一款用于缩短长链接的热门服务。它还能让你跟踪链接的相关使用指标。该服务提供免费套餐，因此你可以开始尝试使用该网站。显然，由于它会收集你的信息（毕竟，你的自定义链接已经透露了大量关于你兴趣的信息），隐私是一个重要问题。\n\
  \n请阅读 Bitly 的隐私政策文档，网址为`https://bitly.com/pages/privacy`。尽管是法律文本，但其风格平易近人。除了了解 Bitly\
  \ 如何处理你的个人信息外，你还可以从中获得关于如何为自身数据科学产品构建类似文档的思路。\n\n## 本章小结\n\n数据保护是数据科学的核心，因为数据点是个人和组织的代理标志。网络攻击无处不在，随着智能设备承担更重要的职责，这个问题将变得更加普遍。本章仅触及数据安全的皮毛，旨在引导你关注这一重要领域。有大量免费资源可供你进一步扩展知识并积累安全工程经验。一个轻量级的框架是常识安全框架（`https://commonsenseframework.org`），你可以以此为基础来实现安全的解决方案。你还应尝试使用`Foolbox`，这是一个用于生成对抗样本以欺骗神经网络的\
  \ Python 工具包。它附带大量代码片段，可用于尝试各种攻击（可在`https://github.com/bethgelab/foolbox`获取）。\n\n\
  作为一名数据科学家，你必须了解技术的局限性，尤其是其安全性方面。对可能影响人类决策的机器抱有不合理的信任是非常危险的。我们正处于人工智能时代的黎明，未来必将出现类似的攻击，并进一步揭示这些技术的可能性和弱点。紧跟学术界最新的\
  \ AI 研究至关重要，因为大多数新型攻击都会在已发表的研究论文中描述。\n\n# 10. 图分析\n\n图是表示不同类型网络（例如有向图、无向图、加权图、符号图和二分图）的主要数据结构。网络最自然地表现为一组节点以及节点之间的链接。社交网络是其中非常突出的一类网络。互联网是最大的现实世界网络，很容易被编码成图结构。此外，道路网络及相关路径规划算法同样基于图。本章介绍图的基本元素，展示如何使用强大的\
  \ Python 框架`NetworkX`来操作图，并举例说明如何将各种问题转化为图问题。本章还将揭示用于评估图及其关联网络特性的相关度量指标。我们将特别关注二分图及其对应的算法，如图投影。此外，我们还将介绍一些生成具有预定义属性的人工网络的方法。\n\
  \n将现实世界的现象表示为抽象网络（图）的主要原因在于，通过分析该网络的结构来回答关于目标领域的问题。例如，如果将城市表示为节点，城市之间的道路表示为链接，那么我们就可以轻松使用多种算法来计算城市之间的各种路径。其标准可以是寻找最短、最快或最便宜的路线。在社交网络中，发现最具影响力的人是一个有趣的问题，这可以映射到图中节点的中心性概念。能够将问题空间与匹配的图结构关联起来，就已经解决了问题的一半。\n\
  \n\n\n## 将使用矩阵视为图问题\n\n理解图的类型和元素的最佳方法是使用 `NetworkX`（`https://networkx.github.io`）进行实践操作。图\
  \ 10-1 展示了一个通用物联网平台的主要用例。假设你想使用名为 *使用矩阵* 的分析框架来优化系统。该框架为定位代码库调优机会提供了指导。该技术适用于许多场景，包括数据科学产品。表\
  \ 10-1 描述了使用矩阵的模板。列表示各个用例或功能，行表示资源或数据节点。表 10-2 展示了使用矩阵的一个实例（其中的数值仅为说明该技术而虚构）。\n\n\
  对列 `j` 求和表示由该用例引起的所有资源访问的相对量。对行 `i` 求和表示由所有用例引起的对该资源的访问相对量。异常值标记了可作为优化候选的列/行集合；也就是说，根据边际递减定律，应优先对这些相应的用例和/或资源进行性能调优。特定单元格的值计算公式为\
  \ `a[ij] = freq[ij]*n[ij]*p[j]`，其中 `freq[ij]` 表示用例 `j` 关于资源 `i` 的频率（单位时间内用例 `j`\
  \ 访问该资源的次数），`n[ij]` 表示每次访问的访问次数，`p[j]` 是用例 `j` 的相对优先级。\n\n我们可以将优化任务重新表述为一个图问题。节点（顶点）是用例和资源，而链接（边）根据用例对资源的影响赋予权重。“影响”关系是单向的（从用例指向资源）。该图也展示了其他关系。例如，存在表示用例之间特定\
  \ `include` 和 `extend` UML 结构的有向边。最后，参与者也通过“交互”双向关系与用例相关联。总的来说，一个节点可能有多条并行链接的图被称为\
  \ *多重图*；我们的图是一个加权有向多重图。所有链接都是双向的且具有某种默认权重的图，则是无向图的一个例子。\n\n现在，计算列/行总和的对应值就很容易了。具体来说，关联到一个资源节点的链接之和表示该行的总和（同理可用于用例节点）。我们也可以提出许多有趣的问题。参与者\
  \ 1 对系统的使用是否比参与者 2 的使用对资源有更高影响？哪个参与者对资源的利用最密集？哪个参与者与最多的用例交互（直接或间接）？所有这些答案都可以通过使用已有的图算法处理底层图来获得。\n\
