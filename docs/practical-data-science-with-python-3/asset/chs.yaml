  \n### 实现流式线性回归\n\n流式线性回归会在新训练数据添加到语料库时持续学习并更新其参数。我们依赖 Apache Spark 的 MLlib 框架，该框架提供了`StreamingLinearRegressionWithSGD`类来执行流式回归。我们唯一需要做的是为训练和测试数据提供流式数据源。一种简便的方法是通过队列传递一个*弹性分布式数据集（RDD）*实例列表。将\
  \ Pandas 的`DataFrame`的一部分转换为 RDD 很简单。清单 7-16 展示了在线模式下拟合线性模型的实现（另请参见练习 7-4），清单 7-17\
  \ 展示了`driver.py`模块的最终扩展。你需要安装`pyspark`（参见[`https://spark.apache.org/docs/latest/api/python/index.html`](https://spark.apache.org/docs/latest/api/python/index.html)）。\n\
  \n```\nfrom pyspark.sql import SparkSession\nfrom streaming_regression import *\n\
  sparkSession = SparkSession.builder \\\n.master(\"local[4]\") \\\n.appName(\"Streaming\
  \ Regression Case Study\")\\\n.getOrCreate()\nfit_and_predict(sparkSession, stock_data)\n\
  Listing 7-17\nLast Piece of the Main driver.py Module\n```\n\n```\ndef fit_and_predict(sparkSession,\
  \ ts):\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\n\
  from pyspark.streaming import StreamingContext\nfrom pyspark.mllib.regression import\
  \ StreamingLinearRegressionWithSGD\ndef to_scaled_rdd(pandasDataFrame):\nimport\
  \ pandas as pd\nfrom sklearn.preprocessing import RobustScaler\nfrom pyspark.mllib.regression\
  \ import LabeledPoint\nregressors = pandasDataFrame.columns[1:]\nnum_regressors\
  \ = len(regressors)\n#### FIX ME: As a bonus exercise, read the last paragraph from\
  \ section about residual\n#### plots and make the necessary bug fix! Compare the\
  \ behavior of this version with the\n#### fixed one and see whether you can decipher\
  \ anything from the outputs.\nscaler = RobustScaler()\nscaled_regressors = scaler.fit_transform(pandasDataFrame[regressors])\n\
  scaled_pandasDataFrame = pd.DataFrame(scaled_regressors, columns=regressors)\nscaled_pandasDataFrame['target']\
  \ = pandasDataFrame[pandasDataFrame.columns[0]].values\nsparkDataFrame = sparkSession.createDataFrame(scaled_pandasDataFrame)\n\
  return sparkDataFrame.rdd.map(\nlambda row: LabeledPoint(row[num_regressors], row[:num_regressors]))\n\
  def report_accuracy(result_rdd):\nfrom pyspark.mllib.evaluation import RegressionMetrics\n\
  if not result_rdd.isEmpty():\nmetrics = RegressionMetrics(\nresult_rdd.map(lambda\
  \ t: (float(t[1]), float(t[0]))))\nprint(\"MSE = %s\" % metrics.meanSquaredError)\n\
  print(\"RMSE = %s\" % metrics.rootMeanSquaredError)\nprint(\"R-squared = %s\" %\
  \ metrics.r2)\nprint(\"MAE = %s\" % metrics.meanAbsoluteError)\nprint(\"Explained\
  \ variance = %s\" % metrics.explainedVariance)\ndf_train, df_test = train_test_split(ts,\
  \ test_size=0.2, shuffle=False)\ntrain_rdd = to_scaled_rdd(df_train)\ntest_rdd =\
  \ to_scaled_rdd(df_test)\nstreamContext = StreamingContext(sparkSession.sparkContext,\
  \ 1)\ntrain_stream = streamContext.queueStream([train_rdd])\ntest_stream = streamContext.queueStream([test_rdd])\n\
  numFeatures = len(ts.columns) - 1\nmodel = StreamingLinearRegressionWithSGD(stepSize=0.05,\
  \ numIterations=300)\nnp.random.seed(0)\nmodel.setInitialWeights(np.random.rand(numFeatures))\n\
  model.trainOn(train_stream)\nresult_stream = model.predictOnValues(test_stream.map(lambda\
  \ lp: (lp.label, lp.features)))\nresult_stream.cache()\nresult_stream.foreachRDD(report_accuracy)\n\
  streamContext.start()\nstreamContext.awaitTermination()\nListing 7-16\nContent of\
  \ the streaming_regression.py Module to Showcase Streaming Linear Regression in\
  \ Online Mode\n```\n\n系统将打印以下报告（阅读后应终止会话）：\n\n```\nMSE = 5.663621710391528\nRMSE\
  \ = 2.379836488162901\nR-squared = -0.3217279555407153\nMAE = 1.8382286514438086\n\
  Explained variance = 1.7169768418351132\n```\n\n在撰写本文时，`StreamingLinearRegressionWithSGD`类缺少`setIntercept`方法。因此，我们得到了非常“奇怪”的\
  \ R 平方和解释方差值。同样至关重要的是，在训练模型之前要记住特征缩放的重要性。如果你不确定回归变量的分布，`RobustScaler`缩放器是一个方便的选择。\n\
  \n\n\n### 练习 7-1 提升可复用性\n\n`plot_mse`函数预设了标题和坐标轴的字体大小。为了保持一致性，这种做法在其他地方也重复出现。然而，这种方式是真正的维护噩梦（注意：`explain_sse`重复了相同的设置）。请改进代码，将通用参数的设置集中起来（提示：在[`https://matplotlib.org/users/customizing.html`](https://matplotlib.org/users/customizing.html)阅读关于样式表的内容）。你还能想出哪些方法让代码库更灵活、更易于复用？\n\
  \n当你处理各种机器学习问题时，工具函数会变得非常方便。每次需要绘制 MSE 时都重新造轮子是没有意义的。尽你所能让你的代码库具有可复用性。\n\n### 练习\
