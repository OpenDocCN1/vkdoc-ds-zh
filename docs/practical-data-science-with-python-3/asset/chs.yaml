  `describe` 方法计算每列的描述性统计（如输出最左侧所示），并将结果作为一个新的 `DataFrame` 返回。当我们显示 `summary_stat`
  时，如果所有列无法在屏幕上一屏显示，它会自动省略输出。这就是为什么我们需要专门打印 `Impressions` 列的信息。




  乍一看，所有计数都等于总行数，因此我们没有缺失值（至少在这个文件中是这样）。`Age`列的最小值为零，尽管我们已经注意到了这个特殊性。大约 36%的用户是男性，其中
  70%的用户已登录（平均值是通过将 1 相加，然后除以行数计算得出的）。诚然，为分类变量呈现平均值并不合适，但`Pandas`无法知道诸如`Gender`或`Signed_In`之类的术语代表什么含义。显然，传达语义远不止是恰当地命名事物那么简单。


