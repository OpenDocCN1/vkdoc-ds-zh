  \n图 4-5\n\n普通文本中的 LaTex 内容被优美地渲染成 HTML\n\n\n\n## 文档结构\n\n在之前的项目中，我们已经涉及了内容结构这一主题，虽然是以一种非常轻量级的方式。在此我们将投入更多关注。无论你计划使用何种技术来完成文档任务，都需要对如何构建文档有清晰的认识。结构能为你的报告带来秩序和一致性。对于这种结构没有硬性规定，但存在许多启发式方法（即最佳实践）。文档应划分为定义明确的部分，并按某种逻辑顺序排列。每个部分应有清晰的范围和篇幅；例如，将更多篇幅用于介绍而非分析中的关键发现是毫无意义的。请记住，笔记本也是一种文档，必须进行合理布局。诚然，数据科学流程已就如何以及按何种顺序执行主要步骤提供了建议（见第\
  \ 1 章），这一方面应在你的笔记本中有所体现。尽管如此，仍有一些结构规则应叠加在数据科学生命周期模型之上。\n\n一个可能合理的高级文档模板如下所示（我假设在所有场景下，一个恰当的标题/副标题都是必需的）：\n\
  \n*   **摘要**：此部分应为你的工作提供一个简要总结。它必须阐明你做了什么、以何种方式完成，并列举关键结果。\n*   **动机**：此部分应解释你的工作为何重要，以及它可能如何影响目标受众。\n\
  *   **数据集**：此部分应描述数据集及其来源。你应该给出明确的指令，解释如何检索数据集以达到可复现的目的。\n*   **数据科学生命周期阶段**：接下来的几个部分应遵循数据科学生命周期模型（数据预处理、研究问题、方法、数据分析、报告等），并简洁地解释每个阶段。这些细节在数据分析笔记本中经常出现。\n\
  *   **局限性**：此部分应诚实提及你方法中的所有局限。在决策过程中不了解约束条件是非常危险的。\n*   **结论**：此部分应阐述主要成果。\n*  \
  \ **未来工作**：此部分应给出你未来计划的一些提示。其他科学家正在处理类似问题，这为合作创造了机会。\n*   **参考文献**：此部分应列出你在研究过程中使用的所有相关参考文献。不要为了让你的工作看起来更“有说服力”而堆砌此部分。\n\
  \n你所做工作的用户可分为三大类：普通大众、决策者和技术专业人士。普通大众只对你试图解决什么问题感兴趣。这类用户可能只阅读标题和摘要。决策者是商务人士，他们很可能阅读主要发现以及局限性和结论。他们主要寻求表述清晰、可操作的见解。技术人士（包括\
  \ CTO、数据科学家等）则希望复现你的发现并扩展你的研究。因此，他们会关注你报告的方方面面，包括实现细节。如果你未能识别和/或满足这些不同类别用户的需求，那么你将降低尽可能广泛传播成果的潜力。\n\
  \n### 维基百科编辑项目\n\n作为上一节概述模板的示例，我将基于对维基百科编辑的分析，填充其中的部分内容。完整的 Jupyter notebook 已在\
  \ Kaggle 上公开（见[`https://www.kaggle.com/evarga/analysis-of-wikipedia-edits`](https://www.kaggle.com/evarga/analysis-of-wikipedia-edits)）。它确实包含了关于主要数据科学生命周期阶段的细节。这个项目的目标是引发讨论，因为有许多观点尚待商榷。模板中的以下部分应足以让你把握分析的本质（甚至无需打开前面提到的\
  \ notebook）。如果目前 Kaggle 上的 notebook 看起来复杂，不必担心。\n\n## 摘要\n\n本研究使用来自 Kaggle 的维基百科编辑数据集。它试图告知用户维基百科的内容是否稳定且值得信赖。该报告还根据编辑标题中的词汇，识别出哪些主题被编辑得最频繁。这项工作依赖于多种可视化手段（如散点图、堆叠条形图和词云）来推动结论。它还利用了`NLTK`来处理标题。我们可以得出结论，维基百科在具备适当可信度的情况下，足以用于非正式使用，而电影、体育、音乐等主题更新最为频繁。\n\
  \n#### 动机\n\n维基百科通常是人们寻找信息时访问的第一个网站。显然，其内容的高质量（准确性、可靠性、时效性等）对于广大社区至关重要。这项工作试图通过分析用户的编辑行为来深入了解维基百科的内部运作。任何人都可以编辑维基百科（包括机器人），这可能会引发对其可信度的担忧。因此，通过更深入地了解这些变更，我们可以判断维基百科是否可以被视为可靠的信息来源。顺便提一句，科学论文不能依赖维基百科。也有一些图书出版商禁止引用维基百科。总而言之，本报告试图阐明维基百科对于非正式使用是否足够可靠。\n\
  \n#### 局限性\n\n*   这些数据反映了用户在非常短时间内的活动。如此小的数据集无法提供完整的故事。此外，由于时区差异，它无法代表世界所有地区。\n\
  *   Kaggle 上对下载数据集的获取过程没有描述。因此，对所记录的事实应持保留态度。编辑的大小字段尤其有问题。\n*   数据本身也存在固有的局限性。我无法访问用户档案，因此我假设所有用户都具备同等的编辑资格。如果我能获得这些信息，那么我就可以对其修改的影响力进行加权。\n\
  \n#### 结论\n\n*   维基百科对于非正式使用足够可靠。变更主要是关于修复小问题。较大的规模变更主要与新增内容有关，并且由人类完成。这些更新被视为重大更新。\n\
  *   较大的编辑由注册用户完成，而较小的修正也由匿名用户完成。\n*   专业内容（科学、技术/相关技术等）的变更频率不如电影、体育、音乐等主题频繁。\n\n\
