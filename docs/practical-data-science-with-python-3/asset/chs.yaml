  \n使用声明式框架的另一个优势是，你的笔记本将不再包含与设备相关的冗余内容。构建仪表板的全部意义在于让人们随时随地访问数据。这意味着许多人会使用便携设备浏览数据。无论用户是在台式机、笔记本电脑、平板电脑还是智能手机上查看，你的仪表板都必须完美适配屏幕。处理所有这些适配工作都应交给框架来完成。\n\
