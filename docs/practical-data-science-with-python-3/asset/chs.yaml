  \n```\n噪声水平为 0 的迭代\n截距: -1.500\n系数:\n[[4.1]]\n解释方差得分: 1.000\n均方误差: 0.000\n噪声水平为\
  \ 2 的迭代\n截距: -1.470\n系数:\n[[4.0925705]]\n解释方差得分: 0.997\n均方误差: 4.187\n噪声水平为 15 的迭代\n\
  截距: -1.535\n系数:\n[[4.06304243]]\n解释方差得分: 0.867\n均方误差: 223.945\n```\n\n图 7-2 描绘了误差累积的情况；回归线是基于整个数据集计算的，因此在这个子集上看起来有偏差。`MSE`仅仅是平方误差和（`SSE`）的平均值。每条垂直虚红线代表一个单独的误差项（真实值*y*[*i*]与其预测值![$$\
  \ {\\hat{y}}_i $$](img/473947_1_En_7_Chapter_TeX_IEq3.png)之间的差异）。模型的系数使这个`MSE`（损失函数）最小化，而计算向量*β*的对应表达式是一个**无偏最小方差估计量**。它独立于固有噪声因子，并且`MSE`是此误差项离散程度![$$\
  \ \\sigma \\cong \\sqrt{MSE} $$](img/473947_1_En_7_Chapter_TeX_IEq4.png)的一个估计量。估计值及其依赖的值用帽号符号表示。\n\
  \n> **注意**  \n> 仅当对应的预测变量属于比率水平数据类型（存在绝对零点的概念）时，截距才有意义。否则，应将其关闭（参见`LinearRegression`类的构造函数）。\n\
  \n\n\n#### 提示\n\n`print_parameters`方法很基础。为了获得完整的 R 风格模型参数摘要，你可能想使用`statsmodels`包（访问[`https://www.statsmodels.org`](https://www.statsmodels.org)）。\n\
  \n一旦模型准备好（训练好），它就可以用于生产环境来处理未见过的数据。这就是我所说的*运行时模型*。所有学习到的（运行时）参数是其组成部分，并且通常可以通过各种通信渠道进行分发。这一特性允许在拥有大量数据的强大机器上单独进行训练。例如，我们在生产环境中处理真实数据所需的只是对应的向量![$$\
  \ \\hat{\\beta} $$](img/473947_1_En_7_Chapter_TeX_IEq5.png)。计算![$$ \\hat{y}={\\\
  hat{\\beta}}_0+{\\hat{\\beta}}_{1:n}X $$](img/473947_1_En_7_Chapter_TeX_IEq6.png)可以在任何受限设备上执行。\n\
  \n在使用`world1`（原始模型）时，我们采用了一个简单的训练过程。所有可用数据都被重复用于训练和测试，这是你在实践中应该避免的。在这种情况下，它没有引发问题。我们的模型复杂度与真实情况完美匹配，当更高的噪声导致解释方差下降以及\
  \ MSE 上升时，这一点得到了证明。这表明我们没有试图捕捉现实世界中非本质的属性。一个过于复杂的模型能够做到这一点，从而导致*过拟合*。与此相反的是*欠拟合*，即我们的模型甚至弱到无法捕捉基本特征。接下来的两节将详细演示这些方面。\n\
  \n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig2_HTML.jpg](img/473947_1_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2**\n\n误差项![$$ {\\mathrm{e}}_{\\mathrm{i}}={\\mathrm{y}}_{\\mathrm{i}}-{\\\
  hat{\\mathrm{y}}}_{\\mathrm{i}} $$](img/473947_1_En_7_Chapter_TeX_IEq7.png)被平方、求和并平均，以计算\
  \ MSE。均方根误差（![$$ \\sqrt{MSE} $$](img/473947_1_En_7_Chapter_TeX_IEq8.png)）有助于恢复响应变量的原始单位。\n\
  \n### 过拟合\n\n我们将使用不同次数的多项式特征来扩充线性模型；该模型在特征方面本身保持线性。目的是演示过拟合。由于此模型比之前研究的模型更强大，它有足够的能力来涵盖数据中的错误波动；在确定性情况下（无误差），你不会注意到任何差异。机器学习算法无法辨别数据中的不规则性是否关键。存在一种通过将历史数据拆分为训练集和测试集来检测过拟合的机制。\n\
  \n清单 7-4 展示了`demo_overfitting`函数（使用多项式特征）以及`plot_mse`函数（用于绘制不同大小的训练集和测试集的 MSE）。在运行过程中，数据被拆分为不同大小的训练集和测试集。这种训练过程的扩展引入了一个新的过程参数：用于训练目的的数据量（其余保留用于测试）。之前我们只是不加区分地使用所有数据。内部的可视化函数展示了幕后的实际情况。\n\
  \n```\ndef demo_overfitting():\ndef visualize_overfitting():\ntrain_model(optimal_model,\
  \ X, y)\ntrain_model(complex_model, X, y)\n_, ax = plt.subplots(figsize=(9, 7))\n\
  ax.set_yticklabels([])\nax.set_xticklabels([])\nax.grid(False)\nX_test = np.linspace(0,\
  \ 1.2, 100)\nplt.plot(X_test, np.sin(2 * np.pi * X_test), label='True function')\n\
  plt.plot(\nX_test,\noptimal_model.predict(X_test[:, np.newaxis]),\nlabel='Optimal\
  \ model',\nls='-.')\nplt.plot(\nX_test,\ncomplex_model.predict(X_test[:, np.newaxis]),\n\
  label='Complex model',\nls='--',\nlw=2,\ncolor='red')\nplt.scatter(X, y, alpha=0.2,\
  \ edgecolor=\"b\", s=20, label='Training Samples')\nax.fill_between(X_test, -2,\
  \ 2, where=X_test > 1, hatch='/', alpha=0.05, color=\"black\")\nplt.xlabel('x',\
  \ fontsize=15)\nplt.ylabel('y', fontsize=15)\nplt.xlim((0, 1.2))\nplt.ylim((-2,\
  \ 2))\nplt.legend(loc='upper left')\nplt.title('Visualization of How Overfitting\
  \ Occurs', fontsize=19)\nplt.show()\nset_session_seed(172)\nX = generate_base_features(120)[['x_uniform']]\n\
  y = generate_response(X, 0.1, [0, 2 * np.pi], f=np.sin)\noptimal_model = make_poly_pipeline(LinearRegression(),\
  \ 5)\nplot_mse(optimal_model, X, y, 'Optimal Model', 0.1)\ncomplex_model = make_poly_pipeline(LinearRegression(),\
  \ 35)\nplot_mse(complex_model, X, y, 'Complex Model', 0.1)\nvisualize_overfitting()\n\
  **清单 7-4**\n**包含演示过拟合的函数**\n```\n\n当模型与真实情况匹配时，训练集和测试集产生的 MSE 都会围绕可达到的最小 MSE（反映数据中的固有方差）波动，如图\
  \ 7-3 所示。否则，测试集表现会更差，如图 7-4 所示。这表明模型没有很好地泛化，并且从训练集中拾取了不重要的细节。当模型的复杂度超过所需水平时，交叉验证（CV）得分也会显著恶化。\n\
  \n\n\nCV 评分是评估模型性能的一种非常高效的方法。它是各个 CV 评分的平均值。训练数据被随机划分为 K 个大小相等的互补子集（这里我们使用 `K=10`；请参见清单\
  \ 7-2 中的 `collect_mse` 内部函数以及练习 7-2）；这个数字 `K` 是另一个与过程相关的参数。在每一轮中，一个子集用于测试（更准确地说，用于验证），而其余部分用作真正的训练数据（在后面的“正则化”一节中，我们将使用\
  \ *K 折交叉验证* 来设置一个运行时参数）。来自初始数据集的每个数据点仅被用作一次测试数据。通过这种方式，算法循环遍历所有分区，因此总体平均得分确实是一个可靠的性能指标。还有一些极端的变体，其中每次迭代仅使用单个观测值（单例）进行测试（即所谓的\
  \ *留一法交叉验证*）。\n\n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig3_HTML.jpg](img/473947_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3：当模型复杂度恰到好处时，测试集的 MSE 接近自然方差\n\n此外，随着我们使用更多的训练数据，CV 分数、测试分数和训练分数之间的方差会减小。当我们使用所有可用数据进行训练时，没有测试分数标记。水平虚线表示数据中的固有误差（可能源于测量误差）。一个合适的模型不应试图体现这一部分。在机器学习中，我们不能简单地指示计算机忘记固有误差。诀窍在于将模型的复杂度设置得恰到好处，使其没有能力去记忆不想要的细节。显然，当训练集足够小时，机器最初会试图吸收所有信息，但后来会放弃并只跟随主要趋势。因此，对于给定的模型复杂度，你必须拥有足够的训练数据。庞大的模型（尤其是深度神经网络）在生产准备就绪之前必须吞噬大量的训练数据。\n\
  \n过拟合和欠拟合（将在下一节中演示）与监督学习的核心问题——即 *偏差-方差权衡*——紧密相关。一个高偏差的模型可能会错过训练数据中的重要方差，而一个高方差的模型可能会试图捕获非本质的属性。平衡这两种力量是训练机器学习算法中最困难的方面之一。例如，必须对决策树给予极度的关注，因为它可能很容易覆盖训练数据中的所有边缘情况。\n\
  \n图 7-5 展示了为何一个过于复杂的模型泛化能力不佳；也就是说，它在测试集上表现不佳。这里所说的测试集并非特指某个领域中完全未知的区域，而仅仅是从训练集中排除的数据点的集合。关于未知空间的推理需要一种不同的学习方法（另见参考文献\
  \ [1]），这将是下一个案例研究的主题。\n\n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig4_HTML.jpg](img/473947_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4：当模型复杂度太高时，测试集的 MSE 上升到固有误差水平之上\n\n这里的交叉验证得分甚至超出了范围。观察到模型在开始时完全记住了一个小的训练样本，并且总是能够跟随意外的波动。应对这种情况的一种方法是向系统提供更多的训练数据。在我们的案例中，只有在使用\
  \ 60% 的训练集大小时，它才开始在测试集上表现得合理。\n\n### 欠拟合与特征交互\n\n本节介绍特征相互作用的另一种典型情况。其目标是展示仅识别相关特征是不够的。你必须理解它们在现实世界中是如何相互关联的。我们假设有两个模型：一个将各个特征视为独立的，另一个则包含它们的交互作用。\n\
  \n清单 7-5 展示了演示欠拟合的 `demo_underfitting` 函数。当模型与真实情况匹配时，由训练集和测试集引起的 MSE 都围绕着可达到的最小\
  \ MSE（类似于图 7-3 所示）波动。相比之下，图 7-6 说明了弱模型会发生什么；显然，向弱模型添加更多数据无济于事。在实践中，欠拟合不如过拟合常见，尤其是在使用强大的深度神经网络时。\n\
  \n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig5_HTML.jpg](img/473947_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-5：由于试图包含固有误差，复杂模型的预测线呈现锯齿状\n\n在图 7-5 的右侧，你可以看到在未探索区域发生的情况。两条拟合线都偏离了真实函数。\n\
  \n```python\ndef demo_underfitting():\n    set_session_seed(15)\n    X = generate_base_features(200)\n\
  \    X_interacting = X[['x_interacting']]\n    y = generate_response(X_interacting,\
  \ 2, [1.7, -4.3])\n    plot_mse(LinearRegression(), X_interacting, y, 'Optimal Model',\
  \ 2)\n    X_weak = X[['x_normal', 'x_uniform']]\n    plot_mse(LinearRegression(),\
  \ X_weak, y, 'Weak Model', 2)\n```\n清单 7-5：通过特征交互来演示欠拟合的函数\n\n弱模型正确地引入了两个参与的特征，但单独来看，它们无法提供价值。\n\
  \n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig6_HTML.jpg](img/473947_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-6：对于弱模型，所有集合的 MSE 都远离固有误差\n\n\n\n### 共线性\n\n如果你仔细审视`generate_base_features`函数，就会发现特征`x_normal`、`x_combined`和`x_collinear`之间存在相互关系。我们新的模拟世界仅使用了`x_normal`和`x_combined`。和之前一样，我们将假定这个世界有两种变体：一种使用相同的特征，另一种则也加入了`x_collinear`。代码清单\
