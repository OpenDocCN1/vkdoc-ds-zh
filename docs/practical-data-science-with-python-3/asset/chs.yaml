  \ -Gsplines=ortho > usage_matrix.png\n```\n\n### 注意事项\n\n建议你在添加视觉效果和重新标记节点之前复制一份图形（使用\
  \ `copy` 参数进行原地操作）。如果对此不仔细，你可能会花大量时间尝试理解代码其余部分（这些代码是使用之前的标签编写的）发生了什么。保持原始图形整洁，因为它应作为事实来源。\n\
  \n![../images/473947_1_En_10_Chapter/473947_1_En_10_Fig2_HTML.jpg](img/473947_1_En_10_Fig2_HTML.jpg)\n\
  \n**图 10-2**\n\n想象一下，如果你不能利用 NetworkX 和 Graphviz，需要花多少时间在这张图上。\n\n对于基本绘图，你可以依赖内置的\
  \ matplotlib 引擎。但是，你不应该将其用于更复杂的绘图，因为，例如，在 matplotlib 中控制节点框的大小和形状相当繁琐。此外，正如你稍后将遇到的，Graphviz\
  \ 允许你可视化图形并运行控制布局的算法。找出哪个资源受影响最大，归结为使用图的 `in_degree` 方法计算资源节点的度数（请记住边的方向性）。唯一需要注意的是，你必须指定\
  \ `weight` 参数（在我们的案例中，它将指向相关边的自定义 `weight` 属性）。在无向图中，你只需使用 `degree` 方法。\n\n### 对立的质量属性\n\
  \n众所周知，你无法在一个产品中实现所有质量属性（完整列表请参见 [bit.ly/iso-25010](http://bit.ly/iso-25010) 的 ISO/IEC\
  \ 25010:2011 质量模型）。因此，任何优化工作都必须在相互竞争的力量之间找到平衡。例如，可维护性支持可靠性，反之亦然。性能几乎与所有质量特性相竞争（这就是你应该避免过早优化以及由此产生不必要的意外复杂性的原因）。使用一种称为*符号图*的特殊图形来映射这些关系非常方便，这种图的边根据匹配节点是相互支持还是相互对立，分别用加号或减号标记。NetworkX\
  \ 允许你将任意属性附加到节点和边（我们已经看到过类似的例子，如 `role`、`label`、`relation` 等）。清单 10-2 展示了如何对可维护性、可靠性和性能之间的相互关系进行建模（注意，这里处理的是无向图）。\n\
  \n```python\nimport networkx as nx\nG = nx.Graph()\nG.add_node(0, role='quality-attribute',\
  \ label=\"可维护性\")\nG.add_node(1, role='quality-attribute', label=\"可靠性\")\nG.add_node(2,\
  \ role='quality-attribute', label=\"性能\")\nG.add_edge(0, 1, sign='+')\nG.add_edge(0,\
  \ 2, sign='-')\nG.add_edge(1, 2, sign='-')\n```\n\n**清单 10-2** `signed_graph.py`\
  \ 模块构建了质量属性之间的关系模型（参见练习 10-2）\n\n\n\n### 将模型划分为二分图\n\n图的一个重要类别是二分图，其中节点可以被划分为两个不相交的集合：`L`（左）和`R`（右）。边只允许连接不同集合中的节点；也就是说，不可以存在连接集合`L`或`R`中两个节点的边。例如，在推荐系统中，一组用户和一组电影构成了“`已评分`”关系的二分图。两个用户或两部电影之间互相评分是没有意义的。因此，只有当某个用户对某部电影进行过评分时，用户和电影之间才存在一条边。该边的权重即为实际的评分值。\n\
  \n现在，让我们在第一个多重图`G`中的`Communicate`用例和`Application`参与者之间添加一条新边（参见清单 10-1）：\n\n```\n\
  G.add_edge(0, 10, relation=\"interact\")\nG.add_edge(10, 0, relation=\"interact\"\
  )\n```\n\n这模拟了在联邦物联网网络中，一个物联网平台可以像虚拟设备一样运行的情况。即，它可以充当一组从属设备的聚合器，并从更高级别子系统的视角表现为一个新设备。参与者和用例的集合应形成一个二分图。清单\
  \ 10-3 演示了使用 NetworkX 创建这种类型图的过程。这里，`bipartite.py`通过只选择相关的节点和边，从原始多重图创建了一个二分图。（请注意，此代码假定你已经运行过`usage_matrix.py`，因此所有设置均已就绪。）\n\
  \n```\nfrom networkx.algorithms import bipartite\n#### 按先前所述添加两条新边。\nG.add_edge(0,\
  \ 10, relation=\"interact\")\nG.add_edge(10, 0, relation=\"interact\")\n"
- "# 从 G 中选出所有参与 'interact' 关系的节点和边，并基于它们创建一个无向图。\nH = nx.Graph()\nH.add_edges_from((u,\
  \ v) for u, v, r in G.edges(data='relation') if r == 'interact')\n#### 附加一个标记，用于指定哪些节点属于哪个组。\n\
  for node_id in H.nodes():\n    H.node[node_id]['bipartite'] = G.node[node_id]['role']\
  \ == 'actor'\nnx.relabel_nodes(H, {n: G.node[n]['label'].replace(' ', '\\n') for\
  \ n in H.nodes()}, copy=False)\nprint(\"验证 H 是否为二分图：\", bipartite.is_bipartite(H))\n\
  #### 这是一个图投影操作。这里，我们旨在找出哪些用例拥有共同的参与者。权重代表共同性因子。\nW = bipartite.weighted_projected_graph(H,\
  \ [n for n, r in H.nodes(data='bipartite') if r == 0])\n#### 在底层使用 matplotlib 绘制图形。\n\
  pos = nx.shell_layout(W)\nnx.draw(W, pos=pos, with_labels=True, node_size=800, font_size=12)\n\
  nx.draw_networkx_edge_labels(W, pos=pos,\n    edge_labels={(u, v): d['weight'] for\
  \ u, v, d in W.edges(data=True)})\n```\n\n清单 10-3 模块 `bipartite.py` – 从原始多重图创建二分图\n\
  \nNetworkX 并未使用独立的图类型来表示二分图。相反，它使用一种适用于常规图类型的算法。图 10-3 展示了加权投影图。\n\n![../images/473947_1_En_10_Chapter/473947_1_En_10_Fig3_HTML.jpg](img/473947_1_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3\n\n`Application`参与者使用了图示为三角形的所有三个用例。因此，这三个用例都有一个共同的参与者。另外两个用例则由`User`参与者访问。\n\
  \n### 可扩展的图加载\n\n到目前为止，我们纯粹通过代码构建了图。这对于小示例来说没问题，但在现实世界中，你的网络会非常庞大。更好的方法是直接从外部源（例如文本文件或数据库）加载图定义。在本节中，我们将研究如何结合\
  \ Pandas 和 NetworkX 来生成一个其结构保存在 CSV 文件中的图（另请参阅侧边栏“图序列化格式”）。\n\n### 图序列化格式\n\n图通常使用以下主要格式进行序列化：\n\
  \n- **邻接（关联）矩阵**：其结构与我们使用的矩阵非常相似，其中行和列表示节点。在行 i 和列 j 的每个交叉点，都有一个值 0（节点 i 和 j 之间不存在边）或\
  \ 1（节点 i 和 j 之间存在边）。你可以在创建新图时将此矩阵作为初始化参数传入。这种矩阵不适合指定额外的节点/边属性，并且非常占用内存。图通常是稀疏的，因此会有很多占据空间的零值。\n\
  \n- **邻接列表**：每个节点对应一行。在一行内，包含邻居节点的标识符。这种格式节省空间，因为只列出了存在的边。孤立的节点则会有一个空行。使用这种格式无法定义额外的属性。NetworkX\
  \ 有一个`read_adjlist`方法，用于读取以邻接列表形式保存的图。你可以通过指定`nodetype`参数将节点转换为指定的类型。`create_using`参数是指向所需工厂的指针（例如，你可以强制\
  \ NetworkX 将图加载为多重图）。文本文件可能包含注释，可以通过为`comments`参数传递值来跳过这些注释。\n\n- **边列表**：每一行代表一条边，包含源节点和目标节点的标识符。你可以附加其他项作为边的属性（如权重、关系等）。可以在专门的`read_edgelist`方法中为这些属性指定数据类型。请注意，仅凭这种格式无法表示孤立的节点。\n\
  \n- **GraphML**：这是一种全面的标记语言，用于表示各种类型的图（请访问[`http://graphml.graphdrawing.org`](http://graphml.graphdrawing.org)）。NetworkX\
  \ 有一个`read_graphml`方法，用于读取以此文件格式保存的图。\n\n我们将准备两个文件：`nodes.csv`用于存储节点（参见清单 10-4），以及`edges.edgelist`用于描述边（参见清单\
  \ 10-5）。第一个是 CSV 文件，我们将使用 Pandas 读取它，以便为节点附加属性。另一个文本文件是带有相应边属性的边列表。清单 10-6 展示了从这些文件加载图的完整代码（参见模块`load_graph.py`）。NetworkX\
  \ 有一个名为`from_pandas_dataframe`的方法，但你无法使用它来分配节点属性（它只支持边属性）。\n\n```\nimport networkx\
  \ as nx\nimport pandas as pd\nG = nx.read_edgelist('edges.edgelist',\n    create_using=nx.MultiDiGraph,\n\
  \    nodetype=int,\n    data=(('weight', int), ('relation', str)))\ndf = pd.read_csv('nodes.csv',\
  \ index_col=0)\nfor row in df.itertuples():\n    G.node[row.Index]['role'] = row.Role\n\
  \    G.node[row.Index]['label'] = row.Label\n#### 生成一份小型报告。\nprint(\"节点：\\n\", G.nodes(data=True),\
  \ sep=\"\")\nprint(\"-\" * 20, \"\\n 边：\\n\", G.edges(data=True), sep=\"\")\n```\n\
