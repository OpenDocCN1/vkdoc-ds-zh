  ax1.fill_between(df.index, df['TMAX'], df['TMIN'],\nfacecolor = 'lightgray', alpha\
  \ = 0.25)\ndef fahrenheit_to_celisus(temp):\nreturn 1.8 * temp + 32\nax2 = ax1.twinx()\n\
  y_min, y_max = ax1.get_ylim()\nax2.set_ylim(fahrenheit_to_celisus(y_min), fahrenheit_to_celisus(y_max))\n\
  ax2.set_ylabel('Temperature [\\u2109]', fontsize = 14, labelpad = 15)\nax2.spines['top'].set_visible(False)\n\
  ax2.yaxis.set_minor_locator(MultipleLocator(5))\nfor label in ax2.get_yticklabels():\n\
  label.set_fontsize(12)\nax1.scatter(extreme_low_temps.index, extreme_low_temps,\n\
  color = 'blue', marker = 'v', s = 100,\nlabel = 'Unusually low temperatures')\n\
  ax1.scatter(extreme_high_temps.index, extreme_high_temps,\ncolor = 'red', marker\
  \ = '^', s = 100,\nlabel = 'Unusually high temperatures')\nax1.legend(loc = 4, frameon\
  \ = False, title = 'Legend')\n```\n\n*清单 6-4: 函数 `plot_temps`，它生成如图 6-3 所示的图表*\n\
  \n```\nMinimum temperature: -32.8\nMaximum temperature: 3.9\nExtreme low temperatures\n\
  DATE\n2010-01-01   -31.1\n2010-01-02   -32.2\n2010-01-08   -32.8\n2010-01-09   -32.2\n\
  Name: TMIN, dtype: float64\nExtreme high temperatures\nDATE\n2010-01-14    3.9\n\
  2010-01-16    2.2\n2010-01-17    3.3\n2010-01-18    0.6\nName: TMAX, dtype: float64\n\
  ```\n\n注意加粗的行，它们展示了如何从较高的 Pandas 可视化层切换到较低的核心 `matplotlib` 层级。原始接口对于微调图表非常有用。反之亦然，可以通过将参数\
  \ `ax` 设置为您自己的轴引用来实现。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig3_HTML.jpg](img/473947_1_En_6_Fig3_HTML.jpg)\n\
  \n*图 6-3: 带有极端温度（通过阈值定义）标记的最低和最高温度图*\n\n## 最近点对案例研究\n\n寻找最近点对是计算几何中一项广为人知的任务，具有广泛的应用。我们有一组平面上的点，由其\
  \ x 和 y 坐标给出，表示为 *P* = {(*x*, *y*) | *x*, *y* ∈ *ℤ*}。我们需要找到欧几里得距离为 ![$$ \\sqrt{{\\\
  left({x}_i-{x}_j\\right)}²+{\\left({y}_i-{y}_j\\right)}²} $$](img/473947_1_En_6_Chapter_TeX_IEq1.png)\
  \ 的最近点对 *p*[*i*] ≠ *p*[*j*]。假设点的数量 `n` 在 [2, 10⁷] 范围内。\n\n我们将开发三种具有不同渐近行为的核心变体：O(*n*²)、O(*n*log²*n*)\
  \ 和 O(*n* log *n*)。您可以通过参考文献 [2] 到 [4] 来复习渐近符号和算法的相关知识。之后，我们将降低常数，以展示它们如何影响整体性能。可视化将帮助我们更清晰地说明结果。这是一个利用可视化更深入地理解程序运行时特性的例子。\n\
  \n本着以 API 为中心和面向对象开发的精神，我们首先将创建一个抽象基类。这样，所有子类都将简单地继承相同的 API，因此客户端可以根据需要平稳地更改实现（另请参见练习\
  \ 6-1）。清单 6-5 展示了这个基础类（请查看 `closest_pair` 包中的 `base_closest_pair.py` 文件）。拥有一个通用的\
  \ API 会促进实验，因为您可以在不干扰系统其余部分的情况下切换实现。此外，清晰的 API 是成功实现代码重用的先决条件。\n\n\n```python\n\"\
  \"\"用于实现寻找最近点对的各种变体的基类。\"\"\"\nimport abc\nfrom typing import Tuple, Callable, TypeVar,\
  \ Sequence, Generic\nimport numpy as np\n\nCoordinates = TypeVar('Coordinates',\
  \ Sequence[int], np.ndarray)\n\nclass BaseClosestPair(Generic[Coordinates], metaclass=abc.ABCMeta):\n\
  \    \"\"\"\n    在由 x 和 y 坐标给出的二维点中寻找最近点对。默认距离定义为标准欧几里得距离。\n\n    参数:\n        x:\
  \ 所有点的 x 坐标列表。\n        y: 所有点的 y 坐标列表。元素顺序与 x 坐标列表一致，即第 i 个点表示为(x[i], y[i])。\n\
  \    \"\"\"\n    _x: Coordinates\n    _y: Coordinates\n\n    def __init__(self,\
  \ x: Coordinates, y: Coordinates):\n        assert len(x) >= 2 and len(x) == len(y)\n\
  \        self._x = x\n        self._y = y\n\n    @property\n    def x(self) -> Coordinates:\n\
  \        \"\"\"获取点的 x 坐标。\"\"\"\n        return self._x\n\n    @property\n    def\
  \ y(self) -> Coordinates:\n        \"\"\"获取点的 y 坐标。\"\"\"\n        return self._y\n\
  \n    @staticmethod\n    def load_from_stdin() -> Tuple[Coordinates, Coordinates]:\n\
  \        \"\"\"\n        通过依次枚举 x 和 y 坐标从标准输入加载点。\n        每个数据必须用空格分隔。\n\n    \
  \    输出:\n            x 和 y 坐标的元组。\n        \"\"\"\n        import sys\n       \
  \ data = sys.stdin.read()\n        points = list(map(int, data.split()))\n     \
  \   x = points[1::2]\n        y = points[2::2]\n        return x, y\n\n    @staticmethod\n\
  \    def generate_points(n: int, seed: int) -> Tuple[Coordinates, Coordinates]:\n\
  \        \"\"\"\n        生成随机点用于压力测试。\n\n        输出:\n            x 和 y 坐标的元组。\n\
  \n        示例:\n            >>> BaseClosestPair.generate_points(3, 10)\n        \
  \    ([227077737, -930024104, -78967768], [36293302, 241441628, -968147565])\n \
  \       \"\"\"\n        import random\n        assert n >= 2\n        random.seed(seed)\n\
  \        x = [random.randint(-10**9, 10**9) for _ in range(n)]\n        y = [random.randint(-10**9,\
  \ 10**9) for _ in range(n)]\n        return x, y\n\n    @staticmethod\n    def distance(x1:\
  \ int, x2: int, y1: int, y2: int) -> float:\n        \"\"\"\n        返回两点之间的欧几里得距离。\n\
  \n        参数:\n            x1: 第一个点的 x 坐标。\n            x2: 第二个点的 x 坐标。\n      \
  \      y1: 第一个点的 y 坐标。\n            y2: 第二个点的 y 坐标。\n\n        输出:\n        定义为对应坐标差平方和平方根的两点间距离。\n\
  \n        示例:\n            >>> BaseClosestPair.distance(1, 2, 1, 2)\n          \
  \  1.4142135623730951\n            >>> BaseClosestPair.distance(1, 1, 1, 1)\n  \
  \          0.0\n        \"\"\"\n        from math import sqrt\n        return sqrt((x1\
  \ - x2)**2 + (y1 - y2)**2)\n\n    @abc.abstractmethod\n    def closest_pair(self,\
  \ distance: Callable[[int, int, int, int], float]) -> Tuple[int, int, float]:\n\
  \        \"\"\"\n        返回最近点对的索引及其距离的元组。\n\n        参数:\n            distance:\
  \ 接收四个参数(x1, x2, y1, y2)并返回两点间距离的函数。\n        \"\"\"\n\nif __name__ == \"__main__\"\
  :\n    import doctest\n    doctest.testmod()\n```\n\n代码清单 6-5：为后续所有变体指定共享 API 的抽象基类\n\
  \n通过传入新的距离测量函数，可以轻松定制`closest_pair`方法。`generate_points`方法可用于对实现进行压力测试。要对本模块进行类型检查，请在\
  \ Spyder 的控制台中执行以下命令（确保你位于本章源代码的`closest_pair`子文件夹中）：\n\n```\n!mypy --ignore-missing-imports\
  \ base_closest_pair.py\n```\n\n我们的下一个任务是创建一个小型测试工具，用于测量执行时间并生成合适的可视化效果。实际上，已有现成的软件工具可用于此目的：`cProfile`（更多详情请参阅[`https://docs.python.org/3/library/profile.html`](https://docs.python.org/3/library/profile.html)）和`SnakeViz`（你可能需要通过命令行执行`conda\
  \ install snakeviz`来安装它）。`cProfile`输出的数据格式可直接被`SnakeViz`使用。\n\n### 版本 1.0\n\n本版本是最近点对算法的朴素实现。它简单地计算所有点对之间的距离并找出最小值。代码清单\
  \ 6-6 展示了本版本的源代码。\n\n```python\n\"\"\"最近点对算法的朴素实现。\"\"\"\nfrom typing import Tuple,\
  \ Callable\nfrom closest_pair.base_closest_pair import BaseClosestPair\n\nclass\
  \ NaiveClosestPair(BaseClosestPair):\n    def closest_pair(self, distance: Callable[[int,\
  \ int, int, int], float] =\n                     BaseClosestPair.distance\n    \
  \                 ) -> Tuple[int, int, float]:\n        \"\"\"\n        遍历所有点对并计算它们之间的距离。\n\
  \n        示例:\n            >>> x = [0, 3, 100]\n            >>> y = [0, 4, 110]\n\
  \            >>> ncp = NaiveClosestPair(x, y)\n            >>> ncp.closest_pair()\n\
  \            (0, 1, 5.0)\n        \"\"\"\n        from math import inf\n       \
  \ n = len(self.x)\n        min_distance = inf\n        for i in range(n - 1):\n\
  \            for j in range(i + 1, n):\n                d = distance(self.x[i],\
  \ self.x[j], self.y[i], self.y[j])\n                if d < min_distance:\n     \
  \               min_distance = d\n                    p_i = i\n                \
  \    p_j = j\n        return p_i, p_j, min_distance\n\nif __name__ == \"__main__\"\
  :\n    import doctest\n    doctest.testmod()\n```\n\n代码清单 6-6：该问题的暴力求解实现\n```\n\n\
  \n#### 提示\n\n千万不要低估像 `NaiveClosestPair` 这样简单直接的变体的价值。它可以作为性能对比和正确性验证时非常有用的基线。具体而言，它可以与点生成器一起使用，生成许多低维测试用例。\n\
  \n让我们使用 100 个自动生成的点来分析一次运行。在 Spyder 的控制台中执行以下语句（确保你位于本章的基础源文件夹中；另请参见练习 6-2）：\n\n\
  ```\n>> from closest_pair import *\n>> import cProfile\n>> x, y = BaseClosestPair.generate_points(100,\
  \ 1)\n>> ncp = NaiveClosestPair(x, y)\n>> %mkdir results\n>> cProfile.run('ncp.closest_pair()',\
  \ filename = 'results/ncp_100_stats')\n```\n\n现在，我们应该在 `results` 子文件夹中拥有二进制的性能分析数据。在独立的命令行终端中，执行\
  \ `snakeviz results/`。这将启动一个本地 Web 服务器，默认监听 8080 端口。确切的 URL 将打印在命令行上。图 6-4 展示了 SnakeViz\
  \ 的初始界面。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig4_HTML.jpg](img/473947_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4\n\nSnakeViz 的入口页面，你可以在此处选择 `ncp_100_stats` 文件进行可视化\n\n如果选择图 6-4 中的 `ncp_100_stats`\
  \ 文件，那么你将在页面顶部看到类似图 6-5 的内容。我将鼠标悬停在从上往下数的第三个矩形上，它立即显示了一些关于 `closest_pair` 方法执行的更详细信息。这里有独立的框分别表示方法的整体签名（上下文）及其组成部分，包括方法体。\n\
  \n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig5_HTML.jpg](img/473947_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5\n\n该图是交互式的\n\n图 6-6 显示了下方部分的内容，你可能对此感到熟悉（经典的数据表格展示形式）。拥有多个视图非常方便，因为你可以在显示格式之间平滑切换，以关注所需的细节层次。你可以通过点击列标签对数据进行排序。在这里，行按\
  \ `tottime` 的降序排列。这些框是嵌套的，并组织成反映调用栈的层级结构。此外，还使用颜色对元素进行分组。例如，`closest_pair` 方法的签名和方法体被标记为粉色。右侧有一些选项可以自定义视图。图\
  \ 6-7 展示了所谓的*旭日图*样式。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig7_HTML.jpg](img/473947_1_En_6_Fig7_HTML.jpg)\n\
  \n图 6-7\n\n另一种可视化调用层级的方式，有助于把握全局\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig6_HTML.jpg](img/473947_1_En_6_Fig6_HTML.jpg)\n\
  \n图 6-6\n\n`ncalls` 表示对某个函数的调用次数（例如，4950 = 100 × 99 / 2，这是 `distance` 被调用的次数），而\
  \ `tottime` 表示在该方法内部花费的总时间\n\n让我们尝试在规模为 3000 的输入上运行我们的平方级算法。以下是执行步骤：\n\n```\n>>\
  \ x, y = BaseClosestPair.generate_points(3000, 1)\n>> ncp = NaiveClosestPair(x,\
  \ y)\n>> cProfile.run('ncp.closest_pair()', filename = 'results/ncp_3000_stats')\n\
  ```\n\n这将花费更长的时间来完成。通过访问 `http://127.0.0.1:<端口号>/snakeviz/results` 导航回 SnakeViz\
  \ 的文件夹页面，并选择 `ncp_3000_stats`。按累计时间降序排序表格，你会发现运行时间大约为 20 秒（在我的 Mac 上是 23.48 秒）^(¹⁷)。之前使用\
  \ 100 个点的运行仅耗时 0.0277 秒；输入规模增加了 30 倍，导致运行时间激增了大约 900 倍。这就是 O(*n*²) 的含义。你的机器上的具体时间会有所不同，但比率将保持不变。无论你采取什么措施来加速（例如，使用\
  \ Numba），你都将停留在相同的渐近水平上；换句话说，运行时间的比率将反映对输入规模的平方依赖性。使用更优算法的纯 Python 代码，终将在某个点上超越使用某种慢速算法的、经过超强技术增强的版本。\n\
  \n\n\n### 版本 2.0\n\n在本节中，我们将阐述该算法采用**分治**技术的 O(*n*log²*n*) 变体。这种技术将初始问题分解为多个相同类型的子问题，并独立求解它们。如果某个子问题仍然复杂，则使用相同的过程进一步分解。当遇到基础情况（即易于解决的问题）时，分解链条终止。之后，合并子问题的结果，直至得到最终答案。该方法的一个典型示例是归并排序。\n\
  \n该算法的主要步骤如下（参见参考文献[2]）：\n\n1.  根据点的 x 坐标将它们分成两半。更正式地说，如果我们将切割坐标记为 x，那么我们希望生成两组点：L（代表左）和\
  \ R（代表右），使得 L 中的所有点满足 *x*[*i*] ≤ *x*，R 中的所有点满足 *x*[*i*] > *x*。\n2.  递归地将组 L 和 R\
  \ 视为独立的子问题，并分别找到它们的解，即元组 (*p*[*L*], *q*[*L*], *d*[*L*]) 和 (*p*[*R*], *q*[*R*], *d*[*R*])。取\
  \ d = min(*d*[*L*], *d*[*R*])，并记住最小值来自哪一组。\n3.  检查 L 和 R 中是否存在距离小于 d 的点。选择 L 和 R\
  \ 中所有 x 坐标属于区间 [x – d, x + d] 的点。根据这些中间点（M）的 y 坐标进行排序（排序顺序无关紧要）。\n4.  遍历这个排序后的列表，对于每个点，计算它与至多后续七个点的距离，并维护当前找到的最佳点对。记这个三元组为\
  \ (*p*[*M*], *q*[*M*], *d*[*M*])。\n5.  最终解是 L、M 和 R 中点对的最小值。回想一下，在步骤 2 中我们已经找到了\
  \ L 和 R 之间的最小值，因此我们只需要与 M 进行一次额外的比较。\n\n在这个层面上，算法看起来很像一个菜谱。在进行任何详细的编码之前，你甚至可以将这些步骤作为注释放入源代码中。由于所有步骤都处于高层次的细节水平，它们很好地补充了底层的实现细节。这就是伪代码编程（使用伪代码进行规划）背后的核心思想。图\
  \ 6-8 直观地提供了此算法正确性的证明。在处理大量数据时，证明程序行为的定理至关重要。测试可以揭示代码中的错误，但无法确立基本事实。通常，仅凭测试很难覆盖所有可能的情况（即找到输入中的所有等价类）。建立数学证明（体现在正式的软件开发方法中）的缺点是，它需要大多数软件工程师所缺乏的专业知识。而且，你只能将其应用于系统的核心部分。例如，操作系统内核就是适合这种形式化处理的目标。\n\
  \n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig8_HTML.jpg](img/473947_1_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8** 注意，在任何大小为 d×d 的块内，最多可以包含四个点\n\n操作系统内核的任何大小为 ![$$ \\frac{d}{2}\\times\
  \ \\frac{d}{2} $$](img/473947_1_En_6_Chapter_TeX_IEq2.png) 的子块最多只能包含一个点。换句话说，如果一个尺寸为\
  \ d×d 的正方形包含五个或更多点，那么它的某些子块必然会包含多个点。然而，在这种情况下，我们会得出矛盾，即 d 没有被正确计算。此外，在这个带状区域中，任何两个距离\
  \ < d 的点必定属于同一个 2d×d 大小的矩形。因此，它们肯定会被比较，这保证了正确性。回想一下，这个矩形最多可以包含八个点（包括参考点）。在这里，我们会找到一个比\
  \ d 更短的距离，因为最右下方的点与其后续左侧点之间的距离很小。\n\n#### 运行时间分析\n\n假设我们有平面上的 `n` 个点。在步骤 1 中，我们可以使用随机化的分治算法在\
  \ O(n) 时间内找到将集合分成两个相等大小子集的中位数点。创建子集 L 和 R 是另一个 O(n) 时间的操作。在解决了两个大小为 ![$$ \\frac{n}{2}\
  \ $$](img/473947_1_En_6_Chapter_TeX_IEq3.png) 的子问题后，算法在 O(n) 时间内选择属于中间带状区域的点。然后，它在\
  \ O(*n* log *n*) 时间内对这些过滤后的点进行排序。最后，它在 O(n) 时间内计算这个带状区域内的距离（对于每个点，它执行一些固定数量的工作）。请记住，对于任何函数\
  \ *f* = *kn*，*k* ∈ ℕ，都满足 f = O(n)；也就是说，它受某个线性函数的约束。因此，无论我们连续执行多少次 O(n) 操作，或者我们执行的是\
  \ 3n、5n 还是 7n 次操作，它们的总体效果都被视为 O(n)。总而言之，总运行时间由递推公式 ![$$ T(n)=2T\\left(\\frac{n}{2}\\\
  right)+O\\left(n\\log n\\right) $$](img/473947_1_En_6_Chapter_TeX_IEq4.png) 定义。我们不能直接应用主定理，尽管我们可以复用其思想来分析我们的表达式。\n\
  \n如果我们绘制一棵递归树，那么在某个任意层级 k，该树的贡献将是 ![$$ {t}_k={2}^k\\frac{n}{2^k}\\log \\frac{n}{2^k}={2}^k\\\
  frac{n}{2^k}\\left(\\log n-k\\right) $$](img/473947_1_En_6_Chapter_TeX_IEq5.png)。树的深度是\
  \ log*n*，因此通过将每一层的贡献相加，我们最终得到 ![$$ \\sum \\limits_{k=0}^{\\log n}{t}_k=n{\\log}²n-n\\\
  sum \\limits_{k=0}^{\\log n}k\\le n{\\log}²n-\\frac{n}{2}{\\log}²n=O\\left(n{\\\
  log}²n\\right) $$](img/473947_1_En_6_Chapter_TeX_IEq6.png)。\n\n在步骤 3 中，我们反复根据点的\
  \ y 坐标进行排序，这导致了额外的 log*n* 乘数。如果我们能在一开始只做一次排序从而避免重复排序，那么我们将把运行时间降低到 *O*(*n* log *n*)。这从新的递推关系\
  \ ![$$ T(n)=2T\\left(\\frac{n}{2}\\right)+O(n) $$](img/473947_1_En_6_Chapter_TeX_IEq7.png)\
  \ 中可以看出，因为我们可以直接应用主定理。当然，在所有的分割和过滤操作中，我们应该小心地保持点的 y 顺序。\n\n### 版本 3.0\n\n为了防止扰乱点的\
  \ y 顺序，我们将通过找到正确的索引排列来间接地对它们进行排序。所有排序函数实际上都会计算这个排列，但通常不会显式返回。对原始坐标的所有访问都将通过双重间接寻址进行，如图\
  \ 6-9 所示。清单 6-7 展示了之前所述算法的快速 O(*n* log *n*) 实现。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig9_HTML.jpg](img/473947_1_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9** 数组 `s` 表示属于中间带状区域的点的有序索引\n\n数组 `s` 包含指向已排序索引数组 `y'` 的指针，这些指针最终指向原始位置。以这种方式访问点的复杂性将隐藏在适当的访问器方法中。\n\
  \n\n```python\n\"\"\"快速实现最近点对算法。\"\"\"\nfrom typing import List, Tuple, Callable\n\
  from closest_pair.base_closest_pair import Coordinates, BaseClosestPair\n\nclass\
  \ FastClosestPair(BaseClosestPair):\n    _y_prime: List[int]\n\n    def _argsort_y(self)\
  \ -> List[int]:\n        \"\"\"找到按 y 坐标排列点的索引排列。\"\"\"\n        return [t[0] for\
  \ t in sorted(enumerate(self.y), key = lambda t: t[1])]\n\n    def _get_x(self,\
  \ i: int, s: List[int]) -> int:\n        return self.x[self._y_prime[s[i]]]\n\n\
  \    def _get_y(self, i: int, s: List[int]) -> int:\n        return self.y[self._y_prime[s[i]]]\n\
  \n    def __init__(self, x: Coordinates, y: Coordinates):\n        super().__init__(x,\
  \ y)\n        self._y_prime = self._argsort_y()\n\n    def _selection(self, s: List[int],\
  \ k: int) -> int:\n        \"\"\"返回 s 中包含的按 x 坐标排列的第 k 个最小点的 x 值。\"\"\"\n      \
  \  def split(v: int) -> Tuple[List[int], List[int], List[int]]:\n            \"\"\
  \"将点围绕值 v 就地间接拆分为两个集合（左和右）。\"\"\"\n            store = 0\n            sl_idx = 0\n\
  \            for i in range(len(s)):\n                if self._get_x(i, s) < v:\n\
  \                    s[store], s[i] = s[i], s[store]\n                    store\
  \ += 1\n                elif self._get_x(i, s) == v:\n                    s[i],\
  \ s[-1] = s[-1], s[i]\n            s[-1], s[store] = s[store], s[-1]\n         \
  \   sl = [s[i] for i in range(store)]\n            sv = [s[store]]\n           \
  \ sr = [s[i] for i in range(store + 1, len(s))]\n            return sl, sv, sr\n\
  \n        import random\n        while len(s) > 1:\n            v = self._get_x(random.randint(0,\
  \ len(s) - 1), s)\n            sl, sv, sr = split(v)\n            sl_size = len(sl)\n\
  \            if sl_size > k:\n                s = sl\n            elif k >= sl_size\
  \ and k < sl_size + len(sv):\n                return v\n            else:\n    \
  \            k -= sl_size + len(sv)\n                s = sr\n        return self._get_x(0,\
  \ s)\n\n    @staticmethod\n    def _merge(sl: List[int], sr: List[int]) -> List[int]:\n\
  \        \"\"\"\n        将两个有序子列表合并成一个新的有序列表。\n        可以预先分配临时存储以进一步优化。\n     \
  \   \"\"\"\n        sl_size = len(sl)\n        sr_size = len(sr)\n        s = [0]\
  \ * (sl_size + sr_size)\n        k = 0\n        i = 0\n        j = 0\n        while\
  \ i < sl_size and j < sr_size:\n            if sl[i] < sr[j]:\n                s[k]\
  \ = sl[i]\n                i += 1\n            else:\n                s[k] = sr[j]\n\
  \                j += 1\n            k += 1\n        if i < sl_size:\n         \
  \   s[k:] = sl[i:]\n        else:\n            s[k:] = sr[j:]\n        return s\n\
  \n    def closest_pair(self) -> Tuple[int, int, float]:\n        \"\"\"\n      \
  \  在 O(n*log n) 时间内计算最小距离。\n\n        示例：\n        >>> x = [0, 3, 100]\n       \
  \ >>> y = [0, 4, 110]\n        >>> fcp = FastClosestPair(x, y)\n        >>> fcp.closest_pair()\n\
  \        (0, 1, 5.0)\n        \"\"\"\n        from math import inf\n\n        def\
  \ filter_points(s: List[int], d: float, x: int) -> List[int]:\n            \"\"\"\
  返回落在 [x-d, x+d] 区间内的点索引列表。\"\"\"\n            return [s[i] for i in range(len(s))\
  \ if abs(self._get_x(i, s) - x) <= d]\n\n        def find_nearest_neighbor(i: int,\
  \ s: List[int]) -> Tuple[float, int, int]:\n            \"\"\"\n            查找当前点\
  \ i 与按 y 坐标排列的后 7 个点之间的最小距离。\n            \"\"\"\n            curr_x = self._get_x(i,\
  \ s)\n            curr_y = self._get_y(i, s)\n            d = inf\n            min_idx\
  \ = i\n            for j in range(i + 1, min(len(s), i + 7 + 1)):\n            \
  \    curr_d = distance(curr_x, self._get_x(j, s), curr_y, self._get_y(j, s))\n \
  \               if curr_d < d:\n                    d = curr_d\n               \
  \     min_idx = j\n            return d, i, min_idx\n\n        def distance(x1:\
  \ int, x2: int, y1: int, y2: int) -> float:\n            \"\"\"返回两点之间的欧几里得距离。\"\"\
  \"\n            return ((x1 - x2) ** 2 + (y1 - y2) ** 2) ** 0.5\n\n        def find_minimum_distance(s:\
  \ List[int]) -> Tuple[int, int, float]:\n            \"\"\"查找最近点对的主要驱动函数。\"\"\"\n\
  \            if len(s) == 1:\n                # 我们将单个点的距离视为无穷大。\n              \
  \  return s[0], -1, inf\n            if len(s) == 2:\n                return s[0],\
  \ s[1], distance(self._get_x(0, s),\n                                          \
  \  self._get_x(1, s),\n                                            self._get_y(0,\
  \ s),\n                                            self._get_y(1, s))\n\n      \
  \      # 这是输入数组 x 相对于 s 的中位数值。\n            median_x = self._selection(s.copy(),\
  \ len(s) // 2)\n            # 围绕中位数分离点。\n            sl = []\n            sr = []\n\
  \            for i in range(len(s)):\n                if self._get_x(i, s) <= median_x:\n\
  \                    sl.append(s[i])\n                else:\n                  \
  \  sr.append(s[i])\n\n            # 在左侧和右侧组中找到最小距离。\n            p_l, q_l, d_l =\
  \ find_minimum_distance(sl)\n            p_r, q_r, d_r = find_minimum_distance(sr)\n\
  \            if d_l < d_r:\n                p_min, q_min = p_l, q_l\n          \
  \      d = d_l\n            else:\n                p_min, q_min = p_r, q_r\n   \
  \             d = d_r\n\n            # 合并左右索引并保持排序顺序。\n            sm = FastClosestPair._merge(sl,\
  \ sr)\n\n            # 在中间条带内找到最小距离。\n            sf = filter_points(sm, d, median_x)\n\
  \n            # 在三组（左、中、右）中找到最终的最小距离。\n            d_m, p_m, q_m = min([find_nearest_neighbor(i,\
  \ sf) for i in range(len(sf))])\n            if d_m < d:\n                return\
  \ p_m, q_m, d_m\n            else:\n                return p_min, q_min, d\n\n \
  \       p, q, d = find_minimum_distance(list(range(len(self._y_prime))))\n     \
  \   # 我们需要将点索引映射回原始基数。\n        return self._y_prime[p], self._y_prime[q], d\n\n\
  \nif __name__ == \"__main__\":\n    import doctest\n    doctest.testmod()\n```\n\
  \n**列表 6-7** `FastClosestPair` 类的实现\n\n显然，这个版本比我们在 1.0 版本中的朴素尝试要复杂得多。让我们看看它在同样的\
  \ 3000 个点数据集上的表现。创建新报告的步骤如下（假设你继续上一个控制台会话，因此已经定义了数组 `x` 和 `y`）：\n\n```python\n>>\
  \ from closest_pair import FastClosestPair\n>> fcp = FastClosestPair(x, y)\n>> cProfile.run('fcp.closest_pair()',\
  \ filename = 'results/fcp_3000_stats')\n```\n\n图 6-10 显示了这次运行的图表。如果你在 SnakeViz 中向下滚动，你会看到累积时间已经下降到远低于一秒。一旦你有了一个好的算法，你就可以放心你的解决方案是可扩展的。当然，即使在降低常数因子并应用并行处理之后，这种改进也远未达到绝对下限（另请参见练习\
  \ 6-3）。不过，这种额外的微调只有在你已经获得良好的渐近行为之后才有意义。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig10_HTML.jpg](img/473947_1_En_6_Fig10_HTML.jpg)\n\
  \n**图 6-10** 该图仅显示冰柱样式图表。显然，由于代码库更复杂，存在许多额外细节。\n\n## 算法演进的探究\n\n从多个角度来看，暴力版本和复杂版本之间的差异确实惊人。除了指数级的加速（从\
  \ n × n 到 n × log n），复杂度也成比例增加。尽管如此，通过专注于以 API 为中心的开发，我们类的客户端完全不必了解内部细节。两个版本都可以通过调用基类中指定的公共方法来以完全相同的方式使用。这再次证明了良好的软件工程技能是数据科学工作中的真正救星。\n\
  \n这个故事告诉我们，单纯的技术花招并不能让你走得很远。当然，我们在上一章中展示了 Numba，但真正的突破只能通过数学来实现。这通常适用于计算机科学，而不仅仅是数据科学，尽管对于数据科学来说，效果更加明显，因为没有一种朴素的方法可以应对大数据。\n\
  \n除了与时间相关的性能优化外，你可能还希望测量内存消耗和其他资源。为此，你也有很多选择。可以查看 `memory-profiler` 包（参见 [`pypi.org/project/memory-profiler`](https://pypi.org/project/memory-profiler)）。还有合适的魔法命令包装器\
  \ `%memit` 和 `%mprun`。你可以先执行 `%load_ext memory_profiler` 来使用它们。使用 `line_profiler`\
  \ 模块（参见 [`pypi.org/project/line_profiler`](https://pypi.org/project/line_profiler)）和\
  \ `%lprun` 魔法命令进行时间分析也是如此。\n\n\n### 交互式信息辐射器\n\n我们通常制作主动报告来总结对某些静态数据集的分析发现。标准 Jupyter\
  \ 笔记本是交付此类实时报告的常见平台。然而，在某些情况下，支撑数据集会随时间持续变化。强制用户重新运行笔记本以获取最新数据集并非可扩展的解决方案（更不用说每次都要重新发送刷新后的笔记本了）。更好的方案是建立一个流水线，让动态报告自动生成。这就是信息辐射器（也称为*仪表盘*）背后的理念。\n\
  \n我们可以区分两大类波动数据：批量处理型数据（以固定间隔累积和处理，例如每小时、每天、每周等）和流式数据（持续更新）。随之而来的仪表盘必须反映这种变化速率，并仅暴露关键的业务指标，以便监控和快速决策。任何多余的细节只会分散用户的注意力。当然，你应该构建哪种类型的仪表盘也取决于你流水线的能力。\n\
  \n假设你从包括风能和太阳能在内的各种发电厂收集电力生产数据。以下信息可能有助于有效评估电网当前和近期的状态：\n\n* 当前的能源生产与消耗\n* 不同电厂的能源生产（核电、火电、水电、风电、太阳能等）\n\
  * 短期天气预报，这是一个可能显著影响风能和太阳能电厂效能的外部因素\n\n一旦决定要在仪表盘上展示什么，接下来就必须思考如何以最佳方式视觉化传达这些信息。领域知识在这里非常重要。事实证明，桑基图是一个完美的选择。它能直观展示无环有向图中节点间的流动（电力网络可以用这种形式表示）。图\
  \ 6-11 展示了这种图的一个示例。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig11_HTML.jpg](img/473947_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11\n\n英国未来能源生产和消费的一个虚构场景（参见 [`https://github.com/d3/d3-sankey`](https://github.com/d3/d3-sankey)）\n\
  \n桑基图默认是交互式的，你可以通过点击或悬停来查看特定分支的更多细节。现在想象这个图是你广泛可访问的笔记本的一部分，并且该笔记本会定期被流水线更新。这就是用笔记本制作仪表盘的核心思想（参见参考文献\
  \ [5]）。\n\n实现交互式信息辐射器愿景的关键要素（假设我们使用 Jupyter 笔记本作为文档格式）如下：\n\n* 定期更新和发布的数据集（尝试时，可以使用\
  \ Kaggle 提供的一些数据集；参见参考文献 [5]）\n* 一个能够获取相关数据集并重新运行你的笔记本的仪表盘流水线\n* 一个交互式笔记本，很可能利用\
  \ Altair（参见 [`https://altair-viz.github.io`](https://altair-viz.github.io) ）、Plotly（参见\
  \ [`https://plot.ly`](https://plot.ly) ）、Bokeh（参见 [`https://bokeh.pydata.org`](https://bokeh.pydata.org)\
  \ ）或类似框架，因为你可能不想从头开始编码\n\n## 领域特定语言的力量\n\n领域特定语言（DSL）通过让你摆脱繁琐的实现细节，从而提高生产力和质量，使你能够仅专注于业务相关的元素。可视化是一个边界清晰的领域，适合用\
  \ DSL 来支持。Altair 是一个提供此类 DSL 的框架，使你能够在 Python 中进行声明式可视化。这种能力对于以仪表盘形式构建复杂的交互式工作流程至关重要。将时间花在低级的细枝末节上是低效的，并且是常见的错误来源。让我通过介绍\
  \ Anscombe 四重奏来展示 DSL 的力量。除了技术层面，这个例子也很有启发性，能强调可视化的重要性。清单 6-8 展示了如何仅使用 `matplotlib`\
  \ 来处理这个任务。尽管使用了 `matplotlib` 的面向对象 API，代码看起来仍然是普通的 Python 代码。\n\n```python\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\nquartets = np.asarray([\n(\n[10.0,\
  \ 8.0, 13.0, 9.0, 11.0, 14.0, 6.0, 4.0, 12.0, 7.0, 5.0],\n[8.04, 6.95, 7.58, 8.81,\
  \ 8.33, 9.96, 7.24, 4.26, 10.84, 4.82, 5.68]\n),\n(\n[10.0, 8.0, 13.0, 9.0, 11.0,\
  \ 14.0, 6.0, 4.0, 12.0, 7.0, 5.0],\n[9.14, 8.14, 8.74, 8.77, 9.26, 8.10, 6.13, 3.10,\
  \ 9.13, 7.26, 4.74]\n),\n(\n[10.0, 8.0, 13.0, 9.0, 11.0, 14.0, 6.0, 4.0, 12.0, 7.0,\
  \ 5.0],\n[7.46, 6.77, 12.74, 7.11, 7.81, 8.84, 6.08, 5.39, 8.15, 6.42, 5.73]\n),\n\
  (\n[8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 8.0, 19.0, 8.0, 8.0, 8.0],\n[6.58, 5.76, 7.71,\
  \ 8.84, 8.47, 7.04, 5.25, 12.50, 5.56, 7.91, 6.89]\n)\n])\nroman = ['I', 'II', 'III',\
  \ 'IV']\nfig = plt.figure(figsize = (12, 9))\nfig.suptitle(\"Anscombe's Quartets\"\
  , fontsize=16)\naxes = fig.subplots(2, 2, sharex = True, sharey = True)\nfor quartet\
  \ in range(quartets.shape[0]):\nx, y = quartets[quartet]\ncoef = np.polyfit(x, y,\
  \ 1)\nreg_line = np.poly1d(coef)\nax = axes[quartet // 2, quartet % 2]\nax.plot(x,\
  \ y, 'ro', x, reg_line(x), '--k')\nax.set_title(roman[quartet])\nax.set_xlim(3,\
  \ 19.5)\nax.set_ylim(2, 13)\n### 打印当前数据集的汇总统计信息\nprint(\"Quartet:\", roman[quartet])\n\
  print(\"Mean X:\", x.mean())\nprint(\"Variance X:\", x.var())\nprint(\"Mean Y:\"\
  , round(y.mean(), 2))\nprint(\"Variance Y:\", round(y.var(), 2))\nprint(\"Pearson's\
  \ correlation coef.:\", round(np.corrcoef(x, y)[0][1], 2))\nprint()\nplt.show()\n\
  ```\n\n清单 6-8：在没有高层框架的情况下，有许多需要控制的可变目标\n\n程序将打印关于每个四重奏的以下统计信息（注意它们都是相同的）：\n\n```\n\
  Quartet: I\nMean X: 9.0\nVariance X: 10.0\nMean Y: 7.5\nVariance Y: 3.75\nPearson's\
  \ correlation coef.: 0.82\nQuartet: II\nMean X: 9.0\nVariance X: 10.0\nMean Y: 7.5\n\
  Variance Y: 3.75\nPearson's correlation coef.: 0.82\nQuartet: III\nMean X: 9.0\n\
  Variance X: 10.0\nMean Y: 7.5\nVariance Y: 3.75\nPearson's correlation coef.: 0.82\n\
  Quartet: IV\nMean X: 9.0\nVariance X: 10.0\nMean Y: 7.5\nVariance Y: 3.75\nPearson's\
  \ correlation coef.: 0.82\n```\n\n然而，一旦将这些数据集可视化，差异就显而易见了，如图 6-12 所示。清单 6-9 展示了实现类似可视化的代码片段，但这次使用的是\
  \ Altair 的 DSL（也请参阅关于 DSL 的参考文献 [6]）。代码紧凑，没有不必要的低级细节。使用 DSL，你只需指定你想要完成的任务，让引擎决定交付请求输出的最佳策略。你只需将此代码粘贴到\
  \ JupyterLab 笔记本的代码单元格中即可运行。\n\n图 6-13 展示了其图形输出（也请参阅练习 6-4）。\n\n![../images/473947_1_En_6_Chapter/473947_1_En_6_Fig12_HTML.jpg](img/473947_1_En_6_Fig12_HTML.jpg)\n\
  \n图 6-12\n\n尽管这四个四重奏具有相同的汇总统计信息，但它们显然是不同的\n\n```python\nimport altair as alt\nfrom\
  \ vega_datasets import data\nsource = data.anscombe()\nbase = alt.Chart(\nsource,\
  \ title = \"Anscombe's Quartets\"\n).mark_circle(color = 'red').encode(\nalt.X('X',\
  \ scale = alt.Scale(zero = True)),\nalt.Y('Y', scale = alt.Scale(zero = True)),\n\
  column = 'Series'\n).properties(\nwidth = 150,\nheight = 150\n).interactive()\n\
  base\n```\n\n清单 6-9：使用 Altair 的 DSL 进行可视化\n\n你需要通过 `conda` 包管理器执行以下语句来安装 Altair（这也会安装有用的\
  \ `vega_datasets`，其中已包含 Anscombe 四重奏的数据）：\n\n```bash\nconda install -c conda-forge\
  \ altair vega_datasets\n```\n\n\n\n#### 提示\n\n你可能希望在某些时刻创建仪表板状态的快照。`Altair`生成的所有图表都包含一个下拉菜单，可将图表保存为图片或导出为\
  \ Vega 格式。\n\n该图表是交互式的，你可以平移和缩放每个图表。在交互式仪表板中，你可能希望尽量精简文本信息，并隐藏笔记本中的代码单元格。这些步骤能使图形元素更加突出。\n\
