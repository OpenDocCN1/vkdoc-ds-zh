  (458441, 5)

  ```


  我们有 458441 条记录（行）和 5 个特征（列）。行数对于查找缺失的列值非常有用。因此，你应该始终打印表格的形状。


  下一个代码片段展示了各列的整体描述性统计（请注意自定义索引）：


  ```

