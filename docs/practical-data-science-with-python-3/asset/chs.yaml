  extend\")\nG.add_edge(4, 2, relation=\"extend\")\n#### 添加“交互”关系的边。\nG.add_edge(9,\
  \ 0, relation=\"interact\")\nG.add_edge(0, 9, relation=\"interact\")\nG.add_edge(10,\
  \ 1, relation=\"interact\")\nG.add_edge(1, 10, relation=\"interact\")\nG.add_edge(10,\
