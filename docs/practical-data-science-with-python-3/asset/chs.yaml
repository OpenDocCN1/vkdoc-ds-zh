  \ 练习 12-1\\. 自定义并行化\n\n在第 11 章中，我们应用 Dask 对数组执行并行操作。在某些情况下，这种形式的并发是不可行的。Dask 还提供了一个选项，可以通过\
  \ `dask.delayed` 接口对自定义算法进行并行化。\n\n`expectedGain` 函数返回游戏结束时的预期宝藏数量。假设你想简单地返回连续通过所有级别的总概率。这当前作为最终元组中的第一个元素返回。创建一个新方法\
  \ `totalProbability`，该方法仅并行计算这个数量。\n\n查看关于树求和（归约）的示例代码：[`https://examples.dask.org/delayed.html`](https://examples.dask.org/delayed.html)。你将使用乘法来合并节点，而不是使用\
  \ Dask 教程中的 `add` 操作。对于这种简单的树归约情况，你不需要自定义过程，但目的是尝试使用 `dask.delayed` 接口并监控 Dask 仪表盘中计算是如何执行的。\n\
  \n### 练习 12-2\\. 部署到生产环境\n\nPyTorch（从 1.0 版本开始）提供了将 Python 模型转换为中间格式的能力，该格式可以在 C++\
  \ 环境中使用。通过这种方式，你可以用 Python 开发解决方案，然后将其部署为 C++ 应用程序。这种方法满足了与生产环境设置相关的性能要求。\n\n查阅关于在\
  \ C++ 中加载 PyTorch 模型的教程：[`https://pytorch.org/tutorials/advanced/cpp_export.html`](https://pytorch.org/tutorials/advanced/cpp_export.html)。在我们的案例中，由于前向实现是统一的（没有基于输入的条件逻辑），你可以通过跟踪将\
  \ PyTorch 模型转换为 Torch Script。\n\n\n\n## 总结\n\n使用`PyTorch`或其他神经网络框架对于应对深度神经网络固有的复杂性至关重要。`PyTorch`提供了许多现成的附加选项来优化训练过程：dropout、批归一化、各种先进的优化器、不同的激活函数等等。`PyTorch`还允许你将网络持久化存储到外部存储中以便日后使用。你可能希望在每次成功降低验证损失时保存模型。最后，你可以选出性能最佳的版本。\n\
  \n`PyTorch`捆绑了两个主要扩展：`pytorchvision`（用于图像处理）和`pytorchtext`（用于处理文本，例如进行情感分析）。你还可以重用公开可用的预训练模型来实现迁移学习的概念。例如，有些模型是在`ImageNet`（`http://www.image-net.org`）的图像上训练的，具有出色的图像分类功能。\n\
  \n有一个名为`PyTorch Hub`（`https://pytorch.org/hub`）的有趣倡议，旨在高效共享预训练模型，从而实现迁移学习的愿景。神经网络在物联网边缘端也是非常流行的选择。为此，你需要一个超轻量级的预封装引擎。一个例子是英特尔的`神经计算棒`（`http://bit.ly/neural-stick`）。总而言之，每个用例和领域都有非常创新和有趣的方法。\n\
