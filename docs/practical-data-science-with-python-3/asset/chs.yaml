  ### 练习 2-1. 提升可重用性


  `driver.py` 脚本中包含大量硬编码的值。由于它做了过多不必要的假设，这严重阻碍了其可重用性。请重构代码，使其使用一个在启动时加载的外部配置文件。


  别忘了，当前的驱动代码假定输入和输出文件夹是存在的。使用配置文件后，这一假设不再成立。因此，你需要检查这些文件夹是否存在，如果不存在，则按需创建它们。


  ### 练习 2-2. 避免不可执行代码


  `driver.py` 脚本中包含一大块被注释掉的代码。除非这些代码被取消注释，否则它们不会被执行。这种被动的代码往往会与其余源代码库产生差异，因为它很少被维护和测试。此外，大量这样的注释区块会影响代码的可读性。


  请重构程序，避免依赖注释来控制哪个部分会运行。有许多可行的替代方案可供选择。例如，尝试引入一个命令行参数，用于选择是进行可视化、生成输出文件，还是两者都做。你可能需要查看
  [`https://docs.python.org/3/library/argparse.html`](https://docs.python.org/3/library/argparse.html)。


  ### 练习 2-3. 扩充数据


  有时，你必须为数据补充缺失的特征，并且你应该保持警觉，去寻找可用的解决方案。如果这些解决方案是用不同语言编写的，那么你需要找到一种方法让它们能与 Python
  互操作。假设你有一个包含个人姓名的数据集，但缺少一个额外的 `gender` 列。你找到了一个潜在的候选 Perl 模块 `Text::GenderFromName`（参见
  [`https://metacpan.org/pod/Text::GenderFromName`](https://metacpan.org/pod/Text::GenderFromName)）。请想办法从
  Python 中调用此模块来添加这个额外的属性（你可以在谷歌上搜索到大量建议）。


  这类调研工作也是数据工程师的职责之一。专注于分析的人员既没有时间，也没有专业知识来处理特殊的数据整理工作。


  ## 总结


  数据工程是数据分析的支撑。它需要深厚的工程技能来处理各种原始数据格式、通信协议、数据存储系统、探索性可视化技术和数据转换。很难例举所有可能的情况。


  电子商务客户细分案例研究展示了数理统计的实际应用，将输入数据压缩为一组描述性属性。这些属性忠实地保留了用户的主要行为特征，而这些用户的动作记录在原始数据中。该案例研究最后探讨了如何处理大型数据集以及如何逐块处理它们。这是一项强大的技术，在不借助更高级和分布式方法的情况下，也可能解决问题。


  在大多数情况下，处理常见数据源时，你都有标准化的解决方案。例如，要以统一的方式处理不同的关系型数据库管理系统，你可以依赖 Python 数据库 API（参见 [`https://www.python.org/dev/peps/pep-0249`](https://www.python.org/dev/peps/pep-0249)）。相比之下，当你需要从非传统数据源（如低级设备）中挖掘信息时，你必须富有创造力并保持警惕。在构思自己的答案之前，始终要寻找重用现有成果的机会。对于低级设备，优秀的
  PyVISA 库（参见 [`https://pyvisa.readthedocs.io`](https://pyvisa.readthedocs.io)）使你能够独立于接口（例如
  GPIB、RS232、USB 和以太网）来控制各种测量设备。


  数据密集型系统必须得到安全保障。仅仅将所有部分连接起来并假设在正常情况下一切都会正常工作是不够的。敏感数据在提供进一步处理（尤其是在公开发布之前）之前必须进行匿名化处理，并且必须在存储和传输过程中都进行加密。确保数据的一致性和完整性也至关重要。对恶意篡改的数据进行分析可能会产生有害后果（关于这一点，可参见参考文献[4]中的一个很好的例子）。


  实现*数据即商品*的概念正成为一种潮流，就像云计算对计算资源所做的那样。这方面的一个举措来自 Data Rivers（参见文献[5]），其系统执行数据收集、清理（包括擦除个人身份信息）和验证。它使用
  Kafka 作为消息中心，并结合 Confluent 的模式注册表来处理海量消息。


  另一个有趣的概念是数据科学即服务（观看 [6] 的网络研讨会），它将数据科学付诸实践，并使所有必要的基础设施能够即时提供给企业。




