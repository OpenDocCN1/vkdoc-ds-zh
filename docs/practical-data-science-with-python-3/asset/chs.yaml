  \ 20 年的历史数据。输出格式（`datatype`参数）设置为`csv`。\n\n\n\n### 数据预处理\n\n秉承数据科学流程的精神，我们首先进行一些预处理和探索性数据分析。后续所有步骤都应在\
  \ Spyder 的 IPython 控制台中执行（确保你当前位于 `stock_market` 文件夹）。下一条命令显示了已下载文件的前五行：\n\n```\n\
  >> !head -n 5 daily_AAPL.csv\ntimestamp,open,high,low,close,volume\n2018-11-07,205.9700,210.0600,204.1300,209.9500,33106489\n\
