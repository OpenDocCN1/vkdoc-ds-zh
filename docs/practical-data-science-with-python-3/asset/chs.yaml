  \"\"\nfrom typing import List, Tuple\nimport numpy as np\nclass PathUtils:\n\"\"\
  \"封装处理路径的静态方法。\"\"\"\n@staticmethod\ndef encode_path(terrain: np.ndarray, descend_path:\
