  0  1.000000       3  0.333333       0.50   0.000000\n1  1.000000       3  0.333333\
  \       0.50   0.000000\n2  0.333333       2  0.666667       0.75   0.533333\n3\
  \  0.500000       2  0.666667       0.75   0.233333\n4  0.500000       2  0.666667\
  \       0.75   0.233333\n5  1.000000       3  0.333333       0.50   0.000000\n6\
  \  1.000000       3  0.333333       0.50   0.000000\n平均聚类系数: 0.761904761904762\n\
  传递性: 0.5454545454545454\n半径: 2\n直径: 3\n外围节点: [0, 1, 5, 6]\n中心节点: [2, 3, 4]\n```\n\
  \n例如，节点 2、3 和 4 都具有相同的中介中心性。尽管如此，介数中心性优先考虑节点 2，因为它在网络中位于更多最短路径上。通过明智地选择和组合不同的度量，您可以得出良好的网络指标。\n\
  \n\n\n节点的*局部聚类系数*（`LCC`）表示该节点邻居之间相互连接的对数所占的比例。节点 2 的`LCC`为：![$$ \\frac{\\# of\\\
  \ pairs\\ of\\ node's\\ neighbors\\ who\\ are\\ connected}{\\# of\\ possible\\ connected\\\
  \ pairs}=\\frac{2}{\\frac{d_2\\left({d}_2-1\\right)}{2}} $$](img/473947_1_En_10_Chapter_TeX_IEq1.png)\
  \ ![$$ =\\frac{2}{\\frac{4\\ast 3}{2}}=\\frac{1}{3},\\mathrm{where}\\ {d}_2 $$](img/473947_1_En_10_Chapter_TeX_IEq2.png)\
  \ 是节点 2 的度数。`LCC`体现了人们形成聚类的倾向；换言之，如果两个人之间存在连接，那么他们也倾向于相互连接（也称为*三元闭包*）。\n\n节点 2、3\
  \ 和 4 被认为是中心节点，因为它们到其他任意节点的最大最短路径（在我们的衡量标准中，即路径中的跳数）等于网络的半径。图的半径是所有节点中最小离心率的值。节点的*离心率*是该节点与所有其他节点之间的最大距离。图的*直径*是任意节点对之间的最大距离。外围节点的离心率等于直径。需要注意的是，这些度量与平均值一样，极易受到离群值的影响。通过在网络外围添加一连串节点，我们可以轻易地将中心节点向这些新节点偏移。这就是为何使用不同的中心性度量来描述社交网络更为合适。\n\
  \n*平均聚类系数*简单来说是各节点个体聚类系数的均值。*传递性*是另一种全局聚类指标，其计算方式为网络中三角形与*开放三元组*的比例。例如，由节点 2、5 和\
  \ 4 组成的集合形成一个开放三元组（节点 5 和 4 之间缺失一条形成三角形的边）。传递性更看重高度数节点，这就是为什么它通常低于平均聚类系数（中心节点 2、3\
  \ 和 4 因未形成三角形而受到更重的惩罚）。\n\n中心性度量试图指示网络中节点的重要性。*度中心性*衡量一个节点与其他节点连接的数量；有影响力的节点通常连接密集。*紧密度中心性*认为重要的节点是那些与其他节点距离近的节点。*介数中心性*通过包含该节点的网络中最短路径的比例来定义节点的重要性。对于边也存在类似的介数中心性概念。\n\
  \n清单 10-8 介绍了社交网络中的一种“Hello World”——空手道俱乐部网络（这个网络非常著名，`NetworkX`已将其作为标准库的一部分），如图\
  \ 10-5 所示。\n\n![../images/473947_1_En_10_Chapter/473947_1_En_10_Fig5_HTML.jpg](img/473947_1_En_10_Fig5_HTML.jpg)\n\
  \n**图 10-5**\n\n空手道俱乐部社交网络，该图清晰地突显了俱乐部一分为二的分裂情况。节点的大小反映了它们的度数。最重要的五个连接以绿色高亮显示。虚线表示候选边。节点的颜色根据它们所属的俱乐部进行着色。\n\
  \n```python\nimport operator\nimport pandas as pd\nimport networkx as nx\nimport\
  \ matplotlib.pyplot as plt\nG = nx.karate_club_graph()\nnode_colors = ['orange'\
  \ if props['club'] == 'Officer' else 'blue'\nfor _, props in G.nodes(data=True)]\n\
  node_sizes = [180 * G.degree(u) for u in G]\nplt.figure(figsize=(10, 10))\npos =\
  \ nx.kamada_kawai_layout(G)\nnx.draw_networkx(G, pos,\nnode_size=node_sizes,\nnode_color=node_colors,\
  \ alpha=0.8,\nwith_labels=False,\nedge_color='.6')\nmain_conns = nx.edge_betweenness_centrality(G,\
  \ normalized=True)\nmain_conns = sorted(main_conns.items(), key=operator.itemgetter(1),\
  \ reverse=True)[:5]\nmain_conns = tuple(map(operator.itemgetter(0), main_conns))\n\
  nx.draw_networkx_edges(G, pos, edgelist=main_conns, edge_color=\"green\", alpha=0.5,\
  \ width=6)\nnx.draw_networkx_labels(G, pos,\nlabels={0: G.node[0]['club'], 33: G.node[33]['club']},\n\
  font_size=15, font_color=\"white\")\ncandidate_edges = ((8, 15), (30, 21), (29,\
  \ 28), (1, 6))\nnx.draw_networkx_edges(G, pos, edgelist=candidate_edges,\nedge_color='blue',\
  \ alpha=0.5, width=2, style=\"dashed\")\nnx.draw_networkx_labels(G, pos,\nlabels={u:\
  \ u for t in candidate_edges for u in t},\nfont_size=13, font_weight=\"bold\", font_color=\"\
  yellow\")\nplt.axis('off')\nplt.tight_layout();\nplt.show()\n### Create a data frame\
  \ to store various centrality measures.\ndf = pd.DataFrame(index=candidate_edges)\n\
  ### Add generic and community aware edge features for potential machine learning\
  \ classification.\ndf['pref-att'] = list(map(operator.itemgetter(2),\nnx.preferential_attachment(G,\
  \ candidate_edges)))\ndf['jaccard-c'] = list(map(operator.itemgetter(2),\nnx.jaccard_coefficient(G,\
  \ candidate_edges)))\ndf['aa-idx'] = list(map(operator.itemgetter(2),\nnx.adamic_adar_index(G,\
  \ candidate_edges)))\ndf['ccn'] = list(map(operator.itemgetter(2),\nnx.cn_soundarajan_hopcroft(G,\
  \ candidate_edges, 'club')))\ndf['cra'] = list(map(operator.itemgetter(2),\nnx.ra_index_soundarajan_hopcroft(G,\
  \ candidate_edges, 'club')))\nprint(df)\nListing 10-8\nkarate-network.py Module\
  \ Exemplifying the Well-Known Karate Club Network (see Exercise 10-3)\n```\n\n运行此程序后，您将得到以下报告：\n\
  \n```\npref-att  jaccard-c    aa-idx  ccn       cra\n8  15        10   0.400000\
  \  0.755386    2  0.000000\n30 21         8   0.200000  0.455120    1  0.000000\n\
  29 28        12   0.166667  0.352956    2  0.058824\n1  6         36   0.083333\
  \  0.360674    2  0.062500\n```\n\n列名指定了以下链接预测度量（顺序同上，从右至左）：\n\n- **优先连接**：倾向于度数中心性高的节点。这就是节点\
  \ 1 和 6 的得分远高于其他节点的原因。\n- **Jaccard 系数**：公共邻居数除以邻居总数后的归一化值。\n- **Adamic-Adar 指数**：分母中包含一个对数，与资源分配指数类似。对于节点`A`和`B`，该指数表示通过公共邻居的信息流分散程度。从某种意义上讲，想要连接的节点倾向于直接通信。如果公共邻居具有高度数中心性，那么这种信息流会被分散。\n\
  - **社区公共邻居数**：公共邻居的数量，对于属于同一社区的邻居会额外加分。\n- **社区资源分配**：类似于资源分配指数，但只统计同一社区内的节点。注意，候选边`(9,\
  \ 15)`和`(30, 21)`获得的社区资源为零，因为它们来自不同的空手道俱乐部。\n\n在`NetworkX`中（在本文撰写时），还有另外三个真实的社交网络可用。您可以像我们在这里所做的那样，尝试使用它们进行分析。可视化部分可以轻松复用。\n\
  \n在研究社交网络时，生成逼真的网络模型是一个有趣的选择。这些网络旨在模拟所研究真实世界的相关属性。`NetworkX`内部提供了许多网络生成器，包括流行的优先连接模型（遵循*幂律*）和小世界网络（具有较高的聚类系数和较短的平均路径长度）。后者试图模仿*六度分隔*的概念。一旦拥有了一个模型，您就可以将其与来自真实世界的观测（样本）进行比较。如果模型的估计参数（如优先连接模型中的指数`α`和常数`C`）能很好地生成接近真实世界的网络，那么就可以利用图论和计算来分析真实世界现象。例如，您可以使用网络特征（如我们的度量指标）训练分类器，来预测未来连接的概率。\n\
  \n\n\n### 练习 10-1\\. 美化显示的图网络，第一部分\n\n`NetworkX` 与 `Graphviz` 结合使用，为您提供了丰富的选项来定制图的视觉外观。在图\
  \ 10-2 中，关系类型或权重之间没有区分。以一种有意义的方式呈现这些信息会很有帮助。以下是一段代码片段，用于遍历有向多重图 `G` 中的边：\n```\n\
  for i, j, k in G.edges(keys=True):\n    print(G.adj[i][j][k])\n```\n尝试设置边的视觉属性（我们已为节点设置了一些属性）。例如，你可以用不同的颜色标记关系，并将线宽设置为关系的权重。作为附加练习，尝试为演员节点附加自定义图像。这可以通过混入\
  \ HTML 内容并使用 `img` 标签引用图像来实现。\n\n### 练习 10-2\\. 美化显示的图网络，第二部分\n\n基于在练习 10-1 中获得的经验，可视化一个有符号图（比如我们用来建模质量属性之间关系的那种图）。你可能希望为每条边显示加号或减号，并用不同的颜色进行标记。\n\
  \n你可以通过调用 `G.edges(data=True)` 来遍历无向图 `G` 的边，该调用会返回所有边及其属性。要显示符号，请使用 `G.edge[node_1][node_2]['sign']`\
  \ 表达式，其中 `node_1` 和 `node_2` 是此边的节点标识符。\n\n### 练习 10-3\\. 生成一个 Erdös-Rényi 网络\n\n\
  阅读 `nx.generators.random_graphs.erdos_renyi_graph` 函数的文档，了解如何生成这种随机图。该模型以概率 `p`\
  \ 选择每条可能的边，它是二项式图的同义词（因为它遵循伯努利概率分布）。\n\n生成的网络与现实世界的网络并不相似（事实上，小世界网络模型在这方面也做得不够好）。尽管如此，该模型极其简单，并且二项式图被用作图论证明的基础。\n\
  \n## 本章小结\n\n现实世界的网络规模巨大，因此它们需要比本文介绍的方法更具可扩展性的方法。一个可行的选择是利用斯坦福网络分析平台（SNAP）框架（访问\
  \ [`http://snap.stanford.edu`](http://snap.stanford.edu) ），它也有一个 Python API。存储大型图也是一个问题。有专门用于存储图的数据库系统以及更多图格式（其中大部分都由\
  \ `NetworkX` 记录和支持）。图数据库的一个可选方案是 Neo4j（参见 [`https://neo4j.com/developer/python`](https://neo4j.com/developer/python)\
  \ ）。\n\n图被用来判断现实世界网络（如万维网、交通基础设施、电网等）的鲁棒性。鲁棒性是一种质量属性，它表明网络在遭受故障或攻击（当节点和/或边消失时）时保持其核心结构特性的能力。基本的结构特性是连通性。为此目的，`NetworkX`\
  \ 提供了多个函数（用于评估节点和边）：`nx.node_connectivity`、`nx.minimum_node_cut`、`nx.edge_connectivity`、`nx.minimum_edge_cut`\
  \ 和 `nx.all_simple_paths`。这些函数既适用于无向图也适用于有向图。图也是人工智能中各类搜索问题的基础。\n\n# 11\\. 复杂性与启发式方法\n\
  \n作为数据科学家，您必须以经济的方式解决基本问题，同时考虑到所有约束条件和功能需求。最大的错误是对某种特定技术产生情感依赖，并试图寻找“合适”的问题来应用它；这充其量只是伪科学。当您试图采用某种复杂方法，而存在更简单、更优雅的方法时，也会出现类似的问题。我无数次看到这两个反复出现的主题。例如，逻辑回归（一种直观的技术）在分类任务中通常可以胜过核化支持向量机，而特征工程中的一点小聪明可能完全省去了使用不透明的神经网络方法的需要。从简单开始并保持简单，或许是给任何数据科学家最好的建议。为了实现简单，您必须投入大量的精力和时间，但最终的结果将是超值的（尤其是在考虑长期效益时）。与简单相伴的是实用主义——在大多数场景中，足够好通常比完美更好。本章将举例说明对简单和实用主义的偏好，并让您了解复杂性和启发式方法的概念。它包含许多小型用例，每个用例都突出了与数据产品的简洁性和有效性相关的特定主题。\n\
  \n在解决问题的同时完全满足客户需求需要两件事：一般的解决问题能力，以及一套将寻找解决方案置于更广阔背景下的规则和原则。前者围绕以下四个步骤（参见参考文献 [1]），如果后来产品添加了新功能，这些步骤通常构成一个永无止境的循环：\n\
  \n1.  理解问题\n2.  制定计划\n3.  执行计划\n4.  回顾并反思结果\n\n许多从业者都熟知并理解这一策略。通常较少被认识到的是，定义并接受一个框架的重要性，该框架将在解决问题的努力中提供系统性指导。我更喜欢\
  \ Cynefin 框架（如图 11-1 所示），它是一个用于辅助决策的概念模型。问题解决与决策之间存在紧密关联，因此形成一个处理这两个主题的组合体至关重要。了解框架的当前领域有助于您选择最佳策略；您可能更倾向于在*复杂*领域内选择启发式方法，而在*简单*领域内则不愿应用此类方法。**启发式**是一种技术，您用它来交换一个绝对确定且精确的解决方案，换成一个能充分完成任务的方案。令人惊讶的是，近似解的表现通常与完全计算出来的方法一样好。有时，输入数据本身噪声很大，以至于超过某个阈值的精确度已毫无意义。\n\
  \n![../images/473947_1_En_11_Chapter/473947_1_En_11_Fig1_HTML.jpg](img/473947_1_En_11_Fig1_HTML.jpg)\n\
  \n**图 11-1** Cynefin 框架的四个象限（中心是混沌）：简单、繁杂、复杂和混乱\n\n如果没有情境意识，您就会陷入无序状态并做出错误判断。应用\
  \ Cynefin 框架还会带来一个伴随的结果。也就是说，要了解您当前的领域，您必须思考测量和度量。例如，达到一个合适的性能特征可能会将您从*简单*领域转移到*繁杂*或*复杂*领域。但是，您会知道为什么在那里，以及您手头有哪些选项。换句话说，您需要就切换决策边界做出深思熟虑的决定。\n\
  \n\n\n## 从简单到复杂：应用 Cynefin 框架方法\n\n在图 11-1 的中心区域有一个被称为\"混乱\"的特殊区域；它代表了你尚不清楚问题所属域的情况，因此需要进一步探索。每个象限都对应一种独立的问题解决方法。简单域要求采用最佳实践，强调该领域已被充分掌握。复杂域需要良好实践，有时可能成为最优解。复合域指向解决方案的涌现特性，你可以运用各种启发式方法找到合适的解决方案。混沌域要求立即采取行动，事后才分析因果关系。请注意，该框架对\"\
  复杂\"和\"复合\"两词的定义与《Python 之禅》相反（如图[3-2](https://doi.org/10.1007/978-1-4842-4859-1_3Fig#2)在第三章所示：\"\
  复合优于复杂\"）。\n\n情况会随时间变化，可能导致不同域之间的迁移。新的需求和约束需要不同的解决方案，因此转换会以逆时针方向进行。随着获得更多知识和经验，你可以设计出更简单的解决方案，从而以顺时针方向向其他域移动。通过引入应用程序编程接口形式的强大抽象来隐藏复杂性，是简化客户端事务的有效策略。这意味着不同利益相关者会从不同视角看待整个问题-解决方案空间。最典型的例子可能是\
  \ scikit-learn 的通用估计器 API。你可以统一管理多种机器学习算法，无需关心底层实现细节，如图 11-2 所示。\n\n![../images/473947_1_En_11_Chapter/473947_1_En_11_Fig2_HTML.jpg](img/473947_1_En_11_Fig2_HTML.jpg)\n\
  \n**图 11-2**  \n估计器是处理模型训练与使用的对象\n\n基类`BaseEstimator`实现了辅助方法，用于获取和设置估计器实例的参数。`fit`、`fit_predict`、`predict`和`predict_proba`方法构成了统一\
  \ API 的一部分，允许你以相同方式处理不同估计器。`MyEstimator`遵循 Python 的鸭子类型约定，提供一致的接口。\n\n### 从简单到复杂\n\
  \n本节提出应对复杂域的三大策略：改进算法的渐近运行时间、应用随机化与采样、以及使用并行/分布式计算。在构建下一个数据科学产品时，这些都应成为可选方案。从最简单的解决方案开始并逐步优化至关重要。为此你需要完整的性能测试工具，此处将进行演示。我选择接下来几个示例，是因为它们既足够简单又能阐明核心要点。\n\
  \n#### 统计数字出现的次数\n\n假设需要统计区间[1, n]内数字`d`出现的次数，其中*n*∈ℕ∧*n*≤10⁵⁰。你可以从清单 11-1 所示的朴素方法开始。不要低估这种暴力程序的价值。它能为更高级的解决方案提供良好的测试生成器（真实数据的来源）。\n\
  \n```\nk, n = tuple(map(int, input().split()))\ndef count_occurrences_digit_naive(k,\
  \ n):\n    k = str(k)\n    count = 0\n    for i in range(n + 1):\n        count\
  \ += str(i).count(k)\n    return count\nprint(count_occurrences_digit_naive(k, n))\n\
  ```\n\n**清单 11-1**  \n当*n*小于 10⁷ 时表现合理的简单算法\n\n根据非功能性需求（用户不应等待数十年才获得结果），我们显然不能接受这个程序。它运行时间大致呈线性，实在太慢，因此必须像\
  \ Cynefin 框架建议的那样超越简单情况。此时正是围绕性能测试构建适当基础设施的时机。测试数据输入到产品中也需要类似工作，这正是数据工程的一部分。我们将使用可视化来追踪时间测量结果。清单\
  \ 11-2 展示了用于比较不同程序变体的工具。函数以粗体显示构成了此脚本的可重用部分。驱动程序代码位于末尾的条件块中。你只需提供适当的配置。`attach_model`函数会找到与基础模型匹配的正确常数。\n\
  \n```\nimport time\nimport numpy as np\nimport pandas as pd\n\ndef measure(f, num_repetitions=5):\n\
  \    measurements = np.array([])\n    for _ in range(num_repetitions):\n       \
  \ start = time.clock()\n        f()\n        measurements = np.append(measurements,\
  \ time.clock() - start)\n    return measurements.mean()\n\ndef execute(config):\n\
  \    execution_times = {}\n    for config_name in config['functions']:\n       \
  \ execution_times[config_name] = np.array([])\n    for x in config['span']:\n  \
  \      for config_name in config['functions']:\n            execution_times[config_name]\
  \ = np.append(\n                execution_times[config_name],\n                measure(lambda:\
  \ config['functions']config_name))\n    return execution_times\n\ndef attach_model(execution_times,\
  \ config, function_name, model_name):\n    model_vals = np.vectorize(config['models'][model_name])(config['span'])\n\
  \    c = np.mean(execution_times[function_name] / model_vals)\n    execution_times[model_name]\
  \ = c * model_vals\n\ndef report(execution_times, x_vals, **plot_kwargs):\n    df\
  \ = pd.DataFrame(execution_times)\n    df.index = x_vals\n    ax = df.plot.line(\n\
  \        figsize=(10, 8),\n        title='Performance Test Report',\n        grid=True,\n\
  \        **plot_kwargs\n    )\n    ax.set_xlabel('Span')\n    ax.set_ylabel('Time\
  \ [s]')\n    return df\n\nif __name__ == '__main__':\n    from count_occurrences_digit_naive\
  \ import count_occurrences_digit_naive\n    config = {\n        'functions': {\n\
  \            'naive(k=0)': lambda n: count_occurrences_digit_naive(0, n)\n     \
  \   },\n        'models': {\n            'O(n)': lambda n: n\n        },\n     \
  \   'span': np.geomspace(10**2, 10**7, num=14, dtype=int)\n    }\n    execution_times\
  \ = execute(config)\n    attach_model(execution_times, config, 'naive(k=0)', 'O(n)')\n\
  \    print(report(execution_times, config['span'], logx=True, style=['-ro', ':r^']))\n\
  ```\n\n**清单 11-2**  \n用于追踪时间测量结果并可视化的性能测试工具\n\n执行此代码后，你将获得以下报告以及折线图，如图 11-3 所示：\n\
  \n![../images/473947_1_En_11_Chapter/473947_1_En_11_Fig3_HTML.jpg](img/473947_1_En_11_Fig3_HTML.jpg)\n\
