  \n处理输出将是一项更为轻松的任务。系统只需利用图像的蓝色分量（将其设为 255）来编码球的路径。这张新图像可重复用于下一次运行。因此，笔记本会保存最终图像以供后续使用。当然，原始坐标可能仍有价值，因此系统也应返回这些坐标。\n\
