  \n图 7-20\n\n当前成交量对数收益率上升时，未来成交量对数收益率下降，反之亦然\n\n通过改变周期长度，可以找到自相关性的最高水平，这为创建特征提供了基础。5\
  \ 天似乎是一个良好的选择（您可以使用配套代码库实验不同周期）。因此，我们的目标特征将是未来 5 天的价格变化，而初始基础特征则为当前 5 天的价格和成交量变化。\n\
  \n\n\n每个领域都有一组经过验证的、对预测目标有价值的备选特征。有一个名为 TA-Lib 的强大技术分析库，包含 200 个金融指标（参见[`https://mrjbq7.github.io/ta-lib`](https://mrjbq7.github.io/ta-lib)）。我们将使用其中的三个：归一化简单移动平均线（SMA）、相对强弱指数（RSI）和平衡交易量（OBV）。你已经在“发现时间序列中的趋势”一节中见过\
  \ SMA。RSI 的定义为![$$ 100-\\frac{100}{1+ RS} $$](img/473947_1_En_7_Chapter_TeX_IEq19.png)，其中![$$\
  \ RS=\\frac{mean\\ gain\\ over\\ a\\ period}{mean\\ loss\\ over\\ a\\ period} $$](img/473947_1_En_7_Chapter_TeX_IEq20.png)。OBV\
  \ 将成交量流与价格变化联系起来。清单 7-14 包含了用于创建候选特征的代码。\n\n```\ndef create_features(ts):\nfrom\
  \ talib import SMA, RSI, OBV\ntarget = 'future_close_ret'\nfeatures = ['current_close_ret',\
  \ 'current_volume_ret']\nfor n in [14, 25, 50, 100]:\nts['sma_' + str(n)] = SMA(ts['close'].values,\
  \ timeperiod=n) / ts['close']\nts['rsi_' + str(n)] = RSI(ts['close'].values, timeperiod=n)\n\
  ts['obv'] = OBV(ts['close'].values, ts['volume'].values.astype('float64'))\nts.drop(['close',\
  \ 'volume', 'close_ret', 'volume_ret', 'future_volume_ret'],\naxis='columns',\n\
