  \n\n#### 球体下落项目\n\n现在我们将开发一个小而完整的项目，以展示 JupyterLab 的其他强大功能（其中许多功能由 IPython 提供，因为它就是我们的内核）。我们力求示例简洁明了，以便你能专注于\
  \ JupyterLab 本身。首先，为该项目创建一个新文件夹（命名为 `ball_descend`）。在该文件夹中创建一个新笔记本 `Simulation.ipubn`。关于如何完成这些步骤的说明，请重新参考“代码执行实验”部分。\n\
  \n##### 问题说明\n\n用清晰的标题和对问题的描述来开始笔记本是很有用的。这些细节非常重要，能从一开始就突出你工作的核心。不要让其他人浪费时间试图弄清楚你的工作对他们是否有价值。从下拉框中选择\
  \ Markdown 单元类型，并输入以下文本：\n\n```\n##### 球体在地形中的下落模拟\n本项目模拟球体在地形中的最终落点。\n#### 输入\n\
  地形的配置由一个整数矩阵给出，表示每个点的高程。为简化起见，假设地形被一堵矩形墙壁包围，防止球体逃逸。地形的内部尺寸为 NxM，其中 N 和 M 是介于 3 和\
  \ 1000 之间的整数。\n球体的初始位置由一对整数 (a, b) 给出。\n#### 输出\n结果是一个坐标列表，表示球体在地形中的路径。列表的第一个元素是起始位置，最后一个元素是结束位置。如果地形平坦或球体落在最低点（局部最小值），则起始位置和结束位置可能相同。\n\
  #### 规则\n球体的运动遵循以下两条简单规则：\n- 球体从当前位置滚动到相邻最低的位置。\n- 如果球体被更高点包围，则停止运动。\n```\n\n你应该利用\
  \ Markdown 格式提供的丰富格式化选项。在这里，我们定义了标题来为文档创建一些结构。我们将在下一节进一步讨论结构。一旦执行此单元，它将被渲染为 HTML。\n\
  \n结果发现标题中有一个小拼写错误（在渲染后的 HTML 中更加明显）：它写的是 `Bal's` 而不是 `Ball's`。双击文本单元，更正此问题，然后重新运行该单元。\n\
  \n你也可以使用多个连续的单元格来输入上述文本。可以通过“编辑”菜单中的命令或使用拖放技术来拆分、合并和移动单元格。运行文本单元的结果是其格式化输出。文本单元可以按任意顺序运行。但代码单元则不同，它们通常相互依赖。忘记运行代码所依赖的单元可能会导致各种错误。显然，减少代码单元之间的耦合至关重要。代码单元之间的依赖关系图可以揭示很多复杂性。这也是你应该尽量减少对全局变量依赖的原因之一，因为这会使你的单元相互纠缠。\n\
  \n##### 模型定义\n\n上一节中的问题描述充分暗示了数据模型。一个直观的选择是将地形表示为一个整数矩阵。`NumPy` 已经拥有这样的数据结构。当然，对于这个微型示例，我们也可以只使用标准\
  \ Python 的东西。尽管如此，我还是想给出一些关于设置代码的提示。在下一个代码单元中输入代码清单 4-4 的内容并执行该单元（这也会在其下方创建一个新的代码单元）。\n\
  \n```\n###### 常用的引导代码；只需运行此单元。\nimport numpy as np\n代码清单 4-4\n笔记本的全局导入，并附带注释告知用户只需运行它\n\
  ```\n\n你的笔记本应该仔细组织，并包含定义明确的章节。通常，引导代码（如代码清单 4-4 所示）应放在笔记本最开头的一个单独代码单元内。这类代码与你工作的核心内容没有内在关联，因此不应分散在笔记本各处。此外，大多数其他代码单元都依赖此单元先被执行。如果你修改了此部分，则应重新运行所有依赖它的单元。一个便捷的方法是调用\
  \ `运行` ➤ `运行所选单元及以下所有单元`。\n\n在代码单元中输入代码清单 4-5 的内容并运行它。\n\n```\nterrain = np.matrix([\n\
  [-2, 3, 2, 1],\n[-2, 4, 3, 0],\n[-3, 3, 1, -3],\n[-4, 2, -1, 1],\n[-5, -7, 3, 0]\n\
  ])\nterrain\n代码清单 4-5\n我们数据模型的定义\n```\n\n一个单元可以包含多行和多个表达式。这样一个复合单元会通过顺序执行其中包含的表达式来运行（按它们出现的顺序）。这里，我们有一个赋值操作和一个值表达式。后者有助于查看赋值的效果（赋值操作是静默执行的）。请记住，单元的**输出值**始终是其最后一个表达式的值（赋值操作没有值）。如果你想输出多条消息，可以使用\
  \ Python 的 `print` 语句（这些消息不会计入输出值），无论是否带有最后一个表达式。通常，输出值会被很好地渲染为 HTML，而打印输出则不会。当我们在第\
  \ 5 章中将 Pandas 数据框作为值输出时，这一点会很明显。\n\n也可以在最后一个表达式后加上分号来阻止输出其值。这在某些情况下很有用，例如你只想查看调用某个函数的效果（最常见的是与可视化相关）。\n\
  \n当你的光标位于多行单元内部时，可以使用键盘上的向上和向下箭头在这些行之间移动。要使用按键在单元之间移动，你必须先按 Esc 键退出该块。还可以通过单击单元左边缘与相应粗竖线之间的区域来选中整个单元。单击竖线可以折叠或展开单元（折叠后的单元用三个点表示）。\n\
  \n#### 提示\n\n可以通过切换*漂亮打印*的开启和关闭来控制输出值的渲染机制。这可以通过运行 `%pprint` 魔法命令来实现。要获取可用魔法命令的列表，请执行\
  \ `%lsmagic`。\n\n### 注意\n\n切勿将总是返回相同值的慢速表达式（如从文件读取）与幂等参数化表达式（如显示数据框的前几个元素）放在同一个单元中。最后一个表达式无法独立执行（即不持续重新加载输入文件）。\n\
  \n`matrix` 函数只是 NumPy 包中的众多函数之一。JupyterLab 的上下文相关输入功能可以帮到你很多。只需在 `np.` 后按 Tab 键，你就会获得可用函数的列表。继续键入（例如按\
  \ M 键）会缩小候选列表的范围（例如，只显示以 `m` 开头的名称）。此外，在代码单元中输入 `np.matrix?` 会提供关于该函数的帮助信息（你需要执行该单元才能看到信息）。执行\
  \ `np?` 则会提供整个框架的帮助信息。\n\n\n\n##### 路径查找器的实现\n\n现在我们已经准备好着手处理项目的核心部分——计算弹球路径的函数。输入参数将是地形的配置和弹球的起始位置，输出则是弹球在地形中移动路径所经过的坐标列表。图\
  \ 4-4 展示了从顶层问题向下分解为子问题的过程，每个子问题都作为一个独立的函数来实现。我们将从 `wall` 函数开始（参见清单 4-6）。\n\n![../images/473947_1_En_4_Chapter/473947_1_En_4_Fig4_HTML.jpg](img/473947_1_En_4_Fig4_HTML.jpg)\n\
  \n**图 4-4**  \n问题的自顶向下分解；我们将通过自底向上的方法实现这些函数\n\n```\ndef wall(terrain:np.matrix,\
  \ position:Tuple[int,int]) -> bool:\n\"\"\"\n检查给定位置是否撞墙。\n参数:\nterrain: 由整数海拔高度组成的地形配置。\n\
  position: 表示弹球可能位置的一对整数。\n输出:\n如果位置撞墙则返回 True，否则返回 False。\n示例:\n>>> wall(np.matrix([[-2,\
  \ 3, 2, 1]]), (0, 1))\nFalse\n>>> wall(np.matrix([[-2, 3, 2, 1]]), (-1, 0))\nTrue\n\
  \"\"\"\nx, y = position\nlength, width = terrain.shape\nreturn (x < 0) or (x >=\
  \ length) or (y < 0) or (y >= width)\n```\n\n**清单 4-6** 用于检测边界的 `wall` 函数定义\n\n\
  逻辑非常简单。`wall` 函数的签名使用了 Python 的可选类型注解。`Tuple` 必须通过在引导单元格中添加以下代码来导入（修改后需要重新运行该单元格）：\n\
  \n```\nfrom typing import Tuple\n```\n\n我建议你务实地看待这些注解。例如，只需声明 `terrain` 是 `np.matrix`\
  \ 就足够了，无需引入自定义类型定义来更详细地描述它。清单 4-7 中的另外两个函数应与 `wall` 函数添加在同一个单元格中。将它们放在一起是合理的，因为它们相互关联。此外，可以通过点击单元格的垂直条以“全有或全无”的方式隐藏它们。\n\
  \n```\ndef next_neighbor(terrain:np.matrix, position:Tuple[int,int]) -> Tuple[int,int]:\n\
  \"\"\"\n返回最低邻居的位置。\n参数:\nterrain: 由整数海拔高度组成的地形配置。\nposition: 表示弹球当前位置的一对整数。\n输出:\n\
  最低邻居的位置（坐标对）。\n示例:\n>>> next_neighbor(np.matrix([[-2, 3, 2, 1]]), (0, 1))\n(0, 0)\n\
  \"\"\"\nx, y = position\nallowed_neighbors = []\nfor delta_x in range(-1, 2):\n\
  for delta_y in range(-1, 2):\nnew_position = (x + delta_x, y + delta_y)\nif (not\
  \ wall(terrain, new_position)):\nallowed_neighbors.append((terrain.item(new_position),\
  \ new_position))\nreturn min(allowed_neighbors)[1]\n\ndef find_path(terrain:np.matrix,\
  \ position:Tuple[int,int]) -> List[Tuple[int,int]]:\n\"\"\"\n查找弹球在地形中下降时经过的路径。\n\
  参数:\nterrain: 由整数海拔高度组成的地形配置。\nposition: 表示弹球当前位置的一对整数。\n输出:\n路径的坐标列表。\n示例:\n>>>\
  \ find_path(np.matrix([[-2, 3, 2, 1]]), (0, 1))\n[(0, 1), (0, 0)]\n\"\"\"\nnext_position\
  \ = next_neighbor(terrain, position)\nif (position == next_position):\nreturn [position]\n\
  else:\nreturn [position] + find_path(terrain, next_position)\n```\n\n**清单 4-7**\
  \ 图 4-4 中所示的另外两个函数的实现\n\n`find_path` 函数是一个非常简单的递归函数。其退出条件是确保到达局部最小值（除非你模拟的是埃舍尔世界中的地形），因为我们单调地向最低的邻居下降。\n\
  \n我们需要在配置部分的导入列表中添加 `List`。此外，还必须添加以下代码单元格来测试函数：\n\n```\n###### 运行此单元格以调用嵌入在函数描述中的测试。\n\
  import doctest\ndoctest.testmod(verbose=True)\n```\n\n执行完所有单元格后，我们应得到无错误的测试结果。请注意，所有函数都是自包含的，且独立于环境。从维护和演进的角度来看，这一点非常重要。有趣的是，即使从函数签名中移除\
  \ `terrain` 参数，所有函数也能完美执行。然而，依赖全局变量在笔记本中与其他任何地方一样，都是糟糕的做法。它很容易引入不必要的副作用和令人头疼的 bug。没有人有时间也没有动力去调试你的文档来验证结果！\n\
  \n##### 与模拟器的交互\n\n现在该为项目收尾了——为用户提供一种与模拟器交互的便捷方式。经典的做法是创建一个如下形式的代码单元格（每次用户需要修改代码并重新运行该单元格）：\n\
