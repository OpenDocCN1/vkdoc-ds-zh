  \n表 10-2 中的具体数字是虚构的，并不重要。发送/接收用例未在表 10-2 中明确列出，因为它是其他用例的一部分。当然，你可以以不同的方式构建表格。无论如何，该用例将通过专用关系类型与其他用例关联。请注意，UML\
  \ 的扩展机制与 Python 中的子类化不同，我们在这里不讨论继承。基于此表，我们可以看到优化数据库（可能对实时数据采集和分析使用不同的技术）是最有益的。\n\
  \n清单 10-1 展示了使用 `NetworkX` 生成匹配图的代码。请注意，我忽略了权重为零的边。该脚本非常简单，展示了使用 `NetworkX` 构建网络的便捷性。通常的惯例是使用大写字母命名引用图的变量。在执行清单\
  \ 10-1 之前，你需要安装 `pydot`（在 shell 中运行 `conda install pydot` 来部署 `pydot`）。图 10-2 显示了生成的图（另请参见练习\
  \ 10-1）。\n\n\n\n```python\nimport networkx as nx\nG = nx.MultiDiGraph()\n#### 添加所有节点及其角色和标签。你可以直接使用标签，但使用\n\
