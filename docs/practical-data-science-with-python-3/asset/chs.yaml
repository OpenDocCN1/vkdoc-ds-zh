  \ ax.get_ylim()\n    # 待修正：参见练习 2！\n    ax.set_ylim(max(0, y_min), min(2 * error_variance,\
  \ y_max))\n    ax.set_ylabel('MSE', fontsize=15)\n    ax.title.set_size(19)\n  \
  \  # 绘制并标注最小 MSE。\n    ax.axhline(error_variance, color=\"g\", ls=\"--\", lw=1)\n\
