  \ 7-11 中看到，大约在 2015 年左右价格出现了大幅下跌。根据一份报告（参见 [`http://time.com/money/3991712/apple-stock-price-drop`](http://time.com/money/3991712/apple-stock-price-drop)），原因是\
  \ iPhone 销售未达到业务预期。\n\n```\n>> import matplotlib.pyplot as plt\n>> def plot_time_series(ts,\
  \ title_prefix, style='b-'):\nax = ts.plot(figsize=(9, 8), lw=2, fontsize=12, style=style)\n\
  ax.set_title('%s Over Time' % title_prefix, fontsize=19)\nax.set_xlabel('Year',\
  \ fontsize=15)\n>> plot_time_series(stock_data['close'], 'AAPL Closing Levels')\n\
  ```\n\n### 发现时间序列中的趋势\n\n图 7-11 中的图表非常不规整，这是由于噪声和季节性的影响。识别时间序列趋势的一种流行方法是使用 *移动平均*。以下命令通过计算\
  \ *简单移动平均线 (SMA)* 来绘制收盘价的趋势，如图 7-12 所示：\n\n```\n>> stock_data.sort_index(inplace=True)\n\
  >> plot_time_series(stock_data['close'].rolling('365D').mean(), 'AAPL Closing Trend')\n\
  ```\n\n如果我们不对索引进行排序，则会收到错误提示：`ValueError: index must be monotonic`。滚动窗口大小被设置为 365\
  \ 天。图 7-13 将收盘价趋势和交易量趋势结合在了同一个图表中。交易量随时间变化不大，尽管当价格开始下跌时交易量有所增加。这可能是因为在价格还算不错的时候出现了抛售股票的冲动。这种比较对于特征工程和更深入地洞察行为模式非常有用。以下代码生成了这样一个复合图表：\n\
  \n```\n>> def compose_trends(ts):\nfrom sklearn.preprocessing import MinMaxScaler\n\
  scaler = MinMaxScaler()\nscaled_ts = pd.DataFrame(scaler.fit_transform(ts), columns=ts.columns,\
  \ index=ts.index)\nreturn pd.concat([scaled_ts['close'].rolling('365D').mean(),\n\
  scaled_ts['volume'].rolling('365D').mean()], axis=1)\n>> plot_time_series(compose_trends(stock_data),\
  \ 'AAPL Closing & Volume Trends', ['b-', 'g--'])\n```\n\n计算移动平均可以消除数据中的微小波动。同时观察图\
  \ 7-13 可以发现，价格大幅下跌的斜率小于图 7-11 中的斜率。在将不同特征组合到同一张图之前，对它们进行缩放是很有必要的。在各种机器学习场景中，当某个方向的变化可能完全掩盖其他方向的变化时，数据缩放也是强制要求。这种情况通常发生在不同特征的值域差异巨大时。\n\
  \n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig13_HTML.jpg](img/473947_1_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13\n\ny 轴现在显示的是缩放后的值\n\n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig12_HTML.jpg](img/473947_1_En_7_Fig12_HTML.jpg)\n\
  \n图 7-12\n\n与图 7-11 相比，图表平滑得多\n\n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig11_HTML.jpg](img/473947_1_En_7_Fig11_HTML.jpg)\n\
  \n图 7-11\n\nAAPL 收盘价随时间的变化情况\n\n\n\n#### 特征转换\n\n在金融领域，关注每日收益率比使用绝对数值更有用。收益率表示资产价值随时间波动的程度。计算收益率主要有两种方式：\n\
  \n* **对数收益率**：`r_t = log(v_t / v_{t-1})`，其中 `v` 表示资产价值（如收盘价、复权收盘价、成交量、复权成交量等）。\n\
  * **缩放百分比收益率**：`r_t = (v_t / v_{t-1} - 1)`。Pandas 中有一个 `pct_change` 方法可以计算该数值。对于日收益率而言，缩放百分比收益率近似于对数收益率。这可以从对数函数的泰勒展开式中看出，当\
  \ `x = V_t / V_{t-1}` 非常小时，只有第一项（`x - 1`）起作用。\n\n对数收益率具有很好的数学性质（例如可加性、关于收益和损失的对称性等）。以下代码片段为我们的数据框增加了两个新特征：股票价格的每日对数收益率和成交量的每日对数变化量。图\
  \ 7-14 展示了 AAPL 价格对数收益率随时间的变化，图 7-15 则展示了成交量的相应变化。\n\n![../images/473947_1_En_7_Chapter/473947_1_En_7_Fig14_HTML.jpg](img/473947_1_En_7_Fig14_HTML.jpg)\n\
  \n**图 7-14**\n\n该图包含几个远离中心值的向下尖峰。\n\n```\n>> import numpy as np\n>> stock_data['close_ret']\
  \ = np.log(stock_data['close']).diff()\n>> stock_data['volume_ret'] = np.log(stock_data['volume']).diff()\n\
  >> stock_data.head()\nclose    volume  close_ret  volume_ret\ntimestamp\n1998-01-02\
  \  16.25   6411700        NaN         NaN\n1998-01-05  15.88   5820300  -0.023032\
  \   -0.096773\n1998-01-06  18.94  16182800   0.176216    1.022597\n1998-01-07  17.50\
  \   9300200  -0.079075   -0.553913\n1998-01-08  18.19   6910900   0.038671   -0.296936\n\
  >> stock_data.dropna();\n>> plot_time_series(stock_data['close_ret'], 'AAPL Price\
  \ Log Returns')\n>> plot_time_series(stock_data['volume_ret'], 'AAPL Volume Log\
  \ Returns')\n```\n\n我们可以将这些尖峰视为异常值，这些数据难以建模和解释（除非你是金融专家）。解决该问题的一种方法是使用波动率归一化的对数收益率。\n\
  \n接下来的代码部分实现了生成股票价格波动率归一化对数收益率的逻辑，结果如图 7-16 所示。无需对成交量收益率执行相同的操作，我们很快会看到原因（其分布近似于正态）。\n\
  \n```\n>> ts['close_ret'] /= ts['close_ret'].ewm(halflife=halflife).std()\n>> plot_time_series(stock_data['close_ret'],\
  \ 'AAPL Volatility-Norm. Price Log Returns')\n```\n\n23 天的半衰期相当于衰减因子（权重）为 0.97（需要求解方程\
  \ `w²³ = 1/2` 来得到 `w`），该因子控制着股票市场对旧事件的记忆时长（或遗忘速度）。第 i 个数据点的衰减因子为 `w^i`。波动率是跨数据点计算的滚动标准差，同时考虑了旧数据的指数衰减。更高的衰减会抑制波动率。你应该尝试调整这个因子，以匹配期望的风险水平。\n\
  \n#### 流式计算量\n\n为简单起见，我们到目前为止都是以批处理模式管理数据。然而，对数收益率、移动平均和波动率都是可以实时计算的数量。对于对数收益率，你只需要缓存最后一个值即可进行更新。对于带有指数加权的波动率也是如此，尽管它不像对数收益率那样显而易见。要跟踪移动平均，你需要存储并更新最后的分子和分母。\n\
  \n假设你知道当前的加权方差 `V_current = sum(w^i * r_i²) / sum(w^i)`，其中 `w` 是衰减因子；对于日收益率，我们可以假设均值为零。分母是几何级数的和，其极限为\
  \ `1 / (1 - w)`。当一个新的收益率 `r_0` 到来时，我们有 `V_new = (1 - w) * (w * sum(w^i * r_i²) +\
  \ r_0) = w * V_current + (1 - w) * r_0`。你可以通过 `sqrt(V_current)` 计算当前波动率。\n\n要在流式模式下进行波动率归一化，你需要将新收益率除以当前波动率：`r_0\
  \ <- r_0 / sqrt(V_current)`。当然，你应该在执行 `V_current <- V_new` 更新当前波动率之前进行此操作。\n\n除了计算各种运行总计外，还有一整套可以以流式方式运行的增量算法。例如，*梯度下降*是一种迭代优化方法，它可以一次性处理所有数据。*随机梯度下降*是一种增量和迭代方法，它以在线模式运行并动态更新参数。流式线性回归就使用了这种方法（本章后面会介绍）。\n\
