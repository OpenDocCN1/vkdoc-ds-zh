  #### 集成自定义特征


  特征工程既是一门艺术，也是一门科学，它高度依赖领域知识。来自学术界和工业界的众多科学家不断寻求描述观测值的新方法。大多数研究成果都会公开发表，以便其他人能够继续推进各种改进。在电子商务领域，事实证明，点击率、人口统计学特征（在我们的案例研究中为性别）以及年龄组（参见参考文献[2]）都是信息量丰富的特征。


