  \ 2)` | 将数字向下舍入到指定小数位数（负数参数表示十位、百位等）。 |\n| 去除符号 | `Number.Abs(-50)` | 返回数字的绝对值。\
  \ |\n| 乘幂 | `Number.Power(10, 4)` | 返回第一个参数的值的第二参数次方。 |\n| 取模 | `Number.Mod(5, 2)`\
  \ | 返回数字除以除数的整数除法的余数。 |\n| 指示数字的符号 | `Number.Sign(-1)` | 如果数字为正数则返回 1，如果为负数则返回-1，如果为零则返回\
  \ 0。 |\n| 计算平方根 | `Number.Sqrt(4)` | 返回数字的平方根。 |\n\n> **注意：** 如果您是 Excel 用户，您可能能看到这与在\
