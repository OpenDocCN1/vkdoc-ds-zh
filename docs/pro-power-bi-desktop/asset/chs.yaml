  25/07/2020\"))` | 从日期中返回季度的数字。 |\n| 季初 | `Date.StartOfQuarter(Date.FromText(\"25/07/2020\"\
  ))` | 从日期中返回该季度的第一天。 |\n| 季末 | `Date.EndOfQuarter(Date.FromText(\"25/07/2020\"))`\
