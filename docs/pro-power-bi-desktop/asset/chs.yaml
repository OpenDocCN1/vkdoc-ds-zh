  表 12-3 只是 M 语言中大量可用数值函数的一个小部分。如果您想查看完整列表，请访问微软网站 [`docs.microsoft.com/en-us/powerquery-m/number-functions`](https://docs.microsoft.com/en-us/powerquery-m/number-functions)。\n\
  \n## 日期函数\n\nM 语言有很多日期函数。表 12-4 包含了一些可能有用的函数示例。\n\n**表 12-4** 日期函数示例\n\n| 输出 | 代码片段\
