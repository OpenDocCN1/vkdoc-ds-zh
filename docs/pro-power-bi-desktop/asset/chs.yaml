  \ 20))` | 以天为单位的持续时间。 |\n| 小时 | `Duration.Hours(#duration(10, 15, 55, 20))` | 以小时为单位的持续时间。\
  \ |\n| 分钟 | `Duration.Minutes(#duration(10, 15, 55, 20))` | 以分钟为单位的持续时间。 |\n| 秒\
  \ | `Duration.Seconds(#duration(10, 15, 55, 20))` | 以秒为单位的持续时间。 |\n\n表 12-6 几乎涵盖了\
  \ M 语言中所有可用的持续时间函数。如果你想查看其余的几个函数，可以访问微软网站 [`https://docs.microsoft.com/en-us/powerquery-m/duration-functions`](https://docs.microsoft.com/en-us/powerquery-m/duration-functions)。\n\
  \n## M 概念\n\n现在是时候“拆掉自行车的辅助轮”，学习如何独立骑行了。这意味着，首先要熟悉几个 M 的结构性概念。\n\n这意味着要从能用来修改数据内容的“入门级”函数，过渡到创建和修改数据结构本身。M\
  \ 本质上专注于加载和呈现表格数据结构，因此数据表是一种核心的数据结构。然而，它还能操纵其他数据结构——你在之前的章节中已经顺便接触过它们。那么，在本章中，我们将探讨三种核心数据结构。它们统称为*结构化*值——与*原始*值（如文本、数字或日期和时间）相对。其中一些包括：\n\
  \n*   列表\n*   记录\n*   表格\n\n不过，在深入探讨这些结构化数据元素之前，你需要理解 M 语言的两个基本方面。它们是：\n\n*   数据类型\n\
  *   M 值（也称为变量或标识符）\n\n那么，闲话少叙，让我们开始踏上 M 的探索之旅吧。\n\n## M 数据类型\n\n如果你要创建自己的列表、记录和表格，那么了解\
  \ M 中数据类型的基础知识将会很有帮助。\n\n在开始使用 M 时，你需要记住，原始数据值必须始终是以下类型之一：\n\n*   数字 (Number)\n\
  *   文本 (Text)\n*   日期 (Date)\n*   时间 (Time)\n*   日期时间 (DateTime)\n*   时区日期时间 (DateTimeZone)\n\
  *   持续时间 (Duration)\n*   逻辑值 (Logical，如果你愿意，也可以称为 `Boolean`)\n*   二进制 (Binary)\n\
  *   空值 (Null)\n\n还有其他类型，比如 `function`、`any` 或 `anynonnull`，但我们不会在本章中涵盖它们。\n\n所有数据类型都期望以特定方式输入。实际上，你必须按照表\
  \ 12-7 所示的方式输入数据，以避免在 M 代码中出现错误。\n\n**表 12-7** 数据类型输入\n\n| 数据类型 | 代码片段 | 备注 |\n\
  | --- | --- | --- |\n| 数字 (Number) | `100``0.12345``2.4125E8` | 不要使用千位分隔符或货币符号等格式。\
  \ |\n| 文本 (Text) | `\"Calidra Power BI Training\"` | 始终用双引号括起来。若要输入实际的引号文本，请使用两个双引号。\
  \ |\n| 日期 (Date) | `#date(2020,12,25)` | 日期必须在 `#date()` 函数中按年、月、日指定。 |\n| 时间 (Time)\
  \ | `#time(15,55,20)` | 时间必须在 `#time()` 函数中按时、分、秒指定。 |\n| 日期时间 (DateTime) | `#datetime(2020,12,25,15,55,20)`\
  \ | 日期时间必须在 `#datetime()` 函数中按年、月、日、时、分、秒指定。 |\n| 时区日期时间 (DateTimeZone) | `#datetimezone(2020,12,25,15,55,20,-5,-30)`\
  \ | 时区日期时间必须在 `#datetimezone()` 函数中按年、月、日、时、分、秒、天偏移量、小时偏移量指定。 |\n| 持续时间 (Duration)\
  \ | `#duration(0,1,0,0)` | 在 `#duration()` 函数内，天、小时、分钟和秒用逗号分隔。 |\n| 逻辑值 (Logical)\
  \ | `true` | 小写的 `true` 或 `false` |\n\n## M 值\n\n在深入实际编码之前，你真的需要了解一些关于 M 值的基本原理：\n\
  \n*   值是表达式（expression）的输出结果。\n*   值也是变量。\n*   值的名称区分大小写。\n*   如果值名称包含空格或受限字符，则必须用\
  \ `#\"\"`（井号后跟双引号）括起来。\n\n这第四点显然引出一个问题：“什么是受限字符？” 一个简单的答案——避免死记硬背符号列表——就是“任何非字母数字的字符”。\n\
  \n**注意**\n\nPower Query 编辑器界面会尽可能通过添加空格的方式，使步骤（即表达式返回的值）更具可读性。因此，这些值在 M 代码中总是以 `#\"\
  Step Name\"` 的形式出现。\n\n### 在 M 中定义你自己的变量\n\n由于任何表达式返回的值也是变量，因此在 M 中定义你自己的变量出奇地简单。你所要做的就是输入一个变量名（如果包含空格或受限字符，则需加上井号并用引号括起来）、一个等号，以及变量定义。\n\
  \n举一个非常简单的例子，请看图 12-10。这段 M 脚本定义了 `List.Numbers()` 函数所需的三个参数（你将在表 12-8 中看到该函数），然后在函数内部使用了这些变量。\n\
  \n**表 12-8** 列表生成\n\n| 代码片段 | 描述 |\n| --- | --- |\n| `{1..100}` | 从 1 到 100（含）的连续数字序列。\
  \ |\n| `{1..100, 201..400}` | 从 1 到 100，然后从 201 到 400 的连续数字序列。 |\n| `List.Numbers(0,\
  \ 100, 5)` | 从 0 开始，按 5 递增，直到达到 100。 |\n| `{\"A\"..\"Z\"}` | 大写字母 A 到 Z。 |\n| `List.Dates(#date(2020,\
  \ 1, 1), 366, #duration(1, 0, 0, 0))` | 2020 年的每一天——从 2020 年 1 月 1 日开始，添加 366 天（以天为单位的持续时间表示）。\
  \ |\n| `List.Times(#time(1, 0, 0), 24, #duration(0, 1, 0, 0))` | 一天中的每个小时，从凌晨 1\
  \ 点开始。 |\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig10_HTML.jpg](img/370912_3_En_12_Fig10_HTML.jpg)\n\
  \n**图 12-10** M 中的用户变量\n\n在定义自己的变量时，只需记住几点：\n\n*   它们遵循与 M 中输出值相同的命名约定。\n*   变量可以在定义它的子表达式以及包含该子表达式的任何表达式中被引用。\n\
  *   变量可以是一个简单的值，也可以是一个返回值的计算。\n\n\n\n## 编写 M 查询\n\n在真正编写 M 代码之前，你需要了解如何以及在何处编写代码。假设你需要一个环境来练习本章后续的示例：\n\
  \n1. 打开一个新的空白 Power BI Desktop 文件。\n2. 在“开始”功能区中，单击**新源** ➤ **空白查询**。Power Query\
  \ 编辑器将会打开。\n3. 单击**高级编辑器**。一个**高级编辑器**对话框将打开，其中仅包含一个外部的 `let` 表达式，如图 12-11 所示。\n\
  \n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig11_HTML.jpg](img/370912_3_En_12_Fig11_HTML.jpg)\n\
  \n*图 12-11 准备高级编辑器来编写 M 代码*\n\n> **注意** 从技术上讲，M 中并不强制要求使用 `let` 子句。你可以直接输入一个表达式。不过，我更喜欢“按部就班”地编写\
  \ M——至少一开始是这样。\n\n### 列表\n\n你在第 11 章为基于查询的参数创建弹出列表时已经见过 M 列表（这再次表明，查询编辑器中的一切都基于\
  \ M）。列表仅仅是一系列的值。\n\n列表在 M 中有特定的用途，可以直接用于数据模型中。然而，它们更常被用作更复杂数据转换过程中的中间步骤。如果你有编程背景，将列表视为类似于数组的东西可能会有所帮助。\n\
  \n#### 手动创建列表\n\n一个列表就是用花括号括起来的一组逗号分隔的值——例如：\n\n```\n{1,2,3}\n```\n\n一旦集成到 M 查询的结构中，它可能看起来像图\
  \ 12-12 所示的示例。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig12_HTML.jpg](img/370912_3_En_12_Fig12_HTML.jpg)\n\
  \n*图 12-12 高级编辑器中的列表*\n\n一旦创建（无论是作为查询的中间步骤还是查询的最终输出），任何需要列表作为输入的地方都可以使用这个列表。事实上，如果你为前面的示例单击**完成**按钮，Power\
  \ Query 编辑器会将该 M 代码片段显示为一个功能列表——与你第 11 章中创建的完全一样。因此，你现在可以快速轻松地为参数（例如）创建自定义列表。\n\n\
  关于列表，你需要了解一些技术信息：\n\n- 列表大小没有限制。\n- 列表可以包含相同类型的数据（即所有元素都是数值、日期或文本等），也可以包含不同类型的数据。\n\
  - 列表可以为空——即由一对空花括号组成。\n- 列表可以水平或垂直输入。也就是说，前面显示的列表也可以输入为：\n\n```\nSource = {\n1,\n\
  2,\n}\n```\n\n生成列表非常简单；知道何时使用列表才是难点。\n\n#### 使用列表生成序列\n\n列表在 M 中有很多用途，但有一个领域它们特别出色，那就是生成数字、日期或文本的序列。我不再逐一繁琐地解释每种方法，而是在表\
  \ 12-8 中整理了一组用于生成列表的 M 代码片段示例。\n\n#### 从列表访问值\n\n如果你转向更高级的 M 编码，很可能会需要在 M 脚本中引用列表中的一个值。最简单的方法是使用*位置引用*。下面是一段实现此功能的简短\
  \ M 代码：\n\n```\nlet\nStart = {\"George\",\"Bill\",\"George W.\", \"Barack\", \"\
  Donald\"},\nsource = Start{3}\nin\nsource\n```\n\n这段代码片段的输出是列表中的第四个元素——这说明了 M 中的列表是*从零开始*的。也就是说，列表中的第一个元素是元素\
  \ 0。\n\n#### 列表函数\n\nM 中有几十个可用的列表函数。数量太多，无法在此详细讨论。因此，为了让你了解操作列表的一些可能方法，请看表 12-9。所有这些函数都使用你之前看到的非常简单的列表。\n\
  \n**表 12-9 列表函数**\n\n| 输出 | 代码片段 | 描述 |\n| --- | --- | --- |\n| 第一个值 | `List.First(MyList)`\
  \ | 返回列表中的第一个元素。 |\n| 最后一个值 | `List.Last(MyList)` | 返回列表中的最后一个元素。 |\n| 排序列表值 | `List.Sort(MyList)`\
  \ | 对列表中的值进行排序。 |\n| 提取范围 | `List.Range(MyList, 4)` | 从列表中提取一个值的范围。 |\n| 返回值 | `List.Select(MyList,\
  \ each _ =\"Adam\")` | 返回列表中符合条件的元素。 |\n| 生成列表 | `List.Generate()` | 创建一个顺序值的列表。\
  \ |\n| 聚合值 | `List.Sum(MyList)` | 聚合列表中的数值。 |\n| 替换值 | `List.ReplaceMatchingItems(MyList,\
  \ {\"Joe\", \"Fred\"})` | 替换列表中的一个值范围。 |\n| 转换为列表 | `Table.Column(MyList)` | 将表中的一列作为列表返回。\
  \ |\n\n表 12-9 只是 M 中可用列表函数的一小部分。如果你想查看全部函数，可以在微软网站 [`https://docs.microsoft.com/en-us/powerquery-m/list-functions`](https://docs.microsoft.com/en-us/powerquery-m/list-functions)\
  \ 上找到。\n\n### 记录\n\n如果说列表可以被视作你可以在 M 代码中使用的数据列，那么*记录*就是数据行。在 M 中创建更复杂的数据转换例程时，你很可能会需要定义记录。\n\
  \n最简单的形式是，以下是在 M 中创建的示例记录：\n\n```\nlet\nSource = [Surname = \"Aspin\", FirstName\
  \ = \"Adam\"]\nin\nSource\n```\n\n如果你需要访问记录中的数据，可以将记录变量名后面跟上用方括号括起来的字段名，如下所示：\n\n\
  ```\nlet\nSource = [Surname = \"Aspin\", FirstName = \"Adam\"],\nOutput = Source[Surname]\n\
  in\nOutput\n```\n\n你可能会发现一些有用的记录函数。这些函数在表 12-10 中列出。\n\n**表 12-10 记录函数**\n\n| 输出\
  \ | 代码片段 | 描述 |\n| --- | --- | --- |\n| 添加字段 | `Record.AddField()` | 向记录添加一个字段。\
  \ |\n| 移除字段 | `Record.RemoveFields()` | 从记录中移除一个字段。 |\n| 重命名字段 | `Record.RenameFields()`\
  \ | 重命名记录中的一个字段。 |\n| 输出字段 | `Record.Field()` | 返回记录中指定字段的值。 |\n| 计数 | `Record.FieldCount()`\
  \ | 返回记录中的字段数量。 |\n\n表 12-10 只是 M 中可用记录函数的一个子集。如果你想查看完整列表，可以在微软网站 [`https://docs.microsoft.com/en-us/powerquery-m/record-functions`](https://docs.microsoft.com/en-us/powerquery-m/record-functions)\
  \ 上找到。\n\n\n\n### 表格\n\n在 M 语言中，你可能经常使用的最终结构化数据类型是*表格*类型。正如你对一种用于加载、清理和塑造表格数据的语言所期望的那样，表格数据类型是\
  \ M 语言的基础。\n\n如果你决定在 M 语言中手动创建自己的表格，那么你至少需要包含以下结构元素：\n\n- `#table()` 函数\n- 一组列/字段标题，其中每个字段名称用双引号括起来，并且这组字段名称用大括号包裹\n\
  - 各行数据，每行用大括号括起来并用逗号分隔，其中所有行的集合也用大括号包裹\n\n一个手工编码表格的简单示例如下：\n\n```\n#table(\n{\"\
  Surname\", \"FirstName\"},\n{\n{\"Johnson\",\"Vladimir\"},\n{\"Putin\",\"Emmanuel\"\
  },\n{\"Macron\",\"Angela\"},\n{\"Merkel\",\"Boris\"}\n}\n)\n```\n\n然而，这种方法的缺点是没有为字段定义类型。因此，一种更健壮的方法是像这样扩展表格：\n\
  \n```\n#table(\ntype table\n[\n#\"Surname\" = text,\n#\"FirstName\" = text\n],\n\
  {\n{\"Johnson\",\"Vladimir\"},\n{\"Putin\",\"Emmanuel\"},\n{\"Macron\",\"Angela\"\
  },\n{\"Merkel\",\"Boris\"}\n}\n)\n```\n\n**注意**\n\n用于定义所需数据类型的类型关键字已在本章前面概述过。\n\n\
  M 语言中提供了许多表格函数。我已在表 12-11 中概述了一些比较有用的函数。\n\n**表 12-11** 表格函数\n\n| 输出 | 代码片段 | 说明\
  \ |\n| --- | --- | --- |\n| 合并表格 | `Table.Combine()` | 合并结构相似或不同的表格。 |\n| 记录数 |\
  \ `Table.RowCount()` | 返回表格中的记录数。 |\n| 第一条 | `Table.First()` | 返回表格中的第一条记录。 |\n\
  | 最后一条 | `Table.Last()` | 返回表格中的最后一条记录。 |\n| 查找行 | `Table.FindText()` | 返回表格中包含所需文本的行。\
  \ |\n| 插入行 | `Table.InsertRows()` | 在表格中插入行。 |\n| 输出行 | `Table.Range()` | 输出选定的行。\
  \ |\n| 删除行 | `Table.DeleteRows()` | 删除表格中的行。 |\n| 选择列 | `Table.SelectColumns()`\
  \ | 输出选定的列。 |\n\n表 12-11，正如你可能想象到的，只是 M 语言中可用表格函数的极小一部分。如果你想查看完整列表，可以在微软网站上找到：[`https://docs.microsoft.com/en-us/powerquery-m/table-functions`](https://docs.microsoft.com/en-us/powerquery-m/table-functions)。\n\
  \n### 其他函数领域\n\n正如我之前提到的，M 语言是一个庞大的主题，足以写满一整本（非常厚的）书。我们快速概述了一些核心概念和函数，但如果你想掌握 M\
  \ 语言，还有很多东西需要学习。如果你真的有兴趣了解更多，我建议你搜索微软文档中关于表 12-12 所列内容的部分，以进一步扩展你的知识。\n\n**表 12-12**\
  \ 其他函数领域\n\n| 函数领域 | 说明 |\n| --- | --- |\n| 数据访问函数 | 访问数据并返回表格值。 |\n| 二进制函数 | 访问二进制数据。\
  \ |\n| 合并器函数 | 由其他库函数使用，用于合并值以逐行应用逻辑。 |\n| 日期时间函数 | 应用于日期时间数据的函数。 |\n| 时区日期时间函数\
  \ | 应用于包含时区信息的日期时间数据的函数。 |\n| 表达式函数 | 用于表达式的 M 代码。 |\n| 行函数 | 将数据转换为值列表。 |\n| 替换器\
  \ | 由库中的其他函数使用，用于替换结构中的给定值。 |\n| 拆分器 | 将值拆分为子元素。 |\n| 类型 | 返回 M 类型。 |\n| Uri | 处理\
  \ URL 和 URI。 |\n| 值 | 处理 M 值。 |\n\n### M 语言中的自定义函数\n\nM 语言还允许你编写自定义函数，以便重复执行高度特定的任务。\n\
  \n作为一个非常简单的自定义函数示例，尝试将以下代码片段添加到一个新的空白查询中：\n\n```\nlet DiscountAnalysis =\n(Discount\
  \ as number) =>\nif Discount < 10 then \"Poor\" else \"Excellent\" in DiscountAnalysis\n\
  ```\n\n当你关闭高级编辑器时，你会看到此查询已被识别为一个 M 函数，并显示在查询列表中。你可以在图 12-13 中看到这一点（我已将其重命名为“DiscountAnalysis”）。\n\
  \n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig13_HTML.jpg](img/370912_3_En_12_Fig13_HTML.jpg)\n\
  \n**图 12-13** M 语言中的用户定义函数\n\n现在，你可以随时以交互方式调用该函数，只需输入一个值作为折扣并点击“调用”按钮即可。你也可以在其他\
  \ M 函数中使用此函数。实际上，这可能就是你首先创建自定义函数的原因。\n\n如果你想看一个更高级的函数，请看下面的代码片段，它会填充日期，如果需要，为日和月添加前导零：\n\
  \n```\nlet\nFormatDate = (InDate as date) =>\nlet\nSource = Text.PadStart(Text.From(Date.Month(InDate)),2,\"\
  0\") & \"/\" & Text.PadStart(Text.From(Date.Day(InDate)),2,\"0\") & \"/\" &Text.From(Date.Year(InDate))\n\
  in\nSource\nin\nFormatDate\n```\n\n### 为 M 代码添加注释\n\n复杂的 M 代码可能极其密集。因此，当你在数周或数月后重新审视代码时，很可能需要一些方法来记住你为什么创建某个流程。\n\
  \n一个让自己生活更轻松的简单方法是为 M 代码添加注释。你可以为你编写的代码以及自动生成的查询添加注释。\n\n有两种添加注释的方法。\n\n#### 单行注释\n\
  \n要注释单行（你可以在一行的开头或行中进行），只需添加两个正斜杠——像这样：\n\n```\n//This is a comment\n```\n\n从两个斜杠到行尾的所有内容都将被视为注释，不会被\
  \ M 语言解析。\n\n#### 多行注释\n\n多行注释可以覆盖多行——甚至可以覆盖一行的一部分。它们覆盖所有包含在 `/* ... */` 内的文本。\n\
  \n```\n/* This is a comment\nOver\nSeveral lines */\n```\n\n`/* ... */` 内的所有内容都将被视为注释，不会被\
  \ M 语言解析。\n\n## 结论\n\n本章结束了关于加载和转换源数据的部分。在本章中，你学习了 M 语言的基础知识，这些知识支撑着你迄今为止在本书中学到的所有内容。\n\
  \n你首先了解了如何使用 Power Query 编辑器界面来帮助你编写简短的 M 代码片段。然后，你继续探索了 M 语言的基本概念，例如表达式、变量和值。最后，你学习了\
  \ M 语言中的数据类型，以及更复杂的数据类型（如列表和表格），这些类型是复杂数据转换的基础。这涉及到学习使用高级编辑器来编写和调试你的代码。\n\n在本章以及前面的\
  \ 11 章中，你基本上看到了一个三阶段的过程：首先，找到数据；然后，将其加载到 Power BI Desktop 查询中；最后，对其进行清理和修改。你可以使用的技术简单但功能强大，范围从更改数据类型到合并多个数据表。既然你的数据已准备好并可供使用，你可以将其添加到\
  \ Power BI Desktop 数据模型中，并开始创建你的 Power BI Desktop 仪表板。接下来，你将开始使用查询的输出构建一个完整的数据模型。这将是下一章的主题。\n\
  \n\n\n"
- "# 13. 创建数据模型\n\n要创建令人惊叹的可视化效果，你只需要一样东西，那就是优质的数据。具体来说，你需要将干净且准确的数据加载到 Power BI Desktop\
  \ 的数据模型中。在这里，你可以将来自多个数据源、数以千万计的行数据，精炼成一个连贯且强大的框架，并以此为基础构建你的分析和仪表板。\n\n使用查询来查找、转换和加载源数据（正如你在第\
  \ 1 章到第 12 章中学到的那样）是为数据模型准备数据的基础。然而，这个过程并未就此结束。一旦你能够访问所需的数据，你仍然需要完成一些额外的工作。要完成整个过程，你需要将这些查询组合成一个清晰易懂、对任何使用者都一目了然的连贯结构。\n\
  \n为了确保你能够轻松地在 Power BI Desktop 中创建数据模型，以便日后在仪表板中进行深入分析，本章将向你介绍一些建模数据所需应用的技术。你将了解如何将已加载的数据表转换为\
  \ Power BI Desktop 数据模型中的结构化数据集。这个框架包括应用适当的数据类型、分类和格式，从而使你能够从模型中的数据传递信息、洞见并进行分析。这个学习曲线涵盖的过程包括：\n\
  \n- 定义合适的语义层——即确保所有表和字段都具有清晰易懂的名称\n- 确保所有数据类型都正确\n- 格式化数据\n- 为每个字段设置 Power BI 将在仪表板中使用的默认聚合方式\n\
  - 在数据模型中联接表\n\n此列表中的第五点可能是数据建模中最基础的方面。实际上，它将占据本章近一半的篇幅。为了准确、精确地报告数据，你必须让 Power BI\
  \ Desktop 理解一个表中的数据如何与另一个表中的数据相关联。将一个表链接到另一个表，将让你能够利用这些数据来提供准确且有说服力的结果。\n\n再次提醒，本章使用的所有示例文件都可以在\
  \ Apress 网站上找到。下载后，它们应位于 `C:\\PowerBiDesktopSamples` 文件夹中。\n\n## Power BI Desktop\
  \ 的“数据”视图\n\n要开始使用 Power BI Desktop 准备所有表和字段，通常最简单的方法是在“数据”视图中工作。这意味着：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig1_HTML.jpg](img/370912_3_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1 – “数据”视图\n\n1. 运行 Power BI Desktop 并加载你需要访问数据所需的任何查询。要遵循本章中的示例，请打开 `C:\\\
  PowerBiDesktopSamples\\CarSalesDataFromDataModel.pbix` 文件。\n\n2. 如果你使用自己的数据，请确保已关闭\
  \ Power BI Desktop 查询窗口，并应用了所有已做的更改，然后返回到 Power BI Desktop 环境。\n\n3. 单击左侧的“数据”视图图标。你将切换到“数据”视图，在该视图中，你可以看到右侧“字段”列表中的所有可用表。其中一个表将被选中，其数据将显示在“数据”窗格中，如图\
  \ 13-1 所示。“可视化”和“筛选器”窗格将不再可见，并且会出现两个新菜单——“表工具”和“列工具”（如果选择了列的话）。\n\n**注意：** 只有在数据被加载到\
  \ Power BI Desktop 数据模型之后，才能对数据进行建模。我的意思是，如果在查询编辑器中编辑数据后，没有应用更改就返回 Power BI Desktop\
  \ 窗口，将会阻碍你的数据建模——或者至少会阻止你获得准确的结果。\n\n## “数据视图”还是“查询”？\n\n你可能会想，“数据”视图目前看起来似乎没什么特别。甚至，它看起来像是\
  \ Power BI Desktop 查询窗口的一个扩展。不过请放心，你很快就能看到在“数据”视图中能做什么，以及 Power BI Desktop 在数据建模方面究竟有多强大。目前，关键在于要记住，你（可以这么说）已经打开了一扇通往\
  \ Power BI Desktop 核心引擎的大门。尽管这个新世界是 Power BI Desktop 的一部分（并且你可以通过单击“数据”视图图标上方的“报表”视图图标立即返回到\
  \ Power BI 可视化界面），但最好暂时将其视为一个平行宇宙。这个宇宙有自己的功能区和按钮，并且独立于“报表”视图，以便你可以专注于增强数据和数据结构。\n\
  \nPower BI Desktop 的“数据”视图也与 Power BI Desktop 的查询编辑器不同。例如，Power BI Desktop 查询窗口与“数据”视图的一个主要区别在于，在“数据”视图中，你看到的是\
  \ *所有* 数据。而查询窗口仅显示数据的 *样本*。一旦你将数据加载到数据模型中，你最终就能访问 *整个* 数据集（所有表中的所有数据），而这正是你在“数据”视图中可以看到的内容。\n\
  \n第二个区别是，一旦你离开了查询窗口，你将始终处理整个数据集，并且仅根据特定仪表板或可视化的需求对其进行筛选。因此，你需要意识到，你在查询窗口中应用的任何筛选器都会限制\
  \ Power BI Desktop 中可以显示的数据。相比之下（正如你将在本书后面看到的），一旦你定义了核心数据并创建了数据模型，你可以对整个仪表板或特定的可视化应用后续的筛选器。\n\
  \n在某些方面，Power BI Desktop 查询可以完成一些也可以在“数据”视图或“关系”视图中完成的工作。例如，你可以在两者中创建计算字段（你将在下一章了解如何在“数据”视图中执行此操作）。我的建议是，尽量记住\
  \ Power BI Desktop 查询用于查找、筛选和整合数据，而“数据”视图用于精炼和计算数据模型中的数据层和度量值。但是，每个用户都可以选择自己偏好的方法，并在查询编辑器或“数据”视图中执行任何必要的计算。毕竟，结果才是最重要的。\n\
  \n**注意：** 在建模数据之前，*务必*确保你已在查询编辑器中单击了`关闭并应用`。这可以保证你正在处理的是你已进行的数据转换的最新版本，以及最新的数据。如果你没有单击`关闭并应用`，你将在\
  \ Power BI Desktop 窗口的顶部看到一条警报。\n\n“数据”视图主要用于为最终的建模步骤准备数据。这包括：\n\n- 操作表\n- 添加“排序依据”字段，以确保仪表板元素中的排序顺序正确\n\
  - 重命名表和列\n- 定义数据类型\n- 设置数据类别\n- 格式化数据\n- 基于字段值创建组\n- 设置`按列排序`（以使用另一列的内容对列进行排序）\n\
  - 将表设置为日期表，以应用时间智能\n\n一旦定义了这些核心元素，你就可以进入建模步骤，在该步骤中，你将表联接成一个连贯的数据模型。\n\n## Power\
  \ BI Desktop 的“数据”视图功能区\n\n那么，当你看 Power BI Desktop 数据时，你到底在看什么呢？基本上，你可以看到三个功能区，它们都致力于准备数据模型的基本方面：\n\
  \n- 主页功能区\n- 表工具功能区\n- 列工具功能区（当选择了一列时）\n\n后两个功能区将在本章后面详细解释。主页功能区将在下一章详细解释。\n\n\n\
  \n## 管理 Power BI Desktop 数据\n\n假设一切顺利，你现在已经成功地将来自不同数据源的一系列表添加到了 Power BI Desktop\
  \ 数据模型中。如果你已打开文件 `C:\\PowerBiDesktopSamples\\CarSalesDataFromDataModel.pbix`，可以在\
  \ Power BI Desktop 窗口右侧的“字段”列表中看到一组数据表。单击某个表，该表的数据就会显示在“数据视图”窗口的中央区域。很快，我们就要看看你能用这些数据做什么了，但首先，为了完成对整体数据管理的概述，你需要了解如何执行以下操作：\n\
  \n-   重命名表\n-   删除表\n-   移动表\n-   在表中移动\n-   重命名字段\n-   删除字段\n-   设置字段宽度\n\n**注意**\n\
  \n当加载和编辑源数据时，我通常使用术语“数据集”来描述源数据。现在数据已最终加载完毕，我将使用术语“（数据）表”来描述 Power BI Desktop 在塑造和扩展数据模型时使用的数据实体。这是因为，表几乎总是查询所产生所有转换的输出结果。同样地，我更倾向于将“字段”列表中显示的数据列称为“字段”——即使\
  \ Power BI Desktop 经常将它们称为“列”。\n\n### 操作表\n\n让我们先来看看如何调整你已经成功导入和转换的表。\n\n#### 重命名表\n\
  \n假设你想要重命名之前使用 Power BI Desktop 查询导入的表。请遵循以下步骤：\n\n-   单击 Power BI Desktop 窗口右侧“字段”列表中的表名。\n\
  -   选择“表工具”功能区。\n-   在`名称`字段中输入新名称或修改现有名称。\n-   按 Enter 键。\n\n*这也会重命名该表所基于的查询*。本质上，Power\
  \ BI 允许你在 Power BI Desktop 查询窗口或数据窗口中重命名数据集。因为查询*就是*表，重命名其中一个也会重命名另一个。\n\n**注意**\n\
  \n你也可以右键单击 Power BI Desktop 窗口右侧“字段”列表中的表名，然后选择 `重命名`，接着输入新名称或修改现有名称。\n\n#### 删除表\n\
  \n删除表的操作与重命名表几乎完全相同——你只需右键单击表名选项卡，然后选择 `删除` 而不是 `重命名`。由于这可能是一个影响深远的操作，Power BI Desktop\
  \ 会要求确认。\n\n**注意**\n\n当你删除一个表时，你是将其从 Power BI Desktop 中完全移除。这意味着它也会*同时*从你可能用于转换数据的查询集中被移除。因此，在删除表时你需要非常小心，因为你可能会丢失所有精心制作的转换步骤。\n\
  \n#### 从可用字段列表中选择一个字段\n\n如果你想直接跳转到某个数据字段（并假设你知道哪个字段包含你感兴趣的数据），你只需这样做：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig2_HTML.jpg](img/370912_3_En_13_Fig2_HTML.jpg)\n\
  \n**图 13-2** *表中的字段列表*\n\n1.  在“字段”列表中，单击包含你要跳转字段的表左侧的展开三角形。该表中的字段列表将显示出来，如图 13-2\
  \ 所示。\n1.  单击包含你要研究数据的字段名称。该字段将在表中被选中。\n\n### 操作字段\n\n现在，让我们看看如何在表内部对构成表的数据字段执行类似的操作。\n\
  \n### 重命名字段\n\n重命名字段相当简单。你只需这样做：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig3_HTML.jpg](img/370912_3_En_13_Fig3_HTML.jpg)\n\
  \n**图 13-3** *Power BI Desktop 上下文菜单*\n\n1.  在“字段”列表中，右键单击你要重命名的字段标题（或单击字段名称右侧的省略号）。在此示例中，它是\
  \ `Data Clients` 表中的 `ClientType` 字段。该字段将被选中，并出现上下文菜单，如图 13-3 所示。\n1.  从上下文菜单中选择\
  \ `重命名`。当前字段名称将被高亮显示。\n1.  为字段输入新名称（`TypeOfClient`），然后按 Enter 键。\n\n就这样。你的字段已被重命名；它同时也被选中。但是，你不能使用同一表中现有字段的名称。如果你尝试这样做，Power\
  \ BI Desktop 将显示如图 13-4 所示的对话框。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig4_HTML.jpg](img/370912_3_En_13_Fig4_HTML.jpg)\n\
  \n**图 13-4** *重命名字段对话框*\n\n如果发生这种情况，只需单击 `关闭`，然后使用不同的新字段名称重新开始。\n\n尽管重命名字段看似微不足道，但它可能很重要。首先考虑其他用户；他们需要字段名称立即可懂且对他们有意义。然后是\
  \ [PowerBI.com](http://powerbi.com) 的 Q&A 自然语言功能。只有当你的字段名称与查询中使用的名称一致，或者是可识别的同义词时，该功能才能正常工作。最后，你确实需要为你的字段赋予你乐于看到在所有基于此数据集的仪表板中标准化的名称（即使你可以在可视化效果中单独重命名字段）。这样做的好处是，相同的数据将始终具有相同的名称，从而消除受众——以及你自己——潜在的理解困难或混淆。\n\
  \n你也可以通过右键单击你感兴趣的字段标题并从上下文菜单中选择 `重命名`，或者通过单击列内部，然后选择“列工具”功能区，在其中更改`名称`字段的内容来重命名字段。\n\
  \n**提示**\n\nPower BI Desktop 在重命名字段（实际上，也包括表和计算）方面非常宽容。你可以重命名查询窗口、数据视图、报表视图或关系视图中的*大多数*元素（取决于它们添加的位置），这些更改将传播到整个\
  \ Power BI Desktop 数据模型。更好的是，如果这些元素已应用于仪表板，重命名字段、计算和表通常不会给 Power BI Desktop 带来任何困难，因为这些仪表板也会更新以反映名称的更改。只需注意，如果你自定义了很多名称并且没有记录字段以供参考，你会发现逆向工程一个报表可能是一项相当艰巨的任务。在实践中，如果你始终在查询中保留从别名字段到源字段的引用，这会为你节省大量精力。\n\
  \n\n\n#### 删除字段\n\n删除字段同样简单。当你导入了一个本来不想导入的字段，或者发现不再需要某个字段时，你很可能需要进行此操作。要删除一个字段，请执行以下操作：\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig5_HTML.jpg](img/370912_3_En_13_Fig5_HTML.jpg)\n\
  \n**图 13-5** 删除字段\n\n1. 右键单击你想要删除的字段标题。或者，右键单击 **字段（Fields）** 列表中的字段名称。该字段将被选中，并出现上下文菜单。\n\
  2. 从上下文菜单中选择 **删除字段（Delete Fields）**。除非该字段为空，否则将会出现如图 13-5 所示的确认对话框。\n3. 点击 **确定（OK）**。该字段将从表中删除。\n\
  \n删除未使用的字段是一种良好的实践，因为这样做将：\n- 减少数据集所需的内存\n- 加快数据刷新操作\n- 减小 Power BI Desktop 文件的大小\n\
  \n> **注意**：删除字段确实是永久性的。你无法使用撤销功能恢复它。实际上，刷新数据也不会将该字段重新添加回表中。如果你不小心删除了一个字段，可以选择不保存并关闭\
  \ Power BI Desktop 文件，然后重新打开，从而恢复到上一个版本。另外，你也可以返回源查询，并将字段名称重新添加到查询中，因为在 Power BI\
  \ Desktop 中删除字段会在相关查询的底层步骤序列中添加一个 **删除列（Remove Field）** 步骤。\n\n#### 移动字段\n\n一旦进入数据模型，你*不能*移动字段。因此，如果你想因任何原因更改字段顺序，必须切换到\
  \ Power BI Desktop 查询编辑器并在那里移动字段。一旦你保存并应用更改，修改后的字段顺序就会在数据模型中可见。但是，在**报表视图**的 **字段（Fields）**\
  \ 列表中，字段将始终按字母顺序排列。\n\n#### 设置字段宽度\n\n为了让数据更易读，从而更容易理解，你可能想做的最后一件事情是调整字段宽度。我知道作为\
  \ Excel 或 Word 用户，你可能觉得这已是老生常谈，但为了内容的完整性，操作方法如下：\n\n1. 将鼠标指针悬停在你想更改宽度的字段的标题右侧边界上。鼠标指针会变成双向箭头。\n\
  2. 向左或向右拖动鼠标指针。\n\n> **注意**：你不能在调整一个字段宽度之前先选中几个相邻的字段，然后一次性将它们设置为正在调整的字段的宽度。你可以双击要更改宽度的字段标题的右侧边界，这样\
  \ Power BI Desktop 会自动将宽度设置为该字段中最长元素的宽度。\n\n调整字段宽度纯粹是为了帮助你阅读数据，对任何视觉对象中的列宽*没有影响*。\n\
  \n## 准备数据\n\n现在，你的表和列已经准备好了（这可以称为“准备语义层”），你可以开始定义每个字段的基本方面。这包括：\n- 数据类型归因\n- 格式化数据\n\
  - 数据分类\n- 设置默认汇总\n- 准备数据组\n\n几乎所有此类操作都使用**列工具（Column tools）** 功能区完成。你可以从图 13-6 中看到这个功能区。该功能区的内容在表\
  \ 13-1 中进行了说明。\n\n**表 13-1** 列工具功能区\n\n| 按钮 | 说明 |\n| --- | --- |\n| 名称 (Name) |\
  \ 允许你修改列名称。 |\n| 数据类型 (Data type) | 设置列的数据类型。 |\n| 格式类型 (Format type) | 设置整体格式类型。\
  \ |\n| 格式 (Format) | 指定精确的格式设置。 |\n| 默认汇总 (Default summarization) | 从可用选项中设置默认汇总方式。\
  \ |\n| 数据类别 (Data category) | 应用数据类别。 |\n| 按列排序 (Sort by column) | 应用按列排序（使用另一列中的数据进行排序）。\
  \ |\n| 数据组 (Data groups) | 允许你对数据进行分组。 |\n| 关系 (Relationships) | 显示**管理关系**对话框。\
  \ |\n| 新建列 (New column) | 使用 DAX 添加一个新列。 |\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig6_HTML.jpg](img/370912_3_En_13_Fig6_HTML.jpg)\n\
  \n**图 13-6** 列工具功能区\n\n在某些操作中，你可能还会用到**表工具（Table tools）** 功能区。该功能区的内容在表 13-2 中进行了说明。你可以从图\
  \ 13-7 中看到这个功能区。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig7_HTML.jpg](img/370912_3_En_13_Fig7_HTML.jpg)\n\
  \n**图 13-7** 表工具功能区\n\n**表 13-2** 表工具功能区\n\n| 按钮 | 说明 |\n| --- | --- |\n| 表名称 (Table\
  \ name) | 允许你修改表名称。 |\n| 日期表 (Date table) | 将选定的表设置为日期表。 |\n| 关系 (Relationships)\
  \ | 显示**管理关系**对话框。 |\n| 度量值 (Measure) | 使用 DAX 添加一个新度量值。 |\n| 快速度量值 (Quick measure)\
