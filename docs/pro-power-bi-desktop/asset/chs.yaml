  \n同样，由于日期时间函数和时区日期时间函数与日期和时间函数非常相似，我在这里没有展示它们。这些函数也可以在微软网站上找到。\n\n## 持续时间函数\n\n\
  M 语言还能提取持续时间——以天、小时、分钟和秒为单位。表 12-6 展示了一些基本的持续时间函数。\n\n**表 12-6** 持续时间函数示例\n\n| 输出\
