  \ | 将“M”语言函数应用于每一行。 |\n| `条件列` | 添加一个新列，该列根据条件从选定列中添加值。 |\n| `索引列` | 在新列中添加一个序列号，以唯一标识每一行。\
  \ |\n| `重复列` | 创建当前列的副本。 |\n| `格式` | 修改新列中数据的文本格式（大写、小写、首字母大写）或删除尾随空格。 |\n| `合并列`\
  \ | 将多列中的数据合并到单个列中，并可以添加可选的分隔符。 |\n| `提取` | 使用当前数据的一个已定义子集创建新列。您可以指定从列的开头或结尾保留的字符数，设置从指定字符开始的字符范围，甚至可以列出列中的字符数。\
  \ |\n| `分析` | 基于列中的`XML`或`JSON`创建新列。 |\n| `统计信息` | 创建一个新列，返回该列中所有值的`总和`、`平均值`、`最大值`、`最小值`、`中位数`、`标准差`、`计数`或`非重复值计数`。\
  \ |\n| `标准` | 创建一个新列，使用您指定的值应用于列中的每个单元格，返回基本的数学计算结果（加、减、除、乘、整数除或返回余数）。 |\n| `科学`\
  \ | 创建一个新列，对列中的每个单元格返回基本的科学计算结果（平方、立方、`n`次幂、平方根、指数、对数或阶乘）。 |\n| `三角函数` | 创建一个新列，使用您指定的值应用于列中的每个单元格，返回基本的三角计算结果（正弦、余弦、正切、反正弦、反余弦或反正切）。\
  \ |\n| `舍入` | 将新列中的值舍入到下一个整数（向上或向下）或舍入到指定倍数。 |\n| `信息` | 将列中的值替换为简单信息：`是奇数`、`是偶数`或`正数/负数`。\
  \ |\n| `日期` | 从新列中的日期值中提取一个元素（日、月、年等）。 |\n| `时间` | 从新列中的日期/时间或时间值中提取一个元素（小时、分钟、秒等）。\
  \ |\n| `持续时间` | 从新列中可解释为天、小时、分钟和秒的持续时间的值计算持续时间。 |\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig7_HTML.jpg](img/370912_3_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7** 查询编辑器“`添加列`”功能区\n\n##### “视图”功能区\n\n“`视图`”功能区允许您更改某些查询编辑器设置，并查看底层的数据转换代码。它所包含的各种选项将在下一章中进行说明。\n\
  \n### 数据集整形\n\n现在，您正在查看已加载到 Power BI Desktop 中的数据表。为便于讨论，我们假设这是示例数据目录中的 `C:\\PowerBiDesktopSamples\\\
  Example1.pbix` 文件，并且您已单击“`转换数据`”按钮以显示 Power BI Desktop 查询编辑器。您能对现在可见的 `BaseData`\
  \ 数据集做些什么呢？是时候了解一些可用于整形初始数据集的核心技术了。这些技术包括：\n\n*   重命名列\n*   对列重新排序\n*   删除列\n* \
  \  合并列\n*   删除记录\n*   删除重复记录\n*   筛选数据集\n\n我将这些技术归为一组，因为它们会影响数据的初始大小和形状。此外，如果您从一开始就排除不需要的行和列，这不仅是良好的实践，通常对作为数据建模者的您来说也更容易。我还发现，如果列从一开始就逻辑地排列并具有易于理解的名称，那么理解数据集也会更容易。总而言之，从长远来看，这将使数据处理工作更加轻松。\n\
  \n#### 重命名列\n\n尽管我们在本章开头几页快速了解了重命名列，但让我们再次更详细地探讨这项技术。我承认，重命名列实际上并没有修改数据表的形式。然而，在处理数据时，我认为让所有数据清晰可辨至关重要。这意味着要为每一列应用有意义的列名。因此，我认为这种修改是数据整形的基础，也是导入源数据时一项必不可少的最佳实践。\n\
  \n要重命名列：\n\n1.  单击要重命名的列内部。\n2.  单击“`转换`”以激活“`转换`”功能区。\n3.  单击“`重命名`”按钮。列名将被高亮显示。\n\
  4.  输入新名称或编辑现有名称。\n5.  按 `Enter` 键或单击列标题外部。\n\n该列现在将有一个新标题。右侧的“`应用的步骤`”列表现在将包含另一个步骤：“`已重命名的列`”。此步骤将被高亮显示。\n\
  \n**注意**：作为使用“`转换`”功能区的替代方法，您可以右键单击列标题并选择“`重命名`”。\n\n#### 对列重新排序\n\nPower BI Desktop\
  \ 会按照数据源中定义的方式加载数据。因此，列顺序完全取决于源数据（或者，如果使用了源数据库，则取决于 `SQL` 查询，如第 3 章所述）。但是，此列顺序并非一成不变，如果重新排序列有助于您理解和处理数据，您可以这样做。要更改列顺序，请执行以下操作：\n\
  \n1.  单击要移动的列的标题。\n2.  将列向左或向右拖拽到其新位置。当您执行此操作时，您会看到列标题在列标题之间横向滑动，并且一条较粗的灰色线将指示释放鼠标按钮后列将放置的位置。“`已重新排序的列`”将出现在“`应用的步骤`”列表中。\n\
  \n图 7-8 演示了此操作。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig8_HTML.jpg](img/370912_3_En_7_Fig8_HTML.jpg)\n\
  \n**图 7-8** 对列重新排序\n\n如果您的查询包含几十列，甚至几百列，您可能会发现拖拽列既缓慢又费力。同样，如果列非常宽，则可能难以向左或向右“微移”列。在这些情况下，Power\
  \ BI Desktop 可以通过“`转换`”功能区中的“`移动`”按钮为您提供帮助。单击此按钮将为您提供表 7-4 中概述的菜单选项。\n\n**表 7-4**\
  \ “`移动`”按钮选项\n\n| 选项 | 说明 |\n| --- | --- |\n| `向左` | 将当前选定的列向左移动到其紧邻左侧列的左侧。 |\n\
  | `向右` | 将当前选定的列向右移动到其紧邻右侧列的右侧。 |\n| `移至开头` | 将当前选定的列移动到查询中所有列的左侧。 |\n| `移至末尾` |\
  \ 将当前选定的列移动到查询中所有列的右侧。 |\n\n“`移动`”命令也适用于您通过 `Ctrl`+单击和/或 `Shift`+单击选择的一组列。实际上，如果需要，您可以移动一组不连续的列。\n\
  \n**注意**：您需要在单击“`移动`”按钮之前选择一个列（或一组列）。如果没有选择，那么在首次使用“`移动`”时，Power BI Desktop 查询会选择该列，但不会移动它。\n\
  \n\n\n#### 删除列\n\n那么如何删除一列或一系列列呢？操作如下：\n\n1. 单击要删除的列内部，或者如果要一次性删除多列，请按住 `Ctrl` 键并单击要删除的列标题。\n\
  2. 在“开始”功能区中，单击“删除列”按钮。所选列将被删除，并且“已删除列”将出现在“应用的步骤”列表的最末尾。\n\n当处理你无法控制的导入数据集时，你可能会经常发现，大型数据表中你需要的只有几列。如果是这种情况，多次按住\
  \ `Ctrl` 并单击选择要删除的列很快就会让你感到厌烦。Power BI Desktop 提供了另一种方法。只需选择要保留的列，然后删除其他列。操作如下：\n\
  \n1. 按住 `Ctrl` 键并单击要保留的列标题。\n2. 在“开始”功能区的“删除列”按钮上，单击小三角形。从菜单中选择“删除其他列”。所有未选中的列将被删除，并且“已删除其他列”将添加到“应用的步骤”列表中。\n\
  \n在选择要删除或保留的连续列范围时，你可以使用标准的 Windows `Shift` 键加单击技术，从要选择的列块中第一列选择到最后一列。\n\n> **注意：**\
  \ 这两种删除列的选项也可在上下文菜单中找到（如果你更喜欢的话）。删除列时，上下文菜单会显示“删除”（如果选择了多列，则显示“删除列”），如果你右键单击列标题，还会显示“删除其他列”。\n\
  \n#### 选择列\n\n如果你不想在宽数据集中滚动，但又需要选择列子集作为报表基础，那么还有另一种方法可以定义你想要使用的字段集合。你可以像这样选择想要保留的列（并根据需要排除其他列）：\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig9_HTML.jpg](img/370912_3_En_7_Fig9_HTML.jpg)\n\
  \n**图 7-9** – “选择列”对话框\n\n1. 打开文件夹 `C:\\PowerBiDesktopSamples` 中的示例文件 `CH07Example1.pbix`（如果尚未打开）。\n\
  2. 在“开始”功能区中，单击“转换数据”按钮。查询编辑器将打开。\n3. 在查询编辑器的“开始”功能区中，单击“选择列”按钮。\n4. 单击“（全选）”以取消选择数据集中的所有列。\n\
  5. 选择 `Make`、`Color` 和 `SalePrice` 列。“选择列”对话框将如图 7-9 所示。\n6. 单击“确定”。查询编辑器将仅显示你选择的列。\n\
  \n“选择列”对话框附带了一些额外功能，在你选择要处理的列集时可能会很有用：\n\n-   你可以通过单击“选择列”对话框右上角的“排序”图标（小 `A-Z`）并选择所需选项，按字母顺序对列列表进行排序（或者恢复到原始顺序）。\n\
  -   你可以通过在对话框顶部的“搜索列”字段中输入几个字符并按 `Enter` 键，来筛选显示的列列表。\n-   “（全选）”选项可在选中和取消选中列表中所有列之间切换。\n\
  \n## 合并列\n\n源数据并不总是完全符合你的期望（有时这还是一种轻描淡写的说法）。某些数据源可能将数据分散在多列中，而这些数据其实可以合并到一列中。因此，发现\
  \ Power BI Desktop 查询也可以执行此类操作，可能并不令人惊讶。操作如下：\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig10_HTML.jpg](img/370912_3_En_7_Fig10_HTML.jpg)\n\
  \n**图 7-10** – “合并列”对话框\n\n1. 按住 `Ctrl` 键单击要合并的列标题（在本示例中为 `BaseData` 数据集中的 `Make`\
  \ 和 `Model` 列）。\n2. 在“转换”功能区中，单击“合并列”按钮。将显示“合并列”对话框。\n3. 从“分隔符”弹出菜单中，选择一个可用的分隔符元素。在此示例中，我选择了“冒号”。\n\
  4. 输入将由原始两列创建的新列的名称（我将其命名为 `MakeAndModel`）。该对话框应如图 7-10 所示。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig11_HTML.jpg](img/370912_3_En_7_Fig11_HTML.jpg)\n\
  \n**图 7-11** – 合并列的结果\n\n5. 单击“确定”。你选择的列将被来自所有列的数据替换，如图 7-11 所示。\n\n关于此过程，我需要补充几点说明：\n\
  \n-   合并列时，你可以选择任意数量的列。\n-   如果在“合并列”对话框中未为结果列指定名称，它将仅被重命名为“已合并”。你也可以稍后根据需要进行重命名。\n\
  -   选择列的顺序会影响数据的合并方式。因此，请始终先选择其数据必须出现在合并列最左侧的列，然后选择其数据应位于其次的列，依此类推。你无需按照列在数据集中最初出现的顺序进行选择。\n\
  -   如果你不想使用 Power BI Desktop 查询建议的任何标准分隔符，可以随时自定义。只需在“合并列”对话框的弹出菜单中选择“--自定义--”。对话框中会出现一个新框，你可以在其中输入选择的分隔符。如果你愿意，它甚至可以由多个字符组成。\n\
  -   从“转换”功能区合并列会删除所有选定的列，并将其替换为单个列。相同的选项也可从“添加列”功能区获得——但在此情况下，此操作会*添加*一个新列，并保留数据集中的原始列。\n\
  \n> **注意：** 如果你右键单击列标题，此选项也可在上下文菜单中找到。\n\n可用的合并分隔符在表 7-5 中进行了描述。\n\n**表 7-5** –\
  \ 合并分隔符\n\n| 选项 | 描述 |\n| --- | --- |\n| `冒号` | 使用冒号（`:`）作为分隔符。 |\n| `逗号` | 使用逗号（`,`）作为分隔符。\
  \ |\n| `等号` | 使用等号（`=`）作为分隔符。 |\n| `分号` | 使用分号（`;`）作为分隔符。 |\n| `空格` | 使用空格（` `）作为分隔符。\
  \ |\n| `制表符` | 使用制表符作为分隔符。 |\n| `自定义` | 允许你输入自定义分隔符。 |\n\n> **提示：** 如果你愿意，也可以使用上下文菜单拆分、删除和复制列。请记住右键单击列标题以显示正确的上下文菜单。\n\
  \n#### 转到特定列\n\nPower BI Desktop 可以加载包含数百列的数据集。由于在数十列之间左右滚动可能会让人感到有些沮丧，你可以随时跳转到特定列。\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig12_HTML.jpg](img/370912_3_En_7_Fig12_HTML.jpg)\n\
  \n**图 7-12** – “转到列”对话框\n\n1. 在查询编辑器的“开始”功能区中，单击“选择列”按钮底部的小三角形。选择“转到列”。将出现“转到列”对话框。\n\
  2. 选择要移动到的列。该对话框将如图 7-12 所示。\n3. 单击“确定”。Power BI Desktop 将选中所选的列。\n\n> **提示：** 如果你愿意，也可以双击“转到列”对话框中的列名以移动到所选列。\n\
  \n\n\n## 删除记录\n\n你未必总需要使用加载到 Power BI Desktop 查询中的*所有*数据。原因可能有以下几种：\n\n-   你正在初步查看数据，只需要一个样本来了解数据的大致情况。\n\
  -   数据包含某些你明确不需要且从一开始就能轻松识别的记录。\n-   你正在测试数据清理，并希望使用较小的数据集来加速复杂数据提取和转换流程的开发。\n-\
  \   你想分析一个精简数据集以推断结论并节省时间，将完整数据集的分析留待日后进行，甚至可能使用 SQL Server Integration Services\
  \ 等更强大的工具集。\n\n为了让你能够缩小数据集，Power BI Desktop 提供了两种开箱即用的基本方法：\n\n-   保留特定行\n-   删除特定行\n\
  \n你采用哪种技术必然取决于具体情况。如果通过包含的方式更容易指定要采样的行，那么保留特定行方法是最佳选择。反之，如果希望通过排除的方式操作，那么删除特定行方法则最为合适。下面我们逐一来看。\n\
  \n#### 保留行\n\n此方法允许你指定要继续使用的行。它基于以下三种选项之一的应用：\n\n-   保留前 *n* 条记录。\n-   保留后 *n* 条记录。\n\
  -   保留指定范围内的记录——即，每 *y* 条记录保留 *n* 条记录。\n\n这些技术大多非常相似，因此我们首先假设你想保留示例文件 `C:\\PowerBiDesktopSamples\\\
  Example1.pbix` 中的前 50 条记录。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig13_HTML.jpg](img/370912_3_En_7_Fig13_HTML.jpg)\n\
  \n图 7-13\n“保留前几行”对话框\n\n1.  在 Power BI 查询编辑器的“开始”功能区中，单击 `保留行` 按钮。将出现一个菜单。\n2. \
  \ 选择 `保留前几行`。将显示“保留前几行”对话框。\n3.  在“行数”框中输入 `50`，如图 7-13 所示。\n4.  单击 `确定`。除前 50 条记录外，所有记录均被删除，并且“保留的首行”会添加到“应用的步骤”列表中。\n\
  \n要保留后 *n* 行，技术几乎相同。按照上一个示例的步骤操作，但在步骤 2 中选择 `保留后几行`。在这种情况下，“应用的步骤”列表将显示“保留的最后行”。\n\
  \n要保留一个范围内的行，你需要指定起始记录以及从该点开始要保留的记录数。例如，假设你想丢弃前 10 条记录，但保留接下来的 25 条。操作方法如下：\n\n\
  ![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig14_HTML.jpg](img/370912_3_En_7_Fig14_HTML.jpg)\n\
  \n图 7-14\n“保留行范围”对话框\n\n1.  在“开始”功能区中，单击 `保留行` 按钮。\n2.  选择 `保留行范围`。将显示“保留行范围”对话框。\n\
  3.  在“第一行”框中输入 `11`。\n4.  在“行数”框中输入 `25`，如图 7-14 所示。\n5.  单击 `确定`。除记录 1-10 以及从 36\
  \ 到末尾的记录外，所有记录均被删除，并且“保留的行范围”会添加到“应用的步骤”列表中。\n\n> **注意**  \n> 你可能已经注意到，此对话框与许多其他对话框一样，在输入值的字段左侧包含一个弹出菜单。此弹出菜单允许你*参数化*该值。参数将在第\
  \ 11 章中解释。\n\n#### 删除行\n\n删除行与你刚刚使用的保留行过程几乎相同。由于删除前 *n* 行或后 *n* 行高度相似，此处不再赘述。你只需单击“开始”功能区中的\
  \ `删除行` 按钮，然后按照保留行的流程操作即可。在这种情况下，“应用的步骤”列表将显示“删除的前几行”或“删除的后几行”，并且行将被删除，当然不会保留在数据集中。\n\
  \n删除行方法确实有一个非常有用的选项，可以作为采样技术应用。它允许你每隔几行删除一条或多条记录，以生成源数据的子集。为此，你需要执行以下操作：\n\n1. \
  \ 在查询窗口的“开始”功能区中，单击 `删除行` 按钮。将出现一个菜单。\n2.  选择 `删除隔行`。将显示“删除隔行”对话框。\n3.  输入 `10`\
  \ 作为要删除的起始行。\n4.  输入 `2` 作为要删除的行数。\n5.  输入 `10` 作为要保留的行数。\n\n该对话框将如图 7-15 所示。\n\n\
  ![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig15_HTML.jpg](img/370912_3_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15\n“删除隔行”对话框\n\n1.  单击 `确定`。除匹配你在对话框中输入模式的记录外，所有记录均被删除。然后，“删除的隔行”会添加到“应用的步骤”列表中。\n\
  \n> **注意**  \n> 如果你确实决心提取一个你认为能代表关键数据的样本，那么你始终可以在子集化之前对数据进行筛选，以排除任何异常值。筛选数据将在本章后面解释。\n\
  \n#### 删除空行\n\n如果你的源数据包含完全空白的行，可以按如下方式删除：\n\n1.  在查询窗口的“开始”功能区中，单击 `删除行` 按钮。将出现一个菜单。\n\
  2.  选择 `删除空行`。\n\n这将导致空行被删除。然后，“删除的空行”会添加到“应用的步骤”列表中。\n\n#### 删除重复记录\n\n外部数据源可能并不像你期望的那样完美。糟糕数据最令人烦恼的特征之一就是存在重复项。这些重复项具有隐蔽性，因为它们会扭曲结果，而且并不总是可见。如果你怀疑数据表包含*严格*重复项（即两条或多条记录中的每个字段都相同），则可以按如下方式删除重复项：\n\
  \n1.  在表格的弹出菜单中（位于表格网格的左上角）单击 `删除重复项`。所有重复记录均被删除，并且“删除的重复项”会添加到“应用的步骤”列表中。\n\n>\
  \ **注意**  \n> 我必须强调，此方法只会删除*完全*相同的记录，即重复行中每一列的每个元素都严格相同。如果两条记录仅有一个字符或数字不同，但其他所有内容都相同，那么\
  \ Power BI Desktop 查询编辑器*不会*将其视为重复项。或者，如果你想隔离并检查重复记录，则可以通过从表格的弹出菜单中选择 `保留重复项` 来仅显示完全相同的记录。\n\
  \n那么，如果你怀疑或确信正在处理的数据表包含重复项，有哪些实用的解决方案？这可能是一个真正的难题，但有一些基本的技术可以应用：\n\n-   删除所有你确定在后续数据处理过程中不会使用的列。这样，Power\
  \ BI Desktop 只需比较潜在重复记录中的关键数据。\n-   按核心列对数据进行分组（本章后面会解释）。\n\n> **注意**  \n> 如你所见，Power\
  \ BI Desktop 查询只需几次点击就能帮助你聚焦数据集中的关键元素。但需要注意的是，在从查询中排除数据时，务必小心*不要移除*有价值的数据——从而歪曲你的分析结果。\n\
  \n\n\n## 排序数据\n\n尽管严格来说并不属于数据修改步骤，但在某些阶段对导入的表进行排序可能会是你想要做的操作，哪怕只是为了更清晰地了解正在处理的数据。请按以下步骤对数据进行排序：\n\
  \n1. 关闭 `CH07Example1.pbix` 文件（如果你确实一直在用该文件测试本章目前介绍的技术，请关闭），*不要*保存。\n2. 打开 `C:\\\
  PowerBiDesktopSamples\\Example1.pbix` 文件。请注意，你打开的是一个已有的 Power BI Desktop 文件，而*不是*在加载数据。\n\
  3. 单击 `转换数据` 以打开查询编辑器。\n4. 在你希望作为排序依据的列内部单击。\n5. 在“开始”功能区中单击 `升序排序`（`A/Z` 图标）或 `降序排序`（`Z/A`\
  \ 图标）。\n\n数据将按字母顺序（从小到大）或反向字母顺序（从大到小）进行排序。如果你想执行复杂的排序操作（例如，先按某一列排序，如果该列在多行中存在相同元素，再按另一列排序），只需依次对各列进行排序即可。Power\
  \ BI Desktop 查询编辑器会在列标题右侧添加微小的 `1`、`2`、`3` 等数字，以指示排序顺序。你可以在图 7-16 中看到这一点，我*首先*按\
  \ `Make` 列排序，*最后*按 `Model` 列排序。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig16_HTML.jpg](img/370912_3_En_7_Fig16_HTML.jpg)\n\
  \n*图 7-16 – 对多列进行排序*\n\n由于数据排序被视为数据修改过程的一部分，因此它也会以 `已排序行` 的形式出现在 `应用的步骤` 列表中。如果你仔细观察列标题，你会看到小的“1”和“2”，它们指示排序优先级，以及指示列按升序排序的箭头。\n\
  \n> **注意：** 另一种排序数据的替代技术是单击列的弹出菜单（列标题右侧向下的三角形），然后从弹出菜单中选择 `升序排序` 或 `降序排序`。\n\n####\
  \ 反转行顺序\n\n如果你发现正在查看的数据看起来上下颠倒（即底部行在顶部，反之亦然），你可以单击一下即可反转行顺序（如果你愿意的话）。为此，请执行以下操作：\n\
  \n在“转换”功能区中，单击 `反转行` 按钮。\n\n整个数据集将被反转，原来的底部行现在将成为顶部行。\n\n#### 撤消排序操作\n\n如果你随后决定不想保留已排序的数据，你可以随时撤消排序操作，具体操作如下：\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig17_HTML.jpg](img/370912_3_En_7_Fig17_HTML.jpg)\n\
  \n*图 7-17 – 移除排序操作*\n\n1. 单击你用作排序依据的列名称右侧的排序图标。将出现上下文菜单，如图 7-17 所示。\n2. 单击 `清除排序`。\n\
  \n你应用过的排序顺序将被移除，数据将恢复为其原始行顺序。\n\n> **注意：** 如果你对数据集的多列进行了排序，你可以选择通过单击你*最先*用于排序数据的列来移除你应用的全部排序顺序。这将移除你应用于定义排序条件所用的*所有*列的排序顺序。如果你只是想撤消用于对记录集排序的一组列中最后一列的排序，那么你可以仅清除对该列的排序操作。\n\
  \n## 筛选数据\n\n根据我的经验，限制数据集最常用的方法是对已加载的表使用筛选器。现在，我意识到你可能在使用 Excel 多年之后，或者在使用 Power\
  \ Pivot 一段时间之后，才开始接触 Power BI Desktop，并且你即将看到的筛选技术很可能与你在这两种工具中使用过的技术非常相似。然而，由于在加载源数据时包含和排除适当记录至关重要，我宁愿详细解释\
  \ Power Query 筛选器，即使这意味着某些读者会产生强烈的似曾相识感。\n\n以下是 Power BI Desktop 中筛选数据的两种基本方法：\n\
  \n* 从所选列的独特元素列表中选择一个或多个特定值。\n* 定义要包含或排除的数据范围。\n\n第一种选项适用于所有数据类型，无论是文本、数字还是日期/时间。第二种方法则根据你用于筛选数据的列的数据类型而变化。\n\
  \n#### 选择特定值\n\n选择数据列中存在的一个或多个值非常简单，操作如下（假设你仍在使用 Power BI Desktop 文件 `Example1.pbix`\
  \ 并且处于查询编辑器中）：\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig18_HTML.jpg](img/370912_3_En_7_Fig18_HTML.jpg)\n\
  \n*图 7-18 – 一个筛选菜单*\n\n1. 单击列的弹出菜单。（在此示例中，我使用了示例数据集中的 `Make` 列。）将出现筛选菜单。\n2. 勾选所有你希望保留的元素，并取消勾选所有你希望排除的元素。在此示例中，我保留了\
  \ `Bentley` 和 `Rolls Royce`，如图 7-18 所示。\n3. 单击 `确定`。`应用的步骤` 列表中将添加 `已筛选行`。\n\n>\
  \ **注意：** 你可以通过单击 `(全选)` 复选框来取消选择所有项目；再次选中此框可重新选择所有项目。因此，如果你只想保留少数几个元素，先取消选择所有元素，然后仅选择你希望保留的元素可能会更快。如果你想排除任何在你筛选的列中没有值的记录，请从筛选菜单中选择\
  \ `移除空值`。\n\n#### 在筛选列表中查找元素\n\n在筛选列表中上下滚动可能会变得极其繁琐。将列表快速限制为可用元素的子集的一种方法是执行以下操作：\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig19_HTML.jpg](img/370912_3_En_7_Fig19_HTML.jpg)\n\
  \n*图 7-19 – 搜索筛选菜单*\n\n1. 单击列的弹出菜单。（在此示例中，我使用了示例数据集中的 `Model` 列。）将出现筛选菜单。\n2. 在\
  \ `搜索` 框中输入一个字母或几个字母。列表会随着你输入的每个字母或数字而缩短。如果你输入 `ar`，则筛选弹出菜单将如图 7-19 所示。\n\n要移除筛选器，你只需单击\
  \ `搜索` 框右侧出现的叉号即可。\n\n#### 筛选文本范围\n\n如果某列包含文本，则你可以应用特定选项来筛选数据。这些选项位于任何基于文本的列的筛选弹出菜单中的\
  \ `文本筛选器` 子菜单中。选项见表 7-6。\n\n*表 7-6 – 文本筛选选项*\n\n| 筛选选项 | 描述 |\n| --- | --- |\n|\
  \ `等于` | 设置必须与单元格内容匹配的文本。 |\n| `不等于` | 设置*不*应与单元格内容匹配的文本。 |\n| `开头为` | 设置单元格内容左侧的文本。\
  \ |\n| `开头不是` | 设置*不*应出现在单元格内容左侧的文本。 |\n| `结尾为` | 设置单元格内容右侧的文本。 |\n| `结尾不是` | 设置*不*应出现在单元格内容右侧的文本。\
  \ |\n| `包含` | 允许你输入将成为单元格内容一部分的文本。 |\n| `不包含` | 允许你输入*不*会成为单元格内容一部分的文本。 |\n\n\n\n\
  #### 筛选数值范围\n\n如果列中包含数字，则还可以应用特定的筛选选项来过滤数据。你可以在任何基于文本的列的筛选弹出菜单中的 `Number Filters`\
  \ 子菜单中找到这些选项。具体选择见表 7-7。\n\n**表 7-7**  \n数值筛选选项\n\n| 筛选选项 | 描述 |\n| --- | --- |\n\
  | `Equals` | 设置必须与单元格内容匹配的数字。 |\n| `Does Not Equal` | 设置不得与单元格内容匹配的数字。 |\n| `Greater\
  \ Than` | 单元格内容必须大于此数字。 |\n| `Greater Than Or Equal To` | 单元格内容必须大于或等于此数字。 |\n|\
  \ `Lesser Than` | 单元格内容必须小于此数字。 |\n| `Lesser Than Or Equal To` | 单元格内容必须小于或等于此数字。\
  \ |\n| `Between` | 单元格内容必须介于您指定的两个数字之间。 |\n\n#### 筛选日期和时间范围\n\n如果列中包含日期或时间（或两者均有），则同样可以应用特定的筛选选项来过滤数据。你可以在任何基于文本的列的筛选弹出菜单中的\
  \ `Date/Time Filters` 子菜单中找到这些元素。具体选择见表 7-8。\n\n**表 7-8**  \n日期和时间筛选选项\n\n| 筛选元素\
  \ | 描述 |\n| --- | --- |\n| `Equals` | 筛选数据，仅包含所选日期的记录。 |\n| `Before` | 筛选数据，仅包含截至所选日期的记录。\
  \ |\n| `After` | 筛选数据，仅包含所选日期之后的记录。 |\n| `Between` | 允许您设置一个上限和一个下限日期，以排除该范围之外的记录。\
  \ |\n| `In the Next` | 允许您指定未来的天数、周数、月数、季度数或年数。 |\n| `In the Previous` | 允许您指定截至当前日期为止的天数、周数、月数、季度数或年数。\
  \ |\n| `Is Earliest` | 筛选数据，仅包含最早日期的记录。 |\n| `Is Latest` | 筛选数据，仅包含最晚日期的记录。 |\n\
  | `Is Not Earliest` | 筛选数据，仅包含不包含最早日期的记录。 |\n| `Is Not Latest` | 筛选数据，仅包含不包含最晚日期的记录。\
  \ |\n| `Day ➤ Tomorrow` | 筛选数据，仅包含当前系统日期后一天的记录。 |\n| `Day ➤ Today` | 筛选数据，仅包含当前系统日期的记录。\
  \ |\n| `Day ➤ Yesterday` | 筛选数据，仅包含当前系统日期前一天的记录。 |\n| `Week ➤ Next Week` | 筛选数据，仅包含下一个日历周的记录。\
  \ |\n| `Week ➤ This Week` | 筛选数据，仅包含当前日历周的记录。 |\n| `Week ➤ Last Week` | 筛选数据，仅包含上一个日历周的记录。\
  \ |\n| `Month ➤ Next Month` | 筛选数据，仅包含下一个日历月的记录。 |\n| `Month ➤ This Month` | 筛选数据，仅包含当前日历月的记录。\
  \ |\n| `Month ➤ Last Month` | 筛选数据，仅包含上一个日历月的记录。 |\n| `Month ➤ Month Name` | 筛选数据，仅包含指定日历月的记录。\
  \ |\n| `Quarter ➤ Next Quarter` | 筛选数据，仅包含下一个季度的记录。 |\n| `Quarter ➤ This Quarter`\
  \ | 筛选数据，仅包含当前季度的记录。 |\n| `Quarter ➤ Last Quarter` | 筛选数据，仅包含上一个季度的记录。 |\n| `Quarter\
  \ ➤ Quarter Name` | 筛选数据，仅包含指定季度的记录。 |\n| `Year ➤ Next Year` | 筛选数据，仅包含下一年的记录。 |\n\
  | `Year ➤ This Year` | 筛选数据，仅包含今年的记录。 |\n| `Year ➤ Last Year` | 筛选数据，仅包含上一年的记录。\
  \ |\n| `Year ➤ Year To Date` | 筛选数据，仅包含年初至今日历年的记录。 |\n| `Custom Filter` | 允许您为所选日期范围设置特定筛选。\
  \ |\n\n## 筛选数据\n\n无论应用何种类型的筛选，筛选数据的方法都非常相似。举一个简单的例子，以下是如何对售价应用数字筛选，以查找售价低于 £5,000.00\
  \ 的车辆：\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig20_HTML.jpg](img/370912_3_En_7_Fig20_HTML.jpg)\n\
  \n**图 7-20**  \n“筛选行”对话框\n\n1.  单击 `SalePrice` 列的弹出菜单。\n2.  单击 `Number Filters`。将显示子菜单。\n\
  3.  选择 `Less Than`。将显示“筛选行”对话框。\n4.  在 `is less than` 框旁边的框中输入 `5000`，如图 7-20 所示。\n\
  5.  单击 `OK`。数据集将仅显示符合您所定义筛选的行。\n\n尽管应用起来非常简单，但筛选仍需要注意以下几点：\n\n-   您可以在基本筛选器中组合最多两个元素。它们可以是互斥的（`AND`\
  \ 筛选），也可以是替代的（`OR` 筛选）。\n-   您可以在高级筛选器中组合多个元素——您将在下一节中学习。\n-   输入数字时，*不应*应用任何格式。\n\
  -   您筛选的任何文本都不区分大小写。\n-   如果选择了错误的筛选器，不必取消并重新开始。只需从“筛选行”对话框中左侧框的弹出菜单中选择正确的筛选类型即可。\n\
  \n**提示**\n\n如果设置的筛选值排除了表中的所有记录，Power BI Desktop 将显示一个空表，仅显示“此表为空。”字样。您始终可以通过单击 `Applied\
  \ Steps` 列表中 `Filtered Rows` 左侧的叉号来移除筛选。这将移除该步骤并将数据恢复至之前的状态。\n\n\n\n#### 应用高级筛选器\n\
  \n当您需要对数据进行极其精确的筛选时，可以随时使用 Power BI Desktop 的高级筛选器。这些筛选器可以扩展筛选元素，使您能够以很高的详细程度包含或排除记录。具体步骤如下：\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig21_HTML.jpg](img/370912_3_En_7_Fig21_HTML.jpg)\n\
  \n**图 7-21** 高级筛选器\n\n1. 单击 `SalePrice` 列的弹出菜单。\n2. 单击 `数字筛选器`。将显示子菜单。\n3. 选择 `等于`。将显示\
  \ `筛选行` 对话框。\n4. 单击 `高级`。\n5. 在对话框中，为第一个筛选元素输入 `5000` 作为值。\n6. 从弹出菜单中选择 `或` 作为第二个筛选元素的筛选类型。\n\
  7. 选择 `等于` 作为运算符。\n8. 在对话框中，为第二个筛选器输入 `89000` 作为值。\n9. 单击 `添加子句`。一个新的筛选元素将添加到对话框中现有元素的下方。\n\
  10. 选择 `等于` 作为运算符。\n11. 在对话框中，为第三个筛选元素输入 `178500` 作为值。`筛选器` 对话框将如图 7-21 所示。\n12.\
  \ 单击 `确定`。只有包含您在 `筛选器` 对话框中输入数值的记录才会显示在 Power BI Desktop 查询编辑器中。\n\n我想就筛选器主题发表几点评论作为结束：\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig22_HTML.jpg](img/370912_3_En_7_Fig22_HTML.jpg)\n\
  \n**图 7-22** 排序筛选器\n\n- 在 `高级筛选器` 对话框中，您可以“混合搭配”列和运算符，以达到您想要的筛选结果。\n- 如果需要，您还可以对筛选器的顺序进行排序。为此，只需单击某一筛选行内部，该行会以灰色背景显示（如图\
  \ 7-21 中的第三个筛选器）。然后，单击该筛选行右侧的省略号，并从弹出菜单中选择 `上移` 或 `下移`。您可以在图 7-22 中看到这一操作。\n- 若要删除一个筛选器，请单击该筛选行右侧的省略号，然后选择\
  \ `删除`。\n\n**注意**：当处理非常大的数据集时，您可能会发现筛选器并非总能显示源数据中的所有可用值。这是因为 Power BI 查询编辑器只加载了数据的一个子样本。在这种情况下，您会在筛选器弹出菜单中看到一个警报和一个“加载更多”链接。单击此链接将强制\
  \ Power BI 重新加载一个更大的数据样本集。但是，内存限制可能会阻止它加载您需要的所有数据。在这种情况下，您应考虑修改源查询（如果可能），使其返回一个能够装入内存的代表性数据集。\n\
  \n### 分组记录\n\n有时，您需要以极端的方式转换原始数据——即对数据进行分组。这与筛选数据、删除重复项或清理列内容截然不同。当您对数据进行分组时，您正在更改数据集的结构以“汇总”记录，操作如下：\n\
  \n- 定义将成为分组数据表中唯一元素的属性列。\n- 指定对分组表中包含的任何数字列应用的聚合。\n\n分组通常是一种极具选择性的操作。这不可避免，因为您选择用于分组的属性（即非数字）列越少，分组表中可能包含的记录就越少。然而，这始终取决于您正在处理的特定数据集，高效地分组数据通常需要技巧、实践以及老式的反复试验。\n\
  \n#### 简单分组\n\n为了理解分组的工作原理——以及它如何从根本上改变数据集的结构——让我们来看一个行分组的简单示例：\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig23_HTML.jpg](img/370912_3_En_7_Fig23_HTML.jpg)\n\
  \n**图 7-23** 简单分组\n\n1. 在示例文件 `CH07Example1.pbix`（位于查询编辑器中）中，单击 `Make` 列内部。\n2.\
  \ 在 `开始` 功能选项卡或 `转换` 功能选项卡中，单击 `分组依据` 按钮。`分组依据` 对话框将出现，如图 7-23 所示。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig24_HTML.jpg](img/370912_3_En_7_Fig24_HTML.jpg)\n\
  \n**图 7-24** 简单分组输出\n\n3. 单击 `确定`。数据集现在将只包含车辆品牌列表以及每个品牌对应的记录数量。您可以在图 7-24 中看到这一点。\n\
  \n当您将分组应用于数据集时，Power BI Desktop 会向 `应用的步骤` 列表添加一个名为 `已分组行` 的步骤。\n\n**注意**：取消分组操作的最佳方法是在\
  \ `应用的步骤` 列表中删除 `已分组行` 步骤。\n\n尽管 Power BI Desktop 默认对行进行计数，但在分组数据时还可以应用其他几种操作。这些操作在表\
  \ 7-9 中进行了概述。\n\n**表 7-9** 分组时的聚合操作\n\n| 聚合操作 | 描述 |\n| --- | --- |\n| `对行进行计数`\
  \ | 计算记录的数量。 |\n| `对非重复行进行计数` | 计算唯一记录的数量。 |\n| `求和` | 返回数字列的总和。 |\n| `平均值` | 返回数字列的平均值。\
  \ |\n| `中位数` | 返回数字列的中位数。 |\n| `最小值` | 返回数字列的最小值。 |\n| `最大值` | 返回数字列的最大值。 |\n| `所有行`\
  \ | 为每个分组元素创建一个记录表。 |\n\n\n#### 复杂分组\n\nPower BI Desktop 可以通过创建更复杂的**数据分组**，以更高级的方式帮助你塑造数据集。例如，你可以尝试以下操作，按\"\
  制造商\"和\"型号\"进行分组，并添加显示总销售额和平均成本的列：\n\n1. 打开示例文件 `C:\\PowerBiDesktopSamples\\Example1.pbix`。\n\
  2. 点击 `转换数据` 打开查询编辑器。\n3. 选择以下列（通过按住 `Ctrl` 键并点击列标题）：\n   1. `Make`（制造商）\n   2.\
  \ `Model`（型号）\n4. 在\"开始\"功能区或\"转换\"功能区中，点击 `分组依据`。\n5. 在 `新列名称` 框中，输入 `TotalSales`（总销售额）。\n\
  6. 选择 `求和` 作为操作。\n7. 在 `列` 弹出列表中，选择 `SalePrice`（销售价格）作为源列。\n8. 点击 `添加聚合` 按钮并重复操作，只是这次使用以下设置：\n\
  \   - *新列名称*：`AverageCost`（平均成本）\n   - *操作*：`平均值`\n   - *列*：`CostPrice`（成本价格）\n\n\
  `分组依据` 对话框应如图 7-25 所示。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig25_HTML.jpg](img/370912_3_En_7_Fig25_HTML.jpg)\n\
  \n图 7-25：分组依据对话框\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig26_HTML.jpg](img/370912_3_En_7_Fig26_HTML.jpg)\n\
  \n图 7-26：分组数据集\n\n1. 点击 `确定`。除了在 `分组依据` 对话框中指定的列之外，所有其他列都将被移除，表格将按图 7-26 所示进行分组和聚合。`分组行`\
  \ 将被添加到 `应用步骤` 列表中。我还按照 `制造商` 和 `型号` 列对表格进行了排序，以便更容易理解分组。\n\n如果你创建了一个非常复杂的分组，然后发现需要更改列的顺序，也并非无能为力。你可以通过点击\
  \ `分组依据` 对话框中每个列定义右侧的省略号，并选择 `上移` 或 `下移`，来更改输出结果中列的顺序。`分组依据` 对话框中列的顺序，将是结果数据集中列的顺序（从左到右）。\n\
  \n**注意**：你不必按住 `Ctrl` 键来选择分组列。你可以通过点击 `添加聚合` 按钮，将列逐一添加到 `分组依据` 对话框中。同样，你也可以通过点击列名右侧的省略号并从弹出菜单中选择\
  \ `删除`，来移除分组列（或已添加和聚合的列）。\n\n### 在查询编辑器中保存更改\n\n正如你所期望的那样，你可以随时保存在使用 Power BI Desktop\
  \ 查询编辑器时所做的任何更改。但是，你需要知道，当你点击功能区上方的 `保存` 图标（或点击 `文件 ➤ 保存`）时，将出现一个对话框，你可以在图 7-27\
  \ 中看到该选择。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig27_HTML.jpg](img/370912_3_En_7_Fig27_HTML.jpg)\n\
  \n图 7-27：在查询编辑器中保存前应用待处理更改\n\n此时，你需要决定是仅保存使用查询编辑器完成的工作，还是不仅要保存工作，还要用你已执行的数据转换所产生的最新版本数据来更新数据模型中的数据。\n\
  \n因此，你必须在以下两者之间进行选择：\n\n- *立即应用*：应用更改并将数据加载到数据模型中。\n- *稍后应用*：保存你的修改，但保持数据原样——并可能在以后更新数据。\n\
  \n### 退出查询编辑器\n\n与刚刚描述的 `保存` 选项类似，你可以选择如何退出查询编辑器并返回 Power BI Desktop 中的报表和仪表板。默认选项（当你点击\
  \ `关闭并应用` 按钮时）是应用你对数据所做的所有更改，用新数据更新数据模型，然后返回 Power BI Desktop。\n\n然而，你还有两个可能会有用的其他选项。这些选项出现在\
  \ `关闭并应用` 按钮的菜单中：\n\n- *应用*：应用你对数据模型所做的更改。这可能涉及对 `字段` 列表中的字段进行更改。\n- *关闭*：关闭查询编辑器，但不应用任何更改。\n\
  \n如果你选择不应用你所做的更改，那么你将看到图 7-28 中显示的通知。在某个时候，你必须通过点击报表画布上方通知中的 `应用更改` 按钮来更新数据模型，以确保你使用正确的数据来生成报表。\n\
  \n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig28_HTML.jpg](img/370912_3_En_7_Fig28_HTML.jpg)\n\
  \n图 7-28：待处理更改通知\n\n## 结论\n\n本章带你踏上了使用 Power BI Desktop 转换数据集的道路。你了解了如何通过删除行和列来精简数据集。你还学习了如何通过选择交替的行组来从数据源中抽取数据子集。\n\
  \n此外，你还了解了如何选择要在报表中使用的列，如何在数据集中移动列，以及如何重命名列，以便以后在仪表板和报表中使用时数据易于理解。然后，你学习了如何筛选和排序数据，以及如何删除重复项，以确保你的数据集只包含即将实现的可视化所需的精确行。最后，你学习了如何分组和聚合数据。\n\
  \n然而，必须承认，准备用于仪表板和报表的原始数据并不总是那么容易，并且可能需要一段时间才能做好。但是，Power BI Desktop 查询功能经过一点练习，就可以使这项任务变得非常简单。所以，既然你已经掌握了基础知识，是时候继续前进，探索更多的数据转换技术了。具体来说，你将了解如何转换并可能清理已导入的数据。这是下一章的主题。\n\
  \n\n"
- "# 8. 数据转换与清洗\n\n当数据集经过塑形和筛选（如上一章所述）后，通常仍需要一些修改才能投入实际使用。从本质上讲，这些修改大多是简单但必要的技术，用于使数据更清洁、更标准化。我选择将这些方法归入*数据转换与清洗*这一主题之下。\n\
  \n在最终将源数据加载到数据模型之前，您可能希望执行的操作通常涵盖一系列*最终确定*数据的过程，以便数据在模型中可用。这些操作可能包括：\n\n*   更改列的数据类型——例如，告知\
  \ Power BI Desktop 某列包含数字。\n*   确保将第一行用作标题（如果需要）。\n*   删除列内容的一部分。\n*   将单元格中的值替换为其他值。\n\
  *   转换列内容——例如，将文本转换为大写，或去除数字中的小数。\n*   对空单元格执行向下或向上填充，以确保记录完整。\n*   对数字列应用数学或统计（甚至三角函数）函数。\n\
  *   将日期或时间数据转换为日期元素，如天、月、季度、年、小时或分钟。\n\n转换数据并不仅限于减少数据。有时您可能需要对数据进行*扩展*以使其可用。这通常意味着向数据表添加更多列。实现此目的的技术包括：\n\
  \n*   复制列并可能更改复制列中数据的格式。\n*   将列中的部分数据提取到新列中。\n*   将列中的所有数据拆分，使每个数据元素出现在单独的列中。\n\
  *   将多列合并成一个新列。\n*   添加自定义列，这些列可能包含计算、提取列的部分数据到新列，甚至拼接多列内容。\n*   添加“索引”列以确保唯一性或记住排序顺序。\n\
  \n本章将带您领略这些基本的数据转换技术。读完本章后，您将能够以粗糙的现成数据源为起点，将其转换为一个精致且连贯的数据表，使其成为 Power BI Desktop\
  \ 数据模型中的关键部分。不仅如此，您还将比使用企业级工具更快、更轻松地完成繁重的工作。\n\n完成本章练习所需的示例数据位于文件夹 `C:\\PowerBiDesktopSamples`\
  \ 中。请注意，本章中的所有示例均假设您已打开查询编辑器。\n\n## 查看完整记录\n\n在开始清洗数据之前，您可能需要仔细查看数据。虽然 Power BI\
  \ Desktop 查询编辑器擅长上下滚动列以查看单个字段的数据比较情况，但要了解单条记录的完整内容通常不太容易。\n\n因此，为了避免在数据行之间疯狂左右滚动，查询编辑器提供了另一个极其简单的解决方案。如果您单击某一行（更具体地说，是左侧网格中该行的编号），Power\
  \ BI Desktop 查询编辑器将在数据集下方的单个窗口中显示整个记录的内容。您可以在图 8-1 中看到这样一个示例，该图使用的是 Power BI Desktop\
  \ 文件 `CH08Example1.pbix`。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig1_HTML.jpg](img/370912_3_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** 查看完整记录\n\n> **注**  \n> 您可以通过上下拖动上下窗口之间的灰色分隔线来调整记录集和数据集窗口的相对高度。\n\n##\
  \ Power BI Desktop 查询编辑器上下文菜单\n\n与 Windows 程序一样，Power BI Desktop 查询编辑器也充分利用上下文（或“右键单击”）菜单作为功能区的替代方案。在转换数据集时，您可能会发现自己主要使用三个上下文菜单：\n\
  \n*   *表菜单*：当您右键单击包含数据的网格的左上角时，会出现此菜单。\n*   *列菜单*：当您右键单击列标题时，会出现此菜单。\n*   *单元格菜单*：当您右键单击数据单元格时，会出现此菜单。\n\
  \n尽管我在解释如何转换数据时频繁提到了上下文菜单，但现在快速查看一下它们可能更容易，以便您了解各种选项。图 8-2 为您提供了这三个上下文菜单的快速概览。\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig2_HTML.jpg](img/370912_3_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** Power BI Desktop 查询编辑器上下文菜单\n\n由于上下文菜单中的可用选项将在本章、前一章以及后续四章中进行解释，因此此处不再一一详述。\n\
  \n> **注**  \n> 单元格上下文菜单中的筛选器选项会反映该单元格的数据类型。因此，数字单元格将显示“数字筛选器”选项。\n\n## 将第一行用作标题\n\
  \nPower BI Desktop 非常擅长猜测是否应将源数据集的第一条记录用作列标题。这一点至关重要，原因有二：\n\n*   您可以避免列名被命名为 `Column1`、`Column2`\
  \ 等。这样泛泛地命名会使用户（甚至您自己）不必要地难以理解数据。\n*   您可以避免在数字列中出现本应是列标题的文本元素，否则可能稍后引发问题。这是因为整个列必须具有相同的数据类型才能应用另一种数据类型。例如，第一行中有标题文本会阻止对数字和日期/时间数据类型进行此操作。原因可能是标题是文本，而该列的其余部分包含数字或日期。\n\
  \n然而，尽管罕见，但仍有可能出现 Power BI Desktop 猜测错误的情况，即它假定数据集中的第一条记录是数据，而实际上它是标题信息。因此，您会看到一组泛型列标题，如\
  \ `Column1`、`Column2` 等。幸运的是，纠正此错误并将第一行用作标题是一项简单的任务：\n\n*   在 Power BI Desktop 查询窗口的“转换”功能区中，单击“将第一行用作标题”。\n\
  \n几秒钟后，第一条记录消失，列标题变为原来第一条记录中的元素。右侧的“应用的步骤”列表中现在包含一个“提升的标题”元素，指示已执行的操作。此步骤会被高亮显示。\n\
  \n> **注**  \n> 当源是数据库时，Power BI Desktop 通常能够自动应用此步骤。当源是文件时，它通常也能正确猜测。然而，它并不总能准确猜测，因此有时需要您手动干预。如果\
  \ Power BI Desktop 在“应用的步骤”列表中新增了“提升的标题”步骤，您就能看出它是否进行了猜测。\n\n在极少数情况下，如果 Power BI\
  \ Desktop 操作错误，将非标题行的第一行误认为是列标题，您可以通过单击“将第一行用作标题”按钮右侧的小三角形来重置标题，使其成为第一行。这将显示一个简短菜单，您可以在其中单击“将标题用作第一行”选项。右侧的“应用的步骤”列表中现在包含一个“降级的标题”元素，列标题变为\
  \ `Column1`、`Column2` 等。随后，您可以根据需要重命名这些列。\n\n\n\n## 更改数据类型\n\n数据修改中一个真正基础的方面是确保数据具有正确的类型；也就是说，如果你有一列数字需要在某个时候进行计算，那么该列应该是数字列。如果它包含日期，则应将其设置为日期或时间数据类型之一。我意识到这看起来可能很繁琐，甚至多余；然而，如果你希望确保数据能在后续流程中被正确地细分和处理，那么从一开始就设置正确的数据类型就*至关重要*。另一个好处是，如果你在加载数据的过程中尽早验证数据类型，你就可以从一开始就发现数据是否存在潜在问题——例如，无法被识别为日期的日期。这让你能在处理数据集的工作早期就决定如何处理劣质或不可靠的数据。\n\
  \n好消息是，对于许多数据源，Power BI Desktop 会自动应用适当的数据类型。具体来说，如果你从数据库加载了数据，那么 Power BI Desktop\
  \ 会识别每一列的数据类型并应用合适的原生数据类型。不幸的是，对于文件源，特别是 CSV、文本和（偶尔）Excel 文件，以及一些 XML 文件，情况可能会稍微棘手一些。对于这些文件类型，Power\
  \ BI Desktop 通常会尝试猜测数据类型，但有时它并不能成功。如果它已经尝试推断数据类型，你会在“应用的步骤”列表中看到一个`Changed Type`步骤。因此，如果你从这些源获取数据，很可能需要手动为许多列应用数据类型。\n\
  \n> **注意**  \n> 在某些情况下，数字并不应该被解释为数值数据。例如，法国邮政编码是五位数字，但它永远不会以任何方式进行计算。因此，最好在数值数据类型不合适的情况下，通过将数据类型更改为文本，让\
  \ Power BI Desktop 知道这一点。\n\n请执行以下操作来更改一列或一组列的数据类型：\n\n1. 打开 Power BI Desktop 示例文件\
  \ `C:\\PowerBiDesktopSamples\\CH08Example1.pbix`。\n2. 在 **开始** 功能区中单击 **转换数据** 按钮。查询编辑器将打开。\n\
  3. 单击你要更改数据类型的列内部。如果你想修改多个列，则按住 `Ctrl` 键并单击所需的列标题。在本例中，你可以选择 `CostPrice` 和 `TotalDiscount`\
  \ 列。\n4. 在 **转换** 功能区中单击 **数据类型** 按钮。将会出现一个包含可能数据类型的弹出菜单。\n5. 选择适当的数据类型。如果你选择了 `CostPrice`\
  \ 和 `TotalDiscount` 列，那么 **整数** 是要选择的类型。\n\n几秒钟后，数据类型将被应用。`Changed Type` 将出现在 `应用的步骤`\
  \ 列表中。你可以应用的数据类型在表 8-1 中概述。\n\n**表 8-1** Power BI Desktop 中的数据类型\n\n| 数据类型 | 说明\
  \ |\n| --- | --- |\n| 小数 | 将数据转换为十进制数。 |\n| 固定小数位数 | 将数据转换为具有固定小数位数的十进制数。 |\n| 整数\
  \ | 将数据转换为整（整）数。 |\n| 日期/时间 | 转换为日期和时间数据类型。 |\n| 日期 | 转换为日期数据类型。 |\n| 时间 | 转换为时间数据类型。\
  \ |\n| 持续时间 | 将数据设置为持续时间。这些用于日期和时间计算。 |\n| 文本 | 设置为文本数据类型。 |\n| 真/假 | 将数据类型设置为布尔值（真或假）。\
  \ |\n| 二进制 | 将数据定义为二进制，因此，它不直接可见。 |\n\n> **注意**  \n> **数据类型** 按钮在 **开始** 功能区中也可用。同样，你可以右键单击列标题并选择\
  \ **更改类型** 来选择不同的数据类型。\n\n不可避免地，有时你会尝试应用一个根本无法用于特定列的数据类型。将文本列（例如此示例数据表中的 `Make`）转换为日期是行不通的。如果你这样做，Power\
  \ BI Desktop 查询编辑器会将列内容替换为 `Error`。这并不是决定性的或危险的，你只需使用前一章中描述的技术删除 `应用的步骤` 列表中的 `Changed\
  \ Type` 步骤，即可将数据恢复到之前的状态。\n\n有时，你可能会在数据类型已经被更改后尝试更改它。在这种情况下，你将收到一个类似于图 8-3 所示的警报。\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig3_HTML.jpg](img/370912_3_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3** 更改列类型警报\n\n如果发生这种情况，你可以执行以下两种操作之一：\n\n- 让 Power BI Desktop 使用你刚刚选择的数据类型更新现有的转换步骤。\n\
  - 添加一个新的转换步骤。\n\n你的选择将完全取决于你对底层数据集应用了哪种类型的转换。\n\n同时更改一组你*认为*需要进行此操作的列的数据类型会有所帮助。采用这种方法有几个很好的理由：\n\
  \n- 你可以集中精力正确地设置数据类型，如果你有条理地工作，你就不太可能忘记设置数据类型。\n- 为许多列应用数据类型（即使你分几次操作，针对单列或多列）只会向\
  \ `应用的步骤` 列表添加一个步骤。\n\n> **注意**  \n> 不要在 Power BI Desktop 查询中寻找任何数据*格式化*选项；这里没有。这是有意为之，因为该工具旨在结构化、加载和清理数据，而不是呈现数据。你将在\
  \ Power BI Desktop 数据视图中执行格式化操作，正如你将在第 13 章中看到的那样。\n\n### 检测数据类型\n\n为数十列应用正确的数据类型可能会非常耗时。幸运的是，Power\
  \ BI Desktop 现在包含一个自动为整个表应用数据类型的选项：\n\n1. 在 **转换** 功能区中，单击 **检测数据类型** 按钮。\n2. `Changed\
  \ Type` 将出现在 `应用的步骤` 列表中。大多数列将应用正确的数据类型。\n\n这种技术并不总是能给出完美的结果，有时你会想要覆盖 Power BI Desktop\
  \ 已应用的数据类型选择。然而，它仍然是数据准备工具集中一个受欢迎的补充，在准备数据集时可以为你节省大量时间。\n\n\n### 数据类型指示器\n\n若是靠猜测来判断每个列属于哪种数据类型，那将毫无效率可言。因此，Power\
  \ BI Desktop 会通过直观的方式为你指明每个列对应的数据类型。如果你仔细查看每个列标题的左侧，会看到一个微小的图标。每个图标都指明了该列的数据类型。每个图标的含义如表\
  \ 8-2 所示。\n\n**表 8-2** Power BI Desktop 查询编辑器中的数据类型图标\n\n| 数据类型图标 | 描述 |\n| ---\
  \ | --- |\n| ![../images/370912_3_En_8_Chapter/370912_3_En_8_Figa_HTML.jpg](img/370912_3_En_8_Figa_HTML.jpg)\
  \ | 可能的数据类型中的任意一种 |\n| ![../images/370912_3_En_8_Chapter/370912_3_En_8_Figb_HTML.jpg](img/370912_3_En_8_Figb_HTML.jpg)\
  \ | 整数 |\n| ![../images/370912_3_En_8_Chapter/370912_3_En_8_Figc_HTML.jpg](img/370912_3_En_8_Figc_HTML.jpg)\
  \ | 小数 |\n| ![../images/370912_3_En_8_Chapter/370912_3_En_8_Figd_HTML.jpg](img/370912_3_En_8_Figd_HTML.jpg)\
  \ | 定点小数 |\n| ![../images/370912_3_En_8_Chapter/370912_3_En_8_Fige_HTML.jpg](img/370912_3_En_8_Fige_HTML.jpg)\
  \ | 百分比 |\n| ![../images/370912_3_En_8_Chapter/370912_3_En_8_Figf_HTML.jpg](img/370912_3_En_8_Figf_HTML.jpg)\
