  \ Server 数据库对话框。\n3. 在“`服务器`”文本框中输入描述服务器的完整字符串。该字符串要么由企业 DBA 提供给你，要么，如果你使用的是自己的\
  \ Azure 账户，你可以在 Azure 管理门户中找到它。\n4. 输入数据库名称；如果你已将本书附带的示例数据加载到虚拟机中的 SQL Server 实例中，则该名称为\
