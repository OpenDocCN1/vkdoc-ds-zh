  \ |\n| `MailChimp` | 连接 `MailChimp`。 |\n\n以上仅为 `Power BI Desktop` 可连接的众多在线服务中的一部分。建议你查阅列表，确认所需服务当前是否可用。\n\
  \n> **注意：** 鉴于可用在线服务的数量正在加速增长，到本书出版时，你可能会发现此处列出的远不止这些。此外，目前还有许多仍处于测试版阶段的在线服务。这意味着你可以试用它们，但它们尚未最终定版并获得全面支持。\n\
  \n### Microsoft Azure\n\nAzure 是微软的云平台。`Power BI Desktop` 当前可连接、预览并从中加载数据的 Azure\
  \ 数据源，如表 5-2 所示。\n\n**表 5-2** Azure 数据源\n\n| 数据源 | 说明 |\n| --- | --- |\n| `Microsoft\
  \ Azure SQL database` | 允许连接到基于云的 Microsoft SQL Server 数据库，并从你有权访问的所有数据表和视图中导入记录。\
  \ |\n| `Microsoft Azure SQL Data Warehouse`（现已更名为 `Azure Synapse Analytics`） | 允许连接微软基于云、可弹性伸缩的企业级数据仓库。\
  \ |\n| `Azure Analysis Services database` | 连接 `Azure Analysis Services` 数据库。 |\n\
  | `Microsoft Azure Blob Storage` | 从基于云的非结构化数据存储中读取数据。 |\n| `Microsoft Azure Table\
  \ Storage` | 从 Microsoft Azure 表中读取数据。 |\n| `Microsoft Azure Cosmos DB`（原名 `DocumentDB`）\
  \ | 允许连接微软在 Azure 上托管的 NoSQL 数据库。 |\n| `Microsoft Azure Data Lake Storage`（Gen1\
  \ 和 Gen2） | 允许连接微软的原始数据云存储。 |\n| `Microsoft Azure HDInsight` | 在 Microsoft Azure\
  \ 环境中读取基于云的 Hadoop 文件。 |\n| `Azure HDInsight Spark` | 允许连接微软云中的并行处理框架。 |\n| `HDInsight\
  \ Interactive Query` | 在 `HDInsight` 上运行交互式查询。 |\n\n显然，随着 Azure 产品系列的扩展，微软正在为 `Power\
  \ BI Desktop` 添加更多的 Azure 连接选项。\n\n## 网页\n\n作为第一个极其简单的示例，我们来从一个网页中获取一些数据。由于我侧重于讲解方法而非数据本身，因此将使用一个与本书示例数据无关的网页。此处仅以此为例，简单介绍使用\
  \ `Power BI Desktop` 从网页加载数据的过程。\n\n假设你已经启动了 `Power BI Desktop` 并关闭了启动画面：\n\n![图\
  \ 5-1：获取数据菜单](img/370912_3_En_5_Fig1_HTML.jpg)\n\n1. 点击“开始”功能区中“获取数据”按钮底部的倒三角。\n\
  2. 从出现的菜单中选择 `Web`，如图 5-1 所示。\n\n![图 5-2：来自 Web 的对话框](img/370912_3_En_5_Fig2_HTML.jpg)\n\
  \n3. 输入以下 URL（这是一个针对 `Power BI Desktop` 的 Microsoft 帮助页面，包含几个数据表）：[`http://office.microsoft.com/en-gb/excel-help/guide-to-the-power-query-ribbon-HA103993930.aspx`](http://office.microsoft.com/en-gb/excel-help/guide-to-the-power-query-ribbon-HA103993930.aspx)。当然，我希望当你阅读本书时它仍然有效。如果你有一个想测试的\
  \ URL，也请随意尝试！对话框应类似图 5-2。\n\n![图 5-3：导航器对话框预览网页上某个表格的内容](img/370912_3_En_5_Fig3_HTML.jpg)\n\
  \n4. 点击 `OK`。`导航器`对话框将会出现。几秒钟后，当 `Power BI Desktop` 连接到网页时，将显示网页中可用数据表的列表。\n5. 点击\
  \ `导航器`对话框左侧的某个表名。该表的内容将显示在 `导航器`对话框的右侧，以展示所选表中的数据，如图 5-3 所示。\n6. 勾选 `导航器`对话框中的复选框（如图\
  \ 5-3 中表 4 左侧所示）。\n7. 点击窗口底部的 `加载`。\n\n> **提示：** 访问网页的另一种方法是点击 `获取数据` ➤ `其他`。然后你可以在\
  \ `获取数据` 对话框右侧的列表中选择 `Web`。\n\n这个简单的示例演示了如何从网页加载数据表并将其导入 `Power BI Desktop`。\n\n\
  \n\n#### 高级 Web 选项\n\n在前一个示例的步骤 3 中，你可以选择`高级`按钮。如果这样做，`来自 Web`对话框将会展开，允许你通过添加 URL\
  \ 部分来构建复杂的 URL。你可以在图 5-4 中看到一个示例。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig4_HTML.jpg](img/370912_3_En_5_Fig4_HTML.jpg)\n\
  \n图 5-4\n`来自 Web`对话框中的高级选项\n\n单击`添加部分`按钮允许你定义多个 URL 部分。\n\n如有必要，你还可以指定提交 URL 时将使用的\
  \ HTTP 请求标头参数。某些网页可能需要这些参数。关于这些参数的讨论超出了本书的范围。\n\n#### 表视图或 Web 视图\n\n查看网页包含的表格并不总是找到正确数据的最自然的方式。这是因为你正在脱离上下文查看数据表。我的意思是，你无法看到它们在网页上的位置。毕竟，Web\
  \ 是一种非常视觉化的媒介。\n\n为了帮助你找到网页上正确的数据表，`查询编辑器`允许你在 Web 源的两种视图之间切换：\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig5_HTML.jpg](img/370912_3_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5\n`导航器`对话框中的 Web 视图\n\n*   表视图（你在图 5-3 中看到过）\n*   Web 视图（你可以在图 5-5 中看到）\n\
  \n你可以通过单击`导航器`对话框顶部中央的`表视图`和`Web 视图`按钮来在这两种可视化网页的方式之间切换。当你切换到`Web 视图`时，你之前看到的同一个网页将如图\
  \ 5-5 所示。\n\n## Salesforce\n\nSalesforce 是软件即服务（SaaS）领域的先驱之一——现在，毋庸置疑，也是领导者之一。因此，`Power\
  \ BI Desktop`允许你连接到 Salesforce 并加载你有权限使用 Salesforce 账户查看的任何数据，这或许是不可避免的。\n\n事实上，Salesforce\
  \ 是一个如此广泛且完整的服务，因此你有两种可能的方法来访问你的数据：\n\n*   对象\n*   报告\n\n简而言之，Salesforce 对象是包含你想要访问的信息的底层数据表。Salesforce\
  \ 报告是从数据表中整理成更易访问的输出形式的数据。\n\n> **提示**\n> 如果你没有公司 Salesforce 账户，但仍然想了解如何使用`Power\
  \ BI Desktop`连接到 Salesforce 数据，你始终可以设置一个免费的 30 天试用账户。其网址是：[`www.salesforce.com/form/signup/freetrial-sales.jsp`](http://www.salesforce.com/form/signup/freetrial-sales.jsp)。\n\
  \n#### 从 Salesforce 对象加载数据\n\n那么，假设你有一个有效的 Salesforce 账户，以下是如何将数据从 Salesforce 对象加载到`Power\
  \ BI Desktop`中：\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig6_HTML.jpg](img/370912_3_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6\n用于联机服务的`获取数据`对话框\n\n1.  在`Power BI Desktop 主页`功能区中，单击`获取数据`按钮。\n2.  单击左侧的`联机服务`，然后在右侧选择`Salesforce\
  \ 对象`。`获取数据`对话框将如图 5-6 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig7_HTML.jpg](img/370912_3_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7\n`Salesforce 对象`对话框\n\n3.  单击`连接`。将出现`Salesforce 对象`对话框。它应该如图 5-7 所示。\n\n\
  ![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig8_HTML.jpg](img/370912_3_En_5_Fig8_HTML.jpg)\n\
  \n图 5-8\n`访问 Salesforce`登录对话框\n\n4.  选择`生产`按钮，然后单击`确定`。将出现`访问 Salesforce`登录对话框。它应该如图\
  \ 5-8 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig9_HTML.jpg](img/370912_3_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\nSalesforce 登录对话框\n\n5.  除非你已经登录，否则请单击`登录`。将出现 Salesforce 登录对话框。\n6.  输入你的\
  \ Salesforce 登录名和密码。该对话框应该类似于图 5-9 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig10_HTML.jpg](img/370912_3_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n`Salesforce 验证您的身份`对话框\n\n7.  如果这是你第一次从`Power BI Desktop`连接到 Salesforce（或者你已要求\
  \ Salesforce 在每次登录时都请求确认），系统将要求你验证身份。将出现`Salesforce 验证您的身份`对话框，如图 5-10 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig11_HTML.jpg](img/370912_3_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11\n`Salesforce 允许访问`对话框\n\n8.  单击`验证`。Salesforce 会将验证码发送到你用于登录 Salesforce\
  \ 的电子邮件账户。\n9.  在`验证码`字段中输入该代码，然后单击`确定`。你将看到`允许访问`对话框，如图 5-11 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig12_HTML.jpg](img/370912_3_En_5_Fig12_HTML.jpg)\n\
  \n图 5-12\n`访问 Salesforce`对话框\n\n10. 单击`允许`。你将返回到`访问 Salesforce`对话框，但现在你已登录。你可以在图\
  \ 5-12 中看到这一点。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig13_HTML.jpg](img/370912_3_En_5_Fig13_HTML.jpg)\n\
  \n图 5-13\n在导航器中查看的 Salesforce 对象\n\n11. 单击`连接`。将出现`导航器`，显示你有权访问的 Salesforce 对象。你可以在图\
  \ 5-13 中看到示例。\n12. 选择你想要将其数据加载到`Power BI Desktop`中的对象，然后单击`加载`。数据将被加载到`Power BI\
  \ Desktop`中，供你基于 Salesforce 数据创建仪表板和报告。\n\n> **提示**\n> 为了避免每次使用 Salesforce 数据创建一组新的`Power\
  \ BI Desktop`报告时都需要向 Salesforce 确认身份，你可以在 Salesforce 登录对话框中选中“记住我”，并在`Salesforce\
  \ 验证您的身份`对话框中选中“不再询问”。\n\nSalesforce 对象包含海量数据。然而，从`Power BI Desktop`的角度来看，这类似于访问数据库结构。这意味着你必须对底层数据的存储方式有一定的了解。如果你想了解\
  \ Salesforce 数据的结构方式，那么我建议你从目前位于 [`https://trailhead.salesforce.com/en/modules/data_modeling/units/objects_intro`](https://trailhead.salesforce.com/en/modules/data_modeling/units/objects_intro)\
  \ 的 Salesforce 文档开始学习。\n\n\n\n#### Salesforce 报表\n\n如果你发现自己被 Salesforce 中可用的海量数据所淹没，你可以直接访问标准\
  \ Salesforce 报表背后的数据。这将避免你去学习底层数据结构。缺点是，你无法轻松扩展这些数据集。\n\n要访问 Salesforce 报表数据，只需按照上一节概述的步骤操作即可。但是，在第\
  \ 2 步中，不要选择 `Salesforce Objects`，而是选择 `Salesforce Reports`。在这种情况下，`Navigator` 对话框将类似于图\
  \ 5-14 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig14_HTML.jpg](img/370912_3_En_5_Fig14_HTML.jpg)\n\
  \n图 5-14 — 显示 Salesforce Reports 数据的 `Navigator` 对话框\n\n在此处，你可以选择并加载来自 Salesforce\
  \ 的、你想用于创建自己仪表板的报表数据。\n\n## Microsoft Dynamics 365\n\n另一个包含大量宝贵企业数据的在线服务是 Microsoft\
  \ Dynamics 365。正如你所料，Power BI Desktop 可以轻松连接到诸如 Dynamics 之类的 Microsoft 在线源。操作步骤如下：\n\
  \n**提示：** 如果你没有公司 Microsoft Dynamics 365 在线账户，但仍想了解如何使用 Power BI Desktop 连接到 Microsoft\
  \ Dynamics 365 数据，你始终可以设置一个免费的 30 天试用账户。其 URL 当前为 [`https://trials.dynamics.com/CustomerEngagement/ChangeSignup/`](https://trials.dynamics.com/CustomerEngagement/ChangeSignup/)。实际上，本示例就是使用一个免费的\
  \ 30 天试用账户（该账户很可能在本书付印前很久就已过期）完成的。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig15_HTML.jpg](img/370912_3_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15 — Dynamics 365 的 `Get Data` 对话框\n\n1. 在 Power BI Desktop 的“开始”功能区中，单击 `Get\
  \ Data` 按钮。\n2. 单击左侧的 `Online Services`，然后在右侧选择 `Dynamics 365 (online)`。`Get Data`\
  \ 对话框将如图 5-15 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig16_HTML.jpg](img/370912_3_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16 — `Dynamics 365 (online)` 对话框\n\n3. 单击 `Connect`。将出现 `Dynamics 365 (online)`\
  \ 对话框。\n4. 输入你用于连接到 Dynamics 365 的 URL，并添加 `/api/data/v8.1`（至少，在本书付印时情况如此）。它可能类似于图\
  \ 5-16 所示。但请注意，此 URL 会根据你所在的地理位置而变化。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig17_HTML.jpg](img/370912_3_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17 — Dynamics 365 的 OData 源对话框\n\n5. 单击 `OK`。将出现 OData 源对话框。这是因为 Power BI\
  \ 使用 OData 连接到 Dynamics 365 Online。\n6. 选择 `Organizational account` 作为安全访问方法。OData\
  \ 源对话框将如图 5-17 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig18_HTML.jpg](img/370912_3_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18 — 登录后的 OData 源对话框\n\n7. 单击 `Sign in` 登录你的 Dynamics 365 账户，并按照 Microsoft\
  \ 登录流程操作。完成后，OData 源对话框将类似于图 5-18 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig19_HTML.jpg](img/370912_3_En_5_Fig19_HTML.jpg)\n\
  \n图 5-19 — Dynamics 365 的 `Navigator` 对话框\n\n8. 单击 `Connect`。将出现 `Navigator` 对话框，显示你有权限连接的所有\
  \ Dynamics 对象。你可以在图 5-19 中看到一个示例。\n\n**注意：** 在第 6 步中你看到，MS Dynamics 365 连接实际上是一个\
  \ OData 连接。OData 将在本章后续部分详细解释。\n\nDynamics 365 的表数量非常庞大——并且这个数量会根据你组织订阅的服务而有所不同。然而，实际上，你是在访问一个数据库结构。这意味着你必须对底层数据如何存储有一定的了解。如果你想了解\
  \ Dynamics 365 的表，我建议你先从 Microsoft 在线帮助手册开始，网址为 [`https://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/data-entities/data-entities`](https://docs.microsoft.com/en-us/dynamics365/unified-operations/dev-itpro/data-entities/data-entities)。\n\
  \n## Google Analytics\n\n假设你已经设置了一个有效的 Google Analytics 账户，你可以使用 Power BI Desktop\
  \ 连接到你有权限访问的 Google Analytics 数据。要使此示例生效，你需要一个有效且可正常使用的 Google Analytics 账户。\n\n\
  **注意：** 要注册一个可用于测试 Power BI Desktop 的 Google Analytics 账户，请访问 [`www.google.com/analytics`](http://www.google.com/analytics)。\n\
  \n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig20_HTML.jpg](img/370912_3_En_5_Fig20_HTML.jpg)\n\
  \n图 5-20 — 第三方服务连接器警报\n\n1. 在 Power BI Desktop 的“开始”功能区中，单击 `Get Data` 按钮。\n2. 单击左侧的\
  \ `Online Services`，然后在右侧选择 `Google Analytics`。`Connecting to a third-party service`\
  \ 对话框将如图 5-20 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig21_HTML.jpg](img/370912_3_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21 — Google Analytics 连接对话框\n\n3. 单击 `Continue`。将出现 Google 账户对话框。当前它看起来像图\
  \ 5-21 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig22_HTML.jpg](img/370912_3_En_5_Fig22_HTML.jpg)\n\
  \n图 5-22 — Google Analytics 登录对话框\n\n4. 单击 `Sign in`。将显示 Google 选择账户对话框。当前它看起来像图\
  \ 5-22 中的图像。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig23_HTML.jpg](img/370912_3_En_5_Fig23_HTML.jpg)\n\
  \n图 5-23 — Google Analytics 权限对话框\n\n5. 单击要用于 Google Analytics 的现有账户。将出现 Google\
  \ Analytics 权限对话框。当前它看起来像图 5-23 所示。\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig24_HTML.jpg](img/370912_3_En_5_Fig24_HTML.jpg)\n\
  \n图 5-24 — 登录后的 Google Analytics 对话框\n\n6. 单击 `Allow`。你将返回到 Google 账户对话框，但这次是已登录状态。你可以在图\
  \ 5-24 中看到这一点。\n7. 单击 `Connect`。将出现 `Navigator` 对话框，显示你可以在 Google Analytics 中连接的数据表。\n\
  \n\n\n## OData 源\n\nOData 是开放数据协议（Open Data Protocol）的简称。该协议允许 Web 客户端发布和编辑被标识为\
  \ URL 的资源。通过 OData 连接的数据可以是表格形式，也可以是不同的结构。\n\nOData 是一种连接基于 Web 的数据的通用方法。因此，每个 OData\
  \ 源都可能与你之前使用过的其他源不同。事实上，在连接 Dynamics 365 时，你已经接触过 OData。\n\n然而，有大量可用的 OData 源。有些是公开的，有些只有在你拥有适当权限时才能访问。但访问方法通常大同小异。下面是一个如何连接\
  \ Microsoft 免费提供的 OData 示例源的示例（至少在本书付印时是如此）：\n\n![../images/370912_3_En_5_Chapter/370912_3_En_5_Fig25_HTML.jpg](img/370912_3_En_5_Fig25_HTML.jpg)\n\
  \n图 5-25：OData 源对话框\n\n1.  在 Power BI Desktop 的“开始”功能区中，单击`获取数据`按钮底部的小三角形。或者，单击`获取数据`按钮，然后从`获取数据`对话框的左侧窗格中选择`其他`。\n\
  2.  从菜单中选择`OData 源`。将出现 OData 源对话框。\n3.  输入用于连接 OData 源的 URL。在此示例中，我将使用一个 Microsoft\
  \ 示例 OData 源，该源位于 [`http://services.odata.org/northwind/northwind.svc`](http://services.odata.org/northwind/northwind.svc)。对话框应如图\
