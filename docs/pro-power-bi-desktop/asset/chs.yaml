- "# ODBC Sources\n\n如本章和前一章所示，Power BI Desktop 可以连接到广泛的数据源。然而，总有一些数据库应用程序没有内置到 Power\
  \ BI Desktop 中的特定连接器。\n\n这时，一个名为 Open Database Connectivity（开放数据库连接，简称 ODBC）的通用解决方案就派上用场了。ODBC\
  \ 是一种连接数据源的标准方式，大多数数据源都是数据库或结构类似于数据库的。简单来说，如果存在针对你要连接的应用程序的 ODBC 驱动程序，你就可以将数据从该应用程序加载到\
  \ Power BI Desktop 中。\n\n已经有数百个 ODBC 驱动程序被编写出来。有些是免费提供的，其他的则需要你购买许可证。它们适用于从大多数个人电脑上常见的应用程序到小众产品的广泛领域。\n\
  \n尽管 ODBC 被设计为一种访问应用程序数据的标准方式，但每个 ODBC 驱动程序与其他驱动程序都略有不同。因此，你可能需要花一点时间来了解你要连接的应用程序所附带的驱动程序的界面特性。\n\
  \n在本节中，我们将使用 FileMaker Pro 作为数据源。这个产品是一个桌面和服务器数据库系统，已经存在了相当长的时间。然而，目前没有针对它的特定 Power\
  \ BI Desktop 连接器。好消息是 FileMaker Pro *确实*有 ODBC 驱动程序。因此，我们将使用 ODBC 从 Power BI Desktop\
  \ 连接到 FileMaker Pro。\n\n我必须补充一点，我不期望你为了进行此练习而安装一份 FileMaker Pro（即使是试用版）及其配套的 ODBC\
  \ 驱动程序。然而，我想解释的是，你如何使用 ODBC 连接到存在 ODBC 驱动程序的广泛数据源。所以，如果你愿意，可以随意下载并安装 FileMaker Pro\
  \ 及其 ODBC 驱动程序，但你需要参考 FileMaker Pro 的文档来了解如何做到这一点。\n\n假设你有一个符合 ODBC 标准的数据源，并且有一个适用于该数据源的工作正常的\
  \ ODBC 驱动程序，以下是使用 ODBC 将数据加载到 Power BI Desktop 中的方法：\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig12_HTML.jpg](img/370912_3_En_6_Fig12_HTML.jpg)\n\
  \n*图 6-12 ODBC 数据源管理员*\n\n1. 运行 `ODBC Data Source Administrator`（ODBC 数据源管理器）应用程序。它通常位于\
  \ `C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Administrative Tools`\
  \ 文件夹中。如果你使用的是 64 位 Power BI Desktop，请务必使用 64 位版本；如果你使用的是 32 位 Power BI Desktop，请使用\
  \ 32 位版本。\n2. 单击“系统 DSN”选项卡。你应该会看到如图 6-12 所示的对话框。\n3. 单击“添加”。你将看到计算机上当前安装的所有 ODBC\
  \ 驱动程序的列表。它应该类似于图 6-13 中所示的对话框。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig13_HTML.jpg](img/370912_3_En_6_Fig13_HTML.jpg)\n\
  \n*图 6-13 已安装的 ODBC 驱动程序列表*\n\n4. 选择与你要连接的数据源相对应的 ODBC 驱动程序（在此示例中为 `FileMaker ODBC`）。如果你看不到该\
  \ ODBC 驱动程序，则需要安装或重新安装该驱动程序。\n5. 单击“完成”。将出现你选择的特定 ODBC 驱动程序的配置对话框。如果你使用的是 FileMaker\
  \ Pro，该对话框将如图 6-14 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig14_HTML.jpg](img/370912_3_En_6_Fig14_HTML.jpg)\n\
  \n*图 6-14 FileMaker Pro ODBC 配置助手*\n\n6. 在 FileMaker Pro 的配置对话框中，为连接设置一个名称（DSN 名称）。此对话框应类似于图\
  \ 6-15。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig15_HTML.jpg](img/370912_3_En_6_Fig15_HTML.jpg)\n\
  \n*图 6-15 为 FileMaker Pro 命名 ODBC 连接*\n\n\n\n1.  单击“下一步”，然后为此特定 ODBC 连接输入名称和描述。该对话框应类似图\
  \ 6-15 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig16_HTML.jpg](img/370912_3_En_6_Fig16_HTML.jpg)\n\
  \n图 6-16 指定 ODBC 数据的主机\n\n1.  单击“下一步”，如果您在本地计算机上使用 FileMaker 试用版，请输入 `localhost`\
  \ 作为主机名。否则，请输入 FileMaker 服务器的 IP 地址。您将看到如图 6-16 所示的对话框。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig17_HTML.jpg](img/370912_3_En_6_Fig17_HTML.jpg)\n\
  \n图 6-17 指定 ODBC 数据的数据库\n\n1.  单击“下一步”，然后在 FileMaker Pro 中选择您要连接的数据库。您将看到如图 6-17\
  \ 所示的对话框（如果您*没有*使用 FileMaker Pro——请记住，这些对话框可能因特定的 ODBC 驱动程序而异）。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig18_HTML.jpg](img/370912_3_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18 ODBC 连接确认对话框\n\n1.  单击“下一步”。ODBC 配置对话框将恢复连接的规格。它可能类似于图 6-18 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig19_HTML.jpg](img/370912_3_En_6_Fig19_HTML.jpg)\n\
  \n图 6-19 已配置 ODBC 驱动程序的 ODBC 数据源管理员对话框\n\n1.  单击“完成”。您将返回到 ODBC 数据源管理员，在那里您将看到刚刚创建的系统\
  \ DSN。ODBC 数据源管理员对话框应类似于图 6-19 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig20_HTML.jpg](img/370912_3_En_6_Fig20_HTML.jpg)\n\
  \n图 6-20 用于选择 ODBC 数据源的 Power BI Desktop 的“从 ODBC”对话框\n\n1.  单击“确定”。这将关闭 ODBC 数据源管理员对话框。\n\
  2.  启动 Power BI Desktop。\n3.  单击“获取数据” ➤ “更多” ➤ “其他”。\n4.  从右侧可用的数据源中选择 **ODBC**。\n\
  5.  单击“连接”。“从 ODBC”对话框将出现。\n6.  展开可用的 DSN 列表。“从 ODBC”对话框将类似于图 6-20 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig21_HTML.jpg](img/370912_3_En_6_Fig21_HTML.jpg)\n\
  \n图 6-21 ODBC 驱动程序安全对话框\n\n1.  选择您之前创建的 DSN（本例中为 `FilemakerForPowerBI`）。\n2.  单击“确定”。凭据对话框将出现。\n\
  3.  选择 Windows 集成安全性，或单击左侧的“数据库”，然后输入有权使用 ODBC 驱动程序连接的用户名。凭据对话框将类似于图 6-21 所示。\n\n\
  ![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig22_HTML.jpg](img/370912_3_En_6_Fig22_HTML.jpg)\n\
  \n图 6-22 使用 ODBC 数据源时的导航器对话框\n\n1.  单击“连接”。您将在导航器窗口中看到 ODBC 数据源中可用的数据。\n2.  选择要加载到\
  \ Power BI Desktop 中的表。您可以在图 6-22 中看到所选表中包含的数据。\n3.  单击“加载”以将数据从 ODBC 数据源加载到 Power\
  \ BI Desktop。\n\n我意识到这个过程一开始可能显得有些繁琐。但请记住，您很可能只需设置一次 ODBC 连接。之后，您可以随时使用它来连接源数据。\n\
  \n您需要知道，每一个 ODBC 驱动程序都是不同的。因此，在第 5 步到第 10 步中出现的对话框，其外观会根据您配置的不同 ODBC 驱动程序而略有差异。不过，关键元素始终是相同的。它们是：\n\
  \n*   命名 DSN\n*   指定数据的主机计算机\n*   定义数据存储库（或数据库）\n\n关于创建和使用 ODBC 连接将数据加载到 Power BI\
  \ Desktop（或任何其他目标应用程序）中，其实还有很多内容可以写。然而，如果您需要了解更多关于这种特定技术的信息，我不得不将您引荐到丰富的可用资源，无论是印刷版还是在线版。微软文档是一个很好的起点，它解释了系统\
  \ DSN、用户 DSN 和文件 DSN 之间的区别，并描述了您可能需要了解的许多关键元素。\n\n> **注意：** FileMaker Pro 必须处于打开和/或运行状态，ODBC\
  \ 连接才能工作。其他 ODBC 源可能有其特定的注意事项。\n\n最后一点，我只能敦促您获取计划用于 Power BI Desktop 的 ODBC 驱动程序的所有相关文档。事实上，如果您使用的是通过\
  \ ODBC 驱动程序的企业数据源，则可能有企业资源可以为您配置 ODBC。\n\n\n\n## OLE DB 数据源\n\n`OLE DB`（对象链接与嵌入数据库的缩写）在技术层面上是一种名为应用程序编程接口（`API`）的技术。通俗来说，它是一种以通用方式连接数据库源的技术。\n\
  \n因此，与 `ODBC` 类似，你可以使用 `OLE DB` 连接到数据源（通常是数据库，但也可能是其他数据源）。事实上，即使存在其他连接方法，你也会发现 `OLE\
  \ DB` 是一种连接数据库的有用方式。\n\n所以，无论你打算如何使用 `OLE DB`，了解它的工作原理都非常值得。在本示例中，我将使用 `OLE DB`\
  \ 连接到 SQL Server 以及你在本章开头首次看到的示例数据库。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig23_HTML.jpg](img/370912_3_En_6_Fig23_HTML.jpg)\n\
  \n图 6-23\n\n启动 OLE DB 连接\n\n1. 打开一个新的 Power BI Desktop 应用程序。\n2. 在 Power BI Desktop\
  \ 功能区中，点击 `获取数据` 按钮。\n3. 点击左侧的**其他**，然后点击右侧的 **OLE DB**。对话框将如图 6-23 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig24_HTML.jpg](img/370912_3_En_6_Fig24_HTML.jpg)\n\
  \n图 6-24\n\n“来自 OLE DB”对话框\n\n1. 点击 `连接`。**来自 OLE DB** 对话框将出现，如图 6-24 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig25_HTML.jpg](img/370912_3_En_6_Fig25_HTML.jpg)\n\
  \n图 6-25\n\nOLE DB 数据链接属性对话框\n\n1. 如果你有一个完整可用的连接字符串，请将其输入到**连接字符串**文本框中。\n2. 如果你没有连接字符串，请点击\
  \ `生成` 按钮。将显示 **OLE DB 数据链接属性** 对话框，如图 6-25 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig26_HTML.jpg](img/370912_3_En_6_Fig26_HTML.jpg)\n\
  \n图 6-26\n\nOLE DB 数据链接属性对话框的“连接”属性页\n\n1. 选择你想要使用的 OLE DB 数据提供程序。在本示例中，它将选择 **Microsoft\
  \ OLE DB Provider for SQL Server**。\n2. 点击 `下一步`。**OLE DB 数据链接属性**对话框的**连接**属性窗格将出现。\n\
  3. 从**选择或输入服务器名称**弹出菜单中选择一个可用的 SQL Server（或输入其名称）。\n4. 选择安全类型，如果你选择使用特定用户名而不是 Windows\
  \ NT 集成安全性，则输入用户名和密码。\n5. 从**选择服务器上的数据库**弹出菜单中选择源数据库。对话框将类似于图 6-26 所示。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig27_HTML.jpg](img/370912_3_En_6_Fig27_HTML.jpg)\n\
  \n图 6-27\n\n测试连接警报\n\n1. 点击**测试连接**按钮以确保连接有效。你应该会看到如图 6-27 中的消息。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig28_HTML.jpg](img/370912_3_En_6_Fig28_HTML.jpg)\n\
  \n图 6-28\n\n包含有效连接字符串的“来自 OLE DB”对话框\n\n1. 点击 `确定`。Power BI Desktop 将构建连接字符串并将其插入到**来自\
  \ OLE DB**对话框中，如图 6-28 所示。\n2. 点击 `确定`。**导航器**窗口将出现，并显示相应的数据。\n3. 选择源表，然后点击 `加载`\
  \ 将数据加载到 Power BI Desktop 中。\n\n**注意：** 如果是首次连接到 OLE DB 源，系统可能会要求你输入用户名和密码，这与本章前面的示例情况相同。\n\
  \n你需要知道，OLE DB 连接要求在运行 Power BI Desktop 的计算机上安装了 OLE DB 驱动程序（或**提供程序**）。然而，真正有趣的是，OLE\
  \ DB 连接可以简化为一个简单的连接字符串。因此，如果你需要与其他用户共享该连接，在许多情况下，你只需通过电子邮件将连接字符串发送给他们即可。然后你的同事可以直接将该连接字符串粘贴到\
  \ Power BI Desktop 的**来自 OLE DB** 对话框中。换句话说（以此示例为模型），你可以简单地发送以下文本给同事：\n\n```\nprovider=SQLOLEDB.1;initial\
  \ catalog=CarSalesData;data source=ADAM03\\SQLSERVER2016\n```\n\n他们可以通过将此字符串粘贴到**来自\
  \ OLE DB** 对话框中来连接到指定的数据库。\n\n使用 OLE DB 连接还有其他优势。具体来说，你（或你的 IT 部门）可以在连接字符串中提供高级别的配置，以加快或改善对数据的访问。例如，可以通过指定用于报表的镜像服务器来减轻主服务器的压力。在这个层面上，技术细节将取决于\
  \ OLE DB 数据源以及所使用的驱动程序，因此超出了本书的讨论范围。\n\n### 刷新数据\n\n从数据库和数据仓库加载数据仅意味着将源数据的快照复制到\
  \ Power BI Desktop 中。如果源数据被更新、扩展或删除，那么你需要获取最新版本的数据，以便你的分析能够反映数据的当前状态。\n\n基本上，你有两个选项可以做到这一点：\n\
  \n- 刷新你已定义的所有数据源中的所有源数据。\n- 单独刷新一个或多个表。\n\n#### 在 Power BI Desktop 内存模型中刷新整个数据\n\
  \n只有一种方法可以确保你的所有数据都是最新的。刷新整个数据可能需要更长的时间，但你可以确信你的 Power BI Desktop 文件包含来自你所连接的所有来源的最新可用数据。\n\
  \n执行完全刷新：\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig29_HTML.jpg](img/370912_3_En_6_Fig29_HTML.jpg)\n\
  \n图 6-29\n\n“刷新”对话框\n\n1. 在**主页**功能区中，点击 `刷新` 按钮。**刷新**对话框将出现，显示当前正在刷新的所有数据源。此对话框将类似于图\
  \ 6-29 所示。\n\n**注意：** 如果源数据量很大或网络连接速度较慢，完整的数据刷新可能需要相当长的时间。\n\n#### 刷新单个表\n\n如果你确定只需要刷新\
  \ Power BI Desktop 数据模型中的一个或多个表，那么你可以选择单独刷新这些表。操作步骤如下：\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig30_HTML.jpg](img/370912_3_En_6_Fig30_HTML.jpg)\n\
  \n图 6-30\n\n刷新单个表\n\n1. 在**字段**窗格中，右键单击你想要刷新的表。\n2. 在上下文菜单中选择 `刷新数据`。如图 6-30 所示。\n\
  \n**刷新**对话框将出现（可能只是短暂显示），该表的现有数据将被最新数据替换。\n\n\n\n## 添加你自己的数据\n\n你可能并非总能拥有所需的所有数据。当需要向已加载到\
  \ `Power BI Desktop` 的数据集中添加产品列表、人员组或任何类型数据时，你可能会面临这种情况。\n\n微软开发团队已经认识到这一需求，并提供了一个简单的解决方案：你可以创建自己的数据表，以完善\
  \ `Power BI` 内存数据模型中的数据集集合。然后，你可以随时即时输入所需的任何额外数据。\n\n![../images/370912_3_En_6_Chapter/370912_3_En_6_Fig31_HTML.jpg](img/370912_3_En_6_Fig31_HTML.jpg)\n\
  \n**图 6-31** `创建表` 对话框\n\n1.  在 `Power BI Desktop` 的 `开始` 功能区中，单击 `输入数据`。将会弹出 `创建表`\
  \ 对话框。\n2.  单击 `Column1` 右侧的星号以添加列。\n3.  双击任意列名称并输入新名称来重命名该列。\n4.  输入或粘贴所需的数据。对话框将如图\
  \ 6-31 所示。\n5.  在对话框底部的 `名称` 字段中为表格输入一个名称。\n6.  单击 `加载` 将数据加载到 `Power BI` 内存数据模型中。新创建的表将出现在\
  \ `字段` 窗格中。\n\n`创建表` 对话框中的编辑功能极其简单。你可以删除、剪切、复制和粘贴数据和列，但仅此而已。然而，当你需要向模型中添加一些最后时刻的数据时，此选项可能非常有用。\n\
  \n**注意**  \n这是一个极其简单的过程，专为少量数据设计。如果你需要的不仅仅是少量的行和列，那么更好的做法是在 Excel 中创建数据，然后再将其加载到\
  \ `Power BI Desktop` 中。\n\n尽管简单，但仍需了解以下几点才能充分利用此选项：\n\n-   右键单击表格网格中的任何行或列会显示一个上下文菜单，你可以在其中选择插入或删除行和列。\n\
  -   `输入数据` 选项也适用于 `查询编辑器`。\n-   创建后，可以在 `查询编辑器` 中像修改任何其他数据源一样修改该表。\n-   创建后，数据会被“硬编码”到\
  \ `Power BI Desktop` 中。\n\n## 结论\n\n在本章中，你了解了如何连接到一系列数据源——无论是在 Azure 中还是在你自己的计算机或网络上。你了解到你所在组织现有的\
  \ `Power BI Service` 可以包含你可以连接的预准备数据流和数据集。你还学会了可以使用 `Microsoft 通用数据模型` 作为 `Power\
  \ BI` 报表和仪表板的基础。之后，你学会了如何利用你的 `R` 和 `Python` 知识，使用这两种语言为 `Power BI` 准备数据。\n\n最后，你了解到可以使用两个标准的数据访问连接器——`ODBC`\
  \ 和 `OLE DB`——来连接到尚未内置 `Power BI` 连接器的数据源。然后，如果其他所有方法都失败了，你可以根据需要创建自己的数据表。\n\n本章结束了这六章的系列内容，该系列向你介绍了可以与\
  \ `Power BI Desktop` 一起使用的众多且多样的数据源。在这些章节中，你了解了如何从一些更常用的可用源中加载数据。好消息是 `Power BI\
  \ Desktop` 可以读取来自数十种更多源的数据。坏消息是，要详细讨论所有这些源需要一整本书的篇幅。\n\n因此，我不会在本书中描述任何其他数据源。这是因为，既然你已经了解了构成\
  \ `Power BI Desktop` 加载数据时极其标准化方法的核心技术，你可能无需从我这里获取更多信息就能加载任何可能的数据类型。如果你需要关于其他数据源的任何具体信息，最合适的求助渠道是\
  \ `Microsoft Power BI` 网站。目前该网站位于 [`https://powerbi.microsoft.com/`](https://powerbi.microsoft.com/)。\n\
  \n既然你现在能够找到、访问并将所需数据加载到 `Power BI Desktop` 中，那么是时候进入下一步了。这意味着要对数据集进行清理和重组，以便它们适合你的分析需求。处理这些挑战将是接下来六章的主题。\n\
  \n"
- "# 构建导入的数据结构\n\n在前六章中，你了解了查找并将数据加载（或连接）到 `Power BI Desktop` 数据模型中的一些方法。这毫无疑问是你遵循提取、转换和加载数据的任何流程的第一步。然而，这绝对只是一个开始。一旦数据进入\
  \ `Power BI Desktop`，你需要知道如何以多种方式调整它以符合你的需求。这是因为并非所有数据都可以立即使用。很多时候，你需要对数据进行一些初步处理，使其在\
  \ `Power BI Desktop` 中更易于使用。调整源数据通常被称为 *数据转换*，这是本章以及接下来三章的主题。\n\n`Power BI Desktop`\
  \ 提供的转换范围广泛且多样。学习应用 `Power BI Desktop` 提供的技术，使你能够按照数据原本的样子获取数据，对其进行清理，并将其作为一系列连贯且结构化的数据表推回到\
  \ `Power BI Desktop` 数据模型中。只有这样，数据才能用于创建引人注目的仪表板和报表。\n\n由于 `Power BI Desktop` 提供的数据转换选项范围太广（至少在开始时）很容易让人不知所措，我将可能的修改分为四类。这些分类是我个人的，仅仅是为了便于理解而提出的建议：\n\
  \n-   *数据转换*：包括删除列和行、重命名列以及筛选数据。\n-   *数据修改*：涵盖更改数据集行和列中的实际数据。\n-   *扩展数据集*：包括添加更多列，可能将现有列展开为更多列或行，以及添加计算。\n\
  -   *合并数据集*：涉及将多个（可能来自不同数据源的）独立数据集组合成单个数据集。\n\n本章将向你介绍核心的数据转换技术，你可以应用这些技术来塑造已加载的每个单独数据集。这些转换包括：\n\
  \n-   重命名、删除和重新排序列\n-   删除行组或行集\n-   对数据集进行去重\n-   对数据进行排序\n-   通过筛选数据来排除记录\n- \
  \  对记录进行分组\n\n在下一章中，你将学习如何清理和修改数据。在第 9 章中，你将了解如何对列进行子集化以提取某列中的部分数据、计算列、合并来自不同查询的数据，以及添加包含不同类型计算的更多列，同时你还将了解数据透视和逆透视。第\
  \ 10 章将解释如何处理复杂的源结构。因此，如果你在本章中找不到想要的内容，那么答案很可能会在接下来的三章中找到。\n\n在本章中，我还将使用一组你可以在 Apress\
  \ 网站上找到的示例文件。如果你已按照附录 A 中的说明操作，那么这些文件位于 `C:\\PowerBiDesktopSamples` 文件夹中。\n\n\n\n\
  ## Power BI Desktop 查询\n\n在第一章中，您已经了解了如何将源数据直接加载到 Power BI Desktop 中，并立即用于创建仪表板。显然，这种方法的前提是您使用的数据结构完美、干净且无错误。当数据来自“企业级”数据源（例如数据仓库，通常存储于关系、维度或多维表格数据库中）时，这些源数据几乎总是正确的，并且可以直接在报表和仪表板中使用。但当您面对多个未经\
  \ IT 部门预先清洗和准备的异构数据源时，情况往往并非如此。日常现实是，您可能必须对用于 Power BI Desktop 仪表板的大量源数据进行清洗和转换。\n\
  \n好消息是，过去需要昂贵服务器和工业级软件才能实现的数据转换，如今完全免费。没错，Power BI Desktop 附带了一个出色的 ETL（提取、转换和加载）工具，足以媲美许多价值数十万美元的应用程序。\n\
  \nPower BI Desktop 的数据转换是通过*查询*来执行的。正如您在之前章节中所见，您无需修改源数据。如果数据已准备好，可以直接加载。然而，如果您需要清洗数据，则可以在连接数据与将其加载到\
  \ Power BI Desktop 数据模型之间添加一个中间步骤。这个中间步骤使用 Power BI Desktop 查询编辑器来调整源数据。\n\n那么，如何应用查询来转换数据呢？您有两种选择：\n\
  \n-   先从单个或多个源加载数据，之后再对其进行转换。\n-   在加载前，对查询中的每个源数据元素进行编辑。\n\nPower BI Desktop 非常灵活。它不会强迫您选择其中一种方法，然后将您束缚在决策的后果中。您可以先加载数据，然后在意识到需要调整时，切换到查询编辑器进行修改，再返回创建仪表板。或者，您也可以先专注于数据，在开始构建报表前，尽可能将其打磨得完美无瑕。选择权完全在您手中。\n\
  \n为了说明这一点，让我们来看看这两种工作方式。\n\n> **注意**：为了避免显得迂腐或老套，我建议您在创建非常复杂的转换时做好记录，因为在完全没有文档记录的情况下，后续返回解决方案进行调整可能会非常痛苦。\n\
  \n### 加载后编辑数据\n\n在第一章中，您已经了解了如何将 Excel 工作簿 `CarSales.xlsx` 直接加载到 Power BI Desktop\
  \ 数据模型中，用于创建初始仪表板。现在，假设您想要对已加载的数据结构做一些更改。具体来说，您想要重命名 `CostPrice` 列。您要修改的文件是 `C:\\\
  PowerBiDesktopSamples` 目录下的 `CH07Example1.pbix` 文件。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig1_HTML.jpg](img/370912_3_En_7_Fig1_HTML.jpg)\
  \  \n**图 7-1** — Power BI Desktop 查询编辑器\n\n1.  启动 Power BI Desktop。\n2.  打开示例文件\
  \ `C:\\PowerBiDesktopSamples\\Example1.pbix`。请注意，在此示例中，您是在修改一个现有的 Power BI Desktop\
  \ 文件及其现有数据输入流程，而*并非*在加载新数据。查看“字段”列表，注意有一个名为 `CostPrice` 的字段。\n3.  在 Power BI Desktop\
  \ 的“开始”功能区中，单击 `转换数据` 按钮。Power BI Desktop 查询编辑器将打开并以表格形式显示源数据。窗口将如图 7-1 所示。\n\n\
  ![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig2_HTML.jpg](img/370912_3_En_7_Fig2_HTML.jpg)\
  \  \n**图 7-2** — 查询编辑器中的列上下文菜单\n\n4.  右键单击 `CostPrice` 列的标题。该列将被选中，标题将变为黄色。\n5.\
  \  从上下文菜单中选择 `重命名`。您可以在图 7-2 中看到此上下文菜单。\n6.  输入 `VehicleCost` 并按 Enter 键。列标题将更改为\
  \ `VehicleCost`。\n7.  在 Power BI Desktop 查询编辑器的“开始”功能区中，单击 `关闭并应用` 按钮。Power BI Desktop\
  \ 查询编辑器将关闭，并返回到 Power BI Desktop 窗口。在仪表板中使用到 `CostPrice` 的地方，都将被 `VehicleCost` 替换。这在“字段”列表以及所有使用此字段的可视化对象中都是可见的。\n\
  \n我希望这个简单的示例能让您明白，转换源数据是一个快速且轻松的过程。您使用的技术——重命名列——只是可用于转换数据的数十种可能技术中的一种。然而，这里要记住的核心思想并非特定的转换方法。您需要记住的是，支撑仪表板的数据始终存在，并且只需点击一下即可访问。随时，您都可以通过单击\
  \ Power BI Desktop 窗口中的 `转换数据` 按钮，“切换”到数据并进行修改。您所做的任何修改并确认后，都会立即在仪表板和报表中更新。\n\n\
  > **注意**：或者，如果您愿意，也可以直接在报表或数据视图中编辑任何可见表背后的查询，只需右键单击“查询”窗格中的表名（或单击省略号），然后从上下文菜单中选择\
  \ `编辑查询` 即可。\n\n### 加载前转换数据\n\n有时，您可能更倾向于在加载数据之前对数据进行处理。这是您在第一章中创建简单仪表板时所使用方法的一个变体。请执行以下步骤，以便在数据*出现*在\
  \ Power BI Desktop 窗口*之前*转换您正在导入的数据：\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig3_HTML.jpg](img/370912_3_En_7_Fig3_HTML.jpg)\
  \  \n**图 7-3** — “应用查询更改”对话框\n\n1.  打开一个新的 Power BI Desktop 窗口。\n2.  在 Power BI\
  \ Desktop 的“开始”功能区中，单击 `获取数据` 按钮上的小三角形。\n3.  在菜单中选择 `Excel`，然后打开 Excel 文件 `C:\\\
  PowerBiDesktopSamples\\CarSales.xlsx`。\n4.  在“导航器”窗口中，选择 `BaseData` 工作表。\n5.  单击\
  \ `转换数据` 按钮（*而非* `加载` 按钮）。\n6.  Power BI Desktop 查询编辑器将打开并以表格形式显示源数据。\n7.  重复上一个示例中的步骤\
  \ 4 到 6，重命名 `CostPrice` 列。\n8.  在 Power BI Desktop 查询编辑器的“开始”功能区中，单击 `关闭并应用` 按钮。Power\
  \ BI Desktop 查询编辑器将关闭，并返回到 Power BI Desktop 窗口。在数据加载期间，您会看到“应用查询更改”对话框，如图 7-3 所示。\n\
  \n这一次，您是在将数据集加载到 Power BI Desktop 数据模型*之前*对数据进行了简单的修改。数据修改技术完全相同。直接加载数据与通过查询窗口绕行的唯一区别，在于在“导航器”对话框中点击的是\
  \ `编辑` 而不是 `加载`。这意味着数据只有在您在 Power BI Desktop 查询编辑器中完成对源数据的所有修改后，才会被加载。\n\n\n\n##\
  \ 是查询还是加载？\n\nPower BI Desktop 始终让你可以选择将数据直接加载到其数据模型中，或者通过 Power BI Desktop 查询绕一个有价值的弯子。你选择哪条路径完全取决于你自己，也显然取决于每种情况。不过，在面临使用不熟悉数据的新仪表板挑战时，你可能需要考虑以下基本原则：\n\
  \n-   你是否确信数据已经可以直接使用？也就是说，数据是否干净且结构良好？如果是，那么你可以尝试将其直接加载到 Power BI Desktop 数据模型中。\n\
  -   你是否面临需要组合并塑造成连贯结构的多个数据源？如果是这种情况，那么你真的需要使用 Power BI Desktop 查询编辑器来转换数据。\n-  \
  \ 数据是否来自企业数据仓库？这可能存储在关系数据库、SQL Server Analysis Services 多维数据集，甚至是内存中的表格数据仓库中。由于这些数据源几乎总是数百甚至数千小时清理、准备和结构化数据工作的成果，你很可能可以直接将它们加载到数据模型中。\n\
  -   数据是否需要预先聚合和过滤？考虑使用 Power BI Desktop 查询编辑器。\n-   你是否可能为了更方便管理数据而需要更改字段名称？直接加载数据到数据模型然后在那里更改它们可能更简单。\n\
  -   你是否面临需要添加到“核心”数据表中的大量查找表？那么 Power BI Desktop 查询编辑器就是你的好帮手。\n-   数据是否包含许多多余或错误的元素？那么，首先使用\
  \ Power BI Desktop 查询编辑器移除这些元素。\n-   数据是否需要合理化并标准化以使其更易于处理？在这种情况下，成功的路径是通过 Power\
  \ BI Desktop 查询编辑器。\n-   数据源是否极其庞大？如果是这种情况，你可以先在查询编辑器中编辑和过滤数据来节省时间。这是因为查询编辑器只加载数据的*样本*供你调整。只有当你确认所有修改并关闭查询编辑器时，才会加载整个数据集。\n\
  \n这些问题只是粗略的指导原则。但它们可以帮助你在使用 Power BI Desktop 时指明正确的方向。不可避免地，你使用这个应用程序越多，你就越能培养出帮助你做出正确决策的反应和直觉。但请记住，Power\
  \ BI Desktop 是用来提供帮助的，即使是直接加载的数据集也是基于查询的。因此，你总是可以先加载数据，然后稍后在需要时决定调整查询结构。或者，在查询窗口中编辑数据可以是在将数据加载到数据模型之前仔细查看数据的一个绝佳机会——而且只需额外点击几下。\n\
  \n所以，请随意采用你觉得满意的工作方式。Power BI Desktop 会轻松且近乎无形地适应你的风格，让你能够如此流畅地在数据和仪表板之间切换，以至于它很可能会变成你的第二天性。\n\
  \n本章的其余部分将带你了解一些你需要知道的用于清理和塑形数据的核心技巧。然而，在深入了解所有细节之前，让我们先从高层快速概览一下 Power BI Desktop\
  \ 查询编辑器及其布局方式。\n\n### Power BI Desktop 查询编辑器\n\n你所有的数据转换都将在 Power BI Desktop 查询编辑器中进行。它是一个与创建仪表板的窗口分离的窗口，并且具有略有不同的布局。\n\
  \nPower BI Desktop 查询编辑器由六个主要元素组成：\n\n-   四个功能区：主页、转换、添加列和视图。在执行特定类型的数据转换时，还有其他功能区可用。\n\
  -   包含所有已添加到 Power BI Desktop 文件中的查询的“查询”列表窗格。\n-   “数据”窗口，你可以在其中看到选定查询的数据样本。\n\
  -   “查询设置”窗格，其中包含用于转换数据的步骤列表。\n-   数据上方的公式栏，显示执行所选转换步骤的代码（使用 Power BI “M” 语言编写，你将在第\
  \ 12 章中更详细地了解）。\n-   状态栏（位于窗口底部），指示有用信息，例如查询表中的行数和列数，以及数据集下载的日期。\n\n这些元素的标注如图 7-4\
  \ 所示。\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig4_HTML.jpg](img/370912_3_En_7_Fig4_HTML.jpg)\n\
  \n图 7-4\n\nPower BI Desktop 查询编辑器详解\n\n#### 已应用步骤列表\n\n数据转换本质上是一个顺序过程。因此，查询窗口会存储你在清理和塑形源数据时所做的每一次修改。构成数据转换过程的各种元素都列在查询编辑器的“查询设置”窗格的“已应用步骤”列表中。\n\
  \nPower BI Desktop 查询编辑器不对数据转换过程中的步骤进行编号，但它肯定会记住每一个步骤。它们从“已应用步骤”列表的顶部开始（几乎总是以“源”步骤开头），并且可以扩展到数十个单独的步骤，这些步骤追溯你数据的演变过程，直到将其加载到数据模型中。如果需要，你可以将查询编辑器视为一种“宏记录器”。\n\
  \n此外，当你单击“已应用步骤”列表中的每个步骤时，“数据”窗口中的数据会发生变化，以反映每次转换的结果，为你提供应用于数据集的所有修改的完整且可见的轨迹。\n\
  \n“已应用步骤”列表为本章和下一章中涵盖的每个数据修改选项都赋予了一个独特的步骤名称。由于了解每个功能实际实现的效果可能很重要，我将始终提醒你注意 Power\
  \ BI Desktop 查询应用的标准名称。\n\n#### Power BI Desktop 查询编辑器功能区\n\nPower BI Desktop 查询编辑器（至少在\
  \ 2020 年 2 月版本中）使用四个核心功能区。它们对于你在本章中学习的内容至关重要。如下所示：\n\n-   主页功能区\n-   转换功能区\n-  \
  \ 添加列功能区\n-   视图功能区\n\n我并不是说你需要记住这些功能区中所有按钮的功能。我希望的是，你能够利用下面这些对查询编辑器功能区按钮的简要描述，来了解\
  \ Power BI Desktop 在数据转换领域的强大功能。因此，如果你有初始数据集不符合你的需求，你可以查看 Power BI Desktop 提供的资源以及它们如何提供帮助。一旦你找到执行所需操作的功能，就可以跳转到相关章节，了解如何应用该功能的完整细节。\n\
  \n\n\n##### “开始”功能区\n\n由于我们将大量使用 `Power BI Desktop` 查询编辑器的“开始”功能区来转换数据，因此了解其功能非常重要。我在图\
  \ 7-5 和表 7-1 中解释了各种选项。\n\n**表 7-1** 查询编辑器“开始”功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n\
  | `关闭并应用` | 完成处理步骤；保存并关闭查询。 |\n| `新建源` | 允许你发现新的数据源并将其添加到现有查询集。 |\n| `最近使用的源` |\
  \ 列出你最近使用过的所有数据源。 |\n| `输入数据` | 允许你在自定义表中添加自己的特定数据。 |\n| `数据源设置` | 允许你管理和编辑已连接的数据源的设置。\
  \ |\n| `管理参数` | 允许你查看和修改为此 `Power BI Desktop` 文件定义的任何参数。这些将在第 11 章中解释。 |\n| `刷新预览`\
  \ | 刷新预览数据。 |\n| `属性` | 显示核心查询属性。 |\n| `高级编辑器` | 显示“M”语言编辑器。这在第 12 章中解释。 |\n| `管理`\
  \ | 允许你删除、复制或引用查询。 |\n| `选择列` | 允许你从源数据中所有可用的列中选择要保留的列。 |\n| `删除列` | 允许你删除一个或多个列。\
  \ |\n| `保留行` | 保留表格顶部的指定行数。 |\n| `删除行` | 从数据表顶部删除指定数量的行。 |\n| `排序` | 使用所选列作为排序键对表格进行排序。\
  \ |\n| `拆分列` | 在指定的分隔符处或指定的字符数后，将一列拆分为一列或多列。 |\n| `分组依据` | 使用指定的列集对表格进行分组，并聚合此分组中的任何数值列。\
  \ |\n| `数据类型` | 将所选数据类型应用于该列。 |\n| `将第一行用作标题` | 将第一行用作列标题。 |\n| `替换值` | 对一列或多列中的数据执行查找和替换操作。此操作仅影响列中的完整数据。\
  \ |\n| `合并查询` | 将第二个查询表联接到当前查询结果，并将第二个查询中的数据聚合或添加到第一个查询中。这在第 9 章中解释。 |\n| `追加查询`\
  \ | 将另一个查询的数据添加到当前 `Power BI Desktop` 文件中的当前查询。这在第 12 章中解释。 |\n| `合并文件` | 将一系列结构相似的文本文件中的数据添加到一个表中。这在第\
  \ 10 章中解释。 |\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig5_HTML.jpg](img/370912_3_En_7_Fig5_HTML.jpg)\n\
  \n**图 7-5** 查询编辑器“开始”功能区\n\n## “转换”功能区\n\n顾名思义，“转换”功能区包含大量可帮助你转换数据的功能。图 7-6 和表 7-2\
  \ 解释了其中包含的各种选项。\n\n**表 7-2** 查询编辑器“转换”功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n| `分组依据`\
  \ | 使用指定的列集对表格进行分组；聚合此分组中的任何数值列。 |\n| `将第一行用作标题` | 将第一行用作列标题。 |\n| `转置` | 将列转换为行，将行转换为列。\
  \ |\n| `反转行` | 以相反顺序显示源数据，将最后几行显示在窗口顶部。 |\n| `对行进行计数` | 计算表格中的行数，并用行计数替换数据。 |\n\
  | `数据类型` | 将所选数据类型应用于该列。 |\n| `检测数据类型` | 检测要应用于多个列的正确数据类型。 |\n| `重命名` | 重命名列。 |\n\
  | `替换值` | 在列内执行查找和替换操作，将指定值替换为另一个值。 |\n| `填充` | 将上方或下方单元格中的数据复制到列中的空单元格。 |\n| `透视列`\
  \ | 使用所选列中的数据作为列标题创建一组新列。 |\n| `逆透视列` | 取一组列中的值并逆透视数据，使用列标题作为描述性元素创建新列。 |\n| `移动`\
  \ | 移动列。 |\n| `转换为列表` | 将列的内容转换为列表。例如，这可用作查询参数。你将在第 11 章中学习这一点。 |\n| `拆分列` | 在指定的分隔符处或指定的字符数后，将一列拆分为一列或多列。\
  \ |\n| `格式` | 修改列中数据的文本格式（大写、小写、首字母大写）或删除尾随空格。 |\n| `合并列` | 将多列中的数据放置到单列中，并可选择添加分隔符字符。\
  \ |\n| `提取` | 使用当前数据的定义子集替换列中的数据。你可以指定从列开头或结尾保留的字符数，设置从指定字符开始的字符范围，甚至列出列中的字符数。 |\n\
  | `分析` | 根据列中元素的内容创建 XML 或 JSON 文档。 |\n| `统计信息` | 返回列中所有值的 `总和`、`平均值`、`最大值`、`最小值`、`中间值`、`标准偏差`、`计数`\
  \ 或 `非重复计数`。 |\n| `标准` | 使用你指定的值对列中的每个单元格执行基本的数学计算（加、减、除、乘、整数除或返回余数）。 |\n| `科学`\
  \ | 对列中的每个单元格执行基本的科学计算（平方、立方、的次方、平方根、指数、对数或阶乘）。 |\n| `三角学` | 使用你指定的值对列中的每个单元格执行基本的三角计算（`正弦`、`余弦`、`正切`、`反正弦`、`反余弦`\
  \ 或 `反正切`）。 |\n| `舍入` | 将列中的值舍入到下一个整数（向上或向下）或按指定的因子舍入。 |\n| `信息` | 将列中的值替换为简单信息：`是奇数`、`是偶数`\
  \ 或 `正/负`。 |\n| `日期` | 从列中的日期值中提取一个元素（日、月、年等）。 |\n| `时间` | 从列中的日期/时间或时间值中提取一个元素（小时、分钟、秒等）。\
  \ |\n| `持续时间` | 根据可以解释为天、小时、分钟等的值计算持续时间。 |\n| `展开` | 将另一个查询中（结构相同的）数据添加到当前查询。 |\n\
  | `聚合` | 计算另一个查询中数值列的总和或乘积，并将结果添加到当前查询。 |\n| `提取值` | 将列的内容的值提取为单个文本值。 |\n| `脚本`\
  \ | 运行来自“R”或 Python 等语言的脚本。 |\n\n![../images/370912_3_En_7_Chapter/370912_3_En_7_Fig6_HTML.jpg](img/370912_3_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** 查询编辑器“转换”功能区\n\n\n\n## “添加列”功能区\n\n“`添加列`”功能区不仅能添加列，还包含将列拆分为多列，以及基于现有列添加包含日期和计算结果的列等功能。它所包含的各种选项在图\
