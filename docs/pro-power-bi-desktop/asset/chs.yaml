  \ SQL 查询。\n\n## 连接到 Azure 虚拟机上的 SQL Server\n\n现在，越来越多的数据库由云服务提供商托管在企业环境之外。通过诸如 Amazon（提供适用于\
  \ SQL Server 的 RDS）或 Microsoft（在 Azure 中提供适用于 SQL Server 的虚拟机或 VM）等提供商，你现在可以将数据库部署在企业外部，并几乎可以从世界任何地方访问它们。\n\
  \n因此，为了扩展 Power BI Desktop 可用的数据源范围，我们现在将简要了解如何连接到 Azure 虚拟机上的 SQL Server。诚然，连接到\
  \ Azure 虚拟机上的 SQL Server 几乎与连接到企业环境中的 SQL Server 相同。但是，值得花点时间简要解释如何从云中的 SQL Server\
  \ 实例将数据返回到 Power BI Desktop。\n\n再次强调，如果你的企业环境中没有托管在 Azure 虚拟机上的 SQL Server 实例，你始终可以使用\
  \ Azure 试用账户来测试此过程。然而，我无法在此解释如何在虚拟机上设置 SQL Server 实例，因为这超出了本书的范围。不过，如果你需要，有许多可用资源可以解释如何执行此操作。\n\
