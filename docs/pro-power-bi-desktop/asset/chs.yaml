  \ 使用 DAX 添加一个新表。 |\n\n## Power BI Desktop 数据类型\n\n当您从外部源导入数据时，Power BI Desktop 会尝试将其转换为其使用的九种数据类型之一。这些数据类型在表\
  \ 13-3 中进行了描述。\n\n**表 13-3** Power BI Desktop 数据类型\n\n| 数据类型 | 说明 |\n| --- | ---\
  \ |\n| 十进制数 (Decimal Number) | 将数据存储为最多包含 15 位有效十进制数字的实数。负值范围从 –1.79E +308 到 –2.23E\
  \ –308。正值范围从 2.23E –308 到 1.79E + 308。 |\n| 固定小数位数 (Fixed Decimal Number) | 将数据存储为具有指定位数小数的数字。\
  \ |\n| 整数 (Whole Number) | 将数据存储为整数，可以是正数或负数，但必须是介于 9,223,372,036,854,775,808 (–2⁶³)\
  \ 和 9,223,372,036,854,775,807 (2⁶³–1) 之间的整数。 |\n| 日期/时间 (Date/Time) | 以主机的日期和时间格式存储数据。仅\
  \ 1900 年 1 月 1 日及之后的日期有效。 |\n| 日期 (Date) | 以主机的日期格式存储数据。 |\n| 时间 (Time) | 以主机的时间元素格式存储数据。\
  \ |\n| 文本 (Text) | 将数据存储为最多 536,870,912 字节的 Unicode 字符串。 |\n| 真/假 (True/False) |\
  \ 将数据存储为布尔值——真或假。 |\n| 二进制 (Binary) | 将数据存储为二进制（机器可读）数据。 |\n\n你可以像这样设置列的数据类型：\n\n\
  1. 在**数据视图（Data View）** 中，选择（或点击进入）你想要更改数据类型的列。\n2. 激活**列工具（Column tools）** 功能区。\n\
  3. 从 **数据类型（Data type）** 弹出列表中选择一种数据类型。\n\n与在**查询编辑器（Query Editor）** 中设置数据类型的情况一样，系统不允许你应用不恰当的数据类型。\n\
  \n\n\n### 格式化 Power BI Desktop 数据\n\nPower BI Desktop 允许你对表中包含的数据应用格式。当你在 Power\
  \ BI Desktop 数据模型中格式化数据时，你实际上是在定义一种格式，该格式将用于你使用此指标创建*所有仪表板中的所有可视化效果*。因此，出于以下原因，学习如何格式化数据是值得的：\n\
  \n-   通过在数据视图中一劳永逸地定义格式，你将在创建报表和演示文稿时节省时间并避免重复操作。之后，数据将以此 Power BI Desktop 文件中多个可视化效果所应用的格式显示。\n\
  -   如果你能以具有内在意义的格式查看数字，这可以帮助你更直观地理解数据。\n\n以下说明如何格式化一个字段（本例中为数字字段）：\n\n1.  假设你在 Power\
  \ BI Desktop 数据视图中工作，在“字段”列表中单击包含要格式化指标的表的名称。\n2.  单击要格式化的字段内部（来自示例文件 `CarSalesDataFromDataModel.pbix`\
  \ 中 `InvoiceLines` 表的 `SalePrice` 字段）。\n3.  在“列工具”功能区中，单击“千位分隔符”图标（“格式设置”部分中的逗号）。字段中的所有数字都将被格式化为包含千位分隔符和两位小数。\n\
  \n表 13-4 描述了可用的各种格式选项。\n\n**表 13-4**\n**货币格式选项**\n\n| 格式选项 | 图标 | 描述 | 示例 |\n| ---\
  \ | --- | --- | --- |\n| 常规 | | 保持数据未格式化。 | 100000.01 |\n| 货币 | ![../images/370912_3_En_13_Chapter/370912_3_En_13_Figa_HTML.jpg](img/370912_3_En_13_Figa_HTML.jpg)\
  \ | 添加千位分隔符、两位小数以及当前货币符号。 | $100,000.01 |\n| 日期/时间 | | 以选择的某种日期和时间格式格式化日期和/或时间值。\
  \ | |\n| 小数 | | 添加千位分隔符和两位小数。 | 100,000.01 |\n| 整数 | | 添加千位分隔符并截断任何小数。 | 100,000\
  \ |\n| 百分比 | ![../images/370912_3_En_13_Chapter/370912_3_En_13_Figb_HTML.jpg](img/370912_3_En_13_Figb_HTML.jpg)\
  \ | 乘以 100，添加两位小数，并加上百分比符号前缀。 | 28.78% |\n| 千位分隔符 | ![../images/370912_3_En_13_Chapter/370912_3_En_13_Figc_HTML.jpg](img/370912_3_En_13_Figc_HTML.jpg)\
  \ | 添加千位分隔符。 | |\n| 科学计数 | | 以科学记数法显示数字。 | 1.00E+05 |\n| 文本 | | 将字段内容格式化为文本。 | |\n\
  | 二进制 | | 将字段内容保留为数据的二进制表示形式。 | |\n| 真/假 | | 将字段内容格式化为真/假。 | |\n| 小数位数 | ![../images/370912_3_En_13_Chapter/370912_3_En_13_Figd_HTML.jpg](img/370912_3_En_13_Figd_HTML.jpg)\
  \ | 增加或减少小数位数。 | |\n\n如果你想恢复到“纯原始”数据，可以通过选择“常规”格式来实现。请记住，你不是在 Excel 中，并且不能仅格式化一部分数字——要么格式化整个字段，要么什么都不做。另外，无法通过按住\
  \ Ctrl 键单击来进行非连续选择以格式化不相邻的字段。并且，你无法选择多个相邻字段并一次性格式化它们。\n\n至此，你可能已经意识到 Power BI Desktop\
  \ 遵循“一次格式化，处处应用”的原则。然而，这并不意味着你必须在创建仪表板和报表之前就详尽地准备好数据。你可以随时在数据模型和报表视图之间切换以选择其他格式，并且确信刚刚应用的格式将用于所有使用了相关指标的仪表板。\n\
  \n> **注意：** 如果字段中的数据是文本或日期/时间数据类型，则无法选择数字格式。同样，只有字段包含可以解释为日期或时间的数据时，日期和时间格式才可用。只有布尔（真/假）数据类型可以格式化为真/假。最后，只有包含二进制数据的字段才能格式化为二进制。\n\
  \n#### 货币格式\n\nPower BI Desktop 会提供多种货币格式供你选择。要选择你想要的货币：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig8_HTML.jpg](img/370912_3_En_13_Fig8_HTML.jpg)\n\
  \n**图 13-8** 货币格式弹出列表\n\n1.  单击货币格式图标右侧的弹出按钮（朝下的三角形）。这将显示可用格式列表。\n2.  选择你想要的货币符号，或者滚动列表查看所有可用的货币格式，如图\
  \ 13-8 所示，然后单击“确定”。\n\n> **注意：** 应用的千位分隔符以及小数分隔符取决于应用格式的电脑设置。\n\n## 为仪表板准备数据\n\n\
  将数据整合到一个能够为仪表板提供动力的结构中，除了为最终呈现指定数据类型和格式之外，还需要进行一些良好的调整。作为仪表板基础工作的一部分，你可能还需要：\n\n\
  -   对数据进行分类\n-   应用默认汇总方式\n-   定义排序依据字段\n-   隐藏字段\n\n这些概念乍一看可能有些深奥，让我们实际操作一下，以明确为什么需要为数据模型添加这些调整。\n\
  \n\n\n### 数据分类\n\nPower BI 仪表板并非仅仅由事实和数据构成。它们还可以包含地理数据或指向网站或文档的超链接。虽然我们人类能够比较容易地识别出\
  \ `URL`，并且可以猜测出包含邮政编码的字段中包含的是邮政编码，但对于计算机来说，这些直觉可能并非那么显而易见。因此，如果你希望 Power BI 能够（例如）添加地图或超链接，那么如果你对包含用于地图和链接的数据类型的任何字段进行分类，将为你自己和应用程序都带来便利。\n\
  \n例如，假设你想将 `Countries` 表准备为仪表板地图的潜在数据源（假设你已经加载了 `CarSalesDataFromDataModel.pbix`\
  \ 示例文件）：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig9_HTML.jpg](img/370912_3_En_13_Fig9_HTML.jpg)\n\
  图 13-9：数据类别选项\n\n1.  在数据视图中，从字段列表中选择 `Countries` 表。`Countries` 表中的数据将显示在 Power BI\
  \ Desktop 窗口的中心。\n2.  单击 `CountryName` 字段内部。该字段将被高亮显示。\n3.  在列工具功能区中，单击数据类别按钮右侧的弹出菜单。你可以看到图\
  \ 13-9 中显示的这个上下文菜单。\n4.  从菜单中选择 `国家/地区`。\n\n功能区将显示“数据类别：国家/地区”。这意味着 Power BI Desktop\
  \ 现在知道如何将字段内容用作仪表板中生成地图的国家。\n\n可用的数据类别选项在表 13-5 中进行了描述。\n\n**表 13-5：数据类别选项**\n\n\
  | 数据类别选项 | 描述 |\n| --- | --- |\n| 未分类 | 适用于不用于超链接或创建地图的数据。 |\n| 地址 | 为制图指定一个地址。\
  \ |\n| 地点 | 为制图指定一个位置或地点。 |\n| 城市 | 为制图指定一个城市。 |\n| 县 | 为制图指定一个县。 |\n| 州或省 | 为制图指定一个州或省。\
  \ |\n| 邮政编码 | 为制图指定一个邮政编码（ZIP 码）。 |\n| 国家/地区 | 为制图指定一个国家或地区。 |\n| 大洲 | 为制图指定一个大洲。\
  \ |\n| 纬度 | 为制图指定一个纬度。 |\n| 经度 | 为制图指定一个经度。 |\n| Web URL | 指示超链接的 `URL`。 |\n| 图像\
  \ URL | 指示仪表板中图像来源的 `URL`。 |\n| 条形码 | 指定该字段包含条形码。 |\n\n**注意：** 不指定数据类别并不意味着 Power\
  \ BI Desktop 不能在仪表板中创建地图或识别 URL。但是，除非你向应用程序指明某个字段包含特定类型的数据，否则无法保证结果有合理的成功机会。\n\n\
  ### 应用默认汇总\n\n在创建仪表板时，你通常会对数字数据进行聚合。大多数情况下，这意味着对数字求和以返回字段总计。但是，可能存在某些数据字段你希望应用其他聚合方式。请执行以下操作来设置你自己的默认聚合（假设你已经加载了\
  \ `CarSalesDataFromDataModel.pbix` 示例文件）：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig10_HTML.jpg](img/370912_3_En_13_Fig10_HTML.jpg)\n\
  图 13-10：默认汇总弹出菜单\n\n1.  在数据视图中，从字段列表中选择 `Colors` 表。Colors 数据将显示在 Power BI Desktop\
  \ 窗口的中心。\n2.  单击 `Color` 字段内部。该字段将被高亮显示。\n3.  在列工具功能区中，单击汇总按钮右侧的弹出菜单。弹出汇总菜单，如图 13-10\
  \ 所示。\n4.  从上下文菜单中选择 `计数`。\n\n功能区将显示“默认汇总：计数”。\n\n可用的默认汇总选项在表 13-6 中进行了描述。\n\n**表\
  \ 13-6：默认汇总选项**\n\n| 默认汇总选项 | 描述 |\n| --- | --- |\n| 不汇总 | 此字段中的数据不进行汇总。 |\n| 求和\
  \ | 此字段中的数据被加总（求和）。 |\n| 平均值 | 返回此字段中数据的平均值。 |\n| 最小值 | 返回此字段中数据的最小值。 |\n| 最大值 |\
  \ 返回此字段中数据的最大值。 |\n| 计数 | 返回此字段中的元素个数。 |\n| 计数（非重复） | 返回此字段中独立（非重复）元素的个数。 |\n\n\
  显然，你只能对数值应用数学聚合。但是，你可以对任何类型的数据应用计数。\n\n**注意：** 指定默认聚合并不妨碍你在仪表板中覆盖该默认设置。它仅仅是设置了一个默认值，在从字段聚合数据时作为标准应用。在实际工作中，这非常有用，因为它可以减少你构建仪表板所花费的时间。\n\
  \n### 定义排序依据字段\n\n有时，你会希望仪表板可视化中的排序不是基于所选字段的内容，而是基于另一个字段的内容。例如，假设你有一个包含销售月份的数据表。如果你按月份排序，你可能不希望看到月份按字母顺序显示，从四月开始。在这种情况下，你可以告诉\
  \ Power BI Desktop，你希望按月*名称*元素，依据另一个字段中包含的月*份编号*进行排序。\n\n1.  加载 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataFromDataModel.pbix` 示例文件（当然，前提是你尚未加载它）。\n2.  在数据视图中，从字段列表中选择 `DateDimension`\
  \ 表。日期数据将显示在 Power BI Desktop 窗口的中心。\n3.  单击 `MonthFull` 字段内部。该字段将被高亮显示。\n4.  在列工具功能区中，单击“按列排序”按钮，并从可用字段列表中选择\
  \ `MonthNum`。\n\n现在，如果你在可视化中按 `MonthFull` 排序，你会看到月份按你可能预期的顺序显示——从一月到十二月。如果你*没有*应用按列排序，那么日历月份将按字母顺序排序，即从四月到九月！同样，此选择适用于你在\
  \ Power BI Desktop 仪表板中创建的、基于此数据模型的*任何*可视化。因此，请记住在数据源处，在文本字段（如日期等）旁边添加数字排序字段。\n\n\
  要移除按列排序，请保持选中该字段，只需再次单击“按列排序”按钮，然后从可用字段列表中选择原始字段名称即可。\n\n**提示：** 如果你想查看哪个字段已被设置为排序依据字段，只需单击要排序的字段内部，然后单击排序依据字段按钮。字段弹出列表会在用于对所选字段进行排序的字段左侧显示一个勾选标记。\n\
  \n本章的示例文件（`CarSalesDataFromDataModel.pbix`）已经包含了你可以用作排序依据字段的字段。在实际工作中，你的源数据可能并非总是如此立即可用。因此，请记住，你随时可以切换到\
  \ Power BI Desktop 查询编辑器，并使用额外的字段来增强源表，然后你便可以在数据视图中使用这些字段对数据进行排序。\n\n\n\n### 隐藏用户界面中的表和字段\n\
  \n一个数据模型可能包含的字段远多于创建报表和仪表板所需的字段。这些字段可能包括（但不限于）：\n\n- `排序依据列`\n- 已出现在层次结构中的字段（稍后几页会看到）\n\
  - 包含中间计算结果的字段（下一章会解释）\n- 包含“以防万一”加载但目前并不需要的数据的字段\n\n因此，为了清晰起见，您可能希望隐藏与分析非严格相关的字段（甚至是整个表）。这不仅减少了杂乱，还能避免新用户开始使用您创建的数据模型时产生困惑。同时，这也能确保只有必要的数据可见。\n\
  \n#### 隐藏字段和表\n\n作为第一步，您需要将字段（或表，如果愿意的话）标记为隐藏。操作方法如下：\n\n1.  单击要隐藏的字段或表。\n2.  从弹出菜单中选择`在报表视图中隐藏`。\n\
  \n隐藏的字段和表暂时仍会显示在`字段`列表中，但会变为灰色。尽管如此，隐藏的字段以及隐藏表中的字段仍然可以在可视化对象中使用。\n\n要重新显示隐藏的字段或表，只需右键单击相应的字段或表，然后在弹出菜单中取消选中`在报表视图中隐藏`选项。\n\
  \n#### 从视图中移除隐藏的字段和表\n\n如果您的目标是“整理”`字段`列表，您可以完全从视图中移除隐藏的字段和表，操作如下：\n\n1.  单击`字段`列表中的任意表或字段，然后在弹出菜单中取消选中`查看隐藏项`选项。\n\
  \n所有隐藏的字段和表将从`字段`列表中消失。要重新显示所有隐藏的字段和表，只需在弹出菜单中选中`取消全部隐藏`选项即可。\n\n### 在 Power BI\
  \ Desktop 表中对数据进行排序\n\nPower BI Desktop 表可能包含数百万行，因此您最不愿意做的就是在一个随机数据集中向下滚动。幸运的是，在表中排序数据很简单：\n\
  \n1.  激活包含要排序字段的表。\n2.  在表中（不是在`字段`列表中），右键单击您想要排序数据的字段内部。我将选择`Stock`表中的`Make`字段。\n\
  3.  在上下文菜单中点击`升序排序`选项，以升序（字母顺序）对该字段进行排序。\n\n该表使用所选字段作为排序键进行排序，即使是大型数据集也能在极短时间内正确排序。如果您想按降序（反向字母顺序或从大到小顺序）对表进行排序，请单击上下文菜单中的`降序排序`选项。\n\
  \n此时，您需要记住，数据模型并非真正为交互式数据分析而设计。那是仪表板的功能。因此，您不应期望像使用大型 Excel 电子表格那样使用 Power BI Desktop\
  \ 中的数据表。\n\n**提示**  \n如果您需要视觉指示表明某个字段已排序，请查看字段名称的右侧。您会看到一个小箭头，箭头向上表示降序排序，向下表示升序排序。\n\
  \n如果您想移除应用的排序操作并返回到最初导入的数据集，您只需单击该字段上下文菜单中的`清除排序`图标即可。\n\n**注意**  \n您无法执行复杂的排序操作；也就是说，您不能先对一个字段进行排序，然后再对另一个字段进行次级排序（如果第一个字段中存在相同元素）。您也无法先按最不重要的字段排序，然后逐步向上到最重要的字段进行排序，以实现复杂排序的效果。这是因为\
  \ Power BI Desktop 始终根据最初加载的数据集对数据进行排序。请记住，您可以在 Power BI Desktop Query 中添加索引字段（如第\
  \ 8 章所述），然后如果需要重新应用初始排序顺序，可以基于这些索引字段进行排序。\n\n### 创建和修改组\n\n有时，列表中有多个单独项，您希望将不同的值集合收集到组中。这可能是为了获取不同子域的更高级别视图，或者仅仅是为了从记录集中隔离某些值。在以下情况下，这尤其有用：\n\
  \n-   将一组不同的值可视化为单个元素\n-   将“长尾”值归入一个类别\n\n**提示**  \n如果您愿意，可以将组视为“水平”组织，而层次结构则对应于“垂直”选择。\n\
  \n#### 创建一个组\n\n假设您将频繁使用一组颜色作为仪表板中表格和图表的基础。以下是如何创建一个包含可用颜色子集的组：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig11_HTML.jpg](img/370912_3_En_13_Fig11_HTML.jpg)\n\
  \n**图 13-11** – “组”对话框\n\n1.  单击 Power BI Desktop 窗口左上角的`数据`图标。\n2.  选择`Colors`表。\n\
  3.  单击`Color`字段内部。\n4.  在`列工具`功能区中，单击`新建组`图标。将出现“组”对话框。\n5.  在`名称`字段中，输入组的名称。在此示例中，我将使用\
  \ `PowerColors`。\n6.  在左侧的未分组值列表中，按住 Ctrl 键并单击以下五个元素：\n    1.  Black\n    2.  Blue\n\
  \    3.  British Racing Green\n    4.  Dark Purple\n    5.  Green\n7.  单击`分组`。\n\
  8.  重命名颜色组（当前已高亮显示）。\n9.  按 Enter 键。对话框将如图 13-11 所示。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig12_HTML.jpg](img/370912_3_En_13_Fig12_HTML.jpg)\n\
  \n**图 13-12** – 一个组字段\n\n10. 单击`确定`。将创建一个包含组定义的新字段，如图 13-12 所示。组的名称成为新字段的名称。\n\n\
  您现在可以在视觉对象中使用此字段来对元素进行分组。您将在第 16 章中看到更详细的说明。\n\n创建组时有几点需要注意：\n\n-   选中`包含其他组`复选框将提取原始字段中的所有剩余项，并用它们创建一个“其他”组。\n\
  -   您可以创建多个组。只需根据需要分组的次数重复执行步骤 6 和 7 即可。\n-   原始字段中的任何值在组中不能出现多次。\n\n#### 修改组\n\n\
  任何现有的组都可以轻松更改，只需执行以下操作：\n\n1.  单击包含要修改的组的字段内部。\n2.  在`列工具`功能区中，单击`编辑组`图标。将出现“组”对话框。\n\
  3.  通过单击右侧`组和成员`列表中的值来从组中移除任何项目。然后单击`取消分组`。\n4.  通过选择左侧的项目，然后在右侧选择相应的组后，单击`分组`按钮来添加任何新值。\n\
  5.  单击`确定`。修改后的组将应用于所选字段。\n\n#### 删除组\n\n由于组本质上就是一个字段，因此删除组的方法与删除字段完全相同：\n\n1. \
  \ 在`字段`列表中，展开包含新字段的表。您会看到组字段在字段名称左侧有一个带有两个空心方块的小图标。\n2.  右键单击该组字段并选择`删除`。\n3.  确认删除。\n\
  \n**注意**  \n您可以在一个表中“混合搭配”使用组。例如，您可以将表中的所有单独值分配到不同的组，或者您可以创建多个组来处理某些值，同时将其他值保留在组外。\n\
  \n\n\n### 将表标记为日期表\n\n现在，Power BI Desktop 需要知道您导入的表实际上是一个日期表，它可以利用该表来添加时间智能功能。这操作起来比描述起来要简单：\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig13_HTML.jpg](img/370912_3_En_13_Fig13_HTML.jpg)\n\
  \n**图 13-13** `标记为日期表`对话框\n\n1.  切换到数据视图。\n2.  单击 `DateDimension` 表。\n3.  在“表工具”功能区中，单击`标记为日期表`按钮。将出现`标记为日期表`对话框。\n\
  4.  选择包含连续日期列表的列。在本书使用的示例中，它是 `DateKey` 列。该对话框应如图 13-13 所示。\n5.  单击`确定`。\n\n现在，Power\
  \ BI Desktop 知道此表有些特殊，并且它只包含一个可用于为分析添加时间智能的日期列表。最后要做的，是在日期表中的 `DateKey` 列与包含要随时间分析的数据的表中的日期字段之间定义关系。在我们使用的示例数据中，这将是\
  \ `SalesDate` 表中的 `InvoiceDate` 字段。通过这种方式，数据集知道您可能正在按发票日期查看销售情况，但 `DateTable` 将提供用于显示随时间变化的指标的天、月、季度和年列表。\n\
  \n> **注意**：可以在 Excel、DAX 或 M 中创建日期维度。但是，所需的技术超出了本书的范围。\n\n## 设计 Power BI Desktop\
  \ 数据模型\n\n恭喜！您已经在为自助式商业智能 (BI) 开发高性能数据模型的道路上取得了长足进步。您已将来自一个甚至多个源的数据导入到 Power BI\
  \ Desktop 数据模型中。您已使用 Power BI Desktop 数据模型窗口仔细查看了数据，并且可以执行重命名表和字段等基本操作。确保数据集准备就绪、可用作自助式\
  \ BI 数据仓库的最后一步是创建和管理表之间的关系。这是在 Power BI Desktop 中设计连贯且可用数据集的基础部分。\n\n在深入探讨表关系的技术细节之前，我们首先需要回答几个简单的问题：\n\
  \n-   什么是表之间的关系？\n-   我们为什么需要它们？\n\n表关系是数据表之间的链接，允许一个表中的字段在另一个表中被有意义地使用。如果您打开了 Power\
  \ BI Desktop 示例文件 `CarSalesDataFromDataModel.pbix`，您可以看到有一个包含库存数据的 `Stock` 表，其中包含\
  \ `ColorID` 字段，但不包含实际颜色本身。作为补充，有一个名为 `Colors` 的颜色参考表。由此可知，如果我们想说明购买汽车时的颜色，就需要能够链接这些表，以便\
  \ `Stock` 表可以“查找”所购汽车的实际颜色。这需要两个表之间存在某些共性，幸运的是，两者都包含一个名为 `ColorID` 的字段。因此，如果我们能够使用此字段联接两个表，就可以看到库存中每辆车的颜色\
  \ ID 所代表的颜色。\n\n如果您查看 `Invoices` 和 `InvoiceLines` 表，可以看到链接表的另一个示例。这两个表是使用一种称为关系建模的技术设计的。这本质上意味着创建了两个表以避免无意义的数据重复。因此，任何用于描述发票的数据（例如发票日期或发票号码）都存储在\
  \ `Invoices` 表中，而所有关于已售车辆详细信息的都保存在一个名为 `InvoiceLines` 的单独表中。然后，这两个表共享一个允许它们联接的字段，以便用户在需要时可以一起查看两个表中的数据。这意味着，任何可能重复的元素都存储在“标题”表中，例如\
  \ `Invoices` 表，而非重复数据则存储在明细表（本例中为 `InvoiceLines` 表）中。\n\n将这两个表的数据存储为一个表是可能的。然而，这意味着每当发票包含多个项目时，都需要重复发票日期或发票号码等元素。这将导致数据元素重复并大幅增加文件大小。\n\
  \n显然，这些例子非常简单。但它们并非过度做作。它们代表了许多关系数据库存储数据的方式。因此，您有很大机会在从公司数据库导入的现实世界数据中看到类似的潜在链接或关系。无论如何，如果您想在数据分析中使用来自多个源的数据，您必须找到一种方法，使用公共字段（比如我刚刚提到的\
  \ `ColorID` 字段）来链接这些表。实际情况可能更复杂（例如，两个表中的字段名称可能不同），但该原则始终适用。\n\n> **提示**：如果您拥有必要的权限以及\
  \ SQL 知识，则可以使用查询直接在源数据库中联接表。这样，您就可以从一开始就在 Power BI Desktop 中创建更少的“扁平化”表，并避免在 Power\
  \ BI Desktop 中创建蜘蛛网般的新表关系。\n\n### Power BI Desktop 环境中的数据建模\n\n在深入探讨创建和增强数据模型的具体细节之前，我认为最好先熟悉一下建模功能区，它是数据建模的起点。\n\
  \n#### 建模功能区\n\n建模功能区用于对数据和表进行分类和组织，以及添加计算字段和附加指标，并对数据进行分类和格式化。它包含的按钮如图 13-14 所示，并在表\
  \ 13-7 中进行了解释。\n\n**表 13-7** “列工具”功能区按钮\n\n| 按钮 | 描述 |\n| --- | --- |\n| `管理关系`\
  \ | 允许您联接表，以及删除这些联接（称为*关系*）并对其进行修改。 |\n| `新建度量值` | 用于向表添加新值或计算。 |\n| `新建快速度量值` |\
  \ 用于在 Power BI Desktop 的帮助下向表添加新值或计算。 |\n| `新建字段` | 向表添加新的计算字段。 |\n| `新建表` | 添加一个新表。\
  \ |\n| `假设参数` | 允许您添加一个新的交互式“假设”参数。 |\n| `管理角色` | 允许您限制给定用户的数据访问权限。 |\n| `以角色身份查看`\
  \ | 让您查看给定角色可用的数据。 |\n| `Q&A 设置` | 指导 Power BI 自然语言界面更好地理解问题。 |\n| `设置语言` | 选择 Q&A\
  \ 使用的语言。 |\n| `设置语言架构` | 导入、导出或编辑 Q&A 使用的语言架构。 |\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig14_HTML.jpg](img/370912_3_En_13_Fig14_HTML.jpg)\n\
  \n**图 13-14** “列工具”功能区中的按钮\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将以下英文文本翻译成中文。\n\
  \n\n#### 数据视图和模型视图\n\n`Power BI Desktop` 允许你通过两种不同但互补的方式查看数据模型。当你需要所有数据表的高层级概览时，应使用`模型视图`，因为它能让你从细节中抽离出来，将数据集视为一个整体。以下是操作方法：\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig15_HTML.jpg](img/370912_3_En_13_Fig15_HTML.jpg)\n\
  \n**图 13-15** 模型视图\n\n1.  点击 `Power BI Desktop` 窗口左侧的`模型视图`按钮。`Power BI Desktop`\
  \ 将在`模型视图`中显示这些表，如图 13-15 所示。\n\n从图 13-15 可以看出，你现在看到的是大部分或全部表，虽然可以看到表名和字段名，但看不到数据。不仅如此，你还可以看到一些表已经建立了联接——尽管并非全部。这是因为\
  \ `Power BI Desktop` 总是会尝试猜测表之间任何可能的关系，并在可能的情况下自动创建关系，以节省你的时间和精力。\n\n这正是我们所需要的，因为现在是从整体结构而非细枝末节的角度进行思考的时候了。你可以使用此视图来移动和调整表的大小。移动表只需拖动表的标题栏即可。调整表的大小则需要将指针放在表边缘或角落上，然后拖动鼠标。\n\
  \n> **技巧提示**  \n> 尽管重新排列表的位置可以被视为纯粹的审美需求，但我认为这样做非常有用。布局良好的数据集设计有助于你理解表之间的关系以及数据的固有结构。\n\
  \n#### 模型视图显示选项\n\n`模型视图`的全部意义在于让你能够清晰地查看整个数据集，并在必要时修改布局，从而更清晰地查看表之间的关系。\n\n## 创建关系\n\
  \n一旦知道表之间哪些字段是共通的，创建关系就很容易了。既然我们已经确定需要将`颜色`表联接到`库存`表，那么让我们看看如何使用文件 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForLinkingTables.pbix` 来执行此操作。此文件包含本章目前为止所见的数据表，但表之间没有任何关系。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig16_HTML.jpg](img/370912_3_En_13_Fig16_HTML.jpg)\n\
  \n**图 13-16** 表关系\n\n1.  打开文件夹 `C:\\PowerBiDesktopSamples` 中的 `Power BI Desktop`\
  \ 文件 `CarSalesDataForLinkingTables.pbix`。\n2.  将`库存`表中的 `ColorID` 字段拖到`颜色`表中的 `ColorID`\
  \ 字段上，如图 13-16 所示。\n\n只需执行这些操作即可。现在，这两个表已经联接，来自两个表的数据可以在报告和仪表板中有意义地使用。\n\n> **注意**\
  \  \n> 目前，在 `Power BI Desktop` 数据模型中，你只能基于单个字段联接表。在 `Power BI Desktop 查询编辑器`中准备查询以供数据模型后续使用时，可能需要考虑到这一点。\n\
  \n### 手动创建关系\n\n你不必通过拖放字段名来创建关系。如果你愿意，可以指定用于在表之间创建关系的表和字段。此外，你不必非要处于`模型视图`中来执行此操作。所以，为了说明问题并向你展示\
  \ `Power BI Desktop` 的灵活性，在本示例中，你将根据其共同的 `InvoiceID` 字段来联接`发票`表和`发票行`表：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig17_HTML.jpg](img/370912_3_En_13_Fig17_HTML.jpg)\n\
  \n**图 13-17** `创建关系`对话框\n\n1.  选择一个你想要使其出现在关系中的表。本示例我将使用`发票`表。\n2.  点击`建模`功能区中的`管理关系`按钮（如果你在`数据视图`中，则点击`表工具`功能区中的该按钮）。将出现`管理关系`对话框。\n\
  3.  点击`新建`。将出现`创建关系`对话框。\n4.  在对话框的上半部分，从表的下拉列表中选择`发票`表。\n5.  在对话框的下半部分，选择`发票行`表作为相关的查找表。`InvoiceID`\
  \ 字段应自动显示为要联接的字段（它将在两个表中都被选中）。如果 `Power BI Desktop` 已猜出该字段，它将显示为选中状态。如果没有猜中，或者猜错了，你总可以为两个表选择正确的字段。`创建关系`对话框应如图\
  \ 13-17 所示。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig18_HTML.jpg](img/370912_3_En_13_Fig18_HTML.jpg)\n\
  \n**图 13-18** `管理关系`对话框\n\n1.  点击`确定`。`创建关系`对话框将关闭，并返回到`管理关系`对话框。此时它应如图 13-18 所示。你可以看到，它指示了哪个表中的哪个字段用于联接到哪个其他表中的哪个其他字段。\n\
  2.  点击`关闭`。`管理关系`对话框将关闭，并且关系将被创建。\n\n### 自动创建关系\n\n无论数据源是什么，你都可以让 `Power BI Desktop`\
  \ 自动检测关系。这种方法有几个优点：\n\n-   你可以避免大量手动工作。\n-   你可以减少出错的风险（例如，在错误的字段上创建表之间的关系，甚至在不相关的表之间创建关系）。\n\
  \n这项技术非常简单易行。你只需执行以下操作：\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig19_HTML.jpg](img/370912_3_En_13_Fig19_HTML.jpg)\n\
  \n**图 13-19** `自动检测`对话框\n\n1.  点击`开始`功能区中的`管理关系`按钮。将出现`管理关系`对话框。\n2.  点击`自动检测`。几秒钟后，将出现如图\
  \ 13-19 所示的对话框。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig20_HTML.jpg](img/370912_3_En_13_Fig20_HTML.jpg)\n\
  \n**图 13-20** 自动检测关系后的`管理关系`对话框\n\n1.  点击`关闭`。`管理关系`对话框将列出数据模型中的所有关系——既有预先存在的关系，也有自动检测过程发现的关系。`管理关系`对话框现在应如图\
  \ 13-20 所示。\n2.  点击`关闭`以返回到`关系视图`。\n\n你将看到，你刚刚导入的表已经拥有了在 `Power BI Desktop` 中生成的关系。\n\
  \n### 删除关系\n\n除了创建关系之外，你不可避免地也会想在某些时候删除它们。这既是直观的也是可视化的操作。\n\n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig21_HTML.jpg](img/370912_3_En_13_Fig21_HTML.jpg)\n\
  \n**图 13-21** `删除关系`对话框\n\n1.  点击`开始`功能区中的`设计视图`按钮。`Power BI Desktop` 将在`模型视图`中显示这些表。\n\
  2.  选择你想要删除的关系。连接两个表的箭头将变为双链接，并且两个表将被高亮显示。\n3.  右键单击并选择`删除`（或按 `Delete` 键）。将出现`确认`对话框，如图\
  \ 13-21 所示。\n4.  点击`删除`。\n\n该关系将被删除。但是，这些表将保留在数据模型中。\n\n\n\n### 管理关系\n\n如果你希望更改表中作为关系基础的字段，你还有另一种选择。可以使用“`管理关系`”对话框。如果你想要一次性创建或删除多个关系，这种方法也可能很有用。要使用此对话框：\n\
  \n1. 在“`主页`”功能区的“`设计`”选项卡中，点击“`管理关系`”。将出现“`管理关系`”对话框，如图 13-18 之前所示。\n2. 点击你想要修改的关系。\n\
  3. 点击“`编辑`”（或双击该关系）。将出现“`编辑关系`”对话框（它与图 13-17 中显示的“`创建关系`”对话框几乎完全相同）。\n4. 按照前述步骤继续修改关系。\n\
  \n如你从该对话框所见，你还可以选择创建或删除关系。由于这些过程与我已描述的步骤完全相同，因此不再赘述。\n\n用于创建和管理关系的技术本身并不难掌握。然而，在数据集的表之间建立正确的关系是*绝对基础*的。简而言之，如果你试图在单个\
  \ Power BI Desktop 仪表板中使用来自无关联的表的数据，你不仅会收到需要创建关系的警报，还会得到明显不准确的结果。基本上，你所有的分析都会是错误的。因此，值得预先花几分钟时间设计一个清晰、准确且逻辑一致的数据集。\n\
  \n> **提示：** 在“`模型`”视图中双击某个关系，也会显示“`编辑关系`”对话框。\n\n### 停用关系\n\n如果你不再需要表之间的某个关系，但又不想删除它，你也可以选择停用该关系。这意味着该关系不再生效，但你可以快速轻松地重新激活它。\n\
  \n停用（或重新激活）关系非常简单，只需选中或取消选中“`管理关系`”对话框中（如前文图 13-18 所示）“`活动`”字段的复选框即可。\n\n## 高级关系选项\n\
  \n“`编辑关系`”对话框中包含一些你可能偶尔会用到的几个高级选项。这些选项包括在定义数据模型结构时必须考虑的两个基本选项：\n\n*   基数\n*   交叉筛选方向\n\
  \n以下两个小节将分别讨论这些主题。\n\n### 基数\n\n基数定义了在一个表中，有多少字段与链接表中的匹配字段相关联。你可以在图 13-22 的基数弹出窗口中看到可用的选项。\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig22_HTML.jpg](img/370912_3_En_13_Fig22_HTML.jpg)\n\
  \n*图 13-22：表关系中的基数*\n\n这些不同的选项在表 13-8 中进行了描述。\n\n**表 13-8：Power BI Desktop 关系类型**\n\
  \n| 关系选项 | 描述 |\n| --- | --- |\n| 多对一 | 指定一个表中的多条记录与连接表中的单条记录映射。 |\n| 一对一 | 指定一个表中的单条记录与连接表中的单条记录映射。\
  \ |\n| 一对多 | 指定一个表中的单条记录与连接表中的多条记录映射。 |\n| 多对多 | 指定一个表中的多条记录可能与另一个表中的多条记录连接。 |\n\
  \nPower BI Desktop 几乎总能检测到关系的正确基数。但是，例如，如果你因为怀疑将来可能需要另一种基数类型而想要覆盖软件所做的选择，那么你只需从弹出列表中选择你想要的基数即可。\n\
  \n#### 基数问题\n\n遗憾的是，数据并不总是完美的。因此，有时当你选择用来连接两个表的基数时，在创建仪表板时可能会得到奇怪的结果。\n\n不可能涵盖所有可能引发此错误的多种原因。因此，如果你看到此消息，以下是一些提示，希望能在你遇到此问题时帮你理清头绪：\n\
  \n*   对于一对多基数，请确保关系“一”方的字段值对应着“多”方的*所有*相应值。\n*   对于一对一基数，请检查表关系两侧的字段*没有重复值*。\n*\
  \   对于一对一基数，请确保表关系两侧的字段没有空值或 Null 值。\n*   对于一对多基数，请确保关系“一”方的字段值不包含空值或 Null 值。\n\n\
  \n\n### 管理表之间的关系\n\n在 Power BI Desktop 中管理关系通常是创建高效数据模型的关键。然而，提供完整的数据建模课程超出了本书的范围。不过，在创建初始数据模型时，这里有一些提示值得牢记：\n\
  \n-   以*主*表和*查找*表的角度来思考会有所帮助。在你本章学习的数据模型中，可以将某些表视为主数据的查找表，例如 `Colors`、`Countries`\
  \ 和 `Clients` 表。\n\n-   查找表通常包含一系列在表中不重复的值（例如，国家列表）。这些值被称为关系的“一”端，并连接到另一个在多个场合引用它们的表。因此，包含多个引用的表被称为关系的“多”端。数据库和数据仓库设计者也将此称为关系的*基数*。\n\
  \n-   如果你查看图 13-15（Power BI Desktop 模型视图），可以看到不同类型的关系在相关表之间的连接中已标明。关系末端的一个小 1 表示关系的“一”端，而一个星号表示关系的“多”端。\n\
  \n-   如果你的源数据包含许多通过一系列关系级联下来的查找表（一个经典案例是在许多零售环境中发现的类别 ➤ 子类别 ➤ 产品层次结构），为避免数据模型过于复杂，你可能更倾向于在\
  \ Power BI Desktop 中开发数据模型*之前*，使用 Power BI Desktop Query 将多个表合并为单个表。\n\n-   有时——这可能在从关系数据库导入数据时出现——你需要基于多个字段连接表。这在\
  \ Power BI Desktop 中无法实现。但通常可以找到变通方法，比如同样在数据建模前使用 Power BI Desktop Query。在这种情况下，你可以通过使用多个字段创建连接来合并表（如你在第\
  \ 8 章中所见）。\n\n-   从数据仓库导入的数据可能具有内置的事实表结构（包含度量的主表）和维度表（包含查找元素）。然而，你可能也想像此处一样，使用 Power\
  \ BI Desktop Query“扁平化”复杂的维度层次结构，并创建单层的查找元素表。\n\n-   有时你可能需要在不同上下文中两次使用同一个表。例如，日期表可能用于关联销售日期和采购日期。在这种情况下，你可以再次导入日期表（并为其指定另一个名称），然后从一个查找表到两个不同的查找表创建两个独立的连接。这允许你按独立的日期标准筛选和聚合数据。像这样的查找表通常被称为*角色扮演维度*。\n\
  \n-   可以在一个表和另一个表之间创建多个关系，并指定只有一个是活动的。然后，你可以使用 DAX 中的 `USERELATIONSHIP()` 函数强制计算应用非活动关系。然而，这已经开始涉及更复杂的数据建模层级，因此我在这里仅提及这种可能性。\n\
  \n#### 交叉筛选方向\n\n你可以在图 13-23 中看到两个交叉筛选选项。它们允许你指定筛选器是应用于连接表中所有表，还是仅应用于正在执行聚合的表。\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig23_HTML.jpg](img/370912_3_En_13_Fig23_HTML.jpg)\n\
  \n图 13-23\n\n表关系中的交叉筛选方向\n\n这两个选项在表 13-9 中进行了描述。\n\n表 13-9\n\n交叉筛选方向选项\n\n| 交叉筛选方向选项\
  \ | 描述 |\n| --- | --- |\n| 单向 | 对链接表的筛选器将应用于数据聚合所在表，但反之则不成立。 |\n| 双向 | 为了筛选目的，两个表被视为一个更大的表。所有表中的所有数据都将被筛选。\
  \ |\n\n### 其他关系选项\n\n关系剩余的基本选项是：\n\n- 使此关系成为活动关系\n- 假定引用完整性\n\n#### 使此关系成为活动关系\n\
  \n在某些数据模型中，表之间可能存在多个关系（基于不同字段）。但是，任何时刻只能有一个关系是活动的。选中“使此关系成为活动关系”复选框，可告知 Power BI\
  \ Desktop 所选关系是活动关系。不过，其他关系仍可在 DAX 代码中使用。\n\n#### 假定引用完整性\n\n此选项仅在使用 DirectQuery\
  \ 时可用（你在第 4 章中学习了如何使用）。根据定义，此选项仅适用于关系数据库。启用此选项可让 Power BI Desktop 向底层数据源发送更高效的查询。这意味着数据更新得更快。要使其生效，有几个基本要求：\n\
  \n-   关系中“来源”字段中的数据绝不能为 null 或空白。\n-   对于“来源”字段中的每个数据元素，在“目标”字段中都有一个对应的值。\n-   “来源”字段位于一对多关系中的“多”端，或者该关系是一对一的连接类型。\n\
  \n**注意**：你需要意识到，当底层数据不满足前述要求时，设置“假定引用完整性”选项并不会阻止该选项被应用，甚至不会阻止数据被返回。然而，结果可能是错误的。\n\
  \n## 重新导入相关表\n\n在结束本章时，有一点相当重要需要说明。即，如果你删除一组相关表，然后在未导入关系的情况下重新导入它们，Power BI Desktop\
  \ 将*不会*记住之前存在的关系。因此，你将不得不手动重新创建所有关系。如果你删除并重新导入任何在 Power BI Desktop 中已链接到现有表的表，情况也是如此——一旦通过删除表的过程移除了某个关系，你就必须重新创建它。\n\
  \n## 表和字段属性\n\nPower BI 数据模型会迅速变得极其复杂。因此，对其进行彻底文档化不仅重要，甚至可以说是*根本性*的。模型视图的“属性”窗格正是为此而设：\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig24_HTML.jpg](img/370912_3_En_13_Fig24_HTML.jpg)\n\
  \n图 13-24\n\n属性窗格\n\n1.  切换到模型视图。\n2.  单击你想要记录的表格。\n3.  在“属性”窗格中，单击“描述”字段内部并输入描述。“属性”窗格看起来会类似于图\
  \ 13-24 所示。\n\n单击字段名称可以同样的方式记录所选字段。\n\n“属性”窗格还允许你设置所选字段的以下属性：\n\n-   数据类型\n-   数字格式\n\
  -   字段可见性（这也适用于表）\n-   数据分类\n-   默认聚合方式\n-   按列排序（如果需要的话）\n\n\n\n## 添加层次结构\n\n当您希望\"\
  见树又见林\"时，数据组织便成为基础。因此，Power BI Desktop 允许您即时创建任意层次结构，以便更好地理解所呈现信息的结构。\n\n要创建层次结构（您可以在报表视图或数据视图中进行操作）：\n\
  \n![../images/370912_3_En_13_Chapter/370912_3_En_13_Fig25_HTML.jpg](img/370912_3_En_13_Fig25_HTML.jpg)\n\
  \n图 13-25 — 已添加的层次结构\n\n1. 选择 `Stock` 表。\n2. 右键单击将成为新层次结构中顶层元素的字段（此示例中为 `Make`）。\n\
  3. 选择 `New Hierarchy`。一个名为 `Make Hierarchy` 的新层次结构将出现在 `Stock` 表中，其中包含 `Make` 字段作为层次结构的顶层元素。\n\
  4. 将 `Model` 字段拖入新层次结构的标题中。`Model` 字段将被添加到层次结构中最高层级元素的下方。您可以在图 13-25 中看到这一点。\n\n\
  只需这些操作！现在，您可以将层次结构拖入报表画布，基于构成层次结构的多个元素创建表格。这些数据可用于任何位置——以及任何可视化对象中——只要这些位置或对象需要使用构成层次结构的多个字段。它们作为矩阵和向下钻取图表的基础特别有用，您将在第\
  \ 15 章和第 16 章中了解这些内容。\n\n当然，您可以像处理任何标准数据字段一样，重命名或删除层次结构或其内的任何层级。\n\n**提示：** 将字段添加到层次结构意味着该字段现在在表中存在两次——一次作为\"\
  独立\"字段，一次位于层次结构中。在大多数情况下，最好隐藏字段的原始版本，这样用户（和您自己）就不会在数据模型中看到该字段两次。\n\n## 结论\n\n本章全部内容涉及如何使用\
  \ Power BI Desktop 查询准备好的干净数据，并将其塑造成结构化和连贯的数据模型，该模型将成为您仪表板和报告的基础。\n\n首先，您了解了如何查看数据模型中现在可用的整个数据集。这包括对数据进行排序和调整字段宽度。\n\
  \n然后您学习了如何确保每个字段被定义为具有适当的数据类型。之后，您直接将未来仪表板元素所需的任何数字格式应用于数据模型。您还了解了如何准备某些类型的字段以用于地图或提供超链接。\n\
  \n最重要的是，您学习了如何创建表关系，将所有不同的数据源整合到一个联合数据模型中，该模型现已成为深度分析的基础。在大多数情况下，这将是数据模型中最重要的一方面。简而言之，一个良好、干净且结构清晰的数据模型将使您能够充分利用数据可视化——这正是本书剩余章节的主题。\n\
  \n"
- "# 14. 表可视化\n\n您现已进入冲刺阶段，目标交付清晰、有力且视觉上引人入胜的分析。是时候将数据转化为引人注目的仪表板，以激发观众的想象力。在本章中，您将开始学习如何使用\
  \ Power BI Desktop 来：\n\n- 深入挖掘数据，从大量可用的数据和事实中提炼出有价值的信息\n- 创建交互式的见解视图，以便快速轻松地测试您的分析\n\
  - 增强结果的呈现，以吸引观众的注意力\n\n本章及下一章将带您了解在 Power BI Desktop 中创建基于文本的可视化（如果您愿意，也可称之为视觉对象）的过程。在这两章中，您将学习如何创建和增强：\n\
  \n- 表\n- 矩阵\n- 卡片\n- 多行卡片\n\n这些可视化类型的共同点是它们旨在使用*文本*来传达信息，而不是使用更图形化的显示类型（您将在第 16\
  \ 章至第 20 章中了解这些类型）。基于文本的可视化在以下场景中至关重要：\n\n- 呈现详细信息的列表\n- 显示关键数据的交叉部分\n- 将观众的注意力集中在单个关键数字上\n\
  - 提供几个关键指标的清晰概览\n- 向下钻取数据层次结构\n\n由于您正处于学习曲线的第一步，本章将仅专注于您在 Power BI Desktop 中可以使用*表*数据所做的所有操作。这将使您熟悉核心技巧，然后您可以将这些技巧应用于其他基于文本的可视化——以及\
  \ Power BI Desktop 允许您用于交付分析的大部分（如果不是全部）图形和地理可视化。\n\n本章中学到的技巧将使用一个名为 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix` 的 Power BI Desktop 文件。该文件可在 Apress 网站上作为本书随附的可下载资料的一部分获取。\n\
  \n## Power BI Desktop 报表视图\n\n到目前为止，在本书中，您已经使用了 Power BI Desktop 三个核心界面模式中的两个：数据视图和关系视图。现在，您将开始创建报告和仪表板，因此将使用三部曲的最后一部分：报表视图。\n\
  \n您始终使用报表视图来构建您的仪表板（或报告，如果更偏好此说法）。正是在这里，您添加和配置使用数据模型中已加载、清理、结构化和增强的数据的可视化。此活动在 Power\
  \ BI Desktop 的报表画布中进行。\n\n### 切换到报表视图\n\n尽管报表视图是打开 Power BI Desktop 时的默认模式，但如果您花费了时间处理底层数据模型，则需要切换回该模式。以下说明如何激活报表视图：\n\
  \n- 单击 Power BI Desktop 屏幕左上角的报表视图图标。\n\n您可以在图 14-1 中看到报表视图图标。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig1_HTML.jpg](img/370912_3_En_14_Fig1_HTML.jpg)\n\
  \n图 14-1 — Power BI Desktop\n\n\n\n## Power BI Desktop 窗口\n\n在进一步讲解之前，我想先说明一下 `Power\
  \ BI Desktop` 窗口，因为从现在开始，你将在这本书中经常使用它。`Power BI Desktop` 窗口包含了图 14-1 中概述的元素。\n\n\
  可以看到，`Power BI Desktop` 屏幕简洁明了。它所包含的各种元素在表 14-1 中进行了说明。\n\n**表 14-1** Power BI Desktop\
  \ 选项\n\n| 选项 | 说明 |\n| --- | --- |\n| Power BI 功能区 | 该区域包含了使用 `Power BI Desktop`\
  \ 开发仪表板时可供使用的主要选项。 |\n| 视图类型 | 这三个图标让你可以在仪表板视图（创建仪表板和报表）、数据视图（添加计算）和关系视图（连接不同来源的数据）之间切换。\
  \ |\n| 仪表板画布 | 这是主要区域，你可以在其中添加可视化效果并设计仪表板。 |\n| 可视化窗格 | 应用程序的这个区域特定于每种类型的可视化效果，并允许你设置仪表板上每个元素的特定属性。它还允许你筛选仪表板、页面和单个可视化效果。你也可以使用此窗格格式化可视化效果。\
  \ |\n| 字段列表 | 在这里你可以看到源数据中所有可用的字段，你可以使用它们来构建可视化效果。 |\n| 筛选器窗格 | 你应用于报表、当前页面或选定可视化效果的任何筛选器都会显示在此处。\
  \ |\n| 可视化效果调色板 | 该区域包含所有当前可用的可视化效果类型，你可以将其添加到仪表板。 |\n| 页面选择器 | 这些选项卡让你可以在报表的页面之间切换。\
  \ |\n| 其他窗格 | `Power BI Desktop` 中还有几个其他可用窗格。但是，它们会保持隐藏状态，直到你选择显示它们。你将在后续章节中学习如何使用这些窗格。\
  \ |\n\n`Power BI Desktop`（与大多数 Microsoft 应用程序一样）有多个可用的功能区。这些功能区将在本书中根据需要进行说明。\n\n\
  ### 视图类型\n\n在 `Power BI Desktop` 中，数据有三种主要视图。这些在表 14-2 中进行了概述。\n\n**表 14-2** 视图类型\n\
  \n| 选项 | 图标 | 说明 |\n| --- | --- | --- |\n| 报表视图 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Figa_HTML.jpg](img/370912_3_En_14_Figa_HTML.jpg)\
  \ | 这是在 `Power BI Desktop` 中创建报表（仪表板）的地方。它将是本书剩余章节的重点。 |\n| 数据视图 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Figb_HTML.jpg](img/370912_3_En_14_Figb_HTML.jpg)\
  \ | 此视图允许你查看已加载的数据。 |\n| 模型视图 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Figc_HTML.jpg](img/370912_3_En_14_Figc_HTML.jpg)\
  \ | 此视图（如第 13 章所示）允许你连接表以创建连贯的数据模型。 |\n\n在本章以及所有专门用于创建仪表板和报表的章节中，我们将主要在报表视图中工作。\n\
  \n## 处理表格\n\n表格可能是显示数据最简单、最基本的方式。但是，这种简单性不应减损其有用性。实际上，对于 `Power BI Desktop` 而言，普通的表格通常是默认的可视化效果。此外，正如你将在本章中看到的，对于非地理数据，表格是默认的呈现方式。\n\
  \n当然，我意识到花时间在一个通常被描述为直观的主题上似乎有些矛盾。对此，我只能说，虽然入门很容易，但要深入理解这个强大工具的所有潜力，确实需要一些解释。因此，我所采用的方法是尽可能彻底地介绍每个项目的所有可能性。因此，如果你还不需要所有细节，或者想略过复杂之处以便对整个主题有一个高层次的了解，可以随时向前（或向后）跳转。\n\
  \n\n\n### 创建基本表格\n\n以下示例通过在 Power BI Desktop 中创建一个初始表格来向您介绍表格功能，该表格将显示客户名单及其总销售额：\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig2_HTML.jpg](img/370912_3_En_14_Fig2_HTML.jpg)\n\
  \n*图 14-2 每个客户的销售额基本表格*\n\n1.  打开可下载示例中的 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件。\n2.  在“字段”列表中，展开 `Clients` 表。\n3.  将 `ClientName` 字段拖到仪表板画布上。此时将显示一个包含 Brilliant\
  \ British Cars 所有客户的表格。\n4.  保持新表格的选中状态，然后在“字段”列表中展开 `InvoiceLines` 表。\n5.  选中 `SalePrice`\
  \ 字段左侧的复选框。这会将每个客户的累计销售额添加到表格中。结果应如图 14-2 所示。\n\n这是一个非常小的表格。在实际应用中，您可能会遇到包含数千、数万（甚至数百万）条记录的表格。Power\
  \ BI Desktop 通过仅加载向下滚动列表时所需要的数据（从数据中的前几条记录开始），来加速大型数据集的显示。因此，在大型表格中向下滚动时，您可能会看到滚动条前进得有些缓慢。\n\
  \n如果某个表格包含您在可视化对象中使用过的字段，则在选择该可视化对象时，该表格名称会在“字段”列表中以黄色显示。通过展开“字段”列表中的表格，您可以随时查看为该表格选择了哪些字段。所使用的字段会立即显示在“字段”列表（作为已选字段）和“可视化”窗格的字段井中。为了让您习惯这一概念，请参见图\
  \ 14-3，该图展示了您刚刚创建的表格的这两个元素。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig3_HTML.jpg](img/370912_3_En_14_Fig3_HTML.jpg)\n\
  \n*图 14-3 可视化对象中使用的字段*\n\n作为一款精良产品，Power BI Desktop 并不会将字段添加到表格的方式局限于一种。以下是向表格添加字段的几种方法：\n\
  \n-   将字段名称拖到“可视化”窗格的字段井中\n-   在“字段”列表中选中字段（即勾选字段左侧的复选框）——前提是表格已被选中\n-   将字段拖到现有的可视化对象中\n\
  \n您可以随时向现有表格添加更多字段。需要牢记的关键点（如果您使用上述三种技术中的任何一种）是：必须*首先选择要修改的表格*。这只需在表格内部单击即可。单击后，您会立即看到表格处于活动状态，因为表格的边角以及每条边的中间会出现小尺寸控点。\n\
  \n> **注意：** 如果在添加字段之前没有选择现有表格，Power BI Desktop 将会使用您试图添加到表格的字段创建一个新的表格、图表或地图。如果误操作，只需删除这个新的可视化对象即可。\n\
  \n要创建另一个表格，只需在 Power BI Desktop 报表画布上任何现有可视化对象外部单击，然后像前面描述的那样开始选择字段。结果会创建一个新表格。Power\
  \ BI Desktop 始终会尝试在画布的空白区域创建新表格。您很快就会了解到如何重新排列这种默认布局。\n\n还有另一种创建表格的方法。即单击报表画布以确保取消选中所有现有可视化对象，然后在“可视化”窗格顶部的可视化对象选项板中单击表格图标。这将在报表画布上创建一个空白表格。您可以在图\
  \ 14-4 中看到此图标，以及一个示例空表格。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig4_HTML.jpg](img/370912_3_En_14_Fig4_HTML.jpg)\n\
  \n*图 14-4 表格图标*\n\n### 选择表格\n\n尽管可能显而易见，但我还是想提请您注意表格选择中的几个微妙之处，这些地方可能会让 Power BI\
  \ Desktop 的新手感到困惑：\n\n-   选择表格时，*避免*单击表格中的任何数据，因为这样会高亮显示该行并使其他数据变灰。除了影响可视性外，这还会应用交叉筛选——您可能不希望无意中应用此功能（您将在第\
  \ 22 章中了解相关内容）。\n-   始终通过单击数据外部来选择表格——或者更好的方法是，单击表格的顶部栏。您也可以单击表格边框来安全地选择它。\n\n>\
  \ **注意：** 如果您意外高亮显示了表格中的某一行（并因此使其余行变灰），只需再次单击该高亮行即可重置表格。\n\n### 删除表格\n\n假设您不再需要\
  \ Power BI Desktop 报表中的某个表格。删除它很简单：\n\n1.  选择表格。您可以通过单击表格内的任意位置来完成此操作。即使将鼠标指针移开表格，表格边框也会显示出来。\n\
  2.  按 `Delete` 键。\n\n选择表格的另一种方法是单击可视化对象（本示例中为表格）选中后右上角出现的选项按钮（省略号）。将显示该可视化对象的选项菜单。单击\
  \ `Remove` 选项将删除表格。您可以在图 14-5 中看到此上下文菜单。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig5_HTML.jpg](img/370912_3_En_14_Fig5_HTML.jpg)\n\
  \n*图 14-5 表格可视化对象选项菜单*\n\n删除表格非常容易，以至于您可能会误删，因此请记住，您可以通过按 `Ctrl+Z` 或使用 Power BI\
  \ 窗口功能区左上角的 `撤消` 箭头来恢复意外删除的表格。\n\n### 复制表格\n\n在许多情况下，您需要复制表格。可能有以下几个原因：\n\n-   您正在\
  \ Power BI Desktop 报表上创建新的可视化对象，并且需要该表格作为新元素（如图表）的基础。\n-   您正在报表之间复制可视化对象。\n-  \
  \ 您想保留一个表格示例，并在副本上尝试一些高级技巧，但希望保留旧版本作为安全选项。\n\n无论哪种情况，您需要做的（正如您所料）就是：\n\n1.  选择表格（如前所述）\n\
  2.  在“开始”功能区中，选择 `复制`（或按 `Ctrl+C`）\n\n要粘贴副本，请单击当前或新 Power BI Desktop 报表中任何可视化对象的外部，然后从“开始”功能区选择\
  \ `粘贴`（或按 `Ctrl+V`）。\n\n### 更改表格大小和位置\n\n可以使用您在第 1 章中简要了解到的技术来调整表格大小和移动表格（就像 Power\
  \ BI Desktop 报表中的任何其他可视化对象一样）。尽管您已经看到了这些可能性，但为了完整起见，我将在此处全面解释它们。\n\n#### 调整表格大小\n\
  \n调整表格大小非常容易。您需要做的就是单击任何表格控点并拖动鼠标。侧边的控点将改变表格宽度；顶部和底部的控点将改变表格高度；角控点通过更改所选角相邻两条边的尺寸来同时修改高度和宽度。\n\
  \n\n\n#### 移动表格\n\n移动表格就像将指针悬停在表格上方使其边缘显示，然后将其拖拽到新位置一样简单。\n\n在微调仪表板上可视化对象的位置时，您可能更愿意使用键盘。用于执行此操作的键盘选项如表\
  \ 14-3 所示。\n\n**表 14-3**  \n**移动可视化对象的键盘快捷键**\n\n| 选项 | 说明 |\n| --- | --- |\n| 向左微移\
  \ | 左光标键 |\n| 向右微移 | 右光标键 |\n| 向上微移 | 上光标键 |\n| 向下微移 | 下光标键 |\n\n---\n\n### 更改列顺序\n\
  \n如果您已构建了一个 Power BI Desktop 表，最终将需要修改列从左到右的显示顺序。以下说明了如何执行此操作：\n\n1.  激活 `Fields`\
  \ 列表（除非它已显示）。\n2.  在 `Visualizations` 窗格中，确保显示了 `Fields` 选项（通过单击可用可视化对象集合下的条形图小图标）。\n\
  3.  单击要移动的字段名称。\n4.  将字段垂直拖拽到其新位置。该位置可以在现有字段之间，也可以在 `Fields` 列表的顶部或底部。一条粗黄线表示该字段将被放置的位置。\n\
  \n图 14-6 显示了如何将字段从一个位置拖拽到另一个位置。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig6_HTML.jpg](img/370912_3_En_14_Fig6_HTML.jpg)\n\
  \n**图 14-6** – 通过移动字段更改列顺序\n\n> **注意**  \n> 您无法通过在表格内部横向拖动列来更改其在表中的位置。\n\n---\n\n\
  ### 重命名字段\n\n您还可以重命名可视化对象中的字段，而无需重命名数据表中的基础列。虽然这可能导致数据与其显示之间存在某种脱节，但在某些情况下，这是一种非常有用的技术。操作步骤如下：\n\
  \n1.  选择包含您要重命名的数据元素的可视化对象（在此示例中，我将使用您刚刚创建的表）。\n2.  在 `Visualizations` 窗格的字段井中，右键单击要重命名的字段。\n\
  3.  从弹出菜单中选择 `Rename`。\n4.  编辑字段名称 — 或者删除当前名称并输入新名称。\n5.  按 `Enter` 键。\n\n现在该字段已重命名。新名称将仅显示在选定的可视化对象中，而数据元素将保留其原始名称。\n\
  \n> **注意**  \n> 在字段井中重命名字段也将重命名该字段。但是，这会将新名称应用于报表中的所有可视化对象。\n\n---\n\n### 从表中删除列\n\
  \n在 Power BI Desktop 中，另一项日常任务是在必要时从表中删除列。与重新排序列的顺序一样，此操作不是在表中直接完成，而是通过使用 `Fields`\
  \ 列表来执行。实际上，有几种方法可以从表中删除列，我将从我认为最快的方法开始，然后描述其他方法：\n\n1.  显示 `Fields` 列表 — 除非它已显示。\n\
  2.  取消选中 `Fields` 列表中的字段名称。\n\n假设已选中一个可视化对象，以下是删除字段的其他方法：\n\n-   在 `Visualizations`\
  \ 窗格中，单击字段井中字段名称右侧的叉形图标。\n-   在 `Visualizations` 窗格中，单击字段井中名称右侧的小三角形（请记住，这些是可视化对象中使用的字段）。当弹出菜单出现时，选择\
  \ `Remove Field`。\n\n> **注意**  \n> 请*不要*单击弹出菜单图标（字段名称右侧的省略号），然后在 *Fields list* 中选择\
  \ `Delete` 来从表中删除字段。执行此操作会从数据模型中删除该字段。\n\n---\n\n## 表粒度\n\nPower BI Desktop 表将自动聚合数据到可用的最低粒度级别。简单来说，这意味着选择最低有用细节级别的数据，但不要添加毫无意义的细节元素非常重要。\n\
  \n如果我使用一个例子，这可能更容易理解。假设您从一个高聚合级别开始——例如国家/地区。如果您创建一个包含 `CountryName` 和 `SalePrice`\
  \ 列的表，它将按国家/地区给出总销售额。如果您使用本书示例中给出的示例数据（`CarSalesDataForReports.pbix` 文件），此表仅包含大约六行左右。\n\
  \n然后在 `CountryName` 列之后添加 `ClientName` 列。执行此操作后，您将获得一组粒度更细的结果，其中包含*每个国家/地区每个客户*的聚合销售额。如果您（最后）添加\
  \ `InvoiceNumber`，您将获得非常详细的数据级别。确实，向表中添加如此精细的粒度可能会产生大量记录——如该表中出现的垂直滚动条所示。这些渐进的粒度级别如图\
  \ 14-7 所示。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig7_HTML.jpg](img/370912_3_En_14_Fig7_HTML.jpg)\n\
  \n**图 14-7** – 渐进的表粒度\n\nPower BI Desktop 始终尝试使用其基础数据模型中可用的信息来显示数据。\n\n---\n\n##\
  \ 数据类型\n\n并非所有数据都是平等的（或至少相同的），并且 Power BI Desktop 的基础数据模型将为您提供不同类型的数据。两种核心数据类型是：\n\
  \n-   描述性（非数字）属性\n-   值（或数字度量）\n\nPower BI Desktop 通过在多个字段旁边使用描述性图标来指示具体的数据类型，当您在\
  \ `Fields` 列表中展开数据表时可以看到这些图标。这些数据类型在表 14-4 中描述。\n\n**表 14-4** – 数据类型\n\n| 数据类型 |\
  \ 图标 | 说明 |\n| --- | --- | --- |\n| 属性 | 无 | 一个描述性元素，是非数字的。它可以被计数，但不能被求和或求平均值。 |\n\
  | 聚合 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Figd_HTML.jpg](img/370912_3_En_14_Figd_HTML.jpg)\
  \ | 一个可以更改其聚合类型的数字字段。 |\n| 计算列 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Fige_HTML.jpg](img/370912_3_En_14_Fige_HTML.jpg)\
  \ | 应用公式以创建新的计算列的结果。 |\n| 计算 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Figf_HTML.jpg](img/370912_3_En_14_Figf_HTML.jpg)\
  \ | 一个无法更改其聚合类型的数字字段，因为它是特定计算的结果。 |\n| 地理 | ![../images/370912_3_En_14_Chapter/370912_3_En_14_Figg_HTML.jpg](img/370912_3_En_14_Figg_HTML.jpg)\
  \ | 此字段可能用于地图中以提供地理参考。 |\n| 二进制数据 |   | 此字段包含数据，例如图像。 |\n\n数字字段不是唯一可以作为聚合添加的字段。如果您将属性字段添加到表中，然后通过单击\
  \ `Visualizations` 窗格中字段名称右侧的小三角形来显示此字段的弹出菜单，您可以选择 `Count`。您将在表的列中显示此属性的元素的*数量*，而不是元素的文本。图\
  \ 14-8 为您显示了文本字段的示例弹出字段菜单。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig8_HTML.jpg](img/370912_3_En_14_Fig8_HTML.jpg)\n\
  \n**图 14-8** – 文本字段的弹出菜单\n\n\n\n## 搜索字段\n\n如果你正在使用一个全新且尚不熟悉的数据集构建仪表板，你可能会浪费大量时间在可用表中仔细搜索所需的字段。\n\
  \nPower BI Desktop 通过 `Search`（搜索）字段让数据查找变得更加轻松。你可以在 `Fields`（字段）列表的顶部看到它。只需输入部分字段名称，即可立即筛选\
  \ `Fields`（字段）列表，仅显示包含你输入文本的字段。你可以在图 14-9 中看到一个示例。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig9_HTML.png](img/370912_3_En_14_Fig9_HTML.png)\n\
  \n图 14-9\n\n搜索字段\n\n* 若要重置 `Fields`（字段）列表，使其显示所有可用的表和字段，只需删除搜索文本即可。\n\n## 美化表格\n\
  \n因此，你已经设置了一个基本表格，并且其中的列顺序正确。很自然，下一步就是想让表格的呈现效果更吸引人一些。那么，让我们看看 Power BI Desktop\
  \ 在这方面提供了什么。具体来说，我们将了解：\n\n* 添加和删除合计\n* 调整表格中的文本大小\n* 更改列宽\n* 按特定列中的数据对行进行排序\n\n\
  ### 行合计\n\n行合计会自动添加到所有数值字段中。但是，你可能希望删除这些合计。反之，你也可能希望添加之前删除的合计。无论如何，要从表格中删除所有合计：\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig10_HTML.jpg](img/370912_3_En_14_Fig10_HTML.jpg)\n\
  \n图 14-10\n\n可视化窗格中表格的格式选项\n\n1. 根据字段 `ClientName`（客户名称）、`Town`（城镇）和 `SalePrice`（销售价格）创建一个表格。\n\
  2. 在 `Visualizations`（可视化）窗格中，单击 `Format`（格式）图标（位于可用可视化类型调色板下方的小油漆滚筒）。将显示所选表格的格式选项。\n\
  3. 通过单击 `Total`（合计）一词左侧向下的 V 形图标展开 `Total`（合计）部分。\n4. 将实心圆按钮（位于 `Totals`（合计）右侧）向左拖动（或单击按钮左侧或按钮本身）。它将变成一个空心圆，并且格式选项中的\
  \ `On`（开启）将变为 `Off`（关闭）。`Visualizations`（可视化）窗格将如图 14-10 所示。\n\n若要在没有合计的情况下添加合计，请按照上述步骤操作（选中表格），然后在第\
  \ 4 步中，将 `Off`（关闭）按钮向右拖动以将 `Totals`（合计）设置为 `On`（开启）。你可以在图 14-11 中看到你之前创建的表格（不含合计）。\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig11_HTML.jpg](img/370912_3_En_14_Fig11_HTML.jpg)\n\
  \n图 14-11\n\n不含合计的初始表格\n\n**注意**\n\n只有当表格显示多条记录时，你才能添加或删除合计。如果表格显示的是某个值的最高聚合级别，则无法显示任何合计，因为你已经在查看总计了。在这种情况下，`Totals`（合计）按钮会变灰。\n\
  \n### 在报表中设置数字格式\n\n你目前无法直接在 Power BI Desktop 报表的表格中设置数字格式。这是因为所有数字格式都集中在数据模型中。因此，如果你想应用与将值添加到表格时显示的格式不同的数字格式，则必须切换到\
  \ `Data View`（数据视图）并在那里应用格式。如果你需要回顾具体操作步骤，只需翻回到第 13 章，快速复习一下如何在 Power BI Desktop\
  \ 中设置数字格式。\n\n### 表格中的字号\n\n你可能希望更改 Power BI Desktop 在首次创建表格时应用的默认字号。这很容易做到：\n\n\
  1. 选择该表格。\n2. 在 `Visualizations`（可视化）窗格中，单击 `Format`（格式）图标。\n3. 通过单击 `Values`（值）一词左侧向下的\
  \ V 形图标展开 `Values`（值）部分。\n4. 单击当前文本大小右侧的向上或向下箭头。新的文本大小（以磅为单位）将显示在 `Text Size`（文本大小）框中，并且表格中文本的实际大小将增大。\n\
  \n以下是关于表格中字号的一些要点：\n\n* 如果你愿意，可以在 `Text Size`（文本大小）框中输入字号以指定精确大小。\n\n更改字号*不会*导致表格变大或缩小，因为\
  \ Power BI Desktop 将继续像使用之前字号时一样，每列显示相同数量的字符。因此，你可能最终需要将 `Auto-size`（自动调整大小）设置为\
  \ `On`（开启）（这将在下一节中介绍）或调整表格大小（如前所述），以使表格完全符合你的要求。\n\n* 此格式选项仅影响表格中*记录*的大小，而不影响列标题。要更改标题字体的大小，请展开\
  \ `Formatting`（格式）窗格的 `Column Headers`（列标题）部分，并使用完全相同的方法设置字号。这次，被更改的将是标题字体。\n\n\
  ### 更改列宽\n\nPower BI Desktop 会在你创建初始表格时自动设置列宽，以便所有数据都可见。\n\n但是——正如你所期望的那样——你也可以手动调整表格中各个列的大小。操作方法大致与在\
  \ Excel 中相同：\n\n1. 在列标题行中，将鼠标指针放在该列的最右边边缘。\n2. 向左或向右拖动以调整列宽。\n\n**注意**\n\n正如你对一款面向\
  \ Excel 用户的产品所期望的那样，你可以双击列标题右侧的列分隔线，让 Power BI Desktop 自动调整列宽，以适应当前可见的最宽数据元素。\n\n\
  #### 禁止自动调整列宽并启用自动换行\n\n如果你愿意，可以阻止 Power BI Desktop 自动重置列宽，并且还可以激活自动换行功能，以确保列中的文本不会被截断，而是流入下一行。操作方法如下：\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig12_HTML.jpg](img/370912_3_En_14_Fig12_HTML.jpg)\n\
  \n图 14-12\n\n禁止表格的自动列宽调整\n\n1. 选择该表格。在此示例中，我使用你在图 14-11 中看到的表格。\n2. 在 `Visualizations`（可视化）窗格中，单击\
  \ `Format`（格式）图标（位于可用可视化类型调色板下方的小油漆滚筒）。将显示所选表格的格式选项。\n3. 通过单击 `Column Headers`（列标题）一词左侧向下的\
  \ V 形图标展开 `Column Headers`（列标题）部分。\n4. 单击“`Auto-size column width`（自动调整列宽）”按钮。它将变成一个空心圆，并且格式选项中的\
  \ `On`（开启）将变为 `Off`（关闭）。\n5. 将 `Word wrap`（自动换行）设置为 `On`（开启）。`Visualizations`（可视化）窗格将如图\
  \ 14-12 所示。\n\n现在，你可以更改表格中所用字体的大小，而不会导致列宽增大或缩小。相反，将 `Auto-size`（自动调整大小）选项重置为 `On`（开启）会导致列宽重新自动调整，以显示该列中最宽的元素。\n\
  \n**注意**\n\n如果你正在设置表格格式，并且开始对哪些选项处于活动状态以及如何最好地重新开始感到有些困惑，你始终可以单击“`Revert to default`（恢复默认设置）”以重新应用表格（或任何可视化对象）的标准“出厂设置”。\n\
  \n\n\n### 按列排序\n\n表中的任何列，无论其数据类型如何，都可用作排序依据。要排序表格，只需点击列标题。表格中的行将根据所选列中的元素进行排序。首次对列进行排序时，排序顺序为\
  \ A 到 Z（对于数值，则为从低到高）。\n\n表格一旦排序，便无法取消排序。不过，您可以使用另一列来重新排序数据。或者，您可以再次点击列标题，以相反顺序排序——Z\
  \ 到 A（对于数值，则为从高到低）。\n\n有关列排序的示例，请参见图 14-13（我将使用您为图 14-11 创建的表格）。您可以看到，数据按 `SalePrice`\
  \ 从高到低排序。此外，在 `SalePrice` 列的标题下方，可以看到一个小朝下三角形。这表示该列按从最高值到最低值的顺序排序。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig13_HTML.jpg](img/370912_3_En_14_Fig13_HTML.jpg)\n\
  \n图 14-13\n\n按数值列排序表格\n\n有时，您是对一个字段的列进行排序（迄今为止的所有示例皆是如此），但实际排序操作却以另一列为基础。例如，您可以按月名称排序，但看到的结果是按月份数字排列的（这样您就不是按字母顺序，而是按数字顺序对月份进行排序）。您已在第\
  \ 13 章中看到了如何配置。\n\n## 格式化表格\n\n作为精美产品的应有之义，Power BI Desktop 甚至可以提升普通表格的呈现效果，使其脱颖而出，并达到受众期望的引人注目的效果。当前可用的格式设置选项包括：\n\
  \n*   添加自动表格样式\n*   设置标题格式\n*   修改表格背景\n*   添加和删除表格边框\n*   设置行格式——包括交替行\n*   添加和删除表格网格\n\
  *   设置列标题格式\n*   列格式设置\n*   设置总计格式\n*   条件格式——包括色阶、字体颜色、数据条和“KPI 样式”图标\n\n我确信，随着\
  \ Power BI Desktop 的日趋成熟，这些选项将继续得到发展。因此，当您阅读本书时，可能会看到进一步的呈现增强功能。不过，目前，我们先来看看当前可用的选项。\n\
  \n**注意**：没有专门用于设置表格中数字格式的选项。您可以通过点击 Power BI Desktop 窗口左侧的数据图标，选择要格式化的列，然后在 `建模`\
  \ 功能区中选择一种数字格式来格式化数据。此格式随后将以相同方式应用于所选字段所在的每个视觉对象。\n\n### 表格样式\n\nPower BI Desktop\
  \ 允许您从九种不同的方式中选择，只需几次点击即可快速格式化表格。这包括移除所有表格格式的选项。要格式化整个表格：\n\n1.  点击表格内部以进行格式化。\n\
  2.  在 `可视化` 窗格中，点击 `格式` 图标。\n3.  展开 `表格样式` 部分。从可用选项中选择一种表格样式。\n\n您可以在表 14-5 中查看可用表格样式的范围。\n\
  \n表 14-5\n\n可用的表格样式\n\n| 矩阵样式 | 描述 |\n| --- | --- |\n| 默认 | 为交替行添加灰色背景。 |\n| 无 |\
  \ 移除所有格式。 |\n| 最小化 | 在记录之间添加浅色间距。 |\n| 粗体标题 | 为标题行添加深色背景。 |\n| 交替行 | 为交替行添加灰色背景，并为标题行和总计行添加深色背景。\
  \ |\n| 对比交替行 | 在浅灰色和深灰色之间交替行背景。为标题行和总计行添加深色背景。 |\n| 鲜艳行 | 在浅绿色和深绿色之间交替行背景。 |\n|\
  \ 粗体标题鲜艳行 | 在浅绿色和深绿色之间交替行背景。为标题行和总计行添加深色背景。 |\n| 稀疏 | 为标题行和总计行添加深色背景，并移除分隔行的浅色线条。\
  \ |\n| 紧凑 | 为标题行和总计行添加深色背景，并在行列之间添加垂直和水平线条。 |\n\n您可以添加的表格样式实际上不过是预设值。如果您希望精确定义表格中记录的显示方式，可以应用接下来几节中解释的各种选项。\n\
  \n**注意**：要移除表格样式并恢复到“普通样式”的呈现，只需从可用表格样式的弹出列表中选择 `无` 即可。\n\n### 添加和设置标题格式\n\n与 Power\
  \ BI Desktop 中的大多数可视化对象一样，表格也可以有标题。添加标题后，您可以设置其：\n\n*   字体颜色\n*   背景颜色\n*   文本对齐方式\n\
  \n尽管这很简单，但我还是倾向于为了完整性而解释所有选项。\n\n1.  选择表格。在此示例中，我使用您在图 14-11 中看到的基于 `Town`、`ClientName`\
  \ 和 `SalePrice` 的表格。\n2.  在 `可视化` 窗格中，点击 `格式` 图标（可用可视化类型调色板下方的小油漆滚筒）。将显示所选表格的格式设置选项。\n\
  3.  通过点击 `标题` 一词左侧的向下 V 形展开 `标题` 部分。\n4.  点击 `关` 一词右侧的空心圆右侧。这将为所选表格激活标题。\n5.  在\
  \ `标题文本` 右侧的空白框中，为表格输入一个标题。我建议使用 **按城镇销售额**。\n6.  点击 `字体颜色` 右侧的弹出菜单三角形，并从可用色调调色板中选择一种颜色。\n\
  7.  点击 `背景颜色` 右侧的弹出菜单三角形，并从可用色调调色板中选择一种颜色。\n8.  点击 `对齐` 右侧的中间图标。这将使文本相对于表格宽度居中对齐。\n\
  9.  使用箭头增加标题字体的大小。\n\n格式设置选项和表格将如图 14-14 所示。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig14_HTML.jpg](img/370912_3_En_14_Fig14_HTML.jpg)\n\
  \n图 14-14\n\n表格标题选项\n\n**注意**：如果您愿意，也可以在 `文本大小` 字段中输入所需的字体大小。\n\n\n\n### 修改表格背景\n\
  \n表格标题并非唯一可修改以增强视觉效果的元素。你还可以调整表格本身的若干属性，为仪表盘增添亮点。以下是可以修改的两个方面：\n\n- 背景颜色\n- 表格透明度\n\
  \n以下示例展示了这两种修改方法：\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig15_HTML.jpg](img/370912_3_En_14_Fig15_HTML.jpg)\n\
  \n**图 14-15** 为表格设置背景颜色\n\n1.  选中该表格。在本例中，我使用的是你在图 14-14 中看到的表格。\n2.  在`可视化`窗格中，点击`格式`图标（位于可用可视化类型面板下方的小油漆滚筒图标）。此时将显示所选表格的格式设置选项。\n\
  3.  将`样式`设置为`无`。\n4.  点击`背景`字样左侧向下的 V 形箭头，展开`背景`部分。\n5.  确保`背景`字样右侧的开关已设置为`开启`（如果没有，则点击空圆圈右侧进行更改）。\n\
  6.  点击`颜色`右侧的弹出菜单三角形，从可用颜色面板中选择一种颜色。\n7.  点击`透明度`滑块开关，并将其向左滑动，通过降低透明度百分比来加深背景颜色。此时格式设置选项和表格将如图\
  \ 14-15 所示。\n\n注意\n\n你可以看到，使用此技术，你仅设置了表格可视化对象的背景，而并非构成表格本身的单元格行和列。你将在稍后几页中学习如何格式化行和列。\n\
  \n## 表格边框\n\n若要增添更多视觉效果，你可以为任何表格添加外边框。操作方法如下：\n\n1.  选中该表格。在本例中，我使用的是你在图 14-15 中看到的表格。\n\
  2.  在`可视化`窗格中，点击`格式`图标。此时将显示所选表格的格式设置选项。\n3.  将`边框`按钮向右滑动。这将为表格应用一个边框。\n4.  展开`边框`部分。\n\
  5.  从弹出面板中的可用颜色中选择一种边框颜色。\n6.  向右拖动`圆角半径`按钮，以定义边框圆角的大小。\n\n### 行格式设置\n\n在前面的章节中，你已了解如何更改表格中行的字体大小。这只是可应用于表格行的格式设置选项之一。以下是其他一些可能性：\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig16_HTML.jpg](img/370912_3_En_14_Fig16_HTML.jpg)\n\
  \n**图 14-16** 设置表格的交替行格式\n\n1.  选中你想要美化的表格。在本例中，我使用的是你在图 14-10 中看到的表格。\n2.  在`可视化`窗格中，点击`格式`图标。\n\
  3.  展开`值`部分。\n4.  选择一种背景颜色以及一种交替背景颜色。\n5.  选择一种字体颜色以及一种交替字体颜色。\n6.  从可用的轮廓样式中选择`轮廓`。\n\
  7.  调整左侧两列的宽度。表格应大致如图 14-16 所示。\n\n目前有七种可用的轮廓样式，外加移除所有轮廓样式的选项。这些样式在表 14-6 中加以说明。\n\
  \n**表 14-6** 可用的轮廓样式\n\n| 轮廓样式 | 说明 |\n| --- | --- |\n| `无` | 移除标题的边框。 |\n| `仅底部`\
  \ | 为标题添加底部边框。 |\n| `仅顶部` | 为标题添加顶部边框。 |\n| `仅左侧` | 为标题添加左侧边框。 |\n| `仅右侧` | 为标题添加右侧边框。\
  \ |\n| `顶部 + 底部` | 为标题同时添加顶部和底部边框。 |\n| `左侧 + 右侧` | 为标题同时添加左侧和右侧边框。 |\n| `框架` |\
  \ 为标题添加一个框架。 |\n\n在此之际，我还有几点补充说明：\n\n-   选择轮廓样式将为整个表格添加边框，该边框位于*可视化对象内部*，与你之前应用于整个可视化对象外边缘的表格边框不同。\n\
  -   启用自动换行将使所有列中的文本换行到下一行。这会增加任何受影响行的高度。\n-   在`值`部分启用`URL 图标`选项，会将 URL 文本转换为图标。\n\
  \n## 表格网格\n\n如果你使用`可视化`窗格格式设置选项中的`表格网格`部分，则可以更精确地扩展表格的呈现效果。\n\n让我们以图 14-16 中的表格为例，看看这是如何工作的：\n\
  \n1.  选中要格式化的表格，并在`可视化`窗格中点击`格式`图标。\n2.  展开`网格`部分。\n3.  将`垂直网格`开关切换为`开启`以显示垂直网格线。\n\
  4.  从可用颜色面板中为垂直网格线选择一种颜色。\n5.  在`垂直网格线粗细`字段中输入`3`。\n6.  从可用颜色面板中为水平网格线选择一种颜色（此项默认应为开启状态；如果未开启，只需将`水平网格`的按钮向右滑动即可）。\n\
  7.  将`水平网格`按钮向右滑动，为水平网格线设置不同的粗细。\n8.  在`行内边距`字段中输入`5`。\n9.  从可用颜色面板中为轮廓颜色选择一种颜色。\n\
  10. 在`轮廓粗细`字段中输入`5`。\n11. 在`文本大小`字段中输入`10`。\n12. 调整列宽，以在列中显示所有文本和数字。\n\n你可以在图 14-17\
  \ 中看到这些更改的结果。我绝不是说这些增强功能具有任何深刻的审美价值——但至少你可以看到如何使用 Power BI Desktop 来格式化数据。\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig17_HTML.jpg](img/370912_3_En_14_Fig17_HTML.jpg)\n\
  \n**图 14-17** 表格网格设置\n\n注意\n\n根据你显示器的分辨率，你可能需要向下滚动`格式设置`窗格的`网格`部分。这可以通过使用`网格`部分右侧的灰色垂直滚动条来完成。\n\
  \n### 列标题\n\nPower BI Desktop 还允许你修改列标题的格式。你可以执行以下调整以查看实际效果：\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig18_HTML.jpg](img/370912_3_En_14_Fig18_HTML.jpg)\n\
  \n**图 14-18** 设置列标题格式\n\n1.  使用默认表格样式，重新创建图 14-14 中的初始表格。\n2.  展开`列标题`部分。\n3.  使用相应的颜色面板分别为字体和背景设置颜色。\n\
  4.  点击向上箭头增大标题的字体大小。\n5.  选择`居中对齐`作为`对齐方式`。\n6.  在`轮廓`弹出菜单中，选择`顶部 + 底部`。这些样式与你之前应用于行值的样式相同，并在表\
  \ 14-6 中有详细说明。你可以在图 14-18 中看到最终的格式效果。\n\n注意\n\n如果你选择在`文本大小`字段中输入文本大小值，请注意存在不可超过的限制。例如，如果你输入的数字小于\
  \ 8，Power BI Desktop 将拒绝应用所请求的字体大小，并为`文本大小`字段添加红色轮廓。之后，你将需要输入一个有效的数字。\n\n\n\n##\
  \ 字段格式\n\n可以单独设置每一列的格式。Power BI Desktop 将此称为字段格式。你需要知道，在实践中，过度使用此技术极易导致表格完全难以辨认。尽管如此，学习如何格式化单个列仍然值得。\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig19_HTML.jpg](img/370912_3_En_14_Fig19_HTML.jpg)\n\
  \n图 14-19 — 添加列格式\n\n1.  使用默认样式重新创建图 14-11 中的表格。\n2.  展开`字段格式`部分。\n3.  从`列格式`部分顶部的弹出列表中，选择要设置格式的列的列标题。本例中我将选择`城镇`。\n\
  4.  使用相应的调色板，分别设置字体和背景颜色。\n5.  将`应用于总计`设置为`开`。\n6.  将`应用于值`设置为`开`。\n7.  保持`应用于标题`为`关`。\n\
  8.  你可以在图 14-19 中看到输出结果。\n\n## 格式化总计\n\nPower BI Desktop 允许你对表格中的总计进行更多操作，而不仅仅是启用或禁用它们。你可以格式化总计以增强其可见性（或者相反，尝试转移人们对不佳数据的注意力），如下所示：\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig20_HTML.jpg](img/370912_3_En_14_Fig20_HTML.jpg)\n\
  \n图 14-20 — 格式化总计\n\n1.  重新创建你在图 14-19 中看到的表格。\n2.  在`可视化`窗格中（当然，保持表格处于选中状态），激活`格式`面板并展开`总计`部分。\n\
  3.  确保`总计`选项设置为`开`。\n4.  从调色板中选择一种字体颜色。\n5.  从调色板中选择一种背景颜色。\n6.  输入合适的总计标签。\n7.\
  \  将轮廓设置为`无`。\n8.  输入一个数值或调整滑块以获得更大的字号。你可以从图 14-20 中看到这些操作的结果以及`格式设置`窗格的`总计`部分。\n\
  \n## 条件格式\n\n数据表可以传达大量信息，但它们很少能让人立即理解数字的含义。这正是可以应用条件格式将数据转换为立即可用信息的地方。事实上，你可能已经习惯于在\
  \ Excel 电子表格中应用这些增强功能了。\n\n在 Power BI Desktop 中，有四种类型的条件格式可以应用于为你的数字添加含义：\n\n- **背景颜色**：为表格单元格的整个背景添加颜色阴影。阴影的强度反映了数据中选定的值。\n\
  - **字体颜色**：根据选定值更改文本的颜色。\n- **数据条**：为表格单元格添加背景条。这里条的大小代表单元格中的值。\n- **图标**：添加一个图标（KPI\
  \ 指示器）以引起对单元格相对于另一个值的注意。\n\n> **注意**：条件格式只能基于包含数值的字段中的值来使用，不能基于文本元素。但是，显示条件格式的字段（或者如果你愿意，可以称为列）不一定必须是其数据用于定义条件格式的那个字段。\n\
  \n### 背景颜色\n\n色阶是一种应用于列中每个单元格的背景颜色。实际颜色会根据每行的值而变化。作为一个色阶如何工作的例子，请尝试以下操作：\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig22_HTML.jpg](img/370912_3_En_14_Fig22_HTML.jpg)\n\
  \n图 14-22 — 应用了色阶的表格\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig21_HTML.jpg](img/370912_3_En_14_Fig21_HTML.jpg)\n\
  \n图 14-21 — 色阶对话框\n\n1.  重新创建图 14-11 中的表格。确保表格保持选中状态。\n2.  单击`可视化`窗格中的`格式`图标，并展开`条件格式`部分。\n\
  3.  从表格列的弹出列表中选择要设置格式的列名称（在本例中是`销售价格`列）。\n4.  将`背景颜色`按钮设置为`开`。\n5.  单击`高级控件`链接。将显示`背景颜色`对话框。\n\
  6.  从`格式依据`弹出列表中选择`色阶`。\n7.  从`汇总方式`弹出列表中选择一种`汇总方式`。在本例中，我建议选择`求和`。\n8.  在`基于字段`弹出列表中选择`销售价格`字段。你会看到它在对话框中表示为`销售价格的总和`。\n\
  9.  在`设置空白值格式`弹出列表中，选择`为零`。\n10. 为最小值设置颜色，从弹出调色板中选择一种较浅的颜色。\n11. 选中`发散`复选框。\n12.\
  \ 为中心值设置颜色，从弹出调色板中选择一种中等的颜色。\n13. 在`中心`的弹出列表中，选择`数字`。\n14. 在现已启用的数字字段中输入`25000`。\n\
  15. 为最大值设置颜色，从弹出调色板中选择一种较深的颜色。`色阶`对话框将如图 14-21 所示。\n16. 单击`确定`。表格将如图 14-22 所示。\n\
  \n在定义条件格式时，有几点值得注意：\n\n- 你可以选择任何字段作为背景颜色阴影的基础——这个字段不必是实际在表格中显示阴影的那个字段。\n- 正如你在第\
  \ 15 步中看到的，在设置背景颜色时，你可以让 Power BI Desktop 自动检测最小值、最大值和中位数值，也可以自己定义特定值。\n- 如果你不选中`发散`复选框，则只能定义两种颜色的范围。\n\
  - 你可以通过三种方式定义背景颜色：\n  - **色阶**（我们在此处所做的）\n  - **规则**（我们将在下一节定义字体颜色时介绍）\n  - **字段值**（我将在下一节解释）\n\
  - 正如你在第 8 步中看到的，你可以从整个数据模型中选择一个字段作为条件格式的基础。\n- 定义条件格式时，可以使用你期望的标准汇总方式（`求和`、`平均值`、`计数`等）。\n\
  \n\n\n### 文本颜色\n\n另一种条件格式选项是通过条件格式设置每个值的文本颜色。这与对单元格背景应用条件格式非常相似。实际上，在此示例中，我将扩展之前的示例，对您刚刚创建的表格文本应用条件格式。不过这次，我们将对`Town`列应用基于规则的格式。\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig24_HTML.jpg](img/370912_3_En_14_Fig24_HTML.jpg)\n\
  \n图 14-24：对表格应用条件文本和背景\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig23_HTML.jpg](img/370912_3_En_14_Fig23_HTML.jpg)\n\
  \n图 14-23：背景色阶对话框\n\n1.  选择您在上一节中创建的表格。\n2.  在“可视化”窗格中，单击“格式”图标。\n3.  展开“条件格式”部分。\n\
  4.  从要格式化的列弹出窗口中选择`Make`列。\n5.  将`字体色阶`设置为“开”。\n6.  单击`字体颜色`的`高级控件`。将显示“字体颜色”对话框。\n\
  7.  从`格式化方式`弹出窗口中选择`规则`。\n8.  为`基于字段`选择`Make`。\n9.  将`汇总`保留为`计数`。\n10. 从调色板中选择最小值的一种颜色。\n\
  11. 将`如果值`设置为以下内容：`大于或等于 0`（数字）且`小于 10`（数字）。\n12. 从调色板中为此规则选择一种颜色。\n13. 单击`+ 新建规则`按钮。新的规则行将出现在您刚刚创建的规则下方。\n\
  14. 将此规则的`如果值`设置为以下内容：`大于或等于 11`（数字）且`小于 100`（数字）。\n15. 从调色板中为此规则选择一种颜色。对话框将类似于图\
  \ 14-23 所示。\n16. 单击`确定`。表格将类似于图 14-24 所示。\n\n> **注意：** 如果您愿意，可以将文本和背景设置为不同的颜色（使用相同或不同的规则集），以获得与应用条件文本完全不同的效果。\n\
  \n在为文本设置条件格式时，您可能会发现以下几点：\n\n-   如果选择非数字字段作为背景色底纹的依据，则只能使用`计数`或`非重复计数`作为汇总方式。\n\
  -   定义基于规则的条件格式时，您可以添加多个规则。\n-   可以通过单击每条规则右侧的叉号图标来删除规则。\n-   基于规则的条件格式同样可以应用于单元格背景。\n\
  -   如果要更改规则的應用顺序，只需单击每条规则右侧的上、下箭头即可。\n-   单击`反转颜色顺序`按钮可保留规则，但会反转所应用的颜色。\n-   应用基于规则的条件格式时，请注意准确设置阈值，以免排除任何值。\n\
  \n### 数据条\n\n`数据条`是一种呈现技术，它将数值表示为表格单元格中实际数值后方的彩色条形。您可以通过以下步骤添加数据条：\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig26_HTML.jpg](img/370912_3_En_14_Fig26_HTML.jpg)\n\
  \n图 14-26：应用于表格的数据条\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig25_HTML.jpg](img/370912_3_En_14_Fig25_HTML.jpg)\n\
  \n图 14-25：数据条对话框\n\n1.  创建一个基于`Make`和`CostPrice`的表格。\n2.  在“可视化”窗格中单击“格式”图标，并展开“条件格式”部分。\n\
  3.  从表格列名的弹出列表中选择要格式化的列名称（在此示例中为`SalePrice`列）。\n4.  将`数据条`按钮设置为`开`。Power BI Desktop\
  \ 会将数据条应用于`SalePrice`列。\n5.  单击`高级控件`链接。将显示“数据条”对话框。\n6.  在`最小值`弹出窗口中，选择`数字`。\n\
  7.  在现已启用的数字字段中输入 **250000** 作为值。\n8.  为正向条形、负向条形和坐标轴选择颜色。对话框应类似于图 14-25 所示。\n9.\
  \  单击`确定`。表格将类似于图 14-26 所示。\n\n在应用数据条时，您可能会注意到以下几点：\n\n-   您可以选择仅应用条形（而不显示实际数字）。\n\
  -   数据条只能应用于包含数字值的列。\n\n您可以选择同时将数据条和色阶添加到同一列。然而，这可能会削弱视觉效果，而非帮助读者理解数据的含义。\n\n###\
  \ 图标\n\nPower BI Desktop 中可用的数据可视化技术集合中，较新增加的功能是能够将关键绩效指标 (KPI) 显示为图标。您可以像这样将它们添加到表中任何现有的列：\n\
  \n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig28_HTML.jpg](img/370912_3_En_14_Fig28_HTML.jpg)\n\
  \n图 14-28：应用于表格的图标\n\n![../images/370912_3_En_14_Chapter/370912_3_En_14_Fig27_HTML.jpg](img/370912_3_En_14_Fig27_HTML.jpg)\n\
  \n图 14-27：图标对话框\n\n1.  选择您在上一节中创建的表格。\n2.  在“可视化”窗格中单击“格式”图标，并展开“条件格式”部分。\n3.  从表格列名的弹出列表中选择要格式化的列名称（在此示例中为`Make`列）。\n\
  4.  将`图标`按钮设置为`开`。将显示“图标”对话框。\n5.  选择`求和`作为汇总方式。\n6.  选择`SalePrice`字段作为`基于字段`。\n\
  7.  选择`数据右侧`作为`图标布局`。\n8.  从`样式`弹出窗口中选择一个可用的图标样式集。\n9.  选择`居中`作为`图标对齐方式`。“图标”对话框将类似于图\
  \ 14-27 所示。\n10. 单击`确定`。表格将类似于图 14-28 所示。\n\n图标是对 Power BI Desktop 中可用数据显示技术的极佳补充。尽管如此，有几件事您需要了解：\n\
  \n-   对话框中显示的规则数量将自动映射到您所选样式的图标数量。\n-   如果您删除或添加规则，`样式`将切换为`自定义`。您现在可以为每条规则选择所需的图标类型。\n\
  -   如果愿意，您可以为应用的每条规则选择一个特定的图标。\n\n## 从可视化效果导出数据\n\n最后，值得注意的是，您可以导出可视化效果所依据的数据。这适用于任何视觉对象，从表格到图表。您只需执行以下操作：\n\
  \n1.  单击视觉对象的菜单——图表、表格或地图右上角的省略号。然后从弹出菜单中选择`导出数据`。\n2.  选择目标目录和文件名。\n3.  单击`确定`，相关数据将被导出。目前唯一的导出格式是\
  \ CSV 文件。\n\n> **注意：** 导出数据时，任何现有的筛选器都将被应用。这意味着，可能只有部分数据会导出到 CSV 文件中。\n\n\n\n##\
  \ 结论\n\n我希望你现在已经熟悉了 Power BI Desktop 的报表界面，并能从容地使用它来以表格形式呈现数据。你学到的不仅是如何创建表格，还包括如何通过多种精妙（甚至不那么精妙）的方式改变表格的呈现效果，以增强其影响力。这涵盖从设置字体属性到条件格式，再到调整标题和数据的显示外观。\n\
  \n同样地，我也希望你能够轻松运用所学技巧对表格中的数据进行排序。\n\n本章仅仅是 Power BI Desktop 帮助你分析和展示信息，让你的受众能够理解这些信息的一种尝试。因此，由于表格几乎是所有其他可视化形式的基础，掌握表格创建的技巧和诀窍非常值得。这样一来，你就能熟练地掌握\
  \ Power BI Desktop，为打造一些真正令人印象深刻的数据展示奠定基础。\n\n既然你已经掌握了基础知识，现在是时候进入仪表板创建的下一阶段了，你将学习如何创建和增强矩阵与卡片。这些内容将在下一章中解释。\n\
  \n"
- "# 15. 矩阵和卡片视觉对象\n\n本章将指导你在 Power BI Desktop 中创建更多基于文本的可视化对象。你将学习如何进一步运用前一章掌握的技能来创建和增强以下内容：\n\
  \n-   矩阵\n-   卡片\n-   多行卡片\n\n你在本章中学到的技术将使用一个 Power BI Desktop 文件，该文件是应用了前四章大部分内容后的成果。此文件名为\
  \ `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。它作为本书的可下载资料的一部分，可在 Apress\
  \ 网站上获取。\n\n## 创建矩阵\n\n在上一章中，你了解了如何使用表格以完整的列列表形式显示信息。然而，列表并不总能直观地让人感受到数据应如何在各个层级进行分组。以整洁的层级结构呈现信息，并包含多个分组层级，这是矩阵视觉对象的任务。\n\
  \n### 创建行矩阵\n\n在创建矩阵时，我发现从信息层级的角度来思考，并设想信息从左到右流动会很有帮助。例如，假设我们想创建一个矩阵，将国家名称作为层级中的最高级别（因此也是最左侧的项）。然后，我们希望汽车品牌作为第二层级，位于左侧的下一项。最后，我们想要已售汽车的颜色，后面跟着所有我们关心的数值字段。你可以在图\
  \ 15-1 中看到这个递进关系的图示。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig1_HTML.jpg](img/370912_3_En_15_Fig1_HTML.jpg)\n\
  \n*图 15-1 — 信息层级结构*\n\n创建矩阵时，让“可视化”窗格反映层级结构非常重要。换句话说，你必须确保为矩阵选择的字段，以及你放置在字段框中的字段顺序，遵循你想要显示的层级结构。因此，要创建一个像刚才描述的那样的矩阵，你需要执行以下操作：\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig2_HTML.jpg](img/370912_3_En_15_Fig2_HTML.jpg)\n\
  \n*图 15-2 — 一个矩阵表*\n\n1.  使用 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件作为你的数据源。\n\n2.  在“可视化”窗格中点击矩阵图标。如图 15-2 所示。报表画布上会出现一个空矩阵。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig3_HTML.jpg](img/370912_3_En_15_Fig3_HTML.jpg)\n\
  \n*图 15-3 — 显示数据顶层的矩阵*\n\n3.  按顺序将字段 `CountryName`（来自 Countries 表）、`Make`（来自 Stock\
  \ 表）和 `Color`（来自 Colors 表）拖到“可视化”窗格的“行”框中。然后添加字段 `SalePrice` 和 `Cost Plus Spares\
  \ Margin`（来自 InvoiceLines 表）以及 `Mileage`（来自 Stock 表）。矩阵应该类似图 15-3。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig4_HTML.jpg](img/370912_3_En_15_Fig4_HTML.jpg)\n\
  \n*图 15-4 — 一个两级矩阵*\n\n4.  点击矩阵顶部的“在层级结构中向下展开一级”图标。这是从左数第三个看起来像小叉子的图标（如果你想提前看一下，可以在图\
  \ 15-11 中找到这个图标）。矩阵应该类似图 15-4（注意：第一组行没有国家名称是完全正常的）。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig5_HTML.jpg](img/370912_3_En_15_Fig5_HTML.jpg)\n\
  \n*图 15-5 — 一个三级矩阵*\n\n5.  再次点击“在层级结构中向下展开一级”图标。矩阵应该类似图 15-5。\n\n如你所见，矩阵显示不仅使数据更易于理解，而且会自动按层级中的每个元素对记录进行分组，并为每个级别添加小计。此外，层级中的每个级别都按升序排序。你可以展开添加到矩阵定义中的数据中的所有可用层级。这个最末层级将显示该层级的所有可用详细信息。\n\
  \n你也可以通过将字段直接拖入表格来将它们添加到表格中。当你这样做时，Power BI Desktop 始终会将文本字段添加到现有字段的*右侧*。在矩阵中，这意味着任何聚合或数值字段都会添加到现有聚合字段的右侧（并出现在“值”框中），而任何文本或日期时间字段都会添加到任何现有层级字段的右侧（并出现在“行”框中）。但是，通过在“行”和“值”框中上下拖动所需字段来重新组织它们，以定义正确的层级结构和你想要实现的整体显示类型总是很容易的。你可以在图\
  \ 15-6 中看到“可视化”窗格如何反映矩阵层级。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig6_HTML.jpg](img/370912_3_En_15_Fig6_HTML.jpg)\n\
  \n*图 15-6 — 显示矩阵层级结构的“可视化”窗格*\n\n在创建矩阵时，我个人的偏好是将构成非数值层级结构的字段拖到“行”框中，这意味着我可以将它们准确地放置在现有元素的上方、下方或之间。这可以确保你的矩阵在第一次尝试时就看起来正确，从而帮助你避免一些非常令人困惑的重复检查！此外，由于\
  \ Power BI Desktop 默认会将额外的字段添加到“列”框中，因此在构建矩阵时精确操作会有所帮助。这意味着要仔细地将行标题的字段放置在“行”框中。\n\
  \n### 在矩阵中添加或删除小计\n\n默认情况下，新建的矩阵会包含数据每个层级的小计。如果你希望从矩阵中删除小计：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig7_HTML.jpg](img/370912_3_En_15_Fig7_HTML.jpg)\n\
  \n*图 15-7 — 无小计的矩阵*\n\n1.  选择你在上一节使用的矩阵视觉对象。\n\n2.  在“可视化”窗格中，点击“设置格式”图标。\n\n3.\
  \  展开“小计”部分。\n\n4.  点击“行小计”按钮以关闭行小计。这将从矩阵中移除所有总计，如图 15-7 所示。\n\n\n\n## 列矩阵\n\nPower\
  \ BI Desktop 不仅能让你添加行级别的层次结构，你还可以创建列级别的层次结构，或者将两者混合使用。假设我们想清晰地了解按国家、制造商和车辆类型划分的销售额和毛利率，以及它们之间的相互影响。为了实现这一目标，我建议你通过添加一个\
  \ `VehicleType` 级别作为列层次结构，来扩展之前创建的矩阵。\n\n操作步骤如下：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig8_HTML.jpg](img/370912_3_En_15_Fig8_HTML.jpg)\n\
  \n**图 15-8 - 行列矩阵表**\n\n1. 点击之前创建的矩阵以将其选中。“可视化”窗格会显示 `Rows` 和 `Values` 框中用于此表的字段。\n\
  2. 将 `Stock` 表中的 `VehicleType` 字段拖到“可视化”窗格的 `Columns` 框内。这将在表的列中添加一个层次结构。表格将如图 15-8\
  \ 所示。\n\n“可视化”窗格现在看起来如图 15-9 所示。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig9_HTML.jpg](img/370912_3_En_15_Fig9_HTML.jpg)\n\
  \n**图 15-9 - 行列矩阵表的“可视化”窗格**\n\n如你所见，你现在可以根据国家名称、颜色、制造商和车辆类型查看销售额和毛利率，但它显示在一个交叉矩阵中，数据按行和列同时细分。\n\
  \n在结束关于创建矩阵的部分之前，有几件事你可能希望注意：\n\n- 如果添加了总计，那么层次结构的 *每一个级别* 都会有总计。\n- 将非数值数据添加到“值”字段框会使\
  \ Power BI Desktop 显示 `Count` 聚合。\n- 矩阵可能会变得非常宽，尤其是当你有多级层次结构时。Power BI Desktop 矩阵通过水平滚动的工作方式来体现这一点。矩阵表会冻结左侧的非聚合数据列，并允许你向右滚动以显示聚合的（数值）数据。\n\
  - 移动“可视化”窗格中 `Columns` 和 `Rows` 框内的字段（使用如前所述的拖放操作）会重新排列表中的聚合数据列。\n\n## 展开以及向下钻取和向上钻取\n\
  \n在创建原始矩阵时，你了解了如何展开矩阵以包含子级别。然而，在矩阵的数据层中导航时，Power BI Desktop 提供了多种可能性。这些包括：\n\n-\
  \ 显示层次结构中的一个或所有数据子级别\n- 仅显示数据的更深级别\n- 向下钻取以仅显示特定项目的下级级别\n- 向上钻取以仅显示层次结构的上一个级别\n\n\
  在数据级别之间的导航通过四个界面元素的组合来完成：\n\n- 数据/钻取功能区\n- 每个矩阵顶部的图标\n- 数据元素的上下文菜单\n- 级别中每个单独项目的\
  \ `+/-` 图标\n\n在学习如何在数据级别之间移动之前，先对所有这三个元素进行一个概览可能会有所帮助。\n\n### 数据/钻取功能区\n\n钻取层次结构数据时的一个重要工具是数据/钻取功能区。此功能区包含的按钮如图\
  \ 15-10 所示，并在表 15-1 中进行了解释。\n\n**表 15-1 - 可用的矩阵样式**\n\n| 按钮 | 描述 |\n| --- | ---\
  \ |\n| 将钻取应用于 | 向下或向上钻取，应用于页面上的所有视觉对象或仅选定的视觉对象。 |\n| 查看数据 | 在单独的窗格中显示未格式化的数据。 |\n\
  | 切换到下一级别 | 显示按层次结构中的下一级别数据分段的数据。 |\n| 在层次结构中向下展开一级 | 显示所有数据项及其下一级别的数据。 |\n| 向上钻取\
  \ | 返回到上一个数据级别（展开或向下钻取）。 |\n| 向下钻取 | 仅显示所选数据项及其任何子级别的数据。 |\n| 可视化表 | 显示构成聚合行的记录的数据。\
  \ |\n| 组 | 创建一个组以突出显示视觉对象中的选定值。 |\n| 钻取 | 钻取到包含详细信息的另一个页面。 |\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig10_HTML.jpg](img/370912_3_En_15_Fig10_HTML.jpg)\n\
  \n**图 15-10 - 数据/钻取功能区**\n\n#### 矩阵导航图标\n\n任何矩阵的数据上方都有一系列图标。你可以在图 15-11 中看到它们。我建议你熟悉这些图标，因为它们在钻取信息层次结构时至关重要。这不仅适用于矩阵，也适用于某些类型的图表。\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig11_HTML.jpg](img/370912_3_En_15_Fig11_HTML.jpg)\n\
  \n**图 15-11 - 矩阵的钻取和展开图标**\n\n#### 矩阵项目的上下文菜单\n\n在矩阵中浏览数据层次结构时，你可能需要的最后一种方法是右键单击矩阵中任何记录时出现的弹出菜单。你可以在图\
  \ 15-12 中看到这一点。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig12_HTML.jpg](img/370912_3_En_15_Fig12_HTML.jpg)\n\
  \n**图 15-12 - 矩阵项目的上下文菜单**\n\n### 级别中每个单独项目的 +/- 图标\n\n如果你不想，你不必展开矩阵中特定级别的每一个元素。你现在可以选择单独展开或折叠每个级别。\n\
  \n启用矩阵单个级别的展开可以按如下方式操作：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig13_HTML.jpg](img/370912_3_En_15_Fig13_HTML.jpg)\n\
  \n**图 15-13 - 显示 +/-（展开和折叠）图标的矩阵**\n\n1. 使用 `Make` 和 `Model` 字段作为 `Rows`，`SalePrice`\
  \ 作为 `Values` 创建一个矩阵。\n2. 选中矩阵后，单击“可视化”窗格中的“格式”图标。\n3. 展开 `Row Headers`。\n4. 将 `+/-\
  \ icons` 设置为“开”。矩阵将如图 15-13 所示。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig14_HTML.jpg](img/370912_3_En_15_Fig14_HTML.jpg)\n\
  \n**图 15-14 - 具有一个展开级别的特定元素的矩阵**\n\n5. 单击 Bentley 旁边的加号图标。选定项目的整个部分将被展开——但仅此而已。矩阵将如图\
  \ 15-14 所示。\n\n- 毫无疑问，你已经猜到，单击已展开项目的减号图标将折叠该特定级别。\n\n### 显示上一级别的数据\n\n几页之前，你了解了在创建矩阵时如何展开所有子级别，因此我在此不再赘述。但是，如果你当前显示了数据层次结构的三个级别，而想返回只显示两个级别，该怎么办？\n\
  \n1. 以图 15-5 中显示三个数据级别的矩阵为例。\n2. 在“数据/钻取”功能区中，单击 `Drill Up`。\n\n矩阵将仅显示两个数据级别，并再次类似于图\
  \ 15-4 中的图像。\n\n\n\n### 显示子级别的数据\n\n矩阵并不要求您一次性显示所有层级的数据。如果您愿意，可以仅显示矩阵层次结构中较低层级的数据，具体操作如下：\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig15_HTML.jpg](img/370912_3_En_15_Fig15_HTML.jpg)\n\
  \n图 15-15 – 显示矩阵中不同层级的数据\n\n1. 创建您在 图 15-3 中开始的矩阵，只显示顶层数据。\n2. 点击矩阵顶部的“前往层次结构中的下一个级别”图标。矩阵中将仅显示第二级数据（颜色）。您可以在\
  \ 图 15-15 中看到示例。\n\n如您所见，汇总值完全相同。改变的只是数据的分段方式。\n\n要返回到数据层次结构中的上一级，只需点击 `Data/Drill`\
  \ 功能区中的 `Drill Up` 按钮，或点击矩阵左上角的 `Drill Up` 图标。\n\n### 在行级别向下钻取\n\n在浏览数据层次结构时，另一个完全不同的选项是针对特定层次结构元素进行向上和向下钻取。展开和钻取之间的关键区别如下：\n\
  \n- 展开层次结构会显示*所有*顶层元素的下一级数据。\n- 向下钻取只会显示*所选*数据元素的下一个子级别。\n\n要查看实际操作，请尝试以下步骤：\n\n\
  ![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig16_HTML.jpg](img/370912_3_En_15_Fig16_HTML.jpg)\n\
  \n图 15-16 – 在矩阵中向下钻取\n\n1. 右键单击矩阵中的任意顶层数据元素（我将以图 15-5 中矩阵的“法国”为例）。\n2. 从上下文菜单中选择\
  \ `Drill down`。矩阵现在将如图 15-16 所示。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig17_HTML.jpg](img/370912_3_En_15_Fig17_HTML.jpg)\n\
  \n图 15-17 – 在矩阵中进一步向下钻取\n\n1. 您可以继续向下钻取到更深层级的数据，只需右键单击第二层级中的任意数据元素，并从上下文菜单中选择 `Drill\
  \ down`（例如，本例中的“Bentley”）。矩阵现在将如图 15-17 所示。\n\n要返回上一层级，您只需点击 `Data/Drill` 功能区中的\
  \ `Drill Up` 按钮，或点击矩阵左上角的 `Drill Up` 图标。或者，您也可以右键单击数据项，然后从上下文菜单中选择 `Drill Up`。\n\
  \n### 使用点击穿透进行向下钻取\n\n如果您觉得右键单击并选择 `Drill down` 选项有些麻烦，那么还有另一种解决方案。您可以将矩阵切换为通过简单点击数据项进行向下钻取。具体操作如下：\n\
  \n1. 在矩阵的右上角，点击“单击以启用向下钻取”图标。该图标将变成一个浅色背景上的深色箭头。\n2. 点击任意数据元素（例如，一个国家）。您将向下钻取到下一层级。\n\
  \n您可以随时通过重新点击“单击以启用向下钻取”图标来关闭此选项。它将恢复为透明背景上的浅色箭头，表示这种形式的向下钻取已停用。\n\n### 在列级别向下钻取\n\
  \n相同的向下钻取和向上钻取逻辑同样适用于列。以您之前创建的列矩阵为例（您可以在图 15-8 中看到）：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig18_HTML.jpg](img/370912_3_En_15_Fig18_HTML.jpg)\n\
  \n图 15-18 – 复杂矩阵中的向下钻取选项\n\n1. 将 `Model`（来自 `Stock` 表）添加到矩阵的 `Columns` 数据字段中，并置于\
  \ `VehicleType` 字段下方。矩阵左上角会出现一个弹出菜单，提供行和列之间的选择。您可以在图 15-18 中看到这一点。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig19_HTML.jpg](img/370912_3_En_15_Fig19_HTML.jpg)\n\
  \n图 15-19 – 在多级列层次结构中向下钻取\n\n1. 点击弹出菜单并选择 `Columns`。\n2. 点击“前往层次结构中的下一个级别”图标。您将看到类似图\
  \ 15-19 的内容，其中车辆类型已被模型取代作为列标题。\n\n如您所见，层次结构同样适用于列和行。这归结为：\n\n- 将字段添加到 `Visualizations`\
  \ 窗格中的正确字段框（`Rows` 或 `Columns`）\n- 从矩阵顶部的弹出菜单中选择适当的向下钻取模式（`Columns` 或 `Rows`）\n\n\
  ## 可视化源数据\n\n如果格式化后的表格或矩阵变得过于庞大或复杂，您可以选择查看不应用任何格式的底层数据。这通常能让您看到比精心格式化的可视化效果中更多的信息。\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig20_HTML.jpg](img/370912_3_En_15_Fig20_HTML.jpg)\n\
  \n图 15-20 – 可视化源数据\n\n1. 选择您想要显示其数据且不带格式的表格或矩阵。\n2. 在 `Data/Drill` 功能区中，点击 `See\
  \ Data` 按钮。所选表格或矩阵的未格式化数据版本将显示在第二个窗口中。您可以在图 15-20 中看到这一点。\n3. 点击格式化表格上方的 `Back to\
  \ report` 按钮（或再次点击 `Data/Drill` 功能区中的 `See Data` 按钮）以返回到正常的 Power BI Desktop 报表视图。\n\
  \n**注意：** 查看未格式化数据时，您目前无法调整两个窗口的大小。但是，您可以在任一窗口中上下滚动。如果您更希望在可视化的右侧（而不是下方）查看数据，请点击窗口右上角的\
  \ `Switch Layout` 图标。\n\n## 查看记录\n\n在处理聚合数据时，您有时可能会忽略有价值的细节。例如，您可能会错过一个使平均值产生偏差的巨大离群值。或者，某个单条记录的过高值可能导致总计高于正常或健康水平。\n\
  \n为了帮助您遵循直觉并将聚合值与详细数字进行权衡，Power BI Desktop 允许您随时查看矩阵中某个总计“背后”的底层记录。以下是一个示例：\n\n\
  ![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig21_HTML.jpg](img/370912_3_En_15_Fig21_HTML.jpg)\n\
  \n图 15-21 – 从矩阵中显示数据记录\n\n1. 基于以下字段创建一个矩阵（所有字段均来自 `Stock` 表）：\n   - `Make`（行）\n\
  \   - `Model`（行）\n   - `LaborCost`\n   - `CostPrice`\n2. 在 `Data/Drill` 菜单中，点击 `Expand\
  \ all down one level in the hierarchy` 以查看制造商和模型的完整层次结构。\n3. 右键单击 Aston Martin Vanquish\
  \ 的劳动成本数值，然后从上下文菜单中选择 `See records`。您将看到构成该总计数值的所有明细记录。如图 15-21 所示。\n4. 点击现在显示的记录上方的\
  \ `Back to report` 按钮，以返回到正常的 Power BI Desktop 报表视图。\n\n**注意：** 或者，您可以右键单击矩阵中的任意值，然后选择\
  \ `See records` 以向下钻取到构成所选聚合值的详细记录。\n\n\n\n## 包含与排除矩阵元素\n\n某些矩阵可能包含海量数据，因此您可能需要仅关注部分选定元素。在\
  \ Power BI Desktop 中操作非常简单：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig22_HTML.jpg](img/370912_3_En_15_Fig22_HTML.jpg)\n\
  \n图 15-22\n\n从矩阵中包含选定元素\n\n1. 按上一节的内容重新创建矩阵（制造商、型号、人工成本、成本价格）。\n2. 点击层次结构中的“向下展开所有内容一级”，查看制造商和型号的完整层次结构。\n\
  3. `Ctrl`+单击以下任意元素（制造商、型号或数值）：\n   - 阿斯顿·马丁 DB4\n   - 宾利 雅致\n   - 捷豹 XJ12\n4. 右键单击其中一个选定元素，然后从弹出菜单中选择“包含”。所有其他元素将从矩阵中删除。结果如图\
  \ 15-22 所示。\n\n> **注意**：作为包含特定元素的另一种方法，您可以选择想要*排除*的所有元素，然后从弹出菜单中选择“排除”。\n\n目前，要回到包含所有数据行的完整矩阵，似乎唯一的方法是按\
  \ `Ctrl+Z` 撤销此操作。\n\n## 将多个值显示为行\n\nPower BI Desktop 近期一个非常实用的功能是能够创建复杂矩阵，其中的数据列现在可以显示为行。也就是说，您无需在复杂的列层次结构中并列查看多个数据值，而是可以将所有数值数据显示为行。\n\
  \n通过一个示例可以更好地理解这一功能：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig23_HTML.jpg](img/370912_3_En_15_Fig23_HTML.jpg)\n\
  \n图 15-23\n\n以列为数值的标准矩阵\n\n1. 使用以下元素创建一个矩阵：\n   - *行*：国家表中的“国家名”和库存表中的“制造商”（按此顺序）。\n\
  \   - *列*：VehicleType（来自库存表）。\n   - *值*：里程数和人工成本（按此顺序），均来自库存表。\n2. 向下展开所有内容一级。矩阵将如图\
  \ 15-23 所示。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig24_HTML.jpg](img/370912_3_En_15_Fig24_HTML.jpg)\n\
  \n图 15-24\n\n以行为数值的矩阵\n\n1. 在“可视化”窗格中，单击格式图标并展开“值”部分。\n2. 将“在行上显示”设置为开启。矩阵现在将如图\
  \ 15-24 所示，其中的多个数据列变成了数据行。\n\n只需将“在行上显示”切换为关闭，矩阵即可恢复为初始格式。\n\n## 格式化矩阵\n\n幸运的是，格式化矩阵所应用的技术与表格格式化技术大致相同。因此，我将不再重复上一章中关于修改以下方面的原则：\n\
  \n- 矩阵样式（即表格样式，但应用于矩阵）\n- 网格\n- 列标题\n- 行标题\n- 值\n- 总计\n- 标题\n- 背景\n- 条件格式\n\n不过，矩阵还有一些额外的格式调整选项，分别是：\n\
  \n- 阶梯式布局\n- 小计\n\n我将在以下小节中解释这些选项。\n\n### 阶梯式布局\n\n在图 15-5 中，您可以看到矩阵的多个层级，它们通过缩进层级展示。然而，您可能更倾向于将每个层级显示在单独的列中。操作方法如下：\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig25_HTML.jpg](img/370912_3_En_15_Fig25_HTML.jpg)\n\
  \n图 15-25\n\n未使用阶梯式布局的矩阵\n\n1. 选择（或重新创建）矩阵，使用“国家名”、“制造商”和“颜色”作为行数据，使用“里程数”和“人工成本”作为数值。\n\
  2. 在层次结构中单击两次“向下展开所有内容一级”，以显示所有数据层级。\n3. 在“可视化”窗格中，单击格式图标。\n4. 展开“行标题”部分。\n5. 将“阶梯式布局”设置为关闭。\n\
  6. 必要时调整矩阵宽度。矩阵将如图 15-25 所示。\n\n#### 小计\n\n表格只有总计（假设您要显示它），而矩阵可以为显示的每一个数据层级提供小计。尽管格式化小计与格式化表格中的总计类似，但为了内容的完整性，我仍在此处描述相关选项：\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig26_HTML.jpg](img/370912_3_En_15_Fig26_HTML.jpg)\n\
  \n图 15-26\n\n在矩阵中格式化小计\n\n1. 选择您在上一节中使用的矩阵视觉对象。\n2. 在“可视化”窗格中，单击格式图标。\n3. 展开“小计”部分。\n\
  4. 从字体颜色调色板中选择不同的字体颜色。\n5. 从字体系列弹出列表中选择不同的字体。\n6. 在文本大小字段中输入一个数字（或使用箭头调整），以设置更大的字体大小。\n\
  7. 将“应用于标签”设置为开启——这将确保小计标签和数值都应用格式。矩阵应如图 15-26 所示。\n\n> **注意**：由于总计的格式化方式与表格中的总计基本相同，因此此处不再赘述。如果您需要复习，请翻回上一章。\n\
  \n#### 放置小计\n\n您还可以决定小计是放置在一组元素的上方、元素标题旁边，还是放在组下方独立行中。只需执行以下操作来放置小计：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig27_HTML.jpg](img/370912_3_En_15_Fig27_HTML.jpg)\n\
  \n图 15-27\n\n将小计放置在组下方\n\n1. 重新创建图 15-21 中使用的矩阵（仅执行步骤 1 和 2）。\n2. 在“可视化”窗格中，单击格式图标并展开“小计”部分。\n\
  3. 在“行小计位置”弹出菜单中，选择“顶部”。矩阵现在应如图 15-27 所示。\n\n#### 每层级矩阵的自定义小计设置\n\nPower BI Desktop\
  \ 现在允许您定义是否在矩阵层次结构的每个层级（包括行和列）显示小计。查看具体操作：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig28_HTML.jpg](img/370912_3_En_15_Fig28_HTML.jpg)\n\
  \n图 15-28\n\n选择性小计\n\n1. 重新创建图 15-23 中使用的矩阵（仅执行步骤 1 和 2）。\n2. 在层次结构中点击“向下展开所有内容一级”（可点击矩阵中的图标或在“数据/钻取”菜单中操作）。\n\
  3. 在“可视化”窗格中，单击格式图标并展开“小计”部分。\n4. 将“按行级别”设置为开启。这会将所有行数据元素的列表添加到“可视化”窗格中。\n5. 将“按列级别”设置为开启。这会将所有列数据元素的列表添加到“可视化”窗格中。\n\
  6. 将“制造商”和“VehicleType”的按钮都设置为关闭。如图 15-28 所示，这些元素的小计已被移除。\n\n\n\n## 矩阵中的数据排序\n\n\
  在对矩阵表中的数据进行排序时，排序顺序将遵循矩阵的层级结构。这意味着，如果你对层级结构中的第二个元素进行排序（在刚刚创建的示例表中，即`制造商`字段），那么层级结构中的主元素（`国家名称`，最左侧列）以及行元素层级结构中任何较低级别的元素，都将恢复为初始的（按字母顺序）排序顺序。\n\
  \n如果你按照矩阵中的任意值进行排序，则会使用层级结构中最高级别的总计来重新排列表格。你可以在图 15-29 中看到这一点，该矩阵基于图 15-25，已按总劳动力成本降序排序。这使得劳动力成本最高的国家移动到了表格顶部。此外，如果你有一个列矩阵（如此示例所示），那么最终你会按照列的总计（本例中最右侧的两列）对矩阵进行排序，使矩阵按数值排序，尽管是升序排列。\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig29_HTML.jpg](img/370912_3_En_15_Fig29_HTML.jpg)\n\
  \n图 15-29\n\n按值对矩阵进行排序\n\n> **注意**  \n> 与表格的情况一样，没有用于格式化矩阵中数字的特定选项。你可以通过点击 `Power\
  \ BI Desktop` 窗口左侧的 `数据视图` 图标来格式化数据，选择要格式化的列，然后在 `建模` 选项卡中选择一种数字格式。\n\n## 卡片\n\n\
  在某些情况下，你可能希望比其它数据更突出地显示单个数字。也许你需要吸引查看者注意你新的销售记录，或者你希望老板赞赏你获得的客户满意度评分。\n\n无论动机如何，卡片都是解决方案。\
  \ `Power BI Desktop` 卡片是隔离和强调单个数字的一种简单而强大的方法。例如，假设你想在仪表板中显示迄今为止所有车辆的销售数据；以下说明了如何实现：\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig30_HTML.jpg](img/370912_3_En_15_Fig30_HTML.jpg)\n\
  \n图 15-30\n\n可视化效果库中的 `卡片` 图标\n\n1.  使用 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件作为数据源，点击任何现有可视化效果之外的空区域。\n\n2.  在可用可视化效果库中，点击 `卡片` 图标。你可以在图 15-30 中看到此图标。仪表板画布上将出现一个空白卡片。\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig31_HTML.jpg](img/370912_3_En_15_Fig31_HTML.jpg)\n\
  \n图 15-31\n\n卡片可视化效果\n\n3.  展开 `字段` 列表中的 `发票行` 表字段，并选择 `销售价格` 字段。所有销售的总计将出现在卡片中。\n\
  \n4.  调整卡片大小，使数字恰好适合卡片边框内，不留任何空白空间。最终的卡片将类似于图 15-31。\n\n### 格式化卡片\n\n如你刚才所见，卡片是将观众的注意力聚焦于关键数据的极其有效的方法。然而，你还可以做更多操作来增强这种强调效果，包括以下内容：\n\
  \n*   更改显示数据的单位、小数位数、颜色和文本大小。\n*   移除自动显示的标签，并更改其文本大小。\n*   添加一个可以独立格式化的标题。\n* \
  \  更改卡片的背景颜色。\n*   修改边框样式。\n\n让我们看看如何调整你刚刚创建的卡片：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig32_HTML.jpg](img/370912_3_En_15_Fig32_HTML.jpg)\n\
  \n图 15-32\n\n格式化后的卡片\n\n1.  选择该卡片。在此示例中，我使用你在图 15-31 中看到的卡片。\n\n2.  在 `可视化效果` 窗格中，点击\
  \ `格式` 图标（可用可视化效果类型调色板下方的小油漆滚筒）。将显示所选卡片的格式化选项。\n\n3.  通过点击 `背景` 字样左侧向下的 V 形图标来展开\
  \ `背景` 部分。\n\n4.  确保 `背景` 字样右侧的开关设置为 `开`（如果未设置，则点击空心圆右侧以更改此设置）。\n\n5.  点击 `颜色` 右侧的弹出菜单三角形，并从可用颜色调色板中选择一种颜色。\n\
  \n6.  点击 `透明度` 滑块开关并将其向左滑动，通过降低透明度百分比来加深背景颜色。\n\n7.  通过点击 `类别标签` 字样左侧向下的 V 形图标来展开\
  \ `类别标签` 部分。\n\n8.  通过点击向上和/或向下 V 形图标或输入所需的文本大小来调整文本大小。如果需要，你也可以更改颜色和字体。\n\n9. \
  \ 通过点击 `标题` 字样左侧向下的 V 形图标来展开 `标题` 部分。\n\n10.  通过点击 `标题` 右侧 `开/关` 按钮的右侧，将标题设置为 `开`。\n\
  \n11.  在 `标题文本` 中输入 `至今累计`。\n\n12.  点击 `字体颜色` 右侧的弹出菜单三角形，并从可用颜色调色板中选择一种字体颜色。\n\n\
  13.  点击 `背景颜色` 右侧的弹出菜单三角形，并从可用颜色调色板中选择一种背景颜色。\n\n14.  点击 `对齐方式` 图标中间的图标，将卡片标题居中。\n\
  \n15.  如果需要，可以选择不同的字体和字体大小。\n\n16.  通过点击左侧向下的 V 形图标来展开 `数据标签` 部分。\n\n17.  点击 `颜色`\
  \ 右侧的弹出菜单三角形，并从可用颜色调色板中选择一种数据标签颜色。\n\n18.  调整文本大小，或输入所需的文本大小。\n\n19.  通过点击 `显示单位`\
  \ 的弹出列表，为卡片中的数字选择一个显示单位。\n\n20.  通过点击 `精度` 框右侧的向上和向下三角形，选择用于卡片数据的小数位数。如果愿意，你也可以直接输入小数位数。\n\
  \n21.  展开 `边框` 部分并打开边框。如果需要，可以更改边框颜色。\n\n22.  调整 `圆角半径` 滑块以设置卡片的圆角。现在，卡片（以及格式化调色板）看起来将类似于你在图\
  \ 15-32 中看到的元素。\n\n用于格式化卡片中数值的可用显示单位在表 15-2 中进行了描述。\n\n表 15-2\n\n显示单位\n\n| 显示单位\
  \ | 描述 |\n| --- | --- |\n| `自动` | 根据数字的大小，从可用的单位中选择合适的显示单位。 |\n| `无` | 显示实际数字。 |\n\
  | `千` | 以千为单位显示数字，后跟一个 `K`。 |\n| `百万` | 以百万为单位显示数字，后跟一个 `M`。 |\n| `十亿` | 以十亿为单位显示数字，后跟一个\
  \ `bn`。 |\n| `万亿` | 以万亿为单位显示数字，后跟一个 `T`。 |\n\n\n\n## 多行卡片\n\n利用 Power BI Desktop\
  \ 的卡片式输出，可以以一种极具创新性的方式展示表格数据。与矩阵类似，你首先选择要在基本表格中显示的字段，然后将其转换为另一种视觉对象类型。以下是具体操作示例：\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig33_HTML.jpg](img/370912_3_En_15_Fig33_HTML.jpg)\n\
  \n图 15-33  \n可视化窗格中的多行卡片图标\n\n1. 使用 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件作为数据源，点击任何现有视觉对象的外部区域。\n\n2. 在可视化窗格中，点击卡片图标。你可以在图 15-33 中看到此图标。一个空白的多行卡片将出现在仪表板画布上。\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig34_HTML.jpg](img/370912_3_En_15_Fig34_HTML.jpg)\n\
  \n图 15-34  \n一个卡片可视化效果\n\n1. 按以下顺序添加字段：\n   1. `CountryName`（来自 `Countries` 表）\n\
  \   2. `CostPrice`（来自 `Stock` 表）\n   3. `LaborCost`（来自 `Stock` 表）\n   4. `SpareParts`（来自\
  \ `Stock` 表）\n\n2. 调整多行卡片的大小，以便显示所有国家，且每个国家所有数字均显示在同一行。视觉对象将类似于图 15-34 所示的样式。不必担心\
  \ (空白) 成本；这些对应的是库存中尚未售出、因而还没有对应客户国家的车辆。\n\n卡片式表格将按照字段在可视化窗格字段框中的出现顺序进行显示，并且可以像任何表格一样在此处重新排序。这使得每个卡片成为一个数据记录。字段将在每张卡片内从左到右排列，然后换行。有趣的是，调整表格大小可以显著改变其外观。一个非常窄的表格会将字段垂直排列，上下堆放。如果你能将所有字段放入一行，那么你将获得一个极具特色的多记录显示效果。\n\
  \n### 格式化多行卡片\n\n多行卡片有几个视觉方面可以调整以增强效果。这些包括添加标题和更改背景颜色。我们来尝试这两项操作：\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig35_HTML.jpg](img/370912_3_En_15_Fig35_HTML.jpg)\n\
  \n图 15-35  \n一个格式化后的多行卡片\n\n1. 选择多行卡片视觉对象。在此示例中，我使用了你在图 15-34 中看到的卡片。\n\n2. 在可视化窗格中，点击格式图标（位于可用视觉类型调色板下方的小油漆滚筒）。所选多行卡片的格式选项将显示出来。\n\
  \n3. 点击“背景”一词左侧向下的 V 形图标展开背景部分。\n\n4. 确保“背景”一词右侧的开关设置为“开”（如果未设置，则点击空心圆的右侧进行更改）。\n\
  \n5. 点击“颜色”右侧的弹出菜单三角形，并从可用色调调色板中选择一种颜色。\n\n6. 点击“透明度”滑块开关，并将其向左滑动，通过降低透明度百分比来加深背景颜色。\n\
  \n7. 点击“标题”一词左侧向下的 V 形图标展开标题部分。\n\n8. 通过点击“标题”右侧“开/关”按钮的右侧，将标题设置为“开”。\n\n9. 在“标题文本”中输入\
  \ `Key Figures By Country`。\n\n10. 点击“字体颜色”右侧的弹出菜单三角形，并从可用颜色调色板中选择一种字体颜色。\n\n11.\
  \ 点击“背景颜色”右侧的弹出菜单三角形，并从可用颜色调色板中选择一种背景颜色。\n\n12. 为标题设置更大的字号。\n\n13. 点击居中对齐的图标，以使标题居中。\n\
  \n14. 点击“卡片”右侧的弹出菜单三角形，然后选择“仅底部”作为轮廓样式。\n\n15. 点击“轮廓粗细”字段内部，然后输入 `4`。\n\n16. 从可用条形颜色调色板中选择一种不同的条形颜色。\n\
  \n17. 将“条形粗细”设置为 10，以增加条形的宽度。\n\n18. 将“内边距”按钮设置为 10，以减少卡片内各个元素之间的间距。\n\n19. 从“背景”可用的颜色调色板中选择一种背景颜色。\n\
  \n20. 展开“数据标签”部分，并增大字号。如有需要，可更改字体和字号。\n\n21. 展开“卡片标题”部分，并增大文本字号。\n\n22. 从可用颜色调色板中选择一种文本颜色。\n\
  \n23. 展开“类别标签”部分，并选择一种文本颜色、字体和字号。多行卡片视觉对象现在将类似于图 15-35 所示的样式。你可能需要调整其大小以达到正确效果。\n\
  \n> **注意**：你也可以像本章开头对初始表格所做的那样，固定多行卡片视觉对象的纵横比。同样地，你也可以像之前对卡片视觉对象那样添加边框。\n\n### 对多行卡片排序\n\
  \n与表格和矩阵一样，多行卡片也可以排序。但是，对此类视觉对象应用排序顺序有一种特定的方法：\n\n1. 点击多行卡片视觉对象右上角的省略号。\n\n2. 选择“排序依据”。\n\
  \n3. 从弹出菜单的列列表中选择要依据其排序的列名。\n\n多行卡片中的元素现在将根据所选列中的值进行排序。你可以在图 15-36 中看到弹出菜单的示例。此示例使用了你之前创建的多行卡片。\n\
  \n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig36_HTML.jpg](img/370912_3_En_15_Fig36_HTML.jpg)\n\
  \n图 15-36  \n对多行卡片进行排序\n\n> **注意**：对多行卡片中的类别（此示例中的国家）进行排序时，将首先按字母顺序反向排序（因为多行卡片最初是按字母顺序排序的）。再次选择对类别进行排序将重置排序顺序为字母顺序。对某个值进行排序时，将始终从高到低排序——在弹出菜单中再次点击该值将移除排序顺序并恢复到初始顺序。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格按照您的要求，将给定的英文文本翻译成中文，并保留所有格式。\n\n\n## 在表格类型之间切换\n\nPower\
  \ BI Desktop 的众多优点之一在于，它从设计之初就旨在让您能够快速、轻松地测试想法并尝试不同的数据显示方式。因此，您完全可以轻松地切换表格类型，以查看哪种呈现风格最适合您的想法和想要传达的信息。要切换表格类型，您只需选择当前基于文本的可视化对象（表、多行卡或矩阵），然后从可用可视化对象库中选择以下选项之一：\n\
  \n- 表\n- 矩阵\n- 多行卡\n\n更令人放心的是，Power BI Desktop 会记住您之前使用的表格类型的属性。例如，如果您设置了一个具有精心构建层次结构的矩阵，然后切换到卡片式表格，那么当您想要切换回矩阵时，Power\
  \ BI Desktop 会记住您是如何设置该矩阵的。\n\n要查看其实际工作方式的示例，请参阅图 15-37。此图显示了相同的初始可视化对象，该对象已被复制，然后在基于文本的核心可视化类型之间切换。我已将\
  \ `Color` 字段添加到矩阵中，并展开下一级别，以使表格和矩阵之间的差异更清晰。\n\n![../images/370912_3_En_15_Chapter/370912_3_En_15_Fig37_HTML.jpg](img/370912_3_En_15_Fig37_HTML.jpg)\n\
  \n图 15-37 — 使用相同的数据和格式切换可视化对象\n\n以下是这里需要注意的主要事项：\n\n- 切换类型时，可视化对象的大小保持不变。因此，您可能需要调整其大小。\n\
  - 所有可以保留的格式都会被保留。从图 15-37 中所有三个可视化对象的标题和背景中都可以看到这一点。\n\n## 结论\n\n本章扩展了您在前一章中获得的知识，向您展示了如何创建矩阵。然后，您学习了如何向下钻取任何矩阵以显示信息的层次结构，或者仅显示数据层次结构中的子级别。\n\
  \n接着，您学习了如何创建卡片可视化对象以及 Power BI Desktop 独特而有效的多行卡。\n\n既然您已经掌握了创建可视化对象的基础知识，现在是时候进入仪表板创建的下一个级别了。在接下来的两章中，您将了解如何创建和增强图表。这将使您能够更自由地发挥想象力，并帮助您的数据“开口说话”。\n\
  \n"
- "# Power BI Desktop 中的图表\n\n拥有能够从根本上改变公司运营方式的、具有变革意义的洞察是一回事，而能够说服同事接受您的远见则是另一回事。那么，有什么比用一个无可辩驳地证明您观点的图表，直观地、即时地向他们展示您是正确的更好的方法呢？\n\
  \nPower BI Desktop 基于“一图胜千言”的理念。其图表工具可让您创建清晰且有说服力的可视化对象，向受众传达的信息远比大量数字所能表达的要多得多。因此，本章将向您展示，不仅可以让数据解释您的分析，而且可以让数据看起来仿佛要跃出屏幕，这是多么简单。在接下来的几页中，您将看到一个强大的图表如何能够说服您的同事和老板，让他们相信您的想法和洞察是值得追随的。\n\
  \n更实际一点说，Power BI Desktop 允许您将合适的数据集制作成：\n\n- 饼图\n- 条形图\n- 柱形图\n- 折线图\n- 面积图\n-\
  \ 散点图\n- 气泡图\n- 漏斗图\n- 瀑布图\n- 环形图\n- 功能區圖\n\n在本章中，我们将开始学习所有这些图表类型，然后扩展其中一些类型以创建堆叠条形图、堆叠柱形图和堆叠面积图，以及\
  \ 100% 堆叠条形图、100% 堆叠柱形图和双轴图表。一旦您决定了最合适的图表类型，就可以通过添加标题、数据标签和图例（在适当的情况下）来增强您的可视化效果。在下一章中，您将学习如何设置所有这些元素的格式，以赋予您的图表应有的惊艳效果。\n\
  \n## 初识图表\n\n通常，通过实践而非空谈，更容易体会到 Power BI Desktop 的简洁性和强大功能。因此，我建议直接开始创建第一个图表。在本节中，我们将仅介绍“入门级”图表，它们都有一个共同点——都基于单列数据值和单列描述性元素。数据将包括：\n\
  \n- 客户列表\n- 特定年份的汽车销量\n\n那么，让我们开始绘制图表吧！在本章中，您将使用 Apress 网站上可供下载的 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix` Power BI Desktop 文件。\n\n### 创建第一个图表\n\n任何 Power BI\
  \ Desktop 图表都始于一个数据集。因此，让我向您介绍图表的世界，展示如何通过几次点击创建一个条形图；以下说明了如何开始：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig1_HTML.jpg](img/370912_3_En_16_Fig1_HTML.jpg)\n\
  \n图 16-1 — `可视化`窗格中的`条形图`图标\n\n1.  从可下载示例中打开文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n\
  2.  单击`可视化`窗格左上角的`堆叠条形图`图标。此图标如图 16-1 所示。仪表板画布上将出现一个空的条形图可视化对象。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig2_HTML.jpg](img/370912_3_En_16_Fig2_HTML.jpg)\n\
  \n图 16-2 — 调整大小后的条形图\n\n1.  保持选中空的条形图可视化对象，然后展开`字段`列表中的`Clients`表。\n2.  选中 `ClientName`\
  \ 字段左侧的复选框。\n3.  保持选中此新建的条形图可视化对象，然后展开`字段`列表中的 `InvoiceLines` 表。\n4.  单击 `SalePrice`\
  \ 字段左侧的复选框。这会将每个客户的累计销售额添加到图表中。\n5.  调整图表大小（建议加宽并增加高度），直到坐标轴标签清晰可见，如图 16-2 所示。\n\
  \n创建一个简单的入门级图表就是这么简单。这个过程可能只需要几秒钟，一旦完成，就可以向您的受众展示，或者根据您的需求进行改造。\n\n尽管如此，还是需要做一些说明来阐明在\
  \ Power BI Desktop 中创建图表的基本知识：\n\n- 创建图表时，您可以使用第 14 章和第 15 章中描述的任何技术向可视化对象添加字段。您可以将字段拖入`可视化`窗格的字段框，或者如果愿意，也可以直接拖入可视化对象中。\n\
  - 当仅使用单个数据集时，您可以选择“聚类”或“堆叠”作为条形图或柱形图的图表类型；无论哪种情况，结果都是相同的。随着我们深入学习，您会发现当图表基于多个数据字段时，情况就不同了。\n\
  - Power BI Desktop 会在图表的左上角添加一个标题，说明图表所基于的数据。您可以在图 16-2 中看到一个示例。\n- 创建图表仅仅是第一步。您还可以做更多的事情来增强图表并突出其所能带来的洞察。所有这些都将在本章以及下一章中进一步介绍。\n\
  \n\n\n### 将表格转换为图表\n\n另一种创建图表的方法是先创建一个表格（例如，通过将数据字段拖拽到 Power BI Desktop 画布上，而不事先点击图表图标）。然后选中该表格，并点击\
  \ `Visualizations`（可视化）窗格中的图表图标，即可将表格转换为图表。\n\n然而，如果你先创建了一个表格，然后将其转换为图表（通过选中表格并点击`堆积柱形图`图标），`Visualizations`（可视化）窗格的字段井会发生变化，以反映创建或修改图表时可用的选项。如果你选中刚刚创建的图表，你会看到\
  \ `ClientName`（客户名称）字段被放置在了`轴`框中，而 `SalePrice`（销售价格）字段被放置在了`值`框中。如果可视化对象是表格，则这两个框都不存在。如图\
  \ 16-3 所示。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig3_HTML.jpg](img/370912_3_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3\n\n条形图的字段列表\n\n### 删除图表\n\n删除图表就如同删除表格、矩阵或卡片一样简单。你只需：\n\n1.  点击图表内部。\n\n\
  2.  按下`Delete`键。\n\n如果你从（选中图表时的）`Visualizations`（可视化）窗格字段井的`布局`部分移除了所有字段，那么你也会删除该图表。\n\
  \n### 基本图表修改\n\n现在你有了一个初始图表。但是，假设你想更改图表所基于的字段。那么，要更改轴元素（客户名称和所表示的值），你只需：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig4_HTML.jpg](img/370912_3_En_16_Fig4_HTML.jpg)\n\
  \n图 16-4\n\n一个带有相应`布局`部分的简单条形图\n\n1.  点击你之前创建的条形图。暂时避免点击图表中的任何条形。\n\n2.  在`Visualizations`（可视化）窗格的字段井中，点击`值`井中\
  \ `SalePrice`（销售价格）右侧的小叉号（或点击 `SalePrice`（销售价格）的弹出菜单，选择`移除字段`）。条形将从图表中消失。\n\n3.\
  \  将`字段`列表中`库存`表的 `LaborCost`（劳动力成本）字段拖拽到`值`井中。\n\n4.  在`Visualizations`（可视化）窗格的字段井中，点击`轴`框中\
  \ `ClientName`（客户名称）的弹出菜单，选择`移除字段`。客户名称将从图表中消失，并出现一个单独的条形。\n\n5.  在`字段`列表中，展开`颜色`表，并将`颜色`表中的\
  \ `Color`（颜色）字段拖拽到`轴`框中。颜色列表将替换轴上的客户列表，一系列条形将替换单个条形。参见图 16-4 查看差异。\n\n就是这样。你无需重建就完全改变了图表。Power\
  \ BI Desktop 已更新图表中的数据和图表标题，以反映你的更改。\n\n## 基本图表类型\n\n当处理单个值集时，你可能会使用以下六种核心图表类型来表示数据：\n\
  \n*   条形图\n\n*   柱形图\n\n*   折线图\n\n*   饼图\n\n*   圆环图\n\n*   漏斗图\n\n让我们看看如何使用当前的数据集（你之前应用的颜色和劳动力成本）来尝试这些图表类型。\n\
  \n## 柱形图\n\n柱形图实质上就是条形图，只是条形是垂直的而非水平的。因此，请执行以下操作将你的条形图切换为柱形图：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig5_HTML.jpg](img/370912_3_En_16_Fig5_HTML.jpg)\n\
  \n图 16-5\n\n一个基础的柱形图\n\n1.  点击你之前创建并修改过的条形图（即图 16-4 中所示的那个）。避免点击图表中的任何条形。\n\n2.\
  \  在`Visualizations`（可视化）窗格中，点击`堆积柱形图`图标。\n\n3.  根据需要调整图表大小。你的图表应如图 16-5 所示。\n\n\
  ## 折线图\n\n折线图将数据显示为一组由线条连接的点。执行以下操作将你的柱形图切换为折线图：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig6_HTML.jpg](img/370912_3_En_16_Fig6_HTML.jpg)\n\
  \n图 16-6\n\n一个简单的折线图\n\n1.  点击你之前创建的柱形图。暂时避免点击图表中的任何柱形。\n\n2.  在`Visualizations`（可视化）窗格中，点击`折线图`图标。你的图表应如图\
  \ 16-6 所示。\n\n## 饼图\n\n饼图在展示单一系列有限数据集时效果极佳，就像本例中的情况。要将可视化对象切换为饼图：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig7_HTML.jpg](img/370912_3_En_16_Fig7_HTML.jpg)\n\
  \n图 16-7\n\n一个基础的饼图\n\n1.  点击你之前创建的折线图。暂时避免点击图表中的任何线条。\n\n2.  在`Visualizations`（可视化）窗格中，点击`饼图`图标。折线图将变为饼图。\n\
  \n3.  如有必要，调整饼图大小以正确显示所有颜色的文本。你的图表应如图 16-7 所示。你会注意到，饼图的`布局`部分略有变化，`轴`框已被`图例`框取代。\n\
  \n如果饼图同时包含正值和负值，其显示会失真。Power BI Desktop 不会显示负值。如果你的数据集包含正负数据混合，那么 Power BI Desktop\
  \ 会在图表上方显示一个警告：“值过多。未显示所有数据。”这几乎总是意味着饼图包含正*和*负值，且负值未显示。这同样适用于圆环图。负值也可能使漏斗图看起来有点怪异。如果你想亲自验证这一点，请尝试创建一个包含制造商和毛利润的表格。你会看到该表格包含七行，但相应的饼图或圆环图只显示六个扇区。这是因为毛利润为负值的制造商（TVR）未出现在饼图中。\n\
  \n在实践中，当数据包含负值时，你可能更倾向于不使用饼图或圆环图，或者你可能希望将正负值分离成两个数据集，并使用筛选器显示两个图表（这在第 20 章中解释）。\n\
  \n#### 注意\n\n在图表中调整大小和字体以容纳所有元素、轴和/或图例标签可能比较棘手。一个有用的技巧是在源数据中准备“缩写”数据字段，就像 `Date`（日期）表中的\
  \ `QuarterAbbr`（季度缩写）字段那样，包含 `Q1`、`Q2` 等，而不是 `Quarter 1`、`Quarter 2` 等，以节省图表空间。\n\
  \n## 基本图表调整\n\n我希望你会同意，在 Power BI Desktop 中创建图表极其简单。然而，制作一个富有说服力的可视化过程，并不会在你获取数据集并将其显示为图表后就此停止。至少，你需要对新图表进行以下微调：\n\
  \n*   调整图表大小\n\n*   重新定位图表\n\n*   对图表中的元素进行排序\n\n*   更改图表中的字体大小\n\n这些任务都毫不困难。实际上，当你掌握了适用技巧后，只需几秒钟就能将你的初始图表转变为一个引人注目的可视化论述。\n\
  \n\n\n### 调整图表大小\n\n图表与 Power BI Desktop 仪表板画布上的其他视觉对象一样，可以根据需要调整大小。下面说明了如何调整图表大小：\n\
  \n1.  单击图表内部（但不要单击任何条形、柱形、折线或饼图扇区）。\n2.  将鼠标指针悬停在图表角落或边缘中间出现的八个控点之一上，该控点可用于调整图表。指针会变为双向箭头。\n\
  3.  拖动鼠标指针以调整图表大小。\n\n**注意：** 请记住，边缘中间的控点仅允许您在水平或垂直方向上调整图表大小，而角落的控点则允许您在水平和垂直两个方向上调整。\n\
  \n调整图表大小可能会对坐标轴上显示的文本产生显著影响。Power BI Desktop 始终努力保持坐标轴文本的可用空间与整个图表大小成比例。\n\n对于柱形图、折线图和条形图，这可能导致文本被截断，并用省略号（三个点）表示并非所有文本都可见。对于柱形图和折线图，文本甚至可能倾斜\
  \ 45 度，或者旋转为垂直显示。\n\n如果您将条形图的高度（或柱形图或折线图的宽度）减小到某个阈值以下，Power BI Desktop 将停止尝试在非数值轴上显示所有元素。相反，它只会显示少数元素，并添加一个滚动条，让您可以滚动浏览其余数据。此外，如果轴标签无法完整显示，它们将被截断（并添加省略号）。您可以在图\
  \ 16-8 中看到条形图的这些效果示例。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig8_HTML.jpg](img/370912_3_En_16_Fig8_HTML.jpg)\
  \  \n*图 16-8* — 带有可见滚动条的图表\n\n这意味着您可能需要微调图表的大小和高宽比，直到获得最佳效果。如果您急于调整到位，我建议使用右下角的控点来调整图表大小，因为向上、向下、向左和向右拖动该控点可以快速向您展示可用的显示选项。\n\
  \n### 重新定位图表\n\n您可以按如下方式将图表移动到 Power BI Desktop 报表中的任意位置：\n\n1.  将鼠标指针放在图表的边框上。\n\
  2.  拖动鼠标指针。\n\n### 对图表元素进行排序\n\n有时，通过更改图表中数据的显示顺序，您可以真正突出数据的某个要点。到目前为止，您可能已经注意到，在创建图表时，坐标轴上的元素（对于条形图、柱形图、折线图或饼图都是如此）默认按字母顺序排列。如果您想确认这一点，只需查看图\
  \ 16-5 到 16-8 即可。\n\n现在，例如，假设您想展示车辆颜色如何影响毛利率。在这种情况下，您希望按从高到低的顺序对图表中的数据进行排序，以便清楚地了解数据是下降还是上升。以下步骤说明了如何执行此操作：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig9_HTML.jpg](img/370912_3_En_16_Fig9_HTML.jpg)\
  \  \n*图 16-9* — 使用图表中的弹出菜单对数据进行排序\n\n1.  如前所述（并在图 16-4 中显示），选择 Color 和 LaborCost\
  \ 的条形图类型。\n2.  将鼠标指针悬停在图表上。您会看到图表边框和选项按钮（右上角的省略号）出现。\n3.  单击省略号以显示图表菜单，然后单击“排序依据”右侧的\
  \ V 形图标，选择适当的字段来对数据进行排序（在此示例中为 LaborCost）。\n4.  单击“降序排序”。如图 16-9 所示，此时列按字母逆序排序。\n\
  \n如您所见，当按数值排序时，初始排序是降序。现在，假设您想按*升序*查看按颜色分类的销售额。您只需重复刚才的操作，图表就会重新排序。只不过这次是按升序排序。同样，当您*首次*对*文本*元素进行排序时，图表按*升序*排序，而*第二次*排序时则按*降序*排序。\n\
  \n关于饼图排序，我还想补充一点。当您按数值字段对饼图进行排序时，饼图会从图表顶部开始按顺时针方向排序。因此，如果您按 LaborCost 降序对颜色进行排序，那么销量最高的颜色位于饼图顶部（12\
  \ 点钟方向），销量第二高的颜色紧挨其右侧（例如，2 点钟方向），依此类推。图 16-10 显示了一个示例。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig10_HTML.jpg](img/370912_3_En_16_Fig10_HTML.jpg)\
  \  \n*图 16-10* — 在饼图中对数据进行排序\n\n## 环形图\n\n环形图本质上是饼图的一种变体。然而，与曝光度过高的“老大哥”饼图相比，它们能在呈现方式上带来令人耳目一新的变化。幸运的是，它们同样易于创建。在此示例中，您将了解如何可视化每辆已购车辆品牌所产生的零部件成本。为了改变方法，在此示例中，您将首先创建一个表，然后将其转换为环形图：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig11_HTML.jpg](img/370912_3_En_16_Fig11_HTML.jpg)\
  \  \n*图 16-11* — 环形图\n\n1.  继续使用（或打开）文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n\
  2.  确保未选中任何当前视觉对象。\n3.  展开“字段”列表中的“库存”表。\n4.  选中“品牌”字段左侧的框。一个包含已购品牌列表的表格将出现在仪表板画布上。\n\
  5.  保持选中此新表格，并单击“库存”表中“备件”字段左侧的复选框。这会将每个品牌的备件累计成本添加到表中。\n6.  单击“可视化”窗格中的“环形图”图标。这将把表格转换为环形图。\n\
  7.  如有必要，调整图表大小以清晰显示品牌名称，如图 16-11 所示。\n\n## 漏斗图\n\n在比较单个系列图表的相对值时，漏斗图是绝佳的选择。既然您现在已精通使用\
  \ Power BI Desktop 创建图表的技巧，那么设计一个显示按颜色分类的零部件成本的漏斗图对您来说应该不成问题。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig12_HTML.jpg](img/370912_3_En_16_Fig12_HTML.jpg)\
  \  \n*图 16-12* — 漏斗图\n\n1.  继续使用文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n\
  2.  展开“字段”列表中的“颜色”表。\n3.  将“颜色”字段拖到仪表板画布的空白区域。一个包含车辆颜色列表的表格将出现。\n4.  保持选中此新表格，并单击“库存”表中“备件”字段左侧的复选框。这会将每个品牌的零部件累计成本添加到表中。\n\
  5.  单击“可视化”窗格中的“漏斗图”图标。这将把表格转换为漏斗图。漏斗图会将备件成本值最高的颜色显示在视觉对象的顶部。\n6.  如有必要，调整图表大小以清晰显示颜色名称，并使所有颜色的相对权重更清晰易懂，如图\
  \ 16-12 所示。\n\n\n\n## 图表中的多数据值\n\n本章到目前为止，我们看到的都是显示单一数值的简单图表。遗憾的是，现实情况很少如此简单，因此是时候转向稍微复杂但可能更贴近实际的场景了——你需要比较和对照多个数据元素。\n\
  \n在这组示例中，我将假设我们需要深入分析迄今为止汽车销售中以下间接成本要素：\n\n- 零件\n- 人工\n\n因此，为了初步比较这些间接成本，我们先从一个簇状柱形图开始：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig13_HTML.jpg](img/370912_3_En_16_Fig13_HTML.jpg)\n\
  \n**图 16-13** – 图表中的多数据值——一个显示“布局”部分的簇状柱形图\n\n1. 打开（或继续使用）可下载示例中的文件 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix`。\n2. 从一个全新的 Power BI Desktop 报表开始，创建一个显示以下字段的表：\n \
  \  - `ClientName`（来自 `Clients` 表）\n   - `SpareParts`（来自 `Stock` 表）\n   - `LaborCost`（来自\
  \ `Stock` 表）\n3. 保持选中该表，点击可视化窗格中的簇状柱形图图标。\n4. 调整图表大小，使其清晰易懂，如图 16-13 所示。（我也在图中包含了可视化窗格中的字段，方便您查看。）\n\
  \n您会注意到，包含多个数据集的图表默认会显示图例，并且自动生成的图表标题现在显示为“按 `ClientName` 划分的 `SpareParts` 和 `LaborCost`”。同时，图表会自动按（添加的第一个数据系列中的）最高值从左侧开始排序。\n\
  \n相同的数据集也可以作为其他能有效显示多数据值的图表的基础：\n\n- 堆叠柱形图\n- 簇状柱形图和堆叠柱形图\n- 折线图\n- 面积图\n- 堆叠面积图\n\
  \n由于柱形图本质上是旋转了 90 度的条形图，我就不再展示示例了。但在图 16-14、16-15、16-16 和 16-17 中，您将分别看到堆叠柱形图、折线图、面积图和堆叠面积图的示例——它们都基于相同的数据创建。您还会发现，在创建这些类型的可视化时，可视化窗格字段井中的“布局”部分对于所有这些图表都是相同的。\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig17_HTML.jpg](img/370912_3_En_16_Fig17_HTML.jpg)\n\
  \n**图 16-17** – 基于多个数值的堆叠面积图\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig16_HTML.jpg](img/370912_3_En_16_Fig16_HTML.jpg)\n\
  \n**图 16-16** – 显示多个数值的面积图\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig15_HTML.jpg](img/370912_3_En_16_Fig15_HTML.jpg)\n\
  \n**图 16-15** – 显示多个数值的折线图\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig14_HTML.jpg](img/370912_3_En_16_Fig14_HTML.jpg)\n\
  \n**图 16-14** – 一个简单的堆叠柱形图\n\n这四种图表都以不同的方式展示了相同的数据。了解这一点后，您就可以选择最能传达信息、并将读者注意力吸引到您试图强调的重点上的图表类型。\n\
  \n如果您不确定哪种图表最能传达您的信息，那就逐个尝试所有类型。只需单击视觉对象库中的相关图标，即可将图表转换为另一种图表类型。实际上，有时差异可能极其细微。例如，面积图和堆叠面积图的本质区别在于\
  \ X（垂直）轴。在图 16-17 中，这是一个累计值。相比之下，图 16-16 直接比较了两个数值，数值较高的系列位于数值较低的系列之后。\n\n> **注意：**\
  \ 如果您愿意，这些图表类型中的任何一种都可以用来显示单一数据系列。这完全取决于您使用图表所呈现的效果以及见解的清晰度。\n\n### 100% 堆叠柱形图和条形图\n\
  \n比较多个数据集的一种方法是将每个单独的数据系列表示为总量的百分比。Power BI Desktop 包含了两种能够“开箱即用”实现此功能的图表类型。它们是\
  \ 100% 堆叠柱形图和 100% 堆叠条形图。\n\n既然您现在知道如何创建使用多个数据系列的图表，我就不详细解释如何生成这两种图表类型了；您只需从可视化窗格中选择正确的图表图标即可。因此，我建议您看看图\
  \ 16-18 和图 16-19，它们分别展示了使用与创建图 16-14 中簇状柱形图相同的数据生成的示例。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig19_HTML.jpg](img/370912_3_En_16_Fig19_HTML.jpg)\n\
  \n**图 16-19** – 一个 100% 堆叠条形图\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig18_HTML.jpg](img/370912_3_En_16_Fig18_HTML.jpg)\n\
  \n**图 16-18** – 一个 100% 堆叠柱形图\n\n\n\n## 散点图\n\n散点图是将数据值绘制在两条数值轴上的图表，因此根据定义，你需要两组数值数据才能创建散点图。为了理解这些图表的用途，让我们想象一下，你想查看所有已售汽车品牌和型号的销售额与利润率。希望这能让你看清，真正从卖车中赚钱的究竟是哪些车型。以下是如何操作的方法：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig20_HTML.jpg](img/370912_3_En_16_Fig20_HTML.jpg)\n\
  \n图 16-20\n\n一张散点图\n\n1.  使用文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`，删除所有现有的可视化对象。\n\
  \n2.  按此顺序创建一个包含以下字段的表：\n    1.  `Vehicle`（来自 Stock 表）\n    2.  `RatioNetMargin`（来自\
  \ InvoiceLines 表）\n    3.  `SalePrice`（来自 InvoiceLines 表）\n\n3.  单击可视化窗格中的散点图图标，将该表转换为散点图。Power\
  \ BI Desktop 将显示一个如图 16-20 所示的散点图。根据你的喜好调整图表大小。\n\n如果你查看可视化窗格的“字段”区域（也显示在图 16-20\
  \ 中），你会看到 Power BI Desktop 已按如下方式使用了你选择的字段：\n\n*   `Vehicle`：放置在“详细信息”框中。\n*   `RatioNetMargin`：放置在“X\
  \ 轴”框中。这是垂直轴。\n*   `SalePrice`：放置在“Y 轴”框中。这是水平轴。\n\n如果将鼠标指针悬停在散点图中的某个点上，你将看到该特定汽车型号的数据。\n\
  \n注意\n\n根据定义，散点图需要 X 轴和 Y 轴都具有数值。因此，如果你将非数值添加到“X 值”或“Y 值”框中，Power BI Desktop 会将数据转换为计数聚合。\n\
  \n我们通过首先将所有必需的字段添加到初始表中来制作此图表。我们还确保按正确的顺序添加它们，以便散点图首次就能正确显示。在交互式数据可视化的实际应用中，情况可能不会如此顺利，因此很高兴知道\
  \ Power BI Desktop 非常宽容。而且，如果你愿意，它允许你逐步构建散点图（就像任何其他图表一样）。在实践中，这意味着你可以从一个仅包含散点图最低要求三个字段中的两个字段的表开始，将该表转换为散点图，然后添加剩余的数据字段。Power\
  \ BI Desktop 始终将数值或时间字段分配给 X 和 Y 轴（按照它们在“字段”框中出现的顺序），并将第一个描述性字段放入“详细信息”框中。\n\n创建散点图后，你可以随意交换字段，并用数据表中其他字段替换现有字段。\n\
  \n## 气泡图\n\n散点图的一种变体是气泡图。这是我个人最喜欢的图表类型之一，当然，你不能过度使用它，否则会削弱其效力。基本上，气泡图是包含第三组数据的散点图。因此，散点图显示两组数据（一个在\
  \ X 轴上，一个在 Y 轴上），而气泡图允许你添加第三部分信息，该信息成为点的*大小*。因此，每个点都变成了一个气泡。\n\n理解气泡图的最佳方法是创建一个。因此，我们假设你想在一个图表中查看所有已售汽车品牌的以下数据：\n\
  \n*   总销售额\n*   净利润率\n*   毛利润\n\n这解释了气泡图如何为你做到这一点：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig21_HTML.jpg](img/370912_3_En_16_Fig21_HTML.jpg)\n\
  \n图 16-21\n\n一个初始气泡图\n\n1.  使用文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`，删除所有现有的可视化对象。\n\
  \n2.  按此顺序创建一个包含来自 SalesData 表的以下字段的表：\n    1.  `Make`（来自 Stock 表）\n    2.  `SalePrice`（来自\
  \ InvoiceLines 表）\n    3.  `RatioNetMargin`（来自 InvoiceLines 表）\n    4.  `Gross Margin`（来自\
  \ InvoiceLines 表）\n\n3.  单击散点图图标，将该表转换为散点图。是的，气泡图就是散点图，只是添加了一个新的调整。\n\n4.  将 `ClientSize`\
  \ 字段从 Clients 表拖到可视化窗格的“图例”框中。Power BI Desktop 将显示一个如图 16-21 所示的气泡图。\n\n5.  如果需要，调整图表大小。\n\
  \n如果你查看可视化窗格中的字段框（如图 16-22 所示），你会看到 Power BI Desktop 已按如下方式使用了你选择的字段。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig22_HTML.jpg](img/370912_3_En_16_Fig22_HTML.jpg)\n\
  \n图 16-22\n\n气泡图可视化窗格的字段框\n\n*   `Make`：放置在“详细信息”框中。这定义了核心气泡。\n*   `ClientSize`：添加到“图例”框中。这会为每个明细元素（品牌）和图例项（客户规模）的组合创建气泡。\n\
  *   `SalePrice`：放置在“X 轴”框中。这是垂直轴。\n*   `RatioNetMargin`：放置在“Y 轴”框中。这是水平轴。每个气泡都位于垂直轴和水平轴数值的交点处。\n\
  *   `Gross Margin`：放置在“大小”框中。这定义了点的大小，这些点因此变成了不同大小的气泡。\n\n将鼠标指针悬停在气泡图中的某个点上。你将看到放置在字段列表“布局”部分中每个品牌的所有数据，包括\
  \ `Gross Margin`。\n\n## 瀑布图\n\n我现在想介绍的是 Power BI Desktop 提供的一种更具原创性的图表类型——瀑布图。这种图表类型非常适合显示最终数值的组成部分；在此示例中，它用于显示各种已售品牌如何构成总销售额：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig23_HTML.jpg](img/370912_3_En_16_Fig23_HTML.jpg)\n\
  \n图 16-23\n\n一张瀑布图\n\n1.  打开文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`，并删除所有现有的可视化对象。\n\
  \n2.  单击瀑布图图标。你可以在图 16-23 中看到它。一个空的瀑布图将出现在仪表板画布上。\n\n3.  展开 Stock 表并勾选以下字段：\n  \
  \  1.  `Make`\n    2.  `CostPrice`\n\n4.  根据你的审美要求调整图表大小。它应该看起来像图 16-23。\n\n在分析一个整体的构成要素时，瀑布图非常有用。例如，你可以尝试用它来分解所有成本要素。值得注意的是，如果图表中有任何负值，它们将以与正值不同的颜色显示，并且会不可避免地减少右侧总计柱的值。\n\
  \n\n\n\n## 带状图\n\nPower BI Desktop 提供的图表选项中新增了一种带状图。带状图几乎总是以时间元素作为 X 轴，旨在展示随时间变化的趋势。更具体地说，它们总是将最高值置于图表的最上部带状区域。\n\
  \n这可能最好通过一个例子来理解。因此，我建议你尝试以下操作：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig24_HTML.jpg](img/370912_3_En_16_Fig24_HTML.jpg)\n\
  \n*图 16-24 – 带状图图标*\n\n1. 在“可视化”窗格中单击“带状图”图标（如图 16-24 所示）。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig25_HTML.jpg](img/370912_3_En_16_Fig25_HTML.jpg)\n\
  \n*图 16-25 – 一个带状图*\n\n2. 在“字段”列表中，单击以下字段：\n    - `MonthAndYear`（在 `DateDimension`\
  \ 表中）作为“轴”\n    - `SalePrice`（在 `InvoiceLines` 表中）作为“图例”\n    - `Make`（在 `Stock`\
  \ 表中）作为“值”\n\n3. 调整图表大小，使其看起来像图 16-25 所示。\n\n正如你所见，带状图展示了不同品牌汽车销售量随时间变化的起伏。实际上——虽然这可能提前涉及第\
  \ 17 章的内容——我建议你单击图表图例中的一个品牌。这将高亮显示该品牌，并展示其随时间的变化趋势。\n\n## 双轴图\n\n在结束图表类型介绍之前，让我们来看两种结合了你本章前面学过的两种基本图表类型的图表：\n\
  \n-   “折线图和簇状柱形图”\n-   “折线图和堆积柱形图”\n\n我们逐一讨论。\n\n### 折线图和簇状柱形图\n\n假设 Brilliant British\
  \ Cars 的首席执行官决定对车辆购买情况展开分析。他想找出可能影响购买的、令人感兴趣的相关性，以最大化利润。因此，为了满足他的要求（或者可能是为了迎合他），你决定转而查看间接成本和里程数，看看是否存在任何相关性。\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig26_HTML.jpg](img/370912_3_En_16_Fig26_HTML.jpg)\n\
  \n*图 16-26 – 一个折线图和簇状柱形图*\n\n1. 打开文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`，并删除任何现有的视觉对象。\n\
  \n2. 单击“折线图和簇状柱形图”图标。仪表板画布上会出现一个空的折线图和簇状柱形图。\n\n3. 展开“Stock”表并勾选以下字段：\n    - `Make`（将添加到“共享轴”框）\n\
  \    - `LaborCost`（将添加到“列值”框）\n    - `SpareParts`（将添加到“列值”框）\n\n4. 同样从“Stock”表中，将\
  \ `Mileage` 字段拖入“可视化”窗格字段槽中的“行值”框。\n\n5. 根据你的审美需求调整图表大小。它应该看起来像图 16-26 所示。\n\n正如你所见，此图表结合了使用左侧轴显示人工和零件成本的簇状柱形图，以及使用右侧轴显示里程数的折线图。这两个图表共享\
  \ X（或水平）轴。\n\n此外，这种分析可以让人立刻明白，有一种品牌即使里程数低也未必意味着维修成本低。因此，老板应该会很高兴你发现了这种意想不到的相关性。\n\
  \n### 折线图和堆积柱形图\n\n双轴图的一个关键优势在于，两个 Y 轴的刻度可以相差很大。因此，例如，当你想要查看零件和人工成本与购买成本（其数量级远高于其他两种成本）之间的关系时，使用折线图和堆积柱形图可以非常有助于更清晰地查看数据。\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig27_HTML.jpg](img/370912_3_En_16_Fig27_HTML.jpg)\n\
  \n*图 16-27 – 一个折线图和堆积柱形图*\n\n1. 打开文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`，并删除任何现有的可视化对象。\n\
  \n2. 展开“Stock”表并勾选以下字段，以在仪表板画布上显示一个表格：\n    - `Make`\n    - `LaborCost`\n    - `SpareParts`\n\
  \n3. 单击“折线图和堆积柱形图”图标。该表格将转换为一个折线图和堆积柱形图。\n\n4. 同样从“Stock”表中，将 `CostPrice` 字段拖入“可视化”窗格的字段槽。将其放置在“行值”框中。\n\
  \n5. 根据你的审美需求调整图表大小。它应该看起来像图 16-27 所示。\n\n通过这种方式，你可以比较数值，如果单一图表类型会导致某个值（本例中的成本价）使其他值相形见绌，以至于无法读取。\n\
  \n## 数据详情\n\n在结束图表类型介绍之前，我只想补充几点说明：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig28_HTML.jpg](img/370912_3_En_16_Fig28_HTML.jpg)\n\
  \n*图 16-28 – 显示图表的弹出数据*\n\n-   只需将鼠标指针悬停在条形（或柱形、折线、数据点或饼图扇区）上，你始终可以精确查看条形、柱形、折线、数据点或饼图扇区背后的具体数字。无论图表是正常大小还是已弹出覆盖\
  \ Power BI Desktop 报表区域，此功能均有效。\n\n-   无论你对图表做了多少修改，如果需要，你始终可以将其切换回表格。只需选中图表，然后从“设计”功能区中的“表格”按钮选择所需的表格类型即可。如果这样做，你会看到该表格会尝试模仿你应用于图表的设计调整，保持与图表相同的字体大小以及表格与图表相同的大小。如果你随后切换回图表，你会发现你应用的大多数设计选项仍然存在——当然，除非你在切换回图表可视化对象之前对表格做了任何更改。\n\
  \n-   你始终可以将为图表提供支持的原始数据并排显示在图表下方，就像使用基于文本的视觉对象一样。只需单击图表右上角的省略号，然后选择“显示数据”以显示源数据。你可以在图\
  \ 16-28 中看到一个示例（你还可以看到数据点如何在折线图、面积图和堆积面积图中显示）。\n\n要切换回仪表板画布，请单击图表左上角的“返回报表”。\n\n\
  \n\n### 深入挖掘与展开图表数据层级\n\nPower BI Desktop 图表的一个极其有用的特性是，你可以将其用作交互式演示工具。要发现数据所揭示的信息并将其传达给受众，最有效的方法之一就是深入挖掘或展开数据层级。所有标准的\
  \ Power BI 图表类型都允许你实现这一点。\n\n`向下钻取`适用于所有标准图表类型。这意味着你可以向下钻取到：\n\n-   堆积条形图\n-   堆积柱形图\n\
  -   簇状条形图\n-   簇状柱形图\n-   100% 堆积条形图\n-   100% 堆积柱形图\n-   折线图\n-   面积图\n-   堆积面积图\n\
  -   折线和堆积柱形图\n-   折线和簇状柱形图\n-   瀑布图\n-   散点图\n-   气泡图\n-   饼图\n-   漏斗图\n-   圆环图\n\
  -   树状图\n\n创建可钻取图表时需要记住的关键点是，你*必须*将要钻取的字段放置在字段井的 `轴` 区域（双轴图表的`共享轴`区域），*而不是*放置在`图例`区域（饼图也不是放在`详细信息`区域）。\n\
  \n#### 向下钻取\n\n幸运的是，你可以使用与上一章中导航数据层级相同的技巧来向下钻取图表。因此，将这种方法从表和矩阵扩展到图表是非常容易的。下面是一个简单的示例，演示如何在可钻取图表中分析所售车辆的品牌、型号和颜色层级：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig29_HTML.jpg](img/370912_3_En_16_Fig29_HTML.jpg)\n\
  \n*图 16-29*\n\n显示层级中最顶层数据的柱形图\n\n1.  单击`可视化`窗格中的`簇状柱形图`图标。仪表板画布上将创建一个空的图表视觉对象。\n\
  2.  按以下顺序将以下字段拖入字段井的`轴`区域：\n    1.  `品牌`（来自`库存`表）\n    2.  `型号`（来自`库存`表）\n    3.\
  \  `颜色`（来自`颜色`表）\n3.  将`售价`（来自`发票明细`表）和`里程`（来自`库存`表）字段拖入图表。图表将如图 16-29 所示。如您所见，它只显示`轴`字段井中的最顶层元素——车辆品牌。\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig30_HTML.jpg](img/370912_3_En_16_Fig30_HTML.jpg)\n\
  \n*图 16-30*\n\n显示层级中第二层数据的柱形图\n\n1.  单击图表右上角的`启用向下钻取`图标。该图标将变为深色背景上的白色箭头。\n2.  单击`阿斯顿·马丁`的任意一个柱体。图表现在将显示所售`阿斯顿·马丁`的型号，如图\
  \ 16-30 所示。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig31_HTML.jpg](img/370912_3_En_16_Fig31_HTML.jpg)\n\
  \n*图 16-31*\n\n显示层级中最底层数据的柱形图\n\n1.  单击`DB9`的任意一个柱体。图表现在将显示所售`阿斯顿·马丁 DB9`的颜色，如图\
  \ 16-31 所示。\n\n一旦向下钻取到图表的较低层级，你随时可以通过单击图表左上角的`向上钻取`图标返回到上一层级（并从那里继续向上钻取，直到达到最顶层）。\n\
  \n#### 在层级中展开全部下一级\n\n`在层级中展开全部下一级`图标产生的效果与通过单击图表中的柱体进行向下钻取不同。如果你单击`在层级中展开全部下一级`图标，你将看到*所有*下一层级的元素，而不仅仅是你点击的那个子组的层级元素。要了解这一点，请尝试以下步骤：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig32_HTML.jpg](img/370912_3_En_16_Fig32_HTML.jpg)\n\
  \n*图 16-32*\n\n将图表向下展开一级\n\n1.  重新创建上一节中的图表（执行步骤 1 至 3），直到您再次看到图 16-29 所示的图表。\n\
  2.  单击`在层级中展开全部下一级`图标。\n3.  调整图表大小以提高其可视性。您将看到一个如图 16-32 所示的图表。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig33_HTML.jpg](img/370912_3_En_16_Fig33_HTML.jpg)\n\
  \n*图 16-33*\n\n将图表再向下展开一级\n\n1.  再次单击`在层级中展开全部下一级`图标。\n2.  如有必要，调整图表大小。这次图表将如图 16-33\
  \ 所示。\n\n#### 转到层级中的下一级\n\n你可以应用的最后一个层级导航技巧是`转到层级中的下一级`。要测试此功能，请尝试以下步骤：\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig34_HTML.jpg](img/370912_3_En_16_Fig34_HTML.jpg)\n\
  \n*图 16-34*\n\n在图表中转到下一级\n\n1.  重新创建倒数第二节中的图表（执行步骤 1 至 3）。\n2.  单击`转到层级中的下一级`图标。\n\
  3.  调整图表大小以提高其可视性。您应该会看到一个如图 16-34 所示的图表。\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig35_HTML.jpg](img/370912_3_En_16_Fig35_HTML.jpg)\n\
  \n*图 16-35*\n\n在图表中转到更深层级\n\n1.  再单击一次`转到层级中的下一级`图标。您将看到一个如图 16-35 所示的图表。\n\n总之，可用于导航图表层级的三个选项是：\n\
  \n-   *向下钻取*：仅显示您单击的*特定元素*的下一级数据。\n-   *在层级中展开全部下一级*：显示*所有*元素的下一级数据。\n-   *转到层级中的下一级*：仅显示数据层级中*下一级*的数据。\n\
  \n**注意：** 无论您使用哪种技巧来显示较低层级的数据，您始终可以通过单击`向上钻取`图标返回到上一层级。\n\n\n\n## 包含与排除数据点\n\n你在第\
  \ 15 章中已经看到，可以在矩阵中包含和排除记录。同样，你也可以将这一技巧应用于图表。这有助于你清除杂乱数据、剔除异常值，或仅专注于选定的数据点集。以下是一个排除数据点的示例：\n\
  \n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig36_HTML.jpg](img/370912_3_En_16_Fig36_HTML.jpg)\n\
  \n**图 16-36** 排除数据点前的柱形图\n\n1. 使用以下数据元素创建一个如图 16-36 所示的簇状柱形图：\n   1. *轴*：`Make`（来自`Stock`表）\n\
  \   2. *图例*：`Model`（来自`Stock`表）\n   3. *值*：`SalePrice`（来自`InvoiceLines`表）\n\n![../images/370912_3_En_16_Chapter/370912_3_En_16_Fig37_HTML.jpg](img/370912_3_En_16_Fig37_HTML.jpg)\n\
  \n**图 16-37** 排除数据点后的柱形图\n\n2. 按住`Ctrl`单击以选中四个最高的柱形。\n3. 右键单击任意选中的柱形，然后从弹出菜单中选择**包含**。图表将显示为图\
  \ 16-37 所示。\n\n剩余数据与之前完全相同，但移除过高的柱形后，你可以更清晰地看到其他数据元素之间的差异。\n\n最后一点，从图 16-36 可以看出，如果图例包含过多无法舒适显示的项目，图表会提供一个滚动箭头，以便你查看图例中的其余项目。\n\
  \n## 结论\n\n本章带你了解了可在 Power BI Desktop 报表和仪表板中使用的各种可用图表类型。这些图表从经典的饼图、折线图、柱形图和条形图，延伸至不常见的漏斗图、圆环图、面积图、散点图、气泡图和瀑布图。你看到有些图表适用于单个数据系列，而另一些则可以处理多个数据系列。为了增加特殊效果，你还了解了如何创建混合图表类型、创建百分比条形图和柱形图，以及调整轴元素。\n\
  \n然而，如果你决定添加一些引人注目的格式，这些图表可以以更高层次呈现。这正是你将在下一章学习的内容。\n\n"
- "# 17. 在 Power BI Desktop 中格式化图表\n\n既然你已经掌握了基本图表，现在是时候进入下一步，学习如何调整图表以达到最佳效果。本章专门介绍\
  \ Power BI Desktop 中可用的各种技巧，以使你的图表真正清晰且强大。其中一些增强功能适用于所有图表类型，而另一些则特定于单一图表类型——甚至是一两种图表类型。\n\
  \n有时，你可以通过改变数据到图表元素的映射来更改图表的配置，从而增强图表效果。然而，在大多数情况下，你可以通过修改各种格式选项来增强图表——当你选中图表后在“可视化”窗格中点击油漆滚筒图标（格式图标）时，这些选项就会显示。为方便起见，从现在起我将其称为“格式部分”。\n\
  \n除了在本章中介绍格式化图表外，我们还将探讨 Power BI Desktop 中一个非常有趣的方面。这将涉及对可用内置分析功能的介绍。这些功能可以帮助你隔离并突出显示所创建图表中的关键趋势和信息。\n\
  \n在本章中，你将使用`C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix` Power BI Desktop\
  \ 文件（该文件可从 Apress 网站下载）作为你创建的任何图表的基础。\n\n## 多个图表的格式化\n\n值得注意的是，从一开始就可以通过按住`Ctrl`单击选择多个图表，在对它们进行任何格式更改之前，将相同的修改应用于同一仪表板页面上的多个图表。\n\
  \n然而，同时修改多个图表仅在*所有*选中的图表类型相同时才有效。\n\n## 图表图例\n\n如果你有一个图表包含多个提供其数值的字段（或者你正在创建饼图或圆环图），那么你会看到图例自动出现。\n\
  \n你可以通过修改以下任一选项来格式化图例：\n\n- 图例显示\n- 位置\n- 图例标题\n\n让我们逐一看看这些选项。\n\n> **注意：** 只有当`值`字段中添加了多于一个字段时，图例才能显示（饼图和圆环图除外）。\n\
  \n### 图例显示\n\n在某些情况下，Power BI Desktop 可能会自动显示图例，但你是否需要图例由你最终决定。要关闭图例，请执行以下操作：\n\n\
  1. 选中你想要隐藏图例的图表。\n2. 在“可视化”窗格中，点击“格式”图标以显示格式部分。\n3. 将“图例”按钮向左拖动（或点击其左侧），使其从实心圆变为空心圆。\n\
  \n图例将从选中的图表中消失。\n\n#### 图例位置\n\n默认情况下，图例位于图表的左上角。但你可以选择将图例放置在图表区域内的其他位置。请按以下步骤操作：\n\
  \n1. 选中你想要修改图例的图表。\n2. 在“可视化”窗格中，点击“格式”图标。\n3. 展开“图例”部分。\n4. 从“位置”弹出菜单中选择一个可用的图例位置。\n\
  \n可用选项如表 17-1 所示。\n\n**表 17-1** 图例位置选项\n\n| 图例选项 | 描述 |\n| --- | --- |\n| 顶部 | 图例显示在图表上方左侧。\
  \ |\n| 底部 | 图例显示在图表下方左侧。 |\n| 左侧 | 图例显示在图表左侧顶部。 |\n| 右侧 | 图例显示在图表右侧顶部。 |\n| 顶部居中\
  \ | 图例显示在图表上方居中。 |\n| 底部居中 | 图例显示在图表下方居中。 |\n| 左侧居中 | 图例显示在图表左侧居中。 |\n| 右侧居中 | 图例显示在图表右侧居中。\
  \ |\n\n如果某个图例选项显示为灰色，则表示该选项当前处于活动状态。\n\n图例可能需要进行一些调整，才能以可读的方式显示其内容。这是因为图例文本在初始显示时常常会被截断。如果是这种情况，唯一可行的选项就是修改图表大小或图例字体大小。\n\
  \n> **注意：** 你不能向*仅包含单个*数据系列的面积图、柱形图、条形图或折线图添加图例。\n\n#### 图例标题\n\n如果需要，你可以为图例添加标题：\n\
  \n1. 使用以下字段创建一个簇状柱形图（我假设你现在已经足够熟悉源数据表，可以使用`CarSalesDataForReports.pbix`文件定位这些字段）：\n\
  \   1. `Make`\n   2. `SalePrice`\n   3. `Mileage`\n2. 在“可视化”窗格中，点击“格式”图标。\n3. 展开“图例”部分。\n\
  4. 确保“图例”按钮设置为**开启**。\n5. 从可用选项的弹出列表中选择一个位置。\n6. 确保“标题”按钮设置为**开启**。\n7. 在“图例名称”框中输入图例标题。我建议添加**销售分析：**。\n\
  8. 从调色板中选择图例文本的颜色。\n9. 选择字体系列和文本大小。\n\n带有标题的图例示例如图 17-1 所示。\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig1_HTML.jpg](img/370912_3_En_17_Fig1_HTML.jpg)\n\
  \n**图 17-1** 带有标题的图例\n\n\n\n### 图表标题\n\n每个图表都有一个标题，用于说明图表显示的内容，即其所基于的字段。可用的选项相当简单：\n\
  - 隐藏或显示标题\n- 修改标题的默认文本\n- 更改字体颜色\n- 更改标题的背景颜色\n- 更改对齐方式\n\n让我们看看如何将所有这些选项应用于你之前创建的图表标题：\n\
  \n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig2_HTML.jpg](img/370912_3_En_17_Fig2_HTML.jpg)\n\
  \n**图 17-2** – 图表标题调整\n\n1. 选择包含你想要修改的标题的图表。\n2. 在**可视化**窗格中，单击**格式**图标。\n3. 展开**标题**部分。\n\
  4. 确保**标题**按钮处于**开启**位置。或者，切换到**关闭**位置以隐藏标题。\n5. 在**标题文本**框中修改标题文本。在此示例中，我将其设置为\
  \ `Profitability`。\n6. 如果标题需要换行显示，请将**自动换行**设置为**开启**。\n7. 单击**字体颜色**右侧的弹出菜单三角形，从可用颜色面板中选择一种颜色。\n\
  8. 单击**背景颜色**右侧的弹出菜单三角形，从可用色调面板中选择一种颜色。\n9. 单击**对齐**右侧的中间图标。这将使文本相对于表格宽度居中。\n10.\
  \ 调整**文本大小**以设置更大的字号。你可以在图 17-2 中看到这些调整的结果。\n\n你始终可以使用自由格式文本框向图表添加进一步标注。此技术在第 23\
  \ 章中介绍。\n\n### 图表数据标签\n\n你已经看到，只需将鼠标指针悬停在感兴趣的数据上，就可以显示柱状图、条形图或折线图中某个数据点背后的精确数据。但有时你可能希望将图表背后的值永久显示在可视化内容上。这时就需要用到数据标签。\n\
  \n要向图表添加数据标签（在此示例中，我继续使用你在本章开头创建的图表），你只需执行以下操作：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig3_HTML.jpg](img/370912_3_En_17_Fig3_HTML.jpg)\n\
  \n**图 17-3** – 柱状图中的数据标签\n\n1. 选择要添加数据标签的图表。\n2. 在**可视化**窗格中，单击**格式**图标。\n3. 展开**数据标签**部分。\n\
  4. 将**数据标签**按钮设置为**开启**。\n5. 通过单击显示单位的弹出列表，为卡片中的数字选择显示单位。在此示例中，我将千作为单位应用。\n6. 通过单击**精度**框右侧的上下三角形，为卡片数据选择要使用的小数位数。如果你愿意，也可以直接输入小数位数。\n\
  7. 从弹出颜色面板中为数据标签选择一种颜色。\n8. 从**方向**弹出列表中选择一种对齐样式（垂直或水平）。\n9. 如果你希望文本溢出，请将**溢出文本**设置为**开启**。这意味着，无法完全放入条形图内部的文本元素仍然会被显示——即使它被截断了。\n\
  10. 选择标签相对于数据的位置（此选项仅适用于条形图和柱状图）。\n11. 如果需要，可以微调文本大小和字体。\n12. 将数据标签的背景颜色设置为**开启**——如果你希望数据标签显示在特定的彩色背景上，请从颜色面板中选择一种背景颜色。\n\
  13. 使用滑块调整数据标签背景的透明度。你可以在图 17-3 中看到此操作效果的示例。\n\n**注意：** 将数据标签应用于柱状图、条形图和折线图时，你可能会注意到，有时\
  \ Power BI Desktop 无法将所有数据标签物理地放置在你所选选项所暗示的精确位置。这是因为有时条形图或柱状图内部没有足够的空间来容纳这些数字。在这些情况下，Power\
  \ BI Desktop 会将数据放置在条形图或柱状图的外部。在其他情况下，数据无法放置在折线图、柱状图或条形图的外部，除非将其放置在轴的上端之上。在这里，Power\
  \ BI Desktop 同样会调整呈现方式，以尽可能接近你要求的效果。这可能意味着数据标签根本不会显示。\n\n数据标签定位的各种选项在表 17-2 中给出。\n\
  \n**表 17-2** – 数据标签位置选项\n\n| 数据标签位置 | 描述 |\n| --- | --- |\n| 自动 | Power BI Desktop\
  \ 会为获得最佳效果而放置数据标签。 |\n| 内端 | 数据标签放置在条形图的右侧内部或柱状图的顶部内部。 |\n| 外端 | 数据标签放置在条形图的右侧外部或柱状图的顶部外部。\
  \ |\n| 内部居中 | 数据标签放置在条形图或柱状图的中心内部。 |\n| 内基 | 数据标签放置在条形图的左侧内部或柱状图的底部内部。 |\n\n关于数据标签主题，还有最后几点需要注意：\n\
  - 散点图和气泡图不显示数据标签。\n- 如果你愿意，可以显示并调整图表中一个或所有数据系列的数据标签。只需单击**自定义系列**按钮将其设置为**开启**，然后从弹出列表中选择要设置格式的数据元素。然后，你可以像为整个图表设置数据标签格式一样，为这个选定的系列设置格式。\n\
  \n### 图表背景\n\n如果你需要改变图表的美感，或者需要使某个图表在仪表板中脱颖而出，你还可以修改整个图表的背景颜色。因此，继续使用你之前创建的图表，你可以执行以下操作：\n\
  \n1. 选择要修改背景的图表。\n2. 在**可视化**窗格中，单击**格式**图标。\n3. 展开**背景**部分。\n4. 确保**背景开启/关闭**开关设置为**开启**（右侧的实心圆）。\n\
  5. 单击**背景颜色**右侧的弹出菜单三角形，从可用颜色面板中选择一种颜色。\n6. 将**透明度**滑块向左或向右移动，以增加或减少背景颜色的透明度（以及随之而来的强度）。\n\
  \n## 数据颜色\n\n所有图表都允许你指定每个数据系列的颜色。当然，所需的工作量取决于你想要修改的数据系列的数量。操作方法如下：\n\n1. 选择要修改数据颜色的图表。\n\
  2. 在**可视化**窗格中，单击**格式**图标。\n3. 展开**数据颜色**部分。将显示图表数据系列（或某些图表类型的数据元素）列表。\n4. 从可用的弹出颜色面板中为每个数据元素或系列选择一种颜色。\n\
  \n图 17-4 显示了你当前正在处理的图表修改后的数据颜色。\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig4_HTML.jpg](img/370912_3_En_17_Fig4_HTML.jpg)\n\
  \n**图 17-4** – 指定数据颜色\n\n**注意：** 如果图表仅包含一个数据系列（饼图和环形图总是如此，柱状图、折线图、条形图和面积图也可能如此），你可以选择为数据系列的*每个数据点*设置颜色。\n\
  \n\n\n## 绘图区\n\n除饼图、环形图和漏斗图外，您可以为选定图表的绘图区设置背景图像。以下是操作示例：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig5_HTML.jpg](img/370912_3_En_17_Fig5_HTML.jpg)\n\
  \n*图 17-5* – 向图表绘图区添加图像\n\n1. 选中您要修改绘图区的图表（我仍使用本章开头看到的那个图表）。\n2. 在**可视化**窗格中，点击**格式**图标。\n\
  3. 展开**绘图区**部分。\n4. 点击**添加图像**。将出现标准的 Windows **打开**对话框。\n5. 导航到您要添加的图像文件。我将使用 `C:\\\
  PowerBiDesktopSamples\\Images\\GreenShade.png`。\n6. 点击**打开**。\n7. 在**图像适合**弹出菜单中，选择**适合**。图像将展开以填满整个绘图区。您可以在图\
  \ 17-5 中看到应用于图表的图像示例。\n\n**注意：** 要删除您添加的图像，在**可视化**窗格的**格式**区域的**绘图区**部分中，点击图像文件名右侧的小叉号即可。\n\
  \n## 轴修改\n\n大多数图表（饼图、环形图和漏斗图除外）都允许您调整轴属性。这意味着修改：\n\n- X（水平）轴\n- Y（垂直）轴\n\n我们将分别快速了解一下两者。\n\
  \n#### 修改 X 轴\n\n您可以更改 X 轴的以下几个方面：\n\n- 轴显示\n- 轴标题和呈现方式\n- 轴标签的字体属性\n- 类别宽度\n\n\
  一个简单的示例解释了如何调整 X 轴的这些方面：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig6_HTML.jpg](img/370912_3_En_17_Fig6_HTML.jpg)\n\
  \n*图 17-6* – 格式化 X 轴\n\n1. 选中您想要修改的带有 X 轴的图表。我将继续使用本章开头展示的图表。\n2. 在**可视化**窗格中，点击**格式**图标。\n\
  3. 展开**X 轴**部分。\n4. 确保**X 轴**开关已设置为**开启**（这会显示轴和描述性元素）。\n5. 为轴标签选择字体、字号和颜色。\n6.\
  \ 将**标题**设置为**开启**（这会添加轴标题）。输入**车辆品牌**作为**轴标题**。\n7. 在**可视化**窗格中（如果需要）向下滚动，为轴标题选择字体、字号和颜色。\n\
  8. 设置更大的**最小类别宽度**（这是图表中每个条形图的宽度）。\n9. 设置更大的**内边距**（这是条形图组之间的间距）。\n10. 设置**最大尺寸**（这定义了轴元素相对于绘图区高度的最大高度）。您可以在图\
  \ 17-6 中的**可视化**窗格的**格式**区域看到这些属性。最终格式化后的图表如图 17-8 所示。\n\n#### 修改 Y 轴\n\n如果您的图表有\
  \ Y 轴（或者对于双轴图表，有两个 Y 轴），那么您可以修改以下元素：\n\n- 轴位置\n- 轴刻度类型\n- 轴起始值\n- 轴结束值\n- 标题显示\n\
  - 显示单位\n- 数字精度\n- 网格线和网格线样式\n\n同样，通过一个示例来了解如何应用这些不同的格式化选项可能最简单。我继续使用本章开头看到的图表。\n\
  \n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig7_HTML.jpg](img/370912_3_En_17_Fig7_HTML.jpg)\n\
  \n*图 17-7* – 格式化 Y 轴\n\n1. 选中您要修改轴属性的图表。我将继续使用我们本章一直在修改的图表。\n2. 在**可视化**窗格中，点击**格式**图标。\n\
  3. 展开**Y 轴**部分。\n4. 从**位置**弹出菜单中，选择**右侧**。\n5. 确保**刻度类型**设置为**线性**——如果您需要对数刻度，则设置为**对数**。\n\
  6. 输入**起始值**以设置轴的起始数值。该值可以为负数，并且必须是完整的、未格式化的数字（包括千位或百万位）。在本示例中，我将其保留为**自动**。\n7.\
  \ 输入**结束值**以设置轴的上限数值。同样，该值必须是完整的、未格式化的数字（包括千位或百万位）。在本示例中，我将其设置为**15000000**。\n8.\
  \ 设置 Y 轴元素的字体、字号和颜色。\n9. 将**显示单位**设置（或保留）为**自动**。\n10. 将**标题**开关切换为**开启**以显示 Y 轴标题。\n\
  11. 将**样式**设置为**显示两者**。这样轴标题将同时显示数字和单位。您可以根据偏好选择其中一种。\n12. 在**值小数位数**字段中输入要显示在轴上的小数位数。\n\
  13. 在**轴标题**字段中输入标题。我添加的是**巨额利润**。\n14. 设置轴标题的字体、字号和颜色。\n15. 将**网格线**设置为**开启**。\n\
  16. 为网格线选择一种颜色。\n17. 选择描边宽度和线条样式。您可以在图 17-7 中的**可视化**窗格**格式**区域的 Y 轴部分看到这些设置。最终的图表如图\
  \ 17-8 所示。\n\n如果您修改的是只有一个轴的图表，您可以通过从**位置**弹出菜单中选择**右侧**，将轴从图表的左侧移动到右侧。对于具有两个轴的图表，您可以使用此设置来交换轴的位置。\n\
  \n如果您的图表包含*两个*Y 轴（一个在左侧，一个在右侧），那么您可以对另一个轴重复这些设置。您可能需要在**可视化**窗格中向下滚动才能看到第二个轴的设置。\n\
  \n**注意：** 请记住，您可以在数据模型中将特定值定义为度量。如果您需要为图表中的 Y 轴设置可重复使用的最大值和最小值，这将非常有用。\n\n### 图表边框\n\
  \n您可以像上一章为表格添加边框一样，为图表添加边框。只需点击**格式**图标，然后将**边框**按钮设置为**开启**。您随时可以通过展开**边框**部分并从可用颜色的弹出菜单中选择一种颜色来指定边框颜色。\n\
  \n### 通用属性\n\n与上一章中看到的基于文本的可视化对象一样，您可以在**可视化**窗格的**格式**区域的**常规**部分中，指定图表在仪表板画布上的精确位置。\n\
  \n### 图表宽高比\n\n作为图表格式化的最后一点说明，值得记住的是，您可以锁定图表的宽高比。这可以确保当您调整图表大小时，其宽度和高度相对于彼此保持原始比例。\n\
  \n要设置宽高比：\n\n1. 点击图表以将其选中。\n2. 在**可视化**窗格中，点击**格式**图标。\n3. 在**锁定宽高**部分，点击**关闭**以开启锁定，或者点击表示锁定关闭的空心圆右侧，使其滑动到右侧并变成实心圆。\n\
  \n现在，当您使用角手柄调整表格大小时，它将保持其高度与宽度的比例。\n\n最后，在图 17-8 中，您可以看到应用了所有修改的图表。在您对我（缺乏）的品味翻白眼之前，请注意，我并不是建议您以这种方式呈现图表（事实上，您可能应该将此视为*不应该*做什么的例子）。我只是想展示应用许多可用图表格式化选项后的结果。\n\
  \n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig8_HTML.jpg](img/370912_3_En_17_Fig8_HTML.jpg)\n\
  \n*图 17-8* – 一个完全格式化的图表\n\n\n\n## 特定图表格式\n\n尽管本章前面介绍的大多数图表都共享许多通用的格式选项，但其他图表也提供了不同的格式可能性。这意味着，虽然条形图、堆叠条形图、柱形图和堆叠柱形图都可以使用您刚刚学到的技术进行格式化，但其他图表类型则需要发现一些新的调整技巧。\n\
  \n### 折线图、面积图和堆叠面积图\n\n一组共享新格式化选项的图表是折线图、面积图和堆叠面积图。更具体地说，它们都允许您调整图表的线条和点样式。以下示例向您展示了具体操作：\n\
  \n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig9_HTML.jpg](img/370912_3_En_17_Fig9_HTML.jpg)\n\
  \n图 17-9 折线图中的形状选项\n\n1. 使用以下字段创建一个新的折线图（使用文件 `CarSalesDataForReports.pbix`）：\n\
  \   1. `Color`（来自 `Colors` 表）\n   2. `SpareParts`（来自 `Stock` 表）\n   3. `LaborCost`（来自\
  \ `Stock` 表）\n2. 在 `Visualizations` 窗格中，单击 `Format` 图标。\n3. 展开 `Shapes` 部分。\n4.\
  \ 将 `Stroke width` 设置为 `5`。\n5. 将 `Show marker` 设置为 `On`。\n6. 从 `Marker shape` 弹出列表中选择一个标记形状。\n\
  7. 增加标记大小并更改其颜色。\n8. 将 `Line style` 设置为 `Dashed`。\n9. 将 `Customize series` 设置为 `On`。\n\
  10. 从弹出列表中选择 `SpareParts` 作为要修改的数据系列。\n11. 将 `Stroke width` 设置为 `1`，将 `Line style`\
  \ 设置为 `Dotted`。\n12. 将 `Show marker` 设置为 `On`。\n13. 从 `Marker shape` 弹出列表中选择一个不同的标记形状。\n\
  14. 减小标记大小并更改其颜色。\n15. 将 `Stepped` 设置为 `On`。您应该会看到一个类似于图 17-9 所示的图表。\n\n**注意：**\
  \ 如果没有显示标记，您可以从 `Shapes` 部分的 `Join type` 弹出菜单中选择连接类型（线条改变方向的交点）。\n\n### 饼图和环形图\n\
  \n饼图和环形图也具有特定的格式化可能性。这些包括您可以更改饼图或环形图详细标签的方式。尝试以下操作：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig10_HTML.jpg](img/370912_3_En_17_Fig10_HTML.jpg)\n\
  \n图 17-10 饼图中的形状选项\n\n1. 使用以下字段创建一个新的饼图（使用文件 `CarSalesDataForReports.pbix`）：\n \
  \  1. `Color`（来自 `Colors` 表）\n   2. `SpareParts`（来自 `Stock` 表）\n2. 在 `Visualizations`\
  \ 窗格中，单击 `Format` 图标。\n3. 将 `Legend` 设置为 `On`，并将其放置在左侧居中位置。\n4. 展开 `Detail labels`\
  \ 部分。\n5. 从 `Label style` 弹出列表中选择 `Data value`。\n6. 从调色板中选择一种颜色。\n7. 输入或选择一个更大的文本字号。\n\
  8. 从 `Display units` 弹出列表中选择 `Millions` 作为显示单位。\n9. 为 `Value decimal places` 设置输入\
  \ `4`。\n10. 将 `Background` 设置为 `On`。\n11. 将 `Overflow text` 设置为 `On`（这允许数据标签即使跨越饼图扇区边界也能显示）。您将得到一个类似于图\
  \ 17-10 所示的图表。\n\n## 带状图\n\n带状图包含您之前看到的应用于堆叠柱形图的所有标准格式选项，因此我在此不再赘述所有这些可能性。然而，有一种格式化选项是此图表类型所特有的，即带状格式化。\n\
  \n要查看具体操作：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig11_HTML.jpg](img/370912_3_En_17_Fig11_HTML.jpg)\n\
  \n图 17-11 一个带状图\n\n1. 重新创建您在第 16 章中制作的带状图。\n2. 单击 `Visualizations` 窗格中的 `Format`\
  \ 图标。\n3. 展开 `Ribbons` 部分。\n4. 将 `Spacing` 设置为 `10`。这会设置每个带状条之间的间距。\n5. 将 `Match\
  \ series color` 设置为 `Off`。这会将带状条颜色设置为灰色，而不是每个数据点的条形颜色。\n6. 将 `Border` 设置为 `On`。结果（您可以与图\
  \ 16-25 进行比较）如图 17-11 所示。\n\n## 漏斗图\n\n漏斗图允许您显示（或不显示）并格式化该图表类型特有的一个元素——转化率。这些是显示在漏斗上方和下方的百分比数字。以下简短指南说明了如何操作：\n\
  \n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig12_HTML.jpg](img/370912_3_En_17_Fig12_HTML.jpg)\n\
  \n图 17-12 在漏斗图中调整转化率\n\n1. 使用文件 `CarSalesDataForReports.pbix`，使用以下字段创建一个新的饼图：\n\
  \   1. `Color`（来自 `Colors` 表）\n   2. `SpareParts`（来自 `Stock` 表）\n2. 按 `SpareParts`\
  \ 排序。\n3. 展开 `Visualizations` 窗格中 `Format` 区域的 `Conversion Rate` 部分。\n4. 从调色板中选择一种颜色。\n\
  5. 输入或选择一个更大的文本字号。您将得到一个类似于图 17-12 所示的图表。\n\n**注意：** 要阻止显示转化率，您只需单击 `Conversion\
  \ Rate Label` 按钮即可。\n\n### 散点图和气泡图\n\n最后一组允许您应用某些特定格式的图表是散点图和气泡图。在创建这些图表类型时，您可以更改以下内容：\n\
  \n- 填充点\n- 类别标签\n- 按类别着色\n- 颜色边框\n- 气泡\n\n为了查看这些效果，我们将创建一个新图表，然后尝试一些可用的选项。我们将从一个散点图开始，然后将其扩展为气泡图：\n\
  \n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig13_HTML.jpg](img/370912_3_En_17_Fig13_HTML.jpg)\n\
  \n图 17-13 格式化气泡图\n\n1. 使用以下数据元素创建一个散点图：\n   1. *Details*：`Make`（来自 `Stock` 表）\n\
  \   2. *X axis*：`SalePrice`（来自 `InvoiceLines` 表）\n   3. *Y axis*：`RatioNetMargin`（来自\
  \ `InvoiceLines` 表）\n2. 单击 `Visualizations` 窗格的 `Format` 图标。\n3. 将 `Fill point`\
  \ 按钮切换到 `On`。\n4. 也将 `Color by category` 设置为 `On`。\n5. 展开 `Shapes` 部分并将 `Size` 设置为\
  \ `20`。\n6. 选择一个不同的 `Marker shape`。\n7. 将以下数据元素添加到 `Visualizations` 窗格的 `Fields`\
  \ 区域：\n   1. *Size*：`Gross Margin`（来自 `InvoiceLines` 表）\n8. 将 `Color border` 设置为\
  \ `On`。\n9. 展开 `Data colors` 部分。现在图表看起来将类似于图 17-13 所示。\n\n此时需要说明几点：\n\n- 添加一个用于表达颜色饱和度的字段会停用\
  \ `Color by category` 格式化选项，并阻止您分配特定的数据颜色。\n- 对于气泡图，您可以在 `Data colors` 部分指定用于定义气泡中颜色差异的实际值（假设已添加了颜色饱和度的值）。\n\
  \n\n\n## 气泡图播放轴\n\n到目前为止，在本章中，你已经了解了以图表形式呈现数据的各种方式，以及如何使用多种图表类型选择和比较数据。Power BI\
  \ Desktop 中的最后一个技巧（对于吸引观众注意力极其有效）是向可视化对象应用播放轴。这会使图表动起来，并且理想情况下，它非常适合展示数据如何随时间演变。遗憾的是，在纸质页面上很难获得“惊艳”的效果，因此这确实是一种必须亲自尝试的技术。\n\
  \n你需要知道，播放轴只能应用于散点图或气泡图。同样，添加播放轴并不适合或增强所有类型的数据。但是，如果你有一个时间相关的元素可以添加到图表中作为 Y 轴（例如，迄今为止的销售额），那么你可以产生一些强大且具有启示性的效果。\n\
  \n下面说明如何创建一个气泡图，显示所售汽车颜色的净利润率与年初至今销售额的关系：\n\n1.  打开文件 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix` 并删除任何现有的视觉对象。\n2.  使用以下字段和顺序创建一个气泡图：\n    -   *图例*：`Make`（来自\
  \ Stock 表）\n    -   *X 轴*：`YearSales`（来自 Invoices 表）\n    -   *Y 轴*：`RatioNetMargin`（来自\
  \ InvoiceLines 表）\n    -   *大小*：`CostPrice`（来自 Stock 表）\n    -   *播放轴*：`MonthAndYearAbbr`（来自\
  \ DateDimension 表）\n3.  调整呈现方式（大小、图例位置、数据标签等）以获得最佳效果。\n\n点击播放轴左侧的“播放”图标。你将看到气泡揭示出销售数据在整个年度中的进展情况。在时间线上的某个点，视觉对象将如图\
  \ 17-14 所示。\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig14_HTML.jpg](img/370912_3_En_17_Fig14_HTML.jpg)\n\
  \n图 17-14 — 气泡图上的播放轴\n\n在讨论播放轴时，有几点值得注意：\n\n-   你可以在动画播放过程中点击暂停图标（播放图标此时已变为暂停图标）来暂停自动显示。你可以随意停止和开始。\n\
  -   你可以点击播放轴上的任意月份（或任意元素）来仅显示该元素的数据，而无需播放该时间点之前的数据。这本质上意味着你可以将播放轴用作数据的筛选器。\n-  \
  \ 播放轴不必基于时间。然而，如果不以时间作为播放轴的基础，则更难看到数据的任何连贯性或进展。\n-   使用累计数据（例如本示例中的 `YearSales`\
  \ 数值，即年初至今的累计销售额）在基于时间的播放轴中尤其有效，因为它能让你了解每个数据项的销售额随时间增长的情况。\n-   你可以将播放轴用作数据的另一个交互式筛选器，但这会让你错过一个绝妙的动画技术！\n\
  \n## 图表分析\n\n向图表中的数据添加额外强调的另一种方法是添加分析增强功能。这些是添加的元素，用于将读者的注意力吸引到自动计算的值上。所有这些项目都作为线条独立于现有数据添加到图表中。它们包括：\n\
  \n-   *常量*：你可能希望将特定值作为图表中的一项添加。\n-   *最小值*：这允许你引起对下限的关注。\n-   *最大值*：这允许你引起对上限的关注。\n\
  -   *平均值*：你可以让 Power BI Desktop 计算一组数值的平均值并将其显示为一条线。\n-   *中位数*：Power BI Desktop\
  \ 也可以计算并显示中位数值。\n-   *百分位数*：你可以指定要显示的百分位数。\n\n为了更近距离地了解这一点，假设你想向一个包含所有品牌汽车的售价和里程数的图表添加以下线条：\n\
  \n-   平均里程数\n-   最高售价\n\n以下是操作方法：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig15_HTML.jpg](img/370912_3_En_17_Fig15_HTML.jpg)\n\
  \n图 17-15 — 添加图表分析\n\n1.  点击“可视化”窗格中的“簇状柱形图”图标。仪表板画布上将创建一个空的柱形图视觉对象。\n2.  按以下顺序将以下字段拖入字段井的“轴”区域：\n\
  \    -   `Make`（来自 Stock 表）\n    -   `Model`（来自 Stock 表）\n    -   `Color`（来自 Colors\
  \ 表）\n3.  将以下字段拖入字段井的“值”区域：\n    -   `SalePrice`（来自 InvoiceLines 表）\n    -   `Mileage`（来自\
  \ Stock 表）\n4.  点击“分析”图标（位于“可视化”窗格中“格式”图标的右侧）。\n5.  展开“平均线”部分。\n6.  点击“添加”。\n7.\
  \  从“度量”弹出列表中选择 `Mileage`。\n8.  从可用颜色调色板中选择一种颜色。\n9.  将线条样式设置为“虚线”。\n10. 点击“数据标签”按钮以激活数据标签。\n\
  11. 将文本设置为“名称和值”。\n12. 将水平位置设置为“右侧”。\n13. 将垂直位置设置为“下方”。\n14. 双击包含文本“平均线 1”的字段，然后输入**平均里程数**。\n\
  15. 关闭“平均线”部分。\n16. 展开“最大线”部分。\n17. 点击“添加”。\n18. 从“度量”弹出列表中选择 `SalePrice`。\n19.\
  \ 将线条样式设置为“实线”。图表应类似于图 17-15 所示。\n\n值得注意的是，你可以为一个分析元素添加多条线。也就是说，你可以添加任意多个平均值（例如），只要图表中有相应的数据元素。为此，只需在你希望添加另一条线的部分再次点击“添加”，然后定义设置以获得你想要的结果。尽管如此，这是一种既可能有助于你讲述数据故事，也可能有损图表清晰度的技术。因此，最好谨慎使用。\n\
  \n如果你要添加一条百分位线，那么你可能还需要调整一个额外的元素。这是数据元素最大值的实际百分位数值，你可以使用“百分位数”滑块进行调整。\n\n移除分析线非常简单：\n\
  \n1.  点击“分析”图标。\n2.  展开与要移除的线对应的部分。\n3.  点击要移除的线右侧的叉号。\n\n> **注意**：你实际上无法在图表中选择一条分析线。\n\
  \n## 散点图对称着色和比率线\n\nPower BI Desktop 的两个功能可以帮助你在散点图中“分清主次”：\n\n-   对称着色\n-   比率线\n\
  \n它们的应用同样简单，但确实可以帮助你超越大量数据点，洞察到有价值的趋势和显著的数据项。\n\n\n\n### 对称着色\n\n此功能可让您查看哪些点在 X\
  \ 轴上的值高于 Y 轴（反之亦然）。与 Power BI Desktop 的许多功能一样，通过实际示例来理解它效果最佳：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig16_HTML.jpg](img/370912_3_En_17_Fig16_HTML.jpg)\n\
  \n图 17-16\n\n为散点图添加对称着色\n\n1. 使用以下元素创建散点图：\n   1. *详细信息*：`Make`（来自 `Stock` 表）\n\
  \   2. *X 轴*：`SalePrice`（来自 `InvoiceLines` 表）\n   3. *Y 轴*：`Mileage`（来自 `Stock`\
  \ 表）\n2. 增大形状并填充它们（如前所述）。\n3. 选中散点图，在**可视化**窗格中单击**分析**图标（放大镜）。\n4. 展开**对称着色**部分。\n\
  5. 单击**添加**。\n6. 从可用颜色调色板中选择上部着色的颜色。\n7. 从可用颜色调色板中选择下部着色的颜色。\n8. 调整**透明度**滑块，将透明度设置为\
  \ 15%。图表将如图 17-16 所示。\n\n您可以通过单击**对称着色**部分中**对称着色**框右侧的小叉号来移除对称着色。\n\n> **注意**：仅当\
  \ X 轴和 Y 轴上的值范围可比时，对称着色才会真正有用。\n\n### 比率线\n\n最后一个即时分析功能是比率线。以下介绍如何应用它：\n\n![../images/370912_3_En_17_Chapter/370912_3_En_17_Fig17_HTML.jpg](img/370912_3_En_17_Fig17_HTML.jpg)\n\
  \n图 17-17\n\n为散点图添加比率线\n\n1. 按照上一节的步骤 1 和 2 创建散点图。\n2. 展开**比率线**部分。\n3. 单击**添加**。\n\
  4. 从可用颜色调色板中选择比率线的颜色。\n5. 选择线条样式——**虚线**、**点线**或**实线**。\n6. 从线条样式弹出列表中选择线条类型。图表将如图\
  \ 17-17 所示。\n\n与对称着色类似，您可以通过单击**比率线**部分中**比率线**框右侧的小叉号来移除比率线。\n\n## 结论\n\n在本章中，您学习了如何通过格式化来增强\
  \ Power BI Desktop 图表类型，以增加效果。这包括修改数据系列和数据点的颜色，以及添加或删除标题。您还了解了如何向特定类型的图表添加图例和数据标签。\n\
  \n接着，您学习了如何使用自动分析功能增强图表。这些功能包括平均值、选定的最大值以及比率线。\n\n此外，您还了解了某些类型的图表（特别是气泡图）如何实现动画效果，以便您可以将时间作为描述性因素添加进来，帮助观众理解数据的演变过程。\n\
  \n现在，您已走在成为 Power BI Desktop 仪表板大师的道路上。接下来您只需了解剩余的一些可视化类型，即可完全掌握如何制作高影响力的演示。那么，现在进入接下来的三章，完成您的学习历程。\n\
  \n"
- "# 18. 其他类型的视觉对象\n\n虽然基于文本的视觉对象和图表经常能够说明您的观点，但有时您需要以超越传统数据展示的方式来传达见解。这正是 Power BI\
  \ Desktop 大显身手之处。利用正确的数据——只需点击几下——您就能让仪表板焕然一新。\n\n- 树状图\n- 仪表\n- KPI\n- R 视觉对象\n\
  - Python 视觉对象\n- 分解树\n- 关键影响因素\n\n这些可视化类型中的大多数都像您在之前四章中看到的基于文本的视觉对象和图表一样易于创建。然而，它们易于使用的特点不应分散您对其能为报表和演示带来的清晰度和强大功能的关注。\n\
  \n本章将使用文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix` 作为您将创建的视觉对象的基础。\n\
  \n## 树状图\n\n一种能真正帮助您的观众理解各个数值与总计之间关系的视觉对象是树状图。虽然这并不是任何地理意义上的地图，但它确实可以帮助用户在数据集中找到方向。\n\
  \n再次强调，在视觉对象的世界里，眼见为实。让我们看一个树状图，它展示了每个汽车品牌和型号的劳动力成本如何累积：\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig1_HTML.jpg](img/370912_3_En_18_Fig1_HTML.jpg)\n\
  \n图 18-1\n\n显示每个汽车品牌劳动力成本的树状图\n\n1. 打开 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件，或单击仪表板画布的空白区域。\n2. 在**可视化**窗格中单击**树状图**图标。将出现一个空白树状图。\n3. 展开 `Stock` 表，将 `Make`\
  \ 字段拖入字段井中的**分组**框。\n4. 将 `Model` 字段拖入字段井中的**详细信息**框。\n5. 将 `LaborCost` 字段拖入字段井中的**值**框。树状图应如图\
  \ 18-1 所示。\n\n如图 18-1 所示，树状图按品牌对每个汽车型号进行了分组，然后将劳动力成本显示为树状图中每个方框的相对大小。这样，您的观众可以大致了解：\n\
  \n- 每个型号的劳动力成本与该品牌总劳动力成本的比较\n- 每个品牌的劳动力成本与总劳动力成本的比较\n\n正如您可能已经预料到的，您可以将鼠标悬停在树状图中的任何方框上，查看显示精确数据的弹出工具提示。\n\
  \nPower BI Desktop 将决定如何最好地组织树状图。然而，最终外观将取决于视觉对象的宽度和高度。因此，请毫不犹豫地调整这种特定类型的可视化，并观察随着您调整相对高度和宽度，它是如何变化的。\n\
  \n在某些情况下，树状图可能无法显示所有可用数据，原因可能是数据点过多，或者数值范围过宽而无法正确显示，或者（如饼图的情况）数据中包含负值。在这些情况下，树状图会在视觉对象的左上角显示一个警告信息符号。将鼠标指针悬停在此图标上，您将看到类似图\
  \ 18-2 所示的消息。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig2_HTML.jpg](img/370912_3_En_18_Fig2_HTML.jpg)\n\
  \n图 18-2\n\n树状图数据警报\n\n如果您看到此警告，建议您对数据应用筛选器（如第 21 章所述），以筛选掉导致问题的数据。\n\n\n\n### 向下钻取与树状图\n\
  \n你在矩阵、图表和地图中已经见过的向下钻取和展开下级逻辑，同样适用于树状图。既然你已熟悉这一概念，这里仅展示一个使用树状图进行向下钻取的简短示例：\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig3_HTML.jpg](img/370912_3_En_18_Fig3_HTML.jpg)\n\
  \n**图 18-3** — 向下钻取前的树状图\n\n1. 选中你刚刚创建的树状图。\n2. 将`Colors`表中的`Color`字段拖动到`可视化`窗格的组框中，放置在`Make`字段*下方*。字段框与树状图应如图\
  \ 18-3 所示。此时按车型划分的相对劳动力成本将不再显示。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig4_HTML.jpg](img/370912_3_En_18_Fig4_HTML.jpg)\n\
  \n**图 18-4** — 向下钻取树状图\n\n1. 点击可视化对象右上角的钻取模式图标，激活钻取模式。\n2. 点击`Aston Martin`。你将向下钻取到该品牌的下一个层级（颜色），可视化效果将如图\
  \ 18-4 所示。\n\n### 设置树状图格式\n\n树状图的格式化方式与其他可视化对象相同。以下是`可视化`窗格中`格式`图标下的可用选项：\n\n* `图例`\n\
  * `数据颜色`\n* `数据标签`\n* `类别标签`\n* `标题`\n* `背景`\n* `锁定纵横比`\n* `边框`\n\n由于前几章已对其他类型可视化对象应用这些选项进行了说明，此处不再赘述，仅对部分选项提供简要说明。\n\
  \n#### 图例\n\n在我看来，图例是多余的，因为它重复了树状图中已显示的分组数据信息。不过，如果你选择不显示类别标签，图例可能会变得必要。\n\n## 数据颜色\n\
  \n此调色板允许您为每个分组元素选择特定颜色。\n\n#### 数据标签\n\n您可以根据需要显示（或隐藏）树状图各区块背后的实际数值。这需要将`数据标签`按钮切换为`开`或`关`。展开`格式`窗格中的`数据标签`部分后，您还可以修改数据标签的颜色、单位、小数位数、文本大小和字体。\n\
  \n#### 类别标签\n\n此选项允许您决定是否在树状图内部显示分组元素和明细元素信息。如果您的树状图包含数十个（甚至数百个）数据点，您可能希望隐藏类别标签。展开`格式`窗格中的`类别标签`部分后，您还可以修改类别标签的颜色、字体和大小。\n\
  \n#### 标题\n\n与大多数可视化对象一样，您可以选择显示或隐藏标题，并修改其文本、字号和背景色。\n\n#### 背景\n\n您也可以为本章中看到的这类可视化对象应用彩色背景。\n\
  \n#### 锁定纵横比\n\n如果将`锁定纵横比`设置为`开`，则在调整可视化对象大小时可保持其比例不变。\n\n#### 边框\n\n与几乎所有可视化对象一样，您可以为树状图添加或移除边框。\n\
  \n## 仪表盘\n\n仪表盘是一种开箱即用的、极其有用的可视化对象。当您希望将实际值与目标值进行比较，或查看某项指标与关键绩效指标（KPI）的对比时，这类可视化对象尤为有效。在此示例中，您将使用仪表盘来比较采购与备件的总成本是否超出财务总监设定的阈值：\n\
  \n1. 打开`C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`文件，或点击仪表板画布的空白区域。\n\
  2. 点击`可视化`窗格中的`仪表盘`图标。将出现一个空白的仪表盘可视化对象。\n3. 展开`InvoiceLines`表，将`Cost Plus Spares\
  \ Margin`字段拖动到字段框的`值`框中。或者，直接将此字段拖入刚刚创建的仪表盘中。\n4. 将`InvoiceLines`表中的`Cost Plus Spares\
  \ Maximum`字段拖动到字段框的`最大值`框中。\n5. 将`Cost Plus Spares Target`字段（同样来自`InvoiceLines`表）拖动到字段框的`目标值`框中。\n\
  \n仪表盘将如图 18-5 所示。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig5_HTML.jpg](img/370912_3_En_18_Fig5_HTML.jpg)\n\
  \n**图 18-5** — Power BI Desktop 中的仪表盘\n\n仪表盘旨在显示相对于目标或总量的进度。因此，您可以为仪表盘设置表 18-1 中所述的元素。\n\
  \n**表 18-1** — 仪表盘的特定数据要求\n\n| 元素 | 描述 |\n| --- | --- |\n| `值` | 在仪表盘中以彩色条形式显示的元素。\
  \ |\n| `最小值` | 用于改变仪表盘视觉感知效果的最小值。 |\n| `最大值` | 用于改变仪表盘视觉感知效果的最大值。 |\n| `目标值` | 定义为需要实现的指标。\
  \ |\n\n实际上，仪表盘只需要一个值。即使没有其他三个元素，它也能工作。然而，仪表盘真正的视觉力量在于它利用了观看者对目标或待实现值的预期。因此，通常最好至少应用一个目标值和最大值，以向读者传达成功或失败的概念。\n\
  \n> **注意：** 请记住，您可以在数据模型中将特定值定义为度量值。如果需要在仪表盘中设置最大值、最小值或目标值，这会非常有用。这样，您可以一次修改阈值，而无需单独更改多个可视化对象的属性。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n### 格式化仪表\n\n许多仪表格式化选项都高度特定于仪表视觉对象。因此，这里快速介绍一下你需要了解的可用呈现技巧，以增强此类视觉对象的效果：\n\
  \n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig6_HTML.jpg](img/370912_3_En_18_Fig6_HTML.jpg)\n\
  \n图 18-6 格式化后的仪表\n\n1.  单击你之前创建的仪表。\n2.  在“可视化”窗格中，删除目标值（`CostPlusSpares` 字段）。\n\
  3.  删除最大值（`SalePrice` 字段）。\n4.  在“可视化”窗格中，单击“格式”图标。\n5.  展开“仪表轴”部分。\n6.  输入 **2000000**\
  \ 作为最小值。\n7.  输入 **30000000** 作为最大值。\n8.  输入 **10000000** 作为目标值。\n9.  展开“数据标签”部分。\n\
  10. 确保“数据标签”开关设置为“开”，然后展开“数据标签”部分。\n11. 从弹出调色板中为数据标签选择一种颜色，并设置更大的字号。\n12. 确保“目标值”开关设置为“开”，然后展开“目标值”部分。\n\
  13. 从弹出调色板中为目标值选择一种颜色。\n14. 展开“标注值”部分。\n15. 确保“标注值”开关设置为“开”，然后展开“标注值”部分。\n16. 从弹出调色板中为标注值选择一种颜色。\n\
  17. 展开“数据颜色”部分，为填充和目标值选择一种颜色。仪表的外观将类似于图 18-6。\n\n如果愿意，你还可以像之前为其他视觉对象所做的那样，更改背景、数据标签、边框和标题。如果你希望，也可以选择不显示数据标签或标注值（即仪表的值）。你只需将各自的开关设置为“关”即可。\n\
  \n> **注意**\n> \n> 在“可视化”窗格的“格式”面板（本章前面已提及）中输入数字时，不得添加任何数字格式，例如千位分隔符。否则，格式将不起作用，Power\
  \ BI 会等待你以原始形式输入数字。\n\n仪表是一种简单但有效的视觉对象。一组仪表也是在高管仪表板上显示高层级关键指标的真正有效方式。\n\n其余仪表格式化选项与你已见过的大多数视觉对象通用：\n\
  - 标题\n- 背景\n- 锁定纵横比\n- 边框\n\n### KPI\n\nPower BI Desktop 还可以创建关键绩效指标视觉对象，用于说明数据元素相对于目标值的趋势。下面是一个示例：\n\
  \n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig7_HTML.jpg](img/370912_3_En_18_Fig7_HTML.jpg)\n\
  \n图 18-7 KPI 图标\n\n1.  仍然使用 `CarSalesDataForReports.pbix` 文件，单击 KPI 图标以将簇状柱形图视觉对象添加到仪表板。保持空白\
  \ KPI 视觉对象处于选中状态。你可以在图 18-7 中看到此图标。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig8_HTML.jpg](img/370912_3_En_18_Fig8_HTML.jpg)\n\
  \n图 18-8 KPI 视觉对象\n\n1.  添加 `Gross Margin` 字段（来自 `InvoiceLines` 表）以及 `MonthAndYearAbbr`\
  \ 字段（来自 `DateDimension` 表）。\n2.  将 `InvoiceLines` 表中的 `Gross Margin Target` 字段添加到“可视化”窗格的目标值框中。\n\
  3.  在“可视化”窗格中单击“格式”图标。\n4.  展开“目标”部分。确保“距离”（显示任何百分比不足或超出）和“目标”（显示目标的累计值）设置为“开”。\n\
  5.  展开“指示器”部分，选择“千”作为显示单位。减小文本大小。\n6.  展开“颜色编码”，为“良好颜色”选择另一种颜色。KPI 将类似于图 18-8 所示。\n\
  \n## R 视觉对象\n\n如果你发现即使 Power BI Desktop 提供的广泛内置视觉对象也仍然不足以表达你的观点，那么你可以使用 R 语言将视觉对象提升到另一个更高的水平。所谓的“R”是一种用于分析数据和创建统计数据可视化的语言。它可以在\
  \ Power BI Desktop 报表和仪表板内部使用，以利用你为现有视觉对象准备的数据来扩展你正在交付的分析。\n\nR 不是一种直观的语言，但它非常强大。以下是有关如何使用已加载的\
  \ `CarSales` 数据将 R 视觉对象添加到仪表板的示例：\n\n> **注意**\n> \n> 创建 R 视觉对象意味着需要在装有 Power BI\
  \ Desktop 的 PC 上安装 R 引擎。你可以在 [`https://mran.revolutionanalytics.com/download/`](https://mran.revolutionanalytics.com/download/)\
  \ 找到可用的 R 下载之一。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig9_HTML.jpg](img/370912_3_En_18_Fig9_HTML.jpg)\n\
  \n图 18-9 “启用脚本视觉对象”对话框\n\n1.  打开 Power BI Desktop 文件 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix`（除非它已经打开）。\n2.  在“可视化”窗格中单击 R 视觉对象图标；将显示“启用脚本视觉对象”对话框，如图\
  \ 18-9 所示。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig10_HTML.jpg](img/370912_3_En_18_Fig10_HTML.jpg)\n\
  \n图 18-10 添加 R 视觉对象\n\n1.  单击“启用”。一个空白的 R 视觉对象将添加到桌面画布，并且报表下方将出现一个包含 R 脚本编辑器的窗格。你可以在图\
  \ 18-10 中看到这一点。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig11_HTML.jpg](img/370912_3_En_18_Fig11_HTML.jpg)\n\
  \n图 18-11 包含可运行脚本的 R 脚本编辑器\n\n1.  将以下字段拖入 R 视觉对象（两者均来自 Stock 表）：\n    -   `Make`\n\
  \    -   `CostPrice`\n2.  调整 R 视觉对象的大小，使其宽大于高。\n3.  在 R 脚本编辑器的标题行下方添加以下脚本（此脚本可在文件\
  \ `C:\\PowerBiDesktopSamples\\Rscript.txt` 中找到）。完成此操作后，脚本编辑器将如图 18-11 所示。\n\n```\n\
  rdata <- table(dataset)\nbarplot(rdata\n,axes=F\n,main=\"Make\"\n,xlab=\"Cost Price\"\
  \n,ylab = \"Number Sold per Price Point\"\n,legend = rownames(rdata)\n,col=c(\"\
  darkblue\",\"red\", \"green\", \"yellow\", \"pink\", \"orange\", \"darkgreen\")\
  \ )\n```\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig12_HTML.jpg](img/370912_3_En_18_Fig12_HTML.jpg)\n\
  \n图 18-12 R 视觉对象\n\n1.  单击脚本编辑器右上角的“运行脚本”图标。\n2.  R 视觉对象将出现在 Power BI Desktop 中。\n\
  3.  根据需要调整 R 视觉对象的大小。最终视觉对象的外观可能类似于图 18-12 所示。\n\n当然，只有当你准备好学习 R 语言时，才能创建 R 视觉对象。由于这是多本书籍的主题，因此我不在此处描述该语言。相反，我建议你参考该主题已有的许多优秀资源。\n\
  \n> **注意**\n> \n> 如果调整 R 视觉对象的大小，你可能需要（通过单击 R 脚本编辑器中的“运行脚本”图标）重新运行 R 脚本，以强制视觉对象正确显示。\n\
  \nR 脚本编辑器图标在表 18-2 中进行了描述。\n\n**表 18-2** R 脚本编辑器图标\n\n\n\n| 图标 | 说明 |\n| --- | ---\
  \ |\n| `Run Script` | 运行（或重新运行）R 脚本，并在 Power BI Desktop 中重新创建 R 可视化。 |\n| `R script\
  \ options` | 显示包含可用 R 脚本选项的对话框。 |\n| `Edit script in external R IDE` | 使用 Power\
  \ BI Desktop R 可视化中的脚本，运行外部 R 脚本编辑器。 |\n| `Minimize the script pane` | 隐藏（或重新显示）R\
  \ 脚本窗格。 |\n\n### R 选项\n\n如果确实有必要，你可以调整几个 R 选项。你可以通过选择 **文件 ➤ 选项和设置 ➤ 选项**，然后在“选项”对话框（如图\
  \ 18-13 所示）左侧窗格中点击 **R 脚本** 来找到这些选项。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig13_HTML.jpg](img/370912_3_En_18_Fig13_HTML.jpg)\n\
  \n*图 18-13* R 选项\n\n本质上，你可能只需进行少量调整：\n\n- **R 脚本引擎**：Power BI Desktop 应能检测到您之前安装的\
  \ R 脚本引擎。如果未检测到，您可以浏览到包含 R 脚本引擎的目录。只需在弹出列表中选择**其他**，然后点击**浏览**按钮。\n- **IDE**：如果您希望使用不同的外部\
  \ R 集成开发环境（IDE），只需点击**浏览**按钮选择首选的 R IDE。下次点击 R 脚本编辑器右上角的**外部编辑器**图标时，将调用此 IDE。\n\
  \n> **注意**：R 可视化的大部分格式设置都在 R 脚本本身中完成。但您可以使用 Power BI 格式设置选项来设置可视化的背景、边框和标题。\n\n\
  ## Python 可视化\n\nPower BI Desktop 较新的一个扩展是能够创建使用 Python 脚本编写的自定义可视化。虽然这与您刚刚看到的 R\
  \ 可视化方法非常相似，但仍有一些细微差别。\n\n首先，您需要在 PC 上安装 Python。有几种方法可以做到这一点，快速上网搜索应该能为您提供最新版本 Python\
  \ 的下载路径。\n\n其次，您可能需要在 PC 上安装 `pandas` 和可能的 `matplotlib` 库（如果尚未安装），因为在大多数情况下，将 Python\
  \ 图表编写为 Power BI 可视化时都需要这两个库。\n\n为了省去您研究这些技术的时间，您只需在 Python 脚本目录中（在我电脑上是 `C:\\Users\\\
  Adam\\AppData\\Local\\Programs\\Python\\Python37-32\\Scripts`）运行以下两行代码：\n\n```\n\
  pip install pandas\npip install matplotlib\n```\n\n要将 Python 图表创建为 Power BI 可视化：\n\
  \n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig14_HTML.jpg](img/370912_3_En_18_Fig14_HTML.jpg)\n\
  \n*图 18-14* Python 可视化图标\n\n1. 打开（或保持打开）Power BI Desktop 文件 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix`。\n2. 在**可视化**窗格中点击 **Python 可视化**图标。您可以在图 18-14 中看到它。包含\
  \ Python 脚本编辑器的窗格将出现在报表下方。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig15_HTML.jpg](img/370912_3_En_18_Fig15_HTML.jpg)\n\
  \n*图 18-15* Python 脚本编辑器\n\n1. 将以下字段拖入 Python 可视化（这两个字段均来自 **Stock** 表）；添加到场字段的字段会自动创建一个数据框。\n\
  \   - `Make`\n   - `CostPrice`\n2. 在 Python 脚本编辑器的标题行下添加以下脚本：\n\n   ```\n   import\
  \ matplotlib.pyplot as plt\n   dataset.plot(kind='bar', x=\"Make\", y=\"SalePrice\"\
  )\n   plt.show()\n   ```\n\n3. 完成后，脚本编辑器将类似于图 18-15 所示。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig16_HTML.jpg](img/370912_3_En_18_Fig16_HTML.jpg)\n\
  \n*图 18-16* 一个简单的 Python 可视化\n\n1. 点击脚本编辑器右上角的**运行脚本**图标。Python 可视化将出现在 Power BI\
  \ Desktop 中。\n2. 根据需要调整 Python 可视化的大小。最终的可视化效果可能如图 18-16 所示。\n\n> **注意**：Python\
  \ 可视化的大部分格式设置都是在 R 脚本本身中完成的。但您可以使用 Power BI 格式设置选项来设置可视化的背景、边框和标题。\n\n这很可能是您能制作的最简单的\
  \ Python 可视化。然而，重点不是用大量的 Python 代码让您眼花缭乱，而是向您展示，如果您正在转向 Power BI Desktop，利用您的 Python\
  \ 技能是多么容易。或者，您可以将 Power BI Desktop 作为绝佳的练习场，在完善 Python 编码技能的同时，学习用于数据可视化的 Python。\n\
  \n### Python 选项\n\n与 R 可视化的情况一样，您可以调整几个选项来为 Power BI Desktop 指定 Python 脚本选项。由于这些选项与前面为\
  \ R 描述的选项基本相同，此处不再赘述。不过，您可以在图 18-17 中查看可用选项。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig17_HTML.jpg](img/370912_3_En_18_Fig17_HTML.jpg)\n\
  \n*图 18-17* Python 选项\n\n\n\n## 分解树\n\n分解树是最近新增到内置可视化图表库中的一种可视化图表（Power BI 社区对此报以热烈的欢迎）。此可视化图表允许你向下钻取多个元素（它称之为维度），以查看分析到最底层级的路径。\n\
  \n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig18_HTML.jpg](img/370912_3_En_18_Fig18_HTML.jpg)\n\
  \n图 18-18\n\n一个初始的分解树\n\n1. 在 `CarSalesDataForReports.pbix` 文件中，单击“可视化”窗格中的“分解树”图标。你可以在图\
  \ 18-18 中看到此图标。\n2. 调整出现的空白可视化图表的大小，使其更大。\n3. 将 `CostPrice` 字段添加到“分析”框。\n4. 将以下元素添加到“解释依据”框：\n\
  \   1. `Make`（来自 `Stock` 表）\n   2. `Model`（来自 `Stock` 表）\n   3. `Color`（来自 `Colors`\
  \ 表）\n   4. `CountryName`（来自 `Countries` 表）\n5. 生成的可视化图表如图 18-18 所示。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig19_HTML.jpg](img/370912_3_En_18_Fig19_HTML.jpg)\n\
  \n图 18-19\n\n一个分解树\n\n1. 单击分解树（`CostPrice`）中初始元素右侧的叉号。弹出菜单会显示你之前添加到“解释依据”框中的元素。\n\
  2. 单击 `CountryName`。每个国家/地区都会作为分解树中的一个子层级出现，并显示你最初选择的值的相对大小。\n3. 单击某个国家/地区右侧的叉号。弹出菜单会显示你之前添加的其余元素。\n\
  4. 选择 `Color`。\n5. 单击一种颜色右侧的叉号，然后选择一个 `Make`。\n6. 激活你创建的可视化图表的“格式”窗格。\n7. 展开“树”部分并设置：\n\
  \   1. “主要颜色”为**蓝色**（这表示你选择的钻取路径）\n   2. “连接线颜色”为**浅灰色**（这显示未选择的路径）\n8. 展开“数据条”部分，并从调色板中为正向条形图选择一种不同的颜色。\n\
  9. 展开“类别标签”部分，并更改“字体系列”、大小和颜色。\n10. 展开“数据标签”部分，并更改“字体系列”、大小和颜色。\n11. 展开“级别标题”部分，并从调色板中设置“背景颜色”，然后将“显示副标题”设置为“关”。\n\
  12. 添加边框。分解树应如图 18-19 所示。\n\n一旦设置好基本的分解树，你就可以通过单击任何层级的任何元素与其交互，立即查看在所建立的层次结构的所有层级上值的构成。\n\
  \n要充分利用分解树，你需要了解以下几点：\n\n-   你可以随时通过向“解释依据”框添加更多层级来扩展层次结构。这些层级随后会出现在弹出菜单中。\n-  \
  \ 只需单击元素名称右上角的叉号，即可从层次结构中移除一个层级。这不会从“解释依据”框中移除该层级。\n-   要更改向下穿过各个层级的钻取路径，只需移除任何子层级，然后以不同的顺序重新添加它们。\n\
  -   单击级别标题中的锁定图标可临时锁定该级别以及选定级别左侧的所有级别。这可以避免你误删。再次单击锁定图标可解锁该级别。\n-   双击一个值（例如本例中的颜色**蓝色**）将隐藏所有子层级。这允许你通过几次点击即可重建一条向下穿过层次结构的路径。\n\
  -   选择最后一个层级中的某个节点，会对其他可视化图表中的数据进行交叉筛选。\n\n## 关键影响因素\n\n当你想检查影响正在分析的指标的因素并进行比较和对比时，“关键影响因素”可视化图表会非常有用。与所有可视化图表一样，通过实际操作来查看它可能更容易理解。\n\
  \n1. 单击“可视化”窗格中的“关键影响因素”图标。\n2. 将 `Weeks in Stock` 字段（来自 `Stock` 表）添加到“分析”框。\n3.\
  \ 将以下字段添加到“解释依据”框：\n   1. `CostPrice`\n   2. `TotalDiscount`\n   3. `Mileage`\n\n\
  “关键影响因素”可视化图表应如图 18-20 所示。\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig20_HTML.jpg](img/370912_3_En_18_Fig20_HTML.jpg)\n\
  \n图 18-20\n\n一个“关键影响因素”可视化图表\n\n1. 展开“数据条”部分，并从调色板中为“主要颜色”和“次要颜色”选择不同的颜色。\n2. 展开“钻取可视化颜色”部分，并更改“默认”和“参考线”颜色。\n\
  \n现在你可以看到哪些因素被认为会影响车辆库存时间。\n\n要高效使用“关键影响因素”可视化图表，可能不可避免地需要了解以下几点：\n\n![../images/370912_3_En_18_Chapter/370912_3_En_18_Fig21_HTML.jpg](img/370912_3_En_18_Fig21_HTML.jpg)\n\
  \n图 18-21\n\n关键影响因素细分\n\n-   单击可视化图表左侧的任意影响因素，会显示该影响因素的详细信息。\n-   你可以从可视化图表顶部的弹出菜单中选择是选择可能增加还是减少正在分析的元素的影响因素。\n\
  -   单击可视化图表顶部的“细分”窗格，会切换到显示正在分析元素的细分群体。你可以在图 18-21 中看到这一点。\n\n## 总结\n\n在前五章中，你已经接触了各种各样的可视化图表，它们可以让你表达隐藏在数据中的趋势。本章在前几章的基础上，将树状图、仪表、基于\
  \ R 和 Python 的可视化图表以及分解树和关键影响因素可视化图表纳入其中。在下一章中，你将看到如何通过目前可在 Power BI Desktop 中下载和使用的众多第三方可视化图表，来扩展“开箱即用”的已有相当广泛的可视化图表范围。\n\
  \n\n\n"
- "# 19. 第三方视觉对象\n\n至此，想必您已经领略到 Power BI Desktop 提供的丰富可视化功能。从多种图表类型到仪表、表格和卡片，它提供了大量易于使用的方式，让您能够清晰有效地洞察数据。\n\
  \n然而，Power BI Desktop 的功能并不仅限于您目前所看到的内置可视化效果。它被设计成一个完全开放且可扩展的商业智能应用程序，允许第三方（甚至微软）添加其他视觉对象。这意味着，您目前接触到的核心元素仅仅是一个起点。还有许多其他的图表、文本和地图视觉对象，只需点击几下即可添加到\
  \ Power BI Desktop 中，然后借助这些引人注目的多样化仪表板元素，让您的观众眼前一亮。\n\n作为一个可自由扩展的平台，Power BI Desktop\
  \ 还托管着由微软和第三方开发的各种且日益丰富的视觉对象。这个视觉对象扩展库持续增长，并且极其易于访问和使用。本章的最后部分将向您展示一些当前的视觉对象，以及如何在您的\
  \ Power BI Desktop 仪表板中查找、添加和使用它们。本章将使用文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReportsWithVisuals.pbix`\
  \ 作为您将创建的视觉对象的基础。\n\n添加和使用这些增强功能既快速又简单。这是因为几乎所有 Power BI 可视化效果都使用相同的界面，并且它们都基于相同的基础数据模型。因此，学习使用一个新的视觉对象很可能只需要几分钟，因为您始终是在已掌握的知识和技术基础上进行构建。\n\
  \n> **注意：** 您需要了解，并非所有可用的自定义视觉对象都完全没有错误。此外，它们可能不具备您所期望的所有格式属性或交互功能。然而，这并不会降低它们的实用性或使用的乐趣。无论如何，我们有理由期待它们会随着时间的推移得到增强和改进。\n\
  \n## Power BI 视觉对象库\n\n首先要做的是熟悉 Power BI 视觉对象库。这是一个中心枢纽，您可以在其中找到一系列免费的视觉对象，这些视觉对象由微软或第三方开发，随时可以添加到您的\
  \ Power BI 仪表板中。\n\n以下说明如何连接到 Power BI 视觉对象库：\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig1_HTML.jpg](img/370912_3_En_19_Fig1_HTML.jpg)\n\
  \n**图 19-1** Power BI 登录对话框\n\n1. 在“插入”功能区中，点击“`更多视觉对象`”按钮，然后在弹出菜单中选择“`从 AppSource`”。如果您未登录\
  \ Power BI 帐户，将会看到类似图 19-1 所示的对话框，您可以在其中登录。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig2_HTML.jpg](img/370912_3_En_19_Fig2_HTML.jpg)\n\
  \n**图 19-2** 自定义视觉对象库\n\n2. 输入您的密码并登录。您将看到图 19-2 中的对话框。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig3_HTML.jpg](img/370912_3_En_19_Fig3_HTML.jpg)\n\
  \n**图 19-3** 选择第三方视觉对象\n\n3. 点击其中一个可用的视觉对象（您可以在“`搜索`”框中输入搜索词来查找特定的视觉对象，或者如果您在对话框左侧点击某种视觉对象类型，可以查看按类型分组和筛选后的结果）。您将会看到类似图\
  \ 19-3 所示的对话框。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig4_HTML.jpg](img/370912_3_En_19_Fig4_HTML.jpg)\n\
  \n**图 19-4** 视觉对象导入确认对话框\n\n4. 点击“`添加`”。该视觉对象将被添加到可用可视化效果的调色板中，并且将会显示您在图 19-4 中看到的对话框。\n\
  \n5. 点击“`确定`”。现在您就可以在当前 Power BI Desktop 报表中使用该视觉对象了。\n\n自从本书付印以来，这些可供选择的第三方视觉对象无疑已经发生了很大的演变，因此，我想您现在看到的与书中相比会有很大不同。不过，希望您能兴奋地看到许多新的、令人惊叹的数据可视化类型，它们能让您的仪表板增添无与伦比的魅力。\n\
  \n> **注意：** 如果您确定在初始市场对话框（如图 19-2 所示）中找到了想要的视觉对象，那么您可以直接点击“`添加`”按钮将其导入。\n\n## 从磁盘加载自定义视觉对象\n\
  \n访问这些用于报表的额外演示元素宝库的另一种方法是将它们下载到您的 PC，然后在需要时添加到 Power BI Desktop 中。具体操作如下：\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig5_HTML.jpg](img/370912_3_En_19_Fig5_HTML.jpg)\n\
  \n**图 19-5** 适用于 Power BI 网页的自定义视觉对象\n\n1. 在您的网络浏览器中，导航至 [`https://appsource.microsoft.com/en-us/marketplace/apps?product=power-bi-visuals`](https://appsource.microsoft.com/en-us/marketplace/apps%253Fproduct%253Dpower-bi-visuals)。您将看到适用于\
  \ Power BI 网页的自定义视觉对象。目前，它看起来如图 19-5 所示。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig6_HTML.jpg](img/370912_3_En_19_Fig6_HTML.jpg)\n\
  \n**图 19-6** 视觉对象下载对话框\n\n2. 点击您想要下载的视觉对象。将显示一个专门介绍该视觉对象的第二个网页。它看起来会类似于图 19-6。\n\
  \n3. 点击“`立即获取`”按钮。\n\n4. 点击“`选择下载`”。视觉对象将被下载。根据您的浏览器（以及任何特定机器的配置），它将被放置在一个特定的文件夹中，或者让您选择文件夹。\n\
  \n5. 在 Power BI Desktop 中，点击“开始”功能区中的“`更多视觉对象`” ➤ “`从我的文件`”。将出现一个警告对话框。\n\n6. 点击“`导入`”。将出现\
  \ Windows“打开文件”对话框。\n\n7. 导航到您在步骤 4 中下载视觉对象文件的文件夹。点击该视觉对象文件。\n\n8. 点击“`打开`”。将出现确认对话框，如前文图\
  \ 19-4 所示。\n\n该视觉对象的图标将出现在“`可视化效果`”窗格中视觉对象库的底部。然后，您可以像使用任何其他 Power BI 视觉对象一样使用此视觉对象。\n\
  \n> **提示：** 视觉对象是按需添加到每个单独的 Power BI Desktop 文件中的。因此，虽然您只需下载一次视觉对象，但必须将它们加载到您想要使用它们的每个\
  \ Power BI Desktop（`.pbix`）文件中。如果您发现自己经常使用相同的第三方视觉对象，则应创建一个包含您使用的所有视觉对象的 Power BI\
  \ Desktop 文件，然后将其另存为模板，用于未来的仪表板开发。这在第 9 章中已做解释。\n\n导入已下载的自定义视觉对象的另一种方法是点击“`可视化效果`”窗格中视觉对象库中的省略号。这将显示一个弹出菜单，其中包含导入视觉对象的选项——可以从\
  \ Power BI 商店导入，也可以从您下载的视觉对象集合中导入。\n\n一旦您将自定义视觉对象添加到 Power BI Desktop，您将在“`可视化效果`”窗格中看到代表它们的图标。如图\
  \ 19-7 所示，它们分组排列在内置视觉对象下方。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig7_HTML.jpg](img/370912_3_En_19_Fig7_HTML.jpg)\n\
  \n**图 19-7** “`可视化效果`”窗格中的自定义视觉对象\n\n\n\n### 移除自定义视觉对象\n\n如果你希望从可视化窗格中删除第三方视觉对象：\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig8_HTML.jpg](img/370912_3_En_19_Fig8_HTML.jpg)\n\
  \n*图 19-8：删除自定义视觉对象*\n\n1. 在可视化窗格的视觉对象库中单击省略号。\n2. 选择`Delete a Custom Visual`。将显示如图\
  \ 19-8 所示的对话框。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig9_HTML.jpg](img/370912_3_En_19_Fig9_HTML.jpg)\n\
  \n*图 19-9：自定义视觉对象删除对话框*\n\n1. 选择要从当前报表中移除的视觉对象。你可以在对话框中按住`Ctrl`并单击多个视觉对象，以选择多个。\n\
  2. 单击`Delete`。将显示如图 19-9 所示的对话框。\n3. 单击`Yes, delete`。\n\n> **注意：** 这不会移除你之前下载的任何文件。你需要像删除任何标准文件那样删除它们。\n\
  \n## 自定义视觉对象快速概览\n\n由于自定义视觉对象库处于持续变化的状态，因此无法讨论 Power BI 当前所有可用的扩展。然而，为了让您了解一些可能存在的增强功能，接下来几页将展示微软提供的一些*额外的*视觉对象。由于无法保证在您阅读本书时这些视觉对象仍以当前状态存在，因此我*不*解释如何创建它们，而仅展示一些使用本书示例数据创建的其他图表类型示例。\n\
  \n在以下所有示例中，视觉对象的标题指示了用于创建该视觉对象的字段。\n\n## 星形图\n\n星形图源自标准圆环图。但它使用一个额外的数据值来提供你在图 19-10\
  \ 中看到的“扫描”效果。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig10_HTML.jpg](img/370912_3_En_19_Fig10_HTML.jpg)\n\
  \n*图 19-10：星形图*\n\n## 雷达图\n\n雷达图常用于绩效分析，以显示各项指标及其对比情况。它们允许你显示相对于共享轴的多重数值，如图 19-11\
  \ 所示。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig11_HTML.jpg](img/370912_3_En_19_Fig11_HTML.jpg)\n\
  \n*图 19-11：雷达图*\n\n### 子弹图\n\n子弹图在追踪关键绩效指标（KPI）与目标对比时非常有用。通常需要你添加提供绩效衡量阈值的数据，这些阈值可以是绝对值或百分比。然而，它们在显示结果与目标比较方面非常有效，如图\
  \ 19-12 所示。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig12_HTML.jpg](img/370912_3_En_19_Fig12_HTML.jpg)\n\
  \n*图 19-12：子弹图*\n\n> **注意：** 请注意，子弹图可能需要你扩展和准备源数据，以添加此类图表所需的所有元素——例如各种阈值以及最小值和最大值。\n\
  \n## 词云\n\n词云显示数据集中词语出现的相对频率。它可以是一种独特的可视化方式，用于显示数值的相对权重，如图 19-13 所示。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig13_HTML.jpg](img/370912_3_En_19_Fig13_HTML.jpg)\n\
  \n*图 19-13：词云*\n\n## 流图\n\n流图是一种平滑的堆叠面积图。如图 19-14 所示，流图擅长展示数值随时间的变化趋势。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig14_HTML.jpg](img/370912_3_En_19_Fig14_HTML.jpg)\n\
  \n*图 19-14：流图*\n\n有趣的是，流图可用的格式选项比某些其他导入的视觉对象多得多。\n\n## 龙卷风图\n\n龙卷风图是条形图的一种变体，其区别在于通过垂直分隔使两组数值之间的对比更加清晰，如图\
  \ 19-15 所示。与条形图一样，你可以按图表中的任何数据元素对龙卷风图进行排序。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig15_HTML.jpg](img/370912_3_En_19_Fig15_HTML.jpg)\n\
  \n*图 19-15：龙卷风图*\n\n## 弦图\n\n弦图是一种有趣且略显非传统的方式，用于展示矩阵结构中数值之间的关系。图 19-16 展示了颜色与地区通过销售额如何关联。\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig16_HTML.jpg](img/370912_3_En_19_Fig16_HTML.jpg)\n\
  \n*图 19-16：弦图*\n\n### 桑基图\n\n图 19-17 中的桑基图同样展示了颜色与地区销售额之间的关系。该图表已进行筛选，因此仅显示四个地区的数据。\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig17_HTML.jpg](img/370912_3_En_19_Fig17_HTML.jpg)\n\
  \n*图 19-17：桑基图*\n\n## 水平条形图\n\n水平条形图将每个条形的文本放置在条形内部。这本质上是一种节省空间的技术。你可以在图 19-18 中看到这一点。\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig18_HTML.jpg](img/370912_3_En_19_Fig18_HTML.jpg)\n\
  \n*图 19-18：水平条形图*\n\n它还可以显示线条、锤头和棒棒糖。\n\n## 属性切片器\n\n属性切片器显示你要用于切片数据的元素列表。当面对潜在切片器元素的长列表时，它特别有用，因为你可以：\n\
  \n- 搜索你感兴趣的元素。\n- 将它们逐个添加到切片器中——它们会出现在剩余元素之上。\n- 将鼠标悬停在条形上时，可以查看每个元素的实际值。\n\n你可以在图\
  \ 19-19 中看到一个示例。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig19_HTML.jpg](img/370912_3_En_19_Fig19_HTML.jpg)\n\
  \n*图 19-19：属性切片器*\n\n## 直方图\n\n直方图显示按数据箱分组的数据，是对连续变量概率分布的估计。你可以在图 19-20 中看到一个示例。\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig20_HTML.jpg](img/370912_3_En_19_Fig20_HTML.jpg)\n\
  \n*图 19-20：直方图*\n\n\n\n### 相关性图\n\n图 19-21 中的相关性图展示了备件与人工成本之间的关系。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig21_HTML.jpg](img/370912_3_En_19_Fig21_HTML.jpg)\n\
  \n图 19-21 — 相关性图\n\n值得注意的是，此可视化（如同许多可用的第三方可视化一样）使用了 `R` 语言。此类可视化要求你的计算机上安装了一个或多个\
  \ `R` 包。如果这些包尚未安装，你将看到一个如图 19-22 所示的对话框。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig22_HTML.jpg](img/370912_3_En_19_Fig22_HTML.jpg)\n\
  \n图 19-22 — 需要在本地安装的 R 包\n\n点击“安装”将安装这些 `R` 包，随后会显示图 19-23 中所示的对话框。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig23_HTML.jpg](img/370912_3_En_19_Fig23_HTML.jpg)\n\
  \n图 19-23 — 已成功安装自定义可视化所需的 R 包\n\n### 倒计时器\n\n倒计时器以“时钟”形式显示天数、小时数、分钟数和秒数，可在任何报表中实时递减。你可以在图\
  \ 19-24 中看到示例。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig24_HTML.jpg](img/370912_3_En_19_Fig24_HTML.jpg)\n\
  \n图 19-24 — 倒计时器\n\n## 信息图设计器\n\n在微软提供的第三方可视化工具集中，能为仪表盘增添真正活力的一个新成员是信息图设计器。此可视化允许你创建使用图片作为图表元素的图表。此外，它还能层叠多张图片以创建极具吸引力的信息图。它唯一的初期缺点是使用了一个高度独特的界面，需要花费一些时间才能掌握——而且在我看来，这个界面并不直观。无论如何，它绝对值得一看。\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig25_HTML.jpg](img/370912_3_En_19_Fig25_HTML.jpg)\n\
  \n图 19-25 — 带有编辑标记的信息图设计器\n\n1.  将信息图设计器添加到可视化窗格（如果你尚未添加的话）。\n2.  单击可视化窗格中的信息图设计器图标。\n\
  3.  添加以下字段：\n    1.  将 `Make` 添加到类别（Category）框。\n    2.  将 `LaborCost` 添加到度量值（Measure）框。\n\
  4.  将出现一个相当标准的柱状图。\n5.  将指针悬停在可视化对象上。编辑标记将出现在右上角。你可以在图 19-25 中看到示例。\n\n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig26_HTML.jpg](img/370912_3_En_19_Fig26_HTML.jpg)\n\
  \n图 19-26 — 信息图设计器\n\n1.  单击编辑标记。将出现标记设计器，如图 19-26 所示。在这里，你可以对信息图可视化对象进行几乎所有修改。\n\
  \n![../images/370912_3_En_19_Chapter/370912_3_En_19_Fig27_HTML.jpg](img/370912_3_En_19_Fig27_HTML.jpg)\n\
  \n图 19-27 — 信息图设计器输出\n\n1.  单击删除元素图标。\n2.  单击插入形状图标，然后选择一个形状类型。在此示例中，我选择交通（Transportation）。\n\
  3.  选择一个形状。在此示例中，我选择汽车（Car）形状。\n4.  在标记设计器的下部，将多单元（Multiple Units）设置为开启。你可以在图 19-27\
  \ 中看到输出示例。\n5.  单击右上角的叉号关闭标记设计器。\n\n只需再次单击编辑标记，即可重新显示标记设计器并继续设置可视化对象的格式。\n\n这只是信息图设计器所能实现的最简单示例。你可以添加多个形状、更改其颜色、拉伸或隔离它们，等等。你甚至还可以创建并添加自己的绘图。因此，当你需要一种打破传统图表和表格的视觉元素时，我建议你试试它。只需注意一点：需要投入少量时间来了解其无穷的可能性及其界面的工作方式。\n\
  \n## 自定义切片器\n\n微软应用商店中还有几个出色的自定义切片器。我将在第 22 章中介绍其中的一些。\n\n## 结论\n\n在本章中，正当你认为情况不可能更好的时候，你发现了\
  \ Power BI Desktop 皇冠上的明珠：一系列广泛可用的免费扩展，你可以将其添加到仪表盘中，以其他分析工具无法企及的方式呈现你的见解。你已经领略了一些可下载的额外可视化对象，它们让你能够表达隐藏在数据中的趋势。\n\
  \n现在，你可以尽情发挥你的创造力，用丰富多彩的方式呈现你的见解，让听众惊叹不已，即使是那些最挑剔的用户也一定会印象深刻。\n\n"
- "# 20. Power BI Desktop 中的地图\n\n另一种可用于分析和呈现见解的强大技术是以地图形式显示数据。这仅要求你的源数据包含可用于地理表示的信息。因此，如果数据集中包含国家/地区、州、城镇、邮政编码（或邮编），甚至经纬度，那么你就可以让\
  \ Power BI Desktop 在报表中添加地图，并以地图为背景显示所选数据。\n\n更棒的是，Power BI Desktop 地图的行为方式与其他任何可视化对象完全相同。这意味着你可以筛选地图中显示的数据，并对其进行高亮显示，就像对图表、表格和矩阵所做的那样。不仅如此，地图还是\
  \ Power BI Desktop 报表的一个组成部分。因此，如果你在图表中高亮显示数据，同一报表中的地图也会随之高亮显示。不过，你需要等到下一章才能详细了解这一切。\n\
  \nPower BI Desktop 为你提供了四种类型的地图可视化对象：\n\n*   地图\n*   着色地图\n*   形状地图\n*   ArcGIS\
  \ 地图\n\n前三种地图类型简单且表现力强。第四种类型（ArcGIS 地图）需要多花些功夫才能掌握，但能够提供一些真正令人惊艳的输出。\n\n本章的目的是向你展示一些通过使用地图为报表增添真正趣味的方法。然后，在呈现你的分析时，你可以与地图交互，*真正地*给你的观众留下深刻印象。\n\
  \n本章将使用文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix` 作为你将创建的可视化对象的基础数据。\n\
  \n\n\n## 使用必应地图\n\n在添加第一个地图之前，我想先解释一下在 Power BI Desktop 中地图的工作原理。其地理组件基于必应地图。因此，要添加地图，你需要能够连接互联网并使用必应地图服务。其次，底层数据集必须包含能被必应地图识别为地理数据的字段。换句话说，你需要国家/地区、州、城镇或其他必应地图可用于生成地图绘制的信息。幸运的是，如果\
  \ Power BI Desktop 识别出某个字段包含可用于（希望如此）创建地图的数据，它会在字段井中为该字段显示一个微小的地球图标，只要该字段位于底层数据集中且明显包含地理数据。\n\
  \n为避免数据被误解的风险，你可以向底层数据模型添加元数据，以定义地理字段类型。通过向字段应用数据类别，Power BI Desktop 地图随后会使用这些类别来解释用于制图的地理数据。准备数据，确保必应地图使用的任何字段不仅能被识别为包含地理数据，而且能被唯一识别，这一点至关重要。你必须帮助必应地图，这样，如果你要为名为巴黎的城市绘制数据，必应就能判断你指的是法国巴黎，还是德克萨斯州的巴黎。第[13]章(##370912_3_En_13_Chapter.xhtml)\
  \ 解释了一些方法，你可以通过这些方法为必应地图准备数据，并进而使用这些数据为 Power BI Desktop 添加地图视觉对象。\n\n> **注意** \
  \ \n> 世界上有些地区无法使用必应地图。因此，如果你在这些地理区域尝试使用 Power BI Desktop 的制图功能，在尝试创建地图时将不会看到任何地图显示。\n\
  \n## 在 Power BI Desktop 中创建地图\n\n让我们从创建按国家/地区划分的销售额地图开始。幸运的是，示例数据集包含销售发生的国家/地区。这意味着我们可以使用这些数据让\
  \ Power BI Desktop 显示我们全球销售的地图。以下是创建初始地图的方法：\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig1_HTML.jpg](img/370912_3_En_20_Fig1_HTML.jpg)\
  \  \n*图 20-1 – 销售额地图*\n\n1. 打开 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件。\n2. 在“可视化”窗格中单击地图图标（即图 20-1 中基本为空的地球）。将出现一个空白地图（即使它看起来有点奇怪，但它确实是一个地图）。\n3.\
  \ 展开 `Countries` 表，将 `CountryName` 字段拖到地图视觉对象中。视觉对象将显示一个地图，其中包含所有存在值的国家/地区的数据点。\n\
  4. 展开 `InvoiceLines` 表，将 `SalePrice` 字段拖到地图视觉对象中。视觉对象会调整每个数据点的大小以反映销售值。\n5. 将光标悬停在地图上，将欧洲拖到地图中央。\n\
  6. 使用鼠标滚轮，放大使得有销售数据的国家/地区位于视觉对象中央。最终效果将类似于图 20-1。\n\n在进一步深入之前，有必要澄清一下 Power BI Desktop\
  \ 地图的几个要点。以下是需要注意的关键点：\n\n- 地图与其他视觉对象一样。你可以调整其大小，并将其移动到 Power BI Desktop 画布上的任何位置。\n\
  - 地图会应用为报表设置的所有筛选器（你将在下一章中了解更多关于筛选器的信息）。\n- 地图中的每个数据点（或气泡）的大小与底层数据的相对大小成正比。\n\n\
  你可以将鼠标指针悬停在一个数据“气泡”上，以显示一个弹出窗口，其中显示所代表的具体数据。图 20-2 显示了这样一个示例。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig2_HTML.jpg](img/370912_3_En_20_Fig2_HTML.jpg)\
  \  \n*图 20-2 – 在 Power BI Desktop 地图中显示具体数据*\n\n## 使用地理数据\n\n虽然这看似显而易见，但如果 Power\
  \ BI Desktop 要在地图上叠加显示你的见解，你确实需要地理数据。因此，你绝对必须确保底层数据集包含可被解释为地理信息的列。在迄今为止的示例中，你已经看到\
  \ Power BI Desktop 能够解释国家/地区名称并使用它们在地图上显示数据。然而，它并不局限于只显示国家/地区。你可以使用以下任何一种来生成地图视觉对象：\n\
  \n- 国家/地区\n- 邮政编码\n- 州\n- 县\n- 城镇\n- 纬度和经度\n\n举例来说，请看图 20-3，其中 `Clients` 表中的 `Town`\
  \ 字段被用于字段井中的“位置”框中。然后，使用初始示例步骤 5 和 6 中描述的技术，将地图调整为仅显示英国。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig3_HTML.jpg](img/370912_3_En_20_Fig3_HTML.jpg)\
  \  \n*图 20-3 – 显示每个城镇的相对销售额*\n\n### 地理数据类型\n\n在创建地图方面，Power BI Desktop 确实异常有用且宽容。如果你的数据可以在地理上进行解释，那么\
  \ Power BI Desktop 会尽力显示地图。然而，在开始使用 Power BI Desktop 之前，你几乎肯定需要将数据集塑造成一个连贯的数据模型。\n\
  \n在第一个 Power BI Desktop 示例中，我们添加了一个单一的地理数据字段。更重要的是，这个字段被立即识别出来——它是国家/地区名称。然而，在实际的制图数据世界中，你可能不仅需要添加多个字段，还需要指定每个字段代表哪种地理数据类型。简而言之，Power\
  \ BI Desktop 需要知道你提供的数据代表什么。不仅如此，它还需要明确无误地知道它看到的是什么。因此，你有责任尽可能清晰、明确地定义源数据。这可能涉及以下几种方法中的一种或多种。\n\
  \n#### 在数据模型中定义数据类别\n\n如你在第 [13] 章(##370912_3_En_13_Chapter.xhtml) 中所见，你可以在 Power\
  \ Pivot 中为每个数据列定义数据类别。虽然这对于使用 Power BI Desktop 进行精确制图并非绝对必要，但它有助于减少潜在的异常情况。\n\n\
  #### 添加多级地理信息\n\nPower BI Desktop 数据模型允许你向表中添加多个级别的地理信息。例如，你不仅可以在表的记录中添加国家/地区，还可以添加县和城镇。添加尽可能多的相关源数据字段的好处在于，通过这种方式工作，你可以帮助\
  \ Power BI Desktop 消除可能存在的歧义引用。例如，如果你只有一个 `Town` 字段，Power BI Desktop 可能无法判断你指的是阿拉巴马州伯明翰市，还是英格兰的第二大城市。但如果数据源同时拥有\
  \ `Country` 字段*和* `Town` 字段，那么 Power BI Desktop 检测到正确地理位置的可能性就会大得多。这一原则可以扩展到添加州、县和其他地理参考。\n\
  \n\n\n### 在地图中进行下钻\n\nPower BI Desktop 允许您像在其他类型的可视化效果中钻取其他数据层级一样，对地理数据进行钻取。要查看此功能，您可以执行以下步骤：\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig4_HTML.jpg](img/370912_3_En_20_Fig4_HTML.jpg)\n\
  \n图 20-4\n\n在地理层级中向下钻取\n\n1. 使用以下字段（按此顺序）创建一个新的地图可视化效果：\n   1. `CountryName`（来自“国家/地区”表）\n\
  \   2. `Town`（来自“客户”表）\n   3. `SalePrice`（来自“发票行”表）\n2. 单击地图可视化效果右上角的“钻取模式”图标以激活下钻功能。\n\
  3. 单击代表英国的泡泡。地图可视化效果将显示所选国家/地区的下一层级（城镇）数据。您可以在图 20-4 中看到这一点，该图显示了数据的两个层级。\n\n幸运的是，在地图中进行上下钻取所使用的技术与您在矩阵和图表中已看到的技术完全相同。简单总结如下：\n\
  \n- 单击左上角的“上钻”图标可向上移动一个层级。\n- 单击“转到层级中的下一级”图标可查看下一层级的数据。\n\n**注意：** 正如您所料，如果您从国家/地区向下钻取，Power\
  \ BI Desktop 将放大该国家/地区以显示城镇级别的详细信息。如果您决定显示较低层级的所有数据，则地图将保持其原始分辨率。\n\n## 在 Power\
  \ BI Desktop 中调整地图显示\n\n正如您所见，创建地图非常简单。然而，初始地图不一定就是您希望向受众展示的最终版本。您可能希望：\n\n- 更精确地在地图可视化效果中定位地图元素\n\
  - 放大或缩小地图\n\n在接下来的几个小节中，我们将探讨您可以对 Power BI Desktop 地图进行的各种修改。希望您会发现这些调整既直观又易于实现。无论如何，稍加练习，您就会发现完成这些修改只需几秒钟。\n\
  \n### 定位地图元素\n\n如果地图中显示的区域并非您理想的完美状态，那么您可以更改地图可视化效果中显示的区域（无论是国家/地区还是区域）。您可以按如下方式操作：\n\
  \n1. 将鼠标指针悬停在地图上。指针图标将变为手形图标。\n2. 单击并拖动指针以移动地图元素。\n\n### 放大或缩小\n\n有可能显示的地图的缩放比例并非您所期望的。幸运的是，这非常容易修复。您只需执行以下操作：\n\
  \n1. 将鼠标指针悬停在地图上。\n2. 向前滚动鼠标滚轮可放大查看地图的某一部分以获得更详细的视图。或者，向后滚动鼠标滚轮可缩小地图。\n\n**注意：**\
  \ 目前没有用于在地图中移动或缩放地图的键盘快捷键。\n\n### 多值系列\n\n到目前为止，您已经了解了如何向地图添加单个数据系列并将数据显示为数据点。Power\
  \ BI Desktop 可以扩展这一模式，允许您将数据气泡显示为包含第二个数据系列的饼图——从而按每个地理实体的特定数据集显示数据的细分情况。\n\n以此为例（并回顾一下我们目前已看到的一些地图创建技巧），让我们尝试按年龄范围分析欧洲汽车销量：\n\
  \n1. 保留您在上一节中创建的地图（如果尚未创建，则创建它）。\n2. 展开“颜色”表，并将 `Color` 字段拖入“图例”字段井。\n3. 调整地图可视化效果的大小。\n\
  \n现在地图包含了所售车辆颜色的图例。每个气泡现在都是一个数据饼图。饼图的总大小按比例表示每个国家/地区与其他饼图相比的数据总和。地图现在应如图 20-5 所示。\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig5_HTML.jpg](img/370912_3_En_20_Fig5_HTML.jpg)\n\
  \n图 20-5\n\n在 Power BI Desktop 地图中显示饼图\n\n值得注意的是，如果您将鼠标指针悬停在某个国家/地区的数据表示（饼图）上，当指针经过每个饼图扇区时，您会看到一个工具提示，显示数据的详细信息，包括它所指的汽车颜色。\n\
  \n**注意：** 在显示地图时，您几乎总是需要以某种方式筛选数据。下一章将介绍有关数据筛选的所有详细信息。\n\n## 突出显示地图数据\n\n如果您已将数据添加到字段井的“图例”框，并且显示了图例，那么您可以在地图中突出显示数据扇区。这允许您将受众的注意力吸引到数据中的特定趋势上。\n\
  \n使用您之前创建并可在图 20-5 中看到的地图，单击图例中的“蓝色”（第二个元素）。对应于售出蓝色汽车的饼图扇区将被突出显示，如图 20-6 所示。\n\n\
  ![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig6_HTML.jpg](img/370912_3_En_20_Fig6_HTML.jpg)\n\
  \n图 20-6\n\n突出显示地图数据\n\n要从地图中移除突出显示，您只需单击用于突出显示数据的图例元素，或直接单击图例标题。或者，单击地图上任何被突出显示的元素。\n\
  \n这只是 Power BI Desktop 如何将突出显示应用于可视化效果的一个预览。您将在第 22 章中了解更多关于此技术的信息。\n\n\n\n## 填充地图\n\
  \n另一种数据展示方式是用颜色填充地理区域，而非显示气泡。Power BI Desktop 同样支持此功能。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig9_HTML.jpg](img/370912_3_En_20_Fig9_HTML.jpg)\n\
  \n**图 20-9**  \n使用自定义着色显示各国成本的填充地图\n\n1. 点击 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件中的仪表板画布空白区域。\n2. 在`可视化`窗格中点击`填充地图`图标。将出现一张空白地图。\n3. 展开`国家/地区`表，将`国家名称`字段拖入地图可视化区域。可视化图将在地图中为有数值的国家/地区着色显示。目前所有国家/地区将显示为相同颜色。此时地图将如图\
  \ 20-7 所示。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig7_HTML.jpg](img/370912_3_En_20_Fig7_HTML.jpg)\n\
  \n**图 20-7**  \n显示各国成本的填充地图\n\n4. 选择`格式`图标并展开`数据颜色`部分。\n5. 将指针悬停在默认颜色上。在`格式设置`窗格此区域的右上角将出现垂直省略号（三个点）。\n\
  6. 点击省略号。将弹出`条件格式`对话框。点击该对话框，将出现`默认颜色 – 数据颜色`对话框。\n7. 在`基于字段`弹出菜单中，展开`库存`表并选择`成本价`。为`最小值`和`最大值`选择不同的颜色。`默认颜色\
  \ – 数据颜色`对话框将如图 20-8 所示。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig8_HTML.jpg](img/370912_3_En_20_Fig8_HTML.jpg)\n\
  \n**图 20-8**  \n设置地图的填充颜色\n\n8. 点击`确定`。地图将根据销售额调整每个国家/地区的着色深浅。颜色越深表示数值越高。此时地图将如图\
  \ 20-9 所示。\n\n`默认颜色 – 数据颜色`对话框还允许你根据精确的规则集或包含颜色参考值的字段来定义颜色。由于我在第 14 章已作说明，此处不再赘述，详情请参阅该章节。\n\
  \n## 形状地图\n\n另一种可视化地理数据的方式是按州或区域展示。此选项要求源数据包含用于定义州和区域的标准代码。创建形状地图的方法如下：\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig10_HTML.jpg](img/370912_3_En_20_Fig10_HTML.jpg)\n\
  \n**图 20-10**  \n形状地图\n\n1. 在`可视化`窗格中点击`形状地图`图标。\n2. 将`外部邮政编码`字段（来自`客户`表）拖入`位置`框（或直接拖入地图）。\n\
  3. 将`售价`字段（来自`发票行`表）拖入`颜色饱和度`框（或直接拖入地图）。形状地图将如图 20-10 所示。\n\n### 地图键\n\n你很可能需要查找\
  \ Power BI Desktop 用于在形状地图中显示数据的地图键（区域代码）。这样你就可以将其添加到源数据中，或调整源数据以包含相应地理代码。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig11_HTML.jpg](img/370912_3_En_20_Fig11_HTML.jpg)\n\
  \n**图 20-11**  \n特定国家/地区的地图键\n\n1. 选择你在图 20-10 中创建的形状地图。\n2. 在`可视化`窗格中点击`格式`图标。\n\
  3. 展开`形状`部分。\n4. 选择你想要显示代码的地图（国家/地区）。\n5. 点击`查看地图键`。将显示一个包含地图键的对话框，如图 20-11 所示。\n\
  \n这是 Power BI Desktop 用于将数据分配到地理区域的数据元素列表。因此，你需要在源数据中包含这些数据，或准备将其添加到源数据中。也就是说，源数据中至少有一列必须与图\
  \ 20-11 中显示的某个值相对应。\n\n### 添加形状地图\n\n如果你有特定的地图形状（可以包括从城镇到平面图的一切内容），则可以通过在形状地图的`格式设置`窗格`形状`部分中点击`添加地图`按钮来加载这些形状。\n\
  \n形状地图定义必须采用特定的 `.json` 格式创建。遗憾的是，创建这些定义超出了本书的讨论范围。\n\n## 格式化地图\n\n正如你所料，地图具有多种可应用的格式化选项。实际上，地图格式化的方式与其他可视化对象的格式化方式几乎完全相同。鉴于前五章已详细介绍了其中许多选项，本节将仅说明可能性，如需了解全部细节，请参阅第\
  \ 14 章至第 18 章。\n\n就地图和填充地图而言，你可以修改以下内容：\n\n- **标题**：包括显示或隐藏标题，以及设置标题文本、字体颜色和背景颜色。\n\
  - **背景**：包括应用背景、设置其颜色和定义其透明度。\n- **锁定纵横比**：如果将`锁定纵横比`设置为`开`，则可以在调整地图大小时保持其比例不变。\n\
  - **边框**：与大多数 Power BI Desktop 可视化对象一样，你可以为地图添加或移除边框。\n\n所有地图类型都允许调整数据颜色。但根据地图类型的不同，颜色修改方式略有差异。下面我们将按地图类型分别介绍格式化选项。\n\
  \n## 地图\n\n地图可视化对象允许你调整以下格式化方面：\n\n- 数据颜色\n- 类别标签\n- 气泡\n- 地图控件\n- 地图样式\n\n其中某些元素与你之前见过的格式化选项类似，因此此处不再赘述。但其他格式化元素要么采用全新的处理方式，要么与其他类型可视化对象中类似格式选项的处理方式差异显著，需要重新解释。\n\
  \n## 数据颜色\n\n为地图选择数据颜色时，你可以选择将用于数据气泡的颜色。\n\n**注意**\n\n你无法为地图中的不同数据点应用不同颜色。\n\n####\
  \ 类别标签\n\n如果你需要提供地图当前显示的地理元素名称（例如城镇或国家/地区），则可以将`类别标签`按钮设置为`开`。展开`类别标签`部分后，你还可以为类别标签选择字体系列、大小和颜色。\n\
  \n#### 气泡\n\n展开`气泡`部分后，可以调整`大小`滑块来设置气泡的相对大小。图 20-12 展示了示例。\n\n#### 地图控件\n\n目前只有一种地图控件可以调整，即自动缩放功能。默认设置（`自动缩放`设置为`开`）意味着筛选地图数据时，地图上只会显示相关的地理区域。如果将此选项切换为`关`，则地图将保持显示同一区域，直到您手动更改。\n\
  \n\n##### 地图样式\n\n在本书付印时，Power BI Desktop 版本提供了五种地图样式：\n\n- `Road`（默认）\n- `Aerial`\n\
  - `Dark`\n- `Light`\n- `Grayscale`\n\n您可以对比图 20-12 中选中航拍视图带来的差异（其中同时展示了调整气泡大小和添加类别标签的效果）。\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig12_HTML.jpg](img/370912_3_En_20_Fig12_HTML.jpg)\n\
  \n图 20-12\n一张格式化的地图\n\n#### 工具提示\n\n与图表类似，您可以将额外数据字段添加到`可视化`窗格的`工具提示`字段中。之后，当鼠标悬停在地图数据点（例如：图\
  \ 20-12 中阴影地图内的一个国家）上时，您将在工具提示中看到该地图点的额外数据信息。\n\n## 形状地图\n\n形状地图中可更改的核心要素是实际形状的颜色。除此之外（您已了解），您还有一个主要选项：\n\
  \n- 为存在数据的每个地理区域设置颜色范围。\n\n此外，您还可以为地图中无数据的部分选择颜色。\n\n#### 定义数据颜色范围\n\n如果形状地图包含数值数据，则可以使用发散颜色范围为每个地理区域设置颜色——这与您在填充地图中的操作类似。具体步骤如下：\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig13_HTML.jpg](img/370912_3_En_20_Fig13_HTML.jpg)\n\
  \n图 20-13\n一张带阴影的填充地图\n\n1.  创建形状地图：将`外部邮政编码`字段（来自`客户`表）添加到`可视化`窗格的`位置`字段中，并将`销售价格`字段（来自`发票行`表）添加到`颜色饱和度`字段中。\n\
  2.  单击`格式`图标，展开`数据颜色`部分（位于`格式设置`窗格中间）。\n3.  将`发散`设置为`开启`。\n4.  为`最小值`、`中心`和`最大值`选择颜色。\n\
  5.  展开`默认颜色`部分。\n6.  将`显示`设置为`开启`。\n7.  从`颜色`调色板中选择一种默认颜色。\n8.  从`边框颜色`调色板中选择一种边框颜色。此时，地图将如图\
  \ 20-13 所示。\n\n## ArcGIS 地图\n\nMicrosoft 已与 ESRI（一家国际地理信息系统 [GIS] 软件供应商）合作，将 ArcGIS\
  \ 地图功能集成到 Power BI Desktop 中。简而言之，此功能可将数据的地理空间表示提升到全新水平。使用 ArcGIS 地图，您可以：\n\n- 通过添加热力图和聚合数据执行空间分析。\n\
  - 添加人口统计和参考数据。\n- 使任何地图都外观出众。\n\n### 创建 ArcGIS 地图\n\n在本节中，您将看到几个示例，展示如何使用 ArcGIS\
  \ 地图为您的仪表板增添真正的亮点。\n\n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig16_HTML.jpg](img/370912_3_En_20_Fig16_HTML.jpg)\n\
  \n图 20-16\n一个初始的 ArcGIS 地图\n\n1.  打开文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n\
  2.  在`可视化`窗格中，单击`用于 Power BI 的 ArcGIS 地图`图标。将出现`欢迎`对话框，如图 20-14 所示。\n\n    ![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig14_HTML.jpg](img/370912_3_En_20_Fig14_HTML.jpg)\n\
  \n    图 20-14\n    ArcGIS 欢迎对话框\n\n3.  一个空白的 ArcGIS 地图将被添加到报表画布中。您可以在图 20-15 中看到此效果。\n\
  \n    ![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig15_HTML.jpg](img/370912_3_En_20_Fig15_HTML.jpg)\n\
  \n    图 20-15\n    ArcGIS 地图可视化占位符\n\n4.  将以下字段添加到 ArcGIS 地图：\n    1.  `城镇`（来自`客户`表）\n\
  \    2.  `销售价格`（来自`发票行`表）\n\n5.  放大可视化效果以获得更清晰的视图。ArcGIS 地图将如图 20-16 所示。\n\n到目前为止，一切都很简单——而且说实话，这与您之前使用传统\
  \ Power BI Desktop 地图工具所实现的功能并无太大区别。但是，当您学习使用 ArcGIS 地图中的更多选项时，事情将变得有趣得多。\n\n> **注意**\n\
  > 您可以像在 Power BI Desktop 中操作其他地图一样，移动 ArcGIS 地图的显示区域或进行缩放。\n\n### 选择底图类型\n\n创建 ArcGIS\
  \ 地图后，您可以通过一些强大的效果对其进行扩展。其中一个选项是更改地图本身的外观：\n\n1.  在 ArcGIS 地图中，单击右上角的弹出菜单（省略号）。\n\
  2.  从上下文菜单中选择`编辑`。地图将扩展至全屏，并在地图顶部显示地图工具栏。\n3.  单击工具栏左侧的`底图`。\n4.  从可用类型面板中选择一个底图。地图显示将随之更改，如图\
  \ 20-17 所示。\n\n    ![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig17_HTML.jpg](img/370912_3_En_20_Fig17_HTML.jpg)\n\
  \n    图 20-17\n    更改 ArcGIS 地图的底图类型\n\n5.  单击 ArcGIS 地图左上角的`返回报表`，以返回报表画布。\n\n\
  > **注意**\n> 若要关闭底图类型面板并仅显示地图本身，只需单击底图类型面板右上角的小叉号即可。当然，这仅适用于 ArcGIS 编辑模式。\n\n###\
  \ 选择位置类型\n\n您可以使用`位置类型`选项选择地图数据的显示方式。这让您可以在以下两种显示方式之间进行选择：\n\n- 数据作为点\n- 数据作为边界（区域）\n\
  \n如果您选择将位置表示为边界，则可以进一步选择要显示哪些边界。边界的类型取决于所选国家/地区。表 20-1 列出了部分可用的边界定义。\n\n**表 20-1**\n\
  **边界类型**\n\n| 位置类型               | 国家/地区 | 描述                                  \
  \                       |\n|-----------------------|-----------|--------------------------------------------------------------|\n\
  | 整个国家               | 美国      | 将整个美国作为地图边界。                                  \
  \     |\n| 州                     | 美国      | 将每个州作为一个地理元素。                     \
  \                |\n| 指定市场区域 (DMA)      | 美国      | 将每个 DMA 作为一个地理元素。          \
  \                        |\n| 国会选区               | 美国      | 将每个国会选区作为一个地理元素。  \
  \                             |\n| 核心统计区 (CBSA)       | 美国      | 将每个核心统计区作为一个地理元素。\
  \                             |\n| 县                     | 美国      | 将每个县作为一个地理元素。\
  \                                     |\n| 县分区                 | 美国      | 将每个县的一部分作为一个地理元素。\
  \                             |\n| 邮政编码               | 美国      | 将每个邮政编码作为一个地理点。\
  \                                 |\n| 城市和城镇             | 美国      | 将每个城镇和城市作为一个地理点。\
  \                               |\n| 人口普查区域           | 美国      | 将每个普查区域作为一个地理元素。\
  \                               |\n| 街区组                 | 美国      | 将每个普查街区组作为一个地理边界。\
  \                             |\n| 国家                   | 英国      | 将英国的四个构成国分别作为一个地理边界。\
  \                       |\n| 地区                   | 英国      | 将每个地区作为一个地理元素。   \
  \                                |\n| 邮区                   | 英国      | 将每个邮区作为一个地理元素。\
  \                                   |\n| 郡                     | 英国      | 将每个郡作为一个地理边界。\
  \                                     |\n| 区                     | 英国      | 将每个区作为一个地理元素。\
  \                                     |\n| 邮区 (外)              | 英国      | 将每个邮区（外部邮政编码）作为一个地理元素。\
  \                   |\n| 邮区 (内)              | 英国      | 将每个邮区（内部邮政编码）作为一个地理元素。\
  \                   |\n| 人口普查区域           | 英国      | 将每个普查区域作为一个地理元素。         \
  \                      |\n\n> **注意**\n> 要使边界显示有效，底层数据必须包含允许 ArcGIS 地图识别边界的数据。\n\n\
  \n### 添加地图主题\n\n地图主题可让您更改地理数据的显示方式，从而产生强大的视觉效果。例如，假设您想将销售数据显示为热力图：\n\n1. 编辑您之前创建的\
  \ `ArcGIS` 地图。\n2. 从菜单按钮中选择“地图主题”。左侧会显示一个可用选项面板。\n3. 选择“热力图”。\n\n您可以在图 20-18 中看到选择此选项的结果。\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig18_HTML.jpg](img/370912_3_En_20_Fig18_HTML.jpg)\n\
  \n图 20-18：应用于 `ArcGIS` 地图的热力图\n\n### 选择符号类型\n\n`ArcGIS` 地图还为您提供了多种在地图上显示数据点的方式。您可以在以下示例中看到这一点：\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig19_HTML.jpg](img/370912_3_En_20_Fig19_HTML.jpg)\n\
  \n图 20-19：带有格式化符号的 `ArcGIS` 地图\n\n1. 重新创建您在本节开头首次看到的 `ArcGIS` 地图（图 20-16）。\n2. 编辑地图。\n\
  3. 确保“地图主题”设置为“仅显示位置”。\n4. 从菜单按钮中选择“符号样式”。\n5. 在左侧的“符号样式”下，选择菱形符号。\n6. 向右拖动“符号大小”滑块以增加符号大小。\n\
  7. 从可用颜色面板中选择符号填充颜色。\n8. 如有需要，调整轮廓颜色和粗细（以及各种透明度设置）。您将看到类似图 20-19 所示的地图。\n\n### 添加图钉\n\
  \n在地图上突出显示特定点的一种独特方法是添加图钉。这用于独立于底层数据来突出显示特定的地理位置。您可以使用 `ArcGIS Maps` 工具栏中的“图钉”菜单按钮来执行此操作，具体如下：\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig21_HTML.jpg](img/370912_3_En_20_Fig21_HTML.jpg)\n\
  \n图 20-21：添加到 `ArcGIS` 地图的图钉\n\n1. 在现有的 `ArcGIS` 地图可视化对象中，单击 `ArcGIS Maps` 工具栏中的“图钉”菜单按钮。左侧将出现“位置”窗格。\n\
  2. 在搜索字段中输入要搜索的位置。将出现一个可能位置的列表，如图 20-20 所示。\n   ![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig20_HTML.jpg](img/370912_3_En_20_Fig20_HTML.jpg)\n\
  \   图 20-20：选择图钉位置\n3. 单击您想要精确高亮显示的位置。图 20-21 显示了一个输出示例。\n\n要移除图钉，只需在“位置”窗格中单击要移除的图钉旁边的“删除”即可。\n\
  \n> **提示**：您可以向一个 `ArcGIS` 地图添加多个单独的图钉。\n\n### 添加参考图层\n\n`ArcGIS` 地图允许您访问某些统计地理数据集并将其添加到地图中。例如，您可以将美国房价中位数数据添加到地图中，并查看它与汽车销售数据有何关联（如果有的话）：\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig23_HTML.jpg](img/370912_3_En_20_Fig23_HTML.jpg)\n\
  \n图 20-23：添加了参考数据的美国地图\n\n1. 重新创建您在本节开头使用的初始 `ArcGIS` 地图。\n2. 编辑 `ArcGIS` 地图。\n\
  3. 单击 `ArcGIS Maps` 工具栏上的“参考图层”按钮。\n4. 从“参考图层”窗格中选择“2016 年美国房价中位数”参考图层。您可以在图 20-22\
  \ 中看到该选项。\n   ![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig22_HTML.jpg](img/370912_3_En_20_Fig22_HTML.jpg)\n\
  \   图 20-22：`ArcGIS` 地图中部分可用的参考图层\n5. 调整地图显示，放大美国。您可以在图 20-23 中看到添加了参考数据后的地图结果。\n\
  \n> **提示**：您一次只能添加一个参考数据图层。\n\n### 添加信息图\n\n`ArcGIS` 地图还可以访问与人口统计数据相关的数据。目前这些数据仅限于北美地区。您可以像这样添加参考数据：\n\
  \n![../images/370912_3_En_20_Chapter/370912_3_En_20_Fig24_HTML.jpg](img/370912_3_En_20_Fig24_HTML.jpg)\n\
  \n图 20-24：`ArcGIS` 参考数据\n\n1. 重新创建并编辑您在本节开头使用的初始 `ArcGIS` 地图。\n2. 单击 `ArcGIS Maps`\
  \ 工具栏上的“信息图”按钮。\n3. 选择以下选项：\n   - 总人口\n   - 家庭收入\n4. 将地图放大到旧金山地区。参考数据会随之调整，以对应显示的区域。您可以在图\
  \ 20-24 中看到这一点。\n\n## 结论\n\n在本章中，您了解了如何以多种地图类型显示地理数据，从通过区域阴影强度表示数据的着色地图，到通过地图上数据点大小让数据本身说话的气泡图。您还了解了如何向报告中添加真正富有表现力的\
  \ `ArcGIS` 地图可视化对象，从而可以添加额外的地理数据来增强分析。\n\n在过去的七章中，您已经见识了各种各样的可视化对象，它们可以帮助您表达数据中隐藏的趋势。本章在前六章的基础上，通过添加地图，进一步扩展了您对基于文本的可视化对象、图表、树状图、仪表和自定义可视化对象的了解。现在，是时候学习如何过滤和切片仪表板中的数据了。\n\
  \n"
- "# 21. 筛选数据\n\nPower BI Desktop 从底层设计上就是为了让您（用户）能够从海量的事实和数据中筛选出有意义的见解。因此，关键在于能够快速准确地深入数据并突出显示其中包含的信息。这样，您无需应用复杂流程或与难以理解的界面作斗争，就可以随时探索新想法或跟随直觉。毕竟，`Power\
  \ BI Desktop` 旨在帮助您提出新的分析，使您的业务在竞争中占据优势。\n\n`Power BI Desktop` 提供了三种主要方法来帮助您专注于数据的关键要素：\n\
  \n-   **筛选器**：限制报表、页面或可视化对象中显示的数据。这是本章的主题。\n-   **切片器**：允许用户在仪表板内交互式地筛选数据，并即时查看结果。\n\
  -   **交叉筛选**：允许您即时、直观地为观众突出显示关键信息。\n\n我们将在本章中讨论筛选器，并在下一章中讨论切片器和交叉筛选。\n\n\n\n## 筛选器\n\
  \nPower BI Desktop 的开发者深知，数据是获得精准分析的关键。正因如此，你可以筛选基础数据模型中的任意字段或字段集，以提取其真正价值。这种方法不仅直观易用，而且速度极快，几乎无需等待结果返回。\n\
  \n筛选器作用于报表和可视化对象所依赖的数据。它们不必对用户可见，但在限制仪表板中显示的数据方面却极其强大。\n\n你可以在创建 Power BI Desktop\
  \ 报表之前、之后，甚至创建过程中添加筛选器。如果在创建表格前添加筛选器，表格将只显示筛选器允许通过的数据；如果向现有报表添加筛选器，数据可视化结果将在你眼前实时变化，以反映新的筛选条件；如果在包含可视化对象的\
  \ Power BI Desktop 报表中修改筛选器，则（正如你可能已猜到的那样）所有受该筛选器影响的可视化对象都将同步更新，以反映新的筛选标准——这一切都是瞬时完成的。\n\
  \n你可以筛选任何类型的数据：\n\n- 文本\n- 数值\n- 日期\n- 逻辑值\n\n每种数据类型都有各自选择元素、设置（尽可能）可包含或排除的值范围的方式。本章将讲解隔离目标显示数据的各种技巧。掌握这些后，你将能创建仅显示所需数据的\
  \ Power BI Desktop 报表。\n\n我们将在本章后续部分详细探讨这些方法的运作原理。无论如何——正如 Power BI Desktop 的常见特性——通过实践比空谈更容易掌握这些概念，所以接下来让我们了解筛选器的工作原理。本章将使用\
  \ `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix` 示例文件作为学习所有筛选器应用的基础。\n\
  \n## 筛选器层级\n\n在 Power BI Desktop 中，数据子集的提取基于筛选器的正确应用。因此，关于筛选器首先需要了解的是，它们作用于三个层级。具体包括：\n\
  \n- 报表级筛选器\n- 页面级筛选器\n- 可视化级筛选器\n\n这三种筛选器的特性如表 21-1 所示。\n\n**表 21-1** Power BI Desktop\
  \ 筛选器\n\n| 筛选器类型 | 应用范围 | 说明 |\n| --- | --- | --- |\n| 报表级 | 应用于当前报表中的每个可视化对象。 |\
  \ 筛选当前文件中所有可视化对象的数据。 |\n| 页面级 | 应用于当前活动页面中的每个可视化对象。 | 筛选当前页面中所有可视化对象的数据。 |\n| 可视化级\
  \ | 仅应用于选定的可视化对象。 | 仅适用于选定的可视化对象（表格、图表等）。 |\n\n筛选器的应用方式完全相同。关键在于它们对 Power BI Desktop\
  \ 演示中可视化对象的影响范围。实际操作中，这将大大简化你的工作，因为你只需学习一次筛选器的应用方法，随后即可在不同文件的各层级中以相同方式使用。\n\n现在，让我们从筛选器层级的最低层开始，了解如何使用筛选器：可视化级筛选器。\n\
  \n### 可视化级筛选器\n\n将 Power BI Desktop 中的筛选器分为三种类型，纯粹是一种描述性的区分。对于 Power BI Desktop\
  \ 而言，任何筛选器都是筛选器，所有筛选器的工作方式相同。然而，由于它们在应用时存在清晰的层级关系，我将从可视化级筛选器开始，然后逐步介绍其上级——页面级筛选器和报表级筛选器。鉴于三者的通用相似性，需要特别注意的是，确保你正在创建或修改的是正确的筛选器。这一点并非总是显而易见的，尤其是当你刚开始使用\
  \ Power BI Desktop 时。我将尽力在后续内容中阐明如何准确区分当前应用的筛选器层级，因为错误应用可能会对你试图传达的信息产生广泛影响。\n\n\
  #### “筛选器”窗格\n\n首先需要注意的是，所有筛选器都在“筛选器”窗格中应用。该可折叠窗格位于报表画布的右侧，在选中示例可视化对象时，其外观如图 21-1\
  \ 所示。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig1_HTML.jpg](img/370912_3_En_21_Fig1_HTML.jpg)\n\
  \n**图 21-1** “筛选器”窗格\n\n如图所示，已在筛选器层级的所有可能级别上应用了不同的筛选器。仔细观察还可以发现，每个筛选器都显示了其应用方式（如有）。由于此处未应用任何筛选，每个筛选器均显示\
  \ `*All*` 作为当前选择，这表明所有数据均被允许通过。你将在后续几页中学习如何添加和调整筛选器。\n\n**注意：** 仅当选中可视化对象时，“筛选器”窗格才显示可视化级筛选器。\n\
  \n#### 折叠与展开“筛选器”窗格\n\n“筛选器”窗格会占用大量屏幕空间。这可以通过在不需要时折叠该窗格、在需要添加或修改筛选器时展开它来缓解。\n\n\
  要折叠“筛选器”窗格，只需单击窗格右上角的折叠按钮（向右的 V 形图标）。窗格将变为屏幕右侧的一个细长竖条。要使“筛选器”窗格重新显示，请再次单击同一按钮（此时变为向左的\
  \ V 形图标）。你可以在图 21-1 中看到折叠/展开按钮。\n\n#### 添加筛选器\n\n“筛选器”窗格会自动添加你用作可视化对象基础的任何字段。要验证这一点，请创建以下可视化对象：\n\
  \n1. 打开 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix` 文件。\n\n2. 使用以下字段创建聚类柱形图：\n\
  \   - `Make`（来自 `Stock` 表）\n   - `SalePrice`（来自 `InvoiceLines` 表）\n\n   “筛选器”窗格将如图\
  \ 21-2 所示。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig2_HTML.jpg](img/370912_3_En_21_Fig2_HTML.jpg)\n\
  \n**图 21-2** 可视化级筛选器的自动创建\n\n图 21-2 显示，将数据字段添加到可视化对象时，会自动将该字段添加到“可视化级筛选器”窗格中。\n\n\
  \n\n#### 应用筛选器\n\n若要查看筛选器的作用，我们将图表限制为仅显示少数几种汽车品牌：\n\n1.  选择你之前创建的簇状柱形图。\n2.  在`筛选器窗格`中，将指针悬停在`Make`筛选器上。在该用作筛选器的字段右侧，将出现一个向下箭头。这是一个视觉级筛选器。\n\
  3.  单击箭头展开`Make`筛选器。`筛选器窗格`将显示视觉对象中出现的所有品牌。\n4.  在`筛选器窗格`中，通过选中以下每个元素左侧的复选框来选择它们：\n\
  \    - `Jaguar`\n    - `Rolls Royce`\n    - `Triumph`\n\n你将看到，图表仅显示筛选器中所选汽车品牌的数据。结果图表应如图\
  \ 21-3 所示。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig3_HTML.jpg](img/370912_3_En_21_Fig3_HTML.jpg)\n\
  \n图 21-3：一个简单的筛选图表\n\n你可能会注意到，首次应用筛选器时，所有复选框都是空的，包括`全选`复选框。默认设置（相当合乎逻辑地）是设置一个准备好进行调整的筛选器，但在用户决定应用哪些筛选器之前，不会实际筛选任何数据。一旦开始添加筛选元素，它们将显示在`筛选器窗格`中用于筛选数据的字段名称正下方。另一点需要注意的是，一旦筛选器被修改，它在`筛选器窗格`中通常会以不同的颜色显示。\n\
  \n修改筛选器的方式与应用它们的方式相同。要移除选中的筛选元素，只需单击带有复选标记的复选框以清除它。反之，要添加一个补充的筛选元素，只需单击一个空白的复选框。\n\
  \n最后要注意的一点是，如果你随后最小化某个字段的筛选器（通过单击已替换字段名称右侧向下箭头的向上箭头），你现在不仅会在`筛选器窗格`中看到字段名称，还会看到已应用筛选器的简洁描述。你可以在图\
  \ 21-4 中看到一个示例。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig4_HTML.jpg](img/370912_3_En_21_Fig4_HTML.jpg)\n\
  \n图 21-4：筛选器描述\n\n> **注意**：你也可以在向视觉对象添加数据字段之前，先将字段添加到`筛选器窗格`。只需创建一个空白视觉对象，然后在将筛选器字段添加到`筛选器窗格`时保持其选中状态即可。\n\
  \n#### 全选筛选器\n\n简单筛选器的唯一微妙之处在于，你还可以使用`全选`复选框。它充当一个全局的开启/关闭开关，用于选中或取消选中给定筛选器字段的所有可用筛选元素。`全选`筛选器字段有三种状态：\n\
  \n-   *空白*：此字段未选择任何筛选器。\n-   *已勾选*：此字段的所有筛选器均被选中。\n-   *虚线*：此字段的部分筛选器被选中。\n\n选中或取消选中`全选`筛选器字段将选中或取消选中此字段的所有筛选元素，实际上会使筛选器失效。当你不仅想移除多个筛选选择以重新开始，而且还想选择所有元素以便单独取消选中某些元素（并避免手动选择大量元素）时，`全选`筛选器字段特别有用。\n\
  \n> **注意**：在筛选列表中选择多个元素时，你可能会想应用你可能习惯于在 Excel 或其他 Windows 应用程序中使用的经典 Windows 键盘快捷键。不幸的是，使用\
  \ Ctrl 或 Shift 单击来选择元素子集是不起作用的。你也不能使用空格键来选中或取消选中复选框。也无法使用光标键在筛选列表中的元素之间移动。\n\n####\
  \ 清除筛选器\n\n建立一个精细调整的筛选器，以便从数据的噪音中钻取到核心信息，可能需要一些练习。幸运的是，筛选器的几乎瞬时应用意味着你几乎可以立即看到你的分析是否走在正确的道路上。然而，经常会有时候你想要重新开始，并移除特定筛选器的所有设置。这可以通过以下两种方式之一完成。第一种是单步操作：\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig5_HTML.jpg](img/370912_3_En_21_Fig5_HTML.jpg)\n\
  \n图 21-5：清除筛选器图标\n\n1.  展开筛选器内容后，单击筛选器右侧的小橡皮擦图标，如图 21-5 所示。\n\n或者，你可以执行以下操作，但*仅*适用于基本筛选器：\n\
  \n1.  通过单击向下箭头展开`筛选器窗格`中的筛选器。\n2.  单击`全选`选项以移除所有筛选选择。\n3.  最小化筛选器。\n\n一旦筛选器被清除，使其恢复到之前状态的唯一方法是立即按`Ctrl+Z`。否则，你将不得不重新应用所需的条件。\n\
  \n#### 添加筛选器\n\n你不限于使用创建视觉对象时所使用的数据字段来筛选视觉对象。实际上，你可以使用数据模型中的任何字段来筛选视觉对象。操作方法如下：\n\
  \n1.  将要筛选的字段拖入`筛选器窗格`中“此视觉对象上的筛选器”部分下的“将数据字段添加到此区域”区域。\n2.  按照你在前面章节中看到的方式应用筛选器。\n\
  \n#### 移除筛选器\n\n在处理筛选器时，有时你可能想要清理面板并重新开始。最快的方法是删除筛选器；一旦筛选器被删除，它将不再对 Power BI Desktop\
  \ 报表中的数据产生任何影响。可以通过以下方式完成：\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig6_HTML.jpg](img/370912_3_En_21_Fig6_HTML.jpg)\n\
  \n图 21-6：移除筛选器\n\n1.  单击所选筛选器右侧的“移除筛选器”图标。此图标如图 21-6 所示。\n\n这里的技巧是确保你选择了要移除的正确筛选器。然而，该技术适用于所有报表级和页面级筛选器，以及不用于显示数据的视觉级筛选器。\n\
  \n一旦筛选器被移除，使其恢复的唯一方法是立即单击“撤消”（或按`Ctrl+Z`）；否则，你将不得不从头开始重建。有趣的是，尽管你可以通过将元素拖入`筛选器窗格`来添加筛选器，但你不能将它们拖出`筛选器窗格`来移除它们。\n\
  \n但是，你可以通过单击字段名称右侧的叉号，从`筛选器窗格`中移除可视化级别字段（这些字段不作为视觉对象的数据使用）。\n\n> **注意**：视觉级筛选器无法移除，只能重置为空，以便不应用任何筛选器。\n\
  \n## 筛选不同数据类型\n\n到目前为止，你只看到了 Power BI Desktop 如何筛选文本元素。尽管基于文本的元素是许多数据筛选器的主要部分，但它们远非唯一可用的数据类型。还有：\n\
  \n-   数值数据\n-   日期和时间数据\n-   逻辑（真/假）数据\n\n### 筛选数值数据\n\n你可以像在 Power BI Desktop 中筛选基于文本的元素一样，筛选数值元素。然而，在筛选数字时，你很可能想要选择数值范围作为精确的数字。\n\
  \n\n## 范围筛选模式\n\n第一个值得了解的技巧是，在筛选数值数据时，默认选项是使用*阈值选择器*，这也是数值筛选器的唯一选项。阈值选择器允许你设置在 Power\
  \ BI Desktop 报表、页面或可视化对象中显示的数字范围的下限和/或上限。\n\n以下说明如何设置数据显示的数字范围：\n\n1. 选择你之前创建的图表。\n\
  2. 清除所有现有筛选器。\n3. 在“筛选器”窗格中，将指针悬停在 `SalePrice` 筛选器上。用作筛选器的字段右侧将出现一个向下的 V 形符号。\n\
  4. 单击该 V 形符号展开 `SalesPrice` 筛选器。“筛选器”窗格将显示两个弹出窗口，用于设置阈值。\n5. 单击上方的弹出窗口，然后选择“大于或等于”选项。\n\
  6. 在上方弹出窗口下方的框中，输入值 **1000000**（不带任何千位分隔符或货币单位）。\n7. 确保选中弹出窗口下方的 `And` 单选按钮。\n8.\
  \ 单击下方的弹出窗口，然后选择“小于或等于”选项。\n9. 在下方弹出窗口下方的框中，输入值 **8000000**（不带任何千位分隔符或货币单位）。\n10.\
  \ 单击 `Apply filter`。图表将更改，仅显示你在筛选器中设置范围内的值。\n\n就这样。你已为 Power BI Desktop 报表中与所选字段对应的所有数据设置了范围。它应类似于图\
  \ 21-7。值得注意的是，在此图中，我加宽了“筛选器”窗格，以便你可以看到 Power BI Desktop 添加到范围筛选器以解释其功能的完整文本。如果你将“筛选器”窗格保留为默认宽度，则只会看到筛选器定义的缩写版本。\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig7_HTML.jpg](img/370912_3_En_21_Fig7_HTML.jpg)\n\
  \n**图 21-7** 筛选范围\n\n选择数值数据范围时，不必同时设置上限和下限。你可以设置其中之一，或两者都设置。\n\n> **注意：** 如果你想从数据集中的可用数据中选择一个精确数字，可以将数值筛选器的筛选器类型切换为基本筛选。这将显示所选字段中的所有单个数字，以及每个值出现的次数。\n\
  \n#### 数值筛选选项\n\n数字的筛选方式与文本不完全相同；筛选选项略有不同。这些筛选选项在表 21-2 中进行描述。\n\n**表 21-2 数值筛选选项**\n\
  \n| 筛选选项 | 描述 |\n| --- | --- |\n| 小于 | 所选字段小于你搜索的数字。 |\n| 小于或等于 | 所选字段小于或等于你搜索的数字。\
  \ |\n| 大于 | 所选字段大于你搜索的数字。 |\n| 大于或等于 | 所选字段大于或等于你搜索的数字。 |\n| 等于 | 所选字段与你搜索的数字完全匹配。\
  \ |\n| 不等于 | 所选字段与你搜索的数字不完全匹配。 |\n| 为空 | 所选字段为空。 |\n| 非空 | 所选字段非空。 |\n\n如果你同时使用两个阈值级别来定义要包含或排除的值范围，或者要包含或排除的特定值，则需要应用逻辑筛选选项之一。这些选项如表\
  \ 21-3 所示。\n\n**表 21-3 逻辑筛选选项**\n\n| 筛选类型 | 描述 |\n| --- | --- |\n| 与 | 应用两个筛选元素以*减少*允许通过筛选器的数据量。\
  \ |\n| 或 | 分别应用任一筛选元素以*增加*允许通过筛选器的数据量。 |\n\n在应用数值筛选器时，你**必须**输入一个数值——这并不令人惊讶。如果你错误地输入了文本，框的右侧会出现一个黄色菱形，提醒你输错了文本，并且\
  \ `Apply filter` 文本将保持灰色。\n\n在这种情况下，你必须删除输入的字符，并在文本位置输入一个数值。\n\n### 筛选日期和时间数据\n\n\
  最简单的形式是，日期和时间数据只是一系列元素或一段数值数据。因此，将日期维度中的字段拖到“筛选器”窗格中，可以让你选择一个或多个元素（例如年份或月份），或者定义一个范围（例如周）。按照以下步骤操作以查看实际效果：\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig8_HTML.jpg](img/370912_3_En_21_Fig8_HTML.jpg)\n\
  \n**图 21-8** 日期筛选器\n\n1. 选择你之前使用 `Make` 和 `SalePrice` 字段创建的图表。\n2. 清除所有现有筛选器。\n\
  3. 展开字段列表中的 `DateDimension` 表。\n4. 将 `FullYear` 字段拖到“筛选器”窗格中“此视觉对象上的筛选器”部分的 `Add\
  \ data fields here` 放置区域。由于 Power BI Desktop 假定年份是数字，因此它会切换到高级筛选。\n5. 从 `Filter\
  \ type` 弹出列表中选择 `Basic filtering`，以恢复为年份列表。\n6. 在筛选器列表中单击一两年。图 21-8 演示了这一点。图表将更新，仅显示所选年份的数据。\n\
  \n我创建日期维度的原因之一是为了让你能够轻松地按日期元素进行筛选。因此，你现在可以使用 `DateDimension` 表中的任何字段来限制可视化对象中的数据。在我看来，该维度中以下字段非常有用：\n\
  \n* `FullYear`\n* `MonthAndYearAbbr`\n* `QuarterAndYear`\n* `YearAndWeek`\n\n但是，你需要记住，你可以在一个筛选器中组合多个元素以获得正确的结果。因此，没有什么能阻止你，例如，筛选特定年份，然后添加星期几并计算该年份所有星期六的销售额。通过结合来自构建良好的数据维度的不同筛选元素，你可以极其轻松地查看数据随时间的变化情况。\n\
  \n这意味着，在按日期筛选时，你可能需要应用多个筛选器，并且可以从每个不同的筛选器（例如：年、季度和/或月）中选择元素。或者，如果你要按日期层次结构中的连续元素（例如年份，然后是月份）进行筛选，你可能会发现按使用的时间顺序（即年份后跟月份）将筛选元素从日期层次结构拖动到“筛选器”窗格更为直观。这样，你可以按照逻辑顺序，从“筛选器”窗格的顶部到底部，应用你感兴趣的日期条件。\n\
  \n> **注意：** 无论数据类型如何，你都不能将层次结构添加到筛选器。相反，你必须在字段列表中展开层次结构，并将层次结构的每个元素拖到所需的“筛选器”窗格中。\n\
  \n\n\n#### 日期和时间筛选器\n\n如果正在对 `Date` 或 `DateTime` 字段进行筛选，你很快就会发现 Power BI Desktop\
  \ 会调整筛选器，帮助你更轻松地选择日期和时间。本质上，Power BI Desktop 允许你通过四种方式筛选日期和时间数据：\n\n-   选择一个或多个确切的日期或时间（基本筛选）\n\
  -   定义一个日期或时间范围（高级筛选）\n-   指定相对于当前日期的日期范围（相对日期筛选）\n-   选择前几个日期（前 N 个筛选）\n\n此外，日期字段的筛选器窗格会添加：\n\
  \n-   一个日历弹出窗口，允许你点击某个月的某一天（并向前或向后滚动浏览全年各个月份）\n-   一个时间序列滚动筛选器，允许你选择一天中精确到每分钟的时间\n\
  \n为了直观地了解其工作方式，假设你想查看某个日期范围内的所有销售额：\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig9_HTML.jpg](img/370912_3_En_21_Fig9_HTML.jpg)\n\
  \n*图 21-9 – 日历弹出窗口*\n\n1.  选择你之前创建的图表。\n2.  按照之前所述的方法，从中删除 `FullYear` 筛选器。\n3. \
  \ 保持图表选中状态，展开 `DateDimension` 表，将 `DateKey` 字段拖放到“筛选器窗格”中“此视觉对象上的筛选器”部分的“在此处添加数据字段”区域。你将看到筛选器中显示了\
  \ `DateDimension` 表中的所有日期列表。\n4.  点击“高级筛选”。\n5.  从“显示符合以下条件的项目”弹出列表中，选择“晚于或等于”。\n\
  6.  点击弹出列表下方的日历图标。将显示如图 21-9 所示的日历弹出窗口。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig10_HTML.jpg](img/370912_3_En_21_Fig10_HTML.jpg)\n\
  \n*图 21-10 – 日期范围筛选器*\n\n1.  从日历中选择一个日期。此日期将显示在日历图标下方的框中。\n2.  点击“且”单选按钮。\n3.  在第二个弹出列表中，选择“早于或等于”。\n\
  4.  点击弹出列表下方的日历图标，并从日历中选择一个日期。此日期将显示在第二个弹出列表下方的框中。\n5.  点击“应用筛选器”。筛选器窗格将如图 21-10\
  \ 所示。\n\n从日历弹出窗口中选择日期时，有几个技巧可以帮你节省时间（你可能在其他桌面软件中熟悉这些技巧）：\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig11_HTML.jpg](img/370912_3_En_21_Fig11_HTML.jpg)\n\
  \n*图 21-11 – 月份的日历弹出窗口*\n\n-   使用日历弹出窗口时，点击月份和年份右侧的右向 V 形符号，可显示下一个月。\n-   使用日历弹出窗口时，点击月份和年份左侧的左向\
  \ V 形符号，可显示上一个月。\n-   使用日历弹出窗口时，点击月份和年份会显示一个年份弹出窗口，在该窗口中，你可以点击年份右侧的右向 V 形符号显示下一年（或点击年份左侧的左向\
  \ V 形符号显示上一年），然后从显示的月份中选择所需的月份。你可以在图 21-11 中看到这一点。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig12_HTML.jpg](img/370912_3_En_21_Fig12_HTML.jpg)\n\
  \n*图 21-12 – 年份的日历弹出窗口*\n\n-   如果你已经点击了月份和年份，正查看某一年份的各个月份，你可以点击年份来查看年份范围。您可以使用左向和右向\
  \ V 形符号滚动浏览前一个和后一个年份范围，然后选择你要筛选的年份。你可以在图 21-12 中看到这一点。\n-   使用时间弹出窗口时，点击时间的任何组成部分（小时、分钟或秒）内部，然后点击时间字段上方和下方的上下滚动三角形，可以快速滚动浏览可用选项。\n\
  -   点击时间框右侧的“上午”或“下午”，可以在上午和下午之间切换。\n\n如果你不想使用日历弹出窗口选择日期，可以直接在 `Date`（或 `DateTime`）字段高级筛选器的日期框中输入日期。只需记住，输入的日期格式必须与你所使用的环境相对应，并且该格式能被\
  \ Power BI Desktop 识别。\n\n> **注意：** 如果你输入的日期格式与系统格式不符，或者日期完全无效（例如 2 月 30 日），Power\
  \ BI Desktop 将不允许你应用该筛选器。若要更正此问题，只需使用日历弹出窗口选择一个正确的日期即可。同样，如果你输入了一个不存在的时间，Power BI\
  \ Desktop 将拒绝接受它，并会恢复为之前选择的（可接受的）时间。\n\n#### 日期筛选选项\n\n日期的筛选方式无法完全与文本或数字相同。因此，日期筛选器的高级筛选选项与其他数据类型筛选时使用的选项略有不同。表\
  \ 21-4 中对此进行了说明。\n\n**表 21-4 – 高级日期筛选选项**\n\n| 筛选选项 | 说明 |\n| --- | --- |\n| `等于`\
  \ | 选定的字段包含你正在搜索的日期。 |\n| `不等于` | 选定的字段不包含你正在搜索的日期。 |\n| `晚于` | 选定的字段包含你输入日期之后的日期，即较晚的日期，不包括你输入的日期。\
  \ |\n| `晚于或等于` | 选定的字段包含从你输入的日期开始或之后的日期。 |\n| `早于` | 选定的字段包含你输入日期之前的日期，即较早的日期，不包括你输入的日期。\
  \ |\n| `早于或等于` | 选定的字段包含你输入的日期或之前的日期，即早于或等于你输入的日期。 |\n| `为空` | 选定的字段为空。 |\n| `不为空`\
  \ | 选定的字段不为空。 |\n\n\n#### 相对日期筛选\n\n另一种查找日期范围数据的方法专门适用于当前日期。`Power BI Desktop` 可以帮助您查找过去几天、几周、几个月甚至几年的销售数据。操作步骤如下：\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig13_HTML.jpg](img/370912_3_En_21_Fig13_HTML.jpg)\n\
  \n**图 21-13** – 应用相对日期筛选\n\n1. 选择您之前创建的图表。\n2. 按照前述方法清除该图表上的所有筛选器。\n3. 保持图表选中状态，展开\
  \ `DateDimension` 表，将 `DateKey` 字段添加到该视觉对象的 `筛选器窗格` 中。\n4. 在 `筛选器类型` 弹出列表中，选择 `相对日期筛选`。\n\
  5. 在“当值满足以下条件时显示项目”弹出窗口中，选择“在此期间内”。\n6. 在第二个“当值满足以下条件时显示项目”弹出窗口中，选择 `年`。`筛选器窗格`\
  \ 将如图 21-13 所示。\n7. 点击 `应用筛选器` 以筛选视觉对象中的数据。\n\n相对日期筛选有多个选项可用。这些选项在表 21-5 中进行了说明。\n\
  \n**表 21-5** – 相对日期筛选选项\n\n| 筛选选项 | 筛选定义 | 说明 |\n| --- | --- | --- |\n| `在过去` |\
  \ 相对定位 | 获取当前日期之前的一段日期范围。 |\n| `在此期间内` | 相对定位 | 指定要使用的当前时间段。 |\n| `在将来` | 相对定位 |\
  \ 获取当前日期之后的一段日期范围。 |\n| `天` | 时间元素 | 将天数设置为时间段的数量。 |\n| `周` | 时间元素 | 将周（滚动七天周期）设置为时间段的数量。\
  \ |\n| `日历周` | 时间元素 | 将完整日历周设置为时间段的数量。 |\n| `月` | 时间元素 | 将月（滚动周期，从日期到日期）设置为时间段的数量。\
  \ |\n| `日历月` | 时间元素 | 将完整日历月设置为时间段的数量。 |\n| `年` | 时间元素 | 将年（滚动周期，从日期到日期）设置为时间段的数量。\
  \ |\n| `日历年` | 时间元素 | 将完整日历年设置为时间段的数量。 |\n\n**注意：** 选中 `在过去` 或 `在将来` 相对日期筛选选项后，`筛选器窗格`\
  \ 中会显示一个额外字段，您可以在其中输入用于筛选数据的天数、周数、月数等。\n\n### 筛选布尔值数据\n\n源数据中可能还有您需要处理的其他数据类型。例如，您可能拥有布尔值（真或假）数据。然而，对于\
  \ `Power BI Desktop` 而言，无论出于何种目的，这都被视为基于文本的筛选器。另一方面，有些数据类型无法进行筛选，也永远不会出现在 `筛选器窗格`\
  \ 中。二进制数据（如图像）就是如此。\n\n因此，如果您对布尔值数据进行筛选，`Power BI Desktop` 会在该数据类型的展开筛选器中显示 `True`\
  \ 和 `False`。以下是查看方法：\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig14_HTML.jpg](img/370912_3_En_21_Fig14_HTML.jpg)\n\
  \n**图 21-14** – 应用布尔值筛选\n\n1. 使用以下字段创建一个簇状柱形图：\n    - `IsCreditWorthy`（来自 `Clients`\
  \ 表）\n    - `SalePrice`（来自 `InvoiceLines` 表）\n2. 在 `筛选器窗格` 中展开 `IsCreditWorthy`\
  \ 字段。\n3. 选中 `True` 和 `空白`。图表和 `筛选器窗格` 将如图 21-14 所示。\n\n## 高级文本筛选器\n\n在许多情况下，当您深入挖掘数据时，仅选择“简单”筛选器就足以突出显示您和观众感兴趣的信息。但不可避免的是，有时您需要更精细地筛选数据，以便返回能够去芜存菁的结果。这正是\
  \ `Power Desktop BI` 高级筛选功能的用武之地。高级筛选允许您以更高的精度在字段数据内进行搜索，当您需要根据文本字段的部分内容包含或排除数据时，它尤其有用。\n\
  \n### 应用高级文本筛选器\n\n让我们从一个简单的示例开始，说明如何对文本字段应用高级筛选器：\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig15_HTML.jpg](img/370912_3_En_21_Fig15_HTML.jpg)\n\
  \n**图 21-15** – 应用高级筛选器的结果\n\n1. 点击您想要筛选的视觉对象。再次，我们将使用本章前面使用 `Make` 和 `SalePrice`\
  \ 作为数据字段创建的图表。\n2. 清除任何现有的筛选器。\n3. 在 `筛选器窗格` 中展开 `Make` 字段（如果尚未展开）。\n4. 从 `筛选器类型`\
  \ 弹出列表中选择 `高级筛选`。筛选器的主体部分会切换显示高级筛选器的弹出窗口和输入框，并且筛选器标题下的文本现在显示为“当值满足以下条件时显示项目”。\n\
  5. 从弹出窗口中选择 `包含`。\n6. 点击筛选器文本框内部（位于显示 `包含` 的框下方），输入要筛选的文本（本示例中为 **aston**）。\n7.\
  \ 点击 `应用筛选器` 或按下 `Enter` 键。`Power BI Desktop` 报表中的所有对象将仅显示客户名称包含文本 `aston` 的数据。结果如图\
  \ 21-15 所示；用于生成该结果的高级筛选器也已显示。\n\n在此阶段，有几点重要事项需要说明：\n\n- 高级筛选是**不**区分大小写的。您可以在筛选框中输入大写或小写字符；结果相同。\n\
  - 空格和标点符号很重要，因为它们会被逐字处理。例如，如果您输入 `A `（A 后面带一个空格），则只会找到包含 A（大写或小写）且后跟空格的元素。\n- 高级筛选器与标准筛选器一样，其效果是累积的。因此，如果您应用了筛选器但未获得预期结果，请务必检查是否有其他层级的筛选器处于活动状态，可能会缩小返回的数据范围，使其超出您的需求。\n\
  - 如果您的筛选器从结果集中排除了所有数据，那么 `Power BI Desktop` 报表中的任何表格都会显示“此表不含任何行。”\n- 同样，如果您的筛选器排除了所有数据，图表将为空。\n\
  \n无论如何，如果最终没有显示任何数据，或者显示的数据与您想要展示的不符，只需清除筛选器并重新开始。\n\n### 清除高级筛选器\n\n不可避免的是，您还需要知道如何移除高级筛选器。其过程与标准筛选器相同；您只需点击该字段筛选器顶部的\
  \ `清除筛选器` 图标（位于字段框内该字段的 V 形符号正下方）即可。此筛选器的筛选元素将被移除。\n\n### 恢复为基本筛选\n\n如果您决定不再定义和使用复杂筛选器，而希望恢复为基本筛选，那么只需为所选筛选器从\
  \ `筛选器类型` 弹出列表中选择 `基本筛选` 即可。`筛选器窗格` 将切换为针对所选字段的基本筛选。\n\n\n### 文本筛选选项\n\n在根据数据字段包含的文本进行筛选时，你可以通过多种方式将所筛选的字符串应用到基础数据上。这些方式对于文本字段的两个高级筛选选项（上部和下部）都是相同的，如表\
  \ 21-6 所述。\n\n表 21-6\n\n高级文本筛选选项\n\n| 筛选选项 | 说明 |\n| --- | --- |\n| 包含 | 所选字段的字段数据中包含搜索文本（不论位于何处）。\
  \ |\n| 不包含 | 所选字段的字段数据中不包含搜索文本（不论位于何处）。 |\n| 开头是 | 所选字段以搜索文本开头，其后可接任意数据。 |\n| 开头不是\
  \ | 所选字段不以搜索文本开头，其后也不接任意数据。 |\n| 是 | 所选字段与搜索文本完全匹配。 |\n| 不是 | 所选字段与搜索文本不匹配。 |\n\
  | 为空 | 所选字段为空。 |\n| 非空 | 所选字段非空。 |\n\n你并非只能设置单个高级文本筛选。与数值字段的情况一样，你可以设置两个筛选，并将逻辑运算符设为`Or`来应用其中任一筛选。或者，你也可以通过将逻辑运算符设为`And`来设置两个互补的文本筛选。\n\
  \n## 前 N 项筛选\n\n筛选数据的原因之一是从海量信息中提取含义。一种提供有意义分析的简便方法是隔离出表现最佳（或最差）的元素。例如，假设你想查看销量排名前三的汽车品牌：\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig16_HTML.jpg](img/370912_3_En_21_Fig16_HTML.jpg)\n\
  \n图 21-16\n\n应用前 N 项筛选\n\n1. 单击你要筛选的可视化对象。此处我们仍使用本章前面用`Make`和`SalePrice`作为数据字段创建的图表。\n\
  2. 在“筛选器”窗格中，展开“视觉级筛选器”窗格的`Make`部分。\n3. 从`筛选器类型`弹出列表中选择`前 N 项`。\n4. 确保在`显示项目`弹出列表的可用选项中选择了`前几项`。\n\
  5. 在`显示项目`弹出列表右侧的字段中输入`3`。\n6. 将`SalePrice`字段拖入`按值`字段。\n7. 单击`应用筛选器`。你将看到图表和筛选器呈现如图\
  \ 21-16 所示。\n\n这里所做的是在后台对每个品牌的`SalePrice`字段进行了聚合。然后使用最高的三个值来筛选数据。\n\n**注意**：筛选后\
  \ N 项元素只需在`显示项目`列表中选择`后几项`即可。\n\n### 特定可视化级别筛选\n\n在本章中，到目前为止我们看到的筛选都是：用于筛选可视化对象的字段*同样*也显示在可视化对象本身中——无论是图表、地图还是表格。无可避免地，有时你将需要根据*未*在可视化对象中显示的字段进行筛选。虽然我们之前提到过这一点，但仍有必要更详细地解释这个概念。\n\
  \n以下示例说明了如何应用可视化级别筛选：\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig17_HTML.jpg](img/370912_3_En_21_Fig17_HTML.jpg)\n\
  \n图 21-17\n\n未使用数据字段的可视化级别筛选\n\n1. 使用文件`CarSalesDataForReports.pbix`，创建一个按`ClientName`分组的`SalePrice`聚集柱形图。\n\
  2. 显示“筛选器”窗格（如果尚未显示）。\n3. 展开“Colors”表，将`Color`字段拖入该可视化对象的“筛选器”窗格中的`将数据字段添加到此位置`区域。筛选器窗格中的颜色列表将自动展开。但`Color`字段*不会*显示在可视化对象中。\n\
  4. 勾选一两种颜色，例如“Night Blue”和“Silver”。结果如图 21-17 所示。\n\n你会立即注意到，应用的筛选仅影响所选的可视化对象（本例中的图表）。当你创建包含多个可视化对象的复杂报表时，会发现报表中的其他可视化对象的基础数据不会受到任何影响。\n\
  \n你可以通过单击筛选器名称右上角的`清除`图标，清除可视化级别的任何筛选。此外，你可以向可视化对象的“筛选器”窗格添加多个字段，*并且*可以以任意顺序添加。\n\
  \n**注意**：如果筛选器处于活动状态，从字段区域删除字段*不会*将其从“筛选器”窗格中移除。这可能会产生误导，因为该字段虽然不再显示在可视化对象中，但其效果仍然可见。\n\
  \n### 多个筛选\n\n到目前为止，我们一直假设每次只应用一个筛选。相信我，在处理庞大复杂的数据集时，情况通常并非如此。通常，`Power BI Desktop`允许你向报表添加多个筛选。这需要我们仔细考虑以下可能影响：\n\
  \n- 所有筛选器同时处于活动状态（除非你已清除某个筛选器），其效果是累积的。也就是说，只有当数据匹配*所有*活动筛选器设定的*所有*条件时，才会返回数据。因此，例如，如果你设置了在指定日期范围内且销售额高于某个数值的筛选条件，那么任何销售额低于你设定数值、或销售日期在你设定范围之前或之后的数据都*不会*被返回。\n\
  \n- 如果你在处理多个筛选（无论是视觉级、页面级还是报表级），你可以通过在“筛选器”窗格顶部的`搜索`框中输入筛选所用字段的部分字符，只显示活动筛选器的一个子集。这将立即显示所有基于包含你输入字符的字段的筛选器。要清除`搜索`框，只需单击`搜索`框右侧的叉号图标。\n\
  \n- 要对任意级别（视觉级、页面级或报表级）的筛选器进行排序，只需单击筛选器右侧的省略号，然后从弹出的菜单中选择排序顺序。如果你想查看排序菜单，请参考图 21-1。\n\
  \n- 很容易忘记筛选器可能处于活动状态。请记住，“筛选器”窗格中的所有活动筛选器无论窗格本身是展开还是折叠，都保持有效。如果你打算折叠筛选器以更有效地利用屏幕空间，那么值得养成查看任何筛选器标题下方第二行文字的习惯，该行文字会描述当前筛选状态。例如，它会显示类似`包含\
  \ Rolls` 的信息。当然，具体文字会根据你应用的筛选器而变化。\n\n\n\n## 页面级筛选器\n\n在了解了筛选器的概念以及如何将其应用于可视化对象之后，现在我们来扩展这个概念，看看筛选器如何应用于多个可视化对象。\n\
  \n好消息是，无论筛选器应用于哪个层级，所有筛选器的配置方式都完全相同。因此，在页面级或报表级应用筛选器，只是选择在“筛选器”窗格中放置筛选器位置的问题。\n\n\
  例如，假设你想筛选一个页面上的所有可视化对象，使其仅显示特定年份的数据：\n\n1.  在打开的 Power BI Desktop 文件（例如包含你可以在图 21-18\
  \ 中看到的图表的文件）中，单击任何现有可视化对象外部的仪表板画布。\n2.  展开 `DateDimension` 表。\n3.  将 `FullYear`\
  \ 字段拖到字段井并放入“页面级筛选器”框中。将显示此字段的高级筛选选项。\n4.  选择“基本筛选”作为筛选器类型。\n5.  从可用年份列表中选择 **2014**。当前页面上的所有可视化对象都将被筛选，仅显示此年份的数据。\n\
  \n图 21-18 向您展示了此操作的“筛选器”窗格。您可以看到页面级筛选器看起来与视觉级筛选器完全相同。唯一的区别（除了它产生的效果之外）是在“筛选器”窗格中的位置。\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig18_HTML.jpg](img/370912_3_En_21_Fig18_HTML.jpg)\n\
  \n图 21-18：应用页面级筛选器\n\n如果您愿意，可以通过将更多字段拖到字段井并放入“页面级筛选器”框来添加多个页面级筛选器。添加字段的顺序并不重要。您会注意到，无论是否选择了可视化对象，页面级筛选器都保持可见。\n\
  \n## 报表级筛选器\n\n最高级别的筛选是在报表级别应用的。这意味着在此处设置的任何筛选器都将应用于报表中的每一页（或仪表板），从而也应用于文件中的每一个可视化对象。我知道\
  \ Power BI Desktop 现在将此概念称为“所有页面上的筛选器”，但我更喜欢使用旧术语，因为我觉得它更具表现力。应用报表级筛选器与应用页面级筛选器几乎完全相同。那么，假设你的整个报表只涉及一个国家/地区。以下是设置一个将应用于\
  \ Power BI Desktop 报表中每一页的筛选器的方法：\n\n1.  使用文件 `CarSalesDataForReports.pbix`，获取你用\
  \ `ClientName` 创建的包含 `SalePrice`，然后按视觉级颜色和页面级 `FullYear` 筛选的报表。\n2.  单击任何现有可视化对象外部的仪表板画布。\n\
  3.  展开 `Countries` 表。\n4.  将 `CountryName` 字段拖到字段井并放入“报表级筛选器”框中。将显示此字段的高级筛选选项。\n\
  5.  确保为此筛选器选择“基本筛选”作为筛选器类型。\n6.  从可用国家/地区列表中选择 **United Kingdom**。当前报表中（每一页上）的所有可视化对象都将被筛选，仅显示此年份的数据。\n\
  \n图 21-19 向您展示了此操作的“筛选器”窗格。\n\n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig19_HTML.jpg](img/370912_3_En_21_Fig19_HTML.jpg)\n\
  \n图 21-19：应用报表级筛选器\n\n如果您愿意，可以通过将更多字段拖到字段井并放入“报表级筛选器”窗格来添加多个报表级筛选器。再次强调，添加字段的顺序无关紧要。您会注意到，无论是否选择了可视化对象，报表级筛选器都保持可见。\n\
  \n## 筛选器字段复用\n\n尽管看起来可能违反直觉，但在某些情况下，您可以在同一筛选器级别重复使用同一字段来辅助工作。\n\n例如，假设你想查看里程数在明确阈值之间的所有车辆的数据。请看下面的示例：\n\
  \n![../images/370912_3_En_21_Chapter/370912_3_En_21_Fig20_HTML.jpg](img/370912_3_En_21_Fig20_HTML.jpg)\n\
  \n图 21-20：在筛选器中组合同一字段的多个迭代\n\n1.  使用文件 `CarSalesDataForReports.pbix`，获取你用 `ClientName`\
  \ 创建的包含 `SalePrice`，并经过筛选的报表。\n2.  移除所有筛选器。\n3.  展开 `Stock` 表。\n4.  将 `Mileage`\
  \ 字段拖到字段井，并放入“所有页面上的筛选器”井中。\n5.  从第一个弹出菜单中选择“大于”。\n6.  在第一个阈值框中输入 **50000**。\n7.\
  \  确保选中“与”单选按钮。\n8.  从第二个弹出菜单中选择“小于”。\n9.  在第二个阈值框中输入 **70000**。\n10. 单击“应用筛选器”。\n\
  11. 将 `Mileage` 字段拖到字段井，并放入刚刚创建的筛选器下方的“所有页面上的筛选器”井中。\n12. 确保为此筛选器选择“基本筛选”。将显示所选里程范围内库存车辆的可选里程列表（以及每个里程对应的车辆数量）。您可以在图\
  \ 21-20 中看到这一点。\n\n您现在可以使用更详细的筛选器来筛选当前页面上的可视化对象。\n\n需要注意的一点是，即使是在“筛选器”窗格内的一个筛选器框中，也会应用筛选器层次结构。简而言之，放在另一个筛选器上方的筛选器将筛选下方筛选器中的可用元素。然而，这仅适用于同一筛选器的复用。\n\
  \n> **注意：** 此示例设置为在页面级别进行筛选。它同样也可以应用于报表级别。\n\n### 要求单选\n\n某些筛选器选项允许您从列表中选择多个选项。您可能希望强制自己或最终用户只从该列表中选择一个元素。\n\
  \n在这种情况下，您需要做的就是选中列表下方的`需要单选`复选框。一旦该选项激活，它将取消选择列表中任何已有的选中元素，并且（可能更重要的是）当在筛选器中做出新选择时也会如此。\n\
  \n> **注意：** 选择`需要单选`选项也会隐藏“筛选器类型”弹出列表。要切换到另一种筛选器类型，您需要通过取消选中复选框来停用`需要单选`选项。\n\n\n\
  \n## 使用筛选器层次结构\n\n鉴于可以应用多个级别的筛选器，Power BI Desktop 采用了一套筛选器层次结构：\n\n-   首先，在数据级别，你对基础数据应用的任何选择或选项，都会限制\
  \ Power BI Desktop 可用于可视化信息的数据集。\n-   其次，在报表级别，你应用的任何报表级筛选器，都会影响报表中使用（可能受限的）可用源数据的所有可视化项。\n\
  -   第三，在页面级别，你应用的任何页面级筛选器，都会影响视图上使用（经任何报表级筛选器筛选后、可能受限的）可用源数据的所有可视化项。\n-   最后，对于每个可视化项，你应用的任何可视化级筛选器，都会进一步限制经报表级和页面级筛选器筛选后的数据——但仅限于所选的可视化项。\n\
  \n以下几点值得注意：\n\n-   如果某个选项在更高层级（报表级或页面级）已被筛选掉，则你无法对可视化筛选器应用完全不同的选择。点击 `Select all`\
  \ 将*仅*从先前筛选出的元素子集中进行选择。\n-   如果你在可视化级别应用了一个筛选器，然后在报表或页面级别重新应用相同的筛选器，但选择了不同的元素，那么你仍会在可视化级别从筛选器中排除所有未选中的元素。我强调这一点，是因为\
  \ Power BI Desktop 会记住之前在可视化级别选中的元素，即使它们因已在视图级别被排除而无法在筛选器中使用，也会使它们保持可见。在我看来，即使应用了分层选择逻辑，这也会增加一定的视觉混乱。\n\
  \n希望这能向你表明，Power BI Desktop 在应用其筛选器层次结构方面是严谨的。如果你需要在报表或页面级别排除了筛选选项的情况下，在可视化级别应用筛选器，那么你别无选择，只能移除较高级别的筛选器，然后对所有必要的可视化项重新应用可视化级筛选器。\n\
  \n## 筛选技巧\n\nPower BI Desktop 使得筛选数据以及排除任何你认为在数据分析中无用的数据变得极其容易。然而，与许多强大的工具一样，这种快速简便地应用筛选器的能力可能是一把双刃剑。因此，以下是关于在数据上应用筛选器的一些建议和注意事项。\n\
  \n### 不要过早筛选\n\n首先，我想说一条关键的基本原则是“不要过早筛选”。我的意思是，如果你正在检查数据以寻找趋势、异常和见解，你必须小心谨慎，不要排除那些可能包含具有变革性意义的见解的数据。\n\
  \n问题在于，当你第一次深入一大堆数据中寻找有价值的信息时，你根本不知道自己在找什么。因此，我只能建议采用以下方法：\n\n-   开始时不要应用任何筛选器，看看数据以其最基本的形式能说明什么。\n\
  -   一次只应用一个筛选器，并记得在尝试另一个筛选器之前删除当前筛选器。\n-   尝试从筛选器的“层级”角度思考。因此，一旦你定义了一组初始筛选器，就逐一添加更多的筛选器。\n\
  -   慢慢来。人们很容易忍不住想一有发现就到处宣扬。这可能导致过度筛选和不可靠的数据。\n-   始终移除任何并非绝对必要的筛选器。\n-   如果隐藏了“筛选器”窗格，请务必小心。如果筛选器无法以某种方式可见，就很容易忘记它们处于激活状态。\n\
  -   请记住，你可以有特定于某个可视化项的筛选器，这些筛选器在“筛选器”窗格中不滚动可能不会立即可见。因此，始终检查报表中每个表和图表是否有任何处于激活状态的可视化筛选器。\n\
  -   请注意，筛选器是 Power BI 底层“基础结构”的一部分。它们并非为交互而设计。如果你正在寻找与数据的直观交互方式，应考虑使用切片器和交叉筛选（如下一章所述）。\n\
  -   筛选器可以对报表用户（或者像 Power BI 所称的报表阅读者）隐藏。这仅在您的报表发布到 Power BI 服务时才会生效。要隐藏用户的筛选器，请点击“筛选器”窗格右上角的“显示或隐藏筛选器窗格”图标。此图标已在图\
  \ 21-1 中标注。\n\n### 做注解，做注解，做注解\n\n如果你要基于某个数据集展示一项关键发现，那么，在每种情况下都明确说明数据包含什么、不包含什么，可以避免很多尴尬。例如，你可能会对自己发现的揭示性销售趋势感到非常满意，以至于忘记了在基础数据中注明一个重要的排除项。现在，没人会认为你除了阐明观点之外还做了什么，但你的受众需要知道哪些内容被排除了以及原因——以防万一这会产生影响。毕竟，你肯定不希望在工作场所的竞争对手在重要会议中突然指出这一点，从而否定你的发现，对吧？\n\
  \n关于注解的技巧在第二十二章中有描述，如果你需要跳过去立即查看的话。\n\n### 避免复杂筛选器\n\nPower BI Desktop 的筛选器旨在直观且易于使用。其后果是，当你需要应用非常复杂的筛选器时——无论是文本、数字还是日期筛选器——它们可能会显得有些局限。\n\
  \n如果你需要创建复杂的筛选器，最好*不要*在报表中创建。相反，请考虑尝试使用 Power BI Desktop 查询来筛选源数据。如果你需要在报表中以一种更具交互性的方式在复杂筛选器设置之间切换，那么请使用\
  \ `DAX` 来定义列，这些列将筛选器的结果显示为文本，然后将筛选器的结果用作选择。一个非常简单的例子是考虑 `Mileage Range` 列。实际上，这会将车辆行驶里程分组到特定的区间。接着，在筛选器中选择一个或多个区间，将限制显示内容仅匹配预定义数据范围的数据。稍加练习，你就可以扩展此技术，在数据级别用\
  \ `DAX` 创建相当复杂的筛选器。\n\n> **注意**\n>\n> 由于 `DAX` 本身是一个庞大的主题，本书将不会介绍此语言。\n\n## 结论\n\
  \n本章向你展示了如何应用和微调一系列技术，使您能够限制将在 Power BI Desktop 报表中使用的基础数据。需要掌握的主要内容是，你可以在三个级别筛选数据：整体报表、每个页面以及页面上的每个可视化项。\n\
  \n你还了解了多种选择技巧，这些技巧允许你选择数据的子集。这些技巧范围从明确地简单选择几个元素，到指定更复杂的日期或值范围。最后，值得记住的是，你可以使用基础数据集中的任何字段来筛选数据，无论该字段是否在报表的可视化项中显示。\n\
  \n既然你已经掌握了筛选器，现在可以在此基础上继续学习 Power BI Desktop 用于数据子集选择的其他技巧：切片器和交叉筛选。这些将是下一章的主题。\n\
  \n\n\n"
- "# 22. 使用切片器\n\n有了适当的筛选器后，您现在拥有了功能强大且富有洞察力的仪表板，可以随时向同事、老板和客户展示。然而，静态的图示只能以特定方式讲述故事。要达成交易或说服受众，您需要的是与数据和数字进行真正富有表现力的交互。Power\
  \ BI Desktop 再次成为首选工具，它只需单击一下即可突出显示演示文稿中的关键指标——简洁而优雅地阐明您的观点。\n\n说得更直白些，您可以在 Power\
  \ BI Desktop 报表中与筛选后的数据进行交互，以细分或隔离指标。这些元素具有以下特点：\n\n-   在 Power BI Desktop 报表中始终可见\n\
  -   可即时访问\n-   可交互\n-   清晰指示正在应用哪些选择\n\n那么，您可以向 Power BI Desktop 报表添加哪些效果来选择和展示您的数据呢？本质上，它们归结为三种主要方法：\n\
  \n-   切片器\n-   交叉筛选\n-   突出显示\n\n这些交互元素可以被视为一种补充级别的筛选。也就是说，它们会获取当前在“筛选器”窗格（任何级别）中设置的筛选器，然后在已通过现有筛选器允许的数据集之上提供进一步的细粒度*交互式*选择。每种方法都有其优点和局限性，但如果使用得当，每种方法不仅能让您发现数据的本质，还能清晰有效地阐明您的观点。\n\
  \n此外，您可以指定哪些切片器和视觉效果可以影响仪表板页面上的其他视觉效果。Power BI Desktop 的这一方面（称为视觉交互）是您将在本章中学习的关于使用切片器的另一个方面。\n\
  \n您将使用 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix` 示例文件作为本章中创建的所有切片器的基础。\n\
  \n## 切片器\n\nPower BI Desktop 中交互式筛选器的一种关键形式是*切片器*。实际上，它是一个标准的多选筛选器，您可以在其中选择一个或多个元素来筛选报表中的数据。其本质区别在于，切片器在\
  \ Power BI Desktop 报表上保持可见，而筛选器通常是隐藏的。因此，这是一种公开而非隐蔽的数据选择方法——并且能使选择标准立即可见。此外，您可以向\
  \ Power BI Desktop 报表添加多个不同的切片器，从而使用多个累积标准即时、交互地剖析数据。切片器可以基于文本，也*可以*是简单的图表，您很快就会看到这一点。如果您需要更高级或视觉上更有趣的数据切片方式，甚至可以向仪表板添加第三方切片器。\n\
  \n### 添加切片器\n\n为了充分了解切片器的功能，我们需要实际查看一个运行中的切片器。这意味着页面中至少有一个标准视觉对象，以便您可以看到应用切片器的结果。要测试切片器：\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig1_HTML.jpg](img/370912_3_En_22_Fig1_HTML.jpg)\n\
  \n图 22-1 切片器图标\n\n1.  打开 Power BI Desktop 文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n\
  2.  使用以下字段创建一个表格（以显示使用切片器的效果）：\n    -   `CountryName`（来自 Countries 表）\n    -   `SalePrice`（来自\
  \ InvoiceLines 表）\n3.  调整表格大小使其适合数据。\n4.  在“字段”列表中，展开 Colors 表。\n5.  将 Color 字段拖到仪表板画布的空白区域。它将变成一列表格。\n\
  6.  单击“可视化”窗格中的“切片器”图标。颜色表将变为切片器。切片器图标如图 22-1 所示。\n7.  使用边角或侧边手柄根据需要调整切片器的大小。如果切片器包含许多元素，Power\
  \ BI Desktop 将添加一个垂直滚动条以指示还有更多元素可用。\n\n您可以通过列表中每个元素左侧的小方块（或可能为圆圈）来识别切片器。这样您就知道它不仅仅是一列表格。图\
  \ 22-2 显示了一个使用 Color 字段的切片器。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig2_HTML.jpg](img/370912_3_En_22_Fig2_HTML.jpg)\n\
  \n图 22-2 一个切片器\n\n**提示**\n如果切片器图标呈灰色，请确保您尝试转换为切片器的表格只有*一*列（即该视觉对象字段井的“值”框中只有一个字段）。\n\
  \n您可以为每个页面创建*多个*切片器。只需重复步骤 3 到 6 来添加切片器，但使用不同的字段作为新切片器的数据。\n\n**注意**\n切片器可以设置为一次应用于多个页面。您将在第\
  \ 24 章学习如何做到这一点。\n\n### 应用切片器\n\n要应用切片器并使用它来筛选页面上的数据，请单击切片器中的单个元素，或按住 Ctrl 键单击多个元素。\n\
  \nPower BI Desktop 页面中的所有对象都会被筛选，以反映当前选定的切片器列表。此外，切片器列表中处于活动状态（因此用于按该元素筛选数据）的每个元素现在其左侧都有一个小的矩形，表示该元素已被选中。\n\
  \n图 22-3 显示了先前定义的切片器应用于图 22-2 所示的可视化效果时发生的情况。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig3_HTML.jpg](img/370912_3_En_22_Fig3_HTML.jpg)\n\
  \n图 22-3 应用切片器\n\n当您应用切片器时，请将其视为筛选器。也就是说，如果您从一个基于 `CountryName` 字段的切片器中选择两个元素，同时从另一个基于\
  \ Color 字段的切片器中选择三个元素，那么您将强制两个切片器（筛选器）将页面中显示的所有数据限制为您选择的三种颜色中任意一种所对应的两个国家。切片器和筛选器之间的核心区别在于，切片器始终可见——并且您需要选择或取消选择元素，而不是值范围。\n\
  \n如果您进行试验，还会发现无法从源数据中的数字字段创建切片器。切片器必须基于文本字段。如果您需要基于数据范围的切片器，则需要在数据模型中准备这些范围。`CarAgeBucket`\
  \ 字段就是一个这样的例子。\n\n**提示**\n如果您按住 Ctrl 键单击切片器中所有已选定的元素，则可以取消选择它所代表的所有数据。但是，这不会清除 Power\
  \ BI Desktop 报表。取消选择所有内容与选择所有内容相同——尽管切片器中每个元素左侧的选择方块不再可见。但是，使用 Shift 键单击与单击切片器元素没有区别。\n\
  \n### 清除切片器\n\n要清除切片器并停止对视图中选定数据元素的筛选，请单击切片器右上角的“清除切片器”图标。该图标在图 22-3 中指出。\n\n由切片器应用于视图的任何筛选器现在都将被移除。您将看到切片器列表中的每个元素现在左侧都有一个小的空矩形，表示该元素未被选中。报表中的数据现在不会被筛选掉。\n\
  \n**提示**\n另一种完全清除切片器的技术是单击（或按住 Ctrl 键单击）切片器中最后一个仍在活动的元素。这会使所有元素都变为非活动状态。此外，您可以按住\
  \ Ctrl 键单击以选择所有项目。因此，实际上，移除所有切片器元素与激活所有元素效果相同。\n\n\n\n### 删除切片器\n\n要删除切片器并移除其应用于某个视图的所有筛选器，请选中该切片器并按\
  \ `Delete` 键。或者，单击鼠标指针悬停在切片器上时右上角出现的上下文菜单按钮（省略号），然后选择 `删除`。\n\n切片器应用于视图的所有筛选器以及切片器本身都会被移除。\n\
  \n如果愿意，你甚至可以复制并粘贴切片器。当你需要在不同的 Power BI Desktop 报表或报表页面之间复制切片器时，这非常有用。\n\n#### 将切片器转换为其他可视化类型\n\
  \n如果你打算在表格或图表中使用作为切片器基础的字段，则无需删除切片器并基于同一基础字段重新创建表格。你只需：\n\n1. 选中该切片器。\n2. 单击“设计”功能区中的\
  \ `表格` 按钮，然后选择要转换切片器到的表格类型（表格、矩阵或卡片）。\n\n一旦切片器变为表格，它就不再对 Power BI Desktop 报表中的数据进行子集划分。\n\
  \n### 修改切片器\n\n如果你只想将切片器中使用的字段替换为另一个字段，那么最简单的方法可能是这样做：\n\n1. 选中要修改的切片器。\n2. 将新字段拖到字段井中的现有字段上。\n\
  \n当前切片器字段会被新字段替换，并且切片器会更新以显示你添加的字段内容。或者，你也可以删除切片器并重新创建。\n\n当你开始在 Power BI Desktop\
  \ 报表中应用切片器时，你会迅速注意到 Power BI Desktop 筛选器层次结构的一个重要方面。切片器只能显示未被报表级或页面级筛选器明确排除的数据。例如，如果你在页面级别添加了一个\
  \ `Color` 筛选器，并仅在此筛选器中选择某些颜色，那么你将只能创建一个显示此颜色子集的切片器。切片器是动态的，它反映了在应用了任何报表和页面筛选器后可以显示的元素——就像任何其他可视化对象一样。因此，在筛选器中添加或移除元素会导致这些元素在基于该筛选字段的切片器中出现（或消失）。\n\
  \n如果愿意，你可以专门为切片器应用筛选器。这允许你限制切片器中显示的元素。如果你想这样做，那么你必须在前面示例的步骤 3 之后、将表格转换为切片器*之前*应用筛选器。但请注意，切片器本身*不会*给出任何正在被筛选的提示；也就是说，`筛选器`井中不会显示视觉级筛选器。\n\
  \n相反，要从切片器中移除筛选器，你需要将其切换回表格，移除筛选器，然后再切换回切片器。\n\n> **提示**\n> 当你保存包含带有活动切片器的 Power\
  \ BI Desktop 报表的 Power BI Desktop 文件时，切片器会以保存时的状态重新打开。\n\n## 日期切片器\n\n选择日期范围可以扩展切片器的外观和实用性。由于实际操作可能更容易理解这一点，我建议你尝试以下步骤：\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig4_HTML.jpg](img/370912_3_En_22_Fig4_HTML.jpg)\n\
  *图 22-4：按年份切片*\n\n1. 打开示例文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n\
  2. 在 `可视化` 窗格中，单击 `切片器` 图标。一个空的切片器将被添加到报表画布中。\n3. 展开 `DateDimension` 表，并勾选 `FullYear`\
  \ 字段（或将 `FullYear` 字段拖入新创建的切片器中）。\n4. 将左侧（下限）阈值向右拖动，直到左侧年份字段显示 `2013`。\n5. 将右侧（上限）阈值向左拖动，直到右侧年份字段显示\
  \ `2015`。切片器将如图 22-4 所示。页面中的任何数据都将被筛选，以排除此年份范围之外的数据。\n\n如果你愿意，可以直接在此类切片器的某个年份字段中输入年份。但我认为这类切片器的用处恰恰在于它能够使用滑块快速轻松地更改阈值。\n\
  \n如果你使用设置为*日期类型*的数据字段，那么切片器可以帮助你快速轻松地设置日期，但方式略有不同。操作如下：\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig5_HTML.jpg](img/370912_3_En_22_Fig5_HTML.jpg)\n\
  *图 22-5：日期切片器*\n\n1. 在 `可视化` 窗格中，单击 `切片器` 图标。一个空的切片器将被添加到报表画布中。\n2. 展开 `DateDimension`\
  \ 表，并勾选 `DateKey` 字段。\n3. 单击其中一个日期字段内部。切片器将如图 22-5 所示。\n4. 选择要设置为日期阈值的日期。\n\n为了充分利用此日历，你需要了解一些技巧：\n\
  \n- 单击上下 V 形符号可显示下个月或上个月。\n- 单击日历弹出窗口中的年份可显示年份列表。您可以从中选择所需的年份。\n- 单击日历弹出窗口中的月份可显示月份列表。您可以从中选择所需的月份。\n\
  - 您不能选择小于下限日期的上限日期。\n- 此日历*允许*您选择基础日期表中未包含的日期。然而，这可能会导致报表中出现一些意想不到的结果。\n\n> **注意**\n\
  > 日期维度中的某些字段（有时可能意味着大多数字段）被视为简单选择元素。因此，例如，在切片器中使用 `MonthFull` 字段将会产生一个月份列表，而没有滑块。最好的做法是试验\
  \ `DateDimension` 表中可用的各种字段，并使用最适合您目的的字段。\n\n## 格式化切片器\n\n切片器可以像任何其他 Power BI Desktop\
  \ 可视化对象一样进行格式化。实际上，用于格式化切片器的许多技术与您在格式化表格和矩阵时已经见过的技术完全相同。因此，为了避免无意义的重复，本节将专注于任何特定于切片器的格式属性，并且仅顺便提及您在前几章中已经学过的格式化方法。\n\
  \n### 切片器方向\n\n为了帮助您充分利用报表空间，切片器可以配置为垂直显示（如图 22-2 所示）或水平显示。要切换切片器的方向：\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig6_HTML.jpg](img/370912_3_En_22_Fig6_HTML.jpg)\n\
  *图 22-6：水平切片器*\n\n1. 选择要修改的切片器。（我选择了您之前创建的 Color 切片器。）\n2. 在 `可视化` 窗格中，单击 `格式` 图标。\n\
  3. 展开 `常规` 部分。\n4. 在 `方向` 弹出菜单中，选择 `水平`。\n5. 调整切片器大小以适合您的仪表板。水平切片器看起来类似于图 22-6 所示。\n\
  \n正如您在图 22-6 中看到的，水平切片器没有垂直切片器所具有的小复选框。因此，当选择一个水平切片器元素时，整个元素会以“反色”显示。\n\n您可能还注意到，当您调整切片器大小时，Power\
  \ BI Desktop 会更改文本行数以及文本元素的宽度。因此，强烈建议您在更改切片器高度和宽度时进行试验，以获得最适合您的效果。\n\n\n\n### 切片器响应式调整\n\
  \n在上一节中，你调整了切片器的大小，以便将所有可用选项容纳到单行中。不过，显示切片器时还有另一个可用选项，即让所有选项元素自动调整，以占满切片器中的所有可用空间。以下是这种做法的示例：\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig7_HTML.jpg](img/370912_3_En_22_Fig7_HTML.jpg)\n\
  \n图 22-7：水平切片器\n\n1.  选中要修改的切片器（我将继续使用你之前创建的“颜色”切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n\
  3.  展开“常规”部分。\n4.  将`Responsive`（响应式）按钮设置为`On`（开启）。\n5.  调整切片器大小。你将看到，只要切片器元素能全部容纳，它们就会改变以占满可用空间。此时切片器将类似于图\
  \ 22-7 所示。\n\n> **注意：** 如果切片器元素无法容纳在切片器内，你将看到一个 V 形标记，表示可以滚动查看可用元素。\n\n### 修改轮廓线\n\
  \n在 Power BI Desktop 中，轮廓线是指切片器中分隔标题与项的那条线。以下介绍如何格式化这一特定元素：\n\n1.  选中要修改的切片器（我使用了你之前基于文件\
  \ `CarSalesDataForReports.pbix` 创建的“水平颜色”切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n3.  展开“常规”部分。\n\
  4.  使用`Outline weight`（轮廓线粗细）滑块将轮廓线粗细设置为 3 磅。\n5.  单击`Outline color`（轮廓线颜色）弹出窗口并选择一种颜色。分隔线将随之变化，以反映你所做的修改。\n\
  \n### 调整选择控件\n\n如果你对 Power BI Desktop 在切片器中选择项目的方式不满意，可以调整与此特定视觉对象的交互方式。虽然 Power\
  \ BI 的默认交互模式在大多数情况下可能已足够，但了解切片器中还有其他选择元素的方式肯定没有坏处。\n\n#### 添加或删除“全选”复选框\n\n你可以按如下方式向切片器添加`Select\
  \ all`（全选）复选框：\n\n1.  选中要修改的切片器（我使用了你之前创建的原始垂直颜色切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n\
  3.  展开“选择控件”部分。\n4.  将`Select all`（全选）开关滑动到`On`（开启）位置。这将在切片器的顶部（或左侧）添加一个`Select\
  \ all`（全选）项。\n\n如果你*不*希望切片器中存在`Select all`（全选）项，只需确保在第 4 步中将`Select all`（全选）开关设置为`Off`（关闭）即可。\n\
  \n#### 启用多选\n\n切片器的默认模式是仅选择单个项目。只要`Multiselect`（多选）处于激活状态（默认即激活），这并不妨碍你在切片器中选择多个项目。如果需要激活——或停用——`Multiselect`（多选），请按以下步骤操作：\n\
  \n1.  选中要修改的切片器（我使用了你之前创建的原始垂直颜色切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n3.  展开“选择控件”部分。\n\
  4.  将`Multiselect with Ctrl`（按住 Ctrl 键多选）开关滑动到`On`（开启）位置。这将允许选择多个切片器元素。\n\n####\
  \ 启用单选\n\n切片器的默认模式是仅选择单个项目，除非用户按住`Ctrl`键并单击多个项目。如果你希望一次只添加一个项目（并逐一取消激活它们），可以启用`Single\
  \ select`（单选）来实现。只需按照以下步骤操作：\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig8_HTML.jpg](img/370912_3_En_22_Fig8_HTML.jpg)\n\
  \n图 22-8：更改切片器的选择控件\n\n1.  选中要修改的切片器（我使用了你之前创建的原始垂直颜色切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n\
  3.  展开“选择控件”部分。\n4.  将`Single select`（单选）开关滑动到`On`（开启）位置。这将把切片器交互设置为单选模式。你可以在图 22-8\
  \ 中看到此操作的结果，其中切片器的复选框已变为单选按钮。\n\n> **注意：** 将`Single select`（单选）设置为`On`（开启）会使`Multiselect`（多选）和`Select\
  \ all`（全选）选项从“格式”窗格中消失。\n\n### 设置切片器的精确尺寸及 X、Y 坐标\n\n如果你希望将切片器精确地放置在仪表板画布上，则可以设置切片器的`X`和`Y`（水平和垂直）坐标。你也可以指定其精确的高度和宽度。具体操作方法如下：\n\
  \n1.  选中要修改的切片器。\n2.  在“可视化”窗格中，单击“格式”图标。\n3.  展开“常规”部分。\n4.  将`X Position`（X 位置）、`Y\
  \ Position`（Y 位置）、`Width`（宽度）和`Height`（高度）的值替换为你希望应用的、定义切片器大小和位置的像素值。\n\n### 格式化切片器标题\n\
  \n如果你想为切片器增添一些视觉上的吸引力，可以调整切片器标题的显示效果。这可以作为对用户有用的视觉提示，帮助他们将切片器与其他视觉对象区分开来。以下是一个操作示例：\n\
  \n1.  选中要修改的切片器（我使用了你之前创建的水平颜色切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n3.  展开“切片器标题”部分。\n\
  4.  确保`Header`（标题）开关处于`On`（开启）位置。\n5.  单击`Font color`（字体颜色）弹出窗口，为标题文本选择一种颜色。\n6.\
  \  单击`Background color`（背景颜色）弹出窗口，为标题背景选择一种颜色。\n7.  调整`Text size`（文本大小）以微调标题文本的尺寸。\n\
  \n### 格式化切片器项\n\n切片器项是构成切片器中数据列表的单个元素，这些元素基于基础字段。同样，也可以对它们进行格式化，以吸引读者的注意力。示例如下：\n\
  \n1.  选中要修改的切片器（继续使用上一节中使用的颜色切片器）。\n2.  在“可视化”窗格中，单击“格式”图标。\n3.  展开“项”部分。\n4.  单击`Font\
  \ color`（字体颜色）弹出窗口，为项目文本选择一种颜色。\n5.  单击`Background color`（背景颜色）弹出窗口，为每个项目的背景选择一种颜色。\n\
  6.  调整项目的`Text size`（文本大小）。\n7.  单击`Outline`（轮廓）弹出窗口，选择`Frame`（框架）。\n\n你还可以格式化切片器的以下方面：\n\
  \n-   背景\n-   标题\n-   锁定纵横比\n\n不过，由于所有这些都与适用于表格和图表的格式化属性相同（并且你已在之前章节中看到过），因此我将不再重复描述。\n\
  \n最后，图 22-9 向你展示了一个应用了你刚才看到的许多格式化选项的切片器。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig9_HTML.jpg](img/370912_3_En_22_Fig9_HTML.jpg)\n\
  \n图 22-9：格式化后的切片器\n\n### 对切片器元素进行排序\n\n切片器中的元素默认按字母顺序显示。如果你愿意，可以颠倒此排序顺序，具体操作如下：\n\
  \n1.  单击切片器右上角的省略号。\n2.  选择`Sort by color`（按颜色排序）（或任何字段名称）。\n\n此时切片器元素将按字母逆序显示。\n\
  \n> **提示：** 你可以为希望以其他排序顺序显示的任何数据字段添加`Sort by column`（按列排序）。\n\n\n\n### 切换为下拉切片器\n\
  \n`切片器`非常有用，但有一个缺点：它们会占用大量宝贵的屏幕空间。因此，微软开发团队提出了一种优雅的解决方案，即使用下拉切片器。在这种模式下，切片器元素仅在点击弹出菜单时才会显示。\n\
  \n将现有切片器转换为下拉切片器：\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig10_HTML.jpg](img/370912_3_En_22_Fig10_HTML.jpg)\n\
  \n图 22-10 — 切换为下拉切片器\n\n1. 选择一个现有的切片器（或将鼠标指针悬停在它上面）。我将使用本章中一直使用的颜色切片器。\n2. 点击右上角“清除选择”图标旁边的\
  \ V 形符号。将出现一个弹出菜单，如图 22-10 所示。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig11_HTML.jpg](img/370912_3_En_22_Fig11_HTML.jpg)\n\
  \n图 22-11 — 一个下拉切片器\n\n3. 选择 `下拉`。切片器将转换为下拉切片器。图 22-11 显示了它现在的样子。\n4. 点击切片器弹出列表的\
  \ V 形符号，选择要据此切片数据的元素。\n\n> **提示**  \n> 在为手机设计 Power BI 报表时，下拉切片器尤其有用。\n\n### 导出切片器数据\n\
  \n切片器数据可以像任何其他视觉对象中的数据一样导出：\n\n1. 点击切片器右上角的省略号。\n2. 选择 `导出数据`。\n3. 浏览到所需目录并输入文件名。\n\
  4. 点击 `保存`。\n\n## 使用图表作为切片器\n\n您已经了解了表格如何成为切片器（一种筛选器）。实际上，图表也可以用作切片器。了解图表如何影响 Power\
  \ BI Desktop 报表中的数据，甚至可能影响您创建的图表类型，或您决定使用图表而非标准切片器来筛选数据。图表可以作为吸引和保持观众注意力的绝佳工具——在您看到它们能产生的效果后，我相信您也会同意这一点。\n\
  \n### 图表作为切片器（交叉筛选）\n\n首先，让我们看看图表如何充当切片器，来为 Power BI Desktop 报表中的任何一个或所有可视化对象交互式地筛选数据。此技术也称为*交叉筛选*。最初，我们假设目标是使用两个对象生成一个报表：\n\
  \n- 一个按颜色显示“成本加备件”的表格\n- 一个按制造商显示“备件”的柱形图\n\n让我们创建一个 `按颜色净毛利` 的表格。它主要用于展示在 Power\
  \ BI Desktop 报表中将图表用作切片器对其他对象产生的影响。作为额外练习，您还将向页面应用一个筛选器，以演示筛选器和切片器如何协同工作，如下所述。\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig12_HTML.jpg](img/370912_3_En_22_Fig12_HTML.jpg)\n\
  \n图 22-12 — 准备将图表用作切片器\n\n1. 打开 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`\
  \ 文件，并添加一个新的空白页。为此示例，您需要一个完全没有杂乱元素的仪表板页面。\n2. 添加一个基于以下字段的表格：\n   1. `颜色`（来自“颜色”表）\n\
  \   2. `成本加备件`（来自“发票行”表）\n3. 添加一个基于以下字段的条形图：\n   1. `制造商`（来自“库存”表）\n   2. `备件`（也来自“库存”表）\n\
  4. 调整两个可视化对象的布局，使其看起来类似于图 22-12。\n\n要了解如何使用图表作为切片器，请点击按制造商分组的备件成本图表中的任意柱形。在此示例中，我将选择\
  \ `捷豹`。\n\nPower BI Desktop 报表看起来将类似于图 22-13。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig13_HTML.jpg](img/370912_3_En_22_Fig13_HTML.jpg)\n\
  \n图 22-13 — 使用图表切片数据\n\n您会看到，不仅所选制造商在图表中被突出显示（其他制造商的条形图变暗），而且表格中的数据也会发生变化。它们也仅显示所选制造商的“成本加备件”（按每种颜色）。\n\
  \n要对另一个制造商进行切片，只需点击柱形图中对应的柱形即可。要取消图表作为切片器的效果，您只需*再次*点击已突出显示的柱形。\n\n任何条形图、饼图或柱形图都可以像这样充当切片器，漏斗图、树状图、散点图、气泡图和地图也是如此。核心因素是，要实现简单的切片效果，您需要使用仅包含一个轴的图表；也就是说，源数据中只有一个轴，没有颜色或图例。接下来将解释当您使用更复杂的图表进行切片、筛选和突出显示数据时会发生什么。\n\
  \n> **提示**  \n> 完全可以像在切片器中选择多个元素一样，在图表中选择多个柱形来突出显示数据。只需按住 `Ctrl` 键并点击即可选择多个项目。\n\
  \n## 突出显示图表数据\n\n到目前为止，我们已经看到图表如何成为仪表板页面中所有可视化对象的切片器。但是，您还可以利用 Power BI Desktop\
  \ 交互性的另一个方面，在展示发现时使图表中的数据系列更加突出。数据呈现的这个特定方面被称为*突出显示*。\n\n同样，通过一个实际示例可能最能理解突出显示。首先，我们将创建一个按\
  \ `国家名称` 分组的零件和人工成本堆叠条形图；然后，我们将使用它来突出显示图表中的各项成本。\n\n1. 在一个空白的 Power BI Desktop 报表中（以免分心），创建一个基于以下字段的簇状柱形图：\n\
  \   1. `国家名称`（来自“国家”表）\n   2. `备件`（来自“库存”表）\n   3. `人工成本`（来自“库存”表）\n2. 点击*图例*中的\
  \ `备件`。每个国家/地区的柱形中，所有销售成本都会被突出显示（即保持原始颜色），而其他成本则会变灰。\n\n应用突出显示后，图表将如图 22-14 所示。\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig14_HTML.jpg](img/370912_3_En_22_Fig14_HTML.jpg)\n\
  \n图 22-14 — 在图表内突出显示数据\n\n要移除突出显示，您只需再次点击图例中的同一元素。或者，您也可以点击另一个图例元素来突出显示可视化对象的其他方面。另一种移除突出显示的方法是点击图表内部，但不要点击任何数据元素。\n\
  \n以这种方式突出显示数据应适用于任何类型的条形图或柱形图，以及折线图。对于同时向“轴”和“图例”框添加了数据的饼图，这也很有用，因为这意味着图表中有多个元素，就像条形图、柱形图和折线图一样。您可能会发现它在散点图中用处不大。\n\
  \n\n\n## 跨图表突出显示\n\n`跨图表突出显示`为图表的突出显示和筛选功能增添了有趣的额外维度。若将一个图表用作筛选器，另一个图表会随之更新，以反映应用此新筛选器的效果：不仅会排除被筛选掉的所有元素（扇形区、条形或柱形），还会显示被筛选器排除的数据所占的比例。\n\
  \n举例来说，使用文件 `CarSalesDataForReports.pbix` 创建一个按颜色划分的成本价饼图和一个按车辆类型划分的直接成本柱形图。然后，我们对这两个图表进行交叉筛选，并查看结果。具体步骤如下：\n\
  \n1.  使用以下字段创建一个饼图：\n    1.  `Color`（来自“Colors”表）\n    2.  `CostPrice`（来自“Stock”表）\n\
  \n2.  使用以下字段创建一个（簇状）柱形图：\n    1.  `Vehicle`（来自“Stock”表）\n    2.  `CostPrice`（来自“Stock”表）\n\
  \n    对于如此简单的图表，一旦源表被转换为图表，Power BI Desktop 会自动将这些字段归入“字段”列表中正确的框中。结果如图 22-15 所示。\n\
  \n    ![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig15_HTML.jpg](img/370912_3_En_22_Fig15_HTML.jpg)\n\
  \n    **图 22-15：** 准备用于跨图表突出显示的图表\n\n    ![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig16_HTML.jpg](img/370912_3_En_22_Fig16_HTML.jpg)\n\
  \n    **图 22-16：** 跨图表突出显示\n\n3.  现在，单击饼图中的一个扇形区（我选择了“红色”）。您应该会看到图 22-16 所示的结果。饼图中所有其他扇区不仅变暗了，而且柱形图中的柱体也已被突出显示，以显示所选颜色在每辆车成本总销售额中所占的比例。\n\
  \n    ![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig17_HTML.jpg](img/370912_3_En_22_Fig17_HTML.jpg)\n\
  \n    **图 22-17：** 应用于饼图的跨图表突出显示\n\n4.  现在，单击柱形图中代表“Aston Martin DB9”的柱体。此时您正将柱形图用作一个切片器。如图\
  \ 22-17 所示，饼图显示了每种颜色的“Aston Martin DB9”销售额所占的比例。\n\n> **注意：** 当您使用筛选器时，并非只是突出显示图表，而是实际筛选了提供给图表的数据；因此，您会从图表中移除元素。而突出显示则会在图表中保留元素，但会强调数据中相对于其他部分的某些方面。\n\
  \n### 在气泡图中突出显示数据\n\n在设计可视化项时，其主要目标归根结底是帮助您穿透数据迷雾，抵达理解、利润或任何分析焦点的阳光高地。但您可能会常感到“只见树木，不见森林”。这正是\
  \ Power BI Desktop 在图表可视化中突出显示数据的能力能够如此有效之处。\n\n让我们以一个包含大量信息的可视化项为例：本例中是一个车辆类型的气泡图。确实，在此示例中，观众可能会认为数据太多，以至于难以看清特定品牌汽车的气泡，从而无法按品牌分析销售额数据的独特性。Power\
  \ BI Desktop 提供了一种在此类图表中隔离数据系列的方法。要实际查看此功能并让细节更清晰，您需要按以下步骤操作：\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig18_HTML.jpg](img/370912_3_En_22_Fig18_HTML.jpg)\n\
  \n**图 22-18：** 在气泡图中突出显示数据\n\n1.  使用文件 `CarSalesDataForReports.pbix`（请记住，这实际上是一个散点图）创建气泡图，使用以下元素：\n\
  \    -   *X 轴*：`Average Parts Cost Ratio`（来自“Stock”表）\n    -   *Y 轴*：`SalePrice`（来自“InvoiceLines”表）\n\
  \    -   *大小*：`Gross Margin`（来自“InvoiceLines”表）\n    -   *详细信息*：`Color`（来自“Colors”表）\n\
  \    -   *图例*：`VehicleType`（来自“Stock”表）\n\n2.  在图表的图例中，单击一个车辆类型。在本例中，我使用了“saloon”（英式英语，指轿车）。该车辆类型的数据在图表中被突出显示，而所有其他车辆类型的数据则变暗，从而使一组信息脱颖而出。如图\
  \ 22-18 所示。\n\n此技术需要注意以下几点：\n\n-   要突出显示另一组数据，只需在图例中单击另一个元素。\n-   要恢复显示所有数据，请再次单击图例中已选中的元素。\n\
  -   如上所述，以这种方式突出显示数据也会筛选整个页面上的数据。\n\n> **提示：** 您可以为图表添加向下钻取功能，并且仍可像平常一样使用图表突出显示功能，前提是您已按照第\
  \ 16 章所述，禁用了通过图表元素进行的向下钻取。在这种情况下，您必须使用“钻取”图标来向下（以及向上）钻取。该图表会在钻取层级或子层级突出显示某个元素，同时将筛选应用于\
  \ Power BI Desktop 报表。\n\n\n\n## 图表作为复杂切片器\n\n你已经了解了如何将图表用作切片器，现在让我们更进一步，看看如何将它们用作更复杂的切片元素。为了说明这一点，我将基于前面示例中展示的原理，添加一个气泡图，它能同时基于两个维度对数据进行切片。\n\
  \n请按照以下步骤进行此示例操作：\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig19_HTML.jpg](img/370912_3_En_22_Fig19_HTML.jpg)\n\
  \n图 22-19  \n使用图表进行高亮显示和筛选\n\n1. 创建一个包含以下内容的 Power BI Desktop 报表：\n   1. 一个以 `SalePrice`\
  \ 为值，`CountryName` 和 `Color` 为行列的矩阵\n   2. 一个以 `Cost Plus Spares Margin`（来自 `Stock`\
  \ 表）为值，`Make`（来自 `Stock` 表）为轴的簇状柱形图\n2. 使用以下数据创建一个气泡图：\n   1. *X 轴*：`SalePrice`（来自\
  \ `InvoiceLines` 表）\n   2. *Y 轴*：`SpareParts`（来自 `Stock` 表）\n   3. *大小*：`Weeks In\
  \ Stock`（来自 `Stock` 表）\n   4. *详细信息*：`CountryName`（来自 `Countries` 表）\n   5. *图例*：`Color`（来自\
  \ `Colors` 表）\n3. 调整气泡图的大小和样式，使其显示在现有的柱形图和表格下方。\n4. 单击气泡图中最右侧顶部气泡旁边的气泡。此时 Power\
  \ BI Desktop 报表应如图 22-19 所示。工具提示会指示哪个气泡被用于筛选其他视觉对象。\n\n你可以看到其他可视化对象已被筛选，构成单个气泡的两个元素（`CountryName`\
  \ 和 `Color`）都作为筛选器（如果你愿意，也可以称之为双重切片器）生效。这意味着：\n\n- 表格仅显示该国家/地区且该颜色有销售额的颜色数据。\n-\
  \ 图表仅高亮显示该国家/地区和该颜色的数据。\n\n与简单的图表切片器一样，你只需再次单击选中的气泡即可取消筛选效果。或者，通过单击气泡图中的另一个气泡来切换筛选条件。你还会看到图表本身的数据已被高亮显示，但这一点稍后会进一步说明。\n\
  \n显然，你无需在报表的所有可视化对象中都显示你正在筛选和高亮显示的字段。我在此示例中这样做是为了让结果更清晰。在实际应用中，报表中的所有其他可视化对象都将根据气泡图中\
  \ `详细信息` 和 `图例` 框中的元素进行筛选。\n\n然而，气泡图并非唯一允许同时应用两个筛选器的图表类型。所有显示多个字段的图表类型都支持此功能。不过，我认为某些图表比其他图表更适合这种特定技术。具体来说，我并不认为折线图总是适合用作\
  \ Power BI Desktop 报表的筛选器。散点图如果使用交叉筛选，可能（在视觉上）会有效果，但也同样可能无效。堆叠条形图和堆叠柱形图则非常适合用于交叉筛选，你将在以下部分看到这一点。\n\
  \n### 将柱形图和条形图用作筛选器\n\n柱形图和条形图也可用于同时基于两个元素筛选 Power BI Desktop 报表。唯一的限制是图表的值只能包含一组数值数据。如果条形图或柱形图是堆叠图，则可以单击堆叠条中的任意部分。此外，如果图表是簇状条形图或柱形图，则可以单击一组中的任意柱形，以基于该部分所代表的元素进行切片。\n\
  \n如果这个限制不成问题，那么你可以按照以下步骤使用条形图或柱形图（无论是簇状、堆叠还是 100% 堆叠）为报表应用双重筛选器：\n\n1. 使用 `C:\\\
  PowerBiDesktopSamples\\CarSalesDataForReports.pbix` 文件创建一个包含以下两个元素的 Power BI Desktop\
  \ 仪表板：\n   1. 一个基于 `Color` 和 `CountryName`（作为行）、`SalesPrice`、`Gross Margin` 和 `CostPrice`（作为值）的矩阵。创建矩阵后，单击层次结构中的“向下展开一级”图标以查看所有层级的数据。\n\
  \   2. 一个以 `SalesPrice` 为值，`CountryName` 为轴的簇状条形图。\n2. 然后使用以下数据创建一个堆叠柱形图：\n   1.\
  \ *值*：`Gross Margin`（来自 `InvoiceLines` 表）\n   2. *轴*：`CountryName`（来自 `Countries`\
  \ 表）\n   3. *图例*：`VehicleAgeCategory`（来自 `Stock` 表）\n\n调整图表外观后，最终结果应如图 22-20 所示。\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig20_HTML.jpg](img/370912_3_En_22_Fig20_HTML.jpg)\n\
  \n图 22-20  \n一个为基于图表的筛选和高亮显示做好准备的报表\n\n单击柱形的任意段会筛选并高亮显示同一报表中针对该国家/地区和车龄范围的其他可视化对象。图\
  \ 22-21 给出了一个示例，其中为美国柱形选择了 11-20 的车龄范围。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig21_HTML.jpg](img/370912_3_En_22_Fig21_HTML.jpg)\n\
  \n图 22-21  \n应用筛选器并高亮显示\n\n单击图例中的任意车龄范围将仅按车龄范围进行筛选。你在图 22-22 中可以看到这一点，其中已选择了图例中的\
  \ 12-15 项。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig22_HTML.jpg](img/370912_3_En_22_Fig22_HTML.jpg)\n\
  \n图 22-22  \n使用图例元素进行筛选\n\n因此，实际上，您可以根据是将图表还是图例用作筛选源，来选择是筛选单个元素还是多个元素。\n\n**注意：**\
  \ 仅单击数据点时，折线图不会产生相同的效果。如果单击折线图中的系列，你是在高亮显示该系列，该系列是数值数据，因此不能用作切片器。同样，如果在柱形图或条形图的图例中单击一个元素，你是在选择一个数据系列，这也不能用作切片器（即使它会在图表中高亮显示该系列）。\n\
  \n\n\n## 指定视觉交互\n\n在前几节中，您已经看到，在切片器中选择一个或多个项目的影响会自动应用于页面上的每个视觉对象，使用图表作为切片器的效果也是如此。这的确是\
  \ Power BI Desktop 的默认行为，除非您特别将某个视觉对象配置为 *不* 对页面上图表或切片器的选中项目做出反应。\n\n实际上，这意味着您可以实现在仪表盘中达到非常高层次的精细度，因为您可以定义哪些视觉对象保持交互性——以及当使用切片器、图表或多个切片器和图表时，哪些视觉对象不得改变。\n\
  \n以下内容说明如何更改默认设置并移除视觉对象的交互性。您需要知道，报表中至少需要有两个视觉对象才能进行此修改。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig23_HTML.jpg](img/370912_3_En_22_Fig23_HTML.jpg)\n\
  \n**图 22-23** 视觉对象的交互图标\n\n1.  选择您希望阻止其对其他视觉对象产生突出显示效果的视觉对象（例如，可以是文本视觉对象、图表视觉对象或切片器）。\n\
  2.  在“格式”功能区中，点击`编辑交互`按钮。页面上所有其他视觉对象将显示您在图 22-23 中看到的交互图标（图表中的漏斗和“禁止进入”标志）。\n\n\
  ![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig24_HTML.jpg](img/370912_3_En_22_Fig24_HTML.jpg)\n\
  \n**图 22-24** 设置为阻止交互的视觉交互图标\n\n3.  在另一个可视化对象中点击`停止交互`图标（“禁止进入”标志）。我使用了您之前创建的按国家划分的销售表格。此图标将显示为填充状态，如图\
  \ 22-24 所示。\n4.  对于所有您希望与所选视觉对象“断开连接”的视觉对象，重复步骤 2 和 3。\n5.  在“开始”功能区中，点击`编辑交互`按钮以停止视觉交互的配置。这将保留现有的交互设置，但阻止交互图标的显示。\n\
  \n然后，您可以遍历页面上的所有图表和切片器，以设置它们对另一个元素的依赖关系。\n\n> **注意：** 切片器也可以链接到页面上的另一个切片器或依赖于它。因此，您可以像设置任何其他视觉对象一样设置切片器的交互。\n\
  \n## 假设分析切片器\n\nPower BI Desktop 中一个非常有趣（且相对较新）的功能是使用假设分析切片器与数据进行交互。这允许您定义变量值，然后将其应用于数据模型中您选择的任何字段。然后，您可以在屏幕上的滑块中调整假设分析值，并实时观察计算值的变化。\n\
  \n如果您亲自尝试，就能最好地理解此功能。以下是假设分析切片器的一个示例。假设您希望使用文件 `CarSalesDataForReports.pbix` 查看如果供应商提高备件成本，毛利率会发生什么变化。\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig25_HTML.jpg](img/370912_3_En_22_Fig25_HTML.jpg)\n\
  \n**图 22-25** 假设分析参数对话框\n\n1.  在“建模”功能区中，点击`新建参数`按钮。\n2.  在`名称`框中输入 `SparePartsVariation`。\n\
  3.  从`数据类型`弹出列表中选择`十进制数`作为数据类型。\n4.  将最小值保留为 0，并将最大值输入为 `0.5`（50%）。\n5.  将增量设置为\
  \ `0.02`（2%）。对话框将类似于图 22-25 所示。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig26_HTML.jpg](img/370912_3_En_22_Fig26_HTML.jpg)\n\
  \n**图 22-26** 一个假设分析切片器\n\n6.  点击`确定`。Power BI Desktop 将向数据模型添加一个名为 `SparePartsVariation`\
  \ 的新表，并向桌面画布添加一个切片器。调整切片器大小后，您可以在图 22-26 中看到这些内容以及新表中的数据（来自数据视图）。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig27_HTML.jpg](img/370912_3_En_22_Fig27_HTML.jpg)\n\
  \n**图 22-27** 应用于图表的假设分析切片器\n\n7.  点击字段列表中的 `Stock` 表，然后点击“开始”或“建模”功能区中的`新建度量值`。\n\
  8.  在公式栏中输入以下公式（这将使用假设分析切片器中的乘数来计算新的备件成本）：\n\n    ```\n    SparePartsNew = SUM(Stock[SpareParts])\
  \ + (SUM(Stock[SpareParts]) * 'SparePartsVariation'[SparePartsVariation Value])\n\
  \    ```\n\n9.  点击公式栏上的复选框以确认新列的创建。如果您选择 `SparePartsVariation` 表，则可以在数据视图中看到此列。\n\
  10. 使用以下字段创建一个簇状柱形图：\n    -   `Make`（来自 `Stock` 表）\n    -   `SpareParts`（来自 `Stock`\
  \ 表）\n    -   `SparePartsNew`（来自 `SparePartsVariation` 表）\n11. 调整滑块以应用备件成本的新增长百分比。生成的图表和切片器将类似于图\
  \ 22-27 中的样子（我已将 `SparePartsVariation` 格式化为以百分比显示）。\n\n您在假设分析切片器基础表中添加的值可以是固定值、百分比——任何您喜欢的内容。此外，您可以根据假设分析值创建任意数量的新度量值。\n\
  \n> **注意：** 您在步骤 8 中输入的内容是一小段 DAX 代码。不幸的是，本书的范围不包括介绍 DAX。\n\n## 用作切片器的自定义视觉对象\n\n\
  有许多优秀的第三方视觉对象可用作切片器。本节为您提供一些目前可用的第三方切片器的要点。这些只是您可以找到的一小部分切片器。我再次将选择范围限制为由 Microsoft\
  \ 开发的第三方视觉对象。\n\n以下各节中解释的所有第三方切片器都可以使用您在第十九章中看到的技术添加到 Power BI Desktop 文件中。\n\n\
  ## 时间线切片器\n\n时间线切片器允许您拖动日期范围的上限和下限。您还可以定义要交互使用的日期元素（年、季度、月、周或日）。您可以在图 22-28 中看到这一点，其中的时间线切片器正在使用\
  \ `DateDimension` 表中的 `DateKey` 字段。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig28_HTML.jpg](img/370912_3_En_22_Fig28_HTML.jpg)\n\
  \n**图 22-28** 时间线切片器\n\n时间线切片器允许您指定：\n\n-   您希望从时间层次结构中显示的详细程度（年级别、季度级别、月级别、周级别或日级别）\n\
  -   您通过左右拖动数据范围端点指定的可视数据范围\n\n### 时间刷切片器\n\n时间刷切片器允许您突出显示按时间排序的数据集的一个部分。您可以在图 22-29\
  \ 中看到这一点，选择时间范围已经过滤了表格。这种方法允许您“聚焦”于切片器中表达的潜在有趣数据，并查看在其他视觉对象中显示的详细信息。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig29_HTML.jpg](img/370912_3_En_22_Fig29_HTML.jpg)\n\
  \n**图 22-29** 时间刷切片器\n\n\n\n### 切片器（Chiclet Slicer）\n\n`切片器（Chiclet Slicer）`是一种可以以多种方式排列和格式化的切片器。图\
  \ 22-30 展示了一个简单示例。\n\n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig30_HTML.jpg](img/370912_3_En_22_Fig30_HTML.jpg)\n\
  \n*图 22-30 切片器*\n\n这种特殊的切片器确实提供了丰富的选项。我强烈建议您查看其所有功能。为了吊起您的胃口，值得注意的一点是，您可以：\n\n-\
  \ 指定已选和未选元素的颜色\n- 定义元素的标准高度和宽度\n- 为元素添加图像\n\n### 文本筛选器（Text Filter）\n\n`文本筛选器（Text\
  \ Filter）`是一种切片器，它允许您输入文本——该文本不必是完整单词，甚至不必匹配字段中的任何完整单词——以交互方式筛选文本。您可以在图 22-31 中看到文本筛选器及其应用结果（通过点击放大镜图标）。\n\
  \n![../images/370912_3_En_22_Chapter/370912_3_En_22_Fig31_HTML.jpg](img/370912_3_En_22_Fig31_HTML.jpg)\n\
  \n*图 22-31 运行中的文本筛选器*\n\n## 选择正确的交互式数据选择方法\n\n既然您已经了解了 Power BI Desktop 提供的交互式选项，那么值得记住的是，切片器和图表筛选器之间存在一个根本区别：\n\
  \n- 除非您调整了所选切片器与其应（或不应）影响的视觉对象之间的视觉交互，否则切片器和图表筛选器将应用于 Power BI Desktop 页面上的所有视觉对象。\n\
  - 高亮仅适用于所选图表，但它会筛选其他表中的数据，并高亮该元素在其他图表中的百分比。\n\n## 本章小结\n\n在本章中，您学习了如何利用 Power BI\
  \ Desktop 的交互潜力来增强向受众传递信息的效果。您了解了如何向报表添加切片器，以及如何使用它们从包含的可视化效果中筛选数据。接着，您学习了如何在图表中高亮数据。然后，您了解了如何将图表用作交互式切片器，以隔离演示文稿中的特定元素。\n\
  \n之后，您学习了如何控制切片器与页面上其他视觉对象的交互方式，以及如何应用假设分析切片器。最后，您简要了解了一些可用的第三方切片器。\n\n这些技术是强大的工具，能够显著增强您向受众呈现数据的方式。谨慎使用它们，将有助于您的仪表板变得更强大，甚至更令人印象深刻。因此，剩下的就是您开始使用自己的数据应用这些技术。然后，您就可以见证如何利用\
  \ Power BI Desktop 的所有交互可能性给您的受众留下深刻印象。\n\n"
- "# 23. 增强仪表板\n\n在使用 Power BI Desktop 一段时间后，我可以假设您已经分析过数据了。事实上，我想您已经能够从对数据的深入挖掘中梳理出一些极其有趣的趋势和揭示性的事实——并且您已经创建了表格、图表、地图和仪表来证明您的观点。为了完成工作，您现在希望为作品的外观和感觉添加最终的润色，使其在受众面前显得精致且专业。\n\
  \n幸运的是，Power BI Desktop 也能帮助您完成所有这些最后的润色。它可以将您的成果提升到更高的演示水平——无需您成为图形设计师——从而吸引您的受众。只需点击几下，您就可以：\n\
  \n- 在报表画布上对齐和分布对象\n- 添加自由格式文本\n- 向报表添加图像\n- 应用报表背景\n- 添加基本形状以增强视觉效果\n- 叠加对象并定义它们如何一层层放置\n\
  - 为智能手机使用准备报表\n- 应用预定义主题（或样式表）来标准化报表的呈现\n\n因此，虽然无法与昂贵的绘图应用程序相媲美，但 Power BI Desktop\
  \ 确实能够添加必要的设计点缀，帮助您抓住受众的注意力，并说服他们相信您分析的价值。此外，您现在可以使用 Power BI 样式表将企业标准的演示风格应用于所有仪表板。\n\
  \n本章将带您了解这些不同的技术，并解释如何通过增强仪表板的呈现来为您的分析添加最后润色。我们将使用 `C:\\PowerBiDesktopSamples\\\
  CarSalesDataForReports.pbix` 文件作为源数据，并作为本章所有仪表板的示例。您还需要按照附录 A 中的说明，从 Apress 网站将图像文件下载到\
  \ `C:\\PowerBiDesktopSamples\\Images` 文件夹。\n\n## 格式化功能区\n\n在增强仪表板时，您将需要使用另外三个功能区：\n\
  \n- `视图（View）`功能区\n- `插入（Insert）`功能区\n- `格式（Format）`功能区\n\n以下各节将介绍这三个功能区。\n\n###\
  \ 视图功能区\n\n视图功能区的选项如图 23-1 所示，并在表 23-1 中说明。\n\n*表 23-1 视图功能区选项*\n\n| 选项 | 说明 |\n\
  | --- | --- |\n| `主题（Themes）` | 允许您选择要应用于整个仪表板的主题。 |\n| `手机布局（Phone layout）` | 在桌面布局和手机布局之间切换。\
  \ |\n| `页面视图：适应页面（Page view: fit to page）` | 缩放显示以适应当前屏幕尺寸。 |\n| `页面视图：适应宽度（Page\
  \ view: fit to width）` | 缩放显示以适应屏幕宽度。 |\n| `页面视图：实际大小（Page view: actual size）` |\
  \ 以实际大小显示页面。 |\n| `显示或隐藏网格线（Show or hide gridlines）` | 显示或隐藏底层网格。 |\n| `将对象与网格对齐（Snap\
  \ objects to grid）` | 强制视觉对象与网格对齐（无论网格是隐藏还是可见），或让它们自由浮动。 |\n| `锁定对象（Lock objects）`\
  \ | 固定所有对象的位置，并阻止它们被调整大小或移动。 |\n| `书签窗格（Bookmarks pane）` | 显示或隐藏“书签”窗格。您将在下一章中了解它。\
  \ |\n| `选择窗格（Selection pane）` | 显示或隐藏“选择”窗格。您将在下一章中了解它。 |\n| `同步切片器（Sync slicers）`\
  \ | 显示或隐藏“同步切片器”窗格。这允许您启用切片器以在您选择的页面上筛选数据。 |\n| `性能分析器（Performance analyzer）` |\
  \ 显示或隐藏 Power BI Desktop 性能分析器。此工具可以帮助您监控报表中每个视觉对象查询数据和呈现结果所花费的时间。 |\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig1_HTML.jpg](img/370912_3_En_23_Fig1_HTML.jpg)\n\
  \n*图 23-1 视图功能区*\n\n### 插入功能区\n\n插入功能区的选项如图 23-2 所示，并在表 23-2 中说明。\n\n*表 23-2 插入功能区选项*\n\
  \n| 选项 | 说明 |\n| --- | --- |\n| `新视觉对象（New visual）` | 在当前页面中插入一个新的空白视觉对象。 |\n| `更多视觉对象（More\
  \ visuals）` | 允许您从磁盘或应用商店添加第三方视觉对象。 |\n| `新页面（New page）` | 允许您复制当前页面或在现有页面之后插入一个空白页面。\
  \ |\n| `文本框（Text box）` | 在当前页面中插入一个空的文本框。 |\n| `询问数据（Ask your data）` | 允许您使用自然语言对数据提问。\
  \ |\n| `按钮（Buttons）` | 向当前页面添加一个按钮。 |\n| `形状（Shapes）` | 向当前页面添加一个形状。 |\n| `图像（Image）`\
  \ | 向当前页面添加一个图像。 |\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig2_HTML.jpg](img/370912_3_En_23_Fig2_HTML.jpg)\n\
  \n*图 23-2 插入功能区*\n\n\n\n### 格式功能区\n\n格式功能区选项如图 23-3 所示，并在表 23-3 中加以说明。\n\n**表 23-3**\
  \ 格式功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 编辑交互 | 更改当选中其他视觉对象中的数据点时，视觉对象如何响应。 |\n\
  | 向下钻取应用于 | 允许向下钻取以筛选其他视觉对象中的数据。 |\n| 上移一层 | 将视觉对象移至对象图层的顶层附近。 |\n| 下移一层 | 将视觉对象移至对象图层的底层附近。\
  \ |\n| 选择 | 显示`Selection`窗格，该窗格允许您显示和隐藏（以及设置其选项卡顺序）页面上的所有视觉对象。 |\n| 对齐对象 | 对齐并分布选中的视觉对象。\
  \ |\n| 组合 | 将选中的视觉对象组合在一起。 |\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig3_HTML.jpg](img/370912_3_En_23_Fig3_HTML.jpg)\n\
  \n*图 23-3* 格式功能区\n\n## 设置页面格式\n\n在您投入一定时间和精力最终确定演示文稿之前，定义输出的一个基本方面——页面格式至关重要。Power\
  \ BI Desktop 让您可以从以下输出设备格式中进行选择：\n\n* 16:9\n* 4:3\n* 信纸\n* 工具提示\n* 自定义\n\n要更改页面大小，请遵循以下步骤：\n\
  \n1. 单击报表画布上的任意位置（*而非*视觉对象上）。\n2. 在 `Visualizations` 窗格中，单击 `Format` 图标。\n3. 展开\
  \ `Page size` 部分。\n4. 从 `Type` 弹出列表中选择一个页面大小预设——或者选择 `Custom` 并以像素为单位输入高度和宽度。\n\n\
  如果您希望指定自己的页面大小，只需从 `Type` 弹出列表中选择 `Custom`，然后以像素为单位输入所需的页面高度或宽度。如果愿意，您也可以使用滚动箭头来设置所需的数值。您可以在图\
  \ 23-4 中看到此操作的效果。\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig4_HTML.jpg](img/370912_3_En_23_Fig4_HTML.jpg)\n\
  \n*图 23-4* 自定义页面大小设置\n\n> **注意**：当前，唯一可用的度量单位是像素。\n\n## 对齐和分布视觉对象\n\n有一个快速简单的调整方法能够为任何仪表盘增添精致的外观。这个简单的决定就是完美地对齐视觉对象，以避免给人留下位置参差不齐的印象。无论您是否喜欢，良好对齐的视觉对象会有助于说服您的受众，让他们认为您的分析是有效的。\n\
  \n需要说明的是，当我说*对齐视觉对象*时，这个概念中也包含了分布视觉对象。因此，以下是如何运用这两种技术为您的仪表盘增添专业气息的方法。\n\n## 对齐视觉对象\n\
  \n页面上整洁对齐的一组元素总能取悦受众。更重要的是，将一组现有的视觉对象进行和谐排列，实际上只需要几秒钟。以下是具体操作步骤：\n\n1. 选择您想要对齐的视觉对象（按住\
  \ `Ctrl` 键单击每一个）。\n2. 在 `Format` 功能区中，单击 `Align` 按钮以显示弹出菜单。它将如图 23-5 所示。\n\n   ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig5_HTML.jpg](img/370912_3_En_23_Fig5_HTML.jpg)\n\
  \n   *图 23-5* 对齐选项\n\n3. 选择所需的选项。\n\n选中的元素将根据您所做的选择，沿它们的顶部、底部、左侧或右侧对齐，或者居中对齐。可用的对齐选项在表\
  \ 23-4 中列出。\n\n**表 23-4** 对齐选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 左对齐 | 将所有选中的视觉对象沿其左侧对齐。\
  \ |\n| 水平居中 | 将所有选中的视觉对象居中对齐。 |\n| 右对齐 | 将所有选中的视觉对象沿其右侧对齐。 |\n| 顶端对齐 | 将所有选中的视觉对象沿其顶部边缘对齐。\
  \ |\n| 垂直居中 | 将所有选中的视觉对象在元素中间对齐。 |\n| 底端对齐 | 将所有选中的视觉对象沿其底部边缘对齐。 |\n\n### 分布视觉对象\n\
  \n为仪表盘添加最后一抹“注重细节”风采的一种方法是确保所有视觉对象在水平方向和/或垂直方向上都整齐分布。这可以简单地保证每个元素之间有始终相等的间距。\n\n\
  **表 23-5** 分布选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 水平分布 | 沿水平面分布一系列选中的视觉对象。 |\n| 垂直分布\
  \ | 沿垂直轴分布一系列选中的视觉对象。 |\n\n1. 选择您想要分布的视觉对象（按住 `Ctrl` 键单击每一个）。\n2. 在 `Format` 功能区中，单击\
  \ `Distribute` 按钮以显示弹出菜单。它将如图 23-6 所示。\n\n   ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig6_HTML.jpg](img/370912_3_En_23_Fig6_HTML.jpg)\n\
  \n   *图 23-6* 分布选项\n\n3. 选择所需的选项。\n4. 选中的元素将根据您的选择进行水平或垂直分布。可用的分布选项在表 23-5 中列出。\n\
  \n> **注意**：您可能需要将一组视觉对象同时在水平和垂直方向上进行分布，以获得最佳效果。您需要依次执行这两个对齐操作才能获得此结果。\n\n### 对齐到网格\n\
  \nPower BI Desktop 画布包含一个网格（类似于方格纸），您可以使用它来对齐视觉对象和其他对象。这可以帮助您创建外观更精致的演示文稿。要对齐到网格，只需：\n\
  \n1. 激活 `View` 菜单。\n2. 选择 `Snap objects to grid`。\n\n现在，每当您移动或调整对象大小时，它都会对齐到网格，或者按一个网格点（或像素）增加/减少大小。\n\
  \n## 显示网格\n\n如果您愿意，也可以显示网格来帮助您对齐对象：\n\n1. 激活 `View` 菜单。\n2. 选择 `Show gridlines`。\n\
  \n您现在将看到一个由点（每 10 个像素一个点）组成的图案，代表了隐藏的网格。\n\n> **注意**：Power BI Desktop 报表画布中的像素数取决于所选的页面大小。\n\
  \n### 指定视觉对象的精确位置\n\n放置视觉对象时可以应用的最后一个选项是指定它们的精确位置、高度和宽度。当您希望使一系列视觉对象具有相同大小时，此功能特别有用。请遵循以下步骤：\n\
  \n1. 选择您想要调整大小和/或重新定位的视觉对象。\n2. 在 `Visualizations` 窗格中，单击 `Format` 图标。\n3. 展开 `General`\
  \ 部分。\n4. 设置 `X`（水平起始）位置、`Y`（垂直起始）位置、高度和宽度。\n\nPower BI Desktop 使用像素作为放置单位，与其底层网格使用的单位相同。\n\
  \n## 添加文本框以注释报表\n\n让我们从头开始。您花费了相当多的时间深入研究数据，并找到了有效的方法将受众的注意力吸引到其中包含的宝贵信息上。但是，您还需要最后一步，画龙点睛之作——为报表添加一个标题。由于标题本质上就是一个文本框，这是您添加、格式化和修改文本框的入门介绍。\n\
  \n文本框是一种浮动的文本实体，您可以将其放置在 Power BI Desktop 报表画布上的任何位置。它们对于注释仪表盘的特定部分特别有用。\n\n\n\n\
  ### 添加文本框\n\n添加文本框的操作非常简单，描述起来比实际操作时间还长，但即便如此，以下是操作步骤：\n\n1.  在“插入”功能区中，点击“文本框”按钮。仪表盘画布上会出现一个空白文本框。\n\
  2.  输入你想要添加的文本；它将成为标题。我输入了“2017 年销售额”。\n3.  将鼠标指针放在标题框的角部或侧边中央的控制点上，然后拖动鼠标来调整标题框的大小。\n\
  4.  点击文本框的标题栏（文本框顶部的灰色区域），将文本框拖动到页面顶部中央位置。\n5.  在空白报表画布上的任意位置点击（以取消选中文本框）。\n\n图\
  \ 23-7 展示了报表中的文本框。此外，如果你想要修改文本，只需点击文本框内部，然后像在 `PowerPoint` 中一样修改现有文本即可。\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig7_HTML.jpg](img/370912_3_En_23_Fig7_HTML.jpg)\n\
  \n**图 23-7** 在报表中添加文本框\n\n> **注意：** 如果文本框太小无法容纳全部文本，则当你选中它时，文本框上会添加滚动条。\n\n### 移动文本框\n\
  \n文本框像其他任何可视化对象一样，是 `Power BI Desktop` 中的一种可视化对象。因此，可以像移动或调整表格或图表一样来移动和调整文本框大小。所以，移动标题只需：\n\
  \n1.  将鼠标指针悬停在文本框上。会出现一个容器，指示文本框的形状。\n2.  点击文本框的顶部条，然后将文本框拖拽到仪表盘画布上的其他位置。\n\n或者，你也可以选中文本框，然后将鼠标指针放在文本框的边缘上（但不要放在角部或侧边的控制点上），然后拖拽文本框到新位置。\n\
  \n### 格式化文本框\n\n你可以对文本框进行特定的格式化，赋予其所需的份量和表现力。尽管这完全是直观的操作，但为了完整性，这里提供一个简短的操作示例：\n\
  \n1.  选中你之前创建的文本框。“格式”调色板将显示在文本框的下方或上方。\n2.  选中你想要修改的文本。\n3.  点击“字体”弹出菜单，选择你想要应用于所选文本的字体。\n\
  4.  点击“字号”弹出菜单，选择你想要应用的尺寸（以磅为单位）。\n5.  通过点击相关图标，应用你需要的任何字体属性（粗体、下划线、斜体）。\n6.  通过点击三个对齐图标之一来对齐文本。这将对文本框中的所有文本生效。\n\
  \n> **提示：** 请记住，你必须高亮选中文本才能进行格式化。如果你选中了文本框本身，则只能更改文本框内文本的对齐方式。\n\n文本框的格式化选项在表 23-6\
  \ 中进行了解释。\n\n**表 23-6** 文本框格式化选项\n\n| 元素 | 图标 | 描述 |\n| --- | --- | --- |\n| 字体\
  \ | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figa_HTML.jpg](img/370912_3_En_23_Figa_HTML.jpg)\
  \ | 允许你从计算机已安装的字体中选择一种。 |\n| 字号 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figb_HTML.jpg](img/370912_3_En_23_Figb_HTML.jpg)\
  \ | 允许你选择字号。 |\n| 主题颜色 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figc_HTML.jpg](img/370912_3_En_23_Figc_HTML.jpg)\
  \ | 允许你选择颜色。 |\n| 粗体 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figd_HTML.jpg](img/370912_3_En_23_Figd_HTML.jpg)\
  \ | 使文本显示为粗体。 |\n| 斜体 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fige_HTML.jpg](img/370912_3_En_23_Fige_HTML.jpg)\
  \ | 使文本显示为斜体。 |\n| 下划线 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figf_HTML.jpg](img/370912_3_En_23_Figf_HTML.jpg)\
  \ | 为文本添加下划线。 |\n| 左对齐 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figg_HTML.jpg](img/370912_3_En_23_Figg_HTML.jpg)\
  \ | 将文本对齐到文本框左侧。 |\n| 居中对齐 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figh_HTML.jpg](img/370912_3_En_23_Figh_HTML.jpg)\
  \ | 将文本在文本框内居中对齐。 |\n| 右对齐 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figi_HTML.jpg](img/370912_3_En_23_Figi_HTML.jpg)\
  \ | 将文本放置在文本框右侧。 |\n| 超链接 | ![../images/370912_3_En_23_Chapter/370912_3_En_23_Figj_HTML.jpg](img/370912_3_En_23_Figj_HTML.jpg)\
  \ | 为所选文本添加超链接。 |\n\n### 添加超链接\n\n`Power BI Desktop` 仪表盘当然不是孤立存在的。因此，你可以将它们作为链接到其他文档或网页的起点。但请记住，超链接*仅*在\
  \ `Power BI Desktop` 文件已部署到云端的 `Power BI Service` 后才会生效。\n\n要添加超链接：\n\n1.  选中你之前创建的文本框。\n\
  2.  选中将成为超链接的文本。\n3.  点击“超链接”图标。“格式”调色板将展开并显示超链接框。\n4.  输入或粘贴一个 URL。\n5.  点击“格式”调色板中的“完成”按钮。\n\
  \n### 移除超链接\n\n要移除已添加的超链接：\n\n1.  选中你之前创建的、包含超链接的文本框。\n2.  点击超链接内部。“格式”调色板将展开。\n\
  3.  点击“移除”按钮。\n\n如果你愿意，你也可以直接删除作为链接的那部分文本。\n\n### 删除文本框\n\n如果你想删除文本框，请确保：\n\n1.\
  \  选中文本框。\n2.  点击文本框的弹出菜单（文本框右上角的省略号）。\n3.  选择“移除”。文本框将被删除。\n\n另一种删除文本框的方法是，选中文本框，然后按\
  \ `Delete` 键。\n\n> **注意：** 仅仅选中并删除文本框内的文本并不会删除文本框本身；所以，为确保报表中不留任何不必要的杂乱对象，请删除任何不需要的空文本框。\n\
  \n### 修改页面背景颜色\n\n`Power BI Desktop` 并非强制你以白色背景呈现每个报表。为了避免单调，你可以通过几次点击，为报表中的每个页面单独添加不同的背景颜色。\n\
  \n要为报表应用背景，你只需执行以下操作：\n\n1.  点击仪表盘画布内部，但不要点击任何已有的视觉对象。\n2.  在“可视化”窗格中，点击“格式”图标。\n\
  3.  展开“页面背景”部分。可用的选项看起来将如图 23-8 所示。\n    ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig8_HTML.jpg](img/370912_3_En_23_Fig8_HTML.jpg)\n\
  \n    **图 23-8** 页面背景选项\n\n4.  从可用颜色调色板中选择一种颜色。\n5.  向左或向右滑动“透明度”滑块，为所选颜色选择透明度级别。\n\
  \n> **注意：** 你需要单独格式化报表中的每一页。你不能通过按住 `Ctrl` 键点击来选择多个页面。\n\n\n\n## 图片\n\n我们都知道一张图片胜过千言万语。Power\
  \ BI Desktop 同样深知此理。因此，你可以将图片（或通常所说的图像）添加到 Power BI Desktop 报表中，以替代文字并增强演示效果。插入到\
  \ Power BI Desktop 报表中的图片可以来自网络，也可以来自磁盘上的文件（无论是本地文件还是可用的网络共享文件）。一旦图片被插入，它便*不再*与源文件关联。因此，如果源图片发生变化，你必须重新插入它才能保持更新。\n\
  \n以下是图片在 Power BI Desktop 中的一些用途：\n\n-   作为报表的背景图片。\n-   在表格中代替文本。例如，可以使用产品图片。\n\
  -   在切片器中使用图片。例如，可以是国家或地区的旗帜。\n-   独立图片——例如，一个标志，或一个用于吸引观众注意特定要点的补充元素。\n-   作为图表背景的图片。\n\
  \n在我们了解可用的图片格式类型之后，我们将看到如何在这些场景中使用图片。\n\n### 图片来源\n\n图片格式种类繁多。Power BI Desktop 接受以下所有行业标准的图片类型：\n\
  \n-   `JPEG`：这是一种历史悠久的标准图像文件格式。\n-   `PNG`：这是一种用于互联网图像的标准文件格式。\n-   `BMP`：这是一种由\
  \ MS Paint（举例）生成的标准图像类型。\n-   `GIF`：这是一种常用于网页的历史悠久的图像格式。\n-   `TIFF`：这是一种用于扫描图像的标准格式。\n\
  -   `RLE`：游程编码格式。\n-   `JPE`：24 位压缩的 JPEG 图形格式。\n-   `JFIF`：一种使用 JPEG 压缩的位图图形。\n\
  \n所有这些格式（以及它们各自衍生的、Power BI Desktop 能够处理的格式）都能提供质量尚可的图片，这些图片足以满足 Power BI Desktop\
  \ 报表的需求。但是，如果你尝试插入的图片不是 Power BI Desktop 能够处理的格式，你将收到一条警告，并且该图片将*不会*被插入。\n\n**注意**\n\
  \n当你尝试从文件插入图片时，“打开”对话框会过滤文件，因此只显示具有可接受扩展名的文件。你可以强制对话框显示其他文件格式，但 Power BI Desktop\
  \ 可能无法加载它们。\n\n### 添加图片\n\n你可能仍然想要向报表中添加完全自由浮动的图片。然而，在沉迷于图片所能实现的各种效果之前，请记住，Power\
  \ BI Desktop 并非设计为一个高端演示软件包。从本质上讲，它的作用是帮助你快速、清晰地分析和呈现信息。你难免会发现，有些你在 PowerPoint 等软件中习惯做的事情，在\
  \ Power BI Desktop 中却无法实现。因此，你可能会倾向于在 Power BI Desktop 中使用图片来达到类似的演示效果，从而使用许多演示技巧和技法。确实，通过添加图片，你可以在\
  \ Power BI Desktop 报表中实现许多功能。但你必须问自己的问题是：“我是否在提升报表的价值？”我坚信，在优秀的演示中，少即是多。因此，尽管我会展示一些使用图片的技巧，但其中许多技巧与快速高效创建\
  \ Power BI Desktop 报表的原则相悖，并且每当可视化中的数据发生变化时，都可能需要进行大量调整。所以我建议你，除非确实必要，否则不要过度使用图片来增强演示效果。\n\
  \n尽管有这些告诫，我们还是来为一篇 Power BI Desktop 报表添加一个浮动的独立图片。在这个示例中，它是一个公司的标志——卓越英国汽车公司（Brilliant\
  \ British Cars）的标志，我们在本书中分析的就是该公司的指标。\n\n添加图片非常简单。你只需要：\n\n1.  在 Power BI Desktop\
  \ 的“开始”功能区中，单击“图片”按钮。将会出现一个经典的 Windows 对话框；让你选择源图片，如图 23-9 所示。\n\n    ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig9_HTML.jpg](img/370912_3_En_23_Fig9_HTML.jpg)\n\
  \n    **图 23-9** 导航到图片文件\n\n2.  导航到包含你要插入图片的目录。在 `C:\\PowerBiDesktopSamples\\Images`\
  \ 文件夹中有几个示例图片，你可以按照附录 A 中的说明进行安装。\n\n3.  单击图片文件。在此示例中，我使用了示例图片 `CarsLogo.png`。\n\
  \n4.  单击“打开”。所选图片将被加载到页面中。\n\n5.  将图片拖到页面左上角并调整其大小。仪表板将如图 23-10 所示。\n\n    ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig10_HTML.jpg](img/370912_3_En_23_Fig10_HTML.jpg)\n\
  \n    **图 23-10** 添加到仪表板的图片\n\n### 移除图片\n\n要移除图片，你只需要：\n\n1.  选中该图片。\n2.  单击图片的弹出菜单（文本框右上角的省略号）。\n\
  3.  选择“移除”。该图片将从报表中移除。当然，原始图片文件不会受到任何影响。\n\n另一种删除图片的方法是选中该图片，然后按 Delete 键。所选图片将从报表中消失。\n\
  \n### 调整图片大小\n\nPower BI Desktop 仪表板中的图片与其他任何可视化元素一样，都可以完全相同的方式移动和调整大小。只需执行以下操作：\n\
  \n1.  选中你想要调整大小的图片。\n2.  将鼠标指针放在图片的角落或侧面中央的控制点上，然后拖动鼠标以调整图片大小。\n\n### 设置图片格式\n\n\
  添加图片后，可以在 Power BI Desktop 中对它进行一定程度的微调。以下是你可以修改的参数：\n\n-   图片缩放\n-   图片标题\n-  \
  \ 图片背景\n-   图片边框\n-   纵横比\n-   精确位置和大小\n\n除了第一项之外，所有这些修改在 Power BI Desktop 的大多数可视化中都通用。实际上，其中一些你已经多次见过了。因此，我就不浪费你的时间重复你已知或可以在本书其他地方找到的内容了。\n\
  \n不过，图片*缩放*是完全新奇的。以下是调整图片缩放方式的步骤：\n\n1.  选中你想要修改缩放方式的图片。\n2.  在“可视化”窗格（已自动切换为仅显示格式设置选项）中，展开“缩放”部分。\n\
  3.  在“缩放”弹出菜单中，选择“填充”。\n\n图片将调整自身以填满图片占位符中的所有可用空间。\n\n表 23-7 解释了三种可用的图片缩放选项。\n\n\
  **表 23-7** 图片缩放选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| 常规 | 图片保持其高宽比（无论“锁定纵横比”设置如何），并尽可能调整大小以填满图片占位符。\
  \ |\n| 填充 | 图片填满图片占位符，但会扭曲图片。 |\n| 适应 | 图片填满图片占位符，但会裁剪掉图片的部分区域，而不是扭曲图片。 |\n\n###\
  \ 背景图片\n\n图片的一个重要且通常非常引人注目的用途是作为报表的背景——甚至可能是一整系列报表的背景。因此，让我们来看看如何将图片用作报表背景。\n\n\n\
  \n#### 添加背景图片\n\n首先，你需要添加一张背景图片。同样，这非常简单：\n\n1.  点击要添加背景图片的仪表板画布。确保没有选中任何视觉对象。\n\
  2.  在“可视化”窗格中，点击**格式**图标。\n3.  展开`Page background`（页面背景）部分。\n4.  点击`Add image`（添加图片）。此时将出现一个经典的\
  \ Windows 对话框，让你选择源图片。\n5.  导航到包含要插入图片的目录。在此示例中，目录为`C:\\PowerBiDesktopSamples\\\
  Images`。\n6.  点击图片文件。本例中我将使用示例图片`GreenShade.jpg`。\n7.  点击`Open`（打开）。所选图片将被加载到页面中。\n\
  8.  在`Image fit`（图片适应）弹出列表中，选择`Fit`（适应）。\n\n所选图片将覆盖所有视觉对象背后的整个页面。\n\n调整图片大小有三种可能的方式，详见表\
  \ 23-8。\n\n**表 23-8** 背景图片大小调整选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `Normal`（正常） |\
  \ 图片保持其原始大小。 |\n| `Fit`（适应） | 图片扩展（可能变形）以覆盖整个仪表板区域。 |\n| `Fill`（填充） | 图片按比例扩展，以尽可能覆盖仪表板区域。\
  \ |\n\n此外，一旦背景图片被添加到页面，你可以调整其透明度。操作如下：\n\n1.  在已展开的“格式”面板的`Page background`（页面背景）部分，向左或向右拖动`Transparency`（透明度）滑块。\n\
  \n> **注意：** 在 Power BI Desktop 中，你无法手动调整图片的大小。如果你需要图片达到特定尺寸，必须在图片创建应用程序中以精确的所需尺寸创建它。\n\
  \n#### 独立图片的一些用途\n\n图片对报告能起到的作用，只受限于你的想象力，因此不可能提供一份详尽的建议清单。尽管如此，以下是我发现的一些自由格式图片的用途：\n\
  \n-   **公司标志**，正如我们刚刚看到的。\n-   **纯装饰效果而添加的图片**。然而，我会对此持保留态度，因为它可能会分散对分析的注意力，而非增强分析效果。不过，有时这恰恰是你想要做的（例如，转移人们对某些灾难性销售数据的注意力）。所以，如果必须的话，可以添加装饰，但请谨慎使用！\n\
  -   **增强文本框中的文本**：通过提供与底层图片或背景形成清晰对比的阴影来实现。\n-   **作为表格中特定列的背景**。但请注意，如果列的大小被调整，图片无法随之移动。\n\
  \n> **注意：** 如果你想添加覆盖整个仪表板页面的图片，则*不要*向页面添加独立图片，而应使用背景图片技术。否则，你可能会使页面上的其他视觉对象无法被访问。\n\
  \n## 添加形状\n\n有时，你的图表可能需要一点帮助才能从众多元素中脱颖而出。也许将一小组视觉对象（例如仪表或卡片）分组在一起效果最佳。无论需求如何，Power\
  \ BI Desktop 都可以通过向页面添加一个或多个形状，为你的仪表板增添一些最后的润色。\n\n以下是你可以选择的内置形状：\n\n-   矩形（也包括正方形）\n\
  -   椭圆形（包括圆形）\n-   线条\n-   三角形\n-   箭头\n\n假设你想在仪表板上添加一个装饰性箭头，以吸引读者对特定图表的注意。以下说明如何操作：\n\
  \n1.  在“开始”功能区中，点击`Shapes`（形状）按钮，查看可用形状的弹出列表。你可以在图 23-11 中看到这个列表。\n\n   ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig11_HTML.jpg](img/370912_3_En_23_Fig11_HTML.jpg)\n\
  \   **图 23-11** 形状弹出列表\n\n2.  选择`Rectangle`（矩形）。一个正方形将被添加到仪表板画布上。\n3.  按照调整图表或图片大小相同的方式调整正方形大小。如果你使用顶部、底部或侧边手柄，正方形将变为矩形。\n\
  \n由于其他可用形状的插入方式完全相同，我就不逐一说明了，但你可以通过在页面上添加不同的形状来获得一些乐趣，看看它们如何增强仪表板的效果。\n\n### 格式化形状\n\
  \n你可以调整形状的以下方面：\n\n-   线条\n-   填充\n-   旋转\n-   标题\n-   背景\n-   纵横比\n-   精确位置和大小（X\
  \ 和 Y 坐标）\n\n由于在格式化视觉对象方面，只有前三项是新的，让我们来看看它们的实际应用。\n\n#### 形状的线条和填充颜色\n\n当我们说到形状中的“线条”时，实际上是指形状的外部边界。Power\
  \ BI Desktop 允许你修改它的：\n\n-   颜色\n-   粗细（也称为权重）\n-   透明度\n\n同时，你也可以设置形状的填充颜色。以下是如何为任何可用形状修改基本特征的方法：\n\
  \n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig12_HTML.jpg](img/370912_3_En_23_Fig12_HTML.jpg)\n\
  **图 23-12** 格式化形状\n\n1.  选择要格式化的形状。\n2.  在“可视化”窗格（现在只显示形状格式化选项）中，展开`Line`（线条）部分。\n\
  3.  从可用颜色的弹出调色板中选择线条颜色。形状的外部线条将改变颜色。\n4.  调整`Weight`（粗细）以设置线条厚度。形状的外部线条将变粗。\n5.\
  \  向左移动`Transparency`（透明度）滑块以调整颜色的强度。\n6.  展开`Fill`（填充）部分。\n7.  从可用颜色的弹出调色板中选择填充颜色。形状的内部将改变颜色。\n\
  8.  向右移动`Transparency`（透明度）滑块以调整颜色的强度。“可视化”窗格和形状将看起来像图 23-12 所示。\n\n#### 形状旋转\n\n\
  某些形状需要旋转到正确的方向，以实现你想要的效果。通常需要这样调整的形状是箭头和三角形——尽管此技术可应用于任何形状。要旋转形状：\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig13_HTML.jpg](img/370912_3_En_23_Fig13_HTML.jpg)\n\
  **图 23-13** 旋转形状\n\n1.  选择要旋转的形状。\n2.  在“可视化”窗格（现在只显示形状格式化选项）中，展开`Rotation`（旋转）部分。\n\
  3.  向左和/或向右拖动`Rotation`（旋转）滑块，将箭头设置为指向你想要的方向。或者，你可以在滑块左侧的`Rotation`（旋转）框中输入精确的旋转值。形状和“可视化”窗格将看起来像图\
  \ 23-13 所示。\n\n值得注意的是，如果你愿意，可以在`Rotation`（旋转）框中输入精确的旋转角度值。当需要将形状旋转 45 度或 90 度的倍数时，这尤其有用。\n\
  \n> **注意：** 当添加椭圆或矩形时，你会发现 Power BI Desktop 最初将它们分别创建为圆形和正方形。为了确保它们保持完美的形状（如果这是你的需求），请在调整形状大小之前确保`Lock\
  \ Aspect`（锁定纵横比）格式选项设置为`On`（开启）。\n\n#### 删除形状\n\n要删除一个形状，你只需：\n\n1.  选择要删除的形状。\n\
  2.  点击形状的弹出菜单（文本框右上角的省略号）。\n3.  选择`Remove`（删除）。该形状将被删除。\n\n另一种删除形状的方法是选中该形状，然后按`Delete`（删除）键。所选形状将从报告中消失。\n\
  \n\n\n### 标准化形状\n\n如果你正在为仪表板添加最终的装饰性（最好也具有说明性）点缀，你可能希望让一系列形状看起来完全一致。毕竟，你绝不想让仪表板看起来像一块拼布被。微软\
  \ Office 套件中有一个值得信赖的工具可以帮助你以这种方式合理化仪表板——那就是“格式刷”。\n\n1.  选择一个形状，将其作为其他形状的模板。\n2.\
  \  点击“开始”功能区中的“格式刷”按钮。\n3.  点击你想要格式化为与第一个形状完全相同的那个形状。\n\n> **注意：** 你不能像在 MS Word\
  \ 或 Excel 中格式化时那样，通过双击“格式刷”来将同一格式多次应用于不同形状。\n\n### 组织页面上的视觉对象\n\n一个复杂的仪表板可能由许多元素组成（当然希望不要多到让受众感到困惑）。这时，对最终外观进行一些基本的润色会有所帮助。简单来说：\n\
  \n-   观众更倾向于相信一个组织得井井有条的仪表板。\n-   清晰的布局被解读为清晰的思路——这能增加你所呈现事实与数据的可信度。\n-   良好的美学效果会为你的论点增色，而不是减分。\n\
  \n因此，在我们结束“如何最终确定和完善仪表板”的探索之旅时，你需要学习如何调整页面上视觉对象（无论是表格、图表、仪表、图片还是形状）之间的相互关系；这本质上意味着在垂直方向上对视觉对象进行分层。\n\
  \n### 分层排列视觉对象\n\n随着报表变得越来越复杂，你将不可避免地需要不仅并排排列其包含的元素，还要将它们上下堆叠。Power BI Desktop 让你能够简单高效地完成此操作。\n\
  \n作为示例，我们来创建一个上面叠加了另一个图表的图表：\n\n1.  使用以下两个字段创建一个环形图：\n    -   `成本加备件利润`（来自 `InvoiceLines`\
  \ 表）\n    -   `国家名称`（来自 `Countries` 表）\n2.  使用以下两个字段创建一个（簇状）柱形图：\n    -   `品牌`（来自\
  \ `Stock` 表）\n    -   `净利润率`（来自 `InvoiceLines` 表）\n3.  在环形图中，添加一个图例并将其设置为显示在右侧。同时，将“详细信息标签”选项设置为“关闭”。将“环形图背景”选项设置为“关闭”。\n\
  4.  将环形图放置在柱形图的右上角。\n5.  选中环形图后，从 Power BI Desktop 的“格式”功能区中选择“上移一层” ➤ “置于顶层”。\n\
  \n你的组合图表应如图 23-14 所示。将环形图置于顶层意味着柱形图的网格线现在位于环形图下方。\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig14_HTML.jpg](img/370912_3_En_23_Fig14_HTML.jpg)\n\
  \n**图 23-14** – 分层排列图表\n\n这种技术在你添加独立图像时（如上一节所述）特别有用。当组合诸如图像和文本框等元素时，它也同样方便，你将在下一节中看到这一点。\n\
  \n### 分组视觉对象\n\nPower BI Desktop 还允许你将多个视觉对象分组为一个单一视觉对象。当你想要复制或调整多个对象的大小时，这将非常实用。\n\
  \n操作步骤如下：\n\n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig15_HTML.jpg](img/370912_3_En_23_Fig15_HTML.jpg)\n\
  \n**图 23-15** – 分组后的视觉对象\n\n1.  创建上一节中描述的两个图表。\n2.  同时选中两个图表。\n3.  在“格式”菜单中，点击“分组”\
  \ ➤ “分组”。\n4.  调整（之前分开的）两个视觉对象合并成的（单个）视觉对象的大小。你应该会看到类似图 23-15 所示的效果。\n\n## 手机布局\n\
  \n越来越多的信息工作者需要在移动中获取数据。这意味着他们要在手机上查看 Power BI 仪表板。为了方便这一点，微软 Power BI 团队在 Power\
  \ BI Desktop 中添加了一个宝贵功能——手机布局。\n\n此功能允许你获取现有报表，并定义构成仪表板的每个视觉对象如何在智能手机上显示。这种方法有几个优点：\n\
  \n-   Power BI 会自动检测所使用的设备类型，并应用相应的呈现样式。\n-   您无需创建重复的报表（一个用于电脑屏幕，另一个用于手机），然后同时更新它们。\n\
  -   您不必在手机版本的仪表板中包含所有视觉对象。\n-   仪表板中某个视觉对象的任何更改都会反映在相应的手机布局中。\n\n举一个简单的例子，以下是 从包含你刚刚创建的叠加图表的仪表板中创建手机报表的方法：\n\
  \n1.  打开或创建一个 Power BI Desktop 仪表板。\n2.  在“视图”功能区中，点击“手机布局”按钮。你将看到一个类似图 23-16 所示的屏幕。\n\
  \n   ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig16_HTML.jpg](img/370912_3_En_23_Fig16_HTML.jpg)\n\
  \n   **图 23-16** – 手机布局\n\n3.  将你想要在手机版报表中使用的第一个视觉对象拖拽到手机屏幕上。\n4.  调整视觉对象的大小，使其覆盖所需的手机屏幕区域。\n\
  5.  添加你希望使用的任何其他视觉对象，并根据需要调整它们的位置。手机布局屏幕可能看起来像图 23-17 所示。\n\n   ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig17_HTML.jpg](img/370912_3_En_23_Fig17_HTML.jpg)\n\
  \n   **图 23-17** – 一个完成的手机布局\n\n6.  再次点击“手机布局”按钮，切换回桌面布局。\n\n现在，一旦此报表发布到 Power BI\
  \ 服务（或本地 Power BI 报表服务器），任何移动用户将在其智能手机上看到手机布局。不幸的是，设置和使用 Power BI 服务是一个庞大且独立的话题，此处无法展开。\n\
  \n> **注意：** 如果某个视觉对象在手机布局中未完全可见，您将在该视觉对象中看到省略号和一个朝下的小三角形，以指示可见性可能存在问题。\n\n\n\n##\
  \ 报表主题\n\n您可以定义自己的颜色集，这些颜色将自动应用于表格、矩阵以及图表中的数据（如果您愿意的话）。这需要创建一个特定格式的简单文件，然后将其加载到\
  \ Power BI Desktop 中。该文件必须包含以下元素：\n\n-   主题名称\n-   一组数据颜色，放在方括号内，并用逗号分隔\n-   背景元素\n\
  -   前景元素\n-   用于表格的强调色元素\n\n您可以在以下示例的步骤 1 中查看一个示例文件：\n\n1.  从示例数据中加载名为 `BrilliantBritishCars.json`\
  \ 的 `.json` 文件。\n2.  在“格式”功能区中，单击“主题”弹出菜单，选择**浏览主题**，然后浏览到您刚刚创建的文件。\n3.  单击**打开**。您将看到如图[23-18]所示的对话框。\n\
  \    \n    ![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig18_HTML.jpg](img/370912_3_En_23_Fig18_HTML.jpg)\n\
  \    \n    *图 23-18 — 导入主题对话框*\n    \n4.  单击**确定**。主题文件将打开，并将该主题应用于当前文件中的所有页面。\n\
  \n背景、前景和表格强调色现在将应用于报表中的每一个表格和矩阵。此外，默认情况下，数据颜色将是指定在主题文件中的那些颜色。您可以在图[23-19]中看到这一点。\n\
  \n![../images/370912_3_En_23_Chapter/370912_3_En_23_Fig19_HTML.jpg](img/370912_3_En_23_Fig19_HTML.jpg)\n\
  \n*图 23-19 — 将主题应用于报表*\n\n此主题文件也位于 `C:\\PowerBiDesktopSamples` 文件夹中（假设您已从 Apress\
  \ 网站下载了示例文件）。\n\n> **注意：** 要移除刚刚加载的主题并恢复到默认主题，请在“开始”功能区中单击**切换主题 ➤ 默认主题**。\n\n在\
  \ Power BI Desktop 中，报表主题仍然是一个持续开发中的功能，并且目前处于不断变化的状态。我预计到本书出版时，JSON 文件的结构将有显著的发展。这是一个如此复杂的主题，我只能建议您参考网络上关于此主题的大量可用资源。因此，在本书的这一版中，我无法确切地深入探讨报表品牌化以及创建底层\
  \ JSON 文件的问题。我能做的是建议您查看示例数据中的 `BrilliantBritishCars.json` 文件，以了解所需的内容。实际上，您应该能够将此文件作为您自己样式模板的基础。\n\
  \n## 结论\n\n在本章中，您了解了如何在使用 Power BI Desktop 创建极具吸引力的演示文稿时突破常规。您看到了当您向表格和切片器添加图形元素时，添加图像如何能够极大地提升分析给人留下的印象。并且，适度地使用图像、形状和自由格式文本元素，可以吸引观众的注意力，使其关注演示文稿中最突出的特点。所以，现在轮到您使用这些强大的\
  \ Power BI Desktop 功能，为您的观众带来真正引人入胜的交互式分析。\n\n在本章中，您还了解了如何将现有报表准备好以在智能手机上显示。只需付出很少的额外努力，您就能确保一个复杂的报表能够完美地适应移动设备。\n\
  \n最后，您学会了如何为 Power BI Desktop 报表应用自己的“品牌化”。这让您可以在一系列报表中自动创建标准化的外观和感觉。\n\n现在是时候学习如何构建结构化的交互式报表，使用户能够深入查看数据并探究数据所包含的详细层次。您将在下一章——也是最后一章——中找到这些内容。\n\
  \n"
- "# 24. 高级仪表板设计技术\n\n在本书的最后一章中，我将介绍一系列技术，您可以使用这些技术为您的仪表板增添真正的功能和深度。您在此处发现的方法专门设计用于为您的报表增加结构。这意味着您将能够：\n\
  \n-   引导用户沿着一条数据发现路径，从最高层到最详细层进行探索\n-   添加弹出式窗口，以更详细地解释数据的特定方面\n-   提供多页报表的导航\n\
  -   使用您的数据来讲故事\n-   将您的数据叙述呈现为交互式幻灯片\n\n单独来看，用于实现这些目标的技术都非常有用，并且能够推动洞察和理解。然而，如果综合运用，它们可以极大地增强您的仪表板的功能，甚至能唤醒演示中最疲惫的观众。\n\
  \n因此，在本章中，您将学习如何：\n\n-   在报表页面之间实现钻取——甚至跨报表钻取\n-   添加弹出式可视化工具提示\n-   创建书签以记住页面显示的各种状态——并在页面之间移动\n\
  -   设置按钮和图像以控制用户与仪表板的交互——包括在页面之间添加内部链接\n-   将切片器应用于报表中的部分或全部页面\n-   使用模板来确保您的仪表板在部门或企业范围内具有标准化的外观和感觉\n\
  \n## 钻取\n\n塑造数据叙述的关键技术之一，是能够向下钻取数据并逐步显示更详细的信息层次。简单来说，Power BI Desktop 允许您基于交互式选择标准快速轻松地跳转到另一个页面。这使您——以及您的用户——能够以循序渐进的、结构化的方式深入探究数据的细节。\n\
  \n钻取功能至少需要报表中有两个页面：\n\n-   源页面，包含关于多个元素的数据\n-   目标（或详细）页面，提供一组不同的可视化对象，旨在提供关于数据某一单一方面的更详细信息层次\n\
  \n让我们实际操作一下。为了避免冗长的步骤说明，我仅要求您创建两个非常简单的报表页面。当然，在实际操作中，您的报表可能比这些复杂得多。\n\n### 源页面\n\
  \n源页面是您将用于数据高层视图的页面。为了便于讨论，我们假设这是公司自成立以来的总销售额，以图表形式呈现：\n\n1.  打开 Power BI Desktop\
  \ 文件 `C:\\PowerBiDesktopSamples\\CarSalesDataForReports.pbix`。\n2.  将空白页面重命名为“**销售**”。\n\
  3.  在此页面上，使用以下字段创建一个条形图：\n    -   `生产商`\n    -   `销售价格`\n\n您可以在图[24-2]中看到此图表。\n\n\
  \n\n### 目标页面\n\n此页面的设计必须显示更详细的数据，这些数据与你在源页面上用作钻取依据的单个元素相关。在此示例中，这意味着有关车辆*品牌*的信息。此页面还将添加一些特定的调整，以指明它是钻取操作的目标页面。\n\
  \n1. 在现有报表中添加一个新页面。\n2. 将此页面重命名为 `Make Details`。\n3. 使用字段 `Make` 添加一个卡片。 不必担心此阶段显示的实际品牌是什么。\n\
  4. 在卡片的“格式设置”窗格中，将 `Category label` 设置为 `Off`。\n5. 使用以下字段添加一个表格：\n   - `FullYear`\n\
  \   - `CostPrice`\n   - `SalePrice`\n6. 使用以下字段添加一个面积图：\n   - `Color`\n   - `LaborCost`\n\
  \   - `SpareParts`\n\n你可以在图 24-3 中看到这两个视觉对象。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig1_HTML.jpg](img/370912_3_En_24_Fig1_HTML.jpg)\n\
  \n图 24-1 钻取筛选器井\n\n1. 单击报表画布（在任何视觉对象之外），将 `Make` 字段拖到“可视化”窗格的 `Drillthrough` 区域中。将此字段放置在\
  \ `Drillthrough Filters` 井中。当前页面的左上角会自动出现一个后退按钮。\n2. 将此按钮放置在仪表板上你希望它出现的位置。\n3. 单击报表画布，查看“可视化”窗格的\
  \ `Drillthrough` 区域。你可以在图 24-1 中看到结果。\n\n这两个页面（源页面和目标页面）现已链接，可以向下钻取数据了。\n\n### 应用钻取\n\
  \n现在你可以使用钻取报表了。\n\n1. 转到 `Sales` 页面。\n2. 右键单击图表中的任意柱形。在此示例中，我使用的是 *Rolls Royce*。你将看到如图\
  \ 24-2 所示的弹出菜单。\n\n   ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig2_HTML.jpg](img/370912_3_En_24_Fig2_HTML.jpg)\n\
  \n   图 24-2 钻取上下文菜单\n\n3. 选择 `Drillthrough > Sales Details`。Power BI Desktop 将显示\
  \ `Sales Details` 页面——你可以在卡片视觉对象中看到你在源页面中单击的品牌。在图 24-3 中，你可以看到应用钻取后的目标页面。\n\n  \
  \ ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig3_HTML.jpg](img/370912_3_En_24_Fig3_HTML.jpg)\n\
  \n   图 24-3 钻取目标页面\n\n4. 按住 Ctrl 键并单击后退按钮以返回到源报表。\n\n将显示 `Make Details` 报表，并将数据筛选为你右键单击的行或数据点对应的品牌。\n\
  \nPower BI Desktop 会在钻取报表（“目标”报表页面）上自动创建一个后退按钮。但是，如果你不想使用此按钮，则无需使用。实际上，任何形状或图像都可以成为后退按钮。如果你认为它多余，可以将其删除。\n\
  \n### 多级钻取\n\n钻取并不仅限于单级。一旦你向下钻取到第二页的更详细信息，没有任何限制阻止你再次向下钻取到第三页的更深入细节。你需要做的只是重复你在上一节中学习的过程，只不过这次你将“目标”页面作为起点——并创建第三个页面作为新的目标页面。\n\
  \n在向下钻取到越来越深入的分析级别时，值得注意的是，你可以选择在向下钻取时应用任何现有的筛选器（这是一种相当标准的做法）——或者，你可以覆盖向下钻取时的任何切片器和筛选器，但钻取筛选器本身（即你在上一个示例的步骤\
  \ 3 中单击的元素）除外。\n\n如果你希望在页面之间向下钻取时阻止筛选器传播，只需在“值”窗格中将 `Keep all filters` 选项设置为 `Off`。你可以在图\
  \ 24-4 中看到这一点。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig4_HTML.jpg](img/370912_3_En_24_Fig4_HTML.jpg)\n\
  \n图 24-4 在钻取期间阻止筛选器传播\n\n## 跨 Power BI 文件钻取\n\n钻取并不仅限于单个报表。你也可以跨报表向下钻取。但仅当你已将要进行此操作的报表部署到\
  \ Power BI 服务时，此功能才有效。\n\n要启用跨报表钻取，只需在“值”窗格中将 `Cross-report` 按钮设置为 `On`。你在图 24-4\
  \ 中看到过此按钮。\n\n\n\n## 弹出式工具提示\n\n弹出式工具提示是 Power BI Desktop 提供的最令人印象深刻的功能之一——至少在我交谈过的大多数用户看来是如此。弹出式工具提示允许你将光标悬停在某个元素上（例如饼图扇区、条形图元素，甚至仪表板中的几乎任何指标），并立即显示一个选定的图表、表格或两者组合，悬浮在现有仪表板可视化效果之上。这使你可以为仪表板页面添加即时详细信息，而无需离开该页面。\n\
  \n本质上，弹出式工具提示是一个单独页面，经过特殊配置以容纳少量可视化对象（超过两三个通常就会适得其反）。下面将解释的主要步骤如下：\n\n*   添加新页面\n\
  *   指定该页面为工具提示\n*   缩小页面尺寸\n*   添加工具提示筛选器\n\n在真正创建工具提示页面之前，了解将要对哪个指标进行筛选非常重要。这是因为工具提示筛选器旨在为特定元素提供更精细的详细信息。因此，在构建弹出式工具提示时，你需要知道筛选元素是什么。\n\
  \n在以下示例中，你将使用文件 `C:\\PowerBIDesktopSamples\\CarSalesDataForMultipages.Pbix`。该文件包含一个按制造商显示销售额的饼图。目标是添加一个工具提示筛选器，以提供关于每个制造商的更多详细信息。因此，字段\
  \ *Make* 将成为我们将使用的工具提示筛选器字段。\n\n1.  打开文件 `CarSalesDataForMultipages.Pbix`。\n2. \
  \ 添加一个新页面并将其命名为 **CostsTooltip**。\n3.  在“可视化”窗格中，单击该页面的“格式”图标。\n4.  展开“页面信息”，并将“工具提示”设置为“开”。\n\
  5.  展开“页面大小”，并从可用大小的弹出列表中选择“工具提示”。\n6.  展开“页面背景”，并为页面背景选择一种颜色（这将使弹出式工具提示在底层仪表板中更清晰地突出显示）。格式选项如图\
  \ 24-5 所示。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig5_HTML.jpg](img/370912_3_En_24_Fig5_HTML.jpg)\n\
  \n*图 24-5* 工具提示格式选项\n\n7.  在“可视化”窗格中单击“字段”图标，以切换回字段信息。\n8.  将 `Make` 字段拖放到“将工具提示字段拖到此处”的区域，如图\
  \ 24-6 所示。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig6_HTML.jpg](img/370912_3_En_24_Fig6_HTML.jpg)\n\
  \n*图 24-6* 指定工具提示筛选器\n\n9.  在新的工具提示页面中，按 `Model` 创建一个包含 `LaborCost` 和 `SpareParts`\
  \ 的簇状柱形图。你会看到图表比通常情况大得多。这是因为最终的弹出式工具提示以较小的页面尺寸显示，但却占用了工具提示页面中整个仪表板设计图面。\n10. 调整图表大小，使其占满工具提示页面中的所有可用空间。\n\
  11. 按你的喜好设置图表格式。\n\n现在，当你将鼠标悬停在饼图的任何扇区上时，弹出式工具提示就会出现，如图 24-7 所示。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig7_HTML.jpg](img/370912_3_En_24_Fig7_HTML.jpg)\n\
  \n*图 24-7* 显示工具提示筛选器\n\n创建工具提示可视化对象时，有几点重要事项需要注意：\n\n*   你可能更倾向于以像素为单位指定用于弹出式工具提示的页面确切尺寸，而不是使用预设值“工具提示”。为此，首先在“页面格式”选项的“页面大小”部分的“类型”弹出菜单中选择“自定义”，然后以像素为单位输入弹出式工具提示的高度和宽度。\n\
  *   你可能希望在创建工具提示页面后将其隐藏，以防止用户点击它并将其作为页面而非工具提示显示。要执行此操作，你只需右键单击页面标签，然后从上下文菜单的可用选项中选择“隐藏页面”即可。\n\
  *   只要使用到筛选指标，工具提示弹出窗口就会出现。换句话说，任何包含（此例中的）`Make` 字段的可视化对象（无论该可视化对象位于哪个页面）都会显示该弹出式工具提示。\n\
  *   你可以像格式化任何标准可视化对象或页面一样，格式化工具提示可视化对象和成为工具提示的页面。\n*   如果需要，工具提示页面可以包含多个不同的可视化对象。\n\
  *   工具提示可视化对象本身不能调用其他工具提示可视化对象。\n\n## 书签\n\n书签是 Power BI 最强大和最有用的功能之一。它们通过帮助你的数据讲述自己的故事，将分析从单纯的交互式提升到完全有意义。书签是一种记住仪表板选定方面的方法，以便你可以快速轻松地重置它们。在实践中，这意味着你可以记住以下状态：\n\
  \n*   当前页面。\n*   任何活动的筛选器。\n*   切片器——这包括切片器类型（下拉列表或列表）和切片器状态（选中的元素）。\n*   可视化对象选择状态（例如应用的任何交叉筛选）。\n\
  *   已应用于部分或全部可视化对象的任何排序顺序。\n*   下钻状态。\n*   对象可见性（使用“选择”窗格——稍后你将学到）。\n*   任何可见对象的焦点或\
  \ Spotlight 模式。\n\n与大多数 Power BI Desktop 功能一样，通过实际操作最能理解书签。因此，这里有一个示例，说明如何创建两个书签，然后依次应用它们：\n\
  \n1.  打开文件 `CarSalesDataForMultipages.Pbix`。\n2.  移除所有不必要的筛选器元素和切片器选择，并确保没有活动的交叉筛选。\n\
  3.  在“视图”功能区中，单击“书签”图标。将出现“书签”窗格。\n4.  单击“添加”。一个新的书签（可能叫 `Bookmark 1`）将出现在书签列表中。\n\
  5.  单击新书签右侧的省略号以显示上下文菜单（或者，你也可以右键单击书签名称）。\n6.  选择“重命名”。\n7.  输入新名称并按 Enter 键。在此示例中，我建议命名为\
  \ **Baseline**。书签窗格将类似于图 24-8。你所做的是在应用任何切片器或筛选器之前，“记住”了该页面及其包含的所有可视化对象的状态。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig8_HTML.jpg](img/370912_3_En_24_Fig8_HTML.jpg)\n\
  \n*图 24-8* 书签窗格\n\n8.  应用一两个切片器选择，并单击饼图的一个扇区以交叉筛选数据。然后，单击表格右上角的省略号并选择“Spotlight”。这些修改将改变此页面上显示的数据。\n\
  9.  创建第二个书签（如步骤 4-7 所述），命名为 **SlicedData**。现在，你已经“记住”了应用切片器和 Spotlight 后页面的新的、已更改的状态。\n\
  \n单击任一书签都将重新应用创建该书签时处于活动状态的切片器、筛选器和交叉筛选器的状态。\n\n### 更新书签\n\n书签一旦创建，并非一成不变。随着分析需求的变化，你可以随时更新现有的书签。\n\
  \n1.  单击要更新的书签。\n2.  添加或删除切片器元素、筛选器和交叉筛选选择，以调整仪表板显示。\n3.  单击新书签右侧的省略号以显示上下文菜单（或者，你也可以右键单击书签名称），然后选择“更新”。\n\
  \n书签即被更新（即使没有立即可见的指示），现在页面新的状态已被记住。\n\n\n\n### 定义书签的应用范围\n\n正如我之前提到的，书签可以应用于仪表板的多个方面。然而，您不必将书签应用于仪表板的每一个方面。您可以选择让书签应用于表\
  \ 24-1 中所描述的选项范围。\n\n**表 24-1** 书签的应用范围\n\n| 范围 | 描述 |\n| --- | --- |\n| 数据 | 这意味着任何已应用的筛选器、切片器、交叉筛选或排序都会随书签一并记忆。\
  \ |\n| 显示 | 这基本上意味着任何已应用了突出显示选项的可视化对象，其该属性都会被书签“记住”。 |\n| 当前页面 | 当前页面包含在书签的定义中——应用书签将显示应用该书签时的页面。\
  \ |\n| 可视化对象 | 您可以选择一个或多个可视化对象，以限制使用书签时受影响的可视化对象数量。 |\n\n本质上，这意味着书签具有可变的作用范围和效果——而由您来决定其影响范围应有多大。每个单独的书签都可以根据您的需求进行定制，具体如下：\n\
  \n1. 单击要更新的书签。\n\n2. 单击新书签右侧的省略号以显示上下文菜单（或者，您也可以右键单击书签名称），然后取消选中**显示**。\n\n3. 从上下文菜单中选择**显示**。\n\
  \n4. 单击新书签右侧的省略号，然后选择**更新**。\n\n此后，该书签将不再对与之关联的可视化对象应用任何突出显示效果。\n\n> **注意：** 必须至少选择一个书签选项（数据、显示或当前页面），否则书签将变为无效。\n\
  \n### 排列书签\n\n一旦您了解到书签的强大作用，可能会发现自己创建了相当多的书签。因此，有必要了解一下几种有助于更轻松管理书签的技巧。它们是：\n\n\
  - 更改书签在**书签**窗格中的显示顺序\n- 将书签分组\n- 删除书签\n\n例如，要更改书签在**书签**窗格中的显示顺序：\n\n1. 在**书签**窗格中，将某个书签垂直拖拽到书签列表中的新位置。\n\
  \n删除书签同样简单：右键单击书签，然后从弹出菜单中选择**删除**。\n\n## 使用书签进行幻灯片放映\n\nPower BI Desktop 不仅仅是一款出色的分析工具。它还能帮助您展示数据，讲述有意义的故事——而在让数据“自己说话”方面，书签可以成为宝贵的助手。这是因为一系列书签可以像幻灯片一样进行播放。\n\
  \n1. 在**书签**窗格中，从上到下按有意义的顺序组织书签，该顺序代表您数据驱动叙事的流程。\n\n2. 在**书签**窗格中，单击**视图**。列表中的第一个书签将被激活。报表底部会出现一个新栏。您可以在图\
  \ 24-9 中看到此栏。\n\n   ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig9_HTML.jpg](img/370912_3_En_24_Fig9_HTML.jpg)\n\
  \n   **图 24-9** 幻灯片放映栏\n\n3. 单击向右的 V 形图标以激活列表中的下一个书签。\n\n4. 幻灯片放映结束后，单击**书签**窗格右上角的**退出**按钮。\n\
  \n这或许不言自明，但单击向左的 V 形图标会激活列表中的上一个书签。\n\n## 按钮\n\nPower BI 首先是一个报表工具。然而，这并不意味着它在任何方面都必须是静态的。为让您能够开发更具交互性的报表，您可以在任何仪表板页面添加按钮。设置完成后，按钮可以让用户：\n\
  \n- 跳转到特定页面\n- 返回之前使用的页面\n- 打开 Power BI 问答对话框\n- 打开网页或内联网页面\n\n在本示例中，您将看到如何添加一个显示所选页面的按钮。这意味着需要创建一个新的“目标”页面，您将通过单击另一个页面中的按钮来“跳转”到该页面。\n\
  \n1. 打开 Power BI Desktop 文件 `C:\\PowerBIDesktopSamples\\CarSalesDataForMultipages.Pbix`。\n\
  \n2. 插入一个新页面并将其重命名为 **DetailedAnalysis**。\n\n3. 添加一个基于 **SalePrice** 和 **CountryName**\
  \ 的条形图。\n\n4. 添加一个名为 **Destination** 的书签（如前所述）。\n\n5. 返回**页面 1**。\n\n6. 在**插入**菜单中，单击**按钮**图标中的弹出\
  \ V 形图标。您将在弹出菜单中看到可用的按钮选项，如图 24-10 所示。\n\n   ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig10_HTML.jpg](img/370912_3_En_24_Fig10_HTML.jpg)\n\
  \n   **图 24-10** 按钮弹出菜单\n\n7. 选择**书签**作为按钮类型。一个书签样式的按钮将被添加到仪表板中。\n\n8. 将按钮放置在仪表板的空白区域，并保持按钮处于选中状态。\n\
  \n9. 在**可视化**窗格中，将**按钮文本**设置为**开**。\n\n10. 展开**文本**部分。\n\n11. 输入 **点击跳转** 作为按钮文本。\n\
  \n12. 确保**操作**部分设置为**开**并展开它。\n\n13. 确保按钮类型设置为**书签**。\n\n14. 选择**Destination**（您在步骤\
  \ 4 中创建的书签名称）作为链接到此按钮的书签。**可视化**窗格中的**操作**部分将如图 24-11 所示。\n\n    ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig11_HTML.jpg](img/370912_3_En_24_Fig11_HTML.jpg)\n\
  \n    **图 24-11** 将按钮操作设置为“书签”\n\n现在，如果您按住 Ctrl 键并单击该按钮，将会显示新页面。\n\n> **注意：** 只有在\
  \ Power BI Desktop 中，您才需要使用 Ctrl+单击来激活按钮操作。一旦部署到 Azure 的 Power BI 服务中，只需单击即可。\n\n\
  > **警告：** 如果您在选中一个按钮的情况下插入另一个按钮，则现有按钮将被转换为新的按钮类型。\n\n### 按钮选项\n\nPower BI Desktop\
  \ 为您提供了一系列可选的按钮类型。选择适合您要定义的交互的按钮类型，将帮助您快速、轻松地创建交互式仪表板。不过，值得注意的是，您可以在创建后更改任何按钮类型，并且选择按钮类型仅会应用预设值，如有必要，您可以稍后覆盖这些预设值。\n\
  \n表 24-2 列出了您可以选择的內建按钮类型。\n\n**表 24-2** 按钮类型\n\n| 选项 | 描述 |\n| --- | --- |\n| 左箭头\
  \ | 插入一个带有向左箭头的按钮。默认未指定操作。 |\n| 右箭头 | 插入一个带有向右箭头的按钮。默认未指定操作。 |\n| 重置 | 插入一个带有向左箭头的按钮。默认未指定操作。\
  \ |\n| 返回 | 插入一个带有圆形内左箭头的按钮。操作自动设置为返回上一个使用的页面。 |\n| 信息 | 插入一个带有信息符号的按钮。默认未指定操作。\
  \ |\n| 帮助 | 插入一个带有帮助符号的按钮。默认未指定操作。 |\n| 问答 | 插入一个带有标注框的按钮。操作指定为激活问答。 |\n| 书签 | 插入一个带有书签符号的按钮。操作自动设置为调用书签——您只需指定要使用哪个即可。\
  \ |\n| 空白 | 插入一个没有图标的按钮。默认未指定操作。 |\n\n### 更改按钮类型\n\n幸运的是，您最初选择的按钮类型并非一成不变。您可以快速轻松地在按钮类型之间切换。\n\
  \n1. 选择您要修改的按钮。\n\n2. 在**可视化**窗格中，展开**操作**部分。\n\n3. 确保**操作**部分设置为**开**并展开它。\n\n\
  4. 从可用操作列表中选择一个不同的操作。\n\n\n\n### 按钮操作\n\n目前有四种预定义的操作，你可以将其“附加”到 Power BI 仪表板按钮上，从而为报表增加交互性。表\
  \ 24-3 展示了可以关联到按钮的操作。\n\n**表 24-3** 按钮操作\n\n| 选项 | 描述 |\n| --- | --- |\n| 返回 | 添加一个预设为返回上一页的后退按钮。\
  \ |\n| 书签 | 此类型按钮允许你选择一个要应用的书签。这使你可以修改页面筛选器、切片器和排序顺序，或者跳转到另一个页面——或者两者兼而有之。 |\n|\
  \ 问答 | 显示一个问答资源管理器窗口。 |\n| Web URL | 在“可视化”窗格的“操作”部分选择“Web URL”后，跳转到你输入的 URL。 |\n\
  \n> **注意**  \n> 当你仅使用按钮在页面之间移动时，通常最好为你要使用的目标页面定义一个书签，且*不*启用该书签的数据和显示选项（如前所述）。这将确保你跳转到目标页面时，不会添加意外的筛选器或切片器。\n\
  \n### 格式化按钮\n\n如你所料，Power BI 允许你像格式化仪表板中的任何视觉对象一样格式化按钮。你可以格式化的元素包括：\n\n* 按钮文本——实际上，你可以定义三种不同的按钮文本：\n\
  \  * *默认状态*：按钮文本的标准外观\n  * *悬停状态*：当光标置于按钮上方时显示的文本\n  * *按下状态*：按钮被按下后的状态（假设任何按钮操作不会立即显示新页面）\n\
  * 轮廓\n* 按钮填充\n* 按钮背景\n\n从技术上讲，你还可以为按钮添加标题和边框，但在我看来，鉴于其他可用选项，这些在很大程度上是多余的。\n\n![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig12_HTML.jpg](img/370912_3_En_24_Fig12_HTML.jpg)\n\
  \n**图 24-12** 按钮格式化\n\n1. 选择你想要修改的按钮。\n2. 在“可视化”窗格中，展开“按钮文本”部分。\n3. 从可能的按钮状态弹出列表中选择“悬停时”。\n\
  4. 为悬停状态添加文本。我将简单添加**悬停**。\n5. 修改字体、字体颜色、对齐方式和文本大小。\n6. 展开“图标”部分，然后从可用图标列表中选择一个不同的图标。\n\
  7. 展开“轮廓”部分，修改默认状态的轮廓颜色和轮廓粗细。\n8. 从可能的按钮状态弹出列表中选择“悬停时”。\n9. 修改悬停状态的轮廓颜色和轮廓粗细。\n\
  10. 展开“填充”部分，修改默认状态的填充颜色。\n11. 从可能的按钮状态弹出列表中选择“悬停时”。\n12. 修改悬停状态的填充颜色。\n13. 你可以在图\
  \ 24-12 中看到更改两个按钮状态格式化的效果。\n\n> **注意**  \n> Power BI Desktop 目前不允许你将自定义图像应用到按钮。但是，正如你在下一节中看到的，你可以使用图像和形状作为按钮来产生相同的效果。\n\
  \n### 使用图像和形状作为按钮\n\n很可能是为了弥补当前无法将自定义图像添加到按钮的不足，Power BI Desktop 仍然允许你使用图像和形状作为按钮。值得庆幸的是，这非常简单——因为它与你刚才看到的为按钮设置操作方法完全类似。\n\
  \n以下是一个示例，演示如何使用你之前创建的书签跳转到一个页面：\n\n1. 确保你已向要跳转到的页面（“目标”页面）添加了一个书签。\n2. 在另一个页面中，添加或选择你想要用作单击元素以跳转到目标页面的图像。\n\
  3. 选中图像后，展开“可视化”窗格中的“操作”部分。\n4. 确保“操作”部分设置为“开”并将其展开。\n5. 从可用操作列表中选择“书签”。\n6. 从可用书签列表中选择书签名称。\n\
  \n> **注意**  \n> 你可以将完全相同的技术应用于从“插入”功能区添加的任何形状。\n\n### 跨多个页面应用切片器\n\n第 22 章向你介绍了切片器的概念及其在\
  \ Power BI 仪表板中的应用。然而，切片器还有更多秘密有待揭示。具体来说，你可以微调切片器在多页报表中的应用，并指定哪些切片器应用于 Power BI\
  \ 报表中的哪些页面。这意味着，例如，你可以为报表创建一个包含一系列切片器的“主页”，然后调整 Power BI Desktop，确保此页面上的任何或所有切片器将自动应用于其他选定的页面。这为读者保证了可预测且令人安心的用户体验，同时也避免了跨多个页面复制和粘贴一组切片器的必要性。另一个不可忽视的因素是，这种方法释放了报表各页面上相当大的屏幕空间。\n\
  \n假设你有一个报表，其第一页名为“封面页”，包含几个切片器，此外还有三个其他页面。以下介绍如何将初始页面中的切片器应用到其他页面：\n\n1. 单击包含切片器的页面选项卡。\n\
  2. 选择你希望将其效果扩展到其他页面的切片器。\n3. 在“视图”窗格中，单击“同步切片器”。“同步切片器”窗格将出现，显示报表中所有页面的列表。页面列表的第三列（指示切片器在报表页面上是否可见）当前页已被选中。你可以在图\
  \ 24-13 中看到这一点。\n\n   ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig13_HTML.jpg](img/370912_3_En_24_Fig13_HTML.jpg)\n\
  \n   **图 24-13** “同步切片器”窗格\n\n4. 为所有其他页面选中第二列（指定切片器在该页面上处于活动状态）。你可以在图 24-14 中看到这一点。\n\
  \n   ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig14_HTML.jpg](img/370912_3_En_24_Fig14_HTML.jpg)\n\
  \n   **图 24-14** 切片器跨多个页面同步后的“同步切片器”窗格\n\n5. 单击窗格右上角的叉号图标关闭“同步切片器”窗格。\n\n现在，当你使用选定的切片器交互式地筛选数据时，切片器的效果将扩展到当前页面之外，影响所有选定的页面。\n\
  \n> **注意**  \n> 这可能看起来违反直觉，但你必须为*当前页面*选中同步框——否则切片器将对其他页面无效。\n\n### 跨多个页面设置切片器可见性\n\
  \n如果你不仅希望切片器跨多个页面产生效果，还希望它们出现在将主动筛选数据的页面上，那么你只需同时选中可见性列中的框和同步框即可。这避免了必须跨多个页面复制和粘贴切片器。另一个优点是，在初始页面上格式化或重新定位源切片器将导致在其他页面上已设为可见的切片器自动更新以反映任何更改。\n\
  \n> **注意**  \n> 目前无法通过按住 `Ctrl` 键单击源切片器来同时选择多个切片器并定义它们的应用和可见性。\n\n\n\n## 模板\n\n\
  在本书的结尾，我想让你关注一种 Power BI 技术，它能在批量制作仪表板时为你节省大量时间。这就是使用包含以下内容的模板：\n\n-   标准布局（例如徽标和图形元素）。\n\
  -   预定义样式（位于附加到模板文件的 JSON 样式表中）。你在第 23 章中已经见过。\n-   选定的第三方视觉对象。\n\nPower BI 模板本质上就是一个标准的\
  \ Power BI Desktop 文件，它包含上述部分或全部元素，可供你将其用作仪表板的基础，从而呈现标准化的企业外观和风格，同时还能节省时间，因为你无需每次都向新仪表板添加相同的图形元素。\n\
  \n将文件另存为仪表板的步骤如下：\n\n1.  创建一个标准的 Power BI Desktop 文件，其中包含所有元素（徽标、样式、装饰图形、重复元素，例如上次数据更新的日期等）。\n\
  2.  在“文件”菜单中，单击“另存为...”。\n3.  选择 Power BI 模板文件（`*.pbit`）作为保存类型。\n4.  为文件命名，然后单击“保存”。\n\
  5.  将出现“导出模板”对话框，你可以在其中输入模板的说明。你可以在图 24-15 中看到此对话框。\n\n   ![../images/370912_3_En_24_Chapter/370912_3_En_24_Fig15_HTML.jpg](img/370912_3_En_24_Fig15_HTML.jpg)\n\
  \n   图 24-15 导出模板对话框\n\n6.  单击“确定”。\n\n现在，当你想要基于该模板创建新仪表板时：\n\n1.  单击“文件”➤“打开”，然后单击“浏览”按钮。将出现\
  \ Windows 的“打开”对话框。\n2.  在对话框右下角，选择 Power BI 模板文件（`*.pbit`）。\n3.  导航到你创建的模板文件，选中它，然后单击“打开”。\n\
  \n模板将作为一个新文件打开。这意味着当你保存该文件时，Power BI Desktop 会提示你输入文件名——这可以防止你打开现有文件（用作模型）并意外覆盖原始文件。\n\
  \n## 结论\n\n在这最后一章中，你学习了如何增强仪表板，并将其发展为结构化报表，引导用户逐步深入地理解他们正在使用 Power BI 分析的数据。你了解了如何通过在报表内部以及跨不同报表添加数据钻取路径来创建数据故事。\n\
  \n你还发现了如何使用弹出式工具提示来突出显示特定的数据元素，以及如何使用按钮和书签定义报表页面之间的特定路径。随后你学习了如何控制切片器在多页报表的全部或部分页面上的影响。\n\
  \n作为最后的点睛之笔，你了解了如何创建可重复使用的模板，这不仅加快了仪表板的创建速度，还能向用户和观众呈现标准化的企业外观和风格。\n\n至此，你使用 Power\
  \ BI Desktop 创建仪表板的旅程已抵达终点。我真诚地希望你享受这个过程，并能用这个真正强大的工具，在数据分析中获得无限乐趣。\n\n"
