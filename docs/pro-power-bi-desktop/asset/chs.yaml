  \ | 二进制 |\n\n### 切换数据类型\n\n另一种快速更改列数据类型的方法是，单击列标题左侧的数据类型图标，然后从图 8-4 所示的上下文菜单中选择所需的数据类型。\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig4_HTML.jpg](img/370912_3_En_8_Fig4_HTML.jpg)\n\
  \n**图 8-4** 数据类型上下文菜单\n\n### 使用区域设置的数据类型\n\n在转换数据类型时，你也可以选择使用当前区域设置来指定日期、时间和数字格式。这意味着在其他国家/地区打开此\
  \ Power BI Desktop 文件的用户，将看到适应当地格式习惯的日期、时间和数字格式。操作方法如下：\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig5_HTML.jpg](img/370912_3_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5** \"使用区域设置更改类型\"对话框\n\n1. 打开查询编辑器（如果尚未打开）。\n2. 单击列标题左侧的数据类型图标。\n3. 从弹出菜单中选择`使用区域设置`。此时将显示\"\
  `使用区域设置更改类型`\"对话框。\n4. 从可用数据类型列表中选择要应用的新数据类型。\n5. 从全球区域设置列表中选择所需的区域设置。对话框将如图 8-5\
  \ 所示。\n6. 单击`确定`。数据类型将被转换为所选区域设置。`应用的步骤`列表中将添加一个名为`已更改的类型(使用区域设置)`的步骤。\n\n## 替换值\n\
  \n加载的某些数据可能需要通过一种全局查找并替换的操作，用其他值替换特定值——就像在文档中操作一样。例如，你可能需要标准化某个汽车品牌（以当前示例数据集为例）因输入错误导致的拼写不一致。要执行此特定的数据清理操作，请执行以下步骤：\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig6_HTML.jpg](img/370912_3_En_8_Fig6_HTML.jpg)\n\
  \n**图 8-6** \"替换值\"对话框\n\n1. 在查询编辑器中，单击包含要替换数据的列的标题。该列将被选中。在此示例中，我以文件`CH08Sample1.pbix`中的`Model`列为例。\n\
  2. 在\"开始\"功能区中，单击`替换值`按钮。此时将显示\"`替换值`\"对话框。\n3. 在`要查找的值`框中，输入要替换的文本或数字。在此示例中，我使用了`Ghost`。\n\
  4. 在`替换为`框中，输入要替换成的文本或数字。在此示例中，我使用了`Fantôme`，如图 8-6 所示。\n5. 单击`确定`。整个列中的数据将被替换。`已替换值`将添加到`应用的步骤`列表中。\n\
  \n关于此技术，我仅需补充几点说明：\n\n- `替换值`过程会搜索所选列中每条记录里你所查找文本的每一次出现。它不会查找单元格的全部内容，除非你通过在高级选项中勾选`匹配整个单元格内容`复选框来专门指定。\n\
  - 如果在开始此过程之前，你单击的是包含要替换内容的某个单元格（而不是像我们刚才那样单击列标题），Power BI Desktop 会自动将该单元格的内容填入\"\
  `替换值`\"对话框的\"要查找的值\"框中。\n- 你只能替换包含文本元素的列中的文本。这不适用于设置为数值或日期数据类型的列。实际上，如果你输入的值与所选列的数据类型不匹配，你将在\"\
  `替换值`\"对话框中看到一个黄色的警告三角。\n- 如果你确实需要用其他日期或数字替换日期或数值列中的部分内容，那么你可以：\n  - 将该列转换为文本数据类型\n\
  \  - 执行替换操作\n  - 将该列转换回原始数据类型\n\n\"`替换值`\"对话框还有一些可应用的高级选项。你可以通过单击左侧的三角形展开`\"高级选项\"\
  `项来查看它们。这些选项在表 8-3 中进行了解释。\n\n**表 8-3** 高级替换选项\n\n| 选项 | 描述 |\n| --- | --- |\n|\
  \ 匹配整个单元格内容 | 仅当搜索值构成某一行列的全部内容时才进行替换。 |\n| 使用特殊字符替换 | 用非打印字符替换搜索值。 |\n| 制表符 | 用制表符替换搜索值。\
  \ |\n| 回车符 | 用回车符替换搜索值。 |\n| 换行符 | 用换行符替换搜索值。 |\n| 回车符和换行符 | 用回车符和换行符替换搜索值。 |\n\n\
  > **注意：** 替换那些属于其他单词子集的单词是有风险的。在进行任何数据替换时，请确保不会破坏除你打算更改的元素之外的其他内容。\n\n最后，作为一个纯粹无关的评论，我必须补充一点，我绝不建议对劳斯莱斯进行品牌重塑，因为这近乎是汽车领域的亵渎。\n\
  \n\n## 转换列内容\n\nPower BI Desktop 拥有强大的自动化数据转换工具箱，可让你通过多种方式标准化列的内容。这些包括：\n\n- 设置文本列的大小写\n\
  - 对数值数据进行四舍五入或应用数学函数\n- 从日期列中提取日期元素，例如年、月或日（以及其他元素）\n\nPower BI Desktop 对于将转换应用于合适的数据类型非常严格。这是因为转换完全取决于所选列的数据类型。这也再次确认了在数据转换过程的早期——尤其是在*转换列内容之前*——就应该执行应用必要数据类型的操作。请记住，只有当列是数值数据类型时，你才能选择数值转换；只有当列是日期数据类型时，你才能选择日期转换。同样，基于文本的转换只能应用于文本数据类型的列。\n\
  \n## 文本转换\n\n让我们来看一个实际的简单转换操作。作为示例，我将让 Power BI Desktop 将 `Make` 列转换为大写字符。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig7_HTML.jpg](img/370912_3_En_8_Fig7_HTML.jpg)\n\
  \n**图 8-7** “格式”菜单\n\n1. 仍然使用文件 `CH08Example1.pbix`（并已切换到查询编辑器），单击要转换内容的列中的任意位置（此处为\
  \ `Make` 列）。\n2. 在“转换”功能区中，单击“格式”按钮。将出现一个弹出菜单。\n3. 选择 `UPPERCASE`（大写），如图 8-7 所示。\n\
  \n整个列的内容将被转换为大写。`Uppercased Text`（大写文本）将添加到“已应用步骤”列表中。\n\n从“格式”按钮的菜单中可以看出，在格式化（或转换）文本时，你有五个可用的选项。这些选项在表\
  \ 8-4 中进行了说明。\n\n**表 8-4** 文本转换\n\n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | --- |\n\
  | Lowercase（小写） | 将所有文本转换为小写。 | Lowercased Text（小写文本） |\n| Uppercase（大写） | 将所有文本转换为大写。\
  \ | Uppercased Text（大写文本） |\n| Capitalize Each Word（每个单词首字母大写） | 将每个单词的首字母转换为大写。\
  \ | Capitalized Each Word（每个单词已首字母大写） |\n| Trim（修剪） | 移除文本前后的所有空格。 | Trimmed Text（已修剪文本）\
  \ |\n| Clean（清除） | 移除所有不可打印字符。 | Cleaned Text（已清除文本） |\n| Add Prefix（添加前缀） | 在列内容开头添加文本。\
  \ | Added Prefix（已添加前缀） |\n| Add Suffix（添加后缀） | 在列内容末尾添加文本。 | Added Suffix（已添加后缀）\
  \ |\n\n**注意：** 我意识到 Power BI Desktop 查询将文本转换称为*格式化*。尽管如此，这些选项属于整体数据转换选项的一部分。\n\n\
  #### 添加前缀或后缀\n\n你也可以为列中的所有数据添加前缀或后缀。这非常简单：\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig8_HTML.jpg](img/370912_3_En_8_Fig8_HTML.jpg)\n\
  \n**图 8-8** 为文本添加前缀\n\n1. 在查询编辑器中，单击要添加前缀的列内部。\n2. 在“转换”功能区中，选择 `Format ➤ Add Prefix`（格式\
  \ ➤ 添加前缀）。将显示“前缀”对话框，如图 8-8 所示。\n3. 在 `Value`（值）字段中输入要添加的前缀。\n4. 单击 `OK`（确定）。\n\n\
  你指定的前缀将放置在数据集中所选字段的每条记录的起始位置。\n\n**注意：** 如果为数值或日期/时间列添加前缀或后缀，则列数据类型将自动转换为文本。\n\n\
  #### 删除前导和尾随空格\n\n不可避免地，有时你会遇到在数据之前、之后或之前*和*之后带有额外空格的数据。这可能具有隐蔽性，因为它可能导致：\n\n- **数据重复**，因为带有尾随空格的值与没有尾随空格的相同文本被视为*不*相同\n\
  - **排序问题**，因为前导空格会导致元素出现在排序列表的*顶部*\n- **分组错误**，因为带有空格的元素与没有空格的元素不属于同一组\n\n幸运的是，Power\
  \ BI Desktop 查询针对此问题提供了一个高效彻底的解决方案。\n\n1. 仍然使用文件 `CH08Example1.pbix`（并已切换到查询编辑器），单击要转换内容的列中的任意位置（此处为\
  \ `Make` 列）。\n2. 在“转换”功能区中，单击“格式”按钮。将出现一个弹出菜单。\n3. 从菜单中选择 `Trim`（修剪）。\n\n列数据中的所有多余前导和尾随空格都将被移除。这有助于对记录进行排序、分组和去重。\n\
  \n#### 删除不可打印字符\n\n某些源数据可能包含称为不可打印字符的隐蔽元素。即使这些字符对人类来说几乎总是不可见的，但在打印报表和仪表板时也可能导致问题。\n\
  \n如果你怀疑源数据包含不可打印字符，可以像这样轻松地删除它们：\n\n1. 在查询编辑器中，单击你知道（或怀疑）包含不可打印字符的列内部（或选择这些列）。\n\
  2. 单击 `Format ➤ Clean`（格式 ➤ 清除）。\n\nPower BI Desktop 会将 `Cleaned Text`（已清除文本）添加到“已应用步骤”列表中。\n\
  \n\n\n## 数字转换\n\n正如你可以转换基于文本的列的内容一样，你也可以对数值进行转换。例如，假设你想将一列中的所有数字四舍五入到最接近的整数。\n\n\
  ![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig9_HTML.jpg](img/370912_3_En_8_Fig9_HTML.jpg)\n\
  \n图 8-9 舍入选项\n\n1. 在查询编辑器中，点击要转换内容的列中的任意位置（本例中为 `TotalDiscount` 列）。\n2. 在“转换”功能区中，点击“舍入”按钮。将出现一个弹出菜单，显示所有可用选项。你可以在图\
  \ 8-9 中看到它。\n3. 选择**向上舍入**。\n\n整个列中的值将向上舍入到最接近的整数。`Rounded Up` 将被添加到 `Applied Steps`\
  \ 列表中。\n\n其他可用的数值转换在表 8-5 中进行了描述。由于这些数值转换使用了“转换”功能区中的多个按钮，我已指明应使用哪个按钮来获得所需结果。\n\n\
  **表 8-5** 数字转换\n\n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | --- |\n| 舍入 ➤ 向上舍入 | 将每个数字舍入到指定的小数位数。\
  \ | `Rounded Up` |\n| 舍入 ➤ 向下舍入 | 将每个数字向下舍入。 | `Rounded Down` |\n| 舍入… | 将每个数字舍入到你指定的小数位数。如果指定负数，则舍入到给定的小数位。\
  \ | `Rounded Off` |\n| 科学 ➤ 绝对值 | 使数字成为绝对值（正数）。 |   |\n| 科学 ➤ 幂 ➤ 平方 | 返回每个单元格中数字的平方。\
  \ | `Calculated Square` |\n| 科学 ➤ 幂 ➤ 立方 | 返回每个单元格中数字的立方。 | `Calculated Cube Value`\
  \ |\n| 科学 ➤ 幂 ➤ 乘幂 | 将每个数字提高到指定的幂次。 | `Calculated Power` |\n| 科学 ➤ 平方根 | 返回每个单元格中数字的平方根。\
  \ | `Square Root` |\n| 科学 ➤ 指数 | 返回每个单元格中数字的指数。 | `Calculated Exponent` |\n| 科学\
  \ ➤ 对数 ➤ 以 10 为底 | 返回每个单元格中数字的以 10 为底的对数。 | `Calculated Base 10 Logarithm` |\n|\
  \ 科学 ➤ 对数 ➤ 自然对数 | 返回每个单元格中数字的自然对数。 | `Calculated Natural Logarithm` |\n| 科学 ➤ 阶乘\
  \ | 计算列中数字的阶乘。 | `Calculated Factorial` |\n| 三角函数 ➤ 正弦 | 计算列中数字的正弦值。 | `Calculated\
  \ Sine` |\n| 三角函数 ➤ 余弦 | 计算列中数字的余弦值。 | `Calculated Cosine` |\n| 三角函数 ➤ 正切 | 计算列中数字的正切值。\
  \ | `Calculated Tangent` |\n| 三角函数 ➤ 反正弦 | 计算列中数字的反正弦值。 | `Calculated ArcSine` |\n\
  | 三角函数 ➤ 反余弦 | 计算列中数字的反余弦值。 | `Calculated ArcCosine` |\n| 三角函数 ➤ 反正切 | 计算列中数字的反正切值。\
  \ | `Calculated ArcTangent` |\n\n> **注意：** Power BI Desktop 查询甚至不会让你尝试对文本或日期应用数字转换。如果你点击字母或日期列内部，相关按钮将保持灰色不可用状态。\n\
  \n#### 计算数字\n\nPower BI Desktop 查询还可以对列中的数字应用简单算术运算。例如，假设你想将所有销售价格乘以 110%，作为预测的一部分。操作方法如下：\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig10_HTML.jpg](img/370912_3_En_8_Fig10_HTML.jpg)\n\
  \n图 8-10 对列应用计算\n\n1. 仍使用文件 `CH08Example1.pbix`（并已切换到查询编辑器），点击任意数字列内部。在此示例中，我使用了\
  \ `SalePrice` 列。\n2. 点击“转换”功能区中的 `Standard` 按钮。菜单将如图 8-10 所示弹出。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig11_HTML.jpg](img/370912_3_En_8_Fig11_HTML.jpg)\n\
  \n图 8-11 对列应用计算\n\n3. 点击 `Multiply`。将出现 `Multiply` 对话框。\n4. 在 `Value` 框中输入 `1.1`。对话框将如图\
  \ 8-11 所示。\n5. 点击**确定**。\n\n所选列中的所有数字将乘以 `1.1`。换句话说，它们现在是原始值的 110%。表 8-6 描述了可以在\
  \ Power BI Desktop 查询中执行的可能的数学运算。\n\n**表 8-6** 应用基本计算\n\n| 转换 | 描述 | 已应用步骤定义 |\n\
  | --- | --- | --- |\n| 加法 | 将一个选定值添加到列中的数字上。 | `Added to Column` |\n| 乘法 | 将列中的数字乘以一个选定值。\
  \ | `Multiplied Column` |\n| 减法 | 从列中的数字中减去一个选定值。 | `Subtracted from Column` |\n\
  | 除法 | 将列中的数字除以一个选定值。 | `Divided Column` |\n| 整数除法 | 将列中的数字除以一个选定值并移除余数。 | `Integer-Divided\
  \ Column` |\n| 取模 | 将列中的数字除以一个选定值并仅保留余数。 | `Calculated Modulo` |\n| 百分比 | 将选定的百分比应用于该列。\
  \ | `Calculated Percentage` |\n| 百分比 | 将列中的值表示为您输入值的百分比。 | `Calculated Percent Of`\
  \ |\n\n> **注意：** 你也可以在 Power BI Desktop 数据视图中执行多种类型的计算，而避免在查询编辑器中进行计算。事实上，许多 Power\
  \ BI Desktop 纯粹主义者似乎更喜欢将任何类似于计算的操作放在数据模型内部进行，而不是在查询阶段。和以往一样，我将由你决定更喜欢哪种方法。请注意，某些繁重的转换如果在运行时计算可能会拖慢报表速度，而其他操作只有作为深思熟虑的计算过程的一部分时才有效。\n\
  \n最后，请务必记住，当你执行此类操作时，你正在修改数据。在实际应用中，在对列中包含的数据进行重大修改之前，复制该列可能更安全。这允许你保留初始数据可用，尽管代价是增加加载时间和\
  \ Power BI Desktop 文件的大小。\n\n\n\n## 日期转换\n\n日期转换遵循与文本和数字转换相似的原理。例如，以下操作演示如何从日期中提取月份：\n\
  \n1.  仍然使用文件 `CH08Example1.pbix`（并已切换至查询编辑器），点击 `InvoiceDate` 列内部。\n2.  在“转换”功能区中，点击“日期”按钮。此时将显示菜单。\n\
  3.  点击“年”。此时将显示子菜单。\n4.  选择“年”。日期的年份部分将替换 `InvoiceDate` 列中的所有日期。\n\n其他可能的日期转换操作如表\
  \ 8-7 所示。\n\n**表 8-7** 日期转换\n\n| 转换 | 说明 | 已应用步骤定义 |\n| --- | --- | --- |\n| 年龄\
  \ | 计算原始日期与当前本地时间之间的日期和时间差（以天和小时计）。 | 计算的年龄 |\n| 仅日期 | 将数据转换为不含时间元素的日期。 | 计算的日期\
  \ |\n| 年 ➤ 年 | 从日期中提取年份。 | 计算的年 |\n| 年 ➤ 年初 | 返回日期所在年份的第一天。 | 计算的年初 |\n| 年 ➤ 年末\
  \ | 返回日期所在年份的最后一天。 | 计算的年末 |\n| 月 ➤ 月 | 从日期中提取月份的数字。 | 计算的月 |\n| 月 ➤ 月初 | 返回日期所在月份的第一天。\
  \ | 计算的月初 |\n| 月 ➤ 月末 | 返回日期所在月份的最后一天。 | 计算的月末 |\n| 月 ➤ 月天数 | 返回日期所在月份的天数。 | 计算的月天数\
  \ |\n| 月 ➤ 月名称 | 返回日期所在月份的名称。 | 计算的月名称 |\n| 日 ➤ 日 | 从日期中提取天数。 | 计算的日 |\n| 日 ➤ 星期几\
  \ | 将星期几作为数字返回（星期一为 1，星期二为 2，依此类推）。 | 计算的星期几 |\n| 日 ➤ 年中天数 | 计算日期自年初以来的天数。 | 计算的年中天数\
  \ |\n| 日 ➤ 日初 | 将值转换为日期和时间的当天开始时刻。 | 计算的日初 |\n| 日 ➤ 日末 | 将值转换为日期和时间的当天结束时刻。 | 计算的日末\
  \ |\n| 日 ➤ 日名称 | 将星期几作为星期名称返回。 | 计算的日名称 |\n| 季度 ➤ 季度 | 返回日期所在的日历季度。 | 计算的季度 |\n\
  | 季度 ➤ 季初 | 返回日期所在日历季度的起始日期。 | 计算的季初 |\n| 季度 ➤ 季末 | 返回日期所在日历季度的结束日期。 | 计算的季末 |\n\
  | 周 ➤ 年中周数 | 计算日期自年初以来的周数。 | 计算的年中周数 |\n| 周 ➤ 月中周数 | 计算日期自月初以来的周数。 | 计算的月中周数 |\n\
  | 周 ➤ 周初 | 返回日期所在周的第一天（星期日）的日期。 | 计算的周初 |\n| 周 ➤ 周末 | 返回日期所在周的最后一天（星期六）的日期。 | 计算的周末\
  \ |\n\n## 时间转换\n\n您也可以使用 Power BI Desktop 查询将日期/时间或时间值转换为其组成部分。这与应用日期转换的方式极为相似，但为求完整，下面说明具体操作方法：\n\
  \n1.  点击 `InvoiceDate` 列内部。\n2.  在“转换”功能区中，点击“时间”按钮。此时将显示菜单。\n3.  点击“小时”。时间的小时部分将替换\
  \ `InvoiceDate` 列中的所有值。\n\n> **注意：** 时间转换只能应用于日期/时间或时间数据类型的列。\n\n时间转换的范围如表 8-8 所示。\n\
  \n**表 8-8** 时间转换\n\n| 转换 | 说明 | 已应用步骤定义 |\n| --- | --- | --- |\n| 仅时间 | 提取日期和时间中的时间部分。\
  \ | 提取的时间 |\n| 本地时间 | 根据日期/时间和时区值将日期/时间转换为本地时间。 | 提取的本地时间 |\n| 分析 | 从文本中提取日期和/或日期/时间元素。\
  \ | 分析的日期时间 |\n| 小时 ➤ 小时 | 从日期/时间或日期值中提取小时。 | 提取的小时 |\n| 小时 ➤ 小时初 | 从日期/时间或时间值中返回小时的开始时刻。\
  \ | 计算的小时初 |\n| 小时 ➤ 小时末 | 从日期/时间或时间值中返回小时的结束时刻。 | 计算的小时末 |\n| 分钟 | 从日期/时间或时间值中提取分钟。\
  \ | 提取的分钟 |\n| 秒 | 从日期/时间或时间值中提取秒。 | 提取的秒 |\n| 最早 | 从日期/时间或时间值中返回最早的时间。 | 计算的最早\
  \ |\n| 最晚 | 从日期/时间或时间值中返回最晚的时间。 | 计算的最晚 |\n\n> **注意：** 在实际应用中，您可能希望保留源列不变，并对该列的副本应用数字或日期转换。为此，只需应用相同的转换技术，但使用“添加列”功能区中的按钮，而非“转换”功能区中的按钮。\n\
  \n\n\n### 持续时间\n\n如果某列中的值可以解释为持续时间（以天、小时、分钟和秒为单位），则 Power BI Desktop 查询可以提取持续时间的组成部分作为数据转换。但是，要实现这一点，该列*必须*设置为持续时间数据类型。这意味着该列的内容必须能够被\
  \ Power BI Desktop 解释为持续时间。任何与此数据类型不兼容的值都将被设置为错误值。\n\n如果你有持续时间数据，可以像这样提取其组成部分：\n\
  \n1.  继续使用文件 `CH08Example1.pbix`（并切换到查询编辑器），点击 `InvoiceDate` 列内部。\n2.  在“转换”功能区中，点击“持续时间”按钮。将出现一个菜单。\n\
  3.  点击“小时”。时间的小时部分将替换 `InvoiceDate` 列中的所有值。\n\n持续时间转换的范围如表 8-9 所示。\n\n表 8-9 持续时间转换\n\
  \n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | --- |\n| 天 | 从持续时间值中隔离出天元素。 | 提取的天数 |\n|\
  \ 小时 | 从持续时间值中隔离出小时元素。 | 提取的小时数 |\n| 分钟 | 从持续时间值中隔离出分钟元素。 | 提取的分钟数 |\n| 秒 | 从持续时间值中隔离出秒元素。\
  \ | 提取的秒数 |\n| 总天数 | 将持续时间值显示为天数加上代表小时、分钟和秒的小数部分。 | 计算的总天数 |\n| 总小时数 | 将持续时间值显示为小时数加上代表分钟和秒的小数部分。\
  \ | 计算的总小时数 |\n| 总分钟数 | 将持续时间值显示为分钟数加上代表秒的小数部分。 | 计算的总分钟数 |\n| 总秒数 | 将持续时间值显示为秒数加上代表毫秒的小数部分。\
  \ | 计算的总秒数 |\n| 乘 | 将持续时间（及其所有组成部分）乘以你输入的值。 | 已乘列 |\n| 除 | 将持续时间（及其所有组成部分）除以你输入的值。\
  \ | 已除列 |\n| 统计信息 ➤ 求和 | 返回列中所有持续时间元素的总和。 | 计算的求和 |\n| 统计信息 ➤ 最小值 | 返回列中所有持续时间元素的最小值。\
  \ | 计算的最小值 |\n| 统计信息 ➤ 最大值 | 返回列中所有持续时间元素的最大值。 | 计算的最大值 |\n| 统计信息 ➤ 中位数 | 返回列中所有持续时间元素的中位数。\
  \ | 计算的中位数 |\n| 统计信息 ➤ 平均值 | 返回列中所有持续时间元素的平均值。 | 计算的平均值 |\n\n**注意**\n\n如果对持续时间进行乘法或除法运算，Power\
  \ BI Desktop 查询会显示一个对话框，以便你输入要乘以或除以该持续时间的值。\n\n### 向下填充空单元格\n\n想象一个数据源，其中的数据以矩阵样式结构进入\
  \ Power BI Desktop。结果是，某些列只包含单个元素的示例，然后是一系列空单元格，直到列表中的下一个元素。如果这很难想象，那么请看图 8-12 中所示的示例文件\
  \ `CarMakeAndModelMatrix.xlsx`。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig12_HTML.jpg](img/370912_3_En_8_Fig12_HTML.jpg)\n\
  \n图 8-12 Excel 中的矩阵数据表\n\n所有这些空白单元格都是问题，因为我们需要一个完整的数据表——或者更确切地说，如果 Power BI Desktop\
  \ 没有一种非常酷的方法来克服这一特定困难，它们就会成为问题。请执行以下操作来解决此问题：\n\n1.  打开一个新的 Power BI Desktop 文件。\n\
  2.  在启动屏幕中，点击“获取数据”。\n3.  在“获取数据”对话框中，选择“Excel”。然后点击“连接”并导航到 `C:\\PowerBiDesktopSamples\\\
  CarMakeAndModelMatrix.xlsx`。\n4.  点击“打开”，选择“Sheet1”，然后点击“转换数据”。这将直接带你进入查询编辑器。\n\
  5.  点击包含空单元格的列内部；确保点击的位置是你希望用上方第一个非空单元格的内容替换空单元格的位置。\n6.  在“转换”功能区中，点击“填充”。将出现一个菜单。\n\
  7.  选择“向下”。空白单元格将被上方第一个非空单元格的值替换。`已填充向下` 将添加到“已应用步骤”列表中。\n\n现在，该表格将如图 8-13 所示。\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig13_HTML.jpg](img/370912_3_En_8_Fig13_HTML.jpg)\n\
  \n图 8-13 空单元格已被正确数据替换的数据表\n\n**注意**\n\n此技术旨在处理一个相当具体的问题，并且仅当导入的数据按包含缺失元素的列进行分组时才真正有效。\n\
  \n虽然不常见，但您也可以使用此技术用下方的值填充空单元格。如果需要这样做，只需从“转换”功能区中选择“填充” ➤ “向上”。无论采用哪种方式，都需要注意该技术适用于整个列。\n\
  \n### 提取列内容的一部分\n\n很多时候，源列的内容可能包含比您实际需要更多的数据。在这种情况下，Power BI Desktop 可以通过仅提取列的一部分来帮助您。此技术的工作原理如下：\n\
  \n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig14_HTML.jpg](img/370912_3_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14 “分隔符前的文本”对话框\n\n1.  加载 `C:\\PowerBiDesktopSamples\\CH08Example1.pbix` 示例文件，然后点击“转换数据”。\n\
  2.  点击 `InvoiceNumber` 列内部。\n3.  在“转换”功能区中，点击“提取” ➤ “分隔符前的文本”。将显示“分隔符前的文本”对话框。\n\
  4.  在“分隔符”字段中输入一个连字符（或减号）。该对话框将如图 8-14 所示。\n5.  点击“确定”。字段内容将被替换为连字符之前的字符。一个名为 `提取的分隔符前文本`\
  \ 的步骤将添加到“已应用步骤”列表中。\n\n“提取”功能允许您从多种方式中进行选择，以从列中提取数据子集。当前可用的选项在表 8-10 中进行了解释。\n\n\
  表 8-10 提取转换\n\n| 转换 | 描述 | 已应用步骤定义 |\n| --- | --- | --- |\n| 长度 | 显示字段内容的字符长度。 |\
  \ 提取的长度 |\n| 首字符 | 显示从字段左侧开始指定数量的字符。 | 提取的首字符 |\n| 尾字符 | 显示从字段右侧开始指定数量的字符。 | 提取的尾字符\
  \ |\n| 范围 | 显示在指定的起始和结束位置之间（从字段左侧算起，以字符为单位）指定数量的字符。 | 提取的范围 |\n| 分隔符前的文本 | 显示在指定字符之前出现的所有文本。\
  \ | 提取的分隔符前文本 |\n| 分隔符后的文本 | 显示在指定字符之后出现的所有文本。 | 提取的分隔符后文本 |\n| 分隔符间的文本 | 显示在两个指定字符之间出现的所有文本。\
  \ | 提取的分隔符间文本 |\n\n#### 高级提取选项\n\n三个提取选项（分隔符前的文本、分隔符后的文本和分隔符间的文本）允许您应用一些高级选项，这些选项使您能够在从列中提取数据时更进一步。这些技术将在以下两节中进行说明。\n\
  \n\n\n#### 分隔符前后的文本\n\n如果你正在提取列内容的一部分，并使用分隔符来隔离要保留的文本，那么你还有几个额外的选项可供选择。\n\n你可以通过点击`高级选项`，从图\
  \ 8-14 所示的对话框中访问这些选项。此时，对话框将如图 8-15 所示。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig15_HTML.jpg](img/370912_3_En_8_Fig15_HTML.jpg)\n\
  \n**图 8-15** — “分隔符前的文本”与“分隔符后的文本”对话框的高级选项\n\n你现在拥有的两个选项是：\n\n- **扫描分隔符**：此选项允许你选择从列内容的开头向前查找，还是从列内容的末尾向后查找，以定位你要搜索的分隔符。\n\
  - **要跳过的分隔符数量**：在此处，你可以指定你感兴趣的是第 *n* 次出现的分隔符。\n\n#### 分隔符间的文本\n\n“分隔符间的文本”对话框中的高级选项，本质上允许你应用之前看到的相同选项，只不过同时应用于起始分隔符和结束分隔符。在图\
  \ 8-16 的“分隔符间的文本”对话框中你可以看到这一点。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig16_HTML.jpg](img/370912_3_En_8_Fig16_HTML.jpg)\n\
  \n**图 8-16** — “分隔符间的文本”对话框的高级选项\n\n> **注意**：`提取`按钮可以在`转换`和`新列`两个功能区中找到。如果你从`转换`功能区执行此操作，则现有列的内容将被替换。如果你使用`添加列`功能区中的按钮，则包含提取文本的新列将添加到任何现有列的右侧。\n\
  \n### 复制列\n\n有时你只需要简单复制一列，不增不减。这时就轮到`复制列`按钮上场了。\n\n1. 加载 `C:\\PowerBiDesktopSamples\\\
  CH08Example1.pbix` 示例文件。\n2. 打开 Power BI Desktop 查询编辑器。\n3. 点击你想要复制的列内部（或列标题）。在本示例中，我将使用\
  \ `Make` 列。\n4. 在`添加列`功能区中，点击`复制列`按钮。几秒钟后，列的副本将在现有表格的右侧创建。`复制的列`将出现在`应用的步骤`列表中。\n\
  5. 滚动到表格右侧并重命名现有列；它当前名为 `Make-Copy`。\n\n> **注意**：复制列的名称为`原始列名称-副本`。我发现，在数据混合处理过程中，尽早重命名列的副本会很有帮助。\n\
  \n## 拆分列\n\n有时，源列包含的数据确实需要拆分成较小的部分，分布在两列或多列中。以下是这种情况的典型示例：\n\n-   某列包含一个元素列表，元素之间由特定字符（称为*分隔符*）分隔。\n\
  -   某列包含一个元素列表，但元素可以在列中的特定位置进行划分。\n-   某列包含拼接文本，需要拆分成其组成元素（例如银行账号和社会安全号码）。\n\n以下简短章节将说明如何处理这些情况。\n\
  \n#### 按分隔符拆分列\n\n这是你可能偶尔遇到的另一个需求。导入的数据中有一个列需要进一步拆分为多个列。想象一个文本文件，其中的列由分号分隔，并且这些细分列中的每一个都包含一个以逗号分隔的元素列表。导入文件后，你需要进一步分离这个使用了不同分隔符的列的内容。\n\
  \n以下是将数据从一个列拆分到多个列的方法：\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig17_HTML.jpg](img/370912_3_En_8_Fig17_HTML.jpg)\n\
  \n**图 8-17** — 使用分隔符拆分列\n\n1. 打开 `C:\\PowerBiDesktopSamples\\CH08DataToParse.pbix`\
  \ 示例文件并切换到查询编辑器。\n2. 在`转换`功能区，点击`将第一行用作标题`。\n3. 点击 `ClientList` 列内部。你可以看到此列包含多个数据元素，每个元素由分号分隔。\n\
  4. 在`转换`功能区，点击`拆分列` ➤ `按分隔符`。将出现“按分隔符拆分列”对话框。\n5. 从“选择或输入分隔符”弹出菜单的可用选项列表中选择`分号`（尽管查询编辑器可能已经检测到了）。\n\
  6. 点击“分隔符的每次出现”作为拆分文本列的位置。对话框应如图 8-17 所示。\n7. 点击`确定`。`按分隔符拆分列`将出现在`应用的步骤`列表中。\n\n\
  原始列被替换，所有新列被命名为 `InvoiceNumber.1`、`InvoiceNumber.2`，依此类推。创建的新列数量与分隔符数量相同；每个列都被命名为\
  \ (`Column.n`) 并按顺序编号。此操作的结果如图 8-18 所示。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig18_HTML.jpg](img/370912_3_En_8_Fig18_HTML.jpg)\n\
  \n**图 8-18** — 拆分列的结果\n\n此特定过程有多个选项，就数据而言，它们的后果可能相当深远。表 8-11 包含了对可用选项的描述。\n\n**表\
  \ 8-11** — 分隔符拆分选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `冒号` | 使用冒号 (`:`) 作为分隔符。 |\n\
  | `逗号` | 使用逗号 (`,`) 作为分隔符。 |\n| `等号` | 使用等号 (`=`) 作为分隔符。 |\n| `分号` | 使用分号 (`;`)\
  \ 作为分隔符。 |\n| `空格` | 使用空格 ( ) 作为分隔符。 |\n| `制表符` | 使用制表符作为分隔符。 |\n| `自定义` | 允许你输入自定义分隔符。\
  \ |\n| `在最左侧的分隔符处` | 仅在分隔符第一次出现时拆分一次列。 |\n| `在最右侧的分隔符处` | 仅在分隔符最后一次出现时拆分一次列。 |\n\
  | `在分隔符的每次出现处` | 将列拆分为与分隔符数量相同的列数。 |\n| `拆分为列` | 这保持数据集中的行数不变，并为拆分操作产生的每个新元素创建新列。\
  \ |\n| `拆分为行` | 为拆分操作产生的每个新元素创建新行，并根据拆分元素的数量多次复制现有记录。 |\n\n#### 分隔符拆分的高级选项\n\n按分隔符拆分文本时，有一些可用的高级选项。当你点击“按分隔符拆分列”对话框中的`高级选项`元素时，这些选项会显示出来，并在表\
  \ 8-12 中进行了解释。\n\n**表 8-12** — 分隔符拆分选项\n\n| 高级选项 ➤ `要拆分成的列数` | 允许你设置最大列数，数据将以给定的字符数为单位分块拆分到这些列中。任何额外的列都将被放置在最后一列。\
  \ |\n| --- | --- |\n| 高级选项 ➤ `引号字符` | 包含在双引号内的文本中的分隔符不会用于将文本拆分为列。将此选项设置为“无”将拆分引号内的元素。\
  \ |\n| `使用特殊字符拆分` | 启用`插入特殊字符`按钮。然后你可以点击此按钮并选择用于拆分数据的特殊字符。可选的有`制表符`、`回车符`、`换行符`、`回车符和换行符`或不间断空格。\
  \ |\n\n\n\n#### 按字符数拆分列\n\n此主题的另一个变体是，当每一列中的文本具有固定的字符数，并且需要在特定间隔处将其分解为组成部分时。例如，假设您有一个字段，其中每组（特定数量的）字符都有特定含义，并且您希望将其拆分为多列。或者，假设您希望提取最左侧或最右侧的\
  \ *n* 个字符，并保留其余部分。银行账号和社会安全号码就是这样的例子。这时，按字符数拆分列就能派上用场。由于原理与我们刚刚看到的过程非常相似，我将不再重复整个过程。您只需在上一个练习的第\
  \ 5 步中选择“按字符数”菜单选项即可。此类操作的选项见表 8-13。\n\n**表 8-13** 按字符数拆分列时的选项\n\n| 选项 | 描述 |\n\
  | --- | --- |\n| 字符数 | 允许您定义在拆分列之前的数据字符数。 |\n| 一次，尽可能靠左 | 仅在从左侧算起的指定字符数处拆分一次列。 |\n\
  | 一次，尽可能靠右 | 仅在从右侧算起的指定字符数处拆分一次列。 |\n| 重复 | 根据需要多次拆分列，以每隔定义的字符数将其分割成多个段。 |\n| 高级选项\
  \ ➤ 拆分为的列数 | 允许您设置一个最大列数，数据将按指定字符数分块拆分到这些列中。任何额外的列都将被放置在最右侧的列中。 |\n| 拆分为列 | 保持数据集中的行数不变，并为拆分操作产生的每个新元素创建新列。\
  \ |\n| 拆分为行 | 为拆分操作产生的每个新元素创建新行，并根据拆分元素的数量重复现有记录。 |\n\n拆分列时有几点需要注意：\n- 按分隔符拆分时，Power\
  \ BI Desktop 会尽力推测源列必须拆分的最大列数。如果它猜错了（您可以展开“高级选项”框查看其估算值），您可以在此处覆盖该数字。\n- 如果您选择“自定义分隔符”，Power\
  \ BI Desktop 会在对话框中显示一个新框，您可以在其中输入特定的分隔符。\n- 并非每条记录都必须具有相同数量的分隔符。如果某行的拆分元素较少，Power\
  \ BI Desktop 会简单地将最右侧的列留空。\n\n**注意：** 仅当列为文本数据时才能拆分列。如果您尝试拆分日期或数字列，“拆分列”按钮将保持灰色不可用状态。\n\
  \n## 合并列\n\n当您阅读本节标题时，可能会感到某种似曾相识。毕竟，我们在前一章中已经看到了如何合并列（即如何将多个列中的数据融合到一个更宽的单一列中），不是吗？是的，我们确实做过。然而，这并非本章中您唯一一次看到之前尝试过的操作。这是因为\
  \ Power BI Desktop 查询在“添加列”功能区中重复了“转换”功能区中的几个选项。虽然这些功能的工作方式大致相同，但有一个本质区别。如果您从“转换”功能区选择一个选项，那么您选择的列将被*修改*。如果您从“添加列”功能区选择类似的选项，则原始列将不会被更改，而是会添加一个包含数据转换结果的*新列*。\n\
  \n合并列就是一个很好的例子。由于我在前一章中已经详细介绍了如何执行这种数据转换，因此我将不再赘述。只需说明，如果您按住 Ctrl 键单击两个或多个列的标题，然后在“添加列”功能区中单击“合并列”，您仍然会看到所选列的数据被连接到一个单一的列中。但是，这次原始列*会保留*在数据集中。新列被命名为“已合并”，与您使用“转换”功能区合并列时选择的第一个列的情况完全相同。\n\
  \n以下是可以覆盖现有列中的数据*或*将结果显示为新列的其他函数：\n- *格式*：修剪文本或更改文本的大小写\n- *提取*：获取列的一部分并据此创建另一列\n\
  - *解析*：添加一列，其中包含作为 JSON 或 XML 字符串的源列数据\n- *统计信息*：创建聚合数值的新列\n- *标准*：创建计算所得数值的新列\n\
  - *科学*：通过将某些类型的数学运算应用于列中的值来创建新列\n- *三角*：通过将某些类型的三角运算应用于列中的值来创建新列\n- *舍入*：通过舍入列中的值来创建新列\n\
  - *信息*：创建一个新列，指示列中值的算术信息\n- *日期*：通过从日期列的值中提取日期元素来创建新列\n- *时间*：通过从时间或日期/时间列的值中提取时间元素来创建新列\n\
  - *持续时间*：通过计算两个日期或日期/时间之间的持续时间来创建新列\n\n在转换数据时，关键在于决定在应用这些函数之前是否想要或需要保留原始列。然而，同样地，如果您后来决定做出了错误的决定，这也不是根本问题，因为您可以随时回溯。或者，您也可以始终决定默认插入新列，并在数据转换过程的后续阶段删除任何您确实不需要的列。\n\
  \n\n\n## 通过示例创建列\n\n如果你对 Excel 或 Power Pivot 公式不太熟悉，自己创建列可能会有些胆怯，因此 Power BI Desktop\
  \ 开发团队尝试通过添加另一种创建自定义列的方式来简化你的工作。除了通过列名（并需要处理方括号和其他特殊字符）来引用列之外，你还可以通过行中的实际数据来构建新列。\n\
  \n以下步骤展示了如何实现此操作：\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig19_HTML.jpg](img/370912_3_En_8_Fig19_HTML.jpg)\n\
  \n**图 8-19** 通过示例创建列\n\n1. 加载示例文件 `C:\\PowerBiDesktopSamples\\CH08Example1.pbix`。\n\
  \n2. 单击 `Transform Data`。\n\n3. 在 `Add Column` 功能区中，单击 `Column From Examples`。数据上方将出现一种新型的公式栏，如图\
  \ 8-19 所示。同时，在现有数据的右侧将创建一个新的空列。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig20_HTML.jpg](img/370912_3_En_8_Fig20_HTML.jpg)\n\
  \n**图 8-20** 通过示例创建列时显示行中的数据\n\n1. 双击右侧新列的内部。将显示来自每个字段的数据列表，如图 8-20 所示。\n\n2. 双击\
  \ `Red` 以选择 `Color` 列中的数据。\n\n3. 输入一个空格、一个连字符和一个空格，然后输入 `Camargue`（这是该行模型的名称）。\n\
  \n4. 单击顶部公式栏中的 `OK`。\n\n`Power BI Desktop` 将添加一个新列，其中包含颜色、分隔符和模型。`Inserted Merged\
  \ Column` 将作为新步骤添加到 `Applied Steps` 列表中。\n\n> **注意:** 在 `Column from Examples` 按钮的弹出菜单中，你可以选择将所有现有列作为示例的基础，或仅选择你之前选定的列。\n\
  \n从这个简短示例可以看出，通过示例创建列允许你使用列中的数据，而不是列名。它还消除了编写代码创建新列时必须使用双引号和 & 符号的需要，正如上一节所述。\n\n\
  > **提示:** 如果你选择 `Column From Examples` ➤ `From Selection`，那么当你像本例步骤 6 那样双击新列内部查看数据示例时，将只会看到来自所选列的数据。\n\
  \n## 添加条件列\n\n并非所有附加列都是对现有数据的简单提取或拼接。有时你需要应用一些简单的条件来定义新列的内容。这就是 `Power BI Desktop`\
  \ 的 `Conditional Column` 函数的用武之地。\n\n通过一个实际示例可能最能理解 `Conditional Columns`。假设你想添加一列，其中包含对\
  \ Brilliant British Cars 产品购买者类型的评论。操作方法如下：\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig21_HTML.jpg](img/370912_3_En_8_Fig21_HTML.jpg)\n\
  \n**图 8-21** `Add Conditional Column` 对话框\n\n1. 加载示例文件 `C:\\PowerBiDesktopSamples\\\
  CH08Example1.pbix`。\n\n2. 单击 `Transform Data`。\n\n3. 在 `Add Column` 功能区中，单击 `Conditional\
  \ Column`。将出现 `Add Conditional Column` 对话框。\n\n4. 在“New column name”字段中输入 `BuyerType`。\n\
  \n5. 选择 `Make` 作为列名。\n\n6. 将运算符保留为 `Equals`。\n\n7. 输入 `Rolls Royce` 作为值。\n\n8. 输入\
  \ `Posh` 作为输出。\n\n9. 单击 `Add Rule`。\n\n10. 选择 `Make` 作为列名，将运算符保留为 `Equals`，输入 `Bentley`\
  \ 作为值，并添加 `Classy` 作为输出。\n\n11. 在 `Otherwise` 字段中输入 `Bling`。对话框将如图 8-21 所示。\n\n\
  12. 单击 `OK`。将添加一个新列，其中包含 `Posh`、`Classy` 或 `Bling`，具体取决于每条记录的制造商。`Added Conditional\
  \ Columns` 将作为新步骤出现在 `Applied Steps` 列表中。\n\n从 `Add Conditional Column` 对话框中可以看出，在定义数据匹配逻辑时，它提供了一系列可供调整的选项。这些选项在表\
  \ 8-14 中进行了概述。\n\n**表 8-14** 自定义列运算符\n\n| 运算符 | 描述 |\n| --- | --- |\n| `Equals`\
  \ | 设置必须与所选字段内容匹配的文本，以便应用输出。 |\n| `Does Not Equal` | 设置不得与所选字段内容匹配的文本，以便应用输出。 |\n\
  | `Begins With` | 设置必须位于所选字段左侧的文本，以便应用输出。 |\n| `Does Not Begin With` | 设置不得出现在所选字段左侧的文本，以便应用输出。\
  \ |\n| `Ends With` | 设置必须位于所选字段右侧的文本，以便应用输出。 |\n| `Does Not End With` | 设置不得出现在所选字段右侧的文本，以便应用输出。\
  \ |\n| `Contains` | 设置可以出现在所选字段任意位置的文本，以便应用输出。 |\n| `Does Not Contain` | 设置不能出现在所选字段任意位置的文本，以便应用输出。\
  \ |\n\n另外值得注意的是，比较值、输出和替代输出可以是值（如本例所示）、列或参数（你将在第 9 章中了解）。如果要删除某条规则，只需单击所需规则右侧的省略号，然后选择\
  \ `Delete`。\n\n> **提示:** 如果你想要更改 `Add Conditional Column` 对话框中规则的顺序，只需单击所选规则右侧的省略号，然后从弹出菜单中选择\
  \ `Move Up` 或 `Move Down`。\n\n## 索引列\n\n`索引列` 是一个新列，用于对表中的每条记录按顺序进行编号。此编号方案适用于该表，因为它当前是按排序顺序且从零开始。在许多情况下，`索引列`\
  \ 都很有用。以下是一些示例：\n\n- 重新应用之前的排序顺序。\n- 为每条记录创建唯一引用。\n- 准备一个记录集，用作 `Power BI Desktop`\
  \ 数据模型中的维度表。在这种情况下，`索引列` 就成为了维度建模者所称的*代理键*。\n\n此列表绝非详尽无遗；在你使用 `Power BI Desktop`\
  \ 的过程中，几乎肯定还会发现其他用途。无论需求如何，以下是添加 `索引列` 的方法：\n\n1. 在 `Add Column` 功能区中，单击 `Index\
  \ Column`。新的、顺序编号的列将添加到表的右侧，并且 `Added Index` 将添加到 `Applied Steps` 列表中。\n\n2. 滚动到表的右侧并重命名\
  \ `索引列`；它当前被命名为 `Index`。\n\n在决定如何开始对 `索引列` 进行编号时，你有相当大的自由度。选项如下：\n\n- 从 0 开始，每行增加\
  \ 1。\n- 从 1 开始，每行增加 1。\n- 从任意数字开始，并以任意数字递增。\n\n正如你在步骤 1 中所见，默认情况下，`Power BI Desktop\
  \ Query` 从 0 开始对行进行编号。但是，你可以通过单击 `Add Index Column` 按钮右侧的小三角形来选择其他选项。这将显示一个包含三个选项的菜单。\n\
  \n选择第三个选项 `Custom`，会显示如图 8-22 所示的对话框。\n\n![../images/370912_3_En_8_Chapter/370912_3_En_8_Fig22_HTML.jpg](img/370912_3_En_8_Fig22_HTML.jpg)\n\
  \n**图 8-22** `Add Index Column` 对话框\n\n此对话框允许你指定数据集中第一行的起始编号以及每条记录递增的增量。\n\n\n\n\
  ## 结论\n\n在本章中，您学习了一些可用于清理和扩展数据集的基本技术。您了解了如何对数字进行向上和向下取整、如何实现统一的文本呈现格式，以及如何删除数据列中多余的空格和不可打印字符。\n\
  \n您还学习了如何替换列内的值，以及如何将数学、统计和三角函数应用于数字。其他技术包括从日期/时间和持续时间列中提取日期、时间和持续时间元素。\n\n最后，您学习了一系列技巧，帮助您根据现有列中的数据添加新列。这些技巧涵盖从简单的整列复制或合并列，到提取列数据的部分内容，甚至利用简单逻辑推导出不同的数据并添加到新列。\n\
  \n现在，我们来学习如何将此前相互独立的数据集合并到单个查询中，并解析复杂数据类型以将其添加到数据集中。您甚至将学习如何在单个查询中加载多个结构相同的文件，以及如何对数据进行透视、逆透视和转置。所有这些都将是下一章的主题。\n\
  \n"
- "# 9. 重构数据\n\n在前两章中，您学习了如何优化数据集，仅定义您真正需要的数据行和列。接着，您学习了如何清理和补全这些列所包含的数据。在本章中，您将学习如何在这些基础上继续构建，以交付能够被塑造成结构化和可用数据模型的数据。\n\
  \n在 Power BI Desktop 中，此类数据准备的通用术语称为*重构数据*。它涵盖以下内容：\n\n*   *合并查询*：这涉及将两个查询关联起来，以便将两个数据源的数据显示为单个数据集。您将学习如何利用第二个查询中的多个列来扩展查询，以及如何聚合第二个查询中的数据并将其添加到初始数据集。您还将了解在合并查询时如何创建复杂的联接。\n\
  \n*   *透视和逆透视数据*：如果您需要将行中的数据显示为列（或反之），那么您可以使用 Power BI Desktop 查询编辑器来精确完成此操作。这意味着您可以确保您使用的所有表中的数据都符合标准化的表格结构，这种结构对于\
  \ Power BI 高效运行至关重要。\n\n*   *转置数据*：这可能需要将列转换为行，反之亦然。\n\n*   *数据质量分析*：这意味着使用 Power\
  \ BI 查询编辑器来了解可用数据的质量。\n\n这些技术可以——并且很可能——与您之前在第 7 章和第 8 章中看到的许多技术一起使用。毕竟，Power BI\
  \ Desktop 查询的一大优势在于，它认识到数据转换是一项复杂的工作，因此不会强制规定任何严格的工作方式。事实上，它让您能够自由地尝试多种数据转换选项。所以请记住，在转换源数据时，您可以自由选择任何方法。唯一重要的是它能为您带来期望的结果。\n\
  \n## Power BI Desktop 查询编辑器视图功能区\n\n到目前为止，我们主要关注 Power BI Desktop 查询编辑器的“开始”、“转换”和“添加列”功能区。这完全是因为这些功能区几乎涵盖了所有主要操作。然而，还有第四个必不可少的\
  \ Power BI Desktop 查询编辑器功能区——视图功能区。它所包含的按钮如图 9-1 所示，相关选项在表 9-1 中进行了说明。\n\n**表 9-1**\
  \ Power BI Desktop 视图功能区选项\n\n| 选项 | 描述 |\n| --- | --- |\n| 查询设置 | 显示或隐藏 Power BI\
  \ Desktop 窗口右侧的“查询设置”窗格。这包括“应用的步骤”列表。 |\n| 公式栏 | 显示或隐藏包含转换步骤的 `M` 语言代码的公式栏。 |\n\
  | 等宽字体 | 以等宽字体显示预览。 |\n| 显示空格 | 显示空格和换行符。 |\n| 列质量 | 显示列质量特征。 |\n| 列分布 | 显示列分布特征。\
  \ |\n| 列概况 | 显示列概况特征。 |\n| 转到列 | 允许您选择特定的列。 |\n| 始终允许 | 允许在数据源和转换对话框中进行参数化。 |\n\
  | 高级编辑器 | 显示“高级编辑器”对话框，其中包含查询中所有步骤的代码。 |\n| 查询依赖关系 | 显示查询链接和依赖关系的顺序。 |\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig1_HTML.jpg](img/370912_3_En_9_Fig1_HTML.jpg)\n\
  \n**图 9-1** Power BI Desktop 视图功能区\n\n可能唯一不是立即自明的选项是`高级编辑器`按钮。它会将查询中所有转换的代码作为一个\
  \ `M` 语言脚本块显示。您将在第 12 章中了解更多相关信息。\n\n**提示**\n\n就我个人而言，我觉得在转换数据时，`查询设置`窗格和`公式栏`对于\
  \ Power BI Desktop 查询窗口来说过于重要，不能移除。因此，我倾向于让它们保持可见。不过，如果您需要屏幕空间，可以随时暂时隐藏它们。\n\n##\
  \ 合并数据\n\n到目前为止，我们将每个单独的查询视为独立存在。当然，现实情况是，您经常需要将一个查询的输出与另一个查询的输出结合使用，以各种方式联接来自不同数据源的数据。假设一个查询的结果与另一个查询共享一个（或多个）公共字段，您可以将查询“联接”成一个单一的“扁平化”数据表。Power\
  \ BI Desktop 将此称为合并操作，它使您能够，除其他事项外：\n\n*   在另一个“参考”表中查找数据元素以添加查找数据。例如，您可能希望添加客户名称，而主表中仅存在客户参考编号。\n\
  *   聚合“明细”表（例如发票行）中的数据，并将合计值包含在更高粒度的表中，例如发票表。\n\n同样，这个过程并不困难。唯一的基本因素是，您要合并的两个表或查询必须具有一个或多个共享字段，以便两个表能够连贯地匹配记录。让我们来看几个例子。\n\
  \n\n\n### 添加数据\n\n首先，我们来尝试查找一些额外数据并将其添加到查询中：\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig2_HTML.jpg](img/370912_3_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2：合并对话框\n\n1.  在一个新的空白 Power BI Desktop 文件中，加载 `C:\\PowerBiDesktopSamples\\\
  SalesData.xlsx` Excel 文件中的两个工作表。\n2.  在“开始”功能区中点击“`转换数据`”按钮。\n3.  在 Power BI Desktop\
  \ 查询窗口的“查询”窗格中，点击名为“`Sales`”的查询。\n4.  在“开始”功能区中点击“`合并查询`”按钮。此时将显示“合并”对话框。\n5.  在对话框的上半部分（显示当前查询输出的概览处），向右滚动并点击“`ClientName`”列的标题。该列将被高亮显示。\n\
  6.  在上方表格下方的弹出菜单中，选择“`Clients`”查询。该查询的输出将显示在对话框的下半部分。\n7.  在下方表格中，选择与你在步骤 5 中选择的列相对应的列（即联接列）的列标题。此处同样选择“`ClientName`”列。该列会在下方表格中被选中。系统可能会要求你为数据源设置隐私级别。如果是这样，请将其设置为“`Public`”。\n\
  8.  从“联接种类”弹出菜单中选择“`内部(仅限匹配行)`”。对话框将如图 9-2 所示。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig3_HTML.jpg](img/370912_3_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3：一个新的合并列\n\n9.  点击“`确定`”。一个新列将被添加到现有数据表的右侧。该列被命名为“`Clients`”——代表被合并的表。\n\
  10. 向右滚动现有数据表。新列的每个单元格中都包含单词“`Table`”。此列看起来将类似于图 9-3。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig4_HTML.jpg](img/370912_3_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4：联接查询中可用的字段\n\n11. 点击添加列的右侧的展开图标（该列应为你合并到源查询中的第二个查询的名称）。该数据表（或查询）中所有可用字段的弹出列表将显示出来，如图\
  \ 9-4 所示。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig5_HTML.jpg](img/370912_3_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5：合并后的列输出\n\n12. 确保选中“`展开`”单选按钮。\n13. 取消选中“`(选择所有列)`”复选框，清除所有列的选择。\n14. 选择以下列：\n\
  \    -   `ClientName`\n    -   `ClientSize`\n    -   `ClientSince`\n15. 取消选中“`使用原始列名作为前缀`”。\n\
  16. 点击“`确定`”。来自链接表的选定列将合并到主表中，并且对参考表（“`新列`”）的链接将被移除。\n17. 重命名已添加的列，然后应用并关闭查询。结果应如图\
  \ 9-5 所示。\n\n现在，你拥有一个包含来自两个链接数据源的数据的单一数据表。重新处理“`Sales`”查询也将重新处理依赖的“`clients`”查询，并导致最新版本的数据被重新加载到合并后的查询中。\n\
  \n**注意：** 你可能已经注意到，“合并”对话框指示了两个查询中有多少匹配的记录。这可以是一个有用的指示，表明你已选择了正确的列来联接这两个查询。\n\n\
  ### 在合并操作期间聚合数据\n\n如果你不只是查找参考数据，而是需要聚合来自单独表的数据，然后将结果添加到当前查询中，那么该过程大致相似。然而，这第二种方法旨在满足另一个完全不同的需求。之前，你看到的是当前查询中有许多记录映射到查找表中*单个*记录的情况。这第二种方法适用于当你的当前（或主）查询中有一条记录，而第二个查询中有*多条*链接记录的情况。因此，你需要聚合第二个表中的数据，以便将数据带入第一个表。这里有一个简单的例子，使用了来自\
  \ `C:\\PowerBiDesktopSamples\\CH09` 文件夹的一些示例数据：\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig6_HTML.jpg](img/370912_3_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6：聚合数据时的合并对话框\n\n1.  在一个新的 Power BI Desktop 文件中，从 `C:\\PowerBiDesktopSamples`\
  \ 文件夹中的 `InvoicesAndInvoiceLines.xlsx` Excel 源文件加载两个表。点击“`转换数据`”以在 Power BI Desktop\
  \ 查询编辑器中查看它包含的两个工作表（`Invoices` 和 `InvoiceLines`）。这将创建两个查询。\n2.  在左侧的“查询”窗格中，点击名为“`Invoices`”的查询。\n\
  3.  在“开始”功能区中，点击“`合并查询`”按钮。将打开“合并”对话框。你将在对话框的上半部分看到来自 `Invoices` 数据集的一些数据。\n4. \
  \ 点击“`InvoiceID`”列内的任意位置。该列被选中。\n5.  在弹出菜单中，选择“`InvoiceLines`”查询。你将在对话框的下半部分看到来自\
  \ `InvoiceLines` 数据集的一些数据。\n6.  点击下方表格中“`InvoiceID`”列内的任意位置。该列被选中。\n7.  从“联接种类”弹出菜单中选择“`内部(仅限匹配行)`”。对话框将如图\
  \ 9-6 所示。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig7_HTML.jpg](img/370912_3_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7：来自合并数据集的可用字段\n\n8.  点击“`确定`”。“合并”对话框将关闭，并在“`Invoices`”查询的右侧添加一个名为“`InvoiceLines`”的新列。\n\
  9.  向右滚动现有数据表。你将看到新列（名为“`InvoiceLines`”），其中的每个单元格都包含单词“`Table`”。\n10. 点击新列标题右侧的展开图标（两个左右指向的箭头）。将显示\
  \ `InvoiceLines` 查询中所有可用字段的弹出列表。\n11. 选择“`聚合`”单选按钮。\n12. 选择“`SalePrice 的合计`”字段，并取消选中所有其他字段。\n\
  13. 取消选中“`使用原始列名作为前缀`”复选框。对话框将如图 9-7 所示。\n14. 点击“`确定`”。\n\nPower BI Desktop 将计算每张发票的总售价，并将其作为一个新列添加。当然，如果求和不是你想要的，你可以选择要应用的聚合类型（在点击“`确定`”之前）。要执行此操作，请将光标悬停在要聚总的列上（参见上一练习中的步骤\
  \ 11），然后点击字段名右侧的弹出菜单。Power BI Desktop 将建议一组选项。可用的聚合选项如表 9-2 所述。\n\n**表 9-2：合并聚合选项**\n\
  \n| 选项 | 说明 |\n| --- | --- |\n| `Sum` | 返回该字段的总值。 |\n| `Average` | 返回该字段的平均值。 |\n\
  | `Median` | 返回该字段的中位数。 |\n| `Minimum` | 返回该字段的最小值。 |\n| `Maximum` | 返回该字段的最大值。\
  \ |\n| `Count (All)` | 计算数据集中的所有记录数。 |\n| `Count (Not Blank)` | 计算数据集中非空的记录数。 |\n\
  \n**提示：**\n\n\n\n如果在步骤 1 中加载了数据而未编辑查询，只需点击`Home`功能区中的`Transform Data`按钮，即可切换到`Query\
  \ Editor`。\n\n刚才所见的合并过程本身虽不复杂，却突然开启了许多新的可能性。这意味着你现在可以创建多个独立的查询，随后将它们结合使用，以扩展数据，从而能够准备相当复杂的数据集。\n\
  \n关于合并操作，我有几点需要说明：\n\n- 在合并数据集时，只能使用之前在`Power BI Desktop Query`窗口中已创建的查询。因此，在尝试合并操作之前，请务必先连接所有所需的数据集。\n\
  - 刷新一个查询会导致合并到该查询中的任何其他查询也一并刷新。通过这种方式，你将始终从该过程中的所有查询获取最新的数据。\n\n### 联接类型\n\n在合并查询（无论目的是连接数据还是聚合值）时，你需要选择如何关联这两个查询。联接类型的选择会对生成的数据集产生深远影响。因此，了解可用的六种联接类型至关重要。这些类型描述于表\
  \ 9-3 中。\n\n**表 9-3** 联接类型\n\n| 联接类型 | 说明 |\n| --- | --- |\n| 左外部 | 保留`Merge`对话框中上方数据集（即开始合并操作时处于活动状态的数据集）中的所有记录。保留第二个数据集中所有匹配的行（那些在联接列中具有共同值的行）。第二个数据集中的所有其他行将被丢弃。\
  \ |\n| 右外部 | 保留`Merge`对话框中下方数据集（即开始合并操作时未处于活动状态的数据集）中的所有记录。保留上方数据集中所有匹配的行（那些在联接列中具有共同值的行）。上方数据集（即开始合并操作时处于活动状态的数据集）中的所有其他行将被丢弃。\
  \ |\n| 完全外部 | 两个查询中的所有行都保留在结果数据集中。任何在联接字段中不具有共同值的记录，其某些列将包含空白。 |\n| 内部 | 仅联接那些在所选联接列上完全匹配的查询。任一查询中在联接列上不具有共同值的行都将被丢弃。\
  \ |\n| 左反 | 仅保留上方（第一个）查询中的行。 |\n| 右反 | 仅保留下方（第二个）查询中的行。 |\n\n**注意**：当你使用任何*外部*联接时，你保留了第二个查询中没有对应记录的行。因此，结果数据集中某些列会包含空值。\n\
  \n当展开作为合并数据集链接的列时，有几个有用的选项值得了解：\n\n- 使用原始列名作为前缀\n- 搜索要展开的列\n\n#### 使用原始列名作为前缀\n\n\
  你可能会发现，来自已联接查询的某些列在两个源数据集中可能具有相同的名称。因此，你需要识别出哪些列来自哪个数据集。如果你保持选中“使用原始列名作为前缀”合并选项（这是默认设置）的复选框，任何合并的列都将包含源查询名称，以帮助你更准确地识别数据。\n\
  \n如果你发现这些较长的列名反而碍事，可以取消选中此复选框。这将使从第二个查询添加的列保留其原始名称。但是，由于`Power BI Desktop`不能接受重复的列名，任何新列的名称后面都会添加上`.1`、`.2`等后缀。\n\
  \n#### 搜索要展开的列\n\n如果你正在将一个查询合并到另一个包含大量列的查询，那么滚动查找你想要包含的列可能会很费力。为了缩小搜索范围，你可以在`Search\
  \ columns to aggregate`框中输入你要查找的列名称中的几个字符。你输入的字符越多，在`Expansion`弹出对话框中显示的匹配列就越少。\n\
  \n### 基于多列进行联接\n\n在之前的示例中，你仅基于单个列联接了查询。虽然如果你处理的是来自结构清晰的源（如关系数据库）的数据时这可能可行，但在联接来自不同源的查询时，你可能需要扩展这一原则。幸运的是，`Power\
  \ BI Desktop`允许你在需要时基于*多个*列来联接查询。\n\n举例来说，示例数据中包含一个我准备好的文件，作为如何基于超过一个列来联接查询的示例。此示例文件包含你在前几章中看到的来自多个源的数据。不过，它们已被建模为数据仓库星型模式。为了完成该模型，你需要将一个名为`Geography`的维度联接到一个名为`Sales`的事实表，以便将字段`GeographySK`添加到事实表中。然而，`Sales`表和`Geography`表共享三个字段（`Country`、`Region`和`Town`），这些字段必须对应才能联接查询。以下内容说明了如何使用多个字段执行联接：\n\
  \n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig8_HTML.jpg](img/370912_3_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8** 使用多列联接查询\n\n1.  在一个新的`Power BI Desktop`文件中，单击`Get Data`，选择`Excel`作为源，然后在位于`C:\\\
  PowerBiDesktopSamples\\StarSchema.xlsx`的 Excel 文件中，选择两个工作表（`Geography`和`Sales`）。\n\
  2.  单击`Transform Data`以打开`Query Editor`。如果你已经在`Query Editor`中，只需单击`New Source`，选择`Excel`作为源数据类型，并加载这两个工作表。\n\
  3.  从`Power BI Desktop Query`窗口左侧的`Queries`窗格的现有查询列表中，选择`Sales`查询。\n4.  在`Home`功能区中，单击`Merge\
  \ Queries`按钮。将出现`Merge`对话框。\n5.  在查询弹出列表中，选择`Geography`作为要联接到第一个（上方）查询的第二个查询。\n\
  6.  从`Join Kind`弹出列表中选择`Inner`（仅匹配行）。\n7.  在上方字段列表（取自`Sales`表）中，按住 Ctrl 键*按此顺序*依次单击`CountryName`和`Region`字段。每个列标题右侧将出现一个小数字，表示你选择列的顺序。\n\
  8.  在下方字段列表（取自`Sales`表）中，按住 Ctrl 键*按此顺序*依次单击`CountryName`和`Region`字段。每个列标题右侧将出现一个小数字，表示你选择列的顺序。\n\
  9.  在对话框底部的信息消息中，确认匹配行的数量合理。对话框看起来将类似于图 9-8。\n10. 单击`OK`。\n\n然后你可以继续重组数据。在此示例中，即是将`GeographySK`字段添加到`Sales`查询，然后从`Sales`查询中移除`Country`、`Region`和`Town`字段。\n\
  \n联接查询时可使用的列数没有实际限制。这完全取决于源数据的形态。然而，用于定义联接的每一列必须存在于两个数据集中，并且每一对列的数据类型必须相同（或相似）。\n\
  \n\n\n## 模糊匹配\n\n模糊匹配允许你在合并操作中，通过使用模糊匹配逻辑来比较要连接的列中的值，而不是在数据中寻找精确匹配。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig9_HTML.jpg](img/370912_3_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9\n\n模糊匹配\n\n1. 开始一个合并操作（像之前做的那样），选择要合并的两个表以及用于连接查询的列。\n2. 在“合并”对话框中，勾选 `使用模糊匹配执行合并`。\n\
  3. 设置相似度阈值。这定义了查询编辑器在跨两个查询寻找相似元素进行匹配时可以应用的“容差范围”。\n4. 输入最大匹配数。对话框将如图 9-9 所示。\n\n\
  ### 模糊匹配选项\n\n有几个你可能想要应用的模糊匹配选项——而且在使用此技术时你肯定需要理解它们。这些选项在表 9-4 中进行了说明。\n\n表 9-4\n\
  \n模糊匹配选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 相似度阈值 | 指示两个值需要有多相似才能匹配。最小值 `0.00` 会导致所有值相互匹配，最大值\
  \ `1.00` 则只允许精确匹配。默认值为 `0.80`。 |\n| 忽略大小写 | 忽略两列中的大写和小写字符。 |\n| 忽略空格 | 忽略两列中的空白字符。\
  \ |\n| 最大匹配数 | 设置为每个输入行返回的最大匹配行数。默认行为是返回所有匹配项。 |\n| 转换表 | 允许用户指定另一个包含手动准备的映射表的查询，以便某些值可以在匹配过程中自动映射。\
  \ |\n\n模糊匹配是一种极其强大的技术，可以帮助你连接来自不同来源的数据集。不过，你可能需要反复试验才能找到合并查询时要使用的合适选项。\n\n### 作为新查询合并\n\
  \n在上述合并过程中，你将数据合并到了一个源表中。但是，有时你可能更希望保持源查询（或者你喜欢称其为源表）不变，并将合并操作的结果输出到一个新查询中。\n\n\
  要做到这一点，诀窍是不要点击 `合并` 按钮本身，而是点击 `合并` 按钮右侧的箭头，并选择 `将查询合并为新查询`。你可以在图 9-10 中看到此选项。\n\n\
  ![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig10_HTML.jpg](img/370912_3_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10\n\n将表合并为新查询\n\n这将创建一个名为 `合并` 的新查询（你可以稍后重命名），并保持原始查询不变。\n\n### 准备用于连接的数据集\n\
  \n在连接查询之前，你可能需要对现实世界的数据集进行一些预处理工作。更具体地说，你用于连接的任何列都必须具有相同的基本数据类型。简而言之，你需要将基于文本的列与其他基于文本的列连接，数字列与数字列连接，日期列与日期列连接。如果列的数据类型*不*相同，则在“合并”对话框中尝试连接列时，你会收到一条警告消息。\n\
  \n因此，在开始合并操作*之前*，先查看你将用于连接查询的列几乎总是一个好主意。记住，数据类型不必完全相同，只需相似即可。例如，十进制数类型可以映射到整数。\n\
  \n在尝试合并查询之前，你可能还需要清理用于连接的列中的数据。这可能包括：\n\n- 删除基于文本的列中的尾随或前导空格\n- 隔离列的一部分（无论是在原始列中还是作为新列）用于连接\n\
  - 验证连接列中使用了适当的数据类型\n\n### 正确与错误的连接\n\n不幸的是，合并查询是一种在理论上往往比实践中更容易的数据重组操作。如果源查询基于关系型甚至维度型数据库中的表，那么连接它们可能会相对容易，因为数据架构师（希望如此）会设计数据库表以允许它们被连接。但是，如果你要连接两个完全独立的查询，则可能会面临几个主要问题：\n\
  \n- 列不匹配。\n- 列匹配，但结果是一个包含重复记录的庞大数据表。\n\n让我们来看看这些可能的问题。\n\n#### 列不匹配\n\n如果列不匹配（即，你已经连接了数据但没有得到任何结果记录），那么你需要仔细检查你用于建立连接的那些列中的数据。你需要提出的问题如下：\n\
  \n- 两个查询中的值是否具有相同的数据类型？\n- 这些值是否真的能够匹配——还是它们本身就不相同？\n- 你是否使用了正确的列？\n- 你是否使用了过多的列，从而指定了两个查询中都不存在的数据？\n\
  \n#### 列匹配，但结果是一个包含重复记录的庞大数据表\n\n连接查询取决于在两个源查询中隔离出*唯一*的数据。有时，单个列包含的信息不足以建立一个能唯一标识查询中一行的唯一引用。\n\
  \n在这些情况下，你需要使用两个或更多列来连接查询——否则结果中会出现重复的行。因此，再次强调，你需要仔细查看数据，并决定可以用来正确连接查询的最小列数。\n\n\
  ### 检查已连接的数据\n\n连接数据表并不总是容易的。判断合并操作的结果是否会产生你预期的结果也不容易。因此，Power BI Desktop 查询提供了一种解决这类困境的方法。它可以帮助你更清晰地看到连接做了什么。更具体地说，它可以向你显示第一个查询中的每条记录，究竟是从第二个查询中连接了哪些行。\n\
  \n执行以下操作来查看实际效果：\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig11_HTML.jpg](img/370912_3_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11\n\n已连接的数据\n\n1. 执行之前看到的示例中的步骤 1 到 10（“在多列上连接”一节）。\n2. 在数据表中向右滚动。你将看到名为\
  \ `Geography` 的新列（如图 9-11 所示）。\n3. 在你想要查看已连接数据的行中，点击单词 `Table` 的*右侧*。请注意，你*不能*点击单词\
  \ `Table` 本身。主查询的数据表下方将出现第二个表，其中包含针对该特定行从第二个查询连接过来的数据。图 9-11 展示了一个示例。\n\n这种技术既简单又实用。不过，我还是需要说明几点：\n\
  \n- 你可以通过向上或向下拖动上方数据表的底部边框来调整下方表的大小（从而显示更多或更少来自第二个已连接表的数据）。\n- 在 `NewColumn` 列中单击单词\
  \ `Table` 的右侧，将启用“转换”功能区中的 `展开` 和 `聚合` 按钮。\n- 在 `NewColumn` 列中点击单词 `Table`，会向查询中添加一个新步骤，该步骤会用链接的数据替换源数据。你还可以通过在\
  \ `NewColumn` 列内右键单击并选择 `向下钻取` 来执行此操作。\n\n注意\n\n向下钻取到合并后的表实际上会将该查询限制为子表的行。因此，如果你想要访问合并表中的所有数据，则必须删除此步骤。\n\
  \n\n\n## 追加数据\n\n并非所有源数据都会完整地包含在单个文件或单个数据库表中。你可能会被授予访问两个或多个表或文件的权限，这些表或文件需要被加载到\
  \ Excel 或 Power Pivot 的同一个表中。在某些情况下，你可能会发现自己面临数百个文件——都是文本、CSV 或 Excel 格式——并且需要将它们全部加载到一个表中，作为你分析的基础。实际上，Power\
  \ BI Desktop 也能够处理这些情况。\n\n### 将一个查询的内容添加到另一个查询\n\n在最简单的情况下，你可能拥有两个结构相同的数据源（即，它们具有顺序相同的相同列），而你需要做的就是将一个数据源添加到另一个数据源，最终得到一个输出两个源合并内容的查询。这被称为*追加数据*，只要两个数据源具有*完全相同*的结构，这就很容易实现；这意味着：\n\
  - 它们具有相同数量的列。\n- 列的顺序相同。\n- 每列的数据类型相同。\n- 列名相同。\n\n只要满足所有这些条件，你就可以将一个查询的输出（Power\
  \ BI Desktop 也称之为*表*，包括我在内的许多人也称之为数据集）追加到另一个查询中。查询的数据不必来自相同的源类型，因此你可以将 CSV 文件的输出追加到来自\
  \ Oracle 数据库的数据中。例如，我们将获取两个文本文件，并用它们创建一个单一的输出：\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig12_HTML.jpg](img/370912_3_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12 用于追加的源数据\n\n1. 创建查询，将以下每个文本文件加载到 Power BI Desktop 中——但不要执行最后的加载步骤，该步骤会将它们添加到数据模型。两个文件都在\
  \ `C:\\PowerBiDesktopSamples\\MultipleIdenticalFiles` 文件夹中：\n   1. `Colours_01.txt`\n\
  \   2. `Colours_02.txt`\n2. 将查询命名为 `Colours_01` 和 `Colours_02`。你可以在图 9-12 中看到这两个查询的内容。\n\
  \n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig13_HTML.jpg](img/370912_3_En_9_Fig13_HTML.jpg)\n\
  \n图 9-13 “追加”对话框\n\n1. 打开其中一个查询（我使用 `Colours_01`，但任一个都可以）。\n2. 在 Power BI Desktop\
  \ 查询编辑器“开始”功能区中，单击“追加查询”按钮右侧的箭头，然后选择“将查询追加为新查询”。将出现“追加”对话框。\n3. 确保选中“两个表”单选按钮。\n\
  4. 从“要追加的表”弹出菜单中，选择查询 `Colours_02`。该对话框看起来将如图 9-13 所示。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig14_HTML.jpg](img/370912_3_En_9_Fig14_HTML.jpg)\n\
  \n图 9-14 包含已追加数据的新查询\n\n1. 单击“确定”。两个输出表中的数据将被追加到一个新查询中。你可以在图 9-14 中看到结果输出的示例。\n\n\
  现在你可以继续进行任何需要应用的修改。你会注意到，当表被相互追加时，列名不会作为数据的一部分重复出现。\n\n这种方法的一个有趣之处在于，你在两个源表和新查询之间建立了一个链接。这意味着，当你刷新源数据时，不仅\
  \ `Colours_01` 和 `Colours_02` 表中的数据会更新，你刚刚创建的“派生”查询也会被更新。\n\n### 追加多个查询的内容\n\nPower\
  \ BI 查询编辑器并不限制你一次只能追加两个文件。你可以（如果确实需要）追加数量几乎无限多个的相同文件。\n\n此外，你可以像追加文本或 CSV 文件一样轻松地追加\
  \ Excel 文件——如下例所示：\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig15_HTML.jpg](img/370912_3_En_9_Fig15_HTML.jpg)\n\
  \n图 9-15 追加多个查询\n\n1. 在一个新的、空的 Power BI Desktop 文件中，单击“转换数据”以打开查询编辑器。\n2. 创建查询，加载\
  \ `C:\\PowerBiDesktopSamples\\MultipleIdenticalExcel` 文件夹中的所有 Excel 文件（这些文件是相同的，每个文件包含一个名为\
  \ `BaseData` 的工作表）。\n3. 在左侧的“查询”窗格中选择名为 `BaseData` 的查询。\n4. 单击“追加查询”按钮。\n5. 在“追加”对话框中选择“三个或更多表”单选按钮。\n\
  6. 按住 Ctrl 键单击对话框左侧“可用表”列表中的 `BaseData (2)` 和 `BaseData (3)` 表。\n7. 单击“添加”按钮。你可以在图\
  \ 9-15 中看到“追加”对话框现在的样子。\n8. 单击“确定”。查询 `BaseData (2)` 和 `BaseData (3)` 中的数据将被追加到当前查询\
  \ (`BaseData`) 中。\n\n值得注意的一点是，你可以：\n- 通过单击查询（或按住 Ctrl 键单击多个查询），然后依次单击对话框右侧的叉号图标，从右侧的要追加的查询列表中移除查询。\n\
  - 通过单击要移动的查询，然后依次单击对话框右侧的向上和向下尖括号，来更改查询的加载顺序。\n\n## 更改数据结构\n\n有时，你的需求会超越我们迄今为止在讨论数据清理和转换时所看到的技术。考虑到你获取的数据的形状，某些数据结构需要更彻底的改造。我将以下内容归入这一类：\n\
  - 逆透视数据\n- 透视数据\n- 转换行和列\n\n这些技术中的每一种都旨在满足数据加载中特定但常见的需求，所有这些都将在接下来的几页中进行描述。\n\n\
  ### 逆透视表\n\n有时，你可能需要分析以“透视”或“非规范化”格式提供的数据。本质上，这意味着本应放在单个列中的信息被分解并放置到多个列中。在图 9-16\
  \ 中给出了一个透视数据集的前几行示例，并且可以在 `C:\\PowerBiDesktopSamples\\PivotedDataSet.xlsx` 示例文件中找到。\n\
  \n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig16_HTML.jpg](img/370912_3_En_9_Fig16_HTML.jpg)\n\
  \n图 9-16 一个透视数据集\n\n为了正确分析这些数据，我们确实需要将汽车的品牌从列标题切换为特定列的内容。幸运的是，这并不难：\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig17_HTML.jpg](img/370912_3_En_9_Fig17_HTML.jpg)\n\
  \n图 9-17 一个逆透视后的数据集\n\n1. 在一个新的 Power BI Desktop 文件中，将 `C:\\PowerBiDesktopSamples\\\
  PivotedDataSet.xlsx` 文件中的 `PivotedCosts` 表加载到 Power BI Desktop 中。确保第一行被设置为表的标题行。\n\
  2. 切换到查询编辑器（如果尚未打开），然后选择所有你想要逆透视的列。在此示例中，这意味着除了第一列（所有汽车品牌）之外的所有列。\n3. 在“转换”功能区中，单击“逆透视列”按钮（或者右键单击任意选中的列，然后从上下文菜单中选择“逆透视列”）。表将被重新组织，前几条记录将如图\
  \ 9-17 所示。`已逆透视的列` 将被添加到 `应用的步骤` 列表中。\n4. 重命名 Power BI Desktop 查询命名为 `属性` 和 `值`\
  \ 的列。\n\n数据现在以标准的表格方式呈现，因此可以用来创建数据模型，进而生成报表和仪表板。\n\n\n\n#### 逆透视选项\n\n在“转换”功能区的“逆透视列”弹出窗口中逆透视数据时，有几个可用选项：\n\
  \n- *逆透视其他列*：这将把所有其他列的内容添加到逆透视的输出结果中。\n- *仅逆透视所选列*：这只会将任何预选列的内容添加到逆透视的输出结果中。\n\n\
  **注意：** 与使用`查询编辑器`应用的众多技术一样，在执行透视和逆透视操作之前，选择正确的列至关重要。\n\n### 透视表\n\n在某些情况下，您可能需要将数据从列切换到行，以便高效使用。这种操作称为*数据透视*。毫不意外，它与您在上一个部分看到的逆透视过程非常相似。\n\
  \n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig18_HTML.jpg](img/370912_3_En_9_Fig18_HTML.jpg)\n\
  \n*图 9-18：透视列对话框*\n\n1. 按照上一部分的步骤 1 到 3 操作，最终得到如图 9-17 所示的数据表。\n2. 单击 `Attribute`\
  \ 列内部。\n3. 在“转换”功能区中，单击“透视列”按钮。将出现“透视列”对话框。\n4. 选择 `Value`（数字列）作为通过透视转换进行聚合的值列。\n\
  5. 展开“高级”选项，并确保将“求和”选为“聚合值函数”。“透视列”对话框将如图 9-18 所示。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig19_HTML.jpg](img/370912_3_En_9_Fig19_HTML.jpg)\n\
  \n*图 9-19：透视后的数据*\n\n6. 单击“确定”。表格已透视，外观如图 9-19 所示。`Pivoted Column` 被添加到“应用的步骤”列表中。\n\
  \n**注意：** “透视列”对话框的“高级”选项部分允许您选择应用于透视表中值的聚合操作。\n\n“逆透视”按钮包含另一个菜单选项，如果您单击“逆透视”按钮右侧的小三角形，则会显示该选项。这是“逆透视其他列”选项，它会在您运行转换时，将*未*选中的所有列的内容从列转换为行。\n\
  \n### 转置行和列\n\n在某些情况下，您可能会遇到一个源表，其中列需要变为行，而行需要变为列。幸运的是，对于`Power BI Desktop`来说，这是一次点击即可完成的转换。操作方法如下：\n\
  \n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig20_HTML.jpg](img/370912_3_En_9_Fig20_HTML.jpg)\n\
  \n*图 9-20：需要转置的数据集*\n\n1. 在`Power BI Desktop 查询编辑器`中编辑 `C:\\PowerBiDesktopSamples\\\
  DataToTranspose.xlsx` Excel 文件。您需要选择 `Sheet1`。您将看到一个如图 9-20 所示的数据表。\n2. 在“转换”功能区中，单击“转置”按钮。数据被转置，并显示为两列，就像您在第二章中看到的\
  \ `CountryList.txt` 文件一样。\n3. 重命名生成的列。\n\n## 数据质量分析\n\n`Power BI Desktop` 现在包含了帮助您分析数据质量和构成的功能。它可以通过提供以下信息，帮助您更深入地理解和感受源数据：\n\
  \n- 列质量\n- 列分布\n- 列配置文件\n\n### 列质量\n\n`Power BI Desktop` 可以分析查询中每个数据列的以下方面：\n\n\
  - 数据有效性\n- 错误\n- 空字段\n\n然后，它会返回每个列中这些元素的百分比。然后，您可以更详细地检查数据，以追踪潜在的异常情况。这里我们将使用文件\
  \ `CH08Example1.pbix`。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig21_HTML.png](img/370912_3_En_9_Fig21_HTML.png)\n\
  \n*图 9-21：列质量*\n\n1. 在“查询编辑器”中，切换到“视图”菜单。\n2. 勾选“列质量”复选框。如图 9-21 所示，列质量分析将显示在每个列标题下方。\n\
  \n### 列分布\n\n分析列中数据的分布可以显示列包含的唯一值和不同值。这可以帮助您了解数据的相关性和有用性。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig22_HTML.jpg](img/370912_3_En_9_Fig22_HTML.jpg)\n\
  \n*图 9-22：列分布*\n\n1. 勾选“列分布”复选框。如图 9-22 所示，列分布分析将显示在每个列标题下方。\n\n值得注意的是列分布中不同元素和唯一元素之间的区别：\n\
  \n- *不同*元素可能在列中出现多次——不同计数总数指示整体上存在多少个单独的元素。\n- *唯一*元素在列中仅出现一次。\n\n### 列配置文件\n\n\
  列配置文件信息指示列中每个不同值相对于元素总数的百分比。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig23_HTML.jpg](img/370912_3_En_9_Fig23_HTML.jpg)\n\
  \n*图 9-23：列配置文件*\n\n1. 勾选“列配置文件”复选框。如图 9-23 所示，列配置文件分析将显示在屏幕底部。\n\n您甚至可以选择同时显示所有三个数据质量分析选项。如果这样做，最终可能会得到一个如图\
  \ 9-24 所示的屏幕。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig24_HTML.jpg](img/370912_3_En_9_Fig24_HTML.jpg)\n\
  \n*图 9-24：显示所有数据质量分析选项*\n\n在这些选项中，只有“列分布”依赖于所选列。因此，您需要分别单击每个列以查看所选列的值分布。此外，您可以通过分别单击列统计窗口和值分布窗口右上角的省略号并选择“复制”，来独立复制列的统计信息和值分布。然后，可以将此信息粘贴到例如`Excel`中，以分析数据集的元数据。\n\
  \n### 分析整个数据集\n\n默认情况下，内置数据配置文件仅查看数据集中的前 1000 条记录——大概是为了加快配置文件分析操作的速度。但是，您可以强制`Power\
  \ BI Desktop`分析整个数据集。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig25_HTML.jpg](img/370912_3_En_9_Fig25_HTML.jpg)\n\
  \n*图 9-25：选择分析范围*\n\n1. 在“查询编辑器”屏幕的左下角，单击“基于前 1000 行进行列分析”。将出现如图 9-25 所示的弹出窗口。\n\
  2. 选择“基于整个数据集进行列分析”。稍等片刻（取决于数据集的大小）后，配置文件分析将更新。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n### 纠正异常\n\nPower BI 的数据分析工具只能从高层级上指示数据的概况。它不会擅自修改数据——毕竟，即使数据被标记为包含错误或异常，它也可能仍然有用。\n\
  \n不过，它可以帮助你应用一些基本的数据清理。\n\n![../images/370912_3_En_9_Chapter/370912_3_En_9_Fig26_HTML.jpg](img/370912_3_En_9_Fig26_HTML.jpg)\n\
  \n图 9-26\n分析纠正选项\n\n1.  将鼠标悬停在屏幕顶部的列质量或列分布数据上。将出现一个包含更详细信息的弹出窗口。\n2.  点击弹出窗口右下角的省略号。将出现你在图\
  \ 9-26 中看到的弹出窗口。\n3.  选择你感兴趣的选项来纠正任何异常。\n\n当然，以这种方式清理数据实际上可能会损害数据的完整性——甚至删除有价值的信息。在某些数据集中，被标记为错误的数据可能正是你想要更详细检查的数据。因此，我建议在仅仅为了将错误和空单元格的百分比降至零而清理数据之前，要谨慎行事。\n\
  \n**注意**：一旦你选择了任何数据质量选项，它们将在未来的 Power BI Desktop 会话中保持激活状态，直到你取消选中该选项。\n\n### 数据转换方法\n\
  \n我很理解你可能会对如此众多的可用转换选项感到困惑。因此，此时记住几个关键原则可能会有所帮助：\n\n-   如有疑问，请右键单击要转换的列。这将在上下文菜单中列出最常见的可用选项。\n\
  -   若要更改现有数据，请使用 `Transform` 菜单。\n-   若要添加新列，请使用 `New Column` 菜单。\n-   请记住，你可以通过删除数据转换过程中的步骤来“撤销”你的修改。\n\
  \n## 结论\n\n本章向你展示了如何将来自一个或多个潜在数据源的源数据结构化为有效的数据表。除此之外，你还了解了如何对数据进行透视和逆透视、如何向上和向下填充行数据，以及如何转置行和列。\n\
  \n可能你学到的最重要的事情是如何联接单独的查询，以便将来自一个查询的数据添加到另一个查询中。这可能涉及从单独的查询中查找数据，或将一个查询的聚合结果带入另一个查询。\n\
  \n最后，你学习了如何分析源数据的质量，并了解该数据集能有多么直接地发挥作用。\n\n现在，是时候将你的数据转换技能提升到一个新水平，学习如何设置复杂的数据提取和转换例程了。这些将是第\
  \ 10 章的主题。\n\n"
- "# 10. 复杂数据加载\n\n并非所有的数据加载都仅仅是建立到源的连接，并对源数据（幸运的是，这些数据已经以结构清晰的表格形式呈现）应用转换。有时，你可能希望在加载数据时“突破界限”，为在你的\
  \ Power BI 仪表板中使用而准备更复杂的源数据结构。我的意思是，源数据最初并非采用立即可用的表格格式，需要对其重新进行一些结构整理，才能准备好供使用的表格。\n\
  \n为了解决这类挑战，本章将解释如何执行以下操作：\n\n-   从源文件夹中添加多个相同的文件\n-   从源文件夹中选择要加载的相同源文件\n-   从包含\
  \ JSON 数据的源文件中加载简单的 JSON 结构\n-   解析源文件中包含 JSON 数据的列\n-   解析源文件中包含 XML 数据的列\n-  \
  \ 加载复杂的 JSON 文件——并选择要使用的元素\n-   加载复杂的 XML 文件——并选择要使用的元素\n-   将列转换为列表以用于复杂加载例程\n\n\
  最后——纯粹是为了完善 Power BI 查询编辑器及其功能的整体概览——我将提一下如何\n\n-   重用最近使用的查询\n-   修改最近使用的查询列表\n\
  -   从 Power BI 查询编辑器导出数据\n\n## 从源文件夹添加多个文件\n\n现在让我们考虑一个有趣的数据提取挑战。你收到了一批文件，可能是从 FTP\
  \ 站点下载的或通过电子邮件接收的，并且你已经将它们全部放入一个特定的目录中。但是，如果有几百个文件，你肯定不想像第 2 章那样逐个加载文件——然后像你在第 9\
  \ 章中看到的那样，将所有文件单独追加以创建最终的复合数据表。\n\n**注意**：只有当所有文件都严格相同时，查询编辑器才能加载多个文件。这意味着要确保每个文件中的所有列都按相同的顺序排列并具有相同的名称。\n\
  \n以下是实现此目标的更高效方法：\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig1_HTML.jpg](img/370912_3_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1\n文件夹对话框\n\n1.  创建一个新的 Power BI Desktop 文件。\n2.  在 Power BI Desktop 的“开始”功能区中，点击\
  \ `获取数据` ➤ `文件`，打开 `获取数据` 对话框。然后在对话框右侧选择 `文件夹`。\n3.  点击 `连接`。将显示 `文件夹` 对话框。\n4.\
  \  点击 `浏览` 按钮，导航到包含要加载文件的文件夹。在此示例中，它是 `C:\\PowerBiDesktopSamples\\MultipleIdenticalFiles`。如果愿意，你也可以粘贴或输入文件夹路径。`文件夹`\
  \ 对话框将如图 10-1 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig2_HTML.jpg](img/370912_3_En_10_Fig2_HTML.jpg)\n\
  \n图 10-2\nPower BI Desktop 中的文件夹内容\n\n1.  点击 `确定`。将打开文件列表窗口。文件夹及其所有子文件夹的内容以表格格式列出，如图\
  \ 10-2 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig3_HTML.jpg](img/370912_3_En_10_Fig3_HTML.jpg)\n\
  \n图 10-3\n合并文件对话框\n\n1.  点击 `合并` 按钮上的弹出箭头，然后选择 `合并并转换数据`。将出现 `合并文件` 对话框，如图 10-3\
  \ 所示。在这里，你可以选择文件夹中的哪个文件作为要导入文件的*模型*。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig4_HTML.jpg](img/370912_3_En_10_Fig4_HTML.jpg)\n\
  \n图 10-4\n从文件夹加载的数据\n\n1.  点击 `确定`。Power BI Desktop 查询编辑器将显示导入的数据。如图 10-4 所示。\n\
  2.  点击 `关闭并应用`。所有源文件中的数据将被加载到 Power BI Desktop 数据模型中。\n\n**注意**：`合并文件` 对话框中的其他选项在第\
  \ 2 章中有说明。\n\n\n\n### 筛选文件夹中的源文件\n\n有时候你可能只想从文件夹中导入文件的*子集*。也许文件并不相同，或者你只是不需要源目录中的某些可用文件。无论出于何种原因，这里有一种方法可以让\
  \ Power BI Desktop 自动遍历目录，*仅*加载与你指定的文件名条件相符的文件。换句话说，查询编辑器允许你在加载实际数据之前筛选源文件集。在本示例中，我将展示如何加载多个\
  \ Excel 文件：\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig5_HTML.jpg](img/370912_3_En_10_Fig5_HTML.jpg)\n\
  \n**图 10-5** – 加载多个文件时显示文件信息\n\n1.  执行前述步骤 1 至 5，以显示包含你欲加载文件的文件夹内容。本例中，该文件夹为 `C:\\\
  PowerBiDesktopSamples\\MultipleNonIdentical`。\n2.  单击**转换数据**。查询编辑器窗口将打开，并显示目录中的文件列表及其众多属性。你可以在图\
  \ 10-5 中看到示例。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig6_HTML.jpg](img/370912_3_En_10_Fig6_HTML.jpg)\n\
  \n**图 10-6** – 加载多个相同文件时筛选文件类型\n\n3.  由于你只想加载 Excel 文件并避免任何其他类型的文件，请单击列标题**扩展名**的筛选弹出菜单，并取消勾选*除*\
  \ `.xlsx` *之外*的所有元素。如图 10-6 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig7_HTML.jpg](img/370912_3_En_10_Fig7_HTML.jpg)\n\
  \n**图 10-7** – 加载多个 Excel 文件时选择源数据\n\n4.  单击**确定**。现在你只能在查询编辑器中看到文本文件。\n5.  单击第一列标题右侧的**展开**图标（两个向下的箭头），该列名为**内容**，列中的每一行都包含单词\
  \ *Binary*。Power BI 将显示你在第 2 章中见过的**合并文件**对话框。\n6.  从可用文件中选择一个作为数据加载的示例文件。\n7. \
  \ 单击对话框左侧层级结构中包含你欲加载数据的工作表、表格或命名区域。\n8.  单击**跳过包含错误的文件**。此时，对话框将如图 10-7 所示。\n9.\
  \  单击**确定**。Power BI Desktop 查询编辑器将加载所有文件并显示结果。\n\n现在，所有源文件的内容都已加载到 Power BI Desktop\
  \ 查询编辑器中，可以像其他任何数据集一样进行转换和使用。这可能涉及删除多余的标题行（如下下节所述）。更重要的是，如果你向源目录中添加更多文件，然后点击**开始**功能区中的**刷新**，*所有*与筛选条件匹配的源文件都将重新加载，包括添加到指定目录中符合筛选条件的新文件。\n\
  \n> **注意**  \n> 加载多个 Excel 文件时，你需要知道数据源（无论是工作表、命名区域还是表格）在所有源文件中的名称*必须*相同，否则数据将无法加载。\n\
  \n### 显示和筛选文件属性\n\n在查询编辑器中显示文件夹内容时，你会看到一组可用于筛选数据的文件属性。这些属性涵盖基本要素，例如：\n\n*   文件名\n\
  *   文件扩展名\n*   文件夹路径\n*   创建日期\n*   上次访问日期\n*   修改日期\n\n然而，还有更多的文件描述属性可供使用，只需在查询编辑器中显示它们即可。操作方法如下：\n\
  \n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig8_HTML.jpg](img/370912_3_En_10_Fig8_HTML.jpg)\n\
  \n**图 10-8** – 加载多个 Excel 文件时选择源数据\n\n1.  执行上一节中的步骤 1 和 2。\n2.  通过单击**属性**列右侧的**展开**图标（双箭头），显示可用属性。将显示可用属性列表，如图\
  \ 10-8 所示。\n3.  从列表中选择要显示的属性，然后单击**确定**。\n\n每个属性都将作为查询编辑器中的新列出现。现在，你可以基于展开的属性列表，对这些列进行筛选以选择文件。\n\
  \n> **注意**  \n> 你也可以基于显示的目录、日期或任何文件信息进行筛选。只需应用你在第 7 章中学到的筛选技巧即可。\n\n### 多次加载文件后删除标题行\n\
  \n如果源文件中包含为每个源文件加载的标题行，以下是一种快速从数据中删除它们的方法：\n\n1.  如果（且仅当）每个文件包含标题行，则向下滚动生成的表格，直到找到一个标题元素。在本例中，它是\
  \ `ColourID` 列中的单词 *ColourID*。\n2.  右键单击 `ColourID`，然后选择**文本筛选器** ➤ **不等于**。所有包含多余列标题的行都将被删除。\n\
  \n> **注意**  \n> 如果你的源目录只包含你想要加载的文件，则步骤 2 是不必要的。尽管如此，我始终会添加此类步骤，以防以后添加了“错误”类型的文件，导致后续处理运行失败。同样，你也可以设置文件名筛选条件以限制加载的文件。\n\
  \n\n\n## 加载与解析 JSON 文件\n\n如今，越来越多的数据以 JSON 格式进行交换。JSON 代表 JavaScript 对象表示法，它被认为是一种高效且轻量级的方式来传输潜在的大量数据。JSON\
  \ 文件本质上是一种以特定方式结构化数据的文本文件。\n\n虽然 Power BI Desktop 可以非常轻松地连接到 JSON 数据文件（毕竟它们只是一种文本文件），但它们包含的数据并非总能立即可解。因此，你将学习如何加载该文件，并查看如何调整此连接以将其转换为有意义的信息。将源文本转换为可理解的格式通常被称为*解析*数据。\n\
  \n要连接到 JSON 文件并将其包含的数据解析为可用的表格：\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig9_HTML.jpg](img/370912_3_En_10_Fig9_HTML.jpg)\n\
  \n**图 10-9** 初始导入后的 JSON 文件\n\n1. 在\"开始\"功能区中，依次单击\"获取数据\" ➤ \"更多\" ➤ \"文件\" ➤ \"\
  JSON\"，然后单击\"连接\"。\n\n2. 选择文件 `C:\\PowerBiDesktopSamples\\Colors.json`，然后单击\"打开\"\
  。你将看到如图 10-9 所示的记录列表。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig10_HTML.jpg](img/370912_3_En_10_Fig10_HTML.jpg)\n\
  \n**图 10-10** \"转换为表\"对话框\n\n3. 你将看到查询编辑器添加了\"列表工具 转换\"功能区。此功能区将在下一节中详细说明。单击此功能区中的\"\
  转换为表\"按钮。将出现\"转换为表\"对话框，如图 10-10 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig11_HTML.jpg](img/370912_3_En_10_Fig11_HTML.jpg)\n\
  \n**图 10-11** 转换为表的 JSON 文件\n\n4. 单击\"确定\"。数据列表将转换为表格。这意味着它现在会在列标题右侧显示展开图标，如图 10-11\
  \ 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig12_HTML.jpg](img/370912_3_En_10_Fig12_HTML.jpg)\n\
  \n**图 10-12** 转换为数据集的 JSON 文件\n\n5. 单击列标题右侧的展开图标，在弹出的对话框中，取消选中\"使用原始列名作为前缀\"。\n\n\
  6. 单击\"确定\"。JSON 文件的内容现在显示为标准数据集，如图 10-12 所示。\n\n虽然过程并非特别困难，但可能看起来有点违反直觉。然而，它确实有效，你可以使用它来处理复杂的\
  \ JSON 文件，以便在 Power BI Desktop 中使用它们包含的数据。\n\n## \"列表工具 转换\"功能区\n\nPower BI Desktop\
  \ 将某些数据视为列表，而非数据表。它处理列表的方式略有不同，并显示一个特定的功能区来修改列表数据。\"列表工具 转换\"功能区在图 10-13 和表 10-1\
  \ 中进行了说明。\n\n**表 10-1** \"列表工具 转换\"功能区选项\n\n| 选项 | 说明 |\n| --- | --- |\n| 转换为表 |\
  \ 将列表转换为表格结构。 |\n| 保留项目 | 允许你保留列表顶部或底部指定数量的项目，或列表中的一个范围。 |\n| 删除项目 | 允许你删除列表顶部或底部指定数量的项目，或列表中的一个范围。\
  \ |\n| 删除重复项 | 删除列表中的任何重复项。 |\n| 反转项目 | 反转列表顺序。 |\n| 排序 | 将列表从最低到最高或从最高到最低排序。 |\n\
  | 统计信息 | 返回关于列表中元素的计算统计信息。 |\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig13_HTML.jpg](img/370912_3_En_10_Fig13_HTML.jpg)\n\
  \n**图 10-13** \"列表工具 转换\"功能区\n\n### 从列中解析 XML 数据\n\n某些数据源，尤其是数据库源，在字段内部实际上包含了 XML\
  \ 数据。问题在于，当加载数据时，Power BI Desktop 会将 XML 数据解释为纯文本。如果你查看图 10-14 中的 `AvailableColors`\
  \ 列，就会发现这并不是特别有用。\n\n因此，Power BI Desktop 再次提供了针对此类问题的解决方案。为了演示如何将这种文本转换为可用数据，你将找到一个示例\
  \ Excel 文件（`C:\\PowerBiDesktopSamples\\XMLInColumn.xlsx`），其中包含一列 XML 数据。请按以下步骤操作：\n\
  \n1. 在一个新的空白 Power BI Desktop 文件中，单击\"编辑查询\"切换到查询编辑器。\n\n2. 在\"开始\"功能区中，依次选择\"新建源\"\
  \ ➤ \"Excel\"。\n\n3. 选择 Excel 文件 `C:\\PowerBiDesktopSamples\\XMLInColumn.xlsx`。\n\
  \n4. 选择此文件中的唯一工作表。它名为 Sales。\n\n5. 滚动到数据集的右侧，选择最后一列：`AvailableColors`。导航器对话框如图 10-14\
  \ 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig14_HTML.jpg](img/370912_3_En_10_Fig14_HTML.jpg)\n\
  \n**图 10-14** 包含 XML 的列\n\n6. 单击\"确定\"连接到源文件。\n\n7. 选择数据集右侧的 `AvailableColors` 列。\n\
  \n8. 在\"添加列\"功能区中，单击\"解析\" ➤ \"XML\"。将在右侧添加一个新列。该列将如图 10-15 所示，标题为 `XML`。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig15_HTML.jpg](img/370912_3_En_10_Fig15_HTML.jpg)\n\
  \n**图 10-15** 转换为表格列的 XML 列\n\n9. 单击 `XML` 列标题右侧的展开图标，在弹出的对话框中取消选中\"使用原始列名作为前缀\"\
  。确保选中所有列，然后单击\"确定\"。两个新列（或者确切地说，与 XML 数据元素数量一样多的新列）将出现在数据集的右侧。查询编辑器将如图 10-16 所示。\n\
  \n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig16_HTML.jpg](img/370912_3_En_10_Fig16_HTML.jpg)\n\
  \n**图 10-16** 扩展到新列中的 XML 数据\n\n10. 通过选择包含原始 XML 的列，然后在上下文菜单中单击\"删除列\"，来删除包含初始 XML\
  \ 数据的列。\n\n使用此技术，你现在可以提取源数据集中的 XML 数据，并使用它来扩展原始源数据。\n\n\n\n### 解析列中的 JSON 数据\n\n\
  有时，你可能会遇到字段中包含 JSON 的数据。从数据集中的字段提取这些数据并将其转换为列的技术，与你之前在上一节中看到的 XML 数据处理方法几乎相同。\n\n\
  鉴于这种方法非常相似，并且与你之前导入 JSON 文件时看到的步骤相差无几，这里我将只提供处理最终结果的截图。在此截图中，你将看到源 JSON 以及从 JSON\
  \ 中提取并添加到数据集中的数据列。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig17_HTML.jpg](img/370912_3_En_10_Fig17_HTML.jpg)\n\
  \n**图 10-17** 展开为新列的 JSON 数据\n\n1.  在一个新的空白 Power BI Desktop 文件中，从 Excel 文件 `C:\\\
  PowerBiDesktopSamples\\JSONInColumn.xlsx` 加载数据，并切换到查询编辑器。选择此文件中唯一的工作表：Sales。\n2.\
  \  滚动到数据集右侧，选择最后一列：AvailableColors。\n3.  在“添加列”功能区中，单击“解析” → “JSON”。右侧将添加一个新列，其标题为\
  \ JSON。\n4.  单击 JSON 列标题右侧的“展开”图标，并在弹出对话框中取消选中“使用原始列名作为前缀”。确保所有列都被选中，然后单击“确定”。数据集右侧将出现两个新列（实际上，新列的数量与\
  \ JSON 数据元素的数量一致）。查询编辑器将如图 10-17 所示。\n5.  删除包含原始 JSON 数据的列。\n\n诚然，本例中 JSON 数据的结构极其简单。现实世界中的\
  \ JSON 数据可能复杂得多。不过，你现在有了一个起点，可以在此基础上解析存储在数据集列中的 JSON 数据。\n\n#### 复杂的 JSON 文件\n\n\
  JSON 文件的结构并不总是像你几页前看到的 `colors.json` 文件那样简单。实际上，JSON 文件可能包含多个数据子层，这些子层被组织成独立的*节点*。每个节点可能包含以逻辑方式分组在一起的多个数据元素。通常，你需要从源文件中选择数据的“子层”——或者可能只选择某些子层元素，而不选择其他元素。\n\
  \n本节将向你展示如何从复杂的 JSON 结构中选择你感兴趣的数据元素。具体来说，示例源数据文件包含一个“根”层，其中显示核心数据，如发票号、销售日期和销售价格（以及其他元素），以及三个包含以下信息的“子层”：\n\
  \n-   车辆\n-   财务数据\n-   客户\n\n> **注意**：如果你想了解包含多个嵌套节点的复杂 JSON 文件的大致结构，只需在文本编辑器中打开文件\
  \ `C:\\PowerBIDesktopSamples\\CarSalesJSON_Complex.json`。\n\n在本例中，你将学习如何从源文件中的一个或多个（但不是全部）可用数据中选择元素：\n\
  \n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig18_HTML.jpg](img/370912_3_En_10_Fig18_HTML.jpg)\n\
  \n**图 10-18** 打开一个复杂的 JSON 文件\n\n1.  在 Power BI Desktop 功能区中，单击“获取数据” → “文件”，然后在“获取数据”对话框右侧的文件源列表中选择“JSON”。\n\
  2.  单击“连接”并导航到包含要加载的 JSON 文件的文件夹（本例中为 `C:\\PowerBIDesktopSamples\\CarSalesJSON_Complex.json`）。\n\
  3.  单击“打开”。查询编辑器窗口将出现，并自动显示“记录工具转换”功能区。你可以在图 10-18 中看到这一点。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig19_HTML.jpg](img/370912_3_En_10_Fig19_HTML.jpg)\n\
  \n**图 10-19** 一个复杂的 JSON 文件\n\n4.  从“记录工具转换”功能区中单击“转换为表”。查询编辑器将如图 10-19 所示。\n\n\
  ![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig20_HTML.jpg](img/370912_3_En_10_Fig20_HTML.jpg)\n\
  \n**图 10-20** 展开一个 JSON 文件\n\n5.  单击 Value 列右上角的“展开”图标，然后选择“扩展到新行”。查询编辑器将如图 10-20\
  \ 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig21_HTML.jpg](img/370912_3_En_10_Fig21_HTML.jpg)\n\
  \n**图 10-21** 查看 JSON 文件的结构\n\n6.  单击 Value 列右上角的“展开”图标，然后单击“确定”以显示所有 JSON 属性。查询编辑器窗口将如图\
  \ 10-21 所示。每个包含“记录”一词的列实际上都是一个包含更深层子层数据的 JSON 节点。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig22_HTML.jpg](img/370912_3_En_10_Fig22_HTML.jpg)\n\
  \n**图 10-22** JSON 文件中的嵌套元素\n\n7.  选择“Vehicle”列，然后单击列标题右侧的“展开”图标。将显示源 JSON 内“嵌套”在更低层的可用元素列表。你可以在图\
  \ 10-22 中看到这一点。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig23_HTML.jpg](img/370912_3_En_10_Fig23_HTML.jpg)\n\
  \n**图 10-23** 解析后的 JSON 文件\n\n8.  单击“确定”。新列将添加到数据表中。\n9.  选择“Finance”列，然后单击列标题右侧的“展开”图标。将显示此列对应的源\
  \ JSON 内“嵌套”在更低层的可用元素列表。仅选择“Cost”列，然后单击“确定”。\n10. 删除“Customer”列。查询编辑器窗口将如图 10-23\
  \ 所示，所有必需的列现在都显示在数据表中。\n11. 单击 Power BI Desktop 窗口顶部的“应用更改”按钮。\n\n> **提示**：当你在识别\
  \ JSON 节点中的嵌套数据时，一个好的做法是单击“展开”弹出菜单中的“加载更多”链接。这将强制 Power Query 扫描更多记录，并可能返回更完整的嵌套字段列表。\n\
  \n这种方法使你可以高度灵活地选择从 JSON 文件中加载的数据。你可以选择包含源结构中任何层的任何列。如你所见，你可以非常轻松地选择或忽略整个嵌套数据子层。\n\
  \n本节只是对解析复杂 JSON 文件的简单介绍。由于这种特殊的数据结构可能包含多个数据子层，并且可以在 JSON 文件的每个“节点”中混合数据和子层，因此源数据结构可能极其复杂。幸运的是，你刚刚学到的技术可以扩展以处理任何复杂程度的\
  \ JSON，并帮助你驾驭最令人生畏的数据结构。\n\n> **注意**：“展平”源数据非常重要，这样可以移除所有子层（或节点），并将它们包含的数据显示为查询中的简单列。\n\
  \n\n\n### 复杂 XML 文件\n\n与 JSON 文件一样，XML 文件可以包含多层数据组成的复杂嵌套结构，这些数据被分组到不同的节点中。好消息是，Power\
  \ BI 查询编辑器处理这两种数据结构的方式相似。\n\n这两种方法非常相似，因此我不会展示所有截图——它们与上一节中的内容几乎完全相同。\n\n1. 在 Power\
  \ BI Desktop 的功能区中，依次点击 `获取数据` ➤ `文件`，然后在 `获取数据` 对话框右侧的文件源列表中选择 `XML`。\n\n2. 点击\
  \ `连接`，然后导航到包含要加载的 XML 文件的文件夹（本例中为 `C:\\PowerBIDesktopSamples\\ComplexXML.Xml`）。\n\
  \n3. 选择名为 `Sales` 的 XML 节点，然后点击 `转换数据`。查询编辑器窗口将会出现。\n\n4. 选择 `Vehicle` 列，然后点击列标题右侧的\
  \ `展开` 图标。将显示嵌套在源 XML 内部较低级别的可用元素列表。\n\n5. 点击 `确定`。新列将被添加到数据表中。\n\n6. 选择 `Finance`\
  \ 列，然后点击列标题右侧的 `展开` 图标。将显示嵌套在源 XML 内部较低级别的可用元素列表。仅选择 `Cost` 列，然后点击 `确定`。\n\n7. 移除\
  \ `Customer` 列。\n\n8. 点击 Power BI Desktop 窗口顶部的 `应用更改` 按钮。\n\n与 JSON 文件的情况一样，这种方法允许你极其有选择性地从\
  \ XML 源文件加载数据。你可以选择包含源结构中任何级别的任何列。你可以极其轻松地选择或忽略整个嵌套数据的子级别。\n\n### 将列转换为列表\n\n有时你需要使用列表格式的数据。在第\
  \ 11 章学习如何参数化查询时，你将看到一个实际示例。幸运的是，Power BI Desktop 让你能够非常轻松地将列转换为列表：\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig24_HTML.jpg](img/370912_3_En_10_Fig24_HTML.jpg)\n\
  \n图 10-24\n\n从“转换为列表”操作得出的列表\n\n1. 依次点击 `获取数据` ➤ `Excel`，然后连接到 Excel 文件 `C:\\PowerBiDesktopSamples\\\
  BrilliantBritishCars.xlsx`。\n\n2. 选择 `BaseData` 工作表，然后点击 `转换数据` 以打开查询编辑器。\n\n3.\
  \ 通过单击列标题来选择要转换为列表的列。本例中我将使用 `Make` 列。\n\n4. 在 `转换` 功能区中，单击 `转换为列表`。如图 10-24 所示，查询编辑器将显示生成的列表。\n\
  \n在执行更高级的数据转换过程时，此列表现在可以在某些情况下使用。\n\n## 重用数据源\n\n在第 2 章至第 6 章中，你已经了解了如何从各种源访问数据以跨一系列报告构建多个查询。实际情况很可能是你经常需要反复指向相同的数据源。有鉴于此，Power\
  \ BI 开发团队找到了一种方法来简化你的工作。\n\nPower BI Desktop 会记住你最近使用过的数据源，并让你在任何报告中都能快速轻松地重用它们。操作步骤如下：\n\
  \n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig25_HTML.jpg](img/370912_3_En_10_Fig25_HTML.jpg)\n\
  \n图 10-25\n\n最近使用的源\n\n1. 在 `开始` 功能区中，点击 `最近使用的源` 按钮。将显示最近使用的十几个数据源的列表。你可以在图 10-25\
  \ 中看到这个列表。\n\n2. 点击你想要重新连接的数据源，然后继续加载或连接数据。\n\n如果你找不到所需的数据源，并且确定最近使用过它，则可以滚动到此列表底部并点击\
  \ `更多`。Power BI Desktop 将在 `最近使用的源` 对话框中显示完整的最近使用的源列表，如图 10-26 所示。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig26_HTML.jpg](img/370912_3_En_10_Fig26_HTML.jpg)\n\
  \n图 10-26\n\n`最近使用的源` 对话框\n\n如果你要连接到任何允许 DirectQuery 或实时连接的数据库或数据仓库源，将会看到一个类似图 10-27\
  \ 的对话框。\n\n![../images/370912_3_En_10_Chapter/370912_3_En_10_Fig27_HTML.jpg](img/370912_3_En_10_Fig27_HTML.jpg)\n\
  \n图 10-27\n\n重用现有连接时定义连接设置\n\n在这里，你可以决定是加载数据还是使用直接连接，这次是针对所选的数据源。\n\n### 固定数据源\n\
  \n如果你仔细查看图 10-26，会看到 Excel 文件 `CarMakeAndModelMatrix.xlsx`（以及其他文件）被固定在 `最近使用的源`\
  \ 对话框的顶部。这可以确保某些数据源始终在手边，随时可以重用。\n\n要将最近使用的数据源固定到最近使用的源菜单和对话框，请执行以下操作：\n\n1. 点击\
  \ Power BI Desktop“开始”功能区中的 `最近使用的源` 按钮。\n\n2. 滚动到菜单底部并点击 `更多`。将出现 `最近使用的源` 对话框。\n\
  \n3. 将鼠标悬停在最近使用的数据源上。数据源名称的右侧将出现一个图钉图标。\n\n4. 点击图钉图标。该数据源即被固定到 `最近使用的源` 菜单和 `最近使用的源`\
  \ 对话框的顶部。数据源名称的右侧会保留一个小的图钉图标。\n\n**注意**\n\n要从 `最近使用的源` 菜单和 `最近使用的源` 对话框中取消固定一个数据源，你只需点击已固定数据源的图钉图标。这将取消固定，并且它会重新出现在最近使用的数据源列表中。\n\
  \n如果你愿意，在决定要在 `最近使用的源` 列表中显示哪些元素时，还可以应用以下选项：\n\n- `从列表中移除`\n- `清除列表中未固定的项`\n\n###\
  \ 从 Power BI Desktop 查询编辑器复制数据\n\nPower BI Desktop 被设计为数据目的地。它本身没有任何数据导出功能。但是，你可以从\
  \ Power BI Desktop 查询编辑器手动复制数据。更准确地说，你可以复制以下任何内容：\n\n- 查询中的数据\n- 一列数据\n- 单个单元格\n\
  \n在所有情况下，过程都是相同的：\n\n1. 点击要复制的元素。这可以是\n   - 数据网格左上角的方块\n   - 列标题\n   - 单个单元格\n\n\
  2. 右键单击并从上下文菜单中选择 `复制`。\n\n然后你可以将剪贴板中的数据粘贴到目标应用程序中。\n\n**注意**\n\n此过程有些限制，因为你不能选择单元格区域。并且你必须记住，在查询编辑器中你看到的只是示例数据。但是，你可以点击\
  \ `关闭并应用`，然后切换到 `表视图`（如第 13 章所述），在那里你可以复制整个表。\n\n\n\n## 结论\n\n本章通过讲解如何处理基于 Excel\
  \ 和文本数据源的多个文件加载，将你使用 Power BI 查询编辑器进行数据转换的知识提升到了一个新高度。随后，你学习了如何处理包含复杂嵌套结构的源文件数据——特别是\
  \ JSON 和 XML 文件。你还了解到如何从其他数据源所含的列中解析 JSON 和 XML 元素。\n\n接着，你学习了如何重用数据源以及管理常用数据源以节省时间。最后，你学习了如何将数据转换过程中产生的样本数据复制到其他应用程序中。\n\
  \n至此，关于使用 Power BI 查询编辑器进行数据加载与转换的基础介绍就告一段落了。现在是时候学习更高级的技术了，你可以运用这些技术来加速、增强、管理和构建你的数据转换流程。这些方法正是接下来两章的主题。\n\
  \n"
- "# 11. 组织、管理和参数化查询\n\n创建一个健壮且高效的数据查询，不仅仅是找到合适的加载与转换函数并按正确顺序排列它们。它还涉及扩展、调整和维护整个流程。这可能是为了在测试查询时纠正错误，也可能是为了适应新的需求。本章将介绍一些可用于处理查询生命周期各个阶段的技术。\n\
  \n创建一个引人注目的仪表板可能意味着要从大量且多样化的查询中获取数据。这也可能意味着这些查询需要相互连接，以形成一个数据转换的级联流程，从而从多个来源整理出实用且可用数据模型的核心元素。因此，你需要知道如何*管理*你所创建的查询，以便高效地使用它们，并在实际场景中保持对查询的有效控制。\n\
  \n然而，并非所有的数据流都是固定不变且可预测的。不可避免地，会有一些情况，你需要根据源数据的特征来定制数据摄取过程。这可能意味着要对查询进行参数化以允许用户交互，或者动态调整数据流。\n\
  \n## 管理转换过程\n\n到目前为止，我们应用的大多数转换步骤都是可以应用于几乎任何数据表的独立元素。然而，即使是在执行一个简单的数据加载和转换过程时，你也可能希望通过多个转换步骤来塑造、清理和过滤数据，以达到期望的结果。这正是\
  \ Power BI Desktop 方法如此灵活的原因，因为你可以将大部分数据转换步骤应用于几乎任何数据表。其艺术在于将它们安排成一个序列，这个序列可以在数据发生变化时被重复使用，以重新处理新的源数据并提供最新的输出结果。\n\
  \n理解和管理这一过程的关键在于熟悉`查询设置`窗格中的`已应用步骤`列表。该列表包含了你应用的每一步的详细信息，并按应用顺序排列。每个步骤都保留了 Power\
  \ BI Desktop 在创建时赋予的名称，并且每个步骤都可以通过以下方式进行修改：\n\n-   **重命名**\n-   **删除**\n-   **移动**（在某些情况下）\n\
  \n更令人欣慰的是，在许多情况下，步骤本身也是可以修改的。这样一来，你就不必受限于最初的选择，而是有机会对流程中的各个步骤进行调整和优化。这可以避免你重建整个\
  \ ETL 例程中的步骤序列，只需替换其中的一个环节即可。\n\n为了试验修改查询的各种方法，你需要一些初始数据。因此，我建议你首先创建一个查询，从以下 Excel\
  \ 源文件加载数据：`C:\\PowerBiDesktopSamples\\CarSalesDataForQueries.xlsx`。从该源文件中，选择以下工作表：\n\
  \n-   `Clients`\n-   `Colors`\n-   `Countries`\n-   `Invoices`\n-   `InvoiceLines`\n\
  -   `Stock`\n\n数据加载完成后，切换到查询编辑器窗口。\n\n### 修改步骤\n\n如何修改一个步骤取决于原始转换是如何应用的。经过一点实践，这就会变得得心应手，并且总是涉及首先单击你想要修改的步骤，然后应用不同的修改。如果你调用功能区选项（例如更改数据类型），则只需直接从功能区应用另一种数据类型即可更改数据类型。如果你使用的是显示对话框的选项（例如拆分列等），则可以在`已应用步骤`列表中右键单击该步骤，然后从上下文菜单中选择`编辑设置`。或者，如果你愿意，也可以单击大多数（但并非全部）步骤右侧显示的“齿轮”图标，打开一个对话框，你可以在其中调整步骤设置。此对话框将显示你最初应用的所有选项和设置；你可以在其中进行任何你认为必要的修改。\n\
  \n最后一种可以轻松修改流程设置的方法是，每次单击某个步骤时，编辑公式栏中显示的公式。然而，这需要理解支撑数据转换过程的每一段代码的所有复杂性。我将在第 12\
  \ 章中对代码修改进行简要介绍。\n\n**提示**\n\n如果你能强迫自己将使用 Power BI Desktop 编写的过程组织起来，那么稍微提前思考和规划就能带来丰厚的回报。例如，某些任务（如设置数据类型）可以在单个操作中完成。这意味着你只需在一个地方查找一组类似的数据转换即可。不仅如此，如果之后需要更改某个列的数据类型，我建议你在进行任何进一步修改之前，先单击`更改的类型`步骤。这样，你是在扩展原始步骤，而不是创建其他步骤——这可能会使过程更加混乱且不必要地冗长。\n\
  \n### 重命名步骤\n\nPower BI Desktop 使用已应用转换的名称来命名步骤。这意味着如果之后应用了另一个类似的步骤，Power BI Desktop\
  \ 会使用相同的名称并加上数字增量。由于在查看一系列转换步骤时，这并不总是易于理解，因此你可能更愿意为各个步骤提供更友好的名称。操作步骤如下：\n\n1.  选择查询（或者，如果你愿意，可以选择源表或工作表）。在此示例中，我将使用`Clients`查询。\n\
  2.  右键单击你想要重命名的步骤，例如`更改的类型`。\n3.  从上下文菜单中选择`重命名`。\n4.  输入新名称。我将使用`NewDataTypes`。\n\
  5.  按`Enter`键。\n\n该步骤即被重命名，新名称将出现在`查询设置`窗格的`已应用步骤`列表中。这样，你可以确保在几天、几周甚至几个月后重新查看某个数据转换过程时，能够更直观地理解你定义的流程以及你为何如此塑造数据。\n\
  \n\n\n### 删除步骤或一系列步骤\n\n删除步骤看似简单，但这样做可能会带来严重后果。这是因为 ETL 流程通常是一系列紧密耦合的事件，每个事件都严重依赖于前一个事件。因此，删除一个步骤可能导致后续所有步骤失败。要知道哪些步骤可以删除而不会产生严重后果，这取决于你正在开发的流程类型以及你使用\
  \ Power BI Desktop 的经验。无论如何，如果你需要删除一个步骤，请按以下步骤操作：\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig1_HTML.jpg](img/370912_3_En_11_Fig1_HTML.jpg)\n\
  \n**图 11-1** – `删除步骤` 对话框\n\n1. 将鼠标指针悬停在要删除的流程步骤上。\n2. 点击出现的叉号（`×`）图标。\n3. 选择 `删除`。可能会出现`删除步骤`对话框，如图\
  \ 11-1 所示。\n4. 点击 `删除` 按钮进行确认。该步骤即被删除。\n\n如果——这很有可能发生——删除此步骤导致流程的其余部分出现问题，你会看到数据表被一条错误消息所替代。该消息的具体内容将取决于\
  \ Power BI Desktop 遇到的错误类型。\n\n在描述此技巧时，我特意指出你*可能*会看到`删除步骤`对话框。如果你删除的是一个步骤序列中的最后一步，那么你可能不会看到它，因为此时通常不会产生任何潜在的严重后果；最坏的情况是，你需要重新创建该步骤。如果你删除的是流程中间的一个步骤，那么在引发大量潜在问题之前，你或许应该认真考虑是否要这样做。因此，在这些情况下，系统会要求你确认删除操作。\n\
  \n**注意：** 如果在此时你意识到自己刚刚毁掉了数小时的工作成果，那么（深吸一口气后）请点击 Power BI Desktop 窗口中的 `文件` 菜单（位于左上角的向下三角形）并选择\
  \ `关闭`，然后不保存就关闭 Power BI Desktop。不要指望能像在其他桌面应用中使用撤销功能那样操作。为了降低你的血压，你或许更应该在*删除任何步骤之前*，保存一份包含复杂数据转换过程文件的副本。你也可以将整个数据转换过程复制为`M`代码——你将在下一章学到这一点。\n\
  \n另一种方法是右键单击要删除的步骤并选择 `删除`。你可能仍然需要确认删除操作。\n\n如果你意识到某个流程步骤中的错误使你截至流程结束的所有工作都无效，那么与其逐个删除多个元素，不如在上述练习的步骤\
  \ 2 处，从上下文菜单中选择 `删除至末尾`。\n\n### 修改现有步骤\n\n当你创建一系列应用步骤来生成和转换数据流时，Power BI Desktop\
  \ 并不会强制你锁定在僵化的事件序列中。当你发现需要修改流程中的某个步骤时，这一点会变得非常明显。\n\n例如，假设你发现从 Excel 中选择初始数据时加载了错误的工作表。当你只需简单地替换工作表名称时，你并不想重复整个过程。\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig2_HTML.jpg](img/370912_3_En_11_Fig2_HTML.jpg)\n\
  \n**图 11-2** – 用于步骤修改的 `导航` 对话框\n\n1. 选择你想要修改的查询（此示例中为`Clients`）。\n2. 点击要修改的步骤（此例中为\
  \ `Navigation`）。\n3. 点击步骤名称右侧的齿轮（或设置）图标。将出现相应的对话框。本例中显示的将是你在图 11-2 中看到的 `导航` 对话框。\n\
  4. 点击你想要用来替换当前数据集的表或工作表（此示例中为 `LatestClients`）。\n5. 点击 `确定`。\n\n查询编辑器将用一个源数据集替换另一个。它可能还会添加额外的步骤，以确保数据适合在查询中使用。\n\
  \n正如你在前十章中所见，Power BI Desktop 提供了广泛的数据摄取和修改可能性。因此，我无法在此描述修改“应用步骤”相关的所有可能选项。尽管如此，其原理很简单：\n\
  \n- 如果查询编辑器可以修改某个步骤，则步骤名称右侧会显示齿轮图标。\n- 点击修改（齿轮）图标将显示用于创建该步骤的对话框（或者，即使该步骤是由 Power\
  \ BI Desktop 自动创建的，该对话框也可用于修改该步骤）。\n\n某些步骤不显示修改图标。这是因为该步骤无法修改，只能删除（至少在使用查询编辑器界面时如此）。举个例子，请添加以下步骤：\n\
  \n1. 选择你想要修改的查询（此示例中为`Clients`）。\n2. 点击最后一个步骤。\n3. 右键单击 `Address2` 列并选择 `删除`。\n\n\
  `已删除列` 这个新步骤将出现在 `应用步骤` 列表中。此步骤没有修改图标。因此，目前你可以删除它，但*不能*修改它——至少不能通过图形用户界面来实现。不过，你可以像在第\
  \ 12 章中学到的那样修改步骤的代码。\n\n**注意：** 修改现有步骤并非“万能灵药”。这是因为一系列数据转换可能高度依赖于为特定数据结构量身定制的逻辑。例如，这也就意味着，你只能将数据源替换为另一个结构几乎完全相同的数据源。然而，修改步骤在很多情况下可以避免你重写整个数据流序列。\n\
  \n### 添加步骤\n\n你可以在序列中的任何位置添加步骤。你只需点击*位于*你想要插入的新步骤*之前*的步骤，然后再点击任何功能区中对应新步骤的图标。与删除步骤时的情况类似，Power\
  \ BI Desktop 会显示一条警告，提示此操作*可能*会导致从此新步骤开始的后续流程出现问题。\n\n### 更改流程步骤顺序\n\n从技术上来说，对流程中的步骤重新排序是可能的。然而，根据我的经验，这并不总是可行的，因为改变流程中步骤的顺序可能和删除步骤一样造成严重破坏。不过，你仍然可以像这样尝试一下：\n\
  \n1. 右键单击你想要重新排序的步骤。\n2. 从上下文菜单中选择 `上移` 或 `下移`。\n\n我仍然不认为这能创造奇迹，但知道有这种功能也不错。\n\n\
  **提示：** 请记住，在调整流程应用顺序之前，点击任何流程步骤都会导致 Power BI Desktop 窗口中的表格刷新，以显示截至并包含所选步骤的数据状态。这是对流程以及\
  \ ETL 过程如何执行的一个非常清晰的视觉指南。\n\n\n\n## 排序方法\n\n面对数组形式的数据转换选项，您很可能会疑惑：在使用 Power BI Desktop\
  \ 开展新 ETL 项目时，最佳方法是什么？我深知每个项目各有不同，但作为一份简明指南，我建议按以下顺序组织项目：\n\n1. 将数据加载到 Power BI\
  \ Desktop 中。\n2. 提升或添加易理解的列标题。例如，当`Column29`可以改为（比如）`ClientName`时，您肯定不希望在某流程的第 47\
  \ 步还要琢磨这个列名是什么。\n3. 移除任何不需要的列。数据集越小，处理速度越快。此外，如果您只关注真正需要的信息，将更容易集中精力理解数据。已移除的列只需删除或编辑对应的移除步骤即可恢复。\n\
  4. 修改表中每一列的数据类型。正确的数据类型是许多转换步骤的基础，对筛选也至关重要，因此最好尽早完成设置。\n5. 筛选掉任何不需要的记录。再次强调，数据集越小，处理速度越快。这包括去重操作。\n\
  6. 解析任何复杂的 JSON 或 XML 元素。\n7. 执行必要的数据清洗。\n8. 执行必要的转换操作。\n9. 执行必要的列拆分或添加自定义列。\n10.\
  \ 添加衍生列。\n11. 添加任何计算或数据逻辑转换。\n12. 处理 ETL 流程中产生的所有错误记录。\n\n再次强调，这并非权威指南。但我希望，当您使用\
  \ Power BI Desktop 创建数据加载和转换流程时，它能帮助您\"拨云见日\"。\n\n## 错误记录\n\n某些数据转换操作会引发错误。在处理混合源数据时，这是常态。例如，大型数据集中的某日期列可能包含几行文本或数字记录。若将该列转换为日期数据类型，任何无法转换的值都会显示为错误值。\n\
  \n### 移除错误\n\n假设您不需要 Power BI Desktop 标记为包含错误的记录，可以一次性移除所有这些记录：\n\n1. 点击包含错误的列内部；若需同时移除多列的错误，请按住`Ctrl`键点击包含错误的列标题。\n\
  2. 在\"开始\"功能区点击\"移除错误\"。所选列中标记为错误的记录将被删除。`已移除错误`步骤会添加到`应用的步骤`列表中。\n\n此处必须格外谨慎，以免删除有效数据。只有您查看数据后，才能判断某列中的错误是否意味着可以安全丢弃该数据。其他情况下，最佳建议是清洗数据，或保留包含错误的记录。潜在错误的种类和多样性如同数据本身一样浩瀚。\n\
  \n## 管理查询\n\n一旦您使用 Power BI Desktop 一段时间，很可能会沉迷于基于更广泛数据源创建更多、更深入的分析。这必然意味着要学会高效、富有成效地管理数据模型所依赖的数据源。\n\
  \n幸运的是，Power BI Desktop 查询自带一系列查询管理工具，包括：\n\n- 组织查询\n- 分组查询\n- 复制查询\n- 引用查询\n- 记录查询\n\
  - 将列添加为新查询\n- 启用数据加载\n- 启用报表刷新\n\n让我们逐一了解这些功能。\n\n### 组织查询\n\n当您在 Power BI Desktop\
  \ 查询编辑器中使用十几个或更多查询时，可能希望对它们的组织方式加以控制。首先，您可以修改查询在 Power BI Desktop 查询编辑器窗口左侧\"查询\"\
  窗格中的显示顺序。这允许您覆盖默认顺序（即最近添加的数据源显示在列表底部）。\n\n按以下步骤调整查询在列表中的位置：\n\n1. 右键点击要移动的查询。\n\
  2. 从上下文菜单中选择\"上移\"（或\"下移\"）。\n\n若要多次移动查询位置，需重复此操作。\n\n### 分组查询\n\n您还可以创建自定义组，更好组织正在使用的\
  \ Power BI Desktop 文件中的查询。这不会影响查询的工作方式。分组查询仅是一种组织技巧，不会以任何方式改变您在 Power BI Desktop\
  \ 报表模式下看到的数据表。\n\n#### 创建新组\n\n以下说明如何创建新组：\n\n![images/370912_3_En_11_Chapter/370912_3_En_11_Fig3_HTML.jpg](img/370912_3_En_11_Fig3_HTML.jpg)\n\
  \n**图 11-3** – \"新建组\"对话框\n\n1. 右键点击要添加到新组的查询。此处以`Colors`查询为例。\n2. 从上下文菜单中选择\"移动到组\"\
  \ ➤ \"新建组\"。将出现\"新建组\"对话框。\n3. 输入组名称，（可选）添加描述。我将组命名为`ReferenceData`。对话框将如图 11-3\
  \ 所示。\n4. 点击\"确定\"。\n\n新组创建完成，所选查询将出现在该组中。\"查询\"窗格将如图 11-4 所示。\n\n![images/370912_3_En_11_Chapter/370912_3_En_11_Fig4_HTML.jpg](img/370912_3_En_11_Fig4_HTML.jpg)\n\
  \n**图 11-4** – 添加新组后的\"查询\"窗格\n\n**注意：** 默认情况下，所有其他查询会被添加到名为`其他查询`的组中。\n\n#### 重命名组\n\
  \n您可以重命名任何已添加的组。\n\n1. 右键点击要重命名的组。\n2. 从上下文菜单中选择\"重命名\"。\n3. 编辑或替换名称。\n4. 按`Enter`键。\n\
  \n**注意：** `其他查询`组无法重命名或删除。默认情况下，所有新查询都将添加到该组。\n\n#### 将查询添加到组\n\n要将查询从当前组移动到其他组，可执行以下步骤：\n\
  \n1. 右键点击要添加到其他现有组的查询。\n2. 从上下文菜单中选择\"移动到组\" ➤ *目标组名称*。\n\n所选查询将移至指定组。\n\n### 复制查询\n\
  \n如果您已完成大量数据转换工作，在对项目进行任何潜在风险变更前，很可能希望保留原始查询的副本。幸运的是，这非常简单。\n\n1. 右键点击要复制的查询。\n\
  2. 从上下文菜单中选择\"复制\"。\n\n查询被复制，副本出现在源查询所在组内的查询列表中。副本名称与原始查询相同，并附加带括号的数字。您始终可以在\"查询设置\"\
  窗格或查询编辑器窗口左侧的\"查询\"窗格中重命名它。\n\n**注意：** 如果愿意，您也可以使用复制粘贴功能。这一技巧的优势在于：在粘贴查询副本*之前*，只需点击目标组的文件夹图标，即可为复制后的查询选择目标组。\n\
  \n\n\n### 引用查询\n\n如果您正在构建复杂的 ETL（提取、转换、加载）流程，您可能会考虑分阶段组织工作，以便更好地管理整个过程。为此，Power\
  \ BI Desktop 查询编辑器允许您*将一个查询的输出用作另一个查询的源*。这样您就可以将流程的不同部分（例如，结构、筛选，然后是清洗）分解为单独的查询，从而能够专注于不同查询中转换的不同方面。\n\
  \n要将一个查询的输出用作另一个查询的源数据，您需要*引用*一个查询。具体操作如下：\n\n1.  右键单击要用作新查询源数据的查询。\n2.  从上下文菜单中选择\
  \ `引用`。新查询将在 `查询` 窗格的查询列表中创建。\n3.  右键单击新查询，选择 `重命名`，并为其指定一个有意义的名称。\n\n除非您重命名新查询，否则新查询的名称将与原始查询相同，并附加一个括号数字。如果您单击新查询，您在引用的查询中看到的数据将与单击源查询的最终步骤时看到的数据完全相同。\n\
  \n从现在开始，您在引用的（源）查询中所做的任何修改都会对用作第二个查询源的数据产生影响。\n\n在实践中，我猜想您不会希望使用同一查询的两个副本来创建报表。实际上，如果一个查询被用作“中间”查询，它包含的数据可能甚至不是完全可用的。因此，您可能希望*使中间查询对\
  \ Power BI Desktop 中的报表和仪表板不可用*。具体操作如下：\n\n1.  右键单击原始（源）查询。\n2.  在上下文菜单中取消选中 `启用加载`。菜单项左侧的复选标记将会消失。\n\
  \n源查询将不再出现在 `报表视图` 中，因此无法在视觉对象中使用。值得注意的是，任何“中间”查询（即用于修改数据但不在 `数据视图` 或 `报表视图` 中显示的查询）都会以斜体显示。\n\
  \n您可能会疑惑为什么要创建“中间”查询。以下是一些思路：\n\n*   您希望将复杂的数据转换隔离到更易于管理的子集中。例如，您可能希望一个中间查询转换数据，而后续的查询清洗数据。\n\
  *   您可能希望应用一组通用的初始转换，然后将数据反馈到两个独立的数据准备路径中——一个用于详细视图的数据，另一个用于聚合视图的数据。\n\n> **注意：**\
  \ 请确保任何现有报表未使用您随后以此方式设为不可用的查询，否则您的报表中将出现损坏的视觉对象。\n\n### 记录查询\n\n在复杂的 ETL 过程中，很容易混淆——或者根本忘记——哪个查询执行什么功能。因此，我总是建议通过添加有意义的描述来记录查询。\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig5_HTML.jpg](img/370912_3_En_11_Fig5_HTML.jpg)\n\
  \n*图 11-5： 为查询添加描述*\n\n1.  右键单击您想要添加注释的查询。\n2.  从上下文菜单中选择 `属性`。将出现 `查询属性` 对话框。\n\
  3.  添加描述。结果可能类似于图 11-5 中所示的对话框。\n4.  单击 `确定`。\n\n现在，当您将光标悬停在查询编辑器中查询列表的查询名称上时，您添加的描述会作为工具提示显示。\n\
  \n### 将列添加为新查询\n\n有时您可能需要提取一列数据并将其用作单独的查询。例如，可能是您需要它包含的数据作为另一个查询的引用数据。以下步骤说明了如何实现这一点：\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig6_HTML.jpg](img/370912_3_En_11_Fig6_HTML.jpg)\n\
  \n*图 11-6： “到表”对话框*\n\n1.  在左侧的 `查询` 列表中，选择包含您想要隔离为新查询的列的查询。\n2.  右键单击包含您想要隔离的数据的列标题。\n\
  3.  从上下文菜单中选择 `添加为新查询`。将创建一个新查询。其名称来源于原始查询和源列。\n4.  在 `转换` 功能区中，单击 `到表`。将出现 `到表`\
  \ 对话框，如图 11-6 所示。\n5.  单击 `确定`。新查询将成为一个数据表，并将具有您所选列的名称。\n6.  如果您认为有必要，重命名该查询。\n\n\
  现在，您可以在数据模型中使用此查询，并将其作为链接查询过程集合的一部分。\n\n> **注意：** 以这种方式创建的查询与从中获取数据的源查询完全断开连接。换句话说，对源数据的任何刷新都将*不会*影响您从列创建的新查询。\n\
  \n### 启用数据加载\n\n您可能已经得到这样的印象：您创建的任何查询都将始终成为 Power BI Desktop 数据模型的一部分。但事实**并非**如此，正如我在引用查询部分简要提到的。例如，您可以创建实际上只是“暂存”查询的查询（这些查询是更复杂的转换序列的一部分），或者只包含查找数据（这些数据会添加到另一个表但在数据模型中不需要）的查询。在这种情况下，您肯定不希望这些表给数据模型增加混乱。\n\
  \n要阻止查询被添加到数据模型中，请执行以下操作：\n\n1.  在左侧的 `查询` 列表中，选择您希望保留在查询编辑器中——但不保留在数据模型中的查询。\n\
  2.  右键单击该查询并取消选中 `启用加载`。\n\n该查询将不再与其他查询一起加载到数据模型中。\n\n要将查询重置为加载到数据模型的候选对象，只需执行相同操作并确保`启用加载`已勾选。您可以通过上下文菜单中的复选标记来判断该查询是否将被加载。或者，您可以右键单击查询并显示查询属性，在其中可以勾选（或取消勾选）“启用加载到报表”复选框。\n\
  \n> **注意：** 您也可以在图 11-5 所示的 `查询属性` 对话框中设置此属性。\n\n### 启用报表刷新\n\n默认情况下，所有查询都可以刷新。这使您能够从源获取最新的数据到\
  \ Power BI Desktop 查询编辑器，然后进入数据模型。\n\n有时您可能不希望刷新某个查询。可能是因为数据源不可用，或者速度很慢，或者您希望稍后回来获取最新数据。Power\
  \ BI Desktop 查询编辑器允许您像这样为每个查询设置刷新选项：\n\n1.  在左侧的 `查询` 列表中，右键单击您想要修改其刷新状态的查询。\n2.\
  \  取消勾选“包含在报表刷新中”。\n\n> **注意：** 只有已启用加载的查询才能修改其刷新属性。\n\n\n\n#### 待处理的更改\n\n在处理数据源并从查询编辑器切换到\
  \ Power BI Desktop 视图时，通常您会希望将源中的全部数据加载到数据模型中。\n\n这种方法的一个缺点是，当您返回创建和修改可视化效果时，庞大的源数据集可能需要很长时间才能加载或重新加载。正因如此，Power\
  \ BI Desktop 允许您从查询编辑器“开始”功能区中的“**关闭并应用**”按钮中选择“**关闭**”。这样做会立即将您带回数据视图，但不会应用您所做的任何更改。作为提醒，您将看到类似图\
  \ 11-7 所示的警告，显示在数据视图的顶部。\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig7_HTML.jpg](img/370912_3_En_11_Fig7_HTML.jpg)\n\
  \n**图 11-7** 待处理更改警告\n\n您可以根据需要继续在数据视图中工作。当您有时间将修改后的源数据重新加载到数据模型中时，请单击“**应用更改**”按钮。但是，您需要明白，在您应用更改之前，您将看不到字段列表中表和字段结构的所有最新更改——当然，也看不到最新的数据。\n\
  \n## 参数化查询\n\nPower BI Desktop 中的参数使您能够为查询的某些方面定义并应用特定条件。其核心是，它们是一种使您能够实现以下目的的技术：\n\
  \n*   存储一个值，以便在多个查询中使用\n*   将潜在值的选项限制为特定的选项列表\n\n目前，创建参数有三种基本方式：\n\n*   您输入的一个单一值\n\
  *   从您手动输入的可能值列表中选择一个值\n*   从使用现有查询创建的可能值列表中选择一个值\n\n因此，使用参数是一个两步过程：\n\n*   创建一个参数。\n\
  *   将其应用于查询。\n\n参数实际上只不过是一种特殊类型的查询。由于它是一个查询，您可以：\n\n*   将其加载到数据模型中（尽管很少需要这样做）\n\
  *   从另一个查询中引用它\n*   在 DAX 公式中使用它\n\n接下来的三个小节将解释如何创建参数。然后，我将向您展示在查询编辑器中使用参数来筛选或转换数据的一些方法。\n\
  \n### 创建简单参数\n\n最简单的情况下，参数就是您存储的一个值，以便稍后使用它来协助您进行数据转换。以下是存储一个包含“True”值的参数的方法，以便用于过滤后续数据集：\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig8_HTML.jpg](img/370912_3_En_11_Fig8_HTML.jpg)\n\
  \n**图 11-8** 参数对话框\n\n1.  将 Excel 文件 `C:\\PowerBiDesktopSamples\\CarSalesOverview.xlsx`（使用名为\
  \ CarSalesOverview 的工作表）中包含的数据加载到 Power BI Desktop 中。\n\n2.  在“开始”功能区中，单击“**转换数据**”。查询编辑器将打开。\n\
  \n3.  在查询编辑器“开始”功能区中，单击“**管理参数**”按钮底部的小三角，然后从可用的菜单选项中选择“**新建参数**”。将出现“参数”对话框。\n\n\
  4.  输入 **DealerParameter** 作为参数名称，并输入 **Filter dealer types** 作为说明。\n\n5.  确保选中“**必需**”复选框。\n\
  \n6.  从类型弹出列表中选择“**True/False**”。\n\n7.  从弹出列表中，输入 **True** 作为当前值。该对话框将类似于图 11-8\
  \ 中所示。\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig9_HTML.jpg](img/370912_3_En_11_Fig9_HTML.jpg)\n\
  \n**图 11-9** 查询列表中的参数\n\n8.  单击“**确定**”。新的参数将出现在左侧的“查询”列表中。您可以在图 11-9 中看到这一点。\n\n\
  目前，您所做的只是创建了一个参数并存储了一个值。您将在几页后了解如何使用此参数。如您所见，参数作为查询的一种类型存储，默认值会显示在查询名称后的括号中。\n\n\
  ### 创建一组参数值\n\n虽然单个参数可能很有用，但在实际中，您可能更需要潜在参数的列表。这将允许您在特定情况下从预定义的列表中选择参数值。以下是一个创建参数的示例，该参数包含样本数据中使用的可用国家/地区名称的子集：\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig10_HTML.jpg](img/370912_3_En_11_Fig10_HTML.jpg)\n\
  \n**图 11-10** 参数对话框\n\n1.  使用您在上一节中创建的 Power BI Desktop 文件（基于 Excel 文件 `C:\\PowerBiDesktopSamples\\\
  CarSalesOverview.xlsx`），打开查询编辑器（如果查询编辑器尚未打开）。\n\n2.  在查询编辑器“开始”功能区中，单击“**管理参数**”按钮底部的小三角，然后从可用的菜单选项中选择“**新建参数**”。将显示“参数”对话框。\n\
  \n3.  输入 **CountriesParameter** 作为参数名称。\n\n4.  确保选中“**必需**”复选框。\n\n5.  从类型弹出列表中选择“**文本**”。\n\
  \n6.  在“**建议值**”弹出列表中，选择“**值列表**”。\n\n7.  在出现的网格中输入以下三个值：\n    *   France\n    *\
  \   Germany\n    *   Spain\n\n8.  从弹出列表中选择 **France** 作为“**默认值**”。\n\n9.  从弹出列表中选择\
  \ **France** 作为“**当前值**”。该对话框将类似于图 11-10 中所示。\n\n10. 单击“**确定**”。新的参数将出现在左侧的“查询”列表中。\n\
  \n再次强调，您所做的只是创建了参数。您将在两页后了解如何应用它。\n\n**注意：** 如您所见，您选择的任何当前值都将出现在“查询”窗格中参数名称右侧的括号内。这有助于您记住哪个值是当前的，并可能用于过滤数据。\n\
  \n\n\n### 创建基于查询的参数\n\n手动输入用于选择参数的数值列表不仅繁琐，而且容易出错。因此，你可以利用现有查询中的数据来创建一系列可用元素，用于参数选择，而无需手动输入数值列表。举例来说，假设你需要一个包含公司销售的所有可用汽车品牌的参数：\n\
  \n1.  使用上一节中创建的 Power BI Desktop 文件（基于 Excel 文件 `C:\\PowerBiDesktopSamples\\CarSalesOverview.xlsx`），打开查询编辑器。\n\
  2.  在查询列表中选择 `CarSalesOverview` 查询。\n3.  右键单击名为 `Model` 的列标题，然后选择 **添加为新查询**。一个名为\
  \ `Model` 的新查询将出现在查询列表中。此查询包含你选择的列的内容。\n4.  右键单击 `Model` 查询，并取消勾选 **启用加载**。这可以防止该查询作为表出现在\
  \ Power BI Desktop 界面中。\n5.  在新创建的查询中，单击“转换”功能区中的 **删除重复项**。该列表列将只显示唯一值。\n6.  将新创建的查询重命名为\
  \ `ModelList`。\n7.  在查询编辑器的“开始”功能区中，单击 **管理参数** 按钮底部的小三角形，然后从可用菜单选项中选择 **新建参数**。将显示“参数”对话框。\n\
  8.  输入 `ModelsParameter` 作为参数名称。\n9.  确保选中 **必需** 复选框。\n10. 从类型弹出列表中选择 **文本**。\n\
  11. 在 **建议的值** 弹出列表中，选择 **查询**。\n12. 从可用列表的弹出列表中选择 `ModelList` 作为包含要使用的值列表的查询。\n\
  13. 输入 `DB9` 作为 **当前值**。\n14. 单击 **确定**。新参数将出现在左侧的查询列表中。\n\n现在，你应该能够在“查询”窗格中看到你创建的所有三个参数，如图\
  \ 11-11 所示。\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig11_HTML.jpg](img/370912_3_En_11_Fig11_HTML.jpg)\n\
  \n图 11-11：查询列表中的参数\n\n> **注意**\n> 阻止用于为参数提供一系列值的列表加载到数据模型中（如你在第 4 步中所做）是正常做法。这是因为数据模型中不需要此查询（或者你喜欢称之为列表），并且你不希望它出现在“字段”列表中而让用户感到困惑。\n\
  \n创建好参数后，你可以通过单击 **关闭并应用** 按钮退出查询编辑器。你应该会看到 Power BI Desktop 报表视图没有变化。这是因为参数用于塑造数据流过程，而*不是*作为数据模型中的数据。\n\
  \n> **提示**\n> 也可以在使用参数时“即时”创建参数（即直接从使用参数的对话框内部创建）。但是，我发现事先准备好参数是更好的实践——也更具实用性。这会迫使你思考参数的原因以及其潜在的用途范围。它还可以避免你在试图同时做两件不同的事情时出错。\n\
  \n### 修改参数\n\n幸运的是，参数一旦创建并非一成不变。你可以轻松修改：\n\n-   参数的结构\n-   选定的参数元素（当前值）\n\n####\
  \ 修改参数的结构\n\n如果你需要修改参数的构建方式，一种方法是执行以下操作：\n\n1.  在查询编辑器的“开始”功能区中，单击 **管理参数**。将显示“参数”对话框，如前面几节所示。\n\
  2.  在对话框的左窗格中，单击要修改的参数。参数定义将出现在右侧。\n3.  进行任何所需的修改。\n4.  单击 **确定**。\n\n或者，你也可以这样做：\n\
  \n1.  单击查询编辑器左侧查询窗格中的参数。\n2.  单击 **管理参数** 按钮。将显示“参数”对话框。\n3.  进行任何所需的修改。\n4.  单击\
  \ **确定**。\n\n如果你愿意，还可以右键单击“查询”窗格中的参数，然后从弹出菜单中选择 **管理** 以显示“参数”对话框。\n\n### 在筛选记录时应用参数\n\
  \n现在你已经了解了如何创建参数，是时候看看它们的实际应用了。作为应用参数的第一个示例，你将看到如何使用参数来筛选查询：\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig12_HTML.jpg](img/370912_3_En_11_Fig12_HTML.jpg)\n\
  \n图 11-12：为筛选器选择参数\n\n1.  打开文件 `C:\\PowerBiDesktopSamples\\ParametersExample.pbix`。此文件包含先前创建的三个参数。\n\
  2.  打开 Power BI Desktop 查询编辑器。\n3.  单击查询列表中的 `CarSalesOverview` 查询。将显示一个汽车销售信息数据集。\n\
  4.  单击 `CountryName` 列的下拉菜单。\n5.  选择 **文本筛选器** ![../images/370912_3_En_11_Chapter/370912_3_En_11_Figd_HTML.gif](img/370912_3_En_11_Figd_HTML.gif)\
  \ **➤ 等于**。将显示“筛选行”对话框。\n6.  将 **等于** 保留为第一个选项。\n7.  单击第二个下拉菜单，然后从列表中选择 **参数**。你可以在图\
  \ 11-12 中看到这一点。\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig13_HTML.jpg](img/370912_3_En_11_Fig13_HTML.jpg)\n\
  \n图 11-13：为筛选器应用参数\n\n8.  为第三个下拉菜单选择 `CountriesParameter`。对话框将类似于图 11-13 所示。\n9.\
  \  单击 **确定**。将应用当前参数值（你选择的国家/地区），并且数据集将使用当前参数值进行筛选。\n\n> **注意**\n> 要从筛选器中移除参数，只需删除\
  \ **应用的步骤** 列表中的相关步骤即可。\n\n### 修改参数的当前值\n\n你可能会想，仅仅为了筛选一个数据集而设置一个参数是否值得。然而，如果你修改当前参数值然后刷新数据以应用新参数，整个方法会变得更加有趣。以下是一个示例：\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig14_HTML.jpg](img/370912_3_En_11_Fig14_HTML.jpg)\n\
  \n图 11-14：修改参数的当前值\n\n1.  在查询编辑器的“开始”功能区中，单击小三角形以显示 **管理参数** 按钮的菜单。\n2.  选择 **编辑参数**。将显示“输入参数”对话框。\n\
  3.  从 `CountriesParameter` 的值弹出列表中，选择一个可用值（而不是先前选择的值）。对话框应类似于图 11-14 所示。\n4.  单击\
  \ **确定**。\n5.  在查询编辑器的“开始”功能区中，单击 **刷新预览**。数据将被刷新，新的参数值将应用于使用这些参数的筛选器。\n\n如果你需要测试多种筛选值组合，这种方法会特别有用。实质上，你可以使用多个参数对几个列应用一系列筛选器（或创建复杂的筛选器），然后使用“输入参数”对话框测试不同参数组合在数据集上的结果。这种技术避免了手动且重复地修改多个筛选器。另一个好处是，通过定义可用的参数选项列表，你可以限制用户（或你自己）只能从特定的参数选择列表中进行选择。当你选择\
  \ `CountriesParameter` 下拉菜单或 `ModelsParameter` 下拉菜单时，你可以看到这一点。\n\n\n\n### 在查找和替换中应用参数\n\
  \n参数的另一个用途是将其用作查找和替换操作中的搜索值或替换值。你可以在以下示例中看到这一点：\n\n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig15_HTML.jpg](img/370912_3_En_11_Fig15_HTML.jpg)\n\
  \n**图 11-15** 在查找和替换中使用参数\n\n1. 打开 Power BI Desktop 文件 `C:\\PowerBiDesktopSamples\\\
  ParametersExample.pbix`。\n2. 打开 Power BI Desktop 查询编辑器。\n3. 在查询窗格中单击 `CarSalesOverview`\
  \ 查询。\n4. 单击 `CountryName` 列内部。\n5. 在“转换”功能区中，单击 `替换值`（或右键单击并选择 `替换值`）。将显示 `替换值`\
  \ 对话框。\n6. 单击 `要查找的值` 下方的弹出列表，然后选择 `参数`。\n7. 选择 `CountriesParameter` 作为要应用的参数。\n\
  8. 输入 `Luxemburg`（例如）作为替换值。对话框将如图 11-15 所示。\n9. 单击 `确定`。所选列的数据集中参数的当前值将被替换。\n\n\
  ### 将参数应用于数据源\n\n在某些企业环境中，有许多可用的数据库服务器，甚至可能有更多数据库。你可能会发现记住所有这些服务器和数据库很困难——你为其准备\
  \ Power BI Desktop 报告的用户也可能如此。\n\n一种使企业环境更易于导航的解决方案是准备包含可用服务器和数据库列表的参数。然后可以使用并更新这些参数，以指导用户选择\
  \ SQL Server、Oracle 或其他数据库数据源。\n\n要查看实际效果，你首先需要准备两个参数：\n\n- 服务器列表\n- 数据库列表\n\n然后你可以了解如何使用这些参数连接到数据源。当然，你需要将我在步骤\
  \ 3 和 4 中使用的示例服务器和数据库名称替换为你自己环境中的名称。\n\n> **注意：** 仅当在“查询编辑器”的“视图”菜单中选中 `始终允许` 复选框时，才能应用参数。\n\
  \n![../images/370912_3_En_11_Chapter/370912_3_En_11_Fig16_HTML.jpg](img/370912_3_En_11_Fig16_HTML.jpg)\n\
  \n**图 11-16** 使用参数选择服务器和数据库\n\n1. 打开一个新的 Power BI Desktop 文件并关闭启动屏幕。\n2. 单击 `转换数据`\
  \ 以打开查询编辑器。\n3. 使用以下元素创建一个新参数：\n   - *名称*：`Servers`\n   - *类型*：文本\n   - *建议值*：值列表\n\
  \   - *列表中的值*：`ADAM03` 和 `ADAM03\\SQLServer2016`（或你的数据库服务器）\n   - *默认值*：`ADAM03\\\
  SQLServer2016`（或你的数据库服务器）\n   - *当前值*：`ADAM03\\SQLServer2016`（或你的数据库服务器）\n4. 使用以下元素创建一个新参数：\n\
  \   - *名称*：`Databases`\n   - *类型*：文本\n   - *建议值*：值列表\n   - *列表中的值*：`CarSalesData`\
  \ 和 `CarSalesMemoryBased`\n   - *默认值*：`CarSalesData`\n   - *当前值*：`CarSalesData`\n\
  5. 单击 `关闭并应用` 以关闭查询编辑器。\n6. 在 Power BI Desktop 报告界面中，单击 SQL Server 按钮。\n7. 在 `服务器`\
  \ 行上，单击服务器弹出菜单并选择 `参数`。选择 `Servers` 参数。\n8. 在 `数据库` 行上，单击数据库弹出菜单并选择 `参数`。选择 `Databases`\
  \ 参数。`SQL Server` 对话框将如图 11-16 所示。\n9. 选择数据连接模式以及任何要设置的高级选项。\n10. 单击 `确定`。将显示服务器连接过程和对话框，然后你会看到导航器对话框，其中显示两个参数中当前服务器和数据库值对应的表和视图。\n\
  \n> **注意：** 如果随后将文件保存为模板，该模板可用作多个不同 Power BI Desktop 报告文件的基础，那么准备用于数据连接的参数尤其有用。你将在几页后了解如何创建模板。\n\
  \n### 参数的其他用途\n\n这些示例仅涵盖了在 Power BI Desktop 中可以应用参数的少数情况。实际上，可以应用参数的范围随着产品的每次发布而增加。因此，请注意所有提供使用参数选项的对话框！\n\
  \n### 在数据源步骤中使用参数\n\n一个可以快速证明真正节省时间的参数用法是在查询的 `源` 步骤中使用参数。简而言之，你可以使用参数代替固定的元素名称，例如：\n\
  \n- Excel 文件名\n- 文件路径\n- 数据库或数据仓库服务器\n- 数据库\n\n使用参数定义连接（即服务器和数据库引用）特别有用，因为这样可以：\n\
  \n- 提供连接信息的中央参考点\n- 避免为来自同一服务器的类似查询重复输入连接详细信息——并最大限度地减少引入拼写错误的风险\n- 更轻松地在开发、测试和生产服务器之间切换\n\
  \n为了说明这一点，假设你已经从上一节创建了参数 `Servers` 和 `Databases`，请尝试以下操作：\n\n1. 创建到 SQL Server 数据库的连接（如第\
  \ 3 章所述）。\n2. 单击“开始”功能区中的 `转换数据` 按钮。\n3. 在查询编辑器中，选择通过数据库连接创建的查询。\n4. 单击右侧的 `应用的步骤`\
  \ 中的第一步。此步骤应命名为 `源`。\n5. 在公式栏中，替换如下所示的代码：\n\n```\n= Sql.Database(\"ADAM03\\SQL2017\"\
  , \"PrestigeCars\")\n```\n\n1. 替换为以下代码：\n\n```\n= Sql.Database(Servers, Databases)\n\
  ```\n\n1. 单击公式栏中的复选框或按 `Enter` 确认修改。你几乎肯定需要确认数据库凭据。\n\n> **注意：** 你需要了解，硬编码的服务器和数据库名称必须用双引号括起来，而参数*不*应包含在引号中。还要记住，公式栏中使用的\
  \ `M` 语言区分大小写。因此，你需要*完全按照*创建时的名称输入参数名称。\n\n\n\n### 将参数应用于 SQL 查询\n\n如果使用关系数据库（如\
  \ Oracle 或 SQL Server）作为数据源，并且比较熟悉该源数据库使用的 SQL 方言，则可以使用 SQL 查询数据库，然后将 Power BI Desktop\
  \ 参数应用到该源查询。\n\n我们来看一下具体操作：\n\n1.  打开一个新的 Power BI Desktop 文件，打开查询编辑器，并创建一个名为 `CountriesParameter`\
  \ 的参数（如之前几页所示）。\n2.  单击**关闭并应用**以关闭查询编辑器。\n3.  在 Power BI Desktop 报表界面中，单击 **SQL\
  \ Server 数据库**。\n4.  输入正在使用的服务器和数据库。（如果使用的是 Apress 网站提供的示例，则服务器和数据库名称为你的服务器和 `CarSalesData`\
  \ 数据库。）\n5.  单击**高级选项**，并输入以下 SQL 语句：\n\n    ```\n    SELECT  ∗\n    FROM    CarSalesData.Data.CarSalesData\n\
  \    WHERE   CountryName = 'Germany'\n    ```\n\n6.  单击**确定**，并确认所有关于数据访问和权限的对话框。\n\
  7.  单击**编辑**以连接数据并打开查询编辑器。\n8.  数据连接应该只有一个**应用的步骤**。展开公式栏并修改公式，使其如下所示：\n\n    ```\n\
  \    = Sql.Database(\"ADAM03\\SQLSERVER2016\", \"CarSalesData\", [Query=\"SELECT\
  \  ∗#(lf)FROM    CarSalesData.Data.CarSalesData#(lf)WHERE   CountryName = '\"& CountriesParameter\
  \ &\"'\"])\n    ```\n\n9.  单击公式栏中的勾号图标以确认更改。数据将发生变化，显示法国（当前参数值）的数据，而非德国（SQL 中的初始值）。\n\
  \n现在，你可以更改参数值并刷新数据。这会将当前参数放入 SQL 的 `WHERE` 子句中，并仅获取当前参数对应的数据。\n\n如果觉得这样解释还不够详细，我们来看看在第\
  \ 8 步做出更改*之前*，Power BI Desktop 使用的代码。M 语言如下：\n\n```\n= Sql.Database(\"ADAM03\\SQLSERVER2016\"\
  , \"CarSAlesDAta\", [Query=\"SELECT  ∗#(lf)FROM    CarSalesData.Data.CarSalesData#(lf)WHERE\
  \   CountryName = 'France'#(lf)\"])\n```\n\n所做的更改是将 `France` 替换为 `\"& CountriesParameter\
  \ &\"`。也就是说，将硬编码的条件“France”替换为了参数引用。实际上，就像在 Excel 中一样，你在公式中添加了双引号和 & 符号，以便代码能够包含一个外部元素。\n\
  \n这是一个非常简单的示例，但我希望它能为你打开一扇门，让你能够在数据库连接中更高级地使用参数。\n\n**注意：** 参数更改后更新数据，可能需要接受数据更改和新的权限。\n\
  \n### 查询图标\n\n正如你在前面的图 11-16 中看到的，有三个查询图标。表 11-1 对这些图标进行了说明。\n\n**表 11-1** 查询图标\n\
  \n| 图标 | 查询类型 | 说明 |\n| --- | --- | --- |\n| ![../images/370912_3_En_11_Chapter/370912_3_En_11_Figa_HTML.jpg](img/370912_3_En_11_Figa_HTML.jpg)\
  \ | 查询 | 标准查询的图标。 |\n| ![../images/370912_3_En_11_Chapter/370912_3_En_11_Figb_HTML.jpg](img/370912_3_En_11_Figb_HTML.jpg)\
  \ | 列表 | 列表的图标。 |\n| ![../images/370912_3_En_11_Chapter/370912_3_En_11_Figc_HTML.jpg](img/370912_3_En_11_Figc_HTML.jpg)\
  \ | 参数 | 参数的图标。 |\n\n## 带参数的 Power BI 模板\n\n如果你已经创建了一个包含强大数据转换例程或只是一组数据连接选项（如前面几页所示）的\
  \ Power BI 模型，你可能希望将这些中的任何一个或全部用作多个报表的公共基础。\n\n解决方案非常简单。你只需将一个包含未来报表所需的所有代码、ETL（数据提取、转换、加载）和其他资源的\
  \ Power BI Desktop 文件保存为模板。然后，你可以打开该模板，一个新的 Power BI Desktop 文件将会打开，并加载该模板的所有查询、参数和代码。之后，你可以完全正常地将这个新文件保存为一个“标准”的\
  \ Power BI Desktop 文件。\n\n要将文件保存为模板：\n\n1.  创建包含查询、参数以及所有其他元素的模型文件，使其成为未来报表的基础。\n\
  2.  在**开始**选项卡上，单击**文件** ➤ **另存为**。\n3.  在**另存为**对话框中，选择 **Power BI 模板文件 (∗.pbit)**\
  \ 作为**保存类型**。\n4.  输入文件名，然后单击**确定**。\n\n现在，你可以像打开任何其他 Power BI Desktop 文件一样打开该模板文件。Power\
  \ BI Desktop 将打开模板的一个副本，而模板本身保持不变。\n\n## 结论\n\n在本章中，你了解了如何管理和扩展使用 Power BI Desktop\
  \ 创建的查询内容。具体来说，你了解了如何修改数据加载和转换过程中的单个步骤。这包括从重命名步骤到更改流程中步骤的顺序，甚至更改步骤实际执行规范的操作。\n\n\
  然后，你了解了如何管理整个查询。你学习了如何重命名和分组查询，以及如何链接查询，以便一个查询的输出成为另一个查询的数据源。\n\n最后，你学习了如何向查询添加参数以及如何以可控的方式与查询交互。这使得查询（以及整个\
  \ ETL 过程）更加灵活和具有交互性。\n\n\n\n"
- "# 12. M 语言\n\n在 Power BI Desktop 中，数据导入和修改并非完全通过界面驱动。实际上，整个过程的底层是由一种高度专用的编程语言支撑和驱动的。这种语言被称为“M”，它贯穿于你在前\
  \ 11 章中所学到的所有内容。\n\n大多数用户——在大多数情况下——根本不需要直接使用 M 语言。这是因为到目前为止，你在本书中深入学习过的 Power Query\
  \ 编辑器界面既全面又极其直观。然而，有些时候你可能需要：\n\n-   添加一些无法通过图形界面直接访问的附加功能\n-   添加编程逻辑，例如生成日期或数字序列\n\
  -   通过编程方式创建或操作自己的列表、记录或表\n-   创建自己的内置函数，以扩展或增强 M 语言中已有的函数\n-   使用高级编辑器修改代码\n- \
  \  为数据导入过程添加注释\n\n在介绍这些概念之前，我需要先说明几点注意事项：\n\n-   支撑 Power BI Desktop 查询的“M”语言并非适合胆小者。这门语言乍看之下可能显得晦涩难懂。\n\
  -   其文档非常技术化，对于新手来说并不容易理解。\n-   即使对于经验丰富的程序员来说，学习曲线也可能很陡峭。\n-   “M”语言与许多 Excel 高级用户熟知的\
  \ VBA（Visual Basic for Applications）截然不同。\n-   手动调整步骤可能会对精心构建的数据加载和转换过程造成严重破坏。\n\
  \n此外，“M”语言内容庞大，足以写成一本完整的书。因此，我有意在此只提供最浅显的介绍。如需更详细的资料，我建议你查阅微软文档。目前可在以下网址找到：\n\n\
  -   [`https://msdn.microsoft.com/en-us/library/mt779182.aspx`](https://msdn.microsoft.com/en-us/library/mt779182.aspx)\n\
  -   [`https://msdn.microsoft.com/en-us/library/mt807488.aspx`](https://msdn.microsoft.com/en-us/library/mt807488.aspx)\n\
  \n在本章中，我不会假设读者具备任何深入的编程知识。我会提供一些与标准编程概念的比较，以帮助那些使用过 VBA、C# 或 Java 编程的读者。但请放心，本章的目的是为热情的\
  \ Power BI Desktop 用户打开新的视野，而不是陷入复杂的专业技术世界。\n\n要最好地理解所有这些内容，可能的方法是：基于你已有的知识，解释你（仅通过使用\
  \ Power Query 图形界面）实际上就已经在编写 M 代码了。然后，通过了解如何调整现有代码来扩展这些知识，最后你将学会如何独立编写 M 代码。\n\n\
  ## 什么是 M 语言？\n\n尽管如此，我还是应该先确立一些技术基点，解释 Power Query 公式语言（或者现在大家都叫它 M 语言）是什么，以及它能做什么——不能做什么。\n\
  \nM 是一种*函数式*语言。它*绝非*为执行通用编程而设计。实际上，经验丰富的程序员将徒劳地寻找那些在其他语言中核心的编码结构和技术。（冒险地说，可能会冒犯编程纯粹主义者），我更倾向于从三个方面向初学者介绍\
  \ M 是一种函数式语言：\n\n-   它的存在是为了执行一个简单的功能：加载和转换数据。\n-   它构建在一个包含超过 700 个内置函数的汇编之上，每个函数都旨在执行特定的数据加载和/或转换逻辑。\n\
  -   它表现为一系列一个或多个函数，每个函数将一组输入值计算为单个输出值。\n\n为了完成这个简短的介绍，你还需要知道：\n\n-   M 是区分大小写的，因此在输入函数关键字和变量名时需要非常小心。\n\
  -   M 是强类型语言，这意味着你必须遵守所使用的数据元素的核心类型，并在必要时将它们转换为适当的类型。M 不会自动为你完成这项工作。\n-   M 构建在一组关键字、运算符和标点符号之上。\n\
  \n我不想在此太过深入技术。尽管如此，我希望这个高级概述能为你学习本章后面将要接触的一些方法做好准备。\n\n## M 与 Power Query 编辑器\n\n\
  关于 M 的一个好消息是：你已经能够编写它了。我的意思是，在前 11 章中你遵循的每个示例都为你编写了一行或多行 M 代码。实际上，当你使用 Power Query\
  \ 编辑器进行数据加载和转换过程时，生成的每一步都会自动为你创建 M 代码。\n\n这意味着几件（非常积极的）事情：\n\n-   你不必非得从零开始编写 M\
  \ 代码。通常，你可以使用查询编辑器界面完成大部分工作，然后调整自动生成的代码，添加你所需的最终自定义元素。\n-   你无需学习超过 700 个函数来编写 M\
  \ 代码，因为查询编辑器可以为你查找并编写许多合适的指令。\n-   查询编辑器界面与 M 代码的编写方式紧密相连。因此，理解如何使用该界面有助于你理解 M 代码是什么以及它是如何工作的。\n\
  \n\n### 修改步骤的代码\n\n如果你希望深入探索 Power BI Desktop 的内部机制，可以通过编辑每次添加或修改查询步骤时自动生成的代码，来修改查询中的步骤。\n\
  \n要快速了解可以进行的操作：\n\n1. 打开查询编辑器，加载 Excel 文件 `C:\\PowerBiDesktopSamples\\BrilliantBritishCars.xlsx`（只有一个名为\
  \ `BaseData` 的源表）。\n2. 选择 `IsDealer` 列并将其删除。\n3. 单击 `BaseData` 查询中的 `Remove Columns`\
  \ 步骤。\n4. 在“视图”菜单中，确保已勾选“公式栏”复选框。你将在公式栏中看到“M”代码，其外观如图 12-1 所示。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig1_HTML.jpg](img/370912_3_En_12_Fig1_HTML.jpg)\n\
  \n图 12-1\n已应用步骤的“M”代码\n\n5. 在公式栏中，编辑 M 代码，将 `IsDealer` 替换为 `ReportingYear`。\n6.\
  \ 按下 Enter 键或点击公式栏中的勾选图标（复选标记）以确认更改。\n\n该步骤及后续数据将更新以反映你的更改。\n\n你在步骤 5 中所做的修改实际上意味着你正在重新添加\
  \ `IsDealer` 列，并删除 `ReportingYear` 列。你也可以通过界面完成此操作（单击此步骤的“已应用步骤”列表中的齿轮图标），但关键在于理解两种方式都可行，并且\
  \ Power Query 界面只是在生成和修改 M 代码。因此，如果你愿意，可以直接修改此代码。\n\n如果你是 Excel 高级用户（许多 Power BI\
  \ 爱好者都是如此），那么你可能会认为这与 Excel 宏开发类似，这是情有可原的。的确，在某些方面是相似的：\n\n- 核心代码可以被录制（VBA 用于 Excel，M\
  \ 用于 Power BI）。\n- 生成的代码随后可以被修改。\n\n当然，这是一个非常简单的比较。两种方法可能相似，但两种语言却截然不同。然而，如果这能作为一个比喻，鼓励你转向\
  \ M 开发，那就这样吧。\n\n在公式栏中修改查询步骤的 M 代码时，不可避免地会有一系列注意事项。这些包括（但远不限于）以下几点：\n\n- 任何错误不仅会导致该步骤失败，还会导致从当前步骤开始，整个数据加载和转换过程失败。\n\
  - 你需要记住 M 是区分大小写的，这个层级上哪怕最细微的错误都可能导致整个进程失败。\n- 必须遵守使用引号来定义文字元素（如列名）的规则。\n- M 大量使用括号和花括号。需要一些实践和对底层逻辑的理解才能充分体会它们在不同上下文中的用途。\n\
  \n幸运的是，当（或如果）错误出现时，M 会提供相当清晰的错误消息。例如，如果你输入了错误的字段名，你可能会看到类似图 12-2 所示的消息。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig2_HTML.jpg](img/370912_3_En_12_Fig2_HTML.jpg)\n\
  \n图 12-2\n一条“M”错误消息\n\n然而，我并不想让你觉得修改 M 代码困难或危险。因此，为了扩展前面的示例，如果你将其扩展为删除两列（而不只是一列），M\
  \ 代码将如下所示：\n\n```\n= Table.RemoveColumns(#\"Changed Type\",{\"ReportingYear\", \"\
  IsDealer\"})\n```\n\n> 注意\n> 更一般地，通常最好查看现有步骤的代码——或者使用示例数据集并行创建“虚拟”代码——以了解特定函数的 M\
  \ 代码是什么样子。这将指明如何最佳地修改代码。\n\n## M 表达式\n\n为了让你更清晰地理解每个 M “步骤”包含什么，图 12-3 展示了一个步骤的核心结构。不过，只有\
  \ Power Query 接口才称之为“步骤”。M 实际上称之为*表达式*。因此，从现在开始我将使用这个术语。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig3_HTML.jpg](img/370912_3_En_12_Fig3_HTML.jpg)\n\
  \n图 12-3\n一个 M 表达式\n\n这里有几点你需要了解的基本要点：\n\n- 每个 M *表达式*由*函数*组成。这些函数可以是任何内置函数（例如此处使用的\
  \ `Table.RemoveColumns` 函数），也可以是你自己定义的函数（本章稍后会解释）。它们也可以是计算或简单的逻辑。\n- 正如你在本书到目前为止的学习中所了解到的，数据混搭本质上是一系列单独的操作（或者像\
  \ Power Query 接口所称的*步骤*）。这些操作在一个“链”中连接起来，每个表达式都建立在前一个表达式之上，并引用该表达式。在图 12-3 中，这个特定的表达式引用了其前面的\
  \ `#”Changed Type”` 表达式的输出。\n- M 表达式可以变得极其复杂，并且包含多个函数——类似于复杂的 Excel 公式。由于函数可以嵌套，这可能导致相当复杂的表达式。\n\
  \n\n\n### 通过添加自定义列编写 M 代码\n\n编写特定类型 M 代码的另一种方法是添加自定义列。虽然在 Power BI Desktop 中它们被称为*自定义列*，但通常也称为*派生列*或*计算列*。尽管它们能完成许多任务，但其核心作用是：\n\
  \n*   连接（或合并，如果你更喜欢这个说法）现有列\n*   向数据表添加计算\n*   提取列的特定部分\n*   根据现有数据向表添加标记\n\n理解这些列的最佳方式可能是在实践中观察它们。然后，您可以在自己的流程中扩展这些原则。然而，这可以成为学习基本\
  \ M 编码的绝佳起点——尽管仅限于 M 中数据整理的一个狭窄领域。\n\n首先，让我们执行一个列连接，并创建一个名为 `Vehicle` 的列，该列连接 `Make`\
  \ 和 `Model` 列，中间用空格隔开。\n\n1.  打开一个空白的 Power BI Desktop 文件。\n2.  连接到 `C:\\PowerBiDesktopSamples\\\
  BrilliantBritishCars.xlsx` 数据源。\n3.  单击**转换数据**以打开 Power Query 编辑器。\n4.  在**添加列**功能区中，单击**自定义列**。将显示**添加自定义列**对话框。\n\
  5.  单击右侧列列表中的 `Make` 列，然后单击**插入**按钮；`=[Make]` 将出现在对话框左侧的**自定义列公式**框中。\n6.  在 `=[Make]`\
  \ 后面的**自定义列公式**框中输入 `& \" \" &`。\n7.  单击右侧列列表中的 `Model` 列，然后单击**插入**按钮。\n8.  单击**新列名**框内部，并为该列输入一个名称。我将其命名为\
  \ `CarType`。对话框如图 12-4 所示。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig4_HTML.jpg](img/370912_3_En_12_Fig4_HTML.jpg)\n\
  \n**图 12-4** 自定义列对话框\n\n9.  单击**确定**。新列将添加到数据表的右侧；它包含公式的结果。`Inserted Column` 出现在**应用的步骤**列表中。公式栏包含以下公式：\n\
  \n```\n= Table.AddColumn(#\"Changed Type\", \"CarType\", each [Make] & \" \" & [Model])\n\
  ```\n\n如果您愿意，始终可以通过双击某列将其插入到**自定义列公式**框中。要删除某列，只需在**自定义列公式**框中删除列名称（包括方括号）即可。\n\n\
  > **提示**\n> 必须始终将列名称括在方括号内。\n\n您可以看到这一行 M 代码遵循了您已经见过的原则。它使用了一个 M 公式 (`Table.AddColumn`)，该公式引用了一个先前的表达式\
  \ (`#\"Changed Type\"`)，然后应用了执行表达式需求的代码——在本例中，是添加一个包含基本 M 代码的新列。\n\n> **注意**\n>\
  \ `each` 关键字是一种 M 约定，表示该列中的每条记录都将应用该公式。\n\n## 高级编辑器\n\n公式栏只是 M 编码的初始步骤。您几乎总是在 Power\
  \ Query 高级编辑器中编写 M 代码。这有几个根本原因：\n\n*   高级编辑器显示构成 M 查询的所有表达式。\n*   它使理解事件（或步骤或表达式，如果您喜欢）的顺序变得更加容易。\n\
  *   高级编辑器内置了 IntelliSense。这意味着您可以在键入时看到列出的 M 函数。\n*   它有一个语法检查器，有助于隔离和识别语法错误。\n\
  *   它对 M 代码进行颜色编码，使其更易读、更易理解。\n\n### 高级编辑器中的表达式\n\n您在公式栏中单独看到的 M 表达式并非孤立存在。恰恰相反，它们始终是数据加载、清理和转换事件这一连贯序列的一部分。如果您现在查看之前从\
  \ Excel 文件加载表时创建的整个 M 代码块，可能会更清楚地理解这一点。\n\n要查看 M 代码，您需要打开高级编辑器：\n\n1.  在**开始**功能区中，单击**高级编辑器**按钮。**高级编辑器**窗口将打开，如图\
  \ 12-5 所示。您还可以从 Power Query 编辑器中看到**应用的步骤**列表，以帮助您理解每个步骤实际上是如何成为一个 M 表达式的。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig5_HTML.jpg](img/370912_3_En_12_Fig5_HTML.jpg)\n\
  \n**图 12-5** 高级编辑器中的语法检查\n\n此对话框包含您创建的连接和转换过程的整个结构。它包含以下核心元素：\n\n*   一系列表达式（即步骤）\n\
  *   一个 `let` 表达式，作为数据转换表达式序列的外部容器\n*   一个 `in` 表达式，返回整个查询的输出\n\n如果您查看图 12-5，可以看到关于\
  \ `Let…In` 块内部表达式序列的几个重要事项：\n\n*   每个表达式都有名称——您可以在**应用的步骤**列表中看到其名称。\n*   除了第一个表达式外，每个表达式都引用另一个表达式（几乎总是前一个表达式）。\n\
  *   除最后一个表达式外，所有表达式都以逗号结尾。\n*   一个表达式可以跨越多行代码。对于除最后一个表达式外的所有表达式，都是由最后的逗号结束该表达式的。\n\
  *   最后一个表达式成为查询的输出。\n\n虽然这是一个相当简单的 M 查询，但它包含了展示 M 工作原理的所有基本元素。您构建的几乎所有 M 查询都将反映这些核心原则：\n\
  \n*   包含一个 `Let…In` 块\n*   包含一个或多个包含函数的表达式\n\n### Let 语句\n\n`let` 语句是 M 语言的核心元素。它的存在允许单独评估一组值，并将每个值分配给一个变量名。这些变量形成一个结构化的评估过程序列，然后用于\
  \ `in` 语句之后的输出表达式中。在许多方面，您可以将其视为一个“处理单元”。`Let` 语句可以嵌套以增加更大的灵活性。\n\n在大多数 `let` 语句中，变量序列将从上到下排序（如图\
  \ 12-6 所示），其中每个命名的表达式引用并构建于前一个表达式之上。这是查询编辑器将命名表达式呈现为步骤的方式，通常也是编写易于理解的 M 脚本的最简单方法。然而，从技术上讲，不必像这样对表达式排序，因为表达式的顺序可以是任意的。\n\
  \n\n\n### 在高级编辑器中修改 M 代码\n\n如同 Power BI 中的其他所有事物一样，通过示例最能领略高级编辑器的妙处。你在第 3 章中已经了解了如何创建和修改与数据源的连接。你也可以直接在\
  \ `M` 语言中修改连接。这要求你了解并理解你所使用的数据库。\n\n1.  添加一个新查询，连接到 SQL Server 数据库。我使用的是自己电脑上的一个\
  \ SQL 实例和数据库。\n2.  在左侧的“查询”列表中选择此查询。\n3.  在“主页”功能区中，单击“高级编辑器”按钮。将出现“高级编辑器”对话框，如图\
  \ 12-6 所示。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig6_HTML.jpg](img/370912_3_En_12_Fig6_HTML.jpg)\n\
  \n图 12-6  \n用于更改数据库连接的“高级编辑器”对话框\n\n4.  更改以下任一元素：\n    1.  Source 行中的服务器名称（当前为 `\"\
  ADAM03\\SQL2017\"`）。\n    2.  第二行中的数据库名称（当前为 `Name=\"PrestigeCars\"`）。\n    3. \
  \ 第三行中的架构名称（当前为 `Schema=\"Data\"`）。\n    4.  第三行中的表名称（当前为 `Item=\"Sales\"`）。\n\n\
  5.  单击“完成”确认所有更改并关闭“高级编辑器”。\n\n这种方法确实是在“裸奔”——没有安全网，我向你展示它更多是为了提高你的认知。然而，如果你希望继续深入学习\
  \ `M` 语言，它确实为一些深远的可能性打开了大门。\n\n**注意：** 当然，你可以单击“取消”以忽略在高级编辑器中对 `M` 代码所做的任何更改。查询编辑器会要求你确认是否真的要放弃修改。\n\
  \n### 语法检查\n\n如果你打算编写和修改 `M` 代码，很可能会频繁使用高级编辑器。因此，熟悉它能够提供的帮助无疑是非常值得的。具体来说，它的语法检查功能极其有用，而且是完全自动的。\n\
  \n假设（但愿不会！）你的代码中出现了错误。高级编辑器可能会像图 12-7 中那样显示。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig7_HTML.jpg](img/370912_3_En_12_Fig7_HTML.jpg)\n\
  \n图 12-7  \n高级编辑器中的语法检查\n\n如你所见，在这种情况下，高级编辑器不再在代码下方显示一个勾选框以及令人安心的消息“未检测到语法错误。”取而代之的是错误消息，并且任何错误都会用红色下划线标出。单击“显示错误”链接，会通过以灰色背景显示错误来源来将其高亮。\n\
  \n### 高级编辑器选项\n\n高级编辑器还有一些可配置的可选设置。\n\n1.  在高级编辑器对话框的右上角，单击“显示选项”右侧的下拉三角形。你可以在图\
  \ 12-8 中看到它。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig8_HTML.jpg](img/370912_3_En_12_Fig8_HTML.jpg)\n\
  \n图 12-8  \n高级编辑器选项\n\n2.  选择“启用自动换行”。任何在高级编辑器单行中过长而无法完整显示的单个 `M` 表达式将自动换行至下一行。\n\
  \n可用选项在表 12-1 中说明。\n\n表 12-1  \n高级编辑器选项\n\n| 选项 | 描述 |\n| --- | --- |\n| `显示行号`\
  \ | 在代码左侧添加行号。 |\n| `显示空白字符` | 将空白字符显示为灰色圆点。 |\n| `显示缩略图` | 在高级编辑器右侧显示代码结构的概览图。\
  \ |\n| `启用自动换行` | 允许长代码行换行至下一行。 |\n\n## 基础 M 函数\n\n`M` 语言非常庞大——庞大到单靠一章只能进行粗略的概述。尽管如此，为了使这个概述更有条理，了解一些你可能在开始使用\
  \ `M` 时觉得有用的 `M` 函数的关键类别是值得的。\n\n以下列表绝非详尽无遗，但希望可以成为你探索 `M` 函数之旅的一个起点。基础类别包括：\n\n\
  - 文本函数\n- 日期函数\n- 时间函数\n- 日期时间函数\n- 逻辑函数\n- 数字函数\n\n我将重点放在这些类别上，因为它们无论在应用还是使用上很可能都是最容易理解的。当你了解其中一些函数后，我们便可以继续学习可用范围内其他函数。\n\
  \n大多数较基础的 `M` 函数的应用方式可能会让你想起它们在 Excel 中的对应函数。例如，如果你想扩展用于连接 Make 和 Model 列的公式，以便只提取\
  \ Make 列最左边的三个字符，你可以使用如下代码：\n\n```\n= Table.AddColumn(#\"Changed Type\", \"CarType\"\
  , each Text.Start([Make], 3) & \" \" & [Model])\n```\n\n结果如图 12-9 所示。\n\n![../images/370912_3_En_12_Chapter/370912_3_En_12_Fig9_HTML.jpg](img/370912_3_En_12_Fig9_HTML.jpg)\n\
  \n图 12-9  \n应用第一个文本函数\n\n如你所见，将 `Make` 列包裹在这个特定的文本函数中，为表达式增加了一层额外的数据转换层。\n\n\n\n\
  ### 文本函数\n\n我不会逐一介绍所有文本函数的每种可能用法，而是倾向于向您展示一些更有用的文本函数（至少在我的经验中是这样）。这些代码片段在表 12-2\
  \ 中给出，毫无疑问，您会认出其中许多之前通过 Power Query 用户界面访问过的函数。\n\n**表 12-2** 文本函数示例\n\n| 输出 | 代码片段\
  \ | 描述 |\n| --- | --- | --- |\n| 左侧 | `Text.Start([Make],3)` | 返回`Make`列的前三个字符。\
  \ |\n| 右侧 | `Text.End([Make],3)` | 返回`Make`列的最后三个字符。 |\n| 截止到特定字符 | `Text.Start([Make],Text.PositionOf([Make],\"\
  \ \"))` | 返回最左侧字符，直到第一个空格。 |\n| 截止到分隔符 | `Text.BeforeDelimiter([InvoiceNumber],\
  \ \"-\" ,\"2\")` | 返回第三个连字符之前的文本。 |\n| 文本长度 | `Text.Length([Make])` | 查找文本的长度。 |\n\
  | 提取子字符串 | `Text.Range([Make], 2, 3)` | 从文本中提取特定数量的字符——从指定位置开始。 |\n| 移除子文本 | `Text.RemoveRange([Make],\
  \ 2, 3)` | 从文本中移除特定数量的字符——从指定位置开始。 |\n| 替换文本 | `Text.Replace([Make], \"o\", \"a\"\
  )` | 将文本或列中所有的`o`字符替换为`a`。 |\n| 修剪空格 | `Text.Trim([Make])` | 移除文本或列中前导和尾随的空格。 |\n\
  | 转换为大写 | `Text.Upper([Make])` | 将文本或列转换为大写。 |\n| 转换为小写 | `Text.Lower([Make])` |\
  \ 将文本或列转换为小写。 |\n| 添加首字母大写 | `Text.Proper([Make])` | 为文本或列的每个单词添加首字母大写。 |\n\n> **注意：**\
  \ 如果您仔细查看这些函数，可能已经注意到任何数值参数都是从零开始的。因此，要在拆分列中的文本时定义第三个连字符，您应该使用`2`，而不是`3`。\n\n毫无疑问，M\
  \ 语言中还有更多的文本函数可用。然而，目标并非让读者淹没在技术细节中，而是让您了解 M 语言的工作方式以及它能实现什么。\n\n一旦您也学习了 DAX 语言以在\
  \ Power BI 中创建计算，您可能会想知道，既然在数据模型中几乎可以做同样的事情，为什么还要在 Power BI Desktop 查询中执行此类操作。嗯，确实存在一些重叠；因此您可以选择使用哪个。您可以在数据准备和分析过程的多个阶段执行某些操作。这完全取决于您如何使用数据以及使用什么工具进行分析。\n\
  \n表 12-2 只是 M 语言中可用文本函数的一个子集。如果您想查看完整列表，请访问微软网站 [`docs.microsoft.com/en-us/powerquery-m/text-functions`](https://docs.microsoft.com/en-us/powerquery-m/text-functions)。\n\
  \n### 数值函数\n\n为扩展您的知识，表 12-3 展示了 M 语言中一些可用的数值函数。在此我重点向您展示一些数值类型转换以及核心计算函数。\n\n**表\
  \ 12-3** 数值函数示例\n\n| 输出 | 代码片段 | 描述 |\n| --- | --- | --- |\n| 返回一个 8 位整数 | `Int8.From(\"\
  25\")` | 将文本或数字转换为 8 位整数。 |\n| 返回一个 16 位整数 | `Int16.From(\"2500\")` | 将文本或数字转换为\
  \ 16 位整数。 |\n| 返回一个 32 位整数 | `Int32.From(\"250,000\")` | 将文本或数字转换为 32 位整数。 |\n|\
  \ 返回一个 64 位整数 | `Int64.From(\"2500000000\")` | 将文本或数字转换为 64 位整数。 |\n| 返回一个十进制数 |\
  \ `Decimal.From(\"2500\")` | 将文本或数字转换为十进制数。 |\n| 从给定值返回一个双精度浮点数 | `Double.From(\"\
  2500\")` | 将文本或数字转换为浮点数。 |\n| 将文本作为源并转换为数值 | `Number.FromText(\"2500\")` | 将文本转换为数字。\
  \ |\n| 四舍五入一个数字 | `Number.Round(5000, 0)` | 将数字四舍五入到指定小数位数（负数参数表示十位、百位等）。 |\n| 向上舍入一个数字\
