- "# 1. 使用 Power BI Desktop 发现与加载数据\n\n在使用 Power BI Desktop 展示任何分析或发现新见解之前，您需要数据。您的数据源可能分布在许多地方，采用多种格式。尽管如此，您需要访问它们、查看它们、选择它们，并很可能在某种程度上重构或清理它们。在将数据塑造成一个连贯的模型（作为仪表板和报告的基础）之前，您可能还需要连接多个独立的数据源。令人惊叹的是，使用\
  \ Power BI Desktop，您无需借助任何其他工具或实用程序即可完成所有这些操作。\n\n发现、加载、清理和修改源数据是 Power BI Desktop\
  \ 真正大放异彩的众多领域之一。它让您能够完成以下任务：\n\n- **数据发现**：查找并连接到包含潜在有用数据的各种数据源。这些数据既可以来自公共数据源，也可以来自私有数据源。这是第\
  \ 1 章至第 6 章的主题。\n- **数据加载**：选择您已检查过的数据并将其加载到 Power BI Desktop 中进行塑形。\n- **数据修改**：修改已导入的每个数据集的结构，然后过滤并清理数据本身（我们将在第\
  \ 7 章至第 10 章中详细讨论这一点）。\n- **数据塑形**：连接数据集以创建一个清晰、统一且易于访问的数据模型。您将学习如何在第 13 章中完成此操作。\n\
  \n尽管我将这四个步骤描述为完全独立且顺序执行，但现实情况往往是将它们融合成一个单一的过程。确实，您可能会在许多情况下*在*数据加载到 Power BI Desktop*之后*才检查数据，或者*在*加载数据*之前*清理数据集。然而，核心目标始终不变：找到一些数据，然后将其加载到\
  \ Power BI Desktop 中，以便您进行调整、清理和塑形。\n\n这个过程可以简单描述为“首先，捕捉你的数据”。在数据仓库领域，专家们称之为 ETL，即**E**xtract（提取）、**T**ransform（转换）和**L**oad（加载）的缩写。尽管这个缩写词让人放心，但这个过程很少是一个通过清晰步骤顺利、有逻辑地推进的过程。现实情况往往要复杂得多。您可能会发现自己经常导入一些数据，清理它们，从另一个源导入更多数据，将第二个数据集与第一个数据集合并，删除一些行和列，然后重复这些操作以及许多其他操作多次。\n\
  \n在本章及接下来的几章中，我将尝试向您展示如何使用 Power BI Desktop 在实际操作中完成这个过程。我希望这能让构成 ETL 过程的各种步骤更加清晰。我只希望您能意识到，Power\
  \ BI Desktop 所包含的一系列选项使其成为一个多面且功能强大的工具。科学之处在于知道*哪些*选项可以使用。艺术之处在于知道*何时*使用它们。\n\n\
  ## 数据加载过程\n\n首先，让我们快速概览一下将一些数据加载到 Power BI Desktop 中需要做什么。启动 Power BI Desktop 后，您会看到如图\
  \ 1-1 所示的启动画面。\n\n![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig1_HTML.jpg](img/370912_3_En_1_Fig1_HTML.jpg)\n\
  \n*图 1-1. 启动画面*\n\n考虑到您正在使用一个以数据为核心的应用，在开始一个新的分析挑战时，第一步是查找并加载一些数据，这并不令人意外。因此，以下内容解释了您需要做什么（假设您已从\
  \ Apress 网站下载了本书附带的示例数据——这在附录 A 中有说明）：\n\n1. 在启动画面中单击**获取数据**。**获取数据**对话框将会出现，如图\
  \ 1-2 所示。\n\n   ![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig2_HTML.jpg](img/370912_3_En_1_Fig2_HTML.jpg)\n\
  \n   *图 1-2. 获取数据对话框*\n\n2. 在此对话框右侧所有可能的数据源列表中，单击**Excel**，然后单击**连接**。Windows**打开**对话框将会出现。\n\
  \n   ![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig3_HTML.jpg](img/370912_3_En_1_Fig3_HTML.jpg)\n\
  \n   *图 1-3. 从文件源加载数据时的 Windows 打开对话框*\n\n3. 单击文件 `C:\\PowerBiDesktopSamples\\BrilliantBritishCars.xlsx`。Windows**打开**对话框将如图\
  \ 1-3 所示。\n\n   ![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig4_HTML.jpg](img/370912_3_En_1_Fig4_HTML.jpg)\n\
  \n   *图 1-4. 已选择数据的导航器对话框*\n\n4. 单击**打开**按钮。**正在连接**对话框会显示一两秒钟，然后**导航器**对话框将会出现。\n\
  \n5. 您会看到 `BrilliantBritishCars.xlsx` 文件出现在**导航器**对话框的左侧，并且其中包含的任何工作簿、命名区域或数据表也会列出。单击左侧的\
  \ `BaseData` 工作表名称。该工作簿的内容将显示在**导航器**对话框右侧的数据窗格中。\n\n6. 选中左侧 `BaseData` 工作表的复选框。**加载**和**转换数据**按钮将被激活。**导航器**对话框应如图\
  \ 1-4 所示。\n\n7. 单击**加载**。数据将从 Excel 文件加载到 Power BI Desktop 中。\n\n您将看到 Power BI Desktop\
  \ 报告窗口，如图 1-5 所示。这是您添加可视化对象以创建仪表板的画布。您可以看到 Excel 工作表中的所有列现在都成为 Power BI Desktop\
  \ 应用程序右侧**字段**窗格中的字段。\n\n![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig5_HTML.jpg](img/370912_3_En_1_Fig5_HTML.jpg)\n\
  \n*图 1-5. Power BI Desktop 中可用的数据*\n\n我想加载这些数据只花了不到一分钟。然而，您现在在 Power BI Desktop\
  \ 中拥有一个完全可操作的数据模型，可以随时为仪表板提供数据。但是，由于创建仪表板将在本书后面解释，我想暂停片刻，确切解释一下您到目前为止所看到的内容。当然，如果您急切地想往前冲，实际创建几个表格和图表，那么您随时可以跳到第\
  \ 14 至 24 章。\n\n> **注意**：**获取数据**对话框中包含了对认证连接器的引用。这些连接器由第三方开发，但由 Microsoft 认证和分发。\n\
  \n\n\n## 理解数据加载\n\n到目前为止，您所看到的是对 Power BI Desktop 数据加载场景的极速浏览。实际上，这个过程可能像您刚才看到的那样极其简单，也可能相当复杂，例如连接、筛选和修改来自不同来源的多个数据集（您将在第\
  \ 7 章至第 10 章中了解）。然而，在使用 Power BI Desktop 进行任何数据分析时，加载数据始终是第一步。\n\n尽管如此，在这个简短的示例中，您仍然看到了数据加载过程的许多关键要素。这些要素包括：\n\
  \n- 访问 Power BI Desktop 可读取的任何源格式的数据\n- 在将数据加载到 Power BI Desktop 之前，先初步查看数据\n\n\
  这里您没有看到的是，Power BI Desktop 如何在数据加载过程中添加一个中间步骤，允许您在 Power BI Desktop 查询编辑器中对源数据进行编辑。数据处理的这方面内容将在第\
  \ 7 章至第 12 章中详细介绍。\n\n### 导航器对话框\n\n数据加载过程的一个关键方面是正确使用导航器对话框。您在图 1-4 中看到了这个对话框。当连接到许多（但并非全部）数据源时，会出现\
  \ `导航器` 窗口。它允许您：\n\n- 快速查看数据源中可用的数据表\n- 筛选单个数据源中可用的多个数据元素\n- 查看各个表中的数据\n- 选择一个或多个要加载到\
  \ Power BI Desktop 的数据表\n\n根据您连接的数据源，您可能会在 `导航器` 窗口中看到少数几个数据表，或者成百上千个数据表。无论如何，您看到的是\
  \ Power BI Desktop 能够识别并确信可以导入的结构化数据集。您在 `导航器` 窗口中看到的内容的复杂程度同样取决于数据源。例如，如果您正在查看一个数据库服务器，那么您可能会从一个数据库列表开始，并且可能需要通过展开数据库来深入数据的树状结构，以列出可用的数据表和视图。\n\
  \n您使用 Power BI Desktop 越多，就越会频繁地使用导航器对话框。因此，尽早解释一些技巧和方法似乎是合适的，这些技巧和方法可以让您在深入探究潜在数据源时更加轻松。\n\
  \n让我们先仔细看看可用的选项。这些选项在图 1-6 中突出显示。\n\n![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig6_HTML.jpg](img/370912_3_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6  \n导航器对话框\n\n导航器对话框主要分为两部分：\n\n- *左侧*：可用数据源的层次结构。这些可以包含单个数据集或多个数据集，可能组织在一个或多个文件夹中。\n\
  - *右侧*：选定元素中数据的预览。\n\n导航器对话框的各种选项将在以下章节中说明。\n\n#### 搜索数据集\n\n您不可避免地会遇到这种情况：您正在连接的数据源包含数百个数据集。这在数据库中尤其常见。幸运的是，Power\
  \ BI Desktop 允许您非常轻松地筛选显示的数据集。\n\n![../images/370912_3_En_1_Chapter/370912_3_En_1_Fig7_HTML.jpg](img/370912_3_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7  \n导航器对话框中的数据集搜索\n\n1. 在导航器对话框中，单击\"搜索\"框内部。\n2. 输入您想要隔离的数据集名称的一部分。\n3.\
  \ 单击\"搜索\"框右侧的放大镜图标。数据集列表将被筛选，只显示包含您输入文本的数据集。您可以在图 1-7 中看到这一点。\n\n一旦您预览并选择了要使用的数据集，只需单击\"\
  搜索\"框右侧的叉号。导航器将清除筛选条件，并显示数据源中的所有数据集。\n\n#### 显示选项\n\n在导航器对话框中单击\"显示选项\"，会弹出一个包含两个选项的菜单：\n\
  \n- 仅选定的项目\n- 启用数据预览\n\n##### 仅选定的项目\n\n选择此选项将阻止任何您未选中的数据集出现在数据源窗格中。\n\n##### 启用数据预览\n\
  \n选择此选项将显示所选数据集中的一小部分数据。如果与源数据的连接速度较慢，您可以选择禁用数据预览。\n\n#### 刷新\n\n如果需要，您可以刷新以下一项或全部两项：\n\
  \n- 源数据\n- 数据预览\n\n##### 源数据刷新\n\n单击搜索栏下的预览按钮将刷新源数据窗格中的源数据。\n\n##### 数据预览刷新\n\n\
  单击导航器对话框右上角的预览按钮将刷新右侧可见的预览数据。\n\n##### 选择相关表\n\n单击\"选择相关表\"按钮仅对数据库源（例如 Microsoft\
  \ SQL Server 或 Oracle）有效。如果源数据库设计正确，包含了表之间的联接，则此选项将自动选择与您已选择的任何表关联的所有表。\n\n注意\n\n\
  在数据库源中，有些表可能关联到其他表，而这些表本身又关联到其他表。当您单击 `选择相关表` 时，并不会完全发现此连接层次结构。换句话说，您可能必须选择多个表并重复单击此按钮，才能选择所需的所有表。\n\
  \n您将在接下来的三章中看到有关导航器窗口的更多内容。\n\n#### 导航器数据预览\n\n导航器数据预览窗格（右侧），顾名思义，是数据源中数据的预览。它提供：\n\
  \n- 您想要查看的任何数据集中的*顶部少数记录*的简要概览。由于您预览的数据可能有数百列宽、数百行深，因此在导航器数据预览内部可能会看到数据表的滚动条。但是请记住，您并不是在检查*所有*可用数据，而只是看到*一小部分可用记录的样本*。\n\
  - 数据表中可用列的列表。\n\nPower BI Desktop 可以预览和加载来自多个不同来源的数据。事实上（正如您可以从\"获取数据\"对话框中的可能数据源列表中看到的），它可以读取大多数常用的企业数据源以及许多其他数据源。需要理解的重要一点是，无论数据源是什么，Power\
  \ BI Desktop 都应用了一个通用的界面来处理数据加载这门艺术与科学。因此，无论您是在检查 SQL Server 还是 Oracle 数据库、XML 文件还是文本文件、网页还是大数据源，您将始终使用标准化的方法来检查和加载数据。这使得\
  \ Power BI Desktop 的数据体验变得无比简单——并且极其可靠。这意味着您无需花费过多时间担心数据源的技术细节，从而可以自由地专注于数据本身。\n\
  \n注意\n\n导航器数据预览是一个出色的数据发现工具。无需加载任何数据，您就可以快速查看数据源及其包含的任何（可能）可以被 Power BI Desktop\
  \ 加载的数据。然后您可以决定是否值得加载。这样，您就不会将时间浪费在可能对您的需求来说是多余的数据加载上。\n\n\n\n## 修改数据\n\n在 Power\
  \ BI Desktop 中拥有一个或多个能够连接到数据源并将数据导入该环境的查询后，您就可以开始考虑下一步——转换数据，使其可供使用。根据您处理的数据源数量以及所需修改的程度，这项工作可能从简单到复杂不等。为了使过程结构化，我建议您尝试将任何步骤分解为以下主要流程：\n\
  \n- **塑造数据集**：这包括筛选记录以减小数据集大小，以及删除任何多余的列。还可能涉及通过拆分现有列、创建计算列甚至联接查询来添加您创建的列。\n\n-\
  \ **清理和修改数据**：这也被称为*数据转换*（即 ETL 中的 *T*）。它涵盖了将文本数据转换为大写和小写，以及（例如）删除非打印字符的过程。对数据进行四舍五入以及从日期数据中提取日期部分也是可能的（在众多其他可用的转换中）。\n\
  \n然而，目前只需了解，如果您需要，Power BI Desktop 可以完成以上所有操作。数据转换的详细说明将在第 7 章至第 12 章中阐述。\n\n##\
  \ 数据源\n\n在本章的前面部分，您已经看到了如何快速轻松地将数据加载到 Power BI Desktop 中。现在是时候更广泛地了解 Power BI Desktop\
  \ 可以接收和操作的*数据*类型了。\n\n由于可能的数据源数量之巨乍看之下可能令人不知所措，Power BI Desktop 将潜在的数据源分为以下几类：\n\
  \n- **文件**：包括 Excel 文件、CSV（逗号分隔值）文件、文本文件、JSON 文件和 XML 文件。Power BI Desktop 甚至能加载整个文件夹内的所有文件。您将在下一章中发现其中的许多类型。\n\
  \n- **数据库**：当前工作场所和云中使用的综合关系数据库集合，包括（除其他外）MS Access、SQL Server 和 Oracle。本书付印时可用的完整列表在第\
  \ 3 章中给出。\n\n- **Power Platform**：这些来源涵盖了 Azure Power Platform 和 Azure 中 Power BI\
  \ Service 提供的数据。您可以在第 6 章中了解它们如何与 Power BI Desktop 一起使用。\n\n- **Azure**：此选项让您可以看到托管在微软云中的海量数据类型。这涵盖了从\
  \ SQL Server 到大数据源的各种数据格式。您可以在第 5 章中了解其中一些如何与 Power BI Desktop 一起使用。\n\n- **在线服务**：这些来源的范围从\
  \ SharePoint 列表到 Salesforce、从 Dynamics 365 到 Facebook——以及许多、许多其他服务。其中一些将在第 5 章中进行探讨。\n\
  \n- **其他**：一个庞大且不断增长的数据源集合，从 Facebook 到 Microsoft Exchange。其中的一些将在本书前六章涉及在 Power\
  \ BI Desktop 中访问数据的内容中提及。\n\n可能的数据源列表时刻在变化，您需要知道，如果您想要所有可用数据源的详尽列表，您必须查看您正在使用的 Power\
  \ BI Desktop 版本。事实上，我预计当您阅读本书时，可能又会新增好几种数据源。\n\n您还可以列出任何可用本地磁盘、网络共享甚至云中文件夹的内容，并利用此功能一次性导入多个文件。类似地（如果您拥有必要的权限），您可以列出您所连接的数据库服务器上的可用数据库和数据。通过这种方式，Power\
  \ BI Desktop 不仅能够提供数据，还能提供*元数据*——即关于数据的数据——这可以帮助您快速浏览潜在的数据源，并只选择您真正需要的那些。\n\n不幸的是，Power\
  \ BI Desktop 能够读取数据的数据源范围之广，使得我们无法在有限的几个章节中详细检查每一个细节。因此，我们将在本章及接下来的几章中快速浏览*一些*最常用的数据源。幸运的是，Power\
  \ BI Desktop 能读取的大多数数据源都以类似的方式使用。这是因为 Power BI Desktop 界面出色地使那些晦涩的连接细节尽可能不引人注目。因此，即使您面对的是这些章节中未描述的数据源，您仍然会看到可以应用于\
  \ Power BI Desktop 几乎任何数据源的各种技术。\n\n**注意**：Power BI Desktop 可以访问的数据源列表在不断增加。因此，当您阅读本书时，您可能会发现比本章及接下来几章所描述的更多的数据源。\n\
  \n## 结论\n\n在本章中，您已经了解了 Power BI Desktop 如何连接到各种数据源中的任何一个。您已经了解到，只要您知道要加载哪种数据——并且\
  \ Power BI Desktop 有可用的连接器接入这些数据——您就可以预览并加载数据。\n\n现在是时候更深入地研究您可以与 Power BI Desktop\
  \ 一起使用的各种数据源的细节了。下一章将通过介绍许多您可以用来创建分析仪表板的基于文件的数据类型，来开启您的旅程。\n\n"
- '# 使用 Power BI Desktop 发现和加载基于文件的数据




  ##### 文件源


  通过网络、互联网或电子邮件发送文件已成为我们大多数人的第二天性。只要你获得的文件符合当前一些广泛认可的标准（稍后你将了解更多），将它们加载到 Power BI
  Desktop 中应该不会有什么困难。


  作为数据混搭过程的第一步，本章将向你展示如何查找和加载来自各种基于文件的源的数据。这些数据类型通常是那些你可以在共享网络驱动器上找到、从互联网下载、作为电子邮件附件接收或复制到计算机本地驱动器中的数据。本章示例中使用的文件可在
  Apress 网站上获取。如果你已按照附录 A 中的下载说明操作，那么这些文件将位于 `C:\PowerBIDesktopSamples` 文件夹中。


  Power BI Desktop 当前可以读取并从中加载数据的文件源如下表 2-1 所示。


  表 2-1


  文件源


  | 文件源 | 说明 |

  | --- | --- |

  | Excel | 允许你读取 Microsoft Excel 文件（版本 97 到 2019）并加载工作表、命名区域和表格。 |

  | CSV | 允许你加载符合 CSV（逗号分隔值）格式的文本文件。 |

  | XML | 允许你从 XML 文件加载数据。 |

  | 文本 | 允许你使用各种列分隔符加载文本文件。 |

  | 文件夹 | 允许你加载文件夹中所有文件的信息。 |

  | SharePoint 文件夹 | 允许你列出 SharePoint 文件夹中的文件。 |

  | Access 数据库 | 允许你连接到网络上的 Microsoft Access 文件并加载查询和表格。 |

  | JSON | 帮助你从 JSON 文件加载数据。 |

  | PDF | 允许你预览 PDF 文件并加载文档中任何表格的数据。 |


  在本章中，我们将探讨如何从以下来源导入数据：


  *   CSV 文件

  *   文本文件

  *   XML 文件

  *   Excel 文件

  *   Excel 中的 Power View、Power Query 和 Power Pivot 元素

  *   Access 数据库

  *   PDF 文件


  更高级的技术（例如导入整个文件夹的文本或 Excel 文件的内容，或导入复杂的 XML 文件和 JSON 文件）将在第 10 章中描述。我更倾向于将这些内容分开处理，因为它们需要更高级的数据转换技术知识——而你需要先学习这些基础知识。


  > **注意：** 我知道 Power BI Desktop 将 MS Access 视为数据库而不是“文件”数据类型。虽然我完全同意这种分类，但我仍然倾向于将
  Access 视为基于文件的数据源，因为所有数据都驻留在一个可以复制和通过电子邮件发送的单个文件中，而不是存储在远程服务器的数据库中。因此，我们将在本章中介绍
  MS Access，而不是在下一章中讨论企业数据源。


  ### 从文件加载数据


  现在，是时候开始了解 Power BI Desktop 的“重活儿”部分，以及如何使用它从各种不同源加载数据了。我将从最简单的例子开始——从一个文本文件加载数据，这就像在初学者斜坡上滑行（或者像我们英国说的“育儿”斜坡）。然后，鉴于可用数据源种类繁多，并且为了使过程结构更清晰，我们将从大多数工作场所中常见的几个基于文件的数据源加载数据。这些数据源是你在第
  7 章到第 10 章中学习调整和“混搭”的基础。这些数据也可以成为你将在第 14 – 24 章中创建的许多仪表板元素的基础。


  #### CSV 文件


  场景如下：你获得了一个包含数据列表的 CSV 文件。现在，你希望将其加载到 Power BI Desktop 中，以便查看数据并考虑需要做什么（如果有的话）才能使其可用。


  首先，你需要了解要加载的数据。如果你使用文本编辑器（如记事本）打开源文件 `C:\PowerBIDesktopSamples\Countries.csv`，就可以查看其内容。你在图
  2-1 中可以看到的内容如下。


  ![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig1_HTML.jpg](img/370912_3_En_2_Fig1_HTML.jpg)


  图 2-1


  `Countries.csv` 文件的内容


  以下步骤说明了将此类文件的内容加载到 Power BI Desktop 中所需要做的工作：


  ![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig2_HTML.jpg](img/370912_3_En_2_Fig2_HTML.jpg)


  图 2-2


  Power BI Desktop 中的文件数据连接器


  1. 打开 Power BI Desktop 并关闭启动屏幕。


  2. 在 Power BI Desktop 的“开始”功能区中，单击 `获取数据` 按钮（而不是显示菜单选项的小三角形）。


  3. 单击左侧的 `文件`。你将看到类似图 2-2 的内容（`获取数据` 对话框）。


  ![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig3_HTML.jpg](img/370912_3_En_2_Fig3_HTML.jpg)


  图 2-3


  Power BI Desktop 文件对话框


  4. 在对话框右侧单击 `Text/CSV`。


  5. 单击 `连接`。将出现 `打开` 对话框。


  6. 导航到包含要加载文件的文件夹，并选择该文件（本例中为 `C:\PowerBIDesktopSamples\Countries.csv`）。


  7. 单击 `打开`。将出现一个对话框，显示文件的初始内容，如图 2-3 所示。


  ![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig4_HTML.jpg](img/370912_3_En_2_Fig4_HTML.jpg)


  图 2-4


  已加载 CSV 文件内容的 Power BI Desktop 查询窗口


  8. 单击 `转换数据` 按钮。Power BI Desktop 查询窗口出现，其中包含 CSV 文件内容的样本——如果文件不是太大，也可能包含整个文件。你可以在图
  2-4 中看到这一点。


  9. 单击 Power BI Desktop 查询窗口中的 `关闭并应用` 按钮（你可以在图 2-4 的左上角看到它）。Power BI Desktop 查询编辑器将关闭，并将焦点返回到
  Power BI Desktop 窗口，在那里你可以看到“国家/地区”数据集显示在屏幕右侧的“字段”列表中。


  到此为止，暂时就完成了。你只需点击几次，就将文件加载到了 Power BI Desktop 中，它已准备好用于仪表板和报表。在后续章节中，你将学习如何塑造这些数据。然而，现在，让我们继续看看其他一些基于文件的数据源。




  '
- "# 什么是 CSV 文件？\n\n在继续介绍其他文件类型之前，我需要先对 CSV 文件做一些说明。关于“真正的”CSV 文件，其实存在技术规范，但我不会用那些细节来烦你。更重要的是，许多生成\
  \ CSV 文件的程序并不总是严格遵循这个定义。关键在于，Power BI Desktop 能够处理符合以下条件的文本文件：\n\n- 拥有`*.csv`扩展名（它会默认使用此扩展名来应用正确的处理方式）。\n\
  - 使用*逗号*分隔行中的各个元素。同样，这也是一个默认设置，可以通过在图 2-3 所示的对话框中选择一个分隔符来覆盖。\n- 以*换行符、回车符或换行符/回车符*结尾。\n\
  - 可以选择性地*包含用于封装字段的双引号*。这些双引号将在数据加载过程中被剥离。如果存在双引号，它们不必出现在每个字段中，甚至不必出现在字段中的每条记录里（字段中的双引号偶尔可能不一致）。\n\
  - 可以包含“不规则”记录，即那些不包含标准记录中所有元素的行。但是，第一行（无论是否包含标题）必须涵盖列表中所有后续记录中的每一个元素。简单来说，任何其他记录都可以比第一行短，但不能比它长。\n\
  - 除了数据本身之外，不包含任何其他内容。如果文件包含不属于数据的页眉行或页脚行，那么 Power BI Desktop 将无法直接加载该数据集。对于这个非常常见的问题，有一些变通方法；其中一个方法在第\
  \ 8 章中给出。\n\n> **注意**  \n> 访问 CSV 文件的另一种方式是单击**获取数据** ➤ **文件**，然后在**获取数据**对话框中选择**文本/CSV**。\n\
  \n#### 文本文件\n\n如果您按照上一节中的步骤加载了 CSV 文件，那么您会发现加载文本文件的过程几乎完全相同。这并不奇怪。两者都是文本文件，并且都应包含一个单一的数据列表。以下是核心区别：\n\
  \n- 文本文件可以使用逗号*以外*的字符来分隔列表中的元素。您可以在定义加载步骤时指定分隔符。\n- 文本文件通常应具有`.txt`扩展名（不过，这个设置也可以被覆盖）。\n\
  - 文本文件*必须*格式完美；也就是说，每条记录（行）必须与其他所有记录具有相同数量的元素。\n- 同样地，如果您希望首次加载数据时完美无缺，文本文件*也不能*包含数据集以外的任何内容。\n\
  - 如果文本文件遇到问题，它应该将数据作为单个列导入，然后您可以尝试将其拆分为多个列，如第 8 章所述。\n\n现在，以下是将文本文件加载到 Power BI\
  \ Desktop 中的步骤：\n\n1. 在 Power BI Desktop 的功能区中，单击**获取数据** ➤ **文本/CSV**。将显示**打开**对话框。\n\
  2. 导航到包含该文件的文件夹并选择该文件（在此示例中为`C:\\PowerBIDesktopSamples\\CountryList.txt`）。\n3. 单击**打开**。将显示一个对话框，展示文件的初始内容（此对话框与您在图\
  \ 2-3 中看到的 CSV 文件对话框基本相同）。当然，您也可以双击文件名而不是单击**打开**。\n4. 单击**取消**按钮（因为快速查看文件内容后，您决定并不真正需要它）。\n\
  \n> **注意**  \n> 由于基于文本的文件（包括 CSV 文件）是常见的数据来源，您几乎总能在**开始**功能区的**获取数据**按钮中，通过单击小三角形访问的弹出菜单中直接看到**文本/CSV**选项。如果该选项不可见，您可以像之前一样选择**获取数据**\
  \ ➤ **文件**，然后选择**文本/CSV**。\n\nPower BI Desktop 非常聪明的一点是，它能够对文本文件的结构进行非常准确的猜测；也就是说，它几乎总能猜出字段分隔符（将列表中每个元素与其他元素隔开的字符）。因此，它不仅会将列表拆分成列，还会避免导入列分隔符。如果它猜错了，也不用担心。您将在第\
  \ 8 章中学习如何修正这个问题。\n\n查看文件内容然后决定不使用它，正是您在使用 Power BI Desktop 时会发现的*数据发现*过程的一部分。本练习的目的在于向您展示，快速查看潜在数据源并决定是否将其导入数据模型是多么容易。此外，直接在\
  \ Power BI Desktop 的**加载**对话框中查看大型文本或 CSV 文件的前几行，可能比在文本编辑器中打开整个文件更容易。\n\n> **提示**\
  \  \n> 尽管显而易见，但值得一提的是，您可以在对话框中按 **Enter** 键接受默认选项，按 **Esc** 键取消对话框。\n\n#### 文本和\
  \ CSV 选项\n\n您可以在图 2-3 中看到，在加载文本或 CSV 文件时可以调整的选项并不多。大多数情况下，Power BI Desktop 会为您猜出正确的设置。但是，有时您可能需要稍微调整这些参数。可能修改的选项包括：\n\
  \n- 文件源\n- 分隔符\n- 数据类型检测\n\n##### 文件源\n\n此选项定义了文件存储时使用的字符编码。不同的字符集可以处理不同范围的字符，例如重音符号和其他变音符号。通常，Power\
  \ BI Desktop 能够正确解释此信息，只有在极少数情况下才需要选择不同的字符集（文件源）。\n\n##### 分隔符\n\nPower BI Desktop\
  \ 会尝试猜测文本或 CSV 文件中用于分隔数据“列”的特殊字符。如果您希望覆盖所选的分隔符，可以选择以下选项：\n\n- 冒号\n- 逗号\n- 等号\n-\
  \ 分号\n- 空格\n- 制表符\n\n您还可以决定输入自定义分隔符，例如竖线（`|`）字符，甚至指定每个字段具有固定宽度。选择这两个选项中的任何一个都会显示另一个输入字段，您可以在其中键入所需的分隔符或所需的固定长度。\n\
  \n##### 数据类型检测\n\nPower BI Desktop 会对文本或 CSV 文件中使用的数据编码和数据类型进行有根据的猜测。默认情况下，为了节省时间，它只读取前\
  \ 200 条记录。但是，您可以从以下三个选项中选择任意一个：\n\n- 读取前 200 行\n- 读取整个文件\n- 不进行数据类型检测\n\n> **注意**\
  \  \n> 请注意，完整读取一个大型文件可能需要相当长的时间。然而，如果没有准确的数据类型检测，您可能会在加载的数据中看到一些奇怪的字符。\n\n\n\n####\
  \ 简单的 XML 文件\n\n`XML`（可扩展标记语言）是 IT 系统之间传输数据的一种标准方式。因此，你很可能有一天会加载一个 `XML` 文件。尽管 `XML`\
  \ 文件只是文本，但它是以非常特定的方式格式化的文本，如果你在记事本等文本编辑器中打开一个 `XML` 文件，就能看到这一点。请执行以下步骤来加载一个`XML`文件：\n\
  \n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig5_HTML.jpg](img/370912_3_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n加载 `XML` 文件前的导航器对话框\n\n1. 在 Power BI Desktop 的功能区中，点击 **获取数据** 按钮上的小三角形，然后在出现的菜单中点击\
  \ **更多**。接下来，在 **获取数据** 对话框中，选择 **文件** 和 **XML**。\n2. 点击 **连接**。**打开** 对话框将会出现。\n\
  3. 导航到包含该文件的文件夹，并选择文件（本例中为 `C:\\PowerBIDesktopSamples\\ColoursTable.xml`）。\n4. 点击\
  \ **打开**。**导航器** 对话框将会打开。\n5. 点击 **导航器** 对话框左侧窗格中的 **Colours** 数据集。`XML` 文件这一部分的内容将显示在\
  \ **导航器** 对话框的右侧，如图 2-5 所示。\n6. 点击左侧 **Colours** 数据集左侧的复选框。**加载** 和 **编辑** 按钮将变为可用状态。\n\
  7. 点击 **转换数据** 按钮。Power BI Desktop 数据窗口将显示 `XML` 文件的内容。\n8. 点击 Power BI Desktop\
  \ 数据窗口中的 **关闭并应用** 按钮。你将看到 **Colours** 数据集出现在屏幕右侧的 **字段** 列表中。\n\n`XML` 文件的实际内部格式可能极其复杂。有时一个\
  \ `XML` 文件只包含一个数据集；有时它会包含多个独立的数据集。在其他情况下，它可能包含一个数据集，而其记录中包含需要你通过展开元素层级来处理的嵌套数据层。你将在第\
  \ 10 章中看到 **导航器** 对话框如何处理 `XML` 数据的嵌套层级——在你学到一些必要的数据转换技巧之后。\n\n> 注意：某些类型的数据源允许你同时加载多组数据。`XML`\
  \ 文件（与 `CSV` 和文本文件不同）可以包含多个独立的数据集。你可以通过选中要加载的每个数据集左侧的复选框，来从 `XML` 文件中同时加载多个数据集。\n\
  \n#### Excel 文件\n\n你很可能已经是 Excel 的重度用户，拥有许多包含大量数据的电子表格，希望能在 Power BI Desktop 中对这些数据进行整理、分析和展示。那么，让我们来看看如何从一个\
  \ Excel 文件中同时加载多个工作表。\n\n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig6_HTML.jpg](img/370912_3_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n从 Excel 工作簿加载数据前的导航器对话框\n\n1. 在 Power BI Desktop 的 **开始** 功能区中，点击 **Excel**。或者，点击\
  \ **获取数据** 按钮底部的小三角形，然后点击 **Excel**。**打开** 对话框将会出现。\n2. 导航到包含你想要查看的文件的目录（本例中为 `C:\\\
  PowerBIDesktopSamples`）。\n3. 选择源文件（本例中为 `InvoicesAndInvoiceLines.xlsx`），然后点击 **打开**。**导航器**\
  \ 对话框将会出现，显示工作簿文件中的工作表、表格和区域。\n4. 点击 **导航器** 对话框左侧列出的一个数据集。所选电子表格的前几行将显示在对话框的右侧，以展示所选数据集中的数据样式。\n\
  5. 点击左侧 **Invoices** 和 **InvoiceLines** 数据集左侧的复选框。**导航器** 对话框将如图 2-6 所示。\n6. 点击\
  \ **加载**。选中的工作表将被加载到 Power BI Desktop 数据模型中，并出现在 **报告** 窗口的 **字段** 列表中。\n\n从这个简单的例子可以看出，让\
  \ Power BI Desktop 读取 Excel 数据并不困难。你也可以在加载数据之前，在 Power BI Desktop 查询编辑器中对数据进行编辑，但由于这些数据看起来已经干净且可直接使用，我更倾向于直接将其加载到\
  \ Power BI Desktop 中（或者更准确地说，是加载到 Power BI Desktop 数据模型中）。此外，你还看到 Power BI Desktop\
  \ 可以从单个数据源同时加载多个数据集。不过，你可能仍然对在这个过程中看到的一些事情感到疑惑，因此这里有一些预先的说明：\n\n**导航器** 对话框会显示：\n\
  - 工作表（图 2-6 中的 **Invoices** 和 **InvoiceLines**）\n- 命名区域（图 2-6 中的 **InvoiceRange**）\n\
  - 命名表格（图 2-6 中的 **Table1**）\n\n这些元素在 **导航器** 对话框中各自由不同的图标表示。有时，这些图标实际上可能指向同一份数据的重复引用，因此你应尽量使用最精确的数据源。例如，我建议使用命名表格或区域名称，而不是工作表源，因为后者很容易包含“噪音”数据（即来自你不关心的行和列之外的数据），这会使加载过程变得比实际需要的更复杂——甚至导致加载失败。事实上，除非工作表已经以简单的表格格式准备好并结构化，以便加载到\
  \ Power BI Desktop 中，否则你的数据模型中最终可能会包含多余的数据。\n\n然而，真正酷的是，你可以从单个 Excel 工作簿中同时加载任意数量的工作表、表格或区域。你不需要单独加载每个源数据集。\n\
  \n> 注意：如果数据连接处于活动状态并且已将数据返回到工作簿，Power BI Desktop 将列出并使用源 Excel 工作簿中指向外部数据源（例如 SQL\
  \ Server、Oracle 或 SQL Server Analysis Services）的数据连接。一旦与 Power BI Desktop 建立了链接，你就可以删除源\
  \ Excel 工作簿中的数据表本身——但仍可通过源工作簿中的数据连接将数据加载到 Power BI Desktop 中。\n\nPower BI Desktop\
  \ *不会*考虑 Excel 数据表上的任何数据筛选器，而是会加载源表中的所有数据。因此，如果你想对源数据进行子集划分，则必须在 Power BI Desktop\
  \ 中重新应用任何筛选器（你将在第 6 章中了解更多相关信息）。\n\n在这个阶段，有几个重要的点你需要了解：\n- 多个工作表、表格或命名区域可以在单次加载操作中从同一个工作簿（即\
  \ Excel 文件）中导入。但是，你需要为每个单独的 Excel 文件定义单独的加载操作。\n- 可以同时加载多个结构相同的 Excel 文件。这将在第 10\
  \ 章中解释。\n\n\n#### 导入 Excel 和 Power View 项目\n\n实际上，Power BI Desktop 并非 Power BI 的首个版本；它使用的数据模型已经存在多年，而可视化画布的早期版本则以名为\
  \ Power View 的 Excel 加载项形式存在。因此，您可能已经是使用 Power View for Excel 的资深专家，不希望放弃这项工作——或者您可能拥有使用\
  \ Excel 中的 Power Pivot 构建的现有数据模型，并希望将其迁移到 Power BI Desktop 中。\n\n幸运的是，微软团队已经考虑到了这一点，因此您可以极其轻松地将您在\
  \ Excel 中的所有成果（Power View 仪表板、Power Pivot 数据模型和 DAX 度量值）迁移到 Power BI Desktop 中。具体操作方法如下：\n\
  \n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig7_HTML.jpg](img/370912_3_En_2_Fig7_HTML.jpg)\n\
  \n**图 2-7** – 从 Excel 导入现有的 Power View 或 Power Pivot 项目\n\n1. 打开一个新的空白 Power BI\
  \ Desktop 文件。\n2. 在**文件**菜单中，选择**导入 ➤ Power Query、Power Pivot、Power View**，如图 2-7\
  \ 所示。\n\n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig8_HTML.jpg](img/370912_3_En_2_Fig8_HTML.jpg)\n\
  \n**图 2-8** – 从 Excel 导入 Power View 和 Power Pivot 元素\n\n1. 出现 **Windows 打开** 对话框，您可以从中选择包含\
  \ Power View 或 Power Pivot 项目的现有 Excel 文件。在此示例中，您可以使用本章示例文件中的 `CarSalesForPowerBI.xlsx`\
  \ 文件。\n2. 单击**打开**。将出现您在 2-8 中看到的警告对话框。\n\n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig9_HTML.jpg](img/370912_3_En_2_Fig9_HTML.jpg)\n\
  \n**图 2-9** – 从 Excel 导入 Power View 和 Power Pivot 元素\n\n1. 单击**开始**。Power BI Desktop\
  \ 将导入任何兼容项目，并在导入过程中显示**导入进度**对话框（如图 2-9 所示）。\n\n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig10_HTML.jpg](img/370912_3_En_2_Fig10_HTML.jpg)\n\
  \n**图 2-10** – 导入摘要对话框\n\n1. 导入过程成功完成后，Power BI Desktop 将显示您在 2-10 中看到的摘要对话框。\n\
  2. 单击**关闭**。这些项目便成为 Power BI Desktop 报表。\n\n在本书付印时，某些 Power View 可视化效果的一些方面尚未完美地导入到\
  \ Power BI Desktop 数据模型中。然而，由于这项技术正在快速发展，当您阅读本书时，这些细微的限制很可能已经得到解决。无论如何，我建议您查阅 Power\
  \ BI 网站 ([`https://powerbi.microsoft.com`](https://powerbi.microsoft.com))，以获取关于将\
  \ Excel 对象转换为 Power BI Desktop 报表时任何剩余限制的最新详细信息。\n\n#### Microsoft Access 数据库\n\n\
  当今许多公司中另一个广泛使用的数据存储库是 Microsoft Access。它是一个强大的桌面关系数据库，可以包含数百个表，每个表包含数百万条记录。因此，我们需要了解如何从这一特定源加载数据。此外，Power\
  \ BI Desktop 在处理 Access 数据时尤其有用，因为它允许您查看 Access 数据库的内容，甚至无需安装 Access 本身。\n\n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig11_HTML.jpg](img/370912_3_En_2_Fig11_HTML.jpg)\n\
  \n**图 2-11** – 从 Access 数据库加载数据前的导航器对话框\n\n1. 在 Power BI Desktop 功能区中，单击**获取数据 ➤\
  \ 数据库**，然后在**获取数据**对话框中选择 **Access 数据库**。\n2. 单击**连接**，然后导航到包含要加载数据的 MS Access 数据库（在此示例中为\
  \ `C:\\PowerBIDesktopSamples\\ClientsDatabase.accdb`）。\n3. 选择 Access 文件并单击**打开**。将出现**导航器**对话框；它会列出\
  \ Access 数据库中的所有表和查询。\n4. 选中 `ClientList` 数据集的复选框。这将显示该表的内容，如图 2-11 所示。\n5. 单击**加载**。Power\
  \ BI Desktop 窗口打开，并在**报表**窗口的**字段**列表中显示该表。\n\n如果您仔细观察图 2-11 中导航器对话框的左侧，您会看到它显示了\
  \ Access 对象的两种不同图标：\n\n-   数据表的表图标\n-   Access 查询的两个小窗口图标\n\n这可以帮助您了解您正在 Access\
  \ 数据库中查看的数据类型。\n\n**注意**：Power BI Desktop *无法*查看 Access 中的链接表，只能查看导入的表或实际存在于 Access\
  \ 数据库中的表。但是，它可以读取基于本地数据、链接数据或导入数据的查询。\n\n### PDF 文件\n\nPower BI Desktop 还可以从 PDF\
  \ 文件导入表格数据。这做起来非常简单，令人惊叹。\n\n![../images/370912_3_En_2_Chapter/370912_3_En_2_Fig12_HTML.jpg](img/370912_3_En_2_Fig12_HTML.jpg)\n\
  \n**图 2-12** – 显示 PDF 文档中的表格\n\n1. 在 Power BI Desktop 功能区中，单击**获取数据 ➤ 文件**，然后在**获取数据**对话框中选择\
  \ **PDF**。\n2. 单击**连接**，然后导航到包含要加载数据的 PDF 文档（在此示例中，是一个关于机器学习的微软文档）。\n3. 选择 PDF 文件并单击**确定**。将出现**导航器**对话框；它会列出\
  \ PDF 文档中的所有表格。\n4. 勾选您要导入到 Power BI Desktop 的表的复选框。这将显示所选表的内容，如图 2-12 所示。\n5. 单击**加载**。Power\
  \ BI Desktop 窗口打开，并在**报表**窗口的**字段**列表中显示这些表及其列（作为字段）。\n\n**注意**：您只能查看并因此导入 PDF 文档中的表格，无法导入文本段落。\n\
  \n我相信您能看出本章中出现的一种模式。实际上，当您继续学习到第 3 章从关系数据库加载表时，这种模式仍将持续。这个过程几乎总是：\n\n1.  了解您想要查看的源数据类型\n\
  2.  找到可让您访问数据的源文件\n3.  检查数据并选择要加载的元素\n\n**注意**：您需要知道，Power BI Desktop 可能需要相当长的时间来读取\
  \ PDF 文件。因此，在选择了要从中加载数据的 PDF 文档后，请耐心等待**导航器**对话框出现。\n\n## JSON 文件\n\n`JSON` 文件与\
  \ `XML` 一样，是一种允许用户（和计算机）在系统之间发送复杂数据结构的文件格式。通常，`JSON` 文件需要稍作调整才能加载为 Power BI Desktop\
  \ 可用的状态。因此，我们将在第 10 章中，在您掌握了第 7 章至第 9 章中必要的数据转换技术之后，再来研究如何加载和准备 `JSON` 文件。\n\n\n\
  \n## 结论\n\n在本章中，你已经了解了如何运用这一强大的 Microsoft 商业智能工具集新增功能——`Power BI Desktop`，从各种基于文件的数据源中查找和加载数据。这些数据源可以是\
  \ `Access`、`Excel`（包括 `Power View`、`Power Query` 和 `Power Pivot` 元素）、`CSV`、`XML`、`PDF`\
  \ 或 `text/CSV` 文件。\n\n你已经看到，`Power BI Desktop` 无需任何其他应用程序，即可让你预览其能够读取的数据源内容样本。这使其成为一款出色的工具，可用于探查数据源并判断某个文件是否真正包含你需要的数据。事实上，`Power\
  \ BI Desktop` 的 `Navigator` 可以帮助你筛选 `Excel` 或 `XML` 文件或 `Access` 数据库中的多个数据集，预览每个数据集，并只选择你想要加载的数据。当然，如果多个数据集都存储在同一个数据源中，它也可以一次性加载数十个数据集。\n\
  \n本章并未完整概述如何加载基于文件的数据源。因此，如果你需要加载复杂的 `XML` 文件或 `JSON` 文件，或者需要了解如何加载整个文件夹的内容（例如，`Excel`\
  \ 文件中的所有工作表），你可以直接跳到第 10 章来学习这些技巧。\n\n然而，基于文件的数据源只是冰山一角。`Power BI Desktop` 还可以从各种关系数据库和数据仓库中加载数据。我们将在下一章中探讨其中的一些。\n\
  \n"
- "# 3. 从数据库和数据仓库加载数据\n\n目前，世界上绝大多数企业数据都驻留在关系数据库、数据仓库以及本地或云端的数据仓库一体机中。`Power BI Desktop`\
  \ 能够连接到全球大多数主流数据库和数据仓库。不仅如此，它还可以连接到许多目前可用的小众或更专业的数据源。本章将演示如何使用 `Power BI Desktop`\
  \ 从其中若干个数据源中提取数据，为你的分析工作提供动力。事实上，你会发现，一旦学会了如何连接一两个数据库，你就几乎学会了如何使用它们全部，这要归功于 `Power\
  \ BI Desktop` 为数据提取带来的标准化界面和方法。\n\n然而，你需要了解，本章中的示例并未使用 `Apress` 网站上提供的示例数据。在本章中，我将让你加载自己的数据，或者使用数据库本身可以安装的示例数据。\n\
  \n**注意：**  \n这也许是显而易见的，但连接到数据库意味着该数据库必须已正确安装并运行，并且你已拥有访问权限。确实，你可能还需要在运行 `Power BI\
  \ Desktop` 的电脑上安装特定的客户端软件。本章不会解释如何安装或使用所提及的任何数据库（或客户端软件）。为此，你需要查阅相关的数据库文档。\n\n##\
  \ 关系数据库\n\n能够访问存储在关系数据库中的数据，对于当今许多商业智能工作至关重要。由于企业级关系数据库仍然存储着世界上大部分数据，你确实需要知道如何挖掘其中蕴含的庞大信息宝藏。坏消息是，存在很多很多数据库，每个都有其独特性和古怪之处。好消息是，一旦你学会了从*其中一种*数据库加载数据，你就可以合理地期望能够使用*任何一种*数据库。\n\
  \n在实际应用中，连接到企业数据可能需要你拥有登录名，并且通常需要密码才能连接（除非数据库能够识别你的 `Windows` 登录信息，或者已经实施了单点登录解决方案）。我想，你还需要拥有读取包含数据的表和视图的权限。因此，此处介绍的技术可能只是简单的一环。困难的部分在于说服企业数据的守护者，让他们相信你*确实需要*这些数据，并且应该被允许查看它们。\n\
  \n`Power BI Desktop` 当前能够连接、预览并从中加载数据的数据库如表 3-1 所示。\n\n**表 3-1** 数据库源\n\n\n\n| 数据库\
  \ | 说明 |\n| --- | --- |\n| `SQL Server` 数据库 | 允许你连接到本地 Microsoft SQL Server 数据库，并从所有你有权访问的数据表和视图中导入记录。\
  \ |\n| `Access` 数据库 | 允许你连接到网络上的 Microsoft Access 文件，并加载查询和表（我们在上一章中探讨过这些内容）。 |\n\
  | `SQL Server Analysis Services` 数据库 | 允许你连接到 SQL Server Analysis Services（`SSAS`）数据仓库。这可以是联机分析处理（`OLAP`）多维数据集，也可以是内存中的表格数据仓库。\
  \ |\n| `Oracle` 数据库 | 允许你连接到 Oracle 数据库，并从所有你有权访问的数据表和视图中导入记录。这通常需要安装客户端软件。 |\n\
  | `IBM DB2` 数据库 | 允许你连接到 IBM DB2 数据库，并从所有你有权访问的数据表和视图中导入记录。这通常需要安装额外的软件。 |\n| `IBM\
  \ Informix` 数据库 | 允许你连接到 IBM Informix 数据库，并从所有你有权访问的数据表和视图中导入记录。这通常需要安装额外的软件。 |\n\
  | `IBM Netezza` | 允许你连接到 IBM Netezza 数据仓库设备，并从所有你有权访问的数据表中导入记录。这通常需要安装额外的软件。 |\n\
  | `MySQL` 数据库 | 允许你连接到 MySQL 数据库，并从所有你有权访问的数据表和视图中导入记录。 |\n| `PostgreSQL` 数据库 |\
  \ 允许你连接到 PostgreSQL 数据库，并从所有你有权访问的数据表和视图中导入记录。这通常需要安装额外的软件。 |\n| `Sybase` 数据库 |\
  \ 允许你连接到 Sybase 数据库，并从所有你有权访问的数据表和视图中导入记录。 |\n| `Teradata` 数据库 | 允许你连接到 Teradata\
  \ 数据库，并从所有你有权访问的数据表和视图中导入记录。这通常需要安装额外的软件。 |\n| `SAP HANA` 数据库 | 允许你连接到 SAP HANA\
  \ 内存数据库，并从所有你有权限访问的对象中导入记录。这通常需要安装额外的软件。 |\n| `SAP Business Warehouse Application\
  \ Server` | 允许你连接到 SAP Business Warehouse。这通常需要安装客户端软件。 |\n| `SAP Business Warehouse\
  \ Message Server` | 允许你连接到 SAP Business Warehouse。这通常需要安装客户端软件。 |\n| `Amazon Redshift`\
  \ | 允许你连接到 Amazon Redshift 数据库，并从所有你有权访问的数据表和视图中导入记录。 |\n| `Impala` | 允许你连接到 Impala\
  \ 数据库，并从所有你有权访问的数据表和视图中导入记录。 |\n| `Google Big Query` | 允许你访问 Google Big Query 数据存储库。\
  \ |\n| `Essbase` | 允许你连接到 Essbase 多维数据集。 |\n| `Snowflake` | 允许你连接到云端 Snowflake 数据仓库。\
  \ |\n| `Exasol` | 允许你连接到 Exasol 数据存储库。 |\n\n目前还有许多其他可用的数据库连接器。由于完整列表会占据好几页篇幅，我建议你在\
  \ `Get Data`（获取数据）对话框中向下滚动列表，查看你正在使用的数据库是否有适用于 Power BI 的连接器。\n\n> **注意：** 随着可从\
  \ Power BI Desktop 连接的数据库和数据仓库源列表持续发展，当你阅读本书时，此列表很可能会新增若干项。\n\n除了针对特定数据库的连接外，`Power\
  \ BI Desktop` 还包含通用连接器，可帮助你从可用数据库列表中未专门列出的数据库中读取数据。这些通用连接器在表 `3-2` 中进行了说明。\n\n**表\
  \ 3-2：** 通用数据库访问\n\n| 源 | 说明 |\n| --- | --- |\n| `ODBC` 数据源 | 允许你通过开放式数据库连接（Open\
  \ Database Connectivity）连接到数据库或数据源。 |\n| `OLE DB` 数据源 | 允许你通过对象链接与嵌入数据库（Object Linking\
  \ and Embedding, Database）连接到数据库或数据源。 |\n\n请注意，这些通用连接器并非适用于所有数据库。但是，它们应适用于你已经获取、安装并配置了有效\
  \ `ODBC` 或 `OLE DB` 驱动程序的数据库。你可以在第 `6` 章了解有关此内容的更多信息。\n\n> **注意：** 尽管 `Power BI\
  \ Desktop` 将 Microsoft Access 归类为关系数据库，但我更倾向于将其视为基于文件的源。因此，MS Access 数据已在上一章中讨论过。\n\
  \n\n\n## SQL Server\n\n在此，我将以微软企业级关系型数据库——SQL Server——为例，向您展示如何从数据库中将数据加载到 `Power\
  \ BI Desktop` 中。这种设置的首要优点是，您可能无需安装任何软件即可访问 SQL Server（但情况并非总是如此，因此请与您的 IT 部门沟通）。第二个优点是，这些技术与\
  \ Oracle、DB2 以及其他 `Power BI Desktop` 可连接的数据库所使用的技术非常相似。此外，您可以一次性从数据库中加载多个表或视图。要在（您的\
  \ SQL Server 数据库上）实际操作，请执行以下步骤：\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig1_HTML.jpg](img/370912_3_En_3_Fig1_HTML.jpg)\n\
  \n**图 3-1** Microsoft SQL Server 数据库对话框\n\n1. 打开一个新的 `Power BI Desktop` 应用程序。\n\
  2. 在 `Power BI Desktop` 的“开始”功能区中，点击 `SQL Server`。或者，点击“获取数据”按钮底部的小三角形，然后点击 `SQL\
  \ Server`。将出现 `SQL Server 数据库` 对话框。\n3. 在 `服务器` 文本框中输入服务器名称。这将是您 SQL Server 的名称，或者您的组织使用的某个\
  \ SQL Server 资源的名称。\n4. 输入数据库名称。\n5. 点击 `导入` 按钮。对话框将如图 3-1 所示（当然，其中会显示您的服务器和数据库名称）。\n\
  \n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig2_HTML.jpg](img/370912_3_En_3_Fig2_HTML.jpg)\n\
  \n**图 3-2** 凭据数据库对话框\n\n6. 点击 `确定`。将出现 `SQL Server 数据库` 对话框。假设您已获授权使用您的 Windows\
  \ 登录名连接数据库，请保持选中“使用我的当前凭据”，如图 3-2 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig3_HTML.jpg](img/370912_3_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** 加密支持对话框\n\n7. 点击 `连接`。可能会出现`加密支持`对话框，警告您连接未加密，如图 3-3 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig4_HTML.jpg](img/370912_3_En_3_Fig4_HTML.jpg)\n\
  \n**图 3-4** 选择多项时的导航器对话框\n\n8. 点击 `确定`。`Power BI Desktop` 将连接到服务器并显示`导航器`对话框，其中包含您有权限在所选服务器上查看的数据库中的所有表和视图。在某些情况下，您可能会看到一个对话框，提示数据源不支持加密。如果您对未加密的连接感到满意，请点击该对话框上的\
  \ `确定` 按钮。\n9. 勾选您要加载的表的复选框。最近选定的数据集的数据会显示在`导航器`对话框的右侧，如图 3-4 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig5_HTML.jpg](img/370912_3_En_3_Fig5_HTML.jpg)\n\
  \n**图 3-5** 显示数据加载进度的加载对话框\n\n10. 点击 `加载`。\n11. 在加载数据期间，`Power BI Desktop` 将显示`加载`对话框，并显示每个选定表的加载进度。您可以在图\
  \ 3-5 中看到这一点。\n12. 当您点击 `确定` 后，`Power BI Desktop` 窗口将打开，并在`报表`窗口的`字段`列表中显示您选定的表。\n\
  \n**提示**\n\n在选择多个表或视图时，您只能在`导航器`对话框中看到单个数据源的内容。但是，您只需点击表或视图的名称，即可预览任何选定的数据源（甚至任何未选定的数据源）的内容。这不会影响您要加载到\
  \ `Power BI Desktop` 中的选定表和视图的选择。\n\n由于这与上一章中从 Access 加载数据的方式非常相似，我想您现在已经开始掌握如何使用数据库源了。再次强调，`导航器`对话框是一种简单高效的选择要在报表和仪表板中使用的数据集的方式。\n\
  \n**注意**\n\n如果您愿意，可以输入服务器 IP 地址来代替服务器名称。如果同一台服务器上有多个 SQL Server 实例，则需要添加一个反斜杠和实例名称。此类详细信息可从企业数据库管理员（DBA）处获取。\n\
  \n#### 自动加载相关表\n\n关系型数据库几乎总是由许多相互依赖的表组成的复杂结构。事实上，您通常需要加载多个表才能获取所需的所有数据。\n\n要知道选择哪些表并不总是那么容易。`Power\
  \ BI Desktop` 试图通过自动检测源数据库中表之间存在的链接来帮助您；这样，您可以快速隔离那些被设计为协同工作的表集合。\n\n要查看一组相关的表，请执行以下操作：\n\
  \n1. 按照上一节所述连接到源数据库。\n2. 在`导航器`对话框中，点击包含您需要的数据的表。\n3. 点击“选择相关表”按钮。\n\n数据库中与您在`导航器`对话框中选择的表相关联的任何表都会被选中。当然，您可以取消选择任何您不需要的表。更重要的是，您可以点击选定表的名称来查看其内容。\n\
  \n**注意**\n\n有时您需要依次选择多个表并点击“选择相关表”，以确保 `Power BI Desktop` 会选择支持您分析所需的所有表。\n\n####\
  \ 数据库选项\n\n关系型数据库的世界——幸运或不幸的是——比文件或 MS Access 的世界稍微复杂一些。因此，关于将数据库用作数据源，特别是如何连接到数据库，有一些说明需要补充。\n\
  \n首先，让我们介绍与服务器的初始连接。相关选项在表 3-3 中进行了解释。\n\n**表 3-3** 数据库连接选项\n\n| 选项 | 说明 |\n| ---\
  \ | --- |\n| 服务器 | 您无法通过浏览找到服务器，需要键入或粘贴服务器名称。如果服务器有实例名称，则需要输入服务器和实例。如果您在企业环境中工作，您的\
  \ IT 部门可以提供此信息。 |\n| 数据库 | 如果您知道数据库名称，则可以在此处输入（或粘贴）。这可以限制`导航器`对话框中可用表的数量，并使查找正确的表或视图更容易。\
  \ |\n| SQL 语句 | 您可以输入一段有效的 T-SQL 代码片段（或一个存储过程，或一个表值函数），用于从数据库返回数据。 |\n\n这些选项可能需要稍加解释。那么，让我们逐一分析。\n\
  \n\n\n#### 服务器连接\n\n你必须清楚知晓要连接的数据库的确切连接字符串，这一点至关重要。连接字符串可能包含以下内容：\n\n-   数据库服务器名称。\n\
  -   数据库服务器名称、反斜杠和实例名称（如有）。\n-   数据库服务器 IP 地址。\n-   数据库服务器 IP 地址、反斜杠和实例名称（如有）。\n\
  -   如果 SQL Server 实例使用自定义端口，则必须在服务器名称末尾添加逗号和端口号。这不可避免地需要咨询企业数据库管理员。\n-   如果你在自己的电脑上运行单个\
  \ SQL Server 实例，则可以使用名称 `localhost`（或一个点）来指代本地服务器。\n\n> **注意：** 数据库实例是一个独立的 SQL\
  \ Server 服务，与同一物理或虚拟服务器上的其他服务并行运行。要成功连接，你始终需要同时提供服务器和此实例名称（如有）。你也可以根据需要指定超时时间。\n\
  \n大多数 SQL Server 实例托管着许多数据库。有时这些数据库可能成百上千。有时你不可避免地会忘记要连接到哪个数据库。幸运的是，Power BI Desktop\
  \ 允许你浏览有权访问的服务器上的数据库。为此，请执行以下操作：\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig6_HTML.jpg](img/370912_3_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6** — 选择数据库时的导航器对话框\n\n1.  在 Power BI Desktop 功能区中，单击 `Get Data` 按钮底部的小三角，然后单击\
  \ `SQL Server`。将显示 SQL Server 数据库对话框。\n2.  在 `Server` 文本框中输入服务器名称，然后单击 `OK`。*不要*输入数据库名称。导航器窗口打开并显示所有可用的数据库，如图\
  \ 3-6 所示。当然，实际内容取决于你正在连接的服务器。\n\n从图 3-6 中可以看到，如果单击数据库左侧的小三角，则可以看到在此数据库中你可以访问的所有表和视图。虽然这在查找你想要的表或视图时可能意味着有过多选择，但这仍然是一种提醒你所需数据集名称的便捷方式。\n\
  \n> **提示：** 你在企业服务器上实际能看到的数据库取决于你被授予的权限。如果你看不到某个数据库，则需要与数据库管理员沟通以解决任何权限问题。\n\n####\
  \ 在导航器中搜索数据库、表和视图\n\n如果你被导航器对话框左侧面板中出现的海量表或视图弄得不知所措，则可以使用导航器的内置搜索功能来帮助缩小潜在数据源的范围。\n\
  \n##### 搜索数据库\n\n要隔离特定的数据库，请执行以下操作：\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig7_HTML.jpg](img/370912_3_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7** — 使用导航器搜索功能查找数据库\n\n1.  执行前面“SQL Server”部分中的步骤 1 和 2，*不*指定数据库连接到 SQL\
  \ Server 实例。\n2.  在导航器对话框的 `Search` 框中，输入你确定在要查找的表或视图名称中包含的少量字符。例如，在我的服务器上输入 `US`\
  \ 会得到如图 3-7 所示的结果。\n\n##### 搜索表\n\n如果你正在搜索表，请执行以下操作：\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig8_HTML.jpg](img/370912_3_En_3_Fig8_HTML.jpg)\n\
  \n**图 3-8** — 使用导航器搜索功能查找表\n\n1.  展开要搜索特定表的任何数据库。\n2.  在导航器对话框的 `Search` 框中，输入你确定在要查找的表或视图名称中包含的少量字符。例如，在我的服务器上输入\
  \ `cust` 会得到如图 3-8 所示的结果。\n\n搜索对象时，你可以输入大写或小写文本（在大多数 SQL Server 安装中），并且该文本可以出现在表或视图名称的任何位置——不限于名称的开头。每输入一个字符，潜在匹配项的列表就会越来越短。一旦找到你要找的数据集，只需按照前面所述继续操作即可将数据加载到\
  \ Power BI Desktop 中。\n\n如果你的搜索没有返回任何视图中你期望的表子集，只需单击 `Search` 框右侧的叉号即可。这会取消搜索并显示所有可用的表，同时清除\
  \ `Search` 框。\n\n如果你不确定是否看到了数据库中的所有表和视图，请单击 `Search` 框右下角的小图标（看起来像带有两个绿色循环箭头的小页面）。这是\
  \ `Refresh` 按钮，用于刷新与数据库的连接并显示你有权查看的所有表和视图。最后，值得注意的是，筛选表功能也可应用于 Excel 表、工作表和命名区域。这再次证明了统一的导航器界面如何有助于最大限度地减少掌握\
  \ Power BI Desktop 时的学习曲线。\n\n> **注意：** SQL Server 数据库也可以使用 `DirectQuery` 选项进行访问。此技术将在下一章解释。\n\
  \n#### 数据库安全\n\n请记住，数据库的设计是极其安全的。因此，你只能看到授权你访问的服务器、数据库、表和视图。你可能需要与 IT 部门沟通，以确保你拥有所需的权限；否则，你要查找的表可能就在数据库中，但对你来说仍是不可见的。\n\
  \n> **提示：** 如果首次尝试连接到 SQL Server 时遇到连接错误，只需单击 `Edit` 按钮返回 Microsoft SQL 数据库对话框并更正任何错误。这可以避免从头开始。\n\
  \n\n##### 使用 SQL 语句\n\n如果使用关系型数据库（如 SQL Server）作为数据源有什么缺点的话，那就是数据库中存储的数据量——即使只在一个表中——也可能庞大到令人望而生畏。幸运的是，在加载数据之前，你可以利用\
  \ SQL Server 的所有资源来筛选 Power BI Desktop 所使用的数据。这样一来，你就不必在开始分析数据之前，冒着被海量信息淹没的风险加载整个数据表了。\n\
  \n以下是可用于扩展 SQL Server 与 Power BI Desktop 之间协作的 SQL Server 技术：\n\n*   `SQL SELECT`\
  \ 语句\n*   存储过程\n*   表值函数\n\n不可否认，这些都是相当技术性的解决方案。事实上，如果你不是数据库专家，你很可能需要 IT 部门的帮助才能使用这些选项来访问服务器中的数据。尽管如此，还是值得快速了解一下这些技术，以备现在或将来使用。\n\
  \n以上任何选项都可以从 SQL Server 数据库对话框中应用。以下是一个使用 `SELECT` 语句从数据库表中筛选数据的示例：\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig9_HTML.jpg](img/370912_3_En_3_Fig9_HTML.jpg)\n\
  \n**图 3-9** 使用 SQL 选择数据库数据\n\n1.  在 Power BI Desktop 功能区的“`获取数据`”按钮底部，点击小三角形，然后点击“`SQL\
  \ Server`”。将会出现“SQL Server 数据库”对话框。\n2.  输入服务器名称和数据库名称。\n3.  点击“`高级选项`”左侧的三角形。这将打开一个文本框，你可以在其中输入\
  \ SQL 命令。\n4.  输入你想要应用的 SQL 命令。在本例中，命令为 `SELECT CountryName, MakeName, ModelName,\
  \ Cost FROM Data.AllSales ORDER BY CountryName`。对话框将如图 3-9 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig10_HTML.jpg](img/370912_3_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10** 使用 SQL 语句选项选择的数据库数据\n\n5.  点击“`确定`”。可能会出现“`凭据`”和“`加密`”对话框。最终会像图 3-10\
  \ 那样，在一个对话框中显示相应数据的样本。\n6.  点击“`加载`”或“`转换数据`”以继续数据加载过程。或者，你也可以点击“`取消`”并开始另一个不同的数据加载。\n\
  \n**提示：** 在输入自定义 SQL 语句时（或者在使用存储过程时，如下一节所述），最好在步骤 3 中指定数据库名称。如果你未提供数据库名称，则必须在 SQL\
  \ 查询中使用由三部分组成的表示法。也就是说，你必须在查询中使用的*每个*表名的架构和表名之前，加上数据库名称和一个句点。\n\n##### SQL Server\
  \ 中的存储过程\n\n使用存储过程或函数从 SQL Server 返回数据时，也遵循相同的原则。你将始终使用“`SQL 语句`”选项来输入将返回数据的命令。只需记住，要调用\
  \ SQL Server 存储过程或函数，你需要在“Microsoft SQL 数据库”对话框中输入以下元素：\n\n*   **服务器**：`<你的服务器名称>`\n\
  *   **数据库**：`<数据库名称>`\n*   **SQL 语句**：`EXECUTE`（或 `EXEC`）`<输入架构（如果有的话，后跟句点）和存储过程名称，后跟任何参数>`\n\
  \n这样，无论是你自己还是你的 IT 部门，都可以创建复杂且安全的方式，允许将公司数据库中的数据读入 Power BI Desktop。\n\n为了实际演示，以下是一个使用\
  \ SQL Server 存储过程仅返回可用数据子集的示例。该存储过程名为 `pr_DisplayUKClientData`，应用方式如下：\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig11_HTML.jpg](img/370912_3_En_3_Fig11_HTML.jpg)\n\
  \n**图 3-11** 使用 SQL 选择数据库数据\n\n1.  在 Power BI Desktop 功能区的“`获取数据`”按钮底部，点击小三角形，然后点击“`SQL\
  \ Server`”。将会出现“SQL Server 数据库”对话框。\n2.  输入服务器名称和数据库名称。\n3.  点击“`高级选项`”左侧的三角形。这将打开一个文本框，你可以在其中输入\
  \ SQL 命令。\n4.  输入你想要应用的 SQL 命令。在本例中，命令为 `EXECUTE dbo.pr_DisplayUKClientData`。对话框将如图\
  \ 3-11 所示。\n5.  点击“`确定`”。相应数据的样本将返回到“`导航器`”。\n6.  点击“`加载`”或“`编辑`”以继续数据加载过程。或者，你也可以点击“`取消`”并开始另一个不同的数据加载。\n\
  \n此示例中返回的数据仅是由存储过程从可用数据中选出的一个子集。你需要知道，存储过程可以对源数据执行多种任务。这些任务可以包括选择、排序和清理数据。\n\n存储过程通常需要在过程名称之后添加*参数*。在\
  \ Power BI 中执行存储过程时，这是完全允许的。示例如下：\n\n```\nEXECUTE dbo.pr_DisplayUKClientData 2020\n\
  ```\n\n需要记住——并传达给 IT 部门——的关键点是，Power BI 期望的 SQL 是源数据库所使用的 SQL 方言。因此，对于 SQL Server\
  \ 来说，这意味着使用 T-SQL。实际上，这个 SQL 语句成为了一条“直通”查询，由底层数据库直接解释。\n\n**注意：** SQL 语句或存储过程只能以*单个表*的形式返回数据。不可否认，这个表可能包含来自源数据库中多个底层表或视图的数据，但筛选源数据将阻止\
  \ Power BI Desktop 将来自多个表的数据作为单独的查询加载。因此，你可能需要创建多个查询，而不是单个加载查询，才能从数据源中一组连贯的表中获取数据。\n\
  \n\n\n## Oracle 数据库\n\n当今企业市场中活跃着许许多多的数据库供应商。其中最具主导地位的供应商，大概非 Oracle 莫属。虽然我此前使用了\
  \ Microsoft 数据源来开启对如何使用 `Power BI Desktop` 连接数据库的探索之旅，但如果不解释如何访问其他供应商的数据库，那将是我的失职。\n\
  \n所以，现在是时候向您展示 `Power BI Desktop` 究竟有多么开放了。它并不局限于 Microsoft 数据源——远非如此。事实上，使用其他供应商的数据库作为分析报告的数据源同样简单。举个例子，让我们看看如何将\
  \ Oracle 数据加载到 `Power BI Desktop` 中。\n\n安装和配置 Oracle 数据库可不是一项简单的任务。因此，我不会提供 Oracle\
  \ 示例数据库，而是留给您自行探索：要么去发现一个您可以连接的企业数据库，要么，更推荐的做法是，查阅许多讲解如何设置自己的 Oracle 数据库并安装可用示例数据的优秀资源。\n\
  \n请注意，连接到 Oracle 需要在运行 `Power BI Desktop` 的计算机上安装 Oracle 客户端软件。这本身也可能配置起来很复杂。因此，如果您计划将\
  \ Oracle 数据与 `Power BI Desktop` 一起使用，可能需要向企业 IT 资源寻求帮助。\n\n如果您足够勇敢，可以使用以下 URL 查找\
  \ Oracle 客户端软件。对于 32 位版本的 `Power BI Desktop`，您可以尝试使用以下链接下载并安装 32 位 Oracle 客户端：\n\
  \n```\nwww.oracle.com/technetwork/topics/dotnet/utilsoft-086879.html\n```\n\n对于\
  \ 64 位版本的 `Power BI Desktop`，请使用以下链接下载并安装 64 位 Oracle 客户端：\n\n```\nwww.oracle.com/technetwork/database/windows/downloads/index-090165.html\n\
  ```\n\n在本书付印时，这两个链接均有效。\n\n如果您需要检查正在使用的 `Power BI Desktop` 版本（32 位或 64 位），请单击 `文件`\
  \ ➤ `帮助` ➤ `关于`。您将看到一个对话框，告知您正在使用的版本。\n\n因此，假设您有一个可用的 Oracle 数据库（并且知道服务器名称或 SID\
  \ 以及有效的用户名和密码），以下步骤将展示如何从该特定源加载数据到 `Power BI Desktop` 中。在此示例中，我将使用通常随示例数据库一起安装的标准\
  \ Oracle 示例数据。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig12_HTML.jpg](img/370912_3_En_3_Fig12_HTML.jpg)\n\
  \n**图 3-12** 连接到 Oracle 数据库\n\n1.  打开一个新的 `Power BI Desktop` 应用程序。\n2.  在 `Power\
  \ BI Desktop` 的“开始”功能区中，单击 `获取数据`。\n3.  在 `获取数据` 对话框中，单击左侧的 `数据库`。\n4.  单击右侧的 `Oracle\
  \ 数据库`。对话框将如图 3-12 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig13_HTML.jpg](img/370912_3_En_3_Fig13_HTML.jpg)\n\
  \n**图 3-13** Oracle 数据库对话框\n\n5.  单击 `连接`。将出现 Oracle 数据库对话框。\n6.  在 `服务器` 文本框中输入服务器名称。这将是您的\
  \ Oracle 服务器或您的组织使用的某个 Oracle 服务器资源的名称。\n7.  单击 `导入` 按钮。对话框将如图 3-13 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig14_HTML.jpg](img/370912_3_En_3_Fig14_HTML.jpg)\n\
  \n**图 3-14** Oracle 数据库安全对话框\n\n8.  单击 `确定`。将出现 Oracle 数据库安全对话框。假设您未被授权使用 Windows\
  \ 登录名连接到数据库，请单击对话框左侧的 `数据库`。\n9.  输入允许您登录 Oracle 的用户名和密码。您可以在图 3-14 中看到此对话框。\n\n\
  ![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig15_HTML.jpg](img/370912_3_En_3_Fig15_HTML.jpg)\n\
  \n**图 3-15** 使用 Oracle 数据的导航器对话框\n\n10. 单击 `连接`。`Power BI Desktop` 将连接到服务器，并显示 `导航器`\
  \ 对话框，其中包含您在所选服务器上拥有权限查看的所有表与视图。在某些情况下，您可能会看到一个对话框，提示数据源不支持加密。如果您接受未加密的连接，请单击此对话框的\
  \ `确定` 按钮。\n11. 展开 `HR` 文件夹。这是一个标准 Oracle 示例模式，可能已安装在您的 Oracle 实例上。如果没有，您将必须选择另一个模式。勾选您感兴趣的表对应的复选框。最近选择的表的数据会显示在\
  \ `导航器` 对话框的右侧，如图 3-15 所示。\n12. 单击 `加载`。当您单击 `确定` 后，`Power BI Desktop` 窗口将打开，并在\
  \ `报表` 窗口的 `字段` 列表中显示您选择的表。如果您已经按照本章前面的示例从 `SQL Server` 加载了数据，您可能会发现这两种技术有很多共同之处。事实上，使用\
  \ `Power BI Desktop` 的一大优点就是，从不同数据源加载数据遵循大致相似的方法，并使用许多相同的步骤和对话框。对于数据库来说尤其如此，无论是什么数据库，其步骤几乎完全相同。\n\
  \n当然，没有两个数据库是完全相同的。因此，您可以连接到 Oracle 实例（或服务器），但不能像在 `SQL Server`（或 Sybase，例如）中那样选择数据库。同样地，Oracle\
  \ 使用模式来划分和组织数据表，而 `SQL Server` 则使用数据库。尽管如此，`Power BI Desktop 导航器` 总是将数据组织成文件夹层次结构，以便您能够清晰、简单且直观地查看数据结构，无论底层数据库是什么。\n\
  \n> **注意：** 也可以使用 `DirectQuery` 选项访问 Oracle 数据库。此技术将在下一章中解释。\n\n\n\n### 其他关系型数据库\n\
  \n本章开头的表 3-1 列出了本书付印时 Power BI Desktop 可以连接的关系型数据库。可以想见，自本书出版以来，该列表可能已经有所增加。但好消息是，你很可能不需要更多信息就能连接到任何可用作数据源的数据库。简而言之，如果你知道如何连接其中一个，那么你很可能也能连接其余任何一个。\n\
  \n因此，我不会用大量篇幅来重复介绍如何从十几个或更多关系型数据库中获取数据，这些说明实际上大同小异。相反，我建议你直接尝试使用本章为 Oracle 和 SQL\
  \ Server 学到的技术进行连接。\n\n不过请注意，要连接到关系型数据库，你必然需要了解以下详细信息：\n\n- 服务器名称\n- 数据库名称（可能）\n\
  - 有效的用户名（取决于已实施的安全策略）\n- 你所连接用户的有效密码（这也取决于已实施的安全策略）\n\n然而，如果你拥有这些要素，就没什么能阻止你使用一系列企业数据源作为使用\
  \ Power BI Desktop 进行分析的基础。当然，你需要拥有所有必要的权限才能访问数据库及其包含的数据。\n\n另外值得一提的是，连接 DB2、MySQL、PostgreSQL、Sybase、IBM\
  \ Informix、IBM Netezza、SAP HANA 或 Teradata，不仅需要数据库管理员授予你必要的权限，还需要你的电脑上已安装连接软件（称为驱动程序或提供程序）。鉴于这些要求的“企业”性质，直接与你的\
  \ IT 部门沟通，以便在你的企业 IT 环境中完成此设置可能会有所帮助。\n\n一种判断连接特定数据库所需的软件是否已安装的方法是，从“获取数据”对话框的可用列表中选择该数据库。如果驱动程序未安装，你将看到类似图\
  \ 3-16 所示的警告。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig16_HTML.jpg](img/370912_3_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n缺失驱动程序警报\n\n点击“了解更多”链接将带你进入缺失驱动程序的下载页面。但请注意，在某些情况下，配置数据提供程序不仅需要专业知识，还需要在安装驱动程序的计算机上拥有访问权限。\n\
  \n### Microsoft SQL Server Analysis Services 数据源\n\nAnalysis Services 数据库是一种数据仓库技术，可以包含为支持决策而优化的大量数据。SSAS\
  \ 多维数据集（这些数据库也被称为此名称）由事实（度量值或值）和维度（描述性属性）组成。\n\n实际上——并向数据仓库纯粹主义者致歉——SSAS 多维数据集本质上就是一个巨大的数据透视表。所以，如果你在\
  \ Excel 中使用过数据透视表，那么你就已经准备好使用 Power BI Desktop 中的数据仓库源了。\n\n**注意**  \n在本节中，我将解释如何访问*多维*（基于磁盘的）SSAS\
  \ 数据仓库。我将在下一节解释*表格型* SSAS。\n\n如果你的工作区使用 Analysis Services 数据库，可以通过执行以下步骤进行访问：\n\n\
  ![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig17_HTML.jpg](img/370912_3_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\n连接到 SSAS（多维）数据库\n\n1. 在 Power BI Desktop 功能区中，单击 **获取数据** ➤ **更多**。在“获取数据”对话框左侧单击\
  \ **数据库**，然后在“获取数据”对话框中选择 **SQL Server Analysis Services 数据库**。\n2. 单击 **连接**。将出现“SQL\
  \ Server Analysis Services 数据库”对话框。\n3. 输入 Analysis Services 服务器名称和数据库（或“多维数据集”）名称。我在此处使用的数据库名为\
  \ `CarSalesOLAP`；你需要指定你自己的 SSAS 数据库名称。无论如何，你需要使用你自己的 SSAS 服务器名称。对话框将类似于图 3-17 所示。\n\
  \n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig18_HTML.jpg](img/370912_3_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\nSQL Server Analysis Services 凭据对话框\n\n1. 单击 **确定**。如果这是你第一次连接到该多维数据集，将出现“访问\
  \ SQL Server Analysis Services”对话框，以便你可以定义用于连接到 Analysis Services 数据库的凭据，如图 3-18\
  \ 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig19_HTML.jpg](img/370912_3_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n从 SSAS 多维数据集中选择属性和度量值\n\n1. 接受或更改凭据，然后单击 **连接**。将出现“导航器”对话框。\n2. 展开对话框左侧窗格中的文件夹。这样，你就可以查看数据仓库中包含的所有事实表和维度。\n\
  3. 选择要加载的事实表、维度，甚至仅选择维度元素和度量值。对话框将类似于图 3-19。\n4. 单击 **加载**。Power BI Desktop 窗口将打开，并在“报表”窗口的“字段”列表中显示你选择的度量值和属性。\n\
  \n**注意**  \n如果在第 3 步中没有输入多维数据集（数据库）名称，那么“导航器”对话框将显示 SSAS 服务器上所有可用的多维数据集。在此处，你可以深入查看你感兴趣的多维数据集以查询所需数据。\n\
  \nSSAS 多维数据集可能非常庞大。它们可能包含数十个维度、许多事实表以及数以千计的度量值和属性。理解多维数据集及其工作原理超出了本书的范围。尽管如此，重要的是要理解，对于\
  \ Power BI Desktop 而言，多维数据集只是另一种数据源。这意味着你可以极具选择性地加载多维数据集的元素到 Power BI Desktop，并且只加载分析所需的元素。你可以加载整个维度，也可以只加载几个属性，就像你可以加载整个事实表或只加载选定的度量值一样。\n\
  \n**注意**  \n你可以通过展开“SQL Server Analysis Services 数据库”对话框中的 **MDX** 或 **DAX** 查询（可选）项来过滤从\
  \ SSAS 多维数据集加载的数据。然后，你可以在单击 **确定** 之前，在出现的框中输入 MDX 查询。请注意，“经典”（基于磁盘的）SSAS 多维数据集使用以\
  \ MDX 编写的查询——这是一种被认为不易学习的专业语言。好消息是，如果 Analysis Services 专家正确设置了多维数据集，你可以在“查询编辑器”中看到\
  \ SSAS 显示文件夹。\n\n#### Analysis Services 多维数据集工具\n\nAnalysis Services 数据源允许你以其他数据源不具备的方式调整源元素的选择。本质上，你拥有两个额外的选项：\n\
  \n- **添加项目**\n- **折叠列**\n\n\n\n##### 添加项目\n\n使用 SSAS 数据源时，你可以随时添加在初始连接时忘记或认为不需要的任何属性或度量值。\n\
  \n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig20_HTML.jpg](img/370912_3_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20：多维数据集工具\n\n1. 在 Power BI Desktop 中，单击 `Edit Queries` 按钮。将显示 Power BI Desktop\
  \ 查询编辑器窗口。假设只有一个查询，将出现“管理”功能区，如图 3-20 所示。否则，请单击你之前建立的 SSAS 查询。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig21_HTML.jpg](img/370912_3_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21：`Add Items` 对话框\n\n2. 在“管理”功能区中，单击 `Add Items` 按钮。将出现 `Add Items` 对话框。\n\
  \n3. 展开任意度量值组，并选择你要添加的所有度量值和属性，如图 3-21 所示。\n\n4. 单击 `OK`。\n\n5. 在 Power BI Desktop\
  \ 查询编辑器中，激活“开始”功能区，并单击 `Close & Apply`。\n\n你所做的任何更改都会反映在数据中，所选度量值和属性将作为新列添加到数据集右侧。\n\
  \n> **注意：** Power BI Desktop 查询不会检测你添加的新度量值和属性是否已存在于数据集中。因此，如果你第二次添加某个元素，它将在查询中出现*两次*。\n\
  \n##### 折叠列\n\n执行以下操作可从数据源中移除不再需要的任何列（这可以加速数据刷新）：\n\n1. 在“查询”窗格中，单击你之前建立的 SSAS 查询。（此连接的示例数据将显示在“查询”窗口中央——这是查询编辑器窗口的另一个名称。）将出现“管理”功能区。\n\
  \n2. 在“管理”功能区中，单击 `Collapse Columns` 按钮。\n\n这些列将从与 SSAS 多维数据集的连接中移除，因此也会从 Power\
  \ BI Desktop 窗口右侧的“字段”列表中移除。它们也会从使用这些列的任何可视化对象中移除。\n\n> **注意：** 从 Power BI Desktop\
  \ 查询中移除列可能会对报表和仪表板产生严重的多米诺骨牌效应。因此，在移除它们时需要非常小心。\n\n#### SSAS 表格数据仓库\n\n上一节向你展示了如何连接到“经典”SQL\
  \ Server Analysis Services 多维数据集。然而，现在有两种类型的 SQL Server Analysis Services 数据仓库：\n\
  \n- “传统”维度多维数据集\n- “较新”的表格数据仓库\n\n随着越来越多的数据仓库（至少是基于 Microsoft 技术的数据仓库）使用较新的表格技术构建，花点时间了解如何将\
  \ Power BI Desktop 与这些数据源结合使用是值得的。实际上，连接到这两种数据仓库源所遵循的步骤几乎相同。然而，由于 Power BI 正迅速成为查询表格数据仓库的首选工具，花几分钟学习如何连接到\
  \ SSAS 表格（常简称为 SSAS 表格）无疑是值得的。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig22_HTML.jpg](img/370912_3_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22：连接到 SSAS（多维）数据库\n\n1. 在 Power BI Desktop 功能区中，依次单击 `Get Data` > `More`\
  \ > `Database`，然后在 `Get Data` 对话框中选择 `SQL Server Analysis Services database`。\n\n\
  2. 单击 `Connect`。将出现 `SQL Server Analysis Services database` 对话框。\n\n3. 输入 Analysis\
  \ Services 服务器名称和表格数据库名称（我们通常不称这些为多维数据集）。此处，数据库是我电脑上的 `CarSalesTabular`；你需要指定你自己的表格数据库名称。无论如何，你都需要使用自己\
  \ SSAS 服务器的名称。\n\n4. 单击 `Import`。\n\n5. 对话框将如图 3-22 所示。\n\n![../images/370912_3_En_3_Chapter/370912_3_En_3_Fig23_HTML.jpg](img/370912_3_En_3_Fig23_HTML.jpg)\n\
