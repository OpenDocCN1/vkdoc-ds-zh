- '# 引言


  商业智能（BI）已成为定义我们这个时代的热门词汇之一。其衍生概念——自助式商业智能，已被企业视为“圣杯”。管理者希望员工能在一瞬间提供洞见；用户只想快速完成工作。每个人都希望利用直观易用的工具，生成清晰、有力且准确的分析。


  微软在几年前推出第一版 Power BI Desktop 时，就认识到了这些趋势和需求。自发布以来，该产品已发展到令人难以辨认的程度。如今，它允许任何用户从几乎任何来源获取数据，并以前所未有的速度制作出令人惊艳的仪表板和引人注目的报告，从而吸引受众的注意力。利用这一快速演进的工具，任何用户都能以惊人的轻松度对数据进行切片和切块，然后添加指标、即时分析和关键绩效指标（KPI）来展现其洞见。最终，他们可以用它编织出一个能带来真正竞争优势的数据故事。


  本书展示了如何利用微软 Power BI Desktop 打造引人注目的商业智能。它教你如何将原始数据转化为清晰、准确且交互式的信息。本书旨在帮助你将自己的商业智能交付能力提升到一个新的水平。在
  24 章中，你将学习创建外观出色的可视化内容，并让受众在与你现在所能交付的、优雅且富有表现力的输出进行交互时备受启发。你将看到如何从广泛的内置及第三方可视化类型中进行选择，从而使你的信息总是得到增强。你还将发现如何在
  PC、平板电脑和智能手机上交付这些成果。最后，本书通过帮助你获取和准备底层数据来节省时间，而无需依赖 IT 部门为你清洗和结构化数据。


  Power BI Desktop 能让你的分析不言自明。本书将帮助你学习如何释放其巨大潜力。


  如果你愿意，可以通读全书，因为它被设计成一个循序渐进的教程，旨在帮助你学习 Power BI Desktop。然而，由于 Power BI Desktop 由多个相互依赖的
  BI 功能组成，本书被划分为多个章节组，分别聚焦于产品的不同领域。因此，如果你愿意，也可以专注于 Power BI Desktop 的个别领域，而无需采用线性方式阅读本书。


  *   第 1 章至第 6 章展示了如何连接到各种不同的数据源，并将这些数据导入 Power BI Desktop。

  *   第 7 章至第 12 章解释了如何转换和清洗数据，以便用于分析。

  *   第 13 章介绍了创建数据模型的艺术，你可以在此基础上构建交互式仪表板和报告。

  *   第 14 章至第 24 章带你领略 Power BI Desktop 提供的无数可能性，帮助你创建出色的报告和仪表板。这涵盖了表格、图表、地图、KPI
  以及许多其他类型的可视化元素。


  这是《Pro Power BI Desktop》的第三版。自第二版以来的短短几年间，Power BI Desktop 已发生了非凡的演变。因此，有必要推出新版本书籍，以更新原作中新增的所有令人兴奋的变化和扩展。事实上，微软一直保持、并且仍在保持的每月发布周期，证明了该公司致力于改进一款本已卓越的产品的决心。本书包含了截至
  2020 年 4 月添加的最新更新。


  本书附带一小套示例数据，用于创建全书中的示例。我意识到，对于一个能够处理数千万行数据的产品来说，使用这么小的数据集似乎有些矛盾，但我更倾向于使用一组易于理解的数据源，以便读者能够专注于学习的内容本身，而非数据本身。


  不可避免的是，一本书无法预见到并回答所有问题。尽管如此，我希望我已经回答了许多你可能遇到的自助式商业智能问题，并且——更重要的是——为你提供了方法和信心，以解决你在使用该产品解决实际问题时可能遇到的大部分
  Power BI Desktop 挑战。


  祝你在使用 Power BI Desktop 时好运，我真诚希望你在使用它时能像我写这本书时一样感到快乐。


  '
