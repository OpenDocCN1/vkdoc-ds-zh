  关于 `summary()` 的更多信息，可以在 R 提示符下输入 `?summary` 或 `?summary.''ext''`（其中 `ext` 是对象类的扩展名），或使用
  R Studio 中的“帮助”（Help）选项卡来获取。


  ## 一些模型函数：`anova()`、`coef()`、`effects()`、`residuals()`、`fitted()`、`vcov()`、`confint()`
  和 `predict()`


  虽然 `print()`、`plot()` 和 `summary()` 对于像 `lm` 和 `glm` 这样的模型类有特殊的方法，但这些函数也涵盖了许多其他类。函数
  `anova()`、`coef()`、`effects()`、`residuals()`、`fitted()`、`vcov()`、`confint()` 和 `predict()`
  是泛型函数，专为模型编写。


  在本节的示例中，我们使用以下线性模型：


  ```

  > set.seed( 69235 )

  > x=1:5

  > y = rnorm( 5 )

  > a.lm = lm( y~x )

  ```


  函数 `anova()` 在我的 OS X 系统上有 7 个方法，并返回模型的方差分析表。例如：


  ```

  > anova( a.lm )

  Analysis of Variance Table

  Response: y

  Df  Sum Sq Mean Sq F value Pr(>F)

  x          1 0.00198 0.00198  0.0052 0.9469

  Residuals  3 1.13477 0.37826

  ```


  函数 `coef()` 在我的 OS X 系统上有 6 个方法（包括 default 方法），并返回模型的系数。例如：


  ```

  > coef( a.lm )

  (Intercept)           x

  -0.71642237  0.01406824

  ```


  函数 `effects()` 在我的 OS X 系统上有 2 个方法（`lm` 和 `glm`），并返回模型的处理效应。例如：


  ```

  > effects( a.lm )

  (Intercept)           x

  1.50759648  0.04448769  0.81718478  0.55367470

  -0.40052873

  attr(,"assign")

  [1] 0 1

  attr(,"class")

  [1] "coef"

  ```


  函数 `residuals()` 在我的 OS X 系统上有 8 个方法（包括 default 方法）。该函数返回模型的残差。例如：


  ```

  > residuals( a.lm )

  1           2           3           4           5

  -0.41553118 -0.01699453  0.66935097  0.37440635 -0.61123162

  ```


  函数 `fitted()` 在我的 OS X 系统上有 5 个方法（包括 default 方法），并返回模型的拟合值。例如：


  ```

  > fitted( a.lm )

  1          2          3          4          5

  -0.7023541 -0.6882859 -0.6742176 -0.6601494 -0.6460812

  ```


  函数 `vcov()` 在我的 OS X 系统上有 8 个方法，并返回模型系数的估计方差-协方差矩阵。没有 default 方法。


  示例如下：


  ```

  > vcov( a.lm )

  (Intercept)           x

  (Intercept)   0.4160823 -0.11347699

  x            -0.1134770  0.03782566

  ```


  函数 `confint()` 在我的 Windows 系统上有 8 个方法（包括 default 方法）。该函数返回模型系数的置信区间。例如：


  ```

  > confint( a.lm )

  2.5 %    97.5 %

  (Intercept) -2.769242 1.3363968

  x           -0.604880 0.6330165

  ```


  函数 `predict()` 在我的 OS X 系统上有 16 个方法，并返回模型的预测值。对于某些类的对象，`predict()` 可以返回预测值的置信区间或预测区间。如果在
  `predict()` 中使用原始模型作为第一个参数，则区间是针对拟合值的。对于我们的模型 `a.lm` 以及查找拟合值的 95% 置信区间，示例如下：


  ```

  > predict( a.lm, interval="confidence" )

  fit       lwr       upr

  1 -0.7023541 -2.218462 0.8137533

  2 -0.6882859 -1.760336 0.3837640

  3 -0.6742176 -1.549543 0.2011074

  4 -0.6601494 -1.732199 0.4119005

  5 -0.6460812 -2.162189 0.8700263

  ```


  关于本节中函数的更多信息，可以在 R 提示符下输入 `?''function''` 或 `?''function.ext''`（其中 `function` 是函数名，`ext`
  是类的扩展名），或使用 R Studio 中的“帮助”（Help）选项卡来获取。


