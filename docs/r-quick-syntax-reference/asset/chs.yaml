- '# 引言


  R 是一种编程语言，为用户提供强大的数据和图形分析选项。R 既灵活又广泛。从两个数相加这样简单的任务，到拟合 ARIMA 模型这样复杂的任务，R 都能胜任数值计算。


  《R 快速语法参考》旨在为读者提供 R 的基本语法。例如，当模式不正确或逻辑测试不奏效时，R 用户常常会陷入困境。由于整个 R 包生态系统都使用相同且相当简单的语法，《R
  快速语法参考》为读者提供了必要的信息，帮助其摆脱困境，并运行和创建所有 R 函数与代码。


  R 语言基于 S 语言，S 是一种高级编程语言，主要由 Richard A. Becker、John M. Chambers 和 Allan R. Wilks
  于 1975 年在 AT&T 实验室开发。R 语言版本于 1993 年首次发布，由新西兰奥克兰大学的 [Ross Ihaka](http://en.wikipedia.org/wiki/Ross_Ihaka%2523Ross%2520Ihaka)
  和 [Robert Gentleman](http://en.wikipedia.org/wiki/Robert_Gentleman_%2528statistician%2529%2523Robert%2520Gentleman%2520%2528statistician%2529)
  开发。


  R 是开源软件，是一个 *GNU 项目*。作为开源代码，R 语言是免费的并且不断得到改进。R 统计计算基金会维护该程序，R 核心开发团队目前负责开发工作。针对特定分析技术的扩展包会经常添加。目前，R
  中有超过 10,000 个可用扩展包。大多数用户只会使用少数几个扩展包。在《R 快速语法参考》中，我们将讨论在命令提示符下使用 R。我们还将介绍集成开发环境 (IDE)
  RStudio。RStudio 由 [J.​J.​ Allaire](https://en.wikipedia.org/wiki/Joseph_J._Allaire%2523Joseph%2520J.%2520Allaire)
  创立，于 2011 年推出测试版，并于 2017 年推出正式版。RStudio 的首席科学家是 Hadley Wickham。


  本书介绍的是 R 的 S3 和 S4 版本——*S3* 和 S4 分别代表 S 语言的第三版和第四版，S 是 R 所基于的商业程序。这两个版本同时运行。尽管 S4
  版本与 S3 差别很大，但要使用 S4，必须了解 S3 的语法。而且 S3 本身仍然是一种强大、灵活的语言——这就是本书的由来。


  第一部分涵盖了 R 的基础知识。第 1 章描述了如何在 Windows、Mac 和 Linux 操作系统上下载并安装 R 和 RStudio，以及如何下载扩展包。由于为不同项目保留单独的文件夹非常有用，第
  1 章给出了从不同文件夹运行 R 和 RStudio 的说明。它还提供了更新 R 和 RStudio 程序本身的方法。


  第 2 章介绍了 R 提示符，给出了一个示例计算，并描述了 R 的三个组成部分——对象、运算符和赋值。我们还描述了 RStudio 的四个窗口以及 R 脚本是什么。第
  3 章涵盖了为对象分配名称，演示了允许您查看文件夹中对象的 `ls()` 函数，并讨论了 R 和 RStudio 中的运算符。


  第二部分描述了 R 对象。对象具有模式、类和类型。第 4 章列出了模式及其类型，并描述了其中的一些。它还展示了模式与类型的区别。第 5 章讨论了一些类，以及 S3
  和 S4 R 中类的区别。


  第三部分涵盖了函数。第 6 章首先列出了 R 中的 30 个默认扩展包，然后介绍了如何使用函数的说明。由于扩展包函数都有帮助页面，该章提供了如何在 R 和 RStudio
  中访问和使用函数帮助页面的说明。第 7 章描述了如何创建函数。第 8 章解释了如何运行函数——并详细介绍了参数列表。


  第四部分侧重于在 R 和 RStudio 中导入和导出数据，以及创建和操作某些类型对象的方法。第 9 章描述了导入数据的几种方法，提供了许多创建数据对象的函数，并讨论了一些随机数生成器。它给出了一个从
  Twitter 挖掘数据的示例。第 10 章给出了从 R 和 RStudio 导出数据的几种方法。包含一个匹配的导入和导出函数表格。第 11 章给出了许多作用于对象的函数——用于绑定对象、查找对象的描述性特征、为对象分配特征、以某种方式聚合对象或将函数应用于对象的部分。


  第五部分涵盖了流程控制命令和函数。第 12 章介绍了流程控制语句，第 13 章提供了它们的示例。第 14 章描述了两个流程控制函数并给出了示例。


  第六部分讨论了与格式化输出和输出结果相关的函数，考察了扩展包函数的结果以及一些默认扩展包的内容，并提供了一些使用 R 和 RStudio 的技巧。第 15 章给出了一些取整函数和一些用于从函数输出结果的函数。它还给出了一些根据函数操作对象的类而变化的函数，以及那些以文本或可视化方式汇总函数结果的函数。第
  16 章审视了 base、stats 和 graphics 扩展包的内容，并简要介绍了 datasets、grDevices、methods 和 utils 扩展包。第
  17 章描述了如何处理 R 中一些常见的烦恼。提供了更多关于函数输出的信息，还包括一个递归函数的示例以及一些使用 R 的建议。


  ## 致谢


  我要感谢综合 R 档案网络 (CRAN) 的 R 核心开发团队编写者。没有他们的帮助页面，这本书是无法写成的。我还要感谢 Apress 的编辑 Steve Anglin
  和 Matthew Moodie 对我的指导；以及我的丈夫 Clay Conard，感谢他在过去几个月里的支持和耐心。




  ### 关于作者


