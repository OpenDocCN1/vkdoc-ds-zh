  Number of factors: 2

  Test for independence of all factors:

  Chisq = 7.066, df = 8, p-value = 0.5295

  > a.ar = array( 1:8, c( 2, 2, 2 ) )

  > a.ar

  , , 1

  [,1] [,2]

  [1,]    1    3

  [2,]    2    4

  , , 2

  [,1] [,2]

  [1,]    5    7

  [2,]    6    8

  > summary( a.ar )

  Min. 1st Qu.  Median    Mean 3rd Qu.    Max.

  1.00    2.75    4.50    4.50    6.25    8.00

