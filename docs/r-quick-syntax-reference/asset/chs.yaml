  `pi`（数学常数 π）。这些常量的列表参见表 16-2。


  **表 16-2** R 中的内置常量


  | 常量 | 描述 |

  | --- | --- |

  | `LETTERS` | 26 个大写字母 |

  | `letters` | 26 个小写字母 |

