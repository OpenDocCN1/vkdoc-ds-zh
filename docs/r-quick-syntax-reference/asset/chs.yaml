- '# 第五部分 – 流程控制


  '
- '# 12. 流程控制


  流程控制语句用于重复执行一系列任务若干次，或根据逻辑对象来引导执行流程。对于那些在 FORTRAN 和 BASIC 时代开始编程的人来说，使用循环非常得心应手。在
  R 中，如果可能，更好的选择是使用数组和索引选择，而不是循环。使用索引比循环快得多。


  话虽如此，控制语句包括 `if`、`if/else`、`while`、`for` 和 `repeat`。它们有时是必需的，并且通常很有用。在本章中，我们给出了流程控制语句的语法。我们在第
  13 章中给出了流程控制使用的示例。


  ## 花括号“{}”和分号“;”


  花括号用于括起代码段。花括号可以与 `if`、`else`、`while`、`for` 和 `repeat` 流程控制语句一起使用，以界定控制语句要操作的代码段，无论是在函数内部还是在
  R 控制台中。


  花括号也可以在没有伴随流程控制语句的情况下直接用于 R 控制台。从左花括号开始，可以逐行输入代码语句。这些语句在输入右花括号之前不会执行。


  分号用于在一行中包含多个语句。一个语句要等到它前面的语句执行完毕后才会被求值。如果第一个语句是一个流程控制语句，后面跟着一个单一的代码语句，那么控制流程必须完成，第二个语句才会执行。然而，如果两个（或多个）语句被包含在流程控制语句后面的一对左、右花括号内，那么花括号内的所有语句将根据该流程控制语句一起执行。


  ## `if` 和 `if/else` 控制语句


  `if` 控制语句接受一个逻辑对象，如果该对象为真，则执行相应的代码。如果该对象不为真，则可以选择性地执行由 `else` 语句提供的另一段代码。


  该逻辑对象必须是可以强制转换为逻辑类型的对象。如果逻辑对象的长度大于 1，则仅使用该对象的第一个元素。


  `if` 语句可以采用以下形式：


  ```

  if (''逻辑对象'') ''单一代码语句''

  if (''逻辑对象'') ''单一代码语句'';''单一代码语句''

  if (''逻辑对象'') {''多个用分号分隔的代码语句''}

  if (''逻辑对象'') {

  ''多行代码语句''

  }

  ```


  这四种形式并未穷举所有可能的形式。在第二种形式中，即使逻辑对象为假，第二个语句也会执行，因为这两个语句没有被括在花括号中。


  如果逻辑对象为假，则可以选择使用 `else` 语句让 R 执行不同的代码。对于 `if` 和 `else` 这两个控制语句，下面给出了两种形式的示例：


  ```

  if (''逻辑对象'') ''单一代码语句'' else ''单一代码语句''

  if (''逻辑对象'') {

  ''多行代码语句''

  }

  else {

  ''多行代码语句''

  }

  ```


  同样，这两种形式并未穷举所有可能。如果没有 `else` 控制语句且逻辑对象为假，则与 `if` 语句关联的代码语句将被跳过。


  ## `while` 控制语句


  `while` 控制语句在一个逻辑条件为真时执行一个代码块。同样，该逻辑对象必须是可以强制转换为逻辑类型的对象。如果逻辑对象的长度大于 1，则仅使用该对象的第一个元素。


  该控制语句可以采用以下形式：


  ```

  while (''逻辑对象'') ''单一代码语句''

  while (''逻辑对象'') ''单一代码语句''; ''单一代码语句''

  while (''逻辑对象'') {''多个用分号分隔的代码语句''}

  while (''逻辑对象'') {

  ''多行代码语句''

  }

  ```


  同样，所示形式并未穷举所有可能的形式。请注意，对于第二种形式，第二个语句要等到 `while` 循环结束后才会执行，因为这两个语句没有被括在花括号中。




  '
- '# `for` 控制语句


  `for` 控制语句指示 R 按设定次数循环执行一段代码。根据循环条件，有多种方式可以实现循环。


  循环条件可以非常灵活。最简单的形式是：


  ```

  for (i in 1:n)

  ```


  其中，`i` 是一个从 `1` 索引到 `n` 的对象，`n` 是一个整数。


  通常，`for` 循环的流程控制语句语法如下：


  ```

  for (''索引变量'' in ''向量对象'')

  ```


  其中，`索引变量` 是一个在每次循环迭代中其值都会改变的变量，而`向量对象`包含了该`索引变量`所取的值。向量对象可以是任何能强制转换为向量的对象，包括 `list`
  和 `expression` 模式的对象。


  对象`索引变量`将依次取`向量对象`中的值。通常，索引变量会在 `for` 循环执行的代码语句中使用。


  注意，如果向量对象是在 `for` 语句内部使用函数 `seq()` 创建的，并且使用了 `seq()` 的参数 `along.with`（可以缩写为 `along`），那么
  `seq()` 给出的是 `along.with` 中元素的索引，而不是对象本身的值。


  `for` 循环的几种形式如下：


  ```

  for (''循环条件'') ''单条代码语句''

  for (''循环条件'') ''单条代码语句''; ''单条代码语句''

  for (''循环条件'') {''用分号分隔的多条代码语句''}

  for (''循环条件'') {

  ''多行代码语句''

  }


  再次强调，这四种形式并未穷尽所有可能的形式。在第二种形式中，分号后的代码要等到 `for` 循环结束后才会执行，因为这两条语句没有放在花括号内。


  根据 CRAN 关于流程控制的帮助页面，索引变量的值可以在 `for` 引用的代码语句中被改变，但在下一次循环开始时，它会恢复为变量的下一个索引值。循环结束时，`索引变量`的值是循环中该索引变量的最终值。


  ## `repeat` 控制语句


  `repeat` 流程控制语句会重复执行一段代码，直到达到一个停止点。这个停止点必须编程写入该段代码中。与 `while` 不同，`repeat` 的控制语句中不包含逻辑对象；与
  `for` 不同，其控制语句中也不包含循环索引。以下是 `repeat` 的两种形式：


  ```

  repeat {''一些用分号分隔的代码语句''}

  repeat {

  ''多行代码语句''

  }


  同样，这两种形式并未穷尽所有可能。使用 `repeat` 时可能产生无限循环，因此请谨慎使用。


  ## 语句 `break` 和 `next`


  语句 `break` 和 `next` 用于由某个流程控制器控制的代码段内的流程控制。


  `break` 语句告诉 R 离开 `for`、`while` 或 `repeat` 循环，或者离开 `if` 区块，然后跳转到该循环或区块之后的第一条语句。


  `next` 语句告诉 R 停止执行 `for`、`while` 或 `repeat` 循环中的代码语句，并从循环的开头重新开始——如果存在索引变量，则使用该变量的下一个值。


  ## 嵌套


  任何流程控制语句都可以嵌套在其他流程控制代码段中。为了清晰以及防止微妙的错误，在将一个流程控制段嵌套到另一个流程控制段时，应在所有层级使用花括号。


  此处介绍的关于流程控制的大部分信息都来自 CRAN 上关于流程控制的帮助页面，可以通过在 R 提示符下输入 `?"if"` 或使用 R Studio 中的“帮助”选项卡找到该页面。


  '
- "# 13. 流程控制示例\n\n本章提供了一些流程控制的示例，以及使用索引完成相同示例的方法。第一个示例使用了嵌套的 `for` 循环和 `if/else`\
  \ 语句。第二个示例使用了 `while` 语句。第三个示例是嵌套的 `for` 循环。第四个示例使用了 `for` 循环、`if` 语句和 `next` 语句。第五个示例是\
  \ `for` 循环、`repeat` 循环、`if` 语句和 `break` 语句。\n\n## 带 `if/else` 语句的嵌套 `for` 循环\n\n\
  在此示例中，我们基于 `if/else` 测试对矩阵进行逐元素替换。\n\n首先，生成一个两行五列的矩阵 `x`，并显示该矩阵。接着，两个 `for` 循环遍历\
  \ `x` 的行和列索引。在每个循环周期，一组 `if/else` 语句测试矩阵中的元素是否大于五。\n\n如果元素的值大于五，则将该元素的值替换为一。否则，控制权转移到\
  \ `else` 语句。在 `else` 语句中，该元素的值被替换为零。\n\n最后，显示结果矩阵。示例如下：\n\n```\n> x = matrix( 1:10,\
  \ 2, 5 )\n> x\n     [,1] [,2] [,3] [,4] [,5]\n[1,]    1    3    5    7    9\n[2,]\
  \    2    4    6    8   10\n> for ( i in 1:2 ) {\n+   for ( j in 1:5 ) {\n+    \
  \ if ( x[i,j]>5 ) x[i,j]=1\n+     else x[i,j]=0\n+   }\n+ }\n> x\n     [,1] [,2]\
  \ [,3] [,4] [,5]\n[1,]    0    0    0    1    1\n[2,]    0    0    1    1    1\n\
  ```\n\n## 使用索引\n\n不使用循环完成相同的替换会更简单。首先，生成并显示矩阵 `x`。然后，根据原始值将 `x` 中的元素设置为新值。注意，替换执行的顺序很重要，因为一小于六。最后，显示结果矩阵。示例如下：\n\
  \n```\n> x = matrix( 1:10, 2, 5 )\n> x\n     [,1] [,2] [,3] [,4] [,5]\n[1,]    1\
  \    3    5    7    9\n[2,]    2    4    6    8   10\n> x[ x <= 5 ] = 0\n> x[ x\
  \ > 5 ] = 1\n> x\n     [,1] [,2] [,3] [,4] [,5]\n[1,]    0    0    0    1    1\n\
  [2,]    0    0    1    1    1\n```\n\n在我的电脑上，使用一个 43,830 行、35 列的矩阵，两种方法耗时均不到一秒。\n\
  \n## 一个 `while` 循环\n\n在此示例中，使用 `while` 循环来找出，对于一组在 0 到 1 之间均匀随机分布的变量，其和超过五需要多少次迭代。\n\
  \n首先为随机数生成器设置种子，并将 `n` 和 `x` 设为零，然后启动一个 `while` 循环来递增 `n` 并对 `x` 求和。每次迭代时，使用均匀分布的随机数生成器生成一个数并加到\
  \ `x` 上。当 `x` 大于五时，循环停止。打印出 `n` 和 `x` 的值。示例如下：\n\n```\n> set.seed( 129435 )\n> n=0\n\
  > x=0\n> while ( x < 5 ) {\n+   n = n + 1\n+   x = x + runif( 1 )\n+ }\n> n\n[1]\
  \ 7\n> x\n[1] 5.179325\n```\n\n## 使用索引\n\n要使用索引完成相同的任务，首先生成一个长度超出预期求和的均匀随机变量向量。\n\
  \n然后，使用函数 `cumsum()`（它沿着向量创建累积和）来找出何时总和大于五。由于 `x` 的元素总是大于零，因此沿着向量的累积和总是增加的。\n\n\
  接下来，使用函数 `length()` 查找累积和小于等于五的元素个数。然后，打印出 `n` 和 `x` 的值，其中 `x` 等于 `x[n]`。\n\n```\n\
  > set.seed( 129435 )\n> x = runif( 25 )\n> x = cumsum( x )\n> n = length( x[ x <=\
  \ 5 ] ) + 1\n> x = x[n]\n> n\n[1] 7\n> x\n[1] 5.179325\n```\n\n请注意，该示例的两部分中，随机数生成器都被设置为相同的种子值，因为生成了相同的前七个数字，所以两部分的结果是匹配的。\n\
  \n在我的电脑上，如果我将前面示例中的 5 替换为 1,000,000，将 25 替换为 3,000,000，使用索引的方法几乎是瞬间完成的，而使用循环的方法则大约需要\
  \ 5 秒。\n\n\n\n"
- '# 嵌套 `for` 循环


  有时，我们需要计算矩阵各列之间的差值。在此示例中，使用嵌套的 `for` 循环来查找这些差值。


  首先，生成一个包含两行四列的矩阵 `x`，并为它指定列名。接着，显示该矩阵。然后，生成一个包含两行六列的零矩阵 `xp`，用于存放差值结果，并为该矩阵指定空列名。


  接下来，将计数器 `k`（用于矩阵 `xp` 的列）设置为零。随着两个 `for` 循环的递增，`k` 在每个步骤中都会增加一。


  然后，运行这两个 `for` 循环。在循环中，用矩阵 `x` 中不同列之间的差值填充 `xp` 的元素。这两个循环遍历矩阵 `x` 的列，确保不会重复列组合，并且两列永远不会相同。在每一步中，根据
  `x` 中的名称为 `xp` 的列分配名称。


  最后，显示结果矩阵 `xp`。示例如下：


  ```

  > x = matrix( 1:8, 2, 4 )

  > colnames( x ) = paste( "c", 1:4, sep="" )

  > x

  c1 c2 c3 c4

  [1,]  1  3  5  7

  [2,]  2  4  6  8

  > xp = matrix( 0, 2, 6 )

  > colnames( xp ) = rep( "", 6 )

  > xp

  [1,] 0 0 0 0 0 0

  [2,] 0 0 0 0 0 0

  > k=0

  > for ( i in 1:3 ) {

  +   for ( j in (i+1):4 ) {

  +     k = k+1

  +     xp[,k] = x[,i]-x[,j]

  +     colnames( xp )[k] = paste( colnames(x)[i], "-",

  colnames(x)[j], sep="" )

  +   }

  + }

  > xp

  c1-c2 c1-c3 c1-c4 c2-c3 c2-c4 c3-c4

  [1,]    -2    -4    -6    -2    -4    -2

  [2,]    -2    -4    -6    -2    -4    -2

  ```


  请注意，`xp` 的列数等于 `p(p-1)/2`，其中 `p` 是 `x` 的列数。


  ## 使用索引


  要使用索引解决此问题，需要创建两个索引向量。


  首先，生成初始矩阵 `x`，为其指定列名并显示。然后，创建两个长度相同的索引集合 `ind.1` 和 `ind.2`。这两个集合中的相应索引永远不会相同，并且所有可能的组合都存在且仅出现一次。


  接下来，通过从第一个索引集合中的 `x` 列中减去第二个索引集合中的 `x` 列，来创建结果矩阵 `xp`。然后，使用 `paste()` 和两个索引集创建并分配
  `xp` 的列名。


  最后，显示矩阵 `xp`。示例如下：


  ```

  > x = matrix( 1:8, 2, 4 )

  > colnames( x ) = paste( "c", 1:4, sep="" )

  > x

  c1 c2 c3 c4

  [1,]  1  3  5  7

  [2,]  2  4  6  8

  > ind.1 = rep( 1:3, 3:1 )

  > ind.1

  [1] 1 1 1 2 2 3

  > ind.2 = numeric( 0 )

  > for( i in 2:4 ) ind.2 = c( ind.2, i:4 )

  > ind.2

  [1] 2 3 4 3 4 4

  > xp = x[,ind.1] - x[,ind.2]

  > colnames( xp ) = paste( "c", ind.1, "-c", ind.2, sep="" )

  > xp

  c1-c2 c1-c3 c1-c4 c2-c3 c2-c4 c3-c4

  [1,]    -2    -4    -6    -2    -4    -2

  [2,]    -2    -4    -6    -2    -4    -2

  ```


  请注意，使用 `for` 循环来创建第二个索引集。此外，在两个索引集中都重复了列索引。


  对于大型矩阵，第二种方法比第一种方法更快。在我的计算机上，使用两种方法对两个各有 43,830 行和 35 列的矩阵进行了列差值计算。两种方法都得到了相同的 43,830
  行乘 595 列的矩阵。循环方法耗时超过 1.0 分钟，而索引方法耗时不到 1.0 秒。


  ## `for` 循环、`if` 语句和 `next` 语句


  在此示例中，生成标准正态随机数并与 1.965 进行比较。仅保留小于或等于 1.965 的那些值。


  首先，将随机数生成器的种子设置为一个任意值。然后，将 `x` 设置为数值型的 `NULL` 值。在接下来的 `for` 循环中，进行 10,000 次迭代，每次迭代生成一个标准正态随机数。如果该数字大于
  1.965，则开始下一个循环。否则，将该数字添加到一个数值向量中。绘制最终向量的直方图。结果见图 13-1。示例如下：


  ```

  > set.seed( 69785 )

  > x = numeric( 0 )

  > for ( i in 1:10000 ) {

  +   x2 = rnorm( 1 )

  +   if ( x2>1.965 ) next

  +   x = c( x, x2 )

  + }

  > hist( x )

  > box()

  ```


  ![../images/323823_2_En_13_Chapter/323823_2_En_13_Fig1_HTML.jpg](img/323823_2_En_13_Fig1_HTML.jpg)


  图 13-1


  使用循环生成小于 1.965 的标准正态随机变量的直方图


  ## 使用索引


  使用索引要简单得多。首先，将随机数生成器种子设置为与上一个示例相同的值。接下来，生成长度为 10,000 的标准正态随机变量向量。然后，仅保留向量中小于或等于
  1.965 的那些值。最后，生成该向量的直方图。直方图如图 13-2 所示。示例如下：


  ```

  > set.seed( 69785 )

  > x = rnorm( 10000 )

  > x = x[ x <= 1.965 ]

  > hist( x )

  > box()

  ```


  ![../images/323823_2_En_13_Chapter/323823_2_En_13_Fig2_HTML.jpg](img/323823_2_En_13_Fig2_HTML.jpg)


  图 13-2


  使用索引生成小于 1.965 的标准正态随机变量的直方图


  请注意，由于种子相同并且使用了相同的 10,000 个数字，因此两个直方图相同。


  如果将上述示例中的 10,000 增加到 100,000，在我的计算机上，使用循环的方法大约需要 34 秒，而使用索引的方法需要不到 1 秒。




