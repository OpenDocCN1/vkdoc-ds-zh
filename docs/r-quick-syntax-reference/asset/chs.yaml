- '# 矩阵、数组和数据框


  `base` 包中有许多关于矩阵、数组和数据框的函数我们尚未涉及。其中部分函数包括：


  - `aperm()`，对数组进行维度置换

  - `rowsum()`，根据 `group` 变量设置的分组，对矩阵或数据框的行进行求和

  - `colMeans()`，返回数据框或矩阵的列均值，或返回数组从第一维度到指定维度的均值

  - `colSums()`，返回数据框或矩阵的列和，或返回数组从第一维度到指定维度的和

  - `rowMeans()`，返回数据框或矩阵的行均值，或返回数组从指定维度加一到最后一个维度的和

  - `rowSums()`，返回数据框或矩阵的行和，或返回数组从指定维度加一到最后一个维度的和

  - `col()`，返回一个与参数维度相同的矩阵，其各列包含列索引，或返回一个每列为一个因子的因子矩阵

  - `row()`，返回一个与参数维度相同的矩阵，其各行包含行索引，或返回一个每行为一个因子的因子矩阵

  - `det()`，返回矩阵的行列式

  - `determinant()`，返回行列式的模（或模的对数）以及模的符号

  - `eigen()`，返回矩阵的特征值和特征向量

  - `kappa()`，计算方阵的条件数

  - `kronecker()`，返回两个对象的克罗内克 `product`（乘积）矩阵或数组，其中 `product` 是一个指定函数。这两个对象可以是向量、矩阵和/或数组。结果的维度是两个对象维度的乘积。

  - `norm()`，返回通过 `one`（1-范数）、`infinity`（无穷范数）、`Frobenius`（Frobenius 范数）、`maximum
  modulus`（最大模）或 `spectral`（谱范数，或 `2`-范数）方法计算的矩阵范数


  模型拟合中使用的一些函数如下：


  - `backsolve()`，求解左侧矩阵为上三角矩阵的矩阵方程

  - `forwardsolve()`，求解左侧矩阵为下三角矩阵的矩阵方程

  - `chol()`，正定方阵的 Cholesky 分解

  - `chol2inv()`，利用矩阵的 Cholesky 分解求正定矩阵的逆矩阵

  - `qr()`，矩阵的 QR 分解

  - `svd()`，矩阵的奇异值分解。


  函数及其参数的列表见表 16-6。


  **表 16-6** 部分矩阵、数组及数据框函数


  | R 中的函数 | 限制条件 |

  | --- | --- |

  | `aperm(a, perm=NULL, resize=TRUE, ...)` | `a`，矩阵或数组<br>`perm`，NULL、整数或字符向量；通过索引或字符串指定维度的顺序；若非
  NULL，其长度必须等于`a`的维度数，且是`a`维度的一个排列；若为 NULL 则返回维度反转的结果<br>`resize`，逻辑值；必须为 TRUE 或 FALSE<br>`...`，传递给底层函数的任何参数
  |

  | `rowsum(x, group, reorder=TRUE, na.rm=FALSE, ...)` | `x`，任意数值矩阵<br>`group`，长度等于`x`行数的向量或因子——用于分组<br>`reorder`，逻辑值；必须为
  TRUE 或 FALSE<br>`na.rm`，逻辑值；必须为 TRUE 或 FALSE<br>`...`，传递给底层函数或从底层函数接收的任何参数 |

  | `colMeans(x, na.rm=FALSE, dims=1)` | `x`，逻辑型、数值型或复数型矩阵、数据框或数组<br>`na.rm`，逻辑值；必须为
  TRUE 或 FALSE<br>`dims`，数值；1 ≤ `dims` ≤ n-1，其中 n 是维度数 |

  | `colSums(x, na.rm=FALSE, dims=1)` | 参见 `colMeans()` |

  | `rowMeans(x, na.rm=FALSE, dims=1)` | 参见 `colMeans()` |

  | `rowSums(x, na.rm=FALSE, dims=1)` | 参见 `colMeans()` |

  | `col(x, as.factor=FALSE)` | `x`，任意矩阵<br>`as.factor`，逻辑值；必须为 TRUE 或 FALSE |

  | `row(x, as.factor=FALSE)` | 参见 `col()` |

  | `det(x, ...)` | `x`，逻辑型或数值型方阵；逻辑值会被强制转换为数值<br>`...`，忽略 |

  | `determinant(x, logarithm=TRUE, ...)` | `x`，逻辑型或数值型方阵；逻辑值会被强制转换为数值<br>`logarithm`，逻辑值；必须为
  TRUE 或 FALSE<br>`...`，忽略 |

  | `eigen(x, symmetric, only.values=FALSE, EISPACK=FALSE)` | `x`，逻辑型、数值型或复数型方阵；逻辑值会被强制转换为数值<br>`symmetric`，逻辑值；若为
  TRUE 则假定矩阵对称，FALSE 则不对称<br>`only.values`，逻辑值；若为 TRUE 仅返回特征值，FALSE 则同时返回特征值和特征向量<br>`EISPACK`，逻辑值；已废弃并忽略
  |

  | `kappa(z, exact=FALSE, norm=NULL, method=c("qr", "direct"), ...)` | `z`，逻辑型或数值型方阵；逻辑值会被强制转换为数值<br>`exact`，逻辑值；必须为
  TRUE 或 FALSE<br>`norm`，字符；必须为 NULL、"O"或"I"——分别对应 1-范数和无穷范数<br>`method`，字符；必须为"qr"或"direct"；默认值为"qr"<br>`...`，传递给底层函数的任何参数
  |

  | `kronecker(X, Y, FUN="*", make.names=FALSE, ...)` | `X`，`Y`，向量、矩阵和数组；不必具有相同模式；必须是函数`FUN`的合法输入<br>`FUN`，一个函数；可以是字符串<br>`make.names`，逻辑值；必须为
  TRUE 或 FALSE；不适用于所有函数<br>`...`，函数`FUN`的任何参数 |

  | `norm(x, type=c("O","I","F","M","2"))` | `x`，逻辑型、数值型或复数型矩阵；逻辑型和复数型会被强制转换为数值<br>`type`，字符；默认值为"O"
  |

  | `backsolve(r, x, k=ncol(r), upper.tri=TRUE, transpose=FALSE)` | `r`，逻辑型、数值型或复数型上三角矩阵——逻辑型和复数型会被强制转换为数值<br>`x`，逻辑型、数值型或复数型向量或矩阵——逻辑型和复数型会被强制转换为数值<br>`k`，数值——向下取整为整数；1
  ≤ `k` ≤ ncol(`r`)；要使用的''r''的列数<br>`upper.tri`，逻辑值；为 TRUE 时使用上三角，FALSE 时使用下三角<br>`transpose`，逻辑值；为
  TRUE 时公式中的`r`会被转置 |

  | `forwardsolve(l, x, k=ncol(l), upper.tri=FALSE, transpose=FALSE)` | `l`，逻辑型、数值型或复数型下三角矩阵——逻辑型和复数型会被强制转换为数值<br>`x`，逻辑型、数值型或复数型向量或矩阵——逻辑型和复数型会被强制转换为数值<br>`k`，数值——向下取整为整数；1
  ≤ `k` ≤ ncol(`l`)；要使用的''l''的列数<br>`upper.tri`，逻辑值；为 TRUE 时使用上三角，FALSE 时使用下三角<br>`transpose`，逻辑值；为
  TRUE 时公式中的`l`会被转置 |

  | `chol(x, pivot=FALSE, LINPACK=FALSE, tol=-1, ...)` | `x`，原始型、逻辑型或数值型矩阵——原始型和逻辑型矩阵会被强制转换为数值；必须是方阵且正定<br>`pivot`，逻辑值；为
  TRUE 时使用主元，FALSE 不使用主元<br>`LINPACK`，（已弃用）逻辑值；为 TRUE 时使用 LINPACK，FALSE 不使用 LINPACK<br>`tol`，数值；当`pivot=TRUE`且`LINPACK=FALSE`时的容差<br>`...`，传递给底层函数的任何参数
  |

  | `chol2inv(x, size=NCOL(x), LINPACK=FALSE)` | `x`，其前`size`列为 Cholesky 分解结果的矩阵<br>`size`，数值、逻辑型或复数型——逻辑型和复数型会被强制转换为数值；1
  ≤ `size` ≤ ncol(`x`)<br>`LINPACK`，逻辑值；已废弃——不再使用 |

  | `qr(x, tol=1e-7, LAPACK=FALSE, ...)` | `x`，逻辑型、数值型或复数型矩阵；逻辑型矩阵会被强制转换为数值<br>`tol`，数值；奇异性容差<br>`LAPACK`，逻辑值；若为
  FALSE，`qr()`使用 LINPACK<br>`...`，传递给底层函数的任何参数 |

  | `svd(x, nu=min(n,p), nv=min(n,p), LINPACK=FALSE)` | `x`，逻辑型、数值型或复数型矩阵；逻辑型矩阵会被强制转换为数值<br>`nu`，整数；0
  ≤ `nu` ≤ n；n = nrow(`x`)<br>`nv`，整数；0 ≤ `nv` ≤ p；p = ncol(`x`)<br>`LINPACK`，逻辑值；已废弃并忽略
  |




