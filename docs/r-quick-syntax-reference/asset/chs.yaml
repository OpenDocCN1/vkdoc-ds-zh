- '# 第三部分 函数


  '
- '# 6. 打包函数


  R 拥有超过 10，000 个包，其中大部分包含函数。函数是 R 的核心，赋予了 R 极大的灵活性。函数是 R 对象，其`mode`和`class`均为`function`。打包函数是作为
  R 包一部分创建的函数。在计算机上，包存储在库中，并被安装到库中以供使用。


  ## 库


  初始安装 R 时，以下包也会随同安装到硬盘的某个文件夹中：`base`、`boot`、`class`、`cluster`、`codetools`、`compiler`、`datasets`、`foreign`、`graphics`、`grDevices`、`grid`、`KernSmooth`、`lattice`、`MASS`、`Matrix`、`methods`、`mgcv`、`nlme`、`nnet`、`parallel`、`rpart`、`spatial`、`splines`、`stats`、`stats4`、`survival`、`tcltk`、`tools`和`utils`。


  在 Windows 系统中，初始安装后安装的任何包都可以安装到不同的库（另一个文件夹）中。该文件夹在 R 安装时创建。在 OS X 系统中，所有已安装的包都位于同一个文件夹和库中。在
  Linux 系统中，初始安装后安装的任何包都会安装到不同的库（另一个文件夹）中。该文件夹在安装第一个额外包时创建。


  要查看已安装包的列表（包含每个包的描述和包文件夹名称），可在 R 提示符下输入`library(lib.loc = .Library)`。运行不带参数的`library()`函数会列出库中的包及其描述。要查看关于包的更多详细信息，可在
  R 提示符下输入`installed.packages()`。在 R Studio 中，已安装的包会列在右下角窗口的“包”选项卡下。


  有些 R 函数的运行需要依赖其他 R 函数。当 R 运行时，只有那些已从库加载到 R 中的包才是程序可访问的。如果尝试运行某个函数但必需的包尚未加载，R 会报错。错误信息中会包含缺失包的名称。如果某个包存在于计算机的某个库中，可以通过在
  R 提示符下输入`library(''package name'')`来加载（使其可访问）该包，其中`''package name''`是包名。或者在 R Studio
  中，在“包”选项卡下勾选该包左侧的复选框来加载它。


  如果包不在任何一个库中，安装新包的过程很简单（参见第[1]章）。一旦安装完成，便可使用`library()`函数或 R Studio 中的“包”选项卡加载该包。（如果在函数内部调用，应使用`require()`代替`library()`。参见`library()`帮助页面。）在任何时候，在
  R 提示符下输入`search()`都会给出当前工作空间中已加载包的列表。在 R Studio 中，已加载的包会显示勾选标记。


  要查看某个包中的函数（和数据集），可在 R 提示符下输入`help(package=''package name'')`，其中`''package name''`是包名。请注意，必须已安装该包，`help(package=''package
  name'')`才能返回包的内容。在 R Studio 中，在“帮助”选项卡下输入包名即可访问该包中的所有对象。包中的某些文件可能是数据集，但对于大多数包而言，文件通常是函数。




  '
- '# 默认包与原始函数


  当用户启动 R 会话时，包 `base`、`datasets`、`utils`、`grDevices`、`graphics`、`stats` 和 `methods`
  是默认加载到工作空间中的包。（可通过修改函数 `options()` 中的 `defaultPackages` 来更改加载的默认包。详见第 15 章。）通常，根据用户的计算需求，无需再加载其他包。


  那些用 C 语言编写并在 R 编译时一同编译的函数被称为**原始**函数。根据在 R 提示符下输入 `?primitive` 或在 R Studio 帮助选项卡下输入
  `primitive` 所显示的帮助页面，所有原始函数都位于总是被加载的 `base` 包中。使用原始函数的优势在于这些函数已经编译完成，因此运行速度更快。原始函数包括运算符、大多数数学函数，以及
  R 运行和结构的基础函数。原始函数的列表可在 [`http://cran.r-project.org/doc/manuals/R-ints.html#g_t_002eInternal-vs-_002ePrimitive`](http://cran.r-project.org/doc/manuals/R-ints.html%2523g_t_002eInternal-vs-_002ePrimitive)
  或 `base` 包的帮助页面中找到。根据参数的传递方式，原始函数分为 `built-in` 或 `special` 类型。用 R 编写的函数属于 `closure`
  类型。函数 `is.primitive()` 用于测试一个对象是否为原始函数。


  '
- '# 使用帮助页面


  R 中的每个函数都有一个帮助页面，且每个帮助页面的结构基本相同。与 R 中的许多其他内容一样，帮助页面起初可能会令人望而生畏。然而，帮助页面通常包含丰富的信息。


  给定一个函数名，如果包含该函数的包已被加载，在 R 提示符下输入 `?function` 或 `help(function)`（其中 `function` 是函数名）即可调出该函数的帮助页面。如果包已安装但未加载，输入
  `?package::name`（其中 `package` 是包名，`name` 是函数名）即可调出帮助页面。在 R Studio 中，也可以在“帮助”选项卡下，通过在搜索框中输入函数名来访问帮助页面。


  有些函数共享同一个帮助页面。使用任一函数名均可调出该帮助页面。在 Windows 和 OS X 版本的 R 中，帮助页面会在单独的窗口中打开。在 Linux 中，帮助页面会在终端中显示。在
  R Studio 中，帮助页面会在右下方的窗口中打开。


  ## 标识符


  帮助页面的第一行列出函数名，后跟花括号中的函数包名，然后是“R Documentation.”（R 文档）字样。


  ## 标题


  在标识符下方是一个标题，用于简要说明该函数的功能。例如，对于函数 `lm()`，其标题是“Fitting Linear Models.”（拟合线性模型）。


  ## 描述


  在标题下方，是以“Description”（描述）为标题的部分，用来描述函数的使用方式。描述可长可短，取决于函数的复杂程度。对于函数 `lm()`，您会看到以下描述：


  ```

  lm 用于拟合线性模型。它可用于执行回归、单层方差分析和协方差分析（不过 aov 可能为这些分析提供更便捷的接口）。

  ```


  ## 用法


  “Description”（描述）下方是“Usage”（用法）部分。在“Usage”部分中，函数及其所有可能的参数都会被列出。对于有默认值的参数，会给出其默认值。Usage
  部分会列出 S4 的用法。对于许多函数，还会列出 S3 的用法。


  对于函数 `lm()`，其“Usage”部分包含以下内容：


  ```

  lm(formula, data, subset, weights, na.action, method = "qr", model = TRUE, x = FALSE,
  y = FALSE, qr = TRUE,

  singular.ok = TRUE, contrasts = NULL, offset, ...)

  ```


  带有默认值的参数是指那些参数已被设定为某个值的参数。


  '
- '# 参数


  在“Usage”（用法）部分之下是名为“Arguments”（参数）的部分。在“Arguments”部分中，会列出“Usage”部分中的参数，并对每个参数进行描述。描述包括该参数的合法取值。


  例如，从 `lm()` 的帮助页面中，列出的前两个参数如下：


  | `formula` | 一个属于"[formula](http://127.0.0.1:10403/library/stats/help/formula)"类的对象（或可强制转换为该类的对象）：对待拟合模型进行符号描述。模型规范的[细节](http://127.0.0.1:10403/library/stats/html/lm.html)在“Details”（详细说明）部分给出。
  |

  | --- | --- |

  | `data` | 一个可选的 data frame、列表或环境（或可通过 [as.data.frame](http://127.0.0.1:10403/library/stats/help/as.data.frame)
  强制转换为 data frame 的对象），其中包含模型中的变量。如果在 `data` 中未找到，则变量取自 `environment(formula)`，通常是从调用
  `lm` 的环境中获取。 |


  因此，对于函数 `lm()`，第一个参数是一个公式，第二个参数可以是一个 `data.frame`，但第二个参数是可选的。


  ## 详细说明


  有时会有一个名为“Details”（详细说明）的部分，对参数提供更详细的说明。在 `lm()` 函数示例中，“Details”部分给出了设置公式的规则，以及函数针对公式的不同输入时的行为。


  ## 返回值


  下一部分名为“Value”（返回值）。“Value”部分描述了函数的返回内容。对于某些函数，哪些函数可以操作输出，以及可以从输出中提取哪些组件，这些相关内容会在此部分列出。


  函数 `lm()` 的“Value”部分的前几行如下：


  `lm` 返回一个[class](http://127.0.0.1:20871/library/stats/help/class)为 `"lm"` 的对象，或者对于多个响应变量，返回类为
  `c("mlm", "lm")`的对象。


  函数 `summary` 和 [anova](http://127.0.0.1:20871/library/stats/help/anova) 用于获取并打印结果的摘要和方差分析表。通用访问器函数
  `coefficients`、`effects`、`fitted.values` 和 `residuals` 用于提取 `lm` 返回值的各种有用特征。


  一个 `"lm"` 类的对象是一个列表，至少包含以下组件：


  *   `coefficients` 一个命名的系数向量

  *   `residuals` 残差，即响应值减去拟合值。

  * …


  ## 其他可选部分


  在“Value”（返回值）部分之后，可能会有其他部分提供更多信息。对于函数 `lm()`，还有另外三个部分：“Using time series”（使用时间序列）、“Note”（注意）和“Author(s)”（作者）。其他函数可能包含“Warning”（警告）、“Source”（来源）或其他标题的部分。


  ## 另请参阅


  “See Also”（另请参阅）部分紧随“References”（参考文献）部分之后。“See Also”部分提供了与本帮助页面函数相关的其他函数的信息。对于函数
  `lm()`，其“See Also”部分的前三行如下：


  ```

  summary.lm 用于摘要，anova.lm 用于 ANOVA 表；aov 提供不同的接口。

  通用函数 coef, effects, residuals, fitted, vcov。

  predict.lm (通过 predict) 用于预测，包括置信区间和预测区间；confint 用于参数的置信区间。

  ```


  “See Also”部分为寻找与用户当前使用方法相关的函数提供了很好的线索。




  ### 示例


  大多数页面都有的最后一部分是“示例”。该部分给出了函数的使用示例。查看实际的使用示例非常有帮助。以下是来自`lm()`函数帮助页面的示例内容：


  ```

  require(graphics)

  ## Annette Dobson (1990) "An Introduction to Generalized Linear Models".

  ## Page 9: Plant Weight Data.

  ctl <- c(4.17,5.58,5.18,6.11,4.50,4.61,5.17,4.53,5.33,5.14)

  trt <- c(4.81,4.17,4.41,3.59,5.87,3.83,6.03,4.89,4.32,4.69)

  group <- gl(2, 10, 20, labels = c("Ctl","Trt"))

  weight <- c(ctl, trt)

  lm.D9 <- lm(weight ~ group)

  lm.D90 <- lm(weight ~ group - 1) # omitting intercept

  anova(lm.D9)

  summary(lm.D90)

  ```


  在这个示例中，公式的结构是通过演示而非解释来呈现的。示例中还展示了一些用于操作`lm`类对象的函数。由于`graphics`包默认已加载，因此通常不需要调用`require(graphics)`。


