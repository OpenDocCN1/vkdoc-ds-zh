- '# 16. 包 `base`、`stats` 和 `graphics`


  在本章中，我们快速浏览一下 `base`、`stats` 和 `graphics` 这三个包——它们是 R 中默认加载的三个包。`base` 包包含三角函数和其他数学函数、许多
  `as.` 和 `is.` 类函数、算术运算符、流程控制语句、某些 apply 函数以及 R 中许多其他基本函数。


  `stats` 包包含许多基本统计函数，例如查找中位数、标准差和方差的函数。它还包括与常见概率分布相关的函数以及更多其他统计函数。`graphics` 包包含基本绘图函数及其辅助函数。


  其他默认加载的包包括：`datasets`（包含数据集）、`utils`（包含实用函数）、`grDevices`（包含绘图所需的信息，如字体和颜色）以及 `methods`（包含用于处理
  S4（形式化）方法和类的函数和信息）。


  要查看某个包中的函数列表（带有指向函数帮助页面的可点击链接），请在 R 提示符下输入 `help(package="package.name")` 或 `library(help=package.name)`，其中
  `package.name` 是包的名称。


  本章信息的来源是 CRAN 帮助页面。


  ## `base` 包


  `base` 包包含许多 R 的基本函数。`base` 包的帮助页面链接列表长达 30 页。本节涵盖了保留字、内置常量、三角函数和双曲函数、与贝塔函数和伽马函数相关的函数、其他一些数学函数、复数函数、矩阵函数以及一些其他函数。它还讨论了
  `base` 包中的一些其他函数。


  ### 保留字


  R 中的保留字包括 `if`、`else`、`repeat`、`while`、`for`、`function`、`next`、`break`、`in`、`TRUE`、`FALSE`、`Inf`、`NULL`、`NA`、`NaN`、`NA_integer_`、`NA_real_`、`NA_complex_`、`NA_character_`、`...`、`..1`、`..2`
  等等。见表 16-1。


  **表 16-1** R 中的保留字


  | `if` | `else` | `repeat` | `while` | `for` |

  | --- | --- | --- | --- | --- |

  | `in` | `next` | `break` | `function` | `TRUE` |

  | `FALSE` | `Inf` | `NULL` | `NA` | `NaN` |

  | `NA_integer_` | `NA_real_` | `NA_complex_` | `NA_character_` |  |

  | `...` | `..1` | `..2` | ... | `..n` |


  更多信息，请在 R 提示符下输入 `?Reserved`，或使用 R Studio 中的“帮助”（Help）选项卡。




