  几年后，这样的场景将变得司空见惯。人工智能技术将使我们更轻松地处理个人和职业生活中的日常活动。人工智能技术看似像人类一样思考和分析，但实际上只是计算机处理大量数据来做决策。因此，既然人类展现的是*自然*智能，我们说计算机展现的是*人工*智能。在本章中，我们重点关注机器学习（ML），它是人工智能的一个子集，能够从经验中学习并持续提升其智能。在机器学习技术出现之前，我们必须手动从收件箱中删除垃圾邮件，但像
  Gmail 这样的现代电子邮件产品使用机器学习来根据邮件内容或我们过去的行为学习将哪些邮件标记为垃圾邮件。随着我们越来越多地使用这些产品，它们会记录我们点击的邮件、链接和按钮，从而变得更加精准。本章中所有对
  AI 的引用，都应理解为自我改进的机器学习系统。


  ## 人工智能的关键方面


  每一项人工智能技术都是为了解决一个*问题*而构建的，即一个具有明确定义输入和输出的任务。*输入*是教会人工智能解决问题的数据，*输出*则是解决方案。人工智能的*模型*，即其大脑，是一组根据输入产生输出的数学函数。模型会根据所提供的数据进行*学习*，即适应并改进其行为。以
  Spotify 为例，这是一款流行的音乐流媒体应用，也会向用户推荐新歌曲。在这里，*问题*是做出最有可能让听众满意的歌曲推荐。输入数据包括用户的歌曲收听历史、热门歌曲、相似用户的偏好，以及其他有助于推断用户可能喜欢收听什么的有用信息。输出则是
  Spotify 推荐给用户的歌曲。模型是理解你收听偏好的核心软件组件。随着 Spotify 的歌曲推荐效果随时间推移而改善——例如，它最初可能会推荐前 40 首热门歌曲，因为它们在全美都很流行，但随着它获得更多关于你过去收听迪士尼歌曲历史的信息，它将开始推荐更多电影原声带——我们就能看到它在学习。


  接下来，我们将深入探讨人工智能的这四个方面，即问题、数据、模型和学习。


  ### 问题


  我们使用人工智能来解决问题。这里的*问题*一词使用得非常广泛，涵盖从食物、住所和水等基本人类需求，到拥有个人助理帮你处理文书工作等奢侈享受的一切。


  人工智能适用的主要问题分为两大类。第一类包括人类已经能够解决，但人工智能可以提供更好、更高效解决方案的问题。例如，人类驾驶汽车已有数十年历史，但自动驾驶汽车有潜力大幅减少道路交通事故数量，并催生新的汽车共享生态系统，从而减少汽车拥有量和有害气体排放。像谷歌、优步和特斯拉这样的知名公司如今正在投入大量资金和人才来构建自动驾驶人工智能。构建这项技术需要感知环境，实时识别车辆、行人和障碍物，并根据这些数据做出行动来导航道路。


  另一类问题包括那些对人类来说难以解决（甚至无法解决）的问题；这里我们期望人工智能能够开启创新之门。例如，虽然你最亲密的朋友可以推荐你可能喜欢的歌曲，但他们会受限于自己的音乐体验。如果我们能浏览世界上所有的音乐，并推荐那些与你的品味互补的音乐，你可能会发现新的、令人兴奋的音乐，而这些音乐在别的途径下是无法接触到的。


  人工智能的输出通常被称为*预测*，意指有根据的猜测。这里的预测并非指关于未来的陈述。如果它向用户返回五首新的歌曲推荐，我们就说它预测了这些歌曲。换句话说，它利用过去的数据和收听历史来确定，在它所知道的所有歌曲中，用户会最喜欢返回的这些歌曲。更一般地说，我们称之为一个*分类*问题，即人工智能试图将输入归类到一个或多个预定义的类别中。在这里，它对知识库中的每首歌曲预测"用户会喜欢"（编码为
  1）或"用户不会喜欢"（编码为 0），并返回一些类别为 1 的歌曲。这里只有两个类别（1 和 0），每首歌曲必须属于其中之一。类别的数量取决于问题——越具体的预测需要越细粒度的类别。我们可以训练人工智能来预测从"非常喜欢"到"中性"再到"非常不喜欢"的范围，这需要三个、五个甚至七个类别。相反，*回归*问题的输出是连续的、非分类的。预测结果并不属于某一类或另一类，而是落在某个连续区间内。例如，根据某个地区历史上的月度（每月第一天）房价数据，我们可以训练人工智能绘制一条平滑的曲线，以捕捉多年来房价上下波动的平均趋势，从而预测未来的价格。





  ### 数据


  人工智能依赖于大量正确、多样且均衡的输入数据来正确解决问题。由于它会根据数据调整并改进自身行为，因此错误的数据意味着它学会预测错误类别或数值。例如，房价数据如果错误地偏移了一个月，就会导致预测结果也偏移一个月。更糟糕的是，如同错误价格这类损坏数据，会让
  AI 完全学到错误的内容。即使数据是正确的，但来源过于单一，也无法代表问题的全貌，从而导致 AI 性能不佳。例如，不应使用美国历史上的房价数据来训练 AI 预测印度的房价，因为两地市场差异巨大。此外，AI
  模型需要在数据中看到足够多样的房屋类型，如独栋住宅、双拼别墅和豪宅，这样当被要求预测一栋罕见房屋的价格时才不会措手不及。最后，每种房屋类型的数据量必须充足，以避免多数类型对
  AI 的学习产生过大影响。


  计算机将所有信息存储为数字，更准确地说，是比特。因此，在 AI 能够学习数据之前，我们必须将数据转换为数字。幸运的是，像图像、文本和音频这类标准数据类型在计算机中已经以数字形式表示。在实践中，我们将数据转换为称为*特征*的浓缩数值表示形式，这些特征捕捉了最相关的部分。假设你可以获取过去一百年美国所有已售房屋的信息，包括房屋详情及其月度价格变化。要构建一个能预测未来房屋价格的
  AI，我们可能会关注每栋房屋的购买日期、建筑面积、位置和入住情况（即特征），因为它们最有可能影响价格。我们忽略墙壁油漆颜色和前任租户的年龄，因为我们发现这些因素与价格无关。将最相关的特征组合成一个数字列表，就得到了一个*特征向量*，这正是
  AI 期望的输入格式。


  但我们如何知道日期、建筑面积、位置和入住情况是影响房价的最大因素呢？也许墙壁油漆颜色*的确*对市场价格至关重要。影响市场价格的因素如此之多，以至于我们仅凭直觉手动选择少数特征可能会过度简化问题，从而训练
  AI 学习到错误的模式。更好的方法是通过数学技术自动发现最重要的特征。我们可以首先绘制所有房屋的价格（y 轴）与建筑面积（x 轴）的散点图；如果建筑面积对价格有显著影响，我们应该会注意到一条对角线，表明价格随建筑面积的变化而显著变化。然后，我们可以将此选为一个特征。如果关系反而是一条水平线，说明建筑面积不影响价格，那么我们就应将其从特征中排除。


  我们还可以使用简单的计数技术来捕捉数据的高层方面，并将其编码为特征。例如，在垃圾邮件分类中，我们可以统计垃圾邮件中出现频率最高的前十个单词，对所有非垃圾邮件也做同样的处理，并删除诸如“a”和“the”这类高频常见词。然后，AI
  将通过检查新邮件中的单词是否与这些单词集匹配，并观察其是否应被归类为垃圾邮件，来学习区分垃圾邮件和非垃圾邮件。谷歌的`Word2Vec`（“word to vector”的缩写）技术甚至能将单个单词转换为捕捉其现实含义的数学表示。这些特征捕捉了数据的语义方面；例如，“mother”和“father”这两个词密切相关，而“food”和“computer”则无关。特征就是
  AI 的食粮；它们与期望输出的关系越强，AI 的准确性就越高（前提是 AI 能够捕捉到这些关系，这是下一节“模型”的主题）。


  暂且不谈特征计算，我们需要确保一开始就在使用最合适的数据集。假设我们想检测横穿马路的行人。我们可以使用麦克风来拾取马路上的脚步声。然而，仅凭脚步声来确定人与汽车的距离将极其困难。这里更好的数据是道路图像，其中可以清晰地看到行人。甚至更好的方法是，我们可以使用红外图像来捕捉热信号。人体散发的热量远高于路面，因此在图像上会呈现亮红色，更容易被检测到。


  ### 模型


  模型负责根据给定的输入产生正确的预测。输入数据从一端进入（例如患者的症状），另一端则输出预测结果（流感/无流感）。如果模型观察到多个高度相关的症状，它就预测“患流感”。如果观察到没有发烧，它就预测“无流感”（因为流感几乎总是伴随发烧）。在模型内部，是编码了现实世界知识的隐藏数学函数，例如头痛和发烧总是伴随流感，而腿痛则完全无关。这些函数本质上是将变量与系数关联起来的公式，例如`y
  = mx`，其中`y`是流感的严重程度（越高越严重），`x`是头痛的程度（同样，越高越严重）。变量`m`决定了`x`和`y`之间的关系；如果它等于 1，那么随着头痛加剧，流感也会加剧到类似程度。如果`m`等于
  2，那么流感会双重恶化，这意味着这个症状与流感严重程度的关系非常强。这个例子展示了现实世界的关系可以表示为带有变量的数学公式。注意，这些公式仅仅表示两个值之间的相关性，意味着头痛和流感严重程度似乎一起变化，而不是一个导致另一个变化。训练模型以在公式中捕捉这些相关关系，正是
  AI 的核心所在。


  表 15-1 展示了不同症状与流感严重程度之间的相关关系类型。


  **表 15-1.** 线性和非线性关系示例


  | 类型 | 关系 | 示例症状 | 解释 |

  | --- | --- | --- | --- |

  | 线性 | 正相关 | 头痛 | 流感越严重，头痛越强烈。 |

  | 无相关 | 腿痛 | 流感的严重程度对腿痛没有影响。 |

  | 负相关 | 高度精神集中 | 流感越严重，越难集中注意力（即精神集中度越低）。 |

  | 非线性 | 不明确 | 打喷嚏 | 流感的严重程度以复杂的方式与打喷嚏相关联。 |


  线性关系是一种简单的关联，其中一个值的增加或减少伴随着另一个值的相应变化。前面讨论的`y = mx`例子就是`y`和`x`之间的一种简单线性关系。非线性关系则不那么直接。随着年龄增长，视力会减弱，但每个人的变化程度和速度都不同。一个人可能
  80 岁时视力仍完美无缺，而另一个人可能 20 岁就近视了。我们知道年龄和视力之间存在某种关系，只是难以解释或表达。其他现实世界的例子包括：公司季度收益报告如何影响其第二天的股价，或者新政府政策如何影响该国的失业率。目前尚没有明显的公式能让我们计算出这些影响。




  话虽如此，必然存在某种隐藏在我们视线之外的*公式*，它可能包含数百或数千个变量，并能捕捉到这些独特而复杂的关系。神经网络是应对此类场景最有效的模型类型。它由多层简单的数学函数（称为神经元）堆叠而成，最终产生一个输出。这些堆叠的函数深度可达
  500 层以上，由此产生了“深度学习”这一术语。你可能在媒体上多次听到这个流行词，它常被吹捧为一种神奇算法，能够完成击败世界顶级围棋选手之一李世石这样的超人壮举。神经网络的独特之处在于其能够捕捉任何线性与非线性关系，从而识别出数据中难以察觉的微妙差异。其他类型的模型包括决策树（一种选择最具信息量特征进行学习的树状结构）以及支持向量机（SVM，它试图尽可能远地分离最强的正负特征）。


  ## 学习


  既然我们已经确定了问题、相关数据和模型，就可以将数据输入模型，让它进行学习。*学习*是模型掌握问题知识的过程。当我们向模型输入数据时，它会一次性处理若干数据点，并调整其底层数学函数的参数，以反映从数据中获取的新信息。这一调整过程由*超参数*（即更高级别的配置）控制，例如模型每处理一组数据点时应改变参数的幅度，这也被称为学习率。学习率越高，每个新数据点对模型参数的影响就越大，学习进展也越快。随着时间的推移，参数的取值理想情况下会变得足够优秀，使模型能够做出准确的预测，此时参数停止变化，并被称为收敛至最终值。实践中，如果模型未能充分捕捉数据中的关系，往往不会收敛。因此，学习过程需要人类定期监控，以判断进展是否顺利——即参数更新是在改善预测还是导致预测恶化。模型需要多次遍历数据才能收敛，根据问题的复杂程度，耗时可能从数小时到数天不等。从人类的角度来看，我们称这一过程为“训练模型”。用于训练模型的数据被称为训练数据。


  三种最常见的学习过程是监督学习、无监督学习和半监督学习。监督学习依赖于人为提供的每个训练数据点的期望输出，这些输出被称为*标签*。如果问题是预测患者是否患有癌症，监督学习不仅需要患者的症状，还需要一个“患有癌症”或“未患癌症”的标签。模型通过预测患者是否患癌并用给定的标签进行确认，不断验证和优化其知识。如果预测正确，置信度会提高；如果预测错误，则需要调整构成模型的数学函数中的某些取值。这种反复检查与更新的迭代过程会随时间增加模型的知识积累。到了收敛点，我们停止训练模型，用新的患者信息对其进行验证，并统计其出错次数。模型此前从未见过这些患者，因此这是对模型理解问题程度的一种检验。如果模型足够好，我们可能会将其集成到实际产品中并销售给消费者；如果不够好，我们会用更长时间继续训练，同时对底层数学函数或结构进行一些调整，例如为神经网络增加更多层，或调整某些超参数。有时，我们也会收集更多带标签的训练数据，为模型提供更多关于问题的信息。


  遗憾的是，人工构建标签成本高昂。对于道路图像中检测行人的问题，收集数千张图像相对容易，但逐一人工判断每张图像中是否存在行人（是/否）则困难得多。无监督学习在没有标签的情况下从训练数据中获取知识。监督学习中依据真实标签进行验证的迭代过程在此无法奏效。相反，这一过程试图揭示特征内部的关系，例如识别相似的数据点并将其归入不同的组。无监督学习能解决的问题更多与深入理解数据有关，而非试图预测一个输出。K-means
  算法就是这样一种学习过程，它能迭代地在数据中发现簇。例如，如果数据包含书店顾客的年龄和家乡等信息，对它们进行分组有助于我们更好地理解经常光顾书店的顾客类型。


  在许多情况下，只有部分数据带有标签。我们能否仍利用它们进行学习呢？半监督学习试图解决这种情况，主要通过依据其他数据点与少量带标签数据的相似性来推断其标签。相似度越高，它们拥有相同标签的可能性就越大。例如，如果两名患者的症状非常相似，但我们只知道其中一人的标签，就可以有根据地猜测另一人也有相同的标签。一旦我们拥有了所有标签，就可以应用前面讨论过的监督学习方法来学习和预测输出。


  现在，我们将通过一个小的实际案例，看看人工智能的这四个关键组成部分——问题、数据、模型和学习——是如何结合在一起的。


  ## 案例研究：苹果面容 ID


  要解锁最新的 iPhone，你只需盯着屏幕一秒钟即可。这项技术使用了一个经过训练能检测你面部的神经网络。^(³⁵) 这里的问题主要涉及分类——判断此刻看向屏幕的脸是否是
  iPhone 的真正主人。为了准确完成此任务，模型首先通过包含超过十亿张真实世界人脸的三维深度图和二维红外图像的训练数据，来理解人脸通常是什么样子。没错，苹果获得了许多不同人的同意，保存了他们各种面部姿态的照片！模型试图从这些数据中学习常见的人脸模式，例如多数人都有两只眼睛、一个鼻子和一张嘴。这是一个无监督问题的设定，因为它更多是揭示面部各部分之间的关系，而不是试图将人脸与人工构建的标签进行匹配。实际上，在此情境中根本没有标签。训练数据的多样性对于模型能够捕捉面部结构各要素之间的微妙关系至关重要——例如，不同的人有不同的眼睛颜色或眼睛间距。这些关系被表示为公式，即使你戴眼镜、帽子或其他改变面部外观的物品，这些公式也具有很强的适应性。当你第一次购买
  iPhone 时，系统会要求你用自己的人脸进行校准，以便模型能基于训练数据进一步调整其公式，从而适应（或学习）你的特定面部特征；由于你将是解锁 iPhone 的唯一用户，它需要只识别你而不识别其他人。将来，解锁手机就如同将一张新面孔与此存储的表示进行匹配那么简单。随着时间的推移，模型会持续学习以适应面部结构的变化，因此即使你留起了胡子或长发，手机仍然能够解锁。




  ## 人工智能的伦理问题


  人工智能模型会无意中捕捉并加剧社会中存在的歧视性偏见。2015 年，谷歌照片将两张黑人的照片标记为“大猩猩”，这引发了推特上许多用户的强烈抗议，迫使谷歌就此错误公开发布道歉。虽然具体原因并未公开，但我们推测，要么是训练数据中黑人的样本数量不足，导致模型无法准确学习；要么是模型无法捕捉黑人与大猩猩之间的差异。也有可能训练数据的标签不准确，即大猩猩的图片实际上被标记为黑人，因此模型自然就那样学了。谷歌本可以通过使用更多样化、更精确的数据集和更优的模型来避免这一错误。他们本可以通过向照片标记器输入一系列具有代表性的图像，并确保输出结果合理，来进行更全面的测试。作为潜在的新人工智能技术创造者，你应该注意预见数据中的偏见，并在训练模型时主动消除它们。同样关键的是，构建人工智能的团队应由多样化的个体组成，包括但不限于不同性别、民族和种族的人。由于团队中的每个成员都带来了独特的社会视角，这更有可能考虑到数据中的不一致和偏见。


  ## 人工智能实践


  人工智能是一个快速发展的领域，新的工具和技术层出不穷，因此我们预计这份清单会迅速演变。许多这些工具和技术都是公开可用的，并附有入门指南和文档；只需具备一些编程经验，你就可以在个人笔记本电脑上不到一小时内训练出一个简单的机器学习模型。这使得将人工智能嵌入到自己的产品中变得非常简单，因为你无需重复造轮子。


