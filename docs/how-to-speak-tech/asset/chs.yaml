- '# 14. 物联网


  特别感谢 Cheenar Banerjee 为本章做出的贡献。


  当你在开发 MyAppoly 时，你会意识到，你身边连接互联网的并不只有笔记本电脑。你的智能手机、智能恒温器和智能灯泡，只是你周围众多联网设备中的几个。事实上，预计到
  2020 年，将有 500 亿台设备连接到互联网。^(²⁹)，^(³⁰) 这种现象有一个专业术语，叫做*物联网*（Internet of Things，简称 IoT）。


  ## 物联网中的“物”


  那么，物联网中的“物”到底是什么？它是指任何连接互联网并带有嵌入式传感器的设备。智能灯泡是物联网设备吗？是的。智能音箱呢？是的。智能牙刷呢？是的。这本书？很可能不是。


  从技术上讲，任何连接互联网的设备，包括传统计算机，都可算作物联网设备。然而从实际意义上看，物联网指的是那些传统上你不会预期它们会联网的设备——比如恒温器和冰箱。


  一个有用的物联网设备会执行以下三项任务：


  1.  通过其嵌入式传感器收集重要数据

  2.  通过互联网传输数据，并接收对数据的分析结果

  3.  利用数据分析结果激发有意义的行动


  因此，物联网设备承担着三项职责：收集、传输和激发。让我们通过一个例子来深入理解。假设 MyAppoly 的办公室刚刚采购了市面上最新的智能冰箱，生产商我们称之为
  Roost。这台冰箱外观与普通冰箱无异，但门上多了一个触摸屏控制台。通过这个控制台，MyAppoly 的员工可以将冰箱连接到办公室 Wi-Fi，自定义冰箱功能，并查看警报和其他信息。该冰箱一个令人兴奋的新功能是，它能够通过内置的传感器对冰箱内食物进行称重，从而检测何时需要重新订购特定食物。例如，一组传感器负责监测放置牛奶的搁架。


  牛奶传感器收集牛奶搁架的重量数据，然后冰箱通过互联网将这些数据传输到另一台电脑。当牛奶搁架的重量变轻时（即牛奶盒快空了），冰箱会收到一个警报，并通过控制台显示、电子邮件或短信提醒等方式，鼓励用户补充牛奶，或是在线订购新的牛奶。


  ## 物联网


  既然我们知道了什么是物联网设备，接下来我们来谈谈一组协同工作的物联网设备。物联网是一个由物联网设备组成的网络，它们之间共享数据并相互通信，无需任何人为干预。由于有如此多的设备相互“对话”，能够管理它们的数据和通信就显得至关重要。我们可以通过一个名为
  *IoT 平台*的软件来实现这一点。网络中的每个物联网设备都连接到这个 IoT 平台，该平台负责桥接、存储和分析来自网络上所有设备的数据，并与每个网络设备单独通信。IoT
  平台存在于云端，所有的数据分析都在云端进行。虽然人类可能会与物联网设备本身进行交互，但在一个物联网网络中，设备间的数据收集和共享并不需要任何人为干预。


  在我们冰箱的例子中，一个物联网网络可以是美国境内所有 Roost 智能冰箱组成的网络。平台则是与每台智能冰箱通信、并收集和分析网络上所有智能冰箱数据的软件。另一个物联网网络可以是
  MyAppoly 办公室内智能设备（如智能冰箱、智能门铃和智能音箱）组成的网络。即使这些设备功能各不相同，同一个平台仍然可以与所有设备通信并分析它们的数据。Amazon
  Web Services IoT、Microsoft Azure IoT、Google Cloud IoT 和 IBM Watson 都是现有 IoT 平台的例子。


  物联网真正的力量源于网络上共享的海量数据。让我们再回想一下 MyAppoly 的冰箱，它是全国 Roost 冰箱网络的一部分。该网络的 IoT 平台每天从全国各地的冰箱收集数十万个牛奶重量测量值。随着时间的推移，使用第
  15 章中讨论的数据分析和机器学习，软件可以在数据中发现模式和洞察。其中一个洞察就是冰箱用户应该订购新牛奶的最佳重量——通过分析长期的大量牛奶重量数据，软件可以了解新牛奶平均需要多长时间送达，或者用户喝光半加仑牛奶需要多长时间。诸如此类的洞察共同作用，得出一个“神奇”的牛奶重量数值，并且随着更多数据的输入，这个数值会不断优化。


  来自不同来源的数据可以被合并分析，从而产生同样有用的洞察。在 MyAppoly 办公室的物联网网络中，员工可以向智能音箱询问牛奶供应情况，音箱则能通过共享的 IoT
  平台与冰箱通信，从而回复牛奶搁架的确切重量。冰箱和门铃可以协调牛奶配送订单；随着时间的推移，基于门铃的数据，冰箱可以学会只在有人能开门收货时才下单。


  来自 Roost 和 MyAppoly 办公室物联网网络的数据和洞察，对其他企业、组织和物联网网络也可能有用。例如，Roost 可能会了解到其客户在春季倾向于喝更多牛奶。Roost
  可以将这些数据出售给奶牛场，以便它们能够更准确地管理生产以满足需求。或者，办公室的门铃可以通知员工家里的烤箱，在她晚上到家前开始加热晚餐。




  ### 物联网系统间的互操作性


  物联网系统间的`互操作性`是指来自不同制造商的物联网系统和设备相互通信的能力。例如，如果`MyAppoly`办公室新装了一个`GE`智能灯泡，互操作性就意味着该`GE`灯泡和`Roost`设备能够作为同一物联网网络的一部分正常运行。`互操作性`得益于所谓的开放标准。标准是制造商在生产产品时遵循的一系列规范和规则。开放标准是公开可用的，而封闭标准通常是专有的。当多家公司遵循同一套开放标准时，其最终产品就能相互兼容。在这种情况下，同一网络上的`GE`灯泡和`Roost`冰箱将遵循同一套开放标准。开放标准鼓励创新，并使得连接不同制造商的设备变得简单。另一方面，封闭标准可以带来更安全、更可预测的网络，因为单一公司对整个标准保持完全控制。


  正如我们所看到的，当我们智能地利用冰箱自身的数据以及其他冰箱的数据时，我们的整体冰箱体验得到了提升。这个冰箱的例子总结了物联网的核心思想之一：我们对某事物了解的信息越多，我们拥有的知识就越丰富，从而能采取更好的行动。接下来，我们将讨论近期物联网快速增长所涉及的不同因素。


  ## 推动物联网发展的因素


  物联网背后的核心思想已经存在相当长一段时间了。可以说，这一想法最早出现于 1843 年，当时科学家们希望收集机器测量的天气数据能有助于未来做出更好的预测。^((31))
  1982 年，卡内基梅隆大学的一台可乐机接入了互联网，能够传输关于其库存和新添加饮料温度的数据。^((32)) 在 20 世纪 90 年代，物联网概念被称为嵌入式互联网。^((33))


  近年来物联网的爆炸式增长得益于多个领域技术的巨大进步。让我们回顾一下`MyAppoly`的新款智能冰箱，如果没有硬件、网络、大数据与数据分析以及云技术这四个主要类别中的各种近期创新，它根本不会存在。


  首先，`Roost`能够购买或制造出足够小巧、廉价且功能强大的芯片和传感器，以满足冰箱的需求。过去，制造出既小到能放入冰箱、又强大到能连接互联网的组件，要么成本过高，甚至根本不可能。如今，由于硬件技术的进步，我们看到了计算组件正变得越来越小、越来越廉价、能效更高且功能更强大。`摩尔定律`总结了硬件技术改进的这些趋势。


  `摩尔定律`以`仙童半导体`和`英特尔`联合创始人`戈登·摩尔`的名字命名，基于他 1965 年的预测：计算机芯片上的晶体管数量每年会翻一番。这意味着什么呢？简而言之，计算机使用二进制语言，即它们只理解由
  0 和 1 序列编写的信息。正如我们在第 3 章学到的，我们通过人类可读的编程语言让计算机做的一切事情，最终都会被翻译成二进制，以便计算机理解并执行我们的指令。晶体管是计算机内部代表
  0 和 1 的实际硬件部件。计算机芯片上的晶体管越多，该芯片的计算能力就越强。随着时间的推移，随着晶体管越来越小、计算机芯片越来越强大，更小的设备获得了更强大的计算能力。如今手持智能手机的计算能力远超
  30 年前巨型超级计算机的计算能力。得益于这些硬件技术的进步，我们的`Roost`冰箱拥有了所需的计算能力。


  其次，近期网络技术的改进带来了更快、更廉价、更可靠的互联网连接。毋庸置疑，更广泛、更可靠的互联网接入有助于设备保持连接。快速可靠的互联网连接对于关乎我们健康与安全的物联网网络至关重要。例如，如果智能锁保护着`MyAppoly`办公室，那么互联网中断的后果可能会危及办公楼的安全和安保。


  第三，得益于当前的大数据技术，`Roost`物联网网络能够成功利用海量数据。正如我们在第 5 章讨论的，大数据具有高速度（快速更新的数据片段）、高容量（大量数据）和高多样性（不同类型的数据）的特点。物联网网络生成的数据无疑符合大数据的特征，并且需要使用更新的技术。我们的`Roost`冰箱仅关于牛奶重量就产生了大量数据——想象一下，一旦我们把其他食品杂货装满冰箱，并将全国所有`Roost`冰箱的数据结合起来，将会产生多么庞大的数据量！数据挖掘和统计学方面的进步，以及第
  15 章讨论的机器学习进展，都有助于`Roost`从海量数据中获取有价值的见解。


  最后，云技术的进步使得物联网网络能够共享数据并进行通信。物联网平台本身的存在，正是因为多个设备能够与云端的一个核心软件进行通信。物联网设备可以将海量数据存储在云端，而如果直接存储在设备本身，这将是不可行的。由于我们上文讨论的硬件改进，这些服务器可以廉价地存储大量数据。云端强大的服务器可以执行计算密集型分析，而这些分析在较小的设备上是无法完成的。




  ### 物联网应用


  物联网带来的可能性是无穷无尽的，这个领域几乎必然会以我们无法预测的方式发展。当今一些颇具潜力的物联网应用领域包括：


  - *企业*：智能互联网络有潜力提高零售、农业和能源等领域的效率和生产力。例如，一个传感器网络可以收集农田土壤湿度数据，并让智能喷灌系统提高效率，减少灌溉过程中的浪费。

  - *智慧城市*：例如，智能交通灯可以利用历史数据优化交通控制，缓解拥堵。

  - *自动驾驶汽车与联网汽车*：自动驾驶汽车通过摄像头以及雷达、激光雷达等多种传感器来感知和导航周围环境。在未来的物联网世界中，自动驾驶汽车可以相互共享数据，告知对方交通事故和道路变化，甚至可以与交通灯和施工区域共享数据，以便规划更优路线并最大程度减少拥堵，此外还有许多其他可能性。

  - *可穿戴技术*：可穿戴技术在医疗领域具有额外潜力。智能手表和个人健身追踪器等可穿戴设备可以收集前所未有的、非常私密的健康相关数据，例如心率和睡眠时长。护理人员可以直接、持续地获取患者的健康信息，从而实现更好的医疗保健服务。

  - *智能家居*：从灯泡到门铃，一切都可以连接到互联网并相互连接。

  - *消费类机器人*：机器人技术是一个复杂的领域，需要一整本书才能深入解释。不过，我们在这里快速讨论几种产品。机器人的定义是能够自动执行一系列复杂动作的机器。有些机器人可以自动清扫地板，有些可以巡逻房屋以确保安全，还有一些可以取回物品。当机器人连接到互联网时，它们的能力只会增强。例如，一支相互通信的机器人吸尘器队伍可以协同工作，以最高效的方式协调清扫大面积区域。


  ### 优势与注意事项


  显然，物联网技术正在将其影响力扩展到我们生活的许多方面，包括我们的企业、家庭和健康。物联网不仅能让我们的生活更加便捷，还能使流程和交互更加智能、高效和便捷。据估计，到
  2025 年，物联网每年将推动数万亿美元的经济影响。^(³⁴)


  物联网网络能够带来的价值包括：


  - *更深入的洞察与更有效的行动*：正如我们之前讨论的，`MyAppoly` 的员工正受益于他们新智能冰箱提供的洞察和行动。

  - *改进产品开发*：`Roost` 可能会注意到，在使用了几个月后，牛奶重量传感器与物联网平台共享数据的速度变慢了。这一洞察使 `Roost` 能够智能地将资源投入到为下一代智能冰箱开发更好的牛奶传感器上，而不是仅仅猜测产品可能需要改进的地方。收集到的关于用户和设备性能的数据，使物联网设备制造商能够更高效地创造出更好的产品。

  - *直接的经济收益*：考虑一个由智能风力涡轮机组成的机群，它们作为物联网网络相互通信。在一场强风暴中，`10 号涡轮机` 开始运行不稳，并意识到它即将停机。它将其即将发生故障的信息发送给周围的涡轮机，这些涡轮机随后利用数据动态调整自身设置，以弥补
  `10 号涡轮机` 停机造成的损失。它们还向城市的智能建筑发出警报，告知其暂时减少的能源供应量预估，以便建筑物相应地进行节能。通过这种方式，停电造成的经济损失被降至最低。无需等待人工发现单个涡轮机停机并相应调整其余设置，一个由涡轮机和建筑物组成的智能网络可以协同工作，快速应对停机事件。

  - *设备的远程监控与控制*：由于设备通过互联网发送数据，因此可以从远处进行监控。在上面的例子中，技术人员可能不必亲自前往风力发电场就能检查涡轮机。

  - *更高的机器自主性*：在我们的涡轮机示例中，涡轮机之间的通信使得人类技术人员可以监控整个机群，而不是单独监控每台涡轮机。人类现在可以专注于整个机群的总体性能和健康状况，而不是多个单独单元的性能和健康状况。


  当然，物联网的发展也带来了我们需要应对的新挑战。随着这一持续发展，我们需要牢记并警惕一些事项，包括：


  - *数据安全*：我们在第 `12` 章中学到的每一次攻击都可能针对物联网设备。物联网网络增加了黑客获取数据和设备的途径，因此保护工作成为更重大的挑战。如果家庭网络被黑，攻击者可能控制家中的智能锁，并随时远程开门。如果医疗设备网络（例如患者可穿戴设备和医院设备组成的网络）遭到入侵，攻击者可能获取个人健康信息，甚至直接控制患者的药物和治疗。一辆被入侵的自动驾驶汽车可能导致交通被劫持或由攻击者设计事故。我们必须优先考虑网络安全。

  - *数据隐私*：随着物联网网络变得日益普及，制造商将能够访问大量非常私密的用户数据，范围从医疗保健数据到与智能音箱的对话，再到访问过某人住宅的人员记录。这些数据都是私密的，并且可能很敏感，制造商和政府有责任制定相关协议，涉及：(1)
  数据的存储方式和存储时长；(2) 数据在汇总分析时是否进行去标识化处理；(3) 用户可以选择与其他公司或设备共享或不共享的数据类型。如果没有全面的数据隐私实践，用户不太可能将物联网网络作为日常生活的一部分。

  - *互操作性与标准*：物联网设备由众多公司使用各种技术制造。我们如何预测哪些设备需要相互通信，并据此制定标准？

  - *基础设施*：回想一下，互联网依赖于遍布全球的物理硬件基础设施。物联网设备的增长将给我们当前的网络基础设施带来压力。


  ## 结论


  本书中讨论的许多技术共同创造了物联网技术，包括网络、数据库、云、规模化开发、机器学习以及网络安全。物联网是一个不断扩展的智能设备网络，这些设备始终在相互通信、共享信息并对新知识和洞察做出响应。尽管我们可以从物联网网络中获得很多好处，但如果物联网要发展并成为我们日常生活的标准组成部分，我们必须极其谨慎地保护用户数据和设备安全。


