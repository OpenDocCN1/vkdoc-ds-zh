    make sure that their app functions well across many versions of the operating
    system. This outdated software can also lead to increased security risk, as we
    discussed in Chapter [12](#321739_2_En_12_Chapter.xhtml). Many hackers take advantage
    of Android device fragmentation to target malicious code at Android devices.


    Finally, Android and iOS differ when it comes to deploying the app on their respective
    app stores. While the two don’t release statistics on the number of app applications
    they receive, Android anecdotally seems to accept a higher percentage of apps
    into its app store than iOS. Apps are therefore more likely to be rejected from
    the Apple App Store than the Android Play Store.


    Both Android and iOS come with advantages and disadvantages. When deciding which
    platform to focus on, products often weigh consumer base and ease of development
    most highly. If you still can’t pick one or want to release to both platforms
    at once, cross-platform development may be the appropriate route.


    ### Cross-Platform Development


    Although truly native apps offer the best performance, it takes quite a bit of
    development overhead to write and to maintain them for both Android and iOS. Not
    only does each platform require a different codebase, but each change to the app
    requires separate updates and testing. As a result, cross-platform solutions are
    rising in popularity. Cross-platform mobile development refers to a process where
    the developer writes a single app to run on multiple mobile operating systems.
    Several existing frameworks support cross-platform mobile development, many of
    which allow developers to code entirely in JavaScript and other web technologies.
    These frameworks can be used to create either native or hybrid web applications.


    Native mobile applications are written using frameworks that offer developers
    the use of generic components that are translated on each device into native components.
    Popular tools include React Native, Flutter, and Xamarin. There are differences
    in how the three translate platform-agnostic code into native code, but the end
    result is mobile apps that run almost as fast as completely native apps. Depending
    on the desired functionality, these applications may still require platform-specific
    code. However, the majority of the codebase remains the same.


    Hybrid cross-platform mobile frameworks include Ionic, Apache Cordova, and Onsen
    UI. Remember that hybrid applications combine the ease of writing desktop web
    applications and the features of native mobile applications. Like frameworks for
    native mobile applications, these frameworks translate platform-agnostic code
    into hybrid code. Furthermore, these frameworks provide the developer with access
    to native features, as described earlier.


    ### Native vs. Cross-Platform Development


    For many products, cross-platform development makes sense due to the plethora
    of advantages across three axes: development efficiency, developer accessibility,
    and user exposure.


    The most marked difference between native and cross-platform development is the
    drastic efficiency improvement across development cycles. Since developers only
    need to write and to maintain one codebase, releasing new updates is much quicker.
    The use of web technologies can lead to faster development as well. Native code
    needs to be compiled before it runs, while web code can instantly refresh (called
    “hot reload”) with new changes. Though compile times range from a few seconds
    to tens of minutes, these slowdowns can add up over time.


    The use of web technologies also makes cross-platform development accessible to
    more developers. Since fundamental web technologies such as JavaScript are known
    relatively widely, new developers can ramp up on the project more quickly. Furthermore,
    cross-platform solutions eliminate the need for the company to hire iOS and Android
    experts separately for each codebase.


    Finally, cross-platform development is an excellent tool for driving user adoption.
    By employing a cross-platform development process, you can launch to both Android
    and iOS users at the same time, rather than having to focus on one or the other
    at the start.


    Cross-platform development has its drawbacks, and many prominent companies such
    as Facebook and Airbnb have turned away from it. It can speed up the development
    cycle, but the speed of the mobile applications themselves suffers. The device
    has to translate the cross-platform code into native code, which takes additional
    time. For applications with time-sensitive use cases that need to run quickly,
    this can ruin user experience. Furthermore, apps developed via cross-platform
    development cannot take complete advantage of the native code structure. While
    these frameworks cover most tools for each platform, they can’t capture all of
    the per-platform intricacies. As a result, more complex products still require
    somewhat significant amounts of platform-specific code. In the end, this can feel
    like supporting three platforms instead of two, taking away from the fast iteration
    speed that cross-platform development boasts. Finally, since cross-platform solutions
    are still relatively young, they are more likely to provide a buggy experience
    to developers as they develop into a mature framework. Cross-platform development
    can serve a fledgling product well, but it is by no means a panacea to the troubles
    of mobile development.'
