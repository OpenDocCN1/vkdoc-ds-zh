- fmt: '# Step 5: The Other Miners Verify the Block Containing the Transaction


    Although mining a block is a computationally intensive process, verifying that
    a block is valid is a simple job. Once the other miners receive the mined block,
    all they have to do to validate it is to run it through the `SHA256` algorithm
    once. If the block hash value is below the target, the miners accept the block
    as valid and append it to their local copy of the blockchain. The block has now
    been *confirmed*. If it sounds like this is a really complicated process, it is.
    If you want to create a process that does not require a central authority figure,
    you need to get creative and, in this case, you need to get technical. There is
    a tradeoff here though—in exchange for creating a decentralized system, the “game”
    that miners need to play slows things down. Transactions cannot be processed as
    quickly as some would want, which is why some are starting to create their own
    versions of the blockchain, as discussed later in the chapter.


    Once a block is appended to the blockchain, it is almost impossible to remove
    or change the block. The deeper a block is in the blockchain, measured by the
    number of blocks that come after it, the harder it is to remove or change that
    block. Recall that blocks contain links to previous blocks; thus, in order to
    re-mine a block (a technical way of describing the process of changing a block’s
    contents) that is 5 blocks deep, an attacker would not only have to re-mine that
    block but also the 4 blocks that come after it and any new block that has been
    added to the blockchain during this time. It is, in practice, impossible for a
    single miner to have the electrical output to produce a hash rate high enough
    to perform such an attack.


    Therefore, the deeper a block is in the blockchain, the more immutable it is and
    the more Alice and Bob can be certain that their transaction has been securely
    approved. The deeper a block is in the blockchain, the more *confirmations* it
    is said to have. Hence, a block that is 5 blocks deep is said to have five confirmations.
    A transaction is considered securely final after *six confirmations*.


    This five-step process demonstrates the simple rules that are followed by thousands
    of independent miners to asynchronously achieve consensus about the state of the
    Bitcoin blockchain. The *state of the Bitcoin blockchain* is a technical way of
    saying the number of Bitcoins that each user holds. The process is asynchronous
    because there is never a point in time when an election or ruling takes place
    that stipulates a consensus on the state of the blockchain. Instead, the proof-of-work
    algorithm is intended to act as a lottery of which miner gets to produce the next
    block and consequently extend the blockchain. As such, no central authority, such
    as a bank, needs to be trusted in this decentralized network.


    ## The Price of Bitcoin


    The *price of Bitcoin* is dictated by supply and demand. At any given point in
    time, the value of Bitcoin is the value at which it was traded in the latest transaction.
    For example, if Alice sends half of a Bitcoin to Bob for $500, then the price
    of one Bitcoin at that given point in time is $1,000. Bitcoins can be bought on
    online *exchanges*, such as Coinbase or Bitstamp. Most exchanges determine the
    price of Bitcoin by aggregating the prices of the latest transactions.


    Since there is no central bank that controls the value of Bitcoin through monetary
    policy, Bitcoin has thus far suffered from high *price volatility*. Many critics
    of Bitcoin argue that price instability prevents mainstream adoption of Bitcoin
    as a medium of exchange and renders Bitcoin a speculative instrument instead.
    Proponents of Bitcoin argue that price volatility will decrease as Bitcoin usage
    rises. If more merchants begin accepting Bitcoin payments, fewer users will seek
    to convert their Bitcoins back to fiat currency. This will lower speculation levels
    and begin stabilizing the price. Currently, however, Bitcoin and many other cryptocurrencies
    face high price instability.


    ## Storing and Losing Bitcoins


    Users store Bitcoins in pieces of software known as *wallets*. Despite the name,
    wallets do not actually store your Bitcoins; rather, they scan the Bitcoin blockchain
    to calculate how many Bitcoins you have access to with your private keys. The
    wallet software also takes care of generating private keys and creating corresponding
    public keys and addresses for Bitcoin users.


    There are two ways in which your Bitcoins can be *stolen*. The first method involves
    the thief getting access to your private keys. Once the thief gains access to
    the private keys, they can use them to transfer all Bitcoins associated with the
    private keys to themselves. The second method involves a hacker hacking into the
    servers of an exchange where Bitcoins are traded. Most exchanges store the private
    keys to the Bitcoins that are currently being traded in a database. If the hacker
    gains access to this database, he or she can transfer any Bitcoins associated
    with the private keys to himself or herself.


    The Bitcoin network itself is vulnerable to attacks, primarily to attacks launched
    by malicious miners. The most prominent of such attacks is known as the *51% attack*.
    Recall that consensus in the Bitcoin network is distributed, whereby simple rules
    are followed by many independent miners to produce new blocks. If a miner decides
    to disobey the rules and begins mining otherwise invalid blocks, the Bitcoin network
    will simply disregard him or her, unless the dissenting miner comprises a *majority*.
    A majority, in this case, is measured in hash rate, meaning that if a miner, or
    a group of colluding miners, controls more than 51% of the power to produce new
    blocks, they can dictate what blocks get produced. In such a scenario, the malicious
    miners can undo transactions and spend their Bitcoins more than once. As a result,
    the decentralization of the Bitcoin network is undermined. Due to the vast amount
    of miners, it is very difficult to conduct a 51% attack on Bitcoin because of
    the sheer amount of energy, primarily electricity, required as input to conduct
    such an attack. An attacker would need the electrical output of all of Austria
    to conduct such an attack. To date, there has not been a known instance of a 51%
    attack on the Bitcoin network.


    What has happened, however, is that a minority of miners have disagreed with some
    of the rules that govern Bitcoin and decided to change them. When a group of miners
    disagrees with the rules that are followed in the distributed consensus of the
    Bitcoin network, they may choose to no longer participate in that network as miners.
    This is known as a *fork* because the dissenting miners split away from the Bitcoin
    blockchain and begin working on their own blockchain, which entails the creation
    of a new cryptocurrency. The most popular Bitcoin fork happened on August 1, 2017,
    when the cryptocurrency Bitcoin Cash was created. The miners who split away from
    the Bitcoin network to create Bitcoin Cash disagreed, among other things, with
    the Bitcoin consensus rule that stipulates that valid blocks have a maximum size
    of 1 MB. The miners wanted to increase the block size in order to increase the
    number of transactions that can be validated in one block. The block size of Bitcoin
    Cash blocks was increased to 8 MB.'
