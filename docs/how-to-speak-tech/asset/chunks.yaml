    ### About the Author


    ### About the Contributors


    # 1. The Internet


    Most of the people in the world are connected through a global network called
    the Internet. Its precursor was the Advanced Research Projects Agency Network
    (`ARPANET`), which was funded by the US Department of Defense to enable computers
    at universities and research laboratories to share information. `ARPANET` was
    first deployed in 1969 and fully operationalized by 1975. `ARPANET`’s solutions
    to the difficulties inherent in sharing information between computers formed the
    backbone of the global Internet.


    How did `ARPANET` do it? Consider the following analogy. Local towns tend to be
    well-connected by roads. Major roads connect towns, and even larger highways connect
    states. To be a part of the larger national network of roads, a town simply needed
    to develop a single road linking the town to the highway. This road would connect
    the town’s residents to the rest of the country. Similarly, using communication
    lines, satellites, and radio transmission for communication, `ARPANET` connected
    all the *local area networks* (`LANs`) (the town roads) and *wide area networks*
    (`WANs`) (the interstate system) together using the `WAN` *backbone* (the central
    highway).


    Conceptually, we see the Internet is a network of networks—but how are these networks
    connected? To create a primitive local network, one can connect a few computers
    together with a wire, a telephone system, or a fiber-optic cable (which uses light
    instead of electricity). To connect multiple local networks together, one can
    use a “connector” computer called a *router*, which expands the size of the subnetwork.
    If we connect each of these local subnetworks to a single central cable, all of
    our local networks are connected, thus creating the Internet.


    Given that the Internet is essentially a physical connection of computer clusters,
    how does it actually function as a smoothly performing single-communication-line
    network? The answer to this question is where the real technical innovation of
    the Internet lies.


    ## Packet Switching, TCP, and IP


    Keep in mind that the whole reason researchers began investigating networks is
    that they needed a way to share information across computers. In the same way
    that highways have exit signs and speed limits, there needed to be rules to guide
    information flow on the Internet. To solve this problem, the Advanced Research
    Projects Agency (`ARPA`) defined how information would travel with two pieces
    of software: the *Transmission Control Protocol* (`TCP`) and the Internet Protocol
    (`IP`). These two components of the Internet’s software layer operate on top of
    the hardware layer, the cables and devices that physically comprise the Internet.


    Historically, when two computers were connected with a cable, communication was
    one-way and exclusive. If computer A sent something to computer B, data moved
    along the wire; if any other attempt at communication were made, the data would
    collide and no one would get what they wanted. To create a network allowing millions
    of people to interact simultaneously and instantaneously, the technology of the
    time would have required a prodigious mess of cables. The only way to reduce the
    need for wires was to develop a method for data to travel from multiple sources
    to multiple destinations on the same communication line.


    This was accomplished through *packet switching*. Researchers discovered that
    they could break any information (such as a text, music, or image file) into small
    “packets”; doing so enables a single wire to carry information from multiple files
    at once. Two challenges seem obvious: how do all the packets make it to the right
    destination, and how does the recipient put them back together?


    Taking a step back, every page on the Internet is a document that somebody wrote
    that lives on a computer somewhere. When you access a web page with your browser,
    you are essentially asking for permission to look at some document sitting on
    some computer. For you to view it, it must be sent to you—and `TCP`/`IP` helps
    do just that.


    `TCP` breaks the document into little packets and assigns each one a few tags.
    First, `TCP` numbers the packets so they can be reassembled in the right order.
    Next, it gives each packet something called a *checksum*, which is used to assess
    whether the arriving data were altered in any way. Last, the packet is given its
    destination and origin addresses so it can be appropriately routed. `Google Maps`
    can’t help you here, but `IP` can. `IP` defines a unique address for every device
    on the Internet.


    So these packets have your computer’s `IP` address. `IP` helps route these packages
    to their destination and does so in a process much like the US Postal Service’s
    method for delivering mail. The packets are routed from their start to the next
    closest router in the direction of the destination. At each step, they are sorted
    and pushed off to the next closest router. This process continues until they arrive
    at their destination. In this way, `IP` software allows an interconnected set
    of networks and routers to function as a single network.


    One prized characteristic of `IP` is the stability guaranteed by network redundancy.
    If a particular segment of the overall network goes down, packets can be redirected
    through another router. When the packets reach you, `TCP` verifies that all packets
    have arrived before reassembling them for viewing.


    Several computer companies had actually already developed independent solutions
    to the problem of computer-to-computer communication, but they charged people
    to use them and they weren’t mutually compatible. Why buy company A’s solution
    if it did not connect you to people who bought company B’s solution? What distinguished
    `ARPANET` was that `ARPA` published its results for free, making `TCP`/`IP` publicly
    accessible. When the US military branches adopted `TCP`/`IP` in 1982, `ARPA`’s
    open and free approach was legitimized and institutionalized. Ever since, computers
    could only send or receive information via the Internet if they had `TCP`/`IP`
    software installed.


    Thus, starting in 1982, researchers could share information around the world,
    but the question remained how to display and view that data. In 1990, Tim Berners-Lee
    and others at the European Organization for Nuclear Research (`CERN`) developed
    the precursors of *Hypertext Markup Language* (`HTML`) and *Hypertext Transfer
    Protocol* (`HTTP`), which jointly enable the exchange of formatted and visually
    appealing information online. After 1991, the first graphical browsers—programs
    that allow you to view web pages on the Internet—were released. This created an
    attractive and efficient way to share and consume information on the Web.


    Around this time, the cost of personal computers dropped, and online service providers
    such as `AOL` emerged, offering cheap access to the Internet. This confluence
    of factors led to the Internet’s rapid growth into the network we use today.


    ## HTTP and Using the Internet


    How data travel physically is pretty straightforward and defined by the protocols
    developed by `ARPA`—but how do you tell someone to send the data in the first
    place? What is actually happening behind the scenes when somebody—let’s say you—visits
    your brainchild, `MyAppoly`?'
