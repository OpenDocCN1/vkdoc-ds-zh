- fmt: '# Big Data


    How is *big data* different from normal data? Organizations have of course been
    amassing information even before there were computers, but the amount of data
    that can be collected and stored has dramatically increased. The size of data
    collected today is unable to be processed by our traditional methods. Relational
    databases are being pushed to the wayside because they are simply too costly and
    restrictive; the more scalable and flexible non-relational models are coming to
    the fore. To give you an idea of scale and growth, it is estimated that 1.2 zettabytes
    (1.2 × 10^(21) bytes) of data were created in 2010.^([⁴](#fn4)) As a comparison,
    it is estimated that there are between `10^(20)` and `10^(24)` grains of sand
    on our planet. Imagine sifting through all of that! If you assume the amount of
    data we have doubles every couple of years, we are in store for a lot of data
    centers.


    Before commenting on how one should even begin to study so much data, there are
    a few terms used to describe data. The first is *volume*, one that is most obvious
    from big data’s name. The amount of information is the largest problem and has
    prompted engineers to think about how distributed systems can serve as the solution.
    Next is *velocity*, which refers to the rate at which new data is created. The
    velocity of Facebook data is probably much higher than that of `MyAppoly`, for
    example. With so many interactions on Facebook every day, Facebook needs to make
    an important decision: what do they keep and what do they throw away? Online shopping
    websites face a similar dilemma. Every time a user clicks an item or writes a
    search term, the company must decide if they want to save that information. Saving
    more information, however, may compromise the speed with which they are able to
    convert data into insights. If retailers are slow to customize the web experience
    for their customers due to a delay in data processing, faster competitors are
    likely to win. Last, there is *variety*. If the data comes from several sources
    and in several forms, it presents a much more complicated set of issues to tackle.


    You can now go to your data team and tell them that the variety of your data complicates
    your ability to store it and that the current velocity is overwhelming your limited
    volume server capacity. More colloquially, you might just say “We need more money!”


    Let us assume you have a large volume of data of significant variety. The chances
    that you can make any sense of the information by looking at it are little to
    none, especially if there is no obvious pattern. One word you might come across
    in big data is *Hadoop*, a software framework that allows organizations to run
    tests on their data with the hope of answering questions. As covered in earlier
    chapters, distributed architecture is the key to our ability to store and process
    this quantity of information. Hadoop allows organizations to make sense of their
    data by spreading it out over a bunch of powerful processors that work in parallel
    to study the information. The general method Hadoop uses is called *MapReduce*,
    which consists of two parts: map and reduce. Let us say you have some question
    you want to determine from your dataset and your engineers write a function that
    theoretically will yield the right answer. *Map* will separate the task into several
    parts and distribute it across several machines. When this phase is complete,
    *reduce* will combine the results from each machine into a single task to complete
    the analysis. No single machine would be able to do this much work in a timely
    manner, so Hadoop’s divide-and-conquer strategy is a very powerful tool. Other
    tools, such as *Spark*, are also gaining popularity.


    ## Conclusion


    At this point, you have learned some of the basics of how `MyAppoly` runs on the
    back end, what users will interact with at the front end, and the way data factors
    into all of it.


    Footnotes [1](#321739_2_En_5_Chapter.xhtml#Fn1_source)


    # 6. Leveraging Existing Code: APIs, Libraries, and Open-Source Projects


    Imagine how much more slowly society would have developed if no one could leverage
    the inventions of others to design new products. Using others’ innovations for
    new discoveries is crucial. Maybe a drug developed for one disease can be adapted
    to cure another. Perhaps flexible glass created for more durable dishware can
    be used to make unbreakable cell phone screens. We continuously search for the
    next best thing, and we cannot expect to find it if we always begin from scratch.


    Luckily, `MyAppoly` doesn’t need to start from scratch either. There are a myriad
    of ways `MyAppoly` can leverage existing code. Say you want to include a map in
    `MyAppoly`. Building the map from scratch is hardly worthwhile for your team,
    given that other companies have already dedicated the time and money to do just
    that. Google’s willingness to allow developers to use Google Maps points to a
    vital driver of the rapid proliferation of websites and applications in the Web
    2.0 era. The popular adage “Don’t reinvent the wheel” defines the tech world,
    which has developed a culture of sharing information. Internet companies carefully
    protect their information, but in general, they are more open to sharing their
    discoveries than organizations of the past. This collaborative culture partly
    explains the extraordinary growth, fertility, and wealth of Silicon Valley.


    You want to focus on what makes `MyAppoly` different, not on rebuilding the code
    that other companies already offer to you. But what are these ready-made tools?
    This chapter describes the essentials of *application programming interfaces*
    (`APIs`).^([⁵](#fn5)) It also addresses the open-source movement and its importance.


    ## Application Programming Interfaces


    Say you want to show your users the locations of the nearest ATMs on a map and
    accept credit card payments on `MyAppoly`. Either your team can build these features
    from scratch, which will increase development time considerably, or you can utilize
    the work of others, such as Google Maps and Stripe. Some `APIs` are free, while
    others require payment. Google Maps allows you to use their maps within `MyAppoly`
    for free, whereas Stripe collects a minor fee for each credit card payment they
    process for you. The ability to easily integrate technology by plugging one company’s
    product into another’s has allowed startups to grow quickly and become sophisticated
    in a relatively short time. `MyAppoly` can benefit from not only the `APIs` of
    others but also by releasing one of its own. If other companies become dependent
    on the data and functionality made available through `MyAppoly`’s `API`, your
    business will become even more attractive.'
