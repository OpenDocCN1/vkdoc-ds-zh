    \ Apress Media, LLC is a California LLC and the sole member (owner) is Springer\
    \ Science + Business Media Finance Inc (SSBM Finance Inc). SSBM Finance Inc is\
    \ a Delaware corporation.\n\n*Because the next decade expects us to know different\
    \ things than the last one.*\n\n# Introduction\n\nOn January 5, 2012, Michael\
    \ Bloomberg, then the Mayor of New York City, tweeted: “My New Year’s resolution\
    \ is to learn to code with Codecademy in 2012! Join me. [`http://codeyear.com/#codeyear`](http://codeyear.com/%2523codeyear)\
    \ .” Codecademy, a startup that offers coding lessons to millions of users, is\
    \ doing a remarkable job of making useful knowledge available for free. But why\
    \ is learning how to code, of all things, among Bloomberg’s top personal priorities?\n\
    \nMr. Bloomberg hardly needs a job, but his tweet reflects his opinion of what\
    \ the new credentials for informed citizenship and economic participation are\
    \ in a society transformed by the Internet and technology. These ubiquitous forces\
    \ have revolutionized how we conduct business, communicate with each other, organize\
    \ our lives, order our food, plan our weddings, file our taxes, purchase our wardrobes,\
    \ and much more. Technology is no longer important only to tech companies, it\
    \ is shaping and disrupting every industry. No longer do only technologists require\
    \ tech knowledge, everybody does. It is so important that I believe computers,\
    \ the Internet, and coding should be incorporated into mandatory instruction in\
    \ schools alongside reading and math.\n\nIt is neither practical nor logical that\
    \ everyone learn to code sophisticated applications. But people who work in, around,\
    \ or with tech—almost everybody—should understand, at least at a high level, how\
    \ the Internet and its applications work. This knowledge will unlock their ability\
    \ to contribute to conversations that previously may have seemed unfamiliar or\
    \ daunting.\n\nThe purpose of this book, therefore, is not to teach you how to\
    \ code, but rather to outline the major concepts and technologies related to each\
    \ phase of a web and mobile application’s life cycle. It also provides an introductory\
    \ primer on each of the latest tech trends, including blockchain, artificial intelligence,\
    \ and augmented and virtual reality. Whether you are an aspiring Internet tech\
    \ executive, a judicious venture capital investor, or a newcomer to a company\
    \ managing technology, this content is probably relevant for you. Even if you\
    \ have no intention of launching an Internet company yourself, anyone living in\
    \ a world in which “google” and “friend” are dictionary verbs should read this\
    \ book. To too many people, the Internet and its apps are a black box, but there\
    \ is no reason anyone should think that searching for a friend on Facebook is\
    \ magical. As long as you understand a few key concepts, you can plumb the mystery.\n\
    \nAs in any line of specialized work, “techies” deploy technical vocabularies\
    \ largely incomprehensible to non-techie colleagues and outsiders. As a result,\
    \ the gap between techies and non-techies only worsens. This dynamic is inefficient\
    \ in an age of constant information overflow. If techies made a more conscious\
    \ effort to demystify their jargon and if employers encouraged their non-techie\
    \ employees to become more digitally literate, we could have a more informed population,\
    \ greater diversity, better managers, more efficient processes, smarter investors,\
    \ and more discoveries. That’s exciting!\n\nThe book can be considered in two\
    \ parts. The first thirteen chapters cover what I believe everyone should know\
    \ about the workings of an Internet application. From the back end and the front\
    \ end to promotion and cybersecurity, I see the list of topics included in this\
    \ book as topics that you are likely to come across in the tech world and are\
    \ always likely to be true of Internet applications. Though technology evolves\
    \ rapidly, applications will usually have the same types of components with similar\
    \ kinds of challenges. The tools we use might change over time, but this book\
    \ focuses on the basic concepts, not on specific technologies.\n\nThe last four\
    \ chapters of the book respond to the many important tech concepts that have left\
    \ technical and nontechnical people alike asking questions about their applications\
    \ and potential impact. This part provides introductory primers on what are some\
    \ of the top tech trends to know.\n\nThe material is presented in a way for anyone\
    \ to digest. With a mix of stories, analogies, and de-jargonized explanations,\
    \ the book strives for accessibility. Though the material comes from academic\
    \ papers, news articles, textbooks, and interviews, the tone of the book is one\
    \ that should feel like a friend explaining these concepts to you in a casual,\
    \ albeit slightly nerdy, conversation. There is always a tension between simplification\
    \ and thoroughness; the book tries to preserve the integrity of the information\
    \ while shaving away nonessentials.\n\nThe book is connected through a narrative\
    \ starring you as the main character. You are building an application called MyAppoly.\
    \ This application can exist in pretty much any context. If you are an entrepreneur,\
    \ MyAppoly is your ticket to a $1 billion exit (hello Instagram). If you are a\
    \ nonprofit executive, MyAppoly helps you fundraise from your donors. If you work\
    \ at a Fortune 500 company, MyAppoly can help you stay modern and relevant. MyAppoly\
    \ is anything you want it to be.\n\nReading this book will help you meet the new\
    \ year’s resolution urged by Mr. Bloomberg. Everybody knows that our world is\
    \ becoming technical quickly. Every discovery is challenging us all to learn new\
    \ things and question what we knew to be true and what we thought was the limit.\
    \ You may not have the time to learn how to code, but how would an understanding\
    \ of the basics help you? Maybe it will make you a better manager if you can relate\
    \ to your developers. Maybe you will be a better investor who can differentiate\
    \ between the realistic and the impossible. Maybe you will land your dream job\
    \ at that tech company you recently discovered. At the very least, you should\
    \ be able to understand tech news without having to consult an expert. It is time\
    \ for technology to be democratized. It is time for you to learn how to speak\
    \ tech.\n\n# Acknowledgments\n\n> *An investment in knowledge pays the best interest.*\n\
    > \n> —Ben Franklin\n\nThis book would not exist without the lessons I learned\
    \ from my parents and grandparents about the value of education and community.\
    \ They raised me with the belief that curiosity and knowledge are the keys to\
    \ a fulfilling life, and that we must do what we can to give back to others because\
    \ we are products of our environments. These values catalyzed my interest in publishing\
    \ *How to Speak Tech* and engaging deeply in the mission behind it. The book is\
    \ motivated by the desire to help broaden access to STEM education to ensure that\
    \ people who are \"nontechnical\" have the knowledge they need to be effective\
    \ in a world where a basic understanding of technology almost seems required.\
    \ It speaks to endeavors to retrain those displaced by AI and automation, programs\
    \ that evangelize STEM education for the next generation, and organizations that\
    \ battle for fair and diverse representation in STEM fields. We are committed\
    \ to making a difference, and the dedication to produce *How to Speak Tech* is\
    \ in service of these efforts.\n\nI would like to express my immense gratitude\
    \ to my stellar contributors who joined the team and worked tirelessly to share\
    \ their expertise because they too believe in our mission. To Ashi, Cheenar, Vojta,\
    \ Khoi, and Jay—a sincere thank you for the hard work you put into the chapters\
    \ you contributed. They are showcases of your knowledge, skill, and passion. Thank\
    \ you for letting me learn from you, and I am excited to see where your talent\
    \ takes you. Ashley, thank you for taking a lead on the edits to the first edition.\
    \ Your excitement for computer science education is evident and inspiring. Ashi,\
    \ Cheenar, and Jay, thank you for your editing support as well, particularly Ashi\
    \ who helped a tremendous amount at the 11th hour. And one special thank you from\
    \ our whole team to the countless number of readers who helped us refine our chapters\
    \ over the last year.\n\nLast but not least, I am grateful to my family, friends,\
    \ and mentors for their guidance over the years. Everyone’s endless support and\
    \ unconditional love are the real bibliography of this book."
