  trans: '

    ## 开源


    与通过 API 和库传播信息相关的是*开源*项目的增长。*开源*的最佳解释可通过审视软件开发的历史来获得。


    尽管难以想象，但曾有一段时间，所有软件开发都归研究人员所有，并在大学中开发；研究成果可以不受任何限制地共享。毕竟，所有研究都是为了公共利益。在 20 世纪
    60 年代，IBM 等公司借鉴了这一传统；当它们推出首批大规模商用计算机时，其软件是免费提供的。随着技术的发展、竞争的加剧以及硬件价格的下降，公司开始将软件视为可以支撑其业务的替代收入来源。软件变成了商业化的专有财产，任何未经公司知晓的复制行为都属非法。


    麻省理工学院的理查德·斯托尔曼对这种文化变迁感到不满。由于担心麻省理工学院会控制他的新项目及其分发，斯托尔曼离开了大学，继续开发他的 GNU 软件——一个完全由自由软件组成的计算机操作系统（例如，相当于免费版的
    Windows 或 Mac OS）。随着斯托尔曼的开发，他对商业化的反对以及对平等获取的倡导启发了他人。1985 年，他创立了自由软件基金会（FSF）以支持
    GNU 项目。FSF 于 1988 年颁布了《通用公共许可证》（GPL），旨在保护基于*著佐权*原则的自由使用和自由获取。与保护财产权（版权）不同，“著佐权保护的是复制、分发和修改产品的自由”。


    GPL 的宣言挑战了专有软件的商业观念，而在 20 世纪 90 年代，对*自由*一词的误解也随之出现。FSF 中的“自由”指的是自由，而非价格。


    根据 FSF 的定义，“如果程序的用户拥有以下四项基本自由，则该程序是自由软件”：^(⁶)


    *   出于任何目的运行程序的自由（自由 0）。

    *   研究程序如何工作并为其需求修改程序的自由（自由 1）。因此，用户必须能够访问源代码。

    *   重新分发副本以便帮助邻居的自由（自由 2）。

    *   改进程序并向公众发布改进版本，从而使整个社区受益的自由（自由 3）。同样，确保这项自由也需要能够访问源代码。


    通过其公共教育努力——FSF 使用了诸如“言论自由，而非免费啤酒”这样的口号——FSF 试图纠正人们认为它反对商业软件的误解。


    回顾第 3 章，构成程序的代码被称为*源代码*。为了能够被阅读、理解和修改，源代码必须对公众开放——因此有了*开源*这个术语。然而，源代码的可访问性是程序被视为*开源*的必要条件，但并非充分条件。任何人都必须能够不受限制地在自己的创作中使用该代码。成立于
    1988 年的开源促进会（OSI）颁布了“开源定义”，内容如下：^(⁷)


    *开源不仅仅意味着访问源代码。开源软件的分发条款必须符合以下标准：*


    1.  *免费再分发*：许可证不得限制任何一方将软件作为包含来自多个不同来源程序的聚合软件分发的一部分进行销售或赠送。许可证不得对此类销售收取版税或其他费用。

    2.  *源代码*：程序必须包含源代码，并且必须允许以源代码形式和编译形式分发。当某种形式的产品未随附源代码分发时，必须有一种广为人知的方式，以便以不超过合理的复制成本获取源代码，最好是免费通过互联网下载。源代码必须是程序员修改程序时首选的形式。禁止故意混淆源代码。

    3.  *衍生作品*：许可证必须允许修改和衍生作品，并且必须允许在原始软件许可协议的相同条款下分发。

    4.  *作者源代码的完整性*：许可证只有在允许随源代码一起分发允许在构建和编译时修改程序的“补丁文件”时，才能限制以修改后的形式分发源代码。许可证必须明确允许分发基于修改后的源代码构建的软件。许可证可以要求衍生作品使用与原始软件不同的名称或版本号。

    5.  *不歧视个人或团体*：许可证不得歧视任何个人或群体。

    6.  *不歧视特定领域*：许可证不得限制任何人在特定领域使用该程序。例如，它不得限制该程序用于商业用途或基因研究。

    7.  *许可证的分发*：附属于该程序的权利必须适用于所有程序被重新分发的对象，无需这些对象执行额外的许可协议。

    8.  *许可证不得特定于某个产品*：附属于程序的权利不得依赖于该程序是某个特定软件分发的一部分。如果该程序从该分发中提取出来，并按照程序许可协议的条款使用或分发，那么所有被重新分发给该程序的对象都应享有与原始软件分发所授予的相同的权利。

    9.  *许可证不得限制其他软件*：许可证不得对与许可软件一起分发的其他软件施加限制。例如，许可证不得要求同一介质上分发的所有其他程序都必须是开源软件。

    10. *许可证必须技术中立*：许可证的任何条款不得基于任何特定的技术或接口风格。


    大约在这个时候，Red Hat 成立，这是一个致力于改进 Linux（一个开源计算机操作系统）并教育他人如何使用它的组织。它是第一家整个商业模式都专注于著佐权产品的公司。开源系统开始挑战包括微软在内的大型软件公司的地位。^(⁸)


    自那以后，许多其他开源许可证被创建出来，例如网景公司的 Mozilla 公共许可证。如今，开源的不断发展体现在大约 50 种经 OSI 批准的特定开源许可证中，这些许可证大致分为以下两类：


    1.  *学术许可证*：在这些许可证下，大学将其研究成果分发给公众，并允许其软件和源代码被使用、复制、修改和分发。伯克利软件分发（BSD）许可证是典型代表，体现了“不附带任何条件”的方式。所有在学术许可证下许可的代码都被添加到一个通用代码池中，可用于任何目的，包括创建商业软件。你可以从这个代码池中借用代码，而无需回馈任何内容。

    '
- fmt: '## Reciprocal Licenses


    Under these licenses, the code is entered into the pool of open-source software.
    Anybody can use the code from this pool for whatever purpose, but if you choose
    to spread your newly created code, it must be distributed under the same license.
    In other words, you may leverage this code to produce something new, but you must
    contribute your new creation to the pool of code for others’ use. `GPL` is an
    example of a reciprocal license.


    Many people have concerns about the quality of open-source code. One rubric for
    evaluation consists of reliability, performance, and total cost of ownership.
    Other metrics used to evaluate quality include portability, flexibility, and freedom.
    Whatever metrics you select, the key point is that the many advantages of leveraging
    existing code can be offset by the risk inherent in relying on others’ code and
    systems. Nonetheless, several open-source projects have attained the same complexity
    levels and quality standards as commercial software.


    ## SDKs


    As a quick aside, you may hear the term SDK, or software development kit, thrown
    around the `MyAppoly` office, especially as the team talks about mobile app development
    (Chapter [13](#321739_2_En_13_Chapter.xhtml)). To make it easy for developers
    to develop for a platform, like the iOS software powering Apple’s iPhones, the
    platform provider might offer an SDK. This SDK can be downloaded and includes
    whatever a developer needs to start building apps for its platform. That might
    include documentation, an integrated development editor as discussed in Chapter
    [3](#321739_2_En_3_Chapter.xhtml), APIs and other helpful libraries, and related
    tools (e.g., for debugging—finding errors—or tracking performance). The goal is
    to make things easy, so the more building blocks that one can leverage reliably,
    the better.


    ## Conclusion


    With a more in-depth understanding of APIs and the other ways you can leverage
    existing code, your team sketches out a full development plan. The use of a few
    key APIs and shared libraries helps accelerate the schedule, but the team plans
    to slowly shift away from using one of them because it does not give them the
    full range of functionality they need for `MyAppoly`. They ruled out several other
    contributed libraries and tools because of their reported poor performance and
    unreliability. You must strike a balance between doing things in-house vs. outsourcing,
    and now that you have made the decision, your team can develop `MyAppoly`. But
    how will they work together to build it?


    Footnotes [1](#321739_2_En_6_Chapter.xhtml#Fn1_source) [2](#321739_2_En_6_Chapter.xhtml#Fn2_source)
    [3](#321739_2_En_6_Chapter.xhtml#Fn3_source) [4](#321739_2_En_6_Chapter.xhtml#Fn4_source)


    # Software Development: Working in Teams


    Too many cooks spoil the broth. This adage applies equally well to programming
    unless you organize your engineers in the right way.


    You spent the last few weeks assembling a small team of ambitious engineers. They
    understand how the back end, front end, and database interact and are ready to
    start programming `MyAppoly`. Before they start, you want to come up with guidelines
    for collaborating. How will they work together? Can two of them work on the same
    file at the same time? How will one engineer understand what another engineer
    did?


    Such questions are important for any technical endeavor. Various design principles
    and tools support team-based coding, making it faster and safer. To interact with
    your engineers, you need to understand the terminology of these principles and
    tools—particularly version control systems.


    ## Documentation


    The simplest way for engineers to explain their code to their teammates is to
    comment their code. Every programming language allows programmers to write comments
    next to particular lines or blocks of code to explain how the code works or what
    it does. Example comments include "Changes the user''s password" or "Adds user
    to the database." With these comments, new engineers can quickly learn the codebase,
    and programmers can effectively contribute to the code they are less familiar
    with. Comments also allow managers to review code more efficiently, as the English
    statements improve code readability. Commenting is one form of d*ocumentation*,
    the set of descriptions and instructions for a process or feature. Documentation
    is usually in paragraph form to help engineers understand the design and implementation
    of a significant feature more quickly. If your head engineer for `MyAppoly` builds
    a new feature that allows the application to process credit card payments, they
    might want to write up a few paragraphs explaining how the feature is integrated
    with the rest of the program, how the code works, where the code is saved, how
    the logic works, what APIs they used, and so on.


    In addition to these external notes, style of coding also matters greatly for
    teams. By *style*, I mean naming conventions (how you name variables in the program),
    use of indentation and whitespace, and structure of comments, among other things.
    Imagine code that asks a user for their name and then saves it in the database.
    One engineer might format the text and call the variable that stores the user’s
    name "name," whereas another engineer might call it something opaque like "var293."
    One is obviously more easily understood than the other. These coding styles are
    important; as a result, detailing a standard style guide for all engineers to
    use is a common practice. Many programming languages also have their own style
    guides or conventions that can serve as a starting point. If `MyAppoly` engineers
    follow these conventions, all formatting and labeling will be consistent across
    features, and new engineers will be able to collaborate and review code more easily.'
