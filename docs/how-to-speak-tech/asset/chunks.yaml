    *   *Confidentiality*: Since the message is a secret, we want it to stay secret.
    It is only ever visible to Alice and Bob, not to any third parties like Charlie.


    *   *Integrity*: The content of the message matters, so we want to make sure that
    Charlie cannot tamper with or corrupt the message. When Bob receives the message,
    he can trust it is the same one that Alice sent.


    *   *Availability*: The message is time-sensitive, and Alice wants to make sure
    Bob receives and reads it. Charlie cannot prevent Bob from accessing the message.


    The following sections discuss common attacks and mitigations using this model
    of confidentiality, integrity, and availability. This structure is useful both
    in categorizing past attacks to understand vulnerabilities in your system and
    in thinking ahead to incorporate best security practices into your application.
    Keep in mind that this list is not exhaustive, nor can all attacks be this neatly
    bucketed into categories. However, this discussion is a useful example of using
    the CIA Triad to think about security in the context of an application.


    ### Confidentiality


    Everyone has secrets, whether they be embarrassing nicknames or personal relationship
    history. Like people, all applications have secrets that they want to keep private.
    The most obvious application secrets are passwords and user data. When a piece
    of data (such as a Social Security number or birth date) can be used to identify
    an individual, it is known as Personally Identifiable Information (PII). It is
    the job of the application to guard both PII and other user information from prying
    eyes. Confidentiality, simply put, is keeping secrets secret—the difficulty of
    which we all learned at a young age.


    One way attackers target confidentiality is through social engineering attacks,
    which use techniques based in human psychology to manipulate a user into revealing
    confidential information. The most widespread type of social engineering attack
    is phishing, the practice of soliciting sensitive information or getting users
    to download malware by posing online as a credible entity. This section focuses
    on three types of phishing: drag-net phishing, spear phishing, and clone phishing.


    Drag-net phishing attacks cast their sights on a wide swath of users by utilizing
    mass email schemes. Pretending to be some authority (e.g., the IRS), an attacker
    sends scores of users the same, seemingly valid email. However, the email includes
    a malicious link that leads users to a page that looks official or identical to
    an actual website (e.g., the official IRS website) but is not. Users fall into
    the trap of entering personal details (e.g., their Social Security number) on
    this site, enabling the attacker to commit identity fraud. Some phishing emails
    instead or additionally disguise a destructive virus as an innocent-looking attachment.
    Users that download and open this file inadvertently cause the virus to run, therefore
    giving the attacker access to their computers. The most famous drag-net phishing
    attack is the “Nigerian prince” scam, in which attackers don the guise of a prince
    that needs help transferring his wealth. The attacker’s emails ask recipients
    to send a seemingly nominal fee to a bank account with the promise of greater
    wealth if they help. Of course, there is no prince, and the victims can’t reclaim
    the funds they sent to the bank account. While this attack does not always involve
    the exchange of sensitive information, attackers use the same tactics as many
    other drag-net phishing attacks.


    Spear phishing attacks, on the other hand, target specific victims. An attacker
    poses as someone the victim knows or trusts and sends them an email that incorporates
    personalization, such as by addressing the victim by name or job title. A common
    spear phishing strategy is to email users of a particular service provider—here
    we’ll use the example of Gmail. The attacker, using an account that seems to be
    an official Gmail account, tells users via email that their accounts were hacked.
    The email then redirects the users to a fake page that collects their credentials.
    Since the user thinks they are interacting with Gmail, they are willing to enter
    their password. This exact attack was the basis of the email leak targeting high-ranking
    Clinton campaign official John Podesta in early 2016.^([^(18)](#fn18))


    Clone phishing takes this personalization further and uses the user’s previous
    emails against them. Using a previously received legitimate email as a template,
    the attacker sends the victim a near-replica of the email, save for a new malicious
    link or attachment. Since these emails closely resemble actual emails that the
    user has received, it is more difficult to distinguish between a phishing and
    a legitimate email.'
  trans: '

    ## 什么是网络安全？


    网络安全是信息安全（保护电子与物理数据的实践）的一个分支。^(¹⁴) 正如《*牛津英语词典*》所定义的那样，网络安全侧重于保护电子数据，但这一定义具有局限性，因为它忽略了保护不属于数据范畴的计算机资源。^(¹⁵)
    该领域还涉及非数据驱动的数字攻击：比如破坏电网的黑客行为。此类攻击并不危及数据，但却利用数字工具造成严重破坏。因此，本文定义网络安全为：研究并实践保护电子资源（如数据和计算能力）免受未经授权方侵害的学科。本章将使用“安全”一词来替代“网络安全”，以反映该领域专业人士的实际用语习惯。


    某些网络安全技术源于密码学，即研究在存在恶意第三方的情况下进行安全通信的学科。作为一门学科，密码学历经数个世纪的发展，从简单的技术——如颠倒消息中的字母顺序或使用儿童语言游戏“猪拉丁语”——演变为基于数学的复杂系统。这些系统对于后续我们将深入探讨的某些网络安全技术至关重要。


    互联网兴起之后，密码学和安全在数字空间中迅速被证明不可或缺。公认的第一个计算机病毒是 1988 年的莫里斯蠕虫。^(¹⁶) 该程序利用各种网络协议中的漏洞迅速传播并嵌入到机器中。尽管莫里斯最初旨在无害地测量互联网的规模，但它最终因消耗并压垮计算机的处理能力而摧毁了数千台计算机。由此引发的计算机故障造成了数十万美元的损失。自那以后，攻击手段变得愈发复杂，并且随着互联网上用户和设备数量空前增长，潜在影响规模也急剧膨胀。


    ## CIA 三元组


    CIA 三元组为理解攻击态势提供了一个框架。这一经典的信息安全模型概述了三个主要的安全关注点：机密性、完整性和可用性。想象以下情景：爱丽丝希望将一则信息传递给鲍勃，并保护它免受对手查理的侵害^(¹⁷)。让我们思考爱丽丝和鲍勃可以对其交易感到安全的三种方式。


    - **机密性**：由于消息属于秘密，我们希望它保持秘密。它仅对爱丽丝和鲍勃可见，对像查理这样的任何第三方都不可见。

    - **完整性**：消息的内容很重要，因此我们希望确保查理无法篡改或破坏该消息。当鲍勃收到消息时，他可以相信这与爱丽丝发送的是同一条消息。

    - **可用性**：消息具有时效性，爱丽丝希望确保鲍勃能够收到并阅读它。查理不能阻止鲍勃访问该消息。


    以下各节将使用这一机密性、完整性和可用性模型讨论常见的攻击及缓解措施。这种结构既有助于对过去的攻击进行分类以了解系统中的漏洞，也有助于未雨绸缪，将最佳安全实践融入您的应用程序。请记住，此列表并非详尽无遗，也并非所有攻击都能如此清晰地归类。然而，此讨论是利用
    CIA 三元组在应用程序背景下思考安全性的一个有益示例。


    ### 机密性


    每个人都有秘密，无论是令人尴尬的绰号还是个人的感情史。和人一样，所有应用程序都有它们希望保密的秘密。应用程序最明显的秘密是密码和用户数据。当一条数据（例如社会安全号码或出生日期）可用于识别个人身份时，它被称为个人身份信息（PII）。保护
    PII 及其他用户信息免受窥探是应用程序的职责。简而言之，机密性就是保守秘密——这一点我们在年少时都体会到了其难度。


    攻击者破坏机密性的一种方式是通过社会工程攻击，这类攻击利用基于人类心理学的技术来操纵用户泄露机密信息。最普遍的社会工程攻击类型是网络钓鱼，即通过在线伪装成可信实体来诱骗敏感信息或诱使用户下载恶意软件的做法。本节重点介绍三种类型的网络钓鱼：广撒网式钓鱼、鱼叉式钓鱼和克隆式钓鱼。


    广撒网式钓鱼攻击通过利用大规模电子邮件方案，将目标锁定在广大用户群体上。攻击者冒充某种权威机构（例如美国国税局），向大量用户发送相同、看似有效的电子邮件。然而，该电子邮件包含一个恶意链接，会将用户引至一个看起来像官方网站或与实际网站（例如美国国税局官方网站）完全相同的页面，但实际并非如此。用户陷入陷阱，在该网站上输入个人详细信息（例如其社会安全号码），从而使攻击者能够进行身份欺诈。一些钓鱼电子邮件还（或另外）将破坏性病毒伪装成看似无害的附件。下载并打开此文件的用户无意中导致病毒运行，从而让攻击者可以访问他们的计算机。最著名的广撒网式钓鱼攻击是“尼日利亚王子”骗局，攻击者伪装成需要帮助转移财富的王子。攻击者的电子邮件要求收件人向一个银行账户汇出一笔看似微不足道的费用，并承诺如果他们提供帮助将获得更大的财富。当然，根本没有王子，受害者也无法追回他们汇往该银行账户的资金。虽然这种攻击并不总是涉及敏感信息的交换，但攻击者使用的策略与许多其他广撒网式钓鱼攻击相同。


    另一方面，鱼叉式钓鱼攻击则针对特定受害者。攻击者冒充受害者认识或信任的人，并向其发送一封包含个性化信息的电子邮件，例如提及受害者的姓名或职务。一种常见的鱼叉式钓鱼策略是向特定服务提供商的用户发送电子邮件——这里我们以
    Gmail 为例。攻击者使用一个看似官方 Gmail 账户的账号，通过电子邮件告诉用户他们的账户已被黑。然后，该邮件将用户重定向到一个收集其凭证的虚假页面。由于用户认为自己是在与
    Gmail 交互，他们愿意输入密码。2016 年初，针对克林顿竞选团队高级官员约翰·波德斯塔的电子邮件泄露事件正是基于这种攻击手法。^(¹⁸)


    克隆式钓鱼则将这种个性化更进一步，并利用用户之前的电子邮件来对付他们。攻击者以用户之前收到的一封合法电子邮件为模板，发送一封几乎一模一样的邮件给受害者，只是替换了一个新的恶意链接或附件。由于这些邮件与用户实际收到过的电子邮件非常相似，因此更难区分其是钓鱼邮件还是合法邮件。

    '
- fmt: '# 电子邮件提供商的反钓鱼策略


    电子邮件提供商不断将新的反钓鱼策略整合到其服务中。自然语言处理、机器学习和其它模式匹配技术已被成功用于查找钓鱼邮件并将其标记为垃圾邮件。虽然我们目前讨论的钓鱼攻击需要一定程度的技术知识，但许多攻击者会使用非技术途径。其中一个例子是语音钓鱼（也称为`vishing`），这是一种通过电话进行的钓鱼形式。在一种极为成功的攻击手法中，攻击者冒充国税局（IRS）工作人员通过电话威胁收件人，声称除非他们在所谓的官方IRS网站上进行付款，否则将被逮捕。当然，这笔钱最终落入了攻击者手中，而非IRS。


    要保护自己免受钓鱼攻击，你必须保持警惕。不要打开来自未知发件人的电子邮件或带有可疑主题行的电子邮件；虽然垃圾邮件过滤器已经取得了很大进步，但它们并非完美无缺。此外，良好的做法是避免在电话或电子邮件中透露个人信息。如果必须向他人提供此类信息，请完全确认你正在与真正的权威人士进行通信。


    在本节中，我们探讨了攻击者如何通过社会工程和钓鱼攻击来获取访问用户数据的权限。其他常见的机密性攻击包括数据包嗅探（`packet sniffing`）、端口扫描（`port
    scanning`）和键盘记录（`keylogging`）。在考虑保护你的机密性时，请考虑锁定访问你信息的入口点（最直接的方式是在不使用时锁定你的电脑或手机），包括锁定你自己。接下来，我们将研究针对消息完整性的攻击。


    ## 完整性


    在小学游戏“电话”中，一条消息通过耳语在人与人之间传递。正如你可能想象的那样，随着人们传播他们自己的误解（然后这些误解又被进一步误解），消息很快会变得面目全非。虽然这不是故意的，但这个游戏经常损害原始消息的完整性。这里的完整性指的是消息的可信度：消息接收者可以相信他们收到的消息未经篡改，并且来自他们所期望的发送者。由于冒充另一个安全用户存在难度，完整性攻击通常在技术上较为复杂。本节我们将讨论三种类型的攻击：中间人攻击、注入攻击和伪造攻击。


    ### 中间人攻击


    中间人攻击（即`man-in-the-middle`）发生在攻击者拦截了发送者和接收者之间的消息时。一个例子是重放攻击（`replay attack`），攻击者查理（Charlie）窃听爱丽丝（Alice）和鲍勃（Bob）之间的通信以窃取秘密（例如密码）。然后，在后续的交易中，查理可以利用这个秘密来冒充爱丽丝。在那次交易中，鲍勃认为消息来自爱丽丝，但消息的完整性已不复存在，因为它实际上是来自查理的不同消息。重放攻击展示了攻击如何可能同时属于多个CIA类别；虽然重放攻击针对的是消息的完整性，但查理知道爱丽丝的秘密也使其成为一种机密性攻击。


    ### 注入攻击


    注入攻击涉及攻击者通过提供恶意输入，经由应用程序运行破坏性代码。例如，考虑一个使用用户输入来执行SQL数据库查询的Web应用程序。攻击者可能能够输入有害代码，导致应用程序运行一个破坏性查询。这个查询可能会摧毁整个数据库。注入攻击非常普遍且破坏性极大，以至于在开放Web应用程序安全项目（OWASP）2017年十大最关键的Web应用程序安全风险列表中，该类别被列在首位。^([^(19)](#fn19))


    跨站脚本攻击（`XSS`）是另一种类型的注入攻击。在`XSS`中，攻击者在网站上插入代码以捕获敏感信息，通常是`cookie`。请记住，`cookie`是一种基于字符串的令牌，网站用其保存用户特定的设置和认证信息。想象一下，你的网站渲染了用户提交的HTML格式评论的最后一条结果。该评论可能包含一个带有JavaScript脚本的`<script>`标签，该脚本会窃取访问该页面的任何用户的`cookie`。当新用户加载页面时，这个脚本会自动运行，攻击者随后便能够利用这些窃取到的`cookie`冒充受害者，进行身份盗窃。


    ### 伪造攻击


    伪造攻击包括攻击者冒充用户的攻击。虽然中间人攻击中也存在冒充行为，但那些攻击针对的是两方之间正在进行的交换，而伪造攻击则侧重于单向通信渠道。例如，跨站请求伪造（`CSRF`）利用了用户到网站的单向通信。`CSRF`利用了`cookie`在你离开网站后仍然保持活跃、允许网站在你返回时识别你的这一事实。假设你最近访问了你最喜欢的购物网站；即使你已经离开该网站，它仍保留着一个`cookie`。攻击者可能诱使你点击钓鱼邮件中的链接，或通过`XSS`运行一个脚本，该脚本向购物网站发送一个恶意请求（例如删除你的账户）。由于`cookie`尚未过期，网站可能允许此请求执行。防止此类攻击的一种标准方法是发放一个隐藏的、会话特定的令牌（称为`CSRF
    token`），该令牌仅允许当用户（而非其他任何人）当前正在该网站上时才允许请求执行。


    ## 总结与防御


    作为要点，永远不要信任用户，尤其是他们的输入。你应该通过要求输入符合特定模式（例如，银行会检查请求的存款和取款金额是否为合法的非负十进制数）来验证他们的输入。通过验证输入，你可以降低黑客向应用程序注入代码或以其他方式造成有害结果的风险。对于许多完整性攻击，深入了解你所用的特定技术栈（即你的应用程序所使用的编程语言和框架）对于理解攻击者可能注入代码的漏洞至关重要。


    本节讨论了可能是技术上最复杂的安全攻击——完整性攻击。我们研究了中间人攻击、注入攻击和伪造攻击，这些攻击试图注入攻击者的代码并造成破坏性后果。其他完整性攻击包括数据篡改（`data
    diddling`）和切片攻击（`salami attack`）。为了保护自己，我们学会了严格验证用户的输入，并确保我们所做的任何假设都是真实的。我们的最后一节将讨论针对数据可用性的攻击。'
  raw: 'Email providers are continually incorporating new anti-phishing tactics into
    their services. Natural language processing, machine learning, and other pattern-matching
    techniques have been used with great success to find phishing emails and mark
    them as spam. While the phishing attacks we’ve discussed so far require some degree
    of technical literacy, many attackers use nontechnical routes. One such example
    is voice phishing (also known as vishing), a form of phishing conducted over the
    phone. In one shockingly successful technique, attackers pose as IRS agents over
    the phone and threaten the call recipients with arrest unless they make a payment
    on a supposedly official IRS site. Of course, the money goes to the attacker instead
    of the IRS.


    To protect yourself from phishing attacks, you must stay vigilant. Do not open
    emails from unknown senders or emails with suspicious subject lines; while spam
    filters have come a long way, they aren’t perfect. Furthermore, it’s good practice
    to stay away from giving out personal information over the phone or email. If
    necessary to give someone such information, be entirely sure that you are corresponding
    with the actual authority figure.


    In this section, we explored how attackers gain access to view a user’s data through
    the use of social engineering and phishing attacks. Other common confidentiality
    attacks include packet sniffing, port scanning, and keylogging. When thinking
    about protecting your confidentiality, consider locking access points to your
    information (the most straightforward being locking your computer or phone when
    not in use) including yourself. Next, we examine attacks on a message’s integrity.


    ### Integrity


    In the grade-school game Telephone, a message is passed around in a whisper from
    person to person. As you might imagine, it quickly morphs into something completely
    different as people spread their misinterpretations (which are then also misinterpreted).
    While not intentional, this game often compromises the integrity of the original
    message. Integrity here refers to a message’s trustworthiness: the message recipient
    can trust that they have received the message unaltered, from whom they expect.
    Due to the difficulty of impersonating another secure user, integrity attacks
    are often technically complex. We’ll discuss three kinds of attacks in this section:
    middle-person, injection, and forgery attacks.


    Middle-person, or man-in-the-middle, attacks occur when an attacker intercepts
    the message between the sender and the receiver. One example is a replay attack,
    where the attacker Charlie eavesdrops on Alice and Bob to steal a secret, perhaps
    a password. Then, in a later transaction, Charlie can use this secret to impersonate
    Alice. In that transaction, Bob thinks the message is from Alice, but the message’s
    integrity is gone since it is actually a different message from Charlie. Replay
    attacks showcase how attacks can fall into multiple CIA categories; while replay
    attacks target the message’s integrity, Charlie’s knowledge of Alice’s secret
    also makes this a confidentiality attack.


    Injection attacks involve attackers running destructive code through an application
    by providing malicious input. For example, consider a web application that uses
    user input to execute a SQL database query. An attacker might be able to input
    harmful code, causing the application to run a damaging query. This query could,
    for example, destroy the entire database. Injection attacks are so prevalent and
    damaging that the category is listed first in the Open Web Application Security
    Project (OWASP) Top Ten Most Critical Web Application Security Risks of 2017.^([^(19)](#fn19))


    Cross-site scripting (XSS) is another type of injection attack. In XSS , attackers
    insert code on a website to capture sensitive information, often cookies. Remember
    that a cookie is a string-based token that websites use to save user-specific
    settings and authentication. Imagine that your website renders the last result
    of an HTML-formatted user-submitted comment. The comment might include a script
    tag with a JavaScript script that steals the cookies of whichever user is visiting
    the page. When a new user loads the page, this script automatically runs, and
    the attacker is then able to use these stolen cookies to pose as the victim and
    commit identity theft.


    Forgery attacks include attacks where an attacker impersonates a user. While this
    also happens in middle-person attacks, those attacks target ongoing exchanges
    between two parties, while forgery attacks focus on one-way communication channels.
    For example, cross-site request forgery (CSRF) preys on communication from a user
    to a website. CSRF exploits the fact that cookies remain active after you exit
    a website, allowing it to recognize you upon your return. Say that you’ve visited
    your favorite shopping site recently; even if you’ve left the site, it keeps a
    cookie. An attacker might get you to click a link in a phishing email or run a
    script through XSS that sends a malicious request (perhaps deleting your account)
    to the shopping site. Since the cookie has not yet expired, the website may allow
    this request to execute. A standard way to prevent these attacks is by issuing
    a hidden session-specific token (called a CSRF token) that only allows requests
    to run when the user, and not anyone else, is currently on the website.


    As a takeaway, never trust the user, especially their inputs. You should validate
    their input by requiring that it conforms to a set pattern (e.g., a bank would
    check that requested deposit and withdrawal amounts are valid, nonnegative decimal
    numbers). By validating their input, you mitigate the risk of hackers injecting
    code into your application or otherwise causing harmful outcomes. For many integrity
    attacks, having a thorough understanding of your particular tech stack (the programming
    languages and frameworks your application uses) is critical for understanding
    vulnerabilities where attackers could inject code.


    This section discussed perhaps the most technically complex security attacks,
    integrity attacks. We investigated middle-person, injection, and forgery attacks
    that seek to inject an attacker’s code and cause damaging results. Other integrity
    attacks include data diddling and salami attacks. To protect ourselves, we learned
    to rigorously validate our users’ inputs and ensure that any assumptions we make
    are true. Our final section discusses attacks on data’s availability.'
