    # 发布管理


    迭代版本是如何交付给客户的？向公众发布或*推送*代码的流程必须经过深思熟虑，以最大限度降低出现缺陷或错误更新的风险。*交付*和*推送*代码含义相同，即让代码“上线”供客户使用。主要涉及以下三种环境或服务器。


    首先是*开发环境*，所有编码和测试都在此进行。新功能部署在独立的服务器上，公众无法访问。因此，任何错误都仅限于公司内部，最坏情况也仅是拖慢开发进程。开发环境中的代码不会影响网站的“线上”版本。


    当迭代版本准备发布时（以更新或新版本的形式），新代码必须上传到*预发布环境*，这是另一台与线上应用完全一致的服务器。并非所有产品都使用预发布服务器，但在此环境中进行测试可作为一个额外检查，以确认新功能已准备好最终交付。


    如果代码在预发布环境中运行完美，这个更新就准备进入*部署*阶段。它会被迁移到生产环境，即服务于公众网站、响应用户访问的服务器。发布流程的设计旨在确保此服务器仅更新运行正确的无缺陷代码。当然，没有任何流程是完美的，有时漏洞还是会悄然出现。


    ## 结论


    与团队讨论后，你决定实施本章中讨论的某一种开发模型。同时你与工程师们合作，打造一套有效的发布管理系统，为发布的每一步都设置多重检查。然而，在向客户推出新功能之前，谨慎的做法是确保这些功能没有缺陷，并且不会造成比它们解决的问题更多的混乱。你的下一个任务是学习你的团队是如何实现这一目标的。


    脚注 1 2


    # 9. 软件开发：调试与测试


    2009 年，丰田汽车被指控部分车型油门踏板存在卡滞问题，并于 2010 年 1 月召回 410 万辆汽车进行维修。该缺陷是汽车产品中的一个*缺陷*或瑕疵。我们可以将丰田的产品与任何互联网公司的产品进行类比。Facebook、谷歌和
    MyAppoly 都有过、并且将来也还会有各种各样的缺陷，但优秀的团队会在产品面向客户发布之前，在开发过程中发现它们。


    期望团队编写的每一行代码在第一次运行时都能正确工作是不现实的。正如出版前的校对和编辑是写作过程中的关键环节一样，*调试*——即排除错误的过程——也是编写代码过程中的重要一步。这些错误不仅包括拼写错误等语法相关问题，还包括代码结构或代码间交互方式的问题。由于团队和用户会定期发现产品中的缺陷，调试是一个持续的过程，且所需时间不可预测。随着
    MyAppoly 规模扩大、工程师人数增加，快速定位缺陷源头将变得越来越困难。从概念层面理解工程师如何进行调试，将有助于你认识到这个过程有多么依赖于试验和变量。


    ## 缺陷的一生


    简而言之，*缺陷*就是一个错误。这个不寻常的术语背后有一段有趣的历史。在计算机使用穿孔卡片编程的年代，著名计算机科学家格蕾丝·赫柏注意到了一些不寻常的现象。经过调查，她发现一只死飞蛾干扰了一张穿孔卡片——这成了计算机科学史上的第一个“bug”（程序缺陷）！


    如今，bug（程序缺陷）是由程序员（无意中）制造的，而不是由真实的虫子造成的，并且并非所有缺陷都容易修复。缺陷分两种：语法缺陷和语义缺陷。


    - *语法缺陷*源于违反编程语言的规则。你的程序员可能遗漏了分号、拼错了变量名，或者试图使用编程语言不提供的结构。这类缺陷通常容易修复，因为编译器、解释器或其他工具可以找到它们。如果把代码比作
    Microsoft Word 文档，这些错误可以通过拼写和语法检查来发现。


    - *语义缺陷*包含两种类型。第一，*运行时错误*会导致程序崩溃并停止执行。例如，程序试图打开一个不存在的文件。第二，*逻辑错误*不会中断程序的完成，但会产生意外结果，比如该做减法时做了加法。如果你在文章中自相矛盾，就犯了逻辑错误，但只要语法和拼写正确，拼写检查器就不会标出它。因此，语义错误比语法错误更难捕获、定位和解决。


    尽管所有缺陷都是程序员造成的，但并非都源于疏忽。有些缺陷的出现是因为更新后的代码与之前的逻辑不再兼容。有些缺陷则是因为两位工程师合并代码时，两个新功能无法完美协作。存在缺陷并不意味着必须有人为此承担责任。


    ## 调试过程


    本节阐述的六步调试法，是对 Grötker 及其 Synopsys 公司同事提出的“调试 13 条黄金法则”¹¹的提炼。这六个步骤并非权威标准，但当你团队中的工程师说他们正在“调试”某个问题时，你可以确信他们大致遵循的是这些步骤的某种变体。


    ### 1. 追踪问题


    为了有效管理 MyAppoly 的错误，首先就要追踪所有缺陷。对遇到的每一个缺陷都保留适当的文档记录，可以帮助你更快地解决未来的问题。此外，追踪缺陷还能帮助整个团队在问题及其解决方案上保持步调一致。许多现成的追踪系统运行方式如下：当发现一个缺陷时，系统会创建一个描述该缺陷的问题或“工单”。其状态在解决前保持为*开启*，解决后则切换到*已关闭*。期间还存在一些中间状态，例如*处理中*，并且工单可以作为委派方式分配给不同的团队成员。


    什么才是适当的文档记录？由于任何程序输入都可能影响缺陷，所有可能导致问题的因素都应被记录下来。这包括用户执行的具体操作、操作系统、浏览器、实际行为、预期行为，以及你能想到的几乎所有可能相关的信息。这些变量要么是*静态的*——即与配置和兼容性相关的、不会改变的属性，例如操作系统和浏览器；要么是*动态的*——即与内存和网络相关的、频繁变化的方面，例如同一时间运行的其他程序数量。


    ### 2. 复现问题


    在获知一个缺陷并记录其详细信息后，下一步就是复现该问题。这包括重建环境，并检查行为是否与所报告的一致。这个过程起初有点手工操作，但你需要重新制造出程序的故障，以便使用相同的测试来确认问题是否已被妥善修复。

    '
- fmt: '### 3\. Run Tests


    After every adjustment to the code, try to reproduce the failure to see if the
    last update eliminated the problem. Manually reproducing the problem will be tiring,
    so a better way to automate the tests will allow you to identify the problem.
    There are several techniques for doing so; the availability of each one is based
    on which programming language you are using, the specifications of the system
    overall, and what tools you are willing to buy.


    The scientific method will inform your debugging approach: hypothesize, edit code
    accordingly, test, evaluate, and repeat as necessary. After testing the program
    following every code adjustment, log the change to create an audit trail so you
    can backtrack if you need to restore the code to its original state. Additionally,
    it is good practice to create different versions of the file for every change
    you make.


    How will you test the functionality of `MyAppoly` before you launch the new version?
    You can’t waste any time because you want to replace the buggy code released to
    your users as soon as possible. The tests you run will typically occur at one
    of the three levels: the presentation layer, the functionality layer, or the unit
    layer.


    Although you can test at any of the layers, you will typically choose one based
    on ease of execution, ease of interaction, and ease of result assessment, among
    other considerations. Let’s dive into this quickly.


    The *presentation layer* is the view component in the model-view-controller description
    of our application. To test from the presentation layer, you interact with the
    application as a user ordinarily would, using the mouse and keyboard. Let’s say
    there was a bug in checking some account value on `MyAppoly`. After a $100 deposit,
    the account value still reads $0. You could use the presentation layer to check
    if you fixed the bug by refreshing the web page and reviewing the account value.
    Testing at this layer is generally feasible and quick. Even so, visibility is
    limited because you cannot necessarily see how the back end is making the calculation
    just by looking at the final value.


    The *functionality layer* consists of all the code that defines the functionality
    of the program—essentially the controller and model parts of `MyAppoly`. To test
    at this layer, programmers typically write a smaller program that interacts with
    the code in the larger application. For example, a programmer may want to write
    a small program that creates a fake account and adds $100 to it, checking that
    the account balance after the deposit is actually $100. Running these functionality
    tests is typically as easy as clicking the refresh button on a browser, and automation
    allows testing at scale. Creating these tests may seem easy, but there are some
    startup costs for developers to write each one. If you expect to be running the
    same test a lot, however, it might be worth the investment.


    The last layer is the *unit layer*. If you could break down the full program into
    small, one-operation chunks, you would have a unit. In the account example, each
    of the following could represent a unit: retrieving the old account value, getting
    the deposit value, calculating the new account value, and storing the new value.
    Testing these specific units can be automated with a script. These tests give
    the programmer the most detailed look at how the program is operating at the building
    block level. Often these tests are of equality, meaning they will test if the
    expected output equals the actual output. If it is true, the tests will continue;
    otherwise an error will be reported. In this way, the bug can be immediately traced
    to a particular area of the program. In the current example, there are several
    units. First, you can check the value by which the account is going to change.
    If you entered $100, let’s make sure the back end is actually interpreting it
    as $100. Now, let’s get the existing value of our account. Are you getting the
    right account? Finally, you can add $100 to the existing account value to obtain
    the final value. Is the final value correct? By breaking it down into a step-by-step
    analysis, you can determine the specific step at which the failure occurs.


    Your programmers have various tools and techniques to aid their efforts to track
    and test bugs. An easy debugging methodology involves the `print` function, which
    displays anything you tell it to. In the example of updating your `MyAppoly` account
    value, you could add `print` statements in between every line of code. You could
    print the old account value, the amount you want to change it by, and the new
    account value. If any one of those numbers were off, you can then see exactly
    where things went wrong. In this way, `print` functions can be used to create
    unit tests. But adding `print` statements everywhere in your code, as you can
    imagine, is messy and tedious, as you’d have to read through a lot of output to
    find each bug. Luckily, there are better ways.


    One tool you can use is a *debugger*. Debuggers essentially stop a program from
    executing so programmers can make observations. By setting *breakpoints*, a programmer
    can stop the code in place and see the values of all the relevant variables. Debuggers
    also allow programs to *trace* through code, pausing after each line, so that
    the programmer can determine which line will execute next and how the variables
    should change. Presumably, if an error occurs, the programmer will be able to
    identify where it occurred, and by tracing through the logic of the code with
    the computer, programmers can more easily spot the bug. An example of a debugger
    you might hear of is the GNU debugger `GDB`, which is run from the command line
    and is typically associated with the C programming language.


    ### 4\. Interpret Test Results to Identify Bug Origin


    With every test, you come closer to understanding the root cause of the bug. If
    you ask your programmers, there is nothing more fulfilling than finding the logical
    error or missing statement that caused so much pain. Keep in mind that the bug
    could exist pretty much anywhere, whether in your source code, in the compiler
    (if you are using a compiled language), or in a third-party library or API.


    ### 5\. Fix the Bug Locally


    Now that you’ve found the bug, it’s time to fix it. Even if the fix requires you
    to reprogram an entire feature, you know *why* the program is crashing. After
    you fix the bug, your team will run regression tests, which test if all of the
    other functionalities of the site are still working. Fixing one bug and introducing
    another is hardly the right solution. You may also write additional tests to ensure
    such a bug doesn’t slip by unnoticed next time. Assuming your regression tests
    pass, you can feel confident that you have eliminated the threat without creating
    more chaos.


    ### 6\. Deliver Fixed Product


    Once you have fixed the bug and run confirmation tests, the `MyAppoly` team will
    update the public version of the site so users are no longer accessing a buggy
    application. This follows the release management process outlined in Chapter [8](#321739_2_En_8_Chapter.xhtml).


    ## Conclusion


    Now you understand a bit more about the process and techniques your team will
    use to make `MyAppoly` achieve perfection. With these tools in hand, your team
    has built, tested, debugged, and launched a working version of `MyAppoly`. Improving
    the product is always a goal, but the one taken up in the next chapter is mission-critical:
    getting users.


    Footnotes [1](#321739_2_En_9_Chapter.xhtml#Fn1_source)'
