- fmt: 'Google’s ranking algorithm is called `PageRank`, and it has become famous
    over the years. Though the exact algorithm is not public, we have an idea of what
    factors it considers, and, as a result, you may be able to use Google’s ranking
    methodology to inform how you build your web pages.


    One thing the algorithm targets is `keyword density`. Pages that reference a keyword
    frequently are more likely to be relevant than ones that mention it less often.
    A page that mentions “tennis racket” one hundred times is more likely related
    to tennis than a page that contains only one occurrence of “tennis racket.” Search
    engineers quickly realized that web developers might clutter the page with redundant
    occurrences of the keyword in order to obtain a higher rank. Smart, huh? Google
    and other search engines are smart too, so they monitor such behavior and flag
    it for rank demotion.


    Search engines also look for `keyword proximity` and `prominence`. They want to
    make sure that the words *tennis* and *racket* appear next to each other because
    if they do, the chances that they relate to the search “tennis racket” are high.
    `Keyword prominence` can also indicate the relative importance of the article.
    Is *tennis racket* the title of a web page or merely in the footnote of an image?
    This also factors into the rank, as most would agree it should. Last and certainly
    not least is `link popularity`. If a lot of other websites have links that lead
    to your page, the chances are good that your page is high in importance. This
    is especially true if important websites (also determined by link popularity and
    the other factors) have links to your page. To continue the example, if the US
    Open tennis website linked to your page on tennis rackets, that’s a critical piece
    of information and Google gives you credit for it. What they don’t give you credit
    for are links you put on your own page that take you to other well-known sites.
    In other words, including a link to the US Open site on your own page will not
    affect your rank. Anyone can put links on their website, so that’s not special.


    Based on this knowledge, you can optimize your web pages to achieve a higher rank
    through the process of SEO. You have direct control over things that appear on
    the web page. A clear, descriptive title; strategic use of keywords (keeping in
    mind proximity, density, and prominence); and descriptions that you can add to
    the `meta` tags (you can use these to provide data to the Google bots) and image
    tags in HTML all influence your rank. Regularly updating the content on your page
    might also be perceived as a sign of credibility, as are search-specific site
    maps that define and describe for crawlers your page layout, description, importance
    of each page, and so forth.


    As you may have guessed, it is a lot more difficult to control your `link popularity`.
    Short of forcing others to include links to your web page, there is little you
    can do other than building your credibility and awareness.


    The better you understand how the ranking algorithm of search engines work, the
    better you will be at SEO.


    ## Search Engine Marketing


    By advertising your company on Google or Bing, your website would be featured
    on some of the most highly trafficked real estate on the Internet. This section
    will discuss the principles behind how this works.


    The concept of *search engine marketing* (SEM) is quite simple. Let’s continue
    to suppose MyAppoly is a tennis website. You know that users searching for tennis
    rackets are likely in the market for new tennis gear. In order for your ad to
    be displayed when a user searches “tennis bag,” you must “purchase” the keyword
    “tennis bag.” When a user searches for the term “tennis bag,” your advertisement
    will pop up on the side, and, if the user clicks your link, you will be charged
    the amount at the rate you purchased the keyword for if the user clicks your link.
    There is an additional layer of complexity to this, however.


    Many people want to buy the same keyword. All tennis websites probably want to
    buy the keyword “tennis bag.” How does Google know which ads to show in the space
    provided (again, at the top of the results page)? This is determined by a real-time
    auction based on two factors: the `bid` and the `quality`. When you create your
    campaign and ads, you specify how much you want to bid. Naturally the higher you
    bid, the more likely it is your ad is shown over other ads from competitors who
    purchased the same keyword. This makes sense since Google wants to maximize its
    revenue and, all else equal, a higher bid is better than a lower one. Quality
    is equally important because Google is paid only when a user clicks the ad. Let’s
    illustrate by example. What if MyAppoly started buying ads for lacrosse helmets
    thinking that any athlete looking to buy equipment may also be interested in tennis
    gear? MyAppoly may win the auction for lacrosse helmets, but as soon as users
    click MyAppoly’s ads, they will realize that MyAppoly is a tennis website and
    not related to lacrosse at all. They will probably hit the back button immediately.
    Google can track this activity, and if they notice that your ads are not serving
    the customers what they actually want, your `quality score` will go down. Therefore,
    if you want to win auctions, you need to have well-targeted ads (good quality)
    and bid a value that is likely to be higher than your competitors’ bids.


    This is known as a *performance-based advertising model*, which is nice because,
    unlike traditional advertising methods, you only pay if users click your ads.
    The incentives for all parties are aligned. The advertiser only pays if the ad
    is clicked. Google collects money by showing ads that users are likely to click.
    The user will only see ads that are relevant. Compare this model to that of yellow
    pages, in which advertisers pay a flat amount for placement regardless of the
    number of people that see it and users have to sift through hundreds of irrelevant
    ads. This is inefficient in today’s world with so much access to highly targeted
    data.


    Search advertising is effective because of the context the search query provides.
    Wasting money on advertising to the wrong population is a danger of the past because
    you only purchase keywords that describe your target market. Additionally, when
    a user clicks an ad, you can control where they go on your web page. Therefore,
    rather than directing all users to the homepage of MyAppoly, why not direct people
    who click the “tennis racket” ad to the list of tennis rackets on MyAppoly?


    ## Analytics


    *Analytics* refers to software programs that generate metrics describing how users
    are using your site. The history of analytics begins not as a set of user tracking
    metrics but rather as an error log that stored user actions to assist debugging.^([^(12)](#fn12))
    Early developers created automatically generated web documents that logged errors,
    hence the name *web logs.* Over time, however, business and marketing employees
    realized that the web log data had value beyond debugging. This data could be
    used to understand the customer.


    In 1995, Stephen Turner wrote a program called `Analog` that analyzed these convoluted
    log files, extracting the portions of it that were useful for analysis. `Webtrends`,
    a later program, helped people visualize the data stored in these logs. The goal
    of collecting and visualizing meaningful data about website usage is motivated
    by a desire to make decisions based on information about users and their habits.


    What are these data that web application companies are interested in collecting?
    There are several types, but the one discussed here is *clickstream data*. When
    users visit MyAppoly, they leave behind a trail made of all the pages they visited
    and what they clicked. This record of a user’s activity defines the term *clickstream
    data*, and there are four main ways of collecting it: web log, web beacon, JavaScript
    tagging, and packet sniffing.'
