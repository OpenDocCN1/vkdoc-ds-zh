- fmt: '*Software as a Service (SaaS)*: Any application that a user can access through
    a browser, such as Dropbox, falls under SaaS. Also related are APIs, which are
    discussed in more detail in Chapter [6](#321739_2_En_6_Chapter.xhtml). Because
    the service is offered over the cloud and a copy of the application is not installed
    on every user’s computer, we can say the cloud is based on a multitenant architecture.


    *Platform as a Service (PaaS)*: This term will be familiar to people who have
    been exposed to cloud platforms for the programming community, such as `Heroku`.
    These platforms provide environments for users to build their own software. Among
    other things, they provide web servers for you to build your own web applications.


    *Infrastructure as a Service (IaaS)*: The growth of the cloud has created an entire
    business out of cloud infrastructure, which allows users to host their websites
    on the cloud. This enables lot of efficiencies. As an example, after launching
    a new promotion, you might expect a lot of traffic. Historically, you would need
    to purchase enough servers to serve your site during this peak time. After the
    surge of visitors, you would be left with a lot of expensive servers and relatively
    low traffic. The cloud transforms these fixed costs into variable costs. Because
    you can add and take away server capacity easily with the cloud, you pay for only
    what you use.


    `Amazon`, which has built up data centers to power its own website, made its additional
    servers and tools available to others through a service called Amazon Web Services
    (AWS). Amazon Elastic Compute Cloud (EC2), a part of AWS, allows you to remotely
    and flexibly add or remove servers according to your plan. Microsoft, Google,
    and many others offer similar services.


    NIST also identifies the four deployment models for identifying who can have access
    to the information in the cloud, which are outside the scope of this book.


    ## Benefits of Cloud Computing


    The benefits of cloud computing include the following:


    *Accessibility and independence*: You can access the application or data on any
    device connected to the cloud, so you are no longer tied to your physical computer
    to get what you need.


    *Backup*: Because your files are stored securely in the cloud, if you drop your
    laptop in the bathtub or lose your tablet in the subway, the data are safe and
    sound.


    *Prorated pricing*: Pricing is metered or based on usage.


    *Lower hardware costs*: A lot of the computation is taken care of by the computers
    in the cloud, so you do not necessarily need the fastest computer with the most
    up-to-date hardware. All you need is a computer with reasonable Internet speed.
    You also don’t need to store all the information yourself, because your files
    can all live on the cloud. Inexpensive laptops such as `Chromebooks` only provide
    fast Internet access.


    *Better performance*: Because the cloud reduces the need for you to install feature-redundant
    programs, your computer has more free memory to work faster at other things.


    *Fewer maintenance issues*: Because software lives on the cloud, you are a lot
    less likely to have problems of installed software conflicting with other software
    or newer versions of the same software.


    *Access to the latest version*: When you visit a website, the version of the application
    you access will always be the most up-to-date version.


    *Easier group collaboration*: With everyone on the cloud, groups can collaborate
    more effectively. Think Google Drive and document collaboration.


    *Increased computing power*: The computation power of a single computer is limited.
    On the cloud, however, processing power can be spread across the entire network.


    ## Disadvantages of the Cloud


    If you are on cloud nine after reading the long list of cloud benefits, I am sorry
    to have to rain on your parade. The cloud is not perfect for the following reasons:


    *Internet dependency*: If the Internet is down or you don’t have a reliable Internet
    connection, you cannot access the data and software you might need. Many cloud
    applications allow you to download your data as a work-around, although some of
    them charge you to do so.


    *Security and privacy vulnerability*: The cloud is becoming more secure, but companies
    are justifiably wary about having their data accessible via the Internet. If your
    data exist with someone else, are you keeping your information private? Despite
    increasingly sophisticated security defenses, vulnerability to malicious attacks
    and hacking thefts is a growing worry at all levels (Chapter [12](#321739_2_En_12_Chapter.xhtml)).


    ## Conclusion


    The Internet proliferated in large part because hosting became so easy. Entrepreneurs
    made their creations available to their customers quickly and inexpensively by
    utilizing the latest hosting technologies. As consumers have started to shift
    their preferences toward cloud services, newer tech companies are often finding
    themselves in an attractive light versus large companies who may be too tied to
    legacy systems to take full competitive advantage of cloud benefits.


    It goes without saying that you need to build a website before you can host it
    on the cloud. Whether you are an opportunistic entrepreneur aiming to modernize
    old software or you work at a large company hoping to stay current with new web
    technology services, you must understand the parts of a web application. You will
    acquire this understanding by building `MyAppoly`, as you will start to do in
    the next chapter.


    Footnotes [1](#321739_2_En_2_Chapter.xhtml#Fn1_source)'
