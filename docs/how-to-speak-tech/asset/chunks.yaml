    ### 数据


    人工智能依赖于大量正确、多样且均衡的输入数据来正确解决问题。由于它会根据数据调整并改进自身行为，因此错误的数据意味着它学会预测错误类别或数值。例如，房价数据如果错误地偏移了一个月，就会导致预测结果也偏移一个月。更糟糕的是，如同错误价格这类损坏数据，会让
    AI 完全学到错误的内容。即使数据是正确的，但来源过于单一，也无法代表问题的全貌，从而导致 AI 性能不佳。例如，不应使用美国历史上的房价数据来训练 AI
    预测印度的房价，因为两地市场差异巨大。此外，AI 模型需要在数据中看到足够多样的房屋类型，如独栋住宅、双拼别墅和豪宅，这样当被要求预测一栋罕见房屋的价格时才不会措手不及。最后，每种房屋类型的数据量必须充足，以避免多数类型对
    AI 的学习产生过大影响。


    计算机将所有信息存储为数字，更准确地说，是比特。因此，在 AI 能够学习数据之前，我们必须将数据转换为数字。幸运的是，像图像、文本和音频这类标准数据类型在计算机中已经以数字形式表示。在实践中，我们将数据转换为称为*特征*的浓缩数值表示形式，这些特征捕捉了最相关的部分。假设你可以获取过去一百年美国所有已售房屋的信息，包括房屋详情及其月度价格变化。要构建一个能预测未来房屋价格的
    AI，我们可能会关注每栋房屋的购买日期、建筑面积、位置和入住情况（即特征），因为它们最有可能影响价格。我们忽略墙壁油漆颜色和前任租户的年龄，因为我们发现这些因素与价格无关。将最相关的特征组合成一个数字列表，就得到了一个*特征向量*，这正是
    AI 期望的输入格式。


    但我们如何知道日期、建筑面积、位置和入住情况是影响房价的最大因素呢？也许墙壁油漆颜色*的确*对市场价格至关重要。影响市场价格的因素如此之多，以至于我们仅凭直觉手动选择少数特征可能会过度简化问题，从而训练
    AI 学习到错误的模式。更好的方法是通过数学技术自动发现最重要的特征。我们可以首先绘制所有房屋的价格（y 轴）与建筑面积（x 轴）的散点图；如果建筑面积对价格有显著影响，我们应该会注意到一条对角线，表明价格随建筑面积的变化而显著变化。然后，我们可以将此选为一个特征。如果关系反而是一条水平线，说明建筑面积不影响价格，那么我们就应将其从特征中排除。


    我们还可以使用简单的计数技术来捕捉数据的高层方面，并将其编码为特征。例如，在垃圾邮件分类中，我们可以统计垃圾邮件中出现频率最高的前十个单词，对所有非垃圾邮件也做同样的处理，并删除诸如“a”和“the”这类高频常见词。然后，AI
    将通过检查新邮件中的单词是否与这些单词集匹配，并观察其是否应被归类为垃圾邮件，来学习区分垃圾邮件和非垃圾邮件。谷歌的`Word2Vec`（“word to
    vector”的缩写）技术甚至能将单个单词转换为捕捉其现实含义的数学表示。这些特征捕捉了数据的语义方面；例如，“mother”和“father”这两个词密切相关，而“food”和“computer”则无关。特征就是
    AI 的食粮；它们与期望输出的关系越强，AI 的准确性就越高（前提是 AI 能够捕捉到这些关系，这是下一节“模型”的主题）。


    暂且不谈特征计算，我们需要确保一开始就在使用最合适的数据集。假设我们想检测横穿马路的行人。我们可以使用麦克风来拾取马路上的脚步声。然而，仅凭脚步声来确定人与汽车的距离将极其困难。这里更好的数据是道路图像，其中可以清晰地看到行人。甚至更好的方法是，我们可以使用红外图像来捕捉热信号。人体散发的热量远高于路面，因此在图像上会呈现亮红色，更容易被检测到。


    ### 模型


    模型负责根据给定的输入产生正确的预测。输入数据从一端进入（例如患者的症状），另一端则输出预测结果（流感/无流感）。如果模型观察到多个高度相关的症状，它就预测“患流感”。如果观察到没有发烧，它就预测“无流感”（因为流感几乎总是伴随发烧）。在模型内部，是编码了现实世界知识的隐藏数学函数，例如头痛和发烧总是伴随流感，而腿痛则完全无关。这些函数本质上是将变量与系数关联起来的公式，例如`y
    = mx`，其中`y`是流感的严重程度（越高越严重），`x`是头痛的程度（同样，越高越严重）。变量`m`决定了`x`和`y`之间的关系；如果它等于 1，那么随着头痛加剧，流感也会加剧到类似程度。如果`m`等于
    2，那么流感会双重恶化，这意味着这个症状与流感严重程度的关系非常强。这个例子展示了现实世界的关系可以表示为带有变量的数学公式。注意，这些公式仅仅表示两个值之间的相关性，意味着头痛和流感严重程度似乎一起变化，而不是一个导致另一个变化。训练模型以在公式中捕捉这些相关关系，正是
    AI 的核心所在。


    表 15-1 展示了不同症状与流感严重程度之间的相关关系类型。


    **表 15-1.** 线性和非线性关系示例


    | 类型 | 关系 | 示例症状 | 解释 |

    | --- | --- | --- | --- |

    | 线性 | 正相关 | 头痛 | 流感越严重，头痛越强烈。 |

    | 无相关 | 腿痛 | 流感的严重程度对腿痛没有影响。 |

    | 负相关 | 高度精神集中 | 流感越严重，越难集中注意力（即精神集中度越低）。 |

    | 非线性 | 不明确 | 打喷嚏 | 流感的严重程度以复杂的方式与打喷嚏相关联。 |


    线性关系是一种简单的关联，其中一个值的增加或减少伴随着另一个值的相应变化。前面讨论的`y = mx`例子就是`y`和`x`之间的一种简单线性关系。非线性关系则不那么直接。随着年龄增长，视力会减弱，但每个人的变化程度和速度都不同。一个人可能
    80 岁时视力仍完美无缺，而另一个人可能 20 岁就近视了。我们知道年龄和视力之间存在某种关系，只是难以解释或表达。其他现实世界的例子包括：公司季度收益报告如何影响其第二天的股价，或者新政府政策如何影响该国的失业率。目前尚没有明显的公式能让我们计算出这些影响。

