  trans: '

    话虽如此，必然存在某种隐藏在我们视线之外的*公式*，它可能包含数百或数千个变量，并能捕捉到这些独特而复杂的关系。神经网络是应对此类场景最有效的模型类型。它由多层简单的数学函数（称为神经元）堆叠而成，最终产生一个输出。这些堆叠的函数深度可达
    500 层以上，由此产生了“深度学习”这一术语。你可能在媒体上多次听到这个流行词，它常被吹捧为一种神奇算法，能够完成击败世界顶级围棋选手之一李世石这样的超人壮举。神经网络的独特之处在于其能够捕捉任何线性与非线性关系，从而识别出数据中难以察觉的微妙差异。其他类型的模型包括决策树（一种选择最具信息量特征进行学习的树状结构）以及支持向量机（SVM，它试图尽可能远地分离最强的正负特征）。


    ## 学习


    既然我们已经确定了问题、相关数据和模型，就可以将数据输入模型，让它进行学习。*学习*是模型掌握问题知识的过程。当我们向模型输入数据时，它会一次性处理若干数据点，并调整其底层数学函数的参数，以反映从数据中获取的新信息。这一调整过程由*超参数*（即更高级别的配置）控制，例如模型每处理一组数据点时应改变参数的幅度，这也被称为学习率。学习率越高，每个新数据点对模型参数的影响就越大，学习进展也越快。随着时间的推移，参数的取值理想情况下会变得足够优秀，使模型能够做出准确的预测，此时参数停止变化，并被称为收敛至最终值。实践中，如果模型未能充分捕捉数据中的关系，往往不会收敛。因此，学习过程需要人类定期监控，以判断进展是否顺利——即参数更新是在改善预测还是导致预测恶化。模型需要多次遍历数据才能收敛，根据问题的复杂程度，耗时可能从数小时到数天不等。从人类的角度来看，我们称这一过程为“训练模型”。用于训练模型的数据被称为训练数据。


    三种最常见的学习过程是监督学习、无监督学习和半监督学习。监督学习依赖于人为提供的每个训练数据点的期望输出，这些输出被称为*标签*。如果问题是预测患者是否患有癌症，监督学习不仅需要患者的症状，还需要一个“患有癌症”或“未患癌症”的标签。模型通过预测患者是否患癌并用给定的标签进行确认，不断验证和优化其知识。如果预测正确，置信度会提高；如果预测错误，则需要调整构成模型的数学函数中的某些取值。这种反复检查与更新的迭代过程会随时间增加模型的知识积累。到了收敛点，我们停止训练模型，用新的患者信息对其进行验证，并统计其出错次数。模型此前从未见过这些患者，因此这是对模型理解问题程度的一种检验。如果模型足够好，我们可能会将其集成到实际产品中并销售给消费者；如果不够好，我们会用更长时间继续训练，同时对底层数学函数或结构进行一些调整，例如为神经网络增加更多层，或调整某些超参数。有时，我们也会收集更多带标签的训练数据，为模型提供更多关于问题的信息。


    遗憾的是，人工构建标签成本高昂。对于道路图像中检测行人的问题，收集数千张图像相对容易，但逐一人工判断每张图像中是否存在行人（是/否）则困难得多。无监督学习在没有标签的情况下从训练数据中获取知识。监督学习中依据真实标签进行验证的迭代过程在此无法奏效。相反，这一过程试图揭示特征内部的关系，例如识别相似的数据点并将其归入不同的组。无监督学习能解决的问题更多与深入理解数据有关，而非试图预测一个输出。K-means
    算法就是这样一种学习过程，它能迭代地在数据中发现簇。例如，如果数据包含书店顾客的年龄和家乡等信息，对它们进行分组有助于我们更好地理解经常光顾书店的顾客类型。


    在许多情况下，只有部分数据带有标签。我们能否仍利用它们进行学习呢？半监督学习试图解决这种情况，主要通过依据其他数据点与少量带标签数据的相似性来推断其标签。相似度越高，它们拥有相同标签的可能性就越大。例如，如果两名患者的症状非常相似，但我们只知道其中一人的标签，就可以有根据地猜测另一人也有相同的标签。一旦我们拥有了所有标签，就可以应用前面讨论过的监督学习方法来学习和预测输出。


    现在，我们将通过一个小的实际案例，看看人工智能的这四个关键组成部分——问题、数据、模型和学习——是如何结合在一起的。


    ## 案例研究：苹果面容 ID


    要解锁最新的 iPhone，你只需盯着屏幕一秒钟即可。这项技术使用了一个经过训练能检测你面部的神经网络。^(³⁵) 这里的问题主要涉及分类——判断此刻看向屏幕的脸是否是
    iPhone 的真正主人。为了准确完成此任务，模型首先通过包含超过十亿张真实世界人脸的三维深度图和二维红外图像的训练数据，来理解人脸通常是什么样子。没错，苹果获得了许多不同人的同意，保存了他们各种面部姿态的照片！模型试图从这些数据中学习常见的人脸模式，例如多数人都有两只眼睛、一个鼻子和一张嘴。这是一个无监督问题的设定，因为它更多是揭示面部各部分之间的关系，而不是试图将人脸与人工构建的标签进行匹配。实际上，在此情境中根本没有标签。训练数据的多样性对于模型能够捕捉面部结构各要素之间的微妙关系至关重要——例如，不同的人有不同的眼睛颜色或眼睛间距。这些关系被表示为公式，即使你戴眼镜、帽子或其他改变面部外观的物品，这些公式也具有很强的适应性。当你第一次购买
    iPhone 时，系统会要求你用自己的人脸进行校准，以便模型能基于训练数据进一步调整其公式，从而适应（或学习）你的特定面部特征；由于你将是解锁 iPhone
    的唯一用户，它需要只识别你而不识别其他人。将来，解锁手机就如同将一张新面孔与此存储的表示进行匹配那么简单。随着时间的推移，模型会持续学习以适应面部结构的变化，因此即使你留起了胡子或长发，手机仍然能够解锁。

