  trans: '

    ### 关于作者与贡献者


    ### 关于作者


    ### 关于贡献者


    # 1. 互联网


    世界上大多数人都通过一个名为互联网的全球网络相互连接。它的前身是美国国防部资助的**高级研究计划局网络**（`ARPANET`），旨在让大学和研究实验室的计算机能够共享信息。`ARPANET`
    于 1969 年首次部署，1975 年全面投入运行。`ARPANET` 针对计算机之间共享信息所固有的困难提出的解决方案，构成了全球互联网的骨干。


    `ARPANET` 是如何做到的呢？请考虑以下类比。地方城镇通常由公路紧密连接。主要公路连接城镇，而更大的高速公路则连接各州。要融入更大的国家公路网络，一个城镇只需修建一条连接该镇与高速公路的道路即可。这条道路会将城镇居民与全国其他地区连接起来。类似地，`ARPANET`
    利用通信线路、卫星和无线电传输进行通信，通过 `WAN` *骨干网*（相当于中央高速公路）将所有*局域网*（`LANs`，相当于城镇道路）和*广域网*（`WANs`，相当于州际系统）连接在一起。


    从概念上讲，我们看到互联网是一个网络的网络——但这些网络是如何连接的呢？要创建一个原始的本地区域网络，可以用电线、电话系统或光纤电缆（使用光而非电）将几台计算机连接在一起。要将多个本地网络连接起来，可以使用一种称为*路由器*的“连接”计算机，它可以扩展子网络的规模。如果我们将这些本地子网络中的每一个都连接到一条中心电缆上，那么所有本地网络便连接起来了，从而构成了互联网。


    既然互联网本质上是计算机集群的物理连接，那么它究竟是如何作为一个运行顺畅的单通信线路网络来运作的呢？这个问题的答案正是互联网真正技术创新的所在。


    ## 分组交换、TCP 与 IP


    请记住，研究人员开始研究网络的整个原因是他们需要一种在计算机之间共享信息的方法。就像高速公路有出口标志和限速一样，也需要有规则来指导互联网上的信息流。为了解决这个问题，美国**高级研究计划局**（`ARPA`）通过两种软件定义了信息的传输方式：*传输控制协议*（`TCP`）和*互联网协议*（`IP`）。互联网软件层的这两个组件运行在硬件层之上，硬件层即构成互联网物理实体的电缆和设备。


    历史上，当两台计算机用电缆连接时，通信是单向且独占的。如果计算机 A 向计算机 B 发送了某些内容，数据就沿着电线传输；如果此时有任何其他通信尝试，数据就会发生冲突，谁都无法获得他们想要的信息。要创建一个允许数百万人同时、即时互动的网络，当时的技术将需要数量惊人的电缆。减少布线需求的唯一方法，是开发一种让数据能在同一通信线路上从多个源头发送到多个目的地的技术。


    这是通过*分组交换*实现的。研究人员发现，他们可以将任何信息（例如文本、音乐或图像文件）分解成小的“数据包”；这样做可以使单根电线同时承载来自多个文件的信息。存在两个明显的挑战：所有数据包如何到达正确的目的地，以及接收方如何将它们重新组合起来？


    退一步讲，互联网上的每一个页面都是某人编写的文档，它存放在某处的一台计算机上。当你用浏览器访问一个网页时，你本质上是在请求查看某台计算机上的某个文档的权限。为了让你能查看它，这个文档必须发送给你——而
    `TCP`/`IP` 正好有助于完成这项工作。


    `TCP` 将文档分解成小的数据包，并为每个数据包分配一些标签。首先，`TCP` 为数据包编号，以便它们能够按正确的顺序重新组装。其次，它为每个数据包提供一个称为*校验和*的东西，用于判定到达的数据是否遭到任何篡改。最后，数据包会被赋予其目的地和源地址，以便能够正确路由。`谷歌地图`在这里帮不上忙，但
    `IP` 可以。`IP` 为互联网上的每台设备定义一个唯一的地址。


    因此，这些数据包都带有你计算机的 `IP` 地址。`IP` 帮助将这些数据包路由到它们的目的地，其过程很像美国邮政服务投递邮件的方法。数据包从其起点被路由到下一个最靠近目的地的路由器。在每一步，它们都会被分类并推送到下一个最近的路由器。这个过程一直持续到它们到达目的地。通过这种方式，`IP`
    软件使得一组相互连接的网络和路由器能够像一个单一的网络一样运行。


    `IP` 的一个宝贵特性是网络冗余所带来的稳定性。如果整个网络的某个特定部分发生故障，数据包可以被重新定向到另一个路由器。当数据包到达你这里时，`TCP`
    会验证所有数据包是否都已到达，然后再将它们重新组装以供查看。


    实际上，几家计算机公司早就针对计算机间通信问题开发了各自的解决方案，但他们要求人们付费使用，而且这些方案互不兼容。如果买了 A 公司的解决方案却不能连接买了
    B 公司方案的人，那又何必买呢？`ARPANET` 的与众不同之处在于，`ARPA` 免费公布了其成果，使得 `TCP`/`IP` 可以公开访问。当美国军方分支于
    1982 年采用 `TCP`/`IP` 时，`ARPA` 这种开放且免费的方式得到了合法化和制度化。从此以后，计算机只有安装了 `TCP`/`IP` 软件，才能通过互联网发送或接收信息。


    因此，从 1982 年开始，研究人员可以在全球范围内共享信息，但如何显示和查看这些数据的问题依然存在。1990 年，蒂姆·伯纳斯-李和欧洲核子研究组织（`CERN`）的其他人开发了*超文本标记语言*（`HTML`）和*超文本传输协议*（`HTTP`）的前身，两者共同促成了格式化且具有视觉吸引力的信息的在线交换。1991
    年之后，第一批图形化浏览器——允许你在互联网上查看网页的程序——发布了。这为在网络上共享和消费信息创造了一种有吸引力且高效的方式。


    大约在同一时期，个人电脑成本下降，诸如 `AOL` 之类的在线服务提供商出现，提供了廉价的互联网接入。这些因素的共同作用，使得互联网迅速发展成为我们今天使用的网络。


    ## HTTP 与互联网的使用


    数据在物理层面如何传输是相当直接的，并且由 `ARPA` 开发的协议所定义——但是，你首先如何告诉别人发送数据呢？当有人——比如说你——访问你的心血结晶 `MyAppoly`
    时，幕后究竟发生了什么？

    '
- fmt: '# MyAppoly


    In case you skipped the preface, you should be aware that this book is structured
    as a loose narrative starring *you* as the main character. The premise is that
    you are building a web application called MyAppoly. The name is just a catchall;
    I encourage you to imagine MyAppoly in any context that catches your fancy. If
    you are a killer app entrepreneur or angel investor, MyAppoly will be your ticket
    to a $1 billion exit strategy. If you are a nonprofit executive, MyAppoly will
    help you raise funds and connect your volunteers. If you work at a Fortune 500
    firm, MyAppoly will help your company stay competitive and ahead of the curve
    of evolving consumer expectations.


    You open your web browser to access a picture on the MyAppoly website. In doing
    so, your computer becomes the *client,* requesting information. The physical web
    pages you visit are documents usually encoded in a language called HTML stored
    somewhere on a computer called the *server*. All of the files of your application,
    including pictures and videos, live on the server. These files are referred to
    as *resources*. Because a *client*, the user, is accessing a *server*, the Internet
    is said to follow a *client-server architecture*.


    You proceed to type your web address—the *uniform resource locator* (URL), [`www.MyAppoly.com`](http://www.myappoly.com)
    —into the browser. Technically, you could have typed the specific IP address of
    the MyAppoly server, but who has the capacity to remember the IP address linked
    to every website? The *Domain Name System* (DNS) converts human-friendly domain
    names such as [`MyAppoly.com`](http://myappoly.com) to the computer-friendly IP
    addresses.


    You reach [`MyAppoly.com`](http://myappoly.com) and click a link to view the picture
    gallery on the website. Remember, all of these pictures also live on the server.
    Let’s say that they are all in a folder called “Pictures.” If you click the first
    picture, you are taken to `http://www.MyAppoly.com/Pictures/pic1.jpg`. The URL’s
    component parts indicate that we’re using the HTTP protocol, the proper server
    (through the domain name), and where on the server the files are located (in tech-speak:
    the *hierarchical location* of the file). In other words, the URL is the text
    address of a resource.


    How exactly do you receive these web pages? First, the client—your browser—accesses
    the DNS to obtain the IP address corresponding to MyAppoly so it knows where the
    server is. Your browser does not physically travel to the MyAppoly server to fetch
    the picture, so it must send a message over the Internet telling the server to
    send the file. An HTTP request does just that. HTTP is a set of rules for exchanging
    resources (text, images, audio, and so on) on the Internet.


    Your request can be one of several different methods, most commonly `GET` or `POST`.
    The `GET` method tells the server that the client wants to retrieve files from
    the server. On receiving a `GET` request, the server retrieves the appropriate
    files and sends them back to your browser. The other request type is `POST`, which
    the browser uses if you are sending data to the server. In some instances, either
    method could service the request, but they are different in how data are actually
    sent over the Internet. With the `GET` method, the information you send to the
    server is added to the URL. If you are searching for the word “mediterranean”
    on MyAppoly, for example, the `GET` request redirects you to the URL `www.MyAppoly.com/search?q=mediterranean`.
    If the search term is sent via `POST`, the term would be within the HTTP message
    and not visible in the URL. It is considered good practice to reserve `POST` requests
    for those that alter something on the server-side.


    So the client has issued a request, which finds the MyAppoly server and tells
    it to `GET` the page containing the “pic1” file. The server fetches the resource
    and sends it back as a *response* using TCP/IP. The browser can use the header’s
    information to display, or *render*, the resource. The process is not necessarily
    finished, however, because the client may need to send more requests. Since the
    server can only send one resource at a time back to the browser, several requests
    may be needed to retrieve all the resources required to construct a web page.
    If you want to view the page that has the pic1 picture on it, you are asking for
    two resources: the HTML page, which has the text content and layout of the page,
    and the pic1 image. Therefore, the browser needs to send at least two requests.


    ## Conclusion


    With your knowledge of some of the basic elements, operations, and tools of the
    Internet, you are probably eager to move on to the challenge of creating MyAppoly.
    However, you must first set up website hosting, which is required for your application
    to be on the Internet.


    # Hosting and the Cloud


    Availability for a brick-and-mortar retailer includes inventory and the physical
    placement of products on shelves. In some ways, the Internet equivalent is *hosting*,
    the process by which the creator makes a website accessible to users on the Internet.


    It’s almost entirely impossible to escape a conversation about the Internet without
    mentioning the word *cloud*. But what does “the cloud” refer to, and why has it
    become a ubiquitous term?


    ## Hosting


    As you learned in Chapter 1, when you visit a website, your browser sends a message
    to a server asking for a file. How did the server have the information in the
    first place? The process by which a website is put on a server and made available
    on the Internet is called *hosting*. Your website files are saved onto servers
    that are connected to the Internet nonstop, ensuring the website is always accessible.
    Imagine if you put your files on a server that someone turned off every night.
    Nighttime visitors and customers would receive error messages, meaning lost business—so
    an always-on high-speed Internet connection for the hosting server is a must.
    In addition to internet connection, servers require special web hosting software
    but I don’t get into that here.


    You probably don’t want to host a website yourself. You certainly *could*—it would
    be free (electricity and Internet not included), and you would have complete flexibility
    over the server. The downside is that you have to manage it, which requires significant
    technical knowledge.


    Enough people in the world have realized that self-hosting is troublesome, so
    smart entrepreneurs started companies that provide hosting. They offer computers
    designed to store websites optimized for accessibility and speed. They removed
    all unneeded components on computers so they can be more efficient and cheaper
    servers. Say goodbye to card games and paint programs. No more monitor or keyboard
    either. Hosting providers accumulated racks of these minimalist computers and
    rented space on these servers to people who wanted to host their websites.


    Hosting providers quickly became popular because they allowed website developers
    to focus on their product. Hosting providers typically offer a control panel for
    website developers to manage the site and allow files to be moved to these remote
    servers using *File Transfer Protocol* (FTP), special software that allows you
    to upload your website files to the servers.'
