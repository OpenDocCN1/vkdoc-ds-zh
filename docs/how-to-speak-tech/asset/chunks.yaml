  trans: '

    ### 使用他人 API


    使用 API 的显著优缺点包括：


    **优点**：


    - **比较优势**：使用他人的 API 可以让你专注于自己的核心竞争力与价值主张。就像传统企业可能将文档编辑或报销等非核心工作外包一样，你也可以将支付处理、地图功能等工作外包出去。

    - **节省开发时间**：通过使用其他公司的 API 将非核心工作外包，能够节省开发团队的时间。无论是构建功能还是后续维护，都能节约时间。

    - **借助他人的专业能力**：公司通常会在其核心能力领域发布 API。无论这些 API 提供信息还是功能，这些公司往往投入了大量时间进行开发。即便你的团队也能做得很好，为何不将责任交给一家纯粹专注于解决该问题的公司呢？

    - **获取信息**：许多 API 提供数据访问权限。这些数据通常可在公司网站上获取，但格式不利于大规模采集。API 能以更易于处理的格式提供相同数据。例如气象
    API：网站可能显示某个城市随时间变化的每日天气，但假设你正在进行全球变暖研究，需要收集过去 50 年十个城市的每日数据，手动从网站复制每个数字将非常繁琐。而
    API 允许你一次性访问并下载所有所需数据。


    **缺点**：


    - **依赖性**：如果 API 背后的公司决定更改政策或关闭服务，你的 Web 应用将无法正常运行。这种风险是任何依赖第三方的业务都存在的。他们是否有许多大客户？运营状况如何？API
    是否已稳定运行一段时间？这些问题的答案有助于预测其可靠性。

    - **非定制化**：市场上也可能没有完全满足你特定需求的 API。API 提供通用解决方案，但可能无法完美适配你的网站。因此，在为了上述优点而适应 API
    功能，与从头构建完整功能以获得全部能力之间，可能存在权衡。


    在权衡这些利弊后，你的最终选择将取决于具体的 API 及其功能。请记住，利用现有代码是行业趋势，过度保守可能会让你的 MyAppoly 落后于竞争对手。


    ### 发布一个 API


    假设 MyAppoly 允许用户将随机笔迹样本与特定个人匹配。你可能正在为法医调查、电子支付验证或历史研究构建这个工具。实现所有这些场景的一种方式是发布 MyAppoly
    API。发布 MyAppoly API 的优点包括：


    - **规模化客户集成**：如果你想向不同的潜在合作伙伴提供数据或功能访问权限，为每个合作伙伴构建定制解决方案会耗费大量时间和资源。何不将接口标准化为 API，让合作伙伴在你设定的参数范围内访问所需内容？

    - **他人对你的依赖**：如果你的 API 成为多家公司运营的关键部分，你就为公司创造了额外的价值来源。他人依赖你。想想那些建立在 Facebook 之上的第三方应用。如果
    Facebook 消失，想象会有多少其他公司随之崩溃。其他公司对 Facebook 的依赖无疑支撑了其估值与成功。

    - **多样化的分发方式**：API 可以将你已通过应用呈现的相同信息，提供给那些希望以不同方式消费的人们。通过提供这种替代访问方式，你正在扩大市场。

    - **收入来源**：向他人收取 API 使用费可以成为可观的收入来源。

    - **更多数据**：每次有人调用你的 API，你都可以记录该信息。这些数据可能帮助你识别行业趋势或新功能的机会。

    - **品牌价值**：即使你选择免费提供 API，广泛使用所产生的价值也会以品牌和声誉的形式回馈给你。这有助于确立你在该领域的领导者地位及知识分享倡导者的形象。


    你还必须考虑缺点：


    - **资源消耗**：API 会带来额外的工程和维护挑战。每当你的数据源发生变化，你必须确保 API 正常工作。例如，如果将数据集扩展到包含音频文件，你必须相应更新
    API。最后，试图将你的 API 集成到自己应用中的开发者可能需要客户支持以及解释可用功能的文档。缺乏支持的 API 会导致开发者沮丧并最终放弃。如果你打算发布
    API，请预先警告，这可能会是一个资源密集的过程。

    - **安全性**：API 允许用户访问你的数据。这个入口可能暴露漏洞，导致你不想共享的其他信息被不当访问。不过，API 的广泛流行表明这些风险是可避免或可管理的。

    - **成本**：每次开发者使用你的 API（通过进行 API“调用”或“请求”），MyAppoly 都必须采取行动。谁来支付处理这些请求的费用？是你！在发布
    API 之前，你需要一个计划来承担处理请求的费用。


    你的 API 成功与否，将取决于开发者学习、使用和集成的难易程度。


    ### API 如何工作？


    API 背后的技术细节可能很复杂，但其基本原理很简单。API 是软件与软件之间的接口。应用程序无需你参与即可相互通信。例如，如果 MyAppoly 需要显示天气，软件可以与气象
    API 通信（“发起调用”）以获取最新天气预报，然后再展示给用户。


    获取天气的一种方式是通过天气网站（直接访问）。或者，你也可以通过 API。你不是通过浏览器直接访问天气，而是编写代码，利用 API 获取所需信息。但你怎么知道该写什么代码？API
    提供了*文档*，告诉你哪些是有效的请求以及如何准确编写，这类似于编程语言。因此，在阅读 API 的说明和规则后，你使用其`getWeather`函数来指定你想要天气数据。当你将该函数提供给
    API 时，它会与服务器交互以检索你请求的信息。然后 API 以易于解析的格式（通常是 XML 或 JSON，详见本章“JavaScript 对象表示法”部分）将结果返回给你。根据
    API 允许的操作，理论上你可以通过 API 获取所有所需信息，再也不必通过浏览器访问该网站。


    从这个例子可以看出，API 是为软件开发者设计的，可定义为“一组例程（通常是函数）以及使用这些函数的随附协议，为软件开发提供构建模块”。它们允许用户通过安全通道连接到应用，然后使用代码运行函数以获取信息或借用功能。


    两种更流行的 API 类型——*表述性状态转移*（REST）和*简单对象访问协议*（SOAP）——将在接下来的章节中描述并进行比较。

    '
- fmt: '#### REST


    `REST` is an architectural style developed by Roy Thomas Fielding to allow the
    Web to be more scalable. Every request has two parts: the endpoint, or URL, and
    the message that contains the request. This message consists of a few parts, including
    a developer ID or “key” if required (this helps the API keep track of who is making
    requests and how often), the desired action (e.g., `getWeather`), and parameters
    that give more information on the request (e.g., `getWeather` for today and yesterday
    only). All of this information is encoded in the URL and sent to the API via the
    HTTP `GET` method. The API then decodes the request, interacts with the server
    to complete the desired action, and then returns a response to the user.


    #### SOAP


    Started as a Microsoft initiative in 1997, `SOAP` is another way to request data
    from remote servers using HTTP. While the `REST` API encodes the specifics of
    the request in the URL, `SOAP` sends the details of the request in an XML document.
    The XML document that makes up the message has to satisfy the specifications outlined
    in a *Web Services Description Language* (`WSDL`) file. In a way, `SOAP` is like
    sending a request in an envelope (hiding the request’s details), whereas `REST`
    is like sending a request on a postcard (viewable by all). Both travel via mail,
    or HTTP, though.


    #### Comparing REST and SOAP


    `REST` and `SOAP` present the following points of comparison:


    *   *Overhead*: Because `REST` requests are confined to a URL whereas a whole
    document describes `SOAP` requests, the latter tend to be larger, require more
    overhead, and contain more information in different parts of the message that
    further define the request.

    *   *Transparency*: To continue the postcard and envelope analogy, everything
    is out in the open with `REST` and hence monitored more easily, whereas only the
    address (endpoint URL) is viewable with `SOAP`.

    *   *Development time*: `REST` APIs are typically quicker to develop than `SOAP`
    APIs, contingent on your individual programmer’s expertise.

    *   *Flexibility*: Because `SOAP` uses XML documents as messages, more information
    can be included in `SOAP` requests than in `REST` requests, giving `SOAP` APIs
    greater flexibility.


    ### Authentication


    As discussed in the opening sections of this chapter, you might want to keep track
    of who is using your API and what they are requesting. You also might want to
    communicate with your API users to confirm the accuracy of the data and security
    of the connection. Approaches to authentication include the following:


    *   *Open API (no authentication)*: There are no barriers to use the API, the
    code can be distributed more freely, and you do not need to manage requests, assuming
    you are okay not tracking individual users. Open API is an attractive option if
    you are interested only in anonymous, aggregated data, not in specific individuals’
    actions or in controlling access to the API.

    *   *Message-based authentication*: Credentials such as a unique developer’s key
    can be passed in the API request as part of the message. Alternatively, information
    can be passed in the HTTP headers of incoming requests.

    *   *SSL endpoint*: This method helps the client keep track of the server. After
    receiving a server certificate, the client can check to see if it changes. If
    it does, the information is likely coming from a source other than the server
    and therefore cannot be trusted. This authentication method prevents an attacker
    from impersonating the person you are expecting. Because the `SSL` endpoint method
    does not help identify the client, it is used in conjunction with one of the other
    methods listed here.

    *   *Client-side certificates*: You can configure your API to create certificates
    to give to a client (via a secure channel) to present for authentication every
    time the client makes a request. Although client-side certificates are considered
    a robust way of dealing with authentication, this form of authentication can be
    considerably slower.


    ### JavaScript Object Notation


    Another formatting language besides XML (Chapters 4 and 5) that you are likely
    to come across is *JavaScript Object Notation* (`JSON`), which uses a collection
    of name/value pairs that can be nested. For example, a book (object) can contain
    many name/value pairs that describe its author, title, and year published. Many
    APIs “return” (deliver the response in) `JSON` rather than XML. These are different
    ways of structuring the same information.


    ## Libraries


    A *library* is a collection of code that defines commonly used functionality (such
    as drop-down menus or animated pop-up windows). For example, you might create
    a library of math variables and functions. You can share your library so that
    anyone else who wants to use math in their programs can import your shared library
    and save a lot of time. Shared code and libraries reduce development time and
    the number of developers needed.


    On the other hand, how much do you trust the reliability of your system on someone
    else’s contributed software? There are no right or wrong answers, but your ultimate
    decision requires good judgment on behalf of your team of programmers.'
