  trans: '

    # 3. 后端：编程语言


    过去几周，你一直在构思并优化 MyAppoly 的愿景。下一步是什么？由于创建应用的技术门槛，许多潜在产品从未跨过这一阶段。软件应用程序是用编程语言编写或*编码*的。代码定义了应用程序的运行和响应方式，涵盖从你所看到的内容到后台发生的一切。首先要做出的技术决策之一就是为产品选择一种编程语言。你可能听说过
    `Python`、`Ruby` 和 `C` 这类语言，但它们是什么？它们之间有什么主要区别？在选择语言时，应该考虑哪些因素？


    编程语言不过是一套计算机可以遵循的命令。编程则是一门艺术，它将这些命令组合成一组指令，来定义应用程序的行为。MyAppoly 团队首先需要使用一种编程语言来定义*后端*，它负责处理用户的所有操作。例如，当你点击
    Facebook 上的“添加好友”时，其后端会通过与数据库及其他信息源交互来处理这次点击，以实现你所期望的结果。在这个例子中，后端会向你的好友发送一条消息。对于
    Google 来说，后端可能会接收你的搜索查询词，然后通过其算法来找到相关结果。后端也被称为“服务器端”，因为定义后端的代码驻留在服务器上。用户通过*前端*与后端进行交互，前端是你可以在特定页面上执行的操作界面和一系列交互。你点击的“添加好友”按钮以及你朋友的个人资料页面，都是
    Facebook 前端的一部分。这是你能看到的部分。我们将在第 4 章中更详细地讨论前端。


    编程语言的创建和更新速度惊人。因此，了解编程语言的基本技术术语和分类，将帮助你跟上其发展的速度。你最终选择的语言将取决于你的需求和具体情况。


    编程语言的流行度排名每年都在变化。例如，2018 年 8 月排名前十的编程语言与 2017 年 8 月相比，排名变化如下：^(²)


    1.  `Java`（持平）

    2.  `C`（持平）

    3.  `C++`（持平）

    4.  `Python`（从第 5 位上升）

    5.  `Visual Basic .NET`（从第 6 位上升）

    6.  `C#`（从第 4 位下降）

    7.  `PHP`（持平）

    8.  `JavaScript`（持平）

    9.  `SQL`（此前未上榜）

    10. `Assembly language`（从第 14 位上升）


    ## 按层级对编程语言分类


    计算机只理解二进制，即由 0 和 1 组成的系统。所有文件、程序和数据的本质都是由 0 和 1 组成的。每个 0 或 1 被称为一个*比特*，而八个比特组成一个*字节*。计算机解释字节的方式取决于程序员如何选择标记或指定它们。例如，考虑字节
    `0100 0001`。作为数字，这个字节代表 65，但你可以告诉计算机将其读取为一个字符，那么它就会被解释为字母 A。更大的信息单元，比如本书的在线版本，是由大量字节组成的（以千字节、兆字节或吉字节为单位）。例如，购买电脑时，你可能会看到它有
    16 GB 的空间。这意味着这台电脑可以存储 16 吉字节的信息。


    程序员可以通过计算机的机器语言来操作比特和字节，但想象一下通过更改 0 和 1 来编写 MyAppoly。这将是极其困难、繁琐和昂贵的。因此，尽管机器代码最接近计算机实际理解的内容，但程序员定义了简单的函数来替自己完成比特编码。这些函数共同构成了*汇编语言*。程序员可以用汇编语言编码，然后使用汇编器将程序转换成计算机所需的二进制代码。


    汇编语言同样被证明是繁琐的，因此程序员创造了具有更强大命令的*高级语言*。这些语言允许我们编写更接近人类语言的代码。高级语言代码直接或通过汇编语言的方式转换为机器语言。因此，高级语言并没有扩展计算机在代码中可能表达的行为集合。使用高级语言与汇编语言的区别，类似于列出制作三明治的几个指令与用一百个小步骤繁琐地解释整个过程的区别。


    高级语言，例如 `PHP` 和 `Python`，之所以被称为*高级*，是因为它们使程序员能够进行抽象思考，而不是处理具体的比特和字节。相应地，汇编语言被认为是*低级*的，因为它们更接近硬件。有些语言，例如
    `C`，被认为是*中级*的，因为它们允许程序员考虑比特，但同时又比汇编语言更接近人类语言，并拥有更复杂的命令。


    ### 处理高级语言


    为了编码 MyAppoly，你将使用一种高级编程语言。高级语言可以根据不同的标准进一步细分。一种有用的分类法基于计算机读取语言的方式，将高级语言分为两种类型：*编译型*和*解释型*。^(³)


    *编译型语言*使用编译器将代码翻译成计算机处理器能够理解的语言。如果你用 `C` 或 `Java` 编写 MyAppoly，你就是在使用编译型语言，你编写的程序被称为*源语言*。编译器将源语言翻译成机器可执行代码，就像把一本英文书翻译成法语一样。编译型语言运行速度快，但开发速度慢（即用其编写应用程序的速度），相关细节见第
    11 章。


    *解释型语言*例如 `PHP` 是实时翻译的。它们被解释的方式，类似于一个说英语的人请一位同声传译向只说法语的人连续且实时地翻译。因此，其执行速度比编译型系统慢一到两个数量级。对比一下，一个法语母语者阅读本书法文译本所需的时间，与同一个人听一位法语翻译现场同声传译英文原版本书所需的时间。一个不那么明显的缺点是，解释型语言效率较低，因为它们通常会消耗更多内存。虽然运行速度较慢，但解释型语言的开发速度通常要快得多。

    '
- fmt: '## Other Taxonomies of High-Level Languages


    Coding experience makes it easier to understand the following descriptions, but
    the main takeaway is that different languages are built for different types of
    tasks. One language may be suitable for building a complicated trading algorithm
    for a financial investor, whereas another language may be best for building a
    simple tool for a teacher to sort through a list of students for grading.


    Codifying the different types of programming languages is not simple. If I asked
    you to classify all the types of dogs in the world with a single system, you would
    find it a difficult task. There are different ways you could try, but inevitably
    there would be overlap between the various groups. As with Labradoodles and Cockapoos,
    the overlap between languages is extensive. Nonetheless, the following taxonomies
    of high-level languages contain keywords you will most often hear in the tech
    world:


    - *Imperative languages* focus on *how* to achieve an objective and are typically
    written as a sequence of commands that create and modify variables. Examples include
    `C` and `Java`. These languages fall in contrast to *declarative languages* that
    focus on the *what* of an objective and leave the *how* to the programming language.
    Examples include `SQL` and regular expressions.

    - *Functional languages* rely on functions and recursion as their main method
    of computing instead of stored variables or iteration. Examples include `CAML`,
    `Standard ML`, `Scheme`, `Lisp`, and `Haskell`.

    - *Object-oriented languages* create *objects* to store information and execute
    commands. For example, in an academic application, a programmer might create an
    object for each student. The object contains *variables* that define data like
    the student''s name and advisor and a set of related functions, called *methods*,
    which describe how the computer should retrieve the student''s grades or display
    their courses. Everything that might usefully describe the student is defined
    in this student object. Object-oriented programming also implements *abstraction*,
    which allows a programmer to define shared attributes in one place. Suppose you
    now wanted to create a teacher object. It would include a variable to store the
    teacher''s name and a way to display their courses. Note that these are the same
    things we defined in our student object. Rather than rewrite your student variables
    and methods for teachers, you can create an "academic person" object and have
    students and teachers be specific types of "academic person" objects. Examples
    of object-oriented languages include `Java` and `C++`.

    - *Scripting languages* share many qualities with imperative and object-oriented
    programming. These languages are weakly typed, a term that references the flexibility
    with which they define and convert between types. Recall that variables need to
    be specified as a particular type, such as a number or character, so the computer
    interprets its underlying bytes the way we want. This flexibility allows for rapid
    development but reduces reliability (discussed in the next section). Scripting
    languages such as `Python` and `Ruby` interface easily with many different systems,
    such as `API`s and databases (Chapter [6](#321739_2_En_6_Chapter.xhtml)).

    - *Parallel programming languages* allow for multiple execution sequences to proceed
    concurrently. Typically, parallelism is used to speed up a process—evaluating
    two things at once is quicker than doing one after the other—or to react to events
    that might occur at the same time.

    - *Query languages* are used to interact with a database (Chapter [5](#321739_2_En_5_Chapter.xhtml)).

    - *Markup languages* use *tags* and special characters to give structure to a
    document (Chapter [4](#321739_2_En_4_Chapter.xhtml)). This structure is typically
    used to visualize a document. Examples include `HTML` and `XML`.


    ## Choosing the Right Language


    You now have a better understanding of programming languages and their different
    types, but you may not be closer to picking a language for MyAppoly. Language
    design principles serve as useful background in evaluating language effectiveness,
    but practical factors will ultimately govern your decision.


    ### Technical and Design Considerations


    In evaluating programming languages for their suitability to your requirements,
    first consider their technical and design parameters, as follows:


    - *Naturalness of application* refers to the relative ease of coding your application
    in a particular language based on the functionalities and constructs it provides.
    Object-oriented programming languages became popular in part because they allow
    the programmer to think about the solution to the problem in many ways and therefore
    fit many programmers'' uses.

    - *Reliability* refers to a program''s ability to perform the same way each time.
    A program can run into different types of errors (relating to how a computer interprets
    the bytes that make up a variable) either when you run the program (at "runtime")
    or when compiling. It is cheaper to catch errors at compile time rather than at
    runtime, but as we mentioned before, compiled languages typically take longer
    to develop and execute. The trade-off between cost of execution and reliability
    is one that programmers constantly face (Chapter [11](#321739_2_En_11_Chapter.xhtml)).

    - *Support for abstraction* (as discussed in the previous section) refers to the
    ability to define and use complicated structures or operations in a way that allows
    many of the details to be ignored.

    - *Portability* refers to the ease with which your program can be translated into
    another programming language. For example, if you are choosing between two new
    programming languages, you may decide to use the one that can more easily translate
    into a well-established language.

    - *Efficiency* refers to the time that the code takes to execute, often at a cost
    to abstraction. Lower-level languages allow more control over memory usage and
    provide a more optimized experience for users (Chapter [11](#321739_2_En_11_Chapter.xhtml)).'
