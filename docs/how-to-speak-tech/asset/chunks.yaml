    ### 实际考量因素


    以下实际考量因素将最终决定你为构建 `MyAppoly` 所选择的编程语言：


    -   **适用性**：如果工具选错了，代码可能会变得不必要的复杂。

    -   **文档**：文档指的是解释语言语法（具体需要输入什么才能使其工作）、用法和结构的资源。文档详尽的语言非常有用，尤其是当你和你的团队需要边学边编码时。

    -   **开发时间**：历史上，速度和内存使用率是选择语言的关键因素，因为处理速度慢且内存有限。然而现在，硬件变得便宜，并且越来越便宜。由于硬件比雇佣一名新程序员更便宜，组织往往更优先考虑开发时间而非执行时间。

    -   **可靠更新**：更流行的语言，如 `PHP` 和 `Python`，往往会根据程序员的反馈定期更新。每次更新都使指令表达更容易，扩展了程序员可以使用的命令集，或者修复了语言中的问题。

    -   **可维护性**：这个实际因素与语言的简洁性和可读性有关。如果 `MyAppoly` 需要长期运行，你需要寻找新的程序员来满足日益增长的需求。如果理解、更新和修正你的代码如同噩梦一般，你的产品可能会被严重延误。

    -   **活跃的社区**：流行语言的另一个好处是拥有使用它的程序员社区。如果很多人使用同一种语言，那么你想要实现的行为大概率已经有人编写过程序了。论坛和博客（Stack
    Overflow 就是一个著名的例子）中充满了示例代码，可以帮助你更快速、更轻松地启动产品。

    -   **人才库**：活跃的社区也构成了你招聘技术人员的潜在市场。如果你选择一种冷门语言，那么你扩展团队、找到精通该语言的人才的能力将受到限制。

    -   **API、库和工具**：庞大的程序员社区可能会发布一些工具，你可以直接将其插入到你的程序中，从而节省自己编写程序的时间（第 6 章）。这些工具通过为开发者提供所有
    Web 应用通用的功能，来支持 Web 应用的开发。

    -   **集成开发环境 (IDE)**：这个一站式应用程序包含用于编写代码的编辑器、用于翻译代码的源代码编译器、用于帮助发现程序中任何错误的调试器，以及其他一些项目管理相关的工具。*编程环境*，即用于开发产品的工具集合，非常重要，选择一款支持更好的语言能帮助你的程序员提高效率。


    ## 结论


    在权衡为 `MyAppoly` 使用哪种语言时，你意识到科技初创公司已越来越倾向于优先考虑开发时间，甚至超过几乎所有其他因素。主要有两个原因：硬件在不断变得更便宜（第
    14 章），以及流行的产品开发原则要求快速迭代（第 8 章）。你的竞争对手正在以最快的速度构建产品。意识到自己需要成为先行者，你迅速考虑了本章列出的所有因素，并最终决定使用当今最流行的脚本语言。你没什么时间可以浪费。


    脚注 1 2


    # 4. 前端：呈现层


    知道使用哪种语言很有帮助，但如果没有前端，用户什么都做不了。回想一下，前端是用户与后端交互的界面。它指的是你在特定网页上看到的内容以及你可以执行的一系列交互操作。你开始思考
    `MyAppoly` 看起来会是什么样子，你想要哪些页面，以及它们之间如何连接（例如，页面 1 上的按钮 A 带你到页面 9）。然后，你最终确定了一组你想要包含在
    `MyAppoly` 中的功能，并为每个网页开发线框图。


    线框图是屏幕的简单蓝图。拼装线框图会迫使你思考信息设计和交互设计。*信息设计*涉及如何呈现你想要传达给用户的所有内容或消息。*交互设计*指的是你希望用户为完成某项整体任务而执行的一系列操作。例如，在像亚马逊这样的网站上，产品描述和评论的放置属于信息设计，而用户查看商品、将其添加到购物车并最终购买商品的流程则与交互设计有关。


    在设计前端时，你还需要考虑用户界面和用户体验。*用户界面*，通常缩写为 `UI`，指的是应用程序的外观。一个好的 `UI` 能让应用程序直观易用，而一个糟糕的
    `UI` 可能杂乱无章或让用户感到困惑。*用户体验*（`UX`）指的是用户对于使用你的应用程序的感受；你应该始终争取积极的用户体验，这通常来自于运行良好的后端、易于理解的
    `UI` 以及经过深思熟虑的信息和交互设计。


    你与 CTO 一起审查了 `MyAppoly` 的模拟图。实际上，你已经创建了一个网站纸质版。太棒了！那么，你如何让你的网站看起来像这样呢？你将如何创建大多数现代网页上都能看到的交互效果？某些语言和工具已经变得如此普遍，以至于值得学习它们的基础知识，因为它们共同构成了呈现层，并定义了你的用户将获得的体验。


    ## 前端技术


    用于创建呈现层的标准前端工具包括 `HTML/XHTML`、`CSS`、`JavaScript` 和 `Ajax`。

