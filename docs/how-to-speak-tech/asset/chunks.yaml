- fmt: '### Securing Your Application


    It might be overwhelming to think about securing your application. Luckily, several
    open-source libraries and packages implement protocols and best practices for
    you. Using libraries is essential because security is difficult to implement—and
    poorly implemented security leaves your application wide open to attacks. Popular
    open-source libraries tend to have robust implementations since anyone can review
    the code and point out loopholes. Look for libraries that are well-maintained
    and whose developers respond to issues promptly.


    Many of the attacks and mitigations we’ve discussed come back to the same lesson:
    never trust the user. In particular, several integrity attacks, such as SQL injections,
    rely on the ability of bad actors to provide input that causes the application
    to perform harmfully. Validating user input as discussed earlier is one piece
    of protecting yourself against these attacks.


    A second piece is access control, which involves establishing permissions so that
    each user has access to only what they need. Consider a bank that gives each user
    a homepage at `mybank.com/username/home`. By guessing usernames, attackers could
    find other users’ homepages and access sensitive information in a clear breach
    of confidentiality. Instead, the bank can check that the username of the logged-in
    user matches the username associated with the page they are trying to access before
    loading the content. Proper access control means that an application ensures that
    a user has the right permissions before they view the content (e.g., their bank
    homepage) or perform an action (e.g., withdraw money from an account).


    ### Staying Secure


    Now that you’ve built a secure first version of your application, you might wish
    to focus all of your efforts on marketing your product. Unfortunately, as the
    old saying goes, “ain’t no rest for the wicked”—bad actors don’t stop trying to
    attack your resources. Even when you are not actively developing new features,
    you must take precautions to ensure your application stays secure—two essential
    measures are testing and installing updates.


    Security testing builds on top of the testing done while developing the application.
    Routine testing won’t necessarily catch all bugs. Finding security bugs is of
    exceptional importance since they can lead to dire consequences, while logic bugs
    or rendering bugs lead to poor user experience at worst. To catch these high-risk
    bugs, developers use penetration testing, a model that simulates a security attack
    on the application. Penetration testing often employs the use of fuzzing, the
    practice of randomly generating inputs to an application and confirming that the
    outputs are both valid and expected. Fuzzing is useful for simulating edge cases
    that other tests may not have otherwise uncovered. Many companies also employ
    ethical hackers to find flaws in their system so that they can fix them before
    bad actors find and exploit them.


    Your application’s bugs aren’t the only ones that are cause for concern. It’s
    inevitable that your work will rely on platforms, frameworks, and libraries built
    by others. Sometimes, one of these third parties discovers a security flaw and
    releases an update to fix it, also known as a patch. Promptly installing updates
    is crucial; until you install the patch, your application remains vulnerable to
    the security flaw it is supposed to fix. In the case of the Equifax breach, hackers
    exploited an old version of a third-party library that Equifax had neglected to
    update, months after a patch was released.^([^(22)](#fn22)) These vulnerabilities
    exist in even the most established libraries—Heartbleed, a bug that opened the
    way for one of the most destructive attacks ever, was part of the OpenSSL library,
    widely used to execute the TLS protocol. As we discussed, TLS is one piece of
    how computers talk to each other. Hackers exploiting the Heartbleed protocol could
    manipulate requests to trick a computer into sending more information than they
    had access to; sometimes, this data included personal information such as usernames
    and passwords. Here, the crucial discovery for hackers was realizing that the
    receiving computer didn’t validate the amount of information that they were requesting.
    Once again, this example illustrates the need to validate user inputs.


    ### Minimizing Damage


    Even if you follow all of the best practices described above, a hacker could still
    break into your systems. New methods of attack emerge all of the time, so an application
    is never 100% secure. After an attack, you must work to secure your resources
    and to recover as quickly as possible. The first step is to check your system
    logs. A log is a report of some action, transaction, or event. Computer logs are
    useful because they can continuously monitor a system, and you can choose what
    to include in them. For example, you might log when a user signs in or when your
    application makes an API call. Most of these logs will and should be innocuous,
    as most of the activity on your site should be valid. However, when there is suspicious
    activity, logs can make it easier to spot malicious behavior or fraud. Take the
    case of a credit card company that notices a user’s credentials popping up around
    the world. This could be a world traveler—or a stolen identity. Either way, logs
    provide insight into the situation and how best to move forward. You may need
    to fix a bug or build in more precautions, like adding offending sites to a blocklist.


    After being struck by an availability attack and losing access to your data, you
    need to restore services as soon as possible. For this reason, it is a best practice
    to maintain encrypted backups of your data in different physical locations. Even
    if you lose data accidentally (perhaps you drop your phone in water), backups
    ensure that you can securely restore your data in some capacity, instead of losing
    everything. Storing backups in different locations protects data from physical
    attacks.


    Backing up data is crucial, particularly when you provide sensitive services.
    Let’s examine the case of the WannaCry ransomware, which hit over 60 organizations
    in the National Health Service (NHS) of the UK.^([^(23)](#fn23)) While the NHS
    had lax security practices that allowed WannaCry to breach their systems, their
    backup system allowed the majority of organizations to recover from the attack
    with no data loss and without paying the demanded ransom. The ability to recover
    quickly was vital for a health system serving critically ill patients. As a result
    of robust enterprise backup systems, WannaCry was a much less financially successful
    attack than other ransomware because affected businesses only lost a copy of their
    data.'
