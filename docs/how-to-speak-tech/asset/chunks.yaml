    ### 硬件


    数据物理上存储在硬件的某个组件中——通常是辅助存储器，例如磁盘。存储硬件可按以下几种方式分类：主存储器、辅助存储器和三级存储器。


    `主存储器`提供对数据的快速访问，因为计算机的中央处理单元（CPU）直接与之交互。CPU 执行计算机程序的指令，因此可以将其视为处理过程的大脑或程序的执行者。当计算机执行您请求的任务时，它首先访问主存储器以获取具体操作指令，然后
    CPU 再执行。与主存储器相关的术语包括`寄存器`、`高速缓存`（也称为静态随机存取存储器或 SRAM）以及`动态随机存取存储器`（DRAM）或主存。这些不同部分关联着不同的任务，但它们都服务于同一个目的：使
    CPU 正在使用的数据和程序保持就绪状态以便执行。我们说主存储器是易失性的，因为当机器关闭或断电后，其中的内容会丢失。然而，主存储器成本高昂，因此其规模往往有限。


    相比之下，`辅助存储器`是非易失性的、成本更低，且不被 CPU 直接访问。由于数据在计算机关闭后仍能保留，并且我们通常希望数据的安全性不依赖于计算机的电源状态，因此辅助存储器作为我们的海量存储场所也就不足为奇了。CPU
    无法直接访问辅助存储器中的内容；数据必须先复制到主存储器中才能执行，这一事实也凸显了为何访问辅助存储器的速度通常较慢。硬盘驱动器、闪存和软盘都是辅助存储器的例子。


    `三级存储器`与辅助存储器类似，同样不被 CPU 直接访问。它用于海量数据存储，且速度远慢于辅助存储器。


    区分这三类存储器的关键权衡因素是访问时间与费用，本章末尾的“优化”部分将对此进行探讨。


    ### 软件


    当用户与 MyAppoly 交互时，他们会执行一些操作，而您需要将这些操作保存到数据库中。一个`数据库管理系统`（DBMS）负责定义数据库，并在用户和应用程序之间对数据进行存储、操作和共享。


    可以将 DBMS 视为文件管理的总管，负责管理所有 MyAppoly 访客的请求。当用户在 Facebook 上点击“接受好友”时，系统会创建一个请求并发送至数据库。DBMS
    在将这些请求发送到数据库之前，会先进行接收和分析，随后这些请求被`解释`（转换为数据库能够理解的请求）并执行。代表 DBMS 实际访问数据库的代码被称为数据子语言；其中一种流行的是
    SQL。


    DBMS 提供了一种方法来控制`并发`（同时向数据库发出的多个请求）、`冗余`（同一信息在数据库中被多次存储）、`安全性`、`恢复`（防止某种数据库故障）以及`优化`（及时处理请求）——这些方面极大地提升了开发人员的价值。


    ### 用户


    您的最终用户是 MyAppoly 的用户，他们通过与应用程序交互，在后台生成对数据库的请求。当新用户注册时，系统会发出一个数据库请求，要求 DBMS 向数据库中添加一个新用户。


    ## 三层架构


    您还会听到数据库系统被描述为一种由三部分组成的`架构`：物理层、逻辑层或概念层，以及外部层。物理层是数据存储的地方，逻辑层包含 DBMS 如何与应用程序交互，而外部层则包括用户与数据库的交互。


    数据库系统的三个层次、三层或三种模式与我们之前对数据库的描述类似，但理解这些在数据库系统上下文中可能出现的术语是很有帮助的。现在也更容易解释数据库独立性原则了。DBMS
    提供了一种抽象形式，使用户无需了解数据存储的细节即可与数据库交互。因此，任何一个层次的实现在不影响整个系统的情况下都可以更改。假设您的程序员将应用程序编码为以列表形式显示所有
    MyAppoly 用户的姓名。而您希望所有用户显示在图表上。让程序员重写对数据库的请求来获取信息会很麻烦。


    得益于数据独立性原则，您的程序员可以将列表更改为图表，这不会影响程序员与系统其他部分的交互方式。该更改仅影响可视化层，与您如何获取数据或数据如何存储无关。总之，系统将数据的管理与数据的实际使用分离开来，这具有多项优势。有人可能会说，请求经过中间人（DBMS）处理后到达数据库这一过程会减慢处理速度，但收益远大于延迟成本。


    ## 分类


    对数据库管理系统进行分类的标准包括以下几点，后续小节将分别予以讨论：


    *   `数据模型`：数据需要以准确且高效的方式存储，以描述真实世界。下一节将讨论不同类型的模型。

    *   `站点数量`：`集中式`和`分布式`是您可能之前就遇到过的流行术语。它们与数据库的关系将在“集中式与分布式”一节中讨论。

    *   `成本`：解决方案的成本范围很广。存在免费开源解决方案，例如`MySQL`。对于希望获得更可定制系统的大型企业，也提供商业解决方案。


    ### 数据模型


    在数据库中有多种高效且有组织地存储数据的方式。以下各小节将讨论四种最常见的数据模型：关系模型、非关系模型、面向对象模型和对象关系模型。

    '
- fmt: '#### Relational Model


    A model proposed in 1969 by Edgar F. Codd called the *relational model* became
    and continues to be the de facto standard. `Relation` is nothing more than a mathematical
    term for a table, so from that fact alone, we can ascertain that the relational
    model uses tables to represent data.


    In the relational model, which is also known as the entity-relationship model,
    everything that exists, such as a car, a class, or a store, is an entity. Each
    entity has attributes, which are the columns of the table: a car has a color,
    a class has a name, and a store has a location. Each row of the table represents
    a specific entity (also can be called an object or record). In our users table,
    each row will describe a user of `MyAppoly`. The columns can be items such as
    first name, last name, password, address, and email address. It is common for
    tables to have a primary key, or a column for which the value is unique for every
    row, usually a unique ID for that entity. A unique user ID in the `MyAppoly` table
    would allow us to refer to individual customers with no chance of overlap. Most
    websites require usernames to be unique, meaning usernames could be used as the
    primary key instead of a user ID.


    Now that the database models our entities and their relationships well, how do
    we interact with the database? Typically the database and its specific tables
    are modified by using particular operators that the DBMS and its data sublanguage,
    the language used to communicate with the DBMS, provide. As with all languages,
    the sublanguage is picky and requires requests to be formatted in a specific way,
    so you have to spell out very clearly what you want. For example, *Structured
    Query Language* (SQL) is a proprietary query language (data sublanguage) developed
    by IBM that is now the de facto international standard and supported by most relational
    systems. In SQL, these operators would include `INSERT` (add entry to table),
    `DELETE` (remove row from table), `SELECT` (retrieve information already stored
    in database), and `UPDATE` (modify existing rows).


    There are several commands worth knowing that allow for more complicated operations.
    One example is `JOIN`, which is used in conjunction with `SELECT`. Let’s say you
    have the user table as described above and a separate table called pets that stores
    data on all of the users’ pets. Every row of the pets table represents a pet,
    and the columns include name, owner, color, and type. In this example, the owner
    column of the pets table should correspond to a user in the user table. What if
    I wanted to answer the following question: “What are the addresses of all users
    who own pythons as pets?” This request involves accessing the pets table to retrieve
    all owners who have pythons and then giving each owner in your list of owners
    to the users table to obtain their addresses. This two-step process can be simplified
    by using the `JOIN` operation, which essentially combines two tables based on
    a shared column. (In this example, the shared columns would be user and owner.)
    This example illustrates that requests can get complicated given the structure
    of relational systems, but operations exist to let developers obtain answers to
    their questions.


    The query language and operators just described are nonprocedural, meaning that
    users can specify what they want but not necessarily how the DBMS should go about
    executing the request. I’m not sure if you would have a strong opinion on how
    specifically your data is retrieved, but it could matter from a speed perspective.


    Let’s review a few other concepts and terms for thoroughness. A series of requests
    that make up a particular task is called a *transaction*—all of the requests required
    to register a user and his or her pet, for example, could define a transaction.
    A few rules exist for transactions that are not exclusive to relational systems
    but will be discussed here briefly. First, transactions are *atomic*, meaning
    they are all or nothing—either the user is entirely registered or the database
    remains unchanged. As a result, even if the process were to fail halfway through
    for whatever reason, the table is still consistent, meaning there are no incomplete
    rows or partially updated records. Second, transactions are *durable*, meaning
    that they immediately change the database and the changes are available right
    after the transaction execution completes. Any lag in transactions being reflected
    in the database would negatively affect the entire experience of the site; imagine
    if it took a week for your Facebook friend list to update every time you accepted
    a new friend. Third, transactions are *isolated*, meaning two transactions are
    considered independently by the DBMS. Designing a database that adheres to all
    these constraints is difficult, but these descriptions should help you understand
    how a DBMS thinks about requests.


    One last term to mention is *normalization*, which refers to the process of eliminating
    redundancy in databases. Let us go back to our example of users and pets tables.
    What if a developer created a column in our pets’ table called owner’s address?
    Isn’t that information already saved in the users table? In this case, the address
    columns would be redundant and waste space. While normalization can help database
    users conserve memory, it can also take longer to get the results for queries.
    If I frequently ask the question I posed earlier about the address of all people
    who own pythons (the one for which I had to use the `JOIN`), my stance might be
    different. `JOIN`s can be expensive because the DBMS has to combine two tables
    and then find the information, a potentially costly process depending on the size
    of the tables. It might just be easier and more economical to create the redundant
    column. These types of decisions can be made by *database administrators* (DBAs),
    who understand precisely how requests are executed.


    #### Non-relational Model


    *Non-relational models*, as you may have guessed, do not use tables as the primary
    data structure. Therefore, this category encompasses a lot, including networks,
    hierarchic models (think family trees), and lists.


    One term worth a special mention is `NoSQL`. Relational systems are suited for
    more complicated data where queries will be requested that concern the relationships
    between entities (e.g., between users and their pets). In contrast, `NoSQL` systems
    tend to be great for storing large amounts of simple data such as key-value pairs
    (`firstName: Vinay`). For these simple use cases, `NoSQL` offers great performance
    and scalability. If your team feels that such a strict relational structure is
    not necessary and that you are dealing with storing and retrieving large amounts
    of data where the relationship between stored items is not as important, `NoSQL`
    database management systems are very useful and arguably more effective. Open-source
    `NoSQL` databases, such as MongoDB and Cassandra, are worth exploring.'
