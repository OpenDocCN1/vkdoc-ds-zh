- fmt: '### The Times Ahead


    Many skillful developers constantly work on improving the Bitcoin code. Currently,
    most efforts are geared toward improving the speed and efficiency of Bitcoin transactions.
    A new technology known as the *lightning network* is being developed, which will
    allow very small transactions to be sent instantaneously across the network. There
    is also a lot of work being put into spreading awareness and adoption of Bitcoin.
    While Bitcoin’s price volatility is rampant, it is lower than that of the Venezuelan
    bolivar, the national currency of Venezuela. This has resulted in individuals
    converting their savings into Bitcoin as it is easier to access than the US dollar.
    Moreover, several merchants in Venezuela have begun accepting payments in Bitcoin.
    The more central institutions fail in maintaining national currencies, the more
    can we expect Bitcoin adoption to rise.


    ## The World of Blockchains


    Cryptocurrencies have thus far been the most popular blockchain application, which
    is mainly due to the fact that blockchains are a great way of keeping track of
    digital asset ownership. Since the creation of Bitcoin, countless new cryptocurrencies
    have spawned, some more legitimate than others. Each new cryptocurrency exists
    on its own blockchain with its own network of users and miners. While new cryptocurrencies
    bring varying degrees of new innovations to the table, most are, at least conceptually,
    based on Bitcoin. For instance, the cryptocurrency Monero was created to allow
    private transactions by obfuscating transaction data stored in the blockchain.
    Dash, another cryptocurrency, was created to reduce Bitcoin’s transaction costs
    and increase transaction speeds. Each of these cryptocurrencies exists on separate
    blockchains and requires specialized software to be used. There are currently
    thousands of cryptocurrencies; however, not all cryptocurrencies actually provide
    what they promise. Most cryptocurrencies don’t gain enough traction to survive
    or are outed as frauds.


    ### Ethereum


    The most notable post-Bitcoin cryptocurrency is Ether, which is built on the *Ethereum*
    blockchain. The reason why, unlike Bitcoin, the Ethereum blockchain is referred
    to as an ecosystem is because Ethereum provides more than just a cryptocurrency.
    In Ethereum, users can upload pieces of code that will run on the blockchain.
    This is useful because it allows any programmable job—not just monetary transactions—to
    be recorded, validated, and executed in a decentralized manner. The same way Bitcoin
    erased the central authority of financial institutions in currency, Ethereum can
    erase the central authority of any institution overseeing digital assets.


    Let’s look at an example. Imagine the job of a contract lawyer in making and enforcing
    a legal agreement between two parties. Among the most pertinent tasks of the lawyer
    is to oversee the integrity of the contract, ensure the contract goes unchanged
    after signing, and execute the contract agreement once the criteria are met. Sound
    like the lawyer is a central authority and a single point of failure? He is indeed.
    If the lawyer is corrupted or makes a mistake, the contract can be manipulated.
    In other words, both parties involved in signing the contract trust the lawyer
    to perform his job veraciously: it is a centralized network.


    If the contract were instead written in code and uploaded onto the Ethereum blockchain,
    it would be enforced programmatically by each miner on the Ethereum network. This
    doesn’t mean that the miners would warp into the real world and force a party
    to abide by the contract. They do, however, provide a provable record of what,
    according to the contract, should be done. Hence, the same way Bitcoin intends
    to replace banks as financial intermediaries, so does Ethereum intend to replace
    contract-enforcing bodies as intermediaries in agreements. These programs that
    run on the Ethereum blockchain are known as *smart contracts*. When multiple smart
    contracts interact to form a more complex program, it is referred to as a *decentralized
    application* or *dApp*. Decentralized applications don’t have to be fancy: they
    can be a simple set of rules such as “breed a new kitty when 0.5 Ether is received.”
    This is actually an example of a rule in one of the most popular Ethereum dApps:
    a game called Cryptokitties.


    ### Initial Coin Offerings


    *Initial Coin Offerings* *(ICOs)* have been the cause of a lot of hype and controversy
    in the world of blockchains. Think of an ICO as something similar to an unregulated
    Initial Public Offering (IPO). Instead of selling shares, however, a company that
    wants to do an ICO will sell *tokens*. There are two types of tokens that can
    be sold in an ICO: *utility tokens* and *security tokens*. Utility tokens are
    the more popular type as they fall outside of most legal regulation. When you
    purchase a utility token, you aren’t buying a share in the company but a discounted
    coin that can be used to interact with the company’s dApp when it launches. On
    the Ethereum platform, for instance, Ether is used to pay miners to mine transactions
    in smart contracts, so Ether can be regarded as both a utility token and a cryptocurrency.
    Owning a security token, on the other hand, entitles you to certain ownership
    rights of the company. These tokens are less popular in ICOs as they are regulated
    by legislative bodies. ICOs are wholly unregulated, meaning a company can determine
    how many tokens it wants to sell, autonomously set the price of a token, and sell
    it to virtually anyone.


    In mid-2014, a year before the Ethereum platform launched, 60 million Ether coins
    were sold to investors in a presale that would become the first of many ICOs launched
    on the Ethereum platform. However, ICOs can take place on any blockchain platform.
    In 2017 alone, companies raised a whopping $3.25 billion through ICOs. As an investor
    in ICOs, it is of crucial importance to do your due diligence before purchasing
    any tokens. Due to the lack of regulation, there is nothing stopping a company
    from disappearing and not meeting anything on its roadmap after it makes money
    from selling its tokens in an ICO. There have been many ICO scams in the past,
    and it remains a difficult job to safely navigate the ICO landscape.


    ### Blockchain Beyond Cryptocurrencies


    Other popular applications of blockchain technology exist in *decentralized supply
    chains* and *decentralized property transfers*. Both of these applications make
    use of the blockchain’s ability to provide individuals with ownership over digital
    assets or digital representations of physical assets. For instance, a smart contract
    can be used to handle real estate transactions with minimal involvement of a broker
    while the blockchain keeps track of who owns what property. Similarly, a supply
    chain can be made more efficient by representing a good on the blockchain and
    requiring each supplier to cryptographically sign when and where they processed
    the good. Thus, it is possible to efficiently track the movement of a good through
    a supply chain all the way to its source and identify any faulty suppliers. There
    also exist ambitions to fully decentralize certain supply chains, which would
    entail a retailer purchasing a good directly from the producer of that good. The
    energy sector is a particularly salient industry for this type of decentralization
    as, for instance, homeowners with solar panels on their roofs could sell excess
    energy to their neighbors. Some of these blockchains, if operated by private companies
    who exert control over who gets to be a node or a miner, are known as *private
    blockchains* because participation in the distributed consensus is limited to
    a private party. While private blockchains have a limited ability to achieve full
    decentralization, they can nonetheless be used to distribute authority and trust
    among multiple actors.'
