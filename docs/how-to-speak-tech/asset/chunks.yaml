- fmt: '# 3. The Back End: Programming Languages


    You have spent the last couple of weeks brainstorming and refining the vision
    for MyAppoly. What’s next? Many would-be products never make it past this question
    due to the technological barrier of creating an application. Software applications
    are written or *coded* in a programming language. The code defines how the application
    will run and respond, encompassing everything from what you see to what happens
    in the background. One of the first technical decisions to make is to choose a
    programming language for the product. You may have heard of languages like `Python`,
    `Ruby`, and `C`, but what are they, and what are the significant differences between
    them? What factors should you consider when selecting a language?


    A programming language is no more than a set of commands that a computer can follow.
    Programming is the art of combining these commands into a set of instructions
    that define the application’s behavior. The MyAppoly team will first need to use
    a programming language to define the *back end*, which is responsible for processing
    all of a user’s actions. For example, when you click “Add Friend” on Facebook,
    its back end processes the click by interacting with a database and other sources
    of information to deliver what you are expecting. In this example, the back end
    sends a message to your friend. For Google, the back end might take your search
    query terms and pass them through its algorithms to find relevant results. The
    back end is also called “server side” because the code defining the back end lives
    on a server. The user interacts with the back end through the *front end*, the
    interface and range of interactions you can perform on a given page. The “Add
    Friend” button you clicked and your friend’s profile page are part of the front
    end of Facebook. It’s the part you see. We discuss the front end in more detail
    in Chapter [4](#321739_2_En_4_Chapter.xhtml).


    Programming languages are created and developed at an astonishing rate. For this
    reason, an understanding of the basic technical terminologies and classifications
    of programming languages will help you keep up with the speed of development.
    The language you ultimately pick will be based on your needs and your particular
    situation.


    The popularity rankings of programming languages fluctuate from year to year.
    For example, the top ten programming languages in August 2018 show the following
    ranking changes compared to August 2017:^([²](#fn2))


    1.  `Java` (same)

    2.  `C` (same)

    3.  `C++` (same)

    4.  `Python` (up from #5)

    5.  `Visual Basic .NET` (up from #6)

    6.  `C#` (down from #4)

    7.  `PHP` (same)

    8.  `JavaScript` (same)

    9.  `SQL` (previously unranked)

    10. `Assembly language` (up from #14)


    ## Classifying Programming Languages by Level


    Computers only understand binary, a system of ones and zeros. All files, programs,
    and data are fundamentally made up of ones and zeros. Each one or zero is called
    a *bit*, and a group of eight bits is a *byte*. Computers interpret bytes depending
    on how a programmer chooses to label or specify them. For example, let’s consider
    the byte `0100 0001`. As a number, that byte represents 65, but you could instead
    tell the computer to read it as a character, and it would be interpreted as an
    A. Larger pieces of information, such as the online version of this book, are
    comprised of a huge number of bytes together (measured in kilobytes, megabytes,
    or gigabytes). For example, when purchasing a computer, you might see that it
    has 16 GB of space. This means the computer can store 16 gigabytes of information.


    Programmers can manipulate bits and bytes through a computer’s machine language,
    but imagine coding MyAppoly by changing ones and zeros. It would be extremely
    difficult, tedious, and costly. Thus, although machine code is closest to what
    the computer actually understands, programmers defined simple functions to do
    the bit coding for them. Together, these functions form *assembly language*. A
    programmer can code in assembly language and use an assembler to convert the program
    into binary for the computer.


    Assembly language proved to be tedious as well, so programmers created *high-level
    languages* with more powerful commands. These languages allow us to write code
    that more closely resembles human language. High-level language code is converted
    to machine language directly or by way of assembly language. As a result, higher-level
    languages don’t expand the set of computer behaviors possible to express in code.
    The difference between using a higher-level language and assembly is similar to
    the difference of listing only a few instructions for making a sandwich and tediously
    explaining the process in a hundred small steps.


    High-level languages, such as `PHP` and `Python`, are called *high level* because
    they enable the programmer to think abstractly rather than in specific bits and
    bytes. It follows that assembly languages are considered *low level* because they
    are closer to the hardware. Some languages, such as `C`, are considered *middle
    level* because they allow a programmer to think about bits but relate more closely
    to human language and have more complex commands than do assembly languages.


    ### Processing High-Level Languages


    For coding MyAppoly, you will use a high-level programming language. High-level
    languages may be subdivided by various criteria. One useful taxonomy, based on
    how a language is read by computers, divides high-level languages into two types,
    *compiled* and *interpreted*.^([³](#fn3))


    *Compiled languages* use a compiler to translate the code into a language that
    the computer’s processor understands. If you code MyAppoly in `C` or `Java`, you
    are using a compiled language, and the program you code is called the *source
    language*. The compiler essentially translates the source language into machine-executable
    code, much as one might translate an English book into French. Compiled languages
    are fast to run but slow to develop, i.e. write an application in (Chapter [11](#321739_2_En_11_Chapter.xhtml).)


    *Interpreted languages* such as `PHP` are translated in real time. They are interpreted
    much as an English speaker might have a live interpreter translate continuously
    and simultaneously to someone who only speaks French. As a result, the execution
    is one to two orders of magnitude slower than in compiled systems. Compare the
    time it would take a French speaker to sight-read a French translation of this
    book with the time it would take the same French speaker to listen to this book
    being read aloud by a French interpreter translating live from the English original.
    A less obvious disadvantage is that interpreted languages are less inefficient
    because they often use more memory. Although they are slower to run, interpreted
    languages tend to be much quicker to develop.'
