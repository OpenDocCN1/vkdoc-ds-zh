    # 13. Mobile Basics


    Special thanks to Ashi Agrawal and Cheenar Banerjee for contributing this chapter.


    Until now, we’ve assumed that MyAppoly exists solely as a web application, but
    the reality is that many products—think Snapchat or Lyft—live partly or entirely
    in mobile form. These companies optimize their application experience for your
    phone, a small device that moves around with you and comes equipped with a different
    set of tools than a traditional computer. Many of the structures we’ve discussed
    thus far are still relevant, but a successful mobile application does more than
    recreate the desktop experience: it is built specifically for mobile devices.
    So, let’s dive into the intricacies of mobile development!


    ## A Short Introduction


    Ever since the invention of the cell phone in the 1970s, the capabilities of the
    handheld computer have rapidly grown. Blackberry devices rose to prominence in
    the early 2000s because of their abilities beyond SMS texting and calling, including
    a focus on email. Then, with the advent of smartphones, the number of things a
    user could do exploded beyond just making phone calls. Now, we track our fitness,
    set alarms, and call ride-sharing services from these incredibly convenient devices.
    This chapter focuses on smartphones, but mobile devices also include handheld
    computers.


    Mobile applications constitute a booming market. The number of global mobile phone
    users passed the five billion mark in 2018.^([^(24)](#fn24)) Among websites, mobile
    devices drive more traffic than desktop devices,^([^(25)](#fn25)) and mobile applications
    are expected to drive nearly 200 billion dollars in revenue yearly by 2020.^([^(26)](#fn26))
    That’s exciting, but what *is* a mobile application? It’s a program intentionally
    designed and written to run on a mobile device. As we’ll see, mobile applications
    can open doors but come with new considerations and limitations.


    ## Why Develop for Mobile


    Before diving into *how* to develop a mobile application, you need to understand
    *why* and *when* to develop one. In some cases, this is obvious—for example, ride-sharing
    and mapping applications have clear mobile use cases that are crucial for success.
    It’s not quite so cut and dry for other products, but mobile often makes sense
    in a roadmap because it can diversify and augment functionality and consumer base.
    In the case of MyAppoly, your team decides that a separate mobile presence is
    necessary to attract new consumers.


    While MyAppoly has built a desktop web application first, some applications consider
    mobile-specific features and constraints the default design. This process is called
    mobile-first development and leads to a better mobile user experience and a cleaner,
    more minimal desktop design. A mobile design fits fewer elements on the screen,
    which translates easily to the desktop, but moving from desktop to mobile means
    that designers have to think about what to remove.


    ## Mobile Apps vs. Desktop Apps


    Mobile apps are quite similar to the web applications we’ve been discussing. Like
    traditional web apps, mobile apps have a front end and a back end. Both also utilize
    APIs and other external resources. In this chapter, we’ll refer to traditional
    web apps as desktop web apps. There are also some desktop apps that you download,
    like a word processor or movie editing software, but this text primarily compares
    mobile applications with desktop web applications.


    There are significant differences between developing for mobile devices and desktops.
    Let’s outline these differences to understand why we need to create a separate
    mobile presence. There are four main differences between the two platforms: size,
    method of interaction, features, and portability. Let’s dive into each.


    - *Size*: Mobile device screens are much smaller than desktop screens, which restricts
    the amount of content per page. The user interface of mobile apps must be adjusted
    accordingly. For example, many mobile apps feature collapsible menus to save screen
    real estate, while desktop web apps display large menu bars to lay out all of
    the options.


    - *Method of interaction*: We also interact differently with our mobile devices
    than with our desktops. While we use a mouse or trackpad to navigate around a
    desktop screen and a separate physical keyboard to type, we use touch with modern
    smartphones.


    - *Features*: Mobile devices come equipped with a different set of native, or
    built-in, features than traditional laptops do. Often, this includes a camera,
    location services, Bluetooth, and a push notification system. As a result, there’s
    a whole different set of functionalities that we can create for mobile apps, for
    example, Instagram launched on mobile devices because most people primarily use
    their phones to take photos.


    - *Portability*: Portability means that people take and use their smartphones
    everywhere. As a result: (a) the presentation of content needs to be simple, (b)
    there are additional real-time use cases, and (c) cellular data is different than
    broadband Internet. Let’s investigate these in further detail. People often browse
    their smartphones for short intervals of time, so user interactions need to be
    snappy. Layers of menus offer more choices in desktop web apps but aren’t practical
    for a person on a time budget. Since people check their phones on the go, mobile
    applications can focus on real-time actions, like ride sharing. Finally, applications
    often access the Internet via cellular data, which can be slower and less reliable
    than Wi-Fi or Ethernet. As a result, mobile applications might be optimized for
    speed. With so many mobile apps competing for users’ time, users may switch apps
    instead of waiting for a slow app.


    As a result of these differences, we must think critically about not only the
    restrictions that mobile development brings but also the expanded possibilities
    and opportunities when creating mobile content.


    ## Types of Mobile Apps


    There are three main types of mobile apps: web apps, native apps, and hybrid apps.
    All three are common, and the best kind of app to develop depends on the product
    itself. This section discusses the technical underpinnings and user presentation
    of each type.'
