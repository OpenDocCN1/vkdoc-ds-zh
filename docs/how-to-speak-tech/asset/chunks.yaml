  trans: '

    ### 可用性


    每个举步维艰的小公司都梦想着他们的应用程序能有朝一日大受欢迎，流量暴增 100 倍。恭喜——这一幕正在你身上发生！不幸的是，你的服务器并没有为应对如此巨大的流量做好准备。它们崩溃了，你的网站随之瘫痪。2013
    年，[healthcare.​gov](http://healthcare.gov) 就曾发生过这种灾难性的情况：在数百万美国人试图注册《平价医疗法案》的巨大压力下，该网站不堪重负。幸运的是，一群工程师拯救了这个网站，并成功为数百万美国人办理了医疗保险，但其底层基础设施引发的全国性沮丧与痛苦早已蔓延开来。当应用程序无法处理此类流量时，就称为**拒绝服务**。在这种情况下，由于资源无法被访问，就称资源的可用性受到了损害。


    有些攻击者会故意造成拒绝服务，他们向你的应用程序发送伪造请求，直到其崩溃，导致合法用户无法访问。这种攻击被称为拒绝服务攻击。虽然应对合法的拒绝服务的唯一方法是扩展你的应用程序所能处理的流量规模，但你可以通过拦截破坏性请求来预防或反击拒绝服务攻击。一个成功的反拒绝服务（DoS）计划包含两个主要部分。首先是定义一组预期的流量模式，其次是移除不符合这些模式的流量。


    一个直接的方法是追踪发起攻击者请求的服务器，并阻断来自这些服务器的所有流量。然而，在拒绝服务攻击最常见的形式——分布式拒绝服务攻击中，这变得困难重重。在分布式拒绝服务（DDoS）攻击中，恶意请求来自许多不同的服务器，使得创建能成功过滤掉它们的模式变得更加棘手。诸如
    Cloudflare 之类的服务会使用诸如机器学习之类的高级模式创建技术，来保护你的应用程序免受阻止服务（DoS）和分布式拒绝服务（DDoS）攻击。


    攻击者还会利用勒索软件来针对数据的可用性。勒索软件是一种拒绝用户访问其数据的软件，有时仅仅是通过锁定他们的电脑（这很烦人，但对安全专家来说相对容易处理）。然而，更常见的情况是，勒索软件会提取并加密用户的数据，然后攻击者索要赎金，以换取返还解密后的数据。正如我们将在下一节中了解到的，没有解密密钥，几乎不可能破解设计良好的加密，因此受害用户往往不得不支付赎金来恢复数据。


    对于包含代码或连接互联网的硬件设备来说，可用性攻击尤其危险。震网病毒是一种计算机蠕虫，它通过针对运行特定软件的机器，迫使相应的离心机超速旋转直至报废，从而摧毁了数十万台离心机（实验室设备）。像震网这样的攻击属于控制系统安全范畴，该领域主要关注工业系统。虽然损坏的离心机可以更换，但对控制系统的攻击可能会摧毁诸如液压系统或水坝等大型系统，造成深远的后果。


    本节探讨的攻击不会访问或篡改数据，而是阻止预期的接收者查看和使用数据。其他的可用性攻击包括物理电源攻击和会话劫持攻击。验证我们收到的请求并过滤掉任何可疑的请求，对于阻止可用性攻击至关重要。


    虽然 CIA 三元组是发现漏洞和集思广益，揣测黑客可能想如何窃取你信息的有用框架，但它无法穷尽所有攻击方式。因此，通过参加诸如黑帽大会或 Defcon 等会议、阅读论文，并持续了解你所使用服务的技术能力与缺陷来掌握最佳安全实践的最新动态，至关重要。美国国家标准与技术研究院（NIST）和欧盟网络与信息安全局（ENISA）也是获取网络安全防护信息的优质资源。


    ### 预防措施


    幸运的是，有一些预防措施可以帮助你保护你的应用程序。虽然这些被广泛接受的安全实践大有裨益，但它们并不全面，本节内容更多是作为概述。你应该设立一个专门的安全团队来加强你的安全实践并处理攻击事件。

    '
- fmt: '### Encryption


    One of our best defenses is encryption, the practice of transforming a message
    from a “plaintext” into a “ciphertext” so that a third party cannot figure out
    the plaintext from the ciphertext. At its core, encryption is just changing the
    presentation of a piece of data, meaning all data types (including audio and images)
    can be encrypted. A straightforward, not very secure, method of encrypting a plaintext
    is to reverse the characters. For example, we could take the plaintext “the quick
    brown fox jumps over the lazy dog” and come up with the ciphertext “god yzal eht
    revo spmuj xof nworb kciuq eht.” It looks like a garbled mess, but a keen eye
    might notice two occurrences of “eht,” relate that to the common word “the,” and
    figure out both the encryption algorithm and the secret message.


    This example shows how a simple encryption schema is insecure. Since mathematical
    and linguistic models can crack simpler encryption protocols, you should use well-known
    and rigorously tested encryption protocols and systems. While more sophisticated
    encryption methods could theoretically be cracked, the magnitude of resources
    and time needed to break them render them practically unbreakable.


    The basis of many encryption systems and protocols is public-key cryptography,
    which uses two auxiliary pieces of information: a public key and a private key.
    A private key must be kept secret by its owner, while anyone can access the public
    key. If Alice wants to send Bob a plaintext message encrypted using public-key
    cryptography (also known as asymmetric cryptography), she inputs her message and
    Bob’s public key into an encryption algorithm, which then generates a ciphertext.
    Upon receiving the ciphertext, Bob inputs the ciphertext and his private key into
    a decryption algorithm to decrypt the message. Creating public and private keys
    in a way that is both secure and efficient is difficult. Key generation cryptosystems
    (RSA being the most well-known) often employ math to create large numbers that
    act as keys.


    `TLS` (Transport Layer Security), used to secure communications over the Internet,
    is one such encryption protocol based on public-key cryptography. It has two parts:
    the first authenticates the two parties (a client and a server) and creates a
    secure channel to exchange messages, while the second provides security for the
    data moving from client to server or server to client. `TLS` is used ubiquitously
    across the Internet to secure websites, APIs, and more.


    Encryption is crucial for keeping data secure. All data, including both customer
    and company data, should be encrypted and only be decrypted when necessary. The
    life cycle of a piece of data has three parts: data in use (data pulled out of
    permanent storage), data at rest (data stored in persistent memory), and data
    in transit (data in between two systems). We use encryption to secure data that
    are at rest and in transit—for example, `TLS` protects data in transit.


    In the communication and messaging field, some products have taken care to encrypt
    data throughout its life cycle, a feature known as end-to-end encryption. Let’s
    think about this in the context of Alice and Bob. If a message Alice sends Bob
    is end-to-end encrypted, the original message is only ever visible to Alice and
    Bob. Even if Alice uses a third-party client to send her message, the application
    discards the plaintext as soon as it is encrypted.


    We mainly discuss end-to-end encryption in the context of peer-to-peer communications,
    like email and messaging services. End-to-end encryption has relatively low usage
    in email primarily for two reasons. The first issue is our reliance on email providers
    to filter spam, meaning the providers must be able to read email contents. The
    second is the fragmentation of email providers and lack of industry standards
    for end-to-end encryption. Sending encrypted email from, say, a Gmail account
    to a Yahoo account, would require both providers to align on one encryption schema
    or users themselves to align on an encryption schema and exchange public keys,
    which is burdensome. However, end-to-end encryption is slowly becoming ubiquitous
    throughout messaging. To remain truly secure, you should use the Signal messaging
    application, which both supports end-to-end encryption and is open source (meaning
    anyone, including security professionals, can and have verified its security by
    reading its source code). The platform is so secure that other (closed-source)
    messaging applications such as Facebook Messenger and WhatsApp use the Signal
    Protocol to implement their end-to-end encryption.


    ### Password Protection


    On an individual level, the most important precaution is to use strong passwords.
    There are many best practices for creating secure passwords: using special characters
    and numbers, increasing the password length, using a passphrase, never reusing
    a password, and more. While these best practices are, admittedly, easy to let
    slide, they are crucial to follow: a 2016 Verizon data breach report found that
    63% of data breaches are a result of weak or stolen passwords.^([^(20)](#fn20))


    The 2017 report “The Password Exposé” by password manager `LastPass` showed that
    the average `LastPass` business user has 191 passwords, far too many for any one
    person to remember.^([^(21)](#fn21)) Password managers like `LastPass` and `1Password`
    make organizing and using passwords much easier by storing all of your passwords
    in a “vault” protected by one master password. Password managers also have an
    Auto-Fill feature to fill in your credentials on websites and a Generate Password
    feature to automatically create strong passwords for you. This way, the only password
    you need to remember is a single master password. The idea is that it’s much easier
    to remember one complicated password than many passwords, however memorable they
    may be. Therefore, all of your passwords can be much more difficult to guess and
    thus stronger.


    While password managers are not immune to hackers, their data sit in a vault secured
    by several layers of encryption. Even if hackers steal a password manager’s vault,
    they cannot access your data because it sits behind this encryption, locked with
    your master password as a key. To decrypt the vault, they would need your master
    password (which isn’t stored anywhere, thanks to a process called hashing). As
    long as you’ve chosen your master password wisely, the hackers won’t be able to
    guess it. In short—while switching to a password manager might seem scary, the
    majority of security researchers agree that it is the safest way to create, store,
    and use passwords.


    Once a user creates their password, it’s crucial that the password is never exposed.
    As mentioned above, we use the process of hashing to protect passwords. Like encryption,
    hashing converts a piece of data into a different form, here called a hash. Unlike
    encrypted ciphertexts, hashes are not reversible. They work well to verify information
    because the same hashing function run on identical copies of a plaintext (say,
    when a user first chooses their password and when they enter their password on
    the site) produces the same result. However, we do not store the plaintext and
    thus cannot retrieve it from our hashed copy.'
  raw: '### Encryption


    One of our best defenses is encryption, the practice of transforming a message
    from a “plaintext” into a “ciphertext” so that a third party cannot figure out
    the plaintext from the ciphertext. At its core, encryption is just changing the
    presentation of a piece of data, meaning all data types (including audio and images)
    can be encrypted. A straightforward, not very secure, method of encrypting a plaintext
    is to reverse the characters. For example, we could take the plaintext “the quick
    brown fox jumps over the lazy dog” and come up with the ciphertext “god yzal eht
    revo spmuj xof nworb kciuq eht.” It looks like a garbled mess, but a keen eye
    might notice two occurrences of “eht,” relate that to the common word “the,” and
    figure out both the encryption algorithm and the secret message.


    This example shows how a simple encryption schema is insecure. Since mathematical
    and linguistic models can crack simpler encryption protocols, you should use well-known
    and rigorously tested encryption protocols and systems. While more sophisticated
    encryption methods could theoretically be cracked, the magnitude of resources
    and time needed to break them render them practically unbreakable.


    The basis of many encryption systems and protocols is public-key cryptography,
    which uses two auxiliary pieces of information: a public key and a private key.
    A private key must be kept secret by its owner, while anyone can access the public
    key. If Alice wants to send Bob a plaintext message encrypted using public-key
    cryptography (also known as asymmetric cryptography), she inputs her message and
    Bob’s public key into an encryption algorithm, which then generates a ciphertext.
    Upon receiving the ciphertext, Bob inputs the ciphertext and his private key into
    a decryption algorithm to decrypt the message. Creating public and private keys
    in a way that is both secure and efficient is difficult. Key generation cryptosystems
    (RSA being the most well-known) often employ math to create large numbers that
    act as keys.


    TLS (Transport Layer Security), used to secure communications over the Internet,
    is one such encryption protocol based on public-key cryptography. It has two parts:
    the first authenticates the two parties (a client and a server) and creates a
    secure channel to exchange messages, while the second provides security for the
    data moving from client to server or server to client. TLS is used ubiquitously
    across the Internet to secure websites, APIs, and more.


    Encryption is crucial for keeping data secure. All data, including both customer
    and company data, should be encrypted and only be decrypted when necessary. The
    life cycle of a piece of data has three parts: data in use (data pulled out of
    permanent storage), data at rest (data stored in persistent memory), and data
    in transit (data in between two systems). We use encryption to secure data that
    are at rest and in transit—for example, TLS protects data in transit.


    In the communication and messaging field, some products have taken care to encrypt
    data throughout its life cycle, a feature known as end-to-end encryption. Let’s
    think about this in the context of Alice and Bob. If a message Alice sends Bob
    is end-to-end encrypted, the original message is only ever visible to Alice and
    Bob. Even if Alice uses a third-party client to send her message, the application
    discards the plaintext as soon as it is encrypted.


    We mainly discuss end-to-end encryption in the context of peer-to-peer communications,
    like email and messaging services. End-to-end encryption has relatively low usage
    in email primarily for two reasons. The first issue is our reliance on email providers
    to filter spam, meaning the providers must be able to read email contents. The
    second is the fragmentation of email providers and lack of industry standards
    for end-to-end encryption. Sending encrypted email from, say, a Gmail account
    to a Yahoo account, would require both providers to align on one encryption schema
    or users themselves to align on an encryption schema and exchange public keys,
    which is burdensome. However, end-to-end encryption is slowly becoming ubiquitous
    throughout messaging. To remain truly secure, you should use the Signal messaging
    application, which both supports end-to-end encryption and is open source (meaning
    anyone, including security professionals, can and have verified its security by
    reading its source code). The platform is so secure that other (closed-source)
    messaging applications such as Facebook Messenger and WhatsApp use the Signal
    Protocol to implement their end-to-end encryption.


