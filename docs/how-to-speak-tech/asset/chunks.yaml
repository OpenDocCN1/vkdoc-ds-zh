    ### 身份验证方式


    身份验证要素是用户必须持有的、用以证明其声称身份的物品。身份验证要素共有三类：知识要素（“你知道的东西”）、持有要素（“你拥有的东西”）和固有要素（“你本身的特征”）。


    知识要素是最常见的身份验证方式。例如，密码是用户必须*知道*的一条信息。另一个知识要素的例子是安全问题（“你母亲的娘家姓是什么？你的第一辆车是什么品牌和型号？”）。正如任何看过电影《盗梦空间》的人所知，知识要素相对容易被破解，原因有三：(a)
    它们通常很简单；(b) 它们的信息可能是固定的，意味着从不改变；(c) 它们遵循常见的格式。由于人类必须记住自己的密码，他们往往倾向于以个人信息为基础（如生日或宠物名），而这些信息很容易被猜到。安全问题可能会暴露一些通过侦察就能发现的信息，即使攻击者找不到你第一辆车的品牌和型号，需要他们尝试的可能的答案也相当有限。尽管知识要素目前是最普遍的身份验证形式，但它们无法提供日益必要的安全性。


    因此，许多系统正转向使用双因素认证，这要求在基于知识的身份验证之上再加一层验证。第二层通常是持有要素，它根据用户拥有的某个物品来验证其身份。想想你用来开家门和车门的钥匙。对于许多网络应用程序而言，持有要素就是用户的手机。应用程序通过短信或移动应用程序（如
    `Authy` 或 `Duo`）向手机提供一次性密码。由于短信与你的手机号码绑定，所以更容易被黑客攻击。攻击者会使用网络钓鱼攻击，冒充手机丢失致电移动服务提供商。服务提供商会允许他们将号码切换到新手机，从而让他们能够窃取
    OTP。最安全的持有要素被认为是专门为此目的而构建的独立硬件令牌，例如 `Yubikey`。`Yubikey` 是一种小型设备，可直接插入用户的电脑，并在不使用互联网的情况下生成
    OTP。


    有时，额外的一层会改用固有要素。固有要素是一种生物识别测量方式，利用用户的物理属性。iPhone 上允许用户使用指纹登录的 Touch ID 就是一种固有要素，视网膜扫描和人脸识别也是如此。虽然固有要素使用起来很方便（扫描指纹可能比输入
    OTP 更方便），但它们不如其他身份验证方案流行，因为被破解的生物特征信息无法替换。例如，如果黑客成功窃取了你的指纹数据，你无法合理地更改你的指纹，而密码则很容易更改。在大多数使用场景中，这种风险通过将生物特征数据本地加密存储（例如，直接在你的手机上）来缓解。由于数据不在不同地点之间传输，攻击面（攻击者可以瞄准应用程序的不同位置的数量）更小，这意味着攻击者入侵应用程序的方式更少。因此，固有要素通常只对与设备绑定、且无需将生物特征信息存储在云端的应用程序有意义。


    多因素认证可以保护你免受那些窃取了你凭证的攻击者的侵害，例如来自重放攻击的威胁。如果黑客试图用你的密码登录，由于他们没有第二层身份验证，将无法登录。请记住，如果你怀疑有人窃取了你的凭证，仍应轮换你的凭证。对于个人使用而言，最安全的做法是在所有支持
    MFA 的应用程序上启用多因素认证，从你的银行账户到你的社交媒体账户。然而，要求你的用户使用 MFA 可能并非正确的决定。虽然 MFA 提供了额外的安全性，但并非所有消费者都优先考虑安全，他们可能会认为
    MFA 很麻烦。无论如何，支持 MFA 总是一个好主意，即使你不强制要求。


    ### 网络安全


    网络安全指的是保护访问和传输信息的网络的安全，这既包括用户端的网络，也包括企业环境中的网络。本节概述了你可以作为个人用户使用的工具，以及为你互联网网络上的所有人（无论是与家人共享的家庭网络，还是与公司共享的企业网络）可用的工具。


    从个人角度来看，你在浏览互联网时能采取的最简单的保护措施是使用 HTTPS。HTTPS 代表超文本传输安全协议，它使用 TLS 来安全地传输流量。在浏览网页时，请确保在
    URL 开头使用 HTTPS 协议，而不是 HTTP，因为 HTTP 不包含 HTTPS 所提供的加密。在某些浏览器（如 Firefox 和一些版本的 Chrome）中，你还可以通过在
    URL 栏中查找绿色挂锁图标来验证你是否在使用 HTTPS 进行浏览。浏览器也可能会自然地阻止连接到使用过时或不安全 TLS 设置的网站。


    除了使用 HTTPS，还要确保在网络中保持谨慎。只从可信来源下载软件，并留意那些可能包含恶意软件的带广告的流媒体网站。对抗此类广告的一个简单方法是安装广告拦截器，例如
    `uBlock`。由于攻击者经常创建声称链接到某个域（例如“`google.com`”）但实际将你引导至不同危险网站的超级链接，一个良好的做法是将 URL
    输入到浏览器中，而不是点击链接，以防止我们之前概述的网络钓鱼攻击。


    为了进一步保护你的网络流量，你可以使用虚拟专用网络，通常是通过使用第三方 VPN 服务。VPN 通过加密隧道将网络请求（最常见的是网站导航）发送到远程服务器，然后由该服务器将请求发送到公共网络。在通过公共网络（如在咖啡店）浏览时，这非常有用，因为你的流量是加密的，并且看起来像是来自
    VPN 服务拥有的不同 IP 地址。即使公共网络不安全，你的数据仍然是安全的，因为 VPN 隧道对其进行了加密。


    许多工作场所，尤其是那些有远程员工的工作场所，会使用 VPN，以便使用不同本地网络（例如，他们的家庭 Wi-Fi 网络）的员工看起来处于同一个专用网络上。这样，VPN
    上的计算机可以识别哪些其他计算机在同一 VPN 上，因此是可信的。本质上，VPN 可以作为一个单一的认证点，就像在办公场所刷门禁卡一样。


    你可以采取的最后一项保护任何网络安全的预防措施是使用防火墙或代理。防火墙会阻止来自用户指定站点的流量到达你的 IP 地址，反之亦然，以保护你免受恶意站点和攻击者的侵害。代理充当用户和外部网络之间的中介，可以执行多种功能，例如阻止恶意站点以及向任何窥探者或潜在攻击者隐藏你的
    IP 地址。


    ## 在你的应用程序中实施安全实践


    考虑到所有这些攻击、工具和预防措施，下一步就是运用这些知识，将其用于在你的团队开发流程中构建安全性。我们将概述三个步骤，指导你思考与应用程序相关的安全性：(a)
    保护你的应用程序，(b) 保持安全，以及 (c) 最小化损害。

