- fmt: '# 15. Artificial Intelligence


    Special thanks to Jay Harshadbhai Patel for contributing this chapter.


    It is a bright sunny morning and you are getting ready for work. Before heading
    out, you open your inbox and start reading emails. The inbox has automatically
    filtered out spam emails into a separate tab so you can ignore them. While replying
    to an email, you make a grammatical mistake but are promptly corrected by the
    email service. As it’s time to leave for work, your smartphone pops up a notification
    saying that it will take 24 minutes to reach the office based on current traffic
    data. You step out of the house, and a self-driving car is ready to pick you up.
    You enjoy a cup of coffee in the back seat as the car drives you to work. At the
    office, you “ask” your smartphone “What meetings do I have today?” The phone reads
    out the details of your meetings. You head to your 10 AM meeting and are well
    on your way to a productive working day.


    In a few years, this anecdote will be commonplace. Artificial intelligence (AI)
    technologies will make it easier for us to perform day-to-day activities in our
    personal and professional lives. AI technologies appear to think and to analyze
    like humans do, but are really just computers crunching large amounts of data
    to make decisions. Therefore, whereas humans display *natural* intelligence, we
    say that computers display *artificial* intelligence. In this chapter, we focus
    on machine learning (ML), a subset of AI that can learn from experience and improve
    its intelligence continually. Before ML technologies, we had to remove spam email
    from our inbox manually, but modern email products like Gmail use ML to learn
    what emails to flag as spam based on the email’s content or our past actions.
    As we use these products more and more, they record the emails, links, and buttons
    we click and become more accurate. All references to AI throughout this chapter
    should be read in the context of a self-improving ML system.


    ## Key Aspects of Artificial Intelligence


    Every AI technology is built to solve a *problem*, or a task with well-defined
    inputs and outputs. *Inputs* are data that teach AI to solve the problem, and
    *outputs* are the solutions. AI’s *model*, or brain, is the set of mathematical
    functions that create outputs from the inputs. The model *learns*, or adapts and
    improves its behavior, based on the data that it’s given. Consider Spotify, a
    popular music streaming application that also recommends new songs to users. Here,
    the *problem* is to make song recommendations most likely to please a listener.
    The inputs are a user’s song listening history, trending songs, preferences of
    similar users, and other useful information that allows it to infer what the user
    might enjoy listening to. The outputs are the songs that Spotify recommends to
    their users. The model is the core software component that understands your listening
    preferences. We can see Spotify learning as its song recommendations improve over
    time—for example, it might initially recommend top 40 songs since those are popular
    across the country, but as it receives more information about our past Disney
    song listening history, it will start recommending more movie soundtracks.


    We will dive into each of these four aspects of AI next—the problem, the data,
    the model, and the learning.


    ### Problems


    We use AI to solve problems. The word *problem* is used very broadly here, encompassing
    everything from fundamental human needs like access to food, shelter, and water
    to luxuries like having a personal assistant to handle paperwork for you.


    There are two main categories of problems that AI is useful for. The first includes
    problems that are already solvable by humans but where AI can provide a better
    and more efficient solution. For example, humans have been driving automobiles
    for decades, yet automated cars have the potential to dramatically reduce the
    number of road accidents and make possible new ecosystems of car sharing that
    reduce car ownership and harmful gas emissions. Prominent companies like Google,
    Uber, and Tesla are pumping a lot of money and talent into building AI to drive
    cars today. Building this technology requires sensing the environment, identifying
    vehicles, pedestrians, and obstacles in real time, and acting on these data to
    navigate the roads.


    Another category of problems includes those that are difficult, if not impossible,
    for humans to solve; here we expect AI to open the doors of innovation. For example,
    while your closest friends could recommend songs that you might like, they are
    limited by their own experiences with music. If we could instead browse through
    all the music out there in the world and recommend those that complement your
    tastes, you might discover new and exciting music that would otherwise have been
    inaccessible.


    Outputs from AI are usually termed *predictions* to denote educated guesses. Prediction
    here does not refer to statements about the future. If it returns five new song
    recommendations to a user, we say it predicted the songs. In other words, it used
    past data and listening history to determine that the user will enjoy the returned
    songs the most out of all the songs that it knows of. More generally, we call
    this a *classification* problem, where the AI attempts to categorize inputs into
    one or more predefined classes. Here, it predicts “user will like” (encoded as
    1) or “user will not like” (encoded as 0) for every song in the knowledge base
    and returns some of the class 1 songs. There are just two classes (1 and 0), and
    every song must fall into one of these. The number of classes depends on the problem—more
    specific predictions require more fine-grained classes. We could train AI to predict
    the range from “will strongly like” to “neutral” to “will strongly dislike,” which
    will require three, five, or even seven classes. *Regression* problems, in contrast,
    have continuous, non-categorical outputs. The predictions do not fit into one
    class or another but instead fall somewhere on a continuum. For example, based
    on historical monthly (first day of the month) data of housing prices in an area,
    we can train AI to draw a smooth line that captures the average trend of ups and
    downs over the years and hence predict future prices.'
