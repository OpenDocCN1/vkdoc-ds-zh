    \ 美国国会图书馆控制号：2019934987 © 维奈·特里维迪 2019 本作品受版权保护。出版商保留所有权利，涉及材料的全部或部分内容，特别是翻译、重印、重用插图、朗诵、广播、微缩胶片复制或任何其他物理形式的复制权，以及电子改编、计算机软件传输或信息存储与检索权，或使用目前已知或未来开发的类似或不同方法。本书中可能出现商标名称、标识和图像。我们仅在编辑风格下使用这些名称、标识和图像，以利于商标所有者，而非在每次出现时使用商标符号，且无意侵犯商标权。本出版物中使用的商品名称、商标、服务标志和类似术语，即使未作标识，也不应被视为对它们是否受所有权保护的表达意见。尽管本书中的建议和信息在出版时被认为是真实准确的，但作者、编辑或出版商均不对可能出现的任何错误或遗漏承担法律责任。出版商对本书所含材料不作任何明示或暗示的保证。本书由\
    \ Springer Science+Business Media New York 在全球图书贸易中发行，地址：233 Spring Street, 6th\
    \ Floor, New York, NY 10013。电话：1-800-SPRINGER，传真：(201) 348-4505，电子邮件：orders-ny@springer-sbm.com，或访问\
    \ www.springeronline.com。Apress Media, LLC 是一家加利福尼亚有限责任公司，其唯一成员（所有者）是 Springer\
    \ Science + Business Media Finance Inc (SSBM Finance Inc)。SSBM Finance Inc 是一家特拉华州公司。\n\
    \n*因为未来十年期望我们掌握的知识与过去十年不同。*\n\n# 绪论\n\n2012 年 1 月 5 日，时任纽约市市长的迈克尔·布隆伯格发推文说：“我的新年决心是\
    \ 2012 年在 Codecademy 上学习编程！加入我吧。[`http://codeyear.com/#codeyear`](http://codeyear.com/%2523codeyear)。”Codecademy\
    \ 是一家为百万用户提供编程课程的初创公司，它在免费提供实用知识方面做得非常出色。但为何在所有事情中，学习编程会成为布隆伯格的首要个人要务？\n\n布隆伯格先生并不需要工作，但他的推文反映了他对在一个被互联网和技术深刻变革的社会中，成为有见识的公民和经济参与者所需新资质的看法。这些无处不在的力量已经彻底改变了我们经商、沟通、安排生活、订餐、策划婚礼、报税、购买衣物以及许多其他方面的方式。技术不再只对科技公司重要，它正在塑造并颠覆每一个行业。不再只有技术人员需要技术知识，人人都需要。技术如此重要，以至于我认为计算机、互联网和编程应该像阅读和数学一样，被纳入学校的必修课程。\n\
    \n让每个人都学会编写复杂的应用程序既不现实也不合理。但是，在技术领域工作、与技术相关或与技术打交道的几乎所有人，都应该至少在高层次上理解互联网及其应用的工作原理。这种知识将使他们有能力参与到那些过去可能显得陌生或令人生畏的讨论中去。\n\
    \n因此，本书的目的不是教你如何编程，而是概述与网络和移动应用生命周期各阶段相关的主要概念和技术。本书还提供了关于最新技术趋势的入门介绍，包括区块链、人工智能、增强现实和虚拟现实。无论你是有抱负的互联网技术高管、精明的风险资本投资者，还是管理技术领域的新手，这些内容都可能与你相关。即使你本人无意创办互联网公司，任何生活在一个“google”和“friend”已成为字典动词的世界中的人，都应该阅读本书。对太多人来说，互联网及其应用是一个黑箱，但任何人都不应该认为在\
    \ Facebook 上搜索朋友是神奇的。只要你理解几个关键概念，就能探究其奥秘。\n\n与任何专业领域一样，“技术人员”使用的专业术语对于非技术人员同事和外人来说大多难以理解。结果，技术人员和非技术人员之间的鸿沟只会加剧。在信息持续过载的时代，这种动态是低效的。如果技术人员能更有意识地解释他们的行话，如果雇主能鼓励非技术员工提高数字素养，我们就能拥有信息更充分的人群、更大的多样性、更好的管理者、更高效的流程、更精明的投资者以及更多的发现。这多么令人兴奋！\n\
    \n本书可分为两部分。前十三章涵盖了我认为每个人都应该了解的关于互联网应用工作原理的知识。从后端和前端到推广和网络安全，我认为本书包含的主题列表是你很可能在技术领域遇到的，并且对于互联网应用来说通常是恒久不变的。尽管技术发展迅速，但应用程序通常具有相同类型的组件和类似的挑战。我们使用的工具可能会随时间改变，但本书侧重于基本概念，而非特定技术。\n\
    \n本书的最后四章回应了许多重要的技术概念，这些概念让技术人员和非技术人员都对其应用和潜在影响产生了疑问。这部分提供了关于一些最值得了解的技术趋势的入门介绍。\n\
    \n内容以易于消化的方式呈现。本书融合了故事、类比和去除行话的解释，力求通俗易懂。尽管材料来源于学术论文、新闻文章、教科书和采访，但本书的语气应让人感觉像一位朋友在随性（尽管略带书呆子气）的谈话中向你解释这些概念。在简化和全面性之间总是存在张力；本书力求在删减非核心内容的同时，保留信息的完整性。\n\
    \n本书以一个以你为主角的故事贯穿始终。你正在构建一个名为 MyAppoly 的应用。这个应用几乎可以存在于任何背景中。如果你是一位企业家，MyAppoly\
    \ 是你获得 10 亿美元退出的门票（你好，Instagram）。如果你是一位非营利组织高管，MyAppoly 帮助你向捐赠者筹款。如果你在一家财富 500\
    \ 强公司工作，MyAppoly 可以帮助你保持现代和相关性。MyAppoly 可以是任何你希望它成为的样子。\n\n阅读本书将帮助你实现布隆伯格先生敦促的新年决心。每个人都知道我们的世界正在快速技术化。每一项发现都在挑战我们所有人去学习新事物，并质疑我们曾以为正确的东西和曾以为的极限。你可能没有时间学习如何编程，但对基础知识的理解会如何帮助你？也许，如果你能与开发者产生共鸣，你会成为更好的管理者。也许，你会成为更精明的投资者，能够区分现实与不可能。也许，你会得到你最近发现的那家科技公司的理想工作。至少，你应该能够理解科技新闻而无需求助于专家。是时候让技术民主化了。是时候让你学会如何讲述技术了。\n\
    \n# 致谢\n\n> *投资知识收益最大。*\n> \n> ——本·富兰克林\n\n没有我从父母和祖父母那里学到的关于教育和社区价值的教训，这本书就不会存在。他们养育我时相信，好奇心和知识是通往充实生活的关键，并且我们必须尽其所能回馈他人，因为我们是环境的产物。这些价值观激发了我出版《如何讲述技术》并深入参与其背后使命的兴趣。这本书的动机是希望帮助扩大\
    \ STEM 教育的普及，确保“非技术”人员拥有他们所需的知识，以便在一个几乎需要对技术有基本理解的世界中发挥有效作用。它涉及重新培训那些被人工智能和自动化取代之人的努力、为下一代宣扬\
    \ STEM 教育的项目，以及为 STEM 领域争取公平和多元化代表性的组织。我们致力于做出改变，而创作《如何讲述技术》正是为了服务于这些努力。\n\n我要向我的杰出贡献者们表示极大的感谢，他们加入了团队，不辞辛劳地分享他们的专业知识，因为他们也相信我们的使命。感谢阿希、奇纳尔、沃伊塔、科伊和杰伊——感谢你们为所贡献的章节付出的辛勤工作。它们是你们知识、技能和热情的展示。感谢你们让我从你们身上学习，我很兴奋看到你们的才华将带你们走向何方。阿什莉，感谢你主导了第一版的编辑工作。你对计算机科学教育的热情显而易见且令人鼓舞。阿希、奇纳尔和杰伊，也感谢你们提供的编辑支持，特别感谢阿希在最后关头给予了巨大帮助。我们整个团队还要特别感谢过去一年中帮助我们完善各章节的无数读者。\n\
    \n最后但同样重要的是，我感谢我的家人、朋友和导师多年来的指导。每个人无尽的支持和无条件的爱是这本书真正的参考文献。\n"
