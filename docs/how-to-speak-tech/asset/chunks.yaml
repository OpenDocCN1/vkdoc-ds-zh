- fmt: '# Conclusion


    In this chapter, we’ve touched on some of the most widely known attacks and mitigations
    in the cybersecurity realm. We established the CIA Triad as a model for thinking
    about security and examined ways that attackers might poke through your safeguards.
    Furthermore, we discussed possible protections such as encryption, multifactor
    authentication, and firewalls. Finally, we outlined security as a process, starting
    with building in security and ending with minimizing damages from attacks. Unfortunately,
    your application is a target for bad actors, and it is your responsibility to
    protect yourself and your company against them. Good luck building your defenses!


