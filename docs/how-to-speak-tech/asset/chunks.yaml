    # 14. 物联网


    特别感谢 Cheenar Banerjee 为本章做出的贡献。


    当你在开发 MyAppoly 时，你会意识到，你身边连接互联网的并不只有笔记本电脑。你的智能手机、智能恒温器和智能灯泡，只是你周围众多联网设备中的几个。事实上，预计到
    2020 年，将有 500 亿台设备连接到互联网。^(²⁹)，^(³⁰) 这种现象有一个专业术语，叫做*物联网*（Internet of Things，简称
    IoT）。


    ## 物联网中的“物”


    那么，物联网中的“物”到底是什么？它是指任何连接互联网并带有嵌入式传感器的设备。智能灯泡是物联网设备吗？是的。智能音箱呢？是的。智能牙刷呢？是的。这本书？很可能不是。


    从技术上讲，任何连接互联网的设备，包括传统计算机，都可算作物联网设备。然而从实际意义上看，物联网指的是那些传统上你不会预期它们会联网的设备——比如恒温器和冰箱。


    一个有用的物联网设备会执行以下三项任务：


    1.  通过其嵌入式传感器收集重要数据

    2.  通过互联网传输数据，并接收对数据的分析结果

    3.  利用数据分析结果激发有意义的行动


    因此，物联网设备承担着三项职责：收集、传输和激发。让我们通过一个例子来深入理解。假设 MyAppoly 的办公室刚刚采购了市面上最新的智能冰箱，生产商我们称之为
    Roost。这台冰箱外观与普通冰箱无异，但门上多了一个触摸屏控制台。通过这个控制台，MyAppoly 的员工可以将冰箱连接到办公室 Wi-Fi，自定义冰箱功能，并查看警报和其他信息。该冰箱一个令人兴奋的新功能是，它能够通过内置的传感器对冰箱内食物进行称重，从而检测何时需要重新订购特定食物。例如，一组传感器负责监测放置牛奶的搁架。


    牛奶传感器收集牛奶搁架的重量数据，然后冰箱通过互联网将这些数据传输到另一台电脑。当牛奶搁架的重量变轻时（即牛奶盒快空了），冰箱会收到一个警报，并通过控制台显示、电子邮件或短信提醒等方式，鼓励用户补充牛奶，或是在线订购新的牛奶。


    ## 物联网


    既然我们知道了什么是物联网设备，接下来我们来谈谈一组协同工作的物联网设备。物联网是一个由物联网设备组成的网络，它们之间共享数据并相互通信，无需任何人为干预。由于有如此多的设备相互“对话”，能够管理它们的数据和通信就显得至关重要。我们可以通过一个名为
    *IoT 平台*的软件来实现这一点。网络中的每个物联网设备都连接到这个 IoT 平台，该平台负责桥接、存储和分析来自网络上所有设备的数据，并与每个网络设备单独通信。IoT
    平台存在于云端，所有的数据分析都在云端进行。虽然人类可能会与物联网设备本身进行交互，但在一个物联网网络中，设备间的数据收集和共享并不需要任何人为干预。


    在我们冰箱的例子中，一个物联网网络可以是美国境内所有 Roost 智能冰箱组成的网络。平台则是与每台智能冰箱通信、并收集和分析网络上所有智能冰箱数据的软件。另一个物联网网络可以是
    MyAppoly 办公室内智能设备（如智能冰箱、智能门铃和智能音箱）组成的网络。即使这些设备功能各不相同，同一个平台仍然可以与所有设备通信并分析它们的数据。Amazon
    Web Services IoT、Microsoft Azure IoT、Google Cloud IoT 和 IBM Watson 都是现有 IoT 平台的例子。


    物联网真正的力量源于网络上共享的海量数据。让我们再回想一下 MyAppoly 的冰箱，它是全国 Roost 冰箱网络的一部分。该网络的 IoT 平台每天从全国各地的冰箱收集数十万个牛奶重量测量值。随着时间的推移，使用第
    15 章中讨论的数据分析和机器学习，软件可以在数据中发现模式和洞察。其中一个洞察就是冰箱用户应该订购新牛奶的最佳重量——通过分析长期的大量牛奶重量数据，软件可以了解新牛奶平均需要多长时间送达，或者用户喝光半加仑牛奶需要多长时间。诸如此类的洞察共同作用，得出一个“神奇”的牛奶重量数值，并且随着更多数据的输入，这个数值会不断优化。


    来自不同来源的数据可以被合并分析，从而产生同样有用的洞察。在 MyAppoly 办公室的物联网网络中，员工可以向智能音箱询问牛奶供应情况，音箱则能通过共享的
    IoT 平台与冰箱通信，从而回复牛奶搁架的确切重量。冰箱和门铃可以协调牛奶配送订单；随着时间的推移，基于门铃的数据，冰箱可以学会只在有人能开门收货时才下单。


    来自 Roost 和 MyAppoly 办公室物联网网络的数据和洞察，对其他企业、组织和物联网网络也可能有用。例如，Roost 可能会了解到其客户在春季倾向于喝更多牛奶。Roost
    可以将这些数据出售给奶牛场，以便它们能够更准确地管理生产以满足需求。或者，办公室的门铃可以通知员工家里的烤箱，在她晚上到家前开始加热晚餐。

    '
- fmt: '# Interoperability among IoT systems


    `Interoperability` among IoT systems refers to the ability of IoT systems and
    devices from different manufacturers to communicate with each other. For example,
    if the `MyAppoly` office got a new `GE` smart light bulb, interoperability would
    mean that the `GE` light bulb and the `Roost` devices could function as part of
    the same IoT network. `Interoperability` is encouraged by what are known as open
    standards. Standards are sets of specifications and rules that manufacturers follow
    when creating products. Open standards are publicly available, while closed standards
    are often proprietary. When several companies follow a single set of open standards,
    the resulting products are compatible with each other. In this case, the `GE`
    light bulb and `Roost` fridge on the same network would be following the same
    set of open standards. Open standards encourage innovation and make it easy to
    connect devices from different manufacturers. Closed standards, on the other hand,
    can lead to more secure and predictable networks, since a single company retains
    complete control over the standards.


    As we can see, our total fridge experience improves when we make intelligent use
    of its data and data from other fridges. This fridge example summarizes one of
    the core ideas of IoT: the more information we have about something, the more
    knowledge we have and the better actions we can take. We’ll now talk about the
    different factors involved in the recent and rapid growth of the Internet of Things.


    ## Factors Driving IoT Growth


    The central idea behind IoT has been around for quite a while. One could argue
    that the first mention of this idea was as early as 1843 when scientists hoped
    that the collection of machine-measured data about the weather could lead to better
    predictions in the future.^([(31)](#fn31)) In 1982, a Coke machine was given Internet
    connectivity at Carnegie Mellon University, and was able to transmit data about
    its inventory and the temperature of newly added drinks.^([(32)](#fn32)) In the
    1990s, the IoT concept was called the embedded Internet.^([(33)](#fn33))


    IoT’s explosive growth in recent years is due to vast improvements in technology
    in several areas. Let’s think back to `MyAppoly`’s new smart fridge, which wouldn’t
    exist without a variety of recent innovations in four primary categories: hardware,
    networking, big data and data analytics, and cloud technology.


    First, `Roost` was able to purchase or manufacture chips and sensors that were
    small, cheap, and powerful enough for the fridge’s purposes. In the past, it would’ve
    been cost-prohibitive or even impossible to manufacture something small enough
    to fit in a refrigerator yet powerful enough to connect to the Internet. Now,
    because of advances in hardware technology, we’re seeing computational components
    that are getting smaller, cheaper, more energy efficient, and more powerful. `Moore’s
    law` summarizes these trends in hardware technology improvements.


    `Moore’s law`, named after `Fairchild Semiconductor` and `Intel` co-founder `Gordon
    Moore`, is based on his 1965 prediction that the number of transistors on a computer
    chip would double every year. What does that mean? Briefly, computers speak in
    binary, meaning that they only understand information that’s written as a series
    of 0s and 1s. As we learned in Chapter [3](#321739_2_En_3_Chapter.xhtml), everything
    we tell a computer to do via human-readable programming languages eventually gets
    translated into binary so that the computer can understand and execute our instructions.
    Transistors are the actual pieces of hardware within the computer that represent
    the 0s and 1s. The more transistors there are on a computer chip, the more computing
    power that chip has. Over time, as transistors became smaller and computer chips
    became more powerful, smaller devices gained greater amounts of computing power.
    The computing power of a handheld smartphone today is far greater than the computing
    power of a massive supercomputer 30 years ago. Our `Roost` fridge has the computing
    power it needs thanks to these advances in hardware technology.


    Second, recent networking improvements have led to faster, cheaper, and more reliable
    connections to the Internet. Needless to say, more widespread and reliable access
    to the Internet helps Things stay connected. Fast and reliable Internet connections
    are crucial for IoT networks that we rely on for our health and safety. For example,
    if smart locks secure the `MyAppoly` office, the consequences of an Internet outage
    could compromise the safety and security of the office building.


    Third, the `Roost` IoT network can successfully make use of massive amounts of
    data thanks to current big data technology. As we discussed in Chapter [5](#321739_2_En_5_Chapter.xhtml),
    big data is high velocity (rapidly updated pieces of data), high volume (large
    amounts of data), and high variety (different types of data). The data generated
    by IoT networks certainly qualifies as big data and necessitates the use of newer
    big data technologies. Our `Roost` fridge generates a massive amount of data about
    milk weight alone—imagine the sheer volume of data our fridge will have once we
    stock it with the rest of our groceries and combine data from all `Roost` fridges
    in the country! Advances in data mining and statistics, as well as the machine
    learning advances discussed in Chapter [15](#321739_2_En_15_Chapter.xhtml), contribute
    to `Roost`’s ability to glean useful insights from massive amounts of data.


    Lastly, advances in cloud technology make it possible for IoT networks to share
    data and communicate. The IoT platform itself exists because multiple devices
    can communicate with a central piece of software on the cloud. IoT devices can
    store massive amounts of data in the cloud that would otherwise be impossible
    to store directly on the devices themselves. These servers can cheaply store large
    amounts of data due to the improvements in hardware we discussed above. Powerful
    servers in the cloud can perform computationally intensive analytics that aren’t
    possible to do on smaller devices.'
