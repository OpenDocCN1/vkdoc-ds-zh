    Internet connection, you cannot access the data and software you might need. Many
    cloud applications allow you to download your data as a work-around, although
    some of them charge you to do so.


    *   *Security and privacy vulnerability*: The cloud is becoming more secure, but
    companies are justifiably wary about having their data accessible via the Internet.
    If your data exist with someone else, are you keeping your information private?
    Despite increasingly sophisticated security defenses, vulnerability to malicious
    attacks and hacking thefts is a growing worry at all levels (Chapter [12](#321739_2_En_12_Chapter.xhtml)).


    ## Conclusion


    The Internet proliferated in large part because hosting became so easy. Entrepreneurs
    made their creations available to their customers quickly and inexpensively by
    utilizing the latest hosting technologies. As consumers have started to shift
    their preferences toward cloud services, newer tech companies are often finding
    themselves in an attractive light versus large companies who may be too tied to
    legacy systems to take full competitive advantage of cloud benefits.


    It goes without saying that you need to build a website before you can host it
    on the cloud. Whether you are an opportunistic entrepreneur aiming to modernize
    old software or you work at a large company hoping to stay current with new web
    technology services, you must understand the parts of a web application. You will
    acquire this understanding by building MyAppoly, as you will start to do in the
    next chapter.


    Footnotes [1](#321739_2_En_2_Chapter.xhtml#Fn1_source)'
  trans: '

    *软件即服务（SaaS）*：用户通过浏览器即可访问的任何应用程序（如 Dropbox）都属于 SaaS。此外，API 也与此相关，我们将在第 6 章详细讨论。由于服务通过云端提供，且并非在每个用户的计算机上都安装应用程序副本，因此我们可以说云基于多租户架构。


    *平台即服务（PaaS）*：接触过面向编程社区的云平台（例如 `Heroku`）的人对这个术语会比较熟悉。这些平台为用户提供构建自有软件的环境。除其他功能外，它们还提供网络服务器，供用户构建自己的网络应用程序。


    *基础设施即服务（IaaS）*：云的发展催生了整个云基础设施业务，它允许用户在云端托管自己的网站。这带来了许多效率提升。例如，在推出新的促销活动后，您可能预期会出现大量流量。以往，您需要购买足够的服务器来应对这个高峰时段的网站访问。当访问潮过去后，您会剩下大量昂贵的服务器却只有相对较低的流量。云将这些固定成本转变为可变成本。由于通过云可以轻松地增减服务器容量，您只需为实际使用量付费。


    `亚马逊`（Amazon）为建设其自己的网站而建立了数据中心，并通过名为亚马逊网络服务（AWS）的服务将其多余的服务器和工具提供给他人使用。作为 AWS 的一部分，亚马逊弹性计算云（EC2）允许您根据计划远程、灵活地添加或移除服务器。微软、谷歌和许多其他公司也提供类似服务。


    NIST 还定义了四种部署模型，用于确定谁可以访问云中的信息，但这超出了本书的讨论范围。


    ## 云计算的优势


    云计算的优势包括：


    *可访问性与独立性*：您可以在任何连接到云的设备上访问应用程序或数据，因此不再受限于个人电脑就能获取所需内容。


    *备份*：由于您的文件安全地存储在云端，即使您把笔记本电脑掉进浴缸，或是在地铁里丢了平板电脑，数据也安然无恙。


    *按比例计费*：计费是按使用量或使用时间计算的。


    *降低硬件成本*：大量计算任务由云中的计算机处理，因此您不一定需要配备最新硬件的最快计算机。您只需要一台具有合理网络速度的电脑。您也无需自行存储所有信息，因为您的文件都可以保存在云端。诸如
    `Chromebooks` 之类的廉价笔记本电脑，仅需提供快速的互联网接入即可。


    *更佳性能*：由于云降低了您安装功能冗余程序的需求，您的计算机拥有更多可用内存，从而可以更快地处理其他事务。


    *更少的维护问题*：由于软件存放在云端，您遇到已安装软件与其他软件或同一软件的新版本发生冲突的可能性大大降低。


    *获取最新版本*：当您访问一个网站时，您所访问的应用程序版本始终是最新的版本。


    *更便捷的团队协作*：当所有人都使用云时，团队可以更有效地协作。想想 Google Drive 和文档协作。


    *增强的计算能力*：单台计算机的计算能力是有限的。然而在云端，处理能力可以分布在整个网络之上。


    ## 云的缺点


    如果您在阅读了云优势的详细列表后欣喜若狂（*on cloud nine*，在云端第九重，意为非常高兴），很抱歉我不得不给您泼冷水（*rain on your
    parade*，在游行时下雨，意为扫兴）。云并非完美无缺，原因如下：


    *对互联网的依赖*：如果互联网中断或您的网络连接不稳定，您将无法访问可能需要的数据库和软件。许多云应用程序允许您下载数据作为变通方案，尽管有些会为此收费。


    *安全与隐私漏洞*：云端正变得越来越安全，但公司对于其数据可通过互联网访问仍然有理由保持警惕。如果您的数据由他人保管，您的信息还能保持私密吗？尽管安全防御手段日益复杂，但面对恶意攻击和黑客窃取的风险，各个层面（第
    12 章）的担忧正在加剧。


    ## 结论


    互联网之所以蓬勃发展，很大程度上是因为网站托管变得非常容易。企业家利用最新的托管技术，能够快速且低成本地将他们的创造物提供给客户。随着消费者开始将偏好转向云服务，相对于可能过于依赖传统系统而无法充分利用云优势的大型公司，新兴的科技公司往往发现自己更具吸引力。


    不言而喻，您需要先构建一个网站，然后才能将其托管在云端。无论您是一位志在现代化老软件的机会主义企业家，还是在一家希望保持与时俱进、了解新网络技术服务的大型公司工作，您都必须理解网络应用程序的各个组成部分。您将在构建
    `MyAppoly` 的过程中获得这种理解，这正是您将从下一章开始着手做的事情。


