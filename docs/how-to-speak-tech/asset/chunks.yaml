- fmt: '# Iterative and Incremental Development


    In the 1960s, an evolutionary model called *iterative and incremental development*
    (IID) emerged and was ultimately adopted by many software developers. It broke
    the long-term waterfall model into mini-projects, called iterations. For example,
    we can break the construction of `MyAppoly` into the development of its features,
    including transferring money, uploading photos, and exporting data to a spreadsheet.
    Together, these iterations form the whole project, but each iteration is a complete
    standalone aspect of the end goal. The export to spreadsheet feature should be
    independent (from an engineering standpoint) from the photo uploading function.
    Each incremental iteration adds something new to the existing product. “Tune-up”
    iterations enhance older features.


    The many philosophies of development under the umbrella of iterative and incremental
    tend to recommend that an iteration be somewhere between one and six weeks. These
    iterations have deadlines, a practice called *timeboxing*. In 1955, Cyril Parkinson
    articulated his eponymous law, which states that “work expands so as to fill the
    time available for its completion.”^([^(10)](#fn10)) By Parkinson’s law, if you
    have one week to do something that you really know will only take two days, the
    entire iteration will still take one week because you will be unproductive. `Timeboxing`
    is designed to prevent such procrastination. `Timeboxing` also prevents scoped
    work from expanding. Say that a feature is timeboxed to a week, but it ends up
    being more technically complex. By limiting time spent on this feature to a week,
    we can reevaluate it at the end of the timebox and decide to finish it only if
    it is a priority.


    Rapid iterations are needed to accommodate the unpredictability that defines software
    development. You can iterate on a single aspect multiple times, and so this development
    model is not as rigidly sequential as the waterfall model. If you were to apply
    this process to house construction, an iteration might consist of a single bedroom.
    Subsequent iterations could add different bedrooms or even redo a particular bedroom
    based on feedback from the prior iterations.


    One concern with IID processes is prioritization. If someone breaks apart a large
    project into several iterations, which ones are tackled first? IID processes have
    two approaches to prioritization: risk-driven and client-driven. The risk-driven
    approach recommends working on the riskiest parts of the project first. These
    iterations could consist of the most integral parts of the application or the
    ones that are most complex and likely to fail. By building these first, you can
    be more confident that the project is feasible and will proceed as expected. The
    client-driven approach, as the name suggests, says that customer feedback and
    demand should influence prioritization. Such feedback-driven decision-making is
    considered *evolutionary* and *adaptive* in nature because it provides the flexibility
    valued by developers in place of the waterfall model’s rigidity. These prioritization
    strategies are not mutually exclusive, but they are useful in framing the discussion
    within your own team.


    There is a difference between *delivery* and *iteration*: not every iteration
    has to be delivered (made available for use by your customers). You might want
    several features to be built before releasing a new version, for example. With
    that being said, feedback from your deliveries might inform future iterations
    and deliveries, and so it’s strategically advantageous to release iterations to
    customers periodically.


    # Agile Development


    Today, many companies have shifted to an *agile* methodology. Agile development,
    like the IIDs already mentioned, is a philosophy of organization and management.
    Some say it is a type of IID, while others argue that it borrows from but significantly
    expands on IIDs. Whatever your standpoint, almost everyone, from the titans to
    the up-and-coming web startups, wants to say they have an *agile development process*.


    Agile development displays many of the same qualities as IIDs. The product backlog
    consists of all the things yet to complete, organized according to some prioritization
    methodology. The teams work on a few iterations at a time, and iterations are
    released to users for feedback as soon as they are complete, creating more customer-developer
    collaboration than in most IIDs. This feedback adds and reprioritizes items in
    the product backlog. *Agile* does not refer to the enhanced speed of your team’s
    process, but rather to the philosophy that describes the methodology of building
    it. It holds four core principles:


    *   Individuals and interactions over processes and tools

    *   Working software over comprehensive documentation

    *   Customer collaboration over contract negotiation

    *   Responding to change over following a plan


    Agile development emphasizes team dynamics and the overall work environment. Rather
    than outline characteristics, I describe them from my own experience of agile
    culture at a startup. Agile development recommends group collaboration and open
    spaces and may favor an open floor plan over cubicles to spur creativity and remove
    rigidity. Whiteboards are plentiful so that self-managed teams can sketch out
    ideas, interact with their thoughts, and photograph them for future use. These
    brainstorming sessions are meant to be simple, as the agile development process
    encourages simplicity in all areas. Instead of using complicated slide shows and
    spreadsheets to demonstrate a point, jot it down, take a photo, and send it around.


    These companies are characterized by self-managed teams, where authority is shifted
    from the manager to the group. These teams brainstorm ideas for the next iteration,
    delegate their own tasks, tackle them in groups, reconvene to check on progress,
    and hold each other accountable. Older management beliefs dictated that people
    did not like work, avoided responsibility, and could only be motivated by negative
    incentives. Agile development fundamentally disagrees and has roots in more natural
    management theories, which propose that people feel empowered in teams, delight
    in tackling hard problems, and enjoy coming to work. The right environment will
    encourage the team to be more productive and to deliver a better product. Rather
    than dictate what must be done, project managers provide resources, maintain the
    vision, remove impediments, and promote principles that favor the team’s adoption
    of agile culture.


    # Benefits


    The benefits of agile development are clear. Rapid iterations allow teams to manage
    complexity and to refine their way of working together, thereby improving efficiency.
    The ability to incrementally add features and revisit old ones lowers the overall
    risk and delivers versions of the product more quickly to the customer. Customers
    love products that regularly improve, and companies can use the rapid and constant
    feedback to inform their product, which in turn improves the user experience.
    Your team will feel empowered by delivering changes frequently. Their buy-in leads
    to higher productivity, and in the end, both the business and the customers benefit.
    Because the development process adds productivity and quality improvements to
    the product, agile development is rising in popularity rapidly.'
