  trans: '

    # MyAppoly


    如果你跳过了序言，那么需要知道的是，本书以松散叙事的方式展开，主角是*你*。故事的前提是你正在构建一个名为 MyAppoly 的 Web 应用程序。这个名字只是一个统称；我鼓励你将自己感兴趣的任何场景想象成
    MyAppoly。如果你是一位杀手级应用的企业家或天使投资人，MyAppoly 将成为你实现 10 亿美元退出策略的门票。如果你是非营利组织的高管，MyAppoly
    将帮助你筹集资金并连接志愿者。如果你在《财富》500 强公司工作，MyAppoly 将帮助你的公司保持竞争力，并领先于不断变化的消费者期望。


    你打开浏览器访问 MyAppoly 网站上的某张图片。此时，你的计算机成为了*客户端*，负责请求信息。你访问的实体网页通常是用一种叫做 HTML 的语言编码的文档，它们存储在名为*服务器*的计算机上。你的应用程序的所有文件，包括图片和视频，都存放在服务器上。这些文件被称为*资源*。由于*客户端*（用户）在访问*服务器*，因此可以说互联网遵循*客户端-服务器架构*。


    接着，你在浏览器中键入网址——*统一资源定位符*（URL），即 [`www.MyAppoly.com`](http://www.myappoly.com)。从技术上讲，你也可以直接键入
    MyAppoly 服务器特定的 IP 地址，但谁能记住每个网站对应的 IP 地址呢？*域名系统*（DNS）将像 [`MyAppoly.com`](http://myappoly.com)
    这样对人类友好的域名转换为计算机友好的 IP 地址。


    你访问 [`MyAppoly.com`](http://myappoly.com) 并点击一个链接来查看网站上的图片库。请记住，所有这些图片也都存放在服务器上。假设它们都在一个名为“Pictures”的文件夹中。如果你点击第一张图片，你将被定向到
    `http://www.MyAppoly.com/Pictures/pic1.jpg`。该 URL 的组成部分表明，我们正在使用 HTTP 协议，指定了正确的服务器（通过域名），并指出了文件在服务器上的位置（用技术术语来说，就是文件的*层级位置*）。换句话说，URL
    就是一个资源的文本地址。


    那么，你究竟是如何收到这些网页的呢？首先，客户端（你的浏览器）访问 DNS 以获取对应 MyAppoly 的 IP 地址，这样它就知道服务器在哪里。你的浏览器不会物理移动到
    MyAppoly 服务器去获取图片，因此它必须通过互联网发送一条消息，告诉服务器发送文件。HTTP 请求正是完成这一工作的。HTTP 是一组用于在互联网上交换资源（文本、图像、音频等）的规则。


    你的请求可以是多种不同的方法之一，最常见的是 `GET` 或 `POST`。`GET` 方法告知服务器，客户端想要从服务器获取文件。收到 `GET` 请求后，服务器会检索相应的文件并将其发送回你的浏览器。另一种请求类型是
    `POST`，当你向服务器发送数据时，浏览器会使用此方法。在某些情况下，这两种方法都可以处理请求，但它们在数据实际通过互联网发送的方式上有所不同。使用 `GET`
    方法时，你发送给服务器的信息会被添加到 URL 中。例如，如果你在 MyAppoly 上搜索“mediterranean”这个词，`GET` 请求会将你重定向到
    URL `www.MyAppoly.com/search?q=mediterranean`。如果搜索词通过 `POST` 发送，则搜索词会包含在 HTTP
    消息中，并在 URL 中不可见。通常认为，仅在需要更改服务器端某些内容时使用 `POST` 请求是一种良好实践。


    于是，客户端发出了一个请求，该请求找到了 MyAppoly 服务器，并告知它执行 `GET` 操作以获取包含“pic1”文件的页面。服务器获取该资源，并通过
    TCP/IP 将其作为*响应*发送回来。浏览器可以利用头部信息来显示（即*渲染*）该资源。然而，这个过程并不一定就此结束，因为客户端可能还需要发送更多请求。由于服务器一次只能向浏览器发送一个资源，因此可能需要多个请求来检索构建一个网页所需的所有资源。如果你想查看包含
    pic1 图片的页面，你实际上是在请求两个资源：包含文本内容和页面布局的 HTML 页面，以及 pic1 图像。因此，浏览器至少需要发送两个请求。


    ## 结论


    凭借你对互联网基本要素、操作和工具的了解，你可能已经迫不及待想要开始创建 MyAppoly 的挑战了。然而，你必须首先设置网站托管，这是让你的应用程序存在于互联网上的必要条件。


    # 托管与云端


    对于实体零售商来说，可用性包括库存和商品在货架上的实际摆放。在某种程度上，互联网上的对应概念是*托管*，即创建者使网站在互联网上对用户可访问的过程。


    在关于互联网的讨论中，几乎完全不可能不提及*云端*这个词。但“云端”究竟指的是什么，它为何变成了一个无处不在的术语？


    ## 托管


    正如你在第 1 章中学到的，当你访问一个网站时，你的浏览器会向服务器发送一条请求文件的消息。服务器最初是如何拥有这些信息的呢？将网站放置到服务器上并使其在互联网上可用的过程被称为*托管*。你的网站文件被保存到持续连接到互联网的服务器上，确保网站始终可访问。想象一下，如果你把文件放在一台每晚都有人关机的服务器上，那么夜间访问者和客户将收到错误信息，这意味着业务损失——因此，托管服务器必须拥有永远在线的快速互联网连接。除了互联网连接，服务器还需要特殊的网页托管软件，但这里我不深入讨论。


    你可能不想自己托管网站。你当然*可以*这样做——这会是免费的（电费和互联网费用除外），而且你对服务器拥有完全的灵活性。缺点是你必须自己管理它，这需要相当多的技术知识。


    世界上有足够多的人意识到自托管很麻烦，因此聪明的企业家们创办了提供托管服务的公司。他们提供为优化可访问性和速度而设计的、用于存储网站的计算机。他们移除了计算机上所有不必要的组件，以便制造出更高效、更便宜的服务器。向纸牌游戏和画图程序说再见吧，也不需要显示器或键盘了。托管提供商将这些极简计算机堆叠起来，并将这些服务器上的空间出租给想要托管网站的人。


    托管提供商迅速流行起来，因为它们允许网站开发者专注于自己的产品。托管提供商通常提供一个控制面板供网站开发者管理站点，并允许使用*文件传输协议*（FTP）将文件移动到这些远程服务器上。FTP
    是一种特殊的软件，允许你将网站文件上传到服务器。

    '
- fmt: '### Hosting Considerations


    When choosing a hosting provider, consider the following parameters:


    - **Server type**: Different servers have different web hosting software (such
    as `Apache`, `OS X Server`, and `Windows Server`), which does not matter for the
    average user and use case.

    - **Disk space allowance**: The size of your website and database will determine
    how much memory you need on the server.

    - **Bandwidth**: Every time someone visits your web page, the browser requests
    files from the server. The amount of data transferred from your server back to
    the user is known as *bandwidth*. The more users visiting your site or the more
    images and resources your web page has, the higher the bandwidth. Some hosting
    providers base a portion of pricing on bandwidth needs since it costs more to
    serve 1 million customers than just one.

    - **Reliability and uptime**: Make sure the hosting provider keeps your website
    on the Internet and accessible as close to continuously (24 hours a day, 7 days
    a week, 365 days a year) as possible.

    - **Price**: Shop around for different options. The prices vary among the categories
    outlined next, but within a particular category, prices may vary just a little.
    Have a realistic budget in mind that balances your requirements with available
    packages.


    ### The Different Types of Hosting


    Hosting providers make their servers available for use in many ways. Below are
    a few:


    - **Shared hosting**: When multiple users share a single server, it’s called *shared
    hosting*. The hosting provider essentially divides a server into several parts
    and rents each part out to a different user. Because the server is shared, this
    type of plan is typically the cheapest but also the most inflexible. You can’t
    update software or change configurations on the shared server, as your changes
    might affect the other websites running on the same server (and their changes
    would affect you!). Despite the trade-off in flexibility, this cheaper solution
    typically works for simple websites, such as personal websites.

    - **Dedicated server**: As the name suggests, a dedicated server plan allows you
    to rent an entire server to do whatever you please. You can customize the server
    in any way you want, and you can ensure that other people’s problems do not become
    yours, but a substantial increase in price accompanies the added flexibility and
    control. This type of plan makes sense if you are hosting several websites, especially
    if they have significant traffic and substantial database use (usernames, credit
    card information, popular items, etc.).

    - **Virtual dedicated server**: A virtual dedicated server, aka virtual private
    server, is in some ways a combination of a shared hosting plan and a dedicated
    server plan. Hosting providers can offer server space that you can treat as a
    dedicated server, but the server is really shared. You can customize it however
    you want, unlike in shared hosting plans, yet several customers can use the same
    server. Computer space and processing power are not wasted, thus benefiting the
    hosting provider, and customers do not have to pay for an entire server if they
    don’t need it.

    - **Collocated hosting**: In a collocated hosting plan, you own the server, but
    delegate its management to a hosting provider. What you pay for is bandwidth (Internet
    usage) and maintenance fees (for cooling and so on).


    ## The Cloud


    The cloud is best understood when you realize its similarities to the mainframe
    computers of the 1950s. These computers were massive, pricey, and available only
    to the governments and large organizations that could afford them. Rather than
    work directly on the computer, users would access the mainframe using a dummy
    computer with a special, text-only program called the *terminal*. Through these
    dummy computers, users would gain access to the real computer, where all the data
    and programs lived. All information and functionality were centralized, in a sense,
    but as computers become cheaper, the idea of a personal computer began to take
    over.


    However, individual computers are limited by their memory and data processing
    speed. As network technology improved, computer scientists realized that connecting
    computers in a network would dramatically improve their capabilities. This network
    of computers is called the cloud. The decentralized computers that comprise the
    cloud can interact collaboratively through the Internet. In some ways, the cloud
    is a reversion to the mainframe computers of the 1950s—users interact with the
    fast and powerful cloud through an interface on their individual, much less powerful
    computers.


    When someone says, "I stored it in the cloud," or "I accessed it in the cloud,"
    they’re referencing a powerful tool. Through the Internet, they accessed some
    service (such as `Dropbox`) and stored their files there. Rather than saving it
    on their hard drive or relying on offline services, the cloud leverages the Internet
    to make resources and services available. In addition to photos, music, and any
    other type of information you can imagine, the network of servers that forms the
    cloud also stores everything from simple websites to more complicated web software
    that can be accessed online.


    *Cloud computing* refers to the access and use of information and software on
    the cloud by computers and other digital devices such as smartphones and tablets.
    It encompasses the idea that you no longer have to save everything to your physical
    computer. Cloud computing means that you don’t need to go to a store to buy software
    on a disk that you have to insert and install onto your machine. Today, most companies
    host some version of their product online.


    According to the US National Institute of Standards and Technology (NIST), the
    cloud computing model "is composed of five essential characteristics, three service
    models, and four deployment models."^([¹](#fn1))


    The five essential characteristics of cloud computing identified by `NIST` are
    the following:


    - **On-demand self-service**: You, the client, should be able to get access to
    the cloud’s resources and software whenever you want. To log on to [Salesforce.com](http://salesforce.com),
    all you need is a computer with Internet connection and a valid username and password.

    - **Broad network access**: The cloud should be accessible across a broad range
    of client platforms (whatever devices you are using to access the resources and/or
    software—tablet, smartphone, laptop, etc.).

    - **Resource pooling**: Computers in the cloud work with each other to support
    multiple users and solve problems too large for isolated computers.

    - **Rapid elasticity**: Because computers in the cloud can talk to each other
    over the network, if specific computers are overwhelmed with traffic, other computers
    can pick up the slack. The cloud allows capabilities to be scaled up and down
    rapidly.

    - **Measured service**: In the traditional software model, customers pay a set
    amount of money to install and to use a program. Whether you used it every day
    or wanted to try it out, it would cost you the same. Now, companies can measure
    a customer’s usage in terms of storage, processing, bandwidth, and other metrics.
    Pricing based on usage is now possible, which leads to a more efficient market.


    The three service models for cloud computing identified by `NIST` are the following:'
  raw: '### Hosting Considerations


    When choosing a hosting provider, consider the following parameters:


    *   *Server type*: Different servers have different web hosting software (such
    as Apache, OS X Server, and Windows Server), which does not matter for the average
    user and use case.


    *   *Disk space allowance*: The size of your website and database will determine
    how much memory you need on the server.


    *   *Bandwidth*: Every time someone visits your web page, the browser requests
    files from the server. The amount of data transferred from your server back to
    the user is known as *bandwidth*. The more users visiting your site or the more
    images and resources your web page has, the higher the bandwidth. Some hosting
    providers base a portion of pricing on bandwidth needs since it costs more to
    serve 1 million customers than just one.


    *   *Reliability and uptime*: Make sure the hosting provider keeps your website
    on the Internet and accessible as close to continuously (24 hours a day, 7 days
    a week, 365 days a year) as possible.


    *   *Price*: Shop around for different options. The prices vary among the categories
    outlined next, but within a particular category, prices may vary just a little.
    Have a realistic budget in mind that balances your requirements with available
    packages.


    ### The Different Types of Hosting


    Hosting providers make their servers available for use in many ways. Below are
    a few:


    *   *Shared hosting*: When multiple users share a single server, it’s called *shared
    hosting*. The hosting provider essentially divides a server into several parts
    and rents each part out to a different user. Because the server is shared, this
    type of plan is typically the cheapest but also the most inflexible. You can’t
    update software or change configurations on the shared server, as your changes
    might affect the other websites running on the same server (and their changes
    would affect you!). Despite the trade-off in flexibility, this cheaper solution
    typically works for simple websites, such as personal websites.


    *   *Dedicated server*: As the name suggests, a dedicated server plan allows you
    to rent an entire server to do whatever you please. You can customize the server
    in any way you want, and you can ensure that other people’s problems do not become
    yours, but a substantial increase in price accompanies the added flexibility and
    control. This type of plan makes sense if you are hosting several websites, especially
    if they have significant traffic and substantial database use (usernames, credit
    card information, popular items, etc.).


    *   *Virtual dedicated server*: A virtual dedicated server, aka virtual private
    server, is in some ways a combination of a shared hosting plan and a dedicated
    server plan. Hosting providers can offer server space that you can treat as a
    dedicated server, but the server is really shared. You can customize it however
    you want, unlike in shared hosting plans, yet several customers can use the same
    server. Computer space and processing power are not wasted, thus benefiting the
    hosting provider, and customers do not have to pay for an entire server if they
    don’t need it.


    *   *Collocated hosting*: In a collocated hosting plan, you own the server, but
    delegate its management to a hosting provider. What you pay for is bandwidth (Internet
    usage) and maintenance fees (for cooling and so on).


