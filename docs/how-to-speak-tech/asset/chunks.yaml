    # 15. 人工智能


    特别感谢 Jay Harshadbhai Patel 为本章做出的贡献。


    这是一个阳光明媚的早晨，你正在准备去上班。出门前，你打开收件箱开始阅读电子邮件。收件箱已自动将垃圾邮件过滤到一个单独的标签页中，这样你就可以忽略它们了。在回复一封邮件时，你犯了一个语法错误，但被邮件服务及时纠正了。到了该出发去上班的时候，你的智能手机弹出一条通知，显示根据当前交通数据，到达办公室需要
    24 分钟。你走出家门，一辆自动驾驶汽车已经准备好来接你。当汽车载你去上班时，你坐在后座享受一杯咖啡。在办公室，你"询问"你的智能手机"我今天有哪些会议？"手机便会读出你会议的详细信息。你去参加上午
    10 点的会议，并顺利开启高效的工作日。


    几年后，这样的场景将变得司空见惯。人工智能技术将使我们更轻松地处理个人和职业生活中的日常活动。人工智能技术看似像人类一样思考和分析，但实际上只是计算机处理大量数据来做决策。因此，既然人类展现的是*自然*智能，我们说计算机展现的是*人工*智能。在本章中，我们重点关注机器学习（ML），它是人工智能的一个子集，能够从经验中学习并持续提升其智能。在机器学习技术出现之前，我们必须手动从收件箱中删除垃圾邮件，但像
    Gmail 这样的现代电子邮件产品使用机器学习来根据邮件内容或我们过去的行为学习将哪些邮件标记为垃圾邮件。随着我们越来越多地使用这些产品，它们会记录我们点击的邮件、链接和按钮，从而变得更加精准。本章中所有对
    AI 的引用，都应理解为自我改进的机器学习系统。


    ## 人工智能的关键方面


    每一项人工智能技术都是为了解决一个*问题*而构建的，即一个具有明确定义输入和输出的任务。*输入*是教会人工智能解决问题的数据，*输出*则是解决方案。人工智能的*模型*，即其大脑，是一组根据输入产生输出的数学函数。模型会根据所提供的数据进行*学习*，即适应并改进其行为。以
    Spotify 为例，这是一款流行的音乐流媒体应用，也会向用户推荐新歌曲。在这里，*问题*是做出最有可能让听众满意的歌曲推荐。输入数据包括用户的歌曲收听历史、热门歌曲、相似用户的偏好，以及其他有助于推断用户可能喜欢收听什么的有用信息。输出则是
    Spotify 推荐给用户的歌曲。模型是理解你收听偏好的核心软件组件。随着 Spotify 的歌曲推荐效果随时间推移而改善——例如，它最初可能会推荐前 40
    首热门歌曲，因为它们在全美都很流行，但随着它获得更多关于你过去收听迪士尼歌曲历史的信息，它将开始推荐更多电影原声带——我们就能看到它在学习。


    接下来，我们将深入探讨人工智能的这四个方面，即问题、数据、模型和学习。


    ### 问题


    我们使用人工智能来解决问题。这里的*问题*一词使用得非常广泛，涵盖从食物、住所和水等基本人类需求，到拥有个人助理帮你处理文书工作等奢侈享受的一切。


    人工智能适用的主要问题分为两大类。第一类包括人类已经能够解决，但人工智能可以提供更好、更高效解决方案的问题。例如，人类驾驶汽车已有数十年历史，但自动驾驶汽车有潜力大幅减少道路交通事故数量，并催生新的汽车共享生态系统，从而减少汽车拥有量和有害气体排放。像谷歌、优步和特斯拉这样的知名公司如今正在投入大量资金和人才来构建自动驾驶人工智能。构建这项技术需要感知环境，实时识别车辆、行人和障碍物，并根据这些数据做出行动来导航道路。


    另一类问题包括那些对人类来说难以解决（甚至无法解决）的问题；这里我们期望人工智能能够开启创新之门。例如，虽然你最亲密的朋友可以推荐你可能喜欢的歌曲，但他们会受限于自己的音乐体验。如果我们能浏览世界上所有的音乐，并推荐那些与你的品味互补的音乐，你可能会发现新的、令人兴奋的音乐，而这些音乐在别的途径下是无法接触到的。


    人工智能的输出通常被称为*预测*，意指有根据的猜测。这里的预测并非指关于未来的陈述。如果它向用户返回五首新的歌曲推荐，我们就说它预测了这些歌曲。换句话说，它利用过去的数据和收听历史来确定，在它所知道的所有歌曲中，用户会最喜欢返回的这些歌曲。更一般地说，我们称之为一个*分类*问题，即人工智能试图将输入归类到一个或多个预定义的类别中。在这里，它对知识库中的每首歌曲预测"用户会喜欢"（编码为
    1）或"用户不会喜欢"（编码为 0），并返回一些类别为 1 的歌曲。这里只有两个类别（1 和 0），每首歌曲必须属于其中之一。类别的数量取决于问题——越具体的预测需要越细粒度的类别。我们可以训练人工智能来预测从"非常喜欢"到"中性"再到"非常不喜欢"的范围，这需要三个、五个甚至七个类别。相反，*回归*问题的输出是连续的、非分类的。预测结果并不属于某一类或另一类，而是落在某个连续区间内。例如，根据某个地区历史上的月度（每月第一天）房价数据，我们可以训练人工智能绘制一条平滑的曲线，以捕捉多年来房价上下波动的平均趋势，从而预测未来的价格。


    '
- fmt: '### Data


    AI relies on large amounts of correct, varied, and balanced inputs to solve the
    problem correctly. Since it adapts and improves its behavior based on data, incorrect
    data means it will learn to predict the wrong classes or values. Housing prices
    mistakenly shifted by a month will lead to predictions offset by a month. Worse
    still, corrupted data such as wrong prices will teach AI the wrong things entirely.
    Even if data is correct but narrowly sourced, it will not be representative of
    the problem and will lead to poorly performing AI. For example, historical housing
    prices from the United States should not be used to train AI to predict prices
    in India since the markets are so different. Furthermore, the AI model needs to
    see enough varieties of housing types in data, like single-family homes, duplexes,
    and mansions so that it is not taken by surprise when asked to predict the price
    of an obscure house. Lastly, data must have enough quantities of each house type
    to avoid the majority type from having an overbearing influence on what AI learns.


    Computers store all information as numbers, or more precisely bits. Therefore,
    we must transform data into numbers before AI can learn from it. Thankfully, standard
    data types like images, text, and audio are already represented as numbers in
    computers. In practice, we convert data into condensed numerical representations
    called *features* , which capture the most relevant parts. Let us say you had
    access to information about all houses sold in the United States over the last
    hundred years, including details about the houses and their monthly price variations.
    To build an AI that predicts the price of a house in the future, we might focus
    our attention on the purchase date, square footage, location, and occupancy (i.e.,
    the features) for each house, since they are most likely to affect prices. We
    leave out wall paint color and previous tenants’ age since we find them irrelevant
    in determining the price. Combining the most relevant features into a list of
    numbers gives us a *feature vector*, which is the exact format of input expected
    by AI.


    But how do we know that date, square footage, location, and occupancy are the
    most impactful factors on housing prices? Maybe wall paint color *is* essential
    to market price. There are so many things that affect market prices that we might
    be oversimplifying by manually choosing a few features based on intuition, thus
    training our AI to learn the wrong patterns. A better way is to automatically
    discover the most important features through mathematical techniques. We could
    first plot price (y-axis) vs. square footage (x-axis) for all houses; if the square
    footage has a substantial impact on price, we should notice a diagonal line indicating
    that price changes significantly as square footage changes. Then, we can pick
    this to be one of the features. If the relationship is a horizontal line instead,
    square footage doesn’t impact prices, so we should exclude it from the features.


    We could also use simple counting techniques to capture high-level aspects of
    data and encode them as features. For example, in spam email classification, we
    could count the top ten most frequently occurring words in spam emails, do the
    same for all non-spam emails, and remove highly common words such as “a” and “the.”
    Then, AI will learn to distinguish spam from non-spam by checking words in a new
    email against these word sets and observing whether it should be classified as
    spam. Google’s `Word2Vec` (short for “word to vector”) technique even transforms
    individual words into mathematical representations that capture their real-life
    meaning. These features capture semantic aspects of data; for example, the words
    “mother” and “father” are closely related, whereas “food” and “computer” are unrelated.
    Features are food for an AI; the stronger their relationship with desired outputs,
    the more accurate the AI will be (assuming the AI can pick up on those relationships,
    which is the subject of the “Models” section next).


    Taking a step back from computing features, we need to ensure that we are working
    with the most appropriate data set to begin with. Let’s say we wanted to detect
    pedestrians crossing the road. We could use a microphone to pick up footsteps
    on the road. However, it would be incredibly difficult to determine how far the
    person is from the car by the sounds of footsteps alone. A better kind of data
    here would be images of the road, where a person would be clearly visible. Even
    better, we might use an infrared image to capture heat signals. Humans emit a
    lot more heat than the road so they would appear bright red on the image and be
    easier to detect.


    ### Models


    The model is responsible for producing correct predictions given inputs. Input
    data goes in one end (say a patient’s symptoms), and a prediction (flu/no flu)
    comes out of the other. If the model observes multiple highly related symptoms,
    it predicts a “yes flu.” If it observes a lack of fever, it predicts a “no flu”
    (since the flu is almost always accompanied by fever). In the middle are hidden
    mathematical functions that encode real-world knowledge such as the fact that
    headaches and fever always accompany the flu, while leg pain is an entirely unrelated
    thing. They are essentially formulas that relate variables with coefficients,
    such as `y = mx` where `y` is severity of flu (the higher, the worse) and `x`
    is strength of headache (again the higher, the worse). The variable `m` determines
    how `x` and `y` are related; if it equals one, then as the headache worsens, the
    flu worsens to a similar extent. If `m` equals two instead, the flu doubly worsens,
    implying a symptom that is very strongly related to flu severity. The example
    demonstrates that real-world relationships can be expressed as mathematical formulas
    with variables. Note that these formulas merely indicate correlation between two
    values, meaning that a headache and severity of flu appear to change together,
    not that one causes the other to change. Models trained to capture these correlational
    relationships in formulas are at the core of AI.


    Table [15-1](#321739_2_En_15_Chapter.xhtml#Tab1) shows the different kinds of
    correlational relationships between symptoms and severity of flu.


    **Table 15-1.** Examples of Linear and Nonlinear Relationships


    | Type | Relationship | Example Symptom | Explanation |

    | --- | --- | --- | --- |

    | Linear | Positive | Headache | The worse the flu, the stronger the headache.
    |

    | Neutral | Leg pain | The severity of the flu has no effect on leg pain. |

    | Negative | High mental focus | The worse the flu, the harder it is to focus
    (i.e., lower mental focus). |

    | Nonlinear | Unclear | Sneezing | The severity of the flu is associated with
    sneezing in a complicated way. |


    Linear relationships are simple associations where a corresponding change in one
    value accompanies an increase or decrease in another value. The `y = mx` example
    discussed earlier is a simple linear relationship between `y` and `x`. Nonlinear
    relationships are less straightforward. With old age comes weakened vision, but
    at a different amount and at a different pace for each person. While one person
    may have perfect vision even at 80, another may develop nearsightedness at 20.
    We know that there is some relation between age and eyesight; it is just hard
    to explain or express. Other real-world examples are how a company’s quarterly
    earnings report affects its stock price the next day or how a new government policy
    affects unemployment rates in the country. There are no apparent formulas that
    allow us to compute these effects.'
