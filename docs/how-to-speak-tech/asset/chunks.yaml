- fmt: '### Web Log


    When a user visits a website, the browser sends a request to the server where
    the website lives. The server updates its logs with something like “User X visited
    page at 12:00 pm” before sending the page back. That’s a *web log*. One downside
    is that any server request is logged, even the bots of search engines. If you
    want to monitor only human activity, this may not be the best method to use. Additionally,
    unique visitors are difficult to identify which can complicate a marketing analysis.
    You do not want to count the same person twice, or else your numbers will be off.
    Lastly, do you recall the term *cache*? It takes time for browsers to send requests
    to servers and to receive the page with all of its images and other resources.
    Therefore, browsers save a copy of the website locally to minimize the server
    interaction for efficiency purposes. Web logs will not kick in when the server
    is not utilized, so all activity on cached versions of this web page will not
    be logged. This is an example of server-side data collection (the software used
    to store the data lives on the server).


    ### Web Beacon


    You might be familiar with web beacons if you have received an email with images
    temporarily hidden until you authorize the email client to show it. Why? Web beacons
    typically are 1x1 pixel images that are transparent and live on separate servers
    from those holding the web page. To load an image, recall that browsers have to
    issue additional server requests. When browsers request this web beacon from a
    third-party server, their activity is logged. The use of third-party servers offers
    a bit more flexibility over what you want to collect (either include the web beacon
    or do not) and allows you to aggregate data across multiple web pages—that is,
    you can issue requests for this web beacon from many websites, all of which must
    go to the same server to get the 1x1 pixel image. As a result, all the data are
    stored on the same server, even though the requests came from different sources.
    With that being said, since this method relies on an image request, any tool that
    blocks image requests prevents you from gathering useful data. Spammers use this
    to verify that your email account is still active, so some email clients disable
    images until you authorize their authenticity. Some services also use web beacons
    to enable read receipts.


    ### JavaScript Tags


    JavaScript tagging changed the nature of web analytics. If you recall from our
    discussion on JavaScript, the language has listeners that wait for particular
    events (such as the clicking of a button) before executing certain code. In the
    same way a JavaScript listener might wait to fire code showing a pop up until
    a user has clicked a button, JavaScript could use the “page has finished loading”
    event as a trigger to execute code. If you could make that code collect information
    about the user, the time, and a description of the web page, you could use JavaScript
    as an analytics tool. This is exactly what has happened. As long as you include
    the line of JavaScript code that fires when the page loads, you are good to go.
    Even if your page is cached, the JavaScript code will execute when the user views
    it, so it beats web logs in that way. You can also add special tags to the JavaScript
    code that help you filter data more easily afterward.


    There is slightly more action than this simple explanation because cookies can
    play a large role. When you visit a website, it might put something called a cookie
    on your browser that stores information about you, what you clicked, and other
    relevant information. Next time you visit the website, it will look for that website’s
    cookies, and if it finds one, it knows that you have been to the site before and
    can use the contained information to customize the page for you. If the cookie
    stored information about the shoes you were shopping for, those shoes might appear
    at the top of the page the next time you visit. Back to the analytics: JavaScript
    code uses cookies to log activity. It stores a cookie on your browser, and after
    other parts of the code are finished executing, the information then gets passed
    to a server for storing. These servers are owned either by the company or by third-party
    analytics providers.


    Whereas before analytics were entirely managed by a company’s internal IT team,
    whole companies have now emerged with the sole purpose of helping others with
    analytics. These companies provide some JavaScript code for others to put on their
    websites, and they take care of the rest. The value they provide is also in the
    form of visualization tools to help you understand your data. Google provides
    analytics services for free through Google Analytics, which works by storing data
    in a log file. Every few hours, Google processes these log files and then makes
    the data available for the user to review on its Analytics website.


    The benefits of this approach are many, the primary one being ease of use. Simply
    by pasting code the analytics company provides, you have a full tracking and visualization
    system up and running. Voilà!


    With that being said, some users are starting to turn off JavaScript, so you can
    expect a small amount of data leakage with this approach. Also, do keep in mind
    that if you use a third-party analytics provider (i.e., you do not build and collect
    all of this information yourself), your sensitive `MyAppoly` data will be in the
    hands of other people.


    ### Packet Sniffing


    *Packet sniffing* essentially creates a middleman between a website visitor and
    the `MyAppoly` server hosting the website. After a user requests the `MyAppoly`
    homepage, it passes through a mix of software and hardware called a *packet sniffer*
    where information about the user is recorded before being routed to the server.
    When the server responds with the web page, the files go back through the packet
    sniffer before getting routed to the user. That’s it. On one pass, it gets the
    user data, and on the other pass, it gets the web page information.


    What is convenient about this approach is that no additional code needs to be
    entered in the actual source code and it can easily intercept all requests made
    to your server, thus covering your entire website’s needs. The drawbacks are the
    actual setup process, which might be convoluted, and requests to cached versions
    of the site will not be recorded. You also have to be careful with packet sniffers
    since they will intercept a lot of sensitive information such as users’ passwords
    and credit card numbers. Dealing with this data in a privacy-respecting way is
    crucial.


    ## Visualization


    The particular way data are displayed influences the insights you can draw. As
    a result, many players are trying to make this process easier still. The next
    stage of analytics, therefore, seems to be not so much aggregation-focused but
    visualization- and processing-focused.


    *Click density* (aka *site overlay*) provides insights on what users might be
    thinking based on what they are clicking. The eventual development of *heat maps*
    accomplishes the same thing. Heat maps are images of a web page colored to indicate
    where users are looking based on the mouse movements. Dark red is used for areas
    in which the mouse often hovers, whereas blue areas are locations on the page
    where the mouse rarely goes.


    Analytics should seek to answer not only the *what* (how many views, how many
    signups, and so forth) but also the *why*. The focus has been redirected to tasks,
    with funnels being the popular way to visualize task completion. In this way,
    companies can see exactly how many people drop off at each stage of the process.


    The list of visualization types could continue indefinitely, but the main point
    is that these data are valuable to companies, and they are looking for any way
    to make sense of them. Presentation matters.'
