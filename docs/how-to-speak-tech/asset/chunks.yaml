    ### 挖矿的科学


    *挖矿*可能是区块链技术中最难以捉摸的概念。让我们首先理解挖矿所填补的需求。回顾一下十家私营公司使用区块链共享其客户疫苗接种记录数据库的例子。没有中央权威机构，没有单独一家公司负责维护数据库并确保其中所有数据都正确存储和准确无误。相反，这十家公司各自审查所有传入数据并维护区块链的本地副本。如果没有中央权威机构来规定，这些公司如何就添加哪些数据以及丢弃哪些数据达成一致？参与区块链的这十家公司需要就添加哪些数据达成*共识*或协议。挖矿是多个节点之间达成此共识的一个过程。它首创于比特币加密货币，这是区块链技术的第一个广泛应用。比特币的挖矿过程将在本章后面解释，但在所有区块链中，挖矿过程的核心部分是创建区块的数字指纹。


    数字指纹的创建涉及密码学，而密码学 heavily 依赖于数学。数字指纹是通过对区块数据运行*哈希函数*来创建的。哈希函数接收任何输入数据（通常是文本），对数据应用数学算法，并输出一个唯一代表输入数据的值。比特币区块的数字指纹是通过对区块数据运行
    `SHA256` 算法（一种由美国国家安全局(NSA)设计的哈希函数）来创建的。`SHA256` 接收任意大小的数据作为输入，操作这些数据，并输出一个 64
    字符长的十六进制数，称为*哈希值*。无论输入数据的大小如何，输出总是 64 个字符长。输入数据中的任何变化都会产生一个新的、唯一的哈希值，并且实际上，两个不同的输入不可能产生相同的哈希值。这使得检测区块数据是否被篡改变得非常容易。因此，一个区块数据的哈希值，通俗地称为该区块的*数字指纹*，被用作区块标识符。表[16-1]显示了一些从任意输入数据生成的数字指纹示例：


    **表 16-1. 数字指纹示例**


    | 输入数据 | 数字指纹：`SHA256` 哈希值 | 备注 |

    | --- | --- | --- |

    | `a` | `ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb` | 一个字符产生一个
    64 字符长的哈希值。 |

    | `Blockchain` | `ef7797e13d3a75526946a3bcf00daec9fc9c9c4d51ddc7cc5df888f74dd434d1`
    | 一个完整的单词产生同样长度的哈希值。 |

    | `Blockchains` | `99cf6497afaa87b8ce79a4a5f4ca90a579773d6770650f0819179309ed846190`
    | 单词中的一个微小变化会产生一个全新的哈希值。 |

    | `The favorite number of the fox was 44.` | `f70d31700c3c122331538f9b389a10217e0bd1cc0694b67a5c7b4f02c17b6198`
    | 无论输入数据的长度如何，哈希值总是 64 个字符长。 |


    你可能听说过挖矿是一个*计算密集型过程*。然而，从任何输入数据（如上述数据）生成哈希值只需要不到一秒钟的时间，并且可以在不消耗过多计算机资源的情况下完成。换句话说，生成哈希值本身*不*是一个计算密集型过程。使挖矿成为计算密集型过程的原因是，需要从输入数据中生成特定类型的哈希值，才能为区块创建有效的数字指纹。例如，在比特币区块链中，这需要从区块数据生成一个数值小于给定*目标值*的哈希值。关于挖矿过程的更多信息，可以在本章的比特币部分找到。

    '
- fmt: 'The term `miner` is used to denote the parties involved in the mining process.
    However, the term “miner” does little to clarify the purpose of their job. The
    primary purpose of miners is to maintain the validity of a blockchain in lieu
    of a central authority. As stated above, miners undergo a computationally intensive
    process in order to find the digital fingerprints of new blocks. This process
    is a substitute for a central authority that stipulates which blocks are valid
    and contain data that should be appended to the blockchain. Exactly how this process
    achieves this goal differs from blockchain to blockchain, but the most popular
    method is found in the Bitcoin blockchain, which is detailed later in this chapter.
    Miners aren’t individuals sitting at their desks iterating through hashes: a miner
    is a piece of software running on a (very powerful) computer that automatically
    iterates through millions, billions, even trillions of hashes per second. These
    computers are owned by independent individuals or companies who usually receive
    a reward for running their mining software. In Bitcoin, for instance, miners create
    and receive new Bitcoins every time they find a valid digital fingerprint for
    a new block. As a result, they are generating new coins and making money by performing
    their job as miners. However, not all blockchains let miners generate new coins
    when new blocks are found, and some blockchains have no rewards for miners at
    all. In such cases, miners are instead referred to as `validators`.


    ## Immutability of the Blockchain


    The blockchain is sometimes referred to as a `ledger` because of the way data
    modifications are recorded. Think of how you would change a value, such as the
    bank account balance of a user, in a spreadsheet or traditional database. You
    would most probably overwrite the cell or data field and replace the old value
    with the new value. This method of modifying data is not possible on the blockchain.
    Instead of overwriting the data in a block, you would append a new block to the
    blockchain that modifies that data. As a result, just like a ledger, the blockchain
    keeps track of every data change ever made. This integral property of the blockchain
    is known as `immutability`. Note that this is different from saying that a blockchain
    cannot grow: on the contrary, blockchains are immutable precisely because the
    only way they permit changes to the data they hold is through the addition of
    new blocks, that is, through growth. The Bitcoin blockchain grows at an approximate
    rate of one block every 10 minutes, but once a block is validated and appended
    to the blockchain, it should, in theory, remain unchanged forever. Figure [16-1](#321739_2_En_16_Chapter.xhtml#Fig1)
    shows an example of the process.


    ![../images/321739_2_En_16_Chapter/321739_2_En_16_Fig1_HTML.jpg](images/321739_2_En_16_Chapter/321739_2_En_16_Fig1_HTML.jpg)


    Figure 16-1. Data modification on the blockchain


    If we consider Figure [16-1](#321739_2_En_16_Chapter.xhtml#Fig1) to be the current
    state of a blockchain that has a block height of 3, then Alice, currently, has
    7 points. Note that instead of simply updating the first block with Alice’s current
    point total, we added a new block each time her point total changed. Hence, the
    blockchain serves as a ledger containing a transaction history, or the history
    of data manipulation. Due to its immutable nature, the blockchain is sometimes
    referred to as an `immutable ledger`.


    Both the data in the blocks as well as the order of the blocks, known as the `block
    order`, are immutable. In the example above, the order might seem irrelevant as
    addition is commutative, but blockchains are usually governed by complex rules
    that require immutable ordering. Consider, for instance, that a rule governing
    the blockchain above is that no user is allowed to have more than 10 points. If
    the order were somehow disrupted, and block #2 and block #3 swapped places, Alice
    would have 12 points in the now-second block, which would render that block erroneous.
    This erroneous block, known as an `invalid block`, would render the entire blockchain
    invalid. Consequently, both the block order and block data should, in theory,
    not be changed in a blockchain.


    ## Decentralization


    As mentioned earlier, the blockchain is an appealing way of storing data because
    it allows multiple, independent parties to share a database in the absence of
    a central authority. This means that there is no master copy of the data, no central
    authority that decides what data can or should be added, and no single point of
    failure. This type of network is known as a `decentralized network` because it
    lacks a central hub. This type of network is at odds with how most of society
    is structured. Take currencies, such as the US dollar, for example: it is backed
    by a central government, controlled by a central bank, and transacted via banks
    who act as centralized intermediaries. When we use the US dollar, we trust these
    centralized institutions to act with integrity and fulfill the duties they promise
    to fulfill. As soon as a central bank fails in its duties, the currency collapses.
    This happened, for instance, when Zimbabwe’s monetary policy caused hyperinflation
    in 2008 and the Zimbabwean dollar lost all of its practical value. On the other
    hand, a currency that runs on the blockchain, like Bitcoin, has no central government
    or central bank controlling its functions. Instead, blockchain technology is used
    to distribute these roles, traditionally centralized, among miners who collectively
    maintain the network. In other words, blockchain technology allows for a `trustless
    network` to exist, whereby you don’t have to trust anyone while still being certain
    of the integrity of the system.


    While there are many benefits associated with decentralized networks that are
    built on top of blockchain technology, the implications of an absence of a central
    authority need to be kept in mind. If you accidentally send your Bitcoins to the
    wrong person or feel that you have been scammed, there is no central authority
    you can turn to in order to have your Bitcoins returned. Likewise, there is no
    bank that can vouch for the safety of your funds or aid you in major money transfers.
    A decentralized network removes the safety nets that central authorities provide
    in centralized networks and leaves individuals to fend for themselves. This is
    an important consideration to keep in mind when engaging in decentralized networks,
    especially those that involve high risk. Currently, the most popular decentralized
    network built on a blockchain is the Bitcoin cryptocurrency.'
