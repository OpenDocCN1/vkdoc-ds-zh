  trans: '

    # 比特币：区块链技术的起源


    比特币是一种 *加密货币*，是一种数字货币形式，它利用区块链实现了去中心化的货币功能。因此，比特币以及大多数加密货币，都是区块链技术的一种应用——目前也是最流行的应用。比特币是最古老的加密货币，当前市值已超过十亿美元。事实上，区块链技术正是源于比特币的诞生：比特币的创造者——一位笔名为
    *中本聪* 的匿名个人或团体——发明了区块链技术，作为比特币的交易账本。在此发明之前，数字货币要么是中心化控制的，要么极易被操纵和摧毁。直到比特币问世后，人们才意识到区块链技术在其他领域的潜力。


    比特币于 2008 年问世，当时中本聪发表了一篇题为“比特币：一种点对点的电子现金系统”的白皮书。一年后的 2009 年，中本聪发布了第一版比特币代码。该代码以
    *开源* 形式发布，意味着任何人都可以阅读并为其提出改进建议，这促成了程序员群体以社区驱动的模式持续优化比特币代码。中本聪的发布是在一个面向点对点技术爱好者的在线论坛上完成的。*点对点技术*
    是一种无需中心化权威机构或服务器即可运行的技术。法币（例如美元）并不是点对点网络，因为银行扮演了中心权威的角色，负责监管所有交易、货币存储及发行。如前所述，比特币是一个没有中心权威机构的点对点网络，任何个体或机构都无法决定交易的有效性，也无法拥有关闭系统的权力。因此，比特币是一个
    *去中心化网络*。


    中本聪在比特币中的关键发明是 *工作量证明算法*，它奠定了比特币网络达成共识的基础，换句话说，就是该网络如何就哪些交易有效、哪些无效达成一致。在法币体系中，这并非问题，因为银行会集中规定交易的有效性：如果你试图用自己没有的资金转账，或者试图“双花”你的钱，你的银行会阻止你这么做。因此，在使用法币时，你信任银行作为中心权威机构对交易有效性做出正确判断。然而，在比特币中，*信任是去中心化的*，这意味着你无需信任网络中的任何人，却仍能确信不会发生任何无效交易（例如有人窃取你的比特币）。为了实现这一点，中本聪发明了工作量证明机制，通过该机制达成
    *分布式共识*，使比特币网络就一套规定交易有效性的规则达成一致。这些规则基于数学，特别是密码学。


    要理解比特币的分布式共识，了解比特币网络的一些基本构成至关重要。比特币网络的用户大致可分为两组。第一组是更广泛的群体，由发送和接收比特币的普通用户组成；第二组是较小的群体，由
    *矿工* 组成，他们的工作是验证交易并将其打包成区块，然后附加到比特币区块链上。理论上，任何人都可以成为矿工，从而为比特币的分布式共识做出贡献。


    矿工有切实的激励继续执行挖矿新块的工作。每当矿工成功挖出一个新区块，他们就能获得 *区块奖励*。区块奖励是预先设定的比特币数量，这些比特币在新区块中产生并直接发送给矿工。这种特殊类型的交易被称为
    *Coinbase 交易*。目前，每个新区块会生成 12.5 个比特币并直接发送给矿工。区块奖励每产生 210,000 个区块减半一次。除了区块奖励，区块的矿工还能获得该区块中包含的所有
    *交易手续费*。每一笔比特币交易都包含一笔交易手续费，由发送比特币的用户设定并支付。设定的手续费越高，交易在比特币区块链上被确认的速度就越快，因为矿工有更大的动力将其打包进自己的区块。


    接下来，我们将逐步解析比特币作为一种货币，在无中央银行或政府的情况下如何运作。


    ## 比特币如何运作


    比特币作为货币的运作过程可以抽象为五个步骤。


    ### 第一步：创建新交易


    爱丽丝想为她购买的新车向鲍勃发送 5 个比特币。通常情况下，如果爱丽丝使用法币（如美元），她的银行会将资金转移到鲍勃的银行。爱丽丝的银行会从她的账户中扣除这笔钱，而钱会出现在鲍勃的银行账户中。然而，使用比特币时没有银行，因此转移比特币的过程截然不同。让我们来看看它是如何发生的。


    首先，每个比特币用户都有一个 *私钥*，该私钥必须保持个人私密。私钥用于签署用户发起的所有交易。这是比特币的重要组成部分，因为在没有银行的情况下，它充当了用户控制自己资金的机制。每个用户在发送比特币时，都会使用自己的私钥来验证其对比特币的所有权。换句话说，这个私钥用于解锁用户的比特币。如果私钥丢失或被盗，用户将失去对其比特币的访问权限。


    *私钥* 是一个由 64 字符组成的随机十六进制数（请注意，这不同于区块的数字指纹）。没有一个中央数据库来存储所有现有的私钥。如果你担心有人可能生成与你正在使用的相同的私钥——别担心！可用的私钥数量为
    `2²⁵⁶` 个，比我们宇宙中的原子数还要多。有人随机生成与你相同的私钥的概率，比你此刻走出门被一架掉落的钢琴砸死的概率还要低。


    *公钥* 是通过椭圆曲线密码学（一种高级密码学方法）从私钥生成的。这个公钥随后会被进行哈希和编码处理，为每个用户创建一个唯一的 *比特币地址*。比特币地址是公开的，因为它是你接收比特币的地址。在我们的例子中，鲍勃必须将自己的比特币地址提供给爱丽丝（表
    16-2）。


    | 私钥 | `e9873d79c6d87dc0fb6a5778633389f4453213303da61f20bd67fc233aa33262` |

    | 比特币地址 | `1BoatSLRHtKNngkdXEeobR76b53LETtpyT` |


    爱丽丝通过使用她的私钥创建一笔比特币交易的 *加密签名* 来验证她对 5 个比特币的所有权。这个加密签名作为证据，证明爱丽丝确实向鲍勃发送了属于她的 5 个比特币。任何矿工都可以通过使用爱丽丝的公钥验证交易数据，来确认这笔交易确实是爱丽丝签署的。因此，爱丽丝永远不需要分享她的私钥。


    一旦爱丽丝签署交易，她的 *比特币客户端*（爱丽丝用于处理比特币支付的软件）就会通过 *Gossip 协议* 将这笔包含发送给鲍勃信息的比特币交易广播给比特币矿工。

