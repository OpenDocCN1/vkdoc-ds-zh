    \ The goal of a security system is to deter incursions by rendering the cost of\
    \ breaking into the system greater than the potential payoff.\n\n### Optimization\n\
    \nThere are numerous ways in which database systems can be optimized to use less\
    \ space and to return or update information more quickly. One way is to design\
    \ more efficient queries. For example, if you wanted to know how many individuals\
    \ lived in California and owned a python, it’s faster to search through a couple\
    \ of thousand python owners for California residents than to look through millions\
    \ of California residents for python owners.\n\nAnother area in which databases\
    \ can be optimized, especially for space, is redundancy. Data is said to be integrated\
    \ when redundancy among information is removed. It is wasteful, for example, to\
    \ have a patient’s name, insurance plan, and address written on every piece of\
    \ paper within his or her file. Integrated data implies that such repetition is\
    \ removed and kept in only one table in the case of relational databases.\n\n\
    Above most other considerations, database design must be intelligent. It should\
    \ reflect the things you need the fastest or update the most. Otherwise, regardless\
    \ of how well queries are written or what tools are used, a flawed database design\
    \ will be suboptimal and result in wasted time, money, and space. You should only\
    \ store the information you need, and you should organize it in a logical way\
    \ that keeps related information together. The way in which you store your information\
    \ should be determined by how you expect to use it later."
  trans: '

    ### 安全性


    数据库安全漏洞正日益频繁地发生。任何网站的用户都需要一定程度的保护，而公司必须确保其数据的安全。


    `DBMS`通过以下两种方式保护数据，防止未经授权的访问和不恰当的修改（从而维护数据的*完整性*）：


    -   *自主控制*：在这种模型中，每个用户都被授予对数据库中不同对象的适当访问权限。自主控制通常是两种控制类型中更为灵活的一种。

    -   *强制控制*：在强制控制下，数据库中的每个对象都被分配一个安全级别，每个用户也被赋予一个许可级别。用户只能访问其许可级别内的数据对象集合。


    本质上，`DBMS`可以相应地标记用户和数据，以确保任何未经授权的人都无法访问或操纵私有数据。作为额外的检查，`DBMS`会记录事务、事务时间以及发起请求的用户。这些日志可用于追踪可疑活动（参见第
    12 章）。


    可能会出现一些通过此处描述的控制系统似乎无法立即解决的复杂情况，尽管`DBA`可以使用`DBMS`和其他工具来防范它们。一个例子涉及到信息从“有”到“无”的流动。例如，可能会出现这样一种情况：一个拥有更高许可级别的用户以某种方式修改数据，从而使一个较低许可级别的用户能够访问该数据。这种信息流动必须受到控制。


    另一个问题与*干扰*有关，这是统计数据库面临的一个难题。`MyAppoly`可能使用统计数据库，这些数据库不会向用户提供关于其他用户的特定信息，但会提供关于一个用户群体的汇总统计数据。那些不愿意让他人知道其薪资、年龄或其他个人指标具体信息的个人用户，如果这些信息仅以统计数据的形式匿名访问时才可见，他们可能会更愿意分享信息。一个问题是，特定的筛选操作可能允许某人推断出关于特定用户的信息，这是不应该被允许的。例如，如果你请求剑桥所有蟒蛇宠物主人的平均薪资，但只有一个人符合这个描述，那么请求返回的平均薪资将是一个人的薪资。`DBMS`应该防止这种情况发生。


    *数据加密*是一种用于保护存储在互联网上或通过互联网传输的数据的方法（第 12 章）。重要或敏感的信息，例如社会安全号码或信用卡信息，应始终通过限制访问和加密信息两种方式进行保护。


    总而言之，存在`DBMS`和其他工具来保护数据。没有完美的解决方案，这就是安全存在风险的原因。安全系统的目标是通过使侵入系统的成本大于潜在收益来阻止入侵。


    ### 优化


    有多种方法可以优化数据库系统，以占用更少的空间并更快地返回或更新信息。一种方法是设计更高效的查询。例如，如果你想了解有多少人居住在加利福尼亚州并拥有蟒蛇，那么在几千名蟒蛇主人中搜索加利福尼亚州居民，比在数百万加利福尼亚州居民中查找蟒蛇主人要快得多。


    数据库可以优化的另一个领域（尤其是在空间方面）是冗余。当信息之间的冗余被消除时，数据被称为是集成的。例如，将患者的姓名、保险计划和地址写在文件中的每一张纸上是很浪费的。集成数据意味着这种重复被消除，并且在关系型数据库的情况下仅保存在一个表中。


    除了大多数其他考虑因素之外，数据库设计必须智能化。它应该反映出你需要最快访问或最频繁更新的内容。否则，无论查询编写得多么好，或者使用了什么工具，有缺陷的数据库设计都将不是最优的，并会导致时间、金钱和空间的浪费。你应该只存储你需要的信息，并且应该以逻辑方式组织它，使相关信息保持在一起。你存储信息的方式应由你预期之后如何使用它来决定。

