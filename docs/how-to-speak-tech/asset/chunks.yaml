- fmt: '# Ethics of AI


    AI models inadvertently capture and exacerbate discriminatory biases present in
    society. In 2015, Google Photos tagged multiple photos of two black people as
    “gorillas,” which led to an uproar from many users on Twitter and forced Google
    to issue a public apology for the mistake. While the exact cause was not made
    public, we can speculate that the training data had an insufficient number of
    examples of black people for the model to learn them accurately, or that the model
    was not able to capture differences between black humans and gorillas. It is also
    possible that training data were inaccurately labeled, that is, pictures of gorillas
    were actually labeled as black people, so naturally the model learned from that.
    Google might have been able to prevent this mistake by using a more diverse and
    accurate dataset and a better model. They could have performed more thorough testing
    by feeding a representative variety of images into the photo tagger and making
    sure the outputs were sensible. As a potential creator of new AI technology, you
    should be mindful to anticipate biases in the data and actively remove them while
    training a model. It is also crucial for the team that is building AI to be composed
    of diverse individuals, including but not limited to different genders, ethnicities,
    and races. This makes it all the more likely that inconsistencies and biases in
    data are accounted for since each member of the team brings a unique lens of society
    with them.


    ## AI in Practice


    AI is a fast-moving field where new tools and techniques are being developed all
    the time, so we might expect this list to evolve rapidly. Many of these tools
    and techniques are publicly available with documentation and tips on getting started;
    with just some programming experience, you can train a simple machine learning
    model on your personal laptop in less than an hour. This makes it incredibly simple
    to embed AI into your own product since you do not have to reinvent the wheel.


    Table [15-2](#321739_2_En_15_Chapter.xhtml#Tab2) shows some of the tools people
    use in 2019 to actually incorporate AI into their products.


    **Table 15-2.** Tools to Integrate AI into Products


    | Tool | Creator | Use |

    | --- | --- | --- |

    | `Tensorflow` | Google | Build and train complex neural networks in `Python`
    |

    | `PyTorch` | Facebook | |

    | `Caffe` | Berkeley AI Research | |

    | `Caffe2` (merged into `PyTorch` as of March 2018) | Facebook | |

    | `Scikit-learn` | Open source | Build and train machine learning models in `Python`
    and some simple neural networks |

    | `Numpy` | Open source | Store and manipulate large amounts of data and feature
    vectors. One of the most compatible data formats for feeding into `Tensorflow`
    and `PyTorch` |

    | `ConvNetJS` | Andrej Karpathy (previous PhD at Stanford) | Build and train neural
    networks in a web browser using `JavaScript` |


    ## Conclusion


    AI is a powerful tool to build products with predictive capabilities that impact
    millions of people. From suggesting songs to detecting cancer, it is widely applicable
    to a range of scenarios where large amounts of data are available. Nowadays, it
    is easy for someone with programming experience and access to a fast computer
    to train a model on their own dataset without much mathematical background. This
    means we will see more exciting applications of AI in the future. And we must
    be aware of potential biases in the datasets that determine what the models learn
    since ultimately they will affect.


