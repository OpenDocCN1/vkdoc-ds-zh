- fmt: '# Release Management


    How are iterations delivered to the customer? The process for releasing or *shipping*
    code to the public must be well thought out to minimize the risk of a buggy or
    faulty update. To *deliver* and *ship* code mean the same thing—that is, to make
    that code go “live” for the customers’ use. There are three main environments
    or servers, as follows.


    The first is the *development environment*, where all the coding and testing takes
    place. A new feature exists on its own server and cannot be accessed by the public.
    Therefore, any mistakes are localized to the company, at worst only slowing down
    the development process. Code in the development environment does not affect the
    “live” version of the site.


    When the iteration is ready to ship (in the form of an update or new version),
    the new code must be uploaded to the *staging environment*, a different server
    that has an exact copy of the live application. Not all products use a staging
    server, but testing in the staging environment serves as another check to confirm
    that the new feature is ready for final delivery.


    If the code seems to work perfectly in the staging environment, the update is
    ready for *deployment*. It gets moved to the production environment, which serves
    the public site and responds to all the site visitors. The release process is
    designed to ensure this server is only updated with clean code that works correctly.
    Of course, no process is perfect, and sometimes bugs creep in.


    ## Conclusion


    After discussing with your team, you decide to implement one of the development
    models discussed in this chapter. You also work with your engineers to develop
    an effective release management system, implementing several checks for each step
    of the release. Before introducing new features to customers, however, it is prudent
    to make sure they are bug-free and not going to create more chaos than they solve.
    Your next task is to learn how your team does just that.


    Footnotes [1](#321739_2_En_8_Chapter.xhtml#Fn1_source) [2](#321739_2_En_8_Chapter.xhtml#Fn2_source)


    # 9. Software Development: Debugging and Testing


    In 2009, Toyota faced allegations that some of its cars had sticky accelerator
    pedals and, in January 2010, recalled 4.1 million vehicles for repair. The defect
    was a *bug* or flaw in the company’s product. We can draw an analogy between Toyota’s
    product and that of any Internet company. Facebook, Google, and MyAppoly all have
    and will continue to have bugs, but great teams identify them in the development
    process before the product is released for customer use.


    It is unrealistic to expect that every line of code your team produces will work
    correctly the first time. Just as proofreading and editing written materials before
    publication is a critical part of the writing process, *debugging*, the process
    of removing errors, is an important step in the process of writing code. These
    errors include not only improper spelling and other syntax-related problems but
    also problems in the structure of the code or how code interacts with other code.
    Because your team and users will discover bugs in the product regularly, debugging
    is a continuous process that takes an unpredictable amount of time. As MyAppoly
    grows larger and involves a growing number of engineers, quickly identifying the
    source of a bug will become increasingly difficult. Understanding how your engineers
    approach debugging at a conceptual level will help you see how experimental and
    variable the process is.


    ## A Bug’s Life


    Simply put, a *bug* is an error. The unusual term has an interesting history.
    Back when computers were coded using punch cards, Grace Hopper, a famous computer
    scientist, noticed some unusual behavior. Upon investigation, she found a dead
    moth interfering with one of the punch cards—computer science’s first bug!


    Today, bugs are (unintentionally) created by programmers instead of by physical
    bugs, and not all bugs are simple to fix. There are two kinds of bugs: syntax
    bugs and semantic bugs.


    - *Syntax bugs* result from breaking the rules of the programming language. Your
    programmer might have forgotten a semicolon, misspelled a variable name, or tried
    to use a structure not provided by the programming language. These bugs are often
    easy to fix because a compiler, interpreter, or another tool can find them. If
    code were a Microsoft Word document, these errors could be caught by a spelling
    and grammar check.


    - *Semantic bugs* consist of two types. First, *runtime errors* cause a program
    to crash and stop its execution. An example would be if the program tried to open
    a file that didn’t exist. Second, *logical errors*, which do not disrupt the completion
    of a program, produce unexpected results, such as adding something instead of
    subtracting it. If you contradict yourself in an essay, you commit an error in
    logic, but as long as the grammar and spelling are correct, spellcheck will not
    flag it. Therefore, semantic errors are more difficult to catch, isolate, and
    resolve than are syntax errors.


    Although programmers create all bugs, they are not all due to negligence. Some
    bugs emerge because code is updated that is no longer compatible with prior logic.
    Some bugs emerge because two engineers merge their code, and the two new features
    do not work perfectly together. Just because a bug exists does not mean someone
    has to be blamed.


    ## The Debugging Process


    The six-step debugging process laid out in this section is a distillation of the
    “13 Golden Rules of Debugging” of Grötker and his Synopsys colleagues.[^(11)](#fn11)
    These six steps are not canonical, but you may be confident when engineers on
    your team say they are “debugging” an issue that they are following some variant
    of these steps.


    ### 1. Track the Problem


    To manage the errors of MyAppoly effectively, keeping track of all the bugs is
    a great start. Maintaining proper documentation on every bug you encounter can
    help you resolve future issues more rapidly. Additionally, tracking bugs can help
    your entire team stay in sync about problems and their solutions. Many out-of-the-box
    tracking systems operate as follows. When a bug is found, an issue or “ticket”
    is created that describes the bug. Its status remains *open* until it is resolved,
    in which case the status is switched to *closed*. Several intermediary statuses
    exist, such as *in progress*, and tickets can be assigned to different team members
    as a delegation method.


    What constitutes proper documentation? Because any program input can influence
    bugs, everything that might have contributed to the problem should be recorded.
    This includes things like the particular action the user took, the operating system,
    browser, actual behavior, expected behavior, and pretty much anything else you
    can think of that might be relevant. These variables will either be *static*—properties
    related to configuration and compatibility that don’t change, such as the operating
    system and browser—or *dynamic*—referring to aspects of memory and network that
    change frequently, such as how many other programs were running at the same time.


    ### 2. Reproduce the Problem


    After you learn of a bug and record its details, the next step is to reproduce
    the problem. This involves re-creating the environment, as well as checking whether
    the behavior matches the one reported. This process is somewhat manual at first,
    but you want to re-create the program failure so that you can use the same test
    to confirm whether you have properly fixed it.'
