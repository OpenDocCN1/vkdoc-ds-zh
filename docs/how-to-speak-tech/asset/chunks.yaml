  trans: '

    ### 网页日志


    当用户访问一个网站时，浏览器会向托管该网站的服务器发送请求。服务器在发回网页之前，会更新其日志，记录诸如“用户 X 于中午 12:00 访问了页面”的信息。这就是所谓的*网页日志*。其中一个缺点是，任何服务器的请求都会被记录，甚至连搜索引擎的爬虫也不例外。如果你只想监控人类活动，这可能不是最佳方法。此外，难以识别**独立访客**，这会使营销分析变得复杂。你不想重复计算同一个人，否则数据就会出错。最后，你还记得*缓存*这个术语吗？浏览器向服务器发送请求并接收包含所有图片和其他资源的页面需要时间。因此，为了提高效率，浏览器会在本地保存网站的副本，以尽量减少与服务器的交互。当服务器未被使用时，网页日志不会被触发，因此所有在网页缓存版本上的活动都不会被记录。这是**服务器端数据收集**的一个例子（用于存储数据的软件位于服务器上）。


    ### 网络信标


    如果你收到过一封电子邮件，其中的图片被暂时隐藏，直到你授权邮件客户端显示它们，那你可能对网络信标并不陌生。为什么呢？网络信标通常是 1x1 像素的透明图片，它们托管在与网页所在服务器不同的独立服务器上。回想一下，要加载一张图片，浏览器必须发出额外的服务器请求。当浏览器从第三方服务器请求这个网络信标时，它们的行为就会被记录下来。使用第三方服务器让你在想要收集的数据方面拥有更多灵活性（要么包含网络信标，要么不包含），并且允许你跨多个网页聚合数据——也就是说，你可以从多个网站发起对这个网络信标的请求，所有这些请求都必须到达同一个服务器去获取那个
    1x1 像素的图片。因此，即使请求来自不同的来源，所有数据都存储在同一个服务器上。话虽如此，由于这种方法依赖于图片请求，任何屏蔽图片请求的工具都会阻止你收集有用的数据。垃圾邮件发送者利用这一点来验证你的电子邮件账户是否仍然活跃，因此一些邮件客户端会禁用图片，直到你验证了它们的真实性。一些服务也使用网络信标来实现*已读回执*功能。


    ### JavaScript 标签


    JavaScript 标签改变了网络分析的本质。如果你还记得我们关于 JavaScript 的讨论，这种语言拥有**事件监听器**，它们会等待特定事件（例如点击按钮）发生后才执行相应的代码。就像
    JavaScript 监听器可能等待用户点击按钮后才触发显示弹出窗口的代码一样，JavaScript 可以利用“页面加载完成”这个事件作为触发点来执行代码。如果你能让这段代码收集关于用户、时间以及网页描述的信息，你就可以把
    JavaScript 当作一个分析工具来使用。而这正是已经发生的情况。只要你包含了当页面加载时就会触发的 JavaScript 代码行，就可以了。即使你的页面被缓存了，当用户查看它时，JavaScript
    代码也会执行，因此在这一点上它胜过了网页日志。你还可以在 JavaScript 代码中添加特殊的**标签**，以便之后更容易地过滤数据。


    这个过程比这个简单的解释要稍微复杂一些，因为**Cookie**可以发挥重要作用。当你访问一个网站时，它可能会在你的浏览器上放置一个名为 Cookie 的东西，用来存储关于你的信息、你点击了什么以及其他相关信息。下次你访问这个网站时，它会查找该网站的
    Cookie，如果找到了，它就知道你以前来过这个网站，并可以利用存储的信息为你定制页面。如果 Cookie 存储了你正在浏览的鞋子的信息，那么下次你访问时，那些鞋子可能会出现在页面顶部。回到分析上：JavaScript
    代码使用 Cookie 来记录活动。它会在你的浏览器上存储一个 Cookie，并且在代码的其他部分执行完毕后，信息随后被传递到服务器进行存储。这些服务器要么由公司自己拥有，要么由第三方分析提供商拥有。


    以前，分析工作完全由公司内部的 IT 团队管理，而现在，已经出现了完全以帮助他人进行分析为唯一目的的完整公司。这些公司提供一些 JavaScript 代码供其他人放在他们的网站上，然后他们负责处理剩下的事情。他们提供的价值还体现在可视化工具的形式上，以帮助你理解数据。Google
    通过 **Google Analytics** 免费提供分析服务，其工作原理是将数据存储在日志文件中。每隔几小时，Google 会处理这些日志文件，然后使用户能够在其
    Analytics 网站上查看数据。


    这种方法的好处很多，最主要的是**易用性**。只需粘贴分析公司提供的代码，你就可以拥有一个完整且正在运行的追踪和可视化系统。瞧！


    话虽如此，一些用户开始禁用 JavaScript，因此使用这种方法可以预期会有少量的数据丢失。另外，请务必记住，如果你使用第三方分析提供商（即，你不是自己构建和收集所有这些信息），那么你敏感的
    `MyAppoly` 数据将会落入他人之手。


    ### 数据包嗅探


    *数据包嗅探*本质上是在网站访问者和托管网站的 `MyAppoly` 服务器之间创建一个**中间人**。用户请求 `MyAppoly` 首页后，该请求会经过一个由软件和硬件组成的混合体，称为*数据包嗅探器*，在这里用户的请求信息被记录下来，然后再路由到服务器。当服务器用网页响应时，文件在路由回用户之前会再次经过数据包嗅探器。就是这样。一次经过获取用户数据，另一次经过获取网页信息。


    这种方法方便之处在于**无需在实际的源代码中输入额外的代码**，并且它可以轻松拦截发送到你服务器的所有请求，从而满足整个网站的需求。缺点在于实际的设置过程可能比较复杂，并且对网站缓存版本的请求不会被记录。你还必须小心使用数据包嗅探器，因为它们会拦截大量敏感信息，例如用户的密码和信用卡号。以尊重隐私的方式处理这些数据至关重要。


    ## 数据可视化


    数据显示的特定方式会影响你能得出的见解。因此，许多参与者都在努力让这个过程变得更加容易。因此，分析的下一阶段似乎不再是侧重于聚合，而是侧重于**可视化和处理**。


    *点击密度*（也称为*站点覆盖*）可以根据用户的点击内容，提供关于用户可能在想什么的见解。*热力图*的最终发展也实现了同样的目的。热力图是网页的彩色图像，用于根据鼠标移动指示用户正在查看的位置。深红色表示鼠标经常悬停的区域，而蓝色区域则是页面上鼠标很少到达的位置。


    分析不仅应该寻求回答*是什么*（例如，多少浏览量、多少注册量等等），还应该回答*为什么*。关注点已经重新转向任务，**漏斗图**成为可视化任务完成情况的流行方式。通过这种方式，公司可以清楚地看到在每个阶段有多少人流失。


    可视化类型的列表可以无限延伸，但主要观点是这些数据对公司非常有价值，他们正在寻找任何方法来理解它们。**呈现方式至关重要**。

