    # 结语


    区块链技术让我们能够构建去中心化且无需信任的网络，以全新方式将人与企业连接起来。区块链可用于创建无中央权威的网络，在降低管理成本的同时增强供应链安全性。区块链技术的发展方向，或许最有力地体现在中本聪在第一个比特币区块中留下的信息中：


    > *《泰晤士报》2009 年 1 月 3 日 财政大臣濒临第二次银行救助边缘*


    这条引用自 2009 年某期《泰晤士报》头条的信息，尖锐地批判了我们有时对中心化机构盲目信任的行为。当这些机构未能履行职责时，往往是普通用户为此付出代价——正如市民最终要为濒临倒闭的银行买单。区块链技术让我们能够构建功能完善的网络，同时规避与中央权威相关的风险。


    # 第十七章 虚拟现实与增强现实


    特别感谢 Khoi Le 参与撰写本章。


    叮。电梯门打开，眼前展开壮丽的天际线……然后你低头看去。你正站在一栋百层高楼的边缘。脚下，一块木板从你面前的边缘向外延伸六英尺。“走上去，”一个声音说道。尽管理智告诉你这很危险，你还是慢慢挪动脚步，一步一惊心地向前移动。当你走到木板边缘时，感到胃部一阵痉挛，几乎失去平衡。但你在四周呼啸的风声中稳住了身体。“从木板上跳下去，”那个声音说道。此时大多数人会因恐惧而僵在原地，拒绝跳下木板。你为什么要跳下去摔死呢？然而你知道自己此刻正身处虚拟现实之中，这一切都通过佩戴在脸上的头显设备看到。你身处教室，根本不可能受伤。你当然应该跳下木板。但你的双脚却因恐惧而无法移动。


    这个木板体验展示了*沉浸式媒体*的力量——它能欺骗你的大脑，让你相信计算机生成的数字内容就是真实的。*虚拟现实（VR）* 能创造出看似真实的完全数字化世界。与之密切相关的领域是*增强现实（AR）*，它能创建出令人信服的逼真数字对象，仿佛它们就是真实世界的一部分。VR
    和 AR 构成了许多人称之为“沉浸式媒体”的两端。


    为什么称之为“沉浸式”媒体？想象你正在意大利庞贝古城遗址中穿行。这些建筑在数千年前就已毁坏。幸运的是，你佩戴着增强现实头显。除了看到废墟之外，还有全息投影——根据历史研究还原的建筑数字复制品——叠加在废墟之上。由于这种体验是空间性的，且数字结构在正确的地形语境中叠加在现实世界上，它增强了你的现实感知。沉浸式媒体通过将看似真实的数字对象环绕在你周围，为你带来全新的体验。


    传统媒体是“扁平”媒体，是在纸张或屏幕上的平面体验。沉浸式媒体是空间性的——它们存在于三维空间中。你可以将沉浸式媒体想象为图 17-1 所示的谱系，从仅感知真实环境中真实物体的现实，到仅感知虚拟环境中虚拟物体的虚拟现实。


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig1_HTML.jpg](img/321739_2_En_17_Fig1_HTML.jpg)


    图 17-1。 现实-虚拟连续体，引自 Paul Milgram 1994 年的论文


    *混合现实（MR）* 是虚拟与现实之间的“混合”，涵盖了谱系中的其余部分。例如，人行道（现实世界）上的宝可梦（虚拟对象）就属于“混合现实”。相反，在虚拟客厅（虚拟世界）中感知到的真实椅子（真实物体）也属于“混合现实”。增强现实属于混合现实，因为它呈现了虚拟叠加层，即叠加在现实世界上的对象。想象一下，看着某人时，看到他们的名字悬浮在头顶上方。


    许多人还用总称 *XR* 来指代沉浸式媒体，其中 X 是“虚拟”“增强”“混合”或人们想到的任何其他词语的占位符，“R”代表“现实”。XR 释放了*体验*的潜能。正如互联网促进了*信息*的编目、分发和民主化，XR
    也承诺为*体验*带来同样的变革。学习海洋知识的学生可以潜入水下；外科医生、四分卫和警察可以在逼真的场景中进行训练；任何人都可以通过体验叙利亚难民、印度农村妇女或无家可归者的生活片段来获得同理心。VR/AR
    是一套新的媒体，通过它们我们可以体验连接、故事、娱乐和教育。


    在本章中，我们将通过定义 VR/AR 的五个领域来探索沉浸式媒体。首先，我们将探讨使空间体验如此独特的“新维度”。然后，我们将研究“沉浸式内容”，分析 VR/AR
    体验中存在的不同类型内容，并探索内容创作流程。了解内容之后，我们将看到当今的“硬件”如何通过追踪技术让我们消费这些内容。掌握了追踪原理，我们就能发现化身和虚拟人类如何在
    VR/AR 中代表“虚拟的你”。最后，我们将探讨人们如何通过“元宇宙”与虚拟环境互动。这五个部分将为你提供关于 VR/AR 所需了解的一切知识。


    ## 新维度


    要理解虚拟现实和增强现实的工作原理，我们必须深入探究沉浸式媒体的核心：3D。本节将首先探讨立体视觉，即人类视觉感知三维空间的方式。然后我们将了解计算机如何创建三维场景，以及技术的局限性如何影响
    VR/AR 体验。

    '
- fmt: '### Stereoscopic Vision


    If you close one eye and lift your finger to your face, then close the other eye
    instead, it appears as though your finger is at a different position. Each eye
    sees the world from a slightly different perspective. Your brain combines these
    two images to give you a unified image with depth information. Depth information
    informs you how far away an object is, which allows you to perceive the three
    dimensions. The process by which your eyes see two images and your brain combines
    them is called *stereoscopic vision*. Stereoscopic vision, or “stereo” for short,
    is what makes classic 3D movies seem like they pop out at you from a flat screen.
    The red and blue glasses show you slightly different perspectives on the same
    image, giving you depth information. Similarly, VR/AR headsets draw a slightly
    different image to each of your eyes to provide you with the perception of depth
    and space in a process called *rendering*.


    Rendering takes place in the *graphics processing unit*, also known as a *GPU*,
    which is a specialized processor in computers that focuses on drawing things onto
    the screen. GPUs can only draw on the screen so fast, so as you move your head
    around, it’s scrambling to render the scene for you in real time.


    Although you cannot consciously tell, your eyes are incredibly quick and can catch
    images that display for durations as short as one two-hundredth of a second. That
    means that a GPU needs to be able to keep up with your visual system; if a GPU
    cannot render new views to the screen fast enough, your visual system becomes
    confused. When the GPU can’t keep up, your eyes see old images that are lagging
    behind. If you were previously looking around, but now are not moving, your eyes
    are still seeing moving images. Conversely, if you were previously not moving,
    but now are looking around, your eyes are seeing stationary images. So your vestibular
    system—responsible for balance and motion—tells your brain something different
    from your visual system. Much like seasickness, this conflict between your vestibular
    system and visual system can lead to sickness. The VR/AR version of nausea is
    known as *simulator sickness*.


    Depending on the complexity of the images, GPUs draw at a certain speed, known
    as *frames per second*, or `FPS`. A GPU running at `60 FPS` means that the GPU
    can draw 60 different views every second. A GPU’s `FPS` directly affects the VR/AR
    experience. To ensure that users do not get sick, developers typically aim for
    `60 FPS` on smaller GPUs in mobile devices. `60 FPS` is minimally comfortable
    but is the fastest rate at which most small GPUs can draw. On computers where
    the GPUs are larger, developers have the luxury to aim for at least `90 FPS` to
    be sure that all users have a comfortable VR/AR experience.


    In a VR/AR headset, known as a *head-mounted display* (`HMD`), each eye is shown
    a different image to enable stereoscopic vision and allow users to perceive depth
    and space. While a typical phone or computer only has to display one image at
    a time, an `HMD` has to show two different images simultaneously. Because of this
    dual display, the GPU must draw two versions of the scene every second, halving
    its efficiency. Thus, for you to have a bearable VR/AR experience, the GPU needs
    to be twice as powerful. Due to advancements in the AI industry, which relies
    on GPUs for intense calculations, only recently have sufficiently powerful GPUs
    become cheap enough to open the gate to consumer VR/AR. Even so, when building
    VR/AR content, one must take the necessary precautions to optimize the rendering
    pipeline to avoid simulator sickness.


    ## Immersive Content


    The two primary forms of VR/AR content are computer graphics and video. Computer
    graphics are visuals created by the computer. Video is just a recording shown
    in a 180-degree hemisphere or 360-degree sphere, in which you can look around.
    We’ll explore how to make each and what each modality is useful for.


    ### Computer Graphics Content


    In computer graphics, “3D models” are described by a few need-to-know terms. *Meshes*
    are like wire sculptures that serve as the frame for a 3D model. Meshes are composed
    of faces known as *polygons*. Each 3D model has a “polygon count,” or *poly-count*,
    which shows the number of polygons in the model. Models with high poly-counts
    are consequently more detailed, making GPUs work harder, which may lead to rendering
    at a lower `FPS`. These *FPS drops* cause lag and, consequently, simulator sickness.
    To combat this phenomenon, many VR/AR artists use a *low-poly* style, seen in
    Figure [17-2](#321739_2_En_17_Chapter.xhtml#Fig2), which uses a very low polygon
    count. This makes it easier for the GPU to render and also contributes a unique
    look. The earliest computer VR setups had to use low-poly environments made of
    wireframe cubes, which looked like they had no surfaces.


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig2_HTML.jpg](images/321739_2_En_17_Chapter/321739_2_En_17_Fig2_HTML.jpg)


    Figure 17-2. Google Daydream Home uses a low-poly art style^([^(36)](#fn36))


    To control what a model’s surfaces look like, artists use materials. Materials
    wrap around the wire sculpture, like a skin that covers the sculpture’s frame.
    Materials are typically composed of one or more textures, which dictate the pattern
    and color on the skin, and one or more shaders, which control how the material
    will show up on screen. For example, a reflective shader would display light emanating
    off of the model.


    ### How to Make 3D Models


    Now that you know that the mesh, polygons, and materials comprise a 3D model,
    we can explore two common ways of creating 3D models.


    The first method we’ll look at is manually creating 3D models. 3D artists use
    very complex 3D modeling software to arrange each polygon in 3D space by hand.
    They also create the materials, textures, and shaders that will alter the appearance
    of the mesh. This is an incredibly labor-intensive process that requires expertise
    and an eye for detail. In order to optimize models for VR/AR, 3D artists need
    to be especially cognizant of the poly-count.


    ### 3D Models by Photogrammetry


    Another method for creating 3D models is *photogrammetry*. You take photos of
    the desired subject, say a statue, from multiple different angles. Then, the photogrammetry
    software can infer the shape of the object. Photogrammetry is useful for getting
    detailed models of real-world objects that would take too long or be unfeasible
    to model with the desired level of detail.


    ### A Brief Talk About Animation


    Once you have made the model, you might want to *animate* it (a static puppy wouldn’t
    be much fun!). Most animation software uses *keyframes*, which are certain important
    positions that the model will move between. For example, if you have a waving
    arm, you can make a keyframe of the arm to be leaning to the right. Then, in the
    second keyframe, you can set the arm to be leaning to the left. The animation
    software figures out how to get the arm from the first keyframe (leaning to the
    right) to the second keyframe (leaning to the left), so the arm will go from right
    to left, appearing to wave. Animating is extremely complicated for complex models
    with intricate systems of movement.


    ### 3D Models with Animation by Volumetric Capture


    An alternative to animation is *volumetric capture*, which is similar to a dynamic
    version of photogrammetry. Volumetric capture typically uses over one hundred
    cameras simultaneously taking photos, so it can handle moving objects and people
    in order to create a sort of “3D video.” Volumetric capture is great for recording
    predefined sequences such as a dance routine.'
  raw: '### Stereoscopic Vision


    If you close one eye and lift your finger to your face, then close the other eye
    instead, it appears as though your finger is at a different position. Each eye
    sees the world from a slightly different perspective. Your brain combines these
    two images to give you a unified image with depth information. Depth information
    informs you how far away an object is, which allows you to perceive the three
    dimensions. The process by which your eyes see two images and your brain combines
    them is called *stereoscopic vision*. Stereoscopic vision, or “stereo” for short,
    is what makes classic 3D movies seem like they pop out at you from a flat screen.
    The red and blue glasses show you slightly different perspectives on the same
    image, giving you depth information. Similarly, VR/AR headsets draw a slightly
    different image to each of your eyes to provide you with the perception of depth
    and space in a process called *rendering* .


    Rendering takes place in the *graphics processing unit*, also known as a *GPU*,
    which is a specialized processor in computers that focuses on drawing things onto
    the screen. GPUs can only draw on the screen so fast, so as you move your head
    around, it’s scrambling to render the scene for you in real time.


    Although you cannot consciously tell, your eyes are incredibly quick and can catch
    images that display for durations as short as one two-hundredth of a second. That
    means that a GPU needs to be able to keep up with your visual system; if a GPU
    cannot render new views to the screen fast enough, your visual system becomes
    confused. When the GPU can’t keep up, your eyes see old images that are lagging
    behind. If you were previously looking around, but now are not moving, your eyes
    are still seeing moving images. Conversely, if you were previously not moving,
    but now are looking around, your eyes are seeing stationary images. So your vestibular
    system—responsible for balance and motion—tells your brain something different
    from your visual system. Much like seasickness, this conflict between your vestibular
    system and visual system can lead to sickness. The VR/AR version of nausea is
    known as *simulator sickness* .


    Depending on the complexity of the images, GPUs draw at a certain speed, known
    as *frames per second*, or FPS. A GPU running at 60 FPS means that the GPU can
    draw 60 different views every second. A GPU’s FPS directly affects the VR/AR experience.
    To ensure that users do not get sick, developers typically aim for 60 FPS on smaller
    GPUs in mobile devices. 60 FPS is minimally comfortable but is the fastest rate
    at which most small GPUs can draw. On computers where the GPUs are larger, developers
    have the luxury to aim for at least 90 FPS to be sure that all users have a comfortable
    VR/AR experience.


    In a VR/AR headset, known as a *head-mounted display* (HMD), each eye is shown
    a different image to enable stereoscopic vision and allow users to perceive depth
    and space. While a typical phone or computer only has to display one image at
    a time, an HMD has to show two different images simultaneously. Because of this
    dual display, the GPU must draw two versions of the scene every second, halving
    its efficiency. Thus, for you to have a bearable VR/AR experience, the GPU needs
    to be twice as powerful. Due to advancements in the AI industry, which relies
    on GPUs for intense calculations, only recently have sufficiently powerful GPUs
    become cheap enough to open the gate to consumer VR/AR. Even so, when building
    VR/AR content, one must take the necessary precautions to optimize the rendering
    pipeline to avoid simulator sickness.


    ## Immersive Content


    The two primary forms of VR/AR content are computer graphics and video. Computer
    graphics are visuals created by the computer. Video is just a recording shown
    in a 180-degree hemisphere or 360-degree sphere, in which you can look around.
    We’ll explore how to make each and what each modality is useful for.


    ### Computer Graphics Content


    In computer graphics, “3D models” are described by a few need-to-know terms. *Meshes*
    are like wire sculptures that serve as the frame for a 3D model. Meshes are composed
    of faces known as *polygons*. Each 3D model has a “polygon count,” or *poly-count*,
    which shows the number of polygons in the model. Models with high poly-counts
    are consequently more detailed, making GPUs work harder, which may lead to rendering
    at a lower FPS. These *FPS drops* cause lag and, consequently, simulator sickness.
    To combat this phenomenon, many VR/AR artists use a *low-poly* style, seen in
    Figure [17-2](#321739_2_En_17_Chapter.xhtml#Fig2), which uses a very low polygon
    count. This makes it easier for the GPU to render and also contributes a unique
    look. The earliest computer VR setups had to use low-poly environments made of
    wireframe cubes, which looked like they had no surfaces.


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig2_HTML.jpg](images/321739_2_En_17_Chapter/321739_2_En_17_Fig2_HTML.jpg)


    Figure 17-2.


    Google Daydream Home uses a low-poly art style^([^(36)](#fn36))


    To control what a model’s surfaces look like, artists use materials. Materials
    wrap around the wire sculpture, like a skin that covers the sculpture’s frame.
    Materials are typically composed of one or more textures, which dictate the pattern
    and color on the skin, and one or more shaders, which control how the material
    will show up on screen. For example, a reflective shader would display light emanating
    off of the model.


    ### How to Make 3D Models


    Now that you know that the mesh, polygons, and materials comprise a 3D model,
    we can explore two common ways of creating 3D models.


    The first method we’ll look at is manually creating 3D models. 3D artists use
    very complex 3D modeling software to arrange each polygon in 3D space by hand.
    They also create the materials, textures, and shaders that will alter the appearance
    of the mesh. This is an incredibly labor-intensive process that requires expertise
    and an eye for detail. In order to optimize models for VR/AR, 3D artists need
    to be especially cognizant of the poly-count.


    ### 3D Models by Photogrammetry


    Another method for creating 3D models is *photogrammetry* . You take photos of
    the desired subject, say a statue, from multiple different angles. Then, the photogrammetry
    software can infer the shape of the object. Photogrammetry is useful for getting
    detailed models of real-world objects that would take too long or be unfeasible
    to model with the desired level of detail.


    ### A Brief Talk About Animation


    Once you have made the model, you might want to *animate* it (a static puppy wouldn’t
    be much fun!). Most animation software uses *keyframes*, which are certain important
    positions that the model will move between. For example, if you have a waving
    arm, you can make a keyframe of the arm to be leaning to the right. Then, in the
    second keyframe, you can set the arm to be leaning to the left. The animation
    software figures out how to get the arm from the first keyframe (leaning to the
    right) to the second keyframe (leaning to the left), so the arm will go from right
    to left, appearing to wave. Animating is extremely complicated for complex models
    with intricate systems of movement.


    ### 3D Models with Animation by Volumetric Capture


    An alternative to animation is *volumetric capture* , which is similar to a dynamic
    version of photogrammetry. Volumetric capture typically uses over one hundred
    cameras simultaneously taking photos, so it can handle moving objects and people
    in order to create a sort of “3D video.” Volumetric capture is great for recording
    predefined sequences such as a dance routine.'
  trans: '

    ### 立体视觉


    如果你闭上一只眼睛，将手指举到面前，然后换另一只眼睛闭上，手指的位置看起来仿佛发生了改变。每只眼睛从略微不同的角度观察世界。你的大脑会将这两幅图像结合起来，为你提供一个包含深度信息的统一图像。深度信息告诉你物体有多远，这使你能够感知三维空间。你的眼睛看到两幅图像，然后大脑将其合并的过程，被称为*立体视觉*。立体视觉，简称“立体”，正是让经典
    3D 电影看起来像是从平面屏幕中向你弹出来的原因。红蓝眼镜会向你展示同一幅图像中略微不同的视角，从而为你提供深度信息。类似地，VR/AR 头戴设备会为你的每只眼睛绘制一幅略有不同的图像，以提供你对深度和空间的感知，这一过程被称为*渲染*。


    渲染发生在*图形处理单元*（也称为*GPU*）中，它是计算机中专注于在屏幕上绘制图像的专用处理器。GPU 在屏幕上绘制的速度有限，因此当你转动头部时，它会争分夺秒地为你实时渲染场景。


    虽然你无法有意识地察觉，但你的眼睛速度极快，能够捕捉到持续时长仅为两百分之一秒的图像。这意味着 GPU 需要能够跟上你的视觉系统；如果 GPU 无法足够快地将新视图渲染到屏幕上，你的视觉系统就会混乱。当
    GPU 跟不上时，你的眼睛会看到滞后的旧图像。如果你之前正在环顾四周，但现在静止不动，你的眼睛仍然会看到移动的图像。相反，如果你之前没有移动，但现在正在环顾四周，你的眼睛会看到静止的图像。因此，你的前庭系统（负责平衡和运动）告诉大脑的信息，与你的视觉系统告诉大脑的信息不同。就像晕船一样，前庭系统和视觉系统之间的这种冲突会导致不适。在
    VR/AR 中，这种恶心感被称为*模拟器晕动症*。


    根据图像的复杂程度，GPU 会以一定的速度进行绘制，这个速度被称为*每秒帧数*，即`FPS`。一个以`60 FPS`运行的 GPU 意味着它每秒可以绘制 60
    个不同的视图。GPU 的`FPS`直接影响 VR/AR 体验。为了确保用户不会感到不适，开发者通常会将移动设备中较小 GPU 的目标设定为`60 FPS`。`60
    FPS`是最低舒适度，但也是大多数小型 GPU 能够绘制的最高速率。在 GPU 更大的计算机上，开发者可以奢侈地将目标设定为至少`90 FPS`，以确保所有用户都能获得舒适的
    VR/AR 体验。


    在 VR/AR 头戴设备（被称为*头戴式显示器*（`HMD`））中，每只眼睛看到的是不同的图像，以实现立体视觉，并让用户能够感知深度和空间。虽然典型的手机或电脑一次只需显示一幅图像，但`HMD`必须同时显示两幅不同的图像。由于这种双屏显示，GPU
    必须每秒绘制场景的两个版本，这使其效率减半。因此，要让你获得可接受的 VR/AR 体验，GPU 的性能需要强大一倍。由于依赖 GPU 进行密集计算的人工智能行业取得了进步，直到最近，足够强大的
    GPU 才变得足够便宜，从而打开了消费级 VR/AR 的大门。即便如此，在构建 VR/AR 内容时，也必须采取必要的预防措施来优化渲染管线，以避免模拟器晕动症。


    ## 沉浸式内容


    VR/AR 内容的两种主要形式是计算机图形和视频。计算机图形是由计算机创建的视觉效果。视频则是在 180 度半球或 360 度球体内播放的录制内容，你可以在其中环顾四周。我们将探讨如何制作每种内容，以及每种形式各自的用途。


    ### 计算机图形内容


    在计算机图形学中，“3D 模型”由几个需要了解的关键术语来描述。*网格*类似于金属丝雕塑，作为 3D 模型的框架。网格由称为*多边形*的面组成。每个 3D
    模型都有一个“多边形数量”，即*多边形数*，它显示了模型中的多边形数量。多边形数高的模型因此更精细，这会使 GPU 工作更吃力，可能导致以较低的`FPS`进行渲染。这些*FPS
    下降*会导致延迟，进而引发模拟器晕动症。为了应对这种现象，许多 VR/AR 艺术家使用*低多边形*风格（如图 17-2 所示），这种风格使用的多边形数量非常少。这能让
    GPU 更容易渲染，同时也形成了独特的外观。最早的计算机 VR 设备不得不使用由线框立方体构成的低多边形环境，这些环境看起来像是没有表面。


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig2_HTML.jpg](img/321739_2_En_17_Fig2_HTML.jpg)


    图 17-2. Google Daydream Home 采用了低多边形艺术风格^(³⁶)


    为了控制模型表面的外观，艺术家会使用材质。材质包裹在金属丝雕塑上，就像覆盖在雕塑框架上的皮肤一样。材质通常由一个或多个纹理（决定皮肤上的图案和颜色）以及一个或多个着色器（控制材质在屏幕上的显示方式）组成。例如，一个反射着色器会显示从模型上发出的光线。


    ### 如何制作 3D 模型


    既然你已经知道网格、多边形和材质构成了 3D 模型，我们可以探索两种常见的创建 3D 模型的方法。


    我们要看的第一种方法是手动创建 3D 模型。3D 艺术家使用非常复杂的 3D 建模软件，在 3D 空间中手动排列每个多边形。他们还会创建材质、纹理和着色器，以改变网格的外观。这是一个极其劳动密集型的过程，需要专业知识和敏锐的细节洞察力。为了优化
    VR/AR 模型，3D 艺术家需要特别留意多边形数量。


    ### 摄影测量法创建 3D 模型


    另一种创建 3D 模型的方法是*摄影测量法*。你从多个不同角度拍摄目标对象（比如一座雕像）的照片。然后，摄影测量软件可以推断出物体的形状。摄影测量法对于获取真实世界物体的精细模型非常有用，如果以所需的精细度对这些物体进行建模，会耗时过长或不可行。


    ### 动画简述


    一旦你制作好了模型，你可能想让它*动起来*（静态的小狗可没什么意思！）。大多数动画软件使用*关键帧*，即模型将在其间移动的某些重要位置。例如，如果你有一只挥动的手臂，你可以为手臂创建一个向右倾斜的关键帧。然后，在第二个关键帧中，你可以将手臂设置为向左倾斜。动画软件会计算出如何让手臂从第一个关键帧（向右倾斜）移动到第二个关键帧（向左倾斜），这样手臂就会从右向左移动，看起来像是在挥手。对于具有复杂运动系统的复杂模型来说，制作动画极其复杂。


    ### 体积捕捉法创建带动画的 3D 模型


    动画的一种替代方案是*体积捕捉*，它类似于摄影测量法的动态版本。体积捕捉通常使用超过一百台摄像机同时拍摄照片，因此它可以处理移动的物体和人物，以创建一种“3D
    视频”。体积捕捉非常适合录制预定义的序列，例如舞蹈动作。

