    # 物联网系统间的互操作性


    物联网系统间的`互操作性`是指来自不同制造商的物联网系统和设备相互通信的能力。例如，如果`MyAppoly`办公室新装了一个`GE`智能灯泡，互操作性就意味着该`GE`灯泡和`Roost`设备能够作为同一物联网网络的一部分正常运行。`互操作性`得益于所谓的开放标准。标准是制造商在生产产品时遵循的一系列规范和规则。开放标准是公开可用的，而封闭标准通常是专有的。当多家公司遵循同一套开放标准时，其最终产品就能相互兼容。在这种情况下，同一网络上的`GE`灯泡和`Roost`冰箱将遵循同一套开放标准。开放标准鼓励创新，并使得连接不同制造商的设备变得简单。另一方面，封闭标准可以带来更安全、更可预测的网络，因为单一公司对整个标准保持完全控制。


    正如我们所看到的，当我们智能地利用冰箱自身的数据以及其他冰箱的数据时，我们的整体冰箱体验得到了提升。这个冰箱的例子总结了物联网的核心思想之一：我们对某事物了解的信息越多，我们拥有的知识就越丰富，从而能采取更好的行动。接下来，我们将讨论近期物联网快速增长所涉及的不同因素。


    ## 推动物联网发展的因素


    物联网背后的核心思想已经存在相当长一段时间了。可以说，这一想法最早出现于 1843 年，当时科学家们希望收集机器测量的天气数据能有助于未来做出更好的预测。^((31))
    1982 年，卡内基梅隆大学的一台可乐机接入了互联网，能够传输关于其库存和新添加饮料温度的数据。^((32)) 在 20 世纪 90 年代，物联网概念被称为嵌入式互联网。^((33))


    近年来物联网的爆炸式增长得益于多个领域技术的巨大进步。让我们回顾一下`MyAppoly`的新款智能冰箱，如果没有硬件、网络、大数据与数据分析以及云技术这四个主要类别中的各种近期创新，它根本不会存在。


    首先，`Roost`能够购买或制造出足够小巧、廉价且功能强大的芯片和传感器，以满足冰箱的需求。过去，制造出既小到能放入冰箱、又强大到能连接互联网的组件，要么成本过高，甚至根本不可能。如今，由于硬件技术的进步，我们看到了计算组件正变得越来越小、越来越廉价、能效更高且功能更强大。`摩尔定律`总结了硬件技术改进的这些趋势。


    `摩尔定律`以`仙童半导体`和`英特尔`联合创始人`戈登·摩尔`的名字命名，基于他 1965 年的预测：计算机芯片上的晶体管数量每年会翻一番。这意味着什么呢？简而言之，计算机使用二进制语言，即它们只理解由
    0 和 1 序列编写的信息。正如我们在第 3 章学到的，我们通过人类可读的编程语言让计算机做的一切事情，最终都会被翻译成二进制，以便计算机理解并执行我们的指令。晶体管是计算机内部代表
    0 和 1 的实际硬件部件。计算机芯片上的晶体管越多，该芯片的计算能力就越强。随着时间的推移，随着晶体管越来越小、计算机芯片越来越强大，更小的设备获得了更强大的计算能力。如今手持智能手机的计算能力远超
    30 年前巨型超级计算机的计算能力。得益于这些硬件技术的进步，我们的`Roost`冰箱拥有了所需的计算能力。


    其次，近期网络技术的改进带来了更快、更廉价、更可靠的互联网连接。毋庸置疑，更广泛、更可靠的互联网接入有助于设备保持连接。快速可靠的互联网连接对于关乎我们健康与安全的物联网网络至关重要。例如，如果智能锁保护着`MyAppoly`办公室，那么互联网中断的后果可能会危及办公楼的安全和安保。


    第三，得益于当前的大数据技术，`Roost`物联网网络能够成功利用海量数据。正如我们在第 5 章讨论的，大数据具有高速度（快速更新的数据片段）、高容量（大量数据）和高多样性（不同类型的数据）的特点。物联网网络生成的数据无疑符合大数据的特征，并且需要使用更新的技术。我们的`Roost`冰箱仅关于牛奶重量就产生了大量数据——想象一下，一旦我们把其他食品杂货装满冰箱，并将全国所有`Roost`冰箱的数据结合起来，将会产生多么庞大的数据量！数据挖掘和统计学方面的进步，以及第
    15 章讨论的机器学习进展，都有助于`Roost`从海量数据中获取有价值的见解。


    最后，云技术的进步使得物联网网络能够共享数据并进行通信。物联网平台本身的存在，正是因为多个设备能够与云端的一个核心软件进行通信。物联网设备可以将海量数据存储在云端，而如果直接存储在设备本身，这将是不可行的。由于我们上文讨论的硬件改进，这些服务器可以廉价地存储大量数据。云端强大的服务器可以执行计算密集型分析，而这些分析在较小的设备上是无法完成的。

    '
- fmt: '# IoT Applications


    The possibilities that IoT brings are endless, and the field is almost certain
    to grow in ways we can’t predict. Some of the many potentially exciting IoT areas
    today include:


    - *Enterprise*: Smart, connected networks have the potential to improve efficiency
    and productivity in areas such as retail, agriculture, and energy, among others.
    Consider a sensor network that collects data on farm soil moisture and allows
    a smart water sprinkler system to improve efficiency and reduce waste in the watering
    process.

    - *Smart cities*: Smart traffic lights, for example, could use historic data to
    optimize traffic control and decrease congestion.

    - *Self-driving cars and connected cars*: Self-driving cars work by using cameras
    and a variety of sensors, such as radar and LiDAR, to sense and navigate their
    surroundings. In a future IoT world, self-driving cars could share data with each
    other to inform each other about traffic accidents and road changes or even share
    data with traffic lights and construction zones to plan better routes and minimize
    traffic, among many other possibilities.

    - *Wearable technology*: Wearable technology has added potential in the field
    of healthcare. Wearable devices such as smartwatches and personal fitness trackers
    could collect unprecedented amounts of very personal, health-related data such
    as heart rate and hours of sleep. Caregivers could have direct and constant access
    to patient health information, enabling better healthcare delivery.

    - *The smart home*: Everything from light bulbs to doorbells could connect to
    the Internet and each other.

    - *Consumer robots*: Robotics is a complex field that requires a full book to
    explain in depth. However, there are a few products that we’ll quickly discuss
    here. A robot is defined as a machine that is capable of carrying out a complex
    series of actions automatically. Some robots can automatically vacuum your floors,
    some can patrol your house for security, and some can fetch objects. When robots
    connect to the Internet, their capabilities only increase. For example, a fleet
    of robotic vacuum cleaners communicating with each other could work together to
    coordinate vacuuming a large space most efficiently.


    # Advantages and Caveats


    It’s clear that IoT technology is extending its reach into many aspects of our
    lives, including our businesses, homes, and health. The Internet of Things can
    not only make our lives more convenient but can also make processes and interactions
    more intelligent, efficient, and accessible. It is estimated that by 2025, the
    Internet of Things will drive several trillions of dollars of yearly economic
    impact.^([^(34)](#fn34))


    The value that IoT networks can bring includes:


    - *Better insights and more effective actions*: As we discussed earlier, `MyAppoly`
    employees are benefitting from the insights and actions that their new smart fridge
    provides.

    - *Improved product development*: `Roost` might notice that after a few months
    of use, milk weight sensors are slower to share data with the IoT platform. This
    insight then allows `Roost` to intelligently put resources into developing a better
    milk sensor for the next version of the smart fridge, rather than merely making
    guesses about where their product might need improvement. The data collected about
    how users and devices are performing allows IoT device manufacturers to create
    better products more efficiently.

    - *Direct economic gains*: Consider a fleet of smart wind turbines that is communicating
    with each other as an IoT network. During a strong wind storm, `Turbine 10` starts
    to putter out and realizes that it’s about to go down. It sends information about
    its upcoming outage to its surrounding wind turbines, which in turn use the data
    to adjust their settings dynamically to compensate for `Turbine 10`’s lost time.
    They also alert smart buildings in the city with an estimate of their temporarily
    decreased energy supply, so that buildings can conserve energy accordingly. In
    this way, the economic losses from the outage are minimized. Rather than having
    to wait for a human to notice that a single turbine is down and adjust the rest
    of the settings accordingly, a smart network of turbines and buildings can work
    together to handle the outage quickly.

    - *Remote monitoring and control of devices*: Since devices are sending data over
    the Internet, they can be monitored from afar. Technicians may not have to be
    present physically at the wind farm in the example above in order to inspect the
    turbines.

    - *Increased machine autonomy*: In our turbine example, the communication between
    the turbines allows for a human technician to monitor the fleet as a whole, rather
    than each turbine individually. The human is now free to focus on the overall
    performance and health of an entire fleet, rather than on the performance and
    health of multiple individual units.


    Of course, the growth of IoT presents new challenges we will need to address.
    As this growth continues, there are some things we should keep in mind and be
    cautious about, including:


    - *Data security*: Every attack that we learned about in Chapter `12` can target
    IoT devices. IoT networks increase the number of ways hackers can gain access
    to data and devices, so protection becomes an even more significant challenge.
    If a home network is hacked, an attacker could gain control of the smart locks
    on the home and remotely unlock doors at any time. If a network of healthcare
    devices, such as a network of patient wearable devices and hospital devices is
    compromised, an attacker could gain access to personal health information or even
    control patient medications and treatments directly. A compromised self-driving
    car could lead to hijacked traffic or car accidents designed by an attacker. It
    is imperative that we prioritize cybersecurity.

    - *Data privacy*: As IoT networks become more commonplace, manufacturers will
    have access to huge amounts of very personal user data, ranging from healthcare
    data to conversations with smart speakers to logs of people who have visited someone’s
    home. These data are all private and potentially sensitive, and it’s up to manufacturers
    and the government to develop protocol around (1) how and for how long data are
    stored, (2) if data are de-identified when aggregated for analysis, and (3) the
    types of data users can elect to share or not share with other companies or devices.
    Without comprehensive data privacy practices in place, users are unlikely to adopt
    IoT networks as part of their day-to-day lives.

    - *Interoperability and standards*: IoT devices are manufactured by a variety
    of companies, using a variety of technologies. How can we anticipate which devices
    will need to communicate with one another and set standards accordingly?

    - *Infrastructure*: Recall that the Internet relies on an infrastructure of physical
    hardware that exists throughout the world. The growth of IoT devices will strain
    our current networking infrastructure.


    # Conclusion


    Many technologies discussed in this book come together to create IoT technology,
    including networking, databases, the cloud, developing at scale, machine learning,
    and cybersecurity. The Internet of Things is an ever-expanding network of smart
    devices that are always talking to each other, sharing information, and responding
    to new knowledge and insights. Though there’s a lot we could gain from IoT networks,
    if the Internet of Things is to grow and become a standard part of our day-to-day
    lives, we must be extremely cautious about how we protect user data and secure
    devices.


