    10 章）。

    - *Meta*：元标签用于向浏览器传递信息，例如页面的关键词或页面内容的描述。这些标签对于 SEO 也很重要。

    - *Body*：`<body>`元素包含要阅读的实际页面，包括所有文本、图像、链接等等。


    还存在许多其他类型的标签，用于引入图形图像、表格、列表以及几乎你能想到的任何东西。标签可以具有属性，这些属性提供关于元素的更多描述，例如用于样式设置的信息。最新版本
    HTML5 还支持动画、地理定位、触摸屏支持和内容处理等新特性。


    以下两节将讨论你在讨论标记语言和网页设计时可能遇到的其他术语。


    ### XML 和 XHTML


    XML 是一种标记元语言，这意味着它用于定义其他标记语言，因此在某些方面它与 SGML 类似。然而，它比 SGML 简单得多，而 HTML 正是从 SGML
    技术发展而来的。XML 由两部分组成：文档和样式表。文档包含如前所述的标签或元素，而样式表则为各个元素提供样式。


    为什么我们需要 XML？SGML 包含许多复杂且常常不必要的方面。因此，HTML 经常对错误很宽容，对规则也较为宽松，导致同一 HTML 文档在不同浏览器或设备上产生不同的渲染效果。如果每个浏览器对你的代码理解不同，那么作为开发人员，你将难以控制用户界面。XML
    更为严格，并具有需要遵守的指南。因此，如果我们能够用 XML 重写 HTML，我们就能创建一种可能不会像 HTML 那样遇到许多问题的标记语言。这一想法启发了名为
    XHTML 的标记语言。凭借更严格的编码指南，XHTML 页面可以在不同设备和浏览器上具有更好的可访问性，尽管 XHTML 并非*向后兼容*，这意味着旧版浏览器可能无法读取较新版本的标记语言。

    '
- fmt: '### CSS


    `Cascading Style Sheets` (CSS) is a language that tells the browser how to style
    and position the various HTML/XHTML elements. CSS syntax is brief. It includes
    a selector that tells the browser which HTML tags to style, and a declaration
    that tells the browser how to style the elements.


    There are three places where CSS styling can live. First, it can be placed in-line
    as in `<h1 style="color:blue">My blue heading </h1>` tells the browser to color
    the heading blue. Alternatively, all style codes can be aggregated at the top
    of the page within the `<head>` tags. The browser is smart enough to match the
    style code to its corresponding HTML tags. Lastly, all CSS can be put in an external
    sheet that is linked to within the HTML page. You specify which HTML tags you
    would like to style, and the browser can manage the rest. Of the three options,
    the external CSS file is considered best practice for a number of reasons:


    - *Readability*: It is better to keep structure and style separate.

    - *Speed*: Faster load time.

    - *Maintenance*: Imagine you want to update the style of your entire site. If
    the CSS were in-line, you would have to go through all the HTML to update all
    of the styles, but if everything lived in an external file, you could easily make
    updates. You could even create an entirely new file called “`styleversion2`” and
    then change the link in the HTML document. Depending on your mood, you could change
    the link from `styleversion1.css` to `styleversion2.css` and the entire feel of
    your website could change. This powerful capability resembles *abstraction* (Chapter
    [3](#321739_2_En_3_Chapter.xhtml)).


    *Inheritance*, discussed in Chapter [3](#321739_2_En_3_Chapter.xhtml), exists
    in CSS, whereby the style of *parent* elements is passed on to *children* elements.
    In other words, an element within another element inherits the style of the larger
    container in which it is contained. We call this idea of inheritance *cascading*,
    hence the `C` in CSS.


    CSS contains eight general style categories as follows, together with examples:


    - *Type*: Font, color

    - *Background*: Color, image

    - *Block*: Word spacing, line spacing

    - *Box*: Width, height, float

    - *Border*: Style, color

    - *List*: Style, position

    - *Positioning*: Position, height, visibility

    - *Extensions*: Page break, cursor


    Positioning in CSS is based on a box model whereby every element can be described
    as being located in a nested zone, ranging outward from *content* in the center,
    through *padding*, and then on to *borders* and *margins*. In some ways, designing
    a web page with CSS is nothing more than arranging boxes on a screen.


    ### JavaScript


    With HTML and CSS, you can create great-looking websites with content formatted
    nicely, but they will lack interactivity. Drop-down menus, informational boxes
    that appear when you hover the mouse, and so much more can be attributed to JavaScript,
    an object-based scripting language (remember the definitions from Chapter [3](#321739_2_En_3_Chapter.xhtml)?).
    It lives in the HTML document and is rendered by your browser (the *client* trying
    to access the site); therefore we say JavaScript requires *client-side* processing.
    This is why JavaScript, unlike the other scripting languages we have discussed,
    is considered front end and not the back end. It is not executed by the server.


    First introduced by Netscape, JavaScript is now ubiquitous across the Web and
    will serve to make MyAppoly interactive and animated. Let’s say you want an informational
    pop-up window to be displayed after the user clicks on the MyAppoly logo. How
    is this accomplished? The HTML element where the logo is contained will contain
    some reference to a piece of JavaScript code called an *event handler*. Event
    handlers “wait” for certain “events”—actions that the user completes—at which
    point the computer starts following the corresponding JavaScript instructions.
    In this case, the JavaScript event handler will create a pop-up window and add
    it to the user’s display when the logo is clicked. Thus, events, event handlers,
    and functions define a large part of how JavaScript can be used to add interactivity
    to a web page.


    As with CSS, JavaScript can be placed either directly into the HTML document in
    the `<head>` element or in an external `.js` file with a link from within the
    HTML document.


    #### Document Object Model and DHTML


    What if you wanted to change the color of the background when the user clicked
    the MyAppoly logo and produced a pop-up window? This is slightly more complicated
    because JavaScript must not only create a pop-up window but also alter the HTML/CSS
    code that defines the background color of the page. This *Dynamic HTML* (DHTML)
    combination of static HTML and JavaScript is enabled by the *Document Object Model*
    (DOM). The *World Wide Web Consortium* (W3C) defines DOM as “a platform- and language-neutral
    interface that will allow programs and scripts to dynamically access and update
    the content, structure and style of documents.” The DOM essentially defines all
    the elements on an HTML page as objects, places them in a tree-like structure
    based on how the elements are nested so you can easily reference them, and makes
    every element on the page interactive. You can theoretically reference any element
    in the document by tracing the path from the top of the tree to that element.
    Once at that element, you can manipulate it to create your desired effect. The
    DOM adds interactivity to every element on the page.


    ### Ajax


    Ajax, like DHTML, is an amalgamation of technologies. Created in 2005, *Asynchronous
    JavaScript and XML*—*Ajax* for short—combines CSS, HTML, DOM, XML, and `XMLHttpRequest`
    to allow a web page to perform functions in the background. Let’s break this apart.
    Imagine MyAppoly has a form for individuals to complete that requires the user
    to enter their state. Most modern websites will suggest a few options for you
    in a dynamic drop-down menu, so when you type in “M,” a list of states beginning
    with M automatically appears beneath the search box. When you type in an A, Massachusetts
    appears for you to select. Without Ajax, the alternative would be a page that
    refreshed entirely every time you typed a new letter so that it could get a new
    list of potential states that might be valid. You would type a letter, which the
    page would take and use to search through its database. After it found all states
    satisfying that letter, the page would refresh to display the updated information.
    Assuming it takes 0.5 seconds for a page to refresh, people would become impatient
    and annoyed with your website—a bad user experience.


    So what does Ajax do? Instead of refreshing the page with the new content, Ajax
    instead transfers data the user requests from the server to the client. Ajax uses
    XML to format this data, and XHTML, CSS, DOM, and JavaScript are then used to
    take the data and update only the portion of the web page that is affected. The
    major point is that this is all done asynchronously, meaning the user does not
    know it is happening in the background. In fact, the user can continue to interact
    with the web page while Ajax is working to get more up-to-date information from
    the server. Ajax is sophisticated and often difficult to use, but many toolkits
    make Ajax much simpler.


    Ajax only works in modern browsers, and so this technology too lacks backward
    compatibility.'
