  trans: '

    # 压缩


    如果你曾下载过大型文件，可能会注意到它是以体积更小的 `.zip` 文件形式下载的，需要解压才能使用。创建这种文件的过程被称为*压缩*。通过减小响应体积，文件从服务器传输到浏览器所需的时间也会缩短。请记住，压缩会带来一定的代价。在服务器上压缩文件以及浏览器解压文件都需要额外的处理能力。因此，并非对所有资源进行压缩都是合理的。


    另一种压缩手段是*精简*，即删除文档中所有不必要的空格、注释和字符。编写软件时，缩进和注释能让代码更具可读性。然而，当代码从服务器传输到浏览器时，这些内容会增加大量不必要的负担。


    # 脚本与样式表的位置


    请记住，样式表（`CSS` 文档）和脚本（`JavaScript` 文档）通常以外部链接的方式嵌入到 `HTML` 文档中。这些文档的链接位置将决定页面的加载方式。假设一个页面需要五秒加载完成。第一种情况是，屏幕在整整五秒内保持空白，随后整个页面瞬间呈现。第二种情况是，页面在五秒内逐步加载，直至完成。哪种方式更好呢？许多人会选择后者，因为用户对无响应的状态感到不适，他们更希望看到加载过程。要实现这种被称为*渐进式加载*的效果，你应将样式表链接在
    `HTML` 文档的顶部，而脚本链接在底部。由于许多浏览器会等到样式表处理完毕后才加载元素，以避免重新绘制，因此将样式表放在顶部速度更快。脚本则应放在末尾，因为脚本下方的内容在脚本完全下载之前会停止渲染。


    ## 基础设施变更


    大多数网络应用项目（例如 MyAppoly）都始于一台具有固定存储容量的服务器，该服务器与一个数据库相连。随着越来越多的用户开始使用你的应用，你需要增加服务器来响应他们所有的请求。然而，当更多用户加入并开始相互交互时，将所有收集到的数据写入数据库会变得极其缓慢。为了与数据库快速交互，我们会*复制*数据库，即创建多个可供交互的副本。


    复制数据库的过程颇为复杂。如果查询只是"读取"操作——即用户想要访问数据库中存储的信息——那么多个数据库副本能够满足日益增长的用户群需求。但如果用户想要"写入"或更改数据库中存储的内容——例如添加一个好友——该怎么办呢？你必须确保所有数据库都得到更新。将"新朋友"添加到所有数据库副本中可能效率低下，因此，你通过指定一个主数据库作为写入数据库来解决这个问题，所有更新必须仅由该数据库处理。其他所有数据库副本则纯用于读取。通过这种方式，数据库可以具备可扩展性。


    在添加了更多服务器和数据库之后，如何实际引导用户访问不同的副本呢？你可以使用*负载均衡器*，以分散请求的方式将用户请求发送至可用的服务器。负载均衡器可以采用各种复杂的算法来决定最优的分配模式。最简单的是轮询法，它按固定模式将新用户引导至服务器。将一位用户发送至服务器
    A 后，下一位用户发送至服务器 B，再下一位发送至服务器 C，以此类推。然而，这种方法可能并非最优，因为它没有考虑服务器的实际可用性。你可能会意外地将两个高负载用户分配到同一台服务器，而其他服务器的负载却较轻。基于使用情况的分配方式可能效果更好。负载均衡器能为你的系统提供可靠性，因为当某台服务器宕机时，它可以重新路由流量。


    ## 结论


    你最终会认识到性能至关重要，并且现在了解了开发者如何思考改善加载时间。你意识到，随着网络应用开始扩展，为了支持更多用户，你将需要为更多资源付费。额外资源需要在成本与性能之间进行权衡——这是一个不错的问题。随着你不断发展，你会发现自己存在一个盲点：安全性。下一章将向你介绍一些重大攻击及其防范方法。


    # 12. 安全


    特别感谢 Ashi Agrawal 贡献本章内容。


    2017 年 7 月下旬，信用报告巨头 Equifax 披露，一群不明身份的黑客入侵了超过 1.45 亿客户的个人信息——包括驾驶证号码和社会安全号码。^((13))
    此次攻击是日益增多的公开泄露和黑客攻击浪潮中的最新一起，此前 Target、Ashley Madison 和花旗银行等机构已遭受过此类攻击。


    尽管 Equifax 的数据泄露因其数据的敏感性而尤为令人震惊，但此类攻击可能发生在*任何*公司。黑客——即寻找网络安全漏洞的人——可能出于各种原因将组织机构的数字资产作为攻击目标，甚至为了实施个人报复或博取名声。有些人想将数据卖给出价最高者，而另一些人则享受其中的刺激和挑战。并非所有黑客都怀有恶意；道德黑客（也称为白帽黑客）会寻找这些漏洞，以便公司修复。即便如此，数字世界依然充斥着恶意的攻击。


    无论你的应用是做什么的，一次攻击都可能导致你丢失宝贵的计算能力和数据，或导致业务中断。即使数据泄露不会导致消费者身份被盗用，它仍然可能暴露敏感数据，并导致消费者的信任消失殆尽。除了实施安全防范措施的业务原因外，组织在道德和法律上也有义务保持安全。网络安全对你和你的公司而言应至关重要，本章将讨论如何保护你和你的用户的安全。

    '
- fmt: '## What Is Cybersecurity?


    Cybersecurity falls under the umbrella of information security, the practice of
    protecting electronic and physical data.^([^(14)](#fn14)) As the *Oxford English
    Dictionary* defines it, cybersecurity focuses on protecting electronic data, but
    this definition is limiting as it disregards securing computer resources that
    aren’t data.^([^(15)](#fn15)) The field also deals with digital attacks that are
    not data-driven: consider hacks that dismantle power grids. These attacks don’t
    compromise data, but they do use digital tools to wreak havoc. Therefore, this
    text defines cybersecurity as the study and practice of protecting electronic
    resources, such as data and computing power, from unauthorized parties. This chapter
    uses the term security in place of cybersecurity to reflect how professionals
    in this space use the terms.


    Certain cybersecurity techniques have roots in cryptography, the study of securely
    communicating in the presence of malicious third parties. As a field, cryptography
    has evolved over the centuries from simple techniques—reversing letters in a message
    or using the children’s language game “Pig Latin”—to complex, mathematics-based
    systems. These systems have since been crucial to some cybersecurity techniques
    that we’ll delve into later.


    After the rise of the Internet, cryptography and security quickly proved necessary
    in the digital space. The first computer virus is widely acknowledged to be the
    1988 Morris worm.^([^(16)](#fn16)) The program took advantage of vulnerabilities
    in various network protocols to spread rapidly and embed itself on machines. While
    Morris initially intended the program to measure the size of the Internet harmlessly,
    it ended up devastating thousands of computers by consuming and overwhelming their
    processing power. The resulting computer failures caused hundreds of thousands
    of dollars in damages. Since then, attacks have become more sophisticated, and,
    with more users and devices than ever on the Internet, the possible impact has
    ballooned in size.


    ## The CIA Triad


    The CIA Triad provides a framework for understanding the attack landscape. This
    classic model of information security outlines three primary security concerns:
    Confidentiality, Integrity, and Availability. Imagine the following situation:
    Alice wishes to pass Bob a piece of information and to protect it from their adversary,
    Charlie^([^(17)](#fn17)). Let’s consider three ways Alice and Bob can feel secure
    about their transaction.


    - **Confidentiality**: Since the message is a secret, we want it to stay secret.
    It is only ever visible to Alice and Bob, not to any third parties like Charlie.

    - **Integrity**: The content of the message matters, so we want to make sure that
    Charlie cannot tamper with or corrupt the message. When Bob receives the message,
    he can trust it is the same one that Alice sent.

    - **Availability**: The message is time-sensitive, and Alice wants to make sure
    Bob receives and reads it. Charlie cannot prevent Bob from accessing the message.


    The following sections discuss common attacks and mitigations using this model
    of confidentiality, integrity, and availability. This structure is useful both
    in categorizing past attacks to understand vulnerabilities in your system and
    in thinking ahead to incorporate best security practices into your application.
    Keep in mind that this list is not exhaustive, nor can all attacks be this neatly
    bucketed into categories. However, this discussion is a useful example of using
    the CIA Triad to think about security in the context of an application.


    ### Confidentiality


    Everyone has secrets, whether they be embarrassing nicknames or personal relationship
    history. Like people, all applications have secrets that they want to keep private.
    The most obvious application secrets are passwords and user data. When a piece
    of data (such as a Social Security number or birth date) can be used to identify
    an individual, it is known as Personally Identifiable Information (PII). It is
    the job of the application to guard both PII and other user information from prying
    eyes. Confidentiality, simply put, is keeping secrets secret—the difficulty of
    which we all learned at a young age.


    One way attackers target confidentiality is through social engineering attacks,
    which use techniques based in human psychology to manipulate a user into revealing
    confidential information. The most widespread type of social engineering attack
    is phishing, the practice of soliciting sensitive information or getting users
    to download malware by posing online as a credible entity. This section focuses
    on three types of phishing: drag-net phishing, spear phishing, and clone phishing.


    Drag-net phishing attacks cast their sights on a wide swath of users by utilizing
    mass email schemes. Pretending to be some authority (e.g., the IRS), an attacker
    sends scores of users the same, seemingly valid email. However, the email includes
    a malicious link that leads users to a page that looks official or identical to
    an actual website (e.g., the official IRS website) but is not. Users fall into
    the trap of entering personal details (e.g., their Social Security number) on
    this site, enabling the attacker to commit identity fraud. Some phishing emails
    instead or additionally disguise a destructive virus as an innocent-looking attachment.
    Users that download and open this file inadvertently cause the virus to run, therefore
    giving the attacker access to their computers. The most famous drag-net phishing
    attack is the “Nigerian prince” scam, in which attackers don the guise of a prince
    that needs help transferring his wealth. The attacker’s emails ask recipients
    to send a seemingly nominal fee to a bank account with the promise of greater
    wealth if they help. Of course, there is no prince, and the victims can’t reclaim
    the funds they sent to the bank account. While this attack does not always involve
    the exchange of sensitive information, attackers use the same tactics as many
    other drag-net phishing attacks.


    Spear phishing attacks, on the other hand, target specific victims. An attacker
    poses as someone the victim knows or trusts and sends them an email that incorporates
    personalization, such as by addressing the victim by name or job title. A common
    spear phishing strategy is to email users of a particular service provider—here
    we’ll use the example of Gmail. The attacker, using an account that seems to be
    an official Gmail account, tells users via email that their accounts were hacked.
    The email then redirects the users to a fake page that collects their credentials.
    Since the user thinks they are interacting with Gmail, they are willing to enter
    their password. This exact attack was the basis of the email leak targeting high-ranking
    Clinton campaign official John Podesta in early 2016.^([^(18)](#fn18))


    Clone phishing takes this personalization further and uses the user’s previous
    emails against them. Using a previously received legitimate email as a template,
    the attacker sends the victim a near-replica of the email, save for a new malicious
    link or attachment. Since these emails closely resemble actual emails that the
    user has received, it is more difficult to distinguish between a phishing and
    a legitimate email.'
