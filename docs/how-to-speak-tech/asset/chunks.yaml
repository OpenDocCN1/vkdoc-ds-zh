- fmt: '# GDPR


    With all of this talk about tracking, it is important for the `MyAppoly` team
    to be aware of the serious concerns around privacy. As of 2016, we have introduced
    significant changes to our existing data privacy regulation, most notably General
    Data Protection Regulation (GDPR) which attempts to standardize data protection
    law across the EU countries with a more comprehensive and stronger solution than
    we had previously. Enforceable starting May 2018, GDPR requires businesses to
    disclose any data collection before it does so, including the data''s purpose,
    storage time, and sharing plans. The business may only move forward in processing
    personal data if it receives explicit consent from the user, which can also be
    revoked at any time. GDPR is far more comprehensive than we will get into here,
    but this should be central to the conversations your team has on data tracking,
    collection, storage, and processing.


    # Conclusion


    Keep in mind that several tools have been omitted in this discussion. If you sign
    up for Google Analytics, you will notice that there are many helpful methods to
    segment the data and extract hidden insights. For example, Google Analytics allows
    you to see what words people search on search engines before coming to your website.
    This is called `site search analytics` (SSA) and provides context behind a user''s
    actions, unlike the data produced by clickstream analyses and heat maps, which
    require inference.


    Now that you have been primed on the basics of search engines, tracking, and data
    privacy regulation, `MyAppoly` is ready for the big leagues. It''s ready to grow,
    but can you handle the growth?


    Footnotes [1](#321739_2_En_10_Chapter.xhtml#Fn1_source)


    # 11. Performance and Scalability


    As an eager entrepreneur, you monitor `MyAppoly`''s usage carefully and address
    any issues immediately. You spend time sifting through the analytics reports from
    your team, and you notice signs of success. The number of users you have is snowballing.
    Soon, your team approaches you and asks to discuss how to improve the site now
    that it is attracting unprecedented traffic. Some engineers note that certain
    pages are much slower than their potential and that the current setup cannot support
    many more users, especially at the rate of growth the metrics suggest. For example,
    each server can only handle a certain number of requests per second, so the website
    currently takes too long to load. These are good problems to have, but they still
    need to be addressed.


    `Performance` relates to a website''s speed: how fast it loads, how many bytes
    are transferred, and any other metric that measures the rate at which a user receives
    requested information.


    `Scalability` refers to the ability of a web application to adjust to a growing
    amount of work. It is about how well your site can accommodate more users, more
    data, and more computation—not just one more or a few more, but thousands or even
    millions more.


    You can see that the two are not the same thing but might arise together. If your
    user base is growing, you want to make sure your site is operating as efficiently
    as possible. Your team prepares a primer on techniques they hope to implement.
    The list is not exhaustive but gives you a sense for how companies approach these
    issues.


    ## Practices to Improve Performance


    The back end and front end can be optimized to improve performance. However, the
    back end accounts for only a fraction of the time it takes for a page to load.
    Most of the time is spent downloading components for the user interface—such as
    issuing HTTP requests for the assortment of elements that appear on a given web
    page. This might influence how you prioritize and allocate resources, though page
    load time is just one aspect of performance.


    ### Back-End Considerations


    Applying the good design principles already mentioned can create efficiency gains.
    For example, abstraction allows you to reuse code effectively in different sections
    of your application.


    Additionally, many successful technology companies rewrite their code to make
    things more efficient. Optimizing database queries and other operations (such
    as algorithms for determining recommendations for movies on Netflix) is one step.
    Another is to rewrite the application in a different programming language completely.
    Recall that lower-level languages provide more efficiency (Chapter [3](#321739_2_En_3_Chapter.xhtml)).
    As a result, many technology companies rewrite their application to utilize these
    languages. Twitter, for example, transitioned from Ruby on Rails to Scala and
    Java. Facebook transforms its PHP code into highly optimized C++ code programmatically.
    The list continues, but because migrating code to a different language is an intensive
    process, companies need to consider thoughtfully when their current programming
    language is no longer the right tool for the job.


    ### Front-End Considerations


    When a user visits your website, only a small amount of time is spent on the initial
    HTTP request for the HTML document. A bulk of the time is spent downloading all
    the various resources associated with the particular web page. This section highlights
    some practices, tools, and methods for all front-end developers to think about
    when performance is the objective.


    #### Fewer HTTP Requests


    Reducing the number of HTTP requests required to download page resources shortens
    page load time. There are a variety of methods for reducing the number of requests,
    such as combining scripts and stylesheets. We''ll discuss two image-specific approaches:
    using `CSS sprites` and `image maps`.


    Imagine that you want to show the first half of your logo on the upper-left corner
    of your site and the right half of your logo on the upper-right corner. One approach
    would involve designing two elements representing each half that would require
    two requests to display. Instead of this approach, we could issue only one request
    for the full logo, and use different CSS attributes to hide portions of the image
    we do not want to display. This is a `CSS sprite`, and it helps reduce the number
    of requests we might need.


    Now say that you want to include an image of your team on the site, where clicking
    any of their faces would redirect the user to their LinkedIn profile. Doing this
    with individual photos would require the browser to issue a separate HTTP request
    for each image. However, by using a group photo, you can use an `image map` to
    associate different links to different areas of the image, reducing the number
    of image HTTP requests to one.


    #### Cache


    If your users return to the same page repeatedly, it makes little sense for them
    to re-request all of the page''s resources each time. You don''t ask your best
    friends for their cellphone numbers every time you meet, do you? At some point,
    they would just ask you to save it. In the same way, your browser gets fed up
    with asking the server and instead stores web pages in a `cache`. Examples of
    cached resources include images, CSS files, and JavaScript files, all of which
    change relatively few times compared to the HTML; you might want to add a new
    paragraph of information to your site, but you''re unlikely to change your logo
    or page styling frequently. Placing CSS and JavaScript in external sheets enables
    their caching.'
