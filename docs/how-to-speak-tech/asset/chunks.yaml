    ### Android 与 iOS


    如前所述，原生移动应用直接在手机操作系统上运行。同时为 Android 和 iOS 进行开发是一项繁重的任务，因此许多公司会先集中精力构建一个平台。选择聚焦哪个平台可能颇具挑战性，所以下面我们将概述关键差异。Android
    和 iOS 主要在三个方面有所不同：用户基础、开发流程和应用部署。


    对于大多数产品而言，选择平台的首要考虑因素是用户群体。虽然 iOS 在西方消费者中占据主导地位，但 Android 在全球拥有更多用户。凭借其高昂的产品定价和品牌形象，iOS
    吸引了那些在应用和应用内购买上花费更多的消费者。


    当然，从技术层面来看，两者的开发也截然不同。Android 应用使用 `Java` 或 `Kotlin`，在 `Android Studio` IDE 中开发；而
    iOS 应用则使用 Apple 创建的编程语言 `Swift`，在 `XCode` IDE 中开发。`Java` 享有广泛普及度，而 `Kotlin` 和
    `Swift` 则是相对较新的成员，使用范围更有限。你的团队成员可能更有可能已经熟悉 `Java`。此外，`XCode` 仅原生运行于 Mac 设备上，这意味着开发过程会受到设备类型的限制；而
    `Android Studio` 则可在所有类型的计算机上运行。由于 Apple 的政策，iOS 应用开发受到更多限制。另一方面，Android 是开源的，开发者可以查看源代码以更深入地理解该平台。


    由于运行着不同设备和操作系统版本，Android 应用的开发时间更长。运行 iOS 的设备相对较少，且全部由 Apple 制造，因此它们之间的差异极小。相比之下，Android
    设备由超过 1000 家不同公司生产。^(²⁸) 这种差异意味着开发者在创建 Android 应用时，必须考虑极为广泛的屏幕尺寸和设备规格。由于 Google
    并非生产所有 Android 设备，它无法强制用户和设备制造商向消费者推送最新的操作系统。更新操作系统对设备制造商来说可能是一个麻烦，因为他们必须确保新系统能与其手机配置良好兼容。因此，他们往往不会向消费者推送最新版本，导致移动设备碎片化：Android
    用户分散在不同的操作系统版本上。Android 开发者因此必须确保他们的应用能在多个操作系统版本上良好运行。正如我们在第 12 章中讨论的，过时的软件也可能导致安全风险增加。许多黑客利用
    Android 设备碎片化，将恶意代码瞄准 Android 设备。


    最后，Android 和 iOS 在将应用部署到各自的应用商店方面也存在差异。虽然两者不发布收到的应用提交数量统计，但据传闻，Android 似乎比 iOS
    接受了更高比例的应用进入其应用商店。因此，应用更有可能被 Apple App Store 拒绝，而不是 Android Play Store。


    Android 和 iOS 各有优缺点。在决定重点开发哪个平台时，产品通常会最优先考虑用户基础和开发便利性。如果你仍然无法选择其一，或者希望同时向两个平台发布，那么跨平台开发或许是合适的路径。


    ### 跨平台开发


    尽管真正的原生应用能提供最佳性能，但为 Android 和 iOS 编写和维护它们需要相当多的开发投入。不仅每个平台需要不同的代码库，而且应用的每次更改都需要单独的更新和测试。因此，跨平台解决方案越来越受欢迎。跨平台移动开发是指开发者编写单个应用以在多个移动操作系统上运行的过程。现有多个框架支持跨平台移动开发，其中许多允许开发者完全使用
    JavaScript 和其他 Web 技术进行编码。这些框架可用于创建原生应用或混合 Web 应用。


    原生移动应用是使用框架编写的，这些框架为开发者提供了通用组件，这些组件会在每个设备上被转换为原生组件。流行的工具包括 `React Native`、`Flutter`
    和 `Xamarin`。这三者在将平台无关的代码转换为原生代码的方式上存在差异，但最终结果都是移动应用的运行速度几乎与完全原生应用一样快。根据所需功能的不同，这些应用可能仍然需要特定于平台的代码。然而，大部分代码库保持不变。


    混合跨平台移动框架包括 `Ionic`、`Apache Cordova` 和 `Onsen UI`。请记住，混合应用结合了桌面 Web 应用的易用性和原生移动应用的功能。与原生移动应用的框架类似，这些框架将平台无关的代码转换为混合代码。此外，这些框架使开发者能够访问原生功能，如前所述。


    ### 原生开发 vs. 跨平台开发


    对于许多产品而言，跨平台开发因为其在三个方面（开发效率、开发者可及性和用户覆盖度）的众多优势而具有意义。


    原生开发和跨平台开发之间最显著的区别在于整个开发周期中效率的极大提升。由于开发者只需编写和维护一个代码库，发布新更新的速度要快得多。Web 技术的使用也能带来更快的开发速度。原生代码在运行前需要编译，而
    Web 代码可以在更改后立即刷新（称为“热重载”）。尽管编译时间从几秒到几十分钟不等，但这些延迟会随着时间的推移而累积。


    Web 技术的使用也使更多开发者能够进行跨平台开发。由于诸如 JavaScript 之类的基础 Web 技术相对广为人知，新开发者可以更快地熟悉项目。此外，跨平台解决方案消除了公司为每个代码库分别聘请
    iOS 和 Android 专家的需要。


    最后，跨平台开发是推动用户采纳的绝佳工具。通过采用跨平台开发流程，你可以同时向 Android 和 iOS 用户推出应用，而不必在开始时只专注于其中一个平台。


    跨平台开发也有其缺点，许多知名公司（如 Facebook 和 Airbnb）已经弃用了它。它可以加快开发周期，但移动应用本身的速度会受到影响。设备需要将跨平台代码转换为原生代码，这会消耗额外时间。对于需要快速运行的、对时间敏感的应用来说，这可能会破坏用户体验。此外，通过跨平台开发的应用无法充分利用原生代码结构。虽然这些框架涵盖了每个平台的大部分工具，但它们无法捕捉到每个平台的所有细微差别。因此，更复杂的产品仍然需要相当大量的特定于平台的代码。最终，这可能会感觉像是在支持三个平台而不是两个，从而削弱了跨平台开发所宣称的快速迭代速度。最后，由于跨平台解决方案仍然相对年轻，它们在发展成成熟框架的过程中，更有可能给开发者带来充满错误的体验。跨平台开发可以很好地服务于一个初出茅庐的产品，但它绝不是解决移动开发难题的万能药。

    '
