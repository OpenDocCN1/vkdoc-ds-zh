    agree to do the same. We call this game “the Bitcoin proof-of-work algorithm.”


    As an example of such a game, imagine a game where Player A thinks of a number
    between 1 and 10\. Player B’s task is to guess the number, but she can only guess
    one number per try. Assuming that Player A thought of her number randomly, there
    is no deterministic methodology that Player B can employ to figure out the number.
    Simply, she has to guess. This type of guessing is known as *brute-force* guessing.
    If Player C, then, joins the game but with two guesses per try instead of just
    one, she is statistically expected to guess the number quicker than Player B.
    This is because brute-force guessing can be made more efficient with an increased
    frequency of guesses.


    Miners engage in a similar brute-force guessing game when attempting to find the
    digital fingerprint of a block that is valid. To begin the process, the miner
    selects an arbitrary amount of transactions from the memory pool. The miner then
    appends some required data, such as the current *time stamp*, and runs everything
    through the SHA256 hashing algorithm. The resulting hash is the *block hash*,
    also referred to as the block’s digital fingerprint. This process of selecting
    transactions and hashing them to create a block is known as *mining* . How does
    the miner know if he or she found a valid block hash? If the numerical value of
    the block hash is lower than the current *target* value, the block is deemed valid
    and can be appended to the Bitcoin blockchain. See Table [16-3](#321739_2_En_16_Chapter.xhtml#Tab3).
    An intuitive way of comparing the hexadecimal values of SHA256 hashes to the target
    is by looking at the leading zeros: the more zeros at the start of the hash, the
    lower its value.


    Table 16-3.


    Judging the Validity of a Block Hash Based on the Target Value


    | Example target value | 000000000000000000365a170000000000000000000000000000000000000000
    |

    | Invalid block hash | 000f6497afaa87b8ce79a4a5f4ca90a579773d6770650f0819179309ed846190
    |

    | Valid block hash | 0000000000000000000000000000a4a5f4ca90a579773d6770650f0819179309
    |


    Statistically, more often than not, the miner will find a hash that is greater
    than the target and therefore generate an invalid block that cannot be appended
    to the Bitcoin blockchain. To generate a new block hash, the miner can either
    change the permutation of the transactions in the block, select a new set of transactions
    from the memory pool or—and this is the preferred option—add a random number to
    the data in the block, known as a *nonce*. Recall that the smallest change in
    input data will produce a new hash, so the miner can iterate through different
    nonce values to produce radically different hashes.


    Miners iterate at a *hash rate* of trillions of hashes per second, often using
    specialized hardware, in a competition to be the one that finds the next valid
    block hash. The faster a miner can iterate through hashes, just like Player C
    had more guesses per try, the more likely he or she is to find a valid digital
    hash. This computationally intensive process is known as proof-of-work because
    once a miner finds a hash, it serves as proof of the work he put in to mine the
    next block.


    Once a miner finds a valid block hash, the block is broadcasted to the Bitcoin
    network, and other miners verify and append it to their version of the Bitcoin
    blockchain.'
  trans: '

    #### 第二步：矿工验证交易


    每个矿工在接收到该交易后，会通过（其中包括）检查爱丽丝是否确实拥有 5 个比特币可供花费来验证它。这需要遍历比特币区块链，并从爱丽丝收到的比特币中扣除她已花费的所有比特币。请记住，区块链是一本记录所有历史交易的不可篡改账本。这意味着，如果一个矿工从第一个区块开始，读取每个区块的数据直至最新区块，他或她就能够计算出爱丽丝的余额。


    #### 第三步：交易等待被挖掘


    一旦矿工验证了交易，它就会被存储在每个矿工的`内存池`中。`内存池`是一个本地数据存储区，用于保存所有等待被打包成区块并添加到比特币区块链的有效交易。请注意，当交易位于`内存池`中时，它并不在比特币区块链上，也就是说，它还不是一笔已确认的比特币交易。存放在`内存池`中的交易正等待被挖掘成区块并附加到区块链上。


    #### 第四步：交易被打包成区块、挖掘并附加到区块链


    交易是如何从`内存池`中取出，挖掘成区块，并附加到区块链上的呢？这涉及到一些复杂性，因为我们需要确保每个矿工不会向区块链添加不同的区块，并且交易是有效的。换句话说，所有矿工需要验证交易并就他们都将添加的同一区块达成一致，且无需中央权威机构指示他们该怎么做。让矿工达成一致的一种方法是让他们参与一个随机游戏，这个游戏只有一位获胜者，并且要求他们在游戏过程中验证交易。当那位矿工获胜时，交易即被验证，该矿工便获得了将自己的区块添加到区块链的权利。其他所有人都必须同意执行相同操作。我们称这个游戏为“比特币工作量证明算法”。


    作为此类游戏的一个例子，想象一个游戏，玩家 A 想一个 1 到 10 之间的数字。玩家 B 的任务是猜出这个数字，但每次尝试只能猜一个数字。假设玩家 A 是随机想数字的，那么玩家
    B 没有确定性方法可以找出这个数字。简单来说，她只能猜。这种猜测方式被称为`暴力`猜测。如果玩家 C 随后加入游戏，但每次尝试可以有两次猜测机会而不是一次，那么统计上来说，她猜中数字的速度会比玩家
    B 快。这是因为随着猜测频率的增加，`暴力`猜测可以变得更高效。


    矿工在尝试寻找一个有效区块的数字指纹时，会参与类似的`暴力`猜测游戏。为了开始这个过程，矿工从`内存池`中选择任意数量的交易。然后，矿工会附加一些必要数据，例如当前的`时间戳`，并将所有数据通过
    SHA256 哈希算法运行。得到的哈希值就是`区块哈希`，也被称为区块的数字指纹。这种选择交易并将它们哈希以创建区块的过程被称为`挖矿`。矿工如何知道他或她是否找到了有效的区块哈希呢？如果`区块哈希`的数值低于当前的`目标`值，该区块就被认为是有效的，可以附加到比特币区块链上。见表
    16-3。一种比较 SHA256 哈希的十六进制值与`目标`值的直观方法是查看前导零：哈希值开头零越多，其数值越小。


    表 16-3. 基于目标值判断区块哈希的有效性


    | 示例目标值 | 000000000000000000365a170000000000000000000000000000000000000000 |

    | :--- | :--- |

    | 无效区块哈希 | 000f6497afaa87b8ce79a4a5f4ca90a579773d6770650f0819179309ed846190 |

    | 有效区块哈希 | 0000000000000000000000000000a4a5f4ca90a579773d6770650f0819179309 |


    从统计上来看，大多数时候，矿工会找到一个大于`目标`值的哈希值，从而生成一个无效区块，无法附加到比特币区块链上。为了生成一个新的`区块哈希`，矿工可以更改区块中交易的排列顺序，从`内存池`中选择一组新的交易，或者——这也是首选方案——向区块数据中添加一个随机数，称为`随机数（nonce）`。请记住，输入数据的最小变化都会产生一个新的哈希值，因此矿工可以遍历不同的`随机数`值，以产生截然不同的哈希值。


    矿工们以每秒数万亿次哈希的`哈希率`迭代运算，通常使用专用硬件，竞相成为找到下一个有效`区块哈希`的人。矿工迭代哈希的速度越快（就像玩家 C 每次尝试有更多猜测机会一样），他或她找到有效数字哈希的可能性就越大。这种计算密集型过程被称为`工作量证明`，因为一旦矿工找到了一个哈希值，它就能证明该矿工为挖掘下一个区块所付出的工作量。


    一旦矿工找到了有效的`区块哈希`，该区块就会被广播到比特币网络，其他矿工对其进行验证并将其附加到他们各自的比特币区块链版本上。

