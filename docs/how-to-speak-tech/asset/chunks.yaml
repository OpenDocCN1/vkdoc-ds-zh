    # The Blockchain


    Special thanks to Vojta Drmota for contributing this chapter.


    *Blockchain technology*, sometimes referred to as *distributed ledger technology*,
    is one of the latest innovations in technology. It has applications in a whole
    host of fields including finance, law, economics, mathematics, philosophy, and
    computer science. This chapter covers the fundamentals.


    ## Introducing Blockchain


    One of the pillars of modern technology is how data is stored. Due to the vast
    amounts of available data, it is important to store it in a way that will make
    it easily accessible later on. You might choose to store your personal budget
    in a spreadsheet with rows and columns, which makes it easy for you to navigate
    visually. Many companies with immense quantities of data store it in relational
    databases, which are similar to spreadsheets but are also easily navigable programmatically.
    A *blockchain* is just another way in which data can be stored.


    Data stored in a blockchain is packaged into *blocks*, which are linked together
    to form a linear chain: the blockchain. The blockchain can be thought of as a
    book, where the book in its entirety represents the blockchain and each individual
    page represents an individual block. Blocks in the blockchain are numbered the
    same way as pages in a book are, starting from the first block, known as the *genesis
    block*, and continuing to the last. The page number, which here represents the
    position of the block in the blockchain, is known as the *block height*. Pages
    in a book have uniform sizes and can thus contain a predetermined maximum number
    of words. Likewise, blocks in the blockchain have a uniform data storage capacity
    and can store a predetermined maximum amount of data.


    There are two things, broadly speaking, that readers of a book take for granted
    when flipping through its pages. Firstly, readers assume that every page that
    is supposed to be in the book is, indeed, in the book. If a student were to buy
    a history textbook in which the chapter, or even a couple pages, on World War
    II was missing, the student would be robbed of key information. In other words,
    we expect identical editions of books to contain identical information. This expectation
    applies to the blockchain as well. Each copy of a specific blockchain needs to
    contain all relevant blocks—and therefore all relevant data—in order to be *valid*.
    Otherwise, two parties sharing a blockchain to store data will have contradicting
    data sources. Secondly, we take it for granted that the order of the pages in
    a book is correct. A student attempting to understand the timeline of World War
    II, for instance, would be misguided if the pages on the conclusion of the war
    were, without logical reason, before the pages on the causes of the war. Since
    data often follows a logical order, it needs to be stored logically. This applies
    to the blocks in a blockchain too: a block that contains data on you spending
    Bitcoins cannot come before a block that contains data of you receiving Bitcoins—that
    would mean you’re spending Bitcoins before you earned them. Therefore, the order
    of blocks needs to remain intact for the blockchain to be *valid*.


    What does it mean for a blockchain to be *valid*? The answer involves the very
    reason why the blockchain came about as a way of storing data in the first place.
    Storing data on a blockchain doesn’t allow a company to store more data than it
    otherwise could store using a traditional database. Nor does storing data on a
    blockchain allow a company to navigate the data more efficiently than traditional
    databases do. So, why would someone store data on a blockchain? The advantage
    of storing data on the blockchain comes from its unique ability to allow multiple,
    independent parties to add data to a shared data storage. For this reason, the
    blockchain is sometimes referred to as a *distributed database*. For instance,
    ten private companies maintaining vaccination records could store them on a blockchain
    in order to share the data, ensuring that no client gets the same vaccination
    twice. A blockchain is *valid* when at least a majority of the companies involved
    agree that the blockchain is storing the data appropriately. You’ll find out exactly
    what this means later in the chapter.'
