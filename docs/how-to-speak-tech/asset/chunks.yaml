    to Roost’s ability to glean useful insights from massive amounts of data.


    Lastly, advances in cloud technology make it possible for IoT networks to share
    data and communicate. The IoT platform itself exists because multiple devices
    can communicate with a central piece of software on the cloud. IoT devices can
    store massive amounts of data in the cloud that would otherwise be impossible
    to store directly on the devices themselves. These servers can cheaply store large
