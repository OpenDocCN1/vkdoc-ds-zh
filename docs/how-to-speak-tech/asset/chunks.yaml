- fmt: '### Hardware


    Data is physically stored on some component of hardware—typically in secondary
    storage, such as magnetic disks. Storage hardware can be categorized in several
    ways: primary, secondary, and tertiary.


    `Primary storage` provides fast access to data because the computer’s central
    processing unit (CPU) directly interacts with it. The CPU carries out the instructions
    of a computer program, so think of it as the brain of the process or the executor
    of the program. When a computer performs a task that you requested, it first accesses
    primary storage for the specific instructions of what to do before the CPU executes.
    Terms associated with primary storage include `registers`, `cache memory` (also
    referred to as static random-access memory or RAM), and `dynamic RAM` (DRAM) or
    main memory. These various parts are associated with different tasks, but they
    all serve to keep data and programs that the CPU is actively using ready for execution.
    We say that primary storage is volatile because after the machine is turned off
    or is without power, the contents are lost. Primary storage is costly, however,
    and therefore tends to be limited in size.


    `Secondary storage`, by contrast, is nonvolatile, cheaper, and not directly accessed
    by the CPU. Because the data persists even after the computer is turned off and
    because we typically would like the safety of our data to be independent of our
    computer’s power, it may not be surprising to learn that secondary storage serves
    as our mass storage site. The CPU cannot directly access the contents on secondary
    storage; data must first be copied into primary storage before execution, a fact
    that highlights why accessing data in secondary storage tends to be slower. Hard
    disk drives, flash memory, and floppy disks are examples of secondary storage.


    `Tertiary storage` is similar to secondary storage in that it is not accessed
    directly by the CPU. It is used for massive data storage and is much slower than
    secondary storage.


    The key trade-off distinguishing these three classes of storage is access time
    vs. expense, a consideration touched on in the “Optimization” section at the end
    of this chapter.


    ### Software


    When users interact with MyAppoly, they will perform certain actions that you
    will want to save in your database. A `database management system` (DBMS) is responsible
    for defining the database and storing, manipulating, and sharing the data across
    users and applications.


    Think of DBMS as the head of file management, responsible for managing the requests
    of all of MyAppoly’s visitors. When a user clicks “accept friend” on Facebook,
    a request is created and directed at the database. The DBMS accepts and analyzes
    all requests before sending them along to the database, at which point they are
    `interpreted` (converted into a request the database can understand) and executed.
    The code that actually accesses the database on behalf of the DBMS is called a
    data sublanguage; one popular version is SQL.


    The DBMS provides a way to control for `concurrency` (multiple requests to the
    database happening at the same time), `redundancy` (the same piece of information
    stored multiple times in the database), `security`, `recovery` (protection against
    some sort of database failure), and `optimization` (timely handling of requests)—aspects
    that greatly improve the value to the developer.


    ### Users


    Your end users are the users of MyAppoly who, by interacting with the application,
    generate requests to the database in the background. When a new user registers,
    a database request is issued asking the DBMS to add a new user to the database.


    ## Three-Level Architecture


    You will also hear database systems described as an `architecture` consisting
    of three parts: the physical, the logical or conceptual, and the external. The
    physical layer is where the data is stored, the logical consists of how the DBMS
    interfaces with the application, and the external layer includes user interactions
    with the database.


    The three levels, three tiers, or three schemata of database systems are similar
    to our earlier database description, but it is helpful to understand jargon that
    might be thrown around in the context of database systems. It is also now easier
    to explain the database independence principle. The DBMS provides a form of abstraction
    so that users can interact with the database without needing to know the details
    of how the data is stored. As a result, any of the tiers can be changed in its
    implementation without affecting the entire system. Let’s say your programmer
    codes the application in a way that displays all of the names of MyAppoly users
    in a list. You would like all the users, however, to be displayed on a graph.
    It would be a pain for the programmer to rewrite requests to the database to get
    the information.


    Thanks to the data independence principle, your programmer can change the list
    to a graph, and it will not affect how the programmer interacts with the rest
    of the system. The change only affects the visualization layer and has nothing
    to do with how you get the data or how the data is stored. In summary, the system
    separates the management of data from the actual use of the data, which has several
    benefits. One could argue that the process of writing requests that get handled
    by a middleman (DBMS) before going to the database slows down the processing time,
    but the benefits outweigh the lag cost.


    ## Classification


    Criteria for classifying database management systems include the following, which
    are considered in turn in the succeeding sections:


    *   `Data model`: The data need to be stored in a way that accurately and efficiently
    describes the real world. Different types of models are discussed in the next
    section.

    *   `Number of sites`: `Centralized` and `distributed` are buzzwords you have
    probably encountered before. How they relate to databases is discussed in the
    section “Centralized vs. Distributed.”

    *   `Cost`: Solutions can run the cost gamut. Free and open-source solutions,
    such as `MySQL`, are available. Commercial solutions are offered to larger enterprises
    that want more customizable systems.


    ### Data Model


    There are several ways to store data in a database that are efficient and organized.
    Four of the most common data models are discussed in the following sections: the
    relational model, the non-relational model, the object-oriented model, and the
    object-relational model.'
