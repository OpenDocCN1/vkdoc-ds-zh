  trans: '

    #### 关系模型


    1969 年，埃德加·F·科德提出了一种名为*关系模型*的模型，该模型此后一直成为事实上的标准。`关系`不过是表格的数学术语，因此仅凭这一点，我们就能确定关系模型使用表格来表示数据。


    在关系模型（也称为实体-关系模型）中，任何存在的事物，如汽车、班级或商店，都是一个实体。每个实体都有属性，即表中的列：汽车有颜色，班级有名称，商店有位置。表中的每一行代表一个特定的实体（也可称为对象或记录）。在我们的用户表中，每一行描述一个`MyAppoly`的用户。这些列可以是名、姓、密码、地址和电子邮件地址等项。表通常有一个主键，即每一行的值都唯一的列，通常是为该实体分配的唯一
    ID。`MyAppoly`表中的唯一用户 ID 能让我们引用单个客户而不会产生重叠。大多数网站要求用户名唯一，这意味着用户名可以作为主键，而不是用户 ID。


    既然数据库能很好地为我们的实体及其关系建模，那么我们如何与数据库交互呢？通常，数据库及其特定表是通过使用 DBMS 及其数据子语言（用于与 DBMS 通信的语言）提供的特定操作符来修改的。与所有语言一样，子语言要求严格，需要以特定方式格式化请求，因此你必须非常清楚地说明你想要什么。例如，*结构化查询语言*（SQL）是由
    IBM 开发的一种专有查询语言（数据子语言），它现在是事实上的国际标准，并受到大多数关系型系统的支持。在 SQL 中，这些操作符包括`INSERT`（向表中添加条目）、`DELETE`（从表中删除行）、`SELECT`（检索已存储在数据库中的信息）和`UPDATE`（修改现有行）。


    有几个值得了解的命令可以实现更复杂的操作。一个例子是`JOIN`，它与`SELECT`配合使用。假设你有一个如上所述的用户表，以及一个名为 pets 的独立表，其中存储了所有用户的宠物数据。pets
    表中的每一行代表一只宠物，列包括名称、主人、颜色和类型。在这个例子中，pets 表的所有者列应对应于用户表中的一个用户。如果我想回答以下问题：“所有将蟒蛇作为宠物的用户的地址是什么？”这个请求涉及访问
    pets 表以检索所有拥有蟒蛇的主人，然后将你主人列表中的每个主人提供给用户表以获取他们的地址。通过使用`JOIN`操作，可以简化这个两步过程，该操作本质上是基于一个共享列将两个表合并。（在这个例子中，共享列是
    user 和 owner。）这个例子说明，鉴于关系型系统的结构，请求可能会变得复杂，但存在相应的操作让开发者找到他们问题的答案。


    刚才描述的查询语言和操作符是非过程性的，这意味着用户可以指定他们想要什么，但不一定指定 DBMS 应如何执行请求。我不确定你是否会对数据具体如何检索有强烈的看法，但从速度角度来看，这可能会很重要。


    为了全面起见，让我们回顾几个其他概念和术语。构成特定任务的一系列请求称为一个*事务*——例如，注册一个用户及其宠物所需的所有请求可以定义为一个事务。存在一些事务规则，这些规则并非关系型系统所独有，但将在此简要讨论。首先，事务是*原子性*的，这意味着它们是全有或全无的——要么用户完全注册成功，要么数据库保持不变。因此，即使过程因任何原因中途失败，表仍然保持一致，这意味着没有不完整的行或部分更新的记录。其次，事务是*持久性*的，意味着它们会立即更改数据库，并且更改在事务执行完成后立即可用。事务在数据库中反映的任何延迟都会对网站的整体体验产生负面影响；想象一下，每次你接受一个新朋友，你的
    Facebook 好友列表更新需要一周时间。第三，事务是*隔离性*的，意味着 DBMS 会将两个事务视为相互独立。设计一个符合所有这些约束的数据库很困难，但这些描述应该有助于你理解
    DBMS 如何处理请求。


    最后一个要提到的术语是*规范化*，它指的是消除数据库中冗余的过程。让我们回到用户和宠物表的例子。如果开发人员在宠物表中创建了一个名为“主人地址”的列会怎样？该信息不是已经保存在用户表中了吗？在这种情况下，地址列将是冗余的并浪费空间。虽然规范化可以帮助数据库用户节省内存，但它也可能需要更长的时间来获取查询结果。如果我经常提出之前关于所有拥有蟒蛇的人的地址的问题（那个我不得不使用`JOIN`的问题），我的立场可能会不同。`JOIN`操作可能代价高昂，因为
    DBMS 必须合并两个表，然后找到信息，根据表的大小，这可能是一个成本高昂的过程。创建一个冗余列可能更简单、更经济。这类决策可以由*数据库管理员*（DBA）做出，他们精确地了解请求是如何执行的。


    #### 非关系模型


    *非关系模型*，你可能已经猜到，不使用表格作为主要的数据结构。因此，这一类别涵盖了很多，包括网络型、层次型（想想家谱）和列表型。


    有一个值得特别提及的术语是`NoSQL`。关系型系统适用于更复杂的数据，其中的查询会涉及实体之间的关系（例如，用户与其宠物之间的关系）。相比之下，`NoSQL`系统往往非常适合存储大量简单数据，例如键值对（`firstName:
    Vinay`）。对于这些简单的用例，`NoSQL`提供了出色的性能和可扩展性。如果你的团队认为如此严格的关系型结构并非必要，并且你正在处理大规模数据的存储和检索，而存储项之间的关系不那么重要，那么`NoSQL`数据库管理系统就非常有用，可以说更有效。开源`NoSQL`数据库，如
    MongoDB 和 Cassandra，值得探索。

    '
- fmt: '### Object-Oriented Model


    *Object-oriented* *databases* center around the concept of the *object* (Chapter
    [3](#321739_2_En_3_Chapter.xhtml)) in the context of object-oriented programming
    languages. These objects describe entities, and each object consists of a series
    of properties or attributes describing it, as well as a series of actions that
    can be performed on each object (e.g., objects describing pet owners may be able
    to purchase a pet). As before, there has to be something unique about each object,
    so an `Object ID` is often used. You can think of encoding relationships between
    objects in the following way: the object describing a pet owner might store the
    `Object ID` of the pet object that describes the details of the pet. So if you
    want the details of user X’s pet, you could access user X’s object, get the user’s
    corresponding `pet ID`, and then access the pet object. These objects can sit
    in a hierarchy to give more structure to the system and take advantage of inheritance
    and other qualities associated with object-oriented models.


    Object-oriented models are powerful because they allow you to preserve the complicated
    nature of certain objects. In addition, they help separate the structure of objects
    from the operations you can apply to the objects. The details of how these models
    work are left for more technical works, but many of the terms discussed under
    “Relational Model” carry over to this one. For example, object-oriented models
    also have a query language: *Object Query Language* (`OQL`).


    ### Object-Relational Model


    Object-oriented aspects have found their way into relational systems to merge
    the best part of both worlds in *object-relational models*. In an object-relational
    system, you can define your own type, for example.


    ### XML


    As mentioned in Chapters [3](#321739_2_En_3_Chapter.xhtml) and [4](#321739_2_En_4_Chapter.xhtml),
    `XML` is a markup language that can be used to give structure to documents. Therefore,
    it can be used to define the structure of data and is a primary way data are communicated
    over the Web.


    ### Centralized vs. Distributed


    The client-server architecture describes the relationship between the end user
    and the DBMS. Clients consist of all the applications that interact with the DBMS,
    and the DBMS is the server that processes and executes the requests.


    The actual computer that stores everything can either be *centralized* or *distributed*
    in nature. When centralized, all requests come to a single server that houses
    all of the data. If this server were to go down for whatever reason, the application
    relying on it would not work, making the server a single point of failure. Therefore,
    as communication and database technologies improved, organizations realized there
    could be many benefits to a distributed system. Rather than having one central
    database server, what if we had multiple that could communicate with each other?
    In a distributed system, different parts of a single request could be executed
    on different machines within the distributed network of database servers. Though
    the data may rest in several sites all managed across a network by software, to
    the users of the application, the database would function as if it were centralized.
    To revisit our example, the `users` table and the `pets` table could theoretically
    be stored on different servers.


    A typical distributed system has several qualities, but some of the most important
    ones include local autonomy (every site should be independent of one another),
    no central site, local independence (users should not need to know where the data
    is stored), and pretty much any other property that allows it to function exactly
    like a centralized system.


    As is evident from the popularity of the word *distributed* in the technical world,
    distributed processing has become popular, and for good reasons. Benefits include
    the following:


    - *Superior rationality*: If you think about the typical organization, data already
    tends to be distributed. Whether it is spread across geographic offices or internally
    by division, databases have logical divisions. Therefore, if the other benefits
    are compelling, why not retain this distributed quality? It could allow each group
    to manage their data and their data alone without having to come up with a way
    to combine it all into a centralized server. It might make sense for Pepsi Asia,
    for example, to store some of its data in Asia.

    - *Improved efficiency and performance*: Intuitively, the processing of data is
    most efficient when done closest to the site where the request was given. Therefore,
    data should be stored near the people accessing it the most often. A distributed
    system can help with the most efficient allocation of an entire organization’s
    data. In addition, performance can be improved when queries are spread over multiple
    machines.

    - *Increased reliability*: Because information is available on various computers
    (several copies can be created as well), the probability that the entire system
    is down at any given point is much lower than in centralized systems.

    - *Adjustable expansion*: Distributed systems are horizontally scalable, which
    means it is easy to add more computers to the system. Say for MyAppoly you are
    currently using five computers around the United States to store information.
    It is much easier to add a sixth computer than it is to vertically scale, i.e.,
    adding more memory to a particular computer. Services such as Amazon Web Services
    (Chapter [2](#321739_2_En_2_Chapter.xhtml)) are so popular because they allow
    organizations to add and take away servers depending on demand. This seamless
    way to scale and shrink allows organizations to spend their resources more effectively.
    No sense in buying a lot of capacity when you only ever use that much capacity
    once in a while (e.g., when you have a promotion on your website).


    The drawbacks to such a system are fewer, but they exist. First, because data
    can reside in several sites, query processing that requires bringing together
    data across servers takes more time. Second, the various functionalities that
    the DBMS provides (security, concurrency management, and so on) tend to be more
    technically complicated in a distributed system compared to a centralized system.


    ## Other Topics


    Other database management requirements concern concurrency, security, and optimization,
    treated in turn in the next sections.


    ### Concurrency


    You do not want multiple database users to have conflicting requests. If a Facebook
    friend blocks you at the same time you send them a message, how will Facebook
    handle this? This question relates to *concurrency*.


    In the context of databases, *concurrent access* means that multiple users can
    access the database or multiple transactions can be processed at the same time.
    Because DBMSs support concurrency, they also need to be able to control the potential
    dilemmas that could arise when multiple transactions are trying to alter the database
    simultaneously.


    For example, how does Yelp handle two users adding a recommendation to a restaurant
    on Yelp at the same time? Knowing that DBMSs manage this is enough, but for more
    specifics, a few concurrency problems follow:


    - *Lost update*: When two transactions attempt to update the same value, one might
    be lost.

    - *Uncommitted dependency*: One transaction can access a value that was updated
    but not yet finalized by another transaction.

    - *Inconsistent analysis*: When two transactions have competing objectives, the
    steps might not be consistent with each other.


    These problems are typically solved with a concept known as *locking*, whereby
    a particular object or value will be locked and accessible only by one process.
    Locking adds wait time between each process to ensure no two transactions collide
    or interfere with each other.'
  raw: '#### Object-Oriented Model


    *Object-oriented* *databases* center around the concept of the *object* (Chapter
    [3](#321739_2_En_3_Chapter.xhtml)) in the context of object-oriented programming
