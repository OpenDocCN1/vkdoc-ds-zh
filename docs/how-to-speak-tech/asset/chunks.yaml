    In the end, choosing when to focus on desktop and when to focus on mobile depends
    on your product roadmap. Many products want to launch quickly, so they use a cross-platform
    solution to create a hybrid application, while some products focus on optimizing
    user experience and create a fully native application. For other products, a mobile
    website suffices. Deciding which route to choose depends on your bandwidth and
    your priorities. While creating a meaningful mobile experience for your users
    requires extra investment, it can drive user growth and satisfaction.


