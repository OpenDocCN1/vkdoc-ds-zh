  trans: '

    ## 高级语言的其他分类方式


    编程经验有助于理解以下描述，但核心要点在于：不同的语言是为不同类型任务而构建的。一种语言可能适合为金融投资者构建复杂的交易算法，而另一种语言可能最适合为教师构建一个简单的工具，用于对学生名单进行排序以评分。


    对不同类型的编程语言进行编码并非易事。如果我要求你用一个单一的系统来对世界上所有类型的狗进行分类，你会发现这是一项艰巨的任务。你可以尝试不同的方法，但不同群体之间不可避免地会出现重叠。就像拉布拉多贵宾犬和可卡颇犬一样，语言之间的重叠也非常广泛。尽管如此，以下关于高级语言的分类方式包含了你最常在技术领域听到的关键词：


    - **命令式语言**侧重于*如何*实现目标，通常以一系列创建和修改变量的指令形式编写。例如`C`和`Java`。这些语言与**声明式语言**形成对比，后者侧重于目标的*是什么*，而将*如何*实现留给编程语言本身。例如`SQL`和正则表达式。

    - **函数式语言**依靠函数和递归作为其主要计算方式，而不是存储变量或迭代。例如`CAML`、`Standard ML`、`Scheme`、`Lisp`和`Haskell`。

    - **面向对象语言**创建*对象*来存储信息并执行命令。例如，在一个学术应用程序中，程序员可能会为每个学生创建一个对象。该对象包含定义数据的*变量*，如学生姓名和导师，以及一组相关的函数（称为*方法*），这些函数描述计算机应如何检索学生的成绩或显示其课程。任何可能有用地描述学生的事物都定义在这个学生对象中。面向对象编程还实现了*抽象*，它允许程序员在一个地方定义共享属性。假设你现在想创建一个教师对象。它将包含一个用于存储教师姓名的变量，以及一种显示其课程的方法。请注意，这些与我们之前在学生对象中定义的内容是相同的。与其为学生重写变量和方法，不如创建一个“学术人员”对象，并让学生和教师成为特定类型的“学术人员”对象。面向对象语言的例子包括`Java`和`C++`。

    - **脚本语言**与命令式编程和面向对象编程有许多共同特性。这些语言是弱类型的，这个术语指的是它们在定义类型以及在不同类型之间进行转换时的灵活性。回想一下，变量需要被指定为特定类型，例如数字或字符，这样计算机才能按照我们期望的方式解释其底层字节。这种灵活性允许快速开发，但降低了可靠性（在下一节讨论）。像`Python`和`Ruby`这样的脚本语言可以轻松地与许多不同的系统交互，例如`API`和数据库（第
    6 章）。

    - **并行编程语言**允许多个执行序列同时进行。通常，并行性用于加速进程——同时评估两件事比逐一评估更快——或者用于响应可能同时发生的事件。

    - **查询语言**用于与数据库交互（第 5 章）。

    - **标记语言**使用*标签*和特殊字符为文档提供结构（第 4 章）。这种结构通常用于文档的可视化呈现。例如`HTML`和`XML`。


    ## 选择正确的语言


    你现在对编程语言及其不同类型有了更好的理解，但你可能仍然无法更接近为 MyAppoly 选择一门语言。语言设计原则是评估语言有效性的有用背景知识，但实际因素最终将决定你的选择。


    ### 技术及设计考量


    在评估编程语言是否适合你的需求时，首先要考虑其技术及设计参数，具体如下：


    - **应用的天然适配性**指的是基于语言提供的功能和结构，用特定语言编写应用程序的相对容易程度。面向对象编程语言变得流行，部分原因是它允许程序员以多种方式思考问题的解决方案，因此适合许多程序员的用途。

    - **可靠性**指的是程序每次以相同方式执行的能力。程序可能会遇到不同类型的错误（与计算机如何解释构成变量的字节有关），这些错误可能在你运行程序时（即在“运行时”）发生，也可能在编译时发生。在编译时捕获错误比在运行时捕获错误成本更低，但正如我们之前提到的，编译型语言通常需要更长的开发和执行时间。执行成本与可靠性之间的权衡是程序员经常面临的挑战（第
    11 章）。

    - **对抽象的支持**（如前所述）指的是以一种允许忽略许多细节的方式来定义和使用复杂结构或操作的能力。

    - **可移植性**指的是你的程序被转换成另一种编程语言的难易程度。例如，如果你在两种新的编程语言之间做选择，你可能会决定使用那种能更容易地转换成一种成熟语言的语言。

    - **效率**指的是代码执行所需的时间，这通常以牺牲抽象为代价。较低级的语言允许对内存使用进行更多控制，并为用户提供更优化的体验（第 11 章）。

    '
- fmt: '### Practical Considerations


    The following practical considerations will ultimately govern your selection of
    the programming language for building `MyAppoly`:


    - **Applicability**: If you have the wrong tool for the job, your code might become
    unnecessarily complicated.

    - **Documentation**: Documentation refers to resources that explain a language’s
    syntax (what specifically you need to type to get it to work), usage, and constructs.
    Languages that have thorough documentation are useful, especially if you and your
    team are learning to code as you go.

    - **Development time**: Historically, speed and memory usage were key factors
    in choosing a language, because processors were slow and memory was limited. Now,
    however, hardware is cheap and becoming cheaper. Because hardware is now less
    expensive than hiring a new programmer, organizations tend to prioritize development
    time over execution time.

    - **Reliably updated**: More popular languages, such as `PHP` and `Python`, tend
    to be updated regularly based on programmer feedback. Each update makes it easier
    to express instructions, expands the set of commands a programmer can use, or
    fixes issues in the language.

    - **Maintainability**: This practical factor relates to a language’s simplicity
    and readability. If `MyAppoly` is to last for a meaningful period of time, you
    will need to find new programmers to satisfy your growing needs. If understanding,
    updating, and correcting your code is a nightmare, your product can be severely
    delayed.

    - **Committed community**: Another benefit of popular languages is the community
    of programmers using it. If many people use the language, the chances are good
    that the behavior you are trying to implement has already been programmed by someone
    else. Forums and blogs (Stack Overflow is a popular example) are full of sample
    code to help you get your product up faster and more painlessly.

    - **Talent pool**: The committed community also comprises your target market for
    technical hires. If you choose an obscure language, your ability to scale up your
    team with people that know the language intimately will be limited.

    - **APIs, libraries, and tools**: A large community of programmers might post
    tools that you can directly plug into your program to save the time of programming
    it yourself (Chapter [6](#321739_2_En_6_Chapter.xhtml)). These tools support the
    development of web applications by equipping developers with functionalities that
    are common among all web applications.

    - **Integrated development editors (IDEs)**: This one-stop application has an
    editor for typing code, a source compiler to translate the code, a debugger to
    help spot any errors in the program, and a few other project management–related
    tools. The *programming environment*, or the collection of tools used to develop
    a product, is important, and choosing a language with better support can help
    your programmers be more efficient.


    ## Conclusion


    While debating which language to use for `MyAppoly`, you realize that tech startups
    have increasingly begun to prioritize development time over almost all other considerations.
    There are two primary reasons: hardware is constantly becoming cheaper (Chapter
    [14](#321739_2_En_14_Chapter.xhtml)) and popular product development doctrines
    dictate rapid iteration (Chapter [8](#321739_2_En_8_Chapter.xhtml)). Your competitors
    are building as fast as they can. Conscious of your need to be the first mover,
    you expeditiously consider all of the factors set out in this chapter and settle
    on the most popular scripting language of the day. You have little time to waste.


    Footnotes [1](#321739_2_En_3_Chapter.xhtml#Fn1_source) [2](#321739_2_En_3_Chapter.xhtml#Fn2_source)


    # 4. The Front End: Presentation


    Knowing which language to use is helpful, but without a front end, a user cannot
    do anything. Recall that the front end is the interface for users to interact
    with the back end. It refers to what you see and the range of interactions you
    can perform on a given web page. You start to think about how `MyAppoly` will
    look, which pages you want, and how they will be connected (e.g. button A on page
    1 takes you to page 9). Then, you finalize a set of features you want to include
    in `MyAppoly` and develop wireframes of each web page.


    Wireframes are simple blueprints for a screen. Putting together wireframes forces
    you to think about information design and interaction design. *Information design*
    relates to how you present all of the content or messaging you want to communicate
    to the user. *Interaction design* refers to the series of actions you want the
    user to perform to complete some overall task. For example, the placement of product
    descriptions and reviews on a site such as Amazon falls under information design,
    while the flow through which a user reviews an item, adds it to the cart, and
    ultimately purchases it relates to interaction design.


    As you design your front end, you’ll also want to consider the user interface
    and the user experience. The *user interface*, frequently abbreviated as `UI`,
    refers to how the application looks. A good `UI` makes an application intuitive
    to use, whereas a bad `UI` may be cluttered or confuse the user. The *user experience*
    (`UX`) refers to how users feel about using your application; you should always
    strive for a positive user experience, which generally comes from having a back
    end that works well, an easy-to-understand `UI`, and information and interaction
    designs that are well thought-out.


    You review the mock-ups for `MyAppoly` with your CTO. In effect, you have created
    a paper version of your website. Great! How do you get your website to look like
    that? How will you create the interactive effects that you see on most modern
    web pages? Certain languages and tools have become so ubiquitous that it is worth
    learning the basics because together they form the presentation layer and define
    what your users will experience.


    ## Front-End Technologies


    The standard front-end tools for creating the presentation layer include `HTML/XHTML`,
    `CSS`, `JavaScript`, and `Ajax`.'
