    # 13. 移动基础


    特别感谢 **Ashi Agrawal** 和 **Cheenar Banerjee** 为本章做出的贡献。


    到目前为止，我们都假设 MyAppoly 仅作为一个网络应用程序存在，但现实是，许多产品——比如 Snapchat 或 Lyft——部分或完全以移动形式存在。这些公司优化了其应用程序在你手机上的体验。手机是一种随身携带的小型设备，配备了一套与传统计算机不同的工具。我们之前讨论的许多结构仍然相关，但一个成功的移动应用程序所做的不仅仅是复刻桌面体验：它是专门为移动设备构建的。那么，让我们深入探究移动开发的复杂性吧！


    ## 简要介绍


    自 20 世纪 70 年代手机发明以来，手持计算机的能力迅速增长。黑莓设备在 21 世纪初因其超越短信和通话的能力（包括对电子邮件的关注）而声名鹊起。随后，随着智能手机的出现，用户能做的事情呈爆炸式增长，远不止拨打电话。现在，我们通过这些极其便利的设备追踪健康、设置闹钟、呼叫拼车服务。本章重点讨论智能手机，但移动设备也包括手持计算机。


    移动应用构成了一个蓬勃发展的市场。2018 年，全球手机用户数量突破了 50 亿大关。^(²⁴) 在网站方面，移动设备带来的流量超过了桌面设备，^(²⁵)
    预计到 2020 年，移动应用每年将带来近 2000 亿美元的收入。^(²⁶) 这令人兴奋，但究竟什么是移动应用？它是特意设计并编写、在移动设备上运行的程序。正如我们将看到的，移动应用可以打开新的机遇之门，但也带来了新的考量因素和限制条件。


    ## 为何要为移动平台开发


    在深入探讨*如何*开发移动应用之前，你需要理解*为何*以及*何时*开发移动应用。在某些情况下，这是显而易见的——例如，拼车和地图应用具有明确的移动使用场景，这对成功至关重要。对于其他产品来说，情况并非如此非黑即白，但在产品路线图中考虑移动端通常是合理的，因为它可以使功能和用户群多样化并得到增强。以
    MyAppoly 为例，你的团队决定需要单独的移动端存在来吸引新用户。


    虽然 MyAppoly 首先构建了一个桌面网络应用，但有些应用则默认将移动端特有的功能和限制作为设计基准。这个过程被称为**移动优先开发**，它能带来更好的移动用户体验，以及更简洁、更极简的桌面设计。移动端设计在屏幕上容纳更少的元素，这很容易转化到桌面端；但从桌面端转向移动端意味着设计者必须思考要移除什么。


    ## 移动应用 vs. 桌面应用


    移动应用与我们一直在讨论的网络应用非常相似。与传统网络应用一样，移动应用也有前端和后端。两者也都使用 API 和其他外部资源。在本章中，我们将传统网络应用称为**桌面网络应用**。也有一些可以下载的桌面应用，比如文字处理器或电影剪辑软件，但本文主要比较移动应用与桌面网络应用。


    为移动设备开发和为桌面设备开发之间存在显著差异。让我们概述这些差异，以理解为什么需要创建单独的移动端。这两个平台主要有四个方面的差异：尺寸、交互方式、功能特性及便携性。让我们逐一深入探讨。


    -   **尺寸**：移动设备屏幕比桌面屏幕小得多，这限制了每页的内容量。移动应用的用户界面必须相应调整。例如，许多移动应用采用可折叠菜单来节省屏幕空间，而桌面网络应用则显示大型菜单栏以展示所有选项。


    -   **交互方式**：我们与移动设备的交互方式也与桌面设备不同。我们使用鼠标或触控板在桌面屏幕上导航，并使用单独的物理键盘打字，而现代智能手机我们则使用触摸操作。


    -   **功能特性**：移动设备配备了一套与传统笔记本电脑不同的本地或内置功能。这通常包括摄像头、定位服务、蓝牙和推送通知系统。因此，我们可以为移动应用创建一套完全不同的功能，例如，Instagram
    最初在移动设备上推出，因为大多数人主要使用手机拍照。


    -   **便携性**：便携性意味着人们会随身携带并在任何地方使用他们的智能手机。因此：(a) 内容的呈现需要简洁，(b) 存在更多实时用例，以及 (c)
    蜂窝数据与宽带互联网不同。让我们进一步详细探讨这些点。人们通常会在短时间内浏览手机，因此用户交互需要快捷。菜单层级在桌面网络应用中能提供更多选择，但对于时间紧张的人并不实用。由于人们会随时查看手机，移动应用可以专注于实时操作，比如拼车。最后，应用通常通过蜂窝数据访问互联网，这可能比
    Wi-Fi 或以太网更慢且更不可靠。因此，移动应用可能需要针对速度进行优化。由于有众多移动应用争夺用户的时间，用户可能会在等待一个缓慢的应用时转而使用其他应用。


    由于这些差异，我们在创建移动内容时，必须批判性地思考移动开发所带来的限制，以及其拓展出的可能性和机遇。


    ## 移动应用的类型


    主要有三种类型的移动应用：**网络应用**、**原生应用**和**混合应用**。这三种都很常见，而最适合开发的应用类型取决于产品本身。本节将讨论每种类型的技术基础及其向用户呈现的方式。

    '
- fmt: '### Web Apps


    Mobile web applications, web applications that the user accesses by opening a
    URL in a web browser like Safari or Chrome, are the closest to desktop web applications.
    They often go by a more familiar name: mobile websites. For many products, these
    applications simply use a different front-end wrapper around the same back-end
    powering the desktop web application. Other products use one responsive website
    for both desktop and mobile devices. Responsive websites change based on the screen
    size of the device, which could also be a tablet or a rotated mobile device. Elements
    on-screen automatically scale, hide, or move to provide a good user experience
    across different devices.


    While mobile websites are often relatively easy to develop on top of a desktop
    website, they run relatively slowly because they run within a browser rather than
    directly on the device itself. Furthermore, they have limited access to the native
    features that often make mobile apps so powerful. As a result, many companies
    have started to make standalone mobile applications.


    ### Native Apps


    A native app is written to run directly on a phone’s operating system. The two
    most popular operating systems are Android and iOS, which are developed by Google
    and Apple respectively. While some phones run Windows or Linux-based operating
    systems, the vast majority run either Android or iOS. Native applications are
    usually downloaded via an app store and appear as icons on the phone screen. Because
    native applications run directly on the phone, they do not use a browser intermediary
    and therefore run more quickly than mobile web apps do.


    A prominent reason that developers write native applications is the ease of utilizing
    additional features, including the camera and GPS. These features, unlike an external
    back end or API, can be accessed offline and allow the application to have offline
    capabilities. Native apps can also use local device storage to store an offline
    database that persists between different uses. These applications track and save
    user interactions and don’t need Internet service to serve content, such as locally
    stored photos or notes—think of a gallery app or a music player.


    Additionally, this local database can be useful in serving personalized content.
    While desktop web applications can store information for personalization, they
    generally use user accounts, like linking all of your past purchases together
    in a rewards membership. Since people use multiple browsers or computers but use
    just one phone, a user account for a mobile application is usually just the set
    of interactions that take place on that particular phone. As a result, many mobile
    applications can remove mandatory sign-in, which is often a barrier to entry for
    new users.


    A final note about native apps is that they have more built-in security precautions
    than web applications. Mobile operating systems provide additional security measures
    to standalone apps that they cannot give to mobile websites. Apps also have to
    pass a review process to qualify to be available for download from the app store
    in the first place, while there’s no such verification system for mobile websites.
    ^([^(27)](#fn27)) However, native mobile applications can provide a more valuable
    target to attackers since they have access to more features than mobile websites
    do. Both mobile apps and mobile web apps are susceptible to security breaches,
    so it pays to be mindful regardless of the route you choose.


    ### Hybrid Apps


    The final category of mobile applications is hybrid apps, which combine aspects
    of native and web apps. Like mobile websites, hybrid apps run using a web browser,
    though here the browser is built into the app using a `web view`. As a result,
    hybrid apps are not as fast as native applications. However, they have some native
    benefits, like access to device-specific features such as the camera and GPS.
    Furthermore, hybrid apps are downloaded from an app store and appear as standalone
    icons on phone screens. Some hybrid applications are written using desktop web
    technologies, meaning they can be easier to write if a desktop web app already
    exists.


    While hybrid apps can leverage native technologies and can be easier to write,
    they come with a different set of drawbacks. Using a separate `web view` is slow
    and doesn’t allow access to all device features. Additionally, since these `web
    view`s use web technologies, their designs often don’t comply with device design
    rules. Even when the `web view`s abide by these rules, they can be difficult to
    use. Companies often create hybrid applications earlier in their development cycle
    to spin up something lightweight and then switch to a native application in the
    long term. Hybrid apps are also popular options for teams with web development
    experience but no mobile platform-specific expertise or for simple applications
    that can sacrifice speed.


    Now that we’ve discussed the high-level differences between web, native, and hybrid
    apps, we’ll discuss development for standalone applications (native and hybrid
    apps), since they are written using different technologies from desktop apps.


    ## Standalone Application Development


    Standalone applications refer to applications that are accessed via their own
    icon instead of by web browser. These applications can be written specifically
    for the operating system they run on or more generally for all smartphones. This
    section outlines each approach and the relative benefits and drawbacks.'
