    # 电子邮件提供商的反钓鱼策略


    电子邮件提供商不断将新的反钓鱼策略整合到其服务中。自然语言处理、机器学习和其它模式匹配技术已被成功用于查找钓鱼邮件并将其标记为垃圾邮件。虽然我们目前讨论的钓鱼攻击需要一定程度的技术知识，但许多攻击者会使用非技术途径。其中一个例子是语音钓鱼（也称为`vishing`），这是一种通过电话进行的钓鱼形式。在一种极为成功的攻击手法中，攻击者冒充国税局（IRS）工作人员通过电话威胁收件人，声称除非他们在所谓的官方
    IRS 网站上进行付款，否则将被逮捕。当然，这笔钱最终落入了攻击者手中，而非 IRS。


    要保护自己免受钓鱼攻击，你必须保持警惕。不要打开来自未知发件人的电子邮件或带有可疑主题行的电子邮件；虽然垃圾邮件过滤器已经取得了很大进步，但它们并非完美无缺。此外，良好的做法是避免在电话或电子邮件中透露个人信息。如果必须向他人提供此类信息，请完全确认你正在与真正的权威人士进行通信。


    在本节中，我们探讨了攻击者如何通过社会工程和钓鱼攻击来获取访问用户数据的权限。其他常见的机密性攻击包括数据包嗅探（`packet sniffing`）、端口扫描（`port
    scanning`）和键盘记录（`keylogging`）。在考虑保护你的机密性时，请考虑锁定访问你信息的入口点（最直接的方式是在不使用时锁定你的电脑或手机），包括锁定你自己。接下来，我们将研究针对消息完整性的攻击。


    ## 完整性


    在小学游戏“电话”中，一条消息通过耳语在人与人之间传递。正如你可能想象的那样，随着人们传播他们自己的误解（然后这些误解又被进一步误解），消息很快会变得面目全非。虽然这不是故意的，但这个游戏经常损害原始消息的完整性。这里的完整性指的是消息的可信度：消息接收者可以相信他们收到的消息未经篡改，并且来自他们所期望的发送者。由于冒充另一个安全用户存在难度，完整性攻击通常在技术上较为复杂。本节我们将讨论三种类型的攻击：中间人攻击、注入攻击和伪造攻击。


    ### 中间人攻击


    中间人攻击（即`man-in-the-middle`）发生在攻击者拦截了发送者和接收者之间的消息时。一个例子是重放攻击（`replay attack`），攻击者查理（Charlie）窃听爱丽丝（Alice）和鲍勃（Bob）之间的通信以窃取秘密（例如密码）。然后，在后续的交易中，查理可以利用这个秘密来冒充爱丽丝。在那次交易中，鲍勃认为消息来自爱丽丝，但消息的完整性已不复存在，因为它实际上是来自查理的不同消息。重放攻击展示了攻击如何可能同时属于多个
    CIA 类别；虽然重放攻击针对的是消息的完整性，但查理知道爱丽丝的秘密也使其成为一种机密性攻击。


    ### 注入攻击


    注入攻击涉及攻击者通过提供恶意输入，经由应用程序运行破坏性代码。例如，考虑一个使用用户输入来执行 SQL 数据库查询的 Web 应用程序。攻击者可能能够输入有害代码，导致应用程序运行一个破坏性查询。这个查询可能会摧毁整个数据库。注入攻击非常普遍且破坏性极大，以至于在开放
    Web 应用程序安全项目（OWASP）2017 年十大最关键的 Web 应用程序安全风险列表中，该类别被列在首位。^(¹⁹)


    跨站脚本攻击（`XSS`）是另一种类型的注入攻击。在`XSS`中，攻击者在网站上插入代码以捕获敏感信息，通常是`cookie`。请记住，`cookie`是一种基于字符串的令牌，网站用其保存用户特定的设置和认证信息。想象一下，你的网站渲染了用户提交的
    HTML 格式评论的最后一条结果。该评论可能包含一个带有 JavaScript 脚本的`<script>`标签，该脚本会窃取访问该页面的任何用户的`cookie`。当新用户加载页面时，这个脚本会自动运行，攻击者随后便能够利用这些窃取到的`cookie`冒充受害者，进行身份盗窃。


    ### 伪造攻击


    伪造攻击包括攻击者冒充用户的攻击。虽然中间人攻击中也存在冒充行为，但那些攻击针对的是两方之间正在进行的交换，而伪造攻击则侧重于单向通信渠道。例如，跨站请求伪造（`CSRF`）利用了用户到网站的单向通信。`CSRF`利用了`cookie`在你离开网站后仍然保持活跃、允许网站在你返回时识别你的这一事实。假设你最近访问了你最喜欢的购物网站；即使你已经离开该网站，它仍保留着一个`cookie`。攻击者可能诱使你点击钓鱼邮件中的链接，或通过`XSS`运行一个脚本，该脚本向购物网站发送一个恶意请求（例如删除你的账户）。由于`cookie`尚未过期，网站可能允许此请求执行。防止此类攻击的一种标准方法是发放一个隐藏的、会话特定的令牌（称为`CSRF
    token`），该令牌仅允许当用户（而非其他任何人）当前正在该网站上时才允许请求执行。


    ## 总结与防御


    作为要点，永远不要信任用户，尤其是他们的输入。你应该通过要求输入符合特定模式（例如，银行会检查请求的存款和取款金额是否为合法的非负十进制数）来验证他们的输入。通过验证输入，你可以降低黑客向应用程序注入代码或以其他方式造成有害结果的风险。对于许多完整性攻击，深入了解你所用的特定技术栈（即你的应用程序所使用的编程语言和框架）对于理解攻击者可能注入代码的漏洞至关重要。


    本节讨论了可能是技术上最复杂的安全攻击——完整性攻击。我们研究了中间人攻击、注入攻击和伪造攻击，这些攻击试图注入攻击者的代码并造成破坏性后果。其他完整性攻击包括数据篡改（`data
    diddling`）和切片攻击（`salami attack`）。为了保护自己，我们学会了严格验证用户的输入，并确保我们所做的任何假设都是真实的。我们的最后一节将讨论针对数据可用性的攻击。

    '
- fmt: '### Availability


    Every small, struggling company dreams of the day their application becomes popular
    and their traffic spikes 100 times. Congratulations—it’s happening to you! Unfortunately,
    your servers aren’t set up to handle this much traffic. They crash, bringing down
    your site. In 2013, this happened on a catastrophic scale: [healthcare.​gov](http://healthcare.gov)
    buckled under the pressure of millions of Americans trying to sign up for the
    Affordable Care Act. Luckily, a group of engineers saved the site and successfully
    enrolled millions in healthcare insurance, but not before the underlying infrastructure
    caused heartache and frustration across the nation. When an application is unable
    to handle traffic like this, it’s known as a denial-of-service. Since resources
    cannot be reached in such a situation, it is said to compromise the availability
    of the resources.


    Some attackers intentionally cause denial-of-service by sending fake requests
    to your application until it crashes, leaving legitimate users without access.
    Such an attack is known as a denial-of-service (DoS) attack. While the only way
    to combat a legitimate denial-of-service is to expand the amount of traffic your
    application can handle, you can prevent or counter a denial-of-service attack
    by blocking destructive requests. There are two main components to a successful
    anti-DoS plan. The first is to define a set of expected traffic patterns, and
    the second is to remove traffic that doesn’t match these patterns.


    A straightforward way of doing this is by tracing the servers originating the
    attackers’ requests and blocking all traffic from those servers. However, this
    becomes difficult in the most common iteration of a DoS attack, a distributed
    denial-of-service (DDoS) attack. In a DDoS attack, the malicious requests originate
    across many servers, making it trickier to create patterns that successfully filter
    them out. Services such as Cloudflare use advanced pattern creation techniques
    such as machine learning to protect your application from DoS and DDoS attacks.


    Attackers also use ransomware to target availability of data. Ransomware is software
    that denies users access to their data, sometimes just by locking their computers
    (annoying but relatively trivial for a security professional to address). More
    often, however, ransomware extracts and encrypts users’ data, after which the
    attackers demand a ransom in exchange for returning the decrypted data. As we’ll
    learn in the next section, it is nearly impossible to break well-done encryption
    without its decryption key, so victims must resort to paying the ransom to recover
    their data.


    Availability attacks are especially dangerous for hardware devices that contain
    code or connect to the Internet. Stuxnet, a computer worm, destroyed hundreds
    of thousands of centrifuges (lab equipment) by targeting machines running a specific
    kind of software and forcing the corresponding centrifuges to spin themselves
    to death. Attacks like Stuxnet fall under control system security, which focuses
    on industrial systems. While broken centrifuges are replaceable, attacks on control
    systems can take down large-scale systems like hydraulics or dams, with far-reaching
    consequences.


    This section examined attacks that don’t access or manipulate data but instead
    prevent the intended recipients from viewing and using the data. Other availability
    attacks include physical electrical power attacks and session hijacking attacks.
    Validating the requests we receive and filtering out any that seem suspicious
    is critical for stopping availability attacks.


    While the CIA Triad is a useful framework for finding vulnerabilities and brainstorming
    ways hackers may want to steal your information, it cannot exhaustively account
    for all attacks. Therefore, it is of the utmost importance to stay in the know
    about best-practice security protocols by attending conferences such as Black
    Hat or Defcon, reading papers, and staying up-to-date on the technology capabilities
    and flaws of the services you use. The US National Institute of Standards and
    Technology (NIST) and the European Union Agency for Network and Information Security
    (ENISA) are also excellent resources for information on cybersecurity protection.


    ### Precautions


    Luckily, there are precautions that can help you secure your application. While
    these widely accepted security practices go a long way, they aren’t comprehensive
    and this section serves more as an overview. You should have a security team dedicated
    to strengthening your security practices and dealing with attacks.'
