    in centralized networks and leaves individuals to fend for themselves. This is
    an important consideration to keep in mind when engaging in decentralized networks,
    especially those that involve high risk. Currently, the most popular decentralized
    network built on a blockchain is the Bitcoin cryptocurrency.'
  trans: '

    术语 `miner` 用于表示参与挖矿过程的各方。然而，“矿工”一词并不能很好地说明其工作的目的。矿工的主要目的是在缺乏中央权威的情况下维护区块链的有效性。如上所述，矿工需要经历一个计算密集型过程，才能找到新区块的数字指纹。这个过程替代了中央权威（中央权威会规定哪些区块是有效的，并且包含应附加到区块链的数据）。具体如何实现这一目标，不同区块链有所差异，但最流行的方法见于比特币区块链，本章后续将详细说明。矿工并非坐在桌前逐个迭代哈希值的个人：矿工是在（性能非常强大的）计算机上运行的软件，该软件会自动以每秒数百万、数十亿甚至数万亿次的速度迭代哈希值。这些计算机由独立的个人或公司拥有，他们通常因运行挖矿软件而获得奖励。例如，在比特币中，矿工每为新区块找到有效的数字指纹，就能创建并收到新的比特币。因此，他们通过履行矿工的职责，既能生成新币，也能赚钱。然而，并非所有区块链在新区块被找到时都允许矿工生成新币，有些区块链甚至根本不设矿工奖励。在这种情况下，矿工被称作
    `验证者`。


    ## 区块链的不可篡改性


    区块链有时被称为 `账本`，源于其记录数据修改的方式。试想一下，在电子表格或传统数据库中，你会如何更改某个值，比如用户的银行账户余额。你很可能直接覆盖该单元格或数据字段，用新值替换旧值。这种修改数据的方法在区块链上是行不通的。你不会覆盖区块中的数据，而是向区块链附加一个新区块来修改该数据。因此，就像账本一样，区块链记录了有史以来发生的每一次数据变更。区块链的这一固有属性被称为
    `不可篡改性`。请注意，这并非意味着区块链不能增长：恰恰相反，区块链之所以不可篡改，正是因为其允许修改所持数据的唯一方式就是通过添加新区块，即通过增长来实现。比特币区块链大约每
    10 分钟增加一个区块，但一旦某个区块经过验证并附加到区块链上，理论上它就应该永远保持不变。图 16-1 展示了这一过程的一个示例。


    ![../images/321739_2_En_16_Chapter/321739_2_En_16_Fig1_HTML.jpg](img/321739_2_En_16_Fig1_HTML.jpg)


    图 16-1. 区块链上的数据修改


    如果我们把图 16-1 视为一个区块高度为 3 的区块链的当前状态，那么 Alice 目前有 7 分。请注意，我们并没有简单地更新第一个区块中 Alice
    当前的总分数，而是每次她的总分改变时都添加了一个新区块。因此，区块链起到了一个包含交易历史或数据操作历史的账本的作用。由于其不可篡改的特性，区块链有时被称为
    `不可篡改账本`。


    区块内的数据以及区块的顺序（称为`区块顺序`）都是不可篡改的。在上面的例子中，由于加法是可交换的，顺序似乎无关紧要，但区块链通常由复杂的规则管理，这些规则要求不可变的顺序。例如，假设管理上述区块链的一条规则是：任何用户都不允许拥有超过
    10 分。如果顺序被以某种方式打乱，并且区块 #2 和区块 #3 交换了位置，那么 Alice 在现在的第二个区块中就会有 12 分，这将使该区块出错。这个错误的区块，被称为`无效区块`，会使整个区块链失效。因此，理论上，区块顺序和区块数据在区块链中都不应更改。


    ## 去中心化


    如前所述，区块链是一种有吸引力的数据存储方式，因为它允许多个独立的参与方在缺乏中央权威的情况下共享一个数据库。这意味着没有数据的主副本，没有决定可以或应该添加什么数据的中央权威，也没有单点故障。这种网络被称为`去中心化网络`，因为它缺少一个中心枢纽。这种网络与大多数社会的结构方式相悖。以美元等货币为例：它由一个中央政府支持，由中央银行控制，并通过充当中心化中介的银行进行交易。当我们使用美元时，我们信任这些中心化机构能够诚信行事，并履行其承诺的职责。一旦中央银行未能履行其职责，货币就会崩溃。例如，2008
    年津巴布韦的货币政策导致了恶性通货膨胀，津巴布韦元失去了其所有实际价值，就发生了这种情况。另一方面，像比特币这样运行在区块链上的货币，没有中央政府或中央银行来控制其功能。相反，区块链技术被用来将这些传统上中心化的角色分散给共同维护网络的矿工。换句话说，区块链技术允许存在一个`无需信任的网络`，在这个网络中，你无需信任任何人，却仍能确信系统的完整性。


    尽管在区块链技术之上构建的去中心化网络有许多好处，但也需要牢记缺乏中央权威所带来的影响。如果你不小心将比特币发送给了错误的人，或者觉得自己被骗了，没有中央权威可以求助以追回你的比特币。同样，也没有银行可以为你的资金安全作担保，或协助你进行大额转账。去中心化网络移除了中心化网络中中央权威提供的安全保障，让个人只能依靠自己。在参与去中心化网络时，特别是那些涉及高风险的网络，这是需要牢记的一个重要考量。目前，构建在区块链上最流行的去中心化网络是比特币加密货币。

    '
- fmt: '# Bitcoin: The Genesis of Blockchain Technology


    Bitcoin is a *cryptocurrency*, a form of digital money, that uses the blockchain
    to function as decentralized money. Bitcoin, along with most cryptocurrencies,
    is, therefore, an application of blockchain technology—currently the most popular
    application. Bitcoin is the oldest cryptocurrency and currently has a market cap
    of over a billion US dollars. In fact, blockchain technology arose from the creation
    of Bitcoin: the inventor of Bitcoin, an anonymous individual or group of people
    publishing under the alias *Satoshi Nakamoto*, invented blockchain technology
    to serve as the transaction ledger for Bitcoin. Before this invention, digital
    currencies were either centrally controlled or could be very easily manipulated
    and destroyed. Only after Bitcoin’s creation did people realize the potential
    of blockchain technology in other domains.


    Bitcoin was invented in 2008 when Satoshi Nakamoto published a white paper entitled
    “Bitcoin: A Peer-to-Peer Electronic Cash System.” A year later, in 2009, Nakamoto
    published the first piece of Bitcoin code. The code was released as *open source*,
    meaning that anyone could read it and suggest improvements to it, which resulted
    in a community-driven effort among programmers to constantly improve the Bitcoin
    code. Nakamoto’s publications were made on an online forum for peer-to-peer technology
    enthusiasts. *Peer-to-peer technology* is a type of technology that is intended
    to run without the need for a centralized authority or server. Fiat currencies,
    such as the US dollar, are not peer-to-peer networks, because banks act as central
    authorities and oversee all transactions, the storage, and the creation of money.
    As discussed earlier, Bitcoin is a peer-to-peer network without a central authority
    that dictates the validity of transactions or maintains the power to shut the
    system down. No individual or institution can manipulate or exert control over
    Bitcoin. As such, Bitcoin is a *decentralized network*.


    The key invention that Nakamoto made in Bitcoin was the *proof-of-work algorithm*,
    which lays the foundation for how Bitcoin as a network achieves consensus or,
    in other words, agrees upon which transactions are valid and which are not. In
    fiat currencies, this is not a problem, because banks centrally stipulate validity:
    if you try to send someone money that you do not have or if you try to spend your
    money twice, your bank will prevent you from doing so. Therefore, when using a
    fiat currency, you trust banks as central authorities to make correct decisions
    about transaction validity. In Bitcoin, however, *trust is decentralized*, meaning
    you can trust no one in the network yet still be certain that no invalid transaction,
    such as someone stealing your Bitcoin, will take place. To attain this, Nakamoto
    invented proof-of-work as a mechanism through which *distributed consensus* is
    reached, whereby the Bitcoin network agrees on a set of rules that dictates transaction
    validity. These rules are rooted in mathematics, specifically in cryptography.


    To understand Bitcoin’s distributed consensus, it is important to understand some
    basic demographics of the Bitcoin network. The users of the Bitcoin network are
    loosely divided into two groups. The first, larger group is comprised of the regular
    users who send and receive Bitcoins; the second, smaller group is comprised of
    the *miners* whose job is to validate transactions and group them into blocks,
    which are then appended to the Bitcoin blockchain. In theory, anyone can become
    a miner and thereby contribute to Bitcoin’s distributed consensus.


    Miners have tangible incentives to continue performing their job of mining new
    blocks. Each time a miner successfully mines a new block, they reap the *block
    reward*. The block reward is a predetermined amount of Bitcoins that are created
    in the new block and sent directly to the miner. This special type of transaction
    is known as the *coinbase transaction*. Currently, 12.5 Bitcoins are created in
    every new block and sent directly to the miner. The block reward halves every
    210,000 blocks. On top of the block reward, the miner of the block receives all
    *transaction fees* that are contained within the block. Every Bitcoin transaction
    contains a transaction fee, which is designated and paid by the user sending Bitcoins.
    The higher a designated transaction fee, the quicker the transaction will be confirmed
    on the Bitcoin blockchain because of the greater incentive for miners to include
    it in their blocks.


    Next is a walkthrough of the process of how Bitcoin as a currency can work without
    a central bank or government.


    ## How Bitcoin Works


    The process of how Bitcoin as a currency works can be abstracted into five steps.


    ### Step 1: A New Transaction Is Created


    Alice wants to send 5 Bitcoins to Bob for a new car she purchased. Normally, if
    Alice used a fiat currency such as the US dollar, her bank would transfer the
    funds to Bob’s bank. Alice’s bank would remove the money from her account, and
    the money would appear in Bob’s bank account. With Bitcoin, however, there are
    no banks, and so the process of transferring Bitcoins is very different. Let’s
    walk through how it happens.


    To begin, each Bitcoin user has a *private key* which needs to remain personal
    and secret. The private key is used to sign all transactions made by the user.
    This is an important part of Bitcoin because, in the absence of banks, it serves
    as the mechanism through which a user exerts control over their money. Each user
    uses their private key to verify their ownership of their Bitcoins when sending
    them. In other words, this private key is used to unlock the user’s Bitcoins.
    If the private key is lost or stolen, the user loses access to his or her Bitcoins.


    The *private key* is a random 64-character-long hexadecimal number (note that
    this is different from the digital fingerprint of a block). There is no central
    database that stores all existing private keys. If you are concerned that someone
    might create the same private key as the one you are already using—don’t worry!
    There are `2^(256)` private keys available, which is more than the number of atoms
    in our universe. The probability of someone randomly generating a private key
    that is identical to yours is lower than that of you walking outside right now
    and being killed by a falling piano.


    A *public key* is generated from the private key using elliptic curve cryptography,
    an advanced approach to cryptography. This public key is then hashed and encoded
    to create a unique *Bitcoin address* for each user. The Bitcoin address is meant
    to be public as it is the address to which you receive Bitcoins. In our example,
    Bob would have to give Alice his Bitcoin address (Table [16-2](#321739_2_En_16_Chapter.xhtml#Tab2)).


    | Private key | `e9873d79c6d87dc0fb6a5778633389f4453213303da61f20bd67fc233aa33262`
    |

    | Bitcoin address | `1BoatSLRHtKNngkdXEeobR76b53LETtpyT` |


    Alice verifies ownership of her 5 Bitcoins by using her private key to create
    a *cryptographic signature* of the Bitcoin transaction. This cryptographic signature
    serves as proof that Alice did indeed send 5 Bitcoins that were hers to Bob. Any
    miner can verify that Alice did indeed sign the transaction by using Alice’s public
    key to verify the transaction data. Hence, Alice never needs to share her private
    key.


    Once Alice signs the transaction, her *Bitcoin client* (the piece of software
    Alice uses to handle Bitcoin payments) broadcasts the Bitcoin transaction, containing
    information that it is meant for Bob, to the Bitcoin miners through a *gossip
    protocol*.'
  raw: '## Bitcoin: The Genesis of Blockchain Technology


    Bitcoin is a *cryptocurrency*, a form of digital money, that uses the blockchain
    to function as decentralized money. Bitcoin, along with most cryptocurrencies,
    is, therefore, an application of blockchain technology—currently the most popular
    application. Bitcoin is the oldest cryptocurrency and currently has a market cap
    of over a billion US dollars. In fact, blockchain technology arose from the creation
    of Bitcoin: the inventor of Bitcoin, an anonymous individual or group of people
    publishing under the alias *Satoshi Nakamoto*, invented blockchain technology
    to serve as the transaction ledger for Bitcoin. Before this invention, digital
    currencies were either centrally controlled or could be very easily manipulated
    and destroyed. Only after Bitcoin’s creation did people realize the potential
    of blockchain technology in other domains.


    Bitcoin was invented in 2008 when Satoshi Nakamoto published a white paper entitled
    “Bitcoin: A Peer-to-Peer Electronic Cash System.” A year later, in 2009, Nakamoto
    published the first piece of Bitcoin code. The code was released as *open source*,
    meaning that anyone could read it and suggest improvements to it, which resulted
    in a community-driven effort among programmers to constantly improve the Bitcoin
    code. Nakamoto’s publications were made on an online forum for peer-to-peer technology
    enthusiasts. *Peer-to-peer technology* is a type of technology that is intended
    to run without the need for a centralized authority or server. Fiat currencies,
    such as the US dollar, are not peer-to-peer networks, because banks act as central
    authorities and oversee all transactions, the storage, and the creation of money.
    As discussed earlier, Bitcoin is a peer-to-peer network without a central authority
    that dictates the validity of transactions or maintains the power to shut the
    system down. No individual or institution can manipulate or exert control over
    Bitcoin. As such, Bitcoin is a *decentralized network*.


    The key invention that Nakamoto made in Bitcoin was the *proof-of-work algorithm*,
    which lays the foundation for how Bitcoin as a network achieves consensus or,
    in other words, agrees upon which transactions are valid and which are not. In
    fiat currencies, this is not a problem, because banks centrally stipulate validity:
    if you try to send someone money that you do not have or if you try to spend your
    money twice, your bank will prevent you from doing so. Therefore, when using a
    fiat currency, you trust banks as central authorities to make correct decisions
    about transaction validity. In Bitcoin, however, *trust is decentralized*, meaning
    you can trust no one in the network yet still be certain that no invalid transaction,
    such as someone stealing your Bitcoin, will take place. To attain this, Nakamoto
    invented proof-of-work as a mechanism through which *distributed consensus* is
    reached, whereby the Bitcoin network agrees on a set of rules that dictates transaction
    validity. These rules are rooted in mathematics, specifically in cryptography.


    To understand Bitcoin’s distributed consensus, it is important to understand some
    basic demographics of the Bitcoin network. The users of the Bitcoin network are
    loosely divided into two groups. The first, larger group is comprised of the regular
    users who send and receive Bitcoins; the second, smaller group is comprised of
    the *miners* whose job is to validate transactions and group them into blocks,
    which are then appended to the Bitcoin blockchain. In theory, anyone can become
    a miner and thereby contribute to Bitcoin’s distributed consensus.


    Miners have tangible incentives to continue performing their job of mining new
    blocks. Each time a miner successfully mines a new block, they reap the *block
    reward*. The block reward is a predetermined amount of Bitcoins that are created
    in the new block and sent directly to the miner. This special type of transaction
    is known as the *coinbase transaction*. Currently, 12.5 Bitcoins are created in
    every new block and sent directly to the miner. The block reward halves every
    210,000 blocks. On top of the block reward, the miner of the block receives all
    *transaction fees* that are contained within the block. Every Bitcoin transaction
    contains a transaction fee, which is designated and paid by the user sending Bitcoins.
    The higher a designated transaction fee, the quicker the transaction will be confirmed
    on the Bitcoin blockchain because of the greater incentive for miners to include
    it in their blocks.


    Next is a walkthrough of the process of how Bitcoin as a currency can work without
    a central bank or government.


    ### How Bitcoin Works


    The process of how Bitcoin as a currency works can be abstracted into five steps.


    #### Step 1: A New Transaction Is Created


    Alice wants to send 5 Bitcoins to Bob for a new car she purchased. Normally, if
