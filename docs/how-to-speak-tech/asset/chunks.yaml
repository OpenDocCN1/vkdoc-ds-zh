    your head left and right, moving your ears toward your shoulders. Rotation around
    the z-axis is known as roll. These three degrees of freedom are the only ones
    registered in 3DOF VR/AR, so 3DOF VR/AR only changes the view based on where you
    are looking. Even if you move forward, it will look like you’re standing in place.
    But you can turn your head all you want. Thus, most 3DOF experiences don’t want
    you to move around but rather just look around. You can think about it as “swivel
    chair XR.”


    With *6DOF*, you unlock three additional degrees of freedom: motion along the
    x-, y-, and z-axes. In other words, you can move forward, backward, left, and
    right in addition to ducking or jumping up and down. 6DOF VR/AR changes the view
    based on where you are looking and where you are located. We’ll call this “walk-around
    XR.”


    More specifically, 3DOF and 6DOF describe the capabilities of specific hardware
    components. For example, a 3DOF hand controller can point at different angles
    like a laser pointer, but it cannot track the position of your hand. On the flip
    side, a 6DOF hand controller will accurately track both the orientation and the
    position of your hand.


    So how does the computer know where you are looking and where you are located?
    It is easy to know where you are looking. *Gyroscopes* are small instruments inside
    phones and VR/AR headsets that can tell which way a device is oriented. However,
    finding out where you are located is extremely difficult.


    Imagine driving a spaceship in pitch black outer space. How would you know where
    you are or if you are even moving? Driving in the dark is what a computer does
    when it is figuring out where a device is in 3D space in the real world. Computers
    cannot see, so they cannot tell where a device’s position is or if it is moving.
    So we’re in the dark. Now if there were lights in the distance, you could tell
    where you were in relation to those lights. Alternatively, if you could suddenly
    see all the asteroids and planets in front of you, you could see how you are moving
    in relation to those. If there are points of reference for a computer, then it
    can know where it is. There are two ways for a computer to have points of reference.
    One way is for external, outside points of reference to send a signal into the
    computer about its location; this is known as *outside-in tracking*. The other
    way is for the processes inside the computer to look out for points of reference
    in the environment; this is known as *inside-out tracking*.


    ### Outside-In vs. Inside-Out


    Found in the Oculus Rift and HTC Vive, *outside-in tracking* is the most common
    tracking method right now. External sensors live on your desk or your walls and
    act as points of reference, like the lights in the distance from our space example.
    They do this by sending signals to the sensors inside the headset. From this data,
    the processor can triangulate the position of the headset over time. Outside-in
    tracking is extremely accurate but requires external sensors to be plugged in
    and set up. Outside-in tracking limits you to the space where your sensors are.


    Setting up sensors can be tedious, and moving your VR setup (computer, sensors,
    HMD) is much work. Moreover, AR headsets would be extremely pointless to use in
    a confined space, since the power of AR is in providing information about the
    world. The solution is to put the tracking system inside the headset, known as
    *inside-out tracking*. There are no external sensors since the HMD uses internal
    cameras and depth sensors to see the environment and calculate where the HMD is
    in relation to everything. The spaceship can now see the asteroids and figure
    out its relative position. This process is called *SLAM*, which stands for Simultaneous
    Localization and Mapping, and is also used by robots and self-driving cars to
    know where they are in the real world. Without external sensors, everything is
    more convenient and portable. Inside-out tracking allows for fewer wires and less
    setup, making VR more accessible. Moreover, inside-out is extremely important
    for AR HMDs, as it will enable them to move freely around the world.


    With augmented reality, a prevalent method of tracking is *markered tracking*.
    As the name suggests, markered tracking uses a physical marker to help with tracking.
    A marker is a specific image, typically a QR code, that is printed on a card.
    However, a marker could be a logo or even a painting.


    The camera on a device can recognize this pattern and render a 3D model on top
    of that image. Marker-based tracking feels like a 6DOF experience because an image
    on a card can move in all six degrees of freedom, so the 3D model rendered on
    top of the card can as well. However, the algorithms don’t actually know the position
    of the device, just where the tracked marker is. Marker-based tracking is very
    accurate, but ultimately lacks the contextual knowledge about the environment
    that will make future AR very powerful. Most AR tracking nowadays will implement
    some form of SLAM, which we discussed earlier, since it is possible without markers
    and external sensors. However, marker-based tracking creates a smooth user experience
    for certain constrained use cases like the classroom.


    ### VR Systems


    Now that we know how tracking works and what types of tracking exist, let’s look
    specifically at the different kinds of virtual reality systems.'
  trans: '

    ### 沉浸式视频


    `沉浸式视频`内容是 VR/AR 内容的另一种表现形式。VR/AR 中的视频与普通视频非常相似，但你可以环顾四周。想象一张环绕你的全景照片。这些视频通常使用
    360 度相机或特殊的 360 度相机支架拍摄，它们会拍摄多张图像并将其`拼接`在一起。`拼接`是指寻找图像之间的重叠部分并对其排列，使其看起来像一张图像的过程。沉浸式视频对新闻业很有用，因为它可以将人们带入世界的另一个地方或他人的生活环境。对于探索而言，它不太有用，因为用户无法四处移动，只能观看。


    现在我们了解了 VR/AR 内容，接下来看看硬件如何让我们能够观看和移动。


    ## 硬件


    虚拟现实和增强现实在很大程度上依赖于硬件体验。除了头戴式显示器（HMD）之外，VR/AR 还使用追踪系统，并可能包含手部控制器等其他硬件组件。最需要理解的是`追踪`，即硬件如何知道你的位置以及你正在看向哪里。我们将探讨不同类型的追踪，以及不同
    VR/AR 系统在追踪方面的差异。


    ### 追踪


    为了正确渲染 VR/AR 视图，计算机需要知道你在看向哪里，以及你相对于虚拟环境所处的位置。这两个数据点定义了追踪能力的两个主要级别：`三自由度`和`六自由度`。


    ### 自由度 (DOF)


    想象一个只能上下滑动的灯光调光器，这个调光器就只有一个自由度。它只能垂直移动。类似地，一个地球仪有一个自由度：它可以绕一个轴旋转。现在，想象一款像《超级马里奥兄弟》这样的游戏。马里奥可以左右跑，也可以跳上跳下。这就有两个自由度。自由度就是系统中可以在一定范围内变化的任何值。


    VR/AR 具有三个自由度：`俯仰`、`偏航`和`翻滚`。抬头看天花板和低头看地面，这是绕 X 轴旋转，即前后旋转。向左看和向右看，这是偏航，即绕 Y 轴旋转。将头向左和向右倾斜，让耳朵靠近肩膀，绕
    Z 轴旋转就是翻滚。这三个自由度是 3DOF VR/AR 唯一记录的，因此 3DOF VR/AR 只会根据你看向的位置改变视图。即使你向前移动，看起来也像站在原地不动。但你可以随意转动头部。因此，大多数
    3DOF 体验不希望您四处移动，而只是环顾四周。你可以把它理解为“转椅式 XR”。


    有了`6DOF`，你就解锁了额外的三个自由度：沿 X、Y 和 Z 轴的移动。换句话说，你可以前后、左右移动，还可以蹲下或跳上跳下。6DOF VR/AR 会根据你的观看位置和所处位置改变视图。我们称之为“走步式
    XR”。


    更具体地说，3DOF 和 6DOF 描述了特定硬件组件的能力。例如，一个 3DOF 手部控制器可以像激光笔一样指向不同角度，但它无法追踪手部的位置。另一方面，6DOF
    手部控制器可以准确追踪手部的方向和位置。


    那么，计算机是如何知道你在看哪里以及你所在的位置的呢？知道你在看哪里很容易。`陀螺仪`是手机和 VR/AR 头戴式显示器内部的小型仪器，可以判断设备的朝向。然而，找出你所在的位置极其困难。


    想象一下在漆黑的外层空间驾驶一艘宇宙飞船。你如何知道自己的位置，甚至是否在移动？在黑暗中行驶，就是计算机在现实世界中确定设备在 3D 空间位置时所做的事情。计算机无法看见，因此无法判断设备的位置或是否在移动。所以我们处在黑暗之中。如果远处有灯光，你可以根据这些灯光判断自己的相对位置。或者，如果你能突然看到前方所有的小行星和行星，你就能看到自己相对于它们的运动方式。如果计算机有参考点，它就能知道自己的位置。计算机获得参考点有两种方式。一种方式是外部的参考点向计算机发送关于其位置的信号；这被称为`由外向内追踪`。另一种方式是计算机内部的处理过程向外寻找环境中的参考点；这被称为`由内向外追踪`。


    ### 由外向内 vs. 由内向外追踪


    在 Oculus Rift 和 HTC Vive 中使用的`由外向内追踪`是目前最常见的追踪方法。外部传感器放置在您的桌子上或墙上，作为参考点，就像我们太空例子中的远处灯光一样。它们通过向头戴显示器内部的传感器发送信号来实现这一点。根据这些数据，处理器可以随时间对头戴显示器的位置进行三角测量。由外向内追踪非常精确，但需要连接并设置外部传感器。由外向内追踪会将你限制在传感器所在的区域内。


    设置传感器可能很繁琐，移动你的 VR 设备（电脑、传感器、HMD）也是一项大工程。此外，在有限的空间内使用 AR 头戴显示器将毫无意义，因为 AR 的强大之处在于提供关于世界的信息。解决方案是将追踪系统放入头戴显示器内部，这被称为`由内向外追踪`。由于
    HMD 使用内部摄像头和深度传感器来感知环境并计算 HMD 相对于一切物体的位置，因此没有外部传感器。现在宇宙飞船可以看到小行星并计算出其相对位置。这个过程被称为`SLAM`，即同步定位与地图构建，机器人、自动驾驶汽车也使用它来了解自己在现实世界中的位置。无需外部传感器，一切变得更加方便和便携。由内向外追踪减少了电线和设置工作，使
    VR 更容易普及。此外，由内向外追踪对于 AR HMD 来说极其重要，因为它能让设备在世界中自由移动。


    在增强现实中，一种普遍的追踪方法是`基于标记的追踪`。顾名思义，基于标记的追踪使用物理标记来帮助追踪。标记是一张特定的图像（通常是二维码），印在卡片上。不过，标记也可以是徽标甚至一幅画。设备上的摄像头可以识别这种图案，并在该图像上渲染出一个
    3D 模型。基于标记的追踪感觉像是一种 6DOF 体验，因为卡片上的图像可以在所有六个自由度上移动，因此渲染在卡片上的 3D 模型也可以随之移动。然而，算法实际上并不知道设备的位置，只知道被追踪标记的位置。基于标记的追踪非常准确，但最终缺乏关于环境的背景知识，而这些知识将使未来的
    AR 变得非常强大。如今，大多数 AR 追踪都会实现某种形式的`SLAM`（我们之前讨论过的），因为它可以在没有标记和外部传感器的情况下实现。然而，对于某些受限的使用场景（如课堂），基于标记的追踪可以带来流畅的用户体验。


    ### VR 系统


    既然我们了解了追踪的工作原理以及存在哪些类型的追踪，接下来让我们专门看看不同种类的虚拟现实系统。

    '
- fmt: '### Smartphone VR


    The most popular form of virtual reality is smartphone-powered virtual reality.
    Smartphone-powered VR works by rendering two images on your phone screen that
    you can look at through magnifying lenses, typically inside an HMD container that
    holds your phone. Smartphone VR is most commonly used to watch 360 videos. Smartphone
    VR utilizes 3DOF tracking through the phone gyroscope, which, you’ll remember,
    measures orientation. More recently, 3DOF hand controllers have also become available
    for smartphone VR. The popular names in this space are the `Google Cardboard`
    and `Daydream` as well as the `Samsung GearVR`. Although fairly accessible, smartphone
    VR does not compare to the experience of PC VR.


    ### PC VR


    PC VR requires a Windows computer with a hefty GPU, attached to a VR HMD. There
    are two types of PC VR: tethered (HMD is attached to PC with cable) and untethered
    (no cables). Most VR game developers are making PC VR games. Playing games on
    PC VR is an incredible experience. The graphics are incredible because the GPUs
    are larger and the tracking is more precise due to computational power and mandatory
    external sensors. VR arcades are exclusively full of PC VR systems, and most universities
    use PC VR systems for research and development. Furthermore, PC VR is currently
    the only VR system that has 6DOF hand controllers. The most popular systems are
    the `Oculus Rift` and `HTC Vive`. However, PC VR is extremely costly, since you
    have to own a computer with a fancy GPU, a fancy headset, and a large, empty space
    to use it in. It is also challenging to transport around and requires setup before
    use. To make VR more accessible, standalone VR emerged.


    ### Standalone VR


    The latest release in the VR hardware ecosystem is standalone virtual reality.
    Standalone VR places all of the necessary hardware components, such as screens,
    GPU, and processor, inside the HMD, eliminating the need for an external phone
    or computer. Standalone VR is the most compact, portable, and cost-efficient solution
    on the market. There are 3DOF and 6DOF tracked standalone HMDs. For example, the
    `Oculus Go` has a 3DOF HMD and a 3DOF controller. The `HTC Vive Focus` has a 6DOF
    HMD, but its controller is only 3DOF. Later in 2019, the `Oculus Quest` will be
    released. It will be the first commercially available consumer 6DOF HMD with 6DOF
    controllers. Standalone virtual reality is a massive step toward consumer virtual
    reality since people can now buy one device and immediately experience VR.


    ## AR Systems


    Much like VR, AR has several different classes of systems.


    ### 6DOF HMDs


    These HMDs show 3D graphics that live in the space of the real world. You can
    move around the objects, and the HMD uses inside-out tracking to know where you
    are and anchor the digital objects as if they were in your space. The major players
    here are `Microsoft HoloLens`, `Meta`, and `Magic Leap`.


    ### Heads-Up Display (HUD)


    If you know what Iron Man sees, these HMDs are very close to that. They layer
    information, typically text or basic images, into the world in front of you. However,
    these aren’t rendered into your world as objects—rather, they simply show in front
    of your eyes. These are useful for industrial workers who need to see information
    but don’t have the hands to hold a phone or tablet. Similarly, skiers or motorcyclists
    who need information about their speed can wear these types of display HMDs. A
    popular term for these HMDs is smartglasses. A smartglass brand you may have heard
    of is the `Google Glass`.


    ### 6DOF Mobile AR


    Mobile AR, unlike mobile VR, actually refers to mobile phone-based augmented reality.
    Mobile AR uses your phone’s camera to read in the real world and then displays
    3D graphics overlaid on a feed that shows up on your phone’s screen (Figure [17-3](#321739_2_En_17_Chapter.xhtml#Fig3)).
    For example, IKEA has an app that allows you to see virtual pieces of furniture,
    like a chair, appear in your living room. Mobile AR uses 6DOF markerless tracking,
    so you can move around the chair as if it were in the real world.


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig3_HTML.jpg](images/321739_2_En_17_Chapter/321739_2_En_17_Fig3_HTML.jpg)


    Figure 17-3.


    Mobile AR on an iPad showing a digital forest^([^(37)](#fn37))


    Mobile AR relies on intense AR-specific SDKs. `Vuforia` is a large-scale software
    suite made for image detection, marker tracking, and other useful needs. Although
    `Vuforia` is still powerful and useful for higher-level AR functions, Apple’s
    `ARKit` and Google’s `ARCore` have recently become powerhouses at the lower level
    because they are hardware specific and do great markerless 6DOF inside-out tracking
    using SLAM.


    With all of the different hardware systems in the VR/AR landscape, it is easy
    to get a little lost. However, remember that the main differences are tracking:
    3DOF (swivel chair XR) vs. 6DOF (walk-around XR) and outside-in (external sensors)
    vs. inside-out (SLAM).


    ## You, Virtually


    One of the powers of virtual reality is enabling you to be whoever you want to
    be. You’ll also interact with a wealth of virtual characters in VR and AR. A representation
    of someone in VR/AR is called an avatar. Although avatars can be anything, most
    avatars are humanoid because that accurately maps to the tracking systems that
    exist, which track the head and hands with six degrees of freedom.


    Moreover, people are generally more comfortable portraying themselves as humanoid
    and seeing other humans with humanoid avatars, known as virtual humans. Avatars
    are incredibly prevalent in virtual and augmented reality because when we enter
    a virtual space, we need a personal manifestation to show to others in that same
    virtual space. According to communication and media researchers Blascovich and
    Bailenson, virtual humans display multiple types of “realism.”


    ### Photographic Realism


    If you look at yourself in the mirror, a high-quality video, or a photo, what
    you see has extremely high photographic realism. It seems just like a real person:
    you. In VR/AR, there are rarely photorealistic avatars due to both graphics and
    a phenomenon known as the uncanny valley. Modern computer graphics capabilities
    are phenomenal and getting closer and closer to making realistic looking virtual
    humans. However, in VR/AR headsets, the rendering costs are still high, so most
    systems cannot afford vivid, realistic details.


    Moreover, as virtual humans approach realistic human resemblance, the uncanny
    valley causes discomfort. On one side of the valley are cartoony virtual humans,
    while on the other side are completely realistic virtual humans. Humans are typically
    comfortable on either side of the valley, but right in the middle, where the virtual
    humans almost look like real humans, people can get uncomfortable. An excellent
    example of the uncanny valley is the creepiness of the characters from *The Polar
    Express* (2004), which caused a lot of discomfort for viewers. This discomfort
    stems from the fact that our minds are biologically wired to try and identify
    people. In the uncanny valley, our brains can’t decide whether an image is a real
    human or not, making us uneasy. As a result, near-photorealistic virtual humans
    are generally avoided.


    Most VR/AR experiences, such as *Rec Room* (2016), use cartoony virtual humans,
    nonhuman representations, or human representations with helmets or masks. Well,
    you may ask, what value does VR/AR have if avatars don’t look like real people?
    Photorealism is actually not the most important type of realism. Behavioral realism
    has a much larger impact on perceptions of realism.'
