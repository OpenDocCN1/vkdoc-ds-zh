  trans: '

    # 步骤 5：其他矿工验证包含该交易的区块


    虽然挖矿是一个计算密集型的过程，但验证一个区块是否有效却是一项简单的工作。一旦其他矿工收到已挖出的区块，他们需要做的全部验证工作就是通过`SHA256`算法运行一次。如果该区块的哈希值低于目标值，矿工们就会接受该区块为有效，并将其附加到他们本地持有的区块链副本上。至此，该区块已被*确认*。如果这听起来像是一个非常复杂的过程，那确实如此。如果你想创建一个不需要中心权威机构的过程，你就需要富有创意，并且在这种情况下，你需要掌握技术。不过，这里有一个权衡——为了创建一个去中心化系统，矿工们需要参与的“游戏”会拖慢处理速度。交易无法像某些人希望的那样被快速处理，这就是为什么有些人开始创建他们自己版本的区块链，正如本章稍后讨论的那样。


    一旦一个区块被附加到区块链上，想要移除或更改它几乎是不可能的。一个区块在区块链中的深度（以其后面区块的数量来衡量）越深，移除或更改该区块就越困难。回想一下，区块包含指向前一个区块的链接；因此，为了重新挖出一个深度为
    5 个区块的区块（这是一种描述更改区块内容过程的技术性说法），攻击者不仅需要重新挖出该区块，还需要挖出其后的 4 个区块以及在重新挖矿期间添加到区块链上的任何新区块。实际上，单个矿工不可能拥有足够的电力输出来产生足够高的哈希率以发动这样的攻击。


    因此，一个区块在区块链中的深度越深，它就越不可篡改，爱丽丝和鲍勃也就越能确信他们的交易得到了安全的批准。一个区块在区块链中的深度越深，就被认为拥有越多的*确认数*。因此，一个深度为
    5 个区块的区块被认为有五个确认。一笔交易在*六个确认*后被认为是安全、最终的。


    这五步流程展示了数千名独立矿工遵循的简单规则，以异步方式就比特币区块链的状态达成共识。*比特币区块链的状态*是一种表述每个用户持有多少比特币的技术性说法。该过程是异步的，因为永远没有一个时间点会举行选举或进行裁决来规定区块链状态的一致意见。相反，工作量证明算法旨在充当一种彩票，决定哪个矿工能生产下一个区块并因此延长区块链。因此，在这个去中心化网络中，无需信任银行之类的中央权威机构。


    ## 比特币的价格


    *比特币的价格*由供需关系决定。在任何给定的时间点，比特币的价值等于其最近一次交易中的交易价格。例如，如果爱丽丝向鲍勃发送半个比特币，价格为 500 美元，那么在该时间点一个比特币的价格就是
    1000 美元。比特币可以在在线*交易所*（例如 Coinbase 或 Bitstamp）购买。大多数交易所通过汇总最新交易的价格来确定比特币的价格。


    由于没有中央银行通过货币政策控制比特币的价值，比特币迄今为止一直承受着高*价格波动性*。许多比特币批评者认为，价格不稳定阻碍了比特币作为交换媒介被主流采用，反而使之成为一种投机工具。比特币的支持者则认为，随着比特币使用量的增加，价格波动性将会降低。如果更多商家开始接受比特币支付，寻求将比特币兑换回法定货币的用户就会减少。这将降低投机水平，并开始稳定价格。然而，目前比特币和许多其他加密货币面临着高度的价格不稳定。


    ## 存储与丢失比特币


    用户将比特币存储在称为*钱包*的软件程序中。尽管名称如此，钱包实际上并不存储你的比特币；相反，它们扫描比特币区块链，以计算出你通过私钥可以访问多少比特币。钱包软件还负责生成私钥，并为比特币用户创建相应的公钥和地址。


    你的比特币可以通过两种方式被*盗取*。第一种方法涉及窃贼获取你的私钥。一旦窃贼获得了私钥，他们就可以使用它们将与这些私钥关联的所有比特币转移给自己。第二种方法涉及黑客入侵交易比特币的交易所服务器。大多数交易所将当前正在交易的比特币的私钥存储在一个数据库中。如果黑客获得了该数据库的访问权限，他或她就可以将与这些私钥关联的任何比特币转移给自己。


    比特币网络本身容易受到攻击，主要是恶意矿工发起的攻击。其中最著名的此类攻击被称为*51%攻击*。回想一下，比特币网络中的共识是分布式的，许多独立的矿工遵循简单的规则来产生新区块。如果一个矿工决定不遵守规则并开始挖出其他无效的区块，比特币网络将直接忽略他或她，除非这个持不同意见的矿工构成了*多数*。在这里，多数是通过哈希率来衡量的，这意味着如果一个矿工，或一组合谋的矿工，控制了超过
    51%的产生新区块的能力，他们就可以决定哪些区块被生产出来。在这种情况下，恶意矿工可以撤销交易并多次花费他们的比特币。结果，比特币网络的去中心化特性被破坏。由于矿工数量庞大，对比特币发动
    51%攻击非常困难，因为发动这样一次攻击需要投入巨量的能源（主要是电力）。一个攻击者需要奥地利全国的电力输出来发动这样一次攻击。迄今为止，还没有已知的针对比特币网络的
    51%攻击实例。


    然而，确实发生过少数矿工不同意管理比特币的某些规则并决定修改它们的情况。当一群矿工不同意比特币网络分布式共识所遵循的规则时，他们可能会选择不再作为矿工参与该网络。这被称为*分叉*，因为持不同意见的矿工从比特币区块链中分离出来，开始构建他们自己的区块链，这意味着创建了一种新的加密货币。最著名的比特币分叉发生在
    2017 年 8 月 1 日，当时创建了加密货币比特币现金。从比特币网络分离出来创建比特币现金的矿工们，反对的规则之一是比特币的共识规则规定有效区块的最大大小为
    1 MB。这些矿工希望增加区块大小，以便增加一个区块中可以验证的交易数量。比特币现金区块的区块大小被增加到了 8 MB。

