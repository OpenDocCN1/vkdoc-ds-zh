    # GDPR（通用数据保护条例）


    在关于追踪技术的讨论中，`MyAppoly` 团队务必意识到隐私问题引发的严重关切。自 2016 年起，我们对现有数据隐私法规进行了重大修改，其中最引人注目的是《通用数据保护条例》（GDPR），它试图以比以往更全面、更强有力的方案来统一欧盟各国的数据保护法。该条例于
    2018 年 5 月起强制执行，要求企业在收集数据前披露相关行为，包括数据用途、存储期限及分享计划。企业只有在获得用户明确同意后方可继续处理个人数据，且用户可随时撤销该同意。GDPR
    的涵盖范围远比我们在此讨论的要广泛，但条例核心应成为团队在数据追踪、收集、存储及处理方面讨论的基石。


    # 结论


    请记住，本次讨论中省略了若干工具。如果你注册使用 Google Analytics，会发现有许多有用的方法来细分数据并提取隐藏的洞察。例如，Google Analytics
    可以让你查看用户在访问你的网站之前，在搜索引擎上搜索了哪些词语。这被称为`站内搜索分析`（SSA），它能提供用户行为背后的背景信息，这与点击流分析和热力图产生的数据不同，后者需要依靠推断。


    现在你已经掌握了关于搜索引擎、追踪技术以及数据隐私法规的基础知识，`MyAppoly` 已经准备好迎接更大的挑战。它蓄势待发，但你能驾驭这种增长吗？


    脚注 1


    # 11. 性能与可扩展性


    作为一名充满热情的企业家，你密切关注着 `MyAppoly` 的使用情况，并立即处理任何问题。你花时间仔细审阅团队的分析报告，并注意到了成功的迹象。你的用户数量正在呈滚雪球式增长。很快，你的团队来找你，讨论如何改进网站，因为网站正在吸引前所未有的流量。一些工程师指出，某些页面的加载速度远低于其应有的水平，并且当前的架构无法支持更多用户，尤其是考虑到指标所显示的增长速率。例如，每台服务器每秒只能处理一定数量的请求，因此当前网站加载时间过长。这些都是“好问题”，但仍然需要解决。


    `性能` 关乎网站的速度：加载速度有多快，传输了多少字节，以及任何衡量用户接收请求信息速率的指标。


    `可扩展性` 指的是 Web 应用程序适应不断增长的工作量的能力。它关乎你的网站能够容纳更多用户、更多数据和更多计算——不仅仅是多一个或几个，而是数千甚至数百万个。


    你可以看到，这两者并非同一回事，但可能同时出现。如果你的用户群在增长，你需要确保网站尽可能高效地运行。你的团队准备了一份关于他们希望实施技术的入门指南。这份清单并非详尽无遗，但能让你了解公司通常如何处理这些问题。


    ## 提升性能的实践方法


    可以通过优化后端和前端来提升性能。然而，后端只占页面加载时间的一小部分。大部分时间都花在下载用户界面的组件上——例如，为给定网页上出现的各种元素发出 HTTP
    请求。这可能会影响你确定优先顺序和分配资源的方式，尽管页面加载时间只是性能的一个方面。


    ### 后端方面的考量


    应用已经提及的良好设计原则可以提升效率。例如，抽象化技术允许你在应用程序的不同部分有效地重用代码。


    此外，许多成功的科技公司会重写代码以提高效率。优化数据库查询和其他操作（例如用于确定 Netflix 电影推荐的算法）是第一步。另一步则是完全用不同的编程语言重写应用程序。回想一下，更底层的语言能提供更高的效率（第
    3 章）。因此，许多科技公司会重写其应用程序以利用这些语言。例如，Twitter 从 Ruby on Rails 迁移到了 Scala 和 Java。Facebook
    通过程序化方式将其 PHP 代码转换为高度优化的 C++ 代码。这样的例子不胜枚举，但由于将代码迁移到不同的语言是一个艰巨的过程，公司需要仔细权衡，判断当前使用的编程语言是否已不再适合其任务。


    ### 前端方面的考量


    当用户访问你的网站时，只有很少的时间花在 HTML 文档的初始 HTTP 请求上。大部分时间都花在下载与该特定网页相关的各种资源上。本节将重点介绍一些实践、工具和方法，供所有前端开发者在以性能为目标时加以考虑。


    #### 减少 HTTP 请求


    减少下载页面资源所需的 HTTP 请求次数可以缩短页面加载时间。有多种方法可以减少请求次数，例如合并脚本和样式表。我们将讨论两种与图片相关的特定方法：使用`CSS
    精灵图`和`图片地图`。


    假设你想在网站左上角展示 Logo 的左半部分，在右上角展示 Logo 的右半部分。一种方法是设计两个元素分别代表每一半，这需要两次请求才能显示。与其采用这种方法，我们可以只对整个
    Logo 发出一次请求，然后使用不同的 CSS 属性来隐藏我们不想显示的那部分图像。这就是`CSS 精灵图`，它有助于减少我们可能需要的请求次数。


    现在假设你想在网站上包含一张团队成员的照片，点击其中任何一张脸都会将用户重定向到其领英主页。如果使用单独的照片，浏览器需要对每张图片发出单独的 HTTP 请求。但是，通过使用集体照，你可以使用`图片地图`将不同的链接关联到图片的不同区域，从而将图片的
    HTTP 请求次数减少到一次。


    #### 缓存


    如果你的用户反复访问同一页面，让他们每次重新请求该页面的所有资源意义不大。你每次和最好的朋友见面时，不会都问他们要一次电话号码，对吧？在某些时候，他们会让你直接存下来。同样，你的浏览器也厌倦了反复向服务器请求，而是将网页存储在`缓存`中。缓存资源的例子包括图片、CSS
    文件和 JavaScript 文件，与 HTML 相比，这些文件变化频率相对较低；你可能想在你的网站上添加一段新的信息段落，但不太可能频繁更改 Logo 或页面样式。将
    CSS 和 JavaScript 放在外部文件中可以实现对其的缓存。'
- fmt: '# Compression


    If you’ve ever downloaded a large file, you may have noticed it downloaded as
    a smaller `.zip` file that had to be unpackaged. To create this file, we use a
    process called *zipping*. By reducing the size of the response, the time it takes
    to transfer them from the server to the browser is reduced. Keep in mind that
    there are costs entailed with compression. It takes additional processing power
    to compress files on the server and for the browser to decompress the files. Therefore,
    it does not make sense to compress every possible resource.


    Another compression tool is *minification*, the process of deleting all the unneeded
    whitespace, comments, and characters from a document. When you are writing software,
    indentation and comments make your code readable. However, when transmitting code
    from the server to the browser, they can add a lot of unnecessary bulk.


    # Placement of Scripts and Stylesheets


    Remember that stylesheets (`CSS` documents) and scripts (`JavaScript` documents)
    are often externally linked to an `HTML` document. Where you link these documents
    will determine how the page will load. Let’s say it will take a page five seconds
    to load. In the first scenario, the screen is blank for the full five seconds,
    after which the entire page is instantaneously shown. In the second scenario,
    the page loads in parts over the five seconds until it is finished. Which is better?
    Many would say the latter because users are uncomfortable with unresponsiveness
    and like to know that something is happening. To achieve this effect, known as
    *progressive loading*, you should link the stylesheets at the top and the scripts
    at the bottom of the `HTML` document. Since many browsers do not load elements
    until they have processed the stylesheet to avoid redrawing elements, it’s faster
    to have the stylesheet at the top. Scripts should be placed at the end because
    content below the script is halted from rendering until the script has been fully
    downloaded.


    ## Infrastructure Changes


    Most web application endeavors, such as MyAppoly, start with a single server linked
    to a single database with a set amount of storage. As more users start using your
    application, you need to add servers to respond to all of their requests. After
    more users join, however, and they begin interacting with each other, writing
    all of the data you collect to the database proves immeasurably slow. To interact
    with the database quickly, we *replicate* our databases, or create multiple copies
    we can interact with.


    The process of replicating databases is tricky. If the queries are only "reads"—meaning
    the user wants to access information stored in the database—multiple copies of
    the database would work to satisfy a growing user base. What if a user wants to
    "write" or change what is stored in the database—say, add a friend? You have to
    make sure all the databases get updated. It’s probably inefficient to add your
    "new friend" to all copies of the database, so you resolve this situation with
    a primary database designated as the write database, such that all updates have
    to be handled by this database alone. All other replica copies of the database
    are used purely for reads. In this way, databases can be scalable.


    After adding more servers and databases, how do you actually direct users to the
    different copies? You use a *load balancer* to send requests across available
    servers in a way that spreads out the requests. Load balancers can employ any
    number of sophisticated algorithms to decide what the optimal assignment pattern
    is. The simplest is the round-robin approach, which directs incoming users to
    servers in a fixed pattern. After sending a user to Server A, the next user is
    sent to Server B, the next to Server C, and so forth. However, this method may
    be suboptimal because it does not consider the actual availability of the servers.
    You might accidentally assign two heavy users to the same server, even though
    other servers are being used more lightly. An assignment based on usage could
    work better. Load balancers provide reliability to your system, as they can redirect
    traffic if a server goes down.


    ## Conclusion


    You come away realizing that performance is key, and you now have a perspective
    on how developers think about improving the load time. You realize you will have
    to pay for more resources to support more users as your web app starts to scale.
    Additional resources require a trade-off between cost and performance—a good problem
    to have. As you grow, you realize you have a blind spot: security. The next chapter
    exposes you to some of the big attacks and the methods for stopping them.


    # 12. Security


    Special thanks to Ashi Agrawal for contributing this chapter.


    In late July of 2017, credit reporting powerhouse Equifax disclosed that a group
    of unknown hackers had compromised the personal information—including driver’s
    license numbers and Social Security numbers—of over 145 million customers.^([^(13)](#fn13))
    The attack was the latest in an ever-growing wave of public breaches and hacks
    that had already struck Target, Ashley Madison, and Citigroup, among others.


    While the Equifax breach was especially shocking due to the data’s sensitivities,
    such an attack could strike *any* company. Hackers—people who look for cybersecurity
    flaws—may target an organization’s digital assets for a variety of reasons, even
    to enact personal revenge or to claim glory. Some want to sell data to the highest
    bidder, while others relish the thrill and the challenge. Not all hackers have
    ill intentions; ethical hackers (also called white hat hackers) look for these
    flaws so that companies can fix them. Even so, the digital world is rife with
    nefarious attacks.


    Regardless of what your application does, an attack can cause you to lose valuable
    computing power and data or lead to a business interruption. Even if a data breach
    doesn’t expose consumers to identity theft, it can still reveal sensitive data
    and cause consumer trust to evaporate. Beyond business reasons for enacting security
    precautions, organizations have ethical and legal requirements to remain secure.
    Cybersecurity should be of utmost importance for you and your company, and this
    chapter will discuss methods to keep yourself and your users safe.'
