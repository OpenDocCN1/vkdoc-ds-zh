- fmt: 'That said, there must be *some* formula hidden from our sights, possibly containing
    hundreds or thousands of variables, which captures these uniquely complex relationships.
    A neural network is the most effective type of model for these scenarios. It is
    built with multiple layers of simple mathematical functions (called neurons) stacked
    together to produce an output at the end. The stacked functions can go as deep
    as over 500 layers, giving rise to the term deep learning. You have probably heard
    this buzzword being thrown around a lot in the media, often touted as a magical
    algorithm that performs superhuman feats like beating Lee Sedol, one of the best
    Go players in the world. Neural networks are unique in their ability to capture
    any linear and nonlinear relationship, allowing them to pick up subtle nuances
    in data that are otherwise hard to spot. Other types of models include decision
    trees which are tree-like structures that choose the most informative features
    to learn, and support vector machines (SVM) which attempt to separate the strongest
    positive and negative features as far apart as possible.


    ## Learning


    Now that we have a defined problem, relevant data, and a model, we can feed data
    into the model so that it learns. *Learning* is the process by which a model develops
    knowledge about the problem. When we feed data into a model, it goes through a
    few data points at a time and adjusts the parameters of its underlying mathematical
    functions to reflect new information gained from data. This adjusting process
    is governed by *hyperparameters* (or higher-level configurations) such as how
    much the model should change its parameters per set of data points, also known
    as the learning rate. The higher the rate, the more influence each new data point
    has on the model’s parameters and the faster it makes progress. Over time, the
    parameters’ values would ideally get good enough that the model produces accurate
    predictions, whereby they stop changing and are said to have converged to their
    final values. In practice, models often do not converge if they fail to capture
    relationships in data sufficiently. Hence the learning process requires human
    monitoring at regular intervals to determine if the process is going well, that
    is, whether the parameter updates are heading in the direction of improving or
    worsening predictions. It requires multiple passes through the data to converge,
    taking hours or days for a model depending on the difficulty of the problem. When
    viewed from the perspective of a human, we call this process training the model.
    Data being used to train the model is training data.


    The three most common types of learning processes are supervised, unsupervised,
    and semi-supervised learning. Supervised learning relies on human-provided desired
    outputs called *labels* for each training data point. If the problem is to predict
    whether a patient has cancer, supervised learning requires not just the symptoms
    of a patient but also a label “has cancer” or “does not have cancer.” The model
    continually verifies and refines its knowledge by predicting cancer/no cancer
    for a patient and confirming it with the given label. If it predicts correctly,
    confidence goes up, whereas if it predicts incorrectly, it’s time to change some
    values in the mathematical functions that underlie the model. This iterative process
    of checking and updating adds to the model’s knowledge over time. At the point
    of convergence, we stop training the model, validate it by giving it new patients’
    information, and count the number of mistakes it makes. The model has not seen
    these patients before, so it is a test of how well it understands the problem.
    If it is good enough, we might integrate the model into a real product and sell
    to consumers. If it is not, we would continue training for a longer time with
    some changes to the underlying mathematical functions or structure, such as adding
    more layers to a neural network or tuning some hyperparameters. Sometimes we might
    collect more labeled training data to give the model more information about the
    problem.


    Unfortunately, labels require costly manual curation. For the problem of detecting
    pedestrians in road images, it is relatively easy to collect thousands of images,
    but much harder to go through each one manually and assign a yes/no for the presence
    of a pedestrian. Unsupervised learning develops knowledge from training data in
    the absence of labels. The iterative process of verifying against true labels
    in supervised learning cannot work here. Instead, this process attempts to uncover
    relationships within features, such as identifying similar data points and placing
    them into groups. The problems that unsupervised learning can solve have more
    to do with gaining insight into data rather than trying to predict an output.
    The K-means algorithm is one such learning process that iteratively discovers
    clusters in data. For example, if the data contains customer information such
    as age and hometown for a bookstore, grouping them helps us better understand
    the kinds of people that frequent the store.


    In many cases, only some of the data have labels. Can we still make use of them
    to do learning? Semi-supervised learning attempts to tackle this case, mostly
    by inferring the labels on all other data points depending on their similarity
    to the small set of labeled ones. The more similar, the more likely they are to
    have the same label. For example, if two patients had very similar symptoms, but
    we only knew the label for one of them, we might make an educated guess that the
    other also has the same label. Once we have all the labels, we can apply the previously
    discussed supervised learning approach to learn and predict outputs.


    Now we will see how these four key components of AI, problem, data, model, and
    learning, come together in a small real-life case study.


    ## Case Study: Apple Face ID


    To unlock the latest iPhone, you are able to look at the screen for a split second
    merely. This technology uses a neural network that has been trained to detect
    your face.^([^(35)](#fn35)) Here, the problem involves classification mainly—determining
    whether the face looking at the screen right now is the actual owner of the iPhone.
    To perform this task accurately, the model is first trained to understand what
    human faces tend to look like with training data that includes three-dimensional
    depth maps and two-dimensional infrared images of over a billion real-world faces.
    That’s right, Apple sought consent from lots of different people to save pictures
    of their faces in various orientations! From this data, the model tries to learn
    common facial patterns such as the fact that most people have two eyes, one nose,
    and one mouth. This is an unsupervised problem setting since it is more about
    uncovering relationships between parts of the face than trying to match a face
    against human-curated labels. In fact, there are no labels in this context. Diversity
    in training data is crucial to allow a model to pick up on the nuanced relationship
    between aspects of facial structure, that is, different people have different
    eye colors or distance between the eyes. These relationships are captured as formulas
    which are highly adaptable even if you wear glasses, hats, or other things that
    change the appearance of the face. When you first buy an iPhone, you are asked
    to calibrate it with your own face so that the model can further tweak its formulas
    from the training data to adapt to (or learn from) your particular face; since
    you will be the sole user unlocking the iPhone, it needs to recognize just you
    and no one else. In the future, unlocking the phone is as simple as matching a
    new face against this stored representation. Over time, the model continually
    learns to account for changes in facial structure so that the phone still unlocks
    if you grow a beard or long hair.'
