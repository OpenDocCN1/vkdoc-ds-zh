  trans: '

    ### 未来展望


    许多技术精湛的开发者持续致力于改进比特币代码。目前，大部分工作聚焦于提升比特币交易的速度和效率。一项名为*闪电网络*的新技术正在开发中，它将使得极小额的交易能够在网络中即时发送。同时，大量工作也在推动比特币的认知普及和应用。尽管比特币价格波动剧烈，但其波动率仍低于委内瑞拉国家法定货币——玻利瓦尔。这导致许多人将其储蓄兑换成比特币，因为它比美元更容易获取。此外，委内瑞拉的一些商家已开始接受比特币支付。传统中心化机构在维持法定货币体系上越乏力，我们就越能预期比特币的采用率将提升。


    ## 区块链的世界


    加密货币迄今为止是*最*流行的区块链应用，这主要归因于区块链在追踪数字资产所有权方面的卓越能力。自比特币诞生以来，无数新加密货币涌现，其中有的更为可靠。每种新加密货币都运行在各自独立的区块链上，拥有自己的用户和矿工网络。尽管新加密货币带来了不同程度的创新，但大多数至少在概念上基于比特币。例如，门罗币（Monero）通过混淆存储在区块链上的交易数据来提供隐私交易功能。另一种加密货币达世币（Dash）则旨在降低比特币的交易成本并提高交易速度。这些加密货币各自运行在独立的区块链上，需要使用专门的软件。目前已有数千种加密货币；然而，并非所有加密货币都能兑现其承诺。大多数加密货币因无法获得足够的发展动力而消亡，或被证实为欺诈项目。


    ### 以太坊


    后比特币时代最著名的加密货币是以太币（Ether），它构建在*以太坊*区块链之上。以太坊区块链之所以被称为生态系统，而非像比特币那样仅为加密货币，是因为以太坊提供的远不止加密货币。在以太坊上，用户可以上传将在区块链上运行的代码片段。这之所以有用，是因为它允许任何可编程的任务——不仅仅是货币交易——以去中心化的方式进行记录、验证和执行。正如比特币消除了货币领域中金融机构的中心化权威，以太坊也能消除任何监管数字资产的机构的中心化权威。


    让我们看一个例子。想象一下合同律师在制定和执行双方之间的法律协议时所扮演的角色。律师最相关的任务包括监督合同的完整性、确保合同签署后不被更改，以及在条件满足时执行合同协议。这听起来像是律师是一个中心化权威和单点故障点吗？确实如此。如果律师腐败或犯错，合同就可能被操控。换句话说，签署合同的双方都信任律师能忠实地履行其职责：这是一个中心化网络。


    如果合同改用代码编写并上传到以太坊区块链，那么它将由以太坊网络上的每个矿工以编程方式强制执行。这并不意味着矿工会穿越到现实世界强迫一方遵守合同。然而，他们确实提供了一个可证明的记录，表明根据合同应该做什么。因此，正如比特币旨在取代银行作为金融中介，以太坊也旨在取代合同执行机构作为协议的中介。这些在以太坊区块链上运行的程序被称为*智能合约*。当多个智能合约交互形成更复杂的程序时，这被称为*去中心化应用*或*dApp*。去中心化应用不必花哨：它们可以是一套简单的规则，例如“收到
    0.5 个以太币时就繁殖一只新的猫咪”。这实际上是当下最流行的以太坊 dApps 之一 —— 一款名为 CryptoKitties 的游戏中的规则示例。


    ### 首次代币发行


    *首次代币发行*（*ICOs*）在区块链世界引起了大量炒作和争议。可以把 ICO 想象成类似于不受监管的首次公开募股（IPO）。然而，想进行 ICO 的公司出售的不是股票，而是*代币*。ICO
    中可以出售两种类型的代币：*实用代币*和*证券代币*。实用代币更受欢迎，因为它们大多不受法律监管。当你购买实用代币时，你并非购买公司的股份，而是购买一种折扣币，可用于在公司
    dApp 上线时与之交互。例如，在以太坊平台上，以太币用于支付矿工处理智能合约中的交易，因此以太币既可以视为实用代币，也可以视为加密货币。另一方面，持有证券代币意味着你享有公司的某些所有权。这类代币在
    ICO 中不太流行，因为它们受立法机构监管。ICO 完全不受监管，这意味着公司可以自主决定想要出售的代币数量，自行设定代币价格，并几乎可以向任何人出售。


    2014 年中期，在以太坊平台上线前一年，6000 万个以太币通过预售出售给了投资者，这成为了后来在以太坊平台上发起的众多 ICO 中的第一个。然而，ICO
    可以在任何区块链平台上进行。仅 2017 年，公司就通过 ICO 筹集了高达 32.5 亿美元的资金。作为 ICO 的投资者，在购买任何代币之前进行尽职调查至关重要。由于缺乏监管，没有任何法规能阻止一家公司在通过
    ICO 出售代币赚钱后消失，并且不兑现其路线图上的任何承诺。过去已有许多 ICO 骗局，安全地 navigating ICO 领域至今仍是一项艰巨的任务。


    ### 超越加密货币的区块链


    区块链技术的其他流行应用存在于*去中心化供应链*和*去中心化产权转移*领域。这两种应用都利用了区块链为个人提供数字资产所有权或实物资产数字表示的能力。例如，智能合约可用于处理房地产交易，最大程度减少经纪人的参与，同时由区块链记录谁拥有什么财产。同样，通过在区块链上表示商品并要求每个供应商在加工时间和地点进行加密签名，可以使供应链更高效。因此，可以有效地追踪商品在供应链中的流动，直至其源头，并识别有问题的供应商。此外，还存在完全去中心化某些供应链的雄心，这将意味着零售商直接从生产商处购买商品。能源部门是此类去中心化的一个特别突出的行业，例如，屋顶装有太阳能电池板的房主可以将多余能源出售给邻居。其中一些区块链，如果由私人公司运营，并对谁能成为节点或矿工施加控制，则被称为*私有区块链*，因为参与分布式共识仅限私人方。虽然私有区块链实现完全去中心化的能力有限，但它们仍然可用于在多个参与者之间分配权力和信任。

    '
- fmt: '# Conclusion


    Blockchain technology allows us to create decentralized and trustless networks
    that connect people and companies in novel ways. Blockchains can be used to create
    networks without central authorities and increase the security of supply chains
    while cutting administration costs. The direction of blockchain technology is
    perhaps most eloquently embodied in a message left by Satoshi Nakamoto in the
    first Bitcoin block:


    > *The Times 03/Jan/2009 Chancellor on Brink of Second Bailout of Banks*


    The message, citing the headline of a 2009 issue of *The Times*, is a sharp criticism
    of the blind trust we sometimes place in centralized institutions. When these
    institutions fail in their roles, it is often the everyday users who pay the price,
    just like citizens end up paying the bailout of a failing bank. Blockchain technology
    allows us to build fully functioning networks without the risks associated with
    central authorities.


    # 17. Virtual and Augmented Reality


    Special thanks to Khoi Le for contributing this chapter.


    Ding. The elevator doors open on a magnificent skyline... and then you look down.
    You’re standing on the edge of a building, a hundred stories off the ground. At
    your feet, a wooden plank extends six feet over the ledge in front of you. “Walk,”
    you hear a voice say. Against your better judgment, you inch out slowly, taking
    step over cautious step. As you reach the edge, you feel your stomach drop, and
    you almost lose your balance. However, you stabilize as the wind whistles around
    you. “Step off the plank,” the voice says. At this point, most people refuse to
    step off the plank, paralyzed by fear. Why would you want to fall to your death?
    However, you know that you are currently in virtual reality, seeing all of this
    through a headset strapped onto your face. You’re in a classroom, so there’s no
    way you’d get hurt. Of course you’d step off the plank. But your feet won’t move
    because you’re afraid.


    The plank experience demonstrates the power of *immersive media*, which tricks
    your brain into believing that the digital, something produced by a computer,
    is real. *Virtual reality* *(VR)* creates entirely digital worlds that seem real.
    A closely related field is *augmented reality* *(AR)*, which creates believably
    real digital objects that look as if they are part of the world. VR and AR comprise
    the bookends of what many call “immersive media.”


    Why is it called “immersive” media? Imagine walking through the ruins of Pompeii
    in Italy. The buildings were destroyed thousands of years ago. Luckily, you’re
    wearing an augmented reality headset. In addition to seeing the ruins, there are
    holograms, digital replicas of the buildings exactly how they used to look based
    on historical research, overlaid on top of the ruins. Because the experience is
    spatial and the digital structures are superimposed on the real world in the correct
    context of the ruins, it augments your reality. Immersive media powerfully surrounds
    you with digital objects that appear real in order to give you new experiences.


    Traditional media are “pancake” media, flat experiences on paper or screens. Immersive
    media are spatial—they are experienced in three-dimensional space. You can think
    of immersive media as the spectrum depicted in Figure [17-1](#321739_2_En_17_Chapter.xhtml#Fig1),
    from reality, where we only perceive real objects in a real environment, to virtual
    reality, where we only perceive virtual objects in a virtual environment.


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig1_HTML.jpg](images/321739_2_En_17_Chapter/321739_2_En_17_Fig1_HTML.jpg)


    Figure 17-1.


    The reality-virtuality continuum, from a 1994 paper by Paul Milgram


    *Mixed reality (MR)*, a “mix” of virtuality and reality, encompasses the rest
    of the spectrum. For example, Pokemon (virtual objects) on the sidewalk (real
    world) counts as “mixed reality.” Conversely, a real chair (real object) perceived
    as being in a virtual living room (virtual world) also counts as “mixed reality.”
    Augmented reality counts as mixed reality since it shows virtual overlays, or
    objects overlaid on the real world. Imagine looking at someone and seeing their
    name hovering above their head.


    Many people also refer to immersive media with the umbrella term *XR*, where X
    stands as a placeholder for “virtual,” “augmented,” “mixed,” or anything else
    people come up with, and “R” stands for “reality.” XR unlocks the potential of
    *experience*. Just as the Internet is a boon to the cataloging, distribution,
    and democratization of *information*, XR promises to do the same for *experiences*.
    Students learning about the ocean can go underwater; surgeons, quarterbacks, and
    police officers can train in realistic scenarios; and anyone can gain empathy
    by experiencing a snapshot of life as a Syrian refugee, a woman in rural India,
    or a homeless person. VR/AR is a set of new media through which we can experience
    connection, stories, entertainment, and education.


    In this chapter, we’ll explore immersive media through five areas that define
    VR/AR. First, we’ll look at the “New Dimension” that makes spatial experiences
    so unique. Then, we’ll look at “Immersive Content,” analyzing the different types
    of content that exist in VR/AR experiences and exploring content creation processes.
    After we learn about the content, we’ll see how today’s “Hardware” allows us to
    consume that content through tracking. Once we understand tracking, we can discover
    how avatars and virtual humans represent “You, Virtually” in VR/AR. Finally, we’ll
    look at how people interact with virtual environments in “The Metaverse.” These
    five sections will equip you with everything you need to know about VR/AR.


    ## A New Dimension


    To understand how virtual and augmented reality work, we must dig into the crux
    of immersive media: 3D. This section will first explore stereoscopic vision, which
    is the way that humans visually perceive the three dimensions. Then we’ll look
    at how computers create three-dimensional scenes and how the limitations of the
    technology affect the VR/AR experience.'
