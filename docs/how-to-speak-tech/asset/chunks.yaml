    are building as fast as they can. Conscious of your need to be the first mover,
    you expeditiously consider all of the factors set out in this chapter and settle
    on the most popular scripting language of the day. You have little time to waste.


    Footnotes [1](#321739_2_En_3_Chapter.xhtml#Fn1_source)   [2](#321739_2_En_3_Chapter.xhtml#Fn2_source)


    # 4. The Front End: Presentation


    Knowing which language to use is helpful, but without a front end, a user cannot
    do anything. Recall that the front end is the interface for users to interact
    with the back end. It refers to what you see and the range of interactions you
    can perform on a given web page. You start to think about how MyAppoly will look,
    which pages you want, and how they will be connected (e.g. button A on page 1
    takes you to page 9). Then, you finalize a set of features you want to include
    in MyAppoly and develop wireframes of each web page.


    Wireframes are simple blueprints for a screen. Putting together wireframes forces
    you to think about information design and interaction design. *Information design*
    relates to how you present all of the content or messaging you want to communicate
    to the user. *Interaction design* refers to the series of actions you want the
    user to perform to complete some overall task. For example, the placement of product
    descriptions and reviews on a site such as Amazon falls under information design,
    while the flow through which a user reviews an item, adds it to the cart, and
    ultimately purchases it relates to interaction design.


    As you design your front end, you’ll also want to consider the user interface
    and the user experience. The *user interface*, frequently abbreviated as UI, refers
    to how the application looks. A good UI makes an application intuitive to use,
    whereas a bad UI may be cluttered or confuse the user. The *user experience* (UX)
    refers to how users feel about using your application; you should always strive
    for a positive user experience, which generally comes from having a back end that
    works well, an easy-to-understand UI, and information and interaction designs
    that are well thought-out.


    You review the mock-ups for MyAppoly with your CTO. In effect, you have created
    a paper version of your website. Great! How do you get your website to look like
    that? How will you create the interactive effects that you see on most modern
    web pages? Certain languages and tools have become so ubiquitous that it is worth
    learning the basics because together they form the presentation layer and define
    what your users will experience.


    ## Front-End Technologies


    The standard front-end tools for creating the presentation layer include HTML/XHTML,
    CSS, JavaScript, and Ajax.'
