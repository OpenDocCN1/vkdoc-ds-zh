    ## 互惠许可


    根据这些许可，代码将被纳入开源软件库。任何人都可以出于任何目的使用该库中的代码，但如果你选择传播自己新创建的代码，则必须以相同的许可协议进行分发。换句话说，你可以利用这些代码来创作新作品，但必须将你的新作品贡献到代码库中以供他人使用。`GPL`
    就是互惠许可的一个例子。


    许多人担心开源代码的质量。一种评估标准包括可靠性、性能和总体拥有成本。其他用于评估质量的指标包括可移植性、灵活性和自由度。无论你选择哪种指标，关键在于，利用现有代码的诸多优势可能会被依赖他人代码和系统所带来的固有风险所抵消。尽管如此，一些开源项目已经达到了与商业软件相同的复杂度和质量标准。


    ## SDK


    顺便提一下，你可能会在 `MyAppoly` 办公室听到 SDK（即软件开发工具包）这个术语，尤其是在团队讨论移动应用开发时（第 13 章）。为了方便开发人员为某个平台（例如驱动苹果
    iPhone 的 iOS 软件）进行开发，平台提供商可能会提供一个 SDK。这个 SDK 可以下载，其中包含开发人员为该平台构建应用所需的一切，可能包括文档、第
    3 章讨论的集成开发编辑器、API 及其他有用的库，以及相关工具（例如用于调试——查找错误——或跟踪性能）。目标是让事情变得简单，因此能够可靠利用的构建块越多越好。


    ## 结论


    随着对 API 和其他利用现有代码方式的更深入理解，你的团队制定出了一个完整的开发计划。使用一些关键的 API 和共享库有助于加快进度，但团队计划逐步减少对其中一个库的使用，因为它无法提供
    `MyAppoly` 所需的全部功能。由于其他一些贡献库和工具的性能差且不可靠，团队已将其排除在外。你必须在自主开发和外包之间取得平衡，既然已经做出了决定，你的团队就可以开始开发
    `MyAppoly` 了。但他们将如何协作构建它呢？


    脚注 1 2 3 4


    # 软件开发：团队协作


    厨师多了烧坏汤。这句谚语同样适用于编程，除非你以正确的方式组织你的工程师。


    你花了最近几周的时间组建了一个由雄心勃勃的工程师组成的小团队。他们了解后端、前端和数据库的交互方式，并已准备好开始为 `MyAppoly` 编写程序。在开始之前，你需要制定协作指南。他们将如何合作？两个人可以同时处理同一个文件吗？一位工程师如何理解另一位工程师的工作？


    这些问题对于任何技术性工作来说都很重要。各种设计原则和工具支持团队化编码，使其更快、更安全。为了与你的工程师进行有效沟通，你需要理解这些原则和工具的术语——尤其是版本控制系统。


    ## 文档


    工程师向队友解释其代码最简单的方式就是注释代码。每种编程语言都允许程序员在特定代码行或代码块旁边编写注释，以解释代码的工作原理或功能。示例注释包括“更改用户密码”或“将用户添加到数据库”。有了这些注释，新工程师可以快速了解代码库，程序员也可以有效地为那些他们不太熟悉的代码做出贡献。注释还能让管理者更高效地审查代码，因为英文陈述提高了代码的可读性。注释是**文档**的一种形式，文档是对某个过程或功能的一系列描述和说明。文档通常采用段落形式，以帮助工程师更快地理解重要功能的设计和实现。如果你负责
    `MyAppoly` 的首席工程师构建了一个允许应用处理信用卡支付的新功能，他们可能想写几段文字，解释该功能如何与程序的其余部分集成、代码如何工作、代码保存在哪里、逻辑如何运作、他们使用了哪些
    API 等等。


    除了这些外部文档外，编码风格对团队也至关重要。这里的**风格**，我指的是命名约定（如何在程序中命名变量）、缩进和空格的使用、注释的结构以及其他方面。想象一下，一段代码要求用户输入姓名，然后将其保存到数据库中。一位工程师可能会格式化文本，并将存储用户姓名的变量命名为
    "name"，而另一位工程师可能会把它命名为类似 "var293" 这样含义模糊的名字。显然，前者比后者更容易理解。这些编码风格很重要；因此，制定一份供所有工程师使用的标准风格指南是一种常见做法。许多编程语言本身也带有各自的风格指南或约定，可以作为起点。如果
    `MyAppoly` 的工程师遵循这些约定，那么所有功能的格式和标签都将保持一致，新工程师也将能够更轻松地协作和审查代码。

    '
- fmt: '# Program Architecture


    There are several ways you can organize MyAppoly’s code. In Chapters [3](#321739_2_En_3_Chapter.xhtml)
    through [5](#321739_2_En_5_Chapter.xhtml), you learned how code performs the program’s
    logic, constructs what the user sees, and interacts with databases. If all this
    code were lumped together, the program would be slow and unmanageable: imagine
    if all of a program’s code sat in one file. How could an engineer even determine
    where to edit in a file millions of lines long?


    Thankfully, programming is a mature endeavor, and smart people have developed
    better ways to organize code. These design principles not only improve efficiency
    and code performance but also conduce to better collaboration and code maintainability.


    One of the most common categories of organization is the multitier application
    architecture. The most widespread of these is the three-tiered architecture. The
    three tiers correspond more or less to the subjects of Chapters [3](#321739_2_En_3_Chapter.xhtml)–[5](#321739_2_En_5_Chapter.xhtml).
    One tier concerns all things connected with the database, often called the model
    (Chapter [5](#321739_2_En_5_Chapter.xhtml)). The middle tier is the controller
    or application processing tier, which contains the logic of the program and relates
    to the back end of the program (Chapter [3](#321739_2_En_3_Chapter.xhtml)). The
    last tier is all things that a user sees: the view or presentation (Chapter [4](#321739_2_En_4_Chapter.xhtml)).
    There are several other architectures, but I’ll focus on why these architectures
    exist in the first place rather than go into the details of how each one is different.


    First, these architectures support parallel work (this design principle is often
    called *separation of concerns*). One engineer can work on the presentation of
    MyAppoly while another works on the model. The controller engineer can tell the
    model engineer, “I don’t care how you do it, but I need the first name of the
    user.” Thus, the view engineer and controller engineer can continue coding assuming
    they have some way to access the name of the user, and they don’t have to worry
    about the code that physically goes into the database to get the name. The model
    engineer can provide the other two engineers with a simple description: “If you
    want the name, call the function `getUserName`. If you want the user’s location,
    call `getUserLocation`.” The model engineer can then code the database interaction
    in any way. From this example, you can see that the three parts of the application
    can be developed relatively independently because each engineer does not need
    to be concerned with the specifics of how the other parts are coded.


    Second, this setup supports maintainability. Imagine that the controller engineer
    tells the model engineer they need a user’s name, address, and ZIP code. The model
    engineer writes three functions to get these pieces of data from the database
    and gives them to the controller engineer, who can then manipulate them before
    passing them off to the view engineer to display to the user. Three months later,
    the engineers determine that the model code is too inefficient in getting information
    from the database. Luckily, the view and controller engineers do not have to change
    anything. The model engineer can update their functions to improve performance,
    and nothing else in the application has to change. If the team were not using
    a well-defined architecture, this database code could be in any file. It would
    be a lot harder to hunt down every database-related code and change it.


    A third reason one might choose to use such an architecture is code reusability.
    Imagine if the view engineer wants to show the user’s name on every page. The
    inefficient way of doing this would be to rewrite the database code that gets
    the user’s name on every single web page of the whole site. Instead, the view
    and controller engineers can call the same function `getUserName` that goes into
    the model and executes the query to get the name. This abstraction enables engineers
    to be more efficient and economical with their code.


    The sum of these three advantages is clear: shortened development time. Products
    can be built and maintained more quickly, and precious engineering time can be
    dedicated to more value-added activities.


    # Revision Control


    The architecture of a program helps separate functionality so that multiple engineers
    can work on a given project at the same time. But just separating functionality
    is not a complete solution. How does a team of engineers effectively coordinate
    their programming efforts? How does one person notify the team that they have
    updated a particular file? Do they email the newly updated files? If you are an
    engineer about to update a file, how do you know that you are working on the most
    up-to-date version? Perhaps you introduced a bug or an error into the code, and
    you want to go back to an older version. How do all of these frustrations get
    resolved? *Revision control* (also known as *version control* or *source control*)
    refers to the management of changes to a document. Your team will likely use a
    revision control system, such as Git or Mercurial, to solve these problems. We’ll
    discuss some of revision control systems’ features and their advantages.


    ## Conflict Resolution


    The two dominant ways to help resolve conflicts when multiple engineers are collaborating
    on a given project are file locking and version merging.


    *File locking* is a method of preventing concurrent access to a given file. Think
    of a standard document that contains an essay. If two people edit the essay simultaneously,
    how do we determine whose edits to include? Can they be merged? File locking gives
    “write” privileges (the ability to edit a file) to the first person who opens
    the file and locks the file for other users. If another user tries to open the
    locked file, it will only be available for viewing (“read” access).


    The benefit of file locking is that it avoids complicated problems with merging
    two sets of edits to the same file. When Engineer 2 opens a file already being
    edited by Engineer 1, they will be notified. There are drawbacks, however, to
    this solution. Engineer 2 has to wait for Engineer 1 to finish editing, introducing
    a delay in the process and slowing down development. Imagine, in a worst-case
    scenario, that Engineer 1 called out sick for a few days after opening a file.
    Either Engineer 2 would be locked out of the file for several days or they would
    need to get a higher authority to force-unlock the file, a process called *file
    unlock*. Another drawback is that this system might give a false sense of security.
    Two files that depend on each other could be locked by different engineers and
    altered in such a way to compromise their compatibility.


    The other dominant conflict resolution method, *version merging*, allows multiple
    users to edit a single file. After several engineers finish working on the same
    file, the system helps merge the changes. When the engineers all work on different
    parts of a particular file, merging is easy, just as one editor could change an
    introduction to an essay while another modifies the conclusion. In contrast, two
    engineers changing the same part of the file in different ways creates a *conflict*
    that has to be resolved manually. Though the term “conflict” sounds hectic, many
    feel this type of system works more smoothly because there is less wasted time.
    As long as engineers do not work on the same parts of files, few conflicts emerge,
    and the merging process moves seamlessly. The process works well for text-based
