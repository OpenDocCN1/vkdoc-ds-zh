    are crucial for IoT networks that we rely on for our health and safety. For example,
    if smart locks secure the MyAppoly office, the consequences of an Internet outage
    could compromise the safety and security of the office building.


    Third, the Roost IoT network can successfully make use of massive amounts of data
    thanks to current big data technology. As we discussed in Chapter [5](#321739_2_En_5_Chapter.xhtml),
    big data is high velocity (rapidly updated pieces of data), high volume (large
