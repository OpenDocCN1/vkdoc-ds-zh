  trans: '

    ### 保护应用程序安全


    考虑如何保护应用程序安全可能会让人感到不知所措。幸运的是，有许多开源库和包已经为你实现了相关协议和最佳实践。使用库至关重要，因为安全措施很难实现——而实现不当的安全方案会使你的应用程序极易受到攻击。流行的开源库往往拥有健壮的实现，因为任何人都可以审查代码并指出漏洞。请寻找那些维护良好、开发者能及时响应问题的库。


    我们讨论过的许多攻击和缓解措施都归结于同一个教训：永远不要信任用户。特别是，一些完整性攻击（如 SQL 注入）依赖于恶意行为者提供输入，导致应用程序执行有害操作。如前所述，验证用户输入是防御此类攻击的一个环节。


    另一个环节是访问控制，即建立权限机制，使每个用户只能访问他们所需的内容。考虑一个银行为每个用户提供主页`mybank.com/username/home`。通过猜测用户名，攻击者可以找到其他用户的主页并访问敏感信息，这明显违反了保密性原则。取而代之的是，银行可以在加载内容前，检查登录用户的用户名是否与他们试图访问的页面所关联的用户名匹配。正确的访问控制意味着，应用程序在用户查看内容（例如其银行主页）或执行操作（例如从账户取款）之前，会确保该用户拥有相应的权限。


    ### 维持安全状态


    既然你已经构建了应用程序的安全初始版本，你可能会希望将所有精力都集中在产品营销上。不幸的是，俗话说“好人不得安生”——恶意行为者不会停止攻击你的资源。即使你没有积极开发新功能，也必须采取预防措施，确保应用程序保持安全——两项关键措施是测试和安装更新。


    安全测试建立在开发应用程序时进行的测试之上。例行测试不一定能捕获所有错误。发现安全漏洞异常重要，因为它们可能导致严重后果，而逻辑错误或渲染错误充其量只会导致用户体验不佳。为了捕获这些高风险错误，开发者会使用渗透测试，这是一种模拟对应用程序进行安全攻击的模型。渗透测试通常采用模糊测试，即随机生成应用程序输入，并确认输出既有效又符合预期。模糊测试有助于模拟其他测试可能无法发现的边缘情况。许多公司还聘请白帽黑客来寻找系统中的缺陷，以便在恶意行为者发现并利用这些缺陷之前进行修复。


    你的应用程序中的错误并非唯一需要担忧的问题。你的工作不可避免地会依赖于他人构建的平台、框架和库。有时，这些第三方中的一方会发现一个安全漏洞，并发布更新来修复它，这也称为补丁。及时安装更新至关重要；在安装补丁之前，你的应用程序仍容易受到该补丁本应修复的安全漏洞的攻击。以
    Equifax 数据泄露事件为例，黑客利用了 Equifax 忽视更新、已存在数月之久的旧版第三方库漏洞。^(²²) 这些漏洞甚至存在于最成熟的库中——Heartbleed
    漏洞，它曾为有史以来最具破坏性的攻击之一开辟道路，就存在于广泛用于执行 TLS 协议的 OpenSSL 库中。正如我们所讨论的，TLS 是计算机之间通信的一个环节。利用
    Heartbleed 协议的黑客可以操纵请求，诱骗计算机发送超出其访问权限的信息；有时，这些数据包括用户名和密码等个人信息。在此案例中，黑客的关键发现是意识到接收信息的计算机并未验证它们所请求的信息量。这个例子再次说明了验证用户输入的必要性。


    ### 最小化损害


    即使你遵循了上述所有最佳实践，黑客仍可能攻破你的系统。新的攻击方法层出不穷，因此应用程序永远无法达到 100%的安全。遭受攻击后，你必须努力保护资源并尽快恢复。第一步是检查系统日志。日志是对某个操作、事务或事件的报告。计算机日志很有用，因为它们可以持续监控系统，并且你可以选择在日志中记录哪些内容。例如，你可以记录用户登录的时间，或你的应用程序进行
    API 调用的时间。大多数这些日志应该是无害的，而且理应如此，因为你的站点上的大部分活动应该是合法的。然而，当出现可疑活动时，日志可以更容易地发现恶意行为或欺诈。以信用卡公司注意到某个用户的凭证在世界各地出现为例。这可能是一位环球旅行者——也可能是身份被盗用。无论哪种情况，日志都能提供对情况的洞察以及如何最好地推进。你可能需要修复一个错误或构筑更多预防措施，比如将违规网站加入黑名单。


    在遭受可用性攻击并失去对数据的访问权限后，你需要尽快恢复服务。因此，最佳实践是在不同的物理位置维护数据的加密备份。即使你意外丢失了数据（比如将手机掉进水里），备份也能确保你在一定程度上安全地恢复数据，而不是丢失一切。将备份存储在不同位置可以保护数据免受物理攻击。


    备份数据至关重要，尤其是在提供敏感服务时。让我们来看看 WannaCry 勒索软件事件，该软件攻击了英国国家医疗服务体系（NHS）的 60 多个组织。^(²³)
    尽管 NHS 存在宽松的安全实践，使得 WannaCry 得以入侵其系统，但其备份系统使大多数组织能够从攻击中恢复过来，没有数据丢失，也无需支付要求的赎金。对于服务危重病人的医疗系统来说，快速恢复的能力至关重要。由于拥有强大的企业备份系统，WannaCry
    与其他勒索软件相比在财务上远不成功，因为受影响的业务只是丢失了它们数据的一份副本。

