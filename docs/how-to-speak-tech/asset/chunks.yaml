    # 区块链


    特别感谢 Vojta Drmota 为本章节撰稿。


    *区块链技术*，有时也被称为*分布式账本技术*，是技术领域最新的创新之一。它在金融、法律、经济学、数学、哲学和计算机科学等众多领域都有应用。本章将介绍其基础知识。


    ## 区块链简介


    现代技术的支柱之一就是数据的存储方式。由于可用数据量巨大，以易于日后访问的方式存储数据非常重要。你可能会选择用电子表格来存储个人预算，行列分明，便于直观浏览。许多拥有海量数据的公司将其存储在关系数据库中，这些数据库类似于电子表格，但也易于通过编程方式导航。*区块链*只是另一种数据存储方式。


    存储在区块链中的数据被打包成*区块*，这些区块链接在一起形成一条线性链条：即区块链。可以将区块链想象成一本书，整本书代表区块链，每一页代表一个区块。区块链中的区块像书页一样编号，从第一个区块（称为*创世区块*）开始，一直到最后一个。这里的页码，代表了区块在区块链中的位置，被称为*区块高度*。书页大小统一，因此能容纳预定最大数量的单词。同样，区块链中的区块具有统一的数据存储容量，能存储预定最大数量的数据。


    总的来说，读者在翻阅一本书时会认为有两件事是理所当然的。首先，读者认为书中应该有的每一页都确实存在。如果一个学生买了一本历史教科书，其中关于第二次世界大战的章节，甚至几页内容缺失了，那么这个学生就会失去关键信息。换句话说，我们期望相同版本的书籍包含完全相同的信息。这一期望同样适用于区块链。特定区块链的每个副本都必须包含所有相关的区块——从而包含所有相关数据——才能成为*有效*的。否则，共享一个区块链来存储数据的两方将会拥有相互矛盾的数据源。其次，我们认为书中页面的顺序是正确的。例如，如果一个学生试图理解二战的时间线，而关于战争结束的页面毫无逻辑地出现在战争起因页面之前，他就会被误导。由于数据通常遵循逻辑顺序，因此需要按逻辑存储。这也适用于区块链中的区块：包含你花费比特币数据的区块不能出现在包含你收到比特币数据的区块之前——那意味着你还没赚到比特币就开始花费了。因此，为了使区块链*有效*，区块的顺序必须保持不变。


    区块链*有效*意味着什么？答案涉及区块链最初作为一种数据存储方式出现的根本原因。在区块链上存储数据并不能让一家公司比使用传统数据库存储更多的数据。在区块链上存储数据也不能让公司比传统数据库更高效地导航数据。那么，为什么会有人想要在区块链上存储数据呢？在区块链上存储数据的优势在于其独特的能力，即允许多个独立方将数据添加到共享的数据存储中。因此，区块链有时被称为*分布式数据库*。例如，十家维护疫苗接种记录的私营公司可以将这些记录存储在区块链上以共享数据，从而确保没有客户重复接种同一种疫苗。当参与公司中至少有一多数同意区块链正在适当地存储数据时，该区块链就是*有效*的。你将在本章后续部分了解到这具体意味着什么。

    '
- fmt: '为什么这些公司不能共享一个由其中一家公司拥有所有权的中央数据库呢？它们当然可以这样做，而这正是区块链诞生之前的主要解决方案。然而，中央数据库解决方案有一个主要缺点：存在单点故障。如果负责管理服务器的公司意外关闭了服务器怎么办？如果该公司没有妥善备份数据库，导致所有数据突然丢失怎么办？如果该公司决定将另一家公司排除在系统之外，并单方面撤销其访问权限怎么办？换句话说，中央数据库解决方案要求所有参与方信任一个单一的中央权威机构。另一方面，如果数据存储在区块链上，则无需一个单一的中央权威机构来维护中央数据库的服务器。相反，这十家公司各自维护一份数据副本，并独立验证任何新增疫苗接种记录的有效性。这种无需依赖中央实体即可集体存储和检索数据的特性，被称为*去中心化*。参与区块链的每个个人或机构被称为一个*节点*。


    ### 区块长什么样？


    *区块*是区块链的基本支柱。它们存储所有信息，并通过链接在一起形成区块链。区块链中的每个区块都由一个*数字指纹*表示，该指纹是该区块的唯一标识，可用于在区块链中明确无误地识别该区块。数字指纹的工作原理与人类指纹非常相似。人类可以通过其指纹被明确无误地识别，这意味着如果有人犯罪现场留下了指纹，调查人员可以利用这些指纹与数据库中先前收集的指纹进行比对。然而，仅凭指纹本身无法识别出这个人：指纹数据库需要包含指纹与其他身份识别信息（例如人名和面部照片）之间的映射关系。区块的数字指纹工作原理相同：无法从区块的数字指纹中推断出区块内的任何数据，但可以通过其数字指纹在区块链中明确地识别一个区块。这在检查区块链的某个副本是否缺少任何区块时非常有用。


    除了自身的数字指纹和包含的任何数据外，每个区块还包含其前一个区块的数字指纹。区块链是一种线性数据结构，这意味着每个区块都被*追加*到另一个区块上，并且最多只有一个区块随后被追加到它后面。区块通过存储它们所追加到的区块的数字指纹引用来链接在一起，这也使得维护和验证区块的正确顺序变得容易。


    数字指纹只是一个64字符长的十六进制数。以下是数字指纹的一个示例：


    ```

    0f978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb

    ```


    *十六进制数字系统*与人类常规使用的十进制系统不同，它包含具有16个值（0–f）的数字，而不是10个值（0–9）。使用十六进制系统是因为它可以用比十进制系统更少的字符来表示更多的数字。这有利于数据存储效率。例如，十六进制系统中仅用三位数字可以表示的最大可能数字是`fff`。在十进制系统中，这个数字是4095，这远大于十进制系统中最大的三位数999。


    ### 挖矿的科学


    *挖矿*可能是区块链技术中最难以捉摸的概念。让我们首先理解挖矿所填补的需求。回顾一下十家私营公司使用区块链共享其客户疫苗接种记录数据库的例子。没有中央权威机构，没有单独一家公司负责维护数据库并确保其中所有数据都正确存储和准确无误。相反，这十家公司各自审查所有传入数据并维护区块链的本地副本。如果没有中央权威机构来规定，这些公司如何就添加哪些数据以及丢弃哪些数据达成一致？参与区块链的这十家公司需要就添加哪些数据达成*共识*或协议。挖矿是多个节点之间达成此共识的一个过程。它首创于比特币加密货币，这是区块链技术的第一个广泛应用。比特币的挖矿过程将在本章后面解释，但在所有区块链中，挖矿过程的核心部分是创建区块的数字指纹。


    数字指纹的创建涉及密码学，而密码学 heavily 依赖于数学。数字指纹是通过对区块数据运行*哈希函数*来创建的。哈希函数接收任何输入数据（通常是文本），对数据应用数学算法，并输出一个唯一代表输入数据的值。比特币区块的数字指纹是通过对区块数据运行
    `SHA256` 算法（一种由美国国家安全局(NSA)设计的哈希函数）来创建的。`SHA256` 接收任意大小的数据作为输入，操作这些数据，并输出一个64字符长的十六进制数，称为*哈希值*。无论输入数据的大小如何，输出总是64个字符长。输入数据中的任何变化都会产生一个新的、唯一的哈希值，并且实际上，两个不同的输入不可能产生相同的哈希值。这使得检测区块数据是否被篡改变得非常容易。因此，一个区块数据的哈希值，通俗地称为该区块的*数字指纹*，被用作区块标识符。表[16-1]显示了一些从任意输入数据生成的数字指纹示例：


    **表16-1. 数字指纹示例**


    | 输入数据 | 数字指纹：`SHA256` 哈希值 | 备注 |

    | --- | --- | --- |

    | `a` | `ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb` | 一个字符产生一个64字符长的哈希值。
    |

    | `Blockchain` | `ef7797e13d3a75526946a3bcf00daec9fc9c9c4d51ddc7cc5df888f74dd434d1`
    | 一个完整的单词产生同样长度的哈希值。 |

    | `Blockchains` | `99cf6497afaa87b8ce79a4a5f4ca90a579773d6770650f0819179309ed846190`
    | 单词中的一个微小变化会产生一个全新的哈希值。 |

    | `The favorite number of the fox was 44.` | `f70d31700c3c122331538f9b389a10217e0bd1cc0694b67a5c7b4f02c17b6198`
    | 无论输入数据的长度如何，哈希值总是64个字符长。 |


    你可能听说过挖矿是一个*计算密集型过程*。然而，从任何输入数据（如上述数据）生成哈希值只需要不到一秒钟的时间，并且可以在不消耗过多计算机资源的情况下完成。换句话说，生成哈希值本身*不*是一个计算密集型过程。使挖矿成为计算密集型过程的原因是，需要从输入数据中生成特定类型的哈希值，才能为区块创建有效的数字指纹。例如，在比特币区块链中，这需要从区块数据生成一个数值小于给定*目标值*的哈希值。关于挖矿过程的更多信息，可以在本章的比特币部分找到。'
  raw: 'Why can’t these companies just share a central database stored on a server
    owned by one of the companies? They surely can, and this was the primary solution
    before the blockchain was invented. Yet, the central database solution has the
    major disadvantage of having a single point of failure. What if the company in
    charge of the servers shuts them down unexpectedly? What if the company doesn’t
    properly back up the database and suddenly loses all the data? What if the company
    decides it wants to shut another company out of the system and unilaterally revokes
    their access? In other words, the central database solution requires all parties
    to trust a single, central authority. If the data is stored on the blockchain,
    on the other hand, there is no need for a single, central authority to maintain
    a server with the central database. Instead, each of the ten companies maintains
    a copy of the data and independently verifies the legitimacy of any new vaccination
    record that is added. This lack of a central entity that needs to be trusted for
    data to be collectively stored and retrieved is known as *decentralization* .
    Each individual or institution participating in a blockchain is known as a *node*.


    ### What Does a Block Look Like?


    *Blocks* are the fundamental pillars of the blockchain. They store all information
    and are linked together to form the blockchain. Each block in the blockchain is
    represented by a *digital fingerprint*, which is unique to the block and can be
    used to unambiguously identify the block in the blockchain. A digital fingerprint
    works very similarly to a human fingerprint. Humans can be unambiguously identified
    with their fingerprints, meaning that if someone leaves their fingerprints at
    a crime scene, investigators can use the fingerprints to match them against fingerprints
    previously collected in a database. However, the person cannot be identified from
    the fingerprints alone: a fingerprint database needs to contain a mapping between
    fingerprints and other forms of identification, such as people’s names and photos
    of their faces. Digital fingerprints of blocks work in the same way: nothing about
    the data in a block can be deduced from the block’s digital fingerprint, but a
    block can be unambiguously identified in the blockchain using its digital fingerprint.
    This is useful when, for instance, checking whether one copy of the blockchain
    is missing any blocks.


    Other than its own digital fingerprint and any included data, each block also
    contains the digital fingerprint of the block immediately before it. A blockchain
    is a linear data structure, which means that each block is *appended* to one block
    and has at most one block that is, in turn, appended to it. The blocks are chained
    together by storing references to the digital fingerprints of the block to which
    they are appended, which also makes it easy to maintain and validate the correct
    order of the blocks.


    A digital fingerprint is simply a 64-character-long hexadecimal number. Below
    is an example of a digital fingerprint:


    ```

    0f978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb

    ```


    The *hexadecimal numeral system*, unlike the decimal system humans conventionally
    use, contains digits with 16 values (0–f) rather than 10 values (0–9). The hexadecimal
    system is used because it allows for more numbers to be represented using fewer
    characters than the decimal system. This is good for data storage efficiency.
    For instance, the largest possible number that can be represented in the hexadecimal
    system using only three digits is *fff*. In the decimal system, this number would
    be 4095, which is significantly larger than 999, the largest possible three-digit
    number in the decimal system.


    ### The Science of Mining


    *Mining* is perhaps the most elusive concept in blockchain technology. Let’s begin
    by understanding the need that mining fills. Recall the example of ten private
    companies using a blockchain to share a database of their clients’ vaccination
    records. There was no central authority, no single company in charge of maintaining
    the database and ensuring that all the data in it is correctly stored and accurate.
    Instead, each of the ten companies individually vetted all incoming data and maintained
    a local copy of the blockchain. How do the companies agree on what data to add
    and what to throw away if there is no central authority to stipulate this? The
    ten companies involved in the blockchain need to come to a *consensus*, or agreement,
    on what data to add. Mining is a process by which this consensus is reached between
    multiple nodes. It was pioneered in the Bitcoin cryptocurrency, the first widely
    used application of blockchain technology. The process of mining in Bitcoin will
    be explained later in this chapter, but a core part of the mining process in all
    blockchains is the creation of blocks’ digital fingerprints.


    The creation of digital fingerprints involves cryptography, which relies heavily
    on mathematics. A digital fingerprint is created by running the block data through
    a *hash function*. A hash function takes any input data, usually text, applies
    a mathematical algorithm to the data, and outputs a value that uniquely represents
    the input data. Digital fingerprints for Bitcoin blocks are created by running
    the block data through the SHA256 algorithm, a hash function designed by the US
    National Security Agency (NSA). SHA256 takes any arbitrarily sized data as input,
    manipulates that data, and outputs a 64-character-long hexadecimal number, known
    as the *hash*. Regardless of the size of the inputted data, the output is always
    64 characters long. Any change in the input data will produce a new, unique hash,
    and the same hash cannot, in practice, be produced by two different inputs. This
    makes it very easy to detect if a block’s data has been tampered with. Thus, the
    hash of a block’s data, colloquially referred to as the block’s *digital fingerprint*,
    is used as a block identifier. Table [16-1](#321739_2_En_16_Chapter.xhtml#Tab1)
    shows a few examples of digital fingerprints generated from arbitrary input data:


    Table 16-1.


    Digital Fingerprint Examples


    | Input Data | Digital Fingerprint: SHA256 Hash | Notes |

    | --- | --- | --- |

    | a | ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb | One character
    produces a 64-character-long hash. |

    | Blockchain | ef7797e13d3a75526946a3bcf00daec9fc9c9c4d51ddc7cc5df888f74dd434d1
    | An entire word produces an equally long hash. |

    | Blockchains | 99cf6497afaa87b8ce79a4a5f4ca90a579773d6770650f0819179309ed846190
    | One small change in the word produces a completely new hash. |

    | The favorite number of the fox was 44. | f70d31700c3c122331538f9b389a10217e0bd1cc0694b67a5c7b4f02c17b6198
    | Regardless of the input data’s length, the hash is 64 characters long. |


    You might have heard that mining is a *computationally intensive process*. However,
    generating a hash from any input data, such as the above, takes a fraction of
    a second and can be done without using too much of a computer’s resources. Generating
    a hash, in other words, is *not* a computationally intensive process in and of
    itself. What makes mining computationally intensive is that a specific type of
    hash needs to be generated from the input data in order to create a valid digital
    fingerprint for a block. In the Bitcoin blockchain, for instance, this entails
    generating a hash from the block data whose numerical value is smaller than a
    given *target value*. More information about the mining process can be found in
    the Bitcoin section of this chapter.'
