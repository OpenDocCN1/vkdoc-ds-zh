- fmt: '### Centralized vs. Distributed


    Revision control systems are either centralized or distributed. With **centralized**
    systems, all of the code is stored on a central server, called the main **repository**.
    Whenever an engineer wants to open a file or save a file, they have to be connected
    to the network to access the central server. This model is referred to as a client-server
    model and is similar to the model for retrieving websites. Although a full copy
    of the code can exist on a client’s, or engineer’s, computer, the history of all
    the changes is kept on the main server. If for whatever reason the central server
    goes down, the code and its history are either lost or temporarily unavailable,
    a single source of failure.


    In the distributed model, multiple copies of the entire codebase and history (repository)
    exist on the machines of the engineers who are working on the project. They can
    open and save files when not connected to a network and can perform functions
    more quickly. Each engineer has a local copy of the repository (`repo` for short)
    that is updated with changes, although a distributed system can also use a centralized
    server. Every local copy (or working copy) is in effect a backup. There has been
    a significant shift to more distributed models for these reasons.


    ### Revision Control Advantages


    Revision control allows engineers to submit code changes, and it keeps track of
    each change independently and sequentially. As a result, engineers can see a full
    timeline of the edits to a file and can quickly **revert** to a previous version
    of the file or even of the entire codebase. Moreover, each edit is accompanied
    by comments from its engineer explaining the change. Future engineers can easily
    see who was responsible for each change and ask for further clarity if needed.


    Revision control systems are fast because they only track the changes, or **diffs**,
    to the files. For example, if you just added a sentence to a book, you could more
    quickly describe your edit by indicating where to insert the sentence and what
    to add instead of copying the entire new edition. Similarly, revision control
    systems track two things: the line numbers of changes and the actual changes (either
    added code or deleted code). Once saved, the diff is sent to the master version
    of the codebase, meaning other engineers will always have access to the most up-to-date
    version of the codebase.


    Another significant advantage is that two engineers can use their own copies to
    work on separate features independently. If the features don’t edit the same code,
    they are easily merged. Otherwise, the revision control system will have a conflict
    management system that makes it easy to combine the code for the two features
    or will use file locking to prevent conflicts in the first place.


    Version control also allows engineers to **tag** the codebase in various states.
    Recall that revision control systems enable viewing of the codebase for any prior
    time. You may want to bookmark the codebase at certain times. For example, you
    may want to label the released codebase with a “version 1.0” tag. Similarly, you
    may want to tag well-tested but unreleased code as “beta” or the most recent changes
    as “latest” for easy access.


    ## Conclusion


    Programming in teams can present several obstacles, but with the proper style
    guide, program architecture, and version control system, teammates will be able
    to collaborate more effectively. Next time someone tells you too many cooks spoil
    the broth, tell them to use `Git`.


    # 8. Software Development: The Process


    In 2011, having spent the previous three years advising entrepreneurs on organizing
    resources and designing processes, Eric Ries laid out his methodology in the book
    *The Lean Startup*, the release of which sparked the Lean Startup movement. Its
    philosophy, which articulates a continuous and feedback-driven approach to product
    development, informs this chapter.


    Your CTO says that `MyAppoly` must have a well-defined process for developing
    the product. Should you aim to release a new feature once a month? Should someone
    build and test a new feature before showing it to the team? What should the flow
    of software development look like, and how can it be managed? This chapter does
    not directly relate to the technical aspects of a web application, but any process
    of developing software must account for the complexity and unpredictability of
    software production. A high-level understanding of how software development teams
    work will make you a better manager. Your team tells you about their design for
    the software development process (the way the product will be built). Without
    an agreed-on process, development can become chaotic and end in failure. Luckily,
    your engineers know what they are talking about.


    ## The Waterfall


    The waterfall development model consists of distinct stages that are sequential.
    Let’s say you are in the market for a new house. Congratulations! You cannot find
    anything that you want, so you decide to build your own.


    First, you meet with an architect to define your timeline and requirements. These
    include details such as materials to be used and the number of bedrooms and bathrooms
    you want. After finalizing your requirements, you work with the architect to put
    together a blueprint. Next, you gather a construction team and break ground on
    the house. The general contractor tells you to come back in ten months when the
    entire house will be finished. When it’s done, you visit the property and take
    a tour. In a way, you are testing it to make sure it was built to specification.
    Assuming there are no gaping holes in the walls or missing staircases, you will
    hopefully move into the house and invite me to your housewarming party. This development
    process followed the five stages of the waterfall model: requirements, design,
    implementation, verification, and maintenance.


    Here, the inputs and outputs are well-defined, and backtracking to an earlier
    stage is incredibly expensive. If, for example, in the **implementation** phase
    of construction you wanted to change the layout of the house, imagine the costs
    of demolishing, redesigning, and then reimplementing the project. For this reason,
    the waterfall model recommends that every detail of the entire project is confirmed
    before moving on to the next stage.


    ## A More Appropriate Approach


    If you have been exposed to software development, you know that knowing every
    detail of the whole project is never possible. Who knows what new technology will
    be out in a few months? Maybe we will want to use that. What if the aspects of
    the code do not correctly work the way we expect them to? We might have to engineer
    it in a different way. What if we find out that our initial page layout is too
    confusing? All of these issues happen regularly, so a long-term and sequential
    process cannot necessarily be applied to software. Additionally, unlike home construction,
    there is room for more rapid iteration. Software typically does not require the
    same capital commitment as home building. Therefore, characteristics that support
    the waterfall model do not apply to software.'
