  trans: '

    ### 面向对象模型


    *面向对象* *数据库*围绕着面向对象编程语言中的*对象*概念（第 3 章）。这些对象描述实体，每个对象包含一系列描述其自身的属性或特征，以及一组可在每个对象上执行的操作（例如，描述宠物主人的对象可能能够购买宠物）。与之前一样，每个对象必须具有唯一性，因此通常使用`Object
    ID`。你可以通过以下方式理解对象间的关系编码：描述宠物主人的对象可能存储了描述宠物详情的宠物对象的`Object ID`。因此，如果你想获取用户 X 的宠物详情，可以访问用户
    X 的对象，获取对应的`pet ID`，然后访问宠物对象。这些对象可以分层排列，以赋予系统更多结构，并利用继承及其他与面向对象模型相关的特性。


    面向对象模型功能强大，因为它们允许保留某些对象的复杂特性。此外，它们有助于将对象的结构与可应用于对象的操作分离开来。这些模型如何运作的细节留待更专业的技术著作阐述，但“关系模型”中讨论的许多术语也适用于此模型。例如，面向对象模型也有一种查询语言：*对象查询语言*（`OQL`）。


    ### 对象关系模型


    面向对象的特性已融入关系型系统，形成了*对象关系模型*，融合了两种模型的优点。例如，在对象关系系统中，你可以定义自己的数据类型。


    ### XML


    如第 3 章和第 4 章所述，`XML`是一种标记语言，可用于为文档赋予结构。因此，它可用于定义数据结构，也是 Web 上数据通信的主要方式。


    ### 集中式与分布式


    客户端-服务器架构描述了最终用户与 DBMS 之间的关系。客户端包括所有与 DBMS 交互的应用程序，而 DBMS 则是处理和执行业务请求的服务器。


    实际存储一切的计算机本质上可以是*集中式*或*分布式*。采用集中式时，所有请求都发往一个容纳所有数据的单一服务器。如果此服务器因任何原因宕机，依赖它的应用程序将无法工作，这使得该服务器成为单点故障。因此，随着通信和数据库技术的发展，组织意识到分布式系统能带来诸多好处。与其只用一个中央数据库服务器，何不使用多个可以相互通信的服务器呢？在分布式系统中，单个请求的不同部分可以在分布式数据库服务器网络中的不同机器上执行。尽管数据可能驻留在由软件通过网络管理的多个站点，但对应用程序的用户而言，数据库的运行方式如同集中式系统。回到我们的例子，`users`表和`pets`表在理论上可以存储在不同的服务器上。


    典型的分布式系统具有若干特性，其中一些最重要的特性包括：本地自治（每个站点应相互独立）、无中心站点、位置独立（用户无需知道数据存储在哪里），以及几乎所有其他使其功能与集中式系统完全一致的属性。


    从技术领域中*分布式*一词的流行程度可以看出，分布式处理已变得非常流行，且理由充分。其优势包括：


    - *卓越的合理性*：想想典型的组织，数据往往已经呈分布式。无论是跨地理办事处分布，还是在内部按部门划分，数据库都有逻辑区分。因此，如果其他优势足够吸引人，为何不保留这种分布特性？这可以让每个团队独立管理自己的数据，而不必设法将所有数据合并到一个中央服务器中。例如，百事亚洲公司将其部分数据存储在亚洲可能是合理的。

    - *更高的效率和性能*：直观上，数据在离请求发出站点最近的地方进行处理时效率最高。因此，数据应存储在访问最频繁的用户附近。分布式系统有助于实现整个组织数据的最有效分配。此外，当查询分布在多台机器上执行时，性能也能得到提升。

    - *更高的可靠性*：由于信息存在于多台计算机上（也可创建多个副本），整个系统在任意时刻宕机的概率远低于集中式系统。

    - *可调节的扩展性*：分布式系统是水平可扩展的，这意味着很容易向系统添加更多计算机。假设你的 MyAppoly 目前在美国使用五台计算机存储信息，添加第六台计算机比垂直扩展（例如，为特定计算机增加内存）容易得多。诸如
    Amazon Web Services（第 2 章）之类的服务之所以如此受欢迎，是因为它们允许组织根据需求增减服务器。这种无缝的扩展和缩减方式使组织能够更有效地使用资源。如果只在偶尔的情况下（例如，网站有促销活动时）才用到那么大的容量，就没必要买下那么多容量。


    这种系统的缺点较少，但确实存在。首先，由于数据可能驻留在多个站点，需要跨服务器整合数据的查询处理会耗费更多时间。其次，与集中式系统相比，DBMS 提供的各种功能（安全性、并发管理等）在分布式系统中往往技术实现上更为复杂。


    ## 其他主题


    其他数据库管理需求涉及并发、安全和优化，将在接下来的章节中依次讨论。


    ### 并发


    你不希望多个数据库用户发出相互冲突的请求。如果一位 Facebook 好友在你给他发消息的同时将你屏蔽，Facebook 会如何处理？这涉及*并发*问题。


    在数据库语境中，*并发访问*意味着多个用户可以同时访问数据库，或者多个事务可以同时被处理。由于 DBMS 支持并发，它们也需要能够控制在多个事务试图同时修改数据库时可能出现的潜在困境。


    例如，Yelp 如何处理两位用户同时向 Yelp 上的一家餐厅添加推荐？知道 DBMS 能管理这种情况就够了，但若要了解更多细节，以下是一些并发问题：


    - *丢失更新*：当两个事务试图更新同一个值时，其中一个更新可能会丢失。

    - *未提交依赖*：一个事务可能访问到另一个事务已更新但尚未最终确定的值。

    - *不一致分析*：当两个事务的目标相互冲突时，它们的执行步骤可能彼此不一致。


    这些问题通常通过一种称为*锁定*的概念来解决，即特定对象或值被锁定，仅允许一个进程访问。锁定会在每个进程之间增加等待时间，以确保没有两个事务发生冲突或相互干扰。

    '
- fmt: '### Security


    Database security breaches are happening more regularly. Customers of any site
    demand a level of protection, and companies must ensure that their data is kept
    secure.


    `DBMS` protect data against unauthorized access and improper modification of data
    (preserving data *integrity*) in the following two ways:


    - *Discretionary control*: In this model, every user is assigned appropriate access
    rights to different objects in the database. Discretionary control tends to be
    the more flexible of the two control types.

    - *Mandatory control*: With mandatory control, every object in the database is
    assigned a classification level and every user is given a clearance level. Users
    can only access the set of data objects in their classification level.


    Essentially, the `DBMS` can label users and data accordingly to make sure that
    no unauthorized person can access or manipulate private data. As added checks,
    the `DBMS` logs the transaction, time of transaction, and user who issued the
    request. These logs can be used to track suspicious activity (see Chapter [12](#321739_2_En_12_Chapter.xhtml)).


    Several complications can arise that do not immediately seem solvable by the control
    systems described here, although `DBA` can use `DBMS` and other tools to secure
    against them. One example pertains to the flow of information from the “haves”
    to the “have nots.” A situation could arise in which a user with higher clearance,
    for example, alters the data in a way to give someone with lower clearance access
    to it. This flow must be controlled.


    Another issue relates to *interference*, a problem for statistical databases.
    `MyAppoly` might use statistical databases that do not provide users with specific
    information about other users, but do offer aggregate statistics about a pool
    of users. Individual users reluctant to allow others to know particulars about
    their salary, age, or some other personal metric might be more willing to share
    information if it is only accessible when made anonymous in the form of a statistic.
    One problem is that particular filtering might allow someone to infer something
    about a particular user, something that should not be allowed. For example, if
    you request the average salary of all python owners in Cambridge, but there is
    only one such person that fits that description, the average salary that the request
    will return will be an individual’s salary. `DBMS` should protect against this.


    *Data encryption* is a method used for protecting data stored or communicated
    across the Internet (Chapter [12](#321739_2_En_12_Chapter.xhtml)). Important or
    sensitive information, such as Social Security numbers or credit card information,
    should always be protected by both restricting access and encrypting the information.


    In summary, `DBMS` and other tools exist to protect data. No solution is perfect,
    which is why security is at risk. The goal of a security system is to deter incursions
    by rendering the cost of breaking into the system greater than the potential payoff.


    ### Optimization


    There are numerous ways in which database systems can be optimized to use less
    space and to return or update information more quickly. One way is to design more
    efficient queries. For example, if you wanted to know how many individuals lived
    in California and owned a python, it’s faster to search through a couple of thousand
    python owners for California residents than to look through millions of California
    residents for python owners.


    Another area in which databases can be optimized, especially for space, is redundancy.
    Data is said to be integrated when redundancy among information is removed. It
    is wasteful, for example, to have a patient’s name, insurance plan, and address
    written on every piece of paper within his or her file. Integrated data implies
    that such repetition is removed and kept in only one table in the case of relational
    databases.


    Above most other considerations, database design must be intelligent. It should
    reflect the things you need the fastest or update the most. Otherwise, regardless
    of how well queries are written or what tools are used, a flawed database design
    will be suboptimal and result in wasted time, money, and space. You should only
    store the information you need, and you should organize it in a logical way that
    keeps related information together. The way in which you store your information
    should be determined by how you expect to use it later.'
