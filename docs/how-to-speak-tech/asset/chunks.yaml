    # 14. The Internet of Things


    Special thanks to Cheenar Banerjee for contributing this chapter.


    As you’re working on MyAppoly, you realize that your laptop isn’t the only thing
    around you that is connected to the Internet. Your smartphone, smart thermostat,
    and smart light bulb are just a few of the devices around you that are online.
    In fact, it’s projected that by the year 2020, 50 billion devices will be connected
    to the Internet.^([^(29)](#fn29)), ^([^(30)](#fn30)) There’s a technical term
    for this phenomenon. It’s called the *Internet of Things*, or IoT.


    ## Things in the Internet of Things


    So what exactly is a Thing in the Internet of Things? It’s any device that connects
    to the Internet and has an embedded sensor. Is a smart light bulb an IoT device?
    Yes. How about a smart speaker? Yes. Smart toothbrush? Yes. This book? Probably
    not.


    Technically speaking, anything that connects to the Internet, including a traditional
    computer, counts as an IoT device. In a practical sense, though, IoT refers to
    devices that you wouldn’t traditionally expect to connect to the Internet—such
    as thermostats and refrigerators.


    A useful IoT device does the following three things:


    1. Collects important data via its embedded sensor(s)

    2. Communicates the data over the Internet and receives results of analysis on
    the data

    3. Motivates meaningful action using the results of the data analysis


    So, an IoT device has three responsibilities: collect, communicate, and motivate.
    Let’s dive deeper with an example. Suppose the MyAppoly office has just invested
    in the newest smart refrigerator on the market, created by a manufacturer we’ll
    call Roost. The fridge looks like a regular fridge, except for a touchscreen console
    on the door. This console allows MyAppoly employees to connect the fridge to the
    office Wi-Fi, customize fridge features, and view alerts and other information.
    One exciting new feature of the fridge is its ability to detect when a particular
    item of food needs to be reordered by using embedded sensors that weigh the food
    in the fridge. For example, one set of sensors is responsible for weighing the
    milk shelf.


    The milk sensors collect data about the weight of the milk shelf, which the fridge
    then communicates to another computer via the Internet. The fridge receives an
    alert when the weight of the milk shelf is low, meaning that the milk carton is
    almost empty, and motivates action by either encouraging the user to replenish
    the milk (by console display, email, or text alert) or by ordering a new milk
    delivery online.


    ## The Internet of Things


    Now that we know what an IoT device is, let’s talk about a collection of IoT devices
    working together. The Internet of Things is a network of IoT devices that share
    data and communicate with each other, without any human interaction required.
    With so many devices talking to each other, it is important for us to be able
    to manage their data and communications. We can do that using a piece of software
    called an *IoT Platform*. Each IoT device in a network connects to the IoT platform,
    which bridges, stores, and analyzes data from all devices on the network and communicates
    with each network device individually. The IoT platform exists in the cloud, and
    all data analytics happen in the cloud. While humans may interact with the IoT
    devices themselves, in an IoT network, no human interaction is required for the
    data collection sharing between the devices.


    In our fridge example, one IoT network could be the network of all Roost smart
    fridges in the United States. The platform would be the software that talks to
    each smart fridge and collects and analyzes data from all the smart fridges on
    the network. Another IoT network could be a network of smart devices within the
    MyAppoly office (such as the smart fridge, smart doorbell, and smart speaker).
    A single platform would still communicate with and analyze data from all of the
    devices, even though they’re all devices with different functions. Amazon Web
    Services IoT, Microsoft Azure IoT, Google Cloud IoT, and IBM Watson are all examples
    of existing IoT platforms.


    The real power of the Internet of Things stems from the massive amounts of shared
    data on the network. Let’s think back to the MyAppoly fridge, which is part of
    the national Roost fridge network. The IoT platform for this network collects
    hundreds of thousands of milk weight measurements every day, from fridges all
    across the country. Over time, using data analytics and machine learning discussed
    in Chapter [15](#321739_2_En_15_Chapter.xhtml), the software can find patterns
    and insights in the data. One such insight is the optimal milk weight at which
    a fridge user should order new milk—by looking at large amounts of milk weight
    data over time, the software can see how long, on average, it takes for new milk
    to arrive or for users to finish off a half-empty gallon of milk. Insights like
    this work together to yield a magic milk weight number that is continuously improving
    as more data come in.


    Data from different sources can be combined and analyzed to create equally useful
    insights. In the MyAppoly office IoT network, an employee could ask the smart
    speaker about the milk supply, and the speaker could respond with the exact weight
    of the milk shelf. The speaker gets the information by communicating with the
    fridge through their shared IoT platform. The fridge and doorbell could coordinate
    milk delivery orders; over time, based on doorbell data, the fridge could learn
    only to place orders that will arrive when someone is available to answer the
    door.


    Data and insights from the Roost and MyAppoly office IoT networks could be useful
    to other businesses, organizations, and IoT networks as well. For example, Roost
    might learn that their customers tend to drink more milk during the springtime.
    Roost could sell this data to dairy farms so that they could then manage their
    production to meet demand more accurately. Alternatively, the office doorbell
    could notify an employee''s home oven to heat up dinner before she gets home in
    the evening.'
