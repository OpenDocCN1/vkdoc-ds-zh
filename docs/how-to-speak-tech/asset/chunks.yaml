    you. In VR/AR, there are rarely photorealistic avatars due to both graphics and
    a phenomenon known as *the uncanny valley*. Modern computer graphics capabilities
    are phenomenal and getting closer and closer to making realistic looking virtual
    humans. However, in VR/AR headsets, the rendering costs are still high, so most
    systems cannot afford vivid, realistic details.


    Moreover, as virtual humans approach realistic human resemblance, the uncanny
    valley causes discomfort. On one side of the valley are cartoony virtual humans,
    while on the other side are completely realistic virtual humans. Humans are typically
    comfortable on either side of the valley, but right in the middle, where the virtual
    humans almost look like real humans, people can get uncomfortable. An excellent
    example of the uncanny valley is the creepiness of the characters from *The Polar
    Express* (2004), which caused a lot of discomfort for viewers. This discomfort
    stems from the fact that our minds are biologically wired to try and identify
    people. In the uncanny valley, our brains can’t decide whether an image is a real
    human or not, making us uneasy. As a result, near-photorealistic virtual humans
    are generally avoided.


    Most VR/AR experiences, such as *Rec Room* (2016), use cartoony virtual humans,
    nonhuman representations, or human representations with helmets or masks. Well,
    you may ask, what value does VR/AR have if avatars don’t look like real people?
    Photorealism is actually not the most important type of realism. Behavioral realism
    has a much larger impact on perceptions of realism.'
  trans: '

    ### 智能手机 VR


    最流行的虚拟现实形式是基于智能手机的虚拟现实。智能手机 VR 的工作原理是，在手机屏幕上渲染出两幅图像，您可以通过放大镜片观看，镜片通常位于一个容纳手机的头戴式显示器（HMD）外壳内。智能手机
    VR 最常用于观看 360 度视频。它通过手机陀螺仪实现 3DOF 跟踪，如您所知，陀螺仪用于测量方向。最近，智能手机 VR 也出现了 3DOF 手持控制器。该领域的知名产品包括`Google
    Cardboard`、`Daydream`以及`Samsung GearVR`。尽管智能手机 VR 相当普及，但其体验无法与 PC VR 相媲美。


    ### PC VR


    PC VR 需要一台配备强大 GPU 的 Windows 电脑，并连接一个 VR 头戴式显示器（HMD）。PC VR 分为两种类型：有线式（HMD 通过线缆连接电脑）和无线式（无需线缆）。大多数
    VR 游戏开发者都在制作 PC VR 游戏。在 PC VR 上玩游戏是一种令人难以置信的体验。由于 GPU 更大，且凭借强大的计算能力和强制性的外部传感器，其追踪精度更高，所以图形效果极为出色。VR
    游戏厅几乎全部使用 PC VR 系统，大多数大学也使用 PC VR 系统进行研发。此外，PC VR 是目前唯一拥有 6DOF 手持控制器的 VR 系统。最流行的系统是`Oculus
    Rift`和`HTC Vive`。然而，PC VR 成本极高，因为您必须拥有一台配备高级 GPU 的电脑、一个高级耳机，以及一个宽敞的、空置的使用空间。它运输不便，且使用前需要设置。为了让
    VR 更普及，独立式 VR 应运而生。


    ### 独立式 VR


    VR 硬件生态系统中最新的产品是独立式虚拟现实。独立式 VR 将所有必要的硬件组件（如屏幕、GPU 和处理器）都集成在 HMD 内部，无需外部手机或电脑。独立式
    VR 是市场上最紧凑、最便携、最具成本效益的解决方案。有支持 3DOF 和 6DOF 追踪的独立式 HMD。例如，`Oculus Go`配备 3DOF HMD
    和 3DOF 控制器。`HTC Vive Focus`配备 6DOF HMD，但其控制器仅为 3DOF。2019 年晚些时候，`Oculus Quest`将发布。它将是首款配备
    6DOF 控制器的商用消费级 6DOF HMD。独立式虚拟现实是向消费级虚拟现实迈出的重要一步，因为人们现在可以购买一台设备并立即体验 VR。


    ## AR 系统


    与 VR 类似，AR 也有几种不同类型的系统。


    ### 6DOF 头戴式显示器（HMD）


    这类 HMD 能够显示存在于真实世界空间中的 3D 图形。您可以围绕物体移动，HMD 使用由内而外的追踪技术来确定您的位置，并锚定数字对象，仿佛它们就存在于您的空间中。该领域的主要参与者是`Microsoft
    HoloLens`、`Meta`和`Magic Leap`。


    ### 平视显示器（HUD）


    如果您知道钢铁侠看到的景象，那么这类 HMD 就与之非常接近。它们将信息（通常是文本或基础图像）叠加到您面前的世界中。然而，这些信息并非作为物体渲染到您的世界中，而仅仅是显示在您的眼前。这对于需要查看信息但双手无法持握手机或平板的工业工作者非常有用。类似地，需要了解速度信息的滑雪者或摩托车手也可以佩戴这类显示
    HMD。这类 HMD 的一个流行术语是智能眼镜。您可能听说过的一个智能眼镜品牌是`Google Glass`。


    ### 6DOF 移动 AR


    与移动 VR 不同，移动 AR 实际上指的是基于手机的增强现实。移动 AR 利用手机摄像头读取真实世界，然后在显示在手机屏幕上的画面中叠加显示 3D 图形（图
    17-3）。例如，宜家有一款应用，可以让您看到虚拟家具（如椅子）出现在您的客厅中。移动 AR 使用 6DOF 无标记追踪，因此您可以像在真实世界中一样围绕椅子移动。


    ![../images/321739_2_En_17_Chapter/321739_2_En_17_Fig3_HTML.jpg](img/321739_2_En_17_Fig3_HTML.jpg)


    图 17-3.


    iPad 上的移动 AR 展示一片数字森林^(³⁷)


    移动 AR 依赖于特定的、功能强大的 AR SDK。`Vuforia`是一个大型软件套件，用于图像检测、标记追踪和其他有用的需求。尽管`Vuforia`对于更高级的
    AR 功能仍然强大且有用，但苹果的`ARKit`和谷歌的`ARCore`近期已成为底层领域的主力，因为它们针对硬件进行了优化，并使用 SLAM 技术实现了出色的无标记
    6DOF 由内而外追踪。


    面对 VR/AR 领域中纷繁复杂的硬件系统，人们很容易感到困惑。但请记住，主要区别在于追踪方式：3DOF（转椅式 XR）与 6DOF（行走式 XR），以及由外向内追踪（外部传感器）与由内向外追踪（SLAM）。


    ## 虚拟世界中的你


    虚拟现实的力量之一在于让你能够成为任何你想成为的人。你还将在 VR 和 AR 中与大量虚拟角色互动。在 VR/AR 中代表某人的形象称为化身。尽管化身可以是任何形态，但大多数化身都是人形的，因为这能准确地映射到现有的追踪系统（即用六自由度追踪头部和双手的系统）。


    此外，人们通常更愿意将自己表现为人形，也更能接受看到其他人类以人形化身出现，这种人形化身被称为虚拟人。化身在虚拟现实和增强现实中极为普遍，因为当我们进入一个虚拟空间时，我们需要一个个人化的具象来向同一虚拟空间中的其他人展示自己。根据传播与媒体研究者布拉斯科维奇和贝伦森的观点，虚拟人展现出多种“真实感”。


    ### 照片级真实感


    如果你照镜子、观看高清视频或照片，你所看到的具有极高的照片级真实感。它看起来就像一个真实的人：就是你自己。在 VR/AR 中，由于图形技术以及被称为“恐怖谷”的现象，很少出现照片级真实的化身。现代计算机图形能力是非凡的，并且越来越接近制作出逼真的虚拟人。然而，在
    VR/AR 头戴设备中，渲染成本仍然很高，因此大多数系统无法负担生动、逼真的细节。


    此外，当虚拟人接近真实人类的外观时，“恐怖谷”效应会引起不适。恐怖谷的一侧是卡通风格的虚拟人，另一侧是完全逼真的虚拟人。人类通常在恐怖谷的两侧都感到舒适，但恰恰在中间地带，即虚拟人几乎与真人无异时，人们会感到不适。恐怖谷的一个绝佳例子是电影《极地特快》（2004）中令人毛骨悚然的角色，这给观众带来了极大的不适感。这种不适源于我们的大脑在生物学上天生就倾向于识别他人。在恐怖谷中，我们的大脑无法判断一个图像是否是真实的人类，从而令我们感到不安。因此，近乎照片级真实的虚拟人通常会被避免使用。


    大多数 VR/AR 体验，如《Rec Room》（2016），都使用卡通风格的虚拟人、非人类表征，或者佩戴头盔或面具的人类表征。那么，你可能会问，如果化身看起来不像真人，VR/AR
    还有什么价值呢？事实上，照片级真实感并非最重要的真实感类型。行为真实感对感知真实性的影响要大得多。

    '
- fmt: '### Behavioral Realism


    虽然真实感衡量的是“看起来真实吗？”，但*行为真实感*衡量的是“行为上真实吗？”即使一个虚拟形象看起来不像真人，但如果它的行为像真人，你就会像对待真人一样对待它。想一想与`Alexa`或`Siri`交谈。你会用到许多与和人交谈时相同的行为举止。VR在虚拟形象的行为真实感方面面临的主要挑战在于追踪。由于AR和VR追踪系统本质相似，但VR追踪稍显成熟，因此我们将重点关注VR追踪的虚拟形象。对于大多数6DOF
    PC VR系统，你只能追踪头部和双手的六个自由度。然而，你可能希望展示虚拟人的整个身体，以显示完整的运动范围。你可能希望肢体语言能够传达出来，希望肘部以逼真的方式移动，或者希望当你操控的虚拟形象走动时腿部能够移动。为了从头部和双手推导出整个身体，人们使用了逆向运动学，也称为IK。IK算法利用头部和双手的位置及旋转来推断肘部和臀部的位置。行为真实感仍然面临许多挑战，例如面部表情。如何让嘴巴在说话时正确运动、创造逼真的眼球运动以及实现精细的手部行为，都是当今正在解决的问题。


    ## The Metaverse


    既然我们有了自己的一个表征，那么让我们来探索虚拟世界。虚拟现实和增强现实之所以是强大的媒介，是因为*临场感*，一种“身临其境”的心理感觉。许多体验过深度临场感的人会记得，摘下头显后会感到极度迷失方向，因为他们现在身处自己的客厅，而不是在城堡顶端与敌人战斗。那么，虚拟环境中哪些不同的元素有助于产生临场感呢？


    一个虚拟环境包含许多组成部分。由于VR/AR目前主要是一种视听体验，下面讨论的主要组成部分将是空间音频以及环境的主要视觉元素，包括场景布景和天空盒。


    ### Spatial Audio


    *空间音频*是声音在现实世界中的工作方式。VR/AR是一种空间媒介，因此空间音频非常契合。在具有空间音频的体验中，当一辆虚拟救护车从你身边疾驰而过时，你会听到警笛声渐强再渐弱。如果你身处VR/AR环境中，并将右耳靠近一个虚拟音响，你右侧耳机中的音乐声会增大。空间音频有助于营造氛围和临场感，因为它复制了人类在现实世界中感知声音的方式。


    ### Set Dress


    *场景布景*是一个游戏开发术语，被引入到虚拟环境的设计中。场景布景是那些让体验感觉真实的微小细节。场景布景可以是AR中你办公桌上的一只虚拟咖啡杯，或者是你所站的VR客厅角落里一盆濒死的室内绿植。所有这些小物件都为虚拟环境增添了特色和真实感。


    ### Skybox


    在虚拟现实中，有些虚拟环境会设置在户外场景中，比如城市或森林。*天空盒*是一张图像，它决定了VR中地平线和天空的呈现方式。“天空盒”这个名称源于这样一个事实：一个巨大的立方体环绕着你，立方体的六个面各自有不同的照片。顶面通常是一张天空的图像，四个侧面展示的是地平线，底面则是地面的图像——大多数人看不到底面，因为虚拟环境通常已经包含了地面。天空盒不一定是盒状，它们也可以是巨大的半球体。


    ### Haptics and Interactions


    当你的身体参与到VR/AR体验中时，会产生更强的临场感。为了通过身体参与来增强临场感，创作者应该在环境中构建交互，并配备*触觉反馈*。


    #### Controllers


    你的手仿佛就在虚拟环境中的感觉被称为*手部临场感*。在AR环境中，你能够看到自己面前的双手，因此手部临场感通常不成问题。然而，在VR环境中，头显会遮挡你看到自己双手的视线，这可能会让你感觉双手似乎不存在了。虚拟现实中的手部控制器极大地增强了临场感，因为它们同时赋予了用户*能动性*和*心理上的身体转移*。当一个人开始感觉到自己拥有一个并非自己身体的所有权时，就会发生身体转移。身体转移增强了临场感，因为如果你拥有了自己虚拟形象的身体，你就可以在虚拟环境中引发各种事件。你拥有了*能动性*。能动性是指用户影响其环境的控制程度。例如，你可以设计一种体验，让用户能够把物体从桌子上撞落。在VR中与环境交互并伴有触觉反馈，能增强能动性，从而提升临场感。


    ### Haptic Feedback


    *触觉反馈*指的是为用户再现触觉的力或振动。你可能体验过的最常见的触觉反馈是在手机键盘上打字时的震动感。类似地，在虚拟现实中，最常见的触觉反馈形式来自于当你触摸一个虚拟物体时会振动的控制器。其他类型的触觉反馈包括：通过一个特殊编程的加热风扇感受温度（当你靠近虚拟火焰时，它会向你脸上吹热风）、感受像墙一样的真实物理物体（位置与虚拟墙壁重合），以及通过特殊的触觉设备感受阻力。在沉浸式媒体中进行触觉交互能驱动能动性以及与体验的连接，因为触觉可以唤起情感。想象一下被虚拟子弹击中或被虚拟拥抱环绕的体验。


    #### Moving in VR: Locomotion


    移动指的是在虚拟环境中四处移动的行为。不幸的是，你在撞上房间的墙壁或到达连接电脑与头显的线缆尽头之前，移动距离无法超过10英尺。你正在探索的虚拟世界远大于10英尺——那么，如果你无法正常地在其中走动，该如何探索虚拟世界呢？VR中有多种移动方法，但人们一直在尝试新颖且有创意的方式：传送、基于手部的移动和无限跑步机。最常见的移动方式是*传送*。你只需将控制器对准远处地面上的一个点，然后就会立即出现在那里。


    然而，传送可能会破坏临场感。还有一些其他的移动实验，例如攀爬的概念。由于你在VR中只有头部和双手，许多人尝试用手的输入来进行移动。攀爬涉及使用手部控制器抓住虚拟地面或墙壁，然后拉动自己在环境中移动。此外，还有许多用于移动的硬件实验。虽然不是必需的，但硬件外设可以增强VR体验。一个有趣的概念是*无限跑步机*，它允许你朝任何方向奔跑，同时身体停留在原地。目前，有几种不同的移动硬件迭代，例如一种“碗状”装置，你需要穿着滑溜的鞋子在里面跑；或者是一种可以向不同方向（前、后、左、右）移动的跑步机，并因此能够以不同速率进行“对角线”移动。'
  raw: '### Behavioral Realism


    While photorealism measures “does it look real?”, *behavioral realism* measures
    “does it ACT realistically?” Even if an avatar does not look like a real person,
    you will treat it like one if it behaves like one. Think about talking to Alexa
    or Siri. You use a lot of the same mannerisms that you would use when talking
    to a person. VR’s main challenge with behavioral realism in avatars is in tracking.
    Since AR and VR tracking systems are similar in nature, but VR tracking is a little
    farther along, we will focus on VR-tracked avatars. We will focus on VR-tracked
    avatars. For most 6DOF PC VR systems, you can only track the six degrees of freedom
    for the head and hands. However, you may want to show the virtual human’s entire
    body to display a full range of motion. You might want body language to come through,
    for the elbow to move in a realistic manner, or for the legs to move when your
    avatar walks around. To get from the head and hands to an entire body, people
    use inverse kinematics, also known as IK. IK algorithms use the positions and
    rotations of the head and hands to guess where the elbows and hips are. There
    are still many behavioral realism challenges such as facial expressions. Making
    mouths behave correctly during talking, creating realistic eye movements, and
    having detailed hand behavior are all problems being tackled today.


    ## The Metaverse


    Now that we have a representation of ourselves, let’s explore the virtual world.
    Virtual and augmented reality are powerful media because of *presence* , the psychological
    feeling of “being there.” Many people who experience deep presence will remember
    becoming extremely disoriented after taking off the headset because they are now
    in their living room instead of on top of a castle fighting enemies. So what are
    the various elements inside a virtual environment that contribute to presence?


    A virtual environment has many components. Because VR/AR is currently primarily
    an audiovisual experience, the main components discussed below will be spatial
    audio and the primary visual elements of the environment, including the set dress
    and skybox.


    ### Spatial Audio


    *Spatial audio* is how sound works in the real world. VR/AR is a spatial medium,
    so spatial audio is a perfect fit. In an experience with spatial audio, as a virtual
    ambulance zooms by you, you would hear the siren fade in and out. If you are in
    VR/AR and put your right ear up to a virtual boombox, the music in your right
    headphone would increase. Spatial audio helps create ambience and presence since
    it replicates how humans perceive sound in the real world.


    ### Set Dress


    *Set dress* is a game development term that is carried into the design of virtual
    environments. Set dress is the small details that make an experience feel real.
    Set dress could be a virtual coffee mug on your desk in AR or a dying houseplant
    in the corner of the VR living room you’re standing in. All these small items
    add character and authenticity to a virtual environment.


    ### Skybox


    In virtual reality, some virtual environments will take place in an outdoor setting,
    like a city or a forest. A *skybox* is an image that dictates how the horizon
    and sky in VR will look. The name sky “box” comes from the fact that a giant cube
    surrounds you, where each of the cube’s six faces has a different photo. The top
    face usually has an image of what the sky looks like, the four walls show the
    horizon, and the bottom face has an image of the floor—which most people won’t
    see because virtual environments typically already have floors. Skyboxes aren’t
    always boxes, they can also be giant hemispheres.


    ### Haptics and Interactions


    When your body is involved in a VR/AR experience, there is a higher sense of presence.
    To increase presence through body involvement, creators should build interactions
    into the environment, complete with *haptics*.


    #### Controllers


    The feeling that your hands are there in the virtual environment is known as *hand
    presence*. In an AR environment, you’re able to see your hands in front of you,
    so hand presence is generally not an issue. In a VR environment, however, the
    headset blocks your view of your own hands, which might make you feel like your
    hands aren’t even there. Hand controllers in virtual reality add a lot to presence
    because they give the user both agency and psychological *body transfer*. Body
    transfer occurs when a person starts to feel that they have ownership over a body
    that is not their own. Body transfer increases presence because if you own your
    avatar’s body, you can cause things to happen in the virtual environment. You
    have *agency*. Agency is the amount of control a user has to affect their environment.
    For example, you might design an experience such that the user can knock objects
    off a table. Having environmental interactions with haptic feedback in VR increases
    agency and thus presence.


    ### Haptic Feedback


    *Haptic feedback* refers to forces or vibrations that recreate the sense of touch
    for a user. The most common haptic feedback you may have experienced is the vibrating
    sensation when you type on your phone’s keyboard. Similarly, in virtual reality,
    the most common form of haptic feedback comes from a controller that vibrates
    when you touch a virtual object. Other types of haptic feedback include feeling
    temperature through a specially programmed heated fan that blows hot air in your
    face if you are near a virtual fire, feeling physical objects like a wall where
    a virtual wall is, and feeling resistance through special haptic devices. Having
    tactile haptic interactions in immersive media drives agency and connection with
    the experience, as touch can evoke emotions. Imagine the experience of a virtual
    bullet hitting you or a virtual hug surrounding you.


    #### Moving in VR: Locomotion


    Locomotion refers to the act of moving around a virtual environment. Unfortunately,
    you cannot move more than 10 feet before running into a wall in your room or reaching
    the end of the cable connecting the computer with the HMD. The virtual world you’re
    exploring is much larger than 10 feet—so how can you explore virtual worlds if
    you can’t normally move around them? There are many methods of locomotion in VR,
    but people are constantly experimenting with new and creative ways: teleportation,
    hand-based locomotion, and infinite treadmills. The most common mode of locomotion
    is *teleportation*. You simply aim your controller at a point on the ground in
    the distance and then you will appear there.


    Teleportation can break presence, however. There are also other locomotion experiments,
    such as the notion of climbing. Since you only have your head and hands in VR,
    many people experiment with hand input for locomotion. Climbing involves using
    the hand controllers to grab the virtual floor or walls and pull yourself around
    the environment. There are also many hardware experiments for locomotion. Though
    not required, hardware peripherals can augment a VR experience. One interesting
    concept is the *infinite treadmill*, which allows you to run in any direction
    while staying in one spot. Currently, there are several different iterations on
    locomotion hardware, such as a bowl that you run in while wearing slippery shoes
    or a treadmill that goes forward, backward, left, and right, and can consequently
    move “diagonally” at different rates.'
  trans: '

    ### 行为真实感


    虽然真实感衡量的是“看起来真实吗？”，但*行为真实感*衡量的是“行为上真实吗？”即使一个虚拟形象看起来不像真人，但如果它的行为像真人，你就会像对待真人一样对待它。想一想与`Alexa`或`Siri`交谈。你会用到许多与和人交谈时相同的行为举止。VR
    在虚拟形象的行为真实感方面面临的主要挑战在于追踪。由于 AR 和 VR 追踪系统本质相似，但 VR 追踪稍显成熟，因此我们将重点关注 VR 追踪的虚拟形象。对于大多数
    6DOF PC VR 系统，你只能追踪头部和双手的六个自由度。然而，你可能希望展示虚拟人的整个身体，以显示完整的运动范围。你可能希望肢体语言能够传达出来，希望肘部以逼真的方式移动，或者希望当你操控的虚拟形象走动时腿部能够移动。为了从头部和双手推导出整个身体，人们使用了逆向运动学，也称为
    IK。IK 算法利用头部和双手的位置及旋转来推断肘部和臀部的位置。行为真实感仍然面临许多挑战，例如面部表情。如何让嘴巴在说话时正确运动、创造逼真的眼球运动以及实现精细的手部行为，都是当今正在解决的问题。


    ## 元宇宙


    既然我们拥有了自己的一个表征，那么让我们来探索虚拟世界。虚拟现实和增强现实之所以是强大的媒介，是因为*临场感*，一种“身临其境”的心理感觉。许多体验过深度临场感的人会记得，摘下头显后会感到极度迷失方向，因为他们现在身处自己的客厅，而不是在城堡顶端与敌人战斗。那么，虚拟环境中哪些不同的元素有助于产生临场感呢？


    一个虚拟环境包含许多组成部分。由于 VR/AR 目前主要是一种视听体验，下面讨论的主要组成部分将是空间音频以及环境的主要视觉元素，包括场景布景和天空盒。


    ### 空间音频


    *空间音频*是声音在现实世界中的工作方式。VR/AR 是一种空间媒介，因此空间音频非常契合。在具有空间音频的体验中，当一辆虚拟救护车从你身边疾驰而过时，你会听到警笛声渐强再渐弱。如果你身处
    VR/AR 环境中，并将右耳靠近一个虚拟音响，你右侧耳机中的音乐声会增大。空间音频有助于营造氛围和临场感，因为它复制了人类在现实世界中感知声音的方式。


    ### 场景布景


    *场景布景*是一个游戏开发术语，被引入到虚拟环境的设计中。场景布景是那些让体验感觉真实的微小细节。场景布景可以是 AR 中你办公桌上的一只虚拟咖啡杯，或者是你所站的
    VR 客厅角落里一盆濒死的室内绿植。所有这些小物件都为虚拟环境增添了特色和真实感。


    ### 天空盒


    在虚拟现实中，有些虚拟环境会设置在户外场景中，比如城市或森林。*天空盒*是一张图像，它决定了 VR 中地平线和天空的呈现方式。“天空盒”这个名称源于这样一个事实：一个巨大的立方体环绕着你，立方体的六个面各自有不同的照片。顶面通常是一张天空的图像，四个侧面展示的是地平线，底面则是地面的图像——大多数人看不到底面，因为虚拟环境通常已经包含了地面。天空盒不一定是盒状，它们也可以是巨大的半球体。


    ### 触觉与交互


    当你的身体参与到 VR/AR 体验中时，会产生更强的临场感。为了通过身体参与来增强临场感，创作者应该在环境中构建交互，并配备*触觉反馈*。


    #### 控制器


    你的手仿佛就在虚拟环境中的感觉被称为*手部临场感*。在 AR 环境中，你能够看到自己面前的双手，因此手部临场感通常不成问题。然而，在 VR 环境中，头显会遮挡你看到自己双手的视线，这可能会让你感觉双手似乎不存在了。虚拟现实中的手部控制器极大地增强了临场感，因为它们同时赋予了用户*能动性*和*心理上的身体转移*。当一个人开始感觉到自己拥有一个并非自己身体的所有权时，就会发生身体转移。身体转移增强了临场感，因为如果你拥有了自己虚拟形象的身体，你就可以在虚拟环境中引发各种事件。你拥有了*能动性*。能动性是指用户影响其环境的控制程度。例如，你可以设计一种体验，让用户能够把物体从桌子上撞落。在
    VR 中与环境交互并伴有触觉反馈，能增强能动性，从而提升临场感。


    ### 触觉反馈


    *触觉反馈*指的是为用户再现触觉的力或振动。你可能体验过的最常见的触觉反馈是在手机键盘上打字时的震动感。类似地，在虚拟现实中，最常见的触觉反馈形式来自于当你触摸一个虚拟物体时会振动的控制器。其他类型的触觉反馈包括：通过一个特殊编程的加热风扇感受温度（当你靠近虚拟火焰时，它会向你脸上吹热风）、感受像墙一样的真实物理物体（位置与虚拟墙壁重合），以及通过特殊的触觉设备感受阻力。在沉浸式媒体中进行触觉交互能驱动能动性以及与体验的连接，因为触觉可以唤起情感。想象一下被虚拟子弹击中或被虚拟拥抱环绕的体验。


    #### 在 VR 中移动：移动模式


    移动指的是在虚拟环境中四处移动的行为。不幸的是，在你撞上房间的墙壁或到达连接电脑与头显的线缆尽头之前，移动距离无法超过 10 英尺。你正在探索的虚拟世界远大于
    10 英尺——那么，如果你无法正常地在其中走动，该如何探索虚拟世界呢？VR 中有多种移动方法，但人们一直在尝试新颖且有创意的方式：传送、基于手部的移动和无限跑步机。最常见的移动方式是*传送*。你只需将控制器对准远处地面上的一个点，然后就会立即出现在那里。


    然而，传送可能会破坏临场感。还有一些其他的移动实验，例如攀爬的概念。由于你在 VR 中只有头部和双手，许多人尝试用手的输入来进行移动。攀爬涉及使用手部控制器抓住虚拟地面或墙壁，然后拉动自己在环境中移动。此外，还有许多用于移动的硬件实验。虽然不是必需的，但硬件外设可以增强
    VR 体验。一个有趣的概念是*无限跑步机*，它允许你朝任何方向奔跑，同时身体停留在原地。目前，有几种不同的移动硬件迭代，例如一种“碗状”装置，你需要穿着滑溜的鞋子在里面跑；或者是一种可以向不同方向（前、后、左、右）移动的跑步机，并因此能够以不同速率进行“对角线”移动。

    '
- fmt: '# Moving in AR: The AR Cloud


    Moving in augmented reality is the same as moving in reality since the virtual
    environment exists in your real-world environment. Here, the issue isn’t about
    how you move around the space but instead about where the space is rendered in
    relation to you. Imagine that you’ve put a virtual mug on the very corner of a
    table. How will your friend walking by with her AR glasses on see the same virtual
    mug on the very edge of the table? Her AR glasses have to recognize that she is
    in the same room as you and recognize the exact table that you put the virtual
    mug on. To have ubiquitous, shared augmented reality all over the world, we need
    the *AR Cloud*. The AR Cloud is a one-to-one mapping of our world, essentially
    a digital copy of all the places and spaces on earth. The AR Cloud will have to
    keep track of all the 3D spatial data and meshes of our world and all the users
    who use AR and where they are in order to build large-scale multiuser experiences.
    While this has a long way to go, it will enable a powerful digital layer to exist
    overlaid onto the real world. In the meantime, large-scale multiuser AR experiences
    cannot leverage the precise anchoring of 3D models or ubiquitous multiplayer,
    which limits the possible shared experiences of AR.


    The “Metaverse” is continually evolving, and all of the components above are important
    to creating powerful immersive experiences. If we’re to live in a world where
    the line between digital and real is blurred, let’s build a good blend.


    ## Conclusion


    The year is 2049. Everyone has contact lenses that allow them to see digital objects
    rendered everywhere. You can watch 360 videos of your child’s birthday or look
    at 3D models of a new house you want to buy. At stores, augmented reality virtual
    humans, looking impeccably photorealistic, stand behind the counter, ready to
    take your order. Your friends can leave secret messages around the world that
    only you can see. You can beam into work from the comfort of your home or visit
    family on the other side of the world.


    Virtual and augmented reality are here to stay. Although there are many terms
    and concepts involved with immersive media, this chapter covers all the need-to-know
    ideas in VR/AR. We explored the notion of three-dimensional experiences, rendered
    by GPUs and perceived with stereoscopic vision. We compared videos, which represent
    our world, to 3D computer graphics models that compose new worlds. We learned
    about the difference between 3DOF swivel chair experiences and 6DOF walk-around
    experiences, and we covered the various immersive systems that exist today, such
    as standalone VR/AR. The fourth section covered avatars, examining the relationship
    between photographic and behavioral realism in virtual human design. Finally,
    we closed with the environment and interactions of VR/AR, learning about the different
    aspects that add to presence. You’re ready to go out and confidently speak about
    immersive media and how it will become the next generation of human-computer interaction.
    Now, you are fully immersed.


