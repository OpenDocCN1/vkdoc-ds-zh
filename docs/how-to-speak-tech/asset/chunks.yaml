  trans: '

    ### 加密技术


    加密是我们最强的防御手段之一，它通过将信息从"明文"转换为"密文"，使得第三方无法从密文中推导出明文。加密的本质只是改变数据的呈现方式，这意味着所有数据类型（包括音频和图像）都可以被加密。一种简单但安全性不高的明文加密方法是反转字符顺序。例如，我们可以将明文"the
    quick brown fox jumps over the lazy dog"转换为密文"god yzal eht revo spmuj xof nworb
    kciuq eht。"这看起来像一串乱码，但敏锐的观察者可能会注意到两处"eht"，将其与常见单词"the"联系起来，从而同时推断出加密算法和秘密信息。


    这个例子说明了简单加密方案的不安全性。由于数学和语言学模型可以破解较简单的加密协议，你应该使用经过严格测试的知名加密协议和系统。虽然更复杂的加密方法理论上可能被破解，但破解所需的大量资源和时间使其在实际上无法被攻破。


    许多加密系统和协议的基础是公钥密码学，它使用两个辅助信息：**公钥**和**私钥**。私钥必须由其所有者保密，而公钥则可供任何人访问。如果爱丽丝想使用公钥密码学（也称为非对称加密）向鲍勃发送加密的明文消息，她将消息和鲍勃的公钥输入加密算法，该算法会生成密文。收到密文后，鲍勃将密文和他自己的私钥输入解密算法来解密消息。以既安全又高效的方式创建公钥和私钥是困难的。密钥生成密码系统（其中最著名的是
    RSA）通常利用数学方法生成充当密钥的大数字。


    `TLS`（传输层安全协议）是用于保护互联网通信安全的加密协议，它基于公钥密码学。它包含两个部分：第一部分对通信双方（客户端和服务器）进行身份验证，并创建一个安全通道用于交换消息；第二部分为从客户端到服务器或服务器到客户端的数据提供安全保障。`TLS`在互联网上被广泛用于保护网站、API
    等。


    加密对于确保数据安全至关重要。所有数据，包括客户数据和公司数据，都应进行加密，仅在必要时才解密。数据的生命周期包含三个阶段：**使用中的数据**（从永久存储中提取的数据）、**静态数据**（存储在持久化存储器中的数据）和**传输中的数据**（在两个系统之间流转的数据）。我们使用加密来保护静态和传输中的数据——例如，`TLS`可以保护传输中的数据。


    在通信和消息传递领域，一些产品已经实现了数据在整个生命周期中的加密保护，这一特性被称为**端到端加密**。让我们以爱丽丝和鲍勃的场景来思考。如果爱丽丝发送给鲍勃的消息是端到端加密的，那么原始消息只有爱丽丝和鲍勃两人可见。即使爱丽丝使用第三方客户端发送消息，应用程序在加密完成后也会立即丢弃明文。


    我们主要在点对点通信（如电子邮件和即时通讯服务）的背景下讨论端到端加密。端到端加密在电子邮件中的使用率相对较低，主要有两个原因。第一个问题是我们依赖电子邮件提供商过滤垃圾邮件，这意味着提供商必须能够读取邮件内容。第二个原因是电子邮件提供商的碎片化以及缺乏端到端加密的行业标准。例如，从
    Gmail 账户向 Yahoo 账户发送加密邮件，需要两个提供商就同一加密方案达成一致，或者用户自行协商加密方案并交换公钥，这很麻烦。不过，端到端加密正在即时通讯领域逐渐普及。为了保持真正的安全性，你应该使用
    Signal 消息应用，它既支持端到端加密，又是开源的（这意味着任何人，包括安全专家，都可以通过阅读其源代码来验证其安全性）。该平台非常安全，以至于其他（闭源的）消息应用如
    Facebook Messenger 和 WhatsApp 也使用 Signal 协议来实现其端到端加密。


    ### 密码保护


    在个人层面，最重要的防范措施是使用强密码。创建安全密码有许多最佳实践：使用特殊字符和数字、增加密码长度、使用密码短语、绝不重复使用密码等。虽然这些最佳实践确实容易被忽视，但遵循它们至关重要：2016
    年 Verizon 数据泄露报告发现，63%的数据泄露是由于密码薄弱或被盗所致。^(²⁰)


    密码管理器`LastPass`在 2017 年发布的《密码曝光》报告显示，平均每个`LastPass`企业用户拥有 191 个密码，数量之多远超任何人的记忆能力。^(²¹)像`LastPass`和`1Password`这样的密码管理器将所有密码存储在一个受主密码保护的"保险库"中，极大地简化了密码的组织和使用。密码管理器还具备自动填充功能，可在网站上填写你的凭证，以及密码生成功能，可自动为你创建强密码。这样一来，你唯一需要记住的密码就是一个主密码。其理念是，记住一个复杂的密码比记住多个密码（无论它们多么好记）要容易得多。因此，你所有的密码都能变得更难猜测，从而更强。


    虽然密码管理器并非对黑客免疫，但其数据存储在一个由多层加密保护的保险库中。即使黑客窃取了密码管理器的保险库，他们也无法访问你的数据，因为这些数据受到加密保护，并且你的主密码作为钥匙将其锁定。要解密保险库，他们需要你的主密码（由于哈希处理，主密码并不存储在任何地方）。只要你的主密码选择得当，黑客就无法猜出它。简而言之——虽然切换到密码管理器可能看起来令人不安，但大多数安全研究人员都认为，这是创建、存储和使用密码最安全的方式。


    一旦用户创建了密码，确保密码永不泄露至关重要。如上所述，我们使用哈希处理来保护密码。与加密类似，哈希将数据转换为另一种形式，这里称为**哈希值**。与加密后的密文不同，哈希值是不可逆的。哈希处理在验证信息方面效果很好，因为对同一个明文的相同副本（例如，用户首次选择密码时和在网站上输入密码时）运行相同的哈希函数会产生相同的结果。然而，我们并不存储明文，因此也无法从哈希副本中还原出明文。

    '
- fmt: '### Means of Authentication


    Factors of authentication are artifacts that a user must have to prove that they
    are who they claim to be. There are three types of authentication factors: knowledge
    factors (“something you know”), possession factors (“something you have”), and
    inherence factors (“something you are”).


    Knowledge factors are the most common means of authentication. For example, a
    password is a piece of information that a user must *know*. Another example of
    a knowledge factor is a security question (“What is your mother’s maiden name?
    What’s the make and model of your first car?”). As anyone who has seen the film
    *Inception* knows, knowledge factors are relatively easy to crack for three reasons:
    (a) they’re often simple, (b) their information can be fixed, meaning that it
    never changes, and (c) they follow a familiar format. Since humans must remember
    their passwords, they are often inclined to base them on personal information
    like a birthday or a pet’s name that tends to be easily guessable. Security questions
    surface information that some sleuthing could uncover, and even if an attacker
    can’t find the make and model of your first car, there are only so many possible
    answers that they would need to try. While knowledge factors are currently the
    most prevalent form of authentication, they don’t provide the security that is
    increasingly necessary.


    Therefore, many systems are moving toward using two-factor authentication (2FA),
    which requires another layer of authentication on top of knowledge-based authentication.
    The second layer is usually a possession factor, which authenticates a user based
    on an object that they have. Think of the keys you use to unlock your home and
    car. For many web applications, the possession factor is the user’s mobile phone.
    The application provides the mobile phone with a one-time password (OTP), either
    by SMS or through a mobile application such as `Authy` or `Duo`. SMS can be hacked
    more easily since it is tied to your phone number. Attackers use phishing attacks
    where they call a cell service provider under the guise of losing their phone.
    The provider allows them to switch their number to a new phone, enabling them
    to steal the OTP. The most secure possession factor is considered to be a separate
    hardware token built explicitly for this purpose such as a `Yubikey`. The `Yubikey`
    is a small device that plugs directly into a user’s computer and generates OTPs
    without using the Internet.


    Sometimes, the extra layer uses an inherence factor instead. An inherence factor
    is a biometric measure, which utilizes a physical attribute of the user. Touch
    ID on iPhones, which allows users to log in with their fingerprint, is an inherence
    factor, as are retinal scans and facial recognition. While inherence factors can
    be easy to use (scanning your fingerprint may be more convenient than typing in
    an OTP), they are not as popular as other authentication schemas because a compromised
    biometric is impossible to replace. If, for example, hackers manage to steal your
    fingerprint data, there is no reasonable way for you to change your fingerprints,
    whereas a password is simple to change. This risk is allayed in most uses by storing
    biometric data locally (e.g., directly on your phone) under encryption. Since
    the data aren’t traveling between locations, the attack surface (the number of
    different places an attacker could target the application) is smaller, meaning
    there are fewer ways for an attacker to hack the application. Therefore, inherence
    factors generally only make sense for applications tied to a device that doesn’t
    need to store biometric information in the cloud.


    Multifactor authentication (MFA) can protect you against attackers who have stolen
    your credentials, say from a replay attack. If a hacker tries logging in with
    your password, they won’t be able to log in since they don’t have the second layer
    of authentication. Keep in mind that you should still rotate your credentials
    if you suspect someone has stolen them. For personal use, the most secure decision
    is to add MFA on all applications that support it, from your bank account to your
    social media accounts. However, requiring MFA for your users may not be the right
    decision. While MFA provides additional security, not all consumers prioritize
    security and may consider MFA burdensome. In any case, it’s always a good idea
    to support MFA, even if you don’t require it.


    ### Network Security


    Network security refers to the securing of networks that access and transport
    information, both from your user’s side and in a corporate setting. This section
    outlines tools you can use as an individual user and for everyone on your Internet
    network, whether that be a home network you share with your family or a corporate
    one you share with your company.


    From a personal standpoint, the simplest precaution you can use to protect yourself
    while browsing the Internet is using HTTPS. HTTPS, which stands for Hypertext
    Transfer Protocol Secure, uses TLS (from the encryption section above) to serve
    traffic safely. While browsing the Web, make sure that you use the HTTPS protocol
    at the beginning of your URL instead of HTTP, which does not include the encryption
    that HTTPS does. In some browsers, like Firefox and some versions of Chrome, you
    can also verify that you are surfing with HTTPS by looking for a green lock in
    the URL bar. Browsers may also naturally block connections to websites using outdated
    or unsafe TLS settings.


    Beyond using HTTPS, make sure to exercise caution on the Web. Download software
    only from trusted sources, and be mindful of streaming sites with ads that might
    contain malware. A simple way to combat such ads is to install an ad blocker such
    as `uBlock`. Since attackers often create hyperlinks that claim to link to one
    domain (e.g., “`google.com`”) but send you to a different, dangerous site, it
    is good practice to type URLs into the browser instead of following links to protect
    against the phishing attacks we outlined earlier.


    To further secure your web traffic, you can use a Virtual Private Network (VPN),
    usually by using a third-party VPN service. A VPN sends network requests (most
    frequently website navigation) through an encrypted tunnel to a remote server,
    which then sends the request on to the public network. When browsing via a public
    network (like at a coffee shop), this is useful because your traffic is encrypted
    and appears to be coming from a different IP address owned by the VPN service.
    Your data are still secure even if the public network is insecure because the
    VPN tunnel encrypts them.


    Many workplaces, especially those with remote workers, utilize a VPN so that employees
    using different local networks (say, their home Wi-Fi networks) appear to be on
    the same private network. Then, computers on the VPN can identify which other
    computers are on the same VPN and are therefore trustworthy. In essence, a VPN
    can serve as a single point of authentication, much like badging into an office
    space.


    A final precaution you can take to secure any network is to use a firewall or
    a proxy. A firewall blocks traffic from user-specified sites to your IP addresses
    and vice versa to protect you from malicious sites and attackers. A proxy serves
    as an intermediary between the user and the external network and can perform various
    functions, such as blocking malicious sites and masking your IP address to any
    prying parties or potential attackers.


    ## Implementing Security Practices in Your Application


    Given all of these attacks, tools, and precautions, the next step is to take this
    knowledge and use it to build security into your team’s development process. We’ll
    outline three steps to guide you in thinking about security as it pertains to
    your application: (a) securing your application, (b) staying secure, and (c) minimizing
    damage.'
