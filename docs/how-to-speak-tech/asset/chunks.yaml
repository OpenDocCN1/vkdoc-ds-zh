- fmt: '#### Step 2: Miners Verify the Transaction


    Each miner verifies this transaction upon receiving it by, among other things,
    checking whether Alice indeed has 5 Bitcoins to spend. This is done by traversing
    across the Bitcoin blockchain and subtracting all the Bitcoins that Alice has
    spent from those that she has received. Recall that the blockchain is an immutable
    ledger of all transactions that have ever taken place. This means that if a miner
    starts with the first block and reads data from every single block until the latest
    block, he or she is able to calculate Alice’s balance.


    #### Step 3: The Transaction Is Waiting to Be Mined


    Once the miners validate the transaction, it is stored in each miner’s `memory
    pool`, which is a local data storage that holds all valid transactions that are
    waiting to be packaged into blocks and added to the Bitcoin blockchain. Note that
    when a transaction is in the `memory pool`, it is not in the Bitcoin blockchain,
    that is to say, it is not yet a confirmed Bitcoin transaction. The transactions
    sitting in the `memory pool` are waiting to be mined into blocks and appended
    to the blockchain.


    #### Step 4: The Transaction Is Packaged into a Block, Mined, and Appended to
    the Blockchain


    How are transactions taken from the `memory pool`, mined into blocks, and appended
    to the blockchain? This involves some complexity because we need to make sure
    that each miner does not add a different block to the blockchain and that the
    transactions are valid. In other words, all the miners need to verify transactions
    and agree on a single block that they all add and do so without a central authority
    telling them what to do. One way to make miners agree is to have them play a random
    game that only one miner will win and that requires them verifying the transactions
    as part of the game. When that miner wins, the transactions are verified and that
    miner earns the right to add his/her block to the blockchain. Everyone else must
    agree to do the same. We call this game “the Bitcoin proof-of-work algorithm.”


    As an example of such a game, imagine a game where Player A thinks of a number
    between 1 and 10. Player B’s task is to guess the number, but she can only guess
    one number per try. Assuming that Player A thought of her number randomly, there
    is no deterministic methodology that Player B can employ to figure out the number.
    Simply, she has to guess. This type of guessing is known as `brute-force` guessing.
    If Player C, then, joins the game but with two guesses per try instead of just
    one, she is statistically expected to guess the number quicker than Player B.
    This is because `brute-force` guessing can be made more efficient with an increased
    frequency of guesses.


    Miners engage in a similar `brute-force` guessing game when attempting to find
    the digital fingerprint of a block that is valid. To begin the process, the miner
    selects an arbitrary amount of transactions from the `memory pool`. The miner
    then appends some required data, such as the current `time stamp`, and runs everything
    through the SHA256 hashing algorithm. The resulting hash is the `block hash`,
    also referred to as the block’s digital fingerprint. This process of selecting
    transactions and hashing them to create a block is known as `mining`. How does
    the miner know if he or she found a valid block hash? If the numerical value of
    the `block hash` is lower than the current `target` value, the block is deemed
    valid and can be appended to the Bitcoin blockchain. See Table [16-3](#321739_2_En_16_Chapter.xhtml#Tab3).
    An intuitive way of comparing the hexadecimal values of SHA256 hashes to the `target`
    is by looking at the leading zeros: the more zeros at the start of the hash, the
    lower its value.


    Table 16-3. Judging the Validity of a Block Hash Based on the Target Value


    | Example target value | 000000000000000000365a170000000000000000000000000000000000000000
    |

    | Invalid block hash | 000f6497afaa87b8ce79a4a5f4ca90a579773d6770650f0819179309ed846190
    |

    | Valid block hash | 0000000000000000000000000000a4a5f4ca90a579773d6770650f0819179309
    |


    Statistically, more often than not, the miner will find a hash that is greater
    than the `target` and therefore generate an invalid block that cannot be appended
    to the Bitcoin blockchain. To generate a new `block hash`, the miner can either
    change the permutation of the transactions in the block, select a new set of transactions
    from the `memory pool` or—and this is the preferred option—add a random number
    to the data in the block, known as a `nonce`. Recall that the smallest change
    in input data will produce a new hash, so the miner can iterate through different
    `nonce` values to produce radically different hashes.


    Miners iterate at a `hash rate` of trillions of hashes per second, often using
    specialized hardware, in a competition to be the one that finds the next valid
    `block hash`. The faster a miner can iterate through hashes, just like Player
    C had more guesses per try, the more likely he or she is to find a valid digital
    hash. This computationally intensive process is known as `proof-of-work` because
    once a miner finds a hash, it serves as proof of the work he put in to mine the
    next block.


    Once a miner finds a valid `block hash`, the block is broadcasted to the Bitcoin
    network, and other miners verify and append it to their version of the Bitcoin
    blockchain.'
