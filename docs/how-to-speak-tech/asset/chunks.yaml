- fmt: '### HTML


    HTML是一种标记语言，它定义了网页的内容和结构。如第[3](#321739_2_En_3_Chapter.xhtml)章所述，标记语言使用标签和特殊字符来赋予文档结构。标签分为两种类型：容器标签和独立标签。容器标签包裹你想要格式化或赋予上下文的文本。以`<h1>Read
    my book</h1>`为例。当浏览器将标记代码翻译为你所看到的网页时——这个过程称为*渲染*——它会识别起始的`<h1>`标签，并知道对其后的文本进行加粗和放大。因此，“Read
    my book”看起来会像一个标题。`</h1>`是结束标签，它告诉浏览器不再对任何文本加粗，并继续读取代码，直到遇到下一个标签。这类标签也可以嵌套，例如，如果你希望标题为斜体，可以写成`<h1><i>Italicized
    Heading</i></h1>`。容器标签通过开始和结束标签描述格式，而独立标签则是你放入代码中以产生某种效果的标签。例如，当浏览器在HTML中读取到`<br>`时，它知道在继续读取其余代码前，需要在网页中创建一个换行。


    因此，标记语言使用标签的组合来定义文档的结构。样式表（将在CSS中讨论）为标签添加样式，使得渲染后的文档不会显得那么简陋。没有这种样式，网页看起来都会一样，使用相同的字体、字号和颜色。样式表告诉浏览器诸如“让所有`<h1>`标签使用不同的字体！”之类的信息。因此，标记文档和样式表共同构成了网页的基本要素。


    有了这个介绍，让我们回到HTML。在20世纪80年代，蒂姆·伯纳斯-李使用一种称为*标准通用标记语言*（SGML）的*元语言*创建了HTML，这是用于在互联网上显示网页的主要标记语言。与其他标记语言一样，HTML使用分层嵌套的标签来赋予构成网页的文本以结构。回想一下，元素可以嵌套，就像之前描述的斜体元素被包含在`<h1>`标签内一样。用户访问网页时，本质上是打开一个HTML文件，浏览器随后将其渲染为更易读的格式。


    HTML页面的结构通常由以下六个部分组成：


    - *DOCTYPE*：随着时间的推移，HTML和XHTML（稍后讨论）的新版本不断被开发出来。因此，我们面临一个问题：网页是用多种可用标记语言的版本和类型之一编写的。当你访问最喜欢的网站时，浏览器如何知道该网页是由哪种标记语言创建的？如果它不知道，它可能会错误地解释某个标签，或者根本无法呈现页面。因此，DOCTYPE（文档类型定义/声明）告诉浏览器文件是用哪种标记语言编写的。

    - *HTML*：`<html>`标签包含文档中除了DOCTYPE之外的所有标签或元素。它定义了浏览器应渲染的区域。

    - *Head*：`<head>`元素包含浏览器用于读取文档其余部分的信息。除了文档的标题，`<head>`元素还包括其他脚本、元信息和样式表——这些都将稍后讨论。

    - *Title*：这定义了网页的标题。除了向用户传递信息外，一个好的标题是*搜索引擎优化*（SEO）的关键之一，SEO是提升你在搜索引擎结果中排名的过程（第[10](#321739_2_En_10_Chapter.xhtml)章）。

    - *Meta*：元标签用于向浏览器传递信息，例如页面的关键词或页面内容的描述。这些标签对于SEO也很重要。

    - *Body*：`<body>`元素包含要阅读的实际页面，包括所有文本、图像、链接等等。


    还存在许多其他类型的标签，用于引入图形图像、表格、列表以及几乎你能想到的任何东西。标签可以具有属性，这些属性提供关于元素的更多描述，例如用于样式设置的信息。最新版本HTML5还支持动画、地理定位、触摸屏支持和内容处理等新特性。


    以下两节将讨论你在讨论标记语言和网页设计时可能遇到的其他术语。


    ### XML和XHTML


    XML是一种标记元语言，这意味着它用于定义其他标记语言，因此在某些方面它与SGML类似。然而，它比SGML简单得多，而HTML正是从SGML技术发展而来的。XML由两部分组成：文档和样式表。文档包含如前所述的标签或元素，而样式表则为各个元素提供样式。


    为什么我们需要XML？SGML包含许多复杂且常常不必要的方面。因此，HTML经常对错误很宽容，对规则也较为宽松，导致同一HTML文档在不同浏览器或设备上产生不同的渲染效果。如果每个浏览器对你的代码理解不同，那么作为开发人员，你将难以控制用户界面。XML更为严格，并具有需要遵守的指南。因此，如果我们能够用XML重写HTML，我们就能创建一种可能不会像HTML那样遇到许多问题的标记语言。这一想法启发了名为XHTML的标记语言。凭借更严格的编码指南，XHTML页面可以在不同设备和浏览器上具有更好的可访问性，尽管XHTML并非*向后兼容*，这意味着旧版浏览器可能无法读取较新版本的标记语言。'
  raw: '### HTML


    HTML is a markup language that defines the content and structure of web pages.
    As discussed in Chapter [3](#321739_2_En_3_Chapter.xhtml), a markup language uses
    tags and special characters to give structure to a document. There are two types
    of tags: container and standalone. Container tags flank text that you want to
    format or contextualize. Take the example of `<h1>Read my book</h1>`. When a browser
    translates the markup code in the web page that you see—a process called *rendering*—it
    will see the starting `<h1>` tag and know to bold and enlarge the text that comes
    after it. Thus “Read my book” will look like a heading. `</h1>`, the end tag,
    tells the browser to no longer bold any text and to continue reading the code
    until it hits the next tag. Such tags can also be nested, such that if you wanted
    your heading to be italicized, you could write `<h1><i>Italicized Heading</i></h1>`*.*
    Whereas container tags describe formatting with both start and end tags, standalone
    tags are those which you place into the code to create some type of effect. When
    a browser reads `<br>` in HTML, for example, it knows to create a line break in
    the web page before continuing to read the rest of the code.


    Thus, markup languages use combinations of tags to define the structure of a document.
    The style sheet (which will be discussed with CSS) adds style to the tags so rendered
    documents don’t look so bare. Without this styling, web pages would all look the
    same, with the same font, font size, and color. Style sheets tell the browser
    things such as “Make all those `<h1>` tags a different font!” Thus the markup
    document and style sheet together form the bare essentials of web pages.


    With that introduction, let’s jump back to HTML. In the 1980s, Tim Berners-Lee
    used a *metalanguage* called *Standard Generalized Markup Language* (SGML) to
    create HTML, the main markup language used to display web pages on the Internet.
    As with other markup languages, HTML uses tags that are hierarchically nested
    to give structure to text that forms the web page. Recall that elements can be
    nested, in the same way that the italicized element was contained within the `<h1>`
    tag described previously. On visiting a web page, a user is essentially opening
    an HTML file, which the browser then renders into a more legible format.


    The structure of HTML pages typically consists of the following six parts:


    *   *DOCTYPE*: Over time, new versions of HTML and XHTML (discussed later) have
    been developed. Therefore, we have the problem where web pages are written in
    one of several versions and types of markup languages available. When you go to
    your favorite website, how does your browser know which markup language created
    that web page? If it did not know, it might interpret one of the tags incorrectly
    or might not present the page at all. Therefore, DOCTYPE, or Document Type Definition/Declaration
    (DTD) tells the browser in which markup language the file was written.


    *   *HTML*: The HTML tag contains all the tags or elements of the document (except
    the DOCTYPE). It defines the area that the browser should render.


    *   *Head*: The head element contains the information that the browser uses to
    read the rest of the document. In addition to the title of the document, the head
    element includes other scripts, meta-information, and style sheets—all discussed
    later.


    *   *Title*: This defines the title of the web page. In addition to communicating
    information to a user, a good title is one of the keys to *search engine optimization*
    (SEO), the process by which you can improve your position in search engine results
    (Chapter [10](#321739_2_En_10_Chapter.xhtml)).


    *   *Meta*: Metatags are used to convey information to the browser such as the
    keywords of the page or a description of the page content. These tags are also
    important for SEO.


    *   *Body*: The body element contains the actual page to be read including all
    text, images, links, and so forth.


    Numerous other types of tags exist that introduce graphical images, tables, lists,
    and almost anything else you can think of. Tags can have attributes that give
    more descriptions about the element, such as information used for styling. The
    newest version, HTML5, also supports new features such as animation, geolocation,
    touchscreen support, and content handling.


    The following two sections discuss other terms you are likely to come across when
    discussing markup languages and the design of web pages.


    ### XML and XHTML


    XML is a markup metalanguage, which means it is used to define other markup languages,
    so in some ways it is similar to SGML. It is much simpler, however, than SGML,
    the technology from which HTML was developed. XML consists of two parts: a document
    and a style sheet. The document contains tags or elements, as described earlier,
    and the style sheet gives style to the various elements.


    Why do we need XML? SGML includes a lot of complex and often unnecessary aspects.
    As a result, HTML is often forgiving of errors and is more lenient with rules,
    leading to different renderings of the same HTML document by different browsers
    or devices. It becomes difficult for you as a developer to control the user interface
    if each browser reads your work differently. XML is stricter and has guidelines
    that need to be followed. Therefore, if we were able to rewrite HTML with XML,
    we could create a markup language that might not run into as many problems as
    HTML. This idea inspired the markup language called XHTML. With stricter coding
    guidelines, XHTML pages can be more accessible on different devices and browsers,
    though XHTML is not *backward-compatible*, meaning old browsers may not be able
    to read newer versions of the markup language.'
