    *   *Development time*: REST APIs are typically quicker to develop than SOAP APIs,
    contingent on your individual programmer’s expertise.


    *   *Flexibility*: Because SOAP uses XML documents as messages, more information
    can be included in SOAP requests than in REST requests, giving SOAP APIs greater
    flexibility.


    ### Authentication


    As discussed in the opening sections of this chapter, you might want to keep track
    of who is using your API and what they are requesting. You also might want to
    communicate with your API users to confirm the accuracy of the data and security
    of the connection. Approaches to authentication include the following:


    *   *Open API (no authentication)*: There are no barriers to use the API, the
    code can be distributed more freely, and you do not need to manage requests, assuming
    you are okay not tracking individual users. Open API is an attractive option if
    you are interested only in anonymous, aggregated data, not in specific individuals’
    actions or in controlling access to the API.


    *   *Message-based authentication*: Credentials such as a unique developer’s key
    can be passed in the API request as part of the message. Alternatively, information
    can be passed in the HTTP headers of incoming requests.


    *   *SSL endpoint*: This method helps the client keep track of the server. After
    receiving a server certificate, the client can check to see if it changes. If
    it does, the information is likely coming from a source other than the server
    and therefore cannot be trusted. This authentication method prevents an attacker
    from impersonating the person you are expecting. Because the SSL endpoint method
    does not help identify the client, it is used in conjunction with one of the other
    methods listed here.


    *   *Client-side certificates*: You can configure your API to create certificates
    to give to a client (via a secure channel) to present for authentication every
    time the client makes a request. Although client-side certificates are considered
    a robust way of dealing with authentication, this form of authentication can be
    considerably slower.


    ### JavaScript Object Notation


    Another formatting language besides XML (Chapters [4](#321739_2_En_4_Chapter.xhtml)
    and [5](#321739_2_En_5_Chapter.xhtml)) that you are likely to come across is *JavaScript
    Object Notation* (JSON), which uses a collection of name/value pairs that can
    be nested. For example, a book (object) can contain many name/value pairs that
    describe its author, title, and year published. Many APIs “return” (deliver the
    response in) JSON rather than XML. These are different ways of structuring the
    same information.


    ## Libraries


    A *library* is a collection of code that defines commonly used functionality (such
    as drop-down menus or animated pop-up windows). For example, you might create
    a library of math variables and functions. You can share your library so that
    anyone else who wants to use math in their programs can import your shared library
    and save a lot of time. Shared code and libraries reduce development time and
    the number of developers needed.


    On the other hand, how much do you trust the reliability of your system on someone
    else’s contributed software? There are no right or wrong answers, but your ultimate
    decision requires good judgment on behalf of your team of programmers.'
  trans: '

    #### REST


    `REST` 是一种由 Roy Thomas Fielding 开发的架构风格，旨在提高 Web 的可扩展性。每个请求包含两部分：端点（即 URL）和包含请求的消息。该消息由几个部分组成，包括开发者
    ID 或“密钥”（如果需要的话，这有助于 API 跟踪谁在发起请求以及频率）、所需操作（例如 `getWeather`），以及提供更多请求信息的参数（例如，仅查询今天和昨天的
    `getWeather`）。所有这些信息都编码在 URL 中，并通过 HTTP 的 `GET` 方法发送给 API。随后，API 解码请求，与服务器交互以完成所需操作，然后将响应返回给用户。


    #### SOAP


    `SOAP` 始于 1997 年微软的一项倡议，是另一种使用 HTTP 从远程服务器请求数据的方式。`REST` API 将请求的具体信息编码在 URL 中，而
    `SOAP` 则将请求的详细信息放在一个 XML 文档中发送。构成消息的 XML 文档必须满足 *Web 服务描述语言*（`WSDL`）文件中概述的规范。在某种程度上，`SOAP`
    就像把请求装进信封里发送（隐藏了请求的细节），而 `REST` 则像是把请求写在明信片上发送（所有人可见）。不过，两者都通过邮件（即 HTTP）进行传输。


    #### 比较 REST 与 SOAP


    `REST` 和 `SOAP` 在以下方面存在差异：


    *   *开销*：由于 `REST` 请求限于一个 URL，而 `SOAP` 请求则由整个文档描述，因此后者往往体积更大，需要更多开销，并在消息的不同部分包含更多进一步定义请求的信息。

    *   *透明度*：延续明信片与信封的类比，`REST` 的一切都是公开的，因此更容易被监控；而 `SOAP` 则只有地址（端点 URL）可见。

    *   *开发时间*：`REST` API 通常比 `SOAP` API 开发得更快，这取决于你团队成员的程序员技能。

    *   *灵活性*：由于 `SOAP` 使用 XML 文档作为消息，因此 `SOAP` 请求中可以包含比 `REST` 请求更多的信息，这使得 `SOAP`
    API 具有更高的灵活性。


    ### 身份验证


    正如本章开头部分所讨论的，你可能希望跟踪谁在使用你的 API 以及他们在请求什么。你也可能希望与 API 用户进行通信，以确认数据的准确性和连接的安全性。身份验证的方法包括以下几种：


    *   *开放 API（无身份验证）*：使用 API 没有任何障碍，代码可以更自由地分发，并且你无需管理请求（前提是你不在意追踪单个用户）。如果你只关心匿名的聚合数据，而不关心特定用户的行为或控制
    API 的访问权限，那么开放 API 是一个有吸引力的选择。

    *   *基于消息的身份验证*：可以将凭证（例如唯一的开发者密钥）作为消息的一部分包含在 API 请求中传递。或者，信息也可以通过传入请求的 HTTP 头部传递。

    *   *SSL 端点*：该方法帮助客户端跟踪服务器。在收到服务器证书后，客户端可以检查它是否发生变化。如果发生变化，则信息很可能来自服务器以外的源头，因此不可信。这种身份验证方法可以防止攻击者冒充你期望的服务器。由于
    `SSL` 端点方法无法帮助识别客户端，因此它需要与本文列出的其他方法之一结合使用。

    *   *客户端证书*：你可以配置 API 来创建证书，并通过安全通道将其提供给客户端，以便客户端在每次发出请求时出示该证书进行身份验证。虽然客户端证书被认为是处理身份验证的强大方法，但这种身份验证形式可能会显著降低速度。


    ### JavaScript 对象表示法


    除了 XML（第 4 章和第 5 章）之外，你可能会遇到的另一种格式化语言是 *JavaScript 对象表示法*（`JSON`），它使用一组可以嵌套的名称/值对。例如，一本书（对象）可以包含许多描述其作者、标题和出版年份的名称/值对。许多
    API “返回”（以某种格式传递响应）`JSON` 而不是 XML。这些都是对相同信息进行结构化处理的不同方式。


    ## 库


    *库* 是定义常用功能（如下拉菜单或动画弹出窗口）的代码集合。例如，你可以创建一个包含数学变量和函数的库。你可以共享你的库，这样任何其他想在程序中使用数学功能的人都可以导入你的共享库，从而节省大量时间。共享代码和库可以减少开发时间以及所需的开发人员数量。


    另一方面，你对自己系统可靠性在多大程度上依赖于他人贡献的软件有多大信心？这里没有对错之分，但你的最终决策需要为你团队的程序员们做出良好的判断。

    '
- fmt: '## Open Source


    Related to the spread of information through APIs and libraries is the growth
    of *open-source* projects. *Open source* is best explained by examining the history
    of software development.


    Though hard to imagine, there was a time when all software development resided
    with researchers and was developed at universities; the discoveries could be shared
    without any limitations. All research was for the public good, after all. During
    the 1960s, corporations such as IBM and others borrowed this custom; when they
    released their first large-scale commercial computers, they gave away their software
    for free. With developments in technology, the arrival of competition, and falling
    prices of hardware, companies saw software as an alternate revenue source that
    could support their business. Software became commercial, proprietary property,
    and any reproduction without the company’s knowledge was illegal.


    Richard Stallman at MIT was upset with this change in culture. Concerned that
    MIT would control his new project and its distribution, Stallman left the university
    to continue working on his GNU software, a computer operating system made of entirely
    free software (such as a free version of Windows or Mac OS). As Stallman developed,
    his opposition to commercialization and his advocacy for equal access inspired
    others. In 1985, he founded the Free Software Foundation (FSF) to support the
    GNU project. The FSF promulgated the General Public License (1988) to protect
    free use and free access under the doctrine of *copyleft*. Rather than protecting
    a property’s rights (copyright), “copyleft protected the freedom to copy, distribute,
    and change a product.”


    The declaration of the GPL challenged the commercial view of proprietary software,
    and in the 1990s, a misunderstanding over the word *free* emerged. The “free”
    in FSF pertains to freedom, not to its price.


    According to the FSF definition, “a program is free software if the program’s
    users have the four essential freedoms:”^([⁶](#fn6))


    *   The freedom to run the program, for any purpose (freedom 0).

    *   The freedom to study how the program works and adapt it to your needs (freedom
    1). As a result, users must have access to the source code.

    *   The freedom to redistribute copies so you can help your neighbor (freedom
    2).

    *   The freedom to improve the program and release your improvements to the public,
    so that the whole community benefits (freedom 3). Again, ensuring this freedom
    requires access to the source code.


    Through its public education efforts—FSF used such slogans as “free speech, not
    free beer”—FSF tried to correct the misperception that it was against commercial
    software.


    Recall from Chapter [3](#321739_2_En_3_Chapter.xhtml) that the code that makes
    up a program is called the *source code.* To be read, understood, and altered,
    the source code must be accessible to the public—hence the term, *open source*.
    Access to source code, however, is a necessary but not a sufficient condition
    for a program to be considered *open source*. Anyone must be able to use the code
    in their own creations without restriction. Founded in 1988, the Open Source Initiative
    (OSI) promulgates “The Open Source Definition” as follows:^([⁷](#fn7))


    *Open source doesn’t just mean access to the source code. The distribution terms
    of open-source software must comply with the following criteria:*


    1.  *Free redistribution*: The license shall not restrict any party from selling
    or giving away the software as a component of an aggregate software distribution
    containing programs from several different sources. The license shall not require
    a royalty or other fee for such sale.

    2.  *Source code*: The program must include source code and must allow distribution
    in source code as well as compiled form. Where some form of a product is not distributed
    with source code, there must be a well-publicized means of obtaining the source
    code for no more than a reasonable reproduction cost, preferably downloading via
    the Internet without charge. The source code must be the preferred form in which
    a programmer would modify the program. Deliberate obfuscation of source code is
    not allowed.

    3.  *Derived works*: The license must allow modifications and derived works and
    must allow distribution under the same terms as the license of the original software.

    4.  *The integrity of the author’s source code*: The license may restrict the
    source code from being distributed in modified form only if the license allows
    the distribution of “patch files” with the source code that allow modification
    of the program as it’s built and compiled. The license must explicitly permit
    distribution of software built from modified source code. The license may require
    derived works to carry a different name or version number from the original software.

    5.  *No discrimination against persons or groups*: The license must not discriminate
    against any person or group of persons.

    6.  *No discrimination against fields of endeavor*: The license must not restrict
    anyone from making use of the program in a specific field of endeavor. For example,
    it may not restrict the program from being used in a business or from being used
    for genetic research.

    7.  *Distribution of the license*: The rights attached to the program must apply
    to all to whom the program is redistributed without the need for execution of
    an additional license by those parties.

    8.  *The license must not be specific to a product*: The rights attached to the
    program must not depend on the program’s being part of a particular software distribution.
    If the program is extracted from that distribution and used or distributed within
    the terms of the program’s license, all parties to whom the program is redistributed
    should have the same rights as those that are granted in conjunction with the
    original software distribution.

    9.  *The license must not restrict other software*: The license must not place
    restrictions on other software that is distributed along with the licensed software.
    For example, the license must not insist that all other programs distributed on
    the same medium must be open-source software.

    10. *The license must be technology-neutral*: No provision of the license may
    be predicated on any individual technology or style of interface.


    Around this time, Red Hat was founded as an organization solely dedicated to improving
    and educating others on how to use Linux, an open-source computer operating system.
    It was the first company whose entire business model focused on copyleft products.
    Open-source systems began challenging the position of large software corporations,
    including Microsoft.^([⁸](#fn8))


    Since then, many other open-source licenses have been created, such as the Mozilla
    Public License by Netscape. The growing culture of open source is represented
    today by about 50 specific, OSI-approved, open-source licenses divided broadly
    into the following two groups:


    1.  *Academic licenses*: Under these licenses, universities distribute their research
    to the public and allow their software and source code to be used, copied, modified,
    and distributed. The Berkeley Software Distribution (BSD) license is the archetype
    and represents the “no-strings-attached” approach. All code licensed under academic
    licenses gets added to a general pool of code that can be used for any purpose,
    including for the creation of commercial software. You can borrow code from this
    pool and never contribute.'
