    # 大数据


    *大数据*与普通数据有何不同？其实，即便在计算机出现之前，各类组织也一直在积累信息，但如今可收集和存储的数据量已呈爆炸式增长。当前收集的数据规模已远超传统处理方法的承载能力。关系型数据库因成本高昂且限制过多正被边缘化，更具扩展性和灵活性的非关系型数据模型逐渐崭露头角。为了让您直观感受其规模与增长，据估计，2010
    年全球产生了 1.2 皆字节（1.2 × 10²¹ 字节）的数据。^(⁴) 作为对比，地球上沙子的数量估计在`10²⁰`到`10²⁴`粒之间。想象一下要筛遍所有沙粒的场景！假设我们的数据量每两年翻一番，那将需要建造大量的数据中心。


    在讨论如何着手研究如此海量数据之前，先了解几个描述数据的术语。第一个是*数据量*，这也是“大数据”一词最直观的体现。信息量庞大是首要难题，这促使工程师思考如何利用分布式系统来应对。第二个是*数据速度*，指新数据产生的速率。例如，Facebook
    的数据生成速度可能远高于`MyAppoly`。面对每天海量的交互，Facebook 必须做出重要决策：哪些数据该保留，哪些该丢弃？在线购物网站也面临类似困境。每当用户点击商品或输入搜索词，企业都必须决定是否保存该信息。然而，保存更多信息可能会影响将数据转化为洞察的速度。如果零售商因数据处理延迟而无法快速为用户定制个性化网页体验，那么更敏捷的竞争对手很可能会胜出。最后是*数据多样性*。若数据来源多样、形式各异，则会带来一系列更为复杂的处理难题。


    现在，您可以去找您的数据团队，告诉他们数据多样性增加了存储难度，当前的数据速度已超出有限的服务容量。用更通俗的话说，您可能只需一句：“我们需要更多预算！”


    假设您拥有海量且高度多样化的数据。单纯靠肉眼观察得出有效信息的可能性微乎其微，尤其当数据没有明显模式时。在“大数据”领域，您可能会遇到一个词——*Hadoop*，这是一个软件框架，允许组织对数据进行测试以寻求答案。如前面章节所述，分布式架构是存储和处理海量信息的关键。Hadoop
    通过将数据分散到一组并行工作的强大处理器上来帮助组织理解数据。Hadoop 使用的主要方法称为*MapReduce*，包含两个部分：映射（map）和归约（reduce）。假设您想从数据集中解决某个问题，工程师编写了一个理论上可得出正确答案的函数。*映射*会将任务拆分为多个部分，并分发到多台机器上。此阶段完成后，*归约*会将每台机器的结果合并为单个任务，从而完成分析。任何单台机器都无法及时完成如此庞大的工作量，因此
    Hadoop 的分而治之策略是一个极其强大的工具。其他工具，如*Spark*，也正日益流行。


    ## 结论


    至此，您已了解了`MyAppoly`如何在后端运行、用户如何在前端交互，以及数据如何贯穿其中的一些基础知识。


    脚注 1


    # 6. 利用现有代码：API、库与开源项目


    想象一下，如果没人能利用他人的发明来设计新产品，社会发展的速度会多么缓慢。利用他人的创新成果进行新发现至关重要。或许一种为治疗某种疾病开发的药物，可以改良后用于治愈另一种疾病；也许为制造更耐用器皿而发明的柔性玻璃，可以用来制作摔不碎的手机屏幕。我们不断追求更好的事物，但如果总从零开始，就很难有所发现。


    幸运的是，`MyAppoly`也无需从零开始。现有许多方式可以让`MyAppoly`利用现有代码。比如，您想在`MyAppoly`中添加一个地图。鉴于其他公司已投入时间和金钱完成了这项工作，您的团队从头构建地图几乎得不偿失。谷歌允许开发者使用谷歌地图，这体现了推动
    Web 2.0 时代网站和应用快速普及的关键动力。那句广为流传的格言“不要重复发明轮子”正是技术界的写照，并催生了信息共享的文化。互联网公司固然会谨慎保护自身信息，但总体而言，它们比过去的组织更乐于分享发现。这种协作文化在一定程度上解释了硅谷非凡的增长、活力与财富。


    您应聚焦于`MyAppoly`的独特之处，而非重建其他公司已提供的代码。那么，这些现成的工具究竟是什么呢？本章将阐述*应用程序编程接口*（`API`）^(⁵)
    的要点，并探讨开源运动及其重要性。


    ## 应用程序编程接口


    假设您想在地图上向用户展示最近的自动柜员机（ATM）位置，并在`MyAppoly`上接受信用卡支付。您的团队要么从头构建这些功能（这会大幅延长开发时间），要么利用他人的成果，例如谷歌地图和
    Stripe。有些`API`是免费的，有些则需要付费。谷歌地图允许您在`MyAppoly`内免费使用其地图服务，而 Stripe 会针对其处理的每笔信用卡支付收取少量费用。这种通过将一个公司的产品集成到另一个产品中来实现轻松技术整合的能力，使得初创公司得以快速成长，并在相对较短的时间内变得成熟。`MyAppoly`不仅能受益于他人的`API`，也能通过发布自己的`API`获益。如果其他公司开始依赖`MyAppoly`的`API`所提供的数据和功能，您的业务将更具吸引力。

    '
- fmt: '### Using Others’ APIs


    Notable advantages and disadvantages of using APIs include the following:


    **Advantages**:


    - **Comparative advantage**: Using others’ APIs allows you to focus on your core
    competency and value proposition. In the same way a traditional business might
    contract out the nonessential work, such as document editing or reimbursements,
    you can contract out such work as payment processing and map features.

    - **Save development time**: Contracting out your noncore work to other companies
    by using their APIs saves your development team’s time. You will save time both
    in building the feature and in maintaining it.

    - **Leverage the expertise of others**: Companies typically release APIs in the
    area of their core competency. Whether their API provides information or functionality,
    chances are the company invests a lot of time into developing it. Even if your
    team could do a great job, why not give the responsibility to a company that is
    purely focusing on solving that problem?

    - **Access to information**: Many APIs provide access to data. Often these data
    are available on the company’s website but in a format that is not conducive to
    collecting at scale. An API can give you the same data in a format that allows
    you to manipulate it more easily. An example could be a weather API. The website
    might show you the daily weather in a particular city over time, but imagine that
    you were conducting a global warming study and had to collect the daily data from
    ten cities over the past 50 years. It would be tedious to copy each number from
    the website manually. Their API might allow you to access and download all of
    the data you want at once.


    **Disadvantages**:


    - **Dependence**: If the company behind an API decides to change its policies
    or shut it down, your web application will no longer function properly. This risk
    is a part of any business that depends on third parties. Do they have a lot of
    big clients? Are they performing well? Has their API been available for a while?
    Answers to these questions help predict reliability.

    - **Not custom-made**: It is also possible that your exact needs are not satisfied
    by any API on the market. APIs provide general solutions, but they may not work
    perfectly for your site. Therefore, there may be a tension between conforming
    to what an API offers in the name of the advantages listed above and building
    the entire feature from scratch to get the full range of functionality.


    Where you come out after weighing this list of pros and cons will depend on the
    specific API and its functionalities. Just remember that leveraging existing code
    is a trend across the industry, and excessive conservatism may drop you behind
    MyAppoly’s competitors.


    ### Making an API Available


    Imagine that MyAppoly allowed its users to match random handwriting samples to
    specific individuals. You might be building this tool for forensic investigation,
    electronic payment verification, or historians. One way you could enable all of
    these scenarios would be to release a MyAppoly API. The advantages of releasing
    a MyAppoly API include the following:


    - **Scale client integration**: If you want to give different potential partners
    access to your data or functionality, building a custom solution for each one
    would require a lot of time and resources. Why not standardize the interface in
    the form of an API and let your partners access what they want within the parameters
    you provide?

    - **Others’ dependence on you**: If your API becomes a critical part of the operation
    of several companies, you have generated an additional source of value for your
    company. Others rely on you. Think about all of the third-party applications built
    on top of Facebook. If Facebook disappeared, imagine how many other companies
    would collapse. Other companies’ reliance on Facebook undoubtedly supports Facebook’s
    valuation and success.

    - **Variety of distribution methods**: An API can make the same information that
    you already present through your application available to people who want to consume
    it differently. By providing this alternate access method, you are increasing
    your market.

    - **Revenue source**: Charging others for using your API could represent a substantial
    source of revenue.

    - **More data**: Every time someone makes a call to your API, you can record that
    information. This data might help you identify trends in the industry or opportunities
    for new features.

    - **Brand value**: Even if you choose to make your API available for free, the
    value you generate from widespread use will return to you in the form of brand
    and reputation. It can help establish you as a leader in your field and a proponent
    of knowledge sharing.


    You must also consider the disadvantages:


    - **Resources**: APIs bring additional engineering and maintenance challenges.
    Every time your data source changes, you must make sure the API works properly.
    For example, if you expand your data set to include audio files, you have to update
    your API correspondingly. Lastly, developers trying to integrate your API into
    their applications might require customer support and documentation explaining
    the available functionality. An API without support will lead to frustration and
    eventual abandonment. If you want to make an API available, be forewarned that
    it can be a resource-intensive process.

    - **Security**: An API allows users to gain access to your data. This portal might
    expose vulnerabilities whereby other information you do not want to share can
    be improperly accessed. The proliferation of APIs suggests, however, that these
    risks are avoidable or manageable.

    - **Cost**: Every time that a developer uses your API (by making an API “call”
    or “request”), MyAppoly must take action. Who pays to process these requests?
    You do! Before you release an API, you need a plan to pay for handling the requests.


    The success of your API will depend on how easy it is for developers to learn,
    use, and integrate.


    ### How Do APIs Work?


    The technical details underlying APIs can get complicated, but the basics are
    simple. APIs are software-to-software interfaces. Applications talk to each other
    without your involvement. If MyAppoly needs to show the weather, for example,
    the software can communicate (“make calls”) with a weather API to obtain the most
    updated weather report before showing it to the user.


    One way you could retrieve the weather would be through the weather website (direct
    access). Alternatively, you could go through an API. Instead of accessing the
    weather directly through a browser, you write code that uses the API to get the
    information you want. But how do you know what to write? The API provides *documentation*
    that tells you what the valid requests are and how exactly to write them, similar
    to a programming language. So, after reading the API’s instructions and rules,
    you specify that you want the weather by using its `getWeather` function. When
    you give the function to the API, it interacts with the server to retrieve the
    information you requested. The API then returns the results to you in a format
    that is easily digestible (typically XML or JSON, discussed in the “JavaScript
    Object Notation” section of this chapter). Depending on what the API allows you
    to do, you could theoretically get all the information you want through the API
    and never have to visit the website again through a browser.


    From this example, you can see that APIs are designed for software developers
    and can be defined as “a set of routines (usually functions) and accompanying
    protocols for using these functions that provide building blocks for software
    development.” They allow users to connect to the application via a secure channel
    and then run functions using code to get information or to borrow functionality.


    Two of the more popular types of APIs—*Representational State Transfer* (REST)
    and *Simple Object Access Protocol* (SOAP)—are described and compared in the next
    sections.'
  raw: '### Using Others’ APIs


