- fmt: '# 10. Attracting and Understanding Your Users


    Users can learn about your website through many different ways, each called a
    *channel*. One might be through *social media*. For example, new users might learn
    about and join `MyAppoly` via a Facebook post or a tweet. Another channel could
    be through *referrals* (jargon for word of mouth). Yet another could be through
    an email marketing campaign. As you can see, there are several ways to reach potential
    customers and convince them that it is worth their time to consider your website.
    This chapter focuses on the rise of search engines and the two prominent channels
    associated with them: organic and paid search. *Organic search* refers to the
    results that pop up from standard search. When you search for something online,
    you notice paid advertisements relevant to your search terms at the top of the
    *search engine results page* (`SERP`). *Paid search* refers to the presence of
    these ads.


    Businesses collect data on their customers to understand how they are performing.
    Grocery stores, for example, price inventory, stock items, and change their layout
    based on information like who their customers are, which products they purchase,
    and which aisles tend to be most popular. To learn some of this information, grocery
    stores intelligently introduced loyalty cards. Customers see this card merely
    as a tool to obtain discounts, but in reality, the customers are empowering the
    stores with their personal data.


    Loyalty cards work for grocery stores because customers who enter the store rarely
    leave without purchasing anything. Online customers are different. If you were
    only able to collect data about your `MyAppoly` customers when they made purchases,
    you would lose a lot of valuable data. Just like a grocery store, you want to
    figure out who your customers are, what they want, and what they think about your
    product. Since you cannot feasibly survey every user the way you could customers
    of a grocery store, you need to find an alternate source for the information.


    This chapter describes how search engines can be leveraged to attract users and
    how websites track what those users are doing. We also briefly discuss the new
    data protection regulations designed to protect our personal information from
    being leveraged without our explicit permission.


    ## Search Engine Optimization


    Today, we take search engines for granted, but the ability to search across the
    Internet was nonexistent until 1990, when a search engine named `Archie` allowed
    users to search by filename. From this point, several players worked on creating
    better search engines. In 1994, `Yahoo!` created a database of all web pages it
    could find manually and gave users a way to search through the catalog. Unfortunately,
    their approach was limited in effectiveness because the manual process of collecting
    pages was sluggish. `AskJeeves` proposed a new method of asking questions that
    was not exactly a true search but enabled knowledge sharing. These early players
    fought over their respective strategies. Little did they know that they were going
    to lose the fight to two Stanford University graduate students named Larry Page
    and Sergey Brin. In 1998, these two students worked on a way to scan the entire
    Internet and store a description about each page to recall and display websites
    based on a user’s search query. The number `googol` (a one followed by one hundred
    zeros) inspired the name of their search engine. `Google` was born, and the nature
    of how we would use the Internet fundamentally changed.


    Modern search engines store information about all websites and associated keywords.
    When you search for a term or phrase, they match your search to the descriptive
    keywords linked to each website.


    How do modern search engines actually collect the name and keywords of websites?
    Gone are the days of manual entry into a catalog! Necessity is the mother of innovation,
    as the adage goes, so as the number of web pages grew at an ever-increasing rate,
    the manual process of logging them became untenable. Smart `Google` engineers
    refined their ability to “crawl” over the Internet using *bots* called *spiders*
    that scan a web page and follow any links contained on the page. If they follow
    every link, they’ll pretty much discover the entire Web. As they scan each page,
    they record keywords that appear, the number of pages that link to it, and several
    other characteristics that help to describe the page and to assign it a rank comparing
    its relative importance to others on the same topic. The rank determines the order
    in which it is displayed when someone searches for a topic on `Google`, which
    is valuable since most users don’t look past the first few pages of search results;
    a higher ranking drives more traffic to your site. The process of searching for
    a topic and clicking a ranked article is organic search, and *search engine optimization*
    (`SEO`) refers to the process of improving your rank on `Google` and other search
    engines to increase the likelihood of acquiring users through organic search.


    In order to understand search engine optimization, you must also learn how the
    actual matching of a search query to database keywords works. Because queries
    can vary based on capitalization (e.g., *Tennis* vs. *tennis*), plurality (e.g.,
    *rackets* vs. *racket*), spelling (*racket* vs. *racquet*), and the inclusion
    of nonessential words and phrases (e.g., *the* and *a*), search engines typically
    remove all these variants before checking the query against the database. After
    the query is matched and all the corresponding web page results are selected,
    `Google` must rank them before presenting them to the searcher. The best results
    always seem to be at the top, thus minimizing the time a user spends finding the
    right link. In some ways, this is where the real magic of search engines lies.
    The actual crawling of the Internet and creation of the database are predictable,
    but the information collected and how that information is used to rank and display
    results are the differentiation factors in search.'
