  trans: '

    ### CSS


    **层叠样式表**（CSS）是一种告诉浏览器如何对各类 HTML/XHTML 元素进行样式设置和定位的语言。CSS 语法简洁，包含一个选择器（告诉浏览器要对哪些
    HTML 标签设置样式）和一个声明（告诉浏览器如何设置这些元素的样式）。


    CSS 样式可以存在于三个位置。首先，它可以内联放置，例如 `<h1 style="color:blue">我的蓝色标题</h1>` 告诉浏览器将标题设为蓝色。其次，所有样式代码可以集中放在页面顶部的
    `<head>` 标签内。浏览器足够智能，能够将样式代码与其对应的 HTML 标签匹配。最后，所有 CSS 可以放入一个外部样式表中，并在 HTML 页面中链接该样式表。你只需指定想要设置样式的
    HTML 标签，浏览器即可处理其余部分。在这三种方式中，外部 CSS 文件因以下原因被视为最佳实践：


    -   *可读性*：将结构与样式分离更好。

    -   *速度*：加载速度更快。

    -   *维护性*：假设你想更新整个网站的样式。如果 CSS 是内联的，你必须遍历所有 HTML 来更新所有样式；但如果所有样式都在一个外部文件中，你可以轻松进行更新。你甚至可以创建一个全新的文件，比如名为“`styleversion2`”，然后更改
    HTML 文档中的链接。根据你的心情，你可以将链接从 `styleversion1.css` 改为 `styleversion2.css`，整个网站的风格就会改变。这种强大的能力类似于*抽象*（第
    3 章）。


    第 3 章讨论的*继承*在 CSS 中同样存在，即*父*元素的样式会传递给*子*元素。换句话说，一个包含在另一个元素中的元素会继承其所在容器的样式。我们将这种继承概念称为*层叠*，这就是
    CSS 中字母 C 的由来。


    CSS 包含以下八种通用样式类别，并附有示例：


    -   *类型*：字体、颜色

    -   *背景*：颜色、图像

    -   *块*：字间距、行间距

    -   *盒*：宽度、高度、浮动

    -   *边框*：样式、颜色

    -   *列表*：样式、位置

    -   *定位*：位置、高度、可见性

    -   *扩展*：分页、光标


    CSS 中的定位基于盒模型，即每个元素都可被描述为位于一个嵌套区域中，从中心的*内容*向外延伸，经过*内边距*，再到*边框*和*外边距*。从某种程度上说，用
    CSS 设计网页无非就是在屏幕上排列盒子。


    ### JavaScript


    利用 HTML 和 CSS，你可以创建内容排版精美的漂亮网站，但它们缺乏交互性。下拉菜单、鼠标悬停时出现的信息框等等，都可以归功于 JavaScript——一种基于对象的脚本语言（还记得第
    3 章的定义吗？）。它存在于 HTML 文档中，并由你的浏览器（试图访问网站的*客户端*）解释执行；因此我们说 JavaScript 需要*客户端*处理。这就是为什么
    JavaScript 与我们讨论过的其他脚本语言不同，它被认为是前端而非后端。它不由服务器执行。


    JavaScript 最初由网景公司推出，如今在网络上无处不在，并将使 MyAppoly 具有交互性和动效。假设你想让用户在点击 MyAppoly 标志后显示一个信息弹出窗口。如何实现呢？包含该标志的
    HTML 元素将包含对一段称为*事件处理程序*的 JavaScript 代码的引用。事件处理程序“等待”某些“事件”——即用户完成的操作——此时计算机开始执行相应的
    JavaScript 指令。在这种情况下，当标志被点击时，JavaScript 事件处理程序将创建一个弹出窗口并将其添加到用户的显示屏上。因此，事件、事件处理程序和函数在很大程度上定义了如何使用
    JavaScript 为网页增添交互性。


    与 CSS 一样，JavaScript 可以直接放置在 HTML 文档的 `<head>` 元素中，也可以放在一个外部的 `.js` 文件中，并在 HTML
    文档中建立链接。


    #### 文档对象模型与动态 HTML


    如果你希望在用户点击 MyAppoly 标志并弹出窗口的同时，改变背景颜色，该怎么办？这稍微复杂一些，因为 JavaScript 不仅要创建弹出窗口，还要更改定义页面背景颜色的
    HTML/CSS 代码。这种静态 HTML 与 JavaScript 的*动态 HTML*（DHTML）组合是通过*文档对象模型*（DOM）实现的。*万维网联盟*（W3C）将
    DOM 定义为“一种平台与语言无关的接口，它允许程序和脚本动态访问和更新文档的内容、结构和样式”。DOM 本质上是将 HTML 页面上的所有元素定义为对象，根据元素的嵌套关系将它们放置在一个树状结构中，以便你轻松引用它们，并使页面上的每个元素都具有交互性。从理论上讲，你可以通过从树顶追溯到该元素的路径来引用文档中的任何元素。一旦定位到该元素，你就可以操作它来达到期望的效果。DOM
    为页面上的每个元素增添了交互性。


    ### Ajax


    Ajax 与 DHTML 类似，也是一种技术的融合。创建于 2005 年的*异步 JavaScript 与 XML*——简称 *Ajax*——结合了 CSS、HTML、DOM、XML
    和 `XMLHttpRequest`，允许网页在后台执行功能。让我们来分解一下。想象一下，MyAppoly 有一个供个人填写的表单，需要用户输入他们所在的州。大多数现代网站会在一个动态下拉菜单中为你建议几个选项，因此当你输入“M”时，以
    M 开头的州列表会自动出现在搜索框下方。当你输入“A”时，马萨诸塞州就会出现供你选择。如果没有 Ajax，另一种方式是这样的：每次你输入一个新字母，页面都会完全刷新，以便获取一份新的、可能有效的候选州列表。你每输入一个字母，页面就会获取该字母并用它在数据库中进行搜索。在找到所有满足该字母的州之后，页面会刷新以显示更新后的信息。假设页面刷新需要
    0.5 秒，用户就会对你的网站感到不耐烦和厌烦——这是一种糟糕的用户体验。


    那么 Ajax 是做什么的呢？Ajax 并没有用新内容刷新页面，而是将用户请求的数据从服务器传输到客户端。Ajax 使用 XML 来格式化这些数据，然后使用
    XHTML、CSS、DOM 和 JavaScript 来获取数据并仅更新网页中受影响的部分。关键点是所有这些操作都是异步完成的，这意味着用户并不知道它在后台进行。实际上，当
    Ajax 在后台从服务器获取最新信息时，用户可以继续与网页进行交互。Ajax 很复杂，通常难以使用，但许多工具包让 Ajax 的使用变得简单得多。


    Ajax 仅在现代浏览器中有效，因此这项技术也同样缺乏向后兼容性。

    '
- fmt: '# Portability and Accessibility


    There is no enforced standard for browser rendering, so all browsers render HTML
    and CSS slightly differently. What appears fine on `Safari` may look odd on `Internet
    Explorer`. What looks okay on the PC version of a browser might be unfit on a
    Mac. Due to changing technologies, what works on a version of `Chrome` today might
    not work on an outdated version. All of these observations mean that, as the developer,
    you are not reaching your entire audience in the same way. It is in your interest
    to either make sure your website looks beautiful on every display of every potential
    device—which is not realistic—or hope that web standards or some other solution
    comes along.


    ## Web Standards


    Imagine if every car company required a unique type of gas. It would be nearly
    impossible for gas stations to carry every type of gas a customer might need.
    Auto manufacturers realized from the outset that designing their vehicles to run
    on only a few industry-standard grades of gasoline was the optimal solution.


    Currently, the Internet is like a world without gasoline standards. A much better
    solution to the issues of accessibility and portability is through web standards
    for both coding and rendering. The `W3C` is “an international community where
    member organizations, a full-time staff, and the public work together to develop
    Web standards.” It produces and promotes not strict rules but rather suggested
    guidelines. Many note a convergence toward these recommendations recently, something
    that would be extremely beneficial for developers and users alike.


    Several validators exist to ensure that your web pages satisfy the guidelines
    of the `W3C`. Validation is beneficial because it helps to make sure your web
    page is most widely accessible, often improves display time, and might help with
    search optimization (discussed in Chapter [10](#321739_2_En_10_Chapter.xhtml)).


    ## Responsive Design


    What if you could spot which device people were using when they came to your site?
    If that were possible, you could then show them a special version of the site
    adjusted for their device. This technique is known as *responsive design*. Because
    it is possible to identify where a user is coming from and what device he or she
    is on, you can choose to display a certain `CSS` sheet or use different versions
    of the code that make the experience more optimal for the user. However, as you
    can imagine, covering all browser and device combinations is difficult.


    # Conclusion


    You now understand what is required conceptually to translate the paper version
    of `MyAppoly` into a working front end. At this point, you tell your CTO that
    you understand how users access a website, interact with your functionality, and
    which programming language processes users’ actions. But how does your back end
    remember and organize information, such as a user’s name or their list of friends?
    To answer that question, you need to understand databases, the subject of the
    next chapter.


    # 5. Databases: The Model


    The information that some companies collect is an asset in and of itself due to
    the value of data. Working for a startup that specialized in providing data to
    local businesses, I focused on collecting menus from local businesses, primarily
    restaurants. With a database of all food items and their prices sold at restaurants,
    I was able to learn some interesting facts! What is the average price of a pizza
    in San Francisco? Which restaurants within a five-mile radius of my hotel have
    kimchi on the menu? No problem. Collecting unique data might allow you to answer
    previously unanswerable questions.


    The last component of a “typical” application that you need to familiarize yourself
    with is the *database*, often called the *model*. Users of `MyAppoly` will need
    to enter their information in order to sign up for your service. You have to store
    their data somewhere. From usernames and passwords to the number of user logins,
    the amount of information that you will want to save will grow exponentially as
    your site becomes more and more successful. This chapter will prepare you to join
    your team’s discussion of what type of database to use and how to organize your
    data. While this chapter does not discuss how to add and update data in a database
    programmatically, it reviews how databases are typically structured and how they
    differ.


    ## Database Systems


    Most of us are familiar with some sort of record-keeping system. Some people store
    their receipts in preparation for paying taxes. Business owners might keep track
    of their sales and expenses to make sure they are hitting their targets. Physicians
    keep files on all of their patients, typically organized by last name. A database
    system is an electronic version of a filing cabinet, and “requests” are interactions
    with the cabinet, including adding, removing, updating, or retrieving a file,
    or *record*.


    Which type of data might you collect? Typically, you want to save data that will
    be of some value to you in the future. This is called *persistent data* because
    it is saved beyond a day or after a user logs off. Because the power of data and
    analysis unlocks efficiency, insights, and opportunities, databases are critical
    to all businesses today.


    ### The Four Components of Databases


    Databases consist of four components: data, hardware, software, and users.


    #### Data


    Data is the sine qua non of a database—the actual information saved in the database.
    In addition to the data, databases also store meta-information about the data
    and the database. For example, records are comprised of multiple pieces of information,
    so it is useful to know which part of the record corresponds to the username,
    as an example. This *metadata* is saved in the *catalog*—just in case you need
    to refresh your memory on what you are collecting and how it’s being stored.'
  raw: '## Portability and Accessibility


    There is no enforced standard for browser rendering, so all browsers render HTML
    and CSS slightly differently. What appears fine on Safari may look odd on Internet
    Explorer. What looks okay on the PC version of a browser might be unfit on a Mac.
    Due to changing technologies, what works on a version of Chrome today might not
    work on an outdated version. All of these observations mean that, as the developer,
    you are not reaching your entire audience in the same way. It is in your interest
    to either make sure your website looks beautiful on every display of every potential
    device—which is not realistic—or hope that web standards or some other solution
    comes along.


    ### Web Standards


    Imagine if every car company required a unique type of gas. It would be nearly
    impossible for gas stations to carry every type of gas a customer might need.
    Auto manufacturers realized from the outset that designing their vehicles to run
    on only a few industry-standard grades of gasoline was the optimal solution.


    Currently, the Internet is like a world without gasoline standards. A much better
    solution to the issues of accessibility and portability is through web standards
    for both coding and rendering. The W3C is “an international community where member
    organizations, a full-time staff, and the public work together to develop Web
    standards.” It produces and promotes not strict rules but rather suggested guidelines.
    Many note a convergence toward these recommendations recently, something that
    would be extremely beneficial for developers and users alike.


    Several validators exist to ensure that your web pages satisfy the guidelines
    of the W3C. Validation is beneficial because it helps to make sure your web page
    is most widely accessible, often improves display time, and might help with search
    optimization (discussed in Chapter [10](#321739_2_En_10_Chapter.xhtml)).


    ### Responsive Design


    What if you could spot which device people were using when they came to your site?
    If that were possible, you could then show them a special version of the site
    adjusted for their device. This technique is known as *responsive design* . Because
    it is possible to identify where a user is coming from and what device he or she
    is on, you can choose to display a certain CSS sheet or use different versions
    of the code that make the experience more optimal for the user. However, as you
    can imagine, covering all browser and device combinations is difficult.


    ## Conclusion


    You now understand what is required conceptually to translate the paper version
    of MyAppoly into a working front end. At this point, you tell your CTO that you
    understand how users access a website, interact with your functionality, and which
    programming language processes users’ actions. But how does your back end remember
    and organize information, such as a user’s name or their list of friends? To answer
