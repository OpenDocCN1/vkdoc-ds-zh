    \n***Listing 10-11.*** main.py, Streamlit file to be run\n\n**import** streamlit\
    \ as st\n\n**from** rating_stars **import** rating_stars\n\nst.title(\"Rating\
    \ stars demo!\")\n\ntotal_stars = st.slider(label=\"Total Stars\", min_value=0,\n\
    \nmax_value=20, value=10, step=1) selected_stars = rating_\n\nstars(total_stars)\n\
    \nst.write(**str**(selected_stars) + \" star(s) have been selected\")\n\n***Figure\
    \ 10-5.** Result of communicating back and forth with a custom*\n\n*Streamlit\
    \ component*\n\nChapter 10 Building Streamlit ComponentS\n\n**10.3 Publishing\
    \ Components**\n\n**As Pip Packages**\n\nOnce you finally make your first custom\
    \ component, you will want to share\n\nit with your friends or dedicate it to\
    \ the open source developer community\n\nlike many do. Sending a zip file of the\
    \ source code or uploading the\n\ncomponent to a version control service like\
    \ GitHub might not be a scalable\n\noption to reach unlimited number of developers\
    \ with ease, as this adds\n\nmore overhead for them to get it running.\n\nA more\
    \ developer-friendly yet professional approach to share Python\n\npackages specifically\
    \ is to compress them in a pip wheel format, which\n\nthen can be easily installed\
    \ in the interpreter by running\n\npip install <PIP_PACKAGE_NAME>.whl\n\nFollowing\
    \ up with the continuous example in this chapter, we don’t\n\nneed to install\
    \ any new package to make this possible as Python supports\n\nwheel building out\
    \ of the box. The goal is to package the rating_stars/\n\nfolder in a file which\
    \ then can be installed and referenced from any script\n\nlike it is a local package.\n\
    \nBuilding a pip file is as simple as running the following command:\n\npython\
    \ setup.py sdist bdist_wheel\n\nBefore making the pip wheel, make sure to build\
    \ the ReactJS part\n\nof the custom component, as it will not be run live on the\
    \ user end;\n\nrather, it should be a seamless plug-and-play experience using\
    \ that new\n\ncomponent. After navigating to the rating_stars/frontend/, run\n\
    \nnpm run build\n\nHowever, the wheel builder needs more information about the\
    \ exact\n\nfolder to package and other miscellaneous metadata such as version\n\
    \nnumber and description. No need to mention the folder to be packaged,\n\nChapter\
    \ 10 Building Streamlit ComponentS\n\nas Python looks for all “Python Packages”\
    \ in the current folder, and for a\n\nfolder to be considered as a Python package,\
    \ it needs to have an __init__.\n\npy file, which we already have. However, by\
    \ default the wheel builder\n\ndoesn’t include non-Python files and folders if\
    \ they don’t have a single\n\nPython file. This is an issue in our case as our\
    \ component relies on the\n\nReactJS build folder which contains all static web\
    \ files necessary for it to\n\nrun. To overcome this issue, a new file as shown\
    \ in Listing [10-12 ne](#index_split_002.html#p298)eds to be added in the project’s\
    \ root folder with its content to force inclusion of\n\nthe build folder and its\
    \ content.\n\n***Listing 10-12.*** MANIFEST.in\n\nrecursive-include rating_stars/frontend/build\
    \ *\n\nAs we now have half of the requirements to make a pip wheel, we\n\ncan\
    \ tackle the final part by making a file called setup.py with the content\n\n\
    shown in Listing [10-13 in the s](#index_split_002.html#p298)ame folder as the\
    \ MANIFEST.in. The setup file can include the version number of your custom component,\n\
    \ndescription, and other information such as its pip download name if\n\nuploaded\
    \ t[o pypi.org](http://pypi.org).\n\n***Listing 10-13.*** [setup.py](http://setup.py)\n\
    \n**import** setuptools\n\nsetuptools.setup(\n\nname=\"rating_stars\",\n\nversion=\"\
    0.1\",\n\nauthor=\"YOUR-NAME\",\n\nauthor_email=\"YOU-EMAIL@DOMAIN.com\",\n\n\
    description=\"INSERT-DESCRIPTION-HERE\",\n\nlong_description=\"INSERT-LONGER-DESCRIPTION-HERE\"\
    ,\n\npackages=setuptools.find_packages(),\n\ninclude_package_data=True,\n\nChapter\
    \ 10 Building Streamlit ComponentS\n\nclassifiers=[\n\n\"Programming Language\
    \ :: Python :: 3\",\n\n\"License :: OSI Approved :: MIT License\",\n\n\"Operating\
    \ System :: OS Independent\",\n\n],\n\nkeywords=['Python', 'Streamlit', 'React',\
    \ 'JavaScript',\n\n'Custom'],\n\npython_requires=\">=3.6\",\n\ninstall_requires=[\n\
    \n\"streamlit >= 0.86\",\n\n],\n\n)\n\nAfter finally running the Python package\
    \ command, we can find three\n\nnew folders appearing in the project’s root folder\
    \ as seen in Figur[e 10-6.](#index_split_002.html#p300)\n\nWe are interested in\
    \ the rating_stars-0.1-py3-none-any.whl file in the\n\nsecond folder; this file\
    \ can be sent to anyone and installed easily as long as\n\nthe package requirements\
    \ are met.\n\nOther created folders can have some benefits as well. For instance,\n\
    \nthe dist/ folder can be used by twine, which is the package and tool used\n\n\
    to upload pip wheels to the global pip repository. If interested in sharing\n\n\
    your package with the general public, sign up to pypi.org and then run the\n\n\
    following command:\n\npython -m twine upload dist/* --verbose\n\nafter building\
