    \n**7.2 Introducing Session IDs**\n\nSession IDs are unique identifiers of a new\
    \ connection to Streamlit’s HTML\n\nserving WebSocket. A new WebSocket connection\
    \ is established if a new\n\nbrowser page is opened even if another connection\
    \ is established. But both\n\nare treated independently by the server. These WebSocket\
    \ connections are\n\nused to transfer data from the server to the client’s browser\
    \ and vice versa.\n\nThose unique identifiers can be used to provide the end user\
    \ with a\n\npersonalized experience. And to do so, the server needs to map users’\n\
    \nprogress and updates to their corresponding identifiers. This mapping\n\ncan\
    \ be done natively in an effortless way using Streamlit’s native API. In\n\nListin[g\
    \ 7-4, w](#index_split_001.html#p207)e show how to get the current session’s ID\
    \ or all the active session IDs, with the output shown in Figure [7-3](#index_split_001.html#p208),\
    \ which shows two web pages both at *http://localhost:8501/*.\n\n***Listing 7-4.***\
