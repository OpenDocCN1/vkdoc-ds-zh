    \n**Requests**\n\nOnce an application scales or when one of its initial requirements\
    \ is to do\n\nheavy multiple independent computations of processes, a lot of power\
    \ is\n\nwasted whether on the backend’s Flask side or Streamlit’s side. This is\
    \ due\n\nto not harnessing the power of the CPUs which gets even stronger over\n\
    \ntime. Modern CPU strength is not due to them being quicker with faster\n\nclock\
    \ cycles, but with the more cores it packs. Streamlit and Flask are\n\nChapter\
    \ 6 Leveraging BaCkend ServerS\n\nsingle-threaded, single-processed applications\
    \ by default. And to speed\n\nthem up, we can try either or both of *multiprocessing*\
    \ and *multithreading*, which introduces true parallelization to our application.\
    \ The usage of\n\nboth approaches shall be controlled by the developer to run\
    \ a function a\n\nmultiple number of times which then will be executed in parallel\
    \ by the\n\nCPU. An example of using both techniques in Streamlit is Listin[g\
    \ 6-7.](#index_split_001.html#p195)\n\n***Listing 6-7.*** streamlit_main.py\n\n\
    **import** streamlit as st\n\n**from** multiprocessing **import** Pool, cpu_count\n\
    \n**import** threading\n\n**import** time\n\n**def** func(iterations, **id**):\n\
    \ni = 0\n\n**for** i **in range**(iterations):\n\ni += 1\n\n**print**(\"Finished\
    \ job id =\", **id**)\n\n**if** __name__ == \"__main__\":\n\npool = Pool(cpu_count())\n\
    \nst.title(\"Speed You Code!\")\n\njobs_count = 5\n\niterations = 10 ** 3\n\n\
    c1, c2 = st.columns(2)\n\nwith c1:\n\n**if** st.button(\"multiprocess\"):\n\n\
    inputs = [(iterations, i) **for** i **in**\n\n**range**(jobs_count)]\n\nt11 =\
    \ time.time()\n\npool.starmap(func, inputs)\n\n![](index-196_1.png)\n\nChapter\
    \ 6 Leveraging BaCkend ServerS\n\nt21 = time.time()\n\nst.write(f\"Finished after\
    \ {t21 - t11} seconds\")\n\nwith c2:\n\n**if** st.button(\"multithread\"):\n\n\
    threads = [threading.Thread(target=func,\n\nargs=(iterations, i)) **for** i **in\
    \ range**(10)]\n\nt12 = time.time()\n\n**for** thread **in** threads:\n\nthread.start()\n\
    \n**for** thread **in** threads:\n\nthread.join()\n\nt22 = time.time()\n\nst.write(f\"\
    Finished after {t22 - t12} seconds\")\n\n***Figure 6-5.** Output of Listin[g 6-7](#index_split_001.html#p195)*\n\
    \nNotice that in Listin[g 6-7, the fir](#index_split_001.html#p195)st code to\
    \ be executed is after line 13\n\nwhich is required for the whole example to work\
    \ error-free due to Streamlit\n\nknowing that this code block shall be executed\
    \ only once, which means\n\nthe processing pool won’t be initialized again in\
    \ reruns. Similar precaution\n\nshall be taken even in Flask applications.\n\n\
    The main difference between multiprocessing and multithreading\n\nis that multithreading\
    \ reuses the already existing memory space and\n\nspawns new threads within the\
    \ same process, which is a faster operation\n\nthan spawning totally new processes\
    \ which adds an overhead of CPU\n\ncontext switching. Moreover, every new process\
    \ in the multiprocessing\n\n![](index-197_1.png)\n\nChapter 6 Leveraging BaCkend\
    \ ServerS\n\npool requires an entirely new memory space. In addition, each\n\n\
    processes' inputs need to be copied or cloned, thereby introducing a\n\nmemory-greedy\
    \ application. It may seem that multithreading is the better\n\noption, however,\
    \ that is not true due to the fact that multiprocessing is\n\nmore CPU efficient\
    \ when executing hefty tasks as the CPU scheduler\n\nallocates more time to those\
    \ processes. Figur[e 6-6 sho](#index_split_001.html#p197)ws the correlation between\
    \ execution time and the job iteration count in 10xˆ from\n\nListin[g 6-7.](#index_split_001.html#p195)\n\
    \nMultiprocessing\n\nMultithreading\n\n)\n\nds\n\n(secon\n\nExecution time\n\n\
    Iterations 10x\n\n***Figure 6-6.** Multiprocessing vs. multithreading for five\
