    \nxiv\n\n**About the Technical Reviewers**\n\n**Rosario Moscato** has a master’s\
    \ degree in Electronic Engineering\n\n(Federico II University, Naples) as well\
    \ as a master’s degree in Internet\n\nSoftware Design (CEFRIEL, Milan). He also\
    \ has a Diploma in Apologetics\n\n(Pontifical Athenaeum Regina Apostolorum, Rome)\
    \ and a master’s\n\ndegree in Science and Faith (Pontifical Athenaeum Regina Apostolorum,\n\
    \nRome). Rosario has gained over 20 years of experience, always\n\nfocusing his\
    \ attention on the development and fine-tuning of the most\n\ninnovative technologies\
    \ in various international companies in Europe\n\nand Asia, covering various highly\
    \ technical, commercial, and business\n\ndevelopment roles.\n\nIn recent years,\
    \ his interest has focused exclusively on artificial\n\nintelligence and data\
    \ science, pursuing, on one hand, the goal of\n\nenhancing and making every business\
    \ extremely competitive by\n\nintroducing and supporting machine and deep learning\
    \ technologies\n\nand on the other hand, analyzing the ethical-philosophical implications\n\
    \nderiving from the new scenarios that these disciplines open up.\n\nRosario has\
    \ authored two books, and he is a speaker at international\n\nresearch centers\
    \ and conferences as well as a trainer and technical/\n\nscientific consultant\
    \ on the huge and changing world of AI.\n\nCurrently, he is working as Senior\
    \ Data Scientist with one of the biggest\n\nmultinational IT companies in the\
    \ world.\n\n**Randy Zwitch** is a data science and analytics professional with\
    \ broad\n\nindustry experience in big data and data science. He is also an open\n\
    \nsource contributor in the R, Python, and Julia programming language\n\ncommunities.\n\
    \nxv\n\n**Acknowledgments**\n\nThis undertaking would not have been possible without\
    \ the support and\n\nefforts of a selfless few. Individuals and entities who in\
    \ one way or another\n\nhave made a contribution to the contents of this book\
    \ are named as follows\n\nin no particular order:\n\n• *Streamlit*: The folks\
    \ who created the framework itself,\n\nempowering countless developers\n\n• *Iberdrola*:\
    \ Which provided the inspiration and time for\n\nus to put Streamlit to a very\
    \ noble use\n\n• *Iberdrola Innovation Middle East*: The folks who served\n\n\
    as a test bed for our very first Streamlit ventures and\n\nhad to put up with\
    \ our constant pitching of Streamlit’s\n\nformidability\n\n• *Qatar Science &\
    \ Technology Park*: Which has fostered\n\nan environment conducive to innovation\
    \ and research\n\n• *Daniel Paredes, Jerome Dumont, Ana Martos, and*\n\n*Gustavo\
    \ López-Luzzatti*: For being our very first\n\nStreamlit users\n\n• *Dr. Nikhil\
    \ Navkar*: For being another trailblazing\n\nStreamlit user\n\nIn addition, a\
    \ tangible part of our careers and personal endeavors\n\nwould have simply been\
    \ inconceivable without the spirit of the open\n\nsource community. It is therefore\
    \ in order to give a special tribute to\n\nPython and its respective developers,\
    \ in addition to the multitude of other\n\nonline forums who are silent heroes.\
    \ Without their efforts, all-nighters\n\nwould be every other night and our works\
    \ not nearly as neat as they are.\n\nxvii\n\n**Preface**\n\nIt was an inconspicuous\
    \ night like any other. I was about to doze off, but\n\nright before that happened,\
    \ my phone buzzed, and being a millennial,\n\nI just could not resist the temptation\
    \ to check. However, much to my\n\ndisdain, it was just another pesky email advertisement\
    \ recommending an\n\nonline course in something called “Streamlit.” I am a strong\
    \ disbeliever in\n\nemail lists, and, honestly, I would have investigated no further\
    \ had it not\n\nbeen for the aesthetically pleasing Streamlit logo. In retrospect,\
    \ I am glad I\n\nclicked on the ad. Since then, my programming life has one way\
    \ or another\n\nbeen intertwined with a framework that I had been yearning for\
    \ someone\n\nto create for years – the formidable Streamlit.\n\nI noticed early\
    \ on in my career that there is a plethora of seasoned\n\nPython developers that\
    \ are adept with backend and server-side\n\nprogramming but cannot develop frontend\
    \ user interfaces and client-\n\nside software to save their lives, myself included.\
    \ While there were noble\n\nefforts made by the teams in Flask and Django, both\
    \ frameworks solicit\n\nan abundance of exposure and technical know-how of HTML,\
    \ CSS, and\n\nHTTP, which effectively rendered them as no-fly zones. I found myself\n\
    \nmaking do with the likes of Tkinter and PyQt, thereby limiting myself to\n\n\
    local desktop software with no means of deploying my work to the cloud.\n\nThis\
    \ is the predicament that I and a multitude of other programmers faced.\n\nWhat\
    \ all of us Python loyalists needed was a pure Python web framework\n\nwith an\
    \ intuitive API that enabled the prompt creation and deployment of\n\nweb applications\
    \ while allowing the developer to focus on the backend.\n\nSimilar perhaps to\
    \ what ReactJS is to JavaScript. And when I clicked on\n\nthat pesky ad mentioned\
    \ earlier, that is exactly what I found. It was a sort of eureka moment!\n\nxix\n\
    \nPrefaCe\n\nMind you, this anecdote of mine occurred in the summer of 2020, and\n\
    \nStreamlit had only been released to the public in the fall of 2019. But less\n\
    \nthan a year of development by their team had rendered exactly the sort of\n\n\
    framework and API that I had hoped for. And ever since then, this product has\n\
    \nonly been moving in one direction – upward, with a steep incline. For myself\n\
    \npersonally, I could not have discovered it at a more auspicious time. I had\
    \ just been hired by Iberdrola and tasked with the audacious goal of creating\
    \ and\n\ndeploying a Python-based application to the Web. In a pre-Streamlit world,\
    \ I\n\nwould have fervently resisted the notion of deploying applications to the\
    \ Web,\n\nbut armed with my new friend, I found myself routinely advocating for\
    \ the\n\ndevelopment of web applications while passionately brandishing Streamlit’s\n\
    \nuntethering capabilities. Overnight, I had been transformed into a trailblazing\
    \ member of sorts within our development team.\n\nWith all good things in the\
    \ world, it just does not feel right to proceed\n\nwithout sharing the goodness\
    \ with the world at large. Consequently, I\n\nhave made it a subtle goal in life\
    \ to inform the online and offline software\n\ndevelopment community of the empowerment\
    \ that Streamlit ushers in. This\n\nbook is the culmination of that effort, and\
    \ more specifically it is intended\n\nfor those who have faced the same hurdles\
    \ as I have, and it will provide a\n\nholistic overview of Streamlit. This book\
    \ will guide the reader through the life cycle of creating scalable web applications\
    \ of their own, from the most basic\n\nuse cases to crafting complex and distributed\
    \ applications on the cloud.\n\nIn addition to learning all the ins and outs of\
    \ Streamlit itself, after\n\nperusing this book, readers should be able to interface\
    \ their web\n\napplications with robust server-side infrastructure like MongoDB,\n\
    \nPostgreSQL, Linux, Windows Server, and Streamlit’s own deployment\n\nplatform.\
    \ In a nutshell, you should be able to walk away from this book\n\nfeeling empowered\
    \ enough to unleash your ideas and to embody them on\n\nthe Internet. Perhaps\
    \ this could be the beginning of your next startup for\n\nthe curious inner entrepreneur\
    \ in you.\n\nMohammad Khorasani\n\nSeptember 2021\n\nxx\n\n**Acronyms**\n\naaS\
    \ As a service\n\nAPI Application programming interface\n\nBLOB Binary large object\n\
    \nCLI Command-line interface\n\nCPU Central processing unit\n\nCRUD Create, read,\
    \ update, and delete\n\nCSP Cloud service provider\n\nCSRF Cross-site request\
