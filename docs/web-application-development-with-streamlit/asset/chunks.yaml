    \n**if** st.button('Search'):\n\n**if** address != \":\n\nst.write(query(cuisine,address))\n\
    \n**else**:\n\nst.warning('Please enter an address')\n\n***Figure 5-18.** Output\
    \ of Listing [5-4](#index_split_001.html#p180)*\n\nChapter 5 Database IntegratIon\n\
    \n**5.3 Summary**\n\nIn this chapter, we covered relational and nonrelational\
    \ databases that are\n\nused to store and retrieve structured and unstructured\
    \ data, respectively.\n\nSpecifically, we learned how to provision a PostgreSQL\
    \ database and\n\ninterface it with a Streamlit application to host and process\
    \ our structured\n\ndatasets. Similarly, we learned how to provision a MongoDB\
    \ cloud\n\ndatabase to store unstructured data consisting of collections of documents\n\
    \nwith varying schemas, objects, and elements. We saw how MongoDB can\n\nbe used\
    \ to create a full-text index where every token in each document\n\nis indexed\
    \ for enhanced querying, and we demonstrated how to perform\n\nfuzzy matching\
    \ of query terms with document tokens, thereby mitigating\n\nthe effects of typos.\
    \ Finally, we witnessed how to wrap all of these\n\noperations from establishing\
    \ a database client to writing an aggregation\n\npipeline and to postprocessing\
    \ queried results within a Streamlit\n\napplication.\n\n**CHAPTER 6**\n\n**Leveraging\
    \ Backend**\n\n**Servers**\n\nIn this chapter, we will introduce a more sophisticated\
    \ and scalable way\n\nof designing web applications. Specifically, this chapter\
    \ will present the\n\nprocess to offload the overhead associated with managing\
    \ databases\n\nfrom the Streamlit server and onto an independent backend server\
    \ as it\n\nshould be in a full-stack environment. To that end, this chapter will\
    \ walk\n\nthe developer through the entire process of provisioning a backend server\n\
    \nin Python that acts as the middleman between the database and the\n\nfrontend.\
    \ And finally, the developer will be acquainted with the workings\n\nof a highly\
    \ modular, versatile, and secure architecture with additional\n\nsecurity layers\
    \ between the application and database.\n\n**6.1 The Need for Backend Servers**\n\
    \nAs part of building a scalable and robust Streamlit application, some of\n\n\
    the tasks which are executed within the Streamlit application, are better\n\n\
    off being executed in an isolated system that is easy to communicate with.\n\n\
    Such environment is referred to as a backend, and it is responsible for\n\nmanaging\
    \ authentication, authorization, databases, and other gateway\n\nconnections –\
    \ all while including managing core business logic which\n\nshouldn’t be done\
    \ on the frontend side, that is, Streamlit. Even though\n\n© Mohammad Khorasani,\
    \ Mohamed Abdou, Javier Hernández Fernández 2022\n\nM. Khorasani et al., *Web\
    \ Application Development with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6_6](https://doi.org/10.1007/978-1-4842-8111-6_6#DOI)\n\
    \nChapter 6 Leveraging BaCkend ServerS\n\nStreamlit is a server-side web framework,\
    \ it’s highly recommended to\n\nstill isolate from other system aspects for modularity\
    \ as security. As if\n\neverything from authentication to database management\
    \ were run from\n\nStreamlit, this can possess multiple security threats, from\
    \ XSS to SSRF and\n\npossibly RCE if not engineered correctly.\n\nNot claiming\
    \ that a backend-frontend architecture is invulnerable, but\n\nhaving this architecture\
    \ adds another layer of protection which is made\n\nwith the API. That needs to\
    \ be broken or bypassed by malicious actors to\n\nreach other protected system\
    \ aspects. And with modern API designing\n\nmethodologies, it is attack proof,\
    \ as it pipelines every request through\n\nthe same routing mechanism which decreases\
    \ human error in making a\n\nvulnerable code.\n\n**6.2 Frontend-Backend Communication**\n\
    \nThe backend is usually referred to as the server, and the frontend is\n\nalways\
    \ known to be the client. Usually, the client triggers a resource or\n\ninformation\
    \ request upon the user’s actions. The request is eventually\n\nfollowed by a\
    \ response by the server including the solicited data. The\n\nrequest-response\
    \ communication is how HTTP protocol works. HTTP\n\ngenerally has two major components,\
    \ headers and a body.\n\nThe request or response headers include information about\
    \ the\n\nrequest itself and payload carried in the body. Some of these information\n\
    \ninclude, but are not limited to, cookies, request identifiers, keys, tokens,\n\
    \ndata type of the body, host or IP address of the server, and data encoding or\n\
    \ncompressing mechanisms. For the sake of this book’s scope, we will focus\n\n\
    on the general aspects of keys, tokens, cookies, and the body’s content\n\ntype.\
    \ For instance, request body types can be as shown in Ta[ble 6-1](#index_split_001.html#p186).\
    \ Since backends are mainly responsible for sending and receiving information,\
    \ a\n\ngood and the most widely used format is JSON.\n\nChapter 6 Leveraging BaCkend\
    \ ServerS\n\n***Table 6-1.** Common content-type header values*\n\n**Content-Type**\n\
    \n**Description**\n\n**Value**\n\ntext/htML\n\ntext format but is parseable to\
    \ htML to be rendered as a web\n\npage\n\napplication/JSOn\n\nJSOn format\n\n\
    application/xml\n\nXML format\n\nimage/png\n\nimage binary of type png\n\n**6.2.1\
    \ HTTP Methods**\n\nAnd finally, the last general thing to know about HTTP requests\
    \ is that\n\nthey have methods, like what has been discussed previously in Section\n\
    \n5.1\\. But unlike SQL, the syntax of HTTP methods doesn’t require a drastic\n\
    \nchange in the request’s syntax. The main methods are *GET*, *POST*, *PUT*, and\
    \ *DELETE*, which reference getting, adding, modifying, and deleting a\n\nresource,\
    \ respectively. Adding and modifying resources can have a body\n\nto alter the\
    \ resource upon, but not the deleting and getting as the resource\n\nidentifiers\
    \ for them are mostly included in the request URL. Those are\n\nthe main functions\
    \ of a RESTful API which is, in a nutshell, an HTTP API\n\ngateway to modify resources\
    \ or data on the server side.\n\nVisiting a website is simply a *GET* request\
    \ to that URL. Hence, it should have request-specific data in its header, body,\
    \ and response code. For\n\ninstance, requesting a page with just its domain name\
    \ will request its\n\nHTTP version by default, but the backend server can propose\
    \ a redirection\n\nto the HTTPS version. An example for that is Google, where\
    \ if you go to\n\n[google.com it w](http://google.com)ill redirect t[o https://google.com;\
    \ y](https://google.com)ou can check this by inspecting the page’s network traffic\
    \ or by using Curl. Curl is a tool made\n\nto make HTTP requests from the terminal\
    \ or CMD. It allows you to check\n\n![](index-187_1.jpg)\n\nChapter 6 Leveraging\
    \ BaCkend ServerS\n\nout the response body, headers, and status code. It can also\
    \ give support\n\nto understanding some of the backend server’s commands to the\
    \ frontend,\n\nsuch as following a redirect. Figure [6-1 sho](#index_split_001.html#p187)ws\
    \ the possibility to do the mentioned actions in the CMD by running curl -i -L\
    \ google.com; -i is\n\nused to display response headers and -L to follow redirects\
    \ if any.\n\n***Figure 6-1.** Gettin[g google.com](http://google.com)* *and watching\
    \ response headers and* *redirection*\n\n**6.3 Working with JSON Files**\n\nJSON\
    \ documents can be used to represent and parse data with. Essentially,\n\nthey\
    \ can contain a list/array or a key/value pair similar to dictionaries in\n\n\
    Python. They can also include other primitive data types such as integers,\n\n\
    floats, strings, and boolean. With such simple data types, a complex\n\nstructural\
    \ representation of any data can be represented. A sample JSON\n\nrepresenting\
    \ one of the previously introduced examples is as shown in\n\nListin[g 6-1.](#index_split_001.html#p188)\n\
    \nChapter 6 Leveraging BaCkend ServerS\n\n***Listing 6-1.*** sample_json.json\n\
    \n[\n\n{\n\n\"Name\": \"Adam\",\n\n\"DOB\": \"01/01/1990\",\n\n\"Paygrade ID\"\
    : \"2\"\n\n},\n\n{\n\n\"Name\": \"Sara\",\n\n\"DOB\": \"01/01/1980\",\n\n\"Paygrade\
    \ ID\": \"1\"\n\n},\n\n{\n\n\"Name\": \"Bob\",\n\n\"DOB\": \"01/01/1970\",\n\n\
    \"Paygrade ID\": \"1\"\n\n},\n\n{\n\n\"Name\": \"Alice\",\n\n\"DOB\": \"01/01/2000\"\
    ,\n\n\"Paygrade ID\": \"3\"\n\n}\n\n]\n\n**6.4 Provisioning a Backend Server**\n\
    \nTo stick with the Python theme of the book, we will build a Pythonic\n\nbackend\
    \ server. Looking to the potential options for such requirements,\n\nwe can mainly\
    \ find Flask and Django good for the job. Both can be used\n\nas frontend application\
    \ servers as both can serve HTML for browsers to\n\nChapter 6 Leveraging BaCkend\
    \ ServerS\n\nrender, but Django is built with that task in mind due to the presence\
    \ of a\n\nweb template engine called *Jinja*. But Flask is flexible and configurable\
    \ to the developer’s need, plus it being lighter in weight. To get started, install\
    \ it with Pip.\n\n**6.4.1 API Building**\n\nA backend will run a single or multiple\
    \ methods or functions upon a\n\nrequest to the server. Those methods and functions\
    \ depend on the URL\n\nand can be configured to also take the headers in consideration.\
    \ A simple\n\nexample for that is like Listin[g 6-2, whic](#index_split_001.html#p189)h\
    \ will serve the user the page in Figur[e 6-2 if](#index_split_001.html#p190)\
    \ *http://<SERVER-HOST>/server_status* was requested, and *404*\n\n*Not Found*\
    \ otherwise.\n\n***Listing 6-2.*** flask_sample.py\n\n**from** flask **import**\
    \ Flask\n\napp = Flask(__name__)\n\n@app.route('/server_status')\n\n**def** welcome_controller():\n\
    \n**return** {\n\n\"message\": \"Welcome to your Flask Server\",\n\n\"status\"\
    : \"up\",\n\n\"random\": 1 + 1\n\n}\n\napp.run()\n\n![](index-190_1.png)\n\nChapter\
    \ 6 Leveraging BaCkend ServerS\n\n***Figure 6-2.** Page returned when the /server_status\
    \ route is requested* *for the server with Listing [6-2](#index_split_001.html#p189)*\n\
    \nTo trigger a specific function call when a route is requested, a function\n\n\
    decorator needs to be added before it with the route name. It is not\n\nnecessary\
    \ to have static routes, they can also be dynamic, by specifying a\n\nspecific\
    \ string format which will be mapped by Flask to that function. For\n\ninstance,\
    \ */text/1* and */text/3* map to */text/<id>* . Calling a specific method depending\
    \ on the HTTP method can also be configured through the same\n\nfunction decorator\
    \ by adding an extra parameter as follows:\n\n@app.route('/text/<id>', methods=['GET',\
    \ 'PUT'])\n\nFollowing up with the Employee and Pay Grade example from before,\n\
    \nwe will reuse the same database for this example but using *SQLAlchemy*\n\n\
    instead of *psycopg2*, to make use of the ***ORM*** which represents SQL\n\ncommands\
    \ with Python class objects. To start, we would first need to\n\nrepresent our\
    \ tables as classes and a Base class which the other two\n\nclasses will inherit\
    \ SQL properties from. These properties include\n\nparameterization of SQL queries\
    \ which prevent SQLI. The classes in\n\nListings [6-4 and 6-5](#index_split_001.html#p191)\
    \ shall point to already existing tables in the database, and the *_tablename_*\
    \ property shall be the table name.\n\nChapter 6 Leveraging BaCkend ServerS\n\n\
    ***Listing 6-3.*** Base.py\n\n**from** sqlalchemy.ext.declarative **import** declarative_base\n\
    \nBase = declarative_base()\n\n***Listing 6-4.*** PayGrades.py\n\n**from** sqlalchemy\
    \ **import** Column, Integer, String\n\n**from** .Base **import** Base\n\n**class**\
    \ PayGrades(Base):\n\n__tablename__ = 'paygrades'\n\n**id** = Column(Integer,\
    \ primary_key=True)\n\nbase_salary = Column(String)\n\nreimbursement = Column(String,\
    \ default=True)\n\nbonuses = Column(String)\n\n**def** to_dict(self):\n\n**return**\
    \ {\n\n\"id\": self. **id**,\n\n\"base_salary\": self.base_salary,\n\n\"reimbursement\"\
    : self.reimbursement,\n\n\"bonuses\": self.bonuses\n\n}\n\n***Listing 6-5.***\
    \ Employees.py\n\n**from** sqlalchemy **import** Column, Integer, String\n\n**from**\
    \ .Base **import** Base\n\n**class** Employees(Base):\n\n__tablename__ = 'persons'\n\
    \n**id** = Column(Integer, primary_key=True)\n\nChapter 6 Leveraging BaCkend ServerS\n\
    \nname = Column(String)\n\ndate_of_birth = Column(String, default=True)\n\npaygrade_id\
    \ = Column(Integer, unique=True, index=True)\n\n**def** to_dict(self):\n\n**return**\
    \ {\n\n\"id\": self. **id**,\n\n\"name\": self.name,\n\n\"date_of_birth\": self.date_of_birth,\n\
    \n\"paygrade_id\": self.paygrade_id\n\n}\n\nSubsequently we can support adding\
    \ and getting employee data over\n\nHTTP requests using Flask as shown in Listing\
    \ [6-6](#index_split_001.html#p192). This backend server includes two routes,\
    \ the first is to query all employees using the database\n\nconnection made with\
    \ SQLAlchemy, and the second is to insert or add a\n\nnew employee to the employees\
    \ table with the user-supplied properties\n\nsent in the HTTP body as a JSON document.\n\
    \n***Listing 6-6.*** main.py\n\n**from** flask **import** Flask, request\n\n**from**\
    \ DataBase **import** Connection\n\n**from** DataBase **import** Employees\n\n\
    app = Flask(__name__)\n\n@app.route('/employees')\n\n**def** get_all_employees():\n\
