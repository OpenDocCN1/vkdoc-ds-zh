    \ 343\n\nChapter 11 Streamlit USe CaSeS\n\n**11.3.2 Advanced Application Development:**\n\
    \n**Machine Learning As a Service**\n\nThe final use case for this chapter will\
    \ be of a *machine learning as a*\n\n*service*, otherwise known as the MLaaS application.\
    \ This example will bind together many of the key concepts covered in this book.\
    \ Specifically, it\n\nwill provide an overview of how to interface and couple\
    \ concepts such as\n\ndatabases, caching, session state, user authentication,\
    \ traffic insights, data\n\nvisualization, subpages, modularity, and many other\
    \ features together to\n\nrender an advanced and production-ready web application\
    \ in Streamlit.\n\nBefore we proceed any further, it is necessary to mention what\
    \ this\n\napplication actually performs. Put simply, it will enable the user to\
    \ train\n\na logistic regression model on an uploaded dataset and subsequently\n\
    \nuse the model to classify a test dataset. While the utility appears to be\n\n\
    rather trivial, the implementation and features will put to use many of\n\nthe\
    \ capabilities that Streamlit, PostgreSQL, Pandas, Plotly, and other\n\nstacks\
    \ have to offer. Indeed, this use case is highly scalable and has been\n\nexpanded\
    \ to cover other classifiers including decision tree, support vector\n\nmachine,\
    \ Naive Bayes, and K-nearest neighbors in [*https://dummylearn.*](https://dummylearn.herokuapp.com)\n\
    \n[*herokuapp.com/*.](https://dummylearn.herokuapp.com)\n\n**User Authentication\
    \ Without a Backend Server**\n\nWhile in Chapter [8 w](https://doi.org/10.1007/978-1-4842-8111-6_8)e\
    \ covered implementing user authentication with a backend server, there is in\
    \ fact a way to implement authentication without\n\none. With the Streamlit component\
    \ *Streamlit-Authenticator*, you can create a lighter authentication service locally\
    \ without a server, analogous perhaps\n\nto what SQLite is to SQL Server.\n\n\
    Using Streamlit-Authenticator, you initially need to hash your users’\n\npasswords\
    \ using the *stauth.Hasher* command and then provide the\n\nsecure hashed passwords\
    \ to the *stauth.Authenticate* object as shown\n\nin Listing [11-11\\. Aft](#index_split_002.html#p366)erward,\
    \ remove ALL references to the plain text 344\n\nChapter 11 Streamlit USe CaSeS\n\
    \npasswords in your source code. Each time the user enters their plain\n\ntext\
    \ password (Figure [11-13), it is h](#index_split_002.html#p367)ashed and compared\
    \ to the hashed password you previously provided, in order to authenticate the\
    \ user. In\n\naddition, you can enable passwordless reauthentication by using\
    \ the\n\n*cookie_expiry_days* argument in the *stauth.Authenticate* command to\
    \ save a secure JWT on the user’s browser to reauthenticate them for the specified\n\
    \nnumber of days before it expires. Subsequently, you may determine a\n\nuser’s\
    \ authentication status at any stage of your application by accessing\n\nthe session\
    \ state *st.session_state[’authentication_status’]*.\n\n***Listing 11-11.*** Streamlit-Authenticator.py\n\
    \n**import** streamlit as st\n\n**import** streamlit_authenticator as stauth\n\
    \nnames = ['John Smith','Rebecca Briggs']\n\nusernames = ['jsmith','rbriggs']\n\
    \npasswords = ['123','456']\n\nhashed_passwords = stauth.Hasher(passwords).generate()\n\
    \nauthenticator = stauth.Authenticate(names,usernames,hashed_\n\npasswords, 'some_cookie_name','some_signature_key',\n\
    \ncookie_expiry_days=30)\n\nname, authentication_status, username = authenticator.\n\
    \nlogin('Login','main')\n\n**if** st.session_state['authentication_status']:\n\
    \nauthenticator.logout('Logout', 'main')\n\nst.write(f'Welcome *{st.session_state[\"\
    name\"]}*')\n\nst.title('Some content')\n\n**elif** st.session_state['authentication_status']\
    \ == False:\n\n![](index-367_1.png)\n\nChapter 11 Streamlit USe CaSeS\n\nst.error('Username/password\
    \ is incorrect')\n\n**elif** st.session_state['authentication_status'] == None:\n\
    \nst.warning('Please enter your username and password')\n\n***Figure 11-13.**\
    \ Output of Listin[g 11-11](#index_split_002.html#p366)*\n\n**Utilities Script**\n\
    \nIt is a good practice to modularize application development, by relocating\n\
    \ncommonly used classes, functions, database connections, and other\n\nobjects\
    \ to a common file called *Utils.py*. In our use case, we will place the functions\
    \ for querying the user-insights table, generating a session\n\nID, creating a\
    \ file upload widget, and creating a PostgreSQL connection\n\nfunction within\
    \ this file as shown in Listing [11-12\\. F](#index_split_002.html#p368)urthermore,\
    \ another excellent practice is to use the *st.experimental_singleton* command\
    \ to\n\ncache the database connection object, as this will save a considerable\n\
    \namount of time whenever a call is made to the database.\n\nChapter 11 Streamlit\
    \ USe CaSeS\n\n***Listing 11-12.*** Utils.py\n\n**import** pandas as pd\n\n**from**\
    \ sqlalchemy **import** create_engine\n\n**import** streamlit as st\n\n**from**\
    \ streamlit.scriptrunner.script_run_context **import** get_\n\nscript_run_ctx\n\
    \n**from** streamlit.server.server **import** Server\n\n*# Inserting new row in\
    \ traffic insights table*\n\n**def** insert_row(session_id, engine):\n\n**if**\
    \ engine.execute(\"SELECT session_id FROM session_state\n\nWHERE session_id =\
    \ '%s'\" %\n\n(session_id)).fetchone() **is** None:\n\nengine.execute(\"INSERT\
    \ INTO session_state (session_id)\n\nVALUES ('%s')\" %\n\n(session_id))\n\n*#\
    \ Updating row in insights table*\n\n**def** update_row(column, new_value, session_id,\
    \ engine):\n\n**if** engine.execute(\"SELECT %s FROM session_state WHERE\n\nsession_id\
    \ = '%s'\" %\n\n(column, session_id)).first()[0] **is** None:\n\nengine.execute(\"\
    UPDATE session_state SET %s = '%s'\n\nWHERE session_id = '%s'\" %\n\n(column,\
    \ new_value, session_id))\n\n*# Session state function*\n\n**def** get_session():\n\
    \nsession_id = get_script_run_ctx().session_id\n\nsession_info = Server.get_current()._get_session_\n\
    \ninfo(session_id)\n\nChapter 11 Streamlit USe CaSeS\n\n**if** session_info **is**\
    \ None:\n\n**raise** RuntimeError(\"Couldn't get your Streamlit Session\n\nobject.\"\
    )\n\nsession_id = session_id.replace('-','_')\n\nsession_id = '_id_' + session_id\n\
    \n**return** session_info.session, session_id\n\n*# File uploader function*\n\n\
    **def** file_upload(name):\n\nuploaded_file = st.sidebar.file_uploader('%s' %\n\
    \n(name),key='%s' % (name),\n\naccept_multiple_files=False)\n\nstatus = False\n\
    \n**if** uploaded_file **is not** None:\n\n**try**:\n\nuploaded_df = pd.read_csv(uploaded_file)\n\
    \nstatus = True\n\n**return** status, uploaded_df\n\n**except**:\n\n**try**:\n\
    \nuploaded_df = pd.read_excel(uploaded_file)\n\nstatus = True\n\n**return** status,\
    \ uploaded_df\n\n**except**:\n\nst.error( *\"'Please ensure file is .csv or .xlsx*\n\
    \n*format and/or*\n\n*reupload file\"'* )\n\n**return** status, None\n\n**else**:\n\
    \n**return** status, None\n\nChapter 11 Streamlit USe CaSeS\n\n@st.cache(allow_output_mutation=True,\
    \ hash_funcs={\"_thread.\n\nRLock\": **lambda** _: None})\n\n**def** db_engine(username,\
    \ password, port):\n\n**return** create_engine('postgresql://%s:%s@localhost:%s/'\
    \ %\n\n(username, password,\n\nport))\n\n**Config Script**\n\nAs discussed in\
    \ earlier sections, another good practice is to store\n\ncredentials in dictionaries\
    \ within a config.py file that is then imported\n\nand invoked in your main code.\
    \ In addition, as shown in Listing [11-13, the](#index_split_002.html#p370)\n\n\
    hashed passwords generated earlier by Streamlit-Authenticator can also be\n\n\
    stored in the config.py file instead of writing them within the main script.\n\
    \nPlease ensure that the config.py file is added to the *Gitignore* file so that\
    \ it is not pushed to any remote repositories.\n\n***Listing 11-13.*** config.py\n\
    \n*# User credentials dictionary*\n\nuser_credentials = {\n\n'names': ['John Smith','Rebecca\
    \ Briggs'],\n\n'usernames': ['jsmith','rbriggs'],\n\n'passwords': ['$2b$12$bqO7DBwAIS3rCGyvP2qNN.t6LchM.qGNviocCl\n\
    \nsjX8fOtdqZgZZyG','$2b$12$48hHezeKpl21oZp2/iMwj.\n\nbQcP47DAquKe.dYoyRqb9ctyYuy0Jei']\n\
    \n}\n\nChapter 11 Streamlit USe CaSeS\n\n*# Traffic insights database credentials\
    \ dictionary*\n\ndatabase_credentials = {\n\n'username': '<username>',\n\n'password':\
    \ '<password>',\n\n'port': '<port>'\n\n}\n\n**Main Script**\n\nNow that we have\
    \ gotten the logistics out of the way, we can begin to\n\ndevelop the main script\
    \ of our application that will serve as the focal point\n\nbetween the various\
    \ pages and will also cater to some of our housekeeping\n\nrequirements. As shown\
    \ in Listing [11-14, w](#index_split_002.html#p371)e begin by importing scripts\
    \ for any other pages in the same manner discussed in Section\n\n3.3\\. Subsequently,\
    \ we utilize the Streamlit-Authenticator component\n\nto authenticate users based\
    \ on the credentials saved in the config.py\n\nfile. Next, we enable navigation\
    \ between pages by using the *st.selectbox*\n\ncommand that calls the function\
    \ for the selected page from a dictionary of\n\nkey-value pairs, where the key\
    \ is the name of the page and the value is the\n\ncorresponding function. Finally,\
    \ we invoke the file upload widget from our\n\nUtils file and assign the uploaded\
    \ Pandas dataframes to our session state,\n\nwhere they can be accessed from at\
    \ any time on demand.\n\n***Listing 11-14.*** main.py\n\n**import** streamlit\
    \ as st\n\n**from** Utils **import** *\n\n**import** streamlit_authenticator as\
    \ stauth\n\n**import** config\n\n*# Importing pages*\n\n**from** lr **import**\
    \ lr_main\n\nChapter 11 Streamlit USe CaSeS\n\n**def** main(engine):\n\n*# Creating\
