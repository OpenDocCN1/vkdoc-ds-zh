    \n**7.4 User Insights**\n\nHaving the ability to record user interactions with\
    \ a web application can\n\nin many instances be quite critical. The developer\
    \ or product owner must\n\nhave at their disposal rich and accurate data of how\
    \ many users are visiting\n\ntheir website, at what times, and how exactly they\
    \ are engaging with it in\n\norder to better tailor and refine their product or\
    \ service. Imagine you have an ecommerce web application that has been curated\
    \ impeccably, but is failing\n\nto convert leads into sales, and you cannot figure\
    \ out why. Perhaps, there\n\nis a bug with your interface or backend that is inhibiting\
    \ the user’s actions,\n\nor maybe your server is overloaded and is failing to\
    \ cater to the traffic.\n\nRegardless, you will need to diagnose where exactly\
    \ in your pipeline the\n\nproblem is located to rectify it, and this is where\
    \ user insights come into play.\n\nWhile Google Analytics can deliver rich insights\
    \ including but not\n\nlimited to numbers of visits, user demographics, time spent\
    \ on various\n\npages, and a lot more at the server level, it will not readily\
    \ be able to record interactions at the application level. Consequently, you are\
    \ required to\n\ndevelop your own means of recording user insights for the application,\n\
    \n![](index-214_1.jpg)\n\nChapter 7 ImplementIng SeSSIon State\n\nand this can\
    \ be done in several ways. The simplest of which, as shown in\n\nListin[g 7-6,\
    \ allo](#index_split_001.html#p215)ws you to read the timestamp each time the\
    \ user engages with a subsection of your code, such as clicking a button or uploading\
    \ a\n\ndataset as shown in Figur[e 7-7, and r](#index_split_001.html#p214)ecord\
    \ it in a PostgreSQL database as seen in Figure [7-8](#index_split_001.html#p215).\
    \ Similarly, the number of rows of the uploaded dataset can also be recorded.\
    \ Each insight is stored in a separate column in a table\n\nwhose primary key\
    \ is the unique session ID. Once the application has been\n\nrestarted, a new\
    \ row with a different session ID will be created. By inserting\n\nthe following\
    \ *update* function, you can record any value at any step in your program:\n\n\
    update_row(column,new_value,session_id,mutable,engine)\n\n***Figure 7-7.** Output\
    \ of Listin[g 7-6](#index_split_001.html#p215)*\n\n![](index-215_1.jpg)\n\nChapter\
    \ 7 ImplementIng SeSSIon State\n\n***Figure 7-8.** Associated PostgreSQL database\
    \ for Listin[g 7-6](#index_split_001.html#p215)*\n\nPlease note that insights\
    \ can be overwritten multiple times by setting\n\nthe *mutable* argument to True\
    \ or left as False if you want to record a value only the first time it was generated.\n\
    \n***Listing 7-6.*** record_user_insights.py\n\n**import** streamlit as st\n\n\
    **from** streamlit.scriptrunner.script_run_context **import** get_\n\nscript_run_ctx\n\
    \n**from** datetime **import** datetime\n\n**import** pandas as pd\n\n**import**\
    \ psycopg2\n\n**from** sqlalchemy **import** create_engine\n\n**def** get_session_id():\n\
    \nsession_id = get_script_run_ctx().session_id\n\nsession_id = session_id.replace('-','_')\n\
    \nsession_id = '_id_' + session_id\n\n**return** session_id\n\nChapter 7 ImplementIng\
    \ SeSSIon State\n\n**def** insert_row(session_id,engine):\n\n**if** engine.execute(\"\
    SELECT session_id FROM user_insights\n\nWHERE session_id = '%s'\"\n\n% (session_id)).fetchone()\
    \ **is** None:\n\nengine.execute( *\"\"\"INSERT INTO user_insights*\n\n*(session_id)\
    \ VALUES ('%s')\"\"\"*\n\n% (session_id))\n\n**def** update_row(column,new_value,session_id,mutable,engine):\n\
    \n**if** mutable:\n\nengine.execute(\"UPDATE user_insights SET %s = '%s'\n\nWHERE\
    \ session_id = '%s'\"\n\n% (column,new_value,session_id))\n\n**elif** engine.execute(\"\
    SELECT %s FROM user_insights WHERE\n\nsession_id = '%s'\"\n\n% (column,session_id)).first()[0]\
    \ **is** None:\n\nengine.execute(\"UPDATE user_insights SET %s = '%s'\n\nWHERE\
