    ANOTHER RANDOM TEXT HERE\"\n\n**8.4 Anti-SQL Injection Measures**\n\n**with SQLAlchemy**\n\
    \nAs a final code implemented protection, we aim to protect the backend’s\n\n\
    SQL queries by preventing a nonintended action to happen. First, we need\n\nto\
    \ identify what a SQL injection is. It is mostly when a user-controlled text\n\
    \nchanges the SQL command behavior. For instance, assume we want to\n\nsupport\
    \ searching for employees starting with a string of character to be\n\ninput by\
    \ the end user; it will result in a final query as such: SELECT * FROM\n\nEmployees\
    \ WHERE name = 'input%'. This poses a threat if the input was\n\nOR 1=1 -- as\
    \ it would result in a final query of SELECT * FROM Employees\n\nWHERE name =\
    \ '%' OR 1=1 -- which orders the database to select all\n\nemployees, instead\
    \ of treating the input as the search string.\n\nTo overcome this problem, we\
    \ need to use parameterization which\n\nis a technique to isolate the original\
    \ SQL command from the changing\n\nvariables. So, for the example from before,\
    \ it would rather look something\n\nlike SELECT * FROM Employees WHERE name =\
    \ '@name%' where *@name*\n\nis a SQL variable initialized before submitting the\
    \ query. As a developer,\n\nthis might be an overhead toward a more secure SQL.\
    \ Thus, we use\n\nlibraries and/or packages to do this on our behalf. For this\
    \ scenario,\n\nwe are using SQLAlchemy, which is a library that can connect to\
    \ many\n\ntypes of databases and change SQL command formats depending on the\n\
    \narchitecture, origin, and version, all by following an intuitive API that is\n\
    \ndocumented in [docs.sqlalchemy.org](http://docs.sqlalchemy.org).\n\nChapter\
    \ 8 authentiCation and appliCation SeCurity\n\n**8.5 Configuring Gitignore Variables**\n\
    \nHaving all files tracked with a version control system like Git is a must\n\n\
    for big projects, as it adds more simplicity in managing what files are\n\nimportant\
    \ and their modification history. However, not all files must be\n\ntracked, and\
    \ some will pose security threats if tracked, as the code base\n\ncan be accessed\
    \ by anyone if it is public, or broken into if it is private.\n\nThis makes the\
    \ secrets managed under threat; hence, it is widely agreed\n\namong software developers\
    \ to not track the secrets file and store the actual\n\nsecrets in a security\
    \ vault, which is accessible using multiple methods of\n\nauthentication.\n\n\
    As this adds one more layer of security over the application’s\n\nsecrets, it\
    \ gives a direct hit to code readability and understanding\n\nif an unaware developer\
    \ started working on the code. This can be\n\nfixed by adding another file with\
    \ the following naming conventions:\n\nFlask/secrets. ***example***.yaml which\
    \ will host similar content to what is shown in Listing [8-12](#index_split_001.html#p247)\
    \ albeit with a replacement of the actual key values with something vague yet\
    \ understandable, as shown in Listin[g 8-13](#index_split_001.html#p248).\n\n\
    Subsequently, we can remove the original secrets file from Git by updating\n\n\
    the .gitignore file as shown in Listin[g 8-14](#index_split_001.html#p248). If\
    \ needed, any file and folder in or under the same folder as .gitignore can be\
    \ set to be ignored or\n\nexcluded depending on the syntax.\n\n***Listing 8-13.***\
    \ Flask/secrets.example.yaml\n\n*# Copy the content of this file to secrets.yaml*\n\
    \n*# and replace its contents with the correct values*\n\njwt_secret: \"<INSERT\
    \ TEXT>\"\n\nsing_up_key: \"<INSERT TEXT HERE>\"\n\n***Listing 8-14.*** Flask/.gitignore\n\
    \nsecrets.yaml\n\nChapter 8 authentiCation and appliCation SeCurity\n\n**8.6 Summary**\n\
    \nAs part of making any web application public, you are required to manage\n\n\
    resources served, by verifying each and every user’s authorization level. In\n\
    \nthis chapter, we have explained how to create and manage user accounts\n\nand\
    \ how to utilize them for authentication. We introduced essential\n\napplication\
    \ security mechanisms such as generating JSON Web Tokens,\n\nhashing passwords,\
    \ and embedding secure signatures into cookies. In\n\naddition, this chapter showcased\
    \ techniques to obstruct SQL injection\n\nattacks to prevent unauthorized access\
    \ to databases. Finally, we observed\n\nhow application keys and secrets can be\
    \ secured during deployment, and\n\nalso how they can be excluded from being committed\
    \ toa version control\n\nframework such as Git.\n\n**CHAPTER 9**\n\n**Deploying\
    \ Locally**\n\n**and to the Cloud**\n\nAs you approach the end of the development\
    \ phase with your Streamlit\n\napplication, it is time for it to see the light\
    \ for the first time. In other words, you are ready to deploy the application\
    \ and unleash your goodness to the\n\nworld at large. To that end, you will need\
    \ a machine to serve your application\n\ncontinuously, robustly, and resiliently.\
    \ And while you can transform\n\nyour local machine into a server of sorts, you\
    \ are better off deploying the\n\napplication to the mighty cloud, with the likes\
    \ of Amazon Web Services,\n\nMicrosoft Azure, Google Cloud Platform, and last\
    \ but not least Streamlit itself.\n\nIn this chapter, we will walk through the\
    \ steps required to forward your\n\nlocal application to the Web and more importantly\
    \ how to deploy your\n\napplication on remote servers with Linux containers, Windows\
    \ Server, and\n\nwith Streamlit’s dedicated cloud service *Streamlit Cloud*. Upon\
    \ completion of this chapter, you will have acquired the technical know-how to\
    \ serve\n\nyour users both within a local network and across the World Wide Web.\n\
    \n© Mohammad Khorasani, Mohamed Abdou, Javier Hernández Fernández 2022\n\nM. Khorasani\
    \ et al., *Web Application Development with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6_9](https://doi.org/10.1007/978-1-4842-8111-6_9#DOI)\n\
    \nChapter 9 Deploying loCally anD to the ClouD\n\n**9.1 Exposing Streamlit to\
    \ the World**\n\n**Wide Web**\n\nAfter making an application with Streamlit, you\
    \ get to see it in\n\naction by visiting the loopback address from the browser\
    \ as such:\n\nhttp://127.0.0.1:8501\\. In addition to that, you can also share\
    \ it locally\n\nwith people and devices on your local network which usually assigns\
    \ your\n\nIP address which starts with 192.168.*, 172.(16-31).*, or 10.*. Then\n\
    \nyou can access your running Streamlit application from any device on the\n\n\
    same network by prepending your IP address with http and appending\n\n8501 or\
    \ the listening port of Streamlit. However, there is no straightforward\n\nway\
    \ to temporarily showcase your Streamlit application to anyone,\n\nanywhere, without\
    \ having to lease a static public IP from your ISP or rent\n\na cloud computer\
    \ from a big tech. Here, we will showcase free, easy-to-\n\nconfigure methods\
    \ to present your application globally at no extra cost.\n\n**9.1.1 Port Forwarding\
    \ over a Network Gateway**\n\nNowadays, almost every household contains a broadband\
    \ device, which is\n\ntechnically the gateway to the Internet. However, the household’s\
    \ network\n\nand devices are not exposed to the Internet; rather, their Internet\
    \ requests\n\nare routed through the broadband device. The broadband uses NAT\
    \ to\n\nmap private to public IPs. But the opposite way doesn’t work by default,\n\
    \nunless configured to do so. With most broadbands, a web server is exposed\n\n\
    to control multiple things on the network. Usually, the very first IP of the\n\
    \nnetwork is the broadband’s. Pasting this IP in the browser will serve a web\n\
    \npage to configure the routing rules and other things as seen in Figur[e 9-1.](#index_split_001.html#p252)\n\
    \nIt might not look the same with everybody, but all mostly have a method to\n\
    \nconfigure *port forwarding* and *port mapping*. In that page, we want to map\
    \ an internal IP with a port to one of the broadband’s public ports. Ideally,\n\
    \nwe want to map Streamlit’s default 8501 port to the default HTTP’s port 80.\n\
    \n![](index-252_1.jpg)\n\n![](index-252_2.jpg)\n\nChapter 9 Deploying loCally\
    \ anD to the ClouD\n\n***Figure 9-1.** Broadband’s configuration website*\n\n\
    The next step is to know the gateway’s public IP. A simple method to\n\nknow it\
    \ is just by googling it, as seen in Figur[e 9-2\\. Es](#index_split_001.html#p252)sentially,\
    \ any website you visit can see your public IP, which then can be echoed to you\
    \ for your\n\nreference. Now if we paste the same IP in the browser’s search bar,\
    \ we will\n\nbe presented by our Streamlit application as shown in Figur[e 9-3.](#index_split_001.html#p253)\n\
    \n***Figure 9-2.** Host’s public IP address*\n\n![](index-253_1.jpg)\n\nChapter\
    \ 9 Deploying loCally anD to the ClouD\n\n***Figure 9-3.** Visiting the public\
    \ IP and being served the Streamlit*\n\n*application*\n\nIt is worth noting that\
    \ the public IP is assigned from ISP, which rotates\n\nthrough a pool of IPs to\
    \ be served to its clients. This means that anyone’s\n\npublic IP will eventually\
    \ change, such as every hour or on network\n\nreentry. This will happen unless\
    \ you request a static IP from the ISP, which\n\nguarantees the broadband is allocated\
    \ the IP address requested, even if\n\nyour network is unavailable.\n\n**9.1.2\
    \ HTTP Tunneling Using NGROK**\n\nThe concept of tunneling is like establishing\
    \ a VPN connection between\n\ntwo devices, even if they are further apart and\
    \ not in the same network.\n\nNgrok utilizes tunneling to allow private network\
    \ devices to be accessed\n\nby the public network for a short period of time (usually\
    \ two hours) by\n\nallocating a temporary subdomain on their servers that access\
    \ your service\n\nto expose and serve it on your behalf. In a nutshell, a Streamlit\
    \ application\n\nrunning on http://127.0.0.1:8501 can be accessed by a specific\
    \ ngrok\n\nURL with the following format:\n\nhttp://<random-uuid-here>.ngrok.io\n\
    \nChapter 9 Deploying loCally anD to the ClouD\n\nOnce the tunnel command is initiated\
    \ by the Ngrok user, the\n\nconnection is established and the Ngrok URL is provided.\
    \ The user can\n\nthen share it with anyone to access their local Streamlit application\
    \ for the\n\nnext few hours. After installing Ngrok on your computer, you can\
    \ process\n\nit by typing the following into the CMD or terminal:\n\nngrok http\
    \ <port_to_tunnel_to>\n\nwhere the *<port_to_tunnel_to>* block can be replaced\
    \ with *8501* for tunneling to the running Streamlit application. Listing [9-1](#index_split_001.html#p254)\
    \ shows a simple Streamlit application using an iframe to display the user’s public\
    \ IP\n\naddress. After running ngrok on 8501 in the CMD, the user gets presented\n\
    \nwith the allocated subdomain as seen in Figur[e 9-4\\. T](#index_split_001.html#p255)he\
    \ location of the subdomain is the United States as mentioned by ngrok; however,\
    \ once a\n\npublic IP website is visited, it doesn’t show the United States as\
    \ the origin\n\naccording to Figure [9-5](#index_split_001.html#p255). The IP\
    \ shown is the original user’s ID which is in Qatar even though the ngrok tunneled\
    \ through the United States; this is\n\nbecause it is not a VPN but a network,\
    \ and the request to that page is done\n\nthrough the Streamlit host machine.\n\
    \n***Listing 9-1.*** main.py\n\n**import** os\n\n**import** platform\n\n**import**\
    \ streamlit as st\n\nst.title(f\"Deployed on {platform.system()} ({os.name})\"\
    )\n\nst.subheader(\"More details:\")\n\nst.write(f\"_{platform.platform()}_\"\
    )\n\n![](index-255_1.jpg)\n\n![](index-255_2.jpg)\n\nChapter 9 Deploying loCally\
    \ anD to the ClouD\n\n***Figure 9-4.** Ngrok dashboard after tunneling to port\
    \ 8501*\n\n***Figure 9-5.** Two browser windows, one being served locally and\
    \ the*\n\n*other by ngrok, and both showing the same client IP*\n\nChapter 9 Deploying\
    \ loCally anD to the ClouD\n\n**9.2 Deployment to Streamlit Cloud**\n\nDeploying\
    \ a web application on the cloud can be somewhat of a\n\ndemanding undertaking,\
    \ contingent on who your cloud service provider\n\nis. Some like Heroku have made\
    \ it as trivial as connecting your GitHub\n\nrepository, installing your build\
    \ packs, configuring the application, and\n\nthen launching. Others require you\
    \ to orchestrate the entire process\n\nincluding setting up the virtual machine,\
    \ creating containers, port\n\nforwarding, load balancing, and routing requests\
    \ yourself. Regardless,\n\ndeployment to the cloud solicits at least a minimum\
    \ understanding of\n\ncloud computing concepts; after all, this is why we have\
    \ DevOps engineers.\n\nStreamlit however is democratizing this one last frontier\
    \ and making\n\ndeployment quite literally a one-click process. With *Streamlit\
    \ Cloud*,\n\nyou can simply connect your GitHub repository and then click deploy.\n\
    \nStreamlit will then provision the application with all of its required\n\ndependencies\
    \ for you and will update it each time you push a new\n\nversion of your source\
    \ code. No additional intervention is required by the\n\ndeveloper whatsoever.\
    \ Furthermore, if you require more than one private\n\napplication, additional\
    \ computing resources, or enterprise-grade features,\n\nyou may upgrade to Streamlit’s\
    \ premium packages.\n\n**9.2.1 One-Click Deployment**\n\nBefore you proceed to\
    \ deploy your first application to Streamlit Cloud,\n\nyou should open a GitHub\
    \ account and push your script to a repository.\n\nSubsequently, you can follow\
    \ these steps to deploy:\n\n1\\. Navigate t[o *share.streamlit.io*](http://share.streamlit.io),\
    \ log in with your GitHub account, and click *New app* as shown in\n\nFigur[e\
    \ 9-6.](#index_split_001.html#p257)\n\n![](index-257_1.jpg)\n\n![](index-257_2.jpg)\n\
    \nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure 9-6.** Deploying an\
    \ application to Streamlit Cloud (1)*\n\n2\\. Select the repository, branch, and\
    \ file where your\n\nsource code is located. Then click *Deploy!* as shown\n\n\
    in Figure [9-7](#index_split_001.html#p257).\n\n***Figure 9-7.** Deploying an\
    \ application to Streamlit Cloud (2)*\n\n3\\. Sit back and relax while Streamlit\
    \ Cloud provisions\n\nyour application, shown in Figure [9-8](#index_split_001.html#p258).\n\
    \n![](index-258_1.jpg)\n\n![](index-258_2.jpg)\n\nChapter 9 Deploying loCally\
    \ anD to the ClouD\n\n***Figure 9-8.** Deploying an application to Streamlit Cloud\
    \ (3)*\n\n4\\. And there you have it, your first application\n\ndeployed to Streamlit\
    \ Cloud, shown in Figure [9-9.](#index_split_001.html#p258)\n\n***Figure 9-9.**\
    \ Deploying an application to Streamlit Cloud (4)*\n\n![](index-259_1.jpg)\n\n\
    Chapter 9 Deploying loCally anD to the ClouD\n\n**9.2.2 Streamlit Secrets**\n\n\
    Another benefit associated with using Streamlit Cloud is that you can\n\nsecurely\
    \ store private data on Streamlit’s servers and readily access them\n\nin your\
    \ application. This feature is exceptionally useful for storing user\n\ncredentials,\
    \ database connection strings, API keys, and other passwords,\n\nwithout having\
    \ to enter them in plain text form in your code (which you\n\nshould never do\
    \ under any circumstances). Instead, you can execute the\n\nfollowing steps to\
    \ store and access private data with Streamlit’s *Secrets*\n\n*Management*.\n\n\
    1\\. Navigate t[o *share.streamlit.io*](http://share.streamlit.io) and open the\
    \ settings for the application you want to add secrets to, as\n\nshown in Figure\
    \ [9-10.](#index_split_001.html#p259)\n\n***Figure 9-10.** Adding secrets to Streamlit\
    \ Cloud’s Secrets*\n\n*Management (1)*\n\n2\\. Add your secrets in the form of\
    \ a TOML file, as\n\nshown in Figure [9-11.](#index_split_001.html#p260)\n\n![](index-260_1.jpg)\n\
    \n![](index-260_2.png)\n\nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure\
    \ 9-11.** Adding secrets to Streamlit Cloud’s Secrets*\n\n*Management (2)*\n\n\
    3\\. Access your secrets in your script using the *st.*\n\n*secrets* command,\
    \ as shown in the following and in\n\nFigur[e 9-12](#index_split_001.html#p260):\n\
    \n***Figure 9-12.** Using secrets in a Streamlit Cloud application*\n\n**import**\
    \ streamlit as st\n\nst.write('**Secret:**',st.secrets['secret'])\n\nst.write('**Password:**',st.secrets['section']['password'])\n\
    \nChapter 9 Deploying loCally anD to the ClouD\n\n4\\. If you wish to replicate\
    \ Secrets Management locally\n\non your own server, you can simply add the same\n\
    \nTOML file as *secrets.toml* in the *.streamlit* folder\n\nin your root directory.\
    \ Ensure that such files are\n\nignored in Git commits by adding the folder to\
    \ your\n\n.gitignore file.\n\n**9.3 Deployment to Linux**\n\nMost cloud providers\
    \ thrive on facilitating leases of virtual machines\n\nto corporations and individuals\
    \ to run services and apps on a Linux\n\nenvironment. The beauty of Linux revolves\
    \ around its ability to process at\n\nhigher speeds and make better utilization\
    \ of computer resources due to its\n\nuse of fewer kernel layers. All those factors\
    \ contribute in making Linux the\n\ngo-to option for cloud machines.\n\n**9.3.1\
    \ Native Deployment on a Linux Machine**\n\nHaving access to a Linux machine,\
    \ whether with GUI or terminal access,\n\nyou can run Streamlit in a nonblocking\
    \ way. To do so, you have to make\n\nthe command run in the background by using\
    \ & after the command as\n\nshown in Listing [9-2](#index_split_001.html#p263).\
    \ Then untie it from the terminal by using the disown in order to prevent the\
    \ process being killed after the terminal being closed,\n\nbut by still displaying\
    \ standard input and output as shown in Figure [9-13.](#index_split_001.html#p262)\n\
    \nOutput of Listing [9-1](#index_split_001.html#p254) can be seen in Figur[e 9-14.](#index_split_001.html#p262)\n\
    \n![](index-262_1.jpg)\n\n![](index-262_2.jpg)\n\nChapter 9 Deploying loCally\
    \ anD to the ClouD\n\n***Figure 9-13.** Running Listing [9-2 in the term](#index_split_001.html#p263)*\
    \ *inal*\n\n***Figure 9-14.** Output of Listing [9-1, s](#index_split_001.html#p254)*\
    \ *howing the operating system* *being Linux*\n\n![](index-263_1.jpg)\n\nChapter\
    \ 9 Deploying loCally anD to the ClouD\n\nAt the point of closing the application,\
    \ we need to find its PID first with\n\n**ps** -aux | grep \"streamlit run\"\n\
    \nThen gather the leftmost number and, as shown in Figure [9-15](#index_split_001.html#p263),\
    \ stop the process with\n\n**kill** <PID>\n\n***Figure 9-15.** Searching for the\
    \ background Streamlit process ID and*\n\n*running the kill command against it*\n\
    \n***Listing 9-2.*** run.sh, with main.py being Listin[g 9-1](#index_split_001.html#p254)\n\
    \n***streamlit run main.py &***\n\ndisown\n\nChapter 9 Deploying loCally anD to\
    \ the ClouD\n\n**9.3.2 Deployment with Linux Docker Containers**\n\nTo avoid the\
    \ hassle of running your Streamlit application in a specific way,\n\nand for other\
    \ security reasons, you can use a Docker container to run it.\n\nDocker allows\
    \ you to host an application in any OS environment with its\n\nown variables,\
    \ applications, and services. All while having the ability to\n\ncontrol computer\
    \ resources it has access to. Moreover, if the application\n\nwas compromised\
    \ by a malicious actor, most likely they won’t be able\n\nto escape the Docker\
    \ container to further compromise the machine it is\n\nrunning on, only if configured\
    \ correctly.\n\nKnowing why deployment of any service in a containerized\n\nenvironment\
    \ is beneficial, we can proceed by creating Docker’s main file,\n\nwhich is shown\
    \ in Listin[g 9-3. As](#index_split_001.html#p264)suming Docker is already installed,\
    \ this file essentially initiates a Linux environment with a Python 3.8 installed\n\
    \nby default and then makes a new folder to place your Streamlit/Python\n\nfiles\
    \ in. After that, it copies your (should be existing) requirements.txt\n\nfile,\
    \ as shown in Listin[g 9-4, t](#index_split_001.html#p265)o Docker’s working directory,\
    \ which will then be installed. Once Streamlit is installed, we order the Docker\
    \ container\n\nto allow access to its 8501 port from the outside Docker scope;\
    \ this is the\n\nport which Streamlit will run on by default. And finally, Streamlit\
    \ files are\n\ncopied to the working directory and run.\n\n***Listing 9-3.***\
    \ Dockerfile\n\nFROM python:3.8\n\nWORKDIR /app\n\nCOPY requirements.txt ./requirements.txt\n\
    \nRUN pip install -r requirements.txt\n\nEXPOSE 8501\n\nCOPY . /app\n\nENTRYPOINT\
    \ [\"streamlit\", \"run\"]\n\nCMD [\"main.py\"]\n\n![](index-265_1.jpg)\n\nChapter\
    \ 9 Deploying loCally anD to the ClouD\n\n***Listing 9-4.*** requirements.txt\n\
    \nstreamlit==1.2.0 *# Latest version as of writing this book*\n\nHaving our files\
    \ ready, we need to build a custom Docker image out\n\nof our work like in Figure\
    \ [9-16](#index_split_001.html#p265) by running Listing [9-5](#index_split_001.html#p265)\
    \ in the project’s root folder, where the Dockerfile shall exist.\n\n***Listing\
    \ 9-5.*** Building a Docker image\n\ndocker build -t <CUSTOM_IMAGE_NAME>:latest\
    \ .\n\n***Figure 9-16.** Building image and verifying its existence*\n\nRunning\
    \ the image is done by executing the code shown in Listing [9-6](#index_split_001.html#p266);\
    \ the -d option is to detach the process from the command line, similar\n\nto\
    \ the disown command in Linux. Figur[e 9-17](#index_split_001.html#p266) shows\
    \ how the process does not detached and therefore stops reusing the same command-line\
    \ window. Now we have a running container overriding the current\n\n![](index-266_1.png)\n\
    \n![](index-266_2.png)\n\nChapter 9 Deploying loCally anD to the ClouD\n\nmachine’s\
    \ port 8501 with its own, which means the Streamlit application\n\ncan be visited\
    \ from localhost as seen in Figur[e 9-18.](#index_split_001.html#p266)\n\n***Listing\
    \ 9-6.*** Making a container out of a Docker image\n\ndocker run -d -p 8501:8501\
    \ <CUSTOM_IMAGE_NAME>:latest\n\n***Figure 9-17.** Running the Docker image*\n\n\
    ***Figure 9-18.** Streamlit application running from a Docker container*\n\n![](index-267_1.jpg)\n\
    \nChapter 9 Deploying loCally anD to the ClouD\n\nFinally, we can destroy the\
    \ container, without affecting the image, by\n\nrunning Listing [9-8](#index_split_001.html#p267).\
    \ First, we need to know the container ID by running Listin[g 9-7, then a](#index_split_001.html#p267)pply\
    \ the stopping action as seen in Figur[e 9-19](#index_split_001.html#p267).\n\n\
    ***Listing 9-7.*** Displaying all running Docker container metadata\n\ndocker\
    \ **ps**\n\n***Listing 9-8.*** Stopping a specific Docker container\n\ndocker\
    \ stop <CONTAINER_ID>\n\n***Figure 9-19.** Checking active containers and closing\
    \ a specific*\n\n*container*\n\n**9.4 Deployment to Windows Server**\n\nGiven\
    \ the affinity of the corporate world with Microsoft, if you are going\n\nto deploy\
    \ your Streamlit application on a corporate server, chances are\n\nyou will be\
    \ using Windows Server. Luckily, the process to provision your\n\nChapter 9 Deploying\
    \ loCally anD to the ClouD\n\napplication is rather simple and straightforward,\
    \ and while this section\n\nis dedicated to Windows Server, it is by no means\
    \ exclusive to it either;\n\nyou may in fact follow the same steps to deploy on\
    \ a normal Windows\n\noperating system as well. Before we proceed however, we\
    \ are going to\n\nmake several assumptions that may or may not be true, namely,\
    \ that your\n\ncorporate server is located remotely and that you only have local\
    \ intranet\n\naccess to it with no Internet connectivity. Consequently, you will\
    \ require\n\nadditional steps to overcome these two assumptions that will be explained\n\
    \nin the following sections.\n\n**9.4.1 Establishing a Remote Desktop Connection**\n\
    \nAs mentioned earlier, your server may be located remotely, and your\n\nmost\
    \ likely means of connecting to it will be through the Remote Desktop\n\nProtocol\
    \ or RDP for short. RDP provides you with a graphical user interface\n\nto connect\
    \ to the remote server over a network connection. The Microsoft\n\nclient for\
    \ RDP is *Remote Desktop Connection*, as shown in Figur[e 9-20.](#index_split_001.html#p269)\n\
    \nPlease proceed by entering the IP address of the remote server in the\n\n*Computer*\
    \ field and the associated domain (if required) appended to the\n\nusername in\
    \ the *User name* field as *domain/username*. Subsequently, click connect and\
    \ you will be prompted to enter your password to log in to\n\nthe server.\n\n\
    ![](index-269_1.jpg)\n\nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure\
    \ 9-20.** Establishing a RDP connection to the remote server*\n\nSince your remote\
    \ server might not have access to the Internet, you\n\nmay also use RDP to transfer\
    \ files from your local disk to the server by\n\nselecting the *Drives* checkbox\
    \ in the *Local Resources* tab as shown in Figur[e 9-21\\. W](#index_split_001.html#p270)ith\
    \ this feature, you also have the option of providing access to other local resources\
    \ such as I/O devices and peripherals on the server\n\nshould you require.\n\n\
    ![](index-270_1.jpg)\n\nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure\
    \ 9-21.** Transferring local resources to the remote server*\n\n**9.4.2 Opening\
    \ TCP/IP Ports**\n\nBefore you proceed any further, you need to ensure that all\
    \ the relevant\n\ninbound and outbound TCP/IP ports of the server are open, so\
    \ that the\n\nStreamlit application can be forwarded across the local network:\n\
    \n1\\. Open\n\n*Windows Defender Firewall with Additional*\n\n*Security*.\n\n\
    2\\. Select\n\n*Inbound Rules* or *Outbound Rules* in the\n\nleft pane.\n\n3\\\
    . Click\n\n*New Rule* in the right pane to open the *New*\n\n*Rule Wizard* window.\n\
    \n![](index-271_1.jpg)\n\nChapter 9 Deploying loCally anD to the ClouD\n\n4\\\
    . Select the *Port* option and then click next as shown\n\nin Figure [9-22.](#index_split_001.html#p271)\n\
    \n***Figure 9-22.** Opening TCP/IP ports (1)*\n\n5\\. Select\n\n*TCP* and enter\
    \ the port number that your\n\nStreamlit application will be served on, for example,\n\
    \n8501, as shown in Figure [9-23.](#index_split_001.html#p272)\n\n![](index-272_1.jpg)\n\
    \nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure 9-23.** Opening TCP/IP\
    \ ports (2)*\n\n6\\. Select\n\n*Allow the connection* to serve the port to all\n\
    \nusers, or alternatively select *Allow the connection*\n\n*if it is secure* to\
    \ serve the port to specific users, as\n\nshown in Figure [9-24.](#index_split_001.html#p273)\n\
    \n![](index-273_1.jpg)\n\nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure\
    \ 9-24.** Opening TCP/IP ports (3)*\n\n7\\. Subsequently, select *Domain* and\
    \ *Private* to serve\n\nthe port to secure networks, as shown in Figur[e 9-25](#index_split_001.html#p274).\n\
    \n![](index-274_1.jpg)\n\nChapter 9 Deploying loCally anD to the ClouD\n\n***Figure\
    \ 9-25.** Opening TCP/IP ports (4)*\n\n8\\. Finally, enter a name for your rule\
    \ and follow the\n\nsame steps to open the same port for inbound/\n\noutbound\
    \ communication.\n\n**9.4.3 Anaconda Offline Package Installation**\n\nAs your\
    \ server may not have Internet access, you will not have the ability of\n\ninstalling\
    \ Python packages and their dependencies using Pip as you would\n\nnormally. Instead,\
    \ you must carry out an offline installation by following\n\nthese steps:\n\n\
