    \ 4 Data ManageMent anD Visualization\n\n**4.3 Summary**\n\nIn this chapter, we\
    \ provided an overview of several techniques used to\n\nmanage big data. Specifically,\
    \ we learned how to encode multimedia files\n\nand dataframes into bytes data\
    \ to store large quantities of data robustly\n\non databases or in memory. We\
    \ also observed how Streamlit’s caching\n\nfunctions can be utilized to profoundly\
    \ reduce execution time when our\n\napplication is rerun. In addition, we covered\
    \ a native technique and a\n\nthird-party toolkit that allow us to mutate dataframes\
    \ and tables within our\n\napplication. In the latter part of this chapter, we\
    \ acquired the knowledge\n\nto generate various types of charts including basic,\
    \ statistical, time-series,\n\ngeospatial, and animated charts in Streamlit using\
    \ the data visualization\n\nlibrary Plotly. Upon completion of this chapter, we\
    \ should have developed\n\nthe ability to manage and visualize data of varying\
    \ scale efficiently and\n\nrobustly for our web application.\n\n**CHAPTER 5**\n\
    \n**Database Integration**\n\nBefore we begin to utilize application data and\
    \ user interaction insights,\n\nwe need to learn how to store and manage data\
    \ of varying schemas\n\npersistently with the use of robust and distributed database\
    \ systems in\n\nan organized manner. Two types of database systems will be discussed\n\
    \nin detail, namely, relational and nonrelational databases. Examples of\n\ninterfacing\
    \ with PostgreSQL and MongoDB will be shown to demonstrate\n\nthe use cases for\
    \ each. In addition, advanced features such as fuzzy\n\nmatching and full-text\
    \ indexing will be exhibited, and boilerplates will be\n\nprovided to the reader\
    \ to use as building blocks for their own applications.\n\nFinally, the reader\
    \ will also learn how to seamlessly interface such\n\ndatabases with Streamlit\
    \ to visualize data and to execute create, read,\n\nupdate, and delete operations\
    \ on their data. PostgreSQL and pgAdmin\n\ninstallation is required for full understanding\
    \ in this chapter.\n\n**5.1 Relational Databases**\n\nSince most of the apps made\
    \ with Streamlit manipulate data in one way or\n\nthe other, sometimes that data\
    \ needs to be stored on disk for later use. In\n\nmost cases, this data is in\
    \ a specific format or, in other words, structured.\n\nWe can make use of this\
    \ property of the data to use a SQL database to\n\nstore it.\n\nPostgreSQL will\
    \ be the tool we will demonstrate such use case with,\n\ndue to it being free\
    \ and open source.\n\n© Mohammad Khorasani, Mohamed Abdou, Javier Hernández Fernández\
    \ 2022\n\nM. Khorasani et al., *Web Application Development with Streamlit*,\n\
    \n[https://doi.org/10.1007/978-1-4842-8111-6_5](https://doi.org/10.1007/978-1-4842-8111-6_5#DOI)\n\
    \nChapter 5 Database IntegratIon\n\n**5.1.1 Introduction to SQL**\n\nStructured\
    \ Query Language is used to do CRUD operations on data with\n\nsimilar structure.\
    \ Same structure data refers to different entries (rows)\n\nof data with same\
    \ features (columns). An example of a relational SQL\n\ndatabase is a company\
    \ directory of employee data split into two separate\n\ntables, namely, the employees’\
    \ personal information and their pay grades.\n\nBoth forms of data can be represented\
    \ as tables in the DB as shown in\n\nTa[bles 5-1 and 5-2, wher](#index_split_001.html#p158)e\
    \ there is a one-to-one linkage between both tables indicating that every employee\
    \ shall have a pay grade. A one-to-one relationship is when every row in one table\
    \ has a corresponding ID of\n\nanother table extending the information of the\
    \ first table with the second.\n\nThere are more types of mapping between tables\
    \ such as one-to-many\n\nand many-to-many relationships, but we will not discuss\
    \ them as it won’t\n\ngive additional value to the purpose of this book. But for\
    \ the sake of real-\n\nlife scenario demonstration, we will move forward with\
    \ one-to-one for\n\nsome of the examples.\n\nCRUD, which stands for Create, Read,\
    \ Update, and Delete, refers to the\n\nmain operations you can do within a database,\
    \ with SQL commands as\n\nfollows:\n\n• *Create*: To make a new person entry with\
    \ pay grade 3\n\n*INSERT INTO Persons VALUES (”Charlie”, ”01/01/1995”, 3);*\n\n\
    • *Read*: To retrieve all pay grade data with a base salary\n\nlevel equal to\
    \ L3\n\n*SELECT * FROM INTO PayGradeLevels WHERE*\n\n*BaseSalary = ’L3’;*\n\n\
    Chapter 5 Database IntegratIon\n\n• *Update*: To update the pay grade of Bob to\
    \ pay grade 2\n\n*UPDATE Persons SET PayGradeId = 2 WHERE ID = 3;*\n\n• *Delete*:\
    \ To remove pay grade 4 from existence\n\n*DELETE FROM PayGradeLevels WHERE id\
    \ = 4;*\n\n***Table 5-1.** Persons table*\n\n**ID**\n\n**Name**\n\n**DOB**\n\n\
    **Pay Grade ID**\n\nadam\n\n01/01/1990\n\nsara\n\n01/01/1980\n\nbob\n\n01/01/1970\n\
    \nalice\n\n01/01/2000\n\n***Table 5-2.** Pay grade levels table*\n\n**ID**\n\n\
    **Base Salary**\n\n**Reimbursements**\n\n**Bonuses**\n\nL3\n\nL2\n\nL0\n\nL1\n\
    \nL1\n\nL1\n\nL3\n\nL3\n\nL3\n\nL1\n\nL3\n\nL1\n\nOne of the most important keywords\
    \ that anyone building a database\n\nneeds to know is the **primary key**; this\
    \ refers to the *ID* in both Ta[bles 5-1](#index_split_001.html#p158)\n\nand [5-2](#index_split_001.html#p158),\
    \ as this is a unique, always valid, that is, not null, identifier that is used\
    \ to refer a single row. Moreover, it is indexed, which means it’s\n\ninternally\
    \ managed by the database in a specific way to further speed\n\nup query speeds\
    \ when filtered with the *ID*. It is worth mentioning that\n\nindexing is a feature\
    \ that can be applied to any column, but not preferred\n\nas it grows the disk\
    \ space usage of that column to up to twice the size.\n\n![](index-159_1.jpg)\n\
    \nChapter 5 Database IntegratIon\n\nIndexing helps in quick search of specific\
    \ values among all rows; hence,\n\nit is encouraged to be used in columns which\
    \ represent IDs.\n\nAnother term called foreign key resonates in backend developer\
    \ ears\n\nas an ID used to refer to a row in a different table. This is like the\
    \ Pay Grade ID column in Ta[ble 5-1 whic](#index_split_001.html#p158)h points\
    \ to the ID column in Ta[ble 5-2.](#index_split_001.html#p158)\n\n**5.1.2 Connecting\
    \ a PostgreSQL Database**\n\n**to Streamlit**\n\nFirst, we will need to create\
    \ the database and the tables from the example\n\ndiscussed in Section 5.1 using\
    \ pgAdmin4, which is a GUI (graphical\n\nuser interface) program used to interact\
    \ with and manage PostgreSQL\n\ndatabases. Assuming it is installed and set up,\
    \ we will create a new\n\ndatabase following the steps in Figures [5-1](#index_split_001.html#p159)\
    \ [and 5-2 s](#index_split_001.html#p160)equentially.\n\n***Figure 5-1.** Creating\
    \ a new PostgreSQL database*\n\n![](index-160_1.jpg)\n\nChapter 5 Database IntegratIon\n\
    \n***Figure 5-2.** Creating a new PostgreSQL database (continued)*\n\nAfter our\
    \ database is ready, we will click the Query Tool in the top-left\n\ncorner to\
    \ have run raw SQL commands. As shown in Figure [5-3](#index_split_001.html#p161),\
    \ we are creating two tables both with primary keys, and one of them has foreign\n\
    \nkeys. Other features of the columns – also referred to as constraints in\n\n\
    the database domains – are specifying a column to be not null and to be\n\nautoincrementing.\
    \ When specifying a column to be not null, it configures\n\nthe database to reject\
    \ any insert or updates to a row where this column\n\nis set to null or not set\
    \ at all if the data type’s default value is null. *SERIAL*\n\nis a unique data\
    \ type in PostegreSQL that ensures the column is not null\n\nand enforces autoincrementing\
    \ of its integer value.\n\n![](index-161_1.png)\n\nChapter 5 Database IntegratIon\n\
    \n***Figure 5-3.** Running SQL commands from create_tables.sql to create*\n\n\
    *the database tables*\n\nBefore proceeding with the integration with Streamlit,\
    \ we will first add\n\nsome data into the database using raw SQL as shown in Figur[e\
    \ 5-4\\. N](#index_split_001.html#p162)otice how we did not need to set the ID\
    \ values for both tables as this is being\n\ngenerated on the developer’s behalf.\n\
    \nFirstly, we will need to prepare our database access credentials to use\n\n\
    in Streamlit. These credentials, including the username and password,\n\ncan be\
    \ written as environment variables in a *.env* file, or in a *secrets.yaml* which\
    \ will then be read and parsed by Streamlit. Ideally, however, they\n\n![](index-162_1.png)\n\
    \nChapter 5 Database IntegratIon\n\nshould be written to the *secrets.toml* file\
    \ in a folder called *.streamlit* –\n\nwhich is recommended – as shown in Listing\
    \ [5-1\\. T](#index_split_001.html#p162)his file is then read by the Streamlit\
    \ engine and parsed to make the variables within at the\n\ndeveloper’s disposal\
    \ easily. And for this toml file to be parsed correctly,\n\nthe database’s connection\
    \ data can be marked as “*db_postrgres*,” which is also used within Streamlit\
    \ to get those database connection metadata. As\n\na reminder, try to always choose\
    \ strong passwords in the case the database\n\nis public, almost anyone can try\
    \ brute-forcing the password, gaining access\n\nto the data.\n\n***Listing 5-1.***\
    \ .streamlit/secrets.toml\n\n[db_postrgres]\n\nhost = \"127.0.0.1\"\n\nport =\
    \ \"5432\"\n\nuser = \"postgres\"\n\npassword = \"admin\"\n\ndbname = \"CompanyData\"\
    \n\n***Figure 5-4.** Inserting data using inserting_data.sql into the database*\
    \ 139\n\nChapter 5 Database IntegratIon\n\nTo interface Python with PostgreSQL,\
    \ we need to use a capable library\n\nto do so. For that example, we will use\
    \ *psycopg2*, but other libraries such as *sqlalchemy* can do the job, and it\
    \ will be introduced in later chapters.\n\nAs discussed in previous chapters,\
    \ Streamlit reruns the python script\n\nupon user actions. This wasn’t a big deal\
    \ before, but it can introduce more\n\noverhead as in the current example, a new\
    \ database connection will be\n\nestablished with every rerun. To avoid that unnecessary\
    \ call, we can cache\n\nthe first established connection. Streamlit allows caching\
    \ function calls out\n\nof the box, by using its native function decorator *st.cache*.\
    \ It can also accept some other parameters, for instance, an expiration date of\
    \ the cache,\n\nwhich will cause the next function call to reexecute the function\
    \ body if the\n\ncache is invalidated by then. As seen, the fifth line in Listin[g\
    \ 5-2](#index_split_001.html#p163) is being applied to save the established connection.\n\
    \nAfter the new connection is established, we will need a *cursor* to use for\
    \ querying SQL commands, also known as SQL queries. The cursor needs\n\nto be\
    \ disposed after the query finishes; otherwise, it can retain in memory,\n\nand\
    \ with every new query, the memory can be bloated and cause memory\n\nleaks, which\
    \ is every software developer’s nightmare. The developer can\n\nchoose to close\
    \ it manually or use a context manager which will close it\n\nonce its usage scope\
    \ is exited by the interpreter. Examples of both cases are\n\nthe functions on\
    \ lines 14 and 22 with output in Figur[e 5-5.](#index_split_001.html#p166)\n\n\
    ***Listing 5-2.*** [main.py](http://main.py)\n\n**import** streamlit as st\n\n\
    **import** psycopg2\n\n@st.cache(allow_output_mutation=True,\n\nhash_funcs={\"\
    _thread.RLock\": **lambda** _: None})\n\n**def** init_connection():\n\n**return**\
    \ psycopg2.connect(**st.secrets[\"db_postrgres\"])\n\nconn = init_connection()\n\
    \nChapter 5 Database IntegratIon\n\n**def** run_query(query_str):\n\ncur = conn.cursor()\n\
    \ncur.execute(query_str)\n\ndata = cur.fetchall()\n\ncur.close()\n\n**return**\
    \ data\n\n**def** run_query_with_context_manager(query_str):\n\nwith conn.cursor()\
    \ as cur:\n\ncur.execute(query_str)\n\n**return** cur.fetchall()\n\nquery = st.text_input(\"\
    Query\")\n\nc1, c2 = st.columns(2)\n\noutput = None\n\nwith c1:\n\n**if** st.button(\"\
    Run with context manager\"):\n\noutput = run_query_with_context_manager(query)\n\
    \nwith c2:\n\n**if** st.button(\"Run without context manager\"):\n\noutput = run_query(query)\n\
    \nst.write(output)\n\n**5.1.3 Displaying Tables in Streamlit**\n\nAfter querying\
    \ data from the database, we can display it in text format,\n\nor we can use more\
    \ visually entertaining tools from Streamlit, which will\n\nrequire a modification\
    \ of the representation of the data.\n\nChapter 5 Database IntegratIon\n\nAmong\
    \ data scientists and developers, it is usually known to parse\n\nstructured data,\
    \ whether it is sensor values, identification information,\n\nor any repeating\
    \ data with a structure in the form of a Pandas dataframe.\n\nDataframes are generally\
    \ Numpy arrays with extra capability such as\n\nstoring column values and SQL-like\
    \ querying techniques. That being\n\nsaid, it also shares the same fast vectorization\
    \ capabilities with normal\n\nNumpy arrays, which is essentially a parallelized\
    \ way to do mathematical\n\ncomputations on an array as a whole instead of doing\
    \ it one by one.\n\nStreamlit allows printing dataframes right away from a single\n\
    \ncommand in two different *st.table* displays a noninteractive representation\
    \ of the dataframe as shown in Figure [5-6](#index_split_001.html#p167). And Figure\
    \ [5-7](#index_split_001.html#p167) displays *st.*\n\n*dataframe*, rendering an\
    \ interactive representation of the dataframe,\n\nwhere the user can sort any\
    \ column just by clicking it. As a trade-off, this\n\nmakes the web application\
    \ slower as more CPU and/or memory usage is\n\nrequired, since the complexity\
    \ of the sorting algorithm grows- in an\n\n*O(n*log(n))* manner\n\n***Listing\
    \ 5-3.*** [df_demo.py](http://demo.py)\n\n**import** streamlit as st\n\n**import**\
    \ pandas as pd\n\ndf = pd.DataFrame([[\"Adam\", \"01/01/1990\", 2],\n\n[\"Sara\"\
    , \"01/01/1980\", 1],\n\n[\"Bob\", \"01/01/1970\", 1],\n\n[\"Alice\", \"01/01/2000\"\
    , 3]\n\n], columns=[\"Name\", \"DOB\", \"Paygrade ID\"])\n\nst.table(df)\n\nst.dataframe(df)\n\
    \n![](index-166_1.jpg)\n\nChapter 5 Database IntegratIon\n\n***Figure 5-5.** Running\
    \ user SQL commands from Streamlit*\n\n![](index-167_1.png)\n\n![](index-167_2.png)\n\
    \nChapter 5 Database IntegratIon\n\n***Figure 5-6.** st.table from Listing [5-3](#index_split_001.html#p165)*\n\
    \n***Figure 5-7.** st.dataframe from Listing [5-3](#index_split_001.html#p165)*\n\
    \n**5.2 Nonrelational Databases**\n\nWhile in most use cases you will be dealing\
    \ with a structured dataset\n\nwhere the schema, attributes, data types, and metadata\
    \ will be known\n\nbeforehand, there are indeed instances where none of these\
    \ will be known.\n\nImagine that you are trying to create a search engine, where\
    \ users can\n\ninput documents with varying lengths, numbers of headers or pictures,\n\
    \nand types of media. It is simply impossible to know what sort of schema or\n\
    \ntable to provision to store such data. In such applications, the utility of\
    \ a\n\nNoSQL database, the likes of MongoDB, is essential to store and manage\n\
    \nunstructured data.\n\nChapter 5 Database IntegratIon\n\n**5.2.1 Introduction\
    \ to MongoDB**\n\nMongoDB enables you to store data as a JSON *document* with\
    \ varying\n\nattributes and data types into a *collection* with a varying schema.\
    \ Please note that with MongoDB, a document is analogous to a row, and a\n\ncollection\
    \ is analogous to a table in a relational database system. Even if\n\nyour dataset\
    \ is structured to begin with, there is no harm in using a NoSQL\n\ndatabase system,\
    \ as you may eventually scale your application enough to\n\nend up dealing with\
    \ an abundance of unstructured data. In addition, if\n\nyou require features such\
    \ as full-text indexing where every word in every\n\ndocument in every collection\
    \ is reverse-indexed, or if you need fuzzy\n\nmatching in your queries to mitigate\
    \ the effect of typos, then MongoDB is\n\nthe place to be.\n\nTo provide an overview\
    \ of MongoDB and how it can be interfaced with\n\nStreamlit, in this section we\
    \ will create a search engine application for\n\nrestaurants using a publicly\
    \ available unstructured dataset of restaurant\n\nratings. The goal of the application\
    \ is to allow the user to search for\n\nrestaurants based on the type of cuisine\
    \ and address they want. For the\n\ncuisine, a simple one-to-one match with a\
    \ predefined list of cuisine\n\ntypes will be used to filter the data. However,\
    \ for the address, full-text\n\nindexing will be required to ensure that the address\
    \ can be matched\n\nwith n-grams (continuous sequence of words or tokens in a\
    \ document of\n\ntext) corresponding to the borough and street address that are\
    \ located in\n\ndisparate objects and arrays within the document as shown in Figure\
    \ [5-8](#index_split_001.html#p170).\n\nIn addition, fuzzy matching will be needed\
    \ to guarantee that similar but\n\nnonidentical search queries will be matched\
    \ with a term that is at most two\n\ncharacters different from the record.\n\n\
    Chapter 5 Database IntegratIon\n\n**5.2.2 Provisioning a Cloud Database**\n\n\
    MongoDB can be provisioned both locally and on the cloud; however, to\n\nutilize\
    \ the full-text indexing feature provided by MongoDB’s *Atlas Search*\n\nservice,\
    \ you will need to host your database on the cloud, as per the\n\nfollowing steps:\n\
    \n1\\. To begin with, you may set up an account and\n\nproject at [*www.mongodb.com/atlas/database*.](https://www.mongodb.com/atlas/database)\n\
