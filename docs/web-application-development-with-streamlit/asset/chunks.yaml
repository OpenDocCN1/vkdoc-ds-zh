    \n])\n\n![](index-182_1.jpg)\n\nChapter 5 Database IntegratIon\n\n**try**:\n\n\
    df = pd.DataFrame(result)[['Name','Address','Grade',\n\n'Score']]\n\ndf['Grade']\
