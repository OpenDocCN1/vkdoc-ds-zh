    \ – as of version 1.1.0 – didn’t\n\nsupport URL path modification, as the application\
    \ by default loads at root\n\nhttp://<DOMAIN>:<PORT>/. However, query parameters\
    \ are manipulable, as you set the key-value pairs in the URL like http://<DOMAIN>:<PORT>/?k\
    \ ey1=v1&k2=value2 by using the native Streamlit function:\n\nst.experimental_set_query_params(key1=\"\
    v1\", k2=\"value2\")\n\nAnd get them in dictionary format by\n\nst.experimental_get_query_params()\
