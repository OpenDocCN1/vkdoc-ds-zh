    \ the globe. And with that, the development to deployment life cycle\n\nof a Streamlit\
    \ application is complete.\n\n**CHAPTER 10**\n\n**Building Streamlit**\n\n**Components**\n\
    \nStreamlit regularly extends its features to incorporate additional\n\ncapabilities\
    \ that can be utilized by developers in a few short lines of code.\n\nAt some\
    \ point however, developers will need to take matters into their\n\nown hands\
    \ and build something tailored to address their own specific\n\nuser requirements.\
    \ Whether this is to modify the user interface or to offer\n\na bespoke experience\
    \ to the user, Streamlit allows the developer to create\n\ncustom components on\
    \ demand. Furthermore, Streamlit supports using\n\nReactJS as a wingman to build\
    \ components that can be used as a live web\n\nserver or built using deployment-ready\
    \ code. In this chapter, we will walk\n\nthrough the steps required to make new\
    \ Streamlit components, to use\n\nthem in a Pythonic context, and to share them\
    \ with the general public.\n\n**10.1 Introduction to Streamlit**\n\n**Custom Components**\n\
    \nFundamentally, Streamlit is a backend server, serving web page changes\n\nto\
    \ client browsers using DG. HTML and JavaScript can be generated by\n\nany web\
    \ frameworks. Hence, Streamlit can help serving components from\n\nany web application\
    \ framework. Web application frameworks can be quite\n\nadvanced like ReactJS,\
    \ where the developer codes in JSX but builds the\n\n© Mohammad Khorasani, Mohamed\
    \ Abdou, Javier Hernández Fernández 2022\n\nM. Khorasani et al., *Web Application\
    \ Development with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6_10](https://doi.org/10.1007/978-1-4842-8111-6_10#DOI)\n\
    \n![](index-285_1.png)\n\nChapter 10 Building Streamlit ComponentS\n\napplication\
    \ to give out a combination of files that can be served statically\n\nfrom disk.\
