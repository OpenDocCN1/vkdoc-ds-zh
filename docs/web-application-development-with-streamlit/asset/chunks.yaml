    \ Indians Diabetes* *training dataset [21]*\n\n**11.4 Summary**\n\nAs you arrive\
    \ at the end of this chapter and inch closer toward the finish\n\nline of the\
    \ entire book, you are beginning to observe the versatility and\n\nimpact of Streamlit\
    \ in real-world use cases. It is becoming ever clearer\n\nthat a pure Python web\
    \ framework is indeed able to address and solve\n\nvarious problems at hand. From\
    \ applications related to data visualization,\n\ntime-series analysis, SCADA data\
    \ loggers, motor command and control\n\ndashboards, data warehousing, and finally\
    \ machine learning as a service,\n\nwe have learned that the mighty Streamlit\
    \ caters to a breadth of diverse\n\npurposes. Furthermore, we saw how it is possible\
    \ to interface Streamlit\n\nwith external systems, the likes of Arduino microcontrollers,\
    \ sensors,\n\nand other peripherals, to scale into the world of embedded systems.\
    \ And\n\nperhaps this is only the tip of the iceberg. The point is that Streamlit\
    \ is what you make of it and whatever your selected tech stack equips you to do.\n\
    \n**CHAPTER 12**\n\n**Streamlit at Work**\n\nThis final chapter introduces two\
    \ real-world cases that have taken\n\nadvantage of Streamlit to develop web applications\
    \ in some capacity. The\n\nfirst case covers the technical development of a data\
    \ manager application\n\nfor wind farms for Iberdrola – a renewable energy firm.\
    \ We can observe\n\nhow this application is being used to estimate electrical\
    \ losses during\n\nproduction and to obtain valuable insights from Iberdrola’s\
    \ SCADA data.\n\nThe second case divulges the utility of Streamlit for industrial\
    \ applications\n\nwith maxon Group – a manufacturer of high-precision electronic\
    \ motors.\n\nSpecifically, we can see that Streamlit can be used to create a command\n\
    \nand control dashboard application to control the maxon motors of a\n\nsurgical\
    \ scope adapter system both locally and remotely.\n\n**12.1 Streamlit in Clean\
    \ Energy: *Iberdrola***\n\nIberdrola is a multinational electric utility with\
    \ operations in more than 30\n\ncountries in the world. Since its inception, Iberdrola\
    \ has been dedicated to\n\ndeveloping a clean and reliable business model based\
    \ on investments in\n\nrenewable energy and is now one of the world’s largest\
    \ renewable energy\n\noperators in terms of installed capacity. Iberdrola’s renewable\
    \ energy\n\nactivities are one of its three strategic business units, alongside\
    \ networks\n\nand wholesale/retail solutions.\n\n© Mohammad Khorasani, Mohamed\
    \ Abdou, Javier Hernández Fernández 2022\n\nM. Khorasani et al., *Web Application\
    \ Development with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6_12](https://doi.org/10.1007/978-1-4842-8111-6_12#DOI)\n\
    \n![](index-384_1.jpg)\n\nChapter 12 Streamlit at Work\n\nThe renewable business\
    \ of Iberdrola generates electrical energy from\n\nclean resources such as wind\
    \ (onshore and offshore), hydro, photovoltaic,\n\nbiomass, and others. In the\
    \ coming five years, Iberdrola will invest €75\n\nbillion in renewable energy\
    \ and other projects. By the end of the period,\n\nrenewables will account for\
    \ 51% of this organic investment (over €34\n\nbillion), with a capacity of 60\
    \ GW. Similarly, the company forecasts\n\nindicate an increase in installed renewable\
    \ capacity to 95 GW by 2030\\. The\n\ngroup’s commitment will allow it to assist\
    \ offshore wind technology (reach\n\n4 GW installed by 2025), develop solar photovoltaic\
    \ (reach 16 GW installed\n\nby 2025), and increase its renewable generation capacity\
    \ to more than\n\n100 GW. This renewable growth is backed by the Paris Agreement\
    \ which\n\naims to cut greenhouse gas emissions and limit global warming below\n\
    \ntwo degrees Celsius. The agreement was ratified in 2016, at COP21 held\n\nin\
    \ France with 147 countries joining it. It came into force in November\n\n2018\
    \ after enough countries joined it for meeting their respective targets\n\nof\
    \ emission cuts. The firm’s renewable unit, in addition to generating\n\nclean\
    \ electricity, finances research and development to help advance\n\nnew technologies\
    \ that will ensure that green energies continue to play an\n\nincreasingly crucial\
    \ role in Iberdrola’s portfolio over the next few years.\n\n![](index-385_1.jpg)\n\
    \nChapter 12 Streamlit at Work\n\n***Figure 12-1.** Wikinger offshore wind farm.\
    \ Sour[ce: Iberdrola.](http://iberdrola.com)*\n\n[*com*](http://iberdrola.com)\
    \ *[14]*\n\n**12.1.1 Visualizing Operational Performance**\n\n**of Wind Farms**\n\
    \nDaniel Paredes and Jerome Dumont, both members of the Energy\n\nResource department,\
    \ have spent years developing algorithms and tailor-\n\nmade software to analyze\
    \ Iberdrola’s wind farms. In particular, the use\n\ncase being discussed here\
    \ focuses on a program that analyzes wind farm\n\noperational data to obtain energy\
    \ yield assessment and identify variations.\n\nOperational performance studies\
    \ and energy yield assessments are\n\nintegral and essential components within\
    \ the life cycle management of a\n\nwind farm. At Iberdrola, the utmost attention\
    \ is paid to the running and\n\noptimization of wind farms, which are constantly\
    \ inspected for deviations.\n\nTo this end, a novel and in-house software solution\
    \ was rendered to\n\naddress the needs of operational performance analysis – the\
    \ Operational\n\nWind Farm data manager hereinafter referred to as OWFdm. The\n\
    \npresence of such software adds value by automating and streamlining\n\nChapter\
    \ 12 Streamlit at Work\n\ncomputations that would be otherwise done manually,\
    \ accommodating\n\nthe requirements of operational technicians and engineers alike.\
    \ Initially\n\ndeveloped with Python and the QT GUI framework, OWFdm was able\n\
    \nto address the needs of operational analysis; however, a complete\n\ndeployment\
    \ to the cloud would provide greater potential and pave the way\n\nto accommodate\
    \ additional utilities for the end users. The justification\n\nfor migrating the\
    \ OWFdm to the cloud as a web application included\n\ntechnical reasons (scalability,\
    \ accessibility, access to network resources\n\nand databases) as well as the\
    \ need for a more powerful visualization\n\nlibrary that would largely replace\
    \ the role of Matplotlib and QT. As all the\n\nalgorithms were already implemented\
    \ in Python, a web framework was\n\nrequired to interface with the web browser.\
    \ For this purpose, Streamlit\n\nwas introduced to take on the role of creating\
    \ the frontend interface. As a\n\npure Python package, Streamlit required a very\
    \ shallow learning curve and\n\nreduced the burden of the developers of having\
    \ to code in HTML or CSS. In\n\naddition, Streamlit provided an integrated development\
    \ environment\n\n(IDE) that allowed for rapid development.\n\nIn collaboration\
    \ with Iberdrola Innovation Middle East, a research\n\ncenter devoted to developing\
    \ innovative solutions in smart grids and\n\ndistributed renewable energy integration,\
    \ a redesign and enhancement\n\nof the functionality of the OWFdm tool was developed.\
    \ In the following\n\nsections, we will look at some of the Streamlit-based graphical\n\
    \nrepresentations utilized by the Iberdrola wind engineers.\n\n**12.1.2 Wind Turbine\
    \ Power Curves**\n\nWind turbines are mechanical devices that convert kinetic\
    \ energy (energy\n\ndue to movement) in wind into electrical power. They do this\
    \ by using\n\nthree main components: a rotor, a generator, and a tower. The blades\
    \ of\n\na turbine are connected to the rotor. When the blades move, they cause\n\
    \nthe shaft of the generator to spin. The type of wire used in wind turbines is\n\
    \nChapter 12 Streamlit at Work\n\nknown as a multistrand wire and is composed\
    \ of many individual strands\n\nof copper wire twisted together and covered with\
    \ an outer protective\n\ncovering.\n\nThe power output for a wind turbine depends\
    \ on the density of the air,\n\nwhich is affected by both altitude and climate.\
    \ The power output for wind\n\nturbines ranges from a few kW to the 14MW of the\
    \ GE Haliade-X offshore,\n\nwhich is the most powerful turbine available in the\
    \ market at the time of the\n\nwriting of this book [17, 18]. A large industrial-type\
    \ onshore wind turbine\n\nsuch as those populating our countryside usually ranges\
    \ between 2 and\n\n4MW, with a rotor diameter ranging around 130 meters. The power\
    \ output for\n\nsmall wind turbines is typically measured in watts (W), while\
    \ large industrial\n\ntypes are often measured in megawatts (MW). A wind turbine\
    \ with a 100W\n\npower output will meet the needs of an average household, while\
    \ one that has\n\n3000W can power anything from a small business to an entire\
    \ neighborhood.\n\nA turbine’s energy production is proportional to the third\
    \ power of its blade\n\nlength, so doubling the blade length would produce eight\
    \ times as much\n\npower. Doubling the blade span (the length of the arc that\
    \ the blades sweep\n\nthrough when making a full rotation) would produce 16 times\
    \ as much power.\n\nThe power curve of a wind turbine is a graph that shows how\
    \ much\n\nelectrical energy the turbine will generate at different wind speeds.\
    \ Power\n\ncurves for wind turbines are usually created by testing an actual turbine\
    \ at\n\nspecific sites under similar wind conditions and measuring its electrical\n\
    \noutput at each point either with a wattmeter or a power analyzer. Wind\n\nturbines\
    \ are tested at different wind speeds, and the turbine’s power\n\noutput is measured\
    \ and recorded as a function of wind speed to generate\n\na wind speed vs. power\
    \ curve for that particular site. A power curve is\n\ntypically represented as\
    \ a graph with wind speed on the x axis and turbine\n\npower output on the y axis.\
    \ The wind speed axis can be given in either\n\nactual or average (rated) values.\
    \ A rated value is the speed at which the\n\nturbine’s power output matches its\
    \ maximum capability during normal\n\nweather conditions at that site. The typical\
    \ power curve for a modern\n\nindustrial three-blade horizontal axis wind turbine\
    \ is shown in Figure [12-2.](#index_split_002.html#p388)\n\n![](index-388_1.jpg)\n\
    \nChapter 12 Streamlit at Work\n\nSince the initial wind speed is zero, the turbine’s\
    \ power output begins\n\nat zero and gradually increases as wind speeds increase.\
    \ Wind turbines\n\nhave to be able to produce electricity even when the wind is\
    \ blowing\n\nbelow their rated speed – this is called a cut-in speed. The cut-in\
    \ speed of a\n\nturbine will depend on its overall size and design, but there\
    \ is a minimum\n\nspeed below which the turbine will not produce any power. As\
    \ wind speed\n\ncontinues to increase, so does power output until it reaches its\
    \ rated value.\n\nAt this point, the power curve flattens and remains constant\
    \ until wind\n\nspeeds go beyond the rated value. In the cut-out speed point,\
    \ where there\n\nis a sudden drop in rotational speed and power output, most turbines\
    \ will\n\nenter an automatic braking mode. Wind turbines are designed with an\n\
    \noptimum efficiency point (limit point) where all the power in the wind\n\ngoes\
    \ into turning the rotor; beyond this limit, no more torque can be\n\nconverted,\
    \ and the power output drops dramatically.\n\n***Figure 12-2.** Typical wind turbine\
    \ power output*\n\nChapter 12 Streamlit at Work\n\nIt is a normal procedure to\
    \ compare the power curve provided by\n\nthe turbine manufacturer to the one produced\
    \ with the observed power\n\nduring production. This information is useful to\
    \ wind engineers to perform\n\nenergy assessment reports, maintenance, or performance\
    \ evaluations.\n\nFigur[e 12-3 sho](#index_split_002.html#p390)ws three representations\
    \ in the same graph:\n\n• The power curve as provided by the manufacturer,\n\n\
    *operational power curve* in the legend\n\n• The real or measured power curve,\
    \ *operational power*\n\n*curve (meas)* in the legend\n\n• The three-sigma variance\
    \ of the real power curve,\n\n*operational power curve 3Sigmas* in the legend\n\
    \n• All the data points obtained during the period, *P-v*\n\n*recorded* in the\
    \ legend\n\nGraphs displayed with Plotly and wrapped with Streamlit can provide\n\
    \nan interactive lasso tool that can be used to manually filter outliers. Thanks\n\
    \nto the Streamlit framework, a two-way communication between this chart\n\nand\
    \ other components is executed seamlessly.\n\n**12.1.3 Wind Roses**\n\nA wind\
    \ rose is a graphical depiction of the frequency with which the wind\n\nspeed\
    \ and direction are dispersed at a certain location. Meteorologists\n\nuse wind\
    \ roses to give a concise view of how wind speed and direction are\n\ntypically\
    \ distributed at a particular location. Modern wind roses normally\n\ncontain\
    \ the wind speed, wind direction, time period for which wind data\n\nis valid,\
    \ and other related information. To construct a wind rose, wind\n\nobservations\
    \ from anemometers or wind vanes attached to a building or\n\nsimilar structure\
    \ are plotted on a polar coordinate wind rose. The wind\n\nrose contains both\
    \ the average wind speed and direction during a certain\n\n![](index-390_1.jpg)\n\
    \nChapter 12 Streamlit at Work\n\nperiod for a given location. Wind roses typically\
    \ use 16 cardinal directions,\n\nsuch as NNW (north-northwest), SSW (south-southwest),\
    \ and so forth, or\n\ndivide the 360 degrees into sectors.\n\nFigur[e 12-4 sho](#index_split_002.html#p391)ws\
    \ a division in eight wind sectors of the wind speed direction of two wind turbines.\
    \ The graph is displayed using Streamlit’s\n\n*st.plotly_chart* element with the\
    \ *go.Scatterpolar* class from *plotly.graph_*\n\n*objects*.\n\n***Figure 12-3.**\
    \ Graph with the different wind turbine power curves*\n\n![](index-391_1.jpg)\n\
    \nChapter 12 Streamlit at Work\n\n***Figure 12-4.** Comparison of two wind turbine\
    \ wind roses*\n\n**12.1.4 Heat Maps**\n\nA heat map is a picture that depicts\
    \ data using colors to represent values.\n\nA heat map can depict graphs other\
    \ than numbers, for example, graphs\n\nof graphs. This is more typically known\
    \ as a matrix plot. The heat map in\n\nFigur[e 12-5 gr](#index_split_002.html#p392)aphs\
    \ the average active power in watts produced by a wind turbine per hour during\
    \ each month. Yellow cells signify a higher value (a\n\nmaximum of 1000 watts),\
    \ while purple indicates no production. This type\n\nof graph offers wind engineers\
    \ a holistic view of the production patterns\n\nper turbine. For instance, and\
    \ for this specific case, we can infer that\n\nNovember is the windiest month\
    \ and that the hours around 5 am usually\n\nshow lower production rates. The graph\
    \ has been rendered using Plotly\n\nand is displayed using Streamlit.\n\n![](index-392_1.jpg)\n\
    \nChapter 12 Streamlit at Work\n\n***Figure 12-5.** Wind turbine hourly average\
    \ production per month*\n\n*heat map*\n\n**12.1.5 Closing Remarks**\n\nBeyond\
    \ the visualization capabilities, Streamlit has proven to be a highly\n\nversatile\
    \ tool for Iberdrola renewables, enabling us to render multiple\n\ndatasets on\
    \ demand by prompting the user to select what data they want\n\nto display, as\
    \ opposed to having to manually program that into the source\n\ncode. A two-way\
    \ communication with charts in pure Python is also of great\n\nvalue, for instance,\
    \ implementing the functionality provided by the lasso\n\ntool for manual filtering\
    \ used in Figur[e 12-3 w](#index_split_002.html#p390)ould have required some integration\
    \ efforts with JavaScript or other workarounds. A final advantage\n\nis a possibility\
    \ of rendering charts as HTML on a website, making them\n\ninteractable with other\
    \ widgets, as opposed to running it stand-alone\n\nlocally without any other third-party\
    \ interactions.\n\n*This publication is supported by Iberdrola S.A. as part of\
    \ its innovation*\n\n*department research studies. Its contents are solely the\
    \ responsibility of the* *authors and do not necessarily represent the official\
    \ views of Iberdrola Group.*\n\n![](index-393_1.jpg)\n\nChapter 12 Streamlit at\
    \ Work\n\n**12.2 Streamlit in Industry: *maxon Group***\n\nmaxon Group is a Swiss\
    \ manufacturer and distributor of industrial-scale\n\nelectronic motors used for\
    \ high-precision and cutting-edge applications.\n\nSpecifically, maxon’s products\
    \ are utilized extensively for a wide variety\n\nof industrial purposes, including\
    \ but not limited to the healthcare,\n\naerospace, automotive, and packaging industries,\
    \ to name a few. The\n\nversatility of their products, combined with phenomenal\
    \ build quality\n\nand impeccable customer service, enables developers to meet\
    \ and exceed\n\nhighly demanding performance requirements, both above and below\n\
    \nthe atmosphere. Their product catalog hosts a multitude of brushed,\n\nbrushless,\
    \ AC, and DC motors, with an assortment of gearboxes, encoders,\n\nHall effect\
    \ sensors, and most importantly a set of motor controllers\n\nthat can be commanded\
    \ via RS232, USB, CANopen, and EtherCAT\n\ncommunication protocols. In addition,\
    \ maxon offers a high degree of\n\ncustomizability whereby the dimensions, mechanical\
    \ interfaces, cables,\n\nbearings, and other features of the drive disposition\
    \ can be configured\n\nexactly as they are required.\n\n***Figure 12-6.** Disposition\
    \ of a maxon GPX Speed 13 reduction*\n\n*gearbox, ECX Speed 13M brushless motor,\
    \ and ENX13 encoder*\n\n![](index-394_1.jpg)\n\nChapter 12 Streamlit at Work\n\
    \n***Figure 12-7.** maxon EPOS4 Compact 24/1.5 CAN motor controller*\n\n**12.2.1\
    \ Developing a Novel Surgical Scope**\n\n**Adapter System for Minimally**\n\n\
    **Invasive Laparoscopy**\n\nMinimally invasive surgery, otherwise known as laparoscopy,\
    \ is becoming\n\nincreasingly prevalent as the operation of choice for surgeries\
    \ on the\n\nabdomen. Given the small size of the incisions that are made to the\
    \ body,\n\nlaparoscopy affords patients a shorter recovery period and a mitigated\n\
    \npossibility of developing complications during and after the surgery.\n\nCurrently,\
    \ such operations are conducted manually with a surgical\n\nassistant holding\
    \ and articulating the endoscope that is inserted into\n\nthe abdomen to view\
    \ the region being operated on in real time (shown\n\nin Figure [12-8](#index_split_002.html#p396)).\
    \ Considering that a human operator is involved in this arrangement, a high level\
    \ of dexterity and hand-eye coordination is\n\nrequired; any inaccuracy, however\
    \ slight, may introduce unwarranted\n\nerror into the operation.\n\nChapter 12\
    \ Streamlit at Work\n\nConsequently, a novel scope adapter concept (shown in Figure\
    \ [12-9)](#index_split_002.html#p396)\n\nwas developed and prototyped by Dr. Nikhil\
    \ Navkar and Mohammad\n\nKhorasani to mitigate the effects of including a human\
    \ operator in the\n\nfeedback loop. In this implementation, the endoscope and\
    \ associated\n\ncamera head are held and controlled via a UR5 robotic arm offering\
    \ six\n\ndegrees of freedom, with an additional two degrees of freedom built into\n\
    \nthe adapter itself enabling the rotation of the scope and camera head\n\naround\
    \ its axis and the angulation of the scope tip. The rotation is powered\n\nby\
    \ a maxon ECX brushless motor, while the angulation is powered by\n\na maxon brushed\
    \ DCX motor. Each motor is coupled with a reduction\n\ngearbox that offers a top\
    \ speed of 20 and 16 RPM for the rotation and\n\nangulation motors, respectively,\
    \ and a three-channel optical encoder that\n\nprovides a resolution of 4096 and\
    \ 2048 steps per revolution, respectively.\n\nOther advantages associated with\
    \ the surgical scope adapter include\n\nthe following:\n\n• Ability to support\
    \ different endoscopes, camera heads,\n\nand robotic arms\n\n• Can be controlled\
    \ with a variety of inputs including a\n\njoystick or by tracking optical markers\
    \ attached to the\n\nsurgeon’s head\n\n• Can be programmed to reduce human error\
    \ and\n\nunintended movements\n\n• Reduces operator strain and fatigue by eliminating\
    \ the\n\nneed to manually hold the scope\n\n![](index-396_1.jpg)\n\n![](index-396_2.jpg)\n\
    \nChapter 12 Streamlit at Work\n\n***Figure 12-8.** Schematic of an endoscope\
    \ inserted into the abdomen*\n\n***Figure 12-9.** Engineering drawing of the maxon\
    \ powered surgical*\n\n*scope adapter*\n\n![](index-397_1.jpg)\n\nChapter 12 Streamlit\
    \ at Work\n\n**12.2.2 Streamlit Command**\n\n**and Control Dashboard**\n\nUpon\
    \ completion of the mechanical prototype of the surgical scope\n\nadapter, a Streamlit\
    \ application was developed to render a dashboard\n\nwith the speed and position\
    \ of the rotation and angulation motors in real\n\ntime as shown in Figure [12-10.\
    \ I](#index_split_002.html#p397)n addition, the Streamlit application was interfaced\
    \ with a three-axis joystick that was used to control each of the\n\nmaxon motors\
    \ as shown in Figure [12-11\\. F](#index_split_002.html#p398)urthermore, by port\
    \ forwarding the Streamlit application, it was possible to control the motors\
    \ remotely\n\nover the Internet. This is of particular interest for telesurgery,\
    \ whereby an\n\noperator can partake in a surgery without physically being present\
    \ within\n\nthe premises of the hospital. Albeit with certain limitations, since\
    \ with\n\nremote control over long distances there is increased latency, which\
    \ may\n\ninhibit the performance of the device.\n\n***Figure 12-10.** Streamlit\
    \ command and control dashboard for the*\n\n*surgical scope adapter*\n\n![](index-398_1.jpg)\n\
    \nChapter 12 Streamlit at Work\n\n***Figure 12-11.** Prototype of the surgical\
    \ scope adapter with the*\n\n*Streamlit command and control dashboard*\n\n**12.2.3\
    \ Closing Remarks**\n\nWhile Streamlit is branded as a framework for machine learning\
    \ and\n\ndata science applications, it does possess enough versatility to be\n\
    \nused for a variety of purposes. As shown in this instance, Streamlit was\n\n\
    effectively utilized to bridge several nontrivial subsystems together into\n\n\
    one contiguous system. Specifically, Streamlit was used to interface the\n\nmaxon\
    \ motors with a joystick, enable remote control over the local area\n\nnetwork\
    \ as well as the Internet, and also to provide a real-time dashboard\n\ndisplaying\
    \ the motors’ position and speed all in a few lines of code.\n\n*This work was\
    \ supported by National Priority Research Program*\n\n*(NPRP) award (NPRP13S-0116-200084)\
    \ from the Qatar National Research*\n\n*Fund (a member of The Qatar Foundation)\
    \ and IRGC-04-JI-17-138 award*\n\n*from Medical Research Center (MRC) at Hamad\
    \ Medical Corporation*\n\n*(HMC). All opinions, findings, conclusions, or recommendations\
    \ expressed*\n\n*in this work are those of the authors and do not necessarily\
    \ reflect the views* *of our sponsors.*\n\nChapter 12 Streamlit at Work\n\n**12.3\
    \ Summary**\n\nIn this final chapter, we have been acquainted with two real-world\n\
    \ninstances of Streamlit being utilized effectively for commercial and\n\nindustrial\
    \ activities. Namely, the first case demonstrates how Iberdrola –\n\na renewable\
    \ energy firm – is using Streamlit to create a corporate data\n\nmanagement application\
    \ for their wind farms, to estimate electrical losses\n\nduring production. The\
    \ second case expands on an industrial use case\n\nwhereby high-precision electronic\
    \ motors manufactured by maxon Group\n\nare being commanded and controlled via\
    \ a Streamlit application, for use\n\nwithin a surgical scope adapter system.\
    \ Both examples serve to provide\n\nevidence of the utility that Streamlit is\
    \ offering to the corporate world\n\nand beyond.\n\n**APPENDIX A**\n\n**Streamlit\
    \ Application**\n\n**Program Interface**\n\n**A.1 The Streamlit API**\n\nThe Streamlit\
    \ application program interface, hereafter referred to as\n\nthe Streamlit API,\
    \ is the bread and butter of what our formidable web\n\nframework has to offer\
    \ the world. With several dozen native commands\n\nthat cater to rendering text,\
    \ tables, charts, input widgets, and multimedia\n\nwidgets to enacting page layout,\
    \ data management, state management,\n\nas well as a whole host of other utilities,\
    \ it is a comprehensive library that\n\none should acquaint themselves with before\
    \ proceeding to developing an\n\napplication.\n\n**A.1.1 Displaying Text**\n\n\
    The first series of commands in the Streamlit API accommodate to perhaps\n\nthe\
    \ most primitive need of any web application, namely, that of displaying\n\ntext\
    \ in all of its variety. In this section, we will present the commands that\n\n\
    allow you to display text, rich text, tables, dataframes, plots, markdown,\n\n\
    and more.\n\n© Mohammad Khorasani, Mohamed Abdou, Javier Hernández Fernández 2022\n\
    \nM. Khorasani et al., *Web Application Development with Streamlit*,\n\n[https://doi.org/10.1007/978-1-4842-8111-6](https://doi.org/10.1007/978-1-4842-8111-6)\n\
    \nAPPenDiX A STReAMLiT APPLiCATion PRoGRAM inTeRfACe\n\n**Write**\n\nStreamlit\
    \ can display a variety of inputs including but not limited to text,\n\ndataframes,\
    \ and plots using the *st.write(*args, unsafe_allow_html=False)*\n\ncommand. In\
    \ addition, this command has the following unique attributes:\n\n• You may pass\
    \ multiple arguments, and all of them will\n\nbe rendered.\n\n• It will render\
    \ differently depending on the input.\n\n• The return value of the function is\
    \ None; therefore, its\n\nplace in the application cannot be reused.\n\n***Table\
    \ A-1.** st.write parameters*\n\n**Parameter**\n\n**Description**\n\n*args( *any*\
    \ )\n\nCan be used with the following inputs:\n\n• string: Renders text, LaTeX\
    \ expressions, and emoji shortcodes\n\n• Data_frame: Displays a dataframe as a\
    \ table\n\n• error: Displays a code exception\n\n• func: Displays information\
    \ about the function\n\n• module: Displays information about the module\n\n• dict:\
    \ Displays a dictionary as an interactive widget\n\n• mpl_fig: Renders a Matplotlib\
    \ plot\n\n• altair: Renders an Altair plot\n\n• keras: Renders a Keras model\n\
    \n• graphviz: Renders a Graphviz graph\n\n• plotly_fig: Renders a Plotly plot\n\
    \n• bokeh_fig: Renders a Bokeh plot\n\n• sympy_expr: Displays a SymPy expression\
    \ formatted as LaTeX\n\n• htmlable: displays_repr_html_( ) for the object if available\n\
    \n• obj: Prints the string of an object\n\n( *continued*)\n\n![](index-402_1.png)\n\
    \n![](index-402_2.png)\n\n![](index-402_3.jpg)\n\nAPPenDiX A STReAMLiT APPLiCATion\
    \ PRoGRAM inTeRfACe\n\n***Table A-1.*** ( *continued*)\n\n**Parameter**\n\n**Description**\n\
    \nUnsafe_allow_ By default, any HTML detected will be escaped and treated as text.\n\
    \nhtml( *bool* )\n\nThis may be turned off by setting this argument to True, although\n\
    \nthis is not recommended as it may compromise the users’ security.\n\nDisplaying\
    \ text with st.write will be formatted as plain text:\n\nst.write('Hello world')\n\
    \nMarkdown format can be used too:\n\nst.write('**_Hello_ world**')\n\nOutputting:\n\
    \nObjects can be passed as arguments, such as dataframes:\n\n**import** pandas\
    \ as pd\n\nst.write(pd.DataFrame({\n\n'Column 1': [1, 2, 3, 4],\n\n'Column 2':\
    \ [5, 6, 7, 8],\n\n}))\n\nThe resulting dataframe will be rendered into a nicely\
    \ formatted table:\n\n![](index-403_1.png)\n\n![](index-403_2.png)\n\n![](index-403_3.jpg)\n\
    \nAPPenDiX A STReAMLiT APPLiCATion PRoGRAM inTeRfACe\n\nSeveral arguments can\
    \ be passed in the same call and will be printed\n\nin order:\n\nst.write('A +\
    \ B =', 'C')\n\nDifferent objects can be used like the following example with\
    \ plain text\n\nand a dataframe:\n\nst.write('Hello world', dataframe)\n\nCharts,\
    \ figures, and models, such as described in the command pa-\n\nrameters, can also\
    \ be displayed directly using st.write:\n\n**import** pandas as pd\n\n**import**\
    \ numpy as np\n\n**import** altair as alt\n\ndataframe = pd.DataFrame(\n\nnp.random.randn(200,\
    \ 3),\n\ncolumns=['x', 'y', 'z'])\n\nplot = alt.Chart(dataframe).mark_circle().encode(\n\
    \nx='x', y='y', size='z', color='z', tooltip=['x',\n\n'y', 'z'])\n\nst.write(plot)\n\
    \n![](index-404_1.jpg)\n\n![](index-404_2.png)\n\nAPPenDiX A STReAMLiT APPLiCATion\
    \ PRoGRAM inTeRfACe\n\nUsing st.write is a simple, fast, and convenient way to\
    \ display data,\n\nbut more control over the visualization can be obtained using\
    \ specific API\n\ncommands. The following subsections will offer a more comprehensive\
    \ set\n\nof tools to display and visualize all types of elements along with the\
    \ avail-\n\nable options to customize the look and feel of the output.\n\n**Text**\n\
    \nStreamlit displays plain text using the *st.text(str)* command.\n\n***Table\
    \ A-2.** st.text parameters*\n\n**Parameter**\n\n**Description**\n\nbody( *str*\
    \ )\n\nThe string to display.\n\nFormatted text can be displayed using the *st.text(body)*\
    \ command:\n\nst.text('Hello world')\n\nNote that the results are equivalent to\
    \ the st.write text when inputted\n\nas pure text.\n\n![](index-405_1.jpg)\n\n\
    APPenDiX A STReAMLiT APPLiCATion PRoGRAM inTeRfACe\n\n**Markdown**\n\nStreamlit\
    \ can display strings formatted as markdown using the *st.*\n\n*markdown(body,unsafe_allow_html=False)*\
    \ command.\n\n***Table A-3.** st.markdown parameters*\n\n**Parameter**\n\n**Description**\n\
    \nbody( *str* )\n\n• Can be used to display string as GitHub-style markdown.\n\
    \nfor additional information, refer to [*https://github.*](https://github.github.com/gfm)\n\
    \n[*github.com/gfm*.](https://github.github.com/gfm)\n\n• Can also be used with\
    \ emoji shortcodes. for additional\n\ninformation on all supported shortcodes,\
    \ [refer to *https://*](https://raw.githubusercontent.com/omnidan/node-emoji/master/lib/emoji.json)\n\
    \n[*raw.githubusercontent.com/omnidan/node-emoji/*](https://raw.githubusercontent.com/omnidan/node-emoji/master/lib/emoji.json)\n\
    \n[*master/lib/emoji.json*](https://raw.githubusercontent.com/omnidan/node-emoji/master/lib/emoji.json).\n\
    \n• Can also be used with LaTeX expressions by wrapping them in\n\n*$* or *$$*.\
    \ for additional information, refer to [*https://katex.*](https://katex.org/docs/supported.html)\n\
    \n[*org/docs/supported.html*](https://katex.org/docs/supported.html).\n\nunsafe_allow_\n\
    \nBy default, any HTML detected will be escaped and treated as\n\nhtml( *bool*\
    \ )\n\ntext. This may be turned off by setting this argument to True,\n\nalthough\
    \ this is not recommended as it may compromise the\n\nusers’ security.\n\nStreamlit\
    \ can display markdown formatted text and easily combine it\n\nwith LaTeX and\
    \ emojis:\n\nst.markdown('$\\overline{ANA}$, **_really_ likes** :doughnut:')\n\
    \nAs expected, the results are the same that would be obtained using *st.*\n\n\
    *write* with markdown text:\n\n![](index-406_1.png)\n\nAPPenDiX A STReAMLiT APPLiCATion\
    \ PRoGRAM inTeRfACe\n\nMarkdown is an easy-to-read and easy-to-write plain text\
    \ format that\n\ngives you the ability to render rich text with formatting that\
    \ would have\n\notherwise not been possible with normal text. Specifically, it\
    \ allows you to\n\nwrite bold, italic, hyperlinked, and strike-through text with\
    \ varying sizes. In addition, markdown permits writing tables, displaying images,\
    \ and creating bulleted and numbered lists, as well as quotes, code, and checkboxes.\n\
    \nFor further information, please refer to [*https://guides.github.com/fea-*](https://guides.github.com/features/mastering-markdown/)\n\
    \n[*tures/mastering- markdown/*](https://guides.github.com/features/mastering-markdown/).\
    \ An example of each is shown as follows:\n\n• Header sizes can be used to generate\
    \ headings of\n\nvarious sizes:\n\nst.markdown(\n\n\"'"
