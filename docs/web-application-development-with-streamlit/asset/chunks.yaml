    \ Services **import** get_feed, add_post\n\nAddPostView(add_post)\n\nst.write(\"\
    ___\")\n\nFeedView(get_feed)\n\n**3.4.2 Best Practices for Folder Structuring**\n\
    \nThe example discussed in Section 3.4 can have all the files placed in the\n\n\
    project’s root folder. Even though this can give us a bug-free application,\n\n\
    it can cause entanglements to the code reader if the application continues\n\n\
    growing. Hence, we need to structure the files in folders and expose them\n\n\
    as modules to be plugged in easily and professionally in other Python\n\nscripts.\
    \ A folder structure such as Figur[e 3-17 gr](#index_split_000.html#p127)oups\
    \ similar files together.\n\nThe *_init_.py* script is included in every subfolder\
    \ to export the files within it as modules, as shown in Listin[g 3-23\\. And the](#index_split_000.html#p125)\
    \ *Views/_init_.py* script as shown in Listin[g 3-24](#index_split_000.html#p125)\
    \ exposes an instance of the class instead of the class itself. Note that the\
    \ underscore before the class instance name is\n\njust to rename it in this scope\
    \ to indicate that this is a private property for this script, giving warnings\
    \ to developers trying to access it in some IDEs.\n\n***Listing 3-23.*** Views/__init__.py\n\
    \n**from** .AddPostView **import** AddPostView\n\n**from** .FeedView **import**\
