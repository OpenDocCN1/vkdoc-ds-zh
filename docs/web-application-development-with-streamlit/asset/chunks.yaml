    \ 6:** %s' % (option_6))\n\nChapter 3 arChiteCting the User interfaCe\n\n**Placeholders**\n\
    \nA placeholder is one of the most versatile and powerful features brandished\n\
    \nby Streamlit. By using the *st.empty* or *st.sidebar.empty command*, you have\
    \ the ability to quite literally reserve space at any location on the main\n\n\
    body or sidebar of your application. This can be particularly useful for\n\ndisplaying\
    \ content out of order or on demand after a certain event or\n\ntrigger. A placeholder\
    \ can be invoked by writing *placeholder = st.empty()*, and subsequently any widget\
    \ or element can be attached to it whenever\n\nrequired. For instance, you may\
    \ attach text to it by writing placeholder.\n\ninfo *(’Hello world’)*, and then\
    \ the same placeholder can be replaced by\n\nequating it to another element. And\
    \ finally when it is no longer needed, the\n\nplaceholder can be cleared using\
    \ the *placeholder.empty()* command.\n\n**3.2 Displaying Dynamic Content**\n\n\
    To display dynamic content such as a constantly updating map, chart, or\n\nclock,\
    \ you may place an element within a placeholder and invoke it within\n\na for\
    \ loop or while loop to iterate over many instances of that element. As a\n\n\
    result, the element will appear to be dynamic with a constantly changing state\n\
    \nwith each iteration of the loop. An example of dynamic content is the clock\n\
    \napplication built using a placeholder as shown in Listin[g 3-6](#index_split_000.html#p109)\
    \ and Figures [3-9](#index_split_000.html#p110)\n\n[and 3-10](#index_split_000.html#p111).\
    \ A while loop is being used to constantly update the st.info element to display\
    \ the current time until the time reaches a predefined point, at which the placeholder\
    \ is cleared and the while loop is ended.\n\n***Listing 3-6.*** [placeholder.py](http://placeholder.py)\n\
    \n**import** streamlit as st\n\n**from** datetime **import** datetime\n\nst.title('Clock')\n\
    \nclock = st.empty()\n\n![](index-110_1.jpg)\n\n![](index-110_2.jpg)\n\nChapter\
    \ 3 arChiteCting the User interfaCe\n\n**while** True:\n\ntime = datetime.now().strftime(\"\
    %H:%M:%S\")\n\nclock.info('**Current time: ** %s' % (time))\n\n**if** time ==\
    \ '16:09:50':\n\nclock.empty()\n\nst.warning(‘Alarm!!’)\n\n**break**\n\n***Figure\
