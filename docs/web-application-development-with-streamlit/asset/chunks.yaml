    ## 附录 A STREAMLIT 应用程序接口


    ### 多选下拉框


    通过以下命令可在网站中添加多选下拉部件：


    `st.multiselect(label, options, default=None, format_func=special_internal_function,
    key=None, help=None, on_change=None, args=None, kwargs=None, disabled=False)`
    → `str`


    **表 A-26.** `st.multiselect` 参数


    | 参数 | 说明 |

    |---|---|

    | `label` (`str`) | 多选下拉部件的标签。 |

    | `options` (`Sequence`, `numpy.ndarray`, `pandas.Series`, `pandas.DataFrame`
    或 `pandas.Index`) | 选择选项标签。会自动转换为 `str`。使用 `pandas.DataFrame` 时，将选择第一列作为数据源。 |

    | `index` (`int`) | 首次渲染时预选选项的索引。 |

    | `default` (`[str]` 或 `None`) | 默认值。 |

    | `format_func` (`function`) | 用于修改选择标签的辅助函数。标签的 `str` 值作为参数传入，并根据函数逻辑返回修改后的 `str`。此选项仅用于外观显示，不影响部件的操作或返回值。
    |

    | `key` (`str` 或 `int`) | 在代码中引用该按钮的唯一键，可以是字符串或整数。该参数为可选，若不提供将自动生成。 |

    | `help` (`str`) | 当鼠标悬停在部件上时显示的工具提示。 |

    | `on_change` (`callable`) | 当部件值发生变化时调用的回调函数。 |

    | `args` (`tuple`) | 传递给回调函数的参数元组。 |

    | `kwargs` (`dict`) | 传递给回调函数的关键字参数字典。 |

    | `disabled` (`bool`) | 用于禁用部件的布尔参数。 |


    `![](img/index-444_1.jpg)`


    以下示例展示了一个包含四个选项的多选下拉部件：


    ```python

    options = st.multiselect(''您最喜欢的季节是哪些？'', [''春季'', ''夏季'', ''秋季'', ''冬季''])

    st.write(''您选择了：%s'' % '', ''.join(options))

    ```


    ### 滑块


    通过以下命令可在网站中添加滑块部件：


    `st.slider(label, min_value, max_value, value, step, format, key, help, on_change,
    args, kwargs, disabled=False)` → `value`


    **表 A-27.** `st.slider` 参数


    | 参数 | 说明 |

    |---|---|

    | `label` (`str`) | 说明滑块用途的标签。 |

    | `min_value`（支持的类型 或 `None`） | 允许的最小值。对于 `int` 和 `float`，默认为 `0` 或 `0.0`；对于日期/日期时间值，默认为
    `value – timedelta(days=14)`；对于时间值，默认为 `time.min`。 |

