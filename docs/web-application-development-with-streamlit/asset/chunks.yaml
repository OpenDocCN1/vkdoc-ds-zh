    \ |\n| `width(*整数或 None*)` | 图像宽度。`None` 表示使用图像原始尺寸，只要不超过列的宽度。SVG 图像必须使用此选项，因为它们没有默认图像宽度。\
    \ |\n| `use_column_width(*'auto' 或 'always' 或 'never' 或布尔值*)` | `\"auto\"` 使用图像的自然尺寸，但不超过列的宽度。`True`\
    \ 或 `\"always\"` 将使用列的宽度。`False` 或 `\"never\"` 使用图像的原始尺寸。注意：`use_column_width`\
    \ 优先于 `width` 参数。 |\n| `clamp(*布尔值*)` | 仅适用于字节数组图像，对图像 URL 忽略。Clamp 会将像素值设定在有效范围（每个通道\
