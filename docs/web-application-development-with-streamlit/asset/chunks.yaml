    \ Streamlit still allows including components that are hosted locally, but as\
    \ a trade-off,\n\nthis component imported in the Streamlit application will share\
    \ different\n\nfeatures from the Streamlit app. For instance, if you print the\
    \ current URL\n\nfrom the custom component, it will not give out the same URL\
