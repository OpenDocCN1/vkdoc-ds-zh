    \ only three phases; rather, you can supply a list of all tab names, and the return\
    \ value will be the\n\nselected list item index as might be shown in Listin[g\
    \ 10-15](#index_split_002.html#p306). Numbering and animations are already taken\
    \ care of.\n\n![](index-302_1.jpg)\n\n![](index-302_2.jpg)\n\n![](index-302_3.jpg)\n\
