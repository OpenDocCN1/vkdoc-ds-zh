    ,\n\nexpires: **new** Date(expires_at),\n\n})\n\n**return true**\n\n}\n\n**const**\
    \ getCookie = (cookie) => {\n\n**const** value = cookies.get(cookie)\n\n**return**\
    \ value\n\n}\n\nChapter 10 Building Streamlit ComponentS\n\n**const** deleteCookie\
    \ = (cookie) => {\n\ncookies.remove(cookie, { path: \"/\", samesite: \"strict\"\
