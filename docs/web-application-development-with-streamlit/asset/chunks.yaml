    \n![](index-220_1.jpg)\n\nChapter 7 ImplementIng SeSSIon State\n\n**7.5 Cookie\
    \ Management**\n\nWe have discussed how to store and manage data within a session\
    \ using\n\nnative and workaround approaches. However, what might be missing is\
    \ the\n\nability to manage data between sessions. For instance, storing a counter\n\
    \nof how many times a button has been clicked or even more usefully not\n\nprompting\
    \ the user to log in each and every time they open a new session.\n\nTo do so,\
    \ we require the utility of cookies.\n\nCookies can be used to track a user’s\
    \ actions across many websites or\n\nstore their personal information such as\
    \ authentication tokens. Cookies\n\nare stored and managed on the user’s end,\
    \ specifically, in their browser.\n\nThis means the server doesn’t know about\
    \ its content by default. In order\n\nto check out the cookies on any web application,\
    \ we can simply open\n\ndeveloper tools from the browser and head to the console\
    \ tab. Then type\n\n'document.cookie', and then the cookies will be displayed\
    \ as shown in\n\nFigur[e 7-10.](#index_split_001.html#p220)\n\n***Figure 7-10.**\
    \ A web page cookie*\n\nIn a typical Streamlit application, more unknown cookies\
    \ will appear\n\napart from the one in Figur[e 7-10](#index_split_001.html#p220);\
    \ those might be for advertisement tracking or other purposes. Which might require\
    \ the developer to remove\n\nthem depending on the cookie policy they adopt. Or\
    \ in other cases, the\n\ndeveloper might want to add other cookies to enhance\
    \ the application\n\nexperience. Both actions need a way to manage cookies on\
    \ any web app.\n\nTo manipulate cookies from a Streamlit application, we need\
    \ to use\n\na third-party module or library to make this happen. For this example,\n\
    \nwe will use *Extra-Streamlit-Components* which can be installed with\n\npip\
    \ install extra-streamlit-components and an import naming\n\nconvention as *stx*,\
    \ where the *X* denotes the extra capabilities that can be 198\n\nChapter 7 ImplementIng\
    \ SeSSIon State\n\nprovided on a vanilla Streamlit application. Within this library,\
    \ there is\n\na module called *Cookie Manager* which will be our tool for such\
    \ task.\n\nListin[g 7-9 b](#index_split_001.html#p221)uilds a simple Streamlit\
    \ application with the capability of setting, getting, and deleting cookies. The\
    \ controls are even customizable\n\nbased on the developer needs. For instance,\
    \ an expiration date can be\n\nset to any new cookie added which will autodelete\
    \ itself after the set date\n\nis reached. Figures [7-11 and](#index_split_001.html#p222)\
    \ [7-12 sho](#index_split_001.html#p223)w adding and getting an example authentication\
    \ token, respectively.\n\n***Listing 7-9.*** cookie_management.py\n\n**import**\
    \ streamlit as st\n\n**import** extra_streamlit_components as stx\n\nst.title(\"\
    Cookie Management Demo\")\n\nst.subheader(\"_Featuring Cookie Manager from Extra-Streamlit-\n\
    \nComponents_\")\n\ncookie_manager = stx.CookieManager()\n\nst.subheader(\"All\
    \ Cookies:\")\n\ncookies = cookie_manager.get_all()\n\nst.write(cookies)\n\nc1,\
    \ c2, c3 = st.columns(3)\n\nwith c1:\n\nst.subheader(\"Get Cookie:\")\n\ncookie\
    \ = st.text_input(\"Cookie\", key=\"0\")\n\nclicked = st.button(\"Get\")\n\n**if**\
    \ clicked:\n\nvalue = cookie_manager.get(cookie)\n\nst.write(value)\n\nwith c2:\n\
    \nst.subheader(\"Set Cookie:\")\n\n![](index-222_1.png)\n\nChapter 7 ImplementIng\
    \ SeSSIon State\n\ncookie = st.text_input(\"Cookie\", key=\"1\")\n\nval = st.text_input(\"\
    Value\")\n\n**if** st.button(\"Add\"):\n\ncookie_manager. **set**(cookie, val)\n\
    \nwith c3:\n\nst.subheader(\"Delete Cookie:\")\n\ncookie = st.text_input(\"Cookie\"\
    , key=\"2\")\n\n**if** st.button(\"Delete\"):\n\ncookie_manager.delete(cookie)\n\
    \n***Figure 7-11.** Adding an AuthToken cookie*\n\n![](index-223_1.png)\n\nChapter\
