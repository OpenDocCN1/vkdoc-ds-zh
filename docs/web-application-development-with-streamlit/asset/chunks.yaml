    \nPlease note that the All Cookies section in Figur[es 7-11 and](#index_split_001.html#p222)\
    \ [7-12 is](#index_split_001.html#p223)\n\ndisplayed in a well-structured JSON\
    \ format but has some redacted cookies\n\nfor privacy concern purposes. Good to\
