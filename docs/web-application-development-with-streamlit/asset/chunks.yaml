    \ of Listin[g 2-16](#index_split_000.html#p81)* *)* **2.4 Developing the User\
    \ Interface**\n\nTypically, developing a user interface for a web application\
    \ requires a\n\nseparate skill set that pertains to graphical design and usability\
    \ studies.\n\nA frontend developer will begin by conceptualizing their idea with\
    \ a\n\nwireframe diagram that disposes the elements of a page. This will then\n\
    \niteratively be converted to an actual user interface through testing and\n\n\
    refinements. Streamlit has largely eliminated that undertaking with its\n\nintuitive,\
    \ responsive, and standardized interface, whereby the developer\n\ncan render\
    \ a web page without having to worry about the intricate details\n\nof design.\n\
    \nChapter 2 Streamlit BaSiCS\n\nIn other words, Streamlit interfaces are plug\
    \ and play, allowing the\n\ndeveloper to focus on the logic of their program while\
    \ leaving the visual\n\nimplementation to Streamlit. Should the user require something\
    \ more\n\nbespoke and customized, they are indeed welcome to integrate their\n\
    \nown HTML and/or JavaScript components. Customizability and external\n\ncomponents\
    \ will be addressed in subsequent chapters.\n\nIn this section, we will be developing\
