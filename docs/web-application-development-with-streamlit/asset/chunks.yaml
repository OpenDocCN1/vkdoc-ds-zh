- fmt: "# Streamlit Widget Callbacks and Forms\n\n`on_change(*callable*)` - Callback\
    \ function invoked when the widget’s value changes.\n\n`args(*tuple*)` - Tuple\
    \ of arguments to pass to the callback.\n\n`kwargs(*dict*)` - Dictionary of keyword\
    \ arguments to pass to the callback.\n\n`disabled(*bool*)` - Boolean argument\
    \ used to disable the widget.\n\nThe following code shows the color selection\
    \ widget implementation, with black (hexadecimal value `#000000`) as the default\
    \ selection.\n\n```\ncolor = st.color_picker(label = 'Select a Color', value =\
    \ '#000000')\n```\n\n## Forms\n\nYou may encapsulate several widgets together\
    \ into one form using Streamlit’s `st.form(key, clear_on_submit=False)` command.\
    \ The added benefit of using a form is that Streamlit will not rerun the entire\
    \ script each time you interact with one of the widgets within it, as it normally\
    \ would. Instead, Streamlit will only rerun once you click the associated button\
    \ using the command `st.form_submit_button(label='Submit', help=None, on_click,\
    \ args, kwargs)` ➤ `bool`.\n\n### Table A-37. `st.form` parameters\n\n| **Parameter**\
    \ | **Description** |\n| --- | --- |\n| `key(*str*)` | A unique string that may\
    \ be used to identify the form. |\n| `clear_on_submit(*bool*)` | If this argument\
    \ is set to true, all of the widgets inside the form will be reset to their default\
    \ values after the form submit widget’s value changes. |\n\n### Table A-38. `st.form_submit_button`\
    \ parameters\n\n| **Parameter** | **Description** |\n| --- | --- |\n| `label(*str*)`\
    \ | Label to be displayed in the button. |\n| `help(*str or None*)` | Tooltip\
    \ to be displayed when the cursor is hovered over the widget. |\n| `on_click(*callable*)`\
    \ | Callback function called when the button is clicked. |\n| `args(*tuple*)`\
    \ | Tuple of arguments to pass to the callback. |\n| `kwargs(*dict*)` | Dictionary\
    \ of keyword arguments to pass to the callback. |\n\nThe following example shows\
    \ how a Streamlit form and form submit button may be used together:\n\n```\nwith\
    \ st.form('form_1'):\n    radio = st.radio('Radio button', ['Hello','World'])\n\
    \    checkbox = st.checkbox('Hello world')\n    if st.form_submit_button('Submit\
    \ form'):\n        st.write('Radio: %s' % radio, 'Checkbox:', checkbox)\n```\n\
    \n## A.1.5 Displaying Interactive Widgets\n\nStreamlit makes it rather simple\
    \ to render multimedia content regardless of its source. Whether it is a local\
    \ image saved on disk, or a video accessed via a URL, or even an array with the\
    \ raw data of a sound file, you have the ability to display and play multimedia\
    \ using Streamlit’s native commands without any further effort on your behalf.\n\
    \n### Displaying Images\n\nWe can easily insert images using the following command:\
    \ `st.image(image, caption, width, use_column_width, clamp, channels='RGB', output_format='auto')`.\n\
    \n### Table A-39. `st.image` parameters\n\n| **Parameter** | **Description** |\n\
    | --- | --- |\n| `image(*numpy.ndarray, [numpy.ndarray], BytesIO, str, or [str]*)`\
    \ | One or a list of the following: monochrome image (w,h) or (w,h,1), color image\
    \ (w,h,3), RGBA image (w,h,4), URL of image, path of a local image, VG XML string.\
    \ |\n| `caption(*str or list of str*)` | Image caption. A list of captions should\
    \ be used if multiple images are displayed (one per image). |\n| `width(*int or\
    \ None*)` | Image width. `None` uses the image size as long as it does not exceed\
    \ the width of the column. SVG images must use this option as they have no default\
    \ image width. |\n| `use_column_width(*'auto' or 'always' or 'never' or bool*)`\
    \ | `\"auto\"` uses the natural image size without exceeding the width of the\
    \ column. `True` or `\"always\"` will use the column width. `False` or `\"never\"\
    ` uses the image’s natural size. Note: `use_column_width` takes precedence over\
    \ the `width` parameter. |\n| `clamp(*bool*)` | Only applicable for byte array\
    \ images and ignored for image URLs. Clamp will set the pixel values to a valid\
    \ range (`[0–255]` per channel). If required and not set, the image will have\
    \ out-of-range values, and an error will be thrown. |\n| `channels(*'RGB' or 'BGR'*)`\
    \ | For `nd.array`, this parameter indicates the color information. Defaults to\
    \ `\"RGB\"`, or `[:, :, 0]` for red, `[:, :, 1]` for green, `[:, :, 2]` for blue.\
    \ |"
