    ## Title, Header, and Subheader


    Typography in Streamlit can be managed using a three-level hierarchy of title,
    header, and subheader. The commands follow the same naming and accept the same
    parameterization: `st.title(body, anchor=None)`, `st.header(body, anchor=None)`,
    and `st.subheader(body, anchor=None)`.


    **Table A-4.** `st.title`, `st.header`, and `st.subheader` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `body` (`str`) | The string to display. |

    | `anchor` (`str`) | The anchor name of the title/header/subheader that can be
    accessed with `#anchor` in the URL. If the anchor is not invoked, Streamlit will
    automatically generate an anchor using the body text. |


    The format used by Streamlit for the three hierarchical typographies is as follows:


    ```

    st.title(''Title'')

    st.header(''Header'')

    st.subheader(''Subheader'')

    ```


    ## Caption


    Streamlit displays captions with small text using the `st.caption(str)` command.


    **Table A-5.** `st.caption` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `body` (`str`) | The string to display. |


    Smaller text can be displayed using the caption API for those cases where subheadings
    or alternative titles are needed:


    ```

    st.title(''Title'')

    st.header(''Header'')

    st.subheader(''Subheader'')

    st.text(''Text'')

    st.caption(''Caption'')

    ```


    ## Code


    Streamlit renders code with syntax highlighting using the `st.code(body, language=''python'')`
    command.


    **Table A-6.** `st.code` parameters


    | Parameter | Description |

    |-----------|-------------|

    | `body` (`str`) | The string to display as code. |

    | `language` (`str`) | The programming language that the code is written in (used
    for rendering and syntax highlighting). If the language is not set, the code will
    be left without styling. |


    The following example displays a block of Python code:


    ```

    code = """*def hello_world(input)*:

    *print(input)*"""

    st.code(code, language=''python'')

    ```


