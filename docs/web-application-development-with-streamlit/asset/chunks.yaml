    ## APPENDIX A STREAMLIT APPLICATION PROGRAM INTERFACE


    ### Multiselect Box


    A multiple selection widget can be added to our websites with the following command:


    `st.multiselect(label, options, default=None, format_func=special_internal_function,
    key=None, help=None, on_change=None, args=None, kwargs=None, disabled=False)`
    → `str`


    **Table A-26.** `st.multiselect` parameters


    | Parameter | Description |

    |---|---|

    | `label` (`str`) | Label of the multiselect widget. |

    | `options` (`Sequence`, `numpy.ndarray`, `pandas.Series`, `pandas.DataFrame`,
    or `pandas.Index`) | Select option labels. It will automatically cast to `str`.
    When using `pandas.DataFrame`, the first column will be selected as a source.
    |

    | `index` (`int`) | Preselected option index on first render. |

    | `default` (`[str]` or `None`) | Default values. |

    | `format_func` (`function`) | Auxiliary function used to modify the selection
    labels. The `str` values for the labels are passed as arguments, and it returns
    a modified `str` as per the function logic. This option is purely cosmetic and
    has no impact in the operation or return values of the widget. |

    | `key` (`str` or `int`) | Unique key, string or integer, to reference the button
    in the code. The parameter is optional and will be automatically generated if
    not provided. |

    | `help` (`str`) | Tooltip to be displayed when the cursor is hovered over the
    widget. |

    | `on_change` (`callable`) | Callback function invoked when the widget’s value
    changes. |

    | `args` (`tuple`) | Tuple of arguments to pass to the callback. |

    | `kwargs` (`dict`) | Dictionary of keyword arguments to pass to the callback.
    |

    | `disabled` (`bool`) | Boolean argument used to disable the widget. |


    `![](index-444_1.jpg)`


    The following example shows a multiselect widget with available four options:


    ```python

    options = st.multiselect(''What are your favorite seasons?'', [''Spring'', ''Summer'',
    ''Autumn'', ''Winter''])

    st.write(''You selected: %s'' % '', ''.join(options))

    ```


    ### Slider


    A slider can be added to our websites using the following command:


    `st.slider(label, min_value, max_value, value, step, format, key, help, on_change,
    args, kwargs, disabled=False)` → `value`


    **Table A-27.** `st.slider` parameters


    | Parameter | Description |

    |---|---|

    | `label` (`str`) | Label explaining the use of the slider. |

    | `min_value` (`a supported type` or `None`) | The minimum allowed value. It defaults
    to `0` or `0.0` for `int` and `float`, `value – timedelta(days=14)` for date/datetime
    values, `time.min` if a time. |

    | `max_value` (`a supported type` or `None`) | The maximum allowed value. Defaults
    to `100` or `1.0` for `int` and `float`, `value + timedelta(days=14)` for date/datetime
    values, `time.max` if a time. |

    | `value` (`a supported type` or `a tuple/list of supported types` or `None`)
    | The default value to be used when the widget is first rendered. To use a predefined
    range, a tuple/list should be passed as an argument with the min and max values.
    Defaults to `min_value`. |

    | `step` (`int`/`float`/`timedelta` or `None`) | The stepping interval. By default,
    set to `1` and `0.01` for `int` and `float`, `timedelta(days=1)` for date/datetime
    values, `timedelta(minutes=15)` if a time (or if `max_value – min_value < 1 day`).
    |

    | `format` (`str` or `None`) | A custom format string that specifies how the interface
    should render numbers in a printf-style format. The return value is not affected
    by the conversion. `%d`, `%e`, `%f`, `%g`, and `%i` are supported for formatting
    `int`/`float` values. For date/time/datetime formatting, use Moment.js syntax:
    [https://momentjs.com/docs/#/displaying/format/](https://momentjs.com/docs/#/displaying/format/).
    |

    | `key` (`str` or `int`) | Unique key, string or integer, to reference the button
    in the code. The parameter is optional and will be automatically generated if
    not provided. |

    | `help` (`str`) | Tooltip to be displayed when the cursor is hovered over the
    widget. |

    | `on_change` (`callable`) | Callback function invoked when the widget’s value
    changes. |

    | `args` (`tuple`) | Tuple of arguments to pass to the callback. (continued) |'
